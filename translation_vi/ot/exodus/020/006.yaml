  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: vi
  text: nhưng ban tình yêu thành tín cho hàng ngàn[a], cho những người yêu mến Ta và vâng giữ các điều răn của Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “cho ngàn thế hệ” (so sánh Phục Truyền Luật Lệ Ký 5:10); nguyên văn Hê-bơ-rơ ở đây chỉ nói “cho hàng ngàn.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: nhưng bày tỏ
  rationale: Liên từ וְ trong ngữ cảnh tạo thế tương phản với sự đoán phạt ở câu trước; “nhưng” diễn đạt rõ quan hệ ấy, còn “bày tỏ” chuyển tải tự nhiên phân từ עֹשֶׂה khi đi với חֶסֶד.
- source_word: חֶסֶד
  choice: tình yêu thành tín
  rationale: חֶסֶד chỉ tình yêu nhân từ, bền vững và trung tín trong mối quan hệ giao ước; cách dịch này vừa tự nhiên vừa giữ được chiều sâu của từ hơn các lựa chọn hẹp như “lòng thương xót”.
- source_word: לַאֲלָפִים
  choice: đến hàng ngàn người
  rationale: Bản Hê-bơ-rơ chỉ ghi “đến hàng ngàn,” không có danh từ “thế hệ.” Thêm “người” giúp câu tiếng Việt trọn nghĩa trong liên hệ với “những người yêu mến Ta,” nhưng không đưa ý “thế hệ” vào chính văn; cách hiểu theo thế hệ được giữ trong chú thích.
- source_word: לְאֹהֲבַי
  choice: là những người yêu mến Ta
  rationale: Phân từ kèm hậu tố ngôi thứ nhất được diễn đạt tự nhiên bằng mệnh đề quan hệ, chỉ những người có lòng yêu mến Đức Chúa Trời.
- source_word: וּלְשֹׁמְרֵי
  choice: và vâng giữ
  rationale: שׁמר với “các điều răn” mang nghĩa tuân giữ, thực hành; “vâng giữ” là cách nói trang trọng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מִצְוֺתָי
  choice: các điều răn của Ta
  rationale: מִצְוֹת là số nhiều của “điều răn”; cách dịch này giữ đúng sắc thái pháp lý và giao ước trong Mười Điều Răn.
theological_decisions:
- issue: Phạm vi của לַאֲלָפִים
  choice: đến hàng ngàn người
  alternative: đến ngàn thế hệ / đến hàng ngàn thế hệ
  rationale: Câu Hê-bơ-rơ không ghi rõ “thế hệ,” nên chính văn không nhập cách giải thích ấy. Tuy nhiên, sự tương phản với câu trước và câu song song Phục Truyền Luật Lệ Ký 5:10 có thể gợi phạm vi qua nhiều thế hệ; vì vậy cách hiểu này được nêu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Cấu trúc được nối tự nhiên với câu trước, đồng thời giữ chú thích cho sự mơ hồ thật sự của לַאֲלָפִים.
