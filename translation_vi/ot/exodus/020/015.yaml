lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: לֹא kết hợp với thể vị hoàn thành trong văn luật pháp diễn đạt một lệnh cấm trực tiếp. “Không được” chuyển tải rõ sức nặng quy phạm trong tiếng Việt hiện đại.
- source_word: תִּגְנֹב
  choice: trộm cắp
  rationale: Động từ גנב ở đây không có tân ngữ nên giữ nghĩa rộng là lấy trộm, không thu hẹp thành bắt cóc. “Trộm cắp” tự nhiên, trang trọng và bao quát trong tiếng Việt.
theological_decisions:
- issue: Hình thức lệnh cấm trong Mười Điều Răn
  choice: Ngươi không được trộm cắp.
  alternative: Đừng trộm cắp.
  rationale: Cấu trúc לֹא + thể vị hoàn thành là lệnh cấm trực tiếp trong luật giao ước. “Không được” giữ sắc thái pháp lý, trang nghiêm; “đừng” là cách diễn đạt năng động và trực tiếp hơn. Đây là lựa chọn văn phong, không phải quyết định giáo lý.
- issue: Phạm vi của hành vi bị cấm
  choice: Hiểu theo nghĩa rộng là trộm cắp
  alternative: Hiểu riêng là bắt cóc
  rationale: Dù גנב đôi khi có thể chỉ việc bắt cóc tùy ngữ cảnh, câu này không nêu tân ngữ để giới hạn nghĩa. Vì vậy không nên tự ý thu hẹp điều răn.
translation_notes:
  register: Văn phong hiện đại, ngắn gọn và trang nghiêm, phù hợp thể luật giao ước. Đại từ “ngươi” duy trì lối xưng hô trực tiếp, số ít của nguyên văn và nhịp điệu quen thuộc của Mười Điều Răn; chú thích cung cấp cách nói đời thường hơn.
