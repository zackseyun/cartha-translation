  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽ֣א תַעֲשֶׂ֨ה כָל מְלָאכָ֜ה אַתָּ֣ה וּ/בִנְ/ךָֽ֣ וּ/בִתֶּ֗/ךָ עַבְדְּ/ךָ֤ וַ/אֲמָֽתְ/ךָ֙ וּ/בְהֶמְתֶּ֔/ךָ וְ/גֵרְ/ךָ֖ אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: vi
  text: Nhưng ngày thứ bảy là ngày Sa-bát dành cho Yahweh, Đức Chúa Trời của ngươi.[a] Ngươi không được làm bất cứ công việc nào—cả ngươi, con trai hay con gái ngươi, nô lệ nam hay nô lệ nữ của ngươi,[b] súc vật của ngươi, hoặc ngoại kiều đang cư trú trong các thành của ngươi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và ngày thứ bảy.” Liên từ Hê-bơ-rơ có thể mang nghĩa “và” hoặc, theo sự tương phản với sáu ngày làm việc ở câu trước, “nhưng”.'
    reason: lexical_alternative
  - marker: b
    text: Một số bản dịch dùng “đầy tớ nam” và “đầy tớ nữ”; các từ Hê-bơ-rơ ở đây chỉ những người nam và nữ ở địa vị nô lệ trong gia hộ.
    reason: lexical_alternative
  - marker: c
    text: “Ngoại kiều đang cư trú” chỉ người không phải dân bản địa nhưng sống giữa cộng đồng Israel. Nguyên văn là “trong các cổng thành của ngươi”, một cách nói về địa bàn các thành hoặc khu định cư của ngươi.
    reason: cultural_and_lexical_clarification
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: Nhưng ngày thứ bảy
  rationale: Liên từ וְ có thể là “và”, nhưng ở đây “nhưng” diễn đạt tự nhiên sự tương phản với sáu ngày làm việc ở câu trước mà không thay đổi nội dung.
- source_word: שַׁבָּת
  choice: ngày Sa-bát
  rationale: Giữ danh từ chuyên biệt chỉ ngày ngưng nghỉ, thay vì giản lược thành “ngày nghỉ”.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: dành cho Yahweh, Đức Chúa Trời của anh em
  rationale: Giới từ לְ diễn tả quan hệ hiến dành/thuộc về; “dành cho” tự nhiên trong tiếng Việt và giữ ý ngày này được biệt riêng cho Yahweh.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: Anh em không được làm bất cứ công việc nào
  rationale: “Không được” truyền đạt rõ sức mạnh pháp lệnh; “bất cứ công việc nào” giữ phạm vi bao quát của כָל.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: nô lệ nam hay nô lệ nữ của anh em
  rationale: Cặp từ chỉ những người lệ thuộc trong gia hộ; “nô lệ” minh bạch hơn “đầy tớ” về thực trạng xã hội, còn nam/nữ giữ sự phân biệt trong nguyên văn.
- source_word: וּבְהֶמְתֶּךָ
  choice: súc vật của anh em
  rationale: Chỉ chung các động vật thuần dưỡng thuộc gia hộ; “súc vật” là cách nói hiện đại, rộng và tự nhiên.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: ngoại kiều đang cư trú trong các thành của anh em
  rationale: גֵּר là người không thuộc bản địa nhưng cư trú giữa cộng đồng; “trong các thành” chuyển ngữ thành ngữ “trong các cổng” theo nghĩa khu vực thuộc quyền quản trị của thành.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng Danh Giao Ước; phiên âm “Yahweh” giữ đây là danh riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi của lệnh nghỉ Sa-bát trong gia hộ
  choice: 'Giữ rõ từng đối tượng: người nhận lệnh, con cái, nô lệ, súc vật và ngoại kiều cư trú'
  alternative: Khái quát thành toàn thể gia đình hoặc gia hộ
  rationale: Việc liệt kê đầy đủ giữ nguyên phạm vi xã hội rộng của điều răn và không làm nhẹ đi các hạng người lệ thuộc được nguyên văn nêu đích danh.
translation_notes:
  register: Văn phong trang trọng, hiện đại và trực tiếp. Dùng “anh em” cho đại từ số ít giống đực mang tính đại diện trong lời phán với cộng đồng Israel; dùng “không được” để giữ lực của điều cấm. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau phần văn bản liên quan.
