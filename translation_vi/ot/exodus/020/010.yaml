    issue: Ngôi và số của đại từ bị chuyển từ số ít sang số nhiều.
    rationale: אַתָּה, các hậu tố -ךָ trong “con trai/con gái của ngươi”, “nô lệ của ngươi”, “súc vật của ngươi”, và “ngoại kiều của ngươi” đều là số ít giống đực. “Anh em” làm thay đổi đối tượng trực tiếp của lệnh.
  - severity: low
    issue: Chú thích c diễn giải “cổng” hơi quá xác định là “các thành hoặc khu định cư thuộc anh em”.
    rationale: בִּשְׁעָרֶיךָ là thành ngữ chỉ phạm vi địa phương/thẩm quyền của người được ngỏ lời. Có thể giải thích ngắn gọn là “trong các cổng thành của ngươi”, tức trong địa bàn các thành/khu định cư của ngươi, để giữ mối liên hệ với từ ngữ nguyên văn.
