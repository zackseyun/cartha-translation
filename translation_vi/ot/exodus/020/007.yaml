revisions:
- from: Ngươi không được mang danh Yahweh, Đức Chúa Trời của ngươi, một cách giả dối[a], vì Yahweh sẽ không để kẻ mang danh Ngài một cách giả dối khỏi bị trừng phạt.
  to: Ngươi không được mang danh Yahweh, Đức Chúa Trời của ngươi, cách hư dối[a], vì Yahweh sẽ không để kẻ mang danh Ngài cách hư dối thoát khỏi hình phạt.
  rationale: Đổi “một cách giả dối” thành “cách hư dối” để bảo lưu đồng thời sắc thái giả dối và hư không/trống rỗng của שָׁוְא. Giữ sự lặp lại “mang danh ... cách hư dối” tương ứng với hai lần נשא và לַשָּׁוְא trong tiếng Hê-bơ-rơ. Chỉnh mệnh đề cảnh báo cho tự nhiên hơn và chỉnh chú thích để diễn đạt chính xác hơn lối dịch truyền thống cùng nghĩa đen rộng của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:16:41Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng Yahweh, ngôi thứ hai số ít, động từ נשא lặp lại bằng “mang”, và quan hệ cảnh báo của mệnh đề sau. Tuy nhiên, “một cách giả dối” nghiêng quá mạnh về nghĩa falsehood/deception của לַשָּׁוְא và chưa giữ tốt khía cạnh trống rỗng, hão huyền/vô ích. “Cách hư dối” bao quát hơn mà vẫn tự nhiên trong văn phong trang trọng.
  naturalness: “Mang danh” và “ngươi” phù hợp với điều răn ở văn phong hiện đại-trang trọng. Cấu trúc “không để ... khỏi bị trừng phạt” hơi nặng; “không để ... thoát khỏi hình phạt” tự nhiên, rõ ràng và giữ lực tư pháp của יְנַקֶּה.
  terminology: Giữ “Yahweh”, “Đức Chúa Trời”, “danh”, và đại từ tôn kính “Ngài”. Chú thích được chỉnh để không gán cho lối dịch truyền thống ý “làm [danh] vô ích”, đồng thời giải thích đúng hơn phạm vi của cụm Hê-bơ-rơ.
