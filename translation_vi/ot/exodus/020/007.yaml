  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: vi
  text: Ngươi không được mang danh Yahweh, Đức Chúa Trời của ngươi, cách hư dối[a], vì Yahweh sẽ không để kẻ mang danh Ngài cách hư dối thoát khỏi hình phạt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách dịch truyền thống: “Ngươi không được lấy danh Yahweh, Đức Chúa Trời của ngươi, cách vô ích.” Nguyên văn Hê-bơ-rơ có nghĩa đen là “mang danh ... cho điều hư không”; ý này rộng hơn, có thể bao gồm thề gian, viện dẫn danh Ngài cách trống rỗng, hoặc đại diện sai trái cho Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: mang / mang
  rationale: Động từ נשא có nghĩa cơ bản là nâng, mang, gánh. “Mang danh” vừa tự nhiên trong tiếng Việt, vừa giữ được hình ảnh cụ thể và sự lặp lại giữa mệnh lệnh với lời cảnh báo; cách dịch này cũng không thu hẹp ý nghĩa chỉ còn việc phát ngôn.
- source_word: שֵׁם
  choice: danh
  rationale: “Danh” phù hợp với văn phong trang trọng và bao hàm tên gọi, uy tín, căn tính được bày tỏ cùng quyền đại diện gắn với Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ nguyên tính chất danh xưng cá nhân thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Giữ ngôi thứ hai số ít và sắc thái giao ước trực tiếp của nguyên văn.
- source_word: לַשָּׁוְא
  choice: một cách giả dối
  rationale: שָׁוְא có trường nghĩa gồm hư không, vô ích, giả dối và sai trái. “Một cách giả dối” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt; chú thích bảo lưu phạm vi rộng hơn của từ Hê-bơ-rơ.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho điều răn một cách trực tiếp và tự nhiên.
- source_word: יְנַקֶּה (נקה)
  choice: sẽ không để ... khỏi bị trừng phạt
  rationale: 'Dạng piel ở đây mang ý nghĩa tư pháp: không tuyên vô tội, không miễn trách nhiệm hoặc hình phạt. Cách dịch này rõ ràng với độc giả hiện đại.'
- source_word: אֲשֶׁר
  choice: kẻ
  rationale: Chỉ bất kỳ người nào thuộc trường hợp được mô tả; “kẻ” gọn, tự nhiên trong lời cảnh báo và không thêm giới tính.
- source_word: שְׁמוֹ
  choice: danh Ngài
  rationale: Quy chiếu rõ về danh Yahweh; “Ngài” giữ sắc thái tôn kính trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của lệnh cấm liên quan đến danh Yahweh
  choice: Lệnh cấm rộng, chống việc mang danh Yahweh cách giả dối, trống rỗng hoặc sai trái, chứ không chỉ cấm lời nói bất kính thông thường.
  alternative: Chỉ cấm thề gian; hoặc chỉ cấm phát ngôn báng bổ và tục hóa danh Đức Chúa Trời.
  rationale: Sự kết hợp giữa נשא (“mang”), שֵׁם (“danh”) và שָׁוְא (“hư không/giả dối”) có thể bao gồm thề gian, viện dẫn danh Ngài cách trống rỗng và đại diện sai trái cho Ngài. Bản dịch chính giữ động từ “mang”, còn chú thích nêu rõ độ rộng ngữ nghĩa.
- issue: Cách chuyển dịch danh YHWH
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Dùng danh riêng “Yahweh” để phản ánh trực tiếp יהוה và tránh thay danh riêng bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Ngươi” giữ lời phán ở ngôi thứ hai số ít của điều răn; “không được” tự nhiên hơn lối cổ “chớ”. “Mang danh” giữ hình ảnh Hê-bơ-rơ mà vẫn là một thành ngữ dễ hiểu trong tiếng Việt.
