  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: vi
  text: Ngươi không được sấp mình trước chúng, cũng không được phụng sự chúng[a], vì Ta, Yahweh Đức Chúa Trời của ngươi, là Đức Chúa Trời ghen tương, truy xét tội lỗi của cha ông trên con cháu, đến thế hệ thứ ba và thứ tư của những kẻ ghét Ta[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thờ phụng chúng”; động từ này chỉ sự phục vụ mang tính thờ phượng đối với thần tượng trong ngữ cảnh này.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “truy xét tội lỗi của cha ông trên con cháu.” Cách nói này giữ nguyên thành ngữ Hê-bơ-rơ; xin so sánh Phục Truyền Luật Lệ Ký 24:16 và Ê-xê-chi-ên 18 về trách nhiệm cá nhân.'
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể hiểu: “đến thế hệ thứ ba và thứ tư của những kẻ ghét Ta.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: sấp mình trước
  rationale: Giữ hình ảnh cụ thể của hành động cúi rạp mình để tỏ lòng tôn kính, đồng thời phân biệt với động từ 'phụng sự' theo sau.
- source_word: תָעָבְדֵם
  choice: phụng sự chúng
  rationale: עבד cơ bản có nghĩa là phục vụ; trong ngữ cảnh thần tượng, từ này chỉ sự phục vụ mang tính thờ phượng. 'Phụng sự' vừa tự nhiên trong văn cảnh tôn giáo vừa giữ được nét riêng so với hành động sấp mình.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Diễn đạt trực tiếp cấu trúc sở hữu ngôi thứ hai số ít trong lời giao ước.
- source_word: אֵל קַנָּא
  choice: Đức Chúa Trời ghen tương
  rationale: Trong ngữ cảnh cấm thờ thần tượng, קַנָּא diễn tả quyền đòi hỏi lòng trung thành độc nhất của Đức Chúa Trời; 'ghen tương' giữ nguyên sức căng của từ nguồn.
- source_word: פֹּקֵד
  choice: truy xét
  rationale: Diễn tả sự xem xét chủ động và đáp ứng theo công lý của Đức Chúa Trời mà không thu hẹp nghĩa thành riêng hành động 'trừng phạt'.
- source_word: עֲוֺן
  choice: tội lỗi
  rationale: Cách nói phổ thông, có sức nặng đạo đức và trong cấu trúc này có thể bao quát hành vi sai trái cùng trách nhiệm phát sinh từ đó.
- source_word: אָבֹת
  choice: cha ông
  rationale: Giữ sắc thái giống đực và chiều kích tổ tiên của danh từ số nhiều, tự nhiên hơn 'các người cha' trong công thức liên thế hệ.
- source_word: בָּנִים
  choice: con cháu
  rationale: Trong công thức về nhiều thế hệ, từ này chỉ hậu duệ chứ không chỉ riêng con trai; 'con cháu' chuyển đạt rõ phạm vi ấy.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: đến đời thứ ba và đời thứ tư
  rationale: Bổ sung 'đời' để làm rõ các số thứ tự tỉnh lược chỉ những thế hệ kế tiếp, phù hợp cách diễn đạt tự nhiên của tiếng Việt.
- source_word: לְשֹׂנְאָי
  choice: những kẻ ghét Ta
  rationale: Giữ nguyên lực quan hệ mạnh của động từ 'ghét' và sự mơ hồ cú pháp về việc cụm từ này liên hệ với các thế hệ được nói đến.
theological_decisions:
- issue: Cách diễn đạt sự ghen tương của Đức Chúa Trời
  choice: Đức Chúa Trời ghen tương
  alternative: Đức Chúa Trời đầy nhiệt thành
  rationale: Văn cảnh là lòng trung thành độc nhất trong giao ước. 'Ghen tương' giữ quyền đòi hỏi chính đáng ấy và không làm nhẹ đi sức căng thần học của bản văn.
- issue: Cách diễn đạt sự phán xét liên thế hệ
  choice: truy xét tội lỗi của cha ông nơi con cháu đến đời thứ ba và đời thứ tư
  alternative: trừng phạt con cháu vì tội lỗi của cha ông đến đời thứ ba và đời thứ tư
  rationale: '''Truy xét ... nơi'' giữ thành ngữ Hê-bơ-rơ và không quyết định quá mức cơ chế hay mức độ quy trách nhiệm; nhờ đó bản dịch bảo tồn sức căng với các bản văn nói về trách nhiệm cá nhân.'
- issue: Phạm vi của לְשֹׂנְאָי
  choice: dùng dấu gạch ngang trước 'những kẻ ghét Ta' để giữ khả năng cụm từ mô tả dòng người qua các thế hệ
  alternative: của những kẻ ghét Ta
  rationale: Cú pháp Hê-bơ-rơ cho phép hiểu cụm này gắn với các thế hệ thuộc về những người ghét Đức Chúa Trời. Dấu gạch ngang tránh áp đặt một quan hệ sở hữu thiếu tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong trang nghiêm, trực tiếp và dễ hiểu. Dùng cặp đại từ giao ước 'Ta—ngươi' để phản ánh lời phán ở ngôi thứ hai số ít. 'Yahweh' giữ danh riêng; 'Đức Chúa Trời' là danh xưng quen thuộc trong tiếng Việt. Cấu trúc và dấu câu ưu tiên sự tự nhiên nhưng không xóa bỏ tính mơ hồ của mệnh đề cuối.
