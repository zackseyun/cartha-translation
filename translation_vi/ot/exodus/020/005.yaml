revisions:
- from: Ngươi không được sấp mình trước chúng, cũng không được phụng sự chúng[a], vì Ta, Yahweh Đức Chúa Trời của ngươi, là Đức Chúa Trời ghen tương, truy xét tội lỗi của cha ông nơi con cháu đến đời thứ ba và đời thứ tư—những kẻ ghét Ta[b][c].
  to: Ngươi không được sấp mình trước chúng, cũng không được phụng sự chúng[a], vì Ta, Yahweh Đức Chúa Trời của ngươi, là Đức Chúa Trời ghen tương, truy xét tội lỗi của cha ông trên con cháu, đến thế hệ thứ ba và thứ tư của những kẻ ghét Ta[b][c].
  rationale: Bản sửa thay «nơi con cháu» bằng «trên con cháu» để phản ánh trực tiếp giới từ עַל mà không biến thành khẳng định diễn giải «trừng phạt». Cụm cuối được nối theo cách tiếng Việt tự nhiên, vẫn để ngỏ các câu hỏi rộng hơn về phán xét liên thế hệ. Chú thích a được chỉnh để khớp chính xác với từ «phụng sự» mà nó đánh dấu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:16:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phân biệt đúng hai động từ Hê-bơ-rơ: hành động cúi/sấp mình (תשתחוה) và sự phụng sự mang tính tế tự (תעבדם). Danh Yahweh, cách xưng hô Ta—ngươi, và cách dịch «Đức Chúa Trời ghen tương» đều phù hợp. Tuy nhiên, «truy xét ... nơi con cháu» làm yếu quan hệ «trên/đến trên» (עַל) trong thành ngữ gốc; nên dùng «trên con cháu». Mệnh đề cuối nên gắn rõ mà vẫn không giải quyết quá mức phạm vi cú pháp đang được tranh luận.'
  naturalness: Văn phong trang nghiêm và nhìn chung tự nhiên. «Sấp mình trước» và «phụng sự» giữ được sự phân biệt từ vựng cần thiết. «Trên con cháu, đến thế hệ thứ ba và thứ tư của những kẻ ghét Ta» tự nhiên và rõ hơn cách đặt dấu gạch ngang sau «đời thứ tư».
  terminology: «Yahweh», «Đức Chúa Trời», «ghen tương», «tội lỗi», «cha ông», và «con cháu» nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. Không nên đổi «ghen tương» thành cách diễn giải như «đầy nhiệt thành», cũng không nên đổi «truy xét» thành «trừng phạt».
  issues:
  - severity: medium
    issue: Giới từ «nơi con cháu» không phản ánh sát עַל.
    rationale: עַל trong công thức này đặt việc «truy xét tội lỗi của cha ông» trên con cháu. «Nơi» dễ chuyển nghĩa sang địa điểm/đối tượng khảo xét, thay vì giữ thành ngữ phán xét trong bản gốc.
  - severity: low
    issue: Dấu gạch ngang trước «những kẻ ghét Ta» khiến liên hệ cú pháp kém rõ trong tiếng Việt.
    rationale: Cụm לְשֹׂנְאָי được đặt sau cụm các thế hệ. Cách «đến thế hệ thứ ba và thứ tư của những kẻ ghét Ta» phản ánh cách hiểu tự nhiên, đồng thời không nói rõ cơ chế quy trách nhiệm hay vượt quá sức căng của bản văn.
  - severity: low
    issue: Chú thích a hiện gắn với «phụng sự» nhưng không nêu phương án cho động từ được chú thích.
    rationale: Chú thích nên nói rõ «thờ phụng chúng» là phương án dịch của «phụng sự chúng» trong ngữ cảnh tế tự, tránh nhầm với động từ «sấp mình» đứng trước.
  revised_text: Ngươi không được sấp mình trước chúng, cũng không được phụng sự chúng[a], vì Ta, Yahweh Đức Chúa Trời của ngươi, là Đức Chúa Trời ghen tương, truy xét tội lỗi của cha ông trên con cháu, đến thế hệ thứ ba và thứ tư của những kẻ ghét Ta[b][c].
