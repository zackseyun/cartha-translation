base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: vi
  text: Ngươi phải làm cho Ta một bàn thờ bằng đất, và trên đó ngươi phải dâng các lễ toàn thiêu và các lễ vật bình an của ngươi, bầy chiên dê và đàn bò của ngươi. Ở mọi nơi mà Ta khiến danh Ta được nhắc đến[a], Ta sẽ đến với ngươi và ban phước cho ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu là: “Ta công bố danh Ta” hoặc “Ta ghi danh Ta.” Động từ Hê-bơ-rơ ở thể khiến; sắc thái chính xác có thể bao gồm việc công bố, làm cho được tưởng nhớ, hoặc nhắc đến danh Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: một bàn thờ bằng đất
  rationale: Diễn đạt trực tiếp vật liệu làm bàn thờ; tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: תַּעֲשֶׂה לִּי
  choice: Ngươi phải làm cho Ta
  rationale: Thể chưa hoàn thành trong văn cảnh luật lệ mang sắc thái mệnh lệnh; “cho Ta” giữ ý dâng riêng cho Đức Chúa Trời.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: và trên đó ngươi phải dâng
  rationale: Trong ngữ cảnh tế lễ, “dâng” tự nhiên hơn cách dịch máy móc “giết tế”; “trên đó” giữ rõ quy chiếu về bàn thờ.
- source_word: עֹלֹתֶיךָ
  choice: các lễ vật thiêu của ngươi
  rationale: Chỉ loại lễ vật được thiêu trọn trên bàn thờ; giữ thuật ngữ tế tự rõ ràng.
- source_word: שְׁלָמֶיךָ
  choice: các lễ vật bình an của ngươi
  rationale: “Lễ vật bình an” giữ liên hệ của từ Hê-bơ-rơ với sự nguyên vẹn, an lành, không thu hẹp nghĩa chỉ còn sự thông công.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: chiên dê và bò của ngươi
  rationale: צֹאן bao quát gia súc nhỏ, chủ yếu chiên và dê, còn בָּקָר là bò; cách dịch này cụ thể và tránh thu hẹp צֹאן thành riêng chiên.
- source_word: בְּכָל הַמָּקוֹם
  choice: Tại mọi nơi
  rationale: Giữ sắc thái phân bố của cụm từ và phù hợp tự nhiên với một địa điểm thờ phượng.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: Ta khiến danh Ta được tưởng nhớ
  rationale: Giữ dạng khiến khiến của động từ זכר và tác động chủ động của Đức Chúa Trời, đồng thời không giới hạn nghĩa vào việc công bố, ghi chép hay cầu khẩn.
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: Ta sẽ đến với ngươi và ban phước cho ngươi
  rationale: Truyền đạt trực tiếp sự Đức Chúa Trời đến gần và hành động ban phước.
theological_decisions:
- issue: Ý nghĩa hành động của Đức Chúa Trời trong אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: Ta khiến danh Ta được tưởng nhớ
  alternative: Ta công bố danh Ta; Ta ghi danh Ta; Ta khiến danh Ta được nhắc đến
  rationale: Cách dịch chính giữ dạng khiến của nguyên văn và bảo toàn sự mơ hồ chân thực về phương cách Đức Chúa Trời làm cho danh Ngài hiện diện trong ký ức, lời nhắc hay sự công bố, thay vì quyết định thay cho bản văn.
translation_notes:
  register: Văn phong trang trọng, dễ hiểu. Đại từ “Ngươi/Ta” duy trì lời phán trực tiếp và tính uy nghiêm; các thuật ngữ tế lễ được diễn đạt nhất quán, không gắn với truyền thống hệ phái riêng.
