- from: Ngươi phải làm cho Ta một bàn thờ bằng đất, và trên đó ngươi phải dâng các lễ vật thiêu cùng các lễ vật bình an của ngươi, tức là chiên dê và bò của ngươi. Tại mọi nơi Ta khiến danh Ta được tưởng nhớ[a], Ta sẽ đến với ngươi và ban phước cho ngươi.
  to: Ngươi phải làm cho Ta một bàn thờ bằng đất, và trên đó ngươi phải dâng các lễ toàn thiêu và các lễ vật bình an của ngươi, bầy chiên dê và đàn bò của ngươi. Ở mọi nơi mà Ta khiến danh Ta được nhắc đến[a], Ta sẽ đến với ngươi và ban phước cho ngươi.
