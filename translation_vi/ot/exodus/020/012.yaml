  text: כַּבֵּ֥ד אֶת אָבִ֖י/ךָ וְ/אֶת אִמֶּ֑/ךָ לְמַ֨עַן֙ יַאֲרִכ֣וּ/ן יָמֶ֔י/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: vi
  text: Hãy hiếu kính cha mẹ ngươi, để ngươi được sống lâu[b] trên miền đất[a] mà Yahweh, Đức Chúa Trời của ngươi, đang ban cho ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong miền đất.” Giới từ Hê-bơ-rơ có nghĩa đen là “trên,” nhưng trong cách diễn đạt tự nhiên cũng có thể hiểu là “trong miền đất.”
    reason: lexical_alternative
  - marker: b
    text: Theo thành ngữ Hê-bơ-rơ, nghĩa đen là “những ngày của ngươi được kéo dài”; ý nói sống lâu.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: hiếu kính
  rationale: Động từ Piel ở thể mệnh lệnh đòi hỏi người nghe coi cha mẹ là đáng trọng và đối xử với họ cách xứng đáng. “Hiếu kính” là cách nói tự nhiên, trang trọng trong tiếng Việt khi đối tượng là cha mẹ, và mạnh hơn việc chỉ có thái độ “kính trọng” trong lòng.
- source_word: אָבִיךָ וְאֶת־אִמֶּךָ
  choice: cha mẹ ngươi
  rationale: Cách gộp tự nhiên trong tiếng Việt vẫn bao gồm rõ cả cha lẫn mẹ; “ngươi” giữ lời xưng hô số ít trực tiếp của điều răn.
- source_word: לְמַעַן
  choice: để
  rationale: Giữ được quan hệ mục đích/kết quả giữa điều răn và lời hứa mà không buộc phải phân định cứng giữa hai sắc thái.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: những ngày đời ngươi được dài lâu
  rationale: Giữ hình ảnh nguyên ngữ về “những ngày” nhưng thêm “đời” để câu tự nhiên và dễ hiểu trong tiếng Việt; chú thích giải thích đây là thành ngữ chỉ việc sống lâu.
- source_word: עַל הָאֲדָמָה
  choice: trên miền đất
  rationale: “Miền đất” diễn đạt אֲדָמָה trong bối cảnh vùng đất được Đức Chúa Trời ban, còn “trên” phản ánh sát giới từ עַל. Chú thích bảo lưu cách hiểu thành ngữ “trong miền đất”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên ngữ thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Cách dịch trang trọng, rõ nghĩa của danh từ kèm hậu tố sở hữu ngôi thứ hai số ít.
- source_word: נֹתֵן לָךְ
  choice: đang ban cho ngươi
  rationale: Dạng phân từ có thể chỉ hành động đang diễn tiến hoặc sắp được thực hiện; “đang ban” giữ phương diện ấy và phù hợp bối cảnh Sinai, khi dân chưa chiếm hữu miền đất.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản văn dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” giữ danh giao ước thay vì thay bằng tước hiệu, đồng thời không khẳng định quá mức một lối phát âm cổ tuyệt đối chắc chắn.
- issue: Phạm vi nghĩa của הָאֲדָמָה
  choice: miền đất
  alternative: đất; mặt đất; trái đất
  rationale: Mệnh đề “mà ... đang ban cho ngươi” trong bối cảnh giao ước hướng đến vùng đất được ban cho Israel, nhưng bản dịch không thêm từ “hứa” vốn không có trực tiếp trong câu.
- issue: Quan hệ do לְמַעַן biểu thị
  choice: để
  alternative: hầu cho; nhờ đó
  rationale: “Để” bảo lưu khả năng mục đích/kết quả của liên từ, không biến câu thành một công thức máy móc về công trạng hay âm thầm loại bỏ tính chất lời hứa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “ngươi” giữ lối xưng hô trực tiếp, số ít của điều răn và sắc thái giao ước; “hiếu kính” truyền đạt nghĩa tích cực, thực hành của việc tôn trọng cha mẹ. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
