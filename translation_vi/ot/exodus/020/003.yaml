  text: לֹֽ֣א יִהְיֶֽה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/003.yaml
  text: You shall have no other gods before me[a].
translation:
  language: vi
  text: Ngươi không được có các thần khác trước mặt Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngoài Ta” hoặc “trong sự hiện diện của Ta”. Tiếng Hê-bơ-rơ theo nghĩa đen là “trước mặt Ta”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Ngươi không được có
  rationale: Cấu trúc Hê-bơ-rơ theo nghĩa đen là “sẽ không có cho ngươi”, nhưng diễn tả sự sở hữu hay quan hệ đối với người được nói đến. “Ngươi không được có” là tiếng Việt tự nhiên, giữ rõ sức mạnh của điều cấm và ngôi thứ hai số ít.
- source_word: אֱלֹהִים
  choice: các thần
  rationale: Danh từ số nhiều ở đây được bổ nghĩa bằng “khác”, chỉ những thần được xem là đối thủ; “các thần” là cách dịch trực tiếp và thông dụng.
- source_word: אֲחֵרִים
  choice: khác
  rationale: Tính từ có nghĩa là “khác”; không dịch thành “ngoại bang” vì như vậy sẽ thêm một nét nghĩa mà câu Hê-bơ-rơ không nói rõ.
- source_word: עַל פָּנָי
  choice: trước mặt Ta
  rationale: Thành ngữ có nghĩa đen là “trước mặt Ta”. Cách dịch này tự nhiên trong tiếng Việt, đồng thời giữ được cả sắc thái hiện diện và hàm ý độc quyền mà không thu hẹp câu vào một cách giải thích duy nhất.
theological_decisions:
- issue: Ý nghĩa của עַל פָּנָי trong điều răn thứ nhất
  choice: trước mặt Ta
  alternative: ngoài Ta; trong sự hiện diện của Ta
  rationale: Thành ngữ Hê-bơ-rơ có thể nói đến sự hiện diện (“trước mặt Ta/trong sự hiện diện của Ta”) và trong bối cảnh giao ước cũng hàm ý tính độc quyền (“ngoài Ta”). Bản chính giữ lối diễn đạt sát hình ảnh nguyên văn; chú thích bảo tồn các cách hiểu khả dĩ.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “Ngươi” để giữ lời phán trực tiếp ở ngôi thứ hai số ít; viết hoa “Ta” vì người nói là Đức Chúa Trời. Cụm “không được” truyền đạt tự nhiên lực cấm đoán của điều răn.
