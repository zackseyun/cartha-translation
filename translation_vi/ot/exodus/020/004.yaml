source:
  edition: WLC
  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: vi
  text: Ngươi không được làm cho mình một tượng khắc[a], hay bất cứ hình tượng[b] nào về bất cứ vật gì trên trời cao, trên đất bên dưới, hoặc trong nước dưới đất[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tượng chạm khắc.” Từ Hê-bơ-rơ chỉ cụ thể một hình tượng được tạo tác bằng cách khắc; dịch là “thần tượng” sẽ mang tính diễn giải hơn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “hình dạng,” “hình ảnh” hoặc “sự mô tả.”
    reason: lexical_alternative
  - marker: c
    text: 'Câu này mô tả các cõi thọ tạo theo cách hình dung vũ trụ thời cổ: trời ở trên, đất ở bên dưới và nước dưới đất.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה
  choice: Ngươi không được làm
  rationale: Thể vị hoàn thành chưa trọn Qal ngôi hai số ít đi với לֹא diễn đạt lệnh cấm trực tiếp. “Không được làm” giữ rõ sắc thái luật lệ trong tiếng Việt hiện đại.
- source_word: לְךָ
  choice: cho mình
  rationale: Đại từ ở dạng gián tiếp chỉ lợi ích hay liên hệ cá nhân; “cho mình” tự nhiên và giữ sắc thái phản thân.
- source_word: פֶסֶל
  choice: tượng chạm
  rationale: Danh từ chỉ một hình tượng được tạo tác bằng cách chạm hoặc khắc. “Tượng chạm” sát nghĩa hơn “thần tượng,” vốn đã diễn giải mục đích tôn giáo.
- source_word: וְכָל תְּמוּנָה
  choice: hay bất cứ hình tượng nào
  rationale: תְּמוּנָה có thể chỉ hình dạng, hình ảnh hoặc vật biểu trưng. “Hình tượng” giữ phạm vi khá rộng và phù hợp với một vật được tạo ra, còn “hay” diễn đạt tự nhiên quan hệ liệt kê mang tính lựa chọn trong lệnh cấm.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: của vật ở trên trời cao
  rationale: Cách dịch giữ mệnh đề quan hệ và sự đối xứng không gian giữa phía trên, phía dưới và dưới đất; “trời” là cách diễn đạt tự nhiên trong tiếng Việt dù danh từ Hê-bơ-rơ có hình thức số nhiều.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: trên đất bên dưới
  rationale: Giới từ בְּ trong ngữ cảnh này được diễn đạt tự nhiên là “trên đất”; “bên dưới” giữ thế tương phản theo chiều dọc với “trên trời cao” mà không biến cụm từ thành “ở dưới lòng đất.”
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: hoặc trong nước dưới đất
  rationale: 'Cách dịch bảo tồn hình ảnh không gian của nguyên văn và hoàn tất ba cõi được kể: trời, đất và nước dưới đất.'
theological_decisions:
- issue: Phạm vi lệnh cấm trong điều răn
  choice: Dịch trực tiếp “tượng chạm” và “bất cứ hình tượng nào,” không thêm “để thờ” cũng không đổi thành “thần tượng.”
  alternative: Có thể hiểu đây là lệnh cấm tuyệt đối mọi hình ảnh, hoặc chỉ là lệnh cấm làm hình tượng dùng trong việc thờ phượng.
  rationale: Câu Hê-bơ-rơ tự nó nêu việc làm tượng chạm hay hình tượng và liệt kê các cõi thọ tạo; câu kế tiếp mới nói đến cúi lạy và phụng thờ. Bản dịch vì thế không thu hẹp hay mở rộng lệnh cấm bằng từ ngữ không có trong câu, nhờ đó giữ nguyên sức căng thần học của văn bản.
translation_notes:
  register: Văn phong trang trọng, trực tiếp, dễ hiểu trong tiếng Việt hiện đại. Đại từ “ngươi” giữ giọng xưng hô số ít và sắc thái long trọng của Mười Điều Răn; cấu trúc câu tránh từ cổ khó hiểu và không thêm mục đích thờ phượng vốn chỉ được nêu rõ ở câu tiếp theo.
