source:
  edition: WLC
  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: vi
  text: Vì trong sáu ngày, Yahweh đã làm nên trời, đất, biển cùng mọi vật trong đó, rồi Ngài nghỉ vào ngày thứ bảy.[a] Vì thế, Yahweh ban phước cho ngày sa-bát và thánh hóa ngày ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài ngừng làm việc.” Động từ Hê-bơ-rơ có thể nhấn mạnh việc an nghỉ hoặc chấm dứt công việc.'
    reason: Bảo lưu sắc thái từ vựng của וַיָּנַח và tránh hàm ý rằng Đức Chúa Trời nghỉ vì mệt.
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lý do làm nền tảng cho mệnh lệnh giữ ngày sa-bát ở câu trước.
- source_word: שֵׁשֶׁת יָמִים
  choice: trong sáu ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian mà công việc sáng tạo được thực hiện.
- source_word: עָשָׂה
  choice: đã làm nên
  rationale: Giữ nghĩa rộng của động từ ‘làm, tạo nên’ và phù hợp với các đối tượng được liệt kê.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: trời, đất
  rationale: Cặp từ tiếng Việt quen thuộc và tự nhiên, diễn đạt toàn thể cõi tạo thành mà không cần ép hình thức số nhiều của tiếng Hê-bơ-rơ.
- source_word: הַיָּם
  choice: biển
  rationale: Phản ánh danh từ số ít trong nguyên văn.
- source_word: כָּל אֲשֶׁר בָּם
  choice: mọi vật trong đó
  rationale: Bao quát tất cả những gì ở trong trời, đất và biển; đại từ ‘đó’ có thể quy chiếu tự nhiên đến toàn bộ danh sách.
- source_word: וַיָּנַח
  choice: rồi Ngài nghỉ
  rationale: Diễn đạt nghĩa nghỉ/ngưng sau công việc, đồng thời giữ cách nói quen thuộc trong bối cảnh ngày sa-bát; chú thích bảo lưu nghĩa ‘ngừng làm việc’.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: vào ngày thứ bảy
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Nêu rõ kết luận rút ra từ khuôn mẫu sáng tạo và nghỉ ngơi.
- source_word: בֵּרַךְ
  choice: ban phước cho
  rationale: Cách kết hợp từ tự nhiên trong tiếng Việt khi Đức Chúa Trời ban phước trên một ngày.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: và thánh hóa ngày ấy
  rationale: Giữ hành động khiến ngày đó được biệt riêng làm thánh và thể hiện rõ đối tượng của hậu tố đại từ.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm ‘Yahweh’ bảo tồn danh riêng thay vì thay thế bằng tước hiệu.
- issue: Sự nghỉ ngơi của Đức Chúa Trời vào ngày thứ bảy
  choice: Ngài nghỉ
  alternative: Ngài ngừng làm việc
  rationale: ‘Nghỉ’ phù hợp trực tiếp với נוח và mạch văn ngày sa-bát, nhưng không nhất thiết hàm ý mệt mỏi; chú thích giữ nghĩa khả dĩ nhấn mạnh việc chấm dứt công việc.
- issue: Ý nghĩa của וַיְקַדְּשֵׁהוּ
  choice: thánh hóa ngày ấy
  alternative: làm cho ngày ấy nên thánh
  rationale: Cả hai đều phản ánh việc Đức Chúa Trời biệt riêng ngày sa-bát làm thánh; ‘thánh hóa’ ngắn gọn, trang trọng và không thêm nội dung hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘Ngài’ để quy chiếu Yahweh, ‘ngày sa-bát’ là thuật ngữ quen thuộc. Dấu chú thích được đặt ngay sau mệnh đề ‘Ngài nghỉ vào ngày thứ bảy’, là vị trí phù hợp với nội dung chú thích trong nguyên ngữ.
