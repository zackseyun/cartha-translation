  text: וַ/יַּ֨עַשׂ ל֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וַ/יַּ֧עַשׂ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/012.yaml
  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: vi
  text: Ông làm cho bàn một khung[a] rộng một bàn tay chạy quanh, rồi làm một gờ viền bằng vàng[b] chạy quanh khung ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gờ” hoặc “viền”.
    reason: lexical_alternative
  - marker: b
    text: 'Theo lối dịch truyền thống: “vành miện bằng vàng”; ở đây “gờ viền” chỉ dải viền trang trí chạy quanh khung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: khung
  rationale: Danh từ này chỉ bộ phận bao quanh bàn; “khung” vừa tự nhiên trong tiếng Việt hiện đại vừa giữ được sắc thái kết cấu. Các khả năng “gờ” hoặc “viền” được ghi ở chú thích.
- source_word: טֹפַח
  choice: rộng một bàn tay
  rationale: Đây là đơn vị đo dựa trên bề rộng bàn tay. Thêm “rộng” làm rõ phương diện được đo theo ngữ cảnh chế tác mà không làm thay đổi ý nghĩa.
- source_word: סָבִיב
  choice: chạy quanh
  rationale: Diễn đạt tự nhiên một bộ phận kéo dài bao quanh vật thể; từ này xuất hiện ở cả hai vế.
- source_word: זֵר
  choice: gờ viền
  rationale: Trong ngữ cảnh các vật dụng của Đền Tạm, từ này chỉ một dải viền nhô lên hoặc có tính trang trí. “Gờ viền” tránh khiến độc giả hiểu theo nghĩa chiếc vương miện rời.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt vàng là vật liệu làm nên gờ viền.
- source_word: לְמִסְגַּרְתּוֹ
  choice: quanh khung ấy
  rationale: Cách dịch này giữ mối liên hệ giữa gờ viền và khung vừa nhắc đến, đồng thời phù hợp với סָבִיב và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để tiếp nối chủ thể Bết-sa-lê-ên trong mạch văn; thêm “bàn” thay cho đại từ vô nhân xưng của tiếng Hê-bơ-rơ để câu tiếng Việt rõ nghĩa. “Một bàn tay” được giữ như đơn vị đo cổ, không đổi sang đơn vị hiện đại.
