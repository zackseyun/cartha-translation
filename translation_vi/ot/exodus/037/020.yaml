translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chân đèn” theo cách gọi quen thuộc của đồ dùng nơi thánh; giữ đại từ số ít “nó” vì các hậu tố giống cái số ít quy chiếu về chân đèn.
