  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: vi
  text: Trên chân đèn có bốn chén hình hoa hạnh nhân,[a] với các núm và hoa của nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bốn chén hình hạnh nhân, với các nụ và hoa của nó.”'
    reason: “Hình hoa hạnh nhân” diễn đạt rõ tính trang trí của מְשֻׁקָּדִים. כַּפְתֹּר có thể được hiểu theo hình tượng thực vật là “nụ”, nhưng nghĩa trực tiếp hơn là các núm trang trí.
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: Trên chân đèn có
  rationale: Giới từ ב־ chỉ vị trí trên chân đèn; cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy các chi tiết trang trí gắn trên chân đèn.
- source_word: אַרְבָּעָה
  choice: bốn
  rationale: Số đếm trực tiếp bổ nghĩa cho danh từ số nhiều giống đực גְבִעִים.
- source_word: גְבִעִים
  choice: chén
  rationale: Danh từ chỉ các bộ phận trang trí có dạng chén; “chén” vừa sát nghĩa vừa dễ hình dung hơn “bát” trong ngữ cảnh chân đèn.
- source_word: מְשֻׁקָּדִים
  choice: hình hoa hạnh nhân
  rationale: Phân từ này mô tả các chén được tạo theo kiểu hoa hạnh nhân; cách dịch giữ hình ảnh thực vật mà không khẳng định quá mức chi tiết cấu tạo.
- source_word: כַּפְתֹּרֶיהָ
  choice: các nụ của nó
  rationale: כפתור chỉ phần trang trí lồi giống núm; “nụ” phù hợp với toàn bộ mô-típ hoa, nhưng nghĩa “núm” vẫn là một khả năng nên được ghi ở chú thích.
- source_word: וּפְרָחֶיהָ
  choice: và hoa của nó
  rationale: פֶּרַח có nghĩa là hoa hoặc bông hoa; “hoa” là cách nói tự nhiên và kết hợp rõ với “nụ”.
