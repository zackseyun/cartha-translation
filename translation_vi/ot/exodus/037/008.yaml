base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/008.yaml
  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: vi
  text: Một chê-ru-bim ở đầu bên này và một chê-ru-bim ở đầu bên kia; ông làm các chê-ru-bim từ nắp chuộc tội[a], từ hai đầu nắp ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nắp Hòm” hoặc “nắp thi ân”; từ Hê-bơ-rơ kapporet chỉ chiếc nắp bằng vàng của Hòm Giao Ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  choice: chê-ru-bim
  rationale: Dùng thuật ngữ đã quen thuộc trong tiếng Việt cho hữu thể hộ vệ ngai gắn với Hòm Giao Ước, tránh diễn giải suy đoán thành một loại sinh vật có cánh nói chung.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: ở đầu bên này ... ở đầu bên kia
  rationale: Diễn đạt tự nhiên cặp vị trí đối nhau mà vẫn giữ nghĩa không gian của קָצֶה, ‘đầu, mép tận cùng’.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Đây là thuật ngữ chỉ nắp bằng vàng của Hòm Giao Ước, có chức năng nghi lễ liên quan đến việc chuộc tội. Cách dịch này giữ sắc thái nghi lễ; chú thích nêu phương án trung tính và truyền thống khác.
- source_word: עָשָׂה
  choice: ông làm
  rationale: Phản ánh trực tiếp động từ thông dụng עשה mà không thêm sắc thái nghệ thuật không có trong nguyên văn.
- source_word: מִן הַכַּפֹּרֶת
  choice: từ chính nắp chuộc tội
  rationale: Giữ ý các chê-ru-bim được làm từ nắp, tức là gắn liền thành một khối với nắp; ‘chính’ làm rõ quan hệ vật liệu mà giới từ מִן biểu thị trong ngữ cảnh chế tác.
- source_word: מִשְּׁנֵי קְצֹוֹתָיו
  choice: tại hai đầu nắp
  rationale: Nêu rõ vị trí ở hai đầu và thay đại từ bằng ‘nắp’ để tránh mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת trong bối cảnh Đền Tạm
  choice: nắp chuộc tội
  alternative: nắp Hòm; nắp thi ân
  rationale: Thuật ngữ vừa chỉ chiếc nắp cụ thể vừa có ý nghĩa nghi lễ. ‘Nắp chuộc tội’ giữ mối liên hệ nghi lễ mà không biến vật này thành một chiếc ngai theo nghĩa đen; các cách dịch khác được ghi trong chú thích để bảo tồn độ mở của thuật ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc đối xứng ‘bên này ... bên kia’; dùng ‘chê-ru-bim’ như một thuật ngữ vay mượn đã quen thuộc và không đánh dấu số nhiều theo hình thái tiếng Việt.
