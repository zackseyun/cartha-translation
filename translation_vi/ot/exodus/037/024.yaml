  text: כִּכָּ֛ר זָהָ֥ב טָה֖וֹר עָשָׂ֣ה אֹתָ֑/הּ וְ/אֵ֖ת כָּל כֵּלֶֽי/הָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: vi
  text: Ông dùng một ta-lâng vàng ròng để làm chân đèn và tất cả các dụng cụ của nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi vật dụng” hoặc “mọi khí cụ của chân đèn.” Từ Hê-bơ-rơ כֵּלִים có nghĩa rộng, chỉ những đồ vật hay dụng cụ gắn với chân đèn.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: một ta-lâng
  rationale: Trong ngữ cảnh chế tác Đền Tạm, từ này chỉ đơn vị trọng lượng. Giữ tên đơn vị cổ “ta-lâng” thay vì quy đổi sang đơn vị hiện đại không chắc chắn.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt để chỉ vàng tinh khiết dùng làm vật liệu.
- source_word: עָשָׂה
  choice: làm
  rationale: Phản ánh trực tiếp động từ thông dụng “làm/chế tạo”; cấu trúc tiếng Việt đưa vật liệu lên trước để diễn đạt quan hệ của cả cụm một cách rõ ràng.
- source_word: אֹתָהּ
  choice: chân đèn
  rationale: Đại từ giống cái số ít quy chiếu về chân đèn ở văn cảnh trước. Lặp lại danh từ giúp câu tiếng Việt rõ nghĩa và tự nhiên hơn dùng “nó” ở vị trí này.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: và tất cả các dụng cụ của nó
  rationale: כֵּלִים là thuật ngữ rộng chỉ những vật dụng, khí cụ hay đồ dùng đi kèm; “các dụng cụ” rõ ràng và phù hợp ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ta-lâng” được giữ như tên một đơn vị trọng lượng cổ; “chân đèn” được nêu rõ theo tiền cảnh để tránh đại từ mơ hồ. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
