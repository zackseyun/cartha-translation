translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để nối với chủ thể Bết-sa-lê-ên trong văn cảnh; lặp “chân đèn” thay cho hậu tố sở hữu nhằm tránh mơ hồ trong một câu đứng riêng. Các chú thích bảo tồn độ rộng nghĩa của hai thuật ngữ kỹ thuật.
