  text: He made its seven lamps[a], its tongs[b], and its firepans of pure gold.
translation:
  language: vi
  text: Ông làm bảy ngọn đèn của chân đèn, các kẹp gắp[a] và các khay[b], tất cả bằng vàng ròng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kéo cắt tim đèn” hoặc “kẹp sửa tim đèn”; từ Hê-bơ-rơ chỉ một dụng cụ dạng kẹp dùng trong việc chăm sóc đèn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “chảo than” hoặc “khay hứng”. Từ Hê-bơ-rơ chỉ một vật chứa nhỏ liên hệ với lửa; trong ngữ cảnh này là đồ dùng kèm theo chân đèn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ wayyiqtol của עשה tiếp nối mạch kể; tiếng Việt tự nhiên có thể dùng động từ quá khứ theo văn cảnh mà không cần biểu thị וַ bằng một liên từ riêng.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: bảy ngọn đèn của chân đèn
  rationale: נֵרוֹת là các ngọn đèn, còn hậu tố giống cái số ít quy chiếu về chân đèn trong văn cảnh. Nêu rõ “chân đèn” giúp tiếng Việt tránh đại từ sở hữu mơ hồ.
- source_word: מַלְקָחֶיהָ
  choice: những kẹp gắp tim đèn
  rationale: Danh từ chỉ dụng cụ dạng kẹp dùng khi chăm sóc đèn; cách dịch này cụ thể và hợp văn cảnh hơn “kẹp” đứng riêng, nhưng vẫn ghi nhận khả năng hiểu là dụng cụ cắt hoặc sửa tim đèn.
- source_word: מַחְתֹּתֶיהָ
  choice: những khay đựng than
  rationale: Từ này chỉ vật chứa hoặc khay hứng dùng với lửa, than hay phần cháy bỏ đi. Trong ngữ cảnh chân đèn, “khay đựng than” giữ được hình ảnh vật dụng mà không chuyển thành lư hương.
- source_word: זָהָב טָהוֹר
  choice: bằng vàng ròng
  rationale: Cụm từ chỉ vật liệu; “vàng ròng” là cách nói tự nhiên, trang trọng và chính xác trong tiếng Việt.
