  verdict: revise
  source_fidelity: 'Bản dự thảo truyền đạt đúng cấu trúc cơ bản của tiếng Hê-bơ-rơ: chủ thể làm, bảy ngọn đèn thuộc chân đèn, các dụng cụ kẹp và các vật chứa, đều bằng vàng ròng. Tuy nhiên, “kẹp gắp tim đèn” thêm đối tượng và công dụng cụ thể hơn điều văn khẳng định; “khay đựng than” cũng quy định rõ chất được đựng, trong khi מַחְתּוֹת chỉ nêu các vật chứa/pan liên hệ với lửa trong ngữ cảnh này.'
