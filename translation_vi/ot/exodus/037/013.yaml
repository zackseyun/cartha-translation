    rationale: Hai cụm giới từ nối tiếp khiến quan hệ giữa các góc và bốn chân bàn kém rõ. Dấu phẩy và “tại” diễn đạt mạch lạc hơn mà vẫn giữ tính không hoàn toàn xác định của Hebrew.
