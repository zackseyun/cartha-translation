  text: He cast four gold rings for it and put the rings on the four corners at its four feet[a].
translation:
  language: vi
  text: Ông đúc cho bàn ấy bốn vòng vàng, rồi đặt các vòng ở bốn góc, tại bốn chân bàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào bốn góc thuộc về bốn chân bàn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: đúc
  rationale: Trong bối cảnh chế tác đồ dùng bằng kim loại, động từ chỉ việc đúc kim loại nóng chảy, không chỉ đơn thuần là rót.
- source_word: לוֹ
  choice: cho bàn ấy
  rationale: Đại từ chỉ về chiếc bàn trong văn cảnh trước; nêu rõ danh từ giúp câu tiếng Việt tự nhiên và tránh dùng đại từ vô tri gượng gạo.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: bốn vòng bằng vàng
  rationale: Diễn đạt trực tiếp số lượng, hình dạng và chất liệu của các vòng dùng để luồn đòn khiêng.
- source_word: וַיִּתֵּן
  choice: gắn
  rationale: Trong ngữ cảnh đặt các vòng kim loại lên đồ nội thất, “gắn” tự nhiên và cụ thể hơn “đặt”, nhưng không thêm phương thức gắn vốn không có trong nguyên văn.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: vào bốn góc
  rationale: פֵּאָה chỉ các đầu mút hoặc góc; với chiếc bàn có bốn vòng, “bốn góc” phù hợp nhất. Giới từ “vào” diễn tả vị trí gắn một cách tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: ở bốn chân bàn
  rationale: Cụm này định vị bốn góc trong tương quan với bốn chân bàn. “Chân bàn” là cách gọi tự nhiên trong tiếng Việt, còn quan hệ chính xác giữa “góc” và “chân” vẫn có thể hiểu theo hơn một cách nên được ghi chú.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bàn ấy” để làm rõ tiền ngữ của đại từ, “chân bàn” theo cách nói tự nhiên trong tiếng Việt, đồng thời giữ lại khả năng hiểu khác của cụm quan hệ cuối câu trong chú thích.
