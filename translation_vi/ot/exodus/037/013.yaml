revisions:
- from: Ông đúc cho bàn ấy bốn vòng bằng vàng, rồi gắn các vòng vào bốn góc ở bốn chân bàn.[a]
  to: Ông đúc cho bàn ấy bốn vòng vàng, rồi đặt các vòng ở bốn góc, tại bốn chân bàn.[a]
  rationale: Đổi “gắn” thành “đặt” để không thêm sắc thái về phương thức cố định; chỉnh cú pháp định vị cho tự nhiên và rõ hơn. Chú thích giữ lại cách hiểu thay thế về quan hệ của “bốn góc” với “bốn chân bàn.”
  reviewer_model: gpt-5.6-terra
