  text: וַ/יָּבֵ֤א אֶת הַ/בַּדִּים֙ בַּ/טַּבָּעֹ֔ת עַ֖ל צַלְעֹ֣ת הָ/אָרֹ֑ן לָ/שֵׂ֖את אֶת הָ/אָרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/005.yaml
  text: And he put the poles into the rings on the sides of the ark, to carry the ark.
translation:
  language: vi
  text: Ông xỏ các đòn khiêng vào những khoen ở hai bên Hòm để khiêng Hòm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: xỏ ... vào
  rationale: Trong kết cấu này, động từ בוא diễn tả việc đưa các đòn xuyên vào khoen. “Xỏ ... vào” tự nhiên và thể hiện rõ động tác mà không làm thay đổi ý nghĩa.
- source_word: הַבַּדִּים
  choice: các đòn khiêng
  rationale: בַּדִּים chỉ những đòn dùng để khiêng đồ thánh. “Đòn khiêng” rõ nghĩa hơn “đòn” khi đứng riêng và phù hợp với tiếng Việt hiện đại.
- source_word: בַּטַּבָּעֹת
  choice: vào những khoen
  rationale: Giới từ ב trong ngữ cảnh này chỉ việc đặt xuyên bên trong các vòng. “Khoen” là cách gọi tự nhiên cho các vòng gắn vào Hòm để luồn đòn khiêng.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: ở hai bên Hòm
  rationale: צְלָעוֹת chỉ các mặt hoặc bên của Hòm; dạng số nhiều trong cấu tạo thực tế hàm ý hai bên. Cách dịch này tự nhiên và không cần dùng thuật ngữ kỹ thuật như “tấm bên”.
- source_word: הָאָרֹן
  choice: Hòm
  rationale: אָרוֹן ở đây là Hòm thánh trong Đền Tạm. “Hòm” là thuật ngữ tiếng Việt rõ ràng; viết hoa để chỉ vật thánh cụ thể đã được xác định trong văn mạch.
- source_word: לָשֵׂאת
  choice: để khiêng
  rationale: Động từ nguyên mẫu נשׂא nêu mục đích của việc xỏ đòn vào khoen. “Để khiêng” ngắn gọn, tự nhiên và chính xác.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để tiếp nối chủ thể Bết-sa-lê-ên trong văn mạch, dù tên không được lặp lại trong câu Hebrew. Không cần chú thích vì câu không có dị bản hay điểm mơ hồ quan trọng cần giải thích.
