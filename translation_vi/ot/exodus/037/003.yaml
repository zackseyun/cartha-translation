  yaml_path: translation/ot/exodus/037/003.yaml
  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: vi
  text: 'Ông đúc cho Hòm bốn khoen vàng, đặt ở bốn chân[a] của Hòm: hai khoen ở một bên và hai khoen ở bên kia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bốn góc” hoặc “bốn điểm tựa”; từ Hê-bơ-rơ có thể chỉ chân, phần tận cùng hoặc điểm đỡ bên dưới.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Ông đúc
  rationale: Trong ngữ cảnh chế tác kim loại, động từ יצק chỉ việc đúc kim loại nóng chảy; “đúc” là cách diễn đạt chính xác và tự nhiên trong tiếng Việt.
- source_word: לוֹ
  choice: cho Hòm
  rationale: Đại từ chỉ về Hòm Giao Ước trong ngữ cảnh trước đó. Lặp lại “Hòm” giúp câu tiếng Việt rõ nghĩa mà không thêm nội dung.
- source_word: טַבְּעֹת זָהָב
  choice: khoen vàng
  rationale: “Khoen” chỉ vòng dùng để xỏ đòn khiêng, phù hợp với đồ dùng Đền Tạm và tự nhiên hơn “nhẫn” hay “vòng” trong ngữ cảnh này.
- source_word: פַּעֲמֹתָיו
  choice: bốn chân của Hòm
  rationale: Danh từ có thể chỉ chân, phần tận cùng hoặc điểm tựa bên dưới. “Chân” là nghĩa trực tiếp, phù hợp với vị trí các khoen, đồng thời giữ phương án khác trong chú thích.
- source_word: צַלְעוֹ
  choice: một bên ... bên kia
  rationale: צלע trong mô tả đồ vật có nghĩa là “bên” hoặc “mặt bên”. Cách diễn đạt này tự nhiên trong tiếng Việt và thể hiện rõ hai phía đối ứng.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: một bên ... bên kia
  rationale: Nguyên văn là “bên thứ nhất ... bên thứ hai”; “một bên ... bên kia” truyền đạt đúng sự phân bố hai khoen ở mỗi phía mà không tạo lối nói gượng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Hòm” theo ngữ cảnh chỉ Hòm Giao Ước; dùng “khoen” cho các vòng vàng để xỏ đòn khiêng. Cấu trúc hai vế giữ sát sự phân bố được nêu trong nguyên văn nhưng tránh lối diễn đạt máy móc “bên thứ nhất ... bên thứ hai”.
