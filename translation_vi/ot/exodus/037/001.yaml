id: EXO.37.1
reference: Exodus 37:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: vi
  text: Bết-sa-lê-ên làm Hòm Giao Ước[a] bằng gỗ keo. Hòm dài hai cu-bít rưỡi[b], rộng một cu-bít rưỡi và cao một cu-bít rưỡi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cái hòm”. Trong ngữ cảnh Đền Tạm, từ Hê-bơ-rơ này chỉ Hòm Giao Ước.'
    reason: lexical_alternative
  - marker: b
    text: Một cu-bít là đơn vị đo chiều dài cổ, xấp xỉ khoảng 45 cm; vì vậy hai cu-bít rưỡi vào khoảng 1,1 m.
    reason: ancient_measurement
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה mang nghĩa thông thường là “làm”; cách dịch này trực tiếp và không thêm sắc thái chế tác vốn không được nêu rõ.
- source_word: בְּצַלְאֵל
  choice: Bết-sa-lê-ên
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: הָאָרֹן
  choice: Hòm Giao Ước
  rationale: אָרוֹן tự thân có thể chỉ một cái hòm, nhưng trong ngữ cảnh Đền Tạm, đây là chiếc hòm thánh đã được xác định; “Hòm Giao Ước” diễn đạt rõ sở chỉ trong tiếng Việt, còn nghĩa rộng hơn được bảo lưu trong chú thích.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm từ chỉ vật liệu làm hòm; “gỗ keo” là cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: hai cu-bít rưỡi
  rationale: Giữ nguyên đơn vị đo cổ thay vì quy đổi thiếu chính xác; trật tự số lượng tự nhiên trong tiếng Việt.
- source_word: אָרְכּוֹ
  choice: dài
  rationale: Trong chuỗi kích thước của một vật thể, “Hòm dài...” tự nhiên hơn “chiều dài của nó...” mà vẫn truyền đạt đầy đủ nghĩa.
- source_word: וְאַמָּה וָחֵצִי
  choice: một cu-bít rưỡi
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên đơn vị cổ.
- source_word: רָחְבּוֹ
  choice: rộng
  rationale: Diễn đạt trực tiếp kích thước ngang của hòm bằng tiếng Việt hiện đại.
- source_word: קֹמָתוֹ
  choice: cao
  rationale: Diễn đạt trực tiếp kích thước thẳng đứng của vật thể.
theological_decisions:
- issue: Cách gọi הָאָרֹן trong ngữ cảnh Đền Tạm
  choice: Hòm Giao Ước
  alternative: cái hòm; Hòm Chứng Ước
  rationale: Danh từ Hê-bơ-rơ chỉ “hòm/rương”, nhưng ngữ cảnh xác định đây là vật thánh trung tâm của Đền Tạm. “Hòm Giao Ước” là cách gọi rõ ràng, quen thuộc và không áp đặt thêm một lập trường thần học; chú thích bảo lưu nghĩa từ vựng rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc gọn “Hòm dài..., rộng... và cao...” để tránh lặp đại từ. Giữ đơn vị “cu-bít” trong chính văn và giải thích gần đúng ở chú thích; viết tên riêng theo dạng phiên âm quen thuộc.
