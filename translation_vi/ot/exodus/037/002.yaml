base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/002.yaml
  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: vi
  text: Ông dát vàng ròng[a] bên trong lẫn bên ngoài, rồi làm một đường viền bằng vàng chạy quanh nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch phần cuối câu là “làm một đường gờ bằng vàng bao quanh nó” hoặc “làm một vành bằng vàng quanh nó.” Từ Hê-bơ-rơ זֵר chỉ phần gờ hay đường viền trang trí chạy quanh đồ vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: Ông dát ...
  rationale: Thể piel của צפה trong ngữ cảnh chế tác chỉ việc phủ bề mặt bằng kim loại; “dát vàng” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cụm từ chỉ vàng tinh khiết; “vàng ròng” trang trọng, dễ hiểu và phù hợp với ngữ cảnh chế tác vật dụng thánh.
- source_word: מִבַּיִת וּמִחוּץ
  choice: bên trong lẫn bên ngoài
  rationale: Diễn đạt rõ hai bề mặt trong và ngoài, đồng thời giữ quan hệ song đôi của nguyên văn.
- source_word: וַיַּעַשׂ לוֹ
  choice: rồi làm ... quanh nó
  rationale: לוֹ quy chiếu về vật được chế tác; cấu trúc tiếng Việt tự nhiên hóa quan hệ này bằng “quanh nó” mà vẫn cho thấy đường viền thuộc về vật ấy.
- source_word: זֵר זָהָב
  choice: một đường viền bằng vàng
  rationale: זֵר ở đây là phần gờ hoặc đường viền trang trí bao quanh đồ vật. “Đường viền” dễ hiểu và không gợi nghĩa vương miện không thích hợp trong ngữ cảnh.
- source_word: סָבִיב
  choice: chạy quanh nó
  rationale: Thể hiện rõ đường viền bao quanh vật ở mọi phía bằng lối diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể nam đã được xác định trong ngữ cảnh gần; “dát vàng” giữ sắc thái kỹ thuật của công việc chế tác.
