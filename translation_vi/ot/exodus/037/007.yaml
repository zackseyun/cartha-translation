  text: וַ/יַּ֛עַשׂ שְׁנֵ֥י כְרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ עָשָׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: vi
  text: Ông làm hai chê-ru-bim bằng vàng, theo lối gò; ông làm chúng từ hai đầu của nắp chuộc tội[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng gọi là “nắp thi ân.” Từ Hê-bơ-rơ chỉ chiếc nắp của Hòm Giao Ước, có liên hệ với nghi thức chuộc tội.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ với waw liên tiếp thuật lại hành động kế tiếp. Không nhất thiết phải dịch liên từ thành “Và” để câu tiếng Việt tự nhiên.
- source_word: שְׁנֵי כְרֻבִים
  choice: hai chê-ru-bim
  rationale: Giữ thuật ngữ vay mượn quen dùng cho các hữu thể có cánh gắn với Hòm Giao Ước, thay vì dùng một từ có thể gợi hình tượng khác.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Danh từ chỉ vật liệu làm nên hai chê-ru-bim; “bằng vàng” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מִקְשָׁה
  choice: bằng kỹ thuật dát búa
  rationale: Từ này chỉ đồ kim loại được tạo hình bằng cách dùng búa đập hoặc dát. Cách dịch này giữ trọng tâm về phương pháp chế tác, không biến hàm ý “liền một khối” thành nghĩa duy nhất.
- source_word: עָשָׂה אֹתָם
  choice: ông làm chúng
  rationale: Giữ sự lặp lại của động từ עשה trong nguyên văn, đồng thời làm rõ rằng mệnh đề sau mô tả cách chế tác hai chê-ru-bim.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: từ hai đầu
  rationale: 'Giữ sắc thái nguồn gốc của giới từ מִן: hai chê-ru-bim được tạo ra từ hai đầu của nắp, thay vì chỉ được đặt tại đó.'
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: כַּפֹּרֶת là nắp bằng vàng của Hòm Giao Ước, có liên hệ với nghi lễ chuộc tội. “Nắp chuộc tội” vừa mô tả vật thể vừa giữ mối liên hệ nghi lễ.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת trong bối cảnh Đền Tạm
  choice: nắp chuộc tội
  alternative: nắp thi ân; nắp Hòm Giao Ước
  rationale: “Nắp chuộc tội” thể hiện cả vật thể là chiếc nắp và mối liên hệ của nó với nghi lễ chuộc tội. “Nắp thi ân” là cách gọi truyền thống nhưng thiên về một cách diễn giải thần học; “nắp Hòm Giao Ước” rõ vật thể hơn nhưng không thể hiện ý nghĩa nghi lễ của thuật ngữ Hebrew.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chê-ru-bim” như thuật ngữ Kinh Thánh quen thuộc; đặt chú thích ngay sau “nắp chuộc tội” vì chú thích giải thích thuật ngữ này.
