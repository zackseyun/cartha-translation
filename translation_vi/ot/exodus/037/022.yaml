  yaml_path: translation/ot/exodus/037/022.yaml
  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: vi
  text: Các nụ và các nhánh của nó đều được làm liền với chân đèn; toàn bộ chân đèn được gò từ một khối vàng ròng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “toàn bộ chân đèn là một tác phẩm được gò nguyên khối bằng vàng ròng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: các nụ
  rationale: Trong ngữ cảnh chân đèn, từ này chỉ chi tiết trang trí tròn thuộc mô-típ hoa; “các nụ” tự nhiên và phù hợp hơn những cách gọi mang tính kiến trúc.
- source_word: וּקְנֹתָם
  choice: và các nhánh
  rationale: קָנֶה vốn có nghĩa là cây sậy hoặc thân cây, nhưng tại đây chỉ các nhánh vươn ra của chân đèn.
- source_word: מִמֶּנָּה הָיוּ
  choice: đều liền một khối với chân đèn
  rationale: Nghĩa đen là “từ nó mà ra”; cách diễn đạt này làm rõ rằng các nụ và nhánh được tạo thành liền với chính chân đèn, không phải các bộ phận gắn thêm.
- source_word: כֻּלָּהּ
  choice: toàn bộ chân đèn
  rationale: Đại từ giống cái số ít quy chiếu về chân đèn; nêu lại danh từ giúp câu tiếng Việt rõ ràng.
- source_word: מִקְשָׁה אַחַת
  choice: một khối ... được dát liền
  rationale: מִקְשָׁה chỉ vật bằng kim loại được làm bằng cách đập hoặc dát, còn אַחַת nhấn mạnh tính thống nhất của toàn thể.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cách nói tiếng Việt tự nhiên và trang trọng, chỉ vàng tinh khiết trong các mô tả về Đền Tạm.
