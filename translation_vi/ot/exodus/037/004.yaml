base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/004.yaml
  text: He made poles of acacia wood and overlaid them with gold.
translation:
  language: vi
  text: Ông làm các đòn khiêng bằng gỗ keo và dát vàng lên chúng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ Qal wayyiqtol của עשה tiếp nối mạch thuật chuyện. Tiếng Việt tự nhiên không cần dịch liên từ וַ־ thành “và” ở đầu câu.
- source_word: בַּדֵּי
  choice: các đòn khiêng
  rationale: Trong ngữ cảnh Đền Tạm, בַּד chỉ những thanh dùng để khiêng vật thánh. “Đòn khiêng” rõ nghĩa và tự nhiên hơn cách gọi chung “thanh”.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm từ cấu tạo chỉ loại gỗ lấy từ cây שִׁטָּה; “gỗ keo” là cách gọi tiếng Việt thông dụng, dễ hiểu.
- source_word: וַיְצַף
  choice: và dát ... lên
  rationale: Trong ngữ cảnh chế tác, צפה diễn tả việc phủ một lớp vật liệu lên bề mặt. “Dát vàng lên” là cách diễn đạt tự nhiên, chính xác trong tiếng Việt.
- source_word: אֹתָם
  choice: chúng
  rationale: Đại từ tân ngữ số nhiều quy chiếu về “các đòn khiêng”; đặt sau “lên” theo cú pháp tự nhiên của tiếng Việt.
- source_word: זָהָב
  choice: vàng
  rationale: Chỉ vật liệu dùng để dát phủ; tiếng Việt không cần thêm giới từ tương ứng với “with” của tiếng Anh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ chủ ngữ “Ông” theo mạch văn, dùng thuật ngữ thủ công quen thuộc “dát vàng” và thuật ngữ chức năng “đòn khiêng”.
