  source_fidelity: 'Bản dịch phản ánh đúng tiếng Hê-bơ-rơ: וַיַּעַשׂ là “Ông làm”; בַּדֵּי chỉ các đòn/cây sào dùng để khiêng; עֲצֵי שִׁטִּים là gỗ keo; và וַיְצַף אֹתָם זָהָב là phủ/dát vàng lên các đòn ấy. Đại từ “chúng” có quy chiếu số nhiều chính xác.'
