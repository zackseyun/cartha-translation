  to: Ông bọc chiếc bàn bằng vàng ròng và làm một gờ viền bằng vàng quanh bàn.[a]
  rationale: Bản sửa giữ nguyên nghĩa gốc và quan hệ “làm cho nó”, đồng thời dùng “gờ viền” để diễn đạt chính xác hơn và tự nhiên hơn bộ phận זֵר. Chú thích bảo tồn các phương án “vành” và cách dịch truyền thống “triều thiên”.
