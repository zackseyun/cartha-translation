  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: vi
  text: Ông bọc chiếc bàn bằng vàng ròng và làm một gờ viền bằng vàng quanh bàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một vành vàng”; theo cách dịch truyền thống: “một triều thiên bằng vàng” quanh bàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף אֹתוֹ
  choice: Ông dát vàng ... lên chiếc bàn
  rationale: Động từ צפה trong bối cảnh chế tác đồ dùng Đền Tạm chỉ việc phủ một lớp kim loại lên vật; “dát vàng” là cách nói tự nhiên và chính xác trong tiếng Việt. Đại từ אֹתוֹ quy chiếu về chiếc bàn ở câu trước, nên lặp lại “chiếc bàn” để câu đứng riêng vẫn rõ nghĩa.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cụm từ chỉ vàng có độ tinh khiết cao; “vàng ròng” trang trọng, tự nhiên và quen thuộc trong tiếng Việt.
- source_word: וַיַּעַשׂ לוֹ
  choice: làm ... cho bàn
  rationale: 'Giữ quan hệ do giới từ ל biểu thị: đường viền được làm cho chiếc bàn. Trong câu dịch, quan hệ này được diễn đạt tự nhiên bằng “chạy quanh bàn”.'
- source_word: זֵר זָהָב
  choice: một đường viền bằng vàng
  rationale: זֵר ở đây có thể chỉ gờ, vành hoặc dải viền trang trí bao quanh đồ vật. “Đường viền” dễ hiểu và không gợi sai nghĩa như cách dịch truyền thống “vương miện”.
- source_word: סָבִיב
  choice: chạy quanh bàn
  rationale: Diễn đạt phạm vi bao quanh toàn bộ bằng tiếng Việt hiện đại, tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể là Bết-sa-lê-ên trong mạch văn trước; lặp lại “chiếc bàn” thay cho đại từ để tránh mơ hồ khi câu được đọc độc lập.
