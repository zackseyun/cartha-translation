base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: vi
  text: Ông làm chân đèn bằng vàng ròng. Ông làm chân đèn theo lối gò bằng búa[a]; chân đế và thân đèn, các chén, các nụ[b] và các hoa đều liền một khối với chân đèn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ chỉ đồ vật bằng kim loại được tạo hình bằng búa; cũng có thể dịch là “được gò bằng búa”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các núm”. Từ Hê-bơ-rơ chỉ những phần trang trí nhô ra; dịch là “các nụ” vì thiết kế chân đèn mang hình dáng thực vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרָה
  choice: chân đèn
  rationale: Chỉ giá đỡ đèn nhiều nhánh dùng trong nơi thánh, chứ không chỉ một ngọn đèn; “chân đèn” là cách gọi tự nhiên và chính xác trong tiếng Việt.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Trong mô tả vật liệu, טָהוֹר nói đến độ tinh khiết; “vàng ròng” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: מִקְשָׁה
  choice: theo lối dát búa
  rationale: Thuật ngữ mô tả kỹ thuật tạo hình kim loại bằng cách dùng búa dát từ một khối, thay vì đúc hoặc ghép các bộ phận riêng.
- source_word: יְרֵכָהּ
  choice: chân đế
  rationale: Nghĩa gốc liên quan đến phần đùi hoặc bên hông, nhưng trong ngữ cảnh đồ dùng này chỉ phần dưới nâng đỡ chân đèn.
- source_word: קָנָהּ
  choice: thân đèn
  rationale: Danh từ số ít ở đây chỉ bộ phận trung tâm của chân đèn; “thân đèn” rõ nghĩa và vẫn phù hợp với hình dáng thực vật của thiết kế.
- source_word: גְּבִיעֶיהָ
  choice: các chén
  rationale: Chỉ những bộ phận trang trí có hình chén; “các chén” sát nghĩa và quen thuộc hơn “các bát” trong ngữ cảnh này.
- source_word: כַּפְתֹּרֶיהָ
  choice: các nụ
  rationale: Từ này chỉ các phần trang trí nhô ra như núm; “nụ” phù hợp với mô-típ thực vật bên cạnh các hoa, nhưng chú thích vẫn giữ khả năng dịch hình thức hơn là “núm”.
- source_word: פְרָחֶיהָ
  choice: các hoa
  rationale: Diễn đạt trực tiếp họa tiết hoa và kết hợp tự nhiên với “các nụ”.
- source_word: מִמֶּנָּה הָיוּ
  choice: đều liền một khối với chân đèn
  rationale: Cụm từ cho biết các bộ phận này được tạo liền với chân đèn, không phải làm riêng rồi gắn vào.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ông làm ... Ông làm
  rationale: Giữ sự lặp lại của động từ עשה trong nguyên văn, đồng thời dùng đại từ tự nhiên theo mạch văn tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Bản dịch giữ hai lần “Ông làm” theo cấu trúc Hê-bơ-rơ, đồng thời dùng các thuật ngữ cụ thể, phổ thông cho kỹ thuật kim hoàn và các bộ phận của chân đèn.
