  text: The rings were beside the frame, as holders for the poles to carry the table.
translation:
  language: vi
  text: Các khoen nằm sát khung viền, làm chỗ luồn đòn để khiêng bàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: sát khung viền
  rationale: לְעֻמַּת chỉ vị trí tương quan gần hoặc ngang với khung; trong ngữ cảnh cấu tạo chiếc bàn, “sát” diễn đạt tự nhiên vị trí các khoen mà không hàm ý đối diện ở khoảng cách xa. הַמִּסְגֶּרֶת là phần khung/viền bao quanh.
- source_word: בָּתִּים לַבַּדִּים
  choice: chỗ luồn đòn
  rationale: Nghĩa đen là “những chỗ chứa cho các đòn”; tiếng Việt tự nhiên mô tả chức năng của khoen là nơi luồn các đòn khiêng.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: để khiêng bàn
  rationale: 'Giữ rõ mục đích của các đòn: dùng để mang/khiêng chiếc bàn.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và gọn; dùng “khoen”, “khung viền”, “đòn” là các thuật ngữ cụ thể, dễ hiểu trong mô tả chế tác Đền Tạm.
