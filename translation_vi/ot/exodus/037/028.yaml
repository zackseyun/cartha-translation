  text: Ông làm các đòn khiêng bằng gỗ keo và bọc vàng chúng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ Qal wayyiqtol của עשה diễn tả hành động nối tiếp trong lời kể. Tiếng Việt có thể lược liên từ mà vẫn giữ mạch quá khứ theo ngữ cảnh.
- source_word: הַבַּדִּים
  choice: các đòn khiêng
  rationale: Trong ngữ cảnh các vật dụng của Đền Tạm, בַּדִּים là những đòn dùng để khiêng vật thánh; “đòn khiêng” rõ nghĩa và tự nhiên hơn chỉ “đòn”.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm danh từ cấu tạo chỉ loại vật liệu; “gỗ keo” là cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: וַיְצַף
  choice: và dát ... lên
  rationale: Trong ngữ cảnh chế tác, צפה nói đến việc phủ một lớp vật liệu lên bề mặt; “dát vàng lên” là cách nói tự nhiên, chính xác trong tiếng Việt.
- source_word: אֹתָם
  choice: chúng
  rationale: Đại từ tân ngữ số nhiều quy chiếu về các đòn khiêng.
- source_word: זָהָב
  choice: vàng
  rationale: Danh từ chỉ vật liệu được dùng để phủ lên các đòn khiêng; kết hợp tự nhiên trong cụm “dát vàng”.
