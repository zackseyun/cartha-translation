  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: vi
  text: Ông làm dầu xức thánh và hương thơm tinh khiết[a], là công việc của một thợ pha chế hương liệu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hương làm từ các chất thơm” hoặc “hương pha hương liệu”. Cụm từ Hê-bơ-rơ nói đến hương được chế từ những chất có mùi thơm.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “sản phẩm do một thợ pha chế hương liệu làm ra.” Sát nghĩa là “công việc của một thợ pha chế”; cụm từ Hê-bơ-rơ nhấn mạnh việc pha chế khéo léo của một người thợ chuyên môn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Dạng wayyiqtol của עשה diễn tả một hành động đã hoàn tất trong mạch kể chuyện; “Ông làm” tự nhiên và phù hợp với chủ thể Bết-sa-lê-ên trong văn cảnh.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: dầu xức thánh
  rationale: Cụm từ chỉ loại dầu dùng để xức và được biệt riêng cho mục đích thánh; cách dịch này gọn, rõ và quen thuộc trong ngữ cảnh thờ phượng.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: hương thơm
  rationale: Nghĩa sát là hương được chế từ các chất thơm. “Hương thơm” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn giữ yếu tố hương liệu.
- source_word: טָהוֹר
  choice: tinh khiết
  rationale: Trong ngữ cảnh vật liệu dùng cho việc thờ phượng, từ này nói đến tính thuần khiết; “tinh khiết” phù hợp hơn “sạch” đối với hương liệu.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: do thợ pha chế thực hiện
  rationale: Cụm danh từ Hê-bơ-rơ nhấn mạnh sản phẩm là công việc của một chuyên gia pha trộn hương liệu. Cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
