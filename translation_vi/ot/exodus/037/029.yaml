translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thợ pha chế” thay cho “người chế nước hoa” vì người thợ trong văn cảnh pha cả dầu xức lẫn hương, không chỉ sản xuất nước hoa. Các dấu chú thích đều được đặt ngay sau thành phần tương ứng.
