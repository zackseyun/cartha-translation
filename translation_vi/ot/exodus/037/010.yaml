source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/שֻּׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: vi
  text: Ông làm chiếc bàn bằng gỗ keo; bàn dài hai cubit, rộng một cubit và cao một cubit rưỡi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ עשה với waw liên tiếp thuật lại một hành động đã xảy ra. “Ông làm” tự nhiên trong tiếng Việt và duy trì chủ thể ngôi thứ ba từ mạch văn.
- source_word: הַשֻּׁלְחָן
  choice: chiếc bàn
  rationale: Danh từ xác định chỉ chiếc bàn trong Đền Tạm; loại từ “chiếc” giúp câu văn tiếng Việt tự nhiên.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm danh từ kết hợp chỉ loại gỗ lấy từ cây keo; “gỗ keo” là cách gọi rõ ràng, hiện đại hơn lối phiên âm cổ.
- source_word: אַמָּתַיִם
  choice: hai cubit
  rationale: Giữ nguyên đơn vị đo cổ đại cubit để tránh đưa vào một phép quy đổi hiện đại không chắc chắn; số đo trong nguyên văn là hai cubit.
- source_word: אָרְכּוֹ
  choice: bàn dài
  rationale: Danh từ kèm hậu tố ngôi thứ ba số ít chỉ chiều dài của chiếc bàn; chuyển thành kết cấu vị ngữ “bàn dài” tự nhiên trong tiếng Việt.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: rộng một cubit
  rationale: Diễn đạt chính xác chiều rộng một cubit bằng cấu trúc song song, gọn và tự nhiên.
- source_word: וְאַמָּה וָחֵצִי
  choice: một cubit rưỡi
  rationale: Đây là cách nói số đo tự nhiên trong tiếng Việt và bảo toàn chính xác giá trị một cubit cộng một nửa.
- source_word: קֹמָתוֹ
  choice: cao
  rationale: Trong phần mô tả một đồ vật, קֹמָה chỉ chiều cao; dùng tính từ vị ngữ “cao” phù hợp văn phong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “cubit” là đơn vị lịch sử. Không dùng chú thích [a] của lớp tham khảo tiếng Anh vì chú thích ấy gắn sau “hai cubit” nhưng lại nói “một cubit rưỡi”; nguyên văn Hê-bơ-rơ xác định rõ chiều dài là hai cubit và chiều cao là một cubit rưỡi.
