  text: He made the poles of acacia wood and overlaid them with gold, to carry the table.
translation:
  language: vi
  text: Ông làm các đòn khiêng bằng gỗ keo và bọc chúng bằng vàng, để khiêng chiếc bàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ với waw liên tiếp thuật lại hành động kế tiếp. Tiếng Việt có thể không dịch liên từ mà vẫn giữ được mạch kể tự nhiên.
- source_word: הַבַּדִּים
  choice: các đòn khiêng
  rationale: Danh từ chỉ những thanh đòn dùng để khiêng đồ thánh. “Đòn khiêng” rõ nghĩa và tự nhiên hơn chỉ nói “đòn”.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm từ cấu tạo chỉ vật liệu là gỗ cây keo; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: rồi bọc vàng
  rationale: Trong ngữ cảnh chế tác, צפה có nghĩa phủ hoặc dát một lớp kim loại lên vật. “Bọc vàng” diễn đạt gọn, rõ; tân ngữ số nhiều được hiểu là các đòn khiêng.
- source_word: לָשֵׂאת
  choice: để khiêng
  rationale: 'Động từ nguyên mẫu có tiền tố ל biểu thị mục đích: các đòn được làm để khiêng chiếc bàn.'
- source_word: הַשֻּׁלְחָן
  choice: chiếc bàn
  rationale: Dịch trực tiếp danh từ xác định là chiếc bàn đã được nhắc đến trong ngữ cảnh, không thêm cách gọi mang tính diễn giải.
