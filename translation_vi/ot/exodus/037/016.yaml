base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: vi
  text: 'Ông làm các vật dụng của bàn: các đĩa[a], các chén, các bình và các bát dùng để rót lễ quán, tất cả đều bằng vàng ròng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch các tên vật dụng trong câu này là “các đĩa, các chén nhỏ, các bình và các bát”. Một số từ chỉ đồ đựng ở đây hiếm gặp hoặc có nghĩa tùy theo ngữ cảnh, nên không thể xác định hoàn toàn chính xác hình dạng của từng vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: các vật dụng
  rationale: Danh từ bao quát chỉ các đồ dùng hoặc vật chứa; “các vật dụng” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh chiếc bàn.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: đặt trên bàn
  rationale: Giữ sát ý nghĩa “ở trên bàn” của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: קְעָרֹתָיו
  choice: các đĩa
  rationale: Từ này thường chỉ đĩa hoặc mâm; “đĩa” phù hợp với ngữ cảnh đồ dùng trên bàn.
- source_word: כַּפֹּתָיו
  choice: các chén
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ một vật chứa nhỏ; “chén” dễ hiểu nhưng mức độ xác định không tuyệt đối.
- source_word: מְנַקִּיֹּתָיו
  choice: các bình
  rationale: Đây là một từ hiếm, có lẽ chỉ loại bình dùng để chứa hoặc rót; “bình” giữ được tính khái quát cần thiết.
- source_word: הַקְּשָׂוֹת
  choice: các tô
  rationale: Từ này chỉ một loại vật chứa khác liên quan đến việc rót lễ quán; “tô” giúp phân biệt với các chén trước đó, dù dạng vật dụng chính xác không chắc chắn.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: dùng để rót lễ quán
  rationale: Động từ thể bị động của נסך mang nghĩa rót lễ quán. Cách diễn đạt theo công dụng tự nhiên trong tiếng Việt và không áp đặt số lượng lên lễ vật.
- source_word: זָהָב טָהוֹר
  choice: tất cả đều bằng vàng ròng
  rationale: Cụm vật liệu ở cuối câu chi phối toàn bộ danh sách; thêm “tất cả đều” làm rõ phạm vi mà không đổi nghĩa.
