source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הַ/קְּטֹ֖רֶת עֲצֵ֣י שִׁטִּ֑ים אַמָּ֣ה אָרְכּ/וֹ֩ וְ/אַמָּ֨ה רָחְבּ֜/וֹ רָב֗וּעַ וְ/אַמָּתַ֨יִם֙ קֹֽמָת֔/וֹ מִמֶּ֖/נּוּ הָי֥וּ קַרְנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: vi
  text: Ông làm bàn thờ dâng hương[a] bằng gỗ keo. Bàn thờ dài một cu-bít, rộng một cu-bít—hình vuông—và cao hai cu-bít. Các sừng của bàn thờ liền một khối với bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bàn thờ hương.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ có waw liên tiếp thuật lại hành động đã xảy ra. Tiếng Việt không cần dịch từ nối וַ־ thành “và” ở đầu câu; chủ ngữ “ông” nối tiếp nhân vật Bết-sa-lê-ên trong văn cảnh.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: bàn thờ dâng hương
  rationale: Cụm sở hữu chỉ bàn thờ dành cho hương liệu được đốt trong nghi lễ. “Bàn thờ dâng hương” tự nhiên, rõ công dụng và không thu hẹp nghĩa hơn nguyên văn.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: “Gỗ keo” là cách gọi hiện đại, dễ hiểu cho loại gỗ thường được nhận diện là acacia; tránh phiên âm địa danh “Si-tim” vốn khó cho độc giả phổ thông.
- source_word: אַמָּה ... אַמָּתַיִם
  choice: một cu-bít ... hai cu-bít
  rationale: Giữ đơn vị đo cổ thay vì quy đổi sang hệ mét với độ chính xác giả tạo; cách phiên âm có gạch nối dễ đọc trong tiếng Việt.
- source_word: אָרְכּוֹ ... רָחְבּוֹ ... קֹמָתוֹ
  choice: Bàn thờ dài ... rộng ... và cao
  rationale: Chuyển các danh từ kích thước kèm hậu tố sở hữu thành cấu trúc miêu tả tự nhiên trong tiếng Việt, đồng thời nêu lại “bàn thờ” để tránh chuỗi đại từ nặng nề.
- source_word: רָבוּעַ
  choice: hình vuông
  rationale: Tính từ vị ngữ mô tả mặt bằng có chiều dài và chiều rộng bằng nhau; đặt giữa hai gạch ngang giữ chức năng giải thích của cụm từ.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Các sừng của bàn thờ liền một khối với bàn thờ
  rationale: Cụm מִמֶּנּוּ diễn tả các sừng phát xuất từ chính thân bàn thờ, tức không phải bộ phận gắn rời. “Liền một khối” truyền đạt rõ đặc điểm chế tác.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Giữ thuật ngữ nghi lễ “bàn thờ”, đơn vị cổ “cu-bít” và hình ảnh kỹ thuật “sừng”; tránh dùng từ Hán-Việt quá cổ hoặc diễn giải thêm ý nghĩa thần học. Dấu chú thích [a] được đặt ngay sau cụm từ mà phương án dịch thay thế liên quan đến, thay vì sau đơn vị đo.
