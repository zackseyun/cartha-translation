  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: vi
  text: Ông làm nắp chuộc tội[a] bằng vàng ròng; nắp dài hai cu-bít rưỡi và rộng một cu-bít rưỡi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nắp thi ân”. Từ Hê-bơ-rơ này chỉ chiếc nắp bằng vàng của Hòm Giao Ước và có liên hệ với nghi thức chuộc tội.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Dạng wayyiqtol của עשה tiếp nối mạch thuật sự quá khứ. Tiếng Việt không cần dịch liên từ וַ־ thành “và” ở đầu câu.
- source_word: כַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Danh từ chỉ chiếc nắp bằng vàng trên Hòm Giao Ước, đồng thời gắn với nghi thức chuộc tội. Cách dịch này vừa nhận diện vật thể là “nắp”, vừa giữ sắc thái tế tự của từ Hê-bơ-rơ.
- source_word: זָהָב טָהוֹר
  choice: bằng vàng ròng
  rationale: Diễn đạt tự nhiên chất liệu cấu tạo; טָהוֹר ở đây chỉ vàng tinh khiết.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: hai cu-bít rưỡi
  rationale: Chuyển cấu trúc “hai cu-bít và một nửa” sang cách nói đo lường tự nhiên trong tiếng Việt.
- source_word: אָרְכָּהּ
  choice: nắp dài
  rationale: Hậu tố giống cái số ít quy chiếu về כַּפֹּרֶת; lặp lại “nắp” giúp câu tiếng Việt rõ nghĩa mà không nặng nề.
- source_word: וְאַמָּה וָחֵצִי
  choice: và rộng một cu-bít rưỡi
  rationale: Giữ nguyên số đo “một cu-bít và một nửa” bằng lối nói tiếng Việt tự nhiên.
- source_word: רָחְבָּהּ
  choice: rộng
  rationale: Diễn đạt trực tiếp kích thước chiều rộng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch כַּפֹּרֶת trong bối cảnh tế tự
  choice: nắp chuộc tội
  alternative: nắp thi ân; chiếc nắp
  rationale: Từ này vừa gọi chiếc nắp của Hòm Giao Ước vừa mang liên hệ rõ rệt với nghi thức chuộc tội. “Nắp chuộc tội” giữ cả đặc điểm vật thể lẫn ý nghĩa tế tự, nhưng không khẳng định quá mức về cơ chế thần học; cách gọi truyền thống “nắp thi ân” được giữ trong chú thích.
translation_notes:
  register: Văn phong thuật sự trang trọng nhưng hiện đại. Dùng “vàng ròng” và “cu-bít” là những cách gọi quen thuộc trong văn bản Kinh Thánh tiếng Việt; cấu trúc câu ngắn, rõ và giữ chính xác các số đo.
