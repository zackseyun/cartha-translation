translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thân đèn” để làm rõ bộ phận trung tâm mà các nhánh vươn ra; giữ cấu trúc cân đối ba nhánh ở mỗi bên.
