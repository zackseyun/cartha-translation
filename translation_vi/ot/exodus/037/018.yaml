translation:
  language: vi
  text: 'Sáu nhánh vươn ra từ các bên của chân đèn: ba nhánh của chân đèn từ một bên, và ba nhánh của chân đèn từ bên thứ hai.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ một bên của nó ... từ bên thứ hai của nó.” Cũng có thể diễn đạt là “từ một bên ... từ bên kia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: nhánh
  rationale: Trong ngữ cảnh chân đèn, từ này chỉ các phần dạng cành vươn ra khỏi thân chính; “nhánh” vừa tự nhiên vừa giữ được hình ảnh của nguyên văn.
- source_word: יֹצְאִים
  choice: vươn ra
  rationale: Phân từ của יצא mô tả sáu nhánh đi ra từ thân đèn. “Vươn ra” giữ sắc thái hướng ra ngoài và phù hợp tự nhiên với cấu tạo của vật thể.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: từ hai bên / từ bên
  rationale: צד nghĩa là “bên, phía”. Cách diễn đạt này phản ánh số nhiều “các bên của nó” rồi phân định từng bên.
- source_word: מְנֹרָה
  choice: chân đèn
  rationale: Đây là danh từ thông dụng chỉ chân đèn trong Đền Tạm; “chân đèn” truyền đạt chức năng của vật thể bằng tiếng Việt hiện đại thay vì phiên âm.
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: bên này ... bên kia
  rationale: Nguyên văn là “bên thứ nhất ... bên thứ hai”. Tiếng Việt tự nhiên dùng “bên này ... bên kia” để diễn đạt rõ sự đối xứng giữa hai phía mà không thay đổi ý nghĩa.
