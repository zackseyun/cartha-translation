  to: 'Sáu nhánh vươn ra từ các bên của chân đèn: ba nhánh của chân đèn từ một bên, và ba nhánh của chân đèn từ bên thứ hai.[a]'
  rationale: Bản sửa bỏ chi tiết “thân” không được nêu rõ trong nguyên văn và thay cặp chỉ hướng “bên này ... bên kia” bằng cách diễn đạt sát hơn với “một bên ... bên thứ hai.” “Các bên của chân đèn” làm rõ đại từ sở hữu mà không thêm một bộ phận cấu tạo riêng.
