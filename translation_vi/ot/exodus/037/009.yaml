base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: vi
  text: Các chê-ru-bim dang cánh lên trên, dùng cánh che phủ nắp xá tội[a]. Mặt chúng hướng vào nhau; mặt các chê-ru-bim hướng về nắp xá tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nắp” hoặc “nắp che tội”; đây là chiếc nắp đặt trên Hòm Giao Ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: các chê-ru-bim
  rationale: Dùng dạng phiên âm quen thuộc cho các hình tượng thiên giới này, tránh đồng nhất chúng với hình ảnh thiên sứ có cánh trong nghệ thuật về sau.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: dang cánh hướng lên trên
  rationale: Diễn đạt tự nhiên tư thế của cánh, đồng thời giữ rõ hướng lên trên của לְמַעְלָה.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: lấy cánh che phủ
  rationale: Giữ nghĩa che từ phía trên và sắc thái phương tiện của giới từ בְּ; không hàm ý rằng vật bên dưới bị che kín hoàn toàn.
- source_word: הַכַּפֹּרֶת
  choice: nắp xá tội
  rationale: Dùng thuật ngữ chỉ chiếc nắp đặc biệt của Hòm Giao Ước trong nghi lễ, vừa thể hiện đây là một vật thể vừa giữ mối liên hệ khả dĩ với ý niệm xá tội; nghĩa đơn giản hơn là “nắp” được nêu trong chú thích.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Mặt chúng hướng vào nhau
  rationale: Chuyển thành cách nói tiếng Việt tự nhiên, giữ nguyên ý tương hỗ của thành ngữ “mỗi người hướng về anh em mình”.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: mặt các chê-ru-bim hướng về nắp xá tội
  rationale: Giữ sự lặp lại có chủ ý về khuôn mặt và nắp xá tội, qua đó cho biết chúng vừa đối diện nhau vừa cúi/hướng về phía nắp.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת trong bối cảnh Đền Tạm
  choice: nắp xá tội
  alternative: nắp; ngai thương xót
  rationale: “Nắp xá tội” nhận diện vật dụng nghi lễ mà không dùng cách dịch ẩn dụ “ngai thương xót,” vốn có thể khiến người đọc tưởng đây là một ngai theo nghĩa vật thể. Vì từ nguyên và sắc thái của danh từ còn được hiểu theo nhiều cách, chú thích giữ phương án dịch trực tiếp là “nắp”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thuật ngữ phiên âm “chê-ru-bim” và cấu trúc lặp của nguyên văn; đặt dấu chú thích ngay sau từ ngữ mà chú thích giải thích.
