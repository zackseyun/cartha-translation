  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của tiếng Hê-bơ-rơ: hai khoen vàng, vị trí bên dưới זֵר, hai cụm chỉ các mặt/bộ phận bên được giữ riêng, và công dụng làm chỗ cho các đòn dùng để khiêng bàn thờ. Tuy nhiên, “mảnh bên” không tự nhiên trong tiếng Việt và có thể gợi một miếng rời, trong khi צַלְעֹת ở đây chỉ bộ phận/cấu trúc bên nhưng nghĩa chính xác vẫn không hoàn toàn chắc chắn.'
