  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: vi
  text: Ông làm cho nó hai khoen bằng vàng ở dưới gờ viền của nó[a], trên hai phần bên của nó, ở hai bên của nó[b], làm chỗ luồn các đòn khiêng để khiêng nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ở dưới gờ trang trí.” Từ Hê-bơ-rơ זֵר chỉ gờ hoặc viền trang trí quanh mép trên.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ lặp lại hai cách diễn đạt gần nghĩa: “trên hai phần bên của nó, ở hai bên của nó.” Bản dịch giữ cả hai thay vì gộp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: hai khoen bằng vàng
  rationale: טבעת trong ngữ cảnh đồ dùng Đền Tạm là khoen kim loại để luồn đòn khiêng; “khoen” tự nhiên và chính xác hơn “nhẫn” trong tiếng Việt.
- source_word: עָשָׂה לוֹ
  choice: Ông làm cho nó
  rationale: Đại từ chỉ bàn thờ đang được nói đến; cách dịch này giữ quan hệ chỉ đối tượng được gắn thêm các khoen.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: ở dưới đường viền
  rationale: זֵר chỉ dải hay gờ trang trí chạy quanh mép trên của vật dụng, không nhất thiết là một “vương miện” riêng biệt.
- source_word: עַל שְׁתֵּי צַלְעֹתָיו
  choice: trên hai mảnh bên
  rationale: צלעות có thể chỉ các bên, sườn hoặc bộ phận cấu thành ở bên; “mảnh bên” giữ sắc thái kết cấu và phân biệt với צִדָּיו theo sau.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: ở hai bên của nó
  rationale: Giữ lại biểu thức thứ hai về hai bên, thay vì gộp với cụm trước, để phản ánh sự lặp lại có thật trong tiếng Hê-bơ-rơ.
- source_word: לְבָתִּים לְבַדִּים
  choice: làm chỗ luồn các đòn
  rationale: “Nhà/chỗ chứa cho các đòn” là cách nói về bộ phận tiếp nhận đòn; với khoen, “chỗ luồn” diễn đạt tự nhiên chức năng thực tế.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: để khiêng nó
  rationale: Động từ nguyên mẫu nêu mục đích; phương tiện là các đòn vừa được nhắc đến nên không cần lặp lại dài dòng trong tiếng Việt.
