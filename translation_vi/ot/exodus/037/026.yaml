base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/026.yaml
  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: vi
  text: Ông bọc bàn thờ bằng vàng ròng—mặt trên, các mặt bên chung quanh và các sừng—rồi làm một đường viền bằng vàng chạy quanh nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một vành bằng vàng chạy quanh nó”. Từ Hê-bơ-rơ chỉ một dải, gờ hoặc vành trang trí bao quanh đồ vật; theo lối dịch truyền thống, đôi khi từ này được dịch là “vương miện”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: bọc
  rationale: Trong ngữ cảnh chế tác đồ dùng Đền Tạm, động từ này chỉ việc phủ kim loại lên một vật bằng gỗ. “Bọc” tự nhiên, rõ nghĩa trong tiếng Việt và không hàm ý kỹ thuật hiện đại quá mức.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cụm từ chỉ vàng có độ tinh khiết cao. “Vàng ròng” là cách nói tự nhiên, trang trọng và quen thuộc trong tiếng Việt.
- source_word: גַּגּוֹ
  choice: mặt trên
  rationale: Danh từ thường có nghĩa là “mái”, nhưng ở đây nói về bề mặt phía trên của một bàn thờ nhỏ; “mặt trên” chính xác và tự nhiên hơn.
- source_word: קִירֹתָיו סָבִיב
  choice: các mặt bên chung quanh
  rationale: Nghĩa đen là “các vách/tường của nó chung quanh”. Đối với một vật dụng, “các mặt bên” là cách diễn đạt hiện đại, dễ hiểu mà vẫn giữ ý chỉ các bề mặt thẳng đứng bao quanh.
- source_word: קַרְנֹתָיו
  choice: các sừng
  rationale: Giữ nguyên thuật ngữ cụ thể chỉ các phần nhô lên ở các góc bàn thờ, không diễn giải làm mất hình ảnh của nguyên văn.
- source_word: זֵר זָהָב סָבִיב
  choice: một đường viền bằng vàng chạy quanh nó
  rationale: זֵר chỉ một dải, gờ hoặc vành trang trí bao quanh vật. “Đường viền” dễ hiểu trong tiếng Việt hiện đại; “chạy quanh” thể hiện rõ phạm vi bao quanh của סָבִיב.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Bàn thờ” được nêu rõ thay cho đại từ “nó” ở đầu câu dựa trên đối tượng đã được xác định trong ngữ cảnh gần, tránh cách mở câu mơ hồ trong tiếng Việt; các đại từ sở hữu lặp lại được lược bỏ khi quan hệ bộ phận đã rõ.
