base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/021.yaml
  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: vi
  text: Một bầu tròn ở dưới hai nhánh vươn ra từ thân đèn ấy, một bầu tròn ở dưới hai nhánh vươn ra từ thân đèn ấy, và một bầu tròn ở dưới hai nhánh vươn ra từ thân đèn ấy, cho sáu nhánh vươn ra từ thân đèn ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “núm tròn”; từ Hê-bơ-rơ chỉ một chi tiết trang trí tròn trên chân đèn.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפְתֹּר
  choice: bầu tròn
  rationale: Chỉ bộ phận trang trí có dạng tròn trên chân đèn. “Bầu tròn” diễn đạt hình dáng tự nhiên trong tiếng Việt; cũng có thể hiểu là “núm tròn”.
- source_word: תַּחַת
  choice: ở dưới / dưới
  rationale: Diễn đạt trực tiếp vị trí của từng bầu tròn bên dưới nơi một cặp nhánh tỏa ra.
- source_word: שְׁנֵי הַקָּנִים
  choice: mỗi cặp nhánh
  rationale: קָנֶה trong ngữ cảnh chân đèn chỉ các nhánh vươn ra, không phải cây sậy theo nghĩa đen. Cấu trúc ba lần lặp cho thấy mỗi vị trí ứng với một cặp trong sáu nhánh.
- source_word: מִמֶּנָּה
  choice: từ thân đèn
  rationale: Đại từ giống cái số ít quy chiếu về chân đèn; ở đây cách nói “thân đèn” làm rõ bộ phận trung tâm mà các nhánh vươn ra, phù hợp với cấu tạo được mô tả trong ngữ cảnh.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: trong số sáu nhánh
  rationale: Cụm từ tổng kết ba vị trí bầu tròn tương ứng với toàn bộ sáu nhánh bên.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: vươn ra từ thân đèn
  rationale: Phân từ mô tả sáu nhánh tỏa ra từ phần trung tâm; “vươn ra” tự nhiên và giữ được hình ảnh thực vật của chân đèn.
