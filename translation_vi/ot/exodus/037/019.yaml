base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: vi
  text: Trên một nhánh có ba chén chạm hình hoa hạnh nhân, cùng với một núm và một hoa; trên một nhánh khác cũng có ba chén chạm hình hoa hạnh nhân, cùng với một núm và một hoa[a]. Sáu nhánh vươn ra từ chân đèn đều được làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Núm” cũng có thể dịch là “bầu”, chỉ một chi tiết trang trí tròn, phình ra trên chân đèn.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: chén
  rationale: Danh từ chỉ các chi tiết trang trí dạng chén trên chân đèn; “chén” tự nhiên, dễ hiểu và giữ được hình dáng của vật.
- source_word: מְשֻׁקָּדִים
  choice: hình hoa hạnh nhân
  rationale: Từ này chỉ kiểu trang trí mô phỏng hoa hạnh nhân trong phần mô tả chân đèn; cách dịch này diễn đạt rõ hình thức trang trí.
- source_word: קָנֶה
  choice: nhánh
  rationale: Trong ngữ cảnh chân đèn, từ này chỉ các phần vươn ra từ thân chính; “nhánh” tự nhiên và chính xác hơn “cành” hay “ống”.
- source_word: כַּפְתֹּר
  choice: nụ
  rationale: Từ này chỉ một chi tiết trang trí tròn, phình ra. Trong tổng thể họa tiết thực vật, “nụ” là cách diễn đạt tự nhiên, dù “núm” cũng có thể dùng.
- source_word: פֶרַח
  choice: hoa
  rationale: Danh từ chỉ chi tiết trang trí hình hoa; “hoa” là từ thông dụng và trực tiếp.
- source_word: כֵּן
  choice: đều được làm như vậy
  rationale: Cụm này tổng kết rằng cùng một kiểu trang trí áp dụng cho cả sáu nhánh.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: từ chân đèn vươn ra
  rationale: Diễn đạt tự nhiên hướng chuyển động của các nhánh phát xuất từ phần chính của chân đèn.
- source_word: מְנֹרָה
  choice: chân đèn
  rationale: Dịch nghĩa vật dụng thay vì phiên âm; đây là cách gọi phổ thông, rõ ràng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai mệnh đề gần như lặp lại trong tiếng Hê-bơ-rơ được diễn đạt gọn thành “trên mỗi nhánh”, rồi câu cuối xác nhận áp dụng cho cả sáu nhánh; không làm thay đổi nội dung mô tả.
