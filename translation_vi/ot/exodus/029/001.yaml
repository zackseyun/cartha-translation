    rationale: לְקַדֵּשׁ ... לְכַהֵן לִי nêu mục đích thánh hiến là để họ đảm nhiệm chức tế lễ cho Đức Chúa Trời. “Để họ làm thầy tế lễ cho Ta” truyền đạt trực tiếp quan hệ này và tránh cách dùng “hầu” ít tự nhiên trong tiếng Việt hiện đại.
  - severity: low
