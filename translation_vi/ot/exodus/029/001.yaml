base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: vi
  text: 'Đây là điều ngươi phải làm cho họ để thánh hiến họ, để họ làm thầy tế lễ cho Ta: Hãy lấy một con bò đực trong đàn[a] và hai con cừu đực không tì vết[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một con bò đực non.” Nguyên văn Hê-bơ-rơ là “một con bò đực, con của đàn bò,” một thành ngữ chỉ con vật thuộc đàn bò.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không khuyết tật.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: điều
  rationale: Trong lời chỉ dẫn nghi lễ này, דָּבָר chỉ điều hoặc việc phải thực hiện; “điều” tự nhiên và trang trọng trong tiếng Việt.
- source_word: תַּעֲשֶׂה
  choice: ngươi phải làm
  rationale: Dạng vị hoàn mang chức năng chỉ thị; “phải làm” truyền đạt rõ lực mệnh lệnh.
- source_word: לְקַדֵּשׁ
  choice: biệt họ ra thánh
  rationale: Trong văn cảnh thiết lập chức tế lễ, קדשׁ nói đến việc dành riêng cho sự phục vụ thánh; cách dịch này vừa rõ nghĩa vừa giữ sắc thái thiêng liêng.
- source_word: לְכַהֵן לִי
  choice: hầu họ làm thầy tế lễ phụng sự Ta
  rationale: Động từ כהן diễn tả việc đảm nhiệm chức tế lễ; “phụng sự Ta” giữ hướng quy chiếu về Đức Chúa Trời mà không thêm ý niệm hệ phái.
- source_word: לְקַח
  choice: hãy lấy
  rationale: Mệnh lệnh trực tiếp mở đầu danh sách những con vật cần dùng.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: một con bò đực trong đàn
  rationale: Cụm בֶּן־בָּקָר là lối nói chỉ một con bò thuộc đàn gia súc; bản dịch tránh lối dịch sát chữ khó hiểu nhưng không bắt buộc sắc thái tuổi.
- source_word: אֵילִם שְׁנַיִם
  choice: hai con cừu đực
  rationale: אֵיל là cừu đực trưởng thành; số lượng hai được nêu rõ.
- source_word: תְּמִימִם
  choice: không tì vết
  rationale: Trong văn cảnh tế lễ, תמים mô tả con vật không có khuyết tật; “không tì vết” là cách nói tự nhiên, quen thuộc và chính xác.
theological_decisions:
- issue: Ngôn ngữ về chức năng tế lễ
  choice: hầu họ làm thầy tế lễ phụng sự Ta
  alternative: để họ thi hành chức tế lễ cho Ta
  rationale: Cách chọn giữ cả chức vụ tế lễ và đối tượng được phụng sự, không đưa thêm nội hàm giáo hội học về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi/Ta” để phù hợp lời Đức Chúa Trời trực tiếp phán với Môi-se; “thầy tế lễ” giữ thuật ngữ Kinh Thánh thông dụng, còn “biệt ra thánh” diễn đạt rõ hành động dành riêng cho chức vụ thánh.
