base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: vi
  text: Ngươi hãy thiêu toàn bộ con chiên đực trên bàn thờ. Đó là lễ thiêu dâng cho Yahweh, một hương thơm đẹp lòng[a], một lễ vật dâng bằng lửa cho Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một hương thơm êm dịu.” Cụm Hê-bơ-rơ này là một công thức tế lễ, chỉ lễ vật được Yahweh chấp nhận.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lễ vật làm thức ăn.” Ý nghĩa chính xác của từ Hê-bơ-rơ này vẫn được bàn luận; cách hiểu truyền thống là “lễ vật dâng bằng lửa.”'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: Con hãy thiêu
  rationale: Dạng Hiphil của קטר trong ngữ cảnh tế lễ chỉ việc làm cho lễ vật bốc thành khói trên bàn thờ. “Thiêu” tự nhiên trong tiếng Việt và vẫn giữ rõ hành động tế lễ.
- source_word: כָּל הָאַיִל
  choice: cả con chiên đực
  rationale: כָּל nhấn mạnh toàn bộ con vật được dâng; אַיִל chỉ chiên đực trưởng thành. Cách nói này tự nhiên và chính xác hơn “tất cả chiên đực”.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Hậu tố chỉ hướng kết hợp với động từ tế lễ diễn tả việc đưa con vật lên bàn thờ để thiêu; “trên bàn thờ” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Đây là thuật ngữ tế lễ chỉ lễ vật được thiêu trọn trên bàn thờ. “Lễ thiêu” ngắn gọn, quen thuộc và không làm mất đặc điểm căn bản của nghi lễ.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giới từ ל biểu thị sự quy hướng và dâng hiến. “Dâng lên” diễn đạt rõ quan hệ tế lễ, còn יהוה được chuyển là “Yahweh” để bảo tồn danh giao ước.
- source_word: רֵיחַ נִיחוֹחַ
  choice: một hương thơm đẹp lòng Ngài
  rationale: Đây là công thức tế lễ cố định, nói rằng lễ vật được Đức Chúa Trời chấp nhận. Cách dịch này tự nhiên và tránh gợi ý rằng cụm từ chỉ mô tả cảm giác khứu giác theo nghĩa đen.
- source_word: אִשֶּׁה
  choice: lễ vật dùng lửa
  rationale: Từ này thường chỉ một lễ vật được dâng bằng lửa, nhưng từ nguyên và sắc thái chính xác còn được bàn luận. Bản chính giữ cách hiểu gắn trực tiếp với lửa; chú thích nêu cách hiểu liên hệ đến lễ vật làm thức ăn.
- source_word: הוּא
  choice: Đó là; ấy là
  rationale: Đại từ này có chức năng vị ngữ, xác định con chiên là lễ thiêu và lễ vật. Hai cách diễn đạt tương ứng giúp câu tiếng Việt trôi chảy mà vẫn giữ cả hai lần xuất hiện.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của רֵיחַ נִיחוֹחַ
  choice: một hương thơm đẹp lòng Ngài
  alternative: một hương thơm êm dịu; một hương thơm làm nguôi
  rationale: Cụm này là công thức tế lễ diễn tả sự chấp nhận của Đức Chúa Trời. Bản dịch không suy diễn rằng lễ vật làm thay đổi tâm trạng của Ngài, nhưng chú thích vẫn bảo tồn sắc thái chữ nghĩa.
- issue: Bản chất của אִשֶּׁה
  choice: lễ vật dùng lửa
  alternative: lễ vật làm thức ăn
  rationale: Chứng cứ từ vựng cho phép các cách giải thích khác nhau. Bản chính chọn cách hiểu truyền thống, phù hợp với hành động thiêu vừa được nói đến, còn chú thích giữ phương án liên hệ đến thức ăn mà không áp đặt một quan niệm thần học về nhu cầu của Đức Chúa Trời.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Con” phù hợp với lời truyền trực tiếp cho Môi-se trong văn mạch. Dấu chấm phẩy giúp giữ cấu trúc hai mệnh đề định danh của câu Hê-bơ-rơ mà không khiến câu quá nặng.
