  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: vi
  text: Rồi ngươi hãy lấy con chiên đực thứ hai; A-rôn và các con trai ông phải đặt tay lên đầu con chiên đực ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Rồi ngươi hãy bắt
  rationale: Dạng Qal hoàn thành có liên từ trong chuỗi chỉ dẫn mang lực mệnh lệnh. “Rồi” thể hiện bước tiếp theo của nghi thức; “hãy bắt” tự nhiên trong tiếng Việt khi nói đến việc lấy một con vật để cử hành lễ.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: con chiên đực thứ hai
  rationale: אַיִל chỉ chiên đực trưởng thành, còn הַשֵּׁנִי là số thứ tự “thứ hai”, liên hệ với con chiên đực thứ hai trong trình tự phong chức.
- source_word: וְסָמַךְ
  choice: phải đặt
  rationale: Trong bối cảnh tế lễ, סמך diễn tả hành động nghi thức đặt hoặc tì tay lên con vật. “Đặt tay” rõ ràng, tự nhiên và không thêm cách giải thích về ý nghĩa biểu tượng.
- source_word: אַהֲרֹן וּבָנָיו
  choice: A-rôn và các con trai ông
  rationale: בָּנִים ở đây chỉ các con trai của A-rôn đang được phong chức tế lễ; cách dịch này giữ đúng giới tính và quan hệ gia đình trong ngữ cảnh.
- source_word: אֶת יְדֵיהֶם
  choice: tay
  rationale: Tiếng Hê-bơ-rơ dùng dạng số nhiều “tay của họ”. Trong tiếng Việt, cấu trúc “họ đặt tay” tự nhiên và không nhất thiết đánh dấu số nhiều trên danh từ; vẫn diễn đạt hành động của toàn bộ chủ thể số nhiều.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: trên đầu con chiên đực ấy
  rationale: Diễn đạt trực tiếp vị trí của tay. Từ “ấy” giúp chỉ lại chính con chiên đực thứ hai vừa được nhắc đến mà không thêm nội dung.
theological_decisions:
- issue: Diễn đạt nghi thức đặt tay mà không đưa thêm lời giải thích thần học về biểu tượng
  choice: phải đặt tay trên đầu con chiên đực ấy
  alternative: phải tì tay trên đầu con chiên đực ấy
  rationale: Câu chỉ mô tả hành động nghi thức, không giải thích đó là sự chuyển tội, đồng nhất hóa hay phong chức. “Đặt tay” giữ hành động cụ thể và tránh áp đặt một cách hiểu thần học vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” vì lời chỉ dẫn trực tiếp được nói với Môi-se và để giữ số ít của ngôi thứ hai; dùng “phải” cho mệnh lệnh áp dụng cho A-rôn cùng các con trai ông. Không cần chú thích.
