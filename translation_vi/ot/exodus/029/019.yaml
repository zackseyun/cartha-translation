  to: Rồi ngươi hãy lấy con chiên đực thứ hai; A-rôn và các con trai ông phải đặt tay lên đầu con chiên đực ấy.
  rationale: Chỉ thay «bắt» bằng «lấy» để phản ánh chính xác hơn động từ Hê-bơ-rơ trong bối cảnh chỉ dẫn tế lễ. Các yếu tố còn lại đã truyền đạt đúng nội dung, tính mệnh lệnh, và không diễn giải thêm ý nghĩa của nghi thức đặt tay.
