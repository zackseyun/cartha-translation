  text: וְ/לָקַחְתָּ֣ אֶת הַ/בְּגָדִ֗ים וְ/הִלְבַּשְׁתָּ֤ אֶֽת אַהֲרֹן֙ אֶת הַ/כֻּתֹּ֔נֶת וְ/אֵת֙ מְעִ֣יל הָ/אֵפֹ֔ד וְ/אֶת הָ/אֵפֹ֖ד וְ/אֶת הַ/חֹ֑שֶׁן וְ/אָפַדְתָּ֣ ל֔/וֹ בְּ/חֵ֖שֶׁב הָ/אֵפֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: vi
  text: Rồi ngươi hãy lấy các lễ phục và mặc cho A-rôn áo dài, áo choàng của ê-phốt, ê-phốt và tấm đeo ngực[a]; ngươi hãy buộc[b] ê-phốt vào người ông bằng đai dệt của ê-phốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “miếng đeo ngực”. Từ Hê-bơ-rơ chỉ một vật gắn ở ngực, không nhất thiết mang nghĩa áo giáp.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ ở đây rất hiếm, có thể mang nghĩa buộc, quấn hoặc cố định ê-phốt vào người A-rôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת הַבְּגָדִים
  choice: Rồi ngươi hãy lấy các lễ phục
  rationale: Waw mở đầu tiếp nối trình tự nghi lễ, nên dịch là “Rồi”; בְּגָדִים ở đây chỉ toàn bộ y phục dành cho chức tế lễ, vì vậy “lễ phục” tự nhiên và đúng ngữ cảnh hơn “quần áo”.
- source_word: וְהִלְבַּשְׁתָּ אֶת אַהֲרֹן
  choice: và mặc cho A-rôn
  rationale: Thể Hiphil của לבש mang nghĩa khiến một người mặc y phục; “mặc cho” diễn đạt tự nhiên ý sai khiến trong tiếng Việt.
- source_word: הַכֻּתֹּנֶת
  choice: áo dài
  rationale: כֻּתֹּנֶת là áo mặc sát thân, thường dài; “áo dài” dễ hiểu trong ngữ cảnh cổ đại, dù không đồng nhất với quốc phục Việt Nam hiện đại.
- source_word: מְעִיל הָאֵפֹד
  choice: áo choàng của ê-phốt
  rationale: Giữ quan hệ sở thuộc/liên hệ của kết cấu danh từ Hê-bơ-rơ mà không thêm ý giải thích rằng áo nhất thiết mặc ở dưới ê-phốt.
- source_word: הָאֵפֹד
  choice: ê-phốt
  rationale: Đây là thuật ngữ riêng về một lễ phục/vật dụng của thầy tế lễ, không có từ tương đương chính xác trong tiếng Việt, nên phiên âm.
- source_word: הַחֹשֶׁן
  choice: tấm đeo ngực
  rationale: חֹשֶׁן là vật được đeo ở phần ngực, không phải áo giáp; “tấm đeo ngực” cụ thể, dễ hiểu và tránh hàm ý quân sự.
- source_word: וְאָפַדְתָּ לוֹ
  choice: ngươi hãy buộc ê-phốt vào người ông
  rationale: Động từ אפד hiếm, liên hệ với việc mang hoặc cố định ê-phốt. “Buộc ... vào người” giữ được hành động cụ thể; nêu lại “ê-phốt” làm rõ tân ngữ ngầm trong tiếng Việt.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: bằng đai dệt của ê-phốt
  rationale: חֵשֶׁב trong ngữ cảnh là đai được dệt/chế tác gắn với ê-phốt. “Đai dệt” ngắn gọn và không đưa sắc thái “khéo léo” vào động từ hiếm.
theological_decisions:
- issue: Tân ngữ ngầm của וְאָפַדְתָּ
  choice: ê-phốt
  alternative: ông / nó
  rationale: Ngữ cảnh và cụm “đai ... của ê-phốt” cho thấy hành động là cố định ê-phốt trên A-rôn. Nêu danh từ giúp câu tiếng Việt rõ mà không tạo thêm nội dung thần học.
translation_notes:
  register: Văn phong chỉ thị nghi lễ, trang trọng nhưng dễ hiểu. Dùng “ngươi” phù hợp lời Đức Chúa Trời trực tiếp truyền lệnh cho Môi-se trong văn mạch; phiên âm “ê-phốt” như một thuật ngữ kỹ thuật. Dấu chân chú [a], [b] đều được đặt trong chính văn.
