    rationale: כְּמִנְחַת הַבֹּקֶר là “như/theo lễ vật ngũ cốc buổi sáng,” không chỉ là một chỉ dẫn thời gian chung. Cụm וּכְנִסְכָּהּ cũng cần được phản ánh là “theo lễ quán của nó.”
