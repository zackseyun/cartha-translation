  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: vi
  text: Còn con chiên thứ hai, ngươi phải dâng vào lúc chạng vạng[a]. Ngươi phải dâng nó theo lễ vật ngũ cốc buổi sáng và theo lễ quán của nó, để làm hương thơm đẹp lòng, một lễ vật dùng lửa[b] dâng lên Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ Hê-bơ-rơ: “giữa hai buổi chiều”, một thành ngữ chỉ khoảng cuối chiều hoặc chạng vạng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “lễ vật làm thức ăn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: con chiên thứ hai
  rationale: כֶּבֶשׂ chỉ chiên non dùng làm sinh tế; “thứ hai” giữ đúng trình tự đối với con chiên thứ nhất được nói đến trước đó.
- source_word: תַּעֲשֶׂה
  choice: ngươi phải dâng
  rationale: Động từ עשה có nghĩa cơ bản là “làm”, nhưng trong ngữ cảnh nghi lễ hiến tế, “dâng” diễn đạt tự nhiên và chính xác chức năng của hành động.
- source_word: בֵּין הָעַרְבָּיִם
  choice: vào lúc chạng vạng
  rationale: Đây là thành ngữ thời gian, sát chữ là “giữa hai buổi chiều”, chỉ khoảng cuối chiều hoặc chạng vạng; bản dịch chính dùng cách nói tự nhiên và giữ nghĩa sát chữ trong chú thích.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: lễ vật ngũ cốc ... như vào buổi sáng
  rationale: Trong luật tế lễ, מִנְחָה ở đây là lễ vật bằng ngũ cốc đi kèm sinh tế; cách dịch này cụ thể và dễ hiểu hơn từ khái quát “lễ vật”.
- source_word: וּכְנִסְכָּהּ
  choice: và lễ quán
  rationale: נֶסֶךְ là lễ vật bằng chất lỏng được rưới hoặc đổ ra. “Lễ quán” là thuật ngữ tiếng Việt gọn, trang trọng; chú thích giải nghĩa để độc giả phổ thông dễ hiểu.
- source_word: לָּהּ
  choice: cho con chiên ấy
  rationale: Đại từ hậu tố giống cái được diễn đạt theo quan hệ cú pháp của các lễ vật đi kèm; nêu lại “con chiên ấy” giúp câu tiếng Việt rõ nghĩa mà không bỏ đại từ trong nguồn.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: để làm hương thơm đẹp lòng
  rationale: Giữ hình ảnh của công thức tế lễ, đồng thời diễn đạt ý lễ vật được Đức Chúa Trời vui nhận mà không giải thích quá mức.
- source_word: אִשֶּׁה
  choice: một lễ vật dùng lửa dâng lên
  rationale: Cách dịch thể hiện trực tiếp loại lễ vật liên quan đến lửa, tránh từ Hán-Việt khó hiểu như “hỏa tế” và không đồng nhất từ này với toàn bộ của lễ thiêu.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng “Yahweh”, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách thể hiện công thức לְרֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  alternative: hương thơm êm dịu
  rationale: “Đẹp lòng” truyền đạt ý được vui nhận vốn có trong công thức tế lễ, nhưng vẫn giữ hình ảnh “hương thơm” và không biến câu thành một lời giải thích thần học.
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng danh riêng bốn phụ âm của Đức Chúa Trời; chuyển tự “Yahweh” bảo tồn tính chất danh riêng và không thay bằng tước hiệu.
- issue: Phạm vi nghĩa của אִשֶּׁה
  choice: lễ vật dùng lửa dâng lên
  alternative: lễ vật làm thức ăn
  rationale: Từ này là thuật ngữ tế lễ có cách giải thích từ nguyên và cách dịch khác nhau. Bản chính dùng nghĩa truyền thống gắn với lửa; chú thích thừa nhận cách hiểu khác mà không áp đặt một kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng đại từ “ngươi” để phù hợp lời chỉ thị trực tiếp trong ngữ cảnh luật giao ước. Câu được chia làm hai để tránh cấu trúc nghi lễ dồn nén của tiếng Hê-bơ-rơ; dấu gạch ngang làm rõ rằng “lễ vật dùng lửa dâng lên” đồng vị với toàn bộ lễ dâng tạo hương thơm.
