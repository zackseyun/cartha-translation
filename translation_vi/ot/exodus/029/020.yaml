translation_notes:
  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng hiện đại. Dùng “ngươi” để giữ lối xưng hô trực tiếp số ít của lời truyền lệnh; tên riêng được viết “A-rôn”. Cấu trúc câu bám sát trình tự hành động của bản Hê-bơ-rơ nhưng điều chỉnh trật tự từ cho tự nhiên trong tiếng Việt.
