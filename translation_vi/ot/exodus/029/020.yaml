revisions:
- from: Ngươi phải giết con chiên đực, lấy một ít máu nó bôi lên dái tai phải của A-rôn và dái tai phải của các con trai ông[a], lên ngón cái bàn tay phải và ngón cái bàn chân phải của họ; rồi ngươi phải hắt máu lên mọi phía quanh bàn thờ[b].
  to: Ngươi phải giết con chiên đực, lấy một ít máu của nó bôi lên dái tai phải của A-rôn và dái tai phải của các con trai ông[a], lên ngón cái bàn tay phải và ngón cái bàn chân phải của họ; rồi ngươi phải hắt máu lên các phía chung quanh bàn thờ[b].
  rationale: Chỉnh nhẹ để làm rõ rằng máu được hắt lên chung quanh bàn thờ, chứ không phải vào khu vực xung quanh bàn thờ; đồng thời cải thiện độ tự nhiên của cụm chỉ sở hữu. Các lựa chọn từ ngữ và chú thích còn lại được giữ vì phản ánh đúng tính không hoàn toàn chắc chắn của תְּנוּךְ và lực của זָרַק.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:50:02Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch theo sát chuỗi mệnh lệnh của tiếng Hê-bơ-rơ, nêu đúng con chiên đực, việc lấy một phần máu, các bộ phận bên phải, và việc hắt máu quanh bàn thờ. Tuy nhiên, “lên mọi phía quanh bàn thờ” có thể bị hiểu là hắt máu vào không gian/vùng đất quanh bàn thờ, thay vì lên các mặt chung quanh của chính bàn thờ (עַל הַמִּזְבֵּחַ סָבִיב).
  naturalness: Văn phong nhìn chung tự nhiên và trang trọng. “Một ít máu của nó” trôi chảy hơn “một ít máu nó”; “các phía chung quanh bàn thờ” rõ nghĩa và tự nhiên hơn “mọi phía quanh bàn thờ.”
  terminology: “Chiên đực,” “dái tai,” “ngón cái,” “bàn thờ,” và tên “A-rôn” đều phù hợp. “Hắt” truyền đạt tốt lực của זָרַק trong nghi thức, không làm yếu nghĩa thành “rảy.”
  issues:
  - severity: medium
    issue: Cụm “hắt máu lên mọi phía quanh bàn thờ” chưa xác định rõ máu được hắt lên các mặt chung quanh của bàn thờ.
    rationale: Cụm עַל הַמִּזְבֵּחַ סָבִיב đặt đối tượng tiếp nhận là bàn thờ và chỉ sự thực hiện quanh các phía của nó. Cách diễn đạt hiện tại có thể gợi ý hành động hướng vào khu vực xung quanh bàn thờ.
  - severity: low
    issue: “một ít máu nó” hơi khẩu ngữ trong văn phong chỉ dẫn nghi lễ.
    rationale: Thêm “của” tạo cách diễn đạt hiện đại, mạch lạc hơn mà không thay đổi nghĩa bộ phận của מִדָּמוֹ.
