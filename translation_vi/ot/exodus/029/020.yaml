  text: וְ/שָׁחַטְתָּ֣ אֶת הָ/אַ֗יִל וְ/לָקַחְתָּ֤ מִ/דָּמ/וֹ֙ וְ/נָֽתַתָּ֡ה עַל תְּנוּךְ֩ אֹ֨זֶן אַהֲרֹ֜ן וְ/עַל תְּנ֨וּךְ אֹ֤זֶן בָּנָי/ו֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וְ/זָרַקְתָּ֧ אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: vi
  text: Ngươi phải giết con chiên đực, lấy một ít máu của nó bôi lên dái tai phải của A-rôn và dái tai phải của các con trai ông[a], lên ngón cái bàn tay phải và ngón cái bàn chân phải của họ; rồi ngươi phải hắt máu lên các phía chung quanh bàn thờ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phần chót tai phải của A-rôn và phần chót tai phải của các con trai ông.” Từ Hê-bơ-rơ có thể chỉ phần ngoài cùng của tai nói chung, dù “dái tai” có khả năng phù hợp nhất trong ngữ cảnh nghi lễ này.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tạt máu lên các phía chung quanh bàn thờ.” Động từ Hê-bơ-rơ hàm ý một động tác nghi lễ có lực hơn là rảy nhẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: giết
  rationale: Trong ngữ cảnh hiến tế, “giết” diễn đạt rõ hành động sát tế mà vẫn tự nhiên trong tiếng Việt hiện đại; đối tượng là con vật hiến tế nên không gây mơ hồ với việc giết thông thường.
- source_word: אַיִל
  choice: con chiên đực
  rationale: Cách gọi rõ nghĩa, chính xác đối với con vật hiến tế và dễ hiểu hơn từ chuyên biệt hoặc cổ.
- source_word: מִדָּמוֹ
  choice: một ít máu nó
  rationale: Giới từ מִן ở đây chỉ việc lấy một phần máu để bôi, không phải toàn bộ số máu.
- source_word: תְּנוּךְ אֹזֶן
  choice: dái tai
  rationale: Trong nghi thức này, תְּנוּךְ nhiều khả năng chỉ dái tai, dù từ này cũng có thể chỉ phần chót hoặc phần ngoài cùng của tai.
- source_word: הַיְמָנִית
  choice: phải
  rationale: Tính từ xác định rõ tai, bàn tay và bàn chân bên phải; tiếng Việt diễn đạt tự nhiên bằng cách đặt “phải” sau danh từ.
- source_word: בֹּהֶן יָד
  choice: ngón cái bàn tay
  rationale: בֹּהֶן khi nói về bàn tay chỉ ngón cái; cách diễn đạt đầy đủ giúp phân biệt với ngón chân trong cùng câu.
- source_word: בֹּהֶן רֶגֶל
  choice: ngón cái bàn chân
  rationale: בֹּהֶן khi nói về bàn chân chỉ ngón chân lớn; “ngón cái bàn chân” là cách nói rõ và thông dụng.
- source_word: זָרַק
  choice: hắt ... lên
  rationale: Trong nghi thức hiến tế, động từ này nói đến việc đưa máu lên bàn thờ bằng một động tác có lực, không phải chỉ rảy nhẹ; “hắt” vừa tự nhiên vừa giữ được sắc thái ấy.
- source_word: סָבִיב
  choice: mọi phía quanh
  rationale: Cụm từ truyền đạt ý máu được hắt quanh các phía của bàn thờ, không chỉ tại một điểm.
- source_word: וְ
  choice: phải ... rồi
  rationale: Chuỗi waw nối tiếp trình tự nghi lễ; phối hợp “phải” và “rồi” giữ được mạch chỉ dẫn tự nhiên trong tiếng Việt.
