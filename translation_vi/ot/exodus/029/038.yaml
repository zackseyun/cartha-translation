translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phù hợp lời Đức Chúa Trời truyền trực tiếp cho Môi-se trong ngữ cảnh luật pháp. Dấu hai chấm làm rõ phần chỉ dẫn và phần lễ vật được quy định; các chú thích giữ lại độ rộng nghĩa của động từ và sắc thái nghi lễ của תָּמִיד.
