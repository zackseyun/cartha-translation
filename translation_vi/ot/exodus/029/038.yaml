  yaml_path: translation/ot/exodus/029/038.yaml
  text: 'This is what you shall offer on the altar: two one-year-old lambs each day continually[a][b][c].'
translation:
  language: vi
  text: 'Đây là điều ngươi phải dâng trên bàn thờ: mỗi ngày, luôn luôn dâng hai con chiên một tuổi[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngươi phải làm trên bàn thờ.” Động từ Hê-bơ-rơ có nghĩa rộng là “làm, thực hiện”, nhưng ở đây chỉ việc tiến hành dâng sinh tế.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “con của một năm”, nghĩa là những con chiên một tuổi.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “mỗi ngày, đều đặn.” Cụm từ này chỉ một lễ vật hằng ngày được dâng thường xuyên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר
  choice: Đây là điều
  rationale: Diễn đạt tự nhiên cấu trúc giới thiệu trong tiếng Hê-bơ-rơ; không thêm từ chỉ thời gian tương đương với “bây giờ” vì nguyên văn không có.
- source_word: תַּעֲשֶׂה
  choice: ngươi phải dâng
  rationale: Động từ עשה có nghĩa rộng là “làm/thực hiện”, nhưng trong ngữ cảnh bàn thờ và sinh tế, “dâng” truyền đạt hành động tế lễ tự nhiên và chính xác hơn.
- source_word: עַל הַמִּזְבֵּחַ
  choice: trên bàn thờ
  rationale: Cách dịch trực tiếp, tự nhiên của cụm giới từ trong ngữ cảnh tế lễ.
- source_word: כְּבָשִׂים
  choice: con chiên
  rationale: כֶּבֶשׂ chỉ chiên non; “con chiên” là từ quen thuộc, trang trọng và phù hợp văn cảnh Kinh Thánh.
- source_word: בְּנֵי שָׁנָה
  choice: một tuổi
  rationale: Chuyển thành ngữ Hê-bơ-rơ “những con của một năm” sang cách nói tuổi tự nhiên trong tiếng Việt.
- source_word: שְׁנַיִם לַיּוֹם
  choice: mỗi ngày hai con
  rationale: Giữ nguyên số lượng và ý phân phối theo từng ngày bằng trật tự từ tự nhiên trong tiếng Việt.
- source_word: תָּמִיד
  choice: cứ dâng liên tục
  rationale: Trong ngữ cảnh nghi lễ, từ này chỉ việc thực hiện đều đặn, không ngừng qua các ngày; lặp động từ “dâng” giúp câu tiếng Việt rõ nghĩa.
