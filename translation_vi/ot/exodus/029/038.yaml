  rationale: Sửa trật tự câu để “mỗi ngày” và “luôn luôn” cùng bổ nghĩa rõ ràng cho hành động dâng. Cách này giữ cả ý mỗi ngày của לַיּוֹם lẫn ý thường xuyên, liên tục của תָּמִיד, mà không hàm ý một nghi thức không gián đoạn. Điều chỉnh nhẹ chú thích b để phản ánh thành ngữ Hê-bơ-rơ tự nhiên hơn.
