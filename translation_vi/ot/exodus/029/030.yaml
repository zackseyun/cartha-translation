base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: vi
  text: Trong bảy ngày, thầy tế lễ kế nhiệm ông, là một trong các con trai ông, sẽ mặc các lễ phục ấy[a] khi người ấy vào Lều Hội Kiến để phụng sự trong nơi thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “chúng”, tức các lễ phục đã nói ở trước. Động từ Hê-bơ-rơ có thể có nghĩa là “mặc vào” hoặc “mặc”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong khu thánh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Trong bảy ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài bảy ngày mà không thêm ý ngoài nguyên văn.
- source_word: יִלְבָּשָׁם
  choice: sẽ mặc các lễ phục ấy
  rationale: Động từ לָבַשׁ có thể chỉ việc mặc vào hoặc đang mặc. Từ “mặc” trong tiếng Việt tự nhiên bao quát cả hai sắc thái; “các lễ phục ấy” làm rõ đại từ số nhiều dựa trên văn cảnh trước.
- source_word: הַכֹּהֵן תַּחְתָּיו מִבָּנָיו
  choice: người kế nhiệm ông làm thầy tế lễ, là một trong các con trai ông
  rationale: Chuyển đạt rõ quan hệ kế nhiệm chức vụ và giữ nguyên ý người kế nhiệm thuộc trong số các con trai của ông.
- source_word: אֲשֶׁר יָבֹא
  choice: khi vào
  rationale: Trong ngữ cảnh, mệnh đề quan hệ gắn việc mặc lễ phục với lúc người kế nhiệm vào Lều để thi hành chức vụ; cách diễn đạt thời gian này tự nhiên trong tiếng Việt.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Danh xưng trang trọng, dễ hiểu, chỉ nơi Đức Chúa Trời gặp dân Ngài trong bối cảnh đền tạm.
- source_word: לְשָׁרֵת
  choice: để phục vụ
  rationale: Giữ nghĩa thi hành công việc phụng sự trong bối cảnh tế lễ mà không thêm một thuật ngữ giáo phái.
- source_word: בַּקֹּדֶשׁ
  choice: trong nơi thánh
  rationale: Giữ yếu tố không gian thánh cụ thể của công việc tại đền tạm; nguyên ngữ cũng có thể hiểu rộng hơn là khu thánh.
theological_decisions:
- issue: Ngôn ngữ về sự kế nhiệm chức tế lễ
  choice: người kế nhiệm ông làm thầy tế lễ, là một trong các con trai ông
  alternative: thầy tế lễ thay thế ông trong số các con trai ông
  rationale: Bản dịch nêu rõ sự kế nhiệm trong dòng con trai nhưng không đưa vào bất kỳ quan niệm thần học muộn hơn nào về cơ cấu chức vụ.
- issue: Phạm vi không gian của בַּקֹּדֶשׁ
  choice: trong nơi thánh
  alternative: trong khu thánh
  rationale: “Nơi thánh” giữ cách nói cụ thể và trang trọng, đồng thời chú thích phương án rộng hơn để không giải quyết dứt khoát điều nguyên ngữ có thể để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Thầy tế lễ” giữ thuật ngữ quen thuộc; “Lều Hội Kiến” được viết hoa như một danh xưng. Cấu trúc câu làm rõ quan hệ kế nhiệm vốn cô đọng trong tiếng Hê-bơ-rơ, nhưng không thêm nội dung giáo lý.
