  to: Trong bảy ngày, thầy tế lễ kế nhiệm ông, là một trong các con trai ông, sẽ mặc các lễ phục ấy[a] khi người ấy vào Lều Hội Kiến để phụng sự trong nơi thánh[b].
  rationale: Chỉnh lại trật tự và quan hệ cú pháp của chủ ngữ để nói rõ rằng người kế nhiệm từ trong các con trai của A-rôn chính là thầy tế lễ sẽ mặc lễ phục. Bản sửa không thay đổi nghĩa, không thêm chi tiết giáo lý, và giữ các khả năng từ vựng cần thiết trong chú thích.
