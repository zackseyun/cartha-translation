lexical_decisions:
- source_word: שָׁחַטְתָּ
  choice: giết
  rationale: Diễn đạt tự nhiên hành động giết con vật dùng làm lễ tế, không thêm ý nghĩa ngoài động từ Hê-bơ-rơ.
- source_word: הָאָיִל
  choice: con chiên đực
  rationale: אַיִל ở đây chỉ chiên đực, phù hợp ngữ cảnh nghi lễ.
- source_word: וְזָרַקְתָּ
  choice: hắt
  rationale: זָרַק mô tả việc dùng lực đưa máu lên bàn thờ; “hắt” tự nhiên hơn “ném” khi tân ngữ là chất lỏng mà vẫn giữ nét nghĩa động tác.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: quanh bàn thờ
  rationale: Giữ ý máu được hắt vào các phía xung quanh bàn thờ, đồng thời tránh lối diễn đạt nặng nề.
