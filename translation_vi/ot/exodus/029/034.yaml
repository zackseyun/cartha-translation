source:
  edition: WLC
  text: וְֽ/אִם יִוָּתֵ֞ר מִ/בְּשַׂ֧ר הַ/מִּלֻּאִ֛ים וּ/מִן הַ/לֶּ֖חֶם עַד הַ/בֹּ֑קֶר וְ/שָׂרַפְתָּ֤ אֶת הַ/נּוֹתָר֙ בָּ/אֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי קֹ֥דֶשׁ הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: vi
  text: Nếu đến sáng vẫn còn lại thịt nào của lễ phong chức[a] hoặc bánh nào, thì ngươi phải dùng lửa thiêu phần còn lại. Không được ăn phần ấy, vì đó là vật thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thánh hiến”. Từ Hê-bơ-rơ này chỉ nghi lễ lập các thầy tế lễ vào chức vụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: vẫn còn lại
  rationale: Dạng Niphal của יתר diễn tả điều còn sót lại; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái bị động/trạng thái.
- source_word: בְּשַׂר
  choice: thịt
  rationale: Trong tiếng Việt hiện đại, “thịt” là cách gọi tự nhiên, cụ thể đối với phần ăn được của sinh tế.
- source_word: הַמִּלֻּאִים
  choice: lễ phong chức
  rationale: Trong văn cảnh Xuất Hành 29, từ này chỉ nghi lễ lập các thầy tế lễ vào chức vụ. “Lễ phong chức” ngắn gọn, dễ hiểu và giữ được ý nghĩa nghi lễ; ý “lễ” được diễn đạt theo văn cảnh.
- source_word: לֶּחֶם
  choice: bánh
  rationale: Cách tương đương trực tiếp và tự nhiên trong văn cảnh lễ vật.
- source_word: עַד הַבֹּקֶר
  choice: đến sáng
  rationale: Giữ ranh giới thời gian do עַד biểu thị.
- source_word: וְשָׂרַפְתָּ
  choice: thì ngươi phải dùng lửa thiêu
  rationale: Làm rõ vế kết quả của câu điều kiện, đồng thời giữ giọng quy định và hình ảnh lửa trong nguyên văn.
- source_word: הַנּוֹתָר
  choice: phần còn lại
  rationale: Danh hóa phân từ từ cùng gốc với יִוָּתֵר; cách dịch rõ ràng và bao quát cả thịt lẫn bánh còn dư.
- source_word: בָּאֵשׁ
  choice: dùng lửa
  rationale: Diễn đạt tự nhiên sắc thái phương tiện của giới từ בְּ trong tiếng Việt.
- source_word: לֹא יֵאָכֵל
  choice: Không được ăn phần ấy
  rationale: Giữ thể bị động và lực cấm đoán của mệnh đề luật lệ, đồng thời nêu rõ đối tượng trong tiếng Việt.
- source_word: קֹדֶשׁ
  choice: vật thánh
  rationale: Danh từ קֹדֶשׁ ở đây nói về tính chất biệt riêng của phần lễ vật; “vật thánh” giữ sắc thái tế tự và phù hợp với đại từ số ít הוּא.
theological_decisions:
- issue: Cách dịch thuật ngữ tế tự הַמִּלֻּאִים trong nghi lễ lập chức thầy tế lễ
  choice: lễ phong chức
  alternative: lễ biệt riêng; lễ tấn phong
  rationale: Thuật ngữ chỉ nghi lễ đưa A-rôn và các con trai ông vào chức vụ thầy tế lễ. “Lễ phong chức” rõ nghĩa trong tiếng Việt hiện đại nhưng chú thích vẫn bảo lưu sắc thái biệt riêng/thánh hiến của từ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “ngươi” để duy trì lời truyền trực tiếp số ít cho Môi-se trong văn cảnh. Đặt dấu chú thích ngay sau thuật ngữ mà chú thích giải thích, thay vì sau cụm thời gian.
