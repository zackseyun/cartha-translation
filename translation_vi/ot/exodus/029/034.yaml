revisions:
- from: Nếu đến sáng vẫn còn lại chút thịt nào của lễ phong chức[a] hoặc chút bánh nào, thì ngươi phải dùng lửa thiêu phần còn lại. Không được ăn phần ấy, vì đó là vật thánh.
  to: Nếu đến sáng vẫn còn lại thịt nào của lễ phong chức[a] hoặc bánh nào, thì ngươi phải dùng lửa thiêu phần còn lại. Không được ăn phần ấy, vì đó là vật thánh.
  rationale: Bản sửa loại bỏ sắc thái định lượng không có trong nguyên văn, đồng thời điều chỉnh chú thích để nêu một phương án từ vựng sát hơn với nghĩa nghi lễ lập chức/thánh hiến. Các yếu tố còn lại—“đến sáng”, “dùng lửa thiêu”, lệnh cấm ăn, và “vật thánh”—đều giữ đúng ý nghĩa và giọng văn của câu Hê-bơ-rơ.
