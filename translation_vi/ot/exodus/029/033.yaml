- from: Họ sẽ ăn những lễ vật đã được dùng để làm lễ chuộc tội[a], để lập họ làm tư tế[b] và thánh hiến họ. Nhưng người ngoài[c] không được ăn, vì đó là những vật thánh.
  to: Họ sẽ ăn những lễ vật được dùng để thực hiện việc chuộc tội[a], để thiết lập họ vào chức vụ tư tế[b] và thánh hiến họ. Nhưng người ngoài[c] không được ăn, vì chúng là vật thánh.
  rationale: Bản sửa làm rõ quan hệ phương tiện của giới từ ב với כפר mà không thêm người thụ hưởng vào mệnh đề; diễn đạt thành ngữ thiết lập tư tế theo chức năng nghi lễ; và chỉnh đại từ cuối câu cho phù hợp với các lễ vật số nhiều. Các chú thích vẫn được neo đúng tại cụm từ liên quan.
  reviewer_model: gpt-5.6-terra
