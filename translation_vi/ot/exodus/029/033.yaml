base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: vi
  text: Họ sẽ ăn những lễ vật được dùng để thực hiện việc chuộc tội[a], để thiết lập họ vào chức vụ tư tế[b] và thánh hiến họ. Nhưng người ngoài[c] không được ăn, vì chúng là vật thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ những lễ vật ấy mà việc xá tội đã được thực hiện.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “làm đầy tay họ”, một thành ngữ Hê-bơ-rơ chỉ việc thiết lập hoặc bổ nhiệm vào chức vụ tư tế.'
    reason: lexical_alternative
  - marker: c
    text: “Người ngoài” ở đây là người không thuộc nhóm được phép tham dự nghi lễ tư tế, chứ không nhất thiết là người ngoại quốc.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: Họ sẽ ăn những lễ vật
  rationale: Dạng động từ mang ý chỉ thị trong trình tự nghi lễ. Đại từ số nhiều chỉ về các phần lễ vật ở văn cảnh trước; diễn đạt là “những lễ vật” giúp câu tiếng Việt rõ nghĩa.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: đã được dùng để làm lễ chuộc tội
  rationale: 'Giới từ ב trong cấu trúc bị động với כפר biểu thị phương tiện: chính các lễ vật ấy được dùng trong nghi thức chuộc tội. Cách dịch này không thêm đối tượng thụ hưởng vốn không được nói rõ trong mệnh đề.'
- source_word: לְמַלֵּא אֶת יָדָם
  choice: để lập họ làm tư tế
  rationale: Nghĩa đen là “làm đầy tay họ”, một thành ngữ chỉ việc chính thức thiết lập người phục vụ trong chức vụ tư tế. Cách dịch nêu đúng chức năng trong ngữ cảnh mà không gắn với cơ cấu giáo phái về sau.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: và thánh hiến họ
  rationale: קדשׁ trong nghi lễ tư tế có nghĩa biệt riêng họ ra làm thánh để phục vụ Đức Chúa Trời; “thánh hiến” giữ được sắc thái nghi lễ và trang trọng.
- source_word: וְזָר
  choice: Nhưng người ngoài
  rationale: זר ở đây chỉ người không thuộc nhóm được phép tham dự nghi lễ tư tế, chứ không nhất thiết là người ngoại quốc về sắc tộc.
- source_word: לֹא יֹאכַל
  choice: không được ăn
  rationale: Diễn đạt tự nhiên một lệnh cấm trực tiếp trong tiếng Việt; tân ngữ đã rõ từ đầu câu nên không cần lặp lại.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: vì đó là những vật thánh
  rationale: Đại từ số nhiều quy chiếu về các lễ vật. “Những vật thánh” truyền đạt địa vị được biệt riêng cho nghi lễ rõ hơn cách nói dễ gây hiểu lầm rằng bản thân thức ăn có phẩm tính đạo đức.
theological_decisions:
- issue: Nghĩa của כפר trong ngữ cảnh tế lễ
  choice: làm lễ chuộc tội
  alternative: làm lễ xá tội
  rationale: “Chuộc tội” là cách nói dễ hiểu và quen thuộc cho hành động nghi lễ כפר, đồng thời đủ rộng để không thu hẹp nghĩa chỉ còn việc xóa bỏ tội lỗi. Câu Hê-bơ-rơ nhấn mạnh các lễ vật là phương tiện của nghi thức, không nêu rõ “cho họ” trong mệnh đề này.
- issue: Thành ngữ tư tế מִלֵּא יָד
  choice: lập họ làm tư tế
  alternative: làm đầy tay họ; tấn phong họ
  rationale: Bản dịch chính chuyển đạt chức năng của thành ngữ trong lễ thiết lập A-rôn và các con trai ông. “Tấn phong” có thể gợi cơ cấu chức phẩm về sau, còn dịch sát “làm đầy tay” khó hiểu nếu không giải thích.
- issue: Phạm vi của זָר
  choice: người ngoài
  alternative: người không có phận sự; người thường
  rationale: Cụm từ chỉ người đứng ngoài phạm vi tư tế được phép ăn lễ vật. Không dịch là “người ngoại quốc” để tránh biến sự phân biệt nghi lễ thành phân biệt sắc tộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “tư tế” để giữ bối cảnh nghi lễ cổ đại; dùng “lễ vật” và “những vật thánh” nhằm làm rõ đối tượng số nhiều trong văn cảnh. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
