revisions:
- from: Các lễ phục thánh của A-rôn sẽ thuộc về các con trai ông sau ông, để họ mặc những lễ phục ấy khi được xức dầu và khi được lập làm tư tế.[a]
  to: Các lễ phục thánh của A-rôn sẽ thuộc về các con trai ông sau ông, để họ được xức dầu và được lập vào chức vụ tư tế trong khi mặc các lễ phục ấy.[a]
  rationale: Bản sửa giữ nguyên nghĩa kế nhiệm của «sau ông», diễn đạt rõ rằng việc xức dầu và lập vào chức vụ là mục đích được nêu, đồng thời «trong khi mặc các lễ phục ấy» áp dụng cho cả hai. Chú thích vẫn bảo tồn hình ảnh thành ngữ Hê-bơ-rơ nhưng được viết gọn và tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
