review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính: y phục thánh thuộc A-rôn được chuyển cho các con trai ông trong sự kế nhiệm; họ được xức dầu và được thiết lập vào chức vụ trong khi mặc các y phục ấy. Tuy nhiên, cấu trúc «để họ mặc ... khi được...» đặt hành động mặc làm mục đích chính, trong khi tiếng Hê-bơ-rơ nêu mục đích là xức dầu và làm lễ thiết lập, với «trong/chúng» bổ nghĩa cho cả hai hành động. Nên điều chỉnh để phản ánh quan hệ này trực tiếp hơn.'
  naturalness: «Các lễ phục thánh» và «được lập làm tư tế» đều dễ hiểu trong văn phong trang trọng. Tuy vậy, câu sẽ tự nhiên và sát cấu trúc hơn nếu dùng «để họ được xức dầu và được lập vào chức vụ tư tế trong khi mặc...»; chú thích hiện có dùng cụm «lập hoặc thiết lập» trùng ý và hơi gượng.
  terminology: Giữ «A-rôn», «xức dầu», và «tư tế» là phù hợp. «Lễ phục thánh» chấp nhận được trong bối cảnh nghi lễ. «Lập vào chức vụ tư tế» diễn đạt thành ngữ מלא את־יד mà không áp đặt thuật ngữ giáo phái; nghĩa đen cần được bảo tồn ở chú thích.
  issues:
  - severity: low
    issue: Quan hệ cú pháp của mục đích và cụm «trong các lễ phục ấy» chưa được thể hiện trực tiếp.
    rationale: לְמָשְׁחָה ... וּלְמַלֵּא ... là hai mục đích, còn בָהֶם chỉ hoàn cảnh mặc y phục cho cả hai. Câu hiện tại có thể khiến người đọc xem việc mặc y phục là mục đích chính.
  - severity: low
    issue: Chú thích dùng «lập hoặc thiết lập» trùng nghĩa.
    rationale: Nên giải thích ngắn gọn thành ngữ nghi lễ là việc lập vào chức vụ tư tế.
  revised_text: Các lễ phục thánh của A-rôn sẽ thuộc về các con trai ông sau ông, để họ được xức dầu và được lập vào chức vụ tư tế trong khi mặc các lễ phục ấy.[a]
