base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: vi
  text: Các lễ phục thánh của A-rôn sẽ thuộc về các con trai ông sau ông, để họ được xức dầu và được lập vào chức vụ tư tế trong khi mặc các lễ phục ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “làm đầy tay họ”, một thành ngữ nghi lễ chỉ việc lập họ vào chức vụ tư tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: các lễ phục thánh
  rationale: בגד là y phục; trong ngữ cảnh tư tế, “lễ phục” tự nhiên và chính xác hơn “quần áo”, còn “thánh” giữ ý được biệt riêng cho việc thánh.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: của A-rôn
  rationale: לְ diễn tả sự sở hữu hoặc quy thuộc; cách nói này ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: sẽ thuộc về các con trai ông sau ông
  rationale: 'Giữ cấu trúc kế nhiệm của nguyên văn: sau A-rôn, lễ phục được chuyển cho các con trai ông.'
- source_word: לְמָשְׁחָה בָהֶם
  choice: để họ mặc những lễ phục ấy khi được xức dầu
  rationale: 'בָהֶם chỉ hoàn cảnh: họ được xức dầu trong lúc mặc các lễ phục, chứ lễ phục không phải phương tiện xức dầu. Diễn đạt rõ chủ thể ngầm để tiếng Việt tự nhiên.'
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: và khi được lập làm tư tế
  rationale: מלא את־ידם, nghĩa đen “làm đầy tay họ”, là thành ngữ nghi lễ chỉ việc chính thức thiết lập họ vào chức vụ tư tế. Bản văn chính dùng nghĩa chức năng tự nhiên; hình ảnh Hê-bơ-rơ được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch thành ngữ tư tế מלא את־יד
  choice: lập làm tư tế
  alternative: làm đầy tay họ
  rationale: “Lập làm tư tế” truyền đạt chính xác chức năng của nghi thức trong ngữ cảnh và tránh liên tưởng giáo phái từ thuật ngữ “phong chức”; chú thích bảo tồn nghĩa đen và tính minh bạch của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “lễ phục thánh”, “xức dầu” và “tư tế” theo văn cảnh nghi lễ; lặp “những lễ phục ấy” để làm rõ đại từ số nhiều בָהֶם. Dấu chú thích [a] đặt ngay sau mệnh đề chứa thành ngữ được giải thích.
