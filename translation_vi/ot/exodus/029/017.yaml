revisions:
- from: Hãy chặt con chiên đực ra từng miếng, rửa bộ lòng[a] và các chân nó, rồi đặt chúng trên các miếng thịt và trên đầu nó.
  to: Hãy chặt con chiên đực ra từng phần, rửa bộ lòng[a] và các chân nó, rồi đặt chúng trên các phần đã chặt và trên đầu nó.[b]
  rationale: Bản sửa giữ sát nghĩa trực tiếp của עַל là “trên,” không áp đặt cách giải thích nghi lễ vào thân bài, đồng thời bổ sung chú thích để nêu khả năng hiểu theo cách sắp xếp các phần. “Các phần đã chặt” phản ánh chính xác hơn từ chỉ các phần của con vật sau khi bị chặt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:50:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự mệnh lệnh và các thuật ngữ chính: אַיִל là chiên đực, נתח là chặt thành từng phần, קֶרֶב là bộ lòng/các phần bên trong, כְּרָעַיִם là chân, và רֹאשׁ là đầu. Tuy nhiên, giới từ עַל trong mệnh đề cuối có thể được hiểu theo nghĩa sắp đặt nghi lễ là “trên/đặt lên”; nên giữ nghĩa trực tiếp trong thân bài và ghi chú khả năng diễn đạt “cùng với” thay vì lặng lẽ giải thích.'
  naturalness: “Hãy chặt con chiên đực ra từng miếng” và “rửa bộ lòng và các chân nó” tự nhiên, rõ ràng trong tiếng Việt hiện đại. Đổi “các miếng thịt” thành “các phần đã chặt” tránh thêm sắc thái “thịt” không có trực tiếp trong từ נְתָחִים, đồng thời liên kết rõ hơn với mệnh lệnh vừa nêu.
  terminology: “Chiên đực,” “bộ lòng,” “chân,” và “đầu” phù hợp văn cảnh nghi lễ. Chú thích cho “bộ lòng” được giữ để bảo toàn biên độ nghĩa của קֶרֶב. Thêm chú thích đúng vị trí cho cụm “đặt chúng trên” để phản ánh vấn đề diễn giải của עַל.
  issues:
  - severity: low
    issue: Thiếu chú thích về cách hiểu cụm “đặt chúng trên …”.
    rationale: Dấu chú thích trong hồ sơ kiểm chứng tiếng Anh nêu rõ rằng việc sắp xếp các phần có thể được diễn đạt là “cùng với,” dù văn bản Hê-bơ-rơ dùng עַל, thường là “trên.” Bản dịch nên giữ “trên” trong thân bài nhưng thêm chú thích neo tại động từ/cụm giới từ, không neo nhầm ở “các chân.”
  - severity: low
    issue: “Các miếng thịt” diễn giải נְתָחָיו cụ thể hơn cần thiết.
    rationale: נְתָחִים là các phần/miếng đã chặt của con vật. “Các phần đã chặt” sát nghĩa hơn mà vẫn tự nhiên; không thay đổi nội dung nghi lễ.
