  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: vi
  text: Hãy chặt con chiên đực ra từng phần, rửa bộ lòng[a] và các chân nó, rồi đặt chúng trên các phần đã chặt và trên đầu nó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các phần bên trong”. Từ Hê-bơ-rơ có thể chỉ phần bên trong con vật nói chung, dù trong ngữ cảnh hiến tế, “bộ lòng” có lẽ cụ thể hơn.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “đặt chúng trên các phần đã chặt của nó và trên đầu nó”. Trong ngữ cảnh sắp xếp lễ vật, cũng có thể hiểu là đặt các phần đã rửa cùng với các phần đã chặt và đầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: con chiên đực
  rationale: Trong ngữ cảnh hiến tế, אַיִל chỉ chiên đực trưởng thành; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: chặt ... ra từng miếng
  rationale: Thể piel của נתח diễn tả việc chia thân con vật thành các phần để hiến tế; “chặt ... ra từng miếng” truyền đạt rõ thao tác cụ thể.
- source_word: קִרְבּוֹ
  choice: bộ lòng
  rationale: Trong chỉ dẫn hiến tế, קֶרֶב chỉ các phần bên trong con vật; “bộ lòng” tự nhiên, cụ thể, nhưng vẫn cần ghi nhận nghĩa rộng hơn trong chú thích.
- source_word: כְרָעָיו
  choice: các chân nó
  rationale: כְּרָעַיִם chỉ chân, có thể đặc biệt là phần chân dưới; “các chân” dễ hiểu và không thu hẹp quá mức.
- source_word: וְנָתַתָּ עַל
  choice: rồi đặt chúng trên
  rationale: Giữ nghĩa không gian thông thường của עַל là “trên”, đồng thời “rồi” thể hiện trình tự của các mệnh lệnh nối bằng waw.
- source_word: רֹאשׁוֹ
  choice: đầu nó
  rationale: Cách dịch trực tiếp, tự nhiên của thuật ngữ giải phẫu.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh nghi lễ, trang trọng nhưng dễ hiểu. Dùng “chiên đực” thay vì từ chuyên biệt ít thông dụng hơn; giữ “trên” để phản ánh trực tiếp giới từ Hê-bơ-rơ עַל và không âm thầm giải nghĩa thành “cùng với”.
