review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng chuỗi mệnh lệnh, các phần mỡ, phần phụ liên hệ với gan, hai quả thận, và việc thiêu chúng trên bàn thờ. Tuy nhiên, «Con» thêm một cách xưng hô không được đánh dấu trong tiếng Hê-bơ-rơ; đại từ «đó» cũng có thể thoáng gây mơ hồ trong chuỗi liệt kê.
  naturalness: Văn phong nghi lễ hiện đại, rõ và tự nhiên. Bỏ đại từ xưng hô thêm vào và thay «đó» bằng «chúng» làm câu trung tính hơn và liên kết rõ ràng phần mỡ với hai quả thận.
  terminology: «Nội tạng», «phần phụ trên gan», «quả thận», «bàn thờ» đều phù hợp. «Phần phụ» giữ sự dè dặt cần thiết đối với יוֹתֶרֶת; chú thích cung cấp phương án «thùy gan» mà không xác quyết nhận diện giải phẫu.
  issues:
  - severity: medium
    issue: «Con hãy lấy» thêm đại từ xưng hô.
    rationale: Động từ ngôi số ít trong tiếng Hê-bơ-rơ chỉ người nhận mệnh lệnh nhưng không nêu quan hệ «Con». Trong tiếng Việt, «Con» đưa vào sắc thái quan hệ và giọng nói không cần thiết cho bản văn; «Hãy lấy» vẫn truyền đạt đầy đủ mệnh lệnh.
  - severity: low
    issue: «phần mỡ bám trên đó» có tiền chỉ sở hữu chưa hoàn toàn rõ.
    rationale: «Đó» có thể khiến người đọc phải xác định lại nó quy về hai quả thận, thay vì phần phụ/gan. «Trên chúng» nêu rõ tiền chỉ là hai quả thận và sát với עֲלֵיהֶן.
  revised_text: Hãy lấy tất cả phần mỡ phủ nội tạng, phần phụ trên gan[a], hai quả thận cùng phần mỡ trên chúng, rồi thiêu tất cả trên bàn thờ.
