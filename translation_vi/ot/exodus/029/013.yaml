revisions:
- from: Con hãy lấy tất cả phần mỡ phủ nội tạng, phần phụ trên gan[a], hai quả thận cùng phần mỡ bám trên đó, rồi thiêu tất cả trên bàn thờ.
  to: Hãy lấy tất cả phần mỡ phủ nội tạng, phần phụ trên gan[a], hai quả thận cùng phần mỡ trên chúng, rồi thiêu tất cả trên bàn thờ.
  rationale: Bản sửa loại bỏ cách xưng hô không có trong nguyên ngữ và làm rõ rằng phần mỡ được nói đến là phần ở trên hai quả thận. Các từ ngữ về nghi lễ và giải phẫu khó xác định được giữ nguyên, cùng chú thích bảo toàn tính bất định của יוֹתֶרֶת.
  reviewer_model: gpt-5.6-terra
