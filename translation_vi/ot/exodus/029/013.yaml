  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng hiện đại. Câu được sắp xếp gọn theo trình tự hành động; tránh thuật ngữ giải phẫu quá chuyên môn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
