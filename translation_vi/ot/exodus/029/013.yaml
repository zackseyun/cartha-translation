base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: vi
  text: Hãy lấy tất cả phần mỡ phủ nội tạng, phần phụ trên gan[a], hai quả thận cùng phần mỡ trên chúng, rồi thiêu tất cả trên bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thùy gan”. Từ Hê-bơ-rơ chỉ một bộ phận cụ thể gắn với gan, nhưng vị trí giải phẫu chính xác chưa chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Con hãy lấy
  rationale: Dạng động từ trong chuỗi chỉ thị mang lực mệnh lệnh. “Hãy lấy” tự nhiên trong tiếng Việt và giữ giọng hướng dẫn nghi lễ; “con” phù hợp với lời Đức Chúa Trời trực tiếp truyền cho Môi-se trong ngữ cảnh.
- source_word: כָּל הַחֵלֶב
  choice: tất cả phần mỡ
  rationale: חֵלֶב chỉ những phần mỡ của con vật dùng trong lễ hiến tế. “Phần mỡ” rõ nghĩa hơn thuật ngữ chuyên môn và tránh khiến người đọc hiểu là toàn bộ chất béo nói chung.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: phủ nội tạng
  rationale: קֶרֶב ở đây chỉ các bộ phận bên trong con vật. “Nội tạng” là cách nói hiện đại, chính xác và dễ hiểu.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: phần phụ trên gan[a]
  rationale: יוֹתֶרֶת là thuật ngữ giải phẫu khó xác định, chỉ một phần gắn với hoặc nằm trên gan. “Phần phụ trên gan” bám sát עַל và không khẳng định quá mức rằng đó là một thùy gan theo giải phẫu hiện đại.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: hai quả thận
  rationale: Cách gọi giải phẫu thông dụng và trực tiếp trong tiếng Việt.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: phần mỡ bám trên đó
  rationale: Diễn đạt tự nhiên quan hệ của lớp mỡ với hai quả thận, đồng thời giữ ý cơ bản của עֲלֵיהֶן là “ở trên chúng”.
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: rồi thiêu tất cả trên bàn thờ
  rationale: Trong nghi lễ hiến tế, Hiphil của קטר chỉ việc đốt lễ vật trên bàn thờ cho bốc khói. “Thiêu” giữ sắc thái nghi lễ tốt hơn “đốt”; “tất cả” làm rõ các bộ phận vừa liệt kê là đối tượng của động từ.
theological_decisions: []
