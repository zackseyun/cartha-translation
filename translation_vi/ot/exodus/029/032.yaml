  terminology: “A-rôn,” “các con trai ông,” “chiên đực,” và “Lều Hội Kiến” đều phù hợp với thuật ngữ và ngữ cảnh nghi lễ. “Thịt” là cách dịch tự nhiên, chính xác cho בָּשָׂר trong ngữ cảnh này.
