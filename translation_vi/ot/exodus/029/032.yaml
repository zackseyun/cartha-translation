base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: vi
  text: A-rôn và các con trai ông phải ăn thịt con chiên đực và bánh trong giỏ tại lối vào Lều Hội Kiến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכַל
  choice: phải ăn
  rationale: Dạng hoàn thành Qal có liên từ trong mạch chỉ dẫn nghi lễ mang lực quy định; “phải ăn” diễn đạt tự nhiên tính bắt buộc mà không biến câu thành lời kể quá khứ.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: וּבָנָיו
  choice: và các con trai ông
  rationale: Trong nghi lễ phong chức này, בנים chỉ các con trai của A-rôn tham dự chức tư tế, không phải con cái nói chung.
- source_word: בְּשַׂר הָאַיִל
  choice: thịt con chiên đực
  rationale: בשר nghĩa đen là phần xác/thịt và trong ngữ cảnh tế lễ chỉ phần thịt có thể ăn; “thịt” là cách nói tự nhiên, chính xác trong tiếng Việt. אַיִל là chiên đực.
- source_word: הַלֶּחֶם
  choice: bánh
  rationale: לֶחֶם ở đây chỉ chung các thứ bánh đã được đặt trong giỏ theo ngữ cảnh trước; tiếng Việt không cần mạo từ.
- source_word: אֲשֶׁר בַּסָּל
  choice: ở trong giỏ
  rationale: Mệnh đề quan hệ xác định bánh đang nằm trong giỏ; có thể lược đại từ quan hệ trong tiếng Việt để câu gọn và tự nhiên.
- source_word: פֶּתַח
  choice: tại lối vào
  rationale: Diễn đạt rõ địa điểm ở cửa hay lối vào của lều.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, quen thuộc cho lều thánh là nơi Đức Chúa Trời và dân Ngài gặp nhau theo sự chỉ định.
theological_decisions:
- issue: Ngôn ngữ chỉ nam giới trong bối cảnh tư tế
  choice: các con trai ông
  alternative: các con của ông
  rationale: Câu này nói cụ thể đến các con trai của A-rôn được phong chức tư tế; giữ yếu tố giới tính của nguyên văn thay vì khái quát hóa.
- issue: Lực ngôn trung của chỉ dẫn nghi lễ
  choice: phải ăn
  alternative: sẽ ăn
  rationale: Trong văn mạch luật lệ/nghi lễ, động từ mang tính quy định chứ không kể một hành động đã xảy ra. “Phải ăn” truyền đạt rõ lực chỉ dẫn trong tiếng Việt.
- issue: Cách hiểu בשר trong sinh tế
  choice: thịt
  alternative: xác thịt
  rationale: Trong ngữ cảnh ăn sinh tế, từ này chỉ thịt của con vật; “xác thịt” tuy sát hình thức hơn nhưng dễ gây sắc thái không phù hợp và kém tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cùng” để nối hai món được ăn, và đặt cụm địa điểm cuối câu theo trật tự tự nhiên của tiếng Việt. Không cần chú thích cho בשר vì “thịt” vừa chính xác theo ngữ cảnh vừa không làm mất một phương án diễn giải thần học đáng kể.
