revisions:
- from: Phần ấy sẽ thuộc về A-rôn và các con trai ông như một quy định lâu dài mà dân Y-sơ-ra-ên phải tuân giữ, vì đó là phần biệt riêng dâng lên; phần ấy sẽ được lấy từ các sinh tế của lễ vật bình an[a] mà dân Y-sơ-ra-ên dâng, tức là phần họ biệt riêng dâng lên Đức Giê-hô-va.
  to: Phần ấy sẽ thuộc về A-rôn và các con trai ông theo một lệ định lâu dài, do dân Y-sơ-ra-ên cấp; vì đó là phần dâng hiến. Phần ấy sẽ là phần dâng hiến từ dân Y-sơ-ra-ên, từ các sinh tế bình an của họ, là phần họ dâng hiến lên Đức Giê-hô-va.[a]
  rationale: Bản sửa khôi phục nghĩa “từ dân Y-sơ-ra-ên” ở cả hai lần xuất hiện, giữ sự lặp lại có chủ ý của תְּרוּמָה (“phần dâng hiến”), và dùng cách diễn đạt tự nhiên hơn cho “các sinh tế bình an của họ”. Dấu chú thích được đặt sau câu để không làm gián đoạn cụm thuật ngữ nghi lễ.
  reviewer_model: gpt-5.6-terra
