    issue: “phần ấy sẽ được lấy” không phản ánh đầy đủ וּתְרוּמָה יִהְיֶה.
    rationale: Nguyên văn lặp lại danh từ “phần dâng hiến” và động từ “sẽ là”; cần bảo tồn sự xác định này thay vì chỉ nêu nguồn lấy phần.
  - severity: medium
