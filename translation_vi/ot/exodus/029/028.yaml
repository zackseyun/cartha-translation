base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: vi
  text: Phần ấy sẽ thuộc về A-rôn và các con trai ông theo một lệ định lâu dài, do dân Y-sơ-ra-ên cấp; vì đó là phần dâng hiến. Phần ấy sẽ là phần dâng hiến từ dân Y-sơ-ra-ên, từ các sinh tế bình an của họ, là phần họ dâng hiến lên Đức Giê-hô-va.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “lễ tế thông công” hoặc “lễ tế an lành”. Từ Hê-bơ-rơ chỉ lễ tế này gợi ý sự trọn vẹn, bình an và mối quan hệ hòa thuận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Phần ấy sẽ thuộc về
  rationale: Động từ theo nghĩa đen là “và sẽ là”, nhưng trong ngữ cảnh luật tế lễ diễn tả phần được ấn định cho A-rôn và các con trai ông; cách dịch này làm rõ quan hệ sở hữu mà không thêm ý ngoài văn cảnh.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: về A-rôn và các con trai ông
  rationale: Giới từ לְ đánh dấu người được hưởng phần này; “thuộc về” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לְחָק עוֹלָם
  choice: như một quy định lâu dài
  rationale: חָק là quy định hay phần lệ định; עוֹלָם trong văn cảnh luật nghi lễ chỉ tính bền vững, lâu dài, không nhất thiết là một khẳng định triết học về vô tận.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mà dân Y-sơ-ra-ên phải tuân giữ
  rationale: Cụm này theo nghĩa sát là “từ dân Y-sơ-ra-ên”. Gắn với “quy định”, tiếng Việt cần biểu đạt nghĩa quy định ấy được áp dụng đối với dân Y-sơ-ra-ên; vế sau vẫn nêu rõ phần dâng được lấy từ họ.
- source_word: תְרוּמָה
  choice: phần biệt riêng dâng lên
  rationale: תְרוּמָה là phần được tách riêng và dâng lên Đức Chúa Trời, có thể gắn với động tác nâng lên. Cách dịch này vừa dễ hiểu vừa giữ được cả ý biệt riêng và dâng hiến.
- source_word: וּתְרוּמָה יִהְיֶה
  choice: phần ấy sẽ được lấy
  rationale: Trong mạch câu, phần được ấn định cho các thầy tế lễ chính là phần biệt riêng lấy từ lễ vật của dân. Tiếng Việt tránh lặp nặng nề nhưng ý “phần biệt riêng dâng lên” được nhắc lại ngay cuối câu.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: từ các sinh tế của lễ vật bình an
  rationale: Giữ cả זֶבַח, “sinh tế”, và thuật ngữ nghi lễ שְׁלָמִים. “Lễ vật bình an” là cách gọi quen thuộc, còn độ rộng nghĩa được ghi chú.
- source_word: תְּרוּמָתָם
  choice: phần họ biệt riêng dâng lên
  rationale: Giữ hậu tố chỉ dân Y-sơ-ra-ên là chủ thể dâng và lặp lại trường nghĩa của תְרוּמָה bằng cách diễn đạt tự nhiên.
- source_word: לַיהוָה
  choice: dâng lên Đức Giê-hô-va
  rationale: Giới từ לְ chỉ hướng hoặc người nhận lễ dâng. Dùng “Đức Giê-hô-va” để thể hiện danh riêng YHWH rõ ràng trong bản dịch tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA; Đức Chúa Trời
  rationale: Văn bản Hê-bơ-rơ có danh riêng giao ước YHWH. “Đức Giê-hô-va” là cách gọi đã quen thuộc trong tiếng Việt và phân biệt danh này với tước hiệu; không dựa vào lựa chọn tiếng Anh khi tiếng Anh cung cấp không nhất quán giữa câu dịch và quyết định thuật ngữ.
- issue: Thuật ngữ nghi lễ שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công; lễ vật cầu an; lễ vật thịnh vượng
  rationale: Từ này gợi sự bình an, toàn vẹn và mối quan hệ hài hòa. “Lễ vật bình an” giữ thuật ngữ truyền thống mà không thu hẹp nghĩa chỉ còn sự thông công; chú thích bảo tồn các khả năng khác.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại. Dùng “phần ấy” để nối với phần lễ vật đã được xác định trong văn cảnh; dùng “biệt riêng dâng lên” thay cho thuật ngữ cổ hoặc quá kỹ thuật như “lễ vật dâng giơ lên”.
