base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: vi
  text: Con hãy lấy phần ức của con chiên đực dùng trong lễ phong chức cho A-rôn[a], rồi dâng nó làm lễ vật đưa qua đưa lại trước mặt Yahweh; phần ấy sẽ thuộc về con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con chiên đực dùng trong lễ thánh hiến.” Từ Hê-bơ-rơ ở đây là thuật ngữ chỉ nghi lễ thiết lập A-rôn vào chức vụ tư tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָזֶה
  choice: phần ức
  rationale: Trong luật tế lễ, từ này chỉ phần ức của con vật được phân chia theo nghi thức; “phần ức” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: אֵיל הַמִּלֻּאִים
  choice: con chiên đực dùng trong lễ phong chức
  rationale: אַיִל là chiên đực; הַמִּלֻּאִים là thuật ngữ chỉ nghi lễ thiết lập A-rôn vào chức vụ tư tế. Cách dịch này sáng nghĩa mà không gán các cơ cấu giáo hội về sau vào bản văn.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: cho A-rôn
  rationale: Giữ quan hệ rộng của giới từ לְ, xác định con chiên gắn với A-rôn mà không diễn giải thành quyền sở hữu.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: đưa qua đưa lại như một lễ vật đưa qua đưa lại
  rationale: Động từ và danh từ cùng gốc tạo thành một biểu thức nghi lễ. Cách dịch giữ được cả hành động lẫn tính chất lễ vật, dù sự lặp lại phản ánh lối diễn đạt của nguyên văn.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: “Trước mặt” diễn đạt tự nhiên ý hiện diện trong bối cảnh thờ phượng; danh riêng Yahweh bảo tồn tên giao ước trong nguyên văn.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: phần ấy sẽ thuộc về con
  rationale: מָנָה là phần được phân chia. Cách dịch diễn đạt rõ rằng phần ức được cấp cho Môi-se, là người đang được xưng hô ở ngôi thứ hai số ít.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước יהוה; phiên âm “Yahweh” phân biệt danh này với một tước hiệu.
- issue: Ý nghĩa của הַמִּלֻּאִים trong nghi lễ tư tế
  choice: lễ phong chức
  alternative: lễ thánh hiến
  rationale: Bối cảnh nói đến việc thiết lập A-rôn vào chức vụ tư tế. “Phong chức” làm rõ phương diện nhận chức, còn “thánh hiến” là khả năng dịch hợp lệ và được giữ trong chú thích.
- issue: Chủ thể nhận phần được phân chia
  choice: thuộc về con
  alternative: là phần của con
  rationale: Đại từ ngôi thứ hai số ít chỉ Môi-se trong lời truyền; bản dịch giữ cách xưng hô trực tiếp và không mở rộng phần này sang toàn thể hàng tư tế.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Dùng “con” vì Yahweh đang trực tiếp phán với Môi-se trong mạch văn; giữ “Yahweh” theo dạng phiên âm. Cụm nghi lễ được diễn đạt rõ nghĩa cho độc giả phổ thông, đồng thời chú thích bảo tồn phương án “thánh hiến”.
