    rationale: Cấu trúc Hê-bơ-rơ dùng một động từ cùng gốc với danh từ nghi lễ; tiếng Việt có thể giữ tương ứng này rõ hơn bằng “dâng nó làm lễ vật đưa qua đưa lại,” không làm thay đổi ý nghĩa nghi thức.
