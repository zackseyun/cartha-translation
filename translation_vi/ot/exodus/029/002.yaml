  to: cùng bánh không men, các bánh không men[a] trộn với dầu, và các bánh mỏng không men phết dầu[b]. Con phải làm các thứ ấy bằng bột mì mịn.
  rationale: Bỏ “tròn” để không thêm thông tin không được xác định trong tiếng Hê-bơ-rơ; dùng “các bánh không men” như cách dịch trung tính và tự nhiên cho חַלּוֹת מַצּוֹת. Đổi “trộn dầu” thành “trộn với dầu” để diễn đạt rõ bánh được trộn với dầu. Di chuyển chú thích a đến đúng từ được chú giải và rút phần diễn giải về hình dạng khỏi chú thích.
