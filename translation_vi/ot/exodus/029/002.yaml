  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: vi
  text: cùng bánh không men, các bánh không men[a] trộn với dầu, và các bánh mỏng không men phết dầu[b]. Con phải làm các thứ ấy bằng bột mì mịn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ổ bánh không men”; từ Hê-bơ-rơ có thể chỉ một chiếc bánh hoặc ổ bánh.
    reason: lexical_alternative
  - marker: b
    text: Dịch sát là “xức dầu”; đây là động từ thông thường mang nghĩa “xức”, nhưng trong ngữ cảnh này nó mô tả việc phết dầu lên bánh mỏng.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: bánh không men
  rationale: Cách dịch tự nhiên, quen thuộc trong văn cảnh nghi lễ, diễn đạt loại bánh không được làm cho lên men.
- source_word: חַלֹּת מַצֹּת
  choice: bánh tròn không men
  rationale: חַלָּה chỉ một chiếc bánh hoặc ổ bánh, thường có dạng tròn; thêm “tròn” giúp phân biệt với từ bánh nói chung và bánh mỏng ở vế sau.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: trộn dầu
  rationale: Phân từ bị động của בלל diễn tả việc dầu được hòa trộn vào bánh; “trộn dầu” gọn và tự nhiên trong tiếng Việt.
- source_word: רְקִיקֵי מַצּוֹת
  choice: bánh mỏng không men
  rationale: רָקִיק là loại bánh mỏng; “bánh mỏng” rõ nghĩa hơn “bánh xốp” hay từ vay mượn và giữ được sự tương phản với חַלּוֹת.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: phết dầu
  rationale: Dù משׁח thường có nghĩa là xức, trong ngữ cảnh chế biến bánh, “phết dầu” truyền đạt hành động cụ thể và tự nhiên hơn, đồng thời chú thích bảo lưu nghĩa sát chữ.
- source_word: סֹלֶת חִטִּים
  choice: bột mì mịn
  rationale: סֹלֶת là bột mịn và חִטִּים xác định nguyên liệu là lúa mì; cụm này vừa chính xác vừa tự nhiên.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Con phải làm các thứ ấy
  rationale: Thể chưa hoàn thành mang lực chỉ thị trong luật nghi lễ; “phải” thể hiện rõ tính mệnh lệnh, còn “các thứ ấy” quy chiếu toàn bộ những loại bánh vừa kể.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Con” theo lời Đức Chúa Trời truyền trực tiếp cho Môi-se trong ngữ cảnh liền trước; giữ cấu trúc liệt kê của tiếng Hê-bơ-rơ nhưng chia câu tự nhiên trong tiếng Việt.
