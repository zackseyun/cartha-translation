revisions:
- from: Mỗi ngày, con phải dâng một con bò đực làm lễ vật chuộc tội để làm lễ chuộc tội[a]. Con phải thanh tẩy bàn thờ khi làm lễ chuộc tội cho bàn thờ, rồi xức dầu để thánh hiến bàn thờ.
  to: Mỗi ngày, con phải dâng một con bò đực làm lễ vật chuộc tội, dùng cho nghi thức chuộc tội[a]. Con phải thanh tẩy bàn thờ khi làm lễ chuộc tội cho bàn thờ, rồi xức dầu cho bàn thờ để thánh hiến nó.
  rationale: Chỉnh sửa chỉ nhằm làm câu tiếng Việt tự nhiên và minh bạch hơn. “Dùng cho nghi thức chuộc tội” bảo toàn sự phân biệt giữa חַטָּאת (lễ vật chuộc tội/thanh tẩy) và כִּפֻּרִים (nghi thức chuộc tội), còn “xức dầu cho bàn thờ” biểu đạt rõ đối tượng của hậu tố nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:50:11Z'
