source:
  edition: WLC
  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: vi
  text: Mỗi ngày, con phải dâng một con bò đực làm lễ vật chuộc tội, dùng cho nghi thức chuộc tội[a]. Con phải thanh tẩy bàn thờ khi làm lễ chuộc tội cho bàn thờ, rồi xức dầu cho bàn thờ để thánh hiến nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một con bò đực làm lễ vật thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ “tội lỗi”, hoặc trong ngữ cảnh tế lễ, chỉ lễ vật dùng để thanh tẩy khỏi tội lỗi hay sự ô uế.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: một con bò đực
  rationale: Từ này chỉ bò đực; bản thân từ Hê-bơ-rơ ở đây không nhất thiết nhấn mạnh con vật còn non.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ lễ vật liên quan đến việc xử lý tội lỗi hoặc sự ô uế; cách dịch quen thuộc này dễ hiểu, còn sắc thái 'lễ vật thanh tẩy' được giữ trong chú thích.
- source_word: לַיּוֹם
  choice: mỗi ngày
  rationale: Ngữ cảnh nghi thức lặp lại cho thấy ý phân phối theo từng ngày.
- source_word: עַל הַכִּפֻּרִים
  choice: để làm lễ chuộc tội
  rationale: Danh từ số nhiều chỉ các nghi thức chuộc tội/thanh tẩy; tiếng Việt tự nhiên dùng cụm số ít mang nghĩa khái quát.
- source_word: וְחִטֵּאתָ
  choice: thanh tẩy
  rationale: Dạng piel của חטא trong ngữ cảnh tế tự nói đến việc tẩy sạch một vật thánh về mặt nghi lễ, không hàm ý bàn thờ đã phạm tội.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Cách gọi chuẩn và tự nhiên trong ngữ cảnh Đền Tạm.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: khi làm lễ chuộc tội cho bàn thờ
  rationale: Giới từ ב trước động từ nguyên mẫu có thể mang nghĩa thời gian hoặc phương tiện. 'Khi' giữ cách hiểu thời gian; lặp lại 'bàn thờ' giúp đại từ chỉ vật được rõ nghĩa trong tiếng Việt.
- source_word: וּמָשַׁחְתָּ
  choice: xức dầu
  rationale: Đây là động từ tiêu chuẩn chỉ việc bôi dầu trong nghi thức thánh hiến.
- source_word: לְקַדְּשׁוֹ
  choice: để thánh hiến bàn thờ
  rationale: Động từ קדשׁ ở đây nói đến việc biệt riêng bàn thờ làm vật thánh để dùng trong việc thờ phượng.
theological_decisions:
- issue: Diễn đạt ngôn ngữ thanh tẩy và chuộc tội trong nghi lễ mà không đưa vào các phạm trù thần học về sau
  choice: Dùng 'lễ vật chuộc tội', 'thanh tẩy' và 'làm lễ chuộc tội' theo nghĩa nghi lễ tại Đền Tạm
  alternative: Có thể dịch חַטָּאת là 'lễ vật thanh tẩy' và וְחִטֵּאתָ là 'tẩy sạch'
  rationale: Câu này nói về việc thánh hiến bàn thờ bằng nghi thức tế lễ. 'Thanh tẩy bàn thờ' cho thấy đây là sự làm sạch về mặt nghi lễ, chứ không phải sự tha thứ cho một vật vô tri.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ''con'' theo ngữ cảnh Đức Chúa Trời truyền lệnh trực tiếp cho Môi-se; lặp lại ''bàn thờ'' thay đại từ để câu tiếng Việt rõ ràng. Giữ các thuật ngữ nghi lễ phân biệt: ''chuộc tội'', ''thanh tẩy'', ''xức dầu'', ''thánh hiến''.'
