source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: vi
  text: Họ sẽ biết rằng ta là Yahweh, Đức Chúa Trời của họ[a], Đấng đã đưa họ ra khỏi đất Ai Cập để ta ngự giữa họ[b]. Ta là Yahweh, Đức Chúa Trời của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đấng đã đưa họ ra từ đất Ai Cập để ngự giữa họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “ở giữa họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Họ sẽ biết
  rationale: Dạng động từ trong mạch văn mang ý nghĩa tương lai hoặc kết quả; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái lời hứa trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיהֶם
  choice: Đức Chúa Trời của họ
  rationale: Trong kết cấu với danh Yahweh và trong bối cảnh giao ước, danh từ có nghĩa số ít, chỉ Đức Chúa Trời của Israel.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: đã đưa họ ra khỏi đất Ai Cập
  rationale: Phản ánh thành ngữ xuất hành quen thuộc và giới từ chỉ sự rời khỏi một nơi.
- source_word: לְשָׁכְנִי
  choice: để ta ngự
  rationale: Nguyên mẫu với לְ diễn tả mục đích; “ngự” phù hợp với sự hiện diện của Đức Chúa Trời trong nơi thánh mà vẫn dễ hiểu.
- source_word: בְתוֹכָם
  choice: giữa họ
  rationale: Diễn đạt tự nhiên ý nghĩa Đức Chúa Trời hiện diện ngay trong cộng đồng dân Ngài, đồng thời sát với nghĩa đen “ở giữa họ”.
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: Ta là Yahweh, Đức Chúa Trời của họ
  rationale: Giữ công thức giao ước nhấn mạnh ở cuối câu và thể hiện rõ Yahweh là Đức Chúa Trời của họ.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH; phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ mục đích của cuộc xuất hành
  choice: để ta ngự giữa họ
  alternative: và ta ngự giữa họ
  rationale: 'לְ trước nguyên mẫu שׁכן phù hợp nhất với ý mục đích: Đức Chúa Trời đưa dân ra khỏi Ai Cập nhằm ngự giữa họ. Cách dịch không mở rộng điều câu văn tự nói.'
- issue: Phạm vi của mệnh đề quan hệ אֲשֶׁר
  choice: 'Gắn với “Yahweh, Đức Chúa Trời của họ”: “Đấng đã đưa họ…”'
  alternative: 'Có thể đọc liền toàn mệnh đề: “họ sẽ biết rằng ta là Yahweh, Đức Chúa Trời của họ, Đấng đã đưa họ…”'
  rationale: Tiếng Hê-bơ-rơ không có dấu câu hiện đại; bản dịch dùng “Đấng” để làm rõ chủ thể là Yahweh nhưng không thay đổi nội dung mệnh đề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta” giữ lời phán trực tiếp đầy uy quyền của Đức Chúa Trời. “Ngự” được dùng thay cho “ở” vì bối cảnh là sự hiện diện thánh của Đức Chúa Trời giữa dân, nhưng không dùng lối diễn đạt quá cổ.
