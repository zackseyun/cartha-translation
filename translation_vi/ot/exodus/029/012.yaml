revisions:
- from: Ngươi phải lấy một phần máu con bò đực, dùng ngón tay bôi lên các sừng của bàn thờ,[a] rồi đổ toàn bộ phần máu còn lại[b] nơi chân bàn thờ.[c]
  to: Ngươi phải lấy một phần máu của con bò đực, dùng ngón tay bôi lên các sừng của bàn thờ,[a] rồi đổ toàn bộ máu tại chân bàn thờ.[b]
  rationale: Bản sửa loại bỏ “còn lại” và chú thích liên quan để không thêm nội dung suy diễn vào câu. Đồng thời giữ nguyên các nét nghi lễ cụ thể và sửa chú thích về יסוד theo cách tự nhiên, sát nghĩa hơn.
