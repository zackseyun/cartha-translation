  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לָֽקַחְתָּ֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/נָתַתָּ֛ה עַל קַרְנֹ֥ת הַ/מִּזְבֵּ֖חַ בְּ/אֶצְבָּעֶ֑/ךָ וְ/אֶת כָּל הַ/דָּ֣ם תִּשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: vi
  text: Ngươi phải lấy một phần máu của con bò đực, dùng ngón tay bôi lên các sừng của bàn thờ,[a] rồi đổ toàn bộ máu tại chân bàn thờ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sừng” là những phần nhô lên giống như sừng tại các góc của bàn thờ.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đến chân đế bàn thờ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Ngươi phải lấy
  rationale: Dạng hoàn thành Qal nối tiếp trong chuỗi chỉ dẫn mang lực mệnh lệnh. “Ngươi phải” truyền đạt rõ lời chỉ thị trực tiếp mà vẫn giữ ngôi số ít.
- source_word: מִדַּם הַפָּר
  choice: một phần máu con bò đực
  rationale: 'Giới từ מִן có nghĩa phân lượng trong ngữ cảnh này: chỉ một phần máu được lấy để bôi lên bàn thờ.'
- source_word: וְנָתַתָּה ... בְּאֶצְבָּעֶךָ
  choice: dùng ngón tay bôi
  rationale: נתן có nghĩa rộng là đặt/đưa; trong nghi thức dùng ngón tay đưa máu lên sừng bàn thờ, “bôi” diễn đạt tự nhiên hành động ấy. בְּ mang nghĩa phương tiện, được thể hiện bằng “dùng”.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: lên các sừng của bàn thờ
  rationale: Giữ hình ảnh cụ thể “sừng”, tức các phần nhô lên như sừng ở những góc bàn thờ, thay vì khái quát hóa thành “các góc”.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: rồi đổ toàn bộ phần máu còn lại
  rationale: שׁפך là “đổ”. Trong mạch văn, כָּל הַדָּם chỉ toàn bộ lượng máu sau phần đã lấy; thêm “còn lại” làm rõ quan hệ ngữ cảnh mà không thay đổi trình tự nghi lễ.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: nơi chân bàn thờ
  rationale: יְסוֹד là nền hoặc phần chân đế. “Chân bàn thờ” là cách nói tự nhiên trong tiếng Việt; אֶל có thể chỉ hướng đến hoặc vị trí sát phần chân.
theological_decisions:
- issue: Tính cụ thể của thuật ngữ nghi lễ về bàn thờ
  choice: Giữ “các sừng của bàn thờ” và dịch יְסוֹד là “chân bàn thờ”.
  alternative: Diễn giải thành “các góc” và “nền móng của bàn thờ”.
  rationale: Câu này mô tả chính xác nghi thức phong chức. Giữ các đặc điểm vật thể của bàn thờ bảo toàn sắc thái nghi lễ mà không đưa thêm cách giải thích giáo lý.
- issue: Phạm vi của “toàn bộ máu” sau khi đã lấy một phần
  choice: “toàn bộ phần máu còn lại”
  alternative: “toàn bộ máu”
  rationale: Vế đầu đã lấy một phần máu để bôi lên sừng bàn thờ, nên trong tiến trình thực tế, “toàn bộ máu” ở vế sau là toàn bộ lượng còn lại. Chú thích ghi nhận rằng “còn lại” được hiểu theo ngữ cảnh.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và dễ hiểu trong tiếng Việt hiện đại. Dùng “ngươi” để giữ lời truyền trực tiếp ở ngôi thứ hai số ít trong ngữ cảnh Đức Chúa Trời chỉ dạy Môi-se; giữ thuật ngữ nghi lễ cụ thể “sừng của bàn thờ”.
