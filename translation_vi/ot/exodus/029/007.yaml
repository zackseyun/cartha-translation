  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: vi
  text: Rồi con hãy lấy dầu xức, đổ lên đầu người và xức dầu cho người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Rồi con hãy lấy
  rationale: Động từ Qal hoàn thành có liên từ đứng trước nằm trong chuỗi chỉ dẫn nghi lễ. “Rồi” diễn đạt tự nhiên bước kế tiếp, còn “con hãy lấy” giữ sắc thái mệnh lệnh trực tiếp đối với Môi-se.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Cụm cấu tạo chỉ loại dầu dùng trong nghi thức xức phong. “Dầu xức” ngắn gọn, tự nhiên và giữ nguyên chức năng nghi lễ của dầu.
- source_word: וְיָצַקְתָּ
  choice: đổ
  rationale: יצק ở đây mang nghĩa thông thường là “đổ”. Cách dịch này bảo toàn hành động cụ thể được phân biệt với hành động xức dầu theo sau.
- source_word: עַל רֹאשׁוֹ
  choice: lên đầu người
  rationale: עַל trong ngữ cảnh chuyển động của chất lỏng được diễn đạt tự nhiên bằng “lên”; đại từ “người” chỉ A-rôn theo văn cảnh và có sắc thái trang trọng phù hợp.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: và xức dầu cho người
  rationale: משׁח là động từ nghi lễ “xức dầu”. Không diễn giải thành “biệt riêng” hay “tấn phong”, nhằm giữ hành động cụ thể và không thu hẹp ý nghĩa thần học.
theological_decisions:
- issue: Mối quan hệ giữa việc đổ dầu và việc xức dầu
  choice: 'Giữ hai hành động riêng biệt: “đổ lên đầu người và xức dầu cho người”.'
  alternative: 'Gộp thành một ý: “xức dầu cho người bằng cách đổ dầu lên đầu”.'
  rationale: Bản Hê-bơ-rơ dùng hai động từ phối hợp, vừa nêu hành động vật lý là đổ dầu vừa nêu hành động nghi lễ là xức dầu. Giữ cả hai tránh biến một hành động thành lời giải thích cho hành động kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” cho người được truyền lệnh và “người” cho A-rôn để hạn chế sự nhập nhằng giữa hai đại từ nam số ít trong tiếng Việt.
