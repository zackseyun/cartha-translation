source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תַּקְרִ֔יב אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: vi
  text: Hãy đưa A-rôn và các con trai ông đến lối vào Lều Hội Kiến[a], rồi rửa họ bằng nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trình diện A-rôn và các con trai ông.” Động từ Hê-bơ-rơ có thể mang sắc thái nghi lễ, chỉ việc đưa một người đến để thực hiện nghi thức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: đưa ... đến gần
  rationale: Dạng Hiphil của קרב có nghĩa là đem hoặc đưa đến gần, và trong bối cảnh phong chức tế lễ còn có sắc thái trình diện cho nghi thức. Cách dịch này giữ được cả ý chuyển động lẫn sắc thái nghi lễ.
- source_word: אֶל
  choice: đến gần
  rationale: Giới từ chỉ hướng tới một địa điểm; trong tiếng Việt, khi đi với 'đưa ... đến gần' cách diễn đạt này tự nhiên và sát nghĩa.
- source_word: פֶּתַח
  choice: lối vào
  rationale: Từ này chỉ chỗ mở hoặc lối vào, không nhất thiết hàm ý một cánh cửa.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Danh xưng quen thuộc, trang trọng cho nơi được ấn định để gặp gỡ trong bối cảnh đền tạm.
- source_word: וְרָחַצְתָּ
  choice: rồi ... tắm rửa
  rationale: רחץ nghĩa là rửa hoặc tắm. Liên từ mở đầu động từ biểu thị bước kế tiếp trong chuỗi chỉ thị, nên 'rồi' làm rõ trình tự mà không thêm ý nghĩa ngoài văn bản.
- source_word: אֹתָם בַּמָּיִם
  choice: dùng nước tắm rửa cho họ
  rationale: ב đánh dấu phương tiện; 'dùng nước' là cách diễn đạt tự nhiên trong tiếng Việt. 'Tắm rửa cho họ' phù hợp với việc thanh tẩy toàn thân trong nghi thức hơn cách nói hẹp 'rửa họ'.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt thông dụng.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Danh từ chỉ rõ những người con thuộc giới nam, điều có ý nghĩa trong bối cảnh phong chức tư tế.
theological_decisions:
- issue: Sắc thái nghi lễ của קרב trong bối cảnh phong chức tư tế
  choice: đưa A-rôn và các con trai ông đến gần
  alternative: trình diện A-rôn và các con trai ông
  rationale: '''Đưa ... đến gần'' bảo toàn hình ảnh đến gần nơi thánh và không xác định quá mức hành động là một nghi thức ''trình diện''; chú thích ghi nhận nghĩa nghi lễ khả dĩ.'
- issue: Phạm vi của hành động רחץ
  choice: dùng nước tắm rửa cho họ
  alternative: lấy nước rửa họ
  rationale: Động từ có thể chỉ rửa hoặc tắm; trong nghi thức thanh tẩy con người, 'tắm rửa' tự nhiên và có khả năng phản ánh hành động toàn diện hơn, nhưng không thêm một ý nghĩa thần học riêng biệt.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Dùng 'Hãy' cho chỉ thị trực tiếp và 'rồi' để thể hiện trình tự nghi lễ. 'Lều Hội Kiến' được viết hoa như một danh xưng; đại từ 'ông' tránh lặp tên mà vẫn rõ nghĩa.
