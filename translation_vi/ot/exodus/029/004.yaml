revisions:
- from: Hãy đưa A-rôn và các con trai ông đến gần lối vào Lều Hội Kiến[a], rồi dùng nước tắm rửa cho họ.
  to: Hãy đưa A-rôn và các con trai ông đến lối vào Lều Hội Kiến[a], rồi rửa họ bằng nước.
  rationale: Bản sửa đưa giới từ chỉ hướng và danh từ “lối vào” về quan hệ trực tiếp “đến lối vào”, đồng thời dùng “rửa họ bằng nước” để theo sát động từ רחץ và cụm chỉ phương tiện בַּמָּיִם. Chú thích tiếp tục ghi nhận lựa chọn “trình diện” như một khả năng có sắc thái nghi lễ, nhưng không áp đặt cách hiểu này lên bản văn chính.
  reviewer_model: gpt-5.6-terra
