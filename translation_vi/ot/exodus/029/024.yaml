  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: vi
  text: Hãy đặt tất cả các phần ấy trên lòng bàn tay A-rôn và trên lòng bàn tay các con trai ông[a], rồi hãy đưa chúng qua lại như lễ vật đưa qua lại trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “trên lòng bàn tay A-rôn và trên lòng bàn tay các con trai ông.” Một số bản dịch dùng từ rộng hơn là “tay”, nhưng từ Hê-bơ-rơ ở đây cụ thể hơn, chỉ “lòng bàn tay”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Con hãy đặt
  rationale: Dạng Qal hoàn thành nối tiếp trong chuỗi chỉ thị mang chức năng mệnh lệnh. “Hãy đặt” tự nhiên và rõ ràng trong tiếng Việt hiện đại; “con” phù hợp với lời Đức Chúa Trời trực tiếp truyền cho Môi-se.
- source_word: הַכֹּל
  choice: tất cả những thứ ấy
  rationale: Cụm từ quy chiếu về các phần lễ vật đã được kể ở câu trước; cách dịch này làm rõ ý hồi chỉ mà không thêm đối tượng mới.
- source_word: עַל כַּפֵּי
  choice: trên lòng bàn tay
  rationale: כַּף có thể chỉ bàn tay nhưng cụ thể hơn là lòng bàn tay. Trong nghi thức đặt các phần lễ vật vào tay, “lòng bàn tay” giữ được hình ảnh cụ thể của nguyên văn.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dạng phiên âm quen thuộc và dễ đọc trong tiếng Việt.
- source_word: בָנָיו
  choice: các con trai ông
  rationale: Danh từ ở đây chỉ các con trai của A-rôn đang tham dự nghi lễ phong chức tư tế; “con trai” chính xác hơn từ bao quát “con cái”.
- source_word: וְהֵנַפְתָּ
  choice: rồi đưa chúng qua đưa lại
  rationale: Dạng Hiphil của נוף trong bối cảnh tế lễ chỉ động tác nghi lễ đưa lễ vật qua lại để trình dâng. Cách diễn đạt này tự nhiên hơn “vẫy” trong tiếng Việt và vẫn giữ hình ảnh của hành động.
- source_word: אֹתָם
  choice: chúng
  rationale: Đại từ tân ngữ giống đực số nhiều quy chiếu đến nhiều phần lễ vật; “chúng” giữ nguyên số nhiều của tiếng Hê-bơ-rơ.
- source_word: תְּנוּפָה
  choice: làm lễ vật
  rationale: Danh từ gọi tên tính chất/kết quả tế lễ của động tác đưa qua đưa lại. Kết hợp với động từ ngay trước, “đưa chúng qua đưa lại làm lễ vật” truyền đạt đầy đủ mà tránh lặp nặng nề.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: “Trước mặt” diễn đạt trực tiếp ý hiện diện trong bối cảnh nghi lễ; danh riêng Yahweh giữ danh giao ước được ghi trong nguyên văn.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. “Yahweh” phiên âm danh giao ước thay vì thay thế bằng một tước hiệu, đồng thời không áp đặt cách đọc “Jehovah” muộn hơn.
- issue: Ý nghĩa nghi lễ của נוף / תְּנוּפָה
  choice: đưa qua đưa lại làm lễ vật
  alternative: dâng lên; nâng lên làm lễ vật
  rationale: Động từ và danh từ có thể nhấn mạnh việc vẫy/đưa qua lại hoặc trình dâng/nâng lễ vật. Bản dịch giữ hình ảnh chuyển động truyền thống nhưng không giải thích thêm hướng hoặc hình thức của động tác mà nguyên văn không nêu rõ.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng câu mệnh lệnh trực tiếp phù hợp với lời chỉ dẫn nghi lễ; tránh từ cổ “ngươi” và giữ thuật ngữ cụ thể “lòng bàn tay”. Đại từ “ông” quy chiếu rõ về A-rôn.
