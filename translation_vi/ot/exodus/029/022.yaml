base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: vi
  text: Hãy lấy từ con chiên đực phần mỡ, chiếc đuôi mỡ, phần mỡ bọc nội tạng, phần phụ của gan, hai quả thận cùng phần mỡ trên đó, và đùi phải, vì đó là con chiên đực dùng trong lễ tấn phong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con chiên đực dùng trong lễ biệt riêng” hoặc “con chiên đực dùng trong lễ lập chức”. Cụm từ Hê-bơ-rơ chỉ con chiên được dùng trong nghi thức đưa các thầy tế lễ vào chức vụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: phần mỡ
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ những phần mỡ của con vật được quy định riêng; “phần mỡ” vừa trực tiếp vừa tự nhiên trong tiếng Việt.
- source_word: אַלְיָה
  choice: chiếc đuôi mỡ
  rationale: Từ Hê-bơ-rơ chỉ chiếc đuôi tích mỡ đặc trưng của chiên, chứ không chỉ chiếc đuôi nói chung.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: bọc nội tạng
  rationale: Cụm từ mô tả phần mỡ phủ các cơ quan bên trong; “nội tạng” rõ nghĩa và phù hợp với văn cảnh nghi lễ.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: phần thùy của gan
  rationale: Danh từ chỉ một phần nhô ra hoặc phần phụ của gan; vị trí giải phẫu chính xác còn được bàn luận, nên “phần thùy của gan” diễn đạt dễ hiểu mà không xác định quá mức.
- source_word: כְּלָיֹת
  choice: hai quả thận
  rationale: Danh từ ở dạng số đôi/số nhiều chỉ hai quả thận theo nghĩa giải phẫu thông thường.
- source_word: שׁוֹק הַיָּמִין
  choice: đùi phải
  rationale: Trong cách phân chia phần thịt tế lễ, שׁוֹק chỉ phần đùi hoặc chân; “đùi phải” diễn đạt cụ thể phần thịt được nói đến.
- source_word: אֵיל מִלֻּאִים
  choice: con chiên đực dùng trong lễ tấn phong
  rationale: Cụm từ chỉ con chiên đực được dùng trong nghi thức đưa các thầy tế lễ vào chức vụ; cách dịch này nêu rõ công dụng nghi lễ mà không gán cho nó cơ cấu giáo hội về sau.
- source_word: וְלָקַחְתָּ
  choice: Hãy lấy
  rationale: Dạng động từ trong chuỗi chỉ dẫn mang lực mệnh lệnh; “Hãy lấy” tự nhiên trong tiếng Việt và không cần thêm đại từ xưng hô vốn không có trong động từ Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch thuật ngữ nghi lễ אֵיל מִלֻּאִים
  choice: con chiên đực dùng trong lễ tấn phong
  alternative: con chiên đực dùng trong lễ biệt riêng; con chiên đực dùng trong lễ lập chức
  rationale: Ngữ cảnh nói đến nghi thức đưa A-rôn và các con trai ông vào chức vụ tế lễ. “Tấn phong” truyền đạt được ý nghĩa này trong tiếng Việt hiện đại, còn các cách dịch khả dĩ khác được giữ trong chú thích để không che lấp phạm vi nghĩa của thành ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng dễ hiểu. Lược đại từ chủ ngữ ở đầu câu để tránh chọn một cách xưng hô không được biểu thị riêng trong nguyên văn; dùng thuật ngữ giải phẫu phổ thông và giữ nhịp liệt kê của câu Hê-bơ-rơ.
