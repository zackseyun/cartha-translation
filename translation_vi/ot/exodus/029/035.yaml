base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: vi
  text: Hãy làm như vậy cho A-rôn và các con trai ông, đúng theo mọi điều Ta đã truyền cho ngươi. Trong bảy ngày, ngươi phải lập họ vào chức tế lễ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “làm đầy tay họ”, một thành ngữ Hê-bơ-rơ chỉ việc lập hoặc chính thức đưa một người vào chức vụ tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Hãy làm
  rationale: Dạng động từ nối tiếp trong văn mệnh lệnh mang lực chỉ thị; “Hãy làm” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: cho A-rôn và các con trai ông
  rationale: Giới từ לְ đánh dấu những người được thực hiện nghi thức cho; “cho” phù hợp với ngữ cảnh nghi lễ.
- source_word: כָּכָה
  choice: như vậy
  rationale: Trạng từ chỉ cách thức quy chiếu về nghi thức đã được mô tả trước đó.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: đúng theo mọi điều Ta đã truyền cho ngươi
  rationale: Giữ cả ý tuân theo và tính toàn diện của כְּכֹל; cách diễn đạt trang trọng nhưng dễ hiểu.
- source_word: שִׁבְעַת יָמִים
  choice: Trong bảy ngày
  rationale: Cụm danh từ làm trạng ngữ chỉ khoảng thời gian kéo dài của nghi thức.
- source_word: תְּמַלֵּא יָדָם
  choice: ngươi phải lập họ vào chức tế lễ
  rationale: Thành ngữ tư tế nghĩa đen là “làm đầy tay họ”, nhưng trong ngữ cảnh này chỉ việc chính thức thiết lập họ vào chức vụ tế lễ. Bản dịch truyền đạt chức năng của thành ngữ mà không du nhập sắc thái hệ phái.
theological_decisions:
- issue: Cách dịch thành ngữ tư tế מִלֵּא יָד
  choice: lập họ vào chức tế lễ
  alternative: làm đầy tay họ; phong chức cho họ; biệt riêng họ
  rationale: Cụm từ chỉ nghi thức trao và xác lập chức vụ tư tế. “Lập họ vào chức tế lễ” vừa rõ nghĩa trong tiếng Việt, vừa tránh gắn câu với quan niệm phong chức riêng của một truyền thống; nghĩa đen được ghi ở chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ta/ngươi” để giữ lời phán trực tiếp và sắc thái trang nghiêm; tên riêng được phiên âm “A-rôn”. Dấu chú thích [a] đặt ngay sau thành ngữ tương ứng.
