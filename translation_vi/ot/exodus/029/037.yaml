base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: vi
  text: Trong bảy ngày, con phải làm lễ xá tội cho bàn thờ và thánh hóa nó; bàn thờ sẽ là chí thánh. Bất cứ ai hay vật gì chạm vào bàn thờ đều sẽ trở nên thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Bất cứ ai hay vật gì chạm vào bàn thờ đều phải là thánh.” Tiếng Hê-bơ-rơ có thể được hiểu là sự thánh được truyền qua việc tiếp xúc, hoặc là quy định rằng chỉ người hay vật thánh mới được chạm vào bàn thờ.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר עַל הַמִּזְבֵּחַ
  choice: làm lễ chuộc tội cho bàn thờ
  rationale: Trong văn cảnh nghi lễ tư tế, כפר chỉ việc cử hành nghi thức chuộc tội hoặc thanh tẩy, còn עַל đánh dấu đối tượng được thực hiện nghi thức ấy. Cách dịch này tự nhiên trong tiếng Việt mà không xác định quá mức cơ chế nghi lễ.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: và thánh hóa nó
  rationale: Diễn đạt việc làm cho bàn thờ nên thánh, được biệt riêng cho mục đích thờ phượng; phù hợp với văn phong nghi lễ trang trọng.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: chí thánh
  rationale: Cấu trúc lặp của tiếng Hê-bơ-rơ biểu thị mức độ cao nhất của sự thánh khiết. “Chí thánh” ngắn gọn, trang trọng và tự nhiên đối với một vật thờ phượng.
- source_word: כָּל הַנֹּגֵעַ
  choice: bất cứ ai hay vật gì chạm vào
  rationale: Phân từ với כָּל có phạm vi rộng, có thể chỉ người hoặc vật. Nêu cả hai giúp tiếng Việt bảo toàn độ rộng của nguyên văn.
- source_word: יִקְדָּשׁ
  choice: đều sẽ trở nên thánh
  rationale: 'Dạng động từ ở đây tự nhiên được hiểu theo nghĩa kết quả: chủ thể bước vào trạng thái thánh do tiếp xúc với bàn thờ; đồng thời chú thích giữ lại cách hiểu mệnh lệnh hoặc điều kiện.'
theological_decisions:
- issue: Ý nghĩa của sự thánh khi tiếp xúc với bàn thờ
  choice: Sự tiếp xúc với bàn thờ đã được thánh hóa khiến người hoặc vật chạm vào đó trở nên thánh.
  alternative: Chỉ người hoặc vật đã thánh mới được phép chạm vào bàn thờ, hay bất cứ ai chạm vào đều phải ở trong tình trạng thánh.
  rationale: Cách đọc theo kết quả phù hợp trực tiếp với יִקְדָּשׁ sau mệnh đề “bất cứ ai hay vật gì chạm vào bàn thờ”; tuy nhiên, cú pháp cũng từng được hiểu theo nghĩa quy định hoặc điều kiện, nên sự căng thẳng này được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “con” theo lời chỉ dẫn trực tiếp dành cho Môi-se trong ngữ cảnh; dùng “chí thánh” cho thành ngữ nghi lễ bậc cao nhất. Chú thích được đặt sau câu có cách hiểu khác và ký hiệu [a] xuất hiện trong chính văn.
