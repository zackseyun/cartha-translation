base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: vi
  text: Con chiên thứ nhất, ngươi phải dâng vào buổi sáng; còn con chiên thứ hai, ngươi phải dâng vào giữa hai buổi chiều[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “giữa hai buổi chiều”, một thành ngữ truyền thống thường được hiểu là “vào lúc chạng vạng” hoặc là khoảng thời gian từ cuối buổi chiều đến khi mặt trời lặn.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: con chiên
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ chiên non dùng làm lễ vật. “Con chiên” là cách diễn đạt tự nhiên, trang trọng và không xác định giới tính quá mức trong tiếng Việt.
- source_word: הָאֶחָד
  choice: thứ nhất
  rationale: Dù nghĩa sát là “một/con thứ nhất”, trong cặp đối ứng với הַשֵּׁנִי, “thứ nhất” diễn đạt rõ trình tự mà không làm thay đổi ý nghĩa.
- source_word: תַּעֲשֶׂה
  choice: con phải dâng
  rationale: Động từ עשה có nghĩa cơ bản là “làm”, nhưng trong chỉ thị tế lễ mang nghĩa thực hiện việc dâng lễ. “Dâng” truyền đạt đúng hành động tế lễ bằng tiếng Việt tự nhiên.
- source_word: בַבֹּקֶר
  choice: vào buổi sáng
  rationale: Cách diễn đạt thời gian tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: הַשֵּׁנִי
  choice: thứ hai
  rationale: Giữ rõ thứ tự của hai con chiên được dâng hằng ngày.
- source_word: בֵּין הָעַרְבָּיִם
  choice: vào khoảng giữa hai buổi chiều
  rationale: Giữ hình ảnh và sự mơ hồ thực sự của thành ngữ Hê-bơ-rơ, đồng thời thêm “khoảng” để câu tiếng Việt tự nhiên hơn; chú thích nêu cách hiểu thông dụng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phản ánh lời Đức Chúa Trời trực tiếp truyền cho Môi-se trong ngữ cảnh gần. Dấu chấm phẩy làm rõ hai vế song song. Thành ngữ chỉ thời gian được giữ trong câu chính để không xóa bỏ sự mơ hồ của nguyên văn.
