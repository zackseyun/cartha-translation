base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: vi
  text: Ngươi phải thắt đai cho họ, tức là cho A-rôn và các con trai ông, rồi đội mũ cho họ. Chức tư tế sẽ thuộc về họ; đây là một quy định lâu dài. Như vậy, ngươi sẽ phong chức tư tế cho A-rôn và các con trai ông[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “làm đầy tay A-rôn và tay các con trai ông”, một thành ngữ Hê-bơ-rơ chỉ việc thiết lập hoặc phong họ vào chức vụ tư tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: thắt đai
  rationale: Động từ חגר cùng với אַבְנֵט chỉ hành động mang và thắt dải đai của lễ phục tư tế; “thắt đai” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אַהֲרֹן וּבָנָיו
  choice: tức là cho A-rôn và các con trai ông
  rationale: Cụm đồng vị xác định đại từ “họ”; thêm “tức là” làm rõ quan hệ mà không thay đổi nội dung.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: đội mũ cho họ
  rationale: חבש diễn tả việc buộc hoặc đội vật che đầu; מִגְבָּעוֹת là loại mũ đội đầu của các tư tế, phân biệt với khăn đội đầu của thượng tế. “Đội mũ” là cách nói tự nhiên trong tiếng Việt.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: Chức tư tế sẽ thuộc về họ
  rationale: Giữ rõ cấu trúc sở hữu hay sự giao phó chức vụ của tiếng Hê-bơ-rơ, đồng thời trang trọng và dễ hiểu.
- source_word: לְחֻקַּת עוֹלָם
  choice: theo một quy định lâu dài
  rationale: חֻקָּה là quy định cố định, còn עוֹלָם trong ngữ cảnh luật lệ–thờ phượng nhấn mạnh tính bền vững, tiếp diễn. “Lâu dài” giữ được lực nghĩa mà không tự quyết định câu hỏi thần học về sự vô tận tuyệt đối.
- source_word: וּמִלֵּאתָ יַד
  choice: lập ... vào chức tư tế
  rationale: Thành ngữ nghĩa đen “làm đầy tay” là thuật ngữ chỉ việc thiết lập hay phong chức cho người phục vụ tư tế. Cách dịch này nêu rõ chức vụ cụ thể trong ngữ cảnh; nghĩa đen được bảo lưu ở chú thích.
theological_decisions:
- issue: Thời hạn của quy định trong לְחֻקַּת עוֹלָם
  choice: theo một quy định lâu dài
  alternative: theo một quy định đời đời
  rationale: “Lâu dài” truyền đạt hiệu lực bền vững trong trật tự giao ước của Y-sơ-ra-ên nhưng không áp đặt kết luận rằng עוֹלָם tại đây nhất thiết có nghĩa vô tận theo nghĩa triết học.
- issue: Thành ngữ thiết lập tư tế וּמִלֵּאתָ יַד
  choice: lập A-rôn và các con trai ông vào chức tư tế
  alternative: làm đầy tay A-rôn và tay các con trai ông
  rationale: Bản văn dùng một thành ngữ kỹ thuật về việc thiết lập vào chức vụ tư tế. Dịch theo chức năng giúp độc giả hiện đại hiểu đúng, còn chú thích bảo tồn hình thức và sắc thái nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” vì lời truyền trực tiếp của Đức Chúa Trời cho Môi-se trong văn mạch luật pháp; “chức tư tế” giữ sắc thái lễ nghi. Dấu chú thích [a] được đặt ngay sau thành ngữ được giải thích.
