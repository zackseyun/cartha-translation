revisions:
- from: Ngươi phải thắt đai cho họ, tức là cho A-rôn và các con trai ông, rồi đội mũ cho họ. Chức tư tế sẽ thuộc về họ theo một quy định lâu dài. Như vậy, ngươi sẽ lập A-rôn và các con trai ông vào chức tư tế[a].
  to: Ngươi phải thắt đai cho họ, tức là cho A-rôn và các con trai ông, rồi đội mũ cho họ. Chức tư tế sẽ thuộc về họ; đây là một quy định lâu dài. Như vậy, ngươi sẽ phong chức tư tế cho A-rôn và các con trai ông[a].
  rationale: Bản sửa làm rõ chức năng pháp lý của לְחֻקַּת עוֹלָם bằng một mệnh đề xác nhận, vẫn dùng “lâu dài” để không buộc nghĩa עוֹלָם là vô tận theo nghĩa triết học. Đồng thời thay cách kết hợp từ chưa tự nhiên bằng “phong chức tư tế cho”, và giữ chú thích sát ngay sau cụm dịch thành ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:49:55Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng các hành động mặc lễ phục, sự thuộc về của chức tư tế, và thành ngữ thiết lập tư tế. Tuy nhiên, “theo một quy định lâu dài” làm quan hệ của לְחֻקַּת עוֹלָם hơi mơ hồ, như thể chức tư tế được thực hiện ‘theo’ một quy định, thay vì câu này xác nhận đó là một quy định bền vững. “Lập ... vào chức tư tế” cũng chưa tự nhiên trong tiếng Việt hiện đại.
  naturalness: “Thắt đai”, “đội mũ”, và cách xác định “A-rôn và các con trai ông” đều rõ ràng, phù hợp văn phong trang trọng. Đổi câu về quy định và dùng “phong chức tư tế” giúp câu tự nhiên, chính xác hơn mà vẫn giữ sắc thái nghi lễ.
  terminology: Giữ “A-rôn”, “chức tư tế”, và “quy định lâu dài”. “Phong chức tư tế” diễn đạt chức năng của thành ngữ מִלֵּאתָ יָד mà không áp đặt cách hiểu giáo phái; chú thích vẫn bảo lưu thành ngữ nguyên văn.
  issues:
  - severity: medium
    issue: Quan hệ của “theo một quy định lâu dài” chưa phản ánh rõ לְחֻקַּת עוֹלָם.
    rationale: Cụm tiếng Hê-bơ-rơ xác nhận chức tư tế như một quy định có hiệu lực bền vững. Tách thành mệnh đề “đây là một quy định lâu dài” tránh nghĩa phương tiện/quy chiếu mà “theo” có thể gợi ra.
  - severity: low
    issue: “Lập A-rôn ... vào chức tư tế” hơi gượng.
    rationale: “Phong chức tư tế cho A-rôn và các con trai ông” là cách diễn đạt hiện đại, trang trọng và trực tiếp hơn cho nghĩa thiết lập/ordain của thành ngữ.
  revised_text: Ngươi phải thắt đai cho họ, tức là cho A-rôn và các con trai ông, rồi đội mũ cho họ. Chức tư tế sẽ thuộc về họ; đây là một quy định lâu dài. Như vậy, ngươi sẽ phong chức tư tế cho A-rôn và các con trai ông[a].
