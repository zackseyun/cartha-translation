  - severity: low
    issue: Phương án chú thích “sẽ được biệt riêng ra thánh” không phải là cách nói tiếng Việt tự nhiên.
    rationale: “Sẽ được biệt riêng làm thánh” hoặc “sẽ được thánh hiến” diễn đạt khả năng từ vựng rõ và tự nhiên hơn.
