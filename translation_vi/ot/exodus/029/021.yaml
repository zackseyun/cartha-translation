  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: vi
  text: Rồi con hãy lấy một ít máu ở trên bàn thờ và một ít dầu xức, rồi rảy chúng trên A-rôn, trên y phục của ông, trên các con trai ông và y phục của họ, cùng với ông. Như vậy, A-rôn và y phục của ông, các con trai ông và y phục của họ, cùng với ông, sẽ nên thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ được biệt riêng làm thánh” hoặc “sẽ được thánh hiến.” Tiếng Hê-bơ-rơ dùng động từ cùng gốc với từ “thánh,” diễn tả địa vị thánh có được sau nghi thức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחְתָּ
  choice: con hãy lấy
  rationale: Dạng hoàn thành Qal nối tiếp trong chuỗi chỉ dẫn nghi lễ mang lực mệnh lệnh; “hãy lấy” diễn đạt tự nhiên, còn “con” phản ánh lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: một ít máu trên bàn thờ
  rationale: מִן chỉ việc lấy một phần; “một ít” làm rõ ý phân lượng, còn mệnh đề quan hệ được diễn đạt gọn tự nhiên bằng “trên bàn thờ”.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Cụm danh từ chỉ loại dầu dùng để xức trong nghi lễ; “dầu xức” ngắn gọn, quen thuộc và không thêm thuật ngữ giáo phái.
- source_word: הִזֵּיתָ
  choice: rảy
  rationale: Hiphil của נזה trong bối cảnh tế tự chỉ hành động rảy chất lỏng; tiếng Việt có thể dùng động từ trực tiếp mà không cần thêm đại từ tân ngữ.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: y phục ông / y phục của các con trai ông
  rationale: בגד là y phục nói chung. “Y phục” trang trọng, tự nhiên trong bối cảnh tư tế nhưng không nhập thuật ngữ giáo hội về sau.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Danh từ Hê-bơ-rơ là số nhiều giống đực và trong ngữ cảnh chỉ các con trai của A-rôn giữ chức tư tế.
- source_word: אִתּוֹ
  choice: ở cùng ông
  rationale: Giữ quan hệ trực tiếp của cụm Hê-bơ-rơ với A-rôn; “ở cùng ông” rõ hơn “cùng ông” trong chuỗi danh từ dài.
- source_word: וְקָדַשׁ
  choice: sẽ nên thánh
  rationale: Động từ קדשׁ diễn tả kết quả/trạng thái phát sinh sau nghi thức. “Sẽ nên thánh” giữ từ vựng về sự thánh khiết và thể hiện sắc thái trở thành, thay vì thay bằng thuật ngữ kỹ thuật hẹp hơn.
- source_word: הוּא
  choice: ông
  rationale: Đại từ nối lại A-rôn; “ông” tự nhiên trong tiếng Việt và không cần lặp tên riêng.
theological_decisions:
- issue: Kết quả thánh hóa của nghi thức rảy máu và dầu
  choice: sẽ nên thánh
  alternative: sẽ được biệt riêng ra thánh / sẽ được thánh hiến
  rationale: “Sẽ nên thánh” bảo toàn phạm trù קדשׁ của bản Hê-bơ-rơ và sắc thái trạng thái đạt được sau nghi thức, không thu hẹp ý nghĩa vào một thuật ngữ thần học hay giáo hội cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép lặp đặc trưng của văn bản nghi lễ để bảo toàn phạm vi áp dụng cho A-rôn, các con trai và y phục của họ. Dùng “A-rôn” theo lối phiên âm Kinh Thánh Việt ngữ thông dụng.
