  text: עֹלַ֤ת תָּמִיד֙ לְ/דֹרֹ֣תֵי/כֶ֔ם פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָ/כֶם֙ שָׁ֔מָּ/ה לְ/דַבֵּ֥ר אֵלֶ֖י/ךָ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: vi
  text: Đó sẽ là một lễ tế toàn thiêu thường xuyên[a] qua mọi thế hệ của các ngươi, ở lối vào Lều Hội Kiến, trước mặt Yahweh; tại đó Ta sẽ gặp các ngươi để phán với ngươi tại đó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ tế toàn thiêu liên tục” hoặc “lễ tế toàn thiêu thường lệ”.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ chuyển từ số nhiều trong “gặp các ngươi” sang số ít trong “phán với ngươi”, có lẽ để phân biệt cộng đồng rộng hơn với riêng Môi-se.
    reason: source_ambiguity
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: lễ vật thiêu dâng thường xuyên
  rationale: עֹלָה chỉ lễ vật được thiêu trọn vẹn trên bàn thờ; תָּמִיד nhấn mạnh việc dâng đều đặn, liên tục theo quy định. “Thường xuyên” tự nhiên trong tiếng Việt và không nhất thiết hàm ý hành động diễn ra không gián đoạn.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua các thế hệ của các ngươi
  rationale: Cụm từ nói đến hiệu lực kéo dài qua những thế hệ kế tiếp, đồng thời giữ đại từ số nhiều của tiếng Hê-bơ-rơ.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: tại cửa Lều Hội Kiến
  rationale: פֶּתַח là cửa hoặc lối vào; אֹהֶל מוֹעֵד là chiếc lều được chỉ định làm nơi gặp gỡ. “Lều Hội Kiến” là cách diễn đạt ngắn gọn, trang trọng và quen thuộc.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי mang nghĩa không gian và nghi lễ là “trước mặt”; danh riêng יהוה được phiên âm là “Yahweh” thay vì thay bằng một tước hiệu.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: là nơi Ta sẽ gặp các ngươi
  rationale: Dạng Niphal của יעד ở đây chỉ cuộc gặp đã được định; שָׁמָּה được diễn đạt tự nhiên qua “nơi”, tránh lặp “tại đó” hai lần trong cùng mệnh đề.
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: để phán với ngươi tại đó
  rationale: Động từ nguyên mẫu nêu mục đích của cuộc gặp. “Ngươi” giữ số ít của אֵלֶיךָ, còn “phán” phù hợp với ngữ cảnh Đức Chúa Trời nói với Môi-se.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng, không thay nó bằng tước hiệu.
- issue: Sự chuyển đổi số của đại từ
  choice: giữ số nhiều “các ngươi” rồi chuyển sang số ít “ngươi”
  alternative: đồng nhất cả hai thành số nhiều hoặc cả hai thành số ít
  rationale: לָכֶם là số nhiều, còn אֵלֶיךָ là số ít. Giữ nguyên sự chuyển đổi bảo tồn khả năng bản văn phân biệt cộng đồng rộng hơn với người trực tiếp nhận lời phán, có lẽ là Môi-se.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “các ngươi/ngươi” được dùng có chủ ý để thể hiện rõ sự chuyển đổi từ số nhiều sang số ít trong nguyên bản; “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Câu giữ cấu trúc nghi lễ của bản nguồn nhưng điều chỉnh vừa đủ để tự nhiên trong tiếng Việt.
