  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: vi
  text: Hãy đặt khăn đội đầu trên đầu ông, rồi đặt vương miện thánh[a] trên khăn ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “miện thánh.” Từ Hê-bơ-rơ נֵזֶר có thể chỉ một vật đội đầu giống vương miện, được biệt riêng hoặc thánh hiến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Hãy đặt
  rationale: Động từ שׂים có nghĩa là đặt, để. Trong chuỗi chỉ dẫn nghi lễ, thể mệnh lệnh tiếng Việt truyền đạt tự nhiên lực chỉ thị của cấu trúc Hê-bơ-rơ.
- source_word: הַמִּצְנֶפֶת
  choice: khăn xếp
  rationale: מִצְנֶפֶת chỉ khăn quấn đầu của thầy tế lễ. “Khăn xếp” là cách gọi hiện đại, dễ hiểu hơn những từ mang sắc thái giáo hội hoặc cổ như “mũ tế” hay “mũ miện”.
- source_word: עַל רֹאשׁוֹ
  choice: lên đầu ông
  rationale: Giữ nguyên quan hệ không gian cụ thể; “ông” diễn đạt tự nhiên đại từ ngôi ba giống đực chỉ A-rôn trong ngữ cảnh.
- source_word: וְנָתַתָּ
  choice: rồi gắn
  rationale: נתן có thể mang nghĩa đặt hoặc để. Vì vật này được đặt trên khăn đội đầu, “gắn” diễn đạt tự nhiên thao tác nghi lễ và “rồi” thể hiện trình tự của liên từ וְ.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: miện thánh
  rationale: נֵזֶר chỉ một vật biểu trưng như miện, gắn với sự biệt riêng hoặc thánh hiến. “Miện thánh” giữ sắc thái trang trọng mà không mặc nhiên biến vật này thành vương miện hoàng gia; הַקֹּדֶשׁ được diễn đạt tự nhiên bằng tính từ “thánh”.
- source_word: עַל הַמִּצְנָפֶת
  choice: lên khăn xếp
  rationale: Giữ lại giới từ עַל để cho thấy miện được đặt hoặc gắn trên chính khăn xếp.
theological_decisions:
- issue: Ý nghĩa của נֵזֶר trong phẩm phục thầy tế lễ
  choice: miện thánh
  alternative: vương miện thánh
  rationale: “Miện” bảo tồn hình ảnh vật trang sức đội đầu và tính thánh hiến, đồng thời tránh nhấn quá mức ý niệm vương quyền vốn không được câu này xác định rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mệnh lệnh được dùng thay cho lối dịch cứng “ngươi sẽ”; “khăn xếp” gọi rõ loại khăn đội đầu của thầy tế lễ, còn “miện thánh” giữ sự phân biệt với vương miện hoàng gia.
