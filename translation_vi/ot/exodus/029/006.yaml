  to: Hãy đặt khăn đội đầu trên đầu ông, rồi đặt vương miện thánh[a] trên khăn ấy.
  rationale: Thay “gắn” bằng “đặt” để không thêm ý về cách cố định vật phẩm; thay “miện thánh” bằng “vương miện thánh” để câu rõ và tự nhiên hơn trong tiếng Việt hiện đại. Chú thích bảo tồn khả năng dịch ngắn là “miện thánh” và sắc thái thánh hiến của từ Hê-bơ-rơ.
