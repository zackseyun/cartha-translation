  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần được nêu trong tiếng Hê-bơ-rơ: thịt, da, phân của con bò đực; việc thiêu bằng lửa ở ngoài trại; và việc xác định đây là חַטָּאת. “Lễ vật chuộc tội” là cách dịch truyền thống có thể chấp nhận cho חַטָּאת trong ngữ cảnh tế lễ, đồng thời chú thích bảo lưu cách hiểu “lễ vật thanh tẩy.”'
