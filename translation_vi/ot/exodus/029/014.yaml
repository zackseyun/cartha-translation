base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: vi
  text: Còn thịt con bò đực, da và phân của nó, ngươi phải dùng lửa thiêu bên ngoài trại; đó là lễ vật chuộc tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy.” Từ Hê-bơ-rơ חַטָּאת có thể chỉ “tội lỗi” hoặc lễ vật được dâng liên quan đến tội lỗi. Trong ngữ cảnh tế lễ như ở đây, nhiều bản dịch dùng “lễ vật chuộc tội,” còn một số dùng “lễ vật thanh tẩy” để nhấn mạnh chức năng làm sạch của nghi thức.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: thịt con bò đực
  rationale: “Thịt” diễn đạt tự nhiên phần thân thể của con vật trong tiếng Việt hiện đại; פַּר được dịch là “bò đực” theo nghĩa thông dụng trong luật tế lễ.
- source_word: עֹרוֹ
  choice: da của nó
  rationale: “Da” là cách gọi rõ ràng, tự nhiên đối với lớp da của con vật.
- source_word: פִּרְשׁוֹ
  choice: phân của nó
  rationale: פֶּרֶשׁ chỉ phân hoặc chất bài tiết; dịch thẳng là “phân,” không làm nhẹ nghĩa thành nội tạng hay phế vật.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: phải dùng lửa thiêu
  rationale: Dạng động từ trong ngữ cảnh chỉ thị mang lực bắt buộc; בָּאֵשׁ có sắc thái phương tiện, được thể hiện bằng “dùng lửa.”
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: bên ngoài trại
  rationale: Cách diễn đạt tự nhiên, chính xác cho địa điểm vượt ngoài ranh giới trại quân/dân cư của Israel.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ lễ vật liên quan đến tội lỗi; “lễ vật chuộc tội” dễ hiểu và quen thuộc, còn chức năng thanh tẩy được bảo lưu trong chú thích.
- source_word: הוּא
  choice: đó là
  rationale: Đại từ xác định tính chất tế lễ của con vật hoặc nghi thức vừa nêu.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy; tội lỗi
  rationale: Ngữ cảnh nghi lễ cho thấy nghĩa chỉ một lễ vật, chứ không đơn thuần là khái niệm trừu tượng “tội lỗi.” Bản chính dùng thuật ngữ quen thuộc “lễ vật chuộc tội,” đồng thời chú thích giữ lại cách hiểu “lễ vật thanh tẩy,” vốn nhấn mạnh chức năng làm sạch của nghi thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ngươi” để giữ sắc thái lời chỉ dẫn trực tiếp trong luật tế lễ; giữ chuỗi liệt kê cụ thể của nguyên văn nhưng tránh lặp đại từ sở hữu không tự nhiên trong tiếng Việt.
