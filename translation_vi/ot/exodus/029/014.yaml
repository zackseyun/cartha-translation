  terminology: “Bò đực,” “da,” “phân,” “thiêu,” “bên ngoài trại,” và “lễ vật chuộc tội” đều nhất quán với ngữ cảnh luật tế lễ. Chú thích nêu chính xác sự thay thế học thuật hợp lý cho חַטָּאת mà không ép một cách hiểu giáo phái.
  issues:
