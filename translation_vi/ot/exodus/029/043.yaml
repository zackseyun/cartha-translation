  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: vi
  text: Tại đó, Ta sẽ gặp con cái Israel[a], và nơi ấy sẽ được thánh hóa bởi vinh quang của Ta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Israel.” Nguyên văn Hê-bơ-rơ là “các con của Israel,” một cách gọi quen thuộc dành cho dân Israel.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn không nêu rõ chủ thể của động từ “sẽ được thánh hóa.” Chủ thể có thể là khu vực thánh đang được nói đến nói chung, hoặc cụ thể hơn là Lều Hội Kiến hay bàn thờ.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: Ta sẽ gặp
  rationale: Động từ יעד ở thể Niphal trong bối cảnh nơi thánh chỉ cuộc gặp đã được định giữa Đức Chúa Trời và dân Ngài. “Gặp” tự nhiên trong tiếng Việt và không thêm ý như “hiện ra” hay “bày tỏ mình”.
- source_word: שָׁמָּה
  choice: Tại đó
  rationale: Trạng từ chỉ nơi chốn, quy chiếu về địa điểm thánh được nói đến trong văn cảnh trước.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ được thành ngữ giao ước “các con của Israel” nhưng dùng cách nói tiếng Việt tự nhiên, bao gồm cộng đồng Israel chứ không chỉ nam giới.
- source_word: וְנִקְדַּשׁ
  choice: nơi ấy sẽ được thánh hóa
  rationale: Thể Niphal của קדש diễn tả việc được làm nên thánh. Vì chủ thể số ít giống đực không được nêu rõ, “nơi ấy” liên hệ khái quát với khu vực thánh đang được nói đến mà không quyết định đó là Lều Hội Kiến hay bàn thờ.
- source_word: בִּכְבֹדִי
  choice: bởi vinh quang của Ta
  rationale: Giới từ ב được hiểu theo nghĩa phương tiện/tác nhân; chính vinh quang hiển hiện của Đức Chúa Trời làm cho nơi ấy nên thánh.
theological_decisions:
- issue: Chủ thể ngầm của וְנִקְדַּשׁ
  choice: “nơi ấy” chỉ chung địa điểm thánh trong văn cảnh
  alternative: Lều Hội Kiến; bàn thờ; hoặc A-rôn
  rationale: Tiếng Hê-bơ-rơ chỉ có động từ ngôi thứ ba số ít giống đực mà không nêu chủ thể. Tiếng Việt cần một chủ thể rõ hơn; “nơi ấy” bảo tồn sự không xác định tương đối tốt hơn việc chỉ đích danh Lều Hội Kiến hay bàn thờ.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel; người Israel; các con trai Israel
  rationale: Đây là thành ngữ dân tộc-giao ước chỉ toàn thể cộng đồng Israel. “Con cái Israel” vừa gần cấu trúc nguyên văn vừa tránh khiến độc giả hiểu sai rằng chỉ có nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Dùng “được thánh hóa” để giữ thể bị động và sắc thái thánh thiêng; các chú thích bảo tồn thành ngữ dân tộc và sự mơ hồ về chủ thể trong nguyên văn.
