  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: vi
  text: Cho con chiên ấy, hãy dâng một phần mười ê-pha[a] bột mịn trộn với một phần tư hin dầu ô-liu ép[b], và một phần tư hin rượu làm lễ quán[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một phần mười”; trong quy định về lễ vật, đây là một phần mười ê-pha, khoảng 2,2 lít.'
    reason: lexical_alternative
  - marker: b
    text: “Dầu ô-liu ép” là dầu lấy từ ô-liu được giã hoặc đập; cũng có thể dịch là “dầu ô-liu giã”.
    reason: lexical_alternative
  - marker: c
    text: “Lễ quán” là lễ vật dạng lỏng được rót ra dâng lên Đức Chúa Trời.
    reason: clarification
lexical_decisions:
- source_word: וְ/עִשָּׂרֹן סֹלֶת
  choice: một phần mười ê-pha bột lọc
  rationale: עִשָּׂרוֹן là đơn vị bằng một phần mười ê-pha trong ngữ cảnh lễ vật; nêu rõ “ê-pha” giúp độc giả Việt hiểu đây là lượng đo. סֹלֶת chỉ loại bột mịn, phẩm chất tốt dùng trong tế lễ; “bột lọc” là cách gọi trang trọng và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: בָּלוּל בְּ/שֶׁמֶן כָּתִית
  choice: trộn với ... dầu ô-liu giã
  rationale: בָּלוּל בְּ diễn tả việc trộn bột với dầu. כָּתִית mô tả dầu làm từ ô-liu được giã hoặc đập; thêm “ô-liu” làm rõ nguyên liệu vốn được ngữ cảnh văn hóa mặc định.
- source_word: רֶבַע הַ/הִין
  choice: một phần tư hin
  rationale: Giữ nguyên đơn vị đo lường cổ “hin” và diễn đạt phân số tự nhiên trong tiếng Việt.
- source_word: וְ/נֵסֶךְ
  choice: làm lễ quán
  rationale: נֶסֶךְ là lễ vật dạng lỏng được rót ra; “lễ quán” là thuật ngữ ngắn gọn, chính xác, còn chú thích giải nghĩa cho độc giả hiện đại.
- source_word: רְבִעִית הַ/הִין יָיִן
  choice: một phần tư hin rượu
  rationale: Dịch nhất quán đơn vị đo và giữ nghĩa thông thường của יַיִן là rượu.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: cùng với con chiên ấy
  rationale: Giới từ לְ có thể chỉ lễ vật đi kèm dành cho con chiên; mạo từ trong הָאֶחָד quy chiếu đến con chiên đã xác định trong ngữ cảnh. Cách dịch này tự nhiên hơn “cho một con chiên” mà không buộc phải giải thích là “con thứ nhất” ngay trong chính văn.
