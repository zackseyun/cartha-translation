translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc được sắp xếp lại để cụm “cùng với con chiên ấy” đứng đầu, làm rõ rằng bột, dầu và rượu là các lễ vật đi kèm. Giữ các đơn vị cổ ê-pha và hin, kèm giải thích cần thiết trong chú thích.
