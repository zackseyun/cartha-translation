    issue: “Bột lọc” cho סֹלֶת
    rationale: “Bột lọc” trong tiếng Việt hiện đại thường gợi một loại bột/tinh bột cụ thể, không phải khái niệm “fine flour”. “Bột mịn” truyền đạt đúng và ít gây hiểu nhầm hơn.
  - severity: medium
    issue: “Dầu ô-liu giã” cho שֶׁמֶן כָּתִית
    rationale: Cụm này mơ hồ về cú pháp và không tự nhiên. Tính từ כָּתִית mô tả phương thức chế biến ô-liu; “dầu ô-liu ép” là lối diễn đạt Việt ngữ tự nhiên, đồng thời chú thích có thể nêu “giã hoặc đập”.
  - severity: low
    issue: Cách diễn đạt quan hệ với con chiên
    rationale: “Cho con chiên ấy” phản ánh trực tiếp hơn לַכֶּבֶשׂ הָאֶחָד, còn tránh xác định thêm rằng đây là con thứ nhất.
