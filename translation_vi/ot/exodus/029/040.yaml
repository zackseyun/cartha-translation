revisions:
- from: Cùng với con chiên ấy, hãy dâng một phần mười ê-pha[a] bột lọc trộn với một phần tư hin dầu ô-liu giã[b], và một phần tư hin rượu làm lễ quán[c].
  to: Cho con chiên ấy, hãy dâng một phần mười ê-pha[a] bột mịn trộn với một phần tư hin dầu ô-liu ép[b], và một phần tư hin rượu làm lễ quán[c].
  rationale: 'Sửa hai từ ngữ có thể gây hiểu nhầm trong tiếng Việt hiện đại: thay “bột lọc” bằng “bột mịn” cho סֹלֶת, và thay “dầu ô-liu giã” bằng “dầu ô-liu ép” cho שֶׁמֶן כָּתִית. Sắp lại cụm đầu câu thành “Cho con chiên ấy” để phản ánh trực tiếp hơn quan hệ của lễ vật với “con chiên ấy”, mà không diễn giải thêm là “con chiên thứ nhất”. Các đơn vị đo cổ và thuật ngữ “lễ quán” được giữ nguyên, có chú thích.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:50:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng các thành tố chính của tiếng Hê-bơ-rơ: một phần mười bột mịn, một phần tư hin dầu, và lễ quán một phần tư hin rượu cho con chiên được nói đến. Tuy nhiên, “bột lọc” không phải tương đương chuẩn, rõ nghĩa của סֹלֶת trong tiếng Việt hiện đại; và “dầu ô-liu giã” dễ hiểu là dầu đang được giã, thay vì dầu được chế từ ô-liu giã/đập. Bản sửa dùng các cách diễn đạt rõ hơn mà không thêm chi tiết giáo phái hay thay đổi đơn vị cổ.'
  naturalness: Cấu trúc “Cùng với con chiên ấy, hãy dâng” đọc được, nhưng “Cho con chiên ấy, hãy dâng...” bám sát chức năng của לְ hơn. “Bột mịn” tự nhiên và chính xác hơn “bột lọc”; “dầu ô-liu ép” là cách nói thông dụng, rõ ràng cho dầu כָּתִית.
  terminology: Giữ “ê-pha”, “hin”, “lễ quán”, và “rượu”. “Lễ quán” là thuật ngữ tế lễ thích hợp, với chú thích giải nghĩa. Không nên diễn giải hָאֶחָד thành “thứ nhất” trong chính văn, dù ngữ cảnh lân cận nói đến hai con chiên; “con chiên ấy” giữ tính quy chiếu của bản gốc.
  issues:
