base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/015.yaml
  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: vi
  text: Rồi con hãy lấy một con chiên đực[a]; A-rôn và các con trai ông sẽ đặt tay lên đầu con chiên đực ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “con chiên đực ấy, một con.” Cụm này phân biệt con chiên đực này với con chiên đực khác trong nghi thức; cũng có thể dịch là “con chiên đực thứ nhất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Rồi
  rationale: Liên từ cùng dấu hiệu chỉ tân ngữ mở đầu bước kế tiếp trong chuỗi chỉ dẫn; “Rồi” diễn đạt tự nhiên trình tự này.
- source_word: הָ/אַיִל
  choice: con chiên đực
  rationale: אַיִל chỉ chiên đực trưởng thành; cách dịch này chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: הָ/אֶחָד
  choice: một trong hai
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “con chiên đực ấy, con thứ một/con duy nhất”, dùng để phân biệt con này với con chiên đực còn lại trong nghi thức. “Một trong hai” giữ ý phân biệt mà không mặc nhiên biến אֶחָד thành số thứ tự “thứ nhất”.
- source_word: תִּקָּח
  choice: con hãy bắt
  rationale: Động từ ngôi hai số ít giống đực trực tiếp nói với Môi-se trong văn cảnh mệnh lệnh; “hãy bắt” phù hợp với việc đưa con vật vào bước nghi lễ.
- source_word: וְ/סָמְכוּ
  choice: phải đặt
  rationale: Trong nghi lễ hiến tế, סמך chỉ hành động đặt hoặc tì tay lên con vật. “Đặt tay” là cách nói tự nhiên, trang trọng, không thêm diễn giải thần học.
- source_word: אַהֲרֹן וּ/בָנָיו
  choice: A-rôn và các con trai ông
  rationale: בנים ở đây chỉ các con trai của A-rôn đang được lập làm thầy tế lễ.
- source_word: אֶת יְדֵיהֶם
  choice: tay
  rationale: Nguyên văn dùng số nhiều “các bàn tay của họ”; tiếng Việt tự nhiên dùng “đặt tay” với chủ ngữ số nhiều mà vẫn chỉ rõ mỗi người thực hiện cử chỉ ấy.
- source_word: עַל רֹאשׁ הָ/אָיִל
  choice: trên đầu nó
  rationale: Diễn đạt rõ vị trí của hành động; đại từ “nó” tránh lặp nặng nề nhưng vẫn quy chiếu rõ đến con chiên đực.
theological_decisions:
- issue: Thuật ngữ về nghi thức đặt tay trên sinh tế
  choice: đặt tay trên đầu nó
  alternative: tì tay trên đầu con chiên đực
  rationale: סמך có thể hàm ý tựa hoặc tì, nhưng trong luật hiến tế, cụm “đặt tay” truyền đạt rõ hành động nghi lễ mà không gán thêm ý nghĩa như chuyển tội hay đồng nhất hóa, vốn không được câu này phát biểu.
- issue: Cách hiểu הָאֶחָד
  choice: một trong hai con chiên đực
  alternative: con chiên đực thứ nhất
  rationale: אֶחָד có thể được hiểu theo chức năng thứ tự trong văn cảnh, nhưng hình thức từ vựng là “một”. Bản dịch giữ ý phân biệt với con chiên đực kia và chú thích khả năng dịch là “thứ nhất”.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ, hiện đại và trang trọng. Dùng “con” để phản ánh lời Đức Chúa Trời trực tiếp phán với Môi-se theo mạch văn; dùng “chiên đực” thay vì thuật ngữ ít thông dụng hơn. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
