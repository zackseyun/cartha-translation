  yaml_path: translation/ot/exodus/029/011.yaml
  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: vi
  text: Ngươi phải giết tế con bò đực trước mặt Yahweh[a], tại lối vào Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”, danh riêng được phiên âm là “Yahweh”; theo truyền thống thường được dịch là “ĐỨC CHÚA”. Một cách phiên âm khác là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: Ngươi phải giết
  rationale: Động từ Qal hoàn thành có liên từ đứng đầu, trong chuỗi chỉ thị nghi lễ, mang lực mệnh lệnh. “Giết” tự nhiên trong tiếng Việt và ngữ cảnh cho thấy đây là việc giết sinh tế.
- source_word: הַפָּר
  choice: con bò đực
  rationale: פַּר chỉ bò đực, đặc biệt thường dùng cho con vật hiến tế; bản thân câu này không bắt buộc phải thêm ý “tơ” hay “non”.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי có nghĩa đen là “trước mặt/trước sự hiện diện của”; cách dịch này giữ được cả ý vị trí lẫn ý nghi lễ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: פֶּתַח
  choice: tại cửa
  rationale: פֶּתַח chỉ lối vào hay cửa; “tại cửa” ngắn gọn, tự nhiên và xác định địa điểm tiến hành nghi lễ.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Đây là danh xưng cố định của nơi thánh trong Xuất Hành; cách dịch trang trọng, dễ hiểu và giữ ý về nơi gặp gỡ đã được ấn định.
theological_decisions:
- issue: Cách thể hiện danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Phiên âm “Yahweh” bảo tồn tính chất tên riêng, còn chú thích ghi nhận truyền thống thay danh này bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “ngươi” phản ánh lời chỉ thị số ít dành cho Môi-se; “Lều Hội Kiến” được viết hoa như một danh xưng cố định. Dấu chú thích được đặt ngay sau “Yahweh” để chỉ rõ từ được giải thích.
