  - severity: low
    issue: Chú thích nói các cách phiên âm khác gồm “Yahweh”, trong khi bản văn đã dùng “Yahweh”.
    rationale: Cách trình bày này gây lặp và thiếu chính xác về mặt biên tập; nên xác định Yahweh là cách phiên âm được chọn, còn Giê-hô-va là một cách phiên âm khác.
  revised_text: Ngươi phải giết tế con bò đực trước mặt Yahweh[a], tại lối vào Lều Hội Kiến.
