  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố của nguyên văn: mệnh lệnh nghi lễ ở ngôi số ít, con bò đực, việc thực hiện trước mặt Yahweh, và địa điểm tại lối vào Lều Hội Kiến. Động từ שׁחט đặc biệt chỉ việc giết mổ trong bối cảnh tế lễ; “giết tế” diễn đạt sắc thái này chính xác hơn “giết” đơn thuần mà không thêm ý ngoài ngữ cảnh.'
