  terminology: Giữ “Yahweh” cho יהוה và “Lều Hội Kiến” cho אֹהֶל מוֹעֵד là nhất quán, dễ nhận diện và phù hợp thuật ngữ. Chú thích cần tránh gọi chính cách phiên âm đang dùng là một “cách phiên âm khác”.
  issues:
