  yaml_path: translation/ot/exodus/029/008.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: vi
  text: Cũng hãy đưa các con trai của A-rôn đến gần và mặc áo dài cho họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đưa… đến gần” cũng có thể hiểu là “đưa… ra trình diện” trong nghi thức. “Áo dài” ở đây chỉ loại áo mặc sát thân thời xưa, không phải áo dài truyền thống Việt Nam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Còn... cũng hãy
  rationale: Liên từ phối hợp cùng dấu chỉ tân ngữ mở đầu mệnh lệnh tiếp theo; cách diễn đạt này nối tự nhiên với nghi thức dành cho A-rôn ở câu trước.
- source_word: בָּנָיו
  choice: các con trai của A-rôn
  rationale: Danh từ chỉ rõ con trai. Nêu lại A-rôn thay cho đại từ giúp câu tiếng Việt đứng riêng vẫn rõ nghĩa mà không làm thay đổi đối tượng.
- source_word: תַּקְרִיב
  choice: đưa... đến gần
  rationale: Dạng Hiphil của קרב mang nghĩa đưa đến gần, đồng thời có thể hàm ý đưa ra trình diện trong nghi thức; lựa chọn này giữ được hình ảnh không gian và sắc thái tế lễ.
- source_word: וְהִלְבַּשְׁתָּם
  choice: và mặc... cho họ
  rationale: Trong tiếng Việt, 'mặc áo cho họ' là cách diễn đạt tự nhiên cho hành động khoác y phục lên người khác, đồng thời phù hợp bối cảnh phong chức.
- source_word: כֻּתֳּנֹת
  choice: áo dài
  rationale: כֻּתֹּנֶת là áo mặc sát thân, thường dài, không phải áo choàng ngoài. 'Áo dài' diễn đạt hình dáng cơ bản bằng tiếng Việt hiện đại, dù có thể gợi đến quốc phục Việt Nam nên cần chú thích làm rõ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Giữ cấu trúc hai mệnh lệnh phối hợp của tiếng Hê-bơ-rơ và sắc thái nghi lễ của 'đưa đến gần'. Dùng 'A-rôn' để làm rõ sở hữu khi câu được đọc độc lập.
