base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: vi
  text: Ngươi hãy lấy con chiên đực dùng trong lễ phong chức[a], rồi luộc thịt nó tại một nơi thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con chiên đực dùng trong lễ thánh hiến”. Từ Hê-bơ-rơ chỉ nghi thức lập các tư tế vào chức vụ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong Nơi Thánh”, nhưng sát nghĩa hơn, tiếng Hê-bơ-rơ nói “tại một nơi thánh”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: con chiên đực
  rationale: Chỉ con cừu đực dùng làm sinh tế; cách nói này chính xác, tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: הַמִּלֻּאִים
  choice: dùng trong lễ phong chức
  rationale: Trong ngữ cảnh tư tế, từ này chỉ nghi thức lập các tư tế vào chức vụ, bắt nguồn từ thành ngữ 'làm đầy tay'. 'Lễ phong chức' truyền đạt rõ chức năng của nghi thức mà không dịch máy móc thành ngữ Hê-bơ-rơ.
- source_word: תִּקָּח
  choice: Ngươi hãy lấy
  rationale: Dạng động từ ngôi thứ hai số ít mang tính chỉ thị; 'hãy lấy' giữ rõ lực mệnh lệnh và phù hợp với chuỗi chỉ dẫn nghi lễ.
- source_word: וּבִשַּׁלְתָּ
  choice: rồi luộc
  rationale: Động từ בשׁל ở đây nói đến việc nấu bằng cách luộc; 'luộc' chính xác hơn từ rộng nghĩa 'nấu'. Từ 'rồi' diễn đạt tự nhiên trình tự hành động.
- source_word: בְּשָׂרוֹ
  choice: thịt nó
  rationale: '''Thịt'' là cách diễn đạt tự nhiên trong tiếng Việt đối với phần thân thể của con vật dùng làm thức ăn tế lễ, đồng thời thể hiện đại từ sở hữu số ít.'
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: tại một nơi thánh
  rationale: Cụm Hê-bơ-rơ không có mạo từ xác định, nên cách dịch này giữ nghĩa không xác định và không tự ý đồng nhất địa điểm với gian Nơi Thánh của Đền Tạm.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ nghi lễ הַמִּלֻּאִים trong việc lập tư tế
  choice: lễ phong chức
  alternative: lễ biệt riêng
  rationale: Cả hai cách đều có thể diễn tả nghi thức dành riêng tư tế cho Đức Chúa Trời. 'Lễ phong chức' làm rõ hơn rằng đây là nghi thức chính thức lập họ vào chức vụ, nhưng chú thích vẫn bảo lưu sắc thái thánh hiến.
- issue: בְּמָקוֹם קָדֹשׁ là một nơi thánh nói chung hay gian được gọi là Nơi Thánh
  choice: một nơi thánh
  alternative: Nơi Thánh
  rationale: Ngữ pháp Hê-bơ-rơ không buộc phải hiểu đây là gian thánh cụ thể trong Đền Tạm. Cách dịch không xác định tránh đưa vào văn bản một địa điểm chuyên biệt hơn điều nguyên văn nói.
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Đại từ “ngươi” phù hợp với lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh luật nghi lễ; câu dùng cấu trúc gọn, rõ và dễ đọc.
