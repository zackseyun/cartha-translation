base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: vi
  text: Con hãy đem[a] con bò đực đến trước Lều Hội Kiến, rồi A-rôn và các con trai ông phải đặt tay trên đầu con bò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đưa con bò lại gần trước Lều Hội Kiến” hoặc “trình con bò ra trước Lều Hội Kiến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Con hãy đem ... đến
  rationale: Dạng Hiphil của קרב có nghĩa là đem lại gần hoặc trình ra, nhất là trong bối cảnh dâng tế. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ ý hướng đến nơi thánh.
- source_word: הַפָּר
  choice: con bò đực
  rationale: פַּר chỉ bò đực, thường là bò đực non dùng làm sinh tế. “Con bò đực” rõ nghĩa và không bổ sung độ tuổi mà câu Hê-bơ-rơ không nói rõ.
- source_word: לִפְנֵי
  choice: trước
  rationale: Từ này diễn tả vị trí phía trước hoặc trước sự hiện diện của một nơi; “trước” vừa sát nghĩa vừa phù hợp với khung cảnh nghi lễ.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Danh xưng này chỉ lều thánh nơi Đức Chúa Trời gặp dân Ngài. “Lều Hội Kiến” là cách gọi trang trọng, gọn và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: וְסָמַךְ
  choice: phải đặt
  rationale: סמך đi với tay và đầu sinh tế chỉ hành động nghi lễ đặt hoặc tì tay. “Đặt tay” diễn đạt rõ hành động mà không tự giải thích ý nghĩa thần học của nghi lễ.
- source_word: יְדֵיהֶם
  choice: tay
  rationale: Tiếng Hê-bơ-rơ dùng dạng số nhiều, nhưng tiếng Việt tự nhiên dùng “đặt tay” sau chủ thể tập hợp; cách nói này không xác định mỗi người dùng một hay hai tay, phù hợp với sự không minh định của câu nguồn.
- source_word: עַל רֹאשׁ הַפָּר
  choice: trên đầu con bò
  rationale: Giữ nguyên hành động cụ thể và quan hệ vị trí của nguyên văn bằng tiếng Việt tự nhiên.
- source_word: אַהֲרֹן וּבָנָיו
  choice: A-rôn và các con trai ông
  rationale: בנים trong bối cảnh phong chức tế lễ chỉ các con trai của A-rôn; bản dịch giữ đúng giới tính và quan hệ gia đình được nêu trong câu.
theological_decisions:
- issue: Ý nghĩa của việc đặt tay trên sinh tế
  choice: đặt tay trên đầu con bò
  alternative: ấn tay trên đầu con bò
  rationale: Nguyên văn chỉ mô tả hành động nghi lễ chứ không giải thích đây là sự chuyển tội, đồng nhất hay đại diện. Bản dịch không đưa thêm một cách giải thích thần học vào câu.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Đại từ “Con” phản ánh lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh. Viết hoa “Lều Hội Kiến” vì đây là danh xưng của nơi thánh cụ thể. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
