base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: vi
  text: Ta sẽ thánh hiến Lều Hội Kiến và bàn thờ; Ta sẽ thánh hiến A-rôn và các con trai ông để họ phụng sự Ta trong chức tư tế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để họ làm tư tế cho Ta” hoặc “để họ phụng sự Ta với tư cách các thầy tế lễ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: Ta sẽ thánh hiến / Ta cũng sẽ thánh hiến
  rationale: Động từ קדשׁ ở thể Piel chỉ việc biệt riêng làm thánh. “Thánh hiến” tự nhiên trong ngữ cảnh thờ phượng và được lặp lại nhất quán; “cũng” diễn đạt sự chuyển tiếp sang A-rôn và các con trai ông.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt, chỉ chiếc lều là nơi Đức Chúa Trời gặp dân Ngài theo sự ấn định.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Thuật ngữ tiếng Việt thông dụng và chính xác cho bàn dùng trong việc dâng tế lễ.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Giữ đúng nét nghĩa giống đực và chỉ rõ đây là các con trai của A-rôn.
- source_word: לְכַהֵן לִי
  choice: để họ phụng sự Ta trong chức tư tế
  rationale: Động từ כהן diễn tả việc thi hành chức vụ tư tế; cách dịch này tự nhiên trong tiếng Việt, đồng thời giữ cả ý phục vụ Đức Chúa Trời và vai trò tư tế.
theological_decisions:
- issue: Ngôn ngữ về sự thánh biệt trong nghi lễ
  choice: thánh hiến
  alternative: thánh hóa / làm nên thánh
  rationale: Ngữ cảnh nói đến việc biệt riêng nơi chốn, vật dụng và con người cho sự phục vụ thánh. “Thánh hiến” truyền đạt rõ ý nghi lễ mà không áp đặt nghĩa thần học khác.
- issue: Phạm vi giới tính của dòng tư tế
  choice: các con trai ông
  alternative: các con của ông
  rationale: Nguyên văn dùng danh từ giống đực số nhiều và trong ngữ cảnh chỉ các con trai của A-rôn đảm nhiệm chức tư tế.
- issue: Ý nghĩa của לְכַהֵן לִי
  choice: phụng sự Ta trong chức tư tế
  alternative: làm thầy tế lễ cho Ta
  rationale: Giữ được cả sắc thái hoạt động của động từ כהן lẫn đối tượng được phục vụ là Đức Chúa Trời, không biến cụm từ thành một danh hiệu thuần túy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phản ánh lời Đức Chúa Trời phán. Dùng “Lều Hội Kiến” và “chức tư tế” để giữ sắc thái thờ phượng; dấu chấm phẩy bảo tồn cấu trúc hai vế song song của câu Hê-bơ-rơ.
