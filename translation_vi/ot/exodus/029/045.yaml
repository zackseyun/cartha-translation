base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/045.yaml
  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: vi
  text: Ta sẽ ngự giữa con cái Israel, và Ta sẽ là Đức Chúa Trời của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc Hê-bơ-rơ: “Ta sẽ là Đức Chúa Trời đối với họ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: Ta sẽ ngự
  rationale: Động từ שׁכן chỉ việc cư ngụ, lưu lại tại một nơi. “Ngự” là cách nói tự nhiên và trang trọng trong tiếng Việt khi chủ thể là Đức Chúa Trời, đồng thời diễn đạt sự hiện diện lâu dài mà không đưa hình ảnh “Đền Tạm” vào câu chữ.
- source_word: בְּתוֹךְ
  choice: giữa
  rationale: Khi đi với một cộng đồng, בְּתוֹךְ diễn tả sự hiện diện ngay trong cộng đồng ấy. “Giữa” vừa gọn, tự nhiên, vừa giữ được sắc thái không gian của nguyên văn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  rationale: Nguyên văn là “các con trai/con cái Israel.” Trong tiếng Việt hiện đại, “dân Israel” chỉ toàn thể cộng đồng một cách rõ ràng, tự nhiên; cách nói sát chữ được giữ trong chú thích.
- source_word: וְהָיִיתִי
  choice: và Ta sẽ là
  rationale: היה ở đây diễn tả mối quan hệ giao ước, không nhất thiết là sự chuyển thành một trạng thái mới; vì vậy “sẽ là” phù hợp hơn “sẽ trở thành.”
- source_word: לָהֶם לֵאלֹהִים
  choice: Đức Chúa Trời của họ
  rationale: Cấu trúc Hê-bơ-rơ sát chữ là “Đức Chúa Trời cho/đối với họ.” Cách nói sở hữu trong tiếng Việt truyền đạt tự nhiên mối quan hệ giao ước, còn lối dịch sát cấu trúc được nêu trong chú thích.
theological_decisions:
- issue: Cách diễn đạt công thức giao ước
  choice: Ta sẽ là Đức Chúa Trời của họ
  alternative: Ta sẽ là Đức Chúa Trời đối với họ
  rationale: Cách dịch chính tự nhiên trong tiếng Việt và giữ rõ quan hệ giao ước. Chú thích bảo lưu cấu trúc sát chữ, tránh làm mất sắc thái “cho/đối với họ” của giới từ לְ.
- issue: Cách gọi cộng đồng Israel
  choice: dân Israel
  alternative: con cái Israel
  rationale: “Dân Israel” dễ hiểu và bao quát cộng đồng trong tiếng Việt hiện đại. Vì nguyên văn dùng thành ngữ thân tộc בְּנֵי יִשְׂרָאֵל, cách dịch sát chữ được ghi chú thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời; “ngự” giữ sắc thái tôn kính nhưng vẫn thông dụng. Câu duy trì hai vế song song của nguyên văn.
