base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: vi
  text: Rồi con hãy lấy các phần ấy khỏi tay họ và thiêu chúng trên bàn thờ, bên trên lễ toàn thiêu, dâng làm hương thơm đẹp lòng trước Yahweh. Đó là lễ tế bằng lửa[a] dâng lên Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lễ vật được dâng bằng lửa” hay “lễ vật bằng lửa”. Thuật ngữ Hê-bơ-rơ này chỉ lễ vật trong nghi thức liên hệ với lửa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Rồi con hãy lấy
  rationale: Động từ hoàn thành Qal có liên từ trong chuỗi chỉ dẫn mang lực mệnh lệnh; “Rồi” diễn đạt tự nhiên bước kế tiếp của nghi thức.
- source_word: אֹתָם מִיָּדָם
  choice: các phần ấy khỏi tay họ
  rationale: Đại từ chỉ các phần lễ vật đã được đặt vào tay các thầy tế lễ; thêm “các phần” làm rõ sở chỉ mà không thay đổi ý, còn “khỏi tay họ” giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ.
- source_word: וְהִקְטַרְתָּ
  choice: thiêu chúng
  rationale: Dạng Hiphil của קטר trong ngữ cảnh tế lễ chỉ việc đốt cho bốc khói trên bàn thờ; “thiêu” vừa rõ vừa giữ sắc thái nghi lễ.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Hậu tố chỉ hướng cùng động từ tế lễ diễn tả việc đưa lên và thiêu trên bàn thờ.
- source_word: עַל הָעֹלָה
  choice: bên trên lễ vật toàn thiêu
  rationale: עַל chỉ vị trí ở trên lễ vật toàn thiêu; cách dịch này giữ quan hệ xếp lớp trong nghi thức.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: làm hương thơm đẹp lòng
  rationale: Cụm tế lễ cố định diễn tả hương thơm được Đức Chúa Trời vui nhận, không chỉ nói đến mùi dễ chịu.
- source_word: לִפְנֵי יְהוָה
  choice: Đức Giê-hô-va
  rationale: Trong tiếng Việt, “đẹp lòng Đức Giê-hô-va” diễn đạt tự nhiên ý nghĩa quan hệ của לִפְנֵי trong công thức tế lễ, còn danh riêng giữ chức năng của Tứ tự danh.
- source_word: אִשֶּׁה
  choice: lễ vật dùng lửa dâng lên
  rationale: Thuật ngữ tế lễ này gắn với việc trình dâng bằng lửa. Cách dịch tránh suy diễn thành “thức ăn” và vẫn giữ vai trò của lửa mà không coi lửa là bản thể của lễ vật.
- source_word: הוּא לַיהוָה
  choice: Đó là ... dâng lên Đức Giê-hô-va
  rationale: Giữ đại từ nhấn mạnh הוּא và hướng quy thuộc/dâng hiến được biểu thị bằng לְ.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu. “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc, trang trọng; không làm thay đổi chủ thể giao ước của nguyên văn.
- issue: Ý nghĩa của אִשֶּׁה
  choice: lễ vật dùng lửa dâng lên
  alternative: lễ vật bằng lửa; thức ăn dâng
  rationale: Từ nguyên và phạm vi nghĩa chính xác của אִשֶּׁה còn được bàn luận. Bản dịch giữ mối liên hệ hiển nhiên với nghi thức dùng lửa, đồng thời không áp đặt hình ảnh “thức ăn” vốn chỉ trở nên rõ hơn ở các ngữ cảnh khác.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ, trang trọng nhưng hiện đại. Dùng “con” theo lời Đức Chúa Trời phán với Môi-se trong văn cảnh; “lễ vật toàn thiêu” là thuật ngữ rõ nghĩa hơn lối cổ “của lễ thiêu”. Không có chú thích vì các khả năng cần thiết đã có thể được thể hiện trực tiếp mà không làm nặng câu.
