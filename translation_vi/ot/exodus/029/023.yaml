base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: vi
  text: cùng một ổ bánh, một bánh có dầu và một bánh mỏng, lấy từ giỏ bánh không men ở trước mặt Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: một ổ bánh
  rationale: כִּכָּר chỉ một ổ hoặc bánh có dạng tròn; “ổ bánh” tự nhiên trong tiếng Việt và phân biệt được với חַלָּה theo sau.
- source_word: אַחַת / אֶחָד
  choice: một
  rationale: Giữ lại số từ cho từng loại bánh để bảo toàn tính chính xác của chỉ dẫn nghi lễ.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: một bánh có dầu
  rationale: Cụm Hê-bơ-rơ xác định một loại bánh được làm với dầu nhưng không nói rõ dầu được trộn vào hay phết lên; “có dầu” giữ được sự không xác định ấy.
- source_word: רָקִיק
  choice: một bánh mỏng
  rationale: רָקִיק là loại bánh mỏng; “bánh mỏng” rõ nghĩa và tự nhiên hơn từ vay mượn “wafer” trong tiếng Việt.
- source_word: מִסַּל הַמַּצּוֹת
  choice: lấy từ giỏ bánh không men
  rationale: מִן chỉ nguồn lấy ra, סַל là “giỏ”, còn מַצּוֹת là bánh không men; thêm “lấy” làm rõ quan hệ nguồn một cách tự nhiên.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: đặt trước mặt Đức Giê-hô-va
  rationale: לִפְנֵי mang nghĩa không gian “trước mặt/ở trước”; “đặt” diễn đạt tự nhiên vị trí nghi lễ mà không làm thay đổi nội dung.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc, trang trọng trong tiếng Việt cho Danh Thánh YHWH.
theological_decisions:
- issue: Cách dịch Danh Thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp Danh Thánh, vì vậy bản dịch giữ tên riêng thay vì thay bằng tước hiệu “CHÚA”. “Đức Giê-hô-va” là dạng quen thuộc và trang trọng đối với độc giả tiếng Việt.
- issue: Quan hệ của dầu với chiếc bánh
  choice: bánh có dầu
  alternative: bánh trộn dầu
  rationale: Cụm לֶחֶם שֶׁמֶן không nói rõ cách dùng dầu; tránh xác định rằng dầu được trộn vào khi nguyên văn để ngỏ cách chế biến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc liệt kê cùng số từ “một” được giữ để phản ánh độ chính xác của nghi lễ; “cùng” nối câu này với chỉ dẫn ở câu trước.
