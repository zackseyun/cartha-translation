base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: vi
  text: Hãy đặt các thứ ấy vào một cái giỏ[a], rồi đem chúng đến trong giỏ[b], cùng với con bò đực và hai con cừu đực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một cái giỏ”. Giới từ Hê-bơ-rơ theo nghĩa đen thường là “trên”, nhưng trong ngữ cảnh đồ đựng, ý nói đặt các thứ ấy vào một cái giỏ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trình chúng” hoặc “dâng chúng”. Động từ Hê-bơ-rơ là thuật ngữ thường dùng trong nghi lễ hiến tế, theo nghĩa gốc là “đem lại gần”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ אוֹתָם
  choice: Hãy đặt tất cả
  rationale: Động từ נתן trong chỉ dẫn nghi lễ mang nghĩa đặt/để; “tất cả” quy chiếu tự nhiên đến các loại bánh ở câu trước và tránh đại từ thiếu rõ ràng trong tiếng Việt.
- source_word: עַל סַל אֶחָד
  choice: vào một cái giỏ
  rationale: Dù עַל thường có nghĩa là “trên”, trong ngữ cảnh đặt vật vào đồ đựng, “vào” là cách diễn đạt tự nhiên; אֶחָד được giữ là “một”.
- source_word: וְהִקְרַבְתָּ אֹתָם
  choice: rồi đem chúng đến
  rationale: Dạng Hifil của קרב theo nghĩa gốc là đem lại gần; ở đây “đem ... đến” giữ được hình ảnh ấy mà chưa thu hẹp nghĩa thành một hành động hiến tế cụ thể.
- source_word: בַּסָּל
  choice: trong giỏ
  rationale: Giới từ ב chỉ rằng các loại bánh vẫn ở trong giỏ khi được đem đến.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: cùng với con bò đực và hai con cừu đực
  rationale: Các dấu chỉ tân ngữ lặp lại cho thấy con bò và hai con cừu đực cũng là những vật được đem đến; “cùng với” diễn đạt rõ quan hệ phối hợp.
- source_word: הַפָּר
  choice: con bò đực
  rationale: פַּר chỉ bò đực; cách dịch này rõ ràng và thông dụng trong tiếng Việt.
- source_word: שְׁנֵי הָאֵילִם
  choice: hai con cừu đực
  rationale: אַיִל trong ngữ cảnh động vật hiến tế là cừu đực; cụm số từ được chuyển tự nhiên sang tiếng Việt.
theological_decisions:
- issue: Sắc thái nghi lễ của וְהִקְרַבְתָּ
  choice: đem chúng đến
  alternative: dâng chúng / trình chúng
  rationale: Không xác định quá mức động tác này là chính hành vi dâng tế, vì các tân ngữ gồm cả bánh trong giỏ và các con vật; lựa chọn này bảo tồn nghĩa căn bản “đem lại gần”.
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại, dễ hiểu. Dùng câu mệnh lệnh “Hãy...” phù hợp với lời truyền dạy trực tiếp; giữ hình ảnh chiếc giỏ và tránh chuyên biệt hóa quá mức động từ nghi lễ.
