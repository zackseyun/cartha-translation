revisions:
- from: Ngươi phải biệt riêng ra thánh cái ức của lễ đưa qua đưa lại và cái đùi của phần dâng lên[a]—là những phần đã được đưa qua đưa lại và nâng lên—từ con chiên đực dùng trong lễ phong chức[b], tức phần dành cho A-rôn và phần dành cho các con trai ông.
  to: Ngươi phải thánh hiến ức của lễ đưa qua đưa lại và đùi của lễ nâng lên[a], là những phần đã được đưa qua đưa lại và được nâng lên, lấy từ con chiên đực dùng trong lễ phong chức[b], từ phần dành cho A-rôn và từ phần dành cho các con trai ông.
  rationale: Bản sửa thay các cách diễn đạt dịch từng chữ bằng thuật ngữ tiếng Việt hiện đại, trang trọng hơn, nhưng vẫn giữ cấu trúc và các liên hệ từ vựng nghi thức của tiếng Hê-bơ-rơ. Cụm “từ phần dành cho A-rôn và từ phần dành cho các con trai ông” bảo toàn sự song song phân phối của nguyên văn, không chuyển thành một khẳng định rộng hơn về quyền sở hữu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:50:06Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng các thành phần tế lễ, các động tác nghi thức tương ứng và con chiên đực của lễ phong chức. Tuy nhiên, “biệt riêng ra thánh” không phải cách diễn đạt tự nhiên cho Piel קדשׁ; “thánh hiến” vừa sát nghĩa vừa đúng văn phong. Cụm cuối cần giữ rõ hai cụm phân phối song song trong tiếng Hê-bơ-rơ.
  naturalness: “Cái ức,” “cái đùi,” và đặc biệt “phần dâng lên” tạo sắc thái khẩu ngữ hoặc không rõ đây là một thuật ngữ tế lễ. “Ức,” “đùi,” “lễ đưa qua đưa lại,” và “lễ nâng lên” tự nhiên, trang trọng, đồng thời duy trì liên kết danh từ–động từ của nguyên văn.
  terminology: Dùng “thánh hiến” cho קדשׁ. Giữ “lễ đưa qua đưa lại”/“được đưa qua đưa lại” cho תְּנוּפָה/הוּנַף và “lễ nâng lên”/“được nâng lên” cho תְּרוּמָה/הוּרָם. “Con chiên đực dùng trong lễ phong chức” phù hợp với אֵיל הַמִּלֻּאִים và không áp đặt một cách hiểu giáo phái.
  issues:
  - severity: medium
    issue: “biệt riêng ra thánh” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này có vẻ là bản dịch từng chữ và không phải kết hợp từ thông dụng. “Thánh hiến” diễn đạt đúng hành động đặt riêng làm thánh trong bối cảnh tế lễ.
  - severity: medium
    issue: “phần dâng lên” làm mờ tư cách thuật ngữ tế lễ của תְּרוּמָה.
    rationale: Danh từ này chỉ một phần tế lễ được nâng lên/dâng lên. “Lễ nâng lên” rõ hơn và liên kết minh bạch với “được nâng lên” trong cùng câu.
  - severity: low
    issue: “cái ức/cái đùi” có sắc thái khẩu ngữ và cụm giải thích bằng gạch ngang hơi nặng.
    rationale: Bỏ “cái” và dùng mệnh đề quan hệ sau dấu phẩy tạo văn phong luật tế lễ trang trọng, rõ ràng hơn.
