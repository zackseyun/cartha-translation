base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: vi
  text: Ngươi phải thánh hiến ức của lễ đưa qua đưa lại và đùi của lễ nâng lên[a], là những phần đã được đưa qua đưa lại và được nâng lên, lấy từ con chiên đực dùng trong lễ phong chức[b], từ phần dành cho A-rôn và từ phần dành cho các con trai ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đùi của phần dâng lên”; theo cách dịch truyền thống: “lễ giơ lên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “con chiên đực của sự làm đầy tay,” một thành ngữ chỉ con chiên đực được dùng trong nghi thức phong chức hoặc thánh hiến các thầy tế lễ.'
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: biệt riêng ra thánh
  rationale: Dạng Piel của קדשׁ mang nghĩa đặt riêng ra làm thánh; cách dịch này giữ được ý nghĩa nghi lễ mà vẫn rõ với độc giả hiện đại.
- source_word: חֲזֵה
  choice: cái ức
  rationale: Chỉ phần ức của con vật trong luật tế lễ; “ức” là thuật ngữ tự nhiên và chính xác trong tiếng Việt.
- source_word: תְּנוּפָה
  choice: lễ đưa qua đưa lại
  rationale: Giữ hình ảnh động tác nghi lễ và mối liên hệ với động từ הוּנַף trong cùng câu, thay vì diễn giải chung thành lễ trình dâng.
- source_word: שׁוֹק
  choice: cái đùi
  rationale: Chỉ phần đùi hoặc phần trên của chân sau con vật; “đùi” cụ thể hơn “chân”.
- source_word: תְּרוּמָה
  choice: phần dâng lên
  rationale: Diễn đạt vật được nâng lên và biệt riêng làm phần đóng góp dâng hiến, đồng thời duy trì liên hệ với động từ הוּרָם.
- source_word: הוּנַף
  choice: đã được đưa qua đưa lại
  rationale: Giữ rõ động tác nghi lễ và sự tương ứng từ vựng với תְּנוּפָה.
- source_word: הוּרָם
  choice: được nâng lên
  rationale: Dịch sát dạng bị động của רום và duy trì mối liên hệ với תְּרוּמָה.
- source_word: אֵיל הַמִּלֻּאִים
  choice: con chiên đực dùng trong lễ phong chức
  rationale: Đây là thành ngữ chỉ con chiên đực dùng trong nghi thức lập các thầy tế lễ vào chức vụ; “lễ phong chức” tự nhiên trong tiếng Việt và không buộc người đọc hiểu nghĩa đen khó hiểu.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: phần dành cho A-rôn và phần dành cho các con trai ông
  rationale: Cách dịch này thể hiện rõ hai phần được phân định cho A-rôn và các con trai ông mà không khẳng định quá mức về quyền sở hữu.
theological_decisions:
- issue: Cách dịch các thuật ngữ kỹ thuật về tế lễ
  choice: 'Giữ ngôn ngữ cụ thể về động tác nghi lễ: “lễ đưa qua đưa lại,” “phần dâng lên,” “được đưa qua đưa lại,” và “được nâng lên.”'
  alternative: Diễn giải khái quát là “lễ trình dâng” hoặc “phần dâng đặc biệt.”
  rationale: Bản Hê-bơ-rơ cố ý liên kết các danh từ với những động từ chỉ động tác nghi lễ. Giữ các liên hệ này giúp bản dịch minh bạch với nguyên văn và tránh áp đặt cách lý giải thần học về nghi thức.
- issue: Quan hệ của các phần tế lễ với A-rôn và các con trai ông
  choice: “phần dành cho A-rôn và phần dành cho các con trai ông”
  alternative: “phần thuộc về A-rôn và phần thuộc về các con trai ông”
  rationale: Giới từ לְ có thể diễn tả phần được dành hoặc phân cho họ; “dành cho” bảo toàn sắc thái phân phối mà không biến nó thành tuyên bố mạnh hơn về quyền sở hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phù hợp với lời truyền trực tiếp cho Môi-se trong ngữ cảnh luật pháp; giữ các thuật ngữ nghi lễ cụ thể nhưng bổ sung chú thích cho thành ngữ Hê-bơ-rơ và cách dịch khác.
