  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: vi
  text: Chính các ngươi, hãy đi kiếm rơm cho mình từ bất cứ nơi nào các ngươi tìm được[a], vì công việc của các ngươi sẽ không được giảm chút nào[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát hơn: “từ điều/nơi nào các ngươi tìm được.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “vì không điều gì bị giảm khỏi công việc của các ngươi”; cũng có thể hiểu theo hiện tại: “không bị giảm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם
  choice: Chính các ngươi
  rationale: Đại từ độc lập đứng trước các mệnh lệnh tạo sắc thái nhấn mạnh; “chính các ngươi” giữ được lực nhấn ấy và phù hợp với lời của Pha-ra-ôn nói với dân.
- source_word: לְכוּ קְחוּ
  choice: hãy đi kiếm lấy
  rationale: Hai động từ mệnh lệnh số nhiều lần lượt là “đi” và “lấy”; trong ngữ cảnh phải tự tìm nguồn cung ứng, “kiếm lấy” tự nhiên hơn “cầm lấy” mà vẫn giữ chuỗi mệnh lệnh.
- source_word: לָכֶם
  choice: cho mình
  rationale: 'Diễn đạt sắc thái hồi quy/lợi ích: họ phải tự lo kiếm rơm cho chính mình.'
- source_word: תֶּבֶן
  choice: rơm
  rationale: Trong bối cảnh làm gạch, từ này chỉ rơm dùng làm vật liệu; “rơm” là cách gọi chuẩn xác và thông dụng trong tiếng Việt.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: ở bất cứ nơi nào có thể tìm được
  rationale: Diễn đạt tự nhiên ý phải lấy rơm từ bất kỳ nguồn nào họ tìm thấy; “có thể” làm rõ hàm ý thực tế mà không giới hạn nơi chốn.
- source_word: כִּי
  choice: vì
  rationale: 'Giữ nghĩa nhân quả thông thường của liên từ: mệnh lệnh tự kiếm rơm được gắn với điều kiện rằng khối lượng công việc không giảm.'
- source_word: אֵין נִגְרָע
  choice: sẽ không được giảm
  rationale: Cấu trúc phủ định với động từ bị động chỉ việc không có sự cắt giảm; thì tương lai phù hợp với sắc thái mệnh lệnh và chính sách đang được áp đặt.
- source_word: מֵעֲבֹדַתְכֶם דָּבָר
  choice: công việc của các ngươi ... chút nào
  rationale: Trong thành ngữ phủ định, דָּבָר có nghĩa “một điều/chút gì”; “không ... chút nào” là cách diễn đạt tiếng Việt rõ và tự nhiên cho việc hoàn toàn không giảm khối lượng lao dịch.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “các ngươi” để phản ánh lời truyền lệnh mang tính bề trên của Pha-ra-ôn; “chính” bảo toàn sự nhấn mạnh của đại từ Hê-bơ-rơ độc lập. Câu giữ liên từ nhân quả “vì” thay vì chuyển thành tương phản.
