  to: Chính các ngươi, hãy đi kiếm rơm cho mình từ bất cứ nơi nào các ngươi tìm được[a], vì công việc của các ngươi sẽ không được giảm chút nào[b].
  rationale: Sửa nhẹ cụm chỉ nguồn rơm để bảo toàn động từ ngôi thứ hai số nhiều và quan hệ “từ nơi/nguồn nào tìm được,” đồng thời chỉnh chú thích b cho sát cấu trúc “không điều gì bị giảm khỏi công việc.” Các lựa chọn còn lại được giữ nguyên vì trung thành với tiếng Hê-bơ-rơ và tự nhiên trong tiếng Việt hiện đại.
