base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: vi
  text: 'Nhưng vua Ai Cập nói với họ: “Môi-se và A-rôn, tại sao các ngươi làm dân chúng sao lãng công việc của họ?[a] Hãy đi lo những gánh nặng của các ngươi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khiến dân chúng ngưng làm công việc của họ.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “Hãy đi lo công việc lao dịch của các ngươi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng ... nói
  rationale: Dạng waw liên tiếp tiếp diễn mạch kể chuyện; “Nhưng” diễn tả tự nhiên lời đáp đối nghịch của vua Ai Cập trước yêu cầu ở câu trước.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: vua Ai Cập
  rationale: Cách chuyển ngữ tự nhiên, trang trọng của kết cấu sở hữu trong tiếng Hê-bơ-rơ.
- source_word: לָמָּה
  choice: tại sao
  rationale: Giữ nguyên câu hỏi trực tiếp bằng cách nói thông dụng trong tiếng Việt hiện đại.
- source_word: תַּפְרִיעוּ
  choice: làm ... xao nhãng
  rationale: Dạng Hiphil của פרע tại đây chỉ việc khiến dân ngưng hoặc rời khỏi lao động; lựa chọn này giữ sắc thái gây cản trở trong lời buộc tội của Pha-ra-ôn mà không diễn giải thành sự giải phóng.
- source_word: הָעָם
  choice: dân chúng
  rationale: Giữ nghĩa rộng của danh từ chỉ toàn dân, thay vì thu hẹp thành “những người lao động”.
- source_word: מִמַּעֲשָׂיו
  choice: công việc của họ
  rationale: Hậu tố số ít đi với danh từ tập hợp “dân”; tiếng Việt dùng đại từ số nhiều để diễn đạt tự nhiên.
- source_word: לְכוּ
  choice: Hãy trở về
  rationale: Trong ngữ cảnh, mệnh lệnh không chỉ bảo họ đi mà bảo họ quay lại công việc lao dịch; “trở về” truyền đạt đích đến được nêu ngay sau đó một cách tự nhiên.
- source_word: לְסִבְלֹתֵיכֶם
  choice: với những gánh nặng của các ngươi
  rationale: Giữ hình ảnh cụ thể của סבלות và sắc thái lao động nặng nhọc, áp bức; chú thích nêu cách hiểu minh thị hơn là “lao dịch”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời quở trách từ người có quyền lực, đồng thời giữ số nhiều; dùng tên “Môi-se” và “A-rôn” theo dạng quen thuộc trong tiếng Việt.
