source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: vi
  text: 'Nhưng ông nói: “Các ngươi lười biếng, thật lười biếng![a] Vì thế các ngươi mới nói: ‘Chúng ta hãy đi dâng sinh tế cho Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ lặp lại từ “lười biếng” để nhấn mạnh; cũng có thể dịch: “Các ngươi biếng nhác, quá biếng nhác!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng ông nói
  rationale: Động từ kể chuyện có waw nối tiếp; trong ngữ cảnh đây là lời Pha-ra-ôn bác lại lời kêu xin, nên “Nhưng” diễn đạt tự nhiên sắc thái đối lập.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: Các ngươi lười biếng, thật lười biếng!
  rationale: נִרְפִּים ở đây là lời cáo buộc thiếu siêng năng. Tiếng Việt khó lặp nguyên dạng mà vẫn tự nhiên, nên thêm “thật” để giữ sức nhấn mạnh của sự lặp từ.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: 'Cụm từ nêu kết luận nhân quả mà Pha-ra-ôn áp đặt: theo ông, sự lười biếng là nguyên nhân khiến họ xin đi dâng tế lễ.'
- source_word: אֹמְרִים
  choice: các ngươi mới nói
  rationale: Phân từ được dùng như động từ hiện tại. Từ “mới” kết hợp với “Vì thế” làm rõ quan hệ suy luận trong lời cáo buộc, không thêm nội dung mới.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Chúng ta hãy đi dâng sinh tế
  rationale: Hai động từ cohortative ngôi thứ nhất số nhiều diễn tả lời đề nghị/thúc giục. “Hãy” giữ lực thái của thể cohortative; “dâng sinh tế” là cách diễn đạt tự nhiên cho hành động tế lễ.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giới từ ל chỉ đối tượng tiếp nhận sinh tế; giữ tên riêng giao ước Yahweh thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn chức năng tên riêng và không áp đặt truyền thống thay thế bằng tước hiệu.
translation_notes:
  register: Văn phong trực tiếp, trang trọng vừa phải và dễ hiểu. “Các ngươi” phù hợp với lời quở trách từ người có quyền lực đối với một nhóm người; “sinh tế” giữ sắc thái thờ phượng của ngữ cảnh.
