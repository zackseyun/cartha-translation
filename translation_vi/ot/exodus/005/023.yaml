base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: vi
  text: Vì từ khi con đến gặp Pha-ra-ôn để nói nhân danh Ngài[a], ông ta đã gây họa cho dân này[b], và Ngài chẳng hề giải cứu dân Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ khi con đến gặp Pha-ra-ôn để nói trong danh Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ông ta đã khiến tình cảnh dân này tồi tệ hơn.”'
    reason: lexical_alternative
  - marker: c
    text: 'Tiếng Hê-bơ-rơ dùng nguyên mẫu tuyệt đối cùng với động từ có cùng gốc—theo sát là “giải cứu, Ngài đã không giải cứu”—để nhấn mạnh lời phủ định: “Ngài chẳng hề giải cứu.”'
    reason: source_form
lexical_decisions:
- source_word: וּמֵאָז
  choice: Vì từ khi
  rationale: מֵאָז chỉ thời điểm khởi đầu kéo dài đến hiện tại, còn וּ trong mạch văn đưa ra lý do cho lời than phiền; “Vì từ khi” giữ được cả quan hệ giải thích lẫn ý thời gian.
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: con đến gặp Pha-ra-ôn
  rationale: בוא với אֶל diễn tả việc đến chỗ một người. “Đến gặp” tự nhiên trong tiếng Việt và phù hợp với việc Môi-se vào yết kiến Pha-ra-ôn.
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: để nhân danh Ngài mà nói
  rationale: Động từ nguyên mẫu nêu mục đích; בִּשְׁמֶךָ theo nghĩa đen là “trong danh Ngài” và ở đây hàm ý nói với tư cách đại diện, dưới thẩm quyền của Đức Chúa Trời. “Nhân danh Ngài” vừa tự nhiên vừa giữ sức nặng thần học.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: ông ta đã gây họa cho dân này
  rationale: Hiphil của רעע có thể chỉ làm điều dữ, gây hại hoặc khiến tình hình xấu đi. “Gây họa” giữ được cả sắc thái đạo đức lẫn hậu quả tai hại mà không thu hẹp nghĩa quá mức.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: thế mà Ngài chẳng hề giải cứu
  rationale: Nguyên mẫu tuyệt đối đi với động từ hữu hạn cùng gốc nhấn mạnh lời phủ định. “Chẳng hề giải cứu” diễn đạt tự nhiên ý hoàn toàn chưa giải cứu; “thế mà” thể hiện sự tương phản đầy căng thẳng trong lời Môi-se than với Đức Chúa Trời.
- source_word: אֶת־עַמֶּךָ
  choice: dân Ngài
  rationale: Cụm từ là tân ngữ trực tiếp “dân của Ngài”; cách nói “dân Ngài” trang trọng, rõ ràng và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Mức độ nhấn mạnh trong lời Môi-se nói rằng Đức Chúa Trời chưa giải cứu dân
  choice: Ngài chẳng hề giải cứu dân Ngài
  alternative: Ngài hoàn toàn chưa giải cứu dân Ngài
  rationale: Cấu trúc nguyên mẫu tuyệt đối cộng với động từ hữu hạn nhấn mạnh lời phủ định. “Chẳng hề” bảo toàn sức mạnh của lời than phiền táo bạo mà không biến nó thành một khẳng định thần học vượt quá thời điểm câu chuyện.
- issue: Ý nghĩa của בִּשְׁמֶךָ
  choice: nhân danh Ngài
  alternative: với thẩm quyền của Ngài
  rationale: “Nhân danh Ngài” gần với hình thức của nguyên ngữ, vẫn dễ hiểu trong tiếng Việt hiện đại, đồng thời không giản lược danh của Đức Chúa Trời thành một khái niệm chức năng đơn thuần.
- issue: Chủ thể của הֵרַע
  choice: ông ta, tức Pha-ra-ôn
  alternative: 'không nêu chủ thể rõ ràng: tình cảnh dân này đã trở nên tồi tệ'
  rationale: Dạng động từ ngôi thứ ba số ít giống đực tự nhiên quy về Pha-ra-ôn, nhân vật nam số ít được nhắc ngay trước đó. Bản dịch nêu “ông ta” để tiếng Việt rõ nghĩa nhưng không dùng đại từ miệt thị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Môi-se xưng “con” với Đức Chúa Trời và gọi Ngài là “Ngài”; Pha-ra-ôn được gọi là “ông ta” để tránh thêm sắc thái khinh miệt không có trong nguyên văn. Câu giữ nguyên sức căng của lời than phiền, không làm nhẹ đi lời Môi-se cũng không suy diễn động cơ của Đức Chúa Trời.
