    issue: Cụm “đè nặng trên những người ấy” và “làm lụng trong đó” thiếu tự nhiên, đồng thời “trong đó” chuyển đại từ chỉ công việc thành chỉ địa điểm.
    rationale: עַל diễn tả gánh nặng đặt lên người lao động, phù hợp với “đè nặng lên.” בָּהּ quy chiếu về עֲבֹדָה (“công việc”), nên cần “việc ấy,” không phải “trong đó.”
  - severity: low
