revisions:
- from: Hãy làm cho công việc đè nặng trên những người ấy, để họ cứ làm lụng trong đó và không chú ý đến những lời dối trá.[a]
  to: Hãy để công việc đè nặng lên những người đàn ông ấy, để họ làm việc ấy và không chú ý đến những lời dối trá.[a]
  rationale: Sửa các cách diễn đạt chưa tự nhiên và làm rõ đại từ quy chiếu về “công việc,” đồng thời phản ánh cụ thể hơn nghĩa “những người đàn ông” của nguyên văn. Không thay đổi nội dung, mức độ mơ hồ, hay tính chất lời nói trực tiếp của Pha-ra-ôn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:12:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mệnh lệnh của Pha-ra-ôn: gia tăng gánh lao dịch để những người đàn ông chỉ làm việc và không lưu tâm đến lời bị ông quy là dối trá. Tuy nhiên, “đè nặng trên” không tự nhiên bằng cấu trúc tiếng Việt “đè nặng lên”; “trong đó” không phù hợp khi đại từ Hê-bơ-rơ quy chiếu về công việc, không phải một nơi chốn. Bản sửa cũng phục hồi rõ nghĩa “những người đàn ông” của הָאֲנָשִׁים.'
  naturalness: “Hãy để công việc đè nặng lên...” là một mệnh lệnh tự nhiên, vẫn giữ hình ảnh gánh nặng của nguyên văn. “Để họ làm việc ấy” rõ ràng, không thêm sắc thái kéo dài của “cứ” và tránh cách nói không tự nhiên “làm lụng trong đó.”
  terminology: Giữ “công việc,” “những người đàn ông,” và “những lời dối trá.” Cụm cuối vẫn là lời quy kết của Pha-ra-ôn trong diễn từ trực tiếp, không phải lời xác nhận của người kể chuyện. Chú thích nêu đúng các khả năng ngữ nghĩa của שעה.
  issues:
