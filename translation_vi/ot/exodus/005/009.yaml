base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/009.yaml
  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: vi
  text: Hãy để công việc đè nặng lên những người đàn ông ấy, để họ làm việc ấy và không chú ý đến những lời dối trá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không nghe theo những lời giả dối” hoặc “không hướng lòng về những lời lừa dối.” Động từ Hê-bơ-rơ có thể mang nghĩa “chú ý đến,” “coi trọng” hay “nghe theo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: Hãy làm cho ... đè nặng
  rationale: Động từ Qal chưa hoàn thành, ngôi 3 giống cái số ít, có הָעֲבֹדָה làm chủ ngữ. Cách diễn đạt này giữ hình ảnh sức nặng và thể hiện tự nhiên mệnh lệnh của Pha-ra-ôn muốn gia tăng gánh lao dịch.
- source_word: הָעֲבֹדָה
  choice: công việc
  rationale: עֲבֹדָה chỉ công việc, lao động hoặc sự phục dịch; trong ngữ cảnh làm gạch và lao dịch cưỡng bức, “công việc” rõ ràng và tự nhiên.
- source_word: עַל
  choice: trên
  rationale: Giới từ diễn tả gánh nặng đặt lên những người lao động; trong tiếng Việt, kết hợp “đè nặng trên” giữ được hình ảnh của nguyên văn.
- source_word: הָאֲנָשִׁים
  choice: những người ấy
  rationale: Danh từ có nghĩa cơ bản là “những người đàn ông”; ở đây mạo từ xác định nhóm lao động vừa được nhắc đến. “Những người ấy” tự nhiên trong tiếng Việt và không biến từ này thành một thuật ngữ nghề nghiệp vốn không có trong nguyên văn.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: để họ cứ làm lụng trong đó
  rationale: עשה kết hợp với đại từ בָהּ, quy chiếu về “công việc”, mang nghĩa làm hoặc miệt mài với công việc ấy. “Cứ làm lụng” thể hiện mục đích của mệnh lệnh và sức ép phải chuyên chú lao động.
- source_word: וְאַל יִשְׁעוּ
  choice: và không chú ý đến
  rationale: אַל với động từ chưa hoàn thành diễn tả sự ngăn cấm hoặc kết quả tiêu cực được nhắm tới. שעה có thể là chú ý, lưu tâm hoặc nghe theo; “không chú ý đến” rõ nghĩa mà vẫn để các sắc thái gần nhau trong chú thích.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: những lời dối trá
  rationale: דִּבְרֵי là “những lời/lời nói”, còn שָׁקֶר là sự giả dối. Cụm từ truyền đạt lời quy kết mang tính miệt thị của Pha-ra-ôn đối với lời Môi-se và A-rôn.
theological_decisions:
- issue: Tính chất của “những lời dối trá”
  choice: Giữ nguyên lời quy kết của Pha-ra-ôn, không xác nhận đó là đánh giá của người kể chuyện.
  alternative: Diễn giải thành “những lời mà Pha-ra-ôn gọi là dối trá”.
  rationale: Nguyên văn trực tiếp ghi lời Pha-ra-ôn. Bản dịch nên giữ sức mạnh của phát ngôn mà không thêm lời giải thích vào chính câu Kinh Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đè nặng” giữ hình ảnh của tiếng Hê-bơ-rơ; “cứ làm lụng” truyền đạt sức ép lao dịch. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
