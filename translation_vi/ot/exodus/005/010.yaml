base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: vi
  text: 'Vậy, các đốc công của dân và các viên chức của dân[a] đi ra và nói với dân: “Pharaon nói thế này: Ta không cấp rơm cho các ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các quản đốc của dân”. Từ Hê-bơ-rơ này có thể chỉ những viên chức cấp dưới trong dân.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: những người đốc công
  rationale: Trong bối cảnh lao dịch cưỡng bức ở Xuất Hành, từ này chỉ những người giám sát và thúc ép dân hoàn thành chỉ tiêu; “người đốc công” tự nhiên và giữ rõ sắc thái cưỡng chế.
- source_word: שֹׁטְרָיו
  choice: các viên chức của họ
  rationale: Hậu tố số ít trong tiếng Hê-bơ-rơ quy chiếu về danh từ tập thể “dân”; cách dịch này giữ nghĩa hành chính rộng, không thu hẹp chắc chắn thành “quản đốc” hay “đội trưởng”.
- source_word: וַיֵּצְאוּ
  choice: đi ra
  rationale: Giữ chuyển động tường thuật thông thường của động từ, từ nơi Pharaon hiện diện đến chỗ dân chúng.
- source_word: הָעָם
  choice: dân
  rationale: Diễn đạt tự nhiên danh từ tập thể, trong văn cảnh chỉ dân lao dịch Israel.
- source_word: לֵאמֹר
  choice: nói với dân
  rationale: Chuyển công thức dẫn lời sang cú pháp tiếng Việt tự nhiên mà vẫn giữ chức năng giới thiệu lời trực tiếp.
- source_word: כֹּה אָמַר
  choice: phán thế này
  rationale: Giữ sắc thái trang trọng của công thức sứ giả và phù hợp với lời công bố của một vị vua.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Dùng dạng tên hiệu quen thuộc và dễ nhận biết trong tiếng Việt hiện đại.
- source_word: אֵינֶנִּי נֹתֵן
  choice: Ta không cấp
  rationale: Diễn đạt sự từ chối đang có hiệu lực của kết cấu phủ định với phân từ; “cấp” hợp với việc nhà cầm quyền phân phát vật liệu lao động.
- source_word: תֶּבֶן
  choice: rơm
  rationale: Từ tiếng Việt thông dụng cho vật liệu được dùng trong việc làm gạch ở văn cảnh kế cận.
