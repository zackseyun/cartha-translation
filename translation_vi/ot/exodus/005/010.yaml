  rationale: Bản sửa làm rõ đối tượng quy chiếu của hậu tố trong “các viên chức của dân”, loại bỏ ý không có trong chú thích, và nối hai động từ tường thuật bằng “và” cho mạch câu tự nhiên. Các lựa chọn từ vựng chính và nội dung lời công bố được giữ nguyên.
