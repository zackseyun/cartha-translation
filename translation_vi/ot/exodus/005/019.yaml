  to: 'Bấy giờ, các đốc công người Y-sơ-ra-ên thấy mình lâm vào cảnh khốn khó khi được bảo rằng: “Các ngươi không được giảm số gạch phải làm; định mức mỗi ngày phải được hoàn thành ngay trong ngày đó.”'
  rationale: Sửa cách gọi tập thể cho tự nhiên, bỏ liên từ đối lập không có trong nguyên ngữ, và diễn đạt rõ thành ngữ “việc của ngày trong ngày ấy” là định mức phải hoàn thành trong từng ngày. Không thêm chú thích vì bản văn Việt đã chuyển tải rõ nghĩa thành ngữ.
