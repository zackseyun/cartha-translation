  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: vi
  text: 'Bấy giờ, các đốc công người Y-sơ-ra-ên thấy mình lâm vào cảnh khốn khó khi được bảo rằng: “Các ngươi không được giảm số gạch phải làm; định mức mỗi ngày phải được hoàn thành ngay trong ngày đó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: thấy
  rationale: Giữ nghĩa cơ bản của ראה, đồng thời trong ngữ cảnh tự nhiên mang sắc thái nhận ra tình cảnh của mình.
- source_word: שֹׁטְרֵי
  choice: các đốc công
  rationale: Chỉ những người Y-sơ-ra-ên làm cấp quản lý lao động dưới quyền Ai Cập; “đốc công” rõ nghĩa trong mạch truyện hơn “quan chức”.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Diễn đạt tự nhiên trong tiếng Việt tên gọi tập thể theo nghĩa đen “các con trai/con cái của Y-sơ-ra-ên”, không giới hạn đối tượng vào nam giới.
- source_word: אֹתָם בְּרָע
  choice: mình lâm vào cảnh khốn khó
  rationale: Đại từ chỉ chính các đốc công; בְּרָע nói về hoàn cảnh bất lợi, không phải sự ác về mặt đạo đức.
- source_word: לֵאמֹר
  choice: khi nghe lệnh rằng
  rationale: Trong ngữ cảnh, từ này dẫn vào lời quy định cho thấy họ đang gặp nguy; cách diễn đạt này tự nhiên hơn lối dịch máy móc “rằng rằng”.
- source_word: לֹא תִגְרְעוּ
  choice: không được giảm
  rationale: Truyền đạt rõ sức mạnh của mệnh lệnh phủ định và nghĩa “làm giảm, bớt đi” của גרע.
- source_word: מִלִּבְנֵיכֶם
  choice: số gạch phải làm
  rationale: Tiếng Việt cần nêu rõ số lượng gạch thuộc phần việc được giao; “phải làm” được suy ra từ ngữ cảnh hạn ngạch lao động.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: mỗi ngày phải đủ phần của ngày ấy
  rationale: Giữ được sự lặp lại nhấn mạnh của thành ngữ Hê-bơ-rơ “phần việc của một ngày trong ngày ấy”, tức định mức phải hoàn thành từng ngày.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” trong lời của nhà cầm quyền để thể hiện số nhiều và sắc thái mệnh lệnh; giữ cách gọi Y-sơ-ra-ên quen thuộc trong tiếng Việt Kinh Thánh.
