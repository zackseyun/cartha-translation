review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhận đúng các yếu tố chính: lời của Pha-ra-ôn, sắc thái nhấn của הֵן, số lượng đông, «dân trong xứ», thời điểm hiện tại, và động từ Hiphil mang nghĩa khiến người khác thôi/ngừng. Tuy nhiên, «bắt họ ngừng những công việc nặng nhọc» thiếu động từ «làm», nên cấu trúc tiếng Việt có thể bị hiểu là bắt họ ngừng chính các công việc, thay vì khiến họ thôi làm các công việc ấy. Bản sửa giữ quan hệ «thôi/ngừng làm ...» và không thu hẹp סִבְלֹתָם chỉ còn một nghĩa duy nhất.'
  naturalness: «Kìa» và «các ngươi» phù hợp văn phong Kinh Thánh trang trọng, hiện đại. Thêm «làm» sau «ngừng» làm câu tự nhiên, rõ nghĩa hơn. «Rất đông» là cách nói thông dụng; «lại» thích hợp với giọng trách cứ trong ngữ cảnh.
  terminology: Giữ «Pha-ra-ôn», «dân trong xứ», và «công việc nặng nhọc» trong bản văn. Chú thích nêu các cách dịch gần nghĩa «lao dịch» và «gánh nặng», bảo toàn độ mở từ vựng của סִבְלֹתָם. Không có vấn đề thuật ngữ thần học.
  issues:
  - severity: medium
    issue: Cụm «bắt họ ngừng những công việc nặng nhọc» thiếu từ «làm» sau «ngừng».
    rationale: Trong tiếng Việt, «ngừng những công việc» không diễn đạt rõ việc người ta thôi thực hiện công việc. «Khiến họ ngừng làm những công việc nặng nhọc» vừa tự nhiên vừa phản ánh chính xác cấu trúc gây khiến của Hiphil הִשְׁבַּתֶּם.
