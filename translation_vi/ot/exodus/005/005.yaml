  yaml_path: translation/ot/exodus/005/005.yaml
  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: vi
  text: 'Pha-ra-ôn nói: “Kìa, dân trong xứ hiện nay rất đông, vậy mà các ngươi lại khiến họ ngừng làm những công việc nặng nhọc của mình.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các ngươi khiến họ thôi lao dịch” hoặc “các ngươi cho họ nghỉ khỏi những gánh nặng của mình.” Động từ Hê-bơ-rơ có dạng gây khiến, nghĩa là làm cho ngừng hoặc thôi; cách diễn đạt cụ thể tùy vào việc hiểu danh từ theo nghĩa “gánh nặng” hay “lao dịch”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Kìa
  rationale: Giữ sắc thái chỉ dẫn và nhấn mạnh trong lời nhận xét của Pha-ra-ôn, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: רַבִּים
  choice: thật đông
  rationale: Diễn đạt tự nhiên ý số lượng nhiều trong cấu trúc vị ngữ, với mức nhấn phù hợp từ הֵן.
- source_word: עַם הָאָרֶץ
  choice: dân trong xứ
  rationale: Bám sát nghĩa của cụm Hê-bơ-rơ nhưng tránh cách nói thiếu tự nhiên “dân của đất”; không diễn giải thêm thành một tầng lớp xã hội cụ thể.
- source_word: עַתָּה
  choice: hiện nay
  rationale: Thể hiện rõ tình trạng ở thời điểm Pha-ra-ôn đang nói.
- source_word: וְהִשְׁבַּתֶּם
  choice: các ngươi lại bắt họ ngừng
  rationale: Động từ Hiphil mang nghĩa khiến hoặc làm cho ngừng. “Bắt họ ngừng” giữ lực gây khiến và hợp với giọng trách cứ; “lại” diễn đạt quan hệ đối nghịch hàm chứa trong lời phàn nàn.
- source_word: מִסִּבְלֹתָם
  choice: những công việc nặng nhọc của mình
  rationale: Trong ngữ cảnh Xuất Hành, danh từ chỉ các gánh nặng lao dịch. Cách dịch này rõ nghĩa trong tiếng Việt mà vẫn giữ hình ảnh về lao dịch nặng nhọc.
