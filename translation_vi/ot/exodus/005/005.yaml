revisions:
- from: 'Pha-ra-ôn nói: “Kìa, dân trong xứ hiện nay thật đông, vậy mà các ngươi lại bắt họ ngừng những công việc nặng nhọc của mình.”[a]'
  to: 'Pha-ra-ôn nói: “Kìa, dân trong xứ hiện nay rất đông, vậy mà các ngươi lại khiến họ ngừng làm những công việc nặng nhọc của mình.”[a]'
  rationale: Chỉ sửa lỗi diễn đạt trong tiếng Việt bằng cách thêm «làm» và dùng «khiến» để phản ánh lực gây khiến mà không hàm ý cưỡng ép quá mức. Các lựa chọn còn lại, kể cả chú thích và vị trí neo [a], được giữ nguyên về nội dung.
