base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/020.yaml
  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: vi
  text: Khi họ từ chỗ Pha-ra-ôn đi ra, họ gặp Môi-se và A-rôn[a] đang đứng đợi họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ chạm mặt Môi-se và A-rôn.” Trong một số ngữ cảnh, động từ này có thể mang sắc thái “đối đầu,” nhưng ở đây bản văn không nhất thiết đòi hỏi sắc thái ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: Họ gặp
  rationale: Động từ פגע có thể mang nghĩa “gặp, chạm mặt,” và trong một số ngữ cảnh có sắc thái đối đầu. Ở đây, “gặp” giữ nghĩa rộng của từ, còn thái độ gay gắt được thể hiện qua lời nói ở câu kế tiếp.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Môi-se và A-rôn
  rationale: Các dấu chỉ tân ngữ trực tiếp không được biểu đạt riêng trong tiếng Việt; tên riêng được phiên âm theo cách quen dùng và dễ nhận biết.
- source_word: נִצָּבִים
  choice: đang đứng
  rationale: Phân từ của נצב chỉ trạng thái đứng hoặc đứng tại một vị trí; “đang đứng” diễn đạt tự nhiên sắc thái kéo dài của hành động trong cảnh này.
- source_word: לִקְרָאתָם
  choice: đón họ
  rationale: לִקְרַאת thường chỉ việc hướng đến hoặc ở vị trí chờ để gặp ai. Trong tiếng Việt, “đứng đón họ” tự nhiên hơn việc lặp lại “đứng để gặp họ” và không áp đặt sắc thái đối đầu.
- source_word: בְּצֵאתָם
  choice: khi họ … đi ra
  rationale: Cấu trúc nguyên mẫu với בְּ biểu thị hoàn cảnh thời gian; cách dịch này giữ rõ quan hệ đồng thời và hợp với tiếng Việt hiện đại.
- source_word: מֵאֵת פַּרְעֹה
  choice: từ chỗ Pha-ra-ôn
  rationale: מֵאֵת diễn tả chuyển động rời khỏi một người hoặc nơi người ấy hiện diện. “Từ chỗ Pha-ra-ôn” tự nhiên và rõ hơn “từ Pha-ra-ôn,” đồng thời không thêm ý về một địa điểm cụ thể.
