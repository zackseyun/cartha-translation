  source_fidelity: 'Bản dịch truyền đạt đầy đủ chuỗi mệnh lệnh và đối lập của tiếng Hê-bơ-rơ: lời chuyển tiếp nhấn mạnh, lệnh đi làm, việc không cấp rơm, và yêu cầu phải giao đủ định mức gạch. “Nộp đủ số gạch quy định” diễn đạt đúng תֹכֶן לְבֵנִים và nghĩa ngữ cảnh của תִּתֵּנּוּ.'
