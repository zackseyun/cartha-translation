source:
  edition: WLC
  text: וְ/עַתָּה֙ לְכ֣וּ עִבְד֔וּ וְ/תֶ֖בֶן לֹא יִנָּתֵ֣ן לָ/כֶ֑ם וְ/תֹ֥כֶן לְבֵנִ֖ים תִּתֵּֽנּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: vi
  text: Vậy bây giờ, hãy đi làm việc! Rơm sẽ không được cấp cho các ngươi, nhưng các ngươi vẫn phải nộp đủ số gạch quy định.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “phải nộp định mức gạch.” Từ Hê-bơ-rơ תֹכֶן chỉ một số lượng cố định hoặc đã được đo lường mà người lao động phải hoàn thành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ sắc thái chuyển tiếp và nhấn mạnh của lời kết luận, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: לְכוּ עִבְדוּ
  choice: hãy đi làm việc
  rationale: Hai mệnh lệnh được giữ lại; trong ngữ cảnh này עבד chỉ lao động cưỡng bức chứ không phải phụng sự theo nghĩa thờ phượng.
- source_word: וְתֶבֶן לֹא יִנָּתֵן לָכֶם
  choice: Rơm sẽ không được cấp cho các ngươi
  rationale: Dịch thể bị động của נתן và dùng “được cấp” để diễn đạt tự nhiên việc cung ứng nguyên liệu; “các ngươi” phù hợp với lời ra lệnh từ bề trên trong bối cảnh cổ đại.
- source_word: תֹכֶן לְבֵנִים
  choice: đủ số gạch quy định
  rationale: תֹכֶן chỉ một lượng đã được đo lường hoặc ấn định; cách diễn đạt này rõ nghĩa đối với độc giả phổ thông và phù hợp với danh từ số nhiều “gạch”.
- source_word: תִּתֵּנּוּ
  choice: phải nộp đủ
  rationale: Động từ có nghĩa đen là “các ngươi sẽ giao/nộp”; trong ngữ cảnh, nó diễn tả nghĩa vụ phải giao đủ sản lượng đã ấn định.
theological_decisions: []
