  terminology: “Rơm,” “cấp,” và “số gạch quy định” phù hợp ngữ cảnh lao dịch. Chú thích giải thích chính xác nghĩa lượng/định mức cố định của תֹכֶן, đồng thời đưa ra phương án diễn đạt hợp lệ.
