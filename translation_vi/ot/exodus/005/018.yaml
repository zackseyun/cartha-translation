  register: Văn phong hiện đại, trang trọng và trực tiếp. Dấu chấm than thể hiện sức nặng của mệnh lệnh; “các ngươi” duy trì quan hệ quyền lực trong lời Pha-ra-ôn mà không thêm cách giải thích mang tính thần học.
