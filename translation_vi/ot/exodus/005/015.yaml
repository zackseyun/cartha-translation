  text: וַ/יָּבֹ֗אוּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּצְעֲק֥וּ אֶל פַּרְעֹ֖ה לֵ/אמֹ֑ר לָ֧/מָּה תַעֲשֶׂ֦ה כֹ֖ה לַ/עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: vi
  text: 'Bấy giờ, các quản đốc của con cái Y-sơ-ra-ên[a] đến kêu lên với Pha-ra-ôn rằng: “Tại sao bệ hạ làm như vậy[c] với các tôi tớ[b] của bệ hạ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người Y-sơ-ra-ên”; nguyên văn là “con cái của Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ ở đây có thể có nghĩa là “tôi tớ” hoặc “nô lệ.”
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “làm như thế.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Bấy giờ ... đến
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên sự chuyển tiếp trong lời kể.
- source_word: שֹׁטְרֵי
  choice: các quản đốc
  rationale: Trong bối cảnh này, từ này chỉ những người Y-sơ-ra-ên có trách nhiệm giám sát và quản lý lao dịch dưới quyền Ai Cập; “quản đốc” rõ nghĩa hơn “quan chức” và phù hợp vai trò của họ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh thân tộc của nguyên văn “các con trai/con cái của Y-sơ-ra-ên”, đồng thời trong tiếng Việt có thể chỉ toàn thể hậu duệ, không chỉ nam giới.
- source_word: וַיִּצְעֲקוּ
  choice: kêu lên
  rationale: Diễn tả một lời kêu cầu khẩn thiết và phản đối mạnh mẽ, hơn là một lời thỉnh cầu thuần túy theo nghi thức.
- source_word: אֶל־פַּרְעֹה
  choice: với Pha-ra-ôn
  rationale: Giới từ chỉ hướng lời kêu đến Pha-ra-ôn; “kêu lên với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức dẫn lời trực tiếp được chuyển thành “rằng” để câu tiếng Việt tự nhiên và trang trọng.
- source_word: לָמָּה
  choice: Tại sao
  rationale: Tương đương trực tiếp và tự nhiên với từ nghi vấn chỉ nguyên nhân.
- source_word: תַעֲשֶׂה כֹה
  choice: lại làm như vậy
  rationale: Bám sát ý “làm như thế” của tiếng Hê-bơ-rơ; từ “lại” truyền đạt sắc thái chất vấn trước cách hành xử hiện tại mà không thêm một nội dung cụ thể.
- source_word: לַעֲבָדֶיךָ
  choice: với các tôi tớ của bệ hạ
  rationale: “Tôi tớ” giữ lời tự xưng khiêm nhường trong lời thỉnh cầu trước vua; “bệ hạ” thể hiện quan hệ xưng hô với Pha-ra-ôn do tiếng Việt đòi hỏi, trong khi nguyên văn dùng đại từ ngôi hai số ít.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng văn phong kể chuyện trang trọng nhưng dễ hiểu. “Bệ hạ” và “tôi tớ” tái hiện lối xưng hô cung đình, còn “kêu lên” giữ được tính khẩn thiết của lời khiếu nại. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
