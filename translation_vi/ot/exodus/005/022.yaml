  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֗/י לָ/מָ֤ה הֲרֵעֹ֨תָה֙ לָ/עָ֣ם הַ/זֶּ֔ה לָ֥/מָּה זֶּ֖ה שְׁלַחְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se trở lại với Yahweh và thưa: “Lạy Chúa, tại sao Ngài lại giáng họa trên dân này? Vậy tại sao Ngài lại sai con?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: trở lại
  rationale: Động từ שוב ở đây diễn tả Môi-se quay lại để trình bày với Đức Chúa Trời; “trở lại” tự nhiên và sát nghĩa.
- source_word: אֶל יְהוָה
  choice: với Yahweh
  rationale: Giới từ אֶל hướng hành động về phía người được gặp và thưa chuyện; trong tiếng Việt, “trở lại với Yahweh” tự nhiên. Danh riêng giao ước יְהוָה được phiên là “Yahweh”.
- source_word: אֲדֹנָי
  choice: Lạy Chúa
  rationale: Đây là cách xưng hô tôn kính trực tiếp với Đức Chúa Trời; “Lạy Chúa” phù hợp với lời cầu vấn mà không quá cổ.
- source_word: הֲרֵעֹתָה
  choice: lại giáng họa trên
  rationale: Dạng Hiphil của רעע nói đến việc gây tai họa hoặc khiến điều xấu xảy đến. “Giáng họa trên” giữ lực gây tác hại, đồng thời không tự ý chuyển thành lời quy kết điều ác luân lý.
- source_word: לָעָם הַזֶּה
  choice: dân này
  rationale: עָם chỉ cộng đồng dân Israel; “dân này” ngắn gọn và tự nhiên.
- source_word: לָמָּה זֶּה
  choice: Vì sao ... đến đây
  rationale: Cụm לָמָּה זֶּה là lối hỏi nhấn mạnh. Trong mạch văn, “đến đây” truyền đạt sắc thái “vì sao lại sai con làm việc này/đến chỗ này” tự nhiên trong tiếng Việt.
- source_word: שְׁלַחְתָּנִי
  choice: Ngài sai con
  rationale: 'Động từ ở ngôi hai số ít với hậu tố ngôi một: “Ngài đã sai con”; trong câu hỏi tiếng Việt, “Ngài sai con” tự nhiên hơn mà vẫn giữ nghĩa quá khứ từ ngữ cảnh.'
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Văn bản dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” phân biệt danh này với tước hiệu אֲדֹנָי được dịch là “Chúa” ngay sau đó.
- issue: Sắc thái lời Môi-se về hành động của Đức Chúa Trời
  choice: giáng họa trên dân này
  alternative: làm điều ác cho dân này; gây tai họa cho dân này
  rationale: הֲרֵעֹתָה có thể được nghe rất mạnh là “làm điều xấu/ác”, nhưng trong dạng gây khiến và bối cảnh dân chịu khốn khổ, “giáng họa” giữ sự gay gắt của lời chất vấn mà không giải nghĩa nó thành sự ác luân lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se”, đại từ kính trọng “Ngài” và cách tự xưng “con” trong lời thưa với Đức Chúa Trời. Hai câu hỏi giữ nguyên sức căng và sự táo bạo trong lời khiếu nại của Môi-se.
