revisions:
- from: 'Bấy giờ, Môi-se trở lại với Yahweh và thưa: “Lạy Chúa, tại sao Ngài lại giáng họa trên dân này? Vì sao Ngài sai con đến đây?”'
  to: 'Bấy giờ, Môi-se trở lại với Yahweh và thưa: “Lạy Chúa, tại sao Ngài lại giáng họa trên dân này? Vậy tại sao Ngài lại sai con?”'
  rationale: Loại bỏ “đến đây” vì đó là ý bổ sung không có trong bản Hê-bơ-rơ. Thay bằng “Vậy tại sao” để diễn đạt tự nhiên sắc thái nhấn mạnh của לָמָּה זֶּה, đồng thời giữ nguyên nội dung và sức căng trong lời chất vấn của Môi-se. Chú thích neo tại câu hỏi thứ hai giải thích thành ngữ mà không áp đặt một diễn giải thần học.
  reviewer_model: gpt-5.6-terra
