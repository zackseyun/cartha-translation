id: EXO.5.1
reference: Exodus 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: vi
  text: 'Sau đó, Môi-se và A-rôn vào gặp Pha-ra-ôn và nói: “Yahweh[a], Đức Chúa Trời của Israel, phán thế này: ‘Hãy thả dân ta ra, để họ mừng lễ kính ta[b] trong hoang mạc.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là YHWH, danh riêng của Đức Chúa Trời; cũng thường được phiên âm là “Gia-vê.”
    reason: Giải thích danh riêng và cách phiên âm khác.
  - marker: b
    text: 'Cũng có thể dịch: “cử hành lễ hội cho ta.” Động từ Hê-bơ-rơ chỉ việc mừng hoặc giữ một kỳ lễ.'
    reason: Nêu sắc thái từ vựng và cách dịch thay thế.
lexical_decisions:
- source_word: וְאַחַר
  choice: Sau đó
  rationale: Dấu nối thời gian đưa câu chuyện sang sự việc kế tiếp mà không xác định khoảng cách thời gian.
- source_word: בָּאוּ
  choice: vào gặp
  rationale: Trong bối cảnh đến trước mặt vua, cách dịch này diễn đạt tự nhiên việc Môi-se và A-rôn vào yết kiến Pha-ra-ôn, nhưng không thêm nghi thức không có trong nguyên văn.
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: và nói
  rationale: Công thức kể chuyện thông dụng, nối trực tiếp với người nghe đã được nêu là Pha-ra-ôn.
- source_word: כֹּה אָמַר
  choice: phán thế này
  rationale: Giữ sắc thái trang trọng và thẩm quyền của công thức sứ giả, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu; chú thích nêu dạng phụ âm Hê-bơ-rơ.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Đức Chúa Trời của Israel
  rationale: Diễn đạt rõ cấu trúc sở thuộc và sự gắn bó của Yahweh với dân Israel.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Hãy thả dân ta ra
  rationale: Thể hiện đúng mệnh lệnh buộc Pha-ra-ôn cho dân Israel được rời đi.
- source_word: וְיָחֹגּוּ לִי
  choice: để họ mừng lễ kính ta
  rationale: Động từ חגג chỉ việc cử hành một lễ hội, thường mang sắc thái hành hương; “mừng lễ” tự nhiên hơn lối dịch sát chữ nhưng vẫn giữ nội dung nghi lễ.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, không nhất thiết là sa mạc cát; “hoang mạc” phù hợp bối cảnh và văn phong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Gia-vê
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng với tước hiệu và không áp đặt truyền thống thay thế danh bằng “Chúa”.
- issue: Ý nghĩa của việc dân ra đi
  choice: mừng lễ kính ta
  alternative: thờ phượng ta
  rationale: Không khái quát hóa thành “thờ phượng,” vì động từ חגג cụ thể nói đến việc cử hành lễ hội; bản dịch giữ sắc thái nghi lễ của yêu cầu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên người dùng các dạng quen thuộc trong tiếng Việt; “Yahweh” được giữ như danh riêng. Lời truyền đạt của Đức Chúa Trời được đặt trong dấu nháy đơn bên trong lời nói trực tiếp để cấu trúc phát ngôn rõ ràng.
