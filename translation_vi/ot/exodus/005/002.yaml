reference: Exodus 5:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: vi
  text: 'Pha-ra-ôn nói: “Yahweh[a] là ai mà ta phải vâng lời Yahweh và cho Israel ra đi? Ta không biết Yahweh; hơn nữa, ta sẽ không cho Israel ra đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”. Các dạng phiên âm khác gồm “Gia-vê” và “Giê-hô-va”.'
    reason: Giải thích việc chính văn chuyển tự danh riêng יהוה là “Yahweh”, đồng thời ghi nhận cách dịch thay thế theo truyền thống và các dạng phiên âm quen thuộc.
lexical_decisions:
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm danh hiệu hoàng gia Ai Cập đã quen thuộc và dễ hiểu trong tiếng Việt.
- source_word: מִי
  choice: là ai
  rationale: Câu hỏi trực tiếp về căn tính, đồng thời giữ giọng thách thức và khinh miệt của Pha-ra-ôn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu; chú thích nêu cách dịch truyền thống và các dạng phiên âm khác.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: mà ta phải nghe lời Ngài
  rationale: Động từ שׁמע đi với בְּקוֹל mang nghĩa nghe theo, vâng lời. “Nghe lời” tự nhiên trong tiếng Việt và vẫn gợi được thành ngữ Hê-bơ-rơ về việc nghe tiếng ai.
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: và cho Israel ra đi
  rationale: Trong ngữ cảnh Xuất Hành, שׁלח có nghĩa cho phép hoặc phóng thích Israel ra đi; “cho ... ra đi” là cách diễn đạt tự nhiên và nhất quán.
- source_word: לֹא יָדַעְתִּי
  choice: Ta không biết
  rationale: Diễn đạt lập trường hiện tại của Pha-ra-ôn, đồng thời không loại bỏ sắc thái không nhìn nhận hoặc không thừa nhận thẩm quyền.
- source_word: וְגַם
  choice: hơn nữa
  rationale: Giữ sức nhấn mạnh bổ sung, chuyển từ tuyên bố không biết Yahweh sang lời khước từ dứt khoát.
- source_word: לֹא אֲשַׁלֵּחַ
  choice: ta sẽ không cho ... ra đi
  rationale: Thể chưa hoàn thành trong lời đáp biểu thị quyết định cương quyết; “sẽ không” diễn đạt rõ sự khước từ.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Giữ dạng quốc tế quen dùng cho tên dân tộc trong nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Gia-vê; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng gồm bốn phụ âm יהוה. Bản dịch chính giữ dạng Yahweh để phân biệt tên riêng với tước hiệu, còn chú thích ghi nhận truyền thống thay bằng “CHÚA” và những dạng phiên âm khác.
- issue: Sắc thái của “không biết Yahweh”
  choice: Giữ cách nói “không biết”
  alternative: không thừa nhận Yahweh
  rationale: '“Không biết” bảo toàn độ rộng nghĩa của ידע trong lời Pha-ra-ôn: có thể chỉ việc không biết, nhưng trong ngữ cảnh cũng có thể hàm ý không nhìn nhận thẩm quyền. Không diễn giải hẹp ngay trong chính văn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “ta” thể hiện giọng của một quân vương đang thách thức; “Ngài” chỉ Yahweh với sắc thái kính trọng của lời kể, không làm giảm thái độ khinh miệt nằm trong nội dung câu nói.
