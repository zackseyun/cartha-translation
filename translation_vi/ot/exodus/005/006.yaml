    text: Cũng có thể dịch là “các quản đốc của ông”. Từ Hê-bơ-rơ chỉ các thuộc viên có chức trách trong hệ thống lao dịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Dạng động từ nối tiếp đưa câu chuyện tiến lên và diễn tả mệnh lệnh có thẩm quyền; “truyền lệnh” tự nhiên, trang trọng trong tiếng Việt.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm danh hiệu hoàng gia Ai Cập quen thuộc trong tiếng Việt.
- source_word: בַּיּוֹם הַהוּא
  choice: ngay trong ngày ấy
  rationale: Diễn đạt trực tiếp cụm thời gian, đồng thời thể hiện sắc thái tức thời có thể có trong ngữ cảnh mà không chuyển thành một thời điểm khác.
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: những người đốc công của dân
  rationale: נגשׂים trong bối cảnh lao dịch chỉ những người thúc ép và cưỡng bách lao động; “đốc công” là cách gọi tự nhiên cho vai trò ấy. Cụm “của dân” giữ quan hệ khái quát của בָּעָם, không xác định quá mức cơ cấu quyền lực.
- source_word: שֹׁטְרָיו
  choice: các viên chức của mình
  rationale: Từ này chỉ các thuộc viên có chức trách trong hệ thống lao dịch. “Viên chức” giữ được tính chất chính thức mà không thu hẹp vai trò thành thư ký hay quản đốc.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong tiếng Việt hiện đại, “rằng” nối tự nhiên động từ truyền lệnh với lời nói trực tiếp ở câu kế tiếp, tương đương công thức dẫn lời Hê-bơ-rơ.
