  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: vi
  text: 'Họ nói[a]: “Đức Chúa Trời của người Hê-bơ-rơ đã gặp chúng tôi. Xin cho chúng tôi đi ba ngày đường vào hoang mạc để dâng tế lễ cho Yahweh, Đức Chúa Trời của chúng tôi, kẻo Ngài đánh phạt chúng tôi bằng dịch bệnh hoặc gươm đao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã gọi chúng tôi.” Cụm từ Hê-bơ-rơ có thể diễn tả rằng Đức Chúa Trời đã gặp họ hoặc đã triệu gọi họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Đức Chúa Trời của người Hê-bơ-rơ
  rationale: Giữ nguyên danh xưng dân tộc trong nguyên văn, thay vì đồng nhất hóa với “người Y-sơ-ra-ên”; cách diễn đạt này tự nhiên và phù hợp với ngữ cảnh.
- source_word: נִקְרָא עָלֵינוּ
  choice: đã gặp chúng tôi
  rationale: Thể Niphal của קרא đi với עַל tại đây có thể chỉ việc Đức Chúa Trời hiện đến/gặp họ; ghi chú bảo lưu khả năng hiểu là “đã gọi chúng tôi”.
- source_word: נֵלֲכָה נָּא
  choice: Xin cho chúng tôi đi
  rationale: Diễn đạt lực cầu khiến của cohortative cùng sắc thái khẩn khoản, lịch sự của נָא bằng tiếng Việt tự nhiên.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: một chặng đường ba ngày
  rationale: Phản ánh thành ngữ Hê-bơ-rơ chỉ quãng đường hoặc thời gian hành trình mà không xác định quá mức.
- source_word: בַּמִּדְבָּר
  choice: vào hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, không nhất thiết là sa mạc cát; “hoang mạc” trang trọng, dễ hiểu và phù hợp ngữ cảnh.
- source_word: וְנִזְבְּחָה
  choice: để dâng sinh tế
  rationale: Cohortative thứ hai trong chuỗi lời xin nêu mục đích của chuyến đi; “để” truyền đạt quan hệ mục đích tự nhiên trong tiếng Việt.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng “Yahweh”, thay vì thay bằng một tước hiệu; “dâng ... lên” là kết hợp từ tự nhiên trong tiếng Việt.
- source_word: פֶּן
  choice: nếu không
  rationale: Truyền đạt sắc thái cảnh báo của פֶּן bằng lối nói hiện đại, rõ nghĩa hơn cấu trúc cổ “e rằng” trong câu này.
- source_word: יִפְגָּעֵנוּ
  choice: Ngài có thể giáng ... trên chúng tôi
  rationale: פגע trong ngữ cảnh này nói đến sự can thiệp gây hại hoặc hình phạt; cấu trúc này nối tự nhiên với hai phương tiện phán xét được nêu sau đó mà không làm mất sắc thái cảnh báo.
- source_word: בַּדֶּבֶר אֹו בֶחָרֶב
  choice: dịch bệnh hoặc gươm đao
  rationale: “Dịch bệnh” diễn đạt דֶּבֶר bằng tiếng Việt hiện đại; “gươm đao” bảo tồn hình ảnh חֶרֶב như cách nói hoán dụ về chết chóc do chiến tranh.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự danh. Phiên âm “Yahweh” giữ đây là danh riêng giao ước, không biến nó thành tước hiệu.
- issue: Chủ thể của hình phạt trong יִפְגָּעֵנוּ
  choice: Ngài
  alternative: không nêu rõ đại từ trong bản dịch
  rationale: Động từ Hê-bơ-rơ ở ngôi thứ ba số ít, quy chiếu tự nhiên về Yahweh, Đức Chúa Trời của họ. Viết hoa đại từ là quy ước tiếng Việt tôn kính, không bổ sung một chủ thể mới.
- issue: Mức độ chắc chắn của lời cảnh báo
  choice: có thể giáng
  alternative: sẽ giáng
  rationale: פֶּן trình bày hậu quả đáng lo ngại cần tránh, không nhất thiết khẳng định chắc chắn hậu quả ấy sẽ xảy ra; “có thể” giữ được sắc thái này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “người Hê-bơ-rơ” để giữ danh xưng của nguyên văn; “sinh tế” duy trì sắc thái nghi lễ; danh riêng “Yahweh” được giữ nguyên. Dấu [a] đặt ngay sau động từ dẫn lời để liên kết với cách hiểu khác của נִקְרָא עָלֵינוּ.
