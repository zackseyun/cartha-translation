  terminology: “Quản công” và “đốc công” phân biệt hữu ích hai cấp giám sát trong ngữ cảnh này. “Số gạch được quy định” diễn đạt chính xác định mức bắt buộc; “Y-sơ-ra-ên” và “Pha-ra-ôn” nhất quán với lối phiên âm Kinh Thánh quen dùng.
