  - severity: low
    issue: Ký hiệu chú thích nên gắn ngay sau cụm từ được chú thích.
    rationale: Chú thích giải thích riêng thành ngữ “như trước kia”; đặt [a] ngay sau cụm này làm neo chú thích rõ ràng hơn.
