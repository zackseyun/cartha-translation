  text: וַ/יֻּכּ֗וּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר שָׂ֣מוּ עֲלֵ/הֶ֔ם נֹגְשֵׂ֥י פַרְעֹ֖ה לֵ/אמֹ֑ר מַדּ֡וּעַ לֹא֩ כִלִּיתֶ֨ם חָקְ/כֶ֤ם לִ/לְבֹּן֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם גַּם תְּמ֖וֹל גַּם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: vi
  text: 'Các quản công người Y-sơ-ra-ên, là những người đã được các đốc công của Pha-ra-ôn đặt lên cai quản họ, bị đánh và bị chất vấn: “Tại sao hôm qua và hôm nay các ngươi không làm đủ số gạch được quy định như trước kia?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ được dịch là “như trước kia” có nghĩa đen gần như “như hôm qua, hôm trước”, là một thành ngữ mang nghĩa “như trước đây”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: bị đánh
  rationale: Dạng bị động số nhiều của נכה, diễn tả hình phạt thể xác nhưng không xác định dụng cụ hay cách đánh.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: các quản công người Y-sơ-ra-ên
  rationale: Trong bối cảnh lao dịch, שֹׁטְרִים là những người Y-sơ-ra-ên giữ vai trò quản lý cấp dưới đối với dân mình; “quản công” tự nhiên và phân biệt được với các đốc công của Pha-ra-ôn.
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: là những người đã được các đốc công của Pha-ra-ôn đặt lên cai quản dân mình
  rationale: Giữ quan hệ giữa các đốc công Ai Cập và quản công Y-sơ-ra-ên; “dân mình” làm rõ đại từ עֲלֵהֶם theo ngữ cảnh mà không đổi đối tượng.
- source_word: לֵאמֹר
  choice: và bị chất vấn
  rationale: Trong cấu trúc bị đánh rồi dẫn lời quở trách, cách dịch này truyền đạt tự nhiên chức năng dẫn ngôn và cho thấy lời nói đến từ những người đánh, dù tiếng Hê-bơ-rơ dùng động từ nguyên mẫu “nói rằng”.
- source_word: מַדּוּעַ
  choice: Tại sao
  rationale: Tương đương trực tiếp, tự nhiên với từ nghi vấn chỉ nguyên nhân.
- source_word: לֹא כִלִּיתֶם חָקְכֶם לִלְבֹּן
  choice: không làm đủ số gạch được quy định
  rationale: כלה với חֹק trong bối cảnh này là hoàn thành định lượng bắt buộc; לִלְבֹּן chỉ việc làm gạch. Cách diễn đạt tiếng Việt này vừa rõ nghĩa vừa tự nhiên.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: như trước kia
  rationale: Đây là thành ngữ chỉ thời gian trước đó hoặc lệ thường trước đây, không đơn thuần liệt kê hai ngày cụ thể.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: hôm qua và hôm nay
  rationale: Giữ cặp từ nhấn mạnh גַּם...גַּם, nêu rõ cả hai ngày đều thiếu định mức.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Y-sơ-ra-ên” và “Pha-ra-ôn” theo lối phiên âm Kinh Thánh quen thuộc; phân biệt “quản công” người Y-sơ-ra-ên với “đốc công” của Pha-ra-ôn.
