  source_fidelity: 'Bản dịch truyền đạt đúng bối cảnh lao dịch: các quản công Y-sơ-ra-ên bị đánh vì không hoàn thành định mức làm gạch. Tuy nhiên, “dân mình” diễn giải thêm sắc thái sở hữu/đồng nhất mà tiếng Hê-bơ-rơ chỉ nói “đặt trên họ”; nên giữ đại từ trung tính “họ”.'
