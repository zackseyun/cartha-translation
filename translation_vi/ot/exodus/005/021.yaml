  text: וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם יֵ֧רֶא יְהוָ֛ה עֲלֵי/כֶ֖ם וְ/יִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת רֵיחֵ֗/נוּ בְּ/עֵינֵ֤י פַרְעֹה֙ וּ/בְ/עֵינֵ֣י עֲבָדָ֔י/ו לָֽ/תֶת חֶ֥רֶב בְּ/יָדָ֖/ם לְ/הָרְגֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: vi
  text: 'Họ nói với hai ông: “Nguyện Yahweh nhìn đến các ông và xét xử các ông, vì các ông đã làm cho chúng tôi bốc mùi[a] trước mặt Pha-ra-ôn và các thuộc hạ của người, để trao gươm vào tay họ giết chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “đã làm cho mùi của chúng tôi hôi thối”; đây là cách nói hàm ý khiến chúng tôi trở nên đáng ghét hoặc ghê tởm.'
    reason: Giải thích hình ảnh Hê-bơ-rơ và nghĩa hàm ý, trong khi chính văn giữ cách diễn đạt giàu hình ảnh.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: Họ nói với hai ông
  rationale: Động từ tiếp nối mạch kể chuyện ở quá khứ. Đại từ số nhiều אֲלֵהֶם chỉ Môi-se và A-rôn; “hai ông” diễn đạt tự nhiên trong tiếng Việt mà không đưa tên riêng vào chỗ nguyên văn chỉ dùng đại từ.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם
  choice: Nguyện Yahweh nhìn đến các ông
  rationale: Thể vị hoàn thành mang sắc thái cầu khiến trong lời kêu xin mang tính cáo buộc. “Nguyện” thể hiện đúng sắc thái ấy; “nhìn đến” diễn đạt việc Đức Chúa Trời lưu ý và xem xét, không làm phẳng thành một lời dự báo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: וְיִשְׁפֹּט
  choice: và xét xử
  rationale: Đây là động từ cầu khiến thứ hai, phối hợp với “nguyện… nhìn đến”. “Xét xử” giữ được nghĩa rộng của lời kêu cầu Yahweh phán quyết vụ việc.
- source_word: אֲשֶׁר
  choice: vì
  rationale: Trong ngữ cảnh, từ này dẫn vào lý do của lời cáo buộc và lời cầu xin phán xét.
- source_word: הִבְאַשְׁתֶּם אֶת רֵיחֵנוּ
  choice: các ông đã làm cho chúng tôi trở nên hôi thối
  rationale: Nguyên văn có hình ảnh cụ thể “làm cho mùi của chúng tôi hôi thối”. Cách dịch này giữ hình ảnh mạnh và vẫn dễ hiểu trong tiếng Việt; chú thích nêu nghĩa đen và nghĩa hàm ý.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: trước mặt Pha-ra-ôn và các bề tôi của ông ta
  rationale: “Trước mặt” là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ Hê-bơ-rơ “trong mắt”, chỉ cách Pha-ra-ôn và bề tôi nhìn nhận dân chúng. “Bề tôi” phù hợp bối cảnh triều đình mà không thu hẹp họ thành một chức vụ cụ thể.
- source_word: לָתֵת חֶרֶב בְּיָדָם
  choice: trao gươm vào tay họ
  rationale: Giữ hình ảnh thanh gươm số ít mang nghĩa tập hợp và ý trao cho đối phương phương tiện hoặc cơ hội gây chết chóc.
- source_word: לְהָרְגֵנוּ
  choice: để giết chúng tôi
  rationale: Diễn đạt trực tiếp mục đích hoặc kết quả của việc trao gươm, bằng từ ngữ hiện đại và rõ ràng.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” giữ đây là danh riêng và tránh thay bằng tước hiệu.
- issue: Sắc thái của יֵרֶא… וְיִשְׁפֹּט
  choice: 'Lời cầu khiến: “Nguyện Yahweh… và xét xử”'
  alternative: 'Lời khẳng định tương lai: “Yahweh sẽ… và sẽ xét xử”'
  rationale: Hai động từ vị hoàn thành trong lời trách móc này hợp lý nhất khi được hiểu là lời khẩn cầu Yahweh lưu ý và phán xét; bản dịch không xác định trước nội dung phán quyết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh mạnh “hôi thối” của nguyên văn, dùng “trước mặt” thay cho lối dịch máy móc “trong mắt”, và dùng “hai ông” để đại từ chỉ Môi-se cùng A-rôn rõ ràng, tự nhiên trong tiếng Việt.
