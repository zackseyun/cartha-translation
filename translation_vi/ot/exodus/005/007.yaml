  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: vi
  text: “Các ngươi không được cấp rơm cho dân để làm gạch như trước nữa.[a] Họ phải tự đi kiếm rơm cho mình.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “như hôm qua và hôm kia,” một thành ngữ có nghĩa là “như trước” hoặc “trước đây.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאסִפוּן לָתֵת
  choice: không được tiếp tục cấp ... nữa
  rationale: Cấu trúc phủ định với dạng Hifil của יסף diễn tả việc chấm dứt một thông lệ đang có. “Không được tiếp tục ... nữa” vừa thể hiện mệnh lệnh vừa giữ rõ ý ngừng cung cấp.
- source_word: תֶּבֶן
  choice: rơm
  rationale: Đây là vật liệu thực vật dùng trong việc làm gạch; “rơm” là cách gọi tự nhiên và quen thuộc trong tiếng Việt.
- source_word: לָעָם
  choice: cho dân
  rationale: עַם nghĩa trực tiếp là “dân”; ngữ cảnh cho thấy đó là dân Y-sơ-ra-ên đang lao dịch, nhưng bản dịch không thu hẹp thành “những người lao động”.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: để làm gạch
  rationale: Động từ nguyên mẫu cùng tân ngữ diễn tả mục đích. “Để làm gạch” tự nhiên và sát chức năng cú pháp của cụm từ.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: như trước
  rationale: Thành ngữ chỉ thời gian trước đây; cách dịch “như trước” truyền đạt nghĩa thông dụng, còn nghĩa đen được giữ trong chú thích.
- source_word: הֵם יֵלְכוּ
  choice: Hãy để họ tự đi
  rationale: Đại từ độc lập cùng động từ chưa hoàn thành mang lực mệnh lệnh trong ngữ cảnh. “Hãy để họ ... đi” giữ sắc thái chỉ thị đối với những người chịu trách nhiệm cấp rơm.
- source_word: וְקֹשְׁשׁוּ
  choice: kiếm
  rationale: קשש chỉ việc gom nhặt hay thu lượm vật liệu. Trong câu này, “đi kiếm rơm” là cách nói tự nhiên, bao hàm việc tự tìm và thu gom.
- source_word: לָהֶם
  choice: cho mình
  rationale: Đại từ chỉ đối tượng hưởng lợi cho biết họ phải tự lo số rơm cần dùng, thay vì được người khác cấp.
