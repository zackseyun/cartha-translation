  register: Văn phong mệnh lệnh, rõ ràng và trang trọng vừa phải. “Các ngươi” phù hợp lời Pha-ra-ôn truyền lệnh cho các đốc công trong mạch văn; “cấp rơm” diễn đạt tự nhiên hành động cung ứng vật liệu. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
