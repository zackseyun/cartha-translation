base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: vi
  text: 'Rơm không được cấp cho bầy tôi của bệ hạ, thế mà người ta bảo chúng tôi: ‘Hãy làm gạch!’ Kìa, bầy tôi của bệ hạ đang bị đánh, nhưng lỗi lại thuộc về dân của bệ hạ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hình thức hơn: “và dân của bệ hạ đã phạm tội.” Mệnh đề Hê-bơ-rơ rất cô đọng; trong ngữ cảnh, có lẽ ý nói phía dân của Pha-ra-ôn là bên có lỗi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: rơm
  rationale: Chỉ vật liệu thực vật được dùng trong việc làm gạch; “rơm” là từ tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: אֵין נִתָּן
  choice: không được cấp
  rationale: Cấu trúc phủ định với phân từ bị động diễn tả việc rơm không được cung cấp; “không được cấp” vừa gọn vừa phù hợp bối cảnh lao dịch.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: các đầy tớ của bệ hạ
  rationale: עבד có thể chỉ nô lệ hoặc người phục dịch, nhưng trong lời thưa với Pha-ra-ôn đây cũng là cách tự xưng khiêm nhường. “Đầy tớ” giữ được cả sự lệ thuộc lẫn sắc thái cung kính; “bệ hạ” thể hiện đối tượng được tâu trình.
- source_word: לְבֵנִים
  choice: gạch
  rationale: Danh từ số nhiều chỉ những viên gạch phải sản xuất; tiếng Việt thường dùng danh từ khối “gạch” tự nhiên hơn “những viên gạch” trong mệnh lệnh này.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: 'người ta vẫn bảo chúng tôi: ‘Hãy làm gạch!’'
  rationale: Giữ lời nói trực tiếp và mệnh lệnh; bổ sung “gạch” từ danh từ đứng ngay trước theo cách hiểu tự nhiên của câu Hê-bơ-rơ. Chủ thể không xác định của אֹמְרִים được diễn đạt bằng “người ta”.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ lực nhấn mạnh và kêu gọi người nghe chú ý của הִנֵּה, đồng thời mang giọng trang trọng, tự nhiên trong tiếng Việt.
- source_word: מֻכִּים
  choice: đang bị đánh
  rationale: Phân từ bị động trong ngữ cảnh mô tả sự ngược đãi đang tiếp diễn.
- source_word: וְחָטָאת עַמֶּךָ
  choice: nhưng lỗi lại thuộc về dân của bệ hạ
  rationale: 'Mệnh đề Hê-bơ-rơ cô đọng và khó xác định chính xác. Cách dịch này thể hiện lực lập luận theo ngữ cảnh: người có lỗi là phía dân của Pha-ra-ôn, không phải các lao công, nhưng chú thích vẫn bảo lưu cách hiểu sát hình thức hơn.'
theological_decisions:
- issue: Chủ thể và ý nghĩa của וְחָטָאת עַמֶּךָ
  choice: nhưng lỗi lại thuộc về dân của bệ hạ
  alternative: và dân của bệ hạ đã phạm tội
  rationale: Ngữ cảnh cho thấy các đốc công đang quy trách nhiệm cho phía Ai Cập vì đòi đủ chỉ tiêu mà không cấp rơm. Tuy nhiên, do cú pháp cô đọng và dạng từ có thể được hiểu theo lối sát chữ là “dân của ngài đã phạm tội”, phương án ấy được nêu trong chú thích thay vì xóa bỏ tính mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bệ hạ” trong lời thưa trực tiếp với Pha-ra-ôn và “đầy tớ” để giữ lối tự xưng cung kính, không loại bỏ thực trạng lệ thuộc. “Kìa” bảo tồn sắc thái nhấn mạnh của הִנֵּה.
