base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/013.yaml
  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: vi
  text: 'Các đốc công cứ thúc ép họ, nói: “Hãy hoàn tất công việc của các ngươi, phần việc của mỗi ngày, ngay trong ngày ấy,[a] như khi có rơm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “định mức mỗi ngày.” Thành ngữ Hê-bơ-rơ nói sát chữ là “việc của một ngày trong ngày ấy,” chỉ phần việc phải hoàn thành trong từng ngày.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: các đốc công
  rationale: Trong bối cảnh lao dịch cưỡng bức tại Ai Cập, từ này chỉ những người ép dân làm việc và đòi đủ định mức. “Đốc công” là cách gọi tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אָצִים
  choice: cứ thúc ép
  rationale: Phân từ diễn tả hành động liên tục và có tính cưỡng bức; “cứ thúc ép” giữ được cả sắc thái kéo dài lẫn áp lực mạnh.
- source_word: כַּלּוּ
  choice: Hãy hoàn tất
  rationale: Mệnh lệnh này đòi họ làm xong phần lao dịch được giao. “Hoàn tất” trang trọng, tự nhiên và sát nghĩa.
- source_word: מַעֲשֵׂיכֶם
  choice: công việc của các ngươi
  rationale: Cụm từ chỉ công việc làm gạch bị bắt buộc trong văn cảnh. “Công việc” giữ phạm vi nghĩa rộng của từ Hê-bơ-rơ.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: phần việc ngày nào ngay trong ngày ấy
  rationale: Thành ngữ Hê-bơ-rơ nói sát chữ về “việc của một ngày trong ngày ấy” và trong văn cảnh hàm ý lượng việc phải hoàn thành mỗi ngày. Cách dịch này giữ cấu trúc theo ngày mà không đưa “định mức” vào chính văn.
- source_word: כַּאֲשֶׁר
  choice: y như
  rationale: Từ này dẫn vào sự so sánh với hoàn cảnh trước kia; “y như” nhấn mạnh rằng yêu cầu vẫn không thay đổi.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: khi còn có rơm
  rationale: Cấu trúc nguyên mẫu chỉ hoàn cảnh trước đây khi có rơm. “Còn có” diễn đạt tự nhiên sự tương phản với tình trạng hiện tại mà không nói rõ hơn nguyên văn rằng rơm được cấp.
