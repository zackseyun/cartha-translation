revisions:
- from: Vì thế, dân chúng tản ra khắp đất Ai Cập để nhặt gốc rạ dùng thay rơm.[a]
  to: Vì thế, dân chúng tản ra trên khắp xứ Ai Cập để nhặt rạ thay cho rơm.[a]
  rationale: Đổi “gốc rạ” thành “rạ” để tránh thêm nghĩa “phần gốc còn bám đất” và để cụm “nhặt rạ” tự nhiên hơn. Điều chỉnh chú thích để mô tả phương án từ vựng như một khả năng, thay vì khẳng định đó là bản dịch sát hơn. Các yếu tố nghĩa còn lại được giữ nguyên.
