  text: So the people were scattered throughout all the land of Egypt to gather stubble for straw[a].
translation:
  language: vi
  text: Vì thế, dân chúng tản ra trên khắp xứ Ai Cập để nhặt rạ thay cho rơm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “để nhặt rạ làm rơm.” Hai từ Hê-bơ-rơ קַשׁ và תֶּבֶן đôi khi có trường nghĩa chồng lấn; bản văn chính giữ sự phân biệt có khả năng nhất giữa rạ được nhặt và nguồn rơm thường dùng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: tản ra
  rationale: Động từ פוץ trong mạch tường thuật diễn tả dân chúng bị tình thế ép phải phân tán trên một vùng rộng. Tiếng Việt tự nhiên dùng “tản ra”; ngữ cảnh đã làm rõ đây không phải hành động hoàn toàn tự nguyện.
- source_word: הָעָם
  choice: dân chúng
  rationale: עַם chỉ tập thể dân, ở đây là lực lượng lao động Y-sơ-ra-ên. “Dân chúng” tự nhiên và không thêm định danh ngoài câu Hê-bơ-rơ.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: khắp đất Ai Cập
  rationale: Cách dịch này giữ sức phân bố của בְּכָל và diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: לְקֹשֵׁשׁ
  choice: để nhặt
  rationale: קשש nói đến việc thu nhặt những mảnh nhỏ hoặc vật liệu nằm rải rác; “nhặt” phù hợp với gốc rạ hơn “thu gom”.
- source_word: קַשׁ
  choice: gốc rạ
  rationale: קַשׁ chỉ phần thân cây khô hoặc rạ còn sót. Vì תֶּבֶן cũng xuất hiện trong cùng mệnh đề, “gốc rạ” giúp bảo toàn sự phân biệt từ vựng và cho thấy đây là vật liệu thay thế.
- source_word: לַתֶּבֶן
  choice: dùng thay rơm
  rationale: ל có thể diễn tả mục đích hoặc sự thay thế. Trong bối cảnh Pha-ra-ôn không còn cấp rơm làm gạch, “dùng thay rơm” truyền đạt rõ chức năng của vật được nhặt mà vẫn giữ quan hệ ngắn gọn của nguyên văn.
