revisions:
- from: 'Hãy bắt họ phải nộp đủ số gạch như họ đã làm hôm qua và hôm kia[a]; không được giảm bớt chút nào, vì chúng lười biếng. Bởi vậy, chúng kêu la rằng: ‘Hãy để chúng tôi đi dâng tế lễ cho Đức Chúa Trời của chúng tôi.’'
  to: 'Các ngươi phải bắt họ làm đủ số gạch như họ đã làm hôm qua và hôm kia[a]; không được giảm bớt chút nào, vì họ nhàn rỗi. Vì vậy họ kêu la rằng: ‘Chúng ta hãy đi và dâng tế lễ cho Đức Chúa Trời của chúng ta.’'
  rationale: Sửa “nộp” thành “làm” để giữ đúng động từ chỉ việc sản xuất gạch, và sửa lời trích dẫn thành hai lời khích lệ số nhiều tương ứng với tiếng Hê-bơ-rơ. Các chi tiết khác, kể cả cách dịch cụm thời gian theo nghĩa đen và chú thích về nghĩa thành ngữ, được giữ nguyên.
