  text: וְ/אֶת מַתְכֹּ֨נֶת הַ/לְּבֵנִ֜ים אֲשֶׁ֣ר הֵם֩ עֹשִׂ֨ים תְּמ֤וֹל שִׁלְשֹׁם֙ תָּשִׂ֣ימוּ עֲלֵי/הֶ֔ם לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ כִּֽי נִרְפִּ֣ים הֵ֔ם עַל כֵּ֗ן הֵ֤ם צֹֽעֲקִים֙ לֵ/אמֹ֔ר נֵלְכָ֖ה נִזְבְּחָ֥ה לֵ/אלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: vi
  text: 'Các ngươi phải bắt họ làm đủ số gạch như họ đã làm hôm qua và hôm kia[a]; không được giảm bớt chút nào, vì họ nhàn rỗi. Vì vậy họ kêu la rằng: ‘Chúng ta hãy đi và dâng tế lễ cho Đức Chúa Trời của chúng ta.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch theo nghĩa thành ngữ là “trước đây” hoặc “như trước”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת הַלְּבֵנִים
  choice: đủ số gạch
  rationale: Trong bối cảnh lao dịch, cụm từ chỉ số lượng gạch được ấn định phải sản xuất. Cách nói này tự nhiên trong tiếng Việt và nối rõ với lệnh không được giảm bớt.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: hôm qua và hôm kia
  rationale: Giữ hình ảnh thời gian cụ thể của thành ngữ Hê-bơ-rơ; chú thích nêu nghĩa rộng hơn là trước đây hoặc như trước.
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: Hãy bắt họ phải nộp
  rationale: Diễn đạt sức ép hành chính của việc đặt chỉ tiêu lên người lao động, đồng thời phù hợp với đối tượng trực tiếp là số gạch.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: không được giảm bớt chút nào
  rationale: Thể hiện lệnh cấm giảm bất cứ phần nào của số lượng đã định.
- source_word: נִרְפִּים
  choice: lười biếng
  rationale: Trong lời buộc tội của Pha-ra-ôn, từ này mô tả dân là nhàn rỗi hoặc chểnh mảng; “lười biếng” là cách nói rõ và tự nhiên, nhưng vẫn được hiểu là lời cáo buộc của nhân vật.
- source_word: צֹעֲקִים
  choice: kêu la
  rationale: Truyền đạt hành động kêu lớn, mang sắc thái than van hoặc đòi hỏi trong lời quy kết của Pha-ra-ôn.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Hãy để chúng tôi đi dâng tế lễ
  rationale: Hai thức khích lệ ngôi thứ nhất số nhiều được chuyển thành lời yêu cầu tự nhiên trong tiếng Việt, phù hợp với ngữ cảnh dân xin được đi.
- source_word: לֵאלֹהֵינוּ
  choice: cho Đức Chúa Trời của chúng tôi
  rationale: Diễn đạt trực tiếp Đấng nhận tế lễ; “Đức Chúa Trời” là cách gọi trang trọng, phổ thông trong bản dịch Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Duy trì giọng khinh miệt của Pha-ra-ôn qua đại từ “chúng” khi ông nói về dân Y-sơ-ra-ên, nhưng dùng “họ” trong lời truyền cho các đốc công để câu tiếng Việt tự nhiên. Dấu chấm phẩy giữ quan hệ chặt giữa chỉ tiêu và lệnh không được giảm.
