review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng ý chính: chỉ tiêu gạch không được giảm, lời kết án họ là nhàn rỗi, và lời dân muốn đi dâng tế lễ. Tuy nhiên, “nộp đủ số gạch” chuyển hành động sản xuất (עֹשִׂים) thành giao nộp; còn “Hãy để chúng tôi đi” làm hai thể khích lệ ngôi thứ nhất số nhiều (נֵלְכָה נִזְבְּחָה) thành một lời xin phép gián tiếp.'
  naturalness: Câu sửa dùng “bắt họ làm đủ số gạch” để diễn đạt tự nhiên mệnh lệnh áp chỉ tiêu trong tiếng Việt hiện đại. “Chúng ta hãy đi và dâng tế lễ” phản ánh trực tiếp lời hô gọi trong diễn ngôn được trích dẫn.
  terminology: '“Số gạch,” “dâng tế lễ,” và “Đức Chúa Trời” đều phù hợp ngữ cảnh và văn phong Kinh Thánh. Dùng “họ” nhất quán: sắc thái coi thường của Pha-ra-ôn được thể hiện đầy đủ qua lời quy kết “nhàn rỗi,” không cần thêm sắc thái khinh miệt vốn không được đánh dấu bằng đại từ trong tiếng Hê-bơ-rơ.'
  issues:
  - severity: medium
    issue: “nộp đủ số gạch”
    rationale: עֹשִׂים nói họ đang làm/sản xuất gạch. “Nộp” có thể gợi việc giao nộp một sản phẩm, thay vì yêu cầu phải sản xuất đúng chỉ tiêu.
  - severity: medium
    issue: “Hãy để chúng tôi đi dâng tế lễ”
    rationale: 'Nֵלְכָה נִזְבְּחָה là hai cohortative: “chúng ta hãy đi; chúng ta hãy dâng tế lễ.” Cách dịch hiện tại biến câu thành lời cầu xin cho phép và không biểu hiện rõ động từ thứ hai.'
  - severity: low
    issue: Đại từ “chúng” trong lời tường thuật của Pha-ra-ôn
    rationale: Bản gốc không đánh dấu khinh miệt bằng đại từ. “Họ” giữ giọng kể trung tính, trong khi tính chất cáo buộc vẫn nằm ở từ “nhàn rỗi.”
