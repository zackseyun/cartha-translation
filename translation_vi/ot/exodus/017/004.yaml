base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: vi
  text: 'Mô-se liền kêu lên với Yahweh rằng: “Con phải làm gì với dân này? Chỉ một chút nữa thôi là họ sẽ ném đá con!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: liền kêu lên
  rationale: Động từ צעק diễn tả tiếng kêu khẩn thiết trong cảnh nguy cấp, mạnh hơn cách nói trung tính như “thưa” hay “nói”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm יהוה, thay vì thay bằng một tước hiệu.
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  choice: Con phải làm gì với dân này?
  rationale: Cách nói này giữ sắc thái tự hỏi khẩn cấp của Mô-se; “với dân này” chuyển tự nhiên quan hệ rộng của giới từ ל mà không ấn định quá mức là làm “cho” hay làm “đối với” họ.
- source_word: עֹוד מְעַט
  choice: Chỉ còn một chút nữa thôi
  rationale: Cụm từ theo sát nghĩa là “còn một chút,” ở đây diễn tả mối đe dọa đã cận kề.
- source_word: וּסְקָלֻנִי
  choice: họ sẽ ném đá con mất
  rationale: Động từ סקל chỉ hành động dùng đá tấn công hoặc giết người. Từ “mất” truyền đạt tự nhiên trong tiếng Việt tính chất sắp xảy ra của hậu quả sau עֹוד מְעַט.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” bảo tồn tư cách tên riêng và không thay nó bằng một tước hiệu.
- issue: Đại từ của Mô-se khi thưa với Yahweh
  choice: con
  alternative: tôi
  rationale: Tiếng Hê-bơ-rơ chỉ đánh dấu ngôi thứ nhất, không quy định đại từ xưng hô theo hệ thống tiếng Việt. “Con” là cách xưng tự nhiên, cung kính khi một người thưa với Đức Chúa Trời, nhưng không nhằm xác lập một giáo lý riêng về địa vị của Mô-se.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Liền” giữ nhịp phản ứng tức thời; “ném đá con mất” diễn đạt tự nhiên sự hoảng cấp mà không làm nhẹ nguy cơ bạo lực. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
