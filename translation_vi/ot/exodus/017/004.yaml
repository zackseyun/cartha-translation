- from: 'Mô-se liền kêu lên với Yahweh: “Con phải làm gì với dân này? Chỉ còn một chút nữa thôi[a], họ sẽ ném đá con mất!”'
  to: 'Mô-se liền kêu lên với Yahweh rằng: “Con phải làm gì với dân này? Chỉ một chút nữa thôi là họ sẽ ném đá con!”'
