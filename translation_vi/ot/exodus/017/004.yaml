  terminology: “Mô-se,” “Yahweh,” và “ném đá” đều thích hợp. Đại từ “con” là một lựa chọn kính cẩn tự nhiên trong lời Mô-se thưa với Yahweh và không làm thay đổi nghĩa nguyên ngữ.
