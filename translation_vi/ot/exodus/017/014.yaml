  terminology: Giữ Yahweh theo quyết định dự án; Môi-se, Giô-suê và A-ma-léc nhất quán theo dạng tên riêng Việt hóa. “Kỷ niệm” cho זִכָּרוֹן và “sự tưởng nhớ” cho זֵכֶר duy trì được thế đối ứng có chủ ý trong câu mà không đồng nhất hai từ.
