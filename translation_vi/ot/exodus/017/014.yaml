source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se: “Hãy ghi điều này vào sách để làm kỷ niệm[a], và nói cho Giô-suê nghe[b], vì Ta nhất định sẽ xóa sạch sự tưởng nhớ về A-ma-léc khỏi dưới bầu trời[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có “vào cuốn sách”; cũng có thể hiểu là “vào một cuốn sách” hoặc “vào cuộn sách.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “đặt vào tai Giô-suê,” nghĩa là làm cho Giô-suê nghe hoặc thuật lại cho ông nghe.'
    reason: lexical_alternative
  - marker: c
    text: Cụm “nhất định sẽ xóa sạch” trong tiếng Hê-bơ-rơ có hình thức nhấn mạnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước của Đức Chúa Trời bằng dạng chuyển tự thông dụng, thay vì thay thế bằng một tước hiệu.
- source_word: כְּתֹב זֹאת זִכָּרוֹן בַּסֵּפֶר
  choice: Hãy chép điều này vào sách để làm kỷ niệm
  rationale: Diễn đạt rõ mệnh lệnh viết và mục đích lưu niệm của זִכָּרוֹן; “chép” tự nhiên trong văn cảnh ghi lại một sự việc.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: và nói cho Giô-suê nghe
  rationale: Thành ngữ theo nghĩa đen là “đặt vào tai Giô-suê”; bản dịch chính truyền đạt ý khiến Giô-suê nghe mà không dùng cách nói gượng trong tiếng Việt.
- source_word: מָחֹה אֶמְחֶה
  choice: Ta nhất định sẽ xóa sạch
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn và mạnh mẽ của hành động; “nhất định” thể hiện sắc thái ấy tự nhiên.
- source_word: זֵכֶר עֲמָלֵק
  choice: ký ức về A-ma-léc
  rationale: Giữ nghĩa căn bản là sự tưởng nhớ hay ký ức về A-ma-léc, đồng thời duy trì sự tương phản với việc ghi lại sự kiện làm kỷ niệm.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: khỏi dưới trời
  rationale: Bảo lưu hình ảnh và phạm vi bao quát của thành ngữ Hê-bơ-rơ mà vẫn dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh Đức Chúa Trời
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự YHWH; giữ danh riêng tránh biến danh ấy thành một tước hiệu và không áp đặt truyền thống giáo phái.
- issue: Phạm vi của lời xóa bỏ A-ma-léc
  choice: xóa sạch ký ức về A-ma-léc
  alternative: xóa sạch tên tuổi A-ma-léc
  rationale: זֵכֶר có thể liên quan đến ký ức, sự tưởng nhớ hoặc danh tiếng; chọn “ký ức” gần nghĩa từ vựng nhất và tránh xác định quá mức cách lời phán sẽ được thực hiện.
translation_notes:
  register: 'Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Tên riêng được dùng theo dạng quen thuộc trong tiếng Việt (Môi-se, Giô-suê, A-ma-léc), còn YHWH được chuyển tự là Yahweh. Bản dịch ưu tiên tương đương tối ưu: giữ hình ảnh “dưới trời” và ghi chú thành ngữ “đặt vào tai,” đồng thời diễn đạt câu lệnh tự nhiên.'
