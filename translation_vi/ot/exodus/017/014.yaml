  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính: mệnh lệnh viết, mục đích tưởng niệm, việc làm cho Giô-suê nghe, lời nhấn mạnh về việc xóa bỏ, và phạm vi phổ quát. Tuy nhiên, “khỏi dưới trời” không tự nhiên trong tiếng Việt hiện đại; thêm “bầu” giữ hình ảnh nguyên ngữ mà rõ nghĩa hơn. “Sự tưởng nhớ” cũng sát với זֵכֶר hơn “ký ức” trong văn cảnh đối ứng với זִכָּרוֹן.'
