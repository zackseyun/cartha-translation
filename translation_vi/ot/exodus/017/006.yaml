  text: הִנְ/נִ֣י עֹמֵד֩ לְ/פָנֶ֨י/ךָ שָּׁ֥ם עַֽל הַ/צּוּר֮ בְּ/חֹרֵב֒ וְ/הִכִּ֣יתָ בַ/צּ֗וּר וְ/יָצְא֥וּ מִמֶּ֛/נּוּ מַ֖יִם וְ/שָׁתָ֣ה הָ/עָ֑ם וַ/יַּ֤עַשׂ כֵּן֙ מֹשֶׁ֔ה לְ/עֵינֵ֖י זִקְנֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: vi
  text: “Này[a], Ta sẽ đứng trước mặt con tại đó, trên tảng đá ở Hô-rếp. Con hãy đập vào tảng đá; nước sẽ từ đó chảy ra, và dân chúng sẽ uống.” Môi-se làm đúng như vậy trước mắt các trưởng lão Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Này, Ta đang đứng trước mặt con tại đó, trên tảng đá ở Hô-rếp.” Phân từ Hê-bơ-rơ có thể được hiểu theo thì hiện tại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Này
  rationale: Từ này hướng sự chú ý vào lời tuyên bố long trọng của Đức Chúa Trời. “Này” ngắn gọn, trang trọng và tự nhiên hơn lối dịch quá sát như “Kìa, Ta đây” trong ngữ cảnh này.
- source_word: עֹמֵד
  choice: sẽ đứng
  rationale: Dù về hình thái đây là một phân từ, mạch chỉ dẫn cho thấy hành động sắp diễn ra; “sẽ đứng” truyền đạt tự nhiên sắc thái cận tương lai, đồng thời phương án hiện tại được giữ trong chú thích.
- source_word: לְפָנֶיךָ
  choice: trước mặt con
  rationale: Diễn đạt vị trí của Đức Chúa Trời ở phía trước Môi-se, đồng thời giữ sắc thái hiện diện hữu hình mà không giải thích thêm.
- source_word: הַצּוּר
  choice: tảng đá
  rationale: צוּר chỉ một khối đá hay vách đá. “Tảng đá” là cách gọi tự nhiên, cụ thể và giữ được sự lặp lại của cùng một từ trong câu.
- source_word: בְּחֹרֵב
  choice: ở Hô-rếp
  rationale: Giới từ được diễn đạt tự nhiên bằng “ở” trước địa danh; Hô-rếp là dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: וְהִכִּיתָ
  choice: Con hãy đập
  rationale: Trong ngữ cảnh chỉ thị, động từ mang lực mệnh lệnh. “Đập” thể hiện tác động mạnh lên tảng đá và tự nhiên hơn “đánh” trong tiếng Việt.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: nước sẽ từ đó chảy ra
  rationale: “Chảy ra” là cách diễn đạt tự nhiên khi chủ thể là nước; “từ đó” quy chiếu rõ về tảng đá mà không làm nặng câu.
- source_word: וְשָׁתָה הָעָם
  choice: và dân chúng sẽ uống
  rationale: Giữ quan hệ tiếp nối/kết quả đơn giản của tiếng Hê-bơ-rơ, không tự chuyển thành một mệnh đề mục đích.
- source_word: וַיַּעַשׂ כֵּן
  choice: làm đúng như vậy
  rationale: Đây là cách diễn đạt tự nhiên của công thức tường thuật, trong đó “đúng” làm rõ rằng Môi-se thi hành theo lời truyền mà không thêm nội dung mới.
- source_word: לְעֵינֵי
  choice: trước mắt
  rationale: Giữ hình ảnh nguyên ngữ và nhấn mạnh rằng các trưởng lão Israel tận mắt chứng kiến sự việc.
theological_decisions:
- issue: Thì của lời tự trình hiện có phân từ עֹמֵד
  choice: Ta sẽ đứng trước mặt con
  alternative: Ta đang đứng trước mặt con
  rationale: Phân từ Hê-bơ-rơ cho phép hiểu theo hiện tại, nhưng chuỗi chỉ dẫn hướng đến hành động Môi-se sắp thực hiện khiến cách dịch tương lai tự nhiên hơn. Chú thích bảo tồn khả năng hiện tại thay vì loại bỏ nó.
- issue: Mối liên hệ cú pháp giữa việc Đức Chúa Trời đứng và tảng đá
  choice: Ta sẽ đứng trước mặt con tại đó, trên tảng đá ở Hô-rếp
  alternative: Ta sẽ đứng trước mặt con tại đó, bên tảng đá ở Hô-rếp
  rationale: Cú pháp tự nhiên nhất gắn cụm “trên tảng đá ở Hô-rếp” với hành động đứng của Đức Chúa Trời. Bản dịch giữ nguyên hình ảnh nổi bật này và không làm nhẹ thành “bên tảng đá”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” trong lời Đức Chúa Trời phán trực tiếp với Môi-se; dùng “dân chúng” và “các trưởng lão” theo lối phổ thông. Tên Hô-rếp và Môi-se được phiên âm theo dạng quen thuộc; Israel được giữ ở dạng quốc tế hiện hành.
