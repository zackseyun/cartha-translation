source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲבֹר֙ לִ/פְנֵ֣י הָ/עָ֔ם וְ/קַ֥ח אִתְּ/ךָ֖ מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וּ/מַטְּ/ךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּ/וֹ֙ אֶת הַ/יְאֹ֔ר קַ֥ח בְּ/יָדְ/ךָ֖ וְ/הָלָֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: vi
  text: 'Bấy giờ Yahweh phán với Môi-se: “Hãy đi trước dân chúng và đưa theo một số trưởng lão của Y-sơ-ra-ên. Hãy cầm trong tay cây gậy mà con đã dùng để đánh sông Nin[a], rồi đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sông”; trong sách Xuất Ai Cập, từ này thường chỉ riêng sông Nin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng tự sự tiếp diễn đưa câu chuyện sang lời phán kế tiếp; “bấy giờ” tự nhiên trong văn kể trang trọng, còn “phán” phù hợp khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì đổi thành một tước hiệu, nhằm giữ sự phân biệt có trong tiếng Hê-bơ-rơ.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: Hãy đi lên phía trước dân chúng
  rationale: Trong ngữ cảnh này, עבר לפני diễn tả việc Môi-se đi qua để ở phía trước cộng đồng; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: và dẫn theo một số trưởng lão của Y-sơ-ra-ên
  rationale: Giới từ מִן mang nghĩa phân chọn từ một nhóm, nên “một số” cho thấy không nhất thiết là toàn thể các trưởng lão. “Dẫn theo” diễn đạt tự nhiên việc đưa người cùng đi.
- source_word: וּמַטְּךָ
  choice: cây gậy
  rationale: מַטֶּה có thể là gậy hoặc trượng; “cây gậy” là cách gọi hiện đại, dễ hiểu và thích hợp với vật Môi-se cầm trong tay.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: mà con đã dùng để đập nước sông Nin
  rationale: בּוֹ mang nghĩa phương tiện, được diễn đạt bằng “dùng để”; הַיְאֹר trong bối cảnh Xuất Ai Cập chỉ sông Nin. Thêm “nước” giúp tránh cách hiểu Môi-se đập vào lòng sông hay bờ sông, phù hợp với biến cố được nhắc lại ở Xuất Ai Cập 7:20.
- source_word: קַח בְּיָדְךָ
  choice: Hãy cầm trong tay
  rationale: Giữ lại động từ קח được lặp trong nguyên văn và hình ảnh cụ thể của בְּיָדְךָ, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: וְהָלָכְתָּ
  choice: rồi đi
  rationale: Dạng động từ này tiếp nối chuỗi mệnh lệnh với sắc thái bắt buộc; “rồi đi” giữ trình tự hành động và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh YHWH
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Dùng “Yahweh” để bảo tồn danh riêng יהוה trong nguyên văn, không thay bằng tước hiệu và không thêm một lập trường giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Môi-se”, “Y-sơ-ra-ên” và “sông Nin” theo các dạng tên quen thuộc trong tiếng Việt. Đại từ “con” trong lời Yahweh phán với Môi-se thể hiện quan hệ bề trên–bề dưới tự nhiên, không hàm ý riêng về tuổi tác hay giáo lý.
