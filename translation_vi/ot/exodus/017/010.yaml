  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: vi
  text: Vậy, Giô-suê làm theo lời Môi-se đã bảo để giao chiến với A-ma-léc[a]; còn Môi-se, A-rôn và Hu-rơ đi lên đỉnh đồi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “A-ma-léc”; tên này ở đây có thể chỉ dân tộc hậu duệ của A-ma-léc, tức dân A-ma-léc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: Giô-suê làm theo lời Môi-se đã bảo
  rationale: Diễn đạt tự nhiên quan hệ tuân theo chỉ thị có trước; “đã bảo” phản ánh ngữ cảnh mệnh lệnh ở câu trước mà không thêm nội dung.
- source_word: לְהִלָּחֵם בַּעֲמָלֵק
  choice: để giao chiến với A-ma-léc
  rationale: Động từ לחם ở thể Niphal chỉ việc chiến đấu; giới từ ב trong kết cấu này đánh dấu đối thủ. “Giao chiến với” là cách nói tiếng Việt tự nhiên và giữ nguyên tên A-ma-léc thay vì diễn giải thành tên dân tộc.
- source_word: עָלוּ
  choice: đi lên
  rationale: Giữ nghĩa chuyển động lên cao của עלה bằng cách diễn đạt thông dụng trong tiếng Việt.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: đỉnh đồi
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “đầu của ngọn đồi”, một thành ngữ địa hình chỉ phần cao nhất; “đỉnh đồi” ngắn gọn và tự nhiên.
- source_word: יְהוֹשֻׁעַ / מֹשֶׁה / אַהֲרֹן / חוּר
  choice: Giô-suê / Môi-se / A-rôn / Hu-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt hiện đại.
