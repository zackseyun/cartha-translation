  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: vi
  text: 'Ông đặt tên nơi ấy là Ma-sa và Mê-ri-ba[a], vì sự tranh cãi của con cái Y-sơ-ra-ên và vì họ đã thử thách Yahweh khi nói: “Yahweh có ở giữa chúng ta hay không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ma-sa gần âm với từ Hê-bơ-rơ nghĩa là “thử thách”; tên Mê-ri-ba gần âm với từ Hê-bơ-rơ nghĩa là “tranh cãi” hoặc “tranh chấp.”
    reason: Giải thích lối chơi chữ Hê-bơ-rơ gắn hai địa danh với nguyên nhân chúng được đặt tên.
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: Ông đặt tên nơi ấy
  rationale: Động từ קרא đi với שֵׁם diễn tả hành động đặt tên. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ rõ công thức đặt tên của tiếng Hê-bơ-rơ.
- source_word: מַסָּה וּמְרִיבָה
  choice: Ma-sa và Mê-ri-ba
  rationale: Đây là hai địa danh nên được phiên âm; mối liên hệ của chúng với các từ chỉ việc thử thách và tranh cãi được giải thích trong chú thích.
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: vì con cái Y-sơ-ra-ên đã tranh cãi
  rationale: עַל nêu lý do đặt tên, còn רִיב chỉ sự tranh chấp hay cãi cọ. Chuyển danh từ thành mệnh đề động từ tạo câu tiếng Việt rõ và tự nhiên.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cụm từ Hê-bơ-rơ có nghĩa đen là 'các con trai của Y-sơ-ra-ên' nhưng ở đây dùng theo nghĩa tập thể, chỉ dân Y-sơ-ra-ên. 'Con cái Y-sơ-ra-ên' vừa giữ sắc thái nguồn vừa bao quát cộng đồng.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: và thử thách Yahweh
  rationale: נסה ở thể piel có nghĩa là thử hoặc đặt vào phép thử; Yahweh là tân ngữ trực tiếp. 'Thử thách' phù hợp với văn mạch dân chúng đòi bằng chứng về sự hiện diện của Ngài.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: לֵאמֹר
  choice: khi nói
  rationale: Từ này dẫn vào nội dung lời chất vấn; 'khi nói' liên kết tự nhiên trong câu tiếng Việt với hành động thử thách.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: Yahweh có ở giữa chúng ta hay không?
  rationale: בְּקִרְבֵּנוּ chỉ sự hiện diện ở giữa cộng đồng, còn אִם אָיִן hoàn tất câu hỏi lựa chọn theo nghĩa 'hay không'.
theological_decisions:
- issue: Cách dịch danh xưng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. Phiên âm 'Yahweh' bảo tồn sự phân biệt giữa danh riêng này và các tước hiệu thần linh.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên / dân Y-sơ-ra-ên
  rationale: Cụm giống đực số nhiều là một cách gọi tập thể toàn dân. 'Con cái Y-sơ-ra-ên' giữ hình ảnh quan hệ dòng dõi mà không hàm ý chỉ nam giới.
- issue: Ý nghĩa lời chất vấn về sự hiện diện của Yahweh
  choice: Yahweh có ở giữa chúng ta hay không?
  alternative: Yahweh có ở trong chúng ta hay không?
  rationale: בקרבנו ở đây nói về sự hiện diện của Yahweh giữa cộng đồng, không nhất thiết nói về sự ngự bên trong từng cá nhân; vì vậy 'ở giữa chúng ta' giữ đúng độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Ông' để nối chủ thể Môi-se từ văn mạch trước mà không thêm tên không có trong câu; dùng 'đặt tên' thay cho lối dịch sát chữ nhưng kém tự nhiên 'gọi tên của nơi'. Phiên âm địa danh theo dạng quen thuộc trong tiếng Việt và giữ Yahweh là danh riêng.
