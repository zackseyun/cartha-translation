translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đánh bại” phù hợp ngữ cảnh quân sự; “dân của ông ta” giữ phạm vi nghĩa của nguyên văn thay vì thu hẹp thành “quân đội”.
