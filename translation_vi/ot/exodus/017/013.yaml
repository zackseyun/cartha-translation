  yaml_path: translation/ot/exodus/017/013.yaml
  text: And Joshua overcame Amalek and his people with the sword[a].
translation:
  language: vi
  text: Giô-suê đánh bại A-ma-léc và dân của ông ta bằng gươm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “bằng lưỡi gươm”. Tiếng Hê-bơ-rơ dịch từng chữ là “bằng miệng gươm”, một thành ngữ chỉ sự đánh bại trong giao chiến bằng vũ khí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: đánh bại
  rationale: Động từ חלש có thể mang nghĩa làm suy yếu hoặc thắng thế. Trong ngữ cảnh trận chiến, “đánh bại” diễn đạt tự nhiên kết quả quân sự mà không hàm ý tiêu diệt hoàn toàn.
- source_word: יְהוֹשֻׁעַ
  choice: Giô-suê
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: עֲמָלֵק
  choice: A-ma-léc
  rationale: Giữ tên riêng số ít; trong ngữ cảnh này tên tổ phụ/dân tộc đại diện cho lực lượng A-ma-léc.
- source_word: עַמּוֹ
  choice: dân của ông ta
  rationale: עַם có nghĩa cơ bản là “dân”. Trong bối cảnh chiến trận, cụm từ có thể chỉ lực lượng chiến đấu dưới quyền A-ma-léc, nhưng bản dịch giữ cách diễn đạt rộng của tiếng Hê-bơ-rơ.
- source_word: לְפִי חָרֶב
  choice: bằng gươm
  rationale: Nghĩa đen là “bằng miệng gươm”, một thành ngữ Hê-bơ-rơ chỉ việc đánh bại hoặc giết bằng vũ khí; “bằng gươm” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
