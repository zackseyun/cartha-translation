  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: vi
  text: Toàn thể cộng đồng con dân Israel khởi hành từ hoang mạc Sin, đi từng chặng theo lệnh của Yahweh[a], và đóng trại tại Rê-phi-đim; nhưng ở đó không có nước cho dân chúng uống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen trong tiếng Hebrew: “theo miệng Yahweh”, một thành ngữ có nghĩa là theo lệnh hoặc sự chỉ dẫn của Ngài.'
    reason: Giải thích thành ngữ Hebrew được chuyển sang cách nói tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: rời … đi
  rationale: Động từ נסע trong hành trình nơi hoang mạc chỉ việc nhổ trại và lên đường. Cách diễn đạt này tự nhiên trong tiếng Việt và thể hiện rõ sự di chuyển khỏi hoang mạc Sin.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toàn thể cộng đồng con dân Israel
  rationale: עֵדָה chỉ toàn cộng đồng được quy tụ; בְּנֵי יִשְׂרָאֵל là thành ngữ chỉ dân Israel. “Con dân Israel” vừa giữ sắc thái nguồn vừa tự nhiên hơn cách dịch máy móc “các con trai của Israel”.
- source_word: מִמִּדְבַּר סִין
  choice: khỏi hoang mạc Sin
  rationale: מִדְבָּר là vùng hoang vu hoặc hoang mạc; Sin là địa danh nên được phiên âm, không dịch theo từ tiếng Anh đồng hình.
- source_word: לְמַסְעֵיהֶם
  choice: đi từng chặng
  rationale: Danh từ số nhiều מַסָּע chỉ các chặng hoặc lần nhổ trại trong hành trình. “Đi từng chặng” truyền đạt rõ trình tự di chuyển mà không hàm ý đây là một chuyến đi duy nhất.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Thành ngữ này theo nghĩa đen là “theo miệng Yahweh”, nhưng trong ngữ cảnh diễn tả việc làm theo mệnh lệnh hoặc sự chỉ dẫn của Ngài.
- source_word: וַיַּחֲנוּ בִּרְפִידִים
  choice: rồi đóng trại tại Rê-phi-đim
  rationale: חנה là đóng trại; Rê-phi-đim là địa danh. “Rồi” nối tiếp diễn tiến tự sự một cách tự nhiên.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: Nhưng ở đó không có nước cho dân chúng uống
  rationale: 'Liên từ וְ có sắc thái tương phản trong ngữ cảnh: họ đã đóng trại nhưng nơi ấy không có nước. “Ở đó” làm rõ quan hệ địa điểm vốn đã hiển nhiên trong câu Hebrew.'
theological_decisions:
- issue: Cách thể hiện danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Bản Hebrew dùng trực tiếp Danh Bốn Chữ. Giữ “Yahweh” như một danh riêng giúp phân biệt danh giao ước với tước hiệu “Chúa” mà không thêm diễn giải hệ phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “cộng đồng con dân Israel” để giữ ý nghĩa tập thể của nguyên văn; dùng “dân chúng” ở cuối câu để tránh lặp nặng nề. Địa danh Rê-phi-đim được phiên âm có dấu, còn Israel và Yahweh được giữ theo dạng quốc tế quen dùng.
