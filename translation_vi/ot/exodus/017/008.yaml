  text: Then Amalek came and fought with Israel at Rephidim[a].
translation:
  language: vi
  text: Bấy giờ, dân A-ma-léc đến giao chiến với dân Y-sơ-ra-ên[a] tại Rê-phi-đim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đánh dân Y-sơ-ra-ên.” Giới từ Hê-bơ-rơ có nghĩa đen là “với”, nhưng trong ngữ cảnh chiến trận, nó chỉ bên đối địch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Bấy giờ, ... kéo đến
  rationale: Dạng kể chuyện với waw liên tiếp đưa trình thuật tiến sang biến cố kế tiếp. “Bấy giờ” diễn đạt mạch nối tự nhiên; “kéo đến” phù hợp với hành động của một lực lượng dân tộc tiến đến địa điểm giao chiến.
- source_word: עֲמָלֵק
  choice: dân A-ma-léc
  rationale: Tên A-ma-léc ở đây được dùng theo nghĩa tập thể, chỉ dân A-ma-léc; thêm “dân” giúp độc giả tiếng Việt hiểu đúng mà vẫn giữ tên riêng.
- source_word: וַיִּלָּחֶם
  choice: giao chiến
  rationale: Động từ Niphal của לחם trong ngữ cảnh này có nghĩa là chiến đấu hoặc giao chiến. “Giao chiến” tự nhiên, trang trọng và phù hợp văn kể chuyện.
- source_word: עִם
  choice: với
  rationale: Giới từ עִם có nghĩa cơ bản là “với”; đi cùng “giao chiến”, tiếng Việt tự nhiên hiểu đây là hai bên đối địch, nên vừa sát hình thức Hê-bơ-rơ vừa rõ nghĩa theo ngữ cảnh.
- source_word: יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Trong câu này, tên Y-sơ-ra-ên chỉ cộng đồng dân tộc đang bị tấn công; “dân Y-sơ-ra-ên” làm rõ nghĩa tập thể.
- source_word: בִּרְפִידִם
  choice: tại Rê-phi-đim
  rationale: Giới từ בְּ đánh dấu địa điểm. “Tại” là cách diễn đạt tự nhiên cho nơi diễn ra sự kiện.
