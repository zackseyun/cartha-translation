base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: vi
  text: 'Tại đó, dân chúng khát nước. Dân chúng than phiền với Môi-se và nói: “Tại sao ông lại đưa chúng tôi ra khỏi Ai Cập để làm cho tôi, con cái tôi và gia súc tôi chết khát?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא שָׁם הָעָם לַמַּיִם
  choice: Tại đó, dân chúng khát nước
  rationale: Diễn đạt trực tiếp ý dân chúng chịu khát vì thiếu nước; tiếng Việt tự nhiên không cần lặp cả ‘khát nước vì nước’.
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: họ càu nhàu với Môi-se
  rationale: Động từ לון trong ngữ cảnh chỉ sự phàn nàn, oán trách hướng vào Môi-se; ‘càu nhàu với’ giữ sắc thái lời than trách trực tiếp mà vẫn dễ hiểu.
- source_word: לָמָּה זֶּה הֶעֱלִיתָנוּ
  choice: Tại sao ông lại đưa chúng tôi ra khỏi Ai Cập
  rationale: Cụm לָמָּה זֶּה là câu hỏi trách móc; cách nói này tự nhiên trong tiếng Việt và giữ ý ‘đưa lên/đưa ra khỏi Ai Cập’ của הֶעֱלִיתָנוּ theo lối diễn đạt quen thuộc của câu chuyện Xuất Hành.
- source_word: לְהָמִית ... בַּצָּמָא
  choice: để làm cho ... chết khát
  rationale: Giữ lời cáo buộc về mục đích trong לְהָמִית và chuyển thành thành ngữ tiếng Việt tự nhiên ‘chết khát’.
- source_word: מִקְנַי
  choice: gia súc tôi
  rationale: מִקְנֶה chỉ đàn vật nuôi/gia súc thuộc sở hữu; chọn từ phổ thông, chính xác trong ngữ cảnh.
theological_decisions:
- issue: Sự chuyển đổi từ số nhiều ‘chúng tôi’ sang số ít ‘tôi/con cái tôi/gia súc tôi’
  choice: Giữ nguyên sự chuyển đổi số ngữ pháp của bản Hê-bơ-rơ
  alternative: Đồng nhất thành ‘chúng tôi, con cái chúng tôi và gia súc chúng tôi’
  rationale: Nguyên văn chuyển từ הֶעֱלִיתָנוּ (chúng tôi) sang אֹתִי / בָנַי / מִקְנַי (tôi/con cái tôi/gia súc tôi), có thể là lời của dân được trình bày qua tiếng nói của một cá nhân đại diện. Không nên âm thầm làm phẳng nét căng này.
- issue: Sắc thái mục đích trong לְהָמִית
  choice: Dịch ‘để làm cho ... chết khát’
  alternative: 'Dịch theo hệ quả: ‘khiến ... chết khát’'
  rationale: Giữ lực tu từ của lời dân cáo buộc Môi-se đã đưa họ ra với mục đích làm họ chết, dù lời cáo buộc ấy không phải lời xác nhận của người kể chuyện.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ đại từ ‘ông’ khi dân chúng trực tiếp trách Môi-se; bảo toàn sự bất nhất số nhiều/số ít có thật trong nguyên văn thay vì sửa cho trơn.
