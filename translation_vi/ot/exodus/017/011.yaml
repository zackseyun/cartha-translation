  text: וְ/הָיָ֗ה כַּ/אֲשֶׁ֨ר יָרִ֥ים מֹשֶׁ֛ה יָד֖/וֹ וְ/גָבַ֣ר יִשְׂרָאֵ֑ל וְ/כַ/אֲשֶׁ֥ר יָנִ֛יחַ יָד֖/וֹ וְ/גָבַ֥ר עֲמָלֵֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/011.yaml
  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: vi
  text: Mỗi khi Môi-se giơ tay lên[a] thì Y-sơ-ra-ên thắng thế; còn mỗi khi ông hạ tay xuống[b] thì A-ma-léc thắng thế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi Môi-se giơ tay lên… khi ông hạ tay xuống.” Kết cấu Hê-bơ-rơ có thể dịch sát hơn bằng “khi”, nhưng ngữ cảnh cho thấy hành động lặp lại trong trận chiến, nên dịch là “mỗi khi”.'
    reason: lexical_alternative
  - marker: b
    text: Động từ được dịch là “hạ… xuống” cũng có thể mang nghĩa “để (tay) nghỉ” hoặc “đặt xuống”. Sự tương phản với “giơ tay lên” ủng hộ cách dịch “hạ tay xuống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַאֲשֶׁר
  choice: Mỗi khi
  rationale: Trong mạch kể này, kết cấu diễn tả tình huống lặp đi lặp lại trong trận chiến; “mỗi khi” truyền đạt rõ ý lặp lại mà không biến câu thành một biến cố đơn lẻ.
- source_word: יָרִים
  choice: giơ ... lên
  rationale: Dạng Hiphil của רום có nghĩa là nâng hoặc giơ lên. “Giơ tay lên” tự nhiên trong tiếng Việt và không thêm ý rằng Môi-se liên tục giữ tay ở tư thế ấy.
- source_word: יָדוֹ
  choice: tay
  rationale: Giữ đúng danh từ Hê-bơ-rơ “tay”, thay vì diễn giải thành “cánh tay”.
- source_word: וְגָבַר
  choice: thắng thế
  rationale: גבר chỉ việc mạnh hơn hoặc chiếm ưu thế. “Thắng thế” phù hợp bối cảnh giao chiến nhưng không hàm ý đã giành chiến thắng chung cuộc.
- source_word: יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh chiến trận, tên gọi chỉ dân/quân Y-sơ-ra-ên; thêm “dân” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: וְכַאֲשֶׁר
  choice: còn mỗi khi
  rationale: “Mỗi khi” giữ ý lặp lại; “còn” thể hiện sự phối hợp tương phản giữa hai vế.
- source_word: יָנִיחַ
  choice: hạ ... xuống
  rationale: Dạng Hiphil của נוח có thể mang nghĩa làm cho nghỉ, để xuống hoặc hạ xuống. Đối lập trực tiếp với “giơ tay lên” khiến “hạ tay xuống” là cách diễn đạt rõ và tự nhiên nhất.
- source_word: עֲמָלֵק
  choice: dân A-ma-léc
  rationale: Tên gọi ở đây chỉ lực lượng/dân A-ma-léc; thêm “dân” làm rõ đối tượng tập thể trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thắng thế” để diễn tả ưu thế tạm thời trong diễn biến trận đánh, tránh hàm ý chiến thắng hoàn toàn. Giữ “tay” theo nguyên văn và dùng tên riêng theo lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
