- from: Môi-se xây một bàn thờ và đặt tên là[a] “Yahweh là ngọn cờ của tôi.”
  to: 'Môi-se xây một bàn thờ, rồi đặt tên cho nó là[a]: “Yahweh là ngọn cờ của tôi.”'
  rationale: Bản sửa làm rõ bàn thờ là đối tượng được đặt tên và điều chỉnh chú thích để bảo tồn sự không hiện diện của động từ nối trong tiếng Hê-bơ-rơ cũng như khả năng đọc theo lối đồng vị. Không thay đổi hình ảnh “ngọn cờ,” danh riêng Yahweh, hay ý nghĩa cơ bản của câu.
