base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: vi
  text: 'Môi-se xây một bàn thờ, rồi đặt tên cho nó là[a]: “Yahweh là ngọn cờ của tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH [là] ngọn cờ của tôi”; cũng có thể hiểu là “Yahweh, ngọn cờ của tôi.” Tên này có lẽ ví Yahweh như ngọn cờ hoặc hiệu kỳ tập hợp Israel trong chiến thắng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: xây
  rationale: Động từ בנה trong mạch kể chuyện chỉ hành động xây dựng cụ thể; “xây” là cách diễn đạt tự nhiên và trực tiếp trong tiếng Việt.
- source_word: מִזְבֵּחַ
  choice: bàn thờ
  rationale: מִזְבֵּחַ là thuật ngữ thông dụng chỉ nơi dâng sinh tế hoặc thờ phượng; “bàn thờ” là tương đương quen thuộc và chính xác.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: đặt tên là
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “gọi tên của nó”; “đặt tên là” chuyển tải tự nhiên hành động đặt tên trong tiếng Việt mà không làm thay đổi đối tượng được đặt tên là bàn thờ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: נִסִּי
  choice: là ngọn cờ của tôi
  rationale: נֵס có thể chỉ ngọn cờ, hiệu kỳ hoặc dấu hiệu được dựng lên để tập hợp; trong mệnh đề danh từ này, thêm “là” giúp câu tự nhiên trong tiếng Việt, còn “ngọn cờ của tôi” giữ nguyên hình ảnh ẩn dụ và ngôi thứ nhất.
theological_decisions:
- issue: Cách chuyển danh יהוה trong tên kỷ niệm của bàn thờ
  choice: Yahweh
  alternative: Đức Giê-hô-va / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ trong cụm יהוה נסי
  choice: Yahweh là ngọn cờ của tôi
  alternative: Yahweh, ngọn cờ của tôi
  rationale: Tiếng Hê-bơ-rơ không có động từ nối hiện rõ. Thêm “là” là cách diễn đạt tự nhiên trong tiếng Việt nhưng không giải thích xa hơn ý nghĩa biểu tượng của “ngọn cờ”.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Dùng “Môi-se” theo dạng tên quen thuộc trong tiếng Việt; giữ “Yahweh” là danh riêng. Cụm “đặt tên là” tự nhiên hơn lối dịch sát chữ “gọi tên của nó”.
