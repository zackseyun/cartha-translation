source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר כִּֽי יָד֙ עַל כֵּ֣ס יָ֔הּ מִלְחָמָ֥ה לַ/יהוָ֖ה בַּֽ/עֲמָלֵ֑ק מִ/דֹּ֖ר דֹּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: vi
  text: 'Ông nói: “Một bàn tay trên ngai của Yah[a]. Yahweh sẽ giao chiến với Amalek từ đời này sang đời kia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ ở đây khó hiểu và tỉnh lược; sát nghĩa là: “Một bàn tay trên ngai của Yah.” Câu này cũng có thể được hiểu là “một bàn tay chống lại ngai của Yah”; ít có khả năng hơn, כֵּס có thể được hiểu là “cờ hiệu”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ông nói
  rationale: Tiếp nối lời kể bằng động từ ngôi thứ ba số ít giống đực; tiếng Hê-bơ-rơ không nhắc lại tên chủ thể, nên giữ đại từ “ông”.
- source_word: כִּי
  choice: không dịch riêng
  rationale: Tại đây כִּי dẫn vào nội dung lời nói; dấu hai chấm và ngoặc kép diễn đạt chức năng ấy tự nhiên trong tiếng Việt mà không buộc câu khó này mang nghĩa nguyên nhân.
- source_word: יָד
  choice: một bàn tay
  rationale: Danh từ không có mạo từ và không xác định bàn tay của ai; cách dịch này giữ tính cô đọng và mơ hồ của nguyên văn.
- source_word: עַל
  choice: đặt trên
  rationale: עַל thường có nghĩa “trên”; thêm “đặt” để câu tiếng Việt tự nhiên, nhưng không xác định hành động là thề hay chống nghịch.
- source_word: כֵּס
  choice: ngai
  rationale: Dạng viết bất thường này nhiều khả năng là dạng rút gọn hoặc khiếm khuyết liên hệ với כִּסֵּא, “ngai”; nghĩa “cờ hiệu” kém chắc chắn hơn.
- source_word: יָהּ
  choice: Yah
  rationale: Giữ dạng rút gọn riêng của danh Đức Chúa Trời, phân biệt với יהוה trong vế kế tiếp.
- source_word: מִלְחָמָה לַיהוָה
  choice: Yahweh sẽ giao chiến
  rationale: Mệnh đề danh từ nói cuộc chiến thuộc về Yahweh hoặc Yahweh ở trong tình trạng chiến tranh; “sẽ giao chiến” truyền đạt tự nhiên sắc thái hướng tới tương lai trong ngữ cảnh.
- source_word: בַּעֲמָלֵק
  choice: với Amalek
  rationale: ב trong ngữ cảnh chiến tranh chỉ bên đối địch; tiếng Việt có thể nói tự nhiên “giao chiến với” mà vẫn thể hiện sự chống lại.
- source_word: מִדֹּר דֹּר
  choice: từ đời này sang đời kia
  rationale: Thành ngữ chỉ sự tiếp diễn qua các thế hệ; cách nói này tự nhiên, trang trọng và dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Hai dạng danh Đức Chúa Trời יָהּ và יהוה xuất hiện trong cùng câu
  choice: Dịch lần lượt là “Yah” và “Yahweh”
  alternative: Dịch cả hai là “CHÚA”, hoặc không phân biệt hai dạng danh
  rationale: Nguyên văn cố ý dùng dạng ngắn יָהּ rồi dùng danh đầy đủ יהוה; giữ sự phân biệt này phản ánh trực tiếp chứng cứ Hê-bơ-rơ.
- issue: Mệnh đề tỉnh lược כִּי יָד עַל כֵּס יָהּ
  choice: “Một bàn tay đặt trên ngai của Yah” và ghi chú các cách hiểu khác
  alternative: “Một bàn tay chống lại ngai của Yah” hoặc hiểu כֵּס là “cờ hiệu”
  rationale: Cú pháp và từ ngữ của mệnh đề nổi tiếng là khó; bản dịch chính giữ nghĩa từ vựng trực tiếp, còn chú thích bảo tồn các khả năng thật sự mà không biến một cách giải thích thành điều chắc chắn.
- issue: Sắc thái của מִלְחָמָה לַיהוָה
  choice: “Yahweh sẽ giao chiến”
  alternative: “Yahweh có chiến tranh” hoặc “cuộc chiến thuộc về Yahweh”
  rationale: Câu Hê-bơ-rơ không có động từ, có thể nhấn mạnh cuộc chiến thuộc về Yahweh; trong mạch văn, cách dịch bằng động từ tương lai tự nhiên hơn trong tiếng Việt nhưng không thêm tác nhân hay kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hai danh xưng “Yah” và “Yahweh”, bảo tồn tính cô đọng của câu Hê-bơ-rơ, đồng thời dùng chú thích để trình bày sự mơ hồ thật sự.
