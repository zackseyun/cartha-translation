revisions:
- from: Nhưng hai tay Môi-se nặng trĩu, nên họ lấy một hòn đá kê dưới ông, và ông ngồi lên đó. A-rôn và Hu-rơ đỡ hai tay ông, mỗi người một bên; nhờ vậy, hai tay ông giữ vững[a] cho đến khi mặt trời lặn.
  to: Nhưng hai tay Môi-se nặng trĩu, nên họ lấy một hòn đá kê dưới ông, và ông ngồi lên đó. A-rôn và Hu-rơ đỡ hai tay ông, người này một bên, người kia một bên; nhờ vậy, hai tay ông vẫn vững vàng[a] cho đến khi mặt trời lặn.
  rationale: Sửa cách diễn đạt trạng thái của hai tay Môi-se để vừa tự nhiên trong tiếng Việt vừa sát nghĩa אֱמוּנָה trong ngữ cảnh thể chất. Điều chỉnh cách mô tả vị trí của A-rôn và Hu-rơ và chú thích từ vựng cho rõ hơn, không thay đổi ý nghĩa đoạn văn.
