  text: וִ/ידֵ֤י מֹשֶׁה֙ כְּבֵדִ֔ים וַ/יִּקְחוּ אֶ֛בֶן וַ/יָּשִׂ֥ימוּ תַחְתָּ֖י/ו וַ/יֵּ֣שֶׁב עָלֶ֑י/הָ וְ/אַהֲרֹ֨ן וְ/ח֜וּר תָּֽמְכ֣וּ בְ/יָדָ֗י/ו מִ/זֶּ֤ה אֶחָד֙ וּ/מִ/זֶּ֣ה אֶחָ֔ד וַ/יְהִ֥י יָדָ֛י/ו אֱמוּנָ֖ה עַד בֹּ֥א הַ/שָּֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: vi
  text: Nhưng hai tay Môi-se nặng trĩu, nên họ lấy một hòn đá kê dưới ông, và ông ngồi lên đó. A-rôn và Hu-rơ đỡ hai tay ông, người này một bên, người kia một bên; nhờ vậy, hai tay ông vẫn vững vàng[a] cho đến khi mặt trời lặn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vững chắc” hoặc “ổn định.” Danh từ Hê-bơ-rơ này cũng có thể mang nghĩa “sự trung tín,” nhưng ở đây nói đến sự vững ổn về thể chất của hai tay Môi-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה
  choice: hai tay Môi-se
  rationale: יָד ở số nhiều chỉ hai tay; thêm “hai” tự nhiên trong tiếng Việt và phù hợp cảnh A-rôn cùng Hu-rơ đỡ mỗi bên.
- source_word: כְּבֵדִים
  choice: nặng trĩu
  rationale: Giữ hình ảnh cụ thể “nặng” của tiếng Hê-bơ-rơ, đồng thời diễn đạt tự nhiên sự mỏi mệt trong tiếng Việt.
- source_word: וַיִּקְחוּ אֶבֶן
  choice: họ lấy một hòn đá
  rationale: Giữ chủ ngữ số nhiều không xác định của nguyên văn, không tự ý quy nó riêng cho A-rôn và Hu-rơ.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: kê dưới ông
  rationale: “Kê” diễn đạt tự nhiên hành động đặt hòn đá bên dưới để Môi-se ngồi, trong khi vẫn bám sát quan hệ không gian của nguyên văn.
- source_word: תָּמְכוּ בְיָדָיו
  choice: đỡ hai tay ông
  rationale: תמך diễn tả việc nâng đỡ hoặc giữ cho khỏi hạ xuống; “đỡ” rõ ràng và tự nhiên trong ngữ cảnh thể chất.
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: mỗi người một bên
  rationale: Chuyển đạt gọn và rõ cấu trúc phân phối “một người phía này, một người phía kia”.
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: nhờ vậy, hai tay ông giữ vững
  rationale: Trong ngữ cảnh hai tay mỏi được nâng đỡ, אֱמוּנָה chủ yếu chỉ trạng thái vững, ổn định. “Giữ vững” diễn đạt kết quả kéo dài mà không biến cụm này thành một phẩm chất đạo đức.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: cho đến khi mặt trời lặn
  rationale: Cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt cho ý “đến lúc mặt trời đi xuống”.
theological_decisions:
- issue: Ý nghĩa của אֱמוּנָה khi nói về hai tay Môi-se
  choice: 'sự vững vàng về thể chất: “giữ vững”'
  alternative: “trung tín” hoặc “kiên định” theo nghĩa phẩm chất tinh thần
  rationale: Mạch văn trực tiếp nói đến tay Môi-se nặng trĩu và được A-rôn, Hu-rơ đỡ. Vì vậy nghĩa thể chất là trọng tâm, nhưng chú thích vẫn bảo lưu trường nghĩa rộng hơn của danh từ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Giữ tên riêng theo dạng quen dùng trong Kinh Thánh tiếng Việt; tránh lối diễn đạt quá cổ như “cho đến lúc mặt trời khuất bóng.”
