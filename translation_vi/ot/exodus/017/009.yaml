language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: vi
  text: 'Môi-se nói với Giô-suê: “Hãy chọn cho chúng ta một số người, rồi ra giao chiến với dân A-ma-léc.[a] Ngày mai, tôi sẽ đứng trên đỉnh đồi,[b] tay cầm cây gậy của Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đánh dân A-ma-léc.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ nói sát chữ là “trên đầu ngọn đồi,” một thành ngữ có nghĩa là “trên đỉnh đồi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Môi-se nói
  rationale: Dạng wayyiqtol tiếp nối mạch kể chuyện. Tiếng Việt không cần thêm liên từ “và” ở đầu câu để diễn đạt tự nhiên.
- source_word: יְהוֹשֻׁעַ
  choice: Giô-suê
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt hiện đại.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: Hãy chọn cho chúng ta một số người
  rationale: Giữ nghĩa “chọn người cho chúng ta”; “một số người” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh tuyển người chiến đấu mà không đưa từ “binh sĩ” vốn không có trực tiếp trong nguyên văn.
- source_word: וְצֵא
  choice: rồi ra
  rationale: Giữ động từ “ra” và diễn đạt trình tự mệnh lệnh tự nhiên bằng “rồi”.
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: giao chiến với dân A-ma-léc
  rationale: Thể Niphal mệnh lệnh của לחם mang nghĩa chiến đấu/giao chiến. “Dân A-ma-léc” làm rõ tên gọi tập thể trong ngữ cảnh mà không đồng nhất đối thủ với một cá nhân.
- source_word: מָחָר אָנֹכִי נִצָּב
  choice: Ngày mai, tôi sẽ đứng
  rationale: Trạng từ “ngày mai” khiến phân từ נִצָּב có ý nghĩa tương lai; “sẽ đứng” diễn đạt tự nhiên và sát nghĩa.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: trên đỉnh đồi
  rationale: רֹאשׁ nghĩa đen là “đầu” nhưng trong cụm này là thành ngữ chỉ đỉnh/chỗ cao nhất của ngọn đồi.
- source_word: וּמַטֵּה הָאֱלֹהִים בְּיָדִי
  choice: tay cầm cây gậy của Đức Chúa Trời
  rationale: 'Diễn đạt tự nhiên quan hệ trạng thái: Môi-se đứng đó với cây gậy trong tay, đồng thời giữ nguyên cụm sở thuộc “cây gậy của Đức Chúa Trời”.'
theological_decisions:
- issue: Cách dịch הָאֱלֹהִים trong מַטֵּה הָאֱלֹהִים
  choice: Đức Chúa Trời
  alternative: Thiên Chúa
  rationale: “Đức Chúa Trời” là cách gọi trang trọng, dễ hiểu trong tiếng Việt và giữ cụm “cây gậy của Đức Chúa Trời” gần với kết cấu Hê-bơ-rơ; lựa chọn này không thêm ý sở hữu hay thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “tôi” tránh áp đặt thêm sắc thái quyền uy không được mã hóa rõ trong đại từ Hê-bơ-rơ; các mệnh lệnh vẫn dứt khoát và tự nhiên.
