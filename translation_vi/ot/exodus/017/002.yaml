id: EXO.17.2
reference: Exodus 17:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: vi
  text: 'Dân chúng bèn tranh cãi với Môi-se và nói: “Hãy cho chúng tôi nước để uống.” Môi-se nói với họ: “Tại sao anh em tranh cãi với tôi? Tại sao anh em thử[b] Yahweh[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là cách phiên âm danh YHWH trong tiếng Hê-bơ-rơ; theo truyền thống thường được dịch là “CHÚA”.
    reason: Giải thích danh riêng thần linh và cung cấp lối dịch truyền thống.
  - marker: b
    text: 'Cũng có thể dịch: “đem Yahweh ra thử”.'
    reason: Nêu cách diễn đạt khác cho נסה mà không làm thay đổi ý nghĩa căn bản.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: bèn tranh cãi
  rationale: Động từ ריב diễn tả sự tranh chấp, đối đầu. “Tranh cãi” tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái mạnh hơn “phàn nàn”; “bèn” nối mạch tường thuật của וַ־.
- source_word: הָעָם
  choice: dân chúng
  rationale: Danh từ xác định chỉ đơn giản là “dân chúng”; không thêm “Y-sơ-ra-ên” vì tên ấy không có trực tiếp trong câu.
- source_word: עִם מֹשֶׁה
  choice: với Môi-se
  rationale: עִם về hình thức là “với”; kết hợp “tranh cãi với” đã tự nhiên biểu đạt sự đối đầu mà không cần chuyển thành “chống lại”.
- source_word: תְּנוּ לָנוּ מַיִם
  choice: Hãy cho chúng tôi nước
  rationale: Giữ cấu trúc mệnh lệnh trực tiếp của נתן cùng bổ ngữ gián tiếp; lời yêu cầu có sắc thái thúc ép.
- source_word: וְנִשְׁתֶּה
  choice: để uống
  rationale: Dạng cohortative sau mệnh lệnh biểu đạt mục đích hay kết quả mong muốn; tiếng Việt dùng “để uống” vừa gọn vừa tự nhiên.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: Tại sao anh em tranh cãi với tôi?
  rationale: מַה trong lời quở trách mang nghĩa thành ngữ “tại sao”. Lặp lại “tranh cãi” bảo toàn liên kết từ vựng với ריב ở đầu câu.
- source_word: מַה תְּנַסּוּן
  choice: Tại sao anh em thử
  rationale: נסה ở piel có nghĩa “thử, đem ra thử”. “Thử” giữ câu ngắn, trực diện và không làm nhẹ đi tính nghiêm trọng của việc con người thử Đức Chúa Trời.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế ngay trong chính văn bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển tên thần יְהוָה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va; Gia-vê
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. “Yahweh” giữ chức năng tên riêng, còn chú thích cho biết lối dịch truyền thống để người đọc thuộc các truyền thống khác nhau nhận ra.
- issue: Sắc thái của נסה khi đối tượng là Đức Chúa Trời
  choice: thử Yahweh
  alternative: đem Yahweh ra thử
  rationale: '“Thử” bảo toàn sự căng thẳng thần học của nguyên văn: cuộc tranh cãi với Môi-se đồng thời là hành vi thử Đức Chúa Trời. Không đổi thành “nghi ngờ” hay “thách thức”, vì các cách ấy thu hẹp hoặc gia tăng nghĩa.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Môi-se” theo cách phiên âm quen thuộc trong tiếng Việt; “anh em” diễn đạt ngôi thứ hai số nhiều trong lời quở trách mà không thô cứng. Các dấu chú thích được đặt ngay sau từ ngữ liên quan.
