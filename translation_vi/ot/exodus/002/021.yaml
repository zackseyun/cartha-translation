translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bằng lòng” bảo tồn sắc thái ý chí/chấp thuận; “gả” truyền đạt tự nhiên quan hệ hôn nhân được ngữ cảnh hàm chứa, còn chú thích giữ cách diễn đạt sát chữ của tiếng Hê-bơ-rơ.
