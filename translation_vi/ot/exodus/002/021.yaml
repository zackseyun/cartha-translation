    rationale: Động từ יָשַׁב với infinitive ở đây chỉ việc sống/cư trú với người đàn ông ấy; “sống cùng” phản ánh đầy đủ hơn phạm vi nghĩa trong mạch truyện.
  - severity: low
    issue: “Gả” đưa ý nghĩa hôn nhân vào trực tiếp hơn cách diễn đạt của tiếng Hê-bơ-rơ.
    rationale: Nguyên văn dùng động từ thông thường “trao/cho”; hôn nhân được hàm ý bởi ngữ cảnh. Cách dịch trực tiếp, kèm chú thích văn hóa, bảo toàn mức độ tường minh của nguồn hơn.
