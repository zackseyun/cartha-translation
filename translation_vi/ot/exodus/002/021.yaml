- from: Môi-se bằng lòng ở lại với người ấy[a], và ông gả con gái mình là Xíp-pô-ra cho Môi-se[b].
  to: Môi-se bằng lòng sống cùng người ấy[a], và ông trao con gái mình là Xíp-pô-ra cho Môi-se[b].
