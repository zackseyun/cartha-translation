  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi hành động và thành ngữ כֹּה וָכֹה. Tuy nhiên, “xác” không hiện diện trong tiếng Hê-bơ-rơ: hậu tố “-hắn/người ấy” của וַיִּטְמְנֵהוּ chỉ trực tiếp nói “giấu người ấy”, dù cái chết được ngữ cảnh và các câu sau xác nhận. Nên không thêm danh từ này vào bản văn chính.'
