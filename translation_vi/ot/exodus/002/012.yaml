base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: vi
  text: Ông nhìn bên này bên kia, thấy không có ai[a], liền đánh chết người Ai Cập rồi giấu người ấy trong cát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát chữ: “không có người nào”; từ Hê-bơ-rơ אִישׁ cũng có thể hiểu cụ thể là “không có người đàn ông nào”. Trong ngữ cảnh, cụm này có thể nói chung rằng không có ai ở đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: nhìn bên này bên kia
  rationale: Động từ פנה vốn có nghĩa là “quay”, nhưng khi đi với thành ngữ כֹּה וָכֹה, cụm này diễn tả việc nhìn về các hướng để quan sát xung quanh. Cách dịch này tự nhiên trong tiếng Việt và giữ được hình ảnh của nguyên văn.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: thấy không có ai
  rationale: 'אִישׁ theo nghĩa đen là “người đàn ông/người”, nhưng trong cấu trúc phủ định này có thể được dùng theo nghĩa khái quát: không có người nào hiện diện. “Không có ai” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt; nghĩa sát chữ được ghi ở chú thích.'
- source_word: וַיַּךְ
  choice: đánh chết
  rationale: נכה cơ bản có nghĩa là “đánh”, nhưng ngữ cảnh—ngay sau đó Môi-se giấu thi thể trong cát—cho thấy cú đánh gây chết người. “Đánh chết” diễn đạt rõ cả hành động lẫn kết quả mà mạch truyện hàm ý.
- source_word: הַמִּצְרִי
  choice: người Ai Cập
  rationale: Đây là danh từ chỉ dân tộc có mạo từ xác định; tiếng Việt diễn đạt tự nhiên là “người Ai Cập”.
- source_word: וַיִּטְמְנֵהוּ
  choice: giấu xác người ấy
  rationale: טמן có nghĩa là “giấu, che kín”. Vì người Ai Cập đã chết và được giấu trong cát, “giấu xác người ấy” rõ ràng, tự nhiên hơn “giấu người ấy” trong tiếng Việt, đồng thời không biến hành động này thành một nghi thức chôn cất.
- source_word: בַּחוֹל
  choice: trong cát
  rationale: חוֹל nghĩa là “cát”; giới từ בְּ chỉ vị trí nơi thi thể được che giấu.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ “ông” theo ngữ cảnh nói về Môi-se; câu văn gọn, giữ nhịp hành động liên tiếp của nguyên văn.
