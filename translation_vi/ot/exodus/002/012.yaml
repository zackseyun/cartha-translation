  terminology: “Người Ai Cập” là cách gọi chính xác. “Đánh chết” là cách diễn đạt tự nhiên cho hành động có kết quả chết người trong ngữ cảnh, không cần đưa thêm “xác” ở vế sau. Chú thích về אִישׁ giữ được khả năng nghĩa khái quát và nghĩa sát là “người đàn ông”.
  issues:
