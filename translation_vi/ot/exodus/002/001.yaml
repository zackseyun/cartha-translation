revisions:
- from: Một người thuộc nhà Lê-vi đi lấy một người con gái của Lê-vi làm vợ.[a]
  to: Một người đàn ông thuộc nhà Lê-vi đi lấy một con gái của Lê-vi làm vợ.[a]
  rationale: Bản sửa khôi phục rõ ràng nghĩa “một người nam” của אִישׁ, đồng thời giữ cách nói gia phả song song “nhà Lê-vi” / “con gái của Lê-vi” và thành ngữ hôn nhân tự nhiên “lấy ... làm vợ”. Chú thích được chỉnh văn phong mà không mở rộng hay giải quyết quá mức sắc thái gia phả của nguyên văn.
