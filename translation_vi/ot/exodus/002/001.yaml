  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: vi
  text: Một người đàn ông thuộc nhà Lê-vi đi lấy một con gái của Lê-vi làm vợ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một phụ nữ Lê-vi.” Tiếng Hê-bơ-rơ nói theo nghĩa đen là “một con gái của Lê-vi”, tức một nữ hậu duệ của Lê-vi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: đi
  rationale: Động từ הלך ở dạng wayyiqtol thường có nghĩa là “đi”; giữ lại trình tự hành động của tiếng Hê-bơ-rơ mà không thêm một trạng từ thời gian không có trong nguyên văn.
- source_word: אִישׁ
  choice: một người
  rationale: Trong ngữ cảnh này, אִישׁ chỉ một người nam chưa được nêu tên. Tiếng Việt tự nhiên cho phép dùng “một người”, còn giới tính và vai trò hôn nhân được làm rõ qua phần sau của câu.
- source_word: מִבֵּית לֵוִי
  choice: thuộc nhà Lê-vi
  rationale: בֵּית לֵוִי là cách nói mang tính gia phả, chỉ dòng tộc hay gia tộc Lê-vi. “Thuộc nhà Lê-vi” vừa sát cấu trúc nguồn vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: וַיִּקַּח
  choice: lấy ... làm vợ
  rationale: לקח có nghĩa đen là “lấy”, nhưng trong ngữ cảnh hôn nhân mang nghĩa cưới một phụ nữ. Cụm “lấy ... làm vợ” giữ được lõi từ vựng và truyền đạt rõ thành ngữ hôn nhân.
- source_word: אֶת
  choice: '[dấu hiệu tân ngữ trực tiếp, không dịch]'
  rationale: אֶת đánh dấu tân ngữ trực tiếp xác định trong tiếng Hê-bơ-rơ và không cần một từ tương ứng riêng trong tiếng Việt.
- source_word: בַּת לֵוִי
  choice: một người con gái của Lê-vi
  rationale: Cụm từ có nghĩa đen là “con gái của Lê-vi”, một cách nói gia phả chỉ nữ hậu duệ của Lê-vi. Bản dịch giữ hình ảnh nguyên văn; cách diễn đạt rõ nghĩa hơn được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cách nói gia phả “nhà Lê-vi” và “con gái của Lê-vi”, đồng thời diễn đạt וַיִּקַּח bằng thành ngữ hôn nhân tự nhiên “lấy ... làm vợ”. Không thêm từ nối thời gian như “bấy giờ” vì nguyên văn không có từ tương ứng rõ ràng.
