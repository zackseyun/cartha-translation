  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: vi
  text: Chị của đứa bé đứng ở đằng xa[a] để biết người ta sẽ làm gì với em mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ xa” hay “cách một quãng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “để xem điều gì sẽ xảy đến với em mình.” Tiếng Hê-bơ-rơ sát nghĩa là “để biết điều gì sẽ được làm với nó”; giới từ cũng có thể được hiểu là “cho nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: đứng
  rationale: Dạng Hitpael với waw liên tiếp diễn tả việc đứng hoặc giữ vị trí. “Đứng” tự nhiên trong tiếng Việt và không diễn giải quá mức sắc thái phản thân.
- source_word: אֲחֹתוֹ
  choice: chị của đứa bé
  rationale: Danh từ אחות với hậu tố ngôi ba giống đực số ít có nghĩa là “chị/em gái của nó.” Tiếng Việt phải biểu thị tương quan tuổi; ngữ cảnh về một trẻ sơ sinh khiến “chị” là cách diễn đạt tự nhiên nhất, còn “đứa bé” làm rõ đối tượng của đại từ.
- source_word: מֵרָחֹק
  choice: từ xa
  rationale: Cụm từ chỉ khoảng cách không gian. “Từ xa” ngắn gọn, tự nhiên và giữ được sắc thái của nguyên văn.
- source_word: לְדֵעָה
  choice: để xem
  rationale: Động từ nguyên mẫu ידע với giới từ ל chỉ mục đích, theo nghĩa đen là “để biết.” Trong ngữ cảnh theo dõi kết quả chưa rõ, “để xem” là lối nói tự nhiên của tiếng Việt; nghĩa sát chữ được ghi ở chú thích.
- source_word: מַה
  choice: chuyện gì
  rationale: Đại từ nghi vấn mở đầu nội dung mà người chị muốn biết. “Chuyện gì” phù hợp với cách diễn đạt tự nhiên “xảy đến” trong tiếng Việt.
- source_word: יֵּעָשֶׂה
  choice: sẽ xảy đến
  rationale: Đây là dạng Niphal chưa hoàn thành của עשה, sát nghĩa là “sẽ được làm.” Trong ngữ cảnh, “sẽ xảy đến” truyền đạt tự nhiên điều chưa biết về số phận đứa bé, trong khi chú thích bảo lưu cấu trúc bị động của tiếng Hê-bơ-rơ.
- source_word: לוֹ
  choice: với em mình
  rationale: Giới từ ל với hậu tố ngôi ba giống đực số ít có thể chỉ điều được làm “cho” hoặc “đối với” đứa bé. Trong cụm tiếng Việt “xảy đến với,” lựa chọn này diễn đạt tự nhiên sự bất định về điều đứa bé sẽ gặp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch ưu tiên cách nói tự nhiên “để xem chuyện gì sẽ xảy đến,” đồng thời dùng chú thích để bảo lưu cách diễn đạt sát chữ và sự mơ hồ của giới từ ל. “Chị” được chọn vì tiếng Việt không có từ thông dụng trung tính về tuổi tương đương “sister”; ngữ cảnh một trẻ sơ sinh hỗ trợ lựa chọn này.
