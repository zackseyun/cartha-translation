- from: Chị của đứa bé đứng từ xa[a] để xem chuyện gì sẽ xảy đến với em mình.[b]
  to: Chị của đứa bé đứng ở đằng xa[a] để biết người ta sẽ làm gì với em mình.[b]
  rationale: 'Bản sửa giữ mục đích “để biết” của לְדֵעָה và phản ánh tốt hơn thể bị động của יֵּעָשֶׂה, bằng lối bị động gián tiếp rất tự nhiên trong tiếng Việt: “người ta sẽ làm gì.” Chú thích bảo lưu phương án diễn đạt theo sự việc xảy đến và tính chưa hoàn toàn xác định của לֹו (“với/cho nó”).'
