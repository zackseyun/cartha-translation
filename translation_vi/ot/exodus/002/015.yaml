    rationale: Chính văn dùng “nghe tin về việc ấy”, nhưng chú thích lại liệt kê “nghe về việc ấy” như phương án thay thế; sự khác biệt không đủ đáng kể và không phản ánh rõ phương án sát chữ “nghe việc ấy”/nghĩa ngữ cảnh “biết được sự việc ấy.”
  - severity: low
