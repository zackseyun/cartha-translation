base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: vi
  text: Khi Pha-ra-ôn nghe được việc ấy[a], ông tìm cách giết Môi-se. Nhưng Môi-se chạy trốn khỏi Pha-ra-ôn, ở tại xứ Ma-đi-an[b], rồi ngồi xuống bên giếng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nghe tin về việc ấy” hoặc “biết được sự việc ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ dùng cùng một động từ hai lần: trước hết với nghĩa “ở” tại Ma-đi-an, rồi với nghĩa cụ thể là “ngồi” bên giếng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe tin
  rationale: Động từ שׁמע có nghĩa cơ bản là “nghe”; trong ngữ cảnh này, nó chỉ việc Pha-ra-ôn biết được sự việc qua tin báo. “Nghe tin” tự nhiên trong tiếng Việt mà không giải thích quá mức.
- source_word: הַדָּבָר הַזֶּה
  choice: việc ấy
  rationale: דבר ở đây chỉ sự việc vừa được kể, tức việc Môi-se giết người Ai Cập. “Việc ấy” gần nguồn và tự nhiên hơn cách dịch từng chữ “điều này”.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: tìm cách giết
  rationale: בקש kết hợp với động từ nguyên mẫu diễn tả việc tìm cách hoặc mưu toan thực hiện hành động; cách dịch này giữ cả ý định lẫn nỗ lực.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: trốn khỏi
  rationale: Cụm này diễn tả việc chạy trốn khỏi sự hiện diện hay quyền lực của một người. “Trốn khỏi Pha-ra-ôn” là cách nói tự nhiên trong tiếng Việt.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: đến ở tại xứ Ma-đi-an
  rationale: Lần dùng đầu của ישׁב mang nghĩa cư trú hay lưu lại. “Đến ở” tránh hàm ý định cư vĩnh viễn nhưng vẫn cho thấy Môi-se ở lại vùng đất ấy.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: rồi ngồi xuống bên giếng
  rationale: Lần dùng thứ hai của ישׁב mang nghĩa cụ thể là ngồi. עַל trong ngữ cảnh này được diễn đạt tự nhiên là “bên”; “xuống” thể hiện việc bắt đầu ngồi.
- source_word: הַבְּאֵר
  choice: giếng
  rationale: Tiếng Việt thường không biểu thị mạo từ xác định; “bên giếng” là cách diễn đạt tự nhiên và không làm thay đổi điểm quy chiếu trong câu chuyện.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm quen thuộc trong tiếng Việt cho tước hiệu hoàng gia Ai Cập.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: מִדְיָן
  choice: Ma-đi-an
  rationale: Dạng phiên âm tiếng Việt rõ ràng cho địa danh Midian.
