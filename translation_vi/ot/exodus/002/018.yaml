- from: 'Khi họ trở về với cha mình là Rê-u-ên, ông hỏi: “Sao hôm nay các con về sớm thế?”[a]'
  to: 'Khi họ về đến chỗ cha mình là Rê-u-ên, ông nói: “Sao hôm nay các con về nhanh thế?”[a]'
  rationale: Điều chỉnh “về sớm” thành “về nhanh” để bảo toàn ý tốc độ của מהר, làm câu dẫn tự nhiên hơn, và sửa chú thích để phản ánh chính xác cấu trúc “vội ... đến” của tiếng Hê-bơ-rơ. Không thay đổi ý nghĩa hay thêm diễn giải thần học.
