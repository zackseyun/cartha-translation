  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: vi
  text: 'Khi họ về đến chỗ cha mình là Rê-u-ên, ông nói: “Sao hôm nay các con về nhanh thế?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Sao hôm nay các con vội đến thế?” Tiếng Hê-bơ-rơ dùng động từ “vội, làm nhanh” với động từ “đến”; “về” trong bản văn chính theo ngữ cảnh các cô trở lại với cha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: Khi họ trở về
  rationale: Động từ בוא ở thể wayyiqtol, ngôi thứ ba số nhiều giống cái, chỉ các con gái. Trong ngữ cảnh họ từ giếng về nhà, “trở về” diễn đạt tự nhiên hướng chuyển động hàm chứa.
- source_word: אֶל
  choice: với
  rationale: Giới từ chỉ hướng אֶל đi cùng động từ “trở về”; tiếng Việt tự nhiên nói “trở về với cha”.
- source_word: רְעוּאֵל
  choice: Rê-u-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ רְעוּאֵל theo cách đọc gần nguyên ngữ và quy ước trình bày tên riêng bằng tiếng Việt.
- source_word: אֲבִיהֶן
  choice: cha mình
  rationale: Danh từ “cha” kèm hậu tố ngôi thứ ba số nhiều giống cái. “Cha mình” tự nhiên trong câu tiếng Việt và quy chiếu rõ về các cô gái.
- source_word: וַיֹּאמֶר
  choice: ông hỏi
  rationale: אמר có nghĩa cơ bản là “nói”, nhưng vì lời trực tiếp là một câu hỏi, “ông hỏi” là cách diễn đạt tự nhiên và không thay đổi nội dung.
- source_word: מַדּוּעַ
  choice: Sao
  rationale: Từ nghi vấn hỏi nguyên nhân; “sao” phù hợp với lời nói trực tiếp tự nhiên giữa người cha và các con, đồng thời vẫn trang nhã.
- source_word: מִהַרְתֶּן בֹּא
  choice: các con về sớm thế
  rationale: Cụm động từ “vội/nhanh” kết hợp với động từ nguyên mẫu “đến”. Trong hoàn cảnh các cô gái về nhà sớm hơn thường lệ, “về sớm thế” chuyển tải tự nhiên ý đến nhanh; chú thích giữ lại cấu trúc sát chữ.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Cụm danh từ xác định “ngày này” được dùng theo nghĩa thành ngữ là “hôm nay”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, tự nhiên và trang trọng vừa phải. Cách xưng hô “ông—các con” làm rõ quan hệ cha con mà không thêm sắc thái thần học. Dấu chú thích [a] được đặt ngay sau câu có liên quan.
