  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: vi
  text: 'Ông nói với các con gái mình: “Thế người ấy đâu rồi? Tại sao các con lại bỏ người ấy? Hãy mời người ấy đến dùng bữa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Thế người ấy đâu rồi?
  rationale: Giữ câu hỏi trực tiếp và sắc thái tiếp nối của וְ; đại từ số ít giống đực chỉ người đàn ông vừa được nhắc đến.
- source_word: לָמָּה זֶּה
  choice: Tại sao
  rationale: Cụm hỏi nhấn mạnh nguyên do; trong tiếng Việt hiện đại, “Tại sao” truyền đạt tự nhiên mà không thêm ý.
- source_word: עֲזַבְתֶּן
  choice: các con lại bỏ người ấy mà về
  rationale: Động từ nghĩa là bỏ lại/rời khỏi; thêm “mà về” làm rõ theo ngữ cảnh các con gái đã trở về, nhưng không hàm ý ruồng bỏ.
- source_word: קִרְאֶן לוֹ
  choice: Hãy mời người ấy đến
  rationale: קרא ל trong ngữ cảnh này là gọi/mời người ấy đến; “mời” phù hợp phép hiếu khách và tự nhiên trong tiếng Việt.
- source_word: וְיֹאכַל לָחֶם
  choice: đến dùng bữa
  rationale: “Ăn bánh” là thành ngữ Hê-bơ-rơ chỉ việc ăn uống/dùng bữa nói chung; dịch theo nghĩa chức năng, tránh khiến độc giả hiểu chỉ ăn bánh.
theological_decisions: []
translation_notes:
  register: Văn phong đối thoại hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” theo mạch kể và “các con” trong lời người cha nói với các con gái; không thêm danh tính của người nói vì câu riêng lẻ không nêu tên.
