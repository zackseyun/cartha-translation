  source_fidelity: Bản dịch truyền đạt đúng mạch đối thoại, câu hỏi về người đàn ông, lời trách vì đã bỏ ông lại, và lời mời ông dùng bữa. Tuy nhiên, “mà về” thêm một hành động/đích đến không được nêu trong câu Hê-bơ-rơ; dù phù hợp ngữ cảnh, chi tiết này nên được lược bỏ để giữ sát nguồn.
