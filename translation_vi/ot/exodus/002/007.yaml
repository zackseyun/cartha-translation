  revision_rationale: Sửa “chị” thành “người chị em gái” để không xác định tuổi của người chị/em gái, bỏ tước hiệu suy diễn “công chúa”, và thể hiện cả hai lần “cho bà” tương ứng với לָךְ. Các thay đổi không làm thay đổi nội dung lời đề nghị.
