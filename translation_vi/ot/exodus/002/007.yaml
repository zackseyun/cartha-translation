revisions:
- from: 'Bấy giờ, chị của đứa trẻ nói với con gái Pha-ra-ôn: “Tôi có nên đi gọi cho công chúa một người phụ nữ đang cho con bú[a] trong số những phụ nữ Hê-bơ-rơ, để người ấy cho đứa trẻ bú không?”'
  to: 'Bấy giờ, người chị em gái của đứa trẻ nói với con gái Pha-ra-ôn: “Tôi có thể đi gọi một phụ nữ đang cho con bú trong số các phụ nữ Hê-bơ-rơ đến cho bà, để người ấy cho đứa trẻ bú cho bà không?”'
  rationale: Sửa “chị” thành “người chị em gái” để không xác định tuổi của người chị/em gái, bỏ tước hiệu suy diễn “công chúa”, và thể hiện cả hai lần “cho bà” tương ứng với לָךְ. Các thay đổi không làm thay đổi nội dung lời đề nghị.
