base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: vi
  text: 'Bấy giờ, người chị em gái của đứa trẻ nói với con gái Pha-ra-ôn: “Tôi có thể đi gọi một phụ nữ đang cho con bú trong số các phụ nữ Hê-bơ-rơ đến cho bà, để người ấy cho đứa trẻ bú cho bà không?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw liên tiếp đưa trình thuật tiến sang hành động kế tiếp; “Bấy giờ” diễn đạt tự nhiên trình tự này trong tiếng Việt.
- source_word: אֲחֹתוֹ
  choice: chị của đứa trẻ
  rationale: Hậu tố giống đực số ít chỉ về em bé trong văn cảnh. Tiếng Việt phải chọn “chị” hoặc “em gái”; diễn tiến câu chuyện cho thấy cô gái có đủ khả năng quan sát và chủ động đề nghị, nên “chị” là cách hiểu tự nhiên, đồng thời nêu rõ đối tượng để tránh đại từ sở hữu mơ hồ.
- source_word: בַּת פַּרְעֹה
  choice: con gái Pha-ra-ôn
  rationale: Chuyển ngữ trực tiếp cấu trúc sở hữu, giữ cách gọi nhân vật theo nguyên bản.
- source_word: הַאֵלֵךְ
  choice: Tôi có nên đi
  rationale: Tiểu từ nghi vấn cùng động từ ngôi thứ nhất diễn tả một lời đề nghị hoặc xin phép; cách dịch này giữ hình thức câu hỏi và sắc thái lịch sự.
- source_word: וְקָרָאתִי
  choice: gọi
  rationale: קרא ở đây mang nghĩa gọi hoặc mời một người đến; “gọi” vừa gần nguyên ngữ vừa tự nhiên.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: một người phụ nữ đang cho con bú
  rationale: Cụm từ chỉ một phụ nữ có khả năng cho trẻ bú. Cách diễn đạt này sáng nghĩa trong tiếng Việt hiện đại và không mặc nhiên biến vai trò ấy thành một nghề.
- source_word: מִן הָעִבְרִיֹּת
  choice: trong số những phụ nữ Hê-bơ-rơ
  rationale: Giới từ מִן chỉ việc chọn một người từ trong một nhóm.
- source_word: וְתֵינִק
  choice: để người ấy cho ... bú
  rationale: Thể Hiphil của ינק có nghĩa làm cho bú, tức cho trẻ bú. Trong mạch lời đề nghị, “để” diễn đạt tự nhiên quan hệ mục đích.
- source_word: לָךְ ... לָךְ
  choice: cho công chúa ... cho đứa trẻ bú
  rationale: Lần xuất hiện thứ nhất được diễn đạt bằng “cho công chúa” để thể hiện người hưởng lợi và phù hợp cách xưng hô; lần thứ hai không lặp máy móc vì tiếng Việt đã hàm ý đứa trẻ được chăm sóc theo yêu cầu của công chúa.
- source_word: הַיָּלֶד
  choice: đứa trẻ
  rationale: יֶלֶד trong văn cảnh này chỉ em bé; “đứa trẻ” giữ cách gọi chung của nguyên bản mà không thêm chi tiết.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Pha-ra-ôn” được phiên âm theo lối quen thuộc trong tiếng Việt. Trong lời thoại, “công chúa” được dùng như cách xưng gọi tự nhiên đối với con gái Pha-ra-ôn, nhưng phần trần thuật vẫn giữ nguyên danh xưng “con gái Pha-ra-ôn”.
