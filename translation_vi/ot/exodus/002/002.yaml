  to: Người phụ nữ ấy mang thai và sinh một con trai. Khi thấy đứa trẻ tốt đẹp[a], bà giấu con trong ba tháng.
  rationale: Bỏ “thật” để không thêm sắc thái nhấn mạnh ngoài nguyên văn; thay “người đàn bà” bằng “người phụ nữ ấy” cho tự nhiên và trung tính hơn. Giữ “tốt đẹp” trong văn bản chính để phản ánh phạm vi nghĩa của טוֹב, và giữ phương án “đẹp đẽ” trong chú thích.
