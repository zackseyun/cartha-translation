  terminology: “Tốt đẹp” có thể chuyển tải nghĩa rộng của טוֹב trong ngữ cảnh mà không buộc nghĩa này chỉ là vẻ đẹp hình thức. Chú thích duy trì phương án “đẹp đẽ” và nêu nghĩa từ vựng cơ bản là “tốt”.
