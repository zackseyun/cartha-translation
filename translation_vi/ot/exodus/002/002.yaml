base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: vi
  text: Người phụ nữ ấy mang thai và sinh một con trai. Khi thấy đứa trẻ tốt đẹp[a], bà giấu con trong ba tháng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đẹp đẽ”. Từ Hê-bơ-rơ là “tốt”, nhưng trong ngữ cảnh cũng có thể mang nghĩa đẹp đẽ hoặc đáng ưa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: mang thai
  rationale: Động từ הרה chỉ việc thụ thai hoặc mang thai. “Mang thai” tự nhiên trong tiếng Việt hiện đại và phù hợp với chuỗi sự việc của câu.
- source_word: הָאִשָּׁה
  choice: người đàn bà
  rationale: Bản Hê-bơ-rơ nói rõ “người đàn bà”, không nói “vợ ông”; cách dịch này giữ sát cách gọi trong câu mà không đưa quan hệ từ ngữ cảnh vào.
- source_word: וַתֵּלֶד בֵּן
  choice: sinh một con trai
  rationale: Đây là thành ngữ thông thường chỉ việc sinh con; cách diễn đạt này tự nhiên, rõ ràng trong tiếng Việt.
- source_word: וַתֵּרֶא אֹתוֹ כִּי
  choice: Khi thấy đứa trẻ thật...
  rationale: Cấu trúc tân ngữ kèm mệnh đề כִּי diễn tả sự nhận thấy của người mẹ. Dùng “Khi” thể hiện tự nhiên dòng kể chuyện.
- source_word: טוֹב
  choice: tốt đẹp
  rationale: טוֹב có nghĩa rộng là tốt, đẹp đẽ, đáng ưa. “Tốt đẹp” giữ được nghĩa căn bản “tốt” và sắc thái đứa trẻ đẹp đẽ, đáng yêu, đồng thời không thu hẹp hoàn toàn thành vẻ đẹp ngoại hình.
- source_word: וַתִּצְפְּנֵהוּ
  choice: bà giấu con
  rationale: צפן nghĩa là giấu hoặc che giấu. “Giấu con” ngắn gọn, tự nhiên và có đại từ xưng hô phù hợp tiếng Việt.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: trong ba tháng
  rationale: יֶרַח là tháng, vốn gắn với tháng âm lịch, nhưng trong lời kể thông thường “ba tháng” truyền đạt chính xác mà không cần kỹ thuật hóa.
theological_decisions:
- issue: Cách mô tả hài nhi bằng טוֹב
  choice: tốt đẹp
  alternative: đẹp đẽ
  rationale: “Tốt đẹp” giữ nghĩa cơ bản của טוֹב và khả năng gợi lại ngôn ngữ sáng tạo trong Sáng Thế Ký, trong khi “đẹp đẽ” là một cách hiểu hợp lý nhưng cụ thể hơn về ngoại hình. Chú thích bảo tồn cách hiểu thay thế này.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Người đàn bà” giữ sát danh ngữ Hê-bơ-rơ; sau đó dùng “bà” và “con” để câu tiếng Việt tự nhiên. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
