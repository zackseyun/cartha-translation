  source_fidelity: 'Bản dịch truyền đạt đúng các ý chính của tiếng Hê-bơ-rơ: người mẹ không còn có thể che giấu đứa trẻ, lấy một vật chứa bằng papyrus cho nó, phủ hai loại chất chống thấm, đặt đứa trẻ vào đó, rồi đặt giữa đám sậy bên bờ sông Nin. Cần chỉnh nhẹ để đại từ chỉ vật chứa không mơ hồ và để chú thích không gọi תֵּבָה là “tàu” như một nghĩa trực tiếp, vì từ này trước hết chỉ vật chứa/hòm; liên hệ với tàu Nô-ê nên được nêu là tiếng vọng từ vựng.'
  naturalness: Văn phong nhìn chung tự nhiên, hiện đại. “Trét nhựa đường và hắc ín lên đó” có thể hiểu được, nhưng “đó” hơi mơ hồ sau cụm danh từ dài; lặp lại “chiếc giỏ” rõ hơn mà vẫn tự nhiên. “Không thể giấu con lâu hơn nữa” là cách nói chấp nhận được trong ngữ cảnh.
  terminology: “Giỏ bằng cói giấy,” “nhựa đường,” “hắc ín,” “đám sậy,” và “sông Nin” phù hợp. Chú thích nên dùng “hòm” cho lựa chọn từ vựng thay vì “tàu”, đồng thời giải thích rằng cùng từ ấy được dùng cho tàu của Nô-ê; như vậy vừa giữ tiếng vọng văn chương vừa không áp đặt nghĩa hàng hải vào vật chứa của em bé.
  issues:
