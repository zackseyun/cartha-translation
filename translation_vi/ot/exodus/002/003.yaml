    issue: Chú thích dịch lựa chọn thay thế là “một chiếc tàu bằng cói giấy”.
    rationale: תֵּבָה là vật chứa/hòm; trong Xuất Ai Cập 2, ngữ cảnh là một vật nhỏ đựng trẻ sơ sinh. Từ này quả thật cũng được dùng cho tàu của Nô-ê, nhưng “tàu” không phải là nghĩa thay thế trực tiếp an toàn nhất ở đây. Nên gọi là “hòm” và nêu liên hệ với tàu Nô-ê trong phần giải thích.
  - severity: low
    issue: Đại từ “đó” trong “trét nhựa đường và hắc ín lên đó” có thể mơ hồ.
    rationale: Nguyên văn nói rõ bà phủ vật chứa ấy. Lặp lại “chiếc giỏ” làm câu sáng rõ hơn trong tiếng Việt mà không thêm hoặc bớt nghĩa.
