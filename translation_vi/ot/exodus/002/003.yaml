base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: vi
  text: Nhưng khi không thể giấu con lâu hơn nữa, bà lấy cho con một chiếc giỏ bằng cói giấy[a], trét nhựa đường và hắc ín lên chiếc giỏ. Rồi bà đặt đứa trẻ vào đó và để chiếc giỏ giữa đám sậy bên bờ sông Nin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một chiếc hòm bằng cói giấy”. Từ Hê-bơ-rơ tê-va cũng được dùng cho tàu của Nô-ê trong sách Sáng Thế, tạo nên một tiếng vọng văn chương về sự giải cứu qua nước.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: giấu con
  rationale: Động từ Hiphil của צפן với hậu tố ngôi ba giống đực số ít có nghĩa là giấu hoặc che giấu người ấy. Trong mạch văn, tiếng Việt tự nhiên dùng “con” theo góc nhìn của người mẹ.
- source_word: תֵּבַת
  choice: chiếc giỏ
  rationale: תֵּבָה chỉ một vật chứa; ở đây là vật nhỏ làm cho em bé. “Chiếc giỏ” rõ nghĩa trong ngữ cảnh, còn mối liên hệ từ vựng với con tàu của Nô-ê được giữ trong chú thích.
- source_word: גֹּמֶא
  choice: cói giấy
  rationale: גֹּמֶא chỉ cây papyrus. “Cói giấy” là tên gọi tiếng Việt chính xác, dễ hiểu hơn việc phiên âm “papyrus”.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: trét nhựa đường
  rationale: Động từ mang nghĩa trét hoặc phủ, còn חֵמָר là bitum/nhựa đường; cách diễn đạt này cụ thể và tự nhiên.
- source_word: וּבַזָּפֶת
  choice: và hắc ín
  rationale: זֶפֶת là chất trám chống thấm dạng hắc ín hoặc nhựa chai. “Hắc ín” giúp phân biệt với חֵמָר đứng trước.
- source_word: הַיֶּלֶד
  choice: đứa trẻ
  rationale: יֶלֶד có nghĩa rộng là trẻ em hoặc con trai; “đứa trẻ” trung thành với mức độ xác định của từ Hê-bơ-rơ mà không nhấn thêm tuổi.
- source_word: בַּסּוּף
  choice: giữa đám sậy
  rationale: סוּף chỉ sậy hoặc lau mọc ven nước; “giữa đám sậy” diễn đạt tự nhiên việc đặt vật vào trong thảm thực vật.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: bên bờ sông Nin
  rationale: Trong bối cảnh Xuất Ai Cập, יְאֹר thường chỉ sông Nin. “Bên bờ” chuyển tải vị trí sát mép sông bằng tiếng Việt tự nhiên.
- source_word: לֹא יָכְלָה עוֹד
  choice: không thể ... lâu hơn nữa
  rationale: Cụm này diễn tả việc đã đến giới hạn, không còn có thể tiếp tục hành động; cách dịch giữ ý thời gian và khả năng.
- source_word: לּוֹ
  choice: cho con
  rationale: Giữ rõ đại từ chỉ lợi ích trong nguyên văn, đồng thời dùng cách xưng gọi tự nhiên theo quan hệ mẹ-con.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà” để nối chủ thể nữ từ ngữ cảnh trước, và “con” theo quan hệ mẹ-con. Giữ riêng hai vật liệu chống thấm חֵמָר và זֶפֶת bằng “nhựa đường” và “hắc ín”.
