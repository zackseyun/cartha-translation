  source_fidelity: Bản dịch truyền đạt đúng trình tự tự sự, quan hệ thời gian, hai người đàn ông Hê-bơ-rơ đang xung đột, và lời chất vấn của Môi-se. Tuy nhiên, “người đồng bào” thu hẹp רֵעֶךָ thành quan hệ đồng dân tộc; dù ngữ cảnh cho biết cả hai là người Hê-bơ-rơ, bản thân từ רֵעַ có nghĩa rộng hơn là người cùng phe/cùng loại, bạn hữu hay người lân cận.
