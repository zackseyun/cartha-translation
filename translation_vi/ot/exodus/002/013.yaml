language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וְ/הִנֵּ֛ה שְׁנֵֽי אֲנָשִׁ֥ים עִבְרִ֖ים נִצִּ֑ים וַ/יֹּ֨אמֶר֙ לָֽ/רָשָׁ֔ע לָ֥/מָּה תַכֶּ֖ה רֵעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: vi
  text: 'Ngày hôm sau, ông đi ra, và kìa, hai người đàn ông Hê-bơ-rơ đang đánh nhau. Ông nói với kẻ có lỗi[a]: “Tại sao anh lại đánh người đồng loại của mình[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “kẻ gian ác” hoặc “kẻ làm điều sai trái.”
    reason: lexical_alternative
  - marker: b
    text: Hay “người bạn của mình” hoặc “người lân cận của mình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ông đi ra
  rationale: Động từ Qal wayyiqtol của יצא tiếp nối mạch kể chuyện; chủ ngữ là Môi-se, được xác định từ văn cảnh trước.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Ngày hôm sau
  rationale: Nghĩa sát là “vào ngày thứ hai”; trong mạch kể tiếng Việt, “ngày hôm sau” truyền đạt tự nhiên đúng quan hệ thời gian.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ sắc thái trình bày sống động và sự chú ý bất ngờ do הִנֵּה tạo ra, thay vì lược bỏ hoàn toàn.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: hai người đàn ông Hê-bơ-rơ
  rationale: Giữ cả số lượng, danh từ chỉ nam giới và căn tính Hê-bơ-rơ được nêu rõ trong nguyên văn.
- source_word: נִצִּים
  choice: đang đánh nhau
  rationale: Phân từ Niphal diễn tả cuộc xung đột đang diễn ra; lời hỏi kế tiếp cho thấy có hành vi đánh người, nên “đánh nhau” phù hợp hơn cách nói chỉ về tranh cãi bằng lời.
- source_word: לָרָשָׁע
  choice: kẻ có lỗi
  rationale: Trong vụ xung đột cụ thể này, רָשָׁע có thể chỉ người sai trái hoặc có lỗi. Cách dịch này giữ phán đoán đạo đức theo tình huống mà không nhất thiết quy kết toàn bộ phẩm cách của người ấy.
- source_word: לָמָּה תַכֶּה
  choice: Tại sao anh lại đánh
  rationale: Dạng vị hoàn sau לָמָּה trong lời nói trực tiếp phù hợp với hành động đang diễn ra; từ “lại” ở đây tạo sắc thái chất vấn tự nhiên trong tiếng Việt, không mang nghĩa hành động đã lặp lại.
- source_word: רֵעֶךָ
  choice: người đồng bào của mình
  rationale: רֵעַ có thể chỉ người cùng cộng đồng, người bạn hoặc người lân cận. Vì cả hai người được xác định là người Hê-bơ-rơ, “đồng bào” diễn đạt tự nhiên quan hệ giữa họ trong ngữ cảnh, đồng thời chú thích bảo lưu các khả năng từ vựng rộng hơn.
theological_decisions:
- issue: Mức độ kết án hàm chứa trong לָרָשָׁע
  choice: kẻ có lỗi
  alternative: kẻ gian ác; kẻ làm điều sai trái
  rationale: Nguyên ngữ cho phép cả nghĩa phẩm chất “gian ác” lẫn nghĩa pháp lý/tình huống “có lỗi, sai trái”. Ngữ cảnh là một vụ xô xát cụ thể, nên bản chính chọn nghĩa tình huống và ghi nhận nghĩa mạnh hơn trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Và kìa” được giữ để phản ánh lực diễn ngôn của הִנֵּה; các đại từ “ông/anh” phù hợp với lời kể và lời chất vấn giữa những người đàn ông. Vị trí ký hiệu chú thích được đặt ngay sau từ ngữ mà chú thích giải thích.
