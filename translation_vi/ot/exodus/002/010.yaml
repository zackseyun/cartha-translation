  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: vi
  text: 'Khi đứa trẻ lớn lên, mẹ nó đem nó đến cho con gái Pha-ra-ôn; nó trở thành con trai của nàng.[a] Nàng đặt tên nó là Môi-se,[b] vì nàng nói: “Ta đã kéo nó ra khỏi nước.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nó được nàng coi như con trai.”'
    reason: lexical_alternative
  - marker: b
    text: Tên Môi-se nghe gần giống với tiếng Hê-bơ-rơ có nghĩa là “Ta đã kéo nó ra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: lớn lên
  rationale: Động từ גדל ở đây nói đến việc đứa trẻ lớn dần, không phải trở nên vĩ đại hay có địa vị cao.
- source_word: הַיֶּלֶד
  choice: đứa trẻ
  rationale: יֶלֶד có thể chỉ đứa trẻ hoặc bé trai; “đứa trẻ” giữ được nghĩa rộng và phù hợp với bối cảnh vừa qua thời thơ ấu.
- source_word: וַתְּבִאֵהוּ
  choice: mẹ nó đưa nó đến
  rationale: Thể Hiphil của בוא thường có nghĩa là “đưa/đem đến.” Chủ thể được xác định từ ngữ cảnh trước là mẹ của đứa trẻ; nêu rõ “mẹ nó” giúp tiếng Việt tránh nhầm chủ thể.
- source_word: לְבַת פַּרְעֹה
  choice: cho con gái Pha-ra-ôn
  rationale: Diễn đạt tự nhiên quan hệ sở hữu trong tiếng Việt và giữ nguyên tước hiệu Pha-ra-ôn.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: nó trở thành con trai của nàng
  rationale: Thành ngữ diễn tả địa vị làm con thực sự trong câu chuyện, nhưng không nói rõ thủ tục pháp lý; bản dịch giữ cách nói mạnh của nguyên văn.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Nàng đặt tên nó là
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho công thức đặt tên của tiếng Hê-bơ-rơ.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Liên từ giới thiệu lời giải thích về việc đặt tên.
- source_word: מִן הַמַּיִם
  choice: ra khỏi nước
  rationale: Diễn đạt tự nhiên hướng chuyển động từ trong nước ra ngoài trong bối cảnh cứu đứa trẻ.
- source_word: מְשִׁיתִהוּ
  choice: Ta đã kéo nó ra
  rationale: Động từ משה có nghĩa là kéo hoặc rút ra. “Kéo ra” gần hình thức của nguyên văn hơn “vớt,” đồng thời lời chú thích bảo tồn lối chơi chữ với tên Môi-se.
theological_decisions:
- issue: Bản chất mối quan hệ giữa Môi-se và con gái Pha-ra-ôn trong וַיְהִי לָהּ לְבֵן
  choice: Môi-se trở thành con trai của con gái Pha-ra-ôn, hàm ý địa vị làm con nuôi.
  alternative: Môi-se chỉ được nàng coi như con trai, không nhất thiết có việc nhận làm con chính thức.
  rationale: Cách nói Hê-bơ-rơ xác lập một quan hệ mẹ-con thực sự trong mạch truyện, nhưng không mô tả thủ tục pháp lý. Vì vậy bản chính giữ “trở thành con trai,” còn chú thích ghi nhận cách hiểu nhẹ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “mẹ nó” để làm rõ chủ thể vốn được kế thừa từ câu trước, “nàng” cho con gái Pha-ra-ôn, và “Ta” trong lời nói của nhân vật hoàng gia. Dấu chú thích [a] được đặt tại mệnh đề về địa vị làm con, đúng với nội dung chú thích; [b] được đặt ngay sau tên để giải thích lối chơi chữ Hê-bơ-rơ.
