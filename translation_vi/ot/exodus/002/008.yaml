  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: vi
  text: 'Công chúa Pha-ra-ôn bảo cô: “Đi đi.” Cô gái trẻ liền đi gọi mẹ của đứa bé đến.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: công chúa Pha-ra-ôn
  rationale: Cụm sở thuộc có nghĩa đen là “con gái của Pha-ra-ôn”. Trong tiếng Việt, “công chúa Pha-ra-ôn” diễn đạt tự nhiên, rõ địa vị và đúng quan hệ, không hàm ý tên riêng.
- source_word: לֵכִי
  choice: Đi đi
  rationale: Mệnh lệnh Qal giống cái số ít, ngắn gọn và trực tiếp. Cách nói “Đi đi” tự nhiên trong lời thoại tiếng Việt và không thêm nội dung.
- source_word: הָעַלְמָה
  choice: cô gái trẻ
  rationale: עַלְמָה chỉ một thiếu nữ hoặc phụ nữ trẻ. “Cô gái trẻ” giữ được phạm vi nghĩa, hợp văn cảnh và tránh sắc thái cổ của “thiếu nữ”.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: liền đi gọi mẹ của đứa bé đến
  rationale: קרא với tân ngữ ở đây mang nghĩa gọi hoặc mời đến. Thêm “đến” làm rõ ý triệu gọi vốn có và tạo câu tiếng Việt tự nhiên; “liền” thể hiện diễn tiến liên tiếp của wayyiqtol.
- source_word: הַיָּלֶד
  choice: đứa bé
  rationale: יֶלֶד có thể là đứa trẻ hoặc bé trai; trong văn cảnh Môi-se còn là trẻ sơ sinh, “đứa bé” tự nhiên mà không nhấn thêm giới tính trong chính cụm từ này.
