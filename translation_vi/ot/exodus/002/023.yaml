  text: וַ/יְהִי֩ בַ/יָּמִ֨ים הָֽ/רַבִּ֜ים הָ/הֵ֗ם וַ/יָּ֨מָת֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יֵּאָנְח֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/עֲבֹדָ֖ה וַ/יִּזְעָ֑קוּ וַ/תַּ֧עַל שַׁוְעָתָ֛/ם אֶל הָ/אֱלֹהִ֖ים מִן הָ/עֲבֹדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: vi
  text: Trong quãng thời gian dài ấy,[a] vua Ai Cập qua đời. Con cháu Y-sơ-ra-ên rên xiết vì cảnh nô dịch và kêu cứu; tiếng kêu cứu của họ vì cảnh nô dịch đã vọng lên Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau một thời gian dài.” Cụm từ Hê-bơ-rơ theo sát mặt chữ là “trong những ngày dài ấy,” chỉ một khoảng thời gian kéo dài nhưng, theo tiến trình kể chuyện, cũng có thể được hiểu là “sau một thời gian dài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיָּמִים הָרַבִּים הָהֵם
  choice: Trong quãng thời gian dài ấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nghĩa một thời kỳ kéo dài; וַיְהִי đảm nhiệm chức năng dẫn truyện và không cần dịch máy móc thành một mệnh đề riêng.
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: vua Ai Cập qua đời
  rationale: Truyền đạt trực tiếp sự kiện; “qua đời” là cách nói trang trọng, tự nhiên mà không làm thay đổi nghĩa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Con cháu Y-sơ-ra-ên
  rationale: Giữ hình ảnh huyết thống của thành ngữ Hê-bơ-rơ, đồng thời trong tiếng Việt có thể chỉ chung dân tộc phát xuất từ tổ phụ Y-sơ-ra-ên.
- source_word: וַיֵּאָנְחוּ
  choice: rên xiết
  rationale: Diễn tả tiếng rên phát ra do đau khổ và áp bức, phù hợp sắc thái mạnh của động từ.
- source_word: מִן הָעֲבֹדָה
  choice: vì cảnh nô dịch
  rationale: Trong ngữ cảnh này, עֲבֹדָה là lao dịch cưỡng bức trong tình trạng nô lệ; “cảnh nô dịch” vừa nêu tính áp bức vừa dùng được tự nhiên ở cả hai lần xuất hiện.
- source_word: וַיִּזְעָקוּ
  choice: kêu than
  rationale: Giữ động từ không có tân ngữ rõ trong nguyên văn và diễn tả tiếng kêu phát sinh từ cảnh khốn cùng.
- source_word: וַתַּעַל שַׁוְעָתָם אֶל הָאֱלֹהִים
  choice: tiếng họ kêu cứu ... đã thấu đến Đức Chúa Trời
  rationale: “Kêu cứu” phản ánh שַׁוְעָה là lời kêu xin trợ giúp; “thấu đến” là thành ngữ Việt tự nhiên cho ẩn dụ tiếng kêu đi lên đến Đức Chúa Trời.
theological_decisions:
- issue: Nghĩa của עֲבֹדָה trong hoàn cảnh dân Y-sơ-ra-ên bị áp bức
  choice: cảnh nô dịch
  alternative: công việc; lao động; sự phục dịch
  rationale: Ngữ cảnh nói đến lao dịch cưỡng bức dưới quyền Ai Cập. Lựa chọn này không làm nhẹ mức độ áp bức và cũng không thêm một khẳng định thần học ngoài văn bản.
- issue: Phạm vi chỉ định của בְּנֵי יִשְׂרָאֵל
  choice: Con cháu Y-sơ-ra-ên
  alternative: người Y-sơ-ra-ên; các con trai của Y-sơ-ra-ên
  rationale: Cụm từ là tên gọi tập thể của dân tộc, không chỉ riêng nam giới; “con cháu” bảo tồn quan hệ dòng dõi mà không gây hiểu lầm về giới tính.
- issue: Đích đến của tiếng kêu
  choice: đã thấu đến Đức Chúa Trời
  alternative: đã vọng lên Đức Chúa Trời
  rationale: Bảo tồn ý tiếng kêu đến với Đức Chúa Trời và sắc thái đi lên của nguyên văn ở mức thành ngữ, nhưng không nói thêm rằng dân chúng đã trực tiếp cầu nguyện với Ngài, điều câu này không xác định rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại “cảnh nô dịch” để giữ sự nhấn mạnh của nguyên văn. Dùng “Y-sơ-ra-ên” và “Đức Chúa Trời” theo lối gọi Kinh Thánh quen thuộc trong tiếng Việt; dấu chân chú [a] xuất hiện ngay sau mệnh đề thời gian-sự kiện mà chú thích giải thích.
