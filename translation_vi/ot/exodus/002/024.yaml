id: EXO.2.24
reference: Exodus 2:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶת נַאֲקָתָ֑/ם וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם אֶת יִצְחָ֥ק וְ/אֶֽת יַעֲקֹֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: vi
  text: Đức Chúa Trời nghe tiếng rên siết của họ[a], và Đức Chúa Trời nhớ đến giao ước của Ngài với Áp-ra-ham, với Y-sác và với Gia-cốp.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tiếng rên của họ.” Danh từ Hê-bơ-rơ có thể chỉ tiếng kêu hoặc tiếng rên đau đớn dưới cảnh áp bức.'
    reason: lexical_alternative
  - marker: b
    text: “Nhớ đến” là ngôn ngữ giao ước; cách nói này không hàm ý Đức Chúa Trời đã quên, nhưng cho thấy Ngài hướng đến việc trung tín thực hiện những điều gắn với giao ước của Ngài.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe
  rationale: Động từ שׁמע ở đây tự nhiên nhất là “nghe”, nhấn mạnh rằng tiếng kêu đau khổ của dân đã đến tai Đức Chúa Trời; “lắng nghe” có thể hàm ý một hành động kéo dài không được biểu đạt rõ trong câu.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Dù hình thức từ có dạng số nhiều, động từ đi kèm ở số ít và ngữ cảnh chỉ về Đức Chúa Trời duy nhất của Ít-ra-ên.
- source_word: נַאֲקָתָם
  choice: tiếng rên siết của họ
  rationale: Danh từ נַאֲקָה chỉ tiếng rên hoặc tiếng kêu đau đớn do bị áp bức. “Tiếng rên siết” diễn đạt tự nhiên nỗi thống khổ tập thể mà không biến nó thành một lời than mang tính nghi thức.
- source_word: וַיִּזְכֹּר
  choice: nhớ đến
  rationale: Giữ nghĩa từ vựng trực tiếp của זכר. Trong bối cảnh giao ước, từ này hướng đến hành động trung tín tiếp theo, nhưng không nên đưa phần hàm ý ấy thành lời diễn giải trong chính văn.
- source_word: בְּרִיתוֹ
  choice: giao ước của Ngài
  rationale: בְּרִית là thuật ngữ thông thường chỉ “giao ước”; hậu tố sở hữu cho biết đây là giao ước của Đức Chúa Trời. “Ngài” duy trì văn phong trang trọng và chỉ rõ chủ thể.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: với Áp-ra-ham, với Y-sác và với Gia-cốp
  rationale: Giới từ “với” được bổ sung theo cú pháp tự nhiên của tiếng Việt sau “giao ước”. Việc lặp lại trước Áp-ra-ham và Y-sác phần nào giữ nhịp và sự nhấn mạnh của các dấu chỉ tân ngữ lặp lại trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Ngôn ngữ nhân hình trong câu “Đức Chúa Trời nhớ đến”
  choice: Giữ “nhớ đến” trong chính văn mà không diễn giải mở rộng.
  alternative: “Đức Chúa Trời lưu tâm đến giao ước” hoặc “Đức Chúa Trời hành động theo giao ước”
  rationale: Nguyên văn dùng ngôn ngữ giao ước mang tính nhân hình. “Nhớ đến” báo hiệu lòng thành tín với giao ước, chứ không nhất thiết hàm ý trước đó Đức Chúa Trời đã quên. Giữ nguyên cách nói bảo toàn sức căng thần học của bản văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng các tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt và giữ thuật ngữ thần học phổ thông “giao ước”. Dấu chú thích [a], [b] đều xuất hiện trong chính văn; [b] được đặt sau toàn câu vì giải thích cụm “nhớ đến” trong quan hệ với giao ước.
