base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: vi
  text: Bấy giờ, những người chăn bầy đến xua đuổi các con gái ấy đi, nhưng Môi-se đứng dậy giải cứu họ[a] rồi cho đàn vật nuôi của họ uống nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cứu” hoặc “giải thoát”. Động từ Hê-bơ-rơ có thể chỉ hành động cứu giúp hoặc giải thoát; ở đây nói đến việc Môi-se cứu các con gái khỏi sự xua đuổi của những người chăn bầy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Bấy giờ, ... đến
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “Bấy giờ” chuyển ý tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: הָרֹעִים
  choice: những người chăn chiên
  rationale: Phân từ của רעה được danh từ hóa, chỉ những người chăn đàn vật. “Người chăn chiên” là cách gọi quen thuộc, phù hợp bối cảnh, dù từ này tự nó có thể rộng hơn.
- source_word: וַיְגָרְשׁוּם
  choice: đuổi các cô đi
  rationale: גרש diễn tả hành động xua đuổi. Hậu tố giống đực số nhiều trong bản Hê-bơ-rơ được hiểu theo tiền cảnh là các con gái của thầy tế lễ; tiếng Việt dùng “các cô” tự nhiên và rõ nghĩa.
- source_word: וַיָּקָם
  choice: đứng dậy
  rationale: קום ở đây vừa chỉ việc đứng lên vừa mở đầu hành động can thiệp dứt khoát của Môi-se.
- source_word: וַיּוֹשִׁעָן
  choice: giải cứu họ
  rationale: Dạng Hifil của ישׁע có nghĩa cứu hoặc giải thoát. “Giải cứu” giữ được sắc thái mạnh của động từ mà vẫn phù hợp với việc cứu các cô khỏi sự xua đuổi.
- source_word: וַיַּשְׁקְ
  choice: cho ... uống nước
  rationale: שקה nghĩa là cho uống nước. Cách diễn đạt này tự nhiên trong tiếng Việt khi đối tượng là đàn gia súc.
- source_word: צֹאנָם
  choice: đàn vật của họ
  rationale: צאן là danh từ tập hợp chỉ gia súc nhỏ, thường gồm chiên và dê. “Đàn vật” tránh thu hẹp không có căn cứ thành chỉ chiên, đồng thời giữ sắc thái tập hợp.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Môi-se” theo lối phiên âm tiếng Việt quen thuộc. Đại từ “các cô” làm rõ đối tượng bị đuổi; “họ” sau đó tiếp tục chỉ các cô theo mạch văn. Không thêm chú thích vì bản Hê-bơ-rơ ở đây không có dị bản hay sự mơ hồ cần thiết phải đưa vào ấn bản.
