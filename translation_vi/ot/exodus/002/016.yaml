    rationale: צֹאן là thuật ngữ tập hợp chỉ cừu và dê/gia súc nhỏ, không bao quát gia súc lớn nói chung. “Đàn chiên” là lối dịch tự nhiên trong tiếng Việt Kinh Thánh, dù từ nguồn vẫn mang tính tập hợp rộng hơn cừu đơn thuần.
  - severity: low
    issue: “Cha mình” không phản ánh rõ sở hữu số nhiều.
    rationale: אֲבִיהֶן nghĩa là “cha họ/their father.” “Cha họ” vừa sát nghĩa vừa tránh sắc thái phân phối có thể có ở “cha mình.”
