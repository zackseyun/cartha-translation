base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: vi
  text: Thầy tế lễ của Ma-đi-an[a] có bảy con gái. Họ đến kéo nước[b], đổ đầy các máng để cho đàn chiên của cha họ uống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một thầy tế lễ ở Ma-đi-an”. Tiếng Hê-bơ-rơ có thể nói đến một thầy tế lễ xác định hoặc đơn giản là một thầy tế lễ gắn với Ma-đi-an.
    reason: lexical_alternative
  - marker: b
    text: “Kéo nước” chỉ việc kéo nước lên từ giếng.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: Thầy tế lễ của Ma-đi-an
  rationale: כֹהֵן là “thầy tế lễ”; quan hệ với מִדְיָן được diễn đạt tự nhiên là “của Ma-đi-an”. Tiếp đầu ngữ וּ đánh dấu sự tiếp nối/chuyển cảnh, nhưng không nhất thiết phải dịch thành một từ nối riêng trong tiếng Việt.
- source_word: שֶׁבַע בָּנוֹת
  choice: có bảy con gái
  rationale: Cấu trúc sở hữu tiếng Hê-bơ-rơ, sát nghĩa là “thuộc về thầy tế lễ... có bảy con gái”, được chuyển thành cách nói sở hữu tự nhiên trong tiếng Việt.
- source_word: וַתָּבֹאנָה
  choice: Họ đến
  rationale: Dạng động từ giống cái số nhiều chỉ bảy người con gái; “đến” truyền đạt trực tiếp diễn tiến trần thuật.
- source_word: וַתִּדְלֶנָה
  choice: kéo nước
  rationale: דלה chỉ việc kéo nước lên, trong ngữ cảnh này là từ giếng; bổ sung tân ngữ “nước” vốn được hàm ý để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: đổ đầy các máng
  rationale: מלא nghĩa là làm đầy; רְהָטִים chỉ các máng hoặc rãnh chứa nước cho vật nuôi. “Đổ đầy các máng” diễn tả tự nhiên hành động dùng nước vừa kéo lên.
- source_word: לְהַשְׁקוֹת צֹאן אֲבִיהֶן
  choice: để cho đàn gia súc của cha mình uống
  rationale: שקה ở thể khiến khiến vật nuôi uống. צֹאן là tên gọi tập hợp cho gia súc nhỏ, chủ yếu cừu và dê; “đàn gia súc” giữ phạm vi rộng hơn “đàn chiên”.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thầy tế lễ” theo cách gọi quen thuộc trong tiếng Việt Kinh Thánh; giữ địa danh “Ma-đi-an”. Đại từ “Họ” tránh lặp dài nhưng vẫn chỉ rõ bảy người con gái. Các dấu chú thích [a], [b] đều được đặt ngay sau thành phần liên quan.
