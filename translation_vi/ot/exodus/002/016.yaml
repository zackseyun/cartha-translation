  rationale: 'Chỉnh hai điểm nhỏ để sát nghĩa hơn mà vẫn giữ văn phong tiếng Việt hiện đại: “đàn chiên” phù hợp hơn với צֹאן so với “đàn gia súc,” và “cha họ” phản ánh trực tiếp hậu tố sở hữu số nhiều. Các chú thích giữ đúng vị trí neo và nội dung cần thiết.'
