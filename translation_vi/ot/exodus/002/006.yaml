base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: vi
  text: 'Nàng mở ra và thấy đứa trẻ; kìa, một bé trai đang khóc. Nàng động lòng thương nó[a] và nói: “Đây là một trong những đứa trẻ của người Hê-bơ-rơ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nàng thương xót nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: Nàng mở ra
  rationale: Động từ có nghĩa là “mở”; tiếng Việt có thể lược tân ngữ vì chiếc giỏ đã rõ từ ngữ cảnh.
- source_word: וַתִּרְאֵהוּ אֶת הַיֶּלֶד
  choice: và thấy đứa trẻ
  rationale: Hậu tố giống đực số ít được cụm đồng vị “đứa trẻ” xác định ngay sau đó; cách dịch này tự nhiên và chuyển tải đầy đủ đối tượng được nhìn thấy.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: Giữ sắc thái trực chỉ, sống động và bất ngờ của tiểu từ Hê-bơ-rơ.
- source_word: נַעַר בֹּכֶה
  choice: một bé trai đang khóc
  rationale: Trong ngữ cảnh nói về Môi-se lúc còn sơ sinh, “bé trai” biểu đạt giới tính mà không gợi tuổi thiếu niên; “đang khóc” thể hiện hành động tiếp diễn của phân từ.
- source_word: וַתַּחְמֹל עָלָיו
  choice: Nàng động lòng thương nó
  rationale: Diễn đạt tự nhiên ý thương xót của חמל với עַל mà không đưa trước ý hành động tha hay cứu.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: một trong những đứa trẻ của người Hê-bơ-rơ
  rationale: Phản ánh cách dùng phân chia của מִן và nhận định rằng đứa trẻ thuộc về dân Hê-bơ-rơ.
- source_word: זֶה
  choice: Đây là
  rationale: Cách chỉ vào đứa trẻ trước mặt tự nhiên trong lời nói tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “nàng” để chỉ con gái Pha-ra-ôn theo mạch kể; “nó” là đại từ tự nhiên dành cho trẻ nhỏ, không mang ý miệt thị trong ngữ cảnh này. Giữ “kìa” nhằm bảo tồn sức gợi trực tiếp của וְהִנֵּה.
