translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nàng” cho người nữ đã được xác định trong mạch văn, “ông” cho Môi-se, và giữ lối chơi chữ của tên riêng bằng chú thích thay vì tạo một lối chơi chữ không tự nhiên trong chính văn.
