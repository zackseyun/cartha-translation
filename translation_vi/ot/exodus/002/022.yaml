base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: vi
  text: 'Nàng sinh một con trai và ông đặt tên cho con là Ghẹt-sôm[a], vì ông nói: “Tôi từng là kiều dân nơi đất khách.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ghẹt-sôm nghe gần với cách nói Hê-bơ-rơ có nghĩa là “một kiều dân ở đó,” phù hợp với lời Môi-se giải thích tên này.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Tôi là kiều dân nơi đất khách.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: Nàng sinh một con trai
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ rõ nghĩa sinh một con trai.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: ông đặt tên cho con là
  rationale: Đây là cách diễn đạt tự nhiên của công thức đặt tên trong tiếng Việt; chủ ngữ nam chỉ Môi-se, còn “con” chỉ đứa trẻ vừa sinh.
- source_word: גֵּרְשֹׁם
  choice: Ghẹt-sôm
  rationale: Phiên âm tên riêng Hê-bơ-rơ Gershom theo lối dễ đọc trong tiếng Việt.
- source_word: כִּי אָמַר
  choice: vì ông nói
  rationale: כִּי giới thiệu lời giải thích cho việc đặt tên; “vì” giữ quan hệ nguyên nhân rõ ràng.
- source_word: גֵּר
  choice: kiều dân
  rationale: גֵּר chỉ người cư trú tại một nơi không phải quê hương mình. “Kiều dân” trang trọng, dễ hiểu và chính xác hơn “người ngoại quốc” trong ngữ cảnh cư trú xa quê.
- source_word: הָיִיתִי
  choice: Tôi đã là
  rationale: Giữ sắc thái hoàn thành của động từ Hê-bơ-rơ mà không quyết định dứt khoát trạng thái ấy đã chấm dứt hay còn tiếp diễn.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: nơi đất khách
  rationale: Cách nói tiếng Việt tự nhiên, cô đọng, diễn tả một xứ không thuộc quê hương của người nói.
