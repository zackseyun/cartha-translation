  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יָּמִ֣ים הָ/הֵ֗ם וַ/יִּגְדַּ֤ל מֹשֶׁה֙ וַ/יֵּצֵ֣א אֶל אֶחָ֔י/ו וַ/יַּ֖רְא בְּ/סִבְלֹתָ֑/ם וַ/יַּרְא֙ אִ֣ישׁ מִצְרִ֔י מַכֶּ֥ה אִישׁ עִבְרִ֖י מֵ/אֶחָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: vi
  text: Trong những ngày ấy, khi Môi-se đã trưởng thành, ông đi ra đến chỗ anh em mình[a] và thấy những gánh nặng của họ. Ông thấy một người Ai Cập đang đánh một người Hê-bơ-rơ, là một trong những anh em của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đồng bào mình” hoặc “dân mình.” Tiếng Hê-bơ-rơ dùng từ ngữ chỉ quan hệ gia đình—“anh em mình” và “một trong những anh em của mình”—để diễn tả sự gắn bó của Môi-se với người Hê-bơ-rơ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Trong những ngày ấy
  rationale: Công thức chuyển tiếp tự sự được diễn đạt tự nhiên trong tiếng Việt; không thêm một từ chỉ thời gian tương đương với “bây giờ” vì nguyên văn không có từ ấy.
- source_word: וַיִּגְדַּל
  choice: đã trưởng thành
  rationale: Trong ngữ cảnh, động từ nói đến việc Môi-se đã lớn và đạt tuổi trưởng thành, không phải trở nên cao trọng.
- source_word: אֶל־אֶחָיו
  choice: đi ra thăm anh em mình
  rationale: “Anh em mình” giữ nguyên ngôn ngữ thân tộc của tiếng Hê-bơ-rơ. Động từ “thăm” diễn đạt tự nhiên việc ông đi ra đến với họ, trong khi đối tượng và mục đích quan sát được câu sau làm rõ.
- source_word: בְּסִבְלֹתָם
  choice: cảnh họ phải lao dịch
  rationale: Danh từ chỉ những gánh nặng, đặc biệt là lao dịch bị áp đặt trong ngữ cảnh này. Cách diễn đạt tiếng Việt vừa cụ thể vừa giữ sắc thái áp bức.
- source_word: אִישׁ מִצְרִי
  choice: một người Ai Cập
  rationale: Phản ánh cả danh từ “người đàn ông/người” và căn tính Ai Cập, đồng thời tạo thế song song với “một người Hê-bơ-rơ”.
- source_word: מַכֶּה
  choice: đang đánh
  rationale: Phân từ diễn tả hành động bạo lực đang diễn ra; “đang đánh” tự nhiên và không quy định quá mức mức độ của cuộc hành hung.
- source_word: אִישׁ עִבְרִי
  choice: một người Hê-bơ-rơ
  rationale: Giữ cấu trúc song song với “một người Ai Cập” và phản ánh danh từ אִישׁ được lặp lại.
- source_word: מֵאֶחָיו
  choice: một trong những anh em của mình
  rationale: Giữ liên kết từ vựng với “anh em mình” ở đầu câu và nhấn mạnh sự đồng nhất, liên đới của Môi-se với người Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch ngôn ngữ thân tộc אֶחָיו / מֵאֶחָיו
  choice: anh em mình / một trong những anh em của mình
  alternative: đồng bào mình / một người trong dân mình
  rationale: Nguyên văn dùng ngôn ngữ gia đình để biểu thị sự gắn bó của Môi-se với người Hê-bơ-rơ. Bản dịch giữ hình ảnh ấy và dùng chú thích để nêu các cách hiểu tự nhiên khác, thay vì lặng lẽ thay thế bằng một cách diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se,” “Ai Cập,” và “Hê-bơ-rơ” theo lối gọi quen thuộc trong tiếng Việt. Cụm “cảnh họ phải lao dịch” ưu tiên tính tự nhiên nhưng vẫn thể hiện nội dung cụ thể của בְּסִבְלֹתָם.
