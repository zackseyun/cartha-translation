  naturalness: Bản văn nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Đi ra đến chỗ anh em mình” và “thấy những gánh nặng của họ” giữ được nghĩa sát hơn mà vẫn rõ trong văn mạch.
  terminology: Các tên riêng Môi-se, Ai Cập, Hê-bơ-rơ nhất quán. “Anh em mình” bảo toàn ngôn ngữ thân tộc của nguyên văn; chú thích nêu đúng các khả năng diễn đạt khác mà không thay thế bản văn chính.
