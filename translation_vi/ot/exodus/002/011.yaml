  to: Trong những ngày ấy, khi Môi-se đã trưởng thành, ông đi ra đến chỗ anh em mình[a] và thấy những gánh nặng của họ. Ông thấy một người Ai Cập đang đánh một người Hê-bơ-rơ, là một trong những anh em của mình.
