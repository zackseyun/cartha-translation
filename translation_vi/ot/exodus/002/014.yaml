source:
  edition: WLC
  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: vi
  text: 'Nhưng người ấy nói: “Ai lập anh làm người cai trị và xét xử chúng tôi? Có phải anh định giết tôi như đã giết người Ai Cập không?” Môi-se liền sợ hãi và nói: “Chắc chắn việc ấy đã bị lộ rồi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: Ai lập anh
  rationale: Diễn đạt tự nhiên lời chất vấn về việc ai đã đặt hoặc bổ nhiệm Môi-se vào địa vị có thẩm quyền.
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: làm người cai trị và xét xử
  rationale: אִישׁ đứng trong cụm chỉ vai trò; tiếng Việt không cần lặp cứng thành “một người, một nhà cai trị.” “Cai trị và xét xử” giữ hai phương diện thẩm quyền của שַׂר và שֹׁפֵט, đồng thời phù hợp với cách gọi trực tiếp tự nhiên.
- source_word: עָלֵינוּ
  choice: chúng tôi
  rationale: Trong tiếng Việt, quyền cai trị hoặc xét xử đối với nhóm người được thể hiện tự nhiên bằng tân ngữ; thêm “trên chúng tôi” sẽ cứng và kém tự nhiên.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Có phải anh định giết tôi
  rationale: אֹמֵר trong cấu trúc này có thể mang sắc thái dự định hoặc có ý làm; bản dịch giữ câu hỏi trực tiếp tự nhiên mà không áp đặt lời nói thành một câu trích dẫn lồng.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: như đã giết người Ai Cập
  rationale: Giữ phép so sánh trực tiếp với hành động Môi-se đã làm trước đó; “người Ai Cập” thể hiện danh từ xác định theo ngữ cảnh.
- source_word: וַיִּירָא מֹשֶׁה
  choice: Môi-se liền sợ hãi
  rationale: “Liền” phản ánh diễn tiến liên tiếp trong thể kể chuyện; “sợ hãi” truyền đạt rõ phản ứng của Môi-se.
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: Chắc chắn việc ấy đã bị lộ rồi
  rationale: אָכֵן diễn tả sự xác nhận hoặc nhận ra; Niphal נוֹדַע cho biết sự việc đã được biết đến. “Đã bị lộ rồi” là cách nói Việt tự nhiên trong bối cảnh bí mật bị phát giác.
theological_decisions:
- issue: Cách thể hiện לְאִישׁ trong cụm chỉ chức vụ
  choice: làm người cai trị và xét xử
  alternative: làm một người, một người cai trị và một người xét xử
  rationale: אִישׁ có hình thức giống đực nhưng tại đây góp phần tạo cụm chỉ địa vị của chính Môi-se, không nêu một luận điểm thần học riêng về giới. Cách dịch đã chọn giữ quy chiếu nam giới qua đại từ “anh” và tránh câu tiếng Việt gượng ép.
- issue: Sắc thái của הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Có phải anh định giết tôi
  alternative: 'Có phải anh đang nói: ‘Anh sẽ giết tôi’'
  rationale: Cấu trúc Hê-bơ-rơ cho phép hiểu אֹמֵר theo nghĩa “có ý/định.” Bản dịch giữ lời đe dọa được cảm nhận mà không biến nó thành một lời tuyên bố trực tiếp chắc chắn của Môi-se.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “anh/chúng tôi” để thể hiện lời đối đầu giữa những người đàn ông trưởng thành; dùng “Môi-se” theo lối phiên âm quen thuộc. Không thêm dấu chú thích vì không có chú thích cần thiết cho bản Việt này.
