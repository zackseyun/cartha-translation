  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: vi
  text: 'Con gái Pha-ra-ôn nói với bà: “Hãy đem đứa trẻ này đi và nuôi bú nó cho ta; ta sẽ trả công cho bà.” Người phụ nữ ấy đem đứa trẻ đi và nuôi bú nó.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: Con gái Pha-ra-ôn
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên quan hệ được biểu thị bằng chuỗi liên kết trong tiếng Hê-bơ-rơ.
- source_word: הֵילִיכִי
  choice: Hãy đem ... đi
  rationale: Thể sai khiến mệnh lệnh của הלך trong ngữ cảnh này chỉ việc nhận và đưa đứa trẻ đi để chăm nuôi; “đem ... đi” vừa tự nhiên vừa giữ sắc thái chuyển đứa trẻ khỏi nơi đang đứng.
- source_word: הַיֶּלֶד הַזֶּה
  choice: đứa trẻ này
  rationale: יֶלֶד có nghĩa rộng là trẻ nhỏ hoặc bé trai; “đứa trẻ này” không xác định quá mức và hợp với ngữ cảnh.
- source_word: וְהֵינִקִהוּ לִי
  choice: và cho nó bú thay ta
  rationale: Động từ ינק ở thể sai khiến nói cụ thể đến việc cho trẻ bú; “thay ta” chuyển tải לִי là hành động được thực hiện cho con gái Pha-ra-ôn, tránh khả năng bị hiểu là cho chính bà bú.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: ta sẽ trả công cho bà
  rationale: שָׂכָר là tiền công hoặc thù lao. “Trả công” là cách nói hiện đại, tự nhiên và phản ánh quan hệ thuê chăm nuôi.
- source_word: הָאִשָּׁה
  choice: người phụ nữ ấy
  rationale: Bản Hê-bơ-rơ gọi bà là “người phụ nữ”, không nói rõ “mẹ đứa trẻ” tại câu này; từ “ấy” giúp quy chiếu tự nhiên mà không thêm thông tin.
- source_word: וַתְּנִיקֵהוּ
  choice: và cho nó bú
  rationale: Giữ nhất quán với động từ trước và diễn đạt chính xác hành động nuôi trẻ bằng sữa mẹ trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ta” trong lời của con gái Pha-ra-ôn để thể hiện địa vị xã hội; dùng “bà” với người phụ nữ trưởng thành. Không thêm “mẹ nó” dù ngữ cảnh cho biết căn tính của bà.
