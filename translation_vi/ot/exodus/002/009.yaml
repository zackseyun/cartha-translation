- from: 'Con gái Pha-ra-ôn nói với bà: “Hãy đem đứa trẻ này đi và cho nó bú thay ta; ta sẽ trả công cho bà.” Người phụ nữ ấy đem đứa trẻ đi và cho nó bú.'
  to: 'Con gái Pha-ra-ôn nói với bà: “Hãy đem đứa trẻ này đi và nuôi bú nó cho ta; ta sẽ trả công cho bà.” Người phụ nữ ấy đem đứa trẻ đi và nuôi bú nó.'
