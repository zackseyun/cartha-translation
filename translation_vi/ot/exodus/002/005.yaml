  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: vi
  text: Bấy giờ, con gái Pha-ra-ôn xuống sông Nin để tắm, còn các thiếu nữ hầu cận nàng đi dọc theo bờ sông. Nàng thấy chiếc giỏ[a] ở giữa đám sậy, liền sai nữ tỳ của mình[b], rồi lấy nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ dịch là “giỏ” cũng chính là từ được dùng cho “tàu” của Nô-ê trong Sáng Thế Ký 6–9.
    reason: cross_reference
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “nữ tỳ của nàng”; theo một cách hiểu truyền thống khác: “cánh tay của nàng.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: xuống
  rationale: Giữ rõ hướng chuyển động của động từ ירד, đồng thời tự nhiên trong tiếng Việt khi nói xuống sông.
- source_word: בַּת פַּרְעֹה
  choice: con gái Pha-ra-ôn
  rationale: Cách diễn đạt tự nhiên, trực tiếp cho cấu trúc sở hữu trong tiếng Hê-bơ-rơ.
- source_word: לִרְחֹץ
  choice: để tắm
  rationale: Trong bối cảnh đi xuống sông, nghĩa 'tắm' phù hợp hơn nghĩa rộng 'rửa'.
- source_word: עַל הַיְאֹר
  choice: sông Nin
  rationale: Giới từ mang nghĩa chỉ địa điểm; tiếng Việt tự nhiên có thể nói 'xuống sông Nin để tắm' mà không cần dịch máy móc giới từ.
- source_word: וְנַעֲרֹתֶיהָ
  choice: các thiếu nữ hầu cận nàng
  rationale: נערות chỉ những phụ nữ trẻ; thêm 'hầu cận' làm rõ vai trò theo ngữ cảnh mà vẫn giữ đặc điểm tuổi và giới.
- source_word: הֹלְכֹת
  choice: đi
  rationale: Thì nền của phân từ được thể hiện qua cấu trúc tương phản 'còn ... đi', tự nhiên hơn dạng tiếp diễn nặng nề trong tiếng Việt.
- source_word: עַל יַד הַיְאֹר
  choice: dọc theo bờ sông
  rationale: Diễn đạt tự nhiên thành ngữ chỉ vị trí bên cạnh và chuyển động dọc theo sông.
- source_word: הַתֵּבָה
  choice: chiếc giỏ
  rationale: Trong ngữ cảnh này, תבה là vật chứa nhỏ dành cho em bé; 'chiếc giỏ' rõ nghĩa hơn 'con tàu', còn mối liên hệ từ vựng với tàu của Nô-ê được giữ trong chú thích.
- source_word: בְּתוֹךְ הַסּוּף
  choice: ở giữa đám sậy
  rationale: Giữ nghĩa không gian của בְּתוֹךְ và nghĩa thực vật của סוּף bằng cách diễn đạt tự nhiên.
- source_word: אֲמָתָהּ
  choice: nữ tỳ của mình
  rationale: Theo nguyên âm của bản WLC, từ này là 'nữ tỳ'; cách dịch giữ rõ giới tính và địa vị phục dịch, đồng thời tránh sắc thái cổ quá mức.
- source_word: וַתִּקָּחֶהָ
  choice: đi lấy nó
  rationale: Kết hợp tự nhiên với động từ 'sai' trong tiếng Việt để diễn đạt việc nữ tỳ được phái đi lấy chiếc giỏ; đại từ 'nó' quy chiếu về chiếc giỏ.
theological_decisions:
- issue: Cách dịch תבה trong câu chuyện Môi-se
  choice: chiếc giỏ
  alternative: chiếc tàu / hòm
  rationale: Cùng một danh từ được dùng cho tàu của Nô-ê, nhưng ở đây vật thể là đồ đựng nhỏ đặt giữa đám sậy. Bản chính ưu tiên hình ảnh cụ thể trong ngữ cảnh, còn liên hệ liên văn bản được nêu ở chú thích.
- issue: Cách hiểu אֲמָתָהּ
  choice: nữ tỳ của mình
  alternative: cánh tay mình
  rationale: Cách đọc 'nữ tỳ' phù hợp với nguyên âm Masoretic và với động từ 'sai'; cách hiểu truyền thống 'cánh tay' được ghi nhận trong chú thích để không che khuất dị biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Pha-ra-ôn” và “sông Nin” theo dạng quen thuộc trong tiếng Việt; “nàng” tránh lặp cụm danh từ dài, còn “nữ tỳ” giữ sắc thái xã hội và giới tính của từ nguồn.
