revisions:
- from: Bấy giờ, con gái Pha-ra-ôn xuống sông Nin để tắm, còn các thiếu nữ hầu cận nàng đi dọc theo bờ sông. Nàng thấy chiếc giỏ ở giữa đám sậy[a], liền sai nữ tỳ của mình đi lấy nó[b].
  to: Bấy giờ, con gái Pha-ra-ôn xuống sông Nin để tắm, còn các thiếu nữ hầu cận nàng đi dọc theo bờ sông. Nàng thấy chiếc giỏ[a] ở giữa đám sậy, liền sai nữ tỳ của mình[b], rồi lấy nó.
  rationale: Sửa cấu trúc cuối câu để chủ ngữ của “lấy nó” vẫn là con gái Pha-ra-ôn, theo chuỗi động từ nữ số ít trong văn bản Hê-bơ-rơ. Di chuyển ký hiệu chú thích b đến ngay sau “nữ tỳ” để neo đúng từ có phương án đọc thay thế. Không thay đổi nghĩa của các phần còn lại.
