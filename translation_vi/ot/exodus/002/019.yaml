base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: vi
  text: 'Họ đáp: “Một người Ai Cập đã cứu chúng con khỏi tay những người chăn bầy[a]. Ông ấy còn múc nước[b] cho chúng con và cho đàn gia súc uống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi quyền lực của những người chăn bầy”; nguyên văn: “khỏi tay những người chăn bầy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ nhấn mạnh động từ “múc”: sát nghĩa là “múc, ông ấy đã múc cho chúng con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: Họ đáp
  rationale: Động từ wayyiqtol ngôi ba số nhiều giống cái của אמר tiếp nối lời người cha hỏi ở câu trước; “đáp” tự nhiên trong tiếng Việt và làm rõ đây là câu trả lời.
- source_word: אִישׁ מִצְרִי
  choice: Một người Ai Cập
  rationale: Giữ cả ý אִישׁ ‘người đàn ông/người’ và định danh מִצְרִי ‘Ai Cập’ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: הִצִּילָנוּ
  choice: đã cứu chúng con
  rationale: Hiphil của נצל chỉ việc giải cứu khỏi nguy hiểm cụ thể. “Chúng con” phù hợp với lời các con gái thưa với cha.
- source_word: מִיַּד
  choice: khỏi tay
  rationale: Giữ hình ảnh Hê-bơ-rơ ‘khỏi bàn tay’, đồng thời thành ngữ “khỏi tay” trong tiếng Việt diễn đạt quyền lực hoặc sự khống chế một cách tự nhiên.
- source_word: הָרֹעִים
  choice: những kẻ chăn chiên
  rationale: Danh từ/phân từ từ רעה chỉ những người chăn bầy đã xua các cô gái đi. “Kẻ” phù hợp với vai trò đối nghịch trong ngữ cảnh; “chăn chiên” là cách gọi rõ và quen thuộc, dù צאן có thể gồm cả chiên lẫn dê.
- source_word: וְגַם
  choice: còn ... nữa
  rationale: 'Cấu trúc tương liên tiếng Việt truyền đạt ý bổ sung có nhấn mạnh: người ấy không chỉ giải cứu mà còn múc nước và cho bầy vật uống.'
- source_word: דָּלֹה דָלָה
  choice: đích thân múc nước
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động. “Đích thân” thể hiện việc người ấy thực sự tự mình múc nước, thay vì lặp động từ một cách thiếu tự nhiên.
- source_word: לָנוּ
  choice: cho chúng con
  rationale: Diễn đạt đích lợi ích của đại từ ngôi thứ nhất số nhiều trong lời các con gái nói với cha.
- source_word: וַיַּשְׁקְ
  choice: cho ... uống
  rationale: Hiphil của שקה nghĩa là làm cho uống hoặc cấp nước; cách nói này tự nhiên với vật nuôi và tránh phải xác định loài.
- source_word: אֶת־הַצֹּאן
  choice: bầy vật
  rationale: צאן là danh từ tập hợp chỉ gia súc nhỏ, thường gồm chiên và dê. “Bầy vật” bảo toàn độ rộng nghĩa trong ngữ cảnh, không thu hẹp thành chỉ chiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời con thưa với cha. Dùng “chúng con” theo quan hệ hội thoại; giữ hình ảnh “khỏi tay”. Hai chú thích giải thích thành ngữ Hê-bơ-rơ và cấu trúc nhấn mạnh mà không làm câu chính nặng nề.
