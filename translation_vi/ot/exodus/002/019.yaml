- from: 'Họ đáp: “Một người Ai Cập đã cứu chúng con khỏi tay những kẻ chăn chiên[a]. Ông ấy còn đích thân múc nước cho chúng con và cho bầy vật uống nữa[b].”'
  to: 'Họ đáp: “Một người Ai Cập đã cứu chúng con khỏi tay những người chăn bầy[a]. Ông ấy còn múc nước[b] cho chúng con và cho đàn gia súc uống.”'
  rationale: Bản sửa tránh thu hẹp hoặc thêm sắc thái vào các từ chỉ người chăn bầy và đàn vật, dùng cách diễn đạt Việt ngữ tự nhiên hơn, đồng thời giữ sự nhấn mạnh của động từ Hê-bơ-rơ trong chú thích thay vì diễn giải quá mức trong câu chính. Các neo chú thích được đặt đúng vào thành ngữ “khỏi tay” và động từ được nhấn mạnh “múc nước”.
