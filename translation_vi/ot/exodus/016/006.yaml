  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se và A-rôn nói với toàn thể người Y-sơ-ra-ên[a]: “Đến chiều, anh em sẽ biết rằng chính Yahweh đã đưa anh em ra khỏi đất Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “toàn thể dân Y-sơ-ra-ên.” Nguyên văn Hê-bơ-rơ sát chữ là “toàn thể các con trai của Y-sơ-ra-ên”; đây là một cách gọi tập thể chỉ toàn dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên trình tự ấy trong tiếng Việt hiện đại.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Môi-se và A-rôn
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: với toàn thể con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ בְּנֵי יִשְׂרָאֵל, đồng thời dùng cách diễn đạt trang trọng và dễ hiểu; chú thích nêu cách dịch tự nhiên hơn.
- source_word: עֶרֶב
  choice: Chiều nay
  rationale: Danh từ chỉ thời gian đứng đầu câu, chỉ buổi chiều sắp đến trong ngữ cảnh; “Chiều nay” tự nhiên hơn “vào buổi chiều” mà không thay đổi điểm quy chiếu.
- source_word: וִידַעְתֶּם
  choice: anh em sẽ biết
  rationale: Dịch trực tiếp ý tương lai; đại từ số nhiều “anh em” phù hợp lời nói với cộng đồng và văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: כִּי
  choice: rằng
  rationale: Ở đây כִּי giới thiệu nội dung điều dân chúng sẽ biết.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: הוֹצִיא אֶתְכֶם
  choice: đã đưa anh em ra
  rationale: Hiphil của יצא có nghĩa thông dụng là “đưa ra”; “đã” thể hiện hành động Xuất Hành đã xảy ra và đang được nhìn lại.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: khỏi đất Ai Cập
  rationale: “Đất Ai Cập” phản ánh rõ danh từ אֶרֶץ, còn “khỏi” kết hợp tự nhiên với “đưa ... ra” trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יְהוָה; giữ “Yahweh” giúp phân biệt danh riêng với tước hiệu.
- issue: Sắc thái chủ thể của הוֹצִיא
  choice: chính Yahweh đã đưa
  alternative: Yahweh đã đưa
  rationale: Đại từ độc lập הוּא đứng sau יְהוָה tạo nét nhấn mạnh/xác định chủ thể; “chính” diễn đạt nét ấy mà không thêm một chủ thể mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ cấu trúc lời công bố ngắn gọn, dùng “Yahweh” cho danh riêng יְהוָה và đặt dấu chú thích [a] ngay sau cụm từ liên quan.
