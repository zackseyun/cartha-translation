  text: וַ/יָּמֹ֣דּוּ בָ/עֹ֔מֶר וְ/לֹ֤א הֶעְדִּיף֙ הַ/מַּרְבֶּ֔ה וְ/הַ/מַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְ/פִֽי אָכְל֖/וֹ לָקָֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: vi
  text: Khi họ đong bằng ô-me[a], ai gom nhiều thì không dư, ai gom ít cũng không thiếu; mỗi người gom tùy theo sức ăn của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ô-me là một đơn vị đong chất khô cổ.
    reason: Giải thích đơn vị đo lường cổ được giữ nguyên trong bản dịch, không đưa ra một quy đổi hiện đại có vẻ chính xác tuyệt đối.
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  choice: Khi họ đong
  rationale: Động từ מדד chỉ việc đo lường; trong ngữ cảnh lương thực khô, “đong” tự nhiên hơn “đo”. Mệnh đề được diễn đạt như bối cảnh thời gian cho kết quả tiếp theo, dù waw-consecutive cũng có thể được hiểu đơn giản là “rồi họ đong”.
- source_word: בָעֹמֶר
  choice: bằng ô-me
  rationale: עֹמֶר là một đơn vị đo lường chất khô. Giữ nguyên tên đơn vị thay vì quy đổi, và dùng “bằng” để chỉ chuẩn dùng khi đong.
- source_word: הֶעְדִּיף
  choice: không dư
  rationale: Động từ diễn tả có phần thừa hay vượt quá; “không dư” ngắn gọn, tự nhiên và giữ thế đối xứng với “không thiếu”.
- source_word: הַמַּרְבֶּה
  choice: người đã gom nhiều
  rationale: Phân từ có nghĩa sát là “người làm nhiều/tăng nhiều”, nhưng trong mạch văn thu nhặt ma-na, hành động được ngầm hiểu là gom. Nêu rõ “gom” giúp câu tiếng Việt sáng nghĩa.
- source_word: הֶחְסִיר
  choice: không thiếu
  rationale: Động từ חסר ở dạng này diễn tả bị thiếu hụt. “Không thiếu” phản ánh trực tiếp ý nghĩa và cân xứng với “không dư”.
- source_word: הַמַּמְעִיט
  choice: người đã gom ít
  rationale: Trong ngữ cảnh, phân từ chỉ người thu gom với số lượng ít; bổ sung “gom” làm rõ hành động được ngầm hiểu.
- source_word: אִישׁ
  choice: mỗi người
  rationale: Danh từ số ít giống đực được dùng theo nghĩa phân phối, chỉ từng cá nhân trong cộng đồng chứ không nhất thiết chỉ nam giới. “Mỗi người” giữ đúng lực phân phối ấy.
- source_word: לְפִי אָכְלוֹ
  choice: tùy theo sức ăn của mình
  rationale: Cụm từ có nghĩa sát là “theo miệng/sự ăn của người ấy”, tức lượng một người có thể hoặc cần ăn. “Tùy theo sức ăn của mình” là cách nói Việt tự nhiên, không khẳng định quá mức rằng toàn bộ số đã được ăn hết.
- source_word: לָקָטוּ
  choice: gom
  rationale: לקט là động từ thông dụng chỉ việc nhặt, thu gom từng phần; “gom” phù hợp với việc thu nhặt ma-na và đọc tự nhiên trong câu.
theological_decisions:
- issue: Số ít giống đực mang nghĩa phân phối trong אִישׁ ... אָכְלוֹ
  choice: Diễn đạt là “mỗi người ... sức ăn của mình”
  alternative: “mỗi người nam ... theo sự ăn của người ấy” hoặc “mọi người ... tùy theo sức ăn của họ”
  rationale: Tiếng Hê-bơ-rơ dùng hình thức giống đực số ít theo nghĩa phân phối. Đại từ phản thân “mình” trong tiếng Việt vừa duy trì quan hệ quy chiếu với từng người, vừa không áp đặt nghĩa chỉ nam giới khi ngữ cảnh nói đến từng thành viên.
- issue: Quan hệ giữa lượng gom ban đầu và kết quả sau khi đong
  choice: Giữ đối lập “người đã gom nhiều không dư ... người đã gom ít cũng không thiếu”
  alternative: “người có nhiều không quá mức, người có ít chẳng thiếu gì”
  rationale: Ngữ cảnh ủng hộ việc hiểu các phân từ là lượng mỗi người đã gom, nhưng cấu trúc Hê-bơ-rơ vẫn súc tích. Bản dịch giữ cả hành động gom và nghịch lý không dư/không thiếu mà không giải thích cơ chế thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đong” cho lương thực khô, “gom” để tránh sắc thái quá khẩu ngữ của “lượm”, và cấu trúc “không dư ... cũng không thiếu” để giữ nhịp song song của nguyên văn.
