review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự và thế đối xứng của tiếng Hê-bơ-rơ: sau khi đong theo ô-me, người gom nhiều không còn dư và người gom ít không thiếu; mệnh đề cuối giữ ý phân phối theo nhu cầu ăn của từng người. “Tùy theo sức ăn của mình” là cách chuyển ngữ tự nhiên cho לְפִי אָכְלוֹ, dù có thể bao hàm khẩu phần cần dùng hơn là chỉ khả năng ăn.'
