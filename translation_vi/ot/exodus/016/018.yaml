  terminology: “Đong,” “ô-me,” “gom,” “dư,” và “thiếu” đều phù hợp ngữ cảnh ma-na. Chú thích không nên khẳng định con số “khoảng 2,2 lít” như một quy đổi chắc chắn, vì dung tích ô-me cổ chỉ có thể ước tính và có các cách tính khác nhau.
  issues:
  - severity: low
    issue: Chú thích nêu dung tích ô-me là “khoảng 2,2 lít.”
    rationale: Đây là một ước tính hiện đại, không phải giá trị chắc chắn trực tiếp của bản văn; bỏ trị số sẽ tránh tạo ấn tượng chính xác giả tạo, đồng thời vẫn giải thích được đơn vị cổ.
  - severity: low
    issue: Cụm “người đã gom nhiều ... người đã gom ít” hơi nặng trong tiếng Việt.
    rationale: Dạng “ai gom nhiều ... ai gom ít ...” tự nhiên hơn và vẫn diễn đạt hợp lý các phân từ theo ngữ cảnh thu gom ma-na.
