base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: vi
  text: Nhưng họ không nghe lời Môi-se[a]. Một số người để lại một ít ma-na đến sáng; ma-na sinh giòi và bốc mùi hôi[b]. Môi-se nổi giận với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không chịu nghe Môi-se.” Cụm từ Hê-bơ-rơ có thể chỉ việc không nghe theo, hàm ý bất tuân.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “giòi nảy sinh trong đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: nghe lời Môi-se
  rationale: Cụm שׁמע אֶל có nghĩa nghe, chú ý và làm theo lời người khác. “Nghe lời” tự nhiên trong tiếng Việt, vừa giữ hình ảnh nghe vừa hàm ý không tuân theo mà không diễn giải quá mạnh thành “vâng lời”.
- source_word: וַיּוֹתִרוּ אֲנָשִׁים מִמֶּנּוּ
  choice: một số người để lại một phần
  rationale: יתר ở thể Hiphil có nghĩa để lại hoặc chừa lại; אֲנָשִׁים chỉ một số người nam trong ngữ cảnh, nhưng tiếng Việt thường dùng “người” làm danh từ chỉ người tự nhiên hơn, không phủ nhận giới tính ngữ pháp của từ Hê-bơ-rơ. “Một phần” diễn đạt rõ đại từ hồi chỉ về ma-na.
- source_word: עַד בֹּקֶר
  choice: cho đến sáng
  rationale: Cách diễn đạt thời gian trực tiếp, tự nhiên và chính xác trong tiếng Việt.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: nó sinh giòi
  rationale: Cụm này theo sát ý rằng giòi xuất hiện hoặc phát sinh trong phần ma-na bị để lại. “Sinh giòi” là cách nói tự nhiên; chú thích giữ lại hình thức sát chữ hơn.
- source_word: וַיִּבְאַשׁ
  choice: bốc mùi hôi
  rationale: Động từ chỉ việc trở nên thối hoặc phát mùi khó chịu. “Bốc mùi hôi” rõ nghĩa, sinh động và phù hợp văn kể chuyện hiện đại.
- source_word: וַיִּקְצֹף עֲלֵהֶם
  choice: Môi-se nổi giận với họ
  rationale: קצף diễn tả sự giận dữ; “nổi giận với họ” tự nhiên trong tiếng Việt và không cường điệu mức độ thành thịnh nộ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nghe lời” để bảo toàn sự giao thoa giữa nghe và tuân theo; giữ các hình ảnh cụ thể về giòi và mùi hôi. Dấu chấm và dấu chấm phẩy được dùng để tránh chuỗi liên từ nặng nề trong tiếng Việt.
