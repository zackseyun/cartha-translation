    rationale: Nguồn và audit trail quy định Danh Giao Ước được biểu thị là “Yahweh”; cần áp dụng nhất quán trong văn bản lẫn chú thích.
  - severity: low
    issue: “Muốn nướng/luộc” thêm sắc thái ý muốn.
    rationale: Các hình thức động từ trong cụm lặp nêu điều họ sẽ làm rồi ra lệnh làm điều ấy; bản gốc không nêu động từ chỉ ý muốn. Cấu trúc “sẽ ... gì thì hãy ...” giữ được sắc thái này.
  - severity: low
    issue: “Ngày nghỉ hoàn toàn” có thể nghe như một ngày nghỉ thông thường hoặc tuyệt đối hóa mức độ nghỉ.
    rationale: שַׁבָּתוֹן chỉ sự nghỉ ngơi/kiêng việc có tính đặc biệt, trang trọng. “Một ngày nghỉ trọng thể” giữ sắc thái nổi bật mà không diễn giải quá mức.
