source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: vi
  text: 'Ông nói với họ: “Đây là điều Yahweh đã phán: Ngày mai là một ngày nghỉ trọng thể, một ngày Sa-bát thánh cho Yahweh.[a] Các ngươi sẽ nướng gì thì hãy nướng, sẽ luộc gì thì hãy luộc.[b] Tất cả phần còn lại, hãy để dành cho mình để giữ đến sáng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một ngày Sa-bát thánh dành cho Yahweh.”'
    reason: Cụm שַׁבַּת קֹדֶשׁ לַיהוָה có thể được diễn đạt bằng cấu trúc trong đó “thánh” trực tiếp bổ nghĩa cho “ngày Sa-bát”; “cho Yahweh” bám sát hơn giới từ לְ.
  - marker: b
    text: 'Tiếng Hê-bơ-rơ lặp lại các động từ để nhấn mạnh: “Các ngươi sẽ nướng gì thì hãy nướng, sẽ luộc gì thì hãy luộc.”'
    reason: Chú thích giải thích phép lặp động từ trong nguyên văn, được bảo tồn trong bản dịch.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Ông nói với họ
  rationale: Giữ cách dẫn lời trực tiếp, đơn giản của lối kể chuyện Hê-bơ-rơ; chủ thể là Môi-se theo ngữ cảnh.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Đây là điều Đức Giê-hô-va đã phán
  rationale: Diễn đạt tự nhiên cấu trúc chỉ định và giữ sắc thái lời phán đã được ban, vẫn có hiệu lực trong tình huống hiện tại.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc, trang trọng trong tiếng Việt để biểu đạt trực tiếp Danh Giao Ước יהוה.
- source_word: שַׁבָּתוֹן שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: ngày nghỉ hoàn toàn, một ngày Sa-bát thánh dành cho Đức Giê-hô-va
  rationale: שַׁבָּתוֹן nhấn mạnh sự ngưng nghỉ trọn vẹn; cụm kế tiếp giải thích đó là ngày Sa-bát được biệt riêng cho Đức Giê-hô-va.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: Những gì các ngươi muốn nướng thì hãy nướng
  rationale: Giữ phép lặp động từ và lực mệnh lệnh, đồng thời dùng cấu trúc tiếng Việt tự nhiên.
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: những gì muốn luộc thì hãy luộc
  rationale: Chọn “luộc” cho nghĩa cụ thể của בשל trong ngữ cảnh chế biến thức ăn và bảo toàn sự song hành với “nướng”.
- source_word: כָּל הָעֹדֵף
  choice: tất cả phần còn dư
  rationale: Chỉ toàn bộ lượng thức ăn còn lại sau khi chuẩn bị.
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת עַד הַבֹּקֶר
  choice: hãy để riêng cho mình và giữ lại đến sáng
  rationale: Truyền đạt cả hành động dành riêng, lợi ích cho chính họ, và mục đích bảo quản đến sáng.
theological_decisions:
- issue: Cách chuyển dịch Danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh. “Đức Giê-hô-va” là dạng tên riêng trang trọng và dễ nhận biết trong tiếng Việt, tránh thay tên bằng một tước hiệu.
- issue: Quan hệ giữa שַׁבָּתוֹן và שַׁבַּת קֹדֶשׁ
  choice: 'Hai cụm đồng vị: “ngày nghỉ hoàn toàn, một ngày Sa-bát thánh”'
  alternative: Gộp thành “một ngày Sa-bát nghỉ hoàn toàn và thánh”
  rationale: Giữ nhịp và sức nặng của hai danh ngữ Hê-bơ-rơ, trong đó cụm thứ hai xác định tính chất thánh và sự quy hướng về Đức Giê-hô-va.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ sắc thái lời chỉ dẫn dành cho toàn thể cộng đồng; “Sa-bát” là thuật ngữ quen thuộc. Các dấu chú thích [a], [b] đều xuất hiện ngay sau phần văn bản liên quan.
