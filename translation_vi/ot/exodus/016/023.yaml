- from: 'Ông nói với họ: “Đây là điều Đức Giê-hô-va đã phán: Ngày mai là ngày nghỉ hoàn toàn, một ngày Sa-bát thánh dành cho Đức Giê-hô-va.[a] Những gì các ngươi muốn nướng thì hãy nướng; những gì muốn luộc thì hãy luộc.[b] Tất cả phần còn dư, hãy để riêng cho mình và giữ lại đến sáng.”'
  to: 'Ông nói với họ: “Đây là điều Yahweh đã phán: Ngày mai là một ngày nghỉ trọng thể, một ngày Sa-bát thánh cho Yahweh.[a] Các ngươi sẽ nướng gì thì hãy nướng, sẽ luộc gì thì hãy luộc.[b] Tất cả phần còn lại, hãy để dành cho mình để giữ đến sáng.”'
  rationale: 'Bản sửa bảo toàn các thành phần của tiếng Hê-bơ-rơ: lời phán đã được Yahweh nói, danh ngữ kép về ngày nghỉ và Sa-bát thánh, hai mệnh lệnh lặp song hành, và việc để phần dư lại nhằm giữ đến sáng. Các điều chỉnh loại bỏ sắc thái không có trong nguồn, tăng tính tự nhiên hiện đại, và thống nhất cách chuyển Danh YHWH với hồ sơ dự án.'
