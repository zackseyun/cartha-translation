  text: An omer is a tenth of an ephah[a].
translation:
  language: vi
  text: Một ô-me bằng một phần mười ê-pha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ô-me và ê-pha là các đơn vị đo thể tích vật khô cổ của người Hê-bơ-rơ; câu này xác định một ô-me bằng một phần mười ê-pha.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֹמֶר
  choice: một ô-me
  rationale: עֹמֶר là đơn vị đo lường khô của người Hê-bơ-rơ cổ; phiên âm giúp tránh quy đổi thiếu chính xác sang đơn vị hiện đại. Trong câu định nghĩa, “một ô-me” tự nhiên trong tiếng Việt.
- source_word: עֲשִׂרִית
  choice: một phần mười
  rationale: Từ này chỉ một phân số, nghĩa là một phần mười; cách diễn đạt này rõ ràng và chính xác.
- source_word: הָאֵיפָה
  choice: ê-pha
  rationale: אֵיפָה là một đơn vị đo lường khô cổ khác; giữ bằng hình thức phiên âm để bảo toàn khái niệm văn hóa và quan hệ định lượng trong câu.
- source_word: הוּא
  choice: bằng
  rationale: Đại từ đảm nhiệm chức năng liên kết trong mệnh đề danh từ. Tiếng Việt dùng “bằng” tự nhiên để diễn đạt quan hệ tương đương giữa hai đơn vị đo.
- source_word: וְ
  choice: ''
  rationale: Liên từ mở đầu có chức năng chuyển sang lời giải thích. Không dịch riêng giúp câu định nghĩa tự nhiên trong tiếng Việt mà không làm mất nội dung mệnh đề.
