  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se: “Các ngươi còn khước từ tuân giữ các điều răn và luật lệ của ta cho đến bao giờ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những lời chỉ dạy của ta.” Từ Hê-bơ-rơ torot (số nhiều của torah) có thể chỉ sự chỉ dạy có thẩm quyền, cũng như luật lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng kể chuyện nối tiếp đưa diễn biến tiến lên; “Bấy giờ” tự nhiên trong tiếng Việt, còn “phán” phù hợp với lời Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời, không thay bằng một tước hiệu.
- source_word: עַד אָנָה
  choice: cho đến bao giờ
  rationale: Thành ngữ diễn tả sự kéo dài của tình trạng bất tuân và giữ được sắc thái quở trách trong câu hỏi tu từ.
- source_word: מֵאַנְתֶּם
  choice: còn khước từ
  rationale: Động từ chỉ sự từ chối hoặc không chịu làm; “còn” biểu đạt tính tiếp diễn mà không buộc câu vào một thì tiếng Việt không tự nhiên.
- source_word: לִשְׁמֹר
  choice: tuân giữ
  rationale: Trong ngữ cảnh điều răn, động từ שׁמר mang nghĩa giữ và làm theo; “tuân giữ” vừa rõ nghĩa vừa giữ văn phong trang trọng.
- source_word: מִצְוֺתַי
  choice: các điều răn của ta
  rationale: Giữ sắc thái mệnh lệnh có thẩm quyền và ngôn ngữ giao ước.
- source_word: וְתוֹרֹתָי
  choice: và luật lệ của ta
  rationale: Dạng số nhiều của תורה ở đây song song với “điều răn” và mang hiệu lực quy phạm; nghĩa rộng hơn là “những lời chỉ dạy” được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; chuyển tự “Yahweh” bảo toàn tính chất danh riêng thay vì thay thế bằng tước hiệu.
- issue: Nghĩa của תּוֹרָה ở dạng số nhiều với hậu tố ngôi thứ nhất
  choice: luật lệ của ta
  alternative: những lời chỉ dạy của ta
  rationale: “Luật lệ” làm rõ hiệu lực quy phạm trong lời quở trách, nhưng chú thích bảo toàn nghĩa “sự chỉ dạy” vốn cũng có thể có trong từ Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” vì động từ ở số nhiều và đây là lời quở trách hướng đến cộng đồng; dùng cặp xưng hô “các ngươi—ta” phù hợp lời phán có thẩm quyền. Dấu chú thích đặt ngay sau toàn bộ câu hỏi vì chú thích liên quan đến cụm cuối câu.
