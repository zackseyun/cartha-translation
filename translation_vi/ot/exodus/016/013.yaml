    rationale: Tiếng Hê-bơ-rơ chỉ định vị lớp sương “quanh trại”, không mô tả hành động bao vây. Đổi thành “một lớp sương quanh trại” giữ chính xác quan hệ không gian và tự nhiên hơn.
