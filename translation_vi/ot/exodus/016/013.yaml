  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: vi
  text: Đến chiều tối, chim cút kéo đến phủ kín trại; sáng hôm sau, có một lớp sương quanh trại.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Đến chiều tối
  rationale: Cách diễn đạt tự nhiên trong văn kể chuyện tiếng Việt, vừa thể hiện mốc thời gian vừa nối tiếp diễn biến mà không dịch nặng nề động từ היה.
- source_word: וַתַּעַל הַשְּׂלָו
  choice: chim cút kéo đến
  rationale: שְׂלָו chỉ chim cút theo nghĩa tập hợp. Động từ עלה có nghĩa cơ bản là đi/lên; trong ngữ cảnh một đàn chim xuất hiện tại trại, “kéo đến” truyền đạt tự nhiên chuyển động và tính tập thể mà không làm câu tối nghĩa.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: phủ kín trại
  rationale: כסה là che hoặc phủ; “phủ kín” diễn đạt rõ mức độ đàn chim tràn khắp khu trại. “Trại” là cách gọi gọn, dễ hiểu cho מַחֲנֶה trong ngữ cảnh này.
- source_word: וּבַבֹּקֶר
  choice: sáng hôm sau
  rationale: Trong chuỗi kể chuyện từ chiều tối sang buổi sáng kế tiếp, “sáng hôm sau” là cách diễn đạt tự nhiên và rõ ràng trong tiếng Việt.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: có một lớp sương
  rationale: שִׁכְבָה chỉ một lớp hoặc khối nằm phủ. Cấu trúc hiện hữu “có một lớp sương” chuyển tải chính xác ý câu và tự nhiên hơn cách bám sát trật tự từ Hê-bơ-rơ.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: bao quanh trại
  rationale: Diễn đạt trực tiếp vị trí vòng quanh khu trại, phù hợp với סָבִיב לַמַּחֲנֶה.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng dấu chấm phẩy để làm rõ hai diễn biến đối xứng vào chiều tối và sáng hôm sau. Không thêm chú thích cho biến thể trật tự “một lớp sương ở quanh trại”/“có một lớp sương bao quanh trại”, vì đây chỉ là khác biệt cú pháp khi chuyển sang tiếng Việt, không tạo ra khác biệt đáng kể về nghĩa.
