source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: vi
  text: 'Môi-se nói: “Khi Yahweh ban cho anh em thịt để ăn vào buổi chiều và bánh vào buổi sáng cho no nê, vì Yahweh nghe những lời oán trách mà anh em oán trách Ngài[a]—chúng tôi là gì chứ? Những lời oán trách của anh em không nhằm vào chúng tôi, mà nhằm vào Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ lặp danh từ và động từ cùng gốc: “những lời oán trách ... mà anh em oán trách.” Sự lặp lại làm lời cáo trách mạnh hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתֵת
  choice: Khi ... ban
  rationale: Giới từ בְּ đi với động từ nguyên mẫu kết hợp נתן diễn tả hoàn cảnh thời gian; “khi ... ban” tự nhiên trong tiếng Việt và phù hợp với lời báo trước của Môi-se.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước יהוה thay vì thay bằng một tước hiệu, phù hợp trực tiếp với văn bản Hê-bơ-rơ.
- source_word: בָּשָׂר
  choice: thịt
  rationale: Trong ngữ cảnh thức ăn, “thịt” là nghĩa tự nhiên và chính xác.
- source_word: לֶחֶם
  choice: bánh
  rationale: Giữ hình ảnh cụ thể của לֶחֶם trong trình thuật về thức ăn được ban vào buổi sáng.
- source_word: לִשְׂבֹּעַ
  choice: cho no nê
  rationale: Động từ שבע diễn tả ăn đến mức thỏa mãn; “cho no nê” rõ ràng, tự nhiên và truyền đạt ý dư dật.
- source_word: בִּשְׁמֹעַ
  choice: vì ... đã nghe
  rationale: 'Cấu trúc בְּ với động từ nguyên mẫu ở đây mang sắc thái nguyên nhân: việc ban thức ăn đáp lại những lời oán trách mà Yahweh đã nghe.'
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: những lời oán trách mà anh em oán trách
  rationale: Giữ sự lặp lại giữa danh từ và động từ cùng gốc trong tiếng Hê-bơ-rơ để bảo tồn sức nhấn mạnh của lời cáo trách.
- source_word: עָלָיו
  choice: Ngài
  rationale: Trong kết cấu với động từ chỉ sự oán trách, עַל biểu thị đối tượng bị chống đối; tiếng Việt tự nhiên có thể nói “oán trách Ngài” mà không cần thêm “chống lại”.
- source_word: וְנַחְנוּ מָה
  choice: chúng tôi là gì chứ?
  rationale: Giữ đại từ nghi vấn “gì” của nguyên văn, nhấn mạnh sự không đáng kể của Môi-se và A-rôn với tư cách đối tượng của lời oán trách.
- source_word: לֹא עָלֵינוּ תְלֻנֹּתֵיכֶם כִּי עַל יְהוָה
  choice: Những lời oán trách của anh em không nhằm vào chúng tôi, mà nhằm vào Yahweh
  rationale: Bổ sung “nhằm vào” để câu tiếng Việt rõ nghĩa, đồng thời thể hiện đúng thế tương phản giữa “không ... mà ...” trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn tư cách danh riêng và không thay nó bằng tước hiệu, đồng thời tránh chọn một cách đọc mang tính hệ phái.
- issue: Đối tượng thực sự của lời oán trách
  choice: Không nhằm vào Môi-se và A-rôn, mà nhằm vào Yahweh
  alternative: Chỉ là lời phàn nàn về hoàn cảnh hoặc về các lãnh đạo
  rationale: Cấu trúc đối lập עָלֵינוּ ... עַל־יְהוָה xác định rõ hướng của sự oán trách, nhưng bản dịch không mở rộng thành một kết luận thần học vượt quá câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng; dùng “Ngài” để chỉ Yahweh. Cố ý giữ phần lặp hơi nặng ở mệnh đề oán trách vì đó là nét tu từ có thật của nguyên văn, kèm chú thích để người đọc hiểu.
