- from: 'Môi-se nói: “Khi Yahweh ban cho anh em thịt để ăn vào buổi chiều và bánh vào buổi sáng cho no nê, vì Yahweh đã nghe những lời oán trách mà anh em oán trách Ngài[a]—chúng tôi là gì chứ? Những lời oán trách của anh em không nhằm vào chúng tôi, mà nhằm vào Yahweh.”'
  to: 'Môi-se nói: “Khi Yahweh ban cho anh em thịt để ăn vào buổi chiều và bánh vào buổi sáng cho no nê, vì Yahweh nghe những lời oán trách mà anh em oán trách Ngài[a]—chúng tôi là gì chứ? Những lời oán trách của anh em không nhằm vào chúng tôi, mà nhằm vào Yahweh.”'
