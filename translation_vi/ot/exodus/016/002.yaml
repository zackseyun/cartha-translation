    rationale: Động từ này trong ngữ cảnh Xuất Ê-díp-tô Ký chỉ sự than phiền/oán trách của cộng đồng đối với người lãnh đạo. “Lẩm bẩm” chủ yếu gợi nói lẩm nhẩm hoặc nói nhỏ; còn “lằm bằm” không phải dạng chính tả chuẩn.
