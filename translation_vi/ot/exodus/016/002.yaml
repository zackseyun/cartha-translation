  yaml_path: translation/ot/exodus/016/002.yaml
  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: vi
  text: Cả cộng đồng người Israel[a] oán trách Môi-se và A-rôn trong hoang mạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; cũng có thể dịch theo lối truyền thống là “con cái Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: lằm bằm
  rationale: Động từ לוּן trong ngữ cảnh này diễn tả sự than phiền mang tính bất mãn và chống đối. “Lằm bằm” tự nhiên trong tiếng Việt, đồng thời giữ được sắc thái tiêu cực của hành động tập thể.
- source_word: כָּל עֲדַת
  choice: cả cộng đồng
  rationale: כָּל nhấn mạnh tính toàn thể, còn עֵדָה chỉ cộng đồng Israel xét như một tập thể. “Cả cộng đồng” rõ nghĩa và tự nhiên hơn “toàn thể hội chúng” trong văn kể hiện đại.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: người Israel
  rationale: Cụm Hê-bơ-rơ có hình thức sát chữ là “các con trai Israel”, nhưng thường là danh xưng tập thể chỉ dân Israel. “Người Israel” truyền đạt đúng nghĩa trong tiếng Việt hiện đại; hình thức nguyên văn được bảo lưu trong chú thích.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: chống lại Môi-se và A-rôn
  rationale: Trong ngữ cảnh phàn nàn về các nhà lãnh đạo, עַל mang sắc thái đối nghịch. “Chống lại” giữ được lực đối kháng mạnh hơn “với” hoặc “về”.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, khô cằn, không nhất thiết là sa mạc cát. “Hoang mạc” vừa chính xác vừa phù hợp văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch danh xưng tập thể בְּנֵי יִשְׂרָאֵל
  choice: người Israel
  alternative: các con trai Israel; con cái Israel
  rationale: Trong cách dùng Hê-bơ-rơ tại đây, cụm từ có hình thức giống đực nhưng hoạt động như danh xưng dân tộc tập thể, bao gồm cả cộng đồng. Dịch “người Israel” không áp đặt một cách hiểu thần học riêng và tránh khiến độc giả hiện đại hiểu lầm rằng câu chỉ nói đến nam giới; chú thích vẫn cho biết hình thức sát chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cả cộng đồng” thay cho thuật ngữ mang sắc thái giáo hội như “hội chúng”; giữ các tên riêng quen thuộc trong Kinh Thánh tiếng Việt là “Môi-se” và “A-rôn”.
