- from: Cả cộng đồng người Israel[a] lằm bằm chống lại Môi-se và A-rôn trong hoang mạc.
  to: Cả cộng đồng người Israel[a] oán trách Môi-se và A-rôn trong hoang mạc.
  rationale: Thay “lằm bằm chống lại” bằng “oán trách” để sửa lỗi chính tả, diễn đạt tự nhiên hơn, và phản ánh đúng sắc thái than phiền quy trách chống lại Môi-se và A-rôn. Giữ “người Israel” trong thân bài như một danh xưng tập thể tự nhiên; chú thích bảo lưu hình thức giống đực của nguyên ngữ.
