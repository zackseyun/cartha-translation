  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: vi
  text: Hãy xem, Yahweh đã ban cho anh em ngày Sa-bát; vì thế, vào ngày thứ sáu, Ngài ban cho anh em bánh cho hai ngày. Mỗi người hãy ở lại chỗ mình; trong ngày thứ bảy, đừng ai ra khỏi chỗ mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng danh từ giống đực số ít trong các cách nói phân phối: “mỗi người nam” và “đừng người nam nào”; trong ngữ cảnh, cách dùng này chỉ từng cá nhân trong cộng đồng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Hãy thấy rằng
  rationale: Mệnh lệnh số nhiều của ראה vừa có thể chỉ việc nhìn thấy vừa có thể kêu gọi nhận biết. Cách dịch này giữ hình ảnh 'thấy' và nối tự nhiên với mệnh đề giải thích theo sau.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: đã ban ngày Sa-bát cho anh em
  rationale: Động từ hoàn thành diễn tả việc ban tặng đã được thực hiện; 'ban ... cho' tự nhiên và thể hiện ngày Sa-bát là ân huệ dành cho cộng đồng Israel.
- source_word: הַשַּׁבָּת
  choice: ngày Sa-bát
  rationale: Trong ngữ cảnh, danh từ chỉ ngày hay thể chế Sa-bát; thêm 'ngày' giúp độc giả Việt hiểu rõ mà không làm thay đổi nghĩa.
- source_word: עַל כֵּן
  choice: vì thế
  rationale: Diễn đạt trực tiếp quan hệ kết quả giữa việc ban ngày Sa-bát và việc cung cấp phần bánh gấp đôi.
- source_word: נֹתֵן
  choice: Ngài ban
  rationale: Phân từ có thể diễn tả hành động hiện tại hoặc thông lệ. Hiện tại đơn giữ được cả lời giải thích về sự chu cấp đang xảy ra lẫn khuôn mẫu thường lệ.
- source_word: לֶחֶם יוֹמָיִם
  choice: bánh đủ dùng trong hai ngày
  rationale: Cụm từ sát nghĩa là 'bánh của hai ngày'. Cách dịch này giữ danh từ cụ thể 'bánh' và làm rõ lượng bánh dành cho hai ngày.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: Mỗi người hãy ở yên tại chỗ mình
  rationale: ישב ở đây mang nghĩa ở lại, còn תַּחְתָּיו là cách nói chỉ nơi một người đang ở. 'Ở yên' truyền đạt rõ mệnh lệnh không đi ra.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: không ai được ra khỏi chỗ mình
  rationale: Thể cầu khiến phủ định có giá trị cấm đoán. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ sự lặp lại của ý 'chỗ mình'.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: trong ngày thứ bảy
  rationale: Giữ nguyên cách gọi ngày theo thứ tự trong nguồn Hê-bơ-rơ, không thêm 'trong tuần'.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản văn dùng trực tiếp danh riêng gồm bốn phụ âm; giữ dạng phiên âm Yahweh bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Phạm vi của אִישׁ trong mệnh lệnh phân phối
  choice: mỗi người / không ai
  alternative: mỗi người nam / không người nam nào
  rationale: אִישׁ là hình thức giống đực số ít nhưng ở đây được dùng theo lối phân phối cho từng thành viên trong cộng đồng. Tiếng Việt dùng 'mỗi người/không ai' tự nhiên hơn và không thu hẹp mệnh lệnh chỉ vào nam giới; chú thích bảo lưu đặc điểm hình thức của nguyên bản.
- issue: Phạm vi của lệnh không ra khỏi מְקֹמוֹ
  choice: không ai được ra khỏi chỗ mình
  alternative: không ai được rời khỏi nhà mình; không ai được rời khỏi trại
  rationale: מָקוֹם chỉ 'chỗ/nơi' và bản văn không xác định rõ là nhà, lều hay toàn trại. Giữ 'chỗ mình' để không giải quyết quá mức sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' cho đại từ số nhiều hướng đến cả cộng đồng Israel; viết hoa 'Ngài' theo quy ước tôn kính phổ biến trong tiếng Việt. Dấu chấm phẩy bảo toàn mạch nguyên nhân–kết quả và phân tách hai mệnh lệnh. Mọi dấu chú thích đều xuất hiện trong chính văn.
