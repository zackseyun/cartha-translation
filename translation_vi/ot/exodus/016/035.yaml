base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: vi
  text: Con dân Y-sơ-ra-ên đã ăn ma-na suốt bốn mươi năm, cho đến khi họ tới một vùng đất có dân cư[a]. Họ đã ăn ma-na cho đến khi tới ranh giới của xứ Ca-na-an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một vùng đất đã có người định cư.” Cụm từ này tương phản vùng đất có người sinh sống với hoang mạc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Con dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Y-sơ-ra-ên” nhưng thường là danh xưng tập thể chỉ toàn dân Y-sơ-ra-ên; “con dân Y-sơ-ra-ên” vừa giữ sắc thái giao ước vừa bao gồm cả cộng đồng.
- source_word: אָכְלוּ אֶת־הַמָּן
  choice: đã ăn ma-na
  rationale: Động từ Qal hoàn thành ở đây tóm lược một sự việc kéo dài trong quá khứ; “đã ăn” tự nhiên trong tiếng Việt. Ma-na là tên gọi quen thuộc của מָן.
- source_word: אַרְבָּעִים שָׁנָה
  choice: suốt bốn mươi năm
  rationale: “Suốt” diễn đạt rõ khoảng thời gian kéo dài mà không thêm ý ngoài nguyên văn.
- source_word: עַד־בֹּאָם
  choice: cho đến khi họ tới
  rationale: Cấu trúc עַד với động từ nguyên mẫu và hậu tố chỉ giới hạn thời gian; “tới” giữ nghĩa cơ bản của בוא, ít diễn giải hơn “tiến vào”.
- source_word: אֶל־אֶרֶץ נוֹשָׁבֶת
  choice: tới một vùng đất có dân cư
  rationale: Phân từ Niphal נוֹשָׁבֶת mô tả đất có người cư trú hoặc đã được định cư, tương phản với hoang mạc; cách nói này tự nhiên và rõ trong tiếng Việt.
- source_word: אֶל־קְצֵה אֶרֶץ כְּנָעַן
  choice: tới ranh giới của xứ Ca-na-an
  rationale: קְצֵה có thể chỉ mép, đầu mút hoặc ranh giới; trong ngữ cảnh địa lý, “ranh giới” là cách diễn đạt tự nhiên mà vẫn giữ phạm vi nghĩa của từ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con dân Y-sơ-ra-ên” cho danh xưng tập thể mang sắc thái giao ước; giữ nguyên sự lặp lại của “ăn ma-na” trong nguyên văn. Chỉ đặt chú thích tại chỗ có phương án dịch thực sự đáng lưu ý.
