  text: And Moses said to them[a], “Let no one leave any of it until morning.”
translation:
  language: vi
  text: 'Môi-se nói với họ: “Không ai được để lại chút nào cho đến sáng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng kể chuyện với waw nối tiếp thúc đẩy mạch thuật; tiếng Việt tự nhiên không cần dịch riêng liên từ וַ trong câu này.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng quen dùng trong tiếng Việt.
- source_word: אֲלֵהֶם
  choice: với họ
  rationale: Diễn đạt trực tiếp giới từ אֶל cùng hậu tố ngôi ba số nhiều mà không diễn giải 'họ' thành một nhóm cụ thể hơn.
- source_word: אִישׁ אַל
  choice: Không ai được
  rationale: אִישׁ có nghĩa phân phối trong câu cấm này, áp dụng cho từng người; 'không ai được' vừa tự nhiên vừa giữ trọn phạm vi phổ quát.
- source_word: יוֹתֵר
  choice: để lại
  rationale: Trong ngữ cảnh ma-na, động từ יתר chỉ việc để dư hoặc giữ lại một phần.
- source_word: מִמֶּנּוּ
  choice: chút nào
  rationale: Đại từ số ít giống đực quy chiếu tập hợp về ma-na; kết hợp với câu phủ định, 'chút nào' chuyển tải tự nhiên ý 'bất cứ phần nào từ đó'.
- source_word: עַד בֹּקֶר
  choice: cho đến sáng
  rationale: Giữ nguyên giới hạn thời gian được biểu thị bởi עַד; 'cho đến sáng' là cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Không dùng chú thích vì nghĩa phân phối của אִישׁ được diễn đạt rõ ngay bằng 'không ai'; thêm chú thích sẽ không cung cấp thông tin cần thiết cho độc giả tiếng Việt.
