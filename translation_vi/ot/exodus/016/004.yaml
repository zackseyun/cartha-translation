  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với Môi-se: “Này, Ta sắp làm mưa bánh từ trời xuống cho các ngươi. Dân chúng sẽ đi ra và lượm phần đủ dùng cho từng ngày, ngày nào lượm phần ngày ấy,[a] để Ta thử họ xem họ có sống theo lời chỉ dạy của Ta hay không.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “việc của một ngày trong ngày ấy,” nghĩa là mỗi ngày lượm phần cần dùng cho ngày đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh giao ước đã quen thuộc trong tiếng Việt, thay vì thay bằng một tước hiệu chung.
- source_word: הִנְנִי מַמְטִיר
  choice: Này, Ta sắp làm mưa
  rationale: הִנְנִי mở đầu lời loan báo và phân từ Hiphil מַמְטִיר có thể diễn tả hành động sắp xảy ra; cách dịch này vừa giữ sắc thái gây chú ý vừa tự nhiên trong tiếng Việt.
- source_word: לֶחֶם מִן הַשָּׁמַיִם
  choice: bánh từ trời xuống
  rationale: Giữ danh từ cụ thể לֶחֶם là “bánh”, không khái quát thành “thức ăn”; “xuống” làm rõ hướng của hành động làm mưa vốn đã có trong nguyên văn.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: phần đủ dùng cho từng ngày, ngày nào lượm phần ngày ấy
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ theo nghĩa lượng cần thiết mỗi ngày và giới hạn việc thu lượm vào chính ngày đó.
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: để Ta thử họ
  rationale: Hậu tố số ít quy chiếu đến danh từ tập hợp “dân”; tiếng Việt tự nhiên dùng “họ”. “Thử” giữ ý kiểm nghiệm mà không hàm ý cám dỗ phạm tội.
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: xem họ có sống theo lời chỉ dạy của Ta hay không
  rationale: “Sống theo” chuyển tải tự nhiên ẩn dụ “bước đi trong”; “lời chỉ dạy” phản ánh nghĩa rộng của תּוֹרָה trong bối cảnh trước Sinai mà không làm nhẹ thẩm quyền của lời Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch תּוֹרָה trong bối cảnh trước khi ban luật pháp tại Sinai
  choice: lời chỉ dạy của Ta
  alternative: luật pháp của Ta
  rationale: תּוֹרָה có thể chỉ sự dạy bảo hay huấn thị có thẩm quyền. Trong ngữ cảnh trực tiếp, Đức Chúa Trời đang thử xem dân có tuân theo chỉ thị về việc thu lượm hay không; vì vậy “lời chỉ dạy” tránh áp đặt trước toàn bộ bộ luật Sinai, đồng thời vẫn giữ sức nặng của mệnh lệnh thần thượng.
- issue: Ẩn dụ “bước đi” chỉ cách ứng xử
  choice: sống theo
  alternative: bước đi trong
  rationale: “Sống theo” truyền đạt rõ ý về nếp sống và sự vâng phục trong tiếng Việt hiện đại; cách dịch sát chữ “bước đi trong” dễ gây khó hiểu. Không rút gọn thành “vâng lời” để vẫn giữ phạm vi rộng của lối sống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” giữ giọng phán của Đức Chúa Trời; “các ngươi” chỉ cộng đồng Israel. Dùng “lượm” cho hành động thu nhặt vật nhỏ trên mặt đất. Dấu chân chú [a] được đặt ngay sau cụm từ mà chú thích giải thích.
