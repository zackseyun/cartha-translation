  variant: modern standard Vietnamese
source:
  edition: WLC
  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: vi
  text: 'Đây là điều Đức Gia-vê đã truyền: “Hãy thu nhặt thứ ấy, mỗi người tùy theo sức ăn của mình: một ô-me[a] cho mỗi đầu người, theo số người của anh em. Mỗi người hãy lấy phần cho những người ở trong lều mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ô-me là một đơn vị đo lường khô; xem câu 36.
    reason: Giải thích đơn vị đo lường cổ không có tương đương hiện đại chính xác ngay trong câu.
lexical_decisions:
- source_word: הַדָּבָר
  choice: điều
  rationale: Trong công thức giới thiệu một mệnh lệnh, דָּבָר chỉ nội dung được truyền. “Điều” tự nhiên hơn “lời” trong tiếng Việt mà vẫn giữ nghĩa khái quát của từ Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: Hãy thu nhặt thứ ấy
  rationale: לקט nói đến việc nhặt, gom lương thực; đại từ chỉ vật được hiểu theo ngữ cảnh là vật vừa được nhắc đến.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: mỗi người tùy theo sức ăn của mình
  rationale: אִישׁ mang ý phân phối từng cá nhân; thành ngữ לְפִי אָכְלוֹ nói đến lượng mỗi người có thể hoặc cần ăn, nên “tùy theo sức ăn” vừa rõ vừa gần cấu trúc nguồn.
- source_word: עֹמֶר
  choice: ô-me
  rationale: Đây là tên một đơn vị đo lường khô cụ thể; phiên âm tránh gán một giá trị hiện đại không chắc chắn.
- source_word: לַגֻּלְגֹּלֶת
  choice: mỗi đầu người
  rationale: Nghĩa đen là “cho mỗi sọ/đầu”, một lối nói dùng khi kiểm đếm người. “Mỗi đầu người” giữ được hình ảnh và vẫn dễ hiểu trong tiếng Việt.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: theo số người của anh em
  rationale: נֶפֶשׁ ở đây chỉ từng người, không phải “linh hồn”; cách dịch này giữ rõ ý đếm số thành viên.
- source_word: לַאֲשֶׁר בְּאָהֳלוֹ
  choice: cho những người ở trong lều mình
  rationale: Giữ hình ảnh cụ thể của lều và không diễn giải hẹp hơn thành một khái niệm gia đình hay hộ gia đình.
- source_word: תִּקָּחוּ
  choice: hãy lấy
  rationale: Hình thức ngôi hai số nhiều mang lực mệnh lệnh; kết hợp với “mỗi người” diễn đạt tự nhiên mệnh lệnh phân phối trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh riêng bốn phụ âm. “Đức Giê-hô-va” bảo tồn danh riêng thay vì thay bằng tước hiệu, đồng thời phù hợp lối xưng hô trang trọng và quen thuộc trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ nhịp mệnh lệnh của nguyên văn, hình ảnh cụ thể “lều”, và ý phân phối theo từng người; tránh dùng “linh hồn” cho נֶפֶשׁ trong ngữ cảnh kiểm đếm.
