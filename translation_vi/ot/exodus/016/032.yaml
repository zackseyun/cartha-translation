  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: vi
  text: 'Môi-se nói: “Đây là điều Yahweh đã truyền: Hãy giữ lại một ô-me đầy ma-na[a] cho các thế hệ của anh em, để các thế hệ ấy thấy bánh mà Ta đã cho anh em ăn trong hoang mạc, khi Ta đưa anh em ra khỏi đất Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ô-me là một đơn vị đo dung tích cổ; cụm này theo sát nguyên văn có nghĩa là “đầy một ô-me” ma-na.
    reason: Giải thích đơn vị văn hóa cổ và cách diễn đạt của nguyên văn, không đưa ra quy đổi thể tích hiện đại còn có tính ước lượng.
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Môi-se nói
  rationale: Lối kể chuyện tự nhiên trong tiếng Việt; không cần thêm “và” vì câu vẫn nối mạch rõ ràng.
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: Đây là điều ... đã truyền
  rationale: דָּבָר ở đây chỉ nội dung mệnh lệnh; “điều” tự nhiên và trang trọng hơn cách dịch sát chữ “vật” hay “lời”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh giao ước YHWH thành dạng quen thuộc, rõ là danh riêng trong tiếng Việt, thay vì thay bằng tước hiệu.
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: một ô-me đầy ma-na
  rationale: Giữ nguyên đơn vị đo cổ ô-me và nói rõ vật được đong là ma-na theo văn cảnh; “đầy” phản ánh מְלֹא.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: giữ lại ... cho các thế hệ mai sau của anh em
  rationale: Diễn đạt tự nhiên mục đích bảo tồn làm chứng qua những thế hệ kế tiếp.
- source_word: לְמַעַן יִרְאוּ
  choice: để họ thấy
  rationale: Giữ nguyên mệnh đề mục đích và chủ thể hàm ẩn là các thế hệ vừa được nhắc đến.
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: thứ bánh mà Ta đã cho anh em ăn
  rationale: Giữ nghĩa đen “bánh” của לֶחֶם và sắc thái sai khiến của thể Hiphil “cho ăn”.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: “Hoang mạc” bao quát vùng hoang vu, phù hợp bối cảnh Xuất Hành hơn nghĩa hẹp của “sa mạc”.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: khi Ta đưa anh em ra khỏi đất Ai Cập
  rationale: Thể hiện tự nhiên quan hệ thời gian của cấu trúc nguyên mẫu với בְּ và giữ hình ảnh cuộc xuất hành.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng tước hiệu; dạng “Đức Giê-hô-va” dễ nhận biết và phù hợp văn phong Kinh Thánh tiếng Việt.
- issue: Ngôi của lời Đức Chúa Trời nằm trong lời Môi-se thuật lại
  choice: Ta ... anh em
  alternative: Ngài ... họ
  rationale: Nguyên văn chuyển trực tiếp sang ngôi thứ nhất của Đức Chúa Trời trong chính mệnh lệnh được trích dẫn; bản dịch giữ sự chuyển ngôi này thay vì làm phẳng thành lời thuật gián tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng; viết hoa “Ta” để làm rõ Đức Giê-hô-va đang phán trong lời được Môi-se trích dẫn.
