revisions:
- from: 'Môi-se nói: “Đây là điều Đức Giê-hô-va đã truyền: Hãy giữ lại một ô-me đầy ma-na[a] cho các thế hệ mai sau của anh em, để họ thấy thứ bánh mà Ta đã cho anh em ăn trong hoang mạc, khi Ta đưa anh em ra khỏi đất Ai Cập.”'
  to: 'Môi-se nói: “Đây là điều Yahweh đã truyền: Hãy giữ lại một ô-me đầy ma-na[a] cho các thế hệ của anh em, để các thế hệ ấy thấy bánh mà Ta đã cho anh em ăn trong hoang mạc, khi Ta đưa anh em ra khỏi đất Ai Cập.”'
  rationale: Bản sửa thay hình thức danh riêng bằng “Yahweh” theo audit trail, điều chỉnh “các thế hệ mai sau” thành cách nói sát nguồn hơn, và thay chú thích định lượng không cần thiết bằng chú thích trung tính. Các yếu tố còn lại được giữ vì phản ánh đúng ý nghĩa và ngôi lời trực tiếp của nguyên văn.
