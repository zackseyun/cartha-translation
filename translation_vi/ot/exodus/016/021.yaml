  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cứ mỗi sáng” để tái hiện ý lặp của tiếng Hê-bơ-rơ; dùng “thứ ấy” nhằm giữ đại từ hồi chỉ thay vì gọi đích danh ma-na.
