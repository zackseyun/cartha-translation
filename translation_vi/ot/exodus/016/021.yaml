  yaml_path: translation/ot/exodus/016/021.yaml
  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: vi
  text: Họ cứ mỗi sáng lại thu nhặt thứ ấy, mỗi người tùy theo sức ăn của mình; khi mặt trời nóng lên, nó tan ra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: thu nhặt
  rationale: Động từ לקט chỉ việc nhặt, gom hoặc thu lượm, đặc biệt là thức ăn; “thu nhặt” diễn đạt tự nhiên và giữ được hành động cụ thể.
- source_word: אֹתוֹ
  choice: thứ ấy
  rationale: Đại từ tân ngữ số ít chỉ lại vật đã được nói đến trong ngữ cảnh trước; “thứ ấy” giữ cách quy chiếu bằng đại từ mà không chèn danh từ “ma-na” vào câu.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: cứ mỗi sáng
  rationale: Cụm “vào buổi sáng, vào buổi sáng” có ý phân phối và lặp lại. “Cứ mỗi sáng” là cách nói Việt ngữ tự nhiên, thể hiện rõ hành động diễn ra hằng ngày.
- source_word: אִישׁ
  choice: mỗi người
  rationale: Danh từ số ít giống đực được dùng theo nghĩa phân phối. Trong tiếng Việt, “mỗi người” vừa tự nhiên vừa giữ đúng phạm vi bao quát của cách dùng này.
- source_word: כְּפִי אָכְלוֹ
  choice: tùy theo sức ăn của mình
  rationale: Theo sát thành ngữ là “theo miệng sự ăn của người ấy”; ý nghĩa là theo nhu cầu hoặc khả năng ăn của từng người. “Tùy theo sức ăn của mình” truyền đạt thành ngữ đó rõ ràng mà vẫn giữ sắc thái cá thể.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: khi mặt trời nóng lên
  rationale: Mệnh đề dùng động từ chỉ việc trở nên nóng, với mặt trời làm chủ thể. “Khi mặt trời nóng lên” chuyển tải tự nhiên quan hệ thời gian trong mạch kể.
- source_word: וְנָמָס
  choice: nó tan ra
  rationale: Động từ מסס có nghĩa là tan chảy hoặc tan biến. “Tan ra” phù hợp với vật được nhắc đến và không xác định quá mức cơ chế vật lý.
theological_decisions: []
