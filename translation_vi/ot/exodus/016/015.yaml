source:
  edition: WLC
  text: וַ/יִּרְא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יֹּ֨אמְר֜וּ אִ֤ישׁ אֶל אָחִי/ו֙ מָ֣ן ה֔וּא כִּ֛י לֹ֥א יָדְע֖וּ מַה ה֑וּא וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֲלֵ/הֶ֔ם ה֣וּא הַ/לֶּ֔חֶם אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: vi
  text: 'Khi con cái Israel thấy vật ấy, họ nói với nhau[a]: “Cái gì vậy?”[b] Vì họ không biết đó là vật gì. Môi-se nói với họ: “Đó là bánh mà Yahweh đã ban cho anh em để ăn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ, theo sát nghĩa: “mỗi người với anh em mình.” Trong cấu trúc với động từ “nói”, đây là thành ngữ có nghĩa là họ nói với nhau.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ được dịch là “Cái gì vậy?” theo truyền thống được liên hệ với tên gọi “ma-na”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Cách dịch này giữ hình ảnh thân tộc của cụm Hê-bơ-rơ, đồng thời là lối diễn đạt trang trọng và quen thuộc trong tiếng Việt.
- source_word: אִישׁ אֶל אָחִיו
  choice: họ hỏi nhau
  rationale: Cụm này dịch sát là ‘mỗi người nói với anh em mình’, nhưng trong ngữ cảnh là thành ngữ chỉ việc những người trong nhóm nói với nhau; ‘họ hỏi nhau’ diễn đạt tự nhiên và phù hợp với câu hỏi theo sau.
- source_word: מָן הוּא
  choice: Cái gì vậy?
  rationale: מָן được hiểu theo chức năng nghi vấn trong ngữ cảnh, như mệnh đề kế tiếp xác nhận rằng họ không biết vật ấy là gì. Cách dịch này không biến từ đó thành tên riêng ‘ma-na’ quá sớm.
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: họ không biết đó là vật gì
  rationale: Diễn đạt trực tiếp lời giải thích của người kể chuyện bằng tiếng Việt tự nhiên, đồng thời duy trì sự liên hệ với câu hỏi trước đó.
- source_word: הוּא הַלֶּחֶם
  choice: Đó là bánh
  rationale: Đại từ cùng danh từ xác định vật mà dân Israel vừa thấy; ‘Đó là bánh’ tự nhiên trong lời giải thích của Môi-se.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó giữ cách gọi trực tiếp trong nguồn Hê-bơ-rơ.
- source_word: לְאָכְלָה
  choice: để ăn
  rationale: Cụm từ diễn tả mục đích của việc ban bánh; ‘để ăn’ ngắn gọn, tự nhiên và sát nghĩa.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước יהוה. Giữ ‘Yahweh’ bảo tồn tính chất danh riêng, không thay bằng tước hiệu.
- issue: Có xem מָן là tên riêng ‘ma-na’ ngay trong câu hỏi hay không
  choice: 'Dịch theo nghĩa nghi vấn: “Cái gì vậy?”'
  alternative: Ma-na; Đây là ma-na
  rationale: Mệnh đề ‘vì họ không biết đó là vật gì’ cho thấy đây là câu hỏi. Dịch thành tên riêng ở đây sẽ làm mờ diễn tiến kể chuyện và lối chơi chữ liên quan đến tên gọi về sau.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘vật ấy/đó là vật gì’ để nói về vật chưa được nhận biết; dùng ‘anh em’ trong lời Môi-se nói với cộng đồng Israel. Các dấu chú thích được đặt ngay sau cụm từ tương ứng.
