    rationale: Nguyên văn nói rằng họ «nói» mỗi người với anh em mình; nội dung lời nói là một câu hỏi. «Họ nói với nhau» bảo toàn động từ nguồn, còn câu trích dẫn tự nó biểu thị câu hỏi.
  - severity: low
