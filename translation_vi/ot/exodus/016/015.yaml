    rationale: Cụm này sát nghĩa là «mỗi người với anh em mình» và phụ thuộc vào động từ «họ nói» trong câu. Chú thích nên phân biệt phần dịch sát của cụm với nghĩa thành ngữ trong toàn cấu trúc.
