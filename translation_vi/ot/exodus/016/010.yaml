  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: vi
  text: Khi A-rôn đang nói với toàn thể cộng đồng con cháu Y-sơ-ra-ên, họ quay về phía hoang mạc, và kìa, vinh quang của Yahweh hiện ra trong đám mây.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: Khi ... đang nói
  rationale: וַיְהִי tiếp nối mạch kể chuyện, còn כ với động từ nguyên mẫu diễn tả sự đồng thời. Tiếng Việt tự nhiên không cần dịch וַיְהִי thành một mệnh đề riêng; cấu trúc “khi ... đang” giữ rõ sự việc xảy ra trong lúc A-rôn nói.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toàn thể cộng đồng con dân Y-sơ-ra-ên
  rationale: עֵדָה chỉ cộng đồng dân chúng được quy tụ. “Con dân Y-sơ-ra-ên” vừa tự nhiên trong tiếng Việt, vừa giữ được sắc thái thuộc về dòng dõi Israel của בְּנֵי יִשְׂרָאֵל mà không hàm ý chỉ nam giới.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: họ quay về phía hoang mạc
  rationale: פנה với אֶל diễn tả việc xoay về hướng nào đó; “quay về phía” truyền đạt đúng hướng chuyển động mà không diễn giải quá mức.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: הִנֵּה là từ chỉ xuất, đột ngột hướng sự chú ý đến cảnh tượng tiếp theo. “Kìa” giữ được sức gợi và sắc thái trang trọng trong tiếng Việt hiện đại.
- source_word: כְּבוֹד יְהוָה
  choice: vinh quang của Yahweh
  rationale: כָּבוֹד ở đây là sự vinh hiển hữu hình của Đức Chúa Trời; kết cấu sở hữu được giữ trực tiếp. Danh riêng יהוה được chuyển tự là “Yahweh”.
- source_word: נִרְאָה
  choice: hiện ra
  rationale: Dạng Niphal của ראה trong ngữ cảnh này diễn tả việc trở nên hữu hình hay xuất hiện; “hiện ra” tự nhiên và không buộc phải hiểu là bị động “được nhìn thấy”.
- source_word: בֶּעָנָן
  choice: trong đám mây
  rationale: Mạo từ xác định trong בֶּעָנָן nói đến đám mây cụ thể đã gắn với sự hiện diện của Yahweh trong trình thuật; “đám mây” truyền đạt tính xác định theo văn cảnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Chuyển tự “Yahweh” giữ đây là danh riêng, không thay bằng một tước hiệu.
- issue: Ý nghĩa của כְּבוֹד trong sự hiện ra
  choice: vinh quang
  alternative: vinh hiển; ánh huy hoàng
  rationale: “Vinh quang” giữ phạm vi nghĩa thần học và biểu hiện hữu hình của כָּבוֹד mà không thu hẹp thành ánh sáng hay một hiện tượng vật lý cụ thể.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Trong công thức tập thể này, בְּנֵי chỉ toàn dân Israel chứ không nhất thiết chỉ nam giới. “Con dân” bảo toàn quan hệ dòng dõi và bản sắc dân tộc mà không tạo một giới hạn giới tính không có trong ngữ cảnh.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “A-rôn”, “Y-sơ-ra-ên” theo dạng tên quen thuộc trong tiếng Việt; giữ “Yahweh” làm danh riêng. Không cần chú thích vì các lựa chọn chính có thể được truyền đạt rõ ngay trong câu.
