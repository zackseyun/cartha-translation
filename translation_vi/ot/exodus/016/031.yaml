base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/031.yaml
  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: vi
  text: Nhà Y-sơ-ra-ên gọi nó là ma-na[a]. Nó giống như hạt ngò trắng[b], và vị của nó như bánh mỏng có mật ong[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: man; theo truyền thống được phiên âm là “ma-na”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “giống như hạt ngò, màu trắng”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “như một chiếc bánh mỏng có mật ong” hoặc “như bánh mỏng với mật ong”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: gọi
  rationale: Động từ קרא ở đây diễn tả việc đặt hoặc gọi tên; “gọi” trực tiếp và tự nhiên, đồng thời ít diễn giải hơn “đặt tên”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Nhà Y-sơ-ra-ên
  rationale: Giữ cách gọi tập thể sát với thành ngữ Hê-bơ-rơ “nhà Israel”, bằng hình thức tên riêng quen thuộc trong tiếng Việt.
- source_word: אֶת־שְׁמוֹ
  choice: gọi thức ăn ấy là
  rationale: Tiếng Hê-bơ-rơ nói sát nghĩa là “gọi tên nó”; cách diễn đạt tiếng Việt này giữ hành động gọi tên, đồng thời làm rõ đại từ chỉ về thức ăn vừa được mô tả trong ngữ cảnh.
- source_word: מָן
  choice: ma-na
  rationale: Dùng dạng phiên âm truyền thống, dễ nhận biết trong tiếng Việt; chú thích ghi dạng Hê-bơ-rơ man.
- source_word: וְהוּא
  choice: Nó
  rationale: Đại từ nối lại chủ thể để mở đầu phần miêu tả; tiếng Việt không cần thêm hệ từ ở đây.
- source_word: כְּזֶרַע גַּד לָבָן
  choice: giống như hạt ngò màu trắng
  rationale: גַּד thường được nhận diện là ngò/coriander; đặt “màu trắng” sau danh từ cho tự nhiên và tránh ngụ ý chắc chắn rằng từ này chỉ bổ nghĩa riêng cho “hạt ngò” theo một cấu trúc duy nhất.
- source_word: וְטַעְמוֹ
  choice: và vị nó
  rationale: טַעַם chỉ vị hoặc hương vị; “vị” ngắn gọn, tự nhiên trong lời mô tả thức ăn.
- source_word: כְּצַפִּיחִת
  choice: như bánh mỏng
  rationale: Danh từ hiếm này có thể chỉ bánh mỏng hoặc bánh xốp; “bánh mỏng” dễ hiểu mà không xác định quá cụ thể loại bánh.
- source_word: בִּדְבָשׁ
  choice: pha mật ong
  rationale: Giới từ ב có thể chỉ thành phần hoặc sự kết hợp; “pha mật ong” diễn đạt tự nhiên ý bánh có mật ong, trong khi chú thích bảo lưu các khả năng dịch khác.
