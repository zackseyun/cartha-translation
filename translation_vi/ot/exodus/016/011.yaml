  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn lời của Đức Chúa Trời được chuyển là “phán”, cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và phân biệt phù hợp với lời nói thông thường.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng YHWH bằng dạng đã quen thuộc và trang trọng trong tiếng Việt là “Đức Giê-hô-va”, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל đánh dấu người tiếp nhận lời nói; “phán với Môi-se” là kết cấu tiếng Việt tự nhiên.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong ngữ cảnh này, nguyên mẫu לֵאמֹר là công thức mở đầu lời trực tiếp ở câu kế tiếp; “rằng” truyền đạt chức năng ấy tự nhiên hơn lối dịch sát hình thức “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng Việt hóa quen thuộc, trang trọng. “Yahweh” phản ánh cách phục nguyên phát âm được nhiều học giả ưa chuộng nhưng không hoàn toàn chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu hai chấm để báo hiệu lời trực tiếp tiếp nối ở câu 12; không thêm chú thích vì bản văn chính đã thể hiện YHWH bằng một danh riêng.
