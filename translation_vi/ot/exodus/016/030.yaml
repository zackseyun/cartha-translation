  text: So the people rested on the seventh day[a].
translation:
  language: vi
  text: Vậy, dân chúng nghỉ vào ngày thứ bảy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngừng lại”; động từ này có liên hệ với sự nghỉ ngơi trong ngày Sa-bát, nên dịch “giữ ngày Sa-bát” là cách diễn giải mở rộng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: nghỉ
  rationale: Động từ שׁבת ở thể qal có nghĩa cơ bản là ngừng hoặc nghỉ. Trong ngữ cảnh ngày thứ bảy, “nghỉ” tự nhiên trong tiếng Việt và không diễn giải quá mức thành “giữ ngày Sa-bát”.
- source_word: הָעָם
  choice: dân chúng
  rationale: עָם chỉ cộng đồng dân sự trong câu chuyện; “dân chúng” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: trong ngày thứ bảy
  rationale: Giới từ בְּ đi với יוֹם chỉ thời điểm; “trong ngày thứ bảy” vừa tự nhiên vừa giữ rõ danh từ “ngày” và số thứ tự.
- source_word: וַ
  choice: Vậy
  rationale: Waw nối tiếp đưa câu chuyện đến kết quả của mệnh lệnh trước đó; “Vậy” thể hiện mạch kết quả tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Có nên nói rõ việc giữ ngày Sa-bát ngay trong động từ hay không
  choice: Dịch là “nghỉ”
  alternative: “giữ ngày Sa-bát” hoặc “ngừng lại”
  rationale: Nguyên văn chỉ nói dân chúng ngừng/nghỉ; ý nghĩa Sa-bát đã rõ nhờ ngữ cảnh và cụm “ngày thứ bảy”. Cách dịch này tránh thêm một công thức mang tính diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Dân chúng” phù hợp với chủ thể tập thể; câu ngắn gọn theo cấu trúc của nguyên văn.
