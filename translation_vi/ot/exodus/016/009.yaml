  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se nói với A-rôn: “Hãy nói với toàn thể cộng đồng dân Y-sơ-ra-ên: ‘Hãy đến gần trước mặt Đức Giê-hô-va, vì Ngài đã nghe những lời than phiền của các ngươi.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt trình tự tự nhiên trong tiếng Việt mà không làm nặng câu.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toàn thể cộng đồng con dân Y-sơ-ra-ên
  rationale: “Cộng đồng” giữ nghĩa tập thể của עֵדָה; “con dân Y-sơ-ra-ên” vừa tự nhiên trong tiếng Việt vừa phản ánh thành ngữ Hê-bơ-rơ “các con trai/con cái của Y-sơ-ra-ên” theo nghĩa dân Y-sơ-ra-ên.
- source_word: קִרְבוּ
  choice: Hãy đến gần
  rationale: Mệnh lệnh số nhiều của קרב chỉ việc tiến đến gần; cách dịch này rõ ràng, hiện đại và vẫn giữ sắc thái đến gần sự hiện diện của Đức Chúa Trời.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: לִפְנֵי mang nghĩa “trước mặt/trong sự hiện diện của”; “trước mặt” là cách diễn đạt tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho danh riêng giao ước יהוה, thay vì thay thế danh ấy bằng một tước hiệu.
- source_word: כִּי שָׁמַע
  choice: vì Ngài đã nghe
  rationale: כִּי nêu lý do cho mệnh lệnh; qatal שָׁמַע chỉ hành động đã hoàn tất nhưng có liên hệ trực tiếp với tình huống hiện tại.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: những lời các ngươi than phiền
  rationale: Danh từ này chỉ sự phàn nàn, lẩm bẩm của dân chúng, có sắc thái bất mãn; “than phiền” tự nhiên trong tiếng Việt và giữ được sắc thái tiêu cực.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA; Gia-vê
  rationale: Bản dịch giữ danh riêng của Đức Chúa Trời thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc và trang trọng, dù “Gia-vê” phản ánh gần hơn cách phục nguyên học thuật Yahweh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời dẫn dùng “Bấy giờ” để nối mạch tự sự; trong lời phán truyền, “các ngươi” giữ sắc thái số nhiều và khoảng cách của lời công bố cổ, nhưng vẫn rõ nghĩa với độc giả hiện đại.
