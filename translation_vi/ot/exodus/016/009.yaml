revisions:
- from: 'Bấy giờ, Môi-se nói với A-rôn: “Hãy nói với toàn thể cộng đồng con dân Y-sơ-ra-ên rằng: ‘Hãy đến gần trước mặt Đức Giê-hô-va, vì Ngài đã nghe những lời các ngươi than phiền.’”'
  to: 'Bấy giờ, Môi-se nói với A-rôn: “Hãy nói với toàn thể cộng đồng dân Y-sơ-ra-ên: ‘Hãy đến gần trước mặt Đức Giê-hô-va, vì Ngài đã nghe những lời than phiền của các ngươi.’”'
  rationale: Bản sửa giữ nguyên ý nghĩa, trật tự diễn tiến và sắc thái mệnh lệnh của bản gốc, đồng thời sửa cụm sở hữu cho tự nhiên và chính xác hơn, và đơn giản hóa cách gọi cộng đồng Y-sơ-ra-ên. Không cần chú thích vì không có điểm mơ hồ văn bản hoặc lựa chọn dịch thuật nào cần đánh dấu trong câu này.
