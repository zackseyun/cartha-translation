- from: '“Ta đã nghe những lời càu nhàu của con cái Y-sơ-ra-ên. Hãy nói với họ rằng: ‘Vào lúc chạng vạng[a], các ngươi sẽ ăn thịt; đến sáng, các ngươi sẽ được ăn bánh no nê. Bấy giờ các ngươi sẽ biết rằng Ta là Yahweh, Đức Chúa Trời của các ngươi.’”'
  to: '“Ta đã nghe những lời càu nhàu của con cái Y-sơ-ra-ên. Hãy nói với họ rằng: ‘Vào lúc chạng vạng[a], các ngươi sẽ ăn thịt; vào buổi sáng, các ngươi sẽ được no bánh. Và các ngươi sẽ biết rằng Ta là Yahweh, Đức Chúa Trời của các ngươi.’”'
