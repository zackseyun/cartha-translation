  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: vi
  text: '“Ta đã nghe những lời càu nhàu của con cái Y-sơ-ra-ên. Hãy nói với họ rằng: ‘Vào lúc chạng vạng[a], các ngươi sẽ ăn thịt; vào buổi sáng, các ngươi sẽ được no bánh. Và các ngươi sẽ biết rằng Ta là Yahweh, Đức Chúa Trời của các ngươi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “giữa hai buổi chiều”, một thành ngữ chỉ khoảng thời gian chạng vạng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Ta đã nghe
  rationale: Thể hoàn thành ngôi thứ nhất số ít diễn tả việc đã xảy ra nhưng vẫn có hiệu lực trực tiếp trong lời đáp hiện tại của Đức Chúa Trời.
- source_word: תְּלוּנֹּת
  choice: những lời càu nhàu
  rationale: Diễn đạt sự than phiền lặp đi lặp lại với sắc thái bất mãn, phù hợp bối cảnh đồng vắng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cách gọi tự nhiên, trang trọng trong tiếng Việt, chỉ cộng đồng hậu duệ của Y-sơ-ra-ên mà không thu hẹp sai nghĩa vào nam giới trong ngữ cảnh toàn dân.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: Hãy nói với họ rằng
  rationale: Giữ rõ mệnh lệnh và công thức dẫn lời của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: בֵּין הָעַרְבַּיִם
  choice: vào lúc chạng vạng
  rationale: Chuyển tải tự nhiên ý nghĩa thời điểm của thành ngữ Hê-bơ-rơ; nghĩa sát chữ được ghi ở chú thích.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: các ngươi sẽ ăn thịt
  rationale: Trong ngữ cảnh thực phẩm, בָשָׂר tự nhiên là “thịt”; động từ chưa hoàn thành mang ý tương lai trong lời hứa.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: các ngươi sẽ được ăn bánh no nê
  rationale: Diễn đạt cụ thể trạng thái được ăn đến no, đồng thời giữ danh từ “bánh” của nguyên văn.
- source_word: וִידַעְתֶּם
  choice: Bấy giờ các ngươi sẽ biết
  rationale: “Bấy giờ” làm rõ quan hệ kết quả tự nhiên của mệnh đề nối tiếp mà không cường giải nội dung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Dạng số nhiều về hình thái có sở chỉ số ít là Đức Chúa Trời của Y-sơ-ra-ên; cụm sở hữu giao ước được giữ rõ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” giữ đây là danh riêng, không đổi thành tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên / dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh này cụm từ chỉ toàn thể cộng đồng Y-sơ-ra-ên đang càu nhàu. “Con cái” vừa gần hình ảnh huyết thống của nguyên văn vừa không khiến độc giả hiểu sai rằng chỉ nam giới được nói đến.
- issue: Quan hệ giữa sự chu cấp và việc nhận biết Yahweh
  choice: Bấy giờ các ngươi sẽ biết
  alternative: và các ngươi sẽ biết
  rationale: Liên từ với động từ ở đây có thể được hiểu là sự tiếp nối mang sắc thái kết quả. “Bấy giờ” diễn đạt mối liên hệ ấy nhưng không giải thích thêm bản chất của việc nhận biết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để giữ sắc thái lời phán trực tiếp có thẩm quyền; giữ danh Yahweh và tên Y-sơ-ra-ên theo lối phiên âm quen thuộc. Dấu chú thích [a] xuất hiện ngay sau cụm từ cần giải thích.
