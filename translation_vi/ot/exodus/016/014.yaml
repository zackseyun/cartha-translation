  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Kìa” bảo tồn tính sống động của lời kể; “hoang mạc” phù hợp bối cảnh Xuất Hành. Thuật ngữ hiếm מְחֻסְפָּס được diễn đạt thận trọng để giữ sự bất định từ vựng.
