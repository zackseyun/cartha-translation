  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: vi
  text: Khi lớp sương đã bay lên[a], kìa, trên bề mặt hoang mạc có một thứ mịn như vảy[b], mịn như sương giá trên mặt đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “đã đi lên”. Trong ngữ cảnh này, cũng có thể hiểu là sương đã bốc lên hoặc biến mất.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ hiếm này có nghĩa sắc thái không chắc chắn; có thể chỉ thứ có dạng hoặc kết cấu như vảy, như mảnh, hoặc lấm tấm.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: וַתַּעַל
  choice: đã tan đi
  rationale: Động từ עלה theo nghĩa đen là “đi lên”. Trong ngữ cảnh lớp sương biến mất, “tan đi” là cách diễn đạt tự nhiên trong tiếng Việt mà không xác định quá mức cơ chế là bay hơi; chú thích giữ lại hình ảnh nguyên văn.
- source_word: שִׁכְבַת הַטָּל
  choice: lớp sương
  rationale: שִׁכְבָה chỉ một lớp hay khối nằm phủ; “lớp sương” vừa sát hình ảnh vừa tự nhiên.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: “Kìa” giữ chức năng thu hút sự chú ý và sắc thái phát hiện bất ngờ của הִנֵּה.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: trên bề mặt hoang mạc
  rationale: פְּנֵי mang nghĩa “mặt/bề mặt”; “hoang mạc” diễn đạt מִדְבָּר mà không giới hạn địa hình thành sa mạc cát.
- source_word: דַּק
  choice: nhỏ mịn
  rationale: דַּק có thể chỉ sự mảnh, nhỏ hoặc mịn. “Nhỏ mịn” phù hợp vật thể được mô tả và có thể lặp lại tự nhiên ở cả hai vị trí.
- source_word: מְחֻסְפָּס
  choice: tựa như vảy
  rationale: Từ hiếm này không chắc về sắc thái, có lẽ mô tả kết cấu hoặc dáng vẻ như vảy/mảnh. Cách dịch giữ tính so sánh và tránh khẳng định một hình dạng quá cụ thể.
- source_word: דַּק כַּכְּפֹר
  choice: nhỏ mịn như sương giá
  rationale: Giữ sự lặp lại của דַּק và phép so sánh với כְּפֹר, tức sương giá.
- source_word: עַל הָאָרֶץ
  choice: trên mặt đất
  rationale: Trong khung cảnh vật chất trước mắt, “mặt đất” là nghĩa tự nhiên của הָאָרֶץ.
