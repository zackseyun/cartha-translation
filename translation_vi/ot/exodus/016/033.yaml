source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: vi
  text: 'Môi-se nói với A-rôn: “Hãy lấy một cái hũ[a], cho vào đó một ô-me đầy ma-na, rồi đặt phần ấy trước mặt Yahweh để lưu giữ qua các thế hệ của anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bình”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: cái hũ
  rationale: Danh từ chỉ một vật chứa; “hũ” tự nhiên trong tiếng Việt hiện đại và không gợi ý đây nhất thiết là dụng cụ nấu ăn.
- source_word: מְלֹא הָעֹמֶר
  choice: đầy một ô-me
  rationale: Giữ cả ý về một đơn vị đo khô ô-me và lượng đầy của đơn vị ấy.
- source_word: מָן
  choice: ma-na
  rationale: Dạng phiên âm quen thuộc trong tiếng Việt cho thức ăn được gọi tên trong ngữ cảnh.
- source_word: וְתֶן שָׁמָּה
  choice: cho vào đó
  rationale: שָׁמָּה nghĩa đen là “ở đó”; trong ngữ cảnh, nơi được chỉ đến là bên trong cái hũ vừa nhắc tới.
- source_word: וְהַנַּח אֹתוֹ
  choice: rồi đặt nó
  rationale: Diễn đạt rõ hành động đặt vật chứa xuống một vị trí xác định; “nó” tự nhiên quy chiếu về cái hũ chứa ma-na.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ sát thành ngữ Hê-bơ-rơ mang nghĩa “trước mặt/trong sự hiện diện của”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: לְמִשְׁמֶרֶת
  choice: để lưu giữ
  rationale: Thể hiện mục đích bảo tồn vật này làm kỷ vật lâu dài.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua các thế hệ của anh em
  rationale: Đại từ hậu tố số nhiều hướng đến cộng đồng; cách dịch này vừa phân biệt với mệnh lệnh số ít dành cho A-rôn vừa diễn đạt sự tiếp nối qua nhiều thế hệ.
- source_word: קַח ... אַחַת
  choice: Hãy lấy một cái hũ
  rationale: Giữ mệnh lệnh số ít và sắc thái chỉ một vật chứa.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm; phiên âm “Yahweh” bảo tồn đặc tính danh riêng mà không thay bằng tước hiệu.
- issue: Đối tượng của cụm “các thế hệ của anh em”
  choice: Đại từ số nhiều chỉ cộng đồng Israel
  alternative: các thế hệ của ngươi
  rationale: לְדֹרֹתֵיכֶם có hậu tố ngôi thứ hai số nhiều, dù mệnh lệnh trước đó nói riêng với A-rôn; bản dịch giữ sự chuyển đổi này thay vì đồng nhất hóa các đại từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai số nhiều hướng đến cộng đồng, tránh sắc thái cổ hoặc miệt thị của “các ngươi”; giữ đơn vị đo cổ “ô-me” và danh riêng “Yahweh”.
