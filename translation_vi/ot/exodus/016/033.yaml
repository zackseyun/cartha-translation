revisions:
- from: 'Môi-se nói với A-rôn: “Hãy lấy một cái hũ[a], cho vào đó đầy một ô-me ma-na, rồi đặt nó trước mặt Yahweh để lưu giữ qua các thế hệ của anh em.”'
  to: 'Môi-se nói với A-rôn: “Hãy lấy một cái hũ[a], cho vào đó một ô-me đầy ma-na, rồi đặt phần ấy trước mặt Yahweh để lưu giữ qua các thế hệ của anh em.”'
  rationale: Sửa trật tự từ để diễn đạt tự nhiên lượng “một ô-me đầy ma-na”, và thay đại từ có quy chiếu bị tranh luận bằng “phần ấy” để không gán chắc hành động “đặt” cho riêng cái hũ hay riêng ma-na. Các yếu tố nghĩa và thuật ngữ khác được giữ nguyên.
