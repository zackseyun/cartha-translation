  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: vi
  text: 'Dân Israel[a] nói với họ: “Phải chi chúng tôi đã chết dưới tay Yahweh[c] trong đất Ai Cập, khi chúng tôi ngồi bên những nồi thịt[b], khi chúng tôi ăn bánh no nê! Vì các ông đã đưa chúng tôi ra hoang mạc này để làm cho cả hội chúng này chết đói.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; cụm từ này chỉ toàn thể dân Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “những nồi nấu thịt”.'
    reason: lexical_alternative
  - marker: c
    text: Yahweh là cách phiên âm danh riêng YHWH trong tiếng Hê-bơ-rơ; truyền thống khác dịch là “CHÚA” hoặc “Đức Giê-hô-va”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Dân Israel
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ gia tộc chỉ toàn thể người Israel; chú thích bảo lưu nghĩa đen “các con trai của Israel”.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: Phải chi chúng tôi đã chết
  rationale: מִי יִתֵּן là thành ngữ diễn tả một ước muốn trái với thực tế, không phải câu hỏi theo nghĩa đen. “Phải chi” truyền đạt đúng sắc thái than tiếc trong tiếng Việt.
- source_word: בְיַד יְהוָה
  choice: bởi tay Yahweh
  rationale: Giữ hình ảnh cụ thể “bởi tay” của tiếng Hê-bơ-rơ, đồng thời diễn đạt tác nhân gây ra cái chết.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: khi chúng tôi ngồi bên những nồi thịt
  rationale: Bảo tồn mệnh đề thời gian và hình ảnh các nồi dùng để nấu thịt; số nhiều trong tiếng Việt phù hợp với ký ức khái quát của cả cộng đồng.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: và ăn bánh no nê
  rationale: “No nê” truyền đạt tự nhiên ý nghĩa no đủ của לָשֹׂבַע và vẫn giữ “bánh” tương ứng với לֶחֶם.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: hoang mạc này
  rationale: “Hoang mạc” diễn tả vùng đất hoang vu của hành trình Xuất Hành mà không nhất thiết giới hạn vào sa mạc cát.
- source_word: לְהָמִית אֶת כָּל הַקָּהָל הַזֶּה בָּרָעָב
  choice: để làm cho cả hội chúng này chết đói
  rationale: “Làm cho… chết” giữ lực gây khiến của dạng Hifil; “chết đói” là cách diễn đạt tự nhiên cho cái chết do nạn đói.
theological_decisions:
- issue: Cách thể hiện danh riêng יְהוָה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tứ tự YHWH. “Yahweh” bảo tồn đây là danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; chú thích nêu các truyền thống thể hiện khác.
- issue: Cách dịch danh xưng giao ước בְּנֵי יִשְׂרָאֵל
  choice: Dân Israel
  alternative: Các con trai của Israel; con cái Israel
  rationale: Trong ngữ cảnh, cụm giống đực số nhiều mang chức năng đại diện cho toàn dân. “Dân Israel” rõ ràng và tự nhiên trong tiếng Việt, còn cấu trúc gia tộc của nguyên văn được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Lời than “Phải chi” và lời tố cáo “các ông” tái hiện giọng nói trực tiếp, gay gắt của dân chúng. “Hội chúng” bảo tồn sắc thái cộng đồng được triệu tập của קָהָל mà không đồng nhất nó với một thiết chế giáo hội về sau.
