source:
  edition: WLC
  text: וַ/יַּנִּ֤יחוּ אֹת/וֹ֙ עַד הַ/בֹּ֔קֶר כַּ/אֲשֶׁ֖ר צִוָּ֣ה מֹשֶׁ֑ה וְ/לֹ֣א הִבְאִ֔ישׁ וְ/רִמָּ֖ה לֹא הָ֥יְתָה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: vi
  text: Vậy, họ để phần ấy lại cho đến sáng, đúng như Môi-se đã truyền; phần ấy không bốc mùi, cũng không có giòi[a] trong đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sâu”. Từ Hê-bơ-rơ có thể chỉ chung những sinh vật dạng sâu xuất hiện trong sự phân hủy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: họ để phần ấy lại
  rationale: Động từ ở thể sai khiến có nghĩa là để lại hoặc đặt sang một bên. “Phần ấy” làm rõ đại từ số ít đang chỉ phần ma-na được giữ qua đêm mà không diễn giải quá mức.
- source_word: עַד הַבֹּקֶר
  choice: cho đến sáng
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, giữ nguyên giới hạn thời gian của nguyên văn.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: đúng như Môi-se đã truyền
  rationale: “Đúng như” thể hiện quan hệ so sánh và sự tuân theo; “đã truyền” phù hợp với mệnh lệnh có trước hành động.
- source_word: הִבְאִישׁ
  choice: bốc mùi
  rationale: Động từ chỉ việc trở nên hôi thối. “Bốc mùi” tự nhiên, sinh động và hợp với sự tương phản trong mạch văn.
- source_word: רִמָּה
  choice: giòi
  rationale: Danh từ chỉ sinh vật dạng sâu xuất hiện trong vật phân hủy; trong ngữ cảnh thức ăn hỏng, “giòi” là cách gọi tự nhiên, nhưng “sâu” vẫn là khả năng dịch rộng hơn nên được ghi ở chú thích.
- source_word: לֹא הָיְתָה בּוֹ
  choice: cũng không có ... trong đó
  rationale: Giữ cấu trúc tồn tại phủ định của tiếng Hê-bơ-rơ và nối tự nhiên với mệnh đề phủ định phía trước.
