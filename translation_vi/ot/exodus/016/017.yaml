translation:
  language: vi
  text: Dân Y-sơ-ra-ên làm như vậy; họ thu lượm, người thu lượm nhiều, người thu lượm ít.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: làm như vậy
  rationale: Cụm này chỉ việc thực hiện lời chỉ dẫn trước đó; “làm như vậy” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Dân Y-sơ-ra-ên
  rationale: Dù nghĩa đen là “các con trai của Y-sơ-ra-ên”, trong văn cảnh đây là cách gọi cộng đồng giao ước nói chung. “Dân Y-sơ-ra-ên” rõ nghĩa, trang trọng và tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: וַיִּלְקְטוּ
  choice: họ thu lượm
  rationale: Động từ לקט chỉ việc nhặt và gom thức ăn; “thu lượm” phù hợp với việc gom ma-na và giữ được sắc thái của hành động.
- source_word: הַמַּרְבֶּה
  choice: người thì nhiều
  rationale: Phân từ được danh từ hóa, chỉ người thu lượm nhiều. Cách diễn đạt này bảo toàn cấu trúc phân phối và sự đối xứng với vế sau.
- source_word: הַמַּמְעִיט
  choice: người thì ít
  rationale: Phân từ được danh từ hóa, chỉ người thu lượm ít. “Người thì nhiều, người thì ít” tự nhiên trong tiếng Việt và giữ nguyên thế tương phản của tiếng Hê-bơ-rơ.
