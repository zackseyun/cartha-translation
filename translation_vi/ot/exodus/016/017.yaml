  source_fidelity: Bản dịch truyền đạt đúng hành động làm theo chỉ dẫn và việc thu lượm với sự chênh lệch về lượng. Tuy nhiên, “người thì nhiều, người thì ít” có thể được hiểu là số người nhiều hay ít, thay vì lượng ma-na mỗi người thu được. Thêm động từ “thu lượm” ở hai vế cuối làm rõ nghĩa của các phân từ được danh từ hóa trong tiếng Hê-bơ-rơ.
