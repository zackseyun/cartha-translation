base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: vi
  text: Như Yahweh đã truyền cho Môi-se, A-rôn đặt bình ấy trước Chứng Ước[a] để bảo quản.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chứng Ước” là một thuật ngữ chuyên dùng trong bối cảnh Đền Tạm; có thể chỉ cụ thể các bảng giao ước hoặc những gì gắn liền với chúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Đúng như
  rationale: Diễn tả việc A-rôn làm hoàn toàn phù hợp với mệnh lệnh đã ban, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Giữ sắc thái có thẩm quyền của mệnh lệnh từ Đức Chúa Trời; “truyền” trang trọng và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được văn bản Hê-bơ-rơ dùng trực tiếp, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה
  choice: cho Môi-se
  rationale: Thể hiện tự nhiên người tiếp nhận mệnh lệnh trong tiếng Việt.
- source_word: וַיַּנִּיחֵהוּ
  choice: A-rôn đặt bình ấy
  rationale: Động từ mang nghĩa đặt hoặc để vào vị trí chỉ định. “Bình ấy” làm rõ vật được nói đến từ câu trước mà không thay đổi ý nghĩa trong ngữ cảnh.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: לִפְנֵי
  choice: trước
  rationale: Giữ nghĩa không gian cơ bản, đồng thời phù hợp với văn cảnh thánh nghi.
- source_word: הָעֵדֻת
  choice: Chứng Ước
  rationale: Giữ tính chất thuật ngữ của עֵדוּת trong ngôn ngữ về Đền Tạm, thường liên hệ đến các bảng giao ước hoặc nơi đặt chúng, mà không thu hẹp nghĩa ngay trong chính văn.
- source_word: לְמִשְׁמָרֶת
  choice: để lưu giữ
  rationale: Diễn đạt tự nhiên mục đích bảo quản lâu dài, không thêm ý “kỷ niệm” vốn không được nói rõ trong câu này.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng danh riêng יהוה; giữ “Yahweh” bảo tồn sự quy chiếu trực tiếp đến danh giao ước thay vì thay bằng tước hiệu.
- issue: Phạm vi nghĩa của הָעֵדֻת
  choice: Chứng Ước
  alternative: các bảng giao ước
  rationale: Thuật ngữ có thể chỉ cụ thể các bảng chứng ước hoặc thực tại thánh liên hệ với chúng. Chính văn giữ cách gọi rộng hơn và chú thích nêu nghĩa cụ thể có thể có.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, câu gọn và dễ hiểu. “Đúng như” nhấn mạnh sự vâng theo mệnh lệnh; “Chứng Ước” được viết hoa để báo hiệu đây là thuật ngữ thánh nghi, còn chú thích bảo tồn phạm vi nghĩa chưa hoàn toàn xác định.
