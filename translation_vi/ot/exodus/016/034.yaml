- from: Đúng như Yahweh đã truyền cho Môi-se, A-rôn đặt bình ấy trước Chứng Ước[a] để lưu giữ.
  to: Như Yahweh đã truyền cho Môi-se, A-rôn đặt bình ấy trước Chứng Ước[a] để bảo quản.
  rationale: Sửa tối thiểu để tránh thêm sắc thái nhấn mạnh trong “Đúng như” và để chú thích diễn đạt đúng chức năng giải thích từ ngữ. “Bình ấy” được phép giữ vì đại từ giống đực số ít trong nguyên văn quy về chiếc bình đựng ma-na ở câu trước; việc nêu rõ trong tiếng Việt giúp câu không mơ hồ mà không thêm nội dung.
