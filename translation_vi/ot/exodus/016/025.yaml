base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: vi
  text: 'Môi-se nói: “Hôm nay hãy ăn thứ này, vì hôm nay là ngày sa-bát dành cho Đức Giê-hô-va; hôm nay anh em sẽ không tìm thấy nó ngoài đồng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: hãy ăn thứ này
  rationale: Đại từ hậu tố chỉ ma-na trong văn cảnh; thêm “thứ này” giúp câu tiếng Việt tự nhiên mà không thay đổi vật quy chiếu.
- source_word: שַׁבָּת
  choice: ngày sa-bát
  rationale: Giữ thuật ngữ Kinh Thánh quen thuộc, chỉ ngày nghỉ được biệt riêng.
- source_word: לַיהוָה
  choice: dành cho Đức Giê-hô-va
  rationale: Giới từ ל diễn tả ngày sa-bát thuộc về hoặc được biệt riêng cho Đức Chúa Trời; “dành cho” tự nhiên và không giải thích quá mức.
- source_word: בַּשָּׂדֶה
  choice: ngoài đồng
  rationale: Cách nói tiếng Việt tự nhiên cho địa điểm nơi dân chúng đi nhặt ma-na.
theological_decisions:
- issue: Cách thể hiện danh riêng יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Chúa Hằng Hữu
  rationale: Dùng cách phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt để phân biệt danh riêng יהוה với tước hiệu, không đưa thêm diễn giải thần học.
- issue: Quan hệ của ngày sa-bát với יהוה
  choice: ngày sa-bát dành cho Đức Giê-hô-va
  alternative: ngày sa-bát của Đức Giê-hô-va
  rationale: “Dành cho” thể hiện sắc thái dâng riêng/biệt riêng có thể có của ל, đồng thời tránh ấn định một cách hiểu sở hữu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “hôm nay” ba lần như nguyên văn Hê-bơ-rơ để bảo toàn trọng âm tu từ; dùng “anh em” cho ngôi thứ hai số nhiều.
