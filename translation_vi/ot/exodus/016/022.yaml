  - severity: low
    issue: “thu nhặt được” thêm sắc thái hoàn tất/kết quả không được biểu thị riêng trong động từ nguồn.
    rationale: “Thu nhặt” đã diễn đạt đầy đủ לָקְטוּ và giữ văn phong gọn.
  revised_text: Vào ngày thứ sáu, họ thu nhặt lượng bánh gấp đôi[a], tức hai ô-me cho mỗi người. Tất cả các thủ lĩnh của cộng đồng đều đến báo cho Môi-se.
