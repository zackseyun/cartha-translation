base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: vi
  text: Vào ngày thứ sáu, họ thu nhặt lượng bánh gấp đôi[a], tức hai ô-me cho mỗi người. Tất cả các thủ lĩnh của cộng đồng đều đến báo cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ô-me là một đơn vị đo lường đồ khô được dùng trong Israel thời xưa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשִּׁשִּׁי
  choice: Đến ngày thứ sáu
  rationale: Diễn đạt tự nhiên trong tiếng Việt sự chuyển tiếp tự sự וַיְהִי cùng cụm thời gian, không dùng lối cổ 'và xảy ra rằng'.
- source_word: לָקְטוּ
  choice: thu nhặt được
  rationale: לקט chỉ hành động gom nhặt ma-na; 'thu nhặt' sát nghĩa, còn 'được' giúp câu tiếng Việt tự nhiên khi nêu lượng thu nhặt.
- source_word: לֶחֶם מִשְׁנֶה
  choice: lượng bánh gấp đôi
  rationale: Giữ nghĩa cụ thể 'bánh' của לֶחֶם và nghĩa định lượng gấp đôi của מִשְׁנֶה, đồng thời kết nối tự nhiên với phần giải thích 'mỗi người hai ô-me'.
- source_word: שְׁנֵי הָעֹמֶר לָאֶחָד
  choice: mỗi người hai ô-me
  rationale: Thể hiện rõ nghĩa phân phối của לָאֶחָד và giữ nguyên tên đơn vị đo cổ đại עֹמֶר dưới dạng phiên âm.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: tất cả các thủ lĩnh của cộng đồng
  rationale: נְשִׂיאִים là những người đứng đầu được nhìn nhận trong dân; 'thủ lĩnh' giữ sắc thái chức vị hơn 'người lãnh đạo'. עֵדָה ở đây chỉ cộng đồng dân Israel.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: đều đến báo cho Môi-se
  rationale: Giữ trình tự họ đến rồi trình báo, nhưng diễn đạt gọn và tự nhiên trong tiếng Việt; 'đều' tương ứng với tính toàn thể của כָּל.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Môi-se' theo dạng tên quen thuộc trong tiếng Việt; giữ 'bánh' thay vì giải thích thành 'thức ăn' hoặc 'ma-na' để bảo toàn từ ngữ và chủ đề của nguyên văn.
