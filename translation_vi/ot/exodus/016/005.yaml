  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: vi
  text: Vào ngày thứ sáu, khi họ chuẩn bị những gì họ đem về, lượng ấy sẽ gấp đôi[a] lượng họ thu nhặt mỗi ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thì đó sẽ là một phần gấp đôi so với lượng họ thu nhặt mỗi ngày.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Đến... thì... sẽ
  rationale: Diễn đạt tự nhiên hoàn cảnh và kết quả hướng tới tương lai trong lời chỉ dẫn, thay vì dịch máy móc là “và sẽ xảy ra”.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: Đến ngày thứ sáu
  rationale: Giữ đúng cụm thời gian; không thêm “trong tuần” vì nguyên văn không nói rõ.
- source_word: וְהֵכִינוּ
  choice: khi họ chuẩn bị
  rationale: Hiểu hành động này như hoàn cảnh thời gian gắn với ngày thứ sáu, phù hợp mạch chỉ dẫn.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: những gì mình đem về
  rationale: Chỉ vật họ đã thu nhặt rồi mang về; “đem về” tự nhiên trong ngữ cảnh ma-na.
- source_word: וְהָיָה מִשְׁנֶה
  choice: số đó sẽ gấp đôi
  rationale: מִשְׁנֶה biểu thị lượng gấp hai; cách dịch này rõ nghĩa mà không nhất thiết thêm khái niệm “phần”.
- source_word: עַל אֲשֶׁר
  choice: gấp đôi số
  rationale: עַל ở đây biểu thị quan hệ so sánh về lượng; tiếng Việt diễn đạt tự nhiên bằng “gấp đôi số...”.
- source_word: יִלְקְטוּ
  choice: họ thu nhặt
  rationale: לקט trong ngữ cảnh ma-na là nhặt và gom lại; “thu nhặt” vừa chính xác vừa tự nhiên.
- source_word: יוֹם יוֹם
  choice: mỗi ngày
  rationale: Lối lặp trong tiếng Hê-bơ-rơ có nghĩa phân phối hoặc lặp lại; “mỗi ngày” là cách diễn đạt tiếng Việt hiện đại, rõ ràng.
