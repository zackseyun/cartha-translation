  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc thời gian–chuẩn bị–kết quả của nguyên văn, đồng thời bảo toàn khả năng hiểu מִשְׁנֶה là “gấp đôi” hoặc “một phần gấp đôi” qua chú thích.
