  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: vi
  text: Vào buổi sáng, anh em sẽ thấy vinh quang của Yahweh, vì Ngài đã nghe các lời oán trách của anh em chống lại Yahweh.[a] Còn chúng tôi là gì mà anh em oán trách chúng tôi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi Ngài nghe các lời oán trách của anh em chống lại Yahweh.” Cấu trúc Hê-bơ-rơ có thể mang nghĩa thời gian cũng như nguyên nhân.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֹקֶר
  choice: Và vào buổi sáng
  rationale: Danh từ chỉ thời gian cùng liên từ được hiểu theo chức năng trạng ngữ; cách dịch này giữ mạch nối tiếp với câu trước và tự nhiên trong tiếng Việt.
- source_word: וּרְאִיתֶם
  choice: anh em sẽ thấy
  rationale: Trong chuỗi lời báo trước này, động từ mang ý nghĩa tương lai. “Anh em” diễn đạt ngôi thứ hai số nhiều bằng tiếng Việt hiện đại.
- source_word: כְּבוֹד יְהוָה
  choice: vinh quang của Yahweh
  rationale: כָּבוֹד ở đây chỉ sự uy nghi và hiện diện được bày tỏ của Đức Chúa Trời; cách dịch giữ cấu trúc và âm hưởng thần học của nguyên ngữ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּשָׁמְעוֹ
  choice: vì Ngài đã nghe
  rationale: Giới từ בְּ với động từ nguyên mẫu có thể mang sắc thái nguyên nhân hoặc thời gian. Trong văn cảnh, sắc thái nguyên nhân giải thích vì sao dân sẽ thấy vinh quang của Yahweh; khả năng chỉ thời gian được giữ trong chú thích.
- source_word: תְּלֻנֹּתֵיכֶם / תלונו
  choice: những lời càu nhàu của anh em / anh em lại càu nhàu
  rationale: “Càu nhàu” thể hiện lời than phiền bất mãn, có sắc thái tiêu cực, đồng thời giữ liên hệ từ vựng giữa danh từ và động từ trong câu.
- source_word: עַל יְהוָה / עָלֵינוּ
  choice: chống lại Yahweh / chống lại chúng tôi
  rationale: עַל trong ngữ cảnh than phiền biểu thị đối tượng bị chống đối, không chỉ là chủ đề được nói đến; cách dịch song song giữ cấu trúc lập luận của câu.
- source_word: וְנַחְנוּ מָה
  choice: Còn chúng tôi là gì
  rationale: “Còn” vừa nối ý vừa làm rõ sự tương phản giữa Yahweh và Môi-se cùng A-rôn; câu hỏi tu từ nhấn mạnh rằng họ không phải đối tượng thực sự của sự chống đối.
- source_word: כִּי
  choice: mà
  rationale: 'Ở đây כִּי dẫn vào nội dung của câu hỏi tu từ; “mà” là cách diễn đạt tự nhiên trong tiếng Việt: “là gì mà…?”'
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng tước hiệu.
- issue: Sắc thái nguyên nhân hay thời gian của בְּשָׁמְעוֹ
  choice: vì Ngài đã nghe
  alternative: khi Ngài nghe
  rationale: Sắc thái nguyên nhân phù hợp với mạch văn, trong đó việc bày tỏ vinh quang là phản ứng trước lời càu nhàu. Tuy nhiên, cấu trúc Hê-bơ-rơ cũng có thể mang nghĩa thời gian, nên phương án ấy được nêu trong chú thích.
- issue: Đối tượng thật sự của lời càu nhàu
  choice: giữ nguyên sự song song “chống lại Yahweh… chống lại chúng tôi”
  alternative: diễn giải rằng càu nhàu chống Môi-se và A-rôn chính là chống Đức Chúa Trời
  rationale: Bản dịch giữ nguyên câu hỏi tu từ và sự căng thẳng trong nguyên văn, không thêm lời giải thích thần học vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng Y-sơ-ra-ên ở ngôi thứ hai số nhiều; dùng “Ngài” cho đại từ quy chiếu về Yahweh. “Càu nhàu” giữ sắc thái bất mãn, chống đối mà tránh từ cổ “lằm bằm”.
