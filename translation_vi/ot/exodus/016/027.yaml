source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י יָצְא֥וּ מִן הָ/עָ֖ם לִ/לְקֹ֑ט וְ/לֹ֖א מָצָֽאוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: vi
  text: Đến ngày thứ bảy, một số người trong dân đi ra để nhặt, nhưng không tìm thấy gì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Đến
  rationale: Trong mạch kể chuyện tiếng Việt, “Đến ngày thứ bảy” tự nhiên và vẫn thể hiện sự chuyển sang sự việc kế tiếp; không cần dịch máy móc thành “Và xảy ra rằng”.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ngày thứ bảy
  rationale: Dịch trực tiếp cụm chỉ thời gian, không thêm “trong tuần” vì nguyên văn không có.
- source_word: יָצְאוּ
  choice: đi ra
  rationale: Diễn tả việc rời nơi đóng trại để tìm thức ăn, phù hợp với nghĩa thông thường của động từ.
- source_word: מִן הָעָם
  choice: một số người trong dân
  rationale: 'מן được dùng theo nghĩa bộ phận: những người hành động chỉ là một phần trong dân chúng, không phải toàn thể.'
- source_word: לִלְקֹט
  choice: để nhặt
  rationale: לקט chỉ việc thu nhặt; “nhặt” tự nhiên trong ngữ cảnh ma-na nằm trên mặt đất. Không thêm tân ngữ “ma-na” vì nguyên văn để ngầm hiểu từ văn cảnh.
- source_word: וְלֹא מָצָאוּ
  choice: nhưng không tìm thấy gì
  rationale: Nguyên văn là “và họ không tìm thấy”; “nhưng” thể hiện tự nhiên sự tương phản giữa mục đích đi nhặt và kết quả thất bại, còn “gì” làm rõ tân ngữ ngầm hiểu trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch làm rõ sắc thái bộ phận của מִן הָעָם ngay trong câu nên không cần chú thích; không thêm “ma-na” nhằm giữ tính hàm ẩn của nguyên văn.
