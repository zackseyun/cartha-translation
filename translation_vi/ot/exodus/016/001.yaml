base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: vi
  text: Toàn thể cộng đồng người Israel[a] rời Ê-lim và đến hoang mạc Sin[b], nằm giữa Ê-lim và Si-nai, vào ngày mười lăm của tháng thứ hai sau khi họ ra khỏi đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Israel”, một cách gọi dân tộc quen thuộc có thể chỉ toàn dân Israel, không riêng nam giới.
    reason: lexical_alternative
  - marker: b
    text: “Sin” ở đây là tên một địa danh, tức hoang mạc Sin, không phải từ chỉ tội lỗi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵילִם
  choice: Họ rời Ê-lim
  rationale: Động từ נסע trong hành trình nơi hoang mạc thường chỉ việc nhổ trại lên đường. “Rời” diễn đạt tự nhiên sự khởi hành khỏi Ê-lim mà không thêm chi tiết không có trong câu.
- source_word: וַיָּבֹאוּ
  choice: đến
  rationale: בוא là động từ chuyển động thông dụng; “đến” giữ nguyên trình tự kể chuyện và không diễn giải quá mức như “tới nơi”.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toàn thể cộng đồng con dân Israel
  rationale: “Toàn thể cộng đồng” thể hiện כָּל עֲדַת. “Con dân Israel” vừa gợi lại cách gọi theo quan hệ dòng tộc của בְּנֵי יִשְׂרָאֵל, vừa tự nhiên trong tiếng Việt và có thể chỉ toàn dân chứ không riêng nam giới.
- source_word: אֶל מִדְבַּר סִין
  choice: đến hoang mạc Sin
  rationale: מִדְבַּר chỉ vùng hoang vu, nên “hoang mạc” phù hợp mà không xác định quá mức địa hình. סִין là địa danh, được phiên âm là “Sin” và không đồng nhất với Si-nai.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: nằm giữa Ê-lim và Si-nai
  rationale: Mệnh đề quan hệ xác định vị trí được chuyển thành “nằm giữa” để câu tiếng Việt tự nhiên, trong khi vẫn giữ nguyên thông tin địa lý.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: vào ngày mười lăm tháng thứ hai
  rationale: Đây là cách diễn đạt ngày tháng tự nhiên trong tiếng Việt và phản ánh trực tiếp ngày thứ mười lăm của tháng thứ hai.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: kể từ khi họ ra khỏi đất Ai Cập
  rationale: Cụm nguyên mẫu với לְ lấy biến cố ra khỏi Ai Cập làm mốc thời gian. “Kể từ khi” giữ quan hệ thời gian mà không ấn định thêm cách tính ngày.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các địa danh được phiên âm theo lối quen thuộc trong tiếng Việt; “con dân Israel” bảo tồn sắc thái gia tộc–dân tộc của nguyên văn mà không tạo ấn tượng câu này chỉ nói đến nam giới.
