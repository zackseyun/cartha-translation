base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: vi
  text: Trong sáu ngày, anh em sẽ thu nhặt nó; nhưng đến ngày thứ bảy[a]—ngày Sa-bát[b]—thì sẽ không có.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và đến ngày thứ bảy”. Liên từ Hê-bơ-rơ có thể chỉ đơn giản là “và”, dù ngữ cảnh mang ý tương phản.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “ngày thứ bảy, Sa-bát”.'
    reason: lexical_alternative
  - marker: c
    text: Tức là ngày ấy sẽ không có manna.
    reason: contextual_clarification
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Trong sáu ngày
  rationale: Cụm chỉ khoảng thời gian sáu ngày; thêm “trong” diễn đạt tự nhiên bằng tiếng Việt mà vẫn giữ nguyên phạm vi thời gian.
- source_word: תִּלְקְטֻהוּ
  choice: anh em sẽ thu nhặt nó
  rationale: Động từ לקט có nghĩa là thu nhặt, với chủ thể ngôi thứ hai số nhiều và hậu tố tân ngữ giống đực số ít. “Anh em” diễn đạt số nhiều trong văn phong hiện đại; “nó” giữ tân ngữ đã được xác định trong ngữ cảnh.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: nhưng đến ngày thứ bảy
  rationale: Liên từ ו có thể là “và”, nhưng ở đây quan hệ giữa sáu ngày được thu nhặt và ngày thứ bảy không có manna mang sắc thái tương phản, nên “nhưng” tự nhiên hơn.
- source_word: שַׁבָּת
  choice: ngày Sa-bát
  rationale: Giữ danh xưng Sa-bát và quan hệ đồng vị với “ngày thứ bảy”, không diễn giải thành một thuật ngữ giáo phái hoặc chỉ dịch khái quát là “ngày nghỉ”.
- source_word: לֹא יִהְיֶה בּוֹ
  choice: thì sẽ không có
  rationale: 'Nguyên văn nói theo lối tỉnh lược: “sẽ không có ở/trong ngày ấy”. Ngữ cảnh cho thấy điều không có là manna; bản dịch giữ sự tỉnh lược thay vì chèn danh từ vào chính văn.'
theological_decisions:
- issue: Cách dịch שַׁבָּת trước khi luật tại Sinai được công bố
  choice: ngày Sa-bát
  alternative: ngày nghỉ; ngày Sa-bát ấy
  rationale: Tiếng Việt không bắt buộc biểu thị mạo từ như tiếng Anh. “Ngày Sa-bát” giữ danh từ Hebrew trong quan hệ đồng vị mà không áp đặt một cách hiểu phụng vụ phát triển hơn văn bản.
- issue: Chủ thể bị lược trong לֹא יִהְיֶה בּוֹ
  choice: giữ lối nói “sẽ không có” và giải thích bằng chú thích
  alternative: sẽ không có manna
  rationale: Giữ nét tỉnh lược của nguyên văn và không biến điều hàm ẩn theo ngữ cảnh thành một danh từ được phát biểu trực tiếp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều, tránh đại từ cổ “các ngươi”. Dấu gạch ngang làm rõ cấu trúc đồng vị của “ngày Sa-bát”.
