base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Ông đặt chúng trên các cầu vai của ê-phốt, như những viên đá tưởng niệm cho con cái Israel[a], đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Israel”, một cách nói thông dụng chỉ toàn thể con cái hoặc dân Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: Ông đặt chúng
  rationale: Động từ שׂוּם diễn tả hành động đặt hoặc gắn; đại từ chỉ hai viên đá mã não đã nêu ở câu trước. “Đặt chúng” tự nhiên và giữ được liên kết văn mạch.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: trên các cầu vai của ê-phốt
  rationale: כָּתֵף nghĩa đen là “vai”, nhưng trong ngữ cảnh may lễ phục chỉ các bộ phận nằm trên vai. “Cầu vai” diễn đạt cụ thể cấu tạo của áo; “ê-phốt” giữ tên gọi chuyên biệt của lễ phục.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: làm những viên đá kỷ niệm
  rationale: Cụm từ chỉ những viên đá có chức năng gợi nhớ hoặc tưởng niệm. “Đá kỷ niệm” là cách nói rõ ràng, tự nhiên trong tiếng Việt và không xác định thêm ai là chủ thể nhớ.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con cái Israel
  rationale: בְּנֵי יִשְׂרָאֵל là thành ngữ chỉ cộng đồng hậu duệ của Israel. “Con cái Israel” vừa gần hình thức Hê-bơ-rơ vừa bao hàm toàn dân, tránh khiến độc giả hiểu là chỉ nam giới.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: כַּאֲשֶׁר diễn tả sự phù hợp chính xác với mệnh lệnh có trước. “Đã truyền” hợp trình tự tường thuật; danh riêng יהוה được chuyển là “Yahweh”.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản nguồn trực tiếp dùng danh giao ước יהוה. Chuyển âm “Yahweh” giữ danh riêng và không thay bằng một tước hiệu.
- issue: Phạm vi nghĩa của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel; dân Israel
  rationale: Dù בְּנֵי có hình thức giống đực số nhiều, đây là thành ngữ tiêu chuẩn chỉ toàn thể hậu duệ hoặc dân Israel. “Con cái Israel” bảo toàn hình ảnh huyết thống mà không giới hạn sai đối tượng vào nam giới.
- issue: Ý nghĩa của אַבְנֵי זִכָּרוֹן
  choice: những viên đá kỷ niệm
  alternative: những viên đá để ghi nhớ
  rationale: Cấu trúc Hê-bơ-rơ không nói rõ những viên đá khiến ai nhớ. Bản dịch giữ sự mở này thay vì xác định đó là sự nhắc nhớ dành cho Đức Chúa Trời, thầy tế lễ hay dân chúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cầu vai” theo ngữ cảnh chế tác lễ phục, giữ thuật ngữ “ê-phốt”, tên “Israel” và dạng Việt hóa quen thuộc “Môi-se”. Mọi dấu chú thích trong bản văn đều có mục tương ứng.
