translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê của nguyên văn; dấu gạch ngang cuối câu cho thấy danh sách còn tiếp tục trong ngữ cảnh. Viết hoa “Sự Hiện Diện” để cho thấy đây không chỉ là sự có mặt nói chung mà là sự hiện diện thiêng liêng trong ngữ cảnh Đền Tạm, nhưng không chèn danh xưng không có trực tiếp trong cụm từ Hê-bơ-rơ.
