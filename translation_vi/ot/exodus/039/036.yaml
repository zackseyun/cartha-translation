lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: cái bàn
  rationale: Danh từ שֻׁלְחָן đơn giản chỉ cái bàn; ngữ cảnh đã cho biết đây là các vật dụng của Đền Tạm nên không cần thêm phần giải thích.
- source_word: כָּל כֵּלָיו
  choice: mọi dụng cụ của bàn
  rationale: כְּלִי có nghĩa rộng là dụng cụ, đồ dùng hoặc vật chứa. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ đại từ sở hữu mà không thêm nội dung ngoài nguyên văn.
- source_word: לֶחֶם הַפָּנִים
  choice: bánh của Sự Hiện Diện
  rationale: Cụm từ có nghĩa sát là “bánh của khuôn mặt/sự hiện diện”. Cách dịch này giữ được hình ảnh và ý nghĩa của tiếng Hê-bơ-rơ, đồng thời tránh dùng thuật ngữ truyền thống nhưng khó hiểu là “bánh trần thiết” trong chính văn.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: không dịch thành từ riêng
  rationale: Đây là các dấu hiệu chỉ tân ngữ dùng để phối hợp những mục trong danh sách; chức năng của chúng được thể hiện bằng trật tự từ và liên từ “và” trong tiếng Việt.
