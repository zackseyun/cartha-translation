  terminology: Dùng “bàn” cho שֻׁלְחָן và “dụng cụ” cho כֵּלִים là phù hợp. “Bánh của sự hiện diện” là cách chuyển ngữ sát và dễ hiểu cho לֶחֶם הַפָּנִים; chú thích giữ tên gọi truyền thống “bánh trần thiết” như một phương án từ vựng.
