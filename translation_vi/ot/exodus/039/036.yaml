  source_fidelity: 'Bản dịch giữ đúng ba hạng mục được liệt kê trong tiếng Hê-bơ-rơ: cái bàn, toàn bộ vật dụng liên hệ với nó, và לֶחֶם הַפָּנִים. Tuy nhiên, “mọi dụng cụ của bàn” làm yếu quan hệ sở hữu được nêu rõ bởi hậu tố “của nó” và hơi gợi các dụng cụ nói chung hơn là các vật dụng thuộc về chiếc bàn ấy.'
