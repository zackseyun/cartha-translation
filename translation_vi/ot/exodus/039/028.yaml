  text: the turban of fine linen[a], the ornate caps of fine linen, and the undergarments of finely twisted linen,
translation:
  language: vi
  text: khăn quấn đầu bằng vải lanh mịn, những chiếc mũ đẹp bằng vải lanh mịn, và quần lót bằng vải lanh mịn se[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ cuối, nghĩa là “vải lanh mịn se”, có thể được hiểu là bổ nghĩa đặc biệt cho món cuối cùng. Tuy nhiên, trật tự từ cũng cho phép cụm này vọng lại cách mô tả chất liệu được dùng cho các lễ phục trong toàn đoạn.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: khăn xếp
  rationale: Chỉ khăn đội đầu của thầy tế lễ, đặc biệt là của thầy tế lễ thượng phẩm; “khăn xếp” là cách gọi tự nhiên và đủ rõ trong tiếng Việt hiện đại.
- source_word: שֵׁשׁ
  choice: vải gai mịn
  rationale: Chỉ loại vải lanh/vải gai có phẩm chất mịn được dùng trong Đền Tạm và lễ phục tế lễ; cách dịch này vừa nêu chất liệu vừa giữ sắc thái về phẩm chất.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: những chiếc mũ trang nhã
  rationale: Cụm cấu tạo liên kết ý niệm về vẻ đẹp/trang sức với các mũ tế lễ; “mũ trang nhã” diễn đạt tự nhiên rằng chính các mũ có dáng vẻ đẹp đẽ, không coi đây là những đồ trang trí tách biệt.
- source_word: מִכְנְסֵי הַבָּד
  choice: quần lót bằng vải gai
  rationale: מִכְנָסַיִם chỉ y phục mặc bên dưới che phần thân dưới; “quần lót” rõ nghĩa và hiện đại, còn הַבָּד nêu chất liệu vải gai.
- source_word: מָשְׁזָר
  choice: se
  rationale: Mô tả sợi được xe/se lại; “vải gai se” ngắn gọn, tự nhiên và phản ánh kỹ thuật làm sợi thay vì diễn giải thành một kiểu dệt.
