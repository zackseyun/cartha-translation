base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Từ chỉ xanh lam, tím và đỏ thắm, họ làm các y phục dùng khi phục vụ trong nơi thánh[a]. Họ cũng làm các y phục thánh cho A-rôn, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các y phục được dệt công phu.” Cụm từ Hê-bơ-rơ này là một thuật ngữ chuyên biệt; nghĩa chính xác của từ chỉ loại y phục này còn chưa chắc chắn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: Từ sợi màu xanh lam, màu tím và màu đỏ thắm
  rationale: Ba thuật ngữ chỉ các màu/vật liệu nhuộm dùng cho hàng dệt của Đền Tạm. “Sợi” làm rõ nghĩa theo văn cảnh mà không xác định quá mức sắc độ cổ đại.
- source_word: בִגְדֵי שְׂרָד
  choice: những lễ phục dệt tinh xảo
  rationale: Cụm từ chuyên biệt và có nghĩa chưa hoàn toàn chắc chắn; cách dịch này giữ cả tính chất lễ nghi lẫn khả năng nhấn mạnh kỹ thuật dệt, đồng thời ghi nhận cách hiểu theo chức năng trong chú thích.
- source_word: לְשָׁרֵת
  choice: để phục vụ
  rationale: Diễn đạt tự nhiên mục đích thi hành công việc thờ phượng trong nơi thánh, không thêm chức danh không có trong câu.
- source_word: בַּקֹּדֶשׁ
  choice: trong nơi thánh
  rationale: Chỉ phạm vi thánh của việc phụng sự tại Đền Tạm; cách dịch này giữ được khả năng chỉ khu vực thánh mà không thu hẹp chắc chắn vào một gian cụ thể.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: các lễ phục thánh
  rationale: Giữ danh xưng trang trọng dành cho y phục tư tế của A-rôn và phân biệt với cụm từ đứng trước.
- source_word: לְאַהֲרֹן
  choice: cho A-rôn
  rationale: Giới từ biểu thị người được chỉ định sử dụng các lễ phục.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay bằng một tước hiệu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: “Đúng như” thể hiện sự làm theo chính xác; “đã truyền” tự nhiên trong lời tổng kết, quy chiếu về mệnh lệnh được ban trước đó.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn tư cách danh riêng và tránh âm thầm thay thế bằng tước hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “lễ phục” để phù hợp văn cảnh tư tế; giữ “nơi thánh” nhằm bảo toàn độ rộng nghĩa của הַקֹּדֶשׁ. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
