  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: vi
  text: Ông làm áo choàng của ê-phót, là công việc của thợ dệt[a], toàn bằng sợi xanh lam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hê-bơ-rơ chép sát nghĩa là “công việc của thợ dệt”; cũng có thể dịch là “một sản phẩm dệt”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ ở đây chỉ loại vật liệu dệt nhuộm xanh quý, được dùng trong Đền Tạm và lễ phục tư tế.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ עשה với waw liên tiếp thuật lại hành động kế tiếp. “Làm” là cách diễn đạt trực tiếp, tự nhiên; đại từ “ông” giữ chủ ngữ số ít giống đực hàm ẩn trong động từ Hê-bơ-rơ.
- source_word: מְעִיל
  choice: áo choàng
  rationale: מְעִיל chỉ một loại áo ngoài hoặc áo dài; “áo choàng” vừa dễ hiểu vừa phù hợp với ngữ cảnh lễ phục tư tế.
- source_word: הָאֵפֹד
  choice: ê-phót
  rationale: אֵפֹד là thuật ngữ chuyên biệt chỉ một lễ phục tư tế, không có từ tương đương đơn giản trong tiếng Việt; vì vậy dùng dạng phiên âm và giữ quan hệ sở hữu trong cụm “áo choàng của ê-phót”.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: do thợ dệt dệt nên
  rationale: Cụm từ có nghĩa sát là “công việc của thợ dệt”. Cách dịch này giữ rõ phương thức chế tác và người thợ, đồng thời tự nhiên hơn trong tiếng Việt; không thêm ý “khéo léo” vốn không được nêu ở đây.
- source_word: כְּלִיל
  choice: toàn bộ
  rationale: כְּלִיל diễn tả tính trọn vẹn, cho biết toàn thể chiếc áo có cùng chất liệu hoặc màu sắc được nói đến.
- source_word: תְּכֵלֶת
  choice: sợi màu xanh lam
  rationale: תְּכֵלֶת chỉ loại vật liệu dệt nhuộm xanh quý dùng trong Đền Tạm và lễ phục tư tế. “Sợi màu xanh lam” truyền đạt cả vật liệu dệt lẫn màu sắc trong ngữ cảnh này.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ê-phót” được giữ dưới dạng thuật ngữ phiên âm; cấu trúc “áo choàng của ê-phót” bảo toàn quan hệ từ ngữ của nguyên văn mà không giải thích quá mức cách hai lễ phục được mặc cùng nhau.
