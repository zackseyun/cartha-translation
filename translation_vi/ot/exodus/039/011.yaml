    rationale: ‘Carbuncle’ không đồng nghĩa với ‘hồng ngọc’, còn ‘jasper’ không đồng nghĩa với ‘ngọc thạch anh’. Cần dùng các cách gọi gần hơn là ‘ngọc hồng lựu’ và ‘ngọc bích’, đồng thời giữ lời cảnh báo về tính bất định của tên đá cổ.
  revised_text: 'Và hàng thứ hai: ngọc lam[a], xa-phia và kim cương.'
