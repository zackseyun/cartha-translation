  source_fidelity: 'Bản dịch giữ đúng cấu trúc liệt kê của nguyên văn: liên từ mở đầu, ‘hàng thứ hai’, và ba tên đá. Tuy nhiên, ‘ngọc lam sẫm’ không phải là cách gọi tương đương thông dụng, rõ ràng cho סַפִּיר trong tiếng Việt; ‘xa-phia’ là cách gọi chuẩn và trực tiếp hơn, phù hợp với lựa chọn sapphire của bản đối chiếu tiếng Anh.'
  naturalness: '‘Và hàng thứ hai: ngọc lam, xa-phia và kim cương.’ ngắn gọn, tự nhiên trong văn cảnh một danh sách các hàng đá. ‘Xa-phia’ tránh gây nhầm lẫn với ‘ngọc lam’ đứng ngay trước đó.'
