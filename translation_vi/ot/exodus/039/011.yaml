  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: vi
  text: 'Và hàng thứ hai: ngọc lam[a], xa-phia và kim cương.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chắc chắn một số loại đá quý thời cổ. נֹפֶךְ cũng có thể dịch là “ngọc lục bảo” hoặc “ngọc hồng lựu”; יָהֲלֹם cũng có thể dịch là “ngọc dạ lan hương” hoặc “ngọc bích”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: và hàng
  rationale: Trong ngữ cảnh các viên đá trên bảng đeo ngực, טוּר chỉ một hàng đá; וְ được chuyển là “và” để giữ cấu trúc liệt kê.
- source_word: הַ/שֵּׁנִי
  choice: thứ hai
  rationale: Số thứ tự “thứ hai”; kết hợp tự nhiên thành “hàng thứ hai” trong tiếng Việt.
- source_word: נֹפֶךְ
  choice: ngọc lam
  rationale: Danh tính chính xác của loại đá cổ này không chắc chắn. “Ngọc lam” là một tương đương hiện đại khả dĩ; các phương án khác được ghi ở chú thích.
- source_word: סַפִּיר
  choice: ngọc lam sẫm
  rationale: סַפִּיר thường được dịch là sapphire. “Ngọc lam sẫm” diễn đạt bằng tiếng Việt phổ thông, dù loại đá cổ có thể không hoàn toàn tương ứng với sapphire theo khoáng vật học hiện đại.
- source_word: וְ/יָהֲלֹם
  choice: và kim cương
  rationale: יָהֲלֹם là tên một loại đá quý chưa được xác định chắc chắn. “Kim cương” là cách dịch truyền thống thông dụng; các khả năng khác được bảo lưu trong chú thích.
