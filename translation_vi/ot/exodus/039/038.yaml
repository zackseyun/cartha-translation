translation:
  language: vi
  text: bàn thờ vàng, dầu xức, hương thơm[a], và màn che lối vào Lều[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hương từ các hương liệu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “màn che cửa Lều.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: bàn thờ bằng vàng
  rationale: Cụm Hê-bơ-rơ dùng danh từ “vàng” theo chức năng thuộc tính; cách dịch này tự nhiên và giữ rõ chất liệu của bàn thờ.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Chỉ loại dầu dùng trong nghi thức xức; đây là cách diễn đạt ngắn gọn, quen thuộc và trang trọng trong tiếng Việt.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: hương liệu thơm
  rationale: קְטֹרֶת là chất được đốt làm hương, còn סַמִּים chỉ các hương liệu thơm; cách dịch truyền đạt tự nhiên ý nghĩa của cả cụm mà không xác định quá mức thành phần.
- source_word: מָסַךְ
  choice: màn che
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ tấm màn treo ở lối vào; “màn che” vừa tự nhiên vừa phân biệt với bức màn ngăn bên trong.
- source_word: פֶּתַח הָאֹהֶל
  choice: lối vào Lều
  rationale: פֶּתַח là lối vào hay cửa vào; הָאֹהֶל trong văn cảnh chỉ căn Lều thuộc Đền Tạm. Viết hoa “Lều” giúp thể hiện đối tượng cụ thể mà không thêm từ không có trong nguyên văn.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: liệt kê bằng dấu phẩy và dùng “và” trước mục cuối
  rationale: Các liên từ kèm dấu hiệu tân ngữ tạo thành một danh sách; cấu trúc liệt kê này tự nhiên trong tiếng Việt và vẫn bảo toàn đủ bốn hạng mục.
