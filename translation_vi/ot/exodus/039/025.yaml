base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: vi
  text: Họ làm những chiếc chuông bằng vàng ròng, rồi đặt những chiếc chuông ấy xen giữa những quả lựu[a] trên gấu áo choàng, chung quanh, xen giữa những quả lựu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ở giữa những quả lựu”. Cụm từ Hê-bơ-rơ theo nghĩa đen là “ở giữa các quả lựu”, mô tả vị trí của các chuông so với những vật trang trí hình quả lựu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Họ làm
  rationale: Động từ עשה ở dạng kể chuyện tiếp nối, diễn tả bước chế tác kế tiếp; “Họ làm” tự nhiên và sát nghĩa.
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: những chiếc chuông bằng vàng ròng
  rationale: Giữ rõ cả vật liệu lẫn phẩm chất của vàng; “vàng ròng” là cách nói trang trọng, thông dụng cho זָהָב טָהוֹר.
- source_word: וַיִּתְּנוּ
  choice: rồi đặt
  rationale: נתן tại đây mang nghĩa đặt vào vị trí; “rồi” thể hiện tự nhiên trình tự của lối kể wayyiqtol.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: xen giữa những quả lựu
  rationale: בְּתוֹךְ theo nghĩa đen là “ở giữa/ở trong”, còn trong bố cục trang trí này chỉ vị trí các chuông giữa các hình quả lựu. “Xen giữa” diễn đạt rõ sự sắp xếp nhưng không xác định cứng rằng mỗi chuông chỉ nằm giữa đúng hai quả.
- source_word: הָרִמֹּנִים
  choice: những quả lựu
  rationale: Bản nguồn chỉ nói “quả lựu”; ngữ cảnh cho thấy đây là các vật trang trí hình quả lựu, nhưng không cần thêm cách giải thích ấy vào chính văn.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: trên gấu áo choàng
  rationale: שׁוּלִים chỉ gấu hoặc mép dưới, còn מְעִיל là áo choàng trong phẩm phục tư tế; cách dịch này tự nhiên và chính xác.
- source_word: סָבִיב
  choice: chung quanh gấu áo
  rationale: Từ này diễn tả sự sắp đặt vòng quanh; thêm “gấu áo” làm rõ đối tượng mà tiếng Việt cần nêu, dựa trực tiếp vào cụm ngay trước đó.
- source_word: בְּתוֹךְ הָרִמֹּנִים (lặp lại)
  choice: xen giữa những quả lựu
  rationale: Giữ nguyên sự lặp lại có chủ ý trong tiếng Hê-bơ-rơ, thay vì làm trơn câu và bỏ mất chi tiết cấu trúc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại của cụm chỉ vị trí như trong nguyên văn. Dùng “áo choàng” theo ngữ cảnh phẩm phục tư tế và “gấu áo” cho mép dưới của áo.
