base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/016.yaml
  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: vi
  text: Họ làm hai ổ nạm bằng vàng[a] và hai khoen vàng, rồi gắn hai khoen ấy vào hai đầu của bảng đeo ngực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khung nạm”, “đế nạm” hoặc “đồ nạm chạm lưới”. Từ Hê-bơ-rơ chỉ một chi tiết gia công bằng vàng, nhưng hình thức hoặc kỹ thuật chế tác chính xác chưa chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Họ làm
  rationale: Động từ Qal ở dạng wayyiqtol tiếp nối chuỗi hành động. Tiếng Việt không cần dịch liên từ וַ־ thành “và” ở đầu câu, vì “rồi” trong vế sau đã thể hiện tự nhiên trình tự kể chuyện.
- source_word: מִשְׁבְּצֹת
  choice: ổ nạm
  rationale: Từ này chỉ những chi tiết bằng vàng dùng để giữ, nạm hoặc làm chỗ gắn trong lễ phục tư tế. “Ổ nạm” phù hợp ngữ cảnh chế tác đồ trang sức mà không khẳng định quá mức một kỹ thuật cụ thể.
- source_word: זָהָב
  choice: bằng vàng / vàng
  rationale: Danh từ chỉ vật liệu được lặp lại hai lần trong tiếng Hê-bơ-rơ; bản dịch cũng giữ cả hai lần bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: טַבְּעֹת
  choice: khoen
  rationale: Trong ngữ cảnh cấu tạo Đền Tạm và lễ phục tư tế, đây là các vòng nhỏ dùng làm điểm nối. “Khoen” cụ thể và tự nhiên hơn “nhẫn”.
- source_word: וַיִּתְּנוּ
  choice: rồi gắn
  rationale: נתן ở đây có nghĩa đặt hoặc gắn một vật vào vị trí. “Gắn” diễn đạt tự nhiên chức năng của các khoen, còn “rồi” giữ quan hệ tiếp nối của wayyiqtol.
- source_word: עַל שְׁנֵי קְצוֹת
  choice: vào hai đầu
  rationale: עַל có thể mang nghĩa “trên” hoặc “tại”; với hành động gắn khoen vào vật, “vào hai đầu” là cách diễn đạt tự nhiên, đồng thời giữ hình ảnh không gian của שְׁנֵי קְצוֹת.
- source_word: הַחֹשֶׁן
  choice: bảng đeo ngực
  rationale: Trong ngữ cảnh lễ phục của thầy tế lễ thượng phẩm, חֹשֶׁן là vật được đeo trước ngực. “Bảng đeo ngực” rõ nghĩa, trang trọng và không thêm cụm “phán quyết” vốn không xuất hiện trong câu này.
