  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: vi
  text: các lễ phục dệt để phục vụ trong nơi thánh[a], các lễ phục thánh dành cho thầy tế lễ A-rôn, và các lễ phục của các con ông để họ thi hành chức tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các lễ phục dùng cho việc phục vụ”; cụm từ Hê-bơ-rơ có lẽ chỉ những đồ dệt được chế tác đặc biệt để dùng trong việc phục vụ tại nơi thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: các lễ phục được dệt tinh xảo
  rationale: בִּגְדֵי chỉ y phục, còn הַשְּׂרָד trong văn cảnh Đền Tạm có thể nói đến đồ dệt được chế tác đặc biệt. “Lễ phục được dệt tinh xảo” giữ sắc thái trang trọng và thủ công, đồng thời phân biệt cụm này với “các lễ phục thánh” theo sau.
- source_word: לְשָׁרֵת
  choice: để phục vụ
  rationale: שׁרת diễn tả sự phục vụ chính thức trong bối cảnh thờ phượng. “Phục vụ” tự nhiên trong tiếng Việt và không thêm một chức năng cụ thể ngoài nguyên văn.
- source_word: בַּקֹּדֶשׁ
  choice: trong nơi thánh
  rationale: קֹדֶשׁ ở đây chỉ không gian thánh dành cho việc phụng sự trong Đền Tạm. “Nơi thánh” bám sát từ ngữ Hê-bơ-rơ hơn “đền thánh” và không khiến người đọc liên tưởng sai đến một ngôi đền xây cố định.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: các lễ phục thánh
  rationale: Cụm sở thuộc này chỉ những y phục được biệt riêng cho chức tế lễ. “Lễ phục thánh” ngắn gọn, trang trọng và sát nghĩa.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: dành cho thầy tế lễ A-rôn
  rationale: Giữ quan hệ chỉ người nhận qua “dành cho” và chức danh apposition הַכֹּהֵן bằng cách gọi quen thuộc, dễ hiểu là “thầy tế lễ”.
- source_word: בִּגְדֵי בָנָיו
  choice: lễ phục của các con trai ông
  rationale: Giữ cấu trúc sở hữu của nguyên văn và quy chiếu rõ “ông” về A-rôn.
- source_word: לְכַהֵן
  choice: để họ thi hành chức tế lễ
  rationale: Động từ phái sinh từ כֹּהֵן nghĩa là hành chức như một tế lễ. “Thi hành chức tế lễ” truyền đạt chức năng nghề nghiệp rõ ràng và tự nhiên hơn cách dịch máy móc “làm tế lễ”.
theological_decisions:
- issue: Quan hệ giữa בִּגְדֵי הַשְּׂרָד và בִּגְדֵי הַקֹּדֶשׁ
  choice: 'Giữ hai cụm riêng biệt: “các lễ phục được dệt tinh xảo” rồi “các lễ phục thánh”.'
  alternative: Hiểu hai cụm gần như đồng nghĩa và dịch cụm đầu là “lễ phục dùng cho việc phục vụ”.
  rationale: Nguyên văn lặp lại בִּגְדֵי và dùng hai định ngữ khác nhau. Bản dịch duy trì sự phân biệt ấy nhưng không xác quyết quá mức chính xác loại hay công dụng của nhóm thứ nhất.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “lễ phục”, “nơi thánh” và “thi hành chức tế lễ” để người đọc phổ thông dễ hiểu. Dấu [a] được đặt ngay sau cụm cần chú thích.
