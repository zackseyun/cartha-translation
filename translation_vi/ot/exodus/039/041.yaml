  naturalness: Câu văn trang trọng, dễ hiểu. “các con trai ông” có thể đổi thành “các con ông” tự nhiên hơn trong tiếng Việt hiện đại, không đổi nghĩa.
  terminology: “Lễ phục”, “nơi thánh”, “thầy tế lễ” và “thi hành chức tế lễ” phù hợp văn cảnh tế tự. Dùng nhất quán “các lễ phục” ở vế cuối giúp câu cân đối và làm rõ đây là y phục của các con A-rôn.
