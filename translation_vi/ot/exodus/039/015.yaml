  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
translation:
  language: vi
  text: Họ làm trên bảng đeo ngực những dây xích bằng vàng ròng, bện như dây thừng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xoắn như dây thừng” hoặc “kết theo kiểu dây thừng.” Tiếng Hê-bơ-rơ mô tả những dây xích được làm theo dạng bện hoặc xoắn như dây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Họ làm
  rationale: Động từ עשה trong mạch tường thuật chỉ hành động chế tác; “làm” tự nhiên, rõ nghĩa và không thêm sắc thái ngoài nguyên văn.
- source_word: עַל הַחֹשֶׁן
  choice: trên bảng đeo ngực
  rationale: עַל giữ nghĩa không gian hoặc gắn vào; חֹשֶׁן trong bối cảnh phẩm phục thầy tế lễ chỉ vật được đeo trước ngực. “Bảng đeo ngực” rõ ràng và không thêm cụm “phán quyết” vốn không có trong câu này.
- source_word: שַׁרְשְׁרֹת
  choice: những dây xích
  rationale: Danh từ số nhiều chỉ các dây xích; cách dịch này thông dụng và phù hợp với vật bằng vàng.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: bện như dây thừng
  rationale: Cụm từ mô tả kiểu chế tác xoắn, bện hoặc kết thành dạng dây. “Bện như dây thừng” truyền đạt cả cấu trúc gia công lẫn hình dáng giống dây mà vẫn tự nhiên trong tiếng Việt.
- source_word: זָהָב טָהוֹר
  choice: bằng vàng ròng
  rationale: Cụm từ chỉ vật liệu là vàng tinh sạch; “vàng ròng” là cách nói hiện đại, trang trọng và quen thuộc.
