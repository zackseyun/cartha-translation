  source_fidelity: 'Bản dịch giữ đầy đủ các thành tố chính của tiếng Hê-bơ-rơ: chủ thể số nhiều không xác định, hành động chế tác, vị trí/gắn với bảng đeo ngực, các dây xích, kiểu gia công bện/xoắn như dây, và chất liệu vàng ròng. Cụm “bện như dây thừng” phản ánh cách hiểu hợp lý của גַּבְלֻת מַעֲשֵׂה עֲבֹת và không khẳng định quá mức một phương án từ nguyên đang có các cách diễn giải khác.'
