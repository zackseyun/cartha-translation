  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: vi
  text: 'Các viên đá ấy tương ứng với tên các con trai Y-sơ-ra-ên[a]: có mười hai viên, theo tên họ. Chúng được chạm khắc theo lối khắc ấn[b], từng viên theo tên tương ứng, cho mười hai chi tộc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mang tên các con trai Y-sơ-ra-ên.” Giới từ Hê-bơ-rơ ở đây có thể diễn tả sự gắn kết hoặc tương ứng.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn có thể hiểu là “những nét khắc của một con dấu”; cụm từ nói đến lối chạm khắc chữ như trên con dấu hoặc ấn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Các viên đá
  rationale: Danh từ xác định trong ngữ cảnh bảng đeo ngực; “đá” sát nghĩa hơn, còn tính chất đá quý đã rõ từ văn cảnh.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: mang tên các con trai của Y-sơ-ra-ên
  rationale: עַל ở đây diễn tả sự gắn kết/tương ứng. “Mang tên” tự nhiên trong tiếng Việt và phù hợp với việc tên được khắc trên đá.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Y-sơ-ra-ên
  rationale: Giữ sát cách gọi giao ước truyền thống và giới tính của danh ngữ Hê-bơ-rơ, thay vì khái quát thành “dân Y-sơ-ra-ên”.
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: gồm mười hai viên tương ứng với tên của họ
  rationale: Thể hiện rõ số lượng mười hai và quan hệ một-một giữa các viên đá với các tên.
- source_word: פִּתּוּחֵי חֹתָם
  choice: được khắc tên như khắc ấn
  rationale: Diễn đạt cách chạm khắc theo lối khắc con dấu/ấn, vừa tự nhiên vừa giữ hình ảnh của nguyên văn.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: Mỗi viên được khắc tên
  rationale: אִישׁ dùng theo nghĩa phân phối “mỗi”; thêm “viên” làm rõ sở chỉ là từng viên đá, không phải từng người.
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: đại diện cho mười hai bộ tộc
  rationale: לְ biểu thị quan hệ/hướng quy chiếu; “đại diện cho” làm rõ chức năng biểu trưng của mười hai viên đá trong tiếng Việt.
