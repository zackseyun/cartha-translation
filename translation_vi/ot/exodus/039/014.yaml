revisions:
- from: Các viên đá mang tên các con trai của Y-sơ-ra-ên[a], gồm mười hai viên tương ứng với tên của họ. Mỗi viên được khắc tên như khắc ấn[b], đại diện cho mười hai bộ tộc.
