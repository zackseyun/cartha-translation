  verdict: revise
  source_fidelity: 'Bản thảo giữ đúng các yếu tố chính: mười hai viên đá, liên hệ với tên các con trai Y-sơ-ra-ên, lối khắc ấn, và mười hai bộ tộc. Tuy nhiên, «đại diện cho» diễn giải thêm chức năng biểu tượng vượt quá cách nói quan hệ ngắn gọn của לְ; đồng thời cách diễn đạt «Mỗi viên được khắc tên như khắc ấn» làm mờ cấu trúc «các nét khắc của ấn, mỗi viên theo tên [tương ứng] của nó».'
