    issue: «đại diện cho mười hai bộ tộc»
    rationale: Động từ «đại diện» nêu rõ một chức năng biểu trưng vốn có thể suy ra từ ngữ cảnh, nhưng nguyên văn chỉ kết câu bằng cụm quan hệ «cho/thuộc về mười hai chi tộc». Nên tránh thêm diễn giải khi không cần thiết.
  - severity: low
    issue: «Mỗi viên được khắc tên như khắc ấn»
    rationale: Cách này có thể hiểu là tên được khắc theo cách khắc một chiếc ấn. Nguyên văn nói về lối khắc kiểu ấn/con dấu, rồi thêm mệnh đề phân phối «mỗi [viên] theo tên [tương ứng]». Nên biểu đạt hai nét này riêng, rõ hơn.
