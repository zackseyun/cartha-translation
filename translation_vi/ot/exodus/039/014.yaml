  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Y-sơ-ra-ên” và “bộ tộc” theo văn phong Kinh Thánh phổ thông; tái cấu trúc câu vừa phải để tránh chuỗi lặp gượng trong tiếng Việt mà vẫn giữ số lượng, tên gọi và hình ảnh khắc ấn của nguyên văn.
