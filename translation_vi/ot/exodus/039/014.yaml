  terminology: Giữ «Y-sơ-ra-ên». Dùng «chi tộc» cho שָׁבֶט, một thuật ngữ Kinh Thánh Việt ngữ thông dụng và sát hơn «bộ tộc» trong ngữ cảnh mười hai chi tộc Israel. Không thêm diễn giải thần học.
  issues:
