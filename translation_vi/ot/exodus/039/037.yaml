  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: vi
  text: chân đèn tinh sạch, các ngọn đèn của nó—những ngọn đèn được xếp theo thứ tự[a]—cùng mọi dụng cụ của nó và dầu thắp sáng;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “những ngọn đèn của sự sắp đặt.” Cụm từ Hebrew נֵרֹת הַמַּעֲרָכָה nhấn mạnh việc các ngọn đèn được sắp đặt theo trật tự quy định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: chân đèn
  rationale: מְנוֹרָה chỉ giá đỡ các ngọn đèn, không phải chỉ một ngọn đèn; “chân đèn” là cách gọi tự nhiên và quen thuộc trong tiếng Việt.
- source_word: הַטְּהֹרָה
  choice: tinh sạch
  rationale: טָהוֹר trong ngữ cảnh vật dụng thánh biểu thị sự tinh sạch về nghi lễ và vật liệu; “tinh sạch” giữ sắc thái trang trọng mà không thu hẹp thành nghĩa vệ sinh thông thường.
- source_word: נֵרֹתֶיהָ
  choice: các ngọn đèn của nó
  rationale: נֵר ở đây chỉ các ngọn đèn riêng thuộc chân đèn; cách dịch này giữ rõ quan hệ sở hữu trong tiếng Hebrew.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: những ngọn đèn được xếp theo thứ tự
  rationale: מַעֲרָכָה nhấn mạnh sự sắp đặt có trật tự, có thể theo quy định; cách diễn đạt này tự nhiên trong tiếng Việt và không xác định quá mức chi tiết của cách sắp đặt.
- source_word: כָּל כֵּלֶיהָ
  choice: mọi dụng cụ của nó
  rationale: כְּלִי là từ rộng chỉ vật dụng, dụng cụ hoặc đồ dùng; “dụng cụ” phù hợp với các vật đi kèm chân đèn mà không diễn giải quá cụ thể.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: dầu thắp sáng
  rationale: Cụm kết cấu này chỉ dầu dùng để chiếu sáng; “dầu thắp sáng” ngắn gọn, tự nhiên và giữ đúng công dụng.
