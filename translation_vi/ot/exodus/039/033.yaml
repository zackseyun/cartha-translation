base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: vi
  text: 'Rồi họ đem Đền Tạm đến với Môi-se—gồm lều và mọi vật dụng của Đền Tạm: các móc cài, các khung[a], các thanh ngang, các trụ và các đế[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các ván”. Từ Hê-bơ-rơ chỉ những cấu kiện đứng trong kết cấu Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các ổ đỡ”, tức những bộ phận nền để lắp các khung hoặc trụ vào.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Rồi họ đem
  rationale: Dạng wayyiqtol của בוא ở thể Hiphil tiếp nối diễn tiến tường thuật; “Rồi họ đem” tự nhiên trong tiếng Việt và giữ ý đưa một vật đến nơi/người nhận.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן chỉ nơi ngự thánh được dựng trong sách Xuất Hành. “Đền Tạm” là cách gọi quen thuộc, trang trọng và phân biệt toàn thể công trình với thành phần “lều” được nhắc ngay sau đó.
- source_word: אֶל מֹשֶׁה
  choice: đến cho Môi-se
  rationale: אֶל diễn tả hướng đến Môi-se; trong ngữ cảnh giao nộp công trình đã hoàn tất, “đến cho Môi-se” là tiếng Việt tự nhiên mà không thêm ý ông kiểm tra hay tiếp nhận chính thức.
- source_word: הָאֹהֶל
  choice: lều
  rationale: אֹהֶל có nghĩa thông thường là “lều” và ở đây nêu rõ một thành phần của Đền Tạm, không nên diễn giải quá mức thành riêng lớp phủ.
- source_word: כָּל כֵּלָיו
  choice: mọi vật dụng của Đền Tạm
  rationale: כְּלִי là từ rộng, có thể chỉ vật dụng, thiết bị hoặc bộ phận. “Mọi vật dụng” dễ hiểu và đủ rộng; lặp lại “của Đền Tạm” làm rõ sở thuộc trong tiếng Việt.
- source_word: קְרָסָיו
  choice: các móc cài
  rationale: קֶרֶס chỉ những chi tiết dùng để nối các tấm màn; “móc cài” diễn đạt cả hình dạng lẫn chức năng rõ hơn chỉ “móc”.
- source_word: קְרָשָׁיו
  choice: các khung
  rationale: קֶרֶשׁ chỉ các cấu kiện đứng của Đền Tạm. “Khung” nhấn mạnh chức năng kết cấu; “ván” vẫn là một khả năng từ vựng nên được ghi ở chú thích.
- source_word: בריחו (בְּרִיחָיו)
  choice: các thanh ngang
  rationale: בְּרִיחַ là các thanh liên kết và giữ những khung đứng với nhau; “thanh ngang” rõ chức năng trong tiếng Việt hiện đại.
- source_word: עַמֻּדָיו
  choice: các trụ
  rationale: עַמּוּד chỉ các cấu kiện đỡ theo chiều đứng; “trụ” ngắn gọn, tự nhiên và phù hợp ngữ cảnh kiến trúc.
- source_word: אֲדָנָיו
  choice: các đế
  rationale: אֶדֶן trong mô tả Đền Tạm là những bộ phận nền để lắp các khung hoặc trụ. “Đế” dễ hiểu; “ổ đỡ” diễn tả kỹ thuật cụ thể hơn nhưng kém quen thuộc.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Đền Tạm” theo thuật ngữ Kinh Thánh quen thuộc, đồng thời dùng các từ xây dựng phổ thông như “khung”, “thanh ngang”, “trụ”, “đế”. Các dấu chú thích được đặt ngay sau đúng từ có phương án dịch thay thế.
