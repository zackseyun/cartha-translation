translation:
  language: vi
  text: Hòm Lời Chứng[a], các đòn khiêng của hòm, và nắp chuộc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Hòm Chứng Tích.” “Lời Chứng” chỉ các bảng đá làm chứng cho giao ước được đặt trong hòm.'
    reason: Làm rõ nghĩa trực tiếp của הָעֵדֻת và mối liên hệ với các bảng giao ước, đồng thời nêu một cách dịch từ vựng khả dĩ mà không đồng nhất thuật ngữ này với “giao ước.”
lexical_decisions:
- source_word: אֲרֹן
  choice: hòm
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ chiếc hòm thánh; “hòm” là cách gọi tự nhiên và chính xác trong tiếng Việt.
- source_word: הָעֵדֻת
  choice: Chứng Ước
  rationale: Danh từ עֵדוּת có nghĩa trực tiếp là “chứng tích/lời chứng”; ở đây chỉ các bảng đá làm chứng cho giao ước được đặt trong hòm. “Chứng Ước” giữ được ý niệm chứng nhận giao ước mà không giản lược thành chính “giao ước”.
- source_word: בַּדָּיו
  choice: các đòn khiêng hòm
  rationale: Trong ngữ cảnh Đền Tạm, בַּדִּים là các đòn dùng để khiêng vật thánh. Thêm “hòm” làm rõ đại từ sở hữu của tiếng Hê-bơ-rơ và tạo cách diễn đạt tự nhiên.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Từ này chỉ chiếc nắp bằng vàng trên hòm, đồng thời mang ý nghĩa nghi lễ liên quan đến việc chuộc tội. “Nắp chuộc tội” vừa nhận diện vật thể vừa giữ sắc thái thần học của từ.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת trong danh sách các vật dụng thánh
  choice: nắp chuộc tội
  alternative: ngai thương xót; nắp hòm
  rationale: “Nắp chuộc tội” giữ cả hình dạng cụ thể là chiếc nắp và mối liên hệ từ nguyên-nghi lễ với sự chuộc tội, nhưng không áp đặt một lý thuyết chuộc tội cụ thể. “Ngai thương xót” có tính truyền thống nhưng dễ khiến độc giả hiện đại hình dung đây là một ngai riêng biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và gọn, phù hợp với một câu thuộc danh sách kiểm kê. Dùng “đòn khiêng” thay cho từ cổ; giữ thuật ngữ nghi lễ “nắp chuộc tội” nhưng diễn đạt đủ rõ cho độc giả phổ thông.
