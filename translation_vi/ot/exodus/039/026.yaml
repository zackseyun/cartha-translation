base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Một chiếc chuông và một quả lựu, một chiếc chuông và một quả lựu, quanh gấu áo choàng, khắp chung quanh, để phụng sự[a], đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để phục vụ” hoặc “để làm công việc phụng sự.” Động từ nguyên mẫu Hê-bơ-rơ diễn tả mục đích của áo choàng trong việc phụng sự của thầy tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: chiếc chuông
  rationale: Danh từ chỉ một chiếc chuông. Tính từ “bằng vàng” có trong ngữ cảnh trước đó nhưng không xuất hiện trong câu này, nên không được thêm vào.
- source_word: רִמּוֹן
  choice: quả lựu
  rationale: Từ này có nghĩa đen là “quả lựu”; trong ngữ cảnh lễ phục, nó chỉ vật trang trí mang hình quả lựu. Cách dịch ngắn gọn giữ được hình ảnh cụ thể của nguyên văn.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: dọc theo gấu áo choàng
  rationale: שׁוּלֵי chỉ phần mép dưới hay gấu áo, còn מְעִיל là áo choàng. “Dọc theo” diễn đạt tự nhiên vị trí các vật trang trí trên toàn bộ mép áo.
- source_word: סָבִיב
  choice: khắp chung quanh
  rationale: Trạng từ nhấn mạnh rằng cách sắp xếp này chạy vòng quanh toàn bộ gấu áo.
- source_word: לְשָׁרֵת
  choice: để phụng sự
  rationale: Động từ nguyên mẫu với לְ diễn tả mục đích. “Phụng sự” phù hợp với công việc thánh chức trong Đền Tạm mà không xác định quá mức chủ thể hàm ẩn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời dưới dạng chuyển tự, thay vì thay thế bằng một tước hiệu.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: đã truyền cho Môi-se
  rationale: Cách diễn đạt cho thấy mệnh lệnh đã được ban trước khi công việc được hoàn tất; cấu trúc tiếng Việt tự nhiên dùng “đã truyền cho”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng Tứ Tự Danh; “Yahweh” bảo tồn tên riêng giao ước thay vì thay bằng một danh xưng.
- issue: Chủ thể hàm ẩn và sắc thái mục đích của לְשָׁרֵת
  choice: để phụng sự
  alternative: để phục vụ; để làm công việc phụng sự
  rationale: Nguyên văn nêu mục đích liên quan đến việc phụng sự của thầy tế lễ nhưng không nói rõ lại chủ thể trong cụm này. Bản dịch giữ cấu trúc cô đọng và không giải quyết quá mức điều nguyên văn để hàm ẩn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên nhịp lặp “một chiếc chuông và một quả lựu” của tiếng Hê-bơ-rơ; dùng “áo choàng” và “gấu áo” là những từ thông dụng, đồng thời phù hợp với ngữ cảnh lễ phục.
