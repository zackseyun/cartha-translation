  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: vi
  text: Ông làm ê-phốt[a] bằng vàng, chỉ xanh lam, chỉ tím, chỉ đỏ thắm và vải lanh mịn, xe sợi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ê-phốt là một loại trang phục nghi lễ của thầy tế lễ; hình dáng chính xác của nó không được xác định đầy đủ.
    reason: cultural_term
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Thể wayyiqtol của עשה tiếp nối mạch kể chuyện bằng một hành động đã xảy ra; “làm” là cách diễn đạt tự nhiên, không tô đậm quá mức.
- source_word: אֶת
  choice: '[dấu hiệu chỉ tân ngữ trực tiếp, không dịch]'
  rationale: Từ này đánh dấu הָאֵפֹד là tân ngữ xác định và không có từ tương đương tự nhiên trong tiếng Việt.
- source_word: הָאֵפֹד
  choice: ê-phốt[a]
  rationale: Đây là tên một lễ phục chuyên biệt của hàng tư tế. Phiên âm giữ được thuật ngữ văn hóa-tôn giáo của nguyên bản, còn chú thích giúp độc giả hiện đại hiểu khái quát.
- source_word: זָהָב
  choice: vàng
  rationale: Nguyên bản chỉ nêu vật liệu là vàng; không tự ý thêm “sợi vàng”, dù văn cảnh kế tiếp giải thích vàng được dát và cắt thành sợi.
- source_word: תְּכֵלֶת
  choice: chỉ xanh lam
  rationale: Từ này chỉ vật liệu dệt nhuộm màu xanh quý dùng trong Đền Tạm. Thêm “chỉ” theo ngữ cảnh dệt may để câu tiếng Việt rõ và tự nhiên.
- source_word: וְאַרְגָּמָן
  choice: chỉ tím
  rationale: Đây là thuật ngữ màu sắc/vật liệu quen thuộc trong các mô tả về Đền Tạm; “chỉ tím” thể hiện rõ công dụng dệt may trong ngữ cảnh.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: chỉ đỏ thắm
  rationale: Cụm từ chỉ vật liệu được nhuộm màu đỏ thắm, thường là sợi trong văn cảnh hàng dệt của nơi thánh.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: và vải gai mịn xe sợi
  rationale: שֵׁשׁ là vải gai mịn, còn מָשְׁזָר mô tả sợi được xe/xoắn lại. Cách dịch này giữ cả chất liệu lẫn phương thức chuẩn bị sợi.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ê-phốt” như một thuật ngữ phiên âm nhất quán; lặp “chỉ” trước các màu để danh sách vật liệu rõ ràng trong tiếng Việt. Không thêm “sợi” vào “vàng” vì câu Hê-bơ-rơ này chỉ nêu vàng, dù câu sau giải thích cách chế tác.
