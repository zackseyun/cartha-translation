  rationale: Bản sửa thay thuật ngữ chất liệu bằng «vải lanh», là tương ứng trực tiếp và tự nhiên của שֵׁשׁ, đồng thời sửa chú thích để giải thích thuật ngữ phiên âm mà không vượt quá điều câu Kinh Thánh xác định. Các màu và cách diễn đạt «chỉ» được giữ vì phù hợp ngữ cảnh dệt may.
