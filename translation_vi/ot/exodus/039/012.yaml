translation:
  language: vi
  text: 'và hàng thứ ba: đá lê-shem[a], mã não[b] và thạch anh tím.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chính xác một số loại đá quý cổ trên bảng đeo ngực của thầy tế lễ thượng phẩm; đá lê-shem cũng có thể là hổ phách hoặc, theo truyền thống cũ, đá ligure.
    reason: lexical_alternative
  - marker: b
    text: Hoặc là “ô-ních”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הַשְּׁלִישִׁי
  choice: và hàng thứ ba
  rationale: Trong danh sách các viên đá của bảng đeo ngực, טוּר chỉ một hàng đá; liên từ וְ được giữ lại để nối với cấu trúc liệt kê ở câu trước.
- source_word: לֶשֶׁם
  choice: đá lê-shem
  rationale: Không thể xác định chắc chắn loại đá quý cổ này. Giữ dạng phiên âm giúp tránh tạo cảm giác chắc chắn sai rằng đó là hổ phách hay zircon màu vàng đỏ; chú thích nêu các cách nhận diện thường gặp.
- source_word: שְׁבוֹ
  choice: mã não
  rationale: Mã não là cách dịch truyền thống và dễ hiểu trong ngữ cảnh này, nhưng việc nhận diện đá quý cổ vẫn không chắc chắn; phương án 'mã não đen' được ghi ở chú thích.
- source_word: וְאַחְלָמָה
  choice: và thạch anh tím
  rationale: אַחְלָמָה thường được nhận diện là thạch anh tím; liên từ được thể hiện bằng 'và'.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn, phù hợp với cấu trúc liệt kê. Dùng 'đá lê-shem' để công khai sự bất định về khoáng vật học thay vì chọn một tên đá hiện đại quá chắc chắn; mọi dấu chú thích đều xuất hiện trong chính văn.
