  text: And they put the two gold cords on the two rings at the ends of the breastpiece[a].
translation:
  language: vi
  text: Họ gắn hai sợi dây bằng vàng vào hai vòng ở hai đầu bảng đeo ngực[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hai dây xích bằng vàng”. Từ Hê-bơ-rơ có thể chỉ dây xoắn hoặc những dải giống dây xích; tại đây chúng được làm bằng vàng và gắn vào bảng đeo ngực.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Họ gắn
  rationale: Động từ נתן cơ bản có nghĩa là đặt hoặc để; trong ngữ cảnh lắp ráp này, “gắn” diễn đạt tự nhiên việc đưa các sợi dây vào các vòng mà không thêm chi tiết kỹ thuật không có trong nguyên văn.
- source_word: שְׁתֵּי הָעֲבֹתֹת הַזָּהָב
  choice: hai sợi dây bằng vàng
  rationale: עֲבֹתֹת có thể chỉ dây xoắn hoặc vật dạng dây xích. “Dây bằng vàng” giữ hình ảnh cơ bản và chất liệu; khả năng dịch là “dây xích” được ghi ở chú thích.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: vào hai vòng
  rationale: עַל thường là “trên”, nhưng với thao tác gắn dây và vòng, “vào hai vòng” là cách nói tiếng Việt tự nhiên, vẫn giữ đúng quan hệ lắp ghép trong câu.
- source_word: עַל קְצוֹת
  choice: ở hai đầu
  rationale: קְצוֹת chỉ các đầu hoặc mép ngoài; “ở hai đầu” rõ ràng, tự nhiên và phù hợp với số lượng hai vòng.
- source_word: הַחֹשֶׁן
  choice: bảng đeo ngực
  rationale: חֹשֶׁן là vật phẩm đặc thù trong lễ phục thầy tế lễ. “Bảng đeo ngực” vừa dễ hiểu vừa phân biệt nó với một tấm giáp bảo vệ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng; dùng thuật ngữ “bảng đeo ngực” nhất quán với ngữ cảnh lễ phục thầy tế lễ. Câu tiếng Việt ưu tiên cách diễn đạt tự nhiên trong phần mô tả lắp ráp, đồng thời giữ phương án từ vựng còn nhập nhằng trong chú thích.
