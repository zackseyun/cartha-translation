  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: vi
  text: Họ làm hai khoen vàng và đặt chúng ở hai đầu tấm đeo ngực, trên mép ở phía trong[b], hướng về ê-phốt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quay về phía ê-phốt” hoặc “đối diện với ê-phốt.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ là “hướng vào trong” (nghĩa đen: “về phía nhà”), chỉ mặt của tấm đeo ngực nằm về phía ê-phốt.'
    reason: cultural_note
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: khoen vàng
  rationale: טַבַּעַת chỉ một vòng hoặc khoen dùng để liên kết; “khoen vàng” tự nhiên và phù hợp với công dụng trong phẩm phục tế lễ.
- source_word: הַחֹשֶׁן
  choice: tấm đeo ngực
  rationale: חֹשֶׁן là vật trang sức dạng tấm hoặc túi được thầy tế lễ đeo trước ngực; cách dịch này tránh gợi hình ảnh áo giáp như “giáp che ngực”.
- source_word: שְׂפָתוֹ
  choice: mép tấm ấy
  rationale: שָׂפָה có nghĩa đen là “môi” và cũng chỉ mép hoặc rìa của một vật; “mép” rõ nghĩa trong ngữ cảnh chế tác.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד
  choice: hướng về ê-phốt
  rationale: Cụm này xác định vị trí tương quan với ê-phốt nhưng có thể được hiểu là hướng về, quay mặt về hoặc đối diện với nó; bản dịch chính giữ cách diễn đạt không quá chuyên biệt.
- source_word: בָּיְתָה
  choice: ở phía trong
  rationale: Dạng chỉ hướng của בַּיִת có nghĩa đen là “về phía nhà/bên trong”; tại đây nó mô tả mặt trong của tấm đeo ngực.
- source_word: וַיָּשִׂימוּ עַל
  choice: và gắn vào
  rationale: שׂוּם עַל có nghĩa đặt lên hoặc đặt vào; “gắn vào” tự nhiên hơn trong ngữ cảnh các khoen được lắp vào phẩm phục.
- source_word: שְׁנֵי קְצוֹת
  choice: hai đầu
  rationale: קָצֶה chỉ đầu hoặc điểm tận cùng; “hai đầu” giữ nguyên ý mà không xác định quá mức là hai góc.
