base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: vi
  text: Họ làm các viên mã não[a], đặt trong các ổ vàng, được khắc theo lối khắc của con dấu, theo tên các con trai của Y-sơ-ra-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể giữ nguyên là “đá shoham”; chưa xác định chắc chắn đây là loại đá nào, dù “mã não” là cách dịch truyền thống.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Họ làm
  rationale: Động từ עשה có nghĩa rộng là “làm”; trong ngữ cảnh chế tác, “làm” tự nhiên và sát nghĩa.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: các viên mã não
  rationale: שֹׁהַם theo truyền thống thường được hiểu là mã não, nhưng loại đá chính xác chưa chắc chắn; vì vậy giữ cách gọi quen thuộc và ghi chú sự bất định.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: đặt trong những ổ bằng vàng
  rationale: Cụm từ mô tả các viên đá được bao quanh hoặc gắn trong những ổ đỡ chế tác bằng vàng; “ổ bằng vàng” rõ nghĩa trong ngữ cảnh đồ trang sức và không xác định quá mức kỹ thuật kim hoàn.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: được khắc như kiểu khắc con dấu
  rationale: Giữ cả thể bị động và hình ảnh về lối khắc dùng cho con dấu, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: עַל שְׁמוֹת
  choice: theo tên
  rationale: 'Giới từ עַל ở đây biểu thị sự tương ứng: việc khắc được thực hiện theo các tên.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Y-sơ-ra-ên
  rationale: Phản ánh trực tiếp danh từ giống đực số nhiều בְּנֵי và giữ ý nghĩa gia tộc của cụm từ trong câu này.
theological_decisions:
- issue: Cách dịch danh xưng giao ước בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Y-sơ-ra-ên
  alternative: con dân Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh các tên được khắc, cụm từ chỉ cụ thể các con trai mang tên của tổ phụ Y-sơ-ra-ên; bản dịch giữ dạng nam giới và quan hệ gia tộc, không trung hòa thành một danh xưng dân tộc rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc mô tả nghề thủ công của nguyên văn nhưng tránh lối diễn đạt gượng. Dùng “Y-sơ-ra-ên” theo cách phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
