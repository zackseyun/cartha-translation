  rationale: Bản sửa làm rõ hình ảnh các viên đá được gắn trong bộ phận bằng vàng, thay diễn đạt gượng về kỹ thuật khắc bằng một cụm từ Việt tự nhiên hơn, và hiệu đính cách diễn đạt của chú thích. Các điểm bất định về nhận diện khoáng vật vẫn được giữ nguyên; không thêm diễn giải thần học hay kỹ thuật.
