translation:
  language: vi
  text: 'và hàng thứ tư: beryl[a], onyx và jasper, được nạm trong các khung vàng, theo chỗ lắp của chúng.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chắc chắn một số loại đá quý trên bảng đeo ngực của thầy tế lễ thượng phẩm; “beryl,” “onyx” và “jasper” là những tương đương truyền thống thông dụng.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được nạm trong các khung vàng theo các ổ dành cho chúng.” Cụm từ Hê-bơ-rơ cuối câu mang tính kỹ thuật và có thể chỉ cách các viên đá được đặt vào những ổ đã định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: và hàng thứ tư
  rationale: Trong danh sách các đá quý trên bảng đeo ngực, טּוּר chỉ một hàng; liên từ וְ được giữ lại tự nhiên bằng “và”.
- source_word: תַּרְשִׁישׁ
  choice: ngọc lục bảo
  rationale: Danh tính khoáng vật không chắc chắn. “Ngọc lục bảo” là cách gọi truyền thống, dễ hiểu trong tiếng Việt, nhưng sự bất định được nêu rõ trong chú thích.
- source_word: שֹׁהַם
  choice: mã não
  rationale: שֹׁהַם thường được hiểu là onyx trong ngữ cảnh Đền Tạm; “mã não” là tên gọi phổ thông trong tiếng Việt, dù việc xác định chính xác loại đá vẫn còn tranh luận.
- source_word: וְיָשְׁפֵה
  choice: và ngọc bích
  rationale: יָשְׁפֵה thường tương ứng với jasper; “ngọc bích” là cách diễn đạt quen thuộc trong tiếng Việt, đồng thời chú thích bảo lưu sự không chắc chắn chung về các loại đá cổ.
- source_word: מֽוּסַבֹּת
  choice: được nạm
  rationale: Phân từ bị động diễn tả các viên đá được bao quanh hoặc cố định trong đồ kim hoàn; “được nạm” vừa tự nhiên vừa giữ nghĩa bị động.
- source_word: מִשְׁבְּצֹת זָהָב
  choice: trong những ổ bằng vàng
  rationale: מִשְׁבְּצֹת là các ổ hoặc khung được chế tác để giữ đá; “ổ bằng vàng” rõ nghĩa trong ngữ cảnh nghề kim hoàn.
- source_word: בְּמִלֻּאֹתָם
  choice: đúng vào vị trí của chúng
  rationale: Cụm từ kỹ thuật này có thể nói đến các vị trí được lấp đầy hoặc các ổ dành riêng cho đá. Cách dịch này tránh lặp vụng về với “ổ” mà vẫn giữ ý các viên đá được đặt vào chỗ đã định.
