  text: the covering of ram skins dyed red[a], the covering of fine leather, and the veil of the screen;
translation:
  language: vi
  text: tấm phủ bằng da cừu đực nhuộm đỏ, tấm phủ bằng da ta-khát[a], và bức màn che;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ תְּחָשִׁים (ta-khát) không rõ chỉ điều gì. Từ này có thể nói đến da của một loài vật đặc biệt; theo truyền thống, nó từng được dịch là “da cá heo” hoặc “da bò biển”. Một số bản dịch dùng cách gọi khái quát như “da thuộc tốt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: tấm phủ
  rationale: Danh từ này chỉ vật dùng để phủ. “Tấm phủ” tự nhiên trong tiếng Việt và không xác định quá mức cấu tạo của vật ấy.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: da cừu đực nhuộm đỏ
  rationale: Cách dịch này thể hiện đầy đủ “da”, “cừu đực” và sắc thái được làm cho đỏ, hợp lý nhất là được nhuộm đỏ.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: da ta-khát[a]
  rationale: Danh từ תְּחָשִׁים có sở chỉ không chắc chắn. Phiên âm giúp tránh khẳng định thiếu căn cứ rằng đây là da của một loài vật cụ thể hoặc chỉ là “da thuộc tốt”; chú thích cung cấp các khả năng.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: bức màn ngăn che
  rationale: פָּרֹכֶת là bức màn phân cách trong Đền Tạm, còn הַמָּסָךְ diễn tả chức năng che/ngăn. “Bức màn ngăn che” vừa tự nhiên vừa giữ được hai yếu tố của cụm Hê-bơ-rơ.
