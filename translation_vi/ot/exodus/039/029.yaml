base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: và đai thắt lưng[a] bằng sợi lanh mịn xe, sợi màu xanh lam, tím và đỏ thắm[b], do thợ thêu thực hiện, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dây lưng” hoặc “khăn thắt lưng”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên ngữ chỉ vật liệu nhuộm màu đỏ thắm; cũng có thể dịch là “đỏ son”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: đai thắt lưng
  rationale: Từ này chỉ chiếc đai thuộc lễ phục tư tế. “Đai thắt lưng” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại, đồng thời cụ thể hơn từ “đai” đứng riêng.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: sợi lanh mịn xe
  rationale: שֵׁשׁ chỉ loại lanh mịn, còn מָשְׁזָר mô tả sợi đã được xe; cách dịch này giữ cả chất liệu lẫn kỹ thuật chế tác.
- source_word: תְכֵלֶת
  choice: sợi xanh lam
  rationale: Từ này chỉ vật liệu dệt được nhuộm màu xanh lam quý giá dùng trong Đền Tạm; thêm “sợi” làm rõ ngữ cảnh dệt may.
- source_word: אַרְגָּמָן
  choice: tím
  rationale: “Tím” là cách gọi thông dụng và chính xác trong chuỗi màu của hàng dệt; danh từ “sợi” ở trước chi phối cả chuỗi.
- source_word: תוֹלַעַת שָׁנִי
  choice: đỏ thắm
  rationale: Cụm từ chỉ vật liệu được nhuộm màu đỏ thắm; cách dịch giữ sắc màu mà không buộc phải xác định chính xác chất liệu vốn được ngữ cảnh cung cấp.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: là sản phẩm của thợ thêu
  rationale: Cách diễn đạt này bảo toàn ý nhấn mạnh tay nghề của người thợ và tự nhiên hơn lối dịch sát chữ “công việc của thợ thêu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: “Đúng như” làm nổi bật sự làm theo chính xác; “đã truyền” phù hợp với lời tổng kết về mệnh lệnh có trước.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu hoặc một lối phiên âm khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ như một phần tiếp nối của danh sách trong ngữ cảnh, nên mở đầu bằng “và”. Các từ “sợi” và “thợ thêu” làm rõ ngữ cảnh hàng dệt mà không thêm diễn giải thần học.
