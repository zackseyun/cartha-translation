  terminology: Giữ “Yahweh” phù hợp với quyết định thuật ngữ đã nêu. “Đai thắt lưng” thích hợp trong bối cảnh lễ phục tư tế; “sợi lanh mịn xe” và chuỗi “sợi màu xanh lam, tím và đỏ thắm” giữ được tính chất vật liệu dệt mà không xác định quá mức kỹ thuật hay thuốc nhuộm.
