  terminology: “Bảng đeo ngực” là cách gọi trung tính, rõ nghĩa cho חֹשֶׁן trong ngữ cảnh này. “Hai lớp” giữ được ý cấu tạo kép mà không áp đặt rằng vật nhất thiết chỉ được gấp lại; chú thích nêu phương án thay thế thích hợp.
