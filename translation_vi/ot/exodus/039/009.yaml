  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: vi
  text: Nó có hình vuông. Họ làm bảng đeo ngực thành hai lớp[a]; khi ở dạng hai lớp, nó dài một gang tay và rộng một gang tay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được gấp đôi.” Từ Hê-bơ-rơ כָּפוּל cho biết bảng đeo ngực có cấu tạo kép hoặc được gấp lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: có hình vuông
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, chỉ rõ hình dạng bốn cạnh bằng nhau.
- source_word: הָיָה
  choice: Nó có
  rationale: Động từ đóng vai trò hệ từ trong lời mô tả trạng thái; kết hợp với “hình vuông” tạo câu tiếng Việt tự nhiên.
- source_word: כָּפוּל
  choice: thành hai lớp
  rationale: Truyền đạt cấu tạo kép mà không khẳng định quá mức rằng vật này nhất thiết được gấp lại; chú thích giữ phương án ấy.
- source_word: עָשׂוּ
  choice: họ làm
  rationale: Tương đương trực tiếp, bình dị với động từ thông dụng mang nghĩa làm hoặc chế tạo.
- source_word: הַחֹשֶׁן
  choice: bảng đeo ngực
  rationale: Chỉ đồ vật tế lễ được thầy tế lễ thượng phẩm đeo trước ngực; cách gọi rõ nghĩa, tự nhiên và không thêm cụm “phán quyết” vốn không có trong câu này.
- source_word: זֶרֶת
  choice: một gang tay
  rationale: Giữ đơn vị đo cổ theo cách người đọc tiếng Việt dễ hiểu, thay vì quy đổi sang đơn vị hiện đại.
- source_word: אָרְכּוֹ
  choice: dài
  rationale: Chuyển cấu trúc danh từ “chiều dài của nó” thành vị ngữ đo lường tự nhiên trong tiếng Việt.
- source_word: רָחְבּוֹ
  choice: rộng
  rationale: Cách diễn đạt thông dụng cho kích thước bề ngang.
- source_word: כָּפוּל
  choice: khi được gấp đôi
  rationale: Lần xuất hiện cuối nhắc lại rằng các kích thước được nêu áp dụng cho vật trong tình trạng kép; “gấp đôi” giữ khả năng vật liệu được gập lại, dù sắc thái này không hoàn toàn chắc chắn.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Giữ đơn vị cổ “gang tay”; tránh thuật ngữ giáo phái. Dấu chấm phẩy phản ánh sự chuyển từ hình dạng sang cách chế tạo và kích thước.
