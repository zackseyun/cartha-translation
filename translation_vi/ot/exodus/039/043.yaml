base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: vi
  text: Môi-se xem toàn bộ công việc, và kìa, họ đã làm công việc ấy; đúng như Yahweh đã truyền, họ đã làm như vậy. Môi-se chúc phước cho họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: xem xét
  rationale: Động từ ראה cơ bản là “thấy, xem”; trong ngữ cảnh Môi-se nhìn lại công việc đã hoàn tất, “xem xét” diễn đạt tự nhiên sắc thái kiểm tra mà không hàm ý phán xét quá mức.
- source_word: כָּל הַמְּלָאכָה
  choice: toàn bộ công việc
  rationale: מְלָאכָה chỉ công việc hoặc thành quả lao động; ở đây bao quát mọi hạng mục làm Đền Tạm.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ chức năng thu hút sự chú ý và nhấn mạnh nhẹ của הִנֵּה trong lối kể trang trọng.
- source_word: עָשׂוּ אֹתָהּ
  choice: họ đã làm xong
  rationale: עשה có nghĩa rộng là “làm, chế tạo”; “làm xong” phù hợp việc hoàn tất toàn bộ công trình, nhưng không thu hẹp vào riêng hành vi chế tạo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה כֵּן עָשׂוּ
  choice: họ đã làm đúng như Đức Giê-hô-va truyền phán
  rationale: Cấu trúc tương ứng כַּאֲשֶׁר...כֵּן nhấn mạnh sự tuân thủ chính xác; tiếng Việt tự nhiên dùng “đúng như” và vẫn giữ động từ “làm” lần thứ hai.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc, trang trọng trong tiếng Việt cho danh YHWH, thay vì thay danh ấy bằng một tước hiệu.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: Rồi Môi-se chúc phước cho họ
  rationale: ברך ở thể piel mang nghĩa “chúc phước”; “rồi” thể hiện diễn tiến kể chuyện tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản nguồn dùng trực tiếp danh YHWH. “Đức Giê-hô-va” bảo toàn đây là tên riêng và là dạng đã quen thuộc trong văn phong Kinh Thánh tiếng Việt; không thay bằng tước hiệu “CHÚA”.
- issue: Mức độ chính xác trong sự vâng lời của dân sự
  choice: đúng như Đức Giê-hô-va truyền phán
  alternative: theo như Đức Giê-hô-va truyền phán
  rationale: Cặp כַּאֲשֶׁר...כֵּן nhấn mạnh sự tương ứng giữa mệnh lệnh và việc thực hiện; “đúng như” giữ được điểm nhấn này mà không thêm một phán đoán thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể cùng sự nhấn mạnh của nguyên văn, nhưng tránh lặp vụng trong tiếng Việt bằng cách kết hợp cấu trúc “đúng như...”. Không cần chú thích văn bản vì câu không có dị bản hoặc điểm mơ hồ đáng kể cần đưa vào bản đọc.
