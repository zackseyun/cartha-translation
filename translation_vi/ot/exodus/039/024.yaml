  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của câu Hê-bơ-rơ: họ làm các “quả lựu,” dùng ba loại sợi/màu xanh lam, tím và đỏ tươi, được se, và đặt trên gấu áo choàng. Tuy nhiên, vị trí chú thích [a] trong bản nháp hiện gắn với “đỏ tươi” thay vì với “quả lựu”; đồng thời “se lại” có thể gợi ý hành động se lần nữa, không cần thiết trong nguyên văn.'
