- from: Họ làm những quả lựu bằng chỉ xanh lam, tím và đỏ tươi[a], se lại[b], trên gấu áo choàng.
  to: Họ làm các quả lựu[a] bằng sợi màu xanh lam, tím và đỏ tươi đã se[b], trên gấu áo choàng.
  rationale: Chỉnh lại vị trí các neo chú thích để chúng gắn đúng với thuật ngữ được giải thích, và đổi “se lại” thành “đã se” để diễn đạt tự nhiên, chính xác hơn tính chất của sợi trong nguyên văn. Những lựa chọn còn lại được giữ vì truyền đạt trung thành nội dung và phù hợp tiếng Việt hiện đại.
