  yaml_path: translation/ot/exodus/039/024.yaml
  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: vi
  text: Họ làm các quả lựu[a] bằng sợi màu xanh lam, tím và đỏ tươi đã se[b], trên gấu áo choàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “những vật trang trí hình quả lựu.” Tiếng Hê-bơ-rơ chỉ nói “những quả lựu,” lấy hình dạng của vật làm tên gọi.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ liệt kê vật liệu màu xanh lam, tím và đỏ tươi; “đã se” mô tả cách xử lý vật liệu dệt. Từ “sợi” được thêm vào trong tiếng Việt để làm rõ ý.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Họ làm
  rationale: Dạng kể chuyện Qal wayyiqtol ngôi 3 số nhiều của עשה; “họ làm” trực tiếp và tự nhiên trong tiếng Việt.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: trên gấu áo choàng
  rationale: עַל chỉ vị trí; שׁוּלֵי là phần mép dưới của y phục, còn מְעִיל là loại áo dài/áo khoác dùng ở đây cho lễ phục tư tế. “Gấu áo choàng” rõ nghĩa và tự nhiên.
- source_word: רִמּוֹנֵי
  choice: những quả lựu
  rationale: Tiếng Hê-bơ-rơ dùng trực tiếp danh từ “quả lựu”; trong ngữ cảnh đây là các vật trang trí có hình quả lựu, nhưng bản chính giữ cách gọi giản dị của nguyên văn.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: chỉ xanh lam, tím và đỏ tươi
  rationale: Ba thuật ngữ chỉ những vật liệu dệt đã nhuộm màu. Bổ sung “chỉ” để câu tiếng Việt rõ nghĩa, đồng thời giữ ba màu theo thứ tự nguyên văn.
- source_word: מָשְׁזָר
  choice: se lại
  rationale: Từ này mô tả vật liệu dệt được se hoặc xe; “se lại” dễ hiểu trong tiếng Việt hiện đại và không thêm mức độ như “se thật kỹ”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ trật tự thông tin gần nguyên văn; dùng “gấu áo choàng” thay cho cách diễn đạt cổ, và đặt đủ dấu chú thích [a], [b] trong bản chính.
