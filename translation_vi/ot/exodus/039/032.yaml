  rationale: 'Bản sửa bám sát trật tự và sự lặp lại của nguyên văn: toàn bộ công việc được hoàn tất; con cái Israel làm theo mọi điều Yahweh truyền cho Môi-se; và câu kết xác nhận “họ đã làm như vậy”. Sửa danh יהוה thành “Yahweh” theo audit trail, thay “con dân” bằng “con cái” để gần nguồn hơn, và đặt các chú thích vào đúng vị trí tham chiếu.'
