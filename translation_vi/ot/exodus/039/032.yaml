  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: vi
  text: Vậy, mọi công việc của Đền Tạm, tức Lều Hội Kiến, đã hoàn tất; con cái Israel[b] đã làm theo mọi điều Yahweh[a] truyền cho Môi-se; họ đã làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: YHWH là danh riêng của Đức Chúa Trời; cũng có thể phiên âm là “Gia-vê”.
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “người Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: đã hoàn tất
  rationale: Động từ כלה ở đây nói đến việc toàn bộ công trình được hoàn thành; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn tập trung vào công việc.
- source_word: כָּל עֲבֹדַת
  choice: toàn bộ công việc
  rationale: Giữ đầy đủ sắc thái bao quát của כָּל và hiểu עֲבֹדָה là công việc chế tác, xây dựng trong văn cảnh.
- source_word: מִשְׁכַּן
  choice: Đền Tạm
  rationale: Thuật ngữ quen thuộc trong tiếng Việt cho nơi thánh lưu động; thể hiện đây là nơi Đức Chúa Trời ngự giữa dân Ngài.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, quen thuộc, diễn đạt chiếc lều được chỉ định làm nơi gặp gỡ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Diễn đạt tự nhiên trong tiếng Việt về cộng đồng Israel, đồng thời còn giữ được yếu tố chỉ hậu duệ/con cái trong thành ngữ Hê-bơ-rơ.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: đúng mọi điều ... đã truyền
  rationale: 'Thể hiện sự hoàn toàn phù hợp với mệnh lệnh và trình tự thời gian: lệnh truyền có trước việc hoàn tất.'
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng đã phổ biến và dễ nhận biết trong tiếng Việt để biểu thị trực tiếp danh YHWH, không thay bằng một tước hiệu.
- source_word: כֵּן עָשׂוּ
  choice: họ đã làm y như vậy
  rationale: Giữ sự lặp lại có chủ ý ở cuối câu nhằm nhấn mạnh việc vâng lời chính xác.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng danh riêng YHWH. “Đức Giê-hô-va” là dạng danh riêng trang trọng, quen thuộc với độc giả Kinh Thánh tiếng Việt, và không biến danh ấy thành tước hiệu “CHÚA”.
- issue: Cách hiểu בְּנֵי יִשְׂרָאֵל như một danh xưng cộng đồng
  choice: con dân Israel
  alternative: con cái Israel; dân Israel
  rationale: Cụm từ chỉ toàn thể cộng đồng hậu duệ Israel. “Con dân Israel” vừa tự nhiên vừa không giới hạn việc vâng lời vào riêng nam giới, đồng thời vẫn gợi quan hệ dòng dõi.
- issue: Sự lặp lại của động từ עשה
  choice: 'giữ cả hai mệnh đề: “làm ...; họ đã làm y như vậy”'
  alternative: lược bỏ mệnh đề cuối để câu gọn hơn
  rationale: Sự lặp lại trong nguyên văn có tác dụng thần học và tu từ, nhấn mạnh rằng dân Israel đã hoàn toàn làm theo điều được truyền, nên không được âm thầm làm phẳng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hai tên gọi liên kết bằng “tức” để cho thấy “Đền Tạm” và “Lều Hội Kiến” cùng quy chiếu về công trình đang được nói đến; giữ câu kết lặp nhằm phản ánh điểm nhấn của nguyên văn.
