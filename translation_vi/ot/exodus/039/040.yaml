  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: vi
  text: các tấm màn của sân, các trụ và các đế của sân, màn che cho lối vào sân, các dây và các cọc, cùng mọi dụng cụ dùng cho công việc phục vụ Đền Tạm, cho Lều Hội Kiến;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַלְעֵי
  choice: các tấm màn
  rationale: Chỉ các tấm vải dệt tạo thành hàng rào bao quanh sân; “tấm màn” tự nhiên trong tiếng Việt và vẫn phân biệt được với bức màn tại lối vào.
- source_word: חָצֵר
  choice: sân
  rationale: Chỉ khu vực có rào bao quanh Đền Tạm; “sân” ngắn gọn, rõ nghĩa và phù hợp văn cảnh kiến trúc thánh.
- source_word: עַמֻּדֶיהָ
  choice: các trụ của sân
  rationale: Chỉ những bộ phận thẳng đứng nâng đỡ các tấm màn bao quanh sân. Lặp lại “của sân” giúp xác định rõ đại từ giống cái số ít trong tiếng Hê-bơ-rơ.
- source_word: אֲדָנֶיהָ
  choice: các đế của sân
  rationale: Chỉ các bộ phận nền để đặt hoặc giữ trụ; “đế” là cách diễn đạt hiện đại, dễ hiểu.
- source_word: הַמָּסָךְ
  choice: bức màn
  rationale: Chỉ tấm màn tại cửa vào, khác với các tấm màn bao quanh sân; ngữ cảnh “che lối vào” làm rõ chức năng.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: che lối vào sân
  rationale: לְ biểu thị quan hệ/chức năng của bức màn đối với cửa sân. “Lối vào” phù hợp với một cửa bằng vải hơn “cổng” trong tiếng Việt hiện đại.
- source_word: מֵיתָרָיו
  choice: các dây của sân
  rationale: Chỉ các dây dùng để giữ chắc kết cấu. Hậu tố số ít giống đực có thể quy chiếu về Đền Tạm ở ngữ cảnh rộng hơn, nhưng chuỗi liệt kê đặt cạnh sân khiến cách diễn đạt trung tính theo kết cấu là tự nhiên.
- source_word: וִיתֵדֹתֶיהָ
  choice: các cọc của sân
  rationale: Chỉ các cọc đóng xuống đất để neo dây; “cọc” là từ thông dụng và chính xác.
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: mọi dụng cụ dùng trong việc phục vụ
  rationale: כְּלֵי là danh từ rộng chỉ các vật dụng/khí cụ, còn עֲבֹדָה ở đây là công việc phục vụ thánh sở; cách dịch này rõ và trang trọng.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ tiếng Việt quen dùng cho nơi ngự thánh có thể di chuyển, đồng thời giữ sắc thái chuyên biệt của danh từ Hê-bơ-rơ.
- source_word: לְאֹהֶל מוֹעֵד
  choice: tức Lều Hội Kiến
  rationale: Cụm giới từ cuối câu có thể nêu phạm vi hoặc đồng vị với Đền Tạm. “Tức” thể hiện quan hệ giải thích tự nhiên trong tiếng Việt mà không đồng nhất cứng nhắc hai thuật ngữ trong mọi văn cảnh.
theological_decisions:
- issue: Quan hệ giữa הַמִּשְׁכָּן và לְאֹהֶל מוֹעֵד
  choice: Đền Tạm, tức Lều Hội Kiến
  alternative: Đền Tạm, dành cho Lều Hội Kiến
  rationale: Cú pháp Hê-bơ-rơ ngắn gọn và có phần gập ghềnh; trong danh mục này, cụm cuối nhiều khả năng xác định công việc phục vụ Đền Tạm trong tư cách Lều Hội Kiến. Cách dịch giữ cả hai danh xưng và tránh làm câu tiếng Việt tối nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; đây là một mục trong chuỗi liệt kê nên giữ dấu chấm phẩy cuối câu. Dùng “Đền Tạm” và “Lều Hội Kiến” nhất quán như các danh xưng thánh sở.
