base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Họ dùng một sợi dây xanh lam[a] buộc các khoen của bảng đeo ngực vào các khoen của ê-phót, để bảng ấy ở trên đai dệt tinh xảo[b] của ê-phót và không tuột khỏi ê-phót, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một sợi dây xanh tím”; sắc độ chính xác của từ Hê-bơ-rơ không chắc chắn.'
    reason: lexical_alternative
  - marker: b
    text: Tức phần đai được dệt trang trí và gắn với ê-phót; cũng có thể dịch là “đai dệt của ê-phót”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: buộc
  rationale: Động từ chỉ việc gắn chặt hoặc buộc các bộ phận với nhau; “buộc” tự nhiên trong ngữ cảnh dùng dây và không hàm ý loại nút buộc cụ thể.
- source_word: הַחֹשֶׁן
  choice: bảng đeo ngực
  rationale: Chỉ vật trang sức nghi lễ đeo trước ngực của thầy tế lễ thượng phẩm; cách dịch này tránh gợi ý sai rằng đó là áo giáp.
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: qua các khoen của nó vào các khoen của ê-phốt
  rationale: Diễn đạt hướng nối từ các khoen của bảng đeo ngực đến các khoen của ê-phốt, đồng thời phù hợp với cách dùng dây để gắn hai phần lại.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: dùng một sợi dây màu xanh lam
  rationale: פְתִיל là dây hoặc sợi dùng để buộc; תְּכֵלֶת là màu xanh lam quý dùng trong hàng dệt nghi lễ, dù sắc độ chính xác không chắc chắn.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: đai dệt tinh xảo của ê-phốt
  rationale: Trong ngữ cảnh này, חֵשֶׁב chỉ phần đai được dệt và gắn liền với ê-phốt; “dệt tinh xảo” phản ánh tính chất kỹ thuật, trang trí của bộ lễ phục.
- source_word: וְלֹא יִזַּח ... מֵעַל הָאֵפֹד
  choice: không tuột khỏi ê-phốt
  rationale: Diễn đạt tự nhiên ý bảng đeo ngực không bị xê dịch hoặc tách khỏi vị trí trên ê-phốt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” chuyển tự danh riêng và không thay nó bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thuật ngữ vay mượn “ê-phốt” vì đây là lễ phục đặc thù, đồng thời dùng “bảng đeo ngực” thay cho cách gọi dễ gợi liên tưởng đến áo giáp. Cấu trúc câu bám sát trình tự hành động và mục đích trong tiếng Hê-bơ-rơ nhưng được điều chỉnh cho tự nhiên trong tiếng Việt.
