  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: việc cố định bảng đeo ngực bằng dây màu xanh, các khoen của bảng và của ê-phót, mục đích để bảng ở trên đai của ê-phót và không tuột khỏi ê-phót, cùng công thức kết thúc. Tuy nhiên, cấu trúc “buộc bảng đeo ngực qua các khoen của nó vào các khoen” chưa tự nhiên và có thể làm mờ việc chính các khoen được buộc nối với nhau.'
