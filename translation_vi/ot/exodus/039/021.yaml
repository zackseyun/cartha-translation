revisions:
- from: Họ dùng một sợi dây màu xanh lam[a] buộc bảng đeo ngực qua các khoen của nó vào các khoen của ê-phốt, để bảng ấy nằm trên đai dệt tinh xảo[b] của ê-phốt và không tuột khỏi ê-phốt, đúng như Yahweh đã truyền cho Môi-se.
  to: Họ dùng một sợi dây xanh lam[a] buộc các khoen của bảng đeo ngực vào các khoen của ê-phót, để bảng ấy ở trên đai dệt tinh xảo[b] của ê-phót và không tuột khỏi ê-phót, đúng như Yahweh đã truyền cho Môi-se.
