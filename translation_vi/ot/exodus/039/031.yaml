  text: וַ/יִּתְּנ֤וּ עָלָי/ו֙ פְּתִ֣יל תְּכֵ֔לֶת לָ/תֵ֥ת עַל הַ/מִּצְנֶ֖פֶת מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Họ buộc vào bảng ấy một sợi dây xanh lam[a], để đặt bảng ấy trên phần trên của khăn đội đầu, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một sợi dây xanh” hoặc “một sợi dây màu xanh tím”; từ Hê-bơ-rơ תְּכֵלֶת chỉ loại vật liệu nhuộm xanh đặc trưng được dùng trong Đền Tạm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: Họ buộc vào đó
  rationale: Động từ נָתַן cơ bản là “đặt”, nhưng với עַל và trong ngữ cảnh sợi dây dùng để cố định bảng vàng, “buộc vào” diễn đạt tự nhiên chức năng gắn kết mà không diễn giải quá mức.
- source_word: פְּתִיל
  choice: một sợi dây
  rationale: Từ này chỉ sợi được xe hoặc dây nhỏ; “sợi dây” phù hợp với công dụng cố định vật trên khăn đội đầu.
- source_word: תְּכֵלֶת
  choice: màu xanh lam
  rationale: Chỉ chất liệu được nhuộm màu xanh đặc trưng trong Đền Tạm; cách dịch giữ màu sắc chính, còn chú thích nêu các khả năng diễn đạt khác.
- source_word: לָתֵת
  choice: để gắn
  rationale: Dạng nguyên mẫu diễn tả mục đích. Trong mạch văn, đối tượng được đặt và cố định trên khăn đội đầu, nên “để gắn” rõ nghĩa và tự nhiên.
- source_word: הַמִּצְנֶפֶת
  choice: khăn đội đầu
  rationale: Chỉ khăn đội đầu của thầy tế lễ thượng phẩm; cách gọi này rõ ràng với độc giả Việt hiện đại và không gợi sai hình dáng quá cụ thể.
- source_word: מִלְמָעְלָה
  choice: ở phía trên
  rationale: Giữ ý về vị trí cao hơn hoặc phần trên mà không tự ý xác định là phía trước.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: “Đúng như” thể hiện sự tương ứng chính xác trong công thức hoàn tất mệnh lệnh; thì quá khứ hoàn thành được diễn đạt tự nhiên bằng “đã truyền”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh YHWH; “Yahweh” bảo tồn danh riêng và không thay nó bằng tước hiệu.
- issue: Chủ thể ngầm của לָתֵת và đối tượng được đặt
  choice: diễn đạt “để gắn bảng ấy”
  alternative: “để đặt nó” hoặc hiểu dây là vật được đặt
  rationale: Đại từ không được nêu trong cụm mục đích; ngữ cảnh câu trước cho thấy bảng/miện thánh là vật được cố định trên khăn. Việc thêm “bảng ấy” làm rõ sở chỉ bằng thông tin trực tiếp từ ngữ cảnh, song không xác định thêm vị trí phía trước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “khăn đội đầu” thay cho thuật ngữ vay mượn khó hình dung; giữ “Yahweh” và “Môi-se” nhất quán. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
