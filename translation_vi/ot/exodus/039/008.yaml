revisions:
- from: 'Ông làm bảng đeo ngực[a] bằng kỹ thuật dệt hoa văn tinh xảo, giống như cách làm ê-phốt: dùng vàng, sợi màu xanh lam, màu tím, màu đỏ thắm, và sợi gai mịn xe lại.'
  to: 'Ông làm tấm đeo ngực[a], được dệt hoa văn tinh xảo, theo cùng kiểu chế tác như ê-phốt: bằng vàng, sợi xanh lam, sợi tím, sợi đỏ thắm và vải lanh mịn xe sợi.'
