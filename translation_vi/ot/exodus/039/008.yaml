  - severity: low
    issue: Cách gọi và cấu trúc “bảng đeo ngực ... giống như cách làm ê-phốt” chưa tự nhiên.
    rationale: Câu Hê-bơ-rơ so sánh tay nghề/kiểu chế tác của tấm đeo ngực với ê-phốt, không chỉ là một “cách làm” nói chung.
  - severity: low
