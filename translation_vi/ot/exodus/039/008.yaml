  text: וַ/יַּ֧עַשׂ אֶת הַ/חֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּ/מַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: vi
  text: 'Ông làm tấm đeo ngực[a], được dệt hoa văn tinh xảo, theo cùng kiểu chế tác như ê-phốt: bằng vàng, sợi xanh lam, sợi tím, sợi đỏ thắm và vải lanh mịn xe sợi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm che ngực”; theo truyền thống là “bảng đeo ngực” hoặc “bảng che ngực.” Đây là một bộ phận bằng vải dệt của lễ phục thầy tế lễ, không phải áo giáp bằng kim loại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Dạng wayyiqtol tiếp nối mạch thuật sự; tiếng Việt dùng quá khứ theo ngữ cảnh mà không cần thêm từ chỉ thời gian.
- source_word: הַחֹשֶׁן
  choice: bảng đeo ngực
  rationale: Chỉ vật phẩm tế lễ gắn với ê-phốt và đeo trước ngực; cách dịch này tránh gợi ý sai rằng đó là áo giáp kim loại.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: bằng kỹ thuật dệt hoa văn tinh xảo
  rationale: Cụm từ nhấn mạnh tay nghề tạo hoa văn có tính nghệ thuật, không chỉ việc chế tác nói chung.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: giống như cách làm ê-phốt
  rationale: Giữ rõ sự so sánh về phương thức và kỹ thuật chế tác giữa bảng đeo ngực với ê-phốt.
- source_word: אֵפֹד
  choice: ê-phốt
  rationale: Đây là thuật ngữ chuyên biệt chỉ lễ phục tư tế, không có từ tương đương chính xác trong tiếng Việt; dùng dạng phiên âm quen thuộc để giữ tính đặc thù.
- source_word: זָהָב
  choice: vàng
  rationale: Tên vật liệu trực tiếp và không mơ hồ trong ngữ cảnh.
- source_word: תְּכֵלֶת
  choice: sợi màu xanh lam
  rationale: Chỉ vật liệu dệt nhuộm màu xanh; thêm “sợi” làm rõ đây là danh sách vật liệu.
- source_word: וְאַרְגָּמָן
  choice: màu tím
  rationale: Cách gọi tự nhiên cho vật liệu nhuộm tím trong danh sách dệt; danh từ “sợi” ở đầu chuỗi được hiểu là chi phối các màu tiếp theo.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: màu đỏ thắm
  rationale: Cụm Hê-bơ-rơ chỉ vật liệu nhuộm đỏ thắm; giữ sắc thái màu truyền thống mà không diễn giải nguồn thuốc nhuộm.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: sợi gai mịn xe lại
  rationale: שֵׁשׁ chỉ loại vải/sợi gai mịn, còn מָשְׁזָר mô tả sợi được xe; cách diễn đạt giữ chi tiết kỹ thuật và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thuật ngữ chuyên biệt “ê-phốt” dưới dạng phiên âm; dùng “bảng đeo ngực” để diễn đạt chức năng và tránh liên tưởng đến giáp trụ. Cấu trúc câu bám sát trình tự của nguyên văn nhưng điều chỉnh tự nhiên theo cú pháp tiếng Việt.
