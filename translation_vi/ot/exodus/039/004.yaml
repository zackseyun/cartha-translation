  text: They made for it shoulder pieces[a], joined to it; at its two ends it was joined.
translation:
  language: vi
  text: Họ làm các miếng vai[a] cho ê-phót, gắn vào ê-phót; ở hai đầu, chúng được nối với nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dây vai”. Từ Hê-bơ-rơ chỉ những bộ phận của ê-phót nằm trên vai và nối các phần của áo lễ này.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: các miếng vai
  rationale: Danh từ số nhiều chỉ những bộ phận của ê-phót nằm trên vai và nối các phần của áo lễ; “miếng vai” cụ thể, tự nhiên và không khẳng định quá mức rằng đó là dây.
- source_word: עָשׂוּ
  choice: Họ làm
  rationale: Động từ עשה ở thể Qal, hoàn thành, ngôi ba số nhiều, mang nghĩa thông thường là “làm”; cách dịch trực tiếp phù hợp mạch thuật lại công việc chế tác.
- source_word: לּוֹ
  choice: cho ê-phót
  rationale: Hậu tố giống đực số ít quy chiếu đến ê-phót trong ngữ cảnh. Nêu rõ danh từ giúp câu tiếng Việt sáng nghĩa hơn đại từ “nó” ở vị trí này.
- source_word: חֹבְרֹת
  choice: nối liền với nó
  rationale: Dạng phân từ từ חבר diễn tả các miếng vai trong tình trạng được nối hoặc gắn kết; “nối liền” giữ được ý liên kết và tạo câu tự nhiên.
- source_word: עַל שְׁנֵי קצוותָו
  choice: ở hai đầu
  rationale: Cụm từ nói đến hai đầu hoặc hai mép ngoài của ê-phót; “ở hai đầu” là cách diễn đạt rõ ràng, tự nhiên trong ngữ cảnh may mặc.
- source_word: חֻבָּר
  choice: được nối lại
  rationale: Động từ Pual hoàn thành, ngôi ba số ít giống đực, mang nghĩa bị động. Lặp lại từ “nối” phản ánh sự lặp từ חבר trong tiếng Hê-bơ-rơ; “lại” ở đây diễn tả các phần được nối với nhau.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ê-phót” là thuật ngữ quen thuộc cho áo lễ trong ngữ cảnh Đền Tạm; nêu rõ chủ thể ở vế sau để tránh đại từ mơ hồ. Giữ sự lặp lại của gốc חבר bằng hai lần dùng “nối”.
