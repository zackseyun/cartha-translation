- from: Họ làm cho ê-phót các miếng vai[a] nối liền với nó; ê-phót được nối lại ở hai đầu.
  to: Họ làm các miếng vai[a] cho ê-phót, gắn vào ê-phót; ở hai đầu, chúng được nối với nhau.
  rationale: Bản sửa đặt «các miếng vai» ở vị trí tự nhiên sau «làm», làm rõ chúng được gắn vào ê-phót, và dùng «chúng» để vế cuối tiếp tục nói về các miếng vai. Cách này giữ ý bị động, sự lặp lại của gốc חבר, và cụm «ở hai đầu», nhưng tránh hàm ý không cần thiết của «nối lại».
