base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: vi
  text: Lỗ khoét của áo choàng nằm ở chính giữa áo, giống như lỗ khoét của áo giáp[a]. Quanh lỗ có một đường viền để khỏi bị rách.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ תַחְרָא hiếm gặp; cũng có thể dịch là “áo giáp lưới” hoặc “giáp che thân”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי
  choice: lỗ khoét
  rationale: Trong ngữ cảnh y phục, từ này chỉ lỗ để chui đầu qua, chứ không mang nghĩa đen là “miệng”. “Lỗ khoét” diễn đạt rõ cấu tạo của áo.
- source_word: הַמְּעִיל
  choice: áo choàng
  rationale: מְעִיל là một loại áo ngoài dài; “áo choàng” là cách gọi tự nhiên, trang trọng và phù hợp với y phục tế lễ trong ngữ cảnh.
- source_word: בְּתוֹכוֹ
  choice: nằm ở chính giữa áo
  rationale: Cụm từ xác định vị trí của lỗ khoét ở giữa y phục. Lặp lại “áo” giúp câu tiếng Việt rõ nghĩa hơn đại từ đơn thuần.
- source_word: כְּפִי תַחְרָא
  choice: giống như lỗ khoét của áo giáp
  rationale: תַחְרָא là từ hiếm, chỉ một loại y phục bảo hộ nhưng không xác định chắc cấu tạo cụ thể. “Áo giáp” giữ được nghĩa khái quát và tránh khẳng định quá mức rằng đó là giáp lưới hay giáp che thân.
- source_word: שָׂפָה
  choice: một đường viền
  rationale: Nghĩa cơ bản là “mép” hoặc “bờ”; tại đây từ này chỉ phần viền gia cố quanh lỗ áo. “Đường viền” vừa tự nhiên vừa giữ được hình ảnh của bản văn.
- source_word: לְפִיו סָבִיב
  choice: quanh lỗ
  rationale: Cụm từ cho biết đường viền bao quanh toàn bộ lỗ khoét. Cách diễn đạt này ngắn gọn và rõ trong tiếng Việt.
- source_word: לֹא יִקָּרֵעַ
  choice: để khỏi bị rách
  rationale: Dạng Niphal diễn tả việc không bị xé hoặc rách; trong cấu trúc câu này, đường viền có mục đích ngăn lỗ áo bị rách.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc danh từ cô đọng của tiếng Hê-bơ-rơ được chuyển thành hai câu tự nhiên; cách dịch khái quát “áo giáp” cùng chú thích bảo toàn sự không chắc chắn của từ hiếm תַחְרָא.
