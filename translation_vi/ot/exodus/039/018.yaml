translation:
  language: vi
  text: Họ đặt hai đầu của hai dây xích bện vào hai khung nạm, rồi đặt chúng trên các phần vai của ê-phót, ở phía trước ê-phót.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: đầu
  rationale: Danh từ chỉ các điểm tận cùng; “hai đầu” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: הָעֲבֹתֹת
  choice: dây xích bện
  rationale: Trong ngữ cảnh chế tác lễ phục, từ này chỉ loại dây xích được xoắn hoặc bện, không phải dây thừng thông thường.
- source_word: מִּשְׁבְּצֹת
  choice: ổ nạm
  rationale: Chỉ các bộ phận bằng vàng dùng để giữ hoặc gắn vật trang sức; “ổ nạm” giữ được sắc thái thủ công kim hoàn.
- source_word: וַיִּתְּנֻם
  choice: đặt chúng
  rationale: Động từ נתן ở đây mang nghĩa đặt/để; không dịch là “gắn chặt” vì như vậy sẽ cụ thể hóa quá mức cách thực hiện.
- source_word: כִּתְפֹת
  choice: miếng vai
  rationale: Trong cấu tạo của ê-phốt, từ này chỉ các bộ phận nằm trên vai của áo, chứ không đơn thuần là vai người.
- source_word: אֶל מוּל פָּנָיו
  choice: ở phía trước áo
  rationale: Cụm từ diễn tả vị trí hướng về mặt trước; đại từ hậu tố có thể quy chiếu về ê-phốt, nên nêu “áo” giúp câu tiếng Việt rõ nghĩa mà không thay đổi nội dung.
