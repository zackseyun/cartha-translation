  text: וְ/חֵ֨שֶׁב אֲפֻדָּת֜/וֹ אֲשֶׁ֣ר עָלָ֗י/ו מִמֶּ֣/נּוּ הוּא֮ כְּ/מַעֲשֵׂ/הוּ֒ זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: vi
  text: 'Đai dệt tinh xảo của ê-phót[a], ở trên ê-phót ấy, liền một thể với nó và có cùng kiểu chế tác: bằng vàng, chỉ xanh lam, chỉ tím, chỉ đỏ tươi và vải lanh mịn xe sợi, đúng như Yahweh đã truyền cho Môi-se.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đai trang trí của ê-phót ... được làm từ ê-phót ấy, theo cùng một công cách.” Tiếng Hê-bơ-rơ nhấn mạnh mối liên hệ chặt chẽ giữa đai và ê-phót, cùng sự tương ứng trong công cách chế tác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב
  choice: đai dệt tinh xảo
  rationale: Trong văn cảnh lễ phục tư tế, từ này chỉ phần đai dệt gắn với ê-phót; cách dịch nêu rõ tính chất hàng dệt và tay nghề chế tác.
- source_word: אֲפֻדָּתוֹ
  choice: ê-phót
  rationale: Giữ tên gọi riêng của loại lễ phục tư tế; hậu tố sở hữu được diễn đạt tự nhiên theo ngữ cảnh tiếng Việt.
- source_word: אֲשֶׁר עָלָיו
  choice: nằm trên ê-phót
  rationale: Diễn đạt trực tiếp vị trí của đai trên áo, đồng thời tránh đại từ có sở chỉ mơ hồ trong tiếng Việt.
- source_word: מִמֶּנּוּ הוּא
  choice: liền một thể với áo
  rationale: Cụm Hê-bơ-rơ nhấn mạnh đai không phải bộ phận rời mà được làm liền với ê-phót.
- source_word: כְּמַעֲשֵׂהוּ
  choice: được làm cùng một kiểu
  rationale: Bảo toàn ý rằng kỹ thuật hoặc kiểu chế tác của đai tương ứng với chính ê-phót.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: vàng, chỉ xanh lam, tím và đỏ tươi
  rationale: Dịch các vật liệu và màu sắc theo cách tự nhiên trong danh sách hàng dệt; từ “chỉ” được dùng chung cho ba màu.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe sợi
  rationale: Thể hiện cả chất liệu gai mịn và đặc điểm sợi được xe, phù hợp văn cảnh dệt may.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: Giữ công thức xác nhận sự vâng theo mệnh lệnh và phiên âm danh riêng giao ước יְהוָה là Yahweh.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; giữ tên Yahweh giúp phản ánh tên giao ước thay vì thay bằng một tước hiệu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “ê-phót” như thuật ngữ lễ phục quen thuộc; lặp lại “ê-phót/áo” để tránh sự mơ hồ của chuỗi đại từ. Dấu [a] được đặt ngay sau thuật ngữ cần chú thích.
