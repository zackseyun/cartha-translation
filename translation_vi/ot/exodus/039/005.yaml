revisions:
- from: 'Đai dệt tinh xảo của ê-phót[a], nằm trên ê-phót, liền một thể với áo và được làm cùng một kiểu: bằng vàng, chỉ xanh lam, tím và đỏ tươi, cùng vải gai mịn xe sợi, đúng như Yahweh đã truyền cho Môi-se.'
  to: 'Đai dệt tinh xảo của ê-phót[a], ở trên ê-phót ấy, liền một thể với nó và có cùng kiểu chế tác: bằng vàng, chỉ xanh lam, chỉ tím, chỉ đỏ tươi và vải lanh mịn xe sợi, đúng như Yahweh đã truyền cho Môi-se.'
  rationale: Bản sửa thay thuật ngữ chất liệu bằng “vải lanh mịn xe sợi,” giữ nhất quán tham chiếu đến ê-phót, và làm trôi chảy cách diễn đạt về vị trí, sự liên kết, cùng kiểu chế tác. Chú thích được chỉnh để nêu lựa chọn từ vựng mà không khẳng định quá mức chi tiết cấu tạo còn có thể diễn đạt theo nhiều cách.
