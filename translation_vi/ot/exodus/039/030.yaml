revisions:
- from: 'Họ làm tấm thẻ, tức vương miện thánh, bằng vàng nguyên chất, rồi khắc trên đó theo lối khắc con dấu: “Thánh cho Yahweh.”[a]'
  to: 'Họ làm tấm bảng, tức vương miện thánh, bằng vàng nguyên chất, rồi khắc trên đó, như khắc trên ấn tín: “Thánh cho Yahweh.”[a]'
  rationale: Chỉ thay đổi cách gọi vật thể và cách diễn đạt lối khắc để tiếng Việt hiện đại chính xác, tự nhiên hơn. Các lựa chọn còn lại giữ nguyên vì phản ánh đầy đủ cấu trúc đồng vị, chất liệu, danh riêng יהוה và tính cô đọng của dòng chữ trong nguyên văn.
