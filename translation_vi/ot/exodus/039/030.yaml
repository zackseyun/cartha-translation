source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: vi
  text: 'Họ làm tấm bảng, tức vương miện thánh, bằng vàng nguyên chất, rồi khắc trên đó, như khắc trên ấn tín: “Thánh cho Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sự thánh khiết thuộc về Yahweh” hoặc “Được biệt riêng cho Yahweh.”'
    reason: Bảo tồn sự mơ hồ thực sự trong công thức קֹדֶשׁ לַיהוָה giữa danh từ chỉ sự thánh khiết và ý nghĩa một vật được hiến dâng, biệt riêng cho Yahweh.
lexical_decisions:
- source_word: צִיץ
  choice: tấm thẻ
  rationale: Trong ngữ cảnh lễ phục tư tế, từ này chỉ tấm vàng gắn phía trước khăn đội đầu; “tấm thẻ” diễn đạt rõ một vật phẳng mang dòng chữ mà không đưa nghĩa hoa văn vào văn bản.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: vương miện thánh
  rationale: נֵזֶר chỉ vương miện hoặc dải miện biểu thị sự biệt riêng; cách đặt “tức vương miện thánh” giữ quan hệ đồng vị với צִיץ.
- source_word: זָהָב טָהוֹר
  choice: bằng vàng nguyên chất
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ rõ chất liệu và phẩm chất của vàng.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: rồi khắc trên đó
  rationale: Động từ cơ bản mang nghĩa “viết”, nhưng trên tấm vàng và cùng cụm nói về nét khắc con dấu, “khắc” truyền đạt tự nhiên hành động ghi chữ trong ngữ cảnh này.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: theo lối khắc con dấu
  rationale: 'Diễn đạt cách thức của dòng chữ: được chạm khắc theo kiểu khắc dùng cho con dấu.'
- source_word: קֹדֶשׁ לַיהוָה
  choice: Thánh cho Yahweh
  rationale: Giữ tính cô đọng của dòng chữ và ý nghĩa biệt riêng/dâng riêng cho Yahweh, đồng thời không buộc danh từ קֹדֶשׁ phải được hiểu duy nhất theo một cấu trúc tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tư cách danh riêng.
- issue: Ý nghĩa dòng chữ קֹדֶשׁ לַיהוָה
  choice: Thánh cho Yahweh
  alternative: Sự thánh khiết thuộc về Yahweh / Được biệt riêng cho Yahweh
  rationale: קֹדֶשׁ có thể được hiểu theo sắc thái danh từ “sự thánh khiết” hoặc theo ý nghĩa hiến dâng “thánh/biệt riêng”; bản chính giữ công thức ngắn gọn và chú thích nêu các cách diễn đạt rõ nghĩa hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tấm thẻ” cho vật bằng vàng mang dòng chữ; dùng “tức” để làm rõ quan hệ đồng vị. Dòng chữ được giữ ngắn, có tính nghi lễ; dấu hai chấm dẫn trực tiếp nội dung được khắc.
