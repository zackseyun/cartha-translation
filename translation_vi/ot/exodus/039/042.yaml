source:
  edition: WLC
  text: כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כָּל הָ/עֲבֹדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: vi
  text: Con cái Israel[a] đã làm mọi công việc đúng như mọi điều Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Israel” hoặc “người Israel.” Nguyên văn là “các con của Israel,” một danh xưng tập thể quen thuộc dành cho dân Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל ... כֵּן
  choice: đúng như mọi điều
  rationale: Hai yếu tố tương ứng כְּכֹל và כֵּן nhấn mạnh việc dân Israel làm phù hợp trọn vẹn với mệnh lệnh. Cách diễn đạt “đúng như mọi điều” tự nhiên trong tiếng Việt và giữ rõ quan hệ đối chiếu ấy.
- source_word: אֲשֶׁר
  choice: mà/điều
  rationale: Đại từ quan hệ nối כֹּל với nội dung Yahweh đã truyền. Trong cấu trúc tiếng Việt, ý này được diễn đạt tự nhiên bằng “mọi điều ... đã truyền” mà không cần dịch thành một từ riêng.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Động từ có nghĩa là ra lệnh hoặc truyền bảo. “Đã truyền” vừa trang trọng vừa cho thấy mệnh lệnh có trước việc hoàn tất công việc.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: Với động từ צוה, Môi-se là người nhận mệnh lệnh; tiếng Việt tự nhiên dùng “truyền cho Môi-se”.
- source_word: עָשׂוּ
  choice: đã làm
  rationale: Động từ עשה ở đây bao quát việc thực hiện toàn bộ công việc đã được truyền, nên “đã làm” phù hợp hơn một từ chỉ riêng việc chế tạo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Cụm từ theo sát nghĩa đen “các con của Israel” đồng thời là cách gọi tập thể dân giao ước. “Con cái Israel” giữ được hình ảnh thân tộc mà vẫn có thể chỉ toàn dân.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: mọi công việc
  rationale: עֲבֹדָה có thể chỉ công việc, lao động hoặc sự phục vụ; trong ngữ cảnh dựng Đền Tạm, “mọi công việc” diễn đạt rõ toàn bộ phần việc được giao.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước YHWH. Phiên âm “Yahweh” bảo tồn đây là danh riêng, không thay bằng tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: con trai Israel; dân Israel; người Israel
  rationale: Về hình thức, בָּנִים là danh từ giống đực số nhiều, nhưng cụm cố định này thường là danh xưng tập thể của dân Israel. “Con cái Israel” giữ hình ảnh nguyên ngữ mà không giới hạn sai đối tượng chỉ vào nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh theo tiếng Việt để tránh cấu trúc “theo... thì...” nặng nề, nhưng vẫn giữ quan hệ tương ứng giữa mệnh lệnh của Yahweh và việc dân Israel thực hiện. Dùng “Môi-se” theo cách phiên âm quen thuộc trong tiếng Việt và giữ “Israel” theo dạng quốc tế hiện đại.
