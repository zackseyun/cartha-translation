revisions:
- from: Họ dát mỏng những tấm vàng rồi cắt vàng thành sợi[a], để dệt xen vào sợi màu xanh lam, sợi màu tím, sợi màu đỏ tươi và vải gai mịn, theo kỹ thuật của người thợ thiết kế khéo léo[b].
  to: Họ dát mỏng các tấm vàng rồi cắt chúng thành sợi[a], để dệt xen vào sợi xanh lam, sợi tím, sợi đỏ tươi và vải lanh mịn, làm thành một công việc có hoa văn, do người thợ khéo léo thực hiện[b].
  rationale: Bản sửa thay thuật ngữ vật liệu sai bằng “vải lanh mịn”, làm rõ đại từ chỉ các tấm vàng, và diễn đạt mַעֲשֵׂה חֹשֵׁב như công việc có thiết kế/hoa văn khéo léo. Các phương án ở chú thích bảo toàn độ bất định về hình thức chính xác của các sợi vàng và sắc thái kỹ thuật của cụm cuối.
