  - severity: medium
    issue: “Theo kỹ thuật của người thợ thiết kế khéo léo” làm thay đổi cấu trúc của מַעֲשֵׂה חֹשֵׁב.
    rationale: Nguyên ngữ gọi thành phẩm/công việc là một công việc có thiết kế hay hoa văn khéo léo; “theo kỹ thuật” chuyển trọng tâm sang phương pháp và “thợ thiết kế” quy định vai trò quá hẹp.
