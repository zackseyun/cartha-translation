base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: vi
  text: Họ dát mỏng các tấm vàng rồi cắt chúng thành sợi[a], để dệt xen vào sợi xanh lam, sợi tím, sợi đỏ tươi và vải lanh mịn, làm thành một công việc có hoa văn, do người thợ khéo léo thực hiện[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cắt thành những dải mảnh.” Ý nói các tấm vàng đã được dát mỏng rồi cắt thành những sợi hoặc dải nhỏ để dệt vào vải.'
    reason: lexical_alternative
  - marker: b
    text: Cụm Hê-bơ-rơ này cũng có thể dịch là “công việc của một nghệ nhân khéo léo” hoặc “công việc dệt có hoa văn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב
  choice: Họ dát mỏng những tấm vàng
  rationale: Động từ רקע trong ngữ cảnh gia công kim loại chỉ việc dùng lực đập hoặc dát kim loại thành những tấm mỏng. “Dát mỏng” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: rồi cắt vàng thành sợi
  rationale: Cụm Hê-bơ-rơ mô tả việc cắt những tấm vàng đã dát thành các sợi hoặc dải rất mảnh để đưa vào hàng dệt. Bổ sung “vàng” làm rõ tân ngữ vốn được hiểu từ ngữ cảnh.
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: để dệt xen vào
  rationale: Nghĩa đen rộng là “để làm ở giữa/trong”, nhưng trong ngữ cảnh chế tác hàng dệt, ý là đưa các sợi vàng vào giữa những sợi vật liệu khác. “Dệt xen vào” truyền đạt rõ thao tác thủ công mà không làm thay đổi mục đích câu.
- source_word: הַתְּכֵלֶת ... הָאַרְגָּמָן ... תּוֹלַעַת הַשָּׁנִי
  choice: sợi màu xanh lam, sợi màu tím, sợi màu đỏ tươi
  rationale: Các từ chỉ chất liệu được nhuộm màu trong hàng dệt Đền Tạm. Dùng “sợi màu” khiến hình ảnh dệt xen sợi vàng rõ ràng đối với độc giả hiện đại; “đỏ tươi” giữ sắc thái của תּוֹלַעַת הַשָּׁנִי.
- source_word: הַשֵּׁשׁ
  choice: vải gai mịn
  rationale: שֵׁשׁ trong ngữ cảnh Đền Tạm chỉ loại vải lanh mịn. “Vải gai mịn” là cách gọi tiếng Việt dễ hiểu và giữ ý về phẩm chất vật liệu.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: theo kỹ thuật của người thợ thiết kế khéo léo
  rationale: Đây là thuật ngữ chỉ công việc có hoa văn, được thiết kế và thực hiện bằng tay nghề chuyên môn. Cách dịch này giữ cả yếu tố thiết kế lẫn sự khéo léo mà không xác định quá hẹp chức danh người thợ.
theological_decisions: []
translation_notes:
  register: 'Văn phong trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Câu giữ trình tự thao tác của nguyên văn: dát vàng, cắt thành sợi, rồi dệt xen vào các vật liệu màu. Các danh từ vật liệu được diễn đạt cụ thể để độc giả phổ thông dễ hình dung.'
