    rationale: מִמּוּל פָּנָיו quy chiếu đến ê-phốt trong ngữ cảnh; “trên mặt trước của ê-phốt” biểu đạt rõ và tự nhiên hơn mà vẫn giữ quan hệ không gian của câu nguồn.
  - severity: low
    issue: “Hai miếng vai” có sắc thái khẩu ngữ và vật liệu rời.
    rationale: כִתְפֹת chỉ các bộ phận vai của trang phục; “hai phần vai” là cách gọi trung tính, tự nhiên hơn.
