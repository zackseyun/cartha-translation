  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: vi
  text: Họ làm hai khoen vàng và gắn chúng vào hai phần vai của ê-phốt, ở phía dưới, trên mặt trước của ê-phốt, ngang với chỗ nối của nó và phía trên đai dệt khéo của ê-phốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַבְּעֹת
  choice: khoen
  rationale: Trong ngữ cảnh các bộ phận dùng để liên kết lễ phục, từ này chỉ những vòng kim loại; “khoen” tự nhiên và chính xác trong tiếng Việt.
- source_word: כִתְפֹת
  choice: hai miếng vai
  rationale: Chỉ các bộ phận nằm trên vai của lễ phục, không đơn thuần là vai trên cơ thể.
- source_word: אֵפֹד
  choice: ê-phốt
  rationale: Giữ thuật ngữ chuyên biệt chỉ lễ phục của thầy tế lễ thượng phẩm bằng hình thức phiên âm quen thuộc.
- source_word: מִלְמַטָּה
  choice: ở phía dưới
  rationale: Diễn đạt trực tiếp vị trí thấp hơn trên ê-phốt.
- source_word: מִמּוּל פָּנָיו
  choice: nơi mặt trước
  rationale: Diễn đạt tự nhiên ý nghĩa sát chữ là ở phía trước hay đối diện mặt trước của vật.
- source_word: לְעֻמַּת
  choice: ngang với
  rationale: Từ này biểu thị sự tương ứng hoặc thẳng hàng về vị trí; “ngang với” tránh áp đặt ý hai vật đối diện nhau.
- source_word: מֶחְבַּרְתּוֹ
  choice: chỗ nối của nó
  rationale: Giữ nghĩa rộng là nơi các phần được nối hoặc gắn với nhau, thay vì thu hẹp thành đường may.
- source_word: חֵשֶׁב
  choice: đai dệt khéo
  rationale: Chỉ phần đai dệt gắn với ê-phốt; “dệt khéo” truyền đạt tính thủ công tinh xảo trong ngữ cảnh.
- source_word: וַיִּתְּנֻם
  choice: gắn chúng
  rationale: Trong ngữ cảnh đặt các khoen lên lễ phục, “gắn” tự nhiên hơn “đặt” và thể hiện chức năng liên kết mà không thêm chi tiết về phương thức.
theological_decisions: []
