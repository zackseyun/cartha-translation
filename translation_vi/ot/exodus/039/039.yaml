  text: the bronze altar[a], and the bronze grating that was for it, its poles, and all its utensils; the basin and its stand[b];
translation:
  language: vi
  text: bàn thờ bằng đồng, vỉ lưới bằng đồng dành cho bàn thờ, các đòn khiêng cùng mọi dụng cụ của bàn thờ; chậu và chân đế của chậu;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: bàn thờ bằng đồng
  rationale: מִזְבַּח có nghĩa là bàn thờ; không thêm “dâng lễ thiêu” vì câu Hê-bơ-rơ này chỉ dùng danh từ chung. נְחֹשֶׁת có thể chỉ đồng hoặc đồng hợp kim; “đồng” là cách gọi tự nhiên và không xác định quá mức trong tiếng Việt.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: vỉ lưới bằng đồng
  rationale: מִכְבָּר chỉ một kết cấu dạng mắt lưới gắn với bàn thờ. “Vỉ lưới” vừa gợi đúng hình dạng và công dụng, vừa dễ hiểu trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר לוֹ
  choice: dành cho bàn thờ
  rationale: Cụm quan hệ diễn tả sự liên thuộc của vỉ lưới với bàn thờ mà không xác định quá mức vị trí của nó.
- source_word: בַּדָּיו
  choice: các đòn khiêng
  rationale: בַּדִּים là những thanh dùng để khiêng các vật dụng của Đền Tạm; “đòn khiêng” rõ nghĩa hơn “đòn” đứng riêng.
- source_word: כָּל־כֵּלָיו
  choice: mọi dụng cụ của bàn thờ
  rationale: כֵּלִים là thuật ngữ rộng chỉ các vật dụng hoặc thiết bị. Lặp “bàn thờ” thay cho đại từ giúp câu tiếng Việt rõ chủ thể sở hữu.
- source_word: הַכִּיֹּר
  choice: chậu
  rationale: כִּיּוֹר chỉ vật chứa dùng để rửa; “chậu” là từ hiện đại, thông dụng và phù hợp hơn từ cổ hoặc chuyên biệt.
- source_word: כַּנּוֹ
  choice: chân đế của chậu
  rationale: כֵּן chỉ bộ phận nâng đỡ hoặc bệ đỡ. “Chân đế” diễn đạt tự nhiên chức năng ấy; thêm “của chậu” để tránh đại từ mơ hồ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ cấu trúc liệt kê của nguyên văn; dùng dấu chấm phẩy cuối câu vì đây là một phần trong danh sách kéo dài từ các câu lân cận. Không thêm chi tiết “dâng lễ thiêu” vốn không được nhắc lại trong câu này.
