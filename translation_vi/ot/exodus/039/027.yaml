    issue: “Họ may” cụ thể hóa động từ עשה.
    rationale: עשה có nghĩa khái quát là “làm/chế tác”; cụm tiếp theo xác định đây là công việc của thợ dệt, nhưng không khẳng định riêng thao tác may.
  - severity: low
    issue: “Vải gai mịn” chưa phải cách tương đương tối ưu cho שֵׁשׁ.
    rationale: Trong ngữ cảnh Đền Tạm, שֵׁשׁ thường chỉ vải lanh mịn; “vải lanh mịn” vừa chính xác vừa tự nhiên hơn trong tiếng Việt hiện đại.
  - severity: medium
    issue: Neo chú thích [a] hiện đặt sau “vải gai mịn” dù nội dung chú thích giải thích מַעֲשֵׂה אֹרֵג.
    rationale: Dấu chú thích phải đặt sau cụm “do thợ dệt làm” để người đọc nhận rõ từ/cụm từ được chú giải.
  revised_text: Họ làm các áo dài bằng vải lanh mịn, do thợ dệt làm[a], cho A-rôn và các con trai ông.
