  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: vi
  text: Họ làm các áo dài bằng vải lanh mịn, do thợ dệt làm[a], cho A-rôn và các con trai ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “công việc dệt.” Cụm từ Hê-bơ-rơ nhấn mạnh rằng các áo này là sản phẩm của công việc dệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Họ may
  rationale: Động từ עשה có nghĩa rộng là “làm”; trong ngữ cảnh tạo áo bằng vải dệt, “may” tự nhiên và cụ thể trong tiếng Việt, mà không cần dịch máy móc liên từ mở đầu.
- source_word: הַכָּתְנֹת
  choice: các áo dài
  rationale: כֻּתֹּנֶת chỉ loại áo mặc sát thân, thường dài; “áo dài” diễn đạt dễ hiểu hơn “áo khoác” và cụ thể hơn “áo”, nhưng không đồng nhất với quốc phục Việt Nam vì ngữ cảnh tư tế đã xác định nghĩa.
- source_word: שֵׁשׁ
  choice: vải gai mịn
  rationale: Trong ngữ cảnh Đền Tạm và y phục tư tế, שֵׁשׁ chỉ loại vải lanh/gai mịn. “Vải gai mịn” là cách gọi tự nhiên, có phẩm chất vật liệu rõ ràng.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: là sản phẩm của thợ dệt
  rationale: Cụm kết cấu nhấn mạnh kỹ thuật và người thợ dệt; cách dịch này giữ được sắc thái thủ công, đồng thời phù hợp cú pháp tiếng Việt.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: cho A-rôn và các con trai ông
  rationale: Giữ quan hệ thụ hưởng/mục đích của giới từ לְ và diễn đạt rõ đại từ sở hữu chỉ về A-rôn.
