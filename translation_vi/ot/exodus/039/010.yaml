  terminology: Các nhận diện khoáng vật cổ đều bất định. Giữ các cách gọi truyền thống “hồng ngọc, hoàng ngọc, ngọc lục bảo” trong bản văn và nêu rõ tính bất định trong chú thích, không khẳng định các đồng nhất hóa hiện đại.
