review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính: bốn hàng đá và ba viên ở hàng thứ nhất. Tuy nhiên, “lục ngọc” không phải là tên gọi chuẩn, tự nhiên cho đá được dịch truyền thống là “emerald”; “ngọc lục bảo” phù hợp hơn. Không cần thêm “quý”, vì אָבֶן chỉ nói “đá” và bản văn không xác định giá trị của từng loại theo thuật ngữ hiện đại.'
