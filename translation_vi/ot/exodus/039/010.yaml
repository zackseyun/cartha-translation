translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng câu ngắn theo lối mô tả công việc chế tác; giữ chú thích ngay sau tên viên đá đầu tiên để bao quát sự bất định của cả ba tên đá.
