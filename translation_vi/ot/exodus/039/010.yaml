base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/010.yaml
  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: vi
  text: 'Họ gắn vào đó bốn hàng đá: hàng thứ nhất gồm hồng ngọc[a], hoàng ngọc và ngọc lục bảo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chắc chắn các loại đá này. “Hồng ngọc”, “hoàng ngọc” và “ngọc lục bảo” theo các cách dịch truyền thống phổ biến. Các khả năng khác lần lượt gồm mã não đỏ, olivin vàng lục, và một loại đá xanh rực sáng hoặc lấp lánh khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ
  choice: Họ gắn
  rationale: Động từ có nghĩa cơ bản là “làm đầy”, nhưng trong ngữ cảnh chế tác bảng đeo ngực, ý là đặt và gắn các viên đá vào vị trí; “gắn” tự nhiên và cụ thể trong tiếng Việt.
- source_word: בּוֹ
  choice: vào đó
  rationale: Đại từ chỉ lại bảng đeo ngực; giới từ ב phù hợp với hình ảnh các viên đá được gắn vào các ổ trên vật ấy.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: bốn hàng đá quý
  rationale: טוּרֵי là “các hàng”, còn אָבֶן được dùng theo nghĩa tập hợp. Thêm “quý” làm rõ đây là các loại đá trang sức mà không thay đổi ý.
- source_word: טוּר ... הַטּוּר הָאֶחָד
  choice: Hàng thứ nhất gồm
  rationale: Trong mạch liệt kê bốn hàng, הָאֶחָד chỉ hàng đầu tiên. “Gồm” giúp câu liệt kê tự nhiên trong tiếng Việt.
- source_word: אֹדֶם
  choice: hồng ngọc
  rationale: Tên loại đá không được xác định chắc chắn. “Hồng ngọc” theo cách dịch truyền thống, còn khả năng là mã não đỏ được ghi ở chú thích.
- source_word: פִּטְדָה
  choice: hoàng ngọc
  rationale: Tên khoáng vật cổ không chắc chắn; “hoàng ngọc” là cách gọi tiếng Việt quen thuộc của topaz, đồng thời chú thích bảo lưu khả năng khác.
- source_word: בָרֶקֶת
  choice: lục ngọc
  rationale: Từ này có thể chỉ một loại đá sáng lấp lánh và chưa thể nhận diện chính xác. “Lục ngọc” là cách dịch truyền thống dễ hiểu; sự bất định được nêu trong chú thích.
