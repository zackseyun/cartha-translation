    rationale: בָרֶקֶת có nhận diện không chắc chắn, nhưng nếu theo lối dịch truyền thống tương ứng “emerald” thì “ngọc lục bảo” là thuật ngữ tự nhiên và được nhận biết rộng rãi hơn. Chú thích vẫn phải bảo lưu sự bất định.
  - severity: low
    issue: Cụm “đá quý” thêm sắc thái không được nói rõ trực tiếp trong tiếng Hê-bơ-rơ.
    rationale: אָבֶן là “đá”; dù ngữ cảnh nói về đá gắn trên bảng đeo ngực và các tên đá thường được hiểu là đá quý, bản dịch sát hơn nên nói “đá”.
