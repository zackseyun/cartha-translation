  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת עַצְמ֥וֹת יוֹסֵ֖ף עִמּ֑/וֹ כִּי֩ הַשְׁבֵּ֨עַ הִשְׁבִּ֜יעַ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִיתֶ֧ם אֶת עַצְמֹתַ֛/י מִ/זֶּ֖ה אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: vi
  text: 'Môi-se đem hài cốt của Giô-sép theo mình, vì Giô-sép đã long trọng buộc con cháu Y-sơ-ra-ên thề rằng: “Đức Chúa Trời chắc chắn sẽ đoái đến anh em[a], và anh em phải đem hài cốt tôi từ đây lên cùng với anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời chắc chắn sẽ viếng thăm anh em.” Thành ngữ Hê-bơ-rơ có thể chỉ việc Đức Chúa Trời can thiệp một cách quyết định để giúp dân Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: đem
  rationale: Động từ לקח trong mạch kể chuyện có nghĩa cơ bản là “lấy/đem.” Trong ngữ cảnh Môi-se mang hài cốt đi cùng mình, “đem” tự nhiên hơn “lấy” mà vẫn giữ đúng hành động.
- source_word: עַצְמוֹת / עַצְמֹתַי
  choice: hài cốt / hài cốt tôi
  rationale: Nghĩa đen là “xương.” “Hài cốt” là cách nói tự nhiên, trang trọng trong tiếng Việt về xương cốt của người đã mất, không làm mất tính cụ thể của nguyên ngữ.
- source_word: עִמּוֹ
  choice: theo mình
  rationale: Diễn đạt quan hệ đồng hành một cách tự nhiên trong tiếng Việt; chủ thể của đại từ là Môi-se.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: đã bắt ... thề cách long trọng
  rationale: Cấu trúc Hiphil với nguyên thể tuyệt đối vừa có ý sai khiến, vừa nhấn mạnh hành động thề; bản dịch giữ cả hai sắc thái.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc của cụm Hê-bơ-rơ, đồng thời diễn đạt tự nhiên rằng đây là các hậu duệ của Y-sơ-ra-ên, không chỉ các con trai trực tiếp.
- source_word: פָּקֹד יִפְקֹד
  choice: chắc chắn sẽ đoái đến
  rationale: Nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn. “Đoái đến” giữ được phạm vi nghĩa về việc Đức Chúa Trời lưu tâm và hành động, không quy định quá cụ thể cách Ngài can thiệp.
- source_word: וְהַעֲלִיתֶם
  choice: khi ấy, anh em phải đem ... lên
  rationale: Dạng động từ trong lời thề mang sức nặng nghĩa vụ; “phải” thể hiện điều đó. “Lên” bảo toàn hướng chuyển động hàm chứa trong עלה khi rời Ai Cập.
- source_word: מִזֶּה אִתְּכֶם
  choice: từ đây lên cùng với anh em
  rationale: Giữ cả điểm xuất phát “từ đây” và ý đồng hành “cùng với anh em” của nguyên văn.
theological_decisions:
- issue: Cách hiểu cụm פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם
  choice: Đức Chúa Trời chắc chắn sẽ đoái đến anh em
  alternative: Đức Chúa Trời chắc chắn sẽ viếng thăm anh em
  rationale: “Đoái đến” truyền đạt sự lưu tâm dẫn đến hành động cứu giúp trong ngữ cảnh, nhưng vẫn giữ độ rộng nghĩa của thành ngữ; chú thích bảo tồn cách dịch sát hơn là “viếng thăm”.
- issue: Cách gọi בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: “Con cháu” bảo tồn sắc thái dòng dõi của nguyên ngữ và phù hợp với đối tượng tập thể qua các thế hệ, trong khi tránh khiến độc giả hiểu rằng chỉ nói đến các con trai trực tiếp của tổ phụ Y-sơ-ra-ên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các tên riêng quen thuộc trong truyền thống tiếng Việt; tránh lối diễn đạt quá cổ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
