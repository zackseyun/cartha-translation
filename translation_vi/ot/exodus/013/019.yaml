revisions:
- from: 'Môi-se đem hài cốt của Giô-sép theo mình, vì Giô-sép đã bắt con cháu Y-sơ-ra-ên thề cách long trọng rằng: “Đức Chúa Trời chắc chắn sẽ đoái đến anh em[a]; khi ấy, anh em phải đem hài cốt tôi từ đây lên cùng với anh em.”'
  to: 'Môi-se đem hài cốt của Giô-sép theo mình, vì Giô-sép đã long trọng buộc con cháu Y-sơ-ra-ên thề rằng: “Đức Chúa Trời chắc chắn sẽ đoái đến anh em[a], và anh em phải đem hài cốt tôi từ đây lên cùng với anh em.”'
