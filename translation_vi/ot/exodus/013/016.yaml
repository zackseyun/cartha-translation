base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: vi
  text: Điều ấy sẽ là một dấu hiệu trên tay anh em và là vật đeo trước trán, giữa hai mắt anh em[a][b], vì bằng bàn tay mạnh mẽ, Yahweh đã đưa chúng ta ra khỏi Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những dải đeo”; theo truyền thống là “hộp kinh”. Từ Hê-bơ-rơ này hiếm gặp và có lẽ chỉ một vật được đeo trước trán để nhắc nhớ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “giữa hai mắt”, một thành ngữ thường được hiểu là “trên trán”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Điều ấy sẽ là
  rationale: Dạng động từ trong ngữ cảnh chỉ thị mang ý nghĩa tương lai/kết quả. Thêm “điều ấy” để câu tiếng Việt có chủ ngữ tự nhiên, quy chiếu về nghi lễ tưởng niệm trong văn cảnh.
- source_word: לְאוֹת
  choice: một dấu hiệu
  rationale: אוֹת chỉ một dấu hiệu hoặc vật làm dấu; “dấu hiệu” vừa tự nhiên vừa giữ phạm vi nghĩa rộng.
- source_word: עַל יָדְכָה
  choice: trên tay anh em
  rationale: Giữ hình ảnh cụ thể “trên tay”, không đổi thành “trên cánh tay”. Đại từ số nhiều “anh em” diễn đạt tự nhiên lời nói với cộng đồng, dù tiếng Hê-bơ-rơ dùng số ít đại diện.
- source_word: וּלְטוֹטָפֹת
  choice: như những vật đeo
  rationale: טוֹטָפֹת là từ hiếm, có lẽ chỉ vật được đeo trước trán để nhắc nhớ. Cách dịch khái quát này tránh đồng nhất chắc chắn với một hình thức nghi lễ về sau.
- source_word: בֵּין עֵינֶיךָ
  choice: giữa hai mắt anh em
  rationale: Dịch sát hình ảnh Hê-bơ-rơ; cách hiểu thành ngữ “trên trán” được nêu trong chú thích thay vì đưa thẳng vào chính văn.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do cho dấu hiệu nói trên; “vì” gọn và tự nhiên trong tiếng Việt.
- source_word: בְּחֹזֶק יָד
  choice: bằng bàn tay mạnh mẽ
  rationale: Giữ cả hình ảnh “tay” và ý nghĩa sức mạnh của hành động thần linh, không đổi thành “cánh tay quyền năng” vốn diễn giải cao hơn.
- source_word: הוֹצִיאָנוּ
  choice: đã đưa chúng ta ra
  rationale: Thể Hiphil của יצא có nghĩa khiến đi ra, thường được dịch là “đưa ra”; “chúng ta” giữ ngôi thứ nhất số nhiều của nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: מִמִּצְרַיִם
  choice: khỏi Ai Cập
  rationale: Kết hợp tự nhiên với “đưa ... ra khỏi” và giữ đúng điểm xuất phát trong nguyên văn.
theological_decisions:
- issue: Ngôn ngữ về tay và giữa hai mắt là hình ảnh theo nghĩa đen, biểu tượng, hay chỉ nghi vật về sau
  choice: Giữ hình ảnh cụ thể “trên tay” và “giữa hai mắt” trong chính văn, đồng thời dùng cách gọi khái quát cho vật được đeo.
  alternative: Dịch thẳng là “hộp kinh” theo tập tục Do Thái về sau, hoặc diễn ý hoàn toàn thành “lời nhắc nhở”.
  rationale: Nguyên văn không xác định rõ hình thức nghi vật về sau và vẫn để ngỏ quan hệ giữa hành động hữu hình với ý nghĩa biểu tượng; bản dịch không nên tự ý giải quyết sự mở ngỏ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Anh em” diễn đạt đại từ số ít đại diện hướng đến cộng đồng; “Yahweh” giữ danh riêng. Hai dấu chú thích đều được đặt trong chính văn.
