  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: vi
  text: Vì thế, Đức Chúa Trời dẫn dân chúng đi vòng theo đường qua hoang mạc, hướng về Biển Sậy[a]; còn con cháu Y-sơ-ra-ên rời khỏi đất Ai Cập trong đội hình[b].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: dẫn ... đi vòng
  rationale: Dạng Hiphil của סבב diễn tả việc Đức Chúa Trời khiến dân đi theo một lộ trình vòng, thay vì đường trực tiếp; cách dịch này vừa tự nhiên vừa giữ rõ tác nhân thần linh.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít cho thấy danh từ chỉ Đức Chúa Trời duy nhất; đây là cách gọi trang trọng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ cộng đồng Y-sơ-ra-ên đang di chuyển; cách dịch này tự nhiên và mang nghĩa tập thể.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: theo đường qua hoang mạc
  rationale: דֶּרֶךְ nhấn mạnh tuyến đường; cách dịch giữ ý lộ trình đồng thời tự nhiên hơn lối diễn đạt sát chữ cứng nhắc.
- source_word: יַם סוּף
  choice: Biển Sậy
  rationale: Dịch trực tiếp nghĩa thông thường của סוּף là 'sậy'; tên gọi truyền thống 'Biển Đỏ' được giữ trong chú thích.
- source_word: וַחֲמֻשִׁים
  choice: trong đội hình
  rationale: Từ này không chắc nghĩa, có thể chỉ việc mang vũ khí, sẵn sàng chiến đấu, hoặc di chuyển có tổ chức. 'Trong đội hình' giữ được ý trật tự mà không khẳng định quá mức rằng mọi người đều có vũ khí.
- source_word: עָלוּ
  choice: rời khỏi
  rationale: Nghĩa đen là 'đi lên', nhưng trong ngữ cảnh xuất hành khỏi Ai Cập, 'rời khỏi' truyền đạt tự nhiên hướng chuyển động trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  rationale: Giữ hình thức thân tộc của nguyên ngữ mà vẫn tự nhiên trong tiếng Việt, đồng thời chỉ toàn thể dân giao ước chứ không riêng nam giới.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: khỏi đất Ai Cập
  rationale: Phản ánh trực tiếp giới từ מִן và danh từ אֶרֶץ bằng cách diễn đạt tiếng Việt gọn, tự nhiên.
theological_decisions:
- issue: Cách dịch יַם סוּף
  choice: Biển Sậy
  alternative: Biển Đỏ
  rationale: Ưu tiên nghĩa từ vựng của nguyên ngữ thay vì tên gọi do truyền thống dịch thuật; cách gọi quen thuộc 'Biển Đỏ' được nêu trong chú thích để người đọc nhận diện.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  alternative: người Y-sơ-ra-ên
  rationale: Cách dịch đã chọn giữ hình ảnh quan hệ dòng dõi trong tiếng Hê-bơ-rơ nhưng không hàm ý rằng chỉ nam giới tham gia cuộc xuất hành.
- issue: Ý nghĩa của וַחֲמֻשִׁים
  choice: trong đội hình
  alternative: có vũ trang; sẵn sàng chiến đấu
  rationale: Do từ Hê-bơ-rơ còn gây tranh luận, bản văn chính tránh chốt một cách không cần thiết vào ý trang bị quân sự và chú thích bảo tồn các khả năng chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hoang mạc” cho מִדְבָּר, “con cháu Y-sơ-ra-ên” để giữ sắc thái dòng dõi, và đặt các dấu chú thích ngay sau cụm từ liên quan.
