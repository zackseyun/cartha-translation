base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: vi
  text: “Hãy thánh hiến cho Ta mọi con đầu lòng, tức mọi con mở lòng mẹ, trong dân Y-sơ-ra-ên, cả người lẫn gia súc; đều thuộc về Ta.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: Hãy biệt riêng
  rationale: Mệnh lệnh của קדשׁ đòi hỏi dành riêng một đối tượng cho Đức Chúa Trời như vật thánh. “Biệt riêng” tự nhiên trong tiếng Việt hiện đại và giữ được ý nghĩa thánh hiến.
- source_word: לִי
  choice: cho ta
  rationale: Giới từ ל diễn tả sự dâng hiến hoặc dành riêng cho Đức Chúa Trời; “cho ta” kết hợp tự nhiên với “biệt riêng”.
- source_word: כָל בְּכוֹר
  choice: mọi con đầu lòng
  rationale: בכור nghĩa là con đầu lòng. Câu Hê-bơ-rơ không nói rõ “đực” hoặc “con trai”, nên bản dịch không thêm ý ấy.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: tức con đầu tiên mở dạ mẹ
  rationale: Cụm này giải thích rõ hơn “con đầu lòng” là con đầu tiên ra khỏi dạ mẹ. “Mở dạ mẹ” giữ hình ảnh của nguyên ngữ nhưng vẫn dễ hiểu.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: trong vòng con dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “giữa các con trai của Y-sơ-ra-ên”, nhưng ở đây chỉ cộng đồng giao ước. “Con dân Y-sơ-ra-ên” vừa tự nhiên vừa giữ sắc thái thuộc về dân tộc ấy.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: dù là người hay gia súc
  rationale: אָדָם chỉ loài người đối lập với בְּהֵמָה, trong văn cảnh luật pháp này là gia súc. Cách diễn đạt “dù là… hay…” chuyển tải tự nhiên phạm vi bao gồm cả hai loại mà không làm thay đổi nội dung.
- source_word: לִי הוּא
  choice: nó thuộc về ta
  rationale: Mệnh đề kết khẳng định quyền sở hữu của Đức Chúa Trời. “Nó thuộc về ta” rõ ràng và tự nhiên hơn lối dịch sát chữ “nó là của ta” trong câu này.
theological_decisions:
- issue: Phạm vi của אָדָם khi đối lập với בְּהֵמָה
  choice: người
  alternative: loài người
  rationale: Danh từ tập hợp số ít אָדָם ở đây đại diện cho con người nói chung, không riêng nam giới. “Người” giữ sự đối lập người–gia súc mà không nhập thêm giới tính.
- issue: Có nên thêm giới tính vào בְּכוֹר hay không
  choice: không thêm “đực” hoặc “con trai”
  alternative: mọi con đầu lòng giống đực
  rationale: Dù các quy định tiếp theo làm rõ việc áp dụng trong bối cảnh luật pháp, chính câu này không có từ chỉ giống đực; vì vậy bản dịch giữ nguyên độ rộng của cách diễn đạt Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “ta” phản ánh lời phán trực tiếp của Đức Chúa Trời. “Y-sơ-ra-ên” dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Không dùng chú thích vì các điểm cần phân biệt đã có thể chuyển tải rõ trong chính văn.
