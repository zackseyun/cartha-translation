review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh thánh hiến, phạm vi là mọi con đầu lòng trong dân Y-sơ-ra-ên thuộc cả loài người và gia súc, cùng lời khẳng định chúng thuộc về Đức Chúa Trời. Tuy nhiên, “tức con đầu tiên mở dạ mẹ” chuyển từ số nhiều sang số ít và diễn đạt chưa rõ tính khái quát của פֶּטֶר כָּל־רֶחֶם (“mọi con mở lòng mẹ/mở mọi dạ”).
  naturalness: Văn phong nhìn chung hiện đại, trang trọng và dễ hiểu. “Dạ mẹ” ít tự nhiên hơn “lòng mẹ” trong cách nói này; “mọi con mở lòng mẹ” vừa quen thuộc vừa rõ nghĩa hơn. “Đều thuộc về Ta” tránh việc dùng “nó” số ít sau “mọi con đầu lòng”.
  terminology: Nên dùng “thánh hiến” để thể hiện trực tiếp lực thánh/cúng hiến của קַדֶּשׁ. “Con đầu lòng,” “dân Y-sơ-ra-ên,” “người,” “gia súc,” và đại từ thần linh “Ta” đều phù hợp. Không thêm giới tính vào “con đầu lòng”.
  issues:
  - severity: medium
    issue: “tức con đầu tiên mở dạ mẹ” không giữ rõ số nhiều và tính khái quát của cụm פֶּטֶר כָּל־רֶחֶם.
    rationale: Cụm Hê-bơ-rơ định nghĩa “mọi con đầu lòng” là mọi con mở lòng mẹ. Bản hiện tại dùng số ít “con” sau “mọi con đầu lòng” và “dạ mẹ” không diễn đạt rõ bằng “lòng mẹ” trong tiếng Việt tự nhiên.
  - severity: low
    issue: “Biệt riêng” có thể làm mờ sắc thái thánh hiến của קַדֶּשׁ.
    rationale: Động từ này không chỉ là tách riêng mà là dành riêng như điều thánh cho Đức Chúa Trời. “Thánh hiến” diễn đạt trực tiếp hơn mà vẫn tự nhiên trong văn phong Kinh Thánh hiện đại.
  - severity: low
    issue: “nó thuộc về ta” có sự không nhất quán số với “mọi con đầu lòng”.
    rationale: Mệnh đề Hê-bơ-rơ dùng số ít tập hợp, nhưng tiếng Việt tự nhiên hơn khi nói “đều thuộc về Ta” để quy chiếu toàn bộ các đối tượng vừa nêu.
  revised_text: “Hãy thánh hiến cho Ta mọi con đầu lòng, tức mọi con mở lòng mẹ, trong dân Y-sơ-ra-ên, cả người lẫn gia súc; đều thuộc về Ta.”
