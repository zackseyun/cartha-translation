revisions:
- from: Điều ấy sẽ là một dấu hiệu trên tay ngươi và một vật nhắc nhớ giữa hai mắt ngươi[a], để luật pháp của Đức Giê-hô-va[b] ở trong miệng ngươi[c]; vì Đức Giê-hô-va đã dùng bàn tay mạnh mẽ đưa ngươi ra khỏi Ai Cập.
  to: Việc này sẽ là một dấu hiệu trên tay ngươi và là một lời nhắc nhớ giữa hai mắt ngươi[a], để luật pháp của Đức Giê-hô-va[b] ở trong miệng ngươi[c]; vì Đức Giê-hô-va đã dùng bàn tay mạnh mẽ đưa ngươi ra khỏi Ai Cập.
