  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: vi
  text: Việc này sẽ là một dấu hiệu trên tay ngươi và là một lời nhắc nhớ giữa hai mắt ngươi[a], để luật pháp của Đức Giê-hô-va[b] ở trong miệng ngươi[c]; vì Đức Giê-hô-va đã dùng bàn tay mạnh mẽ đưa ngươi ra khỏi Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “giữa hai mắt” cũng có thể được hiểu theo thành ngữ là “trên trán”; chính văn giữ cách nói sát nguyên ngữ.
    reason: lexical_alternative
  - marker: b
    text: Danh Hê-bơ-rơ ở đây là YHWH, danh riêng của Đức Chúa Trời; bản dịch dùng dạng quen thuộc trong tiếng Việt là “Đức Giê-hô-va”.
    reason: translation_clarity
  - marker: c
    text: “Luật pháp” cũng có thể dịch là “sự chỉ dạy”; từ Hê-bơ-rơ torah có thể mang cả hai nghĩa tùy văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Điều ấy sẽ là
  rationale: Dạng động từ trong ngữ cảnh chỉ thị mang ý nghĩa hướng tới tương lai; thêm “Điều ấy” để câu tiếng Việt tự nhiên và quy chiếu đến việc giữ lễ trong văn cảnh.
- source_word: לְאוֹת
  choice: một dấu hiệu
  rationale: Giữ nghĩa rộng của אוֹת là dấu hiệu hay dấu làm chứng, không buộc câu văn phải chỉ một vật thể cụ thể.
- source_word: עַל יָדְךָ
  choice: trên tay ngươi
  rationale: Dịch sát hình ảnh tiếng Hê-bơ-rơ, không diễn giải thành cánh tay hay gắn trực tiếp với tục đeo hộp kinh.
- source_word: וּלְזִכָּרוֹן
  choice: một vật nhắc nhớ
  rationale: Diễn đạt tự nhiên chức năng tưởng niệm của זִכָּרוֹן, đồng thời giữ cấu trúc danh từ và hình ảnh cụ thể của câu.
- source_word: בֵּין עֵינֶיךָ
  choice: giữa hai mắt ngươi
  rationale: Giữ nguyên cách nói của nguyên văn; nghĩa “trên trán” là một cách hiểu theo thành ngữ và được ghi ở chú thích.
- source_word: תּוֹרַת יְהוָה
  choice: luật pháp của Đức Giê-hô-va
  rationale: “Luật pháp” phù hợp bối cảnh giao ước, trong khi “sự chỉ dạy” vẫn là khả năng từ vựng chính đáng và được nêu ở chú thích.
- source_word: בְּפִיךָ
  choice: ở trong miệng ngươi
  rationale: Giữ hình ảnh nguyên văn về lời luật pháp được nói ra hay thường xuyên được nhắc lại.
- source_word: בְּיָד חֲזָקָה
  choice: dùng bàn tay mạnh mẽ
  rationale: Chuyển sát thành ngữ Xuất Ai Cập nói về quyền năng giải cứu của Đức Chúa Trời, với lối diễn đạt tiếng Việt rõ ràng.
- source_word: הוֹצִאֲךָ
  choice: đưa ngươi ra
  rationale: Phản ánh thể Hiphil của יצא, nghĩa là khiến hoặc đưa một người đi ra.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt cho danh YHWH, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Hình ảnh tay và giữa hai mắt là nghĩa đen, nghĩa bóng hay ám chỉ hộp kinh
  choice: Giữ hình ảnh cụ thể “trên tay” và “giữa hai mắt” trong chính văn.
  alternative: Diễn giải thành “buộc trên cánh tay” và “đeo trên trán”, hoặc hoàn toàn chuyển thành sự ghi nhớ trong lòng.
  rationale: Nguyên văn không gọi tên hộp kinh và cũng không tuyên bố hình ảnh chỉ mang nghĩa bóng; bản dịch vì thế giữ mở cả chiều kích biểu tượng lẫn khả năng thực hành hữu hình.
- issue: Phạm vi nghĩa của תּוֹרָה
  choice: Dịch là “luật pháp” trong chính văn.
  alternative: “sự chỉ dạy” hoặc giữ nguyên “Torah”.
  rationale: “Luật pháp” phù hợp sắc thái giao ước của đoạn văn, nhưng chú thích bảo tồn nghĩa rộng hơn là “sự chỉ dạy”.
- issue: Cách thể hiện danh יהוה
  choice: Dùng tên riêng “Đức Giê-hô-va”.
  alternative: Dùng “Đức Chúa Hằng Hữu”, “CHÚA”, hoặc “Yahweh”.
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời; bản dịch giữ tính chất tên riêng thay vì âm thầm thay bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số ít “ngươi” phản ánh lời nói trực tiếp với từng người trong cộng đồng và giữ sắc thái Kinh Thánh mà không quá cổ; cấu trúc câu được làm tự nhiên trong tiếng Việt nhưng vẫn bảo tồn các hình ảnh chính của nguyên ngữ.
