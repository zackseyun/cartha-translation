  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: vi
  text: Hôm nay, anh em ra đi vào tháng A-bíp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-bíp là tên một tháng; thuật ngữ này liên hệ đến giai đoạn ngũ cốc chín vào mùa xuân.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: Hôm nay
  rationale: Danh từ có mạo từ được dùng theo nghĩa trạng từ, chỉ chính ngày dân Y-sơ-ra-ên ra khỏi Ai Cập. “Hôm nay” tự nhiên trong tiếng Việt hiện đại và giữ được tính trực tiếp của lời nói.
- source_word: אַתֶּם
  choice: anh em
  rationale: Đại từ ngôi thứ hai số nhiều, giống đực, chỉ cộng đồng Y-sơ-ra-ên. “Anh em” diễn đạt rõ số nhiều, tự nhiên và trang trọng vừa phải trong lời kêu gọi cộng đồng.
- source_word: יֹצְאִים
  choice: ra đi
  rationale: Phân từ Qal số nhiều của יצא diễn tả hành động đang diễn ra hoặc cận kề trong ngữ cảnh. “Ra đi” giữ hướng chuyển động ra khỏi Ai Cập mà không làm câu tiếng Việt nặng nề.
- source_word: בְּחֹדֶשׁ
  choice: vào tháng
  rationale: Giới từ בְּ đi với “tháng” tạo thành một chỉ dẫn thời gian; “vào tháng” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: הָאָבִיב
  choice: A-víp
  rationale: Giữ tên gọi Hê-bơ-rơ của tháng bằng dạng phiên âm quen thuộc trong tiếng Việt, thay vì thay nó bằng một cách giải nghĩa như “mùa xuân” hay “bông lúa non”.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng “anh em” để biểu thị đối tượng số nhiều là cộng đồng Y-sơ-ra-ên; tránh “các ngươi” vì sắc thái cổ và dễ tạo cảm giác xa cách. Dấu chú thích được đặt ngay sau “A-víp” vì nội dung chú thích giải thích tên tháng.
