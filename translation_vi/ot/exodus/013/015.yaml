revisions:
- from: Khi Pha-ra-ôn ngoan cố không chịu cho chúng ta đi, Đức Giê-hô-va đã giết mọi con đầu lòng trong đất Ai Cập, từ con đầu lòng của loài người cho đến con đầu lòng của súc vật. Vì thế, tôi dâng làm sinh tế cho Đức Giê-hô-va mọi con đực đầu tiên ra khỏi lòng mẹ, còn mọi con trai đầu lòng của tôi thì tôi chuộc lại.
  to: Khi Pha-ra-ôn ngoan cố không chịu cho chúng ta đi, Yahweh đã giết mọi con đầu lòng trong đất Ai Cập, từ con đầu lòng của người cho đến con đầu lòng của súc vật. Vì thế, tôi dâng làm sinh tế cho Yahweh mọi con đực đầu lòng, còn mọi con trai đầu lòng của tôi thì tôi chuộc lại.
  rationale: 'Sửa danh riêng để nhất quán với lựa chọn “Yahweh” của dự án. Điều chỉnh hai cụm danh từ để tiếng Việt tự nhiên hơn, đồng thời duy trì các đối chiếu của tiếng Hê-bơ-rơ: người/súc vật và con đực đầu lòng/con trai đầu lòng. Không cần chú thích: bản văn Việt đã diễn đạt rõ các ý và không có biến thể văn bản cần nêu.'
  reviewer_model: gpt-5.6-terra
