source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: vi
  text: Khi Pha-ra-ôn ngoan cố không chịu cho chúng ta đi, Yahweh đã giết mọi con đầu lòng trong đất Ai Cập, từ con đầu lòng của người cho đến con đầu lòng của súc vật. Vì thế, tôi dâng làm sinh tế cho Yahweh mọi con đực đầu lòng, còn mọi con trai đầu lòng của tôi thì tôi chuộc lại.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה ... לְשַׁלְּחֵנוּ
  choice: ngoan cố không chịu cho chúng ta đi
  rationale: 'Diễn đạt tự nhiên sức nghĩa của thể Hiphil קשׁה trong kết cấu với שלח: Pha-ra-ôn cố chấp chống lại việc phóng thích dân.'
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh giao ước đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: בְּכוֹר
  choice: con đầu lòng
  rationale: Cách nói thông dụng, chính xác trong tiếng Việt về sinh vật đứng đầu thứ tự sinh; được giữ nhất quán trong câu.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: từ con đầu lòng của loài người cho đến con đầu lòng của súc vật
  rationale: אָדָם chỉ loài người nói chung khi đối lập với בְּהֵמָה; 'súc vật' phù hợp với ngữ cảnh gia súc và nghi lễ.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Thể hiện rõ quan hệ hệ quả giữa biến cố tại Ai Cập và lệ dâng hoặc chuộc con đầu lòng.
- source_word: זֹבֵחַ
  choice: dâng làm sinh tế
  rationale: Nêu rõ đây là hành động dâng bằng cách giết sinh tế, tránh để 'dâng' bị hiểu quá rộng.
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: mọi con đực đầu tiên ra khỏi lòng mẹ
  rationale: Chuyển thành một cụm tự nhiên trong tiếng Việt mà vẫn giữ cả ý mở lòng mẹ, thứ tự đầu tiên và giới tính đực.
- source_word: בָּנַי
  choice: con trai ... của tôi
  rationale: Giữ đúng nghĩa giống đực cụ thể của בנים trong điều luật chuộc con đầu lòng.
- source_word: אֶפְדֶּה
  choice: tôi chuộc lại
  rationale: 'Phù hợp với nghĩa pháp lý-nghi lễ của פדה: giải khỏi nghĩa vụ hiến dâng bằng vật thay thế hoặc giá chuộc.'
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh / Đức Chúa Hằng Hữu
  rationale: Giữ danh riêng thay vì thay thế bằng tước hiệu; hình thức có 'Đức' tự nhiên và tôn kính trong văn phong Kinh Thánh tiếng Việt.
- issue: Phạm vi của אָדָם khi đối lập với בְּהֵמָה
  choice: loài người
  alternative: người ta / con người
  rationale: Từ Hê-bơ-rơ ở đây có nghĩa tập thể, bao gồm nhân loại nói chung chứ không chỉ nam giới; 'loài người' làm rõ sự đối lập với súc vật.
- issue: Quan hệ giữa việc dâng con đực đầu lòng và chuộc con trai đầu lòng
  choice: giữ sự tương phản bằng 'còn'
  alternative: và ... tôi chuộc lại
  rationale: Bản văn phân biệt con đực thuộc súc vật được dâng làm sinh tế với con trai đầu lòng được chuộc lại, nhưng không thêm lời giải thích ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Pha-ra-ôn', 'đất Ai Cập', 'sinh tế' và 'chuộc lại' để giữ sắc thái lịch sử-nghi lễ. Không thêm chú thích vì các lựa chọn quan trọng có thể được diễn đạt rõ ngay trong chính văn.
