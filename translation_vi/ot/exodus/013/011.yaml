source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: vi
  text: Và khi[a] Yahweh đưa anh em vào xứ của người Ca-na-an, như Ngài đã thề với anh em và với tổ phụ của anh em[b], và ban xứ ấy cho anh em,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “Và sẽ xảy ra khi”; bản dịch dùng “Và khi” cho tự nhiên trong tiếng Việt.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tổ tiên”; tiếng Hê-bơ-rơ dịch sát là “các cha của anh em”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Và khi
  rationale: Cấu trúc này mở đầu một hoàn cảnh sẽ xảy ra trong tương lai. “Và khi” truyền đạt rõ ý thời gian mà vẫn tự nhiên hơn cách dịch sát từng chữ.
- source_word: יְבִיאֲךָ
  choice: đưa anh em vào
  rationale: Thể Hiphil của בוא mang nghĩa “khiến đi vào, đưa vào”; giới từ אֶל cùng địa điểm khiến “đưa ... vào” là cách diễn đạt tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng bốn phụ âm Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: vào xứ của dân Ca-na-an
  rationale: Diễn đạt trực tiếp chuyển động vào vùng đất thuộc dân Ca-na-an, không rút gọn địa danh thành “Ca-na-an”.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: như Ngài đã thề
  rationale: כַּאֲשֶׁר nêu sự tương ứng với lời thề có trước; “đã thề” phù hợp trình tự thời gian trong tiếng Việt.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: với anh em và với tổ phụ của anh em
  rationale: Giữ lại giới từ lặp lại và sắc thái phụ hệ của אָבוֹת; “tổ phụ” trang trọng, dễ hiểu trong ngữ cảnh lịch sử dân Israel.
- source_word: וּנְתָנָהּ לָךְ
  choice: rồi ban xứ ấy cho anh em
  rationale: Đại từ giống cái số ít chỉ trở lại “xứ”; “rồi ban xứ ấy” làm rõ sở chỉ và diễn đạt tự nhiên chuỗi hành động tương lai.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. Dạng “Yahweh” bảo toàn tư cách danh riêng và không thay nó bằng tước hiệu.
- issue: Đối tượng số ít giống đực trong lời nói với Israel
  choice: anh em
  alternative: ngươi
  rationale: Tiếng Hê-bơ-rơ dùng hậu tố ngôi hai số ít để nói với Israel như một cộng đồng thống nhất. “Anh em” tự nhiên và tôn trọng trong tiếng Việt hiện đại, dù hình thức tiếng Việt là số nhiều; “ngươi” sát số hơn nhưng dễ tạo sắc thái cổ hoặc miệt thị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “xứ” để chỉ vùng đất được hứa ban và “tổ phụ” để giữ sắc thái phụ hệ của nguyên văn. Câu kết bằng dấu phẩy vì câu 11 dẫn sang mệnh lệnh tiếp theo ở câu 12.
