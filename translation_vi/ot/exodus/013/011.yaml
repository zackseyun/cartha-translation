revisions:
- from: Và khi[a] Yahweh đưa anh em vào xứ của dân Ca-na-an, như Ngài đã thề với anh em và với tổ phụ[b] của anh em, rồi ban xứ ấy cho anh em,
  to: Và khi[a] Yahweh đưa anh em vào xứ của người Ca-na-an, như Ngài đã thề với anh em và với tổ phụ của anh em[b], và ban xứ ấy cho anh em,
  rationale: Thay “rồi ban” bằng “và ban” để không thêm quan hệ tuần tự ngoài liên từ waw. Điều chỉnh “dân Ca-na-an” thành “người Ca-na-an” cho cách gọi dân tộc tự nhiên, đồng thời chuyển neo chú thích b đến sau toàn cụm mà nó giải thích. Các yếu tố còn lại được giữ nguyên về nghĩa, xưng hô cộng đồng, danh riêng Yahweh và cấu trúc câu dang dở.
