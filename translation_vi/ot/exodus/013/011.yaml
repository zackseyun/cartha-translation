  - severity: low
    issue: Vị trí neo chú thích b chưa bao trọn cụm sở hữu.
    rationale: Chú thích giải thích toàn cụm “tổ phụ của anh em”/“các cha của anh em”; đặt ký hiệu sau toàn cụm giúp người đọc nhận rõ phạm vi chú thích.
