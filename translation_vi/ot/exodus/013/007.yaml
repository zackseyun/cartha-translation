  text: מַצּוֹת֙ יֵֽאָכֵ֔ל אֵ֖ת שִׁבְעַ֣ת הַ/יָּמִ֑ים וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֜ חָמֵ֗ץ וְ/לֹֽא יֵרָאֶ֥ה לְ/ךָ֛ שְׂאֹ֖ר בְּ/כָל גְּבֻלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: vi
  text: Trong suốt bảy ngày phải ăn bánh không men; không được có bất cứ thứ gì có men[a] trong phạm vi của anh[b], và cũng không được có men trong toàn lãnh thổ của anh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vật đã lên men”. Từ Hê-bơ-rơ חָמֵץ chỉ vật hoặc thức ăn có men, còn שְׂאֹר ở vế sau chỉ chính chất gây men.
    reason: lexical_alternative
  - marker: b
    text: Sát nghĩa là “không được thấy với anh”. Đây là cách nói Hê-bơ-rơ hàm ý rằng vật có men không được hiện diện trong phạm vi sở hữu hoặc quản lý của anh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצּוֹת
  choice: bánh không men
  rationale: Chỉ loại bánh được làm không dùng men trong bối cảnh Lễ Vượt Qua; cách gọi này rõ ràng, tự nhiên và giữ được ý nghĩa nghi lễ.
- source_word: יֵאָכֵל
  choice: phải ăn
  rationale: Dạng Niphal chưa hoàn thành có nghĩa bị động, theo nghĩa sát là “phải được ăn”. Tiếng Việt tự nhiên thường dùng kết cấu vô chủ “phải ăn”, vẫn giữ nguyên lực quy định mà không biến câu thành mệnh lệnh trực tiếp mạnh hơn nguyên văn.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: trong suốt bảy ngày
  rationale: Cách đối cách chỉ thời lượng bao quát trọn cả khoảng thời gian; “trong suốt” diễn đạt rõ việc tuân giữ kéo dài đủ bảy ngày.
- source_word: יֵרָאֶה לְךָ
  choice: không được thấy ... ở nơi anh
  rationale: Giữ hình ảnh “được thấy” của dạng Niphal động từ ראה và dùng “ở nơi anh” để phản ánh לְךָ, hàm ý vật ấy không được hiện diện trong phạm vi sở hữu hoặc quản lý của người được nói đến.
- source_word: חָמֵץ
  choice: bất cứ thứ gì có men
  rationale: חָמֵץ ở đây chỉ rộng hơn một vật hoặc thức ăn đã lên men, khác với שְׂאֹר là chất gây men trong vế sau. Cách dịch này duy trì sự phân biệt từ vựng.
- source_word: שְׂאֹר
  choice: men
  rationale: Chỉ tác nhân gây lên men, có thể là men cái hoặc bột men, chứ không phải sản phẩm đã có men. “Men” là từ phổ thông và không giới hạn sai vào loại men công nghiệp hiện đại.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: trong toàn cõi của anh
  rationale: Chỉ toàn bộ phạm vi nằm trong ranh giới hoặc quyền quản lý của người nghe. “Toàn cõi” giữ sắc thái lãnh thổ rộng hơn nhà riêng.
theological_decisions:
- issue: Lực quy định của thể bị động יֵאָכֵל
  choice: Dịch “phải ăn” như một quy định vô chủ
  alternative: “Bánh không men phải được ăn”
  rationale: Cách chọn tự nhiên hơn trong tiếng Việt nhưng không nâng hình thức này thành một mệnh lệnh trực tiếp, cũng không làm yếu nghĩa vụ của điều luật.
- issue: Phạm vi của לְךָ và גְּבֻלֶךָ
  choice: Giữ cả ý hiện diện “ở nơi anh” và phạm vi “toàn cõi của anh”
  alternative: Diễn giải thành “trong quyền sở hữu của anh”
  rationale: Nguyên văn có thể bao hàm sự sở hữu lẫn phạm vi quản lý; bản dịch không thu hẹp điều cấm vào quyền sở hữu pháp lý hoặc chỉ vào nhà ở.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “anh” để phản ánh đại từ ngôi hai số ít giống đực trong nguyên văn mà tránh sắc thái cổ của “ngươi”. Hai thuật ngữ חָמֵץ và שְׂאֹר được phân biệt lần lượt là “thứ gì có men” và “men”.
