  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: vi
  text: Họ rời Su-cốt, rồi đóng trại tại Ê-tam, bên rìa hoang mạc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: 'Động từ נסע ở dạng wayyiqtol số nhiều diễn tả hành động tiếp theo trong trình thuật: nhổ trại và lên đường. “Rời” tự nhiên trong tiếng Việt và kết hợp rõ với địa điểm xuất phát.'
- source_word: מִסֻּכֹּת
  choice: Su-cốt
  rationale: Danh địa סֻכֹּת đi với giới từ מִן, chỉ nơi xuất phát. Tên riêng được phiên âm theo lối quen dùng trong tiếng Việt.
- source_word: וַיַּחֲנוּ
  choice: rồi đóng trại
  rationale: Động từ חנה có nghĩa là dựng hoặc đóng trại. “Rồi” thể hiện tự nhiên trình tự của hai động từ wayyiqtol trong câu.
- source_word: בְאֵתָם
  choice: tại Ê-tam
  rationale: Giới từ בְ ở đây mang nghĩa địa điểm; “tại” phù hợp với văn cảnh hành trình và nơi dừng trại.
- source_word: בִּקְצֵה
  choice: bên rìa
  rationale: קָצֶה chỉ phần tận cùng, mép hoặc ranh giới. Trong địa hình này, “bên rìa” vừa tự nhiên vừa giữ được ý nghĩa không gian.
- source_word: הַמִּדְבָּר
  choice: hoang mạc
  rationale: מִדְבָּר có thể chỉ vùng đất hoang vu, thảo nguyên khô hoặc sa mạc, không nhất thiết là vùng toàn cát. “Hoang mạc” giữ phạm vi nghĩa rộng hơn “sa mạc” và phù hợp văn phong hiện đại.
