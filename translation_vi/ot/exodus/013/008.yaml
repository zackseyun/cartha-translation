base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: vi
  text: 'Vào ngày đó, ngươi hãy kể cho con trai mình rằng: “Chính vì điều này[a] mà Yahweh đã hành động vì ta khi ta ra khỏi Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Yahweh đã làm điều này vì ta khi ta ra khỏi Ai Cập.” Trong tiếng Hê-bơ-rơ, “điều này” có thể chỉ lý do của việc giữ nghi thức, hoặc gắn trực tiếp hơn với điều Yahweh đã làm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: ngươi phải kể
  rationale: Dạng Hiphil của נגד mang nghĩa kể, thuật lại hoặc cho biết. “Phải kể” diễn đạt tự nhiên sắc thái chỉ thị trong ngữ cảnh, còn “ngươi” giữ ngôi thứ hai số ít của tiếng Hê-bơ-rơ.
- source_word: לְבִנְךָ
  choice: cho con trai mình
  rationale: לְ đánh dấu đối tượng tiếp nhận, còn בֵּן ở đây là danh từ số ít giống đực. “Con trai mình” vừa rõ quan hệ với chủ ngữ vừa giữ đặc điểm giới tính và số của nguyên văn.
- source_word: בַּיּוֹם הַהוּא
  choice: trong ngày ấy
  rationale: Giữ nguyên biểu thức thời gian cùng sắc thái chỉ định của הַהוּא; cách nói này trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này giới thiệu nội dung lời nói. Tiếng Việt tự nhiên dùng “rằng” thay vì dịch hình thức là “mà nói”.
- source_word: בַּעֲבוּר זֶה
  choice: chính vì điều này mà
  rationale: בַּעֲבוּר diễn tả lý do hoặc căn cứ, còn זֶה chỉ “điều này”. Cấu trúc “chính vì… mà…” chuyển tải rõ sức nhấn và quan hệ nhân quả, đồng thời không xác định cụ thể “điều này” là vật hay nghi thức nào.
- source_word: עָשָׂה יְהוָה לִי
  choice: Yahweh đã hành động cho ta
  rationale: עָשָׂה có nghĩa rộng là làm hoặc hành động và không có tân ngữ được nêu rõ tại đây. “Đã hành động cho ta” tránh tự ý thêm “điều này”, đồng thời diễn đạt việc Yahweh can thiệp vì người nói.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước יהוה, không thay thế bằng một tước hiệu.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: khi ta ra khỏi Ai Cập
  rationale: Động từ nguyên mẫu cấu tạo với בְּ diễn tả hoàn cảnh thời gian; bản dịch giữ nguyên góc nhìn ngôi thứ nhất số ít và ý rời khỏi Ai Cập.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu hoặc chọn một lối phát âm truyền thống khác.
- issue: Danh từ quan hệ בֵּן giống đực số ít
  choice: con trai
  alternative: con; con cái
  rationale: “Con trai” phản ánh đúng giống và số của nguyên văn trong lời chỉ dạy giao ước, không mở rộng thành một tập thể hoặc trung hòa giới tính.
- issue: Quan hệ cú pháp của בַּעֲבוּר זֶה với עָשָׂה
  choice: “điều này” nêu lý do để Yahweh hành động
  alternative: '“điều này” là tân ngữ ngầm: “Yahweh đã làm điều này cho ta”'
  rationale: Cú pháp tiếng Hê-bơ-rơ cho phép hiểu זֶה gắn với cụm chỉ nguyên nhân hoặc gần hơn với điều Yahweh đã làm. Bản chính giữ cách hiểu nhân quả, còn chú thích bảo tồn cách hiểu kia mà không giải quyết dứt khoát sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có sắc thái luật lệ. “Ngươi” giữ ngôi thứ hai số ít và phù hợp với lời chỉ dạy cổ trang nghiêm; trong lời trích, “ta” giữ ngôi thứ nhất số ít của người cha đại diện kinh nghiệm Xuất Hành. Dấu chú thích [a] được đặt ngay sau câu có cấu trúc mơ hồ.
