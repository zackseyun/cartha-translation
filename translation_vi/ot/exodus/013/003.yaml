revisions:
- from: 'Môi-se nói với dân chúng: “Hãy nhớ ngày này, ngày anh em đã ra khỏi Ai Cập, khỏi chốn nô lệ[a], vì Yahweh đã dùng bàn tay mạnh mẽ[b] đưa anh em ra khỏi đó. Không được ăn bánh có men[c].”'
  to: 'Môi-se nói với dân chúng: “Hãy nhớ ngày này, ngày mà anh em đã ra khỏi Ai Cập, khỏi chốn nô lệ[a], vì Yahweh đã bằng bàn tay mạnh mẽ đưa anh em ra khỏi đó. Không được ăn đồ có men[c].”'
  rationale: Đổi «dùng bàn tay mạnh mẽ» thành «bằng bàn tay mạnh mẽ» để có cách diễn đạt tự nhiên hơn mà vẫn giữ phép ẩn dụ của nguyên văn. Đổi «bánh có men» thành «đồ có men» để không thu hẹp nghĩa của חָמֵץ; chuyển cách đọc hẹp theo ngữ cảnh nghi lễ vào chú thích.
  reviewer_model: gpt-5.6-terra
