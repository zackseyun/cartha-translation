  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: vi
  text: 'Môi-se nói với dân chúng: “Hãy nhớ ngày này, ngày mà anh em đã ra khỏi Ai Cập, khỏi chốn nô lệ[a], vì Yahweh đã bằng bàn tay mạnh mẽ đưa anh em ra khỏi đó. Không được ăn đồ có men[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “khỏi nhà của những nô lệ,” một thành ngữ chỉ Ai Cập là nơi bị nô dịch.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “không được ăn bánh có men.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Hãy nhớ
  rationale: Mệnh lệnh số ít nói với toàn dân như một tập thể; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được ý nghĩa tưởng niệm.
- source_word: הַיּוֹם הַזֶּה
  choice: ngày này
  rationale: Phản ánh trực tiếp danh từ xác định đi với đại từ chỉ định, không thêm mức nhấn mạnh ngoài nguyên văn.
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: anh em đã ra khỏi Ai Cập
  rationale: יצא diễn tả việc đi ra; “ra khỏi” là cách nói tự nhiên và rõ ràng trong tiếng Việt.
- source_word: מִבֵּית עֲבָדִים
  choice: khỏi chốn nô lệ
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “khỏi nhà của những nô lệ” và là thành ngữ chỉ Ai Cập như nơi dân Israel bị nô dịch. “Chốn nô lệ” giữ hình ảnh địa điểm mà vẫn tự nhiên trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Nêu lý do dân chúng phải ghi nhớ ngày ấy.
- source_word: בְּחֹזֶק יָד
  choice: dùng bàn tay mạnh mẽ
  rationale: Giữ danh từ “bàn tay” và ý về sức mạnh trong thành ngữ chỉ hành động đầy quyền năng của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: הוֹצִיא ... אֶתְכֶם מִזֶּה
  choice: đưa anh em ra khỏi đó
  rationale: Thể Hiphil của יצא có nghĩa khiến hoặc đưa ra; “đưa ... ra” tự nhiên và không diễn giải quá mức.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: Không được ăn bánh có men
  rationale: Giữ lực cấm đoán của dạng bị động; “bánh có men” rõ nghĩa trong ngữ cảnh lễ Bánh Không Men, đồng thời chú thích bảo lưu nghĩa rộng hơn của חָמֵץ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của עֲבָדִים trong công thức Xuất Ai Cập
  choice: nô lệ
  alternative: đầy tớ; cảnh nô dịch
  rationale: Ngữ cảnh nói đến tình trạng bị bắt làm nô lệ thật sự tại Ai Cập; “nô lệ” diễn đạt thẳng và không làm nhẹ tình trạng ấy.
- issue: Phạm vi nghĩa của חָמֵץ
  choice: bánh có men
  alternative: bất cứ thứ gì có men
  rationale: Trong ngữ cảnh nghi lễ, từ này thường chỉ bánh hoặc thức ăn đã lên men; tuy nhiên nguyên văn có thể rộng hơn, nên phương án rộng được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với cộng đồng Israel; giữ danh riêng Yahweh và bảo lưu hình ảnh “bàn tay” của nguyên văn.
