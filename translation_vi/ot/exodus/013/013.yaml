base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: vi
  text: Mọi con lừa đầu lòng, con phải chuộc bằng một con chiên hoặc dê[a]; nếu không chuộc nó, con phải bẻ gãy cổ nó. Mọi con trai đầu lòng của con, con phải chuộc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng một từ chỉ chung một con thuộc đàn gia súc nhỏ, có thể là chiên hoặc dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: con lừa đầu lòng
  rationale: פֶּטֶר chỉ con vật mở dạ đầu tiên; trong điều luật này, “con lừa đầu lòng” vừa tự nhiên vừa truyền đạt đúng ý.
- source_word: תִּפְדֶּה
  choice: phải chuộc / phải chuộc lại
  rationale: Động từ פדה diễn tả việc chuộc bằng vật thay thế hoặc giá chuộc. “Phải” diễn đạt tự nhiên tính bắt buộc của điều luật tiếng Hê-bơ-rơ.
- source_word: בְשֶׂה
  choice: bằng một con chiên hoặc dê
  rationale: שֶׂה là một con thuộc đàn gia súc nhỏ, có thể là chiên hoặc dê; cách dịch này giữ nguyên phạm vi nghĩa của từ Hê-bơ-rơ.
- source_word: וַעֲרַפְתּוֹ
  choice: bẻ cổ nó
  rationale: ערף chỉ hành động làm gãy cổ, khác với cách giết tế lễ thông thường; “bẻ cổ” là cách diễn đạt rõ ràng và trực tiếp.
- source_word: בְּכוֹר אָדָם בְּבָנֶיךָ
  choice: mọi con trai đầu lòng của con
  rationale: Trong ngữ cảnh, אָדָם phân biệt người với súc vật, còn בְּבָנֶיךָ nói rõ “các con trai của con”; tiếng Việt tự nhiên có thể gộp hai yếu tố này thành “mọi con trai đầu lòng của con” mà vẫn giữ đúng đối tượng của điều luật.
theological_decisions:
- issue: Phạm vi của שֶׂה trong phương tiện chuộc
  choice: con chiên hoặc dê
  alternative: con chiên / chiên con
  rationale: Không thu hẹp thuật ngữ Hê-bơ-rơ vốn có thể chỉ cả chiên lẫn dê; như vậy tránh gán cho điều luật một giới hạn không có trong nguyên văn.
- issue: Cách thể hiện אָדָם và בְּבָנֶיךָ
  choice: mọi con trai đầu lòng của con
  alternative: mọi con đầu lòng là người trong số các con trai của con
  rationale: Bản dịch giữ rõ đối tượng là con trai đầu lòng của người nghe, đồng thời để sự đối lập người–súc vật được thể hiện tự nhiên qua toàn câu, không biến אָדָם thành “đàn ông trưởng thành”.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu; dùng đại từ số ít “con” theo lời truyền dạy trực tiếp trong ngữ cảnh. Dấu chấm phẩy giữ mối liên hệ giữa việc chuộc con lừa đầu lòng và hậu quả nếu không chuộc.
