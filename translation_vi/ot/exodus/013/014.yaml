base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: vi
  text: 'Sau này, khi con trai ngươi hỏi ngươi: “Đây là gì?” thì ngươi hãy nói với nó: “Bằng sức mạnh của tay Ngài, Đức Giê-hô-va đã đưa chúng ta ra khỏi Ai Cập, khỏi nhà nô lệ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: sau này
  rationale: Trong ngữ cảnh lời dạy dành cho thế hệ kế tiếp, từ này chỉ một thời điểm tương lai, không nhất thiết là ngày mai theo nghĩa đen.
- source_word: בְּחֹזֶק יָד
  choice: bằng cánh tay quyền năng
  rationale: Giữ hình ảnh Hê-bơ-rơ về tay/cánh tay biểu thị sức mạnh, đồng thời diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Thể hiện danh riêng của Đức Chúa Trời trong nguyên văn, thay vì chuyển thành một danh xưng chung.
- source_word: מִבֵּית עֲבָדִים
  choice: khỏi nhà nô lệ
  rationale: Bảo tồn ẩn dụ nguyên văn về Ai Cập như một 'nhà' giam giữ những người làm nô lệ; tránh diễn giải rộng thành 'cảnh nô lệ'.
theological_decisions:
- issue: Chủ thể được giải cứu qua các thế hệ
  choice: đã đưa chúng ta ra khỏi Ai Cập
  alternative: đã đưa tổ tiên chúng ta ra khỏi Ai Cập
  rationale: Nguyên văn dùng hậu tố ngôi thứ nhất số nhiều 'chúng ta', qua đó thế hệ sau tự nhận mình thuộc về cộng đồng được giải cứu; không đổi thành 'tổ tiên' dù cách ấy có thể rõ hơn về niên đại.
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA
  rationale: Dùng một dạng danh riêng quen thuộc với nhiều độc giả Việt để phân biệt יהוה với tước hiệu 'Chúa', mà không thêm diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp đại từ 'ngươi—nó' để giữ sắc thái lời luật truyền trực tiếp trong bối cảnh cổ, nhưng câu cú được làm gọn tự nhiên. Dấu ngoặc kép phân biệt câu hỏi của người con và lời đáp được truyền dạy.
