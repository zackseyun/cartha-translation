  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: vi
  text: Anh em phải biệt riêng cho Yahweh mọi con đầu lòng[a]; mọi con đực đầu lòng của gia súc thuộc về anh em[b] đều thuộc về Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “mọi con mở dạ mẹ”, tức con đầu lòng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mọi con đầu lòng của gia súc thuộc về anh em”; tiếng Hê-bơ-rơ nói đến con đầu tiên sinh ra từ dạ con của vật nuôi, và phần sau xác định các con đực thuộc về Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: phải biệt riêng
  rationale: Dạng Hiphil của עבר có nghĩa đen là “làm cho đi qua/chuyển qua”; trong quy định thờ phượng này, từ ấy chỉ việc chuyển sang phần dành cho Yahweh. “Biệt riêng” truyền đạt rõ ý hiến dành mà vẫn giữ hình ảnh chuyển quyền sở hữu trong văn cảnh.
- source_word: פֶּטֶר רֶחֶם
  choice: mọi con đầu lòng mở dạ mẹ
  rationale: Cụm từ có nghĩa đen là “vật/con mở tử cung”, chỉ con ra đời đầu tiên. Cách dịch này vừa tự nhiên hơn lối dịch sát từng chữ, vừa giữ thành ngữ sinh nở của tiếng Hê-bơ-rơ.
- source_word: לַיהוָה
  choice: cho Yahweh / thuộc về Yahweh
  rationale: Giữ tên giao ước יהוה dưới dạng “Yahweh”. Ở vế đầu, giới từ ל diễn tả sự biệt riêng cho Ngài; ở cuối câu, cụm danh từ tỉnh lược diễn tả sự thuộc về Ngài.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: mọi lứa đầu của gia súc
  rationale: שֶׁגֶר chỉ lứa con hay sản vật sinh ra của loài vật; kết hợp với פֶּטֶר, cụm này nói đến lứa con đầu tiên của gia súc. “Lứa đầu” giữ trọng tâm sinh sản của nguyên ngữ và tránh gộp sớm điều kiện “con đực” vốn xuất hiện sau đó.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: thuộc về anh em
  rationale: Mệnh đề chỉ gia súc thuộc quyền sở hữu của người nghe. Tiếng Hê-bơ-rơ dùng đại từ số ít đại diện cho cộng đồng; “anh em” là cách xưng hô tập thể tự nhiên trong tiếng Việt hiện đại.
- source_word: הַזְּכָרִים
  choice: các con đực
  rationale: Giữ danh từ số nhiều có mạo từ như một nhóm được tách ra từ lứa đầu của gia súc, thay vì biến nó thành tính từ và làm mờ cấu trúc nhấn mạnh của nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng Danh Thánh bốn phụ âm. Phiên âm “Yahweh” bảo tồn tính chất tên riêng và không thay tên ấy bằng một tước hiệu.
- issue: Phạm vi của quy định về con đực
  choice: Để “các con đực” bổ nghĩa cho lứa đầu của gia súc ở vế thứ hai
  alternative: Hiểu điều kiện con đực là áp dụng rõ ràng cho cả người lẫn gia súc ngay trong câu này
  rationale: Theo cú pháp tiếng Hê-bơ-rơ, הַזְּכָרִים xuất hiện sau mệnh đề nói về gia súc. Bản dịch giữ phạm vi trực tiếp ấy, không mở rộng điều kiện một cách ngầm định vượt quá cấu trúc của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chuyển đại từ số ít mang tính đại diện cho toàn cộng đồng; giữ “Yahweh” như tên riêng. Tách thành hai câu tiếng Việt để làm rõ cấu trúc vế sau mà không giải quyết thay cho nguyên văn những điểm có thể còn hàm súc.
