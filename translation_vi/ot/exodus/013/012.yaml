revisions:
- from: Anh em phải biệt riêng cho Yahweh mọi con đầu lòng mở dạ mẹ[a]. Trong mọi lứa đầu của gia súc thuộc về anh em[b], các con đực đều thuộc về Yahweh.
  to: Anh em phải biệt riêng cho Yahweh mọi con đầu lòng[a]; mọi con đực đầu lòng của gia súc thuộc về anh em[b] đều thuộc về Yahweh.
  rationale: Sửa để diễn đạt tự nhiên và minh bạch rằng quy định ở vế hai áp dụng cho các con đực đầu lòng của gia súc, đồng thời giữ ý “mở dạ mẹ” của nguyên ngữ trong chú thích thay vì dùng một kết hợp gượng trong thân bài. Không mở rộng điều kiện “con đực” sang vế đầu.
  reviewer_model: gpt-5.6-terra
