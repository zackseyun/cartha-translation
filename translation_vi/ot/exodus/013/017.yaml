  naturalness: Bản văn nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “E rằng” hợp với văn cảnh lời phán. Bỏ “hơn” làm câu vừa chính xác vừa không kém tự nhiên.
  terminology: “Đức Chúa Trời,” “Pha-ra-ôn,” “Phi-li-tin,” và “Ai Cập” nhất quán với văn phong Kinh Thánh tiếng Việt. Chú thích b nên giữ các khả năng sát với ý thay đổi ý định, thay vì “chùn lòng,” vốn nghiêng về cảm xúc và không phải là nghĩa trực tiếp của động từ.
