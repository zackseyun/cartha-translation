  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: vi
  text: 'Khi Pha-ra-ôn cho dân chúng ra đi, Đức Chúa Trời không dẫn họ theo con đường qua đất của người Phi-li-tin, dù đường ấy gần,[a] vì Đức Chúa Trời phán: “E rằng khi thấy chiến tranh, dân chúng sẽ đổi ý[b] và quay về Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì đường ấy gần.” Liên từ Hê-bơ-rơ có thể mang nghĩa nguyên nhân; bản dịch chính hiểu theo nghĩa nhượng bộ dựa trên mạch văn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hối tiếc” hoặc “đổi ý định.” Động từ Hê-bơ-rơ ở đây nói đến việc thay đổi ý định khi phải đối diện chiến tranh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: Khi Pha-ra-ôn cho dân chúng ra đi
  rationale: Cấu trúc ב + động từ nguyên mẫu diễn tả hoàn cảnh thời gian. Trong ngữ cảnh Xuất Ai Cập, שׁלח mang nghĩa cho phép dân chúng rời đi; cách dịch này tự nhiên và giữ được âm hưởng của lời yêu cầu lặp lại trong trình thuật.
- source_word: נָחָם
  choice: dẫn
  rationale: Động từ נחה có nghĩa là dẫn dắt hoặc hướng dẫn; “dẫn” phù hợp tự nhiên với ngữ cảnh chọn lộ trình.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: theo con đường qua đất của người Phi-li-tin
  rationale: Cách dịch giữ cả ý “con đường” lẫn cấu trúc địa lý chỉ vùng đất gắn với dân Phi-li-tin, đồng thời rõ nghĩa trong tiếng Việt hiện đại.
- source_word: כִּי קָרוֹב הוּא
  choice: dù đường ấy gần hơn
  rationale: 'כִּי có thể mang nghĩa nguyên nhân hoặc nhượng bộ. Mạch văn cho thấy sự tương phản: Đức Chúa Trời không chọn tuyến này mặc dù nó gần hơn. Dấu chú thích bảo lưu cách hiểu nhân quả có thể có.'
- source_word: פֶּן
  choice: E rằng
  rationale: פֶּן mở đầu mệnh đề diễn tả điều đáng lo ngại hoặc cần tránh. “E rằng” trang trọng, dễ hiểu và phù hợp với lời phán trực tiếp.
- source_word: יִנָּחֵם
  choice: đổi ý
  rationale: Dạng Niphal của נחם ở đây chỉ sự thay đổi ý định khi đối diện chiến tranh, không nhất thiết hàm ý ăn năn về đạo đức. Chú thích giữ các sắc thái “hối tiếc” hoặc “chùn lòng”.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: khi thấy chiến tranh
  rationale: ב + động từ nguyên mẫu diễn tả hoàn cảnh “khi thấy”; מִלְחָמָה có nghĩa rộng là chiến tranh hoặc giao chiến.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: và quay về Ai Cập
  rationale: שׁוב là quay lại hoặc trở về; hậu tố chỉ hướng trên מִצְרַיִם được diễn đạt bằng “về Ai Cập”.
- source_word: וַיְהִי
  choice: không dịch thành một từ mở đầu riêng
  rationale: Dạng wayyiqtol của היה nối tiếp và đưa vào diễn biến mới. Trong tiếng Việt, mở đầu trực tiếp bằng mệnh đề “Khi...” chuyển tải tự nhiên chức năng tự sự mà không cần thêm “Bấy giờ”.
theological_decisions:
- issue: Lý do Đức Chúa Trời tránh tuyến đường qua đất người Phi-li-tin
  choice: Giữ nguyên lời giải thích của bản văn rằng Đức Chúa Trời xét đến khả năng dân chúng đổi ý và quay về khi thấy chiến tranh.
  alternative: Xem đây chỉ là suy đoán của người kể chuyện, hoặc diễn giải rằng Đức Chúa Trời phản ứng bằng cách thay đổi kế hoạch.
  rationale: Mệnh đề “vì Đức Chúa Trời phán” trình bày trực tiếp lý do trong câu. Bản dịch không thêm kết luận tín lý về sự biết trước hay sự quan phòng của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho אֱלֹהִים; phiên âm các địa danh và tộc danh theo lối quen thuộc trong Kinh Thánh tiếng Việt. Dấu chú thích được đặt ngay sau cụm từ liên quan.
