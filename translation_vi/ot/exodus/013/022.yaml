  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: vi
  text: Trụ mây ban ngày và trụ lửa ban đêm không rời khỏi trước mặt dân.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không dời khỏi trước mặt dân.” Động từ Hê-bơ-rơ nhấn mạnh rằng các trụ vẫn luôn hiện diện để dẫn đường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: không rời khỏi
  rationale: Động từ מוּשׁ diễn tả việc rời đi hoặc dời khỏi một vị trí; cách dịch này tự nhiên trong tiếng Việt và cho thấy các trụ vẫn liên tục hiện diện.
- source_word: עַמּוּד
  choice: trụ
  rationale: “Trụ” diễn đạt rõ hình ảnh một khối thẳng đứng và phù hợp với cách nói quen thuộc “trụ mây”, “trụ lửa” trong văn cảnh này.
- source_word: הֶעָנָן
  choice: mây
  rationale: Chuyển nghĩa trực tiếp của עָנָן; tính xác định được thể hiện tự nhiên trong cụm “trụ mây” theo văn cảnh.
- source_word: יוֹמָם
  choice: ban ngày
  rationale: Trạng từ chỉ thời gian, tạo thế đối xứng tự nhiên với “ban đêm”.
- source_word: וְעַמּוּד הָאֵשׁ
  choice: và ... trụ lửa
  rationale: Giữ cấu trúc song song với “trụ mây” và bảo toàn hình ảnh cụ thể của lửa.
- source_word: לָיְלָה
  choice: ban đêm
  rationale: Cụm chỉ thời gian, cân xứng và tự nhiên với “ban ngày” trong tiếng Việt.
- source_word: לִפְנֵי
  choice: khỏi phía trước
  rationale: Kết hợp với động từ chỉ sự rời đi để diễn tả việc không dời khỏi vị trí ở phía trước dân chúng.
- source_word: הָעָם
  choice: dân chúng
  rationale: Danh từ tập hợp xác định chỉ toàn thể dân Israel; “dân chúng” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
