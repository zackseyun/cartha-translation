revisions:
- from: Khi Yahweh đưa anh em vào xứ của dân Ca-na-an, dân Hê-tít, dân A-mô-rít, dân Hê-vít và dân Giê-bu-sít—xứ mà Ngài đã thề với tổ phụ anh em rằng sẽ ban cho anh em, một xứ đượm sữa và mật—thì anh em phải thực hiện việc phụng sự này[a] trong tháng này.
  to: Khi Yahweh đưa anh em vào xứ của dân Ca-na-an, dân Hê-tít, dân A-mô-rít, dân Hê-vít và dân Giê-bu-sít—xứ mà Ngài đã thề với tổ phụ anh em là sẽ ban cho anh em, một xứ tràn trề sữa và mật—thì anh em phải cử hành nghi lễ này[a] trong tháng này.
  rationale: Bản sửa thay hai cụm từ chưa tự nhiên bằng lối diễn đạt hiện đại mà vẫn bám sát nghĩa nguồn. “Tràn trề sữa và mật” giữ hình ảnh đất đai sung túc của זָבַת חָלָב וּדְבָשׁ. “Cử hành nghi lễ này” phản ánh yêu cầu thực hành trong ngữ cảnh Lễ Vượt Qua/Bánh Không Men, còn chú thích bảo toàn phạm vi nghĩa của từ עֲבֹדָה.
