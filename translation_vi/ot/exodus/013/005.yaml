    rationale: “Đượm” không phải cách kết hợp tự nhiên trong tiếng Việt hiện đại với “sữa và mật” và làm mờ hình ảnh thành ngữ Hê-bơ-rơ về sự dồi dào/phong phú.
  - severity: medium
    issue: “thực hiện việc phụng sự này”
    rationale: Cụm từ này gượng và có thể bị hiểu là một hoạt động phục vụ chung. Trong văn cảnh nghi lễ của Xuất Ê-díp-tô Ký 13, “cử hành nghi lễ này” truyền đạt rõ hành động được đòi hỏi hơn; chú thích bảo lưu các cách hiểu từ vựng khác.
  revised_text: Khi Yahweh đưa anh em vào xứ của dân Ca-na-an, dân Hê-tít, dân A-mô-rít, dân Hê-vít và dân Giê-bu-sít—xứ mà Ngài đã thề với tổ phụ anh em là sẽ ban cho anh em, một xứ tràn trề sữa và mật—thì anh em phải cử hành nghi lễ này[a] trong tháng này.
