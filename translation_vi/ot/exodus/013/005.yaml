  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: vi
  text: Khi Yahweh đưa anh em vào xứ của dân Ca-na-an, dân Hê-tít, dân A-mô-rít, dân Hê-vít và dân Giê-bu-sít—xứ mà Ngài đã thề với tổ phụ anh em là sẽ ban cho anh em, một xứ tràn trề sữa và mật—thì anh em phải cử hành nghi lễ này[a] trong tháng này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “việc thờ phượng này” hoặc “việc tuân giữ này.” Từ Hê-bơ-rơ có thể chỉ một hành vi phụng thờ hay phục vụ đã được quy định.
    reason: Nêu các khả năng từ vựng thực sự của עֲבֹדָה trong văn cảnh thờ phượng, trong khi câu chính dùng cách diễn đạt tự nhiên theo ngữ cảnh.
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: Khi
  rationale: Cấu trúc này mở đầu một hoàn cảnh chắc chắn sẽ xảy ra trong tương lai; “Khi” tự nhiên trong tiếng Việt và vẫn giữ sắc thái thời gian.
- source_word: יְבִיאֲךָ
  choice: đưa anh em vào
  rationale: Thể Hiphil của בוא mang nghĩa “đưa vào, làm cho đi vào.” “Anh em” diễn đạt đại từ số ít chỉ cộng đồng Israel bằng lối nói hiện đại, dễ hiểu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: vào xứ của dân Ca-na-an, dân Hê-tít, dân A-mô-rít, dân Hê-vít và dân Giê-bu-sít
  rationale: Giữ đầy đủ danh sách năm dân tộc và diễn đạt tự nhiên cấu trúc Hê-bơ-rơ “xứ của...”.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: xứ mà Ngài đã thề với tổ phụ anh em rằng sẽ ban cho anh em
  rationale: Giữ mệnh đề quan hệ gắn với “xứ” và bảo toàn ngôn ngữ giao ước về lời thề và sự ban cho.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: một xứ đượm sữa và mật
  rationale: “Đượm sữa và mật” là cách diễn đạt cô đọng, trang trọng, truyền đạt hình ảnh về sự trù phú mà không giải thích quá mức loại mật được nói đến.
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: anh em phải thực hiện việc phụng sự này
  rationale: Động từ עבד và danh từ cùng gốc עֲבֹדָה ở đây chỉ việc thi hành một bổn phận thờ phượng đã được quy định. Cách dịch giữ sắc thái phụng thờ nhưng vẫn rõ nghĩa trong tiếng Việt.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: trong tháng này
  rationale: Chuyển tải trực tiếp cụm từ chỉ thời gian, nói đến tháng đã được ấn định trong văn cảnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái thờ phượng của עֲבֹדָה
  choice: việc phụng sự này
  alternative: nghi lễ này; việc tuân giữ này
  rationale: Trong văn cảnh Lễ Vượt Qua và Bánh Không Men, từ này chỉ một việc thờ phượng phải thi hành. “Việc phụng sự” giữ được cả ý phục vụ, bổn phận và thờ phượng mà không quy định quá hẹp hình thức nghi lễ.
- issue: Đại từ số ít chỉ cộng đồng Israel
  choice: anh em
  alternative: ngươi
  rationale: Tiếng Hê-bơ-rơ dùng đại từ giống đực số ít để nói với Israel như một cộng đồng. “Anh em” tự nhiên và tôn trọng trong tiếng Việt hiện đại, đồng thời tránh sắc thái cổ hoặc bề trên của “ngươi”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ hai cụm đồng vị mô tả “xứ.” Các tên dân tộc được phiên âm theo cách quen thuộc trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
