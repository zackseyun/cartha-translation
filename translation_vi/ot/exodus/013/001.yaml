  text: 'Rồi Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; cũng được phiên âm là “Yahweh” hoặc “Giê-hô-va” trong một số bản dịch. Cách phát âm nguyên thủy không được biết chắc chắn.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ, ... phán
  rationale: Dạng wayyiqtol tiếp diễn mạch kể chuyện; “Bấy giờ” diễn đạt tự nhiên sắc thái tuần tự, còn “phán” là cách nói trang trọng, quen dùng khi Đức Chúa Trời truyền lời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “Giê-hô-va” là dạng phiên âm đã quen thuộc trong tiếng Việt. Chú thích nêu dạng YHWH và cách phiên âm khác.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu chỉ hành vi nói, tiếng Việt tự nhiên dùng “phán với” để diễn đạt đối tượng tiếp nhận lời.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng Kinh Thánh đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này mở đầu lời trực tiếp; “rằng” giữ chức năng dẫn lời một cách tự nhiên, không lặp vụng “phán... nói”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp bốn phụ âm YHWH. Bản dịch giữ đây là danh riêng, không thay bằng “CHÚA”; đồng thời chú thích bảo tồn sự không chắc chắn về cách phát âm cổ và ghi nhận cách phiên âm Yahweh/Gia-vê.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm báo trước lời phán ở câu kế tiếp; cấu trúc “phán với... rằng” giữ sắc thái công thức của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
