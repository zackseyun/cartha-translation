  source_fidelity: Cần đổi “Đức Giê-hô-va” thành “Yahweh” để nhất quán với quyết định của POB về việc phiên âm trực tiếp יהוה và để tránh thêm tước hiệu “Đức”, vốn không có trong nguyên văn. “Rồi” diễn đạt tự nhiên chức năng tiếp diễn tự sự của wayyiqtol; “phán với Môi-se rằng” chuyển tải đúng công thức nói và từ לֵאמֹר.
