  rationale: Sửa chủ ngữ sang số ít để phản ánh hình thức động từ Hê-bơ-rơ, thay “thời điểm” bằng “kỳ” để diễn đạt tự nhiên hơn ý lịch lễ của מוֹעֵד, và điều chỉnh chú thích để bảo lưu thành ngữ nguyên văn rõ ràng hơn. Nghĩa hằng năm trong bản văn chính vẫn được giữ theo ngữ cảnh lễ Vượt Qua.
