  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: vi
  text: Ngươi phải tuân giữ quy định này vào kỳ đã định, từ năm này sang năm khác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “từ ngày này qua ngày khác,” một thành ngữ trong ngữ cảnh này thường được hiểu là “từ năm này sang năm khác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Anh em phải tuân giữ
  rationale: Trong ngữ cảnh luật lệ và nghi lễ, שׁמר chỉ việc vâng theo và tiếp tục thực hành. “Tuân giữ” vừa tự nhiên vừa giữ được sắc thái ràng buộc. Đại từ số ít trong tiếng Hê-bơ-rơ mang nghĩa tập thể; “anh em” diễn đạt tự nhiên lời truyền cho dân chúng.
- source_word: הַחֻקָּה הַזֹּאת
  choice: quy định này
  rationale: חֻקָּה là một điều được ấn định, có tính ràng buộc. “Quy định” trang trọng, rõ nghĩa trong tiếng Việt hiện đại và không mang sắc thái riêng của một truyền thống giáo hội.
- source_word: לְמוֹעֲדָהּ
  choice: vào thời điểm đã định
  rationale: מוֹעֵד chỉ thời điểm hoặc kỳ đã được ấn định; hậu tố giống cái số ít quy chiếu về việc tuân giữ quy định này. Cách dịch này bảo toàn ý nghĩa lịch định mà vẫn tự nhiên.
- source_word: מִיָּמִים יָמִימָה
  choice: từ năm này sang năm khác
  rationale: Nguyên văn là “từ những ngày đến những ngày,” nhưng trong ngữ cảnh lễ hằng năm, đây là thành ngữ chỉ sự lặp lại qua từng năm. Bản dịch chính truyền đạt nghĩa theo ngữ cảnh, còn chú thích bảo lưu hình thức Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” dùng theo nghĩa tập thể để chuyển lời truyền ở ngôi thứ hai số ít của tiếng Hê-bơ-rơ sang tiếng Việt tự nhiên; câu vẫn giữ sắc thái luật định và nhịp lặp hằng năm.
