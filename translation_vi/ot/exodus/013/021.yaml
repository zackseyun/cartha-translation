- from: Ban ngày, Yahweh[a] đi trước họ trong một trụ mây để dẫn họ trên đường; ban đêm, Ngài ở trong một trụ lửa để soi sáng cho họ, nhờ đó họ có thể đi cả ngày lẫn đêm.
  to: Ban ngày, Yahweh[a] đi trước họ trong một trụ mây để dẫn họ trên đường; ban đêm, Ngài đi trước họ trong một trụ lửa để soi sáng cho họ, để họ có thể đi ban ngày và ban đêm.
  rationale: 'Bản sửa khôi phục động từ «đi trước họ» cho cả hai vế thời gian theo cú pháp nguyên văn, đồng thời giữ nguyên danh riêng, hình ảnh trụ mây/trụ lửa, và quan hệ mục đích: dẫn đường, soi sáng để dân có thể đi. Không cần thêm diễn giải nào về bản chất của sự hiện diện trong các trụ.'
