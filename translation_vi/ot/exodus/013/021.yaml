id: EXO.13.21
reference: Exodus 13:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: vi
  text: Ban ngày, Yahweh[a] đi trước họ trong một trụ mây để dẫn họ trên đường; ban đêm, Ngài đi trước họ trong một trụ lửa để soi sáng cho họ, để họ có thể đi ban ngày và ban đêm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; một số bản dịch dùng “Đức Giê-hô-va” hoặc “CHÚA”.'
    reason: Nêu dạng danh thánh trong nguyên văn và các cách dịch quen thuộc khác.
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Chuyển tự danh giao ước יהוה thay vì thay bằng một tước hiệu; cách này giữ rõ danh riêng trong nguyên văn.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: đi trước họ
  rationale: Phân từ הֹלֵךְ diễn tả hành động đang tiếp diễn, còn לִפְנֵיהֶם chỉ vị trí phía trước và hàm ý dẫn đường.
- source_word: יוֹמָם
  choice: ban ngày
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt và cân xứng với וְלַיְלָה, “ban đêm”.
- source_word: בְּעַמּוּד עָנָן
  choice: trong một trụ mây
  rationale: Giữ hình ảnh cụ thể “trụ mây”; giới từ בְּ được hiểu là sự hiện diện trong hình thể hữu hình ấy.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: để dẫn họ trên đường
  rationale: Động từ נחה mang nghĩa dẫn dắt, hướng dẫn; lối dịch này giữ quan hệ mục đích và bối cảnh hành trình.
- source_word: בְּעַמּוּד אֵשׁ
  choice: trong một trụ lửa
  rationale: Giữ cấu trúc song song với “trong một trụ mây” và hình ảnh cụ thể của nguyên văn.
- source_word: לְהָאִיר לָהֶם
  choice: để soi sáng cho họ
  rationale: Dạng Hiphil của אור có nghĩa làm cho sáng hoặc ban ánh sáng; “soi sáng cho họ” tự nhiên và sát nghĩa.
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: nhờ đó họ có thể đi cả ngày lẫn đêm
  rationale: Diễn đạt quan hệ mục đích hoặc kết quả của động từ nguyên mẫu לָלֶכֶת, đồng thời giữ sự lặp lại nhấn mạnh khả năng di chuyển ban ngày và ban đêm.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Chuyển tự “Yahweh” giúp phân biệt danh giao ước với tước hiệu “Chúa” mà không áp đặt một cách giải thích hệ phái.
- issue: Hình thức hiện diện trong trụ mây và trụ lửa
  choice: Yahweh đi trước họ trong một trụ mây… Ngài ở trong một trụ lửa
  alternative: Yahweh đi trước họ bằng một trụ mây… bằng một trụ lửa
  rationale: Giới từ בְּ có thể chỉ vị trí hoặc phương tiện. Bản dịch chọn nghĩa vị trí “trong” theo hình ảnh biểu hiện hữu hình, nhưng không giải thích sâu hơn bản chất của sự hiện diện ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế “ban ngày… ban đêm…” bảo toàn tính song song của câu Hê-bơ-rơ; đại từ “Ngài” được thêm ở vế sau để câu tiếng Việt rõ và tự nhiên.
