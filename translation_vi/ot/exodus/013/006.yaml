revisions:
- from: Trong bảy ngày, anh em phải ăn bánh không men; và vào ngày thứ bảy sẽ có một kỳ lễ kính Đức Yahweh.[a]
  to: Trong bảy ngày, anh em phải ăn bánh không men; và vào ngày thứ bảy sẽ có một kỳ lễ dành cho Yahweh.[a]
  rationale: Sửa tối thiểu «kính Đức Yahweh» thành «dành cho Yahweh» để phản ánh chính xác và ít diễn giải hơn cụm חַג לַיהוָה, đồng thời dùng nhất quán danh riêng Yahweh. Các thành phần còn lại của bản dịch giữ nguyên vì phù hợp với văn bản Hê-bơ-rơ và tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
