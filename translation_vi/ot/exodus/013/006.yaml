lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Trong bảy ngày
  rationale: Cụm từ chỉ khoảng thời gian; cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ thời lượng bảy ngày.
- source_word: תֹּאכַל
  choice: anh em phải ăn
  rationale: Động từ ở ngôi thứ hai số ít nhưng hướng đến cộng đồng Israel; “anh em” truyền đạt đối tượng tập thể bằng tiếng Việt hiện đại, còn “phải” thể hiện lực chỉ thị của văn mạch luật lệ mà không biến câu thành lời đe dọa.
- source_word: מַצֹּת
  choice: bánh không men
  rationale: Đây là cách gọi rõ ràng, quen thuộc trong tiếng Việt đối với bánh không dùng men trong bối cảnh Lễ Vượt Qua.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: và vào ngày thứ bảy
  rationale: Giữ liên từ đơn giản וְ và xác định thời điểm của mệnh đề tiếp theo.
- source_word: חַג
  choice: một kỳ lễ
  rationale: חַג chỉ một lễ hội tôn giáo, thường mang sắc thái vui mừng và thờ phượng; “kỳ lễ” trang trọng, dễ hiểu và phù hợp bối cảnh.
- source_word: לַיהוָה
  choice: kính Đức Yahweh
  rationale: Giới từ לְ biểu thị sự quy hướng hoặc dâng dành cho Yahweh; “kính” diễn đạt tự nhiên mục đích thờ phượng mà không làm mất sắc thái dâng dành.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Yahweh
  alternative: ĐỨC CHÚA; Đức Giê-hô-va
  rationale: Bản văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” trong chính văn phản ánh danh riêng, còn “Đức” giúp cách gọi trang trọng và tự nhiên hơn trong tiếng Việt.
- issue: Tính chất của mệnh đề חַג לַיהוָה không có động từ
  choice: sẽ có một kỳ lễ kính Đức Yahweh
  alternative: ngày thứ bảy là một kỳ lễ kính Đức Yahweh; phải cử hành một kỳ lễ kính Đức Yahweh
  rationale: Cách dịch này giữ được tính cô đọng của mệnh đề danh từ và không áp đặt rõ một động từ mệnh lệnh vốn không hiện diện trong tiếng Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để chuyển ngôi thứ hai số ít mang nghĩa tập thể, tránh đại từ “ngươi” đã trở nên cổ và dễ tạo sắc thái gay gắt. Dấu chấm chú thích [a] đặt ngay sau danh Yahweh.
