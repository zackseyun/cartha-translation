    issue: «kính Đức Yahweh» không phản ánh trực tiếp nhất לַיהוָה.
    rationale: לְ trong cụm חַג לַיהוָה nêu lễ hội được dành cho/quy hướng về Yahweh. «Kính» có thể hiểu được nhưng thêm sắc thái thái độ tôn kính; «dành cho» sát cấu trúc và trung tính hơn.
  - severity: low
    issue: Cách gọi «Đức Yahweh» hơi không tự nhiên và không nhất quán về phong cách danh riêng.
    rationale: Yahweh là danh riêng được chọn để dịch יהוה; dùng trực tiếp «Yahweh» trong câu tiếng Việt hiện đại gọn và nhất quán hơn. Sắc thái tôn kính đã được thể hiện qua ngữ cảnh thờ phượng.
  revised_text: Trong bảy ngày, anh em phải ăn bánh không men; và vào ngày thứ bảy sẽ có một kỳ lễ dành cho Yahweh.[a]
