  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: vi
  text: Nhưng con cháu Y-sơ-ra-ên sinh sôi, nảy nở[a], gia tăng và trở nên hết sức hùng mạnh, đến nỗi cả xứ đầy dẫy người Y-sơ-ra-ên.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sinh sôi nhung nhúc”; động từ Hê-bơ-rơ gợi hình ảnh sự sinh sôi tràn lan, dồi dào.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch mở đầu là “Và con cháu Y-sơ-ra-ên” và kết câu là “rồi cả xứ đầy dẫy người Y-sơ-ra-ên”; liên từ Hê-bơ-rơ có thể chỉ đơn giản là “và”, trong khi “nhưng” làm rõ sự tương phản với câu trước, còn “đến nỗi” làm rõ quan hệ kết quả.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Nhưng con cháu Y-sơ-ra-ên
  rationale: בני ישראל theo nghĩa đen là “các con trai của Y-sơ-ra-ên”, nhưng trong ngữ cảnh chỉ toàn thể hậu duệ/dân Y-sơ-ra-ên; “con cháu” giữ sắc thái gia tộc và bao gồm cả cộng đồng. “Nhưng” diễn đạt sự tương phản với việc thế hệ Giô-sép đã qua đời ở câu trước.
- source_word: פָּרוּ
  choice: sinh sôi
  rationale: Giữ ý sinh sản, kết quả dồi dào của פרה và âm hưởng ngôn ngữ phước lành trong Sáng Thế Ký.
- source_word: וַיִּשְׁרְצוּ
  choice: đông đúc như bầy đàn
  rationale: שׁרץ gợi hình ảnh sinh vật lúc nhúc, tràn đầy hoặc sinh sôi thành đàn. Cách dịch này giữ hình ảnh mạnh mà tránh sắc thái miệt thị không cần thiết của “lúc nhúc” trong tiếng Việt hiện đại.
- source_word: וַיִּרְבּוּ
  choice: gia tăng
  rationale: Diễn đạt việc trở nên đông đảo của רבה và giữ một vế riêng trong chuỗi động từ dồn dập.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: trở nên vô cùng hùng mạnh
  rationale: עצם chủ yếu chỉ trở nên mạnh; cụm lặp מְאֹד מְאֹד nhấn mạnh ở mức cao. “Hùng mạnh” có thể bao hàm sức mạnh do số đông mà không thu hẹp nghĩa thành chỉ đông người.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: đến nỗi cả xứ đầy dẫy họ
  rationale: Giữ הארץ làm chủ thể về nghĩa của cấu trúc bị động (“xứ đầy họ”), còn “đến nỗi” diễn đạt tự nhiên sắc thái kết quả của chuỗi tăng trưởng. “Xứ” phù hợp hơn “đất/địa cầu” vì nói đến vùng họ cư ngụ.
theological_decisions:
- issue: Âm hưởng về phước lành và sự sáng tạo trong các động từ chỉ sinh sản
  choice: Giữ chuỗi “sinh sôi… gia tăng” để âm hưởng tự xuất hiện, không giải thích thêm trong chính văn.
  alternative: Thêm lời diễn giải nhằm nêu rõ đây là sự ứng nghiệm phước lành trong Sáng Thế Ký.
  rationale: Các từ ngữ Hê-bơ-rơ có khả năng cố ý gợi lại ngôn ngữ Sáng Thế Ký, nhưng câu này không trực tiếp phát biểu kết luận thần học ấy; bản dịch không nên bổ sung điều nguyên văn chỉ gợi lên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; “con cháu” tự nhiên hơn cách dịch sát chữ “các con trai” khi chỉ cả cộng đồng. Giữ nhịp liệt kê dồn dập của nguyên văn và hình ảnh sinh sôi thành đàn, nhưng tránh từ ngữ dễ mang sắc thái khinh miệt trong chính văn.
