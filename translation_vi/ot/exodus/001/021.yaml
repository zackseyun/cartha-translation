id: EXO.1.21
reference: Exodus 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֕י כִּֽי יָֽרְא֥וּ הַֽ/מְיַלְּדֹ֖ת אֶת הָ/אֱלֹהִ֑ים וַ/יַּ֥עַשׂ לָ/הֶ֖ם בָּתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: vi
  text: Vì các bà đỡ kính sợ Đức Chúa Trời, nên Ngài gây dựng gia đình cho họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Ngài làm những ngôi nhà cho họ.” Từ Hê-bơ-rơ có thể nói đến việc thiết lập gia đình hoặc gia hộ, chứ không nhất thiết là xây nhà theo nghĩa vật chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Vì … nên
  rationale: Cấu trúc nhân quả này diễn đạt tự nhiên trong tiếng Việt mối liên hệ giữa việc các bà đỡ kính sợ Đức Chúa Trời và điều Ngài làm cho họ, không giữ lại công thức Hê-bơ-rơ một cách gượng ép.
- source_word: יָרְאוּ
  choice: kính sợ
  rationale: “Kính sợ” giữ được cả sắc thái sợ và lòng tôn kính đối với Đức Chúa Trời, phù hợp với cách dùng của động từ ירא trong ngữ cảnh.
- source_word: הַמְיַלְּדֹת
  choice: các bà đỡ
  rationale: Danh từ hóa có mạo từ chỉ những người nữ làm nghề đỡ đẻ đã được nhắc đến trong ngữ cảnh trước.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, danh từ có mạo từ chỉ Đức Chúa Trời, không phải các thần nói chung.
- source_word: וַיַּעַשׂ
  choice: gây dựng
  rationale: Động từ עשׂה có nghĩa rộng là làm, tạo nên hoặc thiết lập. Đi với “gia đình”, “gây dựng” truyền đạt tự nhiên ý thiết lập hay ban cho một gia hộ.
- source_word: לָהֶם
  choice: cho họ
  rationale: Hậu tố đại từ số nhiều giống đực có thể quy chiếu về nhóm phụ nữ trong tiếng Hê-bơ-rơ; ngữ cảnh xác định đối tượng là các bà đỡ.
- source_word: בָּתִּים
  choice: gia đình
  rationale: Nghĩa đen là “những ngôi nhà”, nhưng “nhà” trong tiếng Hê-bơ-rơ cũng có thể chỉ gia đình, gia tộc hay gia hộ. “Gia đình” truyền đạt nghĩa phù hợp nhất với ngữ cảnh, còn nghĩa đen được giữ trong chú thích.
theological_decisions:
- issue: Ý nghĩa của cụm “Ngài gây dựng gia đình cho họ”
  choice: Đức Chúa Trời ban cho hoặc thiết lập gia đình cho các bà đỡ.
  alternative: Đức Chúa Trời xây nhà theo nghĩa vật chất cho họ.
  rationale: Cụm Hê-bơ-rơ עשׂה ... בתים có thể nói đến việc thiết lập gia đình hay dòng dõi, chứ không nhất thiết là xây dựng công trình. Ngữ cảnh cho thấy đây là phước lành Đức Chúa Trời ban cho các bà đỡ; tuy vậy, nghĩa đen vẫn được nêu trong chú thích để không che khuất tính đa nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kính sợ” giữ sắc thái Kinh Thánh mà không làm nhẹ ý nghĩa; “gây dựng gia đình” tự nhiên trong tiếng Việt và chú thích bảo toàn nghĩa đen của nguyên văn.
