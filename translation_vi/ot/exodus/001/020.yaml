base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/020.yaml
  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: vi
  text: Đức Chúa Trời đã đối đãi tốt với các bà đỡ[a], và dân chúng sinh sôi, trở nên rất hùng mạnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm điều tốt cho các bà đỡ” hoặc “ban phước cho các bà đỡ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: đối đãi tốt
  rationale: Dạng Hiphil của יטב đi với ל diễn tả việc làm điều tốt cho hoặc đối xử tốt với ai. “Đối đãi tốt” tự nhiên trong tiếng Việt, giữ được nghĩa ban ơn mà không diễn giải cụ thể thành “ban phước”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, từ này chỉ Đức Chúa Trời của Israel; cách gọi số ít phù hợp với ngữ cảnh và lối dùng tiếng Việt trang trọng, quen thuộc.
- source_word: לַמְיַלְּדֹת
  choice: với các bà đỡ
  rationale: Giới từ ל đánh dấu đối tượng nhận điều tốt; sau “đối đãi tốt”, “với các bà đỡ” là cách diễn đạt tiếng Việt tự nhiên.
- source_word: וַיִּרֶב
  choice: sinh sôi
  rationale: רבה ở đây nói đến sự gia tăng dân số. “Sinh sôi” diễn đạt rõ sự tăng thêm về số lượng trong mạch văn Xuất Ai Cập.
- source_word: הָעָם
  choice: dân chúng
  rationale: Nguyên văn chỉ nói “dân”; “dân chúng” giữ nguyên tính hàm ẩn của đối tượng đã rõ trong ngữ cảnh, không thêm “Israel” vào câu.
- source_word: וַיַּעַצְמוּ
  choice: trở nên rất hùng mạnh
  rationale: עצם diễn tả việc trở nên mạnh hoặc hùng mạnh. “Trở nên hùng mạnh” giữ sắc thái phát triển về sức mạnh, không biến thành một trạng thái tĩnh.
- source_word: מְאֹד
  choice: rất
  rationale: מְאֹד nhấn mạnh mức độ; “rất” là từ tương đương tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Có nên dịch hành động của Đức Chúa Trời là “ban phước cho” các bà đỡ hay dùng cách diễn đạt trung tính hơn
  choice: đối đãi tốt với các bà đỡ
  alternative: ban phước cho các bà đỡ; làm điều tốt cho các bà đỡ
  rationale: Động từ יטב nói đến việc làm điều tốt hoặc đối xử tốt, nhưng không tự nó xác định hình thức ân huệ. Cách dịch trung tính giữ được lời văn nguồn và để câu 21 nói rõ kết quả cụ thể.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Đối đãi tốt” giữ sắc thái ban ơn của nguyên văn; “hùng mạnh” phù hợp với sự gia tăng sức mạnh của cả một dân tộc.
