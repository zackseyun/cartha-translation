  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: các bà đỡ kính sợ Đức Chúa Trời, không làm theo lời vua Ai Cập, và khiến/để các trẻ sống. Tuy nhiên, “nên” biến liên từ phối hợp וְ thành quan hệ kết quả được nêu rõ; quan hệ này hợp văn cảnh nhưng không được phát biểu minh thị trong câu Hê-bơ-rơ. Nên giữ phối hợp đơn thuần. “Đã bảo họ” truyền đạt tự nhiên động từ דִּבֶּר אֲלֵיהֶן mà không tăng cường thành mệnh lệnh trực tiếp.'
