  terminology: “Đức Chúa Trời” và “kính sợ” phù hợp register trang trọng, thông dụng, và bảo toàn sắc thái tôn kính của ירא. Không cần thay “những đứa trẻ” bằng “các bé trai,” vì יְלָדִים trong chính câu này có phạm vi từ vựng rộng hơn, dù văn cảnh xác định các trẻ được nói đến.
