  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: vi
  text: Nhưng các bà đỡ kính sợ Đức Chúa Trời và không làm theo điều vua Ai Cập đã bảo họ; trái lại, họ để những đứa trẻ sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “họ giữ cho những đứa trẻ sống.”'
    reason: Dạng piel וַתְּחַיֶּיןָ có thể diễn tả “để cho sống” hoặc “giữ cho sống”; cả hai đều phù hợp với sự tương phản với lệnh giết của vua.
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: kính sợ
  rationale: Động từ ירא khi hướng về Đức Chúa Trời bao hàm cả sự sợ hãi lẫn lòng tôn kính. “Kính sợ” giữ được thành ngữ Kinh Thánh quen thuộc mà không giản lược thành chỉ “tôn trọng”.
- source_word: הַמְיַלְּדֹת
  choice: các bà đỡ
  rationale: Phân từ của ילד được dùng như danh từ chỉ những phụ nữ làm công việc đỡ sinh; “các bà đỡ” là cách nói tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: אֶת־הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong cấu trúc làm bổ ngữ cho “kính sợ”, אֱלֹהִים chỉ Đức Chúa Trời. Cách dịch này phù hợp với văn phong Kinh Thánh tiếng Việt và không thêm ý ngoài mạch kể.
- source_word: וְלֹא עָשׂוּ
  choice: không làm theo
  rationale: עָשׂוּ theo sau bởi mệnh đề so sánh כַּאֲשֶׁר mang nghĩa không hành động theo lời đã truyền. “Không làm theo” tự nhiên hơn “không làm như” trong tiếng Việt.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: theo điều ... đã truyền cho họ
  rationale: דבר cơ bản là “nói”, nhưng trong ngữ cảnh mệnh lệnh của nhà vua, “truyền” thể hiện đúng lực ngôn trung mà không diễn giải quá mức.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: vua Ai Cập
  rationale: Cách chuyển ngữ gọn, tự nhiên của cấu trúc sở hữu trong tiếng Hê-bơ-rơ.
- source_word: וַתְּחַיֶּיןָ
  choice: họ để ... được sống
  rationale: Dạng piel của חיה có nghĩa gây cho sống hoặc giữ cho sống. “Để ... được sống” phù hợp với sự tương phản trực tiếp với lệnh giết trong văn cảnh, đồng thời giữ được sắc thái cho phép sống.
- source_word: הַיְלָדִים
  choice: những đứa trẻ
  rationale: יְלָדִים về mặt từ vựng rộng hơn “các bé trai”, dù văn cảnh trước đó cho biết đối tượng cụ thể là trẻ sơ sinh nam. Cách dịch này giữ phạm vi của chính danh từ trong câu và để văn cảnh xác định đối tượng.
theological_decisions:
- issue: Cách dịch אֱלֹהִים trong thành ngữ kính sợ Đức Chúa Trời
  choice: Đức Chúa Trời
  alternative: Thiên Chúa
  rationale: Danh từ có mạo từ trong tiếng Hê-bơ-rơ và trong mạch kể chỉ Đức Chúa Trời chân thật. “Đức Chúa Trời” là cách gọi trang trọng, rõ nghĩa trong tiếng Việt; không cần chuyển mạo từ thành một thành tố riêng.
- issue: Sắc thái của ירא đối với Đức Chúa Trời
  choice: kính sợ
  alternative: sợ
  rationale: “Kính sợ” bảo toàn đồng thời yếu tố sợ hãi và tôn kính vốn có của ירא trong ngữ cảnh hướng về Đức Chúa Trời, không làm nhẹ thành chỉ sự kính trọng và cũng không giới hạn thành nỗi khiếp sợ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các bà đỡ” thay cho thuật ngữ chuyên môn; dùng “trái lại” để nêu rõ sự tương phản. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích, thay vì sau danh xưng Đức Chúa Trời.
