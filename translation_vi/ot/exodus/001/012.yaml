base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: vi
  text: Nhưng họ càng áp bức dân Y-sơ-ra-ên[a], dân ấy càng gia tăng và càng lan rộng; và họ kinh hãi trước con cháu Y-sơ-ra-ên.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng một đại từ số ít, quy chiếu tập thể về Y-sơ-ra-ên như một dân duy nhất.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ cũng có thể mang nghĩa “ghê tởm” hoặc “khiếp sợ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: càng… càng… và càng
  rationale: Cấu trúc tương liên diễn tả mức độ tăng theo tỷ lệ; cách nói “càng… càng…” tự nhiên trong tiếng Việt và giữ rõ sự tương phản trong mạch truyện.
- source_word: יְעַנּוּ
  choice: áp bức
  rationale: Ở thể Piel, động từ ענה tại đây chỉ việc đối xử khắc nghiệt, làm khổ và đàn áp; “áp bức” phù hợp với bối cảnh lao dịch cưỡng bức.
- source_word: אֹתוֹ
  choice: dân Y-sơ-ra-ên / dân ấy
  rationale: Đại từ số ít giống đực quy chiếu tập thể về Y-sơ-ra-ên. Tiếng Việt diễn đạt tự nhiên bằng danh từ tập thể và đại từ “dân ấy”.
- source_word: יִרְבֶּה
  choice: gia tăng
  rationale: Động từ רבה nói đến sự tăng thêm về số lượng; trong ngữ cảnh này là dân số tăng lên.
- source_word: יִפְרֹץ
  choice: lan rộng
  rationale: פרץ có sắc thái bứt ra, phát triển hoặc lan ra mạnh mẽ; “lan rộng” giữ được ý mở rộng nhanh chóng mà không quá tối nghĩa.
- source_word: וַיָּקֻצוּ
  choice: kinh hãi
  rationale: קוץ có thể diễn tả nỗi khiếp sợ hoặc sự ghê tởm. “Kinh hãi” phù hợp với nỗi lo sợ trước sự lớn mạnh của Y-sơ-ra-ên, đồng thời chú thích bảo lưu nghĩa khác.
- source_word: מִפְּנֵי
  choice: trước
  rationale: Trong kết cấu với קוץ, giới từ chỉ phản ứng do sự hiện diện của đối tượng; “kinh hãi trước” là cách diễn đạt tự nhiên.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  rationale: Đây là thành ngữ chỉ cộng đồng hậu duệ của Y-sơ-ra-ên. “Con cháu Y-sơ-ra-ên” vừa phản ánh quan hệ huyết thống vừa tự nhiên hơn cách dịch máy móc “các con trai” trong tiếng Việt.
theological_decisions:
- issue: Cách hiểu đại từ số ít אֹתוֹ và các động từ số ít
  choice: 'Diễn đạt Y-sơ-ra-ên như một tập thể: “dân Y-sơ-ra-ên… dân ấy”'
  alternative: Dịch sát hình thái là “người ấy” hoặc “nó”
  rationale: Số ít trong tiếng Hê-bơ-rơ nhân cách hóa Y-sơ-ra-ên như một dân duy nhất. Bản dịch giữ ý tập thể mà không gây hiểu nhầm là chỉ một cá nhân.
- issue: Sắc thái của וַיָּקֻצוּ
  choice: kinh hãi
  alternative: ghê tởm
  rationale: Ngữ cảnh nhấn mạnh sự lo sợ của những kẻ áp bức trước mức tăng trưởng của Y-sơ-ra-ên, nhưng nghĩa “ghê tởm” vẫn có cơ sở từ vựng nên được giữ trong chú thích.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  alternative: các con trai Y-sơ-ra-ên; dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Cụm từ là danh xưng dân tộc dựa trên dòng dõi, bao gồm toàn thể cộng đồng chứ không chỉ nam giới. “Con cháu” giữ mối liên hệ phả hệ và tránh thu hẹp phạm vi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc tương liên “càng… càng…” để chuyển tải sát quan hệ tỷ lệ của nguyên văn; tránh lặp chủ thể mơ hồ bằng “dân Y-sơ-ra-ên / dân ấy”, nhưng vẫn giữ chủ thể không nêu đích danh của mệnh đề cuối.
