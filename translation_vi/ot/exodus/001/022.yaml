source:
  edition: WLC
  text: וַ/יְצַ֣ו פַּרְעֹ֔ה לְ/כָל עַמּ֖/וֹ לֵ/אמֹ֑ר כָּל הַ/בֵּ֣ן הַ/יִּלּ֗וֹד הַ/יְאֹ֨רָ/ה֙ תַּשְׁלִיכֻ֔/הוּ וְ/כָל הַ/בַּ֖ת תְּחַיּֽוּ/ן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: vi
  text: 'Bấy giờ, Pha-ra-ôn truyền lệnh cho toàn thể dân mình: “Mọi con trai[a] mới sinh, các ngươi phải ném xuống sông Nin[b]; còn[c] mọi con gái, các ngươi phải để cho sống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi bé trai”. Từ Hê-bơ-rơ có nghĩa đen là “con trai” và trong ngữ cảnh này chỉ trẻ em nam.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “sông”; trong sách Xuất Hành, từ này thường chỉ sông Nin.'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn dùng liên từ “và”; ở đây dịch là “còn” để thể hiện sự tương phản giữa hai vế của sắc lệnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Động từ צוה diễn tả việc ban lệnh; “truyền lệnh” tự nhiên, trang trọng và phù hợp với sắc lệnh của vua.
- source_word: לְכָל עַמּוֹ
  choice: cho toàn thể dân mình
  rationale: עַם có nghĩa thông thường là “dân”; cách dịch này giữ quan hệ sở hữu trong nguyên văn và không thu hẹp thành quan lại hay binh lính.
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: mọi con trai mới sinh
  rationale: בֵּן là “con trai” và הַיִּלּוֹד mô tả đứa trẻ được sinh ra. Cụm tiếng Việt này vừa tự nhiên vừa giữ tính khái quát và sự khắc nghiệt của mệnh lệnh.
- source_word: הַיְאֹרָה
  choice: xuống sông Nin
  rationale: יְאֹר theo nghĩa đen là “sông” nhưng trong sách Xuất Hành thường chỉ sông Nin; nêu tên sông giúp độc giả hiện đại nhận rõ địa danh. Hình thái định hướng -ה được thể hiện bằng “xuống”.
- source_word: תַּשְׁלִיכֻהוּ
  choice: các ngươi phải ném
  rationale: Động từ ở ngôi thứ hai số nhiều mang lực mệnh lệnh và có hậu tố “nó/cậu ấy”; tiếng Việt diễn đạt tự nhiên đối tượng qua cụm “mọi con trai” ở đầu câu.
- source_word: וְכָל הַבַּת
  choice: còn mọi con gái
  rationale: Liên từ וְ về hình thức là “và”, nhưng tại đây nối hai vế tương phản; “còn” thể hiện sự đối lập mà không làm câu quá giải thích.
- source_word: תְּחַיּוּן
  choice: các ngươi phải để cho sống
  rationale: Dạng Piel của חיה ở đây có nghĩa là để sống hoặc giữ cho sống; cách dịch này đối lập trực tiếp với lệnh ném các con trai xuống sông.
theological_decisions:
- issue: Phạm vi của cụm “mọi con trai”
  choice: Không thêm “Hê-bơ-rơ” vào chính văn
  alternative: “Mọi con trai Hê-bơ-rơ mới sinh”
  rationale: Bối cảnh cho thấy sắc lệnh nhắm vào dân Y-sơ-ra-ên, nhưng câu Hê-bơ-rơ này không trực tiếp có từ “Hê-bơ-rơ”. Không thêm từ ấy giúp bảo toàn cách diễn đạt và phạm vi ngữ pháp của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. “Pha-ra-ôn” theo lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt; “các ngươi” duy trì giọng sắc lệnh trực tiếp của nhà vua mà không quá cổ kính. Dấu ba chấm phân đoạn không được thêm; câu giữ nhịp ngắn và dứt khoát của mệnh lệnh.
