base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: vi
  text: 'Vua nói với dân mình: “Kìa, dân Y-sơ-ra-ên[a] đông và mạnh hơn chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát chữ: “dân của con cái Y-sơ-ra-ên.”'
    reason: Bảo lưu cấu trúc tiếng Hê-bơ-rơ עַם בְּנֵי יִשְׂרָאֵל, trong khi thân bài dùng cách gọi tập thể tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Vua nói
  rationale: Dạng wayyiqtol tiếp nối mạch kể chuyện. Chủ ngữ được xác định từ câu trước là Pha-ra-ôn; dùng “Vua” giúp câu tiếng Việt tự nhiên mà không thêm một danh xưng ngoài ngữ cảnh.
- source_word: אֶל עַמּוֹ
  choice: với dân mình
  rationale: עַם chỉ cộng đồng dân chúng; hậu tố ngôi ba số ít chỉ dân thuộc về vua. “Dân mình” tự nhiên và giữ nguyên quan hệ trong tiếng Hê-bơ-rơ.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Tiểu từ thu hút sự chú ý, mang sắc thái chỉ dẫn và cảnh báo; “Kìa” trang trọng vừa phải và tự nhiên trong lời nói.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: dân là con cháu Y-sơ-ra-ên
  rationale: Giữ ý nghĩa gia tộc của בְּנֵי (“các con/con cháu”) và cấu trúc trong đó cả cộng đồng được gọi là dân thuộc về dòng dõi Y-sơ-ra-ên, thay vì giản lược hoàn toàn thành “dân Y-sơ-ra-ên”.
- source_word: רַב
  choice: đông
  rationale: Trong văn cảnh, רַב nói đến số lượng dân. Tính so sánh được biểu đạt bởi מִמֶּנּוּ ở cuối mệnh đề.
- source_word: וְעָצוּם
  choice: và mạnh
  rationale: עָצוּם diễn tả sức mạnh hay thế lực. “Mạnh” rõ ràng, tự nhiên và song hành với “đông”.
- source_word: מִמֶּנּוּ
  choice: hơn chúng ta
  rationale: 'Giới từ מִן với hậu tố ngôi thứ nhất số nhiều biểu thị sự so sánh: “hơn chúng ta”.'
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Giữ cách gọi “Y-sơ-ra-ên” quen thuộc trong bản dịch Kinh Thánh tiếng Việt và bảo tồn sắc thái huyết thống của בְּנֵי יִשְׂרָאֵל.
