  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: vi
  text: Người Ai Cập bắt con cháu Y-sơ-ra-ên[a] phải lao dịch một cách khắc nghiệt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “các con trai của Y-sơ-ra-ên”; cũng có thể dịch: “dân Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một cách tàn nhẫn” hoặc “hà khắc.” Từ Hê-bơ-rơ diễn tả sự khắc nghiệt nặng nề, đè bẹp trong lao dịch cưỡng bức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: bắt ... phải lao dịch
  rationale: Dạng Hiphil của עבד mang nghĩa sai khiến, ‘khiến/bắt phục dịch hoặc làm việc’. Cách dịch này giữ lực sai khiến và, trong ngữ cảnh áp bức lao động, tự nhiên hơn ‘bắt phục vụ’, nhưng không giản lược động từ thành ‘nô dịch hóa’.
- source_word: מִצְרַיִם
  choice: Người Ai Cập
  rationale: Danh từ ở đây chỉ dân Ai Cập là chủ thể số nhiều thực hiện việc áp bức, chứ không đơn thuần chỉ xứ Ai Cập.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là ‘các con trai của Y-sơ-ra-ên’, nhưng ở đây là danh xưng tập thể chỉ cộng đồng hậu duệ của Y-sơ-ra-ên. ‘Con cháu’ giữ sắc thái gia tộc–giao ước và tránh khiến độc giả hiểu rằng chỉ có nam giới hoặc trẻ em.
- source_word: בְּפָרֶךְ
  choice: khắc nghiệt
  rationale: Từ פֶּרֶךְ diễn tả tính chất tàn nhẫn, hà khắc và đè bẹp của lao dịch cưỡng bức. ‘Khắc nghiệt’ rõ nghĩa, trang trọng và tự nhiên trong tiếng Việt hiện đại; chú thích bảo tồn các sắc thái mạnh hơn.
theological_decisions:
- issue: Cách chuyển danh xưng tập thể בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Bản dịch chính bảo tồn ý niệm hậu duệ và căn tính cộng đồng mà không thu hẹp đối tượng vào nam giới. Chú thích nêu dạng sát chữ và cách gọi dân tộc tương đương.
- issue: Mức độ diễn giải tình trạng cưỡng bức trong וַיַּעֲבִדוּ
  choice: bắt ... phải lao dịch
  alternative: nô dịch; bắt ... phục dịch
  rationale: ‘Bắt ... phải lao dịch’ thể hiện cấu trúc sai khiến và phù hợp ngữ cảnh lao động cưỡng bức, nhưng không biến riêng động từ này thành một tuyên bố pháp lý hoặc xã hội học đầy đủ về chế độ nô lệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Lao dịch’ diễn đạt công việc cưỡng bức trong ngữ cảnh mà không dùng lối nói cổ; ‘Y-sơ-ra-ên’ theo dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
