  source_fidelity: Bản dịch chuyển đúng chủ thể số nhiều «Người Ai Cập», lực sai khiến của Hiphil וַיַּעֲבִדוּ («bắt ... phải lao dịch»), danh xưng tập thể «con cháu Y-sơ-ra-ên», và cách thức áp bức của בְּפָרֶךְ. «Lao dịch» phù hợp ngữ cảnh nhưng không tự nó đồng nhất động từ với một khẳng định rộng hơn là «nô dịch hóa».
  naturalness: Câu hiện hữu dễ hiểu, nhưng «lao dịch khắc nghiệt» có thể được đọc chủ yếu như tính chất của công việc, trong khi tiếng Hê-bơ-rơ đặt «với sự hà khắc» làm cách thức người Ai Cập bắt họ phục dịch. Thêm «một cách» làm quan hệ này sáng rõ và tự nhiên. Các ký hiệu chú thích cũng nên được đặt sát từ/cụm từ mà chúng chú giải.
  terminology: «Người Ai Cập», «con cháu Y-sơ-ra-ên», và «lao dịch» nhất quán với văn phong Kinh Thánh Việt ngữ hiện đại. «Khắc nghiệt» diễn đạt được פֶּרֶךְ; chú thích giữ các khả năng «tàn nhẫn» và «hà khắc» mà không áp đặt một sắc thái duy nhất.
