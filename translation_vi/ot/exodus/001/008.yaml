  text: A new king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: vi
  text: Một vua mới lên cai trị Ai Cập[a]; vua ấy không biết Giô-sép[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một vua khác”; tính từ Hê-bơ-rơ có nghĩa đen là “mới”, nhưng một số người hiểu câu này nói đến một triều đại hoặc chính quyền khác.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “không nhìn nhận Giô-sép”; “biết” ở đây có thể mang nghĩa nhìn nhận hoặc kể đến ông, chứ không chỉ là không có thông tin về ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: lên cai trị
  rationale: Động từ קום trong mạch kể nói về sự xuất hiện hoặc lên nắm quyền của một vị vua. “Lên cai trị” tự nhiên trong tiếng Việt và truyền đạt đúng ý vua lên cầm quyền, dù không giữ nguyên hình ảnh “đứng dậy” vốn dễ gây hiểu sai.
- source_word: מֶלֶךְ חָדָשׁ
  choice: một vua mới
  rationale: חָדָשׁ có nghĩa trực tiếp là “mới”. Bản dịch không tự suy diễn thành một triều đại khác; khả năng hiểu là “một vua khác” được giữ trong chú thích.
- source_word: עַל מִצְרָיִם
  choice: cai trị Ai Cập
  rationale: עַל đi với người cai trị diễn tả quyền cai trị trên một lãnh thổ. Cách nói này tự nhiên hơn “trên Ai Cập” trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: không biết
  rationale: יָדַע trước hết là “biết”. Trong ngữ cảnh, từ này cũng có thể hàm ý không nhìn nhận hoặc không kể đến Giô-sép; bản văn chính giữ nghĩa rộng và chú thích nêu sắc thái thay thế.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt hiện đại, chỉ cùng nhân vật יוֹסֵף.
theological_decisions:
- issue: Có nên hàm ý thay đổi triều đại hoặc thái độ cố ý phủ nhận công lao của Giô-sép hay không
  choice: 'Giữ cách diễn đạt giản dị: “một vua mới ... không biết Giô-sép”'
  alternative: “một vua khác ... không nhìn nhận Giô-sép”
  rationale: Câu Hê-bơ-rơ không buộc phải hiểu là đổi triều đại, cũng không xác định rõ nhà vua thiếu thông tin hay cố tình không nhìn nhận Giô-sép. Giữ lối nói rộng bảo toàn sự mơ hồ và căng thẳng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” thay vì “nhà vua” để câu gọn; lặp “vua ấy” nhằm tránh đại từ có thể mơ hồ. Các dấu chú thích [a], [b] đều xuất hiện ngay sau phần văn bản liên quan.
