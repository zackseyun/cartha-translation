revisions:
- from: 'Chúng làm cho cuộc đời họ cay đắng vì lao dịch nặng nhọc: trộn vữa, làm gạch và làm đủ mọi công việc ngoài đồng. Trong mọi việc chúng bắt họ lao dịch, chúng đều đối xử hà khắc với họ.[a]'
  to: Chúng làm cho cuộc sống họ cay đắng bằng công việc nặng nhọc với vữa và gạch, cùng đủ mọi công việc ngoài đồng; chúng bắt họ làm tất cả những công việc ấy một cách hà khắc.[a]
  rationale: Bản sửa tránh thêm hành động “trộn” và giữ các danh từ vật liệu của nguyên văn. Mệnh đề cuối được điều chỉnh để hà khắc bổ nghĩa trực tiếp cho cách công việc bị áp đặt, đồng thời bảo toàn tính nhấn mạnh tóm lược của tiếng Hê-bơ-rơ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:37:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: đời sống của dân Y-sơ-ra-ên bị làm cho cay đắng bởi lao dịch nặng nhọc, gồm công việc với vữa/gạch và ngoài đồng, được áp đặt cách hà khắc. Tuy nhiên, “trộn vữa, làm gạch” thêm các động tác cụ thể không được nêu trực tiếp trong tiếng Hê-bơ-rơ, vốn nói đến công việc “với vữa và gạch”. Cụm “đối xử hà khắc” cũng chuyển trọng tâm từ cách họ bị bắt làm việc sang cách bị đối đãi nói chung.'
  naturalness: Văn phong nhìn chung rõ và hiện đại. Bản sửa dùng cấu trúc chấm phẩy để giữ tính tóm lược, lặp lại của nguyên văn mà vẫn tự nhiên hơn tiếng Việt. “Cuộc sống họ” là cách nói tự nhiên hơn “cuộc đời họ” khi diễn tả toàn bộ hoàn cảnh sống bị áp bức.
  terminology: “Cay đắng,” “công việc nặng nhọc,” “vữa,” “gạch,” và “hà khắc” phù hợp ngữ cảnh. “Lao dịch” có thể hiểu là lao động cưỡng bức, nhưng không cần thiết vì ý cưỡng bức được diễn đạt rõ ở mệnh đề cuối. Chú thích về פָרֶךְ giữ được phương án “tàn nhẫn” và sắc thái áp bức nghiệt ngã.
  issues:
  - severity: medium
    issue: “trộn vữa, làm gạch” cụ thể hóa danh từ nguồn thành các động tác.
    rationale: בְּחֹמֶר וּבִלְבֵנִים nêu công việc với vữa/chất liệu và gạch; bản văn không xác định riêng hành động trộn vữa. Nên giữ cách nói không thêm chi tiết.
  - severity: low
    issue: “đối xử hà khắc” hơi rộng hơn trọng tâm của בְּפָרֶךְ trong cấu trúc câu.
    rationale: 'Cụm cuối mô tả cách người Ai Cập bắt họ làm toàn bộ công việc: bằng sự hà khắc/ruthlessness. Diễn đạt trực tiếp với động từ “bắt ... làm” phản ánh sát hơn.'
