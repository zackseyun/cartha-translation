  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: vi
  text: Chúng làm cho cuộc sống họ cay đắng bằng công việc nặng nhọc với vữa và gạch, cùng đủ mọi công việc ngoài đồng; chúng bắt họ làm tất cả những công việc ấy một cách hà khắc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tàn nhẫn”. Từ Hê-bơ-rơ chỉ sự áp bức nghiệt ngã, có sức nghiền nát.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: làm cho cuộc đời họ cay đắng
  rationale: Giữ nguyên ẩn dụ của căn מרר và diễn đạt tự nhiên đối tượng חַיֵּיהֶם trong tiếng Việt.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: vì lao dịch nặng nhọc
  rationale: “Lao dịch” thể hiện công việc bị cưỡng bức trong bối cảnh áp bức; “nặng nhọc” phản ánh קָשָׁה.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: trộn vữa, làm gạch
  rationale: Tiếng Hê-bơ-rơ nêu vật liệu “vữa” và danh từ số nhiều “gạch”; cách diễn đạt bằng động tác tự nhiên hơn trong tiếng Việt mà vẫn giữ cả hai yếu tố.
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: và làm đủ mọi công việc ngoài đồng
  rationale: “Đủ mọi” truyền đạt tính bao quát của כָל; “ngoài đồng” là cách nói hiện đại, tự nhiên cho בַּשָּׂדֶה.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: Trong mọi việc chúng bắt họ lao dịch
  rationale: Cấu trúc Hê-bơ-rơ có tính lặp lại và nặng; “bắt họ lao dịch” chuyển tải quan hệ áp đặt của người Ai Cập đối với dân Y-sơ-ra-ên mà không thêm nội dung.
- source_word: בְּפָרֶךְ
  choice: đối xử hà khắc
  rationale: Diễn đạt sự cai trị và bóc lột nghiệt ngã; chú thích bảo lưu sắc thái mạnh hơn là “tàn nhẫn”.
