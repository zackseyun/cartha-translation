translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng” cho những kẻ áp bức theo mạch văn trước đó và “họ” cho dân Y-sơ-ra-ên; tách thành hai câu để làm rõ cấu trúc lặp lại của nguyên văn mà không xóa bỏ ý nhấn mạnh.
