  text: וַ/תֹּאמַ֤רְןָ הַֽ/מְיַלְּדֹת֙ אֶל פַּרְעֹ֔ה כִּ֣י לֹ֧א כַ/נָּשִׁ֛ים הַ/מִּצְרִיֹּ֖ת הָֽ/עִבְרִיֹּ֑ת כִּֽי חָי֣וֹת הֵ֔נָּה בְּ/טֶ֨רֶם תָּב֧וֹא אֲלֵ/הֶ֛ן הַ/מְיַלֶּ֖דֶת וְ/יָלָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: vi
  text: 'Các bà đỡ thưa với Pha-ra-ôn: “Vì phụ nữ Hê-bơ-rơ không giống phụ nữ Ai Cập; họ khỏe mạnh[a], nên trước khi bà đỡ đến với họ, họ đã sinh con rồi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy sức sống” hoặc “cường tráng”. Từ Hê-bơ-rơ có thể nhấn mạnh sức lực và việc sinh con nhanh; một số người hiểu sát hơn là “giống loài vật”, nhưng nghĩa này không chắc chắn trong ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: thưa
  rationale: Động từ אמר mở đầu lời nói trực tiếp; trong ngữ cảnh các bà đỡ trả lời vua, “thưa” vừa tự nhiên vừa thể hiện đúng quan hệ xã hội, mà không thêm nội dung vào lời nói.
- source_word: הַמְיַלְּדֹת
  choice: các bà đỡ
  rationale: Danh từ chỉ những phụ nữ giúp sản phụ sinh con; “bà đỡ” là cách gọi thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אֶל־פַּרְעֹה
  choice: với Pha-ra-ôn
  rationale: אֶל đánh dấu người tiếp nhận lời nói. “Pha-ra-ôn” là dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: כִּי ... כִּי
  choice: Vì ...; ... nên
  rationale: כִּי thứ nhất mở đầu lời giải thích của các bà đỡ, còn כִּי thứ hai nêu lý do của sự khác biệt. Cấu trúc “vì… nên” giúp câu tự nhiên trong tiếng Việt; dấu chấm phẩy vẫn cho thấy mệnh đề “họ khỏe mạnh” là lời giải thích then chốt.
- source_word: לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: phụ nữ Hê-bơ-rơ không giống phụ nữ Ai Cập
  rationale: Diễn đạt trực tiếp phép so sánh phủ định, đồng thời giữ nguyên sự tương phản giữa hai nhóm phụ nữ.
- source_word: חָיוֹת
  choice: khỏe mạnh
  rationale: Trong ngữ cảnh sinh nở, từ này có thể chỉ sự mạnh khỏe, đầy sức sống, khiến họ sinh nhanh. “Khỏe mạnh” dễ hiểu và không mang sắc thái miệt thị; chú thích giữ lại khả năng hiểu khác.
- source_word: הֵנָּה
  choice: họ
  rationale: Đại từ độc lập giống cái số nhiều nhấn vào các phụ nữ Hê-bơ-rơ; tiếng Việt diễn đạt tự nhiên bằng “họ”.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: trước khi bà đỡ đến với họ
  rationale: בְּטֶרֶם chỉ thời điểm trước một hành động; danh từ số ít “bà đỡ” được hiểu theo nghĩa đại diện.
- source_word: וְיָלָדוּ
  choice: họ đã sinh con rồi
  rationale: Dạng hoàn thành mô tả việc sinh nở đã xảy ra trước khi bà đỡ tới; “đã… rồi” thể hiện rõ trình tự này trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật trang trọng nhưng hiện đại. Dùng “thưa” cho lời nói với vua, “bà đỡ” và “sinh con” để người đọc phổ thông dễ hiểu. Dấu chú thích được đặt ngay sau “khỏe mạnh”, là từ mà chú thích giải thích.
