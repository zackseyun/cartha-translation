translation:
  language: vi
  text: Rồi Giô-sép, tất cả các anh em ông và cả thế hệ ấy đều chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Rồi ... qua đời
  rationale: Động từ với waw liên tiếp đưa trình thuật sang sự kiện kế tiếp trong quá khứ. “Rồi ... qua đời” tự nhiên, trang trọng và giữ được sắc thái tiếp diễn của câu chuyện.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: וְכָל אֶחָיו
  choice: cùng với tất cả các anh em ông
  rationale: כָּל mang nghĩa tập thể là “tất cả”; אֶחָיו chỉ những người anh em trai của Giô-sép trong văn cảnh. “Cùng với” diễn đạt tự nhiên sự liệt kê những người cũng qua đời mà không hàm ý họ chết đồng thời.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: và cả thế hệ ấy
  rationale: דּוֹר là thế hệ những người sống cùng thời. “Cả” chuyển tải tính bao quát của כֹּל một cách tự nhiên trong tiếng Việt, còn “ấy” tương ứng với הַהוּא.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “qua đời” thay cho “chết” để câu văn tự nhiên, dignified mà không làm thay đổi nghĩa; giữ hai ý bao quát của כָּל bằng “tất cả” và “cả”.
