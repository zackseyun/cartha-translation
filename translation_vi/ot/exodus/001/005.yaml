  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: vi
  text: Tổng số người thuộc dòng dõi Gia-cốp[a] là bảy mươi người; và Giô-sép đã ở Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “những người ra từ đùi của Gia-cốp”. Đây là một thành ngữ chỉ những hậu duệ trực hệ của ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: là
  rationale: Động từ היה trong mạch kể dẫn vào lời tổng kết về số người; tiếng Việt hiện đại diễn đạt tự nhiên bằng hệ từ “là”, không cần dùng công thức cổ “xảy ra rằng”.
- source_word: כָּל
  choice: tất cả
  rationale: Giữ nguyên ý nghĩa bao quát của từ định lượng Hê-bơ-rơ.
- source_word: נֶפֶשׁ ... נָפֶשׁ
  choice: những người ... người
  rationale: Trong ngữ cảnh thống kê, נֶפֶשׁ chỉ từng con người, không nhấn mạnh khái niệm thần học hoặc nhân học “linh hồn”.
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: ra từ đùi của Gia-cốp
  rationale: Giữ hình ảnh thân thể cụ thể của thành ngữ Hê-bơ-rơ, đồng thời chú thích rằng thành ngữ này nói về hậu duệ trực hệ của Gia-cốp.
- source_word: שִׁבְעִים
  choice: bảy mươi
  rationale: Chuyển đúng số từ trong nguyên văn.
- source_word: וְיוֹסֵף
  choice: còn Giô-sép thì
  rationale: וְ nối thêm một mệnh đề và tạo sự tương phản hoàn cảnh nhẹ; “còn ... thì” tự nhiên trong tiếng Việt và không nhập Giô-sép vào cụm đếm một cách không rõ ràng.
- source_word: הָיָה בְמִצְרָיִם
  choice: đã ở Ai Cập
  rationale: “Đã” truyền đạt việc Giô-sép có mặt tại Ai Cập từ trước so với bối cảnh đang được thuật lại, mà không thêm từ “sẵn” vốn không hiện diện rõ trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ hình ảnh “đùi” của nguyên văn thay vì thay hẳn bằng “hậu duệ”; chú thích giải nghĩa thành ngữ để tránh hiểu theo nghĩa đen. Dấu chấm phẩy giúp phân biệt lời tổng kết con số với mệnh đề về Giô-sép.
