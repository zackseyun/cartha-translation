  to: 'Vua nói: “Khi các ngươi đỡ đẻ cho phụ nữ Hê-bơ-rơ và thấy họ trên ghế sinh[a], nếu là con trai thì phải giết nó; còn nếu là con gái thì để nó sống.”'
