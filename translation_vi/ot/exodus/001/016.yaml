  text: וַ/יֹּ֗אמֶר בְּ/יַלֶּדְ/כֶן֙ אֶת הָֽ/עִבְרִיּ֔וֹת וּ/רְאִיתֶ֖ן עַל הָ/אָבְנָ֑יִם אִם בֵּ֥ן הוּא֙ וַ/הֲמִתֶּ֣ן אֹת֔/וֹ וְ/אִם בַּ֥ת הִ֖יא וָ/חָֽיָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: vi
  text: 'Vua nói: “Khi các ngươi đỡ đẻ cho phụ nữ Hê-bơ-rơ và thấy họ trên ghế sinh[a], nếu là con trai thì phải giết nó; còn nếu là con gái thì để nó sống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen trong tiếng Hê-bơ-rơ là “trên hai hòn đá”, có lẽ chỉ ghế hoặc chỗ ngồi dùng khi sinh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: Khi các ngươi đỡ đẻ cho
  rationale: Động từ ילד ở dạng Pi’el trong ngữ cảnh sinh nở chỉ việc hỗ trợ sản phụ sinh con. “Đỡ đẻ cho” là cách nói tự nhiên, chính xác trong tiếng Việt và phù hợp với đối tượng được truyền lệnh là các bà đỡ.
- source_word: הָעִבְרִיּוֹת
  choice: phụ nữ Hê-bơ-rơ
  rationale: Danh từ hóa tính từ giống cái số nhiều, chỉ những phụ nữ Hê-bơ-rơ; ngữ cảnh của động từ đã cho biết họ đang sinh nở nên không cần thêm “đang chuyển dạ”.
- source_word: וּרְאִיתֶן
  choice: và thấy
  rationale: Giữ nghĩa trực tiếp của động từ ראה và trình tự của mệnh lệnh, không thêm ý “khám xét” vốn không có trong nguyên văn.
- source_word: עַל הָאָבְנָיִם
  choice: trên ghế sinh
  rationale: Cụm từ theo nghĩa đen là “trên hai hòn đá”, nhưng trong ngữ cảnh này nhiều khả năng chỉ dụng cụ hoặc chỗ ngồi dùng khi sinh. “Ghế sinh” truyền đạt chức năng tự nhiên trong tiếng Việt; nghĩa đen được giữ trong chú thích.
- source_word: אִם בֵּן הוּא
  choice: nếu là con trai
  rationale: בֵּן ở đây xác định trẻ sơ sinh là nam. “Con trai” tự nhiên trong tiếng Việt và duy trì cặp tương ứng với “con gái”.
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: thì phải giết nó
  rationale: מות dạng Hiphil mang nghĩa làm cho chết, tức giết. “Phải giết” thể hiện rõ mệnh lệnh bắt buộc ngôi thứ hai số nhiều giống cái; “nó” quy chiếu tự nhiên đến đứa trẻ sơ sinh.
- source_word: וְאִם בַּת הִיא
  choice: còn nếu là con gái
  rationale: “Còn nếu” thể hiện tự nhiên sự đối lập giữa hai trường hợp, đồng thời “con gái” tương ứng với “con trai”.
- source_word: וָחָיָה
  choice: thì cứ để nó sống
  rationale: Trong ngữ cảnh mệnh lệnh, động từ chỉ việc cho phép hoặc để đứa trẻ gái sống. Cách diễn đạt này tự nhiên hơn “nó sẽ sống” và không hàm ý một lời tiên báo.
theological_decisions:
- issue: Chủ thể của וַיֹּאמֶר
  choice: Vua nói
  alternative: Ông nói
  rationale: Nguyên văn chỉ dùng động từ ngôi thứ ba số ít, còn chủ thể được tiếp nối từ câu trước là vua Ai Cập. Dùng “Vua” giúp câu độc lập rõ nghĩa mà không thêm danh hiệu “Pha-ra-ôn” ngoài câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời vua truyền trực tiếp cho nhiều người và giữ sắc thái quyền uy; dùng “phải giết” để thể hiện rõ tính tàn bạo, bắt buộc của mệnh lệnh. Dấu chú thích [a] được đặt ngay sau “ghế sinh”.
