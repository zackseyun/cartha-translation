  source_fidelity: 'Bản dịch truyền đạt đúng mệnh lệnh của vua dành cho các bà đỡ: hỗ trợ phụ nữ Hê-bơ-rơ sinh nở, nhận biết giới tính đứa trẻ tại chỗ sinh, giết trẻ trai và để trẻ gái sống. “Ghế sinh” là cách giải nghĩa hợp lý cho עַל הָאָבְנָיִם, đồng thời chú thích bảo tồn nghĩa đen có tính bất định là “hai hòn đá”.'
