  terminology: “Đỡ đẻ,” “phụ nữ Hê-bơ-rơ,” “con trai/con gái,” và “ghế sinh” đều phù hợp tiếng Việt hiện đại. “Các ngươi” giữ được số nhiều và sắc thái lời truyền lệnh, dù tiếng Việt không thể hiện giống cái của người được nói đến. Chú thích được giữ tại đúng vị trí neo.
  issues:
