base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: vi
  text: 'Vua Ai Cập cho gọi các bà đỡ đến và nói với họ: “Tại sao các ngươi lại làm điều này mà để cho những đứa trẻ sống?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mà giữ cho các bé trai sống.” Động từ Hê-bơ-rơ có thể mang nghĩa khiến sống, giữ cho sống hoặc để sống; theo ngữ cảnh, “những đứa trẻ” là các bé trai người Hê-bơ-rơ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: cho gọi ... đến
  rationale: Động từ קרא đi với ל chỉ việc gọi hoặc triệu người đến. “Cho gọi ... đến” tự nhiên trong tiếng Việt và phù hợp với hành động của nhà vua.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: Vua Ai Cập
  rationale: Chuyển ngữ trực tiếp chuỗi liên kết, rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: לַמְיַלְּדֹת
  choice: các bà đỡ
  rationale: Danh từ chỉ những phụ nữ trợ giúp việc sinh nở; “các bà đỡ” là cách gọi chính xác, phổ thông.
- source_word: וַיֹּאמֶר לָהֶן
  choice: và nói với họ
  rationale: Giữ cách dẫn lời trực tiếp đơn giản của động từ אמר, không thêm sắc thái như quở trách hay ra lệnh.
- source_word: מַדּוּעַ
  choice: Tại sao
  rationale: Diễn đạt tự nhiên câu hỏi về nguyên do.
- source_word: עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: các ngươi lại làm điều này
  rationale: “Điều này” diễn đạt דבר trong nghĩa hành động/sự việc; “lại” thể hiện tự nhiên sắc thái chất vấn trong tiếng Việt mà không thay đổi nội dung.
- source_word: וַתְּחַיֶּיןָ
  choice: để cho ... sống
  rationale: Dạng của חיה ở đây có thể chỉ khiến sống, giữ cho sống hoặc để sống. “Để cho ... sống” tự nhiên và bảo tồn độ rộng ngữ nghĩa.
- source_word: הַיְלָדִים
  choice: những đứa trẻ
  rationale: Danh từ số nhiều có nghĩa cơ bản là trẻ em/con trẻ. Ngữ cảnh trước nói đến con trai, nhưng bản văn câu này không dùng từ chuyên biệt chỉ bé trai, nên bản chính giữ nghĩa rộng.
theological_decisions:
- issue: Giới tính của הַיְלָדִים trong lời buộc tội của vua
  choice: những đứa trẻ
  alternative: các bé trai
  rationale: Ngữ cảnh câu 16–17 xác định đối tượng bị giết là con trai, nhưng từ trong câu 18 tự nó có nghĩa rộng hơn. Giữ “những đứa trẻ” trong bản chính tránh thu hẹp điều bản văn không nói rõ ngay tại đây; chú thích nêu cách hiểu theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ngươi” phản ánh lời một vị vua nói với thuộc hạ trong thế chất vấn; không dùng lối quá cổ như “cớ sao” hay “việc thể ấy”. Dấu chú thích [a] đặt ngay sau câu có phương án dịch thay thế.
