  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành phần của tiếng Hê-bơ-rơ: vua Ai Cập cho gọi các bà đỡ, chất vấn lý do họ đã làm việc ấy, và việc để những đứa trẻ được sống. “Những đứa trẻ” bám sát nghĩa từ vựng của הַיְלָדִים; chú thích nêu đúng việc ngữ cảnh trước đó quy chiếu đến các bé trai mà không thu hẹp bản văn chính một cách không cần thiết. “Để cho ... sống” diễn đạt được phạm vi nghĩa thích hợp của וַתְּחַיֶּיןָ.'
  naturalness: Câu văn rõ ràng, hiện đại và phù hợp với lời chất vấn của nhà vua. “Cho gọi ... đến,” “các bà đỡ,” và “Tại sao các ngươi lại làm điều này” đều tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Cách xưng hô “các ngươi” giữ sắc thái bất cân xứng quyền lực mà không quá cổ.
  terminology: “Vua Ai Cập” và “các bà đỡ” là các thuật ngữ chính xác, nhất quán và phổ thông. Chú thích phân biệt hợp lý giữa nghĩa rộng trong bản văn (“những đứa trẻ”) và đối tượng là bé trai được xác định bởi ngữ cảnh trước đó. Không có vấn đề thần học hoặc tên riêng.
