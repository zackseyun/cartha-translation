  source_fidelity: 'Bản dịch phản ánh đúng các thành tố của nguyên văn Hê-bơ-rơ: trình tự tự sự của waw liên tiếp (“Bấy giờ”), chức danh “vua Ai Cập” không thêm “Pha-ra-ôn,” động từ nói với các bà đỡ, và cấu trúc phân biệt “một người... người kia...” nêu hai tên riêng. Dấu hai chấm phù hợp vì lời nói tiếp tục ở câu sau.'
