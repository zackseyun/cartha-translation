  terminology: '“Bà đỡ,” “Hê-bơ-rơ,” “Siếp-ra,” và “Phu-a” nhất quán với lối phiên âm và cách dùng tiếng Việt. Chú thích bảo toàn đúng sự mơ hồ cú pháp: các bà đỡ có thể là người Hê-bơ-rơ hoặc là người phục vụ phụ nữ Hê-bơ-rơ.'
