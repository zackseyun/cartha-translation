  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ מִצְרַ֔יִם לַֽ/מְיַלְּדֹ֖ת הָֽ/עִבְרִיֹּ֑ת אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אַחַת֙ שִׁפְרָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פּוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: vi
  text: 'Bấy giờ, vua Ai Cập nói với các bà đỡ người Hê-bơ-rơ[a], một người tên là Siếp-ra, người kia tên là Phu-a:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các bà đỡ cho phụ nữ Hê-bơ-rơ.” Cụm từ Hê-bơ-rơ có thể có nghĩa các bà đỡ là người Hê-bơ-rơ, hoặc họ phục vụ những phụ nữ Hê-bơ-rơ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw liên tiếp đẩy câu chuyện tiến tới; “Bấy giờ” diễn đạt tự nhiên trình tự kể chuyện trong tiếng Việt.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: vua Ai Cập
  rationale: Phản ánh trực tiếp kết cấu sở hữu trong tiếng Hê-bơ-rơ và không đưa thêm danh hiệu “Pha-ra-ôn,” vốn không có trong câu này.
- source_word: לַמְיַלְּדֹת
  choice: với các bà đỡ
  rationale: Phân từ giống cái chỉ những phụ nữ giúp sản phụ khi sinh; “bà đỡ” là cách gọi rõ ràng, thông dụng trong tiếng Việt.
- source_word: הָעִבְרִיֹּת
  choice: người Hê-bơ-rơ
  rationale: Đọc tính từ này theo nghĩa bổ nghĩa cho “các bà đỡ,” đồng thời giữ cách hiểu khác trong chú thích vì cụm Hê-bơ-rơ có thể chỉ các bà đỡ phục vụ phụ nữ Hê-bơ-rơ.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: một người tên là ... người kia tên là ...
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ sự phân biệt giữa hai người được nêu tên.
- source_word: שִׁפְרָה
  choice: Siếp-ra
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, thể hiện phụ âm mở đầu và cụm phụ âm giữa theo cách dễ đọc.
- source_word: פּוּעָה
  choice: Phu-a
  rationale: Phiên âm trực tiếp tên riêng Hê-bơ-rơ theo lối đọc tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Căn tính hay đối tượng phục vụ của các bà đỡ
  choice: các bà đỡ người Hê-bơ-rơ
  alternative: các bà đỡ cho phụ nữ Hê-bơ-rơ
  rationale: Cú pháp có thể được hiểu theo cả hai hướng. Bản chính dùng cách hiểu thuộc tính tự nhiên hơn, còn chú thích bảo toàn cách hiểu thay thế mà không quyết đoán quá mức.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “vua Ai Cập” thay vì thêm danh hiệu không có trong nguyên văn; dấu hai chấm cuối câu báo hiệu lời nói tiếp theo.
