translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Dân ấy” giữ cách nhìn tập thể trong lời Pha-ra-ôn; các đại từ tiếp theo chuyển tự nhiên sang “họ.” Bản chính giữ cụm “đi lên khỏi xứ” để bảo tồn hình ảnh và sự mơ hồ của nguyên văn, còn chú thích cung cấp cách nói tiếng Việt thông dụng hơn.
