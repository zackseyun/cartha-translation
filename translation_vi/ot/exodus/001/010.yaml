id: EXO.1.10
reference: Exodus 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: vi
  text: “Nào, chúng ta hãy khôn khéo[a] đối phó với dân ấy,[b] kẻo họ càng thêm đông. Nếu chiến tranh nổ ra,[c] họ cũng sẽ liên kết với kẻ thù của chúng ta, giao chiến với chúng ta rồi đi lên khỏi xứ.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hành động khôn ngoan.” Từ Hê-bơ-rơ có thể chỉ sự khôn ngoan hoặc mưu lược; ngữ cảnh ở đây thiên về sự khôn khéo đầy tính toán.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng đại từ số ít, “với nó” hoặc “với người ấy,” để chỉ dân Y-sơ-ra-ên như một tập thể.
    reason: lexical_alternative
  - marker: c
    text: 'Cụm từ Hê-bơ-rơ cũng có thể hiểu theo sắc thái thời gian: “khi chiến tranh nổ ra.”'
    reason: ambiguity
  - marker: d
    text: 'Cũng có thể dịch: “rời khỏi xứ.” Nguyên văn là “đi lên khỏi xứ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Nào
  rationale: Đây là thán từ thúc giục cùng hành động ngay; “Nào” tự nhiên trong tiếng Việt và giữ được sắc thái hiệu triệu.
- source_word: נִתְחַכְּמָה
  choice: chúng ta hãy khôn khéo đối phó
  rationale: Dạng Hitpael của חכם chỉ việc hành động cách khôn ngoan hoặc mưu lược. Trong ngữ cảnh chính sách nhằm khống chế một dân bị xem là mối đe dọa, “khôn khéo đối phó” truyền đạt sắc thái tính toán mà không xóa bỏ hoàn toàn nghĩa gốc liên quan đến sự khôn ngoan.
- source_word: לוֹ
  choice: với dân ấy
  rationale: Đại từ Hê-bơ-rơ ở số ít nhưng chỉ tập thể dân Y-sơ-ra-ên. Tiếng Việt dùng “dân ấy” để vừa giữ ý niệm tập thể vừa tránh một đại từ số ít gây hiểu lầm.
- source_word: פֶּן יִרְבֶּה
  choice: kẻo họ càng thêm đông
  rationale: פֶּן mở đầu kết quả đáng lo cần ngăn ngừa; יִרְבֶּה nói đến việc dân này gia tăng. “Càng thêm đông” tự nhiên hơn lối dịch máy móc “sinh sôi” trong lời bàn về một mối đe dọa dân số.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: Nếu chiến tranh nổ ra
  rationale: Cụm từ trình bày một tình huống có thể xảy đến. “Chiến tranh nổ ra” là cách nói hiện đại, rõ nghĩa, còn “nếu” phù hợp với logic lo ngại và phòng ngừa của cả câu.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: họ cũng sẽ liên kết với kẻ thù của chúng ta
  rationale: יסף đi với עַל ở đây có nghĩa dân ấy tự nhập vào hoặc đứng về phía một phe. “Liên kết với” diễn đạt rõ sự liên minh, đồng thời đại từ số nhiều phù hợp với danh từ tập thể trong tiếng Việt.
- source_word: וְנִלְחַם בָּנוּ
  choice: giao chiến với chúng ta
  rationale: Cụm từ diễn tả hành động chiến đấu chống lại người nói. Trong ngữ cảnh đã nói rõ họ liên kết với kẻ thù, “giao chiến với chúng ta” tự nhiên và không làm suy yếu tính thù địch.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: đi lên khỏi xứ
  rationale: Bản dịch giữ động từ định hướng עָלָה (“đi lên”) và giới từ מִן (“khỏi”), qua đó bảo tồn hình ảnh cùng nét lạ và khả năng diễn giải của nguyên văn, thay vì chỉ diễn ý là “rời khỏi xứ”.
