  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: câu giới thiệu “đây là tên”, “các con trai của Ít-ra-ên”, việc họ đến Ai Cập cùng Gia-cốp, và ý phân phối rằng mỗi người đi với gia đình mình. Việc gộp phân từ הַבָּאִים và động từ kết câu בָּאוּ vào một mệnh đề “đã ... đến” là tự nhiên trong tiếng Việt và không làm mất ý nghĩa.'
  naturalness: Câu văn hiện đại, rõ ràng và phù hợp văn phong Kinh Thánh trang trọng mà dễ hiểu. “Tên các con trai của Ít-ra-ên” là cách dùng chấp nhận được trong tiếng Việt; cấu trúc “mỗi người cùng với gia đình mình” diễn đạt minh bạch ý phân phối.
  terminology: “Ít-ra-ên,” “Gia-cốp,” và “Ai Cập” nhất quán với lối phiên âm Kinh Thánh tiếng Việt. “Con trai” phản ánh chính xác בני trong ngữ cảnh danh sách các con trai nam; “gia đình” diễn đạt phù hợp בֵּיתוֹ theo nghĩa hộ gia đình.
