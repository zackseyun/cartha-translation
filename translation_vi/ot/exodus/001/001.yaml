base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/001.yaml
  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: vi
  text: Đây[a] là tên các con trai của Ít-ra-ên đã cùng Gia-cốp đến Ai Cập, mỗi người cùng với gia đình mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và đây là tên”. Tiếng Hê-bơ-rơ mở đầu bằng một liên từ, nối sách Xuất Hành với phần tường thuật trước đó trong sách Sáng Thế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây[a] là
  rationale: Đại từ chỉ định אֵלֶּה được diễn đạt tự nhiên là “đây là”. Liên từ וְ nối câu này với phần tường thuật trước đó nhưng không nhất thiết phải hiện rõ trong câu chính tiếng Việt; phương án sát hình thức hơn được ghi ở chú thích.
- source_word: שְׁמוֹת
  choice: tên
  rationale: Nghĩa trực tiếp của danh từ số nhiều; đồng thời giữ mối liên hệ với nhan đề Hê-bơ-rơ của sách.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Ít-ra-ên
  rationale: Cụm từ chỉ chính các con trai nam của Ít-ra-ên/Gia-cốp trong danh sách tiếp theo, nên “con trai” chính xác hơn cách gọi rộng là “con cháu” hay “con cái”.
- source_word: הַבָּאִים מִצְרָיְמָה
  choice: đã ... đến Ai Cập
  rationale: Phân từ xác định nhóm người bằng sự kiện họ đến Ai Cập; hậu tố chỉ hướng trong מִצְרָיְמָה được chuyển tự nhiên bằng “đến Ai Cập”.
- source_word: אֵת יַעֲקֹב
  choice: cùng Gia-cốp
  rationale: אֵת ở đây biểu thị sự đi cùng, không phải dấu hiệu của tân ngữ trực tiếp.
- source_word: אִישׁ וּבֵיתוֹ
  choice: mỗi người cùng với gia đình mình
  rationale: אִישׁ có nghĩa phân phối là “mỗi người”; בַּיִת trong ngữ cảnh này chỉ cả hộ gia đình, không chỉ một ngôi nhà.
- source_word: בָּאוּ
  choice: đã ... đến
  rationale: Động từ cuối câu hoàn tất ý “đến”; tiếng Việt gộp nó với phân từ הַבָּאִים thành một mệnh đề quan hệ để tránh lặp vụng mà vẫn truyền đạt đầy đủ hành động.
theological_decisions: []
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Các tên riêng theo dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt. Cấu trúc cuối câu được làm gọn theo cú pháp tự nhiên của tiếng Việt, trong khi ý phân phối và việc mỗi người đi cùng cả gia đình vẫn được giữ rõ.
