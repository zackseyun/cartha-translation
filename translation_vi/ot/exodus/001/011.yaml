source:
  edition: WLC
  text: וַ/יָּשִׂ֤ימוּ עָלָי/ו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖/וֹ בְּ/סִבְלֹתָ֑/ם וַ/יִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְ/פַרְעֹ֔ה אֶת פִּתֹ֖ם וְ/אֶת רַעַמְסֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: vi
  text: Vì thế, người Ai Cập đặt các viên cai dịch trên dân Israel để áp bức dân ấy bằng những gánh nặng lao dịch.[a] Dân Israel xây cho Pha-ra-ôn các thành dự trữ:[b] Phi-thôm và Ra-am-sết.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng các hình thức số ít (“trên người ấy”, “áp bức người ấy”, “người ấy xây”) để chỉ chung toàn dân Israel.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “các thành kho” hoặc “các thành chứa vật tư”.
    reason: lexical_alternative
  - marker: c
    text: Tên Ra-am-sết cũng có thể được phiên âm là Raamses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: đặt
  rationale: Động từ שׂים ở đây diễn tả việc đặt hoặc bổ nhiệm những người có thẩm quyền trên dân Israel; “đặt” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: עָלָיו
  choice: trên dân Israel
  rationale: Hậu tố Hê-bơ-rơ ở số ít giống đực nhưng chỉ Israel như một tập thể. Tiếng Việt có thể giữ sắc thái tập thể bằng danh từ “dân Israel” mà không dùng một đại từ số ít thiếu tự nhiên.
- source_word: שָׂרֵי מִסִּים
  choice: các viên cai dịch
  rationale: Cụm từ chỉ những quan chức phụ trách lao dịch cưỡng bức. “Cai dịch” diễn đạt rõ cả quyền giám sát lẫn bối cảnh bắt dân lao động.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: để áp bức dân ấy
  rationale: Động từ ענה ở thể piel có thể mang nghĩa làm khổ, áp bức hoặc hạ nhục; “áp bức” phù hợp trực tiếp với chính sách lao dịch trong ngữ cảnh.
- source_word: בְּסִבְלֹתָם
  choice: bằng lao dịch nặng nhọc
  rationale: Danh từ סִבְלֹת có thể chỉ gánh nặng hoặc công việc mang vác cưỡng bức. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ ý về lao động bị áp đặt.
- source_word: וַיִּבֶן
  choice: Dân Israel phải xây
  rationale: Động từ Hê-bơ-rơ ở ngôi thứ ba số ít, với Israel được nhìn như một tập thể. Dùng lại “Dân Israel” bảo toàn cách quy chiếu tập thể; “phải” làm rõ tính cưỡng bức vốn có trong mạch văn và trong cơ cấu cai dịch.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: các thành kho tàng
  rationale: Cụm từ chỉ các thành dùng làm nơi tích trữ lương thực, vật tư hoặc quân nhu. “Thành kho tàng” ngắn gọn, trang trọng và gần cấu trúc nguyên ngữ.
- source_word: לְפַרְעֹה
  choice: cho Pha-ra-ôn
  rationale: Giữ tước hiệu của vua Ai Cập theo hình thức phiên âm quen thuộc trong tiếng Việt.
- source_word: פִּתֹם
  choice: Phi-thôm
  rationale: Phiên âm địa danh theo cách đọc rõ ràng, phù hợp tiếng Việt.
- source_word: רַעַמְסֵס
  choice: Ra-am-sết
  rationale: Phiên âm gần các phụ âm và nguyên âm của dạng Hê-bơ-rơ; ghi chú thêm dạng quen dùng khác.
theological_decisions:
- issue: Israel được diễn đạt bằng hình thức số ít tập thể
  choice: Dùng “dân Israel/dân ấy” làm danh từ tập thể
  alternative: Đổi hoàn toàn sang đại từ số nhiều “họ”
  rationale: Nguyên văn dùng hậu tố và động từ số ít để nói về Israel như một dân tộc thống nhất. Tiếng Việt có thể giữ nét này tự nhiên bằng danh từ tập thể, không cần tạo ra đại từ số ít giống đực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng được phiên âm có dấu nối. Bản dịch tránh đại từ giống đực không tự nhiên trong tiếng Việt, đồng thời giữ cách nhìn Israel như một tập thể bằng “dân Israel/dân ấy”.
