source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: vi
  text: Ta sẽ sai một thiên sứ đi trước ngươi[a], và Ta sẽ đuổi dân Ca-na-an, dân A-mô-rít, dân Hê-tít, dân Phê-rê-xít, dân Hê-vít và dân Giê-bu-sít.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một sứ giả”. Từ Hê-bơ-rơ מַלְאָךְ có thể chỉ sứ giả thuộc thiên giới hoặc loài người; trong bối cảnh này, “thiên sứ” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Ta sẽ sai
  rationale: Dạng động từ hoàn thành Qal có liên từ trong lời phán này mang ý nghĩa tương lai. “Sẽ sai” diễn đạt tự nhiên lời hứa và mệnh lệnh ủy phái của Đức Chúa Trời.
- source_word: לְפָנֶיךָ
  choice: đi trước ngươi
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa là ở phía trước hoặc đi trước một người. Thêm “đi” làm rõ hướng chuyển động trong tiếng Việt mà không thay đổi ý nghĩa.
- source_word: מַלְאָךְ
  choice: một thiên sứ
  rationale: Danh từ này có thể chỉ sứ giả loài người hoặc thiên sứ. Trong bối cảnh dẫn đường nơi hoang mạc, “thiên sứ” phù hợp hơn, còn khả năng “sứ giả” được giữ trong chú thích.
- source_word: וְגֵרַשְׁתִּי
  choice: và Ta sẽ đuổi
  rationale: Động từ גּרשׁ diễn tả việc xua đuổi hoặc trục xuất cư dân. “Đuổi” rõ ràng, trực tiếp và tự nhiên trong tiếng Việt.
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: dân Ca-na-an ... dân Giê-bu-sít
  rationale: Các danh xưng dân tộc ở dạng số ít có mạo từ nhưng được dùng theo nghĩa tập thể. Cấu trúc “dân + tên dân tộc” truyền đạt tự nhiên nghĩa tập thể trong tiếng Việt và giữ trọn danh sách sáu dân.
theological_decisions:
- issue: Danh tính của מַלְאָךְ trong câu này
  choice: Dịch chung là “một thiên sứ”, không đồng nhất vị này với Thiên Sứ của Đức Giê-hô-va hay xác định là một thiên sứ thọ tạo.
  alternative: “một sứ giả” hoặc “vị thiên sứ”
  rationale: Bản thân câu này không xác định thêm danh tính của מַלְאָךְ. Cách dịch và chú thích giữ nguyên độ mở của từ ngữ, tránh đưa một kết luận thần học không được câu văn nói rõ.
translation_notes:
  register: Dùng lối xưng hô “Ta—ngươi” trang trọng, quen thuộc trong lời phán trực tiếp của Đức Chúa Trời nhưng vẫn dễ hiểu. Tên các dân được phiên âm nhất quán; “dân” thể hiện nghĩa tập thể của danh từ số ít Hê-bơ-rơ. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
