source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: vi
  text: Mỗi khi Môi-se vào trong lều, trụ mây hạ xuống, đứng tại cửa lều, và Ngài phán với Môi-se.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn không nêu chủ ngữ của động từ “phán”; theo ngữ cảnh, có thể nói rõ: “Đức Giê-hô-va phán với Môi-se.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: Mỗi khi ... vào
  rationale: Cấu trúc này mở đầu một hoàn cảnh thường xuyên lặp lại trong lời thuật; “Mỗi khi” diễn đạt tự nhiên sắc thái tập quán.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt Kinh Thánh, có dấu nối để dễ đọc.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: trong lều / cửa lều
  rationale: Nguyên văn chỉ nói “lều”, không dùng danh xưng đầy đủ “Lều Hội Kiến”; “vào trong lều” thể hiện hậu tố chỉ hướng ở lần xuất hiện đầu.
- source_word: יֵרֵד
  choice: hạ xuống
  rationale: Diễn tả chuyển động từ trên xuống; trong mạch “Mỗi khi”, động từ mang nghĩa hành động lặp lại mà tiếng Việt không cần thêm trợ động từ.
- source_word: עַמּוּד הֶעָנָן
  choice: trụ mây
  rationale: Cách diễn đạt ngắn gọn, tự nhiên và giữ nguyên hình ảnh cụ thể của cụm danh từ Hê-bơ-rơ.
- source_word: וְעָמַד
  choice: đứng
  rationale: Tiếp nối chuỗi hành động theo thói quen; “đứng” giữ sát hình ảnh nhân hóa/spatial của nguyên văn.
- source_word: פֶּתַח הָאֹהֶל
  choice: tại cửa lều
  rationale: “Cửa lều” là cách nói tự nhiên trong tiếng Việt cho chỗ mở/lối vào của lều; “tại” biểu thị vị trí.
- source_word: וְדִבֶּר
  choice: và Ngài phán
  rationale: Động từ giống đực số ít không nêu chủ ngữ; đại từ “Ngài” vẫn để chủ thể được nhận ra theo ngữ cảnh, đồng thời “phán” phù hợp với lời nói của Đức Chúa Trời. Chú thích ghi rõ nguyên văn để ngỏ chủ ngữ.
- source_word: עִם מֹשֶׁה
  choice: với Môi-se
  rationale: Giữ nghĩa thông thường của עִם là “với”, thể hiện sự giao tiếp trực tiếp thay vì chỉ một chiều.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của וְדִבֶּר (“và ... phán”)
  choice: Dùng “Ngài”, để ngữ cảnh xác định đối tượng quy chiếu, kèm chú thích về việc nguyên văn không nêu chủ ngữ.
  alternative: Nói rõ “Đức Giê-hô-va phán với Môi-se”; hoặc dịch “nó nói” và quy chủ ngữ về trụ mây.
  rationale: Ngữ cảnh xác định Đức Giê-hô-va là Đấng phán, nhưng mệnh đề Hê-bơ-rơ không nêu danh Ngài. Đại từ kính trọng vừa cho câu tiếng Việt rõ và tự nhiên, vừa không đưa danh xưng không hiện diện vào chính văn; chú thích bảo tồn nét hàm ẩn và khả năng diễn đạt minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Mỗi khi” để thể hiện hành động lặp lại; giữ từ “lều” viết thường vì câu Hê-bơ-rơ không dùng danh xưng đầy đủ. Đại từ “Ngài” được viết hoa theo lối kính trọng, nhưng chú thích vẫn bảo tồn việc chủ ngữ không được nêu rõ trong nguyên văn.
