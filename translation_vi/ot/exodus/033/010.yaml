  text: וְ/רָאָ֤ה כָל הָ/עָם֙ אֶת עַמּ֣וּד הֶֽ/עָנָ֔ן עֹמֵ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/קָ֤ם כָּל הָ/עָם֙ וְ/הִֽשְׁתַּחֲוּ֔וּ אִ֖ישׁ פֶּ֥תַח אָהֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: vi
  text: Khi toàn dân thấy trụ mây đứng ở cửa Lều, toàn dân đều đứng dậy và thờ lạy, mỗi người ở cửa lều mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cúi xuống” hoặc “phủ phục.” Động từ Hê-bơ-rơ chỉ một hành động hạ mình bằng thân thể để bày tỏ lòng tôn kính và thường mang ý nghĩa thờ phượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Khi ... thấy
  rationale: Dạng waw nối tiếp thúc đẩy mạch kể; kết cấu “Khi ... thấy” diễn đạt tự nhiên quan hệ thời gian với các hành động tiếp theo.
- source_word: כָל הָעָם
  choice: toàn dân
  rationale: Diễn đạt tập thể cộng đồng dân chúng mà không thêm “Y-sơ-ra-ên,” vốn không có trong câu này.
- source_word: עַמּוּד הֶעָנָן
  choice: trụ mây
  rationale: Giữ hình ảnh cụ thể của dấu hiệu hữu hình về sự hiện diện của Đức Chúa Trời, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: עֹמֵד
  choice: đứng
  rationale: Phân từ mô tả vị trí của trụ mây; “đứng” là tương đương trực tiếp và rõ ràng.
- source_word: פֶּתַח הָאֹהֶל
  choice: tại cửa Lều
  rationale: פֶּתַח chỉ cửa hoặc lối vào. Ngữ cảnh xác định đây là chiếc Lều đã được nhắc đến; viết hoa “Lều” giúp phân biệt với lều riêng của mỗi người mà không triển khai thành “Lều Hội Kiến,” cụm từ không có đầy đủ trong câu.
- source_word: וְקָם
  choice: đứng dậy
  rationale: Diễn tả việc dân chúng đứng lên để đáp lại điều họ thấy; cách nói hiện đại, rõ và trang trọng.
- source_word: וְהִשְׁתַּחֲווּ
  choice: sấp mình thờ phượng
  rationale: Kết hợp tư thế thân thể với ý nghĩa tôn kính trong ngữ cảnh hướng về sự hiện diện của Đức Chúa Trời, tránh làm mất một trong hai sắc thái.
- source_word: אִישׁ
  choice: mỗi người
  rationale: Diễn đạt đúng chức năng phân phối của danh từ số ít trong tiếng Hê-bơ-rơ; tiếng Việt không cần đánh dấu giống ở đây và “mỗi người” bao quát tự nhiên từng cá nhân trong toàn dân.
- source_word: פֶּתַח אָהֳלוֹ
  choice: tại cửa lều mình
  rationale: 'Giữ sự lặp lại của hình ảnh “cửa” và cấu trúc phân phối: từng người hành lễ tại cửa lều riêng.'
theological_decisions:
- issue: Cách diễn đạt phản ứng của dân trước dấu hiệu hữu hình về sự hiện diện của Đức Chúa Trời
  choice: sấp mình thờ phượng
  alternative: cúi xuống; phủ phục
  rationale: Động từ Hê-bơ-rơ vừa chỉ hành động hạ mình bằng thân thể vừa thường mang chức năng thờ phượng. Trong ngữ cảnh này, cụm từ được chọn giữ cả tư thế và ý nghĩa tôn giáo, không buộc người đọc phải chọn chỉ một sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lều” được viết hoa để chỉ chiếc Lều trong ngữ cảnh, đối lập với “lều mình” của từng người. Câu giữ nhịp kể và sự lặp lại có chủ ý của nguyên văn.
