revisions:
- from: Khi dân chúng nghe lời chẳng lành ấy[a], họ để tang, và không một ai đeo đồ trang sức của mình[b].
  to: Khi dân chúng nghe lời chẳng lành ấy[a], họ than khóc, và không một ai đeo đồ trang sức của mình[b].
  rationale: Chỉnh cách dịch động từ than mourn để tránh sắc thái tang chế sau một cái chết mà “để tang” có thể gợi ra trong tiếng Việt. Chỉnh nhẹ chú thích a cho tự nhiên hơn, không thay đổi nghĩa hay mức độ mơ hồ của nguyên ngữ.
