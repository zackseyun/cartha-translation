  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: vi
  text: Khi dân chúng nghe lời chẳng lành ấy[a], họ than khóc, và không một ai đeo đồ trang sức của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tin dữ ấy”, “lời dữ ấy” hoặc “việc chẳng lành ấy”. Từ Hê-bơ-rơ có nghĩa rộng là “lời” hoặc “việc”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đồ tô điểm của mình”. Từ Hê-bơ-rơ chỉ chung những vật dùng để trang sức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: dân chúng nghe
  rationale: Động từ số ít đi với danh từ tập hợp הָעָם; tiếng Việt tự nhiên diễn đạt chủ thể tập thể là “dân chúng”.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: lời chẳng lành ấy
  rationale: Giữ nghĩa cơ bản “lời/việc” của דָּבָר và sắc thái bất lợi, đau buồn của רָע trong ngữ cảnh lời tuyên bố vừa được ban ra, thay vì chuyển hẳn thành “tin dữ”.
- source_word: וַיִּתְאַבָּלוּ
  choice: họ để tang
  rationale: Dạng hitpael của אבל chỉ việc bước vào trạng thái và biểu hiện tang chế; “để tang” giữ được cả phương diện cảm xúc lẫn tập tục.
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: không một ai đeo
  rationale: אִישׁ có nghĩa phân phối, nhấn mạnh từng người; trong ngữ cảnh đồ trang sức, “đeo” tự nhiên hơn cách dịch sát “đặt lên mình”.
- source_word: עֶדְיוֹ עָלָיו
  choice: đồ trang sức của mình
  rationale: עֲדִי chỉ rộng các vật dùng để tô điểm, không chỉ riêng nữ trang; hậu tố số ít được hiểu theo nghĩa phân phối đối với từng người.
