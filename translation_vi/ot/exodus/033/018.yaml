translation:
  language: vi
  text: 'Rồi ông thưa: “Xin Ngài cho con thấy vinh quang của Ngài.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin Ngài cho con thấy vẻ huy hoàng của Ngài.” Động từ Hê-bơ-rơ theo nghĩa sát là “khiến con thấy,” còn từ được dịch là “vinh quang” cũng có thể chỉ vẻ huy hoàng được biểu lộ hoặc danh dự.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Rồi ông thưa
  rationale: Dạng tự sự với waw tiếp diễn đưa câu chuyện tiến tới bước kế tiếp. “Rồi” diễn đạt tự nhiên sắc thái nối tiếp; “thưa” phù hợp với lời của Môi-se hướng lên Đức Chúa Trời mà không thêm nội dung vào nguyên văn.
- source_word: הַרְאֵנִי
  choice: cho con thấy
  rationale: Động từ ראה ở thể Hiphil mệnh lệnh với hậu tố ngôi thứ nhất số ít có nghĩa sát là “khiến tôi thấy.” Trong tiếng Việt, “cho con thấy” diễn đạt tự nhiên lời xin trực tiếp đối tượng bày tỏ điều muốn được thấy.
- source_word: נָא
  choice: Xin
  rationale: Tiểu từ נָא đánh dấu lời khẩn cầu hoặc thái độ lễ phép. “Xin” là cách tương đương rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: אֶת
  choice: '[dấu hiệu tân ngữ trực tiếp, không dịch riêng]'
  rationale: אֶת đánh dấu tân ngữ trực tiếp xác định và không cần một từ tương ứng riêng trong tiếng Việt.
- source_word: כְּבֹדֶךָ
  choice: vinh quang của Ngài
  rationale: כָּבוֹד có thể chỉ vinh quang, danh dự hoặc vẻ huy hoàng được biểu lộ. Trong lời cầu xin này, “vinh quang” giữ được bề rộng ý nghĩa tốt hơn “vẻ huy hoàng,” vốn nghiêng nhiều hơn về phương diện hữu hình.
theological_decisions:
- issue: Ý nghĩa của “vinh quang của Ngài” trong lời cầu xin của Môi-se
  choice: 'Giữ cách diễn đạt rộng: “vinh quang của Ngài”'
  alternative: “vẻ huy hoàng của Ngài” hoặc “sự hiện diện trọn vẹn của Ngài”
  rationale: Nguyên văn không xác định rõ Môi-se xin thấy ánh sáng hữu hình, uy nghi thần thượng hay sự biểu lộ hiện diện của Đức Chúa Trời. “Vinh quang” bảo toàn sự rộng nghĩa và sức căng thần học của כָּבוֹד mà không giải thích quá mức.
- issue: Đại từ trong lời Môi-se nói với Đức Chúa Trời
  choice: “con” và “Ngài”
  alternative: “tôi” và “Ngài”
  rationale: Tiếng Việt cần biểu thị quan hệ xưng hô dù tiếng Hê-bơ-rơ chỉ đánh dấu ngôi. “Con/Ngài” là lối nói tự nhiên, trang trọng khi một người thưa với Đức Chúa Trời; lựa chọn này thể hiện sắc thái kính trọng chứ không xác định thêm bản chất thần học của mối quan hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” cùng cặp xưng hô “con/Ngài” giữ sắc thái kính cẩn; câu ngắn gọn, không thêm tên người nói vốn không xuất hiện trong chính câu Hê-bơ-rơ.
