source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: vi
  text: 'Ngài phán: “Chính Ta sẽ khiến tất cả sự tốt lành của Ta đi qua trước mặt con, và Ta sẽ công bố danh của Yahweh trước mặt con. Ta sẽ ban ân cho ai Ta sẽ ban ân, và Ta sẽ thương xót ai Ta sẽ thương xót.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַעֲבִיר
  choice: sẽ khiến ... đi qua
  rationale: Dạng Hiphil của עבר mang ý nghĩa tác động khiến sự việc xảy ra; cách dịch này giữ sắc thái nguyên nhân mà vẫn tự nhiên trong tiếng Việt.
- source_word: כָּל טוּבִי
  choice: tất cả sự tốt lành của Ta
  rationale: טוּב ở đây chỉ sự tốt lành và phẩm tính thiện hảo được bày tỏ của Đức Chúa Trời; không thu hẹp nghĩa vào vẻ đẹp hay của cải.
- source_word: עַל־פָּנֶיךָ
  choice: trước mặt con
  rationale: Diễn đạt tự nhiên thành ngữ không gian Hê-bơ-rơ, đồng thời giữ ý về sự hiện diện được bày tỏ trước Môi-se.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: Ta sẽ công bố danh Yahweh
  rationale: Trong ngữ cảnh này, קרא בשם nói đến việc tuyên xưng hay công bố danh và bản tính của Đức Chúa Trời, chứ không phải cầu khẩn danh ấy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, phân biệt với một tước hiệu và phản ánh trực tiếp Tứ Tự Danh trong bản Hê-bơ-rơ.
- source_word: לְפָנֶיךָ
  choice: trước mặt con
  rationale: Giữ nét cụ thể và sự lặp lại của cách diễn đạt chỉ sự hiện diện trước Môi-se.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: Ta sẽ ban ân cho ai Ta muốn ban ân
  rationale: Lặp lại “ban ân” để phản ánh phép lặp cùng gốc từ trong tiếng Hê-bơ-rơ; “muốn” chuyển tải tính tự quyết của cấu trúc mà không thêm đối tượng hay điều kiện.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: Ta sẽ thương xót ai Ta muốn thương xót
  rationale: רחם có thể chỉ lòng thương xót hoặc lòng trắc ẩn; “thương xót” tự nhiên, trang trọng và cho phép giữ phép lặp nhấn mạnh của nguyên văn.
- source_word: אֲנִי
  choice: Chính Ta
  rationale: Đại từ được nêu tường minh tạo nhấn mạnh bên cạnh động từ đã mang ngôi; “Chính Ta” giữ sự nhấn mạnh nhưng không biến thành ý loại trừ “chỉ một mình Ta”.
theological_decisions:
- issue: Lời tự tuyên bố của Đức Chúa Trời về việc ban ân và thương xót
  choice: 'Giữ nguyên hai công thức ngôi thứ nhất có tính lặp lại: “Ta sẽ ban ân... Ta sẽ thương xót...”'
  alternative: Diễn giải thành một nguyên tắc chung về lòng nhân từ, hoặc dùng ngôn ngữ mang tính hệ thống để xác định trước một lập trường về quyền tể trị và sự tuyển chọn.
  rationale: Nguyên văn nhấn mạnh quyền tự do của Đức Chúa Trời trong việc ban ân và thương xót nhưng không giải thích sâu hơn mối quan hệ giữa điều đó với trách nhiệm con người; bản dịch giữ nguyên sức căng thần học ấy.
- issue: Sắc thái của אֲשֶׁר trong hai mệnh đề lặp
  choice: Dịch “ai Ta muốn...”
  alternative: Dịch sát hình thức “ai Ta sẽ...” hoặc “ai Ta ban ân/thương xót...”
  rationale: Trong tiếng Việt, “ai Ta muốn...” diễn đạt tự nhiên sắc thái tự quyết thường được nhận thấy trong công thức này. Tuy vậy, không thêm các khái niệm như tiền định hay công trạng mà nguyên văn không phát biểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời dẫn và cặp xưng hô “Ta–con” trong lời Đức Chúa Trời nói với Môi-se. Giữ cấu trúc song hành và phép lặp của nguyên văn; không cần chú thích vì không có biến thể nào thiết yếu để hiểu câu.
