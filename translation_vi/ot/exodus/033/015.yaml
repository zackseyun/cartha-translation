  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: vi
  text: 'Môi-se thưa với Ngài: “Nếu chính Ngài[a] không đi cùng chúng con, xin đừng đưa chúng con lên khỏi đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “mặt Ngài.” Trong tiếng Hê-bơ-rơ, “mặt” ở đây thường chỉ sự hiện diện đích thân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Môi-se thưa với Ngài
  rationale: Chủ thể được xác định từ văn cảnh là Môi-se, còn đối tượng là Đức Chúa Trời. “Thưa với Ngài” diễn đạt lời nói hướng đến Đấng đáng kính bằng tiếng Việt tự nhiên; waw nối tiếp tiếp tục diễn tiến câu chuyện mà không nhất thiết phải dịch riêng là “rồi”.
- source_word: אִם אֵין
  choice: Nếu ... không
  rationale: Diễn đạt điều kiện thực cùng ý phủ định hiện hữu bằng cấu trúc tiếng Việt tự nhiên.
- source_word: פָּנֶיךָ
  choice: chính Ngài
  rationale: Nghĩa đen là “mặt Ngài”, nhưng trong ngữ cảnh đây là thành ngữ chỉ sự hiện diện đích thân của Đức Chúa Trời. “Chính Ngài” giữ nổi bật tính đích thân và phù hợp tự nhiên với động từ “đi cùng”.
- source_word: הֹלְכִים
  choice: đi cùng
  rationale: Phân từ diễn tả hành động đồng hành đang được xét đến. “Đi cùng” làm rõ ý Đức Chúa Trời đồng hành với dân mà không thêm một đích đến không có trong câu.
- source_word: אַל תַּעֲלֵנוּ
  choice: xin đừng đưa chúng con lên
  rationale: Thể Hiphil của עלה mang nghĩa khiến đi lên hoặc đưa lên. “Xin đừng” phù hợp với lời khẩn cầu trang trọng hơn là một mệnh lệnh trống không.
- source_word: מִזֶּה
  choice: khỏi đây
  rationale: Diễn đạt tự nhiên địa điểm hiện tại mà đoàn dân sẽ rời đi; “khỏi đây” kết hợp thuận với “đưa ... lên”.
theological_decisions:
- issue: Cách chuyển ngữ פָּנֶיךָ khi nói về Đức Chúa Trời
  choice: chính Ngài
  alternative: sự hiện diện của Ngài; mặt Ngài
  rationale: Tiếng Hê-bơ-rơ dùng hình ảnh “mặt” để chỉ sự hiện diện đích thân. “Chính Ngài” tránh biến sự hiện diện thành một khái niệm trừu tượng và bảo toàn điểm nhấn của Môi-se rằng ông không muốn đi nếu Đức Chúa Trời không đích thân đồng hành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa”, “Ngài”, “xin” và “chúng con” để phản ánh lời Môi-se kính cẩn nói với Đức Chúa Trời. Không dùng chú thích vì bản dịch “chính Ngài” truyền đạt trực tiếp thành ngữ; không có dấu chú thích nào cần đặt trong chính văn.
