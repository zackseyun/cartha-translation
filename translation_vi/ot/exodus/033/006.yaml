base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/006.yaml
  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: vi
  text: Vì thế, con dân Y-sơ-ra-ên tháo bỏ đồ trang sức của mình từ núi Hô-rếp trở đi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con dân Y-sơ-ra-ên tháo bỏ đồ trang sức của mình tại núi Hô-rếp.” Cụm từ Hê-bơ-rơ có thể chỉ địa điểm, hoặc chỉ thời điểm bắt đầu từ đó họ không còn đeo đồ trang sức nữa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: tháo bỏ
  rationale: Dạng hitpael của נצל ở đây diễn tả việc chủ thể tự gỡ bỏ vật trang sức đang mang; “tháo bỏ” tự nhiên trong tiếng Việt và vẫn thể hiện hành động có chủ ý.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cách nói này vừa phản ánh thành ngữ Hê-bơ-rơ “các con trai của Y-sơ-ra-ên”, vừa tự nhiên và bao quát cộng đồng Israel trong tiếng Việt hiện đại.
- source_word: עֶדְיָם
  choice: đồ trang sức của mình
  rationale: עֲדִי chỉ những vật dùng để tô điểm, trang sức; cách dịch này giữ nghĩa rộng mà không xác định chất liệu hay loại vật cụ thể.
- source_word: מֵהַר חוֹרֵב
  choice: từ núi Hô-rếp trở đi
  rationale: Giới từ מִן có thể đánh dấu điểm khởi đầu của tình trạng không còn đeo đồ trang sức; cách dịch chính thể hiện cách hiểu này nhưng chú thích vẫn bảo lưu khả năng chỉ địa điểm.
theological_decisions:
- issue: Phạm vi thời gian hay địa điểm của מֵהַר חוֹרֵב
  choice: từ núi Hô-rếp trở đi
  alternative: tại núi Hô-rếp
  rationale: Ngữ pháp Hê-bơ-rơ cho phép hiểu cụm từ là điểm khởi đầu từ đó dân Israel không còn mang trang sức, hoặc là nơi họ tháo trang sức. Bản chính chọn cách hiểu thứ nhất theo mạch văn, nhưng không loại bỏ cách hiểu thứ hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Con dân Y-sơ-ra-ên” tránh lối dịch quá sát “các con trai” nhưng vẫn giữ sắc thái tên gọi cộng đồng; “Hô-rếp” theo dạng phiên âm Kinh Thánh quen thuộc.
