source:
  edition: WLC
  text: אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ כִּי֩ לֹ֨א אֶֽעֱלֶ֜ה בְּ/קִרְבְּ/ךָ֗ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ אַ֔תָּה פֶּן אֲכֶלְ/ךָ֖ בַּ/דָּֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: vi
  text: đến một vùng đất tuôn chảy sữa và mật ong. Vì Ta sẽ không đi lên giữa các ngươi[a], bởi các ngươi là một dân cứng cổ, kẻo Ta tiêu diệt các ngươi[b] dọc đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở giữa các ngươi” hoặc “cùng với các ngươi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “diệt sạch các ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: đến một vùng đất
  rationale: Giữ hướng đi của אֶל và cách diễn đạt không xác định của אֶרֶץ, dù theo ngữ cảnh đây là đất đã được hứa ban.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: tuôn chảy sữa và mật
  rationale: Giữ nguyên ẩn dụ quen thuộc về sự màu mỡ, dư dật của miền đất.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: Vì Ta sẽ không đi lên
  rationale: כִּי nối lời giải thích với mệnh đề trước; “đi lên” giữ động từ עלה và cách nhìn hành trình tiến lên miền đất.
- source_word: בְּקִרְבְּךָ
  choice: ở giữa các ngươi
  rationale: Diễn đạt sự hiện diện ngay giữa cộng đồng Israel; đại từ số nhiều tự nhiên trong tiếng Việt, trong khi hậu tố số ít Hê-bơ-rơ nhìn Israel như một tập thể.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: một dân cứng cổ
  rationale: Giữ hình ảnh Hê-bơ-rơ về thái độ ngoan cố, chống lại sự dẫn dắt, thay vì làm phẳng thành “bướng bỉnh”.
- source_word: פֶּן
  choice: kẻo
  rationale: Diễn đạt ngắn gọn một hậu quả đáng sợ cần tránh.
- source_word: אֲכֶלְךָ
  choice: Ta tiêu diệt các ngươi
  rationale: Trong thể Piel, כלה có thể chỉ việc làm cho chấm dứt hoặc hủy diệt; “tiêu diệt” tự nhiên và giữ nguyên mức độ nghiêm trọng.
- source_word: בַּדָּרֶךְ
  choice: dọc đường
  rationale: Cách nói tự nhiên, chỉ thời gian và nơi chốn trong hành trình.
theological_decisions:
- issue: Lời tuyên bố về sự hiện diện của Đức Chúa Trời
  choice: Ta sẽ không đi lên ở giữa các ngươi
  alternative: Ta sẽ không cùng đi lên với các ngươi
  rationale: Bản chọn giữ sắc thái không gian của בְּקִרְבְּךָ và sự căng thẳng rằng sự hiện diện thánh khiết của Đức Chúa Trời ngay giữa một dân phản nghịch có thể đưa đến phán xét.
- issue: Mức độ nghiêm trọng của sự phán xét trong אֲכֶלְךָ
  choice: Ta tiêu diệt các ngươi
  alternative: Ta diệt sạch các ngươi
  rationale: “Tiêu diệt” thể hiện khả năng dân Israel bị làm cho chấm dứt trong hành trình mà không ấn định một phương thức phán xét cụ thể hơn nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp lời Đức Chúa Trời; “các ngươi” giúp câu tự nhiên trong tiếng Việt khi nói với toàn dân. Thành ngữ “cứng cổ” được giữ để bảo toàn hình ảnh của nguyên văn.
