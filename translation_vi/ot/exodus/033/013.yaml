  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: vi
  text: Vậy bây giờ, nếu con được ơn trước mắt Ngài, xin cho con biết các đường lối của Ngài[a], để con biết Ngài, hầu cho con được ơn trước mắt Ngài. Xin Ngài cũng lưu tâm[b] rằng dân tộc này là dân của Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng số nhiều: “các đường lối của Ngài”; cụm này có thể chỉ cách Ngài hành động hoặc đối xử.'
    reason: lexical_alternative
  - marker: b
    text: Dịch sát là “hãy xem”; trong văn cảnh, từ này có nghĩa “xin lưu ý” hoặc “xin xét đến”.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn dùng cả “dân tộc” và “dân”, nhấn mạnh rằng dân tộc này thuộc về Ngài.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Diễn đạt cả ý chuyển tiếp theo thời điểm lẫn ý suy ra từ lời cầu xin trước đó.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: con được ơn trước mắt Ngài
  rationale: Giữ hình ảnh Hê-bơ-rơ “trước mắt Ngài” và lặp lại nguyên cụm từ như trong nguyên văn; “được ơn” ở đây chỉ sự ưu ái, chấp thuận.
- source_word: נָא
  choice: xin
  rationale: Hạt từ cầu khẩn được diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: הוֹדִעֵנִי נָא אֶת־דְּרָכֶךָ
  choice: xin cho con biết các đường lối của Ngài
  rationale: Động từ dạng khiến khiến mang nghĩa “làm cho biết”; danh từ “đường lối” ở số nhiều, chỉ cách Đức Chúa Trời hành động hoặc đối xử.
- source_word: וְאֵדָעֲךָ
  choice: để con biết Ngài
  rationale: Giữ nghĩa mục đích hoặc kết quả và sắc thái nhận biết mang tính tương giao, không thu hẹp thành chỉ biết thông tin.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: hầu cho con được ơn trước mắt Ngài
  rationale: לְמַעַן nêu mục đích; giữ nguyên sự lặp lại có chủ ý của lời cầu xin.
- source_word: וּרְאֵה
  choice: Xin Ngài cũng lưu tâm
  rationale: Động từ “thấy” ở đây được dùng theo nghĩa ngữ dụng là chú ý, xét đến hoặc lưu tâm; thêm “xin” để phù hợp giọng cầu khẩn của câu.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: rằng dân tộc này là dân của Ngài
  rationale: Phân biệt גּוֹי là “dân tộc” với עַם là “dân”, nhờ đó giữ cả ngôn ngữ dân tộc lẫn mối thuộc về Đức Chúa Trời.
theological_decisions:
- issue: Sắc thái giao ước trong mệnh đề cuối
  choice: dân tộc này là dân của Ngài
  alternative: dân này là dân của Ngài
  rationale: Nguyên văn dùng hai danh từ khác nhau, גּוֹי và עַם. Bản dịch giữ sự phân biệt ấy mà không thêm một khẳng định thần học vượt quá câu Hê-bơ-rơ.
- issue: Quan hệ giữa việc biết đường lối của Đức Chúa Trời và biết chính Ngài
  choice: để con biết Ngài
  alternative: và con sẽ biết Ngài
  rationale: Cấu trúc có thể mang sắc thái mục đích hoặc kết quả. “Để” phù hợp mạch lời cầu xin nhưng không giải thích cụ thể việc “biết” theo một hệ thần học riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “con–Ngài” thể hiện lời Môi-se thưa với Đức Chúa Trời; giữ nguyên sự lặp lại của “được ơn trước mắt Ngài” và tránh thuật ngữ mang dấu ấn hệ phái.
