  to: 'Yahweh phán với Môi-se: “Hãy nói với dân Y-sơ-ra-ên rằng: ‘Các ngươi là một dân cứng cổ. Nếu Ta đi lên giữa các ngươi[a] chỉ trong một khoảnh khắc, Ta sẽ hủy diệt các ngươi. Vậy bây giờ, hãy tháo đồ trang sức khỏi mình, rồi Ta sẽ biết phải làm gì với các ngươi[b].’”'
  rationale: Điều chỉnh vị trí của “chỉ trong một khoảnh khắc” để gắn trực tiếp với việc Yahweh đi lên ở giữa dân, và sửa vị trí cùng nội dung chú thích về số ít tập thể. Những thay đổi này tăng độ trung thành với cú pháp và hình thái của tiếng Hê-bơ-rơ mà không giải quyết thay tính mở của lời phán.
