  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Hãy nói với dân Y-sơ-ra-ên rằng: ‘Các ngươi là một dân cứng cổ. Nếu Ta đi lên giữa các ngươi[a] chỉ trong một khoảnh khắc, Ta sẽ hủy diệt các ngươi. Vậy bây giờ, hãy tháo đồ trang sức khỏi mình, rồi Ta sẽ biết phải làm gì với các ngươi[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau lời xưng hô số nhiều “các ngươi”, nguyên văn dùng các hậu tố số ít, xem toàn thể Y-sơ-ra-ên như một cộng đồng duy nhất; các hậu tố này cũng xuất hiện trong các cụm “hủy diệt ngươi” và “đồ trang sức của ngươi/khỏi trên ngươi”.
    reason: source_form
  - marker: b
    text: 'Nguyên văn: “rồi Ta sẽ biết phải làm gì với ngươi”; bản dịch giữ cách nói nhân hình “Ta sẽ biết” thay vì diễn giải là “Ta sẽ quyết định”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh này, thành ngữ chỉ toàn thể cộng đồng Y-sơ-ra-ên; cách dịch này tự nhiên trong tiếng Việt hiện đại.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: một dân cứng cổ
  rationale: Giữ hình ảnh ẩn dụ Hê-bơ-rơ về sự ngoan cố và phản nghịch, đồng thời là cách nói Kinh Thánh dễ hiểu trong tiếng Việt.
- source_word: רֶגַע אֶחָד
  choice: chỉ trong khoảnh khắc
  rationale: Diễn đạt tính tức thời và ngắn ngủi của lời cảnh báo.
- source_word: אֶעֱלֶה בְקִרְבְּךָ
  choice: nếu Ta đi lên giữa các ngươi
  rationale: Giữ động từ ‘đi lên’ và ngôn ngữ về sự hiện diện ở giữa dân; câu điều kiện được làm rõ theo ngữ cảnh.
- source_word: וְכִלִּיתִיךָ
  choice: Ta sẽ tiêu diệt các ngươi
  rationale: Trong ngữ cảnh phán xét, động từ chỉ việc làm cho chấm dứt hoàn toàn; ‘tiêu diệt’ tự nhiên và rõ nghĩa hơn ‘tiêu hao’.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: hãy tháo đồ trang sức khỏi mình
  rationale: Truyền đạt hành động gỡ bỏ vật trang sức đang đeo một cách tự nhiên, không giới hạn quá hẹp vào một loại nữ trang.
- source_word: וְאֵדְעָה
  choice: rồi Ta sẽ biết
  rationale: Giữ nguyên động từ ‘biết’ và không diễn giải thành ‘quyết định’, nhờ đó bảo tồn cách diễn đạt nhân hình của nguyên văn.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: phải làm gì với các ngươi
  rationale: Giữ tính rộng mở của giới từ và không mặc nhiên giới hạn hành động sắp tới chỉ là hình phạt.
theological_decisions:
- issue: Cách nói nhân hình về sự biết của Đức Chúa Trời
  choice: rồi Ta sẽ biết phải làm gì với các ngươi
  alternative: để Ta quyết định sẽ làm gì với các ngươi
  rationale: Nguyên văn dùng động từ ‘biết’. Bản dịch giữ sự căng thẳng thần học thay vì giải thích nó theo hướng quyết định thuần túy.
- issue: Các hậu tố số ít chỉ Y-sơ-ra-ên như một tập thể
  choice: dịch bằng đại từ số nhiều ‘các ngươi’
  alternative: dịch nhất quán bằng đại từ số ít
  rationale: Tiếng Hê-bơ-rơ chuyển từ lời gọi số nhiều sang việc xem Y-sơ-ra-ên là một cộng đồng duy nhất. Tiếng Việt dùng ‘các ngươi’ để lời phán tự nhiên, còn chú thích ghi nhận nét số ít tập thể.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng ‘phán’, ‘Ta’, ‘các ngươi’ để phản ánh lời truyền phán có thẩm quyền; giữ các hình ảnh ‘cứng cổ’, ‘đi lên giữa’ và động từ ‘biết’ của nguyên văn.
