    rationale: 'Cụm רֶגַע אֶחָד đứng trước động từ “Ta sẽ đi lên” trong tiếng Hê-bơ-rơ. Đặt nó sau “đi lên giữa các ngươi” trong tiếng Việt phản ánh rõ hơn ý: nếu Yahweh hiện diện giữa họ dù chỉ một khoảnh khắc, Người sẽ hủy diệt họ.'
