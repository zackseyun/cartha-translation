  naturalness: Bản văn nhìn chung tự nhiên, trang trọng. “Này” là cách dẫn nhập hiện đại và thông dụng hơn “Kìa” trong lời phán trực tiếp, đồng thời vẫn truyền đạt הִנֵּה.
  terminology: “Đức Giê-hô-va” biểu thị danh riêng יהוה và phù hợp với cách gọi quen thuộc trong tiếng Việt. Cách viết hoa toàn bộ không cần thiết trong văn xuôi hiện đại; dùng dạng viết thường chuẩn sau chữ đầu câu/tên riêng giúp văn bản dễ đọc.
