translation:
  language: vi
  text: 'Đức Giê-hô-va phán: “Này, có một chỗ bên Ta; con hãy đứng trên tảng đá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ĐỨC GIÊ-HÔ-VA
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để thể hiện danh riêng của Đức Chúa Trời trong nguyên văn.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Giữ sắc thái chỉ dẫn, thu hút sự chú ý của từ Hê-bơ-rơ.
- source_word: מָקוֹם אִתִּי
  choice: một chỗ gần Ta
  rationale: Diễn đạt tự nhiên ý ‘một chỗ ở bên/cạnh Ta’ trong ngữ cảnh; tránh cách nói tiếng Việt thiếu tự nhiên ‘một chỗ với Ta’.
- source_word: וְנִצַּבְתָּ עַל הַצּוּר
  choice: con hãy đứng trên tảng đá
  rationale: Mệnh đề ở thể hoàn thành nối tiếp mang lực chỉ dẫn trong ngữ cảnh; ‘tảng đá’ phản ánh danh từ xác định הַצּוּר.
theological_decisions:
- issue: Cách gọi YHWH
  choice: ĐỨC GIÊ-HÔ-VA
  alternative: CHÚA
  rationale: Ưu tiên biểu thị danh riêng YHWH thay vì thay bằng tước hiệu; không nhằm áp đặt một lập trường hệ phái.
- issue: Quan hệ không gian trong אִתִּי
  choice: gần Ta
  alternative: bên Ta
  rationale: Cả hai đều khả dĩ; ‘gần Ta’ tự nhiên và giữ được ý vị trí ở sát bên Đức Chúa Trời mà không giải thích quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ lời phán trực tiếp, dùng ‘Ta/con’ phù hợp quan hệ diễn ngôn trong phân đoạn.
