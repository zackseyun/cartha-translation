source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: vi
  text: 'Rồi Môi-se thưa với Yahweh[a]: “Này, chính Ngài bảo con: ‘Hãy đưa dân này đi lên,’ nhưng Ngài chưa cho con biết Ngài sẽ sai ai đi cùng con. Thế mà Ngài đã phán: ‘Ta biết con đích danh[b], và con cũng đã được Ta ưu ái[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là cách phiên âm danh riêng יהוה (YHWH) của Đức Chúa Trời.
    reason: cultural_note
  - marker: b
    text: 'Nguyên văn: “Ta biết con bằng tên”; đây là thành ngữ diễn tả sự nhận biết và ưu ái mang tính cá nhân.'
    reason: cultural_note
  - marker: c
    text: 'Nguyên văn: “con đã tìm được ân huệ trước mắt Ta”; cũng có thể dịch: “con đã tìm được ơn trước mắt Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ nguyên chức năng của Danh YHWH trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: רְאֵה
  choice: Xin xem
  rationale: Giữ sắc thái mệnh lệnh trực tiếp của lời thỉnh cầu, đồng thời từ “xin” khiến lời Môi-se thưa với Đức Chúa Trời tự nhiên và trang trọng trong tiếng Việt.
- source_word: הַעַל אֶת הָעָם הַזֶּה
  choice: Hãy dẫn dân này đi lên
  rationale: Động từ Hiphil của עלה mang nghĩa khiến đi lên hoặc đưa lên; “dẫn ... đi lên” vừa giữ hướng chuyển động vừa hợp với vai trò của Môi-se.
- source_word: לֹא הוֹדַעְתַּנִי
  choice: Ngài chưa cho con biết
  rationale: Phản ánh nghĩa gây khiến của Hiphil ידע và diễn đạt tự nhiên trong tiếng Việt; “chưa” phù hợp với lời than phiền về điều đến lúc ấy vẫn chưa được tỏ cho biết.
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: Ngài sẽ sai ai đi cùng con
  rationale: אֲשֶׁר trong ngữ cảnh chỉ người đồng hành; cấu trúc tiếng Việt tự nhiên là “sai ai đi cùng con”.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: Ta biết đích danh con
  rationale: “Biết đích danh” giữ yếu tố “tên” của thành ngữ Hê-bơ-rơ và truyền đạt sự nhận biết mang tính cá nhân mà không diễn giải quá mức.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: con cũng được ơn trước mắt Ta
  rationale: Giữ hình ảnh “trước mắt Ta”; “được ơn” là cách diễn đạt tiếng Việt gọn, dễ hiểu cho thành ngữ tìm thấy חֵן.
- source_word: וְאַתָּה ... וְאַתָּה אָמַרְתָּ
  choice: nhưng Ngài ... Thế mà Ngài đã phán
  rationale: Làm rõ thế đối chiếu trong lời Môi-se, đồng thời giữ sự nhấn mạnh do đại từ được lặp lại trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo toàn danh giao ước mà không thay bằng tước hiệu.
- issue: Ý nghĩa của יְדַעְתִּיךָ בְשֵׁם
  choice: Giữ thành ngữ quan hệ dưới dạng “Ta biết đích danh con”
  alternative: Ta biết rõ con; Ta đã chọn riêng con
  rationale: Câu nói hàm ý sự nhận biết và ưu ái mang tính cá nhân, nhưng không nói minh nhiên về sự tuyển chọn; vì vậy không đưa cách giải nghĩa thần học mạnh hơn vào chính văn.
- issue: Sắc thái của חֵן
  choice: được ơn
  alternative: được ân huệ; được đẹp lòng
  rationale: “Được ơn” giữ được chiều sâu thần học tiềm tàng của חֵן nhưng vẫn có thể chỉ sự ưu ái trong ngữ cảnh, không đồng nhất nó với một hệ thống tín lý cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Môi-se xưng “con” và gọi Yahweh là “Ngài”; trong lời trích dẫn của Đức Chúa Trời dùng “Ta—con”. Giữ nhịp đối chiếu của lời khiếu nại bằng “nhưng” và “thế mà”, đồng thời bảo toàn các thành ngữ Hê-bơ-rơ quan trọng qua chính văn và chú thích.
