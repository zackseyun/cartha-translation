base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: vi
  text: Rồi Ta sẽ rút tay Ta ra, và con sẽ thấy lưng Ta[a], nhưng mặt Ta sẽ không được thấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phần phía sau của Ta” hoặc “điều ở phía sau Ta.” Từ Hê-bơ-rơ có thể chỉ lưng hoặc phương diện phía sau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Rồi Ta sẽ rút ... lại
  rationale: Dạng Hiphil của סור diễn tả việc dời hoặc rút đi; “rồi” nối tiếp trình tự của câu trước, còn “rút ... lại” tự nhiên trong tiếng Việt.
- source_word: כַּפִּי
  choice: tay Ta
  rationale: כַּף có thể chỉ lòng bàn tay hoặc bàn tay; “tay” tự nhiên hơn và giữ nguyên hình ảnh nhân hình về sự che chở trong câu trước.
- source_word: וְרָאִיתָ
  choice: và con sẽ thấy
  rationale: Dạng động từ nối tiếp trong ngữ cảnh tương lai diễn tả kết quả kế tiếp; cách xưng hô “Ta—con” phù hợp lời Đức Chúa Trời phán trực tiếp với Môi-se.
- source_word: אֲחֹרָי
  choice: phía sau Ta
  rationale: אחור có thể chỉ lưng, phần sau hoặc điều ở phía sau. “Phía sau Ta” giữ được độ rộng nghĩa tốt hơn “lưng Ta” mà vẫn cụ thể, tự nhiên.
- source_word: וּפָנַי
  choice: nhưng mặt Ta
  rationale: Waw được dịch theo quan hệ tương phản giữa điều Môi-se sẽ thấy và điều không được thấy; פָּנִים được giữ bằng từ cụ thể “mặt”.
- source_word: לֹא יֵרָאוּ
  choice: sẽ không được thấy
  rationale: Niphal của ראה mang nghĩa bị động “được/bị thấy”; cách dịch này giữ cấu trúc bị động của nguyên văn thay vì chuyển thành “con sẽ không thấy”.
theological_decisions:
- issue: Ngôn ngữ nhân hình về Đức Chúa Trời
  choice: Giữ các hình ảnh cụ thể “tay”, “phía sau” và “mặt”.
  alternative: Trừu tượng hóa thành “sự hiện diện”, “dấu vết” hoặc “vinh quang còn lại”.
  rationale: Nguyên văn dùng ngôn ngữ nhân hình; bản dịch không nên làm nhẹ đi hoặc giải thích siêu hình thay cho văn bản.
- issue: Chủ thể hàm ẩn của mệnh đề bị động cuối câu
  choice: Giữ “mặt Ta sẽ không được thấy”.
  alternative: Dịch chủ động “con sẽ không thấy mặt Ta”.
  rationale: Nguyên văn dùng thể Niphal bị động. Giữ thể bị động bảo tồn sắc thái rằng mặt Đức Chúa Trời không thể/không được phơi bày để thấy, mà không xác định thêm lý do.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ta” theo lối xưng hô trực tiếp của Đức Chúa Trời; dùng “con” cho Môi-se. Giữ hình ảnh cụ thể và sự mơ hồ chân thực của אֲחֹרָי.
