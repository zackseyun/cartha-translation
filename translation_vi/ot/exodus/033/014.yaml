base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: vi
  text: 'Ngài phán: “Sự hiện diện của Ta[a] sẽ đi, và Ta sẽ cho con được an nghỉ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “mặt Ta”. Thành ngữ này chỉ sự hiện diện của chính Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Ngài phán
  rationale: Dạng kể chuyện wayyiqtol của אמר mở đầu lời nói trực tiếp. “Ngài phán” tự nhiên, trang trọng trong văn cảnh Đức Chúa Trời nói với Môi-se; quan hệ nối tiếp được tiếng Việt thể hiện qua mạch văn mà không cần thêm “và”.
- source_word: פָּנַי
  choice: Sự hiện diện của Ta
  rationale: Nghĩa đen là “mặt Ta”, nhưng trong thành ngữ này chỉ chính sự hiện diện có tính cá vị của Đức Chúa Trời. Cách dịch giữ đúng ý trong tiếng Việt, còn hình ảnh nguyên ngữ được ghi ở chú thích.
- source_word: יֵלֵכוּ
  choice: sẽ đi cùng con
  rationale: Động từ mang nghĩa “sẽ đi”. Thêm “cùng con” làm rõ ý đồng hành vốn có trong văn cảnh và tạo câu tiếng Việt tự nhiên, trong khi “con” phù hợp với לָךְ số ít ở vế sau.
- source_word: וַהֲנִחֹתִי
  choice: và Ta sẽ cho con được an nghỉ
  rationale: Thể Hiphil của נוח mang nghĩa khiến cho nghỉ, ban sự nghỉ ngơi. “Cho con được an nghỉ” bảo toàn sắc thái tác động và phù hợp lời bảo đảm của Đức Chúa Trời.
- source_word: לָךְ
  choice: con
  rationale: Hậu tố đại từ ngôi thứ hai số ít chỉ Môi-se. “Con” thể hiện trực tiếp số ít và phù hợp quan hệ trong lời Đức Chúa Trời phán với ông.
theological_decisions:
- issue: Cách dịch hình ảnh nhân hình פָּנַי
  choice: Sự hiện diện của Ta
  alternative: Mặt Ta; chính Ta
  rationale: “Sự hiện diện của Ta” truyền đạt ý Đức Chúa Trời đích thân đồng hành mà không biến “sự hiện diện” thành một thực thể tách khỏi Ngài. Chú thích giữ lại hình ảnh “mặt” của tiếng Hê-bơ-rơ để độc giả nhận ra mối liên hệ chủ đề trong chương.
- issue: Đối tượng của lời hứa và sắc thái “an nghỉ”
  choice: con … được an nghỉ
  alternative: các con … được an nghỉ; Ta sẽ đưa con đến nơi an nghỉ
  rationale: לָךְ là số ít, nên bản dịch trực tiếp giữ lời phán với Môi-se là “con”. Động từ không tự nó buộc phải hiểu là đưa đến một địa điểm cụ thể, vì vậy không thêm “nơi” hay xác định loại an nghỉ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài phán” trong lời dẫn và cặp đại từ “Ta—con” trong lời trực tiếp. Không viết hoa “Sự” sau dấu mở ngoặc kép vì đây là phần tiếp nối cú pháp của câu dẫn.
