  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: vi
  text: Khi vinh quang Ta đi qua, Ta sẽ đặt con vào một khe đá[a] và lấy tay Ta che con lại cho đến khi Ta đã đi qua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khe đá.” Trong tiếng Hê-bơ-rơ, danh từ “đá” có tính xác định; tuy nhiên, tiếng Việt có thể diễn đạt cụm này tự nhiên là “một khe đá” hoặc “khe đá,” tùy cách hiểu mức độ xác định của địa điểm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: Khi ... đi qua
  rationale: Cụm וְהָיָה với בְּ và động từ nguyên mẫu diễn tả hoàn cảnh thời gian. Tiếng Việt tự nhiên nhất là “Khi ... đi qua”, không cần dịch וְהָיָה thành một mệnh đề riêng.
- source_word: כְּבֹדִי
  choice: vinh quang Ta
  rationale: Trong bối cảnh Đức Chúa Trời hiện ra, כָּבוֹד chỉ sự vinh quang được bày tỏ, chứ không đơn thuần là danh dự hay uy tín.
- source_word: וְשַׂמְתִּיךָ
  choice: Ta sẽ đặt con
  rationale: שִׂים có nghĩa là đặt hoặc để. “Đặt con” giữ được tính trực tiếp của hành động và phù hợp với văn phong trang trọng, hiện đại.
- source_word: בְּנִקְרַת הַצּוּר
  choice: vào một khe đá
  rationale: נִקְרָה là khe hoặc kẽ nứt trong đá. Với động từ “đặt”, tiếng Việt dùng “vào” tự nhiên hơn “trong”; cụm cấu tạo xác định trong tiếng Hê-bơ-rơ vẫn có thể được diễn đạt tự nhiên là “một khe đá”.
- source_word: וְשַׂכֹּתִי
  choice: Ta sẽ ... che ... lại
  rationale: סכך diễn tả hành động che phủ hoặc che chắn. “Che ... lại” giữ hình ảnh cụ thể và tự nhiên trong tiếng Việt.
- source_word: כַפִּי עָלֶיךָ
  choice: lấy tay Ta che con
  rationale: כַּף có thể chỉ lòng bàn tay, nhưng trong hình ảnh nhân dạng về Đức Chúa Trời, “tay Ta” là cách diễn đạt tự nhiên mà không cụ thể hóa quá mức; giới từ עַל được chuyển tải qua cấu trúc “che con”.
- source_word: עַד עָבְרִי
  choice: cho đến khi Ta đã đi qua
  rationale: עַד với động từ nguyên mẫu kèm hậu tố ngôi thứ nhất đánh dấu điểm kết thúc của việc che phủ. “Đã đi qua” làm rõ hành động hoàn tất trước khi sự che phủ chấm dứt.
theological_decisions:
- issue: Ngôn ngữ nhân dạng về Đức Chúa Trời (“tay Ta”)
  choice: Giữ nguyên hình ảnh cụ thể “tay Ta” trong chính văn.
  alternative: sự che chở của Ta; quyền năng Ta
  rationale: Bản Hê-bơ-rơ trực tiếp dùng hình ảnh bộ phận cơ thể. Dịch thành khái niệm trừu tượng sẽ giải thích thay vì chuyển ngữ và làm mất sức gợi của trình thuật Đức Chúa Trời hiện ra.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta–con” phản ánh lời Đức Chúa Trời trực tiếp phán với Môi-se. Giữ nguyên hình ảnh thần hiện và ngôn ngữ nhân dạng, không diễn giải theo một lập trường giáo phái.
