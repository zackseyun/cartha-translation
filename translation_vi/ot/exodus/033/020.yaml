  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: vi
  text: 'Nhưng Ngài phán: “Ngươi không thể thấy mặt Ta[a], vì không ai[b] có thể thấy Ta mà vẫn sống được.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “sự hiện diện của Ta”; tiếng Hê-bơ-rơ theo nghĩa đen là “mặt Ta”.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ này chỉ bất kỳ con người nào; lời khẳng định áp dụng cho toàn thể nhân loại.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng Ngài phán
  rationale: Liên từ וַ tiếp nối lời kể nhưng trong ngữ cảnh tạo sự tương phản với lời cầu xin của Môi-se ở câu trước; “Nhưng” diễn đạt tự nhiên sắc thái ấy. “Phán” phù hợp với lời Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: לֹא תוּכַל
  choice: ngươi không thể
  rationale: יכל chỉ khả năng, không phải sự cho phép. “Không thể” giữ đúng ý bất khả, còn “ngươi” duy trì cách xưng hô số ít trực tiếp với Môi-se.
- source_word: לִרְאֹת
  choice: thấy
  rationale: ראה ở đây chỉ sự nhìn thấy; “thấy” là cách diễn đạt hiện đại, rõ ràng và trực tiếp.
- source_word: אֶת־פָּנַי
  choice: mặt Ta
  rationale: פָּנִים có nghĩa đen là “mặt”. Giữ hình ảnh cụ thể của nguyên văn thay vì diễn giải thành khái niệm trừu tượng; khả năng hiểu là “sự hiện diện” được ghi ở chú thích.
- source_word: כִּי
  choice: vì
  rationale: כִּי dẫn vào lý do giải thích tại sao Môi-se không thể thấy mặt Đức Chúa Trời.
- source_word: לֹא יִרְאַנִי
  choice: không một người nào thấy Ta
  rationale: Thể chưa hoàn thành diễn đạt một nguyên tắc khái quát. Trong tiếng Việt, kết cấu phủ định “không một người nào thấy Ta” truyền đạt tự nhiên tính phổ quát ấy mà không biến câu thành lời cấm.
- source_word: הָאָדָם
  choice: một người nào
  rationale: הָאָדָם là danh từ số ít mang nghĩa khái quát, chỉ bất kỳ con người nào. Cách dịch này vừa giữ hình thức nói về một cá nhân vừa làm rõ phạm vi phổ quát.
- source_word: וָחָי
  choice: mà còn sống được
  rationale: 'Cụm này nêu kết quả: con người không thể thấy Đức Chúa Trời rồi tiếp tục sống. “Mà còn sống được” tự nhiên trong tiếng Việt và giữ mối liên hệ hệ quả.'
theological_decisions:
- issue: Ngôn ngữ nhân hình về Đức Chúa Trời trong cụm “mặt Ta”
  choice: Giữ “mặt Ta” trong chính văn
  alternative: sự hiện diện của Ta
  rationale: Nguyên văn dùng hình ảnh cụ thể “mặt”. Bản dịch không âm thầm giải nghĩa hình ảnh ấy thành một khái niệm thần học; nghĩa khả dĩ “sự hiện diện” được bảo tồn trong chú thích.
- issue: Phạm vi khái quát của הָאָדָם
  choice: Dịch là “không một người nào”
  alternative: loài người; con người
  rationale: Danh từ Hê-bơ-rơ ở số ít nhưng mang nghĩa đại diện cho toàn thể nhân loại. Cách dịch đã chọn tự nhiên trong tiếng Việt, không giới hạn phát biểu vào nam giới và vẫn nói về từng con người.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài phán”, “ngươi” và “Ta” để duy trì lời thoại trực tiếp có sắc thái Kinh Thánh mà không cổ hóa quá mức. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
