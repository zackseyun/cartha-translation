  rationale: Chỉnh mệnh đề giải thích cho tự nhiên hơn trong tiếng Việt và cho thấy rõ rằng việc thấy Đức Chúa Trời mà tiếp tục sống là điều không thể. Không thay đổi nghĩa, phạm vi phổ quát, cách xưng hô, hay ngôn ngữ nhân hình của nguyên văn.
