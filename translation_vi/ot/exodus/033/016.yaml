reference: Exodus 33:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: vi
  text: Vậy, nhờ đâu người ta sẽ biết rằng con và dân Ngài đã nhận được ân huệ trước mặt Ngài? Chẳng phải là nhờ Ngài đi cùng chúng con, để con và dân Ngài được phân biệt[a] khỏi mọi dân tộc trên mặt đất sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được biệt riêng” hoặc “được làm nên khác biệt.” Động từ Hê-bơ-rơ có thể chỉ việc được đánh dấu là đặc biệt hay tách biệt khỏi những người khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה ... אֵפוֹא
  choice: Vậy, nhờ đâu
  rationale: Giữ mối liên kết suy luận với câu trước và câu hỏi về phương tiện làm cho ân huệ của Đức Chúa Trời được nhận biết.
- source_word: יִוָּדַע
  choice: người ta sẽ biết
  rationale: Diễn đạt tự nhiên thể Niphal mang nghĩa bị động/phiếm chỉ trong tiếng Việt, tương đương với “sẽ được biết” nhưng dễ hiểu hơn.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ אֲנִי וְעַמֶּךָ
  choice: rằng con và dân Ngài đã được đẹp lòng Ngài
  rationale: Chuyển thành ngữ Hê-bơ-rơ “tìm được ân huệ trong mắt Ngài” sang cách nói tiếng Việt hiện đại, đồng thời giữ rõ cả Môi-se lẫn dân sự là đối tượng nhận ân huệ.
- source_word: הֲלוֹא בְּלֶכְתְּךָ עִמָּנוּ
  choice: Chẳng phải là nhờ Ngài đi cùng chúng con ... sao?
  rationale: Giữ nguyên lực của câu hỏi tu từ mong đợi sự đồng tình và ý nghĩa phương tiện của giới từ בְּ.
- source_word: וְנִפְלֵינוּ
  choice: để ... được phân biệt
  rationale: Động từ Niphal của פלא ở đây chỉ việc được đánh dấu là khác biệt hoặc đặc biệt; “được phân biệt” bảo toàn ý nghĩa mà không áp đặt cơ chế hay sắc thái giáo phái.
- source_word: מִכָּל הָעָם אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: với mọi dân tộc trên mặt đất
  rationale: “Mọi dân tộc” chuyển tải nghĩa tập hợp/phân phối của עָם trong ngữ cảnh toàn cầu; “trên mặt đất” giữ hình ảnh quen thuộc của nguyên văn.
theological_decisions:
- issue: Nền tảng cho sự khác biệt của dân Y-sơ-ra-ên
  choice: Sự hiện diện của Đức Chúa Trời—Ngài đi cùng họ—là dấu hiệu khiến Môi-se và dân Ngài khác biệt với mọi dân tộc.
  alternative: Luật pháp, đất đai hoặc căn tính sắc tộc tự thân là nền tảng chính làm họ khác biệt.
  rationale: Cấu trúc câu trực tiếp gắn việc được phân biệt với việc Đức Chúa Trời đi cùng họ; bản dịch duy trì quan hệ phương tiện-kết quả này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” khi Môi-se thưa với Đức Chúa Trời và “Ngài” để xưng hô tôn kính. Cấu trúc câu hỏi tu từ được giữ lại; tránh từ ngữ mang sắc thái hệ phái.
