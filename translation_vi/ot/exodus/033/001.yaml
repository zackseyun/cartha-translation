id: EXO.33.1
reference: Exodus 33:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se[a]: “Hãy đi lên khỏi đây, con cùng với dân mà con đã đưa lên khỏi đất Ai Cập, đến xứ mà Ta đã thề với Áp-ra-ham, với Y-sác và với Gia-cốp rằng: ‘Ta sẽ ban xứ ấy cho dòng dõi[b] của ngươi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “hạt giống”. Từ Hê-bơ-rơ ở dạng số ít nhưng mang nghĩa tập hợp, chỉ dòng dõi hoặc các hậu duệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ, ... phán
  rationale: Dạng động từ nối tiếp đưa câu chuyện tiến lên; “bấy giờ” diễn đạt tự nhiên mạch kể, còn “phán” phù hợp với lời trực tiếp trang trọng của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước YHWH thay vì thay bằng một tước hiệu, đồng thời có chú thích để người đọc nhận biết cách dịch truyền thống.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: Hãy đi lên khỏi đây
  rationale: Cụm hai mệnh lệnh được diễn đạt gọn và tự nhiên, vẫn giữ cả ý rời địa điểm hiện tại lẫn đi lên.
- source_word: אַתָּה וְהָעָם
  choice: con cùng với dân
  rationale: Giữ việc Môi-se và dân cùng là chủ thể của mệnh lệnh. “Con” tạo lối xưng hô trực tiếp, trang trọng và dễ hiểu trong lời Đức Chúa Trời nói với Môi-se.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: mà con đã đưa lên
  rationale: Thể Hiphil của עלה có nghĩa khiến hoặc đưa đi lên; cách dịch này cũng giữ liên hệ từ vựng với mệnh lệnh “đi lên” ở đầu câu.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: khỏi đất Ai Cập
  rationale: Diễn đạt tự nhiên sự ra khỏi lãnh thổ Ai Cập mà không thêm ý ngoài bản nguồn.
- source_word: אֶל הָאָרֶץ
  choice: đến xứ
  rationale: Giới từ chỉ hướng אֶל được thể hiện trực tiếp; “xứ” phù hợp với vùng đất được hứa ban.
- source_word: נִשְׁבַּעְתִּי
  choice: Ta đã thề
  rationale: Dịch trực tiếp động từ chỉ lời thề long trọng; không cần thêm trạng từ vì sắc thái trang nghiêm vốn có trong động từ.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: với Áp-ra-ham, với Y-sác và với Gia-cốp
  rationale: Lặp lại “với” để phản ánh ba giới từ trong tiếng Hê-bơ-rơ và giữ nhịp trang trọng của công thức lời thề.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Cách dẫn nội dung lời thề tự nhiên trong tiếng Việt, thay cho lối dịch máy móc “mà nói rằng”.
- source_word: לְזַרְעֲךָ
  choice: cho dòng dõi của ngươi
  rationale: “Dòng dõi” chuyển tải danh từ tập hợp số ít זֶרַע tự nhiên hơn “hạt giống”; “ngươi” giữ hình thức đại từ số ít của lời hứa được trích dẫn.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA hoặc Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu; chú thích nêu cách dịch truyền thống.
- issue: Số của đại từ trong lời hứa לְזַרְעֲךָ
  choice: dòng dõi của ngươi
  alternative: dòng dõi của các ngươi
  rationale: Hậu tố Hê-bơ-rơ ở số ít dù lời thề vừa nhắc đến ba tổ phụ. Giữ số ít bảo tồn hình thức và độ căng của bản nguồn thay vì âm thầm chuyển thành số nhiều.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Trong lời Yahweh nói trực tiếp với Môi-se, dùng “Ta–con”; bên trong lời thề cổ được trích dẫn, giữ “ngươi” để phản ánh đại từ số ít của tiếng Hê-bơ-rơ và phân biệt tầng lời nói. Các tên riêng dùng dạng quen thuộc trong tiếng Việt: Môi-se, Ai Cập, Áp-ra-ham, Y-sác, Gia-cốp.'
