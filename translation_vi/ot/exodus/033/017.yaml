    issue: «đã được ơn trước mắt Ta» không giữ rõ động từ «tìm được» của nguyên văn và hơi gượng trong tiếng Việt hiện đại.
    rationale: מָצָאתָ חֵן có nghĩa đen là «ngươi đã tìm được ân huệ/favor». Dùng «đã tìm được ân huệ trước mắt Ta» bảo toàn tác động từ vựng và vẫn phù hợp văn phong Kinh Thánh.
  - severity: low
    issue: Trật tự «điều này mà con đã nói» kém tự nhiên hơn cần thiết.
    rationale: 'Đưa từ chỉ định về sau: «điều con đã nói này» diễn đạt rõ quan hệ giữa điều được hứa thực hiện và lời Môi-se vừa thưa.'
