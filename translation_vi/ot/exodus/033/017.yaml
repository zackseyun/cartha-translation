  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה גַּ֣ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֛ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֶֽעֱשֶׂ֑ה כִּֽי מָצָ֤אתָ חֵן֙ בְּ/עֵינַ֔/י וָ/אֵדָעֲ/ךָ֖ בְּ/שֵֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Ta cũng sẽ làm điều con đã nói này[a], vì con đã tìm được ân huệ trước mắt Ta[b], và Ta biết đích danh con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “việc này,” “vấn đề này” hoặc “lời này.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “con đã tìm được ân huệ trong mắt Ta,” một thành ngữ chỉ việc được Yahweh nhìn đến với sự ưu ái.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu; cách này phản ánh trực tiếp danh יהוה trong bản Hê-bơ-rơ.
- source_word: גַּם
  choice: cũng
  rationale: 'Diễn đạt ý bổ sung: Yahweh chấp thuận thêm lời thỉnh cầu Môi-se vừa nêu trong văn mạch.'
- source_word: הַדָּבָר הַזֶּה
  choice: điều này
  rationale: דָּבָר có thể chỉ lời nói, sự việc hoặc vấn đề. “Điều này” tự nhiên trong tiếng Việt và đủ rộng để chỉ điều Môi-se vừa cầu xin.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: mà con đã nói
  rationale: Giữ rõ mối liên hệ với lời Môi-se vừa thưa, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אֶעֱשֶׂה
  choice: Ta sẽ làm
  rationale: Động từ עשה mang nghĩa thông dụng là “làm”; ở đây diễn tả lời hứa thực hiện điều đã được thỉnh cầu.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: con đã được ơn trước mắt Ta
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ và diễn đạt חֵן là sự ưu ái, ân huệ được ban cho, không áp đặt một nghĩa thần học chuyên biệt.
- source_word: וָאֵדָעֲךָ
  choice: và Ta biết con
  rationale: ידע ở đây diễn tả sự nhận biết có tính cá vị, không chỉ là biết thông tin về Môi-se.
- source_word: בְּשֵׁם
  choice: đích danh
  rationale: “Biết đích danh” là cách nói tiếng Việt tự nhiên, chuyển tải sự nhận biết riêng biệt và có tính cá nhân của בְּשֵׁם.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng và tránh thay thế bằng tước hiệu hoặc chọn một lối phiên âm gắn với truyền thống riêng.
- issue: Sắc thái của “Ta biết đích danh con”
  choice: Giữ ý nhận biết cá vị mà không diễn giải thêm
  alternative: Ta tuyển chọn con; Ta công nhận con
  rationale: Cụm וָאֵדָעֲךָ בְּשֵׁם nói đến việc Yahweh biết Môi-se cách riêng biệt, nhưng câu không tự nó xác định đầy đủ các hệ quả thần học như tuyển chọn hay công nhận; bản dịch giữ nguyên sức căng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” phù hợp với lời Đức Chúa Trời phán trực tiếp cùng Môi-se. Bản dịch giữ thành ngữ Hê-bơ-rơ “trước mắt Ta” và giải thích bằng chú thích, đồng thời dùng “đích danh” để tránh lối nói thiếu tự nhiên “biết con theo tên”.
