  text: וּ/מֹשֶׁה֩ יִקַּ֨ח אֶת הָ/אֹ֜הֶל וְ/נָֽטָה ל֣/וֹ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֗ה הַרְחֵק֙ מִן הַֽ/מַּחֲנֶ֔ה וְ/קָ֥רָא ל֖/וֹ אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֙ כָּל מְבַקֵּ֣שׁ יְהוָ֔ה יֵצֵא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֖ר מִ/ח֥וּץ לַֽ/מַּחֲנֶֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: vi
  text: Môi-se thường lấy chiếc lều[a], đem ra dựng cho mình ở ngoài trại, cách xa trại, rồi gọi đó là Lều Hội Kiến. Bất cứ ai tìm kiếm Đức Giê-hô-va đều đi ra Lều Hội Kiến ở ngoài trại.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “chiếc lều”, không nói rõ “lều của ông”. Có người hiểu đây là lều riêng của Môi-se hoặc một chiếc lều riêng được ông dùng cho mục đích này.
    reason: lexical_alternative
  - marker: b
    text: 'Các động từ Hê-bơ-rơ trong câu này rất có thể mô tả hành động thường xuyên: Môi-se thường lấy lều, đem ra dựng, và người tìm kiếm Đức Giê-hô-va thường đi ra đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: thường đem
  rationale: Dạng yiqtol trong mạch văn này có khả năng diễn tả hành động theo thói quen hoặc lặp lại, nên dịch là “thường đem” thay vì một hành động quá khứ đơn lẻ.
- source_word: הָאֹהֶל
  choice: chiếc lều
  rationale: Nguyên văn có mạo từ xác định, nghĩa là “chiếc lều”; không nói rõ đây là lều riêng của Môi-se, nên bản dịch không thêm ý đó.
- source_word: וְנָטָה לוֹ
  choice: dựng cho mình
  rationale: נטה khi đi với lều có nghĩa là dựng hoặc căng lều; לוֹ được giữ lại bằng cụm “cho mình”.
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: cách xa trại
  rationale: Giữ sự nhấn mạnh rằng lều không chỉ ở ngoài mà còn cách xa trại.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, quen thuộc và chính xác cho chiếc lều là nơi gặp gỡ đã được định.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: bất cứ ai tìm kiếm Đức Giê-hô-va
  rationale: “Tìm kiếm” giữ được cả sắc thái hướng về Đức Chúa Trời và đến cầu hỏi Ngài, không thu hẹp nghĩa.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: יֵצֵא
  choice: đều đi ra
  rationale: Trong mạch mô tả tập quán, yiqtol diễn tả điều thường xảy ra; “đều đi ra” tự nhiên trong tiếng Việt khi đi cùng “bất cứ ai”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là hình thức trang trọng và dễ nhận biết đối với độc giả tiếng Việt.
- issue: Đồng nhất chiếc lều
  choice: không xác định đó là lều riêng của Môi-se
  alternative: lều của Môi-se; một chiếc lều chuyên biệt
  rationale: Nguyên văn chỉ nói “chiếc lều” và không minh nhiên xác định chủ sở hữu hoặc nguồn gốc; bản dịch bảo tồn độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Trại” phù hợp bối cảnh dân Y-sơ-ra-ên đóng trại; “Lều Hội Kiến” được viết hoa như tên gọi của địa điểm. Hai chú thích bảo tồn sự không xác định của “chiếc lều” và sắc thái tập quán của các động từ.
