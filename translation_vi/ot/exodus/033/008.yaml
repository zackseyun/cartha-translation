source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/צֵ֤את מֹשֶׁה֙ אֶל הָ/אֹ֔הֶל יָק֨וּמוּ֙ כָּל הָ/עָ֔ם וְ/נִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אָהֳל֑/וֹ וְ/הִבִּ֨יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד בֹּא֖/וֹ הָ/אֹֽהֱלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: vi
  text: Mỗi khi Môi-se đi ra lều[a], toàn dân đều đứng dậy; mỗi người đứng tại cửa lều của mình[b] và nhìn theo Môi-se cho đến khi ông vào trong lều.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là lều hội kiến được nhắc đến trong văn cảnh chung quanh; nguyên văn ở đây chỉ nói “lều”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng dạng số ít theo nghĩa phân phối: từng người trong dân chúng đứng tại cửa lều của mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Mỗi khi
  rationale: Cấu trúc này mở đầu một hoàn cảnh thường xuyên lặp lại trong lời kể; “Mỗi khi” diễn đạt tự nhiên sắc thái tập quán.
- source_word: כְּצֵאת מֹשֶׁה אֶל הָאֹהֶל
  choice: Môi-se đi ra đến lều
  rationale: כְּ với động từ nguyên mẫu diễn tả thời điểm, còn יצא và אֶל cùng nhau chỉ chuyển động đi ra hướng đến lều.
- source_word: הָאֹהֶל
  choice: lều
  rationale: Nguyên văn chỉ dùng danh từ xác định “cái lều”; văn cảnh cho biết đây là lều hội kiến, nhưng câu này không dùng danh xưng đầy đủ.
- source_word: יָקוּמוּ וְנִצְּבוּ
  choice: đều đứng dậy; mỗi người đứng
  rationale: Các dạng động từ diễn tả hành động theo thói quen. Cách diễn đạt này phân biệt việc đứng dậy với việc đứng tại vị trí của mình và tránh lặp từ vụng về.
- source_word: אִישׁ
  choice: mỗi người
  rationale: Danh từ số ít được dùng theo nghĩa phân phối, chỉ từng thành viên trong toàn dân; tiếng Việt “mỗi người” truyền đạt chính xác chức năng ấy mà không cần áp đặt giới tính nơi ngữ cảnh tập thể.
- source_word: פֶּתַח אָהֳלוֹ
  choice: tại cửa lều mình
  rationale: פֶּתַח là chỗ mở hoặc lối vào; “cửa lều” là cách nói tự nhiên trong tiếng Việt, và “mình” giữ quan hệ sở hữu phân phối.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: và nhìn theo Môi-se
  rationale: אַחֲרֵי sau động từ nhìn diễn tả việc dõi mắt theo một người đang đi; “nhìn theo” vừa tự nhiên vừa giữ được ý hướng theo sau.
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: cho đến khi ông vào trong lều
  rationale: Động từ בוא cùng hậu tố chỉ hướng trên “lều” biểu thị chuyển động vào bên trong.
theological_decisions:
- issue: Nhận diện “lều” trong câu này
  choice: Giữ “lều” trong chính văn và giải thích bằng chú thích rằng văn cảnh nói đến lều hội kiến.
  alternative: Dịch thẳng là “Lều Hội Kiến”.
  rationale: Nguyên văn câu này chỉ có הָאֹהֶל, dù văn cảnh xác định vật quy chiếu. Giữ cách gọi ngắn bảo toàn hình thức của tiếng Hê-bơ-rơ mà vẫn giúp độc giả qua chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo lối phiên âm Kinh Thánh quen thuộc; nhịp câu làm rõ chuỗi hành động lặp lại và giữ sắc thái dõi mắt theo ông.
