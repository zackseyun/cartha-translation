id: EXO.33.11
reference: Exodus 33:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: vi
  text: Yahweh thường phán với Môi-se mặt đối mặt[a], như một người nói chuyện với bạn mình. Sau đó, Môi-se trở về trại; còn người phụ tá của ông là Giô-suê, con trai Nun, một thanh niên, thì vẫn ở lại bên trong lều[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “trực tiếp” hoặc “đích thân”. Thành ngữ Hê-bơ-rơ “mặt đối mặt” diễn tả một cuộc gặp gỡ trực tiếp khác thường.
    reason: lexical_alternative
  - marker: b
    text: Tức là Lều Hội Kiến.
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: thường phán
  rationale: Dạng động từ trong bối cảnh này diễn tả hành động lặp lại theo thông lệ. “Thường” thể hiện tính quen lệ; “phán với” là cách nói tự nhiên, trang trọng khi Yahweh nói với Môi-se.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng hình thức chuyển tự, thay vì thay bằng một tước hiệu.
- source_word: פָּנִים אֶל־פָּנִים
  choice: mặt đối mặt
  rationale: Giữ nguyên thành ngữ Hê-bơ-rơ về một cuộc giao tiếp trực tiếp và thân mật, mà không buộc câu văn phải khẳng định Môi-se nhìn thấy hình thể của Đức Chúa Trời.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: như một người nói chuyện với bạn mình
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ sắc thái giao tiếp thân tình của רֵעַ.
- source_word: וְשָׁב אֶל־הַמַּחֲנֶה
  choice: Sau đó, Môi-se trở về trại
  rationale: Nêu lại Môi-se để tránh đại từ mơ hồ trong tiếng Việt; mạch văn vẫn cho thấy đây là hành động thường diễn ra sau cuộc gặp.
- source_word: וּמְשָׁרְתוֹ
  choice: người phụ tá của ông
  rationale: Chỉ người phục vụ Môi-se trong vai trò trợ giúp; “phụ tá” tránh hàm ý người hầu trong gia đình.
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: Giô-suê, con trai Nun
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt và chuyển patronymic theo cách rõ ràng.
- source_word: נַעַר
  choice: một thanh niên
  rationale: Phản ánh nghĩa chỉ người nam còn trẻ mà không lặp lại ý phục vụ vốn đã được thể hiện bằng “người phụ tá”.
- source_word: לֹא יָמִישׁ מִתּוֹךְ הָאֹהֶל
  choice: thì vẫn ở lại bên trong lều
  rationale: Diễn đạt tự nhiên ý không rời khỏi bên trong lều; “vẫn” phù hợp với tính chất kéo dài, quen lệ của lời kể.
theological_decisions:
- issue: Ngôn ngữ nhân hình khi Yahweh nói với Môi-se “mặt đối mặt”
  choice: Giữ thành ngữ “mặt đối mặt” trong chính văn để diễn tả cuộc gặp gỡ trực tiếp và mang tính cá nhân.
  alternative: Dịch diễn ý là “trực tiếp” hoặc “đích thân”.
  rationale: Bản dịch không làm phẳng thành ngữ Hê-bơ-rơ và không tự ý giải quyết sự căng thẳng với những phân đoạn nói rằng con người không thể thấy Đức Chúa Trời.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “phán với” cho lời Yahweh nói, nhưng dùng “nói chuyện” trong phép so sánh đời thường. Đặt chú thích [b] sau “lều”, đúng với nội dung chú thích xác định đây là Lều Hội Kiến.
