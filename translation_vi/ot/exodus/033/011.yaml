  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: hành động có tính thường lệ của Yahweh nói với Môi-se; thành ngữ "mặt đối mặt"; phép so sánh với một người nói chuyện cùng bạn mình; Môi-se trở về trại; và Giô-suê, người phụ tá trẻ tuổi của Môi-se, không rời khỏi lều. Cách "vẫn ở lại bên trong lều" diễn đạt tự nhiên hệ quả của "không rời khỏi khỏi trong lều" mà không thêm ý nghĩa đáng kể.'
