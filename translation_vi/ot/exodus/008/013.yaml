id: EXO.8.13
reference: Exodus 8:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֗ן וַ/יֵּט֩ אַהֲרֹ֨ן אֶת יָד֤/וֹ בְ/מַטֵּ֨/הוּ֙ וַ/יַּךְ֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה כָּל עֲפַ֥ר הָ/אָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: vi
  text: Họ làm như vậy. A-rôn giơ tay cầm gậy, đập vào bụi đất; muỗi[a] liền xuất hiện trên người[b] và súc vật. Khắp đất Ai Cập, tất cả bụi đất đều biến thành muỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây không xác định chắc chắn một loài cụ thể; cũng có thể dịch là “chấy” hoặc “rận”.
    reason: lexical_alternative
  - marker: b
    text: “Người” ở đây là danh từ chỉ tập thể, nghĩa là con người nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Họ làm như vậy
  rationale: Chuyển ngữ tự nhiên công thức tường thuật chỉ việc thi hành mệnh lệnh vừa được ban.
- source_word: וַיֵּט אַהֲרֹן אֶת־יָדוֹ בְמַטֵּהוּ
  choice: A-rôn giơ tay cầm gậy
  rationale: Diễn đạt tự nhiên động tác đưa tay ra cùng với cây gậy, nhưng không khẳng định quá mức sắc thái công cụ của giới từ בְּ.
- source_word: וַיַּךְ אֶת־עֲפַר הָאָרֶץ
  choice: đập vào bụi đất
  rationale: נכה là đánh hoặc đập; עֲפַר הָאָרֶץ chỉ bụi của mặt đất. Cách dịch giữ hình ảnh cụ thể và mạch kể.
- source_word: הַכִּנָּם / כִנִּים
  choice: muỗi
  rationale: Tên loài côn trùng không thể xác định chắc chắn; “muỗi” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt, còn khả năng “chấy/rận” được ghi ở chú thích.
- source_word: וַתְּהִי הַכִּנָּם בָּאָדָם וּבַבְּהֵמָה
  choice: muỗi liền xuất hiện trên người và súc vật
  rationale: היה ở đây diễn tả sự xuất hiện hay phát sinh của nạn côn trùng; giới từ בְּ được diễn đạt là “trên” theo ngữ cảnh chúng bám hoặc đậu trên người và vật.
- source_word: כָּל־עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: tất cả bụi đất đều biến thành muỗi
  rationale: “Biến thành” truyền đạt rõ sắc thái kết quả của היה, đồng thời giữ nguyên hình ảnh toàn bộ bụi đất trở thành côn trùng.
- source_word: בְּכָל־אֶרֶץ מִצְרָיִם
  choice: Khắp đất Ai Cập
  rationale: “Khắp” thể hiện phạm vi phân bố toàn cõi; “đất Ai Cập” là cách nói trang trọng nhưng vẫn hiện đại.
theological_decisions:
- issue: Nghĩa tập thể của אָדָם
  choice: người
  alternative: loài người; người ta
  rationale: Trong cặp đối chiếu với בְּהֵמָה, אָדָם chỉ con người nói chung chứ không riêng nam giới. “Người” giữ được sự ngắn gọn và nghĩa bao quát; chú thích làm rõ tính tập thể.
translation_notes:
  register: Văn phong tường thuật trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Câu văn giữ sự lặp lại có chủ ý của “bụi đất” và “muỗi”, đồng thời dùng “súc vật” để phản ánh nhóm động vật nuôi trong ngữ cảnh.
