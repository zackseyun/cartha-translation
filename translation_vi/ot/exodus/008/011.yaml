  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽ/רְוָחָ֔ה וְ/הַכְבֵּד֙ אֶת לִבּ֔/וֹ וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: vi
  text: Nhưng khi Pha-ra-ôn thấy rằng đã có sự nhẹ nhõm[a], ông làm cứng lòng mình và không nghe Môi-se và A-rôn, đúng như Yahweh đã phán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã có sự tạm yên” hoặc “đã có sự giãn giảm.” Từ Hê-bơ-rơ có thể chỉ sự nhẹ bớt, sự tạm yên, hoặc sự nới lỏng áp lực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Giữ nghĩa trực tiếp của ראה, đồng thời trong ngữ cảnh tự nhiên hàm ý Pha-ra-ôn nhận thấy tình thế đã thay đổi.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: đã được nhẹ nhõm
  rationale: הָרְוָחָה chỉ sự nhẹ bớt, tạm yên hoặc có khoảng thở sau sức ép; cách diễn đạt này tự nhiên trong tiếng Việt và hợp với bối cảnh tai họa vừa giảm.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: ông làm cho lòng mình trở nên cứng cỏi
  rationale: Dạng Hiphil của כבד có nghĩa đen là làm cho nặng; với 'lòng', thành ngữ diễn tả sự ngoan cố. Cách dịch này giữ rõ Pha-ra-ôn là chủ thể chủ động mà không dùng một lối nói tiếng Việt dễ gây hiểu nhầm về cảm xúc.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: không nghe Môi-se cùng A-rôn
  rationale: שׁמע אֶל ở đây là nghe hoặc chịu nghe. Nêu rõ hai người mà đại từ số nhiều chỉ đến giúp câu tiếng Việt độc lập, dễ hiểu mà không diễn giải thành 'vâng lời'.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: đúng như Yahweh đã phán
  rationale: Diễn tả sự ứng nghiệm của lời Đức Chúa Trời đã nói trước đó; 'phán' phù hợp với văn phong Kinh Thánh trang trọng nhưng vẫn thông dụng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Chủ thể khiến lòng Pha-ra-ôn cứng cỏi
  choice: Pha-ra-ôn chủ động làm cho lòng mình trở nên cứng cỏi.
  alternative: Lòng ông tự trở nên cứng cỏi, hoặc Đức Chúa Trời ngầm khiến lòng ông cứng lại.
  rationale: Bản Hê-bơ-rơ dùng động từ chủ động gây khiến với Pha-ra-ôn làm chủ thể. Cách dịch giữ nguyên quy trách nhiệm trong câu này, đồng thời không xóa bỏ sự căng thẳng thần học với những chỗ khác nói Yahweh làm cứng lòng ông.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Pha-ra-ôn”, “Môi-se”, “A-rôn” theo dạng tên quen thuộc; giữ danh Yahweh. Cấu trúc “làm cho lòng mình trở nên cứng cỏi” ưu tiên độ chính xác về tác nhân và hình ảnh Hê-bơ-rơ.
