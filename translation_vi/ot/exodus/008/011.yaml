revisions:
- from: Nhưng khi Pha-ra-ôn thấy đã được nhẹ nhõm[a], ông làm cho lòng mình trở nên cứng cỏi và không nghe Môi-se cùng A-rôn, đúng như Yahweh đã phán.
  to: Nhưng khi Pha-ra-ôn thấy rằng đã có sự nhẹ nhõm[a], ông làm cứng lòng mình và không nghe Môi-se và A-rôn, đúng như Yahweh đã phán.
  rationale: Sửa mệnh đề chỉ sự giảm bớt tai họa thành mệnh đề tồn tại rõ ràng, để không quy tình trạng ‘nhẹ nhõm’ trực tiếp cho Pha-ra-ôn. Thay “làm cho lòng mình trở nên cứng cỏi” bằng “làm cứng lòng mình” nhằm giữ tác nhân chủ động của Pha-ra-ôn, hình ảnh Hê-bơ-rơ và ý ngoan cố trong tiếng Việt tự nhiên. Chú thích được chỉnh cho các phương án thay thế rõ và tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
