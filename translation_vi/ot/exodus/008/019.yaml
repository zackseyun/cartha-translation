  text: וְ/שַׂמְתִּ֣י פְדֻ֔ת בֵּ֥ין עַמִּ֖/י וּ/בֵ֣ין עַמֶּ֑/ךָ לְ/מָחָ֥ר יִהְיֶ֖ה הָ/אֹ֥ת הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/019.yaml
  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: vi
  text: Ta sẽ tạo nên sự phân biệt giữa dân Ta và dân ngươi.[a] Ngày mai, dấu hiệu này sẽ xảy ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự cứu chuộc” hoặc “sự giải thoát”; từ Hê-bơ-rơ này có thể mang nghĩa về hành động cứu chuộc của Đức Chúa Trời, ở đây được thể hiện qua việc Ngài phân biệt dân Y-sơ-ra-ên với dân Ai Cập.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Ta sẽ đặt
  rationale: Động từ שׂים có nghĩa cơ bản là “đặt”; kết hợp với פְדֻת và cấu trúc “giữa... và...”, cách diễn đạt này vừa gần nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: פְדֻת
  choice: sự phân biệt
  rationale: Từ này có thể chỉ sự cứu chuộc hoặc giải thoát, nhưng trong cú pháp hiện tại, nó nói đến hành động Đức Chúa Trời phân biệt dân Ngài với dân Ai Cập.
- source_word: בֵּין ... וּבֵין
  choice: giữa ... và ...
  rationale: Diễn đạt trực tiếp cấu trúc tương liên chỉ sự phân cách giữa hai nhóm.
- source_word: עַמִּי
  choice: dân ta
  rationale: Cụm sở hữu chỉ dân thuộc về Đức Chúa Trời; đại từ “ta” phù hợp lời Đức Chúa Trời phán với Pha-ra-ôn.
- source_word: עַמֶּךָ
  choice: dân ngươi
  rationale: Cụm sở hữu ngôi thứ hai số ít, chỉ dân của Pha-ra-ôn; “ngươi” giữ sắc thái trang trọng của lời phán trực tiếp.
- source_word: לְמָחָר
  choice: Ngày mai
  rationale: Trạng ngữ thời gian được đặt đầu câu như trong tiếng Hê-bơ-rơ và vẫn tự nhiên trong tiếng Việt.
- source_word: יִהְיֶה
  choice: sẽ xảy ra
  rationale: Khi chủ ngữ là “dấu này”, “sẽ xảy ra” truyền đạt tự nhiên việc dấu đã báo trước sẽ xuất hiện, thay vì dịch cứng là “sẽ có” hoặc “sẽ là”.
- source_word: הָאֹת הַזֶּה
  choice: dấu này
  rationale: אוֹת thường chỉ một dấu hiệu do Đức Chúa Trời ban hoặc thực hiện; “dấu” là cách dịch rõ ràng, gọn và phù hợp văn mạch Xuất Hành.
theological_decisions:
- issue: Nên dịch פְדֻת theo nghĩa thần học “sự cứu chuộc/giải thoát” hay theo kết quả trong văn cảnh là sự phân biệt
  choice: Dùng “sự phân biệt” trong chính văn
  alternative: sự cứu chuộc; sự giải thoát
  rationale: Cấu trúc “giữa dân ta và dân ngươi” nhấn mạnh việc Đức Chúa Trời đối xử khác biệt với Y-sơ-ra-ên và Ai Cập. Chú thích giữ lại sắc thái cứu chuộc/giải thoát vốn có của từ Hê-bơ-rơ mà không áp đặt một nghĩa duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cặp đại từ “ta/ngươi” để giữ sắc thái lời Đức Chúa Trời phán với Pha-ra-ôn. Giữ nghĩa cứu chuộc tiềm ẩn của פְדֻת trong chú thích thay vì làm mất tính đa nghĩa.
