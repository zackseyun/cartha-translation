  - severity: low
    issue: “Dấu này” có thể hiểu là một vật thể hay ký hiệu hơn là sự kiện được báo trước.
    rationale: “Dấu hiệu này” diễn đạt rõ hơn nghĩa của אוֹת trong ngữ cảnh tai vạ, trong khi vẫn không thêm nội dung.
