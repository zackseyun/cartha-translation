    rationale: Cách này bảo Pha-ra-ôn ban vinh dự cho Môi-se, trong khi câu Híp-ri nói đến vinh dự/glory thuộc về Pha-ra-ôn ‘trên’ Môi-se; nghĩa ngữ cảnh là ông được mời chọn thời điểm.
