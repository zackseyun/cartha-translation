  source_fidelity: 'Cần sửa. Cụm “Xin bệ hạ ban cho tôi vinh dự này” đảo chiều quan hệ trong הִתְפָּאֵר עָלַי: nguyên ngữ đặt Pha-ra-ôn ở vị thế nhận/tỏ vinh dự hơn Môi-se (một thành ngữ khó), chứ không phải ban vinh dự cho Môi-se. “Ếch nhái” rộng hơn הַצֲפַרְדְּעִים (“ếch”), “dưới sông Nin” có thể hiểu là bên dưới lòng sông thay vì trong sông, và “tôi phải khẩn cầu” thêm sắc thái bắt buộc không có trong động từ.'
  naturalness: Bản sửa giữ giọng trang trọng hiện đại phù hợp với lời nói trước quân vương. “Hãy nhận lấy vinh dự này hơn tôi” cố ý giữ nét khó của thành ngữ; chú thích giải thích nghĩa theo ngữ cảnh. “Trong sông Nin” tự nhiên và chính xác hơn “dưới sông Nin.”
  terminology: Giữ Môi-se, Pha-ra-ôn, bệ hạ/bề tôi và sông Nin. Dùng “ếch” cho danh từ số nhiều xác định trong tiếng Híp-ri. “Khẩn cầu” phù hợp với עתר mà không thêm đối tượng khẩn cầu vào chính văn.
  issues:
  - severity: high
