base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: vi
  text: 'Môi-se nói với Pha-ra-ôn: “Xin bệ hạ hãy nhận lấy vinh dự này hơn tôi[a]: khi nào tôi sẽ khẩn cầu cho bệ hạ, cho các bề tôi của bệ hạ và cho dân của bệ hạ, để trừ ếch khỏi bệ hạ và khỏi nhà cửa của bệ hạ? Chúng sẽ chỉ còn lại trong sông Nin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu theo lối diễn giải: “Xin bệ hạ ấn định thời điểm cho tôi.” Thành ngữ Híp-ri khó dịch; theo ngữ cảnh, Môi-se mời Pha-ra-ôn chọn thời điểm ông sẽ khẩn cầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: Xin bệ hạ ban cho tôi vinh dự này
  rationale: Thành ngữ Híp-ri khó hiểu, theo nghĩa sát có yếu tố tự hào hay nhận vinh dự ở trên người khác; trong ngữ cảnh, Môi-se nhường Pha-ra-ôn quyền ấn định thời điểm. Bản dịch giữ hình ảnh về vinh dự, còn ý nghĩa diễn giải được nêu trong chú thích.
- source_word: לְמָתַי
  choice: vào lúc nào
  rationale: Diễn đạt tự nhiên câu hỏi về thời điểm Pha-ra-ôn muốn Môi-se khẩn cầu.
- source_word: אַעְתִּיר
  choice: tôi phải khẩn cầu
  rationale: Động từ chỉ sự cầu xin tha thiết, tại đây hàm ý Môi-se cầu xin Đức Chúa Trời; “khẩn cầu” trang trọng, dễ hiểu và không biến hàm ý thành một bổ ngữ không có trong câu.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: cho bệ hạ, cho các bề tôi và dân của bệ hạ
  rationale: Giữ phạm vi ba đối tượng và phần nào phản ánh sự lặp lại của giới từ; “bệ hạ/bề tôi” phù hợp lời nói trực tiếp với vua.
- source_word: לְהַכְרִית
  choice: để ếch nhái bị trừ khỏi
  rationale: כרת có nghĩa cơ bản là cắt đứt, diệt trừ; trong ngữ cảnh tai họa, “bị trừ khỏi” vừa giữ sắc thái mạnh vừa tự nhiên hơn cách nói sát chữ “bị cắt khỏi”.
- source_word: הַצֲפַרְדְּעִים
  choice: ếch nhái
  rationale: Cách gọi phổ thông trong tiếng Việt cho loài vật gây tai họa ở phân đoạn này.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: khỏi bệ hạ và nhà cửa của bệ hạ
  rationale: 'Giữ hai phạm vi riêng biệt của nguyên văn: chính Pha-ra-ôn và các ngôi nhà thuộc về ông.'
- source_word: רַק
  choice: chỉ
  rationale: 'Đánh dấu ngoại lệ duy nhất: ếch nhái vẫn còn ở sông Nin.'
- source_word: בַּיְאֹר
  choice: dưới sông Nin
  rationale: יְאֹר trong bối cảnh Ai Cập chỉ sông Nin; tiếng Việt tự nhiên dùng “dưới sông” khi nói sinh vật ở trong dòng nước.
- source_word: תִּשָּׁאַרְנָה
  choice: chúng sẽ ... còn lại
  rationale: Phản ánh thể bị động/trạng thái của שׁאר là được để lại hoặc vẫn còn, đồng thời dùng trật tự tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng mà Môi-se khẩn cầu
  choice: Không thêm trực tiếp “Đức Chúa Trời” vào chính văn
  alternative: “tôi phải khẩn cầu Đức Chúa Trời ... vào lúc nào”
  rationale: Ngữ cảnh cho thấy lời khẩn cầu hướng đến Đức Chúa Trời, nhưng câu Híp-ri không nêu bổ ngữ; giữ nguyên sự hàm ẩn tránh thêm điều nguyên văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bệ hạ” và “bề tôi” để thể hiện lời Môi-se thưa với vua; dùng “sông Nin” thay vì tên gọi chung “con sông” nhằm làm rõ địa danh Ai Cập.
