    rationale: צְפַרְדֵּעַ chỉ “ếch”; “ếch nhái” trong tiếng Việt có thể chỉ nhiều loài lưỡng cư, nên không chính xác bằng “ếch”.
  - severity: low
    issue: “Bò lên” thêm sắc thái phương thức.
    rationale: וַתַּעַל chỉ sự đi/lên, không xác định rằng chúng bò. “Trồi lên” giữ ý hướng chuyển động từ nước lên mà không thêm chi tiết.
  - severity: low
    issue: “Giơ tay” chưa biểu đạt đầy đủ sắc thái đưa/giơ tay ra của נטה.
    rationale: Thêm “ra” giúp phản ánh cử chỉ dang hoặc đưa tay về phía các nguồn nước, đồng thời vẫn tự nhiên trong tiếng Việt.
