  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: vi
  text: A-rôn giơ tay ra trên các nguồn nước của Ai Cập, và ếch[a] trồi lên, che phủ đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng dạng số ít “con ếch”, nhưng từ này có lẽ mang nghĩa tập hợp; vì thế được dịch là “ếch”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: giơ
  rationale: Trong bối cảnh thực hiện dấu lạ, נטה יָד diễn tả động tác đưa hoặc giơ tay ra. “Giơ tay” tự nhiên trong tiếng Việt và giữ được hình ảnh hành động có chủ ý.
- source_word: יָדוֹ
  choice: tay
  rationale: Tiếng Hê-bơ-rơ nói rõ là “tay”, vì vậy giữ hình ảnh cụ thể thay vì đổi thành “cánh tay”.
- source_word: עַל
  choice: trên
  rationale: Diễn đạt quan hệ không gian giữa bàn tay được giơ ra và các nguồn nước, tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: מֵימֵי מִצְרָיִם
  choice: các nguồn nước của Ai Cập
  rationale: Danh từ số nhiều chỉ chung hệ thống sông ngòi và các vùng nước của Ai Cập; “các nguồn nước” truyền đạt số nhiều tự nhiên hơn “những nước” trong tiếng Việt.
- source_word: וַתַּעַל
  choice: bò lên
  rationale: עלה diễn tả việc ếch nhái từ dưới nước đi lên đất. “Bò lên” vừa thể hiện hướng chuyển động vừa phù hợp tự nhiên với loài vật này, dù động từ nguồn tự nó chỉ có nghĩa rộng là “đi/lên”.
- source_word: הַצְּפַרְדֵּעַ
  choice: ếch nhái
  rationale: Danh từ Hê-bơ-rơ ở dạng số ít có mạo từ nhưng có chức năng tập hợp. “Ếch nhái” là cách gọi tự nhiên, phổ thông cho tập thể loài vật trong tai họa này.
- source_word: וַתְּכַס
  choice: phủ khắp
  rationale: כסה có nghĩa là che phủ. Thêm “khắp” diễn đạt tự nhiên kết quả bao phủ toàn lãnh thổ được nêu, không đổi bản chất hành động.
- source_word: אֶרֶץ מִצְרָיִם
  choice: đất Ai Cập
  rationale: אֶרֶץ ở đây chỉ lãnh thổ Ai Cập. “Đất Ai Cập” trang trọng, dễ hiểu và không khiến người đọc nghĩ đến toàn thể trái đất.
