  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: vi
  text: 'Rồi Đức Giê-hô-va phán với Môi-se: “Hãy dậy sớm vào buổi sáng và ra đứng trước mặt Pha-ra-ôn. Này, vua đang đi ra chỗ có nước. Hãy nói với vua: ‘Đức Giê-hô-va phán thế này: Hãy để dân Ta đi, để họ phụng sự Ta.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để biểu thị danh riêng YHWH, phân biệt với tước hiệu chung ‘Chúa’.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Sáng mai, hãy dậy sớm
  rationale: Diễn đạt tự nhiên mệnh lệnh dậy sớm vào buổi sáng; ‘mai’ phù hợp ngữ cảnh lời truyền cho lần gặp kế tiếp.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: và đứng đón Pha-ra-ôn
  rationale: Hithpael của יצב chỉ việc vào vị trí và đứng trước mặt; ‘đứng đón’ truyền đạt tự nhiên hành động chủ động chặn gặp vua.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Giữ sắc thái chỉ dẫn, thu hút sự chú ý của từ Hebrew thay vì lược bỏ.
- source_word: יוֹצֵא הַמָּיְמָה
  choice: vua sẽ đi ra mé nước
  rationale: Đại từ được làm rõ là Pha-ra-ôn; hậu tố chỉ hướng và danh từ ‘nước’ được diễn đạt tự nhiên là ‘ra mé nước’.
- source_word: שַׁלַּח עַמִּי
  choice: Hãy để dân Ta đi
  rationale: Giữ mệnh lệnh yêu cầu Pha-ra-ôn phóng thích/cho dân đi, bằng công thức tiếng Việt rõ và quen thuộc.
- source_word: וְיַעַבְדֻנִי
  choice: để họ phụng sự Ta
  rationale: עבד có thể bao hàm phục vụ và thờ phượng; ‘phụng sự’ giữ được độ rộng ấy trong văn cảnh tôn giáo.
theological_decisions:
- issue: Cách thể hiện danh riêng của Đức Chúa Trời, YHWH
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Chúa
  rationale: Bản nguồn dùng danh riêng יהוה; phiên âm quen thuộc giúp bảo tồn khác biệt giữa danh riêng này và các tước hiệu, không thêm lập trường hệ phái.
- issue: Nghĩa của עבד trong mục đích dân được thả đi
  choice: phụng sự
  alternative: thờ phượng
  rationale: ‘Phụng sự’ không thu hẹp động từ chỉ còn nghi lễ thờ phượng, đồng thời vẫn tự nhiên khi đối tượng là Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lời phán lồng trong lời phán bằng dấu ngoặc kép và ngoặc đơn; viết hoa ‘Ta’ theo quy ước quy chiếu về Đức Chúa Trời, và dùng ‘vua’ để tránh lặp tên Pha-ra-ôn trong tiếng Việt.
