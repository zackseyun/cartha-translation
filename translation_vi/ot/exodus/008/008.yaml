  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֔ה עַל דְּבַ֥ר הַֽ/צְפַרְדְּעִ֖ים אֲשֶׁר שָׂ֥ם לְ/פַרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: vi
  text: Vậy Môi-se và A-rôn rời khỏi Pha-ra-ôn. Môi-se kêu cầu Yahweh về những con ếch mà Ngài đã giáng trên Pha-ra-ôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mà Ngài đã đặt để chống lại Pha-ra-ôn.” Động từ Hê-bơ-rơ có nghĩa sát chữ là “đặt” hoặc “để”; “giáng trên” diễn đạt tự nhiên ý nghĩa trong bối cảnh tai họa này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: rời khỏi
  rationale: Động từ יצא diễn tả việc đi ra khỏi sự hiện diện của Pha-ra-ôn; “rời khỏi” tự nhiên trong tiếng Việt và phù hợp với chủ ngữ kép Môi-se và A-rôn.
- source_word: מֵעִם
  choice: khỏi
  rationale: Cụm מֵעִם chỉ việc rời khỏi chỗ hoặc sự hiện diện của một người; “khỏi Pha-ra-ôn” truyền đạt ý này gọn và tự nhiên.
- source_word: וַיִּצְעַק
  choice: kêu cầu
  rationale: צעק diễn tả tiếng kêu khẩn thiết hướng đến Đức Chúa Trời. “Kêu cầu” giữ được cường độ và sắc thái cầu xin tốt hơn “cầu nguyện” trung tính.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: עַל דְּבַר
  choice: về
  rationale: Trong ngữ cảnh này, thành ngữ עַל דְּבַר có nghĩa “về/liên quan đến”; “về” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: הַצְפַרְדְּעִים
  choice: những con ếch
  rationale: Cách dịch trực tiếp danh từ số nhiều, chỉ các con vật trong tai họa.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: mà Ngài đã giáng trên Pha-ra-ôn
  rationale: שׂים có nghĩa cơ bản là “đặt/để”, nhưng trong ngữ cảnh tai họa, “giáng trên” truyền đạt tự nhiên việc Yahweh khiến ếch ập đến Pha-ra-ôn; chú thích bảo lưu nghĩa sát chữ và khả năng “chống lại” của giới từ.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Chủ thể của שָׂם trong mệnh đề cuối
  choice: Ngài, tức Yahweh
  alternative: không nêu chủ thể bằng một cấu trúc bị động
  rationale: Chủ thể số ít gần nhất và hợp ngữ cảnh là Yahweh, Đấng giáng tai họa; cách viết “Ngài” làm câu tiếng Việt tự nhiên, dù tiếng Hê-bơ-rơ chỉ hàm chứa chủ thể trong hình thái động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kêu cầu” để giữ sắc thái khẩn thiết; giữ danh Yahweh theo dạng phiên âm. Tách thành hai câu để lời kể tiếng Việt rõ ràng, không làm thay đổi quan hệ trình tự của nguyên văn.
