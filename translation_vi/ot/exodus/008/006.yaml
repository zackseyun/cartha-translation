base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: vi
  text: 'Pha-ra-ôn đáp: “Ngày mai.” Môi-se nói: “Tôi sẽ làm theo lời vua, để vua biết rằng không ai giống như Yahweh[a], Đức Chúa Trời của chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là cách chuyển tự danh riêng יהוה (YHWH) của Đức Chúa Trời; tên này đôi khi được dịch là “CHÚA” hoặc phiên âm là “Giê-hô-va”.
    reason: Giải thích danh thánh và những cách thể hiện quen thuộc trong tiếng Việt.
lexical_decisions:
- source_word: וַיֹּאמֶר … וַיֹּאמֶר
  choice: Pha-ra-ôn đáp … Môi-se nói
  rationale: 'Hai động từ tường thuật giống nhau có nghĩa là “nói”. Chủ thể được nêu rõ theo mạch đối thoại để tiếng Việt tự nhiên và tránh nhầm lẫn: Pha-ra-ôn trả lời trước, rồi Môi-se nói.'
- source_word: לְמָחָר
  choice: Ngày mai
  rationale: Cụm chỉ thời gian này là câu trả lời trực tiếp của Pha-ra-ôn về thời điểm ông chọn.
- source_word: כִּדְבָרְךָ
  choice: theo đúng lời vua
  rationale: Giữ thành ngữ “theo lời của ngươi”, đồng thời dùng cách xưng hô phù hợp khi Môi-se nói với Pha-ra-ôn. Từ “đúng” làm rõ ý hành động sẽ diễn ra theo lời đã định mà không thay đổi nội dung.
- source_word: לְמַעַן תֵּדַע
  choice: để vua biết
  rationale: לְמַעַן diễn tả mục đích; động từ ngôi hai số ít hướng đến Pha-ra-ôn.
- source_word: אֵין כַּיהוָה
  choice: không ai giống như Yahweh
  rationale: אֵין là phủ định hiện hữu, còn כְּ là yếu tố so sánh. Cách dịch này tự nhiên và giữ nguyên lời khẳng định rằng không có bất cứ ai tương tự Yahweh.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Trong ngữ cảnh, danh từ có hình thức số nhiều chỉ về Đức Chúa Trời duy nhất của Israel và mang hậu tố ngôi thứ nhất số nhiều.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh thánh YHWH. Giữ “Yahweh” trong chính văn bảo tồn tính chất tên riêng, thay vì thay bằng một tước hiệu; chú thích giúp độc giả nhận diện danh này.
- issue: Ý nghĩa của אֵין כַּיהוָה
  choice: không ai giống như Yahweh
  alternative: không có thần nào như Yahweh
  rationale: Nguyên văn không có danh từ “thần” sau אֵין. Không thêm danh từ ấy giúp giữ phạm vi so sánh rộng và tránh thu hẹp lời khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Tên người và cách xưng hô “vua” giúp người đọc theo dõi cuộc đối thoại; “Đức Chúa Trời” được dùng theo lối gọi kính trọng phổ biến trong tiếng Việt.
