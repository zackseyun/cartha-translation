revisions:
- from: 'Pha-ra-ôn đáp: “Ngày mai.” Môi-se nói: “Sẽ theo đúng lời vua, để vua biết rằng không ai giống như Yahweh[a], Đức Chúa Trời của chúng ta.”'
  to: 'Pha-ra-ôn đáp: “Ngày mai.” Môi-se nói: “Tôi sẽ làm theo lời vua, để vua biết rằng không ai giống như Yahweh[a], Đức Chúa Trời của chúng ta.”'
