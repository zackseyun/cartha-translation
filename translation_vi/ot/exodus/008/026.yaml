base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: vi
  text: Môi-se rời khỏi Pha-ra-ôn và khẩn cầu Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tha thiết cầu xin Yahweh.” Động từ Hê-bơ-rơ diễn tả sự cầu xin hoặc nài khẩn thiết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: rời khỏi
  rationale: Động từ Qal wayyiqtol của יצא chỉ việc đi ra hoặc rời đi; “rời khỏi” tự nhiên trong tiếng Việt và kết hợp rõ với bổ ngữ chỉ sự phân cách.
- source_word: מֵעִם
  choice: khỏi
  rationale: מֵעִם diễn tả sự tách khỏi người đang hiện diện cùng; “khỏi Pha-ra-ôn” truyền đạt gọn và tự nhiên ý Môi-se rời chỗ Pha-ra-ôn.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm quen thuộc và dễ nhận biết trong tiếng Việt đối với tước hiệu hoàng gia Ai Cập.
- source_word: וַיֶּעְתַּר
  choice: khẩn cầu
  rationale: Động từ עתר diễn tả lời cầu xin tha thiết, khẩn thiết, mạnh hơn ý cầu nguyện chung chung; “khẩn cầu” giữ được sắc thái ấy trong văn phong trang trọng, hiện đại.
- source_word: אֶל
  choice: Đức Giê-hô-va là đối tượng trực tiếp của lời khẩn cầu
  rationale: אֶל có nghĩa cơ bản là “đến/hướng về”; tiếng Việt dùng động từ “khẩn cầu” trực tiếp với đối tượng được cầu xin nên không cần thêm giới từ.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt trang trọng, quen dùng để biểu thị Tứ Tự Danh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu; dạng “Đức Giê-hô-va” vừa có dấu hiệu tôn kính tự nhiên trong tiếng Việt vừa quen thuộc với độc giả phổ thông.
- issue: Sắc thái lời cầu xin của Môi-se
  choice: khẩn cầu
  alternative: cầu nguyện; nài xin
  rationale: Không làm nhẹ עתר thành hành vi cầu nguyện chung chung, cũng không thêm nội dung về cách Đức Chúa Trời đáp lời; “khẩn cầu” bảo toàn tính tha thiết của sự cầu thay.
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng nhưng hiện đại. Cấu trúc “rời khỏi… rồi…” thể hiện chuỗi hành động của hai động từ wayyiqtol mà không khiến câu tiếng Việt nặng nề.
