translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” vì lời này trực tiếp nói với Pha-ra-ôn trong ngữ cảnh cổ, đồng thời gộp các thành phần sở hữu để tránh lặp nặng nề. Dấu chú thích [a] được đặt ngay sau “sông Nin,” là từ ngữ mà chú thích giải thích.
