  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: vi
  text: Ếch sẽ rời khỏi ngươi, khỏi nhà cửa của ngươi, khỏi đầy tớ của ngươi và khỏi dân của ngươi; chúng sẽ chỉ còn lại trong sông Nin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong dòng sông.” Từ Hê-bơ-rơ יְאֹר có thể có nghĩa là “sông,” nhưng trong sách Xuất Hành thường chỉ riêng sông Nin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: sẽ rời khỏi
  rationale: Động từ סוּר ở đây diễn tả việc ếch rời đi khi tai họa chấm dứt; cách dịch này tự nhiên và không hàm ý chúng bị tiêu diệt trực tiếp.
- source_word: הַצְפַרְדְּעִים
  choice: Ếch
  rationale: Danh từ số nhiều xác định chỉ các con ếch trong tai họa; tiếng Việt có thể dùng danh từ loài không kèm từ chỉ số nhiều.
- source_word: מִמְּךָ
  choice: khỏi ngươi
  rationale: Giữ trực tiếp giới từ מן và đại từ ngôi hai số ít, tức Pha-ra-ôn.
- source_word: וּמִבָּתֶּיךָ
  choice: khỏi nhà cửa ... của ngươi
  rationale: “Nhà cửa” diễn đạt tự nhiên danh từ số nhiều בָּתִּים và giữ phạm vi nhiều nhà.
- source_word: וּמֵעֲבָדֶיךָ
  choice: đầy tớ ... của ngươi
  rationale: עֶבֶד có thể chỉ đầy tớ, nô lệ hoặc quan chức; trong ngữ cảnh này, “đầy tớ” đủ rộng và không xác định quá mức địa vị.
- source_word: וּמֵעַמֶּךָ
  choice: dân chúng của ngươi
  rationale: עַם chỉ dân thuộc quyền Pha-ra-ôn; “dân chúng” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: רַק
  choice: chỉ
  rationale: 'Diễn đạt giới hạn/ngoại lệ: ếch không còn ở những nơi vừa kể mà chỉ còn tại một nơi.'
- source_word: בַּיְאֹר
  choice: dưới sông Nin
  rationale: Trong sách Xuất Hành, יְאֹר thường chỉ riêng sông Nin; “dưới sông” là cách nói tiếng Việt tự nhiên về sinh vật ở trong nước.
- source_word: תִּשָּׁאַרְנָה
  choice: chúng sẽ ... còn lại
  rationale: Dạng Niphal của שׁאר diễn tả việc còn lại. Đưa “chỉ” trước “còn lại” giữ trọng tâm giới hạn mà vẫn thuận tiếng Việt.
