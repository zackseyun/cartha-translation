revisions:
- from: Ếch sẽ rời khỏi ngươi, khỏi nhà cửa, đầy tớ và dân chúng của ngươi; chúng sẽ chỉ còn lại dưới sông Nin.[a]
  to: Ếch sẽ rời khỏi ngươi, khỏi nhà cửa của ngươi, khỏi đầy tớ của ngươi và khỏi dân của ngươi; chúng sẽ chỉ còn lại trong sông Nin.[a]
  rationale: Sửa “dưới sông Nin” thành “trong sông Nin” để không thêm chi tiết về vị trí mà tiếng Hê-bơ-rơ không nói. Khôi phục giới từ và sở hữu ngữ trước từng thành phần để giữ rõ phạm vi của các cụm song song trong nguyên văn. Giữ nguyên lựa chọn thuật ngữ, sắc thái tương lai và chú thích về יְאֹר.
