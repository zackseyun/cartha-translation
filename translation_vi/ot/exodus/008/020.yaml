revisions:
- from: 'Yahweh làm đúng như vậy: một đàn côn trùng dày đặc[a] tràn vào nhà Pha-ra-ôn và nhà các tôi tớ ông. Khắp đất Ai Cập, đất đai bị tàn phá vì đàn côn trùng ấy.'
  to: 'Yahweh đã làm như vậy: một đàn côn trùng dày đặc[a] tràn vào nhà Pha-ra-ôn và các nhà của tôi tớ ông. Khắp xứ Ai Cập, đất đai bị tàn phá vì đàn côn trùng ấy.'
  rationale: Bản sửa chỉ làm rõ sở hữu phân phối của “nhà ... tôi tớ ông”, dùng thì kể chuyện tự nhiên hơn, và điều chỉnh chú thích để bảo toàn sự bất định từ vựng của עָרֹב mà không diễn giải quá mức. Nghĩa và mức độ nhấn mạnh của nguyên ngữ được giữ nguyên.
