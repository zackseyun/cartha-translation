review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng diễn tiến chính: Yahweh thực hiện điều đã nói, một đàn/sự tụ tập đông đặc tràn vào nhà Pha-ra-ôn, nhà các tôi tớ ông và khắp Ai Cập; đất bị hủy hoại vì đó. Tuy nhiên, “nhà các tôi tớ ông” có thể bị hiểu là một nhà chung, trong khi tiếng Hê-bơ-rơ dùng “nhà” số ít với “các tôi tớ” theo nghĩa phân phối. Bản sửa làm rõ bằng số nhiều trong tiếng Việt. Chú thích cũng cần giữ sát hơn lựa chọn từ vựng “đàn rất lớn”, thay vì diễn giải “sinh vật gây hại” vượt quá điều bản văn xác định.'
  naturalness: “Yahweh đã làm như vậy” là lối kể chuyện quá khứ tự nhiên, gọn hơn “làm đúng như vậy”. “Các nhà của tôi tớ ông” rõ ràng và tự nhiên. “Đàn côn trùng dày đặc” diễn đạt được ý cường độ của כָּבֵד trong ngữ cảnh, đồng thời không khẳng định loài côn trùng cụ thể.
  terminology: Giữ “Yahweh” theo quyết định danh riêng; “Pha-ra-ôn” là dạng tiếng Việt thông dụng. “Đàn côn trùng” giữ sự bất định của עָרֹב tốt hơn “ruồi”. Không nên dùng chú thích “sinh vật gây hại”, vì cụm này vừa kém tự nhiên vừa mở rộng nghĩa vượt khỏi cách hiểu được nêu trong nguồn kiểm tra.
  issues:
  - severity: low
    issue: Cụm “nhà các tôi tớ ông” chưa thể hiện rõ nghĩa phân phối.
    rationale: וּבֵית עֲבָדָיו có danh từ “nhà” số ít với sở hữu số nhiều; trong tiếng Việt, “các nhà của tôi tớ ông” tránh cách hiểu về một nhà tập thể và phù hợp với cách hiểu phân phối của nguồn đối chiếu.
  - severity: low
    issue: Chú thích a dùng “một đàn sinh vật gây hại rất lớn”.
    rationale: Nguồn tiếng Hê-bơ-rơ và vết kiểm tra tiếng Anh chỉ bảo lưu sự bất định về một đàn côn trùng; “sinh vật gây hại” là diễn giải rộng hơn và không cần thiết. “Một đàn rất lớn” vừa giữ được lựa chọn thay thế cho כָּבֵד vừa bảo toàn sự mơ hồ về loài.
