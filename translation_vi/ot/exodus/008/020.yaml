base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: vi
  text: 'Yahweh đã làm như vậy: một đàn côn trùng dày đặc[a] tràn vào nhà Pha-ra-ôn và các nhà của tôi tớ ông. Khắp xứ Ai Cập, đất đai bị tàn phá vì đàn côn trùng ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một đàn rất lớn”; từ Hê-bơ-rơ không xác định rõ loài, theo truyền thống thường được hiểu là ruồi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: làm đúng như vậy
  rationale: Diễn đạt tự nhiên ý Yahweh thực hiện điều vừa được báo trước.
- source_word: עָרֹב
  choice: đàn côn trùng
  rationale: Từ Hê-bơ-rơ chỉ một đàn sinh vật gây hại, nhưng không xác định chắc chắn loài; cách dịch này tránh giới hạn thành ruồi.
- source_word: כָּבֵד
  choice: dày đặc
  rationale: Trong ngữ cảnh nói về một đàn côn trùng, cách nói này chuyển tải tự nhiên sức nặng về quy mô của כָּבֵד.
- source_word: בֵּיתָה פַרְעֹה
  choice: tràn vào nhà Pha-ra-ôn
  rationale: Hậu tố chỉ hướng trên בֵּיתָה cho thấy chuyển động vào bên trong; không mở rộng 'nhà' thành 'cung điện'.
- source_word: וּבֵית עֲבָדָיו
  choice: và nhà các tôi tớ ông
  rationale: Giữ nghĩa rộng của עֲבָדָיו và hiểu danh từ số ít 'nhà' theo nghĩa phân phối tự nhiên.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: Khắp đất Ai Cập
  rationale: Chuyển tải phạm vi bao quát bằng lối nói tiếng Việt gọn và tự nhiên.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: đất đai bị tàn phá
  rationale: Thể Niphal của שׁחת diễn tả tình trạng chịu hủy hoại; 'tàn phá' mạnh nhưng không nhất thiết hàm ý bị tiêu diệt hoàn toàn.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: vì đàn côn trùng ấy
  rationale: Diễn đạt quan hệ nguyên nhân của thành ngữ מִפְּנֵי trong ngữ cảnh này.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản văn dùng trực tiếp danh riêng YHWH; giữ dạng phiên âm bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng “Pha-ra-ôn” theo dạng quen thuộc trong tiếng Việt; giữ “Yahweh” là danh riêng. “Đàn côn trùng dày đặc” vừa tự nhiên vừa bảo tồn sự không chắc chắn về loài.
