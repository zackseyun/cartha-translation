  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: vi
  text: Đức Giê-hô-va làm theo lời Môi-se; ếch chết trong các nhà, trong các sân và ngoài đồng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để thể hiện danh riêng YHWH, thay vì danh xưng chung “Chúa”.
- source_word: כִּדְבַר מֹשֶׁה
  choice: đúng như lời Môi-se
  rationale: Diễn đạt tự nhiên ý Đức Giê-hô-va hành động phù hợp với điều Môi-se đã nói.
- source_word: הַצְפַרְדְּעִים
  choice: ếch
  rationale: Danh từ tập hợp trong tiếng Việt không cần từ chỉ số nhiều trong ngữ cảnh này.
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: trong nhà, ngoài sân và ngoài đồng
  rationale: Giới từ מִן đi với động từ “chết” ở đây chỉ các địa điểm nơi ếch chết; cách nói này tự nhiên hơn “chết khỏi/từ”, đồng thời phân biệt không gian nhà, sân và đồng.
