base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: vi
  text: 'Bấy giờ, Pha-ra-ôn gọi Môi-se và A-rôn đến rồi nói: “Hãy đi dâng sinh tế cho Đức Chúa Trời của các ngươi trong xứ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong xứ này,” tức là trong xứ Ai Cập.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gọi ... đến
  rationale: Trong ngữ cảnh này, קרא có nghĩa là gọi người nào đến hoặc triệu đến. “Gọi ... đến” tự nhiên trong tiếng Việt và diễn đạt rõ hành động của Pha-ra-ôn.
- source_word: פַרְעֹה
  choice: Pha-ra-ôn
  rationale: Dùng dạng phiên âm quen thuộc của tước hiệu hoàng gia Ai Cập trong truyền thống Kinh Thánh tiếng Việt.
- source_word: וַיֹּאמֶר
  choice: rồi nói
  rationale: 'Diễn đạt tự nhiên chuỗi hành động trong lời kể Hê-bơ-rơ: Pha-ra-ôn gọi họ đến, rồi lên tiếng.'
- source_word: לְכוּ
  choice: Hãy đi
  rationale: Mệnh lệnh số nhiều của הלך, trực tiếp cho phép Môi-se và A-rôn tiến hành việc thờ phượng.
- source_word: זִבְחוּ
  choice: dâng sinh tế
  rationale: זבח chỉ hành động dâng con vật làm lễ tế. “Dâng sinh tế” rõ nghĩa, trang trọng và tự nhiên hơn cách dùng ngoại động từ “hiến tế” trong câu này.
- source_word: לֵאלֹהֵיכֶם
  choice: cho Đức Chúa Trời của các ngươi
  rationale: Giới từ ל đánh dấu Đấng tiếp nhận lễ tế. Cách nói này giữ sắc thái lời Pha-ra-ôn nói với Môi-se và A-rôn; “các ngươi” phản ánh đại từ số nhiều và giữ khoảng cách của người nói.
- source_word: בָּאָרֶץ
  choice: ngay trong xứ này
  rationale: Cụm từ theo mặt chữ là “trong xứ/đất”. Ngữ cảnh cho thấy Pha-ra-ôn đối lập việc ở lại Ai Cập với việc đi vào hoang mạc; “xứ này” làm rõ quy chiếu ngữ cảnh mà không thay địa danh vào chính văn.
theological_decisions:
- issue: Danh xưng אֱלֹהֵיכֶם trong lời Pha-ra-ôn
  choice: Đức Chúa Trời của các ngươi
  alternative: thần của các ngươi
  rationale: Trong ngữ cảnh, từ này chỉ chính Đức Chúa Trời mà Môi-se và A-rôn thờ. Viết hoa và dùng danh xưng quen thuộc giúp nhận diện quy chiếu, nhưng vẫn giữ cụm “của các ngươi” để bảo toàn góc nhìn và khoảng cách trong lời Pha-ra-ôn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Bấy giờ” cho mạch tường thuật, tên riêng theo dạng quen thuộc trong Kinh Thánh tiếng Việt, và giữ lời truyền lệnh ngắn gọn. Dấu chú thích [a] được đặt ngay sau câu có cụm từ cần giải thích.
