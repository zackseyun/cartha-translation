  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: vi
  text: Các thuật sĩ cũng làm như vậy bằng những phép thuật bí truyền của họ[a], khiến ếch bò lên khắp đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng những bùa chú của họ” hoặc “bằng những phép thuật huyền bí của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: cũng làm như vậy
  rationale: Diễn đạt tự nhiên thành ngữ עשה כֵן, đồng thời giữ ý các thuật sĩ thực hiện tương tự hành động vừa được kể.
- source_word: הַחֲרְטֻמִּים
  choice: các thuật sĩ
  rationale: Trong ngữ cảnh Xuất Hành, từ này chỉ những người hành nghề huyền thuật tại triều đình Pha-ra-ôn; “thuật sĩ” rõ nghĩa, trang trọng và quen thuộc trong tiếng Việt.
- source_word: בְּלָטֵיהֶם
  choice: bằng những thuật bí truyền của họ
  rationale: Giữ cả nghĩa phương tiện của giới từ בְּ và sắc thái kín giấu, huyền bí của danh từ; không xác định quá mức kỹ thuật được sử dụng.
- source_word: וַיַּעֲלוּ
  choice: khiến ... bò lên
  rationale: Giữ nghĩa khiến cho đi lên của dạng Hiphil; với ếch, “bò lên” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אֶת הַצְפַרְדְּעִים
  choice: ếch
  rationale: Danh từ số nhiều xác định; tiếng Việt không bắt buộc biểu thị số nhiều hay mạo từ trong cấu trúc này.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: khắp đất Ai Cập
  rationale: Trong ngữ cảnh đàn ếch lan ra trên lãnh thổ, “khắp” truyền đạt tự nhiên phạm vi trên đất Ai Cập mà không làm thay đổi hành động chính.
theological_decisions:
- issue: Bản chất hành động của các thuật sĩ
  choice: Thuật lại thẳng rằng họ khiến ếch bò lên.
  alternative: Diễn đạt như một sự bắt chước bề ngoài hoặc trò đánh lừa.
  rationale: Bản văn Hê-bơ-rơ khẳng định hành động mà không giải thích cơ chế hay tỏ ý hoài nghi; bản dịch không nên thêm cách giải thích tự nhiên chủ nghĩa hoặc luận chiến.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thuật sĩ” và “thuật bí truyền” để giữ sắc thái triều đình và huyền thuật; dấu chân chú [a] được đặt ngay sau cụm từ liên quan.
