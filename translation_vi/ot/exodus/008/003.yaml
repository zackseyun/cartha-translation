  to: Các thuật sĩ cũng làm như vậy bằng những phép thuật bí truyền của họ[a], khiến ếch bò lên khắp đất Ai Cập.
  rationale: 'Chỉ điều chỉnh thuật ngữ nhằm có tiếng Việt tự nhiên hơn: thêm “phép” vào cụm chỉ các thực hành bí mật của các thuật sĩ. Cấu trúc, hành động gây khiến của động từ Hiphil, phạm vi trên đất Ai Cập, và tính không giải thích của bản văn đều được giữ nguyên.'
