revisions:
- from: Yahweh làm theo lời Môi-se và khiến đàn côn trùng[a] rời khỏi Pha-ra-ôn, các bề tôi và dân của vua; không còn lại một con nào.
  to: Yahweh làm theo lời Môi-se và cất đàn côn trùng[a] khỏi Pha-ra-ôn, các bề tôi của ông và dân của ông; không còn một con nào.
  rationale: Thay “khiến ... rời khỏi” bằng “cất ... khỏi” để diễn đạt trực tiếp tác động chủ động của Yahweh trong động từ Hiphil. Làm rõ các đại từ sở hữu trong danh sách và chỉnh chú thích cho nhất quán với phạm vi “côn trùng”, đồng thời vẫn bảo toàn sự bất định về loài của עָרֹב.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:14:00Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng hành động của Yahweh theo lời Môi-se, việc đàn côn trùng bị cất khỏi cả Pha-ra-ôn, các bề tôi và dân của ông, cùng lời khẳng định tuyệt đối rằng không còn một con nào. Tuy nhiên, “khiến ... rời khỏi” hơi chuyển trọng tâm sang hành vi tự rời đi của đàn côn trùng, trong khi động từ Hiphil וַיָּסַר trực tiếp nhấn mạnh Yahweh cất/loại bỏ tai họa.
  naturalness: “Cất ... khỏi” tự nhiên, trang trọng và trực tiếp hơn trong văn mạch tai họa. Việc lặp “của ông” làm rõ đại từ sở hữu gắn với Pha-ra-ôn và phản ánh ba nhóm được nêu trong tiếng Hê-bơ-rơ.
  terminology: Giữ “Yahweh”, “Môi-se”, “Pha-ra-ôn”, và “đàn côn trùng” là phù hợp. “Bề tôi” có sắc thái triều đình thích hợp cho עֲבָדָיו trong ngữ cảnh này. Chú thích nên nói rõ đây là đàn côn trùng, tránh diễn giải rộng thành mọi loại “sinh vật”.
  issues:
  - severity: low
    issue: Cách diễn đạt “khiến đàn côn trùng rời khỏi”
    rationale: Cách này có thể gợi rằng đàn côn trùng tự di chuyển; nguyên văn nói Yahweh chủ động loại bỏ/cất tai họa đi.
  - severity: low
    issue: Đại từ sở hữu trong cụm liệt kê chưa được lặp lại
    rationale: “các bề tôi và dân của vua” vẫn hiểu được, nhưng “các bề tôi của ông và dân của ông” làm rõ cả hai nhóm đều thuộc Pha-ra-ôn và sát cấu trúc nguyên văn hơn.
  - severity: low
    issue: Chú thích dùng “sinh vật” quá rộng
    rationale: Cách dịch chính và vệt kiểm toán tiếng Anh đều giới hạn phạm vi ở côn trùng; chú thích nên giữ cùng phạm vi nhưng không xác định loài.
