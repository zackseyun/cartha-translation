base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: vi
  text: Yahweh làm theo lời Môi-se và cất đàn côn trùng[a] khỏi Pha-ra-ôn, các bề tôi của ông và dân của ông; không còn một con nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đàn ruồi”. Từ Hê-bơ-rơ עָרֹב chỉ tai họa do côn trùng tụ thành đàn, nhưng bản thân từ này không xác định chính xác loài.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: וַיַּעַשׂ ... כִּדְבַר מֹשֶׁה
  choice: làm theo lời Môi-se
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ, đồng thời giữ nghĩa Yahweh hành động đúng như lời Môi-se.
- source_word: וַיָּסַר
  choice: khiến ... rời khỏi
  rationale: Dạng Hiphil của סור mang nghĩa khiến vật gì lìa đi hoặc loại bỏ; cách dịch này tự nhiên với các đối tượng được nêu sau giới từ מִן.
- source_word: הֶעָרֹב
  choice: đàn côn trùng
  rationale: עָרֹב chỉ tai họa do sinh vật nhỏ bay hoặc bò thành đàn, nhưng bản thân từ này không xác định chính xác loài; cách dịch tránh thu hẹp thành ruồi.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: rời khỏi Pha-ra-ôn, các bề tôi và dân của vua
  rationale: Giữ đủ ba phạm vi mà tai họa bị cất khỏi; thêm 'của vua' làm rõ đại từ sở hữu trong tiếng Việt.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: không còn lại một con nào
  rationale: Giữ sắc thái nhấn mạnh số ít אֶחָד và dùng loại từ phù hợp với đàn côn trùng.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm Yahweh bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Mức độ xác định loài của עָרֹב
  choice: đàn côn trùng
  alternative: đàn ruồi
  rationale: Không xác định một loài cụ thể vì từ Hê-bơ-rơ còn có sự bất định về thành phần của đàn; chú thích ghi nhận cách hiểu truyền thống cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bề tôi” cho עֲבָדִים trong bối cảnh triều đình; cấu trúc câu giữ nhịp liệt kê và lời kết nhấn mạnh của nguyên văn.
