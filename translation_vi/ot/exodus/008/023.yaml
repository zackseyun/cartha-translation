source:
  edition: WLC
  text: דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים נֵלֵ֖ךְ בַּ/מִּדְבָּ֑ר וְ/זָבַ֨חְנוּ֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/אֲשֶׁ֖ר יֹאמַ֥ר אֵלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: vi
  text: Chúng ta sẽ đi ba ngày đường vào hoang mạc và dâng sinh tế cho Yahweh, Đức Chúa Trời của chúng ta, đúng như Ngài sẽ phán bảo chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đúng như Ngài phán bảo chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: một chặng đường ba ngày
  rationale: Cụm từ chỉ quãng đường hoặc hành trình tương ứng với ba ngày đi; cách diễn đạt này tự nhiên trong tiếng Việt mà không xác định cứng là đúng ba ngày theo nghĩa thời lượng.
- source_word: נֵלֵךְ
  choice: Chúng ta sẽ đi
  rationale: Thể vị hoàn thành Qal ngôi thứ nhất số nhiều trong ngữ cảnh này diễn tả hành động dự định trong tương lai.
- source_word: בַּמִּדְבָּר
  choice: đi vào hoang mạc
  rationale: מִדְבָּר là vùng hoang vu, đất hoang hoặc hoang mạc, không nhất thiết là sa mạc cát; giới từ được diễn đạt theo hướng chuyển động của động từ 'đi'.
- source_word: וְזָבַחְנוּ
  choice: rồi dâng sinh tế
  rationale: זבח chỉ việc giết hoặc dâng con vật làm sinh tế. 'Dâng sinh tế' truyền đạt rõ ý nghĩa nghi lễ và tự nhiên hơn cách nói đơn thuần 'hy sinh' trong tiếng Việt.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ tên riêng giao ước יהוה dưới dạng chuyển tự Yahweh, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Diễn đạt trực tiếp danh từ với hậu tố sở hữu ngôi thứ nhất số nhiều, đồng thời dùng cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Thể hiện ý làm phù hợp chính xác với lời chỉ dẫn sẽ nhận được.
- source_word: יֹאמַר אֵלֵינוּ
  choice: Ngài sẽ phán dạy chúng ta
  rationale: Dạng chưa hoàn thành có thể chỉ lời chỉ dẫn trong tương lai. 'Phán dạy' vừa tự nhiên trong văn cảnh Đức Chúa Trời truyền bảo, vừa bao hàm ý nói và chỉ dẫn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh; chuyển tự 'Yahweh' giữ chức năng tên riêng và không thay bằng tước hiệu.
- issue: Thời điểm của יֹאמַר
  choice: Ngài sẽ phán dạy chúng ta
  alternative: Ngài phán dạy chúng ta
  rationale: Thể chưa hoàn thành cho phép cả sắc thái tương lai lẫn cách diễn đạt hiện tại/tổng quát. Ngữ cảnh lời đề nghị về hành trình sắp tới nghiêng về lời chỉ dẫn sẽ được ban, nhưng chú thích bảo lưu khả năng còn lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hoang mạc” thay vì “sa mạc” để tránh thu hẹp nghĩa của מִדְבָּר; dùng “dâng sinh tế” để giữ nghĩa nghi lễ. Dấu chú thích [a] được đặt ngay sau mệnh đề có cách hiểu thay thế.
