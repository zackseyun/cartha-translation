base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: vi
  text: Nhưng lần này, Pha-ra-ôn lại làm cho lòng mình trở nên chai lì[a], và không chịu cho dân ra đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hê-bơ-rơ sát nghĩa là “làm cho lòng mình nặng nề.” Thành ngữ này diễn tả việc trở nên ngoan cố hoặc không chịu đáp ứng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: làm cho ... ra nặng nề
  rationale: Dạng Hiphil với Pha-ra-ôn là chủ ngữ diễn tả ông chủ động làm cho lòng mình trở nên 'nặng'. Cách dịch này giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ; chú thích giải thích nghĩa bóng là ngoan cố, không chịu đáp ứng.
- source_word: לִבּוֹ
  choice: lòng mình
  rationale: Trong ngữ cảnh, לֵב chỉ trung tâm của ý chí và thái độ. Đại từ phản thân 'mình' tự nhiên trong tiếng Việt khi chủ thể Pha-ra-ôn tác động lên chính lòng ông.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: lần này ... cũng
  rationale: Giữ sắc thái bổ sung của גַּם, cho thấy đây lại là một lần nữa Pha-ra-ôn có phản ứng như vậy.
- source_word: שִׁלַּח
  choice: để ... ra đi
  rationale: Trong bối cảnh Xuất Hành, cách nói này diễn đạt tự nhiên việc cho phép và phóng thích dân Y-sơ-ra-ên đi.
- source_word: הָעָם
  choice: dân chúng
  rationale: Danh từ tập hợp xác định chỉ dân Y-sơ-ra-ên đã được nhận diện trong mạch truyện.
- source_word: וְלֹא
  choice: và không
  rationale: Phản ánh trực tiếp liên từ cùng phủ định, nối hành động thứ hai với hành động làm lòng ra nặng nề.
- source_word: וַ
  choice: Nhưng
  rationale: Liên từ kể chuyện có thể là 'và', nhưng ở đây 'nhưng' làm rõ sự tương phản giữa việc tai họa vừa được cất đi và phản ứng ngoan cố của Pha-ra-ôn.
theological_decisions:
- issue: Chủ thể làm lòng Pha-ra-ôn ra nặng nề
  choice: Pha-ra-ôn chủ động làm cho lòng mình ra nặng nề
  alternative: Lòng Pha-ra-ôn trở nên cứng cỏi
  rationale: Cấu trúc Hê-bơ-rơ nêu Pha-ra-ôn làm chủ ngữ của động từ chủ động, nên bản dịch giữ trách nhiệm hành động của ông. Điều này không xóa bỏ căng thẳng thần học trong toàn bộ sách, nơi những câu khác nói Đức Chúa Trời làm cứng lòng Pha-ra-ôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ ẩn dụ Hê-bơ-rơ trong câu chính để bảo toàn nét diễn đạt của nguyên văn, đồng thời dùng chú thích giải nghĩa thành ngữ; tên riêng theo dạng Việt hóa quen thuộc.
