  yaml_path: translation/ot/exodus/008/010.yaml
  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: vi
  text: Họ chất chúng thành đống này đến đống khác[a], và xứ bốc mùi hôi thối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thành từng đống” hoặc “đống chồng đống”; tiếng Hê-bơ-rơ lặp lại danh từ “đống” để nhấn mạnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: Người ta gom ... lại
  rationale: Động từ צבר diễn tả việc thu gom các vật thành khối hay thành đống. “Gom ... lại” tự nhiên trong tiếng Việt và, cùng với cụm theo sau, biểu đạt rõ hành động chất thành nhiều đống.
- source_word: אֹתָם
  choice: chúng
  rationale: Đại từ tân ngữ chỉ những con ếch trong văn cảnh ngay trước đó; “chúng” giữ nguyên sự quy chiếu mà không thêm danh từ vào câu.
- source_word: חֳמָרִם חֳמָרִם
  choice: thành hết đống này đến đống khác
  rationale: Danh từ “đống” được lặp lại trong tiếng Hê-bơ-rơ để nhấn mạnh tính phân bố và số lượng nhiều. Cách nói này tự nhiên, rõ nghĩa trong tiếng Việt và phản ánh được sức nhấn của phép lặp.
- source_word: וַתִּבְאַשׁ
  choice: bốc mùi hôi thối
  rationale: Động từ באש có nghĩa là phát ra mùi hôi. “Bốc mùi hôi thối” cụ thể, mạnh và tự nhiên hơn cách diễn đạt mang tính kỹ thuật.
- source_word: הָאָרֶץ
  choice: cả xứ
  rationale: Trong trình thuật các tai họa tại Ai Cập, אֶרֶץ chỉ vùng đất hay xứ chịu ảnh hưởng, không phải toàn thể trái đất. “Cả xứ” cũng truyền đạt phạm vi rộng được ngữ cảnh hàm ý.
