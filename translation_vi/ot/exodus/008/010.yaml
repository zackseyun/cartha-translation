  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Người ta” phù hợp với chủ ngữ số nhiều không nêu rõ trong câu; “hết đống này đến đống khác” giữ sắc thái nhấn mạnh của nguyên văn. Dấu [a] được đặt ngay sau cụm từ liên quan.
