  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: vi
  text: 'Nhưng Môi-se nói: “Làm như vậy là không thích hợp, vì chúng tôi sẽ dâng sinh tế cho Yahweh, Đức Chúa Trời của chúng tôi, vật mà người Ai Cập ghê tởm.[a] Nếu chúng tôi dâng sinh tế là vật mà người Ai Cập ghê tởm ngay trước mắt họ, chẳng phải họ sẽ ném đá chúng tôi sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “vật ghê tởm của Ai Cập.” Cụm từ này có lẽ chỉ vật mà người Ai Cập xem là đáng ghê tởm.'
    reason: Bảo lưu cách diễn đạt sát chữ và sự mơ hồ của cấu trúc תּוֹעֲבַת מִצְרַיִם.
lexical_decisions:
- source_word: נָכוֹן
  choice: phải lẽ
  rationale: Trong ngữ cảnh này, từ này chỉ điều thích đáng, hợp lẽ hoặc có thể chấp nhận; “không phải lẽ” vừa tự nhiên vừa giữ được sắc thái đạo lý và thực tế trong lời Môi-se.
- source_word: לַעֲשׂוֹת כֵּן
  choice: làm như vậy
  rationale: Đây là thành ngữ thông dụng mang nghĩa “làm thế/làm như vậy”; cách dịch này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: vật mà người Ai Cập ghê tởm
  rationale: Cụm kết cấu này có thể hiểu sát chữ là “vật ghê tởm của Ai Cập,” nhưng mạch văn hướng đến con vật hoặc lễ vật bị người Ai Cập xem là đáng ghê tởm. Dùng “vật” phù hợp với động từ dâng sinh tế mà không xác định quá mức đó là loài vật nào.
- source_word: נִזְבַּח
  choice: chúng tôi sẽ dâng
  rationale: Dạng vị hoàn diễn tả hành động dự định nếu làm theo đề nghị đang được bàn đến. “Dâng” trong ngữ cảnh đã đủ biểu thị việc dâng sinh tế và tự nhiên hơn khi đi với “cho Yahweh.”
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ tên riêng giao ước יהוה dưới dạng “Yahweh,” thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng tôi
  rationale: Giữ nguyên cấu trúc sở hữu và cách xưng hô trang trọng, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: הֵן
  choice: Nếu
  rationale: Tại đây, הֵן mở đầu một giả định sống động dẫn đến câu hỏi tu từ; “Nếu” truyền đạt đúng chức năng trong tiếng Việt.
- source_word: לְעֵינֵיהֶם
  choice: ngay trước mắt họ
  rationale: Giữ hình ảnh trực tiếp của thành ngữ Hê-bơ-rơ và nhấn mạnh rằng người Ai Cập tận mắt chứng kiến.
- source_word: יִסְקְלֻנוּ
  choice: họ sẽ ném đá chúng tôi
  rationale: Động từ chỉ hành động dùng đá tấn công hoặc giết chết; “ném đá” giữ nghĩa cụ thể mà không thêm chi tiết ngoài văn bản.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה. Phiên âm “Yahweh” bảo toàn tư cách tên riêng và tránh thay tên bằng một tước hiệu.
- issue: Ý nghĩa của תּוֹעֲבַת מִצְרַיִם
  choice: vật mà người Ai Cập ghê tởm
  alternative: vật ghê tởm của Ai Cập
  rationale: Ngữ cảnh giải thích nguy cơ người Ai Cập phản ứng dữ dội trước sinh tế của người Ít-ra-ên, nên cách hiểu khách thể—vật bị người Ai Cập ghê tởm—phù hợp nhất. Chú thích vẫn bảo lưu cấu trúc sát chữ và độ mơ hồ của cụm từ.
- issue: Sắc thái câu hỏi kết thúc
  choice: chẳng phải họ sẽ ném đá chúng tôi sao?
  alternative: họ lại không ném đá chúng tôi sao?
  rationale: Câu hỏi tu từ diễn tả kết quả mà Môi-se cho là rất có thể xảy ra, nhưng không biến lời ông thành một lời khẳng định tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng tôi” theo lời Môi-se nói với Pha-ra-ôn; giữ hình ảnh “ngay trước mắt họ” và câu hỏi tu từ của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
