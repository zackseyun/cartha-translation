- from: 'Bấy giờ, Pha-ra-ôn cho gọi Môi-se và A-rôn đến, rồi nói: “Hãy khẩn cầu Đức Giê-hô-va[a] cất ếch nhái khỏi ta và dân ta; ta sẽ để dân ấy ra đi, để họ dâng sinh tế cho Đức Giê-hô-va[b].”'
  to: 'Bấy giờ, Pha-ra-ôn cho gọi Môi-se và A-rôn đến, rồi nói: “Hãy khẩn cầu[a] Yahweh cất lũ ếch khỏi ta và khỏi dân ta; ta sẽ để dân ấy ra đi, để họ dâng sinh tế cho Yahweh[b].”'
