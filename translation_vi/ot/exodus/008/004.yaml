  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính của câu: Pha-ra-ôn triệu Môi-se và A-rôn, xin họ khẩn cầu, xin cất ếch khỏi ông và dân ông, rồi hứa cho dân ra đi để họ dâng sinh tế. Tuy nhiên, danh יהוה cần được nhất quán dịch là “Yahweh” theo quyết định nguồn/audit trail. “Ếch nhái” rộng nghĩa hơn từ צְפַרְדְּעִים (“ếch”) và nên thu hẹp lại.'
  naturalness: Câu văn trang trọng, tự nhiên. Việc đặt chú thích [a] sau danh thần thay vì ngay sau “khẩn cầu” làm neo chú thích không khớp với nội dung chú thích; cần chuyển neo này. “Lũ ếch” giúp diễn đạt số nhiều xác định và tai họa đàn ếch cách tự nhiên.
  terminology: Giữ “Pha-ra-ôn”, “Môi-se”, “A-rôn”, “ta”, và “dâng sinh tế” phù hợp văn phong Kinh Thánh tiếng Việt. Dùng “Yahweh” để phản ánh trực tiếp יהוה và phù hợp chính sách thuật ngữ được nêu trong hồ sơ nguồn.
