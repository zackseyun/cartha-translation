  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: vi
  text: 'Bấy giờ, Pha-ra-ôn cho gọi Môi-se và A-rôn đến, rồi nói: “Hãy khẩn cầu[a] Yahweh cất lũ ếch khỏi ta và khỏi dân ta; ta sẽ để dân ấy ra đi, để họ dâng sinh tế cho Yahweh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ có thể mang nghĩa “nài xin tha thiết” hoặc “cầu thay”, mạnh hơn ý cầu nguyện thông thường.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và họ sẽ dâng sinh tế cho Yahweh.” Tiếng Hê-bơ-rơ có thể chỉ sự nối tiếp đơn thuần, dù trong ngữ cảnh này mệnh đề có lẽ nêu mục đích của việc cho dân đi.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: cho gọi ... đến
  rationale: Động từ קרא đi với לְ chỉ việc triệu gọi người nào đến; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ sắc thái Pha-ra-ôn sai gọi Môi-se cùng A-rôn đến.
- source_word: הַעְתִּירוּ
  choice: Hãy khẩn cầu
  rationale: Thể Hiphil của עתר trong ngữ cảnh cầu nguyện mang sắc thái nài xin tha thiết hoặc cầu thay; “khẩn cầu” vừa dễ hiểu vừa giữ được cường độ mạnh hơn lời cầu nguyện thông thường.
- source_word: אֶל יְהוָה / לַיהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong tiếng Việt để biểu thị trực tiếp danh giao ước יהוה, thay vì thay bằng tước hiệu “CHÚA”.
- source_word: וְיָסֵר
  choice: cất ... khỏi
  rationale: Hiphil của סור có nghĩa khiến rời đi, loại bỏ. Cấu trúc “cất ... khỏi” diễn đạt tự nhiên nội dung lời khẩn cầu và giữ các bổ ngữ chỉ sự tách khỏi Pha-ra-ôn cùng dân ông.
- source_word: הַצְפַרְדְּעִים
  choice: ếch nhái
  rationale: צְפַרְדֵּעַ chỉ loài ếch; “ếch nhái” là cách gọi tập hợp tự nhiên, phổ thông trong tiếng Việt và thích hợp với tai họa xuất hiện hàng loạt.
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: khỏi ta và dân ta
  rationale: Giữ cả hai đối tượng mà Pha-ra-ôn xin được giải thoát; giới từ מן lặp lại trong tiếng Hê-bơ-rơ được diễn đạt gọn, tự nhiên bằng một “khỏi” chi phối hai thành phần.
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: ta sẽ để dân ấy ra đi
  rationale: שלח trong mạch Xuất Ê-díp-tô Ký mang nghĩa thả hoặc cho dân ra đi; dạng cohortative thể hiện ý định hay lời hứa của Pha-ra-ôn. “Dân ấy” phân biệt dân Y-sơ-ra-ên với “dân ta” vừa nhắc đến.
- source_word: וְיִזְבְּחוּ
  choice: để họ dâng sinh tế
  rationale: זבח chỉ hành động dâng tế lễ bằng sinh vật. “Dâng sinh tế” chính xác hơn “dâng tế lễ” nói chung; liên từ được hiểu theo quan hệ mục đích phù hợp ngữ cảnh, nhưng khả năng phối hợp đơn thuần được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh יהוה. Bản dịch giữ đây là danh riêng của Đức Chúa Trời; “Đức Giê-hô-va” là hình thức tiếng Việt trang trọng, quen thuộc, không biến danh này thành một tước hiệu.
- issue: Quan hệ của mệnh đề וְיִזְבְּחוּ với lời hứa cho dân đi
  choice: 'mục đích: “để họ dâng sinh tế”'
  alternative: 'phối hợp đơn thuần: “và họ sẽ dâng sinh tế”'
  rationale: Động từ tiền tố sau lời tuyên bố mang sắc thái ý định của Pha-ra-ôn có thể biểu thị mục đích của việc cho dân đi. Tuy nhiên, וְ cũng có thể chỉ sự phối hợp, nên giữ cách đọc kia trong chú thích thay vì xóa bỏ tính mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ra-ôn”, “Môi-se”, “A-rôn” theo dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt; đại từ “ta” phù hợp lời vua nói. Dấu chú thích [a], [b] đều xuất hiện ngay tại nội dung liên quan.
