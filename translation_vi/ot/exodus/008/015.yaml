source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: vi
  text: 'Bấy giờ, các pháp sư nói với Pha-ra-ôn: “Đây là ngón tay của Đức Chúa Trời[a].” Nhưng lòng Pha-ra-ôn trở nên cứng cỏi[b], và ông không nghe họ, đúng như Yahweh[c] đã phán.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngón tay của Đức Chúa Trời” là hình ảnh chỉ quyền năng trực tiếp của Đức Chúa Trời đang hành động.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “lòng Pha-ra-ôn trở nên mạnh/cứng.” Tiếng Hê-bơ-rơ trong mệnh đề này không nói rõ ai làm cho lòng ông cứng lại.'
    reason: lexical_alternative
  - marker: c
    text: 'Tiếng Hê-bơ-rơ: YHWH, danh riêng của Đức Chúa Trời; theo truyền thống thường được dịch là “CHÚA” hoặc “ĐỨC GIÊ-HÔ-VA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: các pháp sư
  rationale: Chỉ những chuyên gia nghi lễ và huyền thuật của Pha-ra-ôn. “Các pháp sư” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt và không xác định quá mức chức vụ triều đình của họ.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: Đây là ngón tay của Đức Chúa Trời
  rationale: Giữ nguyên hình ảnh cụ thể trong mệnh đề không có động từ của tiếng Hê-bơ-rơ, đồng thời dùng chú thích để giải thích ý nghĩa biểu trưng về quyền năng trực tiếp của Đức Chúa Trời.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Dù từ này có thể mang nghĩa số nhiều hoặc bất định trong một số ngữ cảnh, ở đây nghĩa số ít chỉ Đức Chúa Trời là phù hợp nhất với cuộc đối đầu trong trình thuật.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: lòng Pha-ra-ôn trở nên cứng cỏi
  rationale: Động từ חזק diễn tả lòng trở nên mạnh, cứng hoặc kiên quyết. Cách dịch này nêu kết quả nhưng không thêm một tác nhân gây nên sự cứng lòng mà câu Hê-bơ-rơ không nói rõ.
- source_word: שָׁמַע אֲלֵהֶם
  choice: không nghe họ
  rationale: שׁמע đi với אֶל ở đây có nghĩa nghe hoặc làm theo. “Không nghe họ” tự nhiên trong tiếng Việt và vẫn để ngữ cảnh truyền đạt ý không chịu lưu tâm.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: đúng như Yahweh đã phán
  rationale: Công thức này nhắc lại lời tuyên bố trước đó của Đức Chúa Trời; “đã phán” phù hợp với trình tự thời gian và sắc thái trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước YHWH thay vì thay thế bằng một tước hiệu, phù hợp với chứng cứ trực tiếp của văn bản Hê-bơ-rơ.
theological_decisions:
- issue: Danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; Chúa
  rationale: Nguyên văn dùng danh riêng YHWH. “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Tác nhân làm lòng Pha-ra-ôn cứng lại
  choice: lòng Pha-ra-ôn trở nên cứng cỏi
  alternative: Đức Chúa Trời làm lòng Pha-ra-ôn cứng lại; Pha-ra-ôn làm lòng mình cứng lại
  rationale: Mệnh đề này không nêu rõ tác nhân. Cách dịch được chọn bảo tồn sự căng thẳng thần học và không quy hành động trực tiếp cho Đức Chúa Trời hay Pha-ra-ôn ngoài điều câu văn nói.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ hình ảnh “ngón tay” của nguyên văn; dùng “trở nên cứng cỏi” để tránh bổ sung tác nhân; chuyển tự YHWH là “Yahweh”.
