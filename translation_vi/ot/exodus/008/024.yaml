source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: vi
  text: 'Bấy giờ Pha-ra-ôn nói: “Ta sẽ cho các ngươi đi để dâng sinh tế cho Yahweh, Đức Chúa Trời của các ngươi, trong hoang mạc. Chỉ có điều, các ngươi không được đi quá xa. Hãy khẩn cầu cho ta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw liên tiếp tiếp nối diễn biến câu chuyện; “Bấy giờ” diễn đạt trình tự tự nhiên trong tiếng Việt.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm quen thuộc trong tiếng Việt đối với tước hiệu vua Ai Cập.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: Ta sẽ cho các ngươi đi
  rationale: Trong bối cảnh thương lượng, שׁלח mang nghĩa cho phép hoặc phóng thích để họ ra đi. Đại từ אָנֹכִי được thể hiện tự nhiên qua lời xưng “Ta” của nhà vua, không cần thêm “chính ta” vì ngữ cảnh không buộc phải nhấn mạnh đối lập.
- source_word: וּזְבַחְתֶּם
  choice: để dâng sinh tế
  rationale: Liên từ cùng dạng động từ hoàn thành sau lời cho phép diễn tả mục đích hoặc kết quả dự định; “để” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ trực tiếp danh giao ước יהוה bằng dạng “Yahweh”; giới từ ל được diễn đạt bằng “cho” trong kết cấu dâng sinh tế.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Diễn đạt cấu trúc sở hữu, xác định Yahweh là Đức Chúa Trời của dân Israel; cách gọi trang trọng nhưng dễ hiểu.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, không canh tác; “hoang mạc” phù hợp bối cảnh Xuất Ai Cập mà không nhất thiết giới hạn vào một sa mạc toàn cát.
- source_word: רַק
  choice: Chỉ có điều
  rationale: Dẫn vào điều kiện hạn chế mà Pha-ra-ôn đặt ra, tự nhiên hơn một từ nối đơn lẻ trong tiếng Việt.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: các ngươi không được đi quá xa
  rationale: Động từ nguyên thể tuyệt đối đi với động từ hữu hạn tạo sắc thái nhấn mạnh; “không được đi quá xa” truyền đạt rõ lệnh hạn chế.
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: Hãy khẩn cầu cho ta
  rationale: עתר ở thể Hiphil nói đến lời cầu xin tha thiết; “khẩn cầu” giữ sắc thái nghiêm trọng và cụm “cho ta” thể hiện việc cầu thay vì lợi ích của Pha-ra-ôn.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” giúp phân biệt danh giao ước này với tước hiệu אֱלֹהִים trong cùng câu, không thay nó bằng một tước hiệu.
- issue: Đối tượng của lời khẩn cầu
  choice: Không thêm rõ “với Yahweh”
  alternative: Hãy khẩn cầu Yahweh cho ta
  rationale: Nguyên văn chỉ nói “hãy khẩn cầu cho ta”; dù ngữ cảnh cho thấy lời khẩn cầu hướng đến Yahweh, bản dịch không bổ sung đối tượng không được nêu minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ta/các ngươi” để phù hợp lời của một vị vua nói với Môi-se và A-rôn; giữ câu mệnh lệnh ngắn ở cuối để phản ánh sức nặng trong lời Pha-ra-ôn.
