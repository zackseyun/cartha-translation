  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hê-bơ-rơ: Yahweh sẽ biệt riêng miền Gô-sen, nơi dân Ngài cư ngụ, để không có עָרֹב tại đó, nhằm để Pha-ra-ôn biết rằng Ngài là Yahweh ở giữa xứ. Cách dịch “bầy côn trùng” thận trọng, phù hợp với nghĩa chưa xác định chắc chắn của עָרֹב, và không thu hẹp vô cớ thành một loài cụ thể.'
