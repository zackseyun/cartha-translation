id: EXO.8.18
reference: Exodus 8:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: vi
  text: Nhưng trong ngày ấy, Ta sẽ biệt riêng miền Gô-sen, nơi dân Ta cư ngụ, để không có bầy côn trùng nào[a] ở đó, hầu cho ngươi biết rằng Ta là Yahweh ở giữa xứ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bầy sinh vật gây hại” hoặc “bầy ruồi”; từ Hê-bơ-rơ עָרֹב không xác định chắc chắn loài nào.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ở giữa đất” hoặc “ở giữa thế gian.” Trong ngữ cảnh này, từ Hê-bơ-rơ có lẽ chỉ xứ Ai Cập.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: Ta sẽ biệt riêng
  rationale: Dạng Hiphil của פלא tại đây diễn tả việc phân biệt và đối xử riêng với một vùng. “Biệt riêng” vừa tự nhiên trong tiếng Việt vừa thể hiện sự bảo vệ đặc biệt dành cho Gô-sen.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: miền Gô-sen
  rationale: אֶרֶץ trong ngữ cảnh địa lý này chỉ một vùng lãnh thổ; “miền Gô-sen” tự nhiên hơn “đất Gô-sen” trong tiếng Việt hiện đại.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: nơi dân Ta cư ngụ
  rationale: עֹמֵד עַל khi nói về một vùng đất có thể diễn tả việc ở lại hay cư trú tại đó; “cư ngụ” truyền đạt đúng ý nghĩa theo ngữ cảnh.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: để không có ... nào ở đó
  rationale: 'Cấu trúc nguyên mẫu diễn tả mục đích hoặc kết quả: tai họa ấy sẽ không hiện diện tại Gô-sen.'
- source_word: עָרֹב
  choice: bầy côn trùng
  rationale: Danh từ này chỉ một bầy hay đàn sinh vật gây hại, nhưng loài cụ thể không chắc chắn. “Bầy côn trùng” giữ được tính khái quát hơn cách dịch riêng là ruồi.
- source_word: לְמַעַן תֵּדַע
  choice: hầu cho ngươi biết
  rationale: Giữ rõ ý chỉ mục đích của לְמַעַן và ngôi thứ hai số ít, hướng lời nói đến Pha-ra-ôn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: ở giữa xứ
  rationale: בְּקֶרֶב diễn tả vị trí ở giữa hoặc ngay trong phạm vi một nơi; הָאָרֶץ theo mạch văn trước hết chỉ xứ Ai Cập, nhưng từ này cũng có thể mang nghĩa rộng hơn.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước יְהוָה; giữ dạng phiên âm giúp phân biệt danh riêng này với các tước hiệu.
- issue: Phạm vi nghĩa của בְּקֶרֶב הָאָרֶץ
  choice: ở giữa xứ
  alternative: ở giữa đất; ở giữa thế gian
  rationale: Trong trình thuật về các tai vạ, cụm từ rất có thể nói đến sự hiện diện và hành động của Yahweh ngay trong xứ Ai Cập. Chú thích vẫn bảo lưu khả năng הָאָרֶץ được hiểu rộng hơn.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Đại từ “Ta/ngươi” giữ sắc thái lời phán trực tiếp của Đức Chúa Trời với Pha-ra-ôn. Các địa danh và danh Yahweh được phiên âm nhất quán; chú thích đặt đúng sau những cụm từ có phương án dịch khác.
