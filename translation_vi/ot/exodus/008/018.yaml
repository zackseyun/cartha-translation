  terminology: “Yahweh” giữ đúng danh riêng יהוה theo quyết định thuật ngữ của POB. “Miền Gô-sen” là cách gọi địa danh rõ ràng. “Ở giữa xứ” phản ánh được hình ảnh không gian của בְּקֶרֶב הָאָרֶץ mà không quyết định quá mức phạm vi của הָאָרֶץ. Các chú thích bảo lưu hợp lý tính bất định của עָרֹב và khả năng nghĩa rộng hơn của הָאָרֶץ; các ký hiệu chú thích được đặt đúng tại từ/cụm từ liên quan.
