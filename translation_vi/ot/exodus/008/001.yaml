  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹ֣ר אֶֽל אַהֲרֹ֗ן נְטֵ֤ה אֶת יָדְ/ךָ֙ בְּ/מַטֶּ֔/ךָ עַל הַ֨/נְּהָרֹ֔ת עַל הַ/יְאֹרִ֖ים וְ/עַל הָ/אֲגַמִּ֑ים וְ/הַ֥עַל אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy nói với A-rôn: ‘Hãy giơ tay con với cây gậy trên các sông, các kênh[a] và các ao, khiến ếch lên trên đất Ai Cập.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các nhánh sông Nin”; từ Hê-bơ-rơ này trong bối cảnh Ai Cập thường chỉ các dòng nước thuộc hệ thống sông Nin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... phán
  rationale: Dạng kể chuyện tiếp diễn đưa trình thuật sang lời phán kế tiếp; “phán” là động từ trang trọng, tự nhiên khi Đức Chúa Trời nói.
- source_word: אֱמֹר
  choice: Hãy nói
  rationale: Thể mệnh lệnh được chuyển trực tiếp và tự nhiên.
- source_word: נְטֵה אֶת־יָדְךָ בְּמַטֶּךָ
  choice: Hãy cầm gậy trong tay và giơ ra
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, thể hiện bàn tay được giơ ra cùng cây gậy dùng làm phương tiện.
- source_word: הַנְּהָרֹת
  choice: các sông
  rationale: Giữ nghĩa thông thường của danh từ và phân biệt với hai loại thủy vực tiếp theo.
- source_word: הַיְאֹרִים
  choice: các kênh
  rationale: Trong bối cảnh Ai Cập, từ này chỉ các dòng nước hoặc nhánh kênh liên hệ đến sông Nin; “các kênh” ngắn gọn và phân biệt với “các sông”.
- source_word: הָאֲגַמִּים
  choice: các ao
  rationale: Chỉ những vùng nước đọng; “ao” là từ phổ thông, cụ thể và tự nhiên.
- source_word: וְהַעַל
  choice: khiến ... tràn lên
  rationale: Giữ sắc thái khiến cho đi lên của thể Hiphil, đồng thời diễn đạt tự nhiên sự xuất hiện dày đặc của ếch nhái.
- source_word: הַצְפַרְדְּעִים
  choice: ếch nhái
  rationale: Cách gọi tập hợp tự nhiên trong tiếng Việt đối với loài vật gây tai họa ở đây.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: tràn lên đất Ai Cập
  rationale: Giữ hướng chuyển động “lên/trên” mà không thêm ý “khắp” vốn không được nói rõ trong câu.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH; phiên âm “Yahweh” bảo tồn tính chất danh riêng và tránh thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời của Yahweh; các mệnh lệnh giữ nhịp rõ ràng. “Môi-se”, “A-rôn” và “Ai Cập” theo dạng tên quen thuộc trong tiếng Việt.
