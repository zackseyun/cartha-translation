revisions:
- from: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy nói với A-rôn: ‘Hãy cầm gậy trong tay và giơ ra trên các sông, các kênh[a] và các ao, khiến ếch nhái tràn lên đất Ai Cập.’”'
  to: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy nói với A-rôn: ‘Hãy giơ tay con với cây gậy trên các sông, các kênh[a] và các ao, khiến ếch lên trên đất Ai Cập.’”'
  rationale: Bản sửa bảo toàn mệnh lệnh giơ tay với cây gậy, giữ ba hạng thủy vực, và chuyển הַעַל theo nghĩa khiến cho lên mà không thêm ý “tràn”. “Ếch” phản ánh chính xác danh từ nguyên ngữ.
