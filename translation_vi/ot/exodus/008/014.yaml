  text: וַ/יַּעֲשׂוּ כֵ֨ן הַ/חַרְטֻמִּ֧ים בְּ/לָטֵי/הֶ֛ם לְ/הוֹצִ֥יא אֶת הַ/כִּנִּ֖ים וְ/לֹ֣א יָכֹ֑לוּ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: vi
  text: Các thuật sĩ cũng dùng những thuật bí truyền của mình làm như vậy để làm cho muỗi mắt[a] xuất hiện, nhưng họ không thể. Muỗi mắt ở trên người và súc vật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chấy.” Không xác định chắc chắn từ Hê-bơ-rơ này chỉ loài côn trùng nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: các thuật sĩ
  rationale: Chỉ những chuyên viên nghi lễ và pháp thuật trong triều Pha-ra-ôn; “thuật sĩ” là cách gọi tự nhiên, quen thuộc mà không xác định quá mức phương thức của họ.
- source_word: בְּלָטֵיהֶם
  choice: dùng những thuật bí truyền của mình
  rationale: Diễn đạt các phương thuật kín giấu hoặc huyền thuật, vừa rõ nghĩa trong tiếng Việt hiện đại vừa giữ sắc thái bí mật của từ Hê-bơ-rơ.
- source_word: לְהוֹצִיא
  choice: để tạo ra
  rationale: Trong ngữ cảnh này, động từ gây khiến của יצא nói đến nỗ lực làm cho loài côn trùng xuất hiện; “tạo ra” tự nhiên hơn “đem ra” trong tiếng Việt.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: muỗi mắt
  rationale: Danh tính chính xác của côn trùng không chắc chắn. “Muỗi mắt” là một cách hiểu hợp lý trong bối cảnh tai họa, còn “chấy” được giữ trong chú thích như phương án truyền thống.
- source_word: וְלֹא יָכֹלוּ
  choice: nhưng họ không thể làm được
  rationale: Thể hiện trực tiếp sự bất lực của các thuật sĩ và tạo câu tiếng Việt tự nhiên.
- source_word: בָּאָדָם
  choice: trên người
  rationale: אָדָם ở đây mang nghĩa tập hợp, chỉ loài người nói chung chứ không riêng một người nam; “người” giữ được nghĩa ấy và kết hợp tự nhiên với “súc vật”.
- source_word: וּבַבְּהֵמָה
  choice: và súc vật
  rationale: בְּהֵמָה là danh từ tập hợp chỉ loài vật, thường đặc biệt là gia súc; “súc vật” giữ nét đối xứng với “người” và phù hợp văn cảnh.
- source_word: וַתְּהִי ... בָּאָדָם וּבַבְּהֵמָה
  choice: Muỗi mắt vẫn bám trên người và súc vật
  rationale: Động từ “bám” làm rõ quan hệ tự nhiên giữa côn trùng và vật chủ; “vẫn” nêu sự tiếp diễn của tình trạng sau khi các thuật sĩ thất bại.
theological_decisions:
- issue: Cách dịch אָדָם với nghĩa tập hợp
  choice: người
  alternative: loài người; con người; người nam
  rationale: Trong câu này, từ chỉ nhân loại nói chung và đối ứng với danh từ tập hợp בְּהֵמָה. “Người” chính xác về giống, tự nhiên trong tiếng Việt, và không biến nghĩa tập hợp thành một cá nhân nam.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thuật sĩ” và “thuật bí truyền” để giữ bối cảnh cung đình cùng sắc thái huyền thuật mà không thêm cách giải thích giáo phái. Dấu chú thích [a] được đặt ngay sau tên côn trùng.
