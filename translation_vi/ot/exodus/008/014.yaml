review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính: các thuật sĩ dùng thuật bí truyền để cố làm xuất hiện côn trùng nhưng thất bại, và côn trùng ở trên người lẫn súc vật. Tuy nhiên, «vẫn bám» thêm hai sắc thái không được nêu trong tiếng Hê-bơ-rơ: ý tiếp diễn («vẫn») và cách thức bám dính («bám»). Động từ וַתְּהִי chỉ nói rằng côn trùng đã/ở trên người và súc vật.'
  naturalness: «Muỗi mắt» và «súc vật» phù hợp văn phong Kinh Thánh hiện đại; câu sửa giữ lối diễn đạt tự nhiên, trang trọng. «Làm cho ... xuất hiện» diễn đạt mục đích của לְהוֹצִיא mà không hàm ý chắc chắn rằng các thuật sĩ có năng lực sáng tạo.
  terminology: «Thuật sĩ» phù hợp với הַחַרְטֻמִּים; «thuật bí truyền» chuyển tải sắc thái của בְּלָטֵיהֶם. «Người và súc vật» bảo toàn cặp danh từ tập hợp אָדָם / בְּהֵמָה. Chú thích về «chấy» cần được giữ vì danh tính của כִּנִּים không chắc chắn.
  issues:
  - severity: medium
    issue: «Muỗi mắt vẫn bám trên người và súc vật» thêm ý nghĩa.
    rationale: Nguyên văn chỉ xác nhận sự hiện diện của côn trùng «trên/trong» người và súc vật. Từ «vẫn» suy ra sự tiếp diễn, còn «bám» xác định quan hệ vật lý, nhưng cả hai không được biểu thị rõ trong câu Hê-bơ-rơ.
  revised_text: Các thuật sĩ cũng dùng những thuật bí truyền của mình làm như vậy để làm cho muỗi mắt[a] xuất hiện, nhưng họ không thể. Muỗi mắt ở trên người và súc vật.
