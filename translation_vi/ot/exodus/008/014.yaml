revisions:
- from: Các thuật sĩ cũng dùng những thuật bí truyền của mình làm như vậy để tạo ra muỗi mắt[a], nhưng họ không thể làm được. Muỗi mắt vẫn bám trên người và súc vật.
  to: Các thuật sĩ cũng dùng những thuật bí truyền của mình làm như vậy để làm cho muỗi mắt[a] xuất hiện, nhưng họ không thể. Muỗi mắt ở trên người và súc vật.
  rationale: Chỉ sửa mệnh đề cuối để không thêm ý «vẫn» hay «bám», đồng thời thay «tạo ra» bằng «làm cho ... xuất hiện» để phản ánh sát hơn mục đích «đem ra/làm xuất hiện» của לְהוֹצִיא. Các lựa chọn từ ngữ còn lại và vị trí chú thích đều phù hợp.
