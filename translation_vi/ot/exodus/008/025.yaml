revisions:
- from: 'Môi-se nói: “Này, tôi sẽ rời khỏi bệ hạ và khẩn cầu Yahweh. Ngày mai, bầy sinh vật lúc nhúc[a] sẽ rời khỏi Pha-ra-ôn, các bề tôi và dân của bệ hạ. Chỉ xin Pha-ra-ôn đừng tiếp tục lừa dối bằng cách không cho dân đi dâng sinh tế cho Yahweh.”'
  to: 'Môi-se nói: “Này, tôi sắp rời khỏi bệ hạ và sẽ khẩn cầu Yahweh. Ngày mai, bầy côn trùng[a] sẽ rời khỏi Pha-ra-ôn, các bề tôi của người và dân của người. Nhưng Pha-ra-ôn đừng tiếp tục giở trò lừa dối bằng cách không cho dân đi dâng sinh tế cho Yahweh.”'
  rationale: Bản sửa dùng “sắp rời khỏi” cho sắc thái gần kề của phân từ יוֹצֵא; thay cách diễn đạt gợi sinh vật bò bằng “bầy côn trùng” để không thêm chi tiết ngoài nguyên văn; và làm rõ lực cảnh báo của câu cuối mà vẫn không quyết định quá mức sắc thái đang được tranh luận của הָתֵל.
