source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: vi
  text: 'Môi-se nói: “Này, tôi sắp rời khỏi bệ hạ và sẽ khẩn cầu Yahweh. Ngày mai, bầy côn trùng[a] sẽ rời khỏi Pha-ra-ôn, các bề tôi của người và dân của người. Nhưng Pha-ra-ôn đừng tiếp tục giở trò lừa dối bằng cách không cho dân đi dâng sinh tế cho Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ עָרֹב có thể chỉ cụ thể hơn một bầy ruồi hoặc các loài côn trùng tụ thành đàn; không chắc chính xác là loài nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trực tiếp của lời Môi-se, đồng thời tự nhiên trong văn phong trang trọng hiện đại.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: tôi sẽ rời khỏi bệ hạ
  rationale: Diễn đạt tự nhiên chuyển động đi ra khỏi nơi Pha-ra-ôn hiện diện; đại từ “bệ hạ” phù hợp khi trực tiếp thưa với vua.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: và khẩn cầu Yahweh
  rationale: “Khẩn cầu” thể hiện lời cầu xin tha thiết và tính chất chuyển cầu của עתר, cụ thể hơn từ “cầu nguyện” nói chung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển âm danh riêng giao ước יהוה, không thay bằng một tước hiệu.
- source_word: וְסָר
  choice: sẽ rời khỏi
  rationale: Giữ nghĩa nội động từ “rút đi, lìa khỏi” và phù hợp với giới từ được lặp lại sau đó.
- source_word: הֶעָרֹב
  choice: bầy sinh vật lúc nhúc
  rationale: Không xác định quá mức đây là ruồi hay một loài cụ thể; “bầy” và “lúc nhúc” truyền đạt ý một tập hợp sinh vật kéo đến dày đặc.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: khỏi Pha-ra-ôn, các bề tôi và dân của bệ hạ
  rationale: Truyền đạt đầy đủ ba đối tượng chịu tai họa; “bề tôi” hợp với ngữ cảnh hoàng gia của עֲבָדָיו.
- source_word: מָחָר
  choice: Ngày mai
  rationale: Bản dịch trực tiếp của trạng từ thời gian và được đặt đầu câu tiếng Việt để câu rõ ràng.
- source_word: רַק
  choice: Chỉ xin
  rationale: Giữ lực giới hạn/cảnh báo của רַק; “xin” phù hợp hình thức phát biểu trực tiếp với vua mà không làm mất sự cứng rắn.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: đừng tiếp tục lừa dối
  rationale: יסף diễn tả sự tiếp diễn hoặc tái phạm; התל trong ngữ cảnh nhấn mạnh hành vi gian dối hơn là chỉ chế giễu bằng lời.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: bằng cách không cho dân đi
  rationale: Nêu hành động không phóng thích dân như nội dung cụ thể của sự lừa dối.
- source_word: לִזְבֹּחַ
  choice: dâng sinh tế
  rationale: Giữ nghĩa thờ phượng bằng việc hiến tế, cụ thể hơn từ “thờ phượng” nói chung.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng danh riêng יהוה; chuyển âm “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Nhận diện chính xác עָרֹב
  choice: bầy sinh vật lúc nhúc
  alternative: bầy ruồi / bầy côn trùng / bầy thú hỗn tạp
  rationale: Chỉ vật chính xác của danh từ Hê-bơ-rơ còn bất định, nên bản dịch dùng cách gọi khái quát và ghi chú thay vì quyết định một loài cụ thể.
- issue: Sắc thái của הָתֵל
  choice: lừa dối
  alternative: chế nhạo / giở trò
  rationale: Trong mạch truyện, lời cảnh báo liên quan việc Pha-ra-ôn hứa cho dân đi rồi không thực hiện. “Lừa dối” giữ được yếu tố gian trá, trong khi các khả năng có sắc thái khinh nhờn hoặc giễu cợt vẫn thuộc trường nghĩa của từ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “bệ hạ” trong lời trực tiếp với Pha-ra-ôn; tránh lối dịch cổ và không xác định quá mức loài sinh vật trong tai họa.
