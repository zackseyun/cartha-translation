review_pass:
  verdict: revise
  source_fidelity: Cần sửa nhẹ để phản ánh sát hơn phân từ יוֹצֵא mang nghĩa sắp/đang rời đi, thay vì tương lai đơn. Cách gọi “bầy sinh vật lúc nhúc” thêm sắc thái bò lúc nhúc không có trong nguyên văn và không hợp với khả năng chỉ côn trùng bay; nên dùng cách gọi khái quát hơn kèm chú thích bất định.
  naturalness: Bản sửa duy trì văn phong trang trọng, hiện đại. “Bệ hạ” được giữ trong lời trực tiếp, còn “dân của người” diễn đạt tự nhiên quan hệ sở hữu của Pha-ra-ôn. “Giở trò lừa dối” tự nhiên hơn “tiếp tục lừa dối” và giữ sắc thái hành vi gian trá/chế nhạo của הָתֵל.
  terminology: Giữ “Yahweh,” “Pha-ra-ôn,” “bề tôi,” và “dâng sinh tế.” “Bầy côn trùng” không xác định một loài cụ thể; chú thích bảo lưu sự bất định của עָרֹב.
  issues:
