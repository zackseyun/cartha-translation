    issue: “tôi sẽ rời khỏi bệ hạ”
    rationale: יוֹצֵא là phân từ, trong ngữ cảnh này diễn tả hành động sắp diễn ra/đang khởi sự. “Tôi sắp rời khỏi bệ hạ” phản ánh sắc thái ấy tốt hơn.
  - severity: medium
    issue: “bầy sinh vật lúc nhúc”
    rationale: Cụm này gợi đặc biệt sinh vật bò lúc nhúc, một nét không có trong עָרֹב, trong khi từ Hê-bơ-rơ này thường được hiểu là một đàn côn trùng hoặc sinh vật bay tụ thành bầy, dù loài chính xác còn bất định.
  - severity: low
    issue: “Chỉ xin Pha-ra-ôn đừng...”
    rationale: “Xin” làm nhẹ lời cảnh cáo. רַק mở đầu một điều kiện/lời cảnh báo; “Nhưng Pha-ra-ôn đừng...” trực tiếp và tự nhiên hơn.
