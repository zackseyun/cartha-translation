revisions:
- from: Vì nếu ngươi không để dân Ta ra đi, thì này, Ta sẽ sai đàn côn trùng[a] đến trên ngươi, các bề tôi ngươi, dân ngươi và vào nhà cửa ngươi. Nhà cửa Ai Cập sẽ đầy đàn côn trùng, cả mặt đất[b] nơi họ đang ở cũng vậy.
  to: Vì nếu ngươi không để dân Ta ra đi, này, Ta sẽ giáng bầy côn trùng[a] xuống trên ngươi, trên các bề tôi ngươi, trên dân ngươi và vào nhà cửa ngươi. Các nhà của người Ai Cập sẽ đầy bầy côn trùng ấy, và cả mặt đất mà họ ở trên cũng vậy.[b]
  rationale: Bản sửa làm cho các cụm chỉ hướng và mệnh đề cuối tự nhiên, chính xác hơn theo tiếng Hê-bơ-rơ, đồng thời giữ nguyên sắc thái trang trọng, các đại từ, và sự không chắc chắn về bản chất của עָרֹב.
