translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi/Ta” để giữ sắc thái của lời Đức Chúa Trời trực tiếp phán với Pha-ra-ôn. Tránh xác định quá mức loài sinh vật trong עָרֹב; dùng “bề tôi” cho ngữ cảnh hoàng gia.
