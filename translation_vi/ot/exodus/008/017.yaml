  text: כִּ֣י אִם אֵינְ/ךָ֮ מְשַׁלֵּ֣חַ אֶת עַמִּ/י֒ הִנְ/נִי֩ מַשְׁלִ֨יחַ בְּ/ךָ֜ וּ/בַ/עֲבָדֶ֧י/ךָ וּֽ/בְ/עַמְּ/ךָ֛ וּ/בְ/בָתֶּ֖י/ךָ אֶת הֶ/עָרֹ֑ב וּ/מָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֨יִם֙ אֶת הֶ֣/עָרֹ֔ב וְ/גַ֥ם הָ/אֲדָמָ֖ה אֲשֶׁר הֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: vi
  text: Vì nếu ngươi không để dân Ta ra đi, này, Ta sẽ giáng bầy côn trùng[a] xuống trên ngươi, trên các bề tôi ngươi, trên dân ngươi và vào nhà cửa ngươi. Các nhà của người Ai Cập sẽ đầy bầy côn trùng ấy, và cả mặt đất mà họ ở trên cũng vậy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đàn ruồi.” Từ Hê-bơ-rơ עָרֹב có thể chỉ một bầy sinh vật; theo truyền thống, từ này thường được hiểu là ruồi, nhưng không xác định chắc chắn loài.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đất.” Từ Hê-bơ-rơ אֲדָמָה có thể chỉ mặt đất hoặc đất đai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Vì nếu
  rationale: Giữ quan hệ giải thích và điều kiện của lời cảnh cáo nối với câu trước.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: ngươi không để dân Ta ra đi
  rationale: Trong trình thuật Xuất Hành, שׁלח diễn tả việc cho phép dân được rời đi; cách nói này tự nhiên và chính xác trong tiếng Việt.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: thì này, Ta sẽ sai
  rationale: “Thì này” giữ sắc thái long trọng, gây chú ý của הִנְנִי; thì tương lai tiếng Việt truyền đạt hành động sắp xảy ra và chắc chắn của cấu trúc phân từ.
- source_word: הֶעָרֹב
  choice: đàn côn trùng
  rationale: Danh từ Hê-bơ-rơ chỉ một bầy/đàn sinh vật gây hại nhưng không xác định chắc chắn loài; “đàn côn trùng” rõ nghĩa trong tiếng Việt mà không khẳng định đó chỉ là ruồi.
- source_word: בְּךָ ... וּבַעֲבָדֶיךָ וּבְעַמְּךָ
  choice: đến trên ngươi, các bề tôi ngươi, dân ngươi
  rationale: Giữ sự lặp lại và nhịp tăng tiến của các đối tượng chịu tai họa, đồng thời dùng “đến trên” theo lối diễn đạt trang trọng, dễ hiểu.
- source_word: וּבְבָתֶּיךָ
  choice: và vào nhà cửa ngươi
  rationale: Trong ngữ cảnh đàn côn trùng được sai đến, “vào” diễn tả hướng chuyển động tự nhiên và chuẩn bị cho mệnh đề nhà cửa bị lấp đầy.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: Nhà cửa Ai Cập sẽ đầy
  rationale: Giữ cấu trúc chỉ kết quả của tiếng Hê-bơ-rơ bằng câu tiếng Việt gọn và tự nhiên.
- source_word: וְגַם הָאֲדָמָה
  choice: cả mặt đất cũng vậy
  rationale: אֲדָמָה có thể là đất hoặc mặt đất; ở đây “mặt đất” tạo thế đối chiếu tự nhiên với nhà cửa và diễn tả bề mặt bị đàn côn trùng bao phủ.
- source_word: אֲשֶׁר הֵם עָלֶיהָ
  choice: nơi họ đang ở
  rationale: Diễn đạt tự nhiên quan hệ không gian của nguyên văn mà không thêm ý “đứng”; đại từ số nhiều được giữ nguyên theo tiếng Hê-bơ-rơ.
