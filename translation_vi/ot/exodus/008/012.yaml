- from: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy nói với A-rôn: ‘Hãy giơ cây gậy của anh ra và đập vào bụi đất; bụi đất sẽ biến thành muỗi mắt[a] khắp đất Ai Cập.’”'
  to: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy nói với A-rôn: ‘Hãy giơ cây gậy của anh ra và đập vào bụi đất; bụi đất sẽ biến thành muỗi nhỏ[a] khắp đất Ai Cập.’”'
  rationale: Chỉ thay cách gọi «muỗi mắt» bằng «muỗi nhỏ» để đạt cách diễn đạt hiện đại, dễ hiểu hơn mà vẫn theo lựa chọn “gnats” của bản tiếng Anh. Chú thích được chỉnh để bảo tồn và diễn đạt tự nhiên hơn sự bất định từ vựng của כִּנִּים.
