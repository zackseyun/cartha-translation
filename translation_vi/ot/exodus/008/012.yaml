source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹר֙ אֶֽל אַהֲרֹ֔ן נְטֵ֣ה אֶֽת מַטְּ/ךָ֔ וְ/הַ֖ךְ אֶת עֲפַ֣ר הָ/אָ֑רֶץ וְ/הָיָ֥ה לְ/כִנִּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy nói với A-rôn: ‘Hãy giơ cây gậy của anh ra và đập vào bụi đất; bụi đất sẽ biến thành muỗi nhỏ[a] khắp đất Ai Cập.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chấy”; từ Hê-bơ-rơ chỉ một loại côn trùng nhỏ đốt hoặc gây khó chịu, và không chắc chắn chính xác là loài nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước thay vì thay thế bằng một tước hiệu; cách này phản ánh trực tiếp danh YHWH trong bản Hê-bơ-rơ.
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: “Bấy giờ” diễn đạt diễn tiến của mạch kể; “phán” là động từ tiếng Việt tự nhiên và trang trọng khi Đức Chúa Trời truyền lời.
- source_word: אֱמֹר
  choice: Hãy nói
  rationale: Giữ lực mệnh lệnh trực tiếp dành cho Môi-se và dẫn vào lời ông phải truyền cho A-rôn.
- source_word: נְטֵה אֶת מַטְּךָ
  choice: Hãy giơ cây gậy của anh ra
  rationale: Diễn đạt động tác đưa hoặc vươn gậy ra bằng tiếng Việt tự nhiên; đại từ “anh” phù hợp với lời Môi-se nói với người anh A-rôn.
- source_word: וְהַךְ
  choice: và đập vào
  rationale: Giữ nghĩa hành động mạnh, có chủ ý của động từ נכה mà không dùng lối nói cổ.
- source_word: עֲפַר הָאָרֶץ
  choice: bụi đất
  rationale: Cụm từ gọn, tự nhiên trong tiếng Việt và vẫn giữ cả ý bụi mịn lẫn nguồn gốc từ mặt đất.
- source_word: וְהָיָה לְכִנִּם
  choice: bụi đất sẽ biến thành muỗi mắt
  rationale: “Biến thành” làm rõ kết quả biến đổi hàm ý trong ngữ cảnh; “muỗi mắt” là một cách gọi hiện đại có thể hiểu được, còn chú thích giữ lại sự bất định về loài côn trùng.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: khắp đất Ai Cập
  rationale: Diễn đạt tự nhiên phạm vi toàn thể do בְּכָל chỉ ra.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo tồn tính chất danh riêng và tránh thay nó bằng tước hiệu hoặc dùng dạng phiên âm bắt nguồn từ “Jehovah”.
- issue: Chủ thể biến đổi bụi đất
  choice: Giữ cấu trúc “bụi đất sẽ biến thành” mà không nêu tác nhân
  alternative: Yahweh sẽ biến bụi đất thành
  rationale: Nguyên văn mô tả kết quả bằng וְהָיָה mà không nói rõ tác nhân trong mệnh đề này; bản dịch không tự bổ sung để tránh giải quyết điều văn bản để ngầm hiểu.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng nhưng dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời, các mệnh lệnh ngắn gọn, và giữ danh Yahweh. Đại từ “anh” trong lời truyền cho A-rôn phản ánh quan hệ anh em với Môi-se mà không làm câu văn cổ kính.
