  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: vi
  text: Con phải đặt bánh của sự hiện diện trên bàn trước mặt Ta luôn luôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “bánh của sự hiện diện”; theo cách gọi truyền thống: “bánh trưng bày.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Con phải ... đặt
  rationale: Động từ נתן có nghĩa rộng là “trao, để, đặt”; trong chỉ thị về vật dụng thánh, “đặt” tự nhiên và chính xác. Cấu trúc “phải” diễn đạt mệnh lệnh trực tiếp.
- source_word: עַל הַ/שֻּׁלְחָן
  choice: trên bàn
  rationale: Giới từ עַל chỉ vị trí ở trên; danh từ xác định nói đến chiếc bàn vừa được mô tả.
- source_word: לֶחֶם פָּנִים
  choice: bánh Hiện Diện
  rationale: Cụm liên kết theo sát nghĩa là “bánh của sự hiện diện/nhan”; “bánh Hiện Diện” giữ được thuật ngữ nghi lễ và phân biệt với לְפָנַי ở sau, thay vì diễn giải cả hai thành cùng một ý.
- source_word: לְ/פָנַ/י
  choice: trước mặt Ta
  rationale: Cụm này theo sát nghĩa là “trước mặt/nhan Ta”; “trước mặt Ta” tự nhiên, rõ ràng và giữ lời phán trực tiếp của Đức Chúa Trời.
- source_word: תָּמִיד
  choice: luôn
  rationale: Trong văn cảnh nghi lễ, תָּמִיד diễn tả sự duy trì liên tục hoặc đều đặn. “Luôn” ngắn gọn, tự nhiên và không quyết định quá mức giữa tính liên tục tuyệt đối với việc tuân giữ thường xuyên.
theological_decisions:
- issue: Thuật ngữ nghi lễ לֶחֶם פָּנִים
  choice: bánh Hiện Diện
  alternative: bánh trưng bày; bánh đặt trước mặt Ta
  rationale: “Bánh Hiện Diện” bảo tồn hình ảnh và ý nghĩa thần học của cụm Hê-bơ-rơ mà không đưa vào thuật ngữ giáo phái. Cách này cũng tránh làm mất sự phân biệt với cụm “trước mặt Ta” ngay sau đó.
translation_notes:
  register: Văn phong chỉ thị trang nghiêm nhưng hiện đại. Đại từ “Con” và “Ta” thể hiện lời Đức Chúa Trời trực tiếp phán với Môi-se; viết hoa “Hiện Diện” để giúp người đọc nhận ra đây là tên gọi nghi lễ, không nhằm nhân cách hóa hoặc giải nghĩa thêm.
