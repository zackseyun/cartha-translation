review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh đặt bánh trên bàn trước mặt Đức Chúa Trời và ý nghĩa duy trì thường xuyên của תָּמִיד. Tuy nhiên, “bánh Hiện Diện” thiếu liên kết sở hữu vốn có của לֶחֶם פָּנִים và cách viết hoa khiến cụm từ kém tự nhiên, dễ bị hiểu như một nhãn thuật ngữ chưa được giải thích.
  naturalness: “Con phải luôn đặt” có thể gợi việc lặp lại hành động đặt, hơn là tình trạng bánh được duy trì trước mặt Đức Chúa Trời. Đưa “luôn luôn” về cuối câu giúp phạm vi của trạng từ bao quát toàn bộ quy định mà vẫn tự nhiên trong văn phong chỉ thị.
  terminology: Dùng “bánh của sự hiện diện” phản ánh cấu trúc “bread of the Presence,” phù hợp với chú thích, và vẫn phân biệt với לְפָנַי, “trước mặt Ta.” Không cần viết hoa “hiện diện”, vì đây không phải tên riêng trong tiếng Việt; tính thuật ngữ được làm rõ qua văn cảnh và chú thích.
  issues:
  - severity: medium
    issue: Cụm “bánh Hiện Diện” không tự nhiên và chưa phản ánh rõ quan hệ sở hữu trong לֶחֶם פָּנִים.
    rationale: Cách dịch “bánh của sự hiện diện” vừa sát cấu trúc nguồn vừa rõ nghĩa hơn trong tiếng Việt hiện đại. Viết hoa không có cơ sở ngữ pháp cần thiết và có thể gợi một danh xưng nhân vị.
  - severity: low
    issue: Vị trí của “luôn” trong “Con phải luôn đặt” có thể thu hẹp nghĩa vào hành động đặt lặp lại.
    rationale: תָּמִיד trong ngữ cảnh nghi lễ chỉ việc bánh phải thường trực/luôn được duy trì trước mặt Đức Chúa Trời. Đặt “luôn luôn” ở cuối câu diễn đạt phạm vi này rõ hơn mà không ép nghĩa là liên tục tuyệt đối.
  revised_text: Con phải đặt bánh của sự hiện diện trên bàn trước mặt Ta luôn luôn.[a]
