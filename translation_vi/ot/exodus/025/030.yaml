- from: Con phải luôn đặt bánh Hiện Diện trên bàn trước mặt Ta.[a]
  to: Con phải đặt bánh của sự hiện diện trên bàn trước mặt Ta luôn luôn.[a]
  rationale: Sửa thuật ngữ nghi lễ thành “bánh của sự hiện diện” để diễn đạt rõ và tự nhiên cấu trúc Hê-bơ-rơ, đồng thời giữ sự phân biệt với “trước mặt Ta.” Chuyển “luôn luôn” về cuối câu để phản ánh tốt hơn yêu cầu duy trì bánh trước mặt Đức Chúa Trời một cách thường trực.
