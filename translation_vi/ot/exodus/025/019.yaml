revisions:
- from: Hãy làm một chê-ru-bim ở đầu này và một chê-ru-bim ở đầu kia.[a] Các ngươi phải làm hai chê-ru-bim liền với nắp chuộc tội, tại hai đầu nắp.
  to: Hãy làm một chê-ru-bim ở đầu này và một chê-ru-bim ở đầu kia.[a] Các ngươi phải làm các chê-ru-bim từ nắp chuộc tội, ở hai đầu nắp ấy.
  rationale: Sửa «liền với» thành «từ» để phản ánh trực tiếp מִן và giữ ý nguồn/chất liệu của bản Hê-bơ-rơ. Chỉnh chú thích tương ứng, đồng thời vẫn giải thích cách hiểu rằng các hình chê-ru-bim không được chế tác rời rồi gắn vào. Giữ cấu trúc hai mệnh đề, thuật ngữ «chê-ru-bim», và cách gọi «nắp chuộc tội».
