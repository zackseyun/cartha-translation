base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: vi
  text: Hãy làm một chê-ru-bim ở đầu này và một chê-ru-bim ở đầu kia.[a] Các ngươi phải làm các chê-ru-bim từ nắp chuộc tội, ở hai đầu nắp ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt rõ hơn: “Hãy làm các chê-ru-bim từ chính nắp chuộc tội, ở hai đầu nắp ấy.” Giới từ Hê-bơ-rơ được dịch là “từ” cho biết các chê-ru-bim phải được tạo nên từ chính nắp chuộc tội, chứ không làm riêng rồi gắn vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Hãy làm
  rationale: Dạng mệnh lệnh trong chuỗi chỉ thị; lược bỏ liên từ mở đầu để câu tiếng Việt tự nhiên.
- source_word: כְּרוּב ... וּכְרוּב
  choice: một chê-ru-bim ... một chê-ru-bim
  rationale: Hai danh từ số ít chỉ riêng từng hình tượng; giữ thuật ngữ phiên âm quen thuộc trong ngữ cảnh Đền Tạm.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: ở đầu này ... ở đầu kia
  rationale: Diễn đạt tự nhiên vị trí đối xứng của hai hình tượng, phù hợp với ngữ cảnh vật thể.
- source_word: מִן הַכַּפֹּרֶת
  choice: liền với nắp chuộc tội
  rationale: 'מִן ở đây biểu thị nguồn/chất liệu: hai chê-ru-bim được tạo nên từ chính nắp, không phải làm rời rồi gắn vào. ''Nắp chuộc tội'' vừa nhận diện vật thể vừa giữ liên hệ thần học của כַּפֹּרֶת.'
- source_word: תַּעֲשׂוּ
  choice: Các ngươi phải làm
  rationale: Dạng chưa hoàn thành ngôi hai số nhiều mang lực chỉ thị, chuyển từ lời nói với Môi-se sang nhóm thợ thực hiện.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: tại hai đầu nắp
  rationale: עַל có nghĩa vị trí tại/trên; lặp rõ 'nắp' để tránh đại từ sở hữu mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Cách dịch כַּפֹּרֶת
  choice: nắp chuộc tội
  alternative: nắp thi ân; nắp Hòm
  rationale: Giữ được cả chức năng là nắp và sắc thái nghi lễ của căn từ כפר, nhưng không giải thích quá mức cơ chế chuộc tội.
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “chê-ru-bim” như một thuật ngữ phiên âm bất biến; “đầu này ... đầu kia” giữ cấu trúc cân xứng. Cụm “liền với” ưu tiên sự rõ nghĩa vật liệu/cấu tạo trong tiếng Việt, còn chú thích bảo tồn cách hiểu sát giới từ nguồn gốc.
