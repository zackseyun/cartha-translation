  source_fidelity: Bản dịch truyền đạt chính xác mệnh lệnh đưa các đòn khiêng vào khoen gắn ở các bên của Hòm và mục đích dùng các đòn ấy để khiêng Hòm. “Luồn ... vào” là cách diễn đạt tự nhiên cho hành động được ngữ cảnh của וְהֵבֵאתָ và בַּטַּבָּעֹת hàm ý; “dùng chúng mà khiêng” giữ đúng đại từ công cụ בָּהֶם.
