  yaml_path: translation/ot/exodus/025/014.yaml
  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: vi
  text: Ngươi phải luồn các đòn khiêng vào những khoen ở hai bên Hòm Giao Ước[a] để dùng chúng mà khiêng Hòm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “đem các đòn khiêng vào những khoen.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Ngươi phải luồn
  rationale: Động từ בוא có nghĩa cơ bản là “đem vào”, nhưng trong ngữ cảnh đưa các đòn qua khoen, “luồn ... vào” diễn đạt tự nhiên và chính xác hành động.
- source_word: הַבַּדִּים
  choice: các đòn khiêng
  rationale: בדים chỉ những cây đòn dùng để khiêng đồ thánh; “đòn khiêng” rõ nghĩa hơn “đòn” đứng riêng và phù hợp tiếng Việt hiện đại.
- source_word: בַּטַּבָּעֹת
  choice: vào những khoen
  rationale: Giới từ ב trong cấu trúc này biểu thị việc đưa đòn vào khoen; “vào” thể hiện rõ hướng chuyển động.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: ở hai bên Hòm Giao Ước
  rationale: צלעות là các mặt bên; trong ngữ cảnh vật thể có các khoen bố trí đối xứng, “hai bên” là cách nói tự nhiên, còn “ở” diễn tả vị trí của các khoen.
- source_word: הָאָרֹן
  choice: Hòm Giao Ước
  rationale: אָרוֹן về từ nguyên là hòm, nhưng trong ngữ cảnh Đền Tạm đây là vật thánh thường được gọi rõ là “Hòm Giao Ước”; cách gọi này giúp độc giả nhận diện đối tượng mà không dùng từ cổ.
- source_word: לָשֵׂאת
  choice: để ... khiêng
  rationale: נשא ở đây chỉ hành động mang vật nặng bằng đòn; “khiêng” chính xác và tự nhiên hơn từ chung “mang”.
- source_word: בָּהֶם
  choice: dùng chúng
  rationale: Đại từ số nhiều chỉ các đòn khiêng và mang nghĩa phương tiện; “dùng chúng” truyền đạt rõ chức năng công cụ trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngươi” để giữ sắc thái mệnh lệnh trực tiếp số ít trong lời Đức Chúa Trời phán với Môi-se; câu tránh thuật ngữ cổ, đồng thời giữ quan hệ phương tiện của đại từ cuối câu.
