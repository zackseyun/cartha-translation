  terminology: “Đòn khiêng,” “khoen,” và “Hòm Giao Ước” nhất quán với ngữ cảnh đồ thánh của Đền Tạm. Cách gọi “Hòm Giao Ước” là tên quy ước rõ ràng của đối tượng này trong văn mạch, không làm thay đổi nghĩa câu.
