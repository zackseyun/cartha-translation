  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chân đèn” để làm rõ đối tượng của đại từ; “liền một khối” truyền đạt tự nhiên ý nghĩa các bộ phận được tạo ra từ chính vật thể, không gắn riêng.
