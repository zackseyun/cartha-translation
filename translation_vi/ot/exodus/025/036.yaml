base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: vi
  text: Các nụ và các nhánh phải liền một khối với chân đèn; toàn bộ chân đèn phải là một khối duy nhất bằng vàng ròng, được chế tác bằng búa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một khối duy nhất được đập bằng búa.” Tiếng Hê-bơ-rơ nhấn mạnh rằng toàn bộ chân đèn được chế tác liền một khối bằng vàng ròng.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: các nụ
  rationale: Trong thiết kế mang hình ảnh thực vật của chân đèn, từ này chỉ những phần trang trí tròn giống nụ; “các nụ” tự nhiên và phù hợp ngữ cảnh hơn “các núm”.
- source_word: וּקְנֹתָם
  choice: và các nhánh
  rationale: Dù קָנֶה thường có nghĩa là cây sậy hoặc thân cây, ở đây từ này chỉ các nhánh vươn ra của chân đèn.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: phải liền một khối với chân đèn
  rationale: Cụm từ diễn tả các nụ và nhánh được tạo thành từ chính chân đèn, chứ không phải những bộ phận làm riêng rồi gắn vào; “phải” giữ sắc thái chỉ thị.
- source_word: כֻּלָּהּ
  choice: toàn bộ chân đèn
  rationale: Làm rõ đại từ giống cái trong tiếng Hê-bơ-rơ quy chiếu đến chân đèn và giữ sự nhấn mạnh vào toàn thể vật thể.
- source_word: מִקְשָׁה אַחַת
  choice: một tác phẩm duy nhất ... được dát búa
  rationale: Cách dịch giữ cả phương thức chế tác bằng búa lẫn ý tưởng toàn bộ chân đèn là một công trình thống nhất.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: “Vàng ròng” là cách diễn đạt tiếng Việt tự nhiên, trang trọng cho vàng tinh khiết.
