language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: vi
  text: Các chê-ru-bim phải xòe cánh hướng lên trên, dùng cánh che phủ nắp chuộc tội[a]. Mặt chúng đối diện nhau và cùng hướng về nắp chuộc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nắp xá tội.” Từ Hê-bơ-rơ kapporet chỉ chiếc nắp bằng vàng của Hòm Giao Ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: phải
  rationale: Trong văn cảnh chỉ dẫn chế tác, động từ mang sắc thái quy định; “phải” diễn đạt tự nhiên lực chỉ thị trong tiếng Việt.
- source_word: הַכְּרֻבִים
  choice: các chê-ru-bim
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho số nhiều כְּרוּב, phù hợp văn cảnh vật thánh.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: xòe cánh hướng lên trên
  rationale: Giữ hình ảnh chủ động của đôi cánh dang rộng và định hướng lên phía trên.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: dùng cánh che phủ
  rationale: “Dùng cánh” thể hiện giới từ chỉ phương tiện; “che phủ” truyền đạt hình ảnh cánh phủ bên trên mà không thêm ý nghĩa bảo vệ không được nói rõ.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Vật này là nắp bằng vàng của Hòm Giao Ước và có chức năng nghi lễ liên quan đến sự chuộc tội; cách gọi này vừa chỉ rõ đây là nắp vừa giữ ý nghĩa nghi lễ của thuật ngữ.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Mặt chúng đối diện nhau
  rationale: Diễn đạt tự nhiên thành ngữ phân phối, theo nghĩa mỗi chê-ru-bim hướng mặt về chê-ru-bim kia.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: và cùng hướng về nắp chuộc tội
  rationale: Giữ hướng nhìn của các khuôn mặt về phía nắp, đồng thời tránh lặp nặng nề trong tiếng Việt.
theological_decisions:
- issue: Cách dịch כַּפֹּרֶת trong chỉ dẫn về Đền Tạm
  choice: nắp chuộc tội
  alternative: nắp xá tội; nắp Hòm Giao Ước
  rationale: “Nắp chuộc tội” bảo toàn cả đặc điểm vật thể là chiếc nắp và ý nghĩa nghi lễ gắn với sự chuộc tội, nhưng chú thích cũng xác định cụ thể đó là nắp vàng của Hòm Giao Ước.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chê-ru-bim” theo cách phiên âm Kinh Thánh quen thuộc; chia câu để câu chỉ dẫn rõ ràng, nhưng vẫn giữ hai hướng tương quan của khuôn mặt: đối diện nhau và hướng xuống nắp.'
