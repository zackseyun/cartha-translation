- from: Ngươi phải làm cho bàn một khung rộng một bàn tay chạy chung quanh, rồi làm một gờ viền bằng vàng quanh khung ấy.[a]
  to: Ngươi phải làm cho bàn một khung bao quanh, có bề rộng một bàn tay; rồi làm một gờ viền bằng vàng quanh khung ấy.[a]
  rationale: Bản sửa chỉ làm sáng tỏ cấu trúc của câu và điều chỉnh chú thích cho chính xác về từ vựng. Các đại từ, ý bao quanh được lặp lại, đơn vị đo, vật liệu vàng và lực mệnh lệnh của nguyên văn đều được giữ nguyên.
