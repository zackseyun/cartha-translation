translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp với lời chỉ dẫn chế tác. Dùng “Ngươi” để giữ lối xưng hô số ít trực tiếp với Môi-se. Chú thích [a] được đặt ngay sau cụm có từ זֵר để tránh gắn nhầm với đơn vị đo.
