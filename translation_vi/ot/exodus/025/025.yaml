  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: vi
  text: Ngươi phải làm cho bàn một khung bao quanh, có bề rộng một bàn tay; rồi làm một gờ viền bằng vàng quanh khung ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một vành vàng quanh khung ấy” hoặc “một vương miện bằng vàng quanh khung ấy”. Từ Hê-bơ-rơ זֵר có thể chỉ một vành hay gờ trang trí; “vương miện” là cách dịch truyền thống.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: khung
  rationale: Danh từ này chỉ bộ phận tạo khung hoặc đường bao có tính kết cấu của chiếc bàn; “khung” tự nhiên, rõ nghĩa và không xác định quá mức hình dạng.
- source_word: טֹפַח
  choice: rộng một bàn tay
  rationale: טֹפַח là đơn vị đo bằng bề ngang bàn tay. Cách diễn đạt này truyền đạt kích thước theo nguyên ngữ và tránh “gang tay”, vốn trong tiếng Việt thường chỉ khoảng cách từ ngón cái đến ngón út xòe ra.
- source_word: סָבִיב
  choice: chạy chung quanh / quanh
  rationale: Từ này xuất hiện hai lần, đều diễn tả sự bao quanh. Hai cách diễn đạt gần nghĩa giúp câu tiếng Việt tự nhiên mà vẫn giữ ý lặp lại của nguyên văn.
- source_word: זֵר
  choice: gờ viền
  rationale: Trong ngữ cảnh đồ dùng Đền Tạm, từ này chỉ một dải viền nổi hoặc có tính trang trí. “Gờ viền” rõ ràng hơn cách dịch sát nghĩa “vương miện”, nhưng nét nghĩa truyền thống được ghi ở chú thích.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt trực tiếp vật liệu làm gờ viền, tự nhiên trong tiếng Việt.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: cho bàn / khung ấy
  rationale: Các đại từ hậu tố quy chiếu về chiếc bàn trong văn cảnh. Nêu “bàn” lần đầu giúp câu đứng riêng vẫn rõ nghĩa; “khung ấy” duy trì liên kết ở vế sau.
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm / rồi làm
  rationale: Giữ lực mệnh lệnh của lời chỉ dẫn dành cho Môi-se; “rồi” thể hiện trình tự của waw nối câu mà không làm tiếng Việt nặng nề.
