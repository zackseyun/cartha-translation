base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: vi
  text: Ngươi phải làm hai chê-ru-bim bằng vàng; dùng kỹ thuật rèn đập để làm chúng ở hai đầu nắp chuộc tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nắp xá tội”. Từ Hê-bơ-rơ này chỉ nắp của Hòm Giao Ước; “nắp thi ân” là cách gọi truyền thống trong bối cảnh nghi lễ này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng động từ trong chuỗi chỉ thị mang chức năng mệnh lệnh; cách dịch này giữ sắc thái quy định mà vẫn tự nhiên trong tiếng Việt.
- source_word: שְׁנַיִם כְּרֻבִים זָהָב
  choice: hai chê-ru-bim bằng vàng
  rationale: Giữ nguyên số lượng, chất liệu và thuật ngữ riêng chỉ các hữu thể có cánh trong nơi thánh; phiên âm tránh đồng nhất chúng với hình tượng thiên sứ phổ thông.
- source_word: מִקְשָׁה
  choice: dùng kỹ thuật dát búa
  rationale: Diễn đạt việc tạo hình kim loại bằng cách đập/dát bằng búa, không đưa thêm ý 'nguyên khối' vốn là một suy luận có thể có nhưng không phải nghĩa trực tiếp nhất của từ.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: phải ... làm chúng
  rationale: Giữ lại sự lặp động từ của nguyên văn, nhấn mạnh phương thức chế tác.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: ở hai đầu
  rationale: Diễn đạt quan hệ không gian một cách tự nhiên và không quyết định quá mức rằng các chê-ru-bim chỉ được đặt lên hay liền khối phát ra từ hai đầu.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Vừa chỉ rõ đây là nắp Hòm, vừa bảo tồn mối liên hệ nghi lễ của thuật ngữ với sự chuộc tội; cách dịch truyền thống khác được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת trong bối cảnh Đền Tạm
  choice: nắp chuộc tội
  alternative: nắp thi ân; cái nắp
  rationale: Danh từ này chỉ chiếc nắp bằng vàng của Hòm Giao Ước và trong nghi lễ gắn với việc chuộc tội. 'Nắp chuộc tội' minh bạch hơn đối với độc giả hiện đại, còn 'nắp thi ân' bảo tồn truyền thống nhấn mạnh lòng thương xót; chú thích giữ lại cả độ rộng ngữ nghĩa lẫn thuật ngữ quen thuộc.
translation_notes:
  register: Văn phong chỉ thị trang trọng, rõ ràng và hiện đại. Dùng “ngươi” phù hợp lời Đức Chúa Trời phán trực tiếp với Môi-se; tránh từ quá cổ. Thuật ngữ “chê-ru-bim” được phiên âm theo cách dùng Kinh Thánh quen thuộc.
