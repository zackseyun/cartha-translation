revisions:
- from: Ngươi phải làm hai chê-ru-bim bằng vàng; phải dùng kỹ thuật dát búa mà làm chúng, ở hai đầu nắp chuộc tội.[a]
  to: Ngươi phải làm hai chê-ru-bim bằng vàng; dùng kỹ thuật rèn đập để làm chúng ở hai đầu nắp chuộc tội.[a]
  rationale: Thay ‘dát búa’ bằng ‘rèn đập’ để phản ánh chính xác hơn việc tạo hình vàng bằng sự đập/rèn. Cấu trúc câu được làm gọn để cụm ‘ở hai đầu’ bổ nghĩa trực tiếp cho việc làm các chê-ru-bim, mà không xác định thêm chúng là đặt rời hay liền với nắp. Chú thích được điều chỉnh để lưu giữ các lựa chọn dịch thuật của הַכַּפֹּרֶת mà không áp đặt một diễn giải thần học.
  reviewer_model: gpt-5.6-terra
