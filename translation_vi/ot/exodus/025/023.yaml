base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: vi
  text: Ngươi phải làm một cái bàn bằng gỗ keo,[a] dài hai cu-bít, rộng một cu-bít và cao một cu-bít rưỡi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Và ngươi phải làm.” Liên từ Hê-bơ-rơ nối chỉ thị này với các mệnh lệnh đứng trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng Qal hoàn thành có liên từ đứng đầu, trong chuỗi chỉ thị, mang lực mệnh lệnh. “Ngươi phải làm” diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: שֻׁלְחָן
  choice: một cái bàn
  rationale: Danh từ chỉ đồ dùng thờ phượng; loại từ “cái” và “một” giúp lời giới thiệu vật này tự nhiên trong tiếng Việt.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm cấu tạo chỉ vật liệu, theo nghĩa đen là gỗ của cây שִׁטָּה; “gỗ keo” là cách gọi rõ ràng, quen thuộc.
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: dài hai cu-bít
  rationale: Chuyển công thức danh từ “chiều dài của nó là hai cu-bít” thành cách nêu kích thước tự nhiên trong tiếng Việt, đồng thời giữ nguyên đơn vị cổ.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: rộng một cu-bít
  rationale: Diễn đạt gọn và song song với chiều dài; אַמָּה ở đây chỉ một cu-bít.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: và cao một cu-bít rưỡi
  rationale: Giữ đúng số đo “một cu-bít và một nửa” bằng cách nói tự nhiên “một cu-bít rưỡi”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phản ánh lời Đức Chúa Trời trực tiếp phán với Môi-se ở ngôi số ít; giữ đơn vị “cu-bít” nhằm bảo tồn bối cảnh và độ chính xác của văn bản nguồn.
