  text: כְּ/כֹ֗ל אֲשֶׁ֤ר אֲנִי֙ מַרְאֶ֣ה אוֹתְ/ךָ֔ אֵ֚ת תַּבְנִ֣ית הַ/מִּשְׁכָּ֔ן וְ/אֵ֖ת תַּבְנִ֣ית כָּל כֵּלָ֑י/ו וְ/כֵ֖ן תַּעֲשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: vi
  text: Theo mọi điều Ta đang chỉ cho con, tức là mẫu của Đền Tạm và mẫu của mọi vật dụng của nó, các con phải làm như vậy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mẫu” cũng có thể dịch là “bản thiết kế”, “mô hình” hoặc “kiểu mẫu”.
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hê-bơ-rơ, “các con phải làm” ở số nhiều, nói với Môi-se cùng những người chịu trách nhiệm thực hiện công việc.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: đúng theo mọi điều
  rationale: Diễn đạt sự tương ứng chặt chẽ mà כְּכֹל אֲשֶׁר đòi hỏi trong ngữ cảnh các chỉ dẫn chi tiết, đồng thời tự nhiên trong tiếng Việt.
- source_word: מַרְאֶה
  choice: đang chỉ cho
  rationale: 'Phân từ Hifil mang sắc thái hiện tại/đang diễn tiến: Đức Chúa Trời đang cho Môi-se thấy điều phải làm.'
- source_word: תַּבְנִית
  choice: mẫu
  rationale: “Mẫu” có thể chỉ hình mẫu, kiểu mẫu hoặc bản thiết kế được cho thấy, nhưng không buộc người đọc phải hiểu đó là mô hình vật thể hay xác định bản thể của một nguyên mẫu trên trời.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ tiếng Việt quen thuộc cho nơi thánh dạng lều trong Xuất Ai Cập, đồng thời giữ ý đây là nơi Đức Chúa Trời ngự giữa dân Ngài.
- source_word: כָּל כֵּלָיו
  choice: mọi vật dụng trong đó
  rationale: כֵּלִים là từ rộng, bao gồm các đồ dùng, khí cụ và vật dụng thuộc Đền Tạm; cách dịch này tránh thu hẹp nghĩa chỉ còn bình hoặc dụng cụ.
- source_word: וְכֵן
  choice: phải làm đúng theo
  rationale: Lồng quan hệ chỉ cách thức và hệ quả vào mệnh đề chính để câu tiếng Việt tự nhiên mà vẫn giữ nghĩa “và cứ như vậy mà làm”.
- source_word: תַּעֲשׂוּ
  choice: Các con phải làm
  rationale: Dạng ngôi thứ hai số nhiều được thể hiện bằng “các con”, trong khi đại từ số ít ở mệnh đề trước được dịch là “con” để cho thấy lời trước hết nói với Môi-se rồi mở rộng đến nhóm thi công.
theological_decisions:
- issue: תַּבְנִית có nên được diễn đạt rõ là một nguyên mẫu trên trời hay không
  choice: mẫu
  alternative: bản thiết kế; mô hình; nguyên mẫu trên trời
  rationale: Câu này nói Đức Chúa Trời cho Môi-se thấy một תַּבְנִית nhưng không xác định rõ bản thể của nó. “Mẫu” giữ nguyên khả năng đó mà không đưa thêm một kết luận thần học vào bản văn.
- issue: Chủ thể số nhiều của תַּעֲשׂוּ
  choice: Các con phải làm
  alternative: con phải làm; các ngươi phải làm
  rationale: Tiếng Hê-bơ-rơ chuyển từ đại từ số ít chỉ Môi-se sang động từ số nhiều. Bản dịch thể hiện sự chuyển đổi này, qua đó không xóa đi khả năng lời truyền bao gồm Môi-se cùng những người chịu trách nhiệm thi công.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con, các con” cho lời phán trực tiếp; giữ rõ sự chuyển từ đối tượng số ít אוֹתְךָ sang động từ số nhiều תַּעֲשׂוּ. Dấu gạch ngang duy trì cấu trúc giải thích của câu nguồn; các dấu chú thích đều xuất hiện trong chính văn.
