  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp lại nhẹ để tiếng Việt tự nhiên, nhưng vẫn giữ hai nhóm ba chén và kết luận rằng cùng một kiểu mẫu áp dụng cho cả sáu nhánh.
