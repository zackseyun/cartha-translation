  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: vi
  text: Trên một nhánh có ba chén hình hoa hạnh nhân, mỗi chén có một núm và một hoa; trên một nhánh có ba chén hình hoa hạnh nhân, mỗi chén có một núm và một hoa. Cả sáu nhánh vươn ra từ chân đèn[a] đều phải làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ מְנוֹרָה (menorah) ở đây được dịch là “chân đèn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: chén
  rationale: Danh từ chỉ vật hoặc hình dạng giống chiếc chén; trong mô tả trang trí chân đèn, “chén” vừa cụ thể vừa tự nhiên hơn “bát”.
- source_word: מְשֻׁקָּדִים
  choice: hình hoa hạnh nhân
  rationale: Từ này bắt nguồn từ שקד, “hạnh nhân”, và trong ngữ cảnh nghệ thuật mô tả kiểu dáng trang trí. “Hình hoa hạnh nhân” thể hiện mô-típ thực vật rõ hơn cách hiểu chỉ hình hạt.
- source_word: קָּנֶה
  choice: nhánh
  rationale: Ở đây từ này chỉ phần vươn ra của chân đèn. “Nhánh” phù hợp mô-típ cây và hoa, đồng thời dễ hiểu trong tiếng Việt hiện đại.
- source_word: כַּפְתֹּר
  choice: bầu
  rationale: Chỉ một phần trang trí tròn, nhô ra. “Bầu” giữ được hình ảnh thực vật và đi tự nhiên với “hoa”; “núm” là phương án khác nhưng ít phù hợp mô-típ hơn.
- source_word: פֶרַח / פָרַח
  choice: hoa
  rationale: Danh từ có nghĩa là hoa hoặc bông hoa. “Hoa” ngắn gọn, tự nhiên, và tránh lặp từ không cần thiết.
- source_word: כֵּן
  choice: đều phải làm như vậy
  rationale: Diễn đạt việc cùng một kiểu mẫu được áp dụng cho cả sáu nhánh, đồng thời giữ sắc thái chỉ dẫn của ngữ cảnh.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: vươn ra từ chân đèn
  rationale: Phân từ mô tả các nhánh đi ra từ phần chính của chân đèn; “vươn ra” tự nhiên và phù hợp hình ảnh các nhánh.
- source_word: מְנֹרָה
  choice: chân đèn
  rationale: Đây là danh từ chung chỉ vật dụng đặt đèn. Dịch nghĩa giúp độc giả Việt hiện đại hiểu trực tiếp hơn so với phiên âm “menorah”.
