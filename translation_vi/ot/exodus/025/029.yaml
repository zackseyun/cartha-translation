base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: vi
  text: Con phải làm các đĩa, chén[a], bình và bát của bàn, là những vật dùng để rót lễ quán[b]. Con phải làm chúng bằng vàng ròng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “chén” chỉ một vật đựng nhỏ, nhưng hình dạng chính xác không chắc chắn; cũng có thể dịch là “khay nhỏ”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “mà [lễ quán] được rót bằng chúng”. Động từ ở thể bị động; trong ngữ cảnh nghi lễ, điều được rót là lễ quán.'
    reason: source_transparency
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: các đĩa của bàn
  rationale: קְעָרָה chỉ một vật đựng tương đối phẳng; “đĩa” tự nhiên trong tiếng Việt và giúp phân biệt với כַּפּוֹת.
- source_word: כַפֹּתָיו
  choice: chén
  rationale: כַּף vốn có nghĩa là lòng bàn tay, rồi chỉ một vật đựng nhỏ. “Chén” diễn đạt tự nhiên, nhưng chức năng và hình dạng chính xác của vật này không chắc chắn.
- source_word: קְשׂוֹתָיו
  choice: bình
  rationale: Đây là tên hiếm của một vật dụng nghi lễ. “Bình” phù hợp với vật chứa dùng trong việc rót mà không xác định quá mức hình dáng.
- source_word: מְנַקִּיֹּתָיו
  choice: bát
  rationale: Từ này chỉ một loại vật dụng liên quan đến việc rót lễ quán; “bát” là cách gọi phổ thông, còn mệnh đề theo sau cho biết công dụng.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: là những vật dùng để rót lễ quán
  rationale: Động từ נסך trong ngữ cảnh nghi lễ nói đến việc rót lễ quán. Cách dịch giữ sắc thái bị động/công dụng chung và không buộc mệnh đề chỉ bổ nghĩa cho một trong hai danh từ đứng gần nhất.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: “Vàng ròng” là cách diễn đạt tự nhiên, trang trọng cho vàng tinh sạch trong các chỉ dẫn về Đền Tạm.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: Con phải làm ... Con phải làm chúng
  rationale: Giữ phép lặp đóng khung danh sách và sắc thái mệnh lệnh của ngôi thứ hai số ít giống đực; “con” phù hợp với lời Đức Chúa Trời phán trực tiếp với Môi-se trong văn mạch.
theological_decisions:
- issue: Phạm vi của mệnh đề אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: Diễn đạt như công dụng của các vật dụng dùng để rót lễ quán, không gắn độc quyền với riêng “bát”.
  alternative: 'Hiểu mệnh đề chỉ bổ nghĩa cho “bình và bát”, hoặc dịch sát hơn: “mà người ta sẽ dùng chúng để rót”.'
  rationale: Đại từ số nhiều בָּהֵן cho phép liên hệ với nhiều vật dụng; cú pháp không xác định hoàn toàn phạm vi. Bản dịch tránh giải quyết quá mức sự mơ hồ này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “lễ quán” là thuật ngữ Kinh Thánh quen thuộc cho nghi thức dâng chất lỏng; giữ cấu trúc lặp của câu Hê-bơ-rơ và quy chiếu các vật dụng về chiếc bàn bằng cụm “của bàn”.
