base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: vi
  text: Hãy lưu ý và làm các vật ấy theo đúng mẫu[a] đã được chỉ cho con trên núi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy xem và làm các vật ấy theo mẫu của chúng, là mẫu đang được chỉ cho con trên núi.”'
    reason: Bảo lưu cấu trúc phối hợp sát nguyên văn của וּרְאֵה וַעֲשֵׂה và khả năng hiểu phân từ מָרְאֶה theo tiến trình đang diễn ra.
lexical_decisions:
- source_word: וּרְאֵה
  choice: Hãy lưu ý
  rationale: Mệnh lệnh của ראה ở đây có chức năng khuyên răn, yêu cầu Môi-se chú tâm cẩn thận; “hãy lưu ý” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ lực mệnh lệnh.
- source_word: וַעֲשֵׂה
  choice: và làm
  rationale: עשה mang nghĩa “làm/chế tạo”; trong ngữ cảnh các vật dụng của nơi thánh, “làm” là cách diễn đạt tự nhiên và đủ rộng.
- source_word: בְּתַבְנִיתָם
  choice: theo đúng mẫu
  rationale: תבנית chỉ mẫu, kiểu mẫu hoặc hình dạng; hậu tố số nhiều giống đực quy chiếu đến các vật vừa được mô tả. “Theo đúng mẫu” truyền đạt yêu cầu làm phù hợp với mẫu đã được bày tỏ.
- source_word: אֲשֶׁר
  choice: đã
  rationale: Mệnh đề quan hệ được diễn đạt tự nhiên trong tiếng Việt bằng cấu trúc “mẫu đã được chỉ cho con”, không cần đại từ quan hệ riêng.
- source_word: אַתָּה
  choice: con
  rationale: Đại từ số ít trực tiếp chỉ Môi-se. “Con” phù hợp với lời Đức Chúa Trời phán cùng Môi-se trong văn phong Kinh Thánh tiếng Việt hiện đại và giữ tính trực tiếp của lời phán.
- source_word: מָרְאֶה
  choice: đã được chỉ cho con
  rationale: Dạng Hophal phân từ của ראה mang nghĩa bị động “được cho thấy/được chỉ cho xem”. Trong mạch văn, tiếng Việt dùng “đã được chỉ cho” tự nhiên hơn, nhưng không xác định thêm bản chất của điều Môi-se thấy.
- source_word: בָּהָר
  choice: trên núi
  rationale: Cụm từ nói đến nơi Môi-se nhận sự chỉ dẫn; “trên núi” là tương đương tự nhiên của ב trong ngữ cảnh này.
theological_decisions:
- issue: Bản chất của mẫu dành cho các vật dụng nơi thánh
  choice: mẫu
  alternative: kiểu mẫu; hình dạng; bản thiết kế
  rationale: “Mẫu” giữ được phạm vi nghĩa của תבנית mà không áp đặt rằng đó nhất thiết là bản thiết kế kỹ thuật hay một nguyên mẫu siêu hình trên trời.
- issue: Thời điểm mẫu được bày tỏ
  choice: đã được chỉ cho con
  alternative: đang được chỉ cho con
  rationale: Phân từ Hebrew có thể nhấn mạnh tình trạng được cho thấy, còn ngữ cảnh có thể được hiểu theo tiến trình đang diễn ra hoặc sự bày tỏ đã xảy ra. Bản chính dùng thể quá khứ tự nhiên trong tiếng Việt; chú thích bảo lưu cách hiểu theo tiến trình.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Hãy lưu ý” chuyển tải chức năng khuyên răn của mệnh lệnh “hãy xem”; “các vật ấy” làm rõ đối tượng số nhiều từ ngữ cảnh mà không bổ sung cách giải thích giáo phái.
