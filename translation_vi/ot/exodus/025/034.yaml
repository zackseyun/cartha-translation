translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chân đèn” là thuật ngữ quen thuộc cho מְנֹרָה; “thân chân đèn” làm rõ rằng bốn chén nằm trên phần chính của chân đèn. Các dấu chú thích [a], [b] đều xuất hiện ngay sau từ ngữ liên quan.
