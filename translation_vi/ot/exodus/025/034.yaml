translation:
  language: vi
  text: Trên chân đèn có bốn chén có hình hoa hạnh nhân[a], cùng các nụ[b] và hoa của nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có dáng hạnh nhân” hoặc “trang trí hoa hạnh nhân.” Tiếng Hê-bơ-rơ dùng hình ảnh từ cây hạnh nhân và có thể nhấn mạnh hình dáng hoặc họa tiết trang trí.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các bầu tròn.” Từ Hê-bơ-rơ chỉ một chi tiết trang trí tròn, nhô ra trên chân đèn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: Trên thân chân đèn
  rationale: Giới từ בְּ chỉ vị trí trên chính chân đèn; thêm “thân” giúp câu tiếng Việt tự nhiên và phân biệt phần chính với các nhánh, phù hợp văn cảnh mô tả cấu tạo.
- source_word: אַרְבָּעָה גְבִעִים
  choice: bốn chén
  rationale: גְבִיעַ chỉ vật hoặc chi tiết có dạng chén; “chén” là cách gọi ngắn gọn, dễ hiểu trong mô tả đồ thờ.
- source_word: מְשֻׁקָּדִים
  choice: hình hoa hạnh nhân
  rationale: Dạng từ bắt nguồn từ שׁקד gợi họa tiết cây hạnh nhân nhưng không xác định tuyệt đối đó là hình dáng hay trang trí; bản dịch chính diễn đạt hình ảnh tự nhiên, còn chú thích bảo lưu các khả năng.
- source_word: כַּפְתֹּרֶיהָ
  choice: các nụ
  rationale: כַּפְתֹּר là chi tiết trang trí tròn hoặc phình; “nụ” hòa hợp với hệ hình ảnh thực vật, nhưng khả năng “bầu tròn” được ghi ở chú thích.
- source_word: וּפְרָחֶיהָ
  choice: và hoa của nó
  rationale: פֶּרַח nghĩa là hoa hoặc bông hoa; “hoa” rõ ràng, tự nhiên và tránh lặp từ “hạnh nhân”.
