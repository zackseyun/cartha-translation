  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ תְּחָשִׁים chỉ một loài vật hoặc vật liệu chưa được xác định chắc chắn. Các cách hiểu được đề xuất gồm da bò biển, da cá heo, hoặc một loại da thuộc chất lượng cao.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת אֵילִם
  choice: da cừu đực
  rationale: Cụm danh từ chỉ da lấy từ những con cừu đực; cách diễn đạt này tự nhiên trong danh sách vật liệu và không xác định quá mức mức độ chế biến.
- source_word: מְאָדָּמִים
  choice: nhuộm đỏ
  rationale: Dạng từ này cho biết da đã được làm cho có màu đỏ, chứ không chỉ mang màu đỏ tự nhiên; “nhuộm đỏ” diễn đạt rõ cách xử lý vật liệu.
- source_word: עֹרֹת תְּחָשִׁים
  choice: da thuộc quý
  rationale: Danh từ תְּחַשׁ chưa được xác định chắc chắn. “Da thuộc quý” giữ được ý về một loại vật liệu che phủ bằng da có phẩm chất đặc biệt mà không võ đoán loài vật; các khả năng chính được ghi trong chú thích.
- source_word: עֲצֵי שִׁטִּים
  choice: gỗ keo
  rationale: שִׁטִּים thường được nhận diện là một loài keo; “gỗ keo” là cách gọi ngắn gọn, tự nhiên trong tiếng Việt hiện đại.
