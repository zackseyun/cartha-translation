translation:
  language: vi
  text: 'Sáu nhánh sẽ chìa ra từ hai bên chân đèn: ba nhánh của chân đèn từ một bên, và ba nhánh của chân đèn từ bên kia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים
  choice: nhánh
  rationale: Trong ngữ cảnh chân đèn, từ này chỉ các phần vươn ra như cành; “nhánh” tự nhiên trong tiếng Việt và giữ được hình ảnh của nguyên văn.
- source_word: יֹצְאִים
  choice: sẽ tỏa ra
  rationale: Phân từ mô tả sáu nhánh vươn ra từ hai bên chân đèn. “Sẽ tỏa ra” phù hợp với lời chỉ dẫn chế tác và diễn đạt tự nhiên hình dáng của vật.
- source_word: מִצִּדֶּיהָ
  choice: từ hai bên
  rationale: Danh từ số nhiều kèm hậu tố giống cái số ít nói đến các phía bên của chân đèn; “hai bên” làm rõ cấu trúc đối xứng được vế sau xác định.
- source_word: קְנֵי מְנֹרָה
  choice: nhánh của chân đèn
  rationale: Giữ quan hệ sở thuộc được diễn đạt rõ trong cấu trúc ghép Hê-bơ-rơ, đồng thời lặp lại như nguyên văn.
- source_word: מְנֹרָה
  choice: chân đèn
  rationale: Đây là tên gọi thông dụng, rõ nghĩa trong tiếng Việt cho vật dùng để đỡ các ngọn đèn, thay vì phiên âm “menorah” hoặc dịch đơn giản là “đèn”.
- source_word: הָאֶחָד
  choice: một bên
  rationale: Diễn đạt tự nhiên cụm nghĩa đen “bên thứ nhất/một bên” và thiết lập sự tương phản với bên kia.
- source_word: הַשֵּׁנִי
  choice: bên kia
  rationale: Từ Hê-bơ-rơ mang nghĩa “thứ hai”; trong cặp đối xứng “một bên... bên thứ hai”, tiếng Việt tự nhiên dùng “một bên... bên kia” mà không thay đổi ý nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thân đèn” sau “hai bên” để tránh cách hiểu rằng các nhánh mọc ra từ hai bên của toàn bộ chân đèn một cách mơ hồ, nhưng vẫn quy chiếu rõ về chân đèn. Không giữ chú thích [a] của lớp tham khảo tiếng Anh vì chú thích ấy có vẻ lặp lại phương án trong chính văn và không phản ánh một dị bản hay sự mơ hồ thực sự cần thiết trong tiếng Việt.
