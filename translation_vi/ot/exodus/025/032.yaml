  rationale: 'Chỉnh tối thiểu để dùng động từ mô tả chính xác hơn các nhánh nhô ra từ chân đèn và bỏ phần bổ sung “thân đèn” không có trong câu nguồn. Không cần chú thích: cách diễn đạt “một bên ... bên kia” truyền đạt đầy đủ thế đối ứng của tiếng Hê-bơ-rơ.'
