  yaml_path: translation/ot/exodus/025/024.yaml
  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: vi
  text: Ngươi phải dát vàng ròng lên bàn ấy và làm một gờ vàng[a] bao quanh bàn ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một đường viền bằng vàng” hoặc “một dải viền bằng vàng.” Từ Hê-bơ-rơ chỉ một phần viền trang trí; theo truyền thống đôi khi được dịch là “vương miện.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: phải dát ... lên
  rationale: Động từ צפה trong ngữ cảnh chế tác chỉ việc phủ một lớp kim loại lên vật bằng gỗ; “dát vàng ... lên” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: אֹתוֹ
  choice: bàn
  rationale: Đại từ tân ngữ chỉ chiếc bàn ở câu trước. Lặp lại “bàn” giúp câu tiếng Việt rõ nghĩa và tự nhiên hơn dùng “nó”.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cụm từ chỉ vàng có độ tinh khiết cao; “vàng ròng” là cách nói thông dụng, trang trọng và phù hợp ngữ cảnh vật liệu thánh.
- source_word: וְעָשִׂיתָ
  choice: và làm
  rationale: Giữ nghĩa trực tiếp của động từ עשה, không thêm sắc thái chế tác không có trong nguyên văn.
- source_word: לּוֹ
  choice: cho bàn
  rationale: Giới từ ל chỉ vật được làm thêm bộ phận này; trong tiếng Việt, cấu trúc toàn câu tự nhiên hơn khi thể hiện bộ phận ấy chạy quanh bàn.
- source_word: זֵר
  choice: đường viền
  rationale: Trong ngữ cảnh đồ nội thất của Đền Tạm, từ này chỉ một dải viền hoặc gờ trang trí bao quanh. “Đường viền” rõ và tự nhiên hơn cách dịch sát chữ là “vương miện”.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt trực tiếp vật liệu cấu thành đường viền.
- source_word: סָבִיב
  choice: chạy quanh
  rationale: Truyền đạt ý bộ phận này bao quanh chiếc bàn; “chạy quanh” là cách diễn đạt tự nhiên đối với một đường viền.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trực tiếp, trang trọng nhưng hiện đại. Dùng “ngươi” để giữ lối xưng hô số ít trong lời Đức Chúa Trời phán với Môi-se; dùng thuật ngữ thủ công quen thuộc “dát vàng” và “đường viền” để người đọc phổ thông dễ hình dung.
