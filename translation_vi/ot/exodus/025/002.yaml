  naturalness: “Hãy bảo dân Y-sơ-ra-ên dâng cho Ta một lễ vật” tự nhiên và trực tiếp hơn kết cấu “nói ... rằng họ phải lấy.” Câu hai giữ văn phong trang trọng, mạch lạc; “có lòng tự nguyện” là cách nói hiện đại, dễ hiểu.
