revisions:
- from: “Hãy nói với con dân Y-sơ-ra-ên rằng họ phải lấy một lễ vật dâng cho Ta. Các ngươi hãy nhận lễ vật dâng cho Ta từ mỗi người có lòng tự nguyện.[a]”
  to: “Hãy bảo dân Y-sơ-ra-ên dâng cho Ta một lễ vật. Từ mỗi người có lòng tự nguyện,[a] các ngươi hãy nhận lễ vật dâng cho Ta.”
  rationale: Đổi “nói ... rằng họ phải lấy” thành “bảo ... dâng” để câu mệnh lệnh tiếng Việt rõ nghĩa trong bối cảnh thu nhận lễ vật tự nguyện. Giữ “có lòng tự nguyện” và chú thích phương án sát hình ảnh thành ngữ Hê-bơ-rơ. Không thay đổi ý nghĩa, tính tự nguyện, hay tính quy thuộc về Đức Chúa Trời của lễ vật.
  reviewer_model: gpt-5.6-terra
