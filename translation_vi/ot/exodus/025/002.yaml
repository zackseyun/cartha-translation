  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: vi
  text: “Hãy bảo dân Y-sơ-ra-ên dâng cho Ta một lễ vật. Từ mỗi người có lòng tự nguyện,[a] các ngươi hãy nhận lễ vật dâng cho Ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “được lòng mình thôi thúc.” Cụm Hê-bơ-rơ nhấn mạnh sự tự nguyện phát xuất từ nội tâm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Hãy nói với
  rationale: Giữ lực mệnh lệnh trực tiếp của động từ Piel và giới từ “với,” đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Y-sơ-ra-ên,” nhưng ở đây là danh xưng giao ước chỉ dân Y-sơ-ra-ên nói chung; “con dân” giữ sắc thái thuộc về một dân tộc mà không khiến độc giả hiểu là chỉ nam giới.
- source_word: וְיִקְחוּ לִי
  choice: họ phải lấy ... dâng cho Ta
  rationale: Động từ tiền tố sau mệnh lệnh mang lực chỉ thị; “phải” truyền đạt mệnh lệnh gián tiếp, còn “dâng cho Ta” diễn đạt hướng quy thuộc của לִי tự nhiên hơn tiếng Việt máy móc “lấy cho Ta.”
- source_word: תְּרוּמָה
  choice: lễ vật
  rationale: Chỉ một phần đóng góp được biệt riêng cho mục đích thánh. “Lễ vật” giữ định hướng dâng cho Đức Chúa Trời mà không thu hẹp thành một loại tế lễ cụ thể.
- source_word: מֵאֵת כָּל אִישׁ
  choice: từ mỗi người
  rationale: Giữ ý phân phối của “mỗi” và dùng cách nói tự nhiên trong tiếng Việt; trong ngữ cảnh toàn dân, אִישׁ có thể chỉ từng cá nhân chứ không nhất thiết loại trừ phụ nữ.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: có lòng tự nguyện
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ về sự thôi thúc tự nguyện từ nội tâm, tránh thêm ý cưỡng ép hay quy định mức dâng.
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: Các ngươi hãy nhận lễ vật dâng cho Ta
  rationale: Chủ ngữ số nhiều được thể hiện rõ. Ở vế quản lý việc quyên góp, “nhận” tự nhiên hơn việc lặp lại “lấy”; “dâng cho Ta” giữ ý lễ vật thuộc về Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của תְּרוּמָה trong bối cảnh dựng Đền Tạm
  choice: lễ vật
  alternative: phần đóng góp
  rationale: “Lễ vật” bảo toàn tính thánh và hướng về Đức Chúa Trời, nhưng không biến vật liệu quyên góp thành sinh tế; “phần đóng góp” vẫn là một khả năng từ vựng.
- issue: Tính tự nguyện trong אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: có lòng tự nguyện
  alternative: được lòng mình thôi thúc
  rationale: Cách chọn làm rõ sự sẵn lòng từ bên trong mà không coi đây là một khoản bắt buộc; phương án kia giữ hình ảnh “lòng” như tác nhân rõ hơn nhưng kém tự nhiên đôi chút.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu. Dùng “Ta/các ngươi” phù hợp lời phán của Đức Chúa Trời trong văn cảnh Kinh Thánh; “con dân Y-sơ-ra-ên” là danh xưng cộng đồng, không chủ ý giới hạn ở nam giới.
