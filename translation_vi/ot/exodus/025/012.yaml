base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: vi
  text: 'Ngươi phải đúc cho Hòm bốn khoen bằng vàng và gắn chúng vào bốn chân Hòm[a]: hai khoen ở một bên và hai khoen ở bên kia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bốn góc Hòm”. Từ Hê-bơ-rơ ở đây khó xác định, nhưng có lẽ chỉ các chân hoặc phần đỡ phía dưới của Hòm hơn là các điểm góc theo nghĩa trừu tượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: Ngươi phải đúc
  rationale: Trong ngữ cảnh chế tác các bộ phận bằng vàng, יצק chỉ việc đúc kim loại, không chỉ đơn thuần là đổ.
- source_word: טַבְּעֹת
  choice: khoen
  rationale: Danh từ này chỉ các vòng kim loại dùng để luồn đòn khiêng; “khoen” tự nhiên và chính xác trong tiếng Việt.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt trực tiếp vật liệu chế tác.
- source_word: וְנָתַתָּה
  choice: và gắn chúng
  rationale: נתן có nghĩa rộng là đặt hoặc để; trong ngữ cảnh lắp khoen vào Hòm, “gắn” diễn đạt rõ chức năng mà không thêm chi tiết kỹ thuật quá mức.
- source_word: פַּעֲמֹתָיו
  choice: bốn chân Hòm
  rationale: Từ này khó xác định trong câu này, nhưng có lẽ chỉ các chân hay phần đỡ phía dưới của Hòm; cách dịch giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ.
- source_word: צַלְעוֹ
  choice: một bên ... bên kia
  rationale: Trong ngữ cảnh một vật thể, צלע chỉ mặt hoặc bên. Tiếng Việt tự nhiên dùng “một bên ... bên kia” để thể hiện hai phía đối ứng.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: một bên ... bên kia
  rationale: Dịch tự nhiên cặp bên thứ nhất và bên thứ hai mà vẫn giữ sự phân bố hai khoen ở mỗi phía.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng, rõ ràng và hiện đại. Dùng “Ngươi” để giữ lối xưng hô trực tiếp số ít của lời truyền phán; viết hoa “Hòm” vì đối tượng đã được xác định trong văn cảnh là Hòm Giao Ước.
