  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: vi
  text: Hãy làm các đòn khiêng bằng gỗ keo và bọc chúng bằng vàng; chiếc bàn sẽ được khiêng bằng các đòn ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Hãy làm
  rationale: Dạng động từ trong mạch chỉ dẫn mang lực mệnh lệnh. “Hãy làm” diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại mà không cần thêm đại từ xưng hô vốn không được nêu rõ trong câu.
- source_word: הַבַּדִּים
  choice: các đòn khiêng
  rationale: Trong ngữ cảnh đồ dùng Đền Tạm, từ này chỉ những đòn dùng để khiêng vật thánh. “Đòn khiêng” rõ nghĩa hơn “đòn” đứng riêng.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm kết cấu chỉ loại gỗ. “Gỗ keo” là cách gọi hiện đại, dễ hiểu cho loại gỗ được nói đến, thay vì phiên âm tên cây.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: và bọc vàng
  rationale: Trong ngữ cảnh chế tác, צפה chỉ việc phủ hoặc dát một vật bằng kim loại. “Bọc vàng” ngắn gọn, tự nhiên và giữ đúng ý phủ bên ngoài.
- source_word: וְנִשָּׂא בָם
  choice: sẽ được khiêng bằng các đòn ấy
  rationale: 'Giữ thể bị động của động từ và diễn đạt בָם theo nghĩa phương tiện: các đòn là dụng cụ dùng để khiêng bàn.'
- source_word: הַשֻּׁלְחָן
  choice: chiếc bàn
  rationale: Chỉ chiếc bàn đã được mô tả ngay trước đó. Danh từ loại “chiếc” giúp câu tiếng Việt tự nhiên mà không thêm nội dung giải thích.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại, dễ hiểu. Dùng “Hãy làm” thay cho lối xưng hô cổ như “ngươi phải làm”; giữ cấu trúc bị động ở vế cuối để phản ánh sát tiếng Hê-bơ-rơ.
