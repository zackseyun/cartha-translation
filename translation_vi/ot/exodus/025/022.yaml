base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: vi
  text: Tại đó, Ta sẽ gặp con và phán với con, từ phía trên nắp chuộc tội[a], từ giữa hai chê-ru-bim ở trên Hòm Chứng Ước, về mọi điều Ta sẽ truyền cho con liên quan đến con cái Y-sơ-ra-ên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nắp xá tội” hoặc đơn giản là “nắp”. Từ Hê-bơ-rơ chỉ chiếc nắp bằng vàng của Hòm; cách dịch truyền thống khác là “ngai thương xót”.
    reason: lexical_alternative
  - marker: b
    text: Cụm cuối theo sát nguyên văn có thể hiểu là “mọi điều Ta sẽ truyền cho con cho/về con cái Y-sơ-ra-ên”. Cấu trúc này có thể chỉ các mệnh lệnh liên quan đến họ hoặc dành cho họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: Ta sẽ gặp con tại đó
  rationale: Động từ Niphal của יעד diễn tả việc gặp theo sự định trước; “gặp con” tự nhiên trong tiếng Việt và giữ tính trực tiếp của lời Đức Chúa Trời phán với Môi-se.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: và phán với con
  rationale: אִתְּךָ hỗ trợ sắc thái “với con”; “phán” phù hợp với lời trực tiếp của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: từ phía trên nắp chuộc tội
  rationale: Giữ rõ vị trí phát ra tiếng phán và chức năng tế tự của הַכַּפֹּרֶת, đồng thời tránh hình ảnh khó hiểu của cách dịch sát truyền thống “ngai thương xót”.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: từ giữa hai chê-ru-bim
  rationale: Chuyển đạt trực tiếp cụm chỉ không gian và phiên âm tên loại hữu thể thiên thượng thay vì đồng nhất với hình tượng thiên sứ phổ thông.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: ở trên Hòm Chứng Ước
  rationale: עַל được dịch là “ở trên”; הָעֵדֻת được giữ bằng thuật ngữ “Chứng Ước”, chỉ chứng cứ/giao ước được đặt trong hòm mà không tự ý thêm “các bảng” vào câu.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ אֶל בְּנֵי יִשְׂרָאֵל
  choice: mọi điều Ta truyền cho con để con nói lại với con cái Y-sơ-ra-ên
  rationale: Nguyên văn có cấu trúc nén với אֶל sau “truyền cho con”. Bản dịch làm rõ rằng Môi-se nhận mệnh lệnh để truyền đạt cho dân, nhưng chú thích bảo lưu khả năng dịch sát hơn.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת
  choice: nắp chuộc tội
  alternative: nắp xá tội; nắp Hòm
  rationale: Danh từ vừa chỉ chiếc nắp bằng vàng trên Hòm vừa mang ý nghĩa tế tự liên quan đến sự chuộc tội. “Nắp chuộc tội” giữ được cả vật thể lẫn sức nặng thần học mà không biến nó thành một chỗ ngồi theo nghĩa đen.
- issue: Ý nghĩa của אֶל בְּנֵי יִשְׂרָאֵל trong cấu trúc câu
  choice: để con nói lại với con cái Y-sơ-ra-ên
  alternative: cho con cái Y-sơ-ra-ên; với con cái Y-sơ-ra-ên
  rationale: Cấu trúc Hê-bơ-rơ có thể hiểu là các mệnh lệnh dành cho dân hoặc lời Môi-se phải truyền đến dân. Bản chính diễn đạt tự nhiên theo ngữ cảnh trung gian của Môi-se, còn chú thích giữ các cách hiểu gần mặt chữ.
- issue: Cách gọi בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Giữ thành ngữ thân tộc của nguyên văn, có nghĩa đại diện cho toàn dân chứ không chỉ nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ta/con” cho lời Đức Chúa Trời nói trực tiếp với Môi-se; viết hoa tên các vật thánh như Hòm Chứng Ước. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn.
