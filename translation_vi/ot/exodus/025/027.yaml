  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: vi
  text: Các khoen phải ở đối diện với khung[a], làm chỗ luồn các đòn[b] để khiêng bàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dọc theo khung” hoặc “tương ứng với khung.” Cụm giới từ Hê-bơ-rơ chỉ vị trí tương quan nhưng không xác định chính xác cách bố trí.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “làm nhà cho các đòn,” tức là những chỗ tiếp nhận hoặc giữ các đòn khi luồn vào.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: ở ngang với
  rationale: Cụm từ chỉ vị trí tương quan với khung nhưng không xác định chính xác hình học; “ở ngang với” tự nhiên trong tiếng Việt và giữ được độ mở của nguyên ngữ.
- source_word: הַמִּסְגֶּרֶת
  choice: khung
  rationale: Trong ngữ cảnh đồ dùng Đền Tạm, từ này chỉ bộ phận kết cấu bao quanh bàn; “khung” vừa rộng nghĩa vừa phù hợp với mô tả chế tác.
- source_word: תִּהְיֶיןָ
  choice: phải ở
  rationale: Dạng động từ tồn tại ở đây nằm trong chỉ thị chế tác; “phải” diễn đạt tính quy định, còn “ở” thể hiện vị trí.
- source_word: הַטַּבָּעֹת
  choice: các khoen
  rationale: “Khoen” là từ thông dụng chỉ vòng kim loại gắn vào vật để luồn đòn, chính xác và tự nhiên hơn “nhẫn” trong ngữ cảnh này.
- source_word: לְבָתִּים
  choice: làm chỗ luồn
  rationale: Nghĩa đen là “làm nhà/chỗ chứa”; trong cấu tạo chiếc bàn, cụm này chỉ bộ phận tiếp nhận các đòn. “Chỗ luồn” truyền đạt rõ chức năng mà không ép thành một kiểu cấu tạo cụ thể.
- source_word: לְבַדִּים
  choice: đòn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ các thanh dùng để khiêng đồ thánh; “đòn” là cách nói Việt ngữ gọn và quen thuộc.
- source_word: לָשֵׂאת
  choice: để khiêng
  rationale: Động từ nguyên mẫu diễn tả mục đích; “để khiêng” phù hợp với việc vận chuyển bàn bằng đòn.
- source_word: הַשֻּׁלְחָן
  choice: bàn
  rationale: Cách tương đương chuẩn và rõ ràng cho chiếc bàn đang được mô tả.
theological_decisions: []
