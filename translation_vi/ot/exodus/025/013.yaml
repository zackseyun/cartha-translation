  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Con hãy làm
  rationale: Dạng động từ hoàn thành Qal có liên từ trong chuỗi chỉ thị mang lực mệnh lệnh. “Con hãy làm” diễn đạt tự nhiên lời Đức Chúa Trời truyền trực tiếp cho Môi-se.
- source_word: בַדֵּי
  choice: các đòn khiêng
  rationale: Danh từ số nhiều chỉ những đòn dùng để khiêng Hòm Giao Ước. “Đòn khiêng” rõ công dụng và tự nhiên hơn cách gọi chỉ chung là “cây đòn”.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm danh từ ghép chỉ loại gỗ lấy từ cây keo; “gỗ keo” là cách gọi hiện đại, dễ hiểu trong tiếng Việt.
- source_word: וְצִפִּיתָ
  choice: và bọc
  rationale: Động từ chỉ việc phủ một vật liệu lên bề mặt; trong ngữ cảnh chế tác đồ thánh, “bọc” diễn đạt gọn và đúng việc phủ vàng lên lõi gỗ.
- source_word: אֹתָם
  choice: '[lược bỏ đại từ tân ngữ trong bản dịch]'
  rationale: Đại từ số nhiều quy chiếu về các đòn khiêng. Tiếng Việt tự nhiên không cần lặp “chúng”; đối tượng của “bọc vàng” vẫn rõ từ mệnh đề trước.
- source_word: זָהָב
  choice: vàng
  rationale: Danh từ chỉ vật liệu dùng để phủ; kết hợp “bọc vàng” là thành ngữ tự nhiên trong tiếng Việt.
