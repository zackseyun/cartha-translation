  text: וְ/עָ֥שׂוּ לִ֖/י מִקְדָּ֑שׁ וְ/שָׁכַנְתִּ֖י בְּ/תוֹכָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: vi
  text: Họ hãy làm cho Ta một nơi thánh, để Ta ngự giữa họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “ở giữa họ.” Tiếng Hê-bơ-rơ nhấn mạnh Đức Chúa Trời hiện diện giữa dân chúng, chứ không chỉ ở bên trong nơi thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Họ hãy làm
  rationale: Trong mạch chỉ thị, dạng động từ này có lực mệnh lệnh đối với ngôi thứ ba số nhiều; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: לִי
  choice: cho Ta
  rationale: 'Giới từ ל với hậu tố ngôi thứ nhất số ít diễn tả đối tượng thụ hưởng hoặc mục đích: nơi thánh được làm cho Đức Chúa Trời.'
- source_word: מִקְדָּשׁ
  choice: một nơi thánh
  rationale: Danh từ chỉ một nơi được biệt riêng là thánh cho sự hiện diện của Đức Chúa Trời. “Nơi thánh” rõ nghĩa, trang trọng và không khiến độc giả mặc nhiên đồng nhất nó với một kiến trúc đền thờ về sau.
- source_word: וְשָׁכַנְתִּי
  choice: để Ta ngự
  rationale: Động từ שׁכן có nghĩa là cư ngụ, ở giữa. “Ngự” phù hợp với chủ thể thần linh và giữ văn phong trang trọng; “để” diễn đạt quan hệ mục đích tự nhiên trong ngữ cảnh.
- source_word: בְּתוֹכָם
  choice: giữa họ
  rationale: Cụm từ theo sát nghĩa là “ở giữa họ”; hậu tố số nhiều chỉ dân chúng, chứ không phải “trong nơi ấy”.
theological_decisions:
- issue: Đối tượng và phạm vi sự ngự trị của Đức Chúa Trời
  choice: giữa họ
  alternative: trong đó
  rationale: Bản Hê-bơ-rơ dùng hậu tố số nhiều “họ”, nhấn mạnh sự hiện diện của Đức Chúa Trời giữa dân Ngài. Không đổi đại từ thành số ít để giới hạn sự hiện diện ấy trong công trình.
- issue: Quan hệ giữa hai mệnh đề
  choice: để Ta ngự
  alternative: và Ta sẽ ngự
  rationale: Ngữ cảnh cho phép hiểu mệnh đề sau theo sắc thái mục đích hoặc kết quả. “Để” diễn đạt mối liên hệ tự nhiên nhưng không xác định thêm cơ chế hay điều kiện thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Viết hoa “Ta” để biểu thị lời Đức Chúa Trời tự xưng; tránh thuật ngữ mang sắc thái hệ phái. Dùng “nơi thánh” thay vì từ vay mượn hoặc cách gọi dễ gợi riêng đền thờ cố định.
