  text: כִּכָּ֛ר זָהָ֥ב טָה֖וֹר יַעֲשֶׂ֣ה אֹתָ֑/הּ אֵ֥ת כָּל הַ/כֵּלִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: vi
  text: Phải dùng một ta-lâng vàng nguyên chất để làm chân đèn cùng với tất cả các dụng cụ này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “dụng cụ” có nghĩa rộng, cũng có thể chỉ các vật dụng, đồ dùng hoặc đồ chứa đi kèm chân đèn.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: một ta-lâng
  rationale: Đây là đơn vị trọng lượng tiêu chuẩn trong bối cảnh Đền Tạm. Giữ thuật ngữ đo lường truyền thống “ta-lâng” chính xác hơn cách diễn đạt chung chung về một lượng vàng.
- source_word: זָהָב טָהוֹר
  choice: vàng nguyên chất
  rationale: Cụm từ chỉ vàng tinh sạch về vật liệu; “vàng nguyên chất” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: để làm chân đèn
  rationale: Động từ mang sắc thái chỉ thị, còn đại từ giống cái số ít quy chiếu về chân đèn trong văn cảnh trước. Nêu lại “chân đèn” giúp câu tiếng Việt tự nhiên và tránh đại từ “nó” thiếu trang trọng, nhưng không thêm một đối tượng mới.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: cùng với tất cả các dụng cụ này
  rationale: כֵּלִים là từ nghĩa rộng, có thể chỉ dụng cụ, vật dụng hoặc đồ chứa. “Các dụng cụ” phù hợp với những vật đi kèm chân đèn, còn “cùng với” thể hiện rằng chúng đều nằm trong tổng lượng vàng được nêu.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng tự nhiên. Cấu trúc “Phải dùng…” diễn đạt lực mệnh lệnh của động từ Hê-bơ-rơ mà không gán chủ thể cụ thể khi nguyên văn để chủ thể ngầm. “Chân đèn” được nêu lại từ văn cảnh thay cho đại từ giống cái nhằm bảo đảm tiếng Việt rõ ràng, dễ đọc.
