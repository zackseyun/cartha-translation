source:
  edition: WLC
  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: vi
  text: Họ phải làm một chiếc hòm[a] bằng gỗ keo[b], dài hai thước rưỡi, rộng một thước rưỡi và cao một thước rưỡi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể dịch là “rương” hoặc “hộp”; ở đây từ này chỉ chiếc hòm thánh về sau được gọi là Hòm Giao Ước.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “gỗ si-tim”, tức một loại gỗ thường được nhận diện là gỗ keo.'
    reason: lexical_alternative
  - marker: c
    text: “Thước” ở đây là đơn vị đo chiều dài cổ, xấp xỉ khoảng cách từ khuỷu tay đến đầu ngón tay.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Họ phải làm
  rationale: Dạng động từ số nhiều trong văn mạch chỉ thị diễn đạt mệnh lệnh dành cho cộng đồng; “phải làm” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: אֲרוֹן
  choice: chiếc hòm
  rationale: Từ Hê-bơ-rơ chỉ một vật chứa dạng hòm; “hòm” vừa sát nghĩa vừa phù hợp với cách gọi Hòm Giao Ước trong văn mạch thánh.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm từ chỉ vật liệu làm từ loại cây thường được nhận diện là acacia; “gỗ keo” là cách gọi hiện đại, dễ hiểu.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: hai thước rưỡi
  rationale: Giữ nguyên đơn vị đo cổ thay vì quy đổi phỏng chừng, đồng thời diễn đạt số đo tự nhiên trong tiếng Việt.
- source_word: אָרְכּוֹ
  choice: dài
  rationale: Trong chuỗi kích thước của một đồ vật, cấu trúc tính từ “dài” tự nhiên hơn “chiều dài của nó” mà vẫn truyền đạt đầy đủ nghĩa.
- source_word: וְאַמָּה וָחֵצִי
  choice: một thước rưỡi
  rationale: Phản ánh trực tiếp cấu trúc một đơn vị cộng thêm một nửa và đọc tự nhiên trong tiếng Việt.
- source_word: רָחְבּוֹ
  choice: rộng
  rationale: Diễn đạt chiều ngang của đồ vật bằng từ thông dụng, hiện đại.
- source_word: קֹמָתוֹ
  choice: cao
  rationale: Trong mô tả đồ vật, từ này chỉ kích thước theo chiều đứng; “cao” là cách diễn đạt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chiếc hòm” để giữ nghĩa cụ thể của אֲרוֹן, dùng cấu trúc “dài… rộng… cao…” cho tự nhiên trong tiếng Việt, và giữ đơn vị đo cổ với chú thích thay vì tự ý quy đổi.
