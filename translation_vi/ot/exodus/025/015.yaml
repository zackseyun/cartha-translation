  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: vi
  text: Các đòn phải luôn ở trong các khoen của Hòm Giao Ước[a]; không được rút chúng ra khỏi hòm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các đòn phải ở trong các khoen của Hòm Giao Ước; không được lấy chúng ra khỏi hòm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: ở trong các khoen
  rationale: טַבַּעַת là khoen gắn vào hòm; giới từ בְ diễn tả các đòn nằm trong hoặc xuyên qua những khoen ấy. “Ở trong các khoen” tự nhiên và sát cấu trúc nguồn.
- source_word: הָאָרֹן
  choice: Hòm Giao Ước
  rationale: Trong ngữ cảnh Đền Tạm, אָרוֹן chỉ chiếc hòm thánh. “Hòm Giao Ước” là cách gọi rõ nghĩa, quen thuộc trong tiếng Việt và phân biệt với một chiếc hòm thông thường.
- source_word: יִהְיוּ
  choice: phải luôn ở
  rationale: Nghĩa cơ bản là “ở”, nhưng mệnh đề cấm theo sau cho thấy trạng thái phải được duy trì. “Phải luôn ở” truyền đạt cả tính quy định lẫn tính liên tục mà không làm mất nghĩa đen.
- source_word: הַבַּדִּים
  choice: các đòn
  rationale: בַּדִּים là những đòn dùng để khiêng hòm. “Các đòn” ngắn gọn, tự nhiên trong ngữ cảnh đồ thờ phụng; chức năng khiêng đã rõ từ văn cảnh gần.
- source_word: לֹא יָסֻרוּ
  choice: không được rút chúng ra
  rationale: סוּר có thể là rời đi, bị dời hoặc bị lấy ra. Với các đòn nằm trong khoen, “không được rút chúng ra” diễn đạt tự nhiên mệnh lệnh cấm di chuyển chúng.
- source_word: מִמֶּנּוּ
  choice: khỏi hòm
  rationale: Hậu tố đại từ chỉ về chiếc hòm. Lặp lại “hòm” trong tiếng Việt làm rõ vật quy chiếu và tránh cách nói mơ hồ “khỏi nó”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hòm Giao Ước” dùng như danh xưng quen thuộc trong ngữ cảnh này; “các đòn” tránh từ cổ. Câu chính nêu rõ sắc thái duy trì của יִהְיוּ, còn chú thích bảo lưu cách dịch sát hơn là “phải ở” và khả năng dịch סוּר là “lấy ra”.
