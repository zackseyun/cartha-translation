  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: vi
  text: 'Và đây là phần đóng góp mà các ngươi phải nhận từ họ: vàng, bạc và đồng[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đồng đỏ” hoặc “đồng thiếc”; từ Hê-bơ-rơ נְחֹשֶׁת có thể chỉ đồng hoặc hợp kim đồng, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Đây là
  rationale: Cách trình bày tự nhiên trong tiếng Việt, giữ chức năng giới thiệu phần liệt kê của liên từ וְ và đại từ chỉ định זֹאת; không nhất thiết phải dịch וְ thành “và” trong câu Việt.
- source_word: הַ/תְּרוּמָה
  choice: lễ vật
  rationale: תְּרוּמָה chỉ vật đóng góp được biệt riêng cho mục đích thánh. “Lễ vật” vừa tự nhiên, trang trọng, vừa giữ sắc thái dâng hiến trong bối cảnh vật liệu làm Đền Tạm.
- source_word: אֲשֶׁר
  choice: mà
  rationale: Đại từ quan hệ tự nhiên trong tiếng Việt, mở đầu mệnh đề bổ nghĩa cho “lễ vật”.
- source_word: תִּקְח֖וּ
  choice: các ngươi sẽ nhận
  rationale: Động từ לקח ở thể Qal, ngôi hai số nhiều, mang lực chỉ thị. Trong ngữ cảnh thu nhận lễ vật do dân dâng, “nhận” tự nhiên hơn “lấy” mà vẫn phản ánh hành động tiếp nhận từ họ.
- source_word: מֵ/אִתָּם
  choice: từ họ
  rationale: Dịch trực tiếp giới từ và hậu tố đại từ, chỉ dân Y-sơ-ra-ên trong ngữ cảnh.
- source_word: זָהָב
  choice: vàng
  rationale: Tên vật liệu thông dụng và chính xác.
- source_word: וָ/כֶסֶף
  choice: bạc
  rationale: Tên vật liệu thông dụng trong danh sách kim loại được dâng.
- source_word: וּ/נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng đỏ hoặc hợp kim đồng như đồng thiếc. “Đồng” giữ được phạm vi nghĩa rộng tự nhiên trong tiếng Việt; chú thích nêu rõ các khả năng cụ thể.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ cách xưng hô số nhiều trực tiếp trong lời truyền lệnh; dùng “lễ vật” để diễn đạt một khoản đóng góp dành riêng cho việc thánh mà không mô tả quá mức nghi thức.
