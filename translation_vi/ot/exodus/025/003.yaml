  - severity: low
    issue: “lễ vật” có thể gợi nghĩa vật tế lễ cụ thể.
    rationale: תְּרוּמָה ở đây chỉ sự đóng góp được dành riêng, tiếp theo là danh sách vật liệu. “Phần đóng góp” sát chức năng ngữ cảnh hơn mà không phủ nhận tính thánh của mục đích.
  revised_text: 'Và đây là phần đóng góp mà các ngươi phải nhận từ họ: vàng, bạc và đồng[a].'
