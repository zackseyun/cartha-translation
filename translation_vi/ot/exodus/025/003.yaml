review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng danh sách kim loại và quan hệ “từ họ”. Tuy nhiên, “sẽ nhận” dễ được hiểu là thì tương lai thuần túy, trong khi thể chưa hoàn thành ngôi thứ hai số nhiều ở đây mang lực chỉ thị trong lời hướng dẫn. “Lễ vật” cũng có thể gợi một vật tế lễ cụ thể hơn là khoản/vật liệu đóng góp được dành riêng; “phần đóng góp” phản ánh sát hơn תְּרוּמָה trong danh sách vật liệu này.
  naturalness: Câu sửa vẫn tự nhiên trong tiếng Việt hiện đại, trang trọng. “Phải nhận” biểu đạt rõ mệnh lệnh mà không chuyển động từ לקח thành hành vi chiếm lấy; “từ họ” giữ quan hệ nguồn. Thêm “Và” phản ánh liên từ mở đầu, đồng thời vẫn trôi chảy trong văn cảnh.
  terminology: Dùng “phần đóng góp” cho תְּרוּמָה để tránh thu hẹp vào nghĩa tế lễ. Giữ “đồng” cho נְחֹשֶׁת, vì từ này có phạm vi bao gồm đồng đỏ hoặc đồng thiếc/bronze tùy ngữ cảnh; chú thích bảo tồn sự bất định từ vựng.
  issues:
