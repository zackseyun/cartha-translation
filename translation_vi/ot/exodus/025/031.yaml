base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: vi
  text: Ngươi phải làm một chân đèn bằng vàng ròng. Chân đèn phải được chế tác bằng búa; đế, thân, các chén, các nụ[a] và các hoa của nó đều phải liền một khối với chân đèn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các nụ” cũng có thể dịch là “các núm”. Từ Hê-bơ-rơ chỉ những phần lồi tròn dùng để trang trí trong thiết kế hoa lá của chân đèn.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: chân đèn
  rationale: Danh từ chỉ giá đỡ các ngọn đèn, không phải bản thân các ngọn đèn; “chân đèn” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cách nói trang trọng, quen thuộc để chỉ vàng tinh khiết, phù hợp với ngữ cảnh vật liệu dùng cho nơi thánh.
- source_word: מִקְשָׁה
  choice: làm bằng cách dát búa
  rationale: Từ Hê-bơ-rơ mô tả kỹ thuật tạo hình kim loại bằng cách dùng búa, dường như từ một khối duy nhất chứ không lắp ghép các phần riêng.
- source_word: תֵּעָשֶׂה
  choice: phải được làm
  rationale: Dạng động từ thụ động trong văn cảnh chỉ thị được chuyển thành mệnh lệnh tự nhiên trong tiếng Việt.
- source_word: יְרֵכָהּ
  choice: đế
  rationale: Nghĩa đen liên quan đến “đùi/cạnh”, nhưng khi nói về cấu tạo đồ vật, từ này chỉ phần dưới nâng đỡ.
- source_word: וְקָנָהּ
  choice: thân
  rationale: Ở đây từ số ít chỉ trục hoặc thân chính của chân đèn; “thân” tự nhiên hơn “nhánh” trước khi các nhánh bên được mô tả.
- source_word: גְּבִיעֶיהָ
  choice: các đài hoa
  rationale: Từ này chỉ các bộ phận có hình chén. Trong thiết kế mang hình thái thực vật của chân đèn, “đài hoa” vừa diễn đạt hình chén vừa giữ mạch hình ảnh hoa lá.
- source_word: כַּפְתֹּרֶיהָ
  choice: các nụ
  rationale: Từ chỉ những chỗ lồi tròn dùng để trang trí; “nụ” phù hợp với tổng thể họa tiết hoa, nhưng nghĩa “núm” vẫn có thể được hiểu và được ghi chú.
- source_word: וּפְרָחֶיהָ
  choice: các hoa
  rationale: Diễn đạt trực tiếp họa tiết hoa được nêu trong nguyên văn.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: phải liền một khối với nó
  rationale: Cụm từ cho biết các bộ phận phát xuất từ chính chân đèn, không phải những chi tiết được chế tạo riêng rồi gắn vào.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “ngươi” để phản ánh lời truyền trực tiếp số ít dành cho Môi-se; câu sau chuyển sang cấu trúc bị động tự nhiên. Các thuật ngữ thủ công và trang trí được diễn đạt rõ ràng, đồng thời chú thích những chỗ nguyên ngữ có thể hiểu theo hơn một cách.
