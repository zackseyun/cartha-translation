revisions:
- from: Ngươi phải làm một chân đèn bằng vàng ròng. Chân đèn phải được làm bằng cách dát búa[a]; đế, thân, các đài hoa, các nụ[b] và các hoa của nó phải liền một khối với nó.
  to: Ngươi phải làm một chân đèn bằng vàng ròng. Chân đèn phải được chế tác bằng búa; đế, thân, các chén, các nụ[a] và các hoa của nó đều phải liền một khối với chân đèn.
  rationale: Sửa thuật ngữ kỹ thuật “dát búa” thành “được chế tác bằng búa” để phản ánh đúng công việc gò/tạo hình kim loại. Đổi “các đài hoa” thành “các chén” để không thu hẹp nghĩa của từ chỉ vật có dạng chén. Câu cuối được diễn đạt lại để làm rõ rằng mọi bộ phận nêu ra phải liền một khối với chính chân đèn. Chuyển chú thích về kỹ thuật chế tác sang mốc b để mốc chú thích được đặt sau cụm từ mà nó giải thích.
