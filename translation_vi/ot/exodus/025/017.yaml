base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: vi
  text: Hãy làm một nắp chuộc tội[a] bằng vàng ròng, dài hai cu-bít rưỡi và rộng một cu-bít rưỡi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nắp đậy xá tội.” Từ Hê-bơ-rơ כַּפֹּרֶת chỉ tấm nắp bằng vàng đặt trên Hòm Giao Ước và có liên hệ với gốc כפר, mang ý nghĩa chuộc tội.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Trong mạch chỉ thị về Đền Tạm, dạng động từ này mang lực mệnh lệnh. “Ngươi phải làm” tự nhiên, trang trọng và giữ rõ đối tượng số ít được truyền lệnh.
- source_word: כַפֹּרֶת
  choice: nắp chuộc tội
  rationale: Danh từ chỉ tấm nắp bằng vàng đặt trên Hòm Giao Ước và có liên hệ với gốc כפר về việc chuộc tội. “Nắp chuộc tội” vừa nhận diện hình dạng/chức năng vật thể, vừa giữ liên hệ thần học mà không biến nó thành một chiếc ghế hay chỉ là nắp thông thường.
- source_word: זָהָב טָהוֹר
  choice: bằng vàng ròng
  rationale: “Vàng ròng” là cách nói tiếng Việt tự nhiên về vàng tinh khiết; giới từ “bằng” diễn đạt rõ vật liệu chế tác.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: hai cu-bít rưỡi
  rationale: Giữ nguyên đơn vị đo cổ thay vì quy đổi thiếu chắc chắn; cách diễn đạt này gọn và tự nhiên trong tiếng Việt.
- source_word: אָרְכָּהּ
  choice: dài
  rationale: Diễn đạt tự nhiên thuộc tính chiều dài của vật thể trong cấu trúc đo kích thước tiếng Việt.
- source_word: וְאַמָּה וָחֵצִי
  choice: và rộng một cu-bít rưỡi
  rationale: Giữ số đo và cấu trúc song song với chiều dài, đồng thời phù hợp cú pháp tiếng Việt.
- source_word: רָחְבָּהּ
  choice: rộng
  rationale: Diễn đạt trực tiếp chiều rộng; sở hữu đã rõ từ chủ thể “nắp chuộc tội” nên không cần lặp “của nó”.
theological_decisions:
- issue: Cách dịch כַפֹּרֶת trong ngữ cảnh nghi lễ và thần học
  choice: nắp chuộc tội
  alternative: nắp xá tội; nắp Hòm; ngai thương xót
  rationale: Từ này vừa gọi tấm nắp bằng vàng trên Hòm Giao Ước, vừa gắn với gốc כפר. “Nắp chuộc tội” giữ cả tính vật thể lẫn liên hệ chuộc tội. Chú thích bảo lưu các cách hiểu khác, vì bản thân danh từ không nói hết cơ chế hay sắc thái thần học của sự chuộc tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phản ánh lời truyền trực tiếp ở số ít cho Môi-se; dùng “cu-bít” nhằm bảo toàn đơn vị đo cổ. Câu tiếng Việt được sắp xếp tự nhiên theo mẫu vật thể–vật liệu–kích thước.
