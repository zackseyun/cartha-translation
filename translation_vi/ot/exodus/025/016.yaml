  terminology: Giữ “Hòm Giao Ước” như tên gọi quy ước, dễ nhận biết của chiếc hòm thánh trong văn mạch. Dùng “lời chứng” cho הָעֵדֻת; chú thích nêu phương án cụ thể hơn là các bảng chứng ước, nhưng không đưa chi tiết ấy vào chính văn.
