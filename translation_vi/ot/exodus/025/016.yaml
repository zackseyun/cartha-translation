  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh đặt vật vào trong hòm và lời hứa tương lai của Đức Chúa Trời. Tuy nhiên, “chứng ước” là một thuật ngữ chuyên biệt, kém sáng rõ trong tiếng Việt hiện đại; cách viết “lời chứng” giữ sát nghĩa עֵדוּת (“testimony”) mà không thêm rõ nghĩa “giao ước” vào danh từ nguồn.
