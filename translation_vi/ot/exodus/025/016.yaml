- from: Con hãy đặt vào trong Hòm Giao Ước chứng ước mà Ta sẽ ban cho con.[a]
  to: Con hãy đặt vào trong Hòm Giao Ước lời chứng mà Ta sẽ ban cho con.[a]
  rationale: Thay “chứng ước” bằng “lời chứng” để phản ánh trực tiếp hơn nghĩa của הָעֵדֻת và dùng tiếng Việt hiện đại, sáng rõ hơn. Chú thích vẫn bảo lưu cách hiểu theo văn cảnh là các bảng chứng ước, không áp đặt chi tiết đó lên chính văn. Các thành phần còn lại—mệnh lệnh “hãy đặt”, hướng “vào trong”, tên gọi quy ước “Hòm Giao Ước”, và quan hệ Ta—con—đều có thể giữ nguyên.
  reviewer_model: gpt-5.6-terra
