  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: vi
  text: Con hãy đặt vào trong Hòm Giao Ước lời chứng mà Ta sẽ ban cho con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, theo văn cảnh cụ thể hơn: “các bảng chứng ước.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Con hãy đặt
  rationale: Trong cấu trúc với אֶל và một vật chứa, נתן mang nghĩa đặt hay để vào. Mệnh lệnh tiếng Việt tự nhiên truyền đạt sắc thái chỉ thị của dạng hoàn thành liên tiếp trong văn mạch.
- source_word: אֶל
  choice: vào trong
  rationale: Khi đi với động từ đặt và danh từ chỉ vật chứa, giới từ này diễn tả sự đưa vật vào bên trong.
- source_word: הָאָרֹן
  choice: Hòm Giao Ước
  rationale: אָרוֹן nghĩa đen là hòm; trong văn cảnh Đền Tạm, cách gọi quen thuộc và trang trọng này xác định chiếc hòm thánh, dù từ Hê-bơ-rơ tự nó chỉ nói 'cái hòm'.
- source_word: הָעֵדֻת
  choice: chứng ước
  rationale: עֵדוּת mang nghĩa lời hoặc vật làm chứng, và trong Xuất Hành chỉ chứng cứ giao ước do Đức Chúa Trời ban. 'Chứng ước' bảo tồn ý niệm làm chứng và mối liên hệ giao ước mà không đưa 'các bảng đá' vào chính văn.
- source_word: אֲשֶׁר
  choice: mà
  rationale: Đại từ quan hệ tự nhiên trong tiếng Việt nối 'chứng ước' với mệnh đề theo sau.
- source_word: אֶתֵּן
  choice: Ta sẽ ban
  rationale: Dạng Qal chưa hoàn thành ngôi thứ nhất số ít chỉ hành động tương lai; 'ban' phù hợp với lời Đức Chúa Trời nói về điều Ngài trao cho Môi-se.
- source_word: אֵלֶיךָ
  choice: cho con
  rationale: Diễn đạt tự nhiên bổ ngữ gián tiếp số ít; 'con' phù hợp khi Đức Chúa Trời trực tiếp phán với Môi-se trong văn phong trang trọng, dễ hiểu.
theological_decisions:
- issue: Đối tượng được gọi là הָעֵדֻת
  choice: Giữ cách gọi khái quát là 'chứng ước' trong chính văn.
  alternative: Dịch cụ thể là 'các bảng Chứng Ước' hoặc 'các bảng đá ghi chứng ước'.
  rationale: Câu Hê-bơ-rơ không nêu rõ các bảng đá, dù văn cảnh rộng hơn xác định chứng ước gắn với các bảng. Chính văn giữ mức độ xác định của nguyên bản, còn chú thích cung cấp cách hiểu cụ thể theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng 'Hòm Giao Ước' để người đọc phổ thông nhận ra vật thánh trong văn cảnh; dùng 'chứng ước' nhằm giữ liên hệ giữa ý niệm làm chứng và giao ước. Đại từ 'Ta—con' thể hiện lời Đức Chúa Trời phán trực tiếp với Môi-se.
