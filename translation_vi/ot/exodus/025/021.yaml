base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: vi
  text: Ngươi phải đặt nắp chuộc tội[a] trên Hòm; rồi ngươi phải đặt chứng ước mà Ta sẽ ban cho ngươi vào trong Hòm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nắp xá tội” hoặc “nắp Hòm”. Từ Hê-bơ-rơ chỉ chiếc nắp của Hòm và mang ý nghĩa tế tự liên quan đến việc chuộc tội.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Từ này chỉ chiếc nắp của Hòm, đồng thời mang ý nghĩa nghi lễ liên quan đến việc chuộc tội. Cách dịch này vừa nêu rõ đây là một vật che đậy, vừa giữ được sắc thái tế tự của thuật ngữ Hê-bơ-rơ.
- source_word: מִלְמָעְלָה
  choice: lên trên
  rationale: Trong ngữ cảnh chỉ vị trí đặt nắp so với Hòm; “lên trên Hòm” diễn đạt tự nhiên quan hệ không gian.
- source_word: עֵדֻת
  choice: Chứng Ước
  rationale: Cách dịch ngắn gọn này giữ ý nghĩa chứng nhận mang tính giao ước của từ Hê-bơ-rơ, nhưng không thêm sự xác định “các bảng” vốn không được nói rõ trong câu.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: đặt / đặt / ban
  rationale: Dùng “đặt” cho hành động bố trí các vật, và “ban” cho hành động Đức Chúa Trời trao Chứng Ước, phù hợp cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אֶל הָאָרֹן
  choice: vào trong Hòm
  rationale: Dù giới từ có thể mang nghĩa “đến”, kết hợp với động từ và tân ngữ ở đây rõ ràng diễn tả việc đưa Chứng Ước vào bên trong Hòm.
theological_decisions:
- issue: Cách dịch כַּפֹּרֶת trong bối cảnh tế tự và ý nghĩa chuộc tội
  choice: nắp chuộc tội
  alternative: nắp xá tội; nắp Hòm
  rationale: Nguyên ngữ vừa chỉ nắp của Hòm vừa gắn với nghi thức chuộc tội. “Nắp chuộc tội” giữ cả đặc điểm vật thể lẫn sắc thái tế tự mà không biến thuật ngữ thành một kết luận giáo lý hẹp; chú thích cung cấp các cách gọi khác.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Đại từ “ngươi” và “Ta” duy trì lời phán trực tiếp có sắc thái Kinh Thánh; “Hòm” và “Chứng Ước” được viết hoa như tên gọi của các vật và nội dung giao ước cụ thể trong ngữ cảnh.
