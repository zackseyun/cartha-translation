  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: vi
  text: Con phải làm bảy ngọn đèn của chân đèn; rồi người ấy[a] phải đặt[b] các ngọn đèn ấy để chúng chiếu sáng về phía trước chân đèn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ chuyển từ “con” sang chủ thể ngôi thứ ba số ít, “người ấy”, nhưng câu này không nêu rõ người đó là ai.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “thắp các ngọn đèn ấy”. Động từ Hê-bơ-rơ theo nghĩa đen là “làm cho đi lên”; trong ngữ cảnh này, nó có thể chỉ việc đặt đèn vào vị trí hoặc làm cho ngọn lửa cháy lên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Con phải làm
  rationale: Động từ Qal ngôi thứ hai số ít trong mạch chỉ thị dành cho Môi-se mang lực mệnh lệnh; “Con phải làm” tự nhiên và giữ rõ đối tượng được truyền lệnh.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: bảy ngọn đèn cho chân đèn
  rationale: נֵרֹת là các ngọn đèn, còn hậu tố giống cái số ít chỉ về chân đèn ở văn cảnh trước. Tiếng Việt tự nhiên hơn khi nói các ngọn đèn “cho chân đèn” thay vì “của nó”.
- source_word: וְהֶעֱלָה
  choice: rồi người ấy phải thắp
  rationale: Dạng Hiphil ngôi thứ ba giống đực số ít của עלה theo nghĩa đen là “làm cho đi lên”; khi dùng với đèn trong ngữ cảnh thờ phượng, từ này thường chỉ việc thắp đèn hoặc làm cho ngọn lửa cháy lên. “Người ấy” giữ sự chuyển đổi sang ngôi thứ ba số ít mà không tự ý nêu danh tính chủ thể.
- source_word: וְהֵאִיר
  choice: để chúng chiếu sáng
  rationale: Hiphil của אור diễn tả kết quả hoặc mục đích phát sáng. Dùng “chúng” với tiền ngữ là các ngọn đèn tạo câu tiếng Việt rõ nghĩa mà không thay đổi chức năng của động từ.
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: về phía trước chân đèn
  rationale: Cụm từ chỉ hướng ánh sáng sang vùng ở trước mặt hoặc phía trước của chân đèn. Lặp lại “chân đèn” giúp tránh đại từ mơ hồ trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo lời Đức Chúa Trời truyền trực tiếp cho Môi-se trong mạch văn; lặp lại “chân đèn” để các hậu tố giống cái của tiếng Hê-bơ-rơ không trở thành đại từ mơ hồ trong tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện ngay sau từ ngữ liên quan.
