  to: Con phải làm bảy ngọn đèn của chân đèn; rồi người ấy[a] phải đặt[b] các ngọn đèn ấy để chúng chiếu sáng về phía trước chân đèn.
  rationale: Đổi “thắp” thành “đặt” để không áp đặt một cách hiểu duy nhất cho וְהֶעֱלָה, đồng thời giữ khả năng “thắp” trong chú thích. Đổi “cho chân đèn” thành “của chân đèn” để phản ánh rõ hậu tố sở hữu của tiếng Hê-bơ-rơ. Rút gọn chú thích về chủ thể để tránh suy đoán không được nêu trong câu.
