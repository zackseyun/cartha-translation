revisions:
- from: Một núm ở dưới cặp nhánh thứ nhất từ chân đèn vươn ra, một núm ở dưới cặp nhánh thứ hai từ chân đèn vươn ra, và một núm ở dưới cặp nhánh thứ ba từ chân đèn vươn ra—ứng với sáu nhánh vươn ra từ chân đèn.
  to: Một núm ở dưới hai nhánh vươn ra từ chân đèn, một núm ở dưới hai nhánh vươn ra từ chân đèn, và một núm ở dưới hai nhánh vươn ra từ chân đèn—cho sáu nhánh vươn ra từ chân đèn.
  rationale: Loại bỏ các số thứ tự và cách diễn giải “ứng với” để bảo toàn sự lặp lại và tính cô đọng của nguyên văn. Việc lặp “từ chân đèn” làm rõ đại từ “từ nó” trong tiếng Hê-bơ-rơ mà không thay đổi ý nghĩa.
