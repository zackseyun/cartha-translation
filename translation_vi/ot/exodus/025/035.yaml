translation:
  language: vi
  text: Một núm ở dưới hai nhánh vươn ra từ chân đèn, một núm ở dưới hai nhánh vươn ra từ chân đèn, và một núm ở dưới hai nhánh vươn ra từ chân đèn—cho sáu nhánh vươn ra từ chân đèn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: núm
  rationale: Chỉ phần trang trí lồi, tròn trên thân chân đèn; “núm” tự nhiên và sát nghĩa hơn các từ có thể gợi hình dáng thực vật quá cụ thể.
- source_word: קָנִים
  choice: nhánh
  rationale: Trong ngữ cảnh chân đèn, từ này chỉ các nhánh vươn từ thân chính; “nhánh” rõ nghĩa và phù hợp với cấu tạo được mô tả.
- source_word: מְנֹרָה
  choice: chân đèn
  rationale: Chỉ toàn bộ giá đèn nhiều nhánh, không chỉ riêng ngọn đèn; “chân đèn” là cách gọi thông dụng, dễ hiểu.
- source_word: מִמֶּנָּה / מִן הַמְּנֹרָה
  choice: từ chân đèn vươn ra
  rationale: Đại từ giống cái số ít quy chiếu về chân đèn; diễn đạt rõ quy chiếu trong tiếng Việt mà vẫn giữ ý các nhánh phát xuất từ đó.
- source_word: תַּחַת שְׁנֵי הַקָּנִים
  choice: ở dưới cặp nhánh
  rationale: Giữ quan hệ không gian “ở dưới” và diễn đạt hai nhánh liên kết thành từng cặp bằng “cặp nhánh”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hình dung. Cấu trúc lặp của tiếng Hê-bơ-rơ được giữ, đồng thời thêm “thứ nhất/thứ hai/thứ ba” để làm rõ ba cặp trong tiếng Việt; dấu gạch ngang nối phần tổng kết về sáu nhánh.
