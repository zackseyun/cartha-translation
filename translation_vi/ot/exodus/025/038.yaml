  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Vàng ròng” phù hợp văn phong Kinh Thánh mà vẫn thông dụng; các chú thích giữ lại độ bất định từ vựng của hai loại dụng cụ.
