  text: Its tongs and its firepans shall be of pure gold[a][b].
translation:
  language: vi
  text: Các kìm gắp tim đèn và các khay đựng than của chân đèn phải bằng vàng ròng.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kéo tỉa tim đèn”; từ Hê-bơ-rơ chỉ một dụng cụ dùng để gắp hoặc tỉa tim đèn, liên quan đến chân đèn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “khay” hoặc, ít có khả năng hơn trong ngữ cảnh này, “lư hương”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: kẹp gắp tim đèn
  rationale: Danh từ chỉ dụng cụ dùng để gắp hoặc sửa tim đèn trong ngữ cảnh chân đèn. Cách dịch này tự nhiên, dễ hiểu và diễn đạt chức năng có khả năng nhất mà không giới hạn vào riêng thao tác dập tim.
- source_word: מַחְתֹּתֶיהָ
  choice: khay đựng than
  rationale: Danh từ thường chỉ dụng cụ đựng hoặc mang than lửa. Trong ngữ cảnh các vật dụng của chân đèn, “khay đựng than” giữ được ý nghĩa dụng cụ liên quan đến lửa mà không xác định quá mức là lư hương.
- source_word: זָהָב טָהוֹר
  choice: bằng vàng ròng
  rationale: Cụm từ mô tả vật liệu chế tạo; “bằng vàng ròng” là cách diễn đạt tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: וּ
  choice: và
  rationale: Liên từ nối hai loại dụng cụ.
- source_word: -הָ
  choice: của chân đèn
  rationale: Hậu tố ngôi ba giống cái số ít quy chiếu về chân đèn. Tiếng Việt tự nhiên hơn khi nhắc lại danh từ thay vì dùng đại từ sở hữu có thể mơ hồ.
