- from: Kẹp gắp tim đèn và khay đựng than của chân đèn phải bằng vàng ròng.[a][b]
  to: Các kìm gắp tim đèn và các khay đựng than của chân đèn phải bằng vàng ròng.[a][b]
  rationale: Bản sửa thay cách gọi hơi lặp “kẹp gắp” bằng “kìm gắp”, làm rõ số nhiều của các vật dụng trong câu liệt kê, và chỉnh chú thích để không thêm chi tiết rằng dụng cụ được gắn vào chân đèn. Cách dịch “khay đựng than” và “vàng ròng” được giữ lại vì phù hợp với quyết định từ vựng và văn phong tiếng Việt hiện đại.
