  - severity: low
    issue: Chú thích a nói dụng cụ “gắn với chân đèn”.
    rationale: Văn bản chỉ cho biết đây là vật dụng thuộc/liên quan đến chân đèn; không khẳng định nó được gắn vật lý vào chân đèn.
  revised_text: Các kìm gắp tim đèn và các khay đựng than của chân đèn phải bằng vàng ròng.[a][b]
