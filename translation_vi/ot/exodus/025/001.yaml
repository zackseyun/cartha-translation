  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; cũng có thể được chuyển tự là “Yahweh” hoặc “Jehovah”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa trình thuật tiến sang hành động kế tiếp. “Rồi” diễn đạt tự nhiên sắc thái tuần tự; “phán” là cách dùng trang trọng, quen thuộc trong tiếng Việt khi Đức Chúa Trời nói.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu. “Giê-hô-va” là dạng tên quen thuộc và dễ nhận biết trong tiếng Việt hiện đại.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc nói năng, אֶל đánh dấu người tiếp nhận lời nói; “phán với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức nguyên ngữ giới thiệu lời trực tiếp theo sau. “Rằng” giữ chức năng dẫn lời mà tự nhiên hơn lối dịch máy móc “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp danh bốn phụ âm YHWH. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu “CHÚA”; chọn dạng “Đức Giê-hô-va” vì rõ ràng, trang trọng và quen thuộc với độc giả tiếng Việt, đồng thời ghi nhận cách phục nguyên “Yahweh/Gia-vê” là một khả năng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn nhập lời phán bằng dấu hai chấm vì nội dung trực tiếp tiếp nối ở câu sau; không thêm chú thích vì câu dịch không có ký hiệu chú thích.
