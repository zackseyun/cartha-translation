  - marker: b
    text: Nguyên văn, theo nghĩa sát chữ, là “đỏ thắm từ sâu/côn trùng”, chỉ phẩm nhuộm lấy từ một loài côn trùng.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “dê”; trong ngữ cảnh này, vật liệu lấy từ dê, tức lông dê, được nhắc đến.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכֵלֶת
  choice: chỉ màu xanh lam
  rationale: Từ này chỉ vật liệu dệt được nhuộm màu xanh lam hoặc xanh pha tím. Trong danh sách vật liệu dùng cho Đền Tạm, “chỉ màu xanh lam” vừa tự nhiên vừa thể hiện rõ đây là vật liệu dệt; sắc độ khác được giữ trong chú thích.
- source_word: אַרְגָּמָן
  choice: màu tím
  rationale: Từ này chỉ loại vật liệu dệt đắt giá được nhuộm tím, có thể thiên về đỏ tím. Sau “chỉ màu xanh lam”, tiếng Việt tự nhiên có thể lược lại “chỉ” mà vẫn hiểu là chỉ màu tím.
- source_word: תוֹלַעַת שָׁנִי
  choice: màu đỏ thắm
  rationale: Cụm từ nói đến màu hoặc vật liệu đỏ thắm được tạo bằng phẩm nhuộm lấy từ côn trùng. Dịch theo màu sắc tạo thành thay vì theo nghĩa động vật học sát chữ; chú thích bảo tồn hình ảnh nguyên ngữ.
- source_word: שֵׁשׁ
  choice: vải gai mịn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ loại vải lanh mịn. “Vải gai mịn” là cách diễn đạt tiếng Việt dễ hiểu, phân biệt với nghĩa đồng âm là số sáu.
- source_word: עִזִּים
  choice: lông dê
  rationale: Nguyên văn là “dê”, nhưng trong danh sách nguyên vật liệu, sản phẩm từ dê dùng để dệt các tấm phủ—tức lông dê—mới là điều được nói đến.
