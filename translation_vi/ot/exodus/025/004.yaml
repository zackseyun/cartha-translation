translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Từ “chỉ” được nêu một lần để chi phối ba màu nhuộm liên tiếp, tránh lặp nặng nề nhưng vẫn làm rõ đây là các vật liệu dệt. Dấu chấm phẩy phản ánh đây là một mục nằm giữa danh sách tiếp diễn của câu trước và câu sau.
