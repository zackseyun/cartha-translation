translation:
  language: vi
  text: dầu dùng để thắp đèn, hương liệu để pha dầu xức và để làm hương đốt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן
  choice: dầu
  rationale: Danh từ Hê-bơ-rơ có nghĩa rộng là “dầu”; dù trong bối cảnh này thường là dầu ô-liu, câu này không nói rõ loại dầu nên không thêm nghĩa.
- source_word: לַמָּאֹר
  choice: để thắp sáng
  rationale: Cụm từ chỉ mục đích dùng dầu cho việc chiếu sáng trong Đền Tạm; cách dịch này tự nhiên và giữ được nét nghĩa chức năng của מָאוֹר.
- source_word: בְּשָׂמִים
  choice: hương liệu
  rationale: Số nhiều chỉ các chất thơm dùng để pha chế những vật phẩm thánh; “hương liệu” rõ nghĩa và phù hợp hơn “gia vị” trong ngữ cảnh nghi lễ.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: để chế dầu xức
  rationale: 'Cấu trúc chỉ mục đích: hương liệu được dùng để pha chế loại dầu dành cho việc xức; “dầu xức” giữ thuật ngữ nghi lễ mà không diễn giải thêm.'
- source_word: קְטֹרֶת
  choice: hương thơm
  rationale: Trong bối cảnh Đền Tạm, từ này chỉ chất được đốt làm hương; tiếng Việt tự nhiên gọi là “hương thơm”, tránh nghĩa rộng là việc hun khói.
- source_word: הַסַּמִּים
  choice: hương liệu
  rationale: Cụm cấu tạo קְטֹרֶת הַסַּמִּים theo sát nghĩa là hương được pha từ các hương liệu; lặp lại “hương liệu” phản ánh cấu trúc và từ vựng của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp liệt kê ngắn gọn của nguyên văn; không thêm “ô-liu” vì tiếng Hê-bơ-rơ không nêu rõ. Dùng “để chế” hai lần để làm sáng tỏ quan hệ mục đích vốn được biểu thị bằng giới từ לְ.
