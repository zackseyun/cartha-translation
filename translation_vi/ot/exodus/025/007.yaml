  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “ô-ních” có thể chỉ một loại đá quý khác; không thể xác định chắc chắn.
    reason: lexical_alternative
  - marker: b
