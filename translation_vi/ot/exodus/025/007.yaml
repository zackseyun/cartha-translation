lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: đá mã não
  rationale: שֹׁהַם chỉ một loại đá quý chưa thể xác định chắc chắn. “Đá mã não” là cách gọi truyền thống, quen thuộc trong tiếng Việt; chú thích giữ lại sự bất định của từ Hê-bơ-rơ.
- source_word: אַבְנֵי מִלֻּאִים
  choice: đá để khảm
  rationale: מִלֻּאִים liên quan đến việc lấp đầy hoặc gắn vào ổ; trong ngữ cảnh vật liệu của trang phục tư tế, cụm này chỉ những viên đá dùng để khảm hay gắn.
- source_word: לָאֵפֹד
  choice: cho ê-phót
  rationale: אֵפוֹד là thuật ngữ kỹ thuật chỉ trang phục tư tế; phiên âm giúp tránh áp đặt một mô tả không chắc chắn.
- source_word: וְלַחֹשֶׁן
  choice: và túi đeo ngực
  rationale: חֹשֶׁן là vật đeo trước ngực của thượng tế, có gắn các viên đá và chứa U-rim cùng Thu-mim. “Túi đeo ngực” tự nhiên và tránh gợi ý áo giáp như cách dịch “bảng che ngực” hoặc “giáp ngực”.
