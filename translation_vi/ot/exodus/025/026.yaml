  - severity: low
    issue: Cụm chỉ vị trí và vị trí các ký hiệu chú thích chưa rõ.
    rationale: Cụm “vào bốn góc, tại bốn chân bàn” dễ được đọc như hai địa điểm tách biệt; nguyên ngữ xác định bốn góc là những góc liên hệ với bốn chân. Các dấu [a], [b] nên theo ngay sau “bốn góc” và “chân bàn”.
  revised_text: Ngươi phải làm cho bàn bốn khoen vàng và đặt các khoen ấy ở bốn góc[a], nơi bốn chân bàn[b].
