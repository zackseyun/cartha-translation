base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: vi
  text: Ngươi phải làm cho bàn bốn khoen vàng và đặt các khoen ấy ở bốn góc[a], nơi bốn chân bàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bốn góc” cũng có thể dịch là “bốn phía” hoặc “bốn cạnh.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ có thể chỉ “bàn chân” hoặc “chân”; ở đây nói về bốn chân của chiếc bàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ לּוֹ
  choice: Ngươi phải làm cho bàn
  rationale: Dạng động từ trong chuỗi chỉ thị mang lực mệnh lệnh. Đại từ giống đực số ít quy chiếu về chiếc bàn ở văn cảnh trước; nêu rõ “bàn” giúp tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: bốn khoen vàng
  rationale: טַבַּעַת ở đây là khoen kim loại để luồn đòn khiêng; “khoen vàng” ngắn gọn, tự nhiên và giữ nguyên chất liệu.
- source_word: וְנָתַתָּ אֶת הַטַּבָּעֹת
  choice: và gắn các khoen ấy
  rationale: נתן có nghĩa rộng là đặt/để; trong chỉ dẫn chế tác đồ vật, “gắn” diễn đạt tự nhiên việc cố định các khoen vào bàn mà không làm thay đổi vị trí được nêu tiếp theo.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: vào bốn góc
  rationale: פֵּאָה có thể chỉ góc, cạnh hoặc phía. “Bốn góc” phù hợp nhất với hình dạng chiếc bàn và vị trí của các khoen, nhưng tính đa nghĩa được ghi nhận trong chú thích.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: tại bốn chân bàn
  rationale: רֶגֶל có thể là bàn chân hoặc chân; với đồ nội thất, “chân bàn” là cách gọi tự nhiên. Cụm quan hệ xác định các góc gắn với bốn chân bàn.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang nghiêm, rõ ràng và hiện đại. Dùng “ngươi” để giữ cách xưng hô số ít trực tiếp với Môi-se trong diễn ngôn luật pháp; lặp “bàn” nhằm làm rõ sở chỉ trong tiếng Việt. Các dấu chú thích [a], [b] được đặt ngay sau cụm mà chúng giải thích.
