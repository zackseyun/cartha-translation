- from: Ngươi phải làm cho bàn bốn khoen vàng và gắn các khoen ấy vào bốn góc, tại bốn chân bàn.[a][b]
  to: Ngươi phải làm cho bàn bốn khoen vàng và đặt các khoen ấy ở bốn góc[a], nơi bốn chân bàn[b].
  rationale: Đổi “gắn” thành “đặt” để giữ độ khái quát của נָתַתָּ; nối rõ mối quan hệ giữa bốn góc và bốn chân bàn; chuyển các neo chú thích đến ngay sau từ ngữ mà chúng giải thích. Không thay đổi nghĩa hay áp đặt cách hiểu thần học.
