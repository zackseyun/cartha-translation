  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính: dát/phủ vàng ròng, cả mặt trong và mặt ngoài, cùng một phần trang trí bằng vàng bao quanh hòm. Tuy nhiên, “đường viền” có thể gợi một nét kẻ phẳng hơn là זֵר, vốn chỉ một gờ/viền trang trí nổi hoặc phần nẹp bao quanh.'
