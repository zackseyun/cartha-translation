    rationale: Đây là cách diễn đạt quá cụ thể đối với nghĩa truyền thống “crown”; chú thích nên ghi “mão vàng” và giải thích đó là cách dịch truyền thống, trong khi nghĩa ngữ cảnh là phần viền/gờ trang trí.
