    rationale: Trong ngữ cảnh các đồ dùng Đền Tạm, זֵר là một phần gờ, nẹp, hoặc viền trang trí bao quanh, không chỉ là một đường đánh dấu trên bề mặt. “Gờ viền” bảo toàn tính vật thể mà không áp đặt hình dạng quá cụ thể.
  - severity: low
