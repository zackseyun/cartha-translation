  terminology: “Vàng ròng” và “dát vàng” phù hợp. Đổi thuật ngữ chính sang “gờ viền” để biểu đạt phần nẹp/gờ trang trí; chú thích giữ các lựa chọn hợp lệ mà không xác quyết hình dạng hoặc ý nghĩa vương quyền.
