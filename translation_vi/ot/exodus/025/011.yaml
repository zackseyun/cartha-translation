base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: vi
  text: Ngươi phải dát vàng ròng lên hòm; cả bên trong lẫn bên ngoài, ngươi đều phải dát vàng lên hòm. Ngươi cũng phải làm một gờ viền bằng vàng quanh hòm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một đường viền bằng vàng” hoặc “một vành bằng vàng”; theo cách dịch truyền thống là “một mão vàng.” Từ Hê-bơ-rơ זֵר chỉ phần gờ hoặc viền trang trí bao quanh vật thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: dát vàng lên
  rationale: Trong bối cảnh chế tác đồ dùng Đền Tạm, động từ צפה chỉ việc phủ bề mặt bằng một lớp kim loại; “dát vàng” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cụm từ chỉ vàng tinh luyện, không pha tạp; “vàng ròng” trang trọng, dễ hiểu và phù hợp với vật liệu dùng cho nơi thánh.
- source_word: מִבַּיִת וּמִחוּץ
  choice: cả bên trong lẫn bên ngoài
  rationale: Cách diễn đạt này giữ rõ sự đối xứng của nguyên văn và xác định cả hai bề mặt của hòm.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: Ngươi cũng phải làm ... chạy quanh hòm
  rationale: Diễn đạt tự nhiên ý vật trang trí được làm trên và bao quanh hòm, đồng thời tránh đại từ mơ hồ trong tiếng Việt.
- source_word: זֵר
  choice: đường viền
  rationale: Trong ngữ cảnh đồ dùng Đền Tạm, זֵר là phần gờ hay viền trang trí bao quanh vật thể. “Đường viền” dễ hình dung hơn cách dịch truyền thống “mão triều thiên” và không áp đặt hình dạng quá cụ thể.
- source_word: סָבִיב
  choice: chạy quanh hòm
  rationale: Thể hiện đường viền bao quanh vật thể về mọi phía bằng lối nói tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Dùng “ngươi” để giữ lời chỉ thị trực tiếp ở số ít dành cho Môi-se; dùng “hòm” theo vật thể đã được nêu trong ngữ cảnh. Dấu chú thích [a] được đặt ngay sau mệnh đề về đường viền mà chú thích giải thích.
