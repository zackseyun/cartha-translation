base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: vi
  text: Vậy bây giờ, hãy lập tức cho đưa gia súc của ngươi và mọi thứ thuộc về ngươi ngoài đồng vào nơi an toàn.[a] Mọi người và mọi súc vật còn ở ngoài đồng mà không được đưa vào nhà thì mưa đá sẽ giáng xuống trên chúng, và chúng sẽ chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm mệnh lệnh Hê-bơ-rơ này cũng có thể được hiểu là “hãy sai người đi”; cụm từ hàm ý phải hành động khẩn cấp để đưa tài sản đến nơi an toàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả sắc thái nối kết của וְ và ý chuyển tiếp tức thời của עַתָּה trong tiếng Việt tự nhiên.
- source_word: שְׁלַח הָעֵז
  choice: hãy sai người đi, mau chóng đưa ... vào nơi an toàn
  rationale: שְׁלַח là mệnh lệnh sai phái; הָעֵז mang ý thúc giục hoặc đưa vào chỗ chắc chắn. Cách dịch này giữ cả hành động sai người, tính khẩn cấp và mục đích bảo toàn.
- source_word: מִקְנְךָ
  choice: gia súc
  rationale: Chỉ các vật nuôi thuộc sở hữu; “gia súc” là từ hiện đại, rõ nghĩa trong ngữ cảnh.
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: và mọi thứ ngươi có ngoài đồng
  rationale: Bao quát tất cả tài sản đang ở bên ngoài; “ngoài đồng” tự nhiên và phù hợp với sự đối lập với việc đưa vào nhà.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: mọi người và mọi súc vật
  rationale: אָדָם ở đây mang nghĩa tập hợp, chỉ loài người nói chung, còn בְּהֵמָה chỉ thú vật, đặc biệt là vật nuôi. Cấu trúc lặp “mọi” làm rõ phạm vi phân phối trong tiếng Việt.
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: còn ở ngoài đồng
  rationale: Diễn đạt tự nhiên trạng thái bị phát hiện hoặc vẫn còn ở ngoài đồng mà không làm thay đổi điều kiện của lời cảnh báo.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: mà không được đưa vào nhà
  rationale: Giữ thể bị động của Niphal יֵאָסֵף và hướng chuyển động vào nhà được biểu thị bởi הַבַּיְתָה.
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: mưa đá sẽ giáng xuống trên chúng
  rationale: Giữ chủ ngữ “mưa đá,” chuyển động từ trên xuống của יָרַד và giới từ “trên” của עֲלֵהֶם.
- source_word: וָמֵתוּ
  choice: và chúng sẽ chết
  rationale: Thể hiện hậu quả chắc chắn trong lời cảnh báo bằng thì tương lai tự nhiên của tiếng Việt.
theological_decisions:
- issue: Phạm vi của אָדָם trong lời cảnh báo
  choice: mọi người
  alternative: mọi người đàn ông
  rationale: Danh từ số ít tập hợp אָדָם ở đây đối xứng với súc vật và chỉ con người nói chung, không giới hạn ở nam giới. “Mọi người” giữ đúng phạm vi mà không thêm một phân biệt giới tính không có trong ngữ cảnh.
- issue: Đại từ số nhiều עֲלֵהֶם và chủ thể sẽ chết
  choice: trên chúng ... chúng sẽ chết
  alternative: trên họ ... họ sẽ chết
  rationale: Tiền ngữ gồm cả người lẫn súc vật, nên “chúng” là đại từ bao quát tự nhiên trong tiếng Việt và tránh thu hẹp chỉ còn con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để duy trì lời phán trực tiếp số ít với Pha-ra-ôn; dùng “gia súc/súc vật” thay cho từ cổ. Dấu [a] được đặt ngay sau mệnh lệnh mà chú thích giải thích.
