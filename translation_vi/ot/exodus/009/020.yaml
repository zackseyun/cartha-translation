  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: vi
  text: Ai trong số các đầy tớ của Pha-ra-ôn kính sợ lời của Yahweh[a] thì vội đưa các tôi tớ và gia súc mình vào các nhà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người nào trong số các đầy tớ của Pha-ra-ôn kính sợ lời của Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “làm cho chạy trốn”; nghĩa là nhanh chóng đưa họ và gia súc vào nơi trú.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: Ai ... kính sợ
  rationale: 'Mạo từ đi với phân từ tạo thành cách gọi chỉ người: “người kính sợ” hoặc “ai kính sợ.” Cách dịch “Ai ...” tự nhiên trong tiếng Việt và vẫn chỉ một bộ phận trong số các đầy tớ của Pha-ra-ôn.'
- source_word: דְּבַר יְהוָה
  choice: lời của Yahweh
  rationale: דָּבָר có thể là “lời” hoặc “sứ điệp.” “Lời của Yahweh” giữ được thành ngữ Kinh Thánh và không thu hẹp nghĩa thành riêng “lời cảnh báo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng cách phiên âm danh יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: trong số các đầy tớ của Pha-ra-ôn
  rationale: Giới từ מִן mang nghĩa phân chia ở đây, chỉ một người thuộc nhóm các đầy tớ của Pha-ra-ôn.
- source_word: הֵנִיס
  choice: vội đưa
  rationale: Dạng Hiphil của נוּס có nghĩa đen là “làm cho chạy trốn.” Trong ngữ cảnh đưa người và vật nuôi vào nơi trú trước trận mưa đá, “vội đưa” diễn đạt tự nhiên cả hành động lẫn tính khẩn cấp.
- source_word: עֲבָדָיו
  choice: các tôi tớ của mình
  rationale: עֶבֶד có thể chỉ nô lệ hoặc tôi tớ. Trong câu này, “tôi tớ” là cách gọi tự nhiên cho những người thuộc quyền quản lý của viên chức ấy, đồng thời tránh xác định quá mức địa vị xã hội mà ngữ cảnh không nhấn mạnh.
- source_word: מִקְנֵהוּ
  choice: gia súc mình
  rationale: מִקְנֶה chỉ chung các loài vật nuôi thuộc sở hữu; “gia súc” rộng và chính xác hơn “bò.”
- source_word: אֶל הַבָּתִּים
  choice: vào các nhà
  rationale: Giữ chuyển động hướng vào và dạng số nhiều của הַבָּתִּים, tức các công trình dùng làm nơi trú.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tetragrammaton; “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của việc “kính sợ lời”
  choice: Giữ nguyên cách nói “kính sợ lời của Yahweh”
  alternative: coi trọng lời cảnh báo của Yahweh
  rationale: Bản dịch giữ sự căng thẳng thần học và thành ngữ của nguyên văn, không diễn giải việc kính sợ chỉ thành phản ứng thực dụng trước một lời cảnh báo.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Pha-ra-ôn” theo cách phiên âm Kinh Thánh quen thuộc; “tôi tớ” được dùng cho người thuộc quyền của từng viên chức để phân biệt tự nhiên với “đầy tớ của Pha-ra-ôn.”
