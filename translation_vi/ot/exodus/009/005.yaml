reference: Exodus 9:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם יְהוָ֖ה מוֹעֵ֣ד לֵ/אמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה הַ/דָּבָ֥ר הַ/זֶּ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: vi
  text: 'Yahweh ấn định một thời điểm[a] và phán: “Ngày mai, Yahweh sẽ làm việc này trong xứ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một kỳ đã định” hoặc “một thời điểm đã ấn định.”'
    reason: Nêu các khả năng diễn đạt sắc thái của מוֹעֵד là thời điểm hay kỳ hạn đã được xác lập.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ấn định
  rationale: Động từ שׂוּם ở đây mang nghĩa thiết lập hay định ra; “ấn định” kết hợp tự nhiên với “một thời điểm” và diễn đạt rõ tính xác định.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: מוֹעֵד
  choice: một thời điểm
  rationale: מוֹעֵד chỉ một thời điểm đã được định. Cách dịch này rõ ràng trong tiếng Việt hiện đại và vẫn giữ được nét nghĩa ấy; câu nói tiếp theo xác định đó là “ngày mai”.
- source_word: לֵאמֹר
  choice: và phán
  rationale: Trong văn thuật chuyện Hê-bơ-rơ, cấu trúc này dẫn lời nói trực tiếp. Với chủ thể là Yahweh, “phán” tự nhiên và trang trọng hơn cách dịch máy móc “rằng” hay “nói rằng”.
- source_word: מָחָר
  choice: Ngày mai
  rationale: Trạng từ chỉ trực tiếp thời điểm hành động sẽ xảy ra.
- source_word: יַעֲשֶׂה
  choice: sẽ làm
  rationale: Giữ nét nghĩa rộng và đơn giản của עשה, không diễn giải thêm bản chất của hành động.
- source_word: הַדָּבָר הַזֶּה
  choice: việc này
  rationale: דָּבָר có thể là lời, sự việc hay điều; trong ngữ cảnh tai họa được báo trước, “việc này” tự nhiên và không xác định quá mức.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: אֶרֶץ ở đây theo ngữ cảnh là xứ Ai Cập. “Trong xứ” giữ cách nói ngắn gọn của nguyên văn mà không thêm địa danh vốn đã rõ trong đoạn văn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo tồn tư cách danh riêng, không thay nó bằng tước hiệu và không áp đặt một cách đọc hệ phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “phán” cho lời trực tiếp của Đức Chúa Trời; dùng “xứ” để phù hợp ngữ cảnh địa lý Kinh Thánh mà không thêm “Ai Cập” ngoài nguyên văn.
