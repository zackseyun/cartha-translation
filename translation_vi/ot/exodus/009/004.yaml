source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: vi
  text: Nhưng Yahweh sẽ phân biệt gia súc của Y-sơ-ra-ên với gia súc của Ai Cập; không một con nào trong số gia súc thuộc về con cái Y-sơ-ra-ên sẽ chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְלָה
  choice: sẽ phân biệt
  rationale: Dạng Hifil của פלא ở đây diễn tả việc Đức Chúa Trời tạo nên sự phân cách rõ ràng giữa hai nhóm; “phân biệt” tự nhiên và giữ được ý nghĩa tác động trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: מִקְנֵה
  choice: gia súc
  rationale: Từ này chỉ chung đàn vật nuôi, không chỉ riêng bò; “gia súc” phù hợp với bối cảnh tai họa.
- source_word: בֵּין ... וּבֵין
  choice: '... với ...'
  rationale: Cấu trúc “phân biệt A với B” là cách diễn đạt tự nhiên trong tiếng Việt cho cặp giới từ tương liên này.
- source_word: מִצְרַיִם
  choice: Ai Cập
  rationale: Giữ cách gọi quốc gia trong cụm “gia súc của Ai Cập”, tương ứng trực tiếp với cấu trúc Hê-bơ-rơ.
- source_word: וְלֹא יָמוּת מִכָּל ... דָּבָר
  choice: trong mọi vật ... không một vật nào sẽ chết
  rationale: Cách diễn đạt này giữ lực nhấn mạnh phân phối của מִכָּל kết hợp với phủ định và danh từ số ít דָּבָר, đồng thời rõ nghĩa trong tiếng Việt.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: thuộc về con cái Y-sơ-ra-ên
  rationale: Giới từ לְ trong ngữ cảnh biểu thị sự sở thuộc; “con cái Y-sơ-ra-ên” giữ hình ảnh gia tộc-dân tộc của nguyên văn mà vẫn bao gồm toàn dân.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng YHWH. Bản dịch giữ danh riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là hình thức trang trọng, quen thuộc trong tiếng Việt.
- issue: Cách chuyển dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: người Y-sơ-ra-ên; các con trai của Y-sơ-ra-ên
  rationale: Đây là thành ngữ dân tộc-gia tộc chỉ toàn thể dân Y-sơ-ra-ên. “Con cái” giữ được hình ảnh nguồn mà không khiến độc giả hiểu lầm rằng câu chỉ nói đến nam giới.
- issue: Quan hệ giữa sự phân biệt và việc gia súc Y-sơ-ra-ên không chết
  choice: giữ liên kết bằng dấu chấm phẩy, không thêm từ chỉ mục đích
  alternative: để không một vật nào...; vì thế không một vật nào...
  rationale: Liên từ וְ chỉ nối hai mệnh đề và có thể hàm ý kết quả, nhưng nguyên văn không quy định rõ quan hệ mục đích hay kết quả; bản dịch tránh giải quyết quá mức sự mơ hồ này.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Đức Giê-hô-va, Y-sơ-ra-ên và Ai Cập. Không cần chú thích vì các lựa chọn chính có thể thể hiện rõ trong chính văn.'
