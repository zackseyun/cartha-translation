  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se: “Hãy dậy sớm vào buổi sáng, đến trình diện trước mặt Pha-ra-ôn và nói với vua: ‘Yahweh, Đức Chúa Trời của người Hê-bơ-rơ, phán thế này: Hãy để dân Ta đi, để họ phụng sự Ta[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để họ thờ phượng Ta.” Động từ Hê-bơ-rơ có thể chỉ việc phụng sự Đức Chúa Trời, bao gồm cả sự thờ phượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: dậy từ sáng sớm
  rationale: Diễn đạt tự nhiên trong tiếng Việt cả ý dậy sớm của động từ lẫn thời điểm buổi sáng.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: đến đứng trước mặt
  rationale: Giữ ý chủ động đến chiếm vị trí và đứng trước Pha-ra-ôn, đồng thời phù hợp với văn cảnh yết kiến.
- source_word: כֹּה אָמַר
  choice: phán thế này
  rationale: Bảo toàn công thức trang trọng của lời sứ giả bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Đức Chúa Trời của người Hê-bơ-rơ
  rationale: Chuyển trực tiếp kết cấu sở hữu, dùng cách gọi trang trọng và dễ hiểu.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Hãy để dân Ta đi
  rationale: Thể hiện mệnh lệnh đòi Pha-ra-ôn phóng thích dân của Yahweh.
- source_word: וְיַעַבְדֻנִי
  choice: để họ phụng sự Ta
  rationale: Liên từ và thể động từ biểu thị mục đích; “phụng sự” giữ được nghĩa rộng của עבד là phục vụ Đức Chúa Trời, bao gồm cả thờ phượng.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng bốn phụ âm; “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Phạm vi nghĩa của וְיַעַבְדֻנִי
  choice: để họ phụng sự Ta
  alternative: để họ thờ phượng Ta
  rationale: “Phụng sự” giữ nghĩa giao ước rộng hơn của עבד, trong khi chú thích nêu rõ nghĩa “thờ phượng” vốn nằm trong phạm vi của từ này.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Dùng “vua” để chỉ rõ người được Môi-se nói với trong câu gián tiếp chuyển sang trực tiếp; dùng “Ta” trong lời phán của Yahweh. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
