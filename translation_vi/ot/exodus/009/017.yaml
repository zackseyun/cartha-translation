source:
  edition: WLC
  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: vi
  text: Ngươi vẫn còn tự đề cao mình chống lại dân ta, không chịu để họ ra đi sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cư xử kiêu ngạo đối với dân ta” hoặc “tự nâng mình lên chống lại dân ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדְךָ
  choice: Ngươi vẫn còn ... sao?
  rationale: עוֹד diễn tả tình trạng vẫn tiếp diễn; trong ngữ cảnh lời chất vấn trực tiếp dành cho Pha-ra-ôn, cấu trúc nghi vấn với “sao?” vừa tự nhiên trong tiếng Việt vừa giữ được sức nặng tu từ.
- source_word: מִסְתּוֹלֵל
  choice: tự đề cao mình
  rationale: Phân từ Hitpolel của סלל tại đây hàm ý tự nâng mình lên, kiêu ngạo tự khẳng định địa vị; “tự đề cao mình” giữ được sắc thái phản thân mà không giản lược thành chỉ “chống đối”.
- source_word: בְּעַמִּי
  choice: chống lại dân ta
  rationale: Giới từ ב trong kết cấu này mang sắc thái đối nghịch hoặc lấn lướt. “Chống lại dân ta” diễn đạt rõ thái độ thù nghịch, đồng thời vẫn giữ nguyên lời Đức Chúa Trời nhận Israel là dân của Ngài.
- source_word: לְבִלְתִּי
  choice: không chịu
  rationale: 'Cụm לְבִלְתִּי cùng động từ nguyên mẫu cho biết cách Pha-ra-ôn tiếp tục tự tôn mình: ông cố ý không thả dân. “Không chịu” chuyển tải tự nhiên sắc thái ngoan cố trong ngữ cảnh, dù hình thức sát hơn là “bằng việc không”.'
- source_word: שַׁלְּחָם
  choice: để họ ra đi
  rationale: Dạng Piel của שלח trong trình thuật các tai họa chỉ việc thả Israel khỏi sự kìm giữ. “Để họ ra đi” là cách nói tự nhiên và phù hợp với mô-típ lặp lại trong Xuất Ê-díp-tô Ký.
theological_decisions:
- issue: Lời xác nhận quyền sở hữu trong “dân ta”
  choice: Giữ nguyên “dân ta” như lời Đức Chúa Trời trực tiếp nhận Israel thuộc về Ngài
  alternative: “dân chúng” hoặc “Israel”
  rationale: 'Hậu tố ngôi thứ nhất trong עַמִּי có ý nghĩa quan trọng trong ngữ cảnh giao ước: sự chống đối của Pha-ra-ôn nhắm vào chính dân mà Đức Chúa Trời nhận là của Ngài. Không nên khái quát hóa hoặc thay bằng tên riêng.'
- issue: Sắc thái của hành động Pha-ra-ôn đối với dân Đức Chúa Trời
  choice: Giữ đồng thời ý tự tôn và đối nghịch qua “tự đề cao mình chống lại”
  alternative: Chỉ dịch là “chống đối” hoặc chỉ là “cai trị trên”
  rationale: מִסְתּוֹלֵל và בְּעַמִּי kết hợp cả sự tự nâng mình lên lẫn tư thế thù nghịch/lấn lướt; bản dịch không nên loại bỏ một trong hai nét nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Đại từ “ngươi” phù hợp với lời Đức Chúa Trời chất vấn Pha-ra-ôn; “dân ta” giữ sắc thái Kinh Thánh quen thuộc mà vẫn dễ hiểu. Dấu hỏi thể hiện cách hiểu tu từ theo ngữ cảnh, trong khi nguyên ngữ có thể được đọc về mặt hình thức như một lời tuyên bố tiếp diễn.
