  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: vi
  text: Nhưng khi Pha-ra-ôn thấy mưa, mưa đá và sấm[a] đã ngừng, ông lại tiếp tục phạm tội và làm cho lòng mình chai cứng; ông và các bề tôi của ông đều như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen là “các tiếng”; trong bối cảnh cơn bão này, từ ấy chỉ tiếng sấm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Động từ ראה trong văn thuật chuyện thường có nghĩa là “thấy”; ở đây từ này cũng tự nhiên bao hàm việc nhận biết tình hình.
- source_word: כִּי
  choice: (nội dung của điều Pha-ra-ôn thấy) … đã ngừng
  rationale: כִּי dẫn vào nội dung được nhận thấy. Tiếng Việt không cần dịch riêng là “rằng” sau cấu trúc “khi… thấy”.
- source_word: חָדַל
  choice: đã ngừng
  rationale: חדל nghĩa là ngừng hoặc chấm dứt; “đã ngừng” phù hợp với hành động hoàn tất trước phản ứng tiếp theo của Pha-ra-ôn.
- source_word: הַמָּטָר
  choice: mưa
  rationale: Cách dịch trực tiếp và tự nhiên của מטר trong tiếng Việt.
- source_word: הַבָּרָד
  choice: mưa đá
  rationale: “Mưa đá” là thuật ngữ tiếng Việt thông dụng cho ברד trong bối cảnh tai họa.
- source_word: הַקֹּלֹת
  choice: sấm
  rationale: Danh từ số nhiều קֹלוֹת theo nghĩa đen là “các tiếng/âm thanh”, nhưng trong bối cảnh cơn bão ở đây chỉ tiếng sấm.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: lại phạm tội
  rationale: Cấu trúc יסף + động từ nguyên mẫu diễn tả làm thêm hoặc làm lại. “Lại phạm tội” giữ rõ tính tái diễn trong mạch truyện.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: làm cho lòng mình chai cứng
  rationale: כבד theo nghĩa gốc liên quan đến sự nặng nề, nhưng trong thành ngữ này diễn tả việc khiến lòng trở nên cứng cỏi, không đáp ứng. “Chai cứng” tự nhiên và giữ liên kết chủ đề về lòng Pha-ra-ôn.
- source_word: הוּא וַעֲבָדָיו
  choice: cả ông lẫn các bề tôi của ông
  rationale: עבדים có thể là đầy tớ, nô lệ hoặc quan chức. Trong bối cảnh triều đình, “bề tôi” diễn đạt phù hợp những người thuộc quyền Pha-ra-ôn; “cả… lẫn…” giữ sự nhấn mạnh của הוּא.
- source_word: וַ
  choice: Nhưng
  rationale: Liên từ mở đầu tiếp nối câu chuyện đồng thời tạo nét tương phản với sự hạ mình trước đó của Pha-ra-ôn.
theological_decisions:
- issue: Tác nhân và phạm vi của việc làm lòng chai cứng
  choice: Câu dịch quy hành động làm lòng mình chai cứng cho chính Pha-ra-ôn, rồi giữ cụm kết “cả ông lẫn các bề tôi của ông”.
  alternative: Có thể hiểu cụm kết là mở rộng hành động làm lòng chai cứng cho cả Pha-ra-ôn và các bề tôi, hoặc chỉ là cụm đồng vị nhấn mạnh sự liên đới của triều đình.
  rationale: Bản Hê-bơ-rơ nói trực tiếp Pha-ra-ôn “làm nặng lòng mình”, rồi thêm “ông và các bề tôi ông”. Dấu gạch ngang bảo tồn sự gắn kết và độ mơ hồ về phạm vi của cụm cuối, không áp đặt một kết luận giáo lý rộng hơn về tác nhân thần linh hay con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ra-ôn” theo cách viết quen thuộc trong Kinh Thánh tiếng Việt; “bề tôi” phù hợp bối cảnh hoàng gia mà không xác định quá hẹp họ là quan chức hay nô lệ.
