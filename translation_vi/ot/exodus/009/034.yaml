    rationale: Đặt cụm này sau “làm cho lòng mình chai cứng” có thể khiến người đọc hiểu các bề tôi cùng làm chai cứng “lòng” số ít của Pha-ra-ôn. Cấu trúc tách câu bằng chấm phẩy diễn đạt rõ ràng hơn mà vẫn không quyết định quá mức một vấn đề cú pháp được tranh luận.
