reference: Exodus 9:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אַתָּ֖ה וַ/עֲבָדֶ֑י/ךָ יָדַ֕עְתִּי כִּ֚י טֶ֣רֶם תִּֽירְא֔וּ/ן מִ/פְּנֵ֖י יְהוָ֥ה אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: vi
  text: Nhưng về phần ngươi và các tôi tớ của ngươi, ta biết rằng các ngươi vẫn chưa kính sợ[a] Yahweh, Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chưa kính sợ” hoặc “trước khi các ngươi kính sợ”. Từ Hê-bơ-rơ có thể diễn tả điều xảy ra “trước khi” hoặc, trong ngữ cảnh này, điều “vẫn chưa” xảy ra.'
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” thể hiện danh riêng YHWH trong tiếng Hê-bơ-rơ.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: Nhưng về phần ngươi
  rationale: Liên từ đi với đại từ độc lập tạo thế tương phản và nêu chủ đề; cách dịch này tự nhiên trong tiếng Việt và nối với lời nói trước đó.
- source_word: וַעֲבָדֶיךָ
  choice: và các tôi tớ của ngươi
  rationale: עֶבֶד có thể chỉ tôi tớ, đầy tớ hoặc nô lệ; trong bối cảnh triều đình Pha-ra-ôn, “các tôi tớ” giữ được nghĩa rộng mà không áp đặt địa vị pháp lý cụ thể.
- source_word: יָדַעְתִּי
  choice: ta biết
  rationale: Dạng hoàn thành ở đây diễn tả nhận định hiện có và chắc chắn của Môi-se.
- source_word: כִּי
  choice: rằng
  rationale: Dẫn vào nội dung điều Môi-se biết.
- source_word: טֶרֶם
  choice: vẫn chưa
  rationale: Khi đi với động từ chưa hoàn thành, từ này trong ngữ cảnh có thể chỉ điều chưa xảy ra cho đến lúc ấy; “vẫn chưa” truyền đạt cả sắc thái thời gian lẫn sự ngoan cố kéo dài.
- source_word: תִּירְאוּן
  choice: các ngươi ... kính sợ
  rationale: ירא có thể bao hàm sợ hãi, kính sợ và thái độ tôn kính. “Kính sợ” phù hợp khi đối tượng là Đức Chúa Trời nhưng vẫn giữ sức nặng của nỗi sợ trước sự phán xét.
- source_word: מִפְּנֵי
  choice: kính sợ
  rationale: Cụm nghĩa đen là “trước mặt/từ trước mặt”; trong kết cấu với ירא, tiếng Việt tự nhiên không cần dịch riêng giới từ, và quan hệ với đối tượng được thể hiện trực tiếp.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc và trang trọng trong tiếng Việt để thể hiện trực tiếp danh YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ đứng cùng danh YHWH, tạo danh xưng đầy đủ “Giê-hô-va Đức Chúa Trời”.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ đây là danh riêng của Đức Chúa Trời chứ không thay bằng tước hiệu; “Giê-hô-va” là hình thức đã quen thuộc trong tiếng Việt. Chú thích nêu rõ tương ứng với YHWH.
- issue: Sắc thái của ירא đối với Đức Chúa Trời
  choice: kính sợ
  alternative: sợ; tôn kính
  rationale: “Kính sợ” không thu hẹp từ này thành chỉ kinh hãi hay chỉ tôn kính, nhờ đó giữ được sức căng giữa nỗi sợ trước sự phán xét và thái độ đúng đắn đối với Đức Chúa Trời.
- issue: Sắc thái thời gian của טֶרֶם
  choice: vẫn chưa
  alternative: chưa; trước khi
  rationale: Trong mạch văn, Môi-se đánh giá Pha-ra-ôn và các tôi tớ chưa kính sợ Đức Chúa Trời. Tuy vậy, từ Hê-bơ-rơ cũng có thể mang nghĩa “trước khi”, nên giữ cách hiểu khác trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta—ngươi/các ngươi” phù hợp lời Môi-se trực tiếp nói với Pha-ra-ôn cùng quần thần; “tôi tớ” giữ sắc thái triều đình mà không đồng nhất tất cả với nô lệ.
