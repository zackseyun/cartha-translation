  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: vi
  text: Môi-se giơ cây gậy của mình hướng lên trời; Yahweh khiến sấm vang lên và mưa đá rơi xuống, lửa đi xuống đất.[a] Yahweh trút mưa đá xuống xứ Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “lửa đi về phía đất”; trong ngữ cảnh, “lửa” rất có thể chỉ tia chớp.
    reason: Giữ cách nói giàu hình ảnh của nguyên văn đồng thời giúp người đọc nhận ra hiện tượng được mô tả.
lexical_decisions:
- source_word: וַיֵּט
  choice: giơ ... lên
  rationale: Động từ נָטָה diễn tả việc đưa hoặc vươn gậy ra; trong ngữ cảnh hướng lên trời, “giơ ... lên” tự nhiên và rõ ràng trong tiếng Việt.
- source_word: מַטֵּהוּ
  choice: cây gậy của mình
  rationale: מַטֶּה là gậy; cách diễn đạt này xác định đó là cây gậy của Môi-se mà không mang sắc thái cổ.
- source_word: עַל הַשָּׁמַיִם
  choice: hướng về trời
  rationale: Giữ ý hướng lên của cụm Hê-bơ-rơ và diễn đạt tự nhiên trong tiếng Việt; “trời” ở đây chỉ bầu trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: giáng sấm và mưa đá
  rationale: Trong văn cảnh bão tố, קֹלֹת chỉ tiếng sấm; “giáng” truyền đạt tự nhiên hành động Yahweh khiến sấm và mưa đá xảy đến.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: lửa lao xuống đất
  rationale: Giữ nguyên hình ảnh “lửa” và chuyển tải chuyển động mạnh hướng xuống của câu Hê-bơ-rơ, thay vì giải nghĩa trực tiếp thành chớp.
- source_word: וַיַּמְטֵר ... בָּרָד
  choice: làm mưa đá trút xuống
  rationale: Thể sai khiến của מָטַר cho biết Yahweh khiến mưa đá đổ xuống; cách dịch này tự nhiên và tái hiện sức mạnh của trận mưa đá.
- source_word: אֶרֶץ מִצְרָיִם
  choice: xứ Ai Cập
  rationale: Giữ thành tố “xứ/đất” của nguyên văn và nêu rõ phạm vi địa lý của tai họa.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của אֵשׁ trong cơn bão
  choice: lửa
  alternative: tia chớp
  rationale: Trong ngữ cảnh, từ này rất có thể chỉ chớp, nhưng nghĩa từ vựng là “lửa”; bản văn chính giữ hình ảnh nguyên gốc và chú thích nêu cách hiểu theo hiện tượng thời tiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se”, “Yahweh” và “xứ Ai Cập”; giữ hình ảnh “lửa” của tiếng Hê-bơ-rơ, với chú thích giải thích khả năng chỉ tia chớp.
