revisions:
- from: Môi-se giơ cây gậy của mình lên hướng về trời, thì Yahweh giáng sấm và mưa đá, lửa lao xuống đất.[a] Yahweh làm mưa đá trút xuống xứ Ai Cập.
  to: Môi-se giơ cây gậy của mình hướng lên trời; Yahweh khiến sấm vang lên và mưa đá rơi xuống, lửa đi xuống đất.[a] Yahweh trút mưa đá xuống xứ Ai Cập.
  rationale: Bản sửa loại bỏ chỗ diễn đạt dư, thay động từ “lao” bằng “đi” để không thêm cường độ vào nguyên văn, và diễn đạt sấm theo tiếng Việt hiện đại. Văn bản vẫn giữ sự lặp lại có chủ ý về mưa đá, danh Yahweh, và hình ảnh “lửa”; chú thích vẫn được neo ngay sau mệnh đề liên quan.
