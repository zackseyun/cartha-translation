  text: וְ/הַ/חִטָּ֥ה וְ/הַ/כֻּסֶּ֖מֶת לֹ֣א נֻכּ֑וּ כִּ֥י אֲפִילֹ֖ת הֵֽנָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: vi
  text: Nhưng lúa mì và lúa spelt[a] không bị mưa đá đánh, vì chúng chín muộn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “lúa spelt” có thể chỉ một loại ngũ cốc họ hàng gần, như lúa emmer.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: Nhưng lúa mì
  rationale: חִטָּה là lúa mì. Liên từ וְ về hình thức là “và”, nhưng ở đây nối với câu trước theo quan hệ tương phản, nên dịch “Nhưng” cho tự nhiên và rõ ý.
- source_word: וְהַכֻּסֶּמֶת
  choice: và lúa spelt[a]
  rationale: כֻּסֶּמֶת chỉ một loại ngũ cốc cổ, thường được nhận diện là spelt hoặc emmer. Giữ tên “spelt” và thêm chú thích để không tạo cảm giác chắc chắn hơn chứng cứ thực vật học.
- source_word: לֹא נֻכּוּ
  choice: không bị mưa đá đánh đổ
  rationale: Dạng bị động của נכה diễn tả cây trồng không bị trận mưa đá giáng trúng và hủy hoại. Bổ sung “mưa đá” từ ngữ cảnh trực tiếp giúp câu tiếng Việt rõ nghĩa; “đánh đổ” giữ được sắc thái mạnh hơn “làm hư hại”.
- source_word: כִּי
  choice: vì
  rationale: כִּי giới thiệu nguyên nhân khiến hai loại cây trồng không bị đánh đổ; “vì” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲפִילֹת הֵנָּה
  choice: chúng chín muộn
  rationale: Cụm vị ngữ giống cái số nhiều nhiều khả năng nói cây đang ở giai đoạn phát triển muộn hoặc chưa trổ bông, nhờ đó thoát khỏi thiệt hại do mưa đá. “Chín muộn” diễn đạt gọn nghĩa nông nghiệp, dù từ hiếm אֲפִילֹת còn có độ bất định.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “mưa đá” để làm rõ tác nhân từ ngữ cảnh câu trước; giữ tên ngũ cốc “spelt” kèm chú thích vì tiếng Việt không có tên thông dụng hoàn toàn tương ứng.
