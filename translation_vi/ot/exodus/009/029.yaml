  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: vi
  text: 'Môi-se nói với vua: “Khi tôi ra khỏi thành, tôi sẽ dang hai tay hướng về Yahweh; sấm sẽ ngừng và mưa đá sẽ không còn nữa, để vua biết rằng đất[a] thuộc về Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trái đất.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי
  choice: Khi tôi ra khỏi
  rationale: כְּ với động từ nguyên mẫu cấu trúc và hậu tố ngôi thứ nhất số ít chỉ thời điểm Môi-se ra khỏi thành; “khi tôi ra khỏi” tự nhiên và không ép sắc thái thành “ngay khi” hơn mức cần thiết.
- source_word: אֶפְרֹשׂ אֶת כַּפַּי
  choice: tôi sẽ giơ hai tay
  rationale: Cụm từ mô tả việc dang hoặc đưa hai bàn tay ra trong tư thế cầu nguyện. “Giơ hai tay” diễn đạt tự nhiên cử chỉ này trong tiếng Việt hiện đại.
- source_word: יְהוָה / לַיהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một danh xưng.
- source_word: הַקֹּלוֹת
  choice: sấm
  rationale: Danh từ số nhiều có nghĩa đen là “các tiếng/tiếng động”, nhưng trong bối cảnh trận mưa đá chỉ tiếng sấm.
- source_word: יֶחְדָּלוּן
  choice: sẽ ngừng
  rationale: חדל diễn tả việc ngưng hoặc chấm dứt; “sẽ ngừng” rõ ràng và tự nhiên.
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: và mưa đá sẽ không còn nữa
  rationale: Giữ sắc thái mưa đá không tiếp diễn hoặc không còn xảy ra, bằng cách diễn đạt thông dụng trong tiếng Việt.
- source_word: לְמַעַן תֵּדַע
  choice: để vua biết
  rationale: למען nêu mục đích. Đại từ số ít hướng đến Pha-ra-ôn được diễn đạt theo ngữ cảnh bằng “vua”, vừa rõ đối tượng vừa phù hợp phép xưng hô tiếng Việt.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: rằng đất thuộc về Yahweh
  rationale: Tiền tố לְ diễn tả quyền sở hữu. הָאָרֶץ có thể chỉ đất, xứ, hoặc toàn thể địa cầu; “đất” giữ được độ rộng nghĩa này thay vì quyết định dứt khoát phạm vi.
theological_decisions:
- issue: Cách chuyển dịch danh YHWH
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה; phiên âm “Yahweh” bảo tồn chức năng tên riêng mà không thay bằng danh hiệu.
- issue: Phạm vi nghĩa của הָאָרֶץ
  choice: đất
  alternative: trái đất / xứ sở
  rationale: Trong tiếng Hê-bơ-rơ, từ này có thể mang nghĩa toàn thể đất hoặc một vùng đất. Bản chính dùng “đất” và chú thích nêu khả năng “cả trái đất”, tránh âm thầm giải quyết sự mơ hồ theo hướng phổ quát hay địa phương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” để chỉ Pha-ra-ôn trong lời nói trực tiếp, tránh đại từ tiếng Việt dễ mang sắc thái bất kính hoặc quá thân mật. Giữ tên Yahweh và sự mơ hồ thực sự của הָאָרֶץ.
