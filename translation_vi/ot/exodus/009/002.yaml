lexical_decisions:
- source_word: כִּי אִם
  choice: Vì nếu
  rationale: Giữ cả sắc thái giải thích của כִּי, nối với lời phán trước đó, lẫn điều kiện của אִם; cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מָאֵן
  choice: không chịu
  rationale: Diễn tả sự cố ý khước từ, chứ không phải không có khả năng; trong lời cảnh cáo trực tiếp, “không chịu” tự nhiên hơn “từ chối” khi đi với mệnh đề nguyên thể phía sau.
- source_word: לְשַׁלֵּחַ
  choice: để họ đi
  rationale: Trong bối cảnh Xuất Hành, động từ שׁלח nói đến việc Pha-ra-ôn cho phép dân Y-sơ-ra-ên rời đi; “để họ đi” chính xác và tự nhiên.
- source_word: וְעוֹדְךָ
  choice: mà vẫn cứ
  rationale: Truyền đạt sự tiếp diễn và dai dẳng của hành động; “mà” cũng làm rõ thế tương phản với yêu cầu để dân đi.
- source_word: מַחֲזִיק בָּם
  choice: giữ họ lại
  rationale: Phân từ diễn tả hành động tiếp tục cầm giữ hoặc ngăn không cho dân ra đi. “Giữ họ lại” phù hợp ngữ cảnh và vẫn để chú thích ghi nhận cách hiểu sát hình ảnh hơn.
