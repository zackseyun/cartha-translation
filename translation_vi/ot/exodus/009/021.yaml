  - severity: low
    issue: Cụm giải thích “không ghi lòng và coi trọng” trong chú thích chưa thật tự nhiên và làm hai động từ liên kết không rõ.
    rationale: Thành ngữ שָׂם לֵב có thể được giải thích rõ, tự nhiên là “không lưu tâm đến hoặc không coi trọng.”
