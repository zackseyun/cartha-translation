source:
  edition: WLC
  text: וַ/אֲשֶׁ֥ר לֹא שָׂ֛ם לִבּ֖/וֹ אֶל דְּבַ֣ר יְהוָ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: vi
  text: Nhưng ai không để tâm đến lời của Yahweh thì để các đầy tớ và gia súc của mình ngoài đồng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không đặt lòng mình vào lời của Yahweh,” nghĩa là không lưu tâm đến hoặc không coi trọng lời ấy.'
    reason: Giữ lại hình ảnh của thành ngữ Hê-bơ-rơ và nêu nghĩa thực dụng của nó.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Nhưng ai
  rationale: Waw cùng đại từ quan hệ tạo sự tương phản với nhóm đã kính sợ lời Yahweh ở câu trước; “Nhưng ai” diễn đạt tự nhiên ý quan hệ bất định.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: không để tâm đến
  rationale: Thành ngữ theo nghĩa đen là “không đặt lòng mình hướng đến”; “không để tâm đến” vừa tự nhiên trong tiếng Việt hiện đại vừa giữ được sắc thái không coi trọng lời cảnh báo.
- source_word: דְּבַר יְהוָה
  choice: lời của Yahweh
  rationale: דָּבָר ở đây chỉ lời cảnh báo đã được phán; “lời” bảo tồn cách diễn đạt Kinh Thánh mà không thu hẹp thành một nội dung diễn giải.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וַיַּעֲזֹב
  choice: thì vẫn để
  rationale: Động từ có nghĩa là để lại hoặc bỏ mặc. Trong mạch văn, “vẫn để” làm rõ rằng người ấy không đưa người và vật vào nơi trú ẩn, nhưng không thêm ý vượt quá hành động được kể.
- source_word: עֲבָדָיו
  choice: các đầy tớ mình
  rationale: עֶבֶד có thể là đầy tớ hoặc nô lệ; ngữ cảnh chú trọng những người thuộc quyền quản lý bị để ngoài đồng, nên “đầy tớ” phù hợp mà không quyết định địa vị pháp lý.
- source_word: מִקְנֵהוּ
  choice: gia súc mình
  rationale: Danh từ chỉ chung đàn vật nuôi hoặc tài sản chăn nuôi; “gia súc” là cách gọi tập thể tự nhiên trong tiếng Việt.
- source_word: בַּשָּׂדֶה
  choice: ngoài đồng
  rationale: Diễn đạt tự nhiên vị trí ở nơi trống trải, tương phản ngầm với việc đưa vào nhà để tránh mưa đá.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH; giữ “Yahweh” giúp phân biệt danh này với các tước hiệu, không áp đặt cách thay thế theo truyền thống hệ phái.
- issue: Mức độ cố ý trong לֹא שָׂם לִבּוֹ אֶל
  choice: không để tâm đến
  alternative: không đặt lòng mình vào / không coi trọng
  rationale: Thành ngữ cho thấy người ấy không lưu tâm hay coi trọng lời Yahweh. Cách dịch này giữ sức căng giữa thái độ nội tâm và hành động bất tuân tiếp theo, không quy thêm động cơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đầy tớ” thay vì xác quyết “nô lệ”; dùng “ngoài đồng” cho sắc thái địa điểm tự nhiên. Dấu chú thích [a] xuất hiện ngay sau câu.
