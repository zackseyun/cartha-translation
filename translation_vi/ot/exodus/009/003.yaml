source:
  edition: WLC
  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: vi
  text: 'Này, tay Yahweh sẽ giáng xuống trên gia súc của ngươi ở ngoài đồng—trên ngựa, lừa, lạc đà, bò và chiên dê: một dịch bệnh rất nặng[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ôn dịch”; từ Hê-bơ-rơ chỉ một dịch bệnh chết chóc, trong ngữ cảnh này giáng trên đàn gia súc.
    reason: Nêu nghĩa chuyên biệt và phương án dịch khác của דֶּבֶר mà không dùng từ cổ trong chính văn.
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái khẩn cấp của lời tuyên báo, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: יַד יְהוָה
  choice: tay Yahweh
  rationale: Giữ hình ảnh Hê-bơ-rơ chỉ quyền năng và sự phán xét trực tiếp của Đức Chúa Trời, thay vì diễn giải thành một hành động chung chung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được ghi trực tiếp bằng Tứ Tự Danh, không thay bằng một tước hiệu.
- source_word: הוֹיָה
  choice: sẽ giáng trên
  rationale: Thể hiện hành động sắp xảy ra trong lời cảnh báo; “giáng trên” kết hợp tự nhiên với hình ảnh “tay” và hàm ý phán xét.
- source_word: בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  choice: trên gia súc của ngươi đang ở ngoài đồng
  rationale: מִקְנֶה là thuật ngữ rộng chỉ vật nuôi; mệnh đề sau giới hạn đối tượng vào số gia súc ở ngoài đồng.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: trên ngựa, lừa, lạc đà, bò và chiên dê
  rationale: Giữ nguyên danh sách các nhóm vật nuôi; “chiên dê” diễn đạt nghĩa tập hợp của צֹאן, vốn có thể bao gồm cả cừu lẫn dê.
- source_word: דֶּבֶר
  choice: trận dịch
  rationale: Chỉ một dịch bệnh gây chết hàng loạt; cách nói này rõ ràng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: כָּבֵד מְאֹד
  choice: vô cùng dữ dội
  rationale: Chuyển thành ngữ nghĩa đen “rất nặng” sang cách diễn đạt tự nhiên về mức độ nghiêm trọng của dịch bệnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước; giữ “Yahweh” phân biệt danh riêng này với các tước hiệu.
- issue: Hình ảnh “tay Yahweh”
  choice: Giữ nguyên hình ảnh “tay”
  alternative: Diễn giải là “Yahweh sẽ trừng phạt”
  rationale: Nguyên văn dùng một hình ảnh thần học giàu ý nghĩa về quyền năng và sự phán xét; diễn giải hoàn toàn sẽ làm mất hình ảnh và thu hẹp sắc thái.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “ngươi” phù hợp lời Môi-se truyền cho Pha-ra-ôn trong ngữ cảnh cổ đại; giữ thành ngữ “tay Yahweh”, còn các tên loài vật và cách gọi dịch bệnh đều dùng từ phổ thông.
