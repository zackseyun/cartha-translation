revisions:
- from: Này, tay Yahweh sẽ giáng trên gia súc của ngươi đang ở ngoài đồng—trên ngựa, lừa, lạc đà, bò và chiên dê—bằng một trận dịch vô cùng dữ dội[a].
  to: 'Này, tay Yahweh sẽ giáng xuống trên gia súc của ngươi ở ngoài đồng—trên ngựa, lừa, lạc đà, bò và chiên dê: một dịch bệnh rất nặng[a].'
  rationale: Sửa cấu trúc câu để “dịch bệnh rất nặng” được hiểu là hình thức phán xét được công bố, thay vì một phương tiện ngữ pháp mơ hồ. Giữ nguyên danh Yahweh, ẩn dụ “tay”, đối tượng ở ngoài đồng, danh sách loài vật, và cường độ của dịch bệnh.
