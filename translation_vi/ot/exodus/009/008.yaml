  terminology: “Yahweh” nhất quán với quyết định chuyển tự Danh Thánh. Các tên Môi-se, A-rôn và Pha-ra-ôn được phiên âm nhất quán. “Phán,” “muội than,” và “trước mắt Pha-ra-ôn” phù hợp cả ngữ vực lẫn nghĩa từ vựng.
