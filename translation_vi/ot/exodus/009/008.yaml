id: EXO.9.8
reference: Exodus 9:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ קְח֤וּ לָ/כֶם֙ מְלֹ֣א חָפְנֵי/כֶ֔ם פִּ֖יחַ כִּבְשָׁ֑ן וּ/זְרָק֥/וֹ מֹשֶׁ֛ה הַ/שָּׁמַ֖יְמָ/ה לְ/עֵינֵ֥י פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se và A-rôn: “Hai ngươi hãy lấy đầy hai tay[a] muội than[b] từ lò nung, rồi Môi-se hãy tung nó lên trời[c] trước mắt Pha-ra-ôn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “phần đầy của hai bàn tay các ngươi”; cũng có thể dịch: “những nắm đầy tay.”'
    reason: lexical_alternative
  - marker: b
    text: “Muội than” cũng có thể dịch rộng hơn là “tro”, nhưng từ Hê-bơ-rơ cụ thể hơn, chỉ chất bột mịn lấy từ lò.
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “về phía trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ nguyên chức năng của Danh trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: אמר là động từ nói thông dụng; trong văn cảnh Đức Chúa Trời truyền lệnh, “phán” là cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: קְחוּ לָכֶם
  choice: Hai ngươi hãy lấy
  rationale: Mệnh lệnh ở số nhiều hướng đến Môi-se và A-rôn. “Hai ngươi” làm rõ số người được truyền lệnh; sắc thái לָכֶם được thể hiện tự nhiên trong toàn câu.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: đầy hai tay
  rationale: Cụm từ chỉ lượng chứa đầy trong hai bàn tay khum lại. Cách dịch này giữ hình ảnh cụ thể và phù hợp với hai người đang được nói đến.
- source_word: פִּיחַ
  choice: muội than
  rationale: Từ này chỉ lớp bột đen mịn hoặc muội từ lò, cụ thể hơn “tro”; “muội than” là cách gọi hiện đại, dễ hiểu.
- source_word: כִּבְשָׁן
  choice: lò nung
  rationale: Chỉ lò hoặc lò nung dùng nhiệt độ cao; “lò nung” đủ rộng và không xác định quá mức công dụng.
- source_word: וּזְרָקוֹ מֹשֶׁה
  choice: rồi Môi-se hãy tung nó
  rationale: Động từ chuyển từ mệnh lệnh số nhiều sang Môi-se là chủ thể số ít. Cấu trúc này bảo toàn sự chuyển đổi người thực hiện.
- source_word: הַשָּׁמַיְמָה
  choice: lên trời
  rationale: Hậu tố chỉ hướng diễn tả chuyển động lên phía bầu trời. “Lên trời” tự nhiên trong tiếng Việt và vẫn để ngỏ sắc thái “về phía trời”.
- source_word: לְעֵינֵי פַרְעֹה
  choice: trước mắt Pha-ra-ôn
  rationale: Giữ hình ảnh trực tiếp của thành ngữ Hê-bơ-rơ, nhấn mạnh hành động diễn ra trong tầm nhìn của Pha-ra-ôn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh Bốn Chữ. Phiên âm “Yahweh” bảo toàn đây là danh riêng, không thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “phán” cho lời Đức Chúa Trời, “hai ngươi” để thể hiện rõ mệnh lệnh số nhiều, và giữ thành ngữ giàu hình ảnh “trước mắt Pha-ra-ôn”.
