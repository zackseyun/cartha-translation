  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của nguyên văn: mệnh lệnh số nhiều cho Môi-se và A-rôn; lượng muội than đầy hai bàn tay; muội từ lò nung; sự chuyển sang Môi-se là người tung; hướng lên/về phía trời; và hành động diễn ra trước mắt Pha-ra-ôn. “Muội than” là lựa chọn sát nghĩa cho פִּיחַ, còn “lò nung” phù hợp với כִּבְשָׁן.'
