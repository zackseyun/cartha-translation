id: EXO.9.14
reference: Exodus 9:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: vi
  text: Vì lần này, ta sẽ giáng mọi tai họa của ta vào lòng ngươi[a], trên các bề tôi và dân ngươi, để ngươi biết rằng trên khắp đất[b] không có ai như ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhằm thẳng vào lòng ngươi.” Cụm từ Hê-bơ-rơ có nghĩa đen là “đến/vào lòng ngươi”, có thể nói rằng các tai họa nhắm vào chính Pha-ra-ôn, tận cốt lõi con người ông.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ cũng có thể dịch là “xứ”. “Trên khắp đất” có thể chỉ toàn thế giới; cách hiểu “trong khắp xứ” giới hạn hơn theo phạm vi địa phương.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Nối câu này với lời giải thích ở ngữ cảnh trước, cho biết lý do Đức Chúa Trời cảnh báo và hành động như vậy.
- source_word: בַּפַּעַם הַזֹּאת
  choice: lần này
  rationale: Cách nói tự nhiên trong tiếng Việt, chỉ đợt hành động sắp diễn ra.
- source_word: אֲנִי שֹׁלֵחַ
  choice: ta sẽ giáng
  rationale: Phân từ diễn tả hành động sắp xảy ra; “giáng” phù hợp với tai họa như đòn phán xét, còn “sẽ” làm rõ tính cận kề trong tiếng Việt.
- source_word: כָּל מַגֵּפֹתַי
  choice: mọi tai họa của ta
  rationale: מַגֵּפָה có thể chỉ tai họa, dịch bệnh hoặc đòn đánh. “Tai họa” đủ rộng cho văn cảnh các tai vạ và tránh giới hạn nghĩa vào bệnh dịch.
- source_word: אֶל לִבְּךָ
  choice: vào lòng ngươi
  rationale: Giữ hình ảnh nguyên văn “đến/vào lòng ngươi”, nhắm vào chính con người bên trong của Pha-ra-ôn, thay vì diễn giải phẳng thành “vào ngươi”.
- source_word: וּבַעֲבָדֶיךָ
  choice: trên các bề tôi
  rationale: “Bề tôi” phù hợp với các quan chức và thuộc hạ của Pha-ra-ôn hơn “nô lệ”; giới từ được diễn đạt bằng “trên” theo ý tai họa giáng xuống.
- source_word: וּבְעַמֶּךָ
  choice: và dân ngươi
  rationale: Chỉ dân Ai Cập dưới quyền Pha-ra-ôn; tiếng Việt tự nhiên có thể hiểu “trên” chi phối cả thành phần phối hợp này.
- source_word: בַּעֲבוּר תֵּדַע
  choice: để ngươi biết
  rationale: Diễn đạt trực tiếp quan hệ mục đích mà בַּעֲבוּר đánh dấu.
- source_word: אֵין כָּמֹנִי
  choice: không có ai như ta
  rationale: Cách nói rõ ràng, tự nhiên, giữ nguyên lời khẳng định về sự vô song.
- source_word: בְּכָל הָאָרֶץ
  choice: trong khắp đất
  rationale: אֶרֶץ có thể là “đất”, “xứ” hoặc “trái đất”. “Trong khắp đất” giữ phần nào độ rộng nghĩa của từ Hê-bơ-rơ, còn chú thích nêu rõ hai cách hiểu chính.
theological_decisions:
- issue: Phạm vi lời khẳng định Đức Chúa Trời là Đấng vô song
  choice: Dùng “trong khắp đất”, có thể được hiểu theo phạm vi toàn thế giới
  alternative: “trong khắp xứ”, giới hạn trực tiếp hơn vào lãnh thổ
  rationale: Ngữ cảnh nhấn mạnh quyền năng vô song của Đức Chúa Trời, nhưng אֶרֶץ tự nó vẫn có thể mang nghĩa địa phương hoặc toàn cầu; bản dịch và chú thích không xóa bỏ độ mở này.
- issue: Ý nghĩa của “vào lòng ngươi”
  choice: Giữ nguyên ẩn dụ về tai họa hướng vào lòng Pha-ra-ôn
  alternative: Diễn giải thành “giáng trên chính ngươi”
  rationale: Bản Hê-bơ-rơ nói rõ “đến/vào lòng ngươi”. Giữ “lòng” bảo toàn mối liên hệ với chủ đề lòng Pha-ra-ôn và không quyết định thay độc giả rằng cụm từ chỉ có nghĩa là bản thân ông nói chung.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “ta—ngươi” thể hiện lời phán trực tiếp đầy uy quyền trong bối cảnh cổ đại. “Bề tôi” phân biệt các quan chức, thuộc hạ của Pha-ra-ôn với nô lệ. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
