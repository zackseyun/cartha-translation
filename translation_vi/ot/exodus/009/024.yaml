base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: vi
  text: Đã có mưa đá[a], và lửa lóe lên giữa mưa đá, dữ dội vô cùng—một trận như thế chưa từng xảy ra trên khắp đất Ai Cập kể từ khi Ai Cập trở thành một quốc gia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và lửa phóng qua giữa mưa đá”; tiếng Hê-bơ-rơ dùng từ theo nghĩa đen là “lửa”, có lẽ mô tả những luồng sáng giống như chớp lóe trong cơn bão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: Có mưa đá
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt để thuật lại sự xuất hiện của mưa đá, đồng thời giữ lực tồn tại/tường thuật của וַיְהִי.
- source_word: וְאֵשׁ
  choice: và lửa
  rationale: Giữ nguyên hình ảnh cụ thể của danh từ Hê-bơ-rơ אֵשׁ, thay vì chuyển thẳng thành “chớp” và qua đó thu hẹp nghĩa.
- source_word: מִתְלַקַּחַת
  choice: lóe lên
  rationale: Phân từ Hitpael diễn tả lửa chuyển động hoặc bùng lóe trong mưa đá; “lóe lên” tự nhiên, sinh động và không giải thích quá mức hiện tượng.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: giữa mưa đá
  rationale: Diễn đạt ý ở bên trong/giữa trận mưa đá bằng tiếng Việt gọn và tự nhiên.
- source_word: כָּבֵד מְאֹד
  choice: dữ dội vô cùng
  rationale: כבד có nghĩa đen là “nặng”, nhưng khi nói về trận bão, cụm này chỉ mức độ cực kỳ nghiêm trọng; cách dịch đã chọn phù hợp ngữ cảnh khí tượng.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: chưa từng có trận nào như thế
  rationale: Làm rõ đối tượng so sánh ngầm là trận mưa đá/bão, đồng thời bảo toàn ý về mức độ chưa từng có.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: trên khắp đất Ai Cập
  rationale: Giữ phạm vi toàn lãnh thổ và sắc thái địa lý của אֶרֶץ.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: kể từ khi nước ấy trở thành một dân tộc
  rationale: Đại từ giống cái trong tiếng Hê-bơ-rơ quy chiếu về đất/nước Ai Cập, còn לְגוֹי chỉ sự trở thành một dân tộc hay quốc gia. Bản dịch giữ “dân tộc” để phản ánh גוי và dùng “nước ấy” làm chủ thể tự nhiên trong tiếng Việt.
