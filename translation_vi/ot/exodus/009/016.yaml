source:
  edition: WLC
  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: vi
  text: 'Nhưng chính vì mục đích này mà Ta đã để ngươi tiếp tục tồn tại[a]: để cho ngươi thấy quyền năng Ta, và để danh Ta được công bố trên khắp đất.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đã dựng ngươi lên.” Động từ Hê-bơ-rơ có thể chỉ việc khiến Pha-ra-ôn đứng hoặc tiếp tục đứng; trong ngữ cảnh, có lẽ nói đến việc Đức Chúa Trời để ông còn sống thay vì tiêu diệt ông ngay lập tức.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với câu trước bằng cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: בַּעֲבוּר זֹאת
  choice: chính vì mục đích này
  rationale: Cụm từ nêu mục đích của việc Đức Chúa Trời để Pha-ra-ôn tiếp tục tồn tại, không chỉ đơn thuần nêu nguyên nhân.
- source_word: הֶעֱמַדְתִּיךָ
  choice: Ta đã để ngươi đứng vững
  rationale: Giữ hình ảnh của động từ עמד ở thể Hiphil, đồng thời trong ngữ cảnh truyền đạt ý Pha-ra-ôn được để cho tiếp tục đứng vững, thay vì bị tiêu diệt ngay.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: để cho ngươi thấy
  rationale: Diễn đạt trực tiếp mệnh đề mục đích và giữ ngươi là đối tượng được chứng kiến quyền năng.
- source_word: כֹּחִי
  choice: quyền năng của Ta
  rationale: Trong trình thuật các tai vạ, כֹּחַ chỉ sức mạnh được bày tỏ; quyền năng là cách diễn đạt tự nhiên và phù hợp ngữ cảnh thần học.
- source_word: וּלְמַעַן
  choice: và để
  rationale: Nối rõ mục đích thứ hai với mục đích thứ nhất mà không làm câu nặng nề.
- source_word: סַפֵּר
  choice: được công bố
  rationale: Động từ Piel có nghĩa kể lại hoặc truyền rao; dạng bị động giữ nguyên chủ thể không xác định của tiếng Hê-bơ-rơ và phù hợp với phạm vi toàn cầu.
- source_word: שְׁמִי
  choice: danh Ta
  rationale: Giữ thành ngữ nguyên ngữ, bao hàm danh tiếng và căn tính được bày tỏ của Đức Chúa Trời.
- source_word: בְּכָל הָאָרֶץ
  choice: khắp cả đất
  rationale: Diễn đạt phạm vi rộng của כָּל־הָאָרֶץ; trong ngữ cảnh này đất được hiểu theo nghĩa toàn cõi đất chứ không chỉ một vùng lãnh thổ.
theological_decisions:
- issue: Ý nghĩa của הֶעֱמַדְתִּיךָ đối với Pha-ra-ôn
  choice: Đức Chúa Trời đã để Pha-ra-ôn tiếp tục đứng vững, tức chưa tiêu diệt ông, nhằm thực hiện mục đích của Ngài.
  alternative: Đức Chúa Trời đã dựng Pha-ra-ôn lên hoặc đưa ông lên ngôi vì mục đích này.
  rationale: Ngữ cảnh ngay trước đó đối chiếu việc Đức Chúa Trời có thể đã diệt Pha-ra-ôn với việc ông vẫn còn đứng. Bản dịch giữ hình ảnh Hê-bơ-rơ và ý bảo tồn sự sống, nhưng chú thích cũng bảo lưu cách hiểu dựng lên.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—ngươi” phù hợp với lời phán trực tiếp của Đức Chúa Trời với Pha-ra-ôn. Cụm “đứng vững” giữ hình ảnh nguyên ngữ; chú thích bảo lưu cách đọc khác mà không áp đặt một kết luận thần học mạnh hơn văn bản.
