  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-hô-va phán với Môi-se: “Hãy vào gặp Pha-ra-ôn và nói với vua: ‘Đức Giê-hô-va, Đức Chúa Trời của người Hê-bơ-rơ, phán thế này: Hãy để dân Ta ra đi, để họ phụng sự Ta.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Hãy vào gặp Pha-ra-ôn
  rationale: Giữ sắc thái động từ בוא là “đi/vào” hướng đến nơi Pha-ra-ôn đang ở; thêm “gặp” để câu tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng giao ước đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt, thay vì đồng nhất danh này với tước hiệu “Chúa”.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Đức Chúa Trời của người Hê-bơ-rơ
  rationale: Diễn đạt trực tiếp kết cấu sở hữu của nguyên văn và dùng tên gọi dân tộc quen thuộc.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Hãy để dân Ta ra đi
  rationale: שׁלח ở đây mang nghĩa phóng thích hoặc cho đi; cách dịch này tự nhiên và phù hợp với yêu cầu gửi dân ra khỏi quyền kiểm soát của Pha-ra-ôn.
- source_word: וְיַעַבְדֻנִי
  choice: để họ phụng sự Ta
  rationale: עבד có thể chỉ phục vụ hoặc thờ phượng; “phụng sự” giữ được cả chiều kích phục vụ lẫn sự tận hiến tôn giáo trong ngữ cảnh.
theological_decisions:
- issue: Cách thể hiện danh YHWH
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Giê-hô-va (YHWH)
  rationale: Nguyên văn dùng danh riêng יהוה. Phiên âm giúp phân biệt danh này với danh xưng אֱלֹהִים xuất hiện ngay sau đó mà không áp đặt cách hiểu giáo phái.
- issue: Ý nghĩa của עבד trong mệnh lệnh
  choice: phụng sự
  alternative: thờ phượng / phục vụ
  rationale: Không thu hẹp từ này chỉ vào nghi lễ thờ phượng hay lao dịch; “phụng sự” bảo toàn độ rộng ngữ nghĩa và sự đối lập ngầm với việc dân đang phục dịch Pha-ra-ôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “vua” làm đại từ quy chiếu cho Pha-ra-ôn để lời kể tự nhiên; viết hoa “Ta” khi Đức Chúa Trời tự xưng theo quy ước kính trọng phổ biến trong tiếng Việt.
