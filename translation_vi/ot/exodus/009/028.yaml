revisions:
- from: Hãy khẩn cầu Đức Giê-hô-va; tiếng sấm của Đức Chúa Trời và mưa đá như thế là đủ rồi. Ta sẽ để các ngươi đi, và các ngươi sẽ không còn phải ở lại nữa.
  to: Hãy khẩn cầu Yahweh; sấm của Đức Chúa Trời[a] và mưa đá đã đủ rồi. Ta sẽ cho các ngươi đi, và các ngươi sẽ không phải ở lại nữa.
  rationale: Sửa cách chuyển danh YHWH thành “Yahweh” theo quy ước POB. Thay đổi nhẹ câu văn để tiếng Việt tự nhiên hơn, không đổi nghĩa. Bổ sung chú thích để cho biết nghĩa đen của קֹלֹת mà vẫn dùng “sấm” theo ngữ cảnh khí tượng.
  reviewer_model: gpt-5.6-terra
