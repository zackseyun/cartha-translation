language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: vi
  text: Hãy khẩn cầu Yahweh; sấm của Đức Chúa Trời[a] và mưa đá đã đủ rồi. Ta sẽ cho các ngươi đi, và các ngươi sẽ không phải ở lại nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “những tiếng của Đức Chúa Trời.” Trong bối cảnh cơn bão, cụm này chỉ tiếng sấm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: Hãy khẩn cầu
  rationale: Động từ Hiphil mệnh lệnh số nhiều của עתר chỉ sự nài xin tha thiết. “Khẩn cầu” vừa tự nhiên vừa diễn đạt rõ tính cấp thiết trong lời Pha-ra-ôn.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để thể hiện danh riêng YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: וְרַב מִהְיֹת
  choice: như thế là đủ rồi
  rationale: Thành ngữ Hê-bơ-rơ diễn tả mức độ đã quá đủ; trong ngữ cảnh, Pha-ra-ôn xin cho tai họa chấm dứt.
- source_word: קֹלֹת אֱלֹהִים
  choice: tiếng sấm của Đức Chúa Trời
  rationale: קֹלֹת nghĩa đen là “những tiếng/tiếng nói,” nhưng trong bối cảnh giông bão đi cùng mưa đá, từ này chỉ tiếng sấm. Cụm sở hữu vẫn giữ rõ nguồn gốc thần linh.
- source_word: וּבָרָד
  choice: và mưa đá
  rationale: Cách dịch trực tiếp, thông dụng của בָּרָד.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: Ta sẽ để các ngươi đi
  rationale: Trong sách Xuất Ê-díp-tô Ký, שלח khi nhận dân làm tân ngữ thường có nghĩa cho phép hoặc phóng thích họ ra đi.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: và các ngươi sẽ không còn phải ở lại nữa
  rationale: Thành ngữ “không thêm việc đứng/ở lại” có nghĩa không tiếp tục lưu lại. Cách diễn đạt này truyền đạt lời hứa của Pha-ra-ôn rằng dân sẽ không phải trì hoãn thêm.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Hằng Hữu; CHÚA
  rationale: Giữ đây là danh riêng của Đức Chúa Trời, không âm thầm thay bằng một tước hiệu; chọn hình thức đã quen thuộc và trang trọng trong tiếng Việt.
- issue: Ý nghĩa của קֹלֹת אֱלֹהִים
  choice: tiếng sấm của Đức Chúa Trời
  alternative: những tiếng của Đức Chúa Trời; sấm thần
  rationale: Ngữ cảnh tai họa mưa đá xác định những “tiếng” là tiếng sấm. Cách dịch vẫn bảo toàn cấu trúc quy tiếng sấm về Đức Chúa Trời mà không diễn giải sâu hơn bản nguồn.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. Đại từ “Ta/các ngươi” phản ánh lời của Pha-ra-ôn nói với Môi-se và A-rôn. Không thêm chú thích vì bản dịch chính đã thể hiện rõ nghĩa ngữ cảnh của קֹלֹת là tiếng sấm.
