source:
  edition: WLC
  text: כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת יָדִ֔/י וָ/אַ֥ךְ אוֹתְ/ךָ֛ וְ/אֶֽת עַמְּ/ךָ֖ בַּ/דָּ֑בֶר וַ/תִּכָּחֵ֖ד מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: vi
  text: Vì đến lúc này, ta đã có thể giơ tay đánh ngươi và dân ngươi bằng dịch bệnh[a], thì ngươi đã bị diệt trừ khỏi mặt đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo hình thái sát hơn: “Vì bây giờ ta đã giơ tay đánh ngươi và dân ngươi bằng dịch bệnh, và ngươi đã bị diệt trừ khỏi mặt đất.” Các động từ Hê-bơ-rơ có hình thái quá khứ, nhưng văn cảnh ủng hộ mạnh mẽ cách hiểu phản thực.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Diễn đạt chức năng giải thích/nguyên nhân, nối câu này với lời tuyên bố ngay trước đó.
- source_word: עַתָּה
  choice: đến lúc này
  rationale: Trong ngữ cảnh phản thực, cụm này diễn đạt tự nhiên điều lẽ ra đã có thể xảy ra trước thời điểm hiện tại.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: ta đã có thể giơ tay
  rationale: Giữ hình ảnh Hê-bơ-rơ về việc Đức Chúa Trời ra tay phán xét; thêm yếu tố khả năng để thể hiện nghĩa phản thực do văn cảnh đòi hỏi.
- source_word: וָאַךְ
  choice: đánh
  rationale: Động từ נכה trong ngữ cảnh hình phạt mang nghĩa giáng đòn hay gây tai họa; “đánh” rõ ràng và trang trọng vừa phải.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: ngươi và dân ngươi
  rationale: Chuyển trực tiếp hai đối tượng của sự phán xét; “ngươi” phù hợp lời Đức Chúa Trời phán trực tiếp với Pha-ra-ôn trong văn phong Kinh Thánh trang trọng.
- source_word: בַּדָּבֶר
  choice: bằng dịch bệnh
  rationale: דֶּבֶר chỉ bệnh dịch gây chết chóc trong bối cảnh phán xét; “dịch bệnh” chính xác hơn từ rộng nghĩa “tai họa”.
- source_word: וַתִּכָּחֵד
  choice: khiến ngươi bị xóa sạch
  rationale: Niphal của כחד diễn tả việc bị diệt trừ hoặc biến mất hoàn toàn. Cấu trúc “khiến... bị” kết hợp tự nhiên với mệnh đề khả năng phản thực phía trước.
- source_word: מִן־הָאָרֶץ
  choice: khỏi mặt đất
  rationale: Ở đây אֶרֶץ có phạm vi rộng hơn riêng xứ Ai Cập; thành ngữ “xóa sạch khỏi mặt đất” tự nhiên và giữ mức độ nghiêm trọng của câu.
theological_decisions:
- issue: Sắc thái phản thực của chuỗi động từ
  choice: 'Dịch là điều Đức Chúa Trời đã có thể làm nhưng thực tế chưa làm: “ta đã có thể... khiến ngươi...”'
  alternative: 'Dịch sát hình thái quá khứ: “Bây giờ ta đã giơ tay đánh... và ngươi đã bị xóa sạch...”'
  rationale: Các động từ Hê-bơ-rơ có hình thái quá khứ, nhưng Pha-ra-ôn vẫn đang sống và được trực tiếp phán bảo; câu kế tiếp cũng đối chiếu điều Đức Chúa Trời có thể làm với mục đích Ngài đã để ông tồn tại. Cách dịch phản thực giữ đúng mạch diễn ngôn mà không bổ sung một lập trường thần học riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ta/ngươi” để giữ sắc thái lời phán trực tiếp của Đức Chúa Trời với Pha-ra-ôn; tránh từ cổ như “ôn dịch” và tránh giải nghĩa thần học vượt quá văn bản.
