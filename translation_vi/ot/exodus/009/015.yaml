  rationale: Giữ cách hiểu phản thực được văn cảnh hỗ trợ, nhưng thay “khiến” bằng kết cấu “thì” để biểu thị vế hệ quả phản thực mà không diễn giải thêm quan hệ cú pháp. Đổi “bị xóa sạch” thành “bị diệt trừ” để gần hơn với כחד và giữ giọng văn trang trọng. Chú thích được điều chỉnh tương ứng, vẫn bảo tồn lựa chọn dịch sát hình thái quá khứ.
