base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: vi
  text: Pha-ra-ôn sai người đi[a], và kìa, không một con nào trong đàn gia súc của Y-sơ-ra-ên đã chết. Nhưng lòng Pha-ra-ôn trở nên nặng nề[b], và ông không để dân chúng ra đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ chỉ nói “Pha-ra-ôn sai đi”; đối tượng được sai đi và mục đích tìm hiểu được hiểu từ ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “lòng Pha-ra-ôn trở nên nặng”, một thành ngữ diễn tả sự ngoan cố, chai cứng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sai người đi kiểm tra
  rationale: Động từ có nghĩa đen là “sai, phái đi”; trong ngữ cảnh, mục đích là xác minh tình trạng đàn vật của Y-sơ-ra-ên. Bổ sung “người đi kiểm tra” giúp câu tiếng Việt tự nhiên mà không xác định họ là ai.
- source_word: וְהִנֵּה
  choice: và quả nhiên
  rationale: Tiểu từ này hướng sự chú ý đến điều được phát hiện. “Quả nhiên” diễn đạt tự nhiên kết quả mà người được sai đi đã xác minh.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: không một con vật nào của dân Y-sơ-ra-ên bị chết
  rationale: Cụm עַד אֶחָד nhấn mạnh rằng thậm chí một con cũng không chết; cách dịch này giữ trọn ý nhấn mạnh và phù hợp tiếng Việt hiện đại.
- source_word: מִקְנֶה
  choice: con vật
  rationale: Trong câu này, từ chỉ chung vật nuôi chứ không riêng bò; “con vật” trong cấu trúc phủ định tránh cách nói thiếu tự nhiên “một gia súc”.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: lòng Pha-ra-ôn trở nên nặng nề
  rationale: Bám sát hình ảnh Hê-bơ-rơ “lòng trở nên nặng”, đồng thời không thêm một tác nhân gây chai cứng mà câu này không nêu rõ.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: và ông không để dân chúng ra đi
  rationale: Trong mạch truyện Xuất Ê-díp-tô Ký, שׁלח với dân chúng làm bổ ngữ có nghĩa là cho phép họ rời đi.
theological_decisions:
- issue: Tác nhân trong sự cứng lòng của Pha-ra-ôn
  choice: lòng Pha-ra-ôn trở nên nặng nề
  alternative: lòng Pha-ra-ôn trở nên chai cứng
  rationale: Nguyên văn dùng כבד, nghĩa đen là “trở nên nặng”, với “lòng Pha-ra-ôn” làm chủ ngữ và không nêu tác nhân bên ngoài. Giữ hình ảnh này bảo toàn sự căng thẳng thần học về trách nhiệm của Pha-ra-ôn và hành động của Đức Chúa Trời trong toàn bộ trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ra-ôn” và “Y-sơ-ra-ên” theo lối phiên âm quen thuộc trong tiếng Việt; giữ thành ngữ “lòng... nặng nề” trong chính văn và giải thích nghĩa bóng ở chú thích.
