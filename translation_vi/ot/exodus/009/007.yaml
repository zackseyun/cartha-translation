  source_fidelity: Bản nháp truyền đạt đúng kết quả cuộc sai phái, việc không một vật nuôi nào của Y-sơ-ra-ên chết, và việc Pha-ra-ôn không cho dân đi. Tuy nhiên, “đi kiểm tra” đưa mục đích của cuộc sai phái từ ngữ cảnh vào chính văn, trong khi tiếng Hê-bơ-rơ chỉ nói ông sai đi. “Quả nhiên” cũng diễn tả sự xác nhận một điều đã dự kiến, yếu hơn và khác chức năng thu hút chú ý của וְהִנֵּה.
  naturalness: Câu sửa vẫn tự nhiên trong tiếng Việt hiện đại, với “kìa” giữ sắc thái tường thuật Kinh Thánh vừa phải. “Đàn gia súc” diễn đạt מִקְנֶה chính xác và tự nhiên hơn “con vật”, vốn có thể bao gồm cả động vật không phải vật nuôi.
  terminology: Giữ nhất quán các tên “Pha-ra-ôn”, “Y-sơ-ra-ên”. Giữ “lòng ... trở nên nặng nề” để phản ánh כבד mà không áp đặt tác nhân hay giải quyết nghĩa thần học trong chính văn; chú thích giải nghĩa thành ngữ.
