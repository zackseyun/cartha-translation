  to: Pha-ra-ôn sai người đi[a], và kìa, không một con nào trong đàn gia súc của Y-sơ-ra-ên đã chết. Nhưng lòng Pha-ra-ôn trở nên nặng nề[b], và ông không để dân chúng ra đi.
