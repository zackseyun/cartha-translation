  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ אֶת פִּ֣יחַ הַ/כִּבְשָׁ֗ן וַ/יַּֽעַמְדוּ֙ לִ/פְנֵ֣י פַרְעֹ֔ה וַ/יִּזְרֹ֥ק אֹת֛/וֹ מֹשֶׁ֖ה הַ/שָּׁמָ֑יְמָ/ה וַ/יְהִ֗י שְׁחִין֙ אֲבַעְבֻּעֹ֔ת פֹּרֵ֕חַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: vi
  text: Họ lấy muội than từ lò, rồi đứng trước mặt Pha-ra-ôn. Môi-se tung muội than lên trời, và muội than ấy biến thành những ung nhọt nổi mụn nước trên người và súc vật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng cách nói tập hợp “trên người và trên súc vật”, nghĩa là tai họa ảnh hưởng đến cả con người lẫn loài vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיחַ
  choice: muội than
  rationale: Chỉ thứ bột đen mịn hay muội lấy từ lò, chính xác hơn từ chung chung “tro”.
- source_word: הַכִּבְשָׁן
  choice: lò
  rationale: כִּבְשָׁן là lò nung hoặc lò đốt; “lò” tự nhiên trong tiếng Việt và không xác định quá mức công dụng cụ thể.
- source_word: לִפְנֵי פַרְעֹה
  choice: trước mặt Pha-ra-ôn
  rationale: Diễn đạt tự nhiên ý đứng trong sự hiện diện của Pha-ra-ôn.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: Môi-se tung muội than
  rationale: Động từ diễn tả hành động ném/tung; nhắc lại “muội than” giúp đại từ số ít chỉ danh từ khối được rõ ràng trong tiếng Việt.
- source_word: הַשָּׁמָיְמָה
  choice: lên trời
  rationale: Hình thái chỉ hướng diễn tả chuyển động lên phía bầu trời; cách nói này tự nhiên và giữ ý vật lý trước mắt.
- source_word: שְׁחִין
  choice: ung nhọt
  rationale: Chỉ các nhọt hoặc tổn thương da viêm; “ung nhọt” là cách diễn đạt quen thuộc, rõ nghĩa trong văn cảnh tai vạ.
- source_word: אֲבַעְבֻּעֹת
  choice: mụn nước
  rationale: Danh từ chỉ các nốt phồng rộp hoặc mụn nước đi kèm ung nhọt, không mở rộng thành ý “mưng mủ” vốn không tất yếu.
- source_word: פֹּרֵחַ
  choice: nổi
  rationale: Phân từ diễn tả các tổn thương đang phát ra hoặc bùng lên; “nổi” là cách nói tự nhiên về triệu chứng ngoài da.
- source_word: בָּאָדָם
  choice: trên người
  rationale: אָדָם ở đây mang nghĩa tập hợp, đối chiếu loài người với loài vật; “người” bao quát mọi người và tự nhiên hơn “con người” trong cấu trúc này.
- source_word: וּבַבְּהֵמָה
  choice: và súc vật
  rationale: Danh từ tập hợp chỉ thú vật, có thể đặc biệt là vật nuôi; “súc vật” giữ được cặp đối chiếu người–vật mà không chuyển sang số nhiều không cần thiết.
theological_decisions:
- issue: Cách dịch אָדָם trong thế đối chiếu tập hợp giữa loài người và loài vật
  choice: người
  alternative: loài người; con người
  rationale: “Người” giữ nghĩa khái quát, không giới hạn ở nam giới, đồng thời tạo cặp đối chiếu tự nhiên với “súc vật” trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “muội than” để giữ độ chính xác vật chất; cấu trúc câu được tách nhẹ để tiếng Việt sáng rõ. Tất cả dấu chú thích trong văn bản đều có chú thích tương ứng.
