source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח פַּרְעֹ֗ה וַ/יִּקְרָא֙ לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֔ן וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם חָטָ֣אתִי הַ/פָּ֑עַם יְהוָה֙ הַ/צַּדִּ֔יק וַ/אֲנִ֥י וְ/עַמִּ֖/י הָ/רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: vi
  text: 'Bấy giờ, Pha-ra-ôn sai người triệu Môi-se và A-rôn đến rồi nói với họ: “Lần này ta đã phạm tội. Đức Giê-hô-va là Đấng công chính[a]; còn ta và dân ta là những kẻ gian ác[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Giê-hô-va là bên đúng” hoặc “Đức Giê-hô-va là Đấng chí công.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “còn ta và dân ta là bên sai” hoặc “có tội.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: sai người triệu ... đến
  rationale: Diễn đạt tự nhiên trong tiếng Việt hành động Pha-ra-ôn sai người đi gọi Môi-se và A-rôn, đồng thời không hiểu lầm rằng chính ông đi gọi.
- source_word: חָטָאתִי הַפָּעַם
  choice: Lần này ta đã phạm tội
  rationale: Giữ nguyên sắc thái thú nhận về dịp cụ thể này; “đã phạm tội” là cách nói tự nhiên, trực tiếp trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho Danh Thánh, thay vì thay thế bằng một tước hiệu.
- source_word: הַצַּדִּיק
  choice: là Đấng công chính
  rationale: Giữ nội dung đạo đức và pháp lý của tính từ Hê-bơ-rơ, đồng thời phù hợp với cách nói trang trọng về Đức Chúa Trời.
- source_word: הָרְשָׁעִים
  choice: là những kẻ gian ác
  rationale: Giữ số nhiều và sức nặng đạo đức của từ, mạnh hơn cách diễn đạt đơn thuần là “sai” hay “có lỗi”.
- source_word: וַאֲנִי וְעַמִּי
  choice: còn ta và dân ta
  rationale: Giữ thứ tự Hê-bơ-rơ, nhấn mạnh việc Pha-ra-ôn tự nhận mình có tội; “còn” làm rõ thế tương phản với Đức Giê-hô-va.
theological_decisions:
- issue: Cách chuyển Danh Thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; ĐỨC CHÚA
  rationale: Bản nguồn dùng trực tiếp Danh Thánh. “Đức Giê-hô-va” bảo tồn chức năng tên riêng và là dạng đã quen thuộc với đông đảo độc giả Kinh Thánh tiếng Việt.
- issue: Sức nghĩa của lời xưng nhận הַצַּדִּיק
  choice: Đức Giê-hô-va là Đấng công chính
  alternative: Đức Giê-hô-va là phải / là Đấng chí công
  rationale: “Công chính” giữ được cả chiều kích đạo đức lẫn xét xử, nhưng không loại bỏ cách hiểu theo ngữ cảnh rằng Đức Giê-hô-va là bên đúng.
- issue: Sức nghĩa của הָרְשָׁעִים
  choice: ta và dân ta là những kẻ gian ác
  alternative: ta và dân ta là bên sai / có tội
  rationale: Bản chính giữ sức nặng luân lý của từ Hê-bơ-rơ; chú thích nêu nghĩa pháp lý theo ngữ cảnh để bảo tồn độ rộng ngữ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta” trong lời Pha-ra-ôn để phù hợp địa vị vua và lối kể Kinh Thánh tiếng Việt; dùng “sai người triệu ... đến” nhằm tránh lối dịch cứng theo chuỗi động từ Hê-bơ-rơ. Mọi dấu chú thích [a], [b] đều có mặt trong bản văn.
