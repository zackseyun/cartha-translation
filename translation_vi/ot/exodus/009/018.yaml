source:
  edition: WLC
  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: vi
  text: Này, vào khoảng giờ này ngày mai[a], Ta sẽ làm cho một trận mưa đá rất nặng đổ xuống tại Ai Cập, như chưa từng có kể từ ngày Ai Cập được lập nên[b] cho đến bây giờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đúng giờ này ngày mai.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “được thiết lập.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Này
  rationale: Giữ sắc thái chỉ thị và trang trọng của lời công bố thần thượng, đồng thời tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: מַמְטִיר
  choice: Ta sẽ làm ... đổ xuống
  rationale: Dạng Hiphil diễn tả tác động gây khiến; cách dịch này giữ rõ Đức Chúa Trời là chủ thể trực tiếp khiến mưa đá giáng xuống.
- source_word: כָּעֵת מָחָר
  choice: vào khoảng giờ này ngày mai
  rationale: Tiền tố כְּ có thể mang sắc thái xấp xỉ; cách diễn đạt này vừa tự nhiên vừa giữ được ý khoảng cùng thời điểm vào ngày hôm sau.
- source_word: בָּרָד
  choice: mưa đá
  rationale: Thuật ngữ khí tượng chuẩn và chính xác trong tiếng Việt.
- source_word: כָּבֵד מְאֹד
  choice: cực kỳ dữ dội
  rationale: Nghĩa đen là 'rất nặng', nhưng khi mô tả một trận mưa đá, 'cực kỳ dữ dội' truyền đạt tự nhiên mức độ nghiêm trọng mà không làm mất sức nhấn mạnh.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: một trận chưa từng có
  rationale: Diễn đạt gọn và tự nhiên phép so sánh tuyệt đối với mọi trận trước đó.
- source_word: בְּמִצְרַיִם
  choice: tại Ai Cập
  rationale: Cách dịch địa điểm trực tiếp, phù hợp văn cảnh.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: kể từ ngày đất nước ấy được lập nên
  rationale: Dạng Niphal chỉ việc Ai Cập được thiết lập; thêm 'đất nước ấy' làm rõ đại từ giống cái ngầm chỉ Ai Cập trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְעַד עָתָּה
  choice: cho đến bây giờ
  rationale: Giữ nguyên mốc thời gian kéo dài từ khi Ai Cập được lập nên đến thời điểm lời phán.
theological_decisions:
- issue: Tác nhân thần thượng trong lời báo trước tai vạ
  choice: Ta sẽ làm mưa đá ... đổ xuống
  alternative: mưa đá sẽ rơi xuống
  rationale: Động từ Hiphil với chủ thể ngôi thứ nhất quy hành động trực tiếp cho Đức Chúa Trời; không nên làm nhẹ thành một hiện tượng vô chủ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Cấu trúc được điều chỉnh để “một trận” nối rõ với “mưa đá”, tránh cách nói nặng tính dịch từng chữ.
