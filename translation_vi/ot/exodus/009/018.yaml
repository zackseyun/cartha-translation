revisions:
- from: Này, vào khoảng giờ này ngày mai[a], Ta sẽ làm mưa đá cực kỳ dữ dội đổ xuống, một trận chưa từng có tại Ai Cập kể từ ngày đất nước ấy được lập nên[b] cho đến bây giờ.
  to: Này, vào khoảng giờ này ngày mai[a], Ta sẽ làm cho một trận mưa đá rất nặng đổ xuống tại Ai Cập, như chưa từng có kể từ ngày Ai Cập được lập nên[b] cho đến bây giờ.
