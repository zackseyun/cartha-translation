  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: vi
  text: Các pháp sư không thể đứng trước mặt Môi-se vì những ung nhọt, bởi ung nhọt đã nổi trên các pháp sư và trên mọi người Ai Cập.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “trong toàn cõi Ai Cập.” Ngữ cảnh cho thấy ung nhọt nổi trên người dân khắp đất Ai Cập.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: các pháp sư
  rationale: Trong mạch truyện Xuất Ai Cập, từ này chỉ những chuyên gia nghi lễ của Pha-ra-ôn, những người đối đầu hoặc bắt chước Môi-se và A-rôn. “Pháp sư” là cách gọi tự nhiên, quen thuộc và giữ được sắc thái hành nghề huyền thuật.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: đứng trước mặt Môi-se
  rationale: Giữ khá sát thành ngữ Hê-bơ-rơ, vừa diễn tả tư thế đứng trong sự hiện diện của Môi-se, vừa có thể hàm ý ra trình diện trước ông.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: vì những ung nhọt
  rationale: מִפְּנֵי biểu thị nguyên nhân trong ngữ cảnh này. Danh từ số ít có nghĩa tập hợp được chuyển sang số nhiều tự nhiên trong tiếng Việt để chỉ các vết ung nhọt trên nhiều người.
- source_word: הַשְּׁחִין
  choice: ung nhọt
  rationale: “Ung nhọt” diễn tả chứng viêm loét trên da và phù hợp với cách gọi tai họa này trong văn phong Kinh Thánh tiếng Việt.
- source_word: בַּחֲרְטֻמִּם
  choice: trên họ
  rationale: Giới từ ב được hiểu theo nghĩa chỉ vị trí trên thân thể; đại từ “họ” tránh lặp nặng nề mà vẫn quy chiếu rõ về các pháp sư.
- source_word: וּבְכָל מִצְרָיִם
  choice: và trên khắp đất Ai Cập
  rationale: Giữ cấu trúc địa lý sát nguyên văn “trong/toàn cõi Ai Cập” thay vì làm rõ thành “mọi người Ai Cập”; sự hiện diện của ung nhọt trên dân chúng khắp xứ được ngữ cảnh hàm ý.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Bản dịch giữ “đứng trước mặt” để bảo toàn sắc thái thành ngữ, đồng thời giữ cách diễn đạt địa lý của nguyên văn ở cuối câu và giải thích hàm ý chỉ người trong chú thích.
