- from: Các pháp sư không thể đứng trước mặt Môi-se vì những ung nhọt, bởi ung nhọt nổi trên họ và trên khắp đất Ai Cập.[a]
  to: Các pháp sư không thể đứng trước mặt Môi-se vì những ung nhọt, bởi ung nhọt đã nổi trên các pháp sư và trên mọi người Ai Cập.[a]
  rationale: Thay vế cuối bằng “trên mọi người Ai Cập” để diễn đạt rõ và tự nhiên đối tượng chịu bệnh, đồng thời vẫn lưu trong chú thích cách nói địa lý sát nguyên văn. Việc lặp lại “các pháp sư” làm rõ quy chiếu của “họ” và nhấn mạnh sự song hành của nguyên văn.
  reviewer_model: gpt-5.6-terra
