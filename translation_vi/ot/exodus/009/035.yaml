  source_fidelity: 'Bản dịch chuyển đạt đúng các thành tố của tiếng Hê-bơ-rơ: lòng Pha-ra-ôn trở nên/ở tình trạng cứng cỏi mà không xác định tác nhân; ông không cho בני ישראל ra đi; và điều này ứng với lời Yahweh đã phán qua Môi-se. Cách dùng “trở nên cứng cỏi” bảo toàn sắc thái của חזק (mạnh, vững, cứng lại) trong ngữ cảnh ngoan cố, không áp đặt tác nhân thần học.'
