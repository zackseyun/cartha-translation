language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: vi
  text: Vì thế, lòng Pha-ra-ôn trở nên cứng cỏi[a], và ông không để con cái Y-sơ-ra-ên ra đi, đúng như Yahweh đã phán qua Môi-se[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng Pha-ra-ôn trở nên chai cứng.” Động từ Hê-bơ-rơ có nghĩa là “trở nên mạnh, vững,” ở đây diễn tả sự ngoan cố.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “bởi tay Môi-se,” một thành ngữ có nghĩa là “qua Môi-se.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: trở nên cứng cỏi
  rationale: Động từ חזק cơ bản chỉ sự trở nên mạnh hoặc vững; trong mạch truyện này, nó diễn tả ý chí ngoan cố. Cách dịch này giữ hình ảnh về lòng cứng cỏi mà không quy trực tiếp tác nhân gây ra sự cứng lòng.
- source_word: לֵב פַּרְעֹה
  choice: lòng Pha-ra-ôn
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, giữ trọng tâm Hê-bơ-rơ về ý chí và khuynh hướng nội tâm.
- source_word: שִׁלַּח
  choice: để ... ra đi
  rationale: Trong bối cảnh Xuất Ê-díp-tô Ký, động từ này nói đến việc Pha-ra-ôn cho phép dân Y-sơ-ra-ên rời đi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ gần thành ngữ Hê-bơ-rơ 'các con trai/con cái của Y-sơ-ra-ên', đồng thời là cách gọi tập thể quen thuộc và tự nhiên trong tiếng Việt.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Biểu thị rõ sự tương ứng giữa biến cố và lời đã được phán trước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng trong nguyên ngữ, không thay bằng một tước hiệu.
- source_word: דִּבֶּר
  choice: đã phán
  rationale: Thì quá khứ trong tiếng Việt cho thấy lời phán có trước biến cố đang được thuật lại; 'phán' phù hợp với chủ thể thần linh và văn phong Kinh Thánh trang trọng.
- source_word: בְּיַד מֹשֶׁה
  choice: qua Môi-se
  rationale: Chuyển đạt thành ngữ nguyên văn 'bởi tay Môi-se' theo nghĩa phương tiện hay trung gian, bằng tiếng Việt hiện đại tự nhiên.
theological_decisions:
- issue: Tác nhân trong việc lòng Pha-ra-ôn cứng lại
  choice: lòng Pha-ra-ôn trở nên cứng cỏi
  alternative: Pha-ra-ôn làm cho lòng mình cứng lại / lòng Pha-ra-ôn bị làm cho cứng lại
  rationale: Dạng Hê-bơ-rơ ở câu này mô tả lòng ông trở nên mạnh, vững hay cứng cỏi nhưng không nêu rõ tác nhân. Bản dịch tránh quy trực tiếp hành động cho Đức Chúa Trời hoặc cho chính Pha-ra-ôn, nhờ đó bảo toàn sự căng thẳng thần học của trình thuật.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng các dạng tên quen thuộc Pha-ra-ôn, Y-sơ-ra-ên và Môi-se; giữ danh riêng Yahweh theo nguồn. Trật tự câu tự nhiên, đồng thời bảo toàn liên kết nhân quả và sự ứng nghiệm được diễn tả trong nguyên văn.
