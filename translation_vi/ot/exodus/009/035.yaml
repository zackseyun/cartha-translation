  terminology: “Yahweh” phù hợp với quyết định thuật ngữ của dự án. “Con cái Y-sơ-ra-ên” là cách gọi tập thể quen thuộc, chấp nhận được cho בני ישראל, đồng thời chú thích về “bởi tay Môi-se” giải thích chính xác thành ngữ chỉ tính trung gian/phương tiện.
