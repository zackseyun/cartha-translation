id: EXO.9.22
reference: Exodus 9:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: vi
  text: 'Rồi Đức Giê-hô-va phán với Môi-se: “Hãy giơ tay con về phía trời[a], để mưa đá trút xuống khắp đất Ai Cập—trên người, trên súc vật và trên mọi cây cỏ ngoài đồng trong đất Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “về phía các tầng trời.” Từ Híp-ri có thể chỉ bầu trời hoặc các tầng trời; ở đây văn cảnh nói đến bầu trời hữu hình, nơi mưa đá trút xuống.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc và trang trọng trong tiếng Việt cho danh giao ước, thay vì thay thế bằng một tước hiệu.
- source_word: נְטֵה אֶת יָדְךָ
  choice: Hãy giơ tay con
  rationale: Diễn đạt tự nhiên động tác đưa tay ra theo hướng được chỉ định; đại từ “con” phù hợp khi Đức Chúa Trời trực tiếp phán với Môi-se.
- source_word: עַל הַשָּׁמַיִם
  choice: về phía trời
  rationale: Giữ ý chỉ hướng của giới từ và nghĩa khí tượng học của שָׁמַיִם trong văn cảnh; chú thích bảo lưu khả năng dịch “các tầng trời”.
- source_word: וִיהִי בָרָד
  choice: để mưa đá trút xuống
  rationale: Thể hiện quan hệ mệnh lệnh–kết quả của cấu trúc Híp-ri, đồng thời diễn đạt tự nhiên hiện tượng mưa đá từ trời xuống.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: khắp đất Ai Cập
  rationale: Truyền đạt đầy đủ phạm vi toàn cõi mà không làm câu tiếng Việt nặng nề.
- source_word: הָאָדָם
  choice: người
  rationale: Ở đây danh từ mang nghĩa tập hợp, chỉ loài người nói chung trong thế đối sánh với súc vật.
- source_word: הַבְּהֵמָה
  choice: súc vật
  rationale: Chỉ các loài vật nuôi trong bối cảnh tai họa, đồng thời giữ được thế đối sánh ngắn gọn với “người”.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: mọi cây cỏ ngoài đồng
  rationale: עֵשֶׂב có phạm vi nghĩa gồm cỏ, thảo mộc và thực vật; “cây cỏ” là cách nói rộng, tự nhiên trong tiếng Việt.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: trong đất Ai Cập
  rationale: Giữ lại cụm địa danh được nguyên văn lặp lại ở cuối câu để bảo toàn nhấn mạnh và phạm vi.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng chứ không thay bằng tước hiệu; chọn hình thức đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt, không hàm ý một lập trường giáo phái riêng.
- issue: Nghĩa tập hợp của הָאָדָם
  choice: người
  alternative: loài người; con người
  rationale: “Người” vừa tự nhiên vừa bao gồm mọi người trong văn cảnh, không thu hẹp thành nam giới và vẫn giữ thế đối sánh với súc vật.
translation_notes:
  register: Văn phong trần thuật trang trọng nhưng hiện đại. Dùng “phán” cho lời Đức Chúa Trời, “giơ tay” là khẩu lệnh tự nhiên, và giữ nguyên sự lặp lại “đất Ai Cập” ở cuối câu theo nguyên văn.
source_grounding:
  english_pob_role: consult_only
