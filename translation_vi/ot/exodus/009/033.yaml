  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: vi
  text: Môi-se rời Pha-ra-ôn, ra khỏi thành, rồi dang hai tay hướng về Yahweh. Sấm[a] và mưa đá đã dứt, còn mưa không trút xuống đất nữa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là “các tiếng”; trong ngữ cảnh cơn bão, từ này chỉ tiếng sấm.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mưa không trút xuống mặt đất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: Môi-se rời Pha-ra-ôn, ra khỏi thành
  rationale: Diễn đạt tự nhiên chuyển động tách khỏi sự hiện diện của Pha-ra-ôn và đi ra ngoài thành; cụm אֶת הָעִיר được hiểu theo ngữ cảnh là phạm vi Môi-se đi ra khỏi.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: dang hai tay
  rationale: Giữ hình ảnh cụ thể của động tác cầu nguyện; כַּפָּיו theo nghĩa đen là hai lòng bàn tay nhưng tiếng Việt tự nhiên dùng “hai tay”.
- source_word: אֶל יְהוָה
  choice: hướng về Yahweh
  rationale: אֶל biểu thị hướng của cử chỉ và lời cầu nguyện; “hướng về” vừa tự nhiên vừa giữ sắc thái không gian.
- source_word: הַקֹּלוֹת
  choice: sấm
  rationale: Danh từ có nghĩa đen là “các tiếng/tiếng nói”, nhưng trong ngữ cảnh cơn bão chỉ tiếng sấm; chú thích bảo lưu hình thức Hê-bơ-rơ.
- source_word: וַיַּחְדְּלוּ הַקֹּלוֹת וְהַבָּרָד
  choice: Sấm và mưa đá liền dứt
  rationale: חָדַל diễn tả việc ngừng hẳn; “liền dứt” phù hợp mạch kể liên tiếp của thể wayyiqtol.
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: còn mưa không trút xuống đất nữa
  rationale: Dạng bị động נִתַּךְ gợi hình ảnh mưa được trút xuống; “nữa” làm rõ sự chấm dứt trong ngữ cảnh, còn אָרְצָה chỉ hướng xuống đất.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Giữ danh giao ước được văn bản Hê-bơ-rơ dùng trực tiếp, thay vì thay bằng một tước hiệu; không thêm diễn giải hệ phái.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dùng câu ngắn và các động từ thông dụng. Tên riêng được viết theo dạng quen thuộc trong tiếng Việt; “Yahweh” được giữ nguyên như danh riêng. Các dấu chú thích [a], [b] được đặt ngay sau những cụm từ mà chúng giải thích.
