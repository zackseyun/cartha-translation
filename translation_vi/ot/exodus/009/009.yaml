id: EXO.9.9
reference: Exodus 9:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: vi
  text: Nó sẽ hóa thành bụi mịn phủ khắp đất Ai Cập; rồi trên người[a] và thú vật khắp đất Ai Cập sẽ nổi nhọt, phát thành những chỗ phồng rộp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây chỉ loài người nói chung, tương phản với thú vật.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn diễn tả nhọt nổi lên rồi phát thành những chỗ sưng phồng hoặc phồng rộp.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: sẽ hóa thành bụi mịn
  rationale: Động từ היה trong ngữ cảnh này diễn tả kết quả hay sự chuyển thành trạng thái mới; אָבָק là bụi hoặc bột rất nhỏ.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: phủ khắp đất Ai Cập
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, thể hiện bụi lan trên toàn lãnh thổ Ai Cập.
- source_word: עַל הָאָדָם
  choice: trên người
  rationale: אָדָם ở đây chỉ loài người nói chung, đối lập với thú vật; “người” giữ được nghĩa tập thể mà không giới hạn ở nam giới.
- source_word: וְעַל הַבְּהֵמָה
  choice: và thú vật
  rationale: בְּהֵמָה là danh từ tập thể chỉ động vật; “thú vật” giữ được cặp tương phản người–vật và không thu hẹp nghĩa thành gia súc.
- source_word: לִשְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת
  choice: sẽ nổi nhọt, phát thành những chỗ phồng rộp
  rationale: 'Cách dịch thể hiện đủ ba thành tố: שְׁחִין là nhọt hoặc chứng lở loét, פֹּרֵחַ diễn tả sự phát ra/bùng lên, và אֲבַעְבֻּעֹת là những chỗ sưng phồng hay phồng rộp.'
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: khắp đất Ai Cập
  rationale: “Khắp” diễn tả phạm vi phân bố trên toàn cõi Ai Cập và giữ sự lặp lại nhấn mạnh trong nguyên văn.
theological_decisions:
- issue: Cách dịch אָדָם khi chỉ chung loài người
  choice: người
  alternative: nhân loại; con người
  rationale: Trong tiếng Việt hiện đại, “người” tự nhiên, bao gồm mọi người và vẫn duy trì rõ sự đối lập giữa người với thú vật trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hóa thành” cho sự biến đổi, “phủ khắp” cho sự lan rộng của bụi, đồng thời giữ đầy đủ hình ảnh nhọt nổi lên và phát thành các chỗ phồng rộp.
