base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/031.yaml
  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: vi
  text: Cây lanh và lúa mạch đều bị đánh dập, vì lúa mạch đã trổ bông[a], còn cây lanh đã ra nụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lúa mạch đang chín.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cây lanh đã trổ hoa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: cây lanh
  rationale: Danh từ này chỉ cây lanh, loại cây dùng để lấy sợi dệt vải; “cây lanh” là cách gọi trực tiếp và tự nhiên trong ngữ cảnh mùa màng.
- source_word: הַשְּׂעֹרָה
  choice: lúa mạch
  rationale: Từ Hê-bơ-rơ chỉ lúa mạch, một trong hai loại cây trồng bị thiệt hại.
- source_word: נֻכָּתָה
  choice: đều bị đánh dập
  rationale: Dạng bị động của נכה diễn tả hai loại cây bị giáng xuống và hư hại. “Bị đánh dập” vừa giữ hình ảnh tác động mạnh vừa tự nhiên trong tiếng Việt; “đều” làm rõ chủ ngữ ghép dù động từ Hê-bơ-rơ ở số ít giống cái.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu nguyên nhân khiến hai loại cây dễ bị đánh dập ở thời điểm ấy.
- source_word: אָבִיב
  choice: đã trổ bông
  rationale: Từ này mô tả lúa mạch ở giai đoạn bông đã hình thành và hạt đang phát triển. “Đã trổ bông” giữ hình ảnh nông nghiệp cụ thể, còn khả năng hiểu khái quát là “đang chín” được ghi ở chú thích.
- source_word: גִּבְעֹל
  choice: đã ra nụ
  rationale: Từ hiếm này chỉ một giai đoạn phát triển khá muộn của cây lanh, thường được hiểu là đã ra nụ hoặc trổ hoa. Bản dịch chính dùng cách diễn đạt cụ thể nhưng không quá chuyên môn; cách hiểu khác được giữ trong chú thích.
theological_decisions: []
