  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “vì… còn…” diễn đạt tự nhiên lý do cả hai loại cây bị thiệt hại, đồng thời giữ hai giai đoạn sinh trưởng song song trong nguyên văn.
