language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: vi
  text: 'Ngày hôm sau, Yahweh thực hiện điều ấy: toàn bộ gia súc của Ai Cập đều chết; nhưng trong số gia súc của dân Israel[a], không một con nào chết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “các con trai của Israel,” một cách gọi dân Israel.'
    reason: Giải thích hình thức sát chữ và chức năng chỉ toàn thể cộng đồng của בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời bằng dạng chuyển tự quen dùng, thay vì thay thế bằng một tước hiệu.
- source_word: וַיַּעַשׂ ... אֶת־הַדָּבָר הַזֶּה
  choice: thực hiện điều ấy
  rationale: Diễn đạt tự nhiên thành ngữ עשה + דבר, đồng thời vẫn giữ ý Yahweh làm cho điều đã phán xảy ra.
- source_word: מִמָּחֳרָת
  choice: Ngày hôm sau
  rationale: Chỉ ngày kế tiếp và được đưa lên đầu câu cho tự nhiên trong tiếng Việt.
- source_word: כֹּל מִקְנֵה מִצְרַיִם
  choice: toàn bộ gia súc của Ai Cập
  rationale: מִקְנֶה bao quát các loài vật nuôi theo đàn, không chỉ riêng bò; cụm sở hữu vẫn giữ được khả năng chỉ gia súc thuộc về người Ai Cập nói chung.
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל
  choice: nhưng trong số gia súc của dân Israel
  rationale: “Trong số” thể hiện giới từ מִן trước lời phủ định; “dân Israel” là cách gọi cộng đồng tự nhiên trong tiếng Việt.
- source_word: לֹא מֵת אֶחָד
  choice: không một con nào chết
  rationale: Bổ sung loại từ “con” theo ngữ cảnh gia súc, truyền đạt rõ sắc thái nhấn mạnh rằng không có dù chỉ một con chết.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; giữ danh riêng tránh biến nó thành một tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  alternative: các con trai của Israel / con cháu Israel
  rationale: Trong ngữ cảnh này, cụm từ là tên gọi cộng đồng Israel chứ không chỉ những người nam hay các con trai trực tiếp của tổ phụ Israel. Chú thích bảo tồn hình thức sát chữ.
- issue: Phạm vi của כֹּל מִקְנֵה מִצְרַיִם
  choice: toàn bộ gia súc của Ai Cập
  alternative: mọi gia súc của người Ai Cập
  rationale: Giữ cách nói tuyệt đối của câu Hê-bơ-rơ, không tự ý điều hòa với những lần nhắc đến gia súc Ai Cập trong các tai họa tiếp theo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm nối hành động của Yahweh với nội dung sự việc; dấu chấm phẩy làm nổi bật sự tương phản giữa gia súc Ai Cập và gia súc Israel. Không làm nhẹ đi chữ “toàn bộ” trong nguyên văn.
