  terminology: “Yahweh” nhất quán với quyết định chuyển tự danh יהוה. “Gia súc” bao quát đúng מִקְנֶה hơn cách hiểu hẹp là chỉ bò. “Dân Israel” là cách gọi cộng đồng tự nhiên; chú thích [a] minh định hình thức Hê-bơ-rơ “các con trai của Israel” và chức năng dân tộc danh của cụm này.
