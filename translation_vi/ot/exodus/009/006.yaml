  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của nguyên văn: Yahweh làm điều này vào ngày hôm sau; toàn bộ gia súc của Ai Cập chết; còn gia súc thuộc dân Israel thì không một con nào chết. Cụm “trong số gia súc của dân Israel” diễn đạt tự nhiên chức năng của מִן trong cấu trúc phủ định mà không thêm ý nghĩa.'
