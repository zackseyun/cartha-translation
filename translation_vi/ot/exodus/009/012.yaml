base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: vi
  text: Nhưng Đức Giê-hô-va làm cho lòng Pha-ra-ôn cứng lại[a], và ông không nghe họ, đúng như Đức Giê-hô-va đã phán với Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho lòng Pha-ra-ôn vững chắc” hoặc “làm mạnh lòng Pha-ra-ôn.” Động từ Hê-bơ-rơ theo nghĩa sát chữ là “làm mạnh, làm vững chắc”; trong văn cảnh này, từ ấy nói đến sự chống cự ngoan cố của Pha-ra-ôn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: làm cho… cứng lại
  rationale: Động từ חזק có nghĩa căn bản là làm mạnh hoặc làm vững chắc; khi đi với “lòng” trong mạch truyện này, nó diễn tả sự ngoan cố, chống cự. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ nguyên tác động trực tiếp của Đức Giê-hô-va.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng danh riêng quen thuộc trong tiếng Việt để biểu đạt Danh Thánh יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: לֵב פַּרְעֹה
  choice: lòng Pha-ra-ôn
  rationale: “Lòng” giữ hình ảnh nhân học của tiếng Hê-bơ-rơ, chỉ trung tâm ý chí và khuynh hướng nội tâm, mà không diễn giải thêm trong chính văn.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: nên ông không nghe họ
  rationale: שׁמע với אֶל có nghĩa là nghe hoặc lưu tâm đến. “Không nghe họ” giữ đại từ của nguyên văn và không diễn giải quá mức thành “không vâng lời”.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: đúng như Đức Giê-hô-va đã phán với Môi-se
  rationale: “Đúng như” thể hiện quan hệ đối chiếu và ứng nghiệm của כַּאֲשֶׁר; “đã phán” cho thấy lời này có trước sự việc đang thuật lại.
theological_decisions:
- issue: Tác động của Đức Chúa Trời trong việc lòng Pha-ra-ôn trở nên cứng cỏi
  choice: Đức Giê-hô-va làm cho lòng Pha-ra-ôn cứng lại
  alternative: Đức Giê-hô-va làm cho lòng Pha-ra-ôn vững chắc / làm mạnh lòng Pha-ra-ôn
  rationale: Nguyên văn nêu rõ יהוה là chủ thể và lòng Pha-ra-ôn là đối tượng của hành động. Bản dịch không làm nhẹ tác động trực tiếp ấy thành việc Đức Chúa Trời chỉ cho phép, đồng thời ghi chú các nghĩa sát chữ của חזק để giữ sự căng thẳng thần học và sắc thái từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ danh riêng Đức Giê-hô-va, các tên riêng quen thuộc Pha-ra-ôn và Môi-se, cùng đại từ “họ” như nguyên văn. Liên từ “nên” thể hiện diễn tiến hệ quả tự nhiên của וְ trong câu.
