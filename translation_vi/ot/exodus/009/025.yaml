revisions:
- from: Mưa đá giáng xuống khắp đất Ai Cập, đánh mọi vật ở ngoài đồng, từ người cho đến súc vật. Mưa đá đánh nát mọi cây cỏ ngoài đồng và bẻ gãy mọi cây thân gỗ ngoài đồng.
  to: Mưa đá đánh mọi vật ngoài đồng trên khắp đất Ai Cập, từ người đến súc vật. Mưa đá đánh mọi cây cỏ ngoài đồng và bẻ gãy mọi cây ngoài đồng.
  rationale: Bản sửa phục hồi nhất quán hai lần động từ נכה bằng «đánh», giữ động từ mạnh «bẻ gãy» cho שִׁבֵּר, và duy trì các phạm vi «khắp đất Ai Cập», «mọi vật ngoài đồng», «từ người đến súc vật» theo nguyên ngữ. Không thêm chi tiết diễn giải hay chú thích không cần thiết.
