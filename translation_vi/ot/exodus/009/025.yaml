base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: vi
  text: Mưa đá đánh mọi vật ngoài đồng trên khắp đất Ai Cập, từ người đến súc vật. Mưa đá đánh mọi cây cỏ ngoài đồng và bẻ gãy mọi cây ngoài đồng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: giáng xuống / đánh nát
  rationale: Hai dạng của נכה đều diễn tả việc đánh phá. Trong tiếng Việt, thay đổi cách diễn đạt theo bổ ngữ giúp câu tự nhiên mà vẫn giữ sức mạnh của sự hủy diệt.
- source_word: הַבָּרָד
  choice: mưa đá
  rationale: Cách gọi thông dụng và chính xác cho hiện tượng thời tiết này; được lặp lại như trong nguyên văn để nhấn mạnh.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: khắp đất Ai Cập
  rationale: Diễn đạt tự nhiên ý phân bố trên toàn lãnh thổ.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: mọi vật ở ngoài đồng
  rationale: Giữ tính bao quát của כָּל אֲשֶׁר và bối cảnh đồng ruộng; “ngoài đồng” cũng làm rõ sự đối lập ngầm với nơi có mái che.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: từ người cho đến súc vật
  rationale: Giữ cấu trúc chỉ toàn bộ phạm vi từ con người đến loài vật; “người” là cách hiện đại, tự nhiên để chỉ loài người trong ngữ cảnh này, còn בְּהֵמָה ở đây phù hợp với “súc vật”.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: mọi cây cỏ ngoài đồng
  rationale: עֵשֶׂב chỉ cỏ, cây xanh hoặc thảm thực vật thấp; “cây cỏ” dễ hiểu và đủ rộng trong tiếng Việt.
- source_word: עֵץ הַשָּׂדֶה
  choice: mọi cây thân gỗ ngoài đồng
  rationale: Phân biệt עֵץ với עֵשֶׂב đã nhắc ngay trước đó. “Cây thân gỗ” chính xác hơn “cây” đơn thuần, vì tiếng Việt có thể gọi cả cây cỏ là “cây”.
- source_word: שִׁבֵּר
  choice: bẻ gãy
  rationale: Dạng Piel diễn tả sự phá gãy mạnh; “bẻ gãy” tự nhiên khi nói mưa đá làm gãy cây và cành.
theological_decisions:
- issue: Cách dịch אָדָם trong thành ngữ chỉ phạm vi người-vật
  choice: người
  alternative: loài người; con người
  rationale: Ở đây אָדָם mang nghĩa tập thể, đối ứng với בְּהֵמָה, chứ không xác định riêng nam giới. “Người” bảo toàn phạm vi đại diện và phù hợp tiếng Việt hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại của “mưa đá” và “ngoài đồng” để phản ánh nhịp điệu nhấn mạnh của nguyên văn; không thêm chú thích vì tiếng Việt không cần nêu biến thể giới tính như tiếng Anh.
