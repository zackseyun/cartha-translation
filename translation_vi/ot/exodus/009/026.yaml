  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: vi
  text: Chỉ tại xứ Gô-sen, nơi con cái Israel ở, mới không có mưa đá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Chỉ riêng
  rationale: Diễn đạt rõ ý hạn định và loại trừ được đặt ở đầu câu trong tiếng Hê-bơ-rơ, đồng thời tự nhiên trong tiếng Việt.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: tại xứ Gô-sen
  rationale: Giữ danh từ chỉ vùng đất và phiên âm địa danh; “tại” phù hợp với ý chỉ địa điểm trong câu.
- source_word: אֲשֶׁר שָׁם
  choice: nơi ... ở
  rationale: Chuyển cụm quan hệ chỉ địa điểm thành cách nói tiếng Việt rõ ràng, không thêm ý ngoài nguyên văn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Đây là cách gọi tập thể tự nhiên, trang trọng trong tiếng Việt dành cho người Israel; chú thích bảo lưu hình thức sát chữ “các con trai của Israel” và nêu các cách dịch khác.
- source_word: לֹא הָיָה
  choice: không có
  rationale: Phản ánh cách dùng hiện hữu của động từ היה dưới dạng phủ định, chỉ sự vắng mặt của mưa đá.
- source_word: בָּרָד
  choice: mưa đá
  rationale: Từ tiếng Việt thông dụng và chính xác cho hiện tượng thời tiết trong nguyên văn.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai của Israel; con cái Israel; người Israel
  rationale: Nguyên ngữ dùng một thành ngữ gia tộc giống đực, sát chữ là “các con trai của Israel”, nhưng trong ngữ cảnh này thành ngữ chỉ cộng đồng người Israel. “Con dân Israel” truyền đạt nghĩa tập thể bằng tiếng Việt tự nhiên mà không biến nhóm người thành chỉ nam giới; chú thích bảo lưu cấu trúc nguyên ngữ và sự lựa chọn từ ngữ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “Chỉ riêng ... là không có” giữ trọng tâm hạn định của nguyên văn; “xứ” phù hợp với địa danh Gô-sen trong bối cảnh cổ đại.
