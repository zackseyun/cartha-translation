base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: vi
  text: Ngươi phải làm năm mươi vòng khuy trên một tấm màn, và làm năm mươi vòng khuy ở mép tấm màn thuộc bộ màn thứ hai; các vòng khuy phải đối diện với nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “một [người nữ] đối với chị/em gái mình.” Đây là thành ngữ Hê-bơ-rơ chỉ các vòng khuy tương ứng được đặt đối diện, thẳng hàng với nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: vòng khuy
  rationale: Danh từ này chỉ những vòng bằng vật liệu dệt dùng để nối các tấm màn. “Vòng khuy” phân biệt rõ với các móc bằng vàng ở câu kế tiếp.
- source_word: יְרִיעָה
  choice: tấm màn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ một tấm vải lớn thuộc lớp màn phủ; “tấm màn” vừa tự nhiên vừa giúp người đọc hình dung đây là một đơn vị riêng lẻ.
- source_word: הָאֶחָת
  choice: một
  rationale: Tiếng Hê-bơ-rơ nói “tấm màn [mà là] một,” dùng để phân biệt với tấm tương ứng; “một” tránh thêm ý thứ tự “thứ nhất” vốn không được nói rõ.
- source_word: קְצֵה
  choice: mép
  rationale: Trong ngữ cảnh gắn các vòng để nối màn, “mép” diễn đạt chính xác phần rìa của tấm vải hơn “đầu” hay “tận cùng”.
- source_word: מַחְבֶּרֶת
  choice: bộ
  rationale: Từ này ở đây chỉ nhóm màn đã được kết lại thành một đơn vị. “Bộ” ngắn gọn, tự nhiên và phù hợp với ngữ cảnh của các câu xung quanh.
- source_word: הַשֵּׁנִית
  choice: thứ hai
  rationale: Cách dịch trực tiếp, xác định nhóm màn thứ hai.
- source_word: מַקְבִּילֹת
  choice: phải đối diện
  rationale: Từ này diễn tả sự bố trí tương ứng, thẳng hàng ở hai phía để có thể nối lại; “đối diện” giữ được sắc thái không gian.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: nhau
  rationale: Đây là thành ngữ Hê-bơ-rơ, theo nghĩa đen là “một người nữ hướng về chị/em gái mình,” dùng cho các vật tương ứng từng đôi. “Nhau” chuyển tải ý thành ngữ tự nhiên, còn hình ảnh nguyên văn được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và trực tiếp. Đại từ “ngươi” giữ giọng mệnh lệnh giao ước trong lời Đức Chúa Trời phán với Môi-se. Thuật ngữ kỹ thuật “vòng khuy” được chọn để người đọc không nhầm với các móc kim loại ở câu sau.
