  terminology: “Tấm màn,” “vòng khuy,” “mép,” và “bộ màn” nhất quán với ngữ cảnh cấu trúc Đền Tạm. Không nên đổi “một” thành “thứ nhất,” vì bản gốc không xác định thứ tự tại vị trí này.
