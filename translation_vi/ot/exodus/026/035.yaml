  source_fidelity: 'Nội dung chính phản ánh đúng tiếng Hê-bơ-rơ: bàn ở ngoài bức màn; chân đèn đối diện bàn ở phía nam Đền Tạm; bàn ở phía bắc. Tuy nhiên, chú thích b hiện được neo vào “Đền Tạm” và giải thích mishkan, trong khi chú thích tương ứng của bản audit tiếng Anh giải thích הַמְּנֹרָה (“chân đèn”).'
