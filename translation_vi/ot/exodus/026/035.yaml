base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: vi
  text: Ngươi hãy đặt bàn ở bên ngoài bức màn[a], và đặt chân đèn[b] đối diện với bàn, ở phía nam của Đền Tạm; còn bàn thì ngươi hãy đặt ở phía bắc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm rèm”. Từ Hê-bơ-rơ פָּרֹכֶת chỉ bức màn ngăn cách bên trong Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: menorah. Dịch là “chân đèn” để diễn đạt nghĩa của từ này thay vì phiên âm.'
    reason: cultural_note
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: hãy đặt
  rationale: Động từ שׂוּם có nghĩa là đặt, để hoặc bố trí; “hãy đặt” diễn đạt tự nhiên một chỉ thị trong tiếng Việt.
- source_word: הַשֻּׁלְחָן
  choice: cái bàn
  rationale: Danh từ chỉ đơn giản là “bàn”; không thêm “bánh hiện diện” vì cụm ấy không có trong câu này.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: ở bên ngoài bức màn
  rationale: מִחוּץ chỉ vị trí bên ngoài, còn פָּרֹכֶת là bức màn ngăn bên trong Đền Tạm.
- source_word: הַמְּנֹרָה
  choice: chân đèn
  rationale: Dịch nghĩa danh từ thay vì phiên âm; “chân đèn” chỉ giá đỡ các ngọn đèn và phù hợp với văn cảnh thờ phượng.
- source_word: נֹכַח
  choice: đối diện với
  rationale: Từ này diễn tả vị trí ở phía đối diện hoặc hướng mặt về một vật khác.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: ở phía nam của Đền Tạm
  rationale: צֶלַע là bên hoặc phía, תֵּימָנָה chỉ hướng nam; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: תִּתֵּן
  choice: hãy đặt
  rationale: Trong ngữ cảnh sắp xếp đồ dùng, נָתַן mang nghĩa đặt hoặc để; lặp lại “hãy đặt” giữ rõ cấu trúc chỉ thị.
- source_word: עַל צֶלַע צָפוֹן
  choice: ở phía bắc
  rationale: Cụm từ xác định phía bắc của Đền Tạm; đối tượng được lược theo cách tự nhiên vì đã nêu ngay trước đó.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ngươi” để giữ lời truyền trực tiếp ở số ít; dùng “Đền Tạm” như thuật ngữ quen thuộc cho הַמִּשְׁכָּן. Cấu trúc đảo nhẹ “cái bàn, ngươi hãy đặt” phản ánh sự nhấn mạnh của nguyên văn mà vẫn tự nhiên.
