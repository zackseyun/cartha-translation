  terminology: “bức màn,” “Đền Tạm,” và “chân đèn” đều phù hợp ngữ cảnh. Chú thích về מְנוֹרָה cần được đặt đúng sau “chân đèn”; không nên thêm chú thích về mishkan khi bản văn tiếng Anh không có chú thích ấy.
