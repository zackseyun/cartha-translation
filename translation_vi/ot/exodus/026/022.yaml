  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: vi
  text: Còn ở phía sau Đền Tạm, về hướng tây, con phải làm sáu tấm ván.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sáu khung”, nếu hiểu các cấu kiện này là những khung hở chứ không phải các tấm ván đặc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Về phía sau của
  rationale: Dạng danh từ số nhiều ở trạng thái liên kết, đi với giới từ, chỉ phần cuối hay mặt sau của công trình; “phía sau” tự nhiên và chính xác trong ngữ cảnh kiến trúc.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ quen thuộc trong tiếng Việt để chỉ cấu trúc thánh được dựng lên theo chỉ dẫn trong Xuất Ai Cập, đồng thời truyền đạt tính chất nơi ngự tạm thời.
- source_word: יָמָּה
  choice: ở hướng tây
  rationale: Từ này nguyên nghĩa là “về phía biển” và trong cách định hướng của Kinh Thánh thường chỉ phía tây; ở đây nó xác định vị trí mặt sau của Đền Tạm.
- source_word: תַּעֲשֶׂה
  choice: con phải làm
  rationale: Động từ Qal chưa hoàn thành ngôi hai số ít mang lực chỉ thị trong chuỗi hướng dẫn. “Phải làm” diễn đạt mệnh lệnh rõ ràng; “con” phù hợp lời Đức Chúa Trời trực tiếp phán với Môi-se.
- source_word: שִׁשָּׁה
  choice: sáu
  rationale: Số từ chỉ số lượng, bổ nghĩa trực tiếp cho các cấu kiện theo sau.
- source_word: קְרָשִׁים
  choice: tấm ván
  rationale: Chỉ các cấu kiện gỗ tạo thành vách Đền Tạm. “Tấm ván” là cách gọi tự nhiên, truyền thống và không khẳng định quá mức về cấu tạo đặc hay dạng khung.
theological_decisions: []
