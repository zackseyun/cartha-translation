  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: vi
  text: Mỗi tấm ván phải có hai mộng được liên kết với nhau.[a] Ngươi phải làm mọi tấm ván của Đền Tạm theo cách ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dịch sát là: “hai tay cho mỗi tấm ván, được ghép, một người nữ với chị em mình.” Ở đây, “tay” chỉ các phần nhô ra của tấm ván, tức các mộng; còn “một người nữ với chị em mình” là thành ngữ nói về hai phần tương ứng với nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: mộng
  rationale: Nghĩa đen là “tay”, nhưng trong ngữ cảnh kết cấu gỗ chỉ phần nhô ra để lắp vào đế; “mộng” là thuật ngữ tiếng Việt tự nhiên và chính xác.
- source_word: מְשֻׁלָּבֹת
  choice: khớp với nhau
  rationale: Diễn tả hai phần mộng được bố trí tương ứng hoặc liên kết với nhau, nhưng không xác định quá mức cơ chế cụ thể.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: với nhau
  rationale: Thành ngữ Hê-bơ-rơ, nghĩa đen “một người nữ với chị em mình”, diễn tả hai bộ phận tương ứng từng đôi; bản dịch tự nhiên giữ được quan hệ ấy.
- source_word: קֶרֶשׁ
  choice: tấm ván
  rationale: Chỉ cấu kiện gỗ dựng đứng của Đền Tạm; “tấm ván” rõ nghĩa mà không diễn giải thành một kiểu khung cụ thể.
- source_word: מִשְׁכָּן
  choice: Đền Tạm
  rationale: Trong sách Xuất Hành, từ này là tên gọi quen thuộc của nơi thánh lưu động, dù nghĩa gốc liên quan đến nơi cư ngụ.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Ngươi phải làm ... theo cách ấy
  rationale: Giữ lực mệnh lệnh của động từ và diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: שְׁתֵּי
  choice: hai
  rationale: Số từ trực tiếp bổ nghĩa cho các mộng.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: Mỗi tấm ván
  rationale: Hình thức sát chữ là “cho tấm ván duy nhất”, nhưng trong ngữ cảnh mang nghĩa phân phối, áp dụng cho từng tấm ván.
theological_decisions: []
