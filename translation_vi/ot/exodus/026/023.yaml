  terminology: “Tấm ván” và “Đền Tạm” là các thuật ngữ phù hợp, nhất quán với ngữ cảnh Xuất Hành. “Các góc” giữ được sự dè dặt cần thiết đối với thuật ngữ kiến trúc מְקֻצְעֹת.
