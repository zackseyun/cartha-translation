translation:
  language: vi
  text: Hãy làm hai tấm ván cho các góc của Đền Tạm ở phía sau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “làm hai tấm ván cho các chi tiết ở góc của Đền Tạm, tại hai đầu phía sau.” Các thuật ngữ Hê-bơ-rơ ở đây mang tính kiến trúc và phần nào có tính kỹ thuật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: hai
  rationale: Dạng số đếm liên kết mở đầu hạng mục tiếp theo; tiếng Việt không cần dịch riêng liên từ וּ khi câu mệnh lệnh nối tiếp đã rõ trong văn cảnh.
- source_word: קְרָשִׁים
  choice: tấm ván
  rationale: Trong phần mô tả việc dựng Đền Tạm, từ này chỉ những cấu kiện gỗ tạo thành vách; “tấm ván” vừa quen thuộc vừa không diễn giải quá mức như “khung”.
- source_word: תַּעֲשֶׂה
  choice: Hãy làm
  rationale: Thể vị hoàn ngôi hai số ít mang lực chỉ thị trong văn bản hướng dẫn; mệnh lệnh với “hãy” tự nhiên trong tiếng Việt và vẫn giữ đối tượng được truyền lệnh ở ngôi hai.
- source_word: לִ/מְקֻצְעֹת
  choice: cho các góc
  rationale: Danh từ chỉ các góc hoặc chỗ nối tạo góc. Cách dịch này rõ nghĩa nhưng không áp đặt nghĩa kỹ thuật cụ thể là “miếng góc”.
- source_word: הַ/מִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là cách gọi quen thuộc trong tiếng Việt đối với nơi thánh lưu động trong sách Xuất Hành, đồng thời truyền đạt chức năng nơi Đức Chúa Trời ngự giữa dân.
- source_word: בַּ/יַּרְכָתָיִם
  choice: ở phía sau
  rationale: Dạng đôi chỉ hai phần hoặc hai đầu mút phía sau. Vì vế trước đã nói đến các góc, “ở phía sau” tránh lặp từ mà vẫn xác định vị trí; sắc thái dạng đôi được nêu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại. Dùng “Hãy làm” thay cho đại từ xưng hô dễ mang sắc thái cổ hoặc hàm ý quan hệ không có trong câu Hê-bơ-rơ; giữ cách diễn đạt kiến trúc dễ hiểu và chú thích điểm chưa chắc chắn.
