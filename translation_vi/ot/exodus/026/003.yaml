translation:
  language: vi
  text: Năm tấm màn sẽ được nối với nhau[a], và năm tấm màn sẽ được nối với nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “mỗi người nữ với chị/em gái mình”, một thành ngữ chỉ những vật cùng loại, tương ứng được nối với nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: tấm màn
  rationale: Trong chỉ dẫn dựng Đền Tạm, từ này chỉ những tấm vải lớn dùng làm màn phủ; “tấm màn” vừa tự nhiên vừa phù hợp bối cảnh kiến trúc.
- source_word: תִּהְיֶיןָ חֹבְרֹת
  choice: sẽ được nối
  rationale: Dạng vị hoàn thành của היה kết hợp với phân từ חֹבְרֹת mang ý chỉ thị về cách các tấm màn phải ở trong trạng thái nối liền; “sẽ được nối” giữ được sắc thái quy định và cấu trúc bị động tự nhiên trong tiếng Việt.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: với nhau
  rationale: Nghĩa đen là “một người nữ với chị/em gái mình”, nhưng đây là thành ngữ chỉ các vật giống nhau được ghép tương ứng với nhau. “Với nhau” truyền đạt đúng ý trong tiếng Việt hiện đại.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: Năm ... và năm ... kia cũng
  rationale: Câu chia mười tấm màn thành hai nhóm, mỗi nhóm năm tấm. “Kia cũng” làm rõ nhóm thứ hai và sự lặp lại của cùng một thao tác, dù các từ này được hàm ý hơn là được nêu riêng trong tiếng Hê-bơ-rơ.
