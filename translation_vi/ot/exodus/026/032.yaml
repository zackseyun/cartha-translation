  text: וְ/נָתַתָּ֣ה אֹתָ֗/הּ עַל אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים מְצֻפִּ֣ים זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב עַל אַרְבָּעָ֖ה אַדְנֵי כָֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: vi
  text: Hãy treo bức màn ấy trên bốn trụ gỗ keo bọc vàng, có móc bằng vàng, dựng trên bốn đế bạc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bốn ổ trụ bằng bạc.”
    reason: אַדְנִים có thể chỉ các đế đỡ nói chung hoặc cụ thể hơn là những ổ lắp giữ chân trụ.
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Hãy treo
  rationale: Động từ נתן có nghĩa rộng là đặt/để, nhưng với bức màn và các trụ trong ngữ cảnh này, “treo” diễn đạt tự nhiên và chính xác hành động được nói đến.
- source_word: אֹתָהּ
  choice: bức màn ấy
  rationale: Đại từ giống cái số ít chỉ lại bức màn ở câu trước; nhắc lại danh từ giúp câu tiếng Việt rõ nghĩa hơn.
- source_word: עַל אַרְבָּעָה עַמּוּדֵי
  choice: trên bốn trụ
  rationale: Giữ quan hệ không gian của עַל và dùng “trụ” cho עמוד, một bộ phận nâng đỡ thẳng đứng.
- source_word: שִׁטִּים
  choice: gỗ keo
  rationale: Chỉ loại gỗ acacia dùng trong việc dựng Đền Tạm; “gỗ keo” là cách gọi tự nhiên trong tiếng Việt.
- source_word: מְצֻפִּים זָהָב
  choice: bọc vàng
  rationale: Phân từ bị động của צפה mô tả các trụ được phủ một lớp vàng; “bọc vàng” ngắn gọn và phù hợp với vật liệu Đền Tạm.
- source_word: וָוֵיהֶם
  choice: các móc của chúng
  rationale: וָוִים là các móc gắn với trụ để treo màn; đại từ số nhiều quy chiếu về bốn trụ.
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: Các trụ đặt trên bốn đế bằng bạc
  rationale: אַדְנִים là các bộ phận đỡ hoặc ổ lắp ở chân trụ. Bổ sung chủ ngữ “các trụ” trong câu tiếng Việt để làm rõ quan hệ cấu trúc vốn hàm chứa trong tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng tự nhiên, dùng thuật ngữ kiến trúc phổ thông. Tách thành hai câu để tránh chuỗi bổ nghĩa nặng nề và làm rõ rằng bốn trụ đứng trên bốn đế. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
