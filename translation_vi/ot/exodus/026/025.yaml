  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ tính kỹ thuật của chỉ dẫn dựng Đền Tạm. Dấu chấm phẩy làm rõ rằng mười sáu đế được phân bổ hai đế cho mỗi khung.
