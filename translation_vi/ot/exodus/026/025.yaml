  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố của nguyên văn Hê-bơ-rơ: tám khung, các đế bằng bạc của chúng, tổng số mười sáu đế, và sự phân bổ hai đế dưới mỗi trong hai khung được nêu. Cách đối ứng “một khung ... khung kia” chuyển tải hợp lý lối lặp phân phối của הַקֶּרֶשׁ הָאֶחָד mà không thêm ý về thứ tự.'
