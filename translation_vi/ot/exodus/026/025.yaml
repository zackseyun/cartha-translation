  terminology: “Khung” là lựa chọn phù hợp cho קְרָשִׁים trong ngữ cảnh các cấu kiện đứng của Đền Tạm; chú thích “tấm ván” bảo lưu lựa chọn từ vựng khác. “Đế” diễn đạt tốt אַדָנִים là bộ phận đỡ bên dưới, còn chú thích “ổ đỡ” bảo lưu sắc thái “socket” mà không khẳng định quá mức về cấu tạo.
