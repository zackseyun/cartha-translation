base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/025.yaml
  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: vi
  text: 'Sẽ có tám khung[a], cùng các đế bằng bạc của chúng: mười sáu đế[b]; hai đế dưới một khung và hai đế dưới khung kia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm ván”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ổ đỡ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  choice: khung
  rationale: Trong ngữ cảnh dựng Đền Tạm, từ này chỉ các bộ phận đứng chịu lực. “Khung” diễn đạt tự nhiên chức năng kết cấu; “tấm ván” vẫn là một khả năng từ vựng nên được ghi ở chú thích.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: đế
  rationale: Danh từ chỉ các bộ phận nâng đỡ ở dưới khung. “Đế” rõ nghĩa và thông dụng trong tiếng Việt hiện đại; “ổ đỡ” là cách hiểu thiên về cấu tạo lắp ghép.
- source_word: כֶּסֶף
  choice: bạc
  rationale: Chỉ trực tiếp vật liệu làm các đế.
- source_word: שִׁשָּׁה עָשָׂר
  choice: mười sáu
  rationale: Cách diễn đạt số đếm tiêu chuẩn trong tiếng Việt.
- source_word: תַּחַת
  choice: dưới
  rationale: Diễn đạt trực tiếp quan hệ không gian trong chỉ dẫn xây dựng.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: một khung ... khung kia
  rationale: Nguyên văn lặp lại cụm “một khung” theo lối phân phối. “Một khung ... khung kia” giữ cấu trúc đối ứng mà vẫn tự nhiên, không hàm ý thứ tự.
- source_word: וְהָיוּ
  choice: Sẽ có
  rationale: Cách diễn đạt hiện hữu tự nhiên trong một bản liệt kê quy cách; liên từ mở đầu không cần tách riêng thành “và” trong tiếng Việt.
