base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: vi
  text: Ngươi phải dát vàng các khung[a], làm các vòng của chúng bằng vàng để giữ các thanh ngang[b], và dát vàng các thanh ngang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tấm ván”; từ Hê-bơ-rơ chỉ những bộ phận dựng đứng trong kết cấu Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dịch sát là “những ngôi nhà cho các thanh”, nghĩa là những chỗ tiếp nhận hoặc giữ các thanh ngang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: các khung
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ những bộ phận dựng đứng của kết cấu. “Các khung” diễn đạt tự nhiên chức năng kết cấu; cũng có thể hiểu là “các tấm ván”.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: dát
  rationale: Động từ ở thể piel chỉ việc phủ một lớp vật liệu lên bề mặt; “dát vàng” là cách nói tự nhiên, chính xác trong ngữ cảnh chế tác.
- source_word: זָהָב
  choice: vàng
  rationale: Tên vật liệu rõ nghĩa. Bản dịch giữ cả ba lần xuất hiện theo nguyên văn Hê-bơ-rơ.
- source_word: טַבְּעֹתֵיהֶם
  choice: các vòng của chúng
  rationale: טַבַּעַת chỉ các vòng kim loại gắn vào những bộ phận kết cấu.
- source_word: תַּעֲשֶׂה
  choice: làm
  rationale: Cách dịch trực tiếp và tự nhiên của động từ עשה trong mệnh lệnh chế tác này.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: để giữ các thanh ngang
  rationale: Cụm từ có nghĩa đen là “những ngôi nhà cho các thanh”, tức các bộ phận tiếp nhận hoặc giữ thanh. Cách dịch theo chức năng giúp câu tiếng Việt rõ ràng.
- source_word: הַבְּרִיחִם
  choice: các thanh ngang
  rationale: בְּרִיחַ chỉ những thanh dùng để liên kết các khung. “Thanh ngang” làm rõ vị trí và chức năng trong kết cấu mà không thêm ý nghĩa thần học.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Dùng “ngươi” để phù hợp lời chỉ dẫn trực tiếp trong ngữ cảnh Xuất Hành; dùng thuật ngữ chế tác phổ thông “dát vàng” và “thanh ngang” để người đọc hiện đại dễ hiểu.
