  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: vi
  text: Ngươi phải làm các vòng màu xanh lam[a] trên mép tấm màn ở đầu bộ màn ghép thứ nhất[b]; cũng hãy làm như vậy trên mép tấm màn ở ngoài cùng[c] của bộ màn ghép thứ hai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xanh” hoặc “xanh tím”; từ Hê-bơ-rơ תְּכֵלֶת chỉ chất liệu nhuộm màu xanh đặc trưng được dùng trong Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Các từ Hê-bơ-rơ חֹבָרֶת và מַחְבֶּרֶת chỉ một nhóm tấm màn được nối lại thành một đơn vị; cũng có thể dịch là “phần màn ghép lại” hoặc “bộ màn được nối lại”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “ở đầu mút” hoặc “ở tận cùng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: các vòng
  rationale: Danh từ chỉ những vòng dùng để liên kết các tấm màn; “các vòng” tự nhiên và đủ rõ trong ngữ cảnh may dệt.
- source_word: תְּכֵלֶת
  choice: chỉ xanh lam
  rationale: Từ này chỉ chất liệu nhuộm màu xanh lam đặc trưng dùng trong Đền Tạm. Thêm “chỉ” làm rõ vật liệu tạo nên các vòng, nhưng không thu hẹp sắc màu thành tím.
- source_word: שְׂפַת
  choice: dọc theo mép
  rationale: Trong ngữ cảnh vải vóc, đây là cách diễn đạt tự nhiên cho phần rìa của tấm màn.
- source_word: יְרִיעָה
  choice: tấm màn
  rationale: Chỉ từng tấm vải cấu thành nơi cư ngụ; “tấm màn” vừa thông dụng vừa phù hợp ngữ cảnh.
- source_word: הָאֶחָת ... מִקָּצָה בַּחֹבָרֶת
  choice: tấm màn ở ngoài cùng của bộ màn thứ nhất
  rationale: Cụm Hê-bơ-rơ định vị một tấm màn tại đầu mút của nhóm đã ghép. Dịch theo chức năng và quan hệ không gian giúp tiếng Việt rõ ràng; “thứ nhất” được suy ra từ sự đối ứng với “thứ hai” ở vế sau.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: bộ màn
  rationale: Hai danh từ cùng chỉ một nhóm tấm màn được kết lại thành một đơn vị. “Bộ màn” ngắn gọn, tự nhiên; chú thích giữ nghĩa ghép nối.
- source_word: וְכֵן תַּעֲשֶׂה
  choice: cũng hãy làm như vậy
  rationale: Truyền đạt trực tiếp mệnh lệnh thực hiện tương ứng ở bộ màn kia.
- source_word: הַקִּיצוֹנָה
  choice: ở ngoài cùng
  rationale: Diễn tả vị trí tận cùng hoặc ngoài cùng của tấm màn trong bộ.
- source_word: הַשֵּׁנִית
  choice: thứ hai
  rationale: Xác định rõ bộ thứ hai trong hai bộ màn.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Dùng “ngươi” để giữ lối xưng hô số ít trong lời Đức Chúa Trời phán với Môi-se. Câu được tái cấu trúc nhẹ theo cú pháp tiếng Việt để làm rõ rằng các vòng nằm trên hai mép đối diện của hai bộ màn, đồng thời các chú thích bảo lưu những khả năng từ vựng của nguyên văn.
