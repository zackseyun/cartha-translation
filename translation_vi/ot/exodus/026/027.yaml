  to: và năm thanh ngang cho các tấm ván ở cạnh thứ hai[a] của Đền Tạm, và năm thanh ngang cho các tấm ván ở cạnh phía sau của Đền Tạm, về phía tây.[b]
  rationale: Sửa “mặt” thành “cạnh” để phù hợp hơn với thuật ngữ kiến trúc trong ngữ cảnh và để chính văn cùng chú thích nhất quán. Phục hồi “và năm” ở vế thứ hai nhằm giữ rõ phép phối hợp lặp lại của tiếng Hê-bơ-rơ. Không thay đổi nghĩa hay thêm diễn giải.
