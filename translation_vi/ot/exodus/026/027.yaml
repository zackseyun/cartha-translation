  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: vi
  text: và năm thanh ngang cho các tấm ván ở cạnh thứ hai[a] của Đền Tạm, và năm thanh ngang cho các tấm ván ở cạnh phía sau của Đền Tạm, về phía tây.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cạnh bên kia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “ở phía sau, về hướng tây”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: thanh ngang
  rationale: Trong cấu trúc Đền Tạm, từ này chỉ các thanh nằm ngang dùng để liên kết những tấm ván; “thanh ngang” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: קַרְשֵׁי
  choice: các tấm ván
  rationale: Chỉ những bộ phận bằng gỗ tạo thành kết cấu Đền Tạm; “tấm ván” giữ được tính cụ thể mà không diễn giải quá mức thành khung.
- source_word: צֶלַע
  choice: mặt
  rationale: Trong mô tả kiến trúc, từ này chỉ một bên hay một mặt của công trình; “mặt” phù hợp tự nhiên với Đền Tạm.
- source_word: הַשֵּׁנִית
  choice: thứ hai
  rationale: Giữ sát nghĩa trực tiếp của tiếng Hê-bơ-rơ, đồng thời chú thích cách hiểu theo ngữ cảnh là “mặt bên kia”.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt đối với nơi thánh di động được mô tả trong Xuất Ê-díp-tô Ký.
- source_word: לַיַּרְכָתַיִם
  choice: ở mặt sau
  rationale: Trong ngữ cảnh kiến trúc, từ này chỉ phần tận cùng hay phía sau của Đền Tạm.
- source_word: יָמָּה
  choice: về phía tây
  rationale: Diễn đạt tự nhiên trạng từ chỉ hướng tây; nghĩa từ nguyên “về phía biển” không cần đưa vào chính văn.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: và năm ... cùng năm
  rationale: Bảo tồn cấu trúc liệt kê và sự phối hợp lặp lại của nguyên văn, nhưng dùng “cùng” ở vế sau để câu tiếng Việt bớt nặng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; duy trì cấu trúc liệt kê của chỉ dẫn xây dựng. Các thuật ngữ kiến trúc được diễn đạt cụ thể, không thêm ý nghĩa thần học ngoài nguyên văn.
