translation_notes:
  register: Văn phong chỉ thị trang trọng, hiện đại và dễ hiểu. Dùng “ngươi” để giữ lời truyền trực tiếp ở ngôi hai số ít; dùng thuật ngữ mộc “mộng” vì vừa chính xác vừa quen thuộc trong tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện ngay sau từ ngữ liên quan trong chính văn.
