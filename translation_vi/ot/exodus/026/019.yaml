base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: vi
  text: 'Ngươi phải làm bốn mươi đế bạc[a] dưới hai mươi khung[b]: hai đế dưới một khung, ứng với hai mộng của nó, và hai đế dưới khung kế tiếp, ứng với hai mộng của nó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đế có lỗ mộng bằng bạc”; từ Hê-bơ-rơ có thể chỉ một đế dạng ổ cắm trong cấu trúc Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách dịch truyền thống: “tấm ván”. Từ Hê-bơ-rơ ở đây có lẽ chỉ các cấu kiện đứng tạo nên kết cấu của Đền Tạm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: đế bằng bạc
  rationale: Trong cấu trúc Đền Tạm, אֶדֶן chỉ bộ phận bên dưới dùng để đỡ và tiếp nhận mộng của khung. “Đế” tự nhiên, rõ chức năng trong tiếng Việt; “ổ đế” được ghi ở chú thích để bảo lưu sắc thái hốc tiếp nhận.
- source_word: תַּעֲשֶׂה
  choice: ngươi phải làm
  rationale: Động từ Qal chưa hoàn thành ngôi hai số ít trong lời chỉ dẫn mang lực mệnh lệnh. “Phải làm” diễn đạt rõ tính chỉ thị mà vẫn tự nhiên.
- source_word: תַּחַת
  choice: đặt dưới / dưới
  rationale: Giới từ chỉ vị trí phía dưới. Thêm “đặt” ở lần đầu giúp câu tiếng Việt trôi chảy mà không thay đổi quan hệ không gian.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: khung
  rationale: קֶרֶשׁ ở đây là các cấu kiện đứng của Đền Tạm. “Khung” truyền đạt chức năng kết cấu tốt hơn “tấm ván”, nhưng cách gọi truyền thống được bảo lưu trong chú thích.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: để đỡ hai mộng của nó
  rationale: יָדוֹת, nghĩa đen là “hai tay”, tại đây là thuật ngữ kiến trúc chỉ hai phần nhô ra để lắp vào đế. “Mộng” là thuật ngữ mộc chính xác; “để đỡ” thể hiện quan hệ chức năng của לְ trong ngữ cảnh.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: một khung ... khung kế tiếp
  rationale: Sự lặp lại “một” trong tiếng Hê-bơ-rơ có tính phân phối. Cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy mỗi khung đều có hai đế.
