base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: vi
  text: Ngươi phải làm năm trụ bằng gỗ keo cho màn che lối vào[a], bọc các trụ ấy bằng vàng; các móc của chúng phải bằng vàng; và ngươi phải đúc năm đế bằng đồng[b] cho chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm rèm” hoặc “bức màn”; từ Hê-bơ-rơ ở đây chỉ màn che lối vào, khác với bức màn bên trong ngăn Nơi Chí Thánh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “năm ổ trụ bằng đồng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: bức màn che cửa
  rationale: Trong ngữ cảnh này, từ này chỉ tấm màn ở lối vào Đền Tạm, khác với bức màn bên trong ngăn Nơi Chí Thánh. Cách dịch này vừa tự nhiên trong tiếng Việt vừa nêu rõ chức năng.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: năm trụ bằng gỗ keo
  rationale: עַמּוּדִים là các trụ đỡ, còn שִׁטִּים chỉ loại gỗ thường được gọi là gỗ keo trong các chỉ dẫn về Đền Tạm.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: bọc vàng các trụ ấy
  rationale: Động từ צפה ở đây nói đến việc phủ một lớp kim loại lên vật thể; “bọc vàng” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: וָוֵיהֶם
  choice: các móc của chúng
  rationale: Trong ngữ cảnh Đền Tạm, וָוִים thường chỉ các móc dùng cùng với màn treo; “móc” là nghĩa có khả năng nhất.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: đế bằng đồng
  rationale: אַדָן là bộ phận làm chân hoặc ổ đỡ cho trụ. “Đế” tự nhiên trong tiếng Việt; נְחֹשֶׁת chỉ kim loại nền đồng, thường được hiểu là đồng thiếc trong bối cảnh cổ đại.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: ngươi phải đúc ... cho chúng
  rationale: יצק diễn tả việc đúc kim loại, và לָהֶם cho biết các đế được làm cho năm trụ.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng, rõ ràng và gần với cấu trúc Hê-bơ-rơ. Dùng “ngươi” để giữ cách Đức Chúa Trời trực tiếp phán với Môi-se trong số ít. “Bức màn che cửa” giúp độc giả hiện đại phân biệt màn lối vào với bức màn ngăn Nơi Chí Thánh.
