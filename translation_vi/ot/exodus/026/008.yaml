translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đơn vị “cu-bít” của nguyên văn; dùng cấu trúc danh từ “chiều dài… chiều rộng…” để phản ánh lời mô tả kích thước, đồng thời diễn đạt tính đồng nhất bằng cụm tự nhiên “cùng một kích thước”.
