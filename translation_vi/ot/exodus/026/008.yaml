base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: vi
  text: Chiều dài của mỗi tấm màn[a] là ba mươi cu-bít, và chiều rộng của mỗi tấm màn là bốn cu-bít; cả mười một tấm màn đều có cùng một kích thước[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “tấm màn, một tấm”; tiếng Hê-bơ-rơ dùng lối nói này theo nghĩa phân phối, tức là từng tấm màn.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “một số đo”, nhấn mạnh rằng cả mười một tấm màn đều có kích thước giống nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: chiều dài
  rationale: Thuật ngữ chỉ kích thước, đi đôi với רֹחַב (“chiều rộng”); “chiều dài” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: יְרִיעָה
  choice: tấm màn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ một tấm vải lớn dùng làm màn hoặc lớp phủ. “Tấm màn” vừa thể hiện đây là một đơn vị riêng lẻ vừa phù hợp với ngữ cảnh.
- source_word: הָאַחַת / הָאֶחָת
  choice: mỗi
  rationale: Dạng Hê-bơ-rơ theo sát chữ là “tấm màn, tấm thứ nhất/một”, nhưng ở đây được dùng theo nghĩa phân phối, chỉ từng tấm trong toàn bộ số màn.
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: ba mươi cu-bít
  rationale: Giữ nguyên đơn vị đo cổ đại אַמָּה thay vì quy đổi sang đơn vị hiện đại, nhằm bảo toàn hình thức đo lường của nguyên văn.
- source_word: רֹחַב
  choice: chiều rộng
  rationale: Đây là từ chỉ bề rộng, tương ứng tự nhiên với “chiều dài” trong mô tả kích thước.
- source_word: אַרְבַּע בָּאַמָּה
  choice: bốn cu-bít
  rationale: Chuyển tải trực tiếp con số và giữ nguyên đơn vị đo của nguyên văn.
- source_word: מִדָּה אַחַת
  choice: cùng một kích thước
  rationale: Cụm từ theo sát chữ là “một số đo”; trong ngữ cảnh, nó nhấn mạnh rằng mọi tấm màn đều có kích thước giống nhau. “Cùng một kích thước” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: cả mười một tấm màn
  rationale: Cụm này xác định toàn bộ mười một tấm là đối tượng cùng chung một kích thước; “cả” làm rõ tính bao quát mà không thêm nội dung ngoài nguyên văn.
