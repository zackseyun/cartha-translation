base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: vi
  text: Con phải làm một màn che ở lối vào Lều[a], bằng chỉ xanh lam, tím, đỏ tươi và vải lanh mịn xe sợi, là công việc của thợ thêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm rèm” hoặc “bức màn” che lối vào; ở đây dùng “màn che” để phân biệt với bức màn phía trong được mô tả ở chỗ khác trong chương.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: bức màn che
  rationale: Chỉ một tấm vải treo dùng để che hoặc ngăn. Cách dịch này tự nhiên trong tiếng Việt và, cùng với chú thích, phân biệt nó với bức màn phía trong được nói đến ở phần khác của chương.
- source_word: לְפֶתַח הָאֹהֶל
  choice: che cửa Lều
  rationale: פֶתַח là lối mở hay cửa ra vào; giới từ לְ diễn tả vị trí/chức năng của tấm màn. “Lều” dịch trực tiếp אֹהֶל mà không đưa thêm cách gọi mang tính diễn giải.
- source_word: תְּכֵלֶת
  choice: chỉ xanh lam
  rationale: Từ này chỉ vật liệu nhuộm màu xanh lam hoặc xanh tím quý giá. “Xanh lam” rõ ràng và dễ hiểu; “chỉ” được bổ sung theo ngữ cảnh dệt may.
- source_word: אַרְגָּמָן
  choice: chỉ tím
  rationale: Chỉ vật liệu nhuộm màu tím; danh từ “chỉ” được hiểu chung trong chuỗi vật liệu.
- source_word: תוֹלַעַת שָׁנִי
  choice: chỉ đỏ tươi
  rationale: Thành ngữ chỉ vật liệu được nhuộm đỏ tươi, không nên dịch từng chữ theo nghĩa con sâu trong ngữ cảnh này.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe sợi
  rationale: Giữ cả ý vật liệu gai mịn của שֵׁשׁ và đặc điểm sợi được xe của מָשְׁזָר.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: sản phẩm của thợ thêu
  rationale: Giữ cấu trúc nói về sản phẩm thủ công và nhấn mạnh người thợ có kỹ năng trang trí hàng dệt.
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng động từ trong chuỗi chỉ dẫn mang lực mệnh lệnh. “Phải làm” thể hiện rõ tính chỉ thị, còn “ngươi” phù hợp lời phán trực tiếp với Môi-se trong văn phong trang trọng.
