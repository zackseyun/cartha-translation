  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: vi
  text: Chiều dài của mỗi tấm màn là hai mươi tám am-ma[a], và chiều rộng của mỗi tấm màn là bốn am-ma; mọi tấm màn đều có cùng một kích thước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một am-ma là đơn vị đo chiều dài cổ, xấp xỉ khoảng 45 centimét.
    reason: Đơn vị cổ cần được giải thích cho độc giả hiện đại; trị số chỉ có tính gần đúng.
lexical_decisions:
- source_word: אֹרֶךְ
  choice: chiều dài
  rationale: Danh từ chỉ kích thước theo chiều dài, phù hợp với văn cảnh quy cách kiến trúc.
- source_word: הַיְרִיעָה
  choice: tấm màn
  rationale: Trong chỉ dẫn về Đền Tạm, từ này chỉ từng tấm vải lớn dùng làm màn hoặc lớp phủ; “tấm màn” tự nhiên và giữ được ý về một đơn vị riêng biệt.
- source_word: הָאַחַת / הָאֶחָת
  choice: mỗi
  rationale: Nghĩa sát là “tấm thứ/một ấy”, nhưng cấu trúc Hê-bơ-rơ có chức năng phân phối, quy định kích thước cho từng tấm màn.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: hai mươi tám
  rationale: Số đếm chỉ chiều dài.
- source_word: בָּאַמָּה
  choice: am-ma
  rationale: Đơn vị đo chiều dài cổ אַמָּה; phiên âm giữ đơn vị nguyên thủy thay vì quy đổi thiếu chắc chắn sang đơn vị hiện đại.
- source_word: וְרֹחַב
  choice: và chiều rộng
  rationale: Cách diễn đạt tiếng Việt tự nhiên, song song với “chiều dài”.
- source_word: אַרְבַּע
  choice: bốn
  rationale: Số đếm chỉ chiều rộng.
- source_word: מִדָּה אַחַת
  choice: cùng một kích thước
  rationale: Nghĩa đen là “một số đo”; trong ngữ cảnh, cụm này nói rằng tất cả các tấm có chung một quy cách kích thước.
- source_word: לְכָל הַיְרִיעֹת
  choice: mọi tấm màn
  rationale: Thể hiện phạm vi áp dụng cho toàn bộ các tấm màn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. Dùng “tấm màn” để phân biệt từng mảnh vải; chuyển cấu trúc phân phối của tiếng Hê-bơ-rơ thành “mỗi”. Cụm kết được diễn đạt tự nhiên là “cùng một kích thước”, đồng thời bảo toàn ý rằng mọi tấm đều theo một số đo chung.
