  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: vi
  text: Ngươi phải làm các tấm màn bằng lông dê để làm một cái lều phủ trên Đền Tạm[a]; ngươi phải làm mười một tấm màn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “các tấm màn bằng dê”. Tiếng Hê-bơ-rơ dùng “dê” để chỉ vật liệu lấy từ dê, tức là lông dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng Qal có liên từ mở đầu, nằm trong chuỗi chỉ thị. “Ngươi phải làm” truyền đạt trực tiếp mệnh lệnh dành cho Môi-se và giữ sắc thái trang trọng của văn bản luật lệ–nghi lễ.
- source_word: יְרִיעֹת
  choice: các tấm màn
  rationale: Trong ngữ cảnh dựng Đền Tạm, từ này chỉ những tấm vải lớn dùng làm lớp phủ. “Các tấm màn” tự nhiên, dễ hiểu và vẫn giữ được chức năng kiến trúc của chúng.
- source_word: עִזִּים
  choice: bằng lông dê
  rationale: Nghĩa đen là “dê”, nhưng ở đây danh từ chỉ vật liệu lấy từ dê, tức lông dê. Thêm “lông” giúp câu tiếng Việt rõ nghĩa mà không thay đổi nội dung.
- source_word: לְאֹהֶל
  choice: để làm một cái lều
  rationale: 'Giới từ לְ biểu thị mục đích hoặc công dụng: các tấm màn hợp thành hay được dùng làm một lều phủ. Danh từ không có mạo từ nên “một cái lều” phù hợp hơn “cái lều”.'
- source_word: עַל הַמִּשְׁכָּן
  choice: phủ trên Đền Tạm
  rationale: עַל chỉ vị trí ở trên; הַמִּשְׁכָּן là thuật ngữ chỉ nơi thánh trong phần này của Xuất Ai Cập. “Đền Tạm” là cách gọi trang trọng, dễ nhận biết trong tiếng Việt.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: mười một
  rationale: Cụm số từ có nghĩa trực tiếp là “mười một”.
- source_word: יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: ngươi phải làm tất cả mười một tấm màn
  rationale: Tiếng Hê-bơ-rơ lặp lại “tấm màn” sau số từ để xác định tổng số. “Tất cả mười một tấm màn” diễn đạt rõ tổng số và tự nhiên hơn trong tiếng Việt.
theological_decisions: []
