  verdict: revise
  source_fidelity: Cần sửa mệnh đề quan hệ. הָרְאֵיתָ là dạng Qal chủ động, nghĩa là “ngươi đã thấy,” không phải Hiphil hay bị động “đã được cho ngươi thấy.” Bản sửa giữ nguyên sự mơ hồ tự nhiên về việc ai cho thấy mà không đổi chủ ngữ ngữ pháp.
  naturalness: “Ngươi phải dựng Đền Tạm theo đúng quy cách” tự nhiên trong văn phong Kinh Thánh Việt ngữ hiện đại, trang trọng. “mà ngươi đã thấy trên núi” rõ ràng và trôi chảy.
  terminology: “Đền Tạm” phù hợp với הַמִּשְׁכָּן trong ngữ cảnh Xuất Hành. “Theo đúng quy cách” diễn đạt hợp lý כְּמִשְׁפָּטוֹ là cách thức/quy định đã định; chú thích bảo lưu phương án “kiểu mẫu.”
  issues:
  - severity: medium
    issue: “đã được cho ngươi thấy” chuyển động từ chủ động sang bị động.
    rationale: Nguyên văn אֲשֶׁר הָרְאֵיתָ có nghĩa trực tiếp là “mà ngươi đã thấy.” Dù ngữ cảnh hàm ý điều đó được Đức Chúa Trời cho thấy, nguyên văn không dùng cấu trúc bị động và không cần thêm ý này vào bản văn chính.
  - severity: medium
    issue: Giải trình từ vựng gọi הָרְאֵיתָ là Hiphil.
    rationale: 'Dạng trong bản văn WLC là Qal hoàn thành, ngôi thứ hai số ít giống đực, của ראה: “ngươi đã thấy.”'
