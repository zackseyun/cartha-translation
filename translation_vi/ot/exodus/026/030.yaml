  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: vi
  text: Ngươi phải dựng Đền Tạm theo đúng quy cách[a] mà ngươi đã thấy trên núi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo kiểu mẫu của nó” hoặc “theo quy định dành cho nó.”'
    reason: Từ Hê-bơ-rơ מִשְׁפָּט có thể chỉ quy định, cách thức đã ấn định, hoặc kiểu mẫu trong ngữ cảnh này.
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: Ngươi phải dựng
  rationale: Động từ קום ở thể Hiphil mang nghĩa làm cho đứng lên, và trong ngữ cảnh lắp dựng một công trình là “dựng”. Cấu trúc “phải” chuyển tải lực chỉ thị của câu.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ quen thuộc và rõ nghĩa trong tiếng Việt để chỉ nơi thánh dạng lều trong sách Xuất Ê-díp-tô Ký, đồng thời giữ được tính chuyên biệt của מִשְׁכָּן.
- source_word: כְּמִשְׁפָּטוֹ
  choice: theo đúng quy cách
  rationale: מִשְׁפָּט ở đây chỉ cách thức hoặc quy định đã được ấn định cho việc dựng Đền Tạm. “Quy cách” tự nhiên trong ngữ cảnh xây dựng, không thu hẹp nghĩa thành riêng bản vẽ hay kiểu mẫu.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: đã được cho ngươi thấy
  rationale: 'Dạng Hiphil הָרְאֵיתָ về hình thái có thể được hiểu là “ngươi đã được cho thấy”, tức một cách diễn đạt thụ động về ý nghĩa: Môi-se được cho xem. Cách dịch này tự nhiên và giữ kín tác nhân như nguyên văn.'
- source_word: בָּהָר
  choice: trên núi
  rationale: Giới từ ב với địa điểm này được diễn đạt tự nhiên trong tiếng Việt là “trên núi”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ lời phán trực tiếp ở số ít; “Đền Tạm” là thuật ngữ Kinh Thánh phổ biến. Đại từ sở hữu trong כְּמִשְׁפָּטוֹ được diễn đạt tự nhiên qua “quy cách” thay vì thêm “của nó”, vì đối tượng đã rõ.
