base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: vi
  text: Hãy nối năm tấm màn thành một bộ, và sáu tấm màn thành một bộ khác; rồi gấp đôi tấm màn thứ sáu ở phía trước lều.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đối diện mặt trước của lều.”'
    reason: Cụm אֶל מוּל פְּנֵי có thể được hiểu sát hơn là vị trí hướng về hoặc đối diện mặt trước của lều.
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: nối ... với nhau
  rationale: Động từ חָבַר chỉ việc nối hoặc kết lại. Cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy các tấm màn được ghép thành từng bộ.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: tấm màn
  rationale: Danh từ יְרִיעָה chỉ những tấm vải phủ trong cấu trúc Lều Thánh. “Tấm màn” vừa rõ nghĩa vừa giữ được đặc tính là từng tấm riêng biệt.
- source_word: לְבָד
  choice: riêng
  rationale: 'Từ này phân biệt hai nhóm: năm tấm được nối thành một nhóm và sáu tấm thành nhóm khác. “Riêng” diễn đạt gọn, tự nhiên ý phân nhóm.'
- source_word: כָפַלְתָּ
  choice: gấp đôi
  rationale: Động từ כָּפַל mang nghĩa gấp lại hoặc làm thành hai lớp; “gấp đôi” giữ đúng thao tác được truyền lệnh.
- source_word: הַשִּׁשִּׁית
  choice: thứ sáu
  rationale: Dịch trực tiếp số thứ tự bổ nghĩa cho “tấm màn”.
- source_word: אֶל מוּל פְּנֵי
  choice: ở phía trước
  rationale: Cụm giới từ chỉ vị trí hướng về hoặc đối diện phần mặt trước. Bản chính dùng cách nói tự nhiên “ở phía trước”, còn sắc thái “đối diện mặt trước” được ghi ở chú thích.
- source_word: הָאֹהֶל
  choice: lều
  rationale: Nguyên văn dùng danh từ thông thường “lều”. Giữ cách gọi này thay vì diễn giải thành “Đền Tạm” hay “Lều Thánh” ngay trong câu.
theological_decisions: []
translation_notes:
  register: Dùng thể mệnh lệnh “Hãy” phù hợp với chuỗi chỉ dẫn, tránh đại từ xưng hô không có trong nguyên văn. Văn phong hiện đại, trang trọng và rõ ràng; cấu trúc song song của hai nhóm màn được giữ lại.
