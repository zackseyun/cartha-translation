  source_fidelity: 'Bản dịch truyền đạt đúng các mệnh lệnh chính: nối năm tấm thành một nhóm, sáu tấm thành nhóm khác, rồi gấp đôi tấm thứ sáu tại/về phía mặt trước lều. Tuy nhiên, trật tự từ “nối riêng năm tấm màn với nhau” không tự nhiên và có thể nhất thời khiến “riêng” bị hiểu là từng tấm được nối riêng lẻ, thay vì hai bộ màn tách biệt.'
