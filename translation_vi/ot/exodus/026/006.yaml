base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: vi
  text: 'Ngươi phải làm năm mươi móc cài bằng vàng, rồi dùng các móc cài ấy nối các tấm màn lại với nhau,[a] để Đền Tạm hợp thành một.


    [a] Theo nghĩa đen: “mỗi người nữ với chị em mình” — một thành ngữ Hê-bơ-rơ diễn tả các tấm màn tương ứng được nối với nhau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “mỗi người nữ với chị em mình” — một thành ngữ Hê-bơ-rơ diễn tả các tấm màn tương ứng được nối với nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng động từ trong chuỗi chỉ dẫn mang lực mệnh lệnh. “Phải làm” truyền đạt rõ yêu cầu, còn “ngươi” giữ ngôi số ít của lời phán trực tiếp với Môi-se.
- source_word: קַרְסֵי זָהָב
  choice: móc cài bằng vàng
  rationale: קֶרֶס chỉ vật dùng để gắn các tấm màn. “Móc cài” dễ hiểu, không xác định quá mức hình dạng, và “bằng vàng” nêu rõ chất liệu.
- source_word: וְחִבַּרְתָּ
  choice: rồi ... nối
  rationale: חבר có nghĩa là nối hoặc kết lại. “Rồi” thể hiện bước tiếp theo trong chuỗi hướng dẫn, còn “nối” phù hợp tự nhiên với các tấm màn.
- source_word: הַיְרִיעֹת
  choice: các tấm màn
  rationale: יְרִיעָה trong ngữ cảnh Đền Tạm là những tấm vải cấu thành lớp phủ; “tấm màn” vừa dễ hiểu vừa cho thấy đây là các mảng riêng biệt.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: lại với nhau
  rationale: Thành ngữ nguyên văn “mỗi người nữ với chị em mình” diễn tả các vật tương ứng được đặt hoặc nối với nhau. Bản dịch dùng cách nói tự nhiên và giữ hình ảnh nguyên văn trong chú thích.
- source_word: בַּקְּרָסִים
  choice: dùng các móc cài ấy
  rationale: Giới từ ב chỉ phương tiện. “Dùng” diễn đạt rõ chức năng công cụ; “ấy” liên kết các móc cài với năm mươi chiếc vừa được truyền làm.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: để Đền Tạm hợp thành một
  rationale: Mệnh đề nêu kết quả của việc nối các tấm màn. “Hợp thành một” giữ ý thống nhất của אֶחָד mà không thêm hình ảnh như “một khối” hay “một thể” vốn không có trực tiếp trong nguyên văn.
theological_decisions:
- issue: Cách dịch הַמִּשְׁכָּן
  choice: Đền Tạm
  alternative: nơi ngự; chỗ ở; lều thánh
  rationale: “Đền Tạm” là thuật ngữ tiếng Việt quen thuộc cho nơi thánh lưu động trong sách Xuất Hành, giữ được nghĩa chuyên biệt trong ngữ cảnh mà không biến nó thành một nơi ở chung chung.
- issue: Quan hệ ý nghĩa của וְהָיָה
  choice: để ... hợp thành một
  alternative: và Đền Tạm sẽ là một
  rationale: Trong chuỗi chỉ dẫn, câu cuối tự nhiên được hiểu là kết quả của việc nối các tấm màn. Cách dịch này biểu đạt quan hệ kết quả nhưng không gán thêm một ý nghĩa thần học cho sự hiệp nhất.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “ngươi” vì đây là lời chỉ dẫn trực tiếp ở ngôi số ít dành cho Môi-se; dùng “Đền Tạm” như thuật ngữ quen thuộc. Cấu trúc câu được làm tự nhiên trong tiếng Việt nhưng vẫn giữ thứ tự các thao tác và ý kết quả của nguyên văn.
