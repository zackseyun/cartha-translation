    issue: “khung thứ nhất” thêm sắc thái thứ tự
    rationale: הַקֶּרֶשׁ הָאֶחָד nghĩa đen là “một khung/khung ấy”, không phải “khung thứ nhất”. Cách dịch này có thể khiến người đọc suy ra thứ tự đánh số không có trong nguyên văn.
  - severity: low
    issue: Neo chú thích chưa gắn với thuật ngữ được giải thích
    rationale: Chú thích về “khung/tấm ván” và “đế/ổ đỡ” hiện cùng đặt sau “thứ nhất”, trong khi “đế” xuất hiện trước đó. Đặt từng neo sau thuật ngữ tương ứng rõ ràng hơn.
  - severity: low
    issue: Câu chú thích về ổ đỡ chưa tự nhiên
    rationale: Cụm “để dựng các khung Đền Tạm vào” không tự nhiên trong tiếng Việt; có thể diễn đạt là các bộ phận nâng đỡ, có chỗ để đặt các khung.
