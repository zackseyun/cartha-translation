translation:
  language: vi
  text: 'và bốn mươi đế[a] bạc của chúng: hai đế dưới một khung[b], và hai đế dưới khung kia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ổ đỡ”; từ Hê-bơ-rơ chỉ các bộ phận bằng bạc nâng đỡ và có chỗ để đặt các khung Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tấm ván”; từ Hê-bơ-rơ chỉ mỗi cấu kiện đứng của Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים אַדְנֵי/הֶם כָּסֶף
  choice: và bốn mươi đế bằng bạc của chúng
  rationale: Giữ liên từ nối tiếp câu trước, số lượng bốn mươi, quan hệ sở hữu và chất liệu bạc; cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: שְׁנֵי אֲדָנִים
  choice: hai đế
  rationale: Trong cấu trúc Đền Tạm, אֶדֶן chỉ bộ phận bằng bạc làm đế đỡ, đồng thời có chỗ để dựng cấu kiện đứng; “đế” rõ và tự nhiên, còn “ổ đỡ” được ghi ở chú thích như một khả năng.
- source_word: תַּחַת
  choice: dưới
  rationale: Chuyển trực tiếp vị trí vật lý của các đế đối với khung.
- source_word: הַ/קֶּרֶשׁ
  choice: khung
  rationale: קֶרֶשׁ là mỗi cấu kiện đứng trong kết cấu Đền Tạm. “Khung” truyền đạt chức năng kết cấu tốt hơn “tấm ván”, dù cách gọi truyền thống ấy vẫn có thể dùng.
- source_word: הַקֶּרֶשׁ הָאֶחָד ... הַקֶּרֶשׁ הָאֶחָד
  choice: khung thứ nhất ... khung kế tiếp
  rationale: Nguyên văn lặp lại cụm “khung thứ/một”; trong ngữ cảnh phân bố hai đế cho từng khung, tiếng Việt cần biểu đạt sự chuyển sang cấu kiện kế tiếp để tránh hiểu nhầm rằng cả bốn đế đều ở dưới cùng một khung.
