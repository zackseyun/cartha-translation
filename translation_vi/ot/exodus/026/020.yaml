  naturalness: Câu có thể tự nhiên và mạch lạc hơn khi dùng “tức phía bắc” và “hãy làm”, phù hợp với chuỗi chỉ dẫn xây dựng đang tiếp diễn từ câu trước.
  terminology: “Đền Tạm” là thuật ngữ chuẩn, phù hợp. “Khung” là lựa chọn có thể chấp nhận cho קָרֶשׁ trong ngữ cảnh các cấu kiện dựng đứng; chú thích giữ phương án “tấm ván” và giải thích chức năng kết cấu một cách thận trọng.
  issues:
