  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: vi
  text: Còn phía thứ hai của Đền Tạm, tức phía bắc, hãy làm hai mươi khung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm ván.” Từ Hê-bơ-rơ này có thể chỉ các cấu kiện thẳng đứng tạo thành vách Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: Còn phía
  rationale: Liên từ và giới từ mở đầu quy cách cho phía kế tiếp; צֶלַע trong ngữ cảnh kiến trúc chỉ một phía hay vách bên, không phải nghĩa đen là xương sườn.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ quen thuộc, trang trọng và dễ hiểu trong tiếng Việt để chỉ nơi thánh lưu động của Y-sơ-ra-ên.
- source_word: הַשֵּׁנִית
  choice: thứ hai
  rationale: Giữ đúng số thứ tự của nguyên văn, chỉ phía dài tương ứng được mô tả sau phía thứ nhất.
- source_word: לִ/פְאַת צָפוֹן
  choice: về hướng bắc
  rationale: Diễn đạt tự nhiên ý định hướng của cụm từ Hê-bơ-rơ mà không buộc phải hiểu פֵּאָה là một 'phía' thứ hai trong cùng câu.
- source_word: עֶשְׂרִים
  choice: hai mươi
  rationale: Chuyển trực tiếp số đếm trong nguyên văn.
- source_word: קָרֶשׁ
  choice: khung
  rationale: Trong phần mô tả Đền Tạm, từ này chỉ các cấu kiện thẳng đứng tạo nên vách; 'khung' thể hiện chức năng kết cấu, còn 'ván' vẫn là một khả năng dịch hợp lệ.
