translation:
  language: vi
  text: 'Ngươi phải làm các khung cho Đền Tạm: hai mươi khung cho cạnh phía nam, hướng về phương nam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “các tấm ván” thay cho “các khung”; từ Hê-bơ-rơ chỉ những bộ phận kết cấu của Đền Tạm và có thể được hiểu theo cả hai cách.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng động từ hoàn thành Qal có liên từ đứng trước, trong mạch chỉ thị, mang lực mệnh lệnh. “Ngươi phải làm” diễn đạt tự nhiên và rõ ràng tính bắt buộc.
- source_word: הַקְּרָשִׁים
  choice: các khung
  rationale: קֶרֶשׁ chỉ những bộ phận kết cấu dựng đứng của Đền Tạm. “Khung” phù hợp với chức năng khả dĩ, nhưng “tấm ván” vẫn là một cách hiểu hợp lệ nên được ghi ở chú thích.
- source_word: לַמִּשְׁכָּן
  choice: cho Đền Tạm
  rationale: מִשְׁכָּן là thuật ngữ quen dùng cho cấu trúc thánh trong sách Xuất Hành. “Đền Tạm” là cách gọi tiếng Việt rõ nghĩa và đã được dùng rộng rãi.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: hai mươi khung
  rationale: Cấu trúc Hê-bơ-rơ dùng số từ với danh từ số ít để đếm; tiếng Việt dùng danh từ không biến đổi sau số từ.
- source_word: לִפְאַת
  choice: cho phía
  rationale: פֵאָה có thể chỉ phía, cạnh hoặc mép; trong phần mô tả kiến trúc, “phía” diễn đạt đúng quan hệ không gian.
- source_word: נֶגְבָּה תֵימָנָה
  choice: phía nam, hướng về phương nam
  rationale: Hai từ chỉ hướng cùng xuất hiện để xác định và nhấn mạnh hướng nam. Bản dịch giữ cả hai thành tố thay vì gộp thành một tính từ.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng dễ hiểu. Dùng “ngươi” để giữ lối xưng hô trực tiếp số ít của văn bản Hê-bơ-rơ; giữ sự lặp ý “phía nam, hướng về phương nam” nhằm phản ánh đầy đủ cấu trúc nguyên ngữ.
