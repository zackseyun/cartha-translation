    rationale: Trong câu này עַל chỉ vị trí đặt các vòng «trên mép» tấm màn. «Trên mép» vừa tự nhiên vừa sát nguồn hơn.
  - severity: low
    issue: Thiếu dấu neo và chú thích cho חֹבֶרֶת.
    rationale: Hồ sơ tiếng Anh có chú thích từ vựng về danh từ này, vốn chỉ đơn vị được ghép nối. Thêm chú thích tại lần xuất hiện đầu tiên duy trì dấu vết kiểm tra và nêu phương án dịch mà không áp đặt cách hiểu khác.
