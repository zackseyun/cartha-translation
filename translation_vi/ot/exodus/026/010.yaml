  to: Ngươi phải làm năm mươi vòng khuy trên mép tấm màn ở ngoài cùng của một bộ màn ghép lại[a], và năm mươi vòng khuy trên mép tấm màn của bộ thứ hai.
  rationale: Chỉ thay «dọc theo mép» bằng «trên mép» để sát giới từ Hê-bơ-rơ hơn, đồng thời thêm chú thích có dấu neo cho חֹבֶרֶת. Cấu trúc «một bộ ...; bộ thứ hai» được giữ vì phản ánh sự đối chiếu giữa bộ màn ghép được nhắc trước và bộ màn ghép thứ hai mà không thêm chi tiết ngoài văn bản.
