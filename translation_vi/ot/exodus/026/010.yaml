  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: vi
  text: Ngươi phải làm năm mươi vòng khuy trên mép tấm màn ở ngoài cùng của một bộ màn ghép lại[a], và năm mươi vòng khuy trên mép tấm màn của bộ thứ hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «trong mối ghép». Từ Hê-bơ-rơ chỉ đơn vị được tạo thành khi các tấm màn được ghép lại với nhau.'
    reason: Phương án từ vựng cho חֹבֶרֶת, tương ứng với chú thích trong hồ sơ kiểm tra tiếng Anh.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng động từ hoàn thành Qal có liên từ, trong văn cảnh chỉ dẫn, mang lực mệnh lệnh. “Phải làm” diễn đạt tự nhiên và rõ ràng tính bắt buộc.
- source_word: לֻלָאֹת
  choice: vòng khuy
  rationale: Danh từ chỉ các vòng bằng vải dùng để nối các tấm màn. “Vòng khuy” vừa dễ hiểu vừa gợi đúng chức năng liên kết.
- source_word: שְׂפַת
  choice: mép
  rationale: Nghĩa đen là “môi”, nhưng khi nói về vải thì “mép” là cách diễn đạt tự nhiên và chính xác.
- source_word: הַיְרִיעָה
  choice: tấm màn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ một tấm vải lớn thuộc hệ thống màn che; “tấm màn” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: הָאֶחָת הַקִּיצֹנָה
  choice: tấm màn ở ngoài cùng
  rationale: Cụm từ xác định một tấm màn nằm ở đầu ngoài của bộ màn; tiếng Việt không cần giữ riêng từ “một” khi vị trí đã xác định rõ.
- source_word: בַּחֹבָרֶת
  choice: của một bộ màn ghép lại
  rationale: Danh từ חֹבֶרֶת chỉ một đơn vị gồm nhiều tấm màn được ghép với nhau. Cách dịch này diễn đạt rõ cấu tạo mà không biến nó thành hành động nối với riêng một tấm khác.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: của bộ thứ hai
  rationale: Cụm danh từ chỉ bộ màn ghép thứ hai. “Bộ thứ hai” giữ sự đối chiếu cấu trúc với bộ màn đã nói ở vế trước.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng, rõ ràng và phù hợp với tiếng Việt hiện đại. Dùng “Ngươi” để giữ lối xưng hô số ít trong lời Đức Chúa Trời phán với Môi-se, đồng thời tránh cách nói quá khẩu ngữ. Bản dịch ưu tiên cú pháp và nghĩa của tiếng Hê-bơ-rơ WLC hơn cách diễn giải quan hệ trong lớp tham khảo tiếng Anh.
