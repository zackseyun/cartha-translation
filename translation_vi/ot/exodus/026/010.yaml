  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh, số lượng năm mươi, các vòng khuy, mép màn, vị trí tấm màn ngoài cùng trong bộ màn ghép, và bộ thứ hai. Tuy nhiên, cách nói «dọc theo mép» hơi mở rộng nghĩa vị trí đơn thuần của עַל («trên mép»), và bản nháp không giữ dấu chú thích cho thuật ngữ חֹבֶרֶת như hồ sơ kiểm tra tiếng Anh.
  naturalness: «Ngươi phải làm» và «vòng khuy» phù hợp văn phong chỉ dẫn Kinh Thánh trang trọng. «Trên mép» tự nhiên, gọn và sát hơn «dọc theo mép».
  terminology: «Tấm màn», «mép», và «vòng khuy» nhất quán với ngữ cảnh cấu tạo Đền Tạm. «Bộ màn ghép lại» diễn đạt hợp lý חֹבֶרֶת; chú thích nêu phương án sát chữ «mối ghép/bộ ghép» giúp bảo toàn sắc thái thuật ngữ mà không làm câu chính khó hiểu.
  issues:
