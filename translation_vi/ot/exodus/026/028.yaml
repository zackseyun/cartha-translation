base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/028.yaml
  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: vi
  text: Còn thanh ngang ở giữa, nằm giữa các khung[a], phải chạy dài từ đầu này đến đầu kia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tấm ván”. Từ Hê-bơ-rơ chỉ những bộ phận kết cấu dựng đứng của Đền Tạm; ở đây dùng “các khung” để tránh gợi ý rằng đó chỉ là những tấm gỗ phẳng đơn giản.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: thanh ngang
  rationale: Trong ngữ cảnh dựng Đền Tạm, từ này chỉ thanh dùng để liên kết các bộ phận dựng đứng; “thanh ngang” diễn đạt rõ chức năng kết cấu hơn “then cửa”.
- source_word: הַתִּיכֹן
  choice: ở giữa
  rationale: Tính từ này xác định vị trí của thanh so với các thanh khác; “ở giữa” tự nhiên và giữ đúng ý không gian.
- source_word: בְּתוֹךְ
  choice: nằm giữa
  rationale: Cách dịch này giữ nghĩa vị trí bên trong hoặc giữa các bộ phận kết cấu mà không khẳng định thanh phải xuyên qua các lỗ.
- source_word: הַקְּרָשִׁים
  choice: các khung
  rationale: Từ Hê-bơ-rơ chỉ các bộ phận kết cấu dựng đứng của Đền Tạm. “Các khung” tránh làm người đọc chỉ hình dung những tấm gỗ phẳng đơn giản; phương án truyền thống “các tấm ván” được giữ trong chú thích.
- source_word: מַבְרִחַ
  choice: phải chạy dài
  rationale: Phân từ Hifil mô tả thanh kéo dài dọc theo kết cấu. “Chạy dài” diễn đạt hướng và độ trải của thanh nhưng không thêm ý thanh xuyên qua các lỗ.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: từ đầu này đến đầu kia
  rationale: Thành ngữ này chỉ sự kéo dài trọn chiều; cách dịch tiếng Việt rõ ràng, tự nhiên và giữ nguyên phạm vi toàn bộ.
theological_decisions: []
