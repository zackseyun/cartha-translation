source:
  edition: WLC
  text: וְ/אֶת הַ/מִּשְׁכָּ֥ן תַּעֲשֶׂ֖ה עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: vi
  text: Ngươi phải làm Đền Tạm bằng mười tấm màn, bằng vải lanh mịn se, chỉ xanh lam, chỉ tím và chỉ đỏ thắm; hãy làm các tấm ấy với hình các chê-ru-bim, theo lối chế tác của một nghệ nhân tài hoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với các chê-ru-bim được dệt khéo vào đó.” Cụm từ Hê-bơ-rơ מַעֲשֵׂה חֹשֵׁב chỉ công việc chế tác nghệ thuật, có thiết kế công phu, trong vải.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Chỉ nơi ngự thánh dạng lều trong bối cảnh thờ phượng; “Đền Tạm” là thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt và vẫn giữ ý nghĩa một thánh sở có thể tháo lắp.
- source_word: יְרִיעֹת
  choice: tấm màn
  rationale: Chỉ các tấm vải lớn hợp thành phần che phủ của Đền Tạm; “tấm màn” tự nhiên và thể hiện rõ từng đơn vị vải.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn se sợi
  rationale: שֵׁשׁ là vải gai mịn, còn מָשְׁזָר mô tả sợi được se; cách dịch giữ cả chất liệu lẫn phương pháp chế tác.
- source_word: תְכֵלֶת
  choice: chỉ xanh lam
  rationale: Từ này chỉ nguyên liệu nhuộm màu xanh lam; thêm “chỉ” làm rõ ý nghĩa dệt may trong chuỗi vật liệu.
- source_word: אַרְגָּמָן
  choice: tím
  rationale: Chỉ vật liệu nhuộm màu tím; dùng tên màu ngắn gọn trong chuỗi các loại chỉ.
- source_word: תֹלַעַת שָׁנִי
  choice: đỏ thắm
  rationale: Cụm từ chỉ vật liệu có màu đỏ thắm/đỏ son; trong ngữ cảnh, danh từ “chỉ” ở trước chi phối cả chuỗi màu.
- source_word: כְּרֻבִים
  choice: các chê-ru-bim
  rationale: Phiên âm thuật ngữ chỉ các hữu thể có cánh gắn với sự hiện diện và ngai Đức Chúa Trời, tránh đồng nhất với hình tượng thiên thần trẻ nhỏ.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: do thợ thiết kế tài hoa thực hiện
  rationale: Cụm từ nhấn mạnh công việc có thiết kế nghệ thuật và tay nghề cao, có lẽ là hoa văn được dệt vào vải, chứ không đơn thuần là lao động thủ công.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: Ngươi phải làm
  rationale: Diễn đạt mệnh lệnh tiếp nối trong lời chỉ dẫn trực tiếp; tiếng Việt không cần giữ liên từ mở đầu một cách máy móc.
- source_word: אֹתָם
  choice: các tấm màn
  rationale: Đại từ số nhiều quy chiếu về mười tấm màn; lặp lại danh từ giúp câu tiếng Việt rõ ràng.
theological_decisions:
- issue: Quan hệ cú pháp giữa hình chê-ru-bim và מַעֲשֵׂה חֹשֵׁב
  choice: các tấm màn có hình các chê-ru-bim do thợ thiết kế tài hoa thực hiện
  alternative: các chê-ru-bim được dệt khéo vào các tấm màn
  rationale: Bản dịch chính giữ trọng tâm vào các tấm màn và tính nghệ thuật của công việc, nhưng không xác quyết quá mức kỹ thuật tạo hình mà tiếng Hê-bơ-rơ không nêu cụ thể.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ngươi” để phản ánh lời phán trực tiếp số ít trong mạch luật lệ; dùng “Đền Tạm” như thuật ngữ quen thuộc. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
