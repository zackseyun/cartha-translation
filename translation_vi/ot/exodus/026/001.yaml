  - severity: low
    issue: “vải gai mịn se sợi” thiếu tự nhiên
    rationale: Cụm này không trôi chảy trong tiếng Việt. “Vải lanh mịn se” diễn đạt rõ chất liệu và đặc tính sợi xe.
  - severity: medium
