    rationale: מַעֲשֵׂה חֹשֵׁב nói về lối/công việc chế tác nghệ thuật có thiết kế; cách cũ biến cụm này thành một mệnh đề tác nhân và hơi xác định quá mức. “Theo lối chế tác của một nghệ nhân tài hoa” giữ được độ khái quát của tiếng Hê-bơ-rơ.
