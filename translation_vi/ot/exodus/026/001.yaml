  to: Ngươi phải làm Đền Tạm bằng mười tấm màn, bằng vải lanh mịn se, chỉ xanh lam, chỉ tím và chỉ đỏ thắm; hãy làm các tấm ấy với hình các chê-ru-bim, theo lối chế tác của một nghệ nhân tài hoa.[a]
