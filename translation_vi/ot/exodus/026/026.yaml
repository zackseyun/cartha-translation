translation:
  language: vi
  text: Ngươi phải làm năm thanh bằng gỗ keo cho các khung[a] ở một bên Đền Tạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tấm ván”; từ Hê-bơ-rơ chỉ những bộ phận kết cấu của Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng động từ trong chuỗi chỉ thị mang lực mệnh lệnh; cách dịch này tự nhiên và giữ sắc thái quy định.
- source_word: בְרִיחִם
  choice: thanh ngang
  rationale: Chỉ các thanh kết cấu dùng để liên kết các khung; “thanh ngang” rõ chức năng trong tiếng Việt mà không diễn giải quá mức.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm sở thuộc chỉ vật liệu; “gỗ keo” là cách gọi hiện đại, dễ hiểu của loại gỗ acacia.
- source_word: חֲמִשָּׁה
  choice: năm
  rationale: Số từ chỉ số lượng các thanh.
- source_word: לְקַרְשֵׁי
  choice: cho các khung
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ các bộ phận kết cấu thẳng đứng. “Khung” diễn đạt chức năng, còn khả năng dịch “tấm ván” được giữ trong chú thích.
- source_word: צֶלַע
  choice: bên
  rationale: Ở đây từ này chỉ một phía của công trình, không phải nghĩa đen “xương sườn”.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ quen thuộc và chính xác trong tiếng Việt cho cấu trúc thánh cư lưu động trong sách Xuất Hành.
- source_word: הָאֶחָד
  choice: một
  rationale: Chỉ một bên cụ thể trong hai bên, chuẩn bị cho bên đối diện được nói đến ở câu tiếp theo.
