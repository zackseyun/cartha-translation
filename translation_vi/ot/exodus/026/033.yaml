source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: vi
  text: Hãy treo bức màn dưới các móc cài, rồi đưa Hòm Chứng Ngôn[a] vào đó, phía trong bức màn. Bức màn sẽ phân cách Nơi Thánh với Nơi Chí Thánh[b] cho các con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng thường được gọi là “Hòm Giao Ước”; tiếng Hê-bơ-rơ ở đây là “chứng ngôn”.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “Nơi Thánh của các nơi thánh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: bức màn
  rationale: Chỉ tấm màn bên trong dùng để che và ngăn cách gian cực thánh; “bức màn” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: קְרָסִים
  choice: các móc nối
  rationale: Chỉ những bộ phận dùng để liên kết các tấm phủ của Đền Tạm. “Móc nối” diễn đạt cả hình thức lẫn chức năng mà không xác định quá mức cấu tạo.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: phía trong bức màn
  rationale: 'Giữ rõ ý nghĩa không gian: ở phía bên kia, trong phạm vi được bức màn che ngăn.'
- source_word: אֲרוֹן הָעֵדוּת
  choice: Hòm Chứng Ngôn
  rationale: Giữ nguyên danh từ עֵדוּת, nghĩa là “chứng ngôn/lời chứng”, thay vì đồng nhất hóa với danh xưng quen thuộc “Hòm Giao Ước” vốn không phải từ được dùng tại đây.
- source_word: וְהִבְדִּילָה
  choice: sẽ phân cách
  rationale: 'Thể hiện thể sai khiến của בדל: bức màn có chức năng tạo nên sự phân cách.'
- source_word: לָכֶם
  choice: cho các con
  rationale: Giữ đại từ số nhiều trong nguyên văn và diễn đạt tự nhiên trong lời Đức Chúa Trời phán với Môi-se về sự sắp đặt dành cho dân.
- source_word: הַקֹּדֶשׁ
  choice: Nơi Thánh
  rationale: Trong ngữ cảnh Đền Tạm, đây là tên gọi kỹ thuật của gian thánh bên ngoài, đối lập với gian trong cùng.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Nơi Chí Thánh
  rationale: Diễn đạt tự nhiên sức nhấn mạnh tối cao của cấu trúc Hê-bơ-rơ “thánh của các nơi thánh”, đồng thời phân biệt rõ gian trong cùng.
theological_decisions:
- issue: Danh xưng của hòm trong cụm אֲרוֹן הָעֵדוּת
  choice: Hòm Chứng Ngôn
  alternative: Hòm Giao Ước
  rationale: Nguyên văn dùng עֵדוּת (“chứng ngôn/lời chứng”), không dùng בְּרִית (“giao ước”); vì vậy bản dịch giữ cách gọi của chính câu này và ghi cách gọi quen thuộc trong chú thích.
- issue: Thuật ngữ chỉ gian thánh trong cùng
  choice: Nơi Chí Thánh
  alternative: Nơi Thánh của các nơi thánh
  rationale: “Nơi Chí Thánh” truyền đạt rõ nghĩa tuyệt đối của thành ngữ Hê-bơ-rơ mà vẫn tự nhiên với độc giả Việt Nam hiện đại; nghĩa sát chữ được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Con/các con” theo ngữ cảnh lời Đức Chúa Trời phán với Môi-se, đồng thời giữ sự chuyển đổi từ đại từ số ít sang số nhiều của nguyên văn. Viết hoa “Nơi Thánh”, “Nơi Chí Thánh” và “Hòm Chứng Ngôn” để thể hiện các danh xưng chuyên biệt trong Đền Tạm.
