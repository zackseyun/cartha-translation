    rationale: Câu thay thế không nêu một biến thể văn bản hay một cách gắn kết cú pháp thực sự khác làm thay đổi nghĩa; nó chỉ diễn đạt lại. Bỏ chú thích này giúp hệ thống chú thích chỉ bảo lưu vấn đề từ vựng thực sự.
  - severity: low
