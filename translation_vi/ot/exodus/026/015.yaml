    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng hoàn thành Qal có waw trong chuỗi chỉ thị mang lực mệnh lệnh; “phải làm” diễn đạt tự nhiên nghĩa bắt buộc trong tiếng Việt, còn tính nối tiếp đã rõ từ văn cảnh.
- source_word: הַקְּרָשִׁים
  choice: các khung
  rationale: קְרָשִׁים chỉ những cấu kiện gỗ chịu lực của Đền Tạm. “Khung” nêu rõ chức năng kiến trúc hơn “tấm ván”, nhưng phương án truyền thống được giữ trong chú thích.
- source_word: לַמִּשְׁכָּן
  choice: cho Đền Tạm
  rationale: מִשְׁכָּן là thuật ngữ chỉ nơi thánh lưu động trong sách Xuất Hành; “Đền Tạm” là cách gọi tiếng Việt quen thuộc và trang trọng.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm danh từ ghép chỉ gỗ của cây שִׁטָּה; “gỗ keo” là cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: עֹמְדִים
  choice: dựng đứng
  rationale: Phân từ mô tả tư thế thẳng đứng của các cấu kiện. “Dựng đứng” giữ sắc thái vị trí và phù hợp ngữ cảnh thi công.
