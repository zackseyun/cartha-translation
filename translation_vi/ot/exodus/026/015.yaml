translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngươi” để duy trì lời truyền trực tiếp ở số ít trong ngữ cảnh luật lệ; giữ “Đền Tạm” như thuật ngữ quen thuộc. Trật tự câu tránh để “bằng gỗ keo” bị hiểu là bổ nghĩa cho Đền Tạm, đồng thời chú thích bảo lưu khả năng gắn kết cú pháp khác của cụm cuối.
