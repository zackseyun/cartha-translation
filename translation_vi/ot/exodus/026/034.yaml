  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: vi
  text: Hãy đặt nắp chuộc tội[a] trên Hòm Chứng Ước[b], trong Nơi Chí Thánh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngai thương xót”.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “Hòm Chứng Ước”; nhiều bản dịch dùng “Hòm Giao Ước”.'
    reason: alternative_reading
  - marker: c
    text: 'Theo sát tiếng Hê-bơ-rơ: “Nơi Thánh của các nơi thánh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Ngươi phải đặt
  rationale: Động từ Qal hoàn thành ngôi 2 số ít có liên từ, nằm trong chuỗi chỉ thị, mang lực mệnh lệnh. “Phải đặt” diễn đạt tự nhiên và rõ ràng tính chỉ thị.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Chỉ chiếc nắp trên Hòm gắn với nghi lễ chuộc tội. Cách dịch này vừa nêu rõ đây là một vật che phủ vừa giữ mối liên hệ từ vựng với sự chuộc tội; phương án truyền thống “ngai thương xót” được ghi ở chú thích.
- source_word: עַל
  choice: trên
  rationale: Giới từ chỉ vị trí của chiếc nắp ở trên Hòm; “trên” là tương đương trực tiếp và tự nhiên.
- source_word: אֲרוֹן הָעֵדֻת
  choice: Hòm Chứng Ước
  rationale: Tiếng Hê-bơ-rơ nói theo nghĩa đen là “Hòm của Chứng Ước”, không phải “Hòm Giao Ước”. “Hòm” là thuật ngữ quen thuộc cho vật thánh này, còn “Chứng Ước” bảo toàn từ ngữ của nguồn.
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: trong Nơi Chí Thánh
  rationale: Cấu trúc Hê-bơ-rơ “thánh của các nơi thánh” biểu thị cấp tuyệt đối, chỉ gian thánh bên trong cùng. “Nơi Chí Thánh” trang trọng, rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách gọi vật đặt trên Hòm
  choice: Dùng “nắp chuộc tội” trong chính văn
  alternative: “ngai thương xót”
  rationale: “Nắp chuộc tội” thể hiện chức năng vật thể và liên hệ nghi lễ mà không khẳng định thêm một cách hiểu giáo phái; cách gọi truyền thống được bảo lưu trong chú thích.
- issue: Cách gọi Hòm
  choice: Dùng “Hòm Chứng Ước”
  alternative: “Hòm Giao Ước”
  rationale: Bản Hê-bơ-rơ tại đây dùng עֵדוּת, “chứng ước/chứng từ”, chứ không dùng בְּרִית, “giao ước”; bản dịch giữ nguyên sự phân biệt này thay vì hài hòa hóa.
- issue: Cách gọi gian thánh bên trong cùng
  choice: Dùng “Nơi Chí Thánh”
  alternative: “Nơi Thánh của các nơi thánh”
  rationale: Cách dịch chính truyền đạt tự nhiên giá trị tuyệt đối của thành ngữ Hê-bơ-rơ; cách sát cấu trúc hơn được ghi trong chú thích để bảo toàn khả năng kiểm chứng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” giữ sắc thái chỉ thị trực tiếp số ít trong diễn ngôn luật pháp. Viết hoa tên các vật và không gian thánh như danh xưng quy ước; không thêm ý thần học ngoài văn bản.
