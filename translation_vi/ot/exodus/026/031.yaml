  - severity: low
    issue: “bằng kỹ thuật tinh xảo” chưa chuyển tải đầy đủ מַעֲשֵׂה חֹשֵׁב.
    rationale: Cụm Hê-bơ-rơ nêu lối chế tác của người thợ lành nghề/khéo tay, không chỉ là một phẩm chất trừu tượng của kỹ thuật. “Theo lối thợ khéo” giữ sắc thái ấy mà không áp đặt một kỹ nghệ cụ thể.
  revised_text: Ngươi phải làm một bức màn bằng sợi xanh lam, tím, đỏ thắm[a] và vải lanh mịn xe; trên đó phải dệt các hình chê-ru-bim theo lối thợ khéo[b].
