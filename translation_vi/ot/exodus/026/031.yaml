source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ פָרֹ֗כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב יַעֲשֶׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: vi
  text: Ngươi phải làm một bức màn bằng sợi xanh lam, tím, đỏ thắm[a] và vải lanh mịn xe; trên đó phải dệt các hình chê-ru-bim theo lối thợ khéo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ chỉ vật liệu nhuộm đỏ thắm; theo truyền thống, thuốc nhuộm này được làm từ một loại côn trùng.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “theo công việc của một người thợ thiết kế lành nghề” hoặc “theo lối thợ dệt hoa văn lành nghề.” Cụm từ Hê-bơ-rơ nhấn mạnh tay nghề nghệ thuật tinh xảo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: bức màn
  rationale: Chỉ tấm màn phía trong phân cách Nơi Thánh với Nơi Chí Thánh. “Bức màn” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: תְּכֵלֶת
  choice: sợi màu xanh lam
  rationale: Chỉ loại vật liệu dệt nhuộm màu quý; “xanh lam” giữ cách hiểu màu sắc truyền thống, còn “sợi” làm rõ ngữ cảnh dệt.
- source_word: אַרְגָּמָן
  choice: màu tím
  rationale: Cách gọi thông dụng cho màu nhuộm quý trong các chỉ dẫn về Đền Tạm; danh từ “sợi” ở đầu chuỗi được hiểu chung cho các màu.
- source_word: תוֹלַעַת שָׁנִי
  choice: màu đỏ thắm
  rationale: Diễn đạt tự nhiên màu của vật liệu đã nhuộm, đồng thời tránh đưa nguồn gốc thuốc nhuộm vào chính văn.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe
  rationale: Giữ cả chất liệu vải gai mịn và đặc điểm sợi được xe; đây là cách diễn đạt gọn, phù hợp văn phong chỉ dẫn thủ công.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: bằng kỹ thuật tinh xảo
  rationale: Cụm từ nói đến công việc tạo hoa văn đòi hỏi tay nghề nghệ thuật; cách dịch này giữ ý thủ công chuyên môn mà không xác định quá hẹp một nghề hiện đại.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: trên màn phải dệt
  rationale: Động từ ngôi thứ ba có thể mang sắc thái chỉ dẫn phiếm chỉ. Tiếng Việt dùng “phải dệt” vừa tự nhiên vừa giữ lực mệnh lệnh, còn “trên màn” làm rõ quan hệ của hình chê-ru-bim với tấm màn.
- source_word: כְּרֻבִים
  choice: hình các chê-ru-bim
  rationale: Các chê-ru-bim là họa tiết trên màn; thêm “hình” làm rõ đây là hình thể hiện trong thiết kế, không phải các hữu thể hiện diện trực tiếp.
theological_decisions:
- issue: Ngôn ngữ về màn và nghệ thuật trong Đền Tạm
  choice: Dịch như một chỉ dẫn cụ thể về việc chế tác Đền Tạm, không thêm biểu tượng thần học về sau.
  alternative: Dùng cách diễn đạt gợi trước ý nghĩa biểu tượng của bức màn trong các bản văn Kinh Thánh về sau.
  rationale: Câu này chỉ mô tả vật liệu và kỹ thuật làm màn. Bản dịch cần giữ phạm vi phát ngôn của câu, không đưa diễn giải thần học hậu kỳ vào chính văn.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và có tính chỉ dẫn. Dùng “Ngươi” để giữ lối xưng hô số ít trực tiếp trong lời truyền phán; dùng “chê-ru-bim” là thuật ngữ Kinh Thánh quen thuộc, không diễn giải bản thể của các hữu thể này.
