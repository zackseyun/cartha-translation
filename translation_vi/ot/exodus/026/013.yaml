base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: vi
  text: Phần dư ra trong chiều dài các tấm màn của lều—một cu-bít ở bên này và một cu-bít ở bên kia[a]—sẽ rủ xuống hai bên Đền Tạm[b] để che phủ Đền ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cu-bít phía này và một cu-bít phía kia.” Tiếng Hê-bơ-rơ lặp lại “cu-bít” cùng với các từ chỉ định, nói đến phần còn thừa ở mỗi bên.'
    reason: lexical_alternative
  - marker: b
    text: “Đền Tạm” dịch từ tiếng Hê-bơ-rơ mishkan, chỉ nơi ngự thánh nằm bên dưới lớp lều phủ.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  choice: một cu-bít
  rationale: אַמָּה là đơn vị đo chiều dài tiêu chuẩn. Dùng “một cu-bít” tự nhiên trong tiếng Việt và để ngữ cảnh “phần dư ra” làm rõ đây là phần thừa.
- source_word: מִזֶּה ... מִזֶּה
  choice: ở bên này ... ở bên kia
  rationale: Hai cụm chỉ thị nói đến hai phía đối diện của cấu trúc; cách diễn đạt này vừa sát nghĩa vừa tự nhiên.
- source_word: בָּעֹדֵף
  choice: phần dư ra
  rationale: Từ này chỉ phần còn thừa; ở đây là chiều dài màn vượt quá kích thước của Đền Tạm.
- source_word: אֹרֶךְ
  choice: chiều dài
  rationale: Thuật ngữ không gian trực tiếp, phù hợp với ngữ cảnh xây dựng.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: các tấm màn của lều
  rationale: יְרִיעֹת là các tấm màn hoặc tấm vải; הָאֹהֶל xác định chúng thuộc lớp lều. Cách dịch này giữ rõ mối quan hệ sở hữu và hình ảnh kiến trúc.
- source_word: יִהְיֶה סָרוּחַ
  choice: sẽ rủ xuống
  rationale: Diễn tả phần vật liệu thừa buông hoặc thõng xuống ở hai bên; “rủ xuống” truyền đạt rõ hình ảnh vật lý.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: hai bên Đền Tạm
  rationale: Số nhiều צִדֵּי chỉ các bên; trong ngữ cảnh này là hai phía. “Đền Tạm” là thuật ngữ tiếng Việt quen thuộc cho מִשְׁכָּן, nơi ngự thánh bên dưới lớp lều phủ.
- source_word: לְכַסֹּתוֹ
  choice: để che phủ Đền ấy
  rationale: Động từ nguyên mẫu chỉ mục đích. Lặp danh từ bằng “Đền ấy” giúp tránh đại từ mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của hậu tố giống đực số ít trong לְכַסֹּתוֹ
  choice: Đền Tạm (“Đền ấy”)
  alternative: toàn bộ cấu trúc lều
  rationale: Hậu tố gần nhất và phù hợp về ngữ pháp quy chiếu đến הַמִּשְׁכָּן. Bản dịch làm rõ quy chiếu mà không thêm ý nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cu-bít” để giữ nguyên đơn vị cổ; “Đền Tạm” là cách gọi quen thuộc trong tiếng Việt. Cấu trúc câu được sắp xếp lại để phần dư và công dụng che phủ hiện rõ, trong khi vẫn giữ hai lần nhấn mạnh “bên này ... bên kia” của nguyên văn.
