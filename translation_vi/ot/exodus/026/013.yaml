  source_fidelity: 'Bản dịch chuyển đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: phần chiều dài dư của các tấm màn lều, một cu-bít ở mỗi phía, việc rủ xuống ở hai bên mishkan, và mục đích che phủ cấu trúc ấy. Việc đưa cụm “Phần dư ra...” lên đầu câu là tái sắp xếp tự nhiên trong tiếng Việt, không làm đổi nghĩa.'
