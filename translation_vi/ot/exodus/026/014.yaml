  yaml_path: translation/ot/exodus/026/014.yaml
  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: vi
  text: Ngươi phải làm cho lều một tấm phủ bằng da chiên đực nhuộm đỏ, và một tấm phủ bằng da ta-khát ở bên trên[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ “ta-khát” không rõ nghĩa. Từ này có thể chỉ một loài vật cụ thể hoặc một loại da bền; các cách dịch được đề xuất gồm “da thuộc hảo hạng”, “da cá heo” và “da bò biển”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng Qal hoàn thành có liên từ trong chuỗi chỉ thị mang lực mệnh lệnh; cách dịch này giữ rõ sắc thái truyền lệnh và phù hợp văn phong chỉ dẫn.
- source_word: מִכְסֶה
  choice: một tấm phủ
  rationale: Danh từ chỉ lớp che phủ hoặc bảo vệ; “tấm phủ” tự nhiên và cụ thể trong ngữ cảnh dựng Lều.
- source_word: לָאֹהֶל
  choice: cho Lều
  rationale: אֹהֶל có nghĩa trực tiếp là “lều”; viết hoa “Lều” giúp nhận diện công trình thánh trong ngữ cảnh mà không thay bằng thuật ngữ diễn giải rộng hơn.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: da chiên đực nhuộm đỏ
  rationale: Cụm từ nói đến da của chiên đực đã được làm đỏ; “nhuộm đỏ” diễn đạt tự nhiên tình trạng da đã qua xử lý.
- source_word: וּמִכְסֵה
  choice: và ... một tấm phủ
  rationale: Giữ phép lặp của nguyên văn để chỉ lớp phủ thứ hai, không thêm ý “một tấm khác” vốn không được nói rõ.
- source_word: עֹרֹת תְּחָשִׁים
  choice: da ta-khát
  rationale: Danh tính תְּחָשִׁים không chắc chắn; phiên âm từ Hê-bơ-rơ tránh quyết đoán đó là một loài vật hay một loại da cụ thể.
- source_word: מִלְמָעְלָה
  choice: bên trên
  rationale: Diễn đạt vị trí của lớp phủ ngoài cùng, đồng thời không thêm đại từ chỉ định không có trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ngươi” để phản ánh lời truyền trực tiếp cho một người trong mạch văn luật lệ; giữ “ta-khát” bằng phiên âm và giải thích ở chú thích nhằm bảo toàn sự bất định từ vựng của nguyên bản.
