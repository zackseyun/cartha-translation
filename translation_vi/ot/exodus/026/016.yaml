  text: The length of each frame shall be ten cubits[a], and the width of each frame one and a half cubits.
translation:
  language: vi
  text: Mỗi khung[a] dài mười cu-bít và rộng một cu-bít rưỡi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch từ Hê-bơ-rơ קֶרֶשׁ theo cách truyền thống hơn là “tấm ván”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶשׁ
  choice: khung
  rationale: Trong ngữ cảnh dựng Đền Tạm, từ này chỉ một bộ phận đứng chịu lực. “Khung” diễn đạt chức năng kết cấu bằng tiếng Việt hiện đại mà không xác định quá mức hình dạng; “tấm ván” vẫn là một khả năng dịch truyền thống.
- source_word: עֶשֶׂר אַמּוֹת
  choice: mười cu-bít
  rationale: Giữ nguyên đơn vị đo cổ thay vì quy đổi sang đơn vị hiện đại, nhờ đó bảo toàn độ chính xác hình thức của nguồn Hê-bơ-rơ.
- source_word: אֹרֶךְ
  choice: dài
  rationale: Dùng tính từ tự nhiên trong tiếng Việt khi mô tả kích thước, tương ứng với danh từ “chiều dài” trong nguyên văn.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: một cu-bít rưỡi
  rationale: Cách nói tự nhiên trong tiếng Việt, truyền đạt chính xác số đo một cu-bít cộng thêm nửa cu-bít.
- source_word: רֹחַב
  choice: rộng
  rationale: Cách diễn đạt hiện đại, rõ ràng cho kích thước bề ngang.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: mỗi khung
  rationale: Danh từ số ít có mạo từ đi với אֶחָד nói đến kích thước áp dụng cho từng cấu kiện; “mỗi khung” thể hiện tự nhiên ý phân phối ấy trong tiếng Việt.
