  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: vi
  text: Hãy làm năm mươi móc cài bằng đồng[a], luồn các móc cài ấy vào các vòng, rồi nối lều lại để thành một.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ נְחֹשֶׁת có thể chỉ đồng đỏ hoặc đồng thiếc, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: móc cài bằng đồng
  rationale: קַרְסִים là những chi tiết dùng để gắn các tấm phủ với nhau; “móc cài” diễn đạt rõ chức năng này. נְחֹשֶׁת có thể chỉ đồng đỏ hoặc hợp kim đồng, nên bản chính dùng từ bao quát “đồng” và ghi chú sự bất định.
- source_word: חֲמִשִּׁים
  choice: năm mươi
  rationale: Số từ trực tiếp bổ nghĩa cho các móc cài.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: luồn các móc cài ấy vào các vòng
  rationale: Dạng khiến khiến của בוא tại đây nói đến việc đưa các móc cài vào đúng vị trí trong các vòng; “luồn ... vào” tự nhiên và cụ thể trong ngữ cảnh lắp ráp.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: nối lều lại
  rationale: חבר có nghĩa là nối hoặc gắn kết; הָאֹהֶל chỉ toàn bộ lều được tạo thành từ các phần phủ đang được liên kết.
- source_word: וְהָיָה אֶחָד
  choice: để thành một
  rationale: Diễn đạt kết quả của việc nối các phần, đồng thời giữ nguyên ý đơn nhất ngắn gọn của tiếng Hê-bơ-rơ.
