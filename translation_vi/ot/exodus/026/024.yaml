revisions:
- from: Hai tấm ván ấy phải ghép đôi với nhau từ phía dưới[a], và cùng khít lại ở đầu trên, đến chiếc khoen duy nhất[b]. Cả hai tấm đều phải làm như vậy; chúng sẽ dùng cho hai góc.
  to: Hai tấm ván ấy phải ghép đôi với nhau ở phía dưới[a], và ở đầu trên, cả hai phải được hoàn chỉnh đến một chiếc khoen[b]. Cả hai tấm đều phải làm như vậy; chúng sẽ dùng cho hai góc.
  rationale: 'Sửa để giữ sự mơ hồ của mô tả kết cấu Hê-bơ-rơ: tránh hiểu “một chiếc khoen” là khoen duy nhất trong toàn bộ cấu trúc, và tránh diễn giải תַמִּים là một kiểu ghép “khít” cụ thể. Các mệnh đề còn lại được giữ sát nguyên văn và tự nhiên trong tiếng Việt hiện đại.'
  reviewer_model: gpt-5.6-terra
