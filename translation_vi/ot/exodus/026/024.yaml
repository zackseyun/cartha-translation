base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: vi
  text: Hai tấm ván ấy phải ghép đôi với nhau ở phía dưới[a], và ở đầu trên, cả hai phải được hoàn chỉnh đến một chiếc khoen[b]. Cả hai tấm đều phải làm như vậy; chúng sẽ dùng cho hai góc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải thành từng cặp ở phía dưới” hoặc “phải tương ứng với nhau ở phía dưới.” Tiếng Hê-bơ-rơ mô tả hai tấm ván tạo thành một cặp.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ này có thể hiểu là “đến chiếc khoen một/chiếc khoen duy nhất” hoặc “đến chiếc khoen thứ nhất.” Có lẽ nó chỉ chiếc khoen nối cặp ván ở đầu trên; nguyên văn không xác định chắc chắn cách hiểu kỹ thuật.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: ghép đôi với nhau
  rationale: Diễn đạt hai tấm ván tạo thành một cặp tương ứng trong kết cấu; tự nhiên hơn cách dịch sát như “sinh đôi”.
- source_word: מִלְּמַטָּה
  choice: từ phía dưới
  rationale: Giữ sắc thái hướng xuất phát của giới từ מִן, đồng thời phù hợp với lời chỉ dẫn về kết cấu.
- source_word: וְיַחְדָּו
  choice: cùng
  rationale: Thể hiện hai tấm ván kết hợp với nhau như một đơn vị.
- source_word: תַמִּים
  choice: khít lại
  rationale: Trong ngữ cảnh đóng dựng, từ này chỉ sự hoàn chỉnh, liền khít của kết cấu chứ không nói về sự hoàn hảo đạo đức.
- source_word: עַל רֹאשׁוֹ
  choice: ở đầu trên
  rationale: רֹאשׁ chỉ đầu hoặc phần trên cùng; “đầu trên” vừa gần hình ảnh Hê-bơ-rơ vừa rõ trong ngữ cảnh kiến trúc.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: đến chiếc khoen duy nhất
  rationale: Giữ nghĩa số đếm “một/duy nhất” thay vì quyết đoán rằng đây là chiếc khoen “thứ nhất”; “khoen” phù hợp với bộ phận liên kết trong Đền Tạm.
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: Cả hai tấm đều phải làm như vậy
  rationale: Chuyển lời chỉ dẫn sang tiếng Việt tự nhiên mà vẫn giữ ý cùng một cách làm áp dụng cho cả hai.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: dùng cho hai góc
  rationale: מִקְצֹעֹת có thể chỉ các góc hoặc chỗ nối góc; bản dịch chính giữ cách gọi rộng, không thêm “phía sau” vốn do văn cảnh rộng hơn cung cấp.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn kiến trúc trang trọng nhưng dễ hiểu. Dùng “tấm ván”, “ghép đôi”, “khít lại” và “khoen” để người đọc hiện đại hình dung được kết cấu, đồng thời tránh xác định quá mức kỹ thuật ghép ván mà nguyên văn không nói rõ.
