  - severity: low
    issue: Chú thích a dùng cụm từ không tự nhiên.
    rationale: “Phần buông thừa còn lại” không phải cách nói tự nhiên. Một phương án thay thế nên phản ánh nghĩa “phần nhô/buông ra” của סֶרַח mà vẫn là tiếng Việt thông dụng.
  - severity: low
    issue: Vị trí neo của chú thích b chưa tối ưu.
    rationale: Nội dung chú thích giải thích sự phân biệt giữa “Lều” và “Đền Tạm”; đặt ký hiệu ngay sau “Đền Tạm” thay vì sau dấu chấm giúp liên kết rõ hơn.
