base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: vi
  text: Phần vải thừa còn lại của các tấm màn Lều[a]—tức nửa tấm màn còn thừa—phải buông phủ mặt sau Đền Tạm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phần nhô ra còn lại từ các tấm màn của Lều.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ phân biệt “Lều” (lớp phủ bằng các tấm màn) với “Đền Tạm” (cấu trúc nơi ngự).
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: phần dư
  rationale: Danh từ này chỉ phần vật liệu dư ra hoặc nhô ra. “Phần dư” diễn đạt rõ lượng vải thừa; động từ “rủ xuống” ở cuối câu làm rõ chức năng không gian của phần ấy.
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: còn lại / còn thừa
  rationale: Hai phân từ cùng gốc chỉ phần còn lại vì vượt quá kích thước cần thiết. Cách dịch hơi biến đổi để câu tiếng Việt tự nhiên mà vẫn giữ sự lặp ý của nguyên văn.
- source_word: יְרִיעֹת
  choice: các tấm màn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ những tấm vải lớn dùng làm lớp phủ; “các tấm màn” vừa rõ nghĩa vừa giữ hình ảnh kiến trúc.
- source_word: הָאֹהֶל
  choice: Lều
  rationale: Ở đây từ này chỉ lớp lều phủ, khác với מִשְׁכָּן là toàn bộ nơi ngự/cấu trúc Đền Tạm. Viết hoa “Lều” giúp nhận ra đây là thành phần được gọi tên trong công trình thánh.
- source_word: חֲצִי הַיְרִיעָה
  choice: nửa tấm màn
  rationale: Cụm từ nói đến một nửa của một tấm màn đơn lẻ; cách diễn đạt này ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: תִּסְרַח
  choice: phải rủ xuống
  rationale: Động từ mô tả phần vải thừa buông hoặc kéo dài xuống. “Rủ xuống” tái hiện rõ hình ảnh vật lý; “phải” phù hợp sắc thái chỉ dẫn của dạng động từ trong văn cảnh.
- source_word: עַל אֲחֹרֵי
  choice: xuống phía sau
  rationale: Cụm giới từ xác định phần vải nằm phủ hoặc buông ở mặt sau. Kết hợp với “rủ xuống”, “phía sau” tự nhiên hơn trong tiếng Việt mà vẫn giữ quan hệ không gian.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ chỉ nơi ngự/cấu trúc thánh trong đồng vắng. “Đền Tạm” là cách gọi tiếng Việt quen thuộc và phân biệt được với “Lều” ở vế trước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc giải thích đồng vị của nguyên văn bằng dấu gạch ngang; dùng “Lều” và “Đền Tạm” để bảo tồn sự phân biệt thuật ngữ trong tiếng Hê-bơ-rơ.
