revisions:
- from: Cũng hãy giữ Lễ Thu Hoạch[a], dâng hoa lợi đầu mùa từ công việc của ngươi, tức những gì ngươi gieo ngoài đồng; và Lễ Thu Gom[c] vào lúc năm sắp qua[b], khi ngươi thu gom thành quả công việc của mình từ ngoài đồng về.
  to: Cũng hãy giữ Lễ Thu Hoạch[a], là hoa lợi đầu mùa từ công sức ngươi trong việc gieo trồng ngoài đồng; và Lễ Thu Gom[c] vào cuối năm[b], khi ngươi thu gom từ ngoài đồng về sản vật do công sức ngươi làm ra.
  rationale: Bỏ phần thêm ý “dâng”; chuyển cách diễn đạt về hoa lợi và sản vật do công sức làm ra để phản ánh nghĩa nông nghiệp theo văn cảnh của מַעֲשֶׂיךָ; dùng nhất quán đại từ “ngươi”; và thay “năm sắp qua” bằng “cuối năm”, đồng thời giữ sắc thái sát chữ trong chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:48:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hai kỳ lễ và khung thời gian của chúng, nhưng thêm động từ “dâng” không có trong tiếng Hê-bơ-rơ. Từ מַעֲשֶׂיךָ trong ngữ cảnh này chỉ thành quả/công sức lao động nông nghiệp; cần diễn đạt sao cho không biến câu thành một mệnh lệnh dâng lễ vật vốn không được nêu trực tiếp ở đây. “Năm sắp qua” cũng hẹp hơn בְּצֵאת הַשָּׁנָה, vốn chỉ thời điểm cuối năm.
  naturalness: “Lễ Thu Hoạch” và “Lễ Thu Gom” có thể hiểu được trong tiếng Việt hiện đại. Tuy nhiên, “thành quả công việc của mình” làm đổi đại từ từ “ngươi” sang “mình”, và cụm “thu gom thành quả công việc” không tự nhiên trong bối cảnh nông nghiệp. “Thu gom sản vật do công sức ngươi làm ra từ ngoài đồng về” tự nhiên và rõ hơn.
  terminology: Giữ “Lễ” cho חַג, “hoa lợi đầu mùa” cho בִּכּוּרֵי, và “Lễ Thu Gom” cho הָאָסִף. Dùng “công sức” để biểu đạt מַעֲשֶׂיךָ theo nghĩa thành quả lao động trong ngữ cảnh, không áp đặt ý nghĩa nghi lễ “dâng”.
  issues:
  - severity: medium
    issue: Thêm ý “dâng” trong “dâng hoa lợi đầu mùa”.
    rationale: Nguyên văn chỉ gọi Lễ Thu Hoạch là “hoa lợi đầu mùa của công sức ngươi”; không có động từ yêu cầu dâng trong câu này.
  - severity: medium
    issue: Diễn đạt lần hai của מַעֲשֶׂיךָ không tự nhiên và không nhất quán đại từ.
    rationale: “thành quả công việc của mình” vừa lẫn “ngươi/mình”, vừa không phải đối tượng thường được “thu gom” từ đồng. Trong ngữ cảnh, sản vật do công sức lao động làm ra diễn đạt đúng và tự nhiên hơn.
  - severity: low
    issue: “vào lúc năm sắp qua” có sắc thái trước thời điểm cuối năm.
    rationale: בְּצֵאת הַשָּׁנָה có nghĩa thành ngữ là “vào cuối năm”; chú thích có thể giữ hình ảnh sát chữ “khi năm đi ra”.
