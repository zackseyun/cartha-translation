  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: vi
  text: Cũng hãy giữ Lễ Thu Hoạch[a], là hoa lợi đầu mùa từ công sức ngươi trong việc gieo trồng ngoài đồng; và Lễ Thu Gom[c] vào cuối năm[b], khi ngươi thu gom từ ngoài đồng về sản vật do công sức ngươi làm ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “Lễ hội”; từ Hê-bơ-rơ חַג được dùng cho cả hai kỳ lễ trong câu này.
    reason: lexical_alternative
  - marker: b
    text: Hê-bơ-rơ dịch sát là “khi năm đi ra.”
    reason: lexical_alternative
  - marker: c
    text: “Thu Gom” chỉ kỳ lễ đánh dấu việc thu gom sản vật từ ngoài đồng về.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: Lễ
  rationale: “Lễ” là cách gọi tự nhiên, trang trọng cho một kỳ lễ tôn giáo; dùng nhất quán ở cả hai lần xuất hiện.
- source_word: הַקָּצִיר
  choice: Thu Hoạch
  rationale: Diễn đạt danh từ chỉ việc gặt hái và phù hợp làm tên của kỳ lễ.
- source_word: בִּכּוּרֵי
  choice: hoa lợi đầu mùa
  rationale: Chỉ phần sản vật đầu tiên của mùa vụ; cách diễn đạt này giữ rõ sắc thái nông nghiệp và ý niệm dâng phần đầu mùa.
- source_word: מַעֲשֶׂיךָ
  choice: công việc của ngươi / thành quả công việc của mình
  rationale: Nghĩa cơ bản là “công việc, việc làm”; trong ngữ cảnh nông nghiệp, lần thứ hai dùng “thành quả công việc” để câu tiếng Việt tự nhiên mà không thu hẹp hoàn toàn thành “nông sản”.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: tức những gì ngươi gieo ngoài đồng
  rationale: Làm rõ quan hệ giải thích trong ngữ cảnh, đồng thời giữ lời xưng hô trực tiếp ngôi thứ hai.
- source_word: הָאָסִף
  choice: Thu Gom
  rationale: Giữ hình ảnh gom sản vật vào kho và chức năng như tên kỳ lễ; chú thích giải thích ý nghĩa văn hóa.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: vào lúc năm sắp qua
  rationale: Bám sát hình ảnh Hê-bơ-rơ “khi năm đi ra” hơn cách diễn giải đơn thuần là “cuối năm”, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: בְּאָסְפְּךָ
  choice: khi ngươi thu gom ... về
  rationale: Diễn đạt tự nhiên giá trị thời gian của cấu trúc nguyên mẫu với giới từ và hình ảnh đưa sản vật từ đồng về.
- source_word: מִן הַשָּׂדֶה
  choice: từ ngoài đồng về
  rationale: Thể hiện nguồn xuất phát của những gì được thu gom; “về” làm rõ chuyển động ngầm trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ngươi” để giữ lời truyền trực tiếp ở số ít của nguyên văn. Viết hoa tên hai kỳ lễ. Các dấu chú thích đều được đặt ngay trong chính văn.
