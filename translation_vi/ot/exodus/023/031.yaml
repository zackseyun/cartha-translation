  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: vi
  text: Ta sẽ ấn định ranh giới của ngươi từ Biển Đỏ[a] đến Biển của dân Phi-li-tin, và từ hoang mạc đến con sông[b]; vì Ta sẽ trao cư dân trong xứ vào tay các ngươi, và ngươi sẽ đuổi họ khỏi trước mặt ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “Biển Sậy.”'
    reason: lexical_alternative
  - marker: b
    text: Tức là sông Ơ-phơ-rát.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: Ta sẽ ấn định
  rationale: Trong lời hứa của Đức Chúa Trời, dạng động từ này mang ý nghĩa tương lai. “Ấn định” diễn đạt tự nhiên hành động thiết lập ranh giới.
- source_word: גְּבֻלְךָ
  choice: ranh giới của ngươi
  rationale: גְּבוּל chỉ đường biên hay giới hạn địa lý; “ranh giới” chính xác hơn từ rộng nghĩa như “lãnh thổ”.
- source_word: מִיַּם סוּף
  choice: từ Biển Đỏ[a]
  rationale: “Biển Đỏ” là địa danh quen thuộc trong tiếng Việt; nghĩa sát mặt chữ “Biển Sậy” được ghi ở chú thích để bảo toàn dữ liệu từ nguyên.
- source_word: יָם פְּלִשְׁתִּים
  choice: biển của người Phi-li-tin
  rationale: Giữ cách gọi theo quan hệ địa lý-dân tộc của nguyên văn, thay vì thay trực tiếp bằng tên hiện đại “Địa Trung Hải”.
- source_word: וּמִמִּדְבָּר
  choice: và từ hoang mạc
  rationale: “Hoang mạc” diễn đạt vùng hoang vắng, khô cằn mà מִדְבָּר có thể chỉ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: הַנָּהָר
  choice: Sông Cả[b]
  rationale: Cụm có mạo từ, nghĩa đen là “con sông”, được dùng như một danh xưng quy ước chỉ sông Ơ-phơ-rát. “Sông Cả” giữ sắc thái danh xưng của nguyên văn, còn chú thích xác định địa danh.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu cơ sở cho lời hứa về ranh giới và phù hợp mạch lập luận của câu.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: Ta sẽ trao ... vào tay các ngươi
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ “trao vào tay”, nghĩa là đặt dưới quyền kiểm soát của họ.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: cư dân trong xứ
  rationale: Diễn đạt gọn và tự nhiên phân từ chỉ những người đang cư ngụ trong xứ.
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: và ngươi sẽ đuổi họ
  rationale: גרשׁ mang nghĩa xua đuổi hoặc trục xuất; “đuổi” trực tiếp và tự nhiên trong ngữ cảnh.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt mình
  rationale: Giữ hình ảnh “khỏi trước mặt” của nguyên văn nhưng dùng đại từ phản thân để câu tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Địa danh יַם־סוּף
  choice: Biển Đỏ
  alternative: Biển Sậy
  rationale: Đây chủ yếu là vấn đề từ vựng-địa lý. Bản chính dùng tên quen thuộc “Biển Đỏ”, đồng thời chú thích bảo lưu cách hiểu sát mặt chữ.
- issue: Sự chuyển đổi số của đại từ chỉ người nghe
  choice: Giữ “ngươi” ở גְּבֻלְךָ, וְגֵרַשְׁתָּמוֹ và מִפָּנֶיךָ, nhưng dùng “các ngươi” ở בְּיֶדְכֶם
  alternative: Đồng nhất tất cả thành số ít hoặc số nhiều trong tiếng Việt
  rationale: Nguyên văn chuyển từ số ít tập thể sang số nhiều rồi trở lại số ít. Bản dịch giữ sự chuyển đổi này thay vì âm thầm làm phẳng cấu trúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/ngươi” phù hợp lời phán trực tiếp của Đức Chúa Trời trong văn cảnh Kinh Thánh; cách gọi “biển của người Phi-li-tin” và “Sông Cả” giữ nét địa lý của nguyên văn. Mọi dấu chú thích đều được đặt ngay sau cụm từ liên quan.
