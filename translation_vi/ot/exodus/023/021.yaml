revisions:
- from: Hãy cẩn trọng trước mặt vị ấy và lắng nghe tiếng vị ấy. Đừng chống nghịch vị ấy, vì vị ấy sẽ không tha sự vi phạm của các ngươi, bởi danh Ta ở trong vị ấy[a].
  to: Hãy cẩn trọng trước mặt người ấy và lắng nghe tiếng người ấy. Đừng phản nghịch người ấy, vì người ấy sẽ không tha thứ cho sự vi phạm của các ngươi, bởi danh Ta ở trong người ấy[a].
  rationale: Bản sửa thay các cách diễn đạt gượng bằng tiếng Việt hiện đại tự nhiên hơn, đặc biệt là "người ấy" và "tha thứ cho", nhưng vẫn giữ số ít tập hợp của "sự vi phạm", sắc thái nghiêm trọng của "phản nghịch", và sự mơ hồ thần học trong "danh Ta ở trong người ấy". Chú thích được mở rộng để phản ánh các phương án từ audit trail mà không giải quyết bản thể của sứ giả.
