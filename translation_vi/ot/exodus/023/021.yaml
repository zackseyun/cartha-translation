base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: vi
  text: Hãy cẩn trọng trước mặt người ấy và lắng nghe tiếng người ấy. Đừng phản nghịch người ấy, vì người ấy sẽ không tha thứ cho sự vi phạm của các ngươi, bởi danh Ta ở trong người ấy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “danh Ta ở nơi người ấy” hoặc “danh Ta ở trên người ấy”; diễn ý hơn: “người ấy mang danh Ta”. Cụm từ này cho thấy thẩm quyền của Đức Chúa Trời được ủy thác, nhưng câu này không xác định rõ bản tính chính xác của sứ giả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: Hãy cẩn trọng trước mặt vị ấy
  rationale: Mệnh lệnh Nifal của שׁמר mang ý cảnh giác, thận trọng; מִפָּנָיו theo sát nghĩa là “trước mặt vị ấy”. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại mà vẫn giữ sắc thái cảnh báo và tương quan trực tiếp với sứ giả.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: và lắng nghe tiếng vị ấy
  rationale: שׁמע với בְּקוֹל thường hàm ý vâng theo, nhưng “lắng nghe tiếng” giữ được hình ảnh nguyên ngữ và để ngữ cảnh truyền đạt sắc thái tuân phục, thay vì diễn giải hoàn toàn thành “vâng lời”.
- source_word: אַל תַּמֵּר בּוֹ
  choice: Đừng chống nghịch vị ấy
  rationale: מרה chỉ sự phản kháng, bất phục hoặc nổi loạn trước thẩm quyền. “Chống nghịch” giữ được mức độ nghiêm trọng và sắc thái giao ước, đồng thời phù hợp với văn phong trang trọng.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: vị ấy sẽ không tha sự vi phạm của các ngươi
  rationale: נשא khi đi với tội lỗi hay sự vi phạm có thể mang nghĩa cất đi, dung thứ hoặc tha thứ. “Không tha” diễn đạt rõ sắc thái miễn trừ, còn danh từ số ít tập hợp “sự vi phạm” phản ánh פִשְׁעֲכֶם mà không lặp lại động từ “chống nghịch”.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: danh Ta ở trong vị ấy
  rationale: בְּקִרְבּוֹ có nghĩa đen là “ở trong/ở giữa bên trong vị ấy”. Bản dịch giữ nguyên phát biểu cô đọng và mạnh mẽ của tiếng Hê-bơ-rơ, không diễn giải quá mức mối liên hệ giữa danh Đức Chúa Trời và sứ giả.
theological_decisions:
- issue: Bản tính của sứ giả và ý nghĩa câu “danh Ta ở trong vị ấy”
  choice: Giữ cách nói gần nguyên ngữ, không xác định bản thể chính xác của sứ giả.
  alternative: Có thể hiểu sứ giả là đại diện được Đức Chúa Trời trao trọn thẩm quyền và mang danh Ngài, hoặc là sự hiện hiện trực tiếp của chính Đức Chúa Trời.
  rationale: Câu này khẳng định mạnh mẽ thẩm quyền thần thượng gắn với sứ giả nhưng không trực tiếp giải thích bản thể của vị ấy. Vì vậy, bản dịch bảo toàn sự căng thẳng thần học thay vì áp đặt một kết luận giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vị ấy” biểu thị sự kính trọng thích hợp đối với sứ giả mà không tự nó quyết định bản tính thần học của nhân vật; “các ngươi” giữ lời xưng hô số nhiều trực tiếp và sắc thái long trọng của diễn ngôn giao ước.
