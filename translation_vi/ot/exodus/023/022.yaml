  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: vi
  text: Nhưng nếu ngươi thật sự nghe theo tiếng của vị ấy[a] và làm mọi điều Ta phán[b], thì Ta sẽ thù nghịch với những kẻ thù nghịch với ngươi và đối địch với những kẻ đối địch với ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chắc chắn lắng nghe tiếng của vị ấy.” Tiếng Hê-bơ-rơ dùng nguyên thể tuyệt đối cùng với động từ hữu hạn để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: Câu chuyển từ “tiếng của vị ấy” sang “Ta phán,” qua đó giữ mối liên hệ gần gũi giữa vị sứ giả và Đức Chúa Trời trong văn cảnh.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: Nhưng nếu
  rationale: Diễn đạt tự nhiên sắc thái điều kiện tương phản mạnh với lời cảnh báo ngay trước đó.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: thật sự nghe theo
  rationale: Cấu trúc nguyên thể tuyệt đối đi cùng động từ hữu hạn nhấn mạnh hành động; “nghe theo” giữ cả ý nghe và vâng phục, còn “thật sự” chuyển tải sắc thái nhấn mạnh mà không cường giải thành một mức độ cụ thể.
- source_word: בְּקֹלוֹ
  choice: tiếng của vị ấy
  rationale: Giữ hình ảnh “tiếng” và đại từ ngôi thứ ba chỉ vị sứ giả trong văn cảnh; “vị ấy” trang trọng, tự nhiên và không đồng nhất hóa tường minh vị sứ giả với Đức Chúa Trời.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: và làm mọi điều Ta phán
  rationale: Giữ nguyên sự chuyển đổi từ tiếng của vị ấy sang lời phán ở ngôi thứ nhất của Đức Chúa Trời.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: Ta sẽ thù nghịch với những kẻ thù nghịch ngươi
  rationale: Dùng cùng một họ từ trong tiếng Việt để phản ánh quan hệ từ nguyên giữa động từ và danh từ Hê-bơ-rơ, đồng thời diễn đạt sự đối nghịch mang tính quan hệ.
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: và đối địch với những kẻ đối địch ngươi
  rationale: Giữ phép song hành và lối chơi chữ giữa động từ với danh từ cùng gốc, đồng thời phân biệt nhẹ với vế “thù nghịch” phía trước.
theological_decisions:
- issue: Sự chuyển đổi từ “tiếng của vị ấy” sang “Ta phán”
  choice: Giữ nguyên sự chuyển đổi đại từ và chủ thể phát ngôn như bản Hê-bơ-rơ.
  alternative: Đồng nhất cả hai vế là lời của vị sứ giả, hoặc sửa cả hai thành lời trực tiếp của Đức Chúa Trời.
  rationale: Cách dịch này bảo toàn mối liên hệ gần gũi nhưng không được giải thích dứt khoát giữa tiếng của vị sứ giả và lời của Đức Chúa Trời trong văn cảnh, thay vì âm thầm hóa giải căng thẳng thần học của câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “ngươi” phù hợp với lời phán trực tiếp ở số ít trong văn mạch giao ước; “Ta” được viết hoa theo quy ước tiếng Việt khi chỉ Đức Chúa Trời. Hai cặp “thù nghịch/kẻ thù nghịch” và “đối địch/kẻ đối địch” có chủ ý bảo toàn phép song hành và lặp gốc từ của nguyên văn.
