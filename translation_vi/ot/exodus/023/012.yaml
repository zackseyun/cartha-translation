  to: Trong sáu ngày, ngươi phải làm công việc của ngươi; nhưng đến ngày thứ bảy, ngươi phải ngừng lại[a], để bò và lừa của ngươi được nghỉ, con trai của nữ tỳ của ngươi[b] và người ngoại kiều[c] được lại sức.
  rationale: Bản sửa giữ nguyên nội dung và các phân biệt từ vựng của nguyên văn, đồng thời loại bỏ diễn giải không chắc chắn trong chú thích b. Câu được chỉnh nhẹ để liên kết các chủ ngữ theo phép nối tiếp của tiếng Hê-bơ-rơ và dùng sở hữu ngôi thứ hai nhất quán.
