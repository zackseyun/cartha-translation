  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: vi
  text: Trong sáu ngày, ngươi phải làm công việc của ngươi; nhưng đến ngày thứ bảy, ngươi phải ngừng lại[a], để bò và lừa của ngươi được nghỉ, con trai của nữ tỳ của ngươi[b] và người ngoại kiều[c] được lại sức.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngươi phải nghỉ”; động từ Hê-bơ-rơ trước hết có nghĩa là “ngừng, chấm dứt.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “con trai của nữ tỳ của ngươi.” “Nữ tỳ” chỉ người phụ nữ thuộc thân phận phục dịch/lệ thuộc trong bối cảnh xã hội cổ.'
    reason: cultural_note
  - marker: c
    text: “Người ngoại kiều” là người ngoại quốc cư trú giữa dân Y-sơ-ra-ên và sống dưới trật tự xã hội, pháp lý của họ.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Trong sáu ngày
  rationale: Diễn đạt khoảng thời gian kéo dài sáu ngày bằng cách nói tự nhiên trong tiếng Việt.
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: ngươi phải làm công việc của mình
  rationale: Thể chưa hoàn thành trong văn luật mang lực mệnh lệnh; “công việc” giữ nghĩa rộng của מַעֲשֶׂיךָ.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: nhưng đến ngày thứ bảy
  rationale: Liên từ tạo thế tương phản giữa sáu ngày làm việc và ngày thứ bảy; “đến” tự nhiên trong mạch thời gian tiếng Việt.
- source_word: תִּשְׁבֹּת
  choice: ngươi phải ngừng lại
  rationale: Giữ nghĩa cốt lõi của động từ שׁבת là chấm dứt, ngừng hoạt động, thay vì thu hẹp thành cảm giác thư giãn.
- source_word: לְמַעַן יָנוּחַ
  choice: để ... được nghỉ
  rationale: “Để” biểu thị mục đích; “được nghỉ” chuyển tải đúng nghĩa nghỉ ngơi của נוח trong ngữ cảnh súc vật lao động.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: bò và lừa của ngươi
  rationale: Tên gọi thông dụng, dễ hiểu cho hai gia súc; שׁוֹר trong ngữ cảnh này chỉ loài bò, thường là con vật dùng vào công việc.
- source_word: וְיִנָּפֵשׁ
  choice: được lại sức
  rationale: Động từ נפשׁ ở thể Niphal nói đến việc lấy lại hơi sức, hồi phục; “được lại sức” tự nhiên và cụ thể trong tiếng Việt.
- source_word: בֶּן אֲמָתְךָ
  choice: con trai của nữ tỳ ngươi
  rationale: Giữ rõ cả בֶּן là “con trai” và quan hệ xã hội được biểu thị bởi אָמָה, không diễn giải người này thành một hạng người khác.
- source_word: הַגֵּר
  choice: người ngoại kiều
  rationale: Chỉ người ngoại quốc cư trú lâu dài trong cộng đồng Y-sơ-ra-ên và thuộc phạm vi trật tự xã hội, pháp lý của họ; “người ngoại kiều” gọn và dễ hiểu hơn một cách dịch chỉ người xa lạ.
theological_decisions:
- issue: Cách dịch שׁבת trong luật về ngày thứ bảy
  choice: ngươi phải ngừng lại
  alternative: ngươi phải nghỉ
  rationale: Nghĩa trọng tâm là ngừng công việc; các vế sau mới nêu kết quả là sự nghỉ ngơi và hồi sức. Cách dịch này duy trì sự phân biệt đó.
- issue: Cách dịch địa vị xã hội גֵּר
  choice: người ngoại kiều
  alternative: khách lạ; người ngoại quốc cư trú
  rationale: Cụm từ phải biểu thị một người ngoại quốc đang sống trong cộng đồng, chứ không chỉ là khách qua đường hay người xa lạ nói chung; câu luật mở rộng quyền được nghỉ đến người cư trú dễ bị tổn thương này.
- issue: Quan hệ được diễn tả bởi בֶּן אֲמָתְךָ
  choice: con trai của nữ tỳ ngươi
  alternative: con của nữ tỳ ngươi
  rationale: Giữ giống nam được nêu đích danh trong בֶּן và không đồng nhất người con với chính nữ tỳ.
translation_notes:
  register: Văn phong luật giao ước trang trọng nhưng dễ hiểu. Đại từ “ngươi” giữ lối xưng hô số ít trực tiếp của nguyên văn và sắc thái Kinh Thánh; cấu trúc câu được làm tự nhiên bằng dấu chấm phẩy và cặp tương phản “trong sáu ngày ... nhưng đến ngày thứ bảy.”
