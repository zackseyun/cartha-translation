revisions:
- from: Con chớ loan truyền tin đồn giả dối.[a] Đừng tiếp tay cho kẻ gian ác để làm một nhân chứng bất công.[b]
  to: Bạn không được loan truyền tin thất thiệt.[a] Đừng tiếp tay cho kẻ gian ác để làm chứng cách bất công.[b]
  rationale: Bản sửa tránh thêm quan hệ xưng hô “con,” dùng cách diễn đạt hiện đại và bao quát hơn cho שֵׁמַע שָׁוְא, đồng thời làm rõ rằng tính chất bất công thuộc về việc làm chứng. Chú thích duy trì nghĩa đen của các thành ngữ và không loại bỏ sự mơ hồ có chủ ý của חָמָס.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:48:15Z'
review_pass:
  verdict: revise
  source_fidelity: Mệnh đề đầu truyền đạt đúng lệnh cấm lưu truyền שֵׁמַע שָׁוְא. Tuy nhiên, “tin đồn” thu hẹp שֵׁמַע vào tin truyền miệng, trong khi từ này có thể là tin tức/bản tin/lời đồn; “tin thất thiệt” bao quát và tự nhiên hơn. Mệnh đề hai phản ánh đúng ý không cộng tác với kẻ ác để trở thành עֵד חָמָס. “Nhân chứng bất công” có thể hiểu là một người bị đối xử bất công, chứ không nhất thiết là người làm chứng cách bất công.
  naturalness: “Con chớ” có sắc thái Kinh Thánh nhưng “con” thêm một quan hệ xưng hô không được nêu trong tiếng Hê-bơ-rơ. “Bạn không được” là lối nói hiện đại, rõ ràng, vẫn giữ số ít. “Làm chứng cách bất công” tự nhiên và xác định rõ hành vi làm chứng, thay cho cụm danh từ dễ mơ hồ “một nhân chứng bất công.” Chú thích a hiện có cụm “tin báo sai giả” không tự nhiên.
  terminology: Giữ “kẻ gian ác” cho רָשָׁע là phù hợp. Với חָמָס, bản văn chính nên tránh đồng nhất với “gian dối”; “cách bất công” thích hợp trong văn cảnh pháp lý, còn chú thích cần bảo tồn các nét nghĩa mạnh hơn như bạo lực/bạo ngược và hiểm độc.
  issues:
  - severity: medium
    issue: “Tin đồn giả dối” thu hẹp và hơi trùng nghĩa
    rationale: שֵׁמַע là điều được nghe, một tin tức/báo cáo/lời đồn; không chỉ là “tin đồn.” “Giả dối” cũng kém tự nhiên khi bổ nghĩa “tin đồn” so với “thất thiệt.”
  - severity: medium
    issue: “Một nhân chứng bất công” mơ hồ về vai trò ngữ nghĩa
    rationale: Cụm này có thể được hiểu là nhân chứng là đối tượng của sự bất công. Cần diễn đạt rằng người ấy làm chứng một cách bất công/hại người, là lực của עֵד חָמָס trong ngữ cảnh luật pháp.
  - severity: low
    issue: Chú thích a dùng “tin báo sai giả” không phải cách nói hiện đại tự nhiên
    rationale: Nên dùng “một tin thất thiệt” hoặc “một lời đồn sai trái,” đồng thời giải thích nghĩa đen của động từ.
