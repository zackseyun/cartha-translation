  text: לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל תָּ֤שֶׁת יָֽדְ/ךָ֙ עִם רָשָׁ֔ע לִ/הְיֹ֖ת עֵ֥ד חָמָֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: vi
  text: Bạn không được loan truyền tin thất thiệt.[a] Đừng tiếp tay cho kẻ gian ác để làm chứng cách bất công.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “mang một tin thất thiệt.” Động từ Hê-bơ-rơ có nghĩa đen là “nâng lên, mang”; với từ chỉ điều được nghe, ở đây nó có nghĩa là mang đi hoặc lưu truyền một tin tức/lời đồn.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “đặt tay mình với kẻ gian ác để trở thành một nhân chứng bạo lực.” “Tiếp tay” diễn tả thành ngữ chỉ sự cộng tác; từ được dịch là “bất công” cũng có thể chỉ bạo lực, hiểm độc hoặc điều sai trái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: loan truyền
  rationale: Động từ נָשָׂא có nghĩa cơ bản là “nâng, mang”; khi đi với שֵׁמַע, nó chỉ việc mang đi hoặc lưu truyền một điều nghe được. “Loan truyền” diễn đạt tự nhiên hành vi phổ biến tin ấy mà vẫn giữ hình ảnh chuyển tải.
- source_word: שֵׁמַע שָׁוְא
  choice: tin đồn giả dối
  rationale: שֵׁמַע là điều người ta nghe được, có thể là tin báo hay tin đồn; שָׁוְא mang nghĩa hư không, sai giả. “Tin đồn giả dối” phù hợp với lời cấm lưu truyền thông tin chưa đúng trong bối cảnh pháp lý.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: tiếp tay cho
  rationale: Cụm này dịch sát là “đặt tay mình với.” Thành ngữ tiếng Việt “tiếp tay cho” vừa giữ được hình ảnh bàn tay vừa diễn đạt rõ sự cộng tác vào việc sai trái.
- source_word: רָשָׁע
  choice: kẻ gian ác
  rationale: רָשָׁע có thể chỉ người gian ác hoặc người có tội trong ngữ cảnh pháp lý. “Kẻ gian ác” giữ sắc thái đạo đức-pháp lý mà không xác quyết rằng người ấy đã bị kết án.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: để làm một nhân chứng bất công
  rationale: עֵד là “nhân chứng”; חָמָס bao hàm bạo lực, điều sai trái và sự bất công tàn nhẫn. Trong bối cảnh xét xử, “nhân chứng bất công” diễn đạt lời chứng gây tổn hại cho công lý; chú thích giữ lại nghĩa mạnh và các khả năng khác của חָמָס.
- source_word: לֹא / אַל
  choice: chớ / đừng
  rationale: Cả hai cấu trúc đều là lời cấm. “Chớ” duy trì giọng luật lệ trang trọng ở mệnh đề đầu, còn “đừng” tự nhiên ở mệnh đề tiếp theo.
theological_decisions:
- issue: Dạng giống đực số ít trong lời luật dạy
  choice: Dùng đại từ số ít “con” và danh từ đại diện “kẻ gian ác”
  alternative: Nêu rõ “người đàn ông gian ác” hoặc dùng cách nói số nhiều
  rationale: Tiếng Hê-bơ-rơ dùng dạng giống đực số ít, nhưng trong tiếng Việt, “kẻ gian ác” tự nhiên, không buộc phải xác định giới tính và vẫn giữ số ít mang tính đại diện. “Con” phù hợp giọng luật giao ước mà không thêm nét nghĩa hệ phái.
- issue: Ý nghĩa của עֵד חָמָס trong bối cảnh pháp lý
  choice: nhân chứng bất công
  alternative: nhân chứng bạo lực; nhân chứng hiểm độc; nhân chứng gian dối
  rationale: חָמָס không chỉ đơn thuần có nghĩa “gian dối,” nhưng cách dịch sát “bạo lực” dễ bị hiểu là nhân chứng dùng vũ lực. “Bất công” giữ trọng tâm là lời chứng làm tổn hại công lý, còn chú thích bảo tồn trường nghĩa rộng và mạnh của từ gốc.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại và dễ hiểu. “Con chớ” giữ sắc thái lời giao ước ở số ít; “loan truyền” và “tiếp tay” là các cách nói tự nhiên trong tiếng Việt. Hai chú thích bảo tồn nghĩa đen và độ rộng ngữ nghĩa của các thành ngữ Hê-bơ-rơ.
