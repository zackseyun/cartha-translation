source:
  edition: WLC
  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: vi
  text: Phần đầu tiên của hoa lợi đầu mùa từ đất của con,[a] con phải đem vào nhà của Yahweh, Đức Chúa Trời của con. Con không được luộc một con dê con[b] trong sữa mẹ nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hoa lợi đầu mùa của đất con.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ dùng từ chỉ một con dê non.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: phần đầu mùa của hoa lợi
  rationale: Cụm kết hợp chỉ phần đầu tiên trong sản vật chín đầu mùa. Cách dịch này giữ được ý cụ thể của רֵאשִׁית mà không tự ý chuyển thành “phần tốt nhất”.
- source_word: אַדְמָתְךָ
  choice: từ đất mình
  rationale: אֲדָמָה nhấn mạnh đất canh tác, nhưng trong tiếng Việt, “hoa lợi từ đất mình” tự nhiên và rõ hơn “hoa lợi của đất mình”, đồng thời tránh hiểu “đất” chỉ là lãnh thổ.
- source_word: תָּבִיא
  choice: phải đem
  rationale: Thể vị hoàn thành dùng như mệnh lệnh pháp lý; “phải đem” truyền đạt rõ sức bắt buộc trong tiếng Việt hiện đại.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: nhà của Yahweh, Đức Chúa Trời của con
  rationale: Giữ hình ảnh “nhà”, không thu hẹp thành đền thờ xây bằng đá; dùng Yahweh cho danh giao ước và diễn đạt quan hệ đồng vị tự nhiên trong tiếng Việt.
- source_word: לֹא תְבַשֵּׁל
  choice: không được luộc
  rationale: בשל ở đây phù hợp nhất với “luộc”; “không được” diễn đạt lệnh cấm pháp lý tự nhiên hơn “chớ” trong văn phong hiện đại.
- source_word: גְּדִי
  choice: một con dê con
  rationale: Nghĩa thông thường là dê non; “dê con” rõ ràng với độc giả hiện đại và không mở rộng thành một loài vật non bất định.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: trong sữa mẹ nó
  rationale: Giữ nguyên hình ảnh và quan hệ sở hữu của nguyên văn, không thêm lời giải thích về mục đích của điều cấm.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn nêu trực tiếp danh giao ước; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của lệnh cấm luộc dê con trong sữa mẹ nó
  choice: Giữ nguyên lệnh cấm theo nghĩa đen, không giải thích nguyên nhân
  alternative: Diễn giải thành quy định chống nghi lễ Ca-na-an, chống sự tàn nhẫn, hoặc nguyên tắc phân cách thực phẩm
  rationale: Câu Hê-bơ-rơ không nêu lý do cho lệnh cấm. Bản dịch vì thế không áp đặt một cách giải thích lịch sử hay thần học còn gây tranh luận.
translation_notes:
  register: Văn phong luật giao ước trang trọng nhưng hiện đại. Đại từ “con” phản ánh lời phán trực tiếp với từng thành viên trong cộng đồng giao ước; tránh lối cổ “ngươi”. Các dấu chú thích [a], [b] đều được đặt trong chính văn tại nội dung tương ứng.
