base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: vi
  text: Ta sẽ sai ong vò vẽ đi trước con[a]; chúng sẽ đuổi người Hê-vít, người Ca-na-an và người Hê-tít khỏi trước mặt con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể đây là hình ảnh tượng trưng cho sự hoảng loạn hoặc một phương tiện gây sức ép khác mà Đức Chúa Trời sai đi trước dân Y-sơ-ra-ên; từ Hê-bơ-rơ này thông thường có nghĩa là “ong vò vẽ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Ta sẽ sai
  rationale: Dạng Qal hoàn thành ngôi thứ nhất số ít, có liên từ đứng trước, diễn tả lời hứa trong tương lai ở văn cảnh này. “Ta sẽ sai” vừa tự nhiên vừa giữ rõ tác nhân thần thượng.
- source_word: הַצִּרְעָה
  choice: ong vò vẽ
  rationale: Danh từ Hê-bơ-rơ thông thường chỉ ong vò vẽ hoặc một loài côn trùng có nọc đốt. Tiếng Việt có thể dùng danh từ không kèm từ chỉ số lượng theo nghĩa tập hợp; đại từ “chúng” ở vế sau làm rõ nghĩa tập hợp mà không chuyển cách hiểu biểu tượng vào chính văn.
- source_word: לְפָנֶיךָ
  choice: đi trước con
  rationale: Nghĩa đen là “trước mặt con”; trong ngữ cảnh này, cụm từ chỉ việc được sai đi trước để mở đường. “Đi trước con” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: וְגֵרְשָׁה
  choice: chúng sẽ đuổi
  rationale: Động từ גרשׁ có nghĩa là đuổi hoặc trục xuất. Dạng giống cái số ít phù hợp với danh từ tập hợp הַצִּרְעָה; tiếng Việt dùng “chúng” để quy chiếu tự nhiên đến bầy ong được hàm ý.
- source_word: הַחִוִּי
  choice: người Hê-vi
  rationale: Phiên âm tên dân tộc theo cách gọi Kinh Thánh quen thuộc và dễ đọc trong tiếng Việt.
- source_word: הַכְּנַעֲנִי
  choice: người Ca-na-an
  rationale: Phiên âm tên dân tộc theo cách dùng phổ biến trong tiếng Việt.
- source_word: הַחִתִּי
  choice: người Hê-tít
  rationale: Phiên âm tên dân tộc, giữ tính chất tên riêng và giúp độc giả nhận diện dân Hittite.
- source_word: מִלְּפָנֶיךָ
  choice: khỏi trước mặt con
  rationale: Giữ sự tương ứng với thành ngữ không gian ở đầu câu và ý nghĩa loại bỏ các dân ấy khỏi đường đi hoặc sự hiện diện của Israel, đồng thời tránh diễn giải quá mức.
theological_decisions:
- issue: Nên hiểu הַצִּרְעָה theo nghĩa đen hay nghĩa biểu tượng
  choice: Dịch theo nghĩa từ vựng thông thường là “ong vò vẽ” trong chính văn
  alternative: Hiểu như hình ảnh chỉ nỗi kinh hoàng, sự hoảng loạn hoặc một phương tiện gây sức ép khác từ Đức Chúa Trời
  rationale: Nghĩa trực tiếp và thông thường của từ Hê-bơ-rơ là ong vò vẽ hoặc côn trùng có nọc đốt. Vì bản văn không buộc phải chọn cách hiểu biểu tượng, chính văn giữ nghĩa đen, còn khả năng biểu tượng được nêu trong chú thích để bảo toàn sự mơ hồ thực sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” phù hợp lời Đức Chúa Trời phán với Israel như một chủ thể số ít. Tên các dân tộc được phiên âm theo lối quen thuộc; cấu trúc “khỏi trước mặt con” được giữ hơi trang trọng để phản ánh thành ngữ Hê-bơ-rơ và sự lặp lại có chủ ý.
