source:
  edition: WLC
  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: vi
  text: Ngươi không được nhận hối lộ, vì của hối lộ làm mù mắt người sáng suốt[a] và xuyên tạc lời của người công chính[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người nhìn rõ”. Tiếng Hê-bơ-rơ giữ hình ảnh thị giác, đồng thời hàm ý khả năng phán đoán đúng đắn.
    reason: lexical_alternative
  - marker: b
    text: “Lời của người công chính” trong bối cảnh pháp lý cũng có thể được hiểu là “lời trình bày” hoặc “vụ việc của người có lẽ phải”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: hối lộ / của hối lộ
  rationale: Danh từ chỉ khoản lợi ích dùng để tác động sai trái đến sự phán xét. “Hối lộ” là cách nói pháp lý–đạo đức rõ ràng; ở vế giải thích, “của hối lộ” tự nhiên hơn khi làm chủ ngữ.
- source_word: לֹא תִקָּח
  choice: ngươi không được nhận
  rationale: Thể vị hoàn thành chưa trọn Qal ngôi hai số ít có chức năng cấm đoán trong luật pháp. “Không được nhận” tự nhiên trong tiếng Việt hiện đại, còn “ngươi” giữ lời truyền trực tiếp ở số ít và sắc thái trang trọng.
- source_word: כִּי
  choice: vì
  rationale: Liên từ đưa ra lý do cho lệnh cấm; “vì” diễn đạt trực tiếp và súc tích.
- source_word: יְעַוֵּר
  choice: làm mù mắt
  rationale: Động từ Piel mang nghĩa gây nên sự mù lòa. Cách dịch này giữ hình ảnh thị giác đồng thời gợi sự phán đoán bị tha hóa.
- source_word: פִּקְחִים
  choice: người sáng suốt
  rationale: Từ này vốn gợi người có mắt mở, nhìn rõ, và trong ngữ cảnh chỉ người có khả năng nhận định đúng. “Sáng suốt” vừa tự nhiên vừa còn liên hệ với hình ảnh ánh sáng và thị giác.
- source_word: וִיסַלֵּף
  choice: và xuyên tạc
  rationale: Động từ Piel có nghĩa bẻ cong, làm sai lệch. “Xuyên tạc” phù hợp với lời nói hoặc lời khai và dễ hiểu trong ngữ cảnh xét xử.
- source_word: דִּבְרֵי
  choice: lời của
  rationale: 'Danh từ số nhiều dạng liên kết có phạm vi nghĩa rộng: lời nói, lời trình bày, hoặc sự việc/vụ kiện. “Lời của” minh bạch với hình thức Hê-bơ-rơ và không khóa nghĩa pháp lý vào chỉ một cách hiểu.'
- source_word: צַדִּיקִים
  choice: người công chính
  rationale: Tính từ dùng như danh từ có thể chỉ người ngay chính về đạo đức hoặc người có lẽ phải trong tranh tụng. “Người công chính” giữ được độ rộng ấy.
theological_decisions:
- issue: Phạm vi nghĩa của צַדִּיקִים trong bối cảnh pháp lý
  choice: người công chính
  alternative: người có lẽ phải
  rationale: Không thu hẹp câu chỉ vào địa vị pháp lý; bản dịch chính giữ cả sắc thái đạo đức lẫn tư pháp, còn chú thích nêu cách hiểu pháp lý.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Đại từ “ngươi” phản ánh lời truyền số ít của nguyên văn; các từ “hối lộ”, “sáng suốt”, “xuyên tạc” thông dụng và rõ nghĩa. Hai dấu chú thích đều xuất hiện trong chính văn và theo đúng thứ tự [a], [b].
