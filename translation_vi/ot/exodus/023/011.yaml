  text: וְ/הַ/שְּׁבִיעִ֞ת תִּשְׁמְטֶ֣/נָּה וּ/נְטַשְׁתָּ֗/הּ וְ/אָֽכְלוּ֙ אֶבְיֹנֵ֣י עַמֶּ֔/ךָ וְ/יִתְרָ֕/ם תֹּאכַ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה כֵּֽן תַּעֲשֶׂ֥ה לְ/כַרְמְ/ךָ֖ לְ/זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: vi
  text: Nhưng đến năm thứ bảy, ngươi phải để đất nghỉ và bỏ mặc nó[a], để những người nghèo trong dân ngươi được ăn; phần họ để lại thì thú vật ngoài đồng sẽ ăn[b]. Ngươi cũng phải làm như vậy đối với vườn nho và vườn ôliu của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ngươi phải buông đất ra và để mặc nó”; hai động từ Hê-bơ-rơ nhấn mạnh việc ngưng canh tác bình thường và để đất không được canh tác trong năm thứ bảy.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “thú vật ngoài đồng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: Nhưng đến năm thứ bảy
  rationale: Liên từ cùng số thứ tự tạo thế tương phản về thời gian với sáu năm canh tác ở câu trước; cách dịch này tự nhiên trong tiếng Việt.
- source_word: תִּשְׁמְטֶנָּה
  choice: ngươi phải để đất nghỉ
  rationale: Động từ שׁמט ở đây nói đến việc ngưng canh tác đất trong năm thứ bảy; bổ sung danh từ “đất” để làm rõ đại từ giống cái chỉ về đất ở câu trước.
- source_word: וּנְטַשְׁתָּהּ
  choice: và không canh tác
  rationale: נטשׁ có nghĩa là để lại, bỏ mặc. Trong luật nông nghiệp này, “không canh tác” diễn đạt rõ việc để đất không được khai thác bình thường mà không gợi ý từ bỏ vĩnh viễn.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: những người nghèo trong dân ngươi
  rationale: אביון chỉ người nghèo hoặc túng thiếu; cách dịch giữ được mối liên hệ với cộng đồng của người nghe.
- source_word: וְיִתְרָם
  choice: phần họ để lại
  rationale: Hậu tố số nhiều chỉ những người nghèo; cụm từ nói đến phần còn lại sau khi họ đã ăn.
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: thú đồng có thể ăn
  rationale: חית השדה theo nghĩa đen là “thú vật ngoài đồng”, tức động vật hoang dã; “có thể ăn” chuyển tải sắc thái cho phép hoặc kết quả trong ngữ cảnh.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Ngươi cũng phải làm như vậy
  rationale: Giữ nguyên lực mệnh lệnh và cho biết cùng một quy định được áp dụng cho các loại cây trồng tiếp theo.
- source_word: לְכַרְמְךָ
  choice: đối với vườn nho
  rationale: Chỉ một lĩnh vực canh tác khác mà quy định về năm thứ bảy được áp dụng.
- source_word: לְזֵיתֶךָ
  choice: vườn ôliu của mình
  rationale: זית ở số ít có thể được dùng theo nghĩa tập hợp; “vườn ôliu” tự nhiên và song song với “vườn nho” hơn là chỉ một cây ôliu.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” duy trì lời truyền trực tiếp ở ngôi thứ hai số ít trong văn bản luật; “ôliu” là cách gọi phổ thông, rõ nghĩa. Hai dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong chính văn.
