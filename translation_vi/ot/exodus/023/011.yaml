revisions:
- from: Nhưng đến năm thứ bảy, ngươi phải để đất nghỉ và không canh tác[a], để những người nghèo trong dân ngươi có thể ăn; phần họ để lại, thú đồng có thể ăn[b]. Ngươi cũng phải làm như vậy đối với vườn nho và vườn ôliu của mình.
  to: Nhưng đến năm thứ bảy, ngươi phải để đất nghỉ và bỏ mặc nó[a], để những người nghèo trong dân ngươi được ăn; phần họ để lại thì thú vật ngoài đồng sẽ ăn[b]. Ngươi cũng phải làm như vậy đối với vườn nho và vườn ôliu của ngươi.
  rationale: Bản sửa phục hồi ý riêng của động từ thứ hai trong cặp “để đất nghỉ và bỏ mặc nó,” đồng thời giữ nghĩa nông nghiệp bằng chú thích. Các điều chỉnh còn lại làm tiếng Việt tự nhiên hơn, sát cụm חַיַּת הַשָּׂדֶה hơn, và nhất quán đại từ trực tiếp của văn bản.
