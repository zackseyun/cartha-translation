source:
  edition: WLC
  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: vi
  text: Nếu con gặp con bò hoặc con lừa của kẻ thù của con đang đi lạc,[a] con nhất định phải đưa nó trở lại cho người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi con gặp con bò hoặc con lừa của kẻ thù của con đang lang thang.”'
    reason: Ghi nhận khả năng dịch כִּי là “Khi” và תֹּעֶה là “đang lang thang”, không thay đổi nội dung căn bản của mệnh lệnh.
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong văn luật pháp theo dạng tình huống, כִּי mở đầu mệnh đề điều kiện. “Nếu” thể hiện rõ cấu trúc ấy, dù “Khi” cũng có thể hiểu được.
- source_word: תִפְגַּע
  choice: con gặp
  rationale: Động từ פגע ở đây chỉ việc tình cờ gặp hoặc bắt gặp; “gặp” tự nhiên, rõ nghĩa và không thêm ý.
- source_word: שׁוֹר
  choice: bò
  rationale: שׁוֹר chỉ gia súc thuộc loài bò; trong tiếng Việt hiện đại, “bò” là cách gọi tự nhiên và không áp đặt giới tính hay tình trạng thiến khi ngữ cảnh không xác định.
- source_word: אֹיִבְךָ
  choice: của kẻ thù mình
  rationale: Giữ nguyên nghĩa trực tiếp “kẻ thù của con”, không làm nhẹ mối quan hệ thành một người láng giềng hay người khác.
- source_word: חֲמֹרוֹ
  choice: lừa của người ấy
  rationale: חֲמוֹר là từ thông dụng chỉ con lừa; đại từ sở hữu quy chiếu về kẻ thù vừa được nhắc đến. Trong câu chính, cấu trúc “bò hoặc lừa của kẻ thù mình” diễn đạt gọn và tự nhiên.
- source_word: תֹּעֶה
  choice: đang đi lạc
  rationale: Phân từ của תעה mô tả con vật đang rời khỏi đường hoặc nơi nó phải ở; “đang đi lạc” giữ được sắc thái diễn tiến mà không khẳng định nó đã mất hẳn.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: con nhất định phải dắt nó về
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh mệnh lệnh. “Nhất định phải” truyền đạt cả tính bắt buộc lẫn sự nhấn mạnh; “dắt ... về” phù hợp tự nhiên với súc vật đi lạc.
- source_word: לוֹ
  choice: cho người ấy
  rationale: Đại từ chỉ về kẻ thù, tức chủ con vật. “Cho người ấy” giữ cách quy chiếu bằng đại từ thay vì diễn giải thành “cho chủ nó”.
theological_decisions:
- issue: Nghĩa vụ đối với kẻ thù
  choice: Giữ nguyên “kẻ thù” và mệnh lệnh phải đưa trả con vật đi lạc của người ấy.
  alternative: Làm nhẹ thành “người láng giềng”, “người khác”, hoặc đổi thành “người ghét con”.
  rationale: 'Bản Hê-bơ-rơ nói rõ אֹיִבְךָ, “kẻ thù của con”. Cách dịch giữ nguyên sức căng đạo đức: người nghe phải hành động đúng đắn và nhân từ ngay cả đối với một đối thủ.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “con” theo lối xưng hô trực tiếp trong luật giao ước; “nhất định phải” thể hiện cấu trúc nhấn mạnh của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
