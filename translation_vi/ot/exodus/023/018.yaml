base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: vi
  text: Ngươi không được dâng huyết của sinh tế Ta cùng với bất cứ thứ gì có men[a]; cũng không được để mỡ của kỳ lễ Ta[b] còn lại đến sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với men” hoặc, sát chữ hơn, “trên men”. Trong ngữ cảnh tế lễ, giới từ Hê-bơ-rơ này có lẽ chỉ việc dâng sinh tế có liên hệ với thứ có men.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ chỉ một lễ hội tôn giáo, thường là kỳ lễ hành hương; cũng có thể dịch là “lễ hội”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִזְבַּח
  choice: Con không được dâng
  rationale: Thể Qal chưa hoàn thành, ngôi hai số ít, đi với לֹא tạo thành lệnh cấm. “Không được dâng” tự nhiên trong văn luật lệ và giữ sắc thái tế lễ của động từ.
- source_word: עַל חָמֵץ
  choice: cùng với bất cứ thứ gì có men
  rationale: עַל có nghĩa đen là “trên”, nhưng trong ngữ cảnh tế lễ chỉ sự kết hợp hay liên hệ. Cách dịch này truyền đạt rõ lệnh cấm mà không giới hạn חָמֵץ vào riêng bánh có men.
- source_word: דַּם זִבְחִי
  choice: huyết của sinh tế Ta
  rationale: Giữ nguyên danh từ “huyết” và quan hệ sở hữu của hậu tố ngôi một số ít; “sinh tế” diễn đạt lễ vật được dâng bằng việc giết tế.
- source_word: יָלִין
  choice: để ... còn lại
  rationale: Động từ לין có nghĩa ở lại qua đêm. Khi kết hợp với עַד בֹּקֶר, “để ... còn lại đến sáng” là cách diễn đạt tự nhiên, không lặp ý “qua đêm” và “đến sáng”.
- source_word: חֵלֶב
  choice: mỡ
  rationale: Giữ nghĩa cụ thể của từ Hê-bơ-rơ, có khả năng chỉ phần mỡ của sinh tế, thay vì diễn giải thành “phần ngon nhất”.
- source_word: חַגִּי
  choice: kỳ lễ Ta
  rationale: חַג chỉ một lễ hội tôn giáo, thường là kỳ lễ hành hương. “Kỳ lễ” phù hợp văn cảnh thờ phượng và tự nhiên hơn “yến tiệc”.
- source_word: עַד בֹּקֶר
  choice: đến sáng
  rationale: Diễn đạt trực tiếp giới hạn thời gian của nguyên văn bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Sở chỉ của các hậu tố ngôi thứ nhất trong “sinh tế Ta” và “kỳ lễ Ta”
  choice: Giữ lời phán trực tiếp của Đức Chúa Trời bằng “Ta”, không thêm lời giải thích.
  alternative: “sinh tế dâng cho Ta” và “kỳ lễ của Đức Giê-hô-va”
  rationale: Các hậu tố ngôi một số ít có thật trong nguyên văn. Giữ chúng bảo toàn cách Đức Chúa Trời gọi sinh tế và kỳ lễ là thuộc về Ngài, mà không chuyển quan hệ sở hữu thành cách diễn giải khác.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Đại từ “Con” phản ánh ngôi hai số ít trong lời Đức Chúa Trời phán trực tiếp; “Ta” giữ nguyên hậu tố ngôi một chỉ Đức Chúa Trời. Dùng dấu chấm phẩy để làm rõ hai lệnh cấm song song.
