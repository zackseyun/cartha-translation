  text: הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְ/פָנֶ֔י/ךָ לִ/שְׁמָרְ/ךָ֖ בַּ/דָּ֑רֶךְ וְ/לַ/הֲבִ֣יאֲ/ךָ֔ אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: vi
  text: Này, Ta sai một thiên sứ[a] đi trước con để gìn giữ con dọc đường và đưa con đến nơi Ta đã chuẩn bị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một sứ giả.” Từ Hê-bơ-rơ מַלְאָךְ có thể chỉ sứ giả loài người hoặc sứ giả thiên giới; trong ngữ cảnh này, “thiên sứ” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của tiểu từ Hê-bơ-rơ, đồng thời vẫn tự nhiên trong lời phán hiện đại.
- source_word: אָנֹכִי
  choice: Ta
  rationale: Đại từ độc lập có tính nhấn mạnh; trong tiếng Việt, cách Thiên Chúa tự xưng “Ta” đã đủ rõ và trang trọng, không cần thêm “chính Ta,” vốn có thể nhấn quá mức.
- source_word: שֹׁלֵחַ
  choice: sai
  rationale: Phân từ đi với אָנֹכִי diễn tả hành động hiện tại hoặc sắp được thực hiện. “Ta sai” tự nhiên hơn “Ta đang sai” trong tiếng Việt và vẫn giữ được hiệu lực trực tiếp của lời phán.
- source_word: מַלְאָךְ
  choice: một thiên sứ
  rationale: Từ này có thể chỉ sứ giả loài người hoặc thiên sứ. Trong ngữ cảnh, nhân vật được Thiên Chúa sai đi trước để bảo vệ và đưa dân đến nơi đã định, nên “thiên sứ” phù hợp nhất; nghĩa “sứ giả” được giữ trong chú thích.
- source_word: לְפָנֶיךָ
  choice: đi trước con
  rationale: Diễn đạt tự nhiên ý vị trí và chuyển động đi ở phía trước để dẫn đường; động từ “đi” được bổ sung theo hàm ý của ngữ cảnh.
- source_word: לִשְׁמָרְךָ
  choice: để gìn giữ con
  rationale: שׁמר ở đây mang nghĩa bảo vệ, trông nom trong hành trình. “Gìn giữ” vừa rõ nghĩa vừa có sắc thái trang trọng phù hợp.
- source_word: בַּדָּרֶךְ
  choice: dọc đường
  rationale: Chỉ hành trình hoặc lộ trình đang đi. “Dọc đường” là cách nói tự nhiên, không tạo cảm giác chỉ một thời điểm như “trên đường.”
- source_word: וְלַהֲבִיאֲךָ
  choice: và đưa con đến
  rationale: Thể Hiphil của בוא có nghĩa khiến đến hoặc đem/đưa đến. “Đưa con đến” tự nhiên trong tiếng Việt và sát với ý chỉ đích đến.
- source_word: הַמָּקוֹם
  choice: nơi
  rationale: “Nơi” là cách chuyển ngữ tự nhiên của מָקוֹם trong mệnh đề chỉ đích đến.
- source_word: אֲשֶׁר הֲכִנֹתִי
  choice: Ta đã chuẩn bị
  rationale: Thể Hiphil của כון có thể mang nghĩa chuẩn bị, làm sẵn hoặc thiết lập. Trong ngữ cảnh về một đích đến do Thiên Chúa định liệu, “đã chuẩn bị” giữ được nghĩa trực tiếp và không thu hẹp cách hiểu.
theological_decisions:
- issue: Danh tính của מַלְאָךְ trong ngữ cảnh này
  choice: Dịch là “một thiên sứ” nhưng không xác định đó là một hữu thể thiên sứ thọ tạo hay một sự hiện diện đặc biệt của Đức Chúa Trời.
  alternative: “một sứ giả,” hoặc xác định nhân vật này là Thiên sứ của Đức Giê-hô-va theo một nghĩa thần học riêng biệt
  rationale: Câu này chỉ gọi nhân vật ấy là מַלְאָךְ. Ngữ cảnh rộng hơn đặt ra câu hỏi về địa vị của vị này, nhưng bản dịch không nên giải quyết vượt quá điều bản văn nói rõ.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho Đấng phán và “con” cho đại từ ngôi hai số ít, tránh lối xưng hô cổ “ngươi.” Cấu trúc câu giữ nhịp lời hứa trực tiếp và ba ý chính của nguyên văn: sai đi trước, gìn giữ trong hành trình, và đưa đến nơi đã chuẩn bị.'
