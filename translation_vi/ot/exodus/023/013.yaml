base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: vi
  text: Trong mọi điều Ta đã phán với các ngươi, hãy thận trọng. Tên các thần khác, các ngươi không được nhắc đến[a]; không được nghe trên môi ngươi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch cụ thể hơn: “không được cầu khẩn danh các thần khác.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “không được nghe trên miệng ngươi.” Trong tiếng Hebrew, đại từ chuyển từ số nhiều ở phần đầu câu sang số ít ở phần cuối.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: mọi điều Ta đã phán với các ngươi
  rationale: Cụm giới từ בְכֹל xác định phạm vi toàn diện của lời truyền, còn mệnh đề theo sau quy chiếu các điều vừa được phán. Cách dịch này tự nhiên trong tiếng Việt và giữ được lực bao quát.
- source_word: תִּשָּׁמֵרוּ
  choice: Hãy cẩn thận làm theo
  rationale: Dạng Niphal của שׁמר ở đây kêu gọi người nghe tự giữ mình, chú tâm đối với các điều đã truyền. Thêm “làm theo” diễn đạt tự nhiên đối tượng ngầm của sự cẩn trọng trong tiếng Việt mà không đổi trọng tâm của mệnh lệnh.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: Cách dịch trực tiếp, chỉ các thần ngoài Đức Chúa Trời của Israel, không đưa thêm phán đoán về bản thể của họ.
- source_word: לֹא תַזְכִּירוּ
  choice: không được nhắc đến
  rationale: Hiphil của זכר có thể mang nghĩa làm cho nhớ, đề cập hoặc xướng danh. “Nhắc đến” giữ nghĩa rộng của từ thay vì thu hẹp thành việc cầu khẩn hay viện danh.
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  choice: chớ để tên chúng được nghe trên môi các ngươi
  rationale: Giữ cấu trúc bị động của יִשָּׁמַע và hình ảnh nguyên văn “trên miệng”; “trên môi” là cách nói tự nhiên, trang trọng trong tiếng Việt về lời được thốt ra.
theological_decisions:
- issue: Phạm vi lệnh cấm liên quan đến tên các thần khác
  choice: Dịch là không được nhắc đến tên các thần khác
  alternative: Không được cầu khẩn hoặc viện danh các thần khác
  rationale: Động từ Hebrew có thể bao hàm việc xướng hoặc viện danh, nhưng bản văn không xác định rõ lệnh cấm chỉ giới hạn ở nghi lễ. Bản dịch chính giữ nghĩa rộng và ghi nhận cách hiểu hẹp hơn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ta/các ngươi” duy trì giọng phán truyền trong bối cảnh giao ước; phần cuối được diễn đạt ở số nhiều cho tiếng Việt tự nhiên, còn sự chuyển số trong nguyên văn được ghi ở chú thích.
