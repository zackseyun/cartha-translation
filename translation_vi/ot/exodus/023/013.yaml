revisions:
- from: Hãy cẩn thận làm theo mọi điều Ta đã phán với các ngươi. Các ngươi không được nhắc đến tên các thần khác[a]; chớ để tên chúng được nghe trên môi các ngươi.[b]
  to: Trong mọi điều Ta đã phán với các ngươi, hãy thận trọng. Tên các thần khác, các ngươi không được nhắc đến[a]; không được nghe trên môi ngươi.[b]
  rationale: Bản sửa dịch trực tiếp hơn mệnh lệnh ‘hãy thận trọng’, giữ phạm vi bao quát của ‘trong mọi điều’, và bảo tồn sự chuyển số có chủ ý/đáng chú ý của nguyên văn. Các thuật ngữ về thần khác và việc nhắc đến tên họ được giữ ở mức rộng như tiếng Hebrew.
  reviewer_model: gpt-5.6-terra
