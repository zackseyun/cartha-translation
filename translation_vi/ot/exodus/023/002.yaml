source:
  edition: WLC
  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: vi
  text: Không được theo số đông để làm điều ác; cũng không được làm chứng trong một vụ kiện mà ngả theo số đông để bẻ cong công lý.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cũng không được trả lời về một vụ kiện để theo số đông mà làm sai lệch phán quyết.”'
    reason: Nguyên ngữ có thể hiểu תַעֲנֶה là “trả lời/lên tiếng” thay vì “làm chứng”; động từ cuối không nêu rõ tân ngữ, nên “phán quyết” là cách hiểu theo văn cảnh pháp lý.
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: theo số đông
  rationale: Cấu trúc היה אחרי mang nghĩa thành ngữ là đi theo hoặc hùa theo; “số đông” diễn đạt tự nhiên רַבִּים và giữ trọng tâm về áp lực của nhiều người.
- source_word: לְרָעֹת
  choice: để làm điều ác
  rationale: Giới từ לְ với dạng này biểu thị mục đích hoặc kết quả; “làm điều ác” giữ nguyên sức nặng đạo đức của רָעֹת.
- source_word: תַעֲנֶה
  choice: làm chứng
  rationale: Trong bối cảnh pháp lý của רִיב, ענה có thể chỉ việc trả lời hoặc phát biểu với tư cách nhân chứng; “làm chứng” làm rõ khung cảnh xét xử mà vẫn phù hợp ngữ nghĩa.
- source_word: עַל רִיב
  choice: trong một vụ tranh tụng
  rationale: רִיב có thể là tranh chấp, vụ kiện hoặc vụ việc pháp lý. “Vụ tranh tụng” vừa dễ hiểu vừa giữ sắc thái tư pháp.
- source_word: לִנְטֹת אַחֲרֵי רַבִּים
  choice: mà ngả theo số đông
  rationale: נטה gợi ý nghiêng hoặc lệch sang một phía; “ngả theo” giữ hình ảnh ấy và diễn đạt tự nhiên việc chịu ảnh hưởng của số đông.
- source_word: לְהַטֹּת
  choice: để bẻ cong công lý
  rationale: Dạng Hiphil của נטה trong văn cảnh pháp lý mang nghĩa làm lệch hoặc xuyên tạc. “Bẻ cong” giữ ẩn dụ của nguyên ngữ, còn “công lý” là tân ngữ được ngữ cảnh tư pháp hàm ý.
theological_decisions:
- issue: Tân ngữ được hàm ý trong mệnh đề cuối
  choice: bẻ cong công lý
  alternative: làm sai lệch phán quyết; làm cho lệch đi
  rationale: Nguyên ngữ kết thúc bằng một động từ nguyên mẫu không nêu rõ tân ngữ. Văn cảnh về lời chứng và vụ tranh tụng cho phép bổ sung “công lý” để câu tiếng Việt rõ nghĩa, nhưng chú thích vẫn ghi nhận cách hiểu gắn trực tiếp hơn với phán quyết.
- issue: Sắc thái của תַעֲנֶה trong bối cảnh pháp lý
  choice: làm chứng
  alternative: lên tiếng; trả lời
  rationale: “Làm chứng” phù hợp nhất với bối cảnh tư pháp, nhưng động từ Hê-bơ-rơ rộng hơn và có thể được hiểu là lên tiếng hoặc trả lời trong vụ việc; sự đa nghĩa này được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “con” phù hợp lời luật truyền cho cộng đồng/người nghe trong mạch Xuất Hành. Dấu chấm phẩy giúp giữ hai lệnh cấm song song; “theo số đông” được lặp lại về ý để bảo toàn điểm nhấn của nguyên ngữ.
