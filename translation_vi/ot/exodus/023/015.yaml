id: EXO.23.15
reference: Exodus 23:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: vi
  text: Ngươi phải giữ Lễ Bánh Không Men. Trong bảy ngày, ngươi phải ăn bánh không men, như ta đã truyền cho ngươi, vào thời điểm đã định trong tháng A-bíp, vì trong tháng ấy ngươi đã ra khỏi Ai Cập. Không ai được đến trước mặt ta tay không.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ chuyển từ lời nói với “ngươi” ở số ít sang một động từ ngôi thứ ba số nhiều trong mệnh đề cuối; cũng có thể dịch: “Họ không được đến trước mặt ta tay không.”'
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Lễ Bánh Không Men
  rationale: Diễn đạt tự nhiên một lễ hội tôn giáo; מַצּוֹת chỉ bánh không dùng men. Không thêm rõ sắc thái hành hương vốn chỉ hàm chứa trong חַג.
- source_word: תִּשְׁמֹר
  choice: phải giữ
  rationale: Trong ngữ cảnh luật lệ và nghi lễ, שׁמר có nghĩa là giữ hoặc tuân giữ; cách dịch này bảo toàn sức nặng của mệnh lệnh giao ước.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Trong bảy ngày, ngươi phải ăn bánh không men
  rationale: Giữ nguyên khoảng thời gian và nội dung mệnh lệnh, đồng thời dùng trật tự câu tự nhiên trong tiếng Việt.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: như ta đã truyền cho ngươi
  rationale: Bảo toàn phép so sánh và lời phán trực tiếp ở ngôi thứ nhất của Đức Chúa Trời.
- source_word: לְמוֹעֵד
  choice: vào thời điểm đã định
  rationale: מוֹעֵד ở đây chỉ thời điểm cố định theo lịch để cử hành lễ, không nhất thiết mang nghĩa nơi hội họp.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: tháng A-bíp
  rationale: Phiên âm danh xưng lịch pháp Hê-bơ-rơ thay vì chuyển thành nghĩa 'bông lúa non', nhờ đó giữ chức năng tên tháng.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: vì trong tháng ấy ngươi đã ra khỏi Ai Cập
  rationale: Làm rõ đại từ בוֹ quy chiếu về tháng vừa được nhắc đến; 'ra khỏi Ai Cập' truyền đạt trực tiếp động từ יצא.
- source_word: וְלֹא יֵרָאוּ פָנַי רֵיקָם
  choice: Không ai được đến trước mặt ta tay không
  rationale: Niphal của ראה cùng פָנַי là thành ngữ chỉ việc đến trình diện trước Đức Chúa Trời; số nhiều ngôi ba mang nghĩa khái quát nên 'không ai' tự nhiên hơn trong tiếng Việt. רֵיקָם được giữ bằng thành ngữ 'tay không', không diễn giải quá mức thành một loại lễ vật cụ thể.
theological_decisions:
- issue: Thành ngữ פָנַי nói về sự hiện diện của Đức Chúa Trời
  choice: trước mặt ta
  alternative: trước nhan ta
  rationale: '''Trước mặt ta'' vừa gần hình ảnh nguyên văn ''mặt ta'', vừa là cách nói hiện đại, dễ hiểu về việc đến trong sự hiện diện của Đức Chúa Trời; không áp đặt cách giải thích thần học riêng.'
- issue: Sự chuyển đổi từ ngôi hai số ít sang động từ ngôi ba số nhiều ở mệnh đề cuối
  choice: Không ai được đến
  alternative: Họ không được đến
  rationale: Dạng số nhiều ngôi ba được hiểu theo nghĩa cấm đoán khái quát. 'Không ai' truyền đạt tự nhiên trong tiếng Việt, còn chú thích ghi nhận sự chuyển ngôi thật sự trong tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “ngươi/ta” để giữ lời phán trực tiếp ở số ít và tránh làm mờ hình thái ngữ pháp. “Lễ Bánh Không Men” và “tháng A-bíp” là những cách gọi rõ ràng, phù hợp với văn bản Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
