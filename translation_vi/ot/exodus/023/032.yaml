  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: vi
  text: Ngươi không được lập giao ước[a] với chúng hay với các thần của chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói theo nghĩa đen là “cắt giao ước”; đây là thành ngữ có nghĩa là “lập giao ước”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Diễn đạt rõ lệnh cấm trong tiếng Việt hiện đại.
- source_word: תִכְרֹת
  choice: lập
  rationale: Trong thành ngữ כרת ברית, động từ có nghĩa đen là “cắt” nhưng toàn cụm mang nghĩa tự nhiên là “lập giao ước”.
- source_word: לָהֶם
  choice: với chúng
  rationale: Giới từ ל đi với thành ngữ lập giao ước chỉ đối tác của giao ước, nên dịch là “với”.
- source_word: וְלֵאלֹהֵיהֶם
  choice: cũng không được lập giao ước với các thần của chúng
  rationale: ו có hình thức là “và”, nhưng trong phạm vi lệnh cấm, “cũng không” truyền đạt rõ rằng cả hai đối tượng đều bị cấm; lặp lại động từ để câu tiếng Việt tự nhiên và tránh cách hiểu rằng con người cùng các thần là một bên tập thể duy nhất.
- source_word: בְּרִית
  choice: giao ước
  rationale: “Giao ước” giữ được chiều kích pháp lý, quan hệ và tôn giáo của בְּרִית tốt hơn “hiệp ước” hoặc “thỏa thuận” trong văn cảnh này.
theological_decisions:
- issue: Thành ngữ כרת ברית
  choice: lập giao ước
  alternative: cắt giao ước
  rationale: Bản dịch dùng cách nói tự nhiên của tiếng Việt nhưng ghi chú nghĩa đen để bảo tồn hình ảnh nguyên ngữ.
- issue: Sức nghĩa của ו trước “các thần của chúng”
  choice: cũng không được lập giao ước với
  alternative: và với
  rationale: Trong một lệnh cấm bao trùm hai đối tượng, “cũng không” thể hiện rõ ý không được giao ước với bên nào, trong khi vẫn không biến sự lựa chọn này thành một khẳng định giáo lý.
- issue: Số nhiều của אֱלֹהֵיהֶם trong văn cảnh ngoại giáo
  choice: các thần của chúng
  alternative: những vị thần của chúng
  rationale: Hình thái và văn cảnh đòi hỏi nghĩa số nhiều; “các thần” là cách diễn đạt gọn, rõ và không thêm đánh giá ngoài văn bản.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. Dùng “ngươi” để giữ cách xưng hô số ít trực tiếp của תִכְרֹת và phù hợp giọng văn giao ước; dùng “chúng” cho các dân được nhắc đến trong ngữ cảnh. Câu lặp “lập giao ước” nhằm làm rõ phạm vi lệnh cấm trong tiếng Việt.
