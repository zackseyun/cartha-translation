source:
  edition: WLC
  text: לֹ֥א תִהְיֶ֛ה מְשַׁכֵּלָ֥ה וַ/עֲקָרָ֖ה בְּ/אַרְצֶ֑/ךָ אֶת מִסְפַּ֥ר יָמֶ֖י/ךָ אֲמַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: vi
  text: Trong xứ ngươi sẽ không có phụ nữ nào sẩy thai[a] hay son sẻ; Ta sẽ làm cho số ngày của ngươi được trọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mất con”. Từ Hê-bơ-rơ có thể nói rộng hơn về việc bị mất con, nhưng khi đi đôi với “son sẻ” trong ngữ cảnh này, có lẽ từ ấy đặc biệt chỉ việc sẩy thai hoặc mất con khi sinh.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “Ta sẽ làm đầy số ngày của ngươi”, nghĩa là Ta sẽ đưa tuổi đời ngươi đến mức trọn đủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: phụ nữ nào sẩy thai
  rationale: Dạng giống cái, chỉ người bị mất con; khi đi đôi với עֲקָרָה trong lời hứa về sinh sản, “sẩy thai” là nghĩa phù hợp nhất, nhưng nghĩa rộng hơn được giữ trong chú thích.
- source_word: עֲקָרָה
  choice: son sẻ
  rationale: “Son sẻ” là cách nói tiếng Việt tự nhiên, trang trọng vừa phải, chỉ tình trạng không thể sinh con trong bối cảnh này.
- source_word: בְּאַרְצֶךָ
  choice: trong xứ ngươi
  rationale: אֶרֶץ ở đây là vùng đất Israel sẽ cư ngụ theo lời giao ước; “xứ” giữ được sắc thái lãnh thổ và hợp với văn phong Kinh Thánh hiện đại.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: số ngày đời ngươi
  rationale: Giữ hình ảnh Hê-bơ-rơ về “số ngày” nhưng thêm “đời” để câu rõ nghĩa tự nhiên trong tiếng Việt.
- source_word: אֲמַלֵּא
  choice: Ta sẽ làm trọn
  rationale: Động từ מלא mang nghĩa làm đầy, làm cho đủ. “Làm trọn” diễn đạt việc đưa tuổi đời đến mức đầy đủ mà không biến lời văn thành một cách giải nghĩa quá xa nguyên bản.
- source_word: לֹא תִהְיֶה
  choice: sẽ không có
  rationale: Cách diễn đạt hiện hữu tự nhiên trong tiếng Việt, tương ứng với cấu trúc “sẽ không có” của mệnh đề Hê-bơ-rơ.
theological_decisions:
- issue: Phạm vi của lời hứa về khả năng sinh sản và tuổi thọ
  choice: Giữ lời hứa trong bối cảnh phước lành giao ước dành cho Israel trong xứ, không mở rộng thành một bảo đảm phổ quát, phi bối cảnh cho mọi cá nhân.
  alternative: Hiểu đây là lời bảo đảm vượt thời gian rằng mọi tín hữu đều không bao giờ sẩy thai, son sẻ hoặc chết sớm.
  rationale: Ngữ cảnh trực tiếp là các lời hứa giao ước của Đức Chúa Trời dành cho Israel khi sống trong xứ. Bản dịch bám sát phát biểu của câu mà không thêm một phạm vi thần học rộng hơn điều văn bản nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/ngươi” giữ sắc thái lời phán trực tiếp của Đức Chúa Trời và số ít của nguyên văn; câu tránh lối diễn đạt quá cổ hoặc quá chuyên môn.
