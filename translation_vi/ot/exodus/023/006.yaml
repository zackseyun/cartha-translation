  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: vi
  text: Ngươi không được làm sai lệch công lý dành cho người nghèo của ngươi trong vụ tranh tụng của người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngươi không được từ chối công lý cho người nghèo của ngươi trong vụ kiện của người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Diễn đạt tự nhiên một lệnh cấm trong văn luật pháp tiếng Việt hiện đại.
- source_word: תַטֶּה
  choice: bẻ cong
  rationale: Giữ hình ảnh của động từ Hiphil נטה, đồng thời truyền đạt ý làm sai lệch trong xét xử.
- source_word: מִשְׁפַּט
  choice: công lý dành cho
  rationale: Trong ngữ cảnh pháp lý, từ này chỉ sự xét xử công minh hoặc quyền lợi tư pháp mà đương sự đáng được hưởng; cách dịch này giữ rõ đối tượng bị làm sai lệch.
- source_word: אֶבְיֹנְךָ
  choice: người nghèo của ngươi
  rationale: Giữ nghĩa người nghèo túng và hậu tố sở hữu ngôi hai số ít; dùng “người” vì danh từ Hê-bơ-rơ không nhất thiết nhằm nhấn mạnh giới tính.
- source_word: בְּרִיבוֹ
  choice: trong vụ tranh tụng của người ấy
  rationale: רִיב ở đây mang sắc thái tranh chấp pháp lý hoặc kiện tụng; “vụ tranh tụng” làm rõ bối cảnh tư pháp và giữ hậu tố ngôi ba số ít.
theological_decisions:
- issue: Lệnh cấm thiên vị bất lợi cho người nghèo hay một tuyên bố xã hội tổng quát
  choice: Cấm làm sai lệch sự xét xử công minh mà người nghèo đáng được hưởng trong vụ kiện của họ.
  alternative: Đừng từ chối công lý đối với người nghèo.
  rationale: Cú pháp Hê-bơ-rơ đặt מִשְׁפַּט làm đối tượng của hành vi “bẻ cong” và בְּרִיבוֹ xác định bối cảnh tranh tụng. Bản dịch vì thế giữ trọng tâm pháp lý mà không biến câu thành một khẩu hiệu xã hội tổng quát.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. “Ngươi” giữ cách xưng hô số ít trực tiếp của bản Hê-bơ-rơ; “bẻ cong công lý” vừa bảo toàn hình ảnh nguyên ngữ vừa tự nhiên trong tiếng Việt.
