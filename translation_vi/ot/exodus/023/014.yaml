  yaml_path: translation/ot/exodus/023/014.yaml
  text: Three times in the year you shall keep a feast to me[a].
translation:
  language: vi
  text: Mỗi năm, ngươi phải cử hành lễ cho ta ba lần.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, cụm từ Hê-bơ-rơ là “ba chân”; đây là thành ngữ chỉ ba dịp lễ hành hương trong năm.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: ba lần
  rationale: Cụm này có nghĩa đen liên quan đến “ba chân/bước chân”, nhưng là thành ngữ chỉ ba dịp lễ hành hương. “Ba lần” diễn đạt tự nhiên tần suất trong tiếng Việt, còn sắc thái hành hương được ghi ở chú thích.
- source_word: תָּחֹג
  choice: phải ... cử hành lễ
  rationale: Động từ חגג chỉ việc cử hành hoặc mừng một lễ hội. Cách dịch này giữ sắc thái nghi lễ và lực quy định của thể chưa hoàn thành trong văn luật.
- source_word: לִי
  choice: cho ta
  rationale: Giới từ ל đánh dấu các lễ là dành cho Đức Chúa Trời; “cho ta” tự nhiên trong tiếng Việt và giữ nguyên lời phán ở ngôi thứ nhất.
- source_word: בַּשָּׁנָה
  choice: Mỗi năm
  rationale: Nghĩa sát là “trong năm”; khi đi với “ba lần”, “mỗi năm” là cách diễn đạt tự nhiên, rõ ràng về chu kỳ hằng năm mà không thay đổi nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “ngươi” và “ta” để giữ lời phán trực tiếp, số ít, cùng sắc thái trang nghiêm của ngữ cảnh giao ước.
