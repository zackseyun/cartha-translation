base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: vi
  text: Ta sẽ sai nỗi kinh khiếp của Ta đi trước con[a]; Ta sẽ làm cho mọi dân mà con sẽ đi vào giữa họ đều hoảng loạn[b], và Ta sẽ khiến mọi kẻ thù của con quay lưng bỏ chạy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nỗi kinh hãi của Ta” hoặc “nỗi khiếp sợ của Ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “làm cho rối loạn,” “gây náo loạn” hoặc “đánh tan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Thành ngữ Hê-bơ-rơ nói theo hình ảnh “gáy/lưng”: Đức Chúa Trời khiến kẻ thù quay gáy hoặc lưng về phía con, tức là tháo chạy trước con.'
    reason: idiom
lexical_decisions:
- source_word: אֵימָתִי
  choice: nỗi kinh khiếp từ Ta
  rationale: Danh từ אֵימָה chỉ nỗi kinh hãi, khiếp sợ hoặc sự hoảng sợ do Đức Chúa Trời gây nên. Cách dịch này giữ sắc thái mạnh và ý nghĩa sở hữu/nguồn phát sinh của hậu tố ngôi thứ nhất, đồng thời tự nhiên hơn cách nói sát chữ “nỗi kinh khiếp của Ta” trong tiếng Việt.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: Ta sẽ sai ... đi trước con
  rationale: שׁלח kết hợp với לִפְנֵי diễn tả việc sai một điều gì đi trước ai đó. “Đi trước con” giữ rõ hướng chuyển động và hợp với văn phong tiếng Việt hiện đại.
- source_word: וְהַמֹּתִי
  choice: Ta sẽ làm cho ... hoảng loạn
  rationale: Động từ המם ở thể nguyên nhân mang nghĩa làm rối loạn, gây kinh hoàng hoặc náo loạn, thường trong bối cảnh chiến trận. “Làm cho ... hoảng loạn” truyền đạt cả sự rối loạn lẫn khiếp sợ mà không mặc nhiên diễn giải là đã đánh bại hoàn toàn.
- source_word: כָּל הָעָם
  choice: mọi dân
  rationale: עָם ở số ít nhưng có nghĩa tập hợp, chỉ từng cộng đồng dân cư mà Israel sẽ gặp. “Mọi dân” tự nhiên và tránh khiến câu bị hiểu là chỉ một nhóm người duy nhất.
- source_word: אֲשֶׁר תָּבֹא בָהֶם
  choice: mà con đi vào giữa họ
  rationale: Giới từ בְּ với đại từ số nhiều tự nhiên nhất là đi vào giữa hoặc ở giữa họ. Cách dịch này giữ sắc thái không gian và không thêm nghĩa đối địch như “tiến đánh”.
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: Ta sẽ khiến mọi kẻ thù của con quay lưng bỏ chạy
  rationale: Thành ngữ Hê-bơ-rơ mô tả việc kẻ thù đưa lưng/gáy về phía đối phương khi tháo chạy. “Quay lưng bỏ chạy” giữ hình ảnh gốc, đồng thời làm rõ ý nghĩa trong tiếng Việt.
theological_decisions:
- issue: Vai trò trực tiếp của Đức Chúa Trời trong việc gây hoảng loạn và khiến quân thù tháo chạy
  choice: 'Giữ các động từ ngôi thứ nhất với tác nhân trực tiếp: “Ta sẽ sai,” “Ta sẽ làm,” và “Ta sẽ khiến.”'
  alternative: Dùng lối diễn đạt gián tiếp để giảm nhẹ quan hệ nhân quả thần linh.
  rationale: Bản Hê-bơ-rơ liên tiếp dùng các động từ ngôi thứ nhất với Đức Chúa Trời làm chủ thể. Bản dịch giữ nguyên lời khẳng định này mà không giảm nhẹ hoặc mở rộng ý nghĩa thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ta/con” phù hợp với lời Đức Chúa Trời trực tiếp phán với Israel qua Môi-se. Bản dịch ưu tiên cấu trúc tự nhiên trong tiếng Việt nhưng giữ hình ảnh quay lưng của thành ngữ Hê-bơ-rơ; các khả năng từ vựng đáng kể được ghi ở chú thích.
