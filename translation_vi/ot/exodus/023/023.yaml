source:
  edition: WLC
  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: vi
  text: Vì thiên sứ của Ta sẽ đi trước con và đưa con đến chỗ dân A-mô-rít[a], dân Hê-tít, dân Phê-rê-xít, dân Ca-na-an, dân Hê-vít và dân Giê-bu-sít; và Ta sẽ tiêu diệt họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ giả của Ta”. Từ Hê-bơ-rơ מַלְאָךְ có thể chỉ sứ giả loài người hoặc thiên giới; ở đây, “thiên sứ” phù hợp với bối cảnh Đức Chúa Trời dẫn đường.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ dùng hậu tố số ít, nghĩa đen là “người ấy/nó”, nhưng hậu tố này được dùng theo nghĩa tập thể để chỉ các dân vừa được liệt kê.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu căn cứ của mệnh đề trong văn mạch trước.
- source_word: מַלְאָכִי
  choice: thiên sứ của Ta
  rationale: מַלְאָךְ có thể chỉ sứ giả loài người hoặc thiên giới; trong bối cảnh sự dẫn đường và hành động của Đức Chúa Trời, “thiên sứ” phù hợp, đồng thời chú thích giữ lại khả năng “sứ giả”.
- source_word: יֵלֵךְ ... לְפָנֶיךָ
  choice: sẽ đi trước con
  rationale: Thể vị hoàn mang nghĩa tương lai trong lời hứa; “đi trước” diễn đạt tự nhiên ý dẫn đường của לְפָנֶיךָ.
- source_word: וֶהֱבִיאֲךָ אֶל
  choice: và đưa con đến chỗ
  rationale: Hiphil của בוא mang nghĩa khiến đến, tức “đưa”; “đến chỗ” tự nhiên hơn khi đích đến được diễn tả bằng danh sách các dân tộc.
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: dân A-mô-rít ... dân Giê-bu-sít
  rationale: Các dạng chỉ dân trong tiếng Hê-bơ-rơ ở số ít mang nghĩa tập thể; tiếng Việt dùng “dân” trước tên phiên âm để thể hiện rõ các tộc người.
- source_word: וְהִכְחַדְתִּיו
  choice: rồi Ta sẽ tiêu diệt họ
  rationale: Hiphil của כחד diễn tả việc làm cho biến mất hoặc hủy diệt. Hậu tố số ít được hiểu theo nghĩa tập thể, nên tiếng Việt dùng “họ”; “rồi” thể hiện diễn tiến hệ quả tự nhiên mà không thay đổi nội dung.
theological_decisions:
- issue: Căn tính của מַלְאָכִי
  choice: Dịch là “thiên sứ của Ta” nhưng không xác định thêm căn tính của vị này.
  alternative: “sứ giả của Ta”; hoặc hiểu là sự hiện thân thần linh hay Ngôi Con trước khi nhập thể.
  rationale: Câu Hê-bơ-rơ chỉ gọi nhân vật này là thiên sứ/sứ giả của Đức Chúa Trời. Bản dịch không nên đưa một cách giải thích thần học về căn tính vào chính văn.
- issue: Số của tân ngữ trong וְהִכְחַדְתִּיו
  choice: Dùng đại từ số nhiều “họ” theo nghĩa tập thể.
  alternative: Dịch sát hình thức là “nó” hoặc “người ấy”.
  rationale: Hậu tố Hê-bơ-rơ là số ít nhưng quy chiếu tập thể đến toàn bộ các dân vừa liệt kê. “Họ” truyền đạt đúng nghĩa bằng tiếng Việt tự nhiên, còn chú thích bảo tồn đặc điểm hình thái của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” để phản ánh lời Đức Chúa Trời phán trực tiếp với đại diện dân giao ước; tên các dân được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
