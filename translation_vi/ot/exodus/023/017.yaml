  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính của nguyên văn Hê-bơ-rơ: tần suất ba lần trong năm, phạm vi “mọi nam giới của ngươi,” nghĩa thành ngữ của động từ Niphal là đến/trình diện trước Đấng có thẩm quyền, và tổ hợp tước hiệu kèm danh riêng “Chúa Yahweh.” Không thêm bớt nội dung đáng kể.'
