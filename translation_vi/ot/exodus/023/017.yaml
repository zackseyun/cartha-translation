source:
  edition: WLC
  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶל פְּנֵ֖י הָ/אָדֹ֥ן יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: vi
  text: Mỗi năm ba lần, tất cả nam giới của ngươi phải trình diện trước Chúa Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ đặt tước hiệu “Chúa” trước danh riêng “Yahweh”.
    reason: Làm rõ cấu trúc tước hiệu kết hợp với danh riêng của Đức Chúa Trời trong nguyên văn.
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Mỗi năm ba lần
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nghĩa ba lần trong chu kỳ hằng năm, đồng thời giữ nguyên số lần được quy định.
- source_word: יֵרָאֶה
  choice: phải trình diện
  rationale: Dạng Niphal của ראה trong bối cảnh đến trước một đấng có thẩm quyền mang nghĩa thành ngữ là xuất hiện hoặc trình diện. “Phải trình diện” tự nhiên, rõ tính quy định và không dịch máy móc là “được nhìn thấy”.
- source_word: כָּל זְכוּרְךָ
  choice: tất cả nam giới của ngươi
  rationale: Giữ rõ phạm vi chỉ những người nam như nguyên văn; đại từ số ít “ngươi” phản ánh hậu tố số ít, có thể chỉ cộng đồng Israel được nói như một toàn thể.
- source_word: אֶל פְּנֵי
  choice: trước
  rationale: Đây là thành ngữ chỉ việc vào trong sự hiện diện của một người; “trước” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: הָאָדֹן
  choice: Chúa
  rationale: אָדוֹן là tước hiệu thần linh mang nghĩa Chúa hoặc Chủ; “Chúa” là cách dịch trang trọng, quen thuộc và phù hợp ngữ cảnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó phân biệt rõ với הָאָדֹן ngay trước đó.
theological_decisions:
- issue: Cách dịch tổ hợp tước hiệu và danh riêng הָאָדֹן יְהוָה
  choice: Chúa Yahweh
  alternative: Chúa là Đức Giê-hô-va; Chúa là ĐỨC CHÚA
  rationale: Nguyên văn đặt tước hiệu הָאָדֹן liền trước danh riêng יְהוָה. “Chúa Yahweh” giữ được cả hai thành tố mà không biến danh riêng thành một tước hiệu hoặc tự ý thêm quan hệ đồng vị bằng từ “là”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Mỗi năm ba lần” tự nhiên hơn lối dịch sát chữ “ba lần trong năm”; “trình diện” phù hợp với bối cảnh nghi lễ và thẩm quyền. Đại từ “ngươi” được giữ để phản ánh cách xưng hô số ít của nguyên văn.
