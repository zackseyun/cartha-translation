  terminology: “Chúa Yahweh” phân biệt được הָאָדֹן với danh riêng יהוה, phù hợp quyết định thuật ngữ của dự án. Chú thích giải thích đúng chức năng tước hiệu-danh riêng, không áp đặt diễn giải giáo phái.
