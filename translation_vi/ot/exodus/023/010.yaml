  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: vi
  text: Trong sáu năm, ngươi phải gieo trên đất của ngươi và thu góp sản vật của đất đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hoa lợi của đất đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: Trong sáu năm
  rationale: Diễn đạt liên từ cùng cụm chỉ thời gian như một khung thời lượng tự nhiên trong tiếng Việt, thay vì dịch máy móc là “và sáu năm”.
- source_word: תִּזְרַע
  choice: ngươi sẽ gieo trồng
  rationale: Thể chưa hoàn thành ngôi hai số ít mang sắc thái quy định trong văn mạch luật pháp; “sẽ” giữ được lực chỉ thị, còn “gieo trồng” tự nhiên trong ngữ cảnh canh tác.
- source_word: אַרְצֶךָ
  choice: trên đất mình
  rationale: Ở đây אֶרֶץ chỉ phần đất canh tác thuộc về người được truyền lệnh, không phải trái đất nói chung; “đất mình” vừa rõ sở hữu vừa tự nhiên trong tiếng Việt.
- source_word: וְאָסַפְתָּ
  choice: và thu gom
  rationale: Giữ nghĩa rộng của אָסַף là gom, thu về, không thu hẹp thành một kỹ thuật thu hoạch cụ thể.
- source_word: תְּבוּאָתָהּ
  choice: sản vật của đất ấy
  rationale: תְּבוּאָה chỉ sản lượng hay sản vật nông nghiệp. Cách diễn đạt này thể hiện rõ hậu tố giống cái số ít quy chiếu về mảnh đất và vẫn giữ nghĩa khái quát.
