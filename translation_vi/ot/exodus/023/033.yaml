  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: vi
  text: Chúng không được ở trong xứ ngươi, kẻo chúng khiến ngươi phạm tội chống lại ta. Vì ngươi sẽ phụng sự các thần của chúng,[a] và điều đó sẽ thành cạm bẫy cho ngươi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì nếu ngươi phụng sự các thần của chúng.” Liên từ Hê-bơ-rơ có thể được hiểu theo nghĩa giải thích hoặc theo nghĩa điều kiện.'
    reason: alternative_reading
  - marker: b
    text: “Cạm bẫy” dịch từ từ Hê-bơ-rơ mô tả một cái bẫy, được dùng ở đây như hình ảnh về điều dẫn đến sa ngã hoặc tai họa.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: sống
  rationale: Động từ ישׁב trong bối cảnh cư trú có nghĩa là sống, ở hoặc định cư. “Sống” tự nhiên trong tiếng Việt hiện đại và không diễn giải quá mức về tính lâu dài.
- source_word: בְּאַרְצְךָ
  choice: trong xứ của ngươi
  rationale: אֶרֶץ ở đây chỉ lãnh thổ được nói đến trong bối cảnh giao ước. “Xứ” giữ được sắc thái lãnh thổ và phù hợp với văn phong trang trọng.
- source_word: פֶּן
  choice: kẻo
  rationale: פֶּן mở đầu một hậu quả đáng tránh; “kẻo” diễn đạt gọn và chính xác ý cảnh báo, phòng ngừa.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: chúng khiến ngươi phạm tội nghịch cùng ta
  rationale: Dạng Hiphil của חטא mang nghĩa gây khiến. לִי được hiểu theo quan hệ đạo đức là phạm tội chống nghịch Đức Chúa Trời.
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: ngươi sẽ phụng sự các thần của chúng
  rationale: עבד khi có các thần làm đối tượng bao hàm việc phục vụ, thờ phượng và bày tỏ lòng trung thành. “Phụng sự” giữ được ngôn ngữ trực tiếp của bản Hê-bơ-rơ mà vẫn gợi rõ bối cảnh thờ thần.
- source_word: אֱלֹהֵיהֶם
  choice: các thần của chúng
  rationale: Đây là dạng số nhiều; “các thần” là cách dịch trực tiếp, rõ ràng và không làm nhẹ tính chất đa thần của đối tượng được nói đến.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: điều đó sẽ trở thành cạm bẫy cho ngươi
  rationale: מוֹקֵשׁ là bẫy hoặc cạm bẫy, được dùng ẩn dụ về điều dẫn người ta đến sa ngã hay tai họa. “Điều đó” quy chiếu tự nhiên đến việc phụng sự các thần.
theological_decisions:
- issue: Tính chất của tội lỗi được cảnh báo
  choice: Câu này liên kết trực tiếp tội nghịch cùng Đức Chúa Trời với việc phụng sự các thần của các dân ấy.
  alternative: Hiểu đây chủ yếu là lời cảnh báo chung về ảnh hưởng đạo đức hoặc văn hóa của những dân cư ngoại bang.
  rationale: Mệnh đề nói rõ “phụng sự các thần của chúng”, nên trọng tâm là sự bất trung qua việc thờ thần khác, chứ không phải một lời khẳng định tổng quát về sắc tộc hay văn hóa.
- issue: Cách hiểu כִּי trước תַעֲבֹד
  choice: 'Dịch theo nghĩa giải thích hoặc nêu kết quả có khả năng xảy ra: “vì ngươi sẽ phụng sự”.'
  alternative: 'Dịch theo điều kiện: “vì nếu ngươi phụng sự các thần của chúng”.'
  rationale: כִּי có thể mở đầu lời giải thích, còn dạng vị lai của động từ có thể trình bày kết quả được cảnh báo. Bản dịch chính không biến mệnh đề thành điều kiện một cách chắc chắn; chú thích ghi nhận cách hiểu điều kiện hợp lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” được giữ để phù hợp với lời phán trực tiếp ở số ít và sắc thái Kinh Thánh; tránh các từ quá cổ như “lưu ngụ”. Dấu phẩy trước [a] được đặt sau cụm kết thúc mệnh đề theo quy ước trình bày.
