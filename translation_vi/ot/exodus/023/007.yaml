  text: מִ/דְּבַר שֶׁ֖קֶר תִּרְחָ֑ק וְ/נָקִ֤י וְ/צַדִּיק֙ אַֽל תַּהֲרֹ֔ג כִּ֥י לֹא אַצְדִּ֖יק רָשָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: vi
  text: Hãy tránh xa điều giả dối[a]. Đừng giết người vô tội và người công chính, vì Ta sẽ không tuyên kẻ gian ác là công chính[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tránh xa lời khai gian,” “cáo buộc sai” hoặc “lời nói dối.” Từ Hê-bơ-rơ được dịch là “điều” có nghĩa rộng, có thể chỉ lời nói, sự việc hoặc vụ việc pháp lý.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vì Ta sẽ không tha bổng người có tội.” Động từ Hê-bơ-rơ mang nghĩa pháp đình: tuyên là công chính, xác nhận là đúng hoặc tha bổng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/דְּבַר שֶׁקֶר
  choice: mọi lời dối trá
  rationale: דָּבָר có nghĩa rộng là lời nói, sự việc hoặc vụ việc. Trong ngữ cảnh pháp lý, “lời dối trá” tự nhiên trong tiếng Việt và có thể bao hàm lời khai gian, cáo buộc sai hoặc vụ việc gian dối; chú thích giữ lại phạm vi rộng hơn.
- source_word: תִּרְחָק
  choice: Hãy tránh xa
  rationale: Dạng Qal chưa hoàn thành ngôi hai số ít mang lực mệnh lệnh; “hãy tránh xa” diễn đạt sự chủ động giữ khoảng cách mà vẫn tự nhiên.
- source_word: וְ/נָקִי
  choice: người vô tội
  rationale: נָקִי chỉ người không mắc tội hoặc không có lỗi; “người vô tội” rõ nghĩa trong bối cảnh xét xử.
- source_word: וְ/צַדִּיק
  choice: người công chính
  rationale: צַדִּיק có thể chỉ người công chính hoặc người đúng lẽ trong một vụ kiện. “Người công chính” giữ liên hệ từ vựng với động từ cùng gốc ở cuối câu.
- source_word: אַל תַּהֲרֹג
  choice: Đừng giết
  rationale: הרג là động từ khái quát nghĩa là giết; không thu hẹp thành “sát nhân”, còn bối cảnh pháp lý có thể bao gồm việc xử tử oan.
- source_word: לֹא אַצְדִּיק
  choice: Ta sẽ không tuyên ... là công chính
  rationale: 'Hiphil của צדק mang nghĩa pháp đình: tuyên là công chính, xác nhận là đúng hoặc tha bổng. Cách dịch này vừa làm rõ hành vi tuyên án vừa giữ liên hệ với צַדִּיק.'
- source_word: רָשָׁע
  choice: kẻ gian ác
  rationale: רָשָׁע có thể là kẻ gian ác hoặc người có tội trong bối cảnh pháp lý. “Kẻ gian ác” giữ sắc thái đạo đức-pháp lý rộng; nghĩa “người có tội” được nêu trong chú thích.
theological_decisions:
- issue: Ý nghĩa pháp đình trong lời tuyên bố của Đức Chúa Trời
  choice: vì Ta sẽ không tuyên kẻ gian ác là công chính
  alternative: vì Ta sẽ không tha bổng người có tội
  rationale: Bản dịch chính giữ cả tính chất pháp đình lẫn phép liên kết từ ngữ giữa צַדִּיק và אַצְדִּיק, không biến câu này thành một khẳng định giáo lý rộng hơn bối cảnh xét xử. Cách dịch “tha bổng người có tội” là một khả năng mạnh theo ngữ cảnh và được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “Ta” phản ánh lời phán của Đức Chúa Trời. Bản dịch giữ ngôi hai số ít của tiếng Hê-bơ-rơ bằng mệnh lệnh chung trong tiếng Việt, vốn không đánh dấu số rõ ràng.
