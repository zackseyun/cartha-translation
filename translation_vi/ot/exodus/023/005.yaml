source:
  edition: WLC
  text: כִּֽי תִרְאֶ֞ה חֲמ֣וֹר שֹׂנַאֲ/ךָ֗ רֹבֵץ֙ תַּ֣חַת מַשָּׂא֔/וֹ וְ/חָדַלְתָּ֖ מֵ/עֲזֹ֣ב ל֑/וֹ עָזֹ֥ב תַּעֲזֹ֖ב עִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: vi
  text: Nếu con thấy con lừa của người ghét con đang nằm dưới gánh của nó, và con định không giúp người ấy[a], thì con nhất định phải hợp sức với người ấy để giúp đỡ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ ở đây thường có nghĩa là “bỏ” hoặc “để lại,” nhưng trong ngữ cảnh này mang nghĩa “giúp đỡ.”
    reason: lexical_alternative
  - marker: b
    text: Cụm này cũng có thể hiểu là “con nhất định phải giúp nó,” tức là giúp con lừa. Đại từ giống đực số ít trong tiếng Hê-bơ-rơ có thể chỉ người chủ hoặc con lừa.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong văn luật pháp theo tình huống, כִּי mở đầu một điều kiện; “Nếu” truyền đạt tự nhiên cấu trúc ấy.
- source_word: תִרְאֶה
  choice: con thấy
  rationale: Giữ nghĩa trực tiếp của ראה mà không thêm ý tình cờ gặp.
- source_word: חֲמוֹר
  choice: con lừa
  rationale: Từ tương đương thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: שֹׂנַאֲךָ
  choice: kẻ ghét con
  rationale: Phản ánh sát phân từ “người ghét con”, không mở rộng thành phạm trù tổng quát hơn là “kẻ thù”.
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: nằm quỵ dưới gánh nặng của nó
  rationale: רבץ chỉ tư thế con vật nằm xuống; “nằm quỵ” diễn đạt tự nhiên tình trạng bị đè dưới vật chở mà không khẳng định nó đã ngã gục hoàn toàn.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: và con định không giúp người ấy
  rationale: Cấu trúc khó này nói đến ý muốn hoặc khả năng không chịu trợ giúp; cách dịch giữ sắc thái ấy trong tiếng Việt tự nhiên.
- source_word: עָזֹב תַּעֲזֹב
  choice: con nhất định phải ... đỡ nó dậy
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh mệnh lệnh. Trong ngữ cảnh, עזב mang nghĩa trợ giúp, có lẽ bằng cách giải phóng hoặc nâng con vật khỏi gánh.
- source_word: עִמּוֹ
  choice: cùng người ấy
  rationale: Hậu tố giống đực số ít có thể chỉ người chủ hoặc con lừa; bản dịch chính hiểu là người chủ và giữ ý hai người cùng hành động.
theological_decisions:
- issue: Đối tượng được đại từ עִמּוֹ quy chiếu
  choice: cùng người ấy (người chủ ghét con)
  alternative: với nó (con lừa)
  rationale: Cả người chủ lẫn con lừa đều là danh từ giống đực số ít trong tiếng Hê-bơ-rơ. Mạch luật luân lý thiên về việc cùng người chủ trợ giúp con vật, nhưng cách hiểu chỉ con lừa vẫn có thể có nên được giữ trong chú thích.
- issue: Nghĩa của עזב trong mệnh lệnh
  choice: giúp, cụ thể là đỡ con vật dậy
  alternative: tháo gánh/giải phóng con vật khỏi gánh
  rationale: Động từ thường có nghĩa “bỏ, để lại”, nhưng trong ngữ cảnh này mang ý trợ giúp. Hành động chính xác—tháo gánh hay nâng con vật—không hoàn toàn minh nhiên, nên chú thích ghi nhận khả năng khác.
translation_notes:
  register: Dùng văn phong luật pháp trang trọng nhưng dễ hiểu. Đại từ “con” phù hợp lời phán trực tiếp trong ngữ cảnh giao ước; “kẻ ghét con” giữ sát sắc thái nguyên ngữ hơn “kẻ thù”. Câu chính diễn giải hành động trợ giúp là cùng người chủ đỡ con vật dậy, đồng thời chú thích bảo lưu khả năng hiểu khác của tiếng Hê-bơ-rơ.
