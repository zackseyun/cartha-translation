revisions:
- from: Nếu con thấy con lừa của kẻ ghét con nằm quỵ dưới gánh nặng của nó[a], và con định không giúp người ấy[b], thì con nhất định phải cùng người ấy đỡ nó dậy.
  to: Nếu con thấy con lừa của người ghét con đang nằm dưới gánh của nó, và con định không giúp người ấy[a], thì con nhất định phải hợp sức với người ấy để giúp đỡ[b].
  rationale: Bản sửa loại bỏ chi tiết “đỡ nó dậy,” vì đó là một cách hình dung hợp lý nhưng không được nêu rõ trong nguyên ngữ. Câu sửa vẫn biểu đạt mệnh lệnh nhấn mạnh phải trợ giúp và cách hiểu chính rằng người nghe hợp sức với người chủ; chú thích riêng bảo lưu khả năng đại từ cuối chỉ con lừa. Các chú thích cũng được tách ra để mỗi chú thích gắn với đúng vấn đề ngữ nghĩa của nó.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:48:22Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng tình huống pháp lý, đối tượng là con lừa của người ghét người nghe, và mệnh lệnh phải trợ giúp. Tuy nhiên, cụm “đỡ nó dậy” xác định một thao tác cụ thể không có trong tiếng Hê-bơ-rơ. עזב trong ngữ cảnh này đòi hỏi ý trợ giúp, nhưng bản thân câu không quyết định rõ là nâng con vật, tháo gánh, hay một hình thức trợ giúp khác. Cần bỏ sự thêm nghĩa này và giữ mơ hồ có chủ ý ở đại từ cuối.
  naturalness: “Nằm quỵ dưới gánh nặng” hơi diễn giải tình trạng con vật hơn mức cần thiết. “Đang nằm dưới gánh của nó” tự nhiên, sát nghĩa, và không thêm ý con vật đã ngã quỵ. “Hợp sức với người ấy để giúp đỡ” diễn đạt rõ và tự nhiên hơn cách ghép sát “giúp cùng người ấy”, đồng thời không ấn định thao tác trợ giúp.
  terminology: “Con lừa,” “người ghét con,” và cách xưng hô “con” phù hợp văn phong hiện đại, trang trọng của bản văn giao ước. “Người ghét con” giữ đúng sắc thái phân từ của שֹׂנַאֲךָ, thay vì mở rộng thành “kẻ thù.”
  issues:
  - severity: medium
    issue: Bản văn chính thêm hành động “đỡ nó dậy.”
    rationale: Nguyên ngữ chỉ nhấn mạnh phải trợ giúp (עזב), cùng với người chủ theo cách hiểu chính của עִמּוֹ; không nói rõ phải nâng con lừa dậy. Việc thêm thao tác này thu hẹp nghĩa và làm mất tính mở của bản văn.
  - severity: low
    issue: Chú thích a hiện tại không nêu một phương án dịch có ý nghĩa đáng kể, còn chú thích b gộp hai vấn đề khác nhau.
    rationale: “Dưới vật nó đang chở” chỉ là diễn giải lại “dưới gánh của nó.” Nên dùng các chú thích riêng để ghi nhận nghĩa bất thường của עזב và sự quy chiếu còn tranh luận của đại từ cuối.
