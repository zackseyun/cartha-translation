base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: vi
  text: Ta sẽ không đuổi chúng ra khỏi trước mặt con trong một năm, kẻo đất trở nên hoang vu và thú hoang ngoài đồng sinh sôi quá nhiều, gây hại cho con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thú hoang ngoài đồng” cũng có thể dịch là “thú đồng” hoặc “thú hoang của đồng nội.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: Ta sẽ không đuổi chúng
  rationale: Động từ גרש có nghĩa là đuổi đi hoặc trục xuất. Hậu tố tân ngữ ở dạng số ít nhưng trong ngữ cảnh chỉ tập thể các dân cư đã được nhắc đến; tiếng Việt dùng “chúng” để diễn đạt tự nhiên và rõ nghĩa tập thể.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt con
  rationale: Giữ hình ảnh không gian của thành ngữ Hê-bơ-rơ, đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: בְּשָׁנָה אֶחָת
  choice: chỉ trong một năm
  rationale: Diễn đạt khoảng thời gian một năm duy nhất; “chỉ” làm rõ sắc thái giới hạn của אֶחָת mà không thay đổi ý.
- source_word: פֶּן
  choice: kẻo
  rationale: “Kẻo” diễn đạt tự nhiên mệnh đề cảnh báo về kết quả không mong muốn do פן dẫn vào.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: đất trở nên hoang vu
  rationale: שְׁמָמָה chỉ tình trạng hoang vắng, bị bỏ phế; cách dịch này giữ sắc thái kết quả và phù hợp văn cảnh.
- source_word: וְרַבָּה
  choice: sinh sôi quá nhiều
  rationale: רבה nghĩa là gia tăng hoặc trở nên đông; “quá nhiều” thể hiện hệ quả bất lợi vốn rõ trong ngữ cảnh.
- source_word: עָלֶיךָ
  choice: gây hại cho con
  rationale: Giới từ על ở đây biểu thị tác động bất lợi đối với Israel. Dịch theo chức năng giúp câu tiếng Việt tự nhiên hơn “trên con” hay “chống lại con” khi chủ thể là thú đồng.
- source_word: חַיַּת הַשָּׂדֶה
  choice: thú đồng
  rationale: Cụm từ chỉ các loài thú hoang sống ngoài đồng. “Thú đồng” ngắn gọn, trang trọng và quen thuộc trong văn phong Kinh Thánh; cũng có thể diễn đạt rõ hơn là “thú hoang ngoài đồng”.
