  yaml_path: translation/ot/exodus/023/003.yaml
  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: vi
  text: Đừng thiên vị người nghèo trong vụ kiện của người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng tôn trọng người nghèo trong vụ việc của người ấy.” Động từ Hê-bơ-rơ có nghĩa sát hơn là “tôn trọng,” nhưng trong bối cảnh xét xử, từ này nói đến việc ưu ái hoặc thiên vị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: Đừng
  rationale: Liên từ nối điều cấm này với các luật trước đó; trong tiếng Việt, không cần dịch riêng để câu luật tự nhiên và gọn rõ.
- source_word: דָל
  choice: người nghèo
  rationale: Danh từ số ít chỉ một người nghèo khó, thấp kém hoặc yếu thế về địa vị; “người nghèo” là cách diễn đạt tự nhiên và không làm mất tính cá nhân của trường hợp pháp lý.
- source_word: לֹא תֶהְדַּר
  choice: Đừng thiên vị
  rationale: Trong bối cảnh xét xử, động từ הדר diễn tả việc dành sự ưu ái không chính đáng; “thiên vị” truyền đạt đúng sắc thái pháp lý hơn nghĩa sát chữ “tôn trọng” hay “tôn vinh”.
- source_word: בְּרִיבוֹ
  choice: trong vụ kiện của người ấy
  rationale: רִיב ở đây chỉ vụ tranh tụng hoặc vụ việc pháp lý; hậu tố ngôi thứ ba giống đực số ít được thể hiện bằng “của người ấy”.
theological_decisions:
- issue: Quan tâm đến người nghèo nhưng không thiên vị trong xét xử
  choice: Câu này cấm thiên vị người nghèo trong một vụ kiện.
  alternative: Câu này truyền lệnh phải tôn trọng người nghèo nói chung.
  rationale: Ngữ cảnh luật pháp và cụm “trong vụ kiện của người ấy” cho thấy trọng tâm là công lý không thiên vị, chứ không phủ nhận lòng thương xót đối với người nghèo hay đưa ra một mệnh lệnh chung về việc tôn trọng họ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “đừng” cho lệnh cấm trực tiếp; “vụ kiện” làm rõ bối cảnh pháp lý. Đại từ “người ấy” giữ tham chiếu số ít mà không dùng cách nói nặng tính giới.
