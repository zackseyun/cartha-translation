base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: vi
  text: Anh em phải phụng sự Yahweh, Đức Chúa Trời của anh em. Ngài sẽ ban phước cho bánh và nước uống của anh em, còn Ta sẽ loại bỏ bệnh tật khỏi giữa anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn mở đầu bằng hình thức số nhiều (“anh em”), rồi dùng các hậu tố sở hữu số ít khi gọi Israel như một tập thể; câu cũng chuyển từ “Ngài sẽ ban phước” sang “Ta sẽ loại bỏ.”
    reason: source_ambiguity
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: Anh em phải phụng sự
  rationale: Động từ עבד trong bối cảnh giao ước bao gồm việc phục vụ và thờ phượng Đức Chúa Trời. “Phụng sự” giữ được phạm vi rộng ấy, còn “phải” truyền đạt lực mệnh lệnh của câu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên tên riêng trong Hê-bơ-rơ thay vì thay bằng một tước hiệu; dạng “Yahweh” cũng phù hợp với lớp tham khảo đã được kiểm định.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Trong quan hệ với Yahweh, danh từ này rõ ràng chỉ Đức Chúa Trời số ít; hậu tố sở hữu diễn tả quan hệ giao ước với cộng đồng được ngỏ lời.
- source_word: וּבֵרַךְ
  choice: Ngài sẽ ban phước
  rationale: Dạng động từ diễn tả lời hứa hay kết quả tương lai sau mệnh lệnh. Đại từ “Ngài” làm rõ chủ thể được hiểu ngầm là Yahweh.
- source_word: לַחְמְךָ
  choice: bánh
  rationale: Giữ nghĩa cụ thể, trực tiếp của לֶחֶם; từ này cũng có thể được dùng theo nghĩa rộng hơn là lương thực, nên ghi chú phương án ấy.
- source_word: מֵימֶיךָ
  choice: nước
  rationale: Danh từ Hê-bơ-rơ có hình thức số nhiều nhưng thường mang nghĩa tập hợp; “nước” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: וַהֲסִרֹתִי
  choice: còn Ta sẽ cất
  rationale: Thể khiến của động từ mang nghĩa loại bỏ hoặc cất đi. “Cất” tự nhiên trong lời hứa này; “còn Ta” bảo tồn sự chuyển đột ngột từ ngôi thứ ba sang ngôi thứ nhất trong nguyên văn.
- source_word: מַחֲלָה
  choice: bệnh tật
  rationale: Cụm từ tiếng Việt tự nhiên, bao quát nghĩa bệnh hoạn hay bệnh dịch mà không thu hẹp vào một chẩn đoán cụ thể.
- source_word: מִקִּרְבֶּךָ
  choice: khỏi giữa anh em
  rationale: Bảo tồn ý nghĩa cộng đồng của “khỏi giữa/ngay trong cộng đồng ngươi”, thay vì hiểu riêng là bệnh bên trong thân thể một cá nhân.
theological_decisions:
- issue: Cách dịch danh Yahweh
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm tên riêng tránh thay nó bằng một tước hiệu hoặc áp đặt một truyền thống phiên âm khác.
- issue: Sự thay đổi số của ngôi thứ hai
  choice: Dùng “anh em” xuyên suốt trong chính văn và ghi chú hình thái Hê-bơ-rơ
  alternative: 'Dịch cứng sự chuyển từ số nhiều sang số ít: “các ngươi… của ngươi”'
  rationale: Hê-bơ-rơ mở đầu bằng động từ ngôi hai số nhiều, rồi dùng các hậu tố số ít để gọi cả Israel như một tập thể. Tiếng Việt không bắt buộc tái tạo sự chuyển số gây gượng gạo; ghi chú bảo tồn dữ kiện của nguyên văn.
- issue: Sự chuyển ngôi của chủ thể ban phước
  choice: Giữ “Ngài sẽ… còn Ta sẽ…”
  alternative: Đồng nhất thành “Ngài sẽ… và Ngài sẽ…” hoặc “Ta sẽ… và Ta sẽ…”
  rationale: Nguyên văn chuyển từ chủ thể Yahweh ở ngôi thứ ba sang lời nói ngôi thứ nhất mà không giải thích. Giữ nguyên sự chuyển ngôi để không âm thầm giải quyết căng thẳng văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” diễn tả lời ngỏ với cộng đồng mà không mang sắc thái cổ quá mạnh; “phụng sự” giữ cả ý phục vụ lẫn thờ phượng. Chính văn bảo tồn sự chuyển ngôi “Ngài… Ta” của tiếng Hê-bơ-rơ.
