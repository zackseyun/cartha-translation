base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: vi
  text: Ngươi không được phủ phục trước các thần của chúng, không được phụng sự các thần ấy, cũng không được làm theo việc làm của chúng; trái lại, ngươi phải triệt hạ chúng hoàn toàn và phải đập tan cho kỳ được các trụ đá[a] của chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các trụ thờ” hoặc “những hòn đá dựng đứng”. Từ Hê-bơ-rơ chỉ những khối đá dựng đứng có liên hệ với việc thờ cúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: phủ phục
  rationale: Diễn tả hành động cụ thể cúi rạp mình để tỏ lòng tôn kính, thay vì chuyển ngay thành khái niệm rộng hơn là “thờ phượng”.
- source_word: לֵאלֹהֵיהֶם
  choice: trước các thần của chúng
  rationale: Giới từ ל đi với động từ phủ phục có thể diễn đạt tự nhiên là “trước”; “các thần” chỉ các thần của những dân tộc, không phải Đức Chúa Trời của Israel.
- source_word: תָעָבְדֵם
  choice: phụng sự các thần ấy
  rationale: עבד có nghĩa là phục vụ, và trong ngữ cảnh này bao hàm việc phụng sự trong nghi lễ. Cách dịch này giữ sự phân biệt với hành động phủ phục ở vế trước.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: làm theo những việc chúng làm
  rationale: Giữ sát cấu trúc “làm theo các việc của chúng” nhưng diễn đạt tự nhiên trong tiếng Việt; ngữ cảnh cho thấy đặc biệt nhắm đến các tập tục tôn giáo của các dân ấy.
- source_word: כִּי
  choice: trái lại
  rationale: Trong mạch câu, כִּי mở đầu mệnh lệnh tương phản mạnh với những điều vừa bị cấm; “trái lại” truyền đạt chức năng đối lập này rõ ràng.
- source_word: הָרֵס תְּהָרְסֵם
  choice: phải triệt hạ chúng hoàn toàn
  rationale: Kết cấu nguyên mẫu tuyệt đối đi cùng động từ hữu hạn nhấn mạnh mức độ và tính dứt khoát của mệnh lệnh. “Chúng” giữ đại từ của nguyên văn và không xác định quá mức đối tượng được phá hủy.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: và đập tan
  rationale: Kết cấu lặp trong tiếng Hê-bơ-rơ có tác dụng nhấn mạnh; “đập tan” vừa mạnh vừa thích hợp với các vật thể bằng đá. Ý nhấn mạnh chung được thể hiện qua “phải” và “hoàn toàn” trong cụm mệnh lệnh liền trước.
- source_word: מַצֵּבֹתֵיהֶם
  choice: các trụ đá của chúng
  rationale: מַצֵּבָה là đá dựng đứng hay trụ đá, thường có chức năng thờ cúng. “Trụ đá” rõ nghĩa, cụ thể và tránh khiến độc giả nghĩ đến cột kiến trúc thông thường; sắc thái nghi lễ được giải thích trong chú thích.
theological_decisions:
- issue: Bản chất của những hành vi bị cấm đối với các thần ngoại bang
  choice: Giữ riêng hai hành vi “phủ phục” và “phụng sự”, qua đó cấm cả cử chỉ tôn kính bên ngoài lẫn sự phục vụ mang tính thờ cúng.
  alternative: Gộp hoặc diễn giải cả hai bằng từ “thờ phượng”.
  rationale: Nguyên văn dùng hai động từ khác nhau. Giữ sự phân biệt này bảo toàn sức nặng tu từ và phạm vi toàn diện của điều cấm mà không thu hẹp hay đồng nhất các hành vi.
- issue: Đối tượng của mệnh lệnh phá hủy
  choice: Giữ đại từ “chúng” trong mệnh lệnh “triệt hạ”, rồi để vế sau xác định rõ các trụ đá là vật thể thờ cúng phải bị đập tan.
  alternative: Nói rõ ngay rằng phải phá hủy “các tượng thần” hoặc “các vật thờ cúng”.
  rationale: Hậu tố đại từ trong nguyên văn có thể liên hệ theo lối hoán dụ với các thần hay các vật thờ cúng của chúng. Việc không thêm một danh từ cụ thể bảo tồn độ mở của câu Hê-bơ-rơ, còn vế nói về trụ đá làm rõ hướng quy chiếu hữu hình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “ngươi” để giữ lối xưng hô số ít của điều luật trong ngữ cảnh giao ước; tránh các thuật ngữ mang dấu ấn riêng của một hệ phái. Dấu chú thích [a] được đặt ngay sau “trụ đá”, là từ mà chú thích giải nghĩa.
