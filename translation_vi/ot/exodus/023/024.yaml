  source_fidelity: Bản dịch giữ được các mệnh lệnh phủ định, sự phân biệt giữa hành vi phủ phục và phụng sự, cùng tính nhấn mạnh của mệnh lệnh phá hủy. Tuy nhiên, cụm “những việc chúng làm” không tự nhiên và có thể làm mờ tương ứng trực tiếp với “việc làm/các việc” trong tiếng Hê-bơ-rơ. Mệnh lệnh thứ hai cũng nên biểu lộ riêng sắc thái nhấn mạnh của cấu trúc nguyên mẫu tuyệt đối + động từ hữu hạn.
