review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa liên kết cú pháp: nguyên văn mở mệnh đề thứ hai bằng “và” (וְאַתֶּם), còn bản thảo dùng “vì” rồi lại dùng “bởi”, làm quan hệ lập luận bị chồng chéo. “Tâm trạng” thu hẹp נֶפֶשׁ vào trạng thái cảm xúc tạm thời; trong ngữ cảnh này cụm từ nói đến sự thấu hiểu thân phận/cảnh ngộ của người ngoại kiều từ kinh nghiệm bản thân.'
  naturalness: “Anh em không được áp bức người ngoại kiều” là tự nhiên, trang trọng và phù hợp văn phong luật pháp. “Chính anh em cũng biết thân phận của...” diễn đạt rõ, hiện đại, đồng thời giữ được ý nhấn mạnh và trải nghiệm của nguyên văn.
  terminology: Giữ nhất quán “người ngoại kiều/ngoại kiều” cho גֵר. Giữ “áp bức” cho לחץ. Dùng “thân phận” trong văn bản chính và chú thích sát nghĩa về נֶפֶשׁ để không áp đặt nghĩa “linh hồn” theo cách hiểu hậu kỳ hoặc giới hạn nghĩa vào “tâm trạng”.
  issues:
  - severity: medium
    issue: Liên từ “vì ... bởi” không phản ánh rõ cấu trúc phối hợp rồi nguyên nhân của nguyên văn.
    rationale: וְאַתֶּם יְדַעְתֶּם là mệnh đề phối hợp, và כִּי mới giới thiệu lý do. Đổi thành “và ... vì” bảo toàn quan hệ này.
  - severity: medium
    issue: “Tâm trạng” quá hẹp cho נֶפֶשׁ trong cụm thành ngữ này.
    rationale: Từ này có phạm vi rộng hơn một cảm xúc nhất thời; ngữ cảnh nhấn mạnh sự biết và cảm thông đối với đời sống hay thân phận của người ngoại kiều.
