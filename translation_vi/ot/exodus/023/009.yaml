source:
  edition: WLC
  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: vi
  text: Anh em không được áp bức người ngoại kiều[a], và chính anh em cũng biết thân phận của người ngoại kiều[b], vì anh em đã từng là ngoại kiều trong đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người ngoại quốc”, “người tạm trú” hoặc “khách lạ”. Từ Hê-bơ-rơ gēr chỉ người không phải dân bản xứ nhưng sống giữa một dân tộc, thường ở địa vị xã hội dễ bị tổn thương.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “biết sự sống (nephesh) của người ngoại kiều.” Đây là cách nói diễn tả sự hiểu biết do từng trải về đời sống, nội tâm hoặc cảnh ngộ của họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: người ngoại kiều
  rationale: Chỉ người không phải dân bản xứ nhưng cư trú giữa một cộng đồng, thường ở địa vị dễ bị tổn thương; “người ngoại kiều” diễn đạt khá rõ phạm trù cư trú-xã hội này trong tiếng Việt hiện đại.
- source_word: תִלְחָץ
  choice: áp bức
  rationale: Trong ngữ cảnh luật pháp, động từ diễn tả việc gây sức ép, chèn ép hoặc bóc lột người yếu thế; “áp bức” giữ được sức nặng đạo đức-xã hội.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: vì chính anh em biết
  rationale: Đại từ tường minh וְאַתֶּם tạo ý nhấn mạnh, được thể hiện bằng “chính anh em”; thể hoàn thành nói đến sự hiểu biết do trải nghiệm đã qua, và liên từ được diễn đạt tự nhiên theo quan hệ giải thích.
- source_word: נֶפֶשׁ הַגֵּר
  choice: tâm trạng của người ngoại kiều
  rationale: נֶפֶשׁ trong thành ngữ này nói đến nội tâm và hoàn cảnh được cảm nhận từ bên trong, không nhất thiết là “linh hồn” theo nghĩa nhị nguyên; “tâm trạng” tự nhiên và vẫn giữ nét nội tâm của nguyên văn.
- source_word: כִּי
  choice: bởi
  rationale: 'Liên từ dẫn vào căn nguyên của sự hiểu biết: họ biết vì chính họ từng sống trong địa vị ấy.'
- source_word: גֵרִים הֱיִיתֶם
  choice: anh em đã từng là ngoại kiều
  rationale: Lặp lại “ngoại kiều” để bảo toàn mối liên hệ tu từ với danh từ גֵר ở đầu câu; “đã từng” làm rõ kinh nghiệm quá khứ.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: trong đất Ai Cập
  rationale: Phản ánh đầy đủ cấu trúc Hê-bơ-rơ “trong đất xứ Ai Cập” mà không dùng cách nói nặng nề; đây cũng là lối diễn đạt Kinh Thánh trang trọng, dễ hiểu.
theological_decisions:
- issue: Cách dịch גֵר trong luật giao ước
  choice: người ngoại kiều
  alternative: người ngoại quốc; người tạm trú; khách lạ
  rationale: Từ này không chỉ nói về nguồn gốc dân tộc hay một khách qua đường, mà về người không bản xứ đang cư trú giữa dân chúng và có địa vị xã hội dễ bị tổn thương. Cách dịch được giữ nhất quán ở cả mệnh lệnh lẫn lời nhắc về kinh nghiệm của Israel.
- issue: Cách hiểu נֶפֶשׁ trong thành ngữ אֶת־נֶפֶשׁ הַגֵּר
  choice: tâm trạng của người ngoại kiều
  alternative: linh hồn của người ngoại kiều; cuộc sống của người ngoại kiều; cảnh ngộ của người ngoại kiều
  rationale: Không áp đặt một nhân học nhị nguyên lên נֶפֶשׁ. Trong câu này, cụm từ nhấn mạnh sự thấu hiểu từ kinh nghiệm đối với nội tâm hay cảm nhận sống của người ngoại kiều; chú thích bảo tồn sắc thái chữ nghĩa và độ rộng nghĩa.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến toàn thể Israel; giữ sự lặp lại của “người ngoại kiều/ngoại kiều” để tái hiện lập luận dựa trên kinh nghiệm lịch sử của dân chúng.
