source:
  edition: WLC
  text: מְעַ֥ט מְעַ֛ט אֲגָרְשֶׁ֖/נּוּ מִ/פָּנֶ֑י/ךָ עַ֚ד אֲשֶׁ֣ר תִּפְרֶ֔ה וְ/נָחַלְתָּ֖ אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: vi
  text: Ta sẽ dần dần đuổi chúng khỏi trước mặt con,[a] cho đến khi con sinh sôi đông đúc và chiếm hữu miền đất ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng đại từ số ít “nó/người ấy”, có lẽ chỉ chung các cư dân hoặc các dân trong xứ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhận miền đất ấy làm cơ nghiệp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: dần dần
  rationale: Phép lặp diễn tả tiến trình từng bước theo thời gian; “dần dần” là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲגָרְשֶׁנּוּ
  choice: Ta sẽ ... đuổi chúng
  rationale: Động từ גרשׁ có nghĩa là đuổi đi hoặc trục xuất. Hậu tố trong tiếng Hê-bơ-rơ ở ngôi ba số ít nhưng chỉ tập thể các cư dân hay dân tộc trong xứ; tiếng Việt dùng “chúng” để diễn đạt rõ nghĩa tập thể.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt con
  rationale: Giữ hình ảnh “mặt/sự hiện diện” của thành ngữ Hê-bơ-rơ, đồng thời vẫn dễ hiểu trong tiếng Việt.
- source_word: עַד אֲשֶׁר
  choice: cho đến khi
  rationale: Diễn đạt tự nhiên điểm kết thúc của tiến trình đuổi đi từng bước.
- source_word: תִּפְרֶה
  choice: con sinh sôi đông đúc
  rationale: Động từ פרה mang nghĩa sinh sôi, gia tăng; trong ngữ cảnh, ý nói dân số Israel tăng đủ để cư ngụ trong xứ.
- source_word: וְנָחַלְתָּ
  choice: và chiếm hữu
  rationale: Động từ נחל có thể chỉ việc nhận làm cơ nghiệp hoặc chiếm hữu. “Chiếm hữu” phù hợp với ngữ cảnh định cư mà không loại bỏ sắc thái nhận đất làm phần sở hữu.
- source_word: אֶת־הָאָרֶץ
  choice: miền đất ấy
  rationale: Chỉ miền đất đã được nói đến trong ngữ cảnh; “ấy” làm rõ tính xác định của danh từ.
theological_decisions:
- issue: Hậu tố tân ngữ số ít mang nghĩa tập thể trong lời hứa đuổi cư dân khỏi xứ
  choice: Dùng đại từ số nhiều “chúng” trong câu chính và ghi chú hình thức số ít của nguyên văn.
  alternative: Dịch sát hình thức là “nó” hoặc “người ấy”.
  rationale: Tiếng Hê-bơ-rơ dùng hậu tố giống đực số ít để quy chiếu tập thể đến cư dân hoặc các dân trong xứ. Dùng “chúng” truyền đạt đúng sở chỉ trong tiếng Việt, còn chú thích bảo tồn thông tin ngữ pháp và sự mơ hồ của nguyên văn.
- issue: Sắc thái của נחל
  choice: Dịch “chiếm hữu” và ghi nhận khả năng “nhận ... làm cơ nghiệp”.
  alternative: “nhận miền đất ấy làm cơ nghiệp”
  rationale: Ngữ cảnh nhấn mạnh việc dân Israel tăng lên rồi sở hữu và cư ngụ trong đất; tuy nhiên, động từ cũng thường mang sắc thái nhận phần cơ nghiệp, nên cần bảo tồn phương án ấy trong chú thích.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu. Dùng “Ta–con” để thể hiện lời Đức Chúa Trời phán với Israel ở ngôi số ít. Các dấu chú thích [a], [b] được đặt ngay sau những cụm từ liên quan.
