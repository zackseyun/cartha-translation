lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: để nghĩ ra những kiểu mẫu
  rationale: Động từ và danh từ cùng gốc nhấn mạnh hoạt động suy tính, sáng tạo trong nghề thủ công. Tiếng Việt khó giữ nguyên phép lặp cùng gốc mà vẫn tự nhiên; “nghĩ ra những kiểu mẫu” diễn đạt cả sự hoạch định lẫn nội dung nghệ thuật.
- source_word: לַ/עֲשֹׂת
  choice: chế tác
  rationale: Trong ngữ cảnh tay nghề kim loại, עשה không chỉ là “làm” nói chung mà là thực hiện sản phẩm bằng kỹ năng; “chế tác” tự nhiên và chính xác.
- source_word: בַּ/זָּהָב וּ/בַ/כֶּסֶף
  choice: bằng vàng, bạc
  rationale: Giới từ ב chỉ vật liệu được dùng; tiếng Việt diễn đạt tự nhiên bằng “bằng”, không cần lặp lại trước từng vật liệu.
- source_word: וּ/בַ/נְּחֹשֶׁת
  choice: và đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng hoặc đồng thiếc tùy bối cảnh và niên đại. “Đồng” là cách gọi rộng, tự nhiên trong tiếng Việt và giữ được phần nào sự bất định về hợp kim.
