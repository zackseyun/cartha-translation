translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt. Chủ ngữ “Ngài” được phục hồi từ ngữ cảnh vì câu Hê-bơ-rơ tiếp nối chủ thể Đức Chúa Trời ở câu trước.
