  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: vi
  text: 'Ngài cũng đặt trong lòng họ khả năng dạy dỗ: cả Bết-sa-lê lẫn Ô-hô-li-áp, con trai A-hi-sa-mác, thuộc bộ tộc Đan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khả năng chỉ dẫn.” Động từ nguyên mẫu tiếng Hê-bơ-rơ có thể chỉ việc dạy theo nghĩa rộng, bao gồm hướng dẫn trong công việc đòi hỏi kỹ năng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: khả năng dạy dỗ
  rationale: Động từ Hiphil của ירה có nghĩa là “dạy” hoặc “chỉ dẫn”; trong kết cấu với נָתַן בְּלִבּוֹ, cách dịch này diễn đạt tự nhiên sự ban cho năng lực truyền dạy, kể cả hướng dẫn công việc khéo léo.
- source_word: נָתַן בְּלִבּוֹ
  choice: ban vào lòng
  rationale: Giữ hình ảnh “lòng” của tiếng Hê-bơ-rơ như trung tâm của ý hướng và năng lực, đồng thời dùng “ban” để thể hiện rõ sự trang bị từ Đức Chúa Trời trong ngữ cảnh.
- source_word: הוּא וְאָהֳלִיאָב
  choice: Bết-sa-lê và Ô-hô-li-áp
  rationale: Đại từ הוּא quy chiếu về Bết-sa-lê ở câu trước. Nêu lại tên giúp câu tiếng Việt rõ nghĩa và tự nhiên mà không làm thay đổi đối tượng.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: con trai A-hi-sa-mác
  rationale: Cách diễn đạt trực tiếp, tự nhiên cho quan hệ phụ tử.
- source_word: לְמַטֵּה דָן
  choice: thuộc bộ tộc Đan
  rationale: Giới từ לְ ở đây biểu thị sự thuộc về bộ tộc; “thuộc bộ tộc Đan” rõ và tự nhiên trong tiếng Việt hiện đại.
