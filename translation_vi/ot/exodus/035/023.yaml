  text: וְ/כָל אִ֞ישׁ אֲשֶׁר נִמְצָ֣א אִתּ֗/וֹ תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ וְ/עִזִּ֑ים וְ/עֹרֹ֨ת אֵילִ֧ם מְאָדָּמִ֛ים וְ/עֹרֹ֥ת תְּחָשִׁ֖ים הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: vi
  text: Mỗi người đàn ông có sẵn chỉ xanh lam, chỉ tím, chỉ đỏ thắm, vải lanh mịn, lông dê, da chiên đực nhuộm đỏ và da ta-khát[a] đều đem các thứ ấy đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là ta-khát. Không rõ từ này chỉ loài vật hay loại vật liệu nào; một số cách dịch được đề xuất là “da thuộc hảo hạng”, “da cá heo” hoặc “da bò biển”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: Mỗi người
  rationale: Trong ngữ cảnh toàn thể hội chúng cùng dâng vật liệu (c. 22, 29), אִישׁ với כָל mang nghĩa phân phối; “mỗi người” tự nhiên trong tiếng Việt và không khẳng định quá mức rằng chỉ nam giới tham gia.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: có sẵn
  rationale: Cụm Nifal nghĩa đen là “được tìm thấy ở nơi người ấy”; “có sẵn” diễn đạt tự nhiên ý vật liệu đang thuộc quyền sở hữu của họ mà không làm câu nặng nề.
- source_word: תְּכֵלֶת
  choice: chỉ xanh lam
  rationale: Trong danh mục vật liệu Đền Tạm, từ này chỉ vật liệu dệt nhuộm xanh; “chỉ xanh lam” cụ thể và phù hợp với các màu kế tiếp.
- source_word: אַרְגָּמָן
  choice: chỉ tím
  rationale: Chỉ vật liệu dệt nhuộm tím; cách dịch giữ danh mục nhất quán và dễ hiểu.
- source_word: תוֹלַעַת שָׁנִי
  choice: chỉ đỏ thắm
  rationale: Cụm từ chỉ vật liệu dệt màu đỏ thắm/đỏ son; “đỏ thắm” là cách gọi màu tự nhiên, trang trọng trong tiếng Việt.
- source_word: שֵׁשׁ
  choice: vải gai mịn
  rationale: Trong văn liệu tư tế, שֵׁשׁ là loại vải lanh/gai cao cấp; “vải gai mịn” truyền đạt cả chất liệu dệt và phẩm chất.
- source_word: עִזִּים
  choice: lông dê
  rationale: Dù nghĩa đen là “dê”, ngữ cảnh vật liệu làm các tấm phủ cho thấy đây là lông dê, không phải dê sống.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: da chiên đực nhuộm đỏ
  rationale: Giữ rõ loài vật và ý của phân từ chỉ da đã được nhuộm hoặc xử lý thành màu đỏ.
- source_word: עֹרֹת תְּחָשִׁים
  choice: da ta-khát
  rationale: Danh tính loài vật hoặc loại vật liệu תְּחָשׁ không chắc chắn; phiên âm tránh chọn một cách nhận diện mang tính suy đoán.
- source_word: הֵבִיאוּ
  choice: đều đem đến
  rationale: Động từ số nhiều tổng kết hành động của những người sở hữu các vật liệu; “đều” làm rõ quan hệ phân phối với “mỗi người” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ cấu trúc liệt kê của tiếng Hê-bơ-rơ nhưng dùng “có sẵn ... đều đem đến” cho tự nhiên trong tiếng Việt. Dấu chân chú [a] được đặt ngay sau thuật ngữ chưa xác định.
