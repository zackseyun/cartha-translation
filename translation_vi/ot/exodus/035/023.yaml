revisions:
- from: Mỗi người có sẵn chỉ xanh lam, chỉ tím, chỉ đỏ thắm, vải gai mịn, lông dê, da chiên đực nhuộm đỏ và da ta-khát[a] đều đem đến.
  to: Mỗi người đàn ông có sẵn chỉ xanh lam, chỉ tím, chỉ đỏ thắm, vải lanh mịn, lông dê, da chiên đực nhuộm đỏ và da ta-khát[a] đều đem các thứ ấy đến.
  rationale: Bản sửa thay “mỗi người” bằng “mỗi người đàn ông” để phản ánh אִישׁ, thay “vải gai mịn” bằng “vải lanh mịn” cho đúng chất liệu שֵׁשׁ, và thêm “các thứ ấy” để câu tiếng Việt hoàn chỉnh, rõ nghĩa. Thuật ngữ bất định ta-khát và chú thích được giữ nguyên để không áp đặt một nhận diện suy đoán.
