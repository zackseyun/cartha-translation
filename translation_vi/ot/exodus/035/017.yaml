lexical_decisions:
- source_word: קַלְעֵי
  choice: các tấm màn
  rationale: Chỉ các tấm vải tạo thành hàng rào bao quanh sân; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn phân biệt được với bức màn chuyên dùng ở lối vào.
- source_word: הֶחָצֵר / חָצֵר
  choice: sân
  rationale: Chỉ khu vực ngoài có rào bao quanh Đền Tạm; “sân” ngắn gọn, rõ nghĩa và phù hợp ngữ cảnh kiến trúc thánh.
- source_word: עַמֻּדָיו
  choice: các trụ của sân
  rationale: Chỉ các bộ phận thẳng đứng nâng đỡ hàng màn bao quanh; “trụ” tự nhiên và chính xác hơn “cột” trong kết cấu này. Danh từ sở hữu được diễn đạt lại bằng “của sân” để tránh đại từ tiếng Việt mơ hồ.
- source_word: אֲדָנֶיהָ
  choice: đế trụ của sân
  rationale: Chỉ các bộ phận ở chân dùng để giữ hoặc đỡ trụ; “đế trụ” vừa rõ công dụng vừa dễ hiểu hơn thuật ngữ kỹ thuật “ổ trụ”.
- source_word: מָסַךְ
  choice: bức màn che
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ tấm vải che tại lối vào; “bức màn che” giữ chức năng của vật này và phân biệt với các tấm màn bao quanh sân.
- source_word: שַׁעַר
  choice: cổng
  rationale: Chỉ chỗ ra vào của sân; “cổng” là tương đương trực tiếp và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nguyên tính chất liệt kê của văn cảnh; dấu gạch ngang cuối câu cho thấy danh sách còn tiếp diễn. Các sở hữu hậu tố trong tiếng Hê-bơ-rơ được diễn đạt rõ là “của sân” để tránh sự mơ hồ của “của nó” trong tiếng Việt.
