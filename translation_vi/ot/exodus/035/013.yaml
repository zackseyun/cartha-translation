  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: vi
  text: bàn, các đòn khiêng của nó, mọi dụng cụ của nó, và bánh của Sự Hiện Diện[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo cách gọi truyền thống: “bánh trưng bày”.'
