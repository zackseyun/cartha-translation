lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: cái bàn
  rationale: Danh từ chỉ chiếc bàn dùng trong nơi thánh; chức năng của bàn được làm rõ qua cụm từ “bánh Hiện Diện” ở cuối câu, nên không cần thêm ý vào chính danh từ.
- source_word: בַּדָּיו
  choice: các đòn khiêng bàn
  rationale: Trong bối cảnh Đền Tạm, בַּדִּים là các đòn dùng để khiêng đồ thánh. Lặp lại “bàn” thay cho đại từ sở hữu giúp câu tiếng Việt tự nhiên và tránh khả năng hiểu nhầm.
- source_word: כָּל כֵּלָיו
  choice: mọi dụng cụ của bàn
  rationale: כְּלִי là từ rộng, có thể chỉ dụng cụ, đồ dùng hay vật chứa. “Dụng cụ” phù hợp với các vật phục vụ chiếc bàn mà không thu hẹp quá mức.
- source_word: לֶחֶם הַפָּנִים
  choice: bánh Hiện Diện
  rationale: Cụm từ theo nghĩa sát là “bánh của khuôn mặt/sự hiện diện”. “Bánh Hiện Diện” giữ được cách diễn đạt nghi lễ và mối liên hệ với sự hiện diện trước Đức Chúa Trời mà không diễn giải quá mức.
theological_decisions:
- issue: Ý nghĩa của לֶחֶם הַפָּנִים
  choice: bánh Hiện Diện
  alternative: bánh trưng bày; bánh đặt trước mặt Đức Giê-hô-va
  rationale: Bản dịch chính giữ tính cô đọng và độ mở của thành ngữ Hê-bơ-rơ, thay vì bổ sung trực tiếp danh Đức Chúa Trời hoặc chỉ nhấn mạnh hành động trưng bày.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đòn khiêng” thay cho từ cổ; viết hoa “Hiện Diện” để cho thấy đây là tên gọi nghi lễ. Dấu chấm phẩy phản ánh đây là một mục trong danh sách của câu rộng hơn.
