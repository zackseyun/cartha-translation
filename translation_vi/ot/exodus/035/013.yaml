  source_fidelity: 'Bản thảo truyền đạt đủ bốn hạng mục của tiếng Hê-bơ-rơ: bàn, các đòn, mọi dụng cụ, và לֶחֶם הַפָּנִים. Tuy nhiên, “các đòn khiêng bàn” không biểu đạt rõ hậu tố sở hữu “của nó” trong בַּדָּיו và hơi gượng trong tiếng Việt.'
