  naturalness: “Đền Tạm, lều và tấm phủ của nó” tự nhiên, rõ nghĩa và gọn hơn “lều và tấm phủ của Đền Tạm”. “Móc cài”, “tấm ván”, “thanh ngang”, “trụ”, và “đế” đều phù hợp với văn phong kiến trúc trang trọng, hiện đại.
