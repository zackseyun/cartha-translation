    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Trong ngữ cảnh nơi thánh, מִשְׁכָּן chỉ nơi ngự thánh của Đức Chúa Trời giữa dân Israel. “Đền Tạm” là cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: אָהֳלוֹ
  choice: lều của Đền Tạm
  rationale: אָהֶל nghĩa là “lều”; hậu tố ngôi ba số ít quy chiếu về Đền Tạm. Lặp lại “của Đền Tạm” giúp tiếng Việt rõ nghĩa và vẫn giữ sự phân biệt giữa Đền Tạm với phần lều của công trình.
- source_word: מִכְסֵהוּ
  choice: tấm phủ của Đền Tạm
  rationale: מִכְסֶה là vật hoặc lớp dùng để che phủ. “Tấm phủ” tự nhiên trong tiếng Việt và không xác định thêm vật liệu mà nguyên văn không nêu tại đây.
- source_word: קְרָסָיו
  choice: các móc cài
  rationale: קֶרֶס chỉ những bộ phận nối dùng để liên kết các tấm màn hoặc lớp phủ. “Móc cài” diễn đạt chức năng mà không dùng thuật ngữ kỹ thuật quá chuyên biệt.
- source_word: קְרָשָׁיו
  choice: các tấm ván
  rationale: קֶרֶשׁ thường chỉ ván trong phần mô tả việc dựng Đền Tạm. “Tấm ván” là cách dịch trực tiếp và dễ hình dung, còn khả năng hiểu là “khung” được giữ trong chú thích.
- source_word: בְּרִיחָיו
  choice: các thanh ngang
  rationale: בְּרִיחַ chỉ các thanh dùng để liên kết và giữ các tấm ván. “Thanh ngang” rõ chức năng và tự nhiên hơn “thanh” đứng riêng trong ngữ cảnh xây dựng.
- source_word: עַמֻּדָיו
  choice: các trụ
  rationale: עַמּוּד là bộ phận chống đỡ dựng đứng. “Trụ” vừa chính xác vừa phù hợp với văn phong kiến trúc trang trọng.
- source_word: אֲדָנָיו
  choice: các đế
  rationale: אֶדֶן chỉ phần đế hoặc ổ đỡ để đặt bộ phận kết cấu vào. “Đế” rõ ràng trong tiếng Việt hiện đại; nghĩa cụ thể hơn “ổ đỡ” được nêu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Các hậu tố sở hữu tiếng Hê-bơ-rơ được diễn đạt bằng cách lặp “của Đền Tạm” ở những vị trí cần thiết để tránh chuỗi đại từ sở hữu nặng nề trong tiếng Việt. Giữ cấu trúc liệt kê của nguyên văn và dấu chấm phẩy vì câu tiếp nối các mục phải làm trong phân đoạn.
