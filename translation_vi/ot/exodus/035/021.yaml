  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: vi
  text: Tất cả những ai được lòng mình thôi thúc, và tất cả những ai được tâm thần mình khiến cho sẵn lòng, đều đến và đem lễ vật dâng cho Yahweh, để dùng vào công việc của Lều Hội Kiến, mọi công việc phục vụ của lều ấy, và các y phục thánh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ כָּל אִישׁ
  choice: Mọi người ... đều đến
  rationale: Giữ nghĩa phân phối của כָּל אִישׁ và nghĩa kể chuyện trực tiếp của בוא, đồng thời dùng cách nói tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: có lòng thôi thúc mình
  rationale: Diễn đạt thành ngữ theo nghĩa sự thúc đẩy từ nội tâm; đại từ phản thân giữ cấu trúc trong đó lòng của mỗi người tác động chính người ấy.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: mọi người có tâm thần khiến mình tự nguyện
  rationale: 'Giữ riêng hai ý gần nhau nhưng không đồng nhất: sự thôi thúc của lòng và sự tự nguyện do tâm thần; נדב nhấn mạnh lòng sẵn sàng, tự nguyện.'
- source_word: הֵבִיאוּ
  choice: đều đem
  rationale: Phản ánh hành động cụ thể mang vật dâng đến, nối tự nhiên với chủ ngữ số nhiều.
- source_word: תְּרוּמַת יְהוָה
  choice: lễ vật dâng cho Yahweh
  rationale: Trong ngữ cảnh quyên góp vật liệu, תְּרוּמָה là lễ vật hay phần đóng góp được biệt riêng. Cách dịch hướng đến Yahweh diễn đạt tự nhiên quan hệ sở thuộc/định hướng vốn có thể hiểu hơn một cách trong tiếng Hê-bơ-rơ.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: để dùng vào việc làm Lều Hội Kiến
  rationale: מְלָאכָה chỉ công việc chế tác/xây dựng; cụm 'để dùng vào' làm rõ mục đích của lễ vật mà không thu hẹp thành chỉ việc xây cất.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: mọi công việc phục vụ tại đó
  rationale: עֲבֹדָה trong ngữ cảnh đền tạm có thể chỉ việc phục vụ hay công tác liên quan; 'tại đó' làm rõ đại từ hậu tố chỉ Lều Hội Kiến.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: và các lễ phục thánh
  rationale: Chỉ các y phục được biệt riêng cho chức vụ tư tế; 'lễ phục thánh' trang trọng, dễ hiểu và phù hợp ngữ cảnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Giữ danh riêng của Đức Chúa Trời xuất hiện trực tiếp trong văn bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- issue: Quan hệ trong cụm תְּרוּמַת יְהוָה
  choice: lễ vật dâng cho Yahweh
  alternative: lễ vật của Yahweh
  rationale: Cấu trúc sở thuộc có thể biểu thị lễ vật thuộc về hoặc được dành dâng cho Yahweh. Trong tiếng Việt, cách chọn nêu rõ đích dâng và phù hợp ngữ cảnh, nhưng không hàm ý Yahweh là người đóng góp.
- issue: Hai sự thúc đẩy nội tâm
  choice: giữ cả 'lòng thôi thúc' và 'tâm thần khiến ... tự nguyện'
  alternative: gộp thành một ý về lòng tự nguyện
  rationale: Nguyên văn đặt song song לֵב và רוּחַ cùng hai động từ khác nhau; giữ cả hai bảo toàn sắc thái và không xác định nguồn thúc đẩy là tác động thần linh trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng 'Lều Hội Kiến' như tên gọi ổn định; 'tâm thần' được dùng cho רוּחַ để tránh đồng nhất từ này với Chúa Thánh Linh trong một câu không nói rõ như vậy. Dấu chấm phẩy giúp phân biệt hành động đến với hành động đem lễ vật.
