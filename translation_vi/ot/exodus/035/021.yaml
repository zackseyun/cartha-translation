    text: 'Dịch sát: “lòng người ấy nâng người ấy lên.” Đây là thành ngữ chỉ sự thôi thúc từ bên trong.'
    reason: lexical_alternative
  revision_rationale: Sửa cú pháp để hai mệnh đề về lòng và tâm thần cùng mô tả những người thực hiện cả hai hành động “đến và đem.” Điều chỉnh các thành ngữ nội tâm cho tiếng Việt rõ và tự nhiên hơn, nhưng vẫn giữ sự phân biệt giữa “lòng” và “tâm thần,” cũng như sắc thái sẵn lòng/tự nguyện. Thay “lễ phục thánh” bằng “y phục thánh” để sát nghĩa từ vựng hơn.
