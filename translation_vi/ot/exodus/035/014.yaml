  source_fidelity: Bản dịch phản ánh đúng bốn hạng mục được liệt kê và diễn đạt tự nhiên chức năng của מָאוֹר là “chiếu sáng/thắp sáng”. Tuy nhiên, hai hậu tố sở hữu số ít giống cái trong כֵּלֶיהָ và נֵרֹתֶיהָ đều quy về chân đèn. Bản nháp làm rõ hậu tố thứ nhất nhưng để mục “các ngọn đèn” không nêu quan hệ sở hữu; có thể giữ quan hệ này rõ ràng mà vẫn tự nhiên.
  naturalness: “Chân đèn dùng để chiếu sáng” và “dầu dùng để thắp sáng” là tiếng Việt hiện đại, rõ nghĩa và phù hợp văn phong liệt kê. “Các ngọn đèn của nó” tự nhiên trong văn cảnh, đồng thời tránh khả năng “ngọn đèn” bị hiểu chỉ ngọn lửa tách khỏi các đèn thuộc chân đèn.
  terminology: “Chân đèn”, “dụng cụ”, “đèn” và “dầu” phù hợp bối cảnh Đền Tạm, không thêm chi tiết nghi lễ hoặc diễn giải giáo phái. Chú thích nên dùng “sự chiếu sáng” thay vì “sự sáng”, vì cách sau kém tự nhiên trong tiếng Việt hiện đại và không cần áp đặt một nghĩa trừu tượng cho מָאוֹר.
