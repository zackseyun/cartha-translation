translation:
  language: vi
  text: cùng chân đèn dùng để chiếu sáng[a], các dụng cụ của nó, các ngọn đèn của nó, và dầu dùng để thắp sáng;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát: “chân đèn của sự chiếu sáng” và “dầu của sự chiếu sáng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: chân đèn để chiếu sáng
  rationale: מְנוֹרָה chỉ chân đèn trong Đền Tạm; cụm sở thuộc הַמָּאוֹר theo sát là “của sự sáng/việc chiếu sáng.” Cách dịch “để chiếu sáng” tự nhiên trong tiếng Việt, đồng thời giữ quan hệ mục đích của vật dụng này.
- source_word: כֵּלֶיהָ
  choice: các dụng cụ của chân đèn
  rationale: כְּלִי là từ rộng, có thể chỉ dụng cụ, vật dụng hoặc đồ dùng. Nói rõ “của chân đèn” thay cho đại từ giúp câu tiếng Việt rõ nghĩa mà không thu hẹp loại vật dụng.
- source_word: נֵרֹתֶיהָ
  choice: các ngọn đèn
  rationale: נֵר thường chỉ đèn hoặc ngọn đèn. Trong ngữ cảnh chân đèn, “các ngọn đèn” là cách diễn đạt tự nhiên, chỉ những đèn riêng lẻ gắn với chân đèn.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: dầu để thắp sáng
  rationale: Cụm này theo sát là “dầu của sự sáng/việc chiếu sáng.” “Dầu để thắp sáng” tự nhiên và nêu đúng công dụng, đồng thời phản ánh sự lặp lại của מָאוֹר bằng một diễn đạt gần nghĩa với “để chiếu sáng.”
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: cùng ... các ... các ... và ...
  rationale: Tiếng Hê-bơ-rơ lặp liên từ và dấu hiệu chỉ tân ngữ để tạo nhịp liệt kê. Tiếng Việt không cần lặp “và” ở mọi mục; “cùng” và “và” vẫn giữ rõ cấu trúc danh sách mà câu tự nhiên hơn.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại, dễ hiểu; giữ dạng câu liệt kê nối tiếp văn cảnh. Dùng “chân đèn” theo cách gọi quen thuộc trong ngữ cảnh Đền Tạm, tránh thuật ngữ chuyên biệt hoặc cách diễn giải mang màu sắc hệ phái.
