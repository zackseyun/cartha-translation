base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/020.yaml
  text: Then all the congregation of the sons of Israel went out from before Moses[a][b].
translation:
  language: vi
  text: Bấy giờ, toàn thể hội chúng[a] con cái Y-sơ-ra-ên[b] ra đi khỏi trước mặt Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “toàn thể cộng đồng” thay cho “toàn thể hội chúng.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Y-sơ-ra-ên”; trong ngữ cảnh, cụm từ này chỉ dân Y-sơ-ra-ên nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Bấy giờ ... rời khỏi
  rationale: Động từ wayyiqtol của יצא tiếp nối diễn tiến câu chuyện. “Rời khỏi” diễn đạt tự nhiên hành động đi ra khỏi nơi Môi-se đang hiện diện; “Bấy giờ” thể hiện lực nối tiếp của mạch thuật sự.
- source_word: כָּל
  choice: toàn thể
  rationale: כָּל bổ nghĩa cho chuỗi danh từ theo sau, nhấn mạnh trọn cộng đồng; “toàn thể” tự nhiên hơn “tất cả hội chúng” trong tiếng Việt.
- source_word: עֲדַת
  choice: hội chúng
  rationale: עֵדָה chỉ cộng đồng Y-sơ-ra-ên được quy tụ. “Hội chúng” giữ sắc thái tập thể; “cộng đồng” cũng là một khả năng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “các con trai của Y-sơ-ra-ên,” nhưng trong ngữ cảnh chỉ toàn dân. “Con cái Y-sơ-ra-ên” vừa giữ hình ảnh huyết thống của nguyên ngữ vừa bao quát cộng đồng.
- source_word: מִלִּפְנֵי
  choice: khỏi trước mặt
  rationale: Thành ngữ có nghĩa đen là rời khỏi phía trước mặt, tức rời khỏi sự hiện diện của một người. Cách dịch này giữ hình ảnh không gian của tiếng Hê-bơ-rơ mà vẫn hiểu được trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thuật ngữ cộng đồng “hội chúng” và phần nào bảo tồn thành ngữ không gian “khỏi trước mặt,” đồng thời dùng “con cái Y-sơ-ra-ên” để phản ánh nguyên ngữ mà không khiến độc giả hiểu rằng chỉ có nam giới.
