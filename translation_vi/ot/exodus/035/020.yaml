  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính: trình tự tự sự của וַיֵּצְאוּ, tính toàn thể của כָּל, cộng đồng Y-sơ-ra-ên và quan hệ không gian/hàm ý rời sự hiện diện của Môi-se. Tuy nhiên, “rời khỏi trước mặt” không tự nhiên trong tiếng Việt và làm mờ động tác ‘đi ra/ra đi’ của יצא.'
  naturalness: Cụm “toàn thể hội chúng con cái Y-sơ-ra-ên” phù hợp văn phong Kinh Thánh trang trọng, dù đậm tính cấu trúc nguyên ngữ. Cần đổi “rời khỏi trước mặt Môi-se” thành “ra đi khỏi trước mặt Môi-se” để câu tiếng Việt rõ và tự nhiên hơn mà vẫn giữ hình ảnh không gian của nguyên ngữ.
  terminology: “Hội chúng,” “con cái Y-sơ-ra-ên,” và “Môi-se” nhất quán với cách dùng Kinh Thánh tiếng Việt. Chú thích về nghĩa đen “các con trai” hữu ích, không áp đặt một diễn giải giáo phái.
