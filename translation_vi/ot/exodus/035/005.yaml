  text: קְח֨וּ מֵֽ/אִתְּ/כֶ֤ם תְּרוּמָה֙ לַֽ/יהוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔/וֹ יְבִיאֶ֕/הָ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: vi
  text: 'Hãy lấy từ giữa anh em một lễ vật dâng cho Yahweh[a]. Mỗi người có lòng tự nguyện[b] hãy đem đến lễ vật dâng cho Yahweh: vàng, bạc và đồng[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là tên riêng của Đức Chúa Trời trong tiếng Hê-bơ-rơ, được viết bằng bốn phụ âm YHWH; nhiều bản dịch dùng “ĐỨC CHÚA”.
    reason: divine_name
  - marker: b
    text: 'Nguyên văn sát nghĩa: “mỗi người có lòng sẵn lòng”, chỉ một thái độ tự nguyện từ bên trong.'
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ này có thể chỉ đồng hoặc một hợp kim đồng; trong các danh sách vật liệu cổ, từ này thường được dịch là “đồng thiếc”.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: קְחוּ
  choice: Hãy lấy
  rationale: Động từ Qal mệnh lệnh số nhiều của לקח trực tiếp truyền lệnh cho cộng đồng; “hãy lấy” bám sát nghĩa và phù hợp với cụm chỉ nguồn theo sau.
- source_word: מֵאִתְּכֶם
  choice: từ giữa anh em
  rationale: Giữ được ý lễ vật được lấy từ trong cộng đồng, thay vì chỉ diễn đạt chung chung là “từ anh em”.
- source_word: תְּרוּמָה
  choice: lễ vật
  rationale: Trong bối cảnh đóng góp vật liệu cho Đền Tạm, từ này chỉ phần đóng góp được biệt riêng cho mục đích thánh. “Lễ vật” tự nhiên, trang trọng và không áp đặt nghĩa kỹ thuật “lễ vật đưa qua đưa lại”.
- source_word: לַיהוָה / יְהוָה
  choice: dâng cho Yahweh
  rationale: Giữ tên giao ước được viết trực tiếp bằng Tứ Tự; giới từ ל biểu thị lễ vật được dành dâng cho Yahweh.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: Mỗi người có lòng tự nguyện
  rationale: Giữ hình ảnh “lòng” và diễn đạt tự nhiên trạng thái sẵn lòng từ bên trong; “mỗi người” mang nghĩa bao quát, không thêm giới tính mà nguyên văn không đòi hỏi.
- source_word: יְבִיאֶהָ
  choice: hãy đem lễ vật ấy đến
  rationale: Động từ Hiphil với đại từ giống cái số ít quy chiếu về תְּרוּמָה. Cách diễn đạt này nêu hành động được mong đợi nhưng không biến sự dâng hiến tự nguyện thành ép buộc.
- source_word: אֵת תְּרוּמַת יְהוָה
  choice: tức là lễ vật dâng cho Yahweh
  rationale: Cụm này nhắc lại và xác định rõ lễ vật; “tức là” làm sáng tỏ quan hệ đồng vị trong tiếng Việt.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: vàng, bạc và đồng
  rationale: “Vàng, bạc và đồng” là danh sách vật liệu tự nhiên trong tiếng Việt. נְחֹשֶׁת có thể chỉ đồng hoặc hợp kim đồng, thường được hiểu là đồng thiếc trong bối cảnh chế tác cổ.
theological_decisions:
- issue: Cách chuyển tên riêng יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tứ Tự יהוה. “Yahweh” bảo toàn chức năng tên riêng và tránh thay tên ấy bằng một tước hiệu, đồng thời chú thích giải thích truyền thống dịch khác.
- issue: Tính tự nguyện của việc dâng hiến
  choice: có lòng tự nguyện
  alternative: có lòng rộng rãi; được lòng thúc giục
  rationale: נדיב לבו nói đến khuynh hướng tự nguyện ở nội tâm. Bản dịch giữ ngôn ngữ về “lòng” mà không thêm động lực hoặc mức độ rộng rãi không được câu này xác định.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” ở số nhiều để phản ánh lời Môi-se nói với cộng đồng; dùng “mỗi người” để giữ tính bao quát. Cấu trúc được điều chỉnh nhẹ cho tự nhiên nhưng vẫn giữ sự lặp lại “lễ vật dâng cho Yahweh” của nguyên văn.
