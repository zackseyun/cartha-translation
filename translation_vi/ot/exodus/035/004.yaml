base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: vi
  text: 'Rồi Môi-se nói với toàn thể cộng đồng[a] con cái Y-sơ-ra-ên[b]: “Đây là điều Yahweh đã truyền:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hội chúng” hoặc “cộng đồng được tập hợp.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát hình thức Hê-bơ-rơ: “các con trai Y-sơ-ra-ên”; thành ngữ này chỉ cộng đồng hậu duệ Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Môi-se nói
  rationale: Dạng kể chuyện với waw liên tiếp chuyển mạch tự nhiên sang hành động kế tiếp; tiếng Việt không cần thêm “rồi” trong ngữ cảnh này.
- source_word: עֲדַת
  choice: cộng đồng
  rationale: Chỉ toàn thể cộng đồng Y-sơ-ra-ên trong tư cách một tập thể; “hội chúng” cũng có thể dùng nhưng mang sắc thái tôn giáo chuyên biệt hơn trong tiếng Việt hiện đại.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ thành ngữ huyết thống và căn tính tập thể của nguyên văn; trong tiếng Việt, “con cái” có thể chỉ hậu duệ nói chung dù danh từ Hê-bơ-rơ có hình thức giống đực.
- source_word: זֶה הַדָּבָר
  choice: Đây là điều
  rationale: דָּבָר có thể là lời, việc hoặc điều; ở đây cụm này dẫn vào nội dung mệnh lệnh nên “điều” vừa tự nhiên vừa giữ được độ rộng nghĩa.
- source_word: צִוָּה
  choice: đã truyền phán
  rationale: Diễn tả mệnh lệnh đã được ban và sắp được thuật lại; “truyền phán” phù hợp văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng đã quen thuộc rộng rãi trong tiếng Việt, thay vì thay thế bằng tước hiệu “CHÚA”.
- source_word: לֵאמֹר
  choice: dấu hai chấm
  rationale: Từ này giới thiệu chính nội dung lời truyền ở câu kế tiếp; dấu hai chấm chuyển chức năng ấy sang tiếng Việt tự nhiên hơn việc dịch máy móc là “rằng” hoặc “phán rằng”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước. Bản dịch giữ danh riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng Việt hóa quen thuộc, trang trọng.
- issue: Phạm vi giới của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: các con trai Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Hình thức Hê-bơ-rơ là giống đực số nhiều nhưng thành ngữ này thường gọi cộng đồng hậu duệ Y-sơ-ra-ên. “Con cái” bảo tồn hình ảnh dòng dõi mà không tự ý giới hạn đối tượng chỉ còn nam giới.
- issue: Quan hệ giữa דָּבָר và mệnh lệnh theo sau
  choice: điều
  alternative: lời; việc; những gì
  rationale: “Điều” giữ được tính đa nghĩa của דָּבָר trong công thức giới thiệu mệnh lệnh, không xác định quá mức đó chỉ là lời nói hay một sự việc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “cộng đồng” cho עֵדָה, giữ cách gọi truyền thống “con cái Y-sơ-ra-ên,” và dùng dấu hai chấm để thể hiện chức năng dẫn lời của לֵאמֹר vì nội dung mệnh lệnh tiếp tục ở câu 5.
