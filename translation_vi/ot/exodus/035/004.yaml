  source_fidelity: 'Bản dịch chuyển đạt đúng cấu trúc chính của câu: Môi-se nói với toàn thể cộng đồng Y-sơ-ra-ên và giới thiệu mệnh lệnh sẽ được nêu ở câu sau. Dấu hai chấm diễn đạt thích hợp chức năng của לֵאמֹר khi lời truyền tiếp tục sang câu 5. Tuy nhiên, יהוה nên được nhất quán phiên âm là “Yahweh” theo hồ sơ POB tiếng Anh; “Giê-hô-va” tương ứng với dạng “Jehovah”, không phải lựa chọn đã được xác lập trong audit trail. “Truyền phán” có thể hiểu là lời phán nói chung, trong khi צִוָּה nhấn mạnh việc truyền lệnh; “đã truyền” sát hơn.'
