  terminology: Dùng “Yahweh” để giữ danh riêng יהוה phù hợp với quy ước dự án. Giữ “con cái Y-sơ-ra-ên” như một thành ngữ chỉ cộng đồng hậu duệ; chú thích nêu cách đọc sát hình thức giống đực mà không biến bản văn chính thành cách nói thiếu tự nhiên.
