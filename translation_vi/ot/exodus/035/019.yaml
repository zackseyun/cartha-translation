  source_fidelity: 'Bản dịch giữ đúng cấu trúc liệt kê của tiếng Hê-bơ-rơ: y phục dệt tinh xảo/dùng cho việc phục vụ trong nơi thánh; y phục thánh cho A-rôn, thầy tế lễ; và y phục cho các con trai ông để thi hành chức tế lễ. Cách hiểu הַשְּׂרָד là hàng/y phục dệt được chế tác đặc biệt là một khả năng có cơ sở và đã được chú thích bằng phương án thay thế thích hợp. “Nơi thánh” chuyển tải בַּקֹּדֶשׁ mà không áp đặt một cách hiểu quá hẹp về một gian cụ thể.'
