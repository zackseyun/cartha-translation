base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: vi
  text: các bộ y phục dệt tinh xảo[a] để phục vụ trong nơi thánh[b], các bộ y phục thánh dành cho thầy tế lễ A-rôn, và các bộ y phục dành cho các con trai ông để họ thi hành chức tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các y phục dùng khi phục vụ”; từ Hê-bơ-rơ này có thể chỉ những y phục phục vụ được dệt đặc biệt.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “trong thánh sở.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: các bộ y phục
  rationale: Danh từ chỉ quần áo, y phục; “y phục” trang trọng vừa phải và thích hợp với bối cảnh thờ phượng mà không đưa vào thuật ngữ giáo hội về sau.
- source_word: הַשְּׂרָד
  choice: dệt tinh xảo
  rationale: Từ hiếm này trong bối cảnh Đền Tạm có thể chỉ loại hàng dệt được chế tác đặc biệt; bản dịch chính diễn đạt nghĩa khả dĩ này, còn chú thích giữ lại cách hiểu “dùng khi phục vụ”.
- source_word: לְשָׁרֵת
  choice: để phục vụ
  rationale: Giữ ý chỉ sự phục vụ mang tính thánh lễ trong ngữ cảnh mà vẫn dùng cách nói tự nhiên, dễ hiểu.
- source_word: בַּקֹּדֶשׁ
  choice: trong nơi thánh
  rationale: Trong bối cảnh này, קֹדֶשׁ chỉ khu vực thánh chứ không phải khái niệm trừu tượng về sự thánh khiết; “nơi thánh” cũng không xác định quá mức một gian cụ thể.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: các bộ y phục thánh
  rationale: Phản ánh trực tiếp cấu trúc “y phục của sự thánh” và chỉ y phục biệt riêng cho công việc tế lễ.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: dành cho thầy tế lễ A-rôn
  rationale: Diễn đạt tự nhiên quan hệ sở dụng và chức vụ của A-rôn.
- source_word: בִּגְדֵי בָנָיו
  choice: các bộ y phục dành cho các con trai ông
  rationale: Giữ rõ đối tượng là các con trai của A-rôn và quan hệ song song với y phục dành cho A-rôn.
- source_word: לְכַהֵן
  choice: để họ thi hành chức tế lễ
  rationale: Động từ ở thể Piel có nghĩa thực hiện chức năng của thầy tế lễ; cách dịch này giữ lực động từ và rõ nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Quan hệ giữa בִּגְדֵי הַשְּׂרָד và בִּגְדֵי הַקֹּדֶשׁ
  choice: 'Trình bày như hai hạng mục song song: y phục dệt tinh xảo dùng để phục vụ trong nơi thánh, rồi y phục thánh dành cho A-rôn và các con trai ông.'
  alternative: Hiểu hai cụm là đồng vị, trong đó cụm đầu chỉ là một cách mô tả khác về cùng các y phục tế lễ.
  rationale: Việc lặp lại dấu hiệu tân ngữ אֶת ủng hộ cách đọc như các hạng mục được liệt kê riêng, dù chức năng thánh của chúng có thể chồng lấn; bản dịch không đồng nhất chúng khi văn bản không buộc phải làm vậy.
translation_notes:
  register: 'Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “y phục” thay vì thuật ngữ giáo hội chuyên biệt; “thi hành chức tế lễ” làm rõ chức năng của động từ כיהן. Tên riêng được viết theo lối phiên âm tiếng Việt quen thuộc: A-rôn.'
