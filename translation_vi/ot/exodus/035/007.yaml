  text: và da chiên đực nhuộm đỏ, da ta-khách[a], và gỗ keo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thuật ngữ Hê-bơ-rơ ta-khách (תְּחָשִׁים) chưa rõ nghĩa. Cụm này cũng được dịch là “da thuộc loại tốt”, “da dê”, “da cá heo”, hoặc “da bò biển”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: da chiên đực nhuộm đỏ
  rationale: Cụm từ chỉ da của các con chiên đực đã được làm thành màu đỏ; “nhuộm đỏ” diễn đạt tự nhiên cách xử lý vật liệu có khả năng được nói đến.
- source_word: עֹרֹת תְּחָשִׁים
  choice: da thú biển
  rationale: Danh từ תְּחַשׁ không xác định chắc chắn. “Da thú biển” giữ được khả năng đây là da của một loài động vật biển mà không xác quyết chính xác loài.
- source_word: עֲצֵי שִׂטִּים
  choice: gỗ keo
  rationale: Cụm từ chỉ gỗ của cây acacia; “gỗ keo” là cách gọi tiếng Việt ngắn gọn, dễ hiểu trong ngữ cảnh vật liệu.
