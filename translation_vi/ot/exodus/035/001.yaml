  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: vi
  text: 'Rồi Môi-se triệu tập toàn thể hội chúng con cái Israel[a] và nói với họ: “Đây là những điều[b] Yahweh đã truyền phải làm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Israel”; đây là danh xưng giao ước chỉ toàn thể cộng đồng Israel, không chỉ riêng nam giới.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những lời này” hoặc “những việc này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: triệu tập
  rationale: Dạng Hifil của קהל diễn tả việc Môi-se khiến dân chúng tụ họp thành một hội chúng. “Triệu tập” tự nhiên, trang trọng và nêu rõ vai trò chủ động của Môi-se.
- source_word: כָּל עֲדַת
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng Israel được quy tụ như một tập thể; “hội chúng” giữ sắc thái cộng đồng giao ước, còn “toàn thể” chuyển tải כָּל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Cụm từ Hê-bơ-rơ có nghĩa đen là “các con trai của Israel”, nhưng trong ngữ cảnh này là danh xưng tập thể chỉ toàn dân. “Con cái Israel” giữ hình ảnh huyết thống và tính giao ước mà không khiến độc giả hiểu rằng chỉ có nam giới.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: đây là những điều
  rationale: דְּבָרִים có thể chỉ lời nói, sự việc hoặc các vấn đề. “Những điều” tự nhiên trong tiếng Việt và đủ rộng để giữ độ linh hoạt của từ gốc trong ngữ cảnh các mệnh lệnh phải thực hiện.
- source_word: צִוָּה יְהוָה
  choice: Yahweh đã truyền
  rationale: Thể hoàn thành của צוה nói đến mệnh lệnh đã được ban và vẫn có hiệu lực. “Đã truyền” thể hiện rõ hành động trước đó mà không thêm cách giải thích thần học.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Đây là danh riêng giao ước YHWH trong bản Hê-bơ-rơ; chuyển tự “Yahweh” phân biệt danh này với tước hiệu “Chúa”.
- source_word: לַעֲשֹׂת אֹתָם
  choice: phải làm
  rationale: Động từ nguyên mẫu kèm đại từ tân ngữ nói đến việc thực hiện những điều đã truyền. Sau “đã truyền”, cấu trúc “phải làm” là tiếng Việt tự nhiên và giữ lực bắt buộc của câu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel, chỉ toàn thể cộng đồng
  alternative: các con trai của Israel; dân Israel
  rationale: Hình thức Hê-bơ-rơ là giống đực số nhiều, nhưng nó nằm trong cụm “toàn thể hội chúng” và có chức năng danh xưng dân tộc–giao ước. Bản dịch giữ hình ảnh gia tộc nhưng chú thích rằng đối tượng không chỉ gồm nam giới.
- issue: Quan hệ giữa mệnh lệnh và việc thực hiện trong לַעֲשֹׂת אֹתָם
  choice: đã truyền phải làm
  alternative: đã truyền để làm những điều ấy
  rationale: Cách dịch được chọn diễn đạt tự nhiên nghĩa vụ thực hiện, nhưng không xác định thêm ai là chủ thể ngoài cộng đồng đang được Môi-se nói với.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Triệu tập” và “hội chúng” giữ sắc thái chính thức của cuộc quy tụ; trật tự câu theo lối kể chuyện tự nhiên. Các dấu chú thích [a], [b] được đặt ngay sau cụm từ liên quan.
