lexical_decisions:
- source_word: שֶׁמֶן
  choice: dầu
  rationale: Danh từ chỉ dầu nói chung, trong bối cảnh này thường là dầu ô-liu; bản Hê-bơ-rơ không nêu rõ loại dầu nên không thêm mức độ cụ thể.
- source_word: לַמָּאוֹר
  choice: dùng để thắp sáng
  rationale: Cụm từ chỉ mục đích của dầu là tạo ánh sáng trong Đền Tạm; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בְשָׂמִים
  choice: các hương liệu
  rationale: Từ số nhiều chỉ các chất có mùi thơm dùng trong việc pha chế lễ nghi; “các hương liệu” vừa rộng nghĩa vừa phù hợp văn cảnh.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Đây là cụm từ lễ nghi quen thuộc chỉ loại dầu dùng để xức; “dầu xức” ngắn gọn, trang trọng và dễ hiểu.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: hương thơm để đốt
  rationale: Cụm từ theo sát nghĩa là “hương của các hương liệu”; cách dịch chính làm rõ đây là hương thơm được đốt trong nghi lễ mà không làm câu tiếng Việt nặng nề.
