  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: vi
  text: Ngài đã làm cho họ đầy dẫy sự khôn ngoan trong lòng[a] để thực hiện mọi loại công việc của nghệ nhân[b], người thiết kế, người thêu bằng chỉ xanh, chỉ tím, chỉ đỏ tươi và vải lanh mịn, cùng thợ dệt—tức là những người làm mọi loại công việc và nghĩ ra các mẫu thiết kế[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “sự khôn ngoan của lòng”, một cách nói Hê-bơ-rơ chỉ kỹ năng, sự hiểu biết và óc phán đoán từ bên trong.'
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “thợ chạm khắc”; từ Hê-bơ-rơ có thể chỉ một nghệ nhân lành nghề nói chung.
    reason: lexical_alternative
  - marker: c
    text: Cụm từ Hê-bơ-rơ lặp lại hai từ cùng gốc, với ý “những người định liệu các phương án/thiết kế”. Bản dịch diễn đạt tự nhiên là “nghĩ ra các mẫu thiết kế”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: đã ban cho họ đầy
  rationale: Giữ hình ảnh động từ Piel מלא là “làm cho đầy”, đồng thời diễn đạt tự nhiên trong tiếng Việt về năng lực Đức Chúa Trời ban cho họ.
- source_word: חָכְמַת לֵב
  choice: sự khôn ngoan trong lòng
  rationale: Bảo tồn thành ngữ Hê-bơ-rơ, trong đó “lòng” là trung tâm của sự hiểu biết, óc phán đoán và kỹ năng; chú thích làm rõ sắc thái nghề nghiệp.
- source_word: כָּל מְלֶאכֶת
  choice: mọi công việc
  rationale: Phản ánh tính bao quát của כָּל và nghĩa công việc, nghề nghiệp có kỹ năng của מְלָאכָה.
- source_word: חָרָשׁ
  choice: thợ thủ công
  rationale: Danh từ có thể chỉ nhiều loại nghệ nhân lành nghề. Ngữ cảnh này không xác định chắc một chuyên môn duy nhất, nên cách dịch rộng phù hợp hơn “thợ chạm khắc”.
- source_word: חֹשֵׁב
  choice: thợ thiết kế
  rationale: Trong ngữ cảnh chế tác Đền Tạm, từ này chỉ người nghĩ ra và thực hiện các hoa văn hoặc mẫu nghệ thuật.
- source_word: רֹקֵם
  choice: thợ thêu
  rationale: Cách gọi tự nhiên, chính xác cho người làm công việc thêu trang trí trên hàng dệt.
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי
  choice: chỉ xanh, chỉ tím, chỉ đỏ tươi
  rationale: Làm rõ đây là các vật liệu dệt nhuộm màu trong danh sách công việc thêu; ba màu được phân biệt theo nguồn văn bản.
- source_word: שֵׁשׁ
  choice: vải gai mịn
  rationale: Trong bối cảnh Đền Tạm, שֵׁשׁ chỉ loại vải lanh/gai mịn có giá trị, không chỉ vải nói chung.
- source_word: אֹרֵג
  choice: thợ dệt
  rationale: Tương ứng trực tiếp và tự nhiên với danh từ chỉ người dệt.
- source_word: עֹשֵׂי כָּל מְלָאכָה
  choice: họ làm mọi loại công việc
  rationale: Chuyển phân từ số nhiều thành mệnh đề tiếng Việt tự nhiên, vẫn giữ ý những người thực hiện đủ loại công việc.
- source_word: חֹשְׁבֵי מַחֲשָׁבֹת
  choice: nghĩ ra các mẫu thiết kế
  rationale: Truyền đạt phép lặp cùng gốc của tiếng Hê-bơ-rơ bằng động từ và danh từ có liên hệ nghĩa trong tiếng Việt, tránh lối diễn đạt gượng “thiết kế các thiết kế”.
theological_decisions:
- issue: Chủ thể của מִלֵּא trong câu này
  choice: Ngài
  alternative: Đức Giê-hô-va
  rationale: Động từ tiếp nối chủ thể đã có trong văn cảnh trước; đại từ giữ liên kết diễn ngôn mà không thêm danh xưng không xuất hiện ngay trong câu.
- issue: Ý nghĩa của חָכְמַת לֵב
  choice: Giữ thành ngữ “sự khôn ngoan trong lòng” và giải thích bằng chú thích
  alternative: Chỉ dịch là “tài khéo” hoặc “kỹ năng”
  rationale: Thành ngữ bao gồm kỹ năng, hiểu biết và năng lực phán đoán; không nên thu hẹp thành khả năng kỹ thuật đơn thuần.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng tên nghề quen thuộc với độc giả Việt Nam. Cấu trúc được chia rõ bằng dấu gạch ngang để chuyển từ danh sách nghề sang phần tổng kết. Các thuật ngữ vật liệu được diễn đạt cụ thể nhằm tránh hiểu các màu như trạng từ chỉ cách thêu.
