  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính của nguyên văn: Môi-se nói với בני ישראל, lời gọi chú ý רְאוּ, Yahweh gọi đích danh Bết-sa-lê-ên, dòng gia hệ qua U-ri và Hu-rơ, và sự thuộc về bộ tộc Giu-đa. “Cháu Hu-rơ” diễn đạt đúng quan hệ gia hệ hàm ý trong chuỗi “con U-ri, con Hu-rơ”; không làm thay đổi nghĩa.'
  naturalness: Câu văn rõ, trang trọng và tự nhiên trong tiếng Việt hiện đại. “Hãy xem” phù hợp với lời kêu gọi chú ý; “đã gọi đích danh” diễn đạt gọn và đúng thành ngữ קרא בשם. Cách dùng các tên phiên âm nhất quán với lối Việt hóa quen thuộc.
  terminology: “Yahweh” giữ đúng danh YHWH theo định hướng dự án. “Con cái Y-sơ-ra-ên” diễn đạt tự nhiên chức năng tập thể của בני ישראל; chú thích đã nêu rõ hình thức nguyên văn là “các con trai của Y-sơ-ra-ên” và phương án “dân Y-sơ-ra-ên.” “Bộ tộc Giu-đa” phù hợp với למטה יהודה.
