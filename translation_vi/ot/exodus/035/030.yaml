id: EXO.35.30
reference: Exodus 35:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: vi
  text: 'Môi-se nói với con cái Y-sơ-ra-ên[a]: “Hãy xem, Yahweh đã gọi đích danh Bết-sa-lê-ên, con trai U-ri, cháu Hu-rơ, thuộc bộ tộc Giu-đa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Y-sơ-ra-ên.” Nguyên văn Hê-bơ-rơ là “các con trai của Y-sơ-ra-ên,” một cách gọi tập thể chỉ dân Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng tự sự nối tiếp đưa câu chuyện tiến về phía trước; tiếng Việt không cần dịch riêng liên từ וַ để câu văn tự nhiên.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh quan hệ huyết thống của nguyên ngữ, đồng thời có thể được hiểu theo nghĩa tập thể chỉ dân Y-sơ-ra-ên.
- source_word: רְאוּ
  choice: Hãy xem
  rationale: Mệnh lệnh số nhiều kêu gọi toàn thể người nghe chú ý đến điều được công bố tiếp theo.
- source_word: קָרָא ... בְּשֵׁם
  choice: đã gọi đích danh
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ về việc Yahweh gọi hoặc tuyển chọn một người cụ thể bằng tên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּצַלְאֵל
  choice: Bết-sa-lê-ên
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: con trai U-ri, cháu Hu-rơ
  rationale: Trong chuỗi gia phả này, Bết-sa-lê-ên là con U-ri và U-ri là con Hu-rơ; dùng “cháu Hu-rơ” tránh khiến tiếng Việt hiểu nhầm rằng cả hai đều là cha trực tiếp, nhưng vẫn bảo toàn quan hệ dòng dõi.
- source_word: לְמַטֵּה יְהוּדָה
  choice: thuộc bộ tộc Giu-đa
  rationale: Diễn đạt rõ tư cách thành viên của Bết-sa-lê-ên trong bộ tộc Giu-đa.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; bản dịch giữ danh riêng thay vì thay bằng tước hiệu.
- issue: Phạm vi giới tính của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; các con trai Y-sơ-ra-ên
  rationale: Cụm từ mang hình thức giống đực nhưng có chức năng chỉ cộng đồng dân tộc. “Con cái Y-sơ-ra-ên” giữ phép ẩn dụ huyết thống mà không thu hẹp sai đối tượng chỉ còn nam giới; chú thích nêu các cách dịch khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ danh Yahweh; dùng các dạng tên riêng tiếng Việt quen thuộc. Cấu trúc lời công bố ngắn gọn, còn “đích danh” chuyển tải tự nhiên thành ngữ קרא בשם.
