  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: vi
  text: Mọi người khéo tay trong anh em hãy đến và làm mọi điều Đức Giê-hô-va đã truyền.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hê-bơ-rơ dịch sát là “người có lòng khôn ngoan”, một thành ngữ chỉ người có tài, thành thạo, đặc biệt trong công việc chế tác.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Mỗi người khéo tay trong anh em.” Tiếng Hê-bơ-rơ dùng dạng giống đực số ít với nghĩa phân phối.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל
  choice: Mọi người
  rationale: כָל đi với danh từ số ít mang nghĩa phân phối, chỉ từng người thuộc nhóm; trong tiếng Việt, “mọi người” diễn đạt tự nhiên. Quan hệ nối tiếp của וְ đã được thể hiện phù hợp qua mạch văn, không cần thêm “và” ở đầu câu.
- source_word: חֲכַם לֵב
  choice: khéo tay
  rationale: Thành ngữ Hê-bơ-rơ nghĩa đen là “khôn ngoan trong lòng”, nhưng trong ngữ cảnh chế tác Đền Tạm, nó chỉ năng lực và sự thành thạo thực hành; “khéo tay” tự nhiên và đúng trọng tâm nghề thủ công.
- source_word: בָּכֶם
  choice: trong anh em
  rationale: Giới từ בְּ với hậu tố ngôi hai số nhiều chỉ những người ở giữa cộng đồng được ngỏ lời; “trong anh em” giữ được sắc thái cộng đồng và văn phong trang trọng.
- source_word: יָבֹאוּ
  choice: hãy đến
  rationale: Dạng vị hoàn thành 3 số nhiều mang lực chỉ thị trong lời triệu tập; “hãy đến” truyền đạt mệnh lệnh trực tiếp, tự nhiên trong tiếng Việt.
- source_word: וְיַעֲשׂוּ
  choice: và làm
  rationale: עָשָׂה có thể là “làm” hoặc “chế tạo”; “làm” phù hợp vì tân ngữ bao quát mọi vật Đức Giê-hô-va truyền làm, đồng thời không thu hẹp nghĩa quá mức.
- source_word: אֵת כָּל אֲשֶׁר
  choice: mọi điều
  rationale: Cụm này bao quát toàn bộ những gì được truyền; “mọi điều” ngắn gọn, tự nhiên và giữ tính tổng quát.
- source_word: צִוָּה יְהוָה
  choice: Đức Giê-hô-va đã truyền
  rationale: Động từ hoàn thành diễn tả mệnh lệnh đã được ban trước đó; “đã truyền” giữ đúng quan hệ thời gian. Danh riêng giao ước יְהוָה được phiên âm theo cách dùng quen thuộc trong tiếng Việt là “Đức Giê-hô-va”.
theological_decisions:
- issue: Cách dịch danh thần יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản nguồn nêu trực tiếp danh giao ước. “Đức Giê-hô-va” là dạng danh riêng dễ nhận biết và đã quen thuộc trong tiếng Việt, tránh thay danh ấy bằng một tước hiệu; “Yahweh” là cách phục dựng phát âm thường gặp nhưng không chắc chắn tuyệt đối.
- issue: Phạm vi giới tính của חֲכַם לֵב
  choice: mọi người khéo tay
  alternative: mọi người nam khéo tay; mỗi người có lòng khôn ngoan
  rationale: Cụm Hê-bơ-rơ ở giống đực số ít nhưng có lực phân phối và trong ngữ cảnh có thể chỉ bất cứ thành viên đủ năng lực nào. Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp, nên “mọi người” không thêm giới tính sinh học mà nguồn không khẳng định rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Khéo tay” phù hợp ngữ cảnh thợ thủ công hơn “khôn ngoan”, còn “trong anh em” duy trì sắc thái cộng đồng của lời hiệu triệu. Dấu hai chấm của lớp tiếng Anh không có cơ sở trong câu Hê-bơ-rơ độc lập nên dùng dấu chấm.
