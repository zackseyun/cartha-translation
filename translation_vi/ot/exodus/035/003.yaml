  text: לֹא תְבַעֲר֣וּ אֵ֔שׁ בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶ֑ם בְּ/י֖וֹם הַ/שַּׁבָּֽת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/003.yaml
  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: vi
  text: Các ngươi không được nhóm lửa tại bất cứ nơi ở nào của mình trong ngày Sa-bát.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: nhóm
  rationale: Động từ בער ở thể Piel tại đây chỉ việc làm cho lửa bén hoặc cháy lên. “Nhóm lửa” là cách nói tự nhiên và chính xác trong tiếng Việt, không mở rộng thành mọi việc sử dụng lửa.
- source_word: אֵשׁ
  choice: lửa
  rationale: Danh từ số ít chỉ lửa được nhóm lên. Tiếng Việt tự nhiên dùng “nhóm lửa” mà không cần từ chỉ loại hay mạo từ.
- source_word: בְּכֹל
  choice: tại bất cứ
  rationale: Cụm này mang nghĩa phân bố, khiến lệnh cấm áp dụng cho từng nơi ở. “Tại bất cứ” truyền đạt rõ nghĩa ấy trong tiếng Việt hiện đại.
- source_word: מֹשְׁבֹתֵיכֶם
  choice: nơi ở nào của mình
  rationale: מוֹשָׁב có thể chỉ nơi cư trú hoặc chỗ ở. “Nơi ở” giữ phạm vi rộng hơn “nhà”, còn “của mình” diễn đạt hậu tố ngôi thứ hai số nhiều phù hợp với chủ ngữ “các ngươi”.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: trong ngày Sa-bát
  rationale: Cách dịch này giữ lại danh từ “ngày” có trong tiếng Hê-bơ-rơ và diễn đạt tự nhiên thời điểm lệnh cấm có hiệu lực.
theological_decisions:
- issue: Phạm vi của lệnh cấm về lửa trong ngày Sa-bát
  choice: Dịch trực tiếp là cấm nhóm lửa tại bất cứ nơi ở nào trong ngày Sa-bát.
  alternative: Mở rộng thành cấm mọi việc đốt, duy trì hoặc sử dụng lửa, hay mọi công việc liên quan đến nhiệt.
  rationale: Bản Hê-bơ-rơ nêu cụ thể hành động nhóm lửa. Bản dịch không đưa vào những cách diễn giải pháp lý hoặc thần học về các hình thức sử dụng lửa mà câu này không nói rõ.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. “Các ngươi” duy trì cách xưng hô số nhiều trong lời ban luật; “Sa-bát” là thuật ngữ quen thuộc, còn “nơi ở” tránh thu hẹp nghĩa thành riêng nhà riêng hay mở rộng thành khu định cư.
