base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: vi
  text: bàn thờ xông hương và các đòn khiêng của bàn thờ, dầu xức, hương thơm, và tấm màn che lối vào Đền Tạm;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: bàn thờ xông hương
  rationale: Cụm danh từ ghép chỉ bàn thờ dùng để xông hương. Cách dịch này tự nhiên trong tiếng Việt và diễn đạt rõ công dụng nghi lễ.
- source_word: בַּדָּיו
  choice: các đòn khiêng của bàn thờ
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ các đòn dùng để khiêng vật dụng thánh. Lặp lại 'bàn thờ' giúp tránh đại từ sở hữu thiếu tự nhiên hoặc mơ hồ trong tiếng Việt.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Thuật ngữ ngắn gọn, quen thuộc, giữ đúng ý nghĩa nghi lễ của loại dầu dùng để xức.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: hương thơm
  rationale: הַסַּמִּים nói đến các nguyên liệu có hương thơm; 'hương thơm' diễn đạt tự nhiên sản phẩm hương dùng trong nghi lễ mà không quá nặng tính giải thích.
- source_word: מָסַךְ הַפֶּתַח
  choice: tấm màn che lối vào
  rationale: מָסָךְ là tấm màn treo hoặc màn chắn tại cửa. 'Tấm màn che' vừa cụ thể vừa phù hợp với cấu trúc Đền Tạm.
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: lối vào Đền Tạm
  rationale: Tiền tố לְ biểu thị quan hệ hoặc công dụng của tấm màn đối với lối vào. Gộp tự nhiên thành 'tấm màn che lối vào Đền Tạm' để tránh lặp từ.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Tên gọi tiếng Việt thông dụng cho nơi thánh lưu động trong sách Xuất Ai Cập, đồng thời phản ánh ý niệm về nơi Đức Chúa Trời ngự giữa dân.
