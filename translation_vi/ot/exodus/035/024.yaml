  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: vi
  text: Mọi người dâng lễ vật bằng bạc hoặc đồng[a] đều đem lễ vật ấy đến cho Yahweh; còn mọi người có sẵn gỗ keo[b] để dùng cho bất cứ công việc phục vụ nào đều đem đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật bằng bạc và đồng.” Liên từ Hê-bơ-rơ là “và,” nhưng trong văn cảnh có thể diễn tả ý phân phối: mỗi người đem loại kim loại mình có. Từ được dịch là “đồng” cũng có thể chỉ đồng thiếc.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “người mà gỗ keo được tìm thấy ở cùng người ấy,” một thành ngữ có nghĩa là người ấy có sẵn gỗ keo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: Ai dâng
  rationale: Phân từ của רוּם đi với תְּרוּמָה là cách nói về việc dâng hoặc trao một lễ vật; “ai dâng” tự nhiên và đúng nghĩa trong tiếng Việt.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: lễ vật bằng bạc hoặc đồng
  rationale: תְּרוּמָה là vật được biệt riêng để dâng; “hoặc” diễn đạt tự nhiên ý phân phối rằng mỗi người mang loại kim loại mình có. נְחֹשֶׁת có thể chỉ đồng hoặc đồng thiếc; “đồng” giữ được độ rộng nghĩa trong tiếng Việt.
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: đem lễ vật ấy đến dâng cho Yahweh
  rationale: Cụm sở thuộc có thể nói đến lễ vật thuộc về hoặc dành cho Yahweh. Cách dịch này tự nhiên, nối rõ với lễ vật vừa nêu mà không thêm một chủ thể nhận khác.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được ghi trực tiếp trong bản Hê-bơ-rơ.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: còn ai có sẵn
  rationale: Nguyên văn là “ai mà vật ấy được tìm thấy ở cùng người đó,” một thành ngữ chỉ sự sở hữu hoặc có vật liệu sẵn để dùng.
- source_word: עֲצֵי שִׁטִּים
  choice: gỗ keo
  rationale: Tên gọi hiện đại, dễ hiểu của loại gỗ dùng trong việc dựng Đền Tạm.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: dùng cho bất cứ công việc nào trong việc phục vụ
  rationale: Giữ cả hai ý מְלָאכָה (công việc, công tác chế tác) và עֲבֹדָה (việc phục vụ, lao dịch), đồng thời không thêm “Đền Tạm,” vốn chỉ được hiểu từ văn cảnh.
- source_word: הֵבִיאוּ
  choice: đều đem đến
  rationale: Động từ số nhiều được diễn đạt theo cấu trúc phân phối tự nhiên trong tiếng Việt; đối tượng là gỗ keo đã nêu trước đó.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản nguồn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” giữ danh riêng thay vì thay bằng một tước hiệu.
- issue: Quan hệ trong cụm תְּרוּמַת יְהוָה
  choice: lễ vật … dâng cho Yahweh
  alternative: lễ vật của Yahweh
  rationale: Cấu trúc sở thuộc có thể hàm ý lễ vật thuộc về Yahweh hoặc được dành cho Ngài. Trong tiếng Việt, “dâng cho Yahweh” truyền đạt rõ chức năng hiến dâng mà không xác định quá mức bản chất của quan hệ sở thuộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc “ai… đều…” thể hiện tính phân phối của câu Hê-bơ-rơ; dấu chấm phẩy giữ hai vế song song. Không thêm từ “Đền Tạm” vì danh từ ấy không xuất hiện trực tiếp trong câu.
