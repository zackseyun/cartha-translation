  source_fidelity: Bản nháp chuyển đạt đúng cấu trúc phân phối của câu, hai loại vật liệu, danh Yahweh, và thành ngữ chỉ việc có sẵn gỗ keo. Tuy nhiên, cụm “dùng cho bất cứ công việc nào trong việc phục vụ” hơi nặng và lặp ý; có thể diễn đạt tự nhiên hơn mà vẫn giữ đủ hai danh từ Hê-bơ-rơ “công việc” và “phục vụ.”
  naturalness: 'Cần chỉnh nhẹ để câu tiếng Việt gọn, song song hơn: thay “ai có sẵn ... thì đều” bằng “mọi người có sẵn ... đều,” và dùng “công việc phục vụ” thay cho “công việc nào trong việc phục vụ.”'
  terminology: “Yahweh,” “lễ vật,” “bạc,” “đồng,” và “gỗ keo” phù hợp. Chú thích cần giữ khả năng nghĩa của נְחֹשֶׁת là đồng hoặc đồng thiếc, và giải thích thành ngữ “được tìm thấy ở cùng.”
