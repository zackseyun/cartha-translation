  text: the balsam and the oil for the light[a], and for the anointing oil and for the incense of spices[b],
translation:
  language: vi
  text: hương liệu, dầu để thắp sáng, dầu để xức, và hương để xông bằng hương liệu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: hương liệu
  rationale: Danh từ בֹּשֶׂם chỉ một chất thơm hoặc hương liệu. Trong danh sách vật liệu dùng cho Đền Tạm, “hương liệu” vừa cụ thể, tự nhiên trong tiếng Việt, vừa không thu hẹp nghĩa thành một loại nhựa thơm riêng biệt.
- source_word: הַשָּׁמֶן
  choice: dầu
  rationale: שֶׁמֶן là từ thông thường chỉ dầu; nguyên văn tại đây không nêu rõ dầu ô-liu.
- source_word: לְמָאוֹר
  choice: để thắp sáng
  rationale: מָאוֹר có thể chỉ ánh sáng hoặc vật phát sáng; trong ngữ cảnh dầu dùng cho việc chiếu sáng, cách diễn đạt theo chức năng này tự nhiên và không thêm một ngọn đèn cụ thể.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu để xức
  rationale: Cụm từ chỉ loại dầu dùng trong nghi thức xức; “dầu để xức” rõ nghĩa và phù hợp với tiếng Việt hiện đại.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: hương thơm làm từ các loại gia vị
  rationale: קְטֹרֶת là hương được đốt, còn סַמִּים là các chất hoặc gia vị thơm. Cách dịch này giữ cả vật được đốt lẫn thành phần tạo hương, đồng thời tránh cách kết hợp thiếu tự nhiên “hương của gia vị”.
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: hương liệu, dầu ... dầu ... và hương thơm
  rationale: Các liên từ và dấu chỉ tân ngữ tiếp nối danh sách lễ vật từ câu trước. Tiếng Việt có thể lược bớt liên từ ở đầu các mục để danh sách tự nhiên, nhưng vẫn giữ “và” trước mục cuối.
