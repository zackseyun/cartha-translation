translation:
  language: vi
  text: Tất cả phụ nữ được lòng mình thôi thúc đều khéo léo se lông dê thành sợi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “những con dê”; ở đây tiếng Hê-bơ-rơ tỉnh lược danh từ “lông”, tức lông dê dùng để se sợi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: Tất cả những phụ nữ
  rationale: כָּל đi với danh từ số nhiều mang nghĩa tập hợp; cách diễn đạt này tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: được lòng mình thôi thúc
  rationale: Thành ngữ Hê-bơ-rơ nói lòng của họ nâng hoặc thúc đẩy chính họ, diễn tả động lực tự nguyện từ bên trong. “Được lòng mình thôi thúc” giữ hình ảnh về lòng mà vẫn tự nhiên trong tiếng Việt.
- source_word: בְּחָכְמָה
  choice: với tài khéo léo
  rationale: Trong bối cảnh thủ công, חָכְמָה chỉ năng lực và kỹ năng thực hành hơn là sự khôn ngoan trừu tượng. Vị trí của cụm từ trong câu Hê-bơ-rơ không hoàn toàn loại trừ việc liên hệ nó với sự thôi thúc hoặc với hành động se sợi, nên bản dịch đặt thành một cụm chen giữa để không ấn định quá mức.
- source_word: טָווּ
  choice: se ... thành sợi
  rationale: Động từ chỉ việc se vật liệu dệt thành sợi. Cách nói này rõ nghĩa và tự nhiên hơn động từ đơn lẻ “se” khi đối tượng là lông dê.
- source_word: אֶת הָעִזִּים
  choice: lông dê
  rationale: Nguyên văn là “những con dê”, nhưng trong ngữ cảnh chế tác vật liệu cho Đền Tạm, đây là phép tỉnh lược chỉ lông dê dùng để se sợi. Dịch rõ phần được ngầm hiểu để tránh khiến độc giả tưởng họ se chính các con vật.
