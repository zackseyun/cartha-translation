  yaml_path: translation/ot/exodus/035/027.yaml
  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: vi
  text: Các thủ lĩnh đem đến những viên mã não[a] và những viên đá để nạm, dùng cho ê-phót và vật đeo ngực[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “những viên đá sô-ham”; chưa xác định chắc chắn đây là loại đá quý nào, dù theo truyền thống thường được dịch là “mã não.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “miếng đeo ngực.” Từ Hê-bơ-rơ chỉ vật phẩm tư tế đeo trước ngực, không phải áo giáp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: Các thủ lĩnh
  rationale: נְשִׂיאִים chỉ những người đứng đầu cộng đồng; “các thủ lĩnh” là cách diễn đạt hiện đại, rõ nghĩa và không hàm ý họ thuộc hoàng tộc.
- source_word: הֵבִיאוּ
  choice: đem đến
  rationale: Dạng Hiphil của בוא ở đây có nghĩa là mang hoặc đem vật phẩm đến đóng góp; “đem đến” tự nhiên trong văn cảnh.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: những viên mã não
  rationale: שֹׁהַם theo truyền thống thường được hiểu là mã não/onyx trong các đoạn về Đền Tạm và y phục tư tế, nhưng loại đá chính xác không chắc chắn nên có chú thích.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: những viên đá để nạm
  rationale: Trong văn cảnh kim hoàn, מִלֻּאִים nói đến các viên đá được gắn hoặc nạm vào đồ trang sức; cách dịch này truyền đạt chức năng rõ ràng.
- source_word: לָאֵפֹד
  choice: dùng cho ê-phót
  rationale: אֵפֹד là tên một lễ phục tư tế không có từ tương đương chính xác trong tiếng Việt; phiên âm giữ thuật ngữ chuyên biệt.
- source_word: וְלַחֹשֶׁן
  choice: và túi đeo ngực
  rationale: חֹשֶׁן là vật phẩm tư tế đeo trước ngực và có dạng túi, không phải giáp bảo vệ; cách dịch này tránh liên tưởng sai đến áo giáp.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “thủ lĩnh” cho người đứng đầu cộng đồng; phiên âm “ê-phót” vì không có từ tương đương chính xác; “túi đeo ngực” làm rõ chức năng của vật phẩm tư tế.
