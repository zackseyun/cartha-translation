  to: Các thủ lĩnh đem đến những viên mã não[a] và những viên đá để nạm, dùng cho ê-phót và vật đeo ngực[b].
  rationale: Thay “túi đeo ngực” bằng “vật đeo ngực” để dịch חֹשֶׁן sát hơn và không áp đặt một đặc điểm hình dạng lên thuật ngữ. Các phần còn lại trung thành với tiếng Hê-bơ-rơ và phù hợp tiếng Việt hiện đại.
