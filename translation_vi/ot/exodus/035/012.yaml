translation:
  language: vi
  text: Hòm Giao Ước và các đòn khiêng, nắp chuộc tội[a], cùng bức màn che,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngai thi ân.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֹן
  choice: Hòm Giao Ước
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ chiếc hòm thánh; cách gọi “Hòm Giao Ước” tự nhiên và xác định rõ vật được nói đến trong tiếng Việt, dù từ “giao ước” được hiểu từ ngữ cảnh rộng hơn.
- source_word: בַּדָּיו
  choice: các đòn khiêng
  rationale: Chỉ các đòn dùng để khiêng và vận chuyển Hòm; “đòn khiêng” rõ nghĩa, hiện đại và phù hợp với đồ thánh.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Vừa diễn tả đây là nắp của Hòm, vừa giữ sắc thái nghi lễ chuộc tội của thuật ngữ Hê-bơ-rơ; ghi chú bảo lưu cách gọi truyền thống khác.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: bức màn che
  rationale: Cụm danh từ chỉ tấm màn ngăn cách bên trong Đền Tạm. “Bức màn che” giữ được chức năng phân cách mà không tạo một vật thứ hai từ hai danh từ Hê-bơ-rơ liên kết chặt chẽ.
- source_word: אֶת / וְאֶת
  choice: không dịch trực tiếp
  rationale: Các tiểu từ đánh dấu tân ngữ xác định không có từ tương đương trực tiếp trong tiếng Việt; quan hệ liệt kê được thể hiện bằng dấu câu và “cùng”.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת trong bối cảnh nghi lễ
  choice: nắp chuộc tội
  alternative: ngai thương xót
  rationale: “Nắp chuộc tội” cho biết vật này là nắp Hòm và bảo toàn mối liên hệ từ vựng với nghi lễ chuộc tội. “Ngai thương xót” là cách gọi truyền thống có giá trị thần học nhưng ít trực tiếp hơn về hình dạng và chức năng của vật, nên được giữ trong chú thích.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp với một mục trong danh sách vật dụng Đền Tạm. Dùng “Hòm Giao Ước” theo cách gọi Kinh Thánh quen thuộc trong tiếng Việt; câu giữ dạng mảnh liệt kê vì câu nguồn nằm trong một danh sách tiếp nối.
