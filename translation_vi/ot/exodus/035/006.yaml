  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: vi
  text: chỉ xanh lam, chỉ tím, chỉ đỏ thắm, vải lanh mịn và lông dê.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “dê”; trong ngữ cảnh này, từ ấy chỉ lông dê dùng làm vật liệu cho Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְכֵלֶת
  choice: chỉ xanh lam
  rationale: Danh từ này chỉ vật liệu dệt được nhuộm xanh lam hoặc xanh lam pha tím. Trong danh sách vật liệu dùng cho Đền Tạm, “chỉ xanh lam” diễn đạt tự nhiên và làm rõ đây là nguyên liệu dệt.
- source_word: אַרְגָּמָן
  choice: chỉ tím
  rationale: Từ này chỉ vật liệu dệt nhuộm màu tím. Dịch là “chỉ tím” giữ sự song song với các màu chỉ khác trong danh sách.
- source_word: תוֹלַעַת שָׁנִי
  choice: chỉ đỏ thắm
  rationale: Cụm từ theo nghĩa sát liên quan đến phẩm đỏ lấy từ côn trùng, nhưng trong ngữ cảnh này chỉ vật liệu nhuộm đỏ thắm; cách dịch này tự nhiên và giữ đúng sắc màu.
- source_word: שֵׁשׁ
  choice: vải gai mịn
  rationale: Trong các đoạn nói về Đền Tạm, từ này thường chỉ loại vải lanh mịn. “Vải gai mịn” là cách nói dễ hiểu trong tiếng Việt hiện đại và thể hiện phẩm chất của vật liệu.
- source_word: עִזִּים
  choice: lông dê
  rationale: Nguyên văn chỉ nói “dê”, nhưng trong danh sách nguyên liệu dệt cho Đền Tạm, ý chỉ lông dê dùng để dệt các tấm phủ. Bản dịch nêu rõ vật liệu được hàm ý để tránh hiểu là dê sống.
- source_word: וְ
  choice: và
  rationale: Liên từ lặp lại nối từng mục trong nguyên văn. Tiếng Việt giữ “và” trước mục cuối để danh sách tự nhiên, thay vì lặp ở mọi mục một cách nặng nề.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chỉ” cho ba vật liệu mang màu nhằm làm rõ ngữ cảnh dệt may; dùng “vải gai mịn” và “lông dê” theo cách gọi quen thuộc. Dấu chú thích [a] được đặt ngay sau “lông dê”, là từ cần giải thích.
