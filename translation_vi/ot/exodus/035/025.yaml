base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: vi
  text: 'Mọi phụ nữ khéo léo[a] đều tự tay kéo sợi; rồi họ đem những gì họ đã kéo sợi: sợi màu xanh lam, sợi màu tím, sợi màu đỏ tươi[b] và vải lanh mịn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nguyên văn: “khôn ngoan trong lòng”, một thành ngữ chỉ sự khôn ngoan nội tâm thể hiện qua kỹ năng thực hành.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “màu xanh lam, màu tím, màu đỏ tươi và vải lanh mịn”; nguyên văn liệt kê các vật liệu sau cụm “những gì họ đã kéo sợi”.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: khéo léo
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “khôn ngoan trong lòng”, chỉ sự khôn ngoan nội tâm biểu hiện thành kỹ năng thực hành. “Khéo léo” tự nhiên và rõ nghĩa trong tiếng Việt; chú thích giữ lại hình ảnh nguyên ngữ.
- source_word: בְּיָדֶיהָ
  choice: tự tay
  rationale: Diễn đạt tự nhiên phương tiện “bằng đôi tay mình”, đồng thời nhấn mạnh chính họ thực hiện công việc thủ công.
- source_word: טָוּוּ
  choice: kéo sợi
  rationale: Động từ chỉ việc se hoặc kéo xơ thành sợi; “kéo sợi” là cách nói tiếng Việt rõ ràng trong ngữ cảnh dệt may.
- source_word: וַיָּבִיאוּ
  choice: rồi họ đem
  rationale: Giữ sự chuyển đổi của nguyên văn từ chủ ngữ số ít có tính phân phối “mọi phụ nữ” sang động từ số nhiều chỉ cả nhóm.
- source_word: מַטְוֶה
  choice: những thứ mình đã kéo
  rationale: Danh từ chỉ sản phẩm đã được kéo thành sợi. Cách dịch này bảo toàn quan hệ với danh sách vật liệu theo sau mà không khẳng định tất cả các mục đều là sợi.
- source_word: תְּכֵלֶת
  choice: sợi màu xanh lam
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ vật liệu dệt nhuộm màu xanh quý giá; thêm “sợi” giúp câu tiếng Việt rõ nghĩa.
- source_word: אַרְגָּמָן
  choice: màu tím
  rationale: Chỉ vật liệu nhuộm màu tím dùng cho Đền Tạm; danh từ “sợi” ở đầu chuỗi được hiểu là chi phối cả ba màu.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: màu đỏ tươi
  rationale: Cụm từ chỉ vật liệu nhuộm đỏ tươi, vốn liên hệ với thuốc nhuộm từ côn trùng. Cách dịch ưu tiên màu sắc và công dụng dệt may thay vì dịch sát nhưng khó hiểu.
- source_word: שֵׁשׁ
  choice: vải gai mịn
  rationale: Trong các phân đoạn về Đền Tạm, từ này thường chỉ loại vải lanh/gai mịn có phẩm chất cao. “Vải gai mịn” là cách gọi quen thuộc, phân biệt vật liệu này với các sợi màu đứng trước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch dùng “khéo léo” trong câu chính để tự nhiên trong tiếng Việt, đồng thời chú thích thành ngữ “khôn ngoan trong lòng”. Dấu hai chấm giữ cấu trúc danh sách vật liệu của nguyên văn.
