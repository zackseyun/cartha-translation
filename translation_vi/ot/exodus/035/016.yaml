lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: Cụm từ chỉ bàn thờ dành cho lễ vật được thiêu trọn. Cách dịch này tự nhiên, rõ chức năng hiến tế và không thêm ý ngoài nguyên văn.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: tấm lưới bằng đồng
  rationale: מִכְבָּר chỉ một kết cấu dạng lưới gắn với bàn thờ; “tấm lưới bằng đồng” diễn đạt cụ thể, dễ hiểu trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר לוֹ
  choice: thuộc về bàn thờ ấy
  rationale: Cụm quan hệ diễn tả sự sở hữu hoặc liên hệ, nhưng không xác định chính xác vị trí; cách dịch này tránh thêm ý “ở trên” hay “gắn vào”.
- source_word: בַּדָּיו
  choice: các đòn khiêng
  rationale: בַּדִּים là các đòn dùng để khiêng đồ dùng của Đền Tạm. Thêm “khiêng” giúp người đọc hiện đại nhận biết công dụng mà vẫn giữ đúng nghĩa từ.
- source_word: כָּל כֵּלָיו
  choice: mọi dụng cụ của bàn thờ
  rationale: כֵּלִים là thuật ngữ rộng chỉ các đồ dùng hoặc khí cụ đi kèm bàn thờ. Lặp lại “bàn thờ” thay cho đại từ giúp câu tiếng Việt rõ nghĩa.
- source_word: הַכִּיֹּר
  choice: chậu
  rationale: Từ này chỉ chậu dùng để rửa trong sân Đền Tạm. “Chậu” là từ hiện đại, dễ hiểu hơn các thuật ngữ cổ hoặc chuyên biệt.
- source_word: כַּנּוֹ
  choice: chân chậu
  rationale: כֵּן chỉ bộ phận đỡ hoặc đế của chậu. “Chân chậu” cụ thể và tự nhiên trong ngữ cảnh này, trong khi “đế chậu” vẫn là một khả năng.
