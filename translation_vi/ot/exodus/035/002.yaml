revisions:
- from: Trong sáu ngày, công việc có thể được làm, nhưng ngày thứ bảy sẽ là ngày thánh cho anh em—một ngày Sa-bát nghỉ hoàn toàn[a] dành cho Yahweh.[b] Bất cứ ai làm việc trong ngày ấy đều phải bị xử tử.
  to: Trong sáu ngày được làm việc, nhưng ngày thứ bảy sẽ là một ngày thánh cho các ngươi, một ngày Sa-bát, ngày nghỉ ngơi trọn vẹn dành cho Yahweh.[a] Bất cứ ai làm việc trong ngày ấy phải bị xử tử.
  rationale: Đã thay các cách nói gượng bằng tiếng Việt hiện đại nhưng vẫn bảo toàn sắc thái phi nhân xưng của quy định về sáu ngày, ngôi thứ hai số nhiều của לָכֶם, và sự nhấn mạnh của “Sa-bát, nghỉ Sa-bát”. Hai chú thích gốc cùng nằm ở vị trí sau “Yahweh”, nên được gộp vào một chú thích duy nhất để tránh hai ký hiệu liên tiếp tại cùng một điểm, đồng thời vẫn giữ đầy đủ các khả năng từ vựng liên quan.
