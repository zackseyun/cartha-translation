  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của Hebrew: đối lập sáu ngày và ngày thứ bảy, tính thánh, cụm nhấn mạnh שַׁבָּת שַׁבָּתוֹן, sự quy thuộc/dâng hiến cho Yahweh, và chế tài pháp lý ở cuối câu. Tuy nhiên, “công việc có thể được làm” vừa nặng tính bị động vừa kém tự nhiên trong tiếng Việt. Cách nói phi nhân xưng “được làm việc” giữ tốt sắc thái quy định mà tự nhiên hơn. “Anh em” cũng diễn giải đối tượng לָכֶם theo một quan hệ cộng đồng cụ thể hơn cần thiết; “các ngươi” sát với ngôi thứ hai số nhiều của nguyên văn trong văn cảnh luật pháp.'
