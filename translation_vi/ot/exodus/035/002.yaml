  terminology: Giữ “Sa-bát” và “Yahweh” là nhất quán với các quyết định đã nêu. “Ngày nghỉ ngơi trọn vẹn” phản ánh được cường độ của שַׁבָּתוֹן mà không đưa vào ý “long trọng” không được nêu trực tiếp trong từ Hebrew. “Bị xử tử” truyền đạt đúng thể Hofal יוּמָת trong ngữ cảnh luật pháp.
