  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י יִהְיֶ֨ה לָ/כֶ֥ם קֹ֛דֶשׁ שַׁבַּ֥ת שַׁבָּת֖וֹן לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֥ה ב֛/וֹ מְלָאכָ֖ה יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: vi
  text: Trong sáu ngày được làm việc, nhưng ngày thứ bảy sẽ là một ngày thánh cho các ngươi, một ngày Sa-bát, ngày nghỉ ngơi trọn vẹn dành cho Yahweh.[a] Bất cứ ai làm việc trong ngày ấy phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có thể hiểu là “cho Yahweh,” “dành cho Yahweh” hoặc “thuộc về Yahweh.” Cụm Hebrew “Sa-bát, sự nghỉ Sa-bát” nhấn mạnh việc hoàn toàn ngừng công việc.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: công việc có thể được làm
  rationale: Giữ thể bị động, phi nhân xưng của động từ Hebrew, đồng thời diễn đạt tự nhiên sắc thái quy định cho phép mà không biến câu thành mệnh lệnh trực tiếp.
- source_word: קֹדֶשׁ
  choice: ngày thánh
  rationale: Danh từ קֹדֶשׁ chỉ địa vị được biệt riêng, thánh; thêm “ngày” theo ngữ cảnh để câu tiếng Việt rõ ràng mà không thay đổi ý nghĩa.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: một ngày Sa-bát nghỉ hoàn toàn
  rationale: Cụm lặp cùng gốc nhấn mạnh sự ngừng nghỉ trọn vẹn. Cách dịch này giữ thuật ngữ Sa-bát và truyền đạt cường độ của שַׁבָּתוֹן bằng tiếng Việt hiện đại.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ ל có thể chỉ sự hướng về, sự dâng hiến hoặc thuộc về; “dành cho” phù hợp văn cảnh nhưng vẫn cần chú thích các khả năng gần nghĩa.
- source_word: כָּל הָעֹשֶׂה בּוֹ מְלָאכָה
  choice: Bất cứ ai làm việc trong ngày ấy
  rationale: Diễn đạt tự nhiên một trường hợp luật pháp có phạm vi phổ quát; “trong ngày ấy” làm rõ đại từ בּוֹ quy chiếu về ngày Sa-bát.
- source_word: יוּמָת
  choice: đều phải bị xử tử
  rationale: Thể Hofal của מות là thể bị động gây khiến, nghĩa là bị làm cho chết. “Phải bị xử tử” truyền đạt dứt khoát hình phạt pháp lý mà không thêm trạng từ nhấn mạnh vốn không có riêng trong câu Hebrew.
theological_decisions:
- issue: Cách thể hiện danh riêng יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn ghi trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu; không thêm “Đức” vì văn bản Hebrew không có tước hiệu tại đây.
- issue: Quan hệ của ngày Sa-bát với Yahweh trong לַיהוָה
  choice: dành cho Yahweh
  alternative: thuộc về Yahweh; hướng về Yahweh
  rationale: Giới từ ל cho phép nhiều sắc thái liên hệ gần nhau. Bản chính chọn cách nói tự nhiên về sự biệt riêng/dâng hiến, còn chú thích giữ lại độ mở của cấu trúc Hebrew.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc đối lập giữa sáu ngày và ngày thứ bảy; dùng “anh em” cho đại từ số nhiều לָכֶם theo lối xưng hô cộng đồng. “Sa-bát” được viết theo dạng quen thuộc trong tiếng Việt, còn danh יהוה được phiên là “Yahweh”.
