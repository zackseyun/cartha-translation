translation:
  language: vi
  text: đá mã não[a] và đá dùng để nạm trên ê-phốt và bảng đeo ngực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שֹׁהַם (shoham) theo truyền thống được dịch là “mã não”, nhưng chưa xác định chắc chắn đó là loại đá quý nào; cũng có thể là beryl hoặc đơn giản gọi là “đá shoham”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: đá mã não
  rationale: שֹׁהַם chỉ một loại đá quý nhưng chưa thể xác định chắc chắn. “Mã não” là cách dịch truyền thống, quen thuộc trong tiếng Việt; chú thích giữ lại sự bất định về khoáng vật.
- source_word: אַבְנֵי מִלֻּאִים
  choice: các loại đá để khảm
  rationale: מִלֻּאִים trong ngữ cảnh lễ phục tư tế nói đến những viên đá được gắn hoặc khảm vào vật mang; cách diễn đạt này tự nhiên và nêu rõ công dụng.
- source_word: לָאֵפֹד
  choice: vào ê-phốt
  rationale: אֵפֹד là thuật ngữ chuyên biệt chỉ lễ phục tư tế. Phiên âm “ê-phốt” bảo toàn tính đặc thù của vật này và phù hợp cách dùng Kinh Thánh tiếng Việt.
- source_word: וְלַחֹשֶׁן
  choice: và bảng đeo ngực
  rationale: חֹשֶׁן chỉ vật tư tế đeo trước ngực để gắn các viên đá, không phải áo giáp. “Bảng đeo ngực” rõ nghĩa, tự nhiên và tránh sắc thái quân sự của “giáp che ngực”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ phiên âm “ê-phốt” cho lễ phục chuyên biệt; “bảng đeo ngực” diễn đạt chức năng của חֹשֶׁן mà không gợi nghĩa áo giáp. Liên từ đầu câu trong tiếng Hê-bơ-rơ không được thể hiện vì câu tiếng Việt là một mục trong danh sách và không cần thêm “và” ở đầu.
