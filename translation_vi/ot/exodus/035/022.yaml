source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: vi
  text: Vậy, những người nam đến cùng với những người nữ[a]. Tất cả những ai có lòng tự nguyện đều mang đến trâm cài, khuyên tai, nhẫn và các đồ trang sức—mọi vật bằng vàng[b]. Và mọi người nam dâng vàng làm lễ vật đưa qua đưa lại cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm tiếng Hê-bơ-rơ dịch sát là “những người nam trên/cùng với những người nữ”; đây có lẽ là cách nói cho biết những người nam đến cùng với, hoặc đến thêm vào số những người nữ.
    reason: alternative_reading
  - marker: b
    text: 'Nghĩa chính xác của một số tên đồ trang sức trong tiếng Hê-bơ-rơ không chắc chắn: “trâm cài” cũng có thể là móc cài hoặc vòng; “khuyên tai” cũng có thể là khuyên mũi; “các đồ trang sức” có thể chỉ một loại mặt dây hoặc vòng đeo tay cụ thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Vậy, ... đến
  rationale: Dạng waw liên tiếp đẩy câu chuyện tiến tới; “Vậy” diễn đạt mạch nối tự nhiên trong tiếng Việt.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: những người nam cùng đến với những người nữ
  rationale: עַל ở đây nhiều khả năng là cách nói chỉ sự cùng tham gia hoặc đến thêm vào; bản dịch tránh cách hiểu không phù hợp là “ở trên” phụ nữ.
- source_word: כֹּל נְדִיב לֵב
  choice: tất cả những ai có lòng tự nguyện
  rationale: Giữ hình ảnh “lòng” của tiếng Hê-bơ-rơ và diễn đạt tâm thế sẵn lòng, rộng rãi một cách tự nhiên.
- source_word: חָח
  choice: trâm cài
  rationale: Tên món đồ trang sức này không chắc chắn; “trâm cài” là một khả năng hợp ngữ cảnh nhưng được chú thích để tránh tạo cảm giác chắc chắn giả tạo.
- source_word: נֶזֶם
  choice: khuyên tai
  rationale: Từ này có thể chỉ vòng đeo tai hoặc mũi; “khuyên tai” là cách hiểu tự nhiên trong danh sách nữ trang, với khả năng khác được ghi ở chú thích.
- source_word: טַבַּעַת
  choice: nhẫn
  rationale: Dịch ở mức khái quát, không thêm nghĩa “nhẫn ấn” vốn không được văn cảnh này xác định rõ.
- source_word: כוּמָז
  choice: các đồ trang sức
  rationale: Đây là từ hiếm, nghĩa cụ thể không chắc chắn; cách gọi rộng tránh xác định quá mức.
- source_word: כָּל כְּלִי זָהָב
  choice: đủ loại nữ trang bằng vàng
  rationale: כְּלִי có nghĩa rộng là đồ vật; trong danh sách đồ đeo, cách dịch này tự nhiên và phù hợp ngữ cảnh.
- source_word: וְכָל אִישׁ
  choice: mỗi người nam
  rationale: Giữ sắc thái giống đực cụ thể của אִישׁ thay vì trung tính hóa.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: dâng vàng làm lễ vật đưa qua đưa lại
  rationale: Giữ nét nghi lễ của động từ “đưa qua đưa lại/nâng đưa” và danh từ kỹ thuật תְּנוּפָה, đồng thời tạo câu tiếng Việt dễ hiểu.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Dùng tên riêng giao ước cho יהוה; “lên” diễn đạt hướng quy dâng của lễ vật.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng thay vì thay bằng tước hiệu. “Đức Giê-hô-va” là dạng tên quen thuộc và trang trọng trong tiếng Việt, dù “Yahweh” gần cách phục nguyên học thuật hơn.
- issue: Ngôn ngữ chỉ giới tính trong וְכָל אִישׁ
  choice: mỗi người nam
  alternative: mỗi người; mọi người
  rationale: Nguồn dùng danh từ giống đực số ít אִישׁ, nên bản dịch bảo toàn cách nói cụ thể này; sự tham gia của cả nam và nữ đã được nêu ở đầu câu.
- issue: Sắc thái nghi lễ của תְּנוּפָה
  choice: lễ vật đưa qua đưa lại
  alternative: lễ vật dâng; lễ vật vẫy
  rationale: Bảo toàn tính chất kỹ thuật của nghi lễ mà không khiến độc giả hiểu “vẫy” theo nghĩa thông thường thiếu trang nghiêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ về “lòng”, sự phân biệt nam–nữ của nguồn, cùng thuật ngữ nghi lễ; hai chú thích công khai những chỗ tiếng Hê-bơ-rơ còn mơ hồ.
