    issue: Danh יהוה được dịch là “Đức Giê-hô-va” thay vì “Yahweh”.
    rationale: Audit trail và quy ước dự án xác định יהוה được dịch là “Yahweh”.
  - severity: medium
    issue: “đủ loại nữ trang bằng vàng” thu hẹp כָּל־כְּלִי זָהָב quá mức.
    rationale: כְּלִי là từ rộng, chỉ mọi vật/đồ vật; danh sách trước đó là đồ trang sức nhưng cụm tổng kết không nhất thiết chỉ giới hạn ở nữ trang.
