base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: vi
  text: Mọi người nam và người nữ mà lòng thôi thúc họ[a] đem đến cho mọi công việc mà Yahweh đã truyền, qua Môi-se,[b] phải thực hiện—dân Y-sơ-ra-ên[c] đã đem một lễ vật tự nguyện đến cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được lòng mình thôi thúc” hoặc “có lòng sẵn sàng.” Thành ngữ Hê-bơ-rơ diễn tả sự sẵn lòng hay thôi thúc từ nội tâm.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “bởi tay Môi-se,” một thành ngữ có nghĩa là “qua Môi-se” hoặc “do Môi-se làm trung gian.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “con cái Y-sơ-ra-ên”; đây là cách gọi dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: Mỗi người nam và người nữ
  rationale: Giữ cách nêu rõ cả nam lẫn nữ và sắc thái phân phối của כָּל, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: נָדַב לִבָּם אֹתָם
  choice: có lòng tự nguyện
  rationale: Thành ngữ Hê-bơ-rơ diễn tả sự sẵn lòng hoặc thôi thúc từ nội tâm; cách dịch này rõ nghĩa, tự nhiên và không hàm ý bị ép buộc.
- source_word: לְהָבִיא
  choice: mang lễ vật đến
  rationale: Động từ có nghĩa là “mang đến”; “lễ vật” được bổ sung từ văn cảnh về sự đóng góp, giúp câu tiếng Việt đầy đủ mà không đổi nội dung.
- source_word: לְכָל הַמְּלָאכָה
  choice: cho mọi công việc
  rationale: מְלָאכָה chỉ toàn bộ công việc làm Đền Tạm và các vật dụng; “công việc” là cách diễn đạt bao quát, tự nhiên.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: mà Yahweh đã truyền phải thực hiện qua Môi-se
  rationale: “Qua Môi-se” chuyển tải thành ngữ בְּיַד, nghĩa đen là “bởi tay Môi-se,” với ý chỉ vai trò trung gian; “phải thực hiện” giữ lực của mệnh lệnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên đã dâng
  rationale: בְנֵי יִשְׂרָאֵל là danh xưng dân tộc; “dân Y-sơ-ra-ên” tự nhiên hơn “con cái Y-sơ-ra-ên” trong tiếng Việt hiện đại. Trong ngữ cảnh lễ vật, “dâng” diễn đạt đúng hành động đem đến cho Yahweh.
- source_word: נְדָבָה
  choice: một lễ vật tự nguyện
  rationale: Diễn tả lễ vật được dâng do tự nguyện, không phải vì cưỡng ép; cách nói này minh bạch trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh; giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Tính tự nguyện của lễ dâng
  choice: có lòng tự nguyện; lễ vật tự nguyện
  alternative: được lòng thúc giục; lễ vật lạc ý
  rationale: Bảo tồn sự nhấn mạnh kép của câu vào động lực tự nguyện từ nội tâm, không biến nó thành nghĩa vụ hay cưỡng ép.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Môi-se” và “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; giữ danh “Yahweh” theo nguồn Hê-bơ-rơ. Dấu gạch ngang phản ánh sự chuyển từ mệnh đề mô tả những người tự nguyện sang mệnh đề chính, đồng thời bảo tồn cấu trúc hơi nhấn mạnh của nguyên văn.
