    rationale: Nguyên ngữ nói lòng họ khiến/thúc đẩy họ sẵn lòng. “Lòng thôi thúc họ” bảo tồn tác nhân nội tâm và sắc thái tự nguyện tốt hơn.
  - severity: medium
    issue: “Qua Môi-se” có phạm vi cú pháp chưa rõ.
