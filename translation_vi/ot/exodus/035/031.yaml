- from: Ngài làm cho ông đầy tràn Thần của Đức Chúa Trời[a], cùng sự khôn ngoan, sự thông hiểu, sự hiểu biết và đủ mọi tài nghệ[b].
  to: Ngài đã làm cho ông đầy dẫy Thần của Đức Chúa Trời[a], sự khôn ngoan, sự thông hiểu, sự hiểu biết và mọi loại kỹ năng thủ công[b].
  rationale: Bản sửa thay đổi cú pháp để diễn đạt chính xác và tự nhiên ý ‘Ngài làm đầy ông bằng ...’, đồng thời thay “tài nghệ” bằng thuật ngữ nêu rõ kỹ năng/công việc thủ công. Ba danh từ trong bộ ba khôn ngoan–thông hiểu–hiểu biết được giữ nguyên. Chú thích tiếp tục bảo lưu tính không hoàn toàn xác định của רוּחַ אֱלֹהִים và các lựa chọn từ vựng cho מְלָאכָה.
