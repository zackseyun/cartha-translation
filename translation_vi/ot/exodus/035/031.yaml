  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: vi
  text: Ngài đã làm cho ông đầy dẫy Thần của Đức Chúa Trời[a], sự khôn ngoan, sự thông hiểu, sự hiểu biết và mọi loại kỹ năng thủ công[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thần khí của Đức Chúa Trời” hoặc “một thần khí đến từ Đức Chúa Trời.” Cụm từ Hê-bơ-rơ có thể được hiểu theo nghĩa rộng hơn, nhưng trong bối cảnh này nhiều khả năng chỉ Thần của Đức Chúa Trời, là Đấng ban năng lực cho ông.
    reason: alternative_reading
  - marker: b
    text: Hoặc “mọi công việc” hay “mọi nghề thủ công.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא
  choice: Ngài làm cho ... đầy tràn
  rationale: Động từ Piel trong mạch kể quá khứ diễn tả việc Đức Chúa Trời làm cho Bết-sa-lê được đầy tràn. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ hình ảnh ‘làm đầy’ của tiếng Hê-bơ-rơ.
- source_word: אֹתוֹ
  choice: ông
  rationale: Đại từ làm tân ngữ chỉ về Bết-sa-lê trong câu trước; ‘ông’ là cách xưng gọi tự nhiên, trang trọng.
- source_word: רוּחַ אֱלֹהִים
  choice: Thần của Đức Chúa Trời
  rationale: Trong bối cảnh Đức Chúa Trời ban năng lực để thực hiện công việc thánh, cụm từ này nhiều khả năng chỉ chính Thần của Ngài. Viết hoa ‘Thần’ thể hiện cách hiểu chính, còn chú thích giữ lại khả năng hiểu rộng hơn của cấu trúc Hê-bơ-rơ.
- source_word: בְּחָכְמָה
  choice: cùng sự khôn ngoan
  rationale: Giữ nghĩa căn bản của חָכְמָה là sự khôn ngoan, đồng thời nối tự nhiên với điều được ban cùng Thần của Đức Chúa Trời.
- source_word: בִּתְבוּנָה
  choice: sự thông hiểu
  rationale: ‘Sự thông hiểu’ chuyển tải khả năng hiểu thấu và phân định, đồng thời phân biệt vừa đủ với ‘sự khôn ngoan’ và ‘sự hiểu biết’.
- source_word: וּבְדַעַת
  choice: sự hiểu biết
  rationale: Giữ nghĩa rộng, căn bản của דַּעַת thay vì thu hẹp thành kỹ năng chuyên môn.
- source_word: וּבְכָל מְלָאכָה
  choice: và đủ mọi tài nghệ
  rationale: Trong bối cảnh chế tác Đền Tạm, מְלָאכָה nói đến công việc và tay nghề. ‘Đủ mọi tài nghệ’ là cách diễn đạt tiếng Việt tự nhiên, bao quát các loại kỹ năng thủ công mà ngữ cảnh đòi hỏi.
theological_decisions:
- issue: רוּחַ אֱלֹהִים nên được hiểu là chính Thần của Đức Chúa Trời hay theo nghĩa chung hơn
  choice: Thần của Đức Chúa Trời
  alternative: thần khí của Đức Chúa Trời; một thần khí đến từ Đức Chúa Trời
  rationale: Bối cảnh trực tiếp nói về sự trang bị từ Đức Chúa Trời cho công việc thánh, nên cách hiểu chỉ chính Thần của Ngài là hợp lý nhất. Tuy vậy, cấu trúc Hê-bơ-rơ không có mạo từ và có thể được hiểu rộng hơn, vì thế các khả năng ấy được ghi trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. ‘Đầy tràn’ giữ hình ảnh của động từ Hê-bơ-rơ; ‘đủ mọi tài nghệ’ diễn đạt tự nhiên bối cảnh tay nghề chế tác mà không giới hạn quá mức phạm vi của מְלָאכָה.
