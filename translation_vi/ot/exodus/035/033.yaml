  terminology: Các thuật ngữ “chạm khắc,” “khảm,” “chạm trổ,” và “tinh xảo” thích hợp với ngữ cảnh nghề thủ công. Chú thích được neo đúng sau “tinh xảo” và bảo lưu hợp lý các sắc thái “theo thiết kế” và “mỹ nghệ” của מַחֲשָׁבֶת.
