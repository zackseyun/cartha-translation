  source_fidelity: Bản dịch phản ánh đúng cấu trúc phụ thuộc của câu trong mạch văn về các kỹ năng thủ công được ban cho Bết-sa-lê-ên. “Chạm khắc đá để khảm” diễn đạt phù hợp חֲרֹשֶׁת אֶבֶן לְמַלֹּאת trong ngữ cảnh chế tác và gắn đá; “chạm trổ gỗ” phản ánh vế song song với עֵץ. “Mọi loại công việc tinh xảo” truyền đạt tốt ý bao quát của בְּכָל מְלֶאכֶת מַחֲשָׁבֶת mà không thu hẹp nghĩa vào một kỹ thuật riêng.
