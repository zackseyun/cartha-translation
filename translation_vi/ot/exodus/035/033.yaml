  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
translation:
  language: vi
  text: biết chạm khắc đá để khảm, biết chạm trổ gỗ, và thực hiện mọi loại công việc tinh xảo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi loại công việc theo thiết kế” hoặc “mọi loại công việc mỹ nghệ.” Từ Hê-bơ-rơ hàm ý công việc được suy tính, thiết kế hoặc thực hiện khéo léo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: biết chạm khắc / biết chạm trổ
  rationale: 'Danh từ חֲרֹשֶׁת chỉ việc gia công thủ công có kỹ năng. Bản dịch biến đổi nhẹ theo vật liệu: “chạm khắc” với đá và “chạm trổ” với gỗ, đồng thời giữ sự song hành của cùng một từ Hê-bơ-rơ.'
- source_word: אֶבֶן
  choice: đá
  rationale: Từ này chỉ đá như vật liệu trong ngữ cảnh nghề thủ công; tiếng Việt tự nhiên dùng danh từ khối “đá” mà không cần chuyển sang số nhiều.
- source_word: לְמַלֹּאת
  choice: để khảm
  rationale: Trong ngữ cảnh chế tác Đền Tạm, động từ này nói đến việc gắn đá vào chỗ đã định. “Khảm” diễn đạt gọn và tự nhiên thao tác đặt đá vào vật mang, thay vì nghĩa thông thường “làm đầy”.
- source_word: עֵץ
  choice: gỗ
  rationale: Danh từ chỉ vật liệu gỗ ở đây, không phải cây đang sống.
- source_word: לַעֲשׂוֹת
  choice: thực hiện
  rationale: Động từ עשה có nghĩa rộng; “thực hiện” kết hợp tự nhiên với “công việc” và giữ được ý làm nên các tác phẩm thủ công.
- source_word: בְּכָל מְלֶאכֶת
  choice: mọi loại công việc
  rationale: Cụm từ có ý bao quát toàn bộ các dạng công việc thủ công; cách diễn đạt này rõ ràng trong tiếng Việt hiện đại.
- source_word: מַחֲשָׁבֶת
  choice: tinh xảo
  rationale: Từ này có thể chỉ công việc được suy tính, thiết kế và thực hiện bằng kỹ năng. “Tinh xảo” tự nhiên trong ngữ cảnh nghệ nhân, còn chú thích giữ lại các sắc thái thiết kế và dụng tâm.
