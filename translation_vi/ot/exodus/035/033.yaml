translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu tiếp nối ngữ pháp từ câu trước nên giữ cấu trúc liệt kê các năng lực của người thợ. Dùng các thuật ngữ thủ công quen thuộc “chạm khắc,” “khảm,” và “chạm trổ”; dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
