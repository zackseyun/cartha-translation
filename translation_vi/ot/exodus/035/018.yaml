  language: vi
  text: các cọc của Đền Tạm, các cọc của sân và các dây thừng[a] của chúng—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: các dây chão.'
    reason: Giữ một cách dịch khả dĩ khác của מֵיתָר; “dây chão” diễn tả loại dây chắc dùng để chằng giữ nhưng ít thông dụng hơn trong tiếng Việt hiện đại.
lexical_decisions:
- source_word: יִתְדֹת
  choice: các cọc
  rationale: Chỉ những cọc dùng để cố định Đền Tạm và các màn bao quanh sân. “Cọc” ngắn gọn, tự nhiên và không thêm ý ngoài nguyên văn.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ quen thuộc trong tiếng Việt dành cho nơi ngự thánh lưu động của Đức Chúa Trời trong sách Xuất Hành, đồng thời giữ được sắc thái chuyên biệt của מִשְׁכָּן.
- source_word: הֶחָצֵר
  choice: sân
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ khu sân có màn vây quanh. “Sân” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: מֵיתְרֵיהֶם
  choice: các dây thừng của chúng
  rationale: מֵיתָר chỉ dây dùng để chằng hoặc cố định cấu trúc. “Dây thừng” dễ hiểu; đại từ sở hữu số nhiều được giữ lại bằng “của chúng” để không tự ý xác định lại đối tượng mà hậu tố Hebrew quy chiếu tới.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: các cọc ... các cọc ... và các dây thừng
  rationale: Các dấu chỉ tân ngữ lặp lại tạo thành một danh sách kiểm kê; tiếng Việt không dịch אֶת nhưng giữ cấu trúc liệt kê phối hợp.
