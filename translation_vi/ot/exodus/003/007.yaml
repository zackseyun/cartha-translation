source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: vi
  text: 'Rồi Yahweh phán: “Ta đã thật sự thấy[a] cảnh khốn khổ của dân Ta ở Ai Cập, và Ta đã nghe tiếng kêu than của họ[b] vì những kẻ áp bức họ[c], bởi Ta biết những nỗi đau của họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng nguyên thể tuyệt đối với động từ hữu hạn để nhấn mạnh; cũng có thể dịch: “Ta quả thật đã thấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tiếng họ kêu cứu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “những kẻ đốc công của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu, để bảo tồn cách gọi trong nguyên văn.
- source_word: רָאֹה רָאִיתִי
  choice: Ta đã thật sự thấy
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn có tác dụng nhấn mạnh; “thật sự” chuyển tải sắc thái ấy một cách tự nhiên trong tiếng Việt.
- source_word: עֳנִי
  choice: cảnh khốn khổ
  rationale: Danh từ chỉ tình trạng khổ sở do hoàn cảnh hà khắc; cách dịch này bao quát cả đau khổ lẫn sự áp bức.
- source_word: עַמִּי
  choice: dân Ta
  rationale: Cách diễn đạt tự nhiên, trang trọng cho danh xưng mang quan hệ giao ước “dân của Ta”.
- source_word: אֲשֶׁר בְּמִצְרָיִם
  choice: ở Ai Cập
  rationale: Cụm từ bổ nghĩa cho “dân Ta”; tiếng Việt không cần thêm đại từ quan hệ mà vẫn rõ nghĩa.
- source_word: צַעֲקָתָם
  choice: tiếng họ kêu than
  rationale: Diễn tả tiếng kêu bật ra trong cảnh khốn cùng; tự nhiên và giàu sức gợi trong tiếng Việt hiện đại.
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: vì những kẻ áp bức họ
  rationale: נֹגֵשׂ chỉ người thúc ép hoặc cưỡng bức lao dịch; מִפְּנֵי ở đây hợp lý nhất khi hiểu theo quan hệ nguyên nhân.
- source_word: כִּי
  choice: bởi
  rationale: Giữ mối liên hệ giải thích, nêu cơ sở cho lời tuyên bố rằng Yahweh đã nghe tiếng dân kêu.
- source_word: יָדַעְתִּי
  choice: Ta biết
  rationale: Dù ở thể hoàn thành trong tiếng Hê-bơ-rơ, động từ tại đây diễn tả sự nhận biết hiện tại, trực tiếp và có tính liên hệ.
- source_word: מַכְאֹבָיו
  choice: những nỗi đau của họ
  rationale: Giữ được hình ảnh cụ thể của đau đớn và dạng số nhiều, đồng thời tự nhiên hơn cách nói trừu tượng.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời YHWH
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ danh riêng trong nguyên văn, không thay bằng tước hiệu hay áp đặt một truyền thống hệ phái.
- issue: Ngôn ngữ nhân hình về sự biết của Đức Chúa Trời
  choice: Ta biết những nỗi đau của họ
  alternative: Ta nhận biết những nỗi đau của họ; Ta đã lưu tâm đến nỗi đau của họ
  rationale: Bảo tồn tính trực tiếp và gần gũi của יָדַעְתִּי, không làm nhẹ thành sự nhận thức trừu tượng cũng không diễn giải thêm thành hành động lưu tâm.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời; câu giữ nhịp song hành “đã thấy… đã nghe…” của nguyên văn và không làm mất sắc thái nhấn mạnh.
