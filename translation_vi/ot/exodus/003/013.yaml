source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: vi
  text: 'Môi-se thưa với Đức Chúa Trời: “Này, khi con đến với người Y-sơ-ra-ên và nói với họ: ‘Đức Chúa Trời của tổ tiên anh em đã sai tôi đến với anh em,’ rồi họ hỏi con: ‘Danh Ngài là gì?’ thì con phải nói gì với họ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: thưa
  rationale: Động từ אָמַר cơ bản là “nói”; trong ngữ cảnh Môi-se nói với Đức Chúa Trời, “thưa” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt mà không thay đổi nội dung.
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ dấu hiệu diễn ngôn dùng để thu hút sự chú ý và giới thiệu tình huống giả định sắp nêu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Diễn đạt tự nhiên ý nghĩa tập thể “các con trai/con cháu Y-sơ-ra-ên”, chỉ dân Y-sơ-ra-ên, đồng thời tránh khiến độc giả hiểu là chỉ nam giới.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: Đức Chúa Trời của tổ tiên anh em
  rationale: “Tổ tiên” truyền đạt số nhiều אֲבוֹתֵיכֶם tự nhiên hơn “các cha”, và giữ quan hệ giao ước lịch sử được nêu trong nguyên văn.
- source_word: מַה שְּׁמוֹ
  choice: Danh Ngài là gì?
  rationale: “Danh” phù hợp văn phong Kinh Thánh trang trọng và giữ trọng lượng của שֵׁם trong mạch văn; “Ngài” là đại từ tôn kính tự nhiên khi nói về Đức Chúa Trời.
- source_word: מָה אֹמַר אֲלֵהֶם
  choice: thì con sẽ nói với họ thế nào?
  rationale: Trong tiếng Việt, “nói thế nào” diễn đạt tự nhiên câu hỏi về nội dung câu trả lời; thì tương lai phản ánh dạng chưa hoàn thành אֹמַר trong tình huống dự kiến.
theological_decisions:
- issue: Ý nghĩa của câu hỏi về danh Đức Chúa Trời
  choice: Giữ nguyên câu hỏi trực tiếp “Danh Ngài là gì?”
  alternative: Diễn giải thành “Ngài là Đức Chúa Trời nào?” hoặc giải thích bản tính của Ngài
  rationale: Câu này chỉ ghi lời Môi-se dự liệu dân chúng sẽ hỏi; không nên đưa trước lời đáp hay âm thầm quyết định câu hỏi nhắm đến danh xưng, căn tính hoặc bản tính theo một hệ thần học riêng.
- issue: Cách gọi אֱלֹהִים
  choice: Đức Chúa Trời
  alternative: Thiên Chúa hoặc Đức Chúa
  rationale: “Đức Chúa Trời” là cách gọi trang trọng, phổ thông trong truyền thống Kinh Thánh tiếng Việt và không đồng nhất אֱלֹהִים với danh giao ước sẽ được trình bày ở câu kế tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lời nói lồng trong lời nói, nhưng điều chỉnh trật tự câu cho tự nhiên trong tiếng Việt. Dùng “con” khi Môi-se thưa với Đức Chúa Trời và “anh em” khi ông dự kiến nói với cộng đồng Y-sơ-ra-ên.
