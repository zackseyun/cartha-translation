  to: 'Môi-se thưa với Đức Chúa Trời: “Này, khi con đến với người Y-sơ-ra-ên và nói với họ: ‘Đức Chúa Trời của tổ tiên anh em đã sai tôi đến với anh em,’ rồi họ hỏi con: ‘Danh Ngài là gì?’ thì con phải nói gì với họ?”'
  rationale: Chỉnh nhẹ để câu hỏi cuối phản ánh chính xác câu hỏi về nội dung lời đáp trong tiếng Hê-bơ-rơ, và dùng cách gọi hiện đại, trung tính hơn cho בְּנֵי יִשְׂרָאֵל. Không thêm diễn giải thần học hoặc giải quyết trước ý nghĩa của “Danh”.
