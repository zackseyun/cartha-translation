base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: vi
  text: Mỗi người phụ nữ sẽ xin[a] người phụ nữ láng giềng của mình và người phụ nữ đang ở trong nhà mình[b] những đồ bằng bạc, đồ bằng vàng và quần áo. Các ngươi sẽ đặt những thứ ấy lên con trai và con gái mình. Như vậy, các ngươi sẽ tước sạch Ai Cập.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “yêu cầu”. Theo truyền thống, một số bản dịch dùng “mượn”, nhưng động từ Hê-bơ-rơ căn bản có nghĩa là “hỏi”, “xin” hoặc “yêu cầu”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “người phụ nữ tạm trú” hoặc “người phụ nữ ngoại kiều trong nhà mình”.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn cũng có thể diễn đạt là “cướp lấy của cải” hoặc “vét sạch” Ai Cập.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: sẽ xin
  rationale: Động từ שׁאל trước hết có nghĩa là hỏi, xin hoặc yêu cầu; “xin” tự nhiên trong ngữ cảnh này và không hàm ý phải hoàn trả như “mượn”.
- source_word: אִשָּׁה
  choice: Mỗi người phụ nữ
  rationale: Danh từ số ít không xác định được dùng theo nghĩa phân phối; “mỗi người phụ nữ” truyền đạt rõ lực nghĩa ấy.
- source_word: מִשְּׁכֶנְתָּהּ
  choice: người phụ nữ hàng xóm
  rationale: Dạng từ tiếng Hê-bơ-rơ là giống cái, nên bản dịch giữ rõ rằng người hàng xóm được nói đến là một phụ nữ.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: người phụ nữ đang cư ngụ trong nhà mình
  rationale: Phân từ từ גור chỉ người cư trú, có thể là người tạm trú hay ngoại kiều; cách dịch này giữ ý cư ngụ mà không xác định quá mức tình trạng pháp lý hoặc thời hạn lưu trú.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: những đồ bằng bạc, đồ bằng vàng
  rationale: כְּלִי là từ rộng, có thể chỉ vật dụng, đồ vật hoặc vật chứa; “đồ” tránh thu hẹp thành trang sức hay bình chén.
- source_word: וּשְׂמָלֹת
  choice: quần áo
  rationale: Đây là từ khái quát chỉ y phục; “quần áo” là cách nói hiện đại, rõ nghĩa.
- source_word: וְשַׂמְתֶּם עַל
  choice: sẽ cho ... mang những thứ ấy trên người
  rationale: Cách diễn đạt này chuyển tải tự nhiên hành động đặt các đồ vật và y phục lên con cái, đồng thời không thu hẹp toàn bộ các món đồ thành trang sức hoặc quần áo.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: con trai và con gái mình
  rationale: Giữ nguyên sự phân biệt rõ ràng giữa con trai và con gái trong nguyên văn.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: các ngươi sẽ tước lấy của cải của Ai Cập
  rationale: Dạng Piel của נצל ở đây mang nghĩa tước đoạt, lấy đi của cải. Cách dịch này giữ sức nặng của động từ nhưng diễn đạt tự nhiên hơn “tước đoạt Ai Cập” trong tiếng Việt.
theological_decisions:
- issue: Có nên làm nhẹ ý nghĩa việc dân Y-sơ-ra-ên lấy của cải của người Ai Cập hay không
  choice: tước lấy của cải của Ai Cập
  alternative: mượn đồ của Ai Cập
  rationale: Nguyên văn không trình bày đây như một khoản vay phải hoàn trả; động từ cuối câu diễn tả việc tước lấy hoặc lấy chiến lợi phẩm. Bản dịch vì thế không dùng “mượn” và không làm nhẹ sự đảo ngược hoàn cảnh được câu văn nêu ra.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ số nhiều “các ngươi” giữ sự chuyển đổi của nguyên văn từ chủ thể số ít phân phối (“mỗi người phụ nữ”) sang lời phán với toàn thể cộng đồng. Cụm “mang những thứ ấy trên người” được dùng để bao quát cả đồ bằng kim loại lẫn quần áo mà không biến các đồ vật không xác định thành riêng trang sức.
