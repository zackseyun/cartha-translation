revisions:
- from: Mỗi người phụ nữ sẽ xin[a] người phụ nữ hàng xóm và người phụ nữ đang cư ngụ trong nhà mình[b] những đồ bằng bạc, đồ bằng vàng và quần áo. Các ngươi sẽ cho con trai và con gái mình mang những thứ ấy trên người. Như vậy, các ngươi sẽ tước lấy của cải của Ai Cập.[c]
  to: Mỗi người phụ nữ sẽ xin[a] người phụ nữ láng giềng của mình và người phụ nữ đang ở trong nhà mình[b] những đồ bằng bạc, đồ bằng vàng và quần áo. Các ngươi sẽ đặt những thứ ấy lên con trai và con gái mình. Như vậy, các ngươi sẽ tước sạch Ai Cập.[c]
  rationale: Bản sửa giữ nguyên ý nghĩa và các điểm từ vựng chủ yếu của bản nháp, nhưng làm tự nhiên hơn cách chỉ người láng giềng, dịch sát hơn hành động “đặt ... lên” đối với con trai và con gái, và duy trì tân ngữ trực tiếp “Ai Cập” trong mệnh đề cuối. Các chú thích được giữ nguyên nội dung và neo đúng tại các từ/cụm từ liên quan.
