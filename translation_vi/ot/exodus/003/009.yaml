  to: Và bây giờ, kìa, tiếng kêu than của con cái Israel đã đến với Ta[a]; Ta cũng đã thấy sự áp bức mà người Ai Cập đang gây ra cho họ.
  rationale: Đổi cách dịch chính của בָּאָה אֵלַי thành “đã đến với Ta” để sát nguyên ngữ hơn, đồng thời chuyển “đã thấu đến Ta” xuống chú thích như một khả năng diễn đạt. Thay cấu trúc lặp “áp bức ... áp bức” bằng cách diễn đạt tiếng Việt tự nhiên, nhưng vẫn giữ rõ sự áp bức liên tục do người Ai Cập gây ra.
