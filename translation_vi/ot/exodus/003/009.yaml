language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: vi
  text: Và bây giờ, kìa, tiếng kêu than của con cái Israel đã đến với Ta[a]; Ta cũng đã thấy sự áp bức mà người Ai Cập đang gây ra cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã thấu đến Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Và bây giờ
  rationale: Giữ cả liên từ nối tiếp và trạng từ chỉ thời gian, đồng thời tạo bước chuyển tự nhiên trong lời phán.
- source_word: הִנֵּה
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý của tiểu từ Hê-bơ-rơ bằng một từ trang trọng nhưng vẫn quen thuộc trong tiếng Việt.
- source_word: צַעֲקַת
  choice: tiếng kêu than
  rationale: Diễn đạt tiếng kêu phát sinh từ cảnh khốn cùng; tự nhiên và rõ nghĩa hơn cách dịch đơn thuần là “tiếng kêu”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh gia tộc–giao ước của nguyên ngữ nhưng dùng cách gọi tự nhiên, bao quát trong tiếng Việt.
- source_word: בָּאָה אֵלַי
  choice: đã thấu đến Ta
  rationale: Diễn đạt tự nhiên ý tiếng kêu đã đến tận Đức Chúa Trời; ghi chú bảo lưu cách dịch sát hơn là “đã đến với Ta”.
- source_word: וְגַם
  choice: cũng
  rationale: 'Giữ sắc thái bổ sung: Đức Chúa Trời không những nghe tiếng kêu mà còn thấy sự áp bức.'
- source_word: רָאִיתִי
  choice: đã thấy
  rationale: Thể hoàn thành của động từ được diễn đạt bằng “đã”, phù hợp với hành động đã xảy ra và còn liên hệ trực tiếp đến việc Đức Chúa Trời sắp hành động.
- source_word: הַלַּחַץ
  choice: cảnh áp bức
  rationale: “Áp bức” phù hợp bối cảnh cưỡng ép xã hội; thêm “cảnh” giúp danh ngữ tự nhiên trong tiếng Việt.
- source_word: מִצְרַיִם
  choice: người Ai Cập
  rationale: Trong mệnh đề này, động tính từ số nhiều cho thấy tên gọi “Ai Cập” được dùng theo nghĩa tập thể, chỉ những người đang áp bức Israel.
- source_word: לֹחֲצִים
  choice: đang áp bức
  rationale: “Đang” thể hiện hành động liên tục của động tính từ Hê-bơ-rơ, đồng thời giữ sự lặp từ với danh từ cùng gốc trong nguyên văn.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ làm tân ngữ, quy chiếu về con cái Israel.
theological_decisions:
- issue: Cách dịch danh xưng giao ước בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel; dân Israel
  rationale: “Con cái Israel” bảo tồn ý niệm hậu duệ và cộng đồng giao ước mà không khiến độc giả Việt hiểu lầm rằng chỉ nam giới được nói đến.
- issue: Cách biểu đạt הִנֵּה trong lời Đức Chúa Trời
  choice: kìa
  alternative: này; quả thật
  rationale: “Kìa” giữ lực chỉ xuất và thu hút sự chú ý mà không biến tiểu từ thành một lời xác quyết thần học mạnh hơn nguyên văn.
- issue: Chủ thể tập thể מִצְרַיִם
  choice: người Ai Cập
  alternative: Ai Cập
  rationale: Động tính từ số nhiều לֹחֲצִים hỗ trợ cách hiểu là người Ai Cập; cách dịch này làm rõ tác nhân mà không giới hạn vào một cá nhân hay một tầng lớp cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp lời Đức Chúa Trời tự xưng. Giữ phép lặp “áp bức… áp bức” để phản ánh danh từ và động từ cùng gốc trong nguyên văn, dù cấu trúc này hơi nhấn mạnh hơn văn xuôi thông thường.
