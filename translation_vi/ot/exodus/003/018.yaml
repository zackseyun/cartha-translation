  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: vi
  text: 'Họ sẽ nghe theo lời con[a]. Rồi con cùng các trưởng lão Y-sơ-ra-ên sẽ đến gặp vua Ai Cập và nói với vua: ‘Yahweh, Đức Chúa Trời của người Hê-bơ-rơ, đã gặp chúng tôi. Vậy bây giờ, xin cho chúng tôi đi ba ngày đường vào hoang mạc để dâng sinh tế lên Yahweh, Đức Chúa Trời của chúng tôi.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ sẽ nghe tiếng con.” Cụm từ Hê-bơ-rơ có thể nói đến việc nghe tiếng nói, lắng nghe hoặc làm theo lời người nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: Họ sẽ nghe theo lời con
  rationale: שׁמע với לְקוֹל diễn tả việc lắng nghe và hưởng ứng. “Nghe theo lời” là thành ngữ Việt tự nhiên, giữ cả ý tiếp nhận lời nói lẫn đáp ứng, nhưng không đẩy nghĩa thành sự vâng phục tuyệt đối.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: Rồi con cùng các trưởng lão Y-sơ-ra-ên sẽ đến gặp
  rationale: Dạng động từ số ít được nối với chủ thể phối hợp “con và các trưởng lão.” Tiếng Việt dùng “con cùng…” tự nhiên; thêm “gặp” trước vua làm rõ đích đến theo ngữ cảnh mà không đổi nội dung.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: vua Ai Cập
  rationale: Cách diễn đạt ngắn gọn, tự nhiên và sát cấu trúc sở thuộc Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: Đức Chúa Trời của người Hê-bơ-rơ
  rationale: Giữ nguyên danh xưng dân tộc và quan hệ sở thuộc của nguyên văn.
- source_word: נִקְרָה עָלֵינוּ
  choice: đã gặp chúng tôi
  rationale: Niphal của קרא đi với עַל tại đây chỉ một cuộc gặp hay sự hiện đến. “Đã gặp chúng tôi” rõ ràng, tự nhiên và không thu hẹp nghĩa thành “đã gọi”.
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Thể hiện sự chuyển tiếp từ lời tuyên bố sang lời thỉnh cầu; “vậy” làm rõ mối liên hệ diễn ngôn tự nhiên trong tiếng Việt.
- source_word: נֵלֲכָה נָּא
  choice: xin cho chúng tôi đi
  rationale: Cohortative kèm נָא mang sắc thái thỉnh cầu lịch sự với vua Ai Cập; “xin cho” truyền đạt đúng lực ngôn trung.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: ba ngày đường
  rationale: Thành ngữ Việt gọn và tự nhiên, diễn tả quãng đường hoặc hành trình kéo dài ba ngày như tiếng Hê-bơ-rơ.
- source_word: בַּמִּדְבָּר
  choice: vào hoang mạc
  rationale: Động từ chuyển động khiến hướng “vào” là tự nhiên. “Hoang mạc” bao quát vùng hoang vu hơn “sa mạc,” vốn dễ gợi riêng vùng toàn cát.
- source_word: וְנִזְבְּחָה לַיהוָה
  choice: để dâng sinh tế lên Yahweh
  rationale: Cohortative thứ hai nêu mục đích của chuyến đi. “Dâng sinh tế” thể hiện hành động tế lễ rõ hơn từ chung “hy sinh” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng יהוה. Giữ “Yahweh” phân biệt danh riêng với các tước hiệu và tránh thay thế bằng một truyền thống xưng hô riêng.
- issue: Ý nghĩa của נִקְרָה עָלֵינוּ trong ngôn ngữ về cuộc gặp thần linh
  choice: đã gặp chúng tôi
  alternative: đã hiện đến với chúng tôi / đã gọi chúng tôi
  rationale: Cụm từ cho biết Yahweh đã gặp hoặc đến với họ, nhưng không nhất thiết xác định riêng đó là một sự hiện ra hữu hình hay một lời triệu gọi. Bản dịch giữ độ rộng nghĩa ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “con” cho lời Đức Chúa Trời nói với Môi-se theo quan hệ ngữ cảnh; dùng “vua” ở lần quy chiếu thứ hai để tránh đại từ có thể thiếu trang trọng. Các tên dân tộc được phiên âm theo lối quen thuộc trong tiếng Việt; danh יהוה được giữ là “Yahweh.”
