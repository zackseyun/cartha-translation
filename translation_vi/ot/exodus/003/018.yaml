  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của nguyên văn: các trưởng lão sẽ nghe theo lời Môi-se; Môi-se và các trưởng lão sẽ đến với vua Ai Cập; họ sẽ nói rằng Yahweh, Đức Chúa Trời của người Hê-bơ-rơ, đã gặp họ; rồi xin được đi ba ngày đường vào hoang mạc để dâng sinh tế cho Yahweh. “Nghe theo lời con” diễn đạt tốt שׁמע לְקוֹל trong ngữ cảnh này mà không cần khẳng định mạnh hơn là sự vâng phục tuyệt đối. “Đã gặp chúng tôi” giữ được độ mở phù hợp của נִקְרָה עָלֵינוּ.'
  naturalness: Văn phong hiện đại, trang trọng và tự nhiên. Cách dùng “con” phù hợp với lời Yahweh phán cùng Môi-se trong ngữ cảnh gần. “Ba ngày đường,” “vào hoang mạc,” và “dâng sinh tế lên” đều là những cách nói Việt ngữ rõ ràng, phù hợp văn cảnh Kinh Thánh.
  terminology: Tên Yahweh được giữ nhất quán theo quyết định dịch thuật. “Đức Chúa Trời,” “người Hê-bơ-rơ,” “trưởng lão,” và “sinh tế” đều phù hợp với thuật ngữ Kinh Thánh tiếng Việt hiện đại. Chú thích [a] được gắn đúng vào cụm tương ứng với לְקֹלֶךָ và phản ánh các khả năng nghĩa liên quan.
