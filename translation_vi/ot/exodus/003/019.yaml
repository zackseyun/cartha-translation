source:
  edition: WLC
  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: vi
  text: Nhưng Ta biết vua Ai Cập sẽ không để các ngươi đi[a], trừ khi bị một bàn tay mạnh mẽ ép buộc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vua Ai Cập sẽ không để các ngươi đi, ngay cả khi có một bàn tay mạnh mẽ,” hoặc: “ngoại trừ bởi một bàn tay quyền năng.” Mệnh đề Hê-bơ-rơ được tỉnh lược; trong mạch văn, nó có thể nhấn mạnh rằng chỉ sức mạnh áp đảo mới khiến Pha-ra-ôn nhượng bộ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Nhưng Ta
  rationale: Liên từ cùng đại từ độc lập tạo sự chuyển ý có tính đối lập và nhấn mạnh; “Nhưng Ta” tự nhiên trong tiếng Việt và giữ được trọng tâm đặt nơi lời Đức Chúa Trời.
- source_word: יָדַעְתִּי
  choice: biết
  rationale: Dạng hoàn thành diễn tả sự hiểu biết chắc chắn, đã xác lập của Đức Chúa Trời; hiện tại “biết” phù hợp nhất với ngữ cảnh tiếng Việt.
- source_word: כִּי
  choice: rằng (được lược bỏ tự nhiên)
  rationale: Từ này dẫn nội dung của điều được biết. Tiếng Việt có thể lược “rằng” sau “biết” mà ý nghĩa vẫn rõ và câu văn tự nhiên hơn.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: sẽ không để các ngươi đi
  rationale: נתן đi với động từ nguyên mẫu ở đây mang nghĩa cho phép. Cách dịch này vừa gần nguyên văn vừa tự nhiên.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: vua Ai Cập
  rationale: Cách chuyển trực tiếp, rõ ràng và tự nhiên của cụm liên kết Hê-bơ-rơ.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: trừ khi bị một bàn tay mạnh mẽ buộc phải làm vậy
  rationale: Mệnh đề Hê-bơ-rơ tỉnh lược. Cách dịch này làm rõ ý công cụ và sự cưỡng buộc được ngữ cảnh câu 20 hỗ trợ, đồng thời giữ hình ảnh quan trọng “bàn tay mạnh mẽ”.
theological_decisions:
- issue: Cách hiểu mệnh đề tỉnh lược וְלֹא בְּיָד חֲזָקָה
  choice: Pha-ra-ôn sẽ không cho dân đi trừ khi bị một bàn tay mạnh mẽ buộc phải làm vậy.
  alternative: 'Pha-ra-ôn sẽ không cho dân đi, ngay cả bởi một bàn tay mạnh mẽ; hoặc: ngoại trừ bởi một bàn tay quyền năng.'
  rationale: Cú pháp Hê-bơ-rơ được rút gọn và có thể hiểu theo hơn một cách. Câu 20 nói Đức Chúa Trời sẽ giơ tay đánh Ai Cập bằng các phép lạ, nên cách hiểu về sức mạnh áp đảo buộc vua phải nhượng bộ phù hợp với mạch văn; chú thích vẫn bảo lưu các khả năng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để phản ánh lời phán trực tiếp của Đức Chúa Trời với Môi-se và số nhiều của אֶתְכֶם. Giữ hình ảnh “bàn tay mạnh mẽ,” một mô-típ nổi bật trong sách Xuất Hành.
