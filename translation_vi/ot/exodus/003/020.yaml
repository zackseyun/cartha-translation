  text: וְ/שָׁלַחְתִּ֤י אֶת יָדִ/י֙ וְ/הִכֵּיתִ֣י אֶת מִצְרַ֔יִם בְּ/כֹל֙ נִפְלְאֹתַ֔/י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּ/קִרְבּ֑/וֹ וְ/אַחֲרֵי כֵ֖ן יְשַׁלַּ֥ח אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: vi
  text: Ta sẽ vươn tay Ta ra[a] và đánh Ai Cập bằng mọi việc kỳ diệu của Ta mà Ta sẽ làm giữa xứ ấy. Sau đó, ông ấy sẽ cho các con ra đi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát chữ: “Ta sẽ đưa tay Ta ra.” Đây là thành ngữ Hê-bơ-rơ chỉ việc đưa tay ra để hành động hoặc thi thố quyền năng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “ông ấy sẽ sai các con đi.” Động từ Hê-bơ-rơ sát nghĩa là “sai đi”; trong ngữ cảnh này, nó hàm ý cho phép các con rời đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: Ta sẽ giơ tay ra
  rationale: Cụm Hê-bơ-rơ dùng động từ שׁלח, nghĩa cơ bản là “sai, đưa ra”, trong thành ngữ chỉ việc đưa tay ra để hành động hoặc thi thố quyền năng. “Giơ tay ra” giữ hình ảnh cụ thể và tự nhiên trong tiếng Việt.
- source_word: וְהִכֵּיתִי
  choice: và đánh
  rationale: נכה có nghĩa rộng là “đánh, giáng đòn”. “Đánh” phù hợp với các tai họa sắp xảy đến mà không hàm ý quá mức rằng toàn thể người Ai Cập đều bị giết.
- source_word: מִצְרַיִם
  choice: Ai Cập
  rationale: Danh từ riêng chỉ Ai Cập như một xứ và một thực thể tập thể; bản văn không chỉ nói riêng đến từng người Ai Cập.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: bằng mọi việc kỳ diệu của Ta
  rationale: נִפְלָאוֹת chỉ những hành động phi thường gây kinh ngạc. “Những việc kỳ diệu” rõ nghĩa, trang trọng và không áp đặt một thuật ngữ thần học hẹp hơn.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: mà Ta sẽ thực hiện
  rationale: Diễn đạt tự nhiên mệnh đề quan hệ của nguyên văn; “thực hiện” thích hợp khi nói về các việc kỳ diệu.
- source_word: בְּקִרְבּוֹ
  choice: giữa xứ ấy
  rationale: Hậu tố số ít quy chiếu tự nhiên về Ai Cập. “Giữa xứ ấy” giữ ý các việc xảy ra ngay bên trong Ai Cập và tránh chuyển sang đại từ số nhiều.
- source_word: וְאַחֲרֵי כֵן
  choice: Sau đó
  rationale: Thể hiện rõ trình tự thời gian bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: ông ta sẽ để các con ra đi
  rationale: Chủ ngữ ngầm là Pha-ra-ôn theo ngữ cảnh. Trong ngữ cảnh này, שׁלח mang nghĩa cho đi, thả đi hoặc sai đi khỏi; “để các con ra đi” truyền đạt tự nhiên ý được phóng thích mà không thêm ý hộ tống.
theological_decisions:
- issue: Ngôn ngữ nhân hình về hành động của Đức Chúa Trời
  choice: Giữ hình ảnh “giơ tay ra”
  alternative: Diễn giải trừu tượng là “thi thố quyền năng”
  rationale: Nguyên văn dùng hình ảnh thân thể cụ thể để mô tả sự can thiệp của Đức Chúa Trời. Giữ hình ảnh này tôn trọng cách diễn đạt của bản văn và không buộc người đọc theo một lối giải thích thần học riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ta/các con” phù hợp lời Đức Chúa Trời phán với Môi-se; “ông ta” chỉ Pha-ra-ôn theo ngữ cảnh mà không đưa tên riêng vào câu. Các hình ảnh và quan hệ số ít của nguyên văn được giữ khi tiếng Việt cho phép.
