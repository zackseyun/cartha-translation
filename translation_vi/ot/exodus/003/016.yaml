source:
  edition: WLC
  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: vi
  text: 'Hãy đi triệu tập các trưởng lão của Israel và nói với họ: ‘Yahweh, Đức Chúa Trời của tổ phụ các ngươi—Đức Chúa Trời của Áp-ra-ham, Y-sác và Gia-cốp—đã hiện ra với ta và phán: “Ta thật đã đoái đến[a] các ngươi và những điều các ngươi đã phải chịu tại Ai Cập.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta thật đã thăm viếng các ngươi” hoặc “Ta thật đã lưu tâm đến các ngươi.” Trong tiếng Hê-bơ-rơ, động từ được lặp theo một cấu trúc nhấn mạnh, nói đến việc Đức Chúa Trời đặc biệt đoái đến để hành động, chứ không chỉ là một cuộc thăm viếng thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Hãy đi
  rationale: Mệnh lệnh trực tiếp ở ngôi thứ hai số ít; “Hãy đi” tự nhiên và giữ sắc thái sai phái.
- source_word: וְאָסַפְתָּ אֶת זִקְנֵי יִשְׂרָאֵל
  choice: triệu tập các trưởng lão của Israel
  rationale: אָסף ở đây chỉ việc tập hợp những người lãnh đạo cộng đồng. “Triệu tập” phù hợp với bối cảnh chính thức hơn “tập hợp”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Đức Chúa Trời của tổ phụ các ngươi
  rationale: “Tổ phụ” giữ được sắc thái phụ hệ, và mệnh đề kế tiếp xác định cụ thể là Áp-ra-ham, Y-sác và Gia-cốp.
- source_word: נִרְאָה אֵלַי
  choice: đã hiện ra với ta
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho thể Niphal của ראה khi nói về sự hiện ra của Đức Chúa Trời.
- source_word: פָּקֹד פָּקַדְתִּי
  choice: Ta thật đã đoái đến các ngươi
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động. “Đoái đến” diễn tả sự lưu tâm có chủ đích, hướng tới can thiệp, mà không giản lược thành chỉ nhìn thấy.
- source_word: וְאֶת הֶעָשׂוּי לָכֶם
  choice: và những gì người ta đã làm cho các ngươi
  rationale: Giữ trọng tâm nơi sự đối xử mà Israel phải chịu; “người ta” là cách diễn đạt bị động tự nhiên trong tiếng Việt nhưng không xác định thêm tác nhân cụ thể.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Cách dịch אֲבֹתֵיכֶם
  choice: tổ phụ các ngươi
  alternative: tổ tiên các ngươi
  rationale: Ngữ cảnh lập tức nêu Áp-ra-ham, Y-sác và Gia-cốp, nên “tổ phụ” giữ chính xác nét quy chiếu đến các vị tổ phụ giao ước.
- issue: Sắc thái của פקד
  choice: đoái đến
  alternative: thăm viếng; lưu tâm đến
  rationale: Trong ngữ cảnh này, động từ hàm ý sự chú ý quyết định của Đức Chúa Trời dẫn đến hành động giải cứu. “Đoái đến” giữ được chiều kích quan tâm và can thiệp mà không biến nó thành một cuộc thăm viếng thông thường.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “các ngươi/ta” để phân biệt rõ lời phán trong bối cảnh cổ đại; giữ tên “Yahweh” và các dạng tên riêng quen thuộc trong tiếng Việt. Dấu chú thích [a] đặt ngay sau cụm từ cần giải thích; [b] bổ sung thông tin về số nhiều của đại từ.
