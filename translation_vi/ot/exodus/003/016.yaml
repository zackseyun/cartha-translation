  terminology: “Yahweh”, “Đức Chúa Trời”, “tổ phụ”, “trưởng lão”, cùng các tên Áp-ra-ham, Y-sác và Gia-cốp nhất quán với bản thảo và phù hợp văn phong Việt ngữ Kinh Thánh. “Đoái đến” là lựa chọn an toàn cho פקד trong ngữ cảnh này, với chú thích giải thích sắc thái can thiệp.
