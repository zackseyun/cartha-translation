language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֥רְא יְהוָ֖ה כִּ֣י סָ֣ר לִ/רְא֑וֹת וַ/יִּקְרָא֩ אֵלָ֨י/ו אֱלֹהִ֜ים מִ/תּ֣וֹךְ הַ/סְּנֶ֗ה וַ/יֹּ֛אמֶר מֹשֶׁ֥ה מֹשֶׁ֖ה וַ/יֹּ֥אמֶר הִנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: vi
  text: 'Khi Yahweh thấy ông rẽ sang để xem, Đức Chúa Trời gọi ông từ giữa bụi cây[a] và phán: “Môi-se! Môi-se!” Ông đáp: “Tôi đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bụi gai”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng cách phiên âm danh YHWH, thay vì thay bằng một tước hiệu.
- source_word: וַיַּרְא ... כִּי
  choice: Khi ... thấy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt vừa giữ diễn tiến thời gian vừa giới thiệu điều Yahweh nhìn thấy.
- source_word: סָר לִרְאוֹת
  choice: rẽ sang để xem
  rationale: סוּר diễn tả việc đổi hướng hoặc rẽ khỏi đường đang đi; động từ nguyên mẫu לִרְאוֹת nêu mục đích.
- source_word: וַיִּקְרָא אֵלָיו
  choice: gọi ông
  rationale: Diễn đạt tự nhiên hành động gọi hướng đến Môi-se mà không thêm sắc thái không có trong nguyên văn.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Giữ sự phân biệt trong nguyên văn giữa danh riêng יְהוָה và danh xưng אֱלֹהִים.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: từ giữa bụi cây
  rationale: Giữ hình ảnh không gian của מִתּוֹךְ; 'bụi cây' là cách gọi rõ ràng, còn khả năng cụ thể là bụi gai được ghi ở chú thích.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: Môi-se! Môi-se!
  rationale: Lặp lại tên theo nguyên văn, dùng dấu câu tự nhiên trong tiếng Việt để thể hiện lời gọi trực tiếp và khẩn thiết.
- source_word: הִנֵּנִי
  choice: Có con đây
  rationale: Đây là lời đáp tự nhiên của người dưới đối với Đức Chúa Trời trong tiếng Việt, diễn tả sự hiện diện và sẵn sàng mà không diễn giải quá mức.
theological_decisions:
- issue: 'Hai cách gọi Đức Chúa Trời trong cùng một câu: יְהוָה và אֱלֹהִים'
  choice: Dịch lần lượt là “Yahweh” và “Đức Chúa Trời”.
  alternative: Dùng “Đức Chúa Trời” cho cả hai, hoặc thay יְהוָה bằng “CHÚA”.
  rationale: Nguyên văn cố ý dùng hai cách gọi sát nhau; giữ sự phân biệt giúp bản dịch minh bạch hơn và không làm mất danh riêng.
- issue: Chủ thể của וַיֹּאמֶר cuối câu
  choice: Dùng “Ông thưa”, chỉ Môi-se.
  alternative: 'Lặp rõ tên: “Môi-se thưa”.'
  rationale: Ngữ cảnh lời gọi “Môi-se! Môi-se!” khiến người đáp được xác định rõ; “thưa” cũng phù hợp quan hệ của Môi-se với Đấng đang gọi mà không thêm nội dung vào lời đáp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời và “thưa” cho lời đáp của Môi-se; giữ tên riêng Yahweh và dạng tên tiếng Việt quen dùng “Môi-se”.
