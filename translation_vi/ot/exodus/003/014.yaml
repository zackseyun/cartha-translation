revisions:
- from: 'Đức Chúa Trời phán với Môi-se: “TA LÀ ĐẤNG TA LÀ.”[a] Rồi Ngài phán: “Con hãy nói với con dân Israel thế này: ‘TA LÀ đã sai tôi đến với anh em.’”[b]'
  to: 'Đức Chúa Trời phán với Môi-se: “TA LÀ ĐẤNG TA LÀ.”[a] Rồi Ngài phán: “Hãy nói với con dân Israel[b] thế này: ‘TA LÀ’ đã sai tôi đến với anh em.”'
  rationale: Bản sửa bỏ đại từ “con” được thêm vào ngoài nguyên ngữ, chuyển neo chú thích b đến đúng cụm từ được giải thích, và dùng dấu nháy để nhận diện rõ “TA LÀ” ở lần lặp lại như một danh xưng. Các lựa chọn chính về tên Đức Chúa Trời, sắc thái tự xưng, thì của động từ và tính bao quát cộng đồng của “con dân Israel” được giữ nguyên.
