  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: vi
  text: 'Đức Chúa Trời phán với Môi-se: “TA LÀ ĐẤNG TA LÀ.”[a] Rồi Ngài phán: “Hãy nói với con dân Israel[b] thế này: ‘TA LÀ’ đã sai tôi đến với anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “TA SẼ LÀ ĐẤNG TA SẼ LÀ,” hoặc “TA SẼ LÀ ĐIỀU TA SẼ LÀ.” Động từ Hê-bơ-rơ ở đây có thể mang sắc thái tương lai cũng như hiện tại; từ nối cũng có thể chỉ “đấng/người” hoặc “điều.”'
    reason: alternative_reading
  - marker: b
    text: “Con dân Israel” dịch một thành ngữ Hê-bơ-rơ có nghĩa đen là “các con trai của Israel”, dùng để chỉ cộng đồng hậu duệ Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, danh từ có hình thức số nhiều nhưng chỉ Đức Chúa Trời của Israel; cách dịch này rõ nghĩa, trang trọng và quen thuộc trong tiếng Việt.
- source_word: אֶהְיֶה
  choice: TA LÀ
  rationale: Động từ Qal chưa hoàn thành ngôi thứ nhất số ít của היה có thể mang sắc thái hiện tại hoặc tương lai. Trong câu này, nó vừa là lời tự bày tỏ vừa được lặp lại như một danh xưng, nên “TA LÀ” truyền đạt tốt chức năng tự xưng; khả năng chỉ tương lai được giữ trong chú thích.
- source_word: אֲשֶׁר
  choice: ĐẤNG
  rationale: Trong công thức tự quy chiếu về một chủ thể có ngôi vị, “Đấng” tạo thành câu tiếng Việt tự nhiên và trang trọng. Tuy nhiên, אֲשֶׁר cũng có thể mang nghĩa rộng hơn như “điều gì,” nên sự mơ hồ ấy được nêu trong chú thích.
- source_word: כֹּה
  choice: thế này
  rationale: Cụm này tự nhiên trong tiếng Việt hiện đại khi dẫn vào lời phải truyền đạt, đồng thời giữ lực chỉ thị của công thức phát ngôn.
- source_word: תֹאמַר
  choice: Con hãy nói
  rationale: Dạng chưa hoàn thành ngôi thứ hai số ít có lực mệnh lệnh trong ngữ cảnh. “Hãy nói” diễn đạt rõ chỉ thị, còn “con” xác định người nghe là Môi-se theo lối xưng hô tự nhiên.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: với con dân Israel
  rationale: “Con dân Israel” giữ được ý niệm hậu duệ/con cái trong בְּנֵי, đồng thời chỉ toàn cộng đồng Israel một cách tự nhiên hơn lối dịch máy móc “các con trai của Israel.”
- source_word: שְׁלָחַנִי
  choice: đã sai tôi
  rationale: Động từ hoàn thành ngôi thứ ba số ít kèm hậu tố ngôi thứ nhất diễn tả việc sai phái đã được thực hiện; “đã sai tôi” là cách nói trực tiếp và tự nhiên.
- source_word: וַיֹּאמֶר
  choice: phán / rồi Ngài phán
  rationale: Động từ nối tiếp thúc đẩy mạch kể. “Phán” phù hợp khi chủ thể là Đức Chúa Trời; lần thứ hai thêm “rồi” để phản ánh sự tiếp nối mà không lặp câu nặng nề.
theological_decisions:
- issue: Cách dịch danh xưng tự bày tỏ אֶהְיֶה אֲשֶׁר אֶהְיֶה
  choice: TA LÀ ĐẤNG TA LÀ
  alternative: TA SẼ LÀ ĐẤNG TA SẼ LÀ; TA SẼ LÀ ĐIỀU TA SẼ LÀ
  rationale: Dạng động từ Hê-bơ-rơ cho phép cả sắc thái hiện tại lẫn tương lai. Bản chính dùng cách hiểu hiện tại vì cụm từ hoạt động như lời tự xưng và ngay sau đó אֶהְיֶה được dùng như một danh xưng; chú thích giữ lại sắc thái tương lai và độ mở của אֲשֶׁר.
- issue: Viết hoa danh xưng “TA LÀ”
  choice: Viết hoa toàn bộ “TA LÀ”
  alternative: Ta là; Ta sẽ là
  rationale: Việc viết hoa giúp người đọc nhận ra đây là lời tự xưng long trọng được lặp lại như một danh xưng trong vế sau. Đây là quy ước trình bày tiếng Việt, không ngụ ý rằng chữ Hê-bơ-rơ có dạng viết hoa riêng.
- issue: Đại từ trong lời Đức Chúa Trời nói với Môi-se
  choice: Ta / con
  alternative: Ta / ngươi; Tôi / ông
  rationale: “Ta / con” trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại và phù hợp quan hệ giữa Đức Chúa Trời với Môi-se, không nhằm áp đặt một luận điểm giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “phán” cho lời Đức Chúa Trời, “Môi-se” theo dạng tên quen thuộc, và giữ “Israel” theo dạng quốc tế hiện hành. Các dấu chú thích được đặt ngay sau nội dung liên quan.
