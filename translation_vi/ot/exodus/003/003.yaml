  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se nói: “Ta hãy rẽ qua xem cảnh tượng lớn lao này—tại sao bụi gai không cháy rụi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... nói
  rationale: Dạng waw liên tiếp thúc đẩy mạch kể chuyện; “Bấy giờ” diễn đạt tự nhiên trình tự sự việc trong tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: אָסֻרָה נָּא
  choice: Ta hãy rẽ qua
  rationale: Thể cohortative cùng נָא diễn tả ý định hoặc lời tự nhủ; “Ta hãy” giữ sắc thái tự thúc giục, còn “rẽ qua” phù hợp với chuyển động ra khỏi hướng đang đi.
- source_word: וְאֶרְאֶה
  choice: xem
  rationale: Ở đây ראה nói đến việc chủ ý quan sát; “xem” tự nhiên hơn “thấy” trong lời tự nhủ này.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: cảnh tượng kỳ lạ này
  rationale: מַרְאֶה là điều hiện ra trước mắt; גָּדֹל theo ngữ cảnh nhấn mạnh tính phi thường, nên “kỳ lạ” truyền đạt phản ứng kinh ngạc tự nhiên hơn cách dịch máy móc “lớn”.
- source_word: מַדּוּעַ
  choice: tại sao
  rationale: Tương đương trực tiếp và tự nhiên với từ nghi vấn chỉ nguyên nhân.
- source_word: לֹא יִבְעַר
  choice: không cháy rụi
  rationale: בער trong Qal là “cháy”; “cháy rụi” diễn đạt nghịch lý trong ngữ cảnh rằng bụi gai đang bốc cháy nhưng không bị lửa thiêu hết, mà không tách khỏi hình ảnh cháy của động từ Hê-bơ-rơ.
- source_word: הַסְּנֶה
  choice: bụi gai
  rationale: סְנֶה chỉ một bụi cây có gai; “bụi gai” vừa rõ nghĩa vừa phù hợp cách gọi tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt hiện tượng bụi gai trong lửa
  choice: tại sao bụi gai không cháy rụi
  alternative: tại sao bụi gai không cháy; tại sao bụi gai không bị thiêu hết
  rationale: 'Nguyên văn dùng động từ “cháy”, không trực tiếp dùng động từ “thiêu hết”. “Không cháy rụi” giữ trường nghĩa của lửa đồng thời diễn đạt điều kỳ lạ trong văn cảnh: bụi gai cháy mà không bị tiêu hủy, không thêm một cách giải thích thần học.'
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Lời của Môi-se dùng “Ta hãy” để giữ sắc thái tự nhủ; không dùng đại từ quá khẩu ngữ. Không đặt chú thích vì bản dịch chính đã diễn đạt tự nhiên độ căng nghĩa của לֹא יִבְעַר.
