  text: וַ/יֹּ֨אמֶר֙ כִּֽי אֶֽהְיֶ֣ה עִמָּ֔/ךְ וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת כִּ֥י אָנֹכִ֖י שְׁלַחְתִּ֑י/ךָ בְּ/הוֹצִֽיאֲ/ךָ֤ אֶת הָ/עָם֙ מִ/מִּצְרַ֔יִם תַּֽעַבְדוּ/ן֙ אֶת הָ֣/אֱלֹהִ֔ים עַ֖ל הָ/הָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: vi
  text: 'Ngài phán: “Chắc chắn Ta sẽ ở cùng con. Đây sẽ là dấu hiệu cho con rằng chính Ta đã sai con: Khi con đưa dân ra khỏi Ai Cập, các con sẽ phụng sự[a] Đức Chúa Trời trên núi này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các con sẽ thờ phượng Đức Chúa Trời trên núi này.” Động từ Hê-bơ-rơ có thể mang nghĩa “phục vụ, phụng sự” và khi nói về Đức Chúa Trời cũng có thể mang nghĩa “thờ phượng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Chắc chắn
  rationale: Trong ngữ cảnh này, từ này mở đầu lời Đức Chúa Trời trấn an lời phản đối của Môi-se; “chắc chắn” diễn đạt tự nhiên sắc thái khẳng định mạnh.
- source_word: אֶהְיֶה עִמָּךְ
  choice: Ta sẽ ở cùng con
  rationale: Dạng vị hoàn ở đây hướng đến tương lai và hứa về sự hiện diện đồng hành của Đức Chúa Trời.
- source_word: הָאוֹת
  choice: dấu hiệu
  rationale: Từ này chỉ một dấu hiệu hay sự xác nhận; “dấu hiệu” rõ nghĩa và phù hợp văn mạch.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: rằng chính Ta đã sai con
  rationale: “Chính Ta” thể hiện đại từ nhấn mạnh אָנֹכִי, còn “đã sai” diễn tả hành động sai phái đã xảy ra nhưng vẫn có hiệu lực đối với sứ mạng hiện tại.
- source_word: בְּהוֹצִיאֲךָ
  choice: Khi con đưa dân ra
  rationale: Cấu trúc giới từ בְּ với động từ nguyên mẫu và hậu tố ngôi hai số ít được hiểu theo nghĩa thời gian; Môi-se là tác nhân dẫn dân ra.
- source_word: תַּעַבְדוּן
  choice: các con sẽ phụng sự
  rationale: Hình thái động từ ở ngôi hai số nhiều, chuyển từ Môi-se sang toàn dân. עבד có thể bao hàm cả phục vụ lẫn thờ phượng; “phụng sự” giữ được phần lớn độ rộng nghĩa trong quan hệ với Đức Chúa Trời.
- source_word: אֶת־הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ xác định chỉ Đức Chúa Trời của Y-sơ-ra-ên; cách gọi này tự nhiên trong văn phong Kinh Thánh tiếng Việt mà không thêm nội dung giải thích.
- source_word: עַל הָהָר הַזֶּה
  choice: trên núi này
  rationale: Giữ nghĩa địa điểm cụ thể của giới từ עַל và sự quy chiếu trực tiếp đến ngọn núi trong trình thuật.
theological_decisions:
- issue: Bản chất của “dấu hiệu” được hứa ban
  choice: Dấu hiệu là việc dân sẽ phụng sự Đức Chúa Trời trên núi này sau khi ra khỏi Ai Cập.
  alternative: Dấu hiệu là lời hứa hiện tại rằng Đức Chúa Trời ở cùng Môi-se, hoặc bao gồm cả lời bảo đảm hiện tại lẫn sự ứng nghiệm tương lai.
  rationale: Cú pháp tự nhiên nhất liên kết “dấu hiệu” với mệnh đề tiếp theo về việc đưa dân ra và phụng sự trên núi, nhưng bản dịch không thêm lời giải thích nhằm loại bỏ hoàn toàn khả năng liên hệ với lời hứa về sự hiện diện.
- issue: Sự chuyển đổi số của đại từ
  choice: Dịch “con” ở mệnh đề nói với Môi-se và “các con” ở động từ תַּעַבְדוּן.
  alternative: Dùng “con” xuyên suốt và để tập thể được hiểu ngầm.
  rationale: Nguyên văn chuyển rõ từ ngôi hai số ít sang ngôi hai số nhiều, cho thấy Môi-se đưa dân ra nhưng cả cộng đồng sẽ phụng sự Đức Chúa Trời.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp xưng hô “Ta—con” cho lời Đức Chúa Trời nói với Môi-se; dùng “các con” để thể hiện chính xác sự chuyển sang ngôi hai số nhiều ở תַּעַבְדוּן. Dấu chân chú [a] được đặt ngay sau câu có từ cần chú giải.
