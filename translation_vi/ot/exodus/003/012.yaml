  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của tiếng Hê-bơ-rơ: lời bảo đảm hướng tương lai “Ta sẽ ở cùng con”; “dấu hiệu” xác nhận việc Đức Chúa Trời sai Môi-se; Môi-se là tác nhân đưa dân ra khỏi Ai Cập; và động từ số nhiều ở mệnh đề cuối được thể hiện bằng “các con sẽ”. “Chính Ta” chuyển đạt hợp lý sắc thái nhấn mạnh của אָנֹכִי mà không thêm nội dung.'
