  terminology: “Dấu hiệu,” “Đức Chúa Trời,” và “phụng sự” phù hợp ngữ cảnh Kinh Thánh. “Phụng sự” giữ được độ rộng nghĩa của עבד; chú thích về khả năng dịch là “thờ phượng” là thích hợp.
