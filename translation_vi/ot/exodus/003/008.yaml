  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: vi
  text: Ta đã ngự xuống để giải cứu dân ấy[b] khỏi quyền lực của Ai Cập[a], và đưa dân ấy lên khỏi xứ đó, đến một miền đất tốt đẹp và rộng rãi, một miền đất tuôn chảy sữa và mật, đến nơi của dân Ca-na-an, dân Hê-tít, dân A-mô-rít, dân Phê-rê-xít, dân Hê-vít và dân Giê-bu-sít.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “khỏi tay Ai Cập”, một thành ngữ chỉ quyền lực hoặc sự kiểm soát của Ai Cập.'
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hê-bơ-rơ, cả “giải cứu” lẫn “đưa lên” đều có hậu tố đại từ số ít, chỉ dân Israel như một tập thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: Ta đã ngự xuống
  rationale: Giữ nguyên hình ảnh không gian về hành động của Đức Chúa Trời; “ngự xuống” vừa trang trọng, tự nhiên trong tiếng Việt, vừa không diễn giải thành một ý trừu tượng như “can thiệp”.
- source_word: לְהַצִּילוֹ
  choice: để giải cứu dân ấy
  rationale: Động từ Hiphil của נצל diễn tả việc cứu thoát khỏi hiểm nguy hoặc quyền khống chế. “Giải cứu” giữ được sắc thái cụ thể ấy mà không thêm hàm ý thần học ngoài ngữ cảnh.
- source_word: מִיַּד מִצְרַיִם
  choice: khỏi quyền lực của Ai Cập
  rationale: Cụm “khỏi tay Ai Cập” là một thành ngữ chỉ sự cai trị hoặc quyền kiểm soát. Diễn đạt bằng “quyền lực” giúp độc giả hiện đại hiểu ngay, còn hình ảnh nguyên văn được ghi trong chú thích.
- source_word: וּלְהַעֲלֹתוֹ
  choice: và đưa dân ấy lên
  rationale: Giữ hướng chuyển động “lên” của עלה và đại từ số ít mang nghĩa tập thể bằng danh ngữ số ít “dân ấy”.
- source_word: מִן הָאָרֶץ הַהִוא
  choice: khỏi xứ đó
  rationale: “Xứ đó” quy chiếu tự nhiên về Ai Cập và phản ánh trực tiếp cụm danh từ có chỉ từ trong tiếng Hê-bơ-rơ.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: đến một miền đất tốt đẹp và rộng rãi
  rationale: “Tốt đẹp” chuyển tải טוֹבָה, còn “rộng rãi” diễn đạt chiều rộng và sự khoáng đạt của רְחָבָה bằng tiếng Việt tự nhiên.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: một miền đất tuôn chảy sữa và mật
  rationale: Giữ hình ảnh phân từ זָבַת về sự tuôn chảy, qua đó diễn tả sự phong phú của miền đất mà không thu gọn thành một lời giải thích.
- source_word: אֶל מְקוֹם
  choice: đến nơi của
  rationale: Dịch sát מְקוֹם là “nơi”, không tự ý đổi thành “lãnh thổ” hay lặp lại “đất”.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: dân Ca-na-an, dân Hê-tít, dân A-mô-rít, dân Phê-rê-xít, dân Hê-vít và dân Giê-bu-sít
  rationale: Các danh xưng dân tộc ở dạng số ít nhưng mang nghĩa tập thể. Cấu trúc “dân + tên gọi” thể hiện tự nhiên giá trị tập thể ấy trong tiếng Việt.
theological_decisions:
- issue: Hình ảnh Đức Chúa Trời chuyển động xuống
  choice: 'Giữ ngôn ngữ không gian: “Ta đã ngự xuống”'
  alternative: Diễn ý thành “Ta đã can thiệp” hoặc “Ta quyết định hành động”
  rationale: Nguyên văn mô tả hành động của Đức Chúa Trời bằng ngôn ngữ nhân hình. Bản dịch giữ sức gợi của lời kể và không giải thích hóa hình ảnh này.
- issue: Đại từ số ít chỉ dân Israel như một tập thể
  choice: Dùng danh ngữ tập thể số ít “dân ấy” ở cả hai chỗ
  alternative: Dùng đại từ số nhiều “họ”
  rationale: Hai hậu tố đại từ trong tiếng Hê-bơ-rơ đều ở số ít và nhìn Israel như một dân thống nhất. “Dân ấy” vừa rõ nghĩa trong tiếng Việt vừa bảo toàn góc nhìn tập thể của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời Đức Chúa Trời đang phán. Các tên dân tộc được phiên âm nhất quán theo âm dạng Hê-bơ-rơ quen dùng trong tiếng Việt; cấu trúc câu giữ nhịp liệt kê và các hình ảnh chủ đạo của nguyên văn.
