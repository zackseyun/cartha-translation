base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: vi
  text: Ta sẽ khiến người Ai Cập có thiện cảm với dân này[a]; và khi các ngươi ra đi, các ngươi sẽ không ra đi tay không[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Ta sẽ ban ân huệ cho dân này trong mắt người Ai Cập,” nghĩa là khiến người Ai Cập có thiện cảm với họ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các ngươi sẽ không ra đi trống không.” Thành ngữ Hê-bơ-rơ chỉ việc ra đi mà không có của cải hay vật dụng mang theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Ta sẽ làm cho
  rationale: Kết cấu נָתַן + חֵן diễn tả việc khiến một người nhận được thiện cảm; “làm cho… được quý mến” tự nhiên trong tiếng Việt và vẫn thể hiện Đức Chúa Trời là chủ thể hành động.
- source_word: חֵן
  choice: được quý mến
  rationale: Trong ngữ cảnh xã hội này, חֵן chỉ thiện cảm hay sự ưu ái, không nhất thiết mang nghĩa thần học chuyên biệt như “ân điển”.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: Giữ dạng tập thể số ít của עָם và cách chỉ định trực tiếp của הַזֶּה; “dân này” tự nhiên, trang trọng trong tiếng Việt.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: được người Ai Cập quý mến
  rationale: Thành ngữ nghĩa đen “trong mắt người Ai Cập” nói về cách họ nhìn nhận dân Israel. Cách dịch chính truyền đạt tự nhiên ý được họ có thiện cảm.
- source_word: וְהָיָה כִּי
  choice: và khi
  rationale: Công thức Hê-bơ-rơ giới thiệu một hoàn cảnh chắc chắn trong tương lai; “và khi” gọn và tự nhiên.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: các ngươi ra đi / các ngươi sẽ không ra đi
  rationale: הלך cơ bản là “đi”; trong ngữ cảnh này chỉ việc rời Ai Cập. “Ra đi” làm rõ chuyển động rời nơi ấy mà không diễn giải quá mức.
- source_word: רֵיקָם
  choice: tay không
  rationale: Thành ngữ tiếng Việt “tay không” truyền đạt rõ nghĩa ra đi mà không có của cải hay vật dụng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Trời và “các ngươi” cho ngôi thứ hai số nhiều, vừa giữ rõ số nhiều của động từ Hê-bơ-rơ vừa phù hợp văn phong Kinh Thánh tiếng Việt.
