source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: vi
  text: 'Đức Chúa Trời lại phán với Môi-se: “Ngươi hãy nói với con cái Y-sơ-ra-ên thế này: ‘Yahweh[a], Đức Chúa Trời của tổ phụ các ngươi, Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp, đã sai ta đến với các ngươi.’ Đây là danh Ta đời đời, và đây là sự tưởng niệm của Ta từ thế hệ này sang thế hệ khác.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “YHWH”; thường được phiên âm là “Yahweh”.'
    reason: Giải thích dạng Hê-bơ-rơ của danh riêng יהוה và cách phiên âm được dùng trong bản dịch.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; cách này phản ánh trực tiếp danh YHWH trong bản Hê-bơ-rơ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, chỉ tập thể dân thuộc dòng dõi Y-sơ-ra-ên mà không khiến độc giả hiểu sai rằng chỉ có các con trai trực hệ.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Đức Chúa Trời của tổ phụ các ngươi
  rationale: Giữ sắc thái thân tộc nam của אֲבֹתֵיכֶם và dùng cách diễn đạt quen thuộc, trang trọng trong văn phong Kinh Thánh tiếng Việt.
- source_word: שְׁלָחַנִי
  choice: đã sai ta
  rationale: Diễn tả hành động sai phái đã được thực hiện; đại từ “ta” phù hợp với lời Môi-se được truyền phải nói với dân.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: Đây là danh ta đời đời
  rationale: Giữ cấu trúc ngắn gọn của nguyên văn và ý nghĩa kéo dài không dứt của לְעֹלָם.
- source_word: זִכְרִי
  choice: danh hiệu để người ta tưởng nhớ ta
  rationale: 'Làm rõ danh từ có gốc từ động từ “nhớ”: điều hoặc danh xưng nhờ đó Đức Chúa Trời được tưởng nhớ, đồng thời giữ khả năng hiểu là “sự tưởng niệm” trong chú thích.'
- source_word: לְדֹר דֹּר
  choice: từ thế hệ này sang thế hệ khác
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ ý liên tục qua các thế hệ kế tiếp.
- source_word: כֹּה תֹאמַר
  choice: Con hãy nói ... thế này
  rationale: Chuyển công thức chỉ dẫn trực tiếp sang tiếng Việt hiện đại và trang trọng; “con” phản ánh quan hệ người trên nói với người dưới trong ngữ cảnh mà không thêm nội dung thần học.
- source_word: עוֹד
  choice: lại
  rationale: Đánh dấu Đức Chúa Trời tiếp tục phán thêm với Môi-se; “lại” tự nhiên hơn “cũng” ở đầu câu tiếng Việt.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Phiên âm “Yahweh” giữ đây là danh riêng, không thay bằng tước hiệu; chú thích cho biết dạng chữ Hê-bơ-rơ.
- issue: Cách thể hiện các từ thân tộc giống đực
  choice: con dân Y-sơ-ra-ên / tổ phụ các ngươi
  alternative: các con trai Y-sơ-ra-ên / tổ tiên các ngươi
  rationale: “Tổ phụ” giữ yếu tố nam của אבות. Với בני ישראל, “con dân” truyền đạt tự nhiên tên gọi tập thể của dân giao ước và tránh hàm ý không có phụ nữ, trong khi vẫn giữ hình ảnh dòng dõi.
- issue: Nghĩa của זִכְרִי
  choice: danh hiệu để người ta tưởng nhớ ta
  alternative: sự tưởng niệm về ta; danh mà người ta dùng để nhớ đến ta
  rationale: Ngữ cảnh đặt זִכְרִי song song với “danh ta”, nhưng từ này vẫn có thể chỉ sự tưởng niệm. Bản dịch chính thể hiện mối liên hệ ấy mà không đồng nhất hoàn toàn hai vế; chú thích bảo tồn các khả năng từ vựng.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Dùng các tên quen thuộc trong truyền thống tiếng Việt: Môi-se, Y-sơ-ra-ên, Áp-ra-ham, Y-sác, Gia-cốp. Đại từ trong lời truyền đạt là “ta/các ngươi”, phù hợp bối cảnh cổ và giữ tính trang nghiêm; trong lời Đức Chúa Trời nói trực tiếp với Môi-se dùng “Con” để câu tiếng Việt tự nhiên.'
