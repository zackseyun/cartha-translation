revisions:
- from: 'Đức Chúa Trời lại phán với Môi-se: “Con hãy nói với con dân Y-sơ-ra-ên thế này: ‘Yahweh[a], Đức Chúa Trời của tổ phụ các ngươi, Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp, đã sai ta đến với các ngươi.’ Đây là danh ta đời đời, và đây là danh hiệu để người ta tưởng nhớ ta[b] từ thế hệ này sang thế hệ khác.”'
  to: 'Đức Chúa Trời lại phán với Môi-se: “Ngươi hãy nói với con cái Y-sơ-ra-ên thế này: ‘Yahweh[a], Đức Chúa Trời của tổ phụ các ngươi, Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp, đã sai ta đến với các ngươi.’ Đây là danh Ta đời đời, và đây là sự tưởng niệm của Ta từ thế hệ này sang thế hệ khác.”'
  rationale: 'Bản sửa tránh thêm sắc thái quan hệ trong đại từ xưng hô, dùng thành ngữ “con cái Y-sơ-ra-ên” cho tên gọi tập thể, và chuyển זִכְרִי thành “sự tưởng niệm của Ta” để phản ánh sát danh từ sở hữu trong nguyên văn. Danh Yahweh được giữ trong thân bài; chú thích được rút gọn và điều chỉnh để nêu đúng các phương án nghĩa. Dấu chú thích b không có chỗ neo riêng trong văn bản gốc của bản nháp; nó được neo vào “sự tưởng niệm của Ta” trong bản văn hoàn chỉnh dưới đây bằng cách hiểu marker b đặt ngay sau cụm đó: “... sự tưởng niệm của Ta[b] từ thế hệ này sang thế hệ khác.”'
