  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: vi
  text: 'Nhưng Môi-se thưa cùng Đức Chúa Trời: “Con là ai mà đi gặp Pha-ra-ôn và đưa con cái Y-sơ-ra-ên[a] ra khỏi Ai Cập?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Y-sơ-ra-ên”; theo cách dịch truyền thống là “con cháu Y-sơ-ra-ên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: thưa
  rationale: Động từ אמר trong lời kể có nghĩa cơ bản là “nói”; ở đây, “thưa” là cách diễn đạt tự nhiên và trang trọng khi Môi-se nói với Đức Chúa Trời, không thêm nội dung vào nguyên văn.
- source_word: אֶל הָאֱלֹהִים
  choice: với Đức Chúa Trời
  rationale: Danh từ có mạo từ chỉ chính Đức Chúa Trời; danh xưng tiếng Việt này rõ nghĩa, trang trọng và phù hợp ngữ cảnh trực tiếp.
- source_word: מִי אָנֹכִי
  choice: Con là ai
  rationale: Giữ nguyên câu hỏi tu từ bộc lộ sự bất xứng của Môi-se; đại từ “con” tự nhiên trong lời ông thưa với Đức Chúa Trời.
- source_word: כִּי אֵלֵךְ
  choice: mà dám đến gặp
  rationale: כִּי nối hai hành động với câu hỏi “Con là ai”; “dám” diễn đạt sắc thái tự vấn về tư cách, còn “đến gặp” tự nhiên hơn “đi đến” trước một nhân vật.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm tiếng Việt quen thuộc của tước hiệu hoàng gia Ai Cập.
- source_word: וְכִי אוֹצִיא
  choice: và đưa ... ra
  rationale: Giữ phép song song giữa việc đến gặp Pha-ra-ôn và việc đưa dân ra; Hiphil của יצא mang nghĩa khiến đi ra, tức “đưa ra”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Bảo tồn cách diễn đạt gia tộc của tiếng Hê-bơ-rơ mà không khiến độc giả hiện đại hiểu lầm rằng chỉ nói đến nam giới hay trẻ em.
- source_word: מִמִּצְרָיִם
  choice: ra khỏi Ai Cập
  rationale: Giới từ מן kết hợp với động từ sai khiến diễn đạt rõ sự chuyển động từ bên trong Ai Cập ra ngoài.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; các con trai của Y-sơ-ra-ên
  rationale: Cụm từ Hê-bơ-rơ có hình thức gia tộc và giống đực nhưng trong ngữ cảnh chỉ toàn thể cộng đồng hậu duệ của Y-sơ-ra-ên. “Con cái Y-sơ-ra-ên” giữ hình ảnh gia tộc và phạm vi tập thể, không thu hẹp đối tượng chỉ còn nam giới.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Lời thoại dùng cặp xưng hô ngầm Đức Chúa Trời–“con”; “mà dám” truyền đạt câu hỏi tu từ về tư cách, không biến lời Môi-se thành lời từ chối tuyệt đối.
