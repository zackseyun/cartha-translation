  - severity: low
    issue: Liên kết “và ngươi hãy đưa” chưa thật mượt sau “Ta sẽ sai ngươi.”
    rationale: Nguyên văn chuyển từ lời tuyên bố sai phái sang mệnh lệnh. Một câu mệnh lệnh riêng làm rõ sự chuyển đổi này mà không biến nó thành mệnh đề mục đích.
