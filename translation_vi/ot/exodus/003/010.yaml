source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: vi
  text: Bây giờ, hãy đi; Ta sẽ sai ngươi đến gặp Pha-ra-ôn. Hãy đưa dân Ta, tức con cái Y-sơ-ra-ên[a], ra khỏi Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói tự nhiên hơn: “dân Y-sơ-ra-ên.” Nguyên văn Hê-bơ-rơ: “con cái Y-sơ-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả ý chuyển tiếp của וְ và sắc thái thời điểm của עַתָּה; cách nói này tự nhiên trong lời giao nhiệm vụ.
- source_word: לְכָה
  choice: hãy đi
  rationale: Mệnh lệnh của הלך trong ngữ cảnh sai phái được diễn đạt tự nhiên trong tiếng Việt là “hãy đi”; tránh dịch theo lớp từ tiếng Anh “come” khi hướng hành động là đến Pha-ra-ôn.
- source_word: וְאֶשְׁלָחֲךָ
  choice: Ta sẽ sai ngươi
  rationale: Phản ánh trực tiếp thể chưa hoàn thành Qal cùng hậu tố ngôi hai số ít và giữ sắc thái uy nghiêm của lời Đức Chúa Trời.
- source_word: אֶל־פַּרְעֹה
  choice: đến với Pha-ra-ôn
  rationale: Diễn đạt hướng sai phái bằng tiếng Việt tự nhiên, giữ nguyên tước hiệu/tên gọi Pha-ra-ôn.
- source_word: וְהוֹצֵא
  choice: và ngươi hãy đưa ... ra
  rationale: Giữ lực mệnh lệnh của Hiphil và ý khiến dân đi ra; nêu chủ ngữ “ngươi” để câu tiếng Việt rõ ràng, không hiểu lầm rằng chính Đức Chúa Trời là chủ ngữ ngữ pháp của mệnh lệnh này.
- source_word: עַמִּי
  choice: dân Ta
  rationale: Giữ trực tiếp ngôn ngữ sở hữu giao ước; “dân Ta” trang trọng và tự nhiên.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc và căn tính tổ phụ của nguyên văn, đồng thời là cách gọi quen thuộc, bao quát cộng đồng trong tiếng Việt Kinh Thánh.
- source_word: מִמִּצְרָיִם
  choice: ra khỏi Ai Cập
  rationale: Kết hợp tự nhiên với động từ sai khiến “đưa ... ra” và diễn tả rõ chuyển động rời khỏi Ai Cập.
theological_decisions:
- issue: Cách dịch danh xưng dân giao ước בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” bảo tồn nét gia tộc, tổ phụ và giao ước của tiếng Hê-bơ-rơ mà vẫn có thể chỉ toàn thể cộng đồng; phương án tự nhiên hơn được ghi ở chú thích.
- issue: Quan hệ giữa lời sai phái và mệnh lệnh đưa dân ra
  choice: Ta sẽ sai ngươi ... và ngươi hãy đưa
  alternative: Ta sai ngươi ... để đưa
  rationale: Giữ hai hình thức động từ riêng của nguyên văn—một lời tuyên bố sai phái và một mệnh lệnh—thay vì biến mệnh lệnh thứ hai thành mệnh đề mục đích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/ngươi” để thể hiện lời phán trực tiếp của Đức Chúa Trời trong bối cảnh cổ, nhưng cấu trúc câu vẫn tự nhiên. Dấu câu tách lời thúc giục khỏi nội dung sai phái và làm rõ hai mệnh lệnh.
