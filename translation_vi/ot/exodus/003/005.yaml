  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: vi
  text: 'Ngài phán: “Đừng đến gần đây. Hãy cởi dép khỏi chân ông, vì nơi ông đang đứng là đất thánh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngài phán
  rationale: Động từ với waw liên tiếp tiếp nối diễn tiến câu chuyện. Trong ngữ cảnh Đấng hiện diện trong bụi gai đang nói với Môi-se, “Ngài phán” là cách diễn đạt tự nhiên, trang trọng; tiếng Việt không cần thêm “rồi” để thể hiện trình tự.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: Đừng đến gần đây
  rationale: אַל với thể vị hoàn thành/jussive diễn tả lệnh cấm; קרב chỉ việc đến gần, còn הֲלֹם xác định địa điểm “đây”.
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: Hãy cởi dép khỏi chân con
  rationale: שַׁל là mệnh lệnh tháo/cởi ra; נְעָלֶיךָ là dép hoặc giày dép. “Cởi dép khỏi chân” vừa tự nhiên vừa giữ chi tiết được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do cho mệnh lệnh đứng trước.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: nơi con đang đứng
  rationale: Diễn đạt tự nhiên trong tiếng Việt trạng thái hiện tại của Môi-se tại địa điểm ấy, không cần lặp lại đại từ chỉ nơi chốn của עָלָיו.
- source_word: אַדְמַת קֹדֶשׁ הוּא
  choice: là đất thánh
  rationale: Cụm kết cấu אַדְמַת קֹדֶשׁ nghĩa sát là “đất của sự thánh khiết”; “đất thánh” truyền đạt chính xác và tự nhiên phẩm tính thiêng thánh của địa điểm.
theological_decisions:
- issue: Bản chất sự thánh khiết của địa điểm
  choice: Chỉ khẳng định nơi Môi-se đứng là “đất thánh”, không thêm lời giải thích.
  alternative: Giải thích rõ rằng đất trở nên thánh vì sự hiện diện của Đức Chúa Trời.
  rationale: Câu này tuyên bố địa điểm là thánh nhưng không trực tiếp giải thích cơ chế; bản dịch giữ nguyên nội dung và sự hàm súc của nguyên văn.
- issue: Chủ thể của וַיֹּאמֶר và cách xưng hô
  choice: Dùng “Ngài phán” và gọi Môi-se là “con”.
  alternative: Dùng “Đức Chúa Trời phán” hoặc đại từ trung tính hơn như “ông/ngươi”.
  rationale: Chủ thể được nhận biết từ mạch văn nhưng không được lặp danh xưng trong câu này; “Ngài” tránh bổ sung danh xưng. “Con” phù hợp lời Đức Chúa Trời trực tiếp phán với Môi-se trong tiếng Việt hiện đại mà không làm thay đổi nội dung mệnh lệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh cụ thể “dép”, mệnh lệnh trực tiếp và cụm quen thuộc “đất thánh”; không thêm diễn giải thần học ngoài câu.
