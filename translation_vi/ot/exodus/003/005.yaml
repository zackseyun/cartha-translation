    rationale: Nguyên văn chỉ dùng ngôi thứ hai số ít. Dù “con” có thể là quy ước kính ngữ trong một số truyền thống, nó xác định người nghe như con đối với Đấng đang phán, vượt quá điều câu này diễn đạt. “Ông” giữ cách nói tự nhiên, lịch sự và không thêm diễn giải quan hệ.
