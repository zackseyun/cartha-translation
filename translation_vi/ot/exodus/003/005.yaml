  source_fidelity: Bản dịch truyền đạt đúng các mệnh lệnh, lý do và khẳng định về tính thánh của địa điểm. Tuy nhiên, đại từ “con” không được biểu thị trong tiếng Hê-bơ-rơ và thêm sắc thái quan hệ cha-con vào lời phán; nên thay bằng cách xưng hô trung tính hơn trong ngữ cảnh tường thuật.
  naturalness: Câu văn rõ ràng, trang trọng và tự nhiên. “Cởi dép khỏi chân ông” là lối nói hiện đại, mạch lạc, đồng thời giữ chi tiết “khỏi chân” của nguyên văn.
  terminology: “Ngài phán,” “dép,” và “đất thánh” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Đất thánh” phản ánh chính xác אַדְמַת קֹדֶשׁ mà không diễn giải nguyên nhân của sự thánh khiết.
