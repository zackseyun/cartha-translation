id: EXO.3.1
reference: Exodus 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: vi
  text: Môi-se đang chăn đàn chiên và dê của Giê-trô, cha vợ ông, là thầy tế lễ xứ Ma-đi-an. Ông dẫn đàn chiên và dê sang bên kia hoang mạc[a] và đến núi của Đức Chúa Trời, là Hô-rếp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến phía xa của hoang mạc.”'
    reason: אַחַר trong cách dùng không gian có thể được diễn đạt là “bên kia” hoặc “phía xa” của hoang mạc.
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: Môi-se
  rationale: Liên từ mở đầu chuyển sang một cảnh mới; tiếng Việt không cần thêm “bấy giờ” hay “và” vì nguyên văn không có từ chỉ thời gian tường minh, còn tên riêng dùng dạng phiên âm quen thuộc.
- source_word: הָיָה רֹעֶה
  choice: đang chăn
  rationale: Diễn đạt hành động đang tiếp diễn trong quá khứ một cách tự nhiên trong tiếng Việt.
- source_word: צֹאן
  choice: bầy gia súc
  rationale: Từ Hê-bơ-rơ chỉ chung đàn gia súc nhỏ, thường gồm chiên và dê; “bầy gia súc” tự nhiên hơn trong tiếng Việt và không thu hẹp thành riêng chiên.
- source_word: יִתְרוֹ חֹתְנוֹ
  choice: Giê-trô, cha vợ mình
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt và nêu đúng quan hệ thân thuộc qua hôn nhân trong ngữ cảnh Xuất Hành.
- source_word: כֹּהֵן מִדְיָן
  choice: thầy tế lễ xứ Ma-đi-an
  rationale: Diễn đạt tự nhiên quan hệ kết cấu giữa chức vụ của Giê-trô và Ma-đi-an mà không xác định thêm ông phục vụ vị thần nào.
- source_word: וַיִּנְהַג
  choice: Ông dẫn
  rationale: Động từ có thể mang nghĩa dẫn hoặc lùa; “dẫn” phù hợp ngữ cảnh đưa đàn vật đi và tránh sắc thái mạnh không cần thiết.
- source_word: אַחַר הַמִּדְבָּר
  choice: sang bên kia hoang mạc
  rationale: Cách dịch này phản ánh nghĩa không gian khả dĩ nhất là đến phía bên kia hoặc phía xa của hoang mạc, đồng thời giữ chú thích cho phương án diễn đạt khác.
- source_word: וַיָּבֹא
  choice: và đến
  rationale: Chỉ sự đi tới hoặc tới nơi; “đến” gọn và tự nhiên trong mạch kể.
- source_word: הַר הָאֱלֹהִים
  choice: núi của Đức Chúa Trời
  rationale: Dịch trực tiếp cấu trúc sở thuộc, không giải thích trước núi đã linh thiêng hay được gọi như vậy theo góc nhìn hồi thuật.
- source_word: חֹרֵבָה
  choice: tức Hô-rếp
  rationale: Hậu tố chỉ hướng được thể hiện bởi động từ “đến”; “tức Hô-rếp” làm rõ Hô-rếp đồng vị với ngọn núi, không biến thành một đích đến thứ hai.
theological_decisions:
- issue: Cụm הַר הָאֱלֹהִים có xác định ngọn núi đã được coi là thánh vào thời điểm này hay không
  choice: núi của Đức Chúa Trời
  alternative: núi thánh
  rationale: Giữ nguyên cách gọi trực tiếp của tiếng Hê-bơ-rơ, không quyết định đây là danh xưng có từ trước, lời báo trước của người kể hay cách gọi hồi thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng theo lối phiên âm Kinh Thánh quen thuộc trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
