  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: vi
  text: Bấy giờ, thiên sứ của Yahweh[a] hiện ra với ông trong một ngọn lửa từ giữa bụi gai. Ông nhìn, và kìa, bụi gai đang bốc cháy, nhưng bụi gai không bị thiêu rụi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sứ giả của Yahweh.” Từ Hê-bơ-rơ có thể mang nghĩa “thiên sứ” hoặc “sứ giả.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Dạng Niphal của ראה trong ngữ cảnh thần hiện được diễn đạt tự nhiên và sát nghĩa là “hiện ra”.
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: מַלְאַךְ có thể chỉ “sứ giả” hoặc “thiên sứ”; trong cảnh thần hiện này, “thiên sứ” là cách diễn đạt tự nhiên theo ngôn ngữ Kinh Thánh, còn khả năng từ vựng kia được ghi ở chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước bằng hình thức chuyển tự phổ biến, thay vì thay thế bằng một tước hiệu.
- source_word: אֵלָיו
  choice: với ông
  rationale: Đại từ chỉ Môi-se theo văn cảnh; “hiện ra với ông” là cách kết hợp tự nhiên trong tiếng Việt.
- source_word: בְּלַבַּת אֵשׁ
  choice: trong một ngọn lửa
  rationale: Giữ hình ảnh ngọn lửa của nguyên văn mà tránh cách lặp không tự nhiên “ngọn lửa của lửa” trong tiếng Việt.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: từ giữa bụi gai
  rationale: Phản ánh trực tiếp nghĩa “từ giữa/bên trong” và danh từ chỉ bụi gai trong phân đoạn.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Ông nhìn và thấy
  rationale: 'Kết hợp tự nhiên hai yếu tố diễn ngôn: Môi-se nhìn, rồi nhận thấy cảnh tượng đáng chú ý; tránh từ cổ “kìa” mà vẫn giữ tiến trình nhận biết.'
- source_word: בֹּעֵר בָּאֵשׁ
  choice: đang cháy trong lửa
  rationale: “Đang cháy” thể hiện tính tiếp diễn của phân từ, còn “trong lửa” giữ yếu tố אֵשׁ được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: không bị thiêu rụi
  rationale: Dạng bị động của אכל trong ngữ cảnh lửa mang nghĩa bị thiêu hết; “thiêu rụi” vừa tự nhiên vừa giữ nghịch lý của dấu lạ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; chuyển tự “Yahweh” bảo tồn tính chất danh riêng mà không áp đặt một tước hiệu thay thế.
- issue: Cách hiểu מַלְאַךְ trong cảnh thần hiện
  choice: thiên sứ
  alternative: sứ giả
  rationale: “Thiên sứ” phù hợp nhất với bối cảnh siêu nhiên, nhưng chú thích vẫn bảo tồn nghĩa rộng “sứ giả” và không xác định thêm căn tính của nhân vật vượt quá câu chữ.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “Bấy giờ” để nối mạch kể, “bụi gai” theo cách gọi quen thuộc, và tránh lối diễn đạt quá cổ. Dấu chú thích [a] đặt ngay sau cụm từ có phương án dịch khác.
