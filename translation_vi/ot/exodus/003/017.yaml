  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: vi
  text: 'Ta đã phán[a]: “Ta sẽ đưa các ngươi lên khỏi cảnh khốn khổ tại Ai Cập[b], đến xứ của dân Ca-na-an, dân Hê-tít, dân A-mô-rít, dân Phê-rê-xít, dân Hê-vít và dân Giê-bu-sít—đến một xứ tuôn tràn sữa và mật.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta phán: ‘Ta sẽ đưa các ngươi lên…’” Động từ Hê-bơ-rơ mang hình thức quá khứ, nhưng trong ngữ cảnh, lời đã phán vẫn có hiệu lực hiện tại.'
    reason: alternative_reading
  - marker: b
    text: “Cảnh khốn khổ tại Ai Cập” cũng có thể dịch là “cảnh áp bức tại Ai Cập” hoặc “nỗi khốn khổ do Ai Cập gây ra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Ta đã phán
  rationale: Dạng động từ Hê-bơ-rơ mang hình thức quá khứ. “Ta đã phán” giữ được lời tuyên bố đã được Đức Chúa Trời xác lập mà không diễn giải thêm thành “Ta hứa” hay “Ta đã quyết định”.
- source_word: אַעֲלֶה
  choice: Ta sẽ đưa các ngươi lên
  rationale: Động từ עלה ở thể Hiphil có nghĩa là khiến đi lên hoặc đưa lên. Cách dịch này bảo tồn hình ảnh chuyển động “lên” gắn với cuộc ra khỏi Ai Cập.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: khỏi cảnh khốn khổ tại Ai Cập
  rationale: עֳנִי có thể chỉ nỗi khốn khổ, cảnh áp bức hoặc hoạn nạn. “Tại Ai Cập” làm rõ quan hệ địa điểm theo ngữ cảnh, nhưng chú thích vẫn bảo tồn những khả năng diễn đạt khác.
- source_word: אֶל אֶרֶץ
  choice: đến xứ
  rationale: אֶל biểu thị hướng chuyển động tới một đích; “đến xứ” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: dân Ca-na-an, dân Hê-tít, dân A-mô-rít, dân Phê-rê-xít, dân Hê-vít và dân Giê-bu-sít
  rationale: Các danh xưng dân tộc ở số ít trong tiếng Hê-bơ-rơ được diễn đạt bằng “dân” trong tiếng Việt để chỉ từng cộng đồng cư dân, đồng thời giữ đầy đủ danh sách của nguyên văn.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: đến một xứ tuôn tràn sữa và mật
  rationale: Cách dịch này giữ ẩn dụ זבת, “tuôn chảy/tuôn tràn”, đồng thời truyền đạt hình ảnh về sự phong phú và màu mỡ một cách tự nhiên.
theological_decisions:
- issue: Thời thái của công thức tuyên bố thần linh
  choice: 'Ta đã phán: “Ta sẽ đưa các ngươi lên...”'
  alternative: 'Ta phán: “Ta sẽ đưa các ngươi lên...”'
  rationale: Nguyên văn dùng dạng động từ mang hình thức quá khứ, nên “đã phán” được giữ trong chính văn. Chú thích nêu cách hiểu có tính hiện tại trong mạch lời phán mà không biến câu thành một công thức thần học mạnh hơn nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ta/các ngươi” phù hợp với lời Đức Chúa Trời phán với Môi-se và dân chúng trong văn mạch. Các dân danh được phiên âm theo lối quen thuộc, có gạch nối để dễ đọc. Dấu gạch ngang bảo tồn sự nhấn mạnh khi câu chuyển từ danh sách các dân sang lời mô tả xứ.
