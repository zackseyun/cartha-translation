base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: vi
  text: 'Rồi Ngài phán: “Ta là Đức Chúa Trời của cha con, Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp.” Môi-se liền che mặt, vì ông sợ nhìn Đức Chúa Trời.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi Ngài phán
  rationale: Thể kể chuyện với waw liên tiếp đẩy diễn tiến về phía trước; “Rồi” thể hiện trình tự tự nhiên, còn “phán” phù hợp với lời trực tiếp của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: אָנֹכִי
  choice: Ta là
  rationale: Đại từ độc lập có sắc thái nhấn mạnh; trong mệnh đề đồng nhất không có động từ, tiếng Việt tự nhiên cần “là”. “Ta” phù hợp với lời Đức Chúa Trời tự xưng mà không thêm ý ngoài bản văn.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Đức Chúa Trời của cha con
  rationale: Giữ nguyên danh từ số ít “cha” và cấu trúc sở thuộc của tiếng Hê-bơ-rơ. “Con” diễn đạt đại từ ngôi hai số ít trong lời Đức Chúa Trời nói với Môi-se.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp
  rationale: Giữ sự lặp lại ba lần của אֱלֹהֵי, vốn tạo nhịp điệu và nhấn mạnh mối liên hệ riêng với từng tổ phụ.
- source_word: וַיַּסְתֵּר ... פָּנָיו
  choice: liền che mặt
  rationale: Động từ Hiphil mang nghĩa làm cho bị khuất, che hoặc giấu; trong hành động cụ thể này, “che mặt” tự nhiên hơn “giấu mặt”. “Liền” nối tiếp phản ứng của Môi-se trong mạch kể.
- source_word: כִּי יָרֵא
  choice: vì ông sợ
  rationale: כִּי có chức năng nêu nguyên nhân, còn יָרֵא diễn tả trạng thái sợ hãi; cách dịch ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: מֵהַבִּיט אֶל הָאֱלֹהִים
  choice: nhìn Đức Chúa Trời
  rationale: Sau động từ chỉ sự sợ hãi, מן với động từ nguyên mẫu nêu hành động mà chủ thể sợ thực hiện. “Nhìn Đức Chúa Trời” tự nhiên trong tiếng Việt và truyền đạt đúng hướng của אֶל.
theological_decisions:
- issue: Cách dịch אֱלֹהִים trong lời tự mặc khải và trình thuật thần hiện
  choice: Đức Chúa Trời
  alternative: Thần; vị thần
  rationale: Ngữ cảnh xác định rõ Đấng đang phán là Đức Chúa Trời của các tổ phụ. Danh xưng “Đức Chúa Trời” diễn đạt đúng sở chỉ trong tiếng Việt mà không hạ thành một danh từ chung.
- issue: Sự lặp lại danh xưng אֱלֹהֵי trước tên từng tổ phụ
  choice: Lặp lại “Đức Chúa Trời của” ba lần
  alternative: Đức Chúa Trời của Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Bản Hê-bơ-rơ cố ý lặp cấu trúc trước từng tên; giữ lại sự lặp giúp bảo toàn trọng âm tu từ và sự tự đồng nhất của Đức Chúa Trời với từng tổ phụ.
- issue: Quan hệ trong אֱלֹהֵי אָבִיךָ
  choice: cha con, số ít
  alternative: tổ phụ con; các tổ phụ của con
  rationale: Bản văn dùng אָבִיךָ ở số ít. Không đồng nhất hóa hoặc mở rộng thành số nhiều, nhờ đó giữ nguyên khả năng quy chiếu theo chính câu chữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc Áp-ra-ham, Y-sác, Gia-cốp và Môi-se. Giữ sự lặp có chủ ý của nguyên văn; không thêm chú thích vì câu dịch không cần giải nghĩa văn bản để hiểu.
