  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH.” Danh thần này theo truyền thống thường được dịch là “CHÚA”; cũng có thể được chuyển tự là “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn lời của Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”; dạng có waw tiếp diễn mở ra một bước mới trong mạch kể.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Đây là danh riêng của Đức Chúa Trời, không chỉ là một tước hiệu. “Đức Giê-hô-va” là dạng danh xưng đã quen thuộc và trang trọng trong tiếng Việt.
- source_word: אֶל
  choice: với
  rationale: Giới từ đánh dấu người tiếp nhận lời nói; trong công thức tiếng Việt “phán với” là cách diễn đạt tự nhiên.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tiếng Việt thông dụng của tên riêng Hê-bơ-rơ מֹשֶׁה.
- source_word: לֵּאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này dẫn vào nội dung lời nói ở câu kế tiếp; “rằng” truyền đạt chức năng ấy tự nhiên hơn lối dịch sát hình thức “mà nói”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng thay vì thay thế hoàn toàn bằng tước hiệu “CHÚA”. Dạng “Đức Giê-hô-va” có tính nhận diện cao trong truyền thống tiếng Việt, dù “Yahweh” gần với cách phục nguyên học thuật phổ biến hơn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng công thức dẫn lời tự nhiên trong tiếng Việt: “phán với … rằng”.'
