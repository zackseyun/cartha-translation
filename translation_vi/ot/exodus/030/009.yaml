  edition: WLC
  text: לֹא תַעֲל֥וּ עָלָ֛י/ו קְטֹ֥רֶת זָרָ֖ה וְ/עֹלָ֣ה וּ/מִנְחָ֑ה וְ/נֵ֕סֶךְ לֹ֥א תִסְּכ֖וּ עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: vi
  text: Các ngươi không được dâng trên đó hương không đúng quy định[a], lễ thiêu hay lễ vật bằng ngũ cốc; cũng không được đổ lễ quán trên đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hương lạ”, “hương ngoại lai” hoặc “hương không được phép”. Tính từ Hê-bơ-rơ ở đây có thể chỉ thứ nằm ngoài điều được cho phép hoặc quy định trong nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: dâng
  rationale: Dạng Hiphil của עלה có nghĩa đen là “làm cho đi lên”, nhưng trong ngữ cảnh tế lễ, đây là cách nói quen thuộc chỉ việc dâng lễ vật trên bàn thờ.
- source_word: עָלָיו
  choice: trên đó
  rationale: Đại từ chỉ bàn thờ xông hương trong ngữ cảnh trước đó; “trên đó” tự nhiên và giữ nguyên quan hệ không gian.
- source_word: קְטֹרֶת
  choice: hương
  rationale: Danh từ này chỉ chất thơm được đốt làm hương; động từ “dâng” đã làm rõ hành động nghi lễ.
- source_word: זָרָה
  choice: không đúng quy định
  rationale: Trong ngữ cảnh tư tế và thờ phượng, זָרָה chỉ thứ nằm ngoài điều đã được quy định hoặc cho phép. Cách dịch này rõ nghĩa hơn “xa lạ” và không gợi sai rằng vấn đề chủ yếu là nguồn gốc ngoại quốc.
- source_word: וְעֹלָה
  choice: hoặc lễ vật thiêu
  rationale: Trong chuỗi các thứ bị cấm, liên từ được diễn đạt tự nhiên bằng “hoặc”. עֹלָה là lễ vật được thiêu trọn trên bàn thờ.
- source_word: וּמִנְחָה
  choice: hoặc lễ vật ngũ cốc
  rationale: Trong luật tế lễ, מִנְחָה thường chỉ lễ vật làm từ sản phẩm ngũ cốc; cách dịch này cụ thể hơn “lễ vật” nói chung.
- source_word: וְנֵסֶךְ
  choice: lễ quán
  rationale: נֵסֶךְ là lễ vật bằng chất lỏng được rưới ra. “Lễ quán” là thuật ngữ tiếng Việt gọn và chính xác, còn động từ “rưới” giúp người đọc hiểu hành động.
- source_word: תִסְּכוּ
  choice: rưới
  rationale: Trong ngữ cảnh này, נסך chỉ hành động rưới chất lỏng làm lễ quán; “rưới” diễn đạt cụ thể và tự nhiên.
theological_decisions:
- issue: Tính chất của זָרָה khi bổ nghĩa cho hương
  choice: hương không đúng quy định
  alternative: hương lạ; hương ngoại lai; hương không được phép
  rationale: Câu này quy định việc thờ phượng đúng cách tại bàn thờ xông hương. “Không đúng quy định” giữ được trọng tâm tư tế về thứ không phù hợp với điều đã truyền, nhưng không thu hẹp từ này thành vấn đề nguồn gốc ngoại quốc. Chú thích bảo lưu các khả năng từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “các con” để chuyển tải ngôi thứ hai số nhiều trong lời truyền cho cộng đồng; dùng thuật ngữ nghi lễ “lễ vật thiêu”, “lễ vật ngũ cốc” và “lễ quán”, đồng thời để động từ làm rõ hành động.
