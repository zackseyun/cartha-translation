review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc phủ định và các hạng mục tế lễ trong tiếng Hê-bơ-rơ: hương không được quy định, lễ thiêu, lễ vật ngũ cốc và lễ quán. Tuy nhiên, cách gọi ngôi thứ hai “Các con” thêm sắc thái quan hệ không được biểu thị trong riêng câu này; “Các ngươi” trung tính hơn. Động từ תִּסְּכוּ có nghĩa là “đổ/rót ra” một lễ quán; “đổ” sát và tự nhiên hơn “rưới”.'
  naturalness: “Lễ vật thiêu” kém thông dụng hơn “lễ thiêu”, và “lễ vật ngũ cốc” rõ hơn khi thêm “bằng”. “Đổ lễ quán trên đó” là cách diễn đạt nghi lễ mạch lạc, hiện đại mà vẫn giữ thuật ngữ chuẩn.
  terminology: Giữ “hương không đúng quy định” để chuyển tải ý cultic của זָרָה mà không quy thành nguồn gốc dân tộc. Giữ các thuật ngữ “lễ thiêu”, “lễ vật bằng ngũ cốc” và “lễ quán”; chú thích bảo lưu các phương án từ vựng của זָרָה.
  issues:
  - severity: medium
    issue: “Các con” thêm sắc thái quan hệ thân tộc/phụ tử.
    rationale: Ngôi thứ hai số nhiều trong tiếng Hê-bơ-rơ tự nó không nêu sắc thái này. “Các ngươi” giữ ngôi số nhiều mà không bổ sung ý nghĩa.
  - severity: low
    issue: “Rưới lễ quán” chưa sát hành động và hơi kém tự nhiên.
    rationale: נסך trong ngữ cảnh này là đổ/rót ra lễ quán. “Đổ lễ quán” diễn đạt hành động ấy rõ hơn.
  - severity: low
    issue: “Lễ vật thiêu” và “lễ vật ngũ cốc” chưa thật gọn, tự nhiên.
    rationale: “Lễ thiêu” là thuật ngữ tiếng Việt thông dụng hơn cho עֹלָה; “lễ vật bằng ngũ cốc” làm rõ chất liệu của מִנְחָה.
  revised_text: Các ngươi không được dâng trên đó hương không đúng quy định[a], lễ thiêu hay lễ vật bằng ngũ cốc; cũng không được đổ lễ quán trên đó.
