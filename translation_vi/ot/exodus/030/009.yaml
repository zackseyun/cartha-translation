  rationale: Bản sửa dùng ngôi thứ hai số nhiều trung tính, chuẩn hóa các tên gọi tế lễ cho tự nhiên trong tiếng Việt hiện đại, và thay “rưới” bằng “đổ” để phản ánh chính xác động từ chỉ việc đổ lễ quán. Ý nghĩa, tính phủ định và các khả năng dịch của từ chỉ “hương” vẫn được giữ nguyên.
