revisions:
- from: Bất cứ ai pha chế một thứ giống như dầu ấy, hoặc xức dầu ấy trên người không được phép[a], thì sẽ bị loại khỏi dân mình.[b]
  to: Bất cứ ai pha chế một thứ giống như dầu ấy, hoặc lấy một ít dầu ấy xức lên người không được phép[a], thì sẽ bị loại khỏi dân mình[b].
  rationale: Chỉnh nhẹ để biểu đạt rõ מִמֶּנּוּ (“một ít dầu ấy”), tăng độ tự nhiên của cách nói “xức lên người,” và thu hẹp chú thích từ vựng vào đúng hành vi được nói đến. Không thay đổi tính mơ hồ của hình phạt hay phạm vi chức năng của זָר.
  reviewer_model: gpt-5.6-terra
