source:
  edition: WLC
  text: אִ֚ישׁ אֲשֶׁ֣ר יִרְקַ֣ח כָּמֹ֔/הוּ וַ/אֲשֶׁ֥ר יִתֵּ֛ן מִמֶּ֖/נּוּ עַל זָ֑ר וְ/נִכְרַ֖ת מֵ/עַמָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: vi
  text: Bất cứ ai pha chế một thứ giống như dầu ấy, hoặc lấy một ít dầu ấy xức lên người không được phép[a], thì sẽ bị loại khỏi dân mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người lạ,” “người ngoài” hoặc “người thường.” Trong ngữ cảnh tế tự này, từ Hê-bơ-rơ zar thường chỉ người không được phép nhận dầu xức thánh.'
    reason: lexical_alternative
  - marker: b
    text: “Bị loại khỏi dân mình” là một công thức pháp lý giao ước; tại đây bản văn không nói rõ hình phạt ấy được thi hành theo cách nào.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Bất cứ ai
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “người nào,” nhưng trong điều luật này chỉ chung bất kỳ cá nhân nào; “Bất cứ ai” tự nhiên và giữ nguyên hiệu lực pháp lý.
- source_word: יִרְקַח
  choice: pha chế
  rationale: Động từ רקח chỉ việc phối trộn có kỹ thuật một chất thơm; “pha chế” phù hợp với ngữ cảnh dầu xức thánh hơn “pha” hoặc “trộn”.
- source_word: כָּמֹהוּ
  choice: một thứ giống như dầu ấy
  rationale: Cụm từ quy chiếu về dầu xức thánh ở văn cảnh trước và cấm pha chế một thứ tương tự; bổ sung danh từ “dầu” để tiếng Việt rõ nghĩa mà không xác định quá mức mức độ giống nhau.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: hoặc xức dầu ấy
  rationale: נתן על trong ngữ cảnh dầu có nghĩa đặt hoặc dùng trên người; “xức” diễn đạt tự nhiên hành động áp dụng dầu, còn “dầu ấy” thể hiện đại từ chỉ một phần của chất đã nói đến.
- source_word: עַל זָר
  choice: trên người không được phép
  rationale: Trong luật tế tự, זָר thường chỉ người không được phép nhận hoặc sử dụng vật thánh, chứ không nhất thiết là người ngoại quốc. Cách dịch này làm rõ ranh giới thánh mà không gán căn tính sắc tộc.
- source_word: וְנִכְרַת
  choice: thì sẽ bị loại khỏi
  rationale: Đây là công thức pháp lý giao ước chỉ sự đoạn tuyệt nghiêm trọng. “Bị loại khỏi” giữ được ý nghĩa cơ bản nhưng không quyết định cơ chế hình phạt.
- source_word: מֵעַמָּיו
  choice: dân mình
  rationale: Cụm này chỉ cộng đồng mà người vi phạm thuộc về; “dân mình” trực tiếp, trang trọng và phản ánh đại từ số ít trong nguyên văn.
theological_decisions:
- issue: Nghĩa của זָר trong luật thánh chức
  choice: người không được phép
  alternative: người lạ; người ngoài; người thường
  rationale: Văn cảnh nói về quyền được nhận dầu xức thánh, không chủ yếu nói về dân tộc tính. Bản dịch diễn đạt sự thiếu thẩm quyền mà không đồng nhất זָר với người ngoại quốc.
- issue: Tính chất của hình phạt וְנִכְרַת מֵעַמָּיו
  choice: sẽ bị loại khỏi dân mình
  alternative: sẽ bị khai trừ khỏi dân mình; sẽ bị xử tử
  rationale: Nguyên văn dùng một công thức giao ước nhưng không nói rõ tại đây việc “bị loại” diễn ra bằng cách nào. Bản dịch không tự ý xác định đó là khai trừ xã hội, án tử hay hành động trực tiếp của Đức Chúa Trời.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ sắc thái luật lệ. Dùng “pha chế” cho thao tác kỹ thuật và “xức” cho việc dùng dầu trên người. Hai chú thích bảo tồn phạm vi nghĩa của זָר và sự không xác định về cơ chế của hình phạt.
