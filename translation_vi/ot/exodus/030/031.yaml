    issue: «dành cho ta» đối với לִי
    rationale: Giới từ לְ ở đây được dịch sát và trung tính hơn bằng «cho Ta», như tiếng Anh audit «to me». «Dành cho» có thể gợi một sắc thái chỉ định/biệt riêng mạnh hơn nguyên văn.
  - severity: low
    issue: Đại từ thần linh viết thường
    rationale: Trong văn phong Kinh Thánh tiếng Việt trang trọng, lời tự xưng của Đức Chúa Trời nên viết «Ta».
