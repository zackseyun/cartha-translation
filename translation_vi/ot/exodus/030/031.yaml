  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר שֶׁ֠מֶן מִשְׁחַת קֹ֨דֶשׁ יִהְיֶ֥ה זֶ֛ה לִ֖/י לְ/דֹרֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/031.yaml
  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: vi
  text: 'Ngươi hãy nói với con dân Israel rằng: ‘Đây sẽ là dầu xức thánh cho Ta qua mọi thế hệ của các ngươi.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại cho nghĩa tập thể ‘con cái/dân Israel’, không giới hạn vào nam giới.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: dầu xức thánh
  rationale: 'Giữ các thành tố chính của cụm Hê-bơ-rơ: dầu, sự xức và tính thánh; đây cũng là cách nói rõ ràng, trang trọng trong ngữ cảnh nghi lễ.'
- source_word: לִי
  choice: dành cho ta
  rationale: Giữ quan hệ quy hướng/thuộc riêng về Đức Chúa Trời của giới từ לְ, đồng thời tự nhiên hơn lối dịch máy móc ‘cho ta’.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua mọi thế hệ của các ngươi
  rationale: Truyền đạt sự tiếp nối xuyên suốt các thế hệ, phù hợp với nghĩa của לְ trong công thức thời gian này.
theological_decisions:
- issue: Ý nghĩa của לִי trong cụm ‘dầu xức thánh ... cho ta’
  choice: dành cho ta
  alternative: thuộc về ta
  rationale: ‘Dành cho ta’ bảo tồn ý dầu được biệt riêng cho Đức Chúa Trời mà không xác quyết quá mức rằng giới từ chỉ biểu thị quyền sở hữu.
translation_notes:
  register: 'Văn phong trang trọng nhưng dễ hiểu. Dùng ‘ngươi/các ngươi’ để giữ sự chuyển đổi số ít—số nhiều trong nguyên văn: Môi-se được truyền lệnh ở số ít, còn các thế hệ của cộng đồng Israel ở số nhiều.'
