id: EXO.30.6
reference: Exodus 30:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָתַתָּ֤ה אֹת/וֹ֙ לִ/פְנֵ֣י הַ/פָּרֹ֔כֶת אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת אֲשֶׁר֙ עַל הָ֣/עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: vi
  text: Ngươi phải đặt nó trước bức màn ở trước Hòm Chứng Ngôn[b], trước nắp chuộc tội[a] ở trên Chứng Ngôn, là nơi Ta sẽ gặp ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “nắp xá tội”; theo cách gọi truyền thống: “ngai thương xót”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: “Hòm Chứng Ngôn”; câu này dùng “Chứng Ngôn” hai lần. Một số bản dịch theo truyền thống dùng “Hòm Giao Ước”, nhưng từ ở đây có nghĩa là “chứng ngôn”, không phải từ thông thường chỉ “giao ước”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Ngươi phải đặt nó
  rationale: Động từ נָתַן trong chỉ dẫn bố trí đồ thờ mang nghĩa “đặt/để”. “Phải đặt” diễn đạt tự nhiên sức chỉ thị của cấu trúc Hê-bơ-rơ.
- source_word: לִפְנֵי
  choice: trước
  rationale: Giữ cùng một cách dịch cho cả hai lần xuất hiện, vừa gọn vừa thể hiện rõ quan hệ không gian.
- source_word: הַפָּרֹכֶת
  choice: bức màn
  rationale: Chỉ tấm màn ngăn nơi thánh; “bức màn” là cách nói hiện đại, rõ nghĩa và không quá chuyên biệt.
- source_word: אֲרֹן הָעֵדֻת
  choice: Hòm Chứng Ngôn
  rationale: Dịch trực tiếp עֵדוּת là “chứng ngôn”, không đổi thành “giao ước”, vì từ Hê-bơ-rơ tại đây không phải בְּרִית.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Vật này là tấm nắp bằng vàng trên Hòm; cách dịch vừa nêu đúng vật thể vừa giữ mối liên hệ của thuật ngữ với sự chuộc tội.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: là nơi Ta sẽ gặp ngươi
  rationale: Thể Niphal của יעד trong ngữ cảnh này chỉ cuộc gặp đã định. “Nơi” bao hàm tự nhiên yếu tố “ở đó” của שָׁמָּה.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת
  choice: nắp chuộc tội
  alternative: ngai thương xót; nắp xá tội
  rationale: “Nắp chuộc tội” xác định đây là nắp Hòm và giữ sắc thái nghi lễ mà không biến vật này thành một chiếc ngai theo nghĩa đen. Chú thích lưu lại các cách gọi khác.
- issue: Cách dịch עֵדוּת trong tên Hòm
  choice: Chứng Ngôn
  alternative: Chứng Ước; Giao Ước
  rationale: Bản Hê-bơ-rơ dùng עֵדוּת (“chứng ngôn/chứng cứ”), không dùng từ “giao ước”. Vì vậy bản dịch giữ sự phân biệt từ vựng và tránh hòa đồng với cách gọi quen thuộc “Hòm Giao Ước”.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “Ngươi/Ta” phù hợp lời Đức Chúa Trời trực tiếp truyền lệnh cho Môi-se. Cấu trúc lặp “trước ... trước ...” được giữ để phản ánh cú pháp và cách định vị của nguyên văn.
