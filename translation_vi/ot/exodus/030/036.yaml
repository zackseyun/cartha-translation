- from: Ngươi phải nghiền một phần hương ấy thật mịn, rồi đặt một phần trước Chứng Ước trong Lều Hội Kiến, là nơi Ta sẽ gặp ngươi. Hương ấy sẽ là vật chí thánh[a] đối với các ngươi.
  to: Ngươi phải nghiền một phần hương ấy thật mịn, rồi đặt một phần trước Chứng Ước trong Lều Hội Kiến, là nơi Ta sẽ gặp ngươi. Hương ấy sẽ là vật chí thánh[a] đối với các ngươi.
