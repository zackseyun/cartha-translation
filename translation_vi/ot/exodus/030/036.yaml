    issue: Chú thích [a] diễn đạt không chính xác lựa chọn sát chữ cho קֹדֶשׁ קָדָשִׁים.
    rationale: Kết cấu Hê-bơ-rơ là “holy of holies” (nghĩa là cực/chí thánh); việc thêm “vật” trong “thánh của các vật thánh” không phản ánh trực tiếp từ ngữ của nguyên văn và làm chú thích kém chính xác.
