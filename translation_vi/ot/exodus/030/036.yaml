source:
  edition: WLC
  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: vi
  text: Ngươi phải nghiền một phần hương ấy thật mịn, rồi đặt một phần trước Chứng Ước trong Lều Hội Kiến, là nơi Ta sẽ gặp ngươi. Hương ấy sẽ là vật chí thánh[a] đối với các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát: “thánh của các thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  choice: nghiền
  rationale: Động từ שׁחק ở đây chỉ việc làm cho hỗn hợp hương thành bột; “nghiền” tự nhiên và chính xác hơn “đập” trong tiếng Việt hiện đại.
- source_word: מִמֶּנָּה
  choice: một phần hương ấy
  rationale: 'Giới từ kèm đại từ mang nghĩa bộ phận: chỉ lấy một phần hỗn hợp hương. Việc thêm “hương” làm rõ sở chỉ mà không thay đổi ý nghĩa.'
- source_word: הָדֵק
  choice: thật mịn
  rationale: Dạng này nhấn mạnh mức độ nghiền, cho biết hương phải được nghiền thành bột rất mịn.
- source_word: וְנָתַתָּה
  choice: rồi đặt
  rationale: נתן có nghĩa rộng là đặt/để; “đặt” phù hợp với hành động nghi lễ và liên kết tự nhiên với mệnh đề trước.
- source_word: לִפְנֵי הָעֵדֻת
  choice: trước Chứng Ước
  rationale: Giữ nguyên thuật ngữ nghi lễ “Chứng Ước” thay vì diễn giải thành Hòm hoặc các bảng đá, vì câu Hê-bơ-rơ không nêu rõ những vật ấy.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Cách dịch trang trọng, gọn và thể hiện chức năng của nơi Đức Chúa Trời gặp dân Ngài.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: là nơi Ta sẽ gặp ngươi
  rationale: Động từ יעד ở thể Niphal nói đến cuộc gặp đã được định; cách diễn đạt này rõ và tự nhiên, đồng thời giữ đại từ số ít của nguyên văn.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Kết cấu Hê-bơ-rơ biểu thị mức độ thánh cao nhất. “Vật chí thánh” vừa tự nhiên trong tiếng Việt vừa thích hợp với sở chỉ là hương.
- source_word: תִּהְיֶה לָכֶם
  choice: sẽ là ... đối với các ngươi
  rationale: Giữ quan hệ được diễn tả bằng ל và giữ số nhiều của đại từ, không diễn giải quá mức thành quyền sở hữu.
theological_decisions:
- issue: Sở chỉ của “Chứng Ước”
  choice: Giữ thuật ngữ “Chứng Ước” trong chính văn.
  alternative: Hòm Chứng Ước; các bảng giao ước
  rationale: Nguyên văn chỉ nói הָעֵדֻת, không nói rõ Hòm hay các bảng đá; cách dịch này bảo toàn độ mở của câu.
- issue: Cách diễn đạt mức độ thánh cao nhất
  choice: Dịch קֹדֶשׁ קָדָשִׁים là “vật chí thánh” trong chính văn.
  alternative: thánh của các vật thánh
  rationale: “Vật chí thánh” truyền đạt tự nhiên ý nghĩa cao nhất, còn cách cấu tạo sát chữ được ghi trong chú thích để người đọc thấy hình thức Hê-bơ-rơ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Ngươi” phản ánh đối tượng số ít trong lời truyền trực tiếp, còn “các ngươi” ở cuối câu giữ sự chuyển sang số nhiều của nguyên văn. Các thuật ngữ nghi lễ được viết hoa nhất quán.
