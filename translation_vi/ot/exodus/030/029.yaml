  text: וְ/קִדַּשְׁתָּ֣ אֹתָ֔/ם וְ/הָי֖וּ קֹ֣דֶשׁ קָֽדָשִׁ֑ים כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִקְדָּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: vi
  text: Hãy thánh hiến các vật ấy, và chúng sẽ là những vật chí thánh. Bất cứ ai hay vật gì chạm đến chúng sẽ trở nên thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ là thánh” hoặc “sẽ được thánh hiến.” Tiếng Hê-bơ-rơ ở đây có thể diễn tả việc trở nên thánh do tiếp xúc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: Con phải thánh hiến
  rationale: Dạng Piel của קדשׁ trong bối cảnh nghi lễ có nghĩa là làm cho nên thánh hoặc biệt riêng cho mục đích thánh. “Thánh hiến” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại; “con” thể hiện lời Đức Chúa Trời trực tiếp phán với Môi-se trong văn mạch.
- source_word: אֹתָם
  choice: các vật ấy
  rationale: Đại từ số nhiều chỉ các vật dụng của Đền Tạm vừa được kể trong văn mạch. Nói rõ “các vật ấy” tự nhiên hơn “chúng” ở lần nhắc đầu tiên và không thêm đối tượng ngoài văn mạch.
- source_word: וְהָיוּ
  choice: và chúng sẽ trở nên
  rationale: Mệnh đề diễn tả tình trạng đạt được sau hành động thánh hiến. “Sẽ trở nên” truyền đạt sắc thái kết quả trong tiếng Việt mà vẫn giữ quan hệ liên hợp của וְ.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: chí thánh
  rationale: Kết cấu danh từ lặp theo kiểu tối thượng cấp Hê-bơ-rơ diễn tả mức độ thánh cao nhất. “Chí thánh” ngắn gọn, trang trọng và không khiến người đọc hiểu lầm đây là tên của một không gian như “Nơi Chí Thánh”.
- source_word: כָּל הַנֹּגֵעַ
  choice: Bất cứ ai hoặc vật gì chạm đến
  rationale: כָּל kết hợp với phân từ có phạm vi khái quát. Cách dịch “ai hoặc vật gì” giữ rõ khả năng bao gồm cả người lẫn vật, thay vì âm thầm giới hạn đối tượng.
- source_word: בָּהֶם
  choice: chúng
  rationale: Đại từ giới từ quy chiếu về các vật đã được thánh hiến; “chúng” rõ và tự nhiên sau khi tiền ngữ đã được nêu.
- source_word: יִקְדָּשׁ
  choice: sẽ trở nên thánh
  rationale: Dạng Qal chưa hoàn thành có thể được hiểu theo sắc thái khởi phát hoặc kết quả. “Trở nên thánh” diễn tả sự thay đổi tình trạng do tiếp xúc, đồng thời chú thích ghi nhận cách hiểu “sẽ là thánh” hoặc “sẽ được thánh hiến”.
theological_decisions:
- issue: Ý nghĩa của sự thánh khi tiếp xúc với các vật đã được thánh hiến
  choice: Bản dịch nói rằng người hoặc vật chạm đến chúng sẽ trở nên thánh, nhưng không xác định tình trạng ấy là có lợi, nguy hiểm hay kéo theo những hạn chế nghi lễ.
  alternative: Có thể hiểu sự tiếp xúc là một hành động thánh hiến tích cực, hoặc là đưa người/vật tiếp xúc vào phạm vi của sự thánh và những đòi hỏi hay nguy hiểm liên quan.
  rationale: Bản Hê-bơ-rơ chỉ khẳng định יִקְדָּשׁ, không giải thích hệ quả nghi lễ. Vì vậy bản dịch giữ nguyên sức căng thần học thay vì giải quyết nó bằng một cách diễn giải.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thánh hiến” cho ngữ cảnh nghi lễ, “chí thánh” cho kết cấu tối thượng cấp, và nói rõ “ai hoặc vật gì” để giữ phạm vi khái quát của nguyên văn.
