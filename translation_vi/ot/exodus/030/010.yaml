base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: vi
  text: A-rôn phải làm lễ chuộc tội trên các sừng của bàn thờ mỗi năm một lần. Dùng huyết của lễ vật chuộc tội dùng cho việc chuộc tội[a], ông phải làm lễ chuộc tội cho bàn thờ mỗi năm một lần, qua mọi thế hệ của các ngươi. Bàn thờ là vật chí thánh, thuộc về Đức Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ dịch sát là “lễ vật chuộc tội của những sự chuộc tội”; cũng có thể hiểu là “lễ vật chuộc tội dùng trong nghi thức chuộc tội.”
    reason: Giữ lại cấu trúc số nhiều và độ mơ hồ của הַכִּפֻּרִים, vốn khó chuyển nguyên dạng sang tiếng Việt tự nhiên.
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: làm lễ chuộc tội
  rationale: Trong văn cảnh tế lễ, כפר chỉ việc cử hành nghi thức chuộc tội; cách dịch này tự nhiên hơn “che phủ” và vẫn giữ sắc thái nghi lễ.
- source_word: קַרְנֹתָיו
  choice: các sừng của bàn thờ
  rationale: Hậu tố chỉ bàn thờ xông hương trong văn cảnh ngay trước đó; nêu rõ “bàn thờ” giúp tiếng Việt tránh đại từ mơ hồ.
- source_word: אַחַת בַּשָּׁנָה
  choice: mỗi năm một lần
  rationale: Diễn đạt tự nhiên, chính xác tần suất của nghi thức.
- source_word: מִדַּם
  choice: lấy huyết ... mà
  rationale: Giới từ מִן theo nghĩa phương tiện trong văn cảnh tế lễ; cấu trúc này là tiếng Việt tự nhiên và cho thấy huyết được dùng để cử hành nghi thức.
- source_word: חַטַּאת
  choice: lễ vật chuộc tội
  rationale: Ở đây חטאת chỉ tế lễ chứ không phải khái niệm tội lỗi trừu tượng.
- source_word: הַכִּפֻּרִים
  choice: dùng cho việc chuộc tội
  rationale: Chuyển số nhiều trừu tượng của tiếng Hê-bơ-rơ sang cách nói tiếng Việt dễ hiểu mà không tự ý xác định đây là tên một ngày lễ; dạng sát chữ được ghi trong chú thích.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của anh em
  rationale: Giữ ý quy định tiếp tục áp dụng qua những thế hệ kế tiếp; “anh em” diễn đạt ngôi thứ hai số nhiều hướng đến cộng đồng.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Cấu trúc lặp danh từ biểu thị bậc cao nhất của sự thánh khiết; “chí thánh” tránh nhầm với tên gọi Nơi Chí Thánh.
- source_word: לַיהוָה
  choice: đối với Đức Yahweh
  rationale: Giữ danh riêng giao ước יהוה và diễn đạt quan hệ thánh hiến bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Ý nghĩa nghi lễ của כפר
  choice: làm lễ chuộc tội
  alternative: thanh tẩy
  rationale: Câu nói đến nghi thức dùng huyết trên bàn thờ; “làm lễ chuộc tội” giữ thuật ngữ rộng và không thu hẹp hành động chỉ còn sự thanh tẩy.
- issue: Cách thể hiện יהוה
  choice: Đức Yahweh
  alternative: Đức Chúa / Đức Giê-hô-va
  rationale: Dùng hình thức phiên âm trực tiếp của danh giao ước thay vì thay bằng tước hiệu hoặc dạng phiên âm bắt nguồn từ “Jehovah”.
- issue: Đối tượng được chuộc tội trong יְכַפֵּר עָלָיו
  choice: cho bàn thờ
  alternative: trên bàn thờ
  rationale: Đại từ giống đực số ít quy chiếu về bàn thờ; “cho bàn thờ” bảo toàn việc chính bàn thờ là đối tượng của nghi thức mà không giải thích thêm cơ chế thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “huyết” thay cho “máu” vì đây là văn cảnh tế lễ; lặp “mỗi năm một lần” theo nguyên văn để giữ sự nhấn mạnh. Bổ sung danh từ “bàn thờ” tại các vị trí đại từ tiếng Hê-bơ-rơ quy chiếu đến bàn thờ nhằm tránh cách dùng “nó” thiếu trang trọng và mơ hồ.
