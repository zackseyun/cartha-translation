- from: Mỗi năm một lần, A-rôn phải làm lễ chuộc tội trên các sừng của bàn thờ. Ông phải lấy huyết của lễ vật chuộc tội dùng cho việc chuộc tội[a] mà làm lễ chuộc tội cho bàn thờ, mỗi năm một lần, trải qua các thế hệ của anh em. Bàn thờ là vật chí thánh đối với Đức Yahweh.
  to: A-rôn phải làm lễ chuộc tội trên các sừng của bàn thờ mỗi năm một lần. Dùng huyết của lễ vật chuộc tội dùng cho việc chuộc tội[a], ông phải làm lễ chuộc tội cho bàn thờ mỗi năm một lần, qua mọi thế hệ của các ngươi. Bàn thờ là vật chí thánh, thuộc về Đức Yahweh.
