    rationale: Cụm này không phải cách nói hiện đại tự nhiên cho לְדֹרֹתֵיכֶם và làm yếu đi ngôi thứ hai số nhiều của bản gốc. Nên dùng “qua mọi thế hệ của các ngươi.”
  - severity: low
    issue: “đối với Đức Yahweh”
    rationale: Giới từ “đối với” mơ hồ và không tự nhiên khi mô tả tình trạng thánh hiến của bàn thờ. “Thuộc về Đức Yahweh” truyền đạt tốt hơn quan hệ của לַיהוָה.
  - severity: low
    issue: Cấu trúc “phải lấy huyết ... mà làm lễ”
    rationale: Dù hiểu được, cấu trúc này kém trôi chảy. “Dùng huyết ... ông phải làm lễ...” diễn đạt rõ nghĩa phương tiện của מִדַּם.
