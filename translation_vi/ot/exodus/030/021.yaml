revisions:
- from: Họ phải rửa tay và chân để khỏi chết. Đây sẽ là quy định lâu dài[a] cho họ, cho ông[b] và dòng dõi ông qua các thế hệ.
  to: Họ phải rửa tay và chân để khỏi chết. Đây sẽ là quy định đời đời[a] cho họ, cho ông[b] và dòng dõi ông qua các thế hệ của họ.
  rationale: Thay “lâu dài” bằng “đời đời” để chuyển tải đầy đủ hơn công thức חָק עוֹלָם, đồng thời giữ chú thích để làm rõ sắc thái công thức pháp lý mà không áp đặt một diễn giải thần học ngoài ngữ cảnh. Bổ sung “của họ” để phản ánh hậu tố số nhiều trong לְדֹרֹתָם. Các yếu tố còn lại được giữ nguyên vì trung thành với bản Hê-bơ-rơ và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:50:33Z'
review_pass:
