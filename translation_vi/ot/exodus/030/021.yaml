source:
  edition: WLC
  text: וְ/רָחֲצ֛וּ יְדֵי/הֶ֥ם וְ/רַגְלֵי/הֶ֖ם וְ/לֹ֣א יָמֻ֑תוּ וְ/הָיְתָ֨ה לָ/הֶ֧ם חָק עוֹלָ֛ם ל֥/וֹ וּ/לְ/זַרְע֖/וֹ לְ/דֹרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: vi
  text: Họ phải rửa tay và chân để khỏi chết. Đây sẽ là quy định đời đời[a] cho họ, cho ông[b] và dòng dõi ông qua các thế hệ của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể diễn đạt là “quy định lâu dài” hoặc “quy định vĩnh viễn”. Cụm Hê-bơ-rơ חָק עוֹלָם là một công thức pháp lý chỉ một quy định có hiệu lực thường trực.
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh gần, “ông” chỉ A-rôn.
    reason: referent_clarification
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: Họ phải rửa
  rationale: Trong ngữ cảnh luật nghi lễ, động từ mang lực mệnh lệnh. “Phải rửa” tự nhiên trong tiếng Việt hiện đại và diễn đạt rõ nghĩa vụ.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: tay và chân
  rationale: Dịch trực tiếp hai bộ phận cơ thể được nêu, với chủ thể số nhiều “họ” đã thể hiện ý sở hữu.
- source_word: וְלֹא יָמֻתוּ
  choice: để khỏi chết
  rationale: 'Diễn đạt tự nhiên quan hệ mục đích hoặc hệ quả trong ngữ cảnh: việc rửa ngăn họ khỏi chịu chết.'
- source_word: חָק עוֹלָם
  choice: quy định lâu dài
  rationale: חָק chỉ một quy định có tính luật lệ; עוֹלָם trong công thức pháp lý nhấn mạnh hiệu lực bền vững. Cách dịch này giữ sức nặng của công thức mà không áp đặt nghĩa triết học về thời gian vô tận.
- source_word: לָהֶם
  choice: cho họ
  rationale: Giữ đại từ số nhiều của bản Hê-bơ-rơ, chỉ A-rôn và các con trai ông trong ngữ cảnh.
- source_word: לּוֹ
  choice: cho ông
  rationale: Giữ sự chuyển sang đại từ số ít trong bản nguồn thay vì thay thẳng bằng tên riêng; đối tượng gần nhất trong ngữ cảnh là A-rôn.
- source_word: וּלְזַרְעוֹ
  choice: và dòng dõi ông
  rationale: זֶרַע là danh từ tập hợp chỉ hậu duệ. “Dòng dõi” tự nhiên, trang trọng và phù hợp với tính liên thế hệ của câu.
- source_word: לְדֹרֹתָם
  choice: qua các thế hệ
  rationale: Diễn đạt sự tiếp nối của quy định từ thế hệ này sang thế hệ khác.
theological_decisions:
- issue: Thời hạn của quy định nghi lễ trong cụm חָק עוֹלָם
  choice: quy định lâu dài
  alternative: quy định đời đời; quy định vĩnh viễn
  rationale: Cụm Hê-bơ-rơ là công thức pháp lý về một quy định bền vững. “Lâu dài” bảo toàn lực kéo dài của câu mà không tự ý xác định phạm vi thần học vượt quá ngữ cảnh giao ước và nghi lễ.
- issue: Đối tượng của đại từ số ít לּוֹ
  choice: giữ là “ông” và chú thích rằng ngữ cảnh chỉ A-rôn
  alternative: dịch minh thị là “A-rôn”
  rationale: Giữ hình thức đại từ của bản nguồn và không xóa sự chuyển đổi từ số nhiều “họ” sang số ít “ông”.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “phải” để truyền đạt lực mệnh lệnh, “để khỏi chết” cho tự nhiên, và giữ cả đại từ số nhiều lẫn số ít của bản Hê-bơ-rơ thay vì làm phẳng cấu trúc.
