    rationale: “Lâu dài” chỉ thời gian kéo dài không xác định, trong khi công thức Hê-bơ-rơ chỉ một quy định có tính thường trực/đời đời. “Đời đời” giữ lực ngữ nghĩa của nguồn; chú thích có thể giải thích đây là công thức pháp lý.
