base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: vi
  text: Ngươi phải chế hỗn hợp ấy thành hương[a], được pha chế theo kỹ thuật của người điều chế hương, được trộn với muối[b], tinh sạch và thánh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một hợp chất thơm” hoặc “một hỗn hợp hương liệu.” Tiếng Hê-bơ-rơ nhấn mạnh một chế phẩm thơm được pha trộn cẩn thận.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ướp muối” hoặc “có pha muối.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “thiêng liêng.” Tiếng Hê-bơ-rơ ở câu này chỉ nói “thánh,” không nói “chí thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  choice: Ngươi phải chế hỗn hợp ấy thành
  rationale: Trong văn cảnh chỉ thị, động từ diễn đạt mệnh lệnh. Đại từ giống cái số ít chỉ về hỗn hợp các hương liệu ở câu trước; diễn đạt rõ là “hỗn hợp ấy” giúp tiếng Việt tự nhiên mà không thêm một đối tượng mới.
- source_word: קְטֹרֶת
  choice: hương
  rationale: Danh từ chỉ loại hương liệu được chế để đốt trong nghi lễ. “Hương” là cách gọi ngắn gọn, quen thuộc và phù hợp văn cảnh thờ phượng.
- source_word: רֹקַח מַעֲשֵׂה רוֹקֵחַ
  choice: pha trộn theo tài nghệ của thợ điều hương
  rationale: Cụm từ nhấn mạnh một hợp chất thơm được người thợ chuyên môn pha chế. Cách dịch này giữ cả ý pha trộn lẫn tính khéo léo nghề nghiệp mà không lặp từ vụng về trong tiếng Việt.
- source_word: מְמֻלָּח
  choice: có pha muối
  rationale: Phân từ thụ động từ căn từ liên hệ đến muối, theo nghĩa trực tiếp nhất là được trộn hoặc nêm bằng muối. “Có pha muối” tự nhiên hơn “được muối hóa” và phù hợp với một hỗn hợp hương liệu.
- source_word: טָהוֹר
  choice: tinh sạch
  rationale: Trong văn cảnh vật liệu dùng cho nghi lễ, “tinh sạch” bao hàm cả độ thuần khiết của vật liệu và sự thanh sạch thích hợp cho việc thánh.
- source_word: קֹדֶשׁ
  choice: thánh
  rationale: Từ Hê-bơ-rơ đơn thuần chỉ điều được biệt riêng là thánh. “Thánh” giữ nguyên sắc thái tôn giáo và không tăng cấp thành “chí thánh”.
theological_decisions:
- issue: Địa vị nghi lễ của hương
  choice: thánh
  alternative: thiêng liêng; chí thánh
  rationale: Nguyên văn dùng קֹדֶשׁ, không có cấu trúc cường điệu mang nghĩa “chí thánh.” Vì vậy bản dịch giữ “thánh,” không áp đặt một cấp độ nghi lễ mạnh hơn điều câu này trực tiếp nói.
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “ngươi” để duy trì giọng phán truyền trực tiếp trong luật nghi lễ; câu văn gọn, dễ hiểu, đồng thời giữ các thuật ngữ thờ phượng “hương,” “tinh sạch” và “thánh.”
