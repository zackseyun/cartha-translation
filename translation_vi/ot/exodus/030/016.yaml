  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: vi
  text: Ngươi phải lấy tiền chuộc tội từ con cái Israel[a] và dùng số tiền ấy cho công việc phục vụ tại Lều Hội Kiến. Số tiền đó sẽ là vật tưởng niệm cho con cái Israel trước mặt Yahweh, để chuộc tội cho mạng sống của các ngươi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ các con trai của Israel”; cụm từ này ở đây chỉ dân Israel nói chung.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “cho các mạng sống của các ngươi”; từ Hê-bơ-rơ này có thể chỉ mạng sống, bản thân hoặc con người, và đôi khi được dịch là “linh hồn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: tiền chuộc tội
  rationale: כֶּסֶף có thể chỉ bạc hoặc tiền; trong ngữ cảnh này là khoản tiền thu khi kiểm tra dân số. הַכִּפֻּרִים chỉ sự chuộc tội. “Tiền chuộc tội” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái nghi lễ.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: từ con cái Israel
  rationale: בְּנֵי יִשְׂרָאֵל theo hình thức là “các con trai/con cái của Israel”, nhưng ở đây chỉ toàn thể cộng đồng giao ước; “con cái Israel” là cách diễn đạt trang trọng, quen thuộc và bao quát trong tiếng Việt.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: cho công việc phục vụ tại Lều Hội Kiến
  rationale: עַל ở đây biểu thị sự phân bổ theo mục đích; עֲבֹדָה có nghĩa là công việc hay sự phục vụ, và trong ngữ cảnh nơi thánh là công việc phục vụ. “Tại” diễn đạt tự nhiên nơi công việc ấy được thực hiện.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: sẽ là vật nhắc nhớ
  rationale: זִכָּרוֹן là vật hoặc dấu dùng để ghi nhớ, tưởng niệm. “Vật nhắc nhớ” dễ hiểu và giữ được chức năng nghi lễ mà không hàm ý đây chỉ là một kỷ vật cá nhân.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Đây là thành ngữ nghi lễ chỉ sự hiện diện của Đức Chúa Trời. “Trước mặt” bảo toàn hình thức và ý nghĩa của tiếng Hê-bơ-rơ.
- source_word: לְכַפֵּר
  choice: để chuộc tội
  rationale: Động từ כפר ở thể piel trong văn cảnh tư tế chỉ hành động thực hiện sự chuộc tội. “Chuộc tội” là cách nói rõ ràng và quen thuộc hơn “xá tội” hay thuật ngữ hàn lâm.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: cho mạng sống của các ngươi
  rationale: נֶפֶשׁ tại đây chỉ sinh mạng hoặc chính con người, không nhất thiết chỉ một linh hồn tách khỏi thân thể. “Mạng sống” phù hợp với bối cảnh khoản tiền bảo toàn dân khỏi tai họa khi kiểm tra dân số.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יְהוָה. “Yahweh” bảo toàn việc đây là danh riêng, thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel / người Israel
  rationale: Danh từ ở dạng giống đực số nhiều nhưng trong ngữ cảnh chỉ toàn dân giao ước. “Con cái Israel” giữ mối liên hệ gia tộc với Israel mà không khiến độc giả hiểu sai rằng chỉ nam giới được nói đến.
- issue: Phạm vi ý nghĩa của נֶפֶשׁ trong công thức chuộc tội
  choice: mạng sống
  alternative: linh hồn / chính bản thân
  rationale: Ngữ cảnh kiểm tra dân số và nguy cơ tai họa thiên về sinh mạng của người nộp tiền. Cách dịch này tránh áp đặt quan niệm phân đôi thân thể–linh hồn không được từ ngữ này tự nó xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “ngươi/các ngươi” giữ lời truyền trực tiếp cho Môi-se và cộng đồng trong văn mạch luật pháp. “Lều Hội Kiến” được viết hoa như tên gọi quy ước của nơi thánh.
