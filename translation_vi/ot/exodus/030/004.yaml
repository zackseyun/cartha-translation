base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: vi
  text: Ngươi phải làm hai khoen vàng cho bàn thờ, bên dưới gờ viền của nó[a]. Ngươi phải làm chúng trên hai mặt bên của nó, ở hai bên của nó[b]; chúng sẽ là chỗ luồn các đòn[c] để khiêng bàn thờ bằng các đòn ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dưới đường viền” hoặc “bên dưới vành”; từ Hê-bơ-rơ זֵר chỉ phần viền trang trí quanh bàn thờ.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trên hai mặt bên của nó ... ở hai bên của nó”; cách diễn đạt lặp này nhấn mạnh rằng các khoen được đặt ở cả hai bên.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “chúng sẽ là những ngôi nhà cho các đòn”, nghĩa là nơi tiếp nhận hoặc chỗ luồn các đòn dùng để khiêng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: hai khoen vàng
  rationale: “Khoen” chỉ vòng dùng để luồn hoặc gắn đòn, tự nhiên và chính xác hơn “nhẫn” trong ngữ cảnh đồ dùng Đền Tạm; giữ rõ chất liệu vàng.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: ở dưới đường viền
  rationale: זֵר là phần viền trang trí chạy quanh bàn thờ. “Đường viền” vừa dễ hiểu vừa không xác định quá mức hình dạng của chi tiết này.
- source_word: צַלְעֹתָיו
  choice: hai vách bên
  rationale: צֵלָע ở đây chỉ các phần kết cấu bên của bàn thờ. “Vách bên” cụ thể hơn “cạnh” nhưng không hàm ý quá mức như “tấm vách”.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: ở hai bên của bàn thờ
  rationale: Giữ sự lặp lại có chủ ý trong tiếng Hê-bơ-rơ nhằm nhấn mạnh vị trí đối xứng ở cả hai bên.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: chúng sẽ là chỗ luồn các đòn
  rationale: בָּתִּים, nghĩa đen là “những ngôi nhà”, được dùng theo nghĩa ổ hoặc chỗ tiếp nhận. “Chỗ luồn” diễn đạt rõ chức năng của các khoen trong tiếng Việt hiện đại.
- source_word: בַדִּים
  choice: các đòn
  rationale: Trong ngữ cảnh vận chuyển đồ dùng Đền Tạm, בַּד chỉ các đòn dùng để khiêng; “đòn” tự nhiên và gọn hơn “cây đòn”.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: để khiêng bàn thờ bằng các đòn ấy
  rationale: Giữ cả ý mục đích của động từ nguyên mẫu và ý phương tiện của đại từ בָּהֵמָּה; lặp “bàn thờ” để tránh đại từ mơ hồ trong tiếng Việt.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: Ngươi phải làm ... Hãy làm
  rationale: Thể hiện sắc thái mệnh lệnh của chỉ thị và giữ động từ lặp lại, đồng thời tránh câu tiếng Việt quá nặng nề.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp với lời chỉ dẫn trực tiếp. Dùng “ngươi” để duy trì lối xưng hô số ít trong chỉ thị dành cho Môi-se; dùng “bàn thờ” thay cho đại từ ở vài vị trí để câu tiếng Việt không mơ hồ. Các ký hiệu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
