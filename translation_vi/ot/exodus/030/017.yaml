  source_fidelity: 'Bản dịch truyền đạt đúng công thức dẫn lời trong tiếng Hê-bơ-rơ: Yahweh là chủ ngữ, «phán với Môi-se», và «rằng» dẫn vào lời trực tiếp ở câu sau. «Phán» phù hợp với וַיְדַבֵּר trong văn cảnh trang trọng; dấu hai chấm cũng thích hợp vì lời phán tiếp tục ở câu kế tiếp.'
