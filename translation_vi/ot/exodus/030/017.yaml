  yaml_path: translation/ot/exodus/030/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Nêu dạng chữ của danh Đức Chúa Trời và cách dịch truyền thống để người đọc nhận biết lựa chọn bản dịch.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ wayyiqtol của דבר tiếp diễn mạch thuật chuyện. Trong công thức dẫn lời này, “phán” là cách diễn đạt tiếng Việt tự nhiên và trang trọng khi chủ thể là Đức Chúa Trời; không cần dịch riêng liên từ וַ vì câu tiếng Việt vẫn nối tiếp rõ ràng theo văn cảnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Sau động từ “phán”, “với” là giới từ tự nhiên trong tiếng Việt để chỉ người tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tên riêng Hê-bơ-rơ מֹשֶׁה.
- source_word: לֵּאמֹר
  choice: rằng
  rationale: Trong công thức דבר ... לאמר, “rằng” tự nhiên hơn lối dịch sát chữ “nói rằng” và làm nhiệm vụ dẫn vào lời trực tiếp ở câu kế tiếp.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Giữ “Yahweh” bảo tồn tư cách tên riêng và không biến nó thành tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán ... rằng” giữ sắc thái công thức dẫn lời trong nguyên văn mà không tạo câu tiếng Việt nặng nề; dấu hai chấm báo trước lời phán tiếp theo.
