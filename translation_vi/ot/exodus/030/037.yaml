  text: וְ/הַ/קְּטֹ֨רֶת֙ אֲשֶׁ֣ר תַּעֲשֶׂ֔ה בְּ/מַ֨תְכֻּנְתָּ֔/הּ לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם קֹ֛דֶשׁ תִּהְיֶ֥ה לְ/ךָ֖ לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: vi
  text: Hương mà ngươi làm theo công thức của nó[a], các ngươi không được pha chế cho mình[b]; ngươi phải coi đó là vật thánh, dành cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo tỷ lệ của nó” hoặc “theo thành phần của nó”.'
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là không được pha chế lại hỗn hợp hương thánh này để dùng vào mục đích thông thường của riêng mình.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: loại hương
  rationale: Chỉ hỗn hợp hương thánh được mô tả trong văn cảnh ngay trước đó. “Loại hương” tự nhiên trong tiếng Việt và không thêm ý “thơm” vốn không được nói rõ tại câu này.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: mà ngươi sẽ làm
  rationale: Giữ mệnh đề quan hệ và sắc thái chỉ dẫn hướng đến hành động phải thực hiện; đại từ số ít phản ánh động từ Hê-bơ-rơ số ít.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: theo đúng thành phần ấy
  rationale: מַתְכֹּנֶת ở đây chỉ thành phần, công thức hoặc tỷ lệ đã được ấn định. “Theo đúng thành phần” truyền đạt tính quy định mà không mang sắc thái khoa học hiện đại quá mức.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: các ngươi không được làm cho mình
  rationale: Giữ sự chuyển sang động từ số nhiều trong nguyên văn và mệnh lệnh cấm làm hỗn hợp này cho chính cộng đồng, tức cho mục đích riêng.
- source_word: קֹדֶשׁ תִּהְיֶה לְךָ
  choice: Ngươi phải xem nó là thánh
  rationale: Diễn đạt tự nhiên ý rằng đối tượng nghe phải coi hỗn hợp ấy là thánh, đồng thời giữ số ít của לְךָ. “Phải xem” thể hiện giá trị mệnh lệnh trong ngữ cảnh mà không làm mất phạm trù “thánh”.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ לְ biểu thị sự biệt riêng, quy thuộc hoặc dâng dành cho; “dành cho” phù hợp với tình trạng thánh của hương. Danh giao ước יהוה được phiên là “Yahweh”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của sự thánh biệt đối với hỗn hợp hương
  choice: là thánh, dành cho Yahweh
  alternative: thuộc riêng về Yahweh như vật thánh
  rationale: Bản dịch giữ cả קֹדֶשׁ và לַיהוָה, thể hiện địa vị thánh và sự dành riêng cho Yahweh mà không khai triển thành một khẳng định thần học vượt quá câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự chuyển đổi số ít–số nhiều trong nguyên văn bằng “ngươi” và “các ngươi”. Cấu trúc được điều chỉnh vừa đủ để câu tiếng Việt tự nhiên, đồng thời bảo tồn địa vị thánh và sự dành riêng của hương.
