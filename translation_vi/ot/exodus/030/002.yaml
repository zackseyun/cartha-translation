base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: vi
  text: Chiều dài của bàn thờ phải là một cu-bít[a], chiều rộng phải là một cu-bít; bàn thờ phải có dạng vuông, và chiều cao phải là hai cu-bít. Các sừng của bàn thờ phải liền một khối với bàn thờ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một cu-bít là đơn vị đo chiều dài cổ, xấp xỉ 45 cm; độ dài cụ thể có thể thay đổi tùy hệ đo.
    reason: ancient_measure
  - marker: b
    text: 'Theo nghĩa đen: “từ nó”; tức là các sừng được làm liền với chính bàn thờ, chứ không gắn riêng vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה / אַמָּתַיִם
  choice: cu-bít / hai cu-bít
  rationale: Giữ đơn vị đo cổ thay vì quy đổi thành một con số hiện đại có vẻ chính xác hơn mức chứng cứ cho phép; dạng số đôi אַמָּתַיִם chỉ rõ hai cu-bít.
- source_word: אָרְכּוֹ
  choice: chiều dài của bàn thờ
  rationale: Hậu tố ngôi ba số ít giống đực chỉ về bàn thờ trong ngữ cảnh; nêu lại “bàn thờ” giúp câu tiếng Việt rõ ràng.
- source_word: רָחְבּוֹ
  choice: chiều rộng
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt hiện đại đối với kích thước của một vật.
- source_word: רָבוּעַ
  choice: vuông
  rationale: Diễn đạt trực tiếp hình dạng có chiều dài và chiều rộng bằng nhau, không dùng lối nói cổ hoặc nặng tính kỹ thuật.
- source_word: יִהְיֶה
  choice: phải
  rationale: Dạng vị hoàn thành ở đây mang ý nghĩa quy định trong lời chỉ dẫn chế tác; “phải” truyền đạt tự nhiên sắc thái bắt buộc ấy.
- source_word: קֹמָתוֹ
  choice: chiều cao
  rationale: Tương đương phù hợp trong ngữ cảnh kiến trúc/chế tác.
- source_word: מִמֶּנּוּ
  choice: liền một khối với bàn thờ
  rationale: Nghĩa đen là “từ nó”; trong ngữ cảnh chế tác, cụm này cho biết các sừng hình thành từ chính bàn thờ, không phải các bộ phận gắn rời.
- source_word: קַרְנֹתָיו
  choice: các sừng của bàn thờ
  rationale: Giữ hình ảnh và thuật ngữ thờ phượng chỉ các phần nhô ra như sừng ở bàn thờ; nêu rõ sở thuộc để tiếng Việt không mơ hồ.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng tự nhiên, dùng “bàn thờ” thay đại từ ở những chỗ cần thiết để tránh tối nghĩa. Giữ đơn vị cổ “cu-bít” và giải thích bằng chú thích; giữ thuật ngữ “sừng” để bảo toàn hình ảnh nghi lễ và các liên hệ liên văn bản.
