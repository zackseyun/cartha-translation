reference: Exodus 30:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: vi
  text: 'Đây là điều mỗi người được kiểm kê[a] phải nộp: nửa siếc-lơ, theo siếc-lơ chuẩn của nơi thánh (một siếc-lơ là hai mươi ghê-ra)—nửa siếc-lơ là một lễ vật dâng cho Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “mỗi người đi qua để nhập vào số những người đã được ghi đếm”; cụm từ Hê-bơ-rơ này là một cách nói dùng trong việc kiểm kê dân số.'
    reason: Giữ lại hình ảnh và khả năng diễn đạt sát chữ của thành ngữ kiểm kê trong nguyên văn.
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: Đây là điều ... phải nộp
  rationale: Công thức chỉ định mở đầu một nghĩa vụ pháp lý. “Phải nộp” diễn đạt tự nhiên hành động đóng khoản tiền đã quy định trong ngữ cảnh kiểm kê.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: mỗi người được kiểm kê
  rationale: Cụm Hê-bơ-rơ, sát nghĩa là người “đi qua/được tính vào” những người đã được ghi đếm, là một thành ngữ liên quan đến việc kiểm kê dân số. Bản dịch chính truyền đạt ý nghĩa trong ngữ cảnh; chú thích giữ cách hiểu sát chữ.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: nửa siếc-lơ
  rationale: Cách gọi rõ ràng, quen dùng trong tiếng Việt cho đơn vị trọng lượng và tiền tệ cổ này.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ chuẩn của nơi thánh
  rationale: Giới từ בְּ chỉ tiêu chuẩn đo lường. Thêm “chuẩn” làm rõ đây là mức cân theo tiêu chuẩn của nơi thánh, không phải một vật được mô tả đơn thuần là thánh.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: một siếc-lơ là hai mươi ghê-ra
  rationale: Giữ chức năng giải thích của mệnh đề chen giữa và diễn đạt tự nhiên trong tiếng Việt.
- source_word: תְּרוּמָה לַיהוָה
  choice: làm lễ vật dâng lên Yahweh
  rationale: תְּרוּמָה là phần đóng góp được biệt riêng để dâng cho Đức Chúa Trời; “lễ vật” giữ sắc thái thờ phượng mà vẫn dễ hiểu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng trong nguyên văn thay vì thay bằng một tước hiệu, phù hợp với cách xử lý nhất quán danh YHWH.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; “Yahweh” giữ đây là danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của תְּרוּמָה
  choice: lễ vật dâng lên
  alternative: khoản đóng góp cho
  rationale: Trong ngữ cảnh thánh, từ này vừa mang nghĩa đóng góp vừa chỉ vật được biệt riêng dâng cho Yahweh. “Lễ vật dâng lên” giữ sắc thái thờ phượng, còn yếu tố khoản nộp đã rõ từ mệnh đề trước.
translation_notes:
  register: Văn phong pháp luật–thờ phượng trang trọng nhưng hiện đại. Dùng “phải nộp” cho nghĩa vụ kiểm kê, “siếc-lơ” và “ghê-ra” cho các đơn vị cổ, đồng thời giải thích tiêu chuẩn cân ngay trong câu như nguyên văn.
