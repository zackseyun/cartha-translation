  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: vi
  text: Người giàu không được nộp quá nửa siếc-lơ, và người nghèo không được nộp dưới nửa siếc-lơ, khi dâng khoản đóng góp cho Đức Giê-hô-va để làm lễ chuộc tội cho sinh mạng của anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cho chính anh em” hoặc “cho linh hồn anh em”. Từ Hê-bơ-rơ nephesh có thể chỉ linh hồn, bản thân, con người hoặc mạng sống; trong bối cảnh khoản tiền kiểm kê này, nghĩa có lẽ là sinh mạng hay con người của những người được đếm.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: người giàu
  rationale: Tính từ có mạo từ được dùng như danh từ, chỉ lớp người giàu; cách dịch này tự nhiên và giữ rõ sự tương phản kinh tế.
- source_word: יַרְבֶּה / יַמְעִיט
  choice: nộp nhiều hơn / nộp ít hơn
  rationale: Trong ngữ cảnh khoản đóng góp có mức cố định, hai động từ chỉ việc nộp nhiều hơn hoặc ít hơn số đã quy định; cách diễn đạt song song giữ được cấu trúc pháp lý của câu.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: hơn nửa siếc-lơ
  rationale: Giới từ מִן đi với ý so sánh trong hai mệnh đề phủ định; “nửa siếc-lơ” giữ nguyên đơn vị tiền cân cổ.
- source_word: תְּרוּמַת יְהוָה
  choice: khoản đóng góp lên Đức Giê-hô-va
  rationale: תְּרוּמָה ở đây là khoản được biệt riêng dâng cho mục đích thánh trong bối cảnh kiểm kê dân số; “khoản đóng góp” tránh làm câu mang sắc thái tế lễ quá mức.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt để biểu thị danh YHWH, thay vì thay thế hoàn toàn bằng một tước hiệu.
- source_word: לְכַפֵּר
  choice: để thực hiện việc chuộc tội
  rationale: Giữ ngôn ngữ nghi lễ của động từ כפר mà không ấn định một học thuyết cụ thể về cơ chế chuộc tội.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: cho mạng sống của anh em
  rationale: Trong bối cảnh khoản tiền chuộc gắn với việc kiểm kê, נֶפֶשׁ chủ yếu chỉ mạng sống hay chính con người được kiểm kê, không nhất thiết chỉ phần hồn phi vật chất.
theological_decisions:
- issue: Cách thể hiện danh YHWH
  choice: Đức Giê-hô-va
  alternative: Đức Chúa; Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong bản văn thay vì âm thầm đổi thành tước hiệu, đồng thời dùng hình thức đã quen thuộc với nhiều độc giả Việt.
- issue: Nghĩa của נֶפֶשׁ trong ngữ cảnh chuộc tội
  choice: mạng sống
  alternative: linh hồn; chính anh em
  rationale: Ngữ cảnh kiểm kê và khoản tiền chuộc hướng đến sinh mạng hay bản thân những người được đếm; lựa chọn này tránh áp đặt quan niệm nhị nguyên về con người.
- issue: Nghĩa của כפר
  choice: thực hiện việc chuộc tội
  alternative: làm lễ xá tội; nộp giá chuộc
  rationale: “Chuộc tội” bảo toàn sức nặng nghi lễ và thần học của từ, nhưng không thu hẹp nó vào riêng ý niệm xá tội hay trả giá chuộc.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. “Nộp” làm rõ đây là khoản đóng góp có mức quy định; “anh em” truyền đạt ngôi thứ hai số nhiều tự nhiên hơn “các ngươi”. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
