revisions:
- from: Người giàu không được nộp nhiều hơn, và người nghèo không được nộp ít hơn nửa siếc-lơ, khi dâng khoản đóng góp lên Đức Giê-hô-va để thực hiện việc chuộc tội cho mạng sống của anh em.[a]
  to: Người giàu không được nộp quá nửa siếc-lơ, và người nghèo không được nộp dưới nửa siếc-lơ, khi dâng khoản đóng góp cho Đức Giê-hô-va để làm lễ chuộc tội cho sinh mạng của anh em.[a]
  rationale: Bản sửa làm rõ rằng cả người giàu lẫn người nghèo đều phải nộp đúng nửa siếc-lơ, cải thiện kết hợp từ với “dâng ... cho”, và dùng cách diễn đạt nghi lễ tiếng Việt tự nhiên hơn cho לְכַפֵּר. Chú thích được điều chỉnh nhẹ để nhất quán với “sinh mạng” trong câu dịch, đồng thời vẫn bảo tồn các khả năng từ vựng chính của nephesh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:50:29Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch nêu đúng mức đóng góp cố định là nửa siếc-lơ, tính đối lập giàu/nghèo, khoản đóng góp dâng cho YHWH, và mục đích chuộc tội cho sinh mạng/người được kiểm kê. Tuy nhiên, bản hiện tại chỉ đặt chuẩn so sánh “nửa siếc-lơ” ngay sau vế người nghèo, khiến vế “Người giàu không được nộp nhiều hơn” thiếu đối tượng so sánh rõ ràng trong tiếng Việt.
  naturalness: “Dâng khoản đóng góp lên Đức Giê-hô-va” không tự nhiên bằng “dâng khoản đóng góp cho Đức Giê-hô-va”. “Thực hiện việc chuộc tội” khá hành chính và gượng; “làm lễ chuộc tội” là cách nói nghi lễ tự nhiên hơn trong văn phong Kinh Thánh hiện đại.
  terminology: Giữ “Đức Giê-hô-va”, “siếc-lơ”, “khoản đóng góp”, và “sinh mạng” là nhất quán với các quyết định từ vựng. “Sinh mạng” diễn đạt נֶפֶשׁ trong ngữ cảnh tiền chuộc/kiểm kê mà không đồng nhất từ này với linh hồn phi vật chất.
  issues:
  - severity: medium
    issue: Chuẩn so sánh của vế nói về người giàu không được nêu rõ.
    rationale: Cấu trúc tiếng Hê-bơ-rơ đặt “từ/nhiều hơn hoặc ít hơn nửa siếc-lơ” sau cả hai vế song song. Trong tiếng Việt, cần lặp mức nửa siếc-lơ hoặc dùng “quá/dưới” để cả hai giới hạn đều minh bạch.
  - severity: low
    issue: Cụm “dâng khoản đóng góp lên” chưa tự nhiên.
    rationale: Động từ “dâng” trong tiếng Việt thường đi với “cho” khi chỉ đối tượng tiếp nhận.
  - severity: low
    issue: Cụm “thực hiện việc chuộc tội” mang tính dịch sát cấu trúc và kém tự nhiên.
    rationale: “Làm lễ chuộc tội” giữ sắc thái nghi lễ của כפר và đọc tự nhiên hơn, không buộc một lý thuyết chuộc tội cụ thể.
  revised_text: Người giàu không được nộp quá nửa siếc-lơ, và người nghèo không được nộp dưới nửa siếc-lơ, khi dâng khoản đóng góp cho Đức Giê-hô-va để làm lễ chuộc tội cho sinh mạng của anh em.[a]
  revised_footnotes:
