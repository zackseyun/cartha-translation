  yaml_path: translation/ot/exodus/030/026.yaml
  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: vi
  text: Hãy dùng dầu ấy xức cho Lều Hội Kiến và Hòm Chứng Ngôn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách gọi quen thuộc hơn: “Hòm Giao Ước”; tiếng Hê-bơ-rơ ở đây dùng từ “chứng ngôn”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Hãy… xức
  rationale: Dạng động từ với liên từ đứng trong chuỗi chỉ thị, nên được diễn đạt tự nhiên bằng mệnh lệnh tiếng Việt. “Xức” là thuật ngữ chính xác và quen thuộc trong nghi lễ thánh hiến.
- source_word: בּוֹ
  choice: dùng dầu ấy
  rationale: Giới từ kèm đại từ hậu tố mang nghĩa phương tiện và quy chiếu về dầu xức ở văn cảnh trước. Nêu lại “dầu” giúp câu tiếng Việt rõ ràng, tự nhiên mà không đổi nghĩa.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi ngắn gọn, trang trọng và quen thuộc, diễn đạt nơi Đức Chúa Trời gặp dân hoặc người đại diện của họ.
- source_word: אֲרוֹן
  choice: Hòm
  rationale: Trong bối cảnh đền tạm, “Hòm” là cách gọi truyền thống, dễ nhận biết cho chiếc rương thánh.
- source_word: הָעֵדֻת
  choice: Chứng Ngôn
  rationale: Giữ sát nghĩa danh từ Hê-bơ-rơ là “lời/chứng cứ làm chứng”, không thay bằng “giao ước” vốn là cách gọi quen thuộc nhưng không phải từ được dùng tại đây.
theological_decisions:
- issue: Cách dịch אֲרוֹן הָעֵדֻת
  choice: Hòm Chứng Ngôn
  alternative: Hòm Giao Ước
  rationale: Bản Hê-bơ-rơ dùng עֵדֻת, nghĩa là “chứng ngôn/chứng ước”, chứ không dùng từ “giao ước”. Bản chính giữ lựa chọn từ vựng của nguyên tác, còn cách gọi quen thuộc được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Lược chủ ngữ trong câu mệnh lệnh để tránh đại từ cổ, đồng thời vẫn thể hiện rõ lời chỉ thị trực tiếp. Viết hoa các danh xưng chỉ những vật thánh cụ thể.
