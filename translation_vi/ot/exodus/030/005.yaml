  source_fidelity: 'Bản thảo truyền đạt đúng hai mệnh lệnh liên tiếp: làm các đòn khiêng bằng gỗ keo và phủ chúng bằng vàng. Tuy nhiên, đại từ tân ngữ số nhiều אֹתָם nên được thể hiện rõ để bảo đảm rằng vàng phủ lên các đòn khiêng, không chỉ là một cụm vật liệu rút gọn.'
  naturalness: “Ngươi phải làm” mang sắc thái Kinh Thánh cũ và không thật sự là lối diễn đạt tiếng Việt chuẩn hiện đại như yêu cầu. Câu mệnh lệnh không nêu chủ ngữ, với “Hãy”, vẫn giữ được ngôi số ít của tiếng Hê-bơ-rơ trong ngữ cảnh lời chỉ dẫn trực tiếp mà tự nhiên hơn.
  terminology: “Đòn khiêng” là cách gọi rõ ràng và phù hợp cho בַּדִּים trong ngữ cảnh đồ thánh. “Gỗ keo” là cách dịch hiện đại, dễ hiểu của gỗ acacia. “Bọc … bằng vàng” truyền đạt hợp lý động từ צפה, là phủ/ốp một lớp vàng lên bề mặt.
  issues:
