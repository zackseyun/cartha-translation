  text: Hãy làm các đòn khiêng bằng gỗ keo và bọc chúng bằng vàng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng Qal hoàn thành có liên từ trong chuỗi chỉ thị mang lực mệnh lệnh; “phải làm” diễn đạt tự nhiên tính quy định và giữ sự tiếp nối của các chỉ dẫn.
- source_word: הַבַּדִּים
  choice: các đòn khiêng
  rationale: Trong ngữ cảnh vật dụng thánh, בַּד chỉ những đòn dùng để khiêng; “đòn khiêng” rõ nghĩa hơn “đòn” đứng riêng.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm kết cấu chỉ loại vật liệu; “gỗ keo” là cách gọi tiếng Việt hiện đại, dễ hiểu cho acacia wood.
- source_word: וְצִפִּיתָ
  choice: và bọc
  rationale: Trong ngữ cảnh chế tác, צפה có nghĩa phủ hoặc dát một vật liệu lên bề mặt; “bọc vàng” tự nhiên, trang trọng và không quá chuyên môn.
- source_word: אֹתָם
  choice: '[hàm chứa trong “bọc vàng”]'
  rationale: Đại từ tân ngữ số nhiều quy chiếu về các đòn khiêng; tiếng Việt tự nhiên không cần lặp “chúng” sau khi đối tượng đã được nêu.
- source_word: זָהָב
  choice: vàng
  rationale: Danh từ chỉ vật liệu phủ; kết hợp tự nhiên trong tiếng Việt là “bọc vàng”.
