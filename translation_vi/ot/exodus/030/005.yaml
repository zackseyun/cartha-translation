  - severity: low
    issue: Tân ngữ số nhiều “chúng” đang bị lược bỏ.
    rationale: Tiếng Việt có thể lược tân ngữ, nhưng trong câu này việc nêu rõ đối tượng được bọc giúp phản ánh אֹתָם và làm sáng tỏ rằng các đòn khiêng, chứ không phải một đối tượng khác, được phủ vàng.
