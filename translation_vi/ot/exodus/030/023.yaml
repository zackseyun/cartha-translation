  text: וְ/אַתָּ֣ה קַח לְ/ךָ֮ בְּשָׂמִ֣ים רֹאשׁ֒ מָר דְּרוֹר֙ חֲמֵ֣שׁ מֵא֔וֹת וְ/קִנְּמָן בֶּ֥שֶׂם מַחֲצִית֖/וֹ חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וּ/קְנֵה בֹ֖שֶׂם חֲמִשִּׁ֥ים וּ/מָאתָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: vi
  text: 'Còn ngươi, hãy lấy những hương liệu hảo hạng: năm trăm siếc-la nhựa một dược tự chảy[a], một nửa lượng ấy—hai trăm năm mươi siếc-la—quế thơm, và hai trăm năm mươi siếc-la sậy thơm[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nhựa một dược nguyên chất.” Cụm từ Hê-bơ-rơ có lẽ chỉ nhựa một dược tự chảy ở trạng thái tự nhiên.
    reason: lexical_alternative
  - marker: b
    text: Theo truyền thống, hai cụm từ này được dịch là “quế ngọt” và “xương bồ thơm.” Tiếng Hê-bơ-rơ nói rộng hơn đến quế và một loại sậy có hương thơm.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: những hương liệu hảo hạng
  rationale: בְּשָׂמִים chỉ các chất thơm hoặc hương liệu; רֹאשׁ theo nghĩa thành ngữ là loại đứng đầu, tốt nhất. Cách dịch này tự nhiên và giữ được sắc thái phẩm chất.
- source_word: מָר דְּרוֹר
  choice: nhựa một dược nguyên chất
  rationale: מָר là một dược; דְּרוֹר có thể chỉ loại chảy tự do trong trạng thái tự nhiên, vì thế được hiểu là nguyên chất. Chú thích giữ lại khả năng dịch sát hình ảnh là “một dược chảy tự nhiên”.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: năm trăm siếc-la
  rationale: Nguyên văn chỉ nêu con số, nhưng đơn vị siếc-la được hiểu từ công thức và được nói rõ ở câu kế tiếp. Bổ sung đơn vị giúp độc giả nhận biết đây là trọng lượng.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: quế thơm
  rationale: קִנְּמָן là quế, còn בֶּשֶׂם nhấn mạnh hương thơm; “quế thơm” rõ ràng, tự nhiên và không gợi nhầm về vị ngọt.
- source_word: מַחֲצִיתוֹ
  choice: một nửa lượng ấy
  rationale: Hậu tố chỉ trở lại lượng năm trăm vừa nêu. Cách diễn đạt này bảo toàn quan hệ so sánh của nguyên văn.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: hai trăm năm mươi siếc-la
  rationale: Con số giải thích cụ thể “một nửa lượng ấy”; đơn vị được lặp lại để câu tiếng Việt sáng nghĩa.
- source_word: קְנֵה בֹשֶׂם
  choice: sậy thơm
  rationale: קָנֶה là sậy hoặc thân cây dạng sậy, còn בֹשֶׂם chỉ tính thơm. “Sậy thơm” minh bạch hơn tên thực vật chuyên biệt “xương bồ”, vốn có thể xác định quá mức ý nghĩa tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; dùng “ngươi” để giữ lời phán trực tiếp ở số ít. “Siếc-la” là dạng phiên âm quen thuộc của đơn vị trọng lượng cổ. Dấu gạch ngang làm rõ con số giải thích cho “một nửa lượng ấy” và câu giữ dấu phẩy cuối vì nội dung công thức tiếp tục sang câu sau.
