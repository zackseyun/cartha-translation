  source_fidelity: Bản dịch nhận đúng lực chỉ thị của וְרָחֲצוּ và đúng đối tượng là A-rôn cùng các con trai ông. Tuy nhiên, “bằng nước lấy từ đó” diễn giải rõ hơn cấu trúc מִמֶּנּוּ (“từ đó/từ nó”); điều này có thể chấp nhận khi được chú thích, nhưng nên diễn đạt gọn và tự nhiên hơn trong tiếng Việt.
  naturalness: 'Cụm “rửa tay và chân mình” không song song tự nhiên: “mình” chỉ được gắn với “chân” dù cả hai bộ phận cùng thuộc chủ ngữ. Tiếng Việt tự nhiên hơn là “rửa tay và chân bằng nước từ đó”; sở hữu của các bộ phận cơ thể đã được hiểu theo chủ ngữ.'
