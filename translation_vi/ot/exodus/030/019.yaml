  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: vi
  text: A-rôn và các con trai ông phải rửa tay và chân bằng nước từ đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “từ đó,” chỉ chiếc bồn được nhắc đến trong câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: phải rửa
  rationale: Trong ngữ cảnh chỉ thị nghi lễ, động từ mang lực mệnh lệnh; “phải rửa” diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: וּבָנָיו
  choice: và các con trai ông
  rationale: בנים ở đây chỉ các con trai của A-rôn thuộc hàng tư tế, nên giữ rõ nét nghĩa chỉ nam giới.
- source_word: מִמֶּנּוּ
  choice: bằng nước lấy từ đó
  rationale: Nghĩa đen là “từ nó”; trong ngữ cảnh, đại từ chỉ chiếc bồn vừa được nhắc đến, và vật dùng để rửa là nước lấy từ bồn. Cách diễn đạt này làm rõ quan hệ công cụ mà không thay đại từ bằng danh từ giải nghĩa.
- source_word: אֶת יְדֵיהֶם
  choice: tay
  rationale: Chỉ trực tiếp bộ phận cơ thể phải được rửa; tiếng Việt có thể dùng danh từ không cần dấu số nhiều.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: và chân mình
  rationale: Đối tượng thứ hai phối hợp với “tay”; “mình” quy chiếu tự nhiên về A-rôn và các con trai ông.
theological_decisions:
- issue: Đối tượng tư tế mang giới tính cụ thể
  choice: các con trai ông
  alternative: các con của ông
  rationale: Ngữ cảnh nói đến A-rôn và các con trai phục vụ trong chức tư tế; không trung hòa nét nghĩa giống đực của văn bản.
- issue: Đại từ chỉ nguồn nước
  choice: bằng nước lấy từ đó
  alternative: từ đó
  rationale: Bản Hê-bơ-rơ nói “từ nó” và quy chiếu về chiếc bồn trong ngữ cảnh. Bản dịch làm rõ yếu tố nước cần thiết để câu tiếng Việt tự nhiên, đồng thời giữ “đó” để không thay thế hoàn toàn cách quy chiếu của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phải” để thể hiện tính chỉ thị nghi lễ; giữ tham chiếu “đó” và giải thích nghĩa sát trong chú thích.
