    rationale: Nguyên văn dùng đại từ giống đực số ít với giới từ (“từ nó”); giải thích quy chiếu theo văn cảnh là phù hợp, nhưng nên tránh cách diễn đạt dư thừa.
  revised_text: A-rôn và các con trai ông phải rửa tay và chân bằng nước từ đó.[a]
