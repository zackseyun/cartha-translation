  text: and the altar of burnt offering with all its utensils[a], and the basin with its stand.
translation:
  language: vi
  text: cùng bàn thờ dâng lễ thiêu và mọi dụng cụ của bàn thờ, bồn rửa cùng chân đế của nó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: מִזְבַּח là “bàn thờ”, còn הָעֹלָה chỉ lễ vật được thiêu trọn. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được thuật ngữ tế lễ.
- source_word: כָּל כֵּלָיו
  choice: mọi dụng cụ của bàn thờ
  rationale: כְּלִי có nghĩa rộng là dụng cụ, vật dụng hoặc đồ dùng; hậu tố chỉ về bàn thờ. Lặp lại “bàn thờ” giúp câu tiếng Việt rõ nghĩa hơn dùng đại từ sở hữu.
- source_word: הַכִּיֹּר
  choice: bồn rửa
  rationale: כִּיּוֹר là bồn dùng để rửa trong việc phục vụ tại nơi thánh. “Bồn rửa” hiện đại, dễ hiểu và cụ thể hơn từ cổ.
- source_word: כַּנּוֹ
  choice: chân đế của nó
  rationale: כֵּן ở đây là phần đỡ hoặc bệ của bồn. “Chân đế” diễn đạt rõ chức năng nâng đỡ và phù hợp văn cảnh.
- source_word: וְאֶת
  choice: cùng
  rationale: וְ kết hợp với dấu hiệu tân ngữ אֶת để nối các vật trong danh sách. “Cùng” duy trì sự liên kết với mệnh đề liệt kê trước đó mà không tái hiện dấu hiệu tân ngữ vốn không có tương đương trực tiếp trong tiếng Việt.
