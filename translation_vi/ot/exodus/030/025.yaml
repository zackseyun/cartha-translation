  yaml_path: translation/ot/exodus/030/025.yaml
  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: vi
  text: Ngươi hãy pha chế hỗn hợp ấy thành dầu xức thánh[a], một chế phẩm hương liệu được pha chế theo kỹ thuật của người chế hương; đó sẽ là dầu xức thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “dầu của sự xức thánh.” Cụm “chế phẩm hương liệu được pha chế” cũng có thể dịch là “một hương phẩm pha trộn”; tiếng Hê-bơ-rơ nhấn mạnh một chế phẩm thơm được người có tay nghề pha trộn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתוֹ
  choice: Con hãy chế hỗn hợp ấy thành
  rationale: Trong mạch chỉ thị, động từ mang lực mệnh lệnh. Đại từ chỉ đối tượng được làm từ các nguyên liệu đã nêu ở câu trước; thêm “hỗn hợp” giúp quy chiếu rõ ràng trong tiếng Việt mà không đổi nghĩa.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: dầu xức thánh
  rationale: Giữ cả ý dầu dùng để xức và tính thánh biệt; cách nói ngắn gọn, tự nhiên, đồng thời được lặp nguyên vẹn ở cuối câu như tiếng Hê-bơ-rơ.
- source_word: רֹקַח מִרְקַחַת
  choice: một hợp chất thơm được pha chế
  rationale: Hai từ cùng trường nghĩa nhấn mạnh một chế phẩm có hương thơm được phối trộn; cách dịch này thể hiện cả tính thơm và công đoạn pha chế.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: theo nghệ thuật của người pha hương
  rationale: Cụm từ chỉ sản phẩm hay kỹ nghệ của một thợ chuyên pha các chất thơm. “Theo nghệ thuật” diễn đạt tay nghề chuyên môn, còn “người pha hương” dễ hiểu và phù hợp bối cảnh.
- source_word: יִהְיֶה
  choice: đó sẽ là
  rationale: Diễn đạt trạng thái kết quả được xác lập cho hỗn hợp sau khi pha chế, phù hợp sắc thái chỉ thị trang trọng.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “con” theo lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh; “chế”, “pha chế” và “người pha hương” giữ sắc thái thủ công chuyên môn mà vẫn dễ hiểu.
