translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng dễ hiểu. Dùng đại từ “ngươi” để phản ánh lời phán trực tiếp với Môi-se; giữ sự lặp lại có chủ ý của động từ “làm”, đồng thời thay đại từ vô tri bằng “bàn thờ ấy” cho tự nhiên và rõ nghĩa trong tiếng Việt.
