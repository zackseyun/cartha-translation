  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi chỉ thị của tiếng Hê-bơ-rơ: lệnh làm một bàn thờ có công dụng đốt/xông hương, rồi lặp lại mệnh lệnh làm bàn thờ đó bằng gỗ shittim (acacia). Cụm “để đốt hương” diễn đạt rõ chức năng của מִקְטַר קְטֹרֶת mà không áp đặt một cách phân tích duy nhất ngoài mức cần thiết.'
