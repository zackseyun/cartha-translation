  yaml_path: translation/ot/exodus/030/001.yaml
  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: vi
  text: Ngươi phải làm một bàn thờ để đốt hương[a]; ngươi phải làm bàn thờ ấy bằng gỗ keo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch gọn là “một bàn thờ xông hương” hoặc “một bàn thờ hương”. Tiếng Hê-bơ-rơ sát nghĩa hơn là “một bàn thờ để đốt hương”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Động từ Qal hoàn thành ngôi hai số ít giống đực, có liên từ đứng trước, mang chức năng chỉ thị trong chuỗi hướng dẫn. Cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái mệnh lệnh trang trọng.
- source_word: מִזְבֵּחַ
  choice: một bàn thờ
  rationale: “Bàn thờ” là từ tương đương thông dụng; “một” giới thiệu vật dụng thờ phượng mới trong mạch văn.
- source_word: מִקְטַר קְטֹרֶת
  choice: để đốt hương
  rationale: Cụm liên kết chỉ chức năng của bàn thờ, sát nghĩa là nơi dành cho việc đốt hương. Cách diễn đạt này rõ ràng và không nén cụm Hê-bơ-rơ thành một danh xưng.
- source_word: עֲצֵי שִׁטִּים
  choice: gỗ keo
  rationale: Cụm Hê-bơ-rơ chỉ gỗ lấy từ cây shittah, thường được nhận diện là một loại acacia; “gỗ keo” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: ngươi phải làm bàn thờ ấy
  rationale: Động từ ngôi hai số ít tiếp tục lời chỉ thị, còn đại từ bổ ngữ trở lại vật vừa nêu. Lặp “bàn thờ ấy” giúp câu tiếng Việt rõ nghĩa hơn “làm nó” mà vẫn giữ sự nhắc lại của nguyên văn.
