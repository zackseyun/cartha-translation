source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: vi
  text: Khi họ vào Lều Hội Kiến, họ phải rửa bằng nước để khỏi chết[a]; hoặc khi họ đến gần bàn thờ để phục vụ, để đốt một lễ vật dâng bằng lửa cho Yahweh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và họ sẽ không chết” hoặc “kẻo họ chết.”'
    reason: Bảo tồn các cách hiểu khả dĩ về quan hệ cú pháp và sắc thái của וְלֹא יָמֻתוּ.
  - marker: b
    text: 'Cũng có thể hiểu: “lễ vật làm thức ăn.”'
    reason: Nêu cách hiểu chức năng khác của thuật ngữ tế tự אִשֶּׁה, trong khi bản chính giữ nghĩa thông thường là lễ vật dâng bằng lửa.
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Khi vào
  rationale: Cấu trúc giới từ בְּ với động từ nguyên mẫu và hậu tố mang nghĩa thời gian; “khi vào” tự nhiên và giữ rõ chuyển động vào nơi thánh.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Danh xưng quen thuộc của nơi thánh, nơi Đức Chúa Trời gặp dân Israel; viết hoa như một tên gọi riêng.
- source_word: יִרְחֲצוּ מַיִם
  choice: họ phải rửa bằng nước
  rationale: Giữ rõ phương tiện là nước và diễn đạt sức bắt buộc của quy định nghi lễ bằng tiếng Việt tự nhiên; tiếng Hê-bơ-rơ không nêu tân ngữ nên bản dịch cũng không tự ý xác định bộ phận phải rửa.
- source_word: וְלֹא יָמֻתוּ
  choice: để khỏi chết
  rationale: Trong ngữ cảnh, mệnh đề phối hợp này diễn tả hệ quả hoặc mục đích của việc rửa; cách dịch ngắn gọn vẫn giữ nguyên mức độ nghiêm trọng của án chết.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: khi đến gần bàn thờ
  rationale: נגשׁ chỉ việc tiến đến hoặc đến gần, đặc biệt trong bối cảnh phụng tự.
- source_word: לְשָׁרֵת
  choice: để thi hành chức vụ
  rationale: Diễn đạt việc phục vụ chính thức của các tư tế, thay vì nghĩa phục vụ chung chung.
- source_word: לְהַקְטִיר
  choice: đốt ... dâng lên
  rationale: Thể Hiphil của קטר nói đến việc làm cho lễ vật bốc khói trên bàn thờ; “đốt ... dâng lên” vừa tự nhiên vừa giữ sắc thái hiến tế.
- source_word: אִשֶּׁה
  choice: lễ vật dùng lửa
  rationale: Giữ mối liên hệ trực tiếp của thuật ngữ tế tự này với lửa, đồng thời tránh thuật ngữ Hán-Việt khó hiểu; cách hiểu “lễ vật làm thức ăn” được ghi ở chú thích.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Quan hệ của וְלֹא יָמֻתוּ với mệnh lệnh rửa
  choice: để khỏi chết
  alternative: và họ sẽ không chết; kẻo họ chết
  rationale: Cách dịch chính thể hiện mục đích/hệ quả hợp với ngữ cảnh nhưng chú thích bảo tồn khả năng đọc sát phép nối của tiếng Hê-bơ-rơ.
- issue: Nghĩa của thuật ngữ tế tự אִשֶּׁה
  choice: lễ vật dùng lửa
  alternative: lễ vật làm thức ăn
  rationale: Từ này có cách giải thích từ nguyên và chức năng không hoàn toàn thống nhất; bản chính giữ liên hệ với lửa, còn chú thích nêu cách hiểu chức năng mà không quyết định thay người đọc.
- issue: Danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Giữ danh riêng xuất hiện trực tiếp trong bản Hê-bơ-rơ và không thay bằng tước hiệu.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. “Lều Hội Kiến” và “bàn thờ” phù hợp ngữ cảnh phụng tự; dấu phẩy cuối câu cho thấy mệnh đề còn tiếp sang câu 21.
