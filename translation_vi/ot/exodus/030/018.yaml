base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: vi
  text: Ngươi phải làm một chậu bằng đồng[a], cùng chân đế bằng đồng, để rửa; ngươi phải đặt chậu ấy giữa Lều Hội Kiến và bàn thờ, rồi đổ nước vào đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “đồng” (ở cả hai chỗ trong câu) có thể chỉ đồng đỏ hoặc một hợp kim đồng, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: cái chậu
  rationale: Chỉ một vật chứa nước lớn dùng cho việc rửa tại nơi thánh. “Cái chậu” rõ ràng, tự nhiên trong tiếng Việt hiện đại; “bồn rửa” dễ gợi thiết bị hiện đại.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ Hê-bơ-rơ có thể chỉ đồng đỏ hoặc hợp kim đồng tùy ngữ cảnh. “Đồng” giữ được độ rộng nghĩa tự nhiên trong tiếng Việt, không xác định quá mức là đồng đỏ hay đồng thiếc.
- source_word: כַּן
  choice: chân đế
  rationale: Chỉ bộ phận nâng đỡ chậu; “chân đế” diễn đạt rõ chức năng và tự nhiên hơn “bệ” trong ngữ cảnh này.
- source_word: לְרָחְצָה
  choice: để dùng vào việc rửa
  rationale: Giữ nghĩa mục đích của động từ nguyên mẫu mà không thêm đối tượng rửa vốn không được nêu trong câu này.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, dễ hiểu cho chiếc lều là nơi gặp gỡ theo ngữ cảnh Xuất Hành; dùng như danh xưng nên viết hoa.
- source_word: מִזְבֵּחַ
  choice: bàn thờ
  rationale: Tương đương trực tiếp và quen thuộc trong tiếng Việt cho bàn dâng sinh tế.
- source_word: שָׁמָּה
  choice: vào đó
  rationale: Nguyên văn là “ở/đến đó”. Trong tiếng Việt, “đổ nước vào đó” tự nhiên và để đại từ quy chiếu về chiếc chậu mà không diễn giải dài dòng.
- source_word: מַיִם
  choice: nước
  rationale: Bản dịch trực tiếp của danh từ chỉ nước.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: Ngươi phải làm ... ngươi phải đặt ... rồi đổ
  rationale: Các động từ ngôi hai số ít giống đực mang lực chỉ thị trong văn cảnh. “Ngươi phải” duy trì sắc thái mệnh lệnh giao ước; ở vế cuối, lược chủ ngữ và trợ động từ giúp câu Việt tự nhiên mà vẫn giữ cùng chủ thể và lực mệnh lệnh.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, mạch lạc và dễ hiểu. Dùng “ngươi” để phản ánh lời truyền trực tiếp cho một người ở ngôi hai số ít; cấu trúc câu được điều chỉnh vừa phải theo tiếng Việt hiện đại. Không thêm đối tượng cho hành động rửa, nhằm giữ sự hàm súc của nguyên văn.
