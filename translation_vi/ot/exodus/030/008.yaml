  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của câu Hê-bơ-rơ: mệnh đề thời gian, việc chăm/sắp đặt đèn vào lúc chạng vạng, việc đốt hương, tính thường xuyên của nghi lễ, sự diễn ra trước mặt Đức Giê-hô-va, và hiệu lực qua các thế hệ. Tuy nhiên, “hương ấy” xuất hiện trước khi danh từ “hương” được nêu trong tiếng Việt, tạo một quy chiếu ngược không tự nhiên.'
