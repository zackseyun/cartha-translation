base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: vi
  text: Khi A-rôn sửa soạn các ngọn đèn vào lúc chạng vạng[a], ông phải đốt hương, là hương được dâng đều đặn[b], trước mặt Đức Giê-hô-va, qua các thế hệ của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “giữa hai buổi chiều tối,” một thành ngữ chỉ khoảng thời gian chạng vạng hoặc chiều tối.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hương liên tục.” Từ Hê-bơ-rơ có thể nhấn mạnh việc dâng hương thường xuyên, tiếp diễn hoặc có tính lâu dài theo quy định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: Khi ... sửa soạn
  rationale: Cụm giới từ với động từ nguyên thể tạo mệnh đề thời gian. Dạng Hifil của עלה trong ngữ cảnh đèn có thể chỉ việc làm cho ngọn lửa cháy lên, thắp hoặc chuẩn bị đèn; “sửa soạn” giữ được sắc thái nghi lễ mà không thu hẹp nghĩa chỉ còn hành động châm lửa.
- source_word: הַנֵּרֹת
  choice: các ngọn đèn
  rationale: נֵרֹת là từ thông dụng chỉ các đèn trong bối cảnh vật dụng của Đền Tạm.
- source_word: בֵּין הָעַרְבַּיִם
  choice: vào lúc chạng vạng
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “giữa hai buổi chiều tối,” chỉ khoảng thời gian chạng vạng hoặc chiều tối; cách dịch này tự nhiên trong tiếng Việt và nghĩa đen được giữ ở chú thích.
- source_word: יַקְטִירֶנָּה
  choice: ông phải đốt hương ấy
  rationale: Dạng Hifil của קטר trong ngữ cảnh dâng hương chỉ việc đốt để hương tỏa khói. Hậu tố giống cái số ít quy chiếu về קְטֹרֶת; tiếng Việt diễn đạt rõ đối tượng bằng “hương ấy.”
- source_word: קְטֹרֶת תָּמִיד
  choice: hương được dâng đều đặn
  rationale: קְטֹרֶת là hương, còn תָּמִיד trong quy định tế tự nhấn mạnh sự lặp lại thường xuyên và bền vững. “Được dâng đều đặn” tránh gợi ý rằng hương cháy không ngừng từng giây, đồng thời giữ nghĩa phụng tự.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: לִפְנֵי chỉ sự hiện diện trước Thiên Chúa trong không gian thờ phượng; יְהוָה được chuyển tự bằng dạng tiếng Việt quen dùng “Đức Giê-hô-va,” giữ đây là danh riêng chứ không thay bằng một tước hiệu.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của anh em
  rationale: Thành ngữ chỉ hiệu lực tiếp diễn qua những thế hệ kế tiếp của cộng đồng Israel; “anh em” thể hiện đại từ ngôi thứ hai số nhiều trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Danh Thánh. “Đức Giê-hô-va” là dạng danh riêng đã quen thuộc trong tiếng Việt và không thay danh ấy bằng tước hiệu; các dạng chuyển tự khác vẫn có thể được biện hộ.
- issue: Ý nghĩa của תָּמִיד trong việc dâng hương
  choice: được dâng đều đặn
  alternative: liên tục; đời đời
  rationale: Theo ngữ cảnh nghi lễ sáng và chiều, từ này có thể nhấn mạnh sự thực hành thường xuyên qua thời gian hơn là một hành động không gián đoạn. Chú thích bảo lưu khả năng diễn đạt “liên tục.”
translation_notes:
  register: Văn phong trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. Dùng “sửa soạn” để giữ độ rộng nghĩa của hành động đối với đèn; dùng “dâng đều đặn” để biểu đạt nhịp nghi lễ. Mọi ký hiệu chú thích [a], [b] đều xuất hiện trong chính văn.
