  naturalness: Câu sửa vẫn trang trọng, hiện đại và tự nhiên. Cấu trúc chen «đó là các hương liệu» là cách khả dụng để phản ánh sự lặp lại של סַמִּים mà không làm danh sách tiếng Việt khó hiểu.
  terminology: Giữ Yahweh theo quyết định thuật ngữ của POB; nataf và shekhelet được chuyển tự thận trọng và chú thích nêu rõ tính bất định. «Nhựa galbanum» và «nhũ hương tinh khiết» là các thuật ngữ phù hợp.
