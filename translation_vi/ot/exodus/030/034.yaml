- from: 'Rồi Đức Yahweh phán với Môi-se: “Con hãy lấy cho mình các hương liệu: nataf, shekhelet[a] và nhựa galbanum—đó là các hương liệu—cùng với nhũ hương tinh khiết; mỗi loại phải có lượng bằng nhau.”'
  to: 'Rồi Đức Yahweh phán với Môi-se: “Hãy lấy cho mình các hương liệu: nataf, shekhelet[a] và nhựa galbanum—đó là các hương liệu—cùng với nhũ hương tinh khiết; mỗi loại phải có lượng bằng nhau.”'
  rationale: Chỉ bỏ «Con» để tránh bổ sung sắc thái xưng hô không có trong nguyên ngữ. Những thành phần khác, gồm sự lặp lại của «hương liệu» và chú thích về hai thuật ngữ bất định, được giữ nguyên.
