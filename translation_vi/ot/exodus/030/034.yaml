  text: וַ/יֹּאמֶר֩ יְהוָ֨ה אֶל מֹשֶׁ֜ה קַח לְ/ךָ֣ סַמִּ֗ים נָטָ֤ף וּ/שְׁחֵ֨לֶת֙ וְ/חֶלְבְּנָ֔ה סַמִּ֖ים וּ/לְבֹנָ֣ה זַכָּ֑ה בַּ֥ד בְּ/בַ֖ד יִהְיֶֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: vi
  text: 'Rồi Đức Yahweh phán với Môi-se: “Hãy lấy cho mình các hương liệu: nataf, shekhelet[a] và nhựa galbanum—đó là các hương liệu—cùng với nhũ hương tinh khiết; mỗi loại phải có lượng bằng nhau.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không xác định chắc chắn nataf và shekhelet là những chất gì; tiếng Hê-bơ-rơ dường như chỉ hai loại hương liệu cụ thể dùng để chế hương.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự Yahweh, thay vì thay thế bằng một tước hiệu; thêm kính ngữ “Đức” để câu văn tiếng Việt tự nhiên và trang trọng.
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: “Rồi” thể hiện diễn tiến của mạch kể; “phán” là động từ tiếng Việt trang trọng, tự nhiên khi chủ thể là Đức Chúa Trời.
- source_word: קַח לְךָ
  choice: Con hãy lấy cho mình
  rationale: Giữ sắc thái mệnh lệnh và thành tố לְךָ (“cho mình”); đại từ “Con” diễn đạt tự nhiên lời Đức Chúa Trời nói trực tiếp với Môi-se.
- source_word: סַמִּים
  choice: các hương liệu
  rationale: Đây là thuật ngữ rộng chỉ các chất thơm dùng để chế hương; “hương liệu” rõ nghĩa hơn “gia vị” trong ngữ cảnh này. Lần lặp lại trong tiếng Hê-bơ-rơ cũng được giữ lại.
- source_word: נָטָף
  choice: nataf
  rationale: Danh tính chính xác của chất thơm này không chắc chắn. Giữ dạng chuyển tự từ tiếng Hê-bơ-rơ tránh khẳng định một nhận dạng thực vật chưa chắc chắn.
- source_word: שְׁחֵלֶת
  choice: shekhelet
  rationale: Chất liệu cụ thể chưa được xác định chắc chắn; chuyển tự giữ được tính riêng biệt của thuật ngữ nguồn mà không áp đặt cách nhận dạng truyền thống.
- source_word: חֶלְבְּנָה
  choice: nhựa galbanum
  rationale: Từ này thường được nhận dạng là galbanum, một loại nhựa thơm; thêm “nhựa” giúp độc giả Việt hiểu đây là một hương liệu.
- source_word: לְבֹנָה זַכָּה
  choice: nhũ hương tinh khiết
  rationale: “Nhũ hương” là cách gọi tiếng Việt thông dụng của frankincense, còn “tinh khiết” thể hiện rõ tính từ זַכָּה.
- source_word: בַּד בְּבַד
  choice: mỗi loại phải có lượng bằng nhau
  rationale: Diễn đạt tự nhiên thành ngữ chỉ tỷ lệ bằng nhau giữa các thành phần, đồng thời làm rõ rằng mỗi hương liệu được dùng với lượng ngang nhau.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ các thuật ngữ chưa chắc chắn dưới dạng chuyển tự, kèm chú thích, thay vì dùng những tên truyền thống có thể khiến độc giả tưởng rằng danh tính của chúng đã được xác định chắc chắn. Dấu gạch ngang giúp giữ lần lặp lại của סַמִּים mà vẫn tạo câu tiếng Việt có thể hiểu được.
