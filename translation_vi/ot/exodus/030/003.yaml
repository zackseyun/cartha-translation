base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: vi
  text: 'Ngươi phải dát vàng ròng lên bàn thờ: mặt trên, các vách chung quanh và các sừng của nó; rồi làm cho nó một đường viền bằng vàng chạy quanh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một vành bằng vàng chạy quanh” hoặc “một vương miện bằng vàng bao quanh.” Từ Hê-bơ-rơ zēr có thể chỉ đường viền, vành, hay phần gờ giống như vương miện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: Ngươi phải dát
  rationale: Động từ צפה trong ngữ cảnh này chỉ việc phủ bề mặt đồ vật bằng kim loại; “dát” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cụm từ chỉ vàng có độ tinh khiết cao; “vàng ròng” trang trọng, rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: גַּגּוֹ
  choice: mặt trên
  rationale: Dù גג thường có nghĩa là “mái”, ở đây nói đến bề mặt phía trên của một bàn thờ nhỏ, nên “mặt trên” phù hợp với vật thể và tự nhiên hơn.
- source_word: קִירֹתָיו
  choice: các vách
  rationale: קִירֹתָיו theo nghĩa sát là các bức/vách đứng của vật thể. “Các vách” giữ được hình ảnh của nguyên ngữ mà vẫn phù hợp với bàn thờ.
- source_word: סָבִיב
  choice: chung quanh / chạy quanh
  rationale: Hai lần xuất hiện đều diễn tả sự bao quanh trọn vẹn; cách diễn đạt có biến đổi nhẹ để câu tiếng Việt tự nhiên mà vẫn giữ sự lặp ý của nguyên văn.
- source_word: קַרְנֹתָיו
  choice: các sừng của nó
  rationale: Giữ thuật ngữ nghi lễ “sừng”, chỉ các phần nhô lên ở các góc bàn thờ, thay vì diễn giải làm mất hình ảnh chuyên biệt.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: rồi làm cho nó
  rationale: 'Giữ quan hệ do giới từ ל biểu thị: đường viền được làm cho bàn thờ.'
- source_word: זֵר זָהָב
  choice: một đường viền bằng vàng
  rationale: זֵר có thể chỉ mép, vành hoặc đường gờ trang trí bao quanh. “Đường viền bằng vàng” dễ hiểu và không áp đặt hình ảnh vương quyền.
theological_decisions:
- issue: Cách dịch thuật ngữ về đồ dùng thờ phượng
  choice: Giữ “các sừng” theo nghĩa trực tiếp và dịch זֵר là “đường viền”
  alternative: Dịch זֵר là “vương miện” hoặc “vành”
  rationale: Câu này mô tả cấu tạo của bàn thờ, không trực tiếp nêu biểu tượng vương quyền. “Các sừng” bảo toàn thuật ngữ nghi lễ, còn “đường viền” diễn đạt rõ đặc điểm vật lý; phương án “vương miện” được ghi chú vì vẫn nằm trong phạm vi nghĩa của từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng đại từ mệnh lệnh “ngươi” để phù hợp lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh luật lệ; gọi rõ “bàn thờ” thay cho đại từ đầu câu để tránh mơ hồ khi câu được đọc riêng.
