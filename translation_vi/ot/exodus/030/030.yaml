revisions:
- from: Con hãy xức dầu cho A-rôn và các con trai ông, rồi biệt riêng họ ra thánh để làm thầy tế lễ phục vụ Ta.
  to: Con hãy xức dầu cho A-rôn và các con trai ông, rồi hãy thánh hiến họ để họ phục vụ Ta trong chức vụ thầy tế lễ.
  rationale: Sửa tối thiểu để dùng thuật ngữ nghi lễ tự nhiên và chính xác hơn cho קדשׁ, đồng thời làm sáng rõ rằng sự phục vụ Ta diễn ra trong chức vụ tư tế. Không thay đổi ý nghĩa, mức độ mệnh lệnh, giới tính của “các con trai,” hay sắc thái nghi lễ của nguyên văn.
