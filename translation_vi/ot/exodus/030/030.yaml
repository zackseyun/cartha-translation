  yaml_path: translation/ot/exodus/030/030.yaml
  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: vi
  text: Con hãy xức dầu cho A-rôn và các con trai ông, rồi hãy thánh hiến họ để họ phục vụ Ta trong chức vụ thầy tế lễ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: hãy xức dầu
  rationale: Động từ משׁח chỉ nghi thức xức dầu thánh để bổ nhiệm. Cách dịch này giữ rõ hành động nghi lễ; dạng yiqtol trong ngữ cảnh chỉ thị được diễn đạt tự nhiên bằng “hãy”.
- source_word: וְקִדַּשְׁתָּ
  choice: rồi biệt riêng họ ra thánh
  rationale: Thể Piel của קדשׁ ở đây mang nghĩa dành riêng một người cho địa vị và công việc thánh. Cụm từ này rõ nghĩa đối với độc giả hiện đại hơn từ chuyên môn “thánh hiến”, đồng thời vẫn giữ nội dung về sự thánh biệt.
- source_word: לְכַהֵן
  choice: để làm thầy tế lễ phục vụ
  rationale: Động từ כהן có nghĩa thi hành chức vụ tế lễ. “Làm thầy tế lễ phục vụ” diễn đạt cả địa vị lẫn hoạt động, thay vì chỉ dùng một danh xưng.
- source_word: לִי
  choice: Ta
  rationale: Đại từ ngôi thứ nhất chỉ Đức Chúa Trời là Đấng nhận sự phục vụ. “Phục vụ Ta” là cách diễn đạt tiếng Việt tự nhiên mà vẫn giữ hướng quy chiếu trực tiếp của לְ.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Danh từ nguồn chỉ rõ các con trai của A-rôn trong bối cảnh dòng tư tế; không trung tính hóa thành “các con”.
- source_word: וְאֶת ... וְאֶת
  choice: A-rôn và các con trai ông
  rationale: Hai dấu chỉ tân ngữ phối hợp A-rôn với các con trai ông. Tiếng Việt không cần biểu thị lặp lại, nên dịch thành một cụm song song tự nhiên.
theological_decisions:
- issue: Bối cảnh nghi lễ của קדשׁ và כהן
  choice: “biệt riêng họ ra thánh để làm thầy tế lễ phục vụ Ta”
  alternative: “thánh hiến họ để họ thi hành chức tế lễ cho Ta”
  rationale: Lựa chọn giữ cả ý được dành riêng cho sự thánh và chức năng tế lễ, nhưng tránh đưa vào các khái niệm giáo phái hay cơ cấu giáo hội về sau.
- issue: Cách dịch giống của בָּנָיו
  choice: “các con trai ông”
  alternative: “các con ông”
  rationale: Bản Hê-bơ-rơ nêu đích danh con trai, phù hợp với bối cảnh dòng tư tế của A-rôn; vì vậy cần giữ nét nghĩa giống đực.
- issue: Lực chỉ thị của các dạng động từ
  choice: Dùng “hãy” cho mệnh lệnh nối tiếp
  alternative: Dùng dạng tương lai “sẽ”
  rationale: Trong mạch chỉ dẫn nghi lễ trực tiếp cho Môi-se, các dạng động từ mang lực chỉ thị. “Hãy” truyền đạt chức năng này tự nhiên trong tiếng Việt mà không biến câu thành lời tiên báo.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “A-rôn” theo lối phiên âm Kinh Thánh quen thuộc; “thầy tế lễ” giữ sắc thái chức vụ trong bối cảnh Cựu Ước. Không cần chú thích vì câu không có dị bản hay sự mơ hồ đáng kể cần trình bày.
