    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: quế bì
  rationale: Chỉ một loại vỏ cây thơm dùng làm hương liệu; “quế bì” là cách gọi ngắn gọn, tự nhiên trong tiếng Việt và phù hợp với danh sách nguyên liệu.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: năm trăm
  rationale: Số từ chỉ lượng quế bì.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ thánh
  rationale: Diễn đạt rằng trọng lượng được tính theo chuẩn cân dùng cho nơi thánh, đồng thời giữ thuật ngữ đơn vị cổ.
- source_word: שֶׁמֶן זַיִת
  choice: dầu ô-liu
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt hiện đại cho kết cấu Hê-bơ-rơ nghĩa là dầu lấy từ quả ô-liu.
- source_word: הִין
  choice: một hin
  rationale: Giữ nguyên tên đơn vị đo chất lỏng cổ thay vì thay bằng một trị số hiện đại chỉ mang tính ước lượng.
- source_word: וְ
  choice: và; cùng
  rationale: Giữ các liên từ nối nguyên liệu này với danh sách ở câu trước và nối dầu ô-liu với quế bì.
