translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp với danh sách chỉ dẫn nghi lễ. Giữ các đơn vị cổ “siếc-lơ” và “hin”; dùng “theo siếc-lơ thánh” để thể hiện chuẩn cân. Dấu chú thích [a] được đặt ngay sau “hin”, là thuật ngữ mà chú thích giải thích.
