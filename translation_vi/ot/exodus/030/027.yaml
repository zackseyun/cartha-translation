translation:
  language: vi
  text: Và bàn cùng mọi dụng cụ của nó, chân đèn cùng các dụng cụ của nó, và bàn thờ xông hương.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: cái bàn
  rationale: Danh từ trong câu chỉ đơn giản là “bàn”; ngữ cảnh xác định đây là chiếc bàn thánh trong Đền Tạm, nên không thêm danh xưng đầy đủ vốn không có trong nguyên văn.
- source_word: כָּל כֵּלָיו
  choice: mọi dụng cụ của nó
  rationale: כְּלִי có nghĩa rộng, gồm dụng cụ, đồ dùng hoặc vật dụng. “Dụng cụ” tự nhiên trong tiếng Việt và phù hợp với các vật phục vụ chiếc bàn.
- source_word: הַמְּנֹרָה
  choice: chân đèn
  rationale: Dịch danh từ chung theo chức năng thay vì phiên âm; “chân đèn” là cách gọi rõ ràng, quen thuộc và phù hợp với vật dụng trong Đền Tạm.
- source_word: כֵּלֶיהָ
  choice: các dụng cụ của chân đèn
  rationale: Lặp lại danh từ “chân đèn” thay cho đại từ để tránh sự mơ hồ do tiếng Việt không phân biệt giống của đại từ sở hữu.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: bàn thờ xông hương
  rationale: Cụm sở thuộc chỉ bàn thờ dùng để dâng/xông hương. “Bàn thờ xông hương” vừa tự nhiên trong tiếng Việt vừa giữ rõ chức năng của bàn thờ.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ như một phần tiếp nối của danh sách trong câu trước; không tự ý thêm liên từ mở đầu vì bản dịch trích riêng vẫn có thể đọc tự nhiên. Không dùng chú thích của lớp tiếng Anh vì chú thích ấy dường như đặt sai vị trí: phương án “incense altar” liên quan đến מִזְבַּח הַקְּטֹרֶת chứ không liên quan đến כָּל כֵּלָיו.'
