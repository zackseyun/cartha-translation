  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: vi
  text: A-rôn phải đốt hương thơm trên đó mỗi buổi sáng; khi sửa soạn các ngọn đèn[a], ông phải đốt hương.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi ông tỉa và chỉnh các ngọn đèn.” Động từ Hê-bơ-rơ chỉ việc làm cho đèn ở tình trạng tốt, bao gồm việc chăm sóc và sắp đặt chúng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: phải đốt
  rationale: Dạng Hiphil của קטר trong bối cảnh nghi lễ chỉ việc làm cho lễ vật bốc khói; “đốt” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: עָלָיו
  choice: trên đó
  rationale: Đại từ hồi chỉ bàn thờ xông hương ở văn cảnh trước và giữ nguyên ý vị trí.
- source_word: קְטֹרֶת סַמִּים
  choice: hương thơm
  rationale: Cụm từ chỉ hương được pha từ các chất thơm; “hương thơm” tự nhiên, dễ hiểu và không thêm chi tiết ngoài nguyên văn.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: mỗi buổi sáng
  rationale: Sự lặp lại trong tiếng Hê-bơ-rơ mang nghĩa phân phối, nhấn mạnh việc làm đều đặn hằng ngày; “mỗi buổi sáng” truyền đạt rõ ý ấy trong tiếng Việt hiện đại.
- source_word: בְּהֵיטִיבוֹ
  choice: khi sửa soạn
  rationale: Dạng Hiphil của יטב ở đây nói đến việc chỉnh trang, chăm sóc và đặt các đèn vào tình trạng thích hợp; “sửa soạn” giữ được phạm vi nghĩa mà không thu hẹp chỉ còn việc tỉa bấc.
- source_word: הַנֵּרֹת
  choice: các ngọn đèn
  rationale: Chỉ các đèn trong nơi thánh đã được xác định bởi văn cảnh.
- source_word: יַקְטִירֶנָּה
  choice: ông phải đốt hương
  rationale: Hậu tố giống cái số ít hồi chỉ קְטֹרֶת. Lặp lại “hương” tự nhiên và rõ hơn đại từ “nó” trong tiếng Việt.
theological_decisions: []
