  to: Không được đổ dầu ấy lên thân thể con người[a]; cũng không được pha chế loại dầu nào giống dầu ấy theo công thức của nó. Dầu ấy là vật thánh; đối với các ngươi, nó phải là vật thánh.
  rationale: Chỉ sửa hai lần “là thánh” thành “là vật thánh” để diễn đạt tự nhiên và chính xác hơn ý nghĩa của קֹדֶשׁ trong tiếng Việt. Đồng thời thay “công thức ấy” bằng “công thức của nó” và nêu lại “dầu ấy” trong mệnh đề so sánh để sở chỉ được rõ ràng, không thay đổi nghĩa hay mức độ cấm của nguyên văn.
