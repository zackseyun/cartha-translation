id: EXO.30.32
reference: Exodus 30:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: vi
  text: Không được đổ dầu ấy lên thân thể con người[a]; cũng không được pha chế loại dầu nào giống dầu ấy theo công thức của nó. Dầu ấy là vật thánh; đối với các ngươi, nó phải là vật thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trên thịt của con người”; từ אָדָם ở đây chỉ con người nói chung.'
    reason: Giải thích cách chuyển cụm từ sát chữ sang tiếng Việt tự nhiên và làm rõ phạm vi khái quát của אָדָם.
lexical_decisions:
- source_word: יִיסָךְ
  choice: được đổ
  rationale: Dạng bị động của động từ נסך ở đây diễn tả việc đổ hoặc thoa dầu. “Được đổ” giữ được hình ảnh cụ thể và không chuyển động từ này thành thuật ngữ nghi lễ rộng hơn như “được xức dầu”.
- source_word: עַל בְּשַׂר אָדָם
  choice: trên thân thể con người
  rationale: בָּשָׂר theo nghĩa đen là “thịt”, còn אָדָם chỉ con người nói chung. “Thân thể con người” tự nhiên và trang trọng trong tiếng Việt, đồng thời không giới hạn lệnh cấm vào nam giới.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: theo đúng công thức ấy
  rationale: מַתְכֹּנֶת chỉ thành phần, tỷ lệ hoặc công thức đã định. Cách dịch này làm rõ lệnh cấm sao chế hỗn hợp dầu với cùng thành phần và tỷ lệ.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: không được pha chế loại dầu nào giống như vậy
  rationale: Động từ “pha chế” phù hợp với ngữ cảnh chế dầu, còn “loại dầu nào giống như vậy” truyền đạt lực so sánh của כָּמֹהוּ một cách tự nhiên.
- source_word: קֹדֶשׁ הוּא
  choice: Dầu ấy là thánh
  rationale: “Là thánh” duy trì thuật ngữ thần học cốt lõi của קֹדֶשׁ; lặp lại “dầu ấy” giúp đại từ tiếng Việt có sở chỉ rõ ràng.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: đối với các ngươi, dầu ấy phải là thánh
  rationale: Cách dịch giữ quan hệ לָכֶם, tức dầu phải được nhìn nhận và đối xử là thánh trong tương quan với cộng đồng được truyền lệnh, mà không diễn giải quá mức.
theological_decisions:
- issue: Phạm vi chỉ người của אָדָם
  choice: con người
  alternative: người nam
  rationale: Trong cụm này, אָדָם mang nghĩa khái quát về loài người chứ không chuyên chỉ nam giới. “Con người” giữ đúng phạm vi của từ Hê-bơ-rơ và tránh tạo ra một giới hạn giới tính không có trong nguyên văn.
- issue: Sắc thái của קֹדֶשׁ יִהְיֶה לָכֶם
  choice: đối với các ngươi, dầu ấy phải là thánh
  alternative: dầu ấy sẽ là thánh cho các ngươi
  rationale: Hình thức vị lai có thể mang lực mệnh lệnh trong văn luật pháp. “Phải là thánh” thể hiện lực quy định ấy, trong khi cụm “đối với các ngươi” bảo toàn quan hệ được diễn đạt bởi לָכֶם.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “các ngươi” để phản ánh ngôi thứ hai số nhiều của תַעֲשׂוּ và לָכֶם. Đại từ chỉ dầu được diễn đạt thành “dầu ấy” để câu tiếng Việt rõ nghĩa; dấu chấm phẩy giữ sự cân xứng giữa hai lời khẳng định về tính thánh.
