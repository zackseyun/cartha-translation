    rationale: קֹדֶשׁ trong hai mệnh đề mô tả dầu như một vật thuộc phạm vi thánh, biệt riêng. “Vật thánh” diễn đạt rõ hơn trong tiếng Việt hiện đại mà vẫn giữ nguyên lực mệnh lệnh của “phải là” ở mệnh đề sau.
