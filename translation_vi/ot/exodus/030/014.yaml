source:
  edition: WLC
  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: vi
  text: Mọi người từ hai mươi tuổi trở lên, khi đi qua để được ghi vào số những người được kiểm kê[a], phải dâng khoản đóng góp dành cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi qua giữa những người được kiểm kê.” Thành ngữ Hê-bơ-rơ theo nghĩa đen nói về việc một người “đi qua” trong mối liên hệ với những người được kiểm kê, có lẽ ám chỉ thủ tục kiểm kê dân số.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Mọi người... đều
  rationale: Diễn đạt tự nhiên ý phân phối “tất cả/mỗi người” của כֹּל khi từ này chi phối cụm phân từ theo sau.
- source_word: הָעֹבֵר עַל הַפְּקֻדִים
  choice: người đi qua để nhập vào số những người được kiểm kê
  rationale: Giữ hình ảnh cụ thể “đi qua” của עבר, đồng thời dùng “nhập vào số” để truyền đạt thành ngữ chỉ thủ tục kiểm kê; עַל trong kết cấu này có thể được hiểu theo quan hệ đi vào hoặc ở giữa nhóm đã được đếm.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Cách nói tiếng Việt hiện đại, rõ ràng cho công thức quy định ngưỡng tuổi.
- source_word: יִתֵּן
  choice: phải dâng
  rationale: Thể chưa hoàn thành ở đây mang lực quy định pháp lý; “phải” thể hiện nghĩa bắt buộc, còn “dâng” phù hợp với khoản được biệt riêng cho Đức Chúa Trời.
- source_word: תְּרוּמַת
  choice: phần đóng góp
  rationale: Trong bối cảnh tiền chuộc gắn với cuộc kiểm kê, từ này chỉ phần đóng góp được dành riêng; cách dịch này tránh thu hẹp thành một loại lễ vật nghi thức cụ thể.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm; giữ “Yahweh” bảo tồn sự phân biệt giữa danh riêng và tước hiệu.
- issue: Mức độ giải thích thành ngữ kiểm kê
  choice: đi qua để nhập vào số những người được kiểm kê
  alternative: được kể trong số những người đã được kiểm kê
  rationale: Bản dịch giữ hình ảnh “đi qua” trong tiếng Hê-bơ-rơ thay vì chuyển hoàn toàn thành ý trừu tượng “được đếm”, nhưng vẫn làm rõ quan hệ với thủ tục kiểm kê.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Cấu trúc “Mọi người... đều phải” tự nhiên trong tiếng Việt; cụm “đi qua” được giữ có chủ ý và được chú thích để bảo tồn nét mơ hồ của thành ngữ Hê-bơ-rơ.
