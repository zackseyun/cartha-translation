revisions:
- from: Mọi người từ hai mươi tuổi trở lên, là người đi qua để nhập vào số những người được kiểm kê[a], đều phải dâng phần đóng góp cho Yahweh.
  to: Mọi người từ hai mươi tuổi trở lên, khi đi qua để được ghi vào số những người được kiểm kê[a], phải dâng khoản đóng góp dành cho Yahweh.
  rationale: Bản sửa thay cấu trúc tiếng Việt không tự nhiên bằng một mệnh đề hoàn cảnh phù hợp văn phong luật lệ hiện đại. Cách này vẫn giữ động từ “đi qua” của nguyên văn, nhưng không khẳng định quá mức một cách giải thích duy nhất của thành ngữ. “Khoản đóng góp dành cho Yahweh” diễn đạt tự nhiên chức năng của תְּרוּמָה trong ngữ cảnh này.
  reviewer_model: gpt-5.6-terra
