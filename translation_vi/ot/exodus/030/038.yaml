  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: vi
  text: Bất cứ ai làm một loại hương giống như hương ấy để ngửi[a] thì sẽ bị loại khỏi dân mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để thưởng thức hương thơm của nó” hoặc “để ngửi mùi hương của nó.” Dạng động từ Hê-bơ-rơ diễn tả việc làm loại hương ấy nhằm tự mình ngửi hoặc thưởng thức hương thơm.'
    reason: lexical_alternative
  - marker: b
    text: “Bị loại khỏi dân mình” là một công thức pháp lý quen thuộc. Tùy văn cảnh, nó có thể hàm ý cái chết, bị khai trừ khỏi cộng đồng, hoặc bị Đức Chúa Trời trừ diệt.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Bất cứ ai
  rationale: Trong công thức luật pháp này, danh từ “người đàn ông” cùng đại từ quan hệ có nghĩa khái quát; “bất cứ ai” diễn đạt tự nhiên và không giới hạn giới tính.
- source_word: יַעֲשֶׂה
  choice: làm
  rationale: Động từ עשה có nghĩa rộng là “làm, chế tạo”; ở đây nói đến việc tạo ra hỗn hợp hương, và “làm” vừa sát nghĩa vừa dễ hiểu.
- source_word: כָמֹהָ
  choice: thứ giống như vậy
  rationale: Cụm này chỉ một loại hương giống hương thánh vừa được mô tả, nhưng không nhất thiết xác quyết mức độ đồng nhất tuyệt đối.
- source_word: לְהָרִיחַ בָּהּ
  choice: để ngửi mùi của nó
  rationale: Động từ ở thể Hiphil cùng giới từ diễn tả mục đích ngửi hoặc thưởng thức hương thơm; cách dịch này giữ ý trực tiếp và tự nhiên trong tiếng Việt.
- source_word: וְנִכְרַת
  choice: thì sẽ bị loại
  rationale: Thể Niphal của כרת là công thức chế tài pháp lý nghiêm trọng. “Bị loại” giữ hình ảnh bị tách khỏi cộng đồng mà không ấn định phương thức thi hành.
- source_word: מֵעַמָּיו
  choice: khỏi dân mình
  rationale: עם có thể chỉ dân tộc hoặc cộng đồng giao ước của người ấy; “dân mình” ngắn gọn, tự nhiên và giữ sắc thái tập thể.
theological_decisions:
- issue: Ý nghĩa của công thức hình phạt וְנִכְרַת מֵעַמָּיו
  choice: sẽ bị loại khỏi dân mình
  alternative: sẽ bị xử tử; sẽ bị trục xuất khỏi cộng đồng; sẽ bị Đức Chúa Trời trừ diệt
  rationale: Công thức Hê-bơ-rơ nêu một sự loại bỏ nghiêm trọng nhưng trong chính câu này không xác định đó là tử hình, khai trừ hay sự phán xét trực tiếp của Đức Chúa Trời. Bản dịch giữ nguyên độ mở đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc luật pháp “Bất cứ ai… thì sẽ…”; tránh từ Hán-Việt quá chuyên biệt. Hai chú thích bảo toàn sắc thái của mục đích ngửi hương và sự không xác định về hình thức chế tài.
