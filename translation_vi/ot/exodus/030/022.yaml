  text: 'Rồi Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng wayyiqtol đưa câu chuyện sang bước kế tiếp; “phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt để biểu thị trực tiếp danh YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Sau động từ “phán”, tiếng Việt tự nhiên dùng “phán với”; “Môi-se” là dạng tên quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn lời này, “rằng” giới thiệu trực tiếp nội dung lời phán ở câu kế tiếp, tự nhiên hơn lối dịch hình thức “mà nói rằng”.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu “CHÚA”; dạng “Đức Giê-hô-va” dễ nhận biết đối với độc giả Việt hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ công thức dẫn nhập lời phán nhưng tránh cấu trúc Hê-bơ-rơ gượng trong tiếng Việt.
