    issue: Đại từ “con”
    rationale: Nguyên văn dùng ngôi thứ hai số ít nhưng không có từ tương đương “con”. Cách xưng hô này đưa thêm một quan hệ vai vế vào bản dịch; “ngươi” vừa giữ ngôi số ít vừa phù hợp register chỉ thị.
  - severity: medium
    issue: “tức những người được ghi tên trong số họ” cho לִפְקֻדֵיהֶם
