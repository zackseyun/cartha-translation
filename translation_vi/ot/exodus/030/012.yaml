  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: vi
  text: Khi ngươi kiểm kê con trai Y-sơ-ra-ên theo số của họ,[a] thì mỗi người nam phải nộp cho Yahweh một giá chuộc cho mạng sống mình khi ngươi kiểm kê họ,[b] để không có tai họa nào giáng xuống họ khi ngươi kiểm kê họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “nhấc đầu các con trai Y-sơ-ra-ên lên theo số của họ”; đây là thành ngữ chỉ việc kiểm kê. Cụm “theo số của họ” cũng có thể hiểu là “theo sự kiểm kê của họ”.'
    reason: lexical_alternative
  - marker: b
    text: “Cho mạng sống mình” cũng có thể dịch là “cho chính mình”; từ Hê-bơ-rơ nephesh thường chỉ mạng sống hoặc bản thân, không chỉ “linh hồn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong chỉ thị pháp lý này, từ này mở đầu hoàn cảnh được dự liệu; “khi” tự nhiên và phù hợp hơn “nếu”.
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: kiểm kê
  rationale: Thành ngữ có nghĩa đen là “nhấc đầu lên”, nhưng trong ngữ cảnh hành chính chỉ việc đếm và lập danh sách dân số.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc và dạng giống đực của tiếng Hê-bơ-rơ; cách gọi “người Y-sơ-ra-ên” tuy tự nhiên hơn nhưng làm mất cấu trúc nguồn.
- source_word: לִפְקֻדֵיהֶם
  choice: tức những người được ghi tên trong số họ
  rationale: Diễn đạt sắc thái được đếm và ghi vào danh sách trong một cuộc kiểm kê, đồng thời làm rõ quan hệ với mệnh đề trước.
- source_word: וְנָתְנוּ אִישׁ
  choice: thì mỗi người nam phải dâng
  rationale: אִישׁ có lực phân phối, nói đến từng người nam thuộc nhóm được kiểm kê; “phải” thể hiện tính quy định của chỉ thị.
- source_word: כֹּפֶר נַפְשׁוֹ
  choice: một khoản chuộc mạng mình
  rationale: כֹּפֶר là khoản trả để chuộc hoặc tránh hình phạt; נֶפֶשׁ ở đây chỉ mạng sống hay chính bản thân, không nhất thiết là “linh hồn” theo nghĩa thần học về sau.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ trực tiếp danh riêng giao ước יהוה; giới từ ל phù hợp với người nhận khoản dâng.
- source_word: בִּפְקֹד אֹתָם
  choice: khi con kiểm kê họ
  rationale: Giữ chủ thể ngôi thứ hai số ít và sự lặp lại có chủ ý của động từ thuộc gốc פקד.
- source_word: נֶגֶף
  choice: tai họa
  rationale: Từ này có thể chỉ một đòn giáng gây chết chóc hoặc dịch họa. “Tai họa” giữ độ rộng nghĩa, không thu hẹp chắc chắn thành bệnh dịch.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Văn bản dùng trực tiếp Tứ tự thần danh; phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của נַפְשׁוֹ trong công thức chuộc
  choice: mạng mình
  alternative: linh hồn mình; chính mình
  rationale: Trong ngữ cảnh khoản nộp gắn với kiểm kê và việc tránh tai họa chết chóc, từ này nói đến mạng sống hoặc bản thân; “mạng mình” tránh nhập vào văn bản quan niệm nhị nguyên về linh hồn.
- issue: Phạm vi giới tính của בְּנֵי יִשְׂרָאֵל và אִישׁ
  choice: các con trai Y-sơ-ra-ên ... mỗi người nam
  alternative: dân Y-sơ-ra-ên ... mỗi người
  rationale: Bản Hê-bơ-rơ dùng cách gọi gia tộc giống đực và danh từ אִישׁ; bản dịch giữ dấu hiệu giới tính thay vì trung hòa nó.
- issue: Sắc thái của נֶגֶף
  choice: tai họa
  alternative: dịch bệnh; đòn giáng
  rationale: Ngữ cảnh cho thấy sự phán xét gây hại, nhưng bản thân từ không buộc phải chỉ riêng một đợt bệnh dịch; cách dịch rộng hơn bảo tồn độ mơ hồ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “con” cho đại từ ngôi thứ hai số ít trong lời Yahweh phán với Môi-se. Giữ cấu trúc lặp “khi con kiểm kê họ” của nguyên văn và dùng “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc.
