  - severity: low
    issue: “dâng ... một khoản chuộc mạng mình”
    rationale: Động từ “dâng” có thể gợi một lễ vật, trong khi כֹּפֶר là khoản thanh toán chuộc. “Nộp ... một giá chuộc cho mạng sống mình” rõ nghĩa và tự nhiên hơn.
