  to: Khi ngươi kiểm kê con trai Y-sơ-ra-ên theo số của họ,[a] thì mỗi người nam phải nộp cho Yahweh một giá chuộc cho mạng sống mình khi ngươi kiểm kê họ,[b] để không có tai họa nào giáng xuống họ khi ngươi kiểm kê họ.
