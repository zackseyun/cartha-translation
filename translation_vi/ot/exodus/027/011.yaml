source:
  edition: WLC
  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: vi
  text: Cũng vậy, về phía bắc, theo chiều dài, các tấm màn phải dài một trăm cu-bít[a], với hai mươi trụ và hai mươi đế bằng đồng của chúng; các móc của các trụ và các đai của chúng phải bằng bạc.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “dài một trăm”; đơn vị “cu-bít” được bổ sung theo các số đo trong văn cảnh ngay trước đó.
    reason: cultural_note
  - marker: b
    text: Từ Hê-bơ-rơ dịch là “đai” có thể chỉ những bộ phận nối hoặc bao quanh các trụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Cũng vậy
  rationale: Diễn đạt sự tương ứng với quy cách của cạnh sân vừa nêu ở câu trước.
- source_word: לִפְאַת צָפוֹן בָּאֹרֶךְ
  choice: dọc theo phía bắc
  rationale: Kết hợp tự nhiên trong tiếng Việt ý về cạnh phía bắc và chiều dài của cạnh ấy.
- source_word: קְלָעִים
  choice: các tấm màn
  rationale: Trong ngữ cảnh sân Đền Tạm, từ này chỉ những tấm màn tạo thành phần bao quanh; cách dịch này cụ thể và dễ hiểu.
- source_word: מֵאָה אֹרֶךְ
  choice: dài một trăm cu-bít
  rationale: Nguyên văn chỉ nói 'dài một trăm'; đơn vị cu-bít được hiểu rõ từ các số đo ngay trong văn cảnh.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: với hai mươi trụ
  rationale: Giữ ý liệt kê các bộ phận thuộc cạnh phía bắc, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: hai mươi đế bằng đồng của chúng
  rationale: אדן là đế hoặc ổ đỡ chân trụ; 'đế' dễ hiểu hơn, còn נחשת trong ngữ cảnh này được dịch là đồng.
- source_word: וָוֵי הָעַמֻּדִים
  choice: các móc trên trụ
  rationale: וָוִים chỉ các móc gắn với trụ; 'trên trụ' tự nhiên hơn trong tiếng Việt mà vẫn giữ quan hệ của nguyên văn.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: các đai của chúng
  rationale: Từ này chỉ những bộ phận nối hoặc bao quanh các trụ; 'đai' giữ được độ rộng nghĩa mà không áp đặt một cấu tạo quá cụ thể.
- source_word: כָּסֶף
  choice: bạc
  rationale: Chỉ vật liệu, có nghĩa trực tiếp là bạc.
theological_decisions: []
