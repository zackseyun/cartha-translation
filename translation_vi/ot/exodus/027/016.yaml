    issue: “vải gai mịn xe lại” cho וְשֵׁשׁ מָשְׁזָר
    rationale: שֵׁשׁ trong ngữ cảnh này là vải lanh mịn; מָשְׁזָר chỉ vật liệu se/xe sợi. “Vải gai” rộng nghĩa hơn và “xe lại” không tự nhiên khi bổ nghĩa cho vải.
  - severity: low
    issue: “Còn tại cổng sân”
    rationale: Cụm này không sai nghĩa, nhưng cách mở đầu “Ở cổng sân” tự nhiên và sáng rõ hơn trong văn xuôi chỉ dẫn hiện đại.
