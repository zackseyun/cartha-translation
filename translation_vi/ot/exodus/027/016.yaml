base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: vi
  text: Ở cổng sân, phải có một bức màn che[a] dài hai mươi cu-bít[b], làm bằng sợi xanh lam, tím, đỏ thắm và vải lanh mịn se sợi, là công việc của thợ thêu, cùng với bốn trụ và bốn đế[c] của chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “màn” hoặc “tấm rèm” che lối vào.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “hai mươi cu-bít”; từ “dài” được thêm để làm rõ chiều kích. Một cu-bít dài khoảng 44,5 cm.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “bệ” hoặc “ổ đỡ” của các trụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: Còn tại cổng sân
  rationale: שַׁעַר là cổng hoặc lối vào, còn חָצֵר là khu sân có rào bao quanh. Cách dịch này giữ cấu trúc kiến trúc và liên kết câu với các chỉ dẫn trước.
- source_word: מָסָךְ
  choice: một bức màn che
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ tấm vải treo che lối vào, không phải một cánh cửa đặc.
- source_word: עֶשְׂרִים אַמָּה
  choice: dài hai mươi cu-bít
  rationale: Bản Hê-bơ-rơ chỉ ghi đơn vị đo; thêm “dài” để làm rõ chiều kích của bức màn trong tiếng Việt.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: sợi màu xanh lam, màu tím, màu đỏ thắm
  rationale: Ba thuật ngữ chỉ các loại vật liệu dệt được nhuộm màu; “sợi” diễn đạt tự nhiên tính chất vật liệu trong danh sách.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe lại
  rationale: שֵׁשׁ chỉ vải gai mịn, còn מָשְׁזָר mô tả vật liệu được xe hoặc bện lại.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: sản phẩm của thợ thêu
  rationale: Giữ sắc thái công việc thủ công tinh xảo và hình thức chỉ tác nhân của cụm từ Hê-bơ-rơ.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה וְאַדְנֵיהֶם אַרְבָּעָה
  choice: bốn trụ và bốn đế của chúng
  rationale: Giữ các hậu tố sở hữu số nhiều được nêu rõ trong tiếng Hê-bơ-rơ; אֶדֶן được dịch là “đế” vì đây là bộ phận đỡ chân trụ.
