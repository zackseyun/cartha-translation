translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng các thuật ngữ kiến trúc dễ hiểu. Giữ đơn vị cổ “cu-bít” thay vì quy đổi ngay trong chính văn, đồng thời giải thích ngắn ở chú thích. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau từ ngữ liên quan.
