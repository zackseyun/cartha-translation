  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: vi
  text: Ngươi phải làm bàn thờ rỗng bên trong, bằng các tấm ván[a]. Như điều đã được chỉ cho ngươi thấy trên núi, thì họ phải làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “làm bàn thờ rỗng, bằng các tấm ván.” Tiếng Hê-bơ-rơ mô tả bàn thờ là một kết cấu bằng ván, rỗng bên trong.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב לֻחֹת
  choice: rỗng ruột bằng các tấm ván
  rationale: Cụm từ mô tả bàn thờ là một kết cấu rỗng, làm bằng các tấm ván chứ không phải một khối đặc. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ cả đặc điểm lẫn vật liệu.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: Ngươi phải làm bàn thờ
  rationale: Động từ ngôi hai số ít là mệnh lệnh dành cho Môi-se. Dùng “bàn thờ” thay cho đại từ để câu tiếng Việt rõ nghĩa trong một câu trích riêng.
- source_word: כַּאֲשֶׁר
  choice: thế nào
  rationale: Kết hợp với “như vậy” để diễn đạt tự nhiên cấu trúc tương ứng כַּאֲשֶׁר... כֵּן của tiếng Hê-bơ-rơ.
- source_word: הֶרְאָה אֹתְךָ
  choice: Người ta đã cho ngươi thấy
  rationale: Hình thái Hoph'al ngôi ba số ít mang nghĩa bị động/phiếm chỉ. Cách dịch này không nêu đích danh tác nhân thần linh, phù hợp với sự kín đáo của nguyên văn.
- source_word: בָּהָר
  choice: trên núi
  rationale: Đây là cách nói tự nhiên trong tiếng Việt về địa điểm Môi-se được cho thấy mẫu.
- source_word: כֵּן יַעֲשׂוּ
  choice: thì họ phải làm như vậy
  rationale: Giữ động từ số nhiều và lực chỉ thị của câu; “họ” chỉ những người thực hiện công việc chế tác.
theological_decisions:
- issue: Tác nhân của việc cho Môi-se thấy mẫu
  choice: 'Giữ cách diễn đạt phiếm chỉ: “Người ta đã cho ngươi thấy”'
  alternative: “Đức Chúa Trời đã cho ngươi thấy”
  rationale: Nguyên văn dùng thể Hoph'al và không gọi tên tác nhân; bản dịch không nên tự bổ sung danh xưng thần linh dù ngữ cảnh có thể hàm ý điều đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngươi” được dùng để giữ lời truyền trực tiếp ở ngôi hai số ít; câu sau chuyển sang “họ” theo động từ số nhiều của nguyên văn.
