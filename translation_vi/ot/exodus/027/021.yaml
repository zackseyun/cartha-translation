base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: vi
  text: Trong Lều Hội Kiến, phía ngoài bức màn ở trước Chứng Ước,[a] A-rôn và các con trai ông phải sắp đặt đèn ấy[b] trước mặt Yahweh, từ chiều đến sáng. Đây là luật lệ vĩnh viễn qua các thế hệ của họ, từ con dân Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chứng Ước” nhiều khả năng chỉ hai bảng giao ước đặt trong hòm; vì thế, câu này mô tả bức màn nằm phía trước hòm chứa các bảng ấy.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “sửa soạn đèn ấy” hoặc “chăm lo đèn ấy.” Động từ Hê-bơ-rơ có nghĩa chính là sắp đặt hoặc sửa soạn; trong ngữ cảnh này, từ ấy liên quan đến công việc phục vụ đèn.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “từ con dân Israel.” Cụm từ này có thể chỉ nguồn gốc hoặc phía chịu trách nhiệm; theo văn mạch, việc cung cấp dầu và việc tuân giữ quy định liên hệ đến con dân Israel.'
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Dùng cách gọi rõ ràng, trang trọng cho nơi Đức Chúa Trời gặp dân Ngài; giữ tính chất thuật ngữ của cụm từ Hê-bơ-rơ.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: phía ngoài bức màn
  rationale: פָּרֹכֶת là bức màn ngăn Nơi Thánh với nơi chí thánh; “bức màn” tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: ở trước Chứng Ước
  rationale: Trong cách bố trí Đền Tạm, bức màn nằm phía trước Hòm Chứng Ước. “Chứng Ước” giữ được nghĩa chuyên biệt của הָעֵדֻת mà không đồng nhất nó với chính chiếc hòm.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: phải chăm lo đèn ấy
  rationale: ערך có nghĩa sắp đặt, sửa soạn hoặc giữ cho đúng trật tự. Trong ngữ cảnh việc phục vụ đèn, “chăm lo” diễn đạt tự nhiên công việc duy trì và sửa soạn; “đèn ấy” làm rõ đại từ số ít nhờ văn mạch câu trước.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: từ chiều tối đến sáng
  rationale: Chuyển trực tiếp khoảng thời gian phục vụ ban đêm bằng một cách nói tự nhiên trong tiếng Việt.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ chỉ sự hiện diện phụng tự và giữ nguyên danh giao ước Yahweh.
- source_word: חֻקַּת עוֹלָם
  choice: quy định lâu dài
  rationale: Diễn đạt hiệu lực bền vững của luật lệ trong các thế hệ mà không buộc עוֹלָם phải mang nghĩa siêu hình là vô tận tuyệt đối.
- source_word: לְדֹרֹתָם
  choice: qua các thế hệ của họ
  rationale: Giữ công thức giao ước nói đến việc tiếp tục áp dụng trong những thế hệ kế tiếp.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: do con dân Israel thực hiện
  rationale: מֵאֵת đánh dấu điều phát xuất từ hoặc thuộc trách nhiệm của con dân Israel. Cách dịch này tự nhiên hơn “từ con dân Israel” trong tiếng Việt, đồng thời không biến cụm từ thành lời chỉ dẫn riêng cho các thầy tế lễ.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: CHÚA hoặc Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng một tước hiệu.
- issue: Phạm vi thời gian của חֻקַּת עוֹלָם
  choice: quy định lâu dài
  alternative: quy định đời đời
  rationale: “Lâu dài” giữ ý nghĩa bền vững qua các thế hệ trong văn cảnh luật lệ phụng tự, nhưng không âm thầm quyết định rằng từ ngữ nhất thiết khẳng định tính vĩnh cửu tuyệt đối.
- issue: Đối tượng của הָעֵדֻת
  choice: Chứng Ước
  alternative: Hòm Chứng Ước
  rationale: Từ Hê-bơ-rơ chỉ “chứng ước,” nhiều khả năng là các bảng giao ước đặt trong hòm. Không thêm “Hòm” vào chính văn để tránh đồng nhất vật chứa với điều được chứa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng các thuật ngữ phụng tự nhất quán như “Lều Hội Kiến” và “Chứng Ước,” nhưng tránh lối diễn đạt Hán-Việt quá nặng. Giữ danh Yahweh và ghi chú các điểm mà nguyên văn còn cho phép hơn một cách hiểu.
