revisions:
- from: Trong Lều Hội Kiến, phía ngoài bức màn ở trước Chứng Ước,[a] A-rôn và các con trai ông phải chăm lo đèn ấy[b] trước mặt Yahweh, từ chiều tối đến sáng. Đó là quy định lâu dài qua các thế hệ của họ, do con dân Israel thực hiện.[c]
  to: Trong Lều Hội Kiến, phía ngoài bức màn ở trước Chứng Ước,[a] A-rôn và các con trai ông phải sắp đặt đèn ấy[b] trước mặt Yahweh, từ chiều đến sáng. Đây là luật lệ vĩnh viễn qua các thế hệ của họ, từ con dân Israel.[c]
  rationale: Sửa động từ chính theo nghĩa trực tiếp “sắp đặt,” phục hồi lực của công thức luật lệ bằng “vĩnh viễn,” và tránh thêm động từ “thực hiện” vào cụm cuối. Các chú thích được điều chỉnh để phản ánh các khả năng ngữ nghĩa mà không áp đặt một cách giải thích duy nhất.
  reviewer_model: gpt-5.6-terra
