  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: vi
  text: Tất cả các trụ chung quanh sân đều phải được nẹp bằng bạc[a]; các móc của chúng bằng bạc, và các đế[b] của chúng bằng đồng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được nối bằng các thanh bạc” hoặc “được đai bằng bạc.” Từ Hê-bơ-rơ chỉ phần nẹp, đai hoặc thanh nối bằng bạc trên các trụ.'
    reason: lexical_alternative
  - marker: b
    text: “Đế” cũng có thể dịch là “ổ đế,” tức bộ phận kim loại để đặt và giữ chân trụ.
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ có thể chỉ đồng hoặc một hợp kim đồng trong cách dùng thời cổ; vì vậy cũng có thể dịch là “đồng thiếc” hoặc “đồng đỏ” tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: Tất cả các trụ chung quanh sân
  rationale: Diễn đạt tự nhiên toàn bộ các trụ bao quanh khu sân của Đền Tạm; “trụ” và “sân” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: được nẹp bạc
  rationale: Dạng phân từ bị động nói đến phần nẹp, đai hoặc thanh liên kết bằng bạc. “Nẹp bạc” vừa gọn vừa giữ được hình ảnh kiến trúc, trong khi các khả năng khác được nêu ở chú thích.
- source_word: וָוֵיהֶם כָּסֶף
  choice: các móc của chúng bằng bạc
  rationale: וָוִים thường chỉ các móc dùng với màn bao quanh sân; cách dịch này sát nghĩa và dễ hiểu.
- source_word: אַדְנֵיהֶם
  choice: các đế của chúng
  rationale: Chỉ bộ phận kim loại đỡ và giữ chân trụ; “đế” là cách nói phổ thông, còn nghĩa kỹ thuật “ổ đế” được bảo lưu trong chú thích.
- source_word: נְחֹשֶׁת
  choice: đồng thiếc
  rationale: Trong ngữ cảnh vật liệu Đền Tạm, từ này thường được hiểu là bronze, tức hợp kim đồng; “đồng thiếc” phân biệt rõ với đồng nguyên chất, nhưng chú thích giữ khả năng dịch là “đồng”.
