  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dịch giữ cách gọi trực tiếp “phía thứ hai”, đồng thời bổ sung đơn vị đo đã được tỉnh lược theo ngữ cảnh gần; phần bổ sung được ghi chú minh bạch.
