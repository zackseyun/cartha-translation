  text: וְ/לַ/כָּתֵף֙ הַ/שֵּׁנִ֔ית חְמֵ֥שׁ עֶשְׂרֵ֖ה קְלָעִ֑ים עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/015.yaml
  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: vi
  text: Còn ở phía thứ hai là các tấm màn dài mười lăm cubit[a], với ba trụ và ba đế trụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không lặp lại đơn vị “cubit”; đơn vị này được hiểu theo cấu trúc song song ở câu 14. Một cubit là khoảng cách từ khuỷu tay đến đầu ngón tay.
    reason: supplied_measurement
  - marker: b
    text: Cũng có thể dịch là “ổ trụ”. Từ Hê-bơ-rơ chỉ bộ phận nền dùng để giữ trụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף הַ/שֵּׁנִית
  choice: Còn ở phía thứ hai
  rationale: כָּתֵף có nghĩa đen là “vai”, nhưng trong bản mô tả sân Đền Tạm chỉ một phía hoặc cánh bên; “phía thứ hai” vừa tự nhiên trong tiếng Việt vừa giữ trực tiếp số thứ tự הַשֵּׁנִית.
- source_word: חְמֵשׁ עֶשְׂרֵה קְלָעִים
  choice: các tấm màn dài mười lăm cubit
  rationale: קְלָעִים là các màn dệt tạo thành vách bao quanh sân. Theo cấu trúc song song ở câu 14, “mười lăm” chỉ chiều dài tính bằng cubit, chứ không phải số lượng mười lăm tấm màn; đơn vị đo được tỉnh lược trong câu Hê-bơ-rơ này.
- source_word: עַמֻּדֵי/הֶם שְׁלֹשָׁה
  choice: ba trụ
  rationale: עַמּוּד là bộ phận thẳng đứng đỡ các tấm màn; “trụ” là cách gọi rõ ràng, tự nhiên trong ngữ cảnh kiến trúc.
- source_word: וְ/אַדְנֵי/הֶם שְׁלֹשָׁה
  choice: và ba đế trụ
  rationale: אֶדֶן chỉ bộ phận nền hoặc ổ đỡ mà trụ được đặt vào. “Đế trụ” dễ hiểu trong tiếng Việt hiện đại và làm rõ quan hệ kết cấu.
