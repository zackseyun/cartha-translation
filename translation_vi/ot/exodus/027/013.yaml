base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/013.yaml
  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
translation:
  language: vi
  text: Chiều rộng của sân ở phía đông[a], hướng về phía mặt trời mọc, là năm mươi am-ma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chiều rộng của sân về phía đông, hướng đông, là năm mươi am-ma.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרֹחַב
  choice: Chiều rộng
  rationale: רֹחַב chỉ kích thước theo bề ngang. “Chiều rộng” là cách diễn đạt tự nhiên, chính xác trong tiếng Việt hiện đại; liên từ וְ được thể hiện qua sự tiếp nối của câu trong mạch mô tả, không nhất thiết phải dịch máy móc là “và”.
- source_word: הֶחָצֵר
  choice: của sân
  rationale: חָצֵר ở đây là khu vực có hàng rào bao quanh Đền Tạm. “Sân” ngắn gọn, tự nhiên và phù hợp với ngữ cảnh kiến trúc thánh.
- source_word: לִפְאַת קֵדְמָה
  choice: ở phía đông
  rationale: פֵאָה có nghĩa là phía, cạnh hoặc mé; kết hợp với קֵדְמָה, cụm này xác định phía đông của sân. “Ở phía đông” là cách nói tự nhiên trong tiếng Việt.
- source_word: מִזְרָחָה
  choice: hướng về phía mặt trời mọc
  rationale: מִזְרָחָה chỉ hướng đông, theo nghĩa hướng mặt trời mọc. Cách dịch này giữ được sự nhấn mạnh phương hướng kép trong tiếng Hê-bơ-rơ mà không lặp từ “đông” một cách vụng về.
- source_word: חֲמִשִּׁים
  choice: năm mươi
  rationale: Đây là số từ chỉ số lượng năm mươi.
- source_word: אַמָּה
  choice: am-ma
  rationale: אַמָּה là đơn vị chiều dài cổ, thường tính từ khuỷu tay đến đầu ngón tay. Giữ tên đơn vị “am-ma” tránh quy đổi thiếu chắc chắn sang hệ mét hoặc làm nó thành một đơn vị chung chung.
