translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tách sau phần kích thước để tránh chuỗi bổ nghĩa nặng nề; “Sân được bao bằng” làm rõ quan hệ ngữ pháp hàm ẩn giữa chiều cao và vật liệu rèm mà không thêm ý thần học. Dùng “cu-bít” nhất quán cho đơn vị đo cổ.
