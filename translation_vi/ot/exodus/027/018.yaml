  text: אֹ֣רֶךְ הֶֽ/חָצֵר֩ מֵאָ֨ה בָֽ/אַמָּ֜ה וְ/רֹ֣חַב חֲמִשִּׁ֣ים בַּ/חֲמִשִּׁ֗ים וְ/קֹמָ֛ה חָמֵ֥שׁ אַמּ֖וֹת שֵׁ֣שׁ מָשְׁזָ֑ר וְ/אַדְנֵי/הֶ֖ם נְחֹֽשֶׁת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: vi
  text: Chiều dài của sân là một trăm cu-bít, chiều rộng là năm mươi cu-bít[a], và chiều cao là năm cu-bít, bằng vải lanh mịn xe sợi; các chân đế bằng đồng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ có cách nói bất thường, sát chữ là “năm mươi trong/trên năm mươi.” Ý nghĩa chính xác của cách diễn đạt này không hoàn toàn chắc chắn; bản dịch câu chính hiểu là “năm mươi cu-bít.”
    reason: Bảo lưu lối diễn đạt bất thường và sự mơ hồ của nguyên văn, mà không biến nó thành phép nhân hay thêm chi tiết không có trong bản gốc.
  - marker: b
    text: 'Hoặc: “các ổ đế bằng đồng”; đây là những bộ phận đỡ hoặc giữ chân trụ.'
    reason: Nêu nghĩa kỹ thuật khả dĩ của אַדֶן.
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: chiều dài của sân
  rationale: Diễn đạt tự nhiên kích thước của khu sân bao quanh Đền Tạm; “sân” rõ ràng và gọn trong ngữ cảnh kiến trúc thánh.
- source_word: מֵאָה בָאַמָּה
  choice: một trăm cu-bít
  rationale: Giữ nguyên đơn vị đo cổ để bảo toàn sự tương ứng với các chỉ dẫn xây dựng Đền Tạm.
- source_word: חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: năm mươi cu-bít suốt từ đầu đến cuối[a]
  rationale: Cụm Hê-bơ-rơ có lối diễn đạt bất thường, sát chữ là “năm mươi trên/ở năm mươi.” Cách dịch chính truyền đạt cách hiểu thông dụng là chiều rộng năm mươi cu-bít trên toàn bộ chiều dài liên quan, đồng thời chú thích bảo lưu hình thức và khả năng dịch sát chữ.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: và chiều cao năm cu-bít
  rationale: Giữ cấu trúc song song của ba kích thước và đơn vị đo trong nguyên văn.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe
  rationale: שֵׁשׁ chỉ loại vải gai mịn trong các đoạn về Đền Tạm, còn מָשְׁזָר mô tả sợi được xe lại; cách diễn đạt này ngắn gọn và dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְאַדְנֵיהֶם
  choice: các chân đế[b]
  rationale: אַדֶן là bộ phận kim loại đỡ hoặc giữ các trụ. “Chân đế” dễ hiểu hơn trong tiếng Việt phổ thông; nghĩa kỹ thuật “ổ đế” được ghi ở chú thích.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ này có thể chỉ đồng hoặc hợp kim đồng; “đồng” là cách gọi tự nhiên, không khẳng định thành phần hợp kim cụ thể hơn mức nguyên văn.
