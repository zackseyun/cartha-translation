- from: Chiều dài của sân là một trăm cu-bít, chiều rộng năm mươi cu-bít suốt từ đầu đến cuối[a], và chiều cao năm cu-bít. Sân được bao bằng vải gai mịn xe, còn các chân đế[b] thì bằng đồng.
  to: Chiều dài của sân là một trăm cu-bít, chiều rộng là năm mươi cu-bít[a], và chiều cao là năm cu-bít, bằng vải lanh mịn xe sợi; các chân đế bằng đồng[b].
  rationale: Loại bỏ diễn giải “suốt từ đầu đến cuối,” sửa chú thích để phản ánh an toàn cụm số đo khó trong tiếng Hê-bơ-rơ, và dùng “vải lanh mịn xe sợi” cho thuật ngữ dệt may của Đền Tạm. Cấu trúc câu vẫn giữ ba số đo, vật liệu, và chân đế bằng đồng của nguyên văn.
