  text: וְ/עָשִׂ֤יתָ סִּֽירֹתָי/ו֙ לְ/דַשְּׁנ֔/וֹ וְ/יָעָי/ו֙ וּ/מִזְרְקֹתָ֔י/ו וּ/מִזְלְגֹתָ֖י/ו וּ/מַחְתֹּתָ֑י/ו לְ/כָל כֵּלָ֖י/ו תַּעֲשֶׂ֥ה נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: vi
  text: Ngươi phải làm các nồi để dọn tro[a] của bàn thờ, cùng các xẻng, chậu, chĩa và khay đựng than; mọi dụng cụ của bàn thờ đều phải làm bằng đồng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ sát nghĩa là “dọn tro béo”; đây là tro còn lại sau khi các lễ vật trên bàn thờ bị thiêu.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ có thể chỉ đồng hoặc đồng thiếc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng Qal ngôi hai số ít trong lời chỉ dẫn mang sắc thái mệnh lệnh; cách dịch này trang trọng, rõ ràng và giữ nguyên đối tượng số ít.
- source_word: סִּירֹתָיו
  choice: các nồi
  rationale: Danh từ chỉ những vật chứa; chức năng dọn tro được diễn đạt bởi cụm theo sau nên không ghép nghĩa ấy vào chính danh từ.
- source_word: לְדַשְּׁנוֹ
  choice: để dọn tro của bàn thờ
  rationale: Trong ngữ cảnh bàn thờ, động từ Piel chỉ việc lấy lớp tro do lễ vật bị thiêu để lại. Nêu rõ 'của bàn thờ' giúp đại từ sở hữu tự nhiên và không mơ hồ trong tiếng Việt.
- source_word: יָעָיו
  choice: các xẻng
  rationale: Chỉ dụng cụ dùng để xúc hoặc xử lý tro và than.
- source_word: מִזְרְקֹתָיו
  choice: chậu
  rationale: Chỉ những vật chứa chất lỏng, đặc biệt có thể dùng trong nghi lễ; 'chậu' tự nhiên hơn 'bát' trong ngữ cảnh này.
- source_word: מִזְלְגֹתָיו
  choice: chĩa
  rationale: Chỉ dụng cụ có các ngạnh; 'chĩa' rõ nghĩa trong tiếng Việt hiện đại mà không thêm ý 'móc thịt' vốn mang tính diễn giải.
- source_word: מַחְתֹּתָיו
  choice: khay đựng than
  rationale: Danh từ thường chỉ vật dùng để chứa hoặc mang than lửa; cách dịch chức năng này rõ hơn một thuật ngữ chuyên biệt ít quen thuộc.
- source_word: לְכָל כֵּלָיו
  choice: mọi dụng cụ của bàn thờ
  rationale: כְּלִי là từ rộng chỉ đồ dùng hoặc dụng cụ; nhắc lại 'bàn thờ' làm rõ sở hữu trong tiếng Việt.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ Hê-bơ-rơ có thể chỉ đồng hoặc đồng thiếc. 'Đồng' là cách gọi tự nhiên, đủ rộng trong tiếng Việt; khả năng cụ thể là đồng thiếc được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng dễ hiểu. Dùng 'ngươi' để giữ ngôi hai số ít của nguyên văn; lặp lại 'của bàn thờ' thay cho chuỗi đại từ sở hữu để câu tiếng Việt rõ ràng. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
