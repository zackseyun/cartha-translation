language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/מִּזְבֵּ֖חַ עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אֹ֜רֶךְ וְ/חָמֵ֧שׁ אַמּ֣וֹת רֹ֗חַב רָב֤וּעַ יִהְיֶה֙ הַ/מִּזְבֵּ֔חַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: vi
  text: Ngươi phải làm bàn thờ bằng gỗ keo, dài năm cu-bít, rộng năm cu-bít; bàn thờ phải vuông, và cao ba cu-bít.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một cu-bít là đơn vị đo chiều dài tính từ khuỷu tay đến đầu ngón tay, khoảng 45 cm; vì vậy bàn thờ dài và rộng khoảng 2,25 m, cao khoảng 1,35 m.
    reason: Giải thích đơn vị đo cổ cho độc giả hiện đại; các số quy đổi chỉ là xấp xỉ vì độ dài cu-bít có thể thay đổi.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng Qal hoàn thành có liên từ trong mạch chỉ thị mang lực mệnh lệnh. “Ngươi phải làm” diễn đạt rõ mệnh lệnh trực tiếp dành cho Môi-se và giữ văn phong trang trọng.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Cách gọi chuẩn, tự nhiên trong tiếng Việt đối với מִזְבֵּחַ, tức bàn dùng cho việc dâng tế lễ trong các chỉ dẫn về Đền Tạm.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm kết cấu chỉ vật liệu. “Gỗ keo” là cách gọi hiện đại, dễ hiểu cho loại gỗ thường được nhận diện là acacia, thay vì phiên âm tên Hê-bơ-rơ.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: dài năm cu-bít
  rationale: Diễn đạt kích thước tự nhiên trong tiếng Việt, giữ nguyên đơn vị đo cổ.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: rộng năm cu-bít
  rationale: Giữ cấu trúc song song với chiều dài và diễn đạt tự nhiên trong tiếng Việt.
- source_word: רָבוּעַ יִהְיֶה
  choice: phải vuông
  rationale: רָבוּעַ mô tả hình vuông; “vuông” rõ nghĩa và tự nhiên hơn những cách diễn đạt cổ như “vuông bốn bề”.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: và cao ba cu-bít
  rationale: Diễn đạt đầy đủ kích thước chiều cao và đại từ sở hữu ngầm quy chiếu về bàn thờ bằng cấu trúc tiếng Việt gọn, tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “ngươi” vì lời chỉ dẫn được nói với một người, là Môi-se; giữ “cu-bít” trong chính văn để không tạo độ chính xác giả khi quy đổi đơn vị cổ. Không tiếp nhận chú thích tiếng Anh gắn với “acacia wood” nhưng lại nói “foursquare”, vì chú thích ấy không phù hợp với vị trí dấu chú thích và không phản ánh một dị bản cần thiết.
