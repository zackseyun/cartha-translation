translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ngươi” để thể hiện lời truyền trực tiếp ở số ít; giữ cấu trúc nhấn mạnh kép về hướng nam và đơn vị đo cổ “cu-bít”.
