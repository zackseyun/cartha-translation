  terminology: Giữ nhất quán “sân”, “Đền Tạm”, “tấm màn”, và “cu-bít”. Sửa “vải gai mịn xe sợi” thành “vải lanh mịn xe sợi” để phản ánh chính xác שֵׁשׁ מָשְׁזָר.
