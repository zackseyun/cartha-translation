base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: vi
  text: Ngươi hãy làm sân của Đền Tạm. Về phía nam, về hướng nam, hãy làm các tấm màn[a] bằng vải lanh mịn xe sợi cho sân, dài một trăm cu-bít cho một phía.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tấm rèm”. Từ Hê-bơ-rơ chỉ những tấm vải tạo thành ranh giới của sân.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: sân
  rationale: Chỉ khu vực trống có rào bao quanh gắn với Đền Tạm; “sân” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ quen thuộc chỉ lều thánh trong sách Xuất Ai Cập, vừa giữ sắc thái thờ phượng vừa dễ hiểu.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: Về phía nam, hướng về phương nam
  rationale: Giữ sự lặp nhấn mạnh phương nam trong tiếng Hê-bơ-rơ thay vì thu gọn thành một tính từ.
- source_word: קְלָעִים
  choice: các tấm màn
  rationale: Chỉ những tấm vải tạo thành ranh giới sân; “tấm màn” diễn đạt cả vật liệu dạng vải lẫn chức năng che chắn.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe sợi
  rationale: Giữ cả chất liệu cao cấp và đặc điểm sợi được xe; cách diễn đạt phù hợp với thuật ngữ dệt may trong văn cảnh cổ.
- source_word: מֵאָה בָאַמָּה
  choice: một trăm cu-bít
  rationale: Giữ nguyên đơn vị đo cổ thay vì quy đổi phỏng đoán.
- source_word: אֹרֶךְ
  choice: dài
  rationale: Kết hợp tự nhiên với số đo trong tiếng Việt.
- source_word: לַפֵּאָה הָאֶחָת
  choice: cho phía ấy
  rationale: Chỉ phía đang được mô tả; “phía ấy” tự nhiên hơn cách dịch máy móc “một phía” trong ngữ cảnh này.
