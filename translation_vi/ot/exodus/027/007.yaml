  terminology: “Bàn thờ” là cách dịch chuẩn của מִזְבֵּחַ. “Đòn khiêng” truyền đạt đúng chức năng của בַּדִּים; “khoen” phù hợp với טַּבָּעֹת. Chú thích b giữ mở nghĩa của צַלְעֹת (“bên/sườn/bộ phận bên”) mà không áp đặt một cách hiểu kiến trúc cụ thể.
