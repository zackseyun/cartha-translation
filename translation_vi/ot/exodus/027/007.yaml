  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và nghĩa của tiếng Hê-bơ-rơ: các đòn được đặt/luồn vào khoen; các đòn ở dọc hai bên bàn thờ trong lúc bàn thờ được khiêng. “Phải được” bảo toàn sắc thái bị động của וְהוּבָא, còn “khi người ta khiêng bàn thờ” diễn đạt tự nhiên hoàn cảnh của בִּשְׂאֵת אֹתוֹ mà không thêm một chủ thể xác định.'
