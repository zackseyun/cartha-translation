base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: vi
  text: Các đòn khiêng phải được luồn vào các khoen[a], và các đòn ấy phải nằm dọc theo hai bên[b] bàn thờ khi người ta khiêng bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải được đem vào các khoen.” Động từ Hê-bơ-rơ ở thể bị động và trong ngữ cảnh này nói đến việc lắp các đòn để vận chuyển.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ cũng có thể chỉ “hai sườn” hoặc “hai bộ phận bên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: phải được luồn vào
  rationale: Dạng Hophal diễn tả ý bị động/tha khiến. Trong ngữ cảnh lắp đòn để vận chuyển, “được luồn vào” tự nhiên và cụ thể hơn “được đem vào”, đồng thời vẫn giữ lực bị động.
- source_word: בַּדָּיו / הַבַּדִּים
  choice: các đòn khiêng / các đòn ấy
  rationale: בַּד chỉ những đòn dùng để khiêng đồ thánh. “Đòn khiêng” rõ nghĩa trong tiếng Việt hiện đại; lần nhắc lại dùng “các đòn ấy” để câu tự nhiên mà không mất đối tượng quy chiếu.
- source_word: בַּטַּבָּעֹת
  choice: vào các khoen
  rationale: בּ trong ngữ cảnh này chỉ nơi tiếp nhận khi các đòn được luồn vào. “Khoen” là từ tự nhiên cho các vòng gắn vào vật để xỏ hoặc luồn đòn qua.
- source_word: וְהָיוּ
  choice: phải nằm
  rationale: Trong chuỗi chỉ dẫn, động từ היה nói đến vị trí của các đòn sau khi được luồn vào; “phải nằm” diễn đạt tự nhiên trạng thái được quy định.
- source_word: עַל שְׁתֵּי צַלְעֹת
  choice: dọc theo hai bên
  rationale: עַל có nghĩa cơ bản là trên/tại, còn צְלָעוֹת có thể là các bên, sườn hoặc bộ phận bên. “Dọc theo hai bên” diễn đạt rõ vị trí của các đòn khiêng mà không quyết định rằng đây nhất thiết là hai tấm bên riêng biệt.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Cách dịch chuẩn, tự nhiên của מִזְבֵּחַ trong ngữ cảnh thờ phượng.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: khi người ta khiêng bàn thờ
  rationale: Cấu trúc nguyên mẫu với בּ diễn tả hoàn cảnh hoặc thời gian. Tiếng Hê-bơ-rơ không nêu chủ thể; “người ta” giữ tính phiếm chỉ và việc lặp “bàn thờ” giúp tránh đại từ mơ hồ trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại. Dùng “đòn khiêng” và “khoen” là những từ cụ thể, dễ hiểu; tránh từ cổ. Câu giữ tính quy định của bản Hê-bơ-rơ bằng “phải”, đồng thời bảo toàn độ mở nghĩa của צַלְעֹת qua chú thích.
