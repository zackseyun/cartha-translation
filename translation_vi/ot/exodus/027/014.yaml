    text: 'Nguyên văn: “về vai”; trong ngữ cảnh này, từ Hê-bơ-rơ chỉ một cạnh hay phần bên của lối vào sân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: dài mười lăm cu-bít
  rationale: Cụm từ chỉ số đo chiều dài mười lăm cu-bít; thêm “dài” giúp câu tiếng Việt tự nhiên mà không bổ sung nội dung ngoài nguyên văn.
- source_word: קְלָעִים
  choice: các tấm màn
  rationale: Trong ngữ cảnh sân Đền Tạm, từ này chỉ những tấm vải giăng tạo thành hàng rào bao quanh; “các tấm màn” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: לַכָּתֵף
  choice: về một bên
  rationale: כָּתֵף có nghĩa đen là “vai” và trong mô tả kiến trúc có thể chỉ cạnh hoặc phần bên; ở đây nói đến một trong hai phần hai bên lối vào.
- source_word: עַמֻּדֵיהֶם
  choice: ba trụ của chúng
  rationale: עַמּוּד là trụ hoặc cột; “trụ” phù hợp với cấu kiện dùng để đỡ các tấm màn, còn “của chúng” giữ đại từ số nhiều trong tiếng Hê-bơ-rơ.
- source_word: אַדְנֵיהֶם
  choice: ba đế của chúng
  rationale: אֶדֶן chỉ bộ phận đế, có dạng ổ để giữ chân trụ. “Đế” là cách diễn đạt rõ ràng trong chính văn; nghĩa cụ thể hơn được ghi ở chú thích.
