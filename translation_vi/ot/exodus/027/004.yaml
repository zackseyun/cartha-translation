translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “bàn thờ” để làm rõ tiền ngữ của đại từ; dùng “tấm song” và “tấm lưới” nhằm vừa phân biệt vừa giữ liên kết giữa מִכְבָּר và רֶשֶׁת. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
