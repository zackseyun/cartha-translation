base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: vi
  text: Ngươi phải làm cho bàn thờ một tấm vỉ[a] bằng đồng, đan thành lưới; trên tấm lưới đó, ngươi phải làm bốn khoen đồng ở bốn góc của nó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một tấm lưới bằng đồng.” Tiếng Hê-bơ-rơ đọc sát là: “một tấm vỉ, công trình đan lưới, bằng đồng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “ở bốn đầu mút của nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר
  choice: tấm song
  rationale: Danh từ chỉ một kết cấu có các khe như vỉ hoặc song, gắn với bàn thờ. “Tấm song” tự nhiên trong tiếng Việt và phân biệt được với hình ảnh “lưới” ở cụm kế tiếp.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: đan như lưới
  rationale: Cụm từ có nghĩa đen là “công việc/kết cấu của lưới”. “Đan như lưới” diễn đạt hình thức cấu tạo một cách sáng rõ, đồng thời giữ hình ảnh lưới của nguyên văn.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ Hê-bơ-rơ có thể chỉ đồng hoặc hợp kim đồng. “Đồng” là cách gọi bao quát, tự nhiên trong tiếng Việt và không xác định quá mức thành phần hợp kim.
- source_word: עַל הָרֶשֶׁת
  choice: trên tấm lưới ấy
  rationale: Giữ nghĩa thông thường của giới từ עַל là “trên” và duy trì liên kết từ vựng với רֶשֶׁת trong mệnh đề trước.
- source_word: טַבְּעֹת
  choice: khoen
  rationale: Trong ngữ cảnh các vật dụng Đền Tạm, từ này chỉ các vòng dùng làm điểm gắn hoặc luồn đòn. “Khoen” là từ cụ thể và tự nhiên cho loại vòng gắn vào đồ vật.
- source_word: קְצוֹתָיו
  choice: bốn góc của nó
  rationale: Danh từ chỉ các đầu mút hoặc điểm ngoài cùng. Với một tấm song có bốn phía, “bốn góc” là cách diễn đạt rõ ràng; chú thích bảo lưu nghĩa rộng hơn là “bốn đầu mút”.
- source_word: לּוֹ
  choice: cho bàn thờ
  rationale: Đại từ chỉ lại bàn thờ trong ngữ cảnh trước. Lặp lại danh từ giúp câu tiếng Việt rõ nghĩa hơn so với “cho nó”.
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Diễn đạt lực chỉ thị của động từ trong chuỗi mệnh lệnh. “Ngươi” phù hợp với lời Đức Chúa Trời trực tiếp truyền cho Môi-se và giữ văn phong trang trọng.
