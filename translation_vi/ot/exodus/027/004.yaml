  to: Ngươi phải làm cho bàn thờ một tấm vỉ[a] bằng đồng, đan thành lưới; trên tấm lưới đó, ngươi phải làm bốn khoen đồng ở bốn góc của nó.[b]
  rationale: Thay “tấm song” bằng “tấm vỉ” để tiếng Việt tự nhiên và rõ nghĩa hơn, đồng thời đổi “đan như lưới” thành “đan thành lưới” để phản ánh cấu tạo dạng lưới của nguyên ngữ. Các lựa chọn còn lại và hai điểm neo chú thích được giữ nguyên về nghĩa.
