    issue: “tấm song” hơi gượng và không rõ nghĩa trong tiếng Việt hiện đại
    rationale: “Song” thường gợi các thanh riêng lẻ hơn là một bộ phận dạng grating. “Tấm vỉ” xác định rõ hơn cấu trúc được nói đến mà không thay đổi nghĩa.
  - severity: low
    issue: Cụm “đan như lưới” có thể hiểu là chỉ so sánh thay vì mô tả cấu tạo
    rationale: מַעֲשֵׂה רֶשֶׁת mô tả một cấu trúc/công trình dạng lưới. “đan thành lưới” trực tiếp hơn và liên kết rõ với “trên tấm lưới đó” ở mệnh đề sau.
  revised_text: Ngươi phải làm cho bàn thờ một tấm vỉ[a] bằng đồng, đan thành lưới; trên tấm lưới đó, ngươi phải làm bốn khoen đồng ở bốn góc của nó.[b]
