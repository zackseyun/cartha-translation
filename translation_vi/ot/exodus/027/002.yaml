  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: vi
  text: Ngươi phải làm các sừng ở bốn góc của bàn thờ; các sừng phải liền một khối với bàn thờ[a]; rồi ngươi phải bọc bàn thờ bằng đồng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nghĩa Hê-bơ-rơ: “các sừng của nó phải từ chính nó”; tức là các sừng được làm liền với bàn thờ, không gắn rời.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ nechoshet có thể chỉ đồng đỏ hoặc đồng thiếc; bản dịch dùng “đồng” để giữ nghĩa rộng của từ này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng động từ trong chuỗi chỉ thị mang lực mệnh lệnh; cách dịch này tự nhiên và trang trọng trong tiếng Việt.
- source_word: קַרְנֹתָיו
  choice: các sừng của bàn thờ
  rationale: Giữ hình ảnh cụ thể của קֶרֶן, tức các phần nhô ra giống sừng; lặp 'bàn thờ' để quy chiếu rõ trong câu đứng riêng.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: trên bốn góc
  rationale: Phản ánh trực tiếp giới từ עַל và vị trí của các sừng trên bốn góc bàn thờ.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: các sừng ấy phải liền một khối với bàn thờ
  rationale: Nguyên văn sát nghĩa là 'các sừng của nó phải từ chính nó'; trong ngữ cảnh chế tác, cụm này cho biết các sừng là bộ phận liền khối, không gắn rời.
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: rồi ngươi phải bọc ... cho bàn thờ
  rationale: צפה ở thể Piel chỉ việc phủ hoặc bọc một vật bằng vật liệu khác; diễn đạt này tự nhiên trong chỉ dẫn chế tác.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng đỏ hoặc đồng thiếc; 'đồng' giữ được độ rộng nghĩa của từ Hê-bơ-rơ thay vì xác định quá mức hợp kim.
