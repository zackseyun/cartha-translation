    rationale: Trong “các đòn khiêng cho bàn thờ bằng gỗ keo”, cụm này có thể được đọc là mô tả bàn thờ bằng gỗ keo. Nguyên văn xác định các đòn khiêng, không phải bàn thờ trong câu này, được làm bằng gỗ keo.
