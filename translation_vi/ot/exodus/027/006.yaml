base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/006.yaml
  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: vi
  text: Ngươi phải làm các đòn khiêng bằng gỗ keo cho bàn thờ, rồi bọc chúng bằng đồng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đồng thiếc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng Qal hoàn thành ngôi hai số ít giống đực có liên từ, trong mạch chỉ thị, mang lực mệnh lệnh. “Ngươi phải làm” vừa giữ sắc thái chỉ truyền vừa phù hợp văn phong trang trọng.
- source_word: בַדִּים / בַּדֵּי
  choice: các đòn khiêng
  rationale: Danh từ chỉ những đòn dùng để khiêng các vật dụng của Đền Tạm. “Đòn khiêng” rõ chức năng hơn “thanh” và tự nhiên trong tiếng Việt hiện đại.
- source_word: לַמִּזְבֵּחַ
  choice: cho bàn thờ
  rationale: Dịch đúng cụm từ trong câu, không thêm “dâng lễ thiêu” dù ngữ cảnh rộng hơn xác định đây là bàn thờ nào.
- source_word: עֲצֵי שִׁטִּים
  choice: gỗ keo
  rationale: Cách gọi thông dụng, tự nhiên trong tiếng Việt cho loại gỗ thường được nhận diện là acacia.
- source_word: וְצִפִּיתָ
  choice: rồi bọc
  rationale: Động từ Piel trong ngữ cảnh chế tác vật dụng chỉ việc phủ hoặc dát kim loại lên bề mặt. “Bọc” rõ nghĩa và tự nhiên, không ấn định quá mức kỹ thuật chế tác.
- source_word: אֹתָם
  choice: cho chúng
  rationale: Đại từ số nhiều quy chiếu về các đòn khiêng; tiếng Việt cần diễn đạt rõ đối tượng được bọc.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ Hê-bơ-rơ có thể chỉ đồng hoặc hợp kim đồng. “Đồng” giữ được độ rộng nghĩa trong tiếng Việt; chú thích nêu khả năng cụ thể là đồng thiếc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngươi” để giữ cách xưng hô trực tiếp số ít trong lời truyền phán; cấu trúc câu được làm tự nhiên trong tiếng Việt nhưng không thêm nội dung ngoài nguyên văn.
