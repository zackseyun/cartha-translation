id: EXO.27.12
reference: Exodus 27:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/רֹ֤חַב הֶֽ/חָצֵר֙ לִ/פְאַת יָ֔ם קְלָעִ֖ים חֲמִשִּׁ֣ים אַמָּ֑ה עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: vi
  text: Còn về chiều ngang của sân ở phía tây[a], sẽ có các tấm màn dài năm mươi cubit, cùng với mười trụ và mười đế[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “phía biển”, một cách nói thông dụng để chỉ phía tây.
    reason: lexical_alternative
  - marker: b
    text: Hay “ổ đỡ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶֽ/חָצֵר֙
  choice: Còn về chiều ngang của sân
  rationale: רֹחַב là “chiều ngang, bề rộng”; cách mở đầu “Còn về” tự nhiên trong chuỗi chỉ dẫn kiến trúc và vẫn thể hiện liên từ וְ.
- source_word: לִ/פְאַת יָ֔ם
  choice: ở phía tây
  rationale: יָם theo nghĩa đen là “biển”, nhưng trong cách định hướng Hê-bơ-rơ thường chỉ hướng tây; פֵאָה ở đây chỉ phía/cạnh của sân.
- source_word: קְלָעִ֖ים
  choice: các tấm màn
  rationale: Trong bối cảnh sân Đền Tạm, từ này chỉ những tấm vải treo tạo thành phần bao quanh; “các tấm màn” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: חֲמִשִּׁ֣ים אַמָּ֑ה
  choice: dài năm mươi cubit
  rationale: Cụm Hê-bơ-rơ nêu kích thước của màn. Thêm “dài” làm rõ quan hệ đo lường vốn được ngữ cảnh hàm ý; giữ “cubit” là tên đơn vị cổ, tránh quy đổi thiếu chắc chắn.
- source_word: עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה
  choice: cùng với mười trụ
  rationale: עַמּוּד là trụ/cột. Tiếng Việt tự nhiên đặt số lượng trước danh từ; quan hệ sở hữu số nhiều được thể hiện qua việc các trụ thuộc cùng kết cấu màn vừa nêu.
- source_word: וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה
  choice: và mười đế
  rationale: אֶדֶן chỉ đế hoặc ổ đỡ của trụ trong mô tả Đền Tạm. “Đế” dễ hiểu hơn, còn khả năng dịch “ổ đỡ” được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “sân”, “tấm màn”, “trụ”, “đế” cho ngôn ngữ kiến trúc. Giữ đơn vị cổ “cubit” thay vì quy đổi sang mét.
