  terminology: “Đền Tạm” là thuật ngữ chuẩn. “Đồng” có thể dùng làm cách dịch không xác định quá mức cho נְחֹשֶׁת, với chú thích nêu rõ khả năng chỉ đồng hoặc đồng thiếc/kim loại gốc đồng. “Cọc” phù hợp với יָתֵד trong ngữ cảnh neo giữ kết cấu.
  issues:
