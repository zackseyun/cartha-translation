  to: Mọi vật dụng của Đền Tạm, dùng trong mọi công việc phục vụ của nó, tất cả các cọc của Đền Tạm và tất cả các cọc của sân đều bằng đồng[a].
  rationale: Chỉnh cụm chỉ công dụng để phản ánh trực tiếp hơn sở hữu cách trong nguyên văn (“mọi công việc phục vụ của nó”), đồng thời loại bỏ trạng ngữ “tại đó” được thêm vào. Giữ “đồng” và chú thích để không quyết định quá mức giữa đồng và đồng thiếc.
  reviewer_model: gpt-5.6-terra
