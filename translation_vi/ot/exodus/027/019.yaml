base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: vi
  text: Mọi vật dụng của Đền Tạm, dùng trong mọi công việc phục vụ của nó, tất cả các cọc của Đền Tạm và tất cả các cọc của sân đều bằng đồng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây có thể chỉ đồng hoặc một kim loại/hợp kim gốc đồng, như đồng thiếc.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: vật dụng
  rationale: Danh từ כְּלִי chỉ chung các đồ dùng, dụng cụ hoặc vật dụng; “vật dụng” tự nhiên trong tiếng Việt và không thu hẹp nghĩa vào đồ nội thất.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ quen thuộc trong tiếng Việt để chỉ nơi ngự thánh di động của Đức Chúa Trời, đồng thời phù hợp với nghĩa “nơi cư ngụ” của מִשְׁכָּן.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: dùng cho mọi công việc phục vụ tại đó
  rationale: Cách dịch này diễn đạt tự nhiên ý chỉ mục đích của các vật dụng, đồng thời giữ phạm vi rộng của עֲבֹדָה là công việc hay sự phục vụ gắn với Đền Tạm.
- source_word: יְתֵדֹתָיו
  choice: các cọc của Đền Tạm
  rationale: יָתֵד là cọc dùng để neo giữ kết cấu; lặp lại “Đền Tạm” làm rõ đại từ sở hữu trong tiếng Việt.
- source_word: יִתְדֹת הֶחָצֵר
  choice: các cọc của sân
  rationale: חָצֵר ở đây là khu sân bao quanh Đền Tạm; “sân” ngắn gọn, rõ nghĩa trong văn cảnh.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng nguyên chất hoặc kim loại/hợp kim gốc đồng; “đồng” giữ được độ rộng nghĩa tốt hơn việc xác định hẳn là “đồng thiếc”.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, câu văn liền mạch và dễ hiểu. Dùng “Đền Tạm” theo cách gọi quen thuộc trong tiếng Việt; tránh xác định quá mức thành phần kim loại mà nguyên văn không phân biệt rõ.
