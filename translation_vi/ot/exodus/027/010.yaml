translation:
  language: vi
  text: cùng với hai mươi trụ của nó và hai mươi đế[a] bằng đồng. Móc của các trụ và các đai trụ[b] đều bằng bạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ổ trụ” thay cho “đế”, tức bộ phận đỡ và giữ chân trụ.
    reason: lexical_alternative
  - marker: b
    text: Ý nghĩa kiến trúc của từ Hê-bơ-rơ được dịch là “đai trụ” không hoàn toàn chắc chắn; từ này cũng có thể chỉ các thanh nối hoặc một loại vòng gắn vào trụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: hai mươi trụ
  rationale: עַמּוּד chỉ trụ hoặc cột. Hậu tố số ít giống đực quy chiếu về phần cấu trúc ở câu trước; trong tiếng Việt không cần diễn đạt đại từ sở hữu khi mối liên hệ đã rõ.
- source_word: אַדְנֵיהֶם
  choice: hai mươi đế
  rationale: Trong ngữ cảnh Đền Tạm, אֶדֶן là bộ phận kê hoặc giữ chân trụ. “Đế” tự nhiên, dễ hiểu; “ổ trụ” là một khả năng kỹ thuật hơn và được nêu trong chú thích.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng hoặc hợp kim đồng như đồng thiếc. “Đồng” là cách gọi tự nhiên trong tiếng Việt và không xác định thành phần hợp kim quá mức.
- source_word: וָוֵי
  choice: các móc
  rationale: וָו thường chỉ những móc dùng trong kết cấu Đền Tạm; “móc” phù hợp với chức năng có khả năng nhất.
- source_word: חֲשֻׁקֵיהֶם
  choice: các đai trụ
  rationale: Danh từ חֲשֻׁקִים có nghĩa kiến trúc không hoàn toàn chắc chắn. “Đai trụ” giữ được ý về các chi tiết gắn hoặc bao quanh trụ mà không xác định quá cụ thể.
- source_word: כָּסֶף
  choice: bằng bạc
  rationale: כָּסֶף ở đây là vật liệu bạc; cụm “bằng bạc” áp dụng tự nhiên cho cả móc lẫn đai trụ.
- source_word: וְ
  choice: cùng với / và
  rationale: Liên từ đầu câu nối tiếp mô tả ở câu trước nên dịch là “cùng với”; các liên từ tiếp theo được thể hiện bằng phép nối và cấu trúc liệt kê tự nhiên trong tiếng Việt.
