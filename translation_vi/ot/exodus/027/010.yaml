translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được nối với câu trước bằng “cùng với”, phản ánh liên từ mở đầu. Dùng “đồng” thay vì xác định cụ thể là đồng thiếc, vì từ Hê-bơ-rơ có thể bao quát đồng và hợp kim đồng; giữ chú thích cho hai thuật ngữ kiến trúc có phương án dịch đáng kể.
