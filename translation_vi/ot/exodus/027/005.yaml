  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: vi
  text: Con hãy đặt tấm lưới ấy ở phía dưới gờ của bàn thờ[a], và tấm lưới sẽ lên đến nửa chiều cao của bàn thờ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “mép” hoặc “viền”; từ Hê-bơ-rơ chỉ một đường viền hay bộ phận nhô ra của bàn thờ.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “và tấm lưới sẽ ở tới nửa bàn thờ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Con hãy đặt
  rationale: Động từ נתן trong chỉ dẫn chế tác mang nghĩa đặt/để; “hãy đặt” diễn đạt tự nhiên lực mệnh lệnh của thể hoàn thành nối tiếp trong ngữ cảnh này.
- source_word: אֹתָהּ
  choice: tấm lưới ấy
  rationale: Đại từ giống cái số ít quy chiếu về tấm lưới bằng đồng ở câu trước; lặp danh từ giúp tiếng Việt rõ nghĩa hơn đại từ “nó”.
- source_word: תַּחַת ... מִלְּמָטָּה
  choice: ở phía dưới
  rationale: Hai yếu tố không gian cùng nhấn mạnh vị trí bên dưới; cách diễn đạt này giữ chi tiết không gian mà không suy đoán cơ cấu lắp đặt.
- source_word: כַּרְכֹּב
  choice: gờ
  rationale: Danh từ chỉ phần viền hoặc bộ phận nhô ra quanh bàn thờ; “gờ” ngắn gọn, tự nhiên và phù hợp ngữ cảnh kiến trúc.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Cách dịch chuẩn, thông dụng của מזבח trong các chỉ dẫn về Đền Tạm.
- source_word: הָרֶשֶׁת
  choice: tấm lưới
  rationale: רשת chỉ một cấu trúc đan dạng lưới; thêm loại từ “tấm” tạo cách nói tự nhiên trong tiếng Việt.
- source_word: וְהָיְתָה ... עַד חֲצִי הַמִּזְבֵּחַ
  choice: và tấm lưới phải lên đến nửa chiều cao của bàn thờ
  rationale: Giữ quan hệ nối tiếp của וְ và diễn đạt vị trí/độ vươn đến điểm giữa theo chiều đứng một cách rõ ràng, đồng thời không thêm sắc thái mục đích.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại. Dùng “Con hãy” phù hợp lời Đức Chúa Trời truyền trực tiếp cho Môi-se trong mạch văn; tránh thuật ngữ kỹ thuật khó hiểu và giữ nguyên độ bất định về hình dạng chính xác của כַּרְכֹּב.
