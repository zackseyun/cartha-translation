source:
  edition: WLC
  text: וְ/אַתָּ֞ה תְּצַוֶּ֣ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: vi
  text: Còn ngươi, hãy truyền cho con dân Israel đem đến cho ngươi dầu ô-liu nguyên chất, lấy từ ô-liu giã[a], dùng để thắp đèn, để đèn cháy thường xuyên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ô-liu nghiền nát.” Từ Hê-bơ-rơ nói đến dầu chất lượng cao được làm từ ô-liu giã hoặc đập.
    reason: lexical_alternative
  - marker: b
    text: Trong các chỉ thị về Đền Tạm, “thường xuyên” có thể nói đến việc chăm nom đều đặn và tiếp diễn, chứ không nhất thiết là không gián đoạn từng khoảnh khắc; xem Xuất Ai Cập 27:21 và Lê-vi 24:2–4.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: Còn ngươi
  rationale: Liên từ đi với đại từ độc lập nhấn mạnh lời trực tiếp nói với Môi-se và đánh dấu một chuyển ý nhẹ; “Còn ngươi” diễn đạt tự nhiên sắc thái ấy.
- source_word: תְּצַוֶּה
  choice: hãy truyền
  rationale: Dạng Piel của צוה có nghĩa là truyền lệnh; “hãy truyền” giữ lực mệnh lệnh mà vẫn hợp văn phong chỉ thị tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Israel,” nhưng là danh xưng quy ước chỉ cộng đồng giao ước. “Con dân Israel” giữ sắc thái thuộc về Israel, không khiến độc giả hiện đại hiểu sai rằng chỉ nam giới được nói đến.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: đem đến cho ngươi
  rationale: לקח về căn bản là “lấy,” nhưng khi đi với אֶל trong ngữ cảnh cung ứng này, ý tự nhiên là lấy rồi đem đến cho Môi-se.
- source_word: שֶׁמֶן זַיִת זָךְ
  choice: dầu ô-liu nguyên chất
  rationale: שֶׁמֶן זַיִת là dầu từ trái ô-liu; זָךְ nói đến độ tinh sạch hoặc trong. “Nguyên chất” là cách diễn đạt hiện đại, rõ nghĩa trong ngữ cảnh này.
- source_word: כָּתִית
  choice: làm từ ô-liu giã
  rationale: Từ này mô tả dầu thu được từ ô-liu đã giã hoặc đập. Cách dịch nêu rõ phương thức mà không tạo thành cụm tiếng Việt gượng gạo như “dầu bị giã.”
- source_word: לַמָּאוֹר
  choice: để thắp sáng
  rationale: Danh từ מָאוֹר chỉ ánh sáng hoặc sự chiếu sáng; chuyển thành cụm mục đích là tự nhiên trong tiếng Việt và không thêm một dụng cụ cụ thể ngoài văn cảnh.
- source_word: לְהַעֲלֹת נֵר
  choice: giữ cho đèn cháy
  rationale: Thành ngữ Hiphil theo nghĩa đen là “làm cho ngọn đèn đi lên,” chỉ việc thắp và duy trì ngọn đèn. “Giữ cho đèn cháy” bảo toàn sắc thái tác động khiến đèn tiếp tục cháy.
- source_word: תָּמִיד
  choice: thường xuyên
  rationale: Trong chỉ thị về Đền Tạm, từ này có thể nói đến việc duy trì đều đặn, liên tục theo quy định, không nhất thiết khẳng định không gián đoạn từng khoảnh khắc.
theological_decisions:
- issue: Phạm vi của danh xưng בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai của Israel
  rationale: Dạng Hê-bơ-rơ mang hình thức giống đực theo nghĩa đen, nhưng ở đây là danh xưng tập thể quen dùng cho dân Israel. “Con dân Israel” giữ quan hệ giao ước và tránh ngụ ý thần học không có trong câu rằng phụ nữ bị loại khỏi cộng đồng được nhắc đến.
- issue: Ý nghĩa thời lượng của תָּמִיד
  choice: thường xuyên
  alternative: liên tục
  rationale: Văn cảnh nghi lễ có thể chỉ sự chăm nom đều đặn, tiếp diễn theo lịch của các thầy tế lễ. Bản dịch không quyết định rằng đèn nhất thiết cháy không ngừng trong từng khoảnh khắc.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “ngươi” vì đây là lời Đức Chúa Trời trực tiếp phán riêng với Môi-se trong văn cảnh luật lệ; tránh cấu trúc quá sát chữ gây gượng trong tiếng Việt. Tên Israel viết theo dạng hiện đại, dễ nhận biết.
