  terminology: “Con dân Israel” là một cách chuyển ngữ tự nhiên cho danh xưng tập thể בְּנֵי יִשְׂרָאֵל trong tiếng Việt, không biến nó thành khẳng định chỉ về nam giới. “Ô-liu,” “nguyên chất,” và “thường xuyên” phù hợp. Chú thích làm rõ rằng “thường xuyên” trong ngữ cảnh nghi lễ không nhất thiết có nghĩa là không gián đoạn từng giây.
