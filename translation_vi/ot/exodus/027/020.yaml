  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: mệnh lệnh trực tiếp với Môi-se, dầu ô-liu tinh sạch từ ô-liu giã, và việc duy trì ngọn đèn theo quy định. Tuy nhiên, “để thắp sáng và giữ cho đèn cháy” gộp hai cụm mục đích tiếng Hê-bơ-rơ hơi lỏng; bản sửa phân biệt rõ dầu dùng cho việc thắp đèn và mục đích giữ đèn cháy thường xuyên.'
