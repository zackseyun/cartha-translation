source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: vi
  text: “Hơi thở của những hơi thở[a],” Qoheleth[b] nói; “hơi thở của những hơi thở, tất cả chỉ là hơi thở.”
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Tiếng Hê-bơ-rơ הֶבֶל (hevel) theo nghĩa đen là “hơi thở” hoặc “làn hơi.” Từ này xuất hiện 38 lần trong sách và gợi đồng thời điều chóng qua, không thể nắm bắt, cùng sự trớ trêu giữa điều người ta mong đợi và điều thực sự xảy ra. Không một từ trừu tượng tiếng Việt nào bao quát trọn các nét nghĩa ấy. Cụm “hơi thở của những hơi thở” là lối nói siêu cấp trong tiếng Hê-bơ-rơ, tương tự “bài ca của các bài ca” hay “nơi chí thánh.”
    reason: Sửa ví dụ và cách diễn đạt để phản ánh kết cấu siêu cấp Hê-bơ-rơ mà không thêm nghĩa phân phối "mọi".
lexical_decisions:
- source_word: הֲבֵל / הָבֶל
  choice: hơi thở / chỉ là hơi thở
  rationale: Danh từ הֶבֶל chỉ hơi thở hay làn hơi và trong sách mang đồng thời các sắc thái chóng qua, không thể nắm bắt và nghịch lý. Hình ảnh cụ thể “hơi thở” giữ được độ mở ấy; “chỉ là” ở vị trí vị ngữ truyền đạt sắc thái hạ thấp, tránh biến câu thành một định nghĩa thuần túy về bản thể.
- source_word: הֲבֵל הֲבָלִים
  choice: hơi thở của mọi hơi thở
  rationale: Kết cấu sở hữu với danh từ số nhiều diễn tả mức tuyệt đối, tương tự “bài ca của mọi bài ca.” Thêm “mọi” giúp cấu trúc siêu cấp này tự nhiên và dễ hiểu trong tiếng Việt mà vẫn giữ nguyên hình ảnh.
- source_word: אָמַר
  choice: nói
  rationale: Dạng hoàn thành nằm trong công thức dẫn lời văn chương; hiện tại “nói” phù hợp với lời tuyên bố đang được trích dẫn và tự nhiên trong tiếng Việt.
- source_word: קֹהֶלֶת
  choice: Qoheleth
  rationale: Phiên âm danh xưng Hê-bơ-rơ để không thu hẹp nghĩa thành “Người Truyền Đạo,” “Nhà Giảng Đạo” hay “Thầy Giáo.”
- source_word: הַכֹּל
  choice: tất cả
  rationale: Cách diễn đạt tự nhiên, bao quát, giữ lực tổng quát hóa của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách chuyển ngữ mô-típ הֶבֶל
  choice: Giữ hình ảnh cụ thể “hơi thở,” với “chỉ là hơi thở” trong mệnh đề vị ngữ.
  alternative: hư không; vô nghĩa; phù vân; vô ích; phi lý
  rationale: Các từ trừu tượng thường chỉ chọn một nét nghĩa và có thể áp đặt kết luận hư vô hay một cách giải thích thần học mà nguyên văn không nhất thiết khẳng định. “Hơi thở” bảo tồn đồng thời tính chóng qua, khó nắm bắt và nghịch lý.
- issue: Cách hiểu danh xưng קֹהֶלֶת
  choice: Phiên âm Qoheleth.
  alternative: Người Truyền Đạo; Nhà Giảng Đạo; Thầy Giáo; Người Triệu Tập
  rationale: Chức năng và sắc thái chính xác của danh xưng còn có độ mở; phiên âm tránh quyết định thay cho độc giả.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dấu ngoặc kép làm rõ đây là lời của Qoheleth; dấu chấm than ở lần lặp thứ hai truyền tải cường độ tu từ của lời tuyên bố mà không thêm một nội dung giải thích mới.
