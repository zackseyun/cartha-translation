id: LEV.6.7
reference: Leviticus 6:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: vi
  text: 'Đây là luật lệ[a] về lễ vật ngũ cốc: các con trai A-rôn phải dâng lễ vật ấy trước mặt Yahweh, ở phía trước bàn thờ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chỉ dẫn về” hoặc “quy định về”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Đây là
  rationale: Mở đầu một phần chỉ dẫn mới một cách tự nhiên trong tiếng Việt; không nhất thiết dịch וְ thành “và” vì quan hệ nối tiếp đã rõ trong văn mạch.
- source_word: תּוֹרַת
  choice: luật lệ về
  rationale: Trong luật tế lễ, תּוֹרָה chỉ quy định hoặc chỉ dẫn có tính chuẩn mực. “Luật lệ về” vừa trang trọng, dễ hiểu, vừa không thu hẹp nghĩa thành một điều luật đơn lẻ.
- source_word: הַמִּנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong văn cảnh Lê-vi Ký, מִנְחָה là lễ vật làm từ sản phẩm ngũ cốc chứ không phải lễ vật nói chung.
- source_word: הַקְרֵב אֹתָהּ
  choice: phải dâng lễ vật ấy
  rationale: Diễn đạt chức năng mệnh lệnh của hình thức Hiphil và hành động đưa lễ vật đến để trình dâng; lặp “lễ vật ấy” tự nhiên và rõ hơn đại từ “nó” trong tiếng Việt.
- source_word: בְּנֵי אַהֲרֹן
  choice: các con trai A-rôn
  rationale: Giữ nguyên danh xưng gia tộc–tư tế của bản Hê-bơ-rơ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ ý hiện diện trước Đức Chúa Trời và phiên âm trực tiếp danh giao ước יְהוָה theo quy ước của dự án.
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: ở phía trước bàn thờ
  rationale: Thể hiện vị trí cụ thể đối với bàn thờ, đồng thời phân biệt với cụm “trước mặt Yahweh” ngay trước đó.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn nêu trực tiếp danh giao ước; “Yahweh” bảo tồn danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của תּוֹרָה trong luật tế lễ
  choice: luật lệ
  alternative: chỉ dẫn; quy định
  rationale: “Luật lệ” giữ tính chuẩn mực và nghi lễ của câu, trong khi chú thích bảo tồn các sắc thái “chỉ dẫn” và “quy định” có thể có.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “dâng” theo ngữ vực tế lễ; giữ hai cụm chỉ vị trí khác nhau là “trước mặt Yahweh” và “ở phía trước bàn thờ”. Dấu chú thích [a] được đặt ngay sau từ ngữ mà chú thích giải nghĩa.
