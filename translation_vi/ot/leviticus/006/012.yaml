  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/012.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH.” Theo truyền thống thường được dịch là “CHÚA”; cũng có thể phiên âm là “Gia-vê” hoặc “Giê-hô-va.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời phán của Đức Chúa Trời được dịch là “phán”, cách diễn đạt trang trọng và tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc nói năng này, “phán với” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức mở đầu lời trực tiếp, “rằng” chuyển tải tự nhiên chức năng dẫn lời của nguyên ngữ לֵאמֹר.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va; Gia-vê
  rationale: Nguyên văn dùng trực tiếp danh YHWH. “Yahweh” bảo tồn đây là tên riêng, đồng thời chú thích cho biết truyền thống dịch thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán với … rằng” để giữ công thức dẫn nhập lời thần phán mà không tạo câu tiếng Việt gượng ép.
