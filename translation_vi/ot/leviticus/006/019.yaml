  naturalness: “Làm lễ chuộc tội bằng lễ vật ấy” và việc lặp lại “lễ vật ấy” trong văn bản luật lệ trang trọng rõ ràng, tự nhiên hơn việc dùng “nó” liên tiếp. “Tại một nơi thánh, trong sân Lều Hội Kiến” vẫn mạch lạc và giữ được quan hệ giải thích của nguyên văn.
