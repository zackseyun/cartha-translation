base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: vi
  text: Thầy tế lễ làm lễ chuộc tội bằng lễ vật ấy phải ăn lễ vật ấy[a]. Lễ vật ấy phải được ăn tại một nơi thánh, trong sân Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Thầy tế lễ dâng lễ vật ấy làm lễ vật chuộc tội phải ăn lễ vật ấy.” Phân từ Hê-bơ-rơ có thể chỉ cụ thể việc cử hành nghi thức dâng lễ vật chuộc tội.'
    reason: Bảo tồn sắc thái tế lễ chuyên biệt và sự đa nghĩa của động từ חטא trong ngữ cảnh này.
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: Thầy tế lễ
  rationale: Cách gọi rõ ràng, trang trọng và quen thuộc trong tiếng Việt hiện đại đối với chức vụ tư tế trong luật tế lễ.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: dùng nó để làm lễ chuộc tội
  rationale: Động từ piel của חטא trong ngữ cảnh tế lễ chỉ việc vị tư tế cử hành nghi thức liên quan đến lễ vật chuộc tội hoặc thực hiện sự thanh tẩy bằng lễ vật ấy. Cách dịch này diễn đạt chức năng tế lễ mà không thu hẹp hoàn toàn vào một sắc thái duy nhất; phương án sát nghĩa chuyên biệt hơn được nêu trong chú thích.
- source_word: יֹאכֲלֶנָּה
  choice: phải ăn nó
  rationale: Dạng chưa hoàn thành ở đây mang tính quy định trong luật tế lễ. “Phải” truyền đạt nghĩa bắt buộc tự nhiên hơn “sẽ” trong tiếng Việt.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: tại một nơi thánh
  rationale: Danh từ không có mạo từ xác định; “một nơi thánh” tránh đồng nhất cụm từ này với một khu vực mang danh xưng riêng và giữ sắc thái không xác định của tiếng Hê-bơ-rơ.
- source_word: תֵּאָכֵל
  choice: Nó phải được ăn
  rationale: Giữ thể bị động và tính quy định của nguyên văn, qua đó duy trì trọng tâm đặt trên lễ vật.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: trong sân Lều Hội Kiến
  rationale: Cách diễn đạt ngắn gọn, tự nhiên; “Lều Hội Kiến” là thuật ngữ quen thuộc chỉ אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Ý nghĩa tế lễ chuyên biệt của חטא ở thể piel
  choice: dùng nó để làm lễ chuộc tội
  alternative: dâng nó làm lễ vật chuộc tội; dùng nó để thanh tẩy
  rationale: Nguyên văn có thể nhấn mạnh việc vị tư tế cử hành nghi thức lễ vật chuộc tội hoặc tác dụng thanh tẩy của nghi thức. Bản dịch chính giữ ngôn ngữ chuộc tội quen thuộc trong văn cảnh mà không diễn giải thêm cơ chế thần học; chú thích bảo tồn cách hiểu chuyên biệt khác.
- issue: Sở chỉ của các đại từ giống cái
  choice: nó
  alternative: con vật ấy; lễ vật ấy
  rationale: Các hậu tố đại từ giống cái chỉ con vật hoặc lễ vật đang được nói đến. Tiếng Việt không đánh dấu giống ngữ pháp ở đại từ này, nên “nó” chuyển tải sở chỉ một cách tự nhiên mà không thêm thông tin.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “phải” để thể hiện quy định, giữ thể bị động ở câu thứ hai và viết hoa “Lều Hội Kiến” như một danh xưng quen thuộc.
