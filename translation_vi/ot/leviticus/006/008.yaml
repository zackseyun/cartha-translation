id: LEV.6.8
reference: Leviticus 6:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Người ấy sẽ lấy từ lễ phẩm ngũ cốc ấy một nắm[a] bột mịn cùng một phần dầu của nó, và toàn bộ nhũ hương ở trên lễ phẩm ngũ cốc; rồi sẽ đốt phần kỷ niệm[b] của lễ phẩm ấy trên bàn thờ, làm hương thơm đẹp lòng Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn cũng có thể dịch sát hơn: “nhấc lên từ lễ phẩm ấy bằng nắm tay mình”; động từ và danh từ đi cùng nhau nhấn mạnh phần được lấy bằng một nắm tay.'
    reason: lexical_alternative
  - marker: b
    text: “Phần kỷ niệm” là thuật ngữ tế lễ chỉ phần đại diện của lễ phẩm ngũ cốc được đốt trên bàn thờ.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: sẽ lấy từ lễ phẩm đó một nắm
  rationale: Động từ Hiphil của רום cùng בְּקֻמְצוֹ diễn tả việc nhấc/lấy ra lượng vừa nắm được. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ ý lấy một phần xác định khỏi lễ phẩm.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Đây là loại bột đã xay mịn dùng trong nghi lễ, nên cần dịch cụ thể thay vì chỉ nói chung là “bột”.
- source_word: מִנְחָה
  choice: lễ phẩm ngũ cốc
  rationale: Trong ngữ cảnh Lê-vi Ký, từ này chỉ loại lễ phẩm làm từ ngũ cốc; cách dịch phân biệt nó với các loại lễ vật khác.
- source_word: וּמִשַּׁמְנָהּ
  choice: cùng một phần dầu
  rationale: 'Giới từ מִן mang nghĩa phân lượng: lấy một phần dầu của lễ phẩm, không phải nhất thiết lấy toàn bộ dầu.'
- source_word: לְבֹנָה
  choice: nhũ hương
  rationale: Từ Hê-bơ-rơ chỉ frankincense, một loại hương liệu cụ thể, chứ không phải hương nói chung.
- source_word: וְהִקְטִיר
  choice: đốt ... cho bốc khói
  rationale: Trong ngữ cảnh tế lễ, động từ này nói đến việc đốt lễ phẩm trên bàn thờ để nó bốc khói; cách dịch giữ sắc thái nghi lễ rõ hơn từ “đốt” đứng riêng.
- source_word: אַזְכָּרָתָהּ
  choice: phần kỷ niệm
  rationale: Giữ nghĩa kỹ thuật của phần đại diện thuộc lễ phẩm ngũ cốc được đốt trên bàn thờ, thay vì diễn giải tác dụng thần học của nó.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm làm đẹp lòng
  rationale: Cụm nghi lễ này diễn tả sự đẹp lòng/chấp nhận, đồng thời giữ hình ảnh mùi hương trong nguyên văn.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời được biểu thị trực tiếp bằng Tứ Tự Danh יהוה.
theological_decisions:
- issue: Ý nghĩa của אַזְכָּרָתָהּ trong nghi lễ
  choice: phần kỷ niệm
  alternative: phần tưởng niệm; lễ vật kỷ niệm
  rationale: Nguyên văn dùng một thuật ngữ tế lễ cho phần đại diện được thiêu. Bản dịch không xác định quá mức rằng phần ấy khiến Đức Chúa Trời nhớ, khiến người dâng nhớ, hay có chức năng thần học cụ thể nào khác.
- issue: Cụm רֵיחַ נִיחֹחַ
  choice: hương thơm làm đẹp lòng Yahweh
  alternative: hương thơm êm dịu dâng lên Yahweh
  rationale: Cách dịch truyền đạt tính được chấp nhận trong ngôn ngữ tế lễ nhưng không hàm ý thô rằng Đức Chúa Trời cần hoặc hưởng thức ăn qua mùi hương.
- issue: Danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Giữ danh giao ước xuất hiện trong nguyên văn dưới dạng một danh riêng, không thay bằng tước hiệu.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng hiện đại. Dùng “người ấy” để theo chủ thể nam số ít trong ngữ cảnh mà không bổ sung chức danh không có trong câu được cung cấp; dùng “lễ phẩm ngũ cốc”, “nhũ hương” và “phần kỷ niệm” nhất quán với tính chuyên biệt của thuật ngữ tế lễ.
