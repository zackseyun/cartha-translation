base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: vi
  text: Vật dụng bằng đất nung mà lễ vật ấy được luộc trong đó thì phải bị đập vỡ; nhưng nếu lễ vật ấy được luộc trong vật dụng bằng đồng[a], thì vật dụng ấy phải được cọ sạch và tráng bằng nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ נְחֹשֶׁת có thể chỉ đồng đỏ hoặc đồng thiếc, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: vật dụng bằng đất nung
  rationale: כְלִי là từ khái quát chỉ đồ đựng hoặc dụng cụ, còn חֶרֶשׂ xác định chất liệu gốm đất nung. Cách dịch này tự nhiên và giữ được sự phân biệt về chất liệu trong quy định.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: dùng để luộc / được luộc
  rationale: בשׁל trong ngữ cảnh tế lễ chỉ việc nấu, cụ thể là luộc. Cách diễn đạt giữ nghĩa bị động ở vế thứ hai và làm rõ quan hệ với vật dụng ở vế đầu.
- source_word: בּוֹ
  choice: dùng để ... ấy
  rationale: Giới từ kèm đại từ hậu tố quy chiếu về vật dụng và diễn tả nơi thịt được luộc; cấu trúc tiếng Việt này truyền đạt quan hệ ấy một cách tự nhiên.
- source_word: יִשָּׁבֵר
  choice: phải đập vỡ
  rationale: Dạng Niphal chưa hoàn thành có chức năng mệnh lệnh trong văn luật. “Phải đập vỡ” diễn đạt rõ nghĩa bắt buộc và cho thấy vật dụng phải bị làm vỡ.
- source_word: כְלִי נְחֹשֶׁת
  choice: vật dụng bằng đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng đỏ hoặc đồng thiếc tùy ngữ cảnh. “Đồng” là cách gọi tự nhiên, bao quát trong tiếng Việt; chú thích giữ lại sự không chắc chắn về hợp kim cụ thể.
- source_word: וּמֹרַק
  choice: phải được cọ sạch
  rationale: מרק diễn tả việc chà hoặc cọ kỹ để làm sạch. “Cọ sạch” phù hợp với việc làm sạch vật dụng kim loại và dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: và tráng bằng nước
  rationale: שטף chỉ việc rửa bằng nước chảy hoặc tráng nước. “Tráng bằng nước” phân biệt hành động này với việc cọ sạch ngay trước đó.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng “phải” để thể hiện nghĩa bắt buộc. Thêm “thịt” theo đối tượng hiển nhiên từ ngữ cảnh gần nhằm tránh câu tiếng Việt mơ hồ; không bổ sung diễn giải thần học.
