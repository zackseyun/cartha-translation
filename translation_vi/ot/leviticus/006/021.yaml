revisions:
- from: Còn vật dụng bằng đất nung dùng để luộc thịt ấy thì phải đập vỡ; nhưng nếu thịt được luộc trong vật dụng bằng đồng[a], thì vật dụng ấy phải được cọ sạch và tráng bằng nước.
  to: Vật dụng bằng đất nung mà lễ vật ấy được luộc trong đó thì phải bị đập vỡ; nhưng nếu lễ vật ấy được luộc trong vật dụng bằng đồng[a], thì vật dụng ấy phải được cọ sạch và tráng bằng nước.
  rationale: Sửa mệnh đề đầu để giữ quan hệ “trong đó lễ vật được luộc” và sắc thái bị động của nguyên văn, thay vì diễn tả công dụng chung của vật dụng. “Lễ vật ấy” làm rõ đại từ theo ngữ cảnh trực tiếp mà không giới hạn nó chỉ là “thịt.” Các phần còn lại và chú thích từ vựng được giữ nguyên về nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:44:02Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng mệnh lệnh đối với đồ đất nung và đồ bằng נְחֹשֶׁת, cũng như hai thao tác cọ sạch và tráng nước. Tuy nhiên, “dùng để luộc thịt ấy” dễ chuyển mệnh đề bị động chỉ trường hợp thực tế trong tiếng Hê-bơ-rơ thành công dụng của vật dụng, và “thịt” thu hẹp đại từ ngầm của nguyên văn. Nên diễn đạt rõ đây là vật dụng nơi lễ vật được luộc, trong khi vẫn dựa vào tiền văn để xác định quy chiếu.
  naturalness: Câu sửa vẫn giữ văn phong luật lệ hiện đại, mạch lạc. “Mà lễ vật ấy được luộc trong đó” truyền đạt quan hệ locative và thể bị động tự nhiên hơn “dùng để luộc thịt ấy.”
  terminology: “Vật dụng bằng đất nung,” “vật dụng bằng đồng,” “cọ sạch,” và “tráng bằng nước” phù hợp. Chú thích giữ đúng tính không xác định giữa đồng đỏ và đồng thiếc/đồng pha thiếc của נְחֹשֶׁת.
  issues:
  - severity: medium
    issue: “dùng để luộc thịt ấy” không phản ánh chính xác cấu trúc “mà nó được luộc trong đó.”
    rationale: Cụm “dùng để” thiên về mục đích hoặc công dụng; tiếng Hê-bơ-rơ nêu điều kiện liên hệ với việc lễ vật được luộc trong vật dụng. Việc thêm “thịt” cũng cụ thể hóa đại từ không được nêu trong câu, dù quy chiếu của nó đã rõ từ ngữ cảnh tế lễ.
  revised_text: Vật dụng bằng đất nung mà lễ vật ấy được luộc trong đó thì phải bị đập vỡ; nhưng nếu lễ vật ấy được luộc trong vật dụng bằng đồng[a], thì vật dụng ấy phải được cọ sạch và tráng bằng nước.
