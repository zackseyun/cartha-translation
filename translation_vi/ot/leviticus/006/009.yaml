id: LEV.6.9
reference: Leviticus 6:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֣רֶת מִמֶּ֔/נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּ/בָנָ֑י/ו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּ/מָק֣וֹם קָדֹ֔שׁ בַּ/חֲצַ֥ר אֹֽהֶל מוֹעֵ֖ד יֹאכְלֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: vi
  text: Phần còn lại của lễ vật ấy, A-rôn và các con trai ông phải ăn[a]. Lễ vật phải được ăn dưới dạng không men[c] tại một nơi thánh[b]; họ phải ăn lễ vật ấy trong sân Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phần dư lại” hoặc “phần còn sót lại.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ là “tại một nơi thánh,” không phải “tại nơi thánh”; mệnh đề kế tiếp xác định nơi ấy là sân Lều Hội Kiến.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “như bánh không men.” Tiếng Hê-bơ-rơ nói đến việc ăn lễ vật dưới dạng không men.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: Phần còn lại của lễ vật ấy
  rationale: Danh động tính từ giống cái số ít có mạo từ chỉ phần còn lại của lễ vật ngũ cốc; thêm “lễ vật” làm rõ sở chỉ trong tiếng Việt mà không thay đổi ý.
- source_word: יֹאכְלוּ
  choice: phải ăn
  rationale: Thể chưa hoàn thành trong văn luật pháp mang sức nặng quy định; “phải ăn” tự nhiên và rõ nghĩa bắt buộc trong tiếng Việt hiện đại.
- source_word: אַהֲרֹן וּבָנָיו
  choice: A-rôn và các con trai ông
  rationale: בנים trong ngữ cảnh chức vụ tế lễ chỉ các con trai của A-rôn; cách dịch này chính xác hơn từ rộng nghĩa “con cái”.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: Lễ vật phải được ăn dưới dạng không men
  rationale: Giữ thể bị động và ý quy định của תֵּאָכֵל, đồng thời hiểu מַצּוֹת là trạng thái/hình thức không men, tránh tự ý xác định đó là bánh hay bánh nhỏ.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: tại một nơi thánh
  rationale: מָקוֹם không có mạo từ; “một nơi thánh” bảo toàn tính bất định, còn mệnh đề kế tiếp xác định địa điểm là sân Lều Hội Kiến.
- source_word: בַּחֲצַר
  choice: trong sân
  rationale: חצר là khu sân có rào bao quanh thuộc phạm vi đền tạm; “sân” ngắn gọn và tự nhiên.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Giữ hình ảnh nguyên ngữ về chiếc lều và chức năng hội kiến, theo cách gọi trang trọng, dễ nhận biết trong tiếng Việt.
- source_word: יֹאכְלוּהָ
  choice: họ phải ăn lễ vật ấy
  rationale: Giữ nguyên sự lặp lại có chủ ý của động từ cùng hậu tố tân ngữ, thay đại từ bằng “lễ vật ấy” để tránh mơ hồ trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “phải” để thể hiện tính quy định, giữ hai lần truyền lệnh ăn như nguyên ngữ. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn và được đặt ngay sau cụm từ liên quan.
