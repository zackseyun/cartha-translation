  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”; mạch tiếp nối của וַ được thể hiện qua sự liên tục của văn cảnh, không nhất thiết phải thêm “và” trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Cụm giới từ chỉ người tiếp nhận lời phán; “phán với Môi-se” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức mở đầu lời trực tiếp, “rằng” chuyển tải tự nhiên chức năng dẫn nhập của nguyên thể “nói” và nối sang nội dung ở câu kế tiếp.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh bốn phụ âm YHWH. Bản dịch giữ dạng “Yahweh” để bảo toàn tính chất danh riêng mà không thay thế bằng tước hiệu hay áp đặt một cách đọc mang tính truyền thống hệ phái.
translation_notes:
  register: Văn phong trang trọng, ngắn gọn và tự nhiên trong tiếng Việt hiện đại. Dùng “phán” cho lời Đức Chúa Trời và “Môi-se” theo dạng tên quen thuộc. Không đặt chú thích vì câu dịch không có ký hiệu chú thích cần giải thích.
