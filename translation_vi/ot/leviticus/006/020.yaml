revisions:
- from: Bất cứ vật gì chạm vào thịt của lễ ấy đều sẽ trở nên thánh. Nếu máu của lễ ấy bắn lên áo, thì phần áo bị máu bắn lên phải được giặt tại một nơi thánh.[a]
  to: Bất cứ ai hay vật gì chạm vào thịt của lễ ấy đều sẽ trở nên thánh. Nếu máu của lễ ấy bắn lên áo[a], thì phải giặt áo ấy tại một nơi thánh.
  rationale: Bản sửa mở rộng «bất cứ vật gì» thành «Bất cứ ai hay vật gì» để phản ánh phạm vi không bị giới hạn của כֹּל אֲשֶׁר. Đồng thời, thay «phần áo» bằng «áo ấy» vì tiếng Hê-bơ-rơ chỉ y phục là đối tượng của việc giặt, không nêu một phần riêng biệt. Dấu chú thích được đặt ngay sau cách dịch «bắn lên» mà nó giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:44:02Z'
