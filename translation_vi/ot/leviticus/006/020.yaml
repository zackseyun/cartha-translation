  source_fidelity: 'Cần sửa hai điểm để bám sát tiếng Hê-bơ-rơ hơn: כֹּל אֲשֶׁר không chỉ giới hạn ở «vật gì» mà có thể gồm người hoặc vật; và mệnh đề quan hệ sau cùng quy về chiếc áo bị máu bắn/rảy lên, không chỉ một «phần áo». Mệnh lệnh giặt được giữ là quy định trực tiếp, không chuyển hẳn sang bị động.'
