    rationale: Mệnh đề אֲשֶׁר יִזֶּה עָלֶיהָ quy chiếu về «áo/y phục» mà máu bắn hoặc được rảy lên. Bản văn ra lệnh giặt y phục ấy; không xác định chỉ một phần của y phục.
