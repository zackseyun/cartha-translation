  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: vi
  text: Bất cứ ai hay vật gì chạm vào thịt của lễ ấy đều sẽ trở nên thánh. Nếu máu của lễ ấy bắn lên áo[a], thì phải giặt áo ấy tại một nơi thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được rảy lên”. Động từ Hê-bơ-rơ có thể chỉ hành động rảy trong nghi lễ; ở đây dịch là “bắn lên” vì máu văng lên áo và áo ấy phải được giặt.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Bất cứ vật gì
  rationale: Cụm từ mang nghĩa bao quát, bất định. Trong văn cảnh luật tế lễ, cách dịch này tự nhiên và không giới hạn đối tượng tiếp xúc vào con người.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: chạm vào thịt của lễ ấy
  rationale: Giữ nghĩa cụ thể của בָּשָׂר là “thịt”, đồng thời làm rõ đại từ giống cái chỉ về sinh tế chuộc tội trong văn cảnh.
- source_word: יִקְדָּשׁ
  choice: sẽ trở nên thánh
  rationale: Thể Qal ở đây diễn tả việc đi vào tình trạng thánh do tiếp xúc; “trở nên thánh” giữ được sự thay đổi về địa vị nghi lễ mà không hàm ý một nghi thức biệt riêng không được nêu ra.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: Nếu máu của lễ ấy bắn lên
  rationale: נזה có thể chỉ việc rảy hoặc làm văng chất lỏng. Ở đây máu dính vào áo và sau đó áo phải được giặt, nên “bắn lên” phù hợp với tình huống, trong khi chú thích bảo lưu nghĩa nghi lễ “rảy”.
- source_word: עַל הַבֶּגֶד
  choice: lên áo
  rationale: “Áo” là cách diễn đạt thông dụng, cụ thể cho בֶּגֶד trong ngữ cảnh một món y phục bị dính máu.
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ תְּכַבֵּס
  choice: phần áo bị máu bắn lên phải được giặt
  rationale: Cách dịch nêu rõ phần áo bị dính máu là đối tượng cần giặt, tránh cách diễn đạt mơ hồ trong tiếng Việt; thể bị động tự nhiên hơn nhưng vẫn truyền đạt mệnh lệnh pháp quy.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: tại một nơi thánh
  rationale: Danh từ không có mạo từ xác định; cách dịch này không đồng nhất nơi ấy với gian thánh bên trong và giữ phạm vi là một địa điểm đã được thánh hóa.
theological_decisions:
- issue: Ý nghĩa của sự thánh khi tiếp xúc với thịt sinh tế chuộc tội
  choice: Sự tiếp xúc khiến vật liên hệ bước vào địa vị thánh theo nghi lễ.
  alternative: Sự tiếp xúc chỉ khiến vật ấy bị giới hạn cho việc thánh, không gọi là “trở nên thánh”.
  rationale: Bản dịch giữ trực tiếp ngôn ngữ của קדשׁ nhưng không giải thích đó là sự biến đổi đạo đức nội tâm; văn cảnh cho thấy đây là sự thánh khiết thuộc phạm vi nghi lễ.
translation_notes:
  register: Văn phong luật tế lễ trang trọng nhưng dễ hiểu. Dùng “thịt của lễ ấy” để vừa tự nhiên vừa xác định rõ sở chỉ; dùng “một nơi thánh” nhằm tránh khiến độc giả hiểu là gian Chí Thánh hoặc một địa điểm xác định duy nhất.
