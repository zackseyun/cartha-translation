  terminology: «Thịt», «lễ ấy», «trở nên thánh» và «nơi thánh» đều phù hợp văn cảnh tế lễ. «Bắn lên» là một lựa chọn hợp lý cho נזה trong ngữ cảnh máu văng lên y phục; chú thích bảo lưu khả năng «rảy lên» trong nghi lễ.
