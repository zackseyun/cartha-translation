source:
  edition: WLC
  text: וּ/פָשַׁט֙ אֶת בְּגָדָ֔י/ו וְ/לָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְ/הוֹצִ֤יא אֶת הַ/דֶּ֨שֶׁן֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה אֶל מָק֖וֹם טָהֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: vi
  text: Rồi thầy tế lễ phải cởi y phục của mình ra, mặc y phục khác, và đem tro ra ngoài trại, đến một nơi thanh sạch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thanh sạch” ở đây nói về tình trạng thanh sạch theo nghi lễ trong Luật Lê-vi.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: Rồi ... phải cởi ... ra
  rationale: Trong ngữ cảnh thay y phục, פשט chỉ hành động cởi bỏ; “rồi” diễn đạt tự nhiên trình tự của chỉ dẫn nghi lễ.
- source_word: בְּגָדָיו
  choice: lễ phục
  rationale: Đại từ số ít trong mạch văn chỉ thầy tế lễ; các y phục vừa nêu là y phục thánh dùng khi phục vụ bàn thờ, nên “lễ phục” truyền đạt rõ ngữ cảnh hơn “quần áo” mà không xác định thêm kiểu áo.
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: mặc y phục khác
  rationale: לבש là mặc vào, còn בגדים אחרים là những y phục khác với bộ vừa cởi; cách dịch ngắn gọn và tự nhiên.
- source_word: וְהוֹצִיא
  choice: và đem ... ra
  rationale: Dạng Hiphil của יצא có nghĩa khiến đi ra, tức đem hoặc mang ra; “đem ... ra” giữ hướng chuyển động và không áp đặt cách vận chuyển.
- source_word: הַדֶּשֶׁן
  choice: tro
  rationale: Trong ngữ cảnh bàn thờ, דשן chỉ tro hoặc phần còn lại đã được gom khỏi lễ vật thiêu; “tro” là cách gọi tự nhiên trong tiếng Việt.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Cụm từ chỉ chuyển động vượt khỏi phạm vi trại; “ra ngoài trại” vừa chính xác vừa thuận tiếng Việt.
- source_word: אֶל מָקוֹם טָהוֹר
  choice: đến một nơi thanh sạch
  rationale: טָהוֹר thuộc trường nghĩa sạch/thanh sạch và trong Lê-vi mang sắc thái nghi lễ; “thanh sạch” giữ được phạm trù ấy mà không chèn lời giải thích vào chính văn.
theological_decisions:
- issue: Sắc thái thanh sạch theo nghi lễ của טָהוֹר
  choice: một nơi thanh sạch
  alternative: một nơi sạch; một nơi tinh sạch theo nghi lễ
  rationale: “Thanh sạch” bảo tồn ý niệm thanh sạch trong hệ thống nghi lễ Lê-vi nhưng không diễn giải quá mức bằng cách thêm trực tiếp cụm “theo nghi lễ” vào câu.
- issue: Chủ ngữ được hàm ẩn trong động từ Hê-bơ-rơ
  choice: thầy tế lễ
  alternative: người ấy; ông ấy
  rationale: Mạch văn trước xác định người thực hiện là thầy tế lễ; nêu lại chủ ngữ trong tiếng Việt giúp câu độc lập và rõ nghĩa mà không thay đổi tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo ngữ cảnh chức vụ, “lễ phục/y phục” cho trường nghĩa nghi lễ, và giữ câu chỉ dẫn theo trình tự hành động của nguyên văn.
