  source_fidelity: 'Bản nháp giữ đúng trình tự và các hành động của nguyên văn Hê-bơ-rơ: cởi y phục, mặc y phục khác, rồi đem tro ra ngoài trại đến một nơi thanh sạch. Tuy nhiên, “lễ phục” diễn giải rõ hơn từ בְּגָדָיו (“y phục/quần áo của ông ấy”), trong khi nguyên văn câu này chỉ gọi là “y phục”; thêm “của mình” phản ánh đại từ sở hữu trong nguồn và tránh áp đặt sắc thái vượt quá từ ngữ của câu.'
