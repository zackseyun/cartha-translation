  terminology: “Thầy tế lễ,” “y phục,” “tro,” “trại,” và “thanh sạch” phù hợp ngữ cảnh Lê-vi. Chú thích về “thanh sạch” được neo đúng tại thuật ngữ cần giải thích và không áp đặt diễn giải giáo phái.
