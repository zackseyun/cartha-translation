revisions:
- from: Thầy tế lễ phải mặc áo dài bằng vải gai, và mặc quần lót bằng vải gai sát thân mình.[a] Người phải xúc tro còn lại sau khi lửa thiêu lễ vật toàn thiêu trên bàn thờ, rồi đặt tro ấy bên cạnh bàn thờ.[b]
  to: Thầy tế lễ phải mặc áo bằng vải lanh, và mặc quần lót bằng vải lanh trên thân thể mình.[a] Người phải xúc tro do lửa thiêu lễ vật toàn thiêu trên bàn thờ mà thành,[b] rồi đặt tro ấy bên cạnh bàn thờ.
  rationale: Sửa “vải gai” thành “vải lanh” theo nghĩa của בַּד; thay “áo dài” bằng “áo” để không thêm kiểu dáng; thay “sát thân mình” bằng “trên thân thể mình” để không thêm ý bó sát. Mệnh đề về tro được chỉnh để phản ánh rõ hơn rằng tro là kết quả việc lửa thiêu lễ vật toàn thiêu trên bàn thờ, đồng thời chú thích bảo lưu tính cô đọng của cú pháp Hê-bơ-rơ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:52Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự nghi lễ và các yếu tố chính, nhưng “vải gai” không phải thuật ngữ chính xác cho בַּד, vốn là vải lanh trong ngữ cảnh y phục tư tế. “Áo dài” thêm nét kiểu dáng không có trong tiếng Hê-bơ-rơ và dễ gợi một y phục Việt Nam đặc thù. “Sát thân mình” cũng thêm ý ôm sát; nguyên văn chỉ nói mặc “trên thịt/thân thể mình.”
  naturalness: Câu văn nhìn chung rõ và trang trọng. “Áo bằng vải lanh” tự nhiên, trung tính hơn “áo dài bằng vải gai.” “Quần lót” là cách gọi hiện đại dễ hiểu cho y phục mặc sát da, nhưng cần diễn đạt phần bổ ngữ không hàm ý ôm sát.
  terminology: Nên dùng nhất quán “vải lanh” cho בַּד. Giữ “thầy tế lễ,” “lễ vật toàn thiêu,” và “bàn thờ,” vì các thuật ngữ này rõ nghĩa, phù hợp văn phong hiện đại và không áp đặt cách hiểu hệ phái.
  issues:
  - severity: medium
    issue: “vải gai” dịch בַּד
    rationale: Trong các quy định y phục tư tế, בַּד chỉ vải lanh. “Vải gai” là một chất liệu khác và làm giảm độ chính xác từ vựng.
  - severity: medium
    issue: “áo dài” dịch מִדּוֹ
    rationale: Từ này chỉ áo/y phục của thầy tế lễ; nguyên văn không xác định kiểu áo dài theo nghĩa hiện đại tiếng Việt. Cần dùng “áo” để tránh thêm chi tiết.
  - severity: low
    issue: “sát thân mình” và chú thích tương ứng
    rationale: Cụm này có thể gợi ý y phục bó sát, trong khi עַל־בְּשָׂרוֹ chỉ việc mặc trên thân thể/thịt mình. Cần thay bằng cách diễn đạt trung tính hơn và điều chỉnh chú thích.
  - severity: low
    issue: Diễn đạt mệnh đề về tro
    rationale: “Tro còn lại sau khi lửa thiêu...” diễn giải hợp lý, nhưng có thể giữ liên hệ trực tiếp hơn giữa tro và lễ vật toàn thiêu bị lửa thiêu trên bàn thờ.
