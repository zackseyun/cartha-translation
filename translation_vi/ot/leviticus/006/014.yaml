id: LEV.6.14
reference: Leviticus 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Lễ vật ấy phải được chế biến trên chảo với dầu[a] và trộn kỹ. Ngươi phải đem nó đến dưới dạng những phần đã nướng[b], tức là lễ vật ngũ cốc đã bẻ thành từng miếng, để dâng lên Yahweh làm hương thơm đẹp lòng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong dầu.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “những phần đã nướng” rất hiếm; có thể chỉ những phần được nướng hoặc một cách chế biến trên chảo.
    reason: lexical_alternative
  - marker: c
    text: “Hương thơm đẹp lòng” là một công thức tế lễ, diễn tả lễ vật được Yahweh chấp nhận.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: chảo
  rationale: Chỉ một dụng cụ nấu tương đối phẳng dùng để chế biến lễ vật ngũ cốc; “chảo” là từ tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: בַּשֶּׁמֶן
  choice: với dầu
  rationale: Giới từ có thể mang nghĩa “trong dầu” hoặc “với dầu”; “với dầu” diễn đạt tự nhiên sắc thái phương tiện/nguyên liệu mà không xác định quá mức cách chế biến.
- source_word: תֵּעָשֶׂה
  choice: phải được làm
  rationale: Dạng Niphal diễn tả hành động thụ động trong chỉ dẫn nghi lễ; cách dịch này bám sát cấu trúc nguồn và vẫn tự nhiên.
- source_word: מֻרְבֶּכֶת
  choice: trộn kỹ
  rationale: Diễn tả lễ vật hoặc bột được hòa trộn với dầu; “trộn kỹ” truyền đạt tính chất pha trộn mà không áp đặt một kỹ thuật nấu cụ thể.
- source_word: תְּבִיאֶנָּה
  choice: ngươi phải đem lễ vật ấy đến
  rationale: Động từ có nghĩa là đem đến, với hậu tố giống cái quy chiếu về lễ vật; thêm “lễ vật ấy” giúp tiếng Việt rõ nghĩa.
- source_word: תֻּפִינֵי
  choice: những phần đã nướng
  rationale: Đây là từ hiếm, có lẽ liên quan đến cách nướng hoặc các phần đã nướng; bản dịch giữ sự dè dặt và có chú thích về bất định từ vựng.
- source_word: מִנְחַת
  choice: lễ vật ngũ cốc
  rationale: Trong Lê-vi Ký, מִנְחָה chỉ loại lễ vật làm từ bột hoặc ngũ cốc; cách gọi này giữ được tính chuyên biệt nghi lễ.
- source_word: פִּתִּים
  choice: đã bẻ thành từng miếng
  rationale: Diễn đạt lễ vật được chia hoặc bẻ thành các phần, tự nhiên hơn cách dịch danh từ sát chữ trong tiếng Việt.
- source_word: תַּקְרִיב
  choice: hãy dâng
  rationale: Trong ngữ cảnh tế lễ, Hiphil của קרב có nghĩa đem đến để dâng; “dâng” vừa trang trọng vừa rõ chức năng nghi lễ.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  rationale: Giữ công thức tế lễ chỉ sự chấp nhận của Đức Chúa Trời, đồng thời tránh cách hiểu thô về khoái cảm khứu giác.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה, phân biệt với tước hiệu “Chúa” và bám sát tên xuất hiện trong văn bản Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Văn bản dùng trực tiếp Tứ Tự Danh; “Yahweh” bảo tồn danh riêng giao ước mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của רֵיחַ נִיחֹחַ trong ngôn ngữ tế lễ
  choice: hương thơm đẹp lòng
  alternative: hương thơm êm dịu
  rationale: Cách dịch giữ hình ảnh nguyên văn và hàm ý lễ vật được chấp nhận, nhưng không giải thích quá mức ngay trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phản ánh lời chỉ dẫn trực tiếp số ít trong ngữ cảnh luật tế lễ; giữ danh Yahweh và bảo tồn sự bất định của thuật ngữ ẩm thực hiếm תֻּפִינֵי.
