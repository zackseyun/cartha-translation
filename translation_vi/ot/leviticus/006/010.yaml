  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: vi
  text: Không được nướng với men. Ta đã ban nó cho họ làm phần được hưởng trong số các lễ vật dâng bằng lửa cho Ta.[a] Đó là vật chí thánh, cũng như lễ vật chuộc tội và lễ vật chuộc lỗi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “từ những lễ vật thức ăn dâng cho Ta.”
    reason: lexical_alternative
  - marker: b
    text: “Lễ vật chuộc lỗi” cũng có thể dịch là “lễ vật đền bù” hoặc, theo cách gọi truyền thống, là “lễ vật chuộc sự vi phạm.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה חָמֵץ
  choice: được nướng ... với men
  rationale: Dạng Nifal diễn tả hành động ở thể bị động; “với men” tự nhiên trong tiếng Việt và không thêm ý rằng lễ vật nhất thiết là bánh.
- source_word: חֶלְקָם
  choice: phần của họ
  rationale: Giữ rõ ý phần được phân cho các thầy tế lễ và hậu tố số nhiều “của họ”.
- source_word: נָתַתִּי אֹתָהּ
  choice: Ta đã ban nó
  rationale: Thể hoàn thành chỉ việc Đức Chúa Trời đã thiết lập phần ban này và hiệu lực vẫn còn trong quy định.
- source_word: מֵאִשָּׁי
  choice: từ những lễ vật dâng bằng lửa cho Ta
  rationale: Giữ nét nghĩa tế lễ kỹ thuật gắn với lửa và đại từ ngôi thứ nhất; cách diễn đạt này rõ ràng, trang trọng trong tiếng Việt hiện đại.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Cấu trúc tăng cấp chỉ mức thánh cao nhất; thêm “vật” để phù hợp với việc phân loại lễ vật, không khiến người đọc liên tưởng đến địa điểm Chí Thánh.
- source_word: כַּחַטָּאת
  choice: như lễ vật chuộc tội
  rationale: Tiền tố כ־ biểu thị sự so sánh hoặc cùng cấp phân loại về độ thánh.
- source_word: וְכָאָשָׁם
  choice: và lễ vật chuộc lỗi
  rationale: Đây là thuật ngữ tế lễ chỉ אָשָׁם; “chuộc lỗi” dễ hiểu và không giới hạn thuật ngữ vào một học thuyết giải nghĩa riêng.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật thức ăn dâng cho Đức Chúa Trời
  rationale: Bản chính giữ hình ảnh lửa vốn nổi bật trong cách hiểu truyền thống của thuật ngữ, còn chú thích bảo lưu khả năng nhấn mạnh lễ vật như thức ăn được dâng cho Đức Chúa Trời.
- issue: Cách dịch thuật ngữ tế lễ אָשָׁם
  choice: lễ vật chuộc lỗi
  alternative: lễ vật đền bù; lễ vật chuộc sự vi phạm
  rationale: “Lễ vật chuộc lỗi” là cách gọi ngắn gọn, dễ hiểu trong tiếng Việt hiện đại; chú thích bảo lưu sắc thái đền bù và cách gọi truyền thống mà không áp đặt một lý thuyết thần học riêng.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Đại từ “Ta” giữ lời phán trực tiếp của Đức Chúa Trời. Câu văn giữ thể bị động và các thuật ngữ phân loại tế lễ, đồng thời dùng chú thích để bảo lưu những khả năng từ vựng thực sự.
