    rationale: כָּלִיל bổ nghĩa cho việc làm lễ vật bốc khói, nhấn mạnh lễ vật được thiêu toàn bộ. “Lễ vật ấy phải được đốt trọn cho bốc khói” giữ sắc thái này tự nhiên hơn.
