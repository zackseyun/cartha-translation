source:
  edition: WLC
  text: וְ/הַ/כֹּהֵ֨ן הַ/מָּשִׁ֧יחַ תַּחְתָּ֛י/ו מִ/בָּנָ֖י/ו יַעֲשֶׂ֣ה אֹתָ֑/הּ חָק עוֹלָ֕ם לַ/יהוָ֖ה כָּלִ֥יל תָּקְטָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: vi
  text: 'Vị tư tế được xức dầu trong số các con trai của ông để kế nhiệm ông[a] phải chuẩn bị lễ vật ấy. Đây là quy định lâu dài[b] dành cho Đức Giê-hô-va: lễ vật ấy phải được đốt trọn cho bốc khói[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thay chỗ ông”; nguyên văn là “ở dưới ông”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “quy định vĩnh viễn” hoặc “luật lệ đời đời”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “phải được làm cho bốc khói toàn bộ”; tức là lễ vật được thiêu trọn trên bàn thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: vị tư tế được xức dầu
  rationale: 'Giữ nghĩa nghi lễ của cụm từ: vị tư tế được xức dầu để đảm nhiệm chức vụ, chứ không dùng như một danh hiệu Đấng Mê-si.'
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: là một trong các con trai của ông và kế nhiệm ông
  rationale: Diễn đạt tự nhiên quan hệ kế nhiệm chức vụ, đồng thời giữ rõ chi tiết người kế nhiệm thuộc trong số các con trai của vị tư tế trước.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: phải chuẩn bị lễ vật ấy
  rationale: Động từ עשה có nghĩa rộng là làm hoặc thực hiện; trong trình tự dâng tế, “chuẩn bị” rõ nghĩa mà không xác định quá mức hành động nghi lễ.
- source_word: חָק עוֹלָם
  choice: quy định lâu dài
  rationale: Truyền đạt hiệu lực bền vững của quy định bằng tiếng Việt hiện đại, tránh cách nói cổ hoặc khẳng định một sắc thái siêu hình không bắt buộc.
- source_word: לַיהוָה
  choice: dành cho Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời quen thuộc trong tiếng Việt và thể hiện ý lễ vật được dành cho Ngài.
- source_word: כָּלִיל תָּקְטָר
  choice: toàn bộ lễ vật phải được đốt cho bốc khói
  rationale: Giữ cả ý toàn bộ lễ vật và sắc thái nghi lễ của động từ קטר, tức làm cho lễ vật bốc lên thành khói trên bàn thờ.
theological_decisions:
- issue: Danh tính của “vị tư tế được xức dầu”
  choice: vị tư tế được xức dầu để kế nhiệm chức vụ, trong văn cảnh là chức thượng tế
  alternative: bất kỳ tư tế nào đã được xức dầu; hoặc một danh hiệu Mê-si
  rationale: Cụm từ về người thuộc trong số các con trai và kế nhiệm vị tiền nhiệm cho thấy đây là chức vụ tư tế được truyền lại, không phải một lời chỉ trực tiếp về Đấng Mê-si.
- issue: Phạm vi thời gian của חָק עוֹלָם
  choice: quy định lâu dài
  alternative: quy định vĩnh viễn; luật lệ đời đời
  rationale: עוֹלָם có thể chỉ một thời hạn kéo dài hoặc không xác định; “lâu dài” bảo toàn độ mở ngữ nghĩa, không giải quyết quá mức vấn đề thần học về thời hạn của luật nghi lễ.
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Cách phiên âm này giúp độc giả tiếng Việt nhận ra đây là danh riêng trong nguyên văn, thay vì đồng nhất nó với một tước hiệu chung.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Tư tế” giữ sắc thái nghi lễ của sách Lê-vi; câu thứ hai dùng cấu trúc trực tiếp để người đọc phổ thông dễ theo dõi. Các chú thích bảo toàn nghĩa đen và những phương án dịch có thật trong tiếng Hê-bơ-rơ.
