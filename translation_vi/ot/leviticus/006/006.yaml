  text: אֵ֗שׁ תָּמִ֛יד תּוּקַ֥ד עַל הַ/מִּזְבֵּ֖חַ לֹ֥א תִכְבֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/006.yaml
  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
translation:
  language: vi
  text: Lửa phải được giữ cháy liên tục trên bàn thờ[a]; lửa không được tắt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Lửa thường trực phải cháy trên bàn thờ; lửa không được tắt.”'
    reason: Từ תָּמִיד cũng có thể dịch là “thường trực”; cấu trúc thay thế này diễn đạt câu theo lối ít nhấn mạnh hơn đến việc duy trì lửa.
lexical_decisions:
- source_word: אֵשׁ
  choice: lửa
  rationale: Nghĩa cơ bản là lửa theo nghĩa đen; đây là cách diễn đạt trực tiếp và tự nhiên trong bối cảnh tế lễ.
- source_word: תָּמִיד
  choice: liên tục
  rationale: Từ này chỉ sự tiếp diễn không ngừng. “Liên tục” truyền đạt rõ nghĩa ấy bằng tiếng Việt hiện đại mà không hàm ý quá mức về thời gian vô tận.
- source_word: תּוּקַד
  choice: phải được giữ cháy
  rationale: Dạng Hoph'al mang sắc thái bị động/使役 bị động của động từ יקד, cho thấy lửa phải được duy trì trong tình trạng cháy, chứ không chỉ đơn thuần tự cháy.
- source_word: עַל הַמִּזְבֵּחַ
  choice: trên bàn thờ
  rationale: Giữ nguyên quan hệ không gian và tính xác định của danh từ; “bàn thờ” là thuật ngữ tiếng Việt thông dụng trong bối cảnh tế lễ.
- source_word: לֹא תִכְבֶה
  choice: không được để lửa tắt
  rationale: Diễn đạt tự nhiên mệnh lệnh phủ định rằng lửa không được tắt, đồng thời phù hợp với trách nhiệm duy trì lửa trong văn cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “phải được giữ cháy” bảo toàn sắc thái bị động và ý duy trì của nguyên ngữ; mệnh đề sau dùng cách nói tự nhiên trong tiếng Việt để nhấn mạnh rằng lửa không được phép tắt.
