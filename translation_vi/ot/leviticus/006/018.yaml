reference: Leviticus 6:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הַֽ/חַטָּ֑את בִּ/מְק֡וֹם אֲשֶׁר֩ תִּשָּׁחֵ֨ט הָ/עֹלָ֜ה תִּשָּׁחֵ֤ט הַֽ/חַטָּאת֙ לִ/פְנֵ֣י יְהוָ֔ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: vi
  text: 'Hãy nói với A-rôn và các con trai ông rằng: “Đây là luật lệ về lễ vật chuộc tội[a]: tại nơi người ta giết lễ thiêu, lễ vật chuộc tội phải được giết trước mặt Yahweh. Đó là vật chí thánh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”; từ Hê-bơ-rơ חַטָּאת có thể chỉ tội lỗi hoặc lễ vật dùng để thanh tẩy.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו לֵאמֹר
  choice: Hãy nói với A-rôn và các con trai ông rằng
  rationale: Giữ sắc thái mệnh lệnh và công thức dẫn nhập lời phán, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: זֹאת תּוֹרַת
  choice: Đây là luật lệ về
  rationale: Trong luật tế lễ, תּוֹרָה chỉ quy định hay chỉ dẫn có tính ràng buộc; “luật lệ về” vừa trang trọng vừa rõ nghĩa hơn cách dịch trừu tượng.
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ lễ vật liên quan đến tội lỗi và việc thanh tẩy, chứ không chỉ bản thân tội lỗi. “Lễ vật chuộc tội” là cách gọi dễ nhận biết trong tiếng Việt, còn phương án nhấn mạnh sự thanh tẩy được ghi ở chú thích.
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: tại nơi người ta giết tế lễ thiêu
  rationale: Diễn đạt địa điểm hiến sinh rõ ràng; “giết” phản ánh động từ שׁחט mà không thêm ý niệm ngoài nguyên văn.
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: lễ vật chuộc tội cũng phải được giết
  rationale: Thể bị động và sắc thái quy định của động từ được giữ lại; “cũng” làm rõ sự tương ứng về địa điểm với tế lễ thiêu vốn hàm chứa trong cấu trúc Hê-bơ-rơ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ chỉ sự hiện diện của Đức Chúa Trời và phiên âm trực tiếp danh giao ước יְהוָה.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Cấu trúc Hê-bơ-rơ diễn tả cấp độ thánh cao nhất. Thêm “vật” để quy chiếu rõ đến lễ vật, không khiến người đọc lầm với nơi chí thánh.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của חַטָּאת trong hệ thống tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Cả khía cạnh liên quan đến tội và chức năng thanh tẩy đều có cơ sở từ vựng và nghi lễ. Bản chính dùng cách gọi quen thuộc nhưng chú thích bảo tồn phương án hợp lý còn lại.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng câu gọn và thuật ngữ tế lễ nhất quán. Dấu chú thích [a] được đặt ngay sau thuật ngữ mà chú thích giải thích.
