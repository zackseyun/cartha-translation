- from: 'Hãy nói với A-rôn và các con trai ông rằng: “Đây là luật lệ về lễ vật chuộc tội[a]: tại nơi người ta giết tế lễ thiêu, lễ vật chuộc tội cũng phải được giết trước mặt Yahweh. Đó là vật chí thánh.”'
  to: 'Hãy nói với A-rôn và các con trai ông rằng: “Đây là luật lệ về lễ vật chuộc tội[a]: tại nơi người ta giết lễ thiêu, lễ vật chuộc tội phải được giết trước mặt Yahweh. Đó là vật chí thánh.”'
  rationale: Bản sửa bỏ yếu tố bổ sung không được nêu rõ trong nguyên văn, dùng thuật ngữ “lễ thiêu” gọn và tự nhiên, đồng thời sửa chú thích để phản ánh phạm vi từ vựng của חַטָּאת mà không áp đặt một cách giải thích nghi lễ cụ thể.
