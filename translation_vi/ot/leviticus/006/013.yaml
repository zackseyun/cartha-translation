revisions:
- from: 'Đây là lễ vật của A-rôn và các con trai ông, mà họ phải dâng lên Đức Giê-hô-va vào ngày ông được xức dầu[a]: một phần mười ê-pha bột lọc, làm lễ vật ngũ cốc thường xuyên; một nửa vào buổi sáng và một nửa vào buổi tối.'
  to: 'Đây là lễ vật của A-rôn và các con trai ông, mà họ phải dâng lên Đức Giê-hô-va vào ngày ông được xức dầu[a]: một phần mười ê-pha bột mịn làm lễ vật ngũ cốc thường lệ, một nửa vào buổi sáng và một nửa vào buổi tối.'
  rationale: Chỉnh “bột lọc” thành “bột mịn” để phản ánh chính xác סֹלֶת và dùng Việt ngữ hiện đại tự nhiên. Chỉnh “thường xuyên” thành “thường lệ” để diễn đạt rõ hơn tính đều đặn của תָּמִיד. Chú thích được viết lại cho tự nhiên, đồng thời vẫn bảo tồn và giải thích đại từ số ít trong nguyên văn, không áp đặt cách hiểu số nhiều.
