  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: vi
  text: 'Đây là lễ vật của A-rôn và các con trai ông, mà họ phải dâng lên Đức Giê-hô-va vào ngày ông được xức dầu[a]: một phần mười ê-pha bột mịn làm lễ vật ngũ cốc thường lệ, một nửa vào buổi sáng và một nửa vào buổi tối.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vào ngày xức dầu cho ông.” Bản Hê-bơ-rơ dùng đại từ số ít (“ông”), dù câu này nhắc đến “A-rôn và các con trai ông”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבַּן
  choice: lễ vật
  rationale: Danh từ chỉ lễ vật dâng trong nghi thức tế lễ; “lễ vật” tự nhiên, trang trọng và đủ rộng trong tiếng Việt.
- source_word: יַקְרִיבוּ
  choice: phải dâng
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến hoặc dâng trình; “phải dâng” diễn đạt rõ sắc thái quy định.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Dùng danh xưng riêng để phản ánh trực tiếp יהוה; giới từ “lên” đi tự nhiên với động từ “dâng” trong tiếng Việt.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: vào ngày ông được xức dầu
  rationale: Giữ lực thời gian của cụm nguyên mẫu và giữ đại từ số ít giống bản Hê-bơ-rơ, không tự đổi thành số nhiều.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: một phần mười ê-pha
  rationale: Diễn đạt chính xác đơn vị đo cổ và phiên âm tên đơn vị thay vì quy đổi phỏng đoán.
- source_word: סֹלֶת
  choice: bột lọc
  rationale: Chỉ loại bột mịn, tinh chế dùng cho lễ vật; “bột lọc” ngắn gọn và phù hợp văn cảnh nghi lễ.
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong luật tế lễ Lê-vi, từ này chỉ lễ vật làm từ sản phẩm ngũ cốc; cách dịch phân biệt nó với nghĩa rộng “lễ vật”.
- source_word: תָּמִיד
  choice: thường xuyên
  rationale: Diễn đạt sự lặp lại đều đặn mà không nhất thiết hàm ý hành động diễn ra không gián đoạn.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: một nửa ... và một nửa
  rationale: Giữ trực tiếp sự phân chia lễ vật thành hai phần bằng nhau.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: vào buổi sáng ... vào buổi tối
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đại từ số ít trong cụm “vào ngày ông được xức dầu” sau khi câu nêu A-rôn và các con trai ông
  choice: Giữ đại từ số ít “ông” theo văn bản Masoret, với A-rôn là tham chiếu gần và chính.
  alternative: 'Dịch theo nghĩa phân phối hoặc số nhiều: “vào ngày họ được xức dầu”.'
  rationale: Bản Hê-bơ-rơ dùng hậu tố đại từ số ít. Bản dịch không làm phẳng sự căng thẳng ngữ pháp giữa chủ thể số nhiều và đối tượng số ít; chú thích trình bày cách hiểu khác.
translation_notes:
  register: Văn phong luật tế lễ trang trọng nhưng hiện đại; giữ cấu trúc mệnh lệnh rõ ràng, phiên âm đơn vị cổ “ê-pha”, và bảo tồn điểm không tương hợp số trong nguyên văn bằng chú thích.
