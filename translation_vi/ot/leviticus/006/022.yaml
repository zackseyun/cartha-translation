  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'thầy tế lễ' theo thuật ngữ Kinh Thánh phổ thông; giữ sắc thái cho phép của luật tế lễ. Dấu chú thích [a] đặt ngay sau cụm từ mà chú thích giải thích.
