  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: vi
  text: Mọi người nam thuộc hàng thầy tế lễ được phép ăn lễ vật ấy; lễ vật ấy là chí thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “thánh của các thánh”, một thành ngữ chỉ điều có cấp độ thánh cao nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Mọi người nam
  rationale: כָּל mang nghĩa phân phối với danh từ số ít זָכָר; cách dịch này giữ rõ tiêu chuẩn về giới tính mà không hàm ý chỉ người trưởng thành.
- source_word: בַּכֹּהֲנִים
  choice: trong số các thầy tế lễ
  rationale: Giới từ ב chỉ tư cách thuộc nhóm; cách diễn đạt này tự nhiên trong tiếng Việt và xác định người nam ấy thuộc hàng thầy tế lễ.
- source_word: יֹאכַל
  choice: đều được ăn
  rationale: Dạng chưa hoàn thành trong ngữ cảnh luật lệ diễn tả quyền được phép, không nhất thiết là mệnh lệnh buộc từng cá nhân phải ăn.
- source_word: אֹתָהּ
  choice: lễ vật ấy
  rationale: Đại từ giống cái quy chiếu đến lễ vật đang được bàn ở ngữ cảnh trước; thêm danh từ 'lễ vật' giúp tiếng Việt rõ và tự nhiên mà không thay đổi đối tượng quy chiếu.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Kết cấu 'sự thánh khiết của những sự thánh khiết' là lối nói cực cấp, chỉ cấp độ thánh cao nhất; 'chí thánh' trang trọng, gọn và không gợi nghĩa không gian.
- source_word: הִוא
  choice: đó là vật
  rationale: Đại từ giống cái trong tiếng Hê-bơ-rơ hòa hợp với tiền ngữ; tiếng Việt dùng 'đó' và bổ sung 'vật' để tạo mệnh đề danh từ tự nhiên.
