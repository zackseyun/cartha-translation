  text: וְ/כָל מִנְחַ֥ת כֹּהֵ֛ן כָּלִ֥יל תִּהְיֶ֖ה לֹ֥א תֵאָכֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/016.yaml
  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: vi
  text: Mọi lễ vật ngũ cốc của một thầy tế lễ phải được thiêu hết[a]; không được ăn lễ vật ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “phải được dâng toàn bộ.” Tính từ Hê-bơ-rơ chỉ điều toàn bộ hoặc trọn vẹn; trong ngữ cảnh này, điều đó có nghĩa là lễ vật không được ăn nhưng được thiêu hết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Mọi
  rationale: כָּל đi với danh từ số ít mang nghĩa phân phối là “mọi”. Liên từ וְ tiếp nối mạch luật lệ; trong tiếng Việt, không cần dịch riêng vẫn giữ được sự liên tục tự nhiên.
- source_word: מִנְחַת
  choice: lễ vật ngũ cốc
  rationale: מִנְחָה trong sách Lê-vi là thuật ngữ chỉ lễ vật làm từ ngũ cốc, chứ không phải lễ vật nói chung. Cách dịch này rõ nghĩa và phù hợp với tiếng Việt hiện đại.
- source_word: כֹּהֵן
  choice: của một thầy tế lễ
  rationale: Cụm trạng thái kết hợp מִנְחַת כֹּהֵן có nghĩa là lễ vật ngũ cốc do một thầy tế lễ dâng. “Một” thể hiện giá trị không xác định và tính phân phối trong quy định.
- source_word: כָּלִיל
  choice: được thiêu trọn vẹn
  rationale: כָּלִיל chỉ vật được dâng toàn bộ, đặc biệt là lễ vật được thiêu hết trên bàn thờ. Bản dịch diễn đạt ý nghĩa thực tế trong ngữ cảnh, đồng thời chú thích bảo lưu sắc thái từ vựng “toàn bộ/trọn vẹn” của nguyên văn.
- source_word: תִּהְיֶה
  choice: phải được
  rationale: Thể vị hoàn thành chưa hoàn tất của היה trong văn luật mang lực quy định. “Phải” tự nhiên trong tiếng Việt và truyền đạt rõ tính bắt buộc.
- source_word: לֹא תֵאָכֵל
  choice: không được ăn lễ vật ấy
  rationale: Động từ thể Niphal mang nghĩa bị động “không được ăn”. Tiếng Việt tự nhiên thường dùng cấu trúc phiếm chỉ “không được ăn”; thêm “lễ vật ấy” làm rõ đối tượng mà không thay đổi nội dung.
theological_decisions:
- issue: Phạm vi của כָּלִיל đối với lễ vật ngũ cốc của thầy tế lễ
  choice: được thiêu trọn vẹn
  alternative: phải là lễ vật toàn phần
  rationale: Ngữ cảnh hiến tế và mệnh đề tiếp theo “không được ăn” cho thấy toàn bộ lễ vật được dành cho bàn thờ. Tuy vậy, chú thích ghi nhận rằng từ Hê-bơ-rơ tự thân nhấn mạnh tính toàn bộ hoặc trọn vẹn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “thầy tế lễ” và “lễ vật ngũ cốc” làm thuật ngữ tế tự nhất quán; tránh lối Hán-Việt quá cổ và không thêm diễn giải hệ phái.
