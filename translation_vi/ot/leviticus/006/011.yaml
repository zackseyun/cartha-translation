revisions:
- from: Mọi người nam trong số các con trai A-rôn đều được ăn phần ấy. Đây là quy định vĩnh viễn trải qua các thế hệ của anh em về những lễ vật dâng bằng lửa cho Đức Giê-hô-va. Bất cứ vật gì chạm đến các lễ vật ấy đều sẽ trở nên thánh[a].
  to: Mọi người nam trong số các con trai A-rôn đều được ăn phần ấy. Đây là luật định vĩnh viễn cho các thế hệ của anh em, về những lễ vật dâng bằng lửa cho Đức Giê-hô-va. Bất cứ điều gì chạm đến các lễ vật ấy đều sẽ trở nên thánh[a].
  rationale: Sửa mệnh đề cuối để không giới hạn chủ thể tiếp xúc là đồ vật, đồng thời chỉnh công thức thời hạn luật định cho tự nhiên và chính xác hơn trong tiếng Việt. Chú thích tiếp tục bảo tồn cả độ rộng của chủ thể và cách hiểu hạn chế của mệnh đề cuối, không quyết định vượt quá điều nguyên văn xác định.
