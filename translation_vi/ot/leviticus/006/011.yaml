  - severity: low
    issue: Công thức chỉ thời hạn pháp lý chưa tự nhiên.
    rationale: “Trải qua các thế hệ của anh em” có thể hiểu như diễn tiến thời gian hơn là hiệu lực quy định. “Cho các thế hệ của anh em” phản ánh tốt יותר לְדֹרֹתֵיכֶם và tự nhiên hơn.
