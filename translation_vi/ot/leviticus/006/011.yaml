  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: vi
  text: Mọi người nam trong số các con trai A-rôn đều được ăn phần ấy. Đây là luật định vĩnh viễn cho các thế hệ của anh em, về những lễ vật dâng bằng lửa cho Đức Giê-hô-va. Bất cứ điều gì chạm đến các lễ vật ấy đều sẽ trở nên thánh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đều sẽ được thánh hóa.” Cấu trúc Hê-bơ-rơ nói rộng về bất cứ ai hoặc bất cứ điều gì chạm đến các lễ vật ấy. Một số người hiểu theo nghĩa hạn chế hơn: chỉ những gì đã thánh mới được chạm đến chúng.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Mọi người nam
  rationale: Diễn đạt chính xác giới tính trong quy định về tư cách tư tế; cấu trúc số ít trong tiếng Hê-bơ-rơ có ý phân phối.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: trong số các con trai A-rôn
  rationale: Giữ nguyên cách gọi gia tộc-tư tế của nguyên văn, không tự ý mở rộng thành mọi hậu duệ.
- source_word: יֹאכֲלֶנָּה
  choice: đều được ăn phần ấy
  rationale: Thể hiện quyền được phép ăn phần lễ vật đã nói ở ngữ cảnh trước; “phần ấy” làm rõ đây là phần lễ vật dành cho tư tế.
- source_word: חָק עוֹלָם
  choice: quy định vĩnh viễn
  rationale: Cách diễn đạt tự nhiên, trang trọng, giữ được tính lâu dài và pháp quy của cụm từ.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của anh em
  rationale: Chuyển tải công thức giao ước chỉ hiệu lực tiếp diễn qua các thế hệ kế tiếp.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: về những lễ vật dâng bằng lửa cho Đức Giê-hô-va
  rationale: Giữ rõ phương diện tế lễ và sự liên hệ với lửa của אִשֶּׁה; giới từ được diễn đạt tự nhiên trong quan hệ với quy định vừa nêu.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng quen thuộc và trang trọng trong tiếng Việt.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: Bất cứ vật gì chạm đến các lễ vật ấy
  rationale: Nguyên ngữ không xác định rõ người hay vật; trong tiếng Việt, “vật gì” tự nhiên hơn trong ngữ cảnh tiếp xúc với vật thánh, nhưng chú thích ghi nhận độ rộng của cấu trúc Hê-bơ-rơ.
- source_word: יִקְדָּשׁ
  choice: đều sẽ trở nên thánh
  rationale: Thể hiện sự chuyển sang tình trạng thánh do tiếp xúc, là nghĩa trực tiếp tự nhiên của thể động từ trong câu.
theological_decisions:
- issue: Ý nghĩa của sự truyền tính thánh trong mệnh đề cuối
  choice: Sự tiếp xúc với các lễ vật thánh khiến vật tiếp xúc trở nên thánh.
  alternative: Chỉ vật vốn đã thánh mới được phép chạm đến các lễ vật; hoặc sự tiếp xúc đặt người hay vật ấy dưới nghĩa vụ biệt riêng.
  rationale: Cú pháp nguyên văn tự nhiên nhất diễn tả kết quả “trở nên thánh”, nhưng chú thích bảo tồn cách hiểu hạn chế khác mà không áp đặt một hệ phái hay cách giải nghĩa riêng.
translation_notes:
  register: Văn phong luật tế lễ trang trọng nhưng hiện đại. Dùng “anh em” cho ngôi thứ hai số nhiều để tránh sắc thái suồng sã; giữ tên A-rôn theo dạng quen thuộc. Chú thích bảo tồn sự mơ hồ về đối tượng tiếp xúc và hệ quả của tính thánh.
