  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Nêu dạng danh thánh trong nguyên văn và cách dịch truyền thống.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời phán của Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”; liên từ וַ được thể hiện qua mạch kể tiếng Việt mà không nhất thiết phải thêm “và”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với [người nào]”, “với” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tên מֹשֶׁה.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn nhập lời trực tiếp, “rằng” chuyển tải tự nhiên chức năng của לֵאמֹר và dẫn vào nội dung lời phán tiếp theo.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn đặc tính danh riêng và không thay nó bằng tước hiệu; chú thích nêu cách dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm phù hợp vì đây là công thức mở đầu cho lời phán trực tiếp ở câu kế tiếp. Không thêm “Và” ở đầu câu vì tiếng Việt không cần tái hiện máy móc liên từ kể chuyện Hê-bơ-rơ.
