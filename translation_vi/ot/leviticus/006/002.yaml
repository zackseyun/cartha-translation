    rationale: Nguyên văn nói lễ thiêu ở “trên nơi đốt, trên bàn thờ”. Cách “chỗ đốt của bàn thờ” có thể hiểu được nhưng không phản ánh rõ hai cụm định vị liên tiếp.
  - severity: low
    issue: “Tại đó” có tiền ngữ không thật rõ ở câu cuối.
    rationale: Hậu tố בּוֹ được để mở trong nguyên ngữ, nhưng trong tiếng Việt “trên đó” liên kết rõ hơn với bàn thờ vừa được nêu mà vẫn không giải thích quá mức.
