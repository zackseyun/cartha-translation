  variant: modern standard Vietnamese
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: vi
  text: 'Hãy truyền lệnh cho A-rôn và các con trai ông như sau: “Đây là luật lệ về lễ thiêu[a]: chính lễ thiêu phải ở trên nơi đốt[b], trên bàn thờ, suốt đêm cho đến sáng; lửa của bàn thờ phải được giữ cháy trên đó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây là chỉ dẫn về lễ thiêu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Từ Hê-bơ-rơ ở đây chỉ nơi đốt hoặc lòng lửa trên bàn thờ; cũng có thể dịch: “trên lòng lửa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Hãy truyền lệnh
  rationale: Thể mệnh lệnh của צוה mang lực truyền lệnh trực tiếp; cách dịch này mạnh hơn “hãy chỉ dẫn” nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: A-rôn và các con trai ông
  rationale: Giữ đúng tên riêng và nghĩa cụ thể của בנים trong bối cảnh các nam tư tế thuộc dòng A-rôn.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dẫn vào lời nói trực tiếp một cách tự nhiên hơn lối dịch sát chữ “mà nói” trong tiếng Việt hiện đại.
- source_word: זֹאת תּוֹרַת
  choice: Đây là luật lệ về
  rationale: תּוֹרָה ở đây chỉ quy tắc có tính quy phạm dành cho một nghi lễ; “luật lệ” giữ sắc thái pháp quy mà không khiến người đọc hiểu đây nhất thiết là nhan đề của toàn bộ Torah.
- source_word: הָעֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ ngắn gọn, quen thuộc và phù hợp cho lễ vật được thiêu trọn trên bàn thờ; tránh lối dịch từ nguyên khó hiểu như “lễ thăng lên”.
- source_word: הִוא הָעֹלָה
  choice: chính lễ thiêu
  rationale: Từ “chính” thể hiện sắc thái nhấn mạnh của đại từ הִוא đi cùng danh từ được lặp lại.
- source_word: עַל מוֹקְדָה
  choice: ở trên chỗ đốt
  rationale: מוֹקְדָה chỉ nơi đốt hoặc lòng lửa trên bàn thờ. “Chỗ đốt” giữ hình ảnh cụ thể và tránh xác định quá mức một từ Hê-bơ-rơ hiếm.
- source_word: עַל הַמִּזְבֵּחַ
  choice: của bàn thờ
  rationale: Trong cấu trúc tiếng Việt, “chỗ đốt của bàn thờ” diễn đạt tự nhiên địa điểm mà tiếng Hê-bơ-rơ nêu bằng “trên bàn thờ”.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: suốt đêm cho đến sáng
  rationale: Giữ trọn khoảng thời gian và trình tự của nguyên văn bằng cách diễn đạt tự nhiên.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: lửa trên bàn thờ phải được giữ cháy tại đó
  rationale: Dạng Hophal của יקד cho thấy lửa phải được duy trì, không chỉ đơn thuần được mô tả là đang cháy. “Tại đó” giữ cách quy chiếu gọn và phần nào để mở tiền ngữ của hậu tố בּוֹ.
theological_decisions:
- issue: Cách dịch תּוֹרָה trong luật tế lễ
  choice: luật lệ
  alternative: chỉ dẫn; quy định
  rationale: “Luật lệ” giữ giọng văn trang trọng và tính quy phạm của công thức tế lễ, nhưng không mặc nhiên biến từ này thành tên gọi toàn bộ Ngũ Kinh.
- issue: Tính chất của mệnh lệnh về lửa bàn thờ
  choice: phải được giữ cháy
  alternative: sẽ cháy; phải cháy
  rationale: Cách dịch này phản ánh dạng động từ bị động-nguyên nhân và cho thấy đây là yêu cầu phải liên tục duy trì lửa, thay vì chỉ là một lời mô tả.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp với luật tế lễ, nhưng dùng cú pháp tiếng Việt hiện đại. Các dấu chú thích [a], [b] được đặt ngay sau những từ ngữ mà chú thích giải thích.
