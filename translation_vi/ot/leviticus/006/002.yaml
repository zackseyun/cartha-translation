- from: 'Hãy truyền lệnh cho A-rôn và các con trai ông rằng: “Đây là luật lệ về lễ thiêu[a]: chính lễ thiêu phải ở trên chỗ đốt[b] của bàn thờ suốt đêm cho đến sáng; lửa trên bàn thờ phải được giữ cháy tại đó.”'
