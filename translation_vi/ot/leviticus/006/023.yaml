source:
  edition: WLC
  text: וְ/כָל חַטָּ֡את אֲשֶׁר֩ יוּבָ֨א מִ/דָּמָ֜/הּ אֶל אֹ֧הֶל מוֹעֵ֛ד לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ לֹ֣א תֵאָכֵ֑ל בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: vi
  text: Nhưng bất cứ lễ vật chuộc tội nào mà một phần máu được đem vào Lều Hội Kiến để làm lễ chuộc tội trong nơi thánh thì không được ăn[a]; phải dùng lửa thiêu lễ vật ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “lễ vật thanh tẩy” thay cho “lễ vật chuộc tội”; từ Hê-bơ-rơ חַטָּאת trong sách Lê-vi có thể chỉ sinh tế dùng để xử lý sự ô uế và tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Nhưng bất cứ
  rationale: Liên từ וְ nối quy định này với phần trước và trong ngữ cảnh có sắc thái đối chiếu; כָל mở rộng quy định đến mọi lễ vật thuộc trường hợp được nêu.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong luật tế lễ, từ này chỉ sinh tế liên quan đến việc xử lý tội lỗi và sự ô uế, chứ không chỉ khái niệm trừu tượng về tội.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: mà một phần máu được đem
  rationale: Giới từ מִן gắn với 'máu của nó' có nghĩa phân phần, cho thấy một phần máu của lễ vật được đem vào, không nhất thiết là toàn bộ.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: vào Lều Hội Kiến
  rationale: Đây là danh xưng quen thuộc của lều thánh; 'vào' diễn đạt đúng hướng chuyển động vào bên trong.
- source_word: לְכַפֵּר
  choice: để làm lễ chuộc tội
  rationale: Cách dịch này giữ được cả chiều kích nghi lễ lẫn thần học của כפר mà không áp đặt một học thuyết riêng về sự chuộc tội.
- source_word: בַּקֹּדֶשׁ
  choice: trong nơi thánh
  rationale: Cụm từ chỉ khu vực thánh thuộc nơi thờ phượng, không nói về sự thánh khiết theo nghĩa trừu tượng.
- source_word: לֹא תֵאָכֵל
  choice: không được ăn
  rationale: Diễn đạt tự nhiên mệnh lệnh cấm ở thể bị động trong tiếng Việt hiện đại.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: phải dùng lửa thiêu lễ vật ấy
  rationale: Giữ sự nhấn mạnh rõ ràng vào phương tiện là lửa, đồng thời nêu lại đối tượng để câu tiếng Việt không mơ hồ.
theological_decisions:
- issue: Ý nghĩa của חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: '''Lễ vật chuộc tội'' quen thuộc và dễ hiểu đối với độc giả phổ thông, còn chú thích bảo tồn nghĩa thanh tẩy có thể có của thuật ngữ trong sách Lê-vi.'
- issue: Phạm vi lượng máu được đem vào nơi thánh
  choice: một phần máu được đem
  alternative: máu được đem
  rationale: Cách dịch tường minh nghĩa phân phần của מִן và tránh khiến người đọc hiểu rằng nhất thiết toàn bộ máu đều được đem vào.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng tự nhiên, dùng thuật ngữ quen thuộc trong tiếng Việt hiện đại. Viết hoa “Lều Hội Kiến” như một danh xưng; giữ “nơi thánh” ở dạng mô tả. Đại từ thay thế ở vế cuối được mở rõ thành “lễ vật ấy” để tránh nhầm với máu.
