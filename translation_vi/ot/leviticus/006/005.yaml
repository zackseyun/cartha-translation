base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: vi
  text: Ngọn lửa trên bàn thờ phải được giữ cho luôn cháy; không được để tắt. Mỗi buổi sáng[a], thầy tế lễ phải thêm củi vào ngọn lửa ấy, bày lễ thiêu trên ngọn lửa ấy, rồi thiêu trên đó các phần mỡ của các lễ vật bình an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn lặp lại “buổi sáng”: “buổi sáng, buổi sáng,” mang nghĩa mỗi buổi sáng.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các lễ vật an lành” hoặc “các lễ vật thông công.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: phải được giữ cho luôn cháy
  rationale: Dạng Hophal diễn tả trạng thái cháy phải được duy trì, chứ không chỉ nói rằng lửa đang cháy. Cách dịch này tự nhiên trong tiếng Việt và làm rõ yêu cầu liên tục của nghi lễ.
- source_word: לֹא תִכְבֶּה
  choice: không được để tắt
  rationale: 'Diễn đạt tự nhiên một mệnh lệnh nghi lễ: ngọn lửa không được phép tắt. Cách nói này không hàm ý rằng lửa phải được nhóm lại.'
- source_word: וּבִעֵר ... עֵצִים
  choice: phải thêm củi vào ngọn lửa ấy
  rationale: Trong ngữ cảnh duy trì ngọn lửa đã cháy, hành động là đặt hoặc tiếp củi để lửa tiếp tục cháy. “Thêm củi vào” truyền đạt đúng hành động hơn “nhóm lửa”, vốn có thể gợi ý bắt đầu một ngọn lửa mới.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: mỗi buổi sáng
  rationale: Sự lặp lại danh từ mang nghĩa phân phối, tức hành động được thực hiện vào từng buổi sáng. Chú thích giữ lại lối diễn đạt sát hình thức hơn.
- source_word: וְעָרַךְ
  choice: sắp
  rationale: Trong ngữ cảnh tế lễ, động từ chỉ việc đặt lễ vật theo trật tự thích hợp trên lửa hoặc bàn thờ. “Sắp” ngắn gọn, tự nhiên và vẫn giữ sắc thái nghi thức.
- source_word: הָעֹלָה
  choice: lễ thiêu
  rationale: Đây là thuật ngữ tiếng Việt quen dùng cho loại lễ vật được thiêu toàn phần. Nó giữ rõ phạm trù tế lễ mà không biến nghĩa từ nguyên “đi lên” thành một cách gọi khó hiểu.
- source_word: וְהִקְטִיר
  choice: thiêu
  rationale: Trong nghi lễ, động từ Hiphil này chỉ việc làm cho phần lễ vật bốc khói trên bàn thờ. “Thiêu” vừa trang trọng vừa dễ hiểu; ý bốc khói đã có trong bối cảnh tế lễ.
- source_word: חֶלְבֵי
  choice: các phần mỡ
  rationale: Từ này chỉ những phần mỡ cụ thể được dành để thiêu trong nghi lễ, không phải nghĩa bóng là “những phần tốt nhất”.
- source_word: הַשְּׁלָמִים
  choice: lễ vật bình an
  rationale: Cách gọi này vừa quen thuộc trong thuật ngữ Kinh Thánh tiếng Việt vừa bảo tồn mối liên hệ của từ với sự bình an, toàn vẹn; chú thích nêu các cách hiểu khả dĩ khác.
theological_decisions:
- issue: Cách gọi các loại lễ vật
  choice: Dùng các thuật ngữ quen thuộc “lễ thiêu” và “lễ vật bình an”, đồng thời giữ rõ các hành động nghi lễ.
  alternative: Dùng những cách gọi thiên về từ nguyên như “lễ vật đi lên” và “lễ vật an lành” hoặc nhấn mạnh sự thông công.
  rationale: Đây là chỉ dẫn luật lệ về tế lễ; các thuật ngữ ổn định giúp người đọc nhận ra từng loại lễ vật. Chú thích về שְׁלָמִים bảo tồn dải nghĩa mà không áp đặt một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong luật lệ, trang trọng nhưng hiện đại. Đại từ “ngọn lửa ấy” phản ánh các hậu tố giống cái trong những mệnh đề tiếp theo, vốn quy chiếu tự nhiên về “ngọn lửa”; tránh lặp “trên đó” quá mức nhưng vẫn giữ vị trí của lễ vật và các phần mỡ trên lửa. Các dấu chú thích [a], [b] được đặt ngay sau cụm từ liên quan, sửa sự lệch vị trí thấy trong lớp tham khảo tiếng Anh.
