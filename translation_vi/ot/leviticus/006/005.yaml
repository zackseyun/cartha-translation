revisions:
- from: Ngọn lửa trên bàn thờ phải được giữ cho luôn cháy; không được để tắt. Mỗi buổi sáng[a], thầy tế lễ phải thêm củi vào ngọn lửa ấy, sắp lễ thiêu trên đó, rồi thiêu các phần mỡ của lễ vật bình an[b] trên đó.
  to: Ngọn lửa trên bàn thờ phải được giữ cho luôn cháy; không được để tắt. Mỗi buổi sáng[a], thầy tế lễ phải thêm củi vào ngọn lửa ấy, bày lễ thiêu trên ngọn lửa ấy, rồi thiêu trên đó các phần mỡ của các lễ vật bình an[b].
  rationale: 'Bản sửa chỉ làm rõ hai điểm hình thức của nguyên ngữ: số nhiều xác định của “các lễ vật bình an” và sự quy chiếu về ngọn lửa trong các cụm giới từ sau đó. “Bày” thay cho “sắp” là điều chỉnh phong cách nhẹ để câu tự nhiên hơn, không thay đổi hành động nghi thức. Chú thích a được chỉnh để trình bày phép lặp Hebrew sát hơn và tránh cách diễn đạt tiếng Việt không phải là một tương đương từ vựng trực tiếp.'
