id: LEV.2.12
reference: Leviticus 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: vi
  text: Các ngươi có thể dâng chúng cho Yahweh làm lễ vật đầu mùa,[a] nhưng không được đem chúng lên bàn thờ để làm hương thơm đẹp lòng Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như một lễ vật đầu mùa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “chúng không được đi lên bàn thờ để làm hương thơm đẹp lòng”; đây là cách nói tế lễ về việc dâng trên bàn thờ nhằm tạo hương thơm được chấp nhận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: lễ vật đầu mùa
  rationale: Cụm từ chỉ lễ vật từ phần sản vật đầu tiên; cách dịch này tự nhiên trong tiếng Việt và giữ được quan hệ giữa lễ vật với đầu mùa.
- source_word: תַּקְרִיבוּ
  choice: có thể dâng
  rationale: Động từ Hiphil của קרב trong ngữ cảnh tế lễ nghĩa là đem đến hoặc trình dâng; sắc thái cho phép phù hợp với sự tương phản rằng chúng được dâng cho Yahweh nhưng không được đưa lên bàn thờ.
- source_word: אֹתָם
  choice: chúng
  rationale: Đại từ số nhiều quy chiếu về những thứ có men và mật ong ở câu trước.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh giao ước Yahweh và diễn đạt hướng dâng hiến bằng cấu trúc tiếng Việt tự nhiên.
- source_word: וְאֶל־הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: nhưng không được đưa chúng lên bàn thờ
  rationale: Giữ hình ảnh đi lên của עלה, đồng thời dùng thể sai khiến tự nhiên để chỉ việc đem lễ vật lên bàn thờ; וְ mang ý tương phản trong ngữ cảnh.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: làm hương thơm đẹp lòng Ngài
  rationale: Giữ ẩn dụ tế lễ về mùi hương đồng thời truyền đạt sắc thái được Đức Chúa Trời chấp nhận bằng tiếng Việt rõ ràng.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm Yahweh bảo tồn danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của לְרֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng Ngài
  alternative: hương thơm êm dịu
  rationale: Cách dịch giữ hình ảnh mùi hương và làm rõ sắc thái được Thiên Chúa vui nhận, nhưng không biến cụm từ thành một tuyên bố thần học rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh ngôi thứ hai số nhiều trong lời luật; giữ danh Yahweh theo dạng phiên âm. Dấu chú thích đặt ngay sau các cụm từ liên quan và theo thứ tự [a], [b].
