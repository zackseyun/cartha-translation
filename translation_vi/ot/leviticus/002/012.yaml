revisions:
- from: Các ngươi có thể dâng chúng lên Yahweh như lễ vật đầu mùa,[a] nhưng không được đưa chúng lên bàn thờ làm hương thơm đẹp lòng Ngài.[b]
  to: Các ngươi có thể dâng chúng cho Yahweh làm lễ vật đầu mùa,[a] nhưng không được đem chúng lên bàn thờ để làm hương thơm đẹp lòng Ngài.[b]
  rationale: Đổi «lên Yahweh» thành «cho Yahweh» để phản ánh chính xác לַיהוָה và bảo toàn tương phản với «lên bàn thờ». Điều chỉnh chú thích để giải thích thành ngữ mà không áp đặt một loại lễ tế không được nêu rõ trong câu.
