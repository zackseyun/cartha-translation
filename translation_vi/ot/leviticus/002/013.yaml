source:
  edition: WLC
  text: וְ/כָל קָרְבַּ֣ן מִנְחָתְ/ךָ֮ בַּ/מֶּ֣לַח תִּמְלָח֒ וְ/לֹ֣א תַשְׁבִּ֗ית מֶ֚לַח בְּרִ֣ית אֱלֹהֶ֔י/ךָ מֵ/עַ֖ל מִנְחָתֶ֑/ךָ עַ֥ל כָּל קָרְבָּנְ/ךָ֖ תַּקְרִ֥יב מֶֽלַח־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: vi
  text: Mọi lễ vật ngũ cốc của con phải được nêm muối[a]. Con không được để lễ vật ngũ cốc của mình thiếu muối của giao ước của Đức Chúa Trời của con[b]. Với mọi lễ vật của mình, con phải dâng muối[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nguyên văn: “bằng muối, con phải ướp muối”; tiếng Hê-bơ-rơ dùng cả danh từ “muối” lẫn động từ “ướp muối”.'
    reason: lexical_alternative
  - marker: b
    text: “Muối của giao ước của Đức Chúa Trời của con” là một cách nói gắn muối với giao ước và việc dâng tế lễ; câu này không giải thích thêm ý nghĩa biểu tượng của cụm từ ấy.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “Trên mọi lễ vật của mình, con phải dâng muối.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן מִנְחָתְךָ
  choice: mỗi lễ vật ngũ cốc con dâng
  rationale: Trong Lê-vi Ký 2, מִנְחָה chỉ lễ vật làm từ ngũ cốc; cách diễn đạt này vừa giữ nét nghĩa hiến dâng của קָרְבַּן vừa tránh lối lặp cứng 'lễ vật của lễ vật ngũ cốc'.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: phải được nêm muối
  rationale: Nguyên văn dùng cả danh từ 'muối' và động từ 'ướp muối'. 'Nêm muối' là cách nói tự nhiên trong tiếng Việt và vẫn diễn đạt rõ yêu cầu nghi lễ; chú thích lưu lại cấu trúc sát chữ.
- source_word: תַשְׁבִּית
  choice: không được để ... thiếu
  rationale: Dạng Hiphil của שבת tại đây mang nghĩa làm cho ngưng, loại bỏ hoặc để thiếu; cách dịch này truyền đạt rõ mệnh lệnh cấm.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: muối của giao ước với Đức Chúa Trời của con
  rationale: Giữ nguyên hình ảnh giao ước thay vì giải thích biểu tượng; thêm 'với' làm rõ quan hệ tự nhiên trong tiếng Việt mà không xác định quá mức ý nghĩa của muối.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: cùng với mọi lễ vật của mình
  rationale: עַל có thể dịch sát là 'trên', nhưng trong ngữ cảnh này cụm từ chỉ việc muối đi kèm mọi lễ vật; 'cùng với' tự nhiên hơn trong tiếng Việt và không buộc hiểu rằng muối chỉ được đặt lên trên.
- source_word: תַּקְרִיב
  choice: phải dâng
  rationale: Trong văn cảnh tế lễ, Hiphil của קרב thường có nghĩa đem đến để dâng; 'dâng' là từ hiện đại, trang trọng và phù hợp với hành động nghi lễ.
theological_decisions:
- issue: Có nên giải thích ý nghĩa biểu tượng của 'muối của giao ước' ngay trong chính văn hay không
  choice: Giữ hình ảnh 'muối của giao ước' trong chính văn
  alternative: muối tượng trưng cho giao ước bền vững với Đức Chúa Trời
  rationale: Câu Kinh Thánh không tự giải thích biểu tượng này. Giữ nguyên cách nói bảo toàn hình ảnh giao ước và tránh áp đặt một cách giải nghĩa thần học duy nhất.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ số ít “con” phản ánh các hậu tố và động từ ngôi thứ hai số ít giống đực trong tiếng Hê-bơ-rơ, đồng thời tránh đại từ cổ “ngươi”. Thuật ngữ “lễ vật ngũ cốc” giữ tính chuyên biệt của מִנְחָה trong Lê-vi Ký 2.
