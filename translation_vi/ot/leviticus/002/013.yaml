    rationale: קָרְבַּן מִנְחָתְךָ là một cụm sở hữu, sát nghĩa là lễ vật của lễ vật ngũ cốc của người nhận; tiếng Việt có thể diễn đạt gọn là “mọi lễ vật ngũ cốc của con” mà không thêm “dâng.”
