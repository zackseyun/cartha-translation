source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Người ấy phải đem lễ vật đến cho các con trai A-rôn, là các thầy tế lễ. Một thầy tế lễ sẽ lấy từ đó một nắm đầy bột mịn cùng một phần dầu và toàn bộ nhũ hương, rồi thiêu phần kỷ niệm của lễ vật trên bàn thờ. Đó là lễ vật dâng bằng lửa[a], có hương thơm làm đẹp lòng Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật làm thức ăn.”'
    reason: 'Ghi nhận hai cách hiểu chính của thuật ngữ tế lễ אִשֶּׁה: lễ vật được dâng bằng lửa hoặc lễ vật được hình dung như thức ăn.'
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Người ấy phải đem lễ vật đến
  rationale: Động từ Hiphil của בוא với đại từ tân ngữ giống cái chỉ việc người dâng đem lễ vật ngũ cốc đến; “phải” phù hợp văn phong luật lệ và “lễ vật” làm rõ sở chỉ trong tiếng Việt.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: các con trai A-rôn, là các thầy tế lễ
  rationale: Giữ cả quan hệ gia đình lẫn chức vụ; “là” diễn đạt tự nhiên quan hệ đồng vị trong tiếng Việt.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: Một thầy tế lễ sẽ lấy ... một nắm đầy
  rationale: Chủ ngữ số ít được hiểu là một người trong số các thầy tế lễ vừa nhắc đến; “một nắm đầy” bảo tồn ý ‘đầy lòng bàn tay/nắm tay’ tự nhiên hơn cách dịch sát chữ.
- source_word: מִשָּׁם
  choice: từ đó
  rationale: Phản ánh trực tiếp trạng từ chỉ nơi chốn ‘từ đó’, không đổi thành ‘từ lễ vật’.
- source_word: מִסָּלְתָּהּ
  choice: bột mịn
  rationale: סֹלֶת là loại bột tinh/mịn chuyên dùng trong lễ vật; “bột mịn” rõ và tự nhiên.
- source_word: וּמִשַּׁמְנָהּ
  choice: cùng một phần dầu
  rationale: Giới từ מִן cho biết chỉ lấy một lượng dầu thuộc lễ vật, không phải toàn bộ; “một phần” tránh hàm ý định lượng quá cụ thể.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: và toàn bộ nhũ hương
  rationale: Diễn đạt rằng toàn bộ lượng nhũ hương đi cùng phần bột và dầu được lấy để thiêu.
- source_word: וְהִקְטִיר
  choice: thiêu
  rationale: Trong nghi thức tế lễ, Hiphil của קטר chỉ việc đốt lễ vật trên bàn thờ cho bốc khói; “thiêu” trang trọng và rõ nghĩa.
- source_word: אַזְכָּרָתָהּ
  choice: phần kỷ niệm của lễ vật
  rationale: Giữ thuật ngữ tế lễ chỉ phần đại diện được thiêu trước Đức Chúa Trời; thêm “của lễ vật” làm rõ đại từ giống cái trong nguyên văn.
- source_word: אִשֵּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Giữ yếu tố lửa trong thuật ngữ tế lễ, phù hợp động tác thiêu vừa nêu và không buộc nghĩa ‘thức ăn’ vốn còn được tranh luận.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm làm đẹp lòng
  rationale: Diễn đạt thành ngữ tế lễ về mùi hương được Đức Chúa Trời vui nhận bằng tiếng Việt hiện đại, tự nhiên.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh / Đức Chúa Hằng Hữu
  rationale: Dùng dạng danh riêng quen thuộc và minh nhiên trong tiếng Việt, thay vì thay thế danh ấy bằng một tước hiệu; vẫn nhận biết Yahweh là cách phục nguyên gần hơn theo nghiên cứu hiện đại.
- issue: Cách hiểu אִשֵּׁה
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật làm thức ăn
  rationale: Từ này là thuật ngữ tế lễ khó xác định hoàn toàn; bản dịch chính giữ liên hệ rõ với lửa, còn chú thích ghi nhận cách hiểu theo hình ảnh thức ăn mà không giải quyết dứt khoát sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được tách hợp lý để tránh chuỗi liên từ nặng nề; thuật ngữ nghi lễ được giữ nhất quán. Dấu chú thích [a] xuất hiện ngay sau cụm từ cần chú giải.
