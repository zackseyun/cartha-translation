source:
  edition: WLC
  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: vi
  text: Ngươi phải đem lễ vật ngũ cốc được làm từ những thứ ấy đến cho Yahweh[a], và người ấy phải trình nó cho thầy tế lễ; thầy tế lễ sẽ đem nó đến bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho Yahweh.” Giới từ Hê-bơ-rơ có thể diễn tả sự hiến dâng cũng như hướng chuyển động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Ngươi phải đem
  rationale: Dạng Hiphil với liên từ trong văn luật mang ý nghĩa chỉ thị. “Phải đem” diễn đạt mệnh lệnh tự nhiên trong tiếng Việt, còn “ngươi” giữ ngôi thứ hai số ít.
- source_word: הַמִּנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong Lê-vi Ký 2, מִנְחָה chỉ lễ vật chế biến từ ngũ cốc, không phải lễ vật nói chung.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: được làm từ những thứ ấy
  rationale: Dạng Niphal của עשה có nghĩa bị động; cách dịch này giữ đại từ chỉ định mà không xác định quá mức các thành phần hoặc hình thức đã nêu.
- source_word: לַיהוָה
  choice: đến dâng cho Yahweh
  rationale: Giới từ ל có thể chỉ hướng đến hoặc sự hiến dâng. Cụm tiếng Việt này diễn đạt tự nhiên cả chuyển động nghi lễ lẫn sự dành lễ vật cho Yahweh.
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: rồi mang nó đến cho thầy tế lễ
  rationale: Hiphil của קרב là đem lại gần hoặc trình đến. Ở đây chủ ngữ hợp cú pháp nhất vẫn là người dâng lễ; sự chuyển chủ ngữ sang thầy tế lễ chỉ xảy ra ở động từ kế tiếp.
- source_word: וְהִגִּישָׁהּ
  choice: thầy tế lễ sẽ đem nó lại gần
  rationale: Hiphil của נגשׁ diễn tả việc đem vật lễ đến sát nơi hành lễ. Nêu rõ “thầy tế lễ” để phản ánh chủ ngữ số ít hàm ẩn sau khi thầy tế lễ vừa được nhắc tới và để tránh mơ hồ không tự nhiên trong tiếng Việt.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Đây là thuật ngữ thông dụng, rõ nghĩa cho מזבח trong bối cảnh tế lễ; “lại gần bàn thờ” giữ hướng của אֶל.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ ghi trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của ל trong לַיהוָה
  choice: đến dâng cho Yahweh
  alternative: cho Yahweh
  rationale: Giới từ có thể biểu thị cả hướng đến lẫn sự dành riêng. Cách dịch chính kết hợp hai sắc thái, còn chú thích bảo tồn khả năng dịch gọn theo nghĩa hiến dâng.
- issue: Chủ ngữ của וְהִקְרִיבָהּ
  choice: người dâng lễ mang lễ vật đến cho thầy tế lễ
  alternative: thầy tế lễ trình lễ vật cho thầy tế lễ
  rationale: Động từ ở ngôi thứ ba số ít, nhưng danh từ “thầy tế lễ” đứng sau אֶל là đích đến chứ không phải chủ ngữ tự nhiên. Vì vậy chủ ngữ hàm ẩn hợp lý là người dâng lễ; ở mệnh đề kế tiếp, thầy tế lễ trở thành chủ ngữ hàm ẩn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “ngươi” để giữ lời chỉ dẫn ở ngôi thứ hai số ít; dùng “thầy tế lễ” là cách gọi hiện đại, phổ thông. Câu được phân nhịp bằng dấu chấm phẩy để làm rõ sự chuyển từ người dâng lễ sang thầy tế lễ.
