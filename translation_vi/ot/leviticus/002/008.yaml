revisions:
- from: Ngươi phải đem lễ vật ngũ cốc được làm từ những thứ ấy đến dâng cho Yahweh[a], rồi mang nó đến cho thầy tế lễ; thầy tế lễ sẽ đem nó lại gần bàn thờ.
  to: Ngươi phải đem lễ vật ngũ cốc được làm từ những thứ ấy đến cho Yahweh[a], và người ấy phải trình nó cho thầy tế lễ; thầy tế lễ sẽ đem nó đến bàn thờ.
  rationale: Sửa “đến dâng cho” thành “đến cho” để không thêm một động từ nghi lễ vào בוא, sửa “lại gần bàn thờ” thành “đến bàn thờ” để phản ánh אֶל, và nêu “người ấy” để làm sáng tỏ chủ ngữ ngôi thứ ba của mệnh đề trình lễ vật. Chú thích được giữ nguyên vì bảo tồn khả năng hiểu giới từ ל־ theo nghĩa hiến dâng.
  reviewer_model: gpt-5.6-terra
