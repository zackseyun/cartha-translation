id: LEV.2.11
reference: Leviticus 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: vi
  text: Mọi lễ vật ngũ cốc mà anh em dâng lên Yahweh không được có men, vì anh em không được thiêu bất cứ men hay mật nào[a] làm lễ vật dâng bằng lửa cho Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mật” trong cách dùng thời xưa có thể bao gồm si-rô trái cây, chứ không chỉ mật ong.
    reason: cultural_note
  - marker: b
    text: 'Hoặc: “lễ vật thiêu dâng”. Từ Hê-bơ-rơ chỉ lễ vật được dâng trên bàn thờ bằng cách đốt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong Lê-vi Ký 2, từ này chỉ loại lễ vật làm từ bột hoặc ngũ cốc, không phải lễ vật nói chung.
- source_word: תַּקְרִיבוּ
  choice: anh em dâng lên
  rationale: Dạng Hiphil của קרב trong bối cảnh tế lễ mang nghĩa đem đến trình dâng; cách dịch này tự nhiên và giữ sắc thái hướng về Đức Chúa Trời.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Dùng danh riêng giao ước cho יהוה; giới từ được diễn đạt tự nhiên cùng động từ 'dâng lên'.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: không được làm có men
  rationale: Diễn đạt tình trạng lễ vật không được chế biến thành có men, đồng thời tránh thu hẹp nghĩa vào men thương mại hiện đại.
- source_word: שְׂאֹר
  choice: men
  rationale: Chỉ chất gây lên men; 'men' là cách gọi rộng, quen thuộc và thích hợp trong ngữ cảnh nghi lễ.
- source_word: דְּבַשׁ
  choice: mật
  rationale: Giữ nghĩa rộng có thể bao gồm mật ong và si-rô trái cây trong cách dùng cổ; chú thích làm rõ phạm vi.
- source_word: תַקְטִירוּ
  choice: thiêu
  rationale: Động từ trong nghi lễ chỉ việc đốt trên bàn thờ để khói bay lên; 'thiêu' thể hiện hành động tế lễ rõ hơn từ chung chung 'đốt'.
- source_word: מִמֶּנּוּ
  choice: bất cứ ... nào
  rationale: Đại từ số ít có thể quy chiếu về lễ vật nói chung; tiếng Việt diễn đạt tự nhiên bằng lệnh cấm không thiêu bất cứ phần/chất nào thuộc các thứ vừa nêu.
- source_word: אִשֶּׁה
  choice: lễ vật dùng lửa
  rationale: Giữ rõ đây là thuật ngữ tế lễ chỉ vật được dâng bằng cách đốt, không áp đặt cách hiểu 'thức ăn' vốn không hiển nhiên đối với độc giả Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Giữ đây là danh riêng giao ước thay vì thay bằng tước hiệu 'CHÚA'; dạng 'Đức Giê-hô-va' quen thuộc và trang trọng trong tiếng Việt, còn cách phát âm nguyên thủy không hoàn toàn chắc chắn.
- issue: Thuật ngữ nghi lễ אִשֶּׁה
  choice: lễ vật dùng lửa
  alternative: lễ vật thiêu dâng
  rationale: Cách dịch chính giữ phạm trù nghi lễ và mối liên hệ với lửa, không giải quyết quá mức sắc thái từ nguyên hoặc hình ảnh 'thức ăn' của lễ vật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng 'anh em' cho ngôi thứ hai số nhiều; giữ cấu trúc cấm đoán và lý do giải thích của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
