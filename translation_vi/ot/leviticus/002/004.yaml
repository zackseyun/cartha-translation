language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: vi
  text: 'Nếu người nào dâng một lễ phẩm ngũ cốc nướng trong lò, thì lễ phẩm ấy phải làm bằng bột mịn: bánh không men trộn với dầu, hoặc[a] bánh mỏng không men phết dầu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “và bánh mỏng không men.” Liên từ Hê-bơ-rơ là “và”, nhưng ở đây có lẽ dùng để liệt kê một dạng khác của lễ phẩm ngũ cốc nướng trong lò.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện trong chuỗi quy định; tiếng Việt không cần dịch riêng liên từ וְ để giữ mạch văn tự nhiên.
- source_word: תַקְרִב קָרְבַּן
  choice: con dâng một lễ vật
  rationale: Hiphil của קרב chỉ việc đem đến để trình dâng; “dâng” diễn đạt tự nhiên hành động nghi lễ, còn “lễ vật” thể hiện danh từ קָרְבָּן mà không lặp từ vụng về.
- source_word: מִנְחָה
  choice: lễ phẩm ngũ cốc
  rationale: Trong Lê-vi Ký 2, từ này chỉ loại lễ phẩm chế biến từ sản vật ngũ cốc; cách dịch nêu rõ phạm trù nghi lễ và thành phần.
- source_word: מַאֲפֵה תַנּוּר
  choice: được nướng trong lò
  rationale: Diễn đạt tự nhiên phương thức chế biến được cấu trúc danh từ Hê-bơ-rơ chỉ ra.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Chỉ loại bột hảo hạng được xay/rây mịn dùng cho lễ phẩm.
- source_word: חַלּוֹת מַצּוֹת
  choice: bánh không men
  rationale: חַלּוֹת là các bánh tương đối dày hoặc ổ bánh, còn מַצּוֹת xác định chúng không có men.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: trộn dầu
  rationale: Phân từ bị động của בלל nói dầu được trộn vào bánh hoặc nguyên liệu làm bánh.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: hoặc[a] bánh mỏng không men
  rationale: רְקִיקִים là loại bánh mỏng; “hoặc” làm rõ đây nhiều khả năng là hình thức thay thế, đồng thời chú thích bảo lưu nghĩa đen của liên từ.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: phết dầu
  rationale: Trong ngữ cảnh thực phẩm nghi lễ, משׁח mô tả việc bôi/phết dầu lên bề mặt; “phết” rõ và tự nhiên hơn “xức” mà không gợi thêm ý niệm tấn phong.
theological_decisions:
- issue: Nghĩa của מִנְחָה trong ngữ cảnh tế lễ
  choice: lễ phẩm ngũ cốc
  alternative: lễ vật; lễ phẩm triều cống
  rationale: Dù từ này có thể chỉ quà biếu hay cống phẩm ở nơi khác, ngữ cảnh Lê-vi Ký 2 xác định một loại lễ phẩm làm từ bột và dầu; cách dịch này giữ tính đặc thù nghi lễ mà không thêm ý nghĩa hệ phái.
- issue: Quan hệ giữa hai dạng bánh
  choice: hoặc
  alternative: và
  rationale: Hai cụm bánh dường như nêu hai dạng khác nhau của lễ phẩm nướng lò. Bản văn Hê-bơ-rơ dùng liên từ וְ (“và”), nên chú thích ghi rõ khả năng dịch sát để bảo tồn sự nhập nhằng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” phù hợp lời Đức Chúa Trời phán với Môi-se về người dâng lễ trong ngữ cảnh gần; tránh lặp cứng “dâng một lễ vật của lễ phẩm”. “Phết dầu” ưu tiên nghĩa cụ thể trong chế biến thức ăn hơn thuật ngữ thần học “xức dầu”.
