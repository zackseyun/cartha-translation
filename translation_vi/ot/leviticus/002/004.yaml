  to: 'Nếu người nào dâng một lễ phẩm ngũ cốc nướng trong lò, thì lễ phẩm ấy phải làm bằng bột mịn: bánh không men trộn với dầu, hoặc[a] bánh mỏng không men phết dầu.'
  rationale: Đã thay “con” bằng “người nào” để giữ tính tổng quát của ngôi thứ hai trong văn bản quy định mà không thêm sắc thái quan hệ. Đã giản lược cụm chỉ loại lễ vật và điều chỉnh nhẹ cách nói về dầu cho tự nhiên, đồng thời giữ chú thích bảo lưu liên từ Hê-bơ-rơ.
