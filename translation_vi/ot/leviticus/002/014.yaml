id: LEV.2.14
reference: Leviticus 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: vi
  text: Nếu con dâng lên Yahweh một lễ vật đầu mùa, thì con phải dâng lễ vật đầu mùa của mình là lúa non rang trên lửa, hạt lúa non được giã vỡ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bông ngũ cốc non rang trên lửa, ngũ cốc của vụ mới được đập vỡ.”'
    reason: אָבִיב, גֶּרֶשׂ và כַּרְמֶל là các từ nông nghiệp hiếm; cách xác định chính xác dạng ngũ cốc và mức độ chế biến vẫn có thể khác nhau.
lexical_decisions:
- source_word: מִנְחַת
  choice: lễ vật
  rationale: Trong Lê-vi 2, מִנְחָה là thuật ngữ tế tự chỉ lễ vật bằng ngũ cốc. “Lễ vật” giữ được nghĩa nghi lễ, còn chất liệu được phần sau của câu xác định.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: đầu mùa
  rationale: Chỉ sản vật chín sớm nhất được dâng cho Đức Chúa Trời; “đầu mùa” là cách nói tự nhiên và quen thuộc trong tiếng Việt.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng phiên âm “Yahweh”; giới từ “lên” phù hợp với động từ “dâng” trong tiếng Việt.
- source_word: אָבִיב
  choice: những bông lúa non
  rationale: אָבִיב chỉ ngũ cốc còn tươi/non ở giai đoạn đã trổ bông; cách dịch này giữ hình ảnh nông nghiệp mà không dùng lối nói cổ.
- source_word: קָלוּי בָּאֵשׁ
  choice: rang trong lửa
  rationale: Diễn tả trực tiếp phương thức chế biến bằng lửa; “rang” tự nhiên đối với hạt ngũ cốc trong tiếng Việt.
- source_word: גֶּרֶשׂ
  choice: hạt ... được giã vỡ
  rationale: Danh từ chỉ ngũ cốc đã bị đập, nghiền hoặc làm vỡ; “giã vỡ” cụ thể, dễ hiểu và không hàm ý nghiền thành bột mịn.
- source_word: כַּרְמֶל
  choice: của vụ mới
  rationale: Trong ngữ cảnh này, כַּרְמֶל nói đến ngũ cốc tươi hoặc sản vật mới, không phải địa danh; “vụ mới” chuyển tải rõ ý mùa màng.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: dâng ... phải dâng
  rationale: Giữ sự lặp lại của động từ Hiphil קרב và sắc thái đem lễ vật đến trình trước Yahweh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Quan hệ giữa אָבִיב và גֶּרֶשׂ כַּרְמֶל
  choice: Hai cụm đồng vị mô tả hình thức của lễ vật đầu mùa
  alternative: Hai thành phần lễ vật tách biệt
  rationale: 'Cú pháp có thể được hiểu là chuỗi mô tả: bông lúa non rang trong lửa, tức hạt vụ mới được giã vỡ. Từ “tức” giúp tiếng Việt rõ hơn nhưng không biến chúng thành hai lễ vật riêng.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “con” theo lời chỉ dẫn nghi lễ ở ngôi thứ hai số ít. Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
