  yaml_path: translation/ot/leviticus/002/015.yaml
  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: vi
  text: Hãy cho dầu lên đó[a] và đặt nhũ hương trên đó; đó là lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đặt dầu lên đó ... và để nhũ hương trên đó.” Các động từ Hê-bơ-rơ là những từ thông dụng, có thể chỉ việc cho, đặt hoặc để các thành phần lên lễ vật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Con hãy đổ
  rationale: נתן có nghĩa rộng là “trao, đặt, cho”; với dầu trong chỉ dẫn nghi lễ này, “đổ” là cách diễn đạt tự nhiên trong tiếng Việt, đồng thời cấu trúc “hãy” truyền đạt lực mệnh lệnh của chuỗi động từ.
- source_word: עָלֶיהָ
  choice: lên đó / trên đó
  rationale: Giới từ על cùng hậu tố giống cái số ít chỉ việc đặt các thành phần lên lễ vật vừa được nói đến; “đó” tự nhiên hơn “nó” khi quy chiếu đến vật phẩm.
- source_word: שֶׁמֶן
  choice: dầu
  rationale: Từ Hê-bơ-rơ chỉ “dầu”; dù trong bối cảnh tế lễ có thể là dầu ô-liu, câu này không nêu rõ nên không bổ sung “ô-liu”.
- source_word: וְשַׂמְתָּ
  choice: và đặt
  rationale: שׂים thường có nghĩa “đặt, để”; “đặt” diễn tả hành động có chủ ý và phân biệt tự nhiên với động từ dùng cho dầu.
- source_word: לְבֹנָה
  choice: nhũ hương
  rationale: לְבֹנָה chỉ cụ thể frankincense; “nhũ hương” chính xác hơn từ khái quát “hương”.
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong luật tế lễ của Lê-vi Ký, מִנְחָה là lễ vật làm từ sản vật ngũ cốc, không chỉ là lễ vật nói chung. Cách gọi này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: הִוא
  choice: ấy là
  rationale: Đại từ giống cái số ít xác định vật vừa mô tả là một lễ vật ngũ cốc; “ấy là” giữ sắc thái xác nhận ngắn gọn của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng dễ hiểu. Dùng “con hãy” để diễn đạt lời truyền trực tiếp ở số ít; tránh thêm “dầu ô-liu” vì nguyên văn chỉ nói “dầu”.
