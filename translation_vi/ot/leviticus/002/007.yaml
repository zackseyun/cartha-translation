revisions:
- from: Còn nếu lễ vật ngũ cốc ngươi dâng là loại làm trong chảo[a], thì lễ vật ấy phải được làm bằng bột mịn với dầu.
  to: Còn nếu lễ vật ngũ cốc của ngươi được làm trong chảo[a], thì lễ vật ấy phải được làm bằng bột mịn với dầu.
  rationale: Sửa câu để chuyển trực tiếp hậu tố sở hữu sang “của ngươi”, loại bỏ cách diễn đạt thừa, nhưng vẫn duy trì mạch “Còn nếu”, ý chế biến trong dụng cụ, và mệnh lệnh bị động. Chú thích được mở rộng để phản ánh các phương án từ vựng trong hồ sơ tiếng Anh mà không giải quyết võ đoán nghĩa của מַרְחֶשֶׁת.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:07Z'
