base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/007.yaml
  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
translation:
  language: vi
  text: Còn nếu lễ vật ngũ cốc của ngươi được làm trong chảo[a], thì lễ vật ấy phải được làm bằng bột mịn với dầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chảo hoặc vỉ phẳng”, “chảo sâu” hoặc “dụng cụ nấu”; không rõ từ Hê-bơ-rơ này chỉ chính xác loại dụng cụ nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Còn nếu
  rationale: Diễn tả cả liên từ nối tiếp lẫn điều kiện, giữ được mạch liệt kê các trường hợp trong luật tế lễ.
- source_word: מִנְחַת
  choice: lễ vật ngũ cốc
  rationale: Trong Lê-vi Ký 2, từ này chỉ lễ vật chế biến từ ngũ cốc, không phải lễ vật nói chung.
- source_word: מַרְחֶשֶׁת
  choice: chảo
  rationale: Chỉ một dụng cụ nấu, nhưng hình dạng chính xác không chắc chắn; “chảo” tự nhiên và không xác định quá mức.
- source_word: קָרְבָּנֶךָ
  choice: lễ vật ngươi dâng
  rationale: Truyền đạt danh từ chỉ vật được đem đến dâng cùng hậu tố sở hữu ngôi thứ hai; cách diễn đạt bằng động từ tự nhiên hơn trong tiếng Việt.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Chỉ loại bột hảo hạng, xay mịn dùng trong nghi lễ; không thêm loại ngũ cốc mà nguyên văn không nêu.
- source_word: בַּשֶּׁמֶן
  choice: với dầu
  rationale: Giữ ý dầu là nguyên liệu đi kèm mà không diễn giải cụ thể rằng bột phải được trộn hoặc chiên trong dầu.
- source_word: תֵּעָשֶׂה
  choice: phải được làm
  rationale: Giữ thể bị động và sắc thái quy định của động từ Niphal.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” giữ ngôi thứ hai số ít của nguyên văn và sắc thái chỉ dẫn trực tiếp; câu được sắp xếp tự nhiên trong tiếng Việt mà vẫn giữ cấu trúc điều kiện và thể bị động.
