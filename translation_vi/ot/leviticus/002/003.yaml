base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: vi
  text: Phần còn lại của lễ vật ngũ cốc sẽ thuộc về A-rôn và các con trai ông; đó là phần chí thánh thuộc các lễ vật dâng bằng lửa của Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thuộc các lễ vật làm thức ăn của Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Phần còn lại
  rationale: Dạng phân từ có mạo từ được dùng như danh từ, chỉ phần lễ vật còn dư; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מִן הַמִּנְחָה
  choice: của lễ vật ngũ cốc
  rationale: Trong Lê-vi Ký 2, מִנְחָה chỉ loại lễ vật làm từ ngũ cốc, chứ không đơn thuần là một quà tặng nói chung.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: sẽ thuộc về A-rôn và các con trai ông
  rationale: Giới từ לְ ở đây biểu thị sự phân chia hoặc quyền sở hữu; “thuộc về” diễn đạt rõ phần dành cho các thầy tế lễ.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: phần chí thánh
  rationale: Cấu trúc này biểu thị mức độ thánh cao nhất trong hệ thống tế lễ. Thêm “phần” làm rõ cụm từ đang nói về phần lễ vật còn lại, đồng thời tránh khiến người đọc hiểu đây là tên một địa điểm.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: trong số các lễ vật dâng bằng lửa lên Yahweh
  rationale: אִשֶּׁה là thuật ngữ tế lễ có liên hệ trực tiếp với lửa và cũng có thể được hiểu theo chức năng là lễ vật làm thức ăn dâng cho Đức Chúa Trời. Bản chính giữ sắc thái về lửa; khả năng dịch theo nghĩa “lễ vật làm thức ăn” được ghi ở chú thích. מִן được diễn đạt là “trong số” để chỉ sự thuộc về loại lễ vật này.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng chuyển tự tên riêng của Đức Chúa Trời trong tiếng Hê-bơ-rơ thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách diễn đạt cấp độ thánh của קֹדֶשׁ קָדָשִׁים
  choice: phần chí thánh
  alternative: rất thánh; thánh của các sự thánh
  rationale: “Phần chí thánh” giữ được ý nghĩa phân loại tế lễ ở cấp cao nhất, đồng thời không khiến người đọc liên tưởng sai đến nơi Chí Thánh trong đền thờ.
- issue: Cách hiểu thuật ngữ tế lễ אִשֵּׁי יְהוָה
  choice: các lễ vật dâng bằng lửa lên Yahweh
  alternative: các lễ vật làm thức ăn dâng lên Yahweh
  rationale: Từ Hê-bơ-rơ có thể nhấn mạnh việc lễ vật được dâng bằng lửa hoặc dùng như một thuật ngữ chỉ lễ vật làm thức ăn dâng cho Đức Chúa Trời. Bản chính giữ hình ảnh về lửa, còn chú thích bảo lưu cách hiểu chức năng.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu, dùng thuật ngữ “lễ vật ngũ cốc” thay cho cách gọi cổ hoặc quá chuyên môn. Tên A-rôn được viết theo dạng quen thuộc trong tiếng Việt; Yahweh được giữ như tên riêng.
