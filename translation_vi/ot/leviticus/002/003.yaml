revisions:
- from: Phần còn lại của lễ vật ngũ cốc sẽ thuộc về A-rôn và các con trai ông. Đó là phần chí thánh trong số các lễ vật dâng bằng lửa lên Yahweh.[a]
  to: Phần còn lại của lễ vật ngũ cốc sẽ thuộc về A-rôn và các con trai ông; đó là phần chí thánh thuộc các lễ vật dâng bằng lửa của Yahweh.[a]
  rationale: Bản sửa giữ nguyên ý nghĩa và các thuật ngữ chính của bản nháp, nhưng điều chỉnh cách diễn đạt מֵאִשֵּׁי יְהוָה để phản ánh sát hơn quan hệ phân loại/sở thuộc trong tiếng Hê-bơ-rơ. Chú thích bảo lưu cách hiểu «lễ vật làm thức ăn» mà không quyết định vượt quá điều văn.
  reviewer_model: gpt-5.6-terra
