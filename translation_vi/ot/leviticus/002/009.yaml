source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: vi
  text: 'Rồi thầy tế lễ sẽ lấy từ lễ vật ngũ cốc phần tưởng niệm của lễ vật ấy và thiêu thành khói trên bàn thờ: một lễ vật dâng bằng lửa, một hương thơm đẹp lòng Đức Giê-hô-va.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thức ăn dâng lên”. Từ אִשֶּׁה thường chỉ lễ vật dâng bằng lửa, nhưng một số học giả liên hệ từ này với nghĩa “thức ăn dâng”.
    reason: Giữ lại cách hiểu từ vựng thay thế của אִשֶּׁה mà không đưa một cách hiểu còn bàn luận vào bản văn chính.
lexical_decisions:
- source_word: וְהֵרִים
  choice: sẽ lấy
  rationale: Trong nghi thức này, dạng Hiphil của רום chỉ việc thầy tế lễ lấy riêng một phần từ lễ vật. “Sẽ lấy” tự nhiên trong tiếng Việt và diễn đạt đúng hành động tách phần ấy ra, không buộc người đọc hình dung một động tác nâng cao.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, quen thuộc trong tiếng Việt hiện đại đối với người thi hành chức vụ tế lễ.
- source_word: מִן הַמִּנְחָה
  choice: từ lễ vật ngũ cốc
  rationale: Trong Lê-vi Ký 2, מִנְחָה là lễ vật chế biến từ ngũ cốc; cách dịch này cụ thể hơn “lễ vật” nói chung.
- source_word: אַזְכָּרָתָהּ
  choice: phần tưởng niệm của lễ vật ấy
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ phần đại diện được thiêu trên bàn thờ. Thêm “phần” làm rõ không phải toàn bộ lễ vật, còn “tưởng niệm” giữ mối liên hệ với nghĩa gốc זכר mà không giải thích quá mức chức năng thần học.
- source_word: וְהִקְטִיר
  choice: thiêu thành khói
  rationale: Dạng Hiphil của קטר trong văn cảnh hiến tế nhấn mạnh việc đốt cho bốc khói trên bàn thờ; “thiêu thành khói” chính xác hơn chỉ nói “đốt” và vẫn tự nhiên.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Đuôi chỉ hướng trong thành ngữ Hê-bơ-rơ này được chuyển sang cách nói vị trí tự nhiên của tiếng Việt.
- source_word: אִשֵּׁה
  choice: lễ vật dùng lửa dâng lên
  rationale: Giữ nét nghĩa chắc chắn là lễ vật được dâng bằng lửa, đồng thời tránh khẳng định dứt khoát nghĩa từ nguyên còn được bàn luận là “thức ăn dâng”.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm làm … vui lòng
  rationale: Cụm tế lễ cố định vừa giữ hình ảnh mùi hương vừa diễn đạt sắc thái được Đức Chúa Trời chấp nhận; cách nói này tự nhiên và trang trọng trong tiếng Việt.
- source_word: לַיהוָה
  choice: làm Đức Giê-hô-va vui lòng
  rationale: Giữ danh riêng יהוה thay vì thay bằng một tước hiệu; cấu trúc với ל được diễn đạt tự nhiên trong toàn cụm “hương thơm làm … vui lòng”.
theological_decisions:
- issue: Ý nghĩa và cấu trúc của אִשֵּׁה רֵיחַ נִיחֹחַ
  choice: Đó là lễ vật dùng lửa dâng lên, có hương thơm làm Đức Giê-hô-va vui lòng
  alternative: Đó là thức ăn dâng lên, một hương thơm làm Đức Giê-hô-va vui lòng
  rationale: Bản chính ưu tiên nghĩa nghi lễ rõ nhất của אִשֵּׁה là lễ vật được dâng bằng lửa và giữ nguyên hình ảnh nhân hình về mùi hương làm Đức Giê-hô-va vui lòng. Chú thích bảo tồn khả năng אִשֵּׁה liên hệ với ý niệm “thức ăn dâng” trong ngôn ngữ tế lễ, nhưng không đưa cách hiểu còn tranh luận ấy vào bản chính.
- issue: Cách thể hiện יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA
  rationale: Văn bản Hê-bơ-rơ dùng danh riêng יהוה. “Đức Giê-hô-va” giúp độc giả tiếng Việt nhận ra đây là danh riêng, thay vì âm thầm thay thế bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được chia làm hai để công thức tế lễ rõ ràng hơn. Các thuật ngữ “lễ vật ngũ cốc”, “phần tưởng niệm” và “bàn thờ” được dùng nhất quán theo ngữ cảnh nghi lễ; không thêm diễn giải giáo phái.
