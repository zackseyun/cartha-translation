  terminology: “Thầy tế lễ,” “lễ vật ngũ cốc,” “phần tưởng niệm,” “thiêu thành khói,” và “bàn thờ” đều phù hợp ngữ cảnh nghi lễ. Giữ “Đức Giê-hô-va” nhất quán với lựa chọn danh riêng trong bản thảo. Chú thích về khả năng hiểu אִשֶּׁה là “thức ăn dâng” là hữu ích, nhưng nên nêu đây là cách hiểu thay thế của thuật ngữ, không phải một nghĩa chắc chắn.
