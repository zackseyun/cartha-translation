  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính: thầy tế lễ lấy một phần từ lễ vật ngũ cốc, thiêu phần ấy trên bàn thờ, và công thức tế lễ hướng về יהוה. Tuy nhiên, cụm “lễ vật dùng lửa dâng lên” không phản ánh tự nhiên quan hệ của אִשֶּׁה và dễ được hiểu là lễ vật dùng lửa để dâng, thay vì lễ vật được dâng bằng lửa.'
