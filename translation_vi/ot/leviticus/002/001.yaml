- from: Khi một người dâng lễ vật ngũ cốc lên Yahweh[a], lễ vật của người ấy phải làm bằng bột mịn[b]. Người ấy phải đổ dầu lên trên và đặt nhũ hương trên đó.
  to: Khi một người dâng một lễ vật bằng ngũ cốc lên Yahweh[a], lễ vật của người ấy phải là bột mịn[b]. Người ấy phải đổ dầu lên lễ vật ấy và đặt nhũ hương lên đó.
  rationale: Bản sửa làm rõ rằng dầu và nhũ hương đều được đặt trên lễ vật, đồng thời thay một kết hợp từ ít tự nhiên bằng cách diễn đạt tiếng Việt hiện đại hơn. Không thay đổi nội dung, lực chỉ thị, số ít đại diện, hay các thuật ngữ tế lễ của nguyên văn.
