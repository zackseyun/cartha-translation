id: LEV.2.1
reference: Leviticus 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: vi
  text: Khi một người dâng một lễ vật bằng ngũ cốc lên Yahweh[a], lễ vật của người ấy phải là bột mịn[b]. Người ấy phải đổ dầu lên lễ vật ấy và đặt nhũ hương lên đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là tên riêng của Đức Chúa Trời trong tiếng Hê-bơ-rơ, được viết bằng bốn phụ âm יהוה (YHWH).
    reason: divine_name
  - marker: b
    text: “Lễ vật bằng ngũ cốc” dịch từ מִנְחָה; trong câu này, lễ vật ấy phải là bột mịn (סֹלֶת).
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Danh từ này có nghĩa gốc là “sinh mạng/người sống”, nhưng trong văn luật lệ ở đây chỉ một cá nhân; “một người” tự nhiên và không gợi thêm ý niệm siêu hình.
- source_word: תַקְרִיב
  choice: dâng
  rationale: Dạng Hiphil của קרב diễn tả việc đem đến gần để làm lễ vật; “dâng” truyền đạt rõ hành động thờ phượng trong tiếng Việt.
- source_word: קָרְבַּן מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: קָרְבַּן là vật được đem dâng, còn מִנְחָה trong ngữ cảnh tế lễ Lê-vi chỉ loại lễ vật từ sản phẩm ngũ cốc; cách dịch này vừa rõ loại lễ vừa tránh thuật ngữ giáo phái.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ tên giao ước יהוה dưới dạng “Yahweh”; giới từ ל được diễn đạt tự nhiên bằng “lên” sau động từ “dâng”.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Chỉ loại bột được xay và sàng kỹ dùng trong tế lễ; bản văn không nêu đích danh loại hạt nên không thêm “mì”.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: Người ấy phải đổ dầu lên trên
  rationale: Chuỗi động từ trong luật lệ mang lực chỉ thị; “phải” thể hiện nghĩa bắt buộc, còn “lên trên” giữ quan hệ của עַל.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: và đặt nhũ hương trên đó
  rationale: לְבֹנָה là nhựa thơm frankincense dùng trong nghi lễ; “nhũ hương” là tên gọi tiếng Việt chính xác và trang trọng.
theological_decisions:
- issue: Cách chuyển tên riêng יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản văn dùng trực tiếp Tên Bốn Chữ; phiên âm “Yahweh” bảo tồn chức năng tên riêng thay vì thay bằng một tước hiệu.
- issue: Số ít đại diện và giới tính trong chỉ dẫn luật lệ
  choice: một người … người ấy
  alternative: ai … họ
  rationale: Tiếng Hê-bơ-rơ dùng số ít và các dạng ngữ pháp giống đực theo lối đại diện. “Người ấy” giữ số ít nhưng không gán giới tính không cần thiết trong tiếng Việt, vốn không bắt buộc đánh dấu giống ở đại từ này.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng câu ngắn và từ ngữ phổ thông. “Nhũ hương” được giữ vì là thuật ngữ chính xác cho loại nhựa thơm dùng trong thờ phượng; tránh cách gọi truyền thống “của lễ chay” vì ngày nay dễ bị hiểu là thức ăn không có thịt.
