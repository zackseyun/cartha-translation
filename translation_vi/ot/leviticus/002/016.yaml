  text: וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ֗/הּ מִ/גִּרְשָׂ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ אִשֶּׁ֖ה לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: vi
  text: Thầy tế lễ phải thiêu phần tưởng niệm, lấy một phần từ hạt giã vỡ và một phần từ dầu của lễ vật, cùng với toàn bộ nhũ hương của lễ vật—đó là lễ vật được dâng bằng lửa lên Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: phải thiêu
  rationale: Trong ngữ cảnh tế lễ, dạng Hiphil của קטר chỉ việc thiêu lễ vật trên bàn thờ để khói bay lên. “Phải thiêu” tự nhiên và phù hợp với sắc thái quy định.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, thông dụng trong tiếng Việt đối với chức vụ tư tế trong luật tế lễ.
- source_word: אַזְכָּרָתָהּ
  choice: phần tưởng niệm của lễ ấy
  rationale: Đây là thuật ngữ chỉ phần đại diện của lễ vật ngũ cốc được thiêu trên bàn thờ. “Phần tưởng niệm” giữ được ý nghĩa nghi lễ mà không giải thích quá mức đối tượng của sự tưởng nhớ.
- source_word: מִגִּרְשָׂהּ
  choice: từ ngũ cốc giã vỡ
  rationale: גרש chỉ hạt đã được giã hoặc nghiền thô. “Ngũ cốc giã vỡ” dễ hiểu và giữ được đặc điểm chế biến của nguyên liệu.
- source_word: וּמִשַּׁמְנָהּ
  choice: và dầu
  rationale: Giới từ מן cho biết phần tưởng niệm được lấy từ ngũ cốc và dầu của lễ vật; tiếng Việt có thể lược việc lặp lại “lấy từ” mà vẫn rõ nghĩa.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: cùng với toàn bộ nhũ hương
  rationale: 'Trong chỉ dẫn tế lễ này, עַל diễn tả sự đi kèm: phần tưởng niệm được thiêu cùng toàn bộ nhũ hương.'
- source_word: אִשֶּׁה
  choice: lễ vật được dâng bằng lửa
  rationale: Cách dịch này giữ ý nghĩa tế lễ của אשה, đồng thời tự nhiên và ít gây hiểu lầm hơn cách gọi quá cô đọng “hỏa tế”.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giới từ ל đánh dấu hướng dâng lễ vật; “dâng ... lên Yahweh” tự nhiên trong tiếng Việt và danh Yahweh phản ánh trực tiếp יהוה.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng này với tước hiệu “Chúa” và không du nhập cách phát âm lai “Giê-hô-va”.
- issue: Ý nghĩa của אַזְכָּרָה
  choice: phần tưởng niệm
  alternative: phần nhắc nhớ / lễ vật tưởng niệm
  rationale: Nguyên ngữ không nói rõ ai tưởng nhớ ai hoặc điều gì được nhắc nhớ. “Phần tưởng niệm” bảo toàn độ mở thần học ấy thay vì giải nghĩa thêm.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng câu rõ ràng và thuật ngữ nghi lễ dễ hiểu. Dấu gạch ngang giữ quan hệ đồng vị của אִשֶּׁה với toàn bộ hành động dâng lễ.
