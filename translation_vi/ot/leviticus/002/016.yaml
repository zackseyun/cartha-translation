    text: Cũng có thể dịch là “hạt giã thô” hoặc “hạt nghiền thô”; từ Hê-bơ-rơ chỉ những hạt được giã vỡ để chuẩn bị lễ vật ngũ cốc.
    reason: lexical_alternative
  revision_rationale: Bản sửa nêu rõ phần được lấy từ cả hạt giã vỡ lẫn dầu, phù hợp sự lặp lại của giới từ מן trong nguyên văn. Việc thay “ngũ cốc giã vỡ” bằng “hạt giã vỡ” sát nghĩa hơn trong ngữ cảnh, đồng thời làm rõ rằng dầu và nhũ hương thuộc về lễ vật. Chú thích được điều chỉnh cho khớp chính xác với từ ngữ trong bản văn.
