  rationale: Thay “nướng trên vỉ” bằng “được chế biến trên chảo phẳng” để phản ánh dụng cụ/bề mặt nấu trong nguyên ngữ mà không thêm cách chế biến cụ thể. Các thành phần còn lại của câu được giữ vì chuyển tải đúng yêu cầu nghi lễ của văn bản.
