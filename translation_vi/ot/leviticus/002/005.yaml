base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: vi
  text: Nếu lễ vật ngũ cốc của con được chế biến trên chảo phẳng[a], thì phải làm bằng bột mịn trộn với dầu, không men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trên vỉ nướng phẳng”. Từ Hê-bơ-rơ chỉ một dụng cụ hoặc bề mặt nấu dùng để chế biến lễ vật ngũ cốc này.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong Lê-vi Ký 2, từ này chỉ lễ vật làm từ ngũ cốc hoặc bột, nên cần diễn đạt cụ thể thay vì chỉ nói chung là “lễ vật”.
- source_word: עַל הַמַּחֲבַת
  choice: nướng trên vỉ
  rationale: Cụm từ chỉ việc chế biến trên một bề mặt nấu phẳng; “trên vỉ” tự nhiên trong tiếng Việt, còn động từ “nướng” làm rõ quan hệ với dụng cụ mà không xác định quá mức cấu tạo của nó.
- source_word: קָרְבָּנְךָ
  choice: lễ vật của con
  rationale: Giữ lời xưng hô trực tiếp ở ngôi thứ hai số ít và thể hiện chức năng đồng vị với מִנְחָה.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Chỉ loại bột chất lượng cao, được xay mịn, dùng trong nghi lễ; “bột mịn” rõ ràng và tự nhiên.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn với dầu
  rationale: Diễn đạt đúng việc bột được hòa trộn với dầu mà không xác định quá mức phương pháp như nhào.
- source_word: מַצָּה
  choice: không men
  rationale: Tính từ mô tả tình trạng bắt buộc của lễ vật; “không men” ngắn gọn, dễ hiểu và không biến từ này thành một danh từ riêng chỉ bánh.
- source_word: תִהְיֶה
  choice: thì phải làm
  rationale: Thể hiện lực quy định của thể chưa hoàn thành trong văn mạch luật lệ, đồng thời tạo câu tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng “con” cho lời phán trực tiếp với người Y-sơ-ra-ên. Câu giữ trật tự điều kiện và yêu cầu của nguyên văn, đồng thời tránh thuật ngữ quá cổ.
