  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
translation:
  language: vi
  text: Hãy bẻ nó thành từng miếng[a], rồi đổ dầu lên trên nó; đó là lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chia nó thành từng miếng nhỏ” hoặc “bẻ nó thành những mảnh vụn.” Tiếng Hê-bơ-rơ nhấn mạnh việc bẻ lễ vật thành những phần nhỏ trước khi đổ dầu lên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּת֤וֹת
  choice: Hãy bẻ
  rationale: Dạng nguyên mẫu tuyệt đối của פתת được dùng với lực mệnh lệnh trong chỉ dẫn tế lễ; “hãy bẻ” tự nhiên và diễn đạt đúng hành động.
- source_word: אֹתָ/הּ
  choice: nó
  rationale: Hậu tố ngôi ba giống cái số ít quy chiếu về lễ vật hoặc bánh đã nói trước; tiếng Việt dùng “nó” cho vật vô tri.
- source_word: פִּתִּים
  choice: thành từng miếng
  rationale: Danh từ số nhiều chỉ các phần nhỏ do bẻ ra; cách nói này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: וְ/יָצַקְתָּ
  choice: rồi đổ
  rationale: Động từ ở chuỗi chỉ dẫn mang lực mệnh lệnh và diễn tả bước tiếp theo; “rồi” làm rõ trình tự mà không thêm nội dung.
- source_word: עָלֶ֖י/הָ
  choice: lên trên
  rationale: Giới từ עַל với hậu tố chỉ việc đổ dầu lên bề mặt của lễ vật; “lên trên” là cách diễn đạt thông dụng.
- source_word: שָׁמֶן
  choice: dầu
  rationale: Bản Hê-bơ-rơ chỉ nói “dầu”; không thêm “ô-liu” dù điều đó có thể phù hợp bối cảnh văn hóa.
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong Lê-vi Ký 2, מִנְחָה là lễ vật làm từ sản phẩm ngũ cốc; cách dịch này chính xác theo ngữ cảnh tế lễ.
- source_word: הִוא
  choice: đó là
  rationale: Đại từ độc lập xác định vật vừa được mô tả là một lễ vật ngũ cốc; “đó là” tự nhiên trong tiếng Việt.
