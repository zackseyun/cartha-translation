  source_fidelity: 'Bản nháp phản ánh đúng chuỗi mệnh lệnh của tiếng Hê-bơ-rơ: bẻ lễ vật thành các phần, đổ dầu lên lễ vật, rồi xác định đó là một minḥah. Tuy nhiên, “đổ dầu lên trên” thiếu bổ ngữ chỉ vật được đổ lên; nguyên văn có עָלֶיהָ, “lên nó/lên lễ vật ấy.”'
  naturalness: Cần thêm “nó” sau “lên trên” để câu tiếng Việt hoàn chỉnh và tự nhiên. Đặt ký hiệu chú thích ngay sau “từng miếng” sẽ gắn chú thích từ vựng với cụm được chú giải rõ hơn.
  terminology: “Lễ vật ngũ cốc” là cách dịch hiện đại, chính xác theo ngữ cảnh cho מִנְחָה, không áp đặt thuật ngữ giáo phái. “Dầu” giữ đúng mức khái quát của שָׁמֶן.
  issues:
