    issue: Cụm “đổ dầu lên trên” thiếu đối tượng.
    rationale: Giới từ עַל mang hậu tố giống cái số ít, nghĩa là “lên nó/lên lễ vật ấy.” Bản dịch cần biểu đạt rõ đối tượng này; “lên trên” đứng một mình không hoàn chỉnh trong tiếng Việt.
  - severity: low
    issue: Vị trí ký hiệu chú thích chưa gắn sát cụm từ được chú giải.
    rationale: Chú thích giải thích hành động bẻ thành các phần; đặt [a] sau “từng miếng” làm liên kết minh bạch hơn.
