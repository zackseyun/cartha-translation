id: LEV.2.10
reference: Leviticus 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: vi
  text: Phần còn lại của lễ vật ngũ cốc sẽ thuộc về A-rôn và các con trai ông; đó là phần chí thánh, thuộc các lễ vật dâng bằng lửa cho Đức Giê-hô-va.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đó là phần chí thánh từ các lễ vật thực phẩm của Đức Giê-hô-va.”'
    reason: Thuật ngữ אִשֶּׁה có thể được hiểu theo cách truyền thống là lễ vật dâng bằng lửa hoặc theo chức năng tế tự là lễ vật thực phẩm.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Phần còn lại
  rationale: Dạng phân từ có mạo từ được dùng như danh từ, chỉ phần lễ vật còn lại; cách diễn đạt này tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: מִן הַמִּנְחָה
  choice: của lễ vật ngũ cốc
  rationale: Trong Lê-vi Ký 2, מִנְחָה chỉ loại lễ vật làm từ ngũ cốc, không phải một lễ vật chung chung.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: sẽ thuộc về A-rôn và các con trai ông
  rationale: Giới từ לְ biểu thị sự phân chia hoặc quyền sở hữu; thêm 'sẽ thuộc về' chuyển tải tự nhiên sắc thái quy định của câu.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: phần chí thánh
  rationale: Đây là thành ngữ tăng cấp của tiếng Hê-bơ-rơ, biểu thị mức thánh cao nhất. Từ 'phần' làm rõ cụm từ mô tả phần lễ vật còn lại mà không biến nó thành tên một địa điểm.
- source_word: מֵאִשֵּׁי
  choice: trong các lễ vật dâng bằng lửa
  rationale: אִשֶּׁה là thuật ngữ tế tự chỉ lễ vật được dâng qua lửa. 'Dâng bằng lửa' giữ rõ phương thức tế lễ hơn cách dịch diễn giải là 'lễ vật thực phẩm'.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt để thể hiện trực tiếp Danh יהוה thay vì thay bằng tước hiệu 'Chúa'.
theological_decisions:
- issue: Cách hiểu cụm מֵאִשֵּׁי יְהוָה
  choice: trong các lễ vật dâng bằng lửa lên Đức Giê-hô-va
  alternative: từ các lễ vật thực phẩm của Đức Giê-hô-va
  rationale: Giữ nguyên hình ảnh dâng qua lửa vốn có trong thuật ngữ tế tự, đồng thời không quyết đoán rằng từ này chủ yếu mang nghĩa 'thực phẩm'. Giới từ מִן được diễn đạt là 'trong' vì phần dành cho các thầy tế lễ là một phần thuộc nhóm lễ vật ấy.
- issue: Mức độ minh thị trong קֹדֶשׁ קָדָשִׁים
  choice: đó là phần chí thánh
  alternative: là chí thánh
  rationale: Thêm đại từ và danh từ 'phần' để câu tiếng Việt rõ ràng, nhưng không thêm một khái niệm thần học ngoài việc cụm này quy chiếu đến phần còn lại của lễ vật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'lễ vật ngũ cốc' để phân biệt loại lễ vật trong chương 2; dùng 'chí thánh' cho thành ngữ tăng cấp Hê-bơ-rơ; tên A-rôn theo dạng quen thuộc trong tiếng Việt.
