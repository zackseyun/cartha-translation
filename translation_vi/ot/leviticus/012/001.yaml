  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Và Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; cũng được phiên âm là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức mở đầu lời truyền của Đức Chúa Trời, động từ דבר được dịch tự nhiên và trang trọng là “phán”; liên từ וַ được hàm chứa trong mạch kể tiếng Việt, không cần dịch máy móc là “và” khi câu đứng đầu một đơn vị.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng đã quen thuộc và trang trọng trong tiếng Việt để thể hiện trực tiếp danh YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Sau động từ “phán”, “với” là giới từ tự nhiên trong tiếng Việt để chỉ người tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng phổ biến trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong tiếng Việt hiện đại, “rằng” giới thiệu nội dung lời phán một cách tự nhiên và vẫn bảo toàn chức năng của dạng nguyên mẫu לֵאמֹר.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Bản dịch giữ đây là tên riêng, không thay bằng “CHÚA”; “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc, còn “Yahweh/Gia-vê” phản ánh cách phục nguyên phát âm khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm báo trước nội dung lời phán ở câu kế tiếp. Không thêm chú thích vì bản văn chính đã trực tiếp thể hiện danh riêng và câu này không cần đánh dấu một dị bản văn bản.
