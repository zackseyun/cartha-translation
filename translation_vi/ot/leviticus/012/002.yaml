reference: Leviticus 12:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: vi
  text: '“Hãy nói với con dân Y-sơ-ra-ên rằng: ‘Nếu[a] một người phụ nữ thụ thai và sinh con trai[b], thì người ấy sẽ bị ô uế trong bảy ngày; người ấy sẽ bị ô uế như trong thời kỳ kinh nguyệt của mình[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi một người phụ nữ thụ thai.” Tiểu từ Hê-bơ-rơ mở đầu trường hợp pháp luật có thể mang nghĩa “nếu” hoặc “khi” tùy ngữ cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “sinh một người nam,” tức một bé trai.'
    reason: lexical_alternative
  - marker: c
    text: Đây là tình trạng ô uế theo nghi lễ gắn với kỳ kinh nguyệt, không phải lời kết tội về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Đây là danh xưng tập thể chỉ dân giao ước, không chỉ riêng nam giới. “Con dân Y-sơ-ra-ên” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái thuộc về Y-sơ-ra-ên của cấu trúc Hê-bơ-rơ.
- source_word: אִשָּׁה
  choice: một người phụ nữ
  rationale: Trong điều luật này, từ chỉ một phụ nữ nói chung; không cần thu hẹp thành “người vợ”.
- source_word: כִּי
  choice: nếu
  rationale: Tiểu từ mở đầu một trường hợp pháp luật, nên “nếu” phù hợp; “khi” cũng có thể được hiểu trong ngữ cảnh.
- source_word: תַזְרִיעַ
  choice: thụ thai
  rationale: Dạng Hiphil của זרע có nghĩa đen liên quan đến việc sinh hạt giống, nhưng trong thành ngữ về sinh nở, nghĩa tự nhiên là thụ thai.
- source_word: וְיָלְדָה זָכָר
  choice: và sinh con trai
  rationale: Diễn đạt tự nhiên bằng tiếng Việt, đồng thời giữ rõ việc đứa trẻ thuộc giới tính nam. Nghĩa sát chữ là “sinh một người nam/đứa trẻ giống đực”.
- source_word: וְטָמְאָה ... תִּטְמָא
  choice: sẽ bị ô uế ... sẽ bị ô uế
  rationale: Giữ sự lặp lại rõ ràng của nguyên văn và văn phong quy định pháp luật. “Bị ô uế” ở đây chỉ tình trạng ô uế theo luật nghi lễ, không mặc nhiên hàm ý phạm tội đạo đức.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Chuyển đạt trực tiếp khoảng thời gian được nêu trong nguyên văn.
- source_word: נִדַּת דְּוֺתָהּ
  choice: bị ô uế vì kinh nguyệt
  rationale: Cụm từ nói đến tình trạng ô uế gắn với kỳ kinh và dòng kinh nguyệt. Cách dịch này rõ nghĩa, tự nhiên và giữ đúng bối cảnh luật thanh sạch.
theological_decisions:
- issue: Bản chất của טמא trong luật thanh sạch
  choice: bị ô uế
  alternative: bị ô uế về nghi lễ
  rationale: Nguyên văn chỉ nêu tình trạng ô uế; bối cảnh cho thấy đây là tình trạng theo nghi lễ. Không thêm “về nghi lễ” vào chính văn để tránh diễn giải quá mức, nhưng chú thích làm rõ ý nghĩa văn hóa-pháp luật.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai Y-sơ-ra-ên
  rationale: Đây là công thức dân tộc tập thể, bao gồm cộng đồng Y-sơ-ra-ên nói chung. Dịch sát hình thức là “các con trai” dễ khiến độc giả Việt hiểu sai rằng mệnh lệnh chỉ dành cho nam giới.
- issue: Quan hệ giữa sinh nở và ô uế
  choice: trình bày như một tình trạng theo luật thanh sạch
  alternative: hiểu là sự kết án đạo đức đối với người mẹ
  rationale: Trong ngữ cảnh Lê-vi Ký, ô uế là một phạm trù nghi lễ; câu không nói rằng việc sinh con hay người mẹ là có tội về mặt đạo đức.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; dùng cấu trúc điều luật “Nếu… thì…”. Giữ sự lặp lại của động từ “bị ô uế” trong nguyên văn. Các dấu chú thích [a], [b], [c] đều được đặt trong chính văn ngay sau nội dung liên quan.
