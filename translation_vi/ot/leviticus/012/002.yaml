  rationale: Chỉ chỉnh cụm so sánh cuối câu để tiếng Việt tự nhiên và minh bạch hơn. Bản sửa vẫn giữ sự lặp lại của “sẽ bị ô uế”, thời hạn bảy ngày, và ý nghĩa nghi lễ được giải thích ở chú thích.
