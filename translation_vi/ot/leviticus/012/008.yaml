  to: Nhưng nếu bà không đủ khả năng dâng một con chiên, thì bà phải lấy hai con chim cu hoặc hai con bồ câu non, một con làm lễ thiêu và một con làm lễ chuộc tội[a]. Thầy tế lễ sẽ làm lễ chuộc tội cho bà, và bà sẽ được thanh sạch.
