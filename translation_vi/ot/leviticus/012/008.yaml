  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: vi
  text: Nhưng nếu bà không đủ khả năng dâng một con chiên, thì bà phải lấy hai con chim cu hoặc hai con bồ câu non, một con làm lễ thiêu và một con làm lễ chuộc tội[a]. Thầy tế lễ sẽ làm lễ chuộc tội cho bà, và bà sẽ được thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy”; trong bối cảnh này, lễ vật liên quan đến sự ô uế theo nghi lễ sau khi sinh.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: không đủ khả năng dâng một con chiên
  rationale: Thành ngữ Hê-bơ-rơ nói về phương tiện tài chính. Cách dịch này tự nhiên trong tiếng Việt, đồng thời nêu rõ khả năng đáp ứng lễ vật theo ngữ cảnh.
- source_word: שֶׂה
  choice: một con chiên
  rationale: Trong ngữ cảnh tế lễ và theo lễ vật được quy định ở câu trước, từ này chỉ một con chiên.
- source_word: שְׁתֵּי תֹרִים
  choice: hai con chim gáy
  rationale: תֹרִים chỉ cụ thể loài chim gáy, không phải chim bồ câu nói chung.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: hai con bồ câu non
  rationale: Cụm từ nguyên nghĩa là 'con của bồ câu', một thành ngữ chỉ bồ câu non.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Đây là thuật ngữ tế lễ chỉ lễ vật được thiêu dâng trọn vẹn; 'lễ thiêu' là cách diễn đạt ngắn gọn, quen thuộc.
- source_word: חַטָּאת
  choice: lễ chuộc tội
  rationale: Giữ cách dịch truyền thống và tính nhất quán của thuật ngữ tế lễ, nhưng ghi chú cách hiểu 'lễ thanh tẩy' phù hợp với ngữ cảnh ô uế nghi lễ sau sinh.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: Thầy tế lễ sẽ làm lễ chuộc tội cho bà
  rationale: Giữ sức nặng tế tự-thần học của כפר mà không xác định quá mức cơ chế của nghi thức.
- source_word: וְטָהֵרָה
  choice: bà sẽ được thanh sạch
  rationale: Diễn đạt sự phục hồi về trạng thái thanh sạch theo nghi lễ, phù hợp với ngữ cảnh của chương.
theological_decisions:
- issue: Cách dịch חַטָּאת trong bối cảnh thanh tẩy sau khi sinh
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: Bản văn nói đến sự ô uế theo nghi lễ, không nhất thiết hàm ý lỗi đạo đức cá nhân. Tuy vậy, 'lễ chuộc tội' bảo toàn thuật ngữ tế lễ truyền thống; chú thích ghi nhận 'lễ thanh tẩy' là cách dịch hợp lý theo chức năng của lễ vật trong ngữ cảnh này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “bà” để chỉ người phụ nữ trong luật định; giữ các thuật ngữ tế lễ nhất quán và tránh diễn đạt khiến việc sinh con bị hiểu là một lỗi đạo đức.
