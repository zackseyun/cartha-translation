source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: vi
  text: Nhưng nếu người phụ nữ sinh con gái, thì bà sẽ bị ô uế[a] trong hai tuần, như trong thời kỳ kinh nguyệt[b]; rồi trong sáu mươi sáu ngày, bà phải tiếp tục trong thời kỳ thanh tẩy liên quan đến huyết[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ô uế” ở đây chỉ tình trạng không thanh sạch theo nghi lễ, không hàm ý người mẹ mắc tội hay bị ô uế về đạo đức.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch rõ hơn: “như trong thời gian bà bị ô uế vì kinh nguyệt”. Tiếng Hê-bơ-rơ so sánh tình trạng sau khi sinh với tình trạng gắn liền với kinh nguyệt.'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn nói theo nghĩa đen là “các huyết của sự thanh tẩy”, một cách nói về thời kỳ sau sinh liên hệ với huyết và việc thanh tẩy theo nghi lễ; không nói đến tội lỗi đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu trường hợp tương phản với câu trước; “nhưng nếu” diễn đạt tự nhiên sắc thái chuyển sang trường hợp khác của liên từ và tiểu từ điều kiện.
- source_word: נְקֵבָה תֵלֵד
  choice: người phụ nữ sinh con gái
  rationale: נְקֵבָה chỉ một người thuộc giới tính nữ; trong ngữ cảnh sinh nở, “sinh con gái” là cách nói tự nhiên, rõ nghĩa mà không thêm nội dung ngoài văn cảnh.
- source_word: וְטָמְאָה
  choice: thì bà sẽ bị ô uế
  rationale: Diễn tả tình trạng không thanh sạch theo nghi lễ phát sinh sau khi sinh con. “Ô uế” giữ thuật ngữ quen thuộc của văn bản luật lệ; chú thích làm rõ rằng câu này không quy kết tội lỗi đạo đức.
- source_word: שְׁבֻעַיִם
  choice: trong hai tuần
  rationale: Dạng số đôi ở đây chỉ hai tuần; cách diễn đạt này chính xác và tự nhiên trong tiếng Việt.
- source_word: כְּנִדָּתָהּ
  choice: như trong kỳ kinh nguyệt
  rationale: נִדָּה ở đây nói đến thời kỳ hoặc tình trạng gắn với kinh nguyệt. Bản dịch giữ phép so sánh của nguyên văn mà không diễn giải quá mức.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: rồi trong sáu mươi sáu ngày
  rationale: Gộp cách đếm “sáu mươi ngày và sáu ngày” của tiếng Hê-bơ-rơ thành cách nói số tự nhiên trong tiếng Việt, đồng thời giữ nguyên số lượng.
- source_word: תֵּשֵׁב
  choice: bà phải tiếp tục ở
  rationale: Nghĩa đen là “ngồi/ở”, nhưng trong điều luật này động từ chỉ việc tiếp tục ở trong một tình trạng hay thời kỳ; “phải tiếp tục ở” truyền đạt được sắc thái quy định.
- source_word: עַל דְּמֵי טָהֳרָה
  choice: trong thời kỳ máu thanh tẩy
  rationale: Cụm Hê-bơ-rơ có nghĩa đen gần với “trên/trong các huyết của sự thanh tẩy”. Cách dịch này giữ hình ảnh “máu” và ý niệm thanh tẩy, đồng thời thêm “thời kỳ” để câu tiếng Việt dễ hiểu theo chức năng của thành ngữ trong văn cảnh.
theological_decisions:
- issue: Bản chất của tình trạng ô uế sau khi sinh con
  choice: Giữ từ “ô uế” trong chính văn nhưng chú thích rõ đây là tình trạng không thanh sạch theo nghi lễ.
  alternative: Dịch diễn giải ngay trong chính văn là “không thanh sạch về nghi lễ”.
  rationale: טמא trong đoạn luật này nói về tư cách nghi lễ, không khẳng định người mẹ phạm tội hay bị ô uế về đạo đức. Giữ thuật ngữ nguồn trong chính văn bảo toàn lối nói của Lê-vi Ký, còn chú thích ngăn cách hiểu sai.
- issue: Ý nghĩa của דְּמֵי טָהֳרָה
  choice: Giữ cách nói “máu thanh tẩy” và giải thích đó là thời kỳ thanh tẩy sau sinh.
  alternative: Diễn giải hoàn toàn là “thời kỳ thanh tẩy sau khi sinh”.
  rationale: Cụm từ nguồn vừa nhắc đến máu vừa đặt nó trong phạm trù thanh tẩy. Giữ cả hai yếu tố bảo toàn hình ảnh và sự căng thẳng của nguyên văn, thay vì xóa bỏ “máu” bằng một diễn giải thuần chức năng.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng câu chữ dễ hiểu đối với độc giả phổ thông. Đại từ “bà” nối lại chủ thể “người phụ nữ” một cách tự nhiên. Cụm khó “máu thanh tẩy” được giữ để phản ánh nguyên văn và được giải thích bằng chú thích.
