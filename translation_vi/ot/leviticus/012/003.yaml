base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/003.yaml
  text: And on the eighth day the flesh of his foreskin shall be circumcised[a].
translation:
  language: vi
  text: Vào ngày thứ tám, bé trai phải được cắt bao quy đầu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn, sát nghĩa: “thịt của bao quy đầu người ấy phải được cắt.” “Cắt bao quy đầu” là cách diễn đạt thông dụng trong tiếng Việt cho hành vi này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: Vào ngày
  rationale: Liên từ וּ nối tiếp chỉ thị trước đó, còn בַיּוֹם diễn tả thời điểm. Trong tiếng Việt, “Vào ngày” truyền đạt tự nhiên ý nghĩa thời gian; không nhất thiết phải dịch riêng וּ thành “và” vì như vậy dễ tạo câu cứng.
- source_word: הַ/שְּׁמִינִי
  choice: thứ tám
  rationale: Số thứ tự bổ nghĩa trực tiếp cho “ngày”; đây là cách diễn đạt chuẩn và rõ ràng trong tiếng Việt.
- source_word: יִמּוֹל
  choice: phải được cắt
  rationale: Động từ מול ở thể Niphal, ngôi ba số ít giống đực, mang hình thức bị động và lực quy định pháp lý. “Phải được cắt” giữ cả sắc thái bị động lẫn tính bắt buộc, thay vì chuyển hẳn sang chủ động.
- source_word: בְּשַׂר
  choice: phần thịt
  rationale: Danh từ có nghĩa là “thịt.” Thêm “phần” giúp cụm từ tự nhiên hơn trong tiếng Việt mà vẫn giữ yếu tố từ vựng có trong nguyên văn.
- source_word: עָרְלָת/וֹ
  choice: bao quy đầu của bé trai
  rationale: עָרְלָה nghĩa là “bao quy đầu,” kèm hậu tố ngôi ba số ít giống đực. “Của bé trai” làm rõ sở hữu theo ngữ cảnh ngay trước đó và tự nhiên, trang trọng hơn “của nó” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Bản dịch giữ cấu trúc bị động và cụm “phần thịt bao quy đầu” của tiếng Hê-bơ-rơ, đồng thời dùng “bé trai” theo ngữ cảnh để tránh đại từ “nó” thiếu tự nhiên khi nói về trẻ sơ sinh.
