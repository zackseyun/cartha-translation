id: LEV.12.7
reference: Leviticus 12:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: vi
  text: Thầy tế lễ sẽ dâng lễ vật ấy trước Yahweh và làm lễ chuộc tội cho người phụ nữ; bà sẽ được thanh sạch khỏi nguồn máu của mình.[a] Đây là luật dành cho người phụ nữ sinh con, dù sinh con trai hay con gái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khỏi dòng máu của mình.” Tiếng Hê-bơ-rơ nói sát nghĩa là “khỏi nguồn máu của mình.”
    reason: Nêu cách hiểu theo ngữ cảnh của מָקוֹר đồng thời bảo tồn hình ảnh nghĩa đen trong bản văn chính.
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: Thầy tế lễ sẽ dâng lễ vật ấy
  rationale: Động từ Hiphil của קרב cùng hậu tố tân ngữ giống đực số ít chỉ việc thầy tế lễ đem lễ vật đã nói ở câu trước đến dâng. Bổ sung chủ thể “thầy tế lễ” và danh từ “lễ vật” từ ngữ cảnh để câu tiếng Việt rõ và tự nhiên.
- source_word: לִפְנֵי יְהוָה
  choice: trước Yahweh
  rationale: Giữ cụm từ nghi lễ “trước” và phiên âm danh riêng giao ước יהוה là “Yahweh” thay vì thay bằng một tước hiệu.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: làm lễ chuộc tội cho người phụ nữ
  rationale: Trong ngữ cảnh tế lễ của Lê-vi Ký, כפר nói đến hành động chuộc tội do thầy tế lễ thực hiện. Cách dịch này quen thuộc, dễ hiểu và không ấn định một học thuyết riêng về cơ chế chuộc tội.
- source_word: וְטָהֲרָה
  choice: bà sẽ được thanh sạch
  rationale: Động từ diễn tả kết quả về tình trạng thanh sạch theo nghi lễ. “Được thanh sạch” phù hợp với mạch hành động của thầy tế lễ và phân biệt sự thanh sạch nghi lễ với vệ sinh thông thường.
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: khỏi nguồn máu của mình
  rationale: מָקוֹר nghĩa đen là nguồn hoặc mạch nước. Bản dịch chính giữ hình ảnh Hê-bơ-rơ; chú thích nêu cách hiểu tự nhiên hơn là dòng máu.
- source_word: זֹאת תּוֹרַת
  choice: Đây là luật dành cho
  rationale: תּוֹרָה ở đây chỉ quy định nghi lễ. “Luật” phù hợp với công thức thường gặp trong Lê-vi Ký và dễ hiểu trong tiếng Việt hiện đại.
- source_word: הַיֹּלֶדֶת
  choice: người phụ nữ sinh con
  rationale: Dịch rõ phân từ giống cái, không rút gọn thành “người mẹ” để giữ trọng tâm của nguyên văn vào việc sinh nở.
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: dù là con trai hay con gái
  rationale: Nguyên văn dùng các từ chỉ giới tính “đực/nam” và “cái/nữ”; trong ngữ cảnh trẻ sơ sinh, “con trai hay con gái” là cách diễn đạt tự nhiên, chính xác và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay thế bằng một tước hiệu.
- issue: Ý nghĩa của כפר trong nghi thức thanh sạch sau sinh
  choice: làm lễ chuộc tội cho người phụ nữ
  alternative: thực hiện nghi thức xá tội hoặc tẩy uế cho người phụ nữ
  rationale: Giữ thuật ngữ tế lễ truyền thống “chuộc tội” nhưng không giải thích rằng việc sinh con tự nó là một tội lỗi; câu chỉ trình bày nghi thức và kết quả thanh sạch theo luật.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo ngữ cảnh trực tiếp; dùng “người phụ nữ” rồi “bà” để tránh lặp nặng nề. Thuật ngữ “thanh sạch” duy trì sắc thái nghi lễ của Lê-vi Ký, không hàm ý đánh giá vệ sinh hay đạo đức.
