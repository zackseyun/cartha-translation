revisions:
- from: Thầy tế lễ sẽ dâng lễ vật ấy trước Yahweh và làm lễ chuộc tội cho người phụ nữ; bà sẽ được thanh sạch khỏi nguồn máu của mình.[a] Đây là luật dành cho người phụ nữ sinh con, dù là con trai hay con gái.
  to: Thầy tế lễ sẽ dâng lễ vật ấy trước Yahweh và làm lễ chuộc tội cho người phụ nữ; bà sẽ được thanh sạch khỏi nguồn máu của mình.[a] Đây là luật dành cho người phụ nữ sinh con, dù sinh con trai hay con gái.
  rationale: Chỉ sửa cụm phân biệt giới tính ở cuối câu để làm rõ rằng “con trai hay con gái” là đứa trẻ được sinh ra, theo nguyên văn. Các phần còn lại giữ nguyên vì trung thành với văn bản nguồn và tự nhiên trong tiếng Việt hiện đại.
