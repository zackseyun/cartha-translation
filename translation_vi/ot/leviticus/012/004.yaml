id: LEV.12.4
reference: Leviticus 12:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: vi
  text: Sau đó, trong ba mươi ba ngày, người mẹ phải ở trong thời kỳ thanh tẩy vì ra huyết[a]. Người không được chạm vào bất cứ vật thánh nào và không được vào nơi thánh cho đến khi mãn những ngày thanh tẩy của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ở trong huyết của sự thanh tẩy.” Cụm Hê-bơ-rơ theo nghĩa đen là “trong huyết/các huyết của sự thanh tẩy” và chỉ thời kỳ sau sinh liên hệ đến huyết và sự thanh tẩy theo nghi lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: ba mươi ba ngày
  rationale: Cách đếm Hê-bơ-rơ theo nghĩa đen là “ba mươi ngày và ba ngày”; tiếng Việt tự nhiên gộp thành “ba mươi ba ngày”.
- source_word: תֵּשֵׁב
  choice: phải tiếp tục ở trong
  rationale: Động từ có thể mang nghĩa ngồi, cư ngụ hoặc tiếp tục ở lại; trong luật nghi lễ này, nó chỉ việc tiếp tục ở trong một tình trạng suốt khoảng thời gian quy định.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: trong thời kỳ huyết thanh tẩy của mình
  rationale: Cụm từ khó này theo sát hình ảnh cụ thể về huyết sau sinh, đồng thời “thời kỳ” giúp tiếng Việt diễn đạt rõ rằng đây là tình trạng kéo dài, không phải hành động ở bên trong chất huyết.
- source_word: בְּ/כָל קֹדֶשׁ
  choice: bất cứ vật thánh nào
  rationale: Danh từ קֹדֶשׁ ở đây có thể chỉ điều hoặc vật thuộc phạm vi thánh; “vật thánh” tự nhiên và phù hợp với lệnh cấm chạm.
- source_word: לֹא תִגָּע
  choice: không được chạm vào
  rationale: Diễn đạt tự nhiên sức bắt buộc của mệnh lệnh phủ định trong văn luật pháp.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: và không được vào nơi thánh
  rationale: מִקְדָּשׁ chỉ nơi thánh hoặc thánh điện; “nơi thánh” giữ được phạm vi nghĩa mà không xác định quá mức kiến trúc trong bối cảnh này.
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: cho đến khi mãn những ngày thanh tẩy của mình
  rationale: “Mãn” diễn đạt tự nhiên ý hoàn tất khoảng thời gian; hậu tố giống cái được thể hiện bằng “của mình” và quy chiếu về người mẹ.
theological_decisions:
- issue: Diễn đạt thuật ngữ về sự thanh sạch nghi lễ mà không hàm ý tội lỗi đạo đức
  choice: thanh tẩy
  alternative: tẩy sạch
  rationale: Câu này nói về tình trạng nghi lễ sau khi sinh, không khẳng định người mẹ phạm lỗi đạo đức. “Thanh tẩy” giữ sắc thái nghi lễ và pháp định.
- issue: Phạm vi nghĩa của הַמִּקְדָּשׁ
  choice: nơi thánh
  alternative: thánh điện
  rationale: “Nơi thánh” giữ cách gọi khái quát của nguồn Hê-bơ-rơ và tránh áp đặt một hình thức kiến trúc cụ thể hơn điều câu văn đòi hỏi.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “người mẹ” để làm rõ chủ thể từ văn mạch trước; “người” ở các mệnh đề sau tránh lặp nặng nề. Cụm “huyết thanh tẩy” cố ý giữ hình ảnh và độ khó của nguyên văn, còn “thời kỳ” giúp câu dễ hiểu trong tiếng Việt.
