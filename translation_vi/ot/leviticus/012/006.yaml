id: LEV.12.6
reference: Leviticus 12:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: vi
  text: Khi những ngày thanh tẩy của người mẹ đã mãn, dù sinh con trai hay con gái, người mẹ phải đem một con chiên một tuổi làm lễ thiêu và một con chim bồ câu non hoặc một con chim cu gáy làm lễ chuộc tội[a] đến lối vào Lều Hội Kiến cho thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy”. Từ Hê-bơ-rơ ở đây có thể chỉ tế lễ dùng để loại bỏ tình trạng ô uế theo nghi lễ, chứ không chỉ tế lễ vì hành vi phạm tội về đạo đức.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאת
  choice: Khi ... đã mãn
  rationale: Cụm giới từ với động từ nguyên mẫu diễn tả thời điểm một khoảng thời gian kết thúc; “đã mãn” tự nhiên trong văn phong luật lệ và giữ đúng sắc thái hoàn tất.
- source_word: יְמֵי טָהֳרָהּ
  choice: những ngày thanh tẩy của người mẹ
  rationale: טָהֳרָהּ chỉ sự thanh sạch theo nghi lễ. Nêu “người mẹ” thay cho đại từ giúp câu tiếng Việt rõ chủ thể mà không thêm nội dung.
- source_word: לְבֵן אוֹ לְבַת
  choice: dù sinh con trai hay con gái
  rationale: Diễn đạt tự nhiên rằng quy định áp dụng cho cả hai trường hợp sinh con; động từ “sinh” được hàm chứa rõ trong ngữ cảnh.
- source_word: תָּבִיא
  choice: người mẹ phải đem
  rationale: Thể Hiphil chưa hoàn thành mang lực quy định trong văn bản luật; “phải đem” chuyển tải nghĩa bắt buộc rõ ràng trong tiếng Việt hiện đại.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: một con chiên được một tuổi
  rationale: Thành ngữ Hê-bơ-rơ chỉ con vật một tuổi; cách diễn đạt này rõ và tự nhiên.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: עֹלָה là thuật ngữ tế lễ chỉ sinh tế được thiêu; “lễ thiêu” ngắn gọn và giữ phạm trù nghi lễ.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: cùng một chim bồ câu non hoặc một chim cu gáy
  rationale: בֶּן־יוֹנָה là bồ câu non, còn תֹר là chim cu gáy; bản dịch duy trì sự phân biệt giữa hai loài.
- source_word: לְחַטָּאת
  choice: làm lễ chuộc tội
  rationale: חַטָּאת là tên tế lễ truyền thống thường được dịch là “lễ chuộc tội”, nhưng trong ngữ cảnh này cũng có thể hiểu theo chức năng thanh tẩy; khả năng ấy được giữ trong chú thích.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: đến cho thầy tế lễ, tại lối vào Lều Hội Kiến
  rationale: Giữ cả người tiếp nhận lẫn địa điểm dâng lễ, đồng thời sắp xếp theo cú pháp tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách dịch חַטָּאת trong bối cảnh thanh tẩy sau sinh
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: “Lễ chuộc tội” bảo tồn thuật ngữ tế lễ quen thuộc và tính nhất quán từ vựng. Tuy nhiên, nghi thức ở đây liên quan đến tình trạng ô uế theo nghi lễ sau khi sinh, không nhất thiết hàm ý việc sinh con là một tội lỗi đạo đức; vì vậy chú thích giữ cách hiểu “lễ thanh tẩy”.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Lều Hội Kiến” như một danh xưng nghi lễ; dùng “thầy tế lễ” để chỉ הכהן. Dấu chú thích [a] được đặt ngay sau thuật ngữ mà chú thích giải thích.
