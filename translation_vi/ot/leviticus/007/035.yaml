id: LEV.7.35
reference: Leviticus 7:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: vi
  text: Đây là phần được phân định cho A-rôn và phần được phân định cho các con trai ông, từ các lễ vật dùng lửa dâng cho Đức Giê-hô-va[a], vào ngày họ được đưa đến để thi hành chức tế lễ cho Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo truyền thống: “các lễ vật dâng bằng lửa của Đức Giê-hô-va.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: phần được dành
  rationale: Trong ngữ cảnh các phần lễ vật thuộc về các tư tế, từ này chỉ phần được cấp cho họ gắn với sự xức dầu và biệt riêng. Cách dịch này tự nhiên trong tiếng Việt mà không thu hẹp nghĩa thành chính nghi thức xức dầu.
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: phần được dành cho A-rôn và phần được dành cho các con trai ông
  rationale: Giữ nguyên sự lặp lại của danh từ trong tiếng Hê-bơ-rơ và nói rõ rằng các con trai là con của A-rôn.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: từ các lễ vật dâng bằng lửa lên Đức Giê-hô-va
  rationale: Giữ ý nghĩa truyền thống và trực tiếp của אִשֶּׁה là lễ vật được dâng bằng lửa, đồng thời diễn đạt rõ quan hệ với Đức Giê-hô-va.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: בְּיוֹם
  choice: kể từ ngày
  rationale: Trong mạch luật định về phần tư tế, cụm này có thể đánh dấu thời điểm quyền hưởng phần lễ vật bắt đầu; cách dịch cũng phù hợp với việc câu kế tiếp nói đến điều được ban làm phần quy định lâu dài.
- source_word: הִקְרִיב אֹתָם
  choice: Ngài đưa họ đến
  rationale: Hiphil của קרב có nghĩa là đem hoặc đưa đến gần. Vì tân ngữ là A-rôn và các con trai ông, cách dịch này tránh gợi ý rằng chính họ bị dâng làm sinh tế.
- source_word: לְכַהֵן לַיהוָה
  choice: để phụng sự Đức Giê-hô-va trong chức vụ tư tế
  rationale: Diễn đạt tự nhiên chức năng của động từ כהן và giữ Đức Giê-hô-va là Đấng họ phục vụ.
theological_decisions:
- issue: Nghĩa của מִשְׁחַת trong luật về tư tế
  choice: phần được dành
  alternative: phần xức dầu; sự xức dầu
  rationale: Từ này liên hệ về từ nguyên với việc xức dầu, nhưng tại đây tổng kết phần từ các lễ vật được cấp cho A-rôn và các con trai ông. Bản dịch giữ ý phần được phân định mà không biến câu này thành lời mô tả nghi thức dùng dầu.
- issue: Chủ thể của הִקְרִיב
  choice: Ngài, tức Đức Giê-hô-va theo chủ thể ngầm của dạng động từ số ít
  alternative: Môi-se đưa họ đến
  rationale: Bản Hê-bơ-rơ dùng động từ số ít với chủ thể không nêu rõ. Ngữ cảnh rộng hơn có thể khiến người đọc hiểu Môi-se là tác nhân nghi lễ, nhưng không nên chèn tên Môi-se vào chính văn; đại từ viết hoa phản ánh cách hiểu Đức Giê-hô-va là chủ thể mà vẫn không thêm một tên riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ tên riêng Đức Giê-hô-va, sự lặp lại của hai phần được cấp, và thuật ngữ “chức vụ tư tế”. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
