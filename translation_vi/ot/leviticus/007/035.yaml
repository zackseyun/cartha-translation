review_pass:
  verdict: revise
  source_fidelity: Cụm בְּיוֹם mang nghĩa thời điểm “vào/trong ngày”, không phải ý khởi điểm kéo dài “kể từ ngày”. Chủ thể của הִקְרִיב không được nêu rõ trong tiếng Hê-bơ-rơ; đại từ viết hoa “Ngài” áp đặt Đức Giê-hô-va làm chủ thể. Bản sửa dùng bị động để giữ sự không xác định này, đồng thời vẫn diễn đạt việc đưa A-rôn và các con trai ông vào chức tế lễ.
  naturalness: “Vào ngày họ được đưa đến để thi hành chức tế lễ” là tiếng Việt hiện đại, trang trọng và rõ hơn “kể từ ngày Ngài đưa họ đến”. “Các lễ vật dùng lửa dâng cho” diễn đạt tự nhiên thuật ngữ tế tự và không gợi rằng lửa là đối tượng nhận lễ.
  terminology: Giữ A-rôn và Đức Giê-hô-va nhất quán với dự thảo. “Phần được phân định” phản ánh phần được ấn định/cấp cho tư tế trong ngữ cảnh này, không đồng nhất từ מִשְׁחַת với chính nghi thức xức dầu. Chú thích nêu phương án truyền thống cho אִשֶּׁה.
  issues:
