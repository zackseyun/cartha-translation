revisions:
- from: Đây là phần được dành cho A-rôn và phần được dành cho các con trai ông từ các lễ vật dâng bằng lửa lên Đức Giê-hô-va[a], kể từ ngày Ngài đưa họ đến để phụng sự Đức Giê-hô-va trong chức vụ tư tế.
  to: Đây là phần được phân định cho A-rôn và phần được phân định cho các con trai ông, từ các lễ vật dùng lửa dâng cho Đức Giê-hô-va[a], vào ngày họ được đưa đến để thi hành chức tế lễ cho Đức Giê-hô-va.
  rationale: Sửa nghĩa thời gian của בְּיוֹם, không áp đặt chủ thể cho động từ không nêu chủ ngữ, và làm rõ cách diễn đạt thuật ngữ tế tự. Cấu trúc lặp lại “phần ... và phần ...” của tiếng Hê-bơ-rơ được giữ lại.
