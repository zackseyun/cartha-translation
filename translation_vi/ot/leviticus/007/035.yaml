    issue: “kể từ ngày” dịch sai giá trị của בְּיוֹם.
    rationale: 'Giới từ בְּ ở đây xác định dịp/thời điểm: “vào ngày”, không đánh dấu thời điểm bắt đầu của một tình trạng tiếp diễn.'
  - severity: medium
    issue: “Ngài” xác định chủ thể không được nêu của הִקְרִיב.
    rationale: Dạng động từ số ít không nêu chủ thể, và ngữ cảnh có thể được hiểu theo những cách khác nhau. Viết hoa đại từ gán chủ thể là Đức Giê-hô-va, vượt quá điều chính văn nói.
  - severity: low
    issue: Chú thích hiện có không phản ánh đầy đủ cách gọi truyền thống của אִשֶּׁה.
    rationale: Nên nêu “lễ vật dâng bằng lửa” như phương án truyền thống, trong khi chính văn dùng cách diễn đạt tự nhiên hơn.
