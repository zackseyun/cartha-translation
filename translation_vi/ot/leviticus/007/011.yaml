  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: vi
  text: Đây là luật về lễ tế bình an mà người ta dâng cho Đức Giê-hô-va:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “lễ tế an lành”; theo cách gọi truyền thống: “lễ tế bình an.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Đây là
  rationale: Cụm này mở đầu một phần quy định mới. Tiếng Việt không cần dịch liên từ וְ thành “và” ở đây, vì “Đây là” tự nhiên hơn mà không làm thay đổi ý.
- source_word: תּוֹרַת
  choice: luật về
  rationale: Trong văn liệu tư tế, תּוֹרָה chỉ quy định hay chỉ dẫn nghi lễ có tính chuẩn mực; “luật về” giữ được sắc thái pháp quy và quan hệ kết cấu với danh từ theo sau.
- source_word: זֶבַח
  choice: sinh tế
  rationale: זֶבַח là lễ vật hiến tế có việc giết con vật. “Sinh tế” là cách diễn đạt ngắn gọn, trang trọng và phân biệt với lễ vật nói chung.
- source_word: הַ/שְּׁלָמִים
  choice: bình an
  rationale: שְׁלָמִים là thuật ngữ tế lễ có trường nghĩa gồm bình an, toàn vẹn và phúc lành. “Sinh tế bình an” giữ cách gọi quen thuộc; chú thích nêu phương án sát nghĩa khác.
- source_word: אֲשֶׁר יַקְרִיב
  choice: mà người ta dâng
  rationale: Động từ Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến để dâng. Chủ ngữ số ít giống đực mang nghĩa khái quát trong luật lệ, nên dịch “người ta” để tự nhiên và không giới hạn giới tính; thể chưa hoàn thành trong mệnh đề quan hệ được diễn đạt trung tính, không thêm sắc thái cho phép hay bắt buộc vốn không được đánh dấu rõ ở riêng hình thái này.
- source_word: לַ/יהוָה
  choice: lên Đức Giê-hô-va
  rationale: Giới từ לְ đánh dấu đối tượng tiếp nhận sự dâng hiến. Danh riêng giao ước יהוה được phiên âm theo cách quen thuộc trong tiếng Việt là “Đức Giê-hô-va”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ trực tiếp dùng Danh Bốn Chữ. Bản dịch giữ đây là danh riêng thay vì thay bằng tước hiệu “CHÚA”; “Đức Giê-hô-va” là hình thức trang trọng và quen thuộc với độc giả Kinh Thánh tiếng Việt.
- issue: Cách dịch thuật ngữ tế lễ שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế đem lại an lành
  rationale: Thuật ngữ có thể gợi bình an, sự toàn vẹn và an lành. Cách dịch chính giữ tên gọi truyền thống, còn chú thích bảo tồn chiều rộng ngữ nghĩa mà không đồng nhất nó với một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc định nghĩa pháp quy của câu Hê-bơ-rơ; dùng “người ta” cho chủ thể khái quát và tránh thêm tình thái “có thể” hay “phải” khi mệnh đề nguồn tự nó không quyết định rõ sắc thái ấy.
