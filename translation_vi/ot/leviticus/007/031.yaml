base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: vi
  text: Thầy tế lễ phải thiêu mỡ trên bàn thờ[a], còn phần ức sẽ thuộc về A-rôn và các con trai ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho mỡ bốc khói trên bàn thờ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: phải thiêu
  rationale: Dạng Hiphil của קטר trong ngữ cảnh tế lễ chỉ việc thiêu lễ vật trên bàn thờ để khói bay lên. “Thiêu” tự nhiên, trang trọng và phân biệt với việc đốt thông thường; sắc thái khói bay lên được giữ trong chú thích.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ nghĩa và quen thuộc trong tiếng Việt hiện đại đối với chức vụ tư tế trong bối cảnh nghi lễ; dạng số ít tương ứng với tiếng Hê-bơ-rơ.
- source_word: הַחֵלֶב
  choice: mỡ
  rationale: Trong luật tế lễ Lê-vi, חֵלֶב chỉ những phần mỡ dành để thiêu trên bàn thờ.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Dù hậu tố chỉ hướng có thể diễn đạt là “đến bàn thờ”, khi đi với động từ thiêu lễ vật, ý nghĩa tự nhiên là thiêu mỡ trên bàn thờ.
- source_word: וְהָיָה
  choice: sẽ thuộc về
  rationale: Nghĩa đen là “sẽ là”, nhưng trong quy định phân chia phần tế lễ, cụm này biểu thị quyền sở hữu hay phần được cấp.
- source_word: הֶחָזֶה
  choice: phần ức
  rationale: Trong luật tế lễ, חָזֶה là phần ức của con vật được dành cho các thầy tế lễ; thêm “phần” làm rõ đây là một phần thịt tế lễ.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: về A-rôn và các con trai ông
  rationale: Giới từ לְ ở đây đánh dấu sự phân bổ hay sở hữu. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ quyền hưởng phần tế lễ của A-rôn cùng các con trai.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “phải” để thể hiện tính quy định của thể động từ trong ngữ cảnh pháp luật; “còn” nêu sự tương phản giữa phần được thiêu và phần được dành cho hàng tư tế.
