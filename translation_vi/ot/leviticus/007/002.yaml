source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: vi
  text: Tại nơi người ta giết lễ toàn thiêu, người ta cũng phải giết tế lễ chuộc lỗi[a]; rồi thầy tế lễ phải hắt máu của con vật ấy lên bàn thờ, chung quanh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tế lễ bồi hoàn” hoặc “tế lễ đền bù”. Từ Hê-bơ-rơ này vừa nói đến lỗi phạm, vừa hàm ý việc bồi hoàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Tại nơi
  rationale: Diễn đạt tự nhiên mệnh đề chỉ địa điểm, đồng thời giữ tính cụ thể của quy định nghi lễ.
- source_word: יִשְׁחֲטוּ
  choice: người ta giết
  rationale: Động từ שׁחט chỉ việc giết con vật hiến tế; “giết” rõ ràng và tự nhiên trong tiếng Việt, còn bối cảnh đã xác định đây là hành vi nghi lễ.
- source_word: הָעֹלָה
  choice: tế lễ thiêu
  rationale: Thuật ngữ quen thuộc chỉ lễ vật được thiêu trọn, phù hợp với hệ thống từ vựng tế lễ trong sách Lê-vi.
- source_word: הָאָשָׁם
  choice: tế lễ chuộc lỗi
  rationale: Giữ khía cạnh lỗi phạm của אָשָׁם mà không loại bỏ sắc thái bồi hoàn; các cách hiểu gần được nêu trong chú thích.
- source_word: דָּמוֹ
  choice: máu của con vật ấy
  rationale: Làm rõ hậu tố số ít chỉ về con vật dùng làm tế lễ chuộc lỗi, tránh cách nói “máu của lễ vật” thiếu tự nhiên.
- source_word: יִזְרֹק
  choice: phải vẩy
  rationale: Trong nghi thức tế lễ, זָרַק diễn tả việc hất hoặc vẩy máu lên bề mặt bàn thờ, mạnh hơn động tác rảy nhẹ.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: vào quanh bàn thờ
  rationale: Diễn tả máu được vẩy vào các phía quanh bàn thờ; “vào” phù hợp với động tác hướng tới bề mặt bàn thờ.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ אָשָׁם
  choice: tế lễ chuộc lỗi
  alternative: tế lễ bồi hoàn; tế lễ đền bù
  rationale: “Tế lễ chuộc lỗi” là cách gọi dễ nhận biết trong tiếng Việt và giữ trọng tâm lỗi phạm, trong khi chú thích bảo tồn sắc thái bồi hoàn vốn có của thuật ngữ.
- issue: Chủ thể số ít của יִזְרֹק sau chủ thể số nhiều của יִשְׁחֲטוּ
  choice: thầy tế lễ phải vẩy
  alternative: người ấy phải vẩy
  rationale: Nguyên văn chuyển từ số nhiều sang số ít mà không nêu danh từ chủ thể. Theo thủ tục tế lễ trong ngữ cảnh gần, người thực hiện việc vẩy máu là thầy tế lễ; bản dịch làm rõ chủ thể để câu tiếng Việt dễ hiểu, nhưng không thêm một ý thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ta” cho chủ thể số nhiều không xác định và “thầy tế lễ” cho động từ số ít theo ngữ cảnh nghi lễ. Dấu chấm phẩy giúp phân biệt việc giết lễ vật với nghi thức xử lý máu.
