revisions:
- from: Tại nơi người ta giết tế lễ thiêu, người ta cũng phải giết tế lễ chuộc lỗi[a]; rồi thầy tế lễ phải vẩy máu của con vật ấy vào quanh bàn thờ.
  to: Tại nơi người ta giết lễ toàn thiêu, người ta cũng phải giết tế lễ chuộc lỗi[a]; rồi thầy tế lễ phải hắt máu của con vật ấy lên bàn thờ, chung quanh.
  rationale: 'Sửa thuật ngữ của עֹלָה thành ‘lễ toàn thiêu’ và thay cụm mô tả nghi thức máu để phản ánh rõ hơn זָרַק עַל הַמִּזְבֵּחַ סָבִיב: máu được hắt lên bàn thờ quanh các phía. Giữ nguyên lựa chọn ‘tế lễ chuộc lỗi’, chú thích và sự làm rõ chủ thể ‘thầy tế lễ’ theo ngữ cảnh nghi lễ.'
