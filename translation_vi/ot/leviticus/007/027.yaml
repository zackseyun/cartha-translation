  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל נֶ֖פֶשׁ אֲשֶׁר תֹּאכַ֣ל כָּל דָּ֑ם וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּֽי/הָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: vi
  text: Bất cứ ai ăn bất cứ loại huyết nào, người ấy sẽ bị đoạn tuyệt khỏi dân mình.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn cũng có thể dịch là “linh hồn”; ở đây, từ Hê-bơ-rơ nephesh chỉ một cá nhân, tức một người.
    reason: lexical_alternative
  - marker: b
    text: “Bị đoạn tuyệt” là một công thức chế tài giao ước. Cụm từ này có thể hàm ý bị loại khỏi cộng đồng hoặc chịu sự phán xét của Đức Chúa Trời; ở đây, nguyên văn Hê-bơ-rơ không nói rõ cách thức.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ai / người ấy
  rationale: Trong văn luật pháp, נֶפֶשׁ chỉ một cá nhân, không nhất thiết nói đến phần phi vật chất là “linh hồn”. Cách diễn đạt “ai… người ấy” tự nhiên trong tiếng Việt và giữ được sự lặp lại nhấn mạnh của câu Hê-bơ-rơ.
- source_word: תֹּאכַל
  choice: ăn
  rationale: Thể vị hoàn thành trong mệnh đề quan hệ diễn tả trường hợp tổng quát; “ăn” truyền đạt tự nhiên hiệu lực pháp lý phổ quát.
- source_word: כָּל דָּם
  choice: bất kỳ thứ huyết nào
  rationale: כָּל đi với danh từ không đếm được mang nghĩa phân phối, tức huyết dưới bất kỳ dạng nào, chứ không phải toàn bộ một lượng huyết xác định.
- source_word: וְנִכְרְתָה
  choice: sẽ bị đoạn tuyệt
  rationale: Đây là công thức chế tài giao ước với כרת ở thể Niphal. “Bị đoạn tuyệt” giữ hình ảnh và không ấn định cụ thể đó là xử tử, khai trừ hay sự phán xét trực tiếp của Đức Chúa Trời.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: người ấy
  rationale: Danh từ được lặp lại kèm đại từ chỉ định nhằm nhấn mạnh và quy chiếu lại người phạm luật; “người ấy” phù hợp với văn phong pháp lý tiếng Việt.
- source_word: מֵעַמֶּיהָ
  choice: khỏi dân mình
  rationale: Hậu tố giống cái hòa hợp ngữ pháp với נֶפֶשׁ, không giới hạn điều luật cho nữ giới. “Dân mình” trung tính về giới và diễn đạt việc bị tách khỏi cộng đồng giao ước của người ấy.
theological_decisions:
- issue: Ý nghĩa của chế tài giao ước כרת, “bị đoạn tuyệt”
  choice: Giữ cách nói “sẽ bị đoạn tuyệt” mà không xác định phương thức chế tài.
  alternative: “sẽ bị xử tử”, “sẽ bị khai trừ khỏi cộng đồng”, hoặc “sẽ bị Đức Chúa Trời hủy diệt”
  rationale: Công thức Hê-bơ-rơ ngắn gọn và có thể được hiểu theo nhiều cách. Bản dịch cần bảo toàn sự mơ hồ thật sự của nguyên văn thay vì giải quyết một vấn đề pháp lý-thần học mà câu này không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “huyết” để phù hợp ngữ vực luật tế lễ; dùng cấu trúc trung tính về giới “ai… người ấy… dân mình”. Các dấu chú thích [a], [b] đều được đặt trong câu chính.
