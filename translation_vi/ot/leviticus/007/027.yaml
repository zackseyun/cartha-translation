    rationale: Tiếng Việt hiện đại thường dùng “bất cứ loại … nào” khi diễn đạt nghĩa phân phối với một danh từ chất liệu. Sửa đổi này không thay đổi phạm vi của כָּל דָּם.
  - severity: low
    issue: Phần lý do từ vựng cho תֹּאכַל gọi hình thức này là “thể vị hoàn thành”.
