source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: vi
  text: Mỡ của con vật tự chết[a] và mỡ của con vật bị thú dữ xé có thể được dùng cho bất cứ việc gì; nhưng tuyệt đối không được ăn thứ mỡ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ con vật tự chết, tức chết không qua việc giết mổ đúng cách; cũng có thể dịch là “con vật được tìm thấy đã chết”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: mỡ
  rationale: Cách gọi tự nhiên và chuẩn trong tiếng Việt đối với phần mỡ động vật trong bối cảnh luật tế lễ và thực phẩm.
- source_word: נְבֵלָה
  choice: con vật chết
  rationale: Chỉ con vật chết mà không được giết mổ đúng cách; cách dịch này giữ nghĩa rộng của từ Hê-bơ-rơ, không thu hẹp thành chỉ chết tự nhiên hay được tìm thấy đã chết.
- source_word: טְרֵפָה
  choice: con vật bị thú dữ xé
  rationale: Diễn đạt rõ một con vật bị thú săn mồi vồ xé, đồng thời tự nhiên trong tiếng Việt.
- source_word: יֵעָשֶׂה לְכָל מְלָאכָה
  choice: có thể được dùng vào bất cứ việc gì
  rationale: Trong ngữ cảnh, dạng bị động diễn tả việc được phép dùng phần mỡ cho các mục đích khác ngoài ăn; cách dịch vừa sát nghĩa vừa dễ hiểu.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: nhưng tuyệt đối không được ăn
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh lệnh cấm; “tuyệt đối không” truyền đạt rõ sắc thái nhấn mạnh ấy.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, rõ ràng với độc giả phổ thông. Giữ phép dùng rộng của “bất cứ việc gì” và sắc thái nhấn mạnh của lệnh cấm ăn.
