  - severity: low
    issue: Mệnh đề cấm ăn không nêu lại đối tượng.
    rationale: Tiếng Hê-bơ-rơ có hậu tố đối tượng số ít, quy về phần mỡ. Nêu “thứ mỡ ấy” làm rõ đối tượng cấm ăn trong tiếng Việt.
