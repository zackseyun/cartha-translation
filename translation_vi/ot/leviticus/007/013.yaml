revisions:
- from: Cùng với lễ vật là những bánh có men, người ấy phải dâng lễ vật mình chung với sinh tế tạ ơn thuộc lễ vật bình an[a] của mình.
  to: Cùng với những bánh có men, người ấy phải dâng lễ vật của mình kèm theo sinh tế tạ ơn thuộc lễ vật bình an[a] của mình.
  rationale: Bản sửa khôi phục quan hệ «cùng với» của bánh có men, phân biệt rõ «lễ vật» (קָרְבָּן) với «sinh tế» (זֶבַח), và dùng cú pháp Việt tự nhiên hơn. «Thuộc lễ vật bình an của mình» diễn đạt thận trọng quan hệ cấu trúc của cụm זֶבַח תּוֹדַת שְׁלָמָיו mà không áp đặt một cách phân tích nghi lễ cụ thể.
  reviewer_model: gpt-5.6-terra
