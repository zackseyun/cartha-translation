review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ được các thành tố chính của tiếng Hê-bơ-rơ: bánh có men, hành động dâng, lễ vật, sinh tế tạ ơn và lễ vật bình an. Tuy nhiên, cụm «lễ vật là những bánh có men» làm sai quan hệ đi kèm của עַל; các bánh không được đồng nhất với toàn bộ lễ vật. Cụm «dâng lễ vật mình chung với» cũng không tự nhiên và làm mờ cấu trúc giữa קָרְבָּנוֹ với זֶבַח תּוֹדַת שְׁלָמָיו.'
  naturalness: Cần thay «lễ vật mình» bằng «lễ vật của mình», bỏ cấu trúc «lễ vật là những bánh», và diễn đạt quan hệ nghi lễ bằng tiếng Việt hiện đại, rõ ràng hơn. «Sinh tế tạ ơn thuộc lễ vật bình an của mình» giữ quan hệ sở thuộc/phân loại mà không diễn giải quá mức.
  terminology: Giữ «sinh tế» cho זֶבַח và «lễ vật» cho קָרְבָּן là hữu ích. Giữ «lễ vật bình an» cho שְׁלָמָיו; chú thích nên dùng các phương án từ vựng trung tính hơn. «Lễ vật cầu an» dễ gợi ý một mục đích cầu xin không được xác định trong thuật ngữ Hê-bơ-rơ.
  issues:
  - severity: medium
    issue: «lễ vật là những bánh có men»
    rationale: 'Tiếng Hê-bơ-rơ dùng עַל để chỉ sự đi kèm/bổ sung: lễ vật được dâng cùng với bánh có men, không nói lễ vật chính là những bánh ấy.'
  - severity: medium
    issue: «lễ vật mình chung với»
    rationale: Cấu trúc này không tự nhiên trong tiếng Việt hiện đại; đồng thời «mình» ở đây nên là «của mình».
  - severity: low
