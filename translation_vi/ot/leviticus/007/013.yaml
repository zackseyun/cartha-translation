    rationale: Cách gọi này có thể bị hiểu là lễ vật nhằm cầu an, trong khi שְׁלָמִים là tên một loại tế lễ. «Lễ vật an lành» phản ánh tốt hơn nét nghĩa well-being mà không thêm mục đích.
