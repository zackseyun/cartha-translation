  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: vi
  text: Cùng với những bánh có men, người ấy phải dâng lễ vật của mình kèm theo sinh tế tạ ơn thuộc lễ vật bình an[a] của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thông công” hoặc “lễ vật an lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: cùng với
  rationale: Trong ngữ cảnh này, עַל diễn tả sự đi kèm hoặc bổ sung, không phải vị trí ở phía trên.
- source_word: חַלֹּת לֶחֶם חָמֵץ
  choice: những bánh có men
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ rõ sự tương phản nghi lễ với các bánh không men ở những câu trước.
- source_word: יַקְרִיב
  choice: phải dâng
  rationale: Hiphil của קרב trong ngữ cảnh hiến tế chỉ hành động đem đến và dâng lễ vật; “phải dâng” vừa rõ nghĩa vừa phù hợp văn luật lệ.
- source_word: קָרְבָּנוֹ
  choice: lễ vật mình
  rationale: קָרְבָּן là thuật ngữ chung chỉ vật được đem đến dâng cho Đức Chúa Trời; “lễ vật” là cách dịch hiện đại, dễ hiểu.
- source_word: זֶבַח תּוֹדַת
  choice: sinh tế tạ ơn
  rationale: זֶבַח chỉ sinh tế, tức lễ vật có việc giết con vật; תּוֹדָה xác định đây là sinh tế mang tính tạ ơn.
- source_word: שְׁלָמָיו
  choice: lễ vật bình an của mình
  rationale: Giữ mối liên hệ từ vựng của שְׁלָמִים với bình an, toàn vẹn, đồng thời dùng thuật ngữ quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch thuật ngữ hiến tế שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công; lễ vật cầu an
  rationale: “Lễ vật bình an” giữ được liên hệ với gốc từ chỉ sự bình an/toàn vẹn và có tính nhận diện cao. Chú thích bảo tồn các cách hiểu nhấn mạnh sự thông công hoặc an lành mà không áp đặt một cách giải nghĩa duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sinh tế” để phân biệt זֶבַח với thuật ngữ chung קָרְבָּן (“lễ vật”). Đại từ “người ấy” thể hiện chủ thể số ít không xác định của động từ Hebrew.
