source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: vi
  text: Vì Ta đã lấy từ con dân Israel[a], từ các sinh tế bình an[c] của họ, cái ức của lễ đưa qua đưa lại và cái đùi của phần dâng hiến[b], rồi ban những phần ấy cho A-rôn, thầy tế lễ, và các con trai ông làm phần được ấn định vĩnh viễn cho họ từ con dân Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Israel”, một danh xưng giao ước thông dụng; cũng có thể dịch là “người Israel”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lễ dâng lên” hoặc “lễ nâng lên”; từ Hê-bơ-rơ chỉ phần được tách riêng và dâng hiến.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “sinh tế thông công”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: cái ức dùng làm lễ đưa qua đưa lại
  rationale: חֲזֵה chỉ phần ức/ngực của con vật; תְּנוּפָה gọi tên nghi thức đưa lễ vật qua lại trước mặt Đức Chúa Trời. Cách diễn đạt này vừa phân biệt phần thịt vừa giữ rõ loại nghi lễ.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: cái đùi dùng làm phần dâng hiến
  rationale: שׁוֹק ở đây là phần đùi; תְּרוּמָה là phần được tách riêng và dâng lên. “Phần dâng hiến” tự nhiên trong tiếng Việt hiện đại mà không thu hẹp từ này vào một động tác nghi lễ duy nhất.
- source_word: לָקַחְתִּי
  choice: Ta đã lấy
  rationale: Thể hoàn thành diễn tả hành động của Đức Chúa Trời thiết lập quyền phân phối các phần lễ vật; “đã lấy” giữ sát hình thái và hợp với lời giải thích mở đầu bằng כִּי.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Đây là danh xưng giao ước quen thuộc. “Con dân Israel” tự nhiên, trang trọng trong tiếng Việt và gần với nghĩa đen “các con trai/con cái Israel” hơn cách gọi thuần dân tộc.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: các sinh tế bình an của họ
  rationale: Giữ cả זֶבַח là sinh tế và שְׁלָמִים là loại lễ bình an, tránh làm mất danh mục tế lễ cụ thể.
- source_word: וָאֶתֵּן אֹתָם
  choice: Ta ban những phần ấy
  rationale: Đại từ số nhiều chỉ cái ức và cái đùi. “Ban” phù hợp với lời phán của Đức Chúa Trời và với việc ấn định phần dành cho hàng tư tế.
- source_word: לְחָק עוֹלָם
  choice: làm phần luật định vĩnh viễn
  rationale: חֹק trong ngữ cảnh này vừa là quy định vừa xác lập phần thuộc về tư tế. “Phần luật định vĩnh viễn” giữ được cả sắc thái pháp lý lẫn quyền lợi được ấn định.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: từ con dân Israel
  rationale: Lặp lại cụm từ như bản Hê-bơ-rơ để nhấn mạnh nguồn cung cấp phần dành cho các thầy tế lễ.
theological_decisions:
- issue: Danh xưng giao ước בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: người Israel; các con trai Israel
  rationale: “Con dân Israel” bảo tồn sắc thái thuộc về cộng đồng giao ước nhưng tránh lối nói “các con trai Israel” dễ bị hiểu là chỉ nam giới trong tiếng Việt hiện đại.
- issue: Ý nghĩa của שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công
  rationale: “Bình an” phản ánh trực tiếp trường nghĩa của gốc שׁלם và giữ sự căng mở của thuật ngữ tế lễ; “thông công” có thể nhấn quá mức một cách giải thích về bữa ăn hiệp thông.
- issue: Phạm vi của חָק עוֹלָם
  choice: phần luật định vĩnh viễn
  alternative: quy định đời đời
  rationale: Ngữ cảnh nói về phần lễ vật được ban cho Aaron và các con trai ông. Bản dịch giữ tính lâu dài của quy định mà không thêm lời giải thích thần học về cách áp dụng ngoài hệ thống tế lễ trong đoạn văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ta” cho lời phán trực tiếp của Đức Chúa Trời, “thầy tế lễ” cho chức vụ tư tế, và giữ tên riêng theo dạng quốc tế Israel, Aaron. Câu duy trì sự lặp lại “từ con dân Israel” vì đây là nét nhấn pháp lý của nguyên văn.
