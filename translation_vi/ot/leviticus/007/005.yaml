    rationale: Chú thích [a] giải thích אִשֶּׁה chứ không giải thích danh riêng יהוה. Neo đúng vị trí giúp người đọc nhận rõ từ được chú thích và bảo đảm tính nhất quán cấu trúc chú thích.
  - severity: low
