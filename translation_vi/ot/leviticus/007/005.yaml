  text: וְ/הִקְטִ֨יר אֹתָ֤/ם הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה אִשֶּׁ֖ה לַ/יהוָ֑ה אָשָׁ֖ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: vi
  text: Thầy tế lễ phải thiêu các phần ấy trên bàn thờ làm lễ vật dâng bằng lửa[a] cho Yahweh; đó là lễ vật chuộc lỗi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật bằng lửa dâng cho Yahweh.” Từ Hê-bơ-rơ chỉ một lễ vật được dâng qua lửa.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể gọi là “lễ vật bồi hoàn” hoặc “lễ vật đền tội.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: phải thiêu
  rationale: Dạng Hiphil của קטר trong ngữ cảnh tế lễ chỉ việc làm cho lễ vật bốc khói trên bàn thờ; “thiêu” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אֹתָם
  choice: các phần ấy
  rationale: Đại từ trực tiếp số nhiều chỉ lại những phần của con vật hiến tế đã nêu trong ngữ cảnh ngay trước đó; thêm “các phần” giúp câu tiếng Việt rõ mà không bổ sung nội dung mới.
- source_word: הַכֹּהֵן
  choice: Thầy tế lễ
  rationale: Danh từ xác định số ít, chỉ người thi hành nghi thức tế lễ.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Dù hình thức có hậu tố chỉ hướng, trong ngữ cảnh hành động thiêu lễ vật, tiếng Việt tự nhiên diễn đạt vị trí là “trên bàn thờ”.
- source_word: אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Thuật ngữ tế lễ chỉ vật được dâng qua lửa. Cách dịch này giữ rõ yếu tố lửa và tránh diễn giải thành thức ăn.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giới từ ל đánh dấu Đấng tiếp nhận hoặc sự dâng hiến; kết hợp “dâng ... lên Yahweh” là cách nói tự nhiên trong tiếng Việt.
- source_word: אָשָׁם
  choice: lễ vật chuộc lỗi
  rationale: Đây là thuật ngữ chỉ một loại tế lễ cụ thể trong Lê-vi Ký. “Chuộc lỗi” vừa dễ hiểu vừa phản ánh khía cạnh tội lỗi và bồi hoàn, trong khi chú thích bảo lưu các cách gọi khác.
- source_word: הוּא
  choice: Đó là
  rationale: Đại từ xác định loại tế lễ trong mệnh đề danh từ; “Đó là” tự nhiên và giữ chức năng phân loại của nguyên văn.
theological_decisions:
- issue: Cách thể hiện danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Thuật ngữ tế lễ אָשָׁם
  choice: lễ vật chuộc lỗi
  alternative: lễ vật bồi hoàn / lễ vật đền tội
  rationale: Nguyên văn gọi tên một loại tế lễ chính thức nhưng bản thân từ có thể gợi cả tình trạng mắc lỗi lẫn nghĩa vụ bồi hoàn. Bản dịch chọn cách gọi dễ hiểu và dùng chú thích để giữ các sắc thái khả hữu.
translation_notes:
  register: Văn phong luật tế lễ trang trọng nhưng hiện đại. Dùng “thầy tế lễ” và “bàn thờ” là các thuật ngữ quen thuộc; tránh lối diễn đạt cổ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn và được đặt ngay sau thuật ngữ liên quan.
