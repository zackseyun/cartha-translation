  terminology: Giữ “thầy tế lễ”, “bàn thờ”, “lễ vật dâng bằng lửa”, và “lễ vật chuộc lỗi”. “Lễ vật chuộc lỗi” là một cách gọi dễ hiểu cho thuật ngữ kỹ thuật אָשָׁם; chú thích bảo lưu các lựa chọn “bồi hoàn” và “đền tội” mà không ép một diễn giải giáo phái. Giữ “Yahweh” theo quyết định danh riêng đã nêu.
  issues:
