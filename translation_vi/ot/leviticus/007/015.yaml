base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: vi
  text: Thịt của sinh tế bình an để tạ ơn của người ấy phải được ăn trong ngày người ấy dâng lễ; người ấy không được để lại chút nào cho đến sáng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשַׂר
  choice: Thịt
  rationale: בשר trong ngữ cảnh sinh tế chỉ phần thịt của con vật; “thịt” tự nhiên và chính xác hơn “xác thịt” trong tiếng Việt hiện đại.
- source_word: זֶבַח
  choice: sinh tế
  rationale: זבח chỉ con vật hay nghi thức hiến tế bằng việc giết; “sinh tế” giữ sắc thái tế tự và phân biệt với từ khái quát hơn là “lễ vật”.
- source_word: תּוֹדַת שְׁלָמָיו
  choice: lễ vật bình an để tạ ơn của người ấy
  rationale: Cụm kết cấu chỉ một lễ vật bình an thuộc loại dâng để tạ ơn. Cách diễn đạt này giữ thuật ngữ “lễ vật bình an” và thể hiện chức năng tạ ơn mà không đồng nhất hoàn toàn תּוֹדָה với tên của toàn bộ loại sinh tế.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: ngay trong ngày người ấy dâng lễ vật
  rationale: Danh từ קָרְבָּן với hậu tố có thể nói đến lễ vật của người dâng hoặc việc dâng lễ; chuyển thành mệnh đề động từ giúp tiếng Việt rõ và tự nhiên, còn “ngay” nhấn đúng giới hạn trong cùng ngày.
- source_word: יֵאָכֵל
  choice: phải được ăn
  rationale: Dạng Niphal là bị động; “phải” truyền đạt lực quy định của câu luật, đồng thời giữ thể bị động.
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: người ấy không được để lại chút nào
  rationale: Giữ chủ ngữ số ít của động từ Hiphil và diễn đạt מִמֶּנּוּ tự nhiên như một lệnh cấm không để sót bất cứ phần nào.
- source_word: עַד בֹּקֶר
  choice: cho đến sáng
  rationale: Cách dịch trực tiếp, tự nhiên của giới hạn thời gian trong tiếng Việt.
theological_decisions:
- issue: Cách gọi loại sinh tế שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công
  rationale: “Lễ vật bình an” gần với thuật ngữ Hê-bơ-rơ hơn và tránh đưa cách giải thích thần học về sự thông công vào ngay tên gọi; cách dịch này cũng thuận lợi cho tính nhất quán trong sách Lê-vi.
- issue: Quan hệ giữa תּוֹדָה và שְׁלָמִים
  choice: lễ vật bình an để tạ ơn
  alternative: lễ vật tạ ơn bình an
  rationale: Bản dịch chính thể hiện đây là lễ vật bình an được dâng với mục đích tạ ơn, nhưng chú thích bảo lưu khả năng đọc cụm từ như một danh xưng ghép cô đọng.
translation_notes:
  register: Văn phong luật tế tự trang trọng nhưng hiện đại. Dùng “sinh tế” cho זבח và “lễ vật bình an” cho שְׁלָמִים nhằm duy trì sự phân biệt thuật ngữ; cấu trúc câu được điều chỉnh vừa phải để người đọc phổ thông dễ hiểu.
