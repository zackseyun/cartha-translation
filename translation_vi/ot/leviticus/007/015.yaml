review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đạt đúng quy định rằng thịt phải được ăn trong ngày dâng và không được để lại đến sáng. Tuy nhiên, cụm mở đầu “Thịt của sinh tế là lễ vật bình an...” tạo quan hệ đồng nhất bằng “là” không tự nhiên và làm mờ chuỗi sở hữu/cấu trúc của tiếng Hê-bơ-rơ. Bản sửa giữ cả ý sinh tế và loại lễ vật bình an dâng để tạ ơn.
  naturalness: Câu sửa loại bỏ cấu trúc nặng và không tự nhiên “sinh tế là lễ vật,” đồng thời dùng “trong ngày người ấy dâng lễ” tự nhiên, trang trọng và rõ nghĩa. “Cho đến sáng” giữ đúng giới hạn thời gian mà không thêm ý.
  terminology: Dùng nhất quán “sinh tế bình an để tạ ơn” để diễn đạt זֶבַח תּוֹדַת שְׁלָמָיו, tránh cách gọi “thông công” có tính diễn giải. “Thịt,” “phải được ăn,” và “không được để lại chút nào” phản ánh lần lượt בשר, bị động quy phạm יֵאָכֵל, và lệnh cấm לֹא יַנִּיחַ מִמֶּנּוּ.
  issues:
