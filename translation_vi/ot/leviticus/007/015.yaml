revisions:
- from: Thịt của sinh tế là lễ vật bình an để tạ ơn của người ấy phải được ăn ngay trong ngày người ấy dâng lễ vật[a]; người ấy không được để lại chút nào cho đến sáng.
  to: Thịt của sinh tế bình an để tạ ơn của người ấy phải được ăn trong ngày người ấy dâng lễ; người ấy không được để lại chút nào cho đến sáng.
  rationale: 'Sửa an toàn ở cấp diễn đạt: thay cấu trúc “sinh tế là lễ vật” bằng chuỗi bổ nghĩa tự nhiên hơn, giữ nguyên loại sinh tế, mục đích tạ ơn, chủ thể số ít, yêu cầu phải ăn trong ngày dâng, và lệnh không để lại đến sáng. Bỏ chú thích vì không cần thiết cho một cách diễn đạt tiếng Việt tương đương, không phải điểm bất định của văn bản nguồn.'
