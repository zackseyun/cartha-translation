base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: vi
  text: Lễ vật chuộc tội thế nào thì lễ vật chuộc lỗi cũng vậy; cả hai có cùng một luật lệ.[a] Thầy tế lễ nào cử hành nghi thức chuộc tội bằng lễ vật ấy thì lễ vật ấy sẽ thuộc về người đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Luật lệ”: tiếng Hê-bơ-rơ là torah, cũng có thể dịch là “chỉ dẫn” hoặc “quy định”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: Lễ vật chuộc tội thế nào thì lễ vật chuộc lỗi cũng vậy
  rationale: Hai tiền tố כ tạo nên phép so sánh giữa hai loại lễ vật. Trong ngữ cảnh tế lễ, חַטָּאת là lễ vật chuộc tội, còn אָשָׁם là lễ vật chuộc lỗi, thường gắn với việc đền bù.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: cả hai có cùng một luật lệ
  rationale: תּוֹרָה ở đây chỉ quy định hay luật lệ về nghi thức; לָהֶם quy về hai loại lễ vật. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ trọng tâm rằng cùng một quy định áp dụng cho cả hai.
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֵּר בּוֹ
  choice: thầy tế lễ đã dùng nó để làm lễ chuộc tội
  rationale: כפר trong luật tế lễ mang nghĩa thực hiện nghi thức chuộc tội; בּוֹ chỉ lễ vật như phương tiện. Không thêm một đối tượng thụ hưởng vốn không được nêu rõ trong câu Hê-bơ-rơ.
- source_word: לוֹ יִהְיֶה
  choice: sẽ thuộc về ...
  rationale: Thành ngữ này diễn tả quyền sở hữu hoặc phần được cấp cho thầy tế lễ cử hành nghi thức; ‘sẽ thuộc về’ rõ nghĩa và phù hợp văn phong luật lệ.
theological_decisions:
- issue: Ý nghĩa của כפר trong luật tế lễ
  choice: làm lễ chuộc tội
  alternative: thực hiện sự đền tội; làm lễ thanh tẩy
  rationale: Cách dịch giữ sức nặng nghi lễ và thần học của động từ nhưng không ấn định một lý thuyết riêng về cơ chế chuộc tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘thầy tế lễ’ cho הַכֹּהֵן; phân biệt ‘lễ vật chuộc tội’ với ‘lễ vật chuộc lỗi’. Đại từ ‘nó’ trong vế sau chỉ lễ vật chuộc lỗi gần nhất.
