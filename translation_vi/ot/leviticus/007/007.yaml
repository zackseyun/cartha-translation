revisions:
- from: Lễ vật chuộc tội thế nào thì lễ vật chuộc lỗi cũng vậy; cả hai có cùng một luật lệ.[a] Lễ vật ấy sẽ thuộc về thầy tế lễ đã dùng nó để làm lễ chuộc tội.
  to: Lễ vật chuộc tội thế nào thì lễ vật chuộc lỗi cũng vậy; cả hai có cùng một luật lệ.[a] Thầy tế lễ nào cử hành nghi thức chuộc tội bằng lễ vật ấy thì lễ vật ấy sẽ thuộc về người đó.
  rationale: Bản sửa giữ nguyên đối chiếu giữa hai loại lễ vật và «một luật lệ» chung cho cả hai. Mệnh đề cuối được cấu trúc lại để thầy tế lễ là chủ thể của việc cử hành nghi thức chuộc tội, còn lễ vật là phần thuộc về vị ấy. «Bằng lễ vật ấy» phản ánh tiền từ בּוֹ như phương tiện, không suy diễn người thụ hưởng sự chuộc tội.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:44:09Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo chuyển đạt đúng phép so sánh giữa lễ vật chuộc tội và lễ vật chuộc lỗi, cũng như ý nghĩa rằng hai lễ vật chịu cùng một quy định. Tuy nhiên, mệnh đề cuối của tiếng Hê-bơ-rơ có chủ ngữ là thầy tế lễ («thầy tế lễ ... sẽ có/được nhận nó»). Bản thảo đảo sang «Lễ vật ấy sẽ thuộc về thầy tế lễ» không sai nghĩa cơ bản, nhưng che khuất cấu trúc và khiến «nó» dễ bị hiểu chỉ lễ vật chuộc lỗi gần nhất. Bản sửa làm rõ rằng thầy tế lễ cử hành nghi thức bằng lễ vật nào thì được nhận lễ vật ấy, mà không thêm đối tượng được chuộc tội.
  naturalness: «đã dùng nó để làm lễ chuộc tội» hơi gượng và thì quá khứ «đã» không phản ánh cấu trúc quy định tổng quát của câu. «cử hành nghi thức chuộc tội bằng lễ vật ấy» tự nhiên, trang trọng, và phù hợp văn cảnh luật tế lễ hơn.
  terminology: «Lễ vật chuộc tội», «lễ vật chuộc lỗi», «thầy tế lễ», và «luật lệ» đều phù hợp. Giữ «chuộc lỗi» cho אָשָׁם giúp phân biệt thuật ngữ này với חַטָּאת, dù trong một số ngữ cảnh có thể gọi là lễ vật đền tội. Chú thích về torah là phù hợp và được giữ lại.
  issues:
  - severity: medium
    issue: Mệnh đề cuối không giữ rõ chủ ngữ và quan hệ sở hữu của câu Hê-bơ-rơ.
    rationale: 'הַכֹּהֵן ... לוֹ יִהְיֶה diễn đạt: thầy tế lễ cử hành việc chuộc tội bằng lễ vật đó sẽ được lễ vật đó. Cách viết hiện tại đặt «lễ vật ấy» làm chủ ngữ và dùng «nó» mơ hồ; cần nêu rõ tương quan giữa vị thầy tế lễ và lễ vật.'
  - severity: low
    issue: «đã dùng nó để làm lễ chuộc tội» không tự nhiên trong quy định pháp lý-nghi lễ.
    rationale: Câu Hê-bơ-rơ mang tính quy định khái quát, không chỉ một hành động đã hoàn tất. «cử hành nghi thức chuộc tội bằng lễ vật ấy» phản ánh tốt hơn động từ כפר với בּוֹ.
