source:
  edition: WLC
  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: vi
  text: Đây là luật về lễ thiêu, lễ vật ngũ cốc, lễ vật chuộc tội[a], lễ vật chuộc lỗi[b], các nghi thức tấn phong[c], và sinh tế bình an[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ có thể nhấn mạnh việc loại bỏ sự ô uế cũng như xử lý tội lỗi.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lễ vật bồi hoàn”. Từ Hê-bơ-rơ có thể nhấn mạnh trách nhiệm do lỗi phạm và sự bồi hoàn phải thực hiện.
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hê-bơ-rơ dùng hình thức số nhiều, có thể hiểu là “các nghi thức tấn phong” hoặc “các nghi thức thánh hiến”, chỉ những thủ tục lập các thầy tế lễ vào chức vụ.
    reason: lexical_alternative
  - marker: d
    text: Cũng có thể dịch là “sinh tế thông công” hoặc “sinh tế an lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Đây là luật lệ
  rationale: Cụm từ mở đầu một câu tổng kết về những quy định tế lễ. “Luật lệ” tự nhiên trong tiếng Việt và diễn đạt תּוֹרָה ở đây là quy định hay chỉ dẫn có tính chuẩn mực.
- source_word: לָעֹלָה
  choice: về lễ thiêu
  rationale: Giới từ לְ chỉ phạm vi áp dụng; עֹלָה là lễ vật được thiêu trọn trên bàn thờ. “Lễ thiêu” ngắn gọn, rõ nghĩa và phù hợp văn cảnh Lê-vi.
- source_word: לַמִּנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong văn cảnh tế lễ của sách Lê-vi, מִנְחָה chỉ lễ vật làm từ sản phẩm ngũ cốc; cách dịch này rõ hơn nghĩa rộng “lễ vật” hay “lễ phẩm”.
- source_word: וְלַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: חַטָּאת có thể chỉ tội lỗi hoặc lễ vật xử lý tội lỗi và tình trạng ô uế. “Lễ vật chuộc tội” quen thuộc và dễ hiểu, còn sắc thái thanh tẩy được bảo tồn trong chú thích.
- source_word: וְלָאָשָׁם
  choice: lễ vật chuộc lỗi
  rationale: אָשָׁם trong hệ thống tế lễ liên quan đến lỗi phạm, trách nhiệm và trong một số trường hợp cả việc bồi hoàn. “Chuộc lỗi” phân biệt tương đối rõ với חַטָּאת mà không loại bỏ sắc thái trách nhiệm.
- source_word: וְלַמִּלּוּאִים
  choice: lễ tấn phong
  rationale: Danh từ số nhiều מִלּוּאִים, theo nghĩa đen liên quan đến việc “làm đầy tay”, chỉ các nghi thức lập các thầy tế lễ vào chức vụ. “Lễ tấn phong” tự nhiên trong tiếng Việt và có thể bao quát cả nghi lễ, không chỉ một lễ vật riêng lẻ.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: sinh tế bình an
  rationale: זֶבַח là sinh tế, còn שְׁלָמִים là loại lễ gắn với sự bình an, an lành và thông công. “Sinh tế bình an” giữ được cấu trúc và thuật ngữ tế lễ của nguyên văn.
theological_decisions:
- issue: Phạm vi nghĩa của חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Nguyên ngữ có thể nhấn mạnh cả việc xử lý tội lỗi lẫn loại bỏ ô uế nghi lễ. Bản chính dùng thuật ngữ dễ nhận biết nhưng chú thích giữ lại phương án thanh tẩy, tránh thu hẹp thần học của từ.
- issue: Bản chất của מִלּוּאִים
  choice: lễ tấn phong
  alternative: các nghi thức tấn phong; lễ vật thánh hiến
  rationale: Hình thức số nhiều và văn cảnh có thể chỉ toàn bộ thủ tục lập chức tư tế chứ không đơn thuần một lễ vật. Vì vậy bản dịch không thêm chữ “lễ vật”, và chú thích nêu rõ phạm vi này.
- issue: Sắc thái của שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công; sinh tế cầu an
  rationale: Từ này có trường nghĩa bao gồm bình an, phúc lành và sự thông công. “Bình an” giữ cách gọi trang trọng, không quyết định độc quyền một cách hiểu; các sắc thái khác được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ cấu trúc liệt kê cô đọng của nguyên văn; các thuật ngữ tế lễ được dịch nhất quán và những sắc thái từ vựng còn tranh luận được bảo tồn trong chú thích.
