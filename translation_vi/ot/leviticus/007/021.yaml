source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: vi
  text: Nếu một người chạm vào bất cứ vật gì ô uế—dù là sự ô uế của người, một con vật ô uế hay bất cứ thứ ghê tởm ô uế nào—rồi ăn thịt của sinh tế bình an thuộc về Đức Giê-hô-va, thì người ấy sẽ bị cắt khỏi dân mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bị cắt khỏi dân mình” là một công thức chế tài trong giao ước. Câu Hê-bơ-rơ không nói rõ phương thức; cách nói này có thể hàm ý bị loại khỏi cộng đồng hoặc chịu sự phán xét của Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Trong văn luật pháp, từ này chỉ một cá nhân, không nhấn mạnh phần hồn tách biệt; “một người” tự nhiên và bao quát trong tiếng Việt.
- source_word: תִגַּע
  choice: chạm vào
  rationale: Giữ nghĩa trực tiếp của động từ và sắc thái tiếp xúc gây ô uế theo nghi lễ.
- source_word: בְּכָל טָמֵא
  choice: bất cứ vật gì ô uế
  rationale: Diễn đạt phạm vi rộng và bất định của cụm Hê-bơ-rơ.
- source_word: טֻמְאַת אָדָם
  choice: sự ô uế từ con người
  rationale: Nêu rõ đây là sự ô uế liên quan đến hoặc phát sinh từ con người, đồng thời duy trì thuật ngữ nhất quán “ô uế” trong câu.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: một con vật ô uế
  rationale: “Con vật” là cách gọi rộng, rõ ràng và phù hợp với ngữ cảnh luật thanh sạch.
- source_word: שֶׁקֶץ טָמֵא
  choice: vật đáng ghê tởm nào bị ô uế
  rationale: Giữ cả sắc thái ghê tởm của שֶׁקֶץ lẫn đặc tính ô uế được nói rõ trong nguyên văn.
- source_word: וְאָכַל מִבְּשַׂר
  choice: rồi ăn thịt
  rationale: Tiếng Việt không cần biểu đạt riêng giới từ phân lượng; “ăn thịt của” tự nhiên và vẫn hàm ý ăn một phần thịt.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sinh tế bình an
  rationale: Giữ thuật ngữ tế lễ truyền thống, trang trọng và tương đối sát cấu trúc Hê-bơ-rơ, không thu hẹp ý thành riêng sự thông công.
- source_word: אֲשֶׁר לַיהוָה
  choice: thuộc về Đức Giê-hô-va
  rationale: Biểu đạt rõ sinh tế được biệt riêng và thuộc về YHWH.
- source_word: יהוה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: sẽ bị loại khỏi dân mình
  rationale: “Bị loại khỏi” giữ hình ảnh chế tài giao ước mà không xác định cơ chế là khai trừ, tử hình hay sự phán xét trực tiếp của Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của công thức chế tài וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: giữ cách nói “sẽ bị loại khỏi dân mình” và không xác định phương thức
  alternative: “sẽ bị khai trừ khỏi dân mình” hoặc “sẽ bị xử tử”
  rationale: Nguyên văn không nói rõ việc bị loại xảy ra bằng khai trừ cộng đồng, cái chết hay sự phán xét của Đức Chúa Trời; bản dịch không nên giải quyết sự mơ hồ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; duy trì thuật ngữ nghi lễ “ô uế” và “sinh tế bình an”. Đại từ “mình” tránh vấn đề giống ngữ pháp của נֶפֶשׁ và áp dụng cho mọi người.
