revisions:
- from: Nếu một người chạm vào bất cứ vật gì ô uế—dù là sự ô uế từ con người, một con vật ô uế hay bất cứ vật đáng ghê tởm nào bị ô uế—rồi ăn thịt của sinh tế bình an thuộc về Đức Giê-hô-va, thì người ấy sẽ bị loại khỏi dân mình.[a]
  to: Nếu một người chạm vào bất cứ vật gì ô uế—dù là sự ô uế của người, một con vật ô uế hay bất cứ thứ ghê tởm ô uế nào—rồi ăn thịt của sinh tế bình an thuộc về Đức Giê-hô-va, thì người ấy sẽ bị cắt khỏi dân mình.[a]
  rationale: Thay “bị loại khỏi” bằng “bị cắt khỏi” để bảo lưu công thức chế tài của nguyên văn và sự mơ hồ vốn có của nó. Điều chỉnh “từ con người” thành “của người” để tránh thu hẹp quan hệ ngữ nghĩa của cụm Hê-bơ-rơ. Các thuật ngữ nghi lễ còn lại được giữ nguyên về ý nghĩa và văn phong.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:52Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc điều kiện và các loại ô uế trong nguyên văn. Tuy nhiên, “bị loại khỏi” có xu hướng giải thích chế tài כרת là khai trừ; “bị cắt khỏi” giữ được công thức nguồn và sự mơ hồ về phương thức chế tài tốt hơn. “Sự ô uế của người” sát với טֻמְאַת אָדָם hơn “sự ô uế từ con người”, vốn có thể gợi riêng nguồn gây ô uế.
  naturalness: Câu văn rõ ràng, trang trọng và phù hợp tiếng Việt hiện đại. Các điều chỉnh đề nghị vẫn giữ nhịp câu tự nhiên trong văn cảnh luật nghi lễ.
  terminology: “Ô uế”, “sinh tế bình an”, và “Đức Giê-hô-va” nhất quán, phù hợp văn phong Kinh Thánh tiếng Việt. “Bị cắt khỏi dân mình” là cách diễn đạt trọng thể, sát công thức chế tài và không ấn định đó là khai trừ hay án chết.
