base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: vi
  text: 'Người ấy phải dâng từ con vật tất cả phần mỡ của nó: đuôi mỡ[a] và phần mỡ bao phủ nội tạng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là chiếc đuôi tích nhiều mỡ của giống cừu đuôi mỡ, một phần mỡ cụ thể được dùng trong tế lễ.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: phần mỡ của nó / phần mỡ
  rationale: Trong luật tế lễ, חֵלֶב chỉ những phần mỡ được dành riêng để dâng; “phần mỡ” vừa trực tiếp vừa làm rõ đây là phần giải phẫu được chỉ định.
- source_word: יַקְרִיב
  choice: phải dâng
  rationale: Thể Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa đem đến để trình dâng hoặc dâng lễ vật. “Phải dâng” tự nhiên trong tiếng Việt và giữ được sắc thái quy định nghi lễ.
- source_word: מִמֶּנּוּ
  choice: từ con vật
  rationale: Đại từ hậu tố hợp lý nhất quy chiếu về con vật hiến tế trong văn cảnh; diễn đạt rõ danh từ giúp tránh cách hiểu là lấy từ người dâng.
- source_word: הָאַלְיָה
  choice: đuôi mỡ
  rationale: אַלְיָה là chiếc đuôi tích mỡ của giống cừu đuôi mỡ, một phần cụ thể được dùng trong tế lễ; “đuôi mỡ” chính xác hơn “đuôi” đơn thuần.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: bao phủ nội tạng
  rationale: קֶרֶב ở đây chỉ các cơ quan bên trong con vật; “nội tạng” là cách nói hiện đại, rõ ràng và phù hợp với mô tả giải phẫu.
- source_word: כָּל
  choice: tất cả
  rationale: כָּל nhấn mạnh toàn bộ các phần mỡ được chỉ định; “tất cả” chuyển tải trực tiếp ý này.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng tự nhiên trong tiếng Việt hiện đại. Dùng “người ấy” để giữ chủ thể số ít không nêu rõ danh tính từ văn cảnh, và “con vật” để làm rõ đối tượng của מִמֶּנּוּ. Không thêm chú thích cho יַקְרִיב vì “dâng” bao quát thích hợp cả sắc thái trình dâng và hiến dâng trong tiếng Việt.
