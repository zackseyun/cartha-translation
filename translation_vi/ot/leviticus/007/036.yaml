revisions:
- from: Đó là phần mà Yahweh đã truyền phải ban cho họ từ con dân Israel vào ngày Ngài xức dầu cho họ, làm một quy định đời đời trải qua các thế hệ của họ.[a][b]
  to: Đó là phần mà Yahweh đã truyền phải được ban cho họ từ dân Israel, vào ngày Ngài xức dầu cho họ—một quy định đời đời cho các thế hệ của họ.[a][b]
  rationale: Sửa cấu trúc bị động để làm rõ rằng các phần được ban cho các thầy tế lễ, thay “làm” bằng cấu trúc đồng vị tự nhiên hơn cho công thức pháp lý, và chuẩn hóa chú thích sát với tiếng Hê-bơ-rơ. Không thay đổi sở chỉ ngữ cảnh của “Đó là phần” hay phạm vi còn có thể bàn luận của “đời đời.”
  reviewer_model: gpt-5.6-terra
