  text: אֲשֶׁר֩ צִוָּ֨ה יְהוָ֜ה לָ/תֵ֣ת לָ/הֶ֗ם בְּ/יוֹם֙ מָשְׁח֣/וֹ אֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: vi
  text: Đó là phần mà Yahweh đã truyền phải được ban cho họ từ dân Israel, vào ngày Ngài xức dầu cho họ—một quy định đời đời cho các thế hệ của họ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ các con trai của Israel”; cũng có thể dịch: “từ dân Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một quy định vĩnh viễn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Đó là phần mà
  rationale: Mệnh đề quan hệ chỉ về các phần dành cho các thầy tế lễ trong văn cảnh trước; thêm “phần” để câu tiếng Việt rõ và tự nhiên mà không đổi sở chỉ.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Giữ sắc thái mệnh lệnh có thẩm quyền của Thiên Chúa trong ngữ cảnh luật pháp.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Thiên Chúa trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: לָתֵת לָהֶם
  choice: phải ban cho họ
  rationale: 'Cấu trúc này diễn đạt tự nhiên ý bị động/nghĩa vụ trong tiếng Việt: các phần ấy được lệnh phải ban cho Aaron và các con trai ông.'
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: vào ngày Ngài xức dầu cho họ
  rationale: Giữ hình ảnh cụ thể “xức dầu” và cách nói chỉ thời điểm; “Ngài” quy chiếu tự nhiên về Yahweh.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: từ con dân Israel
  rationale: “Con dân Israel” là cách diễn đạt tiếng Việt trang trọng, tự nhiên cho thành ngữ nghĩa đen “các con trai Israel,” đồng thời bao quát cộng đồng Israel trong ngữ cảnh.
- source_word: חֻקַּת עוֹלָם
  choice: một quy định đời đời
  rationale: “Quy định” phù hợp văn cảnh luật nghi lễ; “đời đời” giữ sức nặng về tính lâu dài của עוֹלָם mà không giải quyết quá mức phạm vi thần học.
- source_word: לְדֹרֹתָם
  choice: trải qua các thế hệ của họ
  rationale: Diễn đạt sự tiếp tục áp dụng qua những thế hệ nối tiếp, sát nghĩa và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; giữ “Yahweh” bảo tồn danh riêng giao ước thay vì thay bằng tước hiệu.
- issue: Sức nghĩa của עוֹלָם trong luật lệ tế lễ
  choice: đời đời
  alternative: vĩnh viễn; lâu dài
  rationale: “Đời đời” giữ công thức pháp lý-giao ước về hiệu lực bền lâu qua các thế hệ, nhưng câu dịch không áp đặt kết luận thần học vượt quá văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu nối với phần liệt kê ở câu trước bằng “Đó là phần mà”; giữ thuật ngữ nghi lễ “xức dầu” và danh riêng “Yahweh.”
