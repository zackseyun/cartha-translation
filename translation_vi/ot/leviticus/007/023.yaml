  source_fidelity: 'Bản dịch truyền đạt đúng công thức mệnh lệnh: lời phán bảo Môi-se nói với toàn thể dân Israel, tiếp theo là lệnh cấm số nhiều. “Không được ăn bất cứ mỡ nào” phản ánh đầy đủ phạm vi của כָּל trong câu phủ định, và danh mục “bò, chiên hay dê” tương ứng chính xác với שׁוֹר, כֶּשֶׂב, עֵז. “Mỡ” giữ nghĩa rộng cần thiết của חֵלֶב, không diễn giải quá mức sang một loại mỡ cụ thể.'
  naturalness: Văn câu tự nhiên, rõ ràng trong tiếng Việt hiện đại, đồng thời vẫn giữ sắc thái trang trọng thích hợp cho văn bản luật pháp. “Con dân Israel” là cách gọi tập thể dễ hiểu; “các ngươi không được” bảo toàn ngôi thứ hai số nhiều và lực cấm của nguyên văn.
  terminology: Các thuật ngữ “Israel,” “mỡ,” “bò, chiên hay dê” nhất quán với cách dùng Kinh Thánh tiếng Việt và không thêm giới tính hoặc phân loại không có trong bản Hê-bơ-rơ. Chú thích giải thích hợp lý việc bản dịch dùng cách gọi tập thể thay cho cách đọc đen “các con trai của Israel.”
