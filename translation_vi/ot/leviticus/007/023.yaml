  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: vi
  text: 'Hãy nói với con dân Israel[a] rằng: Các ngươi không được ăn bất cứ mỡ nào của bò, chiên hay dê.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “các con trai của Israel”; cụm này chỉ chung dân Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Động từ Piel mệnh lệnh ngôi hai số ít, là lời truyền trực tiếp cho Môi-se; “Hãy nói” tự nhiên và giữ được công thức pháp luật.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Israel”, nhưng trong ngữ cảnh chỉ toàn thể cộng đồng giao ước; “con dân Israel” vừa trang trọng, vừa có tính tập thể và không giới hạn ở nam giới.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Đây là động từ nguyên mẫu dùng để dẫn lời. Tiếng Việt hiện đại thường chuyển tự nhiên bằng “rằng” thay vì cấu trúc nặng tính sao phỏng như “mà nói rằng”.
- source_word: כָּל
  choice: bất cứ ... nào
  rationale: Trong câu cấm với danh từ khối, cấu trúc “không ... bất cứ ... nào” diễn đạt rõ phạm vi bao quát.
- source_word: חֵלֶב
  choice: mỡ
  rationale: Chỉ mỡ động vật, đặc biệt những phần mỡ được quy định trong luật tế lễ. “Mỡ” là từ phổ thông và đủ rộng; không thu hẹp thành một loại mỡ cụ thể.
- source_word: שׁוֹר
  choice: bò
  rationale: Chỉ gia súc thuộc loài bò mà không nhất thiết xác định giới tính; “bò” là cách gọi loại vật tự nhiên trong tiếng Việt.
- source_word: כֶשֶׂב
  choice: chiên
  rationale: Chỉ con vật thuộc loài chiên nói chung trong danh mục gia súc; không nên thu hẹp thành chiên con hay chiên đực.
- source_word: עֵז
  choice: dê
  rationale: Là tên gọi chung cho dê trong danh mục vật nuôi; “dê” là tương đương tự nhiên và không thêm giới tính.
- source_word: לֹא תֹאכֵלוּ
  choice: Các ngươi không được ăn
  rationale: Thể chưa hoàn thành với phủ định trong văn luật pháp diễn đạt lệnh cấm. “Không được ăn” rõ và tự nhiên trong tiếng Việt, còn “các ngươi” giữ ngôi hai số nhiều của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “con dân Israel” cho đối tượng tập thể và “các ngươi” để giữ sự chuyển đổi từ lời truyền cho Môi-se ở số ít sang mệnh lệnh dành cho cộng đồng ở số nhiều.
