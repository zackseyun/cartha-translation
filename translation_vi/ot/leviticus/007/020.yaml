  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: vi
  text: Nhưng người nào ăn thịt của sinh tế bình an thuộc về Đức Giê-hô-va trong khi sự ô uế vẫn còn trên mình, thì người ấy sẽ bị dứt khỏi dân mình[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ bị loại khỏi dân mình.” Cụm từ “bị dứt khỏi” có thể nói đến việc bị khai trừ hoặc phải chết, nhưng ở đây tiếng Hê-bơ-rơ không xác định cách thức.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: người nào / người ấy
  rationale: Trong luật lệ này, נֶפֶשׁ chỉ một cá nhân, không nhấn mạnh phần linh hồn phi vật chất. Cách diễn đạt này tự nhiên trong câu luật điều kiện và không giới hạn giới tính.
- source_word: תֹּאכַל
  choice: ăn
  rationale: Thể chưa hoàn thành diễn tả trường hợp tổng quát trong luật tình huống; tiếng Việt dùng cấu trúc “người nào ăn” một cách tự nhiên.
- source_word: בָּשָׂר
  choice: thịt
  rationale: Trong bối cảnh thực phẩm từ sinh tế, “thịt” rõ nghĩa và tự nhiên hơn “xác thịt”.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: thịt của sinh tế giao hòa
  rationale: זֶבַח chỉ sinh tế, còn שְׁלָמִים là loại lễ vật gắn với sự trọn vẹn, bình an và giao hòa. “Sinh tế giao hòa” là thuật ngữ trang trọng, dễ hiểu, đồng thời tránh giải nghĩa quá mức thành một loại nghi lễ thông công cụ thể.
- source_word: אֲשֶׁר לַיהוָה
  choice: thuộc về Đức Giê-hô-va
  rationale: Cụm này biểu thị sinh tế được biệt riêng và thuộc về YHWH. “Thuộc về” truyền đạt rõ ý sở hữu thiêng liêng.
- source_word: יהוה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi riêng quen thuộc trong tiếng Việt để phân biệt danh giao ước יהוה với tước hiệu “Chúa”, thay vì che khuất tên riêng trong nguyên văn.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: trong khi sự ô uế vẫn còn trên mình
  rationale: Giữ hình ảnh Hê-bơ-rơ rằng sự ô uế ở “trên” người ấy, đồng thời thêm “vẫn còn” để câu tiếng Việt diễn đạt tự nhiên tình trạng nghi lễ đang tiếp diễn.
- source_word: וְנִכְרְתָה
  choice: sẽ bị dứt khỏi
  rationale: Động từ כרת ở thể bị động là công thức pháp lý nghiêm trọng về việc bị loại khỏi cộng đồng. “Bị dứt khỏi” giữ được hình ảnh nguyên văn mà không quyết định phương thức thi hành.
- source_word: מֵעַמֶּיהָ
  choice: khỏi dân mình
  rationale: Đại từ giống cái trong tiếng Hê-bơ-rơ hòa hợp ngữ pháp với נֶפֶשׁ, không xác định giới tính sinh học. “Dân mình” vừa tự nhiên vừa trung tính trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của công thức hình phạt וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: sẽ bị dứt khỏi dân mình
  alternative: sẽ bị khai trừ khỏi dân mình; sẽ phải chết hoặc bị xử tử
  rationale: Nguyên văn nói đến sự loại bỏ nghiêm trọng khỏi cộng đồng giao ước nhưng không nêu rõ ở đây đó là khai trừ, cái chết do Đức Chúa Trời giáng xuống hay án tử hình. Bản chính giữ cách nói hình tượng; chú thích bảo toàn các khả năng.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Cấu trúc “người nào… thì người ấy…” giúp người đọc phổ thông nhận ra tính chất điều kiện. “Sự ô uế vẫn còn trên mình” cố ý giữ hình ảnh pháp lễ của nguyên văn; “bị dứt khỏi” bảo toàn tính nghiêm trọng và sự mơ hồ của hình phạt.
