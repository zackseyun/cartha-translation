revisions:
- from: Nhưng người nào ăn thịt của sinh tế giao hòa thuộc về Đức Giê-hô-va trong khi sự ô uế vẫn còn trên mình, thì người ấy sẽ bị dứt khỏi dân mình[a].
  to: Nhưng người nào ăn thịt của sinh tế bình an thuộc về Đức Giê-hô-va trong khi sự ô uế vẫn còn trên mình, thì người ấy sẽ bị dứt khỏi dân mình[a].
  rationale: Chỉ thay thuật ngữ chỉ loại sinh tế để tránh đưa ý “giao hòa” vào tên gọi nghi lễ khi nguyên văn không xác định riêng nghĩa đó. Các phần còn lại được giữ nguyên vì truyền đạt trung thành ý nghĩa và sự mơ hồ của nguyên văn.
  reviewer_model: gpt-5.6-terra
