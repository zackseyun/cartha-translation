source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכְלֶ֑/נּוּ בְּ/מָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: vi
  text: Mọi người nam thuộc hàng tế lễ đều được ăn lễ vật ấy[a]; lễ vật ấy phải được ăn tại một nơi thánh. Đó là vật chí thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi người nam thuộc hàng tế lễ sẽ ăn lễ vật ấy.” Động từ Hê-bơ-rơ có thể được dịch sát hình thức hơn như vậy, nhưng trong ngữ cảnh luật tế lễ, câu chủ yếu xác định những người được phép ăn.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “thánh của các vật thánh”, một thành ngữ chỉ cấp độ thánh cao nhất, tức “chí thánh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: Mọi người nam trong số các thầy tế lễ
  rationale: Giữ đủ ý phân phối của כָּל, sự chỉ định giới tính của זָכָר và tư cách thành viên trong nhóm tư tế của בַּכֹּהֲנִים; cách diễn đạt tự nhiên và không mở rộng quy định sang mọi thầy tế lễ.
- source_word: יֹאכְלֶנּוּ
  choice: đều được ăn lễ vật ấy
  rationale: Dạng vị hoàn trong ngữ cảnh luật tế lễ diễn tả quyền được phép hưởng phần lễ vật; “được ăn” truyền đạt rõ sự cho phép hơn một thì tương lai đơn thuần.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: tại một nơi thánh
  rationale: Danh từ không có mạo từ xác định; “một nơi thánh” giữ tính không xác định và tránh đồng nhất không cần thiết với một khu vực riêng biệt trong nơi thánh.
- source_word: יֵאָכֵל
  choice: phải được ăn
  rationale: Dạng Nifal thụ động nêu quy định bắt buộc về địa điểm ăn; “phải được ăn” bảo toàn cả thể thụ động lẫn sắc thái pháp lệnh.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Thành ngữ Hê-bơ-rơ chỉ cấp độ thánh cao nhất của lễ vật. “Chí thánh” trang trọng, gọn và quen thuộc; thêm “vật” làm rõ đây là sự phân loại lễ vật chứ không phải tên của gian cực thánh.
- source_word: הוּא
  choice: Đó là
  rationale: Đại từ trở lại lễ vật đang được nói đến; “Đó là” tạo câu vị ngữ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Giới hạn quyền ăn cho người nam thuộc hàng tư tế
  choice: Mọi người nam trong số các thầy tế lễ đều được ăn lễ vật ấy
  alternative: Mọi thầy tế lễ đều được ăn lễ vật ấy
  rationale: Bản Hê-bơ-rơ nói rõ זָכָר, “người nam”; không nên khái quát thành toàn thể các thầy tế lễ mà xóa đi giới hạn giới tính của quy định tế tự.
- issue: Sắc thái của יֹאכְלֶנּוּ trong luật tế lễ
  choice: được ăn
  alternative: phải ăn
  rationale: Ngữ cảnh có thể cho phép cách dịch mệnh lệnh “phải ăn”, nhưng câu chủ yếu xác định những ai có quyền ăn; bản dịch chính giữ sắc thái cho phép, đồng thời chú thích khả năng dịch hình thức hơn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh phổ thông; lặp “lễ vật ấy” thay cho nhiều đại từ “nó” để giữ sự trang nghiêm và làm rõ vật quy chiếu. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
