base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: vi
  text: 'Đây là luật về lễ vật chuộc lỗi[a]: lễ vật ấy là chí thánh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật đền bù” hoặc “lễ vật bồi thường”. Từ Hê-bơ-rơ asham chỉ một loại tế lễ gắn với lỗi phạm và việc đền bù.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Đây là
  rationale: Liên từ וְ cùng đại từ chỉ định זֹאת mở đầu một phần quy định mới. “Đây là” tự nhiên trong tiếng Việt và không thêm ý thời gian vốn không có trong nguyên văn.
- source_word: תּוֹרַת
  choice: luật về
  rationale: Trong ngữ cảnh tế lễ, תּוֹרָה chỉ quy định được đặt ra cho một loại lễ vật. “Luật về” vừa sát cấu trúc Hê-bơ-rơ vừa rõ ràng với độc giả hiện đại.
- source_word: הָ/אָשָׁם
  choice: lễ vật chuộc lỗi
  rationale: אָשָׁם là tên một loại tế lễ cụ thể gắn với tình trạng mắc lỗi và việc đền bù. “Lễ vật chuộc lỗi” giữ được khía cạnh lỗi phạm, còn những sắc thái đền bù được nêu trong chú thích.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Cấu trúc nhấn mạnh bậc cao nhất của sự thánh khiết. “Chí thánh” là cách diễn đạt trang trọng, gọn và không dễ bị hiểu nhầm là tên của gian cực thánh trong nơi thánh.
- source_word: הוּא
  choice: đó là
  rationale: Đại từ đóng vai trò chủ ngữ trong mệnh đề vị ngữ, xác định lễ vật này thuộc hạng “chí thánh”; tiếng Việt tự nhiên cần có “đó là”.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ אָשָׁם
  choice: lễ vật chuộc lỗi
  alternative: lễ vật đền bù; lễ vật bồi thường
  rationale: Cách dịch chính giữ khía cạnh lỗi phạm của loại tế lễ này mà không thu hẹp nó vào một học thuyết riêng. Vì אָשָׁם cũng gắn với việc hoàn trả hoặc đền bù, các cách dịch làm nổi bật sắc thái ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lễ vật” để gọi loại tế lễ, và “chí thánh” để diễn đạt cấp độ thánh khiết cao nhất trong hệ thống nghi lễ.
