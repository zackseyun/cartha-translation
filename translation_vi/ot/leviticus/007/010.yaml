base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: vi
  text: Mọi lễ vật ngũ cốc, dù trộn với dầu hay khô, sẽ thuộc về tất cả các con trai A-rôn; mỗi người đều được một phần như nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát chữ: “mỗi người như người anh em của mình.” Thành ngữ Hê-bơ-rơ nhấn mạnh việc phân chia đồng đều giữa các con trai A-rôn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong bối cảnh tế lễ của sách Lê-vi, từ này chỉ lễ vật làm từ ngũ cốc chứ không phải lễ vật nói chung.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: trộn với dầu
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại và phản ánh cách chuẩn bị lễ vật.
- source_word: חֲרֵבָה
  choice: để khô
  rationale: Giữ hình ảnh 'khô' và sự tương phản với lễ vật trộn dầu, không giải nghĩa quá mức thành 'không có dầu'.
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: đều sẽ thuộc về tất cả các con trai A-rôn
  rationale: Cụm giới từ đi với động từ 'là' biểu thị quyền hưởng hoặc sự phân chia; cách dịch này rõ nghĩa pháp lý và giữ nguyên đối tượng.
- source_word: בְּנֵי אַהֲרֹן
  choice: các con trai A-rôn
  rationale: Giữ ngôn ngữ thân tộc giống đực rõ ràng của nguyên văn trong bối cảnh chức tế lễ.
- source_word: אִישׁ כְּאָחִיו
  choice: mỗi người được phần như anh em mình
  rationale: Thành ngữ mang ý phân phối đồng đều; bản dịch giữ phép so sánh nhưng bổ sung 'được phần' để câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Ngôn ngữ giống đực về hàng tư tế
  choice: các con trai A-rôn ... anh em mình
  alternative: con cháu A-rôn ... mỗi người như nhau
  rationale: Nguyên văn dùng các danh từ thân tộc giống đực trong luật lệ về tư tế; giữ cách gọi này tránh trung tính hóa một chi tiết có thật của văn bản.
- issue: Ý nghĩa phân phối của אִישׁ כְּאָחִיו
  choice: mỗi người được phần như anh em mình
  alternative: mỗi người đều như anh em mình
  rationale: Ngữ cảnh nói về quyền hưởng lễ vật nên 'được phần' làm rõ chức năng của thành ngữ mà không xác định thêm cách thức hoặc số lượng phân chia.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “lễ vật ngũ cốc” để phân biệt loại tế lễ này với lễ vật nói chung; giữ “các con trai A-rôn” theo giới tính của nguyên văn.
