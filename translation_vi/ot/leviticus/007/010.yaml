  source_fidelity: 'Cần sửa hai điểm để phản ánh sát tiếng Hê-bơ-rơ: חֲרֵבָה nghĩa là “khô”, không phải hành động “để khô”; và אִישׁ כְּאָחִיו là thành ngữ phân chia bình đẳng. “Mỗi người đều được một phần như nhau” diễn đạt đúng hiệu lực phân phối của thành ngữ mà không thêm chi tiết.'
  naturalness: 'Bản sửa dùng cấu trúc tự nhiên, rõ ràng trong tiếng Việt hiện đại: “dù ... hay ...” cho hai loại lễ vật, và “mỗi người đều được một phần như nhau” cho sự phân chia.'
