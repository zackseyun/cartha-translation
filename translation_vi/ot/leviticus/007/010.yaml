revisions:
- from: Mọi lễ vật ngũ cốc trộn với dầu hoặc để khô đều sẽ thuộc về tất cả các con trai A-rôn, mỗi người được phần như anh em mình.[a]
  to: Mọi lễ vật ngũ cốc, dù trộn với dầu hay khô, sẽ thuộc về tất cả các con trai A-rôn; mỗi người đều được một phần như nhau.[a]
  rationale: Sửa “để khô” thành “khô” để giữ đúng giá trị tính từ của nguyên văn. Sửa mệnh đề cuối thành một cách diễn đạt tiếng Việt tự nhiên, phản ánh nghĩa phân phối bình đẳng của thành ngữ Hê-bơ-rơ; chú thích tại đúng vị trí bảo lưu cách diễn đạt sát chữ và giải thích thành ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:45:26Z'
