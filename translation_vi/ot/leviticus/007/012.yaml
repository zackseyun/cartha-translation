  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: vi
  text: Nếu người ấy dâng lễ vật ấy để tạ ơn[a], thì cùng với sinh tế tạ ơn, người ấy phải dâng những bánh không men trộn với dầu, những bánh mỏng không men phết dầu[b], và những bánh làm bằng bột mịn, được chế biến kỹ[c] và trộn với dầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dâng lễ vật ấy làm lễ tạ ơn.” Từ Hê-bơ-rơ ở đây chỉ lễ vật được dâng để bày tỏ lòng tạ ơn.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng một từ cũng có thể dịch là “xức dầu” hoặc “bôi dầu”; ở đây từ ấy nói về việc phết dầu lên bánh trong quá trình chế biến.
    reason: lexical_alternative
  - marker: c
    text: Ý nghĩa chính xác của thuật ngữ Hê-bơ-rơ chỉ cách chế biến này chưa chắc chắn; có thể nói đến bột hoặc bánh được trộn, nhào, hoặc chế biến kỹ. Cụm kế tiếp nêu rõ rằng các bánh ấy được trộn với dầu.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: để tạ ơn / sinh tế tạ ơn
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ sự tạ ơn và xác định loại sinh tế bình an đang được nói đến. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ rõ ý nghĩa tạ ơn.
- source_word: יַקְרִיבֶנּוּ
  choice: dâng lễ vật đó
  rationale: Thể Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến để dâng. Việc nêu rõ “lễ vật đó” giúp đại từ chỉ đối tượng được tự nhiên trong tiếng Việt.
- source_word: זֶבַח הַתּוֹדָה
  choice: sinh tế tạ ơn
  rationale: זֶבַח chỉ sinh tế, thường hàm ý con vật bị giết làm lễ vật; תּוֹדָה xác định đây là sinh tế được dâng để tạ ơn.
- source_word: חַלּוֹת מַצּוֹת
  choice: những bánh không men
  rationale: חַלּוֹת chỉ những ổ hoặc bánh, còn מַצּוֹת xác định bánh không có men. “Bánh không men” là cách nói rõ ràng, quen thuộc.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: nhào với dầu
  rationale: בלל diễn tả việc trộn các thành phần. Với bột làm bánh, “nhào với dầu” là cách diễn đạt tự nhiên, dù từ Hê-bơ-rơ tự nó có nghĩa rộng hơn là “trộn”.
- source_word: רְקִיקֵי מַצּוֹת
  choice: những bánh mỏng không men
  rationale: רְקִיקִים là loại bánh mỏng; cách dịch “bánh mỏng” dễ hiểu hơn “bánh xốp” hoặc một thuật ngữ ẩm thực hiện đại có thể gây sai lệch.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: phết dầu
  rationale: משׁח có thể là xức, bôi hoặc phết. Trong ngữ cảnh chế biến thức ăn, “phết dầu” truyền đạt đúng thao tác mà không gợi quá mức đến nghi thức xức dầu.
- source_word: סֹלֶת
  choice: bột mì mịn
  rationale: סֹלֶת là bột mịn hảo hạng dùng trong lễ vật. “Bột mì mịn” rõ nghĩa với độc giả hiện đại và phù hợp với nguyên liệu làm bánh trong ngữ cảnh.
- source_word: מֻרְבֶּכֶת
  choice: được trộn kỹ
  rationale: Ý nghĩa chính xác của thuật ngữ chế biến này chưa chắc chắn; nó có thể chỉ bột được trộn, nhào hoặc chế biến kỹ. “Được trộn kỹ” giữ sự thận trọng và phù hợp với ngữ cảnh.
- source_word: חַלֹּת
  choice: những bánh
  rationale: Từ này chỉ các đơn vị bánh. Không cần dùng một tên bánh chuyên biệt vì nguyên văn không cho đủ chi tiết để xác định hình dạng chính xác.
theological_decisions:
- issue: Mối liên hệ của תּוֹדָה với loại lễ vật trong câu
  choice: dịch là hành động và sinh tế “tạ ơn”
  alternative: “lễ vật cảm tạ” hoặc “lễ vật ngợi khen”
  rationale: “Tạ ơn” bảo toàn nghĩa trực tiếp của תּוֹדָה trong ngữ cảnh này mà không mở rộng thành một phạm trù thần học hoặc nghi lễ không được câu văn nêu rõ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “người ấy” thay cho đại từ mang dấu giới tính vì chủ thể được hiểu từ quy định trước đó. “Sinh tế” phân biệt phần con vật hiến tế với các bánh được dâng kèm. Các thao tác ẩm thực được diễn đạt bằng từ phổ thông, đồng thời chú thích những chỗ nguyên ngữ còn có thể hiểu theo cách khác.
