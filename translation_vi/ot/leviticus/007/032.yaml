revisions:
- from: Các ngươi phải lấy đùi phải từ những sinh tế bình an của mình mà dâng làm phần đóng góp cho thầy tế lễ.[a][b]
  to: Các ngươi phải dâng đùi phải làm phần trích dâng cho thầy tế lễ, lấy từ các sinh tế bình an của mình.[a][b][c]
  rationale: Bản sửa đặt động từ chính “dâng” ở đầu câu, xác định “đùi phải” là phần trích dâng, rồi nêu rõ phần đó được lấy từ các sinh tế bình an của người nghe. Cấu trúc này trung thành với trật tự quan hệ nghĩa của tiếng Hê-bơ-rơ và tự nhiên hơn trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:44:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng phần được chỉ định (đùi phải), nguồn lấy phần ấy (từ các sinh tế bình an của các ngươi), và người nhận số ít (thầy tế lễ). Tuy nhiên, cụm “lấy ... mà dâng làm phần đóng góp” làm quan hệ cú pháp giữa hành động dâng, phần trích dâng, và nguồn tế lễ kém rõ hơn nguyên văn.
  naturalness: “Dâng làm phần đóng góp” không tự nhiên trong tiếng Việt nghi lễ/pháp quy hiện đại. “Dâng ... làm phần trích dâng” diễn đạt rõ đây là phần được biệt riêng để trao cho thầy tế lễ.
  terminology: Giữ “đùi phải,” “thầy tế lễ,” và “sinh tế bình an.” Đổi “phần đóng góp” thành “phần trích dâng” để phản ánh תְּרוּמָה như một phần được dành riêng, không gợi một khoản đóng góp tự nguyện theo nghĩa hiện đại. Chú thích bổ sung phương án cho תְּרוּמָה tương ứng với audit trail tiếng Anh.
  issues:
