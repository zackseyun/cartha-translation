    rationale: תְּרוּמָה chỉ phần được dành riêng/dâng nộp; “phần trích dâng” vừa rõ chức năng nghi lễ vừa tự nhiên hơn trong tiếng Việt.
  - severity: low
    issue: Chú thích chưa bảo lưu phương án dịch cho תְּרוּמָה.
    rationale: Bản audit trail tiếng Anh nêu các phương án “offering/heave offering”; nên có chú thích tương ứng để minh bạch lựa chọn thuật ngữ.
