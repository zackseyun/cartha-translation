  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: vi
  text: Các ngươi phải dâng đùi phải làm phần trích dâng cho thầy tế lễ, lấy từ các sinh tế bình an của mình.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “chân phải.”
    reason: lexical_alternative
  - marker: b
    text: Hay “lễ vật”; theo cách dịch truyền thống, “lễ vật dâng đưa lên.”
    reason: lexical_alternative
  - marker: c
    text: “Sinh tế bình an” cũng có thể dịch là “sinh tế thông công” hoặc “sinh tế cầu an lành.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: đùi
  rationale: Chỉ phần trên của chân con vật; “đùi” chính xác hơn “chân” trong ngữ cảnh phân chia phần thịt tế lễ.
- source_word: הַיָּמִין
  choice: phải
  rationale: Giữ rõ bên phải, là phần được chỉ định trong quy định tế lễ.
- source_word: תִּתְּנוּ
  choice: các ngươi phải ... dâng
  rationale: Diễn đạt thể chỉ thị pháp quy của động từ ngôi thứ hai số nhiều bằng tiếng Việt hiện đại, trang trọng.
- source_word: תְרוּמָה
  choice: phần đóng góp
  rationale: Chỉ phần được biệt riêng và trao cho thầy tế lễ; cách dịch này dễ hiểu hơn thuật ngữ truyền thống “lễ vật dâng đưa lên” và không giả định một động tác nghi lễ cụ thể.
- source_word: לַכֹּהֵן
  choice: cho thầy tế lễ
  rationale: Giữ số ít và quan hệ người nhận của nguyên văn.
- source_word: מִזִּבְחֵי
  choice: từ những sinh tế ... của mình
  rationale: Giới từ מִן chỉ nguồn mà phần dành cho thầy tế lễ được lấy ra; hậu tố ngôi thứ hai số nhiều được thể hiện qua “của mình” với chủ ngữ “các ngươi”.
- source_word: שַׁלְמֵיכֶם
  choice: bình an
  rationale: “Sinh tế bình an” là cách gọi dễ nhận biết trong tiếng Việt; chú thích bảo lưu các sắc thái “thông công” và “an lành” của thuật ngữ Hê-bơ-rơ.
- source_word: וְאֵת
  choice: và (thể hiện bằng sự nối tiếp của câu)
  rationale: וְ nối quy định này với văn cảnh trước, còn אֵת là dấu hiệu tân ngữ không cần dịch riêng; trong câu Việt, mạch nối được thể hiện tự nhiên mà không nhất thiết mở đầu bằng “và”.
theological_decisions: []
translation_notes:
  register: Văn phong pháp quy, trang trọng nhưng hiện đại. Dùng “các ngươi” để biểu thị rõ ngôi thứ hai số nhiều trong lời chỉ dẫn; “thầy tế lễ” là thuật ngữ phổ thông. Cấu trúc được điều chỉnh tự nhiên trong tiếng Việt nhưng vẫn giữ nguồn của phần dâng, phần thân thể được chỉ định và người nhận.
