    rationale: Bản nguồn dùng danh riêng יהוה; audit trail của POB quy định chuyển tự danh này là “Yahweh”. “Đức” là phần bổ sung ngoài văn bản nguồn, còn “Giê-hô-va” là dạng truyền thống khác với lựa chọn thuật ngữ của dự án.
  - severity: low
    issue: Thiếu chú thích neo cho danh Yahweh/YHWH.
    rationale: Audit trail tiếng Anh có chú thích giải thích rằng bản Hê-bơ-rơ ghi YHWH và truyền thống dịch bằng một dạng thay thế. Thêm chú thích tương ứng giúp minh bạch quyết định dịch thuật mà không thay đổi ý nghĩa câu.
