  source_fidelity: 'Cấu trúc câu được giữ đúng: động từ tường thuật, danh Đức Chúa Trời, đối tượng gián tiếp Môi-se, và công thức לֵאמֹר mở đầu nội dung lời phán tiếp theo. Tuy nhiên, “Đức Giê-hô-va” vừa không theo quyết định nhất quán của POB là chuyển tự danh YHWH thành “Yahweh”, vừa thêm yếu tố tôn xưng “Đức” không có trong bản Hê-bơ-rơ.'
  naturalness: “Phán với Môi-se rằng:” là tiếng Việt hiện đại, trang trọng, tự nhiên trong văn cảnh Kinh Thánh và thích hợp vì nội dung lời phán tiếp diễn ở câu sau.
  terminology: Nên dùng “Yahweh” để phản ánh trực tiếp và nhất quán danh יהוה theo audit trail tiếng Anh. “Môi-se” là dạng tên riêng quen thuộc và chấp nhận được trong tiếng Việt.
