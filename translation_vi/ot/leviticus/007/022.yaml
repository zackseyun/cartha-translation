base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống được dịch là “Đức Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר với dạng kể tiếp mở đầu một đơn vị lời phán mới; “phán” là cách diễn đạt tiếng Việt tự nhiên, trang trọng khi Đức Chúa Trời nói.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển tự danh riêng YHWH theo dạng đã quen thuộc rộng rãi trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, từ này biểu thị người tiếp nhận lời phán và phù hợp với cú pháp tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng משה quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức dẫn lời này báo hiệu nội dung theo sau; “rằng” tự nhiên hơn “nói rằng” sau động từ “phán” và tránh lặp từ.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” giữ đây là danh riêng, dùng hình thức quen thuộc với độc giả Việt và không thay bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích; giữ nguyên chức năng của công thức mở đầu lời phán trong văn luật pháp. Không dùng chú thích vì bản dịch chính đã thể hiện danh riêng.
