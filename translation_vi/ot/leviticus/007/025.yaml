source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: vi
  text: Vì bất cứ ai ăn mỡ từ một con vật mà người ta dâng một lễ vật dâng bằng lửa[a] lên Đức Giê-hô-va, thì người ăn mỡ ấy sẽ bị cắt đứt khỏi dân mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thực phẩm”. Từ Hê-bơ-rơ chỉ lễ vật được dâng bằng lửa trên bàn thờ.
    reason: lexical_alternative
  - marker: b
    text: “Bị cắt đứt” giữ nguyên công thức pháp lý Hê-bơ-rơ. Hình phạt chính xác vẫn còn được tranh luận; cụm từ này có thể hàm ý bị loại khỏi cộng đồng, phải chết hoặc chịu sự phán xét của Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Liên từ nêu lý do cho điều cấm ở câu trước; “Vì” giữ rõ mối liên kết lập luận.
- source_word: כָּל אֹכֵל
  choice: bất cứ ai ăn
  rationale: Diễn đạt tự nhiên một trường hợp tổng quát, đồng thời giữ lực phổ quát của cấu trúc Hê-bơ-rơ.
- source_word: חֵלֶב
  choice: mỡ
  rationale: Chỉ phần mỡ động vật, đặc biệt là những phần mỡ dành riêng trong luật tế lễ; “mỡ” là cách gọi rõ ràng, thông dụng.
- source_word: מִן הַבְּהֵמָה
  choice: của một con vật
  rationale: בְּהֵמָה ở đây chỉ con vật thuộc bối cảnh tế lễ. Cách diễn đạt này tự nhiên trong tiếng Việt và không thu hẹp quá mức thành một loại gia súc cụ thể.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: mà từ đó người ta dâng
  rationale: Động từ Hê-bơ-rơ ở số ít với chủ thể không xác định; “người ta” thể hiện chủ thể phiếm chỉ, còn “từ đó” giữ ý lễ vật được lấy từ con vật ấy.
- source_word: אִשֶּׁה
  choice: lễ vật hỏa tế
  rationale: Thuật ngữ tế lễ chỉ lễ vật được đưa lên bàn thờ và thiêu bằng lửa. “Lễ vật hỏa tế” ngắn gọn, trang trọng và giữ liên hệ trực tiếp với lửa mà không khẳng định từ này chỉ có nghĩa là thức ăn.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ; “lên” phù hợp với cách nói tiếng Việt về việc dâng lễ vật lên Đức Chúa Trời.
- source_word: וְנִכְרְתָה
  choice: sẽ bị cắt đứt
  rationale: Giữ hình ảnh và công thức pháp lý Hê-bơ-rơ, không tự ý xác định hình phạt là khai trừ, xử tử hay sự phán xét trực tiếp của Đức Chúa Trời.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: người ăn mỡ ấy
  rationale: נֶפֶשׁ trong ngữ cảnh pháp luật chỉ một cá nhân; cách dịch này tự nhiên và nêu rõ đối tượng được ăn là phần mỡ vừa nói đến.
- source_word: מֵעַמֶּיהָ
  choice: khỏi dân mình
  rationale: Hậu tố giống cái hòa hợp ngữ pháp với נֶפֶשׁ chứ không xác định người phạm luật là nữ. “Dân mình” giữ nghĩa quy thuộc cộng đồng mà không thêm giới tính.
theological_decisions:
- issue: Công thức hình phạt giao ước וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: sẽ bị cắt đứt khỏi dân mình
  alternative: sẽ bị khai trừ khỏi dân mình; sẽ bị xử tử
  rationale: 'Cơ chế chính xác của hình phạt vẫn còn được tranh luận: cụm từ có thể liên quan đến sự loại khỏi cộng đồng, cái chết hoặc sự phán xét của Đức Chúa Trời. Bản dịch giữ nguyên sức nặng và độ mở của công thức Hê-bơ-rơ.'
- issue: Giới tính của người phạm luật trong cách nói pháp lý tổng quát
  choice: người ... dân mình
  alternative: người nữ ấy ... dân bà; người ấy ... dân họ
  rationale: Dạng giống cái trong tiếng Hê-bơ-rơ do sự hòa hợp với danh từ נֶפֶשׁ, không phải vì luật chỉ nói đến phụ nữ. Tiếng Việt có thể diễn đạt số ít tổng quát mà không gán giới tính.
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA; Đức Gia-vê; YHWH
  rationale: Bản văn có danh riêng יהוה. “Đức Giê-hô-va” là dạng danh xưng quen thuộc, dễ đọc đối với độc giả Việt và không thay danh riêng bằng một tước hiệu.
translation_notes:
  register: Văn phong pháp luật tế lễ trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Câu giữ cấu trúc nêu trường hợp rồi tuyên hình phạt; tránh thuật ngữ cổ khó hiểu và không giải quyết thay cho nguyên văn sự mơ hồ của công thức hình phạt.
