revisions:
- from: Vì bất cứ ai ăn mỡ của một con vật mà từ đó người ta dâng lễ vật hỏa tế[a] lên Đức Giê-hô-va, thì người ăn mỡ ấy sẽ bị cắt đứt khỏi dân mình.[b]
  to: Vì bất cứ ai ăn mỡ từ một con vật mà người ta dâng một lễ vật dâng bằng lửa[a] lên Đức Giê-hô-va, thì người ăn mỡ ấy sẽ bị cắt đứt khỏi dân mình.[b]
  rationale: Bản sửa làm rõ rằng thuật ngữ אִשֶּׁה không nhất thiết chỉ một loại tế lễ riêng, đồng thời chỉnh chú thích từ vựng để tránh nghĩa sai trong tiếng Việt. Công thức hình phạt, tính tổng quát của chủ thể, và sự mơ hồ có chủ ý của nguyên văn đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
