  source_fidelity: 'Bản dịch truyền đạt đúng công thức mở đầu lời phán: יהוה là chủ ngữ, động từ וַיְדַבֵּר là “phán”, Môi-se là người nhận, và לֵאמֹר được diễn đạt tự nhiên bằng “rằng”. Tuy nhiên, chú thích về YHWH đang được neo sau “Môi-se”, dù nội dung của nó liên quan đến danh יהוה; cần chuyển neo về đúng từ được chú thích. Dùng “Gia-vê” phản ánh trực tiếp lựa chọn “Yahweh” của bản đối chiếu và là dạng phiên âm hiện đại quen dùng trong tiếng Việt.'
