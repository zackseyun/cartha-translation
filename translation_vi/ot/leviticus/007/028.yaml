base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/028.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Gia-vê[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời phán được dịch là “phán”, vừa tự nhiên và trang trọng trong tiếng Việt, vừa phân biệt với אמר (“nói/rằng”) ở cuối công thức.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Danh riêng YHWH được thể hiện theo dạng “Giê-hô-va” đã quen thuộc trong tiếng Việt, có kính ngữ “Đức”, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, từ này diễn đạt tự nhiên người tiếp nhận lời phán.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong tiếng Việt, “rằng” dẫn trực tiếp vào nội dung lời phán tự nhiên hơn cách dịch sát hình thức “để nói”.
theological_decisions:
- issue: Cách thể hiện danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê); CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH. Bản dịch giữ một dạng danh riêng thay vì âm thầm thay bằng tước hiệu; chú thích nêu rõ dạng Hê-bơ-rơ và lối dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “phán với… rằng” giữ chức năng của công thức Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt. Dấu chú thích được đặt sau “Môi-se” theo dữ liệu tham chiếu, dù nội dung chú thích liên quan đến danh YHWH.
