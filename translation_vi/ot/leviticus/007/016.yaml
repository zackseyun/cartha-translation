  terminology: “Lễ vật theo lời khấn nguyện,” “lễ vật tự nguyện,” “sinh tế,” và “dâng” đều phù hợp ngữ cảnh nghi lễ và không áp đặt cách hiểu giáo phái. Chú thích nên nêu rõ phương án từ vựng thay thế cho thuật ngữ thứ nhất, đồng thời giải thích sự phân biệt trong nguyên ngữ.
