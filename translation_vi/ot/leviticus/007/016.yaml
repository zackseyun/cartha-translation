language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: vi
  text: Nhưng nếu sinh tế người ấy dâng là lễ vật theo lời khấn nguyện hoặc lễ vật tự nguyện[a], thì phải được ăn trong ngày người ấy dâng sinh tế; sang ngày hôm sau, phần còn lại cũng có thể được ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lễ vật khấn nguyện.” Tiếng Hê-bơ-rơ phân biệt sinh tế gắn với một lời khấn nguyện với lễ vật được tự nguyện dâng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  choice: lễ vật theo lời khấn nguyện
  rationale: Trong ngữ cảnh luật tế lễ, từ này chỉ sinh tế gắn với một lời khấn nguyện, chứ không chỉ bản thân lời khấn; cách dịch này làm rõ loại lễ vật mà không đồng nhất nó với lễ vật tự nguyện.
- source_word: נְדָבָה
  choice: lễ vật tự nguyện
  rationale: Chỉ lễ vật được tự nguyện dâng, đối lập với sinh tế gắn với lời khấn nguyện; đây là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: lễ vật hiến tế của người ấy
  rationale: Giữ được cả ý niệm hiến tế của זֶבַח và lễ vật được đem dâng của קָרְבָּן, đồng thời tránh một cấu trúc sở hữu nặng nề trong tiếng Việt.
- source_word: בְּיוֹם הַקְרִיבוֹ
  choice: trong ngày người ấy dâng
  rationale: Động từ Hiphil của קרב ở đây mang nghĩa đem đến hoặc trình dâng trong nghi lễ; “dâng” là tự nhiên và chính xác trong văn cảnh tế lễ.
- source_word: יֵאָכֵל
  choice: phải được ăn
  rationale: Dạng Niphal bất định dùng theo chức năng quy định trong luật tế lễ; “phải” giữ sắc thái chỉ thị ở mệnh đề đầu.
- source_word: וּמִמָּחֳרָת
  choice: sang ngày hôm sau
  rationale: Diễn đạt trình tự thời gian một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: phần còn lại
  rationale: Chuyển tải trực tiếp ý phần sinh tế còn thừa mà không cần lặp đại từ rườm rà.
- source_word: יֵאָכֵל
  choice: cũng có thể được ăn
  rationale: Cùng một hình thức Hê-bơ-rơ, nhưng trong mệnh đề thứ hai ngữ cảnh nhấn mạnh việc phần còn lại được phép ăn vào hôm sau; “có thể” diễn đạt rõ lực cho phép.
theological_decisions:
- issue: Mối quan hệ giữa נֶדֶר và sinh tế
  choice: lễ vật theo lời khấn nguyện
  alternative: lời khấn nguyện
  rationale: Cấu trúc câu phân loại זֶבַח קָרְבָּנוֹ theo động cơ hoặc hoàn cảnh dâng lễ; vì vậy cách dịch chỉ loại lễ vật gắn với lời khấn, nhưng không xác định thêm bản chất hay nội dung của lời khấn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “hiến tế”, “dâng sinh tế” và “lễ vật” để duy trì trường nghĩa nghi lễ; tránh thuật ngữ giáo phái. Đại từ “người ấy” phản ánh hậu tố số ít giống đực trong nguyên văn mà không làm câu quá cổ.
