revisions:
- from: Nhưng nếu lễ vật hiến tế của người ấy là lễ vật theo lời khấn nguyện hoặc lễ vật tự nguyện[a], thì lễ vật đó phải được ăn trong ngày người ấy dâng sinh tế; sang ngày hôm sau, phần còn lại cũng có thể được ăn.
  to: Nhưng nếu sinh tế người ấy dâng là lễ vật theo lời khấn nguyện hoặc lễ vật tự nguyện[a], thì phải được ăn trong ngày người ấy dâng sinh tế; sang ngày hôm sau, phần còn lại cũng có thể được ăn.
  rationale: Bản sửa loại bỏ sự lặp từ không cần thiết và làm rõ rằng hai cụm “theo lời khấn nguyện” và “tự nguyện” phân loại sinh tế được dâng. Sắc thái quy định của động từ thứ nhất (“phải được ăn”) và sắc thái cho phép của động từ thứ hai (“có thể được ăn”) được giữ lại. Chú thích được hoàn chỉnh để phù hợp với chức năng nêu phương án từ vựng.
