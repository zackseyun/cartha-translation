source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: vi
  text: Nhưng nếu người ta ăn bất cứ phần thịt nào của lễ vật bình an[a] ấy vào ngày thứ ba, thì lễ vật đó sẽ không được chấp nhận và cũng không được kể đến cho người dâng. Nó sẽ trở thành vật ghê tởm[b], và người nào ăn thịt ấy sẽ phải mang lấy tội mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lễ vật bình an” cũng có thể dịch là “lễ vật thông công” hoặc “lễ vật phúc lợi”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ ở đây là một thuật ngữ tế lễ, chỉ lễ vật đã trở nên không thể chấp nhận và đáng ghê tởm; cũng có thể dịch là “thịt ô uế” hoặc “vật hôi thối”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện có sắc thái tương phản với quy định ngay trước đó.
- source_word: הֵאָכֹל יֵאָכֵל מִבְּשַׂר
  choice: người ta ăn bất cứ phần thịt nào
  rationale: Phản ánh cấu trúc nhấn mạnh của nguyên ngữ cùng ý nghĩa phân bộ của מִן, đồng thời giữ câu tiếng Việt tự nhiên.
- source_word: זֶבַח שְׁלָמָיו
  choice: lễ vật bình an ấy
  rationale: Chỉ một loại tế lễ cụ thể; cách gọi này giữ được trường nghĩa bình an, toàn vẹn của שְׁלָמִים. Đại từ 'ấy' quy chiếu về lễ vật của người dâng mà không tạo cách diễn đạt sở hữu gượng gạo.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: vào ngày thứ ba
  rationale: Cách diễn đạt thời gian trực tiếp và tự nhiên trong tiếng Việt.
- source_word: לֹא יֵרָצֶה
  choice: sẽ không được chấp nhận
  rationale: Trong văn cảnh tế lễ, động từ này nói đến việc lễ vật có được chấp nhận hay không.
- source_word: הַמַּקְרִיב אֹתוֹ לֹא יֵחָשֵׁב לוֹ
  choice: cũng không được kể cho người dâng
  rationale: Giữ sắc thái tính kể của חָשַׁב và mối liên hệ với người đem dâng lễ vật.
- source_word: פִּגּוּל
  choice: vật ghê tởm
  rationale: Truyền đạt tính không thể chấp nhận và đáng ghê tởm theo nghĩa tế lễ, đồng thời chú thích tính chuyên biệt của thuật ngữ.
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: và người nào ăn thịt ấy
  rationale: נֶפֶשׁ trong quy định pháp lý chỉ một người; cách diễn đạt này rõ nghĩa và không áp đặt giới tính.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: sẽ phải mang lấy tội mình
  rationale: Giữ nguyên thành ngữ 'mang lấy tội', vốn có thể bao hàm cả tình trạng mắc tội lẫn trách nhiệm do tội ấy.
theological_decisions:
- issue: Cách gọi זֶבַח שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công; lễ vật cầu an
  rationale: “Lễ vật bình an” gần với trường nghĩa của gốc שׁלם và không thu hẹp loại lễ này chỉ vào sự thông công hay việc cầu xin bình an.
- issue: Ý nghĩa của עֲוֺנָהּ תִּשָּׂא
  choice: sẽ phải mang lấy tội mình
  alternative: sẽ phải chịu hình phạt vì tội mình
  rationale: Nguyên ngữ có thể gợi cả tội lỗi lẫn trách nhiệm/hậu quả, nên bản chính không giải nghĩa hẹp thành hình phạt.
- issue: Đối tượng của לֹא יֵחָשֵׁב לוֹ
  choice: lễ vật đó cũng không được kể cho người dâng
  alternative: lễ vật đó sẽ không được ghi nhận là có giá trị cho người dâng
  rationale: Giữ hình ảnh tính kể của nguyên ngữ và tránh xác định thêm chính xác lợi ích hay hiệu lực thần học được tính cho người dâng.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “lễ vật” thay vì thuật ngữ quá cổ; duy trì thành ngữ Kinh Thánh tự nhiên “mang lấy tội mình”. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan trong chính văn.
