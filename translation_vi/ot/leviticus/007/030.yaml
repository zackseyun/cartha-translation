base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: vi
  text: Chính tay người ấy phải đem các lễ vật dâng bằng lửa lên Đức Giê-hô-va. Người ấy phải đem mỡ đặt trên ức, để đưa phần ức ấy qua đưa lại như một lễ vật đưa qua đưa lại trước mặt Đức Giê-hô-va.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: Chính tay người ấy
  rationale: Diễn đạt sắc thái nhấn mạnh rằng người dâng lễ phải đích thân mang lễ vật đến.
- source_word: אִשֵּׁי יְהוָה
  choice: các lễ vật dâng bằng lửa lên Đức Giê-hô-va
  rationale: Giữ nghĩa nghi lễ của אִשֶּׁה là vật được dâng bằng lửa, thay vì diễn giải hẹp thành thức ăn.
- source_word: הֶחָזֶה
  choice: ức
  rationale: Chỉ phần ức của con vật hiến tế; đây là cách gọi ngắn gọn, tự nhiên trong ngữ cảnh nghi lễ.
- source_word: לְהָנִיף ... תְּנוּפָה
  choice: để đưa qua đưa lại ... làm lễ vật đưa qua đưa lại
  rationale: Tái hiện phép lặp cùng gốc trong tiếng Hê-bơ-rơ và động tác nghi lễ mà không khẳng định một hướng chuyển động cụ thể.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt, thay vì thay bằng tước hiệu.
theological_decisions:
- issue: Bản chất của אִשֵּׁי יְהוָה
  choice: các lễ vật dâng bằng lửa lên Đức Giê-hô-va
  alternative: thức ăn dâng lên Đức Giê-hô-va
  rationale: Cách chọn giữ phạm vi nghi lễ của từ và tránh làm người đọc hiểu đây chỉ là thực phẩm, dù trong ngữ cảnh tế lễ từ này có thể gợi ý phần dành cho Đức Chúa Trời.
- issue: Ý nghĩa động tác תְּנוּפָה
  choice: đưa qua đưa lại
  alternative: đưa lên đưa xuống / vẫy
  rationale: Nguồn Hê-bơ-rơ nêu hành động nghi lễ nhưng không mô tả rõ phương hướng; bản dịch tránh xác định quá mức.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; giữ thuật ngữ nghi lễ nhất quán, đồng thời dùng câu chủ động rõ ràng.
