revisions:
- from: Chính tay người ấy phải đem các lễ vật dâng bằng lửa lên Đức Giê-hô-va. Người ấy phải đem mỡ cùng với ức đến, để đưa qua đưa lại phần ức làm lễ vật đưa qua đưa lại trước mặt Đức Giê-hô-va.
  to: Chính tay người ấy phải đem các lễ vật dâng bằng lửa lên Đức Giê-hô-va. Người ấy phải đem mỡ đặt trên ức, để đưa phần ức ấy qua đưa lại như một lễ vật đưa qua đưa lại trước mặt Đức Giê-hô-va.
  rationale: Bản sửa phản ánh rõ על bằng "mỡ đặt trên ức," đồng thời làm trôi chảy câu tiếng Việt. Cách dịch "đưa qua đưa lại" không áp đặt hướng chuyển động cụ thể của nghi thức, và danh ngữ lặp lại giữ được liên hệ từ nguyên giữa động từ הָנִיף và danh từ תְּנוּפָה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng chủ thể phải tự tay mang lễ vật, phần mỡ và ức, cùng mục đích thực hiện nghi thức תְּנוּפָה trước mặt Đức Giê-hô-va. Tuy nhiên, cụm "mỡ cùng với ức" làm mờ quan hệ על (''trên/đặt trên'') trong văn bản Hê-bơ-rơ: mỡ được nói là ở trên ức khi đem đến.'
  naturalness: '"đem ... đến" lặp lại không cần thiết; "làm lễ vật đưa qua đưa lại" cũng chưa tự nhiên trong tiếng Việt. Bản sửa giữ sự lặp từ nguyên của Hê-bơ-rơ giữa động từ và danh từ nghi lễ, nhưng diễn đạt mạch lạc hơn.'
  terminology: '"Đức Giê-hô-va," "ức," và cách mô tả nghi thức "đưa qua đưa lại" đều phù hợp. "các lễ vật dâng bằng lửa" giữ được phạm vi của אִשֵּׁי mà không thu hẹp thành thực phẩm.'
  issues:
  - severity: medium
    issue: Quan hệ của mỡ với ức bị làm phẳng
    rationale: Cụm הַחֵלֶב עַל הֶחָזֶה có nghĩa sát là 'mỡ trên ức'; bản nháp dịch 'mỡ cùng với ức' chỉ nêu sự đi kèm, không phản ánh quan hệ không gian/việc đặt mỡ trên ức được nêu trong tiếng Hê-bơ-rơ.
  - severity: low
    issue: Diễn đạt nghi thức còn gượng
    rationale: '"để đưa qua đưa lại phần ức làm lễ vật đưa qua đưa lại" có trật tự từ nặng nề. Đổi thành "để đưa phần ức ấy qua đưa lại như một lễ vật đưa qua đưa lại" tự nhiên hơn mà vẫn bảo toàn phép lặp của לְהָנִיף ... תְּנוּפָה.'
