id: LEV.7.33
reference: Leviticus 7:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הַ/מַּקְרִ֞יב אֶת דַּ֧ם הַ/שְּׁלָמִ֛ים וְ/אֶת הַ/חֵ֖לֶב מִ/בְּנֵ֣י אַהֲרֹ֑ן ל֧/וֹ תִהְיֶ֛ה שׁ֥וֹק הַ/יָּמִ֖ין לְ/מָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: vi
  text: Trong số các con trai A-rôn, người nào dâng huyết và mỡ của lễ vật bình an[a], thì đùi phải sẽ thuộc về người ấy làm phần của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thông công.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: người nào dâng
  rationale: Phân từ Hiphil của קרב chỉ việc đem đến hoặc trình dâng lễ vật; “dâng” tự nhiên trong ngữ cảnh tế lễ và cấu trúc “người nào” giữ được lực của phân từ.
- source_word: דַּם
  choice: huyết
  rationale: “Huyết” là cách diễn đạt trang trọng, quen thuộc trong văn cảnh nghi lễ và chỉ trực tiếp máu của sinh tế.
- source_word: הַשְּׁלָמִים
  choice: lễ vật bình an
  rationale: Giữ mối liên hệ từ vựng với ý niệm bình an/toàn vẹn và tên gọi quen thuộc của loại tế lễ này; cách hiểu nhấn mạnh sự thông công được ghi ở chú thích.
- source_word: הַחֵלֶב
  choice: mỡ
  rationale: Dịch trực tiếp thuật ngữ chỉ các phần mỡ được quy định trong luật tế lễ.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: trong số các con trai A-rôn
  rationale: Diễn đạt rõ sự chọn một người thuộc nhóm các con trai A-rôn, đồng thời giữ nguyên cách gọi gia tộc và giới tính của tiếng Hê-bơ-rơ.
- source_word: לוֹ תִהְיֶה
  choice: sẽ thuộc về người ấy
  rationale: Thể hiện quyền nhận phần theo quy định pháp lý một cách rõ ràng và tự nhiên trong tiếng Việt.
- source_word: שׁוֹק הַיָּמִין
  choice: đùi phải
  rationale: שׁוֹק trong ngữ cảnh phân chia thịt sinh tế chỉ phần đùi/chân trên; “đùi phải” chính xác hơn cách gọi rộng là “chân phải”.
- source_word: לְמָנָה
  choice: làm phần của mình
  rationale: Diễn đạt phần được ấn định cho vị tư tế; cụm này tự nhiên trong tiếng Việt và giữ ý nghĩa phân chia theo luật.
theological_decisions:
- issue: Cách dịch בְּנֵי אַהֲרֹן trong luật dành cho chức tư tế
  choice: các con trai A-rôn
  alternative: các hậu duệ của A-rôn; gia tộc A-rôn
  rationale: Nguyên văn dùng danh từ giống đực số nhiều, trực tiếp nói đến những nam giới thuộc hàng tư tế đang thi hành nghi lễ; không trung tính hóa hoặc mở rộng nghĩa.
- issue: Cách gọi loại tế lễ שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công
  rationale: “Lễ vật bình an” giữ được liên hệ từ vựng với bình an/toàn vẹn mà không quyết định độc nhất chức năng thần học của lễ; phương án nhấn mạnh sự thông công được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, rõ ràng với độc giả phổ thông. Dùng “A-rôn,” “huyết,” và “lễ vật” để phù hợp ngữ vực tế lễ; giữ cấu trúc điều kiện “người nào… thì…” tự nhiên trong tiếng Việt.
