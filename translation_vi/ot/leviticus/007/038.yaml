  source_fidelity: 'Bản dịch bảo toàn đầy đủ các thành tố của tiếng Hê-bơ-rơ: mệnh đề quan hệ nối với câu trước; hai lần động từ צוה được dịch là “truyền”; địa điểm núi Si-nai; mốc thời gian rõ ràng; hành vi dâng lễ vật; và địa điểm hoang mạc Si-nai. “Dâng các lễ vật của họ lên Yahweh” truyền đạt thích đáng לְהַקְרִיב אֶת־קָרְבְּנֵיהֶם לַיהוָה. Đại từ “Ngài” quy chiếu rõ về Yahweh.'
  naturalness: Văn phong trang trọng, hiện đại và tự nhiên trong văn mạch Kinh Thánh tiếng Việt. Mở đầu bằng “mà” là phù hợp vì câu Hê-bơ-rơ tiếp nối phần tổng kết ở câu trước, không phải một câu độc lập. “Con cái Israel” là cách gọi tập thể dễ hiểu; chú thích đã bảo lưu hình thức giống đực của nguyên ngữ.
  terminology: “Yahweh,” “Môi-se,” “Si-nai,” “lễ vật,” và “hoang mạc” được dùng nhất quán và phù hợp ngữ cảnh tế tự. Không có sự áp đặt diễn giải thần học. Chú thích cho “con cái Israel” phản ánh đúng nghĩa đen và các phương án thành ngữ tự nhiên.
