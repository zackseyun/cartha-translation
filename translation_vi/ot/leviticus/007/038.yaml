id: LEV.7.38
reference: Leviticus 7:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: vi
  text: mà Yahweh đã truyền cho Môi-se trên núi Si-nai, vào ngày Ngài truyền cho con cái Israel[a] dâng các lễ vật của họ lên Yahweh trong hoang mạc Si-nai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Israel” hoặc “người Israel.” Tiếng Hê-bơ-rơ theo nghĩa đen là “các con trai của Israel.”
    reason: Bảo lưu nghĩa đen và các cách dịch tự nhiên của thành ngữ tập thể בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: mà
  rationale: Giữ chức năng của đại từ quan hệ, nối câu này với phần tổng kết các luật lệ ở câu trước.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Diễn đạt tự nhiên nhưng vẫn giữ thẩm quyền của động từ צוה trong bối cảnh luật pháp và thờ phượng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּהַר סִינָי
  choice: trên núi Si-nai
  rationale: Cách diễn đạt địa điểm tự nhiên trong tiếng Việt và sát với cấu trúc Hê-bơ-rơ.
- source_word: בְּיוֹם צַוֺּתוֹ
  choice: vào ngày Ngài truyền
  rationale: Chuyển cấu trúc nguyên mẫu kèm hậu tố thành mệnh đề hữu hạn tự nhiên, đồng thời giữ mốc thời gian được nêu rõ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ sắc thái gia tộc của thành ngữ Hê-bơ-rơ, đồng thời dùng cách gọi tập thể tự nhiên hơn trong tiếng Việt; nghĩa đen được ghi ở chú thích.
- source_word: לְהַקְרִיב
  choice: dâng
  rationale: Trong ngữ cảnh tế lễ, Hiphil của קרב chỉ việc đem đến hoặc trình dâng lễ vật; “dâng” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: קָרְבְּנֵיהֶם
  choice: các lễ vật của họ
  rationale: קרבן là thuật ngữ rộng bao quát nhiều loại của lễ và sinh tế được tóm lược trong đoạn này.
- source_word: בְּמִדְבַּר סִינָי
  choice: trong hoang mạc Si-nai
  rationale: “Hoang mạc” diễn đạt miền đất hoang vắng của מִדְבָּר mà không nhất thiết giới hạn vào sa mạc cát.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước; giữ “Yahweh” bảo toàn tính chất danh riêng và không thay bằng tước hiệu.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai của Israel; dân Israel; người Israel
  rationale: “Con cái Israel” giữ được hình ảnh gia tộc của nguyên văn mà vẫn chỉ toàn thể cộng đồng một cách tự nhiên. Chú thích bảo lưu nghĩa đen giống đực của thành ngữ.
- issue: Chủ thể của צַוֺּתוֹ
  choice: Ngài
  alternative: ông
  rationale: Hậu tố ngôi thứ ba quay lại chủ thể Yahweh của động từ chính. Viết hoa “Ngài” giúp quy chiếu rõ ràng mà không thêm một danh xưng không có trong nguyên văn.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Câu bắt đầu bằng “mà” để giữ quan hệ cú pháp với câu 37 thay vì biến câu 38 thành một phát biểu độc lập. Dùng “Môi-se,” “Si-nai” theo dạng tên quen thuộc trong tiếng Việt, còn “Israel” giữ dạng quốc tế dễ nhận biết.
