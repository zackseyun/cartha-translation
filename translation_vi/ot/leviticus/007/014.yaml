  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: vi
  text: Từ lễ vật ấy, người dâng phải trình một chiếc thuộc mỗi loại làm phần biệt riêng dâng lên Đức Giê-hô-va[a]; phần đó sẽ thuộc về thầy tế lễ vẩy huyết của lễ vật bình an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phần biệt riêng” dịch từ một từ Hê-bơ-rơ chỉ phần được tách riêng dâng cho Đức Giê-hô-va và được giao cho thầy tế lễ; cũng có thể dịch là “lễ vật dâng lên.”
    reason: lexical_alternative
  - marker: b
    text: “Lễ vật bình an” cũng có thể dịch là “lễ vật thông công” hoặc “lễ vật an lành.” Động từ “vẩy” cũng có thể diễn đạt là “hất” huyết.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: người dâng phải trình
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến hoặc trình làm lễ vật; thêm chủ thể hàm ẩn “người dâng” để câu tiếng Việt tự nhiên.
- source_word: מִמֶּנּוּ
  choice: từ lễ vật ấy
  rationale: Đại từ số ít hồi chỉ toàn bộ tổ hợp lễ vật tạ ơn vừa được mô tả; diễn đạt rõ sở chỉ hơn cách dịch máy móc “từ nó”.
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: một chiếc thuộc mỗi loại
  rationale: 'Trong ngữ cảnh các loại bánh ở câu trước, אֶחָד mang nghĩa một chiếc, còn מִכָּל có sức phân phối: một chiếc từ mỗi loại.'
- source_word: תְּרוּמָה
  choice: phần biệt riêng dâng lên
  rationale: Thuật ngữ chỉ phần được tách riêng dâng cho Đức Chúa Trời rồi cấp cho thầy tế lễ; cách dịch này dễ hiểu và không áp đặt động tác nghi lễ “đưa lên” vốn không nhất thiết nằm trong nghĩa từ.
- source_word: לַיהוָה
  choice: dâng lên Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước YHWH bằng dạng tiếng Việt quen dùng “Đức Giê-hô-va”; giới từ ל được thể hiện theo hướng dâng hiến.
- source_word: לַכֹּהֵן ... לוֹ יִהְיֶה
  choice: sẽ thuộc về thầy tế lễ
  rationale: Thành ngữ diễn tả quyền sở hữu hoặc phần được cấp cho thầy tế lễ thực hiện nghi thức huyết.
- source_word: הַזֹּרֵק
  choice: đã vẩy
  rationale: זרק mô tả việc hất hoặc vẩy huyết lên bàn thờ; “vẩy” là cách diễn đạt nghi lễ tự nhiên trong tiếng Việt mà vẫn giữ được động tác của nguyên ngữ.
- source_word: דַּם הַשְּׁלָמִים
  choice: huyết của lễ vật giao hòa
  rationale: שְׁלָמִים là loại tế lễ gắn với sự hòa thuận, phúc lành và bữa ăn hiệp thông; “lễ vật giao hòa” giữ tính chất tên gọi tế lễ mà không thu hẹp hoàn toàn vào một sắc thái.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA; Đức Yahweh
  rationale: Dùng một danh riêng quen thuộc trong tiếng Việt để phản ánh việc bản Hê-bơ-rơ có thánh danh, thay vì chuyển thành một tước hiệu; không dựa vào giáo phái cụ thể.
- issue: Cách dịch שְׁלָמִים
  choice: lễ vật giao hòa
  alternative: lễ vật bình an; lễ vật thông công; lễ vật cầu an
  rationale: “Giao hòa” bảo tồn liên hệ với שלום và hàm ý quan hệ hòa thuận, đồng thời tránh giới hạn lễ này chỉ vào sự thông công hoặc việc cầu xin bình an.
- issue: Người nhận phần biệt riêng
  choice: phần đó sẽ thuộc về thầy tế lễ đã vẩy huyết
  alternative: phần đó dành cho thầy tế lễ vẩy huyết
  rationale: Nguyên văn xác lập quyền hưởng phần lễ cho chính thầy tế lễ thực hiện nghi thức huyết; bản dịch giữ rõ mối liên hệ pháp lý-nghi lễ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu làm rõ chủ thể hàm ẩn là người dâng lễ và dùng thuật ngữ tế lễ nhất quán; mọi chú thích đều có ký hiệu trong chính văn.
