base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: vi
  text: cùng với hai quả thận, phần mỡ trên chúng, tức là phần mỡ ở vùng hông, và phần phụ trên gan[a]; người ấy phải lấy phần phụ ấy ra cùng với hai quả thận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thùy trên gan”; từ Hê-bơ-rơ chỉ bộ phận giải phẫu này là một thuật ngữ chuyên biệt, và sở chỉ chính xác của nó vẫn còn được tranh luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: hai quả thận
  rationale: Cụm từ chỉ rõ hai quả thận trong giải phẫu hiến tế; cách nói này tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: הַחֵלֶב
  choice: phần mỡ
  rationale: Trong luật hiến tế Lê-vi, từ này chỉ những phần mỡ dành riêng để dâng; thêm “phần” giúp diễn đạt đúng tính chất bộ phận được lấy ra.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: trên thận
  rationale: Giữ nghĩa trực tiếp của giới từ עַל là “trên”; lặp danh từ “thận” tự nhiên và rõ hơn đại từ “chúng” trong tiếng Việt.
- source_word: הַכְּסָלִים
  choice: vùng hông
  rationale: Từ Hê-bơ-rơ chỉ vùng hông hoặc vùng thắt lưng gần thận; “vùng hông” là cách gọi giải phẫu dễ hiểu mà không quá chuyên biệt.
- source_word: הַיֹּתֶרֶת
  choice: phần phụ
  rationale: Đây là thuật ngữ giải phẫu chuyên biệt có sở chỉ chính xác còn được tranh luận; “phần phụ” giữ được tính cụ thể nhưng tránh xác định quá mức là một thùy nhất định.
- source_word: עַל הַכָּבֵד
  choice: trên gan
  rationale: Dịch trực tiếp עַל là “trên”, không thêm ý “gắn vào” vốn mang tính giải thích.
- source_word: עַל הַכְּלָיֹת
  choice: cùng với hai quả thận
  rationale: Trong công thức hiến tế này, cụm từ diễn tả phần phụ của gan được lấy ra cùng với thận; cách dịch này truyền đạt tự nhiên quan hệ thủ tục.
- source_word: יְסִירֶנָּה
  choice: người ấy phải lấy phần phụ ấy ra
  rationale: Dạng động từ chỉ mệnh lệnh thủ tục. Hậu tố giống cái số ít phù hợp trực tiếp với הַיֹּתֶרֶת, vì vậy nêu lại “phần phụ ấy” giúp tiếng Việt rõ nghĩa mà vẫn giữ cú pháp nguồn.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Câu bắt đầu bằng “cùng với” để giữ sự nối tiếp cú pháp với câu trước. Dùng thuật ngữ giải phẫu phổ thông, tránh cách nói cổ và tránh xác định quá mức bộ phận gan đang được nhắc đến.
