source:
  edition: WLC
  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: vi
  text: Nhưng thịt nào chạm vào bất cứ thứ gì ô uế[a] thì không được ăn; phải bị thiêu trong lửa. Còn thịt, bất cứ ai thanh sạch đều có thể ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tiếp xúc với bất cứ thứ gì ô uế.” Tiếng Hê-bơ-rơ có nghĩa rộng và nói đến sự ô uế theo nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: Nhưng thịt nào
  rationale: בָּשָׂר trong ngữ cảnh tế lễ chỉ phần thịt dùng làm thức ăn; liên từ được dịch là “Nhưng” để nêu sự tương phản với phần thịt được phép ăn.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: chạm vào bất cứ thứ gì ô uế
  rationale: יִגַּע diễn tả sự tiếp xúc, còn כָּל טָמֵא là một phạm trù rộng về vật hay tình trạng ô uế theo nghi lễ, nên không thu hẹp đối tượng quá mức.
- source_word: לֹא יֵאָכֵל
  choice: không được ăn
  rationale: Thể Niphal và dạng vị lai trong quy định pháp luật diễn đạt một lệnh cấm ở thể bị động; cách dịch này tự nhiên và giữ rõ hiệu lực pháp lý.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: phải dùng lửa thiêu đi
  rationale: Diễn đạt yêu cầu tiêu hủy phần thịt bị ô uế bằng lửa, đồng thời giữ hình ảnh cụ thể và văn phong trang trọng, tự nhiên trong tiếng Việt.
- source_word: וְהַבָּשָׂר
  choice: Còn về phần thịt ấy
  rationale: Danh từ được lặp lại để chuyển từ phần thịt đã bị ô uế sang phần thịt có thể ăn; cấu trúc đề ngữ tiếng Việt làm rõ sự chuyển ý này.
- source_word: כָּל טָהוֹר
  choice: bất cứ ai thanh sạch
  rationale: Tính từ được dùng như danh từ để chỉ mọi người đang ở tình trạng thanh sạch theo nghi lễ; “bất cứ ai” giữ tính bao quát của כָּל.
- source_word: יֹאכַל בָּשָׂר
  choice: đều có thể ăn
  rationale: Trong văn cảnh, động từ cho phép ăn chứ không bắt buộc phải ăn. Lược bỏ lần lặp cuối của “thịt” giúp câu tiếng Việt tự nhiên mà đối tượng vẫn rõ từ đề ngữ.
theological_decisions:
- issue: Ý nghĩa của טָמֵא và טָהוֹר trong luật tế lễ
  choice: Dịch là “ô uế” và “thanh sạch”, hiểu theo tình trạng nghi lễ.
  alternative: “nhơ uế” và “tinh sạch”, hoặc diễn giải thành phạm trù đạo đức.
  rationale: Trong các quy định tế lễ của Lê-vi Ký, hai từ này trước hết chỉ tình trạng nghi lễ, không nhất thiết nói đến tội lỗi hay phẩm chất đạo đức. Bản dịch giữ sự phân biệt này mà không diễn giải giáo lý quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; dùng thuật ngữ quen thuộc “ô uế/thanh sạch” nhưng để chú thích xác định đây là tình trạng theo nghi lễ. Nhịp câu giữ cấu trúc đối lập giữa phần thịt bị ô uế và phần thịt được phép ăn.
