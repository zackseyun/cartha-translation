    rationale: יִשָּׂרֵף là bị động; cách “phải bị thiêu trong lửa” phản ánh tốt hơn cấu trúc và giọng văn pháp quy của tiếng Hê-bơ-rơ.
  - severity: low
    issue: Chú thích dùng “bất cứ vật gì ô uế”.
    rationale: “Vật gì” có thể giới hạn tham chiếu rộng của כָּל טָמֵא; “thứ gì” bảo toàn tính bao quát của bản văn.
  - severity: low
    issue: “Còn về phần thịt ấy” hơi dài và “ấy” có thể tạo một chỉ định không cần thiết.
    rationale: Danh từ có mạo từ ở lần lặp thứ hai đánh dấu chuyển đề/đối lập; “Còn thịt” diễn đạt điều này tự nhiên mà không thêm sắc thái chỉ định.
