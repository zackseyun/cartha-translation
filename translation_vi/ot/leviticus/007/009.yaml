translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc; tránh từ cổ. Câu giữ phạm vi bao quát của וְכָל và nêu rõ quan hệ sở hữu ở cuối câu.
