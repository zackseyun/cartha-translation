  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: vi
  text: Mọi lễ vật ngũ cốc được nướng trong lò, cũng như mọi lễ vật được chế biến trong chảo sâu[a] và trên chảo phẳng, sẽ thuộc về thầy tế lễ dâng lễ vật đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hai từ Hê-bơ-rơ ở đây có lẽ chỉ hai loại dụng cụ nấu khác nhau, một loại sâu hơn và một loại phẳng hơn; ý nghĩa chính xác của từng thuật ngữ không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong ngữ cảnh tế lễ của sách Lê-vi, từ này chỉ lễ vật làm từ ngũ cốc chứ không phải lễ vật nói chung.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: được nướng trong lò
  rationale: Giữ thể bị động của động từ và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: נַעֲשָׂה
  choice: được chế biến
  rationale: Động từ có nghĩa rộng là “làm”; trong ngữ cảnh thực phẩm, “chế biến” tự nhiên mà không xác định quá mức phương pháp nấu.
- source_word: מַרְחֶשֶׁת
  choice: chảo sâu
  rationale: Có lẽ chỉ một loại dụng cụ nấu sâu hơn מַחֲבַת; cách dịch này duy trì sự phân biệt có khả năng hiện diện giữa hai dụng cụ.
- source_word: מַחֲבַת
  choice: chảo phẳng
  rationale: Có lẽ chỉ loại chảo hoặc bề mặt nấu phẳng; “chảo phẳng” rõ nghĩa hơn một thuật ngữ chuyên biệt ít quen thuộc.
- source_word: לַכֹּהֵן ... לוֹ תִהְיֶה
  choice: đều sẽ thuộc về thầy tế lễ
  rationale: Cấu trúc này diễn tả quyền sở hữu hoặc phần được phân cho thầy tế lễ; “thuộc về” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: הַמַּקְרִיב אֹתָהּ
  choice: đã dâng lễ vật ấy
  rationale: Phân từ Hiphil của קרב trong ngữ cảnh tế lễ mang nghĩa đem đến hoặc dâng lễ vật; “đã dâng” xác định tự nhiên vị thầy tế lễ được nhận phần này.
