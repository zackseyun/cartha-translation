source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: vi
  text: '“Hãy nói với con cái Israel[a] rằng: Người nào dâng sinh tế bình an[b] của mình cho Đức Giê-hô-va thì phải đem lễ vật của mình dâng cho Đức Giê-hô-va, lấy từ sinh tế bình an của mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; cũng có thể dịch là “dân Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tế lễ bình an” hoặc “sinh tế giao hảo”. Từ Hê-bơ-rơ là tên của một loại tế lễ và có liên hệ với ý niệm bình an, toàn vẹn hay phúc lợi.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Mệnh lệnh trực tiếp mở đầu lời chỉ dẫn của Đức Chúa Trời; cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ sắc thái tập thể và giao ước của thành ngữ Hê-bơ-rơ, theo nghĩa đen là “các con trai của Israel”, nhưng dùng cách nói tiếng Việt quen thuộc bao gồm toàn dân.
- source_word: הַמַּקְרִיב
  choice: Người nào dâng
  rationale: Phân từ Hiphil của קרב trong ngữ cảnh tế lễ chỉ việc đem đến và trình dâng lễ vật; “dâng” tự nhiên hơn trong tiếng Việt mà vẫn giữ ý nghĩa nghi lễ.
- source_word: זֶבַח שְׁלָמָיו
  choice: sinh tế bình an của mình
  rationale: זֶבַח là sinh tế, còn שְׁלָמִים là tên một loại tế lễ liên hệ về mặt từ nguyên với sự bình an, toàn vẹn hay phúc lợi. Cách dịch này giữ cả bản chất hiến tế lẫn liên hệ từ vựng ấy.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Dùng danh xưng tiếng Việt quen thuộc “Đức Giê-hô-va” để biểu thị minh nhiên danh giao ước יהוה; giới từ “lên” phù hợp với động từ “dâng” trong tiếng Việt.
- source_word: יָבִיא
  choice: phải đem
  rationale: Thể chưa hoàn thành Hiphil có lực quy định trong văn bản luật pháp; “phải” thể hiện rõ nghĩa vụ, còn “đem” giữ nghĩa động từ.
- source_word: קָרְבָּנוֹ
  choice: lễ vật
  rationale: קרבן là vật được đem đến để dâng; “lễ vật” là từ tiếng Việt rõ ràng, trang trọng và phân biệt với toàn bộ sinh tế được nói đến sau đó.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: từ sinh tế bình an của mình
  rationale: 'Giữ trực tiếp quan hệ do giới từ מִן biểu thị: lễ vật dâng lên được lấy từ chính sinh tế bình an.'
theological_decisions:
- issue: Cách chuyển dịch יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA; Yahweh
  rationale: Bản Hê-bơ-rơ dùng danh riêng giao ước. “Đức Giê-hô-va” là dạng danh xưng đã quen thuộc trong tiếng Việt và không làm danh riêng biến mất sau một tước hiệu; các dạng “CHÚA” và “Yahweh” vẫn là những khả năng dịch thuật có cơ sở.
- issue: Thuật ngữ שְׁלָמִים
  choice: sinh tế bình an
  alternative: tế lễ bình an; sinh tế giao hảo
  rationale: “Sinh tế bình an” giữ rõ זֶבַח là một sinh tế và bảo tồn liên hệ của שְׁלָמִים với bình an/toàn vẹn, không thu hẹp ý nghĩa thành riêng sự thông công.
- issue: Đối tượng giao ước בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai của Israel; dân Israel
  rationale: Cụm Hê-bơ-rơ có hình thức giống đực nhưng thường chỉ toàn thể cộng đồng Israel. “Con cái Israel” giữ hình ảnh huyết thống-giao ước mà không khiến độc giả hiện đại hiểu lầm rằng mệnh lệnh chỉ nói với nam giới.
translation_notes:
  register: Văn phong luật pháp, trang trọng nhưng hiện đại. Câu giữ sự lặp lại có chủ ý của “Đức Giê-hô-va” và “sinh tế bình an”, phản ánh cấu trúc nguyên văn thay vì lược bỏ cho gọn.
