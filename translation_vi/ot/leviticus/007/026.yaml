  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: vi
  text: Các ngươi không được ăn bất cứ huyết nào trong mọi nơi cư ngụ của các ngươi,[a] dù là huyết của chim hay của súc vật.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát nghĩa hơn: “khắp mọi nơi cư ngụ của các ngươi” hoặc “trong mọi khu định cư của các ngươi”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “đối với chim và đối với súc vật”; ý nói huyết thuộc về hoặc đến từ chim và súc vật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל דָּם
  choice: bất cứ loại huyết nào
  rationale: Trong mệnh đề phủ định, כָּל mang nghĩa bao quát, được diễn đạt tự nhiên trong tiếng Việt là “bất cứ... nào”; דָּם được dịch trực tiếp là “huyết”, phù hợp văn phong luật lệ và ngữ cảnh Lê-vi.
- source_word: לֹא תֹאכְלוּ
  choice: các ngươi không được ăn
  rationale: Thể vị hoàn thành chưa trọn 2 số nhiều trong lời luật định biểu thị lệnh cấm. “Không được ăn” rõ ràng, hiện đại và giữ lực pháp lệnh; “các ngươi” thể hiện đối tượng số nhiều.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: tại bất cứ nơi nào mình cư ngụ
  rationale: 'מוֹשָׁב có thể chỉ nơi ở hay khu định cư. Cách dịch này truyền đạt rõ phạm vi phân bố của בְּכֹל: lệnh cấm có hiệu lực ở mọi nơi dân chúng cư trú.'
- source_word: לָ/עוֹף
  choice: huyết của chim
  rationale: Tiền tố לְ ở đây nêu loại sinh vật mà huyết thuộc về. Tiếng Việt diễn đạt tự nhiên bằng quan hệ sở thuộc “của chim”.
- source_word: וְ/לַ/בְּהֵמָה
  choice: hay của súc vật
  rationale: בְּהֵמָה chỉ nhóm thú vật, thường là gia súc/súc vật trong ngữ cảnh luật tế lễ. “Súc vật” giữ phạm vi thích hợp hơn “động vật”; “hay” diễn đạt tự nhiên cặp phân loại “dù là... hay...”.
theological_decisions:
- issue: Phạm vi lệnh cấm ăn huyết
  choice: Cấm ăn mọi thứ huyết thuộc về chim hoặc súc vật tại mọi nơi dân Israel cư ngụ.
  alternative: Dịch sát cấu trúc cuối câu là “đối với chim và đối với súc vật”, không nêu rõ quan hệ nguồn gốc hay sở thuộc.
  rationale: Cú pháp Hê-bơ-rơ tự nhiên nhất là liệt kê các nhóm sinh vật có huyết thuộc phạm vi cấm. Bản dịch chỉ làm sáng tỏ quan hệ ngữ pháp, không thêm lời giải thích thần học về ý nghĩa của huyết.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “huyết” thay vì “máu” để phù hợp ngữ vực Kinh Thánh và luật tế lễ; tránh từ cổ hoặc cách diễn đạt quá sát gây khó hiểu. Mọi dấu chú thích đều được đặt trong câu chính.
