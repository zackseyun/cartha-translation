revisions:
- from: Các ngươi không được ăn bất cứ loại huyết nào tại bất cứ nơi nào mình cư ngụ,[a] dù là huyết của chim hay của súc vật.[b]
  to: Các ngươi không được ăn bất cứ huyết nào trong mọi nơi cư ngụ của các ngươi,[a] dù là huyết của chim hay của súc vật.[b]
  rationale: Sửa “bất cứ loại huyết nào” thành “bất cứ huyết nào” để không thêm sắc thái phân loại. Sửa cụm chỉ địa điểm thành “trong mọi nơi cư ngụ của các ngươi” để phản ánh trực tiếp בְּכֹל מוֹשְׁבֹתֵיכֶם, duy trì ngôi xưng nhất quán, và giữ văn phong pháp lệnh tự nhiên. Các chú thích được giữ đúng neo và điều chỉnh chú thích a cho khớp với câu chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:44:17Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lệnh cấm ăn huyết, phạm vi áp dụng tại mọi nơi cư ngụ, và hai nhóm chim cùng súc vật. Tuy nhiên, “bất cứ loại huyết nào” thêm ý phân loại không có trong דָּם, còn “tại bất cứ nơi nào mình cư ngụ” chuyển từ cụm danh từ “trong mọi nơi cư ngụ của các ngươi” sang một mệnh đề và dùng đại từ “mình” không nhất quán với “các ngươi”.
  naturalness: Văn phong luật lệ nhìn chung tự nhiên. “Trong mọi nơi cư ngụ của các ngươi” vừa sát nguồn vừa trang trọng-hiện đại hơn “tại bất cứ nơi nào mình cư ngụ”.
  terminology: “Huyết” phù hợp ngữ vực luật tế lễ Kinh Thánh; “chim” và “súc vật” diễn đạt thích hợp các phạm vi עוֹף và בְּהֵמָה trong câu này. Không cần giải thích thần học thêm.
  issues:
  - severity: low
    issue: “bất cứ loại huyết nào” thêm từ “loại”
    rationale: Nguyên văn chỉ nói “bất cứ huyết nào” trong cấu trúc phủ định; “loại” không cần thiết và có thể hướng người đọc đến các loại huyết thay vì huyết nói chung.
  - severity: medium
    issue: “tại bất cứ nơi nào mình cư ngụ” không nhất quán ngôi xưng và kém sát cấu trúc
    rationale: מוֹשְׁבֹתֵיכֶם là “mọi nơi cư ngụ/khu định cư của các ngươi”. “Mình” sau “các ngươi” gây lệch ngôi; bản sửa giữ trực tiếp sở hữu số nhiều và phạm vi “mọi”.
