  rationale: Chỉnh mốc thời gian thành “vào ngày thứ ba” để phản ánh trực tiếp בַּיּוֹם הַשְּׁלִישִׁי; dùng “phải được thiêu” để bảo toàn thể bị động và sắc thái quy định; thay “con vật hiến tế” bằng “lễ tế” để gần nguyên văn hơn mà vẫn tự nhiên trong tiếng Việt hiện đại.
