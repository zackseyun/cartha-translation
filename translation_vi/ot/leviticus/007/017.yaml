base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: vi
  text: Còn phần thịt còn lại của lễ tế, vào ngày thứ ba, phải được thiêu trong lửa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Nhưng phần… còn lại
  rationale: Liên từ וְ tiếp nối quy định trước nhưng tạo sắc thái chuyển ý; phân từ bị động dùng như danh từ được diễn đạt tự nhiên là “phần… còn lại”.
- source_word: מִבְּשַׂר
  choice: thịt
  rationale: בָּשָׂר có nghĩa đen là “thịt/thân xác”; trong ngữ cảnh thức ăn từ lễ vật, “thịt” là cách nói rõ ràng và tự nhiên nhất.
- source_word: הַזָּבַח
  choice: con vật hiến tế
  rationale: זֶבַח ở đây chỉ vật đã được giết làm sinh tế; “con vật hiến tế” làm rõ rằng phần thịt nói đến thuộc về con vật được dâng, đồng thời tránh cách ghép thiếu tự nhiên “thịt của sự hiến tế”.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: đến ngày thứ ba
  rationale: Trong mạch quy định về phần thịt còn sót lại, cụm này xác định tình trạng của phần thịt khi sang ngày thứ ba. “Đến ngày thứ ba” tự nhiên trong tiếng Việt mà vẫn giữ mốc thời gian của nguyên văn.
- source_word: בָּאֵשׁ
  choice: trong lửa
  rationale: Giữ sát giới từ בְּ và hình ảnh xử lý bằng cách đốt trong lửa.
- source_word: יִשָּׂרֵף
  choice: phải thiêu
  rationale: Thể Niphal chưa hoàn thành mang chức năng quy định. “Phải thiêu” truyền đạt nghĩa bắt buộc và hành động đốt hủy trong văn phong luật lệ; tiếng Việt tự nhiên có thể lược tác nhân dù nguyên ngữ dùng dạng bị động.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, câu ngắn và dễ hiểu. Dùng “hiến tế” để giữ sắc thái nghi lễ; không thêm cách giải thích thần học ngoài nguyên văn.
