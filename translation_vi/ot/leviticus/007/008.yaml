  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của tiếng Hê-bơ-rơ: thầy tế lễ chủ lễ, lễ thiêu thuộc về một người, da của lễ thiêu ấy, và quyền sở hữu của chính thầy tế lễ. Tuy nhiên, אִישׁ là danh từ giống đực số ít; “một người” không chuyển tải dấu hiệu này rõ bằng “một người nam” trong ngữ cảnh pháp quy tế tự.'
