  rationale: Bản sửa chỉ làm rõ giá trị giống đực số ít của אִישׁ bằng “một người nam” và thay cách diễn đạt chú thích bằng một phương án tiếng Việt tự nhiên hơn. Cấu trúc câu, thuật ngữ tế tự, và việc da lễ vật thuộc về thầy tế lễ đã dâng lễ được giữ nguyên.
