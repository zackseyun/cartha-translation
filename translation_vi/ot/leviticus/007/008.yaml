  terminology: “Thầy tế lễ,” “dâng,” “lễ thiêu,” và “da” là các chọn lựa nhất quán, dễ hiểu và phù hợp. Chú thích thay thế “bộ da” không phải cách gọi tự nhiên cho da của con vật trong tiếng Việt hiện đại; “tấm da” là phương án tự nhiên hơn.
