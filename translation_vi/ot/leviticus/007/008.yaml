  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ֨/כֹּהֵ֔ן הַ/מַּקְרִ֖יב אֶת עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽ/עֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: vi
  text: Còn thầy tế lễ dâng lễ thiêu của một người nam thì da của lễ thiêu mà thầy đã dâng sẽ thuộc về thầy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “tấm da.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi tự nhiên, trang trọng và quen thuộc trong tiếng Việt đối với chức vụ tư tế trong luật tế lễ; mạo từ xác định được thể hiện theo ngữ cảnh.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: dâng / đã dâng
  rationale: Thể Hiphil của קרב trong ngữ cảnh tế tự mang nghĩa đem đến để hiến dâng. “Dâng” tự nhiên trong tiếng Việt và sự đối lập “dâng/đã dâng” phản ánh hành động được mô tả rồi nhìn như đã hoàn tất.
- source_word: עֹלַת אִישׁ
  choice: lễ thiêu của một người
  rationale: עֹלָה được dịch nhất quán là “lễ thiêu”; אִישׁ số ít được giữ là “một người”, vốn không bắt buộc xác định giới tính trong cách dùng tiếng Việt.
- source_word: עֹור
  choice: da
  rationale: Chỉ da của con vật hiến tế; “da” là từ phổ thông, chính xác và tự nhiên trong tiếng Việt.
- source_word: הָעֹלָה
  choice: lễ thiêu
  rationale: Tên gọi rõ ràng và quen thuộc cho loại lễ vật bị thiêu trên bàn thờ; tránh lối dịch từ nguyên khó hiểu như “lễ thăng lên”.
- source_word: אֲשֶׁר הִקְרִיב
  choice: mà thầy đã dâng
  rationale: Mệnh đề quan hệ xác định chính lễ thiêu do thầy tế lễ ấy đã dâng; đại từ “thầy” làm rõ chủ thể theo cú pháp Hê-bơ-rơ.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: sẽ thuộc về thầy
  rationale: Diễn đạt tự nhiên cấu trúc nhấn mạnh theo nghĩa đen “sẽ là cho thầy tế lễ, cho chính người ấy”, đồng thời giữ rõ quyền nhận phần da của thầy tế lễ chủ lễ.
theological_decisions:
- issue: Cách thể hiện אִישׁ
  choice: một người
  alternative: một người nam
  rationale: אִישׁ có hình thức giống đực số ít, nhưng “một người” trong tiếng Việt vẫn là số ít và không chủ động xóa bỏ giới tính như một số cách khái quát hóa trong tiếng Anh. Ngữ cảnh câu này không đòi hỏi nhấn mạnh người dâng lễ là nam.
- issue: Thuật ngữ tế tự עֹלָה
  choice: lễ thiêu
  alternative: lễ toàn thiêu
  rationale: “Lễ thiêu” phản ánh loại tế lễ được đốt trên bàn thờ và dễ hiểu đối với độc giả hiện đại. “Lễ toàn thiêu” giải thích rõ hơn việc toàn thể lễ vật bị thiêu nhưng thêm sắc thái diễn giải không hiện diện trực tiếp trong danh từ ở câu này.
- issue: Người được nhận da lễ vật
  choice: thầy tế lễ đã dâng lễ ấy
  alternative: giới thầy tế lễ nói chung
  rationale: Cấu trúc số ít và sự lặp lại của động từ dâng gắn quyền nhận da với chính thầy tế lễ chủ lễ, không nói chung về toàn thể hàng tư tế.
translation_notes:
  register: Văn phong luật tế lễ trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” thay cho thuật ngữ chuyên môn ít phổ biến; trật tự câu tiếng Việt được sắp xếp tự nhiên mà vẫn giữ chủ thể, lễ vật, phần da và người có quyền sở hữu. Mọi dấu chú thích trong phần chú thích đều xuất hiện trong chính văn.
