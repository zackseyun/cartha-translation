id: LEV.15.8
reference: Leviticus 15:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִֽי יָרֹ֛ק הַ/זָּ֖ב בַּ/טָּה֑וֹר וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: vi
  text: Nếu người mắc chứng tiết dịch nhổ vào một người thanh sạch[a], thì người ấy phải giặt quần áo, tắm bằng nước, và sẽ bị ô uế cho đến chiều tối.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một người đang ở tình trạng thanh sạch”. Nguyên văn dùng “người thanh sạch”, nghĩa là người thanh sạch theo nghi lễ.
    reason: lexical_alternative
  - marker: b
    text: Đây là tình trạng ô uế theo nghi lễ cho đến chiều tối, không nhất thiết là sự ô uế về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִֽי
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện trong chuỗi luật lệ; tiếng Việt không cần dịch riêng liên từ ו để giữ mạch văn tự nhiên.
- source_word: יָרֹק
  choice: nhổ vào
  rationale: Động từ có nghĩa là nhổ; giới từ ב đi với đối tượng được diễn đạt tự nhiên là “vào” trong tiếng Việt.
- source_word: הַזָּב
  choice: người mắc chứng tiết dịch
  rationale: Danh từ hóa phân từ chỉ người đang có dịch tiết bất thường; cách dịch này rõ nghĩa, trang trọng và không thêm chẩn đoán y khoa ngoài văn bản.
- source_word: בַּטָּהוֹר
  choice: vào một người thanh sạch
  rationale: Tính từ được dùng như danh từ, chỉ một người ở tình trạng thanh sạch theo nghi lễ; thêm “một người” để câu tiếng Việt tự nhiên.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: thì người ấy phải giặt quần áo
  rationale: Chủ thể ngữ pháp chuyển sang người bị nhổ vào; “người ấy” làm rõ quy chiếu vốn được hàm ý trong tiếng Hê-bơ-rơ.
- source_word: וְרָחַץ בַּמַּיִם
  choice: tắm bằng nước
  rationale: Trong ngữ cảnh này, רָחַץ nói đến việc tắm rửa thân thể; “bằng nước” giữ lại phương tiện được nêu rõ trong nguyên văn.
- source_word: וְטָמֵא
  choice: và sẽ bị ô uế
  rationale: Diễn tả tình trạng không thanh sạch theo nghi lễ phát sinh do tiếp xúc, không mặc nhiên hàm ý tội lỗi đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Công thức thời gian quen thuộc trong Lê-vi Ký, chỉ thời hạn của tình trạng ô uế.
theological_decisions:
- issue: Thuật ngữ về tình trạng thanh sạch theo nghi lễ
  choice: Dịch טָהוֹר là “thanh sạch” và טָמֵא là “bị ô uế”, đồng thời chú thích rõ nghĩa nghi lễ
  alternative: “sạch” / “không sạch” hoặc “tinh sạch” / “ô uế”
  rationale: Các từ này tại Lê-vi Ký 15 nói về địa vị theo luật thanh sạch của Israel, không nhất thiết là phẩm chất đạo đức. Cách dịch đã chọn vừa quen thuộc trong văn phong Kinh Thánh vừa tránh hiểu đơn thuần là vệ sinh thân thể.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “người mắc chứng tiết dịch” để rõ nghĩa mà không quá kỹ thuật; dùng “người ấy” nhằm làm rõ rằng các hành động giặt, tắm và tình trạng ô uế thuộc về người bị nhổ vào. Mọi dấu chú thích đều xuất hiện trong chính văn.
