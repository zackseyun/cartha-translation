  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: vi
  text: Mọi vật mà người đàn ông bị dịch tiết cưỡi lên đều sẽ bị ô uế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi yên mà người đàn ông bị dịch tiết cưỡi lên đều sẽ bị ô uế.” Từ Hê-bơ-rơ có thể chỉ rộng hơn “yên” theo nghĩa hẹp, tức vật mà người ấy cưỡi lên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Mọi
  rationale: כָּל mang nghĩa bao quát/phân phối. Trong tiếng Việt, “mọi” diễn đạt tự nhiên phạm vi toàn thể; không cần dịch riêng וְ ở đầu câu vì câu vẫn nối liền mạch với quy định trước trong văn cảnh.
- source_word: הַ/מֶּרְכָּב
  choice: vật dùng để cưỡi
  rationale: מֶרְכָּב chỉ vật người ta cưỡi hoặc ngồi lên khi cưỡi, có thể là yên nhưng rộng hơn “yên” theo nghĩa hẹp. Cách dịch này giữ được phạm vi từ vựng mà không gợi đến chiến xa.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: mà ... đã ngồi lên
  rationale: Cụm từ theo nghĩa đen là “mà người ấy cưỡi trên đó”. Trong tiếng Việt, “ngồi lên” tự nhiên với một vật dùng để cưỡi và tránh lặp từ “cưỡi”, đồng thời vẫn giữ ý tiếp xúc ở trên vật ấy.
- source_word: הַ/זָּב
  choice: người bị tiết dịch
  rationale: Danh từ hóa từ phân từ giống đực זָב chỉ người nam đang có tình trạng tiết dịch được nói đến xuyên suốt chương. “Người bị tiết dịch” rõ ràng, trang trọng vừa phải và không hàm ý tội lỗi đạo đức.
- source_word: יִטְמָא
  choice: đều sẽ bị ô uế
  rationale: טמא ở đây xác định tình trạng ô uế theo nghi lễ. “Bị ô uế” là cách nói quen thuộc trong luật thanh sạch; “sẽ” diễn đạt hệ quả pháp lý mà không khẳng định quá mức về khởi điểm hay thời lượng của tình trạng.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật Lê-vi
  choice: Dịch טמא là “bị ô uế” theo nghĩa nghi lễ/pháp lý, không đồng nhất với tội lỗi đạo đức.
  alternative: “không thanh sạch” hoặc “bị làm cho ô uế”
  rationale: Câu này nói đến tình trạng nghi lễ phát sinh liên quan đến tiết dịch, chứ không tuyên bố bản thân vật hay người có lỗi về đạo đức.
translation_notes:
  register: Văn phong luật lệ, hiện đại và trang nghiêm, dễ hiểu. Cụm “vật dùng để cưỡi” ưu tiên độ chính xác về phạm vi nghĩa; “tiết dịch” giữ cách diễn đạt kín đáo nhưng rõ ràng trong văn cảnh y khoa-nghi lễ.
