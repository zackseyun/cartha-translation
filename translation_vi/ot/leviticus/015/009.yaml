    issue: “đã ngồi lên” không phản ánh sát động từ יִרְכַּב.
    rationale: Nguyên ngữ dùng dạng chưa hoàn thành trong mệnh đề luật lệ, chỉ hành động tổng quát “cưỡi lên”; không nói riêng hành động ngồi lên và không đòi thì quá khứ hoàn thành.
  - severity: low
    issue: “người bị tiết dịch” không nêu rõ người nam.
    rationale: הַזָּב là phân từ giống đực, và quy định này thuộc phần nói về người nam có dịch tiết. Nêu “người đàn ông” bảo toàn thông tin của bản văn.
  - severity: low
    issue: “tiết dịch” kém tự nhiên hơn “dịch tiết”.
    rationale: “Dịch tiết” là trật tự thuật ngữ tự nhiên trong tiếng Việt hiện đại, vẫn giữ lối nói kín đáo và trung tính.
