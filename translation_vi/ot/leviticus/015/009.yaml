revisions:
- from: Mọi vật dùng để cưỡi mà người bị tiết dịch đã ngồi lên đều sẽ bị ô uế.[a]
  to: Mọi vật mà người đàn ông bị dịch tiết cưỡi lên đều sẽ bị ô uế.[a]
  rationale: Sửa động từ thành “cưỡi lên” để phản ánh trực tiếp יִרְכַּב và tính tổng quát của quy định; thêm “đàn ông” để giữ nét giống đực của הַזָּב; đổi “tiết dịch” thành “dịch tiết” cho tự nhiên hơn. Cách dịch chính vẫn giữ sự mơ hồ từ vựng của מֶרְכָּב, còn chú thích nêu lựa chọn hẹp “yên”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:41Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch diễn đạt đúng phạm vi khái quát của מֶרְכָּב và đúng kết quả ô uế theo nghi lễ. Tuy nhiên, “đã ngồi lên” thay cho động từ יִרְכַּב (“cưỡi lên/cưỡi”) vừa chuyển sắc thái quy định tổng quát sang quá khứ hoàn thành, vừa thu hẹp hành động cưỡi thành ngồi lên. Ngoài ra, “người” không biểu thị rõ nét giống đực của הַזָּב trong câu này.
  naturalness: 'Câu sửa dùng cấu trúc hiện đại, tự nhiên trong văn phong luật lệ: “Mọi vật mà ... cưỡi lên đều sẽ bị ô uế.” Cách này tránh sự lặp nặng nề của “vật dùng để cưỡi ... ngồi lên” mà vẫn giữ nghĩa rộng.'
  terminology: “Dịch tiết” là cách gọi tự nhiên hơn “tiết dịch” trong tiếng Việt hiện đại. “Ô uế” được giữ theo nghĩa nghi lễ, không hàm ý phán xét đạo đức. Chú thích giữ khả năng hiểu hẹp là “yên”, đồng thời nêu phạm vi rộng hơn của từ Hê-bơ-rơ.
  issues:
