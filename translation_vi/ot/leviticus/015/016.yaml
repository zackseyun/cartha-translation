id: LEV.15.16
reference: Leviticus 15:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: vi
  text: Nếu một người nam xuất tinh[a], thì người ấy phải tắm rửa toàn thân bằng nước và sẽ bị ô uế[b] cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “tinh dịch ra khỏi người ấy”; cũng có thể dịch là “có sự phóng tinh.”'
    reason: lexical_alternative
  - marker: b
    text: “Ô uế” ở đây chỉ tình trạng không thanh sạch theo nghi lễ trong các luật thanh sạch của sách Lê-vi, không nhất thiết hàm ý người ấy phạm tội về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: một người nam
  rationale: Giữ đúng đối tượng là nam giới trong luật về sự xuất tinh, đồng thời diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: כִּי
  choice: nếu
  rationale: Trong thể luật nêu trường hợp, từ này tự nhiên nhất được hiểu là điều kiện “nếu”.
- source_word: תֵצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: xuất tinh
  rationale: Cụm Hê-bơ-rơ nói sát nghĩa về việc tinh dịch đi ra từ người ấy; “xuất tinh” là cách nói hiện đại, rõ ràng và chính xác.
- source_word: וְרָחַץ בַּמַּיִם אֶת כָּל בְּשָׂרוֹ
  choice: thì người ấy phải tắm rửa toàn thân bằng nước
  rationale: “Toàn thân” truyền đạt tự nhiên ý “toàn bộ thịt/thân thể mình”; “phải” phù hợp tính quy định của mệnh đề pháp luật.
- source_word: וְטָמֵא
  choice: và sẽ bị ô uế
  rationale: Giữ thuật ngữ quen thuộc của luật thanh sạch; chú thích làm rõ đây là tình trạng ô uế theo nghi lễ, không mặc nhiên là tội lỗi đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Diễn đạt tự nhiên giới hạn thời gian được nêu trong nguyên văn.
theological_decisions:
- issue: Bản chất của טָמֵא trong luật thanh sạch
  choice: ô uế theo nghi lễ
  alternative: ô uế về đạo đức
  rationale: Văn cảnh là luật Lê-vi về dịch tiết cơ thể. Câu này xác định tình trạng thanh sạch theo nghi lễ chứ không trực tiếp quy kết tội lỗi đạo đức; bản chính giữ cách nói ngắn gọn và chú thích nêu rõ phạm vi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người nam” để xác định đúng đối tượng; dùng “tắm rửa toàn thân” thay cho lối dịch sát chữ “rửa toàn bộ thịt mình.” Các dấu chú thích [a], [b] đều có mặt trong bản chính.
