  - severity: low
    issue: “Thân thể người ấy đang chảy tiết dịch” không phải cách kết hợp tự nhiên trong tiếng Việt.
    rationale: Chủ ngữ “thân thể” có thể trực tiếp đi với “tiết dịch”; điều này vẫn phản ánh động từ רָר và không đổi nghĩa.
