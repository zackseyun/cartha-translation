  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: vi
  text: 'Đây là sự ô uế của người ấy trong trường hợp chứng tiết dịch: hoặc thân thể người ấy đang tiết dịch[a], hoặc thân thể người ấy bị bít lại, không tiết dịch; đó là sự ô uế của người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “thịt của người ấy tiết dịch của mình ... thịt của người ấy bị bít lại khỏi dịch tiết của mình.” Ở đây, “thịt” chỉ phần thân thể liên quan đến chứng tiết dịch. Cụm “bị bít lại khỏi dịch tiết” trong tiếng Hê-bơ-rơ khó dịch chính xác; bản dịch diễn đạt tình trạng bị tắc, đối lập với việc tiết dịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: sự ô uế của người ấy
  rationale: Trong luật thanh sạch của Lê-vi Ký, từ này chỉ tình trạng ô uế về nghi lễ; “sự ô uế” vừa quen thuộc vừa giữ được phạm trù nghi lễ.
- source_word: זוֹב
  choice: chứng tiết dịch / tiết dịch
  rationale: Trong ngữ cảnh này, danh từ chỉ tình trạng tiết dịch bất thường từ cơ quan sinh dục. “Chứng tiết dịch” nêu rõ tình trạng bệnh lý, còn “tiết dịch” diễn đạt tự nhiên trong hai vế mô tả.
- source_word: רָר
  choice: đang chảy
  rationale: Động từ diễn tả dịch đang chảy ra; “đang chảy” thể hiện trạng thái hoạt động và tạo thế đối lập rõ với tình trạng bị bít lại.
- source_word: בְּשָׂרוֹ
  choice: thân thể người ấy
  rationale: Nghĩa đen là “thịt/thân xác của người ấy”, nhưng tại đây nói đến bộ phận thân thể liên quan đến sự tiết dịch. “Thân thể” tự nhiên và không đưa thêm cách xác định giải phẫu mà nguyên văn không nói thẳng.
- source_word: הֶחְתִּים
  choice: bị bít lại
  rationale: Dạng động từ mô tả thân thể bị đóng hoặc tắc, khiến dịch không chảy ra. “Bị bít lại” giữ hình ảnh của nguyên văn và đối lập với “đang chảy”.
- source_word: מִזּוֹבוֹ
  choice: không chảy tiết dịch
  rationale: Nguyên văn có cấu trúc “bị bít lại khỏi/do tiết dịch của mình”. Cách diễn đạt tiếng Việt này truyền đạt rõ hệ quả của sự bít tắc trong khi ghi nhận sắc thái nguyên văn ở chú thích.
- source_word: וְזֹאת תִּהְיֶה
  choice: sẽ như sau
  rationale: Giữ sắc thái công thức pháp luật hướng tới việc xác định tình trạng, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: אוֹ
  choice: dù ... hay
  rationale: Nêu hai tình trạng thay thế đều dẫn đến cùng một phán định pháp lý.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng dễ hiểu. Dùng “người ấy” để tránh lặp đại từ mơ hồ; “chứng tiết dịch” mang sắc thái y khoa vừa phải, không uyển ngữ hóa. Từ “vẫn” làm rõ rằng cả hai tình trạng đều thuộc cùng một phán định, vốn đã được cấu trúc dù… hay biểu đạt.
