  text: וְ/אִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗/הּ וּ/תְהִ֤י נִדָּתָ/הּ֙ עָלָ֔י/ו וְ/טָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְ/כָל הַ/מִּשְׁכָּ֛ב אֲשֶׁר יִשְׁכַּ֥ב עָלָ֖י/ו יִטְמָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: vi
  text: Nếu một người đàn ông quả thật nằm với nàng[a], và sự ô uế do kinh nguyệt của nàng truyền sang người ấy, thì người ấy sẽ bị ô uế trong bảy ngày; bất cứ giường nào người ấy nằm trên cũng sẽ bị ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “giao hợp với nàng.” Thành ngữ Hê-bơ-rơ dịch sát là “nếu một người đàn ông quả thật nằm với nàng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: thật sự nằm với
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ chưa hoàn thành nhấn mạnh hành động. “Thật sự nằm với” giữ được sắc thái nhấn mạnh và thành ngữ của nguyên văn; chú thích làm rõ đây là quan hệ tình dục.
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: Danh từ số ít giống đực chỉ một người nam trưởng thành; cách dịch này tự nhiên và chính xác về giới tính.
- source_word: נִדָּתָהּ
  choice: sự ô uế do kinh nguyệt của nàng
  rationale: Trong luật thanh sạch của Lê-vi Ký, từ này chỉ tình trạng ô uế nghi lễ liên quan đến kinh nguyệt, không chỉ hiện tượng sinh học.
- source_word: וּתְהִי ... עָלָיו
  choice: truyền sang người ấy
  rationale: Nguyên nghĩa là “ở trên người ấy”. Trong ngữ cảnh, cách diễn đạt này truyền đạt tự nhiên hậu quả ô uế chuyển sang người đàn ông mà không gán thêm ý nghĩa đạo đức.
- source_word: וְטָמֵא
  choice: người ấy sẽ bị ô uế
  rationale: Trong mệnh đề hệ quả pháp luật, dạng động từ diễn tả tình trạng phát sinh; “sẽ bị ô uế” rõ nghĩa và giữ giọng luật định.
- source_word: שִׁבְעַת יָמִים
  choice: bảy ngày
  rationale: Chuyển dịch trực tiếp thành ngữ chỉ số lượng thời gian.
- source_word: הַמִּשְׁכָּב
  choice: giường
  rationale: Danh từ chỉ chỗ nằm; “giường” là từ thông dụng, phù hợp ngữ cảnh.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: người ấy nằm lên
  rationale: Giữ quan hệ bổ nghĩa và ý nghĩa không gian của nguyên văn bằng lối nói tự nhiên trong tiếng Việt.
- source_word: יִטְמָא
  choice: đều sẽ bị ô uế
  rationale: Dạng chưa hoàn thành trong hệ quả pháp luật được diễn đạt bằng “sẽ”; “đều” tương ứng với phạm vi của “mọi giường”.
theological_decisions:
- issue: Diễn đạt sự ô uế nghi lễ mà không hàm ý tội lỗi đạo đức
  choice: Dùng “ô uế” và “sự ô uế do kinh nguyệt” như các thuật ngữ về thanh sạch nghi lễ
  alternative: Dùng “nhơ bẩn”, “ô nhục”, hoặc diễn giải theo nghĩa phạm tội
  rationale: Lê-vi Ký 15 nói về tình trạng ô uế nghi lễ. Câu này không tự nó khẳng định sự ô uế ấy đồng nghĩa với tội lỗi cá nhân, nên bản dịch không thêm phán đoán đạo đức.
- issue: Quan hệ giữa tình trạng kinh nguyệt của người nữ và sự ô uế của người nam
  choice: Dịch “truyền sang người ấy”
  alternative: Dịch sát hình ảnh “ở trên người ấy”
  rationale: Cách chọn diễn đạt tự nhiên hệ quả được mô tả trong câu, nhưng không giải thích cơ chế hay bổ sung một học thuyết về sự truyền ô uế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người nữ ấy/nàng” để nối với nhân vật nữ trong ngữ cảnh trước, còn “người ấy” chỉ người đàn ông; thuật ngữ “ô uế” giữ sắc thái luật thanh sạch nghi lễ.
