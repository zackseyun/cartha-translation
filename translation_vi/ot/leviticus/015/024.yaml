  naturalness: Cần thay “thật sự nằm với” bằng “quả thật nằm với” để tiếng Việt tự nhiên hơn trong văn phong trang trọng. Cần viết lại mệnh đề về giường để tránh cấu trúc không tự nhiên.
  terminology: “Ô uế” và “ô uế do kinh nguyệt” duy trì đúng trường nghĩa thanh sạch nghi lễ, không hàm ý phán xét đạo đức. “Nằm với” cùng chú thích là cách diễn đạt phù hợp và kín đáo cho thành ngữ chỉ quan hệ tình dục.
