revisions:
- from: Nếu một người đàn ông thật sự nằm với người nữ ấy[a], và sự ô uế do kinh nguyệt của nàng truyền sang người ấy, thì người ấy sẽ bị ô uế trong bảy ngày; mọi giường người ấy nằm lên đều sẽ bị ô uế.
  to: Nếu một người đàn ông quả thật nằm với nàng[a], và sự ô uế do kinh nguyệt của nàng truyền sang người ấy, thì người ấy sẽ bị ô uế trong bảy ngày; bất cứ giường nào người ấy nằm trên cũng sẽ bị ô uế.
  rationale: Bản sửa giữ nguyên ý nghĩa nghi lễ và cấu trúc điều kiện–hệ quả của tiếng Hê-bơ-rơ. “Quả thật” phản ánh sắc thái nhấn mạnh của שָׁכֹב יִשְׁכַּב, còn “bất cứ giường nào người ấy nằm trên” diễn đạt rõ và tự nhiên mệnh đề quan hệ chỉ chiếc giường mà người ấy nằm trên đó. Chú thích vẫn làm rõ thành ngữ mà không áp đặt diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:50Z'
