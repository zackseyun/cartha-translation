id: LEV.15.26
reference: Leviticus 15:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: vi
  text: Mọi chỗ nằm mà người phụ nữ ấy nằm lên trong tất cả những ngày có dịch tiết của mình sẽ như chỗ nằm của người ấy khi có kinh nguyệt[a]; mọi vật dụng mà người ấy ngồi lên sẽ bị ô uế[b], như sự ô uế do kinh nguyệt của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “như chỗ nằm trong tình trạng ô uế do kinh nguyệt của người ấy.” Từ Hê-bơ-rơ נִדָּה có thể chỉ tình trạng kinh nguyệt cùng sự cách ly và ô uế nghi lễ liên hệ.
    reason: lexical_alternative
  - marker: b
    text: “Vật dụng” ở đây là từ có nghĩa rộng, chỉ đồ dùng hoặc vật mà người ấy ngồi lên, chứ không chỉ đồ đựng.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: chỗ nằm
  rationale: Danh từ chỉ nơi người ta nằm; “chỗ nằm” giữ được nghĩa rộng hơn “giường” và phù hợp cả hai lần xuất hiện trong phép so sánh.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: trong suốt những ngày bị tiết dịch
  rationale: זוֹב chỉ tình trạng tiết dịch bất thường trong ngữ cảnh chương này; cách diễn đạt này rõ nghĩa, tự nhiên và giữ sắc thái thời gian của כָּל יְמֵי.
- source_word: נִדָּה
  choice: kỳ kinh nguyệt
  rationale: Trong ngữ cảnh luật thanh sạch này, từ ngữ nói đến tình trạng kinh nguyệt cùng sự cách ly nghi lễ liên hệ; “kỳ kinh nguyệt” truyền đạt trực tiếp sở chỉ mà không đạo đức hóa tình trạng ấy.
- source_word: כְּלִי
  choice: vật
  rationale: כְּלִי có phạm vi rộng, chỉ đồ dùng hay vật dụng; “vật” phù hợp với điều có thể ngồi lên và tránh nghĩa hẹp của “bình” hay “đồ đựng”.
- source_word: טָמֵא / טֻמְאָה
  choice: bị ô uế / sự ô uế
  rationale: Giữ mối liên hệ từ vựng giữa tính từ và danh từ, đồng thời diễn đạt địa vị nghi lễ trong luật Lê-vi, không hàm ý tội lỗi đạo đức.
theological_decisions:
- issue: Bản chất của ngôn ngữ ô uế trong luật Lê-vi
  choice: Dùng “bị ô uế / sự ô uế” để chỉ tình trạng nghi lễ.
  alternative: không thanh sạch / sự không thanh sạch
  rationale: Câu này quy định địa vị nghi lễ chứ không kết án đạo đức; “ô uế” là thuật ngữ Kinh Thánh quen thuộc, còn chú thích giúp ngăn cách hiểu sai.
- issue: Cách hiểu נִדָּה
  choice: Dịch cụ thể là “kỳ kinh nguyệt” trong chính văn.
  alternative: tình trạng ô uế do kinh nguyệt
  rationale: Ngữ cảnh trực tiếp nói đến kinh nguyệt; bản dịch chính tránh đưa thêm từ “ô uế” vào cụm danh từ thứ nhất, trong khi chú thích bảo tồn sắc thái cách ly và ô uế nghi lễ của từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “bà” để chỉ người phụ nữ đã được xác định trong ngữ cảnh; “chỗ nằm” và “vật” giữ độ rộng của nguyên ngữ. Các thuật ngữ “ô uế” được hiểu theo nghi lễ, không theo nghĩa tội lỗi đạo đức.
