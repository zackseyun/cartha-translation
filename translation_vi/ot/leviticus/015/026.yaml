revisions:
- from: Mọi chỗ nằm mà bà nằm lên trong suốt những ngày bị tiết dịch đều sẽ như chỗ nằm trong kỳ kinh nguyệt của bà[a]; mọi vật mà bà ngồi lên đều sẽ bị ô uế[b], như sự ô uế trong kỳ kinh nguyệt của bà.
  to: Mọi chỗ nằm mà người phụ nữ ấy nằm lên trong tất cả những ngày có dịch tiết của mình sẽ như chỗ nằm của người ấy khi có kinh nguyệt[a]; mọi vật dụng mà người ấy ngồi lên sẽ bị ô uế[b], như sự ô uế do kinh nguyệt của người ấy.
  rationale: Bản sửa làm rõ các quan hệ sở hữu và so sánh trong hai cụm có נִדָּה, dùng cách quy chiếu không hàm ý tuổi tác, và cải thiện độ tự nhiên của cụm chỉ dịch tiết. Không thay đổi ý nghĩa nghi lễ hay mức độ khái quát của nguyên ngữ.
