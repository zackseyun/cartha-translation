  source_fidelity: 'Bản dịch giữ đúng cấu trúc và nội dung luật lệ của tiếng Hê-bơ-rơ: người chạm vào vật ở dưới người ấy bị ô uế đến chiều tối; người mang các vật đó phải giặt quần áo, tắm bằng nước, và bị ô uế đến chiều tối. Cách dùng quá khứ “từng ở dưới” là một lựa chọn theo ngữ cảnh thủ tục và vẫn nên được chú thích như một khả năng diễn giải, vì hình thức Hê-bơ-rơ cũng có thể dịch theo hiện tại.'
  naturalness: “Từng ở dưới người ấy” tự nhiên hơn “đã ở dưới người ấy” trong ngữ cảnh này. Bỏ “đều” giúp câu luật lệ gọn và tự nhiên hơn, đồng thời dùng “các vật ấy” tạo liên kết rõ với đại từ số nhiều trong nguyên văn.
  terminology: “Ô uế” phù hợp để chỉ tình trạng ô uế nghi lễ, không hàm ý phán xét đạo đức. “Giặt quần áo” và “tắm bằng nước” là những cách diễn đạt hiện đại, rõ nghĩa và phù hợp với công thức thanh tẩy.
