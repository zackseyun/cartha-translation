translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng cấu trúc “bất cứ ai/ai… thì phải” dễ hiểu. Giữ thuật ngữ “ô uế” để phân biệt tình trạng nghi lễ với sự bẩn về vệ sinh hoặc sự xấu xa về đạo đức.
