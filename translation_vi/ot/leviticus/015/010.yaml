    rationale: Bỏ “đều” làm câu tiếng Việt tự nhiên và trực tiếp hơn mà không thay đổi lực quy định của động từ.
  - severity: low
    issue: Chú thích b diễn đạt quy chiếu của “những vật ấy” vòng vo và có thể gây nhầm lẫn.
    rationale: Đại từ số nhiều trong nguyên văn quy chiếu tập thể đến các vật vừa nêu là những vật từng ở dưới người ấy; chú thích nên nói trực tiếp như vậy.
