  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: vi
  text: Bất cứ ai chạm vào bất cứ vật gì từng ở dưới người ấy sẽ bị ô uế cho đến chiều tối.[a] Ai mang các vật ấy phải giặt quần áo, tắm bằng nước[b] và bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất cứ vật gì đang ở dưới người ấy.” Nguyên văn Hê-bơ-rơ có thể được diễn đạt sát hơn bằng thì hiện tại, nhưng nghĩa quá khứ phù hợp với trình tự luật lệ nói về những vật trước đó ở dưới người mắc chứng tiết dịch.'
    reason: lexical_alternative
  - marker: b
    text: “Các vật ấy” chỉ chung những vật từng ở dưới người ấy.
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: ai chạm vào
  rationale: Phân từ của נגע chỉ sự tiếp xúc bằng thân thể; “chạm vào” trực tiếp, tự nhiên và phù hợp với luật thanh sạch.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: bất cứ vật gì đã ở dưới người ấy
  rationale: Cụm từ nói đến vật từng ở bên dưới người mắc chứng tiết dịch. “Đã ở” làm rõ trình tự thủ tục trong ngữ cảnh, còn “ở dưới” giữ nguyên ý không gian của תַּחַת.
- source_word: יִטְמָא
  choice: đều sẽ bị ô uế
  rationale: Trong luật thanh sạch, טמא diễn tả tình trạng ô uế nghi lễ; “bị ô uế” là cách nói rõ và quen thuộc trong tiếng Việt hiện đại.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, chỉ thời hạn của tình trạng ô uế theo nguyên văn.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: ai mang những vật ấy
  rationale: נשא ở đây có nghĩa mang hoặc chuyên chở. Đại từ số nhiều אֹתָם được thể hiện bằng “những vật ấy”, quy chiếu tập thể đến các vật vừa được nói tới.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: phải giặt quần áo
  rationale: “Quần áo” là cách gọi hiện đại và dễ hiểu cho בְּגָדִים; “phải” truyền đạt lực quy định của văn bản luật.
- source_word: וְרָחַץ בַּמַּיִם
  choice: tắm bằng nước
  rationale: רחץ trong công thức thanh tẩy này nói đến việc rửa thân thể; “tắm bằng nước” diễn đạt rõ hơn “rửa” mà không thêm ý ngoài văn bản.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: và bị ô uế cho đến chiều tối
  rationale: Mệnh đề cuối xác định rằng tình trạng ô uế kéo dài đến chiều tối, ngay cả sau các hành động giặt và tắm.
