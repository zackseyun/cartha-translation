  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: vi
  text: Còn vật dụng bằng đất nung mà người mắc chứng tiết dịch chạm vào thì phải đập vỡ; mọi vật dụng bằng gỗ phải được tráng bằng nước.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: vật dụng bằng đất nung
  rationale: Cụm từ chỉ một vật hoặc đồ đựng làm bằng đất nung. “Vật dụng” đủ rộng cho כְלִי, còn “đất nung” diễn đạt tự nhiên và giữ sự phân biệt về chất liệu trong luật thanh sạch.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: mà ... chạm vào
  rationale: Động từ נגע ở thể Qal thường có nghĩa trực tiếp là “chạm vào”; cách dịch này giữ cấu trúc quan hệ và không diễn giải quá mức.
- source_word: הַזָּב
  choice: người mắc chứng tiết dịch
  rationale: Đây là danh từ hóa từ phân từ, dùng như thuật ngữ trong luật thanh sạch để chỉ người bị dịch cơ thể tiết ra. “Mắc chứng tiết dịch” rõ nghĩa, trang trọng và tập trung vào tình trạng được nêu trong câu.
- source_word: יִשָּׁבֵר
  choice: phải đập vỡ
  rationale: Thể Niphal mang nghĩa bị động, nhưng trong văn cảnh luật định nó diễn đạt mệnh lệnh. Tiếng Việt tự nhiên dùng “phải đập vỡ” để thể hiện rõ nghĩa vụ và kết quả vật bị làm vỡ.
- source_word: כָל כְּלִי עֵץ
  choice: mọi vật dụng bằng gỗ
  rationale: כְלִי có thể chỉ đồ dùng hoặc vật chứa nói chung; “mọi vật dụng bằng gỗ” giữ phạm vi rộng hơn “bình gỗ” và song song với vật dụng bằng đất nung.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: phải được tráng bằng nước
  rationale: שטף chỉ việc xối, rửa hoặc tráng bằng nước. “Tráng bằng nước” phù hợp với vật dụng và phân biệt hành động này với các từ chỉ giặt kỹ hơn.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Còn” nối câu với chuỗi quy định trước đó; cấu trúc “phải” truyền đạt lực luật định tự nhiên hơn lối dịch máy móc bằng tương lai hoặc bị động.
