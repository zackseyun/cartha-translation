revisions:
- from: Khi người mắc chứng tiết dịch đã sạch khỏi chứng tiết dịch của mình, người ấy phải tính đủ bảy ngày để được thanh sạch, rồi giặt quần áo, tắm mình bằng nước sống[a]; bấy giờ người ấy sẽ được thanh sạch.
  to: Khi người đàn ông bị tiết dịch đã được thanh sạch khỏi sự tiết dịch của mình, người ấy phải đếm bảy ngày để được thanh sạch, rồi giặt quần áo và rửa thân thể bằng nước sống[a]; sau đó người ấy sẽ thanh sạch.
  rationale: 'Bản sửa làm rõ đối tượng nam theo nguyên văn và ngữ cảnh gần, cải thiện tính tự nhiên của cách diễn đạt về thanh sạch nghi lễ, và dịch sát hơn hành động rửa thân thể. Trình tự: hết tình trạng tiết dịch/được thanh sạch khỏi nó, đếm bảy ngày, giặt quần áo, rửa thân thể bằng nước sống, rồi thanh sạch, vẫn được bảo toàn. Chú thích được thu hẹp để giải thích chính xác thành ngữ mà không gán ý nghĩa thần học về sau.'
  reviewer_model: gpt-5.6-terra
