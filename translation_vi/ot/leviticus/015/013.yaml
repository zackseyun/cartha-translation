review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhìn chung giữ đúng trình tự nghi lễ và phân biệt thanh sạch nghi lễ với vấn đề đạo đức. Tuy nhiên, “người mắc chứng tiết dịch” không biểu đạt rõ đối tượng nam của הַזָּב trong ngữ cảnh này; đồng thời “đã sạch khỏi chứng tiết dịch” hơi gượng trong tiếng Việt. “Rửa thân thể” sát hơn với וְרָחַץ בְּשָׂרוֹ. Chú thích về “nước sống” nên giới hạn vào nghĩa nước nguồn hoặc nước đang chảy, thay vì nêu rộng là “nước tự nhiên, tươi mới”.
  naturalness: Câu hiện tại dễ hiểu, nhưng lặp “chứng tiết dịch” và cách nói “đã sạch khỏi chứng...” chưa tự nhiên. Bản sửa dùng “người đàn ông bị tiết dịch”, “sự tiết dịch của mình”, và “rửa thân thể” để rõ ràng, hiện đại, nhưng vẫn giữ văn phong luật nghi lễ.
  terminology: Giữ “thanh sạch” cho phạm trù nghi lễ, không gợi ý tội lỗi. Giữ “nước sống” trong chính văn để phản ánh מַיִם חַיִּים và giải thích bằng chú thích trung tính, không áp đặt liên hệ thần học về sau.
  issues:
  - severity: medium
    issue: Đối tượng nam của הַזָּב chưa được nêu rõ.
    rationale: Trong Lê-vi Ký 15:13, הַזָּב chỉ người nam bị tiết dịch trong phần luật dành cho nam. “Người mắc chứng tiết dịch” trung tính về giới, nên làm mờ chi tiết của nguyên văn và ngữ cảnh.
  - severity: low
    issue: Cách diễn đạt “đã sạch khỏi chứng tiết dịch” và “tắm mình” chưa tối ưu.
    rationale: “Đã được thanh sạch khỏi sự tiết dịch của mình” giữ rõ sắc thái nghi lễ của טהר; “rửa thân thể” phản ánh trực tiếp hơn động từ רחץ và danh từ בשר.
  - severity: low
    issue: Chú thích định nghĩa “nước sống” quá rộng.
    rationale: Trong cách dùng nghi lễ của tiếng Hê-bơ-rơ, cụm này chủ yếu chỉ nước từ nguồn hay nước đang chảy. “Nước tự nhiên, tươi mới” có thể thiếu chính xác hoặc gây mơ hồ.
  revised_text: Khi người đàn ông bị tiết dịch đã được thanh sạch khỏi sự tiết dịch của mình, người ấy phải đếm bảy ngày để được thanh sạch, rồi giặt quần áo và rửa thân thể bằng nước sống[a]; sau đó người ấy sẽ thanh sạch.
