  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: vi
  text: Khi người đàn ông bị tiết dịch đã được thanh sạch khỏi sự tiết dịch của mình, người ấy phải đếm bảy ngày để được thanh sạch, rồi giặt quần áo và rửa thân thể bằng nước sống[a]; sau đó người ấy sẽ thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “nước sống”; chỉ nước từ nguồn hoặc nước đang chảy.'
    reason: Giải thích thành ngữ Hê-bơ-rơ מַיִם חַיִּים theo nghĩa nghi lễ và thực tế của nó.
lexical_decisions:
- source_word: הַזָּב
  choice: người mắc chứng tiết dịch
  rationale: Danh từ phân từ chỉ người nam bị chứng tiết dịch được nói đến trong chương này. Cách dịch này tự nhiên, trung tính về y khoa và phù hợp với ngữ cảnh.
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: đã sạch khỏi chứng tiết dịch của mình
  rationale: Động từ טהר ở đây chỉ việc hết tình trạng gây ô uế theo nghi lễ, còn giới từ מן diễn tả được sạch khỏi chứng tiết dịch; cách dịch giữ được phạm trù thanh sạch nghi lễ mà không ngụ ý tội lỗi đạo đức.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: người ấy phải tính đủ bảy ngày
  rationale: Chuỗi động từ mang lực chỉ dẫn trong luật nghi lễ. “Tính đủ” diễn đạt tự nhiên việc đếm trọn thời hạn bảy ngày.
- source_word: לְטָהֳרָתוֹ
  choice: để được thanh sạch
  rationale: Danh từ chỉ tiến trình hoặc trạng thái thanh sạch theo nghi lễ; cách diễn đạt này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: giặt quần áo
  rationale: כבס chỉ việc giặt đồ vải; “giặt quần áo” là cách nói chính xác và tự nhiên.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: tắm mình
  rationale: בשר nghĩa đen là “thịt/thân thể”, nhưng trong ngữ cảnh rửa toàn thân, “tắm mình” trang trọng, gọn và phân biệt với việc giặt quần áo.
- source_word: בְּמַיִם חַיִּים
  choice: bằng nước sống
  rationale: Giữ hình ảnh sát nghĩa của thành ngữ Hê-bơ-rơ “nước sống”, đồng thời chú thích rằng nó chỉ nước tự nhiên, tươi mới hoặc đang chảy.
- source_word: וְטָהֵר
  choice: bấy giờ người ấy sẽ được thanh sạch
  rationale: Mệnh đề kết thúc nêu kết quả của trình tự nghi lễ. “Bấy giờ” làm rõ quan hệ thời gian mà không thêm nội dung thần học.
theological_decisions:
- issue: Thuật ngữ về thanh sạch nghi lễ có thể bị hiểu thành sự vô tội về đạo đức
  choice: Dùng “sạch/thanh sạch” theo nghĩa nghi lễ
  alternative: Dùng “tinh sạch” hoặc diễn giải thành được tha tội
  rationale: Lê-vi Ký 15 nói về tình trạng ô uế do tiết dịch cơ thể, không khẳng định người ấy phạm tội đạo đức. Bản dịch giữ nguyên phạm trù nghi lễ và không đưa ý niệm tha tội vào câu.
- issue: Ý nghĩa của מַיִם חַיִּים
  choice: Giữ “nước sống” trong chính văn và giải thích bằng chú thích
  alternative: Dịch thẳng là “nước đang chảy” hoặc “nước sạch”
  rationale: “Nước sống” bảo tồn hình ảnh nguyên ngữ; chú thích ngăn việc hiểu cụm từ này theo nghĩa thần học xuất hiện ở các ngữ cảnh khác và nêu nghĩa thực tế tại đây.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại. Dùng “người ấy” thay cho lặp lại “người mắc chứng tiết dịch”; tránh từ ngữ gợi sự kết án đạo đức. Cụm “nước sống” được giữ để phản ánh nguyên ngữ và có chú thích giải nghĩa.
