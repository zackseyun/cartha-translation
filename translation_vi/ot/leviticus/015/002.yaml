id: LEV.15.2
reference: Leviticus 15:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבְּרוּ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/אֲמַרְתֶּ֖ם אֲלֵ/הֶ֑ם אִ֣ישׁ אִ֗ישׁ כִּ֤י יִהְיֶה֙ זָ֣ב מִ/בְּשָׂר֔/וֹ זוֹב֖/וֹ טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: vi
  text: 'Hãy nói với dân Y-sơ-ra-ên[a] và bảo họ: Khi một người đàn ông có chất dịch chảy ra từ thân thể mình,[b] chất dịch của người ấy là ô uế.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “từ thịt mình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Hãy nói
  rationale: Dạng mệnh lệnh số nhiều mở đầu lời chỉ dẫn của Đức Chúa Trời; “hãy nói” giữ được sắc thái trang trọng và trực tiếp.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Cụm từ theo nghĩa đen là “các con trai của Y-sơ-ra-ên,” nhưng trong công thức này chỉ cộng đồng Y-sơ-ra-ên; “dân Y-sơ-ra-ên” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: và bảo họ
  rationale: Thể hiện mệnh lệnh tiếp nối trong công thức luật pháp mà không lặp vụng về động từ “nói” trong tiếng Việt.
- source_word: אִישׁ אִישׁ
  choice: một người đàn ông
  rationale: Lối lặp mang nghĩa phân phối, tức bất cứ người đàn ông nào; ngữ cảnh trực tiếp nói về tình trạng tiết dịch ở nam giới.
- source_word: כִּי יִהְיֶה זָב
  choice: Khi … có chất dịch chảy ra
  rationale: כִּי mở đầu trường hợp luật định, nên dịch “khi”; זָב diễn tả tình trạng có dịch chảy hoặc tiết ra.
- source_word: מִבְּשָׂרוֹ
  choice: từ thân thể mình
  rationale: בָּשָׂר theo nghĩa cơ bản là “thịt,” nhưng tại đây chỉ thân thể; cách dịch này rõ ràng, tự nhiên và không thêm bộ phận cơ thể mà nguyên văn không nêu.
- source_word: זוֹבוֹ
  choice: chất dịch của người ấy
  rationale: Danh từ cùng gốc với זָב; “chất dịch” duy trì mối liên hệ từ vựng và phù hợp với văn cảnh luật thanh sạch.
- source_word: טָמֵא הוּא
  choice: là ô uế
  rationale: Đại từ giống đực số ít phù hợp với זוֹבוֹ, nên mệnh đề xác định chất dịch là ô uế.
theological_decisions:
- issue: Thuật ngữ về tình trạng không thanh sạch theo nghi lễ
  choice: ô uế
  alternative: không thanh sạch
  rationale: טָמֵא trong luật Lê-vi nói về tình trạng ô uế theo nghi lễ, không nhất thiết hàm ý tội lỗi đạo đức; “ô uế” là thuật ngữ Kinh Thánh quen thuộc và gọn rõ.
- issue: Chủ thể mang tính ô uế trong mệnh đề cuối
  choice: chất dịch của người ấy là ô uế
  alternative: người ấy là ô uế
  rationale: Cấu trúc זוֹבוֹ טָמֵא הוּא đặt “chất dịch của người ấy” làm chủ thể và đại từ הוּא quy chiếu phù hợp về danh từ này; bản dịch không chuyển tính ô uế sang người đàn ông.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dùng cú pháp và từ ngữ hiện đại, dễ hiểu. “Chất dịch” giữ mức độ kín đáo của nguyên văn, không tự ý xác định cụ thể nguồn tiết dịch; “Y-sơ-ra-ên” theo lối phiên âm tiếng Việt quen dùng.
