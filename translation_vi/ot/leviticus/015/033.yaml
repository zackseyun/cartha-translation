id: LEV.15.33
reference: Leviticus 15:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/דָּוָה֙ בְּ/נִדָּתָ֔/הּ וְ/הַ/זָּב֙ אֶת זוֹב֔/וֹ לַ/זָּכָ֖ר וְ/לַ/נְּקֵבָ֑ה וּ/לְ/אִ֕ישׁ אֲשֶׁ֥ר יִשְׁכַּ֖ב עִם טְמֵאָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: vi
  text: và về người phụ nữ đang trong tình trạng ô uế do kinh nguyệt[a]; về người có chứng tiết dịch, dù là nam hay nữ; và về người đàn ông nằm với một phụ nữ đang bị ô uế[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Có thể dịch sát hơn: “người phụ nữ đau yếu trong tình trạng ô uế do kinh nguyệt”; từ Hê-bơ-rơ ở đây chỉ người phụ nữ đang có kinh.'
    reason: lexical_alternative
  - marker: b
    text: “Ô uế” ở đây nói về tình trạng ô uế nghi lễ theo luật Lê-vi, không phải sự ô uế về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: người phụ nữ đang trong tình trạng ô uế do kinh nguyệt
  rationale: Trong ngữ cảnh luật thanh sạch của Lê-vi Ký, cụm này chỉ người phụ nữ ở trong tình trạng ô uế nghi lễ do kinh nguyệt. Cách dịch tránh thêm ý 'đau ốm' không tất yếu trong câu, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: הַזָּב אֶת זוֹבוֹ
  choice: người có chứng tiết dịch
  rationale: Cấu trúc đồng căn trong tiếng Hê-bơ-rơ được chuyển thành cách nói tự nhiên, chỉ người có sự tiết dịch bất thường; cụm tiếp theo cho thấy phạm vi gồm cả nam lẫn nữ.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: dù là nam hay nữ
  rationale: Diễn đạt tự nhiên ý phân bố và phạm vi áp dụng của luật cho cả hai giới.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: nằm với
  rationale: Giữ lối nói giảm, trang trọng của nguyên văn về quan hệ tình dục, thay vì giải thích tường minh hơn mức cần thiết.
- source_word: טְמֵאָה
  choice: một phụ nữ đang bị ô uế
  rationale: Giữ thuật ngữ nhất quán về tình trạng ô uế nghi lễ trong Lê-vi Ký; dạng đang bị ô uế nhấn mạnh đây là một tình trạng theo luật thanh sạch, không phải phẩm chất đạo đức.
theological_decisions:
- issue: Thuật ngữ về sự thanh sạch nghi lễ
  choice: Dịch נִדָּה và טְמֵאָה bằng ngôn ngữ chỉ tình trạng 'ô uế' theo luật nghi lễ.
  alternative: Dịch theo nghĩa đạo đức như 'nhơ bẩn', hoặc dùng từ ngữ hàm ý người ấy có phẩm chất xấu.
  rationale: Phân đoạn nói về tình trạng thanh sạch theo luật Lê-vi, không đưa ra phán xét về giá trị hay đạo đức của người phụ nữ.
- issue: Sắc thái của הַדָּוָה
  choice: Không thêm từ 'đau ốm' vào chính văn; dùng chú thích để ghi nhận khả năng sát chữ.
  alternative: người phụ nữ đau yếu trong kỳ kinh nguyệt
  rationale: Từ này có thể gợi tình trạng đau yếu, nhưng trong cấu trúc và ngữ cảnh hiện tại nó chỉ người phụ nữ đang có kinh. Đưa 'đau ốm' vào chính văn có thể khiến độc giả hiểu rằng câu chỉ áp dụng khi người ấy mắc bệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê của câu kết luận; dùng dấu chấm phẩy để phân biệt ba nhóm trường hợp. Các thuật ngữ 'kinh nguyệt', 'tiết dịch' và 'ô uế' vừa rõ nghĩa vừa phù hợp ngữ vực luật nghi lễ.
