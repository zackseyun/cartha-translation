  source_fidelity: 'Bản dịch giữ đúng cấu trúc song song, đối tượng nam số ít, và hệ quả tình trạng ô uế theo luật thanh sạch. Tuy nhiên, «bị ô uế» khiến động từ טמא bị hiểu như bị động; ở đây động từ nêu trạng thái/hệ quả: giường và vật dụng sẽ trở nên ô uế.'
  naturalness: «Người đàn ông bị tiết dịch» và «sẽ bị ô uế» chưa thật tự nhiên trong tiếng Việt hiện đại. «Người đàn ông bị chảy dịch» diễn đạt tình trạng thân thể rõ hơn mà không xác định loại dịch; «sẽ trở nên ô uế» tự nhiên và chính xác hơn cho hệ quả pháp lý.
  terminology: Giữ «ô uế» cho tình trạng thanh sạch nghi lễ và «vật dụng» cho כְּלִי. Chú thích vẫn cần thiết vì כְּלִי có nghĩa rộng hơn một loại đồ vật cụ thể.
