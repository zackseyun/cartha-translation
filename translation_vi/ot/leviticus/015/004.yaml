revisions:
- from: Mọi giường mà người đàn ông bị tiết dịch nằm lên đều sẽ bị ô uế; mọi đồ vật[a] mà người ấy ngồi lên cũng đều sẽ bị ô uế.
  to: Mọi giường mà người đàn ông bị chảy dịch nằm trên đó đều sẽ trở nên ô uế; mọi vật dụng[a] mà người ấy ngồi trên đó cũng đều sẽ trở nên ô uế.
  rationale: Điều chỉnh cách diễn đạt về người có dịch chảy ra cho tự nhiên hơn, và thay cấu trúc bị động bằng «trở nên ô uế» để phản ánh đúng tình trạng pháp lý do động từ Hê-bơ-rơ nêu. Giữ «vật dụng» kèm chú thích để bảo toàn độ rộng nghĩa của כְּלִי.
  reviewer_model: gpt-5.6-terra
