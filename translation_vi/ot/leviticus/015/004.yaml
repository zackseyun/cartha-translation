id: LEV.15.4
reference: Leviticus 15:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֗ב אֲשֶׁ֨ר יִשְׁכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָ֑א וְ/כָֽל הַ/כְּלִ֛י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: vi
  text: Mọi giường mà người đàn ông bị chảy dịch nằm trên đó đều sẽ trở nên ô uế; mọi vật dụng[a] mà người ấy ngồi trên đó cũng đều sẽ trở nên ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có nghĩa rộng, có thể chỉ vật dụng, dụng cụ hoặc đồ chứa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: giường
  rationale: Danh từ מִשְׁכָּב chỉ nơi dùng để nằm. “Giường” là cách diễn đạt tự nhiên, rõ nghĩa trong ngữ cảnh này.
- source_word: הַזָּב
  choice: người đàn ông bị tiết dịch
  rationale: Phân từ dùng như danh từ זָב cùng các hình thức giống đực số ít chỉ một người nam đang có hiện tượng dịch cơ thể chảy ra. Cách dịch này giữ rõ giới tính và không xác định quá mức loại dịch.
- source_word: יִשְׁכַּב עָלָיו
  choice: nằm lên
  rationale: Cụm שׁכב với עַל có nghĩa là nằm trên một bề mặt; “nằm lên” tự nhiên trong mệnh đề quan hệ tiếng Việt.
- source_word: יִטְמָא
  choice: sẽ bị ô uế
  rationale: Động từ טמא ở đây nêu tình trạng ô uế theo luật thanh sạch như hệ quả của việc tiếp xúc. “Ô uế” giữ thuật ngữ nghi lễ quen thuộc mà không hàm ý tội lỗi đạo đức.
- source_word: הַכְּלִי
  choice: đồ vật
  rationale: כְּלִי có phạm vi nghĩa rộng, gồm vật dụng, dụng cụ hay đồ chứa. Vì vật được nói đến là thứ có thể ngồi lên, “đồ vật” chính xác và tự nhiên hơn “bình” hay “vật chứa”.
- source_word: יֵשֵׁב עָלָיו
  choice: ngồi lên
  rationale: ישׁב với עַל ở đây có nghĩa là ngồi trên một vật; “ngồi lên” phù hợp với cách diễn đạt thông dụng trong tiếng Việt.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: diễn đạt bằng “ô uế” theo phạm trù thanh sạch nghi lễ
  alternative: “ô uế về nghi lễ” hoặc “bị làm nhơ bẩn”
  rationale: Câu này nói đến tình trạng theo luật thanh sạch Lê-vi, không nhất thiết nói đến tội lỗi đạo đức. Không thêm “về nghi lễ” vào chính văn vì nguyên ngữ không có từ bổ nghĩa ấy.
- issue: Giới tính của người bị tiết dịch
  choice: “người đàn ông bị tiết dịch” và “người ấy”
  alternative: “người bị tiết dịch”
  rationale: Nguyên ngữ và văn cảnh dùng giống đực số ít để nói về một người nam. Nêu rõ “người đàn ông” giữ thông tin này; “người ấy” ở vế sau tránh lặp nặng nề mà vẫn giữ nguyên tham chiếu.
- issue: Sắc thái của יִטְמָא
  choice: “sẽ bị ô uế”
  alternative: “thì ô uế” hoặc “sẽ trở nên ô uế”
  rationale: Cách dịch đã chọn thể hiện hệ quả pháp lý và tình trạng phát sinh, nhưng không giải thích thêm cơ chế hay mức độ của sự ô uế.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, với cấu trúc song song giữa “nằm lên” và “ngồi lên”. Dùng “tiết dịch” để nói rõ hiện tượng cơ thể mà vẫn giữ cách diễn đạt kín đáo, không xác định quá mức.
