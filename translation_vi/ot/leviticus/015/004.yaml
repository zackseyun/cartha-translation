  - severity: low
    issue: «người đàn ông bị tiết dịch» không tự nhiên
    rationale: Cụm này gượng trong tiếng Việt hiện đại. «Người đàn ông bị chảy dịch» giữ ý về một người nam đang có dịch chảy ra, không gọi tên hoặc chẩn đoán cụ thể loại dịch.
  revised_text: Mọi giường mà người đàn ông bị chảy dịch nằm trên đó đều sẽ trở nên ô uế; mọi vật dụng[a] mà người ấy ngồi trên đó cũng đều sẽ trở nên ô uế.
