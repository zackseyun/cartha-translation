id: LEV.15.28
reference: Leviticus 15:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: vi
  text: Nhưng nếu người nữ đã khỏi tình trạng tiết dịch của mình[a], thì người nữ phải tự đếm bảy ngày; sau đó người nữ sẽ được thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã sạch khỏi tình trạng tiết dịch của mình… sau đó người nữ sẽ được thanh sạch.” Tiếng Hê-bơ-rơ dùng cùng một gốc từ ở cả hai mệnh đề: trước hết nói đến việc người nữ thoát khỏi tình trạng tiết dịch, rồi nói đến tình trạng thanh sạch nghi lễ đạt được sau đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện có sắc thái chuyển ý so với trường hợp vừa nêu, đồng thời giữ lời văn tự nhiên trong tiếng Việt.
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: đã sạch khỏi sự tiết dịch của mình
  rationale: Động từ qal diễn tả việc người nữ thoát khỏi tình trạng do sự tiết dịch gây nên; cách dịch này giữ hình ảnh 'sạch khỏi' của nguyên văn mà không hàm ý tội lỗi đạo đức.
- source_word: וְסָפְרָה לָּהּ שִׁבְעַת יָמִים
  choice: thì phải tự tính đủ bảy ngày
  rationale: Giữ lực quy định của mệnh đề nối tiếp; 'tự' phản ánh לָּהּ, còn 'tính đủ' diễn đạt tự nhiên việc đếm một thời hạn trọn bảy ngày.
- source_word: וְאַחַר
  choice: sau đó
  rationale: Đánh dấu giai đoạn tiếp theo sau thời hạn bảy ngày một cách rõ ràng, tự nhiên.
- source_word: תִּטְהָר
  choice: người nữ sẽ được sạch
  rationale: Diễn tả tình trạng thanh sạch nghi lễ đạt được sau thời hạn quy định. Dạng 'được sạch' tự nhiên trong văn cảnh luật thanh sạch và phân biệt với việc sự tiết dịch đã chấm dứt ở đầu câu.
theological_decisions:
- issue: Thuật ngữ về tình trạng thanh sạch nghi lễ
  choice: Dùng 'sạch/được sạch' theo nghĩa nghi lễ
  alternative: thanh sạch/được thanh tẩy
  rationale: Lê-vi Ký 15 nói về địa vị nghi lễ liên quan đến sự tiết dịch của thân thể, không khẳng định người nữ có tội về đạo đức. Cách dịch này giữ phạm trù của nguyên văn mà không du nhập ý niệm lên án.
- issue: Hai cách dùng của căn טהר trong cùng câu
  choice: Dịch lần đầu là 'đã sạch khỏi sự tiết dịch', lần sau là 'sẽ được sạch'
  alternative: Dịch cả hai lần đồng nhất là 'được thanh sạch'
  rationale: 'Giữ sự lặp lại về ý niệm ''sạch'' nhưng vẫn cho thấy tiến trình của câu: trước hết sự tiết dịch chấm dứt, rồi sau bảy ngày người nữ có tình trạng thanh sạch nghi lễ. Chú thích bảo lưu khả năng hiểu từ ngữ theo cách khác.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'người nữ' để giữ đối tượng rõ ràng trong văn luật; 'sự tiết dịch' là thuật ngữ trung tính, chính xác. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
