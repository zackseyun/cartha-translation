revisions:
- from: Vậy, các con phải cảnh báo dân Y-sơ-ra-ên về sự ô uế của họ, để họ không phải chết trong tình trạng ô uế vì làm ô uế Đền Tạm của Ta, là nơi ở giữa họ.
  to: Vậy, các ngươi phải cảnh báo dân Y-sơ-ra-ên về sự ô uế của họ, để họ khỏi chết trong tình trạng ô uế của mình do làm ô uế Đền Tạm của Ta ở giữa họ.
  rationale: Sửa cách xưng hô thành “các ngươi” để không thêm sắc thái ngoài văn bản; đổi “không phải chết” thành “khỏi chết” để diễn đạt rõ mục đích phòng ngừa. “Do làm ô uế” giữ quan hệ phương tiện/hoàn cảnh của nguyên thể với ב, còn “ở giữa họ” dịch sát và tự nhiên mệnh đề quan hệ bổ nghĩa cho Đền Tạm. Không cần chú thích vì không có biến thể hay mơ hồ nào cần đánh dấu trong bản dịch ngắn này.
