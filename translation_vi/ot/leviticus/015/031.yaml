source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: vi
  text: Vậy, các ngươi phải cảnh báo dân Y-sơ-ra-ên về sự ô uế của họ, để họ khỏi chết trong tình trạng ô uế của mình do làm ô uế Đền Tạm của Ta ở giữa họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: các con phải cảnh báo
  rationale: Dạng Hiphil của זהר trong ngữ cảnh luật lệ mang nghĩa cảnh báo nhằm ngăn ngừa hậu quả. Chủ ngữ số nhiều được diễn đạt là “các con” theo lời Đức Chúa Trời phán với Môi-se và A-rôn trong mạch văn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Đây là cách gọi tập thể quen thuộc, tự nhiên trong tiếng Việt, bao gồm cộng đồng Y-sơ-ra-ên mà không làm thay đổi đối tượng quy chiếu của thành ngữ Hê-bơ-rơ nghĩa đen là “các con trai của Y-sơ-ra-ên”.
- source_word: מִטֻּמְאָתָם
  choice: về sự ô uế của họ
  rationale: Với động từ cảnh báo, מִן chỉ điều cần được cảnh báo hoặc đề phòng. “Về” diễn đạt tự nhiên quan hệ này, còn “sự ô uế” giữ nguyên phạm trù nghi lễ.
- source_word: טֻמְאָה
  choice: sự ô uế / tình trạng ô uế
  rationale: Trong Lê-vi Ký, từ này chủ yếu chỉ tình trạng ô uế theo nghi lễ, không nên bị đồng nhất với tội lỗi luân lý. Hai cách diễn đạt tiếng Việt được dùng theo cú pháp của từng vị trí.
- source_word: וְלֹא יָמֻתוּ
  choice: để họ không phải chết
  rationale: Liên từ cùng thể phủ định diễn đạt mục đích phòng ngừa sau mệnh lệnh cảnh báo; “để… không phải chết” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: בְּטֻמְאָתָם
  choice: trong tình trạng ô uế
  rationale: Giữ nghĩa trạng thái hoặc hoàn cảnh của giới từ ב, tránh quyết định dứt khoát rằng sự ô uế tự nó là nguyên nhân trực tiếp của cái chết.
- source_word: בְּטַמְּאָם
  choice: vì làm ô uế
  rationale: Động từ nguyên thể với ב nêu hoàn cảnh hoặc phương tiện dẫn đến hậu quả. “Vì làm ô uế” diễn đạt rõ mối liên hệ ấy và giữ sắc thái gây ô uế đối với nơi thánh.
- source_word: מִשְׁכָּנִי
  choice: Đền Tạm của Ta
  rationale: מִשְׁכָּן ở đây là nơi ngự cụ thể của Đức Chúa Trời giữa dân Y-sơ-ra-ên. “Đền Tạm” là thuật ngữ Kinh Thánh tiếng Việt dễ hiểu và phân biệt với đền thờ cố định về sau.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: là nơi ở giữa họ
  rationale: Mệnh đề quan hệ nhấn mạnh sự hiện diện của nơi ngự Đức Chúa Trời giữa cộng đồng; cách dịch này tự nhiên và sát nghĩa.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật Lê-vi
  choice: Dùng “sự ô uế” và “tình trạng ô uế” theo nghĩa nghi lễ.
  alternative: Dịch bằng từ ngữ hàm ý tội lỗi hoặc bẩn thỉu về đạo đức.
  rationale: Câu này nói về tình trạng nghi lễ có thể làm ô uế nơi Đức Chúa Trời ngự; không nên biến phạm trù ấy thành một phán quyết luân lý khái quát.
- issue: Mối liên hệ giữa sự ô uế, việc làm ô uế Đền Tạm và cái chết
  choice: Giữ cả trạng thái “trong tình trạng ô uế” lẫn hành động “làm ô uế Đền Tạm” trong cấu trúc câu.
  alternative: Rút gọn thành chết chỉ vì ô uế, hoặc giải thích chi tiết cơ chế hình phạt.
  rationale: Bản Hê-bơ-rơ đặt hai yếu tố cạnh nhau và để lại độ căng nhất định về quan hệ chính xác giữa chúng; bản dịch không nên giải thích vượt quá văn bản.
- issue: Danh xưng cộng đồng בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên
  rationale: Trong ngữ cảnh này, thành ngữ chỉ toàn thể cộng đồng giao ước. Cách nói “dân Y-sơ-ra-ên” truyền đạt đúng phạm vi trong tiếng Việt hiện đại mà không áp đặt một giới hạn chỉ gồm nam giới.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu. Dùng “Đền Tạm” theo truyền thống thuật ngữ Kinh Thánh tiếng Việt; viết hoa “Ta” vì đây là lời Đức Chúa Trời phán. Không thêm chú thích vì các lựa chọn chính có thể được diễn đạt rõ ngay trong câu.
