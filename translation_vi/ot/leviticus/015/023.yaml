  source_fidelity: Bản dịch chuyển tải đúng cấu trúc điều kiện, chiếc giường, vật dụng/đồ vật mà người phụ nữ ngồi trên, việc chạm vào vật ấy và tình trạng ô uế đến chiều tối. Tuy nhiên, «ngồi lên» thường chỉ động tác ngồi xuống/đi lên trên vật, trong khi phân từ Hê-bơ-rơ יֹשֶׁבֶת chỉ tình trạng đang ngồi; nên cần chỉnh để giữ đúng sắc thái này.
