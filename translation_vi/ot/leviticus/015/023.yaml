  to: Nếu vật ấy ở trên giường hoặc trên vật dụng[a] mà người phụ nữ ấy đang ngồi, thì ai chạm vào vật ấy sẽ bị ô uế cho đến chiều tối.
  rationale: Chỉnh «ngồi lên» thành «đang ngồi» để phản ánh đúng phân từ Hê-bơ-rơ chỉ trạng thái đang diễn ra. Dùng «ai» cho chủ thể quy định chung, giúp câu tự nhiên hơn mà không thay đổi nghĩa. Chú thích được làm mượt nhẹ về từ ngữ, vẫn nêu các lựa chọn nghĩa chính của כְּלִי.
