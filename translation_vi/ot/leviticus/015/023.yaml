source:
  edition: WLC
  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: vi
  text: Nếu vật ấy ở trên giường hoặc trên vật dụng[a] mà người phụ nữ ấy đang ngồi, thì ai chạm vào vật ấy sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể chỉ «đồ vật», «dụng cụ» hoặc «đồ đựng».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nếu
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện nối tiếp các quy định trước; quan hệ liên kết của וְ được thể hiện qua vị trí tiếp nối của câu, không cần thêm “và” một cách gượng ép.
- source_word: עַל הַמִּשְׁכָּב
  choice: ở trên giường
  rationale: מִשְׁכָּב chỉ giường hoặc chỗ nằm; “giường” rõ ràng và phù hợp với văn cảnh luật thanh sạch.
- source_word: הוּא
  choice: vật ấy
  rationale: Đại từ giống đực số ít có vẻ chỉ một vật đã được hàm ý trong văn cảnh, không phải một người nam. “Vật ấy” giúp câu tiếng Việt dễ hiểu nhưng không xác định cụ thể vật đó là gì.
- source_word: עַל הַכְּלִי
  choice: trên vật dụng[a]
  rationale: כְּלִי là từ có nghĩa rộng, có thể chỉ đồ vật, dụng cụ hoặc vật chứa. “Vật dụng” tự nhiên và giữ được độ rộng tương đối của từ nguồn.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: mà người phụ nữ ấy ngồi lên
  rationale: Chuyển tải trực tiếp mệnh đề quan hệ và sắc thái tiếp diễn của phân từ; thêm “người phụ nữ ấy” để đại từ giống cái được rõ nghĩa trong tiếng Việt.
- source_word: בְּנָגְעוֹ בוֹ
  choice: khi một người chạm vào vật ấy
  rationale: בְּ với động từ nguyên mẫu biểu thị hoàn cảnh thời gian. Hậu tố ngôi ba giống đực số ít được diễn đạt bằng “một người” trong lối quy định chung của tiếng Việt, tránh khiến người đọc hiểu sai rằng chỉ nam giới mới chịu quy định này.
- source_word: יִטְמָא
  choice: người đó sẽ bị ô uế
  rationale: Dạng vị hoàn thành mang ý nghĩa kết quả/quy định trong luật nghi lễ. “Bị ô uế” nói về tình trạng không thanh sạch theo nghi lễ, không tự động hàm ý phạm tội về đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Giữ công thức thời gian quen thuộc trong Lê-vi Ký; “chiều tối” tự nhiên và rõ hơn chỉ “chiều” trong tiếng Việt.
theological_decisions:
- issue: Bản chất của טָמֵא trong luật thanh sạch Lê-vi
  choice: bị ô uế
  alternative: không thanh sạch về nghi lễ
  rationale: Câu này nói đến tình trạng ô uế theo nghi lễ, không nhất thiết là tội lỗi đạo đức. “Bị ô uế” ngắn gọn, theo sát cách nói của nguyên văn và không thêm lời giải nghĩa vào chính câu.
- issue: Người chạm vào vật
  choice: một người… người đó
  alternative: người nam ấy… người ấy
  rationale: Hình thái Hê-bơ-rơ là ngôi ba giống đực số ít, nhưng trong văn luật có thể đại diện cho người bất định. Cách dịch này bảo toàn phạm vi quy định mà không nhập thêm giới hạn thần học hoặc pháp lý chỉ dành cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc điều kiện của luật nghi lễ. Dùng “người phụ nữ ấy” để làm rõ chủ thể giống cái và “người đó” cho tác nhân bất định. Dấu chú thích [a] được đặt ngay sau “vật dụng” là từ cần giải thích.
