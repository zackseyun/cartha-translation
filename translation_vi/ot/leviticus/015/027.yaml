source:
  edition: WLC
  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: vi
  text: Bất cứ ai chạm vào những vật ấy[a] sẽ trở nên ô uế. Người ấy phải giặt quần áo, tắm rửa trong nước, và sẽ ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là những vật liên quan đến tình trạng ô uế của người phụ nữ trong phần trước, chẳng hạn vật mà người ấy nằm hoặc ngồi lên.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: Bất cứ ai chạm vào
  rationale: Cấu trúc כָּל đi với phân từ mang nghĩa khái quát bất định, chỉ mọi người thuộc trường hợp được nêu; cách diễn đạt này tự nhiên và giữ trọn phạm vi của câu.
- source_word: בָּם
  choice: những vật ấy
  rationale: Đại từ số nhiều giống đực chỉ lại các vật đã được nói đến trong ngữ cảnh trước. Dịch là “những vật ấy” giúp tiếng Việt rõ hơn đại từ đơn thuần nhưng không đưa danh sách giải thích vào chính văn.
- source_word: יִטְמָא
  choice: đều sẽ bị ô uế
  rationale: טמא trong luật thanh sạch Lê-vi chỉ tình trạng ô uế về nghi lễ, không nhất thiết hàm ý phạm tội về đạo đức. “Bị ô uế” là cách nói quen thuộc và phù hợp ngữ cảnh.
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: người đó phải giặt quần áo
  rationale: כבס ở đây nói đến việc giặt y phục. Việc nêu lại “người đó” tránh đại từ mang giới không cần thiết, còn “phải” diễn đạt lực quy định của chuỗi động từ trong luật lệ.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: tắm bằng nước
  rationale: רחץ trong ngữ cảnh này nói đến việc rửa thân thể; “tắm bằng nước” rõ nghĩa và bám sát cụm giới từ trong tiếng Hê-bơ-rơ.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: và bị ô uế cho đến chiều tối
  rationale: Mệnh đề xác định thời hạn của tình trạng ô uế. “Cho đến chiều tối” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của tình trạng טמא trong luật Lê-vi
  choice: Dịch là “bị ô uế” theo phạm trù thanh sạch nghi lễ.
  alternative: “bị nhơ bẩn” hoặc cách diễn đạt hàm ý tội lỗi đạo đức
  rationale: Ngữ cảnh quy định về thanh sạch nghi lễ do tiếp xúc. Bản dịch không đồng nhất tình trạng này với tội lỗi luân lý.
- issue: Đối tượng của đại từ בָּם
  choice: Giữ cách chỉ dẫn “những vật ấy” trong chính văn và giải thích bằng chú thích.
  alternative: Ghi cụ thể ngay trong chính văn là chỗ người phụ nữ nằm hoặc ngồi
  rationale: Đại từ có đối tượng quy chiếu từ ngữ cảnh trước nhưng bản thân câu không liệt kê chúng; giữ cách nói khái quát bảo toàn cấu trúc và tránh giải nghĩa quá mức.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “bất cứ ai” và “người đó” để giữ tính khái quát, không áp đặt giới tính; dùng dấu chấm phẩy để phân tách hậu quả và các yêu cầu thanh tẩy.
