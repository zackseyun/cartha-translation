  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: vi
  text: 'Đây là luật về người bị tiết dịch, và về người xuất tinh, khiến mình bị ô uế vì việc ấy:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Đây là luật về
  rationale: Đây là công thức tổng kết một quy định trong sách Lê-vi; “luật về” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái pháp quy của תּוֹרָה.
- source_word: הַזָּב
  choice: người mắc chứng tiết dịch
  rationale: Danh từ phân từ chỉ người có tình trạng dịch cơ thể chảy ra; “mắc chứng tiết dịch” diễn đạt rõ đây là một tình trạng thân thể, không thu hẹp quá mức loại dịch.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע
  choice: và về người xuất tinh
  rationale: Cụm Hê-bơ-rơ có nghĩa sát là “và người mà từ người ấy tinh dịch đi ra”; “người xuất tinh” là cách nói hiện đại, rõ ràng và gọn, vẫn truyền đạt đúng sự kiện sinh lý.
- source_word: לְטָמְאָה בָהּ
  choice: khiến mình bị ô uế bởi đó
  rationale: Động từ nguyên mẫu có thể chỉ kết quả hoặc mục đích; trong ngữ cảnh, cách dịch theo kết quả là tự nhiên hơn. “Bởi đó” giữ quan hệ phương tiện/nguyên nhân của בָהּ mà không xác định quá mức đại từ ấy chỉ riêng chất dịch hay sự xuất tinh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ô uế” theo nghĩa nghi lễ trong hệ thống luật Lê-vi, không hàm ý phán xét đạo đức. Dấu hai chấm được giữ vì câu này mở đầu phần tổng kết tiếp tục ở các câu sau.
