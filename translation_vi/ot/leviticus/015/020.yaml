review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc song hành và phạm vi bao quát của כָּל אֲשֶׁר, cũng như phân biệt hành động nằm và ngồi. Tuy nhiên, “nằm lên/ngồi lên” không tự nhiên trong tiếng Việt khi chỉ bề mặt mà người phụ nữ đang nằm hoặc ngồi trên; “nằm trên/ngồi trên” truyền đạt trực tiếp quan hệ không gian עָלָיו. “Bị ô uế” có sắc thái bị động không có trong dạng vị ngữ của tiếng Hê-bơ-rơ; “trở nên ô uế” diễn đạt kết quả nghi lễ trong ngữ cảnh luật lệ mà không thêm chủ thể tác động.
  naturalness: Cần đổi “Mọi vật nàng nằm lên” và “mọi vật nàng ngồi lên” thành các cụm có “trên” để văn bản chuẩn, rõ nghĩa và tự nhiên hơn. “Trong thời gian nàng ô uế vì kinh nguyệt” cũng trôi chảy hơn “trong thời gian ô uế vì kinh nguyệt”, đồng thời làm rõ rằng đây là tình trạng của người phụ nữ.
  terminology: “Ô uế” được giữ nhất quán cho טמא và chú thích tiếp tục xác định đây là ô uế theo nghi lễ, không phải phán đoán đạo đức. “Kinh nguyệt” là thuật ngữ hiện đại, trung tính và phù hợp văn phong.
  issues:
  - severity: medium
    issue: Cụm “nàng nằm lên/ngồi lên” không tự nhiên và có thể gợi hành động leo hoặc đặt mình lên, thay vì quan hệ nằm/ngồi trên một vật.
    rationale: עָלָיו chỉ vật ở bên dưới người phụ nữ. Tiếng Việt chuẩn trong ngữ cảnh này là “nằm trên” và “ngồi trên”.
  - severity: low
    issue: “Bị ô uế” thêm sắc thái bị động.
    rationale: יִטְמָא ở đây nêu tình trạng/kết quả ô uế theo nghi lễ. “Sẽ trở nên ô uế” diễn đạt tự nhiên kết quả đó mà không hàm ý một tác nhân được nêu rõ.
  revised_text: Mọi vật nàng nằm trên trong thời gian nàng ô uế vì kinh nguyệt sẽ trở nên ô uế[a]; mọi vật nàng ngồi trên cũng sẽ trở nên ô uế.
