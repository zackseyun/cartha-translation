base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: vi
  text: Mọi vật nàng nằm trên trong thời gian nàng ô uế vì kinh nguyệt sẽ trở nên ô uế[a]; mọi vật nàng ngồi trên cũng sẽ trở nên ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong kỳ kinh nguyệt của nàng.” Từ Hê-bơ-rơ bao hàm tình trạng ô uế theo nghi lễ gắn với kinh nguyệt, chứ không chỉ chu kỳ sinh lý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: thời gian ô uế vì kinh nguyệt
  rationale: Trong luật thanh sạch của Lê-vi Ký 15, từ này chỉ tình trạng ô uế theo nghi lễ gắn với kỳ kinh, chứ không chỉ hiện tượng sinh lý. Cách dịch này giữ cả bối cảnh kinh nguyệt lẫn phạm trù nghi lễ.
- source_word: תִּשְׁכַּב
  choice: nằm
  rationale: Động từ diễn tả việc nằm trên một vật, không nhất thiết là ngủ; “nằm” trực tiếp và tự nhiên trong tiếng Việt.
- source_word: תֵּשֵׁב
  choice: ngồi
  rationale: Động từ ở đây mang nghĩa thông thường là ngồi trên một vật.
- source_word: עָלָיו
  choice: lên
  rationale: Trong các cụm “nằm lên” và “ngồi lên”, từ này diễn đạt tự nhiên quan hệ không gian với vật ở bên dưới nàng.
- source_word: יִטְמָא
  choice: sẽ bị ô uế
  rationale: Trong ngữ cảnh luật thanh sạch, động từ chỉ vật ở vào tình trạng ô uế theo nghi lễ. “Bị ô uế” cũng làm rõ sự truyền tình trạng ô uế mà không hàm ý lỗi đạo đức.
- source_word: וְכֹל אֲשֶׁר
  choice: mọi vật ... lên
  rationale: Cấu trúc này chỉ toàn bộ các vật thuộc phạm vi mệnh đề quan hệ; tiếng Việt diễn đạt tự nhiên bằng “mọi vật nàng ... lên”.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật thanh sạch Lê-vi
  choice: Dùng ngôn ngữ ô uế theo nghi lễ, không hàm ý tội lỗi đạo đức
  alternative: Dịch theo cách có thể khiến người đọc hiểu kinh nguyệt là sự nhơ bẩn hoặc lỗi phạm về đạo đức
  rationale: Câu này quy định tình trạng thanh sạch nghi lễ trong cộng đồng Y-sơ-ra-ên; bản văn không nói rằng kinh nguyệt tự nó là một tội lỗi.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “nàng” để phù hợp mạch văn nói về người phụ nữ; lặp “bị ô uế” nhằm giữ cấu trúc song song và sự nhấn mạnh của nguyên văn.
