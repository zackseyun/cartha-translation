revisions:
- from: Mọi vật nàng nằm lên trong thời gian ô uế vì kinh nguyệt đều sẽ bị ô uế[a]; mọi vật nàng ngồi lên cũng sẽ bị ô uế.
  to: Mọi vật nàng nằm trên trong thời gian nàng ô uế vì kinh nguyệt sẽ trở nên ô uế[a]; mọi vật nàng ngồi trên cũng sẽ trở nên ô uế.
  rationale: Bản sửa thay các giới từ chưa tự nhiên bằng “trên”, làm rõ chủ thể của tình trạng ô uế kinh nguyệt, và tránh sắc thái bị động không được nêu trong nguyên ngữ. Cấu trúc, ý nghĩa nghi lễ, và tính song hành của câu được giữ nguyên.
  reviewer_model: gpt-5.6-terra
