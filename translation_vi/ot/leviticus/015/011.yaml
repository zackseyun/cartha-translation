source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: vi
  text: Bất cứ ai bị người đàn ông bị tiết dịch chạm vào, khi người này chưa rửa tay bằng nước[a], thì phải giặt quần áo, tắm bằng nước và sẽ ở tình trạng ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu: “nếu tay người ấy chưa được rửa bằng nước.” Cụm tiếng Hê-bơ-rơ có thể được phân tích khác nhau về quy chiếu của “người ấy”; cách hiểu thông thường là người đàn ông bị tiết dịch.'
    reason: Giữ lại sự không chắc chắn về cách nối và quy chiếu của mệnh đề tiếng Hê-bơ-rơ, đồng thời không trình bày phương án thay thế như một nghĩa đã được xác định.
lexical_decisions:
- source_word: הַזָּב
  choice: người đàn ông mắc chứng tiết dịch
  rationale: Danh từ phân từ giống đực chỉ một người nam đang bị tiết dịch trong bối cảnh luật thanh sạch; cách dịch này nêu rõ giới tính và tình trạng thân thể mà không hàm ý tội lỗi đạo đức.
- source_word: יִגַּע בּוֹ
  choice: chạm vào
  rationale: Động từ נגע đi với ב chỉ sự tiếp xúc thân thể; “chạm vào” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: khi người ấy chưa rửa tay bằng nước
  rationale: 'Mệnh đề được hiểu theo nghĩa hoàn cảnh: sự tiếp xúc truyền tình trạng ô uế khi người mắc chứng tiết dịch chưa rửa tay. “Người ấy” giữ tham chiếu của đại từ có phần mơ hồ, còn chú thích nêu cách phân tích cú pháp khác.'
- source_word: שָׁטַף
  choice: rửa
  rationale: שׁטף có nghĩa rửa, xối hoặc tráng. “Rửa tay bằng nước” tự nhiên trong tiếng Việt hiện đại; các động từ riêng cho giặt quần áo và tắm toàn thân vẫn được phân biệt trong phần sau.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: phải giặt quần áo
  rationale: כּבס thường chỉ việc giặt đồ; “giặt quần áo” diễn đạt đúng hành động cụ thể và tự nhiên.
- source_word: וְרָחַץ בַּמָּיִם
  choice: tắm bằng nước
  rationale: רחץ trong luật thanh sạch chỉ việc rửa thân thể; “tắm bằng nước” phân biệt với việc giặt quần áo.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: sẽ bị ô uế cho đến chiều tối
  rationale: טמא ở đây là tình trạng ô uế theo nghi lễ, không phải sự gian ác về đạo đức. “Cho đến chiều tối” diễn đạt rõ giới hạn thời gian.
- source_word: כֹל אֲשֶׁר
  choice: bất cứ ai
  rationale: Cụm từ có nghĩa phân phối và chỉ người trong ngữ cảnh; “bất cứ ai” tự nhiên, rõ phạm vi bao quát.
theological_decisions:
- issue: Bản chất của tình trạng טמא trong luật thanh sạch
  choice: ô uế theo nghi lễ
  alternative: bị làm nhơ bẩn về đạo đức
  rationale: Câu này nói về tình trạng thanh sạch do tiết dịch và tiếp xúc, có biện pháp giặt, tắm cùng thời hạn đến chiều tối; vì vậy không nên đưa hàm ý phạm tội đạo đức vào bản dịch.
- issue: Chủ thể của mệnh đề chưa rửa tay
  choice: người đàn ông mắc chứng tiết dịch chưa rửa tay
  alternative: người bị chạm chưa rửa tay
  rationale: Cách hiểu chủ đạo nối “tay người ấy” với chủ thể gần và có tác động là người mắc chứng tiết dịch; tuy nhiên cấu trúc Hê-bơ-rơ cho phép nhận thấy độ mơ hồ nhất định, nên phương án khác được ghi chú.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “mắc chứng tiết dịch” để mô tả tình trạng thân thể, “ô uế” cho phạm trù nghi lễ, và các động từ thông dụng “rửa”, “giặt”, “tắm” để phân biệt ba hành động.
