  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: vi
  text: Bất cứ ai ngồi trên vật mà người nam mắc chứng tiết dịch đã ngồi lên thì phải giặt quần áo, tắm trong nước và sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: Bất cứ ai ngồi
  rationale: Phân từ có mạo từ mang nghĩa khái quát; cách diễn đạt này tự nhiên trong điều luật tiếng Việt.
- source_word: הַכְּלִי
  choice: vật
  rationale: כְּלִי có nghĩa rộng, có thể chỉ đồ vật, vật dụng hoặc đồ chứa; trong ngữ cảnh này, “vật” không giới hạn loại đồ mà người ấy đã ngồi lên.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: mà ... đã ngồi lên
  rationale: Mệnh đề quan hệ xác định vật qua hành động đã xảy ra; “đã ngồi lên” tự nhiên và giữ rõ quan hệ tiếp xúc.
- source_word: הַזָּב
  choice: người mắc chứng tiết dịch
  rationale: Phân từ danh hóa chỉ người nam có chứng tiết dịch trong phần luật này; “người mắc chứng tiết dịch” diễn đạt rõ tình trạng mà không thêm phán đoán đạo đức.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: phải giặt quần áo
  rationale: כִּבֵּס thường chỉ việc giặt y phục; “phải” chuyển tải lực quy định pháp luật tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: וְרָחַץ בַּמַּיִם
  choice: tắm bằng nước
  rationale: Trong luật thanh sạch, רָחַץ nói đến việc rửa thân thể; “tắm bằng nước” rõ nghĩa và sát nguồn.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: và sẽ bị ô uế cho đến chiều tối
  rationale: Diễn tả tình trạng ô uế theo nghi lễ kéo dài đến thời điểm quy định, không hàm ý tự thân là tội lỗi đạo đức.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: ô uế
  alternative: ô uế về nghi lễ; bị nhơ uế
  rationale: Ngữ cảnh là luật thanh sạch Lê-vi. “Ô uế” giữ cách nói ngắn gọn của nguyên văn mà không đồng nhất tình trạng này với tội lỗi đạo đức; thêm “về nghi lễ” sẽ giải thích nhiều hơn nguyên văn.
- issue: Giới tính của הַזָּב và đại từ liên hệ
  choice: người mắc chứng tiết dịch
  alternative: người nam mắc chứng tiết dịch
  rationale: Phần văn cảnh nói về chứng tiết dịch của nam giới, nhưng tiếng Việt không buộc phải lặp đại từ mang giới tính ở câu này. Cách chọn giữ đúng đối tượng theo văn cảnh mà không thêm từ “nam” vốn không được viết riêng trong câu.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Dùng “phải” cho mệnh lệnh pháp lý và “chiều tối” cho הָעָרֶב. Không cần chú thích vì “vật” đã giữ được phạm vi nghĩa rộng của כְּלִי.
