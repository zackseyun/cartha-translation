  source_fidelity: Bản dịch giữ đúng cấu trúc pháp quy, nghĩa rộng của כְּלִי, yêu cầu giặt y phục, tắm/rửa thân thể trong nước, và thời hạn ô uế đến chiều tối. Tuy nhiên, הַזָּב là phân từ giống đực xác định trong ngữ cảnh quy định về chứng tiết dịch của nam giới; nên nêu rõ «người nam» để phản ánh đối tượng của câu.
