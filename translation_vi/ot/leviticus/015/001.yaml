base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng wayyiqtol đưa trình thuật tiến tới; “Rồi” diễn đạt tự nhiên quan hệ tiếp nối, còn “phán” phù hợp với lời Đức Chúa Trời và phân biệt với לֵאמֹר ở cuối câu.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: Diễn đạt tự nhiên trong tiếng Việt cả hai người nhận lời phán; không cần lặp lại giới từ dù tiếng Hê-bơ-rơ lặp אֶל.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức nguyên mẫu này giới thiệu lời trực tiếp ở câu kế tiếp; “rằng:” tự nhiên và rõ chức năng hơn lối dịch sát “nói rằng”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. Bản dịch giữ đây là danh riêng bằng hình thức phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, đồng thời chú thích dạng chữ Hê-bơ-rơ và cách dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán” giữ sắc thái lời nói thần linh; dấu hai chấm báo trước nội dung lời phán ở câu tiếp theo. Dấu chú thích [a] đặt sau cụm hai người nhận lời để tránh chen vào giữa chủ ngữ và động từ, theo vị trí tham chiếu của lớp tư vấn tiếng Anh.
