revisions:
- from: Khi một phụ nữ có huyết chảy ra, và dòng chảy từ thân thể nàng là máu, nàng sẽ ở trong tình trạng ô uế vì kinh nguyệt suốt bảy ngày[a]. Bất cứ ai chạm vào nàng sẽ bị ô uế cho đến chiều tối.
  to: Khi một phụ nữ ra huyết, tức là máu chảy trong thân thể người ấy[a], người ấy sẽ ở trong tình trạng ô uế kinh nguyệt bảy ngày[b]. Bất cứ ai chạm vào người ấy sẽ bị ô uế cho đến chiều tối.
  rationale: Bản sửa dùng “ra huyết” cho tự nhiên trong tiếng Việt, giữ cấu trúc giải thích rằng sự chảy ấy là máu, và đổi “từ thân thể” thành “trong thân thể” để phản ánh giới từ Hê-bơ-rơ. Chú thích mới bảo lưu cách hiểu “từ thân thể” mà không áp đặt nó vào bản văn chính. Thuật ngữ ô uế nghi lễ và chú thích văn hóa được giữ lại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng quy định cơ bản: người phụ nữ có sự ra huyết ở trong tình trạng ô uế nghi lễ bảy ngày, và người chạm vào bà sẽ ô uế đến chiều tối. Tuy nhiên, “dòng chảy từ thân thể nàng” chuyển giới từ בְּ (‘trong’) sang một cách hiểu nguồn phát (‘từ’) mà không đánh dấu lựa chọn diễn giải này. Cần giữ cách nói gần nguồn hơn, đồng thời có chú thích nêu phương án sát chữ.'
  naturalness: “Có huyết chảy ra” và “dòng chảy từ thân thể nàng là máu” hơi trùng lặp và gượng trong tiếng Việt hiện đại. “Ra huyết” là cách nói tự nhiên, rõ nghĩa trong ngữ cảnh này. “Nàng” có thể thay bằng “người ấy” để giữ văn phong pháp luật hiện đại, trung tính và nhất quán.
  terminology: “Ô uế” phù hợp với thuật ngữ thanh sạch nghi lễ, và chú thích hiện có hữu ích. “Tình trạng ô uế vì kinh nguyệt” có thể rút thành “tình trạng ô uế kinh nguyệt”, vừa giữ liên hệ với נִדָּה vừa không gợi một phán xét đạo đức.
  issues:
  - severity: medium
    issue: Giới từ trong בִּבְשָׂרָהּ bị diễn giải không được đánh dấu
    rationale: Bản nháp dịch “từ thân thể nàng”, trong khi tiếng Hê-bơ-rơ dùng בְּ, nghĩa cơ bản là “trong”. Trong ngữ cảnh này “từ” có thể là cách diễn đạt Việt ngữ hợp lý, nhưng nên giữ phương án gần chữ hơn ở bản văn và ghi chú phương án “từ thân thể”.
  - severity: low
    issue: Cụm diễn đạt về huyết ra bị lặp và chưa thật tự nhiên
    rationale: “Có huyết chảy ra, và dòng chảy ... là máu” nặng câu. “Ra huyết, tức là máu chảy...” diễn đạt mạch lạc hơn mà vẫn phản ánh việc mệnh đề thứ hai xác định bản chất của sự ra huyết.
