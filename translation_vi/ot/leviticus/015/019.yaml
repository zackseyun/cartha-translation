id: LEV.15.19
reference: Leviticus 15:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: vi
  text: Khi một phụ nữ ra huyết, tức là máu chảy trong thân thể người ấy[a], người ấy sẽ ở trong tình trạng ô uế kinh nguyệt bảy ngày[b]. Bất cứ ai chạm vào người ấy sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát chữ: “máu là sự chảy của người ấy trong xác thịt/thân thể người ấy.” Cũng có thể hiểu là “máu chảy từ thân thể người ấy.”'
    reason: lexical_alternative
  - marker: b
    text: “Ô uế” ở đây nói về tình trạng không thanh sạch theo nghi lễ trong luật Lê-vi, không nhất thiết hàm ý phạm tội hay sai trái về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: có huyết chảy ra / dòng chảy
  rationale: Động từ זוּב chỉ chất dịch từ cơ thể chảy ra; ngữ cảnh ngay sau đó xác định đó là máu. Cách diễn đạt này tự nhiên trong tiếng Việt và vẫn duy trì mối liên hệ từ vựng giữa hai dạng từ Hê-bơ-rơ.
- source_word: דָּם
  choice: máu
  rationale: Nghĩa trực tiếp của từ và là yếu tố xác định tính chất của dòng chảy.
- source_word: בִּבְשָׂרָהּ
  choice: từ thân thể nàng
  rationale: בשר theo nghĩa đen là “thịt” nhưng ở đây chỉ thân thể. Mặc dù giới từ ב thường là “trong”, trong cấu trúc mô tả dòng chảy, tiếng Việt tự nhiên cần diễn đạt nguồn phát ra là “từ thân thể”; cách hiểu sát chữ hơn được giữ trong ghi chú từ vựng nội bộ, không tạo một câu khó hiểu.
- source_word: שִׁבְעַת יָמִים
  choice: suốt bảy ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài bảy ngày.
- source_word: בְנִדָּתָהּ
  choice: ở trong tình trạng ô uế vì kinh nguyệt
  rationale: נִדָּה trong luật thanh sạch Lê-vi chỉ tình trạng ô uế nghi lễ gắn với kinh nguyệt, không đơn thuần chỉ hiện tượng sinh học.
- source_word: הַנֹּגֵעַ בָּהּ
  choice: bất cứ ai chạm vào nàng
  rationale: כל kết hợp với phân từ diễn tả một chủ thể khái quát; cách dịch này rõ ràng và tự nhiên.
- source_word: יִטְמָא
  choice: sẽ bị ô uế
  rationale: Thể hiện việc người chạm vào bước vào tình trạng ô uế theo nghi lễ, thay vì hàm ý phạm tội về đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Thành ngữ thời gian tự nhiên trong tiếng Việt, chỉ thời điểm kết thúc tình trạng ô uế trong ngày.
theological_decisions:
- issue: Thuật ngữ về ô uế do kinh nguyệt có thể bị hiểu thành sự ô nhục hay tội lỗi đạo đức
  choice: Dùng “tình trạng ô uế vì kinh nguyệt” và chú thích đây là tình trạng nghi lễ
  alternative: “không thanh sạch”; “ô uế trong kỳ kinh”
  rationale: Ngữ cảnh Lê-vi Ký 15 quy định địa vị thanh sạch theo nghi lễ, không tuyên bố bản thân hiện tượng kinh nguyệt là tội lỗi. Bản dịch giữ thuật ngữ pháp luật nhưng ghi rõ phạm vi ý nghĩa.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại và dễ hiểu. Dùng “phụ nữ” trong lời dẫn và đại từ “nàng” để tránh lặp nặng nề; “cho đến chiều tối” tự nhiên hơn lối nói cổ. Dấu chú thích [a] xuất hiện ngay sau mệnh đề cần giải thích.
