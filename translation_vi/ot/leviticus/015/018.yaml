revisions:
- from: Nếu một người đàn ông nằm với một người phụ nữ và xuất tinh, cả hai phải tắm rửa bằng nước và sẽ bị ô uế[a] cho đến chiều tối.
  to: Nếu một người đàn ông giao hợp với một người phụ nữ và xuất tinh, cả hai phải tắm rửa trong nước và sẽ bị ô uế[a] cho đến chiều tối.
  rationale: Sửa cách nói uyển ngữ có thể mơ hồ thành «giao hợp» để biểu đạt rõ thành ngữ tình dục của tiếng Hê-bơ-rơ trong ngữ cảnh luật thanh sạch. Đổi «bằng nước» thành «trong nước» để sát nguyên ngữ hơn. Các thành phần nghĩa, tình trạng ô uế tạm thời, và chú thích được giữ nguyên.
  reviewer_model: gpt-5.6-terra
