  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: vi
  text: Nếu một người đàn ông giao hợp với một người phụ nữ và xuất tinh, cả hai phải tắm rửa trong nước và sẽ bị ô uế[a] cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là bị ô uế về nghi lễ cho đến chiều tối.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר יִשְׁכַּב אִישׁ אֹתָהּ
  choice: Nếu một người đàn ông nằm với một người phụ nữ
  rationale: Trong ngữ cảnh luật lệ, cấu trúc mở đầu bằng “và một phụ nữ mà...” mang ý nghĩa nêu trường hợp. Cách dịch “Nếu...” tự nhiên trong tiếng Việt; “nằm với” giữ lối nói uyển chuyển, trang trọng về quan hệ tình dục.
- source_word: שִׁכְבַת זָרַע
  choice: và xuất tinh
  rationale: Cụm Hê-bơ-rơ chỉ sự phóng tinh trong lúc giao hợp. “Xuất tinh” rõ nghĩa, chính xác và tự nhiên hơn cách dịch sát chữ “sự nằm của hạt giống”.
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: cả hai phải tắm rửa bằng nước
  rationale: Động từ số nhiều quy về cả hai người. “Cả hai” làm rõ chủ thể; “phải” phù hợp văn phong luật lệ, còn “tắm rửa bằng nước” không quy định quá mức về phương thức.
- source_word: וְטָמְאוּ
  choice: sẽ bị ô uế
  rationale: Giữ thuật ngữ truyền thống và ngắn gọn cho tình trạng ô uế theo luật thanh sạch, không thêm ý phạm tội hay đáng trách về đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Diễn đạt tự nhiên ranh giới thời gian được nêu trong nguyên văn mà không diễn giải thành một thời điểm cụ thể hơn như lúc mặt trời lặn.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật thanh sạch Lê-vi
  choice: Dịch טמא là “bị ô uế” và chú thích đây là tình trạng theo nghi lễ.
  alternative: “bị ô uế về nghi lễ” ngay trong chính văn; hoặc diễn đạt theo hướng tội lỗi đạo đức.
  rationale: Nguyên văn nói về tình trạng ô uế tạm thời sau quan hệ tình dục, không tuyên bố hành vi ấy là một tội lỗi. Chính văn giữ cách nói ngắn gọn, còn chú thích ngăn người đọc hiểu nhầm theo nghĩa đạo đức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ hình thức điều luật nhưng tránh lối diễn đạt cổ hoặc quá kỹ thuật; không thêm phán đoán đạo đức mà nguyên văn không nêu.
