  source_fidelity: 'Bản dịch truyền đạt đúng quy định: quan hệ tình dục có xuất tinh, cả hai người phải rửa/tắm trong nước và ở tình trạng ô uế đến chiều tối. Tuy nhiên, «nằm với» trong tiếng Việt hiện đại có thể bị hiểu theo nghĩa không tình dục; động từ Hê-bơ-rơ ở đây là thành ngữ chỉ giao hợp.'
