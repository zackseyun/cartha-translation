  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: vi
  text: Vào ngày thứ tám, người ấy phải lấy cho mình hai con chim cu hoặc hai con bồ câu non, rồi đến trước mặt Yahweh tại lối vào Lều Hội Kiến và trao chúng cho thầy tế lễ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Đến ngày thứ tám
  rationale: Diễn đạt tự nhiên trình tự nghi lễ của liên từ, giới từ và cụm chỉ thời gian, đồng thời giữ rõ mốc ngày thứ tám.
- source_word: יִקַּח לוֹ
  choice: người ấy phải lấy cho mình
  rationale: “Phải” phù hợp với thể chỉ dẫn pháp luật; “cho mình” giữ đại từ lợi ích לוֹ.
- source_word: שְׁתֵּי תֹרִים
  choice: hai con chim cu gáy
  rationale: תֹרִים chỉ loài turtledove; “chim cu gáy” là cách gọi tiếng Việt hiện đại, dễ hiểu và phân biệt với bồ câu non trong vế kế tiếp.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: hoặc hai bồ câu non
  rationale: Thành ngữ Hê-bơ-rơ nghĩa đen là “hai con của bồ câu”, nhưng trong ngữ cảnh lễ vật chỉ hai con bồ câu còn non.
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: rồi đến trước mặt Yahweh
  rationale: Qatal nối tiếp mang ý nghĩa bước kế tiếp trong thủ tục; “trước mặt” giữ sát לִפְנֵי và không làm nhẹ ý niệm hiện diện trước Đức Chúa Trời.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: Trong tiếng Việt, “tại lối vào” diễn đạt tự nhiên địa điểm người ấy đến trình diện; “Lều Hội Kiến” là cách gọi trang trọng và minh bạch của אֹהֶל מוֹעֵד.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: và trao chúng cho thầy tế lễ
  rationale: “Trao” thể hiện hành động chuyển các con chim cho thầy tế lễ mà không thêm ý dâng tế vốn chưa được động từ này nói rõ.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Phiên âm “Yahweh” giữ danh riêng, thay vì thay bằng một tước hiệu hoặc dạng phiên âm truyền thống khác.
translation_notes:
  register: Văn phong pháp luật-nghi lễ trang trọng nhưng hiện đại. Dùng “người ấy” để nối tự nhiên với chủ thể nam trong ngữ cảnh trước; dùng “phải” nhất quán với mệnh lệnh luật định. Không thêm chú thích vì câu dịch không có điểm nào cần đánh dấu để bảo toàn dị bản hoặc sự mơ hồ đáng kể.
