source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: vi
  text: Nếu một phụ nữ ra huyết nhiều ngày, không vào thời kỳ ô uế do kinh nguyệt của mình[a], hoặc nếu bà ra huyết kéo dài quá thời kỳ ô uế do kinh nguyệt của mình[b], thì suốt những ngày ra huyết ô uế, bà sẽ bị ô uế, như trong những ngày ô uế do kinh nguyệt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngoài thời kỳ kinh nguyệt của mình.” Từ Hê-bơ-rơ ở đây không chỉ nói đến hiện tượng chảy máu mà còn bao gồm tình trạng ô uế theo nghi lễ gắn với kinh nguyệt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nếu bà ra huyết thêm vào thời kỳ ô uế do kinh nguyệt của mình,” tức là kéo dài quá thời kỳ kinh nguyệt thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: bị ra huyết / sự ra huyết kéo dài
  rationale: Tổ hợp động từ–danh từ từ זוּב chỉ một dòng dịch bất thường của cơ thể. “Ra huyết” là cách nói tự nhiên, trang trọng trong tiếng Việt và phù hợp với ngữ cảnh; ở vế sau, “kéo dài quá” thể hiện giá trị ngữ cảnh của עַל.
- source_word: דָּמָהּ
  choice: huyết
  rationale: Hậu tố chỉ “máu của người phụ nữ”; kết hợp với động từ זוּב, “ra huyết” diễn đạt tự nhiên trong tiếng Việt.
- source_word: יָמִים רַבִּים
  choice: nhiều ngày
  rationale: Giữ trực tiếp ý nghĩa thời lượng của cụm từ Hê-bơ-rơ.
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: không đúng kỳ ô uế do kinh nguyệt
  rationale: עֵת là “thời/kỳ”; נִדָּה trong luật Lê-vi bao gồm tình trạng ô uế theo nghi lễ liên quan đến kinh nguyệt, chứ không chỉ hiện tượng sinh lý.
- source_word: נִדָּה
  choice: sự/kỳ/những ngày ô uế do kinh nguyệt
  rationale: Cách dịch này giữ rõ bình diện nghi lễ của thuật ngữ, đồng thời vẫn dễ hiểu đối với độc giả hiện đại.
- source_word: עַל נִדָּתָהּ
  choice: kéo dài quá kỳ ô uế do kinh nguyệt
  rationale: עַל ở đây có thể biểu thị sự tiếp diễn thêm hoặc vượt quá kỳ thông thường; “kéo dài quá” phù hợp nhất với mạch luật về sự ra huyết kéo dài.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: suốt những ngày ra huyết gây ô uế ấy
  rationale: Diễn đạt tự nhiên chuỗi cấu trúc liên kết, giữ cả hiện tượng ra huyết lẫn tình trạng ô uế theo nghi lễ phát sinh từ đó.
- source_word: טְמֵאָה
  choice: bị ô uế
  rationale: “Ô uế” là thuật ngữ quen thuộc cho tình trạng nghi lễ trong Lê-vi; thêm “bị” giúp tránh hàm ý đây là lỗi đạo đức.
- source_word: כִּימֵי נִדָּתָהּ
  choice: giống như trong những ngày ô uế do kinh nguyệt
  rationale: Giữ phép so sánh và nhất quán với cách dịch נִדָּה trước đó.
theological_decisions:
- issue: Diễn đạt thuật ngữ thanh sạch nghi lễ mà không hàm ý tội lỗi đạo đức
  choice: Dùng “ô uế do kinh nguyệt” và “bị ô uế” như các thuật ngữ chỉ tình trạng nghi lễ
  alternative: Chỉ dùng “kinh nguyệt” hoặc dùng “không thanh sạch” xuyên suốt
  rationale: Câu này quy định tình trạng ô uế theo nghi lễ trong luật Lê-vi, không khẳng định người phụ nữ phạm tội. Cách dịch được chọn giữ rõ phạm trù nghi lễ mà vẫn tự nhiên trong tiếng Việt.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Ra huyết” được chọn thay cho cách nói quá kỹ thuật hoặc quá khẩu ngữ; “ô uế” được dùng nhất quán như một phạm trù nghi lễ, không phải phán xét đạo đức.
