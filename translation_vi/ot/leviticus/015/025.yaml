  source_fidelity: 'Bản nháp nhìn chung truyền đạt đúng cấu trúc điều kiện kép, thời lượng “nhiều ngày,” sự đối chiếu với thời kỳ niddah, và tình trạng ô uế. Tuy nhiên, các ký hiệu chú thích hiện đặt sai chỗ: [a] giải thích cụm “không vào/ngoài thời kỳ ô uế do kinh nguyệt,” không phải “nhiều ngày”; [b] giải thích mệnh đề thứ hai với עַל (“thêm vào/vượt quá”), không phải mệnh đề kết luận “sẽ bị ô uế.” Bản sửa giữ nghĩa nghi lễ của נִדָּה và טָמֵא mà không hàm ý lỗi đạo đức.'
