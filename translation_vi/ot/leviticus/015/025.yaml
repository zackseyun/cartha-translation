revisions:
- from: 'Nếu một phụ nữ bị ra huyết nhiều ngày[a], không đúng kỳ ô uế do kinh nguyệt, hoặc nếu sự ra huyết kéo dài quá kỳ ô uế do kinh nguyệt, thì suốt những ngày ra huyết gây ô uế ấy, người phụ nữ đó sẽ bị ô uế[b], giống như trong những ngày ô uế do kinh nguyệt.


    [a] Cũng có thể dịch: “bị ra huyết nhiều ngày ngoài kỳ kinh nguyệt”. Từ Hê-bơ-rơ ở đây không chỉ nói đến hiện tượng chảy máu mà còn bao gồm tình trạng ô uế theo nghi lễ gắn với kinh nguyệt.


    [b] Cũng có thể dịch: “nếu sự ra huyết xảy ra thêm vào kỳ ô uế do kinh nguyệt”, nghĩa là kéo dài quá kỳ kinh nguyệt thông thường.'
  to: Nếu một phụ nữ ra huyết nhiều ngày, không vào thời kỳ ô uế do kinh nguyệt của mình[a], hoặc nếu bà ra huyết kéo dài quá thời kỳ ô uế do kinh nguyệt của mình[b], thì suốt những ngày ra huyết ô uế, bà sẽ bị ô uế, như trong những ngày ô uế do kinh nguyệt.
  rationale: Sửa vị trí hai ký hiệu chú thích để chúng neo đúng vào các cụm từ mà chúng giải thích. Đồng thời, điều chỉnh một vài cụm từ cho tự nhiên hơn trong tiếng Việt hiện đại, giữ nguyên nghĩa của văn bản Hê-bơ-rơ, tính chất nghi lễ của thuật ngữ, và sắc thái “vượt quá/kéo dài thêm” của עַל trong mệnh đề thứ hai.
  reviewer_model: gpt-5.6-terra
