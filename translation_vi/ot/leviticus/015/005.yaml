  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: vi
  text: Người đàn ông nào chạm vào chỗ nằm của người ấy[a] thì phải giặt quần áo, tắm bằng nước và sẽ bị ô uế[b] cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giường của người ấy.” Từ Hê-bơ-rơ có thể chỉ giường hoặc, theo nghĩa rộng hơn, nơi người ấy đã nằm.
    reason: lexical_alternative
  - marker: b
    text: Tức là ở trong tình trạng ô uế về nghi lễ theo các quy định thanh sạch, không nhất thiết hàm ý có lỗi về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: Người nào
  rationale: Trong quy định pháp lý này, אִישׁ ở số ít chỉ một cá nhân thuộc trường hợp được nêu. “Người nào” tự nhiên trong tiếng Việt và không thêm ý ngoài phạm vi câu.
- source_word: יִגַּע
  choice: chạm vào
  rationale: נגע diễn tả sự tiếp xúc; “chạm vào” là cách nói trực tiếp, tự nhiên và phù hợp bối cảnh thanh sạch nghi lễ.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: chỗ nằm của người ấy
  rationale: מִשְׁכָּב có thể là giường, chỗ nằm hoặc vật dùng để nằm. “Chỗ nằm” giữ được phạm vi nghĩa rộng hơn “giường”; hậu tố sở hữu được diễn đạt là “của người ấy,” quy chiếu về người mắc chứng tiết dịch trong văn cảnh.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: phải giặt quần áo
  rationale: כִּבֵּס chỉ việc giặt đồ, còn בֶּגֶד là quần áo. “Phải” thể hiện lực quy định của dạng động từ trong văn bản luật pháp.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: tắm bằng nước
  rationale: רחץ ở đây nói đến việc rửa thân thể. Giới từ ב có thể được hiểu là “bằng” hoặc “trong”; “tắm bằng nước” tự nhiên trong tiếng Việt và không hàm ý bắt buộc phải ngâm mình.
- source_word: וְ/טָמֵא
  choice: và sẽ bị ô uế
  rationale: טָמֵא chỉ tình trạng ô uế theo quy định thanh sạch, không tự thân nói đến tội lỗi luân lý. “Sẽ bị ô uế” giữ nguyên phạm trù của nguyên văn.
- source_word: עַד הָ/עָרֶב
  choice: cho đến chiều tối
  rationale: Cụm từ xác định thời hạn của tình trạng ô uế; “cho đến chiều tối” là cách diễn đạt rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất của tình trạng טָמֵא trong luật thanh sạch Lê-vi
  choice: Giữ từ “ô uế” trong chính văn và giải thích bằng chú thích rằng đây là tình trạng nghi lễ.
  alternative: Diễn giải ngay trong chính văn là “bị ô uế về nghi lễ.”
  rationale: Nguyên văn dùng phạm trù ô uế của luật thanh sạch chứ không khẳng định người ấy phạm tội luân lý. Giữ cách gọi ngắn gọn trong chính văn tránh diễn giải quá mức, còn chú thích ngăn cách hiểu sai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc luật pháp “thì phải” cho nghĩa vụ, đồng thời tránh lối diễn đạt cổ. Hai dấu chú thích [a], [b] đều được đặt ngay sau từ ngữ cần làm rõ.
