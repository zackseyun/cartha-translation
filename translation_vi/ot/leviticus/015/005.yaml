  source_fidelity: 'Bản dịch chuyển đạt đúng các hành động và hệ quả của tiếng Hê-bơ-rơ: chạm vào chỗ nằm, giặt quần áo, tắm/rửa bằng nước, và ở trong tình trạng ô uế đến chiều tối. Tuy nhiên, אִישׁ là danh từ số ít giống đực; “Người nào” trung hòa giới tính hơn nguyên văn. Bản sửa giữ rõ “người đàn ông nào.”'
