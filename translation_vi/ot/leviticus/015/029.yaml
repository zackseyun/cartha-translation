  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: vi
  text: Vào ngày thứ tám, người nữ phải lấy cho mình hai con chim cu hoặc hai con bồ câu non, rồi đem chúng đến với thầy tế lễ tại cửa Lều Hội Kiến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Vào ngày thứ tám
  rationale: Cụm thời gian được chuyển sang tiếng Việt tự nhiên; liên từ ו mang tính nối tiếp không nhất thiết phải biểu đạt bằng “và” trong câu luật lệ độc lập.
- source_word: תִּקַּח לָהּ
  choice: người nữ phải lấy cho mình
  rationale: Động từ ngôi 3 giống cái chỉ người nữ trong ngữ cảnh; “phải” diễn đạt lực chỉ thị pháp lý, còn “cho mình” giữ sắc thái thụ hưởng/phản thân của לָהּ.
- source_word: שְׁתֵּי תֹרִים
  choice: hai con chim gáy
  rationale: תֹרִים chỉ loài chim gáy/cu; “chim gáy” là cách gọi hiện đại, dễ hiểu và phù hợp ngữ cảnh lễ vật.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: hai con bồ câu non
  rationale: Thành ngữ theo cấu trúc “con của bồ câu” có nghĩa là bồ câu non; cách dịch này tự nhiên và chính xác.
- source_word: וְהֵבִיאָה אֹתָם
  choice: rồi đem chúng
  rationale: Dạng động từ nối tiếp mang lực chỉ thị tiếp theo; “rồi” thể hiện trình tự, còn chủ ngữ được lược bỏ tự nhiên trong tiếng Việt.
- source_word: אֶל הַכֹּהֵן
  choice: đến cho thầy tế lễ
  rationale: Giữ hướng chuyển giao đến vị tư tế đảm trách nghi lễ; “thầy tế lễ” là cách gọi rõ nghĩa, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: 'אֶל theo sau một đích đến đã nêu có thể được hiểu theo vị trí: vị tư tế ở lối vào. “Lều Hội Kiến” diễn đạt danh xưng אֹהֶל מוֹעֵד một cách trang trọng và quen thuộc.'
