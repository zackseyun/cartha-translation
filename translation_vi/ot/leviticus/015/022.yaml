base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: vi
  text: Bất cứ ai chạm vào bất cứ đồ vật nào mà người phụ nữ ấy ngồi trên thì phải giặt quần áo mình, tắm bằng nước và sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Bất cứ ai chạm vào
  rationale: Cụm כָל kết hợp với phân từ dùng như danh từ chỉ một lớp người nói chung; “bất cứ ai” tự nhiên trong tiếng Việt và giữ trọn phạm vi phổ quát.
- source_word: בְּכָל כְּלִי
  choice: vật nào
  rationale: כְּלִי có nghĩa rộng, có thể chỉ đồ vật, vật dụng hoặc dụng cụ. “Vật nào” phù hợp với ngữ cảnh là thứ có thể ngồi lên mà không thu hẹp thành bình hay đồ chứa.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: mà người phụ nữ ấy đã ngồi lên
  rationale: Động từ giống cái số ít quy chiếu về người phụ nữ trong ngữ cảnh trước. Dạng hoàn thành tự nhiên trong tiếng Việt diễn tả việc tiếp xúc với vật đã được bà ngồi lên.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: phải giặt quần áo mình
  rationale: כִּבֵּס với בְּגָדִים nói đến việc giặt y phục; “phải” truyền đạt lực quy định của văn luật, còn “mình” quy chiếu tự nhiên về người chạm.
- source_word: וְרָחַץ בַּמַּיִם
  choice: tắm bằng nước
  rationale: Trong luật thanh sạch, רָחַץ thường chỉ việc rửa thân thể. “Tắm bằng nước” rõ nghĩa và phân biệt với việc giặt quần áo.
- source_word: וְטָמֵא
  choice: và sẽ bị ô uế
  rationale: טָמֵא ở đây chỉ tình trạng ô uế theo nghi lễ, không hàm ý phạm tội về đạo đức. Cách diễn đạt này tự nhiên và phù hợp với thuật ngữ nhất quán trong Lê-vi Ký.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Cụm từ xác định thời hạn của tình trạng ô uế; “chiều tối” diễn đạt tự nhiên mốc thời gian הָעָרֶב trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của tình trạng טָמֵא trong luật thanh sạch
  choice: Dịch là “bị ô uế” theo nghĩa nghi lễ, không thêm ngôn ngữ về tội lỗi đạo đức.
  alternative: “bị nhơ bẩn” hoặc “không thanh sạch”
  rationale: Câu này quy định tình trạng nghi lễ phát sinh do tiếp xúc, chứ không tuyên bố người ấy có lỗi về đạo đức. “Ô uế” giữ được phạm trù tế tự quen thuộc của Lê-vi Ký.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “phải” để giữ sắc thái quy định pháp luật; tránh cách nói cổ như “áo xống” và tránh thu hẹp כְּלִי thành một loại vật dụng cụ thể.
