  to: Bất cứ ai chạm vào bất cứ đồ vật nào mà người phụ nữ ấy ngồi trên thì phải giặt quần áo mình, tắm bằng nước và sẽ bị ô uế cho đến chiều tối.
  rationale: Sửa “đã ngồi lên” thành “ngồi trên” để không thêm sắc thái quá khứ vào hình thức Hê-bơ-rơ và đổi “vật nào” thành “đồ vật nào” cho tự nhiên hơn. Các thành phần còn lại được giữ vì phản ánh đúng nội dung quy định và thuật ngữ thanh sạch nghi lễ.
