base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: vi
  text: Ai chạm vào thân thể[a] của người bị tiết dịch thì phải giặt quần áo, tắm bằng nước và sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thịt của người bị tiết dịch.” Tiếng Hê-bơ-rơ viết sát chữ là “thịt của người bị tiết dịch.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: Ai chạm vào
  rationale: Phân từ có mạo từ được dùng như danh từ chỉ một đối tượng bất kỳ; “Ai chạm vào” diễn đạt tự nhiên và giữ nguyên hiệu lực khái quát của điều luật.
- source_word: בִּבְשַׂר
  choice: thân thể của
  rationale: בָּשָׂר có nghĩa đen là “thịt” nhưng trong ngữ cảnh này chỉ thân thể vật lý. “Thân thể” rõ nghĩa và tự nhiên hơn trong tiếng Việt; chú thích bảo lưu cách nói sát chữ.
- source_word: הַזָּב
  choice: người bị tiết dịch
  rationale: Phân từ từ זוּב chỉ người đang có hiện tượng tiết dịch bất thường. “Người bị tiết dịch” rõ ràng, trang trọng và không thêm phán đoán đạo đức.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: thì phải giặt quần áo
  rationale: Động từ כִּבֵּס thường chỉ việc giặt đồ; “phải” thể hiện đúng tính bắt buộc của quy định pháp luật trong tiếng Việt hiện đại.
- source_word: וְרָחַץ בַּמַּיִם
  choice: tắm bằng nước
  rationale: רָחַץ trong ngữ cảnh này nói đến việc rửa thân thể. “Tắm bằng nước” giữ được yếu tố בַּמַּיִם mà vẫn tự nhiên.
- source_word: וְטָמֵא
  choice: và sẽ bị ô uế
  rationale: טָמֵא chỉ tình trạng ô uế theo nghi lễ, không nhất thiết là tội lỗi đạo đức. Cách dịch này phù hợp thuật ngữ luật thanh sạch trong sách Lê-vi.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Cụm từ xác định thời hạn của tình trạng ô uế. “Cho đến chiều tối” tự nhiên và diễn đạt rõ thời điểm.
theological_decisions:
- issue: Bản chất của tình trạng טָמֵא
  choice: Dịch là “bị ô uế” theo nghĩa nghi lễ
  alternative: “không thanh sạch” hoặc “bị nhơ uế”
  rationale: Trong Lê-vi 15, từ này chỉ địa vị nghi lễ trong hệ thống thanh sạch của Israel. Bản dịch tránh hàm ý rằng việc tiếp xúc tự nó cấu thành tội lỗi đạo đức.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Dùng “phải” để thể hiện quy định bắt buộc; “ô uế” là thuật ngữ nhất quán cho tình trạng nghi lễ, không mang nghĩa kết án đạo đức.
