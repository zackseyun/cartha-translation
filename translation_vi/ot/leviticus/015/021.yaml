base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: vi
  text: Bất cứ ai chạm vào giường của người phụ nữ ấy[a] phải giặt áo quần, tắm rửa bằng nước, và sẽ không thanh sạch cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nơi người phụ nữ ấy nằm” hoặc “chỗ nằm của người phụ nữ ấy.” Từ Hê-bơ-rơ chỉ nơi bà ấy nằm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Bất cứ ai chạm
  rationale: Cụm từ chỉ mọi người thuộc trường hợp này; cách diễn đạt tự nhiên trong tiếng Việt vẫn giữ phạm vi phổ quát và lực khái quát của phân từ.
- source_word: בְּמִשְׁכָּבָהּ
  choice: vào giường của bà
  rationale: מִשְׁכָּב chỉ nơi nằm hoặc giường. “Giường” là cách dịch trực tiếp, rõ ràng; “của bà” duy trì đại từ sở hữu giống cái và phù hợp văn cảnh nói về một phụ nữ.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: đều phải giặt quần áo
  rationale: כבס nói riêng về việc giặt đồ; “phải” truyền đạt lực quy định của điều luật, còn tiếng Việt tự nhiên không cần diễn đạt đại từ sở hữu “của mình” tại đây.
- source_word: וְרָחַץ בַּמַּיִם
  choice: tắm bằng nước
  rationale: Trong văn cảnh này, רחץ nói đến việc rửa thân thể. “Tắm bằng nước” phân biệt rõ với hành động giặt quần áo vừa nêu.
- source_word: וְטָמֵא
  choice: và sẽ bị ô uế
  rationale: טמא biểu thị tình trạng ô uế theo nghi lễ. “Bị ô uế” là thuật ngữ trang trọng, quen thuộc trong văn cảnh luật thanh sạch, không tự nó quy kết tội lỗi đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Cụm từ xác định thời hạn của tình trạng ô uế; “chiều tối” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của tình trạng טמא
  choice: Dịch là “bị ô uế” theo phạm trù thanh sạch nghi lễ.
  alternative: “không thanh sạch” hoặc “bị nhiễm uế”
  rationale: Lê-vi Ký 15 nói về tình trạng nghi lễ chứ không khẳng định người ấy phạm tội về đạo đức. Bản dịch giữ phạm trù của văn bản mà không thêm phán đoán thần học.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại và dễ hiểu. Dùng “bất cứ ai… đều phải” để thể hiện quy định phổ quát; duy trì sự phân biệt giữa giặt quần áo và tắm thân thể.
