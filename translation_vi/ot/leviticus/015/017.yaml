base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: vi
  text: Mọi áo quần và mọi vật bằng da có tinh dịch trên đó đều phải được giặt bằng nước và sẽ ô uế cho đến chiều tối.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm «sẽ ô uế» nói về tình trạng ô uế theo nghi lễ, không nhất thiết hàm ý tội lỗi về đạo đức.
    reason: theological_clarification
lexical_decisions:
- source_word: בֶּגֶד
  choice: áo quần
  rationale: Từ này chỉ áo hoặc vật dùng để mặc; “áo quần” tự nhiên trong tiếng Việt hiện đại và phù hợp với ngữ cảnh.
- source_word: עוֹר
  choice: đồ bằng da
  rationale: Nghĩa gốc là da thú; trong ngữ cảnh một vật có thể giặt, cụm “đồ bằng da” diễn đạt tự nhiên hơn “da” đơn thuần mà không giới hạn vào một loại vật cụ thể.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: có ... dính trên đó
  rationale: Giữ ý định vị “ở trên nó” và diễn đạt tự nhiên việc chất dịch hiện diện trên bề mặt.
- source_word: שִׁכְבַת זָרַע
  choice: tinh dịch
  rationale: Thành ngữ Hê-bơ-rơ chỉ tinh dịch đã xuất ra; trong câu này “tinh dịch” rõ nghĩa, chính xác và tránh lối diễn đạt quá kỹ thuật.
- source_word: וְכֻבַּס בַּמַּיִם
  choice: đều phải được giặt bằng nước
  rationale: Dạng bị động trong quy định pháp luật được chuyển thành “phải được”; “giặt” thích hợp cho cả áo quần lẫn đồ bằng da trong ngữ cảnh.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: và sẽ bị ô uế cho đến chiều tối
  rationale: Giữ phạm trù ô uế theo nghi lễ và mốc thời gian của nguyên văn; “sẽ bị” phản ánh trạng thái tiếp diễn sau khi giặt.
theological_decisions:
- issue: Bản chất của tình trạng טָמֵא trong luật thanh sạch Lê-vi
  choice: ô uế
  alternative: không thanh sạch
  rationale: “Ô uế” là thuật ngữ quen thuộc cho tình trạng nghi lễ trong ngữ cảnh này, không tự nó khẳng định người hay vật mắc tội về đạo đức.
- issue: Chủ thể mang tình trạng ô uế
  choice: Để áo quần hoặc đồ bằng da là chủ thể của “sẽ bị ô uế”
  alternative: Hiểu ngầm người sở hữu hoặc người tiếp xúc là chủ thể
  rationale: Cấu trúc câu tiếp nối trực tiếp các vật vừa nêu; không nên đưa thêm một chủ thể mà nguyên văn không nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đồ bằng da” để thể hiện עוֹר theo ngữ cảnh vật dụng, đồng thời tránh cách nói thiếu tự nhiên “mọi da”. Dấu chú thích [a] được đặt ngay sau câu.
