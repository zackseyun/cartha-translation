review_pass:
  verdict: revise
  source_fidelity: Bản dịch xác định đúng các vật là chủ thể của tình trạng טָמֵא, giữ được yêu cầu giặt bằng nước và thời hạn «cho đến chiều tối». «Đồ bằng da»/«vật bằng da» là cách chuyển ngữ theo ngữ cảnh hợp lý cho עוֹר, vốn nghĩa đen là da/da thú. Tuy nhiên, «sẽ bị ô uế» dùng bị động không tự nhiên và có thể gợi ý một tác nhân gây ô uế; tiếng Hê-bơ-rơ chỉ nêu tình trạng nghi lễ của vật.
  naturalness: Câu nhìn chung rõ ràng, đúng văn phong hiện đại. «Vật bằng da» tự nhiên và bao quát hơn «đồ bằng da» trong mệnh đề song hành với «áo quần». Bỏ «dính» tránh thêm sắc thái bám dính không được nêu rõ trong nguyên văn. «Sẽ ô uế» diễn tả trực tiếp trạng thái pháp định và tự nhiên hơn.
  terminology: «Tinh dịch» truyền đạt chính xác שִׁכְבַת זָרַע trong ngữ cảnh này. «Ô uế» là thuật ngữ chuẩn cho tình trạng nghi lễ; chú thích hiện có làm rõ đúng rằng đây không mặc nhiên là lỗi đạo đức. Cách dùng «vật bằng da» phản ánh quyết định trong vết kiểm tra tiếng Anh rằng עוֹר có lẽ là vật dụng bằng da, thay vì khẳng định đó là da người.
  issues:
  - severity: low
    issue: Cụm «sẽ bị ô uế» không tự nhiên về ngữ pháp-ngữ nghĩa.
    rationale: טָמֵא là tính từ chỉ tình trạng, không phải bị động hàm ý vật bị một tác nhân làm ô uế. «Sẽ ô uế» giữ sát nghĩa hơn.
  - severity: low
    issue: «Dính trên đó» thêm sắc thái bám dính.
    rationale: אֲשֶׁר יִהְיֶה עָלָיו chỉ nói chất ấy ở/trên vật. «Có tinh dịch trên đó» đủ chính xác và không thêm chi tiết.
  revised_text: Mọi áo quần và mọi vật bằng da có tinh dịch trên đó đều phải được giặt bằng nước và sẽ ô uế cho đến chiều tối.[a]
