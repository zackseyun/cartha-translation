revisions:
- from: Mọi áo quần và mọi đồ bằng da có tinh dịch dính trên đó đều phải được giặt bằng nước và sẽ bị ô uế cho đến chiều tối.[a]
  to: Mọi áo quần và mọi vật bằng da có tinh dịch trên đó đều phải được giặt bằng nước và sẽ ô uế cho đến chiều tối.[a]
  rationale: Sửa tối thiểu để diễn đạt trực tiếp tình trạng nghi lễ mà nguyên văn quy cho các vật, đồng thời dùng cách nói tự nhiên hơn cho עוֹר và không thêm sắc thái «dính». Ý nghĩa, chủ thể, yêu cầu giặt, và mốc thời gian đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
