  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה אֹתָ/ם֙ הַ/כֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה מִ/זּוֹבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: vi
  text: Thầy tế lễ sẽ dâng hai con chim ấy, một con làm lễ vật thanh tẩy[a], còn con kia làm lễ toàn thiêu. Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy trước mặt Đức Giê-hô-va vì chứng tiết dịch của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật chuộc tội”. Từ Hê-bơ-rơ חַטָּאת ở đây có thể chỉ lễ vật dùng để loại bỏ tình trạng ô uế nghi lễ, chứ không chỉ liên quan đến tội lỗi luân lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: sẽ dâng hai con chim ấy
  rationale: Trong ngữ cảnh tế lễ, עשה mang nghĩa thực hiện nghi thức dâng lễ. Đại từ số nhiều אֹתָם chỉ hai con chim ở câu trước; nêu rõ đối tượng giúp tiếng Việt tự nhiên mà không thêm ý mới.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi hiện đại, rõ nghĩa đối với chức vụ tư tế trong luật tế tự.
- source_word: אֶחָד חַטָּאת
  choice: một con làm lễ vật thanh tẩy
  rationale: Trong luật thanh sạch của Lê-vi Ký, חַטָּאת chỉ lễ vật xử lý tình trạng ô uế nghi lễ; 'lễ vật thanh tẩy' tránh khiến độc giả hiểu rằng chứng tiết dịch tự nó nhất thiết là tội luân lý, đồng thời chú thích bảo lưu cách dịch truyền thống.
- source_word: וְהָאֶחָד עֹלָה
  choice: còn con kia làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; 'lễ thiêu' là cách diễn đạt ngắn gọn, quen thuộc.
- source_word: וְכִפֶּר עָלָיו
  choice: sẽ làm lễ chuộc tội cho người ấy
  rationale: Giữ sắc thái tế tự và thần học của כפר mà không quy định cụ thể cơ chế; 'cho người ấy' phản ánh עַל kèm đại từ trong ngữ cảnh này.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: Diễn đạt tự nhiên sự hiện diện trước YHWH trong nghi lễ; dùng danh xưng Việt hóa phổ biến cho danh riêng của Đức Chúa Trời.
- source_word: מִזּוֹבוֹ
  choice: vì chứng tiết dịch của người
  rationale: מִן ở đây biểu thị nguyên nhân hoặc tình trạng liên quan đến việc chuộc tội/thanh tẩy; 'chứng tiết dịch' phù hợp văn mạch bệnh lý-nghi lễ hơn cách nói chung chung 'sự chảy'.
theological_decisions:
- issue: Cách dịch חַטָּאת trong bối cảnh ô uế nghi lễ
  choice: lễ vật thanh tẩy
  alternative: lễ vật chuộc tội
  rationale: Văn mạch nói về tình trạng tiết dịch và sự thanh sạch nghi lễ, không khẳng định một hành vi phạm tội luân lý. Bản chính dùng thuật ngữ nêu rõ chức năng thanh tẩy, còn chú thích giữ cách dịch truyền thống và sự đa nghĩa của từ Hê-bơ-rơ.
- issue: Cách dịch כפר
  choice: làm lễ chuộc tội
  alternative: thực hiện nghi thức đền chuộc; thanh tẩy
  rationale: Cách dịch này giữ nội hàm tế tự và độ căng thần học của động từ, không thu hẹp nó vào một học thuyết riêng về cơ chế chuộc tội.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng 'thầy tế lễ', 'lễ vật thanh tẩy', 'lễ thiêu' và 'chứng tiết dịch' để vừa tự nhiên trong tiếng Việt hiện đại vừa giữ tính chính xác của ngữ cảnh tế tự-y khoa.
