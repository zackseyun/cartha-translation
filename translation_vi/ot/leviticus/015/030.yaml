  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: vi
  text: Rồi thầy tế lễ sẽ dâng một con làm lễ vật chuộc tội[a], còn con kia làm lễ thiêu; thầy tế lễ sẽ làm lễ chuộc tội cho người phụ nữ ấy trước mặt Yahweh vì sự tiết dịch ô uế của nàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”; từ Hê-bơ-rơ חַטָּאת ở đây nhấn mạnh chức năng thanh tẩy trong nghi lễ Lê-vi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: sẽ dâng
  rationale: Động từ có nghĩa rộng là “làm”, nhưng trong ngữ cảnh tế lễ, “dâng” diễn đạt tự nhiên và chính xác hành động tiến dâng lễ vật.
- source_word: הָאֶחָד חַטָּאת
  choice: một con làm lễ vật chuộc tội
  rationale: חַטָּאת ở đây chỉ một loại lễ vật. “Lễ vật chuộc tội” là cách gọi quen thuộc, trong khi chức năng thanh tẩy được ghi nhận ở chú thích.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: còn con kia làm lễ thiêu
  rationale: Cách dịch này giữ thế đối ứng giữa hai con vật; עֹלָה là lễ vật được thiêu trọn.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: sẽ làm lễ chuộc tội cho người phụ nữ ấy
  rationale: Giữ ý nghĩa nghi lễ-thần học của כפר và diễn đạt đại từ giống cái rõ ràng, tự nhiên trong tiếng Việt.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ chỉ sự hiện diện trong khung cảnh nghi lễ và phiên chuyển trực tiếp danh giao ước יהוה.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: vì sự tiết dịch ô uế của nàng
  rationale: זוֹב chỉ sự chảy hoặc tiết dịch của cơ thể, còn טֻמְאָה xác định tình trạng ô uế theo nghi lễ. “Vì” truyền đạt quan hệ nguyên nhân của מִן sau כפר mà không đồng nhất sự ô uế nghi lễ với lỗi đạo đức.
theological_decisions:
- issue: Cách chuyển dịch יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה; “Yahweh” bảo tồn danh giao ước thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Thuật ngữ chỉ loại lễ vật theo quy định; cách dịch truyền thống, dễ nhận biết được dùng trong chính văn, còn sắc thái thanh tẩy quan trọng trong sách Lê-vi được giữ ở chú thích.
- issue: Tính chất của sự ô uế
  choice: diễn đạt là sự tiết dịch ô uế, không quy thành tội lỗi cá nhân
  alternative: diễn giải sự tiết dịch là tội
  rationale: Ngữ cảnh nói về tình trạng ô uế nghi lễ do tiết dịch; bản dịch tránh áp đặt phán đoán đạo đức không có trong câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “thầy tế lễ” và thuật ngữ nghi lễ dễ nhận biết. “Người phụ nữ ấy” làm rõ đại từ giống cái, còn “nàng” ở cuối câu tránh lặp nặng nề. Dấu chấm phẩy giữ hai hành động chính của câu Hê-bơ-rơ.
