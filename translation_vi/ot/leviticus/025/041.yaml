id: LEV.25.41
reference: Leviticus 25:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/יָצָא֙ מֵֽ/עִמָּ֔/ךְ ה֖וּא וּ/בָנָ֣י/ו עִמּ֑/וֹ וְ/שָׁב֙ אֶל מִשְׁפַּחְתּ֔/וֹ וְ/אֶל אֲחֻזַּ֥ת אֲבֹתָ֖י/ו יָשֽׁוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: vi
  text: Bấy giờ, người ấy cùng các con trai mình sẽ rời khỏi anh, trở về thị tộc[a] của mình, và trở về sản nghiệp của tổ phụ mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gia tộc”; từ Hê-bơ-rơ có thể chỉ một nhóm thân tộc rộng hơn gia đình trực hệ.
    reason: lexical_alternative
  - marker: b
    text: Hay “phần đất tổ tiên để lại” hoặc “cơ nghiệp của cha ông mình”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵעִמָּךְ
  choice: sẽ rời khỏi anh
  rationale: Diễn đạt tự nhiên ý ra khỏi nơi người chủ và chấm dứt việc phục dịch, nhưng không chuyển thành thuật ngữ diễn giải như “được phóng thích”.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: người ấy cùng các con trai mình
  rationale: Giữ ngôn ngữ thân tộc giống đực rõ ràng của בָּנִים, đồng thời diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: וְשָׁב ... יָשׁוּב
  choice: trở về ... và trở về
  rationale: Giữ nguyên sự lặp lại có chủ ý của động từ שׁוב, nhấn mạnh việc phục hồi cả quan hệ thân tộc lẫn sản nghiệp.
- source_word: מִשְׁפַּחְתּוֹ
  choice: thị tộc của mình
  rationale: Trong bối cảnh xã hội và đất đai, מִשְׁפָּחָה thường chỉ nhóm thân tộc rộng hơn gia đình hạt nhân; “thị tộc” phản ánh đúng phạm vi ấy.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: sản nghiệp của tổ phụ mình
  rationale: אֲחֻזָּה chỉ phần đất hoặc tài sản được nắm giữ theo quyền thừa kế; “sản nghiệp” vừa trang trọng vừa thích hợp với bối cảnh luật lệ về đất tổ tiên.
theological_decisions:
- issue: Ngôn ngữ thân tộc giống đực
  choice: các con trai ... tổ phụ
  alternative: các con ... tổ tiên
  rationale: Bản Hê-bơ-rơ dùng các hình thức giống đực cụ thể, phù hợp với bối cảnh dòng dõi phụ hệ và quyền thừa kế; bản dịch không trung tính hóa chúng.
- issue: Sắc thái pháp lý của việc ra đi
  choice: rời khỏi anh
  alternative: được giải phóng khỏi việc phục dịch anh
  rationale: Bối cảnh nói đến sự phục hồi trong Năm Hân Hỉ, nhưng chính câu Hê-bơ-rơ dùng động từ cụ thể “đi ra”; bản dịch giữ cách nói ấy thay vì đưa phần diễn giải pháp lý vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh” theo mạch luật pháp đang trực tiếp nói với người Y-sơ-ra-ên; dùng “thị tộc” và “sản nghiệp” để giữ sắc thái xã hội-pháp lý, đồng thời kèm chú thích cho các cách hiểu quen thuộc hơn.
