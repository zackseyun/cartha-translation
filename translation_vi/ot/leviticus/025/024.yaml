  to: Trong khắp đất đai các ngươi sở hữu[b], các ngươi phải cho phép chuộc lại đất[a].
  rationale: Sửa cấu trúc genitive để tiếng Việt tự nhiên và phản ánh chính xác rằng “đất đai” là đối tượng của quyền nắm giữ. Giữ “cho phép chuộc lại đất” để diễn đạt mệnh lệnh phải dành sự chuộc lại/quyền chuộc lại mà không áp đặt cơ chế pháp lý cụ thể hơn. Các mốc chú thích vẫn được neo đầy đủ trong chính văn.
