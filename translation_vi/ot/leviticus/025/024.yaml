base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: vi
  text: Trong khắp đất đai các ngươi sở hữu[b], các ngươi phải cho phép chuộc lại đất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các ngươi phải dành quyền chuộc lại cho đất.”'
    reason: lexical_alternative
  - marker: b
    text: “Sở hữu” ở đây chỉ phần đất được nắm giữ trong phần chia thừa hưởng của Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְכֹל
  choice: Trong toàn
  rationale: Diễn đạt tự nhiên phạm vi bao quát của quy định; liên từ ו có thể không cần tách thành “Và” trong câu luật tiếng Việt.
- source_word: אֶרֶץ
  choice: xứ
  rationale: Trong ngữ cảnh luật về đất đai của Israel, từ này chỉ lãnh thổ, không phải toàn thể trái đất; “xứ” cũng giúp phân biệt với “đất” ở cuối câu.
- source_word: אֲחֻזַּתְכֶם
  choice: thuộc sản nghiệp của các ngươi
  rationale: אֲחֻזָּה chỉ phần đất được nắm giữ như cơ nghiệp trong cơ cấu phân chia đất của Israel. “Sản nghiệp” giữ được sắc thái pháp lý và thừa kế.
- source_word: גְּאֻלָּה
  choice: chuộc lại
  rationale: Trong luật đất đai, danh từ này nói đến việc hoặc quyền lấy lại đất bằng cách trả giá. Cách dùng động từ tiếng Việt tự nhiên hơn danh từ trừu tượng “sự cứu chuộc” và tránh hàm ý thần học ngoài ngữ cảnh.
- source_word: תִּתְּנוּ
  choice: phải cho phép
  rationale: Nghĩa đen là “các ngươi sẽ cho”; trong quy định pháp lý, “phải cho phép” truyền đạt mệnh lệnh phải tạo điều kiện cho việc chuộc lại mà không khẳng định quá mức rằng chủ thể trực tiếp thực hiện việc chuộc.
- source_word: לָאָרֶץ
  choice: đất
  rationale: Giới từ ל đánh dấu đối tượng liên quan đến việc chuộc; tiếng Việt tự nhiên nói “chuộc lại đất” thay vì “ban sự chuộc lại cho đất”.
theological_decisions:
- issue: Bản chất của mệnh lệnh về đất sản nghiệp đã bán
  choice: Quy định phải cho phép đất trong sản nghiệp của Israel được chuộc lại.
  alternative: 'Dịch sát hình thức hơn: “các ngươi phải dành sự chuộc lại cho đất.”'
  rationale: Ngữ cảnh Lê-vi Ký 25 cho thấy đây là quy định về khả năng hoặc quyền chuộc lại đất. Bản dịch diễn đạt chức năng pháp lý ấy nhưng chú thích giữ lại phương án danh từ để bảo tồn độ mơ hồ giữa hành động và quyền chuộc.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “các ngươi” để giữ lối xưng hô số nhiều của văn bản; dùng “xứ” cho lãnh thổ và “đất” cho bất động sản nhằm tránh lặp tối nghĩa. Mọi dấu chú thích đều xuất hiện trong chính văn.
