  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng phạm vi phổ quát, tính chất đất đai thuộc quyền nắm giữ của người Israel, và mệnh lệnh phải có sự chuộc lại đất. Tuy nhiên, cụm “xứ thuộc sản nghiệp” khiến quan hệ sở hữu trong אֶרֶץ אֲחֻזַּתְכֶם kém tự nhiên: chính đất đai là phần sở hữu/sản nghiệp, không phải “xứ” thuộc về một “sản nghiệp” khác.'
  naturalness: “Trong toàn xứ thuộc sản nghiệp của các ngươi” không tự nhiên trong tiếng Việt hiện đại. “Trong khắp đất đai các ngươi sở hữu” rõ và tự nhiên hơn trong văn cảnh luật đất đai. “Cho phép chuộc lại đất” là cách diễn đạt pháp lý dễ hiểu.
  terminology: Giữ “chuộc lại” là phù hợp với גְּאֻלָּה trong ngữ cảnh bất động sản và tránh dùng “cứu chuộc” theo nghĩa thần học rộng hơn. Chú thích văn hóa nên nói trực tiếp về phần đất được nắm giữ trong phần chia thừa hưởng của Israel; không cần diễn đạt “nhận làm cơ nghiệp,” vốn có thể gợi một hành động không có trong câu này.
