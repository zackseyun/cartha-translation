source:
  edition: WLC
  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: vi
  text: Đó là Năm Hân Hỉ[a]; năm thứ năm mươi sẽ là Năm Hân Hỉ cho các ngươi. Các ngươi không được gieo, không được gặt hoa lợi tự mọc[b], cũng không được hái nho từ những cây nho không cắt tỉa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này chỉ Năm Hân Hỉ trong ngữ cảnh này; từ này có liên hệ với sừng cừu dùng làm tù và.
    reason: lexical_background
  - marker: b
    text: Hay “những gì tự mọc”, tức là sản vật mọc lên mà không do gieo trồng.
    reason: lexical_alternative
  - marker: c
    text: Cụm từ Hê-bơ-rơ chỉ sản vật nho của những cây nho được để mặc, không được chăm tỉa.
    reason: lexical_clarification
lexical_decisions:
- source_word: יוֹבֵל
  choice: Năm Hân Hỉ
  rationale: Trong Lê-vi Ký 25, từ này chỉ năm thánh đặc biệt, chứ không trực tiếp chỉ tù và sừng cừu. “Năm Hân Hỉ” là cách gọi trang trọng, dễ hiểu và đã quen thuộc trong tiếng Việt.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: năm thứ năm mươi ấy
  rationale: Diễn đạt tự nhiên cấu trúc Hê-bơ-rơ xác định đây là năm thứ năm mươi; từ “ấy” giúp liên kết với Năm Hân Hỉ vừa nêu.
- source_word: תִּהְיֶה לָכֶם
  choice: sẽ là năm dành cho các ngươi
  rationale: Giữ ý vị ngữ cùng sắc thái chỉ đối tượng của לָכֶם, tránh diễn giải thêm rằng họ phải cử hành theo một cách cụ thể.
- source_word: לֹא תִזְרָעוּ
  choice: không được gieo
  rationale: Cách diễn đạt tự nhiên của lệnh cấm trong văn bản luật pháp tiếng Việt.
- source_word: לֹא תִקְצְרוּ
  choice: không được gặt
  rationale: Giữ động từ nông nghiệp này phân biệt với động từ chuyên dùng cho việc hái nho ở mệnh đề sau.
- source_word: סְפִיחֶיהָ
  choice: những gì tự mọc
  rationale: Chỉ hoa lợi mọc lên không do gieo trồng; cách dịch này rõ nghĩa với độc giả phổ thông và không hàm ý đó là vụ mùa được canh tác.
- source_word: לֹא תִבְצְרוּ
  choice: không được hái nho
  rationale: בצר là động từ chuyên biệt cho việc thu hoạch nho; nêu rõ “nho” tạo câu tiếng Việt tự nhiên và chính xác.
- source_word: נְזִרֶיהָ
  choice: nho từ những cây nho không cắt tỉa
  rationale: Trong ngữ cảnh canh tác, từ này nói đến sản vật của cây nho được để mặc, không chăm tỉa. Cách dịch giữ hình ảnh nghề trồng nho và sự song song với hoa lợi tự mọc.
theological_decisions: []
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Các ngươi” duy trì sắc thái lời luật truyền cho toàn thể dân chúng; cấu trúc mở đầu giữ hai vế của nguyên văn thay vì nhập chúng thành một câu diễn giải.
