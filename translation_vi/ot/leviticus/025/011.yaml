  to: Đó là Năm Hân Hỉ[a]; năm thứ năm mươi sẽ là Năm Hân Hỉ cho các ngươi. Các ngươi không được gieo, không được gặt hoa lợi tự mọc[b], cũng không được hái nho từ những cây nho không cắt tỉa[c].
