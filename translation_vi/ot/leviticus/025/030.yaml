id: LEV.25.30
reference: Leviticus 25:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: vi
  text: Nhưng nếu ngôi nhà không được chuộc lại trước khi trọn một năm, thì ngôi nhà trong thành không có tường bao sẽ vĩnh viễn thuộc về người đã mua nó, qua các thế hệ của người ấy[a]; nhà đó sẽ không được trả lại vào Năm Hân Hỉ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “cho các thế hệ của người ấy”, tức quyền sở hữu được tiếp tục trong dòng người mua.
    reason: lexical_alternative
  - marker: b
    text: Bản phụ âm chép “thành không có tường bao”; ghi chú đọc truyền thống của người Masoret là “thành có tường bao”. “Không được trả lại vào Năm Hân Hỉ” nghĩa là ngôi nhà không trở về gia đình chủ cũ trong năm ấy.
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: được chuộc lại
  rationale: Thể Niphal của גאל trong luật về tài sản chỉ việc tài sản được người có quyền chuộc mua lại; “chuộc lại” vừa tự nhiên vừa giữ thuật ngữ pháp lý xuyên suốt Lê-vi Ký 25.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: trước khi trọn một năm
  rationale: Diễn đạt rõ thời hạn chuộc là một năm trọn vẹn tính từ giao dịch, mà không thêm chi tiết không có trong câu.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: sẽ vĩnh viễn thuộc về
  rationale: וְקָם theo nghĩa đen là “sẽ đứng/vững”, nhưng trong văn cảnh pháp lý, kết hợp với לַצְּמִיתֻת, nói rằng việc chuyển quyền sở hữu được xác lập vĩnh viễn. Cách dịch này truyền đạt đúng hiệu lực pháp lý bằng tiếng Việt tự nhiên.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לֹא חֹמָה
  choice: ngôi nhà trong thành không có tường bao
  rationale: Giữ nguyên cách đọc của văn bản phụ âm được cung cấp là לא, “không”, đồng thời dùng “tường bao” để chỉ tường thành một cách rõ ràng.
- source_word: לַקֹּנֶה אֹתוֹ
  choice: người đã mua nó
  rationale: Diễn đạt tự nhiên phân từ chỉ người mua và đại từ chỉ ngôi nhà trong một giao dịch đã hoàn tất.
- source_word: לְדֹרֹתָיו
  choice: qua các thế hệ của người ấy
  rationale: Giữ hình ảnh các thế hệ nối tiếp trong dòng người mua, qua đó thể hiện tính thừa kế lâu dài mà không thu hẹp thành một nhóm hậu duệ cụ thể.
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: sẽ không được trả lại vào Năm Hân Hỉ
  rationale: יצא nghĩa đen là “đi ra”, nhưng trong luật Năm Hân Hỉ chỉ việc tài sản rời quyền sở hữu của người mua để trở về gia đình ban đầu. “Không được trả lại” làm rõ hiệu lực pháp lý trong tiếng Việt.
- source_word: יּוֹבֵל
  choice: Năm Hân Hỉ
  rationale: Tên gọi trang trọng, dễ hiểu cho thiết chế năm יוֹבֵל trong Lê-vi Ký 25; viết hoa để chỉ kỳ lễ luật định cụ thể.
theological_decisions:
- issue: Hiệu lực của việc bán nhà sau thời hạn chuộc
  choice: Nếu không được chuộc trong một năm trọn, ngôi nhà trở thành tài sản vĩnh viễn, có thể truyền qua các thế hệ của người mua và không hoàn lại trong Năm Hân Hỉ.
  alternative: Dịch sát וְקָם là “việc bán sẽ đứng vững”, để mức độ giải thích pháp lý thấp hơn.
  rationale: Sự kết hợp của וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו và לֹא יֵצֵא בַּיּוֹבֵל cho thấy việc chuyển quyền sở hữu được xác lập lâu dài, không bị quy định hoàn trả trong Năm Hân Hỉ đảo ngược.
- issue: Dị bản về thành có hay không có tường bao
  choice: Theo văn bản phụ âm được cung cấp, đọc לא là “không có tường bao”.
  alternative: Truyền thống Masoret ghi chú cách đọc לוֹ, thường được hiểu là “có tường bao”, và nhiều bản dịch theo cách đọc này.
  rationale: Bản nguồn hiển thị לא nhưng dấu nguyên âm phản ánh cách đọc Masoret לוֹ; đây là một khác biệt văn bản có ảnh hưởng trực tiếp đến nghĩa, nên bản chính đi theo chữ viết được cung cấp và ghi chú cách đọc khác thay vì âm thầm giải quyết.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “chuộc lại”, “vĩnh viễn thuộc về” và “được trả lại” để diễn đạt rõ cơ chế sở hữu. Hai dấu chú thích [a], [b] đều xuất hiện trong bản chính. Bản dịch bảo tồn dị biệt quan trọng giữa chữ viết לא và cách đọc Masoret לוֹ bằng chú thích.
