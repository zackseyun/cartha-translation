    issue: 'Mệnh đề cuối có cấu trúc tiếng Việt chưa tự nhiên: «một năm đất được nghỉ hoàn toàn».'
    rationale: Nguyên văn nói một năm nghỉ/nghỉ sabát «cho đất», không phải một cụm danh ngữ trong đó «đất» bổ nghĩa trực tiếp cho «năm». Đổi thành «một năm nghỉ trọn vẹn cho đất» bảo toàn quan hệ cú pháp và ý nghĩa.
