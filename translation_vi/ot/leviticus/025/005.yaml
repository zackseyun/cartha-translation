revisions:
- from: Ngươi không được gặt những gì tự mọc lên từ vụ mùa trước[a], cũng không được hái nho từ cây nho không được tỉa của ngươi[b]. Đó sẽ là một năm đất được nghỉ hoàn toàn[c].
  to: Ngươi không được gặt những gì tự mọc lên từ vụ mùa trước[a], cũng không được hái nho từ cây nho không được tỉa của ngươi[b]. Đó sẽ là một năm nghỉ trọn vẹn cho đất[c].
  rationale: Chỉ sửa mệnh đề cuối để thành ngữ Việt tự nhiên hơn và phản ánh minh bạch cấu trúc «một năm nghỉ ... cho đất» của tiếng Hê-bơ-rơ. Các từ ngữ và các neo chú thích khác đều phù hợp với nguyên văn và được giữ nguyên.
