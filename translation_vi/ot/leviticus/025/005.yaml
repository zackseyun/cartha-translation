source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: vi
  text: Ngươi không được gặt những gì tự mọc lên từ vụ mùa trước[a], cũng không được hái nho từ cây nho không được tỉa của ngươi[b]. Đó sẽ là một năm nghỉ trọn vẹn cho đất[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phần hoa màu tự mọc” hoặc “cây mọc tự nhiên”; chỉ sản vật mọc lên từ hạt của vụ trước mà không do gieo trồng.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “nho của cây nho bị để riêng”; trong ngữ cảnh này là cây nho bị để mặc, không được tỉa hay chăm sóc trong năm đất nghỉ.'
    reason: lexical_alternative
  - marker: c
    text: Hay “một năm sa-bát cho đất” hoặc “một năm nghỉ trọng thể cho đất.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: những gì tự mọc lên từ vụ mùa trước
  rationale: סְפִיחַ chỉ sản vật tự mọc từ hạt rơi của vụ trước, không phải cây được chủ ý gieo trồng. Cách diễn đạt này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: תִקְצֹר
  choice: gặt
  rationale: Động từ chỉ việc gặt sản vật ngoài đồng; “gặt” giữ được sắc thái nông nghiệp cụ thể.
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: nho từ cây nho không được tỉa của ngươi
  rationale: Trong ngữ cảnh năm sa-bát, נָזִיר nói đến cây nho bị để riêng, không được chăm sóc hay tỉa sửa. Bản dịch nêu rõ ý nghĩa thực tiễn mà không gợi sai đến người Na-xi-rê.
- source_word: תִבְצֹר
  choice: hái nho
  rationale: Động từ chuyên dùng cho việc thu hái nho; “hái nho” tự nhiên và chính xác trong tiếng Việt.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: một năm đất được nghỉ hoàn toàn
  rationale: שַׁבָּתוֹן nhấn mạnh sự nghỉ trọn vẹn. Cách dịch này truyền đạt cường độ của từ và liên kết trực tiếp với đất.
- source_word: לָאָרֶץ
  choice: đất
  rationale: Trong Lê-vi Ký 25, từ này chỉ đất canh tác phải được nghỉ, không phải toàn thể trái đất.
theological_decisions:
- issue: Cách diễn đạt thuật ngữ về năm sa-bát mà không đưa thêm liên tưởng giáo phái hay nghi lễ về sau
  choice: một năm đất được nghỉ hoàn toàn
  alternative: một năm sa-bát cho đất; một năm nghỉ trọng thể cho đất
  rationale: Cách chọn giữ trọng tâm thần học về sự nghỉ của đất và thể hiện lực nhấn mạnh của שַׁבָּתוֹן, nhưng không biến cụm từ thành một nhãn lịch pháp đơn thuần hay thêm ý ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ngươi” để phù hợp với lời luật truyền trực tiếp ở số ít; tránh thuật ngữ quá chuyên môn. Các chú thích bảo tồn nghĩa đen và những phương án dịch hợp lệ.
