revisions:
- from: Còn về những nô lệ nam và nữ thuộc về các ngươi, các ngươi có thể mua nô lệ nam và nữ từ các dân tộc ở chung quanh các ngươi.[a]
  to: Còn nô lệ nam và nô lệ nữ sẽ thuộc về các ngươi, các ngươi có thể mua nô lệ nam và nô lệ nữ từ các dân tộc ở chung quanh các ngươi.[a]
  rationale: Bản sửa giữ nguyên nghĩa pháp lý và không né tránh thuật ngữ nô lệ, đồng thời phản ánh rõ hơn sắc thái tương lai/phát sinh quan hệ sở hữu trong mệnh đề Hê-bơ-rơ. Cấu trúc câu vẫn tự nhiên trong tiếng Việt hiện đại, bảo toàn sự phân biệt nam–nữ ở cả hai cặp danh từ của nguyên văn, và đặt neo chú thích tại cụm được chú giải.
  reviewer_model: gpt-5.6-terra
