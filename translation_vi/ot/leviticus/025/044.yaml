base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: vi
  text: Còn nô lệ nam và nô lệ nữ sẽ thuộc về các ngươi, các ngươi có thể mua nô lệ nam và nô lệ nữ từ các dân tộc ở chung quanh các ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các dân tộc” ở đây chỉ những dân không thuộc Y-sơ-ra-ên sống chung quanh họ; cũng có thể dịch là “từ giữa các dân tộc ở chung quanh các ngươi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: những nô lệ nam và nữ thuộc về các ngươi
  rationale: Trong luật về việc mua và sở hữu người, עֶבֶד và אָמָה chỉ thân phận nô lệ chứ không đơn thuần là người phục vụ; bản dịch giữ rõ sự phân biệt nam và nữ.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: thuộc về các ngươi
  rationale: Diễn đạt quan hệ sở hữu pháp lý được nêu trong mệnh đề Hê-bơ-rơ, đồng thời tránh làm nặng sắc thái tương lai.
- source_word: מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: từ các dân tộc ở chung quanh các ngươi
  rationale: גּוֹיִם ở đây là các dân tộc không thuộc Y-sơ-ra-ên sống quanh họ; “các dân tộc” tự nhiên và ít mang hàm ý thần học hơn “dân ngoại”.
- source_word: תִּקְנוּ
  choice: có thể mua
  rationale: קנה có nghĩa là mua hay thu nhận. Trong ngữ cảnh điều luật này, hình thức động từ cho phép việc mua chứ không truyền lệnh phải mua.
- source_word: עֶבֶד וְאָמָה
  choice: nô lệ nam và nữ
  rationale: Cặp danh từ số ít mang nghĩa khái quát, chỉ cả hai giới; cách diễn đạt tiếng Việt này rõ ràng và không cổ hóa.
theological_decisions:
- issue: Cách dịch thuật ngữ về chế độ nô lệ trong văn bản luật pháp
  choice: Dùng “nô lệ” cho עֶבֶד và אָמָה.
  alternative: “đầy tớ” hoặc “tôi tớ”
  rationale: Câu này nói rõ đến việc mua con người từ các dân tộc chung quanh, nên thân phận lệ thuộc và bị sở hữu là trọng tâm. Dịch là “đầy tớ” có thể làm nhẹ đi thực tế pháp lý của nguyên văn.
- issue: Lực ngữ pháp của תִּקְנוּ trong ngữ cảnh
  choice: 'Dịch theo nghĩa cho phép: “có thể mua”.'
  alternative: “phải mua” hoặc “sẽ mua”
  rationale: Điều khoản cho phép mua từ nguồn được chỉ định, không ra lệnh người Y-sơ-ra-ên phải thực hiện việc mua.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “các ngươi” để giữ ngôi thứ hai số nhiều của nguyên văn và phù hợp với lời luật truyền cho cộng đồng; dùng “nô lệ” nhằm phản ánh thẳng thắn thân phận pháp lý trong câu.
