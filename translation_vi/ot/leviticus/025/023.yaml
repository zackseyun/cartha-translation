review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng lệnh cấm bị động/pháp lý của תִמָּכֵר, sắc thái không thể chuyển nhượng vĩnh viễn của לִצְמִתֻת, và lý do thần học trực tiếp: đất thuộc về Đức Chúa Trời. Cặp גֵרִים וְתוֹשָׁבִים cần được diễn đạt sao cho không gán nghĩa quốc tịch–pháp lý hiện đại quá cụ thể.'
  naturalness: “Bởi các ngươi chỉ là...” hơi gượng trong tiếng Việt hiện đại, và “chỉ” thêm một nét nhấn không có trong nguyên văn. “Ngoại kiều” thường chỉ người mang quốc tịch nước ngoài trong cách dùng hiện đại, không phù hợp nhất với hình ảnh Israel là những người cư ngụ không có quyền sở hữu tối hậu trước mặt Đức Chúa Trời. “Người lạ và người tạm trú” tự nhiên, rõ ràng và giữ được cặp thuật ngữ.
  terminology: Giữ “bán đứt” là phù hợp cho sự chuyển nhượng không thể chuộc lại. Giữ đại từ “ta/các ngươi” nhất quán với lời phán trực tiếp. Không cần đưa “Đức Chúa Trời” vào thân văn, vì nguyên văn dùng ngôi thứ nhất; tên này thích hợp trong chú thích giải thích ngữ cảnh.
  issues:
  - severity: medium
    issue: “Ngoại kiều” mang nghĩa pháp lý-quốc tịch hiện đại quá hẹp.
    rationale: גֵר trong cặp với תּוֹשָׁב nhấn mạnh tư cách cư ngụ không có quyền sở hữu gốc/tối hậu, không chủ yếu là quốc tịch nước ngoài. “Người lạ” tránh áp đặt phạm trù hành chính hiện đại.
  - severity: low
    issue: “Bởi các ngươi chỉ là” kém tự nhiên và thêm từ “chỉ”.
    rationale: Nguyên văn nói “vì các ngươi là...”, không có từ tương đương “chỉ”. Dùng dấu chấm phẩy giúp câu tiếng Việt tự nhiên trong khi vẫn nối lý do thứ hai với mệnh đề trước.
  revised_text: Đất không được bán đứt[a], vì đất thuộc về ta; các ngươi là những người lạ và người tạm trú với ta[b].
