revisions:
- from: Đất không được bán đứt[a], vì đất thuộc về ta. Bởi các ngươi chỉ là ngoại kiều và người tạm trú với ta[b].
  to: Đất không được bán đứt[a], vì đất thuộc về ta; các ngươi là những người lạ và người tạm trú với ta[b].
  rationale: Sửa cụm chỉ tình trạng cư ngụ để tránh nghĩa hành chính hiện đại của “ngoại kiều”, bỏ sự nhấn mạnh không có trong nguyên văn (“chỉ”), và điều chỉnh liên kết câu cho tự nhiên hơn. Bản sửa vẫn bảo tồn tính cấm đoán, tính vĩnh viễn của việc chuyển nhượng, quyền sở hữu của Đức Chúa Trời, và ý nghĩa trực tiếp của “với ta”.
  reviewer_model: gpt-5.6-terra
