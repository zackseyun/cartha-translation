source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: vi
  text: Đất không được bán đứt[a], vì đất thuộc về ta; các ngươi là những người lạ và người tạm trú với ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bán vĩnh viễn” hoặc “chuyển nhượng vĩnh viễn”.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “người lạ và người tạm trú” diễn tả địa vị cư ngụ lệ thuộc của dân Israel trên đất, vì đất thuộc về Đức Chúa Trời.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: không được bán
  rationale: Dạng Nifal chưa hoàn thành trong văn luật pháp mang nghĩa bị động và cấm đoán; cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên lực pháp lý.
- source_word: לִצְמִתֻת
  choice: bán đứt
  rationale: Trong bối cảnh quyền sử dụng đất, từ này chỉ sự chuyển nhượng vĩnh viễn hoặc không thể thu hồi. “Bán đứt” là cách nói hiện đại, rõ nghĩa; chú thích nêu sắc thái pháp lý đầy đủ hơn.
- source_word: כִּי לִי הָאָרֶץ
  choice: vì đất thuộc về ta
  rationale: כִּי có chức năng nêu lý do; cấu trúc לִי diễn tả quyền sở hữu của Đức Chúa Trời. “Thuộc về ta” tự nhiên hơn lối nói “là của ta” mà vẫn trực tiếp.
- source_word: גֵרִים
  choice: ngoại kiều
  rationale: גֵּר chỉ người cư trú tại vùng đất không phải sản nghiệp gốc của mình và có địa vị lệ thuộc. “Ngoại kiều” phân biệt thuật ngữ này với תּוֹשָׁבִים.
- source_word: וְתוֹשָׁבִים
  choice: người tạm trú
  rationale: תּוֹשָׁב chỉ người cư ngụ nhưng không có quyền sở hữu thừa kế trọn vẹn; “người tạm trú” làm nổi bật tính không vĩnh viễn của quyền cư trú.
- source_word: עִמָּדִי
  choice: với ta
  rationale: Giữ nghĩa trực tiếp của giới từ עִם kèm hậu tố ngôi thứ nhất số ít, không diễn giải quá mức mối quan hệ được nói đến.
theological_decisions:
- issue: Quan hệ của Israel với đất
  choice: Quyền cư ngụ và sử dụng đất của Israel lệ thuộc vào quyền sở hữu của Đức Chúa Trời.
  alternative: Chỉ xem đây là quy định kinh tế-xã hội, hoặc mở rộng câu này thành lời tuyên bố về sự tước quyền tuyệt đối ngoài bối cảnh năm hân hỉ.
  rationale: Mệnh đề “đất thuộc về ta” minh nhiên đặt nền tảng thần học cho lệnh cấm bán đứt, còn cặp danh từ “ngoại kiều và người tạm trú” diễn tả địa vị lệ thuộc mà không đưa thêm một hệ thống giáo lý về sau.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Đại từ “ta/các ngươi” giữ sắc thái lời phán trực tiếp và phù hợp ngữ cảnh Ngũ Kinh; “bán đứt” là cách nói hiện đại, được bổ sung bằng chú thích pháp lý.
