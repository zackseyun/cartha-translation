  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: vi
  text: Ngươi không được cho người ấy vay tiền của ngươi để lấy lãi,[a] cũng không được cho người ấy lương thực của ngươi để lấy phần tăng thêm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bạc của ngươi để lấy lãi”. Từ Hê-bơ-rơ כֶּסֶף có thể có nghĩa là “bạc” hoặc “tiền”; ở đây nó chỉ tiền dùng để cho vay.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để lấy phần gia tăng”. Từ Hê-bơ-rơ מַרְבִּית chỉ phần tăng thêm hay khoản lợi thu từ thứ được cung cấp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ
  choice: tiền của ngươi
  rationale: כֶּסֶף có nghĩa gốc là “bạc” nhưng thường chỉ tiền trong ngữ cảnh kinh tế; ở đây đi với việc cho vay nên “tiền” là cách diễn đạt tự nhiên và chính xác.
- source_word: תִתֵּן לוֹ
  choice: cho người ấy vay
  rationale: נתן nghĩa đen là “đưa/cho”, nhưng khi đối tượng là tiền và có cụm “để lấy lãi”, ngữ cảnh rõ ràng nói đến việc cho vay.
- source_word: בְּנֶשֶׁךְ
  choice: để lấy lãi
  rationale: נֶשֶׁךְ chỉ khoản lãi thu trên món vay; cách dịch này rõ nghĩa trong tiếng Việt hiện đại mà không thu hẹp thành lãi quá mức.
- source_word: וּבְמַרְבִּית
  choice: để thu thêm
  rationale: מַרְבִּית chỉ phần gia tăng hay khoản thu thêm từ thứ đã cấp. “Thu thêm” giữ được ý nghĩa nguồn và sự song song với việc lấy lãi mà không mặc nhiên diễn giải là lợi nhuận thương mại.
- source_word: אָכְלֶךָ
  choice: lương thực của ngươi
  rationale: אָכֶל là thức ăn; trong quy định về việc cấp cho người túng thiếu, “lương thực” tự nhiên hơn “thức ăn” và vẫn giữ tính cụ thể.
- source_word: לֹא ... לֹא
  choice: không được ... cũng không được
  rationale: Giữ hai mệnh lệnh cấm song song và sắc thái pháp luật rõ ràng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật, trang trọng nhưng dễ hiểu. Dùng “ngươi” phù hợp lối xưng hô trực tiếp của luật pháp Cựu Ước; “người ấy” nối tự nhiên với đối tượng đã được nêu ở văn cảnh trước. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
