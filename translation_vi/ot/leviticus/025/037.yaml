  naturalness: “Cho người ấy vay tiền của ngươi để lấy lãi” và “cho người ấy lương thực của ngươi để lấy phần tăng thêm” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại, đồng thời giữ được sắc thái pháp quy trang trọng.
  terminology: “Lãi” phù hợp với נֶשֶׁךְ. “Phần tăng thêm” phản ánh sát מַרְבִּית hơn “lợi nhuận” và không áp đặt một cách hiểu thương mại chuyên biệt. “Lương thực” là lựa chọn phù hợp cho אָכֶל trong ngữ cảnh này.
