  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: vi
  text: Nhưng nếu chỉ còn ít năm nữa là đến Năm Hân Hỉ, thì người ấy phải tính toán với người mua; tùy theo số năm còn lại, người ấy phải hoàn trả khoản tiền chuộc của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải hoàn trả giá chuộc mình.” Từ Hê-bơ-rơ ở đây chỉ số tiền cần để chuộc người ấy, chứ không nói về sự cứu chuộc theo nghĩa trừu tượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: chỉ còn ít năm nữa
  rationale: Diễn đạt tự nhiên ý số năm còn lại là ít, đồng thời giữ sắc thái định lượng của מְעַט và ý 'còn lại' của נִשְׁאַר.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: Năm Hân Hỉ
  rationale: Tên gọi trang trọng, dễ hiểu cho thiết chế יוֹבֵל trong Lê-vi Ký 25; viết hoa để biểu thị tên của năm đặc biệt này.
- source_word: וְחִשַּׁב לוֹ
  choice: phải tính toán với chủ mình
  rationale: חשב trong ngữ cảnh pháp lý–kinh tế chỉ việc tính toán khoản tiền. Đại từ 'chủ mình' làm rõ đối tác giao dịch từ ngữ cảnh, thay vì dùng đại từ mơ hồ trong tiếng Việt.
- source_word: כְּפִי שָׁנָיו
  choice: tùy theo số năm còn lại
  rationale: כְּפִי biểu thị sự tương ứng hoặc tỷ lệ. 'Số năm còn lại' diễn đạt rõ các năm còn lại cho đến Năm Hân Hỉ theo mạch văn.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: phải hoàn trả giá chuộc mình
  rationale: Hiphil יָשִׁיב mang nghĩa hoàn trả; גְּאֻלָּה ở đây là khoản tiền chuộc để được giải phóng, nên 'giá chuộc' tự nhiên và chính xác hơn cách nói trừu tượng 'sự chuộc'.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “người ấy” và “chủ mình” để tránh đại từ giới tính nặng nề và làm rõ quan hệ trong ngữ cảnh; “giá chuộc mình” giữ ý nghĩa kinh tế cụ thể của câu.
