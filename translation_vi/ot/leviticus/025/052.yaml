  - severity: low
    issue: “giá chuộc mình” hơi không tự nhiên và có thể mơ hồ.
    rationale: Cụm này có thể được hiểu là giá trị của chính người ấy, thay vì số tiền cần trả để chuộc người ấy. “Khoản tiền chuộc của mình” diễn đạt rõ chức năng tài chính của גְּאֻלָּתוֹ.
