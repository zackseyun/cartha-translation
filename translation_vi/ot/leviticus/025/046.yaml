base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: vi
  text: Các ngươi có thể truyền họ lại cho các con trai mình sau các ngươi[a], để họ làm tài sản thừa kế; các ngươi có thể bắt họ lao dịch mãi mãi. Còn đối với anh em các ngươi, là con trai Y-sơ-ra-ên[b], không ai được cai trị anh em mình cách hà khắc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các ngươi có thể để lại họ cho các con trai mình sau các ngươi như tài sản thừa kế.”'
    reason: lexical_alternative
  - marker: b
    text: “Anh em” và “con trai Y-sơ-ra-ên” chuyển trực tiếp các từ thân tộc giống đực trong tiếng Hê-bơ-rơ; cách gọi này đặt những người Y-sơ-ra-ên trong quan hệ thân tộc giao ước.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: có thể truyền họ lại
  rationale: Dạng Hithpael của נחל tại đây chỉ việc làm cho người hoặc tài sản được truyền lại theo quyền thừa kế; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ lực pháp lý.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: cho các con trai mình sau khi qua đời
  rationale: Giữ nghĩa trực tiếp của בנים là “con trai”; “sau khi qua đời” diễn đạt rõ ý אַחֲרֵיכֶם trong bối cảnh thừa kế.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: để thừa hưởng làm sản nghiệp
  rationale: 'Giữ cả hai phương diện của cụm từ: việc thừa hưởng và địa vị tài sản thuộc quyền sở hữu.'
- source_word: לְעֹלָם
  choice: vĩnh viễn
  rationale: Trong quy định pháp lý này, từ ngữ nói đến địa vị sở hữu lâu dài, không hàm ý một khẳng định siêu hình về cõi đời đời.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: có thể bắt họ phục dịch
  rationale: Thể hiện lao dịch bị cưỡng buộc trong bối cảnh những người bị coi là tài sản, không làm nhẹ thực tế xã hội của câu.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: Nhưng đối với anh em mình, tức con cái Y-sơ-ra-ên
  rationale: Giữ sự tương phản, ngôn ngữ thân tộc và cấu trúc đồng vị của nguyên văn; “con cái Y-sơ-ra-ên” là cách gọi trang trọng, quen thuộc.
- source_word: אִישׁ בְּאָחִיו
  choice: không ai ... anh em mình
  rationale: 'Diễn đạt tự nhiên ý phân phối của איש ... באחיו: từng người trong quan hệ với người anh em đồng tộc.'
- source_word: לֹא תִרְדֶּה בוֹ
  choice: không ai được cai trị
  rationale: רדה chỉ việc cai trị hoặc thực thi quyền thống trị; “cai trị” giữ nghĩa trực tiếp, còn trạng từ kế tiếp nêu tính chất bị cấm.
- source_word: בְּפָרֶךְ
  choice: cách hà khắc
  rationale: פרך chỉ sự nghiệt ngã, tàn khốc trong bối cảnh lao dịch; “cách hà khắc” trang trọng, rõ nghĩa và không diễn giải quá mức.
theological_decisions:
- issue: Cách chuyển ngữ ngôn ngữ thân tộc trong luật xã hội của Y-sơ-ra-ên
  choice: Giữ “anh em” và “con cái Y-sơ-ra-ên”.
  alternative: “đồng bào Y-sơ-ra-ên” hoặc “người cùng dân tộc”
  rationale: Nguyên văn dùng các từ thân tộc giống đực để đóng khung nghĩa vụ giao ước; bản dịch giữ hình ảnh ấy thay vì trung hòa thành quan hệ dân tộc nói chung.
- issue: Mức độ trực tiếp khi chuyển ngữ chế độ nô lệ
  choice: Giữ ngôn ngữ về thừa kế, sản nghiệp và lao dịch cưỡng buộc.
  alternative: Dùng ngôn ngữ nhẹ hơn về người hầu hoặc sự phục vụ.
  rationale: Nguyên văn nói rõ con người được truyền lại như tài sản và bị buộc lao dịch; bản dịch không che nhẹ lực pháp lý và sức nặng đạo đức của câu.
- issue: Phạm vi của לְעֹלָם
  choice: Dịch “vĩnh viễn” trong phạm vi địa vị pháp lý được mô tả.
  alternative: “đời đời” hoặc “mãi mãi” theo nghĩa tuyệt đối
  rationale: Từ này có thể chỉ thời hạn lâu dài hoặc thường xuyên trong khuôn khổ xã hội-pháp lý; không nên biến nó thành một tuyên bố siêu hình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc pháp lý cùng thực tế sở hữu và lao dịch trong nguyên văn. Dùng “các ngươi” để duy trì lời phán trực tiếp số nhiều, “sản nghiệp” cho sắc thái pháp lý-thừa kế, và danh xưng quen thuộc “Y-sơ-ra-ên”.
