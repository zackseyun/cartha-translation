revisions:
- from: Các ngươi có thể truyền họ lại cho các con trai mình sau khi qua đời[a], để thừa hưởng làm sản nghiệp vĩnh viễn; các ngươi có thể bắt họ phục dịch. Nhưng đối với anh em mình, tức con cái Y-sơ-ra-ên[b], không ai được cai trị anh em mình cách hà khắc.
  to: Các ngươi có thể truyền họ lại cho các con trai mình sau các ngươi[a], để họ làm tài sản thừa kế; các ngươi có thể bắt họ lao dịch mãi mãi. Còn đối với anh em các ngươi, là con trai Y-sơ-ra-ên[b], không ai được cai trị anh em mình cách hà khắc.
  rationale: Bản sửa chuyển לְעֹלָם sang mệnh đề lao dịch, nơi từ này thuộc về trong câu Hê-bơ-rơ; làm rõ rằng các con trai là người nhận thừa kế; và phục hồi “con trai Y-sơ-ra-ên” theo bְּנֵי. “Sau các ngươi” bảo lưu sự cô đọng của nguyên văn mà không thêm rõ ý “qua đời”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:49Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ được tương phản pháp lý giữa những người bị truyền thừa và người Y-sơ-ra-ên, cũng như lệnh cấm cai trị hà khắc. Tuy nhiên, “sau khi qua đời” diễn giải cụm “sau các ngươi” mạnh hơn cần thiết; “để thừa hưởng làm sản nghiệp vĩnh viễn” gây nhập nhằng về chủ thể thừa hưởng và đặt “vĩnh viễn” vào cụm sở hữu, trong khi לְעֹלָם gắn trực tiếp với việc bắt họ lao dịch. “Con cái Y-sơ-ra-ên” cũng trung hòa בְּנֵי, nghĩa đen là “con trai”.
  naturalness: Câu hiện tại nhìn chung dễ hiểu, nhưng “truyền họ lại ... để thừa hưởng làm sản nghiệp” chưa tự nhiên về cú pháp và có thể khiến “các ngươi” thành chủ thể của “thừa hưởng”. Bản sửa làm rõ quan hệ thừa kế và giữ văn phong pháp lý hiện đại.
  terminology: Giữ “anh em”, “con trai Y-sơ-ra-ên”, “tài sản thừa kế” và “lao dịch” để phản ánh thuật ngữ thân tộc, thừa kế và cưỡng bức lao động của tiếng Hê-bơ-rơ. Chú thích về giống đực cần không khẳng định quá mức rằng luật chỉ nói đến nam giới; văn phạm giống đực tự nó không giải quyết toàn bộ phạm vi pháp lý của đối tượng.
  issues:
  - severity: medium
    issue: Vị trí và chức năng của “vĩnh viễn” chưa sát cú pháp nguồn
    rationale: 'לְעֹלָם đứng với בָּהֶם תַּעֲבֹדוּ: “các ngươi có thể bắt họ lao dịch mãi mãi/lâu dài”, không trực tiếp bổ nghĩa cho אֲחֻזָּה trong câu dịch.'
  - severity: medium
    issue: “Để thừa hưởng làm sản nghiệp” mơ hồ về chủ thể
    rationale: Cụm này có thể được đọc là chính “các ngươi” thừa hưởng. Cần diễn đạt rõ rằng họ được để lại cho các con trai như tài sản thừa kế.
  - severity: low
    issue: “Con cái Y-sơ-ra-ên” không giữ từ giống đực בְּנֵי
    rationale: Trong khi bản dịch chọn giữ ngôn ngữ giống đực, “con trai Y-sơ-ra-ên” phản ánh trực tiếp hơn בְּנֵי יִשְׂרָאֵל.
  - severity: low
    issue: Chú thích b giới hạn đối tượng thành “những người nam”
    rationale: Chú thích nên mô tả hình thức giống đực của từ thân tộc mà không suy diễn rằng phạm vi của quy định tất yếu chỉ gồm nam giới.
