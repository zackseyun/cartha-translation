  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/הַ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/001.yaml
  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se trên núi Si-nai rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; cũng được phiên âm là “Giê-hô-va” (Jehovah).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong lời dẫn vào phát ngôn của Đức Chúa Trời được diễn đạt tự nhiên và trang trọng bằng “phán”; liên từ וַ được thể hiện qua mạch kể tiếp nối mà không cần thêm “và” trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: אֶל đánh dấu người tiếp nhận lời phán; “phán với Môi-se” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: בְּהַר סִינַי
  choice: trên núi Si-na
  rationale: בְּ mang nghĩa chỉ nơi chốn; “trên núi Si-na” phản ánh sát cấu trúc Hê-bơ-rơ và phù hợp cách nói tiếng Việt.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Dạng nguyên mẫu này dẫn vào nội dung lời phán ở câu kế tiếp; “rằng:” tạo liên kết tự nhiên và rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu “CHÚA”; chú thích nêu dạng chữ Hê-bơ-rơ và các cách phiên âm khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dẫn ngắn gọn, dùng “phán” theo ngữ cảnh lời Đức Chúa Trời và giữ dấu hai chấm để mở sang nội dung ở câu tiếp theo.
