  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: vi
  text: 'Nếu anh em nói: “Chúng tôi sẽ ăn gì trong năm thứ bảy, vì chúng tôi sẽ không gieo cũng không thu hoạch hoa lợi của mình?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: Nếu anh em hỏi
  rationale: Cấu trúc וְכִי mở đầu một tình huống giả định; trong ngữ cảnh này, תֹאמְרוּ tự nhiên được diễn đạt là “hỏi” vì lời nói theo sau mang hình thức câu hỏi.
- source_word: מַה נֹּאכַל
  choice: chúng tôi sẽ ăn gì
  rationale: Giữ nguyên ngôi thứ nhất số nhiều và ý tương lai của động từ chưa hoàn thành.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִת
  choice: năm thứ bảy
  rationale: Cách gọi tự nhiên và chính xác cho năm sa-bát trong mạch văn.
- source_word: הֵן
  choice: vì
  rationale: Ở đây tiểu từ dẫn vào căn cứ của câu hỏi; “vì” truyền đạt quan hệ giải thích tự nhiên trong tiếng Việt thay vì dịch máy móc là “kìa”.
- source_word: לֹא נִזְרָע
  choice: chúng tôi không gieo trồng
  rationale: Dạng ngôi thứ nhất số nhiều được giữ; “gieo trồng” diễn đạt rõ hoạt động canh tác.
- source_word: וְלֹא נֶאֱסֹף אֶת־תְּבוּאָתֵנוּ
  choice: cũng không thu hoạch hoa lợi của mình
  rationale: אָסַף trong ngữ cảnh nông nghiệp là thu gom/thu hoạch; תְּבוּאָה chỉ sản vật hay hoa lợi từ đất. “Của mình” quy chiếu tự nhiên về chủ thể số nhiều.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đối tượng số nhiều được Đức Chúa Trời phán bảo, còn lời trích dẫn giữ “chúng tôi” theo ngôi của người đặt câu hỏi. Không thêm thuật ngữ giáo phái.
