id: LEV.25.4
reference: Leviticus 25:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: vi
  text: Nhưng vào năm thứ bảy, đất sẽ có một kỳ sa-bát, tức là một kỳ nghỉ ngơi hoàn toàn[a], một kỳ sa-bát dành riêng cho Yahweh. Không được gieo ruộng của mình, cũng không được tỉa vườn nho của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một kỳ sa-bát nghỉ ngơi trọng thể.” Cụm từ Hê-bơ-rơ nhấn mạnh sự ngưng nghỉ hoàn toàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: Nhưng vào năm thứ bảy
  rationale: Liên từ וּ có thể mang nghĩa nối tiếp hoặc tương phản. Ở đây, câu này tương phản năm thứ bảy với sáu năm canh tác ở câu trước, nên “Nhưng” diễn đạt tự nhiên mạch văn.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: một kỳ sa-bát nghỉ hoàn toàn
  rationale: Cụm danh từ lặp ý nhấn mạnh sự ngưng nghỉ trọn vẹn. “Kỳ sa-bát” giữ khái niệm sa-bát, còn “nghỉ hoàn toàn” truyền đạt sức nhấn mạnh của שַׁבָּתוֹן.
- source_word: יִהְיֶה לָאָרֶץ
  choice: đất phải được hưởng
  rationale: Cách diễn đạt này giữ đất là đối tượng được dành cho sự nghỉ, đồng thời tự nhiên hơn trong tiếng Việt so với cấu trúc hiện hữu sát chữ.
- source_word: שַׁבָּת לַיהוָה
  choice: một kỳ sa-bát dâng cho Yahweh
  rationale: Giới từ לַ biểu thị sự quy hướng hoặc hiến dâng; “dâng cho” làm rõ kỳ nghỉ này được biệt riêng cho Yahweh.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước יהוה, thay vì thay bằng một tước hiệu.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: Ngươi không được gieo ruộng mình
  rationale: Giữ ngôi thứ hai số ít giống đực của lời luật và chuyển động từ זרע bằng thuật ngữ nông nghiệp thông dụng “gieo”.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: cũng không được tỉa vườn nho mình
  rationale: Trong ngữ cảnh vườn nho, זמר có nghĩa là tỉa cành; “cũng không” nối hai lệnh cấm song song một cách tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn đặc tính danh riêng và tránh thay nó bằng tước hiệu.
- issue: Ý nghĩa của kỳ nghỉ đối với Yahweh
  choice: dâng cho Yahweh
  alternative: của Yahweh
  rationale: Giới từ לַ có thể được diễn đạt theo nhiều cách; “dâng cho” giữ sắc thái quy hướng/biệt riêng mà không biến cụm từ thành phát biểu đơn thuần về sở hữu.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “ngươi” để bảo tồn ngôi thứ hai số ít của nguyên văn; dùng “sa-bát” như thuật ngữ quen thuộc và giải thích sắc thái nhấn mạnh trong chú thích.
