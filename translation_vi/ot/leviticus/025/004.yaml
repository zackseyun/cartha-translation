revisions:
- from: Nhưng vào năm thứ bảy, đất phải được hưởng một kỳ sa-bát nghỉ hoàn toàn[a], một kỳ sa-bát dâng cho Yahweh. Ngươi không được gieo ruộng mình, cũng không được tỉa vườn nho mình.
  to: Nhưng vào năm thứ bảy, đất sẽ có một kỳ sa-bát, tức là một kỳ nghỉ ngơi hoàn toàn[a], một kỳ sa-bát dành riêng cho Yahweh. Không được gieo ruộng của mình, cũng không được tỉa vườn nho của mình.
  rationale: Bản sửa thay cách diễn đạt mang sắc thái bắt buộc và thành ngữ chưa tự nhiên bằng cấu trúc tương lai phù hợp với nguyên văn; đồng thời diễn đạt rõ, tự nhiên hơn cụm nhấn mạnh “sa-bát của sự nghỉ trọn vẹn.” “Dành riêng cho Yahweh” bảo toàn chức năng thánh hiến của giới từ לַ. Các lệnh cấm được chuyển sang lối pháp quy vô chủ, hiện đại mà không thay đổi đối tượng áp dụng tổng quát.
