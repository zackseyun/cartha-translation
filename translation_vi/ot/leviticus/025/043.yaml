  text: לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָ֑רֶךְ וְ/יָרֵ֖אתָ מֵ/אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/043.yaml
  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: vi
  text: Con không được cai trị người ấy một cách hà khắc[a], nhưng phải kính sợ Đức Chúa Trời của con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cách khắc nghiệt” hoặc “tàn nhẫn.” Từ Hê-bơ-rơ chỉ cách đối xử nghiêm khắc, đè nặng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה
  choice: cai trị
  rationale: Động từ רדה diễn tả việc cai quản hoặc thi hành quyền trên người khác; “cai trị” giữ được quan hệ quyền lực trong luật này mà không diễn giải quá mức.
- source_word: בּוֹ
  choice: người ấy
  rationale: Đại từ giống đực số ít chỉ người Israel đang phục dịch vì nghèo túng được nói đến trong ngữ cảnh; “người ấy” tự nhiên và rõ hơn đại từ “nó” trong tiếng Việt trang trọng.
- source_word: בְּפָרֶךְ
  choice: cách hà khắc
  rationale: פָרֶךְ chỉ sự khắc nghiệt, đè nặng hoặc áp bức. “Cách hà khắc” phù hợp tự nhiên với “cai trị” và không nhất thiết đẩy nghĩa đến mức “tàn nhẫn”.
- source_word: וְיָרֵאתָ
  choice: nhưng phải kính sợ
  rationale: Liên từ וְ về hình thức là “và”, nhưng sau mệnh lệnh cấm, nó tạo quan hệ tương phản về ý nghĩa. “Nhưng” làm rõ rằng lòng kính sợ Đức Chúa Trời phải chi phối cách sử dụng quyền lực.
- source_word: מֵאֱלֹהֶיךָ
  choice: Đức Chúa Trời của con
  rationale: Sau ירא, giới từ מִן đánh dấu đối tượng của sự kính sợ theo thành ngữ Hê-bơ-rơ; tiếng Việt tự nhiên không dịch giới từ này. Đại từ sở hữu ngôi thứ hai số ít được giữ bằng “của con”.
theological_decisions:
- issue: Mệnh đề cuối là nền tảng đạo đức cho cách đối xử với người phục dịch
  choice: “nhưng phải kính sợ Đức Chúa Trời của con”
  alternative: “và phải kính sợ Đức Chúa Trời của con”
  rationale: 'Bản dịch thể hiện sức tương phản của mệnh đề: lòng kính sợ Đức Chúa Trời hạn chế việc sử dụng quyền trên người khác. Cách dịch này không thêm một lập trường giáo phái và vẫn thừa nhận liên từ Hê-bơ-rơ có nghĩa hình thức là “và”.'
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “con” cho ngôi thứ hai số ít trong lời Đức Chúa Trời phán với thành viên cộng đồng giao ước; dùng “người ấy” để tránh sắc thái thiếu tôn trọng. “Đức Chúa Trời” theo lối gọi trang trọng, phổ thông trong tiếng Việt Cơ Đốc.
