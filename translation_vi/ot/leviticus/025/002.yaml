source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: vi
  text: 'Hãy nói với con cái Israel và bảo họ: “Khi các ngươi vào xứ mà Ta ban cho các ngươi, thì đất sẽ giữ một kỳ sa-bát cho Yahweh.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thì đất sẽ nghỉ một kỳ sa-bát cho Yahweh.” Nguyên văn nhân hóa đất như đang tuân giữ sự nghỉ sa-bát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Hãy nói với con cái Israel
  rationale: Giữ mệnh lệnh trực tiếp và cách gọi mang tính gia tộc của tiếng Hê-bơ-rơ; “con cái Israel” tự nhiên và bao quát trong tiếng Việt.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và bảo họ
  rationale: Truyền đạt tự nhiên công thức lặp “nói... và nói với họ” trong lời chỉ thị pháp luật mà không làm câu tiếng Việt nặng nề.
- source_word: כִּי תָבֹאוּ אֶל־הָאָרֶץ
  choice: Khi các ngươi vào xứ
  rationale: כִּי mang nghĩa thời gian trong bối cảnh sự kiện được trông đợi; בוא với אֶל diễn tả việc đi vào. “Xứ” phù hợp với vùng đất được ban cho Israel.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: mà Ta ban cho các ngươi
  rationale: Phân từ נֹתֵן diễn tả hành động ban đang diễn ra hoặc sắp thực hiện; hiện tại tiếng Việt giữ được sắc thái ấy. “Ta” thể hiện lời phán trực tiếp của Đức Chúa Trời với sắc thái trang trọng.
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: thì đất phải giữ một kỳ sa-bát
  rationale: 'Giữ phép nhân hóa của nguyên văn: chính đất “giữ” sa-bát. “Kỳ sa-bát” cho thấy đây là một thời kỳ nghỉ theo thiết chế, không chỉ là sự nghỉ ngơi chung chung.'
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: ל có thể chỉ hướng quy về hoặc sự hiến dâng. “Dâng lên” diễn đạt tự nhiên rằng kỳ sa-bát của đất được dành riêng cho Yahweh; tên giao ước יהוה được phiên là “Yahweh”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; “Yahweh” bảo tồn chức năng của một danh riêng và không thay nó bằng một tước hiệu.
- issue: Chủ thể thực hiện sự nghỉ sa-bát
  choice: đất phải giữ một kỳ sa-bát
  alternative: đất phải được nghỉ trong kỳ sa-bát
  rationale: Nguyên văn nhân hóa הָאָרֶץ làm chủ thể của động từ שׁבת. Bản dịch giữ phép nhân hóa và không chuyển thành cấu trúc bị động.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “các ngươi” trong lời phán số nhiều để phân biệt rõ với số ít; dùng “xứ” cho vùng đất được hứa ban và viết “sa-bát” theo lối phiên âm thông dụng.
