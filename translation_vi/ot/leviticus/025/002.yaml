    issue: '"phải" thay đổi sắc thái của động từ tương lai trong mệnh đề chính.'
    rationale: וְשָׁבְתָה là dạng hoàn thành có waw, trong bối cảnh luật lệ tương lai thường được dịch "sẽ"/"shall". Dù câu hàm ý quy định, "phải" trực tiếp áp đặt sắc thái nghĩa vụ không được biểu thị riêng bởi hình thức này.
  - severity: medium
    issue: Cụm "một kỳ sa-bát dâng lên Yahweh" không tự nhiên và dễ gợi nghĩa dâng tế lễ.
    rationale: לַיהוָה chỉ sự quy thuộc hoặc dành cho Yahweh. "Cho Yahweh" bảo toàn sự ngắn gọn và tránh thêm sắc thái hiến tế.
  revised_text: 'Hãy nói với con cái Israel và bảo họ: “Khi các ngươi vào xứ mà Ta ban cho các ngươi, thì đất sẽ giữ một kỳ sa-bát cho Yahweh.[a]”'
