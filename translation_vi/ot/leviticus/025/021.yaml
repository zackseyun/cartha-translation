source:
  edition: WLC
  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: vi
  text: Bấy giờ, Ta sẽ truyền lệnh để phúc lành của Ta đến với các con trong năm thứ sáu, và phúc lành ấy sẽ làm cho hoa lợi đủ dùng trong ba năm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sản vật” hoặc “mùa màng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: Bấy giờ, Ta sẽ truyền
  rationale: Động từ צוה diễn tả việc ban lệnh hoặc định truyền. “Bấy giờ” thể hiện chức năng nối kết của וְ trong ngữ cảnh, khi câu này đáp lại câu hỏi được nêu ở câu trước.
- source_word: בִּרְכָתִי
  choice: phúc lành của Ta
  rationale: Giữ cách diễn đạt trực tiếp của nguyên văn; vế sau cho biết hiệu quả cụ thể của phúc lành ấy là sự dư dật về nông sản.
- source_word: לָכֶם
  choice: cho các con
  rationale: Giới từ לְ chỉ những người nhận lợi ích. “Cho các con” tự nhiên trong lời Đức Chúa Trời phán với dân chúng.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: trong năm thứ sáu
  rationale: Diễn đạt trực tiếp thời điểm của phúc lành trong chu kỳ năm sa-bát.
- source_word: וְעָשָׂת
  choice: và sẽ đem lại
  rationale: Động từ giống cái số ít có thể gợi về “phúc lành” hoặc “năm”; tiếng Việt lược chủ ngữ ở vế này vừa tự nhiên vừa tránh giải quyết dứt khoát điều nguyên văn để ngỏ.
- source_word: הַתְּבוּאָה
  choice: hoa lợi
  rationale: תבואה chỉ sản vật hay sản lượng nông nghiệp. “Hoa lợi” trang trọng, dễ hiểu và phù hợp bối cảnh mùa gặt.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: cho ba năm
  rationale: Giữ cách nói ngắn gọn của nguyên văn về thời hạn mà hoa lợi cung ứng; không thêm hẳn từ “đủ”, dù ý đủ dùng được hàm chứa trong ngữ cảnh.
theological_decisions:
- issue: Bản chất của phúc lành được hứa ban
  choice: Một hành động trực tiếp của Đức Chúa Trời, đem lại nguồn cung nông nghiệp phi thường
  alternative: Chỉ là một nhận định chung về sự quan phòng
  rationale: Ngôi thứ nhất “Ta sẽ truyền” cùng cụm “phúc lành của Ta” trình bày sự dư dật như kết quả của một mệnh lệnh cụ thể từ Đức Chúa Trời.
- issue: Chủ thể hàm ẩn của וְעָשָׂת
  choice: Lược chủ ngữ trong tiếng Việt để giữ khả năng liên hệ với phúc lành hoặc năm thứ sáu
  alternative: Nêu rõ “phúc lành ấy” hoặc “năm ấy” làm chủ ngữ
  rationale: Hình thái giống cái số ít phù hợp với cả בְּרָכָה (“phúc lành”) và שָׁנָה (“năm”). Bản dịch không nên âm thầm loại bỏ sự mơ hồ ngữ pháp này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” và “các con” phù hợp lời phán trực tiếp của Đức Chúa Trời với cộng đồng, đồng thời câu tiếng Việt lược chủ ngữ ở vế sau để bảo toàn sự mơ hồ thật sự của tiếng Hê-bơ-rơ.
