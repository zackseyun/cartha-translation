  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: vi
  text: Ta là Yahweh[a], Đức Chúa Trời của các ngươi, Đấng đã đưa các ngươi ra khỏi đất Ai Cập để ban cho các ngươi đất Ca-na-an, để là Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Nêu dạng danh trong nguyên ngữ và cách dịch thay thế truyền thống.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu; cách này phản ánh trực tiếp bản Hê-bơ-rơ.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Trong công thức giao ước này, danh từ có hình thức số nhiều nhưng chỉ về Đức Chúa Trời duy nhất của Israel; cách dịch số ít là đúng theo cú pháp và ngữ cảnh.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: đã đưa các ngươi ra
  rationale: Thể Hiphil của יצא trong ngữ cảnh xuất hành mang nghĩa thông dụng là “đưa ra khỏi”; “đã đưa” tự nhiên và vẫn giữ sắc thái Đức Chúa Trời chủ động giải cứu.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: khỏi đất Ai Cập
  rationale: Giữ danh từ אֶרֶץ (“đất, xứ”) trong bản nguồn, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: để ban cho các ngươi đất Ca-na-an
  rationale: Giữ quan hệ mục đích của לָתֵת và ngôn ngữ ban tặng trong lời hứa giao ước.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: và làm Đức Chúa Trời của các ngươi
  rationale: Diễn đạt tự nhiên công thức giao ước “là/làm Đức Chúa Trời của các ngươi”; không hàm ý bản thể của Đức Chúa Trời thay đổi.
- source_word: אֲנִי
  choice: Ta là
  rationale: Đại từ độc lập tạo sắc thái tự xác nhận nhấn mạnh; tiếng Việt cần từ “là” trong câu định danh này.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản nguồn ghi trực tiếp Tetragrammaton. Giữ “Yahweh” bảo tồn tính chất danh riêng, còn chú thích nêu cách thay thế truyền thống.
- issue: Công thức giao ước לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: làm Đức Chúa Trời của các ngươi
  alternative: là Đức Chúa Trời cho các ngươi
  rationale: Cách chọn diễn đạt mối quan hệ giao ước bằng tiếng Việt tự nhiên, không biến câu thành lời nói về sự thay đổi trong bản thể Đức Chúa Trời.
- issue: Quan hệ giữa hai cụm mục đích לָתֵת ... לִהְיוֹת
  choice: để ban ... và làm
  alternative: để ban ... để làm
  rationale: Hai động từ nguyên mẫu đều gắn với hành động đưa Israel ra khỏi Ai Cập. Dùng “và” giúp câu tiếng Việt trôi chảy mà không quyết đoán quá mức về sự phân cấp giữa hai mục đích.
translation_notes:
  register: Văn phong trang trọng, hiện đại. Dùng “Ta/các ngươi” để thể hiện lời phán thần linh với toàn thể cộng đồng Israel và giữ ngôi số nhiều của כֶם. “Đất Ca-na-an” vừa sát nguyên văn vừa quen thuộc trong tiếng Việt Kinh Thánh.
