    rationale: Trong tiếng Việt hiện đại, từ này không minh bạch và có thể gợi một cộng đồng người nước ngoài nói chung, hơn là tình trạng tạm trú/phụ thuộc của תּוֹשָׁב. “Người tạm trú” truyền đạt chức năng pháp lý-xã hội rõ hơn.
  - severity: low
    issue: “bên cạnh ngươi” ở hai chỗ
    rationale: Cách nói này kém tự nhiên trong tiếng Việt, đặc biệt trong “tự nuôi sống bên cạnh ngươi”. “Sống cùng ngươi” truyền đạt tốt ý người túng thiếu tiếp tục thuộc cộng đồng, phù hợp với עִמָּךְ.
