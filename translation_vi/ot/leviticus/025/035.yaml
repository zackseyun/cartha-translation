review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hoàn cảnh sa sút kinh tế, mệnh lệnh phải trợ giúp, và mục đích để người ấy tiếp tục sống trong cộng đồng. Tuy nhiên, “kiều dân” không diễn đạt rõ nghĩa תּוֹשָׁב là người tạm trú/cư trú không ổn định; đồng thời “bên cạnh ngươi” là cách kết hợp từ chưa tự nhiên trong tiếng Việt ở cả hai vị trí.
  naturalness: Nên dùng “sống cùng ngươi” cho עִמָּךְ, và diễn ý thành ngữ đầu câu bằng “không còn khả năng tự nuôi sống” mà không gắn trạng ngữ “bên cạnh ngươi” trực tiếp với động từ này. “Người tạm trú” là cách gọi hiện đại, rõ ràng hơn “kiều dân”.
  terminology: Giữ “anh em của ngươi” và “nâng đỡ” phù hợp văn phong luật lệ Kinh Thánh. Dùng “người ngoại kiều cư trú” cho גֵּר và “người tạm trú” cho תּוֹשָׁב để phân biệt hai thuật ngữ mà không dùng từ cổ hoặc mơ hồ.
  issues:
