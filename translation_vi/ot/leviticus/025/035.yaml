revisions:
- from: Nếu anh em của ngươi trở nên nghèo khó và không còn đủ sức tự nuôi sống bên cạnh ngươi[a], thì ngươi phải nâng đỡ người ấy, để người ấy được sống bên cạnh ngươi như một ngoại kiều cư trú hay một kiều dân.[b]
  to: Nếu anh em của ngươi trở nên nghèo khó và không còn khả năng tự nuôi sống[a], thì ngươi phải nâng đỡ người ấy, để người ấy sống cùng ngươi như một người ngoại kiều cư trú hoặc một người tạm trú.[b]
  rationale: Bản sửa giữ ý nghĩa kinh tế-xã hội và sự mơ hồ cú pháp của nguyên văn, đồng thời thay thuật ngữ không rõ nghĩa và các kết hợp từ kém tự nhiên bằng tiếng Việt hiện đại. Chú thích b bảo lưu cách phân tích cú pháp thay thế, không quyết định dứt khoát phạm vi của cụm גֵּר וְתוֹשָׁב.
