  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: vi
  text: Nếu anh em của ngươi trở nên nghèo khó và không còn khả năng tự nuôi sống[a], thì ngươi phải nâng đỡ người ấy, để người ấy sống cùng ngươi như một người ngoại kiều cư trú hoặc một người tạm trú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “tay người ấy suy yếu/chao đảo với ngươi”, một thành ngữ chỉ việc mất phương tiện hoặc không còn khả năng tự nuôi sống.'
    reason: lexical_alternative
  - marker: b
    text: 'Cụm từ Hê-bơ-rơ “ngoại kiều cư trú và người tạm trú” có cú pháp cô đọng. Cũng có thể hiểu là các đối tượng bổ sung của mệnh lệnh: “ngươi phải nâng đỡ người ấy, cũng như người ngoại kiều cư trú và người tạm trú, để họ được sống cùng ngươi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một trường hợp luật theo điều kiện; “Nếu” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: יָמוּךְ
  choice: trở nên nghèo khó
  rationale: Chỉ việc sa sút về hoàn cảnh kinh tế, phù hợp với ngữ cảnh của chương.
- source_word: אָחִיךָ
  choice: anh em của ngươi
  rationale: Giữ hình ảnh thân tộc của nguyên văn, ở đây chỉ một thành viên cùng cộng đồng giao ước.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: không còn đủ sức tự nuôi sống bên cạnh ngươi
  rationale: Diễn đạt rõ thành ngữ nguyên văn “tay người ấy suy yếu/chao đảo”, nghĩa là mất phương tiện hoặc khả năng tự duy trì cuộc sống; “bên cạnh ngươi” giữ sắc thái quan hệ-cộng đồng của עִמָּךְ.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: ngươi phải nâng đỡ người ấy
  rationale: Động từ Hiphil của חזק tại đây mang nghĩa trợ giúp, giữ cho người túng thiếu đứng vững; “nâng đỡ” vừa tự nhiên vừa giữ phần nào hình ảnh của nguyên ngữ.
- source_word: גֵּר
  choice: ngoại kiều cư trú
  rationale: Chỉ người không thuộc dân bản địa nhưng cư trú trong xã hội Israel và có địa vị pháp lý nhất định.
- source_word: וְתוֹשָׁב
  choice: kiều dân
  rationale: Chỉ người cư trú phụ thuộc hoặc kém ổn định hơn; cách gọi này phân biệt tương đối với גֵּר mà không dùng từ cổ.
- source_word: וָחַי עִמָּךְ
  choice: để người ấy được sống bên cạnh ngươi
  rationale: Hiểu waw trước וָחַי theo quan hệ mục đích/kết quả sau mệnh lệnh nâng đỡ, đồng thời lặp lại sắc thái cộng đồng của עִמָּךְ.
theological_decisions:
- issue: Phạm vi của “anh em của ngươi”
  choice: Giữ nguyên ngôn ngữ thân tộc “anh em của ngươi”.
  alternative: “người đồng bào Israel của ngươi” hoặc “người bà con của ngươi”
  rationale: Nguyên văn dùng אָחִיךָ và trong ngữ cảnh luật giao ước thường nói đến thành viên cùng cộng đồng; bản dịch không thay hình ảnh này bằng lời giải nghĩa.
- issue: Quan hệ cú pháp của גֵּר וְתוֹשָׁב
  choice: 'Gắn cụm từ với cách người nghèo được sống trong cộng đồng: “như một ngoại kiều cư trú hay một kiều dân”.'
  alternative: 'Hiểu là các đối tượng bổ sung của mệnh lệnh: “hãy nâng đỡ người ấy—cả ngoại kiều cư trú và kiều dân”.'
  rationale: Cú pháp Hê-bơ-rơ cô đọng và có thể được phân tích theo nhiều cách. Bản chính chọn cách nối tự nhiên với וָחַי עִמָּךְ nhưng ghi nhận cách hiểu khác trong chú thích.
- issue: Giá trị của וָחַי
  choice: “để người ấy được sống” theo nghĩa mục đích/kết quả.
  alternative: “và người ấy sẽ sống” như một mệnh đề tiếp nối độc lập hơn.
  rationale: Trong mạch văn, sự sống còn của người nghèo là kết quả được nhắm đến bởi việc nâng đỡ; tuy vậy cấu trúc Hê-bơ-rơ cũng cho phép cách dịch phối hợp trực tiếp hơn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “ngươi” để giữ lối xưng hô số ít trực tiếp của luật; dùng “anh em” theo nghĩa thân tộc-cộng đồng. Thành ngữ về “tay” được diễn ý trong chính văn và bảo lưu nguyên hình ảnh trong chú thích.
