  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: vi
  text: Nếu một người bán một căn nhà dùng để ở trong một thành có tường bao quanh, thì quyền chuộc lại nhà ấy vẫn có hiệu lực cho đến khi đủ một năm kể từ khi bán; quyền ấy kéo dài trọn một năm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các ngày”; trong thành ngữ pháp lý này, cụm từ chỉ khoảng thời gian một năm trọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי יִמְכֹּר
  choice: Nếu một người bán
  rationale: Đây là công thức mở đầu một trường hợp luật; “nếu” diễn đạt đúng tính điều kiện, còn “một người” tự nhiên trong tiếng Việt và vẫn giữ nghĩa đại diện của אִישׁ.
- source_word: בֵּית מוֹשַׁב
  choice: một căn nhà ở
  rationale: Cụm từ chỉ ngôi nhà dùng làm nơi cư trú; “nhà ở” vừa tự nhiên vừa phân biệt với các loại công trình khác.
- source_word: עִיר חוֹמָה
  choice: một thành có tường bao quanh
  rationale: Diễn đạt sát đặc điểm của thành là có tường thành, không tự ý mở rộng thành ý nghĩa quân sự của “thành kiên cố”.
- source_word: וְהָיְתָה גְּאֻלָּתוֹ
  choice: thì người ấy có quyền chuộc lại nhà đó
  rationale: Trong luật về tài sản, גְּאֻלָּה nói đến việc hoặc quyền mua chuộc lại tài sản đã bán. Cách diễn đạt này làm rõ chủ thể hành động và đối tượng mà không thay đổi nội dung pháp lý.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: cho đến khi tròn một năm kể từ ngày bán
  rationale: Cụm Hê-bơ-rơ chỉ lúc hoàn tất năm tính từ việc bán, tức một năm đầy đủ từ ngày giao dịch, không phải cuối năm dương lịch.
- source_word: יָמִים תִּהְיֶה גְאֻלָּתוֹ
  choice: quyền chuộc lại kéo dài một năm trọn
  rationale: יָמִים nghĩa đen là “các ngày” nhưng trong thành ngữ pháp lý ở đây biểu thị thời hạn một năm đầy đủ; bản dịch chuyển nghĩa thành ngữ vào câu chính để tiếng Việt rõ ràng.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng dễ hiểu; dùng “thành có tường bao quanh” và “quyền chuộc lại” để giữ rõ các khái niệm về địa điểm và quyền tài sản. Dấu chú thích [a] được đặt sau mệnh đề chứa cách chuyển nghĩa của thành ngữ יָמִים.
