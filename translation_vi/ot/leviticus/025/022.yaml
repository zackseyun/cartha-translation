  verdict: revise
  source_fidelity: 'Bản dịch theo sát cấu trúc và ý nghĩa của tiếng Hê-bơ-rơ: việc gieo vào năm thứ tám, ăn sản vật cũ đến năm thứ chín, và tiếp tục ăn sản vật cũ cho đến khi sản vật của năm thứ chín có mặt. Tuy nhiên, “gieo trồng” rộng hơn động từ זרע (“gieo”), còn “được thu về” diễn giải cụ thể việc thu hoạch thay cho cách nói trung tính “đến/có” của nguyên văn.'
