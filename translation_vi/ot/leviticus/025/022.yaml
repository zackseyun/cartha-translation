base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: vi
  text: Anh em sẽ gieo trong năm thứ tám và ăn nông sản cũ[a] cho đến năm thứ chín; cho đến khi có nông sản của năm ấy, anh em sẽ ăn nông sản cũ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ chỉ nói “cũ” ở cả hai chỗ; danh từ “nông sản” được hiểu theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: anh em sẽ gieo trồng
  rationale: Động từ Qal hoàn thành nối bằng ו mang nghĩa tương lai trong mạch luật lệ này. “Anh em” diễn đạt chủ thể số nhiều, còn “gieo trồng” là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: trong năm thứ tám
  rationale: Diễn đạt trực tiếp số thứ tự và thêm “trong” để câu tiếng Việt tự nhiên.
- source_word: וַאֲכַלְתֶּם
  choice: và ăn
  rationale: Hành động phối hợp với việc gieo trồng; ý tương lai được chi phối bởi “sẽ” ở đầu câu.
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: hoa lợi cũ
  rationale: תְּבוּאָה chỉ sản vật hoặc hoa lợi nông nghiệp, còn יָשָׁן là “cũ”, tức hoa lợi được giữ lại từ vụ trước. “Hoa lợi cũ” vừa rõ nghĩa vừa giữ được cách lặp của nguyên văn.
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: cho đến năm thứ chín
  rationale: Chuyển ngữ trực tiếp giới hạn thời gian.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: cho tới khi hoa lợi của năm ấy được thu về
  rationale: בּוֹא có nghĩa cơ bản là “đến”; trong ngữ cảnh nông nghiệp, “được thu về” diễn đạt tự nhiên lúc sản vật của năm thứ chín trở nên sẵn có. Đại từ hậu tố giống cái được hiểu là chỉ năm thứ chín vừa nêu.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: anh em vẫn sẽ ăn hoa lợi cũ
  rationale: “Vẫn” làm rõ sự tiếp diễn cho đến khi hoa lợi mới được thu về; lặp lại “hoa lợi cũ” để bảo toàn sự nhấn mạnh của nguyên văn.
