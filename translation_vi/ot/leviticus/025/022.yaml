  terminology: Dùng “nông sản” phù hợp với תבואה trong ngữ cảnh nông nghiệp. Cách lặp “nông sản cũ” duy trì sự lặp lại của יָשָׁן; chú thích giải thích chính xác rằng nguyên văn chỉ dùng tính từ “cũ”.
  issues:
