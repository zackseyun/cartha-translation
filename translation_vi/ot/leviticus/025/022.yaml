  to: Anh em sẽ gieo trong năm thứ tám và ăn nông sản cũ[a] cho đến năm thứ chín; cho đến khi có nông sản của năm ấy, anh em sẽ ăn nông sản cũ.
  rationale: Điều chỉnh tối thiểu để dùng động từ “gieo” sát với tiếng Hê-bơ-rơ, dùng “nông sản” rõ nghĩa trong tiếng Việt hiện đại, và tránh diễn giải “đến” thành hành động thu hoạch cụ thể. Câu vẫn giữ sự lặp lại của “cũ” và quan hệ đại từ “năm ấy” với năm thứ chín.
