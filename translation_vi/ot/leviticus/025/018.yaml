source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: vi
  text: Vậy, các ngươi phải thi hành các luật lệ của Ta và tuân giữ các phán quyết của Ta[a], phải làm theo những điều ấy[b]; rồi các ngươi sẽ sống yên ổn trong xứ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng hai thuật ngữ pháp lý khác nhau, חֻקִּים và מִשְׁפָּטִים; cũng có thể dịch là “các quy định của Ta … các luật định của Ta.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ lặp lại động từ “làm”: sát nghĩa là “các ngươi phải làm các luật lệ của Ta … phải tuân giữ các phán quyết của Ta và làm những điều ấy.”'
    reason: lexical_alternative
  - marker: c
    text: Tức là sống an toàn trong vùng đất đã được hứa ban cho Israel.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: các luật lệ của Ta
  rationale: “Luật lệ” diễn đạt những quy định đã được ấn định trong giao ước, đồng thời có thể phân biệt tự nhiên với מִשְׁפָּטַי.
- source_word: מִשְׁפָּטַי
  choice: các phán quyết của Ta
  rationale: “Phán quyết” giữ sắc thái pháp lý của מִשְׁפָּטִים và không đồng nhất thuật ngữ này với חֻקִּים.
- source_word: תִּשְׁמְרוּ
  choice: tuân giữ
  rationale: Trong ngữ cảnh luật pháp và giao ước, שׁמר không chỉ là canh giữ mà còn là cẩn thận vâng theo; “tuân giữ” truyền đạt cả hai sắc thái ấy.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: thi hành ... phải làm theo những điều ấy
  rationale: Bản dịch giữ cấu trúc lặp lại của động từ עשה nhưng dùng hai cách diễn đạt tự nhiên trong tiếng Việt, qua đó vẫn nhấn mạnh việc thực sự vâng làm.
- source_word: וִישַׁבְתֶּם
  choice: các ngươi sẽ sống
  rationale: Trong bối cảnh cư ngụ lâu dài tại một vùng đất, ישׁב có nghĩa là ở hay sinh sống; “sống” tự nhiên hơn “cư ngụ” trong tiếng Việt hiện đại.
- source_word: הָאָרֶץ
  choice: trong xứ
  rationale: Ở đây הָאָרֶץ chỉ vùng đất được ban cho Israel. “Xứ” giữ được sắc thái lãnh thổ giao ước và hợp với cách nói “sống trong xứ”.
- source_word: לָבֶטַח
  choice: yên ổn
  rationale: בֶּטַח nói đến tình trạng an toàn, không bị đe dọa. “Sống yên ổn” là cách diễn đạt tự nhiên và đúng nghĩa trong tiếng Việt.
theological_decisions:
- issue: Mối liên hệ giữa sự vâng lời và việc sống yên ổn trong xứ
  choice: 'Câu này trình bày hệ quả trong khuôn khổ giao ước dành cho Israel: họ tuân giữ các luật lệ và phán quyết của Đức Chúa Trời thì sẽ được sống yên ổn trong xứ.'
  alternative: Hiểu đây là lời hứa phổ quát rằng mọi tín hữu trong mọi hoàn cảnh đều sẽ được an toàn hoặc thịnh vượng nếu vâng lời.
  rationale: Nguyên văn gắn trực tiếp sự vâng giữ với việc cư ngụ an toàn בָאָרֶץ, tức trong vùng đất đang được bàn đến. Bản dịch giữ nguyên bối cảnh về đất giao ước, không mở rộng lời hứa vượt quá phạm vi của câu.
translation_notes:
  register: 'Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “các ngươi” phản ánh lời phán trực tiếp với cộng đồng Israel mà không thêm sắc thái thân thuộc không có trong nguyên văn. Nhịp câu giữ ba ý nối tiếp của tiếng Hê-bơ-rơ: thi hành luật lệ, tuân giữ và làm theo các phán quyết, rồi sống yên ổn trong xứ.'
