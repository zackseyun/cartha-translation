id: LEV.25.17
reference: Leviticus 25:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת עֲמִית֔/וֹ וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: vi
  text: Không ai trong các ngươi được đối xử bất công với người đồng bào mình[a]; nhưng ngươi phải kính sợ Đức Chúa Trời của ngươi, vì Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lợi dụng” hoặc “làm thiệt hại”. Động từ Hê-bơ-rơ có thể chỉ việc chiếm lợi thế bất công đối với người khác trong các quan hệ xã hội hoặc giao dịch kinh tế.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: áp bức
  rationale: Trong bối cảnh luật pháp và giao dịch kinh tế của chương này, động từ ינה ở Hifil chỉ việc đối xử bất công hoặc lợi dụng người khác. “Áp bức” giữ được sức nặng đạo đức, còn chú thích nêu các sắc thái gần nghĩa.
- source_word: אִישׁ
  choice: ai
  rationale: אִישׁ có dạng giống đực số ít nhưng mang ý nghĩa phân phối trong lệnh cấm. Cấu trúc tiếng Việt “không ai trong các ngươi” truyền đạt tự nhiên rằng lệnh áp dụng cho từng người mà không làm thay đổi phạm vi quy định.
- source_word: עֲמִיתוֹ
  choice: người đồng胞 mình
  rationale: עָמִית chỉ người cùng cộng đồng hay người ngang hàng trong các văn bản luật pháp. Cách diễn đạt này giữ sắc thái thành viên cùng cộng đồng giao ước.
- source_word: וְיָרֵאתָ
  choice: nhưng ngươi phải kính sợ
  rationale: 'וְ về hình thức là “và”, nhưng ở đây hai mệnh đề có quan hệ tương phản: thay vì áp bức người khác, người nghe phải kính sợ Đức Chúa Trời. “Nhưng” thể hiện rõ quan hệ ấy trong tiếng Việt.'
- source_word: מֵאֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Sau ירא, giới từ מִן đánh dấu đối tượng của sự kính sợ; tiếng Việt diễn đạt tự nhiên là “kính sợ Đức Chúa Trời của ngươi”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Hậu tố số nhiều hướng đến toàn thể cộng đồng; “của các ngươi” bảo toàn sự chuyển đổi từ lời nói với từng cá nhân sang lời xác nhận dành cho cả cộng đồng.
- source_word: כִּי
  choice: vì
  rationale: '“Vì” truyền đạt tự nhiên quan hệ nguyên nhân: căn cứ của mệnh lệnh là căn tính và thẩm quyền của Yahweh.'
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” giữ đây là danh riêng, không biến nó thành tước hiệu.
- issue: Ngôn ngữ giống đực mang tính đại diện trong אִישׁ
  choice: Không ai trong các ngươi
  alternative: Không người nam nào trong các ngươi
  rationale: Trong câu luật này, אִישׁ có chức năng phân phối, nghĩa là từng người trong cộng đồng. Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp; “không ai” bảo toàn ý nghĩa và tránh hàm ý không có trong văn cảnh rằng phụ nữ được miễn trừ.
- issue: Sự chuyển đổi số ở đại từ xưng hô
  choice: “các ngươi” ở lệnh cấm, “ngươi” ở lệnh kính sợ, rồi “các ngươi” trong công thức kết
  alternative: đồng nhất tất cả thành số nhiều
  rationale: Nguyên văn chuyển từ תוֹנוּ số nhiều sang וְיָרֵאתָ và אֱלֹהֶיךָ số ít, rồi trở lại אֱלֹהֵיכֶם số nhiều. Bản dịch giữ sự chuyển đổi này để phản ánh lời truyền cho cộng đồng nhưng quy trách nhiệm trực tiếp cho từng cá nhân.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “ngươi/các ngươi” để bảo toàn sự phân biệt số ít–số nhiều trong lời phán trực tiếp. Dùng “người đồng胞 mình” cho thành viên cùng cộng đồng; danh Yahweh được giữ nguyên.
