revisions:
- from: Không ai trong các ngươi được áp bức người đồng胞 mình[a]; nhưng ngươi phải kính sợ Đức Chúa Trời của ngươi, vì Ta là Yahweh, Đức Chúa Trời của các ngươi.
  to: Không ai trong các ngươi được đối xử bất công với người đồng bào mình[a]; nhưng ngươi phải kính sợ Đức Chúa Trời của ngươi, vì Ta là Yahweh, Đức Chúa Trời của các ngươi.
  rationale: Sửa lỗi ký tự «đồng胞» thành «đồng bào» và thay «áp bức» bằng «đối xử bất công» để phản ánh chính xác hơn phạm vi ngữ nghĩa của תוֹנוּ trong điều luật này, đồng thời giữ nguyên giọng điệu, các chuyển đổi số ít/số nhiều, danh Yahweh, và ý nghĩa của bản thảo.
