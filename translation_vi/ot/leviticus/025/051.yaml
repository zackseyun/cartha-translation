  source_fidelity: Bản nháp truyền đạt đúng điều kiện “còn nhiều năm”, nguyên tắc tính theo số năm, và nghĩa tài chính của גְּאֻלָּתוֹ. Tuy nhiên, “tính từ số tiền đã được trả để mua mình” có thể bị hiểu là khoản tiền được trích ra từ nguồn tiền ấy, hoặc làm mờ việc số tiền mua ban đầu là cơ sở tính toán.
