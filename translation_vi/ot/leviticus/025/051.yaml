base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: vi
  text: Nếu vẫn còn nhiều năm, thì theo số năm ấy, người đó phải hoàn trả khoản tiền để chuộc mình, dựa trên số tiền đã mua người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải hoàn trả khoản chuộc mình.” Danh từ Hê-bơ-rơ có thể chỉ hành động chuộc, nhưng ở đây có lẽ chỉ khoản tiền phải hoàn trả để được chuộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עוֹד רַבּוֹת בַּשָּׁנִים
  choice: Nếu vẫn còn nhiều năm
  rationale: Diễn đạt tự nhiên điều kiện pháp lý và ý ngầm rằng còn nhiều năm cho đến năm hân hỉ.
- source_word: לְפִיהֶן
  choice: theo số năm ấy
  rationale: Thành ngữ theo nghĩa đen là “theo miệng của chúng”, ở đây chỉ tỷ lệ tương ứng với số năm còn lại.
- source_word: יָשִׁיב
  choice: phải hoàn trả
  rationale: Thể Hiphil của שוב trong bối cảnh tài chính mang nghĩa trả lại hay hoàn lại; “phải” thể hiện quy định pháp lý.
- source_word: גְּאֻלָּתוֹ
  choice: giá chuộc mình
  rationale: Danh từ có thể chỉ sự chuộc hoặc khoản tiền chuộc; văn cảnh phép tính tài chính nghiêng về khoản tiền cần trả để được chuộc.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: tính từ số tiền đã được trả để mua mình
  rationale: Chuyển đạt rõ và tự nhiên cụm “từ tiền mua người ấy”, tức lấy giá mua ban đầu làm cơ sở tính khoản hoàn trả.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng dễ hiểu; dùng “người đó” và “mình” để tránh lối diễn đạt cổ, đồng thời giữ quan hệ sở hữu của nguyên văn. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan đến “giá chuộc”.
