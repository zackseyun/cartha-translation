  terminology: “Khoản tiền để chuộc mình” diễn đạt rõ giá trị cụ thể mà danh từ גְּאֻלָּה có thể chỉ trong ngữ cảnh này, tránh sắc thái thần học không cần thiết của “giá chuộc”.
