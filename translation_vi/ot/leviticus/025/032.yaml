  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: vi
  text: Còn về các thành của người Lê-vi, những ngôi nhà trong các thành thuộc sản nghiệp của họ thì người Lê-vi luôn có quyền chuộc lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát hơn: “Quyền chuộc lại vĩnh viễn sẽ thuộc về người Lê-vi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי
  choice: Còn các thành
  rationale: Liên từ וְ cùng danh từ mở sang một trường hợp mới trong luật; “Còn” thể hiện tự nhiên sự chuyển đề tài.
- source_word: הַ/לְוִיִּם
  choice: của người Lê-vi
  rationale: Quan hệ cấu tạo với עָרֵי biểu thị sự sở hữu hoặc liên hệ; cách nói này ngắn gọn và tự nhiên.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: tức những ngôi nhà trong các thành thuộc sản nghiệp của họ
  rationale: Cụm Hê-bơ-rơ sát nghĩa là “những ngôi nhà của các thành thuộc sản nghiệp của họ”. Thêm “tức” làm rõ rằng điều khoản chuộc áp dụng cho nhà trong các thành vừa nêu, còn “sản nghiệp” giữ sắc thái pháp lý và thừa kế của אֲחֻזָּה.
- source_word: גְּאֻלַּת עוֹלָם
  choice: quyền chuộc lại vĩnh viễn
  rationale: Danh từ גְּאֻלָּה trong ngữ cảnh luật pháp chỉ việc hoặc quyền chuộc lại tài sản; עוֹלָם diễn tả hiệu lực lâu dài, không bị chấm dứt.
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: người Lê-vi có quyền
  rationale: Mệnh đề theo nghĩa đen là “sẽ thuộc về người Lê-vi”; chuyển thành “có quyền” truyền đạt rõ hiệu lực pháp lý mà không biến điều khoản thành một mệnh lệnh phải thực hiện.
theological_decisions:
- issue: Hiệu lực pháp lý của điều khoản chuộc nhà trong các thành Lê-vi
  choice: Người Lê-vi luôn có quyền chuộc lại những ngôi nhà ấy.
  alternative: “Sự chuộc lại vĩnh viễn sẽ thuộc về người Lê-vi.”
  rationale: Cấu trúc danh từ גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם thiết lập một quyền chuộc lâu dài. Bản chính diễn đạt hiệu lực ấy bằng tiếng Việt tự nhiên, còn chú thích bảo tồn cấu trúc trang trọng và độ khái quát của nguyên văn.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. Dùng “sản nghiệp” để giữ sắc thái đất đai được nắm giữ theo quyền thừa kế; “quyền chuộc lại” giúp độc giả hiểu rõ lực pháp lý của danh từ Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
