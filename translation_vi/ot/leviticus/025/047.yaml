  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: vi
  text: Nếu một người ngoại kiều đang cư trú giữa anh em trở nên khá giả, còn một người anh em của anh em, ở bên người ấy, trở nên nghèo khó và bán mình cho người ngoại kiều đang cư trú giữa anh em, hoặc cho một thành viên trong thị tộc của người ngoại kiều,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho một gốc hoặc nhánh của gia đình một người ngoại kiều.” Cụm từ Hê-bơ-rơ này khó hiểu; bản văn chính diễn đạt theo nghĩa có khả năng nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: trở nên khá giả
  rationale: Thành ngữ theo nghĩa đen là “tay đạt tới”, chỉ việc có đủ khả năng hoặc nguồn lực tài chính. “Trở nên khá giả” truyền đạt tự nhiên sự gia tăng về năng lực kinh tế.
- source_word: גֵּר וְתוֹשָׁב
  choice: một người ngoại kiều cư ngụ
  rationale: Hai từ cùng mô tả một người không phải dân bản xứ nhưng đang sinh sống trong cộng đồng. Cách dịch này giữ cả địa vị ngoại kiều lẫn tính chất cư trú mà không tạo cảm giác đây là hai hạng người riêng biệt.
- source_word: וּמָךְ
  choice: trở nên nghèo khó
  rationale: Động từ diễn tả sự sa sút dẫn đến nghèo túng; cách dịch này rõ ràng và tự nhiên.
- source_word: אָחִיךָ
  choice: người anh em của anh em
  rationale: Giữ hình ảnh thân tộc của nguyên văn và sức nặng đạo đức trong luật giao ước; theo ngữ cảnh, người này là một người đồng bào Israel.
- source_word: עִמּוֹ
  choice: ở bên người ấy
  rationale: Giữ tương quan được nguyên văn nêu giữa người Israel nghèo và người ngoại kiều khá giả, đồng thời không xác định quá mức đó là sự gần gũi về địa lý hay hoàn cảnh.
- source_word: וְנִמְכַּר
  choice: bán mình
  rationale: 'Dạng Niphal có thể hiểu thụ động là “bị bán”, nhưng trong bối cảnh luật về cảnh nghèo mắc nợ, nó mang nghĩa phản thân tự nhiên: người ấy bán sức phục vụ của chính mình.'
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: cho một thành viên trong thị tộc của người ngoại kiều ấy
  rationale: עֵקֶר là từ khó, có thể gợi “gốc”, “nhánh” hay một người thuộc nhóm gia đình. Cách dịch chính truyền đạt nghĩa có khả năng nhất bằng tiếng Việt tự nhiên, còn chú thích bảo lưu hình ảnh từ nguyên.
theological_decisions:
- issue: Ngôn ngữ thân tộc dành cho người Israel trong luật xã hội
  choice: người anh em của anh em
  alternative: người đồng bào Israel của anh em
  rationale: Giữ “anh em” bảo tồn tính chất gia đình và sức mạnh luân lý của nguyên văn, thay vì chuyển thành một nhãn gọi thuần túy dân sự.
- issue: Tính chất của việc bán được nói đến trong וְנִמְכַּר
  choice: bán mình
  alternative: bị bán
  rationale: Ngữ cảnh nói về người nghèo bước vào tình trạng phục dịch do khó khăn kinh tế. “Bán mình” diễn đạt nghĩa phản thân có thể hàm chứa trong dạng động từ, nhưng không thêm một diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” làm đại từ số nhiều bao quát cộng đồng, phù hợp lời luật truyền cho Israel; giữ “người anh em” để bảo tồn hình ảnh thân tộc. Dấu phẩy cuối câu phản ánh câu điều kiện còn tiếp tục sang câu kế tiếp.
