revisions:
- from: Nếu một người ngoại kiều cư ngụ giữa anh em trở nên khá giả, còn người anh em của anh em ở bên người ấy trở nên nghèo khó và bán mình cho người ngoại kiều cư ngụ giữa anh em, hoặc cho một thành viên trong thị tộc của người ngoại kiều ấy,[a]
  to: Nếu một người ngoại kiều đang cư trú giữa anh em trở nên khá giả, còn một người anh em của anh em, ở bên người ấy, trở nên nghèo khó và bán mình cho người ngoại kiều đang cư trú giữa anh em, hoặc cho một thành viên trong thị tộc của người ngoại kiều,[a]
