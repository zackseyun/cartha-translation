id: LEV.25.26
reference: Leviticus 25:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: vi
  text: Nhưng nếu một người không có người chuộc lại[a], mà chính người ấy có đủ khả năng và tìm được đủ cho việc chuộc lại của mình[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người bà con chuộc lại.” Từ Hê-bơ-rơ גֹּאֵל thường chỉ một người họ hàng gần có quyền hoặc bổn phận chuộc lại tài sản của gia đình.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “tay người ấy đạt tới, và người ấy tìm thấy đủ cho việc chuộc lại của mình.” Đây là thành ngữ nói rằng người ấy có đủ khả năng tài chính để chuộc lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: Nhưng nếu một người
  rationale: Cụm này mở đầu một trường hợp pháp lý có điều kiện. “Nhưng” thể hiện sự chuyển sang tình huống đối lập với câu trước, còn “một người” diễn đạt tự nhiên danh từ số ít אִישׁ.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: không có người chuộc lại
  rationale: גֹּאֵל chỉ người có quyền hoặc bổn phận chuộc lại tài sản của họ hàng. Cách dịch ngắn gọn trong chính văn giữ được chức năng pháp lý; quan hệ thân tộc được nêu trong chú thích.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: mà về sau chính người ấy có đủ khả năng
  rationale: Nghĩa đen là “tay người ấy đạt tới”, một thành ngữ nói rằng khả năng tài chính của người ấy đã trở nên đầy đủ. “Về sau” làm rõ diễn tiến hàm chứa trong ngữ cảnh mà không thay đổi điều kiện pháp lý.
- source_word: וּמָצָא כְּדֵי
  choice: và kiếm được số tiền cần thiết
  rationale: מָצָא cơ bản là “tìm thấy”, nhưng trong ngữ cảnh kinh tế có thể chỉ việc có được hoặc kiếm được. כְּדֵי diễn tả mức đủ; “số tiền cần thiết” truyền đạt rõ ý trong luật chuộc đất.
- source_word: גְאֻלָּתוֹ
  choice: để chuộc lại phần đất của mình
  rationale: Danh từ גְאֻלָּה nói đến việc chuộc lại; trong mạch luật này, đối tượng là phần đất đã bán. Cách diễn đạt này làm rõ sở chỉ của hậu tố giống đực số ít theo ngữ cảnh, đồng thời chú thích bảo lưu dạng diễn đạt sát chữ hơn.
theological_decisions:
- issue: Phạm vi ý nghĩa của גֹּאֵל
  choice: người chuộc lại
  alternative: người bà con có trách nhiệm chuộc lại
  rationale: Không đưa vào chính văn một công thức thần học rộng hơn nghĩa pháp lý-thân tộc của câu; chú thích giải thích đầy đủ sắc thái họ hàng.
- issue: Đối tượng của việc chuộc lại trong גְאֻלָּתוֹ
  choice: phần đất của mình
  alternative: việc chuộc lại của mình
  rationale: Ngữ cảnh trực tiếp là tài sản đất đai đã bán. Việc nêu “phần đất” giúp tiếng Việt rõ nghĩa mà không biến hành động này thành một khái niệm cứu chuộc thuộc linh.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại, dễ hiểu. Câu được giữ ở dạng chưa kết thúc bằng dấu phẩy vì mệnh đề pháp lý tiếp tục sang câu kế tiếp. Các từ “khả năng”, “số tiền” và “phần đất” diễn đạt rõ nội dung kinh tế của ngữ cảnh, trong khi chú thích bảo lưu hình ảnh thành ngữ Hê-bơ-rơ và sắc thái thân tộc của גֹּאֵל.
