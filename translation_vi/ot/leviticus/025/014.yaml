source:
  edition: WLC
  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: vi
  text: Nếu anh em bán một món gì cho người đồng bào mình, hoặc mua từ tay người đồng bào mình, thì không ai được làm cho người anh em mình chịu thiệt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đối xử bất công với người anh em mình” hoặc “lợi dụng người anh em mình”; động từ này có thể chỉ việc khiến người khác chịu thiệt, nhất là trong mua bán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Trong văn luật, וְכִי mở đầu một trường hợp có điều kiện. Tiếng Việt không cần dịch riêng liên từ ו để câu được tự nhiên.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: anh em bán một món gì
  rationale: Động từ ở ngôi thứ hai số nhiều chỉ cộng đồng được ngỏ lời; מִמְכָּר có thể là vật được bán hoặc giao dịch bán, nên “một món gì” diễn đạt tự nhiên mà không xác định quá mức.
- source_word: לַעֲמִיתֶךָ / עֲמִיתֶךָ
  choice: cho người đồng bào mình / người đồng bào mình
  rationale: עָמִית chỉ một thành viên cùng cộng đồng trong bối cảnh luật pháp. “Người đồng bào” giữ được ý nghĩa cộng đồng rõ hơn “người lân cận” và được dịch nhất quán ở cả hai lần.
- source_word: אוֹ קָנֹה
  choice: hoặc mua
  rationale: Dạng nguyên mẫu tuyệt đối קָנֹה phối hợp với động từ hữu hạn trước đó và mang nghĩa hành động “mua” trong vế song song.
- source_word: מִיַּד
  choice: từ tay
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ “từ tay”, đồng thời vẫn dễ hiểu trong tiếng Việt như việc mua trực tiếp từ một người.
- source_word: אַל תּוֹנוּ
  choice: không ai được làm thiệt hại
  rationale: Đây là lời cấm. Trong bối cảnh mua bán, ינה nói đến việc đối xử bất công hoặc khiến người khác chịu thiệt; “làm thiệt hại” vừa tự nhiên vừa giữ được phạm vi nghĩa mà không giới hạn vào một thủ đoạn cụ thể.
- source_word: אִישׁ אֶת אָחִיו
  choice: không ai ... người anh em của mình
  rationale: אִישׁ có chức năng phân phối trong lời cấm, còn אָחִיו nêu tình liên đới giữa các thành viên cộng đồng. Cách dịch này giữ hình ảnh “anh em” nhưng diễn đạt rõ trong tiếng Việt.
theological_decisions:
- issue: Phạm vi cộng đồng của עָמִית và אָחִיו
  choice: Giữ cả “người đồng bào” và “người anh em” trong câu chính
  alternative: Dịch cả hai là “người khác” hoặc “lẫn nhau”
  rationale: Hai từ Hê-bơ-rơ khác nhau nhưng cùng đặt điều luật trong quan hệ cộng đồng. Giữ cách gọi riêng của từng từ bảo toàn sắc thái liên đới mà không mở rộng hoặc thu hẹp phạm vi theo một lập trường giáo phái.
- issue: Sắc thái của ינה trong giao dịch
  choice: “làm thiệt hại”, kèm chú thích về việc lợi dụng bất công
  alternative: “áp bức” hoặc “lừa gạt”
  rationale: “Áp bức” có thể quá rộng, còn “lừa gạt” thu hẹp động từ vào hành vi gian dối. Bản dịch chính giữ nghĩa bao quát trong ngữ cảnh kinh tế và chú thích nêu rõ sắc thái có thể có.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Anh em” ở đầu câu là đại từ số nhiều chỉ cộng đồng được ngỏ lời; “người anh em của mình” ở cuối câu giữ danh từ quan hệ của nguyên văn. Dấu chú thích [a] được đặt ngay sau mệnh đề chứa động từ cần giải thích.
