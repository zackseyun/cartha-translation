  to: Nếu anh em bán một món gì cho người đồng bào mình, hoặc mua từ tay người đồng bào mình, thì không ai được làm cho người anh em mình chịu thiệt.[a]
  rationale: Chỉ điều chỉnh cách diễn đạt của mệnh đề cấm để tiếng Việt tự nhiên hơn. “Làm cho người anh em mình chịu thiệt” vẫn bao quát việc đối xử bất công hoặc trục lợi trong mua bán, không thu hẹp động từ ינה vào lừa dối hay áp bức nói chung.
