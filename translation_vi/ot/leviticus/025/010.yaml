id: LEV.25.10
reference: Leviticus 25:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: vi
  text: Các ngươi phải thánh hiến năm thứ năm mươi và công bố tự do trong xứ cho toàn thể cư dân. Năm ấy sẽ là Năm Hân Hỉ[a] cho các ngươi; mỗi người phải trở về sản nghiệp[b] của mình, và mỗi người phải trở về với gia tộc[c] của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Năm Hân Hỉ” dịch từ tiếng Hê-bơ-rơ yô-vên; trong ngữ cảnh này, từ ấy chỉ năm đặc biệt thứ năm mươi, không chỉ tù và dùng để loan báo năm đó.
    reason: lexical_alternative
  - marker: b
    text: Hay “phần sở hữu”; từ này đặc biệt chỉ phần đất hoặc tài sản thừa kế của gia đình.
    reason: lexical_alternative
  - marker: c
    text: Hay “thị tộc” hoặc “đại gia đình”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: phải biệt riêng ... ra thánh
  rationale: Diễn đạt nghĩa Piel của קדשׁ là biệt riêng hoặc hiến thánh, đồng thời dùng cách nói tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: năm thứ năm mươi
  rationale: Chuyển thành cấu trúc số thứ tự tự nhiên trong tiếng Việt mà không làm mất nghĩa.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: công bố sự tự do
  rationale: דרור chỉ sự tự do hoặc phóng thích được chính thức công bố trong Năm Hân Hỉ; “sự tự do” giữ được phạm vi nghĩa rộng của từ.
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: trong xứ cho toàn thể cư dân
  rationale: Giữ nghĩa địa điểm của ב và diễn đạt יֹשְׁבֶיהָ bằng từ “cư dân” ngắn gọn, tự nhiên.
- source_word: יוֹבֵל
  choice: Năm Hân Hỉ
  rationale: Trong ngữ cảnh Lê-vi Ký 25, יוֹבֵל là tên gọi kỹ thuật của thiết chế năm thứ năm mươi, không chỉ chiếc tù và dùng để loan báo.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: phải trở về ... phải trở về
  rationale: Lặp lại cùng một động từ để bảo toàn sự lặp có chủ ý và chủ đề phục hồi của nguyên văn.
- source_word: אִישׁ
  choice: mỗi người trong các ngươi / mỗi người
  rationale: אִישׁ có hình thức số ít giống đực nhưng mang lực phân phối; cách dịch này phản ánh từng cá nhân thuộc cộng đồng được trực tiếp ngỏ lời mà không gượng ép trong tiếng Việt.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: về sản nghiệp của mình
  rationale: אֲחֻזָּה trong luật đất đai này chủ yếu là phần đất sở hữu được truyền trong gia đình; “sản nghiệp” ngắn gọn và giữ sắc thái thừa kế.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: về gia tộc của mình
  rationale: מִשְׁפָּחָה có thể chỉ gia đình mở rộng hay thị tộc; “gia tộc” phù hợp hơn “gia đình” với đơn vị thân tộc-xã hội trong bối cảnh này.
theological_decisions:
- issue: Ý nghĩa kỹ thuật của יוֹבֵל
  choice: Năm Hân Hỉ
  alternative: năm toàn xá; tiếng tù và
  rationale: Ngữ cảnh xác định đây là thiết chế của năm thứ năm mươi. Cách dịch không thu hẹp từ thành chiếc tù và, cũng không đưa thêm một cách giải thích thần học về sự xóa tội.
- issue: Lực phân phối của אִישׁ trong văn bản luật
  choice: mỗi người trong các ngươi
  alternative: mỗi người nam; ai nấy
  rationale: Cách dịch giữ ý từng cá nhân trong cộng đồng được ngỏ lời, phù hợp với các động từ ngôi hai số nhiều và không quyết định quá mức phạm vi giới tính của quy định.
- issue: Phạm vi phục hồi của אֲחֻזָּה và מִשְׁפָּחָה
  choice: sản nghiệp và gia tộc
  alternative: tài sản và gia đình
  rationale: Hai từ được phân biệt để giữ cả chiều kích phục hồi đất thừa kế lẫn việc trở lại đơn vị thân tộc, không hòa nhập chúng thành một ý chung.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “các ngươi” để giữ lời truyền trực tiếp ở ngôi thứ hai số nhiều; dùng “phải” cho sắc thái mệnh lệnh. Các thuật ngữ “Năm Hân Hỉ”, “sản nghiệp” và “gia tộc” được chọn vì tính chính xác theo bối cảnh, với chú thích hỗ trợ độc giả hiện đại.
