revisions:
- from: Các ngươi phải biệt riêng năm thứ năm mươi ra thánh và công bố sự tự do trong xứ cho toàn thể cư dân. Năm ấy sẽ là Năm Hân Hỉ[a] cho các ngươi; mỗi người trong các ngươi phải trở về sản nghiệp[b] của mình, và mỗi người phải trở về gia tộc[c] của mình.
  to: Các ngươi phải thánh hiến năm thứ năm mươi và công bố tự do trong xứ cho toàn thể cư dân. Năm ấy sẽ là Năm Hân Hỉ[a] cho các ngươi; mỗi người phải trở về sản nghiệp[b] của mình, và mỗi người phải trở về với gia tộc[c] của mình.
  rationale: Chỉ sửa những chỗ cần thiết cho tính tự nhiên và chính xác của tiếng Việt. “Thánh hiến” thay cho cấu trúc không chuẩn “biệt riêng ... ra thánh”; “công bố tự do” giảm danh từ hóa. Các ý then chốt, thuật ngữ kỹ thuật, trật tự ý, và sự lặp lại “trở về” của nguyên văn đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
