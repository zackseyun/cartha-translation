  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: vi
  text: Người ấy sẽ ở với ngươi như một người làm thuê, như một người ngoại kiều cư trú; người ấy sẽ làm việc cho ngươi cho đến năm hân hỉ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: như người làm thuê
  rationale: שָׂכִיר chỉ người lao động được thuê và nhận công; cách dịch này tự nhiên, hiện đại và phân biệt địa vị của người ấy với nô lệ.
- source_word: כְּתוֹשָׁב
  choice: như ngoại kiều cư trú
  rationale: תּוֹשָׁב chỉ người không phải dân bản xứ nhưng cư trú giữa cộng đồng; cụm từ này giữ được sắc thái xã hội-pháp lý của nguyên ngữ.
- source_word: יִהְיֶה עִמָּךְ
  choice: sẽ ở với ngươi
  rationale: Dịch trực tiếp ý 'ở/có mặt cùng ngươi'; hai giới từ so sánh כְּ đã được thể hiện bằng hai lần 'như'.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: cho đến năm Toàn Xá
  rationale: Đây là thuật ngữ pháp lý chỉ năm giải phóng và hoàn trả trong Lê-vi Ký 25; 'năm Toàn Xá' là cách gọi trang trọng, dễ nhận biết trong tiếng Việt.
- source_word: יַעֲבֹד עִמָּךְ
  choice: sẽ làm việc với ngươi
  rationale: Trong ngữ cảnh này עבד mang nghĩa làm việc/phục vụ; 'làm việc với ngươi' giữ giới từ עִם ('với') và tránh gợi rằng người ấy bị đối xử như nô lệ.
theological_decisions:
- issue: Địa vị của người Y-sơ-ra-ên mắc nợ trong thời gian lao dịch
  choice: Diễn đạt người ấy như người làm thuê và ngoại kiều cư trú, không như nô lệ.
  alternative: Dịch עבד là 'hầu việc ngươi', có thể tạo sắc thái lệ thuộc mạnh hơn.
  rationale: Ngữ cảnh gần (cc. 39–43) minh nhiên cấm bắt người ấy phục dịch như nô lệ và quy định thời gian lao động là tạm thời; bản dịch giữ sự phân biệt ấy mà không thêm một kết luận thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ 'ngươi' để phù hợp lối diễn đạt luật giao ước, đồng thời dùng 'người ấy' thay cho đại từ dễ gây mơ hồ. Không thêm chú thích vì các lựa chọn chính có thể được thể hiện rõ ngay trong câu.
