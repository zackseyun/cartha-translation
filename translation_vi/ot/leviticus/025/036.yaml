revisions:
- from: Đừng lấy tiền lãi hay phần tăng thêm từ người ấy[a], nhưng hãy kính sợ Đức Chúa Trời của ngươi, và hãy để anh em ngươi sống bên ngươi.[b]
  to: Đừng lấy tiền lãi hay khoản tăng thêm từ người ấy[a], nhưng hãy kính sợ Đức Chúa Trời của ngươi, và hãy để người anh em của ngươi[b] sống cùng ngươi.
  rationale: Chỉnh sửa ở mức thấp để cải thiện tính tự nhiên và làm rõ số ít của אָחִיךָ. Cấu trúc “và hãy để ... sống cùng ngươi” vẫn bảo toàn liên từ וְ và sắc thái mệnh lệnh/jussive của וְחֵי, không áp đặt quan hệ mục đích. Các chú thích được giữ nội dung cần thiết và neo sát vào từ ngữ được giải thích.
  reviewer_model: gpt-5.6-terra
