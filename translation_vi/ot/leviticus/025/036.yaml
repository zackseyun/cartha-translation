source:
  edition: WLC
  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: vi
  text: Đừng lấy tiền lãi hay khoản tăng thêm từ người ấy[a], nhưng hãy kính sợ Đức Chúa Trời của ngươi, và hãy để người anh em của ngươi[b] sống cùng ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Khoản tăng thêm” cũng có thể dịch là “khoản lời” hoặc “lợi tức”; tiếng Hê-bơ-rơ đặt cạnh nhau hai từ gần nghĩa, chỉ tiền lãi hoặc phần gia tăng thu từ người vay nghèo.
    reason: lexical_alternative
  - marker: b
    text: “Người anh em của ngươi” ở đây chỉ một người cùng thuộc cộng đồng giao ước, không nhất thiết là anh em ruột.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: Đừng lấy
  rationale: אַל đi với thể chưa hoàn thành tạo mệnh lệnh cấm; “Đừng lấy” tự nhiên và giữ nguyên sức trực tiếp của câu lệnh.
- source_word: מֵאִתּוֹ
  choice: từ người ấy
  rationale: Cụm giới từ chỉ người đồng bào túng thiếu là đối tượng mà chủ nợ không được thu lợi; cách dịch này trực tiếp và không thêm ý.
- source_word: נֶשֶׁךְ
  choice: tiền lãi
  rationale: Danh từ này chỉ khoản lãi thu trên món vay; “tiền lãi” rõ nghĩa trong tiếng Việt hiện đại hơn các cách nói cổ hoặc chỉ hàm ý lãi quá mức.
- source_word: וְתַרְבִּית
  choice: hay phần tăng thêm
  rationale: Từ này đi đôi với נֶשֶׁךְ, chỉ phần gia tăng hoặc khoản lợi thu thêm từ người vay nghèo. “Phần tăng thêm” giữ được nét nghĩa rộng và sự gần gũi giữa hai thuật ngữ.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: nhưng hãy kính sợ Đức Chúa Trời của ngươi
  rationale: 'Dịch liên từ theo sắc thái đối lập phù hợp ngữ cảnh đạo đức: thay vì trục lợi, người nghe phải kính sợ Đức Chúa Trời. “Của ngươi” giữ lối xưng hô trực tiếp số ít của tiếng Hê-bơ-rơ.'
- source_word: וְחֵי
  choice: và hãy để ... sống
  rationale: Giữ liên từ một cách trực tiếp và diễn đạt sắc thái mệnh lệnh/kết quả mà không áp đặt quan hệ mục đích vốn không được nêu minh nhiên.
- source_word: אָחִיךָ
  choice: anh em ngươi
  rationale: Giữ hình ảnh thân thuộc và ý nghĩa cộng đồng giao ước của nguyên văn; trong tiếng Việt, “anh em” tự nhiên hơn việc buộc chọn “anh” hoặc “em” khi nguyên văn không xác định tuổi tác.
- source_word: עִמָּךְ
  choice: bên ngươi
  rationale: Diễn tả việc người ấy tiếp tục sống cạnh người nghe trong cộng đồng; “bên ngươi” sát nghĩa và trang trọng tự nhiên.
theological_decisions:
- issue: Ý nghĩa xã hội-giao ước của אָחִיךָ trong luật pháp
  choice: anh em ngươi
  alternative: người đồng bào của ngươi
  rationale: Ngữ cảnh nói về một thành viên cùng cộng đồng giao ước đang lâm cảnh nghèo khó. Giữ cách gọi thân thuộc bảo toàn sức nặng gia đình và giao ước của nguyên văn; chú thích làm rõ rằng không nhất thiết là anh em ruột.
- issue: Quan hệ giữa việc kính sợ Đức Chúa Trời và để người anh em sống bên mình
  choice: và hãy để
  alternative: để cho / hầu cho ... được sống
  rationale: Nguyên văn dùng liên từ וְ, nên bản dịch không biến quan hệ này thành mục đích một cách dứt khoát; cách dịch cũng giữ được sắc thái khuyên truyền/mệnh lệnh của וְחֵי.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ đại từ số ít “ngươi” để phản ánh lời truyền trực tiếp của luật giao ước; dùng “Đức Chúa Trời” và giữ hình ảnh “anh em” của nguyên văn.
