  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לְ/פִ֣י רֹ֣ב הַ/שָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔/וֹ וּ/לְ/פִי֙ מְעֹ֣ט הַ/שָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑/וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽ/ךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: vi
  text: 'Tùy theo số năm còn lại nhiều hay ít, con phải tăng hoặc giảm giá mua: nếu còn nhiều năm thì tăng giá, nếu còn ít năm thì giảm giá, vì người ấy bán cho con một số vụ thu hoạch.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ תְּבוּאוֹת cũng có thể dịch là “hoa lợi” hoặc “mùa vụ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי רֹב הַשָּׁנִים / וּלְפִי מְעֹט הַשָּׁנִים
  choice: Tùy theo số năm còn lại nhiều hay ít
  rationale: לְפִי diễn tả sự tương ứng theo tỷ lệ; ngữ cảnh Năm Hân Hỉ cho thấy đây là số năm còn lại. Cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ thế đối xứng giữa nhiều năm và ít năm.
- source_word: תַּרְבֶּה ... וְתַמְעִיט
  choice: tăng ... giảm
  rationale: Hai động từ Hiphil chỉ việc điều chỉnh lên hoặc xuống; “tăng” và “giảm” là cách nói thương mại, pháp lý rõ ràng và hiện đại.
- source_word: מִקְנָתוֹ
  choice: giá mua
  rationale: Danh từ có thể chỉ vật mua, việc mua hoặc giá mua. Trong quy định định giá theo số năm và số vụ thu hoạch, “giá mua” truyền đạt đúng chức năng của từ trong ngữ cảnh.
- source_word: מִסְפַּר תְּבוּאֹת
  choice: một số vụ thu hoạch
  rationale: תְּבוּאוֹת có thể chỉ hoa lợi, mùa vụ hoặc các vụ thu hoạch. “Một số vụ thu hoạch” diễn tả cụ thể quyền hưởng sản lượng qua một số mùa mà giao dịch này thực chất chuyển nhượng.
- source_word: הוּא מֹכֵר לָךְ
  choice: người ấy bán cho con
  rationale: Giữ chủ thể số ít giống đực của tiếng Hê-bơ-rơ mà không làm câu tiếng Việt nặng nề; “con” phù hợp lời luật truyền trực tiếp cho dân trong văn mạch.
theological_decisions:
- issue: Bản chất của việc chuyển nhượng đất trước Năm Hân Hỉ
  choice: Diễn đạt rằng người bán chuyển nhượng một số vụ thu hoạch, nên giá thay đổi theo số năm còn lại.
  alternative: Diễn đạt như việc bán quyền sở hữu đất vĩnh viễn.
  rationale: Mệnh đề giải thích trong tiếng Hê-bơ-rơ nêu rõ đối tượng kinh tế của giao dịch là số vụ thu hoạch; bản dịch không áp đặt một cách hiểu về quyền sở hữu vượt quá câu nguồn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Câu được sắp xếp lại nhẹ để tránh lặp vụng trong tiếng Việt, đồng thời giữ nguyên quan hệ tỷ lệ và lý do kinh tế của quy định. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
