source:
  edition: WLC
  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: vi
  text: Căn cứ vào số năm kể từ Năm Hân Hỉ, ngươi phải mua của người đồng bào mình; căn cứ vào số năm có mùa màng[a], người ấy phải bán cho ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “số năm hoa lợi/mùa màng.” Ý nói giá bán được tính theo số năm đất còn có thể cho thu hoạch trước Năm Hân Hỉ kế tiếp, chứ không phải là sự chuyển nhượng đất vĩnh viễn.'
    reason: Giải thích cách nói Hê-bơ-rơ cô đọng và cơ sở kinh tế của việc định giá trong văn cảnh.
lexical_decisions:
- source_word: בְּמִסְפַּר שָׁנִים אַחַר הַיּוֹבֵל
  choice: căn cứ vào số năm kể từ Năm Hân Hỉ
  rationale: בְּמִסְפַּר diễn tả tiêu chuẩn dùng để tính toán; “căn cứ vào số năm” tự nhiên trong tiếng Việt và giữ được cấu trúc pháp lý. אַחַר הַיּוֹבֵל được dịch là “kể từ Năm Hân Hỉ,” chỉ mốc thời gian trong chu kỳ hân hỉ.
- source_word: תִּקְנֶה
  choice: anh em phải mua
  rationale: Dạng vị hoàn thành 2ms mang lực quy định trong văn luật. “Phải mua” thể hiện lực ấy; “anh em” là cách xưng hô cộng đồng tự nhiên hơn “ngươi” trong tiếng Việt hiện đại.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: của người đồng bào mình
  rationale: עָמִית chỉ một người cùng cộng đồng trong ngữ cảnh pháp luật. “Người đồng bào mình” giữ sắc thái quan hệ cộng đồng mà không thu hẹp thành người sống gần nhà.
- source_word: בְּמִסְפַּר שְׁנֵי תְבוּאֹת
  choice: căn cứ vào số năm có mùa màng
  rationale: Cụm này sát nghĩa là “theo số năm hoa lợi/mùa màng,” tức những năm đất còn đem lại sản vật. Cách dịch này vừa giữ hình ảnh nông nghiệp vừa rõ nghĩa trong tiếng Việt.
- source_word: יִמְכָּר לָךְ
  choice: người ấy phải bán cho anh em
  rationale: Giữ lực quy định và sự đối xứng pháp lý với “anh em phải mua,” đồng thời biểu thị rõ chủ thể là người đồng bào vừa được nhắc đến.
theological_decisions:
- issue: Bản chất của giao dịch đất trong chu kỳ Năm Hân Hỉ
  choice: Giữ nguyên hai tiêu chuẩn thời gian của câu và giải thích rằng giá trị liên hệ với số năm đất còn sinh hoa lợi.
  alternative: Diễn giải ngay trong câu rằng đây chỉ là mua quyền hưởng mùa màng cho đến Năm Hân Hỉ kế tiếp.
  rationale: Nguyên văn nói đến việc mua bán và “số năm có mùa màng” nhưng không diễn giải đầy đủ bản chất giao dịch ngay trong câu này. Đưa phần giải thích vào chú thích bảo toàn cách nói và sức căng của nguyên văn, tránh biến lời giải nghĩa theo văn cảnh thành nội dung trực tiếp của câu.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. Dùng “anh em” thay cho đại từ cổ “ngươi”; dùng “Năm Hân Hỉ” như thuật ngữ rõ nghĩa trong ngữ cảnh Lê-vi Ký 25. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
