source:
  edition: WLC
  text: וְ/סָפַרְתָּ֣ לְ/ךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְ/הָי֣וּ לְ/ךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַ/שָּׁנִ֔ים תֵּ֥שַׁע וְ/אַרְבָּעִ֖ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: vi
  text: Ngươi phải tính cho mình bảy kỳ sa-bát năm[a], tức là bảy năm, bảy lần; thời gian của bảy kỳ sa-bát năm ấy sẽ là bốn mươi chín năm cho ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bảy tuần năm”. Tiếng Hê-bơ-rơ nói sát nghĩa là “bảy sa-bát của các năm”, chỉ bảy chu kỳ, mỗi chu kỳ gồm bảy năm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ
  choice: Ngươi phải tính
  rationale: Động từ ספר ở đây chỉ việc đếm, tính các chu kỳ thời gian; “tính” tự nhiên trong tiếng Việt và phù hợp với tổng số được nêu ở cuối câu.
- source_word: לְךָ
  choice: cho mình / đối với ngươi
  rationale: Giữ lại đại từ ngôi thứ hai được nhắc hai lần trong tiếng Hê-bơ-rơ, đồng thời diễn đạt tự nhiên theo từng vị trí trong câu.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: bảy kỳ sa-bát năm
  rationale: Giữ hình ảnh “sa-bát” của nguyên văn và mối liên hệ với luật về năm sa-bát; thêm “kỳ” để người đọc hiểu đây là các chu kỳ gồm nhiều năm, không phải những ngày sa-bát thông thường.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: bảy năm nhân bảy lần
  rationale: Diễn đạt rõ phép lặp bảy chu kỳ, vẫn giữ cả hai thành tố “bảy năm” và “bảy lần” của nguyên văn.
- source_word: יְמֵי שֶׁבַע שַׁבְּתֹת הַשָּׁנִים
  choice: thời gian của bảy kỳ sa-bát năm ấy
  rationale: יְמֵי nghĩa đen là “những ngày của”, nhưng trong thành ngữ này chỉ toàn bộ khoảng thời gian; “thời gian” là cách nói Việt ngữ rõ và tự nhiên hơn.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: bốn mươi chín năm
  rationale: Chuyển thứ tự cấu tạo số của tiếng Hê-bơ-rơ sang trật tự số đếm chuẩn trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của שַׁבְּתֹת trong cụm chỉ năm
  choice: kỳ sa-bát năm
  alternative: tuần năm
  rationale: Bản chính giữ thuật ngữ “sa-bát” để bảo tồn hình ảnh thần học và liên hệ trực tiếp với năm nghỉ sa-bát trong văn mạch; chú thích ghi nhận cách hiểu cấu trúc là các chu kỳ bảy năm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” phù hợp lời luật truyền trực tiếp cho một đối tượng số ít; giữ “sa-bát” làm thuật ngữ Kinh Thánh nhưng thêm “kỳ” để làm rõ đây là chu kỳ năm.
