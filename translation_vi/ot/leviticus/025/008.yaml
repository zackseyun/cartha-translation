  to: Ngươi phải tính cho mình bảy kỳ sa-bát năm[a], tức là bảy năm, bảy lần; thời gian của bảy kỳ sa-bát năm ấy sẽ là bốn mươi chín năm cho ngươi.
  rationale: Thay “nhân bảy lần” bằng “bảy năm, bảy lần” để theo sát và tự nhiên hóa lối lặp của nguyên văn. Đổi “đối với ngươi” thành “cho ngươi” để giữ đại từ lặp lại mà không tạo cấu trúc Việt ngữ gượng ép. Không thay đổi ý nghĩa hoặc cách hiểu của cụm “sa-bát năm”.
  reviewer_model: gpt-5.6-terra
