  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: vi
  text: Người ấy sẽ ở với chủ như một người làm thuê, hết năm này sang năm khác; chủ không được cai trị người ấy một cách hà khắc trước mắt anh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: như một người làm thuê
  rationale: Tiền tố כְּ diễn tả sự so sánh “như”, còn שָׂכִיר chỉ người làm công nhận tiền thuê, không phải nô lệ. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ rõ địa vị được so sánh.
- source_word: שָׁנָה בְּשָׁנָה
  choice: hết năm này sang năm khác
  rationale: Thành ngữ có ý phân phối và tiếp diễn theo từng năm. Cách diễn đạt này tự nhiên, đồng thời giữ được tính liên tục qua các năm.
- source_word: יִהְיֶה עִמּוֹ
  choice: sẽ ở với chủ
  rationale: Động từ היה cùng עִם chỉ đơn giản là “ở với”. Không thêm ý “phục vụ” hay “tiếp tục ở”, vì những ý đó không được nói rõ trong nguyên văn. Đại từ được diễn đạt là “chủ” để tránh chuỗi đại từ nam khó hiểu trong tiếng Việt, dựa trên quan hệ đã rõ trong văn cảnh.
- source_word: לֹא יִרְדֶּנּוּ
  choice: chủ không được cai trị người ấy
  rationale: רדה có nghĩa là cai trị hoặc thống trị. “Cai trị” giữ liên hệ từ vựng với ý thực thi quyền trên người khác mà không diễn giải quá mức thành một hình thức lao dịch cụ thể.
- source_word: בְּפֶרֶךְ
  choice: cách hà khắc
  rationale: Danh từ này chỉ sự khắc nghiệt, tàn nhẫn, đặc biệt trong việc áp đặt lao dịch. Trạng ngữ “cách hà khắc” kết hợp tự nhiên với “cai trị” và bảo toàn sức nặng pháp lý-đạo đức.
- source_word: לְעֵינֶיךָ
  choice: trước mắt anh em
  rationale: Cụm từ theo nghĩa đen là “trước mắt ngươi”, chỉ hành vi xảy ra dưới sự chứng kiến của người đang được nói với. “Anh em” phản ánh đại từ số ít giống đực trong lời luật và phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại.
theological_decisions:
- issue: Địa vị của người Israel dưới quyền một ngoại kiều cư trú
  choice: Diễn tả người ấy bằng phép so sánh với người làm thuê, không gọi người ấy là nô lệ.
  alternative: Như một đầy tớ làm thuê.
  rationale: Cấu trúc כִּשְׂכִיר đặt địa vị của người ấy trong sự so sánh với người làm thuê và nhấn mạnh sự bảo hộ cùng tính hữu hạn của quan hệ này trong văn cảnh. Cách dịch không phủ nhận bối cảnh lệ thuộc, nhưng tránh đưa vào đây ý sở hữu nô lệ mạnh hơn điều שׂכיר thực sự biểu đạt.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dễ hiểu. Dùng “người làm thuê” thay cho “đầy tớ” để phân biệt rõ với nô lệ; dùng “chủ” nhằm làm sáng chủ thể của hai đại từ nam trong nguyên văn. Không cần chú thích vì phương án tiếng Việt đã truyền đạt trực tiếp phép so sánh và không có biến thể quan trọng cần ghi.
