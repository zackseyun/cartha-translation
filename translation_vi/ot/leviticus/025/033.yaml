revisions:
- from: Nếu một người trong số người Lê-vi chuộc lại, thì ngôi nhà đã bán trong thành thuộc phần sở hữu của người ấy phải được hoàn lại vào Năm Hân Hỉ[a], vì nhà cửa trong các thành của người Lê-vi là phần sở hữu của họ giữa con dân Y-sơ-ra-ên.[b]
  to: Nếu một người trong số người Lê-vi chuộc lại, thì ngôi nhà đã bán trong thành nơi người ấy có phần sở hữu phải được hoàn lại vào Năm Hân Hỉ[a], vì nhà cửa trong các thành của người Lê-vi là phần sở hữu của họ trong dân Y-sơ-ra-ên.[b]
  rationale: Sửa một cụm cú pháp mơ hồ để phản ánh đúng quan hệ giữa ngôi nhà, thành và phần sở hữu của người Lê-vi; đồng thời dùng cách gọi tự nhiên hơn cho cộng đồng Israel. Giữ nguyên nghĩa pháp lý của việc chuộc lại và hoàn lại tài sản vào Năm Hân Hỉ, cùng các mốc chú thích.
