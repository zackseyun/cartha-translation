base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: vi
  text: Nếu một người trong số người Lê-vi chuộc lại, thì ngôi nhà đã bán trong thành nơi người ấy có phần sở hữu phải được hoàn lại vào Năm Hân Hỉ[a], vì nhà cửa trong các thành của người Lê-vi là phần sở hữu của họ trong dân Y-sơ-ra-ên.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “phải đi ra”; nghĩa là tài sản đã bán rời khỏi quyền của người mua và trở về trong Năm Hân Hỉ.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “các con trai Y-sơ-ra-ên”, một cách gọi truyền thống chỉ dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: Nếu một người trong số người Lê-vi chuộc lại
  rationale: 'Hiểu מִן theo nghĩa phân bộ: người thực hiện việc chuộc thuộc trong số người Lê-vi. Cách dịch giữ cấu trúc điều kiện của điều luật và thuật ngữ pháp lý ''chuộc lại''.'
- source_word: וְיָצָא מִמְכַּר בַּיִת
  choice: thì ngôi nhà đã bán ... phải được hoàn lại
  rationale: וְיָצָא theo nghĩa đen là 'đi ra'; trong luật Năm Hân Hỉ, tài sản rời quyền sở hữu của người mua và trở về chủ cũ. מִמְכַּר có thể chỉ vật đã bán, nên dịch tự nhiên là 'ngôi nhà đã bán'.
- source_word: וְעִיר אֲחֻזָּתוֹ
  choice: trong thành thuộc phần sở hữu của người ấy
  rationale: Cú pháp Hê-bơ-rơ cô đọng; theo văn cảnh, đây là ngôi nhà nằm trong thành được cấp làm phần sở hữu của người Lê-vi ấy.
- source_word: בַּיֹּבֵל
  choice: vào Năm Hân Hỉ
  rationale: Chỉ thiết chế và thời điểm pháp lý đặc thù khi tài sản được hoàn lại; viết hoa để đánh dấu tên gọi kỹ thuật.
- source_word: בָתֵּי עָרֵי הַלְוִיִּם
  choice: nhà cửa trong các thành của người Lê-vi
  rationale: Diễn đạt tự nhiên bằng tiếng Việt và làm rõ rằng các ngôi nhà nằm trong những thành thuộc người Lê-vi.
- source_word: הִוא אֲחֻזָּתָם
  choice: là phần sở hữu của họ
  rationale: אֲחֻזָּה là phần đất hay tài sản nắm giữ có tính lâu dài, thường mang tính thừa kế; 'phần sở hữu' giữ sắc thái pháp lý mà không diễn giải quá mức.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: giữa con dân Y-sơ-ra-ên
  rationale: '''Con dân Y-sơ-ra-ên'' là cách gọi giao ước trang trọng, quen thuộc trong tiếng Việt, chỉ cộng đồng dân Y-sơ-ra-ên.'
theological_decisions:
- issue: Quan hệ ngữ pháp của מִן הַלְוִיִּם
  choice: một người trong số người Lê-vi
  alternative: chuộc lại từ người Lê-vi
  rationale: Cách hiểu phân bộ phù hợp với quy định đặc biệt dành cho một người Lê-vi chuộc tài sản và tránh đảo ngược quan hệ giữa người chuộc với tài sản.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai Y-sơ-ra-ên
  rationale: Trong ngữ cảnh này, cụm từ là danh xưng giao ước quy ước cho toàn thể dân tộc, không chỉ riêng nam giới; 'con dân' vừa trang trọng vừa diễn đạt đúng phạm vi cộng đồng.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng 'chuộc lại', 'phần sở hữu' và 'Năm Hân Hỉ' nhất quán với ngữ cảnh luật đất đai; tránh lối diễn đạt quá cổ hoặc giải nghĩa thần học ngoài văn bản.
