source:
  edition: WLC
  text: וְ/הַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִעִ֔י בֶּ/עָשׂ֖וֹר לַ/חֹ֑דֶשׁ בְּ/יוֹם֙ הַ/כִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּ/כָל אַרְצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: vi
  text: Rồi vào ngày mồng mười của tháng thứ bảy, ngươi phải cho thổi tù và vang lên[a]. Trong Ngày Chuộc Tội[b], các ngươi phải cho thổi tù và khắp xứ của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tù và” dịch từ shofar trong tiếng Hê-bơ-rơ, là một loại kèn bằng sừng, theo truyền thống thường được hiểu là sừng cừu đực.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ được dịch là “Ngày Chuộc Tội” có nghĩa đen là “ngày của các sự chuộc tội”; danh từ này ở dạng số nhiều.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: con phải cho thổi vang
  rationale: Hiphil của עבר có nghĩa đen là “làm cho đi qua”, nhưng khi đi với שׁוֹפָר thì chỉ việc làm cho tiếng tù và vang truyền đi. Đại từ số ít “con” giữ sự chuyển đổi số trong nguyên văn.
- source_word: שׁוֹפַר תְּרוּעָה
  choice: tù và báo hiệu
  rationale: שׁוֹפַר là nhạc cụ làm bằng sừng; תְּרוּעָה ở đây là tiếng thổi lớn dùng làm hiệu lệnh. Cách dịch này tự nhiên trong tiếng Việt và giữ chức năng báo hiệu của âm thanh.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: vào ngày mồng mười tháng bảy
  rationale: 'Diễn đạt gọn, tự nhiên trong tiếng Việt: “tháng bảy” ở đây là tháng thứ bảy, còn “mồng mười” là ngày thứ mười của tháng.'
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: Trong Ngày Chuộc Tội
  rationale: Đây là tên ngày lễ nghi đã được xác định trong ngữ cảnh Lê-vi Ký; “Chuộc Tội” truyền đạt ý niệm nghi lễ của כפר trong tiếng Việt hiện đại.
- source_word: תַּעֲבִירוּ שׁוֹפָר
  choice: các con phải cho thổi tù và
  rationale: Giữ nghĩa thành ngữ của động từ và thể hiện rõ dạng số nhiều của תַּעֲבִירוּ, trái với dạng số ít ở đầu câu.
- source_word: בְּכָל אַרְצְכֶם
  choice: khắp xứ mình
  rationale: “Khắp” thể hiện phạm vi toàn thể của בְּכָל; “xứ mình” là lối nói trang trọng, dễ hiểu, chỉ lãnh thổ của cộng đồng được truyền lệnh.
theological_decisions:
- issue: Cách dịch יוֹם הַכִּפֻּרִים
  choice: Ngày Chuộc Tội
  alternative: ngày của những sự chuộc tội; Ngày Xá Tội
  rationale: Dùng tên gọi nghi lễ quen thuộc và rõ nghĩa, đồng thời ghi chú hình thái số nhiều của danh từ Hê-bơ-rơ để không che khuất sắc thái nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Bản dịch giữ sự chuyển đổi từ ngôi thứ hai số ít ở mệnh lệnh đầu sang số nhiều ở mệnh lệnh sau; dùng “tù và” thay vì từ vay mượn “shofar” để người đọc phổ thông hiểu ngay.
