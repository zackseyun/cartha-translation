id: LEV.25.55
reference: Leviticus 25:55
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: vi
  text: Vì con cái Israel là nô lệ của Ta[a]; họ là nô lệ của Ta, là những người Ta đã đưa ra khỏi đất Ai Cập. Ta là YHWH, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “tôi tớ.” Từ Hê-bơ-rơ này có thể chỉ người phục dịch hay người lệ thuộc; trong bối cảnh luật lệ này, sự thuộc về và thân phận bị ràng buộc được nhấn mạnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lý do cho quy định ngay trước đó; “Vì” diễn đạt tự nhiên chức năng giải thích của liên từ.
- source_word: לִי
  choice: của ta
  rationale: Giới từ kèm đại từ biểu thị sự thuộc về; kết cấu sở hữu này tự nhiên trong tiếng Việt và nhấn mạnh Israel thuộc về Đức Chúa Trời.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh gia tộc và ý nghĩa tập thể của nguyên văn, đồng thời là cách nói trang trọng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: עֲבָדִים / עֲבָדַי
  choice: tôi tớ / tôi tớ của ta
  rationale: עבד có thể chỉ người phục dịch trong tình trạng lệ thuộc. “Tôi tớ” giữ được sắc thái giao ước và sự thuộc về ở đây mà không mặc nhiên đồng nhất với chế độ nô lệ chủng tộc cận đại; phép lặp được giữ để bảo toàn sự nhấn mạnh của tiếng Hê-bơ-rơ.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: những người ta đã đưa ra
  rationale: Diễn đạt trực tiếp thể Hiphil của יצא và giữ công thức gợi lại cuộc xuất hành.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: khỏi đất Ai Cập
  rationale: Kết hợp tự nhiên với “đưa ra” và bảo toàn công thức xuất hành quen thuộc.
- source_word: יְהוָה
  choice: YHWH
  rationale: Phiên chuyển trực tiếp danh riêng giao ước, không thay bằng một tước hiệu; dạng YHWH tránh áp đặt một cách phát âm không được nguyên âm Masoret xác quyết chắc chắn.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Phản ánh công thức giao ước và hậu tố sở hữu số nhiều trong văn phong trang trọng.
theological_decisions:
- issue: Cách dịch עבד trong bối cảnh Israel thuộc riêng về YHWH
  choice: tôi tớ
  alternative: nô lệ
  rationale: Mạch văn dựa trên sự thuộc về độc quyền của Israel đối với YHWH, nên “nô lệ” là một khả năng từ vựng có thực. Tuy nhiên, “tôi tớ” phù hợp hơn với quan hệ giao ước trong câu này và tránh đưa vào những liên tưởng đặc thù của chế độ nô lệ cận đại; sự lệ thuộc và thuộc về vẫn được thể hiện qua “của ta” được lặp lại.
- issue: Cụm tập thể בְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel; dân Israel
  rationale: “Con cái Israel” giữ thành tố huyết tộc và phạm vi tập thể của thành ngữ, không giới hạn ý nghĩa vào nam giới mà cũng không làm phẳng hình ảnh nguồn thành “dân Israel”.
- issue: Danh xưng יהוה
  choice: YHWH
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ đây là danh riêng thay vì tước hiệu, đồng thời không khẳng định một cách phát âm cụ thể khi truyền thống nguyên âm của danh này còn có vấn đề văn bản và truyền đọc.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “ta/các ngươi” phản ánh lời phán có thẩm quyền và hậu tố số nhiều; phép lặp “tôi tớ của ta” được giữ để tái hiện trọng âm tu từ của nguyên văn.
