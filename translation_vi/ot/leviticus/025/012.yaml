id: LEV.25.12
reference: Leviticus 25:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: vi
  text: Vì đó là năm hân hỉ; năm ấy sẽ là thánh đối với các ngươi. Các ngươi sẽ ăn hoa lợi của đồng ruộng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sản vật”, “mùa màng”. Từ Hê-bơ-rơ chỉ những gì đồng ruộng sinh ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Dẫn vào lý do cho chỉ thị ngay trước đó, phù hợp chức năng giải thích của liên từ trong ngữ cảnh luật pháp.
- source_word: יוֹבֵל
  choice: năm hân hỉ
  rationale: Trong Lê-vi Ký 25, từ này chỉ năm thứ năm mươi đặc biệt, không chỉ chiếc tù và; cách gọi này tự nhiên, trang trọng và đã quen thuộc trong ngôn ngữ Kinh Thánh tiếng Việt.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: năm ấy phải là thánh đối với các ngươi
  rationale: Giữ nguyên sức nặng tôn giáo-giao ước của קֹדֶשׁ và quan hệ לָכֶם, đồng thời dùng cấu trúc pháp quy tự nhiên trong tiếng Việt.
- source_word: מִן הַשָּׂדֶה
  choice: ngay từ ngoài đồng
  rationale: Diễn đạt việc ăn trực tiếp từ những gì đồng ruộng sinh ra, thay vì thu hoạch và tích trữ theo lối thông thường.
- source_word: תֹּאכְלוּ
  choice: các ngươi sẽ ăn
  rationale: Bảo toàn hình thức vị lai/chỉ thị của động từ trong văn liệu luật pháp, không tự ý thu hẹp thành sự cho phép đơn thuần.
- source_word: תְּבוּאָתָהּ
  choice: hoa lợi của năm ấy
  rationale: תְּבוּאָה chỉ sản vật hay hoa lợi được sinh ra. Hậu tố giống cái số ít gần nhất quy chiếu về năm hân hỉ; trong thực tế, đó là sản vật ngoài đồng của năm ấy.
theological_decisions:
- issue: Ngôn ngữ về tính thánh của năm hân hỉ
  choice: năm ấy phải là thánh đối với các ngươi
  alternative: năm ấy phải được biệt riêng cho các ngươi
  rationale: “Là thánh” giữ được trọng lượng thần học của קֹדֶשׁ và không giản lược ý nghĩa thành việc chỉ được dành riêng về mặt nghi lễ hay dân sự.
- issue: Sắc thái pháp quy của תֹּאכְלוּ
  choice: các ngươi sẽ ăn
  alternative: các ngươi được ăn
  rationale: Nguyên ngữ có thể mang lực chỉ thị trong ngữ cảnh luật pháp. Bản dịch giữ hình thức chưa hoàn thành/vị lai, tránh giải quyết dứt khoát theo hướng chỉ là sự cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ sắc thái lời luật phán cho cộng đồng Israel; dùng “năm hân hỉ” nhất quán với thuật ngữ chủ đạo trong chương. Không thêm chú thích vì bản tiếng Việt không cần nêu biến thể từ vựng để hiểu câu.
