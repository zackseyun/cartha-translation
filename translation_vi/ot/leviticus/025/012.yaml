  to: Vì đó là năm hân hỉ; năm ấy sẽ là thánh đối với các ngươi. Các ngươi sẽ ăn hoa lợi của đồng ruộng[a].
  rationale: 'Sửa quy chiếu của hậu tố trong “hoa lợi của đồng ruộng” để phản ánh đúng ngữ pháp Hê-bơ-rơ và giữ nguyên ý nghĩa: trong năm hân hỉ, dân sự ăn sản vật từ đồng ruộng. Điều chỉnh “ngay từ ngoài đồng” thành “của đồng ruộng” loại bỏ sắc thái không có trong nguyên ngữ. Không có vấn đề văn bản hoặc thần học nào đòi hỏi xử lý thêm.'
