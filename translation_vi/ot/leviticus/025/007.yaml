base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: vi
  text: Còn mọi sản vật của đất ấy sẽ là thức ăn cho gia súc của ngươi và cho thú hoang trong đất ngươi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: cho gia súc của ngươi
  rationale: בְּהֵמָה ở đây chỉ chung các loài vật nuôi, đối lập với thú hoang được nhắc đến ngay sau đó. “Gia súc” là cách diễn đạt gọn, tự nhiên trong văn cảnh nông nghiệp.
- source_word: לַחַיָּה
  choice: cho thú hoang
  rationale: חַיָּה, khi đặt đối lập với בְּהֵמָה, chỉ các loài vật không được thuần dưỡng; “thú hoang” cụ thể và dễ hiểu.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: trong đất ngươi
  rationale: Mệnh đề quan hệ bổ nghĩa cho “thú hoang.” “Đất” giữ được sắc thái cụ thể của אֶרֶץ và phù hợp với văn cảnh canh tác.
- source_word: כָּל תְּבוּאָתָהּ
  choice: mọi sản vật của đất ấy
  rationale: תְּבוּאָה chỉ hoa lợi hay sản vật do đất sinh ra; hậu tố giống cái số ít quy chiếu về “đất” trong mạch văn trước đó. Nói rõ “của đất ấy” giúp tiếng Việt tự nhiên và tránh đại từ sở hữu mơ hồ.
- source_word: תִּהְיֶה ... לֶאֱכֹל
  choice: sẽ là thức ăn
  rationale: Cấu trúc היה với ל + động từ nguyên mẫu diễn tả công dụng hoặc sự sẵn có để ăn. “Sẽ là thức ăn” tự nhiên trong tiếng Việt và vẫn giữ sắc thái quy định của câu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ đại từ số ít “ngươi” để phản ánh hậu tố ngôi thứ hai giống đực số ít trong tiếng Hê-bơ-rơ và duy trì giọng luật pháp giao ước. Đảo “mọi sản vật” lên đầu mệnh đề để câu tiếng Việt rõ chủ ngữ và tránh cách nối liệt kê gượng.
