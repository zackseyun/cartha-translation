revisions:
- from: Các ngươi cũng có thể mua người trong số con cái của những ngoại kiều đang cư trú giữa các ngươi,[a] và trong số những người thuộc gia đình họ đang sống giữa các ngươi, là những người họ đã sinh ra trên đất các ngươi. Những người ấy sẽ trở thành vật sở hữu của các ngươi.[b]
  to: Các ngươi cũng có thể mua người trong số con cái của những ngoại kiều đang cư trú giữa các ngươi,[a] và trong số những người thuộc gia đình họ đang sống giữa các ngươi, là những người do họ sinh ra trên đất các ngươi. Những người ấy sẽ thuộc quyền sở hữu của các ngươi.[b]
  rationale: Sửa tối thiểu để làm rõ mệnh đề chỉ những người được các ngoại kiều sinh ra tại đất ấy và để dùng cách diễn đạt sở hữu tự nhiên, pháp lý trong tiếng Việt. Bản sửa vẫn giữ nguyên ngôn ngữ mua bán và sở hữu con người của nguyên văn, không uyển ngữ hóa hay giải thích vượt quá bản văn.
