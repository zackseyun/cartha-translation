  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: vi
  text: Các ngươi cũng có thể mua người trong số con cái của những ngoại kiều đang cư trú giữa các ngươi,[a] và trong số những người thuộc gia đình họ đang sống giữa các ngươi, là những người do họ sinh ra trên đất các ngươi. Những người ấy sẽ thuộc quyền sở hữu của các ngươi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong số con cháu của những người ngoại quốc đang sống giữa các ngươi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “làm vật sở hữu.” Trong bối cảnh pháp lý ở đây, họ là tài sản có thể được truyền lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Các ngươi cũng có thể
  rationale: Diễn đạt tự nhiên ý bổ sung và sắc thái cho phép của điều luật, đồng thời thể hiện ngôi thứ hai số nhiều.
- source_word: מִבְּנֵי
  choice: trong số con cái của
  rationale: בְּנֵי có nghĩa cơ bản là “con cái/con trai của,” nhưng trong ngữ cảnh huyết thống có thể bao gồm con cháu; “con cái” vừa gần nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: những ngoại kiều đang cư trú giữa các ngươi
  rationale: Hai từ đi cùng nhau chỉ những người không phải dân bản địa nhưng đang sống thường trú hoặc tạm trú trong cộng đồng Israel. “Ngoại kiều đang cư trú” giữ được sắc thái pháp lý mà vẫn dễ hiểu.
- source_word: מֵהֶם תִּקְנוּ
  choice: có thể mua người trong số
  rationale: קנה trong điều luật này mang nghĩa thương mại rõ ràng là “mua”; thêm “người” giúp câu tiếng Việt minh bạch mà không làm nhẹ ngôn ngữ sở hữu của bản văn.
- source_word: וּמִמִּשְׁפַּחְתָּם
  choice: và trong số những người thuộc gia đình họ
  rationale: מִשְׁפָּחָה có thể là gia đình hoặc gia tộc. Cách diễn đạt này làm rõ đối tượng có thể được mua mà không buộc từ ngữ phải mang nghĩa kỹ thuật “gia tộc”.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: là những người họ đã sinh ra trên đất các ngươi
  rationale: הוליד ở thể Hiphil có nghĩa “sinh ra/sinh được.” Cách dịch giữ quan hệ huyết thống và địa điểm sinh, nhưng tránh từ cổ “sinh hạ”.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: Những người ấy sẽ trở thành vật sở hữu của các ngươi
  rationale: אֲחֻזָּה là vật sở hữu hoặc phần sản nghiệp. Trong ngữ cảnh này từ ấy chỉ địa vị pháp lý của con người như tài sản có thể truyền lại; “vật sở hữu” giữ nguyên tính khắc nghiệt của điều luật thay vì dùng một cách nói giảm nhẹ.
theological_decisions:
- issue: Ngôn ngữ về mua bán và sở hữu con người trong luật thánh khiết
  choice: Dùng trực tiếp “mua người” và “vật sở hữu”
  alternative: “thu nhận,” “đầy tớ,” hoặc cách diễn đạt làm nhẹ quan hệ sở hữu
  rationale: Các từ Hê-bơ-rơ mô tả việc mua và địa vị sở hữu thật sự. Bản dịch không nên giải quyết sự căng thẳng đạo đức–thần học của bản văn bằng cách dùng uyển ngữ.
- issue: Phạm vi của בְּנֵי
  choice: “con cái,” kèm chú thích khả năng hiểu là “con cháu”
  alternative: Dịch thẳng là “con cháu” ngay trong chính văn
  rationale: “Con cái” gần hình thức nguồn hơn, trong khi chú thích bảo tồn nghĩa rộng hợp lý trong bối cảnh dòng dõi.
translation_notes:
  register: Văn phong trang trọng, hiện đại và trực tiếp. Đại từ “các ngươi” phù hợp lời luật phán cho toàn cộng đồng Israel. Bản dịch giữ nguyên ngôn ngữ mua bán và sở hữu gây khó chịu của nguyên văn, không thay bằng uyển ngữ.
