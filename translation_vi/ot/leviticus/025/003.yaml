  yaml_path: translation/ot/leviticus/025/003.yaml
  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: vi
  text: Trong sáu năm, ngươi phải gieo ruộng mình; trong sáu năm, ngươi phải tỉa dây nho trong vườn nho mình và thu sản vật của đất ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sản lượng của đất ấy.” Từ Hê-bơ-rơ có thể chỉ sản vật nông nghiệp nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: trong sáu năm
  rationale: Cụm từ chỉ khoảng thời gian hành động diễn ra; “trong sáu năm” diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: תִּזְרַע
  choice: ngươi phải gieo
  rationale: Dạng chưa hoàn thành mang chức năng chỉ thị trong văn bản luật pháp. “Phải gieo” thể hiện tính quy định mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: שָׂדֶךָ
  choice: ruộng mình
  rationale: שָׂדֶה ở đây chỉ thửa ruộng hay phần đất canh tác, cụ thể hơn từ “đất” nói chung.
- source_word: תִּזְמֹר
  choice: phải tỉa
  rationale: Trong ngữ cảnh vườn nho, זמר chỉ việc cắt tỉa dây nho; “tỉa” là cách diễn đạt chính xác và quen thuộc.
- source_word: כַּרְמֶךָ
  choice: vườn nho mình
  rationale: “Vườn nho” là cách tương đương tiêu chuẩn, rõ ràng của כֶּרֶם trong luật nông nghiệp.
- source_word: וְאָסַפְתָּ
  choice: và thu
  rationale: אָסַף có nghĩa là gom hoặc thu lại. “Thu” giữ được nghĩa rộng mà không thu hẹp thành riêng hành động gặt hái.
- source_word: תְּבוּאָתָהּ
  choice: hoa lợi của vườn ấy
  rationale: תְּבוּאָה chỉ sản lượng hoặc hoa lợi nông nghiệp. “Hoa lợi” phù hợp văn cảnh luật pháp và giữ nghĩa khá rộng; hậu tố giống cái số ít được diễn đạt rõ là “của vườn ấy,” quy chiếu gần nhất đến vườn nho.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” giữ ngôi thứ hai số ít của nguyên văn và sắc thái lời quy định trực tiếp. Cấu trúc song song “trong sáu năm” được giữ lại để phản ánh nhịp điệu của câu Hê-bơ-rơ.
