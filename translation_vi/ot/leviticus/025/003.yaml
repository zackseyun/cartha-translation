revisions:
- from: Trong sáu năm, ngươi phải gieo ruộng mình; trong sáu năm, ngươi phải tỉa vườn nho mình và thu hoa lợi của vườn ấy.[a]
  to: Trong sáu năm, ngươi phải gieo ruộng mình; trong sáu năm, ngươi phải tỉa dây nho trong vườn nho mình và thu sản vật của đất ấy.[a]
  rationale: Bản sửa thay “hoa lợi của vườn ấy” bằng “sản vật của đất ấy” để phản ánh nghĩa nông nghiệp rộng của תְּבוּאָה và tránh gán hậu tố giống cái cho “vườn nho.” Cụm “tỉa dây nho trong vườn nho” làm rõ đối tượng của động từ “tỉa.” Các yếu tố còn lại được giữ nguyên để bảo toàn nhịp song hành và sắc thái quy định của nguyên văn.
  reviewer_model: gpt-5.6-terra
