  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: vi
  text: Nhưng nếu người ấy không đủ khả năng để chuộc lại tài sản ấy, thì tài sản người ấy đã bán sẽ ở trong tay người mua cho đến năm Hân Hỉ. Vào năm Hân Hỉ, tài sản ấy sẽ ra khỏi tay người mua, và người ấy sẽ trở về phần sản nghiệp của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và tài sản ấy sẽ trở về quyền sở hữu của người ấy.” Động từ Hê-bơ-rơ ở cuối câu có thể lấy tài sản đã bán, thay vì người bán, làm chủ ngữ.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ
  choice: không có đủ khả năng
  rationale: Đây là thành ngữ Hê-bơ-rơ dùng “tay” để chỉ khả năng hoặc nguồn lực. Dịch theo nghĩa giúp câu luật pháp tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: דֵּי הָשִׁיב לוֹ
  choice: đủ khả năng để chuộc lại
  rationale: Trong văn cảnh chuộc đất đã bán, הָשִׁיב diễn tả việc lấy lại tài sản bằng khoản thanh toán quy định; “chuộc lại” truyền đạt chính xác hành vi pháp lý hơn cách dịch sát là “trả lại cho người ấy”.
- source_word: מִמְכָּרוֹ
  choice: tài sản người ấy đã bán
  rationale: Danh từ có thể chỉ việc bán hoặc vật được bán. Các mệnh đề tiếp theo cho thấy đối tượng là bất động sản đã bán.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: ở trong tay người mua nó
  rationale: Giữ hình ảnh “trong tay” của nguyên văn, vốn biểu thị quyền nắm giữ hoặc sở hữu, mà vẫn dễ hiểu trong tiếng Việt.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: Năm Hân Hỉ
  rationale: Dùng thuật ngữ trang trọng, dễ hiểu và nhất quán để chỉ năm יוֹבֵל trong luật Lê-vi.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: Đến Năm Hân Hỉ, tài sản ấy sẽ được trả tự do
  rationale: יצא có nghĩa cơ bản là “đi ra”; trong ngữ cảnh pháp lý, tài sản ra khỏi quyền nắm giữ của người mua. “Được trả tự do” giữ hình ảnh giải phóng mà làm rõ hiệu lực của Năm Hân Hỉ.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: người ấy sẽ trở về phần sản nghiệp của mình
  rationale: Chủ ngữ nam số ít được hiểu nhiều khả năng là người bán/chủ cũ. אֲחֻזָּה chỉ phần đất sở hữu mang tính gia truyền, nên “phần sản nghiệp” phù hợp với bối cảnh phân chia đất.
theological_decisions:
- issue: Chủ ngữ của וְשָׁב ở mệnh đề cuối
  choice: 'Người chủ cũ là chủ ngữ: “người ấy sẽ trở về phần sản nghiệp của mình.”'
  alternative: 'Tài sản đã bán là chủ ngữ: “tài sản ấy sẽ trở về quyền sở hữu của người ấy.”'
  rationale: Động từ nam số ít có thể quy chiếu đến người bán hoặc tài sản đã bán. Văn cảnh luật Năm Hân Hỉ nghiêng về việc người chủ cũ trở về phần đất gia truyền, nhưng sự mơ hồ ngữ pháp là có thật nên được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng tự nhiên, dành cho độc giả phổ thông hiện đại. Dùng “người ấy” thay cho đại từ có thể gây mơ hồ về giới; giữ hình ảnh “trong tay” của nguyên văn. Chú thích bảo toàn cách hiểu khác của mệnh đề cuối.
