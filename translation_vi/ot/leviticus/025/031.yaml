  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: vi
  text: Nhưng nhà trong các làng không có tường thành bao quanh sẽ được kể như đất ruộng trong xứ[a]. Những nhà ấy có thể được chuộc lại, và đến Năm Hân Hỉ sẽ được trả lại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “sẽ được kể như ruộng của xứ”; tức là về mặt pháp lý, nhà trong làng không có tường thành được xử lý như đất ruộng nông thôn, chứ không như nhà trong thành có tường bao.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “đến Năm Hân Hỉ, nó sẽ ra”; tức là tài sản sẽ được trả về trong Năm Hân Hỉ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: Nhưng nhà cửa trong những làng
  rationale: חֲצֵרִים chỉ các làng hoặc khu dân cư nông thôn; dịch là “những làng” tự nhiên trong tiếng Việt, còn đặc điểm không có tường thành được nêu rõ ở mệnh đề kế tiếp.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: không có tường thành bao quanh
  rationale: Diễn đạt trực tiếp việc các làng không có חֹמָה bao quanh; “tường thành” phù hợp với sự đối lập pháp lý với thành có tường bao ở câu trước.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: sẽ được kể như ruộng đồng trong xứ
  rationale: 'Giữ hình ảnh và ý nghĩa pháp lý của nguyên văn: các nhà này được xếp cùng loại với đất ruộng nông thôn, thay vì nhà trong thành có tường bao.'
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: Những nhà ấy có thể được chuộc lại
  rationale: Truyền đạt quyền hoặc khả năng chuộc lại bất động sản. Đại từ số ít trong tiếng Hê-bơ-rơ quy chiếu tài sản như một loại; tiếng Việt dùng “những nhà ấy” để nối nghĩa rõ ràng với chủ thể phía trước.
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: và đến Năm Hân Hỉ thì phải được hoàn trả
  rationale: יֵצֵא nghĩa đen là “sẽ ra”, nhưng trong quy định này chỉ việc tài sản ra khỏi quyền người mua và trở về chủ cũ vào Năm Hân Hỉ; “được hoàn trả” diễn đạt rõ hiệu lực pháp lý.
theological_decisions:
- issue: Ý nghĩa của יֵצֵא trong luật Năm Hân Hỉ
  choice: phải được hoàn trả
  alternative: sẽ ra
  rationale: Không thêm lập trường giáo phái; cách dịch làm rõ nghĩa pháp lý trong ngữ cảnh mà vẫn ghi nhận lối nói nguyên văn ở chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Năm Hân Hỉ” làm thuật ngữ nhất quán cho יוֹבֵל; “tường thành” nêu rõ loại tường bao đô thị trong bối cảnh pháp luật.
