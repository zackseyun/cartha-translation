    rationale: Cụm tiếng Hê-bơ-rơ chỉ người mà chủ cũ đã bán phần đất cho. Trong tiếng Việt, không nêu “đất” làm câu mơ hồ và kém tự nhiên.
  - severity: low
    issue: “Trở về phần đất sở hữu” không phải cách kết hợp tự nhiên nhất.
    rationale: Động từ “trở lại” diễn tả rõ hơn việc người ấy phục hồi về phần đất nắm giữ của mình.
  - severity: low
    issue: Chú thích a dùng “phần vượt ra”, một cách nói không tự nhiên trong ngữ cảnh khoản tiền.
    rationale: “Khoản dư” hoặc “phần dư” tự nhiên hơn và vẫn phản ánh các khả năng ‘remainder/excess’.
