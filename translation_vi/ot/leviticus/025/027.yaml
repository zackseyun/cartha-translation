  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: vi
  text: thì người ấy phải tính số năm kể từ khi bán, hoàn lại khoản tiền còn dư[a] cho người mà mình đã bán đất cho, rồi trở lại phần đất sở hữu của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phần còn lại” hoặc “khoản dư”. Tiếng Hê-bơ-rơ chỉ khoản còn lại sau khi tính giá trị của những năm chưa sử dụng.
    reason: lexical_alternative
  - marker: b
    text: “Phần đất sở hữu” ở đây có lẽ chỉ phần đất thuộc gia tộc mà người ấy được quyền nắm giữ trong Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: thì người ấy phải tính
  rationale: Động từ חשׁב chỉ việc tính toán giá chuộc; “thì” thể hiện trình tự thủ tục, còn “phải” phù hợp văn phong luật pháp.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: số năm kể từ khi bán
  rationale: Cụm này sát chữ là “những năm của việc bán”; trong bối cảnh, đó là số năm tính từ lúc phần đất được bán để xác định khoản hoàn trả.
- source_word: וְהֵשִׁיב
  choice: hoàn lại
  rationale: Thể Hiphil của שוב ở đây mang nghĩa trả lại một khoản tiền; “hoàn lại” tự nhiên và rõ trong ngữ cảnh tài chính.
- source_word: הָעֹדֵף
  choice: phần tiền còn dư
  rationale: Từ này chỉ phần còn lại hay phần vượt ra sau phép tính. Thêm “tiền” làm rõ đối tượng trong giao dịch chuộc đất mà không thay đổi ý nghĩa.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: cho người mình đã bán
  rationale: Cụm Hê-bơ-rơ chỉ người mua, tức người mà chủ cũ đã bán phần đất cho; cách diễn đạt này giữ lại quy chiếu cá nhân và tự nhiên trong tiếng Việt.
- source_word: וְשָׁב
  choice: rồi trở về
  rationale: Động từ שוב ở thể Qal diễn tả việc người bán trở lại phần đất sau khi chuộc; “rồi” nêu rõ bước kế tiếp.
- source_word: לַאֲחֻזָּתוֹ
  choice: phần đất sở hữu của mình
  rationale: אֲחֻזָּה trong luật Năm Hân Hỉ nói đến phần đất nắm giữ, thường là sản nghiệp gia tộc. “Phần đất sở hữu” rõ hơn từ chung “tài sản” và không diễn giải quá mức.
theological_decisions:
- issue: Ý nghĩa của אֲחֻזָּה trong luật Năm Hân Hỉ
  choice: phần đất sở hữu của mình
  alternative: sản nghiệp của mình; phần đất thừa kế của mình
  rationale: Thuật ngữ gắn với phần đất của một gia đình trong cơ cấu đất đai của Israel, không chỉ là tài sản nói chung. Bản dịch nêu rõ đây là đất nhưng để chú thích trình bày sắc thái gia tộc/thừa kế, tránh áp đặt một cách hiểu hẹp vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ trình tự pháp lý của nguyên văn; các sắc thái tài chính và đất đai được diễn đạt rõ mà không đưa thêm lập trường hệ phái.
