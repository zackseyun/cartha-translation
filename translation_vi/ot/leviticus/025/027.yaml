- from: thì người ấy phải tính số năm kể từ khi bán, hoàn lại cho người mình đã bán phần tiền còn dư[a], rồi trở về phần đất sở hữu của mình[b].
  to: thì người ấy phải tính số năm kể từ khi bán, hoàn lại khoản tiền còn dư[a] cho người mà mình đã bán đất cho, rồi trở lại phần đất sở hữu của mình[b].
  rationale: Bản sửa giải quyết sự mơ hồ của cụm chỉ người mua bằng cách thêm rõ đối tượng “đất”, đồng thời làm cách diễn đạt về việc trở lại đất đai tự nhiên hơn. Cách hiểu theo ngữ cảnh của “số năm kể từ khi bán” được giữ nguyên; đây là cách diễn đạt rõ ràng về số năm đã trôi qua để tính khoản chuộc. Các chú thích vẫn bảo toàn sắc thái từ vựng và bối cảnh đất đai gia tộc.
