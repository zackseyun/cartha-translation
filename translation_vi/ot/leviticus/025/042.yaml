id: LEV.25.42
reference: Leviticus 25:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: vi
  text: Vì họ là nô lệ của Ta[a], những người Ta đã đưa ra khỏi đất Ai Cập; họ không được bán theo cách người ta bán nô lệ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tôi tớ của Ta”. Từ Hê-bơ-rơ עֲבָדַי có thể mang nghĩa “tôi tớ” hoặc “nô lệ”; ở đây, ý niệm lệ thuộc và quyền sở hữu được nhấn mạnh.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “họ không được bán bằng sự mua bán một nô lệ”, nghĩa là không theo cách mua bán nô lệ thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lý do cho quy định ngay trước đó; “Vì” giữ rõ quan hệ giải thích và tự nhiên trong văn luật pháp.
- source_word: עֲבָדַי
  choice: những nô lệ của Ta
  rationale: 'Danh từ עֶבֶד với hậu tố ngôi thứ nhất số ít nhấn mạnh quan hệ lệ thuộc và quyền sở hữu: dân Israel thuộc về Đức Chúa Trời, nên không được người Israel khác coi như tài sản nô lệ. Chú thích giữ lại nghĩa thay thế “tôi tớ”.'
- source_word: הֵם
  choice: họ là
  rationale: Đại từ được nêu tường minh tạo sắc thái nhấn mạnh; tiếng Việt dùng “họ là” để thể hiện cấu trúc này.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: những người Ta đã đưa ra
  rationale: Diễn đạt mệnh đề quan hệ chỉ người một cách tự nhiên, đồng thời giữ thành ngữ Xuất Hành “Ta đã đưa ra”.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: khỏi đất Ai Cập
  rationale: “Khỏi” diễn đạt rõ chuyển động ra khỏi nơi chốn; “đất Ai Cập” gần với cấu trúc Hê-bơ-rơ và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: לֹא יִמָּכְרוּ
  choice: họ không được bán
  rationale: Dạng bị động trong ngữ cảnh luật pháp diễn tả lệnh cấm; “không được” tự nhiên và rõ tính quy phạm trong tiếng Việt hiện đại.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: như người ta bán nô lệ
  rationale: Cụm từ chỉ cách thức hay loại giao dịch mua bán nô lệ. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ rõ lệnh cấm đối xử với họ như nô lệ thông thường.
theological_decisions:
- issue: Cách dịch עֶבֶד / עֲבָדַי khi câu vừa nói đến việc thuộc về Đức Chúa Trời vừa cấm mua bán con người như tài sản
  choice: nô lệ
  alternative: tôi tớ
  rationale: Trong câu này, địa vị lệ thuộc và ý niệm quyền sở hữu là nền tảng trực tiếp của lệnh cấm mua bán. “Nô lệ” giữ được sức nặng xã hội-pháp lý ấy; chú thích nêu “tôi tớ” là nghĩa có thể có mà không làm mất sự căng thẳng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” giữ lời phán trực tiếp của Đức Chúa Trời. Câu dùng thuật ngữ mạnh “nô lệ” để phản ánh bối cảnh pháp lý, nhưng chú thích bảo lưu khả năng dịch “tôi tớ” của cùng một từ Hê-bơ-rơ.
