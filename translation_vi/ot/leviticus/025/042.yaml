    rationale: Bản hiện tại không sai nghĩa, nhưng “theo cách người ta bán nô lệ” tự nhiên hơn và phản ánh rõ hơn cụm danh từ chỉ phương thức giao dịch trong tiếng Hê-bơ-rơ.
