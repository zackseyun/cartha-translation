review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng mạch lý do của כִּי, quan hệ sở thuộc trong עֲבָדַי, hành động Đức Chúa Trời đưa họ ra khỏi Ai Cập, và lệnh cấm bị động trong ngữ cảnh luật pháp. “Nô lệ” là lựa chọn có thể biện minh trong câu này vì cụm cuối nói trực tiếp về việc mua bán nô lệ. Tuy nhiên, cụm מִמְכֶּרֶת עָבֶד nói về cách thức/loại hình mua bán nô lệ; thêm “theo cách” làm rõ quan hệ này hơn mà không diễn giải quá mức.
  naturalness: “Họ là nô lệ của Ta” tự nhiên và gọn hơn “họ là những nô lệ của Ta”. “Họ không được bán theo cách người ta bán nô lệ” là tiếng Việt hiện đại, trang trọng, và minh thị rằng điều bị cấm là kiểu giao dịch chứ không phải phủ nhận địa vị “nô lệ của Ta” vừa nêu.
  terminology: Giữ “nô lệ” nhất quán cho עֲבָדַי và עָבֶד, đồng thời chú thích bảo lưu khả năng từ vựng “tôi tớ”. “Ta” phù hợp với lời phán thần linh trong văn cảnh Kinh Thánh. “Đất Ai Cập” là cách gọi chuẩn và gần nguyên ngữ.
