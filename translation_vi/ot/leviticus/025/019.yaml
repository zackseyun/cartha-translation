source:
  edition: WLC
  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: vi
  text: Đất sẽ sinh hoa lợi, anh em sẽ ăn no nê và sống an toàn trên đất ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנָה
  choice: sẽ sinh
  rationale: Động từ נתן có nghĩa cơ bản là “ban/cho”; khi chủ ngữ là đất và bổ ngữ là hoa lợi, “sinh” diễn đạt tự nhiên việc đất đem lại sản vật mà không làm mất hình ảnh nguồn cung ứng.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Trong Lê-vi Ký 25, từ này chỉ miền đất nơi dân cư trú và canh tác, không phải toàn thể trái đất.
- source_word: פִּרְיָהּ
  choice: hoa lợi
  rationale: פְּרִי theo nghĩa đen là “trái/quả”, nhưng ở đây bao quát sản vật nông nghiệp của đất; “hoa lợi” vừa tự nhiên vừa giữ sắc thái thành quả do đất sinh ra.
- source_word: וַאֲכַלְתֶּם
  choice: anh em sẽ ăn
  rationale: Giữ ngôi thứ hai số nhiều của tiếng Hê-bơ-rơ; “anh em” là cách xưng hô rõ ràng, trang trọng và dễ hiểu trong mạch luật pháp.
- source_word: לָשֹׂבַע
  choice: no nê
  rationale: שֹׂבַע chỉ sự no đủ, thỏa mãn; “ăn no nê” chuyển tải trực tiếp ý ăn đến mức đầy đủ.
- source_word: וִישַׁבְתֶּם
  choice: sống
  rationale: ישב có thể mang nghĩa ngồi, cư ngụ hoặc sinh sống; “sống” tự nhiên trong tiếng Việt và trong ngữ cảnh định cư trên đất.
- source_word: לָבֶטַח
  choice: an toàn
  rationale: בֶּטַח diễn tả tình trạng yên ổn, không bị đe dọa; “sống an toàn” là kết hợp từ tự nhiên và sát nghĩa.
- source_word: עָלֶיהָ
  choice: trên đất ấy
  rationale: Đại từ giống cái số ít quay lại הָאָרֶץ; lặp “đất ấy” giúp câu tiếng Việt rõ nghĩa hơn đại từ “nó” và giữ giới từ “trên” của nguyên văn.
theological_decisions: []
