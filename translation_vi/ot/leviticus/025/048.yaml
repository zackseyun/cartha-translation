base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: vi
  text: Sau khi đã bị bán, người ấy vẫn có thể được chuộc lại; một trong các anh em của người ấy có thể chuộc người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc hiểu rộng hơn: “một trong những người bà con của người ấy có thể chuộc người ấy.” Tiếng Hê-bơ-rơ nói sát nghĩa là “một trong các anh em của người ấy,” chỉ một người nam trong thân tộc đứng ra làm người chuộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: Sau khi đã bị bán
  rationale: Diễn đạt tự nhiên quan hệ thời gian của אַחֲרֵי cùng thể bị động Nifal của מכר, chỉ hoàn cảnh sau khi việc bán đã xảy ra.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: người ấy vẫn có thể được chuộc lại
  rationale: Chuyển cấu trúc danh từ–hiện hữu ‘sự chuộc sẽ có cho người ấy’ thành câu tiếng Việt tự nhiên, đồng thời giữ ý quyền hoặc khả năng được chuộc vẫn còn sau khi bị bán.
- source_word: אֶחָד מֵאֶחָיו
  choice: một trong các anh em của người ấy
  rationale: Giữ nghĩa trực tiếp, giống đực và quan hệ thân tộc của ‘một người trong số các anh em của người ấy’; chú thích nêu phạm vi pháp lý rộng hơn của người bà con có quyền chuộc.
- source_word: יִגְאָלֶנּוּ
  choice: có thể chuộc người ấy
  rationale: Động từ גאל chỉ hành động chuộc của thân thuộc; ‘chuộc’ giữ sắc thái pháp lý và phù hợp với mệnh đề quy định quyền thực hiện hành động này.
theological_decisions:
- issue: Phạm vi của אֶחָיו trong luật chuộc thân
  choice: các anh em của người ấy
  alternative: những người bà con của người ấy
  rationale: Bản văn dùng danh từ giống đực số nhiều ‘anh em’, nên bản chính giữ cách gọi cụ thể này thay vì âm thầm mở rộng. Chú thích giải thích rằng trong bối cảnh pháp lý, từ này có thể chỉ người nam thuộc thân tộc làm người chuộc.
- issue: Sắc thái của גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: vẫn có thể được chuộc lại
  alternative: sẽ có quyền được chuộc lại
  rationale: Cách chọn diễn đạt tự nhiên ý sự chuộc vẫn dành sẵn cho người đã bị bán, nhưng không biến câu thành một khẳng định rằng việc chuộc chắc chắn sẽ xảy ra.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng ‘người ấy’ để tránh đại từ thiếu trang trọng; thêm ‘vẫn’ làm rõ rằng quyền hoặc khả năng được chuộc còn hiệu lực sau khi người ấy bị bán. Dấu chú thích [a] đặt sau toàn mệnh đề liên quan để không làm gián đoạn câu.
