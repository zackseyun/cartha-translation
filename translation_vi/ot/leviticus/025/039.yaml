  rationale: Chỉ điều chỉnh cách diễn đạt quan hệ עִמָּךְ cho tự nhiên và trung tính hơn trong tiếng Việt, đồng thời lược bỏ chi tiết “vì nợ” khỏi chú thích để không vượt quá điều nguyên văn trực tiếp nói. Các thuật ngữ chủ chốt và các neo chú thích được giữ nguyên.
