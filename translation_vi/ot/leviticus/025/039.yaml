  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִֽי יָמ֥וּךְ אָחִ֛י/ךָ עִמָּ֖/ךְ וְ/נִמְכַּר לָ֑/ךְ לֹא תַעֲבֹ֥ד בּ֖/וֹ עֲבֹ֥דַת עָֽבֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: vi
  text: Nếu người anh em của anh lâm cảnh nghèo khó ở cùng anh và bán mình cho anh[b], anh không được bắt người ấy phục dịch như một nô lệ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “anh không được bắt người ấy làm công việc của một nô lệ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và bị bán cho anh”; tiếng Hê-bơ-rơ dùng dạng bị động, nhưng trong ngữ cảnh này có thể chỉ việc một người nghèo tự bán mình cho anh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một trường hợp luật định có điều kiện; tiếng Việt không cần dịch riêng liên từ וְ để câu tự nhiên.
- source_word: יָמוּךְ
  choice: lâm cảnh nghèo khó
  rationale: Diễn tả việc rơi vào hoàn cảnh túng thiếu, vừa rõ nghĩa khởi phát vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: אָחִיךָ
  choice: người anh em của anh
  rationale: Giữ hình ảnh thân tộc của nguyên văn, vốn trong ngữ cảnh này chỉ một người thuộc cộng đồng giao ước, thay vì diễn giải thẳng thành “đồng bào Israel”.
- source_word: עִמָּךְ
  choice: ở bên anh
  rationale: Giữ quan hệ gần gũi với người được luật pháp trực tiếp nói đến mà không thêm ý nghĩa cụ thể như cư trú trong nhà hay thuộc quyền sở hữu.
- source_word: וְנִמְכַּר לָךְ
  choice: và bán mình cho anh
  rationale: Thể bị động của động từ có thể dịch sát là “được/bị bán cho anh”, nhưng trong luật về cảnh nghèo khó, thành ngữ này chỉ việc người ấy tự bán sức lao động để trả nợ. Chú thích bảo lưu cách đọc bị động.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: anh không được bắt người ấy phục dịch
  rationale: Cấu trúc diễn tả việc buộc hoặc sử dụng người khác để lao động; “bắt… phục dịch” truyền đạt rõ lệnh cấm.
- source_word: עֲבֹדַת עָבֶד
  choice: như một nô lệ
  rationale: Cụm từ sát nghĩa là “công việc của một nô lệ”; cách dịch chính nêu rõ người nghèo không được đối xử theo địa vị và chế độ lao động của nô lệ.
theological_decisions:
- issue: Thuật ngữ chỉ địa vị lao dịch trong luật về người Israel mắc nợ
  choice: Dùng “nô lệ” trong mệnh lệnh cấm
  alternative: “đầy tớ” hoặc “người phục vụ”
  rationale: עֶבֶד tại đây nói đến địa vị bị lệ thuộc và loại lao động gắn với địa vị ấy, không chỉ sự phục vụ nói chung. “Nô lệ” giữ nguyên sức nặng của lệnh cấm, đồng thời câu không phủ nhận rằng người nghèo bước vào một hình thức phục vụ có thời hạn.
- issue: Chủ thể của hành động bán
  choice: Trong câu chính dùng “bán mình”, kèm chú thích về dạng bị động
  alternative: “bị bán cho anh”
  rationale: Nguyên văn dùng thể Niphal, cho phép cách dịch bị động; tuy nhiên, bối cảnh nghèo khó phù hợp với thành ngữ chỉ việc tự bán mình vào cảnh lao dịch vì nợ. Chú thích giữ lại tính mơ hồ ngữ pháp thay vì loại bỏ cách hiểu kia.
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại. Dùng “anh” theo số ít của nguyên văn và “người anh em” để giữ ngôn ngữ thân tộc; tránh các đại từ cổ như “ngươi” và tránh uyển ngữ làm nhẹ nghĩa của “nô lệ”.
