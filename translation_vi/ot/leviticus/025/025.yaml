source:
  edition: WLC
  text: כִּֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָכַ֖ר מֵ/אֲחֻזָּת֑/וֹ וּ/בָ֤א גֹֽאֲל/וֹ֙ הַ/קָּרֹ֣ב אֵלָ֔י/ו וְ/גָאַ֕ל אֵ֖ת מִמְכַּ֥ר אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: vi
  text: “Nếu người anh em của anh lâm cảnh nghèo túng và bán một phần đất gia nghiệp của mình[a], thì người bà con gần nhất có quyền chuộc lại sẽ đến[b] và chuộc lại phần đất người anh em ấy đã bán.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đất gia nghiệp” là phần đất được truyền lại trong gia tộc theo sự phân chia đất đai của Y-sơ-ra-ên.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “có thể đến và chuộc lại”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּךְ
  choice: lâm cảnh nghèo túng
  rationale: Diễn đạt tự nhiên sự sa sút về kinh tế mà động từ Hê-bơ-rơ chỉ đến trong bối cảnh luật pháp này.
- source_word: אָחִיךָ
  choice: người anh em của anh
  rationale: Giữ nguyên hình ảnh thân tộc của nguyên văn và ngôi thứ hai số ít, thay vì diễn giải thành “đồng bào” hay “người Y-sơ-ra-ên”.
- source_word: מֵאֲחֻזָּתוֹ
  choice: một phần đất gia nghiệp của mình
  rationale: Trong bối cảnh Lê-vi Ký 25, אֲחֻזָּה là phần đất thuộc quyền sở hữu lâu dài của gia tộc trong cơ chế phân chia đất của Y-sơ-ra-ên, chứ không chỉ là tài sản nói chung.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: người bà con gần nhất có quyền chuộc lại
  rationale: Thể hiện cả quan hệ thân tộc, thứ tự ưu tiên của người gần nhất và chức năng pháp lý của גאל, đồng thời tránh một thuật ngữ ghép khó hiểu đối với độc giả phổ thông.
- source_word: וּבָא
  choice: sẽ đến
  rationale: Trong điều luật theo tình huống, động từ nối tiếp trình bày hành động được trông đợi của người có quyền chuộc; chú thích giữ lại khả năng hiểu theo sắc thái cho phép.
- source_word: וְגָאַל
  choice: chuộc lại
  rationale: Giữ nội dung pháp lý và âm hưởng rộng hơn của động từ גאל, đồng thời nói rõ đây là việc thu hồi tài sản đã bán.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: phần người anh em ấy đã bán
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ theo tiếng Việt tự nhiên, hiểu מִמְכָּר là vật/phần tài sản đã được bán.
theological_decisions:
- issue: Phạm vi của từ ngữ thân tộc trong luật Y-sơ-ra-ên
  choice: người anh em của anh
  alternative: đồng bào của anh; người cùng dân tộc với anh
  rationale: Nguyên văn dùng từ “anh em”. Dù trong luật giao ước từ này có thể chỉ một người Y-sơ-ra-ên khác, bản dịch không thu hẹp hoặc trung tính hóa hình ảnh thân tộc.
- issue: Cách chuyển thuật ngữ גאל
  choice: người bà con gần nhất có quyền chuộc lại / chuộc lại
  alternative: người cứu chuộc gần nhất; người bà con có bổn phận mua lại
  rationale: Cách dịch đã chọn bảo tồn quan hệ gia tộc và chức năng pháp lý mà không biến hành động thành một giao dịch thương mại thuần túy hoặc áp đặt nghĩa cứu rỗi thần học lên câu luật đất đai.
- issue: Lực tình thái của וּבָא trong điều luật theo tình huống
  choice: sẽ đến, kèm chú thích về cách hiểu “có thể đến”
  alternative: có thể đến; phải đến
  rationale: Cấu trúc Hê-bơ-rơ có thể được đọc như diễn tiến pháp lý được quy định hoặc như quyền được thực hiện. Bản chính dùng lối phát biểu trực tiếp, còn chú thích bảo tồn cách hiểu nhẹ hơn mà không tuyệt đối hóa nghĩa vụ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Đất gia nghiệp” giữ bối cảnh sở hữu đất theo dòng họ; phần giải thích được đưa vào chú thích. Đại từ “anh” phản ánh ngôi thứ hai số ít giống đực của nguyên văn, còn “người anh em” giữ ngôn ngữ thân tộc của điều luật.
