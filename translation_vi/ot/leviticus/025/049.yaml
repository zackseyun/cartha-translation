  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: vi
  text: hoặc chú hoặc bác của người ấy có thể chuộc người ấy; hoặc con trai của chú hoặc bác của người ấy có thể chuộc người ấy; hoặc một người thân cận về huyết thống, thuộc thị tộc của người ấy, có thể chuộc người ấy; hoặc nếu người ấy có đủ phương tiện[a], người ấy có thể tự chuộc mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “nếu người ấy trở nên khá giả.” Nguyên văn: “nếu tay người ấy đạt tới.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹדוֹ
  choice: chú bác của người ấy
  rationale: Trong luật về quyền chuộc của thân tộc, từ này chỉ chú hoặc bác trai. Cách dịch ghép “chú bác” giữ được phạm vi mà tiếng Việt không có một danh từ đơn nhất tương ứng.
- source_word: בֶן דֹּדוֹ
  choice: con trai của chú bác người ấy
  rationale: Dịch sát cấu trúc Hê-bơ-rơ, đồng thời diễn đạt rõ quan hệ thân tộc; trong tiếng Việt tự nhiên, đây là anh hoặc em họ của người ấy.
- source_word: יִגְאָלֶנּוּ
  choice: có thể chuộc người ấy
  rationale: “Chuộc” duy trì thuật ngữ pháp lý-thần học của gốc גאל xuyên suốt chương; “có thể” phù hợp với chuỗi những người có quyền thực hiện việc chuộc.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: một người bà con huyết thống gần gũi
  rationale: Thành ngữ chỉ một thân nhân gần về huyết thống; cách dịch này truyền đạt ý nghĩa mà không dịch cứng hình ảnh “thịt”.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: trong thị tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc rộng hơn gia đình hạt nhân; “thị tộc” phù hợp với cơ cấu xã hội-pháp lý của Y-sơ-ra-ên cổ.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: tay người ấy đạt tới đủ khả năng
  rationale: Giữ hình ảnh “tay” và động từ “đạt tới” của nguyên văn, đồng thời thêm “đủ khả năng” để thành ngữ có thể hiểu được trong tiếng Việt.
- source_word: וְנִגְאָל
  choice: người ấy có thể tự chuộc mình
  rationale: Hình thức Hê-bơ-rơ là bị động, nhưng trong văn cảnh người mắc nợ đã có đủ phương tiện, ý nghĩa tự chuộc được diễn đạt tự nhiên như vậy trong tiếng Việt.
theological_decisions:
- issue: Thuật ngữ chuộc của thân tộc
  choice: Dùng “chuộc” nhất quán cho גאל.
  alternative: mua lại; giải thoát
  rationale: “Chuộc” bảo toàn mối liên hệ từ vựng và nội dung pháp lý-thần học của luật chuộc trong cả chương.
- issue: Thành ngữ הִשִּׂיגָה יָדוֹ
  choice: 'Giữ hình ảnh bàn tay: “nếu tay người ấy đạt tới đủ khả năng.”'
  alternative: nếu người ấy trở nên khá giả; nếu người ấy có đủ phương tiện
  rationale: Nguyên văn dùng một thành ngữ cụ thể về “tay”; bản dịch giữ hình ảnh ấy nhưng có chú thích để tránh tối nghĩa.
- issue: Giá trị của וְנִגְאָל
  choice: Diễn đạt theo nghĩa tự chuộc trong văn cảnh.
  alternative: người ấy sẽ được chuộc
  rationale: Dạng động từ có thể được biểu đạt thụ động, nhưng chủ thể vừa có đủ phương tiện chính là người thực hiện việc chuộc mình; chú thích nêu rõ khả năng dịch sát hình thức.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng dễ hiểu. Dùng “người ấy” để tránh đại từ mang sắc thái khẩu ngữ; “chú bác” bao quát quan hệ chú hoặc bác trai; “thị tộc” diễn tả nhóm thân tộc rộng. Dấu [a] được đặt ngay sau thành ngữ cần giải thích.
