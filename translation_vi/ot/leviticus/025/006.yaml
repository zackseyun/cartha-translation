revisions:
- from: 'Sản vật trong kỳ đất nghỉ sa-bát sẽ dùng làm lương thực cho các ngươi: cho ngươi, tôi tớ nam, tôi tớ nữ, người làm thuê và ngoại kiều cư trú với ngươi.[a]'
  to: 'Sản vật của đất trong năm sa-bát sẽ làm lương thực cho các ngươi: cho ngươi, cho nô lệ nam và nô lệ nữ của ngươi, cho người làm thuê của ngươi, và cho người ngoại kiều đang cư trú với ngươi.[a]'
  rationale: Sửa cách gọi các thành viên lệ thuộc trong gia hộ thành “nô lệ nam/nữ” để duy trì sự phân biệt với “người làm thuê” của bản Hê-bơ-rơ. Chỉnh cụm mở đầu và chú thích để tiếng Việt tự nhiên hơn, đồng thời giữ cả nghĩa sát chữ lẫn nghĩa quy chiếu theo ngữ cảnh của “sa-bát của đất.”
