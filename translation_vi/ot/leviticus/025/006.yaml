  text: וְ֠/הָיְתָה שַׁבַּ֨ת הָ/אָ֤רֶץ לָ/כֶם֙ לְ/אָכְלָ֔ה לְ/ךָ֖ וּ/לְ/עַבְדְּ/ךָ֣ וְ/לַ/אֲמָתֶ֑/ךָ וְ/לִ/שְׂכִֽירְ/ךָ֙ וּ/לְ/תוֹשָׁ֣בְ/ךָ֔ הַ/גָּרִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: vi
  text: 'Sản vật của đất trong năm sa-bát sẽ làm lương thực cho các ngươi: cho ngươi, cho nô lệ nam và nô lệ nữ của ngươi, cho người làm thuê của ngươi, và cho người ngoại kiều đang cư trú với ngươi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nói sát chữ là “sa-bát của đất”; theo ngữ cảnh, cụm này chỉ sản vật đất đai sinh ra trong năm đất nghỉ sa-bát. Câu chuyển từ “các ngươi” số nhiều sang “ngươi” số ít khi liệt kê những người được hưởng dùng sản vật ấy.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְהָיְתָה
  choice: sẽ dùng làm
  rationale: Trong văn luật, dạng động từ này hướng tới hiệu lực của quy định; cách diễn đạt này tự nhiên trong tiếng Việt và nối rõ với לְאָכְלָה.
- source_word: שַׁבַּת הָאָרֶץ
  choice: sản vật trong kỳ đất nghỉ sa-bát
  rationale: Nghĩa đen là “sa-bát của đất”, nhưng trong ngữ cảnh điều được dùng làm thức ăn là hoa lợi đất tự sinh trong năm đất nghỉ. Bản dịch giữ mối liên hệ với kỳ sa-bát mà không khiến người đọc hiểu chính sự nghỉ ngơi là thức ăn.
- source_word: לָכֶם לְאָכְלָה
  choice: dùng làm lương thực cho các ngươi
  rationale: Diễn đạt mục đích sử dụng “để ăn/làm lương thực” và giữ số nhiều của לָכֶם.
- source_word: לְךָ
  choice: cho ngươi
  rationale: Giữ sự chuyển đổi có thật trong bản Hê-bơ-rơ từ đại từ số nhiều “các ngươi” sang số ít “ngươi”, thay vì âm thầm đồng nhất hóa.
- source_word: עַבְדְּךָ
  choice: tôi tớ nam
  rationale: עבד có thể chỉ người hầu hoặc nô lệ tùy bối cảnh. “Tôi tớ nam” giữ sắc thái lệ thuộc trong gia hộ, phân biệt giới tính với אמה, nhưng không xác quyết quá mức một địa vị pháp lý mà riêng câu này không giải quyết.
- source_word: אֲמָתֶךָ
  choice: tôi tớ nữ
  rationale: Giữ cặp đối ứng nam–nữ của nguyên văn bằng ngôn ngữ hiện đại, rõ ràng.
- source_word: שְׂכִירְךָ
  choice: người làm thuê
  rationale: Chỉ người lao động nhận công, phân biệt với các tôi tớ thuộc gia hộ.
- source_word: תוֹשָׁבְךָ הַגָּרִים עִמָּךְ
  choice: ngoại kiều cư trú với ngươi
  rationale: תוֹשָׁב chỉ người cư trú không thuộc dân bản địa; phân từ הַגָּרִים bổ nghĩa bằng ý đang sống/cư trú cùng người được nói đến. “Ngoại kiều” truyền đạt cả địa vị người ngoài lẫn sự cư trú.
theological_decisions:
- issue: Địa vị của עבד và אמה trong luật Y-sơ-ra-ên
  choice: Dịch là “tôi tớ nam” và “tôi tớ nữ”, đồng thời phân biệt với “người làm thuê”.
  alternative: Dịch là “nô lệ nam” và “nô lệ nữ”.
  rationale: Các từ này bao quát phổ nghĩa tôi tớ/nô lệ. Câu này nhấn mạnh mọi thành viên lệ thuộc trong gia hộ đều được hưởng sản vật, nhưng tự nó không xác định đầy đủ hình thức lệ thuộc. Cách chọn không xóa sự khác biệt với lao động làm thuê và cũng không áp đặt một mô hình chế định duy nhất.
- issue: Quan hệ giữa “sa-bát của đất” và sản vật dùng làm thức ăn
  choice: Nêu rõ “sản vật trong kỳ đất nghỉ sa-bát”.
  alternative: Giữ nguyên sát chữ “sa-bát của đất”.
  rationale: Chủ thể có thể dùng làm lương thực theo ngữ cảnh là hoa lợi trong năm nghỉ. Cách dịch làm sáng nghĩa quy chiếu nhưng vẫn giữ ý đất nghỉ sa-bát, không biến câu thành một tuyên bố thần học khác.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “sa-bát” để giữ thuật ngữ Kinh Thánh quen thuộc; dùng “lương thực”, “người làm thuê” và “ngoại kiều cư trú” theo tiếng Việt hiện đại. Dấu hai chấm làm rõ danh sách những người được phép dùng sản vật.
