revisions:
- from: Nhưng cánh đồng thuộc vùng đất chăn thả của các thành họ không được bán[a], vì đó là phần sản nghiệp vĩnh viễn của họ.[b]
  to: Nhưng đất chăn thả[a] quanh các thành của họ không được bán, vì đó là sản nghiệp lâu dài của họ.[b]
  rationale: Bản sửa thay chuỗi sở thuộc gượng ép bằng cách diễn đạt tự nhiên “đất chăn thả quanh các thành của họ”, vốn nêu rõ khu đất được nói đến trong văn cảnh thành Lê-vi. Chú thích từ vựng được neo đúng tại “đất chăn thả”. “Sản nghiệp lâu dài” phản ánh lực pháp lý bền vững của אֲחֻזַּת עוֹלָם, đồng thời chú thích bảo lưu các cách hiểu “vĩnh viễn/đời đời”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:40Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng mệnh lệnh không được bán và lý do nêu phần đất ấy là אֲחֻזַּת עוֹלָם của họ. Tuy nhiên, “cánh đồng thuộc vùng đất chăn thả” là một chuỗi sở thuộc thiếu tự nhiên trong tiếng Việt và làm quan hệ giữa שְׂדֵה với מִגְרַשׁ khó hiểu. “Đất chăn thả quanh các thành của họ” diễn đạt đúng thực thể là khu đất mở/grazing land gắn với các thành Lê-vi; chú thích giữ các khả năng từ vựng khác. “Lâu dài” cho עוֹלָם phù hợp văn cảnh luật đất đai hơn “vĩnh viễn”, vốn có thể gợi tính tuyệt đối quá mức.
  naturalness: Cần đặt chú thích từ vựng ngay sau cụm “đất chăn thả”, thay vì sau động từ “bán”. Câu sửa giữ văn phong pháp luật trang trọng, hiện đại và tránh lối nói không tự nhiên “các thành họ”.
  terminology: “Đất chăn thả” là cách dịch rõ ràng cho מִגְרַשׁ trong ngữ cảnh các thành Lê-vi; “đất chung” và “đất trống” được bảo lưu trong chú thích. “Sản nghiệp lâu dài” truyền đạt אֲחֻזַּת עוֹלָם như một quyền giữ đất bền vững/không được chuyển nhượng, không áp đặt nghĩa siêu hình của “vĩnh viễn”. “Lê-vi” là cách viết tên gọi thông dụng và nhất quán.
