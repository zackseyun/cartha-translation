id: LEV.25.34
reference: Leviticus 25:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: vi
  text: Nhưng đất chăn thả[a] quanh các thành của họ không được bán, vì đó là sản nghiệp lâu dài của họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đất chăn thả” cũng có thể dịch là “đất chung” hoặc “đất trống”, chỉ khu đất bao quanh các thành của người Lê-vi.
    reason: lexical_alternative
  - marker: b
    text: “Lâu dài” cũng có thể dịch là “vĩnh viễn” hoặc “đời đời”. Từ Hê-bơ-rơ ở đây nhấn mạnh địa vị bền vững, không được chuyển nhượng của phần đất này.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה
  choice: Nhưng cánh đồng
  rationale: Giữ danh từ שָׂדֶה là “cánh đồng”; liên từ וּ được dịch là “nhưng” để thể hiện sự tương phản với quy định ngay trước đó.
- source_word: מִגְרַשׁ
  choice: vùng đất chăn thả
  rationale: Chỉ khu đất trống bao quanh các thành của người Lê-vi, thường dùng làm đồng cỏ; cách diễn đạt này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: עָרֵיהֶם
  choice: thuộc ... các thành họ
  rationale: Diễn đạt quan hệ sở thuộc trong chuỗi cấu trúc Hê-bơ-rơ, tức vùng đất gắn với các thành của họ.
- source_word: לֹא יִמָּכֵר
  choice: không được bán
  rationale: Thể bị động của מכר cùng phủ định mang lực pháp lý cấm bán.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do của lệnh cấm.
- source_word: אֲחֻזַּת עוֹלָם
  choice: phần sản nghiệp vĩnh viễn
  rationale: אֲחֻזָּה là phần đất sở hữu/sản nghiệp; עוֹלָם nhấn mạnh địa vị lâu dài, không thể chuyển nhượng. Chú thích làm rõ sắc thái pháp lý để tránh hiểu quá mức theo nghĩa siêu hình.
- source_word: הוּא לָהֶם
  choice: đó là ... của họ
  rationale: Đại từ số ít quy chiếu về cánh đồng/vùng đất và cụm לָהֶם biểu thị quyền thuộc về họ.
theological_decisions:
- issue: Sắc thái của עוֹלָם trong luật đất đai của Y-sơ-ra-ên
  choice: Dịch “vĩnh viễn” nhưng chú thích là địa vị lâu dài, không thể chuyển nhượng
  alternative: phần sản nghiệp lâu dài; phần sở hữu đời đời
  rationale: Giữ được sức nặng của עוֹלָם và tính trang trọng của văn bản, đồng thời chú thích bảo toàn khả năng từ này chỉ sự trường tồn trong khuôn khổ luật giao ước, không nhất thiết là một khẳng định về sự vô tận siêu hình.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Cấu trúc “cánh đồng thuộc vùng đất chăn thả” giữ cả שָׂדֶה và מִגְרָשׁ, dù hơi dày hơn cách nói rút gọn; các chú thích nêu rõ những phương án từ vựng và sắc thái của עוֹלָם.
