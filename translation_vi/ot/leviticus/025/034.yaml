    rationale: Neo phải đứng ngay sau từ/cụm từ mà chú thích giải thích để tránh mơ hồ.
  - severity: medium
    issue: “Vĩnh viễn” có thể diễn đạt עוֹלָם quá tuyệt đối trong bối cảnh quy định pháp lý.
