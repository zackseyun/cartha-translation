  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: vi
  text: Trong Năm Hân Hỉ này, mỗi người trong các ngươi phải trở về phần sản nghiệp của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “phần sở hữu của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: Trong Năm Hân Hỉ này
  rationale: Cụm giới từ בִּשְׁנַת diễn tả thời gian; הַזֹּאת bổ nghĩa cho năm được nói đến. “Năm Hân Hỉ” là cách gọi trang trọng, dễ hiểu cho thiết chế יוֹבֵל trong Lê-vi Ký 25.
- source_word: תָּשֻׁבוּ
  choice: phải trở về
  rationale: Động từ ngôi hai số nhiều trong điều luật mang sắc thái mệnh lệnh. “Phải” thể hiện nghĩa vụ, còn “trở về” giữ nghĩa cơ bản của שׁוב.
- source_word: אִישׁ
  choice: mỗi người trong anh em
  rationale: אִישׁ được dùng theo nghĩa phân phối, chỉ từng người trong số những người đang được truyền lệnh. Cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ liên hệ với ngôi hai số nhiều của תָּשֻׁבוּ.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: về phần sản nghiệp của mình
  rationale: אֲחֻזָּה trong bối cảnh này là phần đất hoặc tài sản được nắm giữ lâu dài trong gia tộc. “Phần sản nghiệp” vừa phù hợp bối cảnh đất đai vừa tránh diễn giải quá mức; “của mình” quy chiếu tự nhiên về “mỗi người”.
theological_decisions:
- issue: Phạm vi chỉ người của אִישׁ dùng theo nghĩa phân phối
  choice: mỗi người trong anh em
  alternative: mỗi người nam
  rationale: Hình thức Hê-bơ-rơ là giống đực số ít, nhưng trong cấu trúc này chức năng chính là phân phối mệnh lệnh cho từng người thuộc cộng đồng được nói với. Bản dịch không khẳng định thêm rằng điều luật chỉ áp dụng cho nam giới, đồng thời “anh em” vẫn phản ánh cách xưng hô với cộng đồng trong ngữ cảnh luật pháp.
- issue: Ý nghĩa của אֲחֻזָּה trong luật Năm Hân Hỉ
  choice: phần sản nghiệp
  alternative: phần sở hữu
  rationale: Ngữ cảnh chương 25 chủ yếu liên quan đến đất đai thuộc phần gia sản của gia tộc. “Sản nghiệp” thể hiện sắc thái ấy, nhưng chú thích giữ lại cách hiểu rộng và sát hình thức hơn là “phần sở hữu”.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Phải” diễn đạt nghĩa vụ rõ ràng; “mỗi người trong anh em” tự nhiên hơn lối dịch cứng “mỗi người nam”, còn “phần sản nghiệp” phù hợp bối cảnh phục hồi đất đai trong Lê-vi Ký 25.
