  source_fidelity: Bản dịch phản ánh đúng cấu trúc thời gian “trong Năm Hân Hỉ này”, tính quy phạm của động từ số nhiều, ý phân phối của אִישׁ, và hướng “trở về” đối với אֲחֻזָּתוֹ. “Phần sản nghiệp” phù hợp ngữ cảnh phục hồi phần đất/holding của gia tộc, không thu hẹp thành một loại tài sản cụ thể.
  naturalness: Cụm “mỗi người trong anh em” không tự nhiên trong tiếng Việt hiện đại và có thể bị hiểu là một nhóm người mang quan hệ anh em, thay vì những người được trực tiếp truyền lệnh. “Mỗi người trong các ngươi” vừa tự nhiên hơn trong văn phong luật pháp Kinh Thánh vừa biểu đạt được số nhiều của động từ Hê-bơ-rơ và tính phân phối của אִישׁ.
  terminology: “Năm Hân Hỉ” là thuật ngữ Kinh Thánh quen dùng cho יוֹבֵל. “Phần sản nghiệp” giữ được sắc thái phần sở hữu/gia sản; chú thích “phần sở hữu” cung cấp phương án từ vựng rộng hơn một cách thích hợp.
  issues:
