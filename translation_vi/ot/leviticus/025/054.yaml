id: LEV.25.54
reference: Leviticus 25:54
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: vi
  text: Nhưng nếu người ấy không được chuộc bằng những cách này[a], thì vào năm Hân Hỉ, người ấy cùng các con trai mình sẽ được tự do ra đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “bằng những điều này”, chỉ về các quy định chuộc đã nêu trong những câu trước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Nối tiếp các quy định trước đó và biểu thị sự tương phản nhẹ với những khả năng chuộc đã nêu.
- source_word: יִגָּאֵל
  choice: được chuộc
  rationale: Dạng Nifal của גאל chỉ việc được người thân chuộc lại hoặc được chuộc bằng khoản thanh toán trong bối cảnh luật pháp này.
- source_word: בְּאֵלֶּה
  choice: bằng những cách này
  rationale: Đại từ chỉ định có giới từ quy chiếu về các cách thức chuộc đã được trình bày; cách dịch này tự nhiên trong tiếng Việt nhưng vẫn giữ khả năng dịch sát là “bằng những điều này” trong chú thích.
- source_word: וְיָצָא
  choice: sẽ được tự do ra đi
  rationale: Nghĩa đen là “sẽ đi ra”; trong bối cảnh phục dịch, cụm này chỉ việc được ra khỏi tình trạng lệ thuộc. Thêm “được tự do” làm rõ hàm ý pháp lý mà không đổi nội dung.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: vào năm Hân Hỉ
  rationale: Dùng thuật ngữ tiếng Việt trang trọng, dễ hiểu cho יוֹבֵל, chỉ năm giải phóng và hoàn trả theo luật Lê-vi.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: người ấy cùng các con trai mình
  rationale: Giữ rõ danh từ giống đực בָנָיו là “các con trai”, đồng thời diễn đạt tự nhiên ý họ cùng ra đi với người ấy.
theological_decisions:
- issue: Danh từ chỉ người trong gia đình בָנָיו có giống đực
  choice: các con trai mình
  alternative: các con mình
  rationale: Nguyên văn dùng danh từ số nhiều giống đực “các con trai”; bản dịch không mở rộng thành thuật ngữ trung tính về giới.
- issue: Hàm ý của động từ “đi ra” trong bối cảnh phục dịch
  choice: được tự do ra đi
  alternative: đi ra
  rationale: Cụm từ chỉ sự chấm dứt tình trạng phục dịch vào năm Hân Hỉ. Cách dịch nêu rõ hàm ý ngữ cảnh nhưng không biến nó thành một khẳng định thần học rộng hơn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại và dễ hiểu. Giữ thuật ngữ “chuộc” cùng cách gọi “năm Hân Hỉ”; bảo toàn từ ngữ có giống đực của nguyên văn và đánh dấu đầy đủ chú thích [a].
