base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: vi
  text: Người ấy phải tính toán với người đã mua người ấy, từ năm người ấy bán mình cho người kia[a] cho đến Năm Hân Hỉ. Giá bán của người ấy phải theo số năm; người ấy sẽ ở với người kia như một người làm thuê[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “từ năm người ấy được bán cho người kia.” Văn cảnh cho thấy người này đã bán mình để phục dịch.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “như những ngày của một người làm thuê, người ấy sẽ ở với người kia.” Ý so sánh là thời gian phục dịch được tính như lao động làm thuê, chứ không phải quyền sở hữu vĩnh viễn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: phải tính toán
  rationale: Động từ חשׁב trong ngữ cảnh này chỉ việc tính toán tài chính để xác định giá chuộc; “tính toán” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: קֹנֵהוּ
  choice: người đã mua mình
  rationale: Phân từ của קנה chỉ người mua hoặc người đã tiếp nhận người ấy theo giao dịch. Cách diễn đạt này giữ rõ tính chất giao dịch và tránh đại từ sở hữu thiếu tự nhiên.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: từ năm người ấy bán mình cho người kia
  rationale: Dạng bị động có thể dịch sát là “từ năm người ấy được bán cho người kia”, nhưng ngữ cảnh 25:47–49 cho thấy người nghèo tự bán mình vào phục dịch; cách dịch này diễn đạt tự nhiên mà vẫn ghi nhận cách hiểu hình thức trong chú thích.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: cho đến Năm Hân Hỉ
  rationale: Đây là tên của thiết chế יוֹבֵל trong Lê-vi Ký 25. “Năm Hân Hỉ” là cách gọi trang trọng, dễ hiểu và phân biệt năm đặc biệt này với niềm vui nói chung.
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: Giá bán người ấy
  rationale: כֶּסֶף theo nghĩa đen là bạc hoặc tiền, nhưng trong ngữ cảnh pháp lý này chỉ giá trị tiền của việc bán; “giá bán” truyền đạt đúng chức năng của khoản tiền.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: phải được tính theo số năm
  rationale: Cụm từ quy định giá trị phải được xác định tương ứng với số năm. Thêm “được tính” làm rõ quan hệ tính toán mà không vượt quá ý nguồn.
- source_word: כִּימֵי שָׂכִיר
  choice: như thời gian của một người làm thuê
  rationale: Cụm “như những ngày của người làm thuê” mang nghĩa khoảng thời gian phục dịch được định giá như lao động làm thuê; “thời gian” tự nhiên hơn trong tiếng Việt và vẫn giữ phép so sánh.
- source_word: יִהְיֶה עִמּוֹ
  choice: thời gian người ấy ở với người kia phải được kể
  rationale: Nguyên văn là “người ấy sẽ ở với người kia”. Trong cấu trúc so sánh này, cách dịch nêu rõ thời gian phục dịch được kể như của người làm thuê, tránh một câu tiếng Việt tối nghĩa.
theological_decisions:
- issue: Tư cách của người Y-sơ-ra-ên đã bán mình trong việc định giá chuộc
  choice: Diễn đạt thời gian ở với người mua như thời gian của người làm thuê
  alternative: 'Dịch sát từng chữ: “như những ngày của người làm thuê, người ấy sẽ ở với người kia”'
  rationale: Phép so sánh trong tiếng Hê-bơ-rơ đặt việc tính số năm trên cơ sở lao động làm thuê, không phải quyền sở hữu vĩnh viễn. Bản dịch làm rõ chức năng pháp lý này nhưng không thêm một tuyên bố thần học ngoài văn cảnh.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “người ấy/người kia” để phân biệt người được chuộc và người mua; giữ thuật ngữ “Năm Hân Hỉ” nhất quán với thiết chế trong Lê-vi Ký 25.
