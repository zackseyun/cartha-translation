revisions:
- from: Người ấy phải tính toán với người đã mua mình, từ năm người ấy bán mình cho người kia[a] cho đến Năm Hân Hỉ. Giá bán người ấy phải được tính theo số năm; thời gian người ấy ở với người kia phải được kể như thời gian của một người làm thuê[b].
  to: Người ấy phải tính toán với người đã mua người ấy, từ năm người ấy bán mình cho người kia[a] cho đến Năm Hân Hỉ. Giá bán của người ấy phải theo số năm; người ấy sẽ ở với người kia như một người làm thuê[b].
  rationale: Chỉnh mệnh đề cuối để giữ chủ ngữ, động từ «ở với», và phép so sánh của tiếng Hê-bơ-rơ, thay vì diễn giải nó thành một quy tắc “kể” thời gian. Đồng thời làm rõ tham chiếu đại từ ở «người đã mua người ấy». Các chú thích giữ lại phương án bị động hình thức của הִמָּכְרוֹ và cách diễn đạt sát của mệnh đề cuối.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:45Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cơ bản việc tính toán giữa người được bán và người mua, khoảng thời gian từ lúc bán đến Năm Hân Hỉ, và việc định giá theo số năm. Tuy nhiên, mệnh đề cuối nguyên văn nói trực tiếp rằng người ấy «sẽ ở với» người mua «như những ngày của người làm thuê». Cách diễn đạt «thời gian ... phải được kể» chuyển chủ ngữ và thêm một thao tác pháp lý không được nêu trực tiếp trong mệnh đề này.
  naturalness: «Người đã mua người ấy» rõ và tự nhiên hơn «người đã mua mình», vốn có thể thoáng gây mơ hồ về đối tượng của hành động mua. «Người ấy sẽ ở với người kia như một người làm thuê» là tiếng Việt hiện đại, sáng nghĩa, đồng thời giữ được khẳng định trực tiếp của nguyên văn.
  terminology: Giữ «Năm Hân Hỉ» như thuật ngữ của thiết chế יוֹבֵל trong ngữ cảnh Lê-vi Ký 25. «Người làm thuê» phản ánh sát שָׂכִיר. Không cần thay thuật ngữ thần học nào.
  issues:
  - severity: medium
    issue: Mệnh đề cuối được diễn giải thành việc “kể” thời gian.
    rationale: יִהְיֶה עִמּוֹ có chủ ngữ là người được bán và nghĩa trực tiếp là «người ấy sẽ ở với người kia»; «phải được kể» không tương ứng trực tiếp với động từ này, dù có thể suy ra trong văn cảnh định giá.
  - severity: low
    issue: Cụm «người đã mua mình» có thể mơ hồ.
    rationale: Trong tiếng Việt, «mình» đôi khi quy chiếu về chủ ngữ của mệnh đề quan hệ («người đã mua»). Lặp lại «người ấy» làm rõ người mua đã mua ai mà không đổi nghĩa.
