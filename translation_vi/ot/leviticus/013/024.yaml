base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: vi
  text: Hoặc nếu một người có vết bỏng do lửa trên da người ấy, và mô sống tại vết bỏng trở thành một đốm sáng, trắng pha đỏ hoặc trắng[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mô sống” dịch một thành ngữ Hê-bơ-rơ chỉ mô còn sống lộ ra tại vùng bị bỏng.
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ בָשָׂר כִּי יִהְיֶה
  choice: Hoặc nếu một người có
  rationale: אוֹ mở đầu một trường hợp thay thế trong luật chẩn định. בָשָׂר theo nghĩa đen là “thịt/thân thể”, nhưng ở đây dùng để chỉ người có vùng da bị thương; cách diễn đạt này tự nhiên trong tiếng Việt và không làm thay đổi đối tượng quy chiếu.
- source_word: בְּעֹרוֹ
  choice: trên da
  rationale: Giới từ và danh từ chỉ vị trí vết thương ở da của người được nói đến; tiếng Việt không cần lặp đại từ sở hữu.
- source_word: מִכְוַת אֵשׁ
  choice: vết bỏng do lửa
  rationale: Cụm kết hợp chỉ thương tích bỏng do lửa gây ra; “vết bỏng do lửa” rõ ràng và tự nhiên.
- source_word: וְהָיְתָה
  choice: trở thành
  rationale: Dạng động từ trong văn cảnh thủ tục tiếp tục mô tả diễn biến của trường hợp; “trở thành” giữ được sắc thái biến đổi.
- source_word: מִחְיַת הַמִּכְוָה
  choice: phần thịt sống ở chỗ bỏng
  rationale: מִחְיָה trong luật về bệnh ngoài da chỉ mô sống/lộ ra tại vùng tổn thương. “Phần thịt sống” là cách nói dễ hiểu, đồng thời giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ.
- source_word: בַּהֶרֶת
  choice: một đốm sáng
  rationale: Trong Lê-vi Ký 13, từ này chỉ một vùng hoặc đốm nổi bật, có vẻ sáng trên da; “đốm sáng” ngắn gọn và phù hợp thuật ngữ chẩn định.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: trắng pha đỏ
  rationale: Hai tính từ mô tả màu trắng có sắc đỏ. “Trắng pha đỏ” giữ thứ tự và sự phối màu mà không xác định quá mức sắc độ.
- source_word: אוֹ לְבָנָה
  choice: hoặc trắng
  rationale: Giữ nguyên lựa chọn màu thứ hai một cách trực tiếp.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “một người” thay cho cách dịch sát chữ “thịt/thân thể” để câu tiếng Việt tự nhiên; giữ thuật ngữ mô tả trực quan “phần thịt sống” và đặt chú thích nhằm tránh hiểu lầm.
