revisions:
- from: Thầy tế lễ sẽ khám người ấy; nếu thấy chỗ sưng của vết bệnh trên phần đầu hói phía sau hoặc phần đầu hói phía trước có màu trắng pha đỏ, trông giống bệnh ngoài da trên thân thể,[a][b]
  to: Thầy tế lễ sẽ khám người ấy và thấy rằng chỗ sưng của tổn thương có màu trắng pha đỏ trên phần đầu hói phía sau[a] hoặc phần đầu hói phía trước[a], giống biểu hiện của một chứng bệnh ngoài da trên da thịt[b].
  rationale: Sửa “nếu thấy” thành lời thuật quan sát để không thêm tính điều kiện vào tiếng Hê-bơ-rơ; điều chỉnh nhẹ cụm từ về tổn thương và da thịt; đồng thời đặt lại các neo chú thích theo đúng thuật ngữ được chú giải. Không áp đặt nhận diện y học hoặc diễn giải giáo phái cho צָרַעַת.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa cấu trúc “nếu thấy”: וְהִנֵּה không đặt điều kiện mà đánh dấu điều thầy tế lễ quan sát. Bản sửa dùng “và thấy rằng” để giữ quan hệ trần thuật/chẩn định. “Trắng pha đỏ,” sự đối lập giữa hai vùng hói, và cách tránh đồng nhất צָרַעַת với bệnh Hansen đều phù hợp.'
  naturalness: Bản sửa giữ văn phong hiện đại, rõ ràng và trang trọng. “Chỗ sưng của tổn thương” tự nhiên hơn “chỗ sưng của vết bệnh” trong ngữ cảnh khám xét.
  terminology: Giữ “thầy tế lễ”. Dùng “chứng bệnh ngoài da” cho צָרַעַת theo nghĩa rộng, có chú thích; “da thịt” phản ánh עוֹר בָּשָׂר rõ hơn “thân thể” đơn thuần. Các ký hiệu chú thích được đặt sát những từ ngữ liên quan.
  issues:
  - severity: medium
    issue: “nếu thấy” biến quan sát được thuật lại thành một mệnh đề điều kiện.
    rationale: וְהִנֵּה nghĩa là “này/kìa; xem đây,” giới thiệu phát hiện của việc khám, không phải “nếu”.
  - severity: low
    issue: Các ký hiệu chú thích hiện cùng đặt ở cuối câu, không neo vào thuật ngữ mà chúng giải thích.
    rationale: Chú thích về hai thuật ngữ hói đầu cần đặt tại cụm tương ứng; chú thích về צָרַעַת cần đặt tại “chứng bệnh ngoài da”.
  - severity: low
    issue: “trên thân thể” làm mờ thành tố “da” trong עוֹר בָּשָׂר.
    rationale: “Trên da thịt” giữ được cụm từ nguồn mà vẫn có thể hiểu được trong văn cảnh.
