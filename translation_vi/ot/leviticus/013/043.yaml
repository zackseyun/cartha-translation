  text: וְ/רָאָ֨ה אֹת֜/וֹ הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת הַ/נֶּ֨גַע֙ לְבָנָ֣ה אֲדַמְדֶּ֔מֶת בְּ/קָרַחְתּ֖/וֹ א֣וֹ בְ/גַבַּחְתּ֑/וֹ כְּ/מַרְאֵ֥ה צָרַ֖עַת ע֥וֹר בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: vi
  text: Thầy tế lễ sẽ khám người ấy và thấy rằng chỗ sưng của tổn thương có màu trắng pha đỏ trên phần đầu hói phía sau[a] hoặc phần đầu hói phía trước[a], giống biểu hiện của một chứng bệnh ngoài da trên da thịt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hai từ Hê-bơ-rơ chỉ chứng hói ở đây có lẽ phân biệt phần hói phía sau đầu với phần hói phía trước đầu.
    reason: cultural_note
  - marker: b
    text: Từ Hê-bơ-rơ צָרַעַת theo truyền thống thường được dịch là “bệnh phong”, nhưng trong Lê-vi Ký, từ này chỉ một phạm trù rộng hơn gồm nhiều chứng bệnh hoặc tổn thương da nghiêm trọng, chứ không riêng bệnh Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: sẽ khám
  rationale: Trong thủ tục chẩn định của Lê-vi Ký 13, động từ ראה mang nghĩa xem xét, khám; thể tương lai diễn đạt tự nhiên quy định pháp lý nối tiếp câu trước.
- source_word: וְהִנֵּה
  choice: nếu thấy
  rationale: Trong cấu trúc chẩn định, וְהִנֵּה giới thiệu điều được thầy tế lễ quan sát; 'nếu thấy' chuyển tải chức năng ấy tự nhiên hơn lối dịch sát 'kìa'.
- source_word: שְׂאֵת הַנֶּגַע
  choice: chỗ sưng của vết bệnh
  rationale: שְׂאֵת chỉ vùng nổi hoặc sưng, còn נגע là tổn thương hay tình trạng bệnh đang được khám; cách dịch giữ cả hai yếu tố.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: có màu trắng pha đỏ
  rationale: Giữ màu trắng là đặc điểm chính và dạng sắc đỏ nhạt/lẫn đỏ của אֲדַמְדֶּמֶת, đồng thời tự nhiên trong tiếng Việt.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: trên phần đầu hói phía sau hoặc phần đầu hói phía trước
  rationale: Hai danh từ có lẽ phân biệt vùng hói phía sau và phía trước đầu; bản dịch bảo tồn sự đối lập thay vì gộp chung.
- source_word: צָרַעַת
  choice: bệnh ngoài da
  rationale: Thuật ngữ này trong Lê-vi Ký bao quát nhiều chứng bệnh hoặc tổn thương da nghiêm trọng, không đồng nhất riêng với bệnh Hansen.
- source_word: עוֹר בָּשָׂר
  choice: trên thân thể
  rationale: Cụm Hê-bơ-rơ nói đến da thịt của thân thể; vì 'bệnh ngoài da' đã nêu yếu tố da, cách dịch này tránh lặp nặng nề.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'thầy tế lễ' theo cách gọi Kinh Thánh quen thuộc trong tiếng Việt; giữ cấu trúc thủ tục chẩn định nhưng tránh lối diễn đạt cổ như 'nầy' hoặc 'kìa'.
