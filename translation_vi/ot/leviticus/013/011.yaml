language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: vi
  text: Đó là một bệnh ngoài da đã lâu trên da thịt người ấy[a]. Thầy tế lễ phải tuyên bố người ấy là ô uế; thầy tế lễ không được cách ly người ấy, vì người ấy ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “một bệnh ngoài da đã có từ lâu.” Theo truyền thống, צָרַעַת thường được dịch là “bệnh phong,” nhưng trong Lê-vi Ký, thuật ngữ Hê-bơ-rơ này bao gồm nhiều tình trạng hơn bệnh Hansen ngày nay.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: bệnh ngoài da
  rationale: Thuật ngữ Hê-bơ-rơ trong Lê-vi Ký chỉ nhiều dạng tổn thương da nghiêm trọng, không riêng bệnh Hansen; cách dịch này tránh sự xác định y khoa sai lệch của từ “phong hủi”.
- source_word: נוֹשֶׁנֶת
  choice: lâu ngày
  rationale: Phân từ này diễn tả tình trạng đã có từ lâu hoặc kéo dài; “lâu ngày” tự nhiên, dễ hiểu và không áp đặt một chẩn đoán y khoa hiện đại.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: trên da thịt người ấy
  rationale: Giữ được cả ý “da” và “thịt/thân thể” của nguyên văn, đồng thời dùng cách nói trang trọng, dễ hiểu trong tiếng Việt.
- source_word: וְטִמְּאוֹ
  choice: phải tuyên bố người ấy là ô uế
  rationale: Trong thủ tục giám định của tư tế, thầy tế lễ công bố tình trạng nghi lễ chứ không làm cho người ấy trở nên ô uế.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi quen thuộc và trực tiếp cho chức vụ tư tế trong ngữ cảnh Lê-vi Ký.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: không cần cách ly người ấy
  rationale: Động từ nói đến việc giữ riêng để theo dõi. Vì cấu trúc mệnh lệnh phủ định trong ngữ cảnh cho biết việc ấy không cần thiết, cách diễn đạt này tự nhiên hơn tiếng Việt nhưng vẫn giữ đúng thủ tục.
- source_word: כִּי טָמֵא הוּא
  choice: vì người ấy đã ô uế
  rationale: 'Mệnh đề nêu lý do không phải tiếp tục cách ly: tình trạng ô uế đã được xác định rõ.'
theological_decisions:
- issue: Cách dịch thuật ngữ về tình trạng bất tịnh theo nghi lễ
  choice: ô uế
  alternative: không thanh sạch
  rationale: טמא ở đây nói về địa vị nghi lễ-pháp lý, không nhất thiết hàm ý tội lỗi đạo đức. “Ô uế” duy trì thuật ngữ Kinh Thánh quen thuộc và sự phân biệt đó.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Bệnh ngoài da lâu ngày” giữ tính khái quát của צָרַעַת và sắc thái kéo dài của נוֹשֶׁנֶת; tránh dùng “phong hủi,” vốn quá chuyên biệt về mặt y khoa. Đại từ “người ấy” phù hợp văn phong pháp lý-nghi lễ và tránh lặp đại từ giới tính không cần thiết.
