  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại của בֶּהָרֹת bằng hai lần “những đốm sáng”, nối bằng “tức là” để câu tiếng Việt rõ nghĩa mà không làm mất nét chẩn đoán của nguyên văn.
