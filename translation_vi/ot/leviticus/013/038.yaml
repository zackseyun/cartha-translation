  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: vi
  text: Nếu một người nam hay một người nữ có những đốm sáng trên da thịt, những đốm sáng màu trắng,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: một người nam hay nữ
  rationale: Cách dịch này nêu rõ cả hai giới như nguyên văn, đồng thời phù hợp với lối trình bày trường hợp giả định trong luật pháp.
- source_word: כִּי יִהְיֶה
  choice: nếu ... có
  rationale: Trong văn mạch chẩn đoán theo luật, כִּי giới thiệu một tình huống có điều kiện; cấu trúc “nếu ... có” tự nhiên trong tiếng Việt.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: trên da thịt
  rationale: עוֹר là “da”, còn בָּשָׂר chỉ thân thể hoặc thịt của người; “trên da thịt” vừa cô đọng, tự nhiên vừa giữ hình ảnh cụ thể của nguyên văn.
- source_word: בֶּהָרֹת
  choice: những đốm sáng
  rationale: Danh từ này chỉ các vết hoặc đốm có màu sáng trên da trong văn mạch khám xét bệnh ngoài da.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: những đốm sáng màu trắng
  rationale: לְבָנֹת xác định màu trắng của các đốm; cách diễn đạt này giữ được cả ý “sáng” lẫn màu sắc được nêu rõ.
