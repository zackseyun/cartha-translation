    rationale: Tiếng Hê-bơ-rơ lặp lại danh từ “đốm sáng” rồi thêm tính từ “trắng”; bỏ “tức là” giữ sát hơn cách bổ sung mô tả này và tránh biến cụm sau thành lời định nghĩa.
  - severity: low
    issue: Cụm “một người nam hay nữ” lược mất danh từ ở vế thứ hai.
    rationale: Dù có thể hiểu được, “một người nam hay một người nữ” nêu minh bạch hai đối tượng như אִישׁ ... אִשָּׁה trong nguyên văn.
