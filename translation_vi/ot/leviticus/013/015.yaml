id: LEV.13.15
reference: Leviticus 13:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: vi
  text: Khi thầy tế lễ thấy phần thịt tươi lộ ra[a], ông phải tuyên bố người ấy là ô uế[b]. Phần thịt tươi lộ ra là ô uế; đó là bệnh ngoài da[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “thịt sống”, tức mô thịt tươi bị phơi lộ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “xác nhận người ấy là ô uế”. Đây là phán quyết chính thức về tình trạng thanh sạch.'
    reason: lexical_alternative
  - marker: c
    text: Theo truyền thống thường dịch là “bệnh phong”, nhưng từ Hê-bơ-rơ chỉ một phạm vi bệnh hoặc tình trạng ngoài da rộng hơn, không riêng bệnh phong theo y học hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Khi ... thấy
  rationale: Waw + qatal tiếp nối trình tự thủ tục trong văn luật; dịch thành mệnh đề thời gian tự nhiên trong tiếng Việt.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu đối với כֹּהֵן trong bối cảnh Lê-vi Ký.
- source_word: הַבָּשָׂר הַחַי
  choice: phần thịt tươi lộ ra
  rationale: Nghĩa sát là “thịt sống”; trong ngữ cảnh khám bệnh ngoài da, cụm này chỉ mô sống bị phơi lộ. “Thịt tươi lộ ra” rõ nghĩa hơn “thịt sống” và không gợi nhầm thịt chưa nấu.
- source_word: וְטִמְּאוֹ
  choice: ông phải tuyên bố người ấy là ô uế
  rationale: Dạng piel của טמא trong luật thanh sạch diễn tả phán quyết chính thức của thầy tế lễ, chứ không nhất thiết nói ông gây ra sự ô uế.
- source_word: טָמֵא הוּא
  choice: là ô uế
  rationale: “Ô uế” duy trì phạm trù nghi lễ đặc thù của Lê-vi Ký.
- source_word: צָרַעַת
  choice: bệnh ngoài da
  rationale: Thuật ngữ Hê-bơ-rơ rộng hơn bệnh phong theo nghĩa y học hiện đại; cách dịch này tránh xác định quá mức.
theological_decisions:
- issue: Cách dịch צָרַעַת trong luật thanh sạch
  choice: bệnh ngoài da
  alternative: bệnh phong; chứng bệnh ngoài da gây ô uế
  rationale: Không đồng nhất phạm trù nghi lễ cổ với bệnh Hansen hiện đại, đồng thời không thêm tính từ “gây ô uế” vào chính thuật ngữ khi câu đã nói rõ tình trạng ô uế.
- issue: Vai trò của thầy tế lễ trong וְטִמְּאוֹ
  choice: tuyên bố người ấy là ô uế
  alternative: làm cho người ấy ra ô uế; kể người ấy là ô uế
  rationale: Bản dịch thể hiện đây là phán quyết thanh sạch chính thức, nhưng không hàm ý lời tuyên bố tự nó tạo nên tình trạng ấy.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng tự nhiên. Dùng “thầy tế lễ” theo lối gọi Kinh Thánh quen thuộc; “người ấy” làm rõ đại từ chỉ người trong tiếng Hê-bơ-rơ. Các dấu chú thích [a], [b], [c] đều được đặt ngay tại nội dung tương ứng.
