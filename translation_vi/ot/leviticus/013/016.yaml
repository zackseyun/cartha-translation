translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” cho הַכֹּהֵן theo ngữ cảnh luật tế lễ; giữ hình ảnh về sự đổi màu mà không hiện đại hóa thành thuật ngữ chẩn đoán y khoa.
