  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: vi
  text: Hoặc, nếu phần thịt tươi ấy trở lại và hóa trắng, người ấy phải đến gặp thầy tế lễ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֣וֹ כִ֥י
  choice: Hoặc nếu
  rationale: אוֹ nêu trường hợp khác trong quy trình chẩn định, còn כִּי mang nghĩa điều kiện; kết hợp tự nhiên là “Hoặc nếu”.
- source_word: יָשׁ֛וּב
  choice: trở lại
  rationale: Giữ nghĩa căn bản của שוב là quay lại hoặc trở về trạng thái trước đó trong mạch văn.
- source_word: הַבָּשָׂר הַחַי
  choice: phần thịt tươi
  rationale: Cụm từ sát chữ là “phần thịt sống”, nhưng trong văn cảnh chỉ mô thịt còn sống, lộ ra và đỏ tươi; “phần thịt tươi” vừa dễ hiểu vừa tránh gợi ý thịt đã chết. Nghĩa sát chữ được ghi ở chú thích.
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: và hóa trắng
  rationale: Dạng Niphal của הפך diễn tả sự đổi trạng thái; “hóa trắng” truyền đạt tự nhiên kết quả nhìn thấy được.
- source_word: וּבָא אֶל־הַכֹּהֵן
  choice: thì người ấy phải đến với thầy tế lễ
  rationale: Diễn đạt bước tiếp theo mang tính quy định trong thủ tục; “người ấy” làm rõ chủ thể được hàm ẩn trong động từ Hebrew.
