revisions:
- from: Còn nếu tóc ở phía trước đầu người ấy rụng đi, thì người ấy bị hói trán; người ấy vẫn thanh sạch.[a]
  to: Còn nếu phần trước đầu người ấy bị rụng tóc, thì người ấy là người hói trán; người ấy thanh sạch.[a]
  rationale: Bản sửa giữ nguyên ý chẩn đoán và tình trạng thanh sạch theo nghi lễ, đồng thời dùng cách nói giải phẫu tự nhiên hơn trong tiếng Việt. Loại bỏ “vẫn” để không thêm sắc thái diễn giải, và thu hẹp chú thích vào sự đối lập từ vựng được nêu trực tiếp trong ngữ cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: chứng rụng tóc ở phần trước đầu được phân biệt với chứng hói ở phần sau đầu, và người ấy vẫn ở tình trạng thanh sạch theo nghi lễ. Tuy nhiên, “vẫn” là một suy diễn diễn ngôn hợp lý nhưng không được nói rõ trong nguyên văn; nên không thêm vào bản dịch chính. Cụm “tóc ở phía trước đầu người ấy rụng đi” cũng hơi gượng và không phản ánh trực tiếp cấu trúc “đầu người ấy trở nên trụi tóc từ phía trước”.'
  naturalness: Nên dùng “phần trước đầu” thay vì “phía trước đầu” để chỉ vùng giải phẫu tự nhiên hơn. “Người ấy bị hói trán” rõ nghĩa, nhưng “người ấy là người hói trán” gần với mệnh đề định danh của tiếng Hê-bơ-rơ và giữ văn phong chẩn đoán của đoạn.
  terminology: “Thanh sạch” là lựa chọn phù hợp cho טָהוֹר trong luật nghi lễ, vì tránh đồng nhất với sạch sẽ thể chất hay phẩm chất đạo đức. “Hói trán” bảo toàn sự phân biệt với hói ở phía sau đầu trong câu trước.
  issues:
  - severity: low
    issue: Thêm từ “vẫn” trong mệnh đề kết.
    rationale: Nguyên văn chỉ khẳng định “người ấy thanh sạch”; dù hàm ý đối lập với một chẩn đoán ô uế là rõ trong ngữ cảnh, từ “vẫn” thêm một sắc thái không được phát biểu trực tiếp.
  - severity: low
    issue: Diễn đạt “tóc ở phía trước đầu người ấy rụng đi” hơi không tự nhiên.
    rationale: Tiếng Việt tự nhiên hơn khi mô tả vùng đầu là “phần trước đầu người ấy bị rụng tóc”; cách này cũng phản ánh tốt hơn ý đầu bị trụi tóc từ phía trước.
  - severity: low
    issue: Chú thích nêu “phía sau hoặc đỉnh đầu”.
    rationale: Sự đối lập trực tiếp của câu trước là vùng phía sau đầu; thêm “hoặc đỉnh đầu” làm rộng chỉ dẫn giải phẫu vượt quá điều cần thiết trong chú thích.
