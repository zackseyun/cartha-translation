base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: vi
  text: Còn nếu phần trước đầu người ấy bị rụng tóc, thì người ấy là người hói trán; người ấy thanh sạch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hói ở phần trước đầu.” Từ Hê-bơ-rơ này phân biệt tình trạng ấy với chứng hói ở phía sau đầu trong câu trước.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: ở phía trước đầu người ấy
  rationale: Cụm từ theo sát nghĩa đen là vùng phía mặt trước của người ấy; trong ngữ cảnh phân loại chứng rụng tóc trên đầu, cụm này chỉ phần trước của đầu.
- source_word: יִמָּרֵט רֹאשׁוֹ
  choice: tóc ... đầu người ấy rụng đi
  rationale: Động từ Niphal diễn tả đầu trở nên trụi tóc. Tiếng Việt tự nhiên diễn đạt bằng việc tóc trên vùng đầu ấy rụng đi.
- source_word: גִּבֵּחַ
  choice: bị hói trán
  rationale: Thuật ngữ này chỉ chứng hói ở phần trước, đối lập với từ chỉ hói ở phía sau hoặc đỉnh đầu trong câu trước.
- source_word: טָהוֹר
  choice: thanh sạch
  rationale: Trong luật thanh sạch của Lê-vi Ký 13, từ này nói đến tình trạng nghi lễ, không phải phẩm chất đạo đức.
theological_decisions:
- issue: Thuật ngữ về tình trạng nghi lễ trong luật thanh sạch
  choice: thanh sạch
  alternative: trong sạch; sạch
  rationale: “Thanh sạch” giữ rõ phạm trù nghi lễ của đoạn văn và tránh khiến người đọc hiểu đây chỉ là sạch sẽ thể chất hoặc là sự tinh sạch đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hói trán” để bảo toàn sự phân biệt giải phẫu của nguyên văn; thêm “vẫn” nhằm diễn đạt tự nhiên rằng tình trạng hói này không làm người ấy mất tình trạng thanh sạch.
