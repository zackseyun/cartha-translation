base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: vi
  text: Nếu một y phục bằng len hoặc bằng vải lanh có một dấu vết tsaraath[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ tsaraath, theo truyền thống thường được dịch là “phong hủi” hoặc “bệnh phong”, ở đây chỉ một phạm trù rộng hơn gồm các tình trạng bất thường hoặc nhiễm bẩn, kể cả trên y phục, chứ không riêng bệnh Hansen hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: một y phục
  rationale: בגד chỉ một món y phục. Dù tiếng Hê-bơ-rơ có mạo từ xác định, đây là công thức nêu trường hợp luật định, nên tiếng Việt dùng “một” để diễn đạt nghĩa khái quát tự nhiên.
- source_word: כִּי יִהְיֶה בוֹ
  choice: nếu ... có
  rationale: כִּי đi với động từ chưa hoàn thành mở đầu một trường hợp luật định; “nếu” phù hợp trong tiếng Việt. Cấu trúc “có” diễn đạt sự hiện diện của dấu vết nơi y phục mà không làm câu quá nặng.
- source_word: נֶגַע צָרָעַת
  choice: vết nhiễm tsaraath
  rationale: נגע trong ngữ cảnh kiểm tra chỉ một dấu vết hay tình trạng bất thường có thể quan sát; “vết nhiễm” phù hợp với vật liệu hơn “bệnh” hay “phong hủi”. Giữ tsaraath dưới dạng phiên âm để không đồng nhất phạm trù nghi lễ rộng này với bệnh Hansen hiện đại.
- source_word: בְּבֶגֶד צֶמֶר
  choice: trên y phục bằng len
  rationale: Cụm từ xác định loại vật liệu. “Bằng len” là cách nói tự nhiên; “trên” thể hiện vị trí của dấu vết trên y phục và thích hợp với việc quan sát bề mặt.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: hoặc trên y phục bằng vải lanh
  rationale: פשתים ở đây chỉ vật liệu dệt từ lanh. Lặp lại “trên y phục” phản ánh giới từ בְּ được lặp trong nguyên văn và giữ cấu trúc song song.
theological_decisions:
- issue: Phạm vi nghĩa của צָרָעַת
  choice: Giữ thuật ngữ “tsaraath” và giải thích bằng chú thích
  alternative: Dịch là “phong hủi” hoặc “bệnh phong”
  rationale: Trong Lê-vi Ký 13, צָרָעַת có thể áp dụng cho người, y phục và nhà cửa, nên không thể bị thu hẹp thành bệnh Hansen. Giữ thuật ngữ nguồn bảo toàn phạm vi và sự căng thẳng của văn bản mà không áp đặt cách hiểu giáo phái.
translation_notes:
  register: Văn phong luật định, trang trọng nhưng hiện đại. Giữ câu kết bằng dấu phẩy vì câu cú pháp tiếp tục sang các câu sau. Thuật ngữ Hê-bơ-rơ được phiên âm và giải thích để tránh cách hiểu y khoa sai lệch.
