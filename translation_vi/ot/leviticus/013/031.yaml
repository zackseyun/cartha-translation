revisions:
- from: Nếu thầy tế lễ khám vùng tổn thương do chứng lở tróc tóc[a], thấy nó không có vẻ lõm xuống dưới mặt da và không có lông đen ở đó, thì thầy tế lễ phải cách ly vùng tổn thương ấy trong bảy ngày.
  to: Nếu thầy tế lễ khám vùng tổn thương do chứng lở tróc vảy[a] và thấy bề ngoài của nó không có vẻ lõm xuống dưới da, cũng không có lông đen trong đó, thì thầy tế lễ phải cách ly vùng tổn thương ấy trong bảy ngày.
  rationale: Thay thuật ngữ chính bằng “chứng lở tróc vảy” để diễn đạt một tình trạng da mà không biến từ này thành tên một bệnh hiện đại hoặc thành hiện tượng rụng tóc. Chú thích được điều chỉnh để nêu các khả năng từ vựng mà không dùng “chốc”, một từ có nghĩa quá chuyên biệt trong tiếng Việt hiện đại. Các chi tiết chẩn xét và thủ tục cách ly của bản gốc được giữ nguyên.
