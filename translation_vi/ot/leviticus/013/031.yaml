  source_fidelity: 'Bản nháp giữ đúng cấu trúc điều kiện, việc thầy tế lễ khám xét, tiêu chí tổn thương không có vẻ lõm dưới da, sự vắng mặt của lông đen, và thời hạn cách ly bảy ngày. Tuy nhiên, “chứng lở tróc tóc” không diễn đạt đúng נֶתֶק: từ này chỉ một tổn thương/bệnh da đặc thù, thường liên hệ với rụng tóc hoặc lông, chứ không phải hiện tượng tóc tróc hay rụng tự thân.'
