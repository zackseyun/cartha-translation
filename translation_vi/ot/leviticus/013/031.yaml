    rationale: Trong cách dùng tiếng Việt hiện đại, “chốc” thường chỉ một chẩn đoán da liễu tương đối xác định; điều này vượt quá tính không chắc chắn của thuật ngữ Hê-bơ-rơ và dễ gây sai lệch.
