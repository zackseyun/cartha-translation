  text: וְ/כִֽי יִרְאֶ֨ה הַ/כֹּהֵ֜ן אֶת נֶ֣גַע הַ/נֶּ֗תֶק וְ/הִנֵּ֤ה אֵין מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וְ/שֵׂעָ֥ר שָׁחֹ֖ר אֵ֣ין בּ֑/וֹ וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת נֶ֥גַע הַ/נֶּ֖תֶק שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: vi
  text: Nếu thầy tế lễ khám vùng tổn thương do chứng lở tróc vảy[a] và thấy bề ngoài của nó không có vẻ lõm xuống dưới da, cũng không có lông đen trong đó, thì thầy tế lễ phải cách ly vùng tổn thương ấy trong bảy ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chứng ngứa” hoặc “chứng lở da đầu”. Từ Hê-bơ-rơ נֶתֶק chỉ một tình trạng da đặc thù trong chương này, liên quan đến vùng da đầu hoặc vùng râu và thường đi kèm việc rụng tóc hay lông.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: vùng tổn thương
  rationale: Trong luật chẩn xét ở Lê-vi Ký 13, từ này chỉ một vùng bất thường có thể quan sát được; “vùng tổn thương” tự nhiên, trung tính và không hàm ý dịch bệnh lan rộng.
- source_word: נֶתֶק
  choice: chứng lở tróc tóc
  rationale: Đây là thuật ngữ riêng cho một chứng ở đầu hoặc râu, có liên hệ với tóc hay lông bị mất. Cách dịch này diễn đạt đặc điểm của chứng bệnh mà không đồng nhất nó chắc chắn với một bệnh hiện đại.
- source_word: מַרְאֵהוּ
  choice: nó không có vẻ
  rationale: Diễn đạt tự nhiên ý nghĩa thị giác của danh từ “vẻ ngoài” kèm đại từ sở hữu trong bối cảnh thầy tế lễ khám xét.
- source_word: עָמֹק מִן־הָעוֹר
  choice: lõm xuống dưới mặt da
  rationale: Cụm từ mô tả tổn thương nhìn có vẻ thấp hoặc sâu hơn bề mặt da; cách dịch này rõ nghĩa và tránh gợi ý chắc chắn rằng bệnh đã ăn sâu vào mô.
- source_word: שֵׂעָר שָׁחֹר
  choice: lông đen
  rationale: Giữ đúng màu đen được nêu trong tiếng Hê-bơ-rơ. “Lông” phù hợp vì quy định này áp dụng cho vùng đầu hoặc râu.
- source_word: וְהִסְגִּיר
  choice: phải cách ly
  rationale: Trong luật thanh sạch, động từ chỉ việc biệt riêng tạm thời để theo dõi; “cách ly” là cách nói hiện đại, rõ ràng và không quá chuyên biệt như thuật ngữ y tế “kiểm dịch”.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Cách diễn đạt thời hạn tự nhiên trong tiếng Việt.
- source_word: וְכִי
  choice: Nếu
  rationale: Câu điều kiện tiếp nối các trường hợp luật định trước đó; tiếng Việt không cần dịch riêng liên từ וְ để giữ mạch văn tự nhiên.
- source_word: יִרְאֶה
  choice: khám
  rationale: Nghĩa đen là “thấy”, nhưng trong bối cảnh thủ tục này, thầy tế lễ đang quan sát để đánh giá; “khám” truyền đạt đúng chức năng ấy.
theological_decisions: []
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại. Giữ chủ thể “thầy tế lễ” và tiêu chí quan sát cụ thể; không gán thuật ngữ Hê-bơ-rơ cho một chẩn đoán da liễu hiện đại chắc chắn. Dấu chú thích [a] xuất hiện ngay sau thuật ngữ cần giải thích.
