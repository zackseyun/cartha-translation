revisions:
- from: Tại chỗ mụn nhọt ấy, nếu xuất hiện một chỗ sưng trắng hoặc một đốm sáng trắng pha đỏ, thì phải đưa người ấy đến trình diện thầy tế lễ.[a]
  to: Tại chỗ mụn nhọt ấy, nếu xuất hiện một chỗ sưng trắng hoặc một đốm sáng trắng pha đỏ, thì người ấy phải trình diện trước thầy tế lễ.[a]
  rationale: Bản sửa loại bỏ chi tiết không có trong nguyên văn (“đưa ... đến”), dùng “trình diện trước” để diễn đạt tự nhiên chức năng thủ tục của động từ Niphal, và chỉnh chú thích để neo đúng sự mơ hồ từ vựng mà không gán “dấu ấy” làm chủ thể. Các thuật ngữ về tổn thương da và màu sắc được giữ nguyên.
  reviewer_model: gpt-5.6-terra
