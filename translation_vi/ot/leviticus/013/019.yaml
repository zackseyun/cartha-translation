review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng bối cảnh chẩn định và giữ được hai dạng tổn thương riêng biệt: שְׂאֵת là chỗ sưng trắng, còn בַהֶרֶת là đốm sáng trắng pha đỏ. Tuy nhiên, cách nói “phải đưa người ấy đến” thêm một tác nhân đưa đi không có trong tiếng Hê-bơ-rơ. Động từ נִרְאָה, giống đực số ít, trong ngữ cảnh này hợp nhất với người bị tổn thương phải trình diện/được thầy tế lễ xem xét, hơn là với các danh từ chỉ dấu da giống cái.'
  naturalness: “Nếu ... thì ...” tự nhiên trong tiếng Việt và diễn tả quan hệ thủ tục trong văn cảnh luật lệ. “Người ấy phải trình diện trước thầy tế lễ” rõ ràng, trang trọng vừa phải, và tránh lối diễn đạt bị động gượng hoặc hàm ý có người thứ ba áp giải người ấy.
  terminology: “Mụn nhọt,” “chỗ sưng,” “đốm sáng,” và “thầy tế lễ” phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. “Trắng pha đỏ” giữ được sắc thái vừa trắng vừa đỏ của לְבָנָה אֲדַמְדָּמֶת mà không ép thành một chẩn đoán y khoa hiện đại.
  issues:
  - severity: medium
    issue: Cụm “phải đưa người ấy đến trình diện thầy tế lễ” thêm hành động và tác nhân không được nêu trong nguyên văn.
    rationale: נִרְאָה là dạng Niphal “được thấy/ra trình diện”; trong ngữ cảnh, câu có thể được hiểu là người ấy phải ra trước thầy tế lễ. Nguyên văn không nói ai phải đưa người ấy đến.
  - severity: low
    issue: Chú thích hiện tại nêu phương án “dấu ấy phải được cho thầy tế lễ xem,” trong khi hình thức giống đực của động từ phù hợp tự nhiên hơn với người bị tổn thương.
    rationale: Nên trình bày khả năng “người ấy phải trình diện/được thầy tế lễ xem xét,” đồng thời ghi nhận nghĩa sát là “được thấy/hiện ra,” thay vì xác định “dấu ấy” là chủ thể.
