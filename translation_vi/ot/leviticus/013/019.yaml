  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: vi
  text: Tại chỗ mụn nhọt ấy, nếu xuất hiện một chỗ sưng trắng hoặc một đốm sáng trắng pha đỏ, thì người ấy phải trình diện trước thầy tế lễ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “thì người ấy phải được thấy trước thầy tế lễ” hoặc “thì người ấy phải hiện ra trước thầy tế lễ.” Động từ Hê-bơ-rơ có nghĩa là “được thấy” hoặc “hiện ra”; trong văn cảnh này, có lẽ nói đến việc người có dấu hiệu ấy phải đến để thầy tế lễ khám xét.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: nếu xuất hiện
  rationale: Trong luật chẩn định này, היה nói đến một dấu hiệu xuất hiện tại chỗ từng có mụn nhọt; cấu trúc “nếu... thì...” diễn đạt tự nhiên quan hệ điều kiện hàm ẩn trong ngữ cảnh.
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: tại chỗ mụn nhọt ấy
  rationale: “Tại chỗ” là cách nói tự nhiên cho vị trí tổn thương trước đó; “mụn nhọt” diễn đạt שְׁחִין rõ ràng trong tiếng Việt hiện đại.
- source_word: שְׂאֵת לְבָנָה
  choice: một chỗ sưng trắng
  rationale: שְׂאֵת chỉ phần da nổi hoặc sưng; cách dịch này rõ nghĩa và giữ được sự phân biệt với בַהֶרֶת.
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: một đốm sáng trắng pha đỏ
  rationale: בַהֶרֶת là đốm da sáng hoặc nổi bật; אֲדַמְדָּמֶת thêm sắc đỏ vào đốm đã được mô tả là trắng.
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: thì phải đưa người ấy đến trình diện thầy tế lễ
  rationale: Động từ Niphal của ראה có thể là “được thấy/hiện ra”; trong thủ tục khám xét ở đây, câu nói đến việc người có dấu hiệu ấy được đưa đến cho thầy tế lễ xem xét. Bổ sung “người ấy” làm rõ đối tượng được trình diện trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh phổ thông; giữ riêng hai dạng tổn thương là “chỗ sưng” và “đốm sáng”. Dấu chú thích [a] được đặt ngay sau mệnh đề có cách hiểu từ vựng cần giải thích.
