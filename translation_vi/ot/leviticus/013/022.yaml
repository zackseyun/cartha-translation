source:
  edition: WLC
  text: וְ/אִם פָּשֹׂ֥ה תִפְשֶׂ֖ה בָּ/ע֑וֹר וְ/טִמֵּ֧א הַ/כֹּהֵ֛ן אֹת֖/וֹ נֶ֥גַע הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: vi
  text: Nhưng nếu vết ấy quả thật lan rộng trên da, thầy tế lễ phải tuyên bố người ấy là ô uế[a]; đó là một vết bệnh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làm người ấy ô uế”; tuy nhiên, trong ngữ cảnh luật tế lễ, động từ này thường chỉ việc chính thức xác nhận hoặc tuyên bố người ấy ô uế.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ có nghĩa rộng, cũng có thể dịch là “tổn thương”, “chứng bệnh” hoặc “tai họa”; từ này không tương ứng chính xác với một loại bệnh theo y học hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện có sắc thái tương phản với trường hợp ở câu trước.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: quả thật lan rộng
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ chưa hoàn thành nhấn mạnh sự lan rộng; “quả thật” chuyển tải sắc thái nhấn mạnh một cách tự nhiên.
- source_word: בָּעוֹר
  choice: trên da
  rationale: עוֹר là “da”; trong tiếng Việt, “lan rộng trên da” tự nhiên hơn “trong da” trong ngữ cảnh quan sát tổn thương ngoài da.
- source_word: וְטִמֵּא
  choice: phải tuyên bố ... là ô uế
  rationale: Trong luật tế lễ, động từ Piel này chỉ phán quyết chính thức về tình trạng ô uế, chứ không nhất thiết nói thầy tế lễ gây ra sự ô uế.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, trang trọng và quen thuộc đối với כֹּהֵן trong văn liệu Lê-vi.
- source_word: אֹתוֹ
  choice: người ấy
  rationale: Đại từ chỉ người đang được khám, không chỉ riêng vết trên da.
- source_word: נֶגַע
  choice: một vết bệnh
  rationale: נֶגַע là thuật ngữ rộng, có thể chỉ vết tổn thương hoặc tình trạng bệnh; “vết bệnh” phù hợp ngữ cảnh chẩn định ngoài da mà không gán một bệnh danh hiện đại.
- source_word: הִוא
  choice: đó là
  rationale: Diễn đạt tự nhiên mệnh đề định danh không có động từ trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Bản chất lời phán quyết của thầy tế lễ về sự ô uế
  choice: Thầy tế lễ tuyên bố người ấy là ô uế.
  alternative: Thầy tế lễ làm cho người ấy ra ô uế.
  rationale: Ngữ cảnh pháp lý–tế lễ cho thấy đây là sự chẩn định và công bố địa vị nghi lễ. Bản dịch tránh hàm ý rằng lời nói của thầy tế lễ tự nó tạo ra sự ô uế.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “vết ấy” thay cho đại từ vô chủ “nó” để nối tự nhiên với tổn thương được nói đến trong ngữ cảnh. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
