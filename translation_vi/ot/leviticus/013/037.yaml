  text: וְ/אִם בְּ/עֵינָי/ו֩ עָמַ֨ד הַ/נֶּ֜תֶק וְ/שֵׂעָ֨ר שָׁחֹ֧ר צָֽמַח בּ֛/וֹ נִרְפָּ֥א הַ/נֶּ֖תֶק טָה֣וֹר ה֑וּא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: vi
  text: Nhưng nếu theo sự quan sát của thầy tế lễ, vết lở vẫn y nguyên, và lông đen đã mọc trong đó, thì vết lở đã lành. Người ấy thanh sạch, và thầy tế lễ phải tuyên bố người ấy là thanh sạch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát động từ Hê-bơ-rơ là “làm cho người ấy thanh sạch”; trong ngữ cảnh này, từ ấy chỉ việc thầy tế lễ chính thức xác nhận người ấy là thanh sạch.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: theo sự quan sát của thầy tế lễ
  rationale: Thành ngữ Hê-bơ-rơ chỉ điều người khám nhận thấy. Nêu rõ “thầy tế lễ” theo ngữ cảnh giúp câu tiếng Việt tự nhiên mà vẫn giữ bối cảnh kiểm tra.
- source_word: עָמַד
  choice: vẫn y nguyên
  rationale: Trong quy trình chẩn định ở đây, động từ diễn tả tình trạng không thay đổi hay lan rộng; “vẫn y nguyên” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: הַנֶּתֶק
  choice: vết lở
  rationale: Từ này chỉ một tổn thương đặc thù ở vùng đầu hoặc râu trong phân đoạn. “Vết lở” dễ hiểu, không thu hẹp sai nghĩa thành triệu chứng ngứa và không dùng thuật ngữ y khoa hiện đại quá chuyên biệt.
- source_word: שֵׂעָר שָׁחֹר
  choice: lông đen
  rationale: Dịch trực tiếp màu sắc được dùng làm dấu hiệu chẩn định; “lông” phù hợp vì tổn thương có thể ở da đầu hoặc vùng râu.
- source_word: צָמַח בּוֹ
  choice: đã mọc trong đó
  rationale: 'Giữ hình ảnh của giới từ Hê-bơ-rơ: lông mọc ngay trong vùng tổn thương.'
- source_word: נִרְפָּא
  choice: đã lành
  rationale: Thể bị động của động từ diễn tả tổn thương đã được chữa lành hoặc đã lành; tiếng Việt tự nhiên thường dùng “đã lành” mà không cần nêu tác nhân.
- source_word: טָהוֹר הוּא
  choice: Người ấy thanh sạch
  rationale: Trong ngữ cảnh luật thanh sạch, chủ thể là người được khám. “Thanh sạch” giữ sắc thái nghi lễ tốt hơn “sạch” đơn thuần.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: thầy tế lễ phải tuyên bố người ấy là thanh sạch
  rationale: Ở đây động từ chỉ phán quyết chính thức về tình trạng thanh sạch sau khi vết lở đã lành, chứ không nói thầy tế lễ thực hiện việc chữa lành.
theological_decisions:
- issue: Bản chất hành động của thầy tế lễ trong phán quyết về sự thanh sạch
  choice: thầy tế lễ phải tuyên bố người ấy là thanh sạch
  alternative: thầy tế lễ phải làm cho người ấy thanh sạch
  rationale: Mệnh đề trước đã xác nhận vết lở lành; mệnh đề cuối mô tả phán quyết chính thức của thầy tế lễ. Cách dịch này không hàm ý rằng chính thầy tế lễ chữa bệnh hay tạo nên sự lành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo cách gọi quen thuộc trong Kinh Thánh tiếng Việt; dùng “thanh sạch” để giữ phạm trù nghi lễ của sách Lê-vi.
