- from: Đến ngày thứ bảy, thầy tế lễ phải khám chỗ bệnh rụng tóc hoặc lông[a]. Nếu chỗ bệnh không lan trên da và trông không sâu hơn bề mặt da[b], thầy tế lễ phải tuyên bố người ấy là thanh sạch[c]. Người ấy phải giặt quần áo mình, rồi sẽ được thanh sạch.
  to: Vào ngày thứ bảy, thầy tế lễ phải khám vết tổn thương có vảy[a]. Nếu vết tổn thương không lan trên da và bề ngoài không sâu hơn bề mặt da[b], thầy tế lễ phải tuyên bố người ấy là thanh sạch[c]. Người ấy phải giặt quần áo mình, thì người ấy sẽ thanh sạch.
  rationale: Sửa thuật ngữ נֶתֶק thành “vết tổn thương có vảy” để phản ánh tính chất da liễu được bản dịch đối chiếu chọn mà không khẳng định rụng tóc/lông hay một chẩn đoán hiện đại. Thông tin về vùng da đầu/râu và các cách dịch truyền thống được giữ trong chú thích với mức độ dè dặt thích hợp. Câu cuối được chỉnh để nêu kết quả thanh sạch theo nghi lễ một cách trực tiếp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:07Z'
