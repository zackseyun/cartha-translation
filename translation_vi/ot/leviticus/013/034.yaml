source:
  edition: WLC
  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֶת הַ/נֶּ֜תֶק בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨תֶק֙ בָּ/ע֔וֹר וּ/מַרְאֵ֕/הוּ אֵינֶ֥/נּוּ עָמֹ֖ק מִן הָ/ע֑וֹר וְ/טִהַ֤ר אֹת/וֹ֙ הַ/כֹּהֵ֔ן וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: vi
  text: Vào ngày thứ bảy, thầy tế lễ phải khám vết tổn thương có vảy[a]. Nếu vết tổn thương không lan trên da và bề ngoài không sâu hơn bề mặt da[b], thầy tế lễ phải tuyên bố người ấy là thanh sạch[c]. Người ấy phải giặt quần áo mình, thì người ấy sẽ thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ neṭeq chỉ một loại tổn thương da đặc thù, thường được xem là ở vùng da đầu hoặc râu; bản chất chính xác không chắc chắn. Cũng có thể dịch theo truyền thống là “chốc” hoặc “lở ngứa”.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “không sâu hơn da”; đây là tiêu chuẩn tư tế cho biết vùng bị tổn thương không có vẻ lõm xuống dưới vùng da xung quanh.'
    reason: cultural_note
  - marker: c
    text: “Tuyên bố… là thanh sạch” nói đến phán định chính thức về tình trạng thanh sạch theo nghi lễ, không có nghĩa thầy tế lễ chữa khỏi bệnh.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: chỗ bệnh rụng tóc hoặc lông
  rationale: Từ này chỉ một loại tổn thương đặc thù ở vùng đầu hoặc râu, nơi tóc hay lông có thể bị rụng; cách dịch không gán cho nó một chẩn đoán y khoa hiện đại cụ thể.
- source_word: פָשָׂה
  choice: lan
  rationale: Trong ngữ cảnh kiểm tra tổn thương da, động từ diễn tả tình trạng bệnh lan rộng trên da.
- source_word: בָּעוֹר
  choice: trên da
  rationale: Tiếng Việt tự nhiên dùng “lan trên da” để nói về phạm vi tổn thương, dù giới từ Hê-bơ-rơ cũng có thể được hiểu sát là “trong da”.
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן הָעוֹר
  choice: trông không sâu hơn bề mặt da
  rationale: Giữ tiêu chuẩn quan sát bằng mắt và diễn đạt tự nhiên rằng vùng tổn thương không có vẻ lõm xuống dưới vùng da xung quanh.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: thầy tế lễ phải tuyên bố người ấy là thanh sạch
  rationale: Trong luật thanh sạch, đây là phán định chính thức về tình trạng nghi lễ, không phải hành động chữa bệnh.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Người ấy phải giặt quần áo mình
  rationale: Diễn đạt rõ chủ thể và giữ nguyên hành động giặt y phục theo nghi thức.
- source_word: וְטָהֵר
  choice: rồi sẽ được thanh sạch
  rationale: Diễn tả kết quả về tình trạng thanh sạch sau khi giặt quần áo, đồng thời phân biệt với lời tuyên bố trước đó.
- source_word: וְרָאָה
  choice: phải khám
  rationale: Trong thủ tục tư tế, động từ “thấy” mang nghĩa kiểm tra chính thức; “khám” rõ và tự nhiên trong tiếng Việt.
- source_word: וְהִנֵּה
  choice: Nếu
  rationale: Trong công thức kiểm tra này, từ giới thiệu điều thầy tế lễ quan sát được và có chức năng điều kiện trong mạch luật.
theological_decisions:
- issue: Bản chất hành động của thầy tế lễ trong luật thanh sạch
  choice: Thầy tế lễ chính thức tuyên bố người ấy là thanh sạch.
  alternative: Thầy tế lễ làm cho người ấy được thanh sạch.
  rationale: Dạng động từ טהר trong ngữ cảnh pháp lý-tư tế nói đến việc xác định tình trạng nghi lễ. “Tuyên bố” tránh hàm ý rằng thầy tế lễ chữa lành bệnh hoặc tự mình tạo ra sự thanh tẩy.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại, dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc và “thanh sạch” cho tình trạng nghi lễ. Câu được chia vừa phải để người đọc phổ thông dễ theo dõi; thuật ngữ bệnh được mô tả thay vì đồng nhất với một bệnh hiện đại.
