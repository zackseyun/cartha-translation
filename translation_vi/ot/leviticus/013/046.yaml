- from: Suốt những ngày vết bệnh còn trên người ấy[a], người ấy sẽ bị ô uế. Người ấy là ô uế[b]. Người ấy phải sống riêng một mình; nơi cư ngụ của người ấy phải nằm ngoài trại.
  to: Suốt những ngày vết bệnh còn trên người ấy[a], người ấy sẽ là người ô uế. Người ấy là người ô uế[b]. Người ấy phải sống riêng một mình; nơi ở của người ấy phải ở ngoài trại.
  rationale: Sửa các chỗ chưa tự nhiên trong tiếng Việt và làm rõ sắc thái tình trạng pháp định của động từ טמא, đồng thời giữ sự lặp lại nhấn mạnh của nguyên văn. Chú thích từ vựng được chỉnh để nhất quán với chính văn và tránh các cụm từ không tự nhiên hoặc quá rộng trong ngữ cảnh.
