id: LEV.13.46
reference: Leviticus 13:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: vi
  text: Suốt những ngày vết bệnh còn trên người ấy[a], người ấy sẽ là người ô uế. Người ấy là người ô uế[b]. Người ấy phải sống riêng một mình; nơi ở của người ấy phải ở ngoài trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tổn thương” hoặc “chứng bệnh”. Từ Hê-bơ-rơ này có nghĩa rộng, có thể chỉ một sự giáng xuống hay tình trạng gây tổn hại; trong chương này, nó chỉ tình trạng đã được xem xét theo các quy định.
    reason: lexical_alternative
  - marker: b
    text: “Ô uế” ở đây chỉ tình trạng theo luật Lê-vi, không nhất thiết nói rằng người ấy có tội về mặt đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: vết bệnh
  rationale: נֶגַע là một từ rộng, có thể chỉ sự tổn hại, tai họa hoặc tình trạng bệnh lý. Trong Lê-vi Ký 13, từ này chỉ dấu hiệu đã được xem xét trên thân thể; “vết bệnh” vừa tự nhiên trong tiếng Việt vừa không thu hẹp nó vào một chẩn đoán y khoa hiện đại cụ thể.
- source_word: בּוֹ
  choice: trên người ấy
  rationale: Giới từ ב có thể mang nghĩa “trong” hoặc “trên”. Vì ngữ cảnh nói đến dấu hiệu biểu hiện trên thân thể, “trên người ấy” là cách diễn đạt tự nhiên và sát ngữ cảnh.
- source_word: יִטְמָא
  choice: sẽ bị ô uế
  rationale: Động từ טמא ở đây chỉ tình trạng ô uế theo luật Lê-vi. “Sẽ bị ô uế” giữ sắc thái quy định của thể chưa hoàn thành trong điều luật.
- source_word: טָמֵא הוּא
  choice: Người ấy là ô uế
  rationale: Mệnh đề không động từ nhấn mạnh và lặp lại tình trạng của người ấy. Giữ thành một câu riêng để bảo toàn sức nhấn của nguyên văn.
- source_word: בָּדָד
  choice: riêng một mình
  rationale: בָּדָד diễn tả sự tách riêng hoặc ở một mình. Cách dịch này trực tiếp, dễ hiểu và không thêm sắc thái y khoa của thuật ngữ “cách ly”.
- source_word: יֵשֵׁב
  choice: phải sống
  rationale: ישב có thể nghĩa là ngồi, ở hoặc cư ngụ. Trong quy định về nơi cư trú, “phải sống” truyền đạt tự nhiên ý cư ngụ liên tục.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ngoài trại
  rationale: Cụm từ này chỉ địa điểm bên ngoài khu trại của cộng đồng trong bối cảnh dân Israel ở hoang mạc.
- source_word: מוֹשָׁבוֹ
  choice: nơi cư ngụ của người ấy
  rationale: מוֹשָׁב chỉ chỗ ở hoặc nơi cư trú. “Nơi cư ngụ” giữ được ý cụ thể về địa điểm mà không quá cổ.
theological_decisions:
- issue: Bản chất của tình trạng ô uế trong Lê-vi Ký 13
  choice: Dịch טמא là “ô uế” trong chính văn, không thêm “về nghi lễ” hay “về lễ nghi”.
  alternative: “bị ô uế về nghi lễ” hoặc “không thanh sạch về nghi lễ”
  rationale: Câu này nói đến địa vị ô uế theo luật Lê-vi, không nhất thiết hàm ý tội lỗi đạo đức. Chính văn giữ nguyên phạm trù “ô uế” của tiếng Hê-bơ-rơ, còn chú thích làm rõ bối cảnh mà không thu hẹp ý nghĩa ngay trong bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để duy trì giọng văn luật lệ; giữ câu lặp “Người ấy là ô uế” nhằm phản ánh sự nhấn mạnh của nguyên văn. Tránh “cách ly” vì từ này dễ áp đặt khung y tế hiện đại lên văn bản cổ.
