review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng cấu trúc và ý nghĩa Hê-bơ-rơ: thời gian kéo dài, tình trạng ô uế được nhắc lại, sự ở riêng, và chỗ ở ngoài trại. Tuy nhiên, “sẽ bị ô uế” có thể gợi một biến cố bị làm cho ô uế, trong khi יִטְמָא ở đây diễn tả tình trạng pháp định là “sẽ là/ở trong tình trạng ô uế”.'
  naturalness: “Người ấy là ô uế” không tự nhiên trong tiếng Việt hiện đại. “Người ấy vẫn là người ô uế” hoặc “người ấy là người ô uế” tự nhiên hơn; phương án đầu cũng diễn tả hợp lý sự nhấn mạnh và tính kéo dài trong văn cảnh. “phải nằm ngoài trại” đối với “nơi cư ngụ” hơi gượng; “ở ngoài trại” tự nhiên hơn.
  terminology: Giữ “ô uế” là phù hợp cho טמא và chú thích giải thích đây là tình trạng theo luật Lê-vi. “Vết bệnh” có thể dùng, nhưng chú thích không nên nêu “bệnh” như một phương án khác khi chính văn đã dùng “vết bệnh”; cần nêu các tương đương thực sự khác và tránh “vết thương tổn” là cách nói không tự nhiên. “tai họa” quá rộng trong câu này nếu không được trình bày là nghĩa từ nguyên/khả năng từ vựng xa hơn.
  issues:
  - severity: medium
    issue: “sẽ bị ô uế” dễ lệch sắc thái của יִטְמָא
    rationale: Cách dùng bị động “bị ô uế” trong tiếng Việt thường nhấn vào việc ai đó bị làm cho ô uế. Câu Hê-bơ-rơ xác lập tình trạng pháp định; “sẽ là người ô uế” truyền đạt trực tiếp hơn.
  - severity: medium
    issue: “Người ấy là ô uế” thiếu tự nhiên
    rationale: Trong tiếng Việt, “ô uế” thường là tính từ mô tả vật/sự vật hoặc dùng trong cụm “người ô uế”; thêm “người” làm câu rõ và tự nhiên mà không đổi nghĩa.
  - severity: low
    issue: Diễn đạt “nơi cư ngụ ... phải nằm ngoài trại” gượng
    rationale: Với nơi ở, “ở ngoài trại” là lối diễn đạt chuẩn, tự nhiên hơn và vẫn sát מוֹשָׁבוֹ ... מִחוּץ לַמַּחֲנֶה.
  - severity: low
    issue: Chú thích a có các lựa chọn từ vựng chưa nhất quán và chưa tự nhiên
    rationale: “vết thương tổn” không phải cách nói hiện đại tự nhiên; đồng thời “bệnh” không nên là lựa chọn thay thế cho “vết bệnh”. Chú thích nên giải thích phạm vi rộng của נגע và nêu các phương án như “tổn thương”, “chứng bệnh”, hoặc “tai họa” trong các ngữ cảnh khác.
