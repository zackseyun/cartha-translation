  - severity: low
    issue: “Chỗ phát ban có vảy” hơi khẩu ngữ và kém gọn.
    rationale: “Vết phát ban có vảy” là cách gọi tự nhiên hơn cho tổn thương da được mô tả, không làm thu hẹp nghĩa của מִסְפַּחַת.
