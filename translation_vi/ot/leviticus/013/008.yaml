  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: vi
  text: Thầy tế lễ sẽ khám xét người ấy; nếu vết phát ban có vảy đã lan trên da, thầy tế lễ sẽ tuyên bố người ấy là ô uế; đó là bệnh tsaraʿat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là tsaraʿat, theo truyền thống thường được dịch là “bệnh phong”; trong sách Lê-vi, thuật ngữ này có thể chỉ nhiều tình trạng nghiêm trọng khác nhau trên da, chứ không chỉ bệnh phong theo nghĩa y học hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: sẽ khám
  rationale: Trong thủ tục chẩn định của luật tế lễ, động từ này chỉ việc quan sát để đánh giá, không chỉ đơn thuần là nhìn thấy.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi tự nhiên và quen thuộc trong tiếng Việt dành cho người có thẩm quyền khám xét và công bố tình trạng thanh sạch theo luật Lê-vi.
- source_word: וְהִנֵּה
  choice: và nếu thấy
  rationale: Trong công thức khám xét này, từ ngữ giới thiệu điều được phát hiện và mang lực điều kiện; cách dịch này tự nhiên mà vẫn giữ ý quan sát trực tiếp.
- source_word: פָּשְׂתָה
  choice: đã lan ra
  rationale: Diễn đạt tiêu chí chẩn định quan trọng là tổn thương đã lan rộng trên da.
- source_word: הַמִּסְפַּחַת
  choice: chỗ phát ban có vảy
  rationale: Diễn tả một tổn thương ngoài da có tính bề mặt; cụ thể hơn 'vết ban' nhưng không thu hẹp thành một loại vảy hay mày nhất định.
- source_word: בָּעוֹר
  choice: trên da
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt về vị trí của tổn thương.
- source_word: וְטִמְּאוֹ
  choice: phải tuyên bố người ấy là ô uế
  rationale: Thầy tế lễ công bố có thẩm quyền về tình trạng nghi lễ, chứ không làm cho người ấy trở nên ô uế.
- source_word: צָרַעַת
  choice: bệnh tsaraʿat
  rationale: Giữ dạng chuyển tự để không đồng nhất thuật ngữ Hê-bơ-rơ rộng nghĩa này với bệnh phong hiện đại, đồng thời cho thấy đây là tên loại bệnh trong luật tế lễ.
- source_word: הִוא
  choice: đó là
  rationale: Đại từ giống cái quy chiếu về tình trạng vừa được mô tả và tạo thành mệnh đề xác định.
theological_decisions:
- issue: Cách dịch צָרַעַת trong luật thanh sạch Lê-vi
  choice: bệnh tsaraʿat
  alternative: bệnh phong; một bệnh ngoài da; bệnh ngoài da gây ô uế
  rationale: צָרַעַת không tương ứng chính xác với bệnh Hansen hiện đại và trong Lê-vi có phạm vi rộng hơn. Chuyển tự kèm chú thích bảo tồn sự không xác định về y khoa mà vẫn giữ vai trò phân loại của thuật ngữ trong văn bản.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” và “ô uế” theo ngôn ngữ Kinh Thánh Việt ngữ quen thuộc; cấu trúc câu làm rõ trình tự khám, phát hiện và công bố.
