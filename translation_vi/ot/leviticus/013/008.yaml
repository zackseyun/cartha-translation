revisions:
- from: Thầy tế lễ sẽ khám người ấy, và nếu thấy chỗ phát ban có vảy đã lan ra trên da, thì thầy tế lễ phải tuyên bố người ấy là ô uế; đó là bệnh tsaraʿat.[a]
  to: Thầy tế lễ sẽ khám xét người ấy; nếu vết phát ban có vảy đã lan trên da, thầy tế lễ sẽ tuyên bố người ấy là ô uế; đó là bệnh tsaraʿat.[a]
  rationale: 'Chỉnh nhẹ để câu tiếng Việt tự nhiên và sát công thức chẩn định hơn: dùng “khám xét”, thay “chỗ” bằng “vết”, và chuyển mệnh đề có ‘và nếu thấy’ thành điều kiện trực tiếp. Giữ nguyên thuật ngữ chuyển tự và chú thích để không áp đặt một chẩn đoán y học hiện đại lên צָרַעַת.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:46:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi hành động của tiếng Hê-bơ-rơ: thầy tế lễ khám xét, phát hiện tổn thương đã lan trên da, rồi công bố người ấy ô uế. Việc giữ chuyển tự tsaraʿat kèm chú thích là lựa chọn thận trọng, không đồng nhất thuật ngữ nghi lễ rộng nghĩa này với bệnh Hansen. Tuy nhiên, “và nếu thấy” thêm một động từ ‘thấy’ và làm mệnh đề điều kiện kém sát với công thức ‘và kìa, tổn thương đã lan’; có thể diễn đạt gọn và rõ hơn mà vẫn giữ lực điều kiện ngầm.'
  naturalness: “Khám xét” và “vết phát ban có vảy” tự nhiên, rõ nghĩa hơn “khám” và “chỗ phát ban có vảy” trong văn phong luật lệ hiện đại. Bỏ “và” đầu mệnh đề điều kiện giúp câu tiếng Việt mạch lạc hơn. “Sẽ tuyên bố” phản ánh thì/phương thức quy định của câu hơn “phải tuyên bố”, dù cả hai đều có thể chấp nhận.
  terminology: “Thầy tế lễ” và “ô uế” phù hợp với thuật ngữ Kinh Thánh Việt ngữ. “Bệnh tsaraʿat” bảo toàn tính không xác định về y khoa; chú thích giải thích truyền thống dịch là “bệnh phong” và tránh hiểu theo nghĩa y học hiện đại.
  issues:
  - severity: low
    issue: Cụm “và nếu thấy” vừa thêm động từ ‘thấy’ vừa làm cấu trúc câu hơi nặng.
