source:
  edition: WLC
  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: vi
  text: 'Người bị bệnh ngoài da[a], là người có tổn thương ấy, phải xé rách quần áo, để tóc xõa rối, che môi trên[b] và kêu lên: “Ô uế! Ô uế!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thuật ngữ Hê-bơ-rơ chỉ nhiều loại bệnh trạng ngoài da, không nhất thiết là bệnh phong (bệnh Hansen).
    reason: Ngăn cách hiểu quá hẹp theo thuật ngữ y khoa hiện đại.
  - marker: b
    text: 'Hoặc: “che vùng ria mép.” Cụm Hê-bơ-rơ có thể chỉ môi trên hoặc vùng ria mép; đây là một dấu hiệu than khóc và cảnh báo công khai.'
    reason: Bảo toàn nghĩa từ vựng có tranh luận của שָׂפָם mà không giả định người ấy có ria mép.
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: người mắc bệnh ngoài da
  rationale: Tránh từ “người phong” vốn dễ bị hiểu riêng là bệnh Hansen; trong Lê-vi Ký, thuật ngữ Hê-bơ-rơ chỉ một phạm vi bệnh trạng ngoài da rộng hơn.
- source_word: הַנֶּגַע
  choice: dấu bệnh
  rationale: Trong ngữ cảnh chẩn định của chương 13, từ này chỉ biểu hiện hay tổn thương được nhận biết, không nhất thiết hàm ý nhiễm trùng theo vi trùng học hiện đại.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: phải xé áo
  rationale: Diễn đạt tự nhiên hành động để quần áo bị xé như một dấu hiệu công khai của tang chế hoặc khốn khổ.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: để tóc xõa rối
  rationale: פָרוּעַ ở đây hợp lý nhất là tóc được thả, không chải sửa; cách dịch này tránh cách hiểu là đầu để trần.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: che phần mép trên
  rationale: שָׂפָם có thể chỉ mép trên hoặc vùng ria mép. “Phần mép trên” bảo toàn phạm vi nghĩa mà không giả định người ấy có ria.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: 'kêu lên: “Ô uế! Ô uế!”'
  rationale: Động từ diễn tả tiếng gọi công khai; sự lặp lại nhấn mạnh lời báo về tình trạng ô uế theo nghi lễ.
theological_decisions:
- issue: Bản chất của טָמֵא trong luật Lê-vi
  choice: ô uế
  alternative: không thanh sạch; nhơ uế
  rationale: “Ô uế” giữ được ý nghĩa về tình trạng nghi lễ và xã hội, không biến câu này thành lời kết án đạo đức hay chẩn đoán y khoa hiện đại.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “phải” cho các mệnh lệnh pháp quy; giữ tiếng kêu lặp đôi của nguyên văn. Đại từ “người” phản ánh danh từ chỉ người ở số ít mà không thêm giới tính không cần thiết.
