revisions:
- from: 'Còn người mắc bệnh ngoài da[a], tức người mang dấu bệnh ấy, thì phải xé áo, để tóc xõa rối, che phần mép trên và kêu lên: “Ô uế! Ô uế!”'
  to: 'Người bị bệnh ngoài da[a], là người có tổn thương ấy, phải xé rách quần áo, để tóc xõa rối, che môi trên[b] và kêu lên: “Ô uế! Ô uế!”'
  rationale: 'Chỉnh hai điểm diễn đạt để tăng tính tự nhiên và độ chính xác từ vựng: thay “phần mép trên” bằng “môi trên” kèm chú thích cho nghĩa thay thế, và thay cụm giải thích gượng bằng “là người có tổn thương ấy.” Các mệnh lệnh, dấu hiệu công khai, và tiếng hô về tình trạng ô uế theo nghi lễ đều được giữ nguyên.'
