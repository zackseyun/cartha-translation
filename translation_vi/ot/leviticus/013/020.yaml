source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: vi
  text: Thầy tế lễ phải khám vết ấy. Nếu thấy vết đó có vẻ lõm hơn mặt da và lông trên vết ấy đã hóa trắng, thì thầy tế lễ phải tuyên bố người ấy là ô uế. Đó là một vết bệnh về da[a]; nó đã phát ra trong nhọt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ צָרַעַת theo truyền thống thường được dịch là “phong hủi”; trong sách Lê-vi, từ này có lẽ chỉ nhiều tình trạng về da khác nhau, chứ không riêng bệnh Hansen ngày nay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: phải khám
  rationale: Trong thủ tục chẩn định của luật tế lễ, động từ ראה mang nghĩa xem xét, kiểm tra chứ không chỉ đơn thuần là nhìn thấy.
- source_word: וְהִנֵּה
  choice: nếu thấy
  rationale: Trong câu điều kiện chẩn định này, cách diễn đạt tự nhiên bằng tiếng Việt vẫn giữ được chức năng thu hút sự chú ý đến các dấu hiệu quan sát được.
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: bề mặt vết đó lõm sâu hơn da
  rationale: Diễn tả vết tổn thương trông thấp hoặc lõm xuống so với vùng da xung quanh; “lõm sâu hơn da” vừa rõ nghĩa vừa gần với hình ảnh của nguyên văn.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: lông trên đó đã chuyển sang màu trắng
  rationale: Hậu tố giống cái quy chiếu đến vùng tổn thương; cách dịch này tránh hiểu là toàn bộ lông trên cơ thể.
- source_word: וְטִמְּאוֹ
  choice: phải tuyên bố người ấy là ô uế
  rationale: Thầy tế lễ đưa ra phán định có thẩm quyền về tình trạng thanh sạch theo nghi lễ, chứ không làm cho người ấy trở nên ô uế.
- source_word: נֶגַע צָרַעַת
  choice: một vết bệnh da nghiêm trọng
  rationale: נֶגַע chỉ vết hoặc biểu hiện bệnh, còn צָרַעַת là một phạm trù bệnh trạng rộng hơn bệnh Hansen hiện đại. Cách dịch này tránh sự đồng nhất sai về y khoa mà vẫn giữ tính nghiêm trọng của chẩn định.
- source_word: בַּשְּׁחִין
  choice: nơi nhọt
  rationale: שְׁחִין chỉ nhọt hoặc chỗ viêm loét; “nhọt” ngắn gọn, cụ thể và phù hợp với ngữ cảnh.
- source_word: פָּרָחָה
  choice: phát ra
  rationale: Động từ diễn tả bệnh trạng nảy sinh hoặc bộc phát tại chỗ nhọt, không nhất thiết hàm ý đã lan rộng khắp cơ thể.
theological_decisions:
- issue: Cách dịch צָרַעַת trong luật thanh sạch của sách Lê-vi
  choice: bệnh da nghiêm trọng
  alternative: phong hủi
  rationale: Thuật ngữ Hê-bơ-rơ bao quát nhiều tình trạng hơn bệnh Hansen hiện đại. Bản dịch chính tránh áp đặt một chẩn đoán y khoa lỗi thời, còn chú thích bảo lưu cách dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo ngữ cảnh chức vụ tế lễ; diễn đạt quy trình chẩn định bằng câu điều kiện tự nhiên trong tiếng Việt, đồng thời giữ sự phân biệt giữa bệnh trạng và tình trạng ô uế theo nghi lễ.
