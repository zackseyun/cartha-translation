revisions:
- from: Thầy tế lễ phải khám vết ấy; nếu thấy bề mặt vết đó lõm sâu hơn da và lông trên đó đã chuyển sang màu trắng, thì thầy tế lễ phải tuyên bố người ấy là ô uế. Đó là một vết bệnh da nghiêm trọng[a] phát ra nơi nhọt.
  to: Thầy tế lễ phải khám vết ấy. Nếu thấy vết đó có vẻ lõm hơn mặt da và lông trên vết ấy đã hóa trắng, thì thầy tế lễ phải tuyên bố người ấy là ô uế. Đó là một vết bệnh về da[a]; nó đã phát ra trong nhọt.
  rationale: Bản sửa loại bỏ ý «nghiêm trọng» không có trong nguyên văn; chỉnh mô tả vết tổn thương là lõm so với mặt da; và làm rõ rằng vết bệnh đã bộc phát trong nhọt. Chú thích được đặt sau «bệnh về da», là phần dịch của צָרַעַת, và được diễn đạt trung tính về mặt y khoa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:46:48Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng trình tự chẩn định, việc vị tế lễ tuyên bố người ấy ô uế theo nghi lễ, và việc tình trạng da xuất hiện tại chỗ nhọt. Tuy nhiên, «nghiêm trọng» thêm sắc thái không được nêu rõ trong נֶגַע צָרַעַת; «lõm sâu hơn da» chưa diễn đạt chuẩn quan hệ với bề mặt da; và «phát ra nơi nhọt» không tự nhiên, chưa rõ ý bệnh trạng đã bộc phát trong chỗ nhọt.
  naturalness: Văn phong nhìn chung rõ và phù hợp. Bản sửa dùng «lõm hơn mặt da» và «đã phát ra trong nhọt» để tự nhiên hơn trong tiếng Việt hiện đại, đồng thời giữ tính chất quan sát-chẩn định của câu.
  terminology: «Thầy tế lễ» và «ô uế» phù hợp với bối cảnh luật thanh sạch nghi lễ. Dịch צָרַעַת là «bệnh về da» trong thân bài, kèm chú thích về cách dịch truyền thống «phong hủi», tránh đồng nhất thuật ngữ này với bệnh Hansen hiện đại. «Vết bệnh về da» giữ được cả נֶגַע (vết/tổn thương) lẫn צָרַעַת mà không thêm mức độ nghiêm trọng.
  issues:
  - severity: medium
    issue: «vết bệnh da nghiêm trọng» thêm ý «nghiêm trọng».
    rationale: Cụm נֶגַע צָרַעַת chỉ một vết/tổn thương thuộc tình trạng צָרַעַת; từ «nghiêm trọng» không có đối ứng trực tiếp trong nguyên văn và có thể khiến phạm vi thuật ngữ bị thu hẹp hoặc cường điệu hóa.
  - severity: medium
    issue: «lõm sâu hơn da» diễn đạt không chính xác và kém tự nhiên.
    rationale: מַרְאֶהָ שָׁפָל מִן־הָעוֹר nói vết ấy trông thấp/lõm hơn bề mặt da, không phải «sâu hơn da» theo nghĩa so sánh không rõ chuẩn.
  - severity: low
    issue: «phát ra nơi nhọt» chưa tự nhiên.
    rationale: פָּרָחָה mô tả tình trạng bệnh đã bộc phát trong chỗ nhọt. «Đã phát ra trong nhọt» làm rõ quan hệ này mà không hàm ý bệnh lan rộng.
