  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וּ/ב֛/וֹ שֵׂעָ֥ר צָהֹ֖ב דָּ֑ק וְ/טִמֵּ֨א אֹת֤/וֹ הַ/כֹּהֵן֙ נֶ֣תֶק ה֔וּא צָרַ֧עַת הָ/רֹ֛אשׁ א֥וֹ הַ/זָּקָ֖ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: vi
  text: Thầy tế lễ phải khám vết bệnh. Nếu thấy bề ngoài của vết ấy có vẻ sâu hơn mặt da và trong đó có lông vàng, mảnh, thì thầy tế lễ phải tuyên bố người ấy là ô uế. Đó là chứng lở tróc[a], tức bệnh ngoài da[b] ở đầu hoặc vùng râu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ một chứng bệnh đặc thù ở đầu hoặc vùng râu; chẩn đoán y học chính xác hiện không chắc chắn.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ thường được dịch theo truyền thống là “phong hủi”, nhưng chỉ một nhóm bệnh rộng hơn và không nhất thiết là bệnh Hansen hiện đại.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: vết bệnh
  rationale: Trong văn cảnh khám xét, từ này chỉ vùng tổn thương có thể nhìn thấy; “vết bệnh” tự nhiên, rõ nghĩa và không mặc nhiên xác định một chẩn đoán hiện đại.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: vết ấy trông lõm sâu hơn da
  rationale: Diễn đạt đặc điểm quan sát được của tổn thương, giữ ý “trông sâu hơn da” mà không khẳng định cơ chế bệnh lý.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: lông vàng, mảnh
  rationale: Giữ đủ hai đặc điểm chẩn đoán là màu vàng và độ mảnh; “lông” phù hợp vì vị trí có thể là đầu hoặc vùng râu.
- source_word: וְטִמֵּא אֹתוֹ
  choice: tuyên bố người ấy là ô uế
  rationale: Thầy tế lễ đưa ra phán quyết về tình trạng thanh sạch theo nghi lễ, chứ không làm cho người ấy trở nên ô uế.
- source_word: נֶתֶק
  choice: chứng lở tróc
  rationale: Đây là thuật ngữ chuyên biệt chỉ một chứng bệnh ở đầu hoặc vùng râu, nhưng căn bệnh y học chính xác không chắc chắn; cách dịch này dễ hiểu mà vẫn tránh đồng nhất với một bệnh hiện đại cụ thể.
- source_word: צָרַעַת
  choice: bệnh ngoài da
  rationale: Thuật ngữ Hê-bơ-rơ có phạm vi rộng hơn bệnh Hansen hiện đại; “bệnh ngoài da” tránh cách hiểu sai do từ truyền thống “phong hủi”.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: ở đầu hoặc vùng râu
  rationale: Giữ nguyên hai vị trí được nêu và liên từ lựa chọn “hoặc”; “vùng râu” tự nhiên hơn việc nói căn bệnh ở chính sợi râu.
theological_decisions:
- issue: Bản chất của lời tuyên bố ô uế
  choice: Diễn đạt như một phán quyết nghi lễ của thầy tế lễ
  alternative: Diễn đạt như thể thầy tế lễ khiến người bệnh trở nên ô uế
  rationale: Dạng động từ trong luật tế lễ nói đến việc xác nhận hoặc công bố tình trạng ô uế, không quy nguyên nhân gây ô uế cho thầy tế lễ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc; câu văn làm rõ diễn tiến khám xét và tuyên bố, đồng thời không áp đặt một chẩn đoán y học hiện đại lên các thuật ngữ cổ.
