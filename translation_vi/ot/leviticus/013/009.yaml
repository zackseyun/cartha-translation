source:
  edition: WLC
  text: נֶ֣גַע צָרַ֔עַת כִּ֥י תִהְיֶ֖ה בְּ/אָדָ֑ם וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/009.yaml
  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: vi
  text: Khi một người mắc chứng bệnh ngoài da[a], người ấy phải được đưa đến thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ צָרַעַת theo truyền thống thường được dịch là “bệnh phong”, nhưng có lẽ chỉ nhiều loại bệnh hoặc tình trạng nghiêm trọng trên da, chứ không riêng bệnh phong theo nghĩa y khoa hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע צָרַעַת
  choice: chứng bệnh ngoài da
  rationale: Trong ngữ cảnh Lê-vi Ký 13, cụm từ chỉ một tình trạng có dấu hiệu trên da cần được thầy tế lễ khám xét. Cách dịch này tự nhiên trong tiếng Việt và không đồng nhất thuật ngữ Hê-bơ-rơ với bệnh phong theo nghĩa y khoa hiện đại.
- source_word: כִּי תִהְיֶה
  choice: khi ... mắc
  rationale: כִּי mở đầu một trường hợp trong luật; “khi” phù hợp với lối trình bày quy định. Cấu trúc “mắc chứng bệnh” diễn đạt tự nhiên ý tình trạng bệnh ở nơi một người mà không thêm ý bệnh mới xuất hiện.
- source_word: בְּאָדָם
  choice: một người
  rationale: אָדָם ở đây chỉ một cá nhân nói chung, không xác định giới tính; “một người” là cách diễn đạt rõ ràng, tự nhiên và đúng phạm vi nghĩa trong tiếng Việt.
- source_word: וְהוּבָא
  choice: người ấy phải được đưa
  rationale: Dạng bị động diễn tả bước thủ tục tiếp theo. “Phải được đưa” bảo toàn thể bị động và lực quy định của câu luật.
- source_word: אֶל הַכֹּהֵן
  choice: đến thầy tế lễ
  rationale: Mạo từ xác định chỉ vị thầy tế lễ đảm nhiệm việc khám xét trong thủ tục đã được quy định; “thầy tế lễ” là thuật ngữ Kinh Thánh quen thuộc, trang trọng.
theological_decisions:
- issue: Phạm vi nghĩa của צָרַעַת
  choice: chứng bệnh ngoài da
  alternative: bệnh phong
  rationale: צָרַעַת trong luật này bao quát những tình trạng rộng hơn bệnh Hansen hiện đại. Dịch “bệnh ngoài da” tránh áp đặt một chẩn đoán y khoa quá hẹp, còn chú thích ghi nhận cách dịch truyền thống.
- issue: Cách hiểu אָדָם trong trường hợp luật số ít
  choice: một người
  alternative: một người đàn ông
  rationale: Danh từ אָדָם tại đây mang nghĩa cá nhân loài người nói chung; ngữ cảnh không giới hạn đối tượng vào nam giới. Tiếng Việt dùng “một người” vừa chính xác vừa tự nhiên.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Dùng “thầy tế lễ” để nhất quán với thuật ngữ Kinh Thánh tiếng Việt; tránh cách nói thuần y khoa khiến thuật ngữ cổ bị hiểu quá hẹp.
