base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: vi
  text: Nhưng nếu vùng tổn thương trên da thật sự lan rộng sau khi người ấy đã trình diện với thầy tế lễ để được xác định là thanh sạch,[a][b][c] thì người ấy phải trình diện với thầy tế lễ lần thứ hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vết phát ban”, “chỗ nổi vảy”, hoặc theo cách dịch truyền thống là “vết ghẻ”. Từ Hê-bơ-rơ chỉ một tình trạng nông trên da đang được khám xét.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ dùng cấu trúc nhấn mạnh: “nếu vùng tổn thương chắc chắn/thật sự lan rộng”.'
    reason: lexical_alternative
  - marker: c
    text: “Để được xác định là thanh sạch” nói đến việc người ấy được khám xét nhằm đi đến sự công nhận là thanh sạch.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: thật sự lan rộng
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ cùng gốc có tác dụng nhấn mạnh; “thật sự lan rộng” giữ được sắc thái nhấn mạnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: הַמִּסְפַּחַת
  choice: vùng tổn thương trên da
  rationale: Từ này chỉ một tình trạng nông trên da đang được xem xét. Cách dịch này đủ rộng để không xác định quá mức đó là vảy, ban hay mày.
- source_word: בָּעוֹר
  choice: trên da
  rationale: Diễn đạt tự nhiên vị trí của tình trạng; nguyên văn không có đại từ sở hữu rõ ràng.
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: sau khi người ấy đã trình diện
  rationale: Dạng Niphal của ראה trong bối cảnh khám xét mang sắc thái người ấy tự đến để được thầy tế lễ xem xét.
- source_word: אֶל הַכֹּהֵן
  choice: với thầy tế lễ
  rationale: Diễn tả việc đến gặp và trình diện trước người thi hành việc khám xét theo luật.
- source_word: לְטָהֳרָתוֹ
  choice: để được xác định là thanh sạch
  rationale: Trong Lê-vi Ký 13, cụm từ hướng đến việc khám xét để thầy tế lễ tuyên bố người ấy thanh sạch, chứ không nhất thiết mô tả một hành động tẩy sạch.
- source_word: וְנִרְאָה שֵׁנִית
  choice: thì người ấy phải trình diện ... lần thứ hai
  rationale: Trong văn luật, dạng này diễn tả yêu cầu người ấy trở lại để được khám xét lần nữa.
theological_decisions:
- issue: Ý nghĩa của לְטָהֳרָתוֹ trong thủ tục về tình trạng thanh sạch
  choice: để được xác định là thanh sạch
  alternative: để được thanh tẩy
  rationale: Mạch văn nói về việc thầy tế lễ khám và công bố tình trạng thanh sạch; bản dịch tránh hàm ý rằng nghi thức tự nó chữa hoặc tẩy sạch tổn thương.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo ngữ cảnh chức vụ tư tế trong Lê-vi Ký; “người ấy” tránh giả định thêm ngoài đại từ giống đực của nguyên văn. Các chú thích giữ lại độ rộng nghĩa của thuật ngữ da liễu và sắc thái thủ tục của việc tuyên bố thanh sạch.
