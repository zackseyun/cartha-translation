  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: vi
  text: Thầy tế lễ phải xem xét chỗ ấy. Kìa, lông ở đốm sáng đã hóa trắng, và chỗ ấy trông lõm hơn mặt da; đó là bệnh ngoài da[a] phát ra tại vết bỏng. Thầy tế lễ phải tuyên bố người ấy là ô uế. Đó là một tổn thương thuộc bệnh ngoài da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ tsaraʿat chỉ một phạm trù rộng về các tổn thương ở da; theo truyền thống thường được dịch là “bệnh phong” hoặc “bệnh cùi”.
    reason: Giải thích phạm vi nghĩa rộng của thuật ngữ và tránh đồng nhất nó với riêng bệnh Hansen.
lexical_decisions:
- source_word: רָאָה
  choice: khám
  rationale: Trong bối cảnh chẩn định của luật tế lễ, động từ này chỉ việc xem xét chính thức, không chỉ đơn thuần là nhìn.
- source_word: בַּהֶרֶת
  choice: đốm sáng
  rationale: Diễn đạt dấu hiệu sáng, dễ thấy trên da mà không gán một thuật ngữ y khoa hiện đại.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: lông ... đã hóa trắng
  rationale: Giữ ý biến đổi sang màu trắng của lông tại vùng tổn thương.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: chỗ ấy trông lõm sâu hơn mặt da
  rationale: Diễn đạt tự nhiên dấu hiệu nhìn thấy như nằm thấp hoặc sâu hơn bề mặt da, đồng thời giữ sắc thái về diện mạo.
- source_word: צָרַעַת
  choice: bệnh ngoài da
  rationale: Từ Hê-bơ-rơ chỉ một phạm trù nghi lễ rộng hơn bệnh Hansen; cách dịch này tránh đồng nhất sai với bệnh phong hiện đại.
- source_word: מִכְוָה
  choice: vết bỏng
  rationale: Chỉ vùng da đã bị bỏng, là nơi chứng bệnh phát ra; tiếng Việt không cần mặc định rằng nơi ấy đã thành sẹo.
- source_word: פָּרָחָה
  choice: phát ra
  rationale: Trong ngữ cảnh bệnh ngoài da, động từ diễn tả tổn thương mọc hoặc bộc phát tại vùng bỏng.
- source_word: טִמֵּא אֹתוֹ
  choice: tuyên bố người ấy là ô uế
  rationale: Thầy tế lễ đưa ra phán định về tình trạng nghi lễ, chứ không làm cho người ấy trở nên ô uế.
- source_word: נֶגַע צָרַעַת
  choice: một tổn thương do bệnh ngoài da
  rationale: “Tổn thương” giữ nghĩa dấu hoặc vết bệnh của נֶגַע mà không hàm ý chắc chắn về nhiễm trùng theo y học hiện đại.
theological_decisions:
- issue: Cách dịch צָרַעַת trong luật thanh sạch của Lê-vi Ký
  choice: bệnh ngoài da
  alternative: bệnh phong; bệnh cùi; bệnh ngoài da gây ô uế
  rationale: צָרַעַת bao quát nhiều dạng tổn thương thuộc phạm trù nghi lễ và không thể giản lược thành bệnh Hansen; bản dịch tránh tính lỗi thời về y khoa và không thêm “gây ô uế” ngay vào tên bệnh.
- issue: Ý nghĩa hành động của thầy tế lễ trong טִמֵּא אֹתוֹ
  choice: tuyên bố người ấy là ô uế
  alternative: làm cho người ấy ô uế
  rationale: Ngữ cảnh mô tả phán định có thẩm quyền của thầy tế lễ về tình trạng thanh sạch, không nhất thiết nói ông là nguyên nhân tạo ra sự ô uế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo lối gọi quen thuộc trong tiếng Việt; giữ từ trình hiện “Kìa” để phản ánh וְהִנֵּה, dù cấu trúc này hơi trang trọng. Dùng “ô uế” theo nghĩa nghi lễ của phân đoạn.
