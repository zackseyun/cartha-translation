revisions:
- from: 'Thầy tế lễ phải khám chỗ ấy. Kìa, lông trong đốm sáng đã hóa trắng, và chỗ ấy trông lõm sâu hơn mặt da; đó là bệnh ngoài da[a] phát ra tại vết bỏng. Thầy tế lễ phải tuyên bố người ấy là ô uế. Đó là một tổn thương do bệnh ngoài da.


    [a] Từ Hê-bơ-rơ tsaraʿat chỉ một phạm trù rộng gồm các chứng tổn thương nghiêm trọng ở da; theo truyền thống thường được dịch là “bệnh phong” hoặc “bệnh cùi”.'
  to: Thầy tế lễ phải xem xét chỗ ấy. Kìa, lông ở đốm sáng đã hóa trắng, và chỗ ấy trông lõm hơn mặt da; đó là bệnh ngoài da[a] phát ra tại vết bỏng. Thầy tế lễ phải tuyên bố người ấy là ô uế. Đó là một tổn thương thuộc bệnh ngoài da.
  rationale: Bản sửa giữ các lựa chọn chính có cơ sở của bản thảo, gồm “Kìa” cho וְהִנֵּה, “vết bỏng” cho מִכְוָה, và phán định nghi lễ “tuyên bố ... ô uế”. Các điều chỉnh chỉ làm rõ quan hệ ngữ nghĩa của נֶגַע צָרַעַת, cải thiện cách diễn đạt tiếng Việt, và loại bỏ đánh giá về mức độ bệnh không được nêu rõ trong nguồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:46:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự chẩn định của câu Hê-bơ-rơ: thầy tế lễ xem xét, lông chuyển trắng, vẻ ngoài sâu hơn da, bệnh phát ra tại chỗ bỏng, rồi tuyên bố người ấy ô uế. Tuy nhiên, cụm “tổn thương do bệnh ngoài da” có thể hàm ý quan hệ nguyên nhân không có trong נֶגַע צָרַעַת; đây là một tổn thương/ban thuộc phạm trù bệnh ngoài da.'
  naturalness: Văn phong nhìn chung hiện đại và rõ. “Khám chỗ ấy” có thể hiểu là khám một vị trí, nhưng “xem xét chỗ ấy” hợp hơn với hành vi quan sát-phán định của thầy tế lễ. “Trông lõm sâu hơn mặt da” hơi nặng và lặp ý; “trông lõm hơn mặt da” tự nhiên hơn mà vẫn diễn đạt dấu hiệu bề ngoài có vẻ sâu hơn da.
  terminology: “Bệnh ngoài da” là lựa chọn thận trọng, không đồng nhất צָרַעַת với bệnh Hansen. “Ô uế” giữ đúng bình diện nghi lễ. Chú thích giải thích tốt phạm vi của tsaraʿat; nên tránh gọi các tổn thương ấy mặc nhiên là “nghiêm trọng”, vì câu và thuật ngữ không tự xác định mức độ lâm sàng đó.
  issues:
  - severity: medium
    issue: “một tổn thương do bệnh ngoài da”
    rationale: Cấu trúc “do” diễn tả nguyên nhân, trong khi נֶגַע צָרַעַת là một tổn thương/ban thuộc loại hoặc phạm trù צָרַעַת. “Một tổn thương thuộc bệnh ngoài da” tránh thêm quan hệ nhân quả.
  - severity: low
    issue: “khám chỗ ấy” và “trông lõm sâu hơn mặt da”
    rationale: Đổi thành “xem xét chỗ ấy” phù hợp hơn với động từ quan sát chẩn định ראה; “trông lõm hơn mặt da” tự nhiên hơn và không tăng cường ý ‘sâu’ quá mức.
  - severity: low
    issue: Chú thích nói “các chứng tổn thương nghiêm trọng ở da”
    rationale: Từ צָרַעַת chỉ một phạm trù nghi lễ-da liễu rộng; việc thêm mức độ “nghiêm trọng” không cần thiết và có thể gợi một đánh giá y khoa hiện đại.
  revised_text: Thầy tế lễ phải xem xét chỗ ấy. Kìa, lông ở đốm sáng đã hóa trắng, và chỗ ấy trông lõm hơn mặt da; đó là bệnh ngoài da[a] phát ra tại vết bỏng. Thầy tế lễ phải tuyên bố người ấy là ô uế. Đó là một tổn thương thuộc bệnh ngoài da.
