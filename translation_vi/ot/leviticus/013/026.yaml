  to: Nhưng nếu thầy tế lễ xem xét vết ấy và thấy trong đốm sáng không có lông trắng, đốm ấy không lõm thấp hơn bề mặt da[a] và có vẻ mờ nhạt, thì thầy tế lễ phải giữ riêng người ấy bảy ngày[b].
  rationale: 'Bản sửa chỉ điều chỉnh hai điểm nhỏ để sát tiếng Hê-bơ-rơ hơn: dùng mô tả tĩnh “có vẻ mờ nhạt” cho כֵהָה thay vì diễn tiến “đã mờ đi,” và dùng “giữ riêng” cho động từ chỉ việc biệt riêng người đó trong thời gian quan sát. Các chú thích vẫn được neo đúng: [a] ở tiêu chí về độ lõm/thấp của đốm và [b] ở động từ giữ riêng.'
  reviewer_model: gpt-5.6-terra
