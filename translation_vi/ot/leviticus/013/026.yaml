  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: vi
  text: Nhưng nếu thầy tế lễ xem xét vết ấy và thấy trong đốm sáng không có lông trắng, đốm ấy không lõm thấp hơn bề mặt da[a] và có vẻ mờ nhạt, thì thầy tế lễ phải giữ riêng người ấy bảy ngày[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thấp hơn bề mặt da”, nghĩa là đốm ấy không có vẻ lõm xuống so với vùng da xung quanh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cách ly người ấy” hoặc “giam giữ người ấy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: xem xét vết ấy
  rationale: Động từ có nghĩa cơ bản là “thấy, nhìn”, nhưng trong ngữ cảnh thầy tế lễ kiểm tra tổn thương da, “xem xét” diễn đạt tự nhiên hành động kiểm tra chính thức; “vết ấy” làm rõ đại từ giống cái mà không xác định đó là một bệnh cụ thể.
- source_word: בַּבֶּהֶרֶת
  choice: trong đốm sáng
  rationale: בַּהֶרֶת chỉ một đốm hay mảng da có vẻ sáng/trắng. “Đốm sáng” giữ được đặc điểm thị giác mà không gán một chẩn đoán y khoa hiện đại.
- source_word: שֵׂעָר לָבָן
  choice: lông trắng
  rationale: Danh từ số ít được dùng theo nghĩa tập hợp. “Lông trắng” tự nhiên trong tiếng Việt và không buộc phải hiểu là chỉ một sợi.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: đốm ấy không lõm xuống dưới da
  rationale: שָׁפָל diễn tả vị trí thấp hoặc lõm. Cách dịch này truyền đạt tiêu chí quan sát là đốm không có vẻ thấp hơn bề mặt da xung quanh.
- source_word: כֵהָה
  choice: đã mờ đi
  rationale: Từ này cho biết vết không còn rõ hoặc rực như trước. “Đã mờ đi” là cách nói hiện đại, tự nhiên trong ngữ cảnh một dấu vết trên da.
- source_word: וְהִסְגִּירוֹ
  choice: phải cách ly người đó
  rationale: Động từ có nghĩa đóng lại, giữ riêng hoặc biệt riêng để theo dõi. “Cách ly” diễn đạt rõ thủ tục trong ngữ cảnh mà không dùng cách nói thô cứng như “nhốt lại”.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Bản dịch trực tiếp và tự nhiên của khoảng thời gian được nêu.
- source_word: וְהִנֵּה
  choice: và thấy
  rationale: Hạt từ hướng sự chú ý đến kết quả quan sát. Trong tiếng Việt hiện đại, kết cấu “xem xét… và thấy” bảo tồn chức năng ấy tự nhiên hơn lối dịch cổ “này” hoặc “kìa”.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng vừa phải, rõ ràng với độc giả hiện đại. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc; tránh thuật ngữ chẩn đoán y khoa hiện đại. Các đại từ được làm rõ bằng “vết ấy”, “đốm ấy” và “người đó” để tiếng Việt mạch lạc.
