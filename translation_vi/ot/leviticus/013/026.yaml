  - severity: low
    issue: “cách ly” có thể gợi một biện pháp y tế công cộng hiện đại.
    rationale: Dù chấp nhận được, “giữ riêng” giữ sát nghĩa וְהִסְגִּירוֹ (‘giam/giữ riêng để theo dõi’) và trung tính hơn về mặt khái niệm.
