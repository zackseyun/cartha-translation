  terminology: 'Các thuật ngữ “sợi dọc,” “sợi ngang,” “vải lanh,” “vải len,” và “da thuộc” đều chính xác, nhất quán và không áp đặt diễn giải thần học. Không cần chú thích: “vải lanh” là cách hiểu ngữ cảnh vững chắc của פִּשְׁתִּים, còn cách dịch không che khuất một bất định đáng kể.'
