  source_fidelity: 'Bản dịch phản ánh đúng chuỗi lựa chọn của tiếng Hê-bơ-rơ: sợi dọc/sợi ngang, lanh/len, da, và mọi vật dụng bằng da. “Da thuộc” phù hợp với עוֹר trong ngữ cảnh đồ dùng, còn “vật dụng nào làm bằng da” truyền đạt tốt בְּכָל מְלֶאכֶת עוֹר.'
