base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: vi
  text: hoặc trên sợi dọc hay sợi ngang của vải lanh hoặc vải len, hoặc trên da thuộc, hoặc trên bất cứ vật dụng nào làm bằng da—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתִי
  choice: sợi dọc
  rationale: Chỉ các sợi chạy theo chiều dọc trong kết cấu dệt; đây là thuật ngữ tiếng Việt rõ ràng và đi tự nhiên với “sợi ngang”.
- source_word: עֵרֶב
  choice: sợi ngang
  rationale: Chỉ các sợi đan ngang qua sợi dọc; “sợi ngang” là cách gọi thông dụng, chính xác trong tiếng Việt.
- source_word: לַפִּשְׁתִּים
  choice: của vải lanh
  rationale: Danh từ có thể chỉ cây lanh, nhưng trong ngữ cảnh các sợi dệt đang được xem xét, nó chỉ vật liệu lanh được dệt thành vải.
- source_word: וְלַצָּמֶר
  choice: hoặc vải len
  rationale: צֶמֶר là len; thêm “vải” giúp cấu trúc tiếng Việt tự nhiên và làm rõ đây là chất liệu dệt, đồng thời không thay đổi ý nghĩa.
- source_word: עוֹר
  choice: da thuộc
  rationale: Trong ngữ cảnh vật liệu và đồ dùng, từ này nhiều khả năng chỉ da động vật đã được xử lý để sử dụng; “da thuộc” tránh gợi đến da còn nguyên trên thân thể.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: trên bất cứ vật dụng nào làm bằng da
  rationale: מְלָאכָה ở đây chỉ sản phẩm hoặc đồ vật được chế tác, không phải công việc trừu tượng; cách dịch này rõ ràng và tự nhiên.
- source_word: אוֹ ... אוֹ
  choice: hoặc ... hay ... hoặc
  rationale: Giữ chuỗi lựa chọn của nguyên văn, nhưng dùng xen kẽ “hay” để câu tiếng Việt bớt nặng mà vẫn biểu đạt các khả năng song song.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu này tiếp nối cú pháp từ câu trước nên giữ dấu gạch ngang ở cuối. Dùng thuật ngữ dệt phổ thông “sợi dọc/sợi ngang”; không cần chú thích vì các từ này trực tiếp và không che khuất một khả năng giải nghĩa quan trọng.
