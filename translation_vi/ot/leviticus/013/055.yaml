translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng thuật ngữ dễ hiểu. Bản dịch tránh gọi hiện tượng này là nấm mốc hay bệnh cụ thể, đồng thời giữ sự bất định thực sự của cụm từ cuối câu.
