source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אַחֲרֵ֣י הֻכַּבֵּ֣ס אֶת הַ/נֶּ֗גַע וְ֠/הִנֵּה לֹֽא הָפַ֨ךְ הַ/נֶּ֤גַע אֶת עֵינ/וֹ֙ וְ/הַ/נֶּ֣גַע לֹֽא פָשָׂ֔ה טָמֵ֣א ה֔וּא בָּ/אֵ֖שׁ תִּשְׂרְפֶ֑/נּוּ פְּחֶ֣תֶת הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: vi
  text: Sau khi đã giặt chỗ nhiễm, thầy tế lễ phải xem xét chỗ ấy[a]. Nếu chỗ nhiễm không thay đổi vẻ ngoài và cũng không lan rộng, thì vật ấy là ô uế. Phải thiêu nó trong lửa; đó là chỗ hư hoại ăn mòn[b], dù ở mặt này hay mặt kia của vật[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “sau khi vật có chỗ nhiễm đã được giặt.” Đại từ làm tân ngữ ngầm của động từ bị động có thể được hiểu là vật liệu bị ảnh hưởng, thay vì riêng chỗ nhiễm.'
    reason: Cấu trúc bị động Hê-bơ-rơ không nêu rõ lại tân ngữ ngoài “chỗ nhiễm”; trong ngữ cảnh, vật liệu mang chỗ nhiễm cũng có thể được hiểu là đối tượng được giặt.
  - marker: b
    text: 'Cũng có thể dịch: “vết ăn mòn” hoặc “chỗ hư hoại có tính phá hủy.” Nghĩa chính xác của từ Hê-bơ-rơ này không chắc chắn.'
    reason: Đây là một danh từ hiếm, chỉ sự xuống cấp có tính ăn mòn hoặc phá hủy trong vật liệu.
  - marker: c
    text: 'Nguyên văn: “ở chỗ hói phía sau hay chỗ hói phía trước của nó.” Trong ngữ cảnh vải hoặc da, có lẽ câu này nói đến hai mặt hay hai bề mặt của vật; cách phân biệt chính xác không rõ.'
    reason: Cụm từ cuối câu khó hiểu và dùng từ chỉ các vùng hói của đầu theo nghĩa ẩn dụ cho vật liệu.
lexical_decisions:
- source_word: וְרָאָה
  choice: phải xem xét
  rationale: Trong ngữ cảnh thầy tế lễ chẩn định theo nghi thức, động từ mang nghĩa xem xét/kiểm tra chứ không chỉ đơn thuần nhìn thấy.
- source_word: אַחֲרֵי הֻכַּבֵּס
  choice: sau khi chỗ nhiễm đã được giặt
  rationale: Dạng bị động của כבס cho biết vật hoặc vùng bị ảnh hưởng đã trải qua việc giặt; cách diễn đạt này giữ rõ nghĩa bị động.
- source_word: הַנֶּגַע
  choice: chỗ nhiễm
  rationale: Trong ngữ cảnh vải hoặc da, từ này chỉ vùng có dấu hiệu hư hại hay nhiễm, không nhất thiết là một bệnh theo nghĩa y học hiện đại.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: không thay đổi vẻ ngoài
  rationale: Thành ngữ Hê-bơ-rơ theo sát chữ là 'không đổi mắt của nó', nói đến diện mạo nhìn thấy được, có thể đặc biệt liên quan đến màu sắc.
- source_word: לֹא פָשָׂה
  choice: không lan rộng
  rationale: פשה trong các quy định này diễn tả việc vùng nhiễm lan ra hoặc mở rộng.
- source_word: טָמֵא הוּא
  choice: vật ấy là ô uế
  rationale: '''Ô uế'' là cách diễn đạt quen thuộc và chính xác cho tình trạng không thanh sạch theo nghi lễ trong sách Lê-vi.'
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: phải thiêu nó trong lửa
  rationale: Động từ ngôi thứ hai số ít là mệnh lệnh dành cho người chịu trách nhiệm; tiếng Việt có thể diễn đạt tự nhiên bằng cấu trúc vô nhân xưng bắt buộc.
- source_word: פְּחֶתֶת
  choice: chỗ mục ăn sâu
  rationale: Danh từ hiếm này chỉ sự hư hoại có tính phá hủy hoặc ăn mòn trong chất liệu; lựa chọn này tránh gán một chẩn đoán hiện đại quá cụ thể.
- source_word: בְּקָרַחְתּוֹ אֹו בְגַבַּחְתּוֹ
  choice: dù ở mặt này hay mặt kia của vật
  rationale: Cặp từ vốn chỉ những vùng hói khác nhau được dùng ẩn dụ cho các mặt hoặc bề mặt của vật liệu. Vì sự phân biệt chính xác giữa hai mặt không chắc chắn, bản dịch giữ ý đối ứng mà không đoán cụ thể.
