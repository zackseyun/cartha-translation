  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: vi
  text: Nhưng nếu thầy tế lễ xem xét và thấy vết đó đã phai sau khi vật đó được giặt, thì ông phải xé bỏ phần có vết khỏi y phục, vật bằng da, sợi dọc hoặc sợi ngang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một điều kiện tiếp nối thủ tục trước đó, đồng thời biểu thị sự tương phản nhẹ.
- source_word: רָאָה הַכֹּהֵן
  choice: thầy tế lễ xem xét
  rationale: Động từ có nghĩa cơ bản là “thấy”, nhưng trong bối cảnh luật lệ này chỉ hành động kiểm tra và đánh giá của thầy tế lễ.
- source_word: וְהִנֵּה
  choice: và thấy
  rationale: Diễn đạt tự nhiên dấu hiệu hướng sự chú ý trong tiếng Hê-bơ-rơ mà vẫn giữ ý phát hiện khi xem xét.
- source_word: כֵּהָה הַנֶּגַע
  choice: vết đó đã phai
  rationale: כֵּהָה cho biết dấu hiệu đã nhạt hoặc giảm mức độ; נֶגַע ở đây là vùng bị ảnh hưởng trên vật liệu, nên “vết” phù hợp hơn cách dịch mang nghĩa dịch bệnh.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: sau khi được giặt
  rationale: Giữ thể bị động của nguyên văn và dùng cách nói tự nhiên trong tiếng Việt.
- source_word: וְקָרַע אֹתוֹ
  choice: ông phải xé bỏ phần có vết
  rationale: Đại từ chỉ phần bị ảnh hưởng cần được loại khỏi vật dụng, chứ không nhất thiết là xé bỏ toàn bộ vật dụng; nêu rõ đối tượng giúp tránh hiểu lầm.
- source_word: מִן הַבֶּגֶד
  choice: khỏi áo
  rationale: בֶּגֶד chỉ áo hoặc vật may mặc; “áo” ngắn gọn và phù hợp mạch văn về vật liệu bị nhiễm.
- source_word: מִן הָעוֹר
  choice: đồ da
  rationale: Trong ngữ cảnh vật liệu, עוֹר chỉ da thuộc hay vật làm bằng da, không phải da người.
- source_word: מִן הַשְּׁתִי
  choice: sợi dọc
  rationale: Thuật ngữ dệt chỉ các sợi chạy theo chiều dọc của tấm vải.
- source_word: מִן הָעֵרֶב
  choice: sợi ngang
  rationale: Thuật ngữ dệt chỉ các sợi đan ngang qua sợi dọc; đây là cách gọi hiện đại, dễ hiểu trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, rõ ràng với độc giả phổ thông. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc; giữ chính xác các thuật ngữ vật liệu bằng cặp “sợi dọc” và “sợi ngang”.
