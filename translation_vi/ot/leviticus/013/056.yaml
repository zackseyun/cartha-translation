revisions:
- from: Nhưng nếu thầy tế lễ xem xét và thấy vết đó đã phai sau khi được giặt, thì ông phải xé bỏ phần có vết khỏi áo, đồ da, sợi dọc hoặc sợi ngang.
  to: Nhưng nếu thầy tế lễ xem xét và thấy vết đó đã phai sau khi vật đó được giặt, thì ông phải xé bỏ phần có vết khỏi y phục, vật bằng da, sợi dọc hoặc sợi ngang.
  rationale: Bản sửa làm rõ vật được giặt, dùng “y phục” để giữ phạm vi của בֶּגֶד, và giữ cách diễn đạt thận trọng “phần có vết” cho đối tượng bị xé bỏ, phù hợp với hành động loại phần bị ảnh hưởng khỏi vật liệu.
