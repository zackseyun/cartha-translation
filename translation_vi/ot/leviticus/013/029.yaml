  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc quy định theo trường hợp của nguyên bản, đồng thời tránh thuật ngữ y khoa quá chuyên biệt. Dấu phẩy cuối câu cho thấy mệnh đề còn tiếp sang câu kế.
