base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/029.yaml
  text: When a man or a woman has an infection on the head or on the beard[b][a],
translation:
  language: vi
  text: Khi một người nam hay người nữ có vết bệnh[a] trên đầu[b] hoặc ở râu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tổn thương”, “bệnh” hoặc “dấu vết”. Từ Hê-bơ-rơ negaʿ là một từ có nghĩa rộng trong sách Lê-vi Ký, chỉ một tổn thương hoặc biểu hiện bất thường có thể nhìn thấy và được thầy tế lễ xem xét.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ là “đầu”; trong ngữ cảnh này có thể đặc biệt chỉ da đầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: một người nam hay người nữ
  rationale: Tiếng Hê-bơ-rơ nêu rõ cả nam lẫn nữ; bản dịch giữ nguyên sự phân biệt này bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: כִּי
  choice: Khi
  rationale: Trong quy định xét trường hợp, từ này mở đầu một điều kiện; “Khi” vừa tự nhiên vừa giữ được ý nghĩa có điều kiện theo ngữ cảnh.
- source_word: יִהְיֶה בּוֹ
  choice: có
  rationale: Nghĩa sát là “có ở/trên người ấy”; “có” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: נָגַע
  choice: vết bệnh
  rationale: Từ נגע có nghĩa rộng, chỉ một tổn thương hay biểu hiện bất thường có thể nhìn thấy và được thầy tế lễ xem xét; “vết bệnh” dễ hiểu mà không đồng nhất nó với một chẩn đoán y khoa hiện đại cụ thể.
- source_word: בְּ/רֹאשׁ
  choice: trên đầu
  rationale: Giữ nghĩa rộng của רֹאשׁ là “đầu”; trong ngữ cảnh có thể đặc biệt chỉ da đầu, nhưng không đưa sự cụ thể hóa ấy vào chính văn.
- source_word: בְ/זָקָן
  choice: ở vùng râu
  rationale: זָקָן là “râu”. “Ở vùng râu” diễn đạt tự nhiên vị trí tổn thương và tránh hàm ý rằng vết bệnh nằm trên từng sợi râu.
