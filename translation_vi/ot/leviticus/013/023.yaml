  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: vi
  text: Nhưng nếu đốm sáng vẫn nguyên tại chỗ[a] và không lan rộng, thì đó là vết sẹo do nhọt để lại; thầy tế lễ phải tuyên bố người ấy là thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “ở bên dưới nó”; thành ngữ Hê-bơ-rơ ở đây có ý nói đốm sáng vẫn ở nguyên chỗ thay vì lan rộng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện tương phản với trường hợp đốm lan rộng ở câu trước, đồng thời giữ mạch liên kết của וְ.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: vẫn nguyên tại chỗ
  rationale: Cụm từ có nghĩa đen là “đứng ở bên dưới nó”, nhưng trong ngữ cảnh khám tổn thương da, đây là cách nói chỉ việc đốm không dịch chuyển hay lan ra.
- source_word: הַבַּהֶרֶת
  choice: đốm sáng
  rationale: Chỉ một dấu sáng hoặc trắng nhìn thấy được trên da; cách dịch này không áp đặt một chẩn đoán y khoa cụ thể.
- source_word: לֹא פָשָׂתָה
  choice: không lan rộng
  rationale: Động từ פשׂה được dùng lặp lại trong chương này để nói tình trạng trên da lan ra.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: vết sẹo do nhọt để lại
  rationale: צָרֶבֶת chỉ dấu vết còn lại của tình trạng viêm hoặc bỏng; trong cấu trúc này, đó là dấu do nhọt để lại.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: thầy tế lễ phải tuyên bố người ấy là thanh sạch
  rationale: Trong quy định về sự thanh sạch, טהר ở dạng này nói đến việc xác định và công bố địa vị nghi lễ, chứ không phải trực tiếp chữa lành hay tẩy rửa người ấy.
theological_decisions:
- issue: Sự thanh sạch nghi lễ hay sự chữa lành thể chất
  choice: thầy tế lễ phải tuyên bố người ấy là thanh sạch
  alternative: thầy tế lễ phải làm cho người ấy sạch
  rationale: Ngữ cảnh nói về sự khám xét và phán định địa vị thanh sạch theo nghi lễ. Cách dịch này tránh khiến người đọc hiểu rằng thầy tế lễ chữa bệnh hoặc thực hiện hành động làm sạch thể chất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo ngữ cảnh Lê-vi Ký, “thanh sạch” cho địa vị nghi lễ, và tránh đồng nhất dấu hiệu da với một bệnh cụ thể.
