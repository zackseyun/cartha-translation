lexical_decisions:
- source_word: וּבָשָׂר
  choice: da thịt của một người
  rationale: בָשָׂר nghĩa gốc là “thịt/da thịt”, nhưng trong luật chẩn đoán này chỉ con người xét theo thân thể. Cách diễn đạt này tự nhiên trong tiếng Việt và nối thuận với “nổi nhọt”.
- source_word: כִּי
  choice: khi
  rationale: כִּי mở đầu một trường hợp trong thể văn luật định. “Khi” phù hợp với trình tự xử lý trường hợp, trong khi “nếu” vẫn là một khả năng.
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: nổi ... trên da thịt
  rationale: Nguyên văn dùng động từ “có/hiện hữu” cùng hai cụm chỉ vị trí. Tiếng Việt tự nhiên diễn đạt tình trạng tổn thương trên da bằng “nổi nhọt”; ý chỉ vị trí nơi da vẫn được giữ trong cụm “da thịt”.
- source_word: שְׁחִין
  choice: nhọt
  rationale: שְׁחִין chỉ nhọt hoặc chỗ viêm loét trên da. “Nhọt” là từ ngắn gọn, phổ thông và thích hợp với văn cảnh khám bệnh ngoài da.
- source_word: וְנִרְפָּא
  choice: rồi lành
  rationale: Dạng Niphal của רפא có thể chỉ tình trạng tự lành hoặc được chữa lành. “Rồi lành” tự nhiên trong tiếng Việt và không khẳng định tác nhân chữa trị.
theological_decisions: []
translation_notes:
  register: Văn phong luật định trang trọng nhưng dễ hiểu. Câu được giữ ở dạng mệnh đề mở đầu vì nội dung tiếp tục sang câu kế tiếp; “một người” được thêm để làm rõ đối tượng mà בָשָׂר chỉ đến trong tiếng Việt, không nhằm bổ sung một điều kiện mới.
