  text: And when the body has a boil in its skin[a], and it heals[c][b],
translation:
  language: vi
  text: Khi[a] da thịt[b] của một người có nhọt trên da, và nhọt đã lành[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Nếu”.
    reason: alternative_reading
  - marker: b
    text: Nguyên văn là “thịt”; cũng có thể hiểu là “thân thể”.
