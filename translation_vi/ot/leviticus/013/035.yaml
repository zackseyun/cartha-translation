  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: vi
  text: Nhưng nếu chỗ lở có vảy cứ lan rộng trên da sau khi người ấy được tuyên bố là thanh sạch,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này chỉ một tình trạng tổn thương da đặc thù được mô tả trong chương này, thường liên hệ với da đầu hoặc vùng râu và có thể kèm bong vảy cùng rụng tóc hoặc lông râu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ kết hợp với điều kiện mở ra một trường hợp tương phản trong quy trình khám xét; “Nhưng nếu” tự nhiên và vẫn giữ nguyên tính điều kiện.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: cứ lan rộng
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh sự lan ra. “Cứ lan rộng” truyền đạt sắc thái nhấn mạnh và diễn tiến một cách tự nhiên trong tiếng Việt.
- source_word: הַנֶּתֶק
  choice: chỗ lở có vảy
  rationale: Trong Lê-vi Ký 13, từ này chỉ một chứng tổn thương đặc thù ở da đầu hoặc vùng râu, liên quan đến tóc/lông và tình trạng bong vảy. Cách dịch này dễ hiểu hơn một thuật ngữ y khoa hiện đại có thể xác định bệnh quá mức.
- source_word: בָּעוֹר
  choice: trên da
  rationale: עוֹר nghĩa là “da”. Tiếng Việt tự nhiên nói tổn thương “lan rộng trên da”, dù giới từ Hê-bơ-rơ có nghĩa đen là “trong da”.
- source_word: אַחֲרֵי
  choice: sau khi
  rationale: Diễn đạt quan hệ thời gian rõ ràng và tự nhiên trong mệnh đề tiếng Việt.
- source_word: טָהֳרָתוֹ
  choice: người ấy được tuyên bố là thanh sạch
  rationale: Trong bối cảnh quy trình khám xét, từ này liên quan đến tình trạng thanh sạch theo nghi lễ sau phán định. Cách dịch này tránh gợi ý rằng người ấy đã được chữa bệnh hay được thanh tẩy về phương diện đạo đức.
theological_decisions:
- issue: Ý nghĩa của טָהֳרָתוֹ trong luật về thanh sạch
  choice: được tuyên bố là thanh sạch
  alternative: được thanh tẩy
  rationale: Ngữ cảnh nói về việc thầy tế lễ khám và xác nhận tình trạng nghi lễ; bản dịch không đồng nhất sự thanh sạch này với sự chữa lành thể chất hoặc thanh tẩy đạo đức.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “người ấy” thay cho đại từ mang giới tính vì hậu tố giống đực số ít trong Hê-bơ-rơ có thể chỉ người đang được khám nói chung. Dấu phẩy cuối câu được giữ vì câu tiếp tục sang câu kế.
