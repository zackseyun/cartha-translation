base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”, danh riêng của Đức Chúa Trời; thường được dịch là “CHÚA” trong nhiều bản dịch tiếng Việt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời truyền phán của Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc trong tiếng Việt, có thêm “Đức” để phù hợp văn phong kính trọng tự nhiên.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: Giữ rõ hai người cùng nhận lời phán; “phán với” là cấu trúc tiếng Việt tự nhiên tương ứng với giới từ אֶל.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Từ này giới thiệu nội dung lời phán tiếp theo; “rằng:” nối tự nhiên sang câu kế tiếp và dấu hai chấm thể hiện chức năng dẫn lời.
theological_decisions:
- issue: Cách thể hiện danh thần יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng thay vì thay bằng tước hiệu, đồng thời chọn hình thức phiên âm quen thuộc và trang trọng trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ công thức dẫn nhập lời phán nhưng tránh lối diễn đạt cổ như “mà rằng”.
