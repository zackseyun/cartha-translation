base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: vi
  text: Còn áo quần, sợi dọc, sợi ngang, hoặc bất cứ vật dụng bằng da nào đã được giặt mà vết nhiễm không còn trên chúng, thì phải được giặt lần thứ hai và sẽ thanh sạch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: áo quần
  rationale: בגד là từ khái quát chỉ y phục hoặc đồ mặc; “áo quần” tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: הַשְּׁתִי
  choice: sợi dọc
  rationale: Thuật ngữ dệt chỉ các sợi chạy theo chiều dọc của tấm vải.
- source_word: הָעֵרֶב
  choice: sợi ngang
  rationale: Thuật ngữ dệt đi đôi với שׁתי, chỉ các sợi đan ngang qua sợi dọc.
- source_word: כָל כְּלִי הָעוֹר
  choice: bất cứ đồ vật bằng da nào
  rationale: כְּלִי có nghĩa rộng là vật dụng hay đồ vật; cách dịch này tránh thu hẹp nghĩa thành bình chứa.
- source_word: תְּכַבֵּס
  choice: đã được giặt
  rationale: Piel của כבס chỉ việc giặt vải hay y phục. Dùng thể bị động trong mệnh đề quan hệ giúp câu tiếng Việt tự nhiên và bao quát các vật vừa liệt kê.
- source_word: הַנָּגַע
  choice: vết nhiễm
  rationale: Trong ngữ cảnh vật liệu ở Lê-vi Ký 13, từ này chỉ dấu vết gây ô uế có thể nhìn thấy; “vết nhiễm” không áp đặt một chẩn đoán vi sinh hay y khoa hiện đại.
- source_word: וְסָר מֵהֶם
  choice: mà vết nhiễm đã biến mất
  rationale: Diễn đạt kết quả tiếp theo trong mệnh đề אֲשֶׁר mà không thêm từ “nếu”; “biến mất” truyền đạt tự nhiên ý vết ấy không còn trên các vật.
- source_word: וְכֻבַּס שֵׁנִית
  choice: thì phải giặt lần thứ hai
  rationale: Thể bị động cùng שֵׁנִית nêu thủ tục bắt buộc phải giặt lại một lần nữa.
- source_word: וְטָהֵר
  choice: như thế đồ vật ấy sẽ được sạch
  rationale: טהר ở đây chỉ tình trạng sạch theo nghi lễ. Bổ sung chủ thể “đồ vật ấy” để câu tiếng Việt rõ nghĩa mà không thay đổi đối tượng.
theological_decisions:
- issue: Ý nghĩa của טהר trong luật thanh sạch
  choice: sẽ được sạch
  alternative: sẽ được thanh sạch
  rationale: “Được sạch” giữ cách nói cụ thể, dễ hiểu của văn cảnh và không biến thuật ngữ thành một tuyên bố về sự tinh sạch đạo đức; ghi chú từ vựng xác định đây là tình trạng sạch theo nghi lễ.
translation_notes:
  register: Văn phong quy định trang trọng nhưng hiện đại. Dùng thuật ngữ dệt phổ thông “sợi dọc, sợi ngang”; tránh thuật ngữ y khoa quá chuyên biệt và tránh thêm điều kiện “nếu” vốn không được đánh dấu rõ trong nguyên văn.
