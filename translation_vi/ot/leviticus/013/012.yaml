revisions:
- from: Nhưng nếu bệnh ngoài da lan rộng khắp da[a], và bệnh ấy phủ kín toàn bộ da của người bị bệnh[b], từ đầu đến chân, trong phạm vi mắt thầy tế lễ có thể nhìn thấy,
  to: Còn nếu chứng bệnh ngoài da[a] lan ra khắp da, và chứng bệnh ấy phủ kín toàn bộ da của người ấy[b], từ đầu đến chân, khắp mọi nơi mắt thầy tế lễ có thể thấy,
  rationale: Bản sửa giữ nguyên nghĩa và tính chưa hoàn tất của mệnh đề điều kiện, đồng thời thay cách diễn đạt về tầm nhìn của thầy tế lễ bằng tiếng Việt hiện đại, tự nhiên hơn. “Chứng bệnh ngoài da” cũng phù hợp hơn với phạm vi nghĩa không chuyên biệt của צָרַעַת.
