  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: vi
  text: Còn nếu chứng bệnh ngoài da[a] lan ra khắp da, và chứng bệnh ấy phủ kín toàn bộ da của người ấy[b], từ đầu đến chân, khắp mọi nơi mắt thầy tế lễ có thể thấy,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ צָרַעַת (tsa-ra-at) trong Lê-vi Ký chỉ nhiều chứng bệnh hoặc tình trạng nghi lễ ở da, không nên hiểu hẹp là bệnh phong (bệnh Hansen) theo y học hiện đại.
    reason: cultural_note
  - marker: b
    text: 'Sát nghĩa hơn: “toàn bộ da của vết bệnh.” Cụm từ Hê-bơ-rơ nói đến da của người đang bị tình trạng bệnh ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: lan rộng khắp
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh sự lan tràn mạnh hoặc rộng; “lan rộng khắp” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh bệnh ngoài da.
- source_word: הַצָּרַעַת
  choice: bệnh ngoài da
  rationale: Từ này trong Lê-vi Ký chỉ một nhóm chứng bệnh hoặc tình trạng nghi lễ ở da, không nên đồng nhất hẹp với bệnh phong hiện đại.
- source_word: בָּעוֹר
  choice: khắp da
  rationale: Giới từ בְּ ở đây chỉ bề mặt da nơi bệnh lan ra; kết hợp với động từ được nhấn mạnh, “khắp da” diễn đạt tự nhiên phạm vi lan rộng.
- source_word: וְכִסְּתָה
  choice: phủ kín
  rationale: Động từ mang nghĩa che phủ; “phủ kín” thể hiện rõ mức độ toàn diện được câu văn tiếp tục xác định.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: toàn bộ da của người bị bệnh
  rationale: Sát chữ là “toàn bộ da của vết bệnh/tình trạng bệnh”; cách dịch này làm rõ đối tượng là da của người đang bị tình trạng ấy, còn nghĩa sát chữ được giữ trong chú thích.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: từ đầu đến chân
  rationale: Đây là cách nói bao quát toàn thân; thành ngữ tiếng Việt “từ đầu đến chân” vừa tự nhiên vừa sát nghĩa.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: trong phạm vi mắt thầy tế lễ có thể nhìn thấy
  rationale: Cụm từ chỉ toàn bộ phần có thể quan sát khi thầy tế lễ khám; cách dịch này giữ rõ giới hạn theo tầm nhìn của người khám.
