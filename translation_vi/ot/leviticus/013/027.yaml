revisions:
- from: Đến ngày thứ bảy, thầy tế lễ phải khám người ấy. Nếu vết ấy quả thật đã lan ra trên da, thầy tế lễ phải tuyên bố người ấy là ô uế; đó là một tổn thương do bệnh ngoài da[a].
  to: Vào ngày thứ bảy, thầy tế lễ sẽ khám người ấy. Nếu vết ấy quả thật đã lan rộng trên da, thầy tế lễ phải tuyên bố người ấy là ô uế; đó là một vết bệnh ngoài da[a].
  rationale: Sửa mốc thời gian để phản ánh trực tiếp בַּיּוֹם הַשְּׁבִיעִי và thay cụm nhân quả gượng “tổn thương do bệnh ngoài da” bằng “vết bệnh ngoài da”, vốn diễn đạt tự nhiên hơn cụm נֶגַע צָרַעַת. Chú thích vẫn bảo lưu cách dịch truyền thống mà không đồng nhất thuật ngữ với một bệnh hiện đại.
