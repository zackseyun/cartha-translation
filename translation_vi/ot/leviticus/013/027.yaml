  - severity: medium
    issue: “tổn thương do bệnh ngoài da”
    rationale: Giới từ “do” biểu thị nguyên nhân và khiến tiếng Việt hơi gượng. נֶגַע צָרַעַת là sự định loại của vết/tổn thương, không nêu quan hệ nhân quả.
