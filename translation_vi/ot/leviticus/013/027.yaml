source:
  edition: WLC
  text: וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י אִם פָּשֹׂ֤ה תִפְשֶׂה֙ בָּ/ע֔וֹר וְ/טִמֵּ֤א הַ/כֹּהֵן֙ אֹת֔/וֹ נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: vi
  text: Vào ngày thứ bảy, thầy tế lễ sẽ khám người ấy. Nếu vết ấy quả thật đã lan rộng trên da, thầy tế lễ phải tuyên bố người ấy là ô uế; đó là một vết bệnh ngoài da[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo truyền thống, từ này thường được dịch là “bệnh phong”. Thuật ngữ Hê-bơ-rơ này chỉ một phạm vi rộng hơn các tình trạng bệnh ngoài da trong luật lệ về sự thanh sạch của Y-sơ-ra-ên, không nhất thiết là bệnh phong (bệnh Hansen) theo y học hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: phải khám người ấy
  rationale: Động từ ראה có nghĩa đen là “thấy, xem”, nhưng trong thủ tục chẩn định của Lê-vi Ký 13, “khám” diễn đạt tự nhiên và chính xác hành động xem xét của thầy tế lễ.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu trong ngữ cảnh nghi lễ của Lê-vi Ký.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: đến ngày thứ bảy
  rationale: Diễn đạt tự nhiên mốc tái khám trong tiếng Việt, tương ứng với “vào ngày thứ bảy” của nguyên văn.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: nếu ... quả thật đã lan ra
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh sự lan rộng; “quả thật” giữ được sắc thái nhấn mạnh ấy.
- source_word: בָּעוֹר
  choice: trên da
  rationale: עוֹר là “da”; tiếng Việt tự nhiên nói một vết bệnh “lan ra trên da”.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: phải tuyên bố người ấy là ô uế
  rationale: Trong luật thanh sạch, thầy tế lễ đưa ra phán định chính thức chứ không làm cho người ấy trở nên ô uế; “tuyên bố” thể hiện chức năng pháp lý-nghi lễ đó.
- source_word: נֶגַע
  choice: tổn thương
  rationale: Trong Lê-vi Ký 13, נֶגַע chỉ dấu hoặc vùng da bị bệnh có thể quan sát được. “Tổn thương” tránh hàm ý vi sinh học quá cụ thể của “nhiễm trùng” và phù hợp tiếng Việt hiện đại.
- source_word: צָרַעַת
  choice: bệnh ngoài da
  rationale: Thuật ngữ Hê-bơ-rơ bao quát nhiều tình trạng trong luật thanh sạch, không đồng nhất chắc chắn với bệnh phong hiện đại. “Bệnh ngoài da” vừa dễ hiểu vừa tránh độ chính xác y khoa giả tạo.
- source_word: הִוא
  choice: đó là
  rationale: Đại từ giống cái quy chiếu đến נֶגַע và xác định bản chất của tổn thương; “đó là” tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch צָרַעַת trong luật về thanh sạch
  choice: bệnh ngoài da
  alternative: bệnh phong; bệnh ngoài da gây ô uế
  rationale: צָרַעַת có phạm vi rộng hơn bệnh phong Hansen theo y học hiện đại. Bản chính tránh đồng nhất sai về mặt y khoa, còn chú thích bảo lưu cách dịch truyền thống.
- issue: Vai trò của thầy tế lễ khi xác định tình trạng ô uế
  choice: tuyên bố người ấy là ô uế
  alternative: làm cho người ấy ô uế
  rationale: Ngữ cảnh cho thấy đây là phán định nghi lễ chính thức dựa trên việc khám, không phải hành động khiến bệnh nhân mắc bệnh hay tạo ra tình trạng ô uế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. “Thầy tế lễ” giữ sắc thái nghi lễ quen thuộc; “tổn thương do bệnh ngoài da” diễn đạt quan hệ giữa נֶגַע và צָרַעַת mà không áp đặt một chẩn đoán y khoa hiện đại.
