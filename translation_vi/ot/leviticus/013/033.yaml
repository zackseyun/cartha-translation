translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng câu ngắn và thuật ngữ dễ hiểu. Tránh gán נתק cho một chẩn đoán y khoa hiện đại; giữ sắc thái thủ tục của việc cạo và cách ly để kiểm tra lại.
