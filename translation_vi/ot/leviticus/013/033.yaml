base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/033.yaml
  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: vi
  text: Người ấy phải cạo tóc và râu[a], nhưng không được cạo chỗ lở[b]. Thầy tế lễ phải cách ly trường hợp chỗ lở ấy thêm bảy ngày nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là người ấy tự cạo hoặc cho người khác cạo. Trong ngữ cảnh này, chứng lở thuộc vùng da đầu hoặc râu.
    reason: lexical_alternative
  - marker: b
    text: Nguyên ngữ chỉ một bệnh trạng riêng ở vùng đầu hoặc râu, thường có hiện tượng rụng tóc hoặc rụng lông và có thể có vảy. Câu Hê-bơ-rơ nói chính chỗ bị bệnh không được cạo, có lẽ để thầy tế lễ có thể tiếp tục quan sát. Câu sau cũng trực tiếp nói đến việc biệt riêng «chỗ lở»; cách nói này chỉ thủ tục áp dụng cho trường hợp đó.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: Người ấy phải cạo tóc
  rationale: Thể Hitpael của גלח mang nghĩa phản thân, có thể là tự cạo hoặc cho người khác cạo. Tiếng Việt tự nhiên không cần nói rõ ai thực hiện; “cạo tóc” phù hợp vì bệnh trạng nằm ở vùng đầu hoặc râu.
- source_word: הַנֶּתֶק
  choice: chỗ lở trên đầu hoặc cằm
  rationale: נֶתֶק chỉ một bệnh trạng riêng ở vùng đầu hoặc râu, liên quan đến rụng tóc/lông và có thể có vảy; cách dịch này dễ hiểu nhưng tránh đồng nhất chắc chắn với một bệnh hiện đại.
- source_word: לֹא יְגַלֵּחַ
  choice: không được cạo
  rationale: Thể vị hoàn với phủ định trong luật lệ diễn đạt một điều cấm; “không được” là lối nói pháp quy tự nhiên trong tiếng Việt.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: nhưng không được cạo chỗ lở trên đầu hoặc cằm
  rationale: Dấu chỉ trực bổ ngữ אֵת cho thấy chính vùng bị bệnh không được cạo. Bản dịch giữ nguyên điều này thay vì diễn giải thành cạo quanh vùng bệnh.
- source_word: וְהִסְגִּיר
  choice: phải cách ly người ấy
  rationale: Trong Lê-vi Ký 13, động từ סגר nói đến việc tách người bệnh ra trong một thời gian để theo dõi. Dù câu Hê-bơ-rơ dùng “chỗ lở” làm bổ ngữ, hành động thực tế áp dụng cho người có chỗ lở; tiếng Việt cần nêu người ấy để tự nhiên và rõ nghĩa.
- source_word: הַכֹּהֵן
  choice: Thầy tế lễ
  rationale: Cách gọi trang trọng, phổ thông trong văn cảnh luật tế lễ của Cựu Ước.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: thêm bảy ngày nữa
  rationale: שֵׁנִית cho biết đây là lần cách ly bảy ngày thứ hai; “thêm… nữa” diễn đạt tự nhiên và rõ ràng trong tiếng Việt.
