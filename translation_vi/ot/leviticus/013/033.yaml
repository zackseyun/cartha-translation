revisions:
- from: Người ấy phải cạo tóc[a], nhưng không được cạo chỗ lở trên đầu hoặc cằm[b]. Thầy tế lễ phải cách ly người ấy thêm bảy ngày nữa.
  to: Người ấy phải cạo tóc và râu[a], nhưng không được cạo chỗ lở[b]. Thầy tế lễ phải cách ly trường hợp chỗ lở ấy thêm bảy ngày nữa.
  rationale: Sửa «cằm» thành «râu» để phù hợp với phạm vi ngữ cảnh của thuật ngữ Hê-bơ-rơ, và điều chỉnh mệnh đề cuối để phản ánh bổ ngữ «chỗ lở» của nguyên ngữ mà không làm tiếng Việt quá gượng. Bản sửa không gán chứng lở này cho bất cứ chẩn đoán y khoa hiện đại nào.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:10Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng trình tự mệnh lệnh và ý nghĩa cấm cạo phần bị bệnh. Tuy nhiên, «trên đầu hoặc cằm» không phản ánh chính xác phạm vi ngữ cảnh của נתק, vốn thuộc vùng da đầu hoặc râu; «cằm» không phải là cách gọi tương đương với «râu». Cụm «cách ly người ấy» cũng chuyển trực tiếp bổ ngữ Hê-bơ-rơ («chỗ bị bệnh/chứng lở») sang con người mà không báo hiệu sự chuyển đổi đó.
  naturalness: Văn phong nhìn chung rõ và hiện đại. «Cạo tóc và râu» tự nhiên hơn trong ngữ cảnh tổn thương ở da đầu hoặc râu. «Cách ly trường hợp chỗ lở ấy» giữ được cách nói thủ tục và đối tượng của nguyên ngữ mà vẫn dễ hiểu hơn việc nói cách ly chính một vùng da.
  terminology: Giữ «thầy tế lễ» phù hợp văn cảnh Lê-vi Ký. «Chỗ lở» được giữ như một cách gọi không chẩn đoán; chú thích cần nói rõ đây là một bệnh trạng chuyên biệt, không đồng nhất với bệnh hiện đại. Không nên dùng «cằm» thay cho «râu».
  issues:
  - severity: medium
    issue: «trên đầu hoặc cằm» thay cho phạm vi «đầu hoặc râu»
    rationale: Ngữ cảnh của נתק là da đầu hoặc râu. «Cằm» chỉ là một phần cơ thể, không tương đương với râu, và có thể khiến người đọc hiểu tổn thương nằm trên da cằm thay vì ở râu.
  - severity: low
    issue: «cách ly người ấy» thay đổi bổ ngữ trực tiếp
    rationale: Nguyên ngữ nói thầy tế lễ «biệt riêng/cách ly chỗ lở». Dù thủ tục thực tế liên quan đến người mang chỗ lở, bản văn chính nên giữ cách quy chiếu của nguyên ngữ; một cách nói về «trường hợp» giúp tiếng Việt tự nhiên.
  revised_text: Người ấy phải cạo tóc và râu[a], nhưng không được cạo chỗ lở[b]. Thầy tế lễ phải cách ly trường hợp chỗ lở ấy thêm bảy ngày nữa.
