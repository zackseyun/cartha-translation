  text: If a man loses the hair of his head[a], he is bald; he is clean.
translation:
  language: vi
  text: Nếu một người đàn ông bị rụng tóc trên đầu[a], người ấy bị hói; người ấy thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu một người đàn ông trở nên hói đầu.” Động từ Hê-bơ-rơ có thể chỉ việc trở nên trụi hoặc bị mất tóc; bản văn chính giữ sự phân biệt giữa hành động rụng tóc và lời xác nhận tiếp theo rằng người ấy bị hói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: một người đàn ông
  rationale: Danh từ giống đực số ít mở đầu một trường hợp luật định và trong ngữ cảnh này chỉ một người nam; cách dịch giữ đúng hình thức và đối tượng được nói đến.
- source_word: כִּי
  choice: nếu
  rationale: Trong ngữ cảnh luật định và chẩn định, từ này dẫn vào điều kiện của trường hợp được nêu.
- source_word: יִמָּרֵט
  choice: bị rụng tóc
  rationale: Dạng Niphal của מרט diễn tả việc trở nên trụi hoặc bị mất tóc. “Bị rụng tóc” tự nhiên trong tiếng Việt, không xác định quá mức nguyên nhân và vẫn phân biệt động từ này với tính trạng “bị hói” theo sau.
- source_word: רֹאשׁוֹ
  choice: trên đầu
  rationale: Diễn đạt tự nhiên quan hệ giữa sự mất tóc và đầu của người ấy.
- source_word: קֵרֵחַ
  choice: bị hói
  rationale: Diễn tả rõ tình trạng đầu không còn tóc bằng tiếng Việt hiện đại.
- source_word: טָהוֹר
  choice: thanh sạch
  rationale: Trong Lê-vi Ký 13, từ này chỉ tình trạng thanh sạch theo nghi lễ đối lập với ô uế, không phải sự vô tội về đạo đức.
- source_word: הוּא ... הוּא
  choice: người ấy ... người ấy
  rationale: Giữ hai mệnh đề vị ngữ nhấn mạnh trong tiếng Hê-bơ-rơ; thêm “vẫn” ở mệnh đề sau để diễn đạt tự nhiên ý rằng tình trạng hói không làm người ấy ô uế.
theological_decisions:
- issue: Thuật ngữ về tình trạng nghi lễ trong luật thanh sạch của Lê-vi Ký
  choice: thanh sạch
  alternative: trong sạch
  rationale: Câu này xác định tình trạng nghi lễ trong việc xem xét bệnh ngoài da, không phán xét phẩm chất đạo đức. “Thanh sạch” giữ được phạm trù nghi lễ và phù hợp văn phong Kinh Thánh tiếng Việt.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “người đàn ông” để phản ánh danh từ giống đực trong nguyên ngữ; dùng “thanh sạch” theo nghĩa nghi lễ. Dấu chấm phẩy giữ nhịp của hai lời xác nhận ngắn trong tiếng Hê-bơ-rơ.
