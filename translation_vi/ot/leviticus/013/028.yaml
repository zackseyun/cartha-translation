source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: vi
  text: Nhưng nếu đốm sáng vẫn ở nguyên chỗ[a], không lan ra trên da và đã mờ đi, thì đó là chỗ sưng do vết bỏng. Thầy tế lễ phải tuyên bố người ấy thanh sạch, vì đó là sẹo của vết bỏng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “ở bên dưới nó”; thành ngữ Hê-bơ-rơ nói đốm sáng “đứng bên dưới nó”, nhưng trong ngữ cảnh, ý là đốm vẫn ở nguyên chỗ chứ không lan ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: vẫn ở nguyên chỗ
  rationale: Cụm từ theo sát mặt chữ là “đứng bên dưới nó”, nhưng trong ngữ cảnh chẩn đoán, ý là đốm không dịch chuyển hay lan rộng. Cách dịch này tự nhiên và giữ đúng lực nghĩa của thành ngữ.
- source_word: הַבַּהֶרֶת
  choice: đốm sáng
  rationale: Chỉ một vùng đổi màu sáng có thể quan sát trên da; “đốm sáng” ngắn gọn và phù hợp với thuật ngữ xuyên suốt chương.
- source_word: פָשְׂתָה בָעוֹר
  choice: lan ra trên da
  rationale: Động từ diễn tả tổn thương lan rộng; tiếng Việt tự nhiên dùng “trên da”, dù giới từ Hê-bơ-rơ cũng có thể hiểu sát hơn là “trong da”.
- source_word: כֵהָה
  choice: đã mờ đi
  rationale: Diễn tả sự suy giảm độ sáng hoặc mức độ nổi bật của đốm.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: chỗ sưng do vết bỏng
  rationale: שְׂאֵת là vùng nhô hoặc sưng trên da, còn הַמִּכְוָה là vết bỏng; “do” diễn đạt tự nhiên quan hệ giữa hai danh từ.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: Thầy tế lễ phải tuyên bố người ấy thanh sạch
  rationale: Trong thủ tục khám xét của luật tế lễ, động từ chỉ việc xác nhận hay công bố tình trạng thanh sạch, không phải hành động trực tiếp tẩy sạch.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: sẹo của vết bỏng
  rationale: צָרֶבֶת chỉ dấu tích hoặc mô sẹo còn lại sau khi bị bỏng; “sẹo” rõ nghĩa và tự nhiên.
theological_decisions:
- issue: Ý nghĩa của “thanh sạch”
  choice: Giữ thuật ngữ “thanh sạch” trong lời công bố của thầy tế lễ
  alternative: Dịch là “không mắc bệnh” hoặc “đã khỏi”
  rationale: Bản văn nói đến sự phân loại thanh sạch trong nghi thức và cộng đồng, không nhất thiết đồng nhất với kết luận y khoa hiện đại; vì vậy không thu hẹp nghĩa thành “không mắc bệnh”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” cho הַכֹּהֵן và giữ “thanh sạch” như thuật ngữ của bối cảnh luật tế lễ. Đại từ “người ấy” làm rõ tân ngữ giống đực trong tiếng Hê-bơ-rơ mà không hàm ý vượt quá bản văn.
