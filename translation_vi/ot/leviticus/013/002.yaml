id: LEV.13.2
reference: Leviticus 13:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: vi
  text: Khi một người có trên da thịt mình một chỗ sưng, một vảy da, hoặc một đốm sáng, và chỗ ấy trên da thịt mình trở thành một tổn thương do chứng bệnh ngoài da[a], thì người ấy phải được đưa đến thầy tế lễ A-rôn, hoặc đến một trong các con trai ông là những thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “tổn thương bệnh phong” hoặc “bệnh cùi.” Từ Hê-bơ-rơ צָרָעַת chỉ một nhóm chứng bệnh về da rộng hơn và không nên tự động đồng nhất với bệnh Hansen ngày nay.'
    reason: Nêu cách dịch truyền thống và làm rõ rằng thuật ngữ Hê-bơ-rơ không nhất thiết chỉ bệnh Hansen hiện đại.
lexical_decisions:
- source_word: אָדָם
  choice: một người
  rationale: Danh từ số ít mang nghĩa khái quát mở đầu một trường hợp luật định; “một người” tự nhiên trong tiếng Việt và không thêm giới tính mà tiếng Hê-bơ-rơ ở đây không nhất thiết nhấn mạnh.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: trên da thịt mình
  rationale: Giữ hình ảnh cụ thể và sự lặp lại của nguyên văn; “da thịt” trang trọng, dễ hiểu và gần với cấu trúc Hê-bơ-rơ.
- source_word: שְׂאֵת
  choice: một chỗ sưng
  rationale: Chỉ vùng da nhô lên; cách dịch này rõ nghĩa mà không áp đặt một chẩn đoán y khoa hiện đại.
- source_word: סַפַּחַת
  choice: một vảy da
  rationale: Chỉ một dạng thương tổn da, nhưng hình thái chính xác không chắc chắn; “vảy da” cụ thể và vẫn tránh diễn giải quá mức.
- source_word: בַּהֶרֶת
  choice: một đốm sáng
  rationale: Phản ánh ý nghĩa một vùng da sáng hoặc nhạt màu mà không thu hẹp thành “đốm trắng”.
- source_word: לְנֶגַע צָרָעַת
  choice: một tổn thương thuộc bệnh ngoài da
  rationale: נֶגַע là chỗ bị tổn thương hay dấu bệnh; צָרָעַת là một phạm trù bệnh trạng theo Kinh Thánh, rộng hơn bệnh Hansen hiện đại. Cách dịch tránh gọi sai là “bệnh phong” nhưng vẫn giữ quan hệ giữa tổn thương và bệnh.
- source_word: וְהוּבָא
  choice: phải được đưa đến
  rationale: Giữ thể bị động và sức bắt buộc của thủ tục luật định.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: thầy tế lễ A-rôn
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên chức danh và tên riêng.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: một trong các con trai ông là những thầy tế lễ
  rationale: Giữ cả quan hệ gia đình lẫn tư cách tế lễ của các con trai A-rôn.
theological_decisions:
- issue: Cách dịch צָרָעַת
  choice: bệnh ngoài da
  alternative: bệnh phong; bệnh cùi; tsaraath
  rationale: צָרָעַת trong luật Lê-vi chỉ một phạm trù thương tổn được thầy tế lễ xem xét, không thể tự động đồng nhất với bệnh Hansen. “Bệnh ngoài da” truyền đạt phạm vi chung mà không nhập một chẩn đoán y khoa hiện đại vào bản văn.
translation_notes:
  register: Văn phong luật định, trang trọng nhưng hiện đại. Giữ sự lặp lại “trên da thịt” và thể bị động của nguyên văn; dùng thuật ngữ phổ thông, không biến câu thành một chẩn đoán y khoa hiện đại.
