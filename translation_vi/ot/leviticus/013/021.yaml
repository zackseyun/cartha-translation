revisions:
- from: Nhưng nếu thầy tế lễ xem xét vết ấy và thấy không có lông trắng trong đó, vết ấy không lõm sâu hơn da mà đã nhạt đi, thì thầy tế lễ phải cách ly người ấy trong bảy ngày.[a]
  to: Nhưng nếu thầy tế lễ xem xét vết ấy và thấy không có lông trắng trong đó, vết ấy không lõm xuống dưới da mà mờ, thì thầy tế lễ phải cách ly người ấy trong bảy ngày.[a]
  rationale: Sửa cách diễn đạt về độ lõm để phản ánh rõ tiêu chí thị giác của nguyên văn, và đổi “đã nhạt đi” thành “mờ” để không thêm sắc thái diễn tiến. Giữ nguyên chủ thể, đại từ chỉ người bị giữ riêng, thời hạn bảy ngày, và chú thích.
  reviewer_model: gpt-5.6-terra
