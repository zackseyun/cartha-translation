  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בָּ/הּ֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣יא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: vi
  text: Nhưng nếu thầy tế lễ xem xét vết ấy và thấy không có lông trắng trong đó, vết ấy không lõm xuống dưới da mà mờ, thì thầy tế lễ phải cách ly người ấy trong bảy ngày.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giữ riêng người ấy trong bảy ngày.” Động từ Hê-bơ-rơ chỉ việc đặt người ấy ở riêng để theo dõi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu trường hợp có điều kiện, tương phản với tình huống chẩn định ngay trước đó.
- source_word: יִרְאֶנָּה
  choice: xem xét vết ấy
  rationale: Động từ có nghĩa cơ bản là “thấy, xem”, nhưng trong quy trình tư tế ở Lê-vi Ký 13 mang nghĩa kiểm tra để chẩn định; “vết ấy” làm rõ đại từ giống cái mà không thêm một loại bệnh cụ thể.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi thông dụng, trang trọng dành cho người thực hiện việc kiểm tra theo luật tế lễ.
- source_word: וְהִנֵּה
  choice: và thấy
  rationale: Diễn đạt tự nhiên công thức quan sát của tiếng Hê-bơ-rơ, hướng sự chú ý vào kết quả kiểm tra.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: không có lông trắng trong đó
  rationale: Giữ nguyên tiêu chí quan sát của nguyên văn và quan hệ “trong vết ấy”.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: vết ấy không lõm sâu hơn da
  rationale: שְׁפָלָה theo nghĩa đen là thấp hoặc trũng; “lõm sâu hơn da” truyền đạt rõ tiêu chí hình dạng trong ngữ cảnh.
- source_word: וְהִיא כֵהָה
  choice: mà đã nhạt đi
  rationale: כֵהָה chỉ vẻ mờ, nhạt hoặc giảm độ rõ; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái quan sát thị giác.
- source_word: וְהִסְגִּירוֹ
  choice: thầy tế lễ phải cách ly người ấy
  rationale: Động từ chỉ việc giữ riêng để theo dõi; hậu tố giống đực số ít chỉ người, không chỉ vết trên da.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian được ấn định.
theological_decisions: []
