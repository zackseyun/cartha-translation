revisions:
- from: Đến ngày thứ bảy, thầy tế lễ lại khám người ấy. Nếu thấy vết bệnh đã nhạt đi và không lan trên da, thầy tế lễ phải tuyên bố người ấy thanh sạch; đó chỉ là một vết phát ban có vảy[a]. Người ấy phải giặt quần áo mình, rồi sẽ được thanh sạch.
  to: Vào ngày thứ bảy, thầy tế lễ sẽ khám người ấy lần nữa. Nếu vết bệnh đã nhạt đi và không lan trên da, thầy tế lễ phải tuyên bố người ấy thanh sạch; đó là một vết phát ban có vảy[a]. Người ấy phải giặt quần áo mình và sẽ thanh sạch.
  rationale: Bản sửa bỏ sắc thái “chỉ” không có trong nguyên văn, làm rõ mệnh đề điều kiện, và giữ nhất quán ý nghĩa thanh sạch theo nghi lễ. Chú thích tiếp tục đánh dấu tính không chắc chắn của thuật ngữ da liễu cổ, không áp đặt chẩn đoán y khoa hiện đại.
