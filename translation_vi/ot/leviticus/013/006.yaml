  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֹת֜/וֹ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֮ שֵׁנִית֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע וְ/לֹא פָשָׂ֥ה הַ/נֶּ֖גַע בָּ/ע֑וֹר וְ/טִהֲר֤/וֹ הַ/כֹּהֵן֙ מִסְפַּ֣חַת הִ֔יא וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: vi
  text: Vào ngày thứ bảy, thầy tế lễ sẽ khám người ấy lần nữa. Nếu vết bệnh đã nhạt đi và không lan trên da, thầy tế lễ phải tuyên bố người ấy thanh sạch; đó là một vết phát ban có vảy[a]. Người ấy phải giặt quần áo mình và sẽ thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vết phát ban”. Từ Hê-bơ-rơ chỉ một dạng tổn thương da tương đối nhẹ, trái với một tình trạng da nghiêm trọng hơn đang lan rộng.
    reason: Nêu phương án từ vựng và giữ sự không chắc chắn về loại tổn thương da chính xác.
lexical_decisions:
- source_word: וְרָאָה
  choice: lại khám
  rationale: Trong bối cảnh chẩn định theo luật tế lễ, động từ ראה chỉ việc thầy tế lễ chính thức xem xét, nên “khám” tự nhiên và chính xác hơn “nhìn”.
- source_word: שֵׁנִית
  choice: lại
  rationale: Diễn đạt tự nhiên ý nghĩa trạng từ “một lần nữa” của lần khám vào ngày thứ bảy.
- source_word: כֵּהָה
  choice: đã nhạt đi
  rationale: Mô tả vết bệnh giảm độ đậm hoặc mức độ dễ thấy, không nhất thiết khẳng định đã lành.
- source_word: הַנֶּגַע
  choice: vết bệnh
  rationale: נגע ở đây là dấu hiệu bất thường có thể quan sát trên da. “Vết bệnh” dễ hiểu, không áp đặt một chẩn đoán y khoa hiện đại như “nhiễm trùng”.
- source_word: פָשָׂה
  choice: không lan
  rationale: Chuyển tải trực tiếp tiêu chí chẩn định rằng vết bệnh không mở rộng trên da.
- source_word: בָּעוֹר
  choice: trên da
  rationale: Tiếng Việt tự nhiên dùng “lan trên da” để diễn đạt vị trí và phạm vi của vết bệnh.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: thầy tế lễ phải tuyên bố người ấy thanh sạch
  rationale: Hình thức causative trong luật thanh sạch chỉ phán quyết chính thức về tình trạng nghi lễ, không nói thầy tế lễ chữa lành hay trực tiếp tẩy sạch người ấy.
- source_word: מִסְפַּחַת
  choice: một vết phát ban có vảy
  rationale: Thuật ngữ chỉ một dạng tổn thương da nhẹ hơn tình trạng đang bị nghi ngờ; cách dịch giữ được nét phát ban và có vảy mà không dùng thuật ngữ y khoa quá chuyên biệt.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Người ấy phải giặt quần áo mình
  rationale: Diễn đạt rõ chủ thể ngầm của động từ và dùng cách nói hiện đại, tự nhiên.
- source_word: וְטָהֵר
  choice: rồi sẽ được thanh sạch
  rationale: Nêu kết quả về tình trạng thanh sạch sau khi giặt quần áo, đồng thời không hàm ý được chữa khỏi về thể chất.
theological_decisions:
- issue: Phán quyết thanh sạch theo nghi lễ hay sự chữa lành thể chất
  choice: Dịch hành động của thầy tế lễ là “tuyên bố người ấy thanh sạch” và kết quả cuối là “sẽ được thanh sạch”.
  alternative: “thầy tế lễ sẽ tẩy sạch người ấy” hoặc “người ấy được chữa lành”
  rationale: Mạch văn nói về việc thầy tế lễ xác định tư cách thanh sạch theo luật nghi lễ, chứ không nhất thiết khẳng định bệnh thể chất đã được chữa khỏi.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo lối gọi quen thuộc trong văn bản Kinh Thánh; tránh thuật ngữ y khoa hiện đại có thể xác định quá mức bản chất của נגע và מִסְפַּחַת. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
