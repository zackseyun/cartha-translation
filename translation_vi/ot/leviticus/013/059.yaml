revisions:
- from: Đây là luật lệ về vết nhiễm bệnh[a] trên áo bằng len hay vải gai, trên sợi dọc hay sợi ngang, hoặc trên bất cứ vật dụng bằng da nào, để tuyên bố vật ấy là thanh sạch hay ô uế.
  to: Đây là luật lệ về dấu vết của bệnh phong[a] trên áo bằng len hoặc áo bằng vải lanh, trên sợi dọc hoặc sợi ngang, hoặc trên bất cứ vật dụng bằng da nào, để tuyên bố vật ấy là thanh sạch hay ô uế.
  rationale: Bản sửa khôi phục sự song hành “áo ... hoặc áo ...” của nguyên ngữ, dùng “vải lanh” là cách gọi hiện đại, thông dụng cho chất liệu flax/linen trong ngữ cảnh y phục, và làm rõ bằng chú thích rằng “bệnh phong” không phải một chẩn đoán y học hiện đại. Không thay đổi ý nghĩa nghi lễ hay tính không xác định của hiện tượng.
