  source_fidelity: 'Cần chỉnh nhẹ để phản ánh song song đầy đủ của tiếng Hê-bơ-rơ: בֶּגֶד chi phối cả chất liệu len lẫn lanh, nên bản dịch không nên đối lập “áo bằng len” với chỉ “vải gai”. “Vết nhiễm bệnh” giữ tính không xác định, nhưng “dấu vết của bệnh phong” kèm chú thích diễn đạt rõ hơn cấu trúc נֶגַע צָרַעַת (dấu/vết + phạm trù bệnh) mà không đồng nhất với bệnh Hansen. Cụm cuối dịch đúng chức năng tuyên bố tình trạng nghi lễ của לְטַהֲרוֹ אוֹ לְטַמְּאוֹ.'
