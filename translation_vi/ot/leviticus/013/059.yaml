  terminology: “Bệnh phong” chỉ được dùng như nhãn truyền thống cho צָרַעַת và được giới hạn rõ trong chú thích, tránh khẳng định chẩn đoán Hansen hoặc bản chất vật lý của hiện tượng trên vật liệu. “Thanh sạch/ô uế” bảo toàn thuật ngữ nghi lễ; “tuyên bố” bảo toàn sắc thái phân định pháp lý-nghi lễ.
