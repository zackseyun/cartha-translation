  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: vi
  text: Đây là luật lệ về dấu vết của bệnh phong[a] trên áo bằng len hoặc áo bằng vải lanh, trên sợi dọc hoặc sợi ngang, hoặc trên bất cứ vật dụng bằng da nào, để tuyên bố vật ấy là thanh sạch hay ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bệnh phong” dịch từ từ Hê-bơ-rơ tsaraat. Thuật ngữ này không nhất thiết chỉ bệnh phong (bệnh Hansen) theo nghĩa y học hiện đại; trong chương này nó cũng được dùng về áo và đồ da. Cụm từ đầy đủ còn bao gồm từ chỉ một dấu vết hoặc chỗ bị ảnh hưởng.
    reason: Giữ nhãn dịch truyền thống cho צָרַעַת, đồng thời bảo toàn phạm vi rộng và không xác định về y học của נֶגַע צָרַעַת.
lexical_decisions:
- source_word: תּוֹרַת
  choice: luật lệ về
  rationale: Trong câu tổng kết này, תּוֹרָה chỉ quy định chi phối các trường hợp vừa nêu; “luật lệ về” vừa tự nhiên trong tiếng Việt vừa thể hiện quan hệ cấu tạo với cụm từ theo sau.
- source_word: נֶגַע צָרַעַת
  choice: vết nhiễm bệnh[a]
  rationale: נֶגַע là dấu/vết bị tác động có thể quan sát, còn צָרַעַת là phạm trù bệnh trạng và ô uế nghi lễ có thể áp dụng cho cả người lẫn đồ vật. Cách dịch này tránh đồng nhất sai với bệnh Hansen và cũng không đoán chắc đó là nấm mốc.
- source_word: בֶּגֶד הַצֶּמֶר א֣וֹ הַפִּשְׁתִּים
  choice: áo bằng len hay vải gai
  rationale: בֶּגֶד là áo hoặc trang phục; “áo” dễ hiểu và phù hợp ngữ cảnh. הַפִּשְׁתִּים chỉ chất liệu lanh/gai, được hiểu song song với áo bằng len.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: sợi dọc hay sợi ngang
  rationale: Đây là hai thuật ngữ dệt chỉ các sợi theo chiều dọc và chiều ngang. Cách diễn đạt thuần Việt rõ hơn các từ chuyên môn ít quen thuộc.
- source_word: כָּל כְּלִי עוֹר
  choice: bất cứ vật dụng bằng da nào
  rationale: כְּלִי có nghĩa rộng là đồ vật, dụng cụ hay vật dụng; “vật dụng” giữ được phạm vi rộng ấy.
- source_word: לְטַהֲרוֹ אוֹ לְטַמְּאוֹ
  choice: để tuyên bố vật ấy là thanh sạch hay ô uế
  rationale: Trong văn mạch tư tế, hai động từ nói đến việc xác định và công bố tình trạng nghi lễ, không chỉ việc làm sạch hay làm bẩn về mặt vật lý.
theological_decisions:
- issue: Cách chuyển dịch צָרַעַת khi đối tượng là áo và đồ da
  choice: vết nhiễm bệnh, kèm chú thích
  alternative: bệnh phong; vết phong; vết mốc
  rationale: Từ Hê-bơ-rơ không tương ứng chính xác với bệnh Hansen hiện đại và trong chương này còn áp dụng cho vật liệu. “Vết nhiễm bệnh” giữ tính bất thường và khả năng gây ô uế mà không áp đặt một chẩn đoán y khoa hoặc xác định chắc đó là nấm mốc.
- issue: Ý nghĩa của thanh sạch và ô uế
  choice: tuyên bố ... thanh sạch hay ô uế
  alternative: làm cho ... sạch hay ô uế
  rationale: Câu này tổng kết thủ tục phân định tình trạng nghi lễ. “Tuyên bố” tránh hàm ý rằng lời nói tự nó tạo ra tình trạng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “sợi dọc” và “sợi ngang” thay cho thuật ngữ dệt khó hiểu; giữ cặp từ nghi lễ quen thuộc “thanh sạch” và “ô uế”.
