  text: וְ/רָאָ֨ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּגַע֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔תֶק וְ/לֹא הָ֥יָה ב֖/וֹ שֵׂעָ֣ר צָהֹ֑ב וּ/מַרְאֵ֣ה הַ/נֶּ֔תֶק אֵ֥ין עָמֹ֖ק מִן הָ/עֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: vi
  text: Thầy tế lễ phải khám vùng tổn thương vào ngày thứ bảy. Nếu thấy vết bong vảy[a] không lan rộng, không có lông màu vàng ở đó, và bề ngoài của vết bong vảy không lõm xuống dưới mặt da,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ נֶתֶק chỉ một loại tổn thương đặc thù ở da đầu hoặc vùng râu trong phân đoạn này; cũng có thể dịch là “chỗ ngứa” hoặc, theo cách cổ, “bệnh vảy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: phải khám
  rationale: Trong quy trình chẩn định của luật tế lễ, động từ ראה chỉ việc quan sát để kiểm tra, không chỉ đơn thuần là nhìn thấy.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi tự nhiên, trang trọng và quen thuộc trong tiếng Việt đối với người giữ chức vụ tư tế trong sách Lê-vi.
- source_word: הַנֶּגַע
  choice: vùng tổn thương
  rationale: נֶגַע là thuật ngữ rộng chỉ vùng bị thương tổn hay mắc chứng bệnh; cách dịch này tránh đồng nhất với một bệnh hiện đại cụ thể.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: vào ngày thứ bảy
  rationale: Diễn đạt trực tiếp thời điểm tái khám theo quy định.
- source_word: וְהִנֵּה
  choice: nếu thấy
  rationale: Trong mạch văn pháp lý, từ dẫn này giới thiệu các dấu hiệu quan sát được và mở điều kiện cho phán quyết ở câu tiếp theo; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ cấu trúc điều kiện.
- source_word: לֹא פָשָׂה
  choice: không lan rộng
  rationale: פשה trong ngữ cảnh bệnh ngoài da nói đến tổn thương lan ra trên da.
- source_word: הַנֶּתֶק
  choice: chỗ ghẻ lở
  rationale: נֶתֶק chỉ một chứng tổn thương riêng ở da đầu hoặc vùng râu trong phân đoạn này. “Chỗ ghẻ lở” dễ hiểu, mô tả được vùng bệnh mà không gán một chẩn đoán y khoa hiện đại.
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: không có lông vàng trong đó
  rationale: Giữ rõ dấu hiệu chẩn định là sự vắng mặt của lông màu vàng ngay trong vùng bị tổn thương; “lông” phù hợp vì văn cảnh bao gồm cả đầu và vùng râu.
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: và bề mặt chỗ ghẻ lở không lõm sâu hơn da
  rationale: מַרְאֶה nói đến diện mạo quan sát được; “bề mặt… không lõm sâu hơn da” diễn đạt tự nhiên tiêu chí vùng bệnh có vẻ thấp hơn bề mặt da hay không.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ, trang trọng nhưng hiện đại và dễ hiểu. Dấu phẩy cuối câu được giữ vì câu Hê-bơ-rơ tiếp tục sang câu kế tiếp. Không dùng tên một bệnh hiện đại để tránh khẳng định quá mức điều mà thuật ngữ cổ không xác định.
