revisions:
- from: Thầy tế lễ phải khám vùng tổn thương vào ngày thứ bảy. Nếu thấy chỗ ghẻ lở[a] không lan rộng, không có lông vàng trong đó, và bề mặt chỗ ghẻ lở không lõm sâu hơn da,
  to: Thầy tế lễ phải khám vùng tổn thương vào ngày thứ bảy. Nếu thấy vết bong vảy[a] không lan rộng, không có lông màu vàng ở đó, và bề ngoài của vết bong vảy không lõm xuống dưới mặt da,
  rationale: Sửa thuật ngữ chính để không đồng nhất tình trạng cổ này với “ghẻ lở,” vốn mang hàm ý bệnh học quá cụ thể trong tiếng Việt. Điều chỉnh mô tả độ sâu để phản ánh chính xác hơn tiêu chí quan sát. Giữ hình thức điều kiện và dấu phẩy cuối câu, vì câu này là phần đầu của quy định tiếp diễn ở câu sau.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các dấu hiệu chẩn định chính: tái khám vào ngày thứ bảy, tình trạng không lan rộng, không có lông vàng, và tổn thương không lõm dưới bề mặt da. Tuy nhiên, “ghẻ lở” thường gợi một bệnh/loại loét cụ thể trong tiếng Việt và không phù hợp an toàn với נֶתֶק, một thuật ngữ cổ có nghĩa chuyên biệt nhưng chưa thể đồng nhất chắc chắn với chẩn đoán hiện đại.'
  naturalness: Cấu trúc câu và việc để dấu phẩy ở cuối phù hợp vì mệnh đề tiếp tục sang câu kế tiếp. Cụm “bề mặt chỗ ghẻ lở không lõm sâu hơn da” hơi gượng; “bề ngoài ... không lõm xuống dưới mặt da” tự nhiên hơn và diễn đạt rõ tiêu chí quan sát.
  terminology: Giữ “thầy tế lễ,” “vùng tổn thương,” và “lông màu vàng.” Thay “chỗ ghẻ lở” bằng “vết bong vảy” để tránh hàm ý sai về ghẻ hoặc loét, đồng thời vẫn phản ánh sắc thái có vảy của thuật ngữ trong ngữ cảnh này.
  issues:
  - severity: medium
    issue: “Chỗ ghẻ lở” có thể định danh sai thuật ngữ נֶתֶק.
    rationale: Trong tiếng Việt hiện đại, “ghẻ lở” thường chỉ ghẻ hoặc các vết loét/da lở, trong khi נֶתֶק là một tình trạng da có lông (da đầu hay vùng râu trong phân đoạn) với ý nghĩa từ vựng còn cần giữ ở mức mô tả, không áp một bệnh cụ thể.
  - severity: low
    issue: Cách diễn đạt tiêu chí độ sâu chưa thật tự nhiên.
    rationale: “Không lõm xuống dưới mặt da” biểu đạt trực tiếp hơn ý vẻ ngoài của tổn thương không thấp/lõm hơn bề mặt da.
  revised_text: Thầy tế lễ phải khám vùng tổn thương vào ngày thứ bảy. Nếu thấy vết bong vảy[a] không lan rộng, không có lông màu vàng ở đó, và bề ngoài của vết bong vảy không lõm xuống dưới mặt da,
