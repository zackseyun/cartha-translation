- from: Bấy giờ, thầy tế lễ phải truyền giặt vật có vết bệnh[a], rồi cách ly vật ấy thêm bảy ngày nữa.[b]
  to: Bấy giờ, thầy tế lễ phải ra lệnh giặt vật có vết bệnh[a], rồi cách ly vật ấy thêm bảy ngày nữa.[b]
  rationale: Sửa một cách kết hợp động từ không tự nhiên và làm rõ chú thích về lần cách ly thứ hai. Không thay đổi nghĩa, trình tự thủ tục, hoặc tính khái quát của vật được nói đến trong nguyên văn.
