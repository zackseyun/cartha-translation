translation_notes:
  register: Văn phong quy định trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo lối gọi Kinh Thánh quen thuộc; “vật” giữ tính khái quát của nguyên văn; tránh dùng thuật ngữ y khoa quá chuyên biệt cho נגע trên đồ vật.
