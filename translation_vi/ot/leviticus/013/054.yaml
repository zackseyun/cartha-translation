  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: vi
  text: Bấy giờ, thầy tế lễ phải ra lệnh giặt vật có vết bệnh[a], rồi cách ly vật ấy thêm bảy ngày nữa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “vật mà vết bệnh ở trong đó”; cách diễn đạt Hê-bơ-rơ có phạm vi rộng, chỉ vật bị ảnh hưởng đang được xem xét.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “giữ riêng vật ấy thêm bảy ngày, lần thứ hai” hoặc sát chữ hơn: “đóng vật ấy lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: Bấy giờ, thầy tế lễ phải truyền
  rationale: Dạng waw + động từ hoàn thành trong chuỗi quy định pháp luật diễn tả bước thủ tục tiếp theo; “Bấy giờ” và “phải truyền” vừa tự nhiên vừa giữ sắc thái quy định.
- source_word: וְכִבְּסוּ
  choice: giặt
  rationale: Động từ ngôi thứ ba số nhiều chỉ những người không được nêu tên thi hành lệnh. Cấu trúc tiếng Việt “truyền giặt” không tự ý xác định người thực hiện.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: vật có vết bệnh
  rationale: Cụm quan hệ Hê-bơ-rơ cố ý chỉ chung vật đang được xem xét; “vật” bao quát áo, đồ dệt hay đồ da trong ngữ cảnh, còn “vết bệnh” diễn đạt dấu hiệu bất thường trên đồ vật mà không gọi đó là bệnh của con người.
- source_word: וְהִסְגִּירוֹ
  choice: rồi cách ly vật ấy
  rationale: Động từ có nghĩa đóng lại hoặc giữ riêng để theo dõi. “Cách ly” truyền đạt rõ chức năng thủ tục bằng tiếng Việt hiện đại.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: thêm bảy ngày nữa
  rationale: Diễn đạt tự nhiên việc lặp lại thời hạn bảy ngày, tương ứng với nghĩa “lần thứ hai” của שֵׁנִית.
