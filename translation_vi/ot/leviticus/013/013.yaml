revisions:
- from: Thầy tế lễ sẽ khám xét người ấy, và nếu bệnh ngoài da đã phủ khắp thân thể người ấy, thì thầy tế lễ phải tuyên bố người mang vết bệnh là thanh sạch[a]. Toàn thân đã chuyển sang màu trắng; người ấy thanh sạch.
  to: Khi thầy tế lễ khám xét người ấy và thấy rằng bệnh ngoài da[b] đã phủ khắp thân thể người ấy, thì phải tuyên bố người ấy là thanh sạch[a]. Toàn thân người ấy đã trở nên trắng; người ấy thanh sạch.
  rationale: Bản sửa dùng “Khi ... khám xét ... và thấy rằng” để phản ánh động từ quan sát và hạt từ chỉ điều đang được thấy, không thêm điều kiện bằng “nếu.” Câu chính diễn đạt tự nhiên phán quyết áp dụng cho người ấy, còn chú thích a bảo tồn tân ngữ hoán dụ của tiếng Hê-bơ-rơ. Chú thích b giải thích giới hạn từ vựng của צָרַעַת mà không áp đặt chẩn đoán y học hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:46:40Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mạch phán quyết thanh sạch và tránh đồng nhất צָרַעַת với bệnh phong hiện đại. Tuy nhiên, “và nếu” thay cho וְהִנֵּה (“và kìa/ thấy rằng”) biến điều được quan sát thành một mệnh đề điều kiện rõ nét hơn nguyên văn. Cụm “người mang vết bệnh” trong câu chính cũng thêm cách diễn đạt không cần thiết khi tiếng Hê-bơ-rơ dùng hoán dụ cho người bị vết bệnh.
  naturalness: “Thầy tế lễ sẽ khám xét...” và “Toàn thân đã chuyển sang màu trắng” dễ hiểu, nhưng cách nối “và nếu ... thì” cùng việc lặp “thầy tế lễ” làm câu kém tự nhiên. “Khi ... khám xét người ấy và thấy rằng...” phù hợp văn phong luật lệ hiện đại, đồng thời phản ánh sát hơn hành vi quan sát trong nguyên văn.
  terminology: Giữ “thầy tế lễ,” “bệnh ngoài da,” và “thanh sạch.” “Thanh sạch” diễn đạt đúng tình trạng theo luật thanh sạch mà không khẳng định một chẩn đoán y khoa. Chú thích cần nêu rõ phạm vi rộng của “bệnh ngoài da”; chú thích về tân ngữ nguyên văn nên được đặt ở “người ấy thanh sạch,” nơi bản dịch diễn đạt phán quyết áp dụng cho người đó.
  issues:
