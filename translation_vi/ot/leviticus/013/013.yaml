source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: vi
  text: Khi thầy tế lễ khám xét người ấy và thấy rằng bệnh ngoài da[b] đã phủ khắp thân thể người ấy, thì phải tuyên bố người ấy là thanh sạch[a]. Toàn thân người ấy đã trở nên trắng; người ấy thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “tuyên bố vết bệnh là thanh sạch”; phán quyết này áp dụng cho người mang vết bệnh.'
    reason: alternative_reading
  - marker: b
    text: Tiếng Hê-bơ-rơ צָרַעַת, thường được dịch là “bệnh phong”, trong Lê-vi Ký chỉ một phạm vi rộng hơn các chứng bệnh ngoài da và không nhất thiết là bệnh phong (Hansen) hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: sẽ khám xét
  rationale: Trong ngữ cảnh thầy tế lễ kiểm tra bệnh trạng, động từ không chỉ nói đến việc nhìn thấy mà chỉ sự xem xét để đưa ra phán định.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi thông dụng, trang trọng và dễ hiểu trong tiếng Việt đối với chức vụ tư tế thực hiện việc kiểm tra.
- source_word: וְהִנֵּה
  choice: và nếu
  rationale: Trong cấu trúc luật lệ theo tình huống, cụm này giới thiệu kết quả được quan sát. Tiếng Việt tự nhiên dùng “nếu” để nối điều kiện với phán quyết, thay vì dịch máy móc là “kìa”.
- source_word: כִסְּתָה הַצָּרַעַת
  choice: bệnh ngoài da đã phủ
  rationale: Thể hoàn thành diễn tả tình trạng bao phủ trọn vẹn mà thầy tế lễ quan sát thấy; “đã phủ” giữ rõ trạng thái kết quả.
- source_word: הַצָּרַעַת
  choice: bệnh ngoài da
  rationale: צָרַעַת là một phạm trù bệnh trạng rộng hơn bệnh phong theo nghĩa y học hiện đại; cách dịch này tránh sự đồng nhất sai nhưng vẫn dễ hiểu.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: khắp thân thể người ấy
  rationale: בָּשָׂר theo nghĩa đen là “thịt/xác thịt”, nhưng ở đây chỉ toàn bộ bề mặt thân thể; cách diễn đạt này tự nhiên và chính xác trong tiếng Việt.
- source_word: וְטִהַר
  choice: phải tuyên bố ... là thanh sạch
  rationale: Dạng piel ở đây chỉ việc thầy tế lễ đưa ra phán quyết về tình trạng thanh sạch, chứ không thực hiện sự chữa trị hay tẩy sạch.
- source_word: אֶת הַנָּגַע
  choice: người mang vết bệnh
  rationale: Theo hình thức, נֶגַע có thể là “vết bệnh/tổn thương”; tuy nhiên phán quyết thanh sạch áp dụng cho người mang nó. Cách dịch giữ dấu vết của đối tượng tiếng Hê-bơ-rơ mà vẫn rõ nghĩa trong tiếng Việt.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: Toàn thân đã chuyển sang màu trắng
  rationale: Đại từ chỉ toàn thể được hiểu theo thân thể/bề mặt bị ảnh hưởng trong ngữ cảnh; cách diễn đạt nêu rõ sự biến đổi màu sắc quyết định phán quyết.
- source_word: טָהוֹר הוּא
  choice: người ấy thanh sạch
  rationale: “Thanh sạch” là thuật ngữ thích hợp cho tình trạng tinh sạch theo luật Lê-vi, không thêm từ “nghi lễ” vốn mang tính giải thích.
theological_decisions:
- issue: Cách dịch צָרַעַת trong luật thanh sạch
  choice: bệnh ngoài da
  alternative: bệnh phong; bệnh da gây ô uế; tsaraath
  rationale: Không đồng nhất phạm trù Hê-bơ-rơ với bệnh Hansen hiện đại, đồng thời giữ cách nói dễ hiểu cho độc giả phổ thông.
- issue: Tính chất của phán quyết וְטִהַר
  choice: tuyên bố ... là thanh sạch
  alternative: làm cho thanh sạch; tẩy sạch
  rationale: Thầy tế lễ xác nhận tình trạng theo luật chứ không tạo ra sự chữa lành hay thanh tẩy.
- issue: Đối tượng của אֶת הַנָּגַע
  choice: người mang vết bệnh
  alternative: vết bệnh
  rationale: Nguyên văn đặt “vết bệnh/tổn thương” làm tân ngữ, tạo cách nói có thể hiểu theo hoán dụ; bản dịch diễn đạt người chịu phán quyết nhưng dùng chú thích để bảo tồn đặc điểm của nguyên văn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “thầy tế lễ”, “khám xét”, “tuyên bố” và “thanh sạch” để giữ sắc thái tư tế-pháp lý; tránh “bệnh phong” vì quá chuyên biệt về y học. Mọi đại từ được làm rõ bằng “người ấy” để tiếng Việt tự nhiên.
