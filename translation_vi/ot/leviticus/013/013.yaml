    issue: “và nếu” dịch וְהִנֵּה
    rationale: וְהִנֵּה đánh dấu điều thầy tế lễ quan sát thấy, không tự nó là từ điều kiện. “và thấy rằng” bảo toàn chức năng này trong tiếng Việt.
  - severity: low
    issue: “người mang vết bệnh” trong câu chính
    rationale: Nguyên văn có tân ngữ là “vết bệnh/affliction,” nhưng phán quyết áp dụng cho người bị ảnh hưởng. Dịch thẳng là “người ấy” tự nhiên hơn; chi tiết hoán dụ nên để trong chú thích.
  - severity: low
    issue: Thiếu chú thích cho “bệnh ngoài da”
    rationale: צָרַעַת là thuật ngữ rộng trong Lê-vi Ký, không nhất thiết là bệnh phong/Hansen hiện đại. Một chú thích neo tại thuật ngữ bảo vệ độ chính xác từ vựng.
