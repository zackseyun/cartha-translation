base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: vi
  text: Đến ngày thứ bảy, thầy tế lễ phải khám người ấy. Nếu vết tổn thương vẫn không thay đổi theo nhận định của thầy tế lễ[a] và không lan ra trên da, thì thầy tế lễ phải giữ riêng người ấy thêm bảy ngày nữa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “vết tổn thương vẫn đứng trong mắt người”; đây là thành ngữ, nghĩa là theo quan sát của thầy tế lễ, vết ấy dường như không thay đổi.'
    reason: lexical_alternative
  - marker: b
    text: “Giữ riêng” cũng có thể dịch là “cách ly”, “giam riêng” hoặc, sát nghĩa hơn, “đóng riêng lại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: phải khám người ấy
  rationale: Trong thủ tục kiểm tra của Lê-vi Ký 13, ראה không chỉ có nghĩa là nhìn thấy mà mang nghĩa xem xét để đưa ra nhận định nghi lễ.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: đến ngày thứ bảy
  rationale: Diễn đạt tự nhiên bằng tiếng Việt, đồng thời giữ rõ thời điểm của lần khám tiếp theo.
- source_word: וְהִנֵּה
  choice: nếu thấy
  rationale: Trong mạch luật điều kiện này, וְהִנֵּה dẫn vào kết quả quan sát; “nếu thấy” chuyển tải tự nhiên chức năng ấy mà không dùng từ cổ “này” hay “kìa”.
- source_word: הַנֶּגַע
  choice: vết tổn thương
  rationale: נגע ở đây là dấu vết hữu hình đang được kiểm tra. “Vết tổn thương” cụ thể nhưng không đồng nhất nó với một bệnh đã được y học hiện đại xác định.
- source_word: עָמַד בְּעֵינָיו
  choice: vẫn không thay đổi trước mắt mình
  rationale: Giữ góc nhìn đánh giá của thầy tế lễ trong thành ngữ nguyên văn “đứng trong mắt người,” đồng thời truyền đạt ý nghĩa là vết ấy có vẻ không đổi.
- source_word: לֹא פָשָׂה
  choice: không lan ra
  rationale: פשׂה trong ngữ cảnh chẩn định này chỉ sự lan rộng của vết trên da.
- source_word: בָּעוֹר
  choice: trên da
  rationale: Tiếng Việt tự nhiên nói một vết lan “trên da”; cách diễn đạt này vẫn thể hiện đúng phạm vi bị ảnh hưởng.
- source_word: וְהִסְגִּירוֹ
  choice: phải cách ly người ấy
  rationale: Động từ có nghĩa căn bản là đóng lại hoặc giữ riêng. “Cách ly” diễn đạt rõ sự tách riêng theo thủ tục mà không dùng thuật ngữ y tế chuyên biệt như “kiểm dịch”.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: thêm bảy ngày nữa
  rationale: Diễn đạt tự nhiên việc lặp lại giai đoạn bảy ngày lần thứ hai.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại và dễ hiểu. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh phổ thông; tránh thuật ngữ chẩn đoán y khoa hiện đại. Các từ “nếu thấy” và “thêm bảy ngày nữa” làm rõ quan hệ điều kiện và sự lặp lại vốn hàm chứa trong cú pháp Hê-bơ-rơ.
