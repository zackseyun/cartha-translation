  to: Đến ngày thứ bảy, thầy tế lễ phải khám người ấy. Nếu vết tổn thương vẫn không thay đổi theo nhận định của thầy tế lễ[a] và không lan ra trên da, thì thầy tế lễ phải giữ riêng người ấy thêm bảy ngày nữa[b].
  rationale: Bản sửa làm rõ rằng tình trạng không thay đổi là kết luận quan sát của thầy tế lễ, diễn đạt thành ngữ tiếng Hê-bơ-rơ bằng tiếng Việt tự nhiên hơn. “Giữ riêng” sát hơn với phạm vi nghĩa thủ tục của động từ gốc, nhưng chú thích vẫn nêu các cách dịch thay thế. Ý nghĩa, quan hệ điều kiện, và việc lặp lại thời hạn bảy ngày đều được giữ nguyên.
