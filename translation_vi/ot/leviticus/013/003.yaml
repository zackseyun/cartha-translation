base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: vi
  text: Thầy tế lễ phải xem xét vùng tổn thương trên da thịt. Nếu lông trong vùng tổn thương đã chuyển sang màu trắng, và vùng tổn thương ấy có vẻ sâu hơn bề mặt da của người đó, thì đó là vùng tổn thương do bệnh da[a]. Sau khi xem xét người ấy, thầy tế lễ phải tuyên bố người ấy là ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “vết bệnh phong” hoặc “chứng phung.” Từ Hê-bơ-rơ צָרַעַת chỉ một phạm trù nghi lễ rộng hơn bệnh phong (bệnh Hansen) theo cách hiểu y học hiện đại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: vùng tổn thương
  rationale: Trong ngữ cảnh khám da của Lê-vi Ký 13, từ này chỉ một vùng da có dấu hiệu bất thường. “Vùng tổn thương” tự nhiên, rõ nghĩa và không ấn định một chẩn đoán y khoa hiện đại.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: trên da thịt
  rationale: Giữ được cả ý “da” và “thịt/thân thể” của tiếng Hê-bơ-rơ, đồng thời phù hợp với văn phong trang trọng của bản dịch Kinh Thánh tiếng Việt.
- source_word: שֵׂעָר
  choice: lông
  rationale: Trong ngữ cảnh một vùng da trên thân thể, “lông” chính xác và tự nhiên hơn từ “tóc”.
- source_word: הָפַךְ לָבָן
  choice: đã chuyển sang màu trắng
  rationale: Diễn đạt trạng thái thay đổi đã có thể quan sát được khi khám.
- source_word: מַרְאֵה
  choice: trông
  rationale: Chuyển tải phương diện bề ngoài, có thể quan sát, bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: trông sâu hơn da thịt của người đó
  rationale: Giữ yếu tố so sánh và cho thấy đây là biểu hiện nhìn thấy được, không nhất thiết là phép đo độ sâu.
- source_word: נֶגַע צָרַעַת
  choice: vùng tổn thương do bệnh da
  rationale: Thể hiện cả נֶגַע và צָרַעַת nhưng tránh cụm lặp vụng về; không đồng nhất thuật ngữ cổ với bệnh phong/Hansen hiện đại.
- source_word: וְרָאָהוּ
  choice: Sau khi xem xét người ấy
  rationale: Hậu tố có thể quy về người đang được khám; cách dịch theo trình tự thời gian tự nhiên trong tiếng Việt và giữ sự lặp lại có chức năng pháp lý.
- source_word: וְטִמֵּא אֹתוֹ
  choice: phải tuyên bố người ấy là ô uế
  rationale: Trong luật thanh sạch, thầy tế lễ đưa ra phán quyết về tình trạng nghi lễ, chứ không làm cho người ấy trở nên ô uế.
theological_decisions:
- issue: Cách dịch צָרַעַת trong luật thanh sạch
  choice: bệnh da
  alternative: bệnh phong; chứng phung
  rationale: צָרַעַת là một phạm trù cổ về tổn thương gây ô uế theo nghi lễ, rộng hơn và không đồng nhất chắc chắn với bệnh Hansen hiện đại. Chú thích bảo lưu cách dịch truyền thống.
- issue: Hiệu lực hành động của thầy tế lễ trong וְטִמֵּא אֹתוֹ
  choice: tuyên bố người ấy là ô uế
  alternative: làm cho người ấy ô uế
  rationale: Ngữ cảnh mô tả việc khám và công bố tình trạng nghi lễ; tránh hàm ý thầy tế lễ là nguyên nhân tạo ra sự ô uế.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo văn phong Kinh Thánh quen thuộc; dùng “ô uế” để chỉ tình trạng nghi lễ. Câu được tách thành ba câu để dễ đọc mà vẫn giữ nguyên tiến trình khám, nhận định và tuyên bố.
