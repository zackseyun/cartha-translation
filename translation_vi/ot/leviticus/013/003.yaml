revisions:
- from: Thầy tế lễ phải xem xét vùng tổn thương trên da thịt. Nếu lông trong vùng tổn thương đã chuyển sang màu trắng, và vùng ấy trông sâu hơn da thịt của người đó, thì đó là vùng tổn thương do bệnh da[a]. Sau khi xem xét người ấy, thầy tế lễ phải tuyên bố người ấy là ô uế.
  to: Thầy tế lễ phải xem xét vùng tổn thương trên da thịt. Nếu lông trong vùng tổn thương đã chuyển sang màu trắng, và vùng tổn thương ấy có vẻ sâu hơn bề mặt da của người đó, thì đó là vùng tổn thương do bệnh da[a]. Sau khi xem xét người ấy, thầy tế lễ phải tuyên bố người ấy là ô uế.
  rationale: Sửa tối thiểu để diễn đạt rõ đặc điểm thị giác của tổn thương so với bề mặt da, và để chú thích bảo lưu đúng cách dịch truyền thống trong khi tránh áp đặt một chẩn đoán y khoa hiện đại lên thuật ngữ nghi lễ cổ.
