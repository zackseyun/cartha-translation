review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự: thầy tế lễ khám vùng tổn thương, nhận diện hai dấu hiệu (lông đã trắng và tổn thương có vẻ sâu hơn da), rồi công bố người được khám là ô uế theo nghi lễ. “Bệnh da” kèm chú thích tránh đồng nhất צָרַעַת với bệnh Hansen. Cần làm rõ hơn ý ‘vẻ bề ngoài sâu hơn bề mặt da’ của מַרְאֵה ... עָמֹק מֵעוֹר.'
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt Kinh Thánh hiện đại. Tuy nhiên, “vùng ấy trông sâu hơn da thịt” hơi gượng và không diễn đạt rõ sự so sánh với bề mặt da. “Vùng tổn thương ấy có vẻ sâu hơn bề mặt da” rõ và tự nhiên hơn.
  terminology: “Thầy tế lễ” và “ô uế” phù hợp ngữ vực. “Lông” là lựa chọn tốt trong ngữ cảnh da thân thể. Chú thích nên thay “vết phung”, một cách gọi không tự nhiên và không phải lựa chọn truyền thống rõ ràng, bằng “vết bệnh phong” hoặc “chứng phung”; đồng thời nên mô tả צָרַעַת là một phạm trù nghi lễ, không chỉ là ‘phạm trù tổn thương’.
  issues:
  - severity: low
    issue: Cụm “trông sâu hơn da thịt” chưa rõ nghĩa
    rationale: Tiếng Hê-bơ-rơ nói về diện mạo của vùng tổn thương có vẻ sâu hơn da xung quanh, chứ không nói chung là ‘sâu hơn da thịt’. Thêm “bề mặt da” làm rõ đặc điểm quan sát được mà không tăng ý nghĩa.
  - severity: medium
    issue: Chú thích dùng “vết phung” và mô tả từ vựng chưa chuẩn xác
    rationale: “Vết phung” không phải là một tương đương truyền thống tự nhiên. Hơn nữa, צָרַעַת là phạm trù nghi lễ cổ rộng hơn bệnh Hansen, không đơn thuần là một ‘phạm trù tổn thương’.
  revised_text: Thầy tế lễ phải xem xét vùng tổn thương trên da thịt. Nếu lông trong vùng tổn thương đã chuyển sang màu trắng, và vùng tổn thương ấy có vẻ sâu hơn bề mặt da của người đó, thì đó là vùng tổn thương do bệnh da[a]. Sau khi xem xét người ấy, thầy tế lễ phải tuyên bố người ấy là ô uế.
