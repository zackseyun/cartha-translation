revisions:
- from: Nhưng nếu vết ấy lại xuất hiện trên áo quần[a], trên sợi dọc hay sợi ngang, hoặc trên bất cứ đồ vật bằng da nào, thì vết ấy đang lan rộng. Phải dùng lửa thiêu vật có vết nhiễm[b] đó.
  to: Nhưng nếu vết đó[a] lại xuất hiện trên áo quần, trên sợi dọc hay sợi ngang, hoặc trên bất cứ đồ vật bằng da nào, thì đó là vết đang lan rộng. Phải dùng lửa thiêu vật có vết ấy.
  rationale: Bản sửa thay thuật ngữ gượng “vết nhiễm” bằng “vết,” là cách diễn đạt trung tính và tự nhiên hơn cho negaʿ. Chú thích được viết lại để bảo toàn sắc thái thuật ngữ của tiếng Hê-bơ-rơ mà không biến nó thành một chẩn đoán y khoa. Chú thích về בֶּגֶד được giữ như một khả năng nghĩa rộng, nhưng các mốc chú thích được đặt lại cho phù hợp với các từ mà chúng giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:41Z'
