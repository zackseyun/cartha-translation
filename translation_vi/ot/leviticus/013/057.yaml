  verdict: revise
  source_fidelity: 'Bản dịch tái hiện đúng các thành phần chính của câu: sự tái xuất hiện, các loại vật liệu/vật dụng, tính chất lan rộng và mệnh lệnh thiêu hủy. Tuy nhiên, “vết nhiễm” không phải là một tổ hợp tự nhiên, rõ nghĩa trong tiếng Việt hiện đại; nó có thể khiến người đọc hiểu như một vết đã bị lây nhiễm mà không nêu rõ điều gì. Negaʿ nên được dịch bằng một danh từ trung tính, không chẩn đoán y khoa, và chú thích giải thích tính kỹ thuật của từ này.'
  naturalness: “Sợi dọc/sợi ngang,” “đồ vật bằng da,” và cấu trúc “Phải dùng lửa thiêu...” đều tự nhiên, phù hợp văn phong pháp quy hiện đại. Thay “vết nhiễm” bằng “vết đó” trong bản văn chính giúp câu sáng rõ và tránh cách dùng từ gượng.
  terminology: Giữ “sợi dọc” và “sợi ngang” cho שְׁתִי và עֵרֶב. Dùng “vết” cho נגע để không áp đặt nghĩa bệnh truyền nhiễm hay một chẩn đoán hiện đại; chú thích nêu đây là thuật ngữ kỹ thuật chỉ vết/tình trạng gây ô uế theo nghi lễ. “Áo quần” vẫn có thể được giữ, với chú thích cho phạm vi nghĩa rộng của בֶּגֶד.
