id: LEV.13.57
reference: Leviticus 13:57
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: vi
  text: Nhưng nếu vết đó[a] lại xuất hiện trên áo quần, trên sợi dọc hay sợi ngang, hoặc trên bất cứ đồ vật bằng da nào, thì đó là vết đang lan rộng. Phải dùng lửa thiêu vật có vết ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hê-bơ-rơ negaʿ, thuật ngữ kỹ thuật trong Lê-vi Ký chỉ một vết hoặc tình trạng liên quan đến ô uế nghi lễ; theo truyền thống cũng được dịch là “tai vạ” hoặc “vết bệnh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: lại xuất hiện
  rationale: Động từ thể Niphal diễn tả vết trở nên thấy được, còn עוֹד trong thủ tục kiểm tra này chỉ sự tái xuất hiện sau khi giặt.
- source_word: בֶּגֶד
  choice: áo quần
  rationale: Từ này có thể chỉ y phục hoặc vật bằng vải; trong mạch văn Lê-vi Ký 13, “áo quần” là cách diễn đạt tự nhiên, còn nghĩa rộng hơn được ghi ở chú thích.
- source_word: שְׁתִי ... עֵרֶב
  choice: sợi dọc ... sợi ngang
  rationale: Đây là cặp thuật ngữ dệt may chỉ các sợi chạy theo chiều dọc và chiều ngang của tấm vải, rõ nghĩa hơn cho độc giả phổ thông so với việc vay mượn thuật ngữ ngoại lai.
- source_word: כְּלִי עוֹר
  choice: đồ vật bằng da
  rationale: Cụm từ chỉ rộng mọi vật dụng hay đồ vật làm bằng da, không giới hạn vào một loại vật chứa cụ thể.
- source_word: פֹּרַחַת הִוא
  choice: vết ấy đang lan rộng
  rationale: פֹּרַחַת theo nghĩa đen gợi sự nảy nở hoặc phát triển, nhưng tại đây diễn tả vết đang phát triển hay lan ra; cách dịch giữ được tính tiến triển mà không biến nó thành một chẩn đoán y khoa hiện đại.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Phải dùng lửa thiêu
  rationale: Giữ sắc thái mệnh lệnh pháp lý của động từ ngôi thứ hai số ít, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: vật có vết nhiễm đó
  rationale: Mệnh đề quan hệ chỉ chính vật chứa vết bị ảnh hưởng; cách dịch ngắn gọn nhưng vẫn xác định toàn bộ vật ấy phải bị thiêu.
- source_word: הַנָּגַע
  choice: vết nhiễm
  rationale: נגע là thuật ngữ chuyên biệt trong Lê-vi Ký 13 chỉ vết hay tình trạng bị tác động và gây ô uế; “vết nhiễm” tránh đồng nhất nó với một bệnh lý hiện đại cụ thể.
theological_decisions:
- issue: Bản chất của נגע trong luật thanh sạch
  choice: vết nhiễm
  alternative: bệnh dịch; vết bệnh
  rationale: Nguyên văn không xác định một bệnh theo y học hiện đại. “Vết nhiễm” giữ được khía cạnh hữu hình và tình trạng ô uế trong nghi lễ mà không áp đặt một chẩn đoán ngoài văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc mệnh lệnh vô nhân xưng “Phải...” giữ giọng luật lệ mà không dùng đại từ cổ “ngươi”. Các thuật ngữ dệt được diễn đạt bằng “sợi dọc” và “sợi ngang” để độc giả phổ thông hiểu ngay.
