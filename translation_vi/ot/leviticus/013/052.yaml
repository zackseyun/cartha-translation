review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các thành tố chính của tiếng Hê-bơ-rơ: lệnh phải thiêu, y phục/vật liệu dệt, đồ da có vết bệnh, và mệnh lệnh thiêu bằng lửa. Tuy nhiên, “ăn lan” không phản ánh chắc chắn tính từ מַמְאֶרֶת, vốn nhấn mạnh tính hủy hoại/ác hại hơn là sự lan rộng; cách này cũng dễ gợi một cơ chế bệnh học hiện đại không có trong nguyên văn.'
  naturalness: Câu văn nhìn chung tự nhiên và có sắc thái luật lệ. “Y phục” bao quát hơn “áo” và phù hợp hơn với ngữ cảnh đang nói cả về vải dệt. “Chứng bệnh gây hủy hoại” tự nhiên hơn “chứng bệnh ăn lan” trong ngữ cảnh vải vóc và đồ da.
  terminology: “Sợi dọc, sợi ngang,” “len,” “vải lanh,” và “đồ vật bằng da” là các tương đương chính xác, dễ hiểu. Chú thích về צָרַעַת thích đáng, vì thuật ngữ này là một phạm trù nghi lễ rộng hơn bệnh phong hiện đại và được áp dụng cho vật liệu.
  issues:
