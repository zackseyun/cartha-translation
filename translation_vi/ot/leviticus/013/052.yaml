revisions:
- from: Người ấy phải thiêu áo[a], hoặc sợi dọc hay sợi ngang bằng len hoặc vải lanh, hoặc bất cứ đồ vật bằng da nào có vết bệnh, vì đó là chứng bệnh ăn lan[b]; vật ấy phải bị thiêu trong lửa.
  to: Người ấy phải thiêu y phục[a], hoặc sợi dọc hay sợi ngang bằng len hoặc vải lanh, hoặc bất cứ đồ vật bằng da nào có vết bệnh, vì đó là một chứng bệnh gây hủy hoại[b]; vật ấy phải bị thiêu trong lửa.
  rationale: Đổi “áo” thành “y phục” để phản ánh phạm vi rộng của בֶּגֶד. Đổi “ăn lan” thành “gây hủy hoại” để chuyển đạt מַמְאֶרֶת mà không áp đặt ý lan truyền hoặc chẩn đoán y khoa. Giữ nguyên cấu trúc, mệnh lệnh, các thuật ngữ dệt, và hai điểm neo chú thích của bản nháp.
  reviewer_model: gpt-5.6-terra
