id: LEV.13.52
reference: Leviticus 13:52
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: vi
  text: Người ấy phải thiêu y phục[a], hoặc sợi dọc hay sợi ngang bằng len hoặc vải lanh, hoặc bất cứ đồ vật bằng da nào có vết bệnh, vì đó là một chứng bệnh gây hủy hoại[b]; vật ấy phải bị thiêu trong lửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Y phục” cũng có thể hiểu rộng là “tấm vải” trong ngữ cảnh này.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ צָרַעַת, thường được dịch theo truyền thống là “bệnh phong”, chỉ một phạm trù ô uế theo nghi lễ rộng hơn bệnh phong hiện đại; từ này cũng được dùng cho vải vóc và nhà cửa.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Người ấy phải thiêu
  rationale: Trong trình tự luật lệ, động từ với liên từ mang sức quy định; “phải” diễn đạt nghĩa bắt buộc tự nhiên trong tiếng Việt.
- source_word: הַבֶּגֶד
  choice: áo
  rationale: בגד chỉ áo hay y phục; “áo” ngắn gọn, tự nhiên trong ngữ cảnh này.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: sợi dọc ... sợi ngang
  rationale: Đây là cặp thuật ngữ dệt, lần lượt chỉ các sợi theo chiều dọc và chiều ngang.
- source_word: בַּצֶּמֶר א֣וֹ בַפִּשְׁתִּים
  choice: bằng len hoặc vải lanh
  rationale: Diễn đạt vật liệu của sợi dệt một cách rõ ràng và tự nhiên; פשתים có thể chỉ lanh hoặc sản phẩm dệt từ lanh.
- source_word: כָּל כְּלִי הָעוֹר
  choice: bất cứ đồ vật bằng da nào
  rationale: כְּלִי có nghĩa rộng là vật dụng hay đồ vật, không nhất thiết là bình chứa.
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: nào có vết bệnh
  rationale: נגע trong chương này có thể chỉ chính dấu vết bị kiểm tra; “vết bệnh” tránh áp đặt một chẩn đoán y khoa hiện đại.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: chứng bệnh ăn lan
  rationale: ממארת mô tả tính tai hại, dai dẳng hoặc có sức ăn phá. “Ăn lan” phù hợp với vật liệu và không dùng thuật ngữ ung thư hiện đại.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: vật ấy phải bị thiêu trong lửa
  rationale: Thể bị động cùng sắc thái luật định được giữ bằng “phải bị thiêu”; chủ ngữ được nói rõ để câu Việt tự nhiên.
theological_decisions:
- issue: Cách dịch צָרַעַת khi thuật ngữ được áp dụng cho vải và đồ da
  choice: chứng bệnh
  alternative: bệnh phong; chứng ô uế; tsaraath
  rationale: צָרַעַת là một phạm trù ô uế theo nghi lễ rộng hơn bệnh Hansen hiện đại và trong Lê-vi Ký còn áp dụng cho vật liệu và nhà cửa. “Chứng bệnh” giữ liên hệ với phạm trù của chương mà không đồng nhất nó với bệnh phong hiện đại.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng các thuật ngữ dệt dễ hiểu “sợi dọc, sợi ngang”; tránh đồng nhất צָרַעַת với một bệnh trạng y khoa hiện đại. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
