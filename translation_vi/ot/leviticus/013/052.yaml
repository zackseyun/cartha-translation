  - severity: low
    issue: “áo” hẹp hơn הַבֶּגֶד
    rationale: בֶּגֶד là y phục/đồ mặc nói chung. Trong một danh sách có các thành phần dệt và đồ da, “y phục” giữ phạm vi rộng hơn và phù hợp hơn.
