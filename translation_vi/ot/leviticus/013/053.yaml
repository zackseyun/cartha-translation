base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: vi
  text: Nhưng nếu thầy tế lễ xem xét và nhận thấy vết bệnh không lan rộng trên áo, hoặc trên sợi dọc, hoặc trên sợi ngang, hoặc trên bất cứ đồ vật bằng da nào,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu trường hợp điều kiện tiếp nối nhưng tương phản nhẹ với trường hợp trước; cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: יִרְאֶה הַכֹּהֵן
  choice: thầy tế lễ xem xét
  rationale: Động từ có nghĩa cơ bản là “thấy”, nhưng trong ngữ cảnh này chỉ hành động kiểm tra chính thức của thầy tế lễ.
- source_word: וְהִנֵּה
  choice: và nhận thấy
  rationale: Chuyển tải dấu hiệu diễn ngôn hướng sự chú ý đến kết quả quan sát mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: לֹא פָשָׂה הַנֶּגַע
  choice: vết bệnh không lan rộng
  rationale: פשה diễn tả sự lan ra; נגע ở đây là vùng hoặc tình trạng bất thường trên vật liệu, nên “vết bệnh” giữ được tính khái quát và tránh gán một chẩn đoán hiện đại.
- source_word: בַּבֶּגֶד
  choice: trên áo
  rationale: בגד trong mạch văn chỉ áo hoặc vật may mặc; “trên” tự nhiên hơn trong tiếng Việt khi nói một vết xuất hiện ở bề mặt.
- source_word: בַשְּׁתִי א֣וֹ בָעֵרֶב
  choice: trên sợi dọc hay sợi ngang
  rationale: Hai thuật ngữ dệt may lần lượt chỉ hệ sợi chạy dọc và hệ sợi chạy ngang; cách gọi này chính xác và dễ hiểu hơn thuật ngữ cổ.
- source_word: בְּכָל כְּלִי עוֹר
  choice: trên bất cứ đồ vật bằng da nào
  rationale: כְּלִי là từ rộng chỉ đồ vật hoặc vật dụng; “đồ vật bằng da” giữ phạm vi khái quát của nguyên ngữ.
