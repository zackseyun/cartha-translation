source:
  edition: WLC
  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: vi
  text: Vào ngày thứ bảy, thầy tế lễ phải xem xét vết nhiễm. Nếu vết nhiễm đã lan rộng trên áo, trên sợi dọc hay sợi ngang, hoặc trên da thuộc hay bất cứ vật dụng nào làm bằng da thuộc, thì đó là tsaraʿat hủy hoại[a]; vật ấy ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraʿat là thuật ngữ Hê-bơ-rơ thường được dịch theo truyền thống là “bệnh phong”, nhưng trong Lê-vi Ký 13, từ này chỉ nhiều tình trạng gây ô uế khác nhau và có thể xuất hiện cả trên áo, vải dệt và da thuộc.
    reason: Giải thích thuật ngữ Hê-bơ-rơ không tương ứng chính xác với một căn bệnh hiện đại và trong câu này áp dụng cho vật liệu, không chỉ cho da người.
lexical_decisions:
- source_word: וְרָאָה
  choice: phải xem xét
  rationale: Trong thủ tục kiểm tra của luật tế lễ, động từ này chỉ việc quan sát để thẩm định, không chỉ đơn thuần là nhìn thấy.
- source_word: הַנֶּגַע
  choice: vết nhiễm
  rationale: נגע ở đây là vùng bị tác động trên vật liệu và có thể lan rộng. “Vết nhiễm” tự nhiên trong tiếng Việt, đồng thời không xác định quá mức đây là loại nấm hay tác nhân y học nào.
- source_word: פָשָׂה
  choice: đã lan rộng
  rationale: Diễn đạt trực tiếp sự lan ra của vết nhiễm sau thời gian cách ly.
- source_word: בֶּגֶד
  choice: áo
  rationale: Từ này thường chỉ áo hoặc y phục; “áo” ngắn gọn, dễ hiểu trong danh sách các vật liệu dệt.
- source_word: שְׁתִי ... עֵרֶב
  choice: sợi dọc ... sợi ngang
  rationale: Đây là hai thuật ngữ dệt chỉ các sợi theo chiều dọc và chiều ngang; cách gọi này chính xác và dễ hiểu hơn các thuật ngữ chuyên môn ít thông dụng.
- source_word: עוֹר
  choice: da thuộc
  rationale: Ngữ cảnh nói đến da đã được dùng để làm vật dụng, nên “da thuộc” phù hợp hơn “da” theo nghĩa lớp da trên cơ thể.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: bất kể da ấy được dùng làm vật dụng gì
  rationale: Cách diễn đạt tự nhiên này giữ phạm vi bao quát của điều luật đối với mọi công dụng hay sản phẩm làm từ da.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: chứng tsaraʿat hủy hoại
  rationale: Giữ thuật ngữ Hebrew vì צָרַעַת bao gồm nhiều hiện tượng gây ô uế và tại đây còn xuất hiện trên vải, da thuộc; “hủy hoại” truyền đạt tính chất gây tổn hại của מַמְאֶרֶת mà không biến nó thành một chẩn đoán y học hiện đại.
- source_word: טָמֵא הוּא
  choice: vật ấy ô uế
  rationale: Đại từ Hebrew quy chiếu đến vật bị nhiễm; thêm “vật” làm rõ đối tượng trong tiếng Việt. “Ô uế” giữ nguyên địa vị theo luật thanh sạch.
theological_decisions:
- issue: Ý nghĩa của צָרַעַת trong luật thanh sạch
  choice: chứng tsaraʿat
  alternative: bệnh phong; bệnh ngoài da
  rationale: Không đồng nhất thuật ngữ này với bệnh Hansen hiện đại hoặc chỉ với bệnh trên da người, vì chính câu này áp dụng nó cho áo, sợi dệt và da thuộc. Phiên âm trong chính văn cùng chú thích bảo toàn phạm vi và sự căng nghĩa của thuật ngữ.
- issue: Tính chất của sự ô uế
  choice: ô uế
  alternative: ô uế về nghi lễ
  rationale: Bản Hebrew chỉ nói “ô uế”. Bản dịch không thêm cụm giải thích vào chính văn, để không thu hẹp hoặc diễn giải quá mức phát biểu pháp lý.
translation_notes:
  register: 'Văn phong pháp lý, trang nghiêm nhưng hiện đại. Câu được chia làm hai để người đọc dễ theo dõi danh sách vật liệu. “Thầy tế lễ” được nêu rõ theo chủ thể đã xác lập trong văn cảnh gần, dù Hebrew tại câu này chỉ dùng động từ ngôi thứ ba số ít. Dấu chấm phẩy giữ hai phán quyết liên hệ chặt chẽ: nhận diện chứng trạng và tuyên bố vật ấy ô uế.'
