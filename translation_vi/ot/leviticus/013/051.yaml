revisions:
- from: Vào ngày thứ bảy, thầy tế lễ phải xem xét vết nhiễm. Nếu vết nhiễm đã lan rộng trên áo, trên sợi dọc hay sợi ngang, hoặc trên da thuộc, bất kể da ấy được dùng làm vật dụng gì, thì vết nhiễm đó là chứng tsaraʿat hủy hoại[a]; vật ấy ô uế.
  to: Vào ngày thứ bảy, thầy tế lễ phải xem xét vết nhiễm. Nếu vết nhiễm đã lan rộng trên áo, trên sợi dọc hay sợi ngang, hoặc trên da thuộc hay bất cứ vật dụng nào làm bằng da thuộc, thì đó là tsaraʿat hủy hoại[a]; vật ấy ô uế.
  rationale: Bản sửa làm rõ rằng điều luật bao gồm mọi vật dụng được làm bằng da thuộc, phù hợp với mệnh đề bao quát của Hebrew. Cụm “tsaraʿat hủy hoại” bảo toàn thuật ngữ kỹ thuật và tính chất gây hại mà không áp đặt một chẩn đoán hiện đại. Các yếu tố còn lại của bản dịch được giữ nguyên vì trung thành với nguồn và tự nhiên trong tiếng Việt hiện đại.
