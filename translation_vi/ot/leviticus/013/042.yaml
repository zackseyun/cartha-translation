source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: vi
  text: Nhưng nếu trên chỗ hói phía sau đầu hoặc chỗ hói phía trước đầu có một vết bệnh trắng pha đỏ[b], thì đó là bệnh ngoài da[a] đang bộc phát trên chỗ hói phía sau đầu hoặc chỗ hói phía trước đầu của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “bệnh phong.” Từ Hê-bơ-rơ này chỉ nhiều loại bệnh hoặc tình trạng ngoài da, không nên được đồng nhất hoàn toàn với bệnh Hansen ngày nay.'
    reason: lexical_alternative
  - marker: b
    text: Hai từ Hê-bơ-rơ ở đây phân biệt chỗ hói phía sau đầu với chỗ hói phía trước đầu.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Nhưng nếu
  rationale: Mở đầu một trường hợp có điều kiện, đồng thời thể hiện sự tương phản với trường hợp hói đầu bình thường ở câu trước.
- source_word: בַקָּרַחַת א֣וֹ בַגַּבַּחַת
  choice: trên chỗ hói phía sau đầu hoặc chỗ hói phía trước đầu
  rationale: Giữ sự phân biệt giữa hai thuật ngữ Hê-bơ-rơ chỉ vùng hói phía sau và phía trước đầu; cách diễn đạt rõ nghĩa trong tiếng Việt hiện đại.
- source_word: נֶגַע
  choice: vết bệnh
  rationale: Chỉ dấu tổn thương nhìn thấy được và được thầy tế lễ xem xét, nhưng không áp đặt một chẩn đoán y khoa hiện đại cụ thể.
- source_word: לָבָן אֲדַמְדָּם
  choice: trắng pha đỏ
  rationale: Giữ thứ tự màu sắc của tiếng Hê-bơ-rơ và diễn đạt tự nhiên hơn lối ghép tính từ máy móc.
- source_word: צָרַעַת
  choice: bệnh ngoài da
  rationale: Thuật ngữ Hê-bơ-rơ có phạm vi rộng hơn bệnh Hansen hiện đại; lựa chọn này rõ nghĩa mà không đồng nhất sai với bệnh phong.
- source_word: פֹּרַחַת
  choice: đang phát ra
  rationale: Động tính từ của פרח mô tả bệnh đang bộc phát hoặc lan ra; cách dịch này giữ sắc thái tiến triển mà không xác định quá mức cơ chế.
theological_decisions:
- issue: Quan hệ giữa צָרַעַת và bệnh phong hiện đại
  choice: Dịch là “bệnh ngoài da” và ghi chú cách dịch truyền thống
  alternative: bệnh phong; bệnh hủi
  rationale: Không đồng nhất thuật ngữ nghi lễ cổ với riêng bệnh Hansen, đồng thời vẫn cho độc giả biết truyền thống dịch thuật quen thuộc.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “người ấy” để tránh lặp đại từ nam giới không tự nhiên trong tiếng Việt; giữ nguyên sự lặp lại của hai vùng hói vì đó là một phần của công thức xác định trong nguyên văn.
