  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת לְבָנָה֙ בָּ/ע֔וֹר וְ/הִ֕יא הָפְכָ֖ה שֵׂעָ֣ר לָבָ֑ן וּ/מִֽחְיַ֛ת בָּשָׂ֥ר חַ֖י בַּ/שְׂאֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/010.yaml
  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: vi
  text: Thầy tế lễ sẽ xem xét người ấy; nếu trên da có một chỗ sưng trắng[a], lông trên đó đã trở nên trắng, và trong chỗ sưng có một vùng thịt sống[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chỗ nổi lên”. Từ Hê-bơ-rơ שְׂאֵת là thuật ngữ trong chương này chỉ một tổn thương nhô cao trên da.
    reason: lexical_alternative
  - marker: b
    text: Sát nghĩa là “thịt sống”; cụm từ này chỉ phần mô còn sống lộ ra bên trong chỗ sưng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: sẽ xem xét
  rationale: Trong thủ tục chẩn định của luật thanh sạch, động từ ראה mang nghĩa quan sát, kiểm tra chứ không chỉ đơn thuần là nhìn thấy; “sẽ xem xét” diễn đạt tự nhiên sắc thái quy trình.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi chuẩn, trang trọng và dễ hiểu đối với כֹּהֵן trong luật Lê-vi; người này có thẩm quyền xem xét tình trạng da.
- source_word: וְהִנֵּה
  choice: nếu thấy
  rationale: Trong cấu trúc luật theo trường hợp, cách diễn đạt này chuyển tải chức năng hướng sự chú ý đến dấu hiệu được quan sát, đồng thời tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: שְׂאֵת
  choice: chỗ sưng
  rationale: Thuật ngữ chỉ một tổn thương nhô cao trên da; “chỗ sưng” rõ nghĩa trong văn cảnh và vẫn giữ khả năng hiểu là một vùng nổi lên.
- source_word: לְבָנָה
  choice: trắng
  rationale: Tính từ chỉ màu sắc bổ nghĩa cho chỗ sưng.
- source_word: בָּעוֹר
  choice: trên da
  rationale: “Trên da” là cách nói tiếng Việt tự nhiên về vị trí xuất hiện của tổn thương, dù giới từ Hebrew cũng có thể được diễn đạt sát là “trong da”.
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: chỗ ấy đã làm lông hóa trắng
  rationale: Đại từ giống cái quy chiếu về שְׂאֵת; cách dịch giữ chỗ sưng làm chủ thể gây ra sự đổi màu của lông, như cấu trúc Hebrew.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: và có mô thịt tươi
  rationale: Cụm từ mô tả mô sống, còn tươi xuất hiện như một dấu hiệu bên trong tổn thương. “Mô thịt tươi” tránh cách hiểu thông thường của “thịt sống” là thịt chưa nấu, nhưng ghi chú vẫn bảo lưu nghĩa đen.
- source_word: בַּשְׂאֵת
  choice: trong chỗ sưng
  rationale: Giữ nhất quán cách dịch שְׂאֵת và xác định mô thịt nằm bên trong tổn thương.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng câu điều kiện tự nhiên trong tiếng Việt. “Thầy tế lễ” phù hợp với thuật ngữ Kinh Thánh phổ thông; “mô thịt tươi” giúp người đọc hiện đại hiểu dấu hiệu tổn thương mà không biến câu thành một chẩn đoán y khoa hiện đại.
