  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các dấu hiệu chính: chỗ sưng trắng, lông đổi trắng, và phần thịt sống ở trong chỗ sưng. Tuy nhiên, “chỗ ấy đã làm lông hóa trắng” không tự nhiên và làm quan hệ nguyên nhân trở nên gượng; tiếng Hê-bơ-rơ diễn tả dấu hiệu lông đã đổi trắng liên hệ với chỗ sưng. “Mô thịt tươi” cũng chưa chuyển đạt rõ nét thuật ngữ מִחְיַת בָּשָׂר חַי (‘thịt sống’/phần thịt còn sống lộ ra).'
  naturalness: 'Cần thay “lông hóa trắng” bằng cách nói hiện đại, tự nhiên hơn: “lông trên đó đã trở nên trắng.” “Một vùng thịt sống” rõ nghĩa hơn “mô thịt tươi” trong văn cảnh quy định khám xét da, đồng thời chú thích giải thích nghĩa kỹ thuật để tránh hiểu là thịt chưa nấu.'
  terminology: Giữ “thầy tế lễ” là phù hợp với כֹּהֵן trong sách Lê-vi. Giữ nhất quán “chỗ sưng” cho שְׂאֵת. Dùng “vùng thịt sống” cho מִחְיַת בָּשָׂר חַי, với chú thích nêu nghĩa đen và ý chỉ phần mô còn sống lộ ra.
