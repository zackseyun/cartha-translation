- from: Nếu vết trên áo, trên da thuộc, trên sợi dọc hay sợi ngang, hoặc trên bất cứ vật dụng bằng da nào có màu xanh xanh hoặc đo đỏ, thì đó là vết bệnh[a]; phải đem vật ấy trình cho thầy tế lễ.
  to: Nếu vết trên áo, trên da thuộc, trên sợi dọc hay sợi ngang, hoặc trên bất cứ vật dụng bằng da nào có màu xanh xanh hoặc đo đỏ, thì đó là vết bệnh[a]; vật ấy phải được trình cho thầy tế lễ.
  rationale: Chỉ điều chỉnh mệnh đề cuối để tái hiện hình thức bị động không nêu tác nhân của nguyên văn. Các lựa chọn từ vựng còn lại trung thành với tiếng Hê-bơ-rơ và phù hợp tiếng Việt hiện đại.
