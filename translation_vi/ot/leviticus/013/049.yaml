id: LEV.13.49
reference: Leviticus 13:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: vi
  text: Nếu vết trên áo, trên da thuộc, trên sợi dọc hay sợi ngang, hoặc trên bất cứ vật dụng bằng da nào có màu xanh xanh hoặc đo đỏ, thì đó là vết bệnh[a]; vật ấy phải được trình cho thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo truyền thống: “vết phong hủi.” Từ Hê-bơ-rơ tzaraat chỉ một phạm trù bệnh trạng rộng hơn trong Lê-vi Ký, có thể xuất hiện trên da người, vải và đồ da; từ này không chỉ riêng bệnh phong theo nghĩa y học hiện đại.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶגַע
  choice: vết
  rationale: Trong ngữ cảnh kiểm tra áo vải và đồ da, từ này chỉ một vùng bất thường có thể nhìn thấy; “vết” tự nhiên và dùng được cho mọi loại vật liệu được liệt kê.
- source_word: יְרַקְרַק
  choice: xanh xanh
  rationale: Dạng láy của tính từ chỉ sắc xanh, không nhất thiết là một màu xanh đậm hoặc thuần; “xanh xanh” giữ được sắc thái xấp xỉ của nguyên ngữ.
- source_word: אֲדַמְדָּם
  choice: đo đỏ
  rationale: Dạng láy diễn tả màu hơi đỏ; “đo đỏ” vừa tự nhiên trong tiếng Việt vừa phản ánh hình thái của từ Hê-bơ-rơ.
- source_word: בֶּגֶד
  choice: áo
  rationale: Trong văn cảnh này, từ chỉ một vật bằng vải dùng để mặc; “áo” rõ ràng và dễ hiểu hơn cách gọi khái quát “vải vóc”.
- source_word: עוֹר
  choice: da thuộc
  rationale: Ở đây מדובר về vật liệu đã được dùng để chế tạo đồ vật, không phải da trên cơ thể sống; “da thuộc” tránh sự nhập nhằng đó.
- source_word: שְׁתִי / עֵרֶב
  choice: sợi dọc / sợi ngang
  rationale: Hai cách gọi thông dụng trong tiếng Việt truyền đạt chính xác hai hệ sợi của vải dệt mà không cần thuật ngữ khó hiểu.
- source_word: כְּלִי עוֹר
  choice: vật dụng bằng da
  rationale: Cụm từ chỉ chung bất cứ đồ vật hay dụng cụ nào làm bằng da; cách dịch này tự nhiên và không thu hẹp loại đồ vật.
- source_word: נֶגַע צָרַעַת
  choice: vết bệnh
  rationale: Cách dịch ngắn gọn, phù hợp với vật liệu vô tri và tránh đồng nhất צָרַעַת với bệnh phong hiện đại; chú thích bảo tồn tính chất thuật ngữ của phạm trù Hê-bơ-rơ.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: phải đem vật ấy trình cho thầy tế lễ
  rationale: Dạng bị động Hê-bơ-rơ không nêu người thực hiện. Tiếng Việt tự nhiên hơn khi dùng cấu trúc vô nhân xưng với “phải”, đồng thời giữ trọng tâm nơi vật cần được trình ra.
theological_decisions:
- issue: Cách dịch צָרַעַת trong luật kiểm tra của thầy tế lễ
  choice: vết bệnh
  alternative: vết phong hủi
  rationale: צָרַעַת trong Lê-vi Ký có thể xuất hiện trên người, áo vải và đồ da, nên không thể đồng nhất đơn giản với bệnh Hansen hiện đại. “Vết bệnh” giữ nghĩa rộng trong chính văn, còn chú thích nêu thuật ngữ truyền thống và giới hạn của nó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xanh xanh” và “đo đỏ” để phản ánh hai dạng láy trong nguyên ngữ; dùng “sợi dọc, sợi ngang” thay cho thuật ngữ dệt may ít quen thuộc. Đại từ “vật ấy” được thêm để tiếng Việt rõ nghĩa trong mệnh đề cuối mà không xác định tác nhân vốn bị lược trong nguyên văn.
