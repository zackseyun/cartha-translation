review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển tải đầy đủ các chất liệu/đồ vật được liệt kê, các sắc màu xấp xỉ và nhận định rằng đây là một נגע צרעת. Tuy nhiên, động từ Hoph'al cuối câu là bị động, không nêu tác nhân; cách viết «phải đem vật ấy trình» thêm một hành động và một tác nhân hàm ẩn rõ hơn nguyên văn. Đổi sang «phải được trình cho thầy tế lễ» giữ được tính bị động vô nhân xưng của tiếng Hê-bơ-rơ.
  naturalness: «Xanh xanh», «đo đỏ», «sợi dọc», «sợi ngang» và «vật dụng bằng da» là tiếng Việt hiện đại, rõ nghĩa. Cấu trúc bị động «phải được trình» cũng tự nhiên trong văn phong quy định trang trọng.
  terminology: «Da thuộc» phân biệt đúng với da người; «vết bệnh» tránh đồng nhất צרעת với bệnh Hansen. Chú thích nên giữ cách nói thận trọng rằng đây là một phạm trù tình trạng/bệnh trạng trong Lê-vi Ký, không áp đặt một chẩn đoán y khoa hiện đại.
  issues:
  - severity: low
    issue: Mệnh đề cuối thêm tác nhân/hành động cụ thể
    rationale: «Phải đem vật ấy trình cho thầy tế lễ» diễn giải động từ bị động «phải được cho thấy/trình ra» thành hành động đem của một tác nhân ngầm. Dùng bị động trong tiếng Việt phản ánh sát hơn nguyên văn mà vẫn tự nhiên.
  revised_text: Nếu vết trên áo, trên da thuộc, trên sợi dọc hay sợi ngang, hoặc trên bất cứ vật dụng bằng da nào có màu xanh xanh hoặc đo đỏ, thì đó là vết bệnh[a]; vật ấy phải được trình cho thầy tế lễ.
