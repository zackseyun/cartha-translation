revisions:
- from: Thầy tế lễ phải xem xét. Nếu thấy trên da thịt họ có những đốm trắng nhạt, thì đó là ban trắng[a] phát ra trên da; người ấy thanh sạch.
  to: Thầy tế lễ phải xem xét; nếu thấy trên da thịt họ có những đốm trắng nhạt, thì đó là ban trắng[a] đã nổi lên trên da; người ấy thanh sạch.
  rationale: Chỉ thay “phát ra” bằng “đã nổi lên” để diễn đạt tự nhiên hơn động từ פָּרַח trong ngữ cảnh da liễu. Các lựa chọn khác giữ được sắc thái thủ tục và phán quyết thanh sạch theo pháp lễ của nguyên văn.
