id: LEV.13.39
reference: Leviticus 13:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֧ה בְ/עוֹר בְּשָׂרָ֛/ם בֶּהָרֹ֖ת כֵּה֣וֹת לְבָנֹ֑ת בֹּ֥הַק ה֛וּא פָּרַ֥ח בָּ/ע֖וֹר טָה֥וֹר הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: vi
  text: Thầy tế lễ phải xem xét; nếu thấy trên da thịt họ có những đốm trắng nhạt, thì đó là ban trắng[a] đã nổi lên trên da; người ấy thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một dạng phát ban” hoặc “đốm trên da”. Từ Hê-bơ-rơ chỉ một tình trạng da không gây ô uế, khác với tình trạng nghiêm trọng hơn được bàn đến trong chương này.
    reason: Nêu các khả năng dịch của thuật ngữ hiếm בֹּהַק mà không đồng nhất nó với một bệnh danh hiện đại.
lexical_decisions:
- source_word: וְרָאָה
  choice: phải xem xét
  rationale: Trong thủ tục kiểm tra của Lê-vi Ký 13, động từ ראה mang nghĩa xem xét, kiểm tra chứ không chỉ đơn thuần là nhìn thấy; “phải” diễn đạt tự nhiên sắc thái chỉ dẫn pháp lý.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi quen thuộc, rõ nghĩa đối với người thi hành việc kiểm tra và tuyên bố tình trạng thanh sạch trong đoạn này.
- source_word: וְהִנֵּה
  choice: nếu thấy
  rationale: Trong cấu trúc chẩn định của luật lệ, cụm này dẫn vào kết quả quan sát. “Nếu thấy” tự nhiên trong tiếng Việt và không làm thay đổi điều kiện được nêu.
- source_word: בְעוֹר בְּשָׂרָם
  choice: trên da thịt họ
  rationale: Giữ hình ảnh cụ thể của nguyên văn và hậu tố số nhiều, đồng thời là cách diễn đạt dễ hiểu trong tiếng Việt.
- source_word: בֶּהָרֹת
  choice: những đốm
  rationale: Chỉ các dấu hoặc mảng có thể nhìn thấy trên da; “đốm” phù hợp ngữ cảnh mà không gán một chẩn đoán y khoa hiện đại.
- source_word: כֵּהוֹת לְבָנֹת
  choice: trắng nhạt
  rationale: Diễn đạt màu trắng có độ sáng mờ hoặc nhạt, đối lập với những tổn thương trắng sáng hơn.
- source_word: בֹּהַק
  choice: ban trắng[a]
  rationale: Đây là thuật ngữ hiếm chỉ một tình trạng da không gây ô uế, khác với tình trạng nghiêm trọng đang được xem xét trong chương. “Ban trắng” ngắn gọn, tự nhiên; chú thích bảo tồn sự bất định từ vựng.
- source_word: פָּרַח
  choice: phát ra
  rationale: Động từ mô tả một tình trạng da nổi hoặc phát ra; cách dịch này giữ hình ảnh của nguyên văn mà vẫn tự nhiên.
- source_word: טָהוֹר הוּא
  choice: người ấy thanh sạch
  rationale: Giữ nguyên phán quyết pháp lễ là “thanh sạch”, không biến nó thành lời khẳng định về đạo đức hay sự khỏi bệnh.
theological_decisions:
- issue: Bản chất phán quyết của thầy tế lễ
  choice: Dịch טָהוֹר là “thanh sạch” theo phạm trù pháp lễ.
  alternative: “tinh sạch”, “không ô uế”, hoặc diễn giải là “không mắc bệnh”
  rationale: Ngữ cảnh nói về tình trạng thanh sạch theo luật Lê-vi, không phải phẩm chất đạo đức hay kết luận rằng người ấy hoàn toàn không có tình trạng da.
- issue: Ý nghĩa của בֹּהַק
  choice: Không thêm trực tiếp tính từ “vô hại” vào câu chính.
  alternative: “chứng phát ban vô hại”
  rationale: Phán quyết “thanh sạch” cho thấy tình trạng này không gây ô uế, nhưng nguyên từ בֹּהַק không tự nó xác định chính xác mức độ nguy hại về y khoa; tránh diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc thủ tục được diễn đạt tự nhiên bằng “phải xem xét” và “nếu thấy”; thuật ngữ pháp lễ “thanh sạch” được giữ nhất quán. Dấu chú thích [a] xuất hiện ngay sau từ cần giải thích.
