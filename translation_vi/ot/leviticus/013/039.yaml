  terminology: “Thầy tế lễ” và “thanh sạch” phù hợp với văn mạch pháp lễ. “Ban trắng” là cách chuyển ngắn gọn, không gán bệnh danh hiện đại; chú thích thích đáng nêu tính bất định của thuật ngữ hiếm בֹּהַק. Không nên thêm “vô hại” vào câu chính.
