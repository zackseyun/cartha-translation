  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: thầy tế lễ kiểm tra, các đốm trắng mờ trên da thịt, tình trạng בֹּהַק, và phán quyết pháp lễ rằng người ấy thanh sạch. Tuy nhiên, “ban trắng phát ra trên da” chưa chuyển tải tự nhiên động từ פָּרַח, vốn trong ngữ cảnh tổn thương da nói đến việc nổi lên/bộc phát trên da.'
