  source_fidelity: 'Bản nháp phản ánh đúng trình tự cơ bản: thầy tế lễ khám xét, quan sát chỗ bệnh đổi trắng, rồi ban phán quyết thanh sạch. Tuy nhiên, נֶגַע không nên dịch là “vết thương”, vốn thường chỉ thương tích do bị gây ra; đây là một dấu/vùng bệnh ngoài da không xác định chẩn đoán. Mệnh đề cuối có đại từ giống đực số ít, với quy chiếu không hoàn toàn chắc chắn giữa người được khám và “vết bệnh”; bản chính nên diễn đạt tình trạng của người, đồng thời chú thích lưu giữ khả năng quy chiếu về vết bệnh.'
  naturalness: “Khám người ấy” và “thầy tế lễ” tự nhiên, phù hợp văn phong trang trọng hiện đại. “Vết bệnh” tự nhiên và chính xác hơn “vết thương”. Cấu trúc “và kìa, ...” giữ được sắc thái quan sát của וְהִנֵּה mà không làm câu văn nặng nề.
