revisions:
- from: Thầy tế lễ sẽ khám người ấy[a], và nếu thấy vết thương đã chuyển sang màu trắng, thì thầy tế lễ sẽ tuyên bố vết thương là thanh sạch[b]; người ấy thanh sạch.[c]
  to: Thầy tế lễ sẽ khám người ấy[a], và kìa, vết bệnh đã chuyển sang màu trắng; thì thầy tế lễ sẽ tuyên bố vết bệnh là thanh sạch[b]; người ấy thanh sạch.[c]
  rationale: Đổi “vết thương” thành “vết bệnh” để tránh hàm ý thương tích không có trong từ Hê-bơ-rơ. Khôi phục lực quan sát của וְהִנֵּה bằng “và kìa”. Bản chính nêu kết quả thanh sạch của người được khám, là cách đọc tự nhiên trong công thức phán quyết; chú thích c bảo tồn khả năng quy chiếu ngữ pháp đến “vết bệnh”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:54Z'
