  text: וְ/רָאָ֨/הוּ֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נֶהְפַּ֥ךְ הַ/נֶּ֖גַע לְ/לָבָ֑ן וְ/טִהַ֧ר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע טָה֥וֹר הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: vi
  text: Thầy tế lễ sẽ khám người ấy[a], và kìa, vết bệnh đã chuyển sang màu trắng; thì thầy tế lễ sẽ tuyên bố vết bệnh là thanh sạch[b]; người ấy thanh sạch.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “khám người ấy/nó”; hậu tố giống đực số ít có thể, xét riêng về hình thức, chỉ người ấy hoặc đối tượng đang được xem xét. Trong bối cảnh này, thầy tế lễ khám người đến trình diện.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tuyên bố vết ấy sạch.” Đây là phán quyết về tình trạng thanh sạch theo nghi lễ, không phải việc chữa lành vết bệnh.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “thanh sạch là người ấy/nó.” Đại từ giống đực số ít có thể chỉ người được khám; về mặt ngữ pháp, cũng có thể chỉ “vết bệnh” gần nhất. Vì vậy cũng có thể hiểu: “vết bệnh ấy thanh sạch.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: sẽ khám người ấy
  rationale: Động từ ראה theo nghĩa đen là “thấy”, nhưng trong quy trình của Lê-vi Ký 13 mang nghĩa xem xét, khám xét. Hậu tố giống đực số ít có thể chỉ người đang được khám; tiếng Việt diễn đạt rõ là “người ấy”.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi tự nhiên, trang trọng và quen thuộc trong tiếng Việt đối với כֹּהֵן, chỉ người có thẩm quyền khám và đưa ra phán quyết về tình trạng thanh sạch.
- source_word: וְהִנֵּה
  choice: nếu thấy
  rationale: Trong mạch điều kiện của luật lệ, וְהִנֵּה giới thiệu kết quả quan sát. “Nếu thấy” truyền đạt tự nhiên chức năng này trong tiếng Việt mà không dùng lối cổ “kìa”.
- source_word: נֶהְפַּךְ
  choice: đã chuyển sang
  rationale: Dạng Niphal diễn tả sự thay đổi trạng thái; “đã chuyển sang” phù hợp tự nhiên với sự đổi màu.
- source_word: הַנֶּגַע
  choice: vết thương
  rationale: נֶגַע chỉ vùng tổn thương hữu hình đang được thầy tế lễ xem xét, không xác định một chẩn đoán y khoa hiện đại. “Vết thương” dễ hiểu, dù các khả năng như “tổn thương” hay “vết bệnh” vẫn có thể dùng.
- source_word: לְלָבָן
  choice: màu trắng
  rationale: Diễn đạt trực tiếp màu sắc của vết thương sau khi thay đổi.
- source_word: וְטִהַר
  choice: sẽ tuyên bố ... là thanh sạch
  rationale: Trong bối cảnh này, thầy tế lễ đưa ra phán quyết về tình trạng thanh sạch theo nghi lễ, chứ không chữa lành hay làm cho vết thương sạch về mặt y khoa.
- source_word: טָהוֹר הוּא
  choice: người ấy thanh sạch
  rationale: Đại từ הוּא là giống đực số ít và có thể quy chiếu về người được khám. Câu kết nêu tình trạng thanh sạch của người ấy; chú thích giữ lại khả năng hiểu theo danh từ נֶגַע giống đực gần nhất.
theological_decisions:
- issue: Bản chất hành động của thầy tế lễ trong luật thanh sạch
  choice: Thầy tế lễ tuyên bố vết thương là thanh sạch
  alternative: Thầy tế lễ làm cho vết thương thanh sạch
  rationale: Trong Lê-vi Ký 13, טהר ở dạng Piel trong công thức phán quyết chỉ việc xác nhận hoặc tuyên bố tình trạng nghi lễ sau khi khám, không hàm ý thầy tế lễ chữa trị hay tạo ra sự thanh sạch.
- issue: Đối tượng của mệnh đề טָהוֹר הוּא
  choice: Người ấy thanh sạch
  alternative: Vết ấy thanh sạch
  rationale: Cả người được khám và נֶגַע đều có thể phù hợp với đại từ giống đực số ít. Ngữ cảnh rộng hơn hướng đến phán quyết về tình trạng của người, nhưng sự gần kề ngữ pháp của “vết thương” tạo ra một khả năng thực sự cần được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” và “thanh sạch” để duy trì sắc thái luật nghi lễ; tránh thuật ngữ chẩn đoán y khoa hiện đại. Cấu trúc “nếu thấy ... thì” diễn đạt tự nhiên quan hệ quan sát–phán quyết của câu Hê-bơ-rơ.
