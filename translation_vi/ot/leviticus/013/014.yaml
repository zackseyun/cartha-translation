- from: Nhưng vào ngày thịt sống xuất hiện trong đó, người ấy sẽ bị ô uế.
  to: Nhưng vào ngày thịt sống xuất hiện trên người ấy, người ấy sẽ bị ô uế.
  rationale: Sửa duy nhất sở chỉ của đại từ cho phù hợp với nguyên văn Hê-bơ-rơ và cách diễn đạt tự nhiên của tiếng Việt. Giữ nguyên tính chất không giải thích thêm của “bị ô uế” và giữ “thịt sống” để bảo toàn thuật ngữ của câu.
