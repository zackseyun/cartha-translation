review_pass:
  verdict: revise
  source_fidelity: Cần sửa sở chỉ của בּוֹ. Trong câu Hê-bơ-rơ, đại từ giống đực số ít này quy về người đang được khám, nên ý là thịt sống xuất hiện «trên/trong người ấy», không phải «trong đó» (một vùng tổn thương trung tính). Bản tiếng Anh audit dùng “in it” không phản ánh rõ ngữ pháp và ngữ cảnh của tiếng Hê-bơ-rơ; bản dịch cần ưu tiên nguồn gốc.
  naturalness: “Trong đó” vừa mơ hồ vừa không tự nhiên trong tiếng Việt khi nói về thịt sống xuất hiện. “Trên người ấy” tự nhiên hơn và diễn đạt đúng bối cảnh khám da. Cấu trúc “vào ngày” giữ được sắc thái thời điểm của בְּיוֹם, dù hơi trang trọng.
  terminology: “Thịt sống” có thể giữ, vì sát cụm בָּשָׂר חַי và phù hợp thuật ngữ ngữ cảnh. “Bị ô uế” truyền đạt đúng phán quyết tình trạng của יִטְמָא mà không thêm diễn giải nghi lễ vào chính văn.
  issues:
  - severity: medium
    issue: “trong đó” dịch sai hoặc làm lệch sở chỉ của בּוֹ.
    rationale: בּוֹ là đại từ giống đực số ít, trong ngữ cảnh quy về người mắc bệnh đang được kiểm tra. Tiếng Việt nên nói thịt sống xuất hiện “trên người ấy”, không phải trong một đối tượng/vết thương được gọi là “đó”.
  revised_text: Nhưng vào ngày thịt sống xuất hiện trên người ấy, người ấy sẽ bị ô uế.
