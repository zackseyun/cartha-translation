  text: וּ/בְ/י֨וֹם הֵרָא֥וֹת בּ֛/וֹ בָּשָׂ֥ר חַ֖י יִטְמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/014.yaml
  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: vi
  text: Nhưng vào ngày thịt sống xuất hiện trên người ấy, người ấy sẽ bị ô uế.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּשָׂר חַי
  choice: thịt sống
  rationale: Dịch sát cụm Hê-bơ-rơ chỉ phần thịt còn sống hoặc thịt tươi lộ ra, đồng thời giữ liên hệ thuật ngữ với chẩn đoán ở câu trước.
- source_word: בּוֹ
  choice: trong đó
  rationale: Giữ sở chỉ trung tính của đại từ Hê-bơ-rơ, phù hợp với vùng tổn thương được nói đến trong ngữ cảnh, thay vì đổi thành “trên người ấy”.
- source_word: יִטְמָא
  choice: người ấy sẽ bị ô uế
  rationale: Diễn đạt trạng thái ô uế theo nghi lễ bằng tiếng Việt tự nhiên; chủ thể là người đang được khám, được suy ra từ ngữ cảnh.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: Dùng “bị ô uế” mà không thêm “về nghi lễ”.
  alternative: “sẽ bị ô uế về nghi lễ”
  rationale: Nguyên văn chỉ nói người ấy là ô uế; không nên đưa phần giải thích thần học vào chính văn, dù ngữ cảnh luật tế lễ cho thấy đây là tình trạng ô uế theo nghi lễ.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Giữ cấu trúc điều kiện theo thời điểm của nguyên văn; “vào ngày” được giữ để phản ánh בְיוֹם, dù trong tiếng Việt cũng có thể diễn đạt thoáng hơn là “khi”.
