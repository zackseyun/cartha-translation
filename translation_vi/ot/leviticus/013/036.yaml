source:
  edition: WLC
  text: וְ/רָאָ֨/הוּ֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖תֶק בָּ/ע֑וֹר לֹֽא יְבַקֵּ֧ר הַ/כֹּהֵ֛ן לַ/שֵּׂעָ֥ר הַ/צָּהֹ֖ב טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: vi
  text: Nếu thầy tế lễ khám người ấy và thấy vết lở có vảy[a] đã lan trên da, thì không cần kiểm tra xem có lông vàng hay không; người ấy bị ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chứng ngứa” hoặc “chứng vảy lở”. Từ Hê-bơ-rơ chỉ một thương tổn da đặc biệt, trong ngữ cảnh này thường ở đầu hoặc vùng râu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ הַכֹּהֵן
  choice: Nếu thầy tế lễ khám người ấy
  rationale: Trong bối cảnh luật lệ về việc thẩm định bệnh trạng, ראה mang nghĩa khám xét chứ không chỉ nhìn thấy. Quan hệ điều kiện từ mạch văn được diễn đạt tự nhiên bằng “Nếu”.
- source_word: וְהִנֵּה
  choice: và thấy
  rationale: Hạt từ này hướng sự chú ý đến điều được quan sát. “Và thấy” giữ chức năng ấy trong tiếng Việt tự nhiên hơn lối dịch sát chữ “này” hoặc “kìa”.
- source_word: פָּשָׂה
  choice: đã lan
  rationale: Diễn tả thương tổn đã lan rộng, phù hợp với cách dùng nhất quán trong các quy định chẩn định ở Lê-vi Ký 13.
- source_word: הַנֶּתֶק
  choice: chứng lở da đầu hoặc râu
  rationale: נֶתֶק là một dạng thương tổn đặc thù ở vùng đầu hoặc râu theo ngữ cảnh gần (13:29–37). Cách dịch này rõ nghĩa, không đồng nhất nó với một bệnh hiện đại cụ thể; chú thích bảo lưu khả năng diễn đạt khác.
- source_word: בָּעוֹר
  choice: trên da
  rationale: Tiếng Việt tự nhiên nói một vết hoặc chứng lở lan “trên da”; cách diễn đạt này truyền đạt đúng quan hệ vị trí của giới từ Hebrew.
- source_word: לֹא יְבַקֵּר הַכֹּהֵן לַשֵּׂעָר הַצָּהֹב
  choice: thầy tế lễ không cần tìm xem có lông vàng hay không
  rationale: בקר ở đây là kiểm tra hoặc tìm dấu hiệu chẩn định. Khi thương tổn đã lan, dấu hiệu lông vàng không còn cần được kiểm tra để xác lập tình trạng.
- source_word: טָמֵא הוּא
  choice: người ấy bị ô uế
  rationale: Chủ thể là người được khám. “Bị ô uế” diễn tả tình trạng ô uế theo nghi lễ, không hàm ý người ấy phạm tội luân lý.
theological_decisions:
- issue: Ý nghĩa của טָמֵא trong luật thanh sạch Lê-vi
  choice: bị ô uế
  alternative: không thanh sạch; bị nhiễm uế
  rationale: Trong chương này, từ ngữ chỉ địa vị ô uế theo nghi lễ trong cộng đồng giao ước, chứ không tự nó quy kết tội lỗi đạo đức. “Bị ô uế” là cách nói quen thuộc, trang trọng và rõ ràng trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo ngôn ngữ Kinh Thánh Việt ngữ quen thuộc; tránh gọi thương tổn bằng tên một bệnh hiện đại vì từ Hê-bơ-rơ không cho phép xác định chắc chắn như vậy.
