revisions:
- from: Nếu thầy tế lễ khám người ấy và thấy chứng lở da đầu hoặc râu[a] đã lan trên da, thì thầy tế lễ không cần tìm xem có lông vàng hay không; người ấy bị ô uế.
  to: Nếu thầy tế lễ khám người ấy và thấy vết lở có vảy[a] đã lan trên da, thì không cần kiểm tra xem có lông vàng hay không; người ấy bị ô uế.
  rationale: Sửa cách dịch נתק để bản văn không xác định vị trí của thương tổn vượt quá điều câu này nói, đồng thời giữ thông tin ngữ cảnh và các khả năng từ vựng trong chú thích. Các yếu tố còn lại của bản nháp phù hợp với tiếng Hê-bơ-rơ và cách dùng tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
