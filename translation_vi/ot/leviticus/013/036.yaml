review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc điều kiện, sự khám xét của thầy tế lễ, việc thương tổn lan rộng, sự không cần kiểm tra dấu hiệu lông vàng, và kết luận về tình trạng ô uế nghi lễ. Tuy nhiên, “chứng lở da đầu hoặc râu” đưa các vị trí thường gặp của נתק vào ngay bản văn, trong khi câu này chỉ nói thương tổn lan “trên da”; cụm “da đầu hoặc râu” cũng không tự nhiên vì râu không phải là một vị trí giải phẫu song song với da đầu.
  naturalness: “Khám người ấy” và “bị ô uế” tự nhiên trong văn phong Kinh Thánh hiện đại. “Vết lở có vảy” là cách gọi dễ hiểu, không gán một chẩn đoán y khoa hiện đại, và câu được giản lược mạch lạc bằng việc không lặp lại “thầy tế lễ” ở vế sau.
  terminology: Giữ “thầy tế lễ” và “bị ô uế” phù hợp register và nghĩa nghi lễ của טָמֵא. Dùng “vết lở có vảy” cho נתק, kèm chú thích về nghĩa thay thế và phạm vi thường gặp ở đầu hoặc vùng râu, tránh biến chi tiết ngữ cảnh thành nội dung trực tiếp của câu.
  issues:
  - severity: medium
    issue: Cụm “chứng lở da đầu hoặc râu” đã đưa giới hạn vị trí vào bản văn.
    rationale: Trong tiếng Hê-bơ-rơ, הַנֶּתֶק là tên thương tổn; câu này nói nó lan בָּעוֹר (“trên/trong da”). Bối cảnh trước đó liên hệ thương tổn này với đầu hoặc vùng râu, nhưng điều đó nên để ở chú thích thay vì diễn đạt như thành phần trực tiếp của câu.
  - severity: low
    issue: “Da đầu hoặc râu” không song hành tự nhiên.
    rationale: “Da đầu” là vùng da, còn “râu” là lông; “vùng râu” sẽ chính xác và tự nhiên hơn nếu nêu trong chú thích.
  revised_text: Nếu thầy tế lễ khám người ấy và thấy vết lở có vảy[a] đã lan trên da, thì không cần kiểm tra xem có lông vàng hay không; người ấy bị ô uế.
