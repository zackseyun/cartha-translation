source:
  edition: WLC
  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: vi
  text: Người đàn ông ấy mắc bệnh ngoài da[a]; người ấy ô uế. Thầy tế lễ phải tuyên bố dứt khoát rằng người ấy ô uế; vết bệnh của người ấy ở trên đầu người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo truyền thống, cụm này thường được dịch là “người mắc bệnh phong”. Từ Hê-bơ-rơ chỉ tình trạng ngoài da được xét đến trong chương này, không nhất thiết đồng nhất với bệnh phong Hansen theo y học hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ צָרוּעַ
  choice: người mắc bệnh ngoài da
  rationale: Diễn đạt tự nhiên tình trạng được mô tả trong chương mà không đồng nhất nó với bệnh phong Hansen theo y học hiện đại; אִישׁ trong tình huống luật lệ này chỉ một cá nhân nam, nhưng tiếng Việt không cần lặp từ chỉ giới tính để diễn đạt chính xác.
- source_word: טָמֵא הוּא
  choice: người ấy là ô uế
  rationale: “Ô uế” là cách dùng quen thuộc và chính xác cho tình trạng không thanh sạch về nghi lễ trong sách Lê-vi.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: phải tuyên bố người ấy là ô uế
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính dứt khoát. Trong bối cảnh chẩn định của tư tế, thầy tế lễ công bố tình trạng chứ không gây ra sự ô uế.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Thuật ngữ tiếng Việt phổ thông, trang trọng dành cho chức viên phụ trách việc khám xét và công bố theo luật nghi lễ.
- source_word: בְּרֹאשׁוֹ
  choice: ở trên đầu
  rationale: Giữ sát chỉ vị trí đơn giản của tiếng Hê-bơ-rơ, không tự ý thu hẹp thành “da đầu” dù văn cảnh có liên quan đến đầu.
- source_word: נִגְעוֹ
  choice: tổn thương của người ấy
  rationale: נֶגַע trong Lê-vi 13 có thể chỉ dấu tổn thương hay chứng bệnh được khám xét. “Tổn thương” phù hợp với biểu hiện tại chỗ trên đầu và tránh sắc thái dịch bệnh của “tai họa”.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: Dịch là “ô uế” và dùng “tuyên bố” để thể hiện sự phân loại nghi lễ của thầy tế lễ.
  alternative: “không thanh sạch” hoặc “làm cho người ấy thành ô uế”
  rationale: Văn cảnh thuộc luật nghi lễ; động từ ở đây nói đến việc thầy tế lễ xác nhận chính thức tình trạng đã được nhận diện, không khẳng định rằng ông tạo ra tình trạng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại nhấn mạnh của nguyên văn ở hai mệnh đề đầu; dùng thuật ngữ nghi lễ “ô uế” và tránh chẩn đoán y khoa quá cụ thể.
