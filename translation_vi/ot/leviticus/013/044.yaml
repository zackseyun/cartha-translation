revisions:
- from: Người ấy là người mắc bệnh ngoài da; người ấy là ô uế.[a] Thầy tế lễ phải tuyên bố người ấy là ô uế; tổn thương của người ấy ở trên đầu.
  to: Người đàn ông ấy mắc bệnh ngoài da[a]; người ấy ô uế. Thầy tế lễ phải tuyên bố dứt khoát rằng người ấy ô uế; vết bệnh của người ấy ở trên đầu người ấy.
  rationale: 'Bản sửa giữ sát nguyên văn Hê-bơ-rơ: nêu rõ người nam, bảo lưu tình trạng ô uế theo nghi lễ, biểu đạt tính nhấn mạnh của lời tuyên bố tư tế, và dịch נִגְעוֹ là “vết bệnh”. Đồng thời, chuyển ký hiệu chú thích đến đúng thuật ngữ mà chú thích giải thích.'
  reviewer_model: gpt-5.6-terra
