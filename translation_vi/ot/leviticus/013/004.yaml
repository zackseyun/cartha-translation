revisions:
- from: Nhưng nếu đốm sáng trên da thịt người ấy có màu trắng[a], trông không sâu hơn da, và lông tại đó chưa chuyển sang màu trắng, thì thầy tế lễ phải cho cách ly trường hợp có vùng tổn thương ấy[b] trong bảy ngày.
  to: Nhưng nếu đốm sáng trên da thịt người ấy có màu trắng[a], trông không có vẻ sâu hơn da, và lông trên đó chưa chuyển sang màu trắng, thì thầy tế lễ phải cho người ấy cách ly vì vết tổn thương ấy[b] trong bảy ngày.
  rationale: Sửa câu cuối để tiếng Việt tự nhiên hơn và làm rõ người là đối tượng thực tế của việc cách ly, trong khi chú thích bảo lưu đối tượng ngữ pháp là “vết tổn thương” trong tiếng Hê-bơ-rơ. Đồng thời thêm “có vẻ” để phản ánh tiêu chí thị giác của nguyên văn.
