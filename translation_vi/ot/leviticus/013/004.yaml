review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung truyền đạt đúng các tiêu chí quan sát: một đốm sáng trắng, không có vẻ sâu hơn da, lông trên đó chưa hóa trắng, và thời gian bảy ngày. Tuy nhiên, đối tượng trực tiếp của động từ וְהִסְגִּיר là הַנֶּגַע (“vết/vùng tổn thương”), không phải “trường hợp có vùng tổn thương ấy”; tiếng Việt có thể diễn đạt tự nhiên rằng thầy tế lễ cho người ấy cách ly, đồng thời giữ rõ căn cứ là vết tổn thương.'
  naturalness: “Trông không sâu hơn da” tự nhiên nhưng hơi khẩu ngữ và thiếu chủ thể rõ ràng. “Trông không có vẻ sâu hơn da” phản ánh chính xác sắc thái quan sát của מַרְאֶה. Cụm “phải cho cách ly trường hợp có vùng tổn thương ấy” nặng và không tự nhiên trong văn xuôi tiếng Việt hiện đại.
  terminology: “Đốm sáng”, “da thịt”, “lông”, và “thầy tế lễ” phù hợp. Nên dùng “vết tổn thương ấy” thay cho cách diễn đạt hành chính “trường hợp có vùng tổn thương ấy”. Việc nói người ấy được cách ly cần một chú thích để minh định rằng tiếng Hê-bơ-rơ nêu “vết tổn thương” làm đối tượng ngữ pháp.
  issues:
  - severity: medium
    issue: Cụm “cho cách ly trường hợp có vùng tổn thương ấy” chuyển đối tượng của mệnh đề sang một “trường hợp” trừu tượng.
    rationale: Nguyên văn nói “thầy tế lễ sẽ cách ly vết tổn thương” (אֶת־הַנֶּגַע). Trong thực hành, người mang vết ấy được tách riêng, nhưng bản dịch nên không biến thuật ngữ nguồn thành một khái niệm hành chính khó hiểu.
  - severity: low
    issue: “Trông không sâu hơn da” chưa diễn đạt đầy đủ sắc thái vẻ bề ngoài của מַרְאֶה.
    rationale: “Trông không có vẻ sâu hơn da” rõ chủ thể và bảo lưu tính quan sát, không khẳng định độ sâu thực thể.
