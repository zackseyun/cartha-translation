  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: vi
  text: Nhưng nếu đốm sáng trên da thịt người ấy có màu trắng[a], trông không có vẻ sâu hơn da, và lông trên đó chưa chuyển sang màu trắng, thì thầy tế lễ phải cho người ấy cách ly vì vết tổn thương ấy[b] trong bảy ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mảng sáng” hoặc “đốm bóng sáng”; từ Hê-bơ-rơ chỉ một dấu trên da có vẻ sáng hay trắng.
    reason: lexical_alternative
  - marker: b
    text: 'Theo mặt chữ: “cách ly vết tổn thương ấy”. Trong quy trình này, người có vết tổn thương được tách riêng tạm thời để theo dõi.'
    reason: source_clarity
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: đốm sáng
  rationale: Danh từ này chỉ một dấu hoặc vùng tổn thương trên da có vẻ sáng hay trắng. “Đốm sáng” tự nhiên trong tiếng Việt và phân biệt với thuật ngữ chỉ chỗ sưng ở câu trước.
- source_word: לְבָנָה
  choice: có màu trắng
  rationale: Tính từ diễn tả trực tiếp màu sắc của đốm; cách nói này rõ ràng và tự nhiên.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: trên da thịt người ấy
  rationale: Giữ được cách diễn đạt cụ thể của tiếng Hê-bơ-rơ, trong đó “thịt” nói đến thân thể, đồng thời dùng giới từ tự nhiên trong tiếng Việt khi nói về dấu hiệu trên da.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן־הָעוֹר
  choice: trông không sâu hơn da
  rationale: Diễn đạt tiêu chí quan sát bằng mắt về độ sâu tương đối của tổn thương mà không biến nhận xét này thành một chẩn đoán y khoa hiện đại.
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: lông tại đó chưa chuyển sang màu trắng
  rationale: Đại từ sở hữu tiếng Hê-bơ-rơ quy chiếu đến đốm; “lông tại đó” rõ nghĩa hơn “lông của nó” trong tiếng Việt và vẫn giữ ý về sự thay đổi màu.
- source_word: וְהִסְגִּיר
  choice: phải cho cách ly
  rationale: Động từ chỉ việc đặt trường hợp này trong tình trạng tách riêng tạm thời để theo dõi. “Cho cách ly” truyền đạt chức năng thủ tục tốt hơn cách dịch sát chữ là “đóng lại”.
- source_word: אֶת־הַנֶּגַע
  choice: trường hợp có vùng tổn thương ấy
  rationale: Tân ngữ theo mặt chữ là “vùng tổn thương”, nhưng trong ngữ cảnh hành động cách ly được áp dụng cho trường hợp hoặc người mang tổn thương. Cách dịch này vừa có nghĩa tự nhiên vừa tránh khẳng định đó là một bệnh đã được chẩn đoán.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Cách diễn đạt thời lượng thông dụng và chính xác trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” cho הַכֹּהֵן, phù hợp bối cảnh chức vụ tư tế trong Lê-vi Ký; tránh thuật ngữ chẩn đoán hiện đại và giữ tính quan sát của quy trình.
