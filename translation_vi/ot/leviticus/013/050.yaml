  yaml_path: translation/ot/leviticus/013/050.yaml
  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: vi
  text: Thầy tế lễ sẽ xem xét vết đó[a] và cách ly vật có vết đó bảy ngày[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dấu”, “chỗ bị ảnh hưởng” hoặc, theo lối truyền thống, “vết bệnh”. Từ Hê-bơ-rơ chỉ dấu hoặc vết đang được thầy tế lễ xem xét, không nhất thiết là một bệnh danh hiện đại cụ thể.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa sát hơn là “đóng lại” hoặc “để riêng”; ở đây nói đến việc tạm thời để riêng vật có vết đó để theo dõi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רָאָה
  choice: phải xem xét
  rationale: Động từ ראה vốn có nghĩa là “thấy, nhìn”, nhưng trong thủ tục của Lê-vi Ký 13, nó chỉ việc thầy tế lễ chính thức kiểm tra; “xem xét” vừa tự nhiên vừa giữ được sắc thái thủ tục.
- source_word: הַ/כֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt đối với כֹּהֵן; mạo từ xác định được thể hiện theo ngữ cảnh.
- source_word: הַ/נָּגַע / הַ/נֶּגַע
  choice: vùng bị tổn hại
  rationale: נגע ở đây chỉ dấu hoặc vùng bị ảnh hưởng đang được kiểm tra, không nhất thiết tương ứng với một bệnh danh hiện đại. Cùng một cách dịch được giữ ở cả hai lần xuất hiện.
- source_word: וְ/הִסְגִּיר
  choice: rồi cách ly
  rationale: Dạng Hiphil của סגר có nghĩa là đóng lại hoặc cô lập để theo dõi. “Cách ly” truyền đạt rõ mục đích tạm thời mà không áp đặt một chẩn đoán y khoa hiện đại.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Cách diễn đạt thời lượng tự nhiên trong tiếng Việt và tương ứng trực tiếp với cụm từ Hê-bơ-rơ.
