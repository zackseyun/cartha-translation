revisions:
- from: Thầy tế lễ phải xem xét vùng bị tổn hại[a], rồi cách ly vùng bị tổn hại ấy trong bảy ngày[b].
  to: Thầy tế lễ sẽ xem xét vết đó[a] và cách ly vật có vết đó bảy ngày[b].
  rationale: Đổi cách gọi của נגע thành «vết» để giữ tính không đặc hiệu và phù hợp với vết trên y phục trong ngữ cảnh. Làm rõ đối tượng được để riêng bằng «vật có vết đó», là cách diễn đạt tiếng Việt tự nhiên cho phép hoán dụ của tiếng Hê-bơ-rơ. Chỉnh chú thích để tránh phương án «tai họa» gây sai lệch nghĩa trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:47:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng hành động xem xét và thời hạn bảy ngày. Tuy nhiên, נגע trong ngữ cảnh trực tiếp là dấu/vết được thầy tế lễ kiểm tra (trong đoạn này là trên một vật, cụ thể là y phục), không phải một «vùng bị tổn hại» theo nghĩa tổn thương. Hơn nữa, đối tượng của hành động הסגיר được diễn đạt theo hoán dụ: vật mang vết ấy được để riêng để quan sát; tiếng Việt cần làm rõ điều này để tránh ý nghĩa khó hiểu là cách ly một vùng.'
  naturalness: «Thầy tế lễ sẽ xem xét...» là tự nhiên, trang trọng và phù hợp hơn «phải» ở đây, vì hình thức động từ tiếng Hê-bơ-rơ có thể mang sắc thái quy định trong văn luật nhưng không cần thêm một tình thái từ bắt buộc trong từng câu. «Cách ly vật có vết đó» tự nhiên và rõ nghĩa hơn «cách ly vùng bị tổn hại ấy».
  terminology: Dùng «vết» giữ tính không đặc hiệu của נגע và dùng được trong ngữ cảnh vết trên y phục, không áp đặt một chẩn đoán hiện đại. Tránh «tai họa», vì từ này trong tiếng Việt hiện đại chủ yếu chỉ một biến cố thảm khốc chứ không phải dấu/vết được kiểm tra. «Thầy tế lễ» và «cách ly» phù hợp.
  issues:
  - severity: medium
    issue: «vùng bị tổn hại» không phản ánh chính xác và tự nhiên ngữ cảnh của נגע.
    rationale: Cụm này gợi một vùng cơ thể bị chấn thương, trong khi נגע là dấu/vết bị ảnh hưởng đang được kiểm tra và, trong ngữ cảnh đoạn văn, xuất hiện trên y phục/vật liệu.
  - severity: medium
    issue: «cách ly vùng bị tổn hại ấy» gây mơ hồ về đối tượng bị cách ly.
    rationale: Hành động הסגיר trong văn cảnh được thực hiện bằng cách để riêng vật mang vết đó để quan sát. Nêu rõ «vật có vết đó» diễn đạt hoán dụ Hê-bơ-rơ một cách thành ngữ trong tiếng Việt mà không đổi nghĩa.
  - severity: low
    issue: Chú thích a dùng «tai họa» như một phương án truyền thống.
    rationale: «Tai họa» không còn là một tương đương từ vựng thích hợp trong tiếng Việt hiện đại cho dấu/vết nghi lễ đang được kiểm tra.
  revised_text: Thầy tế lễ sẽ xem xét vết đó[a] và cách ly vật có vết đó bảy ngày[b].
