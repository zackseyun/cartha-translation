translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phải” cho sắc thái quy định của chuỗi động từ trong luật nghi lễ; tránh thuật ngữ y khoa quá chuyên biệt. Các dấu chú thích được đặt ngay sau những cụm từ liên quan.
