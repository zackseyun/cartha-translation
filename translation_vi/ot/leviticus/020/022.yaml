id: LEV.20.22
reference: Leviticus 20:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: vi
  text: Vậy, các ngươi phải tuân giữ mọi luật lệ và mọi phán quyết của ta[a], rồi thi hành chúng, để xứ mà ta đang đưa các ngươi đến cư ngụ không nôn các ngươi ra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “mọi quy định và mọi luật lệ của ta.” Tiếng Hê-bơ-rơ dùng hai thuật ngữ pháp lý khác nhau: חֻקּוֹת và מִשְׁפָּטִים.'
    reason: lexical_alternative
  - marker: b
    text: Hay “mửa các ngươi ra.” Động từ Hê-bơ-rơ có nghĩa đen là “nôn, mửa,” một hình ảnh sống động diễn tả xứ trục xuất những cư dân làm ô uế nó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vậy, các ngươi phải tuân giữ
  rationale: שׁמר trong văn cảnh giao ước và luật pháp có nghĩa là tuân giữ, gìn giữ để làm theo. “Phải tuân giữ” truyền đạt rõ sức mệnh lệnh; “Vậy” nối câu này với lời cảnh báo trước đó.
- source_word: חֻקֹּתַי
  choice: mọi luật lệ của ta
  rationale: חֻקָּה chỉ những điều được ấn định hoặc ban hành. “Luật lệ” tự nhiên trong tiếng Việt hiện đại và vẫn phân biệt được với מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: mọi phán quyết của ta
  rationale: מִשְׁפָּט có thể chỉ phán quyết, quy định pháp lý hoặc sự xét xử. “Phán quyết” giữ sắc thái pháp lý và không đồng nhất với חֻקּוֹת.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: rồi thi hành chúng
  rationale: עשה khi đi với các điều luật có nghĩa là thực hiện hoặc thi hành. “Thi hành” rõ nghĩa và tự nhiên hơn cách dịch máy móc “làm chúng”.
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: không nôn các ngươi ra
  rationale: קיא có nghĩa đen là nôn hoặc mửa. Giữ nguyên hình ảnh mạnh về xứ trục xuất những cư dân làm ô uế nó, thay vì làm nhẹ thành “không loại bỏ”.
- source_word: הָאָרֶץ
  choice: xứ
  rationale: Ở đây אֶרֶץ chỉ miền đất mà Đức Chúa Trời đưa dân đến. “Xứ” phù hợp văn cảnh địa lý và có sắc thái trang trọng vừa phải.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: mà ta đang đưa các ngươi đến
  rationale: Phân từ מֵבִיא diễn tả hành động Đức Chúa Trời đang thực hiện; “đang đưa” giữ nét tiếp diễn ấy. Trạng từ שָׁמָּה được diễn đạt tự nhiên bằng “đến”.
- source_word: לָשֶׁבֶת בָּהּ
  choice: cư ngụ
  rationale: ישׁב ở đây mang nghĩa sống hoặc định cư trong xứ. “Cư ngụ” trang trọng, dễ hiểu và gọn, không cần lặp đại từ “trong đó” sau cấu trúc tiếng Việt “đưa ... đến cư ngụ”.
theological_decisions:
- issue: Hình ảnh xứ nôn dân cư ra như một lời cảnh báo giao ước
  choice: 'Giữ phép nhân hóa: “xứ ... không nôn các ngươi ra.”'
  alternative: “xứ ... không xua đuổi các ngươi” hoặc “không loại bỏ các ngươi”
  rationale: Nguyên văn dùng động từ cụ thể קיא, nhân hóa xứ như một cơ thể nôn ra điều làm nó ô uế. Giữ hình ảnh này bảo toàn sức nặng của lời cảnh báo mà không giải thích thay cho bản văn.
- issue: Sự phân biệt giữa חֻקּוֹת và מִשְׁפָּטִים
  choice: Dịch bằng hai thuật ngữ “luật lệ” và “phán quyết.”
  alternative: “mệnh lệnh” và “quy định,” hoặc gộp chung thành “luật pháp”
  rationale: Nguyên văn dùng hai danh từ pháp lý khác nhau. Hai cách dịch riêng giữ được kết cấu và sắc thái pháp lý, dù phạm vi ý nghĩa của chúng có phần chồng lấn.
- issue: Quan hệ giữa việc vâng giữ và việc không bị xứ nôn ra
  choice: Dùng “để ... không,” giữ sắc thái mục đích hoặc kết quả của וְלֹא sau mệnh lệnh.
  alternative: “nếu không, xứ sẽ nôn các ngươi ra”
  rationale: Bản văn liên kết trực tiếp việc tuân giữ với việc không bị trục xuất nhưng không trình bày thành một câu điều kiện minh nhiên. Cách dịch không thêm điều kiện mà nguyên văn không nói rõ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “các ngươi” để phản ánh lời phán trực tiếp với toàn dân và dùng “ta” cho lời của Đức Chúa Trời. Câu giữ cấu trúc mệnh lệnh dẫn đến mục đích/kết quả, đồng thời bảo toàn phép ẩn dụ mạnh “xứ nôn ... ra.”
