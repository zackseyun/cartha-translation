  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: vi
  text: Nhưng nếu dân trong xứ cố tình nhắm mắt làm ngơ trước người ấy khi người ấy đem một phần con cái mình dâng cho Mô-léc[a], để không xử tử người ấy,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mô-léc có thể là tên một thần hoặc tên gọi một nghi thức hiến tế trẻ em; một cách đọc khác là “vua”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: cố tình nhắm mắt làm ngơ
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động; thành ngữ có nghĩa là cố ý không nhìn nhận hoặc không can thiệp. Cách dịch này vừa giữ hình ảnh về mắt vừa tự nhiên trong tiếng Việt.
- source_word: עַם הָאָרֶץ
  choice: dân trong xứ
  rationale: Trong văn cảnh luật pháp, cụm từ chỉ dân chúng thuộc cộng đồng/xứ, không nhất thiết chỉ một tầng lớp xã hội.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: nhắm mắt làm ngơ trước người ấy
  rationale: Tiếng Hê-bơ-rơ nói sát là “giấu mắt khỏi người ấy”, một thành ngữ chỉ việc cố tình phớt lờ và không hành động chống lại người đó.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: khi hắn dâng một phần con cái mình
  rationale: Giới từ מִן mang nghĩa phân chia, chỉ một phần trong số dòng dõi/con cái của người ấy. “Con cái” diễn đạt rõ đối tượng trong văn cảnh này.
- source_word: לַמֹּלֶךְ
  choice: cho Mô-léc
  rationale: Phiên âm danh xưng cultic theo cách quen thuộc, không diễn giải thêm bản chất của Mô-léc trong chính câu.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: để khỏi xử tử hắn
  rationale: 'Cụm từ diễn tả mục đích hoặc kết quả của việc làm ngơ: người phạm tội không bị thi hành án tử hình. “Xử tử” phù hợp văn cảnh pháp lý.'
theological_decisions:
- issue: Cách hiểu לַמֹּלֶךְ
  choice: Mô-léc
  alternative: vua
  rationale: Dù về mặt phụ âm có thể liên hệ với cách đọc “vua”, văn cảnh Lê-vi Ký 18:21 và 20:2–5 ủng hộ mạnh việc hiểu đây là tên hoặc danh xưng của đối tượng thờ cúng bị cấm. Phiên âm giữ nguyên danh xưng mà không áp đặt một cách giải thích về bản chất của nó.
translation_notes:
  register: Văn phong pháp luật trang nghiêm nhưng hiện đại. “Cố tình nhắm mắt làm ngơ” giữ cả sắc thái chủ ý, sức nhấn mạnh và hình ảnh của thành ngữ Hê-bơ-rơ. Đại từ “hắn” phân biệt rõ người phạm tội với cộng đồng, phù hợp sắc thái kết án trong ngữ cảnh.
