revisions:
- from: Nhưng nếu dân trong xứ cố tình nhắm mắt làm ngơ trước người ấy khi hắn dâng một phần con cái mình cho Mô-léc[a], để khỏi xử tử hắn,
  to: Nhưng nếu dân trong xứ cố tình nhắm mắt làm ngơ trước người ấy khi người ấy đem một phần con cái mình dâng cho Mô-léc[a], để không xử tử người ấy,
  rationale: Chỉ thay các đại từ “hắn” bằng “người ấy” để loại bỏ sắc thái miệt thị không có trong nguyên văn và tăng tính nhất quán của văn phong pháp lý. Thêm “đem” trước “dâng cho” giúp cấu trúc tiếng Việt rõ hơn, không thay đổi nghĩa. Dấu neo chú thích đặt đúng tại “Mô-léc”; chú thích bảo lưu cách đọc thay thế mà không áp đặt một cách giải thích.
  reviewer_model: gpt-5.6-terra
