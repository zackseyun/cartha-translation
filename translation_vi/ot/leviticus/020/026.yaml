  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: vi
  text: Các ngươi phải nên thánh cho Ta, vì Ta, Yahweh, là thánh; Ta đã phân rẽ các ngươi khỏi các dân[a] để các ngươi thuộc về Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “khỏi các dân tộc”. Từ Hê-bơ-rơ עַמִּים có thể có nghĩa là “các dân” hoặc, trong một số văn cảnh, “các dân tộc”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם לִי קְדֹשִׁים
  choice: Các ngươi phải thánh khiết đối với Ta
  rationale: Cách dịch này giữ sắc thái đòi hỏi mang tính giao ước của động từ trong văn cảnh luật pháp, đồng thời diễn đạt לִי là mối quan hệ hướng về Đức Chúa Trời. “Thánh khiết” bảo toàn cả chiều kích đạo đức lẫn biệt riêng, thay vì thu hẹp thành một nghĩa duy nhất.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu nền tảng cho đòi hỏi về sự thánh khiết của Israel; “vì” tự nhiên và giữ rõ quan hệ nguyên nhân trong tiếng Việt.
- source_word: קָדוֹשׁ
  choice: thánh
  rationale: Khi nói về Yahweh, “thánh” là cách diễn đạt trang trọng, quen thuộc và duy trì liên hệ trực tiếp với sự thánh khiết được đòi hỏi nơi dân Ngài.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong bản Hê-bơ-rơ, không thay thế bằng một tước hiệu.
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: Ta đã phân rẽ các ngươi
  rationale: “Phân rẽ” biểu đạt hành động hoàn tất của Đức Chúa Trời và phân biệt בדל với קדש, tránh dùng cùng một cách dịch cho hai từ Hê-bơ-rơ khác nhau.
- source_word: מִן הָעַמִּים
  choice: khỏi các dân
  rationale: עַמִּים chỉ các cộng đồng dân tộc nói chung và không nhất thiết nhấn mạnh thực thể chính trị; “các dân” giữ được phạm vi nghĩa rộng ấy.
- source_word: לִהְיוֹת לִי
  choice: để các ngươi thuộc về Ta
  rationale: Diễn đạt tự nhiên mục đích hoặc kết quả của việc phân rẽ, đồng thời giữ ngôn ngữ về quyền sở hữu và mối quan hệ giao ước.
theological_decisions:
- issue: Diễn đạt sự thánh khiết giao ước mà không giản lược thành sự tinh sạch đạo đức hoặc sự biệt riêng nghi lễ
  choice: Dùng “thánh khiết/thánh” cho קדש và “phân rẽ” cho בדל
  alternative: Dịch cả hai ý bằng “biệt riêng”, hoặc đạo đức hóa thành “thanh sạch”
  rationale: Câu Hê-bơ-rơ đặt sự thánh khiết của dân trên nền sự thánh của Yahweh, rồi dùng một động từ khác để nói Ngài phân rẽ họ khỏi các dân. Hai cách diễn đạt riêng giữ nguyên cả mối liên hệ thần học lẫn sự phân biệt từ vựng.
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn đây là danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của לִי ở đầu và cuối câu
  choice: “đối với Ta” ở đầu câu và “thuộc về Ta” ở cuối câu
  alternative: Dùng cùng một cách dịch máy móc tại cả hai vị trí
  rationale: 'Hai cách diễn đạt phản ánh chức năng theo ngữ cảnh: đầu câu mô tả mối quan hệ của sự thánh khiết hướng về Yahweh, còn cuối câu nhấn mạnh mục đích thuộc quyền Ngài, mà không xóa mối liên hệ từ vựng giữa hai vị trí.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để biểu thị rõ đại từ số nhiều chỉ toàn thể cộng đồng Israel; viết hoa “Ta” theo quy ước tiếng Việt khi chỉ Đức Chúa Trời. Dấu [a] được đặt sau mệnh đề chứa “các dân”, là từ ngữ mà chú thích giải thích.
