  - severity: low
    issue: Ký hiệu [a] đang đặt ở cuối câu thay vì ngay sau “các dân.”
    rationale: Chú thích chỉ giải thích עַמִּים/các dân; đặt neo ngay sau từ này tránh cảm giác chú thích áp dụng cho toàn bộ mệnh đề cuối.
  - severity: low
    issue: “các nước” trong chú thích có thể gợi thực thể quốc gia hiện đại.
    rationale: Nghĩa thay thế của עַמִּים trong văn cảnh này được diễn đạt rõ và trung tính hơn bằng “các dân tộc.”
