revisions:
- from: Các ngươi phải thánh khiết đối với Ta, vì Ta, Yahweh, là thánh; Ta đã phân rẽ các ngươi khỏi các dân để các ngươi thuộc về Ta.[a]
  to: Các ngươi phải nên thánh cho Ta, vì Ta, Yahweh, là thánh; Ta đã phân rẽ các ngươi khỏi các dân[a] để các ngươi thuộc về Ta.
  rationale: Bản sửa thay “thánh khiết đối với Ta” bằng “nên thánh cho Ta” để diễn đạt sát hơn quan hệ quy thuộc do לִי biểu thị, đồng thời duy trì sắc thái đòi hỏi của ngữ cảnh luật pháp. Các từ then chốt khác được giữ để bảo tồn sự phân biệt giữa קדש (“thánh”) và בדל (“phân rẽ”). Chú thích được neo đúng vị trí và phương án từ vựng được diễn đạt tự nhiên hơn trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
