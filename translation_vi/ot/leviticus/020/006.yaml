base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: vi
  text: Còn người nào tìm đến những người gọi hồn và những thầy bói[a], để bán mình theo họ[b], thì Ta sẽ hướng mặt Ta chống lại người ấy và cắt người ấy khỏi giữa dân mình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hai thuật ngữ Hê-bơ-rơ này chỉ những người hành nghề cầu hỏi người chết hoặc các linh; cũng có thể dịch là “các đồng cốt và những người biết việc kín.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “để làm điếm theo họ” hoặc “để bán mình theo họ”, một ẩn dụ về sự bất trung trong giao ước qua việc theo các thực hành tâm linh bị cấm.
    reason: lexical_alternative
  - marker: c
    text: “Cắt ... khỏi” là một công thức pháp lý; tại đây câu không nói rõ hình thức phán xét cụ thể.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: người nào
  rationale: Trong văn luật pháp, נֶפֶשׁ chỉ một cá nhân, không nhấn mạnh phần hồn phi vật chất; “người nào” tự nhiên trong mệnh đề điều kiện tiếng Việt.
- source_word: תִּפְנֶה אֶל
  choice: tìm đến
  rationale: פנה có nghĩa gốc là quay hay hướng về; trong ngữ cảnh này, từ chỉ việc chủ động tìm đến để cầu hỏi, nên “tìm đến” vừa tự nhiên vừa giữ ý hướng mình về phía họ.
- source_word: הָאֹבֹת
  choice: các đồng bóng
  rationale: אוֹב ở đây chỉ những người làm trung gian cầu hỏi người chết hoặc các linh; “đồng bóng” là cách gọi tiếng Việt dễ hiểu, dù sắc thái và phạm vi của thuật ngữ Hê-bơ-rơ không hoàn toàn chắc chắn.
- source_word: הַיִּדְּעֹנִים
  choice: thầy pháp
  rationale: יִדְּעֹנִי chỉ người hành nghề huyền thuật, thường đi đôi với אוֹב. “Thầy pháp” phân biệt nhóm này với “đồng bóng” mà vẫn giữ trường nghĩa tà thuật.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: chạy theo họ mà hành dâm
  rationale: Giữ cả thành tố “theo sau” và động từ זנה. “Hành dâm” bảo tồn ẩn dụ mạnh về sự bất trung trong giao ước, thay vì giản lược thành sự bất trung nói chung.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: Ta sẽ quay mặt chống lại người ấy
  rationale: Cách dịch này giữ hình ảnh khuôn mặt trong thành ngữ Hê-bơ-rơ và biểu đạt rõ sự đối nghịch, phán xét của Đức Chúa Trời.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: loại trừ người ấy
  rationale: כרת là công thức pháp lý chỉ việc bị cắt khỏi cộng đồng. “Loại trừ” tự nhiên hơn lối dịch sát chữ “cắt bỏ”, nhưng không xác định quá mức phương thức hình phạt.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: khỏi dân mình
  rationale: Đây là công thức chỉ sự loại khỏi giữa cộng đồng mà người ấy thuộc về; “khỏi dân mình” ngắn gọn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Có giữ ẩn dụ mại dâm về sự bất trung trong giao ước hay không
  choice: chạy theo họ mà hành dâm
  alternative: bất trung vì chạy theo họ
  rationale: Bản Hê-bơ-rơ dùng rõ động từ זנה. Giữ ẩn dụ tình dục bảo tồn sức nặng thần học của việc tìm đến các thực hành tà thuật như một hành vi bất trung, thay vì biến nó thành sự vi phạm chung chung.
- issue: Ý nghĩa của hình phạt כרת
  choice: loại trừ người ấy khỏi dân mình
  alternative: tiêu diệt người ấy / khai trừ người ấy
  rationale: Câu này không xác định chính xác hình thức thực hiện hình phạt. “Loại trừ” giữ tính nghiêm trọng nhưng không quyết định đó là xử tử, phán xét trực tiếp của Đức Chúa Trời hay trục xuất khỏi cộng đồng.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ thần linh “Ta” được viết hoa. “Đồng bóng” và “thầy pháp” là những từ phổ thông, còn chú thích ghi nhận phạm vi nghĩa không hoàn toàn trùng khít của hai thuật ngữ Hê-bơ-rơ. Các dấu chú thích [a], [b], [c] đều có mặt trong chính văn.
