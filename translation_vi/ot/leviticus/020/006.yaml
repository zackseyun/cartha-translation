revisions:
- from: Còn người nào tìm đến các đồng bóng và thầy pháp[a], chạy theo họ mà hành dâm[b], thì Ta sẽ quay mặt chống lại người ấy và loại trừ người ấy khỏi dân mình[c].
  to: Còn người nào tìm đến những người gọi hồn và những thầy bói[a], để bán mình theo họ[b], thì Ta sẽ hướng mặt Ta chống lại người ấy và cắt người ấy khỏi giữa dân mình[c].
  rationale: Bản sửa giữ mọi thành tố của nguyên văn, nhưng dùng “bán mình theo họ” để truyền đạt chính xác và tự nhiên ẩn dụ זנה, dùng “hướng mặt Ta chống lại” để giữ hình ảnh thành ngữ, và dùng “cắt ... khỏi giữa dân mình” để không quyết định trước cách hiểu về כרת. Các chú thích được chỉnh để bám đúng các từ neo trong chính văn và không khẳng định quá mức về phạm vi của các thuật ngữ tranh luận.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc pháp lý của câu và giữ được các yếu tố chính: người tìm đến các người hành nghề bị cấm, ẩn dụ זנה, sự Đức Chúa Trời chống lại người ấy, và công thức כרת. Tuy nhiên, “chạy theo họ mà hành dâm” trong tiếng Việt dễ được hiểu là hành vi tình dục theo nghĩa đen với các người ấy, thay vì ẩn dụ ‘tự bán mình/điếm dâm theo’ trong tiếng Hê-bơ-rơ. “Loại trừ” cũng diễn giải công thức כרת theo hướng trục xuất rõ hơn mức bản văn cho phép.'
  naturalness: Câu nhìn chung trang trọng và dễ đọc, nhưng “chạy theo họ mà hành dâm” không tự nhiên trong tiếng Việt hiện đại và gây mơ hồ không cần thiết. “Hướng mặt Ta chống lại” giữ thành ngữ gốc mà vẫn tự nhiên trong văn phong Kinh Thánh hiện đại.
  terminology: “Đồng bóng” và “thầy pháp” có sắc thái văn hóa Việt Nam khá đặc thù và phạm vi rộng, nên không phải cặp tương đương an toàn nhất cho hai thuật ngữ Hê-bơ-rơ. “Những người gọi hồn và những thầy bói” là cặp thuật ngữ phổ thông, rõ nghĩa hơn trong ngữ cảnh, đồng thời chú thích nêu tính không hoàn toàn xác định của các danh từ gốc. “Bán mình theo họ” bảo tồn hình ảnh tự làm điếm/bất trung mà không biến ẩn dụ thành mô tả tình dục theo nghĩa đen.
  issues:
  - severity: medium
    issue: Cụm “chạy theo họ mà hành dâm” gây hiểu sai ẩn dụ זנה.
    rationale: לִזְנוֹת אַחֲרֵיהֶם nói về việc ‘làm điếm/bán mình theo họ’ theo nghĩa bất trung, không nói người đó hành dâm với chính các thầy hành nghề. Cách diễn đạt hiện tại vừa không tự nhiên vừa có thể đọc theo nghĩa đen.
  - severity: medium
    issue: “Loại trừ” thu hẹp tính mở của công thức כרת.
    rationale: Hình phạt ‘cắt khỏi giữa dân mình’ không xác định phương thức thực hiện. “Loại trừ” nghiêng về khai trừ/trục xuất, trong khi “cắt ... khỏi” bảo tồn tính công thức và sự không xác định của tiếng Hê-bơ-rơ.
  - severity: low
    issue: “Đồng bóng” và “thầy pháp” có thể gợi các thực hành Việt Nam riêng biệt.
