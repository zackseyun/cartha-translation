revisions:
- from: Còn chính Ta sẽ quay mặt chống lại người ấy và loại hắn khỏi dân mình,[a] vì hắn đã dâng một phần dòng dõi mình cho Mô-léc, làm ô uế nơi thánh của Ta và xúc phạm danh thánh của Ta.
  to: Chính Ta sẽ hướng mặt chống lại người ấy và loại trừ người ấy khỏi giữa dân mình, vì người ấy đã dâng một số con cái mình cho Mô-léc,[a] nhằm làm ô uế nơi thánh của Ta và làm ô danh thánh của Ta.
  rationale: Bản sửa thay cụm “một phần dòng dõi” bằng cách diễn đạt hiện đại, rõ nghĩa về con cái mà vẫn giữ sắc thái bộ phận; làm rõ thành ngữ “đặt/hướng mặt chống lại” và quan hệ mục đích của לְמַעַן. Chú thích được đặt ngay sau cụm liên quan đến Mô-léc và chỉ nêu khả năng diễn giải theo văn mạch, không đưa ý hiến tế vào chính văn.
  reviewer_model: gpt-5.6-terra
