  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: vi
  text: Chính Ta sẽ hướng mặt chống lại người ấy và loại trừ người ấy khỏi giữa dân mình, vì người ấy đã dâng một số con cái mình cho Mô-léc,[a] nhằm làm ô uế nơi thánh của Ta và làm ô danh thánh của Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã hiến tế một số con cái mình cho Mô-léc.” Nguyên văn chỉ nói “đã dâng một số con cái mình cho Mô-léc”; ý hiến tế được suy ra từ văn mạch rộng hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Còn chính Ta
  rationale: Đại từ độc lập nhấn mạnh chính Đức Chúa Trời đích thân hành động; “Còn chính Ta” cũng giữ được nét đối lập với trách nhiệm của dân chúng trong văn mạch.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: sẽ quay mặt chống lại người ấy
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ về sự chủ ý đối nghịch và phán xét của Đức Chúa Trời, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: và loại hắn khỏi dân mình
  rationale: כרת ở dạng Hiphil trong công thức xét xử có nghĩa là loại trừ hoặc dứt bỏ. “Loại ... khỏi” giữ ý cộng đồng mà không xác định quá mức hình thức hình phạt.
- source_word: מִזַּרְעוֹ
  choice: một phần dòng dõi mình
  rationale: “Dòng dõi” phản ánh זרע, còn “một phần” thể hiện sắc thái phân chia của giới từ מן, tránh mặc nhiên đổi thành “con cái” trong chính văn.
- source_word: נָתַן לַמֹּלֶךְ
  choice: đã dâng ... cho Mô-léc
  rationale: “Dâng” giữ nghĩa trao cho trong bối cảnh nghi lễ nhưng chưa nói rõ cách thức hiến tế; tên riêng được phiên âm là “Mô-léc”.
- source_word: לְמַעַן
  choice: làm
  rationale: Trong cấu trúc tiếng Việt, “làm ... và ...” diễn đạt tự nhiên mục đích hoặc kết quả của hành động, trong khi không buộc phải phân giải hoàn toàn sắc thái giữa hai nghĩa ấy.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: làm ô uế nơi thánh của Ta
  rationale: “Ô uế” giữ sắc thái nghi lễ của טמא; “nơi thánh” là cách nói rõ ràng, trang trọng cho מקדש.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: và xúc phạm danh thánh của Ta
  rationale: “Xúc phạm” truyền đạt việc đối xử bất kính và làm mất tính thiêng của danh Đức Chúa Trời; “danh thánh” giữ cấu trúc và trọng lượng thần học của nguyên văn.
theological_decisions:
- issue: Bản chất hành vi liên quan đến Mô-léc
  choice: Giữ cách nói “đã dâng một phần dòng dõi mình cho Mô-léc” trong chính văn.
  alternative: “đã hiến tế một số con cái mình cho Mô-léc” hoặc “đã khiến con mình đi qua lửa cho Mô-léc”.
  rationale: Văn mạch rộng hơn hàm ý việc hiến tế trẻ em, nhưng câu này chỉ dùng động từ “trao/dâng”. Bản dịch không đưa cách thức cụ thể vào chính văn; chú thích nêu cách hiểu theo văn mạch.
- issue: Sự đích thân phán xét của Đức Chúa Trời
  choice: Dịch nhấn mạnh là “Còn chính Ta” và giữ hình ảnh “quay mặt chống lại”.
  alternative: “Ta sẽ chống lại” hoặc chỉ “Ta sẽ quay mặt chống lại”.
  rationale: Đại từ độc lập nhấn mạnh sự can dự trực tiếp của Đức Chúa Trời; hình ảnh khuôn mặt bảo toàn sức nặng giao ước và tư pháp của thành ngữ.
- issue: Ý nghĩa của hình phạt כרת
  choice: Dịch là “loại hắn khỏi dân mình”.
  alternative: “tiêu diệt hắn” hoặc “khai trừ hắn khỏi dân mình”.
  rationale: Nguyên ngữ không xác định rõ tại đây hình phạt được thực hiện bằng cái chết, hành động trực tiếp của Đức Chúa Trời hay sự loại trừ khỏi cộng đồng; bản dịch giữ độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” dành cho lời Đức Chúa Trời; “hắn” giữ quy chiếu nam tính và sắc thái tư pháp đối với người phạm tội. Chính văn bảo toàn hình ảnh Hê-bơ-rơ và không giải thích quá mức bản chất của hình phạt hay nghi thức.
