review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ được thành ngữ pháp lý về việc “phơi bày sự trần truồng”, các quan hệ thân tộc, và sự chuyển từ số ít trong mệnh đề giải thích sang số nhiều trong mệnh đề hậu quả. Tuy nhiên, “lột trần sự lõa lồ” không phải cách kết hợp tự nhiên trong tiếng Việt hiện đại; “phơi bày sự trần truồng” vừa sát thành ngữ Hê-bơ-rơ vừa rõ nghĩa hơn. Cụm chỉ thân tộc cũng cần thêm giới từ để tránh mơ hồ.
  naturalness: “Sự lõa lồ” và “chị em gái mẹ ngươi” gượng trong văn phong Việt hiện đại. “Sự trần truồng” và “chị em gái của mẹ ngươi” là những cách nói tự nhiên, trang trọng, và phù hợp văn cảnh luật pháp. “Người nam ấy” có thể gây cảm giác đang chỉ một người nam khác với người được trực tiếp nói đến; “người ấy” vẫn bảo toàn số ít của tiếng Hê-bơ-rơ mà không tạo thêm sự gượng ép.
  terminology: Dùng “phơi bày sự trần truồng” để duy trì uyển ngữ pháp lý thay vì diễn giải thành quan hệ tình dục. “Cốt nhục” là lựa chọn phù hợp cho שְׁאֵרוֹ, với chú thích nêu nghĩa thân tộc/gốc nghĩa đen. “Mang lấy tội lỗi” bảo toàn tính mở của נשׂא עָוֹן; chú thích đúng khi nêu sắc thái tội trạng hoặc hình phạt.
  issues:
  - severity: medium
    issue: “lột trần sự lõa lồ” là cách diễn đạt không tự nhiên
    rationale: “Lõa lồ” thường là tính từ trong tiếng Việt hiện đại, và việc ghép với “lột trần” tạo lặp ý, gượng hơn thành ngữ pháp lý tương ứng. “Phơi bày sự trần truồng” giữ hình ảnh và chức năng uyển ngữ của nguyên văn.
  - severity: low
    issue: “chị em gái mẹ/cha ngươi” thiếu liên kết ngữ pháp tự nhiên
    rationale: Cần dùng “chị em gái của mẹ ngươi” và “chị em gái của cha ngươi” để quan hệ sở thuộc rõ ràng, không áp đặt các danh xưng cô/dì theo tuổi.
  - severity: low
    issue: “người nam ấy” làm mệnh đề giải thích kém tự nhiên
    rationale: Nguyên văn có hình thức số ít giống đực, trong một quy định trực tiếp nhắm đến nam giới; tiếng Việt không cần đưa thêm danh từ “người nam” để phản ánh hình thức ngữ pháp này. “Người ấy” giữ số ít và tránh cảm giác đổi sang một nhân vật khác.
