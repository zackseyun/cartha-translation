  to: Ngươi không được phơi bày sự trần truồng của chị em gái của mẹ ngươi hoặc chị em gái của cha ngươi, vì người ấy đã phơi bày cốt nhục của mình[a]; họ sẽ mang lấy tội lỗi của mình[b].
