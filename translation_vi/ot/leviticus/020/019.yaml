id: LEV.20.19
reference: Leviticus 20:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: vi
  text: Ngươi không được phơi bày sự trần truồng của chị em gái của mẹ ngươi hoặc chị em gái của cha ngươi, vì người ấy đã phơi bày cốt nhục của mình[a]; họ sẽ mang lấy tội lỗi của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì người ấy đã phơi bày người bà con ruột thịt của mình” hoặc “đã phơi bày thân tộc của mình”. Nguyên văn dùng một từ chỉ quan hệ thân tộc, với nghĩa đen là “thịt/cốt nhục của người ấy”.'
    reason: lexical_alternative
  - marker: b
    text: “Mang lấy tội lỗi” cũng có thể có nghĩa là “mang lấy tội trạng” hoặc “chịu hình phạt vì tội lỗi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: không được lột trần sự lõa lồ
  rationale: Giữ thành ngữ pháp lý của tiếng Hê-bơ-rơ về quan hệ tình dục bất hợp pháp, thay vì diễn giải thẳng thành “quan hệ tình dục”; cách nói này cũng duy trì tính liên văn bản trong Lê-vi Ký.
- source_word: אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ
  choice: chị em gái mẹ ngươi hoặc chị em gái cha ngươi
  rationale: Dịch trực tiếp các quan hệ thân tộc, không thu hẹp thành “dì” hay “cô”, vì tiếng Việt có thể phân biệt theo tuổi và phía nội/ngoại nhiều hơn nguyên văn.
- source_word: שְׁאֵרוֹ
  choice: chính cốt nhục mình
  rationale: “Cốt nhục” là cách nói tiếng Việt tự nhiên, trang trọng về người bà con cùng huyết thống, đồng thời giữ hình ảnh cụ thể “thịt/xác thịt” của nguyên văn.
- source_word: הֶעֱרָה
  choice: đã phơi bày
  rationale: Diễn đạt động từ “làm cho trần trụi/phơi ra” và tránh lặp nguyên cụm “lột trần” trong cùng một câu.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: họ sẽ mang lấy tội lỗi của mình
  rationale: Giữ thành ngữ “mang tội lỗi” và để ngỏ sắc thái bao gồm hành vi sai trái, tình trạng mắc tội và hậu quả phải chịu.
theological_decisions:
- issue: Sự chuyển đổi từ số ít sang số nhiều giữa mệnh đề giải thích và mệnh đề hậu quả
  choice: Dùng số ít “người nam ấy… mình” rồi chuyển sang số nhiều “họ… của mình”.
  alternative: 'Đồng nhất toàn câu ở số nhiều: “vì họ đã phơi bày cốt nhục của mình; họ sẽ mang lấy tội lỗi của mình”.'
  rationale: Nguyên văn dùng hậu tố và động từ số ít trong mệnh đề giải thích nhưng dùng đại từ sở hữu và động từ số nhiều ở mệnh đề cuối. Bản dịch giữ sự chuyển đổi này, đồng thời thêm “người nam ấy” để tiếng Việt xác định rõ chủ thể số ít mà không xóa bỏ sức căng của nguyên văn.
- issue: Có nên nói rõ uyển ngữ tình dục trong chính văn hay không
  choice: Giữ thành ngữ “lột trần sự lõa lồ”.
  alternative: 'Dịch diễn ý: “không được quan hệ tình dục với”.'
  rationale: Thành ngữ về sự lõa lồ là nét đặc trưng của luật pháp trong phân đoạn này; giữ lại giúp bảo toàn hình thức và sự liên kết với văn cảnh, trong khi ý nghĩa tình dục đã rõ từ ngữ cảnh.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Đại từ “ngươi” phù hợp lời luật trực tiếp và giữ ngôi số ít của nguyên văn. Cụm “chị em gái mẹ/cha ngươi” tránh áp đặt các phân biệt “dì/cô/bác” không được nguyên văn xác định; “cốt nhục” bảo toàn ẩn dụ thân tộc.
