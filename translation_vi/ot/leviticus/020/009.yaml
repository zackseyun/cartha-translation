  text: כִּֽי אִ֣ישׁ אִ֗ישׁ אֲשֶׁ֨ר יְקַלֵּ֧ל אֶת אָבִ֛י/ו וְ/אֶת אִמּ֖/וֹ מ֣וֹת יוּמָ֑ת אָבִ֧י/ו וְ/אִמּ֛/וֹ קִלֵּ֖ל דָּמָ֥י/ו בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: vi
  text: Vì bất cứ ai nguyền rủa cha mình hoặc mẹ mình[a] thì nhất định phải bị xử tử; người ấy đã nguyền rủa cha mình và mẹ mình; người ấy phải chịu trách nhiệm về máu mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cha mình và mẹ mình.” Trong ngữ cảnh pháp lý, cách diễn đạt này có nghĩa là nguyền rủa cha hoặc mẹ đều phải chịu hình phạt ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát chữ: “máu người ấy ở trên người ấy.” Đây là thành ngữ Hê-bơ-rơ quy trách nhiệm về cái chết cho chính người phạm tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu căn cứ của điều luật trong mạch văn, thay vì biến câu thành một điều kiện thuần túy.
- source_word: אִישׁ אִישׁ
  choice: bất cứ người nào
  rationale: Danh từ được lặp lại mang nghĩa phân phối, tức là bất cứ ai thuộc trường hợp được nêu; cách diễn đạt này tự nhiên trong tiếng Việt mà không cần mô phỏng sự lặp từ.
- source_word: יְקַלֵּל / קִלֵּל
  choice: nguyền rủa / đã nguyền rủa
  rationale: Động từ piel ở đây chỉ hành vi nói lời nguyền rủa, mạnh và cụ thể hơn ý khinh thường nói chung.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: cha mình hoặc mẹ mình / cha mình và mẹ mình
  rationale: Ở mệnh đề quy định, “hoặc” làm rõ rằng nguyền rủa một trong hai người đều chịu án; ở mệnh đề nêu căn cứ, giữ “và” theo liên từ Hê-bơ-rơ, đồng thời chú thích khả năng hiểu theo nghĩa pháp lý phân phối.
- source_word: מוֹת יוּמָת
  choice: chắc chắn phải bị xử tử
  rationale: Diễn đạt cả sắc thái nhấn mạnh của nguyên thể tuyệt đối đi với động từ hữu hạn lẫn thể bị động mang tính tư pháp.
- source_word: דָּמָיו בּוֹ
  choice: máu của người ấy ở trên chính người ấy
  rationale: Giữ hình ảnh và công thức trách nhiệm tư pháp của tiếng Hê-bơ-rơ, đồng thời thêm “chính” để tiếng Việt thể hiện rõ trách nhiệm quy về người phạm tội.
theological_decisions:
- issue: Phạm vi của lối nói phân phối אִישׁ אִישׁ
  choice: bất cứ người nào
  alternative: bất cứ người đàn ông nào
  rationale: Trong điều luật, dạng giống đực có chức năng đại diện và phân phối. “Bất cứ người nào” truyền đạt phạm vi quy định tự nhiên hơn trong tiếng Việt, không khẳng định rằng điều luật chỉ áp dụng cho nam giới.
- issue: Liên từ giữa cha và mẹ
  choice: “hoặc” trong quy định, “và” trong phần nêu căn cứ
  alternative: giữ “và” ở cả hai vị trí
  rationale: 'Cách chọn này bảo toàn hình thức của lần xuất hiện thứ hai nhưng làm rõ nghĩa pháp lý ở lần đầu: nguyền rủa cha hoặc mẹ đều đủ cấu thành hành vi chịu án. Chú thích giữ lại cách đọc sát mặt chữ.'
- issue: Công thức דָּמָיו בּוֹ
  choice: máu của người ấy ở trên chính người ấy
  alternative: tội đổ máu của người ấy thuộc về người ấy
  rationale: Bản dịch giữ nguyên ẩn dụ tư pháp và ý rằng người phạm tội tự chịu trách nhiệm về cái chết của mình, không đưa thêm một hệ thống thần học về chuộc tội hay tội lỗi siêu hình.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Xử tử” truyền đạt rõ hành động tư pháp; “máu ... ở trên chính người ấy” cố ý giữ thành ngữ nguồn, với chú thích giải nghĩa để tránh làm mất sức nặng và tính hàm súc của câu.
