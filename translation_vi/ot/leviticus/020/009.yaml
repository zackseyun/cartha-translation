  naturalness: Cần thay công thức “máu ... ở trên chính người ấy” bằng một cách diễn đạt Việt ngữ hiện đại, pháp lý và rõ nghĩa hơn. Việc đặt chú thích về “hoặc” ngay sau cụm “cha ... hoặc mẹ” cũng làm neo chú thích chính xác hơn.
  terminology: “Nguyền rủa,” “bị xử tử,” và “phải chịu trách nhiệm về máu mình” phù hợp ngữ vực luật pháp trang trọng hiện đại. “Máu mình” ở đây giữ tính pháp lý của thành ngữ; chú thích nêu cách dịch sát chữ và giải thích trách nhiệm về cái chết, không áp đặt diễn giải thần học.
