source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: vi
  text: Nếu một người đàn ông nằm với một người phụ nữ đang ô uế vì kinh nguyệt[a] và làm lộ chỗ kín của người phụ nữ ấy—người đàn ông ấy đã làm lộ nguồn của nàng[b], còn người phụ nữ ấy đã làm lộ nguồn huyết của mình—thì cả hai phải bị loại khỏi giữa dân của họ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang có kinh nguyệt.” Từ Hê-bơ-rơ này còn hàm ý tình trạng ô uế nghi lễ liên quan đến kinh nguyệt trong Lê-vi Ký.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “người ấy đã làm lộ nguồn của nàng, còn nàng đã làm lộ nguồn huyết của mình.” “Nguồn” là cách nói uyển ngữ chỉ nơi huyết chảy ra.'
    reason: lexical_alternative
  - marker: c
    text: “Bị loại khỏi” là một công thức pháp lý quen thuộc trong Ngũ Kinh; câu này không nói rõ việc loại bỏ ấy được thực hiện bằng cách nào.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: Giữ đúng giống đực số ít của điều luật và phù hợp với ngữ cảnh quan hệ tính dục.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: nằm với một người phụ nữ
  rationale: Bảo tồn thành ngữ Hê-bơ-rơ chỉ quan hệ tính dục, đồng thời giữ văn phong pháp luật trang trọng.
- source_word: דָּוָה
  choice: đang trong tình trạng ô uế vì kinh nguyệt
  rationale: Diễn đạt cả hiện tượng kinh nguyệt lẫn tình trạng ô uế nghi lễ trong bối cảnh Lê-vi Ký.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: phơi bày sự trần truồng của nàng
  rationale: Giữ thành ngữ pháp lý đặc trưng của các luật về quan hệ tính dục trong Lê-vi Ký.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: người ấy đã làm lộ nguồn huyết của nàng
  rationale: מָקוֹר có nghĩa đen là nguồn hay suối; cách dịch này giữ hình ảnh uyển ngữ của nguyên văn và để chú thích giải thích rõ.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: còn nàng cũng đã phơi bày nguồn huyết mình
  rationale: Giữ cấu trúc song song và trách nhiệm của người nữ được nêu rõ trong nguyên văn.
- source_word: וְנִכְרְתוּ
  choice: phải bị loại khỏi
  rationale: Truyền đạt công thức chế tài covenantal mà không xác định thêm đó là xử tử, khai trừ hay một hình thức khác.
- source_word: מִקֶּרֶב עַמָּם
  choice: dân mình
  rationale: Cách nói tự nhiên trong tiếng Việt, vẫn giữ chiều kích cộng đồng của công thức Hê-bơ-rơ.
theological_decisions:
- issue: Bản chất tình trạng דָּוָה
  choice: đang trong tình trạng ô uế vì kinh nguyệt
  alternative: đang có kinh nguyệt
  rationale: Bối cảnh Lê-vi Ký quan tâm không chỉ đến hiện tượng sinh lý mà còn đến tình trạng ô uế nghi lễ; chú thích bảo tồn cách diễn đạt đơn giản hơn.
- issue: Ý nghĩa hình phạt וְנִכְרְתוּ
  choice: phải bị loại khỏi dân mình
  alternative: phải bị xử tử; phải bị khai trừ khỏi cộng đồng
  rationale: Nguyên văn không xác định tại đây hình thức thi hành việc bị loại bỏ, nên bản dịch không giải quyết thay sự mơ hồ ấy.
- issue: Hình ảnh מָקוֹר
  choice: nguồn huyết
  alternative: dòng huyết
  rationale: Giữ phép ẩn dụ 'nguồn' của tiếng Hê-bơ-rơ thay vì chỉ diễn giải thành dòng chảy sinh lý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ các thành ngữ pháp lý và hình ảnh của nguyên văn khi chúng mang ý nghĩa liên văn bản, đồng thời dùng chú thích để làm rõ những chỗ có thể khó hiểu.
