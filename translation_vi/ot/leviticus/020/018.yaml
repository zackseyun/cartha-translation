revisions:
- from: Nếu một người đàn ông nằm với một người phụ nữ đang trong tình trạng ô uế vì kinh nguyệt[a] và phơi bày sự trần truồng của nàng—người ấy đã làm lộ nguồn huyết của nàng[b], còn nàng cũng đã phơi bày nguồn huyết mình—thì cả hai phải bị loại khỏi dân mình[c].
  to: Nếu một người đàn ông nằm với một người phụ nữ đang ô uế vì kinh nguyệt[a] và làm lộ chỗ kín của người phụ nữ ấy—người đàn ông ấy đã làm lộ nguồn của nàng[b], còn người phụ nữ ấy đã làm lộ nguồn huyết của mình—thì cả hai phải bị loại khỏi giữa dân của họ[c].
  rationale: Bản sửa làm cho tiếng Việt hiện đại, nhất quán và sáng rõ hơn, đồng thời duy trì thành ngữ pháp lý, hình ảnh uyển ngữ «nguồn», tính nghi lễ của tình trạng kinh nguyệt, và sự mơ hồ nguyên thủy về hình phạt.
  reviewer_model: gpt-5.6-terra
