revisions:
- from: Nếu một người đàn bà đến gần bất cứ con vật nào để giao phối với nó[a], thì ngươi phải giết người đàn bà ấy và con vật. Cả hai chắc chắn phải bị xử tử[b]; máu của chúng ở trên chính chúng.
  to: Nếu một phụ nữ đến gần bất kỳ con vật nào để giao hợp với nó[a], thì phải giết người phụ nữ ấy và con vật. Cả hai chắc chắn phải bị xử tử[b]; máu của chúng ở trên đầu chúng.
