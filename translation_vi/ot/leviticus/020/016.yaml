source:
  edition: WLC
  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: vi
  text: Nếu một phụ nữ đến gần bất kỳ con vật nào để giao hợp với nó[a], thì phải giết người phụ nữ ấy và con vật. Cả hai chắc chắn phải bị xử tử[b]; máu của chúng ở trên đầu chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để nằm với nó.” Động từ Hê-bơ-rơ này chỉ cụ thể hành vi tình dục với thú vật; nghĩa gốc có liên hệ đến việc cưỡi.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “tội máu của chúng ở trên đầu chúng.” Thành ngữ này có nghĩa là chính họ phải chịu trách nhiệm về cái chết của mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: đến gần
  rationale: Giữ nghĩa cụ thể của động từ קרב là “đến gần”; mục đích tình dục được nêu riêng trong cụm tiếp theo, nên không diễn giải quá mức chính động từ này.
- source_word: כָּל בְּהֵמָה
  choice: bất cứ con vật nào
  rationale: בְּהֵמָה là từ rộng chỉ loài vật; kết hợp với כָּל, cách dịch này diễn đạt rõ phạm vi khái quát trong tiếng Việt hiện đại.
- source_word: לְרִבְעָה אֹתָהּ
  choice: để giao phối với nó
  rationale: Động từ רבע trong ngữ cảnh này chỉ hành vi tình dục với con vật, theo nghĩa đen có liên quan đến việc cưỡi/phủ. “Giao phối với nó” rõ nghĩa, gọn và không dùng uyển ngữ khó hiểu.
- source_word: וְהָרַגְתָּ
  choice: thì ngươi phải giết
  rationale: Trong văn luật, dạng động từ này mang lực mệnh lệnh. “Phải giết” truyền đạt nghĩa bắt buộc, còn “ngươi” duy trì cách xưng hô số ít của nguyên văn.
- source_word: מוֹת יוּמָתוּ
  choice: Cả hai chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn của án tử. “Chắc chắn phải bị xử tử” giữ được cả sắc thái nhấn mạnh lẫn công thức pháp lý bị động.
- source_word: דְּמֵיהֶם בָּם
  choice: máu của chúng ở trên chính chúng
  rationale: Giữ hình ảnh thành ngữ về máu trong nguyên văn, đồng thời “chính” làm rõ rằng trách nhiệm về cái chết thuộc về những đối tượng chịu án.
theological_decisions:
- issue: Cách diễn đạt luật nghiêm khắc liên quan đến hành vi tình dục với loài vật
  choice: Dịch trực tiếp, rõ ràng và giữ nguyên chế tài tử hình của câu.
  alternative: Dùng uyển ngữ như “nằm với nó” hoặc diễn giải rộng thành “quan hệ tình dục với nó”.
  rationale: Nguyên văn là điều luật có tính hình sự. Bản dịch cần giữ sự nghiêm trọng và minh bạch của điều cấm mà không thêm lời bình luận luân lý hay lập trường hệ phái.
- issue: Ý nghĩa của thành ngữ דְּמֵיהֶם בָּם
  choice: Giữ hình ảnh “máu của chúng ở trên chính chúng” trong chính văn và giải thích trách nhiệm trong chú thích.
  alternative: Dịch diễn giải ngay là “chúng phải tự chịu trách nhiệm về cái chết của mình”.
  rationale: Cách chọn giữ hình ảnh pháp lý-thần học giàu sức nặng của tiếng Hê-bơ-rơ, đồng thời chú thích giúp độc giả hiện đại hiểu thành ngữ mà không xóa bỏ tính đa nghĩa giữa “máu” và “tội làm đổ máu”.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng dùng tiếng Việt hiện đại, dễ hiểu. Đại từ “ngươi” giữ địa chỉ số ít trong nguyên văn và phù hợp sắc thái luật giao ước. “Cả hai” làm rõ chủ thể số nhiều của mệnh đề kế tiếp, tức người đàn bà và con vật.
