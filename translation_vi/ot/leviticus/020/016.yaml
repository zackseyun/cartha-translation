    issue: Thành ngữ cuối câu chưa tự nhiên
    rationale: “Máu của chúng ở trên chính chúng” không phải lối nói tiếng Việt tự nhiên và có thể bị hiểu theo nghĩa vật lý. “Máu của chúng ở trên đầu chúng” vẫn gần với hình ảnh Hê-bơ-rơ và rõ hơn trong văn phong pháp lý-Kinh Thánh.
  - severity: low
