    rationale: Bản dịch được yêu cầu bằng tiếng Việt chuẩn hiện đại. Bỏ đại từ mà vẫn giữ lực mệnh lệnh pháp lý sẽ tự nhiên hơn, không làm thay đổi nghĩa bắt buộc của động từ.
  - severity: low
    issue: Chú thích a dùng từ “phủ” không rõ nghĩa
