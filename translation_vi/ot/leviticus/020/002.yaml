source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: vi
  text: 'Ngươi hãy nói với con dân Y-sơ-ra-ên: Bất cứ người nào trong con dân Y-sơ-ra-ên, hoặc trong số ngoại kiều cư ngụ tại Y-sơ-ra-ên, mà đem con cái mình dâng cho Mô-léc[a], thì chắc chắn phải bị xử tử; dân trong xứ phải ném đá người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mô-léc” thường được hiểu là tên của một thần gắn với việc hiến tế trẻ em; một số học giả lại hiểu từ này là tên của một loại lễ vật hoặc nghi thức.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Giữ sắc thái của thành ngữ Hê-bơ-rơ “các con trai/con cái của Y-sơ-ra-ên” nhưng dùng cách diễn đạt trang trọng, quen thuộc và có tính đại diện trong tiếng Việt.
- source_word: אִישׁ אִישׁ
  choice: bất cứ người nào
  rationale: Danh từ lặp mang nghĩa phân phối, chỉ từng người không có ngoại lệ; cách dịch này tự nhiên hơn việc lặp “người người” và không làm thay đổi phạm vi pháp lệnh.
- source_word: הַגֵּר הַגָּר
  choice: ngoại kiều cư ngụ
  rationale: גֵּר chỉ người ngoại quốc sống thường trú giữa cộng đồng; “ngoại kiều cư ngụ” tái hiện tương đối tự nhiên mối liên hệ giữa danh từ và động từ cùng gốc.
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: dâng một người thuộc dòng dõi mình cho Mô-léc
  rationale: יִתֵּן cơ bản là “trao/đưa” nhưng trong ngữ cảnh nghi lễ có thể diễn đạt là “dâng”; זֶרַע nghĩa đen là “hạt giống”, ở đây chỉ con cháu, nên “một người thuộc dòng dõi mình” giữ được độ rộng mà vẫn rõ nghĩa.
- source_word: לַמֹּלֶךְ
  choice: cho Mô-léc
  rationale: Phiên âm như tên riêng theo cách hiểu truyền thống và trực tiếp nhất, đồng thời dùng chú thích để giữ lại cách hiểu học thuật khác.
- source_word: מוֹת יוּמָת
  choice: chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh án tử hình; bản dịch giữ cả tính nhấn mạnh lẫn thể bị động tư pháp.
- source_word: עַם הָאָרֶץ
  choice: dân trong xứ
  rationale: Dịch sát cụm từ, ở đây chỉ cộng đồng dân cư thi hành bản án, không áp đặt nghĩa xã hội học chuyên biệt xuất hiện trong những bối cảnh khác.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: phải ném đá người ấy
  rationale: Tiếng Việt tự nhiên không cần lặp “ném đá bằng đá”; động từ đã nêu rõ phương tiện và hành động hành hình.
theological_decisions:
- issue: Ý nghĩa của hành vi dâng dòng dõi cho Mô-léc
  choice: Giữ Mô-léc như tên của một đối tượng thờ phượng và không thêm chi tiết “qua lửa” hay “tế con trẻ” vào chính văn.
  alternative: Hiểu מֹלֶךְ là tên một loại lễ vật hoặc nghi thức molek chứ không phải tên thần.
  rationale: Cách hiểu tên riêng là cách đọc truyền thống và phù hợp trực tiếp với cú pháp, nhưng bằng chứng vẫn cho phép tranh luận. Câu này không tự nêu phương thức của nghi lễ, nên không đưa phần giải thích từ bối cảnh rộng hơn vào chính văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “ngươi” vì đây là lời Đức Chúa Trời truyền trực tiếp cho Môi-se ở số ít; dùng “con dân Y-sơ-ra-ên,” “ngoại kiều cư ngụ,” và “dân trong xứ” để vừa gần cấu trúc Hê-bơ-rơ vừa dễ hiểu. Dấu chú thích [a] được đặt ngay sau “Mô-léc,” đúng với nội dung cần giải thích.
