id: LEV.20.15
reference: Leviticus 20:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: vi
  text: Nếu một người đàn ông giao hợp với một con vật, người ấy chắc chắn phải bị xử tử; các ngươi cũng phải giết con vật đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: Danh từ giống đực số ít chỉ cụ thể người phạm tội là nam giới; câu kế tiếp xử lý trường hợp người nữ riêng.
- source_word: אֲשֶׁר
  choice: nếu
  rationale: Trong thể luật điều kiện, đại từ quan hệ mang lực điều kiện và được diễn đạt tự nhiên bằng “nếu” trong tiếng Việt.
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: giao hợp
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “trao sự nằm của mình”; “giao hợp” truyền đạt rõ hành vi tình dục, tự nhiên và trang nghiêm trong tiếng Việt hiện đại.
- source_word: בִּבְהֵמָה
  choice: với một con vật
  rationale: בְּהֵמָה chỉ một con vật; cách dịch này rõ nghĩa và không dùng từ cổ.
- source_word: מוֹת יוּמָת
  choice: chắc chắn phải bị xử tử
  rationale: Động từ nguyên thể tuyệt đối đi cùng động từ hữu hạn tạo sắc thái nhấn mạnh; cách dịch giữ cả tính bắt buộc pháp lý lẫn sự nhấn mạnh.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: các ngươi cũng phải giết con vật đó
  rationale: Động từ ngôi thứ hai số nhiều hướng đến cộng đồng hoặc những người thi hành phán quyết; “cũng” thể hiện liên từ và bổ sung hình phạt đối với con vật.
theological_decisions:
- issue: Giới tính của người phạm tội
  choice: 'Cụ thể là nam giới: “một người đàn ông”'
  alternative: 'Cách gọi chung: “một người”'
  rationale: Bản Hê-bơ-rơ dùng danh từ giống đực, và câu kế tiếp quy định riêng trường hợp người nữ; cách dịch cụ thể bảo toàn cấu trúc và phạm vi pháp lý của nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng dễ hiểu. Dùng “các ngươi” để bảo toàn ngôi thứ hai số nhiều của lời phán cho cộng đồng; “xử tử” diễn đạt chính xác án tử hình, còn “giết” giữ động từ bình thường được dùng đối với con vật.
