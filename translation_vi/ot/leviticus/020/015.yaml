  source_fidelity: 'Bản dịch giữ đúng cấu trúc luật điều kiện của tiếng Hê-bơ-rơ: người phạm là nam giới, hành vi được diễn đạt rõ là giao hợp với con vật, hình phạt tử hình được nhấn mạnh, và cộng đồng được trực tiếp truyền lệnh giết con vật. “Chắc chắn phải bị xử tử” chuyển đạt tốt sắc thái nhấn mạnh của מוֹת יוּמָת; “các ngươi” bảo toàn ngôi thứ hai số nhiều của תַּהֲרֹגוּ.'
  naturalness: Câu văn tự nhiên, rõ ràng và phù hợp văn phong luật pháp Kinh Thánh bằng tiếng Việt hiện đại. “Giao hợp” trang nghiêm, minh bạch và không thô tục. “Các ngươi” có sắc thái trang trọng/phụng vụ nhưng vẫn dễ hiểu trong ngữ cảnh lời luật trực tiếp.
  terminology: “Một người đàn ông” phản ánh chính xác אִישׁ trong câu này, nhất quán với việc câu kế tiếp quy định riêng về người nữ. “Con vật,” “xử tử,” và “giết” đều phù hợp với các từ Hê-bơ-rơ và với phân biệt giữa án dành cho người và hành động đối với con vật.
