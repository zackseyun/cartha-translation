  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống được dịch là “ĐỨC CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Dạng Piel với waw liên tiếp mở đầu một đơn vị lời phán mới. Trong ngữ cảnh Đức Chúa Trời truyền lời cho Môi-se, “phán” là cách diễn đạt tự nhiên, trang trọng và chính xác trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc “phán với”, giới từ này chỉ người tiếp nhận lời phán và phù hợp với cách dùng tự nhiên của tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này tiếp nối công thức dẫn nhập lời nói và báo hiệu nội dung trực tiếp ở câu sau; “rằng” diễn đạt chức năng ấy tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo tồn tính chất danh riêng, trong khi chú thích cho biết cách dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm được dùng vì công thức này dẫn vào lời phán ở câu tiếp theo. Chú thích được đặt ngay sau “Yahweh”, là từ mà chú thích giải thích.
