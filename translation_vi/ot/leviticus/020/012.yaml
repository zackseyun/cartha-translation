  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: vi
  text: Nếu một người đàn ông ăn nằm với con dâu mình, cả hai đều phải bị xử tử. Họ đã làm một điều đồi bại[a]; máu của họ đổ trên đầu họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một điều ô nhục,” “một hành vi trái luân thường” hoặc “một sự đảo lộn.” Trong ngữ cảnh luật pháp này, từ Hê-bơ-rơ תֶּבֶל chỉ một hành vi bị xem là đảo lộn trật tự đạo đức.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “họ phải tự chịu trách nhiệm về cái chết của mình.” Thành ngữ Hê-bơ-rơ này quy trách nhiệm về án tử cho chính những người phạm tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Nếu một người đàn ông
  rationale: Trong công thức luật theo trường hợp, cụm này tự nhiên mang nghĩa điều kiện. “Người đàn ông” giữ đúng chủ thể giống đực số ít của nguyên văn.
- source_word: יִשְׁכַּב אֶת
  choice: ăn nằm với
  rationale: Đây là thành ngữ chỉ quan hệ tình dục. “Ăn nằm với” rõ nghĩa, trang trọng vừa phải và giữ được tính thành ngữ của nguyên văn.
- source_word: כַּלָּתוֹ
  choice: con dâu mình
  rationale: כַּלָּה trong ngữ cảnh này chỉ vợ của con trai; “con dâu” là từ chỉ quan hệ thân tộc chính xác.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: cả hai đều nhất định phải bị xử tử
  rationale: “Cả hai đều” thể hiện rõ שְׁנֵיהֶם, còn “nhất định phải bị xử tử” chuyển tải cấu trúc nhấn mạnh gồm động từ nguyên mẫu tuyệt đối và động từ hữu hạn.
- source_word: תֶּבֶל עָשׂוּ
  choice: Họ đã làm một điều đồi bại
  rationale: תֶּבֶל mô tả một hành vi bị xem là đảo lộn trật tự đạo đức trong luật lệ tình dục. “Điều đồi bại” giữ sức nặng luân lý mà không diễn giải quá mức.
- source_word: דְּמֵיהֶם בָּם
  choice: máu của họ ở trên chính họ
  rationale: Giữ hình ảnh pháp lý của tiếng Hê-bơ-rơ, theo đó chính những người phạm tội chịu trách nhiệm về cái chết của mình; “chính” làm rõ đại từ hồi chỉ בָּם.
theological_decisions:
- issue: Chủ thể mang giới tính trong điều luật
  choice: người đàn ông
  alternative: một người; người nào
  rationale: אִישׁ là danh từ giống đực số ít và trong điều luật này chỉ người nam, nên bản dịch không trung tính hóa giới tính của chủ thể.
- issue: Sắc thái đạo đức của תֶּבֶל
  choice: một điều đồi bại
  alternative: một điều ô nhục; một hành vi trái luân thường; một sự đảo lộn
  rationale: Nguyên văn tự thân kết án hành vi bằng một từ chỉ sự lệch lạc nghiêm trọng. Cách dịch này giữ lời phán xét của câu nhưng không bổ sung một hệ thống giải thích giáo phái.
- issue: Ý nghĩa thành ngữ דְּמֵיהֶם בָּם
  choice: giữ thành ngữ “máu của họ ở trên chính họ” trong chính văn
  alternative: họ phải tự chịu trách nhiệm về cái chết của mình; tội làm đổ máu thuộc về họ
  rationale: Cách dịch sát hình ảnh bảo tồn sức nặng pháp lý và sự căng thẳng của nguyên văn; chú thích giải thích ý quy trách nhiệm mà không thay thế hình ảnh bằng một diễn giải duy nhất.
translation_notes:
  register: Văn phong pháp lý, trang nghiêm nhưng dùng tiếng Việt hiện đại và dễ hiểu. “Ăn nằm với” là thành ngữ phổ thông, không thô tục; “bị xử tử” diễn đạt rõ hình phạt pháp lý. Các dấu chú thích [a], [b] được đặt đúng sau những cụm từ mà chúng giải thích.
