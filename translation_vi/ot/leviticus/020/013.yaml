reference: Leviticus 20:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: vi
  text: Nếu một người đàn ông nằm với một người nam như người ta nằm với đàn bà[a], thì cả hai đã làm điều ghê tởm. Chắc chắn cả hai phải bị xử tử; máu của họ đổ lại trên chính họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “những sự nằm của đàn bà”, một thành ngữ chỉ việc giao hợp với đàn bà.
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “máu của họ ở trên họ”; đây là thành ngữ quy trách nhiệm về cái chết cho chính họ. Hoặc: “tội đổ máu của họ ở trên họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Nếu một người đàn ông
  rationale: Trong công thức luật theo trường hợp, cụm này tự nhiên mang nghĩa điều kiện “nếu một người đàn ông”, thay vì dịch máy móc là “và một người đàn ông là người”.
- source_word: יִשְׁכַּב אֶת
  choice: nằm với
  rationale: Đây là thành ngữ chỉ quan hệ tình dục; “nằm với” vừa bám sát hình ảnh Hê-bơ-rơ vừa trang trọng và dễ hiểu.
- source_word: זָכָר
  choice: một người nam
  rationale: זָכָר nghĩa là “giống đực/người nam”, khác với אִישׁ là “người đàn ông”; cách dịch này giữ được phần nào sự phân biệt từ vựng mà vẫn tự nhiên trong tiếng Việt.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: như nằm với đàn bà
  rationale: Cụm số nhiều theo nghĩa đen là “những sự nằm của đàn bà”, một thành ngữ chỉ việc giao hợp với phụ nữ. Bản dịch chuyển đạt nghĩa thành ngữ mà không mở rộng sang thuật ngữ căn tính hiện đại.
- source_word: תּוֹעֵבָה
  choice: điều ghê tởm
  rationale: Từ này chỉ điều bị xem là đáng ghê tởm trong ngữ cảnh luật giao ước; lựa chọn này giữ sắc thái nghiêm trọng và tự nhiên hơn “sự gớm ghiếc” trong tiếng Việt hiện đại.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: cả hai đã làm
  rationale: Giữ nguyên sự nhấn mạnh rõ ràng của nguyên văn rằng cả hai người đều thực hiện hành vi ấy.
- source_word: מוֹת יוּמָתוּ
  choice: Chắc chắn họ phải bị xử tử
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ thụ động nhấn mạnh tính chắc chắn của hình phạt; câu dịch giữ cả sắc thái nhấn mạnh lẫn thể bị động.
- source_word: דְּמֵיהֶם בָּם
  choice: máu của họ ở trên chính họ
  rationale: Giữ hình ảnh pháp lý–đạo đức của thành ngữ Hê-bơ-rơ, quy trách nhiệm về cái chết cho chính những người chịu án; chú thích nêu nghĩa khả dĩ “tội đổ máu”.
theological_decisions:
- issue: Diễn đạt một điều luật gây tranh luận về đạo đức và văn hóa
  choice: Dịch trực tiếp hành vi cụ thể được mô tả trong tiếng Hê-bơ-rơ, cùng hình phạt được nêu, không giảm nhẹ hay mở rộng.
  alternative: Dùng những thuật ngữ khái quát hoặc gắn với căn tính hiện đại như “hành vi đồng tính”.
  rationale: Nguyên văn mô tả một hành vi bằng ngôn ngữ luật pháp chứ không nêu một phạm trù căn tính hiện đại. Bản dịch không đưa thêm khuôn khổ khái niệm ngoài văn bản.
- issue: Phân biệt אִישׁ và זָכָר
  choice: “người đàn ông” và “người nam”
  alternative: Dịch cả hai là “người đàn ông”, hoặc dùng ngôn ngữ trung tính về giới.
  rationale: Nguyên văn dùng hai danh từ khác nhau và đều mang nghĩa giống đực; bản dịch giữ sự khác biệt ở mức tiếng Việt cho phép.
- issue: Ý nghĩa của דְּמֵיהֶם בָּם
  choice: Giữ thành ngữ “máu của họ ở trên chính họ” trong chính văn.
  alternative: Diễn giải ngay là “họ phải tự chịu trách nhiệm về cái chết của mình” hoặc “tội đổ máu của họ ở trên họ”.
  rationale: Cách dịch sát giữ được hình ảnh và độ căng nghĩa của nguyên văn; chú thích cung cấp cách hiểu pháp lý khả dĩ mà không biến diễn giải thành chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và trực tiếp, phù hợp văn phong luật pháp Kinh Thánh. “Đàn bà” được giữ trong vế thành ngữ để tạo đối ứng tự nhiên với “người nam”; không dùng thuật ngữ căn tính hiện đại. Tất cả dấu chú thích [a], [b] đều xuất hiện trong chính văn.
