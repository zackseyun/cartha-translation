    issue: Quan hệ giữa “theo người ấy” và “làm điếm theo Mô-léc” chưa rõ
    rationale: Cách diễn đạt “chạy theo người ấy mà làm điếm theo Mô-léc” có thể bị hiểu là hai hành động nối tiếp. Cấu trúc nguyên văn xác định những người theo người ấy chính là những người làm điếm theo Mô-léc. Bỏ “chạy” và dùng cấu trúc trực tiếp giúp phản ánh điều này rõ hơn.
  - severity: low
    issue: “gia đình người” không thật tự nhiên trong văn xuôi hiện đại
    rationale: Thêm “của” và lặp lại “người ấy” tạo cách nói tự nhiên hơn mà không thay đổi phạm vi rộng của מִשְׁפָּחָה.
