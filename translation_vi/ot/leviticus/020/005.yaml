base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: vi
  text: thì chính Ta sẽ hướng mặt chống lại người ấy và gia đình của người ấy. Ta sẽ trừ bỏ[b] người ấy cùng tất cả những kẻ theo người ấy mà làm điếm[a] theo Mô-léc, khỏi giữa dân của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng động từ chỉ việc làm điếm như một ẩn dụ cho sự bất trung với giao ước khi chạy theo thần khác.
    reason: lexical_alternative
  - marker: b
    text: “Trừ bỏ” là cách nói về sự phán xét trong giao ước; ở đây câu không xác định việc ấy xảy ra bằng cái chết, sự trục xuất hay một hình thức loại bỏ nào khác của Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: thì chính Ta sẽ hướng mặt chống lại
  rationale: Giữ hình ảnh Hê-bơ-rơ về việc Đức Chúa Trời hướng mặt về phía một người để chống lại và phán xét người ấy; “chính Ta” thể hiện sự nhấn mạnh của אֲנִי.
- source_word: בָּאִישׁ הַהוּא
  choice: người ấy
  rationale: Trong tiếng Việt, “người ấy” tự nhiên và vẫn chỉ đích danh cá nhân nam đã được nói đến trong ngữ cảnh, không cần lặp một cách nặng nề là “người đàn ông ấy”.
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: và gia đình người
  rationale: מִשְׁפָּחָה có thể chỉ gia đình hoặc nhóm thân tộc; “gia đình” là cách diễn đạt hiện đại, dễ hiểu và không thu hẹp thành riêng một hộ gia cư.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: Ta sẽ trừ bỏ người ấy
  rationale: “Trừ bỏ” diễn đạt sự loại khỏi cộng đồng do phán xét giao ước mà không tự ý xác định phương thức là xử tử, trục xuất hay một hình thức hủy diệt khác.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו
  choice: cùng tất cả những kẻ chạy theo người ấy mà làm điếm
  rationale: “Chạy theo” diễn đạt thành ngữ אַחֲרָיו một cách tự nhiên; “làm điếm” giữ nguyên ẩn dụ mạnh về sự bất trung tình dục dùng cho việc phản bội giao ước và thờ thần khác.
- source_word: לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: mà làm điếm theo Mô-léc
  rationale: Giữ sự lặp lại có chủ ý của động từ זנה và mối liên hệ giữa việc theo người phạm tội với việc theo Mô-léc, đồng thời tránh làm phẳng ẩn dụ thành “thờ thần tượng”.
- source_word: הַמֹּלֶךְ
  choice: Mô-léc
  rationale: Dùng dạng phiên âm tiếng Việt của tên riêng vị thần được nói đến trong ngữ cảnh; mạo từ Hê-bơ-rơ không cần thể hiện riêng trước tên riêng trong tiếng Việt.
- source_word: מִקֶּרֶב עַמָּם
  choice: khỏi giữa dân của họ
  rationale: Phản ánh thành ngữ chỉ sự loại khỏi cộng đồng và giữ hậu tố số nhiều “của họ”, tương ứng với toàn bộ nhóm đối tượng bị trừ bỏ.
theological_decisions:
- issue: Giữ ẩn dụ bất trung tình dục đối với việc thờ thần khác
  choice: Dùng “làm điếm” trong chính văn.
  alternative: Dịch giải nghĩa thành “bất trung”, “phản đạo” hoặc “thờ thần tượng”.
  rationale: Nguyên văn cố ý dùng ngôn ngữ tình dục mạnh để mô tả sự bất trung giao ước. Giữ ẩn dụ bảo toàn sức nặng tu từ và thần học, còn chú thích làm rõ nghĩa bóng.
- issue: Ý nghĩa của hình phạt כרת
  choice: Dùng “trừ bỏ” mà không xác định cơ chế.
  alternative: Dịch thành “giết chết”, “trục xuất” hoặc “hủy diệt”.
  rationale: Câu này khẳng định sự phán xét và loại khỏi dân nhưng không nói rõ hình thức thực hiện; bản dịch không nên giải quyết thay sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Đại từ “Ta” phù hợp với lời Đức Chúa Trời phán. Cấu trúc được chia thành hai câu để tiếng Việt sáng rõ hơn mà vẫn giữ quan hệ liên tục với câu trước qua từ “thì”. Các dấu chú thích được đặt ngay sau đúng thuật ngữ cần giải thích, sửa sự lệch vị trí trong lớp tham khảo tiếng Anh.
