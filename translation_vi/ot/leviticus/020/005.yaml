  verdict: revise
  source_fidelity: 'Bản dịch giữ được sự nhấn mạnh của “chính Ta,” thành ngữ Đức Chúa Trời hướng mặt chống lại, tính bất định của “trừ bỏ,” và hậu tố số nhiều trong “dân của họ.” Tuy nhiên, cụm “chạy theo người ấy mà làm điếm theo Mô-léc” làm quan hệ cú pháp giữa hai lần dùng זנה kém rõ: nguyên văn nói về những kẻ “làm điếm theo người ấy,” tức là theo người ấy trong việc làm điếm theo Mô-léc, chứ không đơn thuần là chạy theo người ấy rồi làm điếm.'
  naturalness: Văn phong nhìn chung hiện đại và trang nghiêm. “Gia đình người” hơi gượng trong tiếng Việt hiện đại; “gia đình của người ấy” tự nhiên hơn. “Theo người ấy mà làm điếm theo Mô-léc” rõ nghĩa hơn “chạy theo người ấy mà làm điếm theo Mô-léc” và vẫn giữ được phép ẩn dụ lặp lại của nguyên văn.
  terminology: “Ta,” “hướng mặt chống lại,” “trừ bỏ,” và “Mô-léc” phù hợp. Giữ “làm điếm” là một lựa chọn sát ẩn dụ mạnh của זנה; chú thích cần tiếp tục giải thích đây là nghĩa bóng về sự bất trung giao ước, không biến nó thành một khẳng định về hành vi tình dục theo nghĩa đen.
  issues:
