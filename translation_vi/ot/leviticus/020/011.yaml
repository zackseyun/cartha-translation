  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: vi
  text: Nếu một người đàn ông nằm với vợ của cha mình, người ấy đã làm lộ sự lõa lồ của cha mình[a]. Cả hai chắc chắn phải bị xử tử; máu họ sẽ đổ trên chính họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, theo lối diễn giải rõ nghĩa hơn: “người ấy đã làm nhục cha mình về mặt tình dục.” Tiếng Hê-bơ-rơ theo nghĩa đen là “người ấy đã làm lộ sự lõa lồ của cha mình,” một thành ngữ cố định trong Lê-vi Ký chỉ hành vi vi phạm điều cấm về tình dục.'
    reason: lexical_alternative
  - marker: b
    text: Đây là một công thức pháp lý Hê-bơ-rơ, cho biết chính họ phải chịu trách nhiệm về cái chết của mình.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Nếu một người đàn ông
  rationale: Trong văn cảnh luật pháp theo tình huống, cụm liên từ, danh từ và đại từ quan hệ dẫn vào một điều kiện. Cách dịch này tự nhiên trong tiếng Việt và giữ đúng chủ thể nam giới cụ thể.
- source_word: יִשְׁכַּב אֶת
  choice: nằm với
  rationale: Đây là thành ngữ chỉ quan hệ tình dục trong các luật về tính dục. “Nằm với” giữ được sắc thái trang trọng, uyển ngữ và gần hình thức Hê-bơ-rơ.
- source_word: אֵשֶׁת אָבִיו
  choice: vợ của cha mình
  rationale: Bản Hê-bơ-rơ nói trực tiếp là “vợ của cha mình”; dịch là “mẹ kế” sẽ thu hẹp nghĩa và thêm một danh xưng thân thuộc không có trong nguyên văn.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: người ấy đã phơi bày sự trần truồng của cha mình
  rationale: Giữ lại thành ngữ cố định trong Lê-vi Ký và mối liên hệ với các luật ở chương 18 và 20. Thể hoàn thành diễn tả hành vi đã phạm, làm căn cứ cho hình phạt.
- source_word: מוֹת יוּמְתוּ
  choice: chắc chắn phải bị xử tử
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ hữu hạn tạo ý nhấn mạnh. Cách dịch này truyền đạt cả tính bắt buộc lẫn mức độ chắc chắn của hình phạt mà không thêm phương thức hành quyết.
- source_word: שְׁנֵיהֶם
  choice: cả hai
  rationale: Giữ rõ rằng hình phạt áp dụng cho cả hai người tham gia.
- source_word: דְּמֵיהֶם בָּם
  choice: máu của họ ở trên chính họ
  rationale: Giữ hình ảnh và công thức pháp lý Hê-bơ-rơ, đồng thời “chính họ” làm rõ rằng họ tự chịu trách nhiệm về cái chết của mình.
theological_decisions:
- issue: Cách chuyển thành ngữ về hành vi tình dục mà không làm mất sức nặng kinh điển và luân lý
  choice: đã phơi bày sự trần truồng của cha mình
  alternative: đã làm nhục cha mình về mặt tình dục
  rationale: Nguyên văn dùng một thành ngữ đặc trưng của Bộ luật Thánh Khiết, không chỉ là lời mô tả chung về sai phạm tình dục. Giữ thành ngữ bảo tồn liên hệ nội văn và tránh áp đặt một lối diễn giải hẹp hơn.
- issue: Chủ thể mang giới tính trong điều luật
  choice: Nếu một người đàn ông
  alternative: Nếu ai
  rationale: Tiếng Hê-bơ-rơ dùng danh từ giống đực số ít và điều luật này nói cụ thể về người phạm tội là nam giới; vì vậy không trung tính hóa chủ thể.
- issue: Trách nhiệm đối với án tử hình
  choice: máu của họ ở trên chính họ
  alternative: họ phải tự chịu trách nhiệm về cái chết của mình
  rationale: Giữ nguyên công thức pháp lý giàu hình ảnh, nhưng kèm chú thích để người đọc hiện đại hiểu rằng công thức quy trách nhiệm cho chính những người phạm tội.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu; duy trì cấu trúc luật theo tình huống, thành ngữ chủ chốt của Lê-vi Ký và sức nhấn mạnh của án phạt. Dùng “xử tử” để diễn đạt rõ hình phạt pháp lý, còn công thức “máu ... ở trên” được giữ trong chính văn và giải thích bằng chú thích.
