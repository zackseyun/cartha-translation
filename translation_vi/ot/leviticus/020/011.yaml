  to: Nếu một người đàn ông nằm với vợ của cha mình, người ấy đã làm lộ sự lõa lồ của cha mình[a]. Cả hai chắc chắn phải bị xử tử; máu họ sẽ đổ trên chính họ[b].
  rationale: Bản sửa giữ cấu trúc điều kiện, tính nhấn mạnh của án phạt, thuật ngữ thân thuộc và tính mơ hồ có chủ ý của thành ngữ Hê-bơ-rơ. Hai điều chỉnh chỉ nhằm làm tiếng Việt tự nhiên hơn và giảm nguy cơ hiểu sai hình ảnh trong chính văn, không thay đổi nghĩa hay thêm diễn giải giáo phái.
