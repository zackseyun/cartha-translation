  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: vi
  text: Vậy, các ngươi phải phân biệt loài vật thanh sạch với loài vật ô uế, và loài chim ô uế với loài chim thanh sạch. Các ngươi không được khiến chính mình[b] trở nên đáng ghê tởm[a] bởi loài vật, loài chim hay bất cứ loài nào bò trên đất mà Ta đã phân riêng cho các ngươi là ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho chính mình trở nên khả ố.” Động từ Hê-bơ-rơ thuộc trường nghĩa “ghê tởm, khả ố,” không phải động từ thông thường có nghĩa “trở nên ô uế.”'
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen, tiếng Hê-bơ-rơ là “các linh hồn” hoặc “con người của các ngươi”; trong thành ngữ này, nghĩa là “chính mình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: Vậy, các ngươi phải phân biệt
  rationale: Dạng Hiphil của בדל diễn tả việc tạo lập hoặc duy trì sự phân biệt. “Phân biệt” tự nhiên trong tiếng Việt và phù hợp với việc nhận định các phạm trù thanh sạch, ô uế; “vậy” thể hiện liên kết với văn mạch.
- source_word: הַבְּהֵמָה
  choice: loài vật
  rationale: Danh từ chỉ phạm trù động vật trên cạn nói chung trong văn mạch này; “loài vật” vừa rộng vừa dễ hiểu.
- source_word: הַטְּהֹרָה / הַטְּמֵא / הַטְּמֵאָה / הַטָּהֹר
  choice: thanh sạch / ô uế
  rationale: Đây là các phạm trù thanh sạch theo luật Lê-vi, không đơn thuần là đánh giá vệ sinh hay đạo đức. Cặp từ truyền thống này rõ nghĩa và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: הָעוֹף
  choice: loài chim
  rationale: עוֹף có thể rộng hơn là sinh vật bay, nhưng trong văn mạch quy định thức ăn, “loài chim” là cách diễn đạt tự nhiên và thích hợp nhất.
- source_word: וְלֹא תְשַׁקְּצוּ אֶת נַפְשֹׁתֵיכֶם
  choice: Các ngươi không được làm cho chính mình trở nên đáng ghê tởm
  rationale: Giữ trường nghĩa ghê tởm của שׁקץ và sắc thái phản thân của cụm có נַפְשֹׁתֵיכֶם, đồng thời không đồng nhất động từ này với thuật ngữ “làm ô uế”.
- source_word: בַּבְּהֵמָה וּבָעוֹף
  choice: bởi loài vật, loài chim
  rationale: Giới từ ב chỉ phương tiện hoặc nguyên nhân khiến họ trở nên đáng ghê tởm; “bởi” giữ quan hệ này súc tích.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: hay bất cứ loài nào bò trên đất
  rationale: רמשׂ chỉ sự bò hoặc di chuyển sát mặt đất. Cách dịch này tự nhiên, đủ rộng và không đưa thêm sắc thái “lúc nhúc” của một gốc từ khác.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: mà Ta đã phân riêng cho các ngươi là ô uế
  rationale: “Phân riêng” phản ánh lại cùng gốc בדל, còn “là ô uế” diễn đạt chức năng phân loại của לְטַמֵּא mà không ngụ ý bản chất đạo đức.
theological_decisions:
- issue: Ngôn ngữ phạm trù nghi lễ hay cách diễn giải mang tính đạo đức
  choice: thanh sạch / ô uế như các phạm trù thanh sạch trong giao ước
  alternative: trong sạch / không trong sạch; tinh sạch / bất khiết
  rationale: Câu này nói đến những sự phân biệt Israel phải tuân giữ trong luật về sự thánh khiết. Cặp “thanh sạch / ô uế” giữ nguyên phạm trù Lê-vi mà không biến nó thành nhận xét thuần đạo đức hoặc vệ sinh.
- issue: Ý nghĩa của נֶפֶשׁ trong אֶת נַפְשֹׁתֵיכֶם
  choice: 'chỉ chính con người họ: “chính mình”'
  alternative: linh hồn các ngươi
  rationale: Trong thành ngữ này, נֶפֶשׁ chỉ toàn thể con người, không nhất thiết nói riêng đến một linh hồn phi vật chất. “Chính mình” truyền đạt đúng chức năng phản thân.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “các ngươi” vì lời phán trực tiếp ở số nhiều trong bối cảnh luật giao ước; viết hoa “Ta” để chỉ Đức Chúa Trời. Giữ thuật ngữ “thanh sạch / ô uế” nhất quán với ngôn ngữ nghi lễ của sách Lê-vi.
