    rationale: Chú thích trong dấu vết kiểm định tiếng Anh cho cụm אֶת נַפְשֹׁתֵיכֶם phải được đặt sau “chính mình” và giải thích rằng nghĩa đen là “các linh hồn/người của các ngươi,” một thành ngữ chỉ chính bản thân họ.
  - severity: low
