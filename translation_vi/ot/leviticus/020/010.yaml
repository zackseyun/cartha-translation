revisions:
- from: Nếu một người đàn ông ngoại tình với vợ của người khác—tức là ngoại tình với vợ của người lân cận mình—thì cả người đàn ông ngoại tình lẫn người đàn bà ngoại tình đều nhất định phải bị xử tử.[a]
  to: Nếu một người đàn ông ngoại tình với vợ của người khác—tức là ngoại tình với vợ của người lân cận của mình—thì cả người đàn ông ngoại tình lẫn người phụ nữ ngoại tình đều nhất định phải bị xử tử.[a]
  rationale: Chỉ điều chỉnh cách diễn đạt tiếng Việt để làm rõ quan hệ sở hữu trong “người lân cận của mình” và dùng từ ngữ hiện đại, trung tính hơn cho người nữ. Nghĩa pháp lý, sự lặp lại của nguyên văn, tính nhấn mạnh của công thức tử hình, và việc không nêu phương thức thi hành đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
