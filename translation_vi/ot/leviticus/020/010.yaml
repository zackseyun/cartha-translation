source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: vi
  text: Nếu một người đàn ông ngoại tình với vợ của người khác—tức là ngoại tình với vợ của người lân cận của mình—thì cả người đàn ông ngoại tình lẫn người phụ nữ ngoại tình đều nhất định phải bị xử tử.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “với vợ của một người đàn ông… với vợ của người lân cận của mình.” Sự lặp lại có tác dụng nhấn mạnh và xác định rõ hành vi theo văn phong pháp luật.'
    reason: Giải thích cách diễn đạt sát chữ và chức năng của sự lặp lại trong nguyên văn.
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Nếu một người đàn ông
  rationale: Trong công thức luật nêu trường hợp, liên từ kết hợp với danh từ và đại từ quan hệ mang chức năng điều kiện; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ giống đực số ít của nguyên văn.
- source_word: יִנְאַף
  choice: ngoại tình
  rationale: Động từ נאף chỉ hành vi ngoại tình, không phải tình dục vô luân nói chung.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: với vợ của người khác
  rationale: Nghĩa sát là “với vợ của một người đàn ông”; “vợ của người khác” diễn đạt tự nhiên rằng người phụ nữ là vợ của một người đàn ông khác, không phải của người phạm tội.
- source_word: אֲשֶׁר יִנְאַף אֶת אֵשֶׁת רֵעֵהוּ
  choice: tức là ngoại tình với vợ của người lân cận mình
  rationale: Giữ sự lặp lại nhằm bảo toàn sắc thái nhấn mạnh và xác định rõ hành vi trong văn phong pháp luật; “tức là” biểu thị chức năng giải thích của mệnh đề lặp.
- source_word: רֵעֵהוּ
  choice: người lân cận mình
  rationale: רֵעַ ở đây chỉ một người cùng cộng đồng, không nhất thiết chỉ người sống bên cạnh; “người lân cận” là cách dịch quen thuộc và đủ rộng trong ngữ cảnh luật giao ước.
- source_word: מוֹת יוּמַת
  choice: nhất định phải bị xử tử
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh án tử hình; “nhất định phải” chuyển tải sức nhấn mạnh, còn thể bị động không nêu chủ thể thi hành hay phương thức.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: cả người đàn ông ngoại tình lẫn người đàn bà ngoại tình
  rationale: Hai phân từ danh hóa giống đực và giống cái xác định rõ cả hai bên phạm tội; cách diễn đạt đối xứng này giữ nguyên sự phân biệt giới tính mà vẫn tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ pháp luật có phân biệt giới tính
  choice: Giữ “người đàn ông” trong trường hợp luật và nêu rõ “người đàn ông ngoại tình” cùng “người đàn bà ngoại tình” trong hình phạt.
  alternative: Nếu ai ngoại tình... cả hai người đều phải bị xử tử.
  rationale: Nguyên văn Hê-bơ-rơ nêu rõ giới tính trong phần mô tả trường hợp và dùng hai phân từ giống đực, giống cái cho hai người chịu án; bản dịch không trung hòa chi tiết này.
- issue: Công thức hình phạt tử hình
  choice: Dịch là “nhất định phải bị xử tử” mà không nói rõ phương thức.
  alternative: phải bị hành quyết theo một phương thức cụ thể
  rationale: Câu này nhấn mạnh án tử hình nhưng không cho biết phương thức; bản dịch không bổ sung chi tiết từ đoạn khác hoặc từ truyền thống giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng, phù hợp một điều luật. Dùng “xử tử” thay vì cách nói cổ; giữ sự lặp lại có chủ ý của tiếng Hê-bơ-rơ nhưng thêm “tức là” để quan hệ giải thích được tự nhiên trong tiếng Việt.
