- from: 'Nhưng Ta đã phán với các ngươi: “Các ngươi sẽ chiếm hữu đất của chúng, và chính Ta sẽ ban đất ấy cho các ngươi làm sản nghiệp”[a]—một xứ đượm sữa và mật[b]. Ta là Yahweh[c], Đức Chúa Trời của các ngươi, Đấng đã phân rẽ các ngươi khỏi các dân[d].'
  to: 'Nhưng Ta đã phán với các ngươi: “Các ngươi sẽ chiếm hữu đất của họ[a], và chính Ta sẽ ban đất ấy cho các ngươi để các ngươi chiếm hữu đất ấy”—một xứ chảy sữa và mật[b]. Ta là Yahweh[c], Đức Chúa Trời của các ngươi, Đấng đã phân rẽ các ngươi khỏi các dân[d].'
  rationale: Bản sửa khôi phục cách diễn đạt động từ và đối tượng rõ ràng của לָרֶשֶׁת אֹתָהּ, dùng đại từ trung tính khi nói về các dân, và thay thành ngữ ít tự nhiên bằng lối nói tiếng Việt chuẩn, quen thuộc. Các chú thích được giữ đủ bốn mục và đặt tại các đơn vị văn bản liên quan.
