source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: vi
  text: 'Nhưng Ta đã phán với các ngươi: “Các ngươi sẽ chiếm hữu đất của họ[a], và chính Ta sẽ ban đất ấy cho các ngươi để các ngươi chiếm hữu đất ấy”—một xứ chảy sữa và mật[b]. Ta là Yahweh[c], Đức Chúa Trời của các ngươi, Đấng đã phân rẽ các ngươi khỏi các dân[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ được dịch là “chiếm hữu” ở đây cũng có thể mang nghĩa “thừa hưởng.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “một xứ chảy sữa và mật,” một thành ngữ chỉ sự trù phú và màu mỡ.'
    reason: cultural_note
  - marker: c
    text: 'Hê-bơ-rơ: YHWH; theo truyền thống thường được dịch là “CHÚA.”'
    reason: alternative_reading
  - marker: d
    text: 'Cũng có thể dịch: “Đấng đã biệt riêng các ngươi khỏi các dân.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Nhưng Ta đã phán
  rationale: Liên từ waw tiếp nối mạch diễn ngôn, còn “nhưng” diễn đạt sự tương phản với bối cảnh các điều cấm và sự phân biệt; “phán” phù hợp với lời Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: תִּירְשׁוּ ... לָרֶשֶׁת אֹתָהּ
  choice: sẽ chiếm hữu ... làm sản nghiệp
  rationale: Động từ ירשׁ bao hàm cả việc chiếm hữu và thừa hưởng. Dùng hai cách diễn đạt tự nhiên trong tiếng Việt để giữ cả sắc thái chủ động lẫn ý niệm đất được ban.
- source_word: אַדְמָתָם
  choice: đất của chúng
  rationale: אדמה chỉ đất đai/lãnh thổ trong ngữ cảnh này; “đất” tự nhiên và sát nghĩa.
- source_word: וַאֲנִי אֶתְּנֶנָּה
  choice: và chính Ta sẽ ban đất ấy
  rationale: Đại từ độc lập אֲנִי mang tính nhấn mạnh, được thể hiện bằng “chính Ta”; hậu tố giống cái chỉ lại vùng đất nên được nói rõ là “đất ấy” trong tiếng Việt.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: một xứ đượm sữa và mật
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ về sự phong phú và màu mỡ, đồng thời dùng cách nói tiếng Việt trang trọng, dễ hiểu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng thần thánh YHWH thay vì thay thế bằng một tước hiệu.
- source_word: הִבְדַּלְתִּי
  choice: đã phân rẽ
  rationale: בדל có nghĩa phân cách hoặc biệt riêng. “Phân rẽ” trực tiếp, giữ liên hệ với chủ đề phân biệt trong chương mà không diễn giải thêm.
- source_word: הָעַמִּים
  choice: các dân
  rationale: עמים nói đến các cộng đồng dân tộc; “các dân” sát nghĩa và không nhất thiết mang sắc thái chính trị của “các quốc gia”.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH; giữ dưới dạng Yahweh bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của việc Israel được tách khỏi các dân
  choice: Đấng đã phân rẽ các ngươi khỏi các dân
  alternative: Đấng đã biệt riêng các ngươi khỏi các dân
  rationale: “Phân rẽ” phản ánh trực tiếp בדל và giữ nguyên phát biểu của câu, không mở rộng thành một hệ thống thần học về sự tuyển chọn hay thánh hóa.
- issue: Sắc thái của ירשׁ
  choice: chiếm hữu ... làm sản nghiệp
  alternative: thừa hưởng ... để thừa hưởng
  rationale: Lựa chọn này bảo tồn sự căng thẳng từ vựng giữa tiếp nhận đất như quà ban và thực sự nắm quyền sở hữu đất, thay vì thu hẹp động từ vào chỉ một nghĩa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ta/các ngươi” phản ánh lời phán trực tiếp của Đức Chúa Trời với cộng đồng Israel. “Xứ” được dùng trong thành ngữ về miền đất hứa, còn “đất” trong các mệnh đề sở hữu để lời văn tự nhiên. Mọi dấu chú thích đều đặt ngay sau nội dung liên quan.
