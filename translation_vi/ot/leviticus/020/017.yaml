  to: Nếu một người đàn ông lấy chị hoặc em gái mình—con gái của cha mình hoặc con gái của mẹ mình—và thấy sự trần truồng của cô ấy, còn cô ấy thấy sự trần truồng của người ấy, thì đó là điều ô nhục[a]. Cả hai sẽ bị loại bỏ trước mắt con dân của họ[b]. Người đàn ông ấy đã phơi bày sự trần truồng của chị hoặc em gái mình; người ấy phải mang tội mình.
  rationale: Bản sửa bảo toàn các thành ngữ pháp lý và sự mơ hồ của nguyên văn, nhất là đối với hình phạt כרת; đồng thời làm rõ quan hệ chị/em gái, chuẩn hóa cách quy chiếu, và dùng tiếng Việt hiện đại, tự nhiên hơn. Các chú thích vẫn được đặt đúng tại “điều ô nhục” và hình phạt bị loại bỏ.
