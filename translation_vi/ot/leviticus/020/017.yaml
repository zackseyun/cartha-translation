source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: vi
  text: Nếu một người đàn ông lấy chị hoặc em gái mình—con gái của cha mình hoặc con gái của mẹ mình—và thấy sự trần truồng của cô ấy, còn cô ấy thấy sự trần truồng của người ấy, thì đó là điều ô nhục[a]. Cả hai sẽ bị loại bỏ trước mắt con dân của họ[b]. Người đàn ông ấy đã phơi bày sự trần truồng của chị hoặc em gái mình; người ấy phải mang tội mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây có thể dịch là “việc đáng hổ thẹn” hoặc “điều đáng chê trách”. Đây là nghĩa âm tính hiếm gặp của חֶסֶד, chứ không phải nghĩa thông thường là “lòng nhân từ” hay “tình yêu bền vững”.
    reason: lexical_alternative
  - marker: b
    text: Công thức Hê-bơ-rơ theo sát nghĩa là “bị cắt khỏi”. Câu này không nói rõ hình phạt là cái chết, sự trục xuất hay một hình thức loại bỏ khác.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: Giữ giống đực số ít của công thức luật pháp Hê-bơ-rơ, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: יִקַּח
  choice: lấy
  rationale: Động từ có nghĩa cơ bản là “lấy”, trong ngữ cảnh này có thể hàm ý lấy làm vợ hoặc chiếm lấy về tình dục; bản dịch không xác định quá mức điều nguyên văn để ngỏ.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: chị em gái mình—con gái của cha mình hoặc con gái của mẹ mình
  rationale: “Chị em gái” bao quát cả chị lẫn em; phần giải thích giữ rõ rằng luật áp dụng cả chị em cùng cha lẫn cùng mẹ.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: và thấy sự lõa lồ của nàng, còn nàng thấy sự lõa lồ của người ấy
  rationale: Giữ hình ảnh và thành ngữ pháp lý “thấy sự lõa lồ”, thay vì diễn giải thẳng thành quan hệ tình dục; “còn” thể hiện hai phía của hành vi.
- source_word: חֶסֶד
  choice: điều ô nhục
  rationale: Trong cách dùng âm tính hiếm gặp tại đây, từ này chỉ một việc đáng hổ thẹn, không mang nghĩa thông thường là lòng nhân từ hay tình yêu bền vững.
- source_word: וְנִכְרְתוּ
  choice: phải bị truất khỏi cộng đồng
  rationale: “Truất khỏi cộng đồng” truyền đạt công thức כרת theo cách rõ ràng nhưng vẫn không quyết định cơ chế hình phạt là xử tử, trục xuất hay một hình thức loại bỏ khác.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: ngay trước mắt đồng bào mình
  rationale: Giữ ý công khai “trước mắt” và chuyển thành ngữ “con cái của dân họ” sang cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: גִּלָּה
  choice: đã phơi bày
  rationale: Giữ thành ngữ về việc làm lộ sự lõa lồ vốn được dùng xuyên suốt các luật cấm quan hệ tình dục trong Lê-vi Ký.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: phải mang lấy tội lỗi mình
  rationale: Giữ sức nặng pháp lý-thần học của công thức Hê-bơ-rơ, vốn có thể bao gồm cả tội trạng lẫn hậu quả của tội.
theological_decisions:
- issue: Nghĩa của חֶסֶד trong câu này
  choice: 'nghĩa âm tính: “điều ô nhục”'
  alternative: nghĩa thông thường “lòng nhân từ” hoặc “tình yêu bền vững”
  rationale: Ngữ cảnh luật cấm loạn luân đòi hỏi nghĩa âm tính hiếm gặp; dịch theo nghĩa tích cực thông thường sẽ trái với ngữ cảnh.
- issue: Tính chất của hình phạt כרת
  choice: giữ công thức loại khỏi cộng đồng mà không xác định phương thức
  alternative: diễn giải cụ thể là xử tử, trục xuất hoặc tuyệt tự
  rationale: Nguyên văn không tự xác định chính xác cơ chế hình phạt tại đây, nên bản dịch và chú thích duy trì sự mơ hồ thực sự của văn bản.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “chị em gái” để bao quát quan hệ lớn tuổi hoặc nhỏ tuổi; dùng “nàng/người ấy” nhằm tránh sự suồng sã mà vẫn dễ hiểu. Các thành ngữ về sự lõa lồ được giữ để bảo toàn liên kết từ vựng với toàn bộ phần luật cấm loạn luân.
