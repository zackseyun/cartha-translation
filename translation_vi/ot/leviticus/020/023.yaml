  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: vi
  text: Các ngươi không được đi theo những luật lệ[a] của dân tộc mà Ta đang đuổi đi khỏi trước mặt các ngươi[b], vì họ đã làm tất cả những điều ấy, và Ta đã ghê tởm họ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tập tục” hoặc “quy định”; từ Hê-bơ-rơ có thể chỉ những thực hành đã thành lệ hoặc những quy định cố định.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “sai đi khỏi trước mặt các ngươi”; trong văn cảnh này có nghĩa là trục xuất hoặc đuổi đi.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Ta đã kinh tởm họ” hoặc “Ta đã chán ghét họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: sống theo
  rationale: Động từ nghĩa đen là “đi/bước đi”, nhưng trong ngữ cảnh đạo đức chỉ cách sống và hành xử. “Sống theo” diễn đạt tự nhiên thành ngữ này trong tiếng Việt.
- source_word: בְּחֻקֹּת
  choice: theo những tập tục
  rationale: Danh từ có thể chỉ luật lệ, quy định cố định hoặc những thực hành đã thành lệ. Ở đây nó nói đến nếp thực hành của dân tộc bị đuổi đi; “tập tục” phù hợp ngữ cảnh, còn nghĩa pháp quy được ghi nhận trong chú thích.
- source_word: הַגּוֹי
  choice: dân tộc
  rationale: Danh từ ở số ít, chỉ chung cộng đồng cư dân bị trục xuất. “Dân tộc” giữ đúng số và không đưa vào sắc thái thần học về sau của từ “dân ngoại”.
- source_word: מְשַׁלֵּחַ
  choice: đang đuổi đi
  rationale: Dạng từ này thường có nghĩa “sai đi/cho đi”, nhưng kết hợp với “khỏi trước mặt các ngươi” trong bối cảnh chiếm hữu đất thì diễn tả việc trục xuất.
- source_word: מִפְּנֵיכֶם
  choice: khỏi trước mặt các ngươi
  rationale: Giữ tương đối sát thành ngữ Hê-bơ-rơ, nghĩa là loại họ khỏi sự hiện diện và khỏi con đường tiến vào của Israel.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: vì chúng đã làm tất cả những điều ấy
  rationale: כִּי mang quan hệ nguyên nhân; cụm “những điều ấy” quy chiếu về các hành vi bị cấm trong văn cảnh trước.
- source_word: וָאָקֻץ בָּם
  choice: và Ta ghê tởm chúng
  rationale: קוץ diễn tả sự ghê sợ, kinh tởm mạnh mẽ; giới từ ב đánh dấu đối tượng của cảm xúc và được diễn đạt tự nhiên bằng tân ngữ trực tiếp trong tiếng Việt.
theological_decisions:
- issue: Diễn đạt sự ghê tởm của Đức Chúa Trời mà không làm nhẹ hoặc diễn giải quá mức
  choice: và Ta ghê tởm chúng
  alternative: và Ta kinh tởm chúng; và Ta chán ghét chúng
  rationale: Bản dịch giữ sức nặng của ngôn ngữ cảm xúc trong nguyên văn, thể hiện sự phản ứng đạo đức mạnh mẽ của Đức Chúa Trời nhưng không mở rộng thành một khẳng định thần học ngoài câu.
- issue: 'Đối tượng của sự ghê tởm: dân chúng hay các hành vi'
  choice: chúng, quy chiếu theo ngữ pháp gần nhất đến dân tộc/dân chúng
  alternative: những điều ấy, hiểu là các hành vi
  rationale: Đại từ số nhiều בָּם có thể được liên hệ theo ý nghĩa với người đã làm các việc ấy, trong khi văn cảnh gắn sự ghê tởm chặt chẽ với các hành vi. Bản chính giữ đại từ “chúng” để không âm thầm giải quyết sự căng thẳng này; chú thích nêu rõ khả năng quy chiếu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ngươi” duy trì lời phán trực tiếp với cộng đồng số nhiều; “Ta” biểu thị người nói là Đức Chúa Trời. Cách nói “sống theo” ưu tiên sự tự nhiên trong tiếng Việt hơn việc giữ nguyên hình ảnh “bước đi” của thành ngữ Hê-bơ-rơ.
