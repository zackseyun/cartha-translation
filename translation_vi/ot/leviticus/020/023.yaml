  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng mệnh lệnh phủ định, tính chất các thực hành/quy định của dân bị trục xuất, lý do nhân quả, và sự ghê tởm mạnh mẽ của Đức Chúa Trời. Tuy nhiên, וָאָקֻץ là động từ quá khứ trong mạch thuật sự, nên “Ta đã ghê tởm họ” phản ánh rõ hơn thì của nguyên văn. Chú thích hiện có về khả năng đại từ chỉ các hành vi đi quá dữ liệu ngữ pháp: בָּם quy chiếu đến những người/dân đã làm các điều ấy, không trực tiếp đến “những điều ấy”.'
  naturalness: “Sống theo những tập tục” có thể hiểu được, nhưng “đi theo những luật lệ” vừa là cách nói Việt ngữ tự nhiên trong văn cảnh đạo đức–pháp lý vừa giữ sát hơn חֻקּוֹת. Dùng “họ” cho cộng đồng người thay vì “chúng” tự nhiên và phù hợp hơn trong văn phong hiện đại trang trọng.
  terminology: “Luật lệ” giữ được lực quy phạm của חֻקּוֹת; chú thích vẫn ghi nhận nghĩa “tập tục/thực hành đã thành lệ”. “Dân tộc,” “đuổi đi khỏi trước mặt các ngươi,” và “ghê tởm” phù hợp với הַגּוֹי, מְשַׁלֵּחַ מִפְּנֵיכֶם, và וָאָקֻץ.
  issues:
