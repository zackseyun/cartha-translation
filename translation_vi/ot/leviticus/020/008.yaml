source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: vi
  text: Các ngươi phải tuân giữ các luật lệ của ta và thi hành chúng. Ta là Yahweh, Đấng thánh hóa các ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng làm cho các ngươi nên thánh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Các ngươi phải tuân giữ
  rationale: שׁמר trong văn mạch luật giao ước mang nghĩa giữ, tuân thủ. “Phải tuân giữ” tự nhiên trong tiếng Việt và diễn đạt rõ sức bắt buộc của lời truyền dạy; liên từ וּ không cần tách riêng ở đầu câu.
- source_word: חֻקֹּתַי
  choice: các luật lệ của ta
  rationale: חֻקָּה chỉ những quy định được ấn định. “Luật lệ” giữ sắc thái pháp lý, đồng thời thông dụng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: và thi hành chúng
  rationale: עשה với các điều luật có nghĩa thực hiện hoặc đem ra thi hành. “Thi hành chúng” tự nhiên hơn cách dịch sát chữ “làm chúng” và nhấn mạnh việc thực sự làm theo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó phản ánh trực tiếp danh יהוה trong bản Hê-bơ-rơ.
- source_word: מְקַדִּשְׁכֶם
  choice: Đấng thánh hóa các ngươi
  rationale: Phân từ Piel của קדשׁ diễn tả hành động đặc trưng hoặc đang tiếp diễn của Yahweh. “Thánh hóa” duy trì mối liên hệ từ vựng với ý niệm thánh khiết; “Đấng” tạo cách diễn đạt trang trọng, tự nhiên sau lời tự xưng.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của מְקַדִּשְׁכֶם trong bối cảnh giao ước
  choice: Đấng thánh hóa các ngươi
  alternative: Đấng làm cho các ngươi nên thánh
  rationale: “Thánh hóa” giữ thuật ngữ thần học và sự căng thẳng giữa mệnh lệnh Israel phải vâng giữ với hành động của chính Yahweh khiến họ nên thánh. Chú thích nêu cách diễn đạt phổ thông hơn mà không thu hẹp nghĩa.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “ta/các ngươi” phù hợp lời phán trực tiếp cho cộng đồng Israel và giữ rõ số nhiều của các động từ, hậu tố Hê-bơ-rơ. Cấu trúc hai câu bảo tồn nhịp mệnh lệnh rồi đến lời khẳng định thần học của nguyên văn.
