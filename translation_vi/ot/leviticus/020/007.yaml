base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: vi
  text: Các ngươi hãy tự thánh hóa mình[a] và nên thánh, vì Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tự biệt riêng mình” hoặc “Hãy làm cho mình nên thánh.” Động từ Hê-bơ-rơ có nghĩa phản thân, kêu gọi Israel chủ động tự thánh hóa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Hãy thánh hóa chính mình
  rationale: Dạng Hitpael mang nghĩa phản thân và sắc thái mệnh lệnh, kêu gọi dân Israel chủ động biệt riêng mình cho sự thánh khiết. Cách dịch này phân biệt hành động chủ động ấy với trạng thái “nên thánh” ở mệnh đề kế tiếp.
- source_word: וִהְיִיתֶם
  choice: và nên
  rationale: Động từ היה nối tiếp mệnh lệnh trước và có chức năng như mệnh lệnh thứ hai. “Nên” tự nhiên trong tiếng Việt và diễn đạt lời kêu gọi bước vào, duy trì tình trạng thánh khiết.
- source_word: קְדֹשִׁים
  choice: thánh
  rationale: Giữ được nội dung giao ước, đạo đức và thần học của קדושׁ; “được biệt riêng” chỉ truyền đạt một phần ý nghĩa.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do làm nền tảng cho mệnh lệnh, ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp trực tiếp với văn bản Hê-bơ-rơ.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Dù אֱלֹהִים có hình thức số nhiều, từ này ở đây chỉ Đức Chúa Trời duy nhất của Israel; hậu tố ngôi thứ hai số nhiều được thể hiện bằng “các ngươi”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ giữa hành động tự thánh hóa và việc nên thánh
  choice: 'Giữ hai mệnh đề phối hợp: “Hãy thánh hóa chính mình và nên thánh”'
  alternative: Hãy thánh hóa chính mình để nên thánh
  rationale: Liên từ וְ phối hợp hai ý; không nên biến mệnh đề thứ hai thành mục đích một cách dứt khoát. Bản dịch giữ cả lời kêu gọi chủ động lẫn tình trạng thánh khiết mà không giải quyết quá mức quan hệ giữa chúng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Ta” và “các ngươi” phản ánh lời Đức Chúa Trời phán với cộng đồng Israel; “thánh hóa chính mình” giữ lực phản thân của nguyên văn, còn chú thích làm rõ nghĩa biệt riêng.
