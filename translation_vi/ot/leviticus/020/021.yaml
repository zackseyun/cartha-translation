id: LEV.20.21
reference: Leviticus 20:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: vi
  text: Nếu một người đàn ông lấy vợ của anh hay em trai mình, đó là điều ô uế[a]; người ấy đã phơi bày sự trần truồng của anh hay em trai mình. Cả hai sẽ không có con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đó là sự ô uế” hoặc “đó là điều làm cho ô uế.” Từ Hê-bơ-rơ có thể chỉ sự ô uế theo nghĩa nghi lễ–đạo đức.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn nói sát hơn: “Họ sẽ là những người không con,” nhưng không cho biết phán quyết này được thực hiện bằng cách nào; vì vậy không nhất thiết phải hiểu thành “họ sẽ chết mà không có con.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Nếu một người đàn ông
  rationale: Trong công thức luật theo trường hợp, mệnh đề quan hệ với אֲשֶׁר và động từ chưa hoàn thành mang ý nghĩa điều kiện. Tiếng Việt dùng “nếu” để diễn đạt tự nhiên, còn liên từ וְ nối câu này với chuỗi điều luật xung quanh.
- source_word: יִקַּח
  choice: lấy
  rationale: לקח có nghĩa cơ bản là “lấy” và trong ngữ cảnh hôn nhân có thể chỉ việc lấy làm vợ. “Lấy” giữ được độ rộng của từ Hê-bơ-rơ mà không tự thêm chi tiết về nghi thức kết hôn.
- source_word: אֵשֶׁת אָחִיו
  choice: vợ của anh hay em trai mình
  rationale: Cụm sở hữu chỉ vợ của người anh em nam. Cách nói “anh hay em trai” tự nhiên và rõ nghĩa trong tiếng Việt, đồng thời không xác định tuổi tương đối vốn không được nguyên văn nêu ra.
- source_word: נִדָּה הִוא
  choice: đó là điều ô uế
  rationale: נִדָּה có thể chỉ tình trạng ô uế theo nghĩa nghi lễ–đạo đức. Đại từ “đó” quy lời phán xét về quan hệ/hành vi vừa nói đến, tránh biến câu thành lời gán sự ô uế riêng cho người phụ nữ.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: người ấy đã phơi bày sự trần truồng của anh hay em trai mình
  rationale: Giữ hình ảnh pháp lý đặc trưng trong Lê-vi Ký về việc “phơi bày sự trần truồng,” một lối nói chỉ quan hệ tình dục trái phép, thay vì diễn giải hoàn toàn ý nghĩa hàm ẩn.
- source_word: עֲרִירִים יִהְיוּ
  choice: Cả hai sẽ không có con
  rationale: Tính từ số nhiều עֲרִירִים và động từ số nhiều quy về đôi nam nữ. Câu Hê-bơ-rơ nói họ ở tình trạng không con nhưng không nêu rõ phán quyết ấy được thực hiện bằng cách nào.
theological_decisions:
- issue: Ý nghĩa của hình phạt עֲרִירִים יִהְיוּ
  choice: Cả hai sẽ không có con
  alternative: Cả hai sẽ chết mà không có con
  rationale: Nguyên văn trực tiếp nói đến tình trạng không có con, chứ không nói rõ họ sẽ chết không con. Bản dịch giữ nguyên sự không xác định về cách thức phán quyết được thực hiện.
- issue: Đối tượng bị gọi là ô uế trong נִדָּה הִוא
  choice: đó là điều ô uế
  alternative: người phụ nữ ấy ô uế
  rationale: Trong ngữ cảnh, đại từ giống cái có thể phù hợp về ngữ pháp với danh từ נִדָּה, nhưng ý của mệnh đề là đánh giá sự kết hợp/hành vi. “Đó” không quy sự ô uế riêng cho người phụ nữ.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. Dùng “anh hay em trai” để chuyển nghĩa danh từ thân tộc nam mà không áp đặt thứ bậc tuổi; giữ hình ảnh “phơi bày sự trần truồng” nhằm bảo toàn thành ngữ pháp lý và mối liên hệ nội văn trong Lê-vi Ký.
