  to: Nếu một người đàn ông lấy một phụ nữ và mẹ nàng[a], đó là việc đồi bại[b]. Họ phải dùng lửa thiêu người ấy và hai người phụ nữ ấy[c], để giữa các ngươi không có việc đồi bại.
