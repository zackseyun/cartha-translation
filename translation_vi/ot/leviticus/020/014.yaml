  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: vi
  text: Nếu một người đàn ông lấy một phụ nữ và mẹ nàng[a], đó là việc đồi bại[b]. Họ phải dùng lửa thiêu người ấy và hai người phụ nữ ấy[c], để giữa các ngươi không có việc đồi bại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cưới một phụ nữ và mẹ nàng.” Động từ Hê-bơ-rơ được dịch là “lấy” có thể hàm ý hôn nhân trong ngữ cảnh pháp luật, nhưng ở đây câu văn không nói rõ là cưới.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ cũng có thể được dịch là “việc gian ác”, “việc dâm loạn” hoặc “điều đáng ghê tởm”; từ này chỉ một hành vi tính dục bị lên án nghiêm trọng.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn dùng đại từ giống cái số nhiều; “hai người phụ nữ ấy” là người phụ nữ và mẹ nàng. Chủ thể “họ” của hành động thiêu không được nêu rõ hơn trong câu.
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: Danh từ Hê-bơ-rơ ở giống đực số ít và chỉ người nam vi phạm điều luật; cách dịch này giữ đúng giới tính được nêu trong nguồn.
- source_word: יִקַּח
  choice: lấy
  rationale: Động từ לקח có nghĩa cơ bản là “lấy”; trong ngữ cảnh pháp luật về quan hệ nam nữ, nó có thể hàm ý cưới hoặc kết hợp về tính dục, nhưng câu không dùng một thuật ngữ riêng chỉ hôn nhân. “Lấy” giữ được độ rộng ấy, với chú thích nêu khả năng hiểu là cưới.
- source_word: אִשָּׁה
  choice: một phụ nữ
  rationale: אִשָּׁה có thể là “người phụ nữ” hoặc “vợ”. “Một phụ nữ” tránh xác định quan hệ hôn nhân rõ hơn nguyên văn.
- source_word: אִמָּהּ
  choice: mẹ nàng
  rationale: Cụm sở hữu chỉ mẹ của người phụ nữ vừa được nhắc đến; “nàng” tạo văn phong trang trọng, gọn và rõ chủ thể quy chiếu.
- source_word: זִמָּה
  choice: việc đồi bại
  rationale: Trong các luật về tính dục của Lê-vi Ký, זִמָּה chỉ một hành vi đáng ghê tởm nghiêm trọng về mặt luân lý. “Việc đồi bại” tự nhiên trong tiếng Việt hiện đại và giữ sắc thái lên án mạnh.
- source_word: בָּאֵשׁ
  choice: dùng lửa
  rationale: Giới từ בְּ ở đây biểu thị phương tiện; “dùng lửa” chuyển tải trực tiếp phương thức thiêu.
- source_word: יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן
  choice: Họ phải dùng lửa thiêu hắn và hai người phụ nữ ấy
  rationale: Giữ cấu trúc chủ động số nhiều của tiếng Hê-bơ-rơ. Đại từ tân ngữ giống cái số nhiều chỉ người phụ nữ và mẹ nàng, nên diễn đạt rõ là “hai người phụ nữ ấy”.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: để giữa các ngươi không còn việc đồi bại
  rationale: “Để” làm rõ ý kết quả hoặc mục đích của hình phạt; “giữa các ngươi” giữ cách xưng hô số nhiều hướng đến cộng đồng giao ước.
theological_decisions:
- issue: Bản chất của quan hệ được hàm ý bởi “lấy một phụ nữ và mẹ nàng”
  choice: Dịch rộng là “lấy một phụ nữ và cả mẹ nàng”, không ghi rõ “cưới”.
  alternative: “cưới một phụ nữ và mẹ nàng” hoặc “lấy một phụ nữ và mẹ nàng làm vợ”
  rationale: לקח có thể hàm ý hôn nhân trong ngữ cảnh pháp lý, nhưng nguyên văn không dùng thêm từ ngữ xác định hôn nhân. Cách dịch rộng giữ nguyên sự mơ hồ thật của nguồn.
- issue: Cấu trúc của mệnh lệnh xử phạt
  choice: 'Giữ câu chủ động: “Họ phải dùng lửa thiêu hắn và hai người phụ nữ ấy.”'
  alternative: “Hắn và hai người phụ nữ ấy phải bị thiêu trong lửa.”
  rationale: Động từ Hê-bơ-rơ là chủ động ngôi thứ ba số nhiều, với các tân ngữ được nêu rõ. “Họ” không xác định thêm tác nhân ngoài điều nguyên văn cho biết.
- issue: Những người chịu hình phạt
  choice: Hiểu đại từ giống cái số nhiều là cả người phụ nữ lẫn mẹ nàng.
  alternative: Chỉ nêu mơ hồ “hắn và họ”.
  rationale: Hình thái אֶתְהֶן là giống cái số nhiều và tự nhiên quy chiếu đến hai phụ nữ đã được nhắc đến. Nói rõ quy chiếu ngữ pháp không bổ sung một bên nào ngoài văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ngươi” để phản ánh lời phán trực tiếp với cộng đồng ở ngôi thứ hai số nhiều; dùng “nàng” thay cho lối nói khẩu ngữ “cô ấy”. Câu xử phạt giữ thể chủ động và không bổ sung chi tiết về tác nhân hay cách thi hành mà nguyên văn không nêu.
