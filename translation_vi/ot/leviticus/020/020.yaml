id: LEV.20.20
reference: Leviticus 20:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: vi
  text: Nếu một người đàn ông nằm với vợ của chú hoặc bác mình, người ấy đã phơi bày sự trần truồng của chú hoặc bác mình.[a] Cả hai phải mang lấy tội mình[b]; họ sẽ chết mà không có con cái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đã phơi bày sự trần truồng của chú hoặc bác mình”—một thành ngữ trong Lê-vi Ký chỉ việc xâm phạm mối quan hệ thân tộc bị cấm bằng cách nằm với vợ của người chú hoặc bác ấy.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể hiểu: “Cả hai phải mang lấy trách nhiệm về tội lỗi của mình” hoặc “phải gánh hậu quả tội lỗi của mình.” Thành ngữ Hê-bơ-rơ có thể nói đến cả tội lẫn trách nhiệm phải gánh chịu vì tội đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Nếu một người đàn ông
  rationale: Công thức mở đầu một trường hợp luật; “nếu” diễn đạt tự nhiên lực điều kiện, còn “người đàn ông” giữ đúng giống và số của אִישׁ.
- source_word: יִשְׁכַּב אֶת
  choice: nằm với
  rationale: Giữ thành ngữ chỉ quan hệ tình dục của nguyên văn, đồng thời vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: דֹּדָתוֹ
  choice: vợ của chú hoặc bác mình
  rationale: Trong ngữ cảnh luật thân tộc này, từ ngữ chỉ vợ của người chú/bác bên nội. Tiếng Việt phải dùng hai cách gọi vì tiếng Hê-bơ-rơ không phân biệt người ấy lớn hay nhỏ tuổi hơn cha.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: người ấy đã phơi bày sự trần truồng của chú hoặc bác mình
  rationale: Bảo tồn thành ngữ đặc trưng của Lê-vi Ký thay vì diễn giải mất đi hình ảnh và cấu trúc quan hệ thân tộc của nguyên văn.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: Cả hai phải mang lấy tội mình
  rationale: Động từ và hậu tố số nhiều quy trách nhiệm cho cả hai người; “mang lấy tội” giữ thành ngữ Hê-bơ-rơ và không loại trừ sắc thái gánh chịu tội lỗi.
- source_word: עֲרִירִים יָמֻתוּ
  choice: họ sẽ chết mà không có con cái
  rationale: Diễn đạt tự nhiên tình trạng không con cái gắn với cái chết, nhưng không bổ sung cơ chế hay thời điểm mà nguyên văn không nói rõ.
theological_decisions:
- issue: Ý nghĩa của hình phạt עֲרִירִים יָמֻתוּ
  choice: họ sẽ chết mà không có con cái
  alternative: họ sẽ chết trong cảnh không con; họ sẽ chết mà không còn con nối dõi
  rationale: Nguyên văn chỉ nêu kết cục hoặc tình trạng, không xác định đây là vô sinh, con cái chết trước họ, hay một cơ chế xử phạt cụ thể. Bản dịch giữ sự hàm súc và không giải quyết điều văn bản để ngỏ.
- issue: Sắc thái của חֶטְאָם trong thành ngữ “mang lấy”
  choice: tội mình
  alternative: tội lỗi mình; hậu quả tội lỗi của mình
  rationale: Danh từ có thể chỉ tội hoặc trách nhiệm do tội gây ra. “Tội mình” gần hình thức nguyên văn nhất, còn chú thích ghi nhận sắc thái trách nhiệm/hậu quả.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “vợ của chú hoặc bác” thay cho một từ gọi cô/dì/thím chung chung để giữ đúng quan hệ là vợ của anh hoặc em trai người cha và tránh áp đặt sự phân biệt tuổi tác mà tiếng Hê-bơ-rơ không nêu.
