  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: vi
  text: Nếu một người đàn ông hay đàn bà nào là người đồng cốt[a] hoặc người cầu hồn[b], thì chắc chắn phải bị xử tử. Người ta phải ném đá họ. Máu họ ở trên họ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ אֹוב cũng có thể chỉ một “vong” hoặc linh thể gắn với việc gọi hồn, và theo nghĩa mở rộng chỉ người làm trung gian với linh thể ấy.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ יִדְּעֹנִי chỉ người có hoặc tìm kiếm tri thức huyền bí; cũng có thể dịch là “người hành nghề tâm linh” hoặc, theo cách dịch truyền thống, “thầy phù thủy”.
    reason: lexical_alternative
  - marker: c
    text: 'Dịch sát: “Máu họ ở trên họ.” Đây là một công thức pháp lý quy trách nhiệm về cái chết của họ cho chính họ.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אוֹ אִשָּׁה
  choice: Nếu một người đàn ông hay đàn bà
  rationale: Giữ nguyên cặp giới tính được nêu rõ trong tiếng Hê-bơ-rơ. Liên từ mở đầu được diễn đạt theo quan hệ điều kiện tự nhiên trong tiếng Việt.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: làm
  rationale: Trong ngữ cảnh luật pháp, cấu trúc này nhận diện người thực hành việc gọi hồn. Cách dịch gọn này tự nhiên hơn lối dịch sát chữ “có trong họ”, còn khả năng thuật ngữ chỉ một linh thể được giữ trong chú thích.
- source_word: אוֹב
  choice: đồng cốt
  rationale: Chỉ người làm trung gian với hồn người chết hoặc linh thể. “Đồng cốt” dễ hiểu trong tiếng Việt hiện đại, tuy sắc thái chính xác của thuật ngữ cổ không hoàn toàn chắc chắn.
- source_word: יִדְּעֹנִי
  choice: người cầu hồn
  rationale: Chỉ người gắn với việc hỏi hoặc gọi các linh thể để nhận tri thức. Cách dịch này tránh những từ dễ gợi liên tưởng đến nhân vật huyền ảo hiện đại.
- source_word: מוֹת יוּמָתוּ
  choice: chắc chắn phải bị xử tử
  rationale: Thể hiện cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn, có tác dụng nhấn mạnh bản án tử hình.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: Người ta phải lấy đá ném họ
  rationale: Giữ cả hành động ném đá và phương tiện được văn bản nêu rõ; chủ thể không xác định của động từ số nhiều được diễn đạt tự nhiên là “người ta”.
- source_word: דְּמֵיהֶם בָּם
  choice: Máu họ đổ ra, chính họ phải chịu trách nhiệm
  rationale: 'Giữ hình ảnh “máu” đồng thời truyền đạt chức năng pháp lý của công thức: người phạm tội phải chịu trách nhiệm về cái chết của mình.'
theological_decisions:
- issue: Ý nghĩa của אוֹב và יִדְּעֹנִי trong luật cấm thực hành gọi hồn
  choice: Dịch là “đồng cốt” và “người cầu hồn”
  alternative: “vong” và “linh biết việc”, hiểu là các linh thể ở trong người ấy
  rationale: Ngữ cảnh pháp lý nói về người nam hoặc nữ phải chịu hình phạt, nên cách hiểu hai từ là những người hành nghề phù hợp và dễ hiểu hơn. Tuy vậy, tiếng Hê-bơ-rơ có thể dùng אוֹב cho linh thể liên hệ với việc cầu hồn; chú thích giữ lại sự mơ hồ thực sự này.
- issue: Công thức pháp lý דְּמֵיהֶם בָּם
  choice: Giữ hình ảnh máu và nói rõ trách nhiệm của chính người bị xử tử
  alternative: 'Dịch sát từng chữ: “Máu họ ở trên họ”'
  rationale: Bản dịch chính cần dễ hiểu trong tiếng Việt hiện đại nhưng không xóa hình ảnh pháp lý của nguyên văn. Cách diễn đạt không đưa thêm phán đoán thần học ngoài trách nhiệm được câu văn xác lập.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. Dùng “đồng cốt” và “người cầu hồn” để người đọc phổ thông hiểu được mà không dùng thuật ngữ cổ khó hiểu hoặc từ ngữ mang màu sắc truyện kỳ ảo. Cấu trúc nam–nữ của nguyên văn được giữ nguyên.
