revisions:
- from: Nếu một người đàn ông hay đàn bà làm đồng cốt[a] hoặc làm người cầu hồn[b], thì chắc chắn phải bị xử tử. Người ta phải lấy đá ném họ. Máu họ đổ ra, chính họ phải chịu trách nhiệm.[c]
  to: Nếu một người đàn ông hay đàn bà nào là người đồng cốt[a] hoặc người cầu hồn[b], thì chắc chắn phải bị xử tử. Người ta phải ném đá họ. Máu họ ở trên họ.[c]
  rationale: Bản sửa giữ cặp nam–nữ, hai thuật ngữ riêng biệt về thực hành/tác nhân liên hệ với linh giới, hình phạt tử hình bằng ném đá, và công thức trách nhiệm pháp lý. Câu văn được làm tự nhiên hơn mà không thêm chi tiết ngoài nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa để phản ánh trực tiếp hơn cấu trúc Hê-bơ-rơ: người nam hay nữ được mô tả là người có/thuộc loại אֹוב hoặc יִדְּעֹנִי. Bản nháp chuyển thành hai hành vi bằng động từ “làm” và diễn giải công thức cuối câu quá xa nguyên văn. Hình phạt ném đá và sự nhấn mạnh của מוֹת יוּמָתוּ được giữ đúng về cơ bản.'
  naturalness: “làm đồng cốt hoặc làm người cầu hồn” không tự nhiên, nhất là cụm “làm người”. “Nếu một người đàn ông hay đàn bà nào là người đồng cốt hoặc người cầu hồn” là văn phong pháp lý hiện đại, rõ ràng và tự nhiên hơn. “Người ta phải ném đá họ” cũng gọn hơn “lấy đá ném họ”.
  terminology: “Đồng cốt” là cách gọi dễ hiểu cho אֹוב trong ngữ cảnh này; “người cầu hồn” có thể dùng cho יִדְּעֹנִי, với chú thích nêu phương án “người có tri thức huyền bí/người hành nghề tâm linh” mà không đồng nhất hai thuật ngữ. Công thức דְּמֵיהֶם בָּם nên được giữ sát là “Máu họ ở trên họ”, rồi giải thích ở chú thích.
  issues:
  - severity: medium
    issue: Cụm “làm đồng cốt hoặc làm người cầu hồn” chuyển mô tả danh từ của nguyên văn thành hành vi và có cách nói không tự nhiên.
    rationale: Nguyên văn nêu một người nam hoặc nữ mà nơi họ có אֹוב hay יִדְּעֹנִי; trong ngữ cảnh, cách dịch “là người đồng cốt hoặc người cầu hồn” vừa rõ nghĩa vừa gần cấu trúc nguồn hơn.
  - severity: medium
    issue: “Máu họ đổ ra, chính họ phải chịu trách nhiệm” thêm hình ảnh “đổ ra” và thay thế công thức pháp lý bằng diễn giải.
    rationale: Động từ “đổ ra” không có trong tiếng Hê-bơ-rơ. Nên giữ công thức “Máu họ ở trên họ” trong thân bài và để chú thích giải thích trách nhiệm pháp lý.
  - severity: low
    issue: Chú thích b nói יִדְּעֹנִי có thể chỉ “linh thể”, một khả năng không được bản dịch chính hay ghi nhận tiếng Anh ưu tiên.
    rationale: Chú thích nên nêu tính chất thuật ngữ chưa hoàn toàn xác định và các cách dịch chỉ người hành nghề, tránh khẳng định một nghĩa linh thể không cần thiết.
