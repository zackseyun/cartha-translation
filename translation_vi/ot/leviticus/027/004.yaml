source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֖ה הִ֑וא וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ שְׁלֹשִׁ֥ים שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: vi
  text: Nhưng nếu là nữ[a], thì mức định giá của ngươi sẽ là ba mươi siếc-lơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Còn nếu người ấy là nữ.”'
    reason: Nguyên văn có đại từ giống cái הִוא (“người ấy/cô ấy”), nhưng trong công thức phân loại này tiếng Việt có thể diễn đạt tự nhiên chỉ bằng “là nữ”.
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ וְ đi với tiểu từ điều kiện אִם mở ra trường hợp tương phản với người nam ở câu trước; “Nhưng nếu” diễn đạt rõ sự đối chiếu này trong tiếng Việt.
- source_word: נְקֵבָה הִוא
  choice: là nữ
  rationale: נְקֵבָה chỉ giới tính nữ nói chung, không nhất thiết riêng một phụ nữ trưởng thành. Cách nói “là nữ” tự nhiên trong điều khoản phân loại và không thêm ý ngoài nguyên văn.
- source_word: וְהָיָה
  choice: thì ... sẽ là
  rationale: Trong văn phong luật định, động từ này dẫn vào kết quả của điều kiện; cấu trúc “nếu ... thì ... sẽ là” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: עֶרְכְּךָ
  choice: mức định giá của ngươi
  rationale: עֶרֶךְ trong Lê-vi Ký 27 là giá trị được ấn định liên quan đến lời khấn nguyện. “Mức định giá” giữ sắc thái pháp lý, còn “của ngươi” bảo toàn hậu tố ngôi hai số ít.
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: ba mươi siếc-lơ
  rationale: Dịch đúng số lượng và đơn vị tiền/trọng lượng; không thêm “bạc” vì từ ấy không xuất hiện trong câu này.
theological_decisions: []
translation_notes:
  register: Văn phong luật định trang trọng nhưng dễ hiểu. Dùng “ngươi” để giữ ngôi hai số ít của nguyên văn và sự nhất quán với lời phán trực tiếp trong phân đoạn; phiên âm đơn vị שֶׁקֶל là “siếc-lơ”.
