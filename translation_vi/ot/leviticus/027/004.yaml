  source_fidelity: 'Bản dịch phản ánh chính xác cấu trúc điều kiện–kết quả của nguyên văn: וְאִם được diễn đạt hợp ngữ cảnh là “Nhưng nếu”, נְקֵבָה הִוא là “là nữ”, và mệnh đề kết quả giữ đúng số lượng cùng đơn vị “ba mươi siếc-lơ”. “Mức định giá của ngươi” truyền đạt được thuật ngữ עֶרְכְּךָ và hậu tố ngôi thứ hai số ít.'
  naturalness: 'Câu tiếng Việt hiện đại, rõ ràng và phù hợp văn phong luật định: “Nhưng nếu là nữ, thì mức định giá của ngươi sẽ là ba mươi siếc-lơ.” Cách lược chủ ngữ trong “nếu là nữ” tự nhiên trong ngữ cảnh phân loại và không làm thay đổi đối tượng được nói đến từ câu trước.'
