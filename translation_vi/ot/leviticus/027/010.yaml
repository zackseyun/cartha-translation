revisions:
- from: 'Không được đổi nó hay tráo nó[a], con tốt lấy con xấu hoặc con xấu lấy con tốt. Nhưng nếu người ấy nhất định tráo con vật này lấy con vật khác[b], thì cả con vật ấy lẫn con vật thay thế nó đều sẽ là thánh.


    [a] Cũng có thể dịch là “thay thế nó”; tiếng Hê-bơ-rơ dùng hai động từ có liên hệ nhưng khác nhau để chỉ việc đổi hoặc tráo.

    [b] Tiếng Hê-bơ-rơ nhấn mạnh động từ: “nếu người ấy quả thật tráo” hoặc “nếu người ấy nhất định tráo”.'
  to: 'Người ấy không được thay nó, cũng không được đổi nó[a], dù đổi con tốt lấy con xấu hay con xấu lấy con tốt. Nhưng nếu người ấy quả có đổi một con vật lấy một con vật khác[b], thì cả nó lẫn con vật thay thế nó đều sẽ là thánh.


    [a] Cũng có thể dịch là “đổi nó”; tiếng Hê-bơ-rơ dùng hai động từ có liên hệ nhưng khác nhau để chỉ việc thay thế và đổi.


    [b] Tiếng Hê-bơ-rơ nhấn mạnh động từ: “nếu người ấy quả có đổi” hoặc “nếu người ấy nhất định có đổi”.'
  rationale: Sửa “tráo” thành “đổi” để tránh hàm ý đánh tráo không có trong nguyên văn; dùng “thay” cho חלף để duy trì sự phân biệt từ vựng với מוּר. Thêm “người ấy” cho rõ chủ ngữ, và đổi cách diễn đạt nhấn mạnh thành “quả có đổi.” Các mốc chú thích vẫn gắn đúng với hai quyết định từ vựng tương ứng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:32:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lệnh cấm, đối chiếu tốt/xấu, sự nhấn mạnh của cấu trúc nguyên thể tuyệt đối + động từ hữu hạn, và kết quả là cả con vật ban đầu lẫn vật thay thế đều là thánh. Tuy nhiên, “tráo” thường gợi việc đánh tráo lén lút hay gian dối trong tiếng Việt hiện đại, không phải nghĩa trung tính của מוּר là đổi/trao đổi. “Nhất định tráo” cũng dễ chuyển ý nhấn mạnh hành động thành ý định/quyết tâm.
  naturalness: Cần nêu rõ chủ ngữ “người ấy” theo ngôi thứ ba số ít của tiếng Hê-bơ-rơ. Cặp “thay” / “đổi” tự nhiên hơn trong văn phong luật lệ và vẫn phân biệt được hai động từ nguồn. Cụm “quả có đổi” diễn đạt tự nhiên sự nhấn mạnh mà không hàm ý cố ý.
  terminology: “Con vật,” “con tốt/con xấu,” và “là thánh” phù hợp ngữ cảnh luật về súc vật được biệt riêng. Giữ “là thánh” để dịch trực tiếp קֹדֶשׁ, không diễn giải theo một hệ phái.
  issues:
  - severity: medium
    issue: “Tráo” được dùng để dịch מוּר.
    rationale: Trong tiếng Việt hiện đại, “tráo” thường hàm ý đánh tráo hoặc lén đổi; nguyên văn chỉ sự đổi một con vật này lấy một con khác trong quy định pháp lý. “Đổi” là trung tính và chính xác hơn.
  - severity: medium
    issue: “Nhất định tráo” không phản ánh tự nhiên cấu trúc הָמֵר יָמִיר.
    rationale: Cấu trúc này nhấn mạnh việc thực hiện hành động (“quả có đổi/nhất định có đổi”), không chủ yếu nói người ấy quyết tâm thực hiện. “Quả có đổi” giữ được sắc thái nhấn mạnh.
