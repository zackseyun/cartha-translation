source:
  edition: WLC
  text: לֹ֣א יַחֲלִיפֶ֗/נּוּ וְ/לֹֽא יָמִ֥יר אֹת֛/וֹ ט֥וֹב בְּ/רָ֖ע אוֹ רַ֣ע בְּ/ט֑וֹב וְ/אִם הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּ/בְהֵמָ֔ה וְ/הָֽיָה ה֥וּא וּ/תְמוּרָת֖/וֹ יִֽהְיֶה קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: vi
  text: 'Người ấy không được thay nó, cũng không được đổi nó[a], dù đổi con tốt lấy con xấu hay con xấu lấy con tốt. Nhưng nếu người ấy quả có đổi một con vật lấy một con vật khác[b], thì cả nó lẫn con vật thay thế nó đều sẽ là thánh.


    [a] Cũng có thể dịch là “đổi nó”; tiếng Hê-bơ-rơ dùng hai động từ có liên hệ nhưng khác nhau để chỉ việc thay thế và đổi.


    [b] Tiếng Hê-bơ-rơ nhấn mạnh động từ: “nếu người ấy quả có đổi” hoặc “nếu người ấy nhất định có đổi”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đổi nó”; tiếng Hê-bơ-rơ dùng hai động từ có liên hệ nhưng khác nhau để chỉ việc thay thế và đổi.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ nhấn mạnh động từ: “nếu người ấy quả có đổi” hoặc “nếu người ấy nhất định có đổi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: đổi nó
  rationale: Dạng Hiphil của חלף ở đây chỉ việc thay con vật đã biệt riêng bằng một con khác. “Đổi” tự nhiên trong tiếng Việt và vẫn có thể phân biệt với động từ מוּר theo sau, được dịch là “tráo”.
- source_word: יָמִיר אֹתוֹ
  choice: tráo nó
  rationale: מוּר trong luật lệ này chỉ việc đem một con vật thay cho con khác. “Tráo” diễn đạt hành vi đổi vật thay thế và giữ được mô hình hai động từ khác nhau của nguyên văn.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: con tốt lấy con xấu hoặc con xấu lấy con tốt
  rationale: Các tính từ được dùng như danh từ, còn ב đánh dấu vật được dùng trong sự trao đổi. Thêm “con” làm rõ rằng câu nói về súc vật mà không mở rộng quá mức.
- source_word: וְאִם הָמֵר יָמִיר
  choice: nhưng nếu người ấy nhất định tráo
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn tạo ý nhấn mạnh. “Nhất định tráo” truyền đạt sự cố ý và nhấn mạnh trong tiếng Việt hiện đại; chú thích bảo lưu các cách hiểu gần hơn về sắc thái.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: con vật này lấy con vật khác
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt và biểu thị rõ việc dùng một con vật thay cho một con khác.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: cả con vật ấy lẫn con vật thay thế nó
  rationale: Đại từ chỉ con vật ban đầu, còn תְּמוּרָה là con được đưa vào thay thế. Cấu trúc “cả... lẫn...” làm rõ rằng cả hai đều chịu cùng một kết quả pháp lý-thánh lễ.
- source_word: קֹדֶשׁ
  choice: là thánh
  rationale: קֹדֶשׁ chỉ địa vị thuộc về Đức Chúa Trời, được biệt riêng trong bối cảnh lời khấn và tế lễ. “Là thánh” trực tiếp, trang trọng và không thu hẹp ý nghĩa chỉ còn “đã dâng hiến”.
theological_decisions:
- issue: Địa vị của con vật ban đầu và con vật thay thế sau khi người ta cố tráo đổi
  choice: Cả con vật ban đầu lẫn con vật thay thế đều trở thành thánh.
  alternative: Chỉ con vật thay thế trở thành thánh; hoặc câu chỉ tuyên bố việc tráo đổi không hợp lệ mà không ban địa vị thánh cho cả hai.
  rationale: Mệnh đề וְהָיָה הוּא וּתְמוּרָתוֹ ... קֹדֶשׁ quy địa vị thánh cho cả con vật ấy và vật thay thế nó. Bản dịch dùng “cả... lẫn... đều” để thể hiện rõ kết quả kép này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, giọng văn luật lệ trang trọng nhưng dễ hiểu. Giữ hai động từ khác nhau của nguyên văn bằng “đổi” và “tráo”; dùng “con vật” thay vì thuật ngữ kỹ thuật hơn để phù hợp độc giả phổ thông. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
