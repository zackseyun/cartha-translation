  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: vi
  text: Nhưng nếu con vật ấy thuộc loại không thanh sạch[a], thì người ấy phải chuộc lại nó theo giá thầy tế lễ định và cộng thêm một phần năm; còn nếu nó không được chuộc, thì nó phải được bán theo giá thầy tế lễ định.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là thuộc loại động vật không thanh sạch theo nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: một con vật ô uế
  rationale: בְּהֵמָה chỉ thú vật hoặc gia súc; tính từ טָמֵא trong văn cảnh Lê-vi Ký nói đến tình trạng ô uế theo nghi lễ. Cách dịch này tự nhiên trong tiếng Việt và nhận diện con vật thuộc loại ô uế.
- source_word: וּפָדָה
  choice: người ấy phải chuộc nó
  rationale: פדה có nghĩa là chuộc lại. Trong điều luật theo cấu trúc điều kiện ở đây, động từ nêu thủ tục áp dụng nếu chủ muốn giữ lại vật đã biệt hiến; “phải” diễn đạt lực quy định mà không biến việc chuộc thành nghĩa vụ tuyệt đối, vì vế sau vẫn dự liệu trường hợp nó không được chuộc.
- source_word: בְעֶרְכֶּךָ
  choice: theo giá ông định
  rationale: עֵרֶךְ trong Lê-vi Ký 27 là mức giá thẩm định, và hậu tố ngôi hai số ít hướng lời đến thầy tế lễ. “Theo giá ông định” vừa tự nhiên vừa giữ đại từ ngôi hai của nguyên văn.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: và thêm vào đó một phần năm
  rationale: Thành ngữ Hê-bơ-rơ yêu cầu cộng thêm một phần năm vào mức giá đã định. Cách dịch giữ tỷ lệ phân số của nguyên văn và tránh câu tiếng Việt nặng nề.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: còn nếu nó không được chuộc
  rationale: Dạng Niphal để tác nhân không được nêu; câu bị động tiếng Việt bảo toàn sự không xác định ấy.
- source_word: וְנִמְכַּר
  choice: thì phải bán nó
  rationale: Dạng Niphal mang lực quy định pháp lý. Tiếng Việt tự nhiên ưu tiên “phải bán nó” hơn dạng bị động cứng “nó phải được bán”, trong khi không xác định người bán.
theological_decisions:
- issue: “Ô uế” là phân loại nghi lễ hay sự dơ bẩn thông thường
  choice: Dùng “ô uế” và chú thích rằng đây là phân loại theo nghi lễ
  alternative: Dùng “không thanh sạch” hoặc hiểu là con vật dơ bẩn
  rationale: Trong văn cảnh luật Lê-vi, טָמֵא là thuật ngữ về tình trạng nghi lễ, không phải nhận định rằng bản thân con vật bẩn thỉu hoặc xấu xa.
- issue: Lực quy định của וּפָדָה và trường hợp không chuộc ở vế sau
  choice: Dịch “phải chuộc” như thủ tục khi lựa chọn chuộc, đồng thời giữ nguyên vế “nếu nó không được chuộc”
  alternative: Dịch “có thể chuộc” để nhấn mạnh đây là một lựa chọn
  rationale: Nguyên văn tạo sức căng giữa công thức pháp lý quy định cách chuộc và khả năng vật không được chuộc. Bản dịch không xóa vế nào hay biến việc chuộc thành nghĩa vụ không có ngoại lệ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “ông” để bảo toàn lời nói trực tiếp ở ngôi thứ hai số ít với thầy tế lễ trong văn cảnh; dùng “người ấy” cho người sở hữu hoặc dâng con vật. “Một phần năm” giữ cách biểu đạt của nguyên văn, tức cộng thêm hai mươi phần trăm vào giá đã định.
