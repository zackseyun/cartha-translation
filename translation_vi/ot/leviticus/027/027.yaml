revisions:
- from: Nhưng nếu đó là một con vật ô uế[a], người ấy phải chuộc nó theo giá ông định và thêm vào đó một phần năm; còn nếu nó không được chuộc, thì phải bán nó theo giá ông định.
  to: Nhưng nếu con vật ấy thuộc loại không thanh sạch[a], thì người ấy phải chuộc lại nó theo giá thầy tế lễ định và cộng thêm một phần năm; còn nếu nó không được chuộc, thì nó phải được bán theo giá thầy tế lễ định.
  rationale: Bản sửa phân biệt rõ phân loại nghi lễ với sự dơ bẩn thông thường, làm sáng tỏ người định giá theo văn mạch, và phục hồi sắc thái bị động không nêu tác nhân trong mệnh đề cuối. Lực quy định của điều luật và khả năng không chuộc vẫn được giữ nguyên.
