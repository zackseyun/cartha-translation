review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc điều luật: con vật thuộc loại không thanh sạch, việc chuộc theo mức định giá cộng thêm một phần năm, và việc bán nếu không được chuộc. Tuy nhiên, “một con vật ô uế” có thể bị hiểu là một con vật cá thể đang dơ bẩn, trong khi cụm Hê-bơ-rơ chỉ loại động vật không thanh sạch theo nghi lễ. “Theo giá ông định” cũng để ngôi hai (''ông'') thiếu quy chiếu rõ khi câu được đọc độc lập. Bản sửa làm rõ cả hai điểm và giữ bị động không nêu tác nhân ở vế cuối.'
  naturalness: “Con vật ấy thuộc loại không thanh sạch” tự nhiên trong tiếng Việt hiện đại, chính xác trong văn cảnh Lê-vi Ký, và tránh sắc thái đạo đức hay vệ sinh thông thường của “ô uế”. “Theo giá thầy tế lễ định” rõ nghĩa hơn “theo giá ông định”. Dạng “nó phải được bán” giữ được bị động pháp lý của nguyên văn.
  terminology: Dùng “không thanh sạch” cho טָמֵא trong phân loại nghi lễ; dùng “chuộc lại” cho פדה; “giá thầy tế lễ định” cho עֵרֶךְ trong bối cảnh định giá của Lê-vi Ký 27; và “một phần năm” cho חֲמִשִׁתוֹ. Không áp đặt cách hiểu giáo phái nào.
  issues:
  - severity: medium
    issue: “Một con vật ô uế” chưa biểu đạt rõ tính phân loại của cụm danh từ Hê-bơ-rơ.
    rationale: בַּבְּהֵמָה הַטְּמֵאָה chỉ một vật thuộc hạng động vật không thanh sạch theo nghi lễ, không nhất thiết là một con vật đang bẩn. Cách diễn đạt “thuộc loại không thanh sạch” giữ được nét này.
  - severity: low
    issue: “Theo giá ông định” có đại từ thiếu tiền đề rõ ràng trong bản dịch độc lập.
    rationale: Hậu tố ngôi hai số ít trong nguyên văn hướng đến thầy tế lễ theo ngữ cảnh gần. Nêu “thầy tế lễ” trong tiếng Việt làm rõ vai trò mà không đổi nghĩa.
  - severity: low
    issue: Vế bán dùng chủ động “phải bán nó”, trong khi nguyên văn dùng bị động pháp lý.
    rationale: Dạng Niphal וְנִמְכַּר không chỉ rõ người bán. “Nó phải được bán” bảo toàn tốt hơn tác nhân không được nêu.
