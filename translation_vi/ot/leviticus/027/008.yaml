base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: vi
  text: Nhưng nếu người ấy nghèo, không kham nổi mức định giá của ngươi[a], thì người ấy phải được trình diện trước mặt thầy tế lễ, và thầy tế lễ sẽ định giá người ấy. Thầy tế lễ sẽ định giá người ấy tùy theo khả năng chi trả của người lập lời khấn nguyện[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “nghèo hơn mức định giá của ngươi.” Trong văn cảnh, cụm từ này có nghĩa là người ấy không đủ khả năng đáp ứng mức định giá đã quy định.'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “tùy theo điều mà tay của người lập lời khấn nguyện đạt tới”; đây là thành ngữ chỉ khả năng tài chính.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ ... מֵעֶרְכֶּךָ
  choice: nghèo, không kham nổi mức định giá của ngươi
  rationale: מָךְ chỉ tình trạng nghèo khó; kết hợp với מִן trong ngữ cảnh này diễn tả việc người ấy không đủ khả năng đáp ứng mức định giá. Cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ đại từ ngôi thứ hai số ít của bản Hê-bơ-rơ.
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  choice: phải đưa người ấy đến đứng trước mặt thầy tế lễ
  rationale: Dạng Hiphil của עמד có nghĩa đen là “làm cho đứng”. Cách diễn đạt này giữ thủ tục trình diện trước thẩm quyền tế lễ mà không xác định chủ thể vốn không được nêu rõ trong nguyên văn.
- source_word: וְהֶעֱרִיךְ אֹתוֹ ... יַעֲרִיכֶנּוּ
  choice: thầy tế lễ sẽ/phải định giá người ấy
  rationale: ערך là thuật ngữ lặp lại trong chương này, chỉ việc ấn định giá trị bằng tiền đối với người được khấn nguyện. “Định giá” rõ nghĩa và nhất quán với văn cảnh pháp lý.
- source_word: עַל פִּי
  choice: tùy theo
  rationale: Thành ngữ này giới thiệu căn cứ để thầy tế lễ xác định mức giá; “tùy theo” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר תַּשִּׂיג יַד
  choice: khả năng chi trả
  rationale: Nghĩa đen là điều “tay ... đạt tới”, một thành ngữ Hê-bơ-rơ chỉ khả năng tài chính. “Khả năng chi trả” truyền đạt chính xác ý nghĩa trong văn cảnh.
- source_word: הַנֹּדֵר
  choice: người lập lời khấn nguyện
  rationale: Phân từ của נדר chỉ người thực hiện lời khấn nguyện. Cách dịch này rõ ràng, trang trọng và tránh từ ngữ chuyên môn khó hiểu.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Thầy tế lễ” phù hợp với văn cảnh Lê-vi Ký; cấu trúc pháp lý và sự lặp lại của động từ “định giá” được giữ lại để phản ánh nguyên văn.
