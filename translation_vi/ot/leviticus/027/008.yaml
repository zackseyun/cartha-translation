  source_fidelity: 'Bản dịch truyền đạt đúng ý pháp lý của nguyên văn: người được định giá không đủ khả năng theo mức định giá quy định thì được trình diện trước thầy tế lễ; thầy tế lễ định giá theo khả năng tài chính của người lập lời khấn nguyện. Đại từ «ngươi» cũng giữ được ngôi thứ hai số ít của tiếng Hê-bơ-rơ. Tuy nhiên, «phải đưa người ấy đến đứng» chưa phản ánh tự nhiên cách diễn đạt bị động/không nêu chủ thể của וְהֶעֱמִידוֹ.'
  naturalness: «Người ấy phải được trình diện trước mặt thầy tế lễ» tự nhiên và trang trọng hơn «phải đưa người ấy đến đứng trước mặt thầy tế lễ». Dùng nhất quán «sẽ định giá» cho hai động từ yiqtol giữ nhịp văn pháp lý và sự lặp lại của nguyên văn.
  terminology: «Thầy tế lễ», «định giá», «lời khấn nguyện» và «khả năng chi trả» đều phù hợp văn cảnh Lê-vi Ký. Chú thích b cần chỉnh cú pháp để phần nghĩa đen tiếng Việt rõ ràng hơn, không thay đổi nội dung.
