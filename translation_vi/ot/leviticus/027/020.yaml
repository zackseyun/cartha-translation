source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: vi
  text: Nhưng nếu người ấy không chuộc lại thửa ruộng, hoặc nếu người ấy đã bán thửa ruộng cho một người đàn ông khác[a], thì thửa ruộng ấy không còn được chuộc lại nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một người đàn ông khác”; trong công thức pháp lý, cách nói này cũng có thể được hiểu là “một người khác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu / hoặc nếu
  rationale: Hai mệnh đề điều kiện tiếp nối quy định ở câu trước. “Nhưng nếu” thể hiện sắc thái chuyển sang trường hợp trái lại, còn “hoặc nếu” diễn đạt quan hệ lựa chọn giữa hai trường hợp.
- source_word: יִגְאַל / יִגָּאֵל
  choice: chuộc lại / được chuộc lại
  rationale: Trong luật về tài sản đã biệt riêng, גאל chỉ hành động trả giá để lấy lại tài sản. “Chuộc lại” tự nhiên trong tiếng Việt, giữ được ý nghĩa pháp lý và thể hiện rõ dạng chủ động rồi bị động của hai động từ.
- source_word: הַשָּׂדֶה
  choice: thửa ruộng
  rationale: Danh từ có mạo từ chỉ thửa ruộng cụ thể đang được bàn đến, không phải đất đai theo nghĩa lãnh thổ rộng.
- source_word: מָכַר
  choice: đã bán
  rationale: Dạng hoàn thành mô tả việc bán đã xảy ra và dẫn đến hậu quả pháp lý hiện tại.
- source_word: לְאִישׁ אַחֵר
  choice: cho một người đàn ông khác
  rationale: אִישׁ về mặt từ vựng là “người đàn ông”; cách dịch này giữ hình thức giống đực của nguyên văn, dù trong công thức pháp lý phạm vi áp dụng có thể mang tính khái quát.
- source_word: עוֹד
  choice: không còn ... nữa
  rationale: Trong mệnh đề phủ định, עוֹד cho biết từ thời điểm ấy trở đi việc chuộc lại không còn được phép; cấu trúc “không còn ... nữa” tự nhiên và chính xác trong tiếng Việt.
theological_decisions:
- issue: Sắc thái pháp lý–thánh hiến của גאל
  choice: chuộc lại
  alternative: mua lại; lấy lại
  rationale: “Chuộc lại” giữ được thuật ngữ pháp lý nhất quán trong Lê-vi Ký 27 mà không biến hành động liên quan đến tài sản thành một khẳng định thần học rộng hơn.
- issue: Danh từ giống đực trong công thức pháp lý
  choice: một người đàn ông khác
  alternative: một người khác; người khác
  rationale: Nguyên văn dùng danh từ giống đực số ít אִישׁ. Bản dịch giữ nét hình thức này, đồng thời chú thích rằng cách nói pháp lý có thể được hiểu theo nghĩa khái quát.
- issue: Chủ thể không được nêu lại trong các động từ “chuộc” và “bán”
  choice: người ấy
  alternative: chủ ruộng; người đã biệt riêng thửa ruộng; thầy tế lễ
  rationale: Tiếng Hê-bơ-rơ chỉ mã hóa chủ thể giống đực số ít trong động từ chứ không gọi đích danh. “Người ấy” bảo toàn sự không minh định này, tránh tự ý xác định chủ thể theo một cách giải thích riêng.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. “Thửa ruộng” cụ thể hơn “đất”; “chuộc lại” dễ hiểu hơn “cứu chuộc” trong ngữ cảnh tài sản. Đại từ “người ấy” được dùng để không giải quyết thay nguyên văn việc chủ thể của động từ là ai.
