source:
  edition: WLC
  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: vi
  text: Tuy nhiên, không ai được thánh hiến một con đầu lòng trong số gia súc, vì nó vốn đã thuộc về Đức Giê-hô-va với tư cách là con đầu lòng; dù là bò, chiên hay dê, nó thuộc về Đức Giê-hô-va.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Diễn tả sắc thái hạn định hoặc ngoại lệ so với các quy định dâng hiến ở trước.
- source_word: בְּכוֹר
  choice: con đầu lòng
  rationale: Chỉ con vật sinh đầu tiên; đây là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: là con đầu lòng thuộc về Đức Giê-hô-va
  rationale: Dạng bị động của בכר nói đến địa vị đầu lòng, và ngữ cảnh cho thấy vì địa vị ấy con vật vốn đã thuộc về Đức Giê-hô-va.
- source_word: בִּבְהֵמָה
  choice: trong đàn gia súc
  rationale: בהמה là danh từ tập hợp chỉ vật nuôi; “gia súc” phù hợp với bối cảnh luật về các con vật được dâng.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: không ai được biệt riêng nó ra thánh
  rationale: איש được dùng theo nghĩa khái quát là “ai”; Hiphil của קדש chỉ hành động hiến dâng hoặc biệt riêng làm thánh. Cách dịch này giữ sắc thái thờ phượng mà vẫn dễ hiểu.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: dù là bò hay con vật thuộc đàn chiên dê
  rationale: שׁוֹר chỉ bò, còn שֶׂה có thể là chiên hoặc dê; cách dịch rộng tránh thu hẹp nghĩa gốc chỉ còn chiên.
- source_word: לַיהוָה הוּא
  choice: nó vẫn thuộc về Đức Giê-hô-va
  rationale: Diễn đạt tự nhiên ý sở hữu hoặc quyền đòi hỏi đã có sẵn; “vẫn” làm rõ sự đối lập với việc con người biệt riêng nó lần nữa.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng giao ước quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Vì sao con vật đầu lòng không được biệt riêng ra thánh bằng lời khấn
  choice: Không được biệt riêng nó thêm lần nữa vì với tư cách con đầu lòng, nó vốn đã thuộc về Đức Giê-hô-va.
  alternative: Địa vị đầu lòng tự nó là một hình thức thánh hiến, không nhấn mạnh quyền sở hữu pháp lý.
  rationale: Mệnh đề cuối “nó thuộc về Đức Giê-hô-va” hỗ trợ cách hiểu về quyền đã có trước của Đức Chúa Trời, nhưng bản dịch không giải thích quá mức cơ chế pháp lý.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “không ai” vì איש ở đây mang nghĩa khái quát. Giữ sự phân biệt giữa việc một người chủ động biệt riêng con vật ra thánh và tình trạng con đầu lòng vốn đã thuộc về Đức Giê-hô-va.
