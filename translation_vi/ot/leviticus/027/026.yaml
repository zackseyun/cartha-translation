revisions:
- from: Tuy nhiên, con đầu lòng trong đàn gia súc, là con đầu lòng thuộc về Đức Giê-hô-va, thì không ai được biệt riêng nó ra thánh; dù là bò hay con vật thuộc đàn chiên dê[a], nó vẫn thuộc về Đức Giê-hô-va.
  to: Tuy nhiên, không ai được thánh hiến một con đầu lòng trong số gia súc, vì nó vốn đã thuộc về Đức Giê-hô-va với tư cách là con đầu lòng; dù là bò, chiên hay dê, nó thuộc về Đức Giê-hô-va.
  rationale: Bản sửa làm rõ rằng tình trạng thuộc về Đức Giê-hô-va có trước hành động thánh hiến của con người, đồng thời tránh lặp cấu trúc không tự nhiên. “Bò, chiên hay dê” diễn đạt bao quát cặp שׁוֹר / שֶׂה trong tiếng Việt hiện đại. Liên từ “vì” nêu rõ quan hệ logic vốn được hàm ý bởi mệnh đề quan hệ và lời khẳng định kết câu, không thêm một cơ chế thần học ngoài bản văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:32:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng ý chính của tiếng Hê-bơ-rơ: con vật đầu lòng đã thuộc về Đức Giê-hô-va nên con người không thể thánh hiến nó thêm. Tuy nhiên, cụm lặp “con đầu lòng ... là con đầu lòng” khá nặng trong tiếng Việt, và “biệt riêng nó ra thánh” không tự nhiên bằng thuật ngữ thờ phượng thông dụng “thánh hiến.”'
  naturalness: Cần chỉnh để câu văn hiện đại, trôi chảy hơn. “Trong đàn gia súc” có thể gợi một đàn cụ thể; “trong số gia súc” phù hợp hơn với danh từ tập hợp בְּהֵמָה. “Chiên dê” cũng không phải một phối hợp danh từ tự nhiên khi đứng độc lập.
  terminology: Dùng “thánh hiến” cho הִקְדִּישׁ giữ được nghĩa dành riêng cho điều thánh trong bối cảnh luật lệ. “Đức Giê-hô-va” nhất quán với bản nháp. Diễn đạt “bò, chiên hay dê” truyền đạt phạm vi của שׁוֹר và שֶׂה mà không thu hẹp שֶׂה chỉ còn chiên.
  issues:
  - severity: medium
    issue: Cụm “con đầu lòng trong đàn gia súc, là con đầu lòng thuộc về...” lặp và khó đọc.
    rationale: Sự lặp này bám mặt chữ nhưng làm tiếng Việt nặng nề. Có thể giữ quan hệ lý do/trạng thái sẵn có của nguyên ngữ bằng “vốn đã thuộc về ... với tư cách là con đầu lòng.”
  - severity: medium
    issue: “biệt riêng nó ra thánh” không phải cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
    rationale: “Thánh hiến nó” là cách dùng gọn, trang trọng, và phù hợp nghĩa Hiphil של קדש trong ngữ cảnh dâng hiến.
  - severity: low
    issue: Chú thích về שֶׂה không còn cần thiết nếu bản văn chính nêu “chiên hay dê.”
    rationale: Bản dịch chính đã thể hiện đầy đủ phạm vi từ vựng liên quan, nên không cần neo chú thích từ vựng.
  revised_text: Tuy nhiên, không ai được thánh hiến một con đầu lòng trong số gia súc, vì nó vốn đã thuộc về Đức Giê-hô-va với tư cách là con đầu lòng; dù là bò, chiên hay dê, nó thuộc về Đức Giê-hô-va.
