- from: Mọi giá trị do con định đều phải theo siếc-lơ nơi thánh[a]; một siếc-lơ là hai mươi ghê-ra.
  to: Mọi mức định giá của con phải theo siếc-lơ của nơi thánh[a]; một siếc-lơ là hai mươi ghê-ra.
