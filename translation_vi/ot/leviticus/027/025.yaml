  yaml_path: translation/ot/leviticus/027/025.yaml
  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: vi
  text: Mọi mức định giá của con phải theo siếc-lơ của nơi thánh[a]; một siếc-lơ là hai mươi ghê-ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo siếc-lơ thánh.” Tiếng Hê-bơ-rơ chỉ chuẩn siếc-lơ dùng cho những việc liên quan đến nơi thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: giá trị do con định
  rationale: Trong Lê-vi Ký 27, từ này chỉ giá trị được ấn định cho người hoặc vật liên quan đến lời khấn. Cách dịch này giữ sắc thái kỹ thuật và đại từ ngôi hai số ít.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Cụm từ nói đến siếc-lơ chuẩn dùng trong các việc thuộc nơi thánh; “theo” diễn đạt chuẩn dùng để định giá, còn “nơi thánh” tránh khiến độc giả hiểu đơn thuần là bản thân đồng tiền có phẩm tính đạo đức.
- source_word: גֵּרָה
  choice: ghê-ra
  rationale: Đây là đơn vị trọng lượng hoặc tiền tệ nhỏ không có từ tương đương tự nhiên trong tiếng Việt, nên phiên âm.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: một siếc-lơ là hai mươi ghê-ra
  rationale: Diễn đạt rõ quan hệ quy đổi mà mệnh đề Hê-bơ-rơ xác định, bằng câu tiếng Việt tự nhiên.
- source_word: וְכָל
  choice: Mọi
  rationale: “Mọi” chuyển tải ý phân phối của כָל trong ngữ cảnh, còn liên từ mở đầu không cần dịch riêng vì câu tiếng Việt vẫn nối tự nhiên với phần trước.
- source_word: יִהְיֶה
  choice: đều phải theo
  rationale: Thể chưa hoàn thành mang lực quy định trong văn bản luật; “phải” thể hiện tính bắt buộc tự nhiên trong tiếng Việt hiện đại.
