translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “con” để giữ lời phán trực tiếp ở ngôi hai số ít trong mạch văn. Các đơn vị cổ được phiên âm nhất quán; dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
