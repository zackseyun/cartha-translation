source:
  edition: WLC
  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: vi
  text: Nhưng nếu chính người đã dâng hiến thửa ruộng ấy chuộc lại nó[a], thì người ấy phải trả thêm một phần năm số bạc đã định giá[b], và thửa ruộng sẽ thuộc về người ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người đã biệt riêng thửa ruộng ấy” hoặc “người đã thánh hóa thửa ruộng ấy.”
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “một phần năm số bạc theo sự định giá của ngươi.” Đại từ “ngươi” hướng đến người có thẩm quyền định giá trong lời luật.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch là “thửa ruộng sẽ được xác lập cho người ấy”; sát nghĩa: “nó sẽ đứng vững cho người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu điều kiện tiếp nối luật lệ trước đó, đồng thời thể hiện sắc thái chuyển ý.
- source_word: גָּאֹל יִגְאַל
  choice: chuộc lại
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động; từ “chính” gắn với chủ thể giúp truyền đạt sự nhấn mạnh tự nhiên trong tiếng Việt.
- source_word: הַשָּׂדֶה
  choice: thửa ruộng
  rationale: Chỉ mảnh ruộng cụ thể đã được nói đến; “thửa ruộng” tự nhiên và chính xác trong văn cảnh luật về đất.
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: người đã biệt riêng thửa ruộng ấy
  rationale: “Biệt riêng” giữ ý đặt tài sản ra riêng cho mục đích thánh, đồng thời dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְיָסַף חֲמִשִׁית כֶּסֶף עֶרְכְּךָ עָלָיו
  choice: phải trả thêm một phần năm số bạc đã định giá
  rationale: Diễn đạt lực quy định pháp lý và ý thêm một phần năm vào khoản định giá; “số bạc” giữ chất liệu tiền tệ của nguyên văn.
- source_word: וְקָם לוֹ
  choice: thửa ruộng sẽ thuộc về người ấy
  rationale: Thành ngữ pháp lý nói quyền sở hữu được xác lập cho người chuộc; cách dịch này tự nhiên hơn lối dịch sát chữ “đứng vững cho người ấy”.
theological_decisions:
- issue: Sắc thái thờ phượng của הַמַּקְדִּישׁ
  choice: biệt riêng
  alternative: dâng hiến; thánh hóa
  rationale: “Biệt riêng” bảo tồn ý đặt tài sản ra riêng trong bối cảnh thánh mà không hàm ý tài sản tự thân biến đổi về đạo đức; chú thích nêu các cách dịch hợp lệ khác.
- issue: Lực pháp lý của chuỗi mệnh đề
  choice: phải trả thêm ... sẽ thuộc về
  alternative: sẽ trả thêm ... sẽ được xác lập cho
  rationale: 'Văn cảnh là luật định: mệnh đề đầu nêu nghĩa vụ thanh toán, mệnh đề sau nêu kết quả pháp lý.'
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “thửa ruộng,” “chuộc lại,” và “phải trả thêm” để người đọc phổ thông dễ hiểu; giữ “số bạc” nhằm phản ánh nguyên ngữ. Mọi dấu chú thích đều xuất hiện trong chính văn.
