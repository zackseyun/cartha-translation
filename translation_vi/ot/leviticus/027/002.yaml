language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: vi
  text: '“Hãy nói với con cái Israel và bảo họ: Khi một người lập một lời khấn đặc biệt liên quan đến việc định giá những người cho Yahweh,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn của cụm này khó hiểu; cũng có thể dịch: “Khi một người lập một lời khấn đặc biệt, theo sự định giá của ngươi đối với những người cho Yahweh.” Các câu tiếp theo quy định các mức định giá cho những người được nói đến trong lời khấn.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Động từ mệnh lệnh Piel trong công thức truyền phán; cách dịch này giữ sắc thái trang trọng và trực tiếp.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh thân tộc của cụm Hê-bơ-rơ, đồng thời đây là cách gọi tập thể dân giao ước quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: אִישׁ
  choice: một người
  rationale: Trong văn luật, danh từ giống đực số ít có chức năng nêu trường hợp đại diện; “một người” tự nhiên trong tiếng Việt mà không làm thay đổi phạm vi pháp lý.
- source_word: יַפְלִא נֶדֶר
  choice: lập một lời khấn đặc biệt
  rationale: Hiphil của פלא đánh dấu tính khác thường hoặc đặc biệt của lời khấn; “lập lời khấn” là cách diễn đạt tự nhiên, trang trọng.
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: về việc định giá một người
  rationale: Cụm từ Hê-bơ-rơ khó về cú pháp. Văn cảnh các câu tiếp theo cho thấy đây là lời khấn liên quan đến mức định giá ấn định cho con người; bản dịch chính diễn đạt quan hệ ấy mà không gán việc định giá trực tiếp cho người khấn.
- source_word: נְפָשֹׁת
  choice: một người
  rationale: Trong văn cảnh pháp lý này, từ chỉ con người được định giá, không phải “linh hồn” theo nghĩa phần phi vật chất.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ danh riêng giao ước יהוה và dùng “cho” để diễn đạt hướng quy thuộc của lời khấn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng.
- issue: Phạm vi của אִישׁ trong quy định pháp luật
  choice: một người
  alternative: một người nam
  rationale: Dù hình thức Hê-bơ-rơ là giống đực số ít, trong công thức luật nó có thể mang chức năng đại diện. Tiếng Việt không bắt buộc đánh dấu giống, nên “một người” giữ được độ mở của ngữ cảnh mà không khẳng định phạm vi chỉ gồm nam giới.
- issue: Quan hệ cú pháp của בְּעֶרְכְּךָ נְפָשֹׁת
  choice: về việc định giá một người
  alternative: theo sự định giá của ngươi đối với các sinh mạng
  rationale: Cấu trúc nguyên văn khó xác định, còn các câu sau trình bày thang định giá. Bản dịch chính nêu quan hệ tổng quát và chú thích bảo tồn cách hiểu sát hình thức hơn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “con cái Israel” để giữ sắc thái giao ước của nguyên văn; dùng “lời khấn” thay vì cách nói khẩu ngữ. Dấu phẩy cuối câu phản ánh việc mệnh đề tiếp tục sang các câu kế tiếp.
