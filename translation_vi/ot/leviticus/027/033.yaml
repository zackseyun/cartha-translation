source:
  edition: WLC
  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: vi
  text: Người ấy không được xem xét con vật là tốt hay xấu[a], cũng không được đổi nó. Nhưng nếu người ấy thực sự đổi nó, thì cả con vật ấy lẫn con vật thay thế đều sẽ trở nên thánh[b]; không được chuộc lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “xem xét giữa tốt và xấu.” Thành ngữ Hê-bơ-rơ nói đến việc phân biệt phẩm chất khi chọn con vật.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ nhấn mạnh động từ: “nếu người ấy nhất định đổi nó” hoặc “nếu người ấy thực sự đổi nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר
  choice: xem xét
  rationale: Dạng piel của בקר trong bối cảnh con vật dâng phần mười chỉ việc kiểm tra để tuyển chọn, chứ không chỉ nhìn qua.
- source_word: בֵּין טוֹב לָרַע
  choice: là tốt hay xấu
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ về việc phân biệt phẩm chất, đồng thời chú thích giữ cấu trúc sát chữ.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: đổi nó / quả thật đổi nó
  rationale: Gốc מור là thuật ngữ pháp lý về việc dùng một con vật thay cho con khác; 'quả thật' thể hiện sự nhấn mạnh của nguyên thể tuyệt đối đi với động từ hữu hạn.
- source_word: תְמוּרָתוֹ
  choice: con vật thay thế
  rationale: Chỉ con vật được đưa vào thay cho con vật ban đầu; cách nói này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: קֹדֶשׁ
  choice: là thánh
  rationale: Giữ sắc thái thờ phượng và giao ước của קדש, nghĩa là thuộc về Đức Chúa Trời do đã được biệt riêng.
- source_word: לֹא יִגָּאֵל
  choice: không được chuộc lại
  rationale: Dạng niphal của גאל nói đến việc con vật không thể được mua chuộc khỏi địa vị đã biệt riêng; 'chuộc lại' giữ thuật ngữ pháp lý-thờ phượng nhất quán.
- source_word: הוּא וּתְמוּרָתוֹ
  choice: cả con vật ấy lẫn con vật thay thế
  rationale: Làm rõ rằng tình trạng thánh áp dụng cho cả con vật ban đầu và con vật được đưa vào thay thế.
theological_decisions:
- issue: Sắc thái pháp lý-thờ phượng của ngôn ngữ biệt riêng
  choice: Dịch קֹדֶשׁ là 'là thánh' và גאל là 'chuộc lại'.
  alternative: Dịch khái quát hơn là 'thiêng liêng' và 'mua lại'.
  rationale: Câu này quy định về con vật đã được biệt riêng trong luật thờ phượng của Israel. 'Thánh' và 'chuộc lại' giữ được sắc thái thần học-pháp lý mà không đưa thêm giáo lý về sau.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng tự nhiên, dễ hiểu trong tiếng Việt hiện đại. Dùng 'người ấy' để giữ chủ thể số ít không xác định; lặp 'con vật' ở những chỗ cần thiết để đại từ không mơ hồ.
