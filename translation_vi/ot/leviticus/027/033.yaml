  to: Người ấy không được xem xét con vật là tốt hay xấu[a], cũng không được đổi nó. Nhưng nếu người ấy thực sự đổi nó, thì cả con vật ấy lẫn con vật thay thế đều sẽ trở nên thánh[b]; không được chuộc lại.
  rationale: Chỉ điều chỉnh “đều sẽ là thánh” thành “đều sẽ trở nên thánh” để tiếng Việt tự nhiên hơn và để nêu rõ hệ quả thánh hiến của việc đổi con vật. Các yếu tố ngữ nghĩa, thuật ngữ pháp lý-thờ phượng và các điểm neo chú thích đều được giữ nguyên.
