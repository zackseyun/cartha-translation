id: LEV.27.32
reference: Leviticus 27:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: vi
  text: Mọi phần mười của đàn bò và đàn chiên dê, tức là mỗi con vật thứ mười trong số các con đi qua dưới cây gậy[a], sẽ là vật thánh dành cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này chỉ việc đếm gia súc khi chúng lần lượt đi qua dưới gậy của người chăn; cứ con thứ mười được dành riêng cho Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל מַעְשַׂר
  choice: Mọi phần mười
  rationale: Giữ nghĩa pháp lý của מַעְשַׂר là phần mười được biệt riêng, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: בָּקָר וָ/צֹאן
  choice: đàn bò và đàn chiên dê
  rationale: בָּקָר chỉ đại gia súc, còn צֹאן là tiểu gia súc gồm chủ yếu chiên và dê; cách dịch này rõ nghĩa hơn từ khái quát 'bầy'.
- source_word: כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַ/שָּׁבֶט
  choice: đi qua dưới cây gậy
  rationale: Bảo tồn hình ảnh chăn nuôi về việc cho từng con vật đi qua dưới gậy để đếm.
- source_word: הָ/עֲשִׂירִי
  choice: mỗi con thứ mười
  rationale: Nguyên văn là 'con thứ mười'; thêm 'con' theo danh từ được ngầm hiểu và dùng 'mỗi' để thể hiện ý phân phối trong từng lượt đếm.
- source_word: יִהְיֶה קֹּדֶשׁ לַ/יהוָה
  choice: đều sẽ là thánh, thuộc về Yahweh
  rationale: Giữ phạm trù 'thánh' của קֹדֶשׁ và làm rõ sắc thái dâng riêng, thuộc về trong לַיהוָה mà không đồng nhất 'thánh' với một hành động nghi lễ.
theological_decisions:
- issue: Cách dịch danh riêng יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng tên giao ước được biểu thị trực tiếp trong nguyên văn, thay vì thay bằng một tước hiệu.
- issue: Quan hệ giữa 'phần mười' và 'con thứ mười'
  choice: Dùng 'tức' để cho thấy con thứ mười giải thích cách xác định phần mười
  alternative: Đặt hai cụm cạnh nhau chỉ bằng dấu phẩy
  rationale: Trong ngữ cảnh, הָעֲשִׂירִי mô tả con vật thứ mười khi đi qua dưới gậy; 'tức' làm rõ quan hệ đồng vị vốn có mà không thay đổi quy định.
- issue: Ý nghĩa của קֹדֶשׁ לַיהוָה
  choice: là thánh, thuộc về Yahweh
  alternative: được thánh hiến cho Yahweh
  rationale: Giữ cấu trúc vị ngữ và sự phân biệt giữa tình trạng thánh với hành động thánh hiến, đồng thời truyền đạt hướng quy thuộc của giới từ לְ.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. 'Chiên dê' được dùng để diễn đạt rõ phạm vi tập hợp của צֹאן. Dấu chú thích [a] xuất hiện ngay sau hình ảnh cần giải thích.
