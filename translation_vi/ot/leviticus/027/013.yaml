base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/013.yaml
  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: vi
  text: Nhưng nếu người ấy nhất định chuộc lại con vật đó[a], thì phải thêm một phần năm vào giá trị do ông định.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chuộc lại con vật đó” hoặc “thật sự chuộc lại con vật đó”; tiếng Hê-bơ-rơ dùng nguyên mẫu tuyệt đối cùng với động từ hữu hạn để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ mở đầu một điều kiện có sắc thái tương phản với quy định ở câu trước; “Nhưng nếu” tự nhiên và giữ được mạch luật lệ.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: người ấy nhất định chuộc lại con vật đó
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động chuộc. “Nhất định chuộc lại” truyền đạt sắc thái nhấn mạnh; đại từ giống cái số ít chỉ con vật ô uế được nói đến ở câu trước.
- source_word: וְיָסַף
  choice: thì phải thêm
  rationale: Trong văn cảnh luật lệ, động từ diễn tả hệ quả bắt buộc của điều kiện; “thì phải thêm” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: חֲמִישִׁתוֹ
  choice: một phần năm
  rationale: Danh từ chỉ phần thứ năm. Bản Hê-bơ-rơ không nêu lại rõ ràng đối tượng dùng làm cơ sở tính phần năm, nên bản dịch không tự ý bổ sung “của giá trị ấy”.
- source_word: עַל עֶרְכֶּךָ
  choice: vào giá trị do ông định
  rationale: עַל sau động từ “thêm” mang nghĩa cộng thêm vào; עֶרְכֶּךָ là giá trị được người đang được xưng hô trực tiếp—trong văn cảnh là thầy tế lễ—ấn định. Cách diễn đạt này giữ đại từ ngôi hai số ít mà tự nhiên hơn “giá trị của ông”.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “người ấy” cho chủ thể và “ông” cho người được trực tiếp xưng hô, phù hợp ngữ cảnh thầy tế lễ định giá; tránh bổ sung đối tượng của “một phần năm” vì nguyên văn để ngỏ.
