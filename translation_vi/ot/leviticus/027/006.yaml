source:
  edition: WLC
  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: vi
  text: Nếu người ấy từ một tháng tuổi đến năm tuổi, thì mức định giá của ngươi đối với nam là năm siếc-lơ bạc, còn đối với nữ là ba siếc-lơ bạc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: từ một tháng tuổi đến năm tuổi
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ độ tuổi, đồng thời giữ nguyên ranh giới của nhóm tuổi trong quy định.
- source_word: עֶרְכְּךָ
  choice: mức định giá của con
  rationale: Danh từ chỉ mức giá ấn định trong quy định về lời khấn; hậu tố ngôi hai số ít giống đực được giữ lại là “của con”, phù hợp lời Đức Chúa Trời truyền cho Môi-se trong ngữ cảnh.
- source_word: הַזָּכָר
  choice: đối với nam
  rationale: Giữ phân loại theo giới tính của nguyên văn mà không dùng từ chỉ một giai đoạn tuổi cụ thể như “bé trai”.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: năm siếc-lơ bạc
  rationale: Chuyển trực tiếp đơn vị trọng lượng/tiền tệ và chất liệu được nêu trong nguyên văn.
- source_word: וְלַנְּקֵבָה
  choice: còn đối với nữ
  rationale: Thể hiện rõ cấu trúc đối chiếu song song với hạng mục nam.
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: ba siếc-lơ bạc
  rationale: Chuyển trực tiếp số tiền và giữ cách diễn đạt nhất quán với hạng mục nam.
- source_word: וְהָיָה
  choice: thì ... là
  rationale: Trong văn bản luật, hình thức này xác lập mức áp dụng; tiếng Việt hiện đại dùng “thì… là” tự nhiên và có tính quy định.
theological_decisions:
- issue: Chủ thể ngầm của mệnh đề chỉ độ tuổi
  choice: người được biệt riêng
  alternative: nếu là người từ một tháng tuổi
  rationale: Nguyên văn câu này chỉ nói “nếu từ một tháng tuổi...” và dựa vào ngữ cảnh các câu trước để hiểu đối tượng là người được định giá theo lời khấn. Bổ sung tối thiểu giúp câu tiếng Việt đứng vững, nhưng chú thích ghi rõ phần được hiểu theo ngữ cảnh.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “mức định giá” cho thuật ngữ xuyên suốt Lê-vi Ký 27 và phiên âm “siếc-lơ” cho đơn vị שֶׁקֶל. Cấu trúc “đối với nam/nữ” phù hợp cả trẻ nhỏ trong nhóm tuổi này, tránh các danh từ tuổi tác không có trong nguyên văn.
