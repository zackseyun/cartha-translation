base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: vi
  text: Nếu người ấy thánh hiến ruộng mình[a] kể từ năm hân hỉ, thì mức định giá của ông vẫn có hiệu lực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dâng hiến ruộng mình.” Động từ Hê-bơ-rơ chỉ việc biệt riêng một vật làm thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Diễn đạt trực tiếp tiểu từ điều kiện mở đầu một trường hợp luật định.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: kể từ năm hân hỉ
  rationale: Giới từ מִן chỉ mốc khởi đầu; cách dịch này phù hợp với việc định giá theo thời gian còn lại cho đến năm hân hỉ kế tiếp.
- source_word: יַקְדִּישׁ
  choice: biệt ... ra làm thánh
  rationale: Dạng Hiphil của קדשׁ chỉ việc dành riêng tài sản cho mục đích thánh; cách diễn đạt này giữ được sắc thái thờ phượng mà vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: שָׂדֵהוּ
  choice: ruộng mình
  rationale: Chuyển tải tự nhiên danh từ kèm hậu tố sở hữu ngôi thứ ba trong mệnh đề có chủ ngữ là “người ấy”.
- source_word: כְּעֶרְכְּךָ
  choice: mức định giá của ông
  rationale: Giữ đại từ ngôi thứ hai số ít của nguyên văn và diễn đạt rõ đây là mức giá do người đang được phán bảo ấn định.
- source_word: יָקוּם
  choice: sẽ được giữ nguyên
  rationale: Trong ngữ cảnh pháp lý và hành chính, קום nói đến hiệu lực ổn định của mức định giá; “được giữ nguyên” tự nhiên hơn lối dịch sát “sẽ đứng vững”.
theological_decisions:
- issue: Động từ thờ phượng chỉ việc dành riêng tài sản cho Đức Chúa Trời
  choice: biệt ... ra làm thánh
  alternative: dâng hiến
  rationale: Lựa chọn chính giữ rõ ý đặt riêng vào phạm vi thánh của קדשׁ, trong khi “dâng hiến” tự nhiên hơn nhưng có thể làm nhẹ sắc thái thánh hóa của động từ.
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại. “Năm hân hỉ” được dùng như tên gọi thông dụng của thiết chế יוֹבֵל; “ông” giữ ngôi thứ hai số ít mà tránh sắc thái cổ của “ngươi”.
