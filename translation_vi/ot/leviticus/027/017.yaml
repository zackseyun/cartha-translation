    rationale: Động từ Hiphil קדשׁ ở đây chỉ hành vi thánh hiến/dành riêng tài sản cho mục đích thánh. “Thánh hiến ruộng mình” truyền đạt trực tiếp, tự nhiên và trang trọng hơn.
