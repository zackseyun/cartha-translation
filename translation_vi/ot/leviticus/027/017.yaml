revisions:
- from: Nếu người ấy biệt ruộng mình ra làm thánh[a] kể từ năm hân hỉ, thì mức định giá của ông sẽ được giữ nguyên.
  to: Nếu người ấy thánh hiến ruộng mình[a] kể từ năm hân hỉ, thì mức định giá của ông vẫn có hiệu lực.
  rationale: Thay “biệt ... ra làm thánh” bằng “thánh hiến” để sửa cách diễn đạt không tự nhiên, đồng thời duy trì nghĩa cultic của nguyên văn. Điều chỉnh vị ngữ cuối thành “vẫn có hiệu lực” để diễn đạt rõ giá trị pháp lý liên tục của יָקוּם.
