language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: vi
  text: Mức định giá của ngươi đối với người nam từ hai mươi tuổi cho đến sáu mươi tuổi sẽ là năm mươi siếc-lơ bạc, tính theo tiêu chuẩn siếc-lơ của nơi thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “theo siếc-lơ của nơi thánh”; cụm từ này chỉ tiêu chuẩn cân dùng tại nơi thánh.'
    reason: Làm rõ rằng cụm Hê-bơ-rơ nói đến chuẩn đo lường, đồng thời cho người đọc thấy cách diễn đạt sát nguyên văn.
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: mức định giá của ngươi
  rationale: עֵרֶךְ ở Lê-vi Ký 27 chỉ mức được ấn định trong quy định về lời khấn, không phải giá trị nội tại của con người; hậu tố ngôi thứ hai số ít được giữ lại bằng “của ngươi”.
- source_word: הַזָּכָר
  choice: người nam
  rationale: Cụm từ chỉ rõ hạng người theo giới tính trong quy định định giá. “Người nam” chính xác và không biến cách gọi pháp lý này thành một nhận định về phẩm giá.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: từ hai mươi tuổi cho đến sáu mươi tuổi
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ khoảng tuổi, đồng thời giữ cấu trúc từ… cho đến… của nguyên văn.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: năm mươi siếc-lơ bạc
  rationale: Giữ đơn vị trọng lượng cổ “siếc-lơ” và xác định kim loại là bạc, phù hợp với cấu trúc nguyên văn.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: tính theo tiêu chuẩn siếc-lơ của nơi thánh
  rationale: Giới từ בְּ tại đây nêu chuẩn dùng để tính. Cách dịch này làm rõ chức năng đo lường của cụm từ mà vẫn giữ mối liên hệ với nơi thánh.
- source_word: וְהָיָה ... וְהָיָה
  choice: sẽ là
  rationale: Trong văn cảnh luật định, “sẽ là” diễn đạt mức được quy định, tự nhiên hơn lối hành văn pháp lý cổ “phải là” nhưng không làm thành lời dự đoán đơn thuần.
theological_decisions:
- issue: Hạng định giá theo giới tính
  choice: người nam
  alternative: người đàn ông; một người nam
  rationale: Nguyên văn phân hạng định giá theo giới tính và tuổi. Bản dịch giữ sự phân biệt ấy, không trung tính hóa và cũng không thêm nhận định thần học về giá trị con người.
- issue: Bản chất của עֵרֶךְ trong Lê-vi Ký 27
  choice: mức định giá
  alternative: giá trị; mức ước tính
  rationale: Đây là số tiền được ấn định trong bối cảnh lời khấn và nơi thánh, không phải giá thị trường hay phẩm giá nội tại của người được nói đến.
- issue: Ý nghĩa của “siếc-lơ của nơi thánh”
  choice: một tiêu chuẩn đo lường thuộc nơi thánh
  alternative: một loại tiền thánh hoặc bản thân siếc-lơ là vật thánh
  rationale: Cụm Hê-bơ-rơ xác định chuẩn cân dùng để tính số bạc; bản dịch tránh suy diễn rằng đồng bạc tự nó mang tính thánh.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và mang tính luật định. Dùng “ngươi” để giữ ngôi thứ hai số ít trong lời truyền phán; “siếc-lơ” là dạng phiên âm quen thuộc trong tiếng Việt. Câu tránh dùng “giá trị” để không gợi ý rằng bản văn đang định lượng phẩm giá con người.
