id: LEV.27.15
reference: Leviticus 27:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: vi
  text: Nếu người đã biệt riêng nhà mình làm thánh chuộc lại nó[a], thì người ấy phải trả thêm một phần năm số bạc theo giá thầy tế lễ đã định[b], và ngôi nhà sẽ thuộc về người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người đã dâng hiến nhà mình” hoặc “người đã thánh hóa nhà mình.”
    reason: lexical_alternative
  - marker: b
    text: Tức là người ấy trả thêm một phần năm trên số bạc tương ứng với giá do thầy tế lễ định.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: người đã biệt riêng
  rationale: Động từ קדשׁ ở đây nói đến việc dành ngôi nhà riêng ra làm thánh cho Đức Chúa Trời. “Biệt riêng” giữ được sắc thái thánh thiêng mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: יִגְאַל
  choice: chuộc lại
  rationale: Trong bối cảnh luật lệ và thờ phượng này, גאל chỉ việc lấy lại tài sản bằng cách trả tiền; “chuộc lại” vừa chính xác vừa dễ hiểu.
- source_word: בֵּיתוֹ
  choice: nhà mình
  rationale: Danh từ có nghĩa đen là “nhà của người ấy.” Đại từ phản thân “mình” tự nhiên trong mệnh đề có cùng chủ thể và vẫn giữ đối tượng là ngôi nhà.
- source_word: וְיָסַף
  choice: phải trả thêm
  rationale: Cấu trúc này diễn đạt nghĩa vụ phát sinh sau điều kiện. “Phải trả thêm” truyền đạt rõ tính bắt buộc và việc cộng thêm vào khoản thanh toán.
- source_word: חֲמִישִׁית
  choice: một phần năm
  rationale: Đây là cách diễn đạt chính xác, tự nhiên và phù hợp văn phong Kinh Thánh hơn cách hiện đại hóa thành “hai mươi phần trăm.”
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: số bạc theo giá thầy tế lễ đã định
  rationale: כֶּסֶף được giữ cụ thể là “bạc”; עֶרְכְּךָ là giá do người đang được xưng hô định. Theo ngữ cảnh 27:14, người ấy là thầy tế lễ, nên cách diễn đạt này làm rõ tham chiếu mà không thay đổi nội dung.
- source_word: עָלָיו
  choice: trả thêm ... theo giá
  rationale: Giới từ ở đây biểu thị khoản một phần năm được cộng vào mức định giá; cấu trúc tiếng Việt chuyển ý cộng thêm vào động từ để câu tự nhiên.
- source_word: וְהָיָה לוֹ
  choice: ngôi nhà sẽ lại thuộc về người ấy
  rationale: Mệnh đề nêu kết quả quyền sở hữu sau khi chuộc. “Lại” diễn đạt tự nhiên hệ quả lấy lại căn nhà, tuy ý này phát sinh từ ngữ cảnh chuộc lại.
theological_decisions:
- issue: Thuật ngữ thờ phượng dành cho tài sản được đặt riêng cho Đức Chúa Trời
  choice: biệt riêng
  alternative: dâng hiến; thánh hóa
  rationale: “Biệt riêng” giữ ý căn nhà được đặt vào địa vị thánh trong hệ thống định giá của Lê-vi Ký 27, đồng thời tránh khiến độc giả hiểu đây chỉ là một khoản tặng thông thường hoặc áp dụng khái niệm thánh hóa con người cho tài sản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc điều kiện và sắc thái pháp lý của nguyên văn; dùng “chuộc lại” và “một phần năm” để bảo toàn ngôn ngữ luật lệ–thờ phượng.
