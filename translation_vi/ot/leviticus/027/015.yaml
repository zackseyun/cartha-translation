revisions:
- from: Nếu người đã biệt riêng ngôi nhà muốn chuộc lại nhà mình[a], thì người ấy phải trả thêm một phần năm số bạc theo giá thầy tế lễ đã định[b], và ngôi nhà sẽ lại thuộc về người ấy.
  to: Nếu người đã biệt riêng nhà mình làm thánh chuộc lại nó[a], thì người ấy phải trả thêm một phần năm số bạc theo giá thầy tế lễ đã định[b], và ngôi nhà sẽ thuộc về người ấy.
  rationale: Bỏ các từ thêm ý (“muốn”, “lại”), đồng thời điều chỉnh cách diễn đạt của hành vi consecrate để phản ánh rõ hơn sắc thái thánh–pháp lý của tiếng Hê-bơ-rơ. Các neo chú thích được giữ đúng vị trí và nội dung chú thích được cập nhật cho phù hợp với bản văn sửa.
  reviewer_model: gpt-5.6-terra
