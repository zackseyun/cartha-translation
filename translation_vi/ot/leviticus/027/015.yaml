review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng khung điều kiện–nghĩa vụ–kết quả của tiếng Hê-bơ-rơ, cùng các ý chính: người đã biệt riêng nhà, chuộc lại, cộng thêm một phần năm của số bạc định giá, rồi nhà thuộc về người ấy. Tuy nhiên, “muốn chuộc lại” thêm ý muốn/ý định không có trong יִגְאַל (“chuộc lại”), và “lại” trong mệnh đề kết thêm một sắc thái không được phát biểu trong nguyên văn.'
  naturalness: “Người đã biệt riêng ngôi nhà” hơi gượng trong tiếng Việt hiện đại vì thiếu bổ ngữ làm rõ hành vi biệt riêng mang tính thánh. “đã biệt riêng nhà mình làm thánh” tự nhiên hơn trong văn cảnh luật lệ thờ phượng. Câu sửa vẫn giữ văn phong trang trọng, rõ ràng.
  terminology: Giữ “biệt riêng ... làm thánh” cho הַמַּקְדִּישׁ để biểu đạt việc đặt tài sản vào tình trạng thánh, “chuộc lại” cho גאל, “một phần năm” cho חֲמִישִׁית, và “số bạc theo giá thầy tế lễ đã định” cho כֶּסֶף עֶרְכְּךָ. Không thêm diễn giải sở hữu “lại”.
  issues:
  - severity: medium
    issue: “muốn chuộc lại” thêm ý muốn/ý định.
    rationale: יִגְאַל nêu điều kiện thực hiện việc chuộc lại, không nói rằng người ấy chỉ có ý muốn chuộc.
  - severity: low
    issue: “lại thuộc về người ấy” thêm từ “lại”.
    rationale: וְהָיָה לוֹ chỉ nói “sẽ thuộc về người ấy”; dù ý lấy lại có thể suy ra từ “chuộc lại”, nguyên văn không nêu trạng từ này.
  - severity: low
    issue: Cụm “đã biệt riêng ngôi nhà” chưa diễn đạt rõ sắc thái thánh của động từ קדשׁ trong ngữ cảnh này.
    rationale: Thêm “làm thánh” làm rõ hành vi biệt riêng có tính thờ phượng mà không áp đặt diễn giải giáo phái.
  revised_text: Nếu người đã biệt riêng nhà mình làm thánh chuộc lại nó[a], thì người ấy phải trả thêm một phần năm số bạc theo giá thầy tế lễ đã định[b], và ngôi nhà sẽ thuộc về người ấy.
