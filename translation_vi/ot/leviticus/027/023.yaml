  terminology: Giữ “thầy tế lễ,” “giá định,” “Năm Hân Hỉ,” và “Đức Giê-hô-va” nhất quán. “Giá định của mình” bảo toàn hậu tố ngôi thứ hai trong lời luật trực tiếp, đồng thời tự nhiên trong tiếng Việt.
