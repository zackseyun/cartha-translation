revisions:
- from: thì thầy tế lễ phải tính cho người ấy phần tương ứng trong giá định của ông, tính đến Năm Hân Hỉ; và ngay ngày ấy, người ấy phải nộp giá định đó, là vật thánh dâng cho Đức Giê-hô-va.[a]
  to: thì thầy tế lễ phải tính cho người ấy khoản tương ứng của giá định của ông cho đến Năm Hân Hỉ; và trong ngày ấy, người ấy phải nộp giá định của mình, làm vật thánh hiến cho Đức Giê-hô-va.[a]
  rationale: Bản sửa thay cách diễn đạt “trong giá định” bằng “của giá định” để phản ánh chính xác mối quan hệ định ngữ trong tiếng Hê-bơ-rơ. “Trong ngày ấy” dịch trực tiếp בַּיּוֹם הַהוּא. Cụm cuối được chỉnh để tiếng Việt tự nhiên hơn và cho thấy khoản nộp được thánh hiến cho Đức Giê-hô-va; chú thích vẫn giữ cách dịch sát, cô đọng của nguyên văn.
