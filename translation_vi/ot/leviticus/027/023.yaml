base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: vi
  text: thì thầy tế lễ phải tính cho người ấy khoản tương ứng của giá định của ông cho đến Năm Hân Hỉ; và trong ngày ấy, người ấy phải nộp giá định của mình, làm vật thánh hiến cho Đức Giê-hô-va.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “thánh cho Đức Giê-hô-va.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב ל֣וֹ הַכֹּהֵן
  choice: thì thầy tế lễ phải tính cho người ấy
  rationale: Động từ Piel חִשַּׁב chỉ việc tính toán; לּוֹ là đối tượng hưởng lợi, còn הַכֹּהֵן là chủ thể thực hiện.
- source_word: מִכְסַת הָעֶרְכְּךָ
  choice: phần tương ứng trong giá định của ông
  rationale: מִכְסָה ở đây là phần được tính theo tỷ lệ; עֵרֶךְ là thuật ngữ chỉ giá trị được ấn định trong Lê-vi Ký 27. Hậu tố ngôi thứ hai số ít được giữ bằng “của ông”.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: tính đến Năm Hân Hỉ
  rationale: Cụm này xác định mốc cuối để tính tỷ lệ; “Năm Hân Hỉ” là cách gọi trang trọng, dễ hiểu của thiết chế יוֹבֵל.
- source_word: וְנָתַן אֶת הָעֶרְכְּךָ
  choice: người ấy phải nộp giá định đó
  rationale: נתן cơ bản là “trao/đưa”; trong ngữ cảnh thanh toán khoản được định giá, “nộp” tự nhiên hơn mà không xác định quá mức hình thức thanh toán.
- source_word: בַּיּוֹם הַהוּא
  choice: ngay ngày ấy
  rationale: Diễn đạt trực tiếp thời điểm phải nộp, đồng thời giữ sắc thái xác định của הַהוּא.
- source_word: קֹדֶשׁ לַיהוָה
  choice: là vật thánh dâng cho Đức Giê-hô-va
  rationale: קֹדֶשׁ biểu thị vật được biệt riêng làm thánh cho YHWH; thêm “vật” giúp câu tiếng Việt tự nhiên và giữ lực tế tự của cụm từ.
- source_word: יהוה
  choice: Đức Giê-hô-va
  rationale: Dùng danh riêng truyền thống, quen thuộc và trang trọng trong tiếng Việt để biểu đạt Tứ Tự Danh.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của וְנָתַן
  choice: “người ấy” — người dâng/chuộc ruộng — là người phải nộp
  alternative: thầy tế lễ là người nộp
  rationale: Thầy tế lễ là chủ ngữ được nêu rõ của hành động tính toán, nhưng mạch luật lệ cho thấy người có ruộng mới là người nộp khoản định giá. Tiếng Việt cần nêu lại chủ ngữ để tránh hiểu lầm.
- issue: Cách diễn đạt קֹדֶשׁ לַיהוָה
  choice: “là vật thánh dâng cho Đức Giê-hô-va”
  alternative: “thánh cho Đức Giê-hô-va”
  rationale: Bản dịch chính làm rõ rằng khoản được nộp là vật đã được biệt riêng cho Đức Chúa Trời; cách dịch sát hình thức hơn được giữ trong chú thích để bảo tồn cấu trúc và độ cô đọng của nguyên văn.
translation_notes:
  register: Văn phong luật lệ, trang trọng nhưng hiện đại. “Giá định” được dùng nhất quán như thuật ngữ kỹ thuật của Lê-vi Ký 27; “phần tương ứng” truyền đạt phép tính theo tỷ lệ đến Năm Hân Hỉ. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan.
