  verdict: revise
  source_fidelity: 'Bản thảo phản ánh đúng trình tự chính: thầy tế lễ tính khoản theo giá định cho đến Năm Hân Hỉ, rồi người ấy nộp khoản đó. Tuy nhiên, “phần tương ứng trong giá định” không sát bằng cách nói khoản/số tiền tương ứng của giá định; và mệnh đề cuối nên liên kết rõ khoản nộp với tình trạng được thánh hiến cho YHWH.'
