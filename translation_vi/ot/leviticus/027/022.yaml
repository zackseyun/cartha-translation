id: LEV.27.22
reference: Leviticus 27:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: vi
  text: Nhưng nếu người ấy biệt riêng cho Yahweh một thửa ruộng mình đã mua[a], không thuộc phần ruộng gia nghiệp của mình,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “một thửa ruộng do mình mua được”, đối lập với đất thuộc gia nghiệp tổ tiên của người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: 'Mở đầu một trường hợp có điều kiện tiếp nối luật trước, đồng thời biểu thị sự chuyển sang trường hợp tương phản: ruộng mua thay vì ruộng gia nghiệp.'
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: một thửa ruộng mình đã mua
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nghĩa một thửa ruộng có được bằng việc mua, đồng thời giữ rõ sự đối lập pháp lý với đất gia nghiệp.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: không thuộc phần ruộng gia nghiệp của mình
  rationale: אֲחֻזָּה trong văn cảnh chỉ phần đất được nắm giữ như gia sản thừa kế. Cách dịch này truyền đạt tự nhiên rằng thửa ruộng đã mua không nằm trong phần đất gia truyền của người ấy.
- source_word: יַקְדִּישׁ
  choice: biệt riêng
  rationale: Trong Lê-vi Ký 27, động từ chỉ việc tách một vật ra để thuộc về Đức Chúa Trời trong bối cảnh thánh hiến và pháp lý. “Biệt riêng” rõ nghĩa, trang trọng và tránh hàm ý rằng tự thân vật ấy được biến đổi.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giới từ ל biểu thị đối tượng tiếp nhận sự biệt riêng; danh thánh יהוה được phiên âm là “Yahweh” để giữ danh giao ước xuất hiện trực tiếp trong nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng giao ước יהוה. Phiên âm “Yahweh” phân biệt danh này với tước hiệu và không áp đặt một cách thay thế theo truyền thống giáo phái.
- issue: Sắc thái của יַקְדִּישׁ
  choice: biệt riêng
  alternative: thánh hiến; dâng hiến
  rationale: “Biệt riêng” giữ trọng tâm là đặt thửa ruộng riêng ra cho Yahweh trong thủ tục được quy định, trong khi “dâng hiến” có thể làm mờ sắc thái thánh và “thánh hiến” có thể kém tự nhiên đối với một thửa ruộng.
translation_notes:
  register: Văn phong pháp luật–thờ phượng trang trọng nhưng hiện đại. “Thửa ruộng” tự nhiên và chính xác hơn “cánh đồng” trong ngữ cảnh quyền sở hữu đất; “gia nghiệp” giữ sắc thái đất đai được truyền thừa. Dấu phẩy cuối câu được giữ vì câu điều kiện tiếp tục sang câu 23.
