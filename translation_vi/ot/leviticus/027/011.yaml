language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: vi
  text: Nhưng nếu đó là bất cứ con vật ô uế nào mà người ta không được lấy nó để dâng làm lễ vật cho Yahweh[a], thì người ấy phải đặt con vật trước mặt thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mà từ con vật ấy người ta không được dâng lễ vật cho Yahweh.” Tiếng Hê-bơ-rơ dùng động từ số nhiều với nghĩa phiếm chỉ.'
    reason: Giữ cấu trúc “từ con vật ấy” của מִמֶּנָּה và nét không xác định của chủ thể số nhiều trong nguyên văn.
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một trường hợp có điều kiện tiếp nối luật trước, đồng thời biểu thị sự tương phản với trường hợp con vật thanh sạch.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: bất cứ con vật ô uế nào
  rationale: כָּל với danh từ số ít mang nghĩa bất định; “ô uế” diễn đạt tình trạng không thanh sạch theo nghi lễ, không phải bẩn về thể chất.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: mà người ta không được dùng làm lễ vật dâng lên
  rationale: Động từ ngôi thứ ba số nhiều có lực phiếm chỉ, nên dịch tự nhiên là “người ta”; מִמֶּנָּה được thể hiện bằng “dùng [con vật ấy] làm”, còn הקריב vẫn giữ ý đem đến/dâng trình trong nghi lễ.
- source_word: קָרְבָּן
  choice: lễ vật
  rationale: Thuật ngữ chỉ vật được đem đến dâng cho Đức Chúa Trời; “lễ vật” rõ nghĩa và phù hợp văn cảnh tế lễ.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị trực tiếp bằng יהוה; “dâng lên” là cách nói tự nhiên trong tiếng Việt.
- source_word: וְהֶעֱמִיד
  choice: thì người ấy phải đem ... đến
  rationale: Hiphil của עמד theo nghĩa đen là làm cho đứng/đặt vào vị trí. Trong tiếng Việt, “đem ... đến trước mặt” truyền đạt tự nhiên hành động đưa con vật ra để thầy tế lễ xem xét, đồng thời giữ tính mệnh lệnh của quy định.
- source_word: אֶת הַבְּהֵמָה לִפְנֵי הַכֹּהֵן
  choice: con vật đến trước mặt thầy tế lễ
  rationale: Diễn đạt rõ việc đưa con vật vào sự hiện diện của thầy tế lễ để định giá trong câu tiếp theo.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Lực nghĩa của יַקְרִיבוּ ở số nhiều
  choice: người ta không được
  alternative: họ không dâng
  rationale: Chủ thể số nhiều không được xác định và có lực phiếm chỉ. Cách dịch “người ta” giữ tính khái quát, không gán hành động cho một nhóm cụ thể; “không được” phù hợp việc con vật không hợp lệ để làm sinh tế.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Dùng “thầy tế lễ” để chỉ הַכֹּהֵן và “ô uế” theo nghĩa nghi lễ. Dấu phẩy cuối câu của lớp tham khảo tiếng Anh được thay bằng dấu chấm vì câu này có thể đứng độc lập trong tiếng Việt.
