    rationale: Nguyên văn nói về con vật mà từ nó người ta không dâng một lễ vật; cách “lấy nó để dâng làm lễ vật” làm rõ con vật là đối tượng được dùng cho việc dâng tế mà vẫn giữ chủ thể phiếm chỉ.
  - severity: low
    issue: “Đem ... đến trước mặt” diễn giải hành động chung hơn động từ וְהֶעֱמִיד.
    rationale: Hiphil của עמד nhấn mạnh việc đặt/làm cho con vật đứng trước mặt thầy tế lễ. “Đặt ... trước mặt” phản ánh trực tiếp hơn mà vẫn tự nhiên.
