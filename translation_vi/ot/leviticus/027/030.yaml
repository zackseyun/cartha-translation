source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: vi
  text: Mọi phần mười của đất đai[a]—từ hạt giống của đất và từ trái của cây—đều thuộc về Yahweh; đó là vật thánh, dành cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát nguyên văn: “Mọi phần mười của đất.”'
    reason: Bản văn Hê-bơ-rơ dùng kết cấu sở thuộc; «đất đai» phản ánh ngữ cảnh nông nghiệp.
lexical_decisions:
- source_word: וְכָל מַעְשַׂר
  choice: Mọi phần mười
  rationale: כָּל đi với danh từ số ít mang nghĩa phân phối; “mọi” diễn đạt tự nhiên. “Phần mười” truyền đạt trực tiếp khoản một phần mười phải dâng mà không phụ thuộc vào thuật ngữ giáo phái.
- source_word: הָאָרֶץ
  choice: thu từ đất đai
  rationale: Trong ngữ cảnh nông nghiệp, אֶרֶץ chỉ đất sản sinh mùa màng, không phải toàn thể trái đất. Thêm “thu từ” làm rõ quan hệ nguồn gốc vốn được các cụm מִן tiếp theo giải thích.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: từ hạt giống của đất
  rationale: Giữ hình ảnh cụ thể “hạt giống” của tiếng Hê-bơ-rơ, dù trong ngữ cảnh cụm này có thể bao quát sản vật do gieo trồng.
- source_word: מִפְּרִי הָעֵץ
  choice: từ trái của cây
  rationale: Duy trì danh từ tập hợp số ít “cây” và hình ảnh đối xứng với “hạt giống của đất”.
- source_word: לַיהוָה הוּא
  choice: đều thuộc về Yahweh
  rationale: Giới từ לְ ở đây biểu thị quyền sở hữu hoặc sự hiến dâng; “thuộc về” diễn đạt rõ nghĩa trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: קֹדֶשׁ לַיהוָה
  choice: của thánh dành cho Yahweh
  rationale: “Của thánh” giữ sắc thái lễ nghi của קֹדֶשׁ, tức một vật được biệt riêng; “dành cho” thể hiện hướng quy thuộc của לְ mà không nâng thành cấp “chí thánh” vốn không có trong nguyên văn.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA hoặc Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tên Riêng יהוה; phiên âm “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của קֹדֶשׁ לַיהוָה
  choice: của thánh dành cho Yahweh
  alternative: thánh đối với Yahweh
  rationale: Cách chọn truyền đạt sự biệt riêng để thuộc về Đức Chúa Trời, nhưng không thêm ý “chí thánh” hay xác định sâu hơn bản chất của sự thánh hiến.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ các hình ảnh nông nghiệp cụ thể của nguyên văn; dùng dấu gạch ngang để cho thấy hai cụm sau giải thích “thu từ đất đai”.
