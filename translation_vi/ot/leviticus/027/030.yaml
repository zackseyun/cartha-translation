revisions:
- from: Mọi phần mười thu từ đất đai[a]—từ hạt giống của đất và từ trái của cây—đều thuộc về Yahweh; đó là của thánh dành cho Yahweh.
  to: Mọi phần mười của đất đai[a]—từ hạt giống của đất và từ trái của cây—đều thuộc về Yahweh; đó là vật thánh, dành cho Yahweh.
  rationale: Sửa «thu từ đất đai» thành «của đất đai» để theo sát kết cấu sở thuộc của nguyên văn, và thay «của thánh» bằng «vật thánh» để diễn đạt đúng, tự nhiên vị ngữ קֹדֶשׁ. Giữ sự lặp lại quy hướng về Yahweh và không giải quyết quá mức sắc thái của công thức thánh hiến.
