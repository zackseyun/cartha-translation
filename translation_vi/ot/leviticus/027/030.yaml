review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính của tiếng Hê-bơ-rơ: mọi phần mười từ sản vật đất và cây đều thuộc về Yahweh và là qōdeš dành cho Ngài. Tuy nhiên, «thu từ đất đai» diễn giải quan hệ sở thuộc trong מַעְשַׂר הָאָרֶץ, còn «của thánh» không phải cách dùng tự nhiên và chưa thể hiện rõ qōdeš là một vật/sự vật thánh.'
  naturalness: «Mọi phần mười của đất đai» là cách nói sát và tự nhiên trong văn cảnh nông nghiệp. «Vật thánh» là cách diễn đạt hiện đại, rõ nghĩa hơn «của thánh». Dấu gạch ngang giữ được chức năng giải thích của hai cụm «từ ...».
  terminology: Giữ «phần mười», «Yahweh», và «vật thánh». «Vật thánh, dành cho Yahweh» chuyển tải công thức קֹדֶשׁ לַיהוָה mà không nâng nghĩa thành «chí thánh» hoặc áp đặt cách hiểu giáo phái.
  issues:
  - severity: medium
    issue: «của thánh dành cho Yahweh» không tự nhiên và mơ hồ.
    rationale: Cụm này có thể được hiểu là tài sản thuộc loại thánh, thay vì vị ngữ קֹדֶשׁ (“một vật thánh/điều thánh”). Cần dùng «vật thánh» để biểu đạt rõ danh từ tiếng Hê-bơ-rơ.
  - severity: low
    issue: «thu từ đất đai» diễn giải thêm trong mệnh đề chính.
    rationale: מַעְשַׂר הָאָרֶץ có hình thức trực tiếp là «phần mười của đất». Các cụm theo sau đã nêu rõ nguồn sản vật; vì vậy không cần thêm động từ «thu từ».
  revised_text: Mọi phần mười của đất đai[a]—từ hạt giống của đất và từ trái của cây—đều thuộc về Yahweh; đó là vật thánh, dành cho Yahweh.
