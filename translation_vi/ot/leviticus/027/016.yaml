  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng các yếu tố chính: việc biệt riêng một phần đất sở hữu, việc định giá theo lượng giống gieo, và mức năm mươi siếc-lơ bạc cho lượng giống lúa mạch một hô-me. Tuy nhiên, “ngươi phải định giá” chuyển mệnh đề mô tả kết quả/tiêu chuẩn định giá ("giá ngươi định sẽ là/theo") thành mệnh lệnh. Cụm “một hô-me hạt giống lúa mạch” cũng chưa diễn đạt thật rõ đây là lượng hạt giống tương ứng một hô-me.'
