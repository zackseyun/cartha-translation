revisions:
- from: 'Nếu một người biệt ra thánh cho Yahweh một phần ruộng thuộc sản nghiệp của mình[a], thì ngươi phải định giá ruộng ấy theo lượng hạt giống cần để gieo: cứ một hô-me hạt giống lúa mạch là năm mươi siếc-lơ bạc.'
  to: 'Nếu một người biệt riêng làm thánh cho Yahweh một phần ruộng thuộc sản nghiệp của mình[a], thì giá ngươi định sẽ theo lượng hạt giống cần để gieo: lượng hạt giống lúa mạch bằng một hô-me là năm mươi siếc-lơ bạc.'
  rationale: Sửa mệnh đề về định giá để phản ánh chức năng mô tả của nguyên văn thay vì thêm sắc thái mệnh lệnh; thay cách diễn đạt hành động thánh hiến cho tự nhiên hơn; và làm rõ rằng một hô-me là đơn vị của lượng hạt giống lúa mạch. Chú thích vẫn neo đúng tại cụm מִשְּׂדֵה אֲחֻזָּתוֹ và bảo lưu ý nghĩa “một phần/từ ruộng” cùng sắc thái đất sản nghiệp.
  reviewer_model: gpt-5.6-terra
