  terminology: Giữ “Yahweh”, “sản nghiệp”, “hô-me”, và “siếc-lơ bạc” là phù hợp. “Biệt riêng làm thánh” phản ánh tốt יַקְדִּישׁ trong ngữ cảnh Lê-vi Ký 27 mà không thu hẹp thành một hình thức dâng hiến cụ thể.
