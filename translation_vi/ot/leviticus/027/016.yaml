source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: vi
  text: 'Nếu một người biệt riêng làm thánh cho Yahweh một phần ruộng thuộc sản nghiệp của mình[a], thì giá ngươi định sẽ theo lượng hạt giống cần để gieo: lượng hạt giống lúa mạch bằng một hô-me là năm mươi siếc-lơ bạc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một phần ruộng trong cơ nghiệp của mình.” Cụm từ Hê-bơ-rơ chỉ đất được nắm giữ như tài sản thừa kế; giới từ đứng trước “ruộng” cho thấy chỉ một phần ruộng được biệt riêng làm thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: một phần ruộng thuộc sản nghiệp của mình
  rationale: Tiền tố מִן hàm ý lấy một phần từ thửa ruộng, còn אֲחֻזָּה chỉ phần đất được nắm giữ như sản nghiệp, thường mang tính thừa kế. Cách dịch này giữ được cả ý bộ phận lẫn sắc thái pháp lý của đất sản nghiệp.
- source_word: יַקְדִּישׁ
  choice: biệt ra thánh
  rationale: Trong Lê-vi Ký 27, động từ này nói đến việc dành riêng tài sản làm vật thánh cho Yahweh; “biệt ra thánh” giữ rõ sắc thái thờ phượng hơn “dâng” đơn thuần.
- source_word: אִישׁ
  choice: một người
  rationale: Danh từ giống đực số ít được dùng với hiệu lực đại diện trong điều luật. Tiếng Việt “một người” diễn đạt tự nhiên mà không làm thay đổi phạm vi áp dụng của câu.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Dịch trực tiếp danh riêng giao ước יהוה là “Yahweh”, phù hợp với chứng cứ nguyên ngữ.
- source_word: עֶרְכְּךָ
  choice: ngươi phải định giá
  rationale: Hình thức sở hữu ngôi hai số ít chỉ sự định giá do người được phán bảo thực hiện. Chuyển thành mệnh đề “ngươi phải định giá” tự nhiên trong tiếng Việt và vẫn giữ ngôi số ít.
- source_word: לְפִי זַרְעוֹ
  choice: theo lượng hạt giống cần để gieo
  rationale: Cụm này xác định giá trị theo lượng giống cần cho thửa ruộng, không phải theo sản lượng. Thêm “cần để gieo” làm rõ phép đo nông nghiệp vốn hàm chứa trong tiếng Hê-bơ-rơ.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: một hô-me hạt giống lúa mạch
  rationale: Giữ đơn vị đo cổ “hô-me” và trình bày đây là lượng hạt giống lúa mạch làm chuẩn định giá.
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: năm mươi siếc-lơ bạc
  rationale: Giữ đơn vị trọng lượng-tiền tệ cổ và chất liệu bạc; cấu trúc “cứ… là…” diễn đạt rõ tỷ lệ định giá.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Danh. “Yahweh” bảo tồn danh riêng giao ước thay vì thay bằng một tước hiệu.
- issue: Phạm vi của אִישׁ trong điều luật
  choice: một người
  alternative: một người nam
  rationale: Dù hình thức Hê-bơ-rơ là giống đực số ít, trong văn luật từ này có chức năng đại diện. “Một người” giữ tính cá thể và phạm vi pháp lý mà không nhấn mạnh giới tính quá mức cần thiết.
translation_notes:
  register: Văn phong luật pháp-trang trọng nhưng dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “ngươi” để giữ ngôi thứ hai số ít của nguyên văn; bảo lưu và phiên âm các đơn vị cổ “hô-me” và “siếc-lơ”. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
