  text: בִּ/שְׁנַ֤ת הַ/יּוֹבֵל֙ יָשׁ֣וּב הַ/שָּׂדֶ֔ה לַ/אֲשֶׁ֥ר קָנָ֖/הוּ מֵ/אִתּ֑/וֹ לַ/אֲשֶׁר ל֖/וֹ אֲחֻזַּ֥ת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: vi
  text: Vào năm Hân Hỉ, thửa ruộng phải trở về với người đã mua nó từ người ấy, là người có phần đất làm sở hữu của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “với người có phần đất ấy làm sản nghiệp.” Cụm Hê-bơ-rơ אֲחֻזַּת הָאָרֶץ chỉ một địa sản hay phần đất thuộc quyền nắm giữ; trong bối cảnh này, đó là phần đất ban đầu được phân cho gia tộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: Đến năm Hân Hỉ
  rationale: Cụm từ chỉ thời điểm trong luật về năm יּוֹבֵל. “Năm Hân Hỉ” là cách gọi trang trọng, dễ hiểu và phù hợp với thiết chế đặc thù trong Lê-vi Ký; “đến” diễn đạt tự nhiên thời điểm thửa ruộng phải hoàn trả.
- source_word: יָשׁוּב
  choice: phải trở về
  rationale: Thể chưa hoàn thành ở đây nêu hệ quả bắt buộc của điều luật. “Phải trở về” vừa giữ nghĩa hoàn trả vừa thể hiện hiệu lực pháp lý.
- source_word: הַשָּׂדֶה
  choice: thửa ruộng
  rationale: שָׂדֶה có nghĩa thông thường là ruộng hoặc đồng ruộng; “thửa ruộng” phù hợp ngữ cảnh một phần đất cụ thể được mua bán.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: với người đã bán nó
  rationale: Nguyên văn nói người mà thửa ruộng đã được mua từ người ấy. Cách diễn đạt bằng quan hệ đối ứng “người đã bán nó” tránh đại từ chủ thể mơ hồ và tự nhiên hơn trong tiếng Việt mà không thay đổi quan hệ pháp lý.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: tức là người có quyền sở hữu phần đất ấy
  rationale: אֲחֻזָּה chỉ phần đất nắm giữ hoặc sản nghiệp. Bản chính giữ nét nghĩa pháp lý về quyền sở hữu, còn sắc thái sản nghiệp gia tộc được nêu trong chú thích thay vì áp đặt vào câu chính.
theological_decisions:
- issue: Tính chất của אֲחֻזַּת הָאָרֶץ trong luật Năm Hân Hỉ
  choice: người có quyền sở hữu phần đất ấy
  alternative: người có phần đất ấy làm sản nghiệp cha truyền con nối
  rationale: Bối cảnh rộng hơn liên quan đến phần đất thuộc gia tộc, nhưng bản thân אֲחֻזָּה nhấn mạnh phần đất nắm giữ hoặc sản nghiệp. Bản chính không làm rõ quá mức tính cha truyền con nối; chú thích bảo tồn sắc thái đó.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Thửa ruộng” và “phần đất” giúp phân biệt vật được hoàn trả với quyền nắm giữ đất; câu được làm tự nhiên trong tiếng Việt mà vẫn giữ hai vế đồng quy chỉ cùng một người.
