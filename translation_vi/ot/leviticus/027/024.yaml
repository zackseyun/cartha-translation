revisions:
- from: Đến năm Hân Hỉ, thửa ruộng phải trở về với người đã bán nó, tức là người có quyền sở hữu phần đất ấy.[a]
  to: Vào năm Hân Hỉ, thửa ruộng phải trở về với người đã mua nó từ người ấy, là người có phần đất làm sở hữu của mình.[a]
  rationale: 'Sửa mệnh đề mua bán để giữ đúng hướng của động từ “đã mua nó từ người ấy”: người nhận lại ruộng là người mua và là người có địa sản, chứ không phải người bán. Điều chỉnh nhẹ liên từ và thuật ngữ để câu luật lệ hiện đại, rõ quan hệ quy chiếu, đồng thời không áp đặt tính cha truyền con nối vào bản văn chính.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:32:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp đảo chiều quan hệ trong mệnh đề לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ: tiếng Hê-bơ-rơ nói thửa ruộng trở về với người đã mua nó từ người đang giữ/dâng nó, tức chủ sở hữu phần đất gốc; không phải với người đã bán nó. Cụm cuối xác định cùng người ấy là người có phần đất đai làm sở hữu/địa sản.'
  naturalness: “Đến năm Hân Hỉ” không sai hẳn, nhưng “Vào năm Hân Hỉ” sát chức năng thời điểm của בְּ hơn và tự nhiên trong văn phong luật lệ. “Quyền sở hữu phần đất ấy” hơi trừu tượng và “phần đất ấy” có thể quy chiếu nhầm về thửa ruộng; “phần đất làm sở hữu của người ấy” diễn đạt cấu trúc Hê-bơ-rơ rõ hơn.
  terminology: Giữ “năm Hân Hỉ” như thuật ngữ quen dùng. Dùng “thửa ruộng” cho שָׂדֶה và “phần đất làm sở hữu” cho אֲחֻזַּת הָאָרֶץ, tránh khẳng định trực tiếp tính cha truyền con nối trong câu chính. Chú thích cần không gọi đó là một bản dịch thay thế của toàn mệnh đề bằng “tức là”, vì cụm Hê-bơ-rơ không có từ giải thích này.
  issues:
  - severity: high
    issue: “với người đã bán nó” đảo ngược quan hệ mua bán trong לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ.
    rationale: 'Chủ ngữ ngầm của קָנָהוּ là người được nói đến ở cụm cuối: người có địa sản. Người này đã mua thửa ruộng từ người hiện dâng/giữ nó; đến năm Hân Hỉ, ruộng trở về với người mua/chủ địa sản ấy, không phải người bán.'
  - severity: medium
    issue: “tức là” thêm một quan hệ giải thích không được nêu trực tiếp và che khuất cấu trúc song song chỉ đích đến.
    rationale: Hai cụm bắt đầu bằng לַאֲשֶׁר cùng quy chiếu một người; tiếng Việt có thể nối bằng “là người” mà không thêm sắc thái diễn giải.
  - severity: low
    issue: Chú thích mô tả “sản nghiệp cha truyền con nối” như lựa chọn dịch trực tiếp.
    rationale: Tính gia tộc/thừa kế phù hợp bối cảnh luật Năm Hân Hỉ, nhưng không cần được đưa vào bản văn chính; nên trình bày đây là sắc thái theo ngữ cảnh.
