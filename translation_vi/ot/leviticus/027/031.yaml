  source_fidelity: Bản nháp phản ánh đúng cấu trúc điều kiện, hành động chuộc lại, ý bộ phận của מִן, và khoản cộng thêm một phần năm. Tuy nhiên, cụm “phần nào trong số một phần mười của mình” không diễn đạt rõ rằng đối tượng là một phần của khoản phần mười; cách dùng “thật sự chuộc lại” chuyển tải sắc thái nhấn mạnh của nguyên thể tuyệt đối + động từ hữu hạn tự nhiên hơn “nhất định chuộc lại”.
