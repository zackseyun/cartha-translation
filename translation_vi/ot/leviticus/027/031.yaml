  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: vi
  text: Nhưng nếu một người thật sự chuộc lại một phần nào của phần mười của mình[a], thì người ấy phải thêm một phần năm vào đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng một cấu trúc nhấn mạnh, sát nghĩa là “nếu quả thật chuộc lại”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Nhưng nếu
  rationale: Liên từ kết hợp với tiểu từ điều kiện mở ra một trường hợp khác trong chuỗi luật lệ; “Nhưng nếu” diễn đạt tự nhiên sắc thái chuyển ý trong ngữ cảnh.
- source_word: גָּאֹל יִגְאַל
  choice: nhất định chuộc lại
  rationale: Động từ nguyên thể tuyệt đối đi cùng động từ chưa hoàn thành cùng gốc tạo ý nhấn mạnh. “Nhất định chuộc lại” giữ được sắc thái nhấn mạnh mà không diễn giải thành ý muốn hay ý định.
- source_word: אִישׁ
  choice: một người
  rationale: Danh từ Hê-bơ-rơ ở giống đực số ít nhưng trong văn luật pháp chỉ một cá nhân thuộc trường hợp được nêu. “Một người” là cách diễn đạt tự nhiên trong tiếng Việt và không thêm đặc điểm ngoài điều văn.
- source_word: מִ/מַּֽעַשְׂר֑/וֹ
  choice: phần nào trong số một phần mười của mình
  rationale: 'Giới từ מִן mang nghĩa bộ phận: người ấy chuộc một phần thuộc khoản một phần mười của mình. Cách dịch này giữ rõ quan hệ bộ phận và quyền sở hữu.'
- source_word: חֲמִשִׁית֖/וֹ
  choice: một phần năm
  rationale: Danh từ chỉ một phần năm; đây là cách nói chính xác, tự nhiên và phù hợp văn phong luật pháp.
- source_word: יֹסֵ֥ף עָלָֽי/ו
  choice: phải thêm vào đó
  rationale: Thể Hiphil của יסף có nghĩa là “thêm”, còn עַל chỉ việc cộng thêm vào số gốc. “Phải” truyền đạt lực quy định của mệnh đề luật pháp; đối tượng được thêm là “một phần năm” đã nêu ngay trước.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “một phần mười” thay vì thuật ngữ chuyên biệt để diễn đạt trực tiếp מַעֲשֵׂר; giữ phép nhấn mạnh của nguyên văn bằng “nhất định” và giải thích cấu trúc Hê-bơ-rơ trong chú thích.
