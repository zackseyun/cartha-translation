language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: vi
  text: Còn nếu người ấy từ năm tuổi đến hai mươi tuổi, mức định giá của ngươi sẽ là hai mươi siếc-lơ[a] cho nam và mười siếc-lơ cho nữ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Siếc-lơ là đơn vị cân lượng cổ; trong chương này, các mức được tính theo siếc-lơ của nơi thánh.
    reason: Giúp độc giả hiện đại hiểu đơn vị lịch sử mà không áp đặt một giá trị tiền tệ hiện đại dễ thay đổi.
lexical_decisions:
- source_word: וְאִם
  choice: Còn nếu
  rationale: Giữ cả ý nối tiếp với các trường hợp trước và điều kiện mới; cách diễn đạt tự nhiên trong văn bản quy định tiếng Việt.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: từ năm tuổi đến hai mươi tuổi
  rationale: Diễn đạt trực tiếp thành ngữ Hê-bơ-rơ chỉ khoảng tuổi, đồng thời không tự ý xác định lại tính bao hàm của mốc cuối.
- source_word: וְהָיָה
  choice: sẽ là
  rationale: Phù hợp với lực quy định của câu trong bảng định giá mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: עֶרְכְּךָ
  choice: mức định giá của ngươi
  rationale: Giữ thuật ngữ pháp lý-nghi lễ về giá trị được ấn định trong bối cảnh lời khấn, đồng thời bảo lưu đại từ ngôi thứ hai số ít.
- source_word: הַזָּכָר
  choice: nam
  rationale: Thể hiện hạng phân loại theo giới tính trong biểu định giá; dùng danh từ loại gọn và tự nhiên hơn lối dịch cứng 'người giống đực'.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: hai mươi siếc-lơ
  rationale: Giữ nguyên đơn vị cân lượng lịch sử thay vì quy đổi sang tiền tệ hiện đại.
- source_word: וְלַנְּקֵבָה
  choice: cho nữ
  rationale: Giữ sự song song với 'cho nam' và phản ánh giới từ ל đánh dấu hạng được áp dụng mức định giá.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: mười siếc-lơ
  rationale: Chuyển trực tiếp số lượng và đơn vị, bảo toàn sự tương phản với mức hai mươi siếc-lơ.
theological_decisions:
- issue: Cách diễn đạt các hạng định giá theo giới tính trong luật nghi lễ
  choice: cho nam ... cho nữ
  alternative: cho người nam ... cho người nữ
  rationale: Nguyên văn dùng hai danh từ số ít có mạo từ làm hạng phân loại trong biểu định giá, không nói về các nhóm xã hội nói chung. Cách dịch này giữ đúng sự phân loại pháp lý mà không suy rộng thành một nhận định thần học hay xã hội.
translation_notes:
  register: Văn phong quy định trang trọng nhưng hiện đại. Dùng “ngươi” để giữ lời phán trực tiếp ở ngôi thứ hai số ít; dùng “người ấy” để làm rõ đối tượng có độ tuổi được nêu, vốn chỉ được hàm ý trong cú pháp Hê-bơ-rơ.
