revisions:
- from: Nếu là một con vật thuộc loại người ta có thể dâng làm lễ vật lên Yahweh[a], thì bất cứ con nào người ấy dâng lên Yahweh đều phải là vật thánh.
  to: Nếu là một con vật mà người ta dâng từ nó một lễ vật lên Yahweh[a], thì mọi thứ người ta dâng từ nó lên Yahweh sẽ là vật thánh.
  rationale: Bản sửa giữ nguyên sự mơ hồ ngữ pháp của tiếng Hê-bơ-rơ trong bản chính bằng cách dịch nhất quán ‘từ nó’ ở cả hai vế, không quyết định trước rằng đây chỉ là một loại động vật. Chú thích trình bày cách hiểu phân loại như một khả năng thay thế. Thuật ngữ nghi lễ và danh Yahweh được giữ nguyên; ‘sẽ là vật thánh’ phản ánh tình trạng được tuyên bố trong bản nguồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:32:16Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp chọn hợp lý một cách hiểu khả dĩ của cụm מִמֶּנָּה, nhưng bản văn chính đã thu hẹp câu thành ‘thuộc loại ... có thể dâng’ và sau đó đổi ‘mọi điều/vật được dâng từ nó’ thành ‘bất cứ con nào’. Cần để bản chính phản ánh trực tiếp hơn cấu trúc ‘dâng từ nó một lễ vật’ và ‘mọi thứ ... từ nó’, còn chú thích bảo lưu cách hiểu theo loại động vật thích hợp để dâng.
  naturalness: ‘Bất cứ con nào người ấy dâng ... đều phải là vật thánh’ không tự nhiên về quan hệ số lượng và làm câu dễ hiểu là mọi con vật cùng loại. ‘Mọi thứ người ta dâng từ nó ... sẽ là vật thánh’ vừa sáng rõ vừa giữ được tính khái quát của động từ số ít trong tiếng Hê-bơ-rơ.
  terminology: ‘Lễ vật’, ‘Yahweh’, và ‘vật thánh’ phù hợp với ngữ cảnh nghi lễ và với quyết định dịch danh יהוה. ‘Sẽ là vật thánh’ phản ánh trực tiếp hơn יִהְיֶה קֹדֶשׁ so với sắc thái mệnh lệnh ‘đều phải là’.
  issues:
  - severity: medium
    issue: Bản chính diễn giải quá mức cụm ‘từ nó’ thành ‘thuộc loại ... có thể dâng’ và ‘bất cứ con nào’.
    rationale: מִמֶּנָּה / מִמֶּנּוּ xuất hiện rõ trong cả hai vế. Dù có thể hiểu theo nghĩa phân loại, bản chính nên giữ cách nói ‘từ nó’; chú thích mới là nơi nêu khả năng hiểu là loài vật thích hợp để dâng.
  - severity: low
    issue: ‘Đều phải là vật thánh’ thêm sắc thái bắt buộc và không khớp tự nhiên với chủ ngữ ‘bất cứ con nào’.
    rationale: 'יִהְיֶה קֹדֶשׁ là mệnh đề chỉ tình trạng: ‘sẽ là vật thánh’.'
