id: LEV.27.9
reference: Leviticus 27:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: vi
  text: Nếu là một con vật mà người ta dâng từ nó một lễ vật lên Yahweh[a], thì mọi thứ người ta dâng từ nó lên Yahweh sẽ là vật thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu: “Nếu là một con vật thuộc loại có thể dùng để dâng lễ vật lên Yahweh, thì mọi thứ người ta dâng từ nó lên Yahweh sẽ là vật thánh.” Cách diễn đạt Hê-bơ-rơ có thể chỉ một con vật thích hợp để dâng làm lễ vật, hoặc một con vật mà từ đó một lễ vật thực sự được dâng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nếu là
  rationale: Mở đầu điều kiện tiếp nối trong luật lệ; tiếng Việt không cần dịch riêng liên từ ו để câu tự nhiên.
- source_word: בְּהֵמָה
  choice: một con vật
  rationale: Từ chung chỉ động vật; trong ngữ cảnh này nói đến con vật có thể dùng làm lễ vật.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: thuộc loại người ta có thể dâng làm lễ vật lên Yahweh
  rationale: 'Diễn đạt cách hiểu phân loại: đó là loài vật thích hợp để dâng tế. Ghi chú giữ lại cách hiểu khác rằng lễ vật thực sự được lấy từ con vật ấy.'
- source_word: קָרְבָּן
  choice: lễ vật
  rationale: Tương đương tự nhiên, trang trọng cho thuật ngữ chỉ vật được đem dâng trong nghi lễ.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng Yahweh; 'dâng lên' là cách kết hợp tự nhiên trong tiếng Việt.
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: bất cứ con nào người ấy dâng
  rationale: Trong cách hiểu phân loại, מִמֶּנּוּ có nghĩa là một cá thể thuộc loại ấy; cách dịch này tránh khiến người đọc tưởng chỉ dâng một phần lấy ra từ cùng một con vật.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: đều phải là vật thánh
  rationale: Diễn tả tình trạng được biệt riêng cho Đức Chúa Trời theo sắc thái pháp quy của câu; 'vật thánh' phù hợp với đối tượng là con vật đã được dâng.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Phiên âm danh giao ước được nêu trực tiếp trong bản Hê-bơ-rơ, không thay bằng một tước hiệu.
- issue: Phạm vi của sự thánh
  choice: Con vật được dâng trở thành vật thánh
  alternative: Chỉ phần lấy từ con vật ấy là thánh
  rationale: Cú pháp có thể được hiểu theo loại động vật dùng làm lễ vật; bản chính theo cách hiểu này nhưng chú thích công khai cách phân tích khác của מִמֶּנָּה và מִמֶּנּוּ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “người ta/người ấy” để thể hiện chủ thể không xác định mà không mặc định giới tính; giữ nguyên danh Yahweh. Dấu chú thích [a] xuất hiện ngay sau mệnh đề có cách hiểu khác.
