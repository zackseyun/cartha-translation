revisions:
- from: Nếu một người biệt riêng nhà mình làm vật thánh cho Yahweh, thì thầy tế lễ phải định giá căn nhà ấy, tùy theo tốt hay xấu[a]. Thầy tế lễ định giá[b] thế nào thì giá ấy sẽ được giữ nguyên như thế.
  to: Nếu một người dâng hiến nhà mình làm vật thánh cho Yahweh, thầy tế lễ phải định giá căn nhà ấy, dù tốt hay xấu[a]. Thầy tế lễ định giá thế nào thì mức định giá ấy sẽ có hiệu lực như thế[b].
  rationale: Sửa nhẹ để tiếng Việt hiện đại tự nhiên hơn và để câu kết phản ánh chính xác hơn hiệu lực pháp lý của mức định giá do thầy tế lễ ấn định. Các yếu tố từ vựng chính, sự lặp lại của động từ ערך, và danh Yahweh đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
