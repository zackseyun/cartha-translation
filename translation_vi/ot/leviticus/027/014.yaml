  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: vi
  text: Nếu một người dâng hiến nhà mình làm vật thánh cho Yahweh, thầy tế lễ phải định giá căn nhà ấy, dù tốt hay xấu[a]. Thầy tế lễ định giá thế nào thì mức định giá ấy sẽ có hiệu lực như thế[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “giữa tốt và xấu”, nghĩa là xét tình trạng hoặc chất lượng của căn nhà khi định giá.'
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “thẩm định giá”; cùng một động từ Hê-bơ-rơ được dùng hai lần trong câu này để chỉ việc thầy tế lễ xác lập giá trị.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Nếu một người
  rationale: Đây là công thức mở đầu một trường hợp luật định. “Một người” giữ số ít giống đực của אִישׁ, còn כִּי được diễn đạt tự nhiên bằng điều kiện “nếu”.
- source_word: יַקְדִּשׁ
  choice: biệt riêng ... làm vật thánh
  rationale: Dạng Hiphil của קדשׁ chỉ việc dành riêng một tài sản cho địa vị thánh. Cách diễn đạt này rõ nghĩa hơn “thánh hóa” khi đối tượng là một căn nhà.
- source_word: בֵּיתוֹ
  choice: nhà mình
  rationale: Trong bối cảnh định giá tài sản, בַּיִת nói đến ngôi nhà chứ không chủ yếu đến gia đình hay mái ấm.
- source_word: קֹדֶשׁ לַיהוָה
  choice: làm vật thánh cho Yahweh
  rationale: Giữ ý ngôi nhà được dành riêng thuộc phạm vi thánh cho YHWH; danh riêng giao ước được phiên âm là “Yahweh”.
- source_word: וְהֶעֱרִיכוֹ
  choice: thầy tế lễ phải định giá căn nhà ấy
  rationale: Dạng Hiphil của ערך trong Lê-vi Ký 27 chỉ sự định giá chính thức do thầy tế lễ thực hiện. “Định giá” vừa chính xác vừa thông dụng trong tiếng Việt hiện đại.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: tùy theo tốt hay xấu
  rationale: Giữ cặp đối lập Hê-bơ-rơ, đồng thời thể hiện rằng việc định giá phải xét tình trạng hoặc chất lượng của ngôi nhà.
- source_word: כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן
  choice: Thầy tế lễ định giá thế nào
  rationale: Lặp lại “định giá” để phản ánh việc động từ ערך được lặp lại trong nguyên văn.
- source_word: כֵּן יָקוּם
  choice: thì giá ấy sẽ được giữ nguyên như thế
  rationale: קום ở đây nói rằng mức định giá của thầy tế lễ có hiệu lực và không bị thay đổi. Nêu rõ “giá ấy” giúp thành ngữ pháp lý Hê-bơ-rơ tự nhiên và dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Địa vị thánh của căn nhà
  choice: biệt riêng nhà mình làm vật thánh cho Yahweh
  alternative: dâng nhà mình cho Yahweh
  rationale: Bản dịch giữ rõ yếu tố קֹדֶשׁ (“thánh”), không giản lược câu thành một hành động dâng tặng thông thường.
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc; “định giá” thể hiện rõ thủ tục chính thức. Câu cuối được diễn đạt minh nhiên hơn thành ngữ Hê-bơ-rơ để người đọc phổ thông hiểu rằng mức giá do thầy tế lễ ấn định vẫn có hiệu lực.
