source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: vi
  text: Đây là những điều răn mà Yahweh đã truyền cho Môi-se, dành cho con dân Y-sơ-ra-ên, tại núi Si-nai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cho con dân Y-sơ-ra-ên.” Giới từ Hê-bơ-rơ có thể chỉ hướng truyền đạt đến cộng đồng Y-sơ-ra-ên; theo ngữ cảnh, các điều răn được truyền cho Môi-se để chuyển đạt cho họ.'
    reason: Làm rõ phương án dịch trực tiếp của אֶל và phân biệt nó với cách giải thích quan hệ truyền đạt qua Môi-se.
lexical_decisions:
- source_word: אֵלֶּה הַמִּצְוֺת
  choice: Đây là những điều răn
  rationale: Công thức tổng kết ở cuối sách; “điều răn” giữ được tính pháp lệnh của מִצְוָה, còn “đây là” diễn đạt tự nhiên cấu trúc danh từ của tiếng Hê-bơ-rơ.
- source_word: אֲשֶׁר צִוָּה
  choice: mà ... đã truyền
  rationale: “Mà” là đại từ quan hệ tự nhiên; “đã truyền” phản ánh động từ צוה và giữ liên hệ ý nghĩa với “điều răn” mà không tạo lối diễn đạt nặng nề.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: אֶת đánh dấu Môi-se là đối tượng trực tiếp của động từ “truyền”; tiếng Việt diễn đạt tự nhiên bằng “truyền cho Môi-se”.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: dành cho con dân Y-sơ-ra-ên
  rationale: “Dành cho” diễn đạt khả năng các điều răn được giao cho Môi-se liên quan đến dân Y-sơ-ra-ên. “Con dân Y-sơ-ra-ên” là cách gọi tự nhiên, có tính tập thể, tương ứng với thành ngữ בְּנֵי יִשְׂרָאֵל mà không giới hạn đối tượng vào nam giới.
- source_word: בְּהַר סִינָי
  choice: tại núi Si-nai
  rationale: “Tại” diễn đạt địa điểm của hành động ban truyền; “núi Si-nai” là cách gọi địa danh tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo tồn đây là danh riêng và tránh thay bằng một tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên
  rationale: Trong công thức pháp lý này, cụm từ chỉ toàn thể cộng đồng Y-sơ-ra-ên, không chỉ những người nam; “con dân” vừa giữ sắc thái thuộc về dân tộc vừa chuyển tải phạm vi tập thể.
- issue: Quan hệ của אֶל với Môi-se và Y-sơ-ra-ên
  choice: dành cho con dân Y-sơ-ra-ên
  alternative: truyền cho con dân Y-sơ-ra-ên
  rationale: אֶל có thể chỉ hướng đến hoặc đối tượng tiếp nhận. Bản chính dùng “dành cho” để giữ ý các điều răn được giao qua Môi-se vì dân chúng, đồng thời chú thích khả năng dịch trực tiếp là “cho” hoặc “đến” họ.
translation_notes:
  register: 'Văn phong trang trọng, rõ ràng và hiện đại. Dùng các dạng tên quen thuộc trong tiếng Việt: Môi-se, Y-sơ-ra-ên, Si-nai; giữ Yahweh là danh riêng. Câu văn duy trì sắc thái của một công thức tổng kết pháp luật.'
