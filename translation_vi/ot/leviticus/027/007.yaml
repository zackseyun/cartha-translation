revisions:
- from: Nếu người ấy từ sáu mươi tuổi trở lên, thì mức định giá của ngươi là mười lăm siếc-lơ đối với nam và mười siếc-lơ đối với nữ.
  to: Nếu người ấy từ sáu mươi tuổi trở lên, thì nếu là nam, mức định giá của ngươi là mười lăm siếc-lơ; còn nếu là nữ, là mười siếc-lơ.
  rationale: Chỉnh cú pháp để làm rõ hai trường hợp định giá theo giới tính, đồng thời giữ nguyên ngưỡng tuổi, thuật ngữ định giá, ngôi xưng "của ngươi", và đơn vị siếc-lơ. Không cần chú thích vì không có vấn đề văn bản hay từ vựng cần bảo lưu trong câu tiếng Việt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:32:14Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ngưỡng tuổi, hai giới tính và hai mức định giá. Tuy nhiên, cách đặt "mười lăm siếc-lơ đối với nam" sau mệnh đề "mức định giá của ngươi là" có thể tạm thời khiến quan hệ điều kiện "nếu là nam" của nguyên văn kém rõ. Cần biểu đạt minh nhiên điều kiện nam/nữ và lược bỏ phần vị ngữ được hiểu ở vế nữ.
  naturalness: '"Từ sáu mươi tuổi trở lên" và "siếc-lơ" tự nhiên, phù hợp văn phong luật lệ hiện đại. Dùng dấu hai chấm và cấu trúc song song giúp câu Việt rõ, gọn và dễ đọc hơn.'
  terminology: '"Mức định giá của ngươi" bảo lưu thuật ngữ עֶרְכְּךָ và ngôi thứ hai của tiếng Hê-bơ-rơ. Cặp "nam/nữ" phản ánh chính xác זָכָר/נְקֵבָה trong ngữ cảnh phân loại giới tính. "Siếc-lơ" nhất quán cho שֶׁקֶל.'
  issues:
  - severity: low
    issue: Quan hệ điều kiện nam/nữ chưa được đánh dấu minh nhiên trong cú pháp câu Việt.
    rationale: Nguyên văn có cấu trúc "nếu ...; nếu là nam ...; và đối với nữ ...". Bản nháp vẫn hiểu được, nhưng việc nêu trực tiếp "nếu là nam" và đối chiếu với "nếu là nữ" phản ánh cấu trúc nguồn rõ hơn, tránh để "đối với nam" bị đọc như một bổ ngữ muộn của số tiền.
  revised_text: Nếu người ấy từ sáu mươi tuổi trở lên, thì nếu là nam, mức định giá của ngươi là mười lăm siếc-lơ; còn nếu là nữ, là mười siếc-lơ.
