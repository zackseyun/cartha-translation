base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: vi
  text: Nếu người ấy từ sáu mươi tuổi trở lên, thì nếu là nam, mức định giá của ngươi là mười lăm siếc-lơ; còn nếu là nữ, là mười siếc-lơ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: từ sáu mươi tuổi trở lên
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ rõ ngưỡng tuổi bắt đầu từ sáu mươi và bao gồm mọi tuổi cao hơn.
- source_word: זָכָר
  choice: nam
  rationale: Chỉ giới tính trong bối cảnh định giá, tương ứng chính xác và nhất quán với נְקֵבָה là “nữ”.
- source_word: עֶרְכְּךָ
  choice: mức định giá của ngươi
  rationale: Giữ sắc thái thuật ngữ của luật về lời khấn trong Lê-vi Ký 27 và bảo lưu hậu tố ngôi thứ hai số ít của tiếng Hê-bơ-rơ.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: mười lăm siếc-lơ
  rationale: Chuyển trực tiếp số lượng và giữ nguyên đơn vị cân lượng/tiền tệ cổ.
- source_word: לַנְּקֵבָה
  choice: đối với nữ
  rationale: Diễn đạt quan hệ áp dụng của mức định giá và tạo cặp cân xứng với “đối với nam”.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: mười siếc-lơ
  rationale: Bản dịch trực tiếp số lượng và đơn vị.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Cụm “người ấy” làm rõ chủ thể được định giá vốn được hàm ý trong tiếng Hê-bơ-rơ; “của ngươi” bảo lưu cách xưng hô trực tiếp của nguyên văn. Cấu trúc cuối câu được sắp xếp cân đối để tiếng Việt tự nhiên mà không thay đổi hai mức định giá.
