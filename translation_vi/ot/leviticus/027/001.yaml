  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống cũng được phiên âm là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức tường thuật lời Đức Chúa Trời được dịch là “phán”, cách diễn đạt tự nhiên và trang trọng trong tiếng Việt; đồng thời phân biệt hợp lý với לֵאמֹר theo sau.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu tiếng Việt “phán với”, từ này biểu thị người tiếp nhận lời phán một cách tự nhiên.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này mở đầu nội dung lời nói; “rằng” là cách chuyển ngữ gọn và tự nhiên trong tiếng Việt hiện đại, dù cấu trúc sát chữ là “mà nói”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo toàn tính chất tên riêng mà không thay bằng tước hiệu hay áp đặt cách phát âm truyền thống khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng công thức “phán với ... rằng” tự nhiên trong tiếng Việt, đồng thời giữ rõ quan hệ giữa động từ dẫn nhập và nội dung lời phán ở câu kế tiếp.
