base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: vi
  text: Nhưng nếu người ấy hiến thánh ruộng mình sau Năm Hân Hỉ[a], thì thầy tế lễ phải tính khoản tiền cho người ấy[b] theo số năm còn lại cho đến Năm Hân Hỉ, và khoản tiền ấy sẽ được khấu trừ khỏi mức định giá của ngươi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau năm Hân Hỉ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thầy tế lễ phải định giá khoản tiền cho người ấy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “và khoản tiền ấy sẽ được giảm bớt khỏi mức định giá của ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: sau Năm Hân Hỉ
  rationale: אַחַר diễn tả thời điểm tiếp sau, còn הַיֹּבֵל chỉ năm hoặc thể chế Hân Hỉ trong luật Lê-vi. Viết hoa cho thấy đây là tên của một năm được luật quy định.
- source_word: יַקְדִּישׁ
  choice: biệt riêng ... ra thánh
  rationale: Động từ קדשׁ ở đây chỉ việc dành riêng tài sản làm vật thánh; cách diễn đạt này giữ được sắc thái thờ phượng rõ hơn từ chung chung như “dâng”.
- source_word: שָׂדֵהוּ
  choice: ruộng mình
  rationale: 'Giữ quan hệ sở hữu trực tiếp: người ấy biệt riêng chính thửa ruộng của mình.'
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: thì thầy tế lễ phải tính số tiền cho người ấy
  rationale: חשב trong văn cảnh pháp lý có nghĩa là tính hoặc định lượng; הַכֶּסֶף theo nghĩa đen là bạc, nhưng tại đây chỉ khoản tiền định giá.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: theo số năm còn lại
  rationale: Thành ngữ עַל־פִּי mang nghĩa “theo, căn cứ vào”; số tiền được tính tỷ lệ theo những năm còn lại.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: cho đến Năm Hân Hỉ
  rationale: Cụm từ xác định mốc cuối của khoảng năm được dùng để tính giá.
- source_word: וְנִגְרַע
  choice: và số tiền ấy sẽ được trừ
  rationale: Thể Niphal của גרע diễn tả việc bị giảm hoặc bị khấu trừ; “được trừ” phù hợp với văn cảnh tiền bạc và luật định giá.
- source_word: מֵעֶרְכֶּךָ
  choice: khỏi mức định giá của ngươi
  rationale: ערכך chỉ mức định giá đã được quy định trước đó; “của ngươi” giữ nguyên hậu tố ngôi thứ hai số ít của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Hậu tố ngôi thứ hai số ít trong מֵעֶרְכֶּךָ
  choice: khỏi mức định giá của ngươi
  alternative: khỏi mức định giá; khỏi mức định giá của nó
  rationale: Bản Hê-bơ-rơ trực tiếp dùng ngôi thứ hai số ít. Giữ “của ngươi” bảo toàn lối diễn đạt pháp lý và mối liên hệ với mức định giá đã nêu, thay vì biến câu thành vô nhân xưng.
- issue: Thuật ngữ thánh biệt trong יַקְדִּישׁ
  choice: biệt riêng ... ra thánh
  alternative: dâng; hiến dâng
  rationale: Câu này nói về tài sản được đặt riêng trong khuôn khổ thánh và luật định. Cách dịch đã chọn giữ chiều kích thánh biệt mà không thêm ý niệm giáo phái.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. “Thầy tế lễ” giữ thuật ngữ quen thuộc của bối cảnh Lê-vi; “Năm Hân Hỉ” tránh đồng nhất trực tiếp với các cách dùng giáo hội về “toàn xá”. Đại từ “ngươi” được giữ có chủ ý để phản ánh lời luật trực tiếp ở ngôi thứ hai số ít.
