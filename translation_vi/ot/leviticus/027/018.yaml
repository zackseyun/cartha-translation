revisions:
- from: Nhưng nếu người ấy biệt riêng ruộng mình ra thánh sau Năm Hân Hỉ[a], thì thầy tế lễ phải tính số tiền cho người ấy[b] theo số năm còn lại cho đến Năm Hân Hỉ, và số tiền ấy sẽ được trừ khỏi mức định giá của ngươi[c].
  to: Nhưng nếu người ấy hiến thánh ruộng mình sau Năm Hân Hỉ[a], thì thầy tế lễ phải tính khoản tiền cho người ấy[b] theo số năm còn lại cho đến Năm Hân Hỉ, và khoản tiền ấy sẽ được khấu trừ khỏi mức định giá của ngươi[c].
  rationale: Sửa tối thiểu nhằm thay cụm từ gượng bằng “hiến thánh”, một cách dịch rõ và tự nhiên cho הקדישׁ trong bối cảnh tài sản được biệt riêng cho mục đích thánh. Dùng “khoản tiền” và “khấu trừ” làm rõ ngữ cảnh định giá mà không thay đổi quan hệ cú pháp hay ý nghĩa. Các dấu chú thích vẫn gắn đúng với những đơn vị từ vựng tương ứng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:32:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng các thành tố chính của tiếng Hê-bơ-rơ: thời điểm sau Hân Hỉ, việc hiến thánh ruộng thuộc sở hữu của người ấy, sự tính toán của thầy tế lễ dựa trên số năm còn lại, và sự giảm trừ khỏi mức định giá ngôi thứ hai số ít. Tuy nhiên, cụm “biệt riêng ruộng mình ra thánh” không phải cách kết hợp tự nhiên trong tiếng Việt hiện đại; “hiến thánh” diễn đạt trực tiếp và chính xác hơn động từ הקדישׁ trong văn cảnh luật thánh.'
  naturalness: Câu được chỉnh để có văn phong pháp lý-trang trọng nhưng tự nhiên hơn. “Khoản tiền ấy sẽ được khấu trừ” phù hợp hơn “số tiền ấy sẽ được trừ” trong ngữ cảnh định giá, đồng thời vẫn giữ cấu trúc bị động và ý giảm trừ của Niphal נגרע.
  terminology: Giữ “Năm Hân Hỉ”, “thầy tế lễ”, và “mức định giá của ngươi”. “Hiến thánh” là thuật ngữ gọn, hiện đại và có sắc thái biệt riêng cho điều thánh mà không thêm nội dung giáo phái. Đại từ “ngươi” được giữ vì hậu tố מֵעֶרְכֶּךָ là ngôi thứ hai số ít, dù câu mở đầu quy chiếu đến “người ấy”.
  issues:
  - severity: medium
    issue: “biệt riêng ruộng mình ra thánh” là cách diễn đạt gượng và không phải cụm từ chuẩn trong tiếng Việt hiện đại.
    rationale: Cụm này cố mô phỏng nghĩa “làm cho thánh” của הקדישׁ nhưng tạo cấu trúc “ra thánh” bất tự nhiên. “Hiến thánh ruộng mình” giữ nghĩa đặt riêng cho điều thánh trong Lê-vi 27 và đọc tự nhiên hơn.
  - severity: low
    issue: “số tiền ấy sẽ được trừ” chưa thật chuyên biệt cho văn cảnh tiền tệ/định giá.
    rationale: “Khoản tiền ấy sẽ được khấu trừ” tự nhiên hơn trong văn phong pháp lý-tài chính, vẫn dịch đúng ý bị giảm trừ của וְנִגְרַע.
  - severity: low
    issue: Chú thích c dùng “giá trị ấy”, trong khi chủ thể được hiểu từ ngữ cảnh gần nhất là khoản tiền hoặc khoản định giá.
    rationale: Đổi thành “khoản tiền ấy” tránh làm mơ hồ đối tượng được giảm trừ, nhưng vẫn trình bày phương án dịch hợp lệ.
