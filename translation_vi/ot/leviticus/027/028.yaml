source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: vi
  text: Tuy nhiên, mọi thứ biệt hiến[a] mà một người biệt hiến cho Đức Giê-hô-va từ mọi thứ thuộc về mình—dù là người, súc vật, hay ruộng đất thuộc phần sản nghiệp của mình—thì không được bán hoặc chuộc lại. Mọi thứ biệt hiến đều là chí thánh cho Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thứ biệt hiến” dịch thuật ngữ Hê-bơ-rơ ḥērem, chỉ người, súc vật, hoặc tài sản được dành riêng cho Đức Giê-hô-va cách không thể thu hồi; trong một số ngữ cảnh, từ này cũng có thể chỉ điều bị đặt dưới lệnh cấm hoặc bị biệt hiến để hủy diệt.
    reason: Giữ lại phạm vi nghĩa của thuật ngữ kỹ thuật חֵרֶם, gồm sắc thái ‘lệnh cấm/hủy diệt’ trong các ngữ cảnh khác, mà không áp đặt sắc thái ấy vào chính văn của câu này.
lexical_decisions:
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Diễn tả sự chuyển ý mang tính tương phản và hạn định so với các quy định trước đó về những vật đã khấn nguyện nhưng có thể chuộc lại.
- source_word: חֵרֶם / יַחֲרִם
  choice: vật biệt hiến / biệt hiến
  rationale: Giữ mối liên hệ giữa danh từ và động từ, đồng thời diễn đạt việc dành riêng cách không thể thu hồi cho Đức Giê-hô-va mà không mặc nhiên đưa ý hủy diệt vào chính văn.
- source_word: אִישׁ
  choice: một người
  rationale: Trong văn luật, danh từ giống đực số ít này có chức năng đại diện; “một người” là cách diễn đạt tự nhiên trong tiếng Việt và không làm mất tính cá thể của điều luật.
- source_word: לַיהוָה
  choice: cho Đức Giê-hô-va / thuộc về Đức Giê-hô-va
  rationale: Dùng danh riêng truyền thống, dễ nhận biết trong tiếng Việt cho YHWH; ở mệnh đề cuối, “thuộc về” diễn đạt tự nhiên quan hệ tận hiến của câu Hê-bơ-rơ ngắn gọn.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: từ bất cứ thứ gì thuộc về mình
  rationale: Bảo toàn ý rằng vật biệt hiến được lấy từ phạm vi tài sản thuộc người ấy.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: dù là người, súc vật
  rationale: אָדָם đối lập với loài vật nên được dịch là “người”; בְּהֵמָה trong bối cảnh tài sản chỉ thú nuôi hoặc gia súc, vì vậy “súc vật” phù hợp hơn từ khái quát “động vật”.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: hay một phần ruộng đất thừa kế của mình
  rationale: Giới từ מִן trước “ruộng” có sắc thái phân phần; אֲחֻזָּה trong Lê-vi Ký chỉ sản nghiệp đất đai cha truyền con nối.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: không được bán hoặc chuộc lại
  rationale: Diễn đạt rõ hai lệnh cấm pháp lý; “chuộc lại” giữ thuật ngữ xuyên suốt chương 27.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Đây là cấu trúc Hê-bơ-rơ chỉ mức độ cao nhất của sự thánh khiết; “chí thánh” trang trọng, gọn và quen thuộc trong văn Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của חֵרֶם trong điều luật này
  choice: Dịch là “vật biệt hiến”, nhấn mạnh sự tận hiến không thể thu hồi.
  alternative: Vật bị đặt dưới lệnh cấm hoặc bị biệt hiến để hủy diệt.
  rationale: Nhóm từ חֵרֶם có thể bao hàm việc hủy diệt trong một số ngữ cảnh, nhưng câu này trực tiếp nhấn mạnh rằng vật ấy không thể bán hay chuộc và là chí thánh. Chú thích giữ lại sắc thái “lệnh cấm/hủy diệt” mà không ép nó vào chính văn.
- issue: Quan hệ của vật biệt hiến với YHWH trong הוּא לַיהוָה
  choice: “thuộc về Đức Giê-hô-va”
  alternative: “dành cho Đức Giê-hô-va” hoặc “là chí thánh cho Đức Giê-hô-va”
  rationale: “Thuộc về” làm rõ hệ quả của sự biệt hiến và phù hợp với hai lệnh cấm chuyển nhượng, nhưng không xác định thêm cách vật ấy phải được xử lý.
- issue: Phạm vi của đối tượng “người” trong מֵאָדָם
  choice: Giữ từ loại khái quát “người”.
  alternative: “con người” hoặc “một người nam”
  rationale: Ở đây אָדָם là loại đối lập với súc vật, không chỉ riêng nam giới; bản dịch không bổ sung một giới tính mà nguồn không biểu thị.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Biệt hiến” và “chí thánh” được giữ như thuật ngữ tôn giáo cần thiết; cấu trúc câu được làm rõ bằng dấu gạch ngang. Tất cả dấu chú thích trong chính văn và danh mục chú thích tương ứng đầy đủ.
