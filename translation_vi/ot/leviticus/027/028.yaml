- from: Tuy nhiên, mọi vật biệt hiến[a] mà một người biệt hiến cho Đức Giê-hô-va từ bất cứ thứ gì thuộc về mình—dù là người, súc vật hay một phần ruộng đất thừa kế của mình—đều không được bán hoặc chuộc lại. Mọi vật biệt hiến đều là vật chí thánh thuộc về Đức Giê-hô-va.
  to: Tuy nhiên, mọi thứ biệt hiến[a] mà một người biệt hiến cho Đức Giê-hô-va từ mọi thứ thuộc về mình—dù là người, súc vật, hay ruộng đất thuộc phần sản nghiệp của mình—thì không được bán hoặc chuộc lại. Mọi thứ biệt hiến đều là chí thánh cho Đức Giê-hô-va.
  rationale: Bản sửa giữ nguyên cách hiểu của bản thảo về חֵרֶם như điều được biệt hiến không thể chuộc lại, đồng thời khôi phục phạm vi của ‘mọi thứ thuộc về mình,’ không thêm ý ‘một phần,’ và dùng từ bao quát được cả người lẫn tài sản. Chú thích được điều chỉnh để nhất quán với chính văn đã sửa.
