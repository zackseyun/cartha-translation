source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: vi
  text: Nhưng khi đến Năm Hân Hỉ, cánh đồng ấy sẽ là vật thánh thuộc về Đức Giê-hô-va, như một cánh đồng đã được biệt hiến[a]; nó sẽ là sản nghiệp của thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cánh đồng bị đặt dưới lệnh cấm.” Từ Hê-bơ-rơ chỉ thứ đã được hiến dâng không thể thu hồi cho Đức Giê-hô-va và bị loại khỏi việc sử dụng thông thường; trong một số ngữ cảnh, từ này còn bao hàm việc hủy diệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Nhưng ... sẽ là
  rationale: Liên từ tiếp nối trường hợp pháp lý, đồng thời tạo thế tương phản với khả năng chuộc lại ở câu trước.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: khi ... được chuyển giao vào Năm Hân Hỉ
  rationale: Nghĩa đen là “khi nó đi ra”; trong luật Năm Hân Hỉ, cụm này chỉ việc thửa đất ra khỏi quyền của người đã dâng và được chuyển sang tình trạng pháp lý mới. “Được chuyển giao” diễn đạt tự nhiên mà không hàm ý nó trở về với chủ cũ.
- source_word: קֹדֶשׁ לַיהוָה
  choice: vật thánh thuộc về Đức Giê-hô-va
  rationale: Diễn đạt tình trạng được dành riêng cho YHWH; “thuộc về” phù hợp với sắc thái sở hữu và biệt riêng trong điều luật.
- source_word: יהוה
  choice: Đức Giê-hô-va
  rationale: Cách gọi danh riêng YHWH quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: như một cánh đồng đã được biệt hiến
  rationale: חֵרֶם ở đây nói đến vật được hiến dâng không thể thu hồi và bị loại khỏi việc sử dụng thông thường. “Biệt hiến” giữ trọng tâm pháp lý mà không mặc nhiên thêm ý bị tiêu hủy trong ngữ cảnh đất đai này.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: nó sẽ là sản nghiệp của thầy tế lễ
  rationale: אֲחֻזָּה là phần đất nắm giữ theo quyền sở hữu lâu dài; “sản nghiệp” phù hợp với ngữ cảnh luật đất đai hơn từ chung chung “tài sản”.
theological_decisions:
- issue: Sắc thái của חֵרֶם trong luật về cánh đồng
  choice: cánh đồng đã được biệt hiến
  alternative: cánh đồng bị đặt dưới lệnh cấm; cánh đồng bị biệt hiến để hủy diệt
  rationale: Từ này chỉ sự dâng hiến không thể thu hồi cho Đức Giê-hô-va và việc loại khỏi công dụng thông thường. Vì đối tượng tại đây là cánh đồng được giao cho thầy tế lễ chứ không bị hủy, bản chính tránh đưa ý “hủy diệt” vào câu, còn chú thích bảo tồn sắc thái nghiêm ngặt và các khả năng dịch.
- issue: Chủ thể sở hữu trong אֲחֻזָּתוֹ
  choice: sản nghiệp của thầy tế lễ
  alternative: sản nghiệp của người ấy
  rationale: Đại từ số ít giống đực có thể dịch sát là “của người ấy”, nhưng tiền tố לַכֹּהֵן ngay trước đó xác định người nhận là thầy tế lễ; cách diễn đạt tiếng Việt nêu rõ đối tượng mà không thay đổi ý pháp lý.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “Năm Hân Hỉ” cho יוֹבֵל, “thầy tế lễ” cho כֹּהֵן và “sản nghiệp” để giữ sắc thái quyền nắm giữ đất lâu dài. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
