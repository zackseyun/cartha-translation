revisions:
- from: Nhưng khi cánh đồng ấy được chuyển giao vào Năm Hân Hỉ, nó sẽ là vật thánh thuộc về Đức Giê-hô-va, như một cánh đồng đã được biệt hiến[a]; nó sẽ là sản nghiệp của thầy tế lễ.
  to: Nhưng khi đến Năm Hân Hỉ, cánh đồng ấy sẽ là vật thánh thuộc về Đức Giê-hô-va, như một cánh đồng đã được biệt hiến[a]; nó sẽ là sản nghiệp của thầy tế lễ.
  rationale: Thay cụm diễn giải “được chuyển giao” bằng cách chỉ thời điểm Năm Hân Hỉ để không quy định thêm cơ chế pháp lý ngoài nguyên văn. Giữ “đã được biệt hiến” cho חֵרֶם và chuyển sắc thái nghiêm ngặt, bao gồm khả năng hủy diệt trong ngữ cảnh khác, vào chú thích.
