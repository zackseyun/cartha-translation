source:
  edition: WLC
  text: כָּל חֵ֗רֶם אֲשֶׁ֧ר יָחֳרַ֛ם מִן הָ/אָדָ֖ם לֹ֣א יִפָּדֶ֑ה מ֖וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: vi
  text: Không một ai trong nhân loại bị biệt hiến[a] được chuộc lại; người ấy nhất định phải bị xử tử.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ điều bị đặt dưới lệnh cấm tuyệt đối hoặc được biệt hiến cách không thể thu hồi. Từ này có thể dùng cho người hoặc vật; trong một số ngữ cảnh, nó hàm ý bị dành cho sự hủy diệt.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Không một ai trong nhân loại bị dành cho sự hủy diệt được chuộc lại; người ấy nhất định phải bị xử tử.” Phương án này làm rõ một sắc thái có thể có của thuật ngữ “biệt hiến”.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרֶם / יָחֳרַם
  choice: bị biệt hiến
  rationale: Giữ mối liên hệ từ vựng giữa danh từ và động từ חרם, đồng thời bảo lưu sắc thái pháp lý–thờ phượng của việc bị dành riêng cách không thể thu hồi. Mệnh đề cuối cho thấy trong trường hợp này sự biệt hiến dẫn đến cái chết.
- source_word: מִן הָאָדָם
  choice: trong loài người
  rationale: Cụm từ chỉ một người thuộc về nhân loại. Cách dịch này tự nhiên trong tiếng Việt và làm rõ rằng đối tượng là con người mà không thu hẹp theo giới tính.
- source_word: יִפָּדֶה
  choice: được chuộc lại
  rationale: פדה mang nghĩa chuộc, trả giá để lấy lại; “chuộc lại” phù hợp với ngữ cảnh định giá và chuộc lại xuyên suốt Lê-vi Ký 27.
- source_word: מוֹת יוּמָת
  choice: nhất định phải bị xử tử
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn, còn thể bị động được phản ánh bằng “bị xử tử”.
theological_decisions:
- issue: Ý nghĩa của חרם khi đối tượng là một con người
  choice: Dùng thuật ngữ “bị biệt hiến” trong chính văn, rồi để mệnh đề tử hình xác định hậu quả trong trường hợp này.
  alternative: “bị đặt dưới lệnh tận diệt” hoặc “bị dành cho sự hủy diệt”
  rationale: Nguyên văn kết hợp ngôn ngữ biệt hiến/cấm tuyệt đối với công thức tử hình. Dịch thẳng thành “tận diệt” ngay từ đầu sẽ giải quyết thay cho người đọc một sắc thái mà tiếng Hê-bơ-rơ vẫn để trong thế căng thẳng.
- issue: Danh từ חֵרֶם có hình thức trung tính nhưng מִן־הָאָדָם xác định đối tượng là người
  choice: Diễn đạt tự nhiên là “bất cứ người nào trong loài người”.
  alternative: “bất cứ vật biệt hiến nào được biệt hiến từ loài người”
  rationale: Cách dịch đã chọn phản ánh đúng đối tượng con người và tránh gọi một người là “vật”, trong khi chú thích vẫn ghi nhận cấu trúc sát chữ của câu Hê-bơ-rơ.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. “Biệt hiến” giữ sắc thái chuyên biệt của חרם; “chuộc lại” nối câu này với chủ đề chuộc và định giá của cả chương. Đại từ “người ấy” làm rõ đối tượng là một con người.
