revisions:
- from: Bất cứ người nào trong loài người đã bị biệt hiến[a] đều không được chuộc lại; người ấy nhất định phải bị xử tử.[b]
  to: Không một ai trong nhân loại bị biệt hiến[a] được chuộc lại; người ấy nhất định phải bị xử tử.[b]
  rationale: Bản sửa dùng phủ định pháp lý tự nhiên “Không một ai...”, bỏ sắc thái quá khứ không được nguyên văn đòi hỏi, và bảo lưu thuật ngữ kỹ thuật của חרם trong chính văn. Các chú thích được viết lại để nhất quán với đối tượng là người và để phân biệt phương án diễn giải khỏi bản dịch chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:32:35Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo nhận diện đúng rằng cụm מִן־הָאָדָם quy chiếu đến con người và giữ được tính không thể chuộc của פדה cùng sự nhấn mạnh của מוֹת יוּמָת. Tuy nhiên, “đã bị biệt hiến” áp đặt sắc thái hoàn thành mà thể yiqtol trong công thức pháp lý này không nhất thiết có; “Bất cứ người nào trong loài người” cũng nặng và lặp ý. Cách diễn đạt sửa giữ tính khái quát của luật lệ và liên hệ với nhân loại mà tự nhiên hơn.
  naturalness: “Không một ai trong nhân loại bị biệt hiến...” là văn phong pháp lý trang trọng, hiện đại và mạch lạc hơn. “Nhất định phải bị xử tử” chuyển đạt thích đáng công thức tử hình bị động có nhấn mạnh.
  terminology: Giữ “biệt hiến” cho חרם/חרם, một thuật ngữ kỹ thuật có thể hàm ý đặt dưới lệnh cấm tuyệt đối hay dành cho sự hủy diệt tùy văn cảnh. “Chuộc lại” phù hợp với פדה trong Lê-vi Ký 27. Chú thích nêu phương án diễn giải “dành cho sự hủy diệt” mà không áp đặt nó vào chính văn.
  issues:
  - severity: medium
    issue: “đã bị biệt hiến” diễn giải thì/thể của יָחֳרַם theo hướng hoàn thành.
    rationale: Yiqtol thụ động trong câu luật lệ có thể mang giá trị khái quát hoặc quy định (“bị/được đặt dưới lệnh biệt hiến”), không đòi hỏi nghĩa “đã”. Bỏ “đã” bảo lưu tốt hơn giá trị nguồn.
  - severity: low
    issue: Cụm “Bất cứ người nào trong loài người” không thật tự nhiên và dư ý.
    rationale: “Người nào” đã biểu thị con người; “trong nhân loại” là cách chuyển đạt gọn, tự nhiên cho phạm vi con người của מִן־הָאָדָם.
  - severity: medium
    issue: Chú thích b hiện tại gọi đối tượng là “vật” nhưng sau đó dùng “người ấy”, và bản dịch được gọi là “dịch sát” vẫn không rõ cấu trúc hay ý nghĩa.
    rationale: Cần thay bằng một phương án diễn giải nhất quán, nêu rõ rằng nó làm hiển ngôn sắc thái hủy diệt của חרם.
