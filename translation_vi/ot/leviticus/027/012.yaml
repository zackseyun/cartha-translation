    rationale: כֵּן יִהְיֶה xác nhận rằng sự định giá sẽ là/đứng như vậy; nguyên văn không phát biểu minh nhiên rằng nó được “giữ nguyên” theo thời gian.
  - severity: medium
    issue: Dấu chú thích [a] đang gắn với “con vật ấy”, dù nội dung chú thích giải thích vế sau כְּעֶרְכְּךָ הַכֹּהֵן.
    rationale: Mỏ neo chú thích cần đặt tại cụm được chú giải để người đọc không hiểu rằng chú thích liên quan đến đại từ giống cái chỉ con vật.
  - severity: low
    issue: Ghi chú khẳng định trực tiếp “Ý là” mà chưa nêu tính bất thường của hậu tố ngôi hai số ít trong bản Hê-bơ-rơ.
    rationale: Nên giữ dữ liệu sát chữ và nói rõ bản dịch đang theo cách hiểu của văn mạch, qua đó bảo tồn điểm mơ hồ/vấn đề văn bản-ngữ pháp.
