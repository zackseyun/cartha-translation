  text: and the priest shall assess it[a], whether good or bad; as the priest assesses it, so it shall be.
translation:
  language: vi
  text: Thầy tế lễ phải định giá con vật ấy, xét xem nó tốt hay xấu; thầy tế lễ định giá thế nào[a] thì sẽ như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bản Hê-bơ-rơ ở vế sau theo sát chữ: “Theo sự định giá của ngươi, thầy tế lễ, thì sẽ như vậy.” Cụm “của ngươi, thầy tế lễ” có hình thức bất thường; bản dịch theo văn mạch hiểu đó là sự định giá của thầy tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: phải định giá
  rationale: Dạng Hiphil của ערך trong ngữ cảnh này chỉ việc chính thức xác định giá trị của con vật đã được biệt hiến; “định giá” tự nhiên và chính xác trong tiếng Việt pháp lý hiện đại.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi thông dụng, trang trọng của כֹּהֵן trong văn liệu Lê-vi.
- source_word: אֹתָהּ
  choice: con vật ấy
  rationale: Đại từ giống cái số ít quy chiếu về con vật ở câu trước; nêu rõ danh từ giúp câu tiếng Việt tự nhiên và tránh mơ hồ.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: xem nó tốt hay xấu
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ nói về việc đánh giá phẩm chất, đồng thời giữ đủ hai khả năng “tốt” và “xấu”.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: Giá thầy tế lễ ấn định thế nào
  rationale: Hình thức Hê-bơ-rơ sát chữ là “theo sự định giá của ngươi—thầy tế lễ”; cách dịch này thể hiện rõ rằng chính mức giá do thầy tế lễ xác định là mức có hiệu lực, còn cấu trúc bất thường được ghi chú.
- source_word: כֵּן יִהְיֶה
  choice: thì sẽ giữ nguyên như vậy
  rationale: Trong công thức pháp lý này, cụm từ xác nhận hiệu lực ràng buộc của mức định giá; “giữ nguyên” truyền đạt rõ rằng mức ấy được công nhận và không thay đổi.
