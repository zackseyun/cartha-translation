revisions:
- from: Nhưng người ấy phải lấy nước rửa bộ lòng và chân con vật; rồi thầy tế lễ phải thiêu toàn bộ trên bàn thờ cho bốc khói. Đó là một lễ thiêu, một lễ vật dâng bằng lửa[a], có hương thơm làm vui lòng Yahweh.
  to: Nhưng người ấy phải lấy nước rửa bộ lòng và chân con vật; rồi thầy tế lễ phải thiêu toàn bộ con vật trên bàn thờ cho bốc khói, thành một lễ thiêu, một lễ vật dâng bằng lửa[a], một hương thơm đẹp lòng Yahweh.
  rationale: Điều chỉnh cấu trúc để các danh ngữ tế lễ tiếp tục bổ nghĩa trực tiếp cho việc thiêu trọn con vật, thay “có hương thơm làm vui lòng” bằng công thức tự nhiên hơn “một hương thơm đẹp lòng Yahweh,” và lặp lại “con vật” sau “toàn bộ” để bảo toàn rõ ràng đối tượng của אֶת־הַכֹּל.
