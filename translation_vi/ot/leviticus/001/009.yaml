  text: וְ/קִרְבּ֥/וֹ וּ/כְרָעָ֖י/ו יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיח֖וֹחַ לַֽ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Nhưng người ấy phải lấy nước rửa bộ lòng và chân con vật; rồi thầy tế lễ phải thiêu toàn bộ con vật trên bàn thờ cho bốc khói, thành một lễ thiêu, một lễ vật dâng bằng lửa[a], một hương thơm đẹp lòng Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một lễ vật làm thức ăn.” Nghĩa chính xác của từ Hê-bơ-rơ này còn chưa chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: bộ lòng
  rationale: Trong bối cảnh hiến tế, từ này chỉ các phần bên trong, nhất là nội tạng, của con vật. “Bộ lòng” cụ thể, tự nhiên và phù hợp với hành động rửa.
- source_word: כְרָעָיו
  choice: chân con vật
  rationale: Từ này chỉ các chi dưới hoặc ống chân của con vật. Cách dịch này rõ nghĩa với độc giả phổ thông mà không dùng thuật ngữ giải phẫu quá chuyên biệt.
- source_word: יִרְחַץ בַּמָּיִם
  choice: phải lấy nước rửa
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ rõ phương tiện dùng để rửa theo giới từ Hê-bơ-rơ.
- source_word: וְהִקְטִיר
  choice: phải thiêu ... cho bốc khói
  rationale: Trong ngôn ngữ tế lễ, động từ này chỉ việc đốt lễ vật trên bàn thờ để nó bốc lên thành khói, chứ không chỉ nói chung về việc đốt.
- source_word: אֶת־הַכֹּל
  choice: toàn bộ
  rationale: Giữ sự nhấn mạnh rằng tất cả con vật đã được chuẩn bị đều được dâng trên bàn thờ.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Đây là thuật ngữ tiếng Việt rõ và quen thuộc cho loại lễ vật được thiêu trọn vẹn trên bàn thờ; ý niệm “đi lên” vẫn được gợi qua việc bốc khói.
- source_word: אִשֵּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Từ hiếm này thuộc công thức tế lễ và có thể liên hệ với “lửa” hoặc với “thức ăn.” Bản chính dùng cách dịch dựa trên lửa vì trực tiếp, đồng thời ghi nhận cách hiểu kia trong chú thích.
- source_word: רֵיחַ נִיחוֹחַ
  choice: hương thơm làm vui lòng
  rationale: Giữ hình ảnh của công thức tế lễ và truyền đạt ý lễ vật được Đức Chúa Trời chấp nhận, nhưng không biến hình ảnh ấy thành một phát biểu cơ giới về khứu giác thần linh.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Chuyển trực tiếp danh riêng giao ước יהוה thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn chức năng danh riêng và không lẫn với tước hiệu אֲדֹנָי.
- issue: Ý nghĩa của אִשֵּׁה
  choice: một lễ vật dâng bằng lửa
  alternative: một lễ vật làm thức ăn
  rationale: Ngữ nguyên và sắc thái chính xác của từ này còn được tranh luận. Bản dịch không đồng nhất chắc chắn lễ vật với thức ăn của thần linh, nhưng chú thích vẫn bảo tồn cách hiểu có cơ sở ấy.
- issue: Công thức רֵיחַ נִיחוֹחַ
  choice: có hương thơm làm vui lòng
  alternative: có hương thơm êm dịu
  rationale: Cách dịch giữ nguyên ẩn dụ tế lễ và ý nghĩa về sự chấp nhận, không giải thích quá mức bản tính hay cơ chế Đức Chúa Trời tiếp nhận lễ vật.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. “Người ấy” nối tự nhiên với chủ thể trong ngữ cảnh trước; “con vật” làm rõ các đại từ sở hữu của tiếng Hê-bơ-rơ. Dấu chấm trước chuỗi đồng vị giúp câu tiếng Việt sáng nghĩa mà vẫn giữ quan hệ: toàn bộ con vật được thiêu là lễ thiêu, lễ vật dâng bằng lửa và có hương thơm làm vui lòng Yahweh.'
