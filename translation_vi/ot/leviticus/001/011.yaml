source:
  edition: WLC
  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: vi
  text: Người ấy phải giết con vật ở phía bắc bàn thờ, trước mặt Yahweh; rồi các con trai A-rôn, tức các tư tế, phải hắt máu nó lên bàn thờ, chung quanh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải tạt máu nó lên bàn thờ, chung quanh.” Động từ Hê-bơ-rơ chỉ hành động hắt hoặc ném mạnh, không phải chỉ rảy nhẹ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט אֹתוֹ
  choice: phải giết con vật
  rationale: שׁחט là động từ chuyên dùng cho việc giết súc vật trong nghi lễ hiến tế. “Giết” tự nhiên và rõ nghĩa trong tiếng Việt; “con vật” làm rõ đối tượng mà không biến đại từ thành giống đực.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: ở phía bắc bàn thờ
  rationale: יֶרֶךְ có nghĩa đen là cạnh hoặc sườn; trong cách nói về vị trí của bàn thờ, cụm này chỉ phía bắc của bàn thờ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ sắc thái nghi lễ là ở trong sự hiện diện của Đức Chúa Trời, đồng thời phiên âm trực tiếp danh giao ước יְהוָה là “Yahweh”.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: các con trai A-rôn, tức các tư tế
  rationale: 'Giữ cấu trúc đồng vị: những người con trai của A-rôn được xác định là các tư tế.'
- source_word: וְזָרְקוּ
  choice: phải hắt
  rationale: זרק diễn tả việc ném hoặc hắt máu lên bàn thờ, mạnh hơn động tác rảy nhẹ. “Hắt” phù hợp với hành động dùng chất lỏng trong tiếng Việt hiện đại.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: vào chung quanh bàn thờ
  rationale: עַל đi với זרק chỉ hướng máu được hắt vào bề mặt hay các mặt của bàn thờ; סָבִיב cho biết hành động được thực hiện quanh bàn thờ.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh giao ước יְהוָה; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Chủ thể thực hiện việc giết con vật
  choice: Người ấy
  alternative: Tư tế
  rationale: Động từ וְשָׁחַט ở số ít tiếp nối người dâng lễ trong văn cảnh, còn mệnh đề sau nêu rõ các tư tế xử lý máu. Không đồng nhất hai chủ thể.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng dễ hiểu. Dùng “phải” cho tính quy định, “tư tế” cho chức vụ nghi lễ, và phiên âm tên riêng A-rôn theo lối quen thuộc trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
