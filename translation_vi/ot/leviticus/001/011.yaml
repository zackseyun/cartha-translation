  source_fidelity: 'Bản dịch phân biệt đúng chủ thể: người dâng lễ giết con vật, còn các con trai A-rôn là tư tế hắt máu. “Phía bắc bàn thờ,” “trước mặt Yahweh,” và “hắt” phản ánh sát các cụm Hê-bơ-rơ יֶרֶךְ...צָפֹנָה, לִפְנֵי יְהוָה, và זָרַק. Tuy nhiên, “hắt máu nó vào chung quanh bàn thờ” có thể gợi hành động hắt vào khoảng không hay khu vực quanh bàn thờ, trong khi עַל הַמִּזְבֵּחַ chỉ rõ máu được hắt lên/nhằm vào bàn thờ, với סָבִיב chỉ việc thực hiện quanh các phía của bàn thờ.'
