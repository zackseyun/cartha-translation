  to: Người ấy phải giết con vật ở phía bắc bàn thờ, trước mặt Yahweh; rồi các con trai A-rôn, tức các tư tế, phải hắt máu nó lên bàn thờ, chung quanh.[a]
  rationale: 'Sửa duy nhất cụm chỉ đích và phạm vi của việc hắt máu: “lên bàn thờ, chung quanh” bảo toàn cả עַל הַמִּזְבֵּחַ (“lên bàn thờ”) lẫn סָבִיב (“chung quanh”), đồng thời tránh cách nói không tự nhiên và mơ hồ “vào chung quanh bàn thờ.” Chú thích cũng được chỉnh tương ứng.'
