source:
  edition: WLC
  text: וְ֠/נָתְנוּ בְּנֵ֨י אַהֲרֹ֧ן הַ/כֹּהֵ֛ן אֵ֖שׁ עַל הַ/מִּזְבֵּ֑חַ וְ/עָרְכ֥וּ עֵצִ֖ים עַל הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/007.yaml
  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: vi
  text: Các con trai của A-rôn, thầy tế lễ, phải đặt lửa trên bàn thờ và sắp củi trên lửa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: phải đặt
  rationale: Động từ נתן có nghĩa rộng là “đặt, để, trao”; trong chỉ dẫn nghi lễ này, “đặt” diễn đạt tự nhiên hành động đưa lửa lên bàn thờ, còn “phải” thể hiện tính quy định của văn mạch.
- source_word: בְּנֵי אַהֲרֹן
  choice: các con trai của ... A-rôn
  rationale: Giữ rõ quan hệ gia đình trong kết cấu sở hữu Hê-bơ-rơ, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Danh từ số ít đứng sau tên A-rôn xác định A-rôn là thầy tế lễ; cách đặt “thầy tế lễ A-rôn” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: אֵשׁ
  choice: lửa
  rationale: Chỉ lửa theo nghĩa đen trong quy trình dâng sinh tế.
- source_word: עַל הַמִּזְבֵּחַ
  choice: trên bàn thờ
  rationale: Cách dịch trực tiếp, tự nhiên của giới từ עַל và thuật ngữ chỉ bàn thờ trong văn cảnh tế lễ.
- source_word: וְעָרְכוּ
  choice: và xếp
  rationale: ערך ở đây chỉ việc sắp đặt theo thứ tự; “xếp” ngắn gọn, tự nhiên và vẫn hàm ý bố trí củi có trật tự.
- source_word: עֵצִים
  choice: củi
  rationale: Trong ngữ cảnh nhóm lửa trên bàn thờ, “củi” tự nhiên và chính xác hơn từ chung “gỗ”, đồng thời không quy định quá cụ thể hình dạng từng khúc.
- source_word: עַל הָאֵשׁ
  choice: trên lửa
  rationale: 'Giữ sự lặp lại và trình tự hành động của nguyên văn: trước hết đặt lửa trên bàn thờ, rồi xếp củi trên lửa.'
theological_decisions:
- issue: Phạm vi bổ nghĩa của הַכֹּהֵן (“thầy tế lễ”)
  choice: 'Hiểu danh từ số ít này là đồng vị với A-rôn: “thầy tế lễ A-rôn”.'
  alternative: Hiểu rộng là mô tả các con trai A-rôn như một gia đình hay hàng ngũ tế lễ.
  rationale: Dạng số ít có mạo từ, vị trí ngay sau tên A-rôn và cấu trúc cú pháp ủng hộ cách hiểu rằng danh hiệu này xác định A-rôn, không phải toàn bộ các con trai ông.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc trong tiếng Việt; dùng “phải” để thể hiện tính chỉ thị của quy trình, tránh lối văn cổ “sẽ”. Giữ hai cụm “trên...” để phản ánh trình tự cụ thể của nguyên văn.
