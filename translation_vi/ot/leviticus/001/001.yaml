  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] gọi Môi-se và phán với ông từ Lều Hội Kiến rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là cách chuyển trực tiếp danh riêng יהוה (YHWH) trong tiếng Hê-bơ-rơ.
    reason: Làm rõ rằng “Yahweh” chuyển trực tiếp danh riêng trong nguyên văn, chứ không phải một tước hiệu.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: Động từ קרא ở đây mở đầu lời truyền phán của Đức Chúa Trời với Môi-se. “Gọi” tự nhiên và không thêm sắc thái mệnh lệnh mạnh như “triệu đến”.
- source_word: אֶל־מֹשֶׁה
  choice: Môi-se
  rationale: Với động từ “gọi”, tiếng Việt không cần dịch riêng giới từ אֶל; “gọi Môi-se” diễn đạt tự nhiên ý “gọi đến Môi-se”. “Môi-se” là dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong ngữ cảnh Yahweh long trọng truyền lời cho Môi-se, “phán” là cách diễn đạt trang trọng, tự nhiên trong tiếng Việt và phân biệt hành động nói với từ dẫn lời לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: אֵלָיו
  choice: với ông
  rationale: Đại từ chỉ lại Môi-se; “phán với ông” là cấu trúc tiếng Việt tự nhiên.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: từ Lều Hội Kiến
  rationale: מִן diễn tả nguồn phát ra của lời phán, còn אֹהֶל מוֹעֵד là tên gọi nơi Yahweh gặp dân Ngài. “Lều Hội Kiến” vừa rõ nghĩa vừa giữ hình ảnh chiếc lều của nguyên văn.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Từ này dẫn vào nội dung lời phán ở câu kế tiếp. “Rằng:” là cách chuyển tự nhiên sang lời trực tiếp trong tiếng Việt.
- source_word: וַ
  choice: Rồi
  rationale: Liên từ mở đầu tiếp nối mạch tường thuật từ cuối sách Xuất Ai Cập; “Rồi” thể hiện sự tiếp diễn mà không làm câu văn nặng nề.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה. Chuyển là “Yahweh” bảo tồn tính chất danh riêng và tránh âm thầm thay thế bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc giữ cả hành động Yahweh gọi Môi-se lẫn việc Ngài phán từ Lều Hội Kiến; dấu hai chấm cho thấy lời phán tiếp tục ở câu sau.
