review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính và giữ được tính đồng vị của “các con trai A-rôn ... các thầy tế lễ”. Tuy nhiên, “ở trên lửa nơi bàn thờ” làm mờ quan hệ không gian thứ hai của tiếng Hê-bơ-rơ: lửa được nói rõ là ở trên bàn thờ, không chỉ là lửa ‘nơi’ bàn thờ. “Các miếng thịt” cũng hẹp hơn נְתָחִים, vốn chỉ các phần đã chặt của con vật, không nhất thiết chỉ thịt.'
  naturalness: Bản sửa dùng văn phong nghi lễ hiện đại, rõ và tự nhiên. “Sắp xếp” phản ánh sắc thái bày/đặt theo thứ tự của động từ ערך; “các phần” tránh cách nói quá khẩu ngữ hoặc quá cụ thể.
  terminology: Giữ “A-rôn” và “thầy tế lễ”, là các thuật ngữ Kinh Thánh Việt ngữ quen dùng. “Phần mỡ” giữ tính bất định của פָּדֶר; chú thích nêu các khả năng giải phẫu mà không quyết định quá mức.
  issues:
  - severity: medium
    issue: Quan hệ không gian của lửa với bàn thờ bị làm mờ.
    rationale: 'Cụm “nơi bàn thờ” không chuyển tải minh thị mệnh đề quan hệ השני: “lửa ... ở trên bàn thờ”. Bản sửa nói rõ “lửa trên bàn thờ”, đồng thời vẫn giữ trật tự không gian của nguyên văn.'
  - severity: low
    issue: “Các miếng thịt” diễn giải hẹp danh từ “các phần đã chặt”.
    rationale: נְתָחִים chỉ các phần/các miếng của con vật sau khi chặt, trong khi “thịt” có thể khiến độc giả hiểu chỉ mô cơ. “Các phần” trung tính và sát nguồn hơn.
  revised_text: Các con trai A-rôn, là các thầy tế lễ, sẽ sắp xếp các phần, đầu và phần mỡ[a] trên củi ở trên lửa trên bàn thờ.
