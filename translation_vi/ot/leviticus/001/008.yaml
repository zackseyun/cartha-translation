revisions:
- from: Các con trai A-rôn, là những thầy tế lễ, phải xếp các miếng thịt, cái đầu và phần mỡ[a] trên củi ở trên lửa nơi bàn thờ.
  to: Các con trai A-rôn, là các thầy tế lễ, sẽ sắp xếp các phần, đầu và phần mỡ[a] trên củi ở trên lửa trên bàn thờ.
  rationale: Sửa quan hệ không gian để nêu rõ củi ở trên lửa và lửa ở trên bàn thờ, theo chuỗi mệnh đề quan hệ của tiếng Hê-bơ-rơ. Đổi “các miếng thịt” thành “các phần” để không thu hẹp nghĩa của thuật ngữ chỉ các phần con vật đã chặt. Các yếu tố còn lại, kể cả chú thích về phần mỡ, được giữ nguyên về nghĩa.
  reviewer_model: gpt-5.6-terra
