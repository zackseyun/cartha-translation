base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: vi
  text: Các con trai A-rôn, là các thầy tế lễ, sẽ sắp xếp các phần, đầu và phần mỡ[a] trên củi ở trên lửa trên bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mỡ lá” hoặc “lớp mỡ bao phủ”; từ Hê-bơ-rơ chỉ một phần mỡ của con vật được dùng trong lễ vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: phải xếp
  rationale: Động từ ערך trong nghi thức tế lễ chỉ việc sắp đặt theo thứ tự. “Phải xếp” tự nhiên trong tiếng Việt và giữ sắc thái chỉ dẫn bắt buộc.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: Các con trai A-rôn, là những thầy tế lễ
  rationale: Cụm “là những thầy tế lễ” được hiểu đồng vị với “các con trai A-rôn”; cách diễn đạt này làm rõ quan hệ ngữ pháp mà không thêm ý.
- source_word: הַנְּתָחִים
  choice: các miếng thịt
  rationale: Danh từ chỉ những phần đã được chặt ra của con vật. Thêm “thịt” giúp người đọc tiếng Việt nhận rõ đối tượng trong ngữ cảnh, nhưng không diễn giải quá mức.
- source_word: הָרֹאשׁ
  choice: cái đầu
  rationale: Cách gọi giải phẫu trực tiếp, phù hợp với con vật hiến tế.
- source_word: הַפָּדֶר
  choice: phần mỡ
  rationale: פָּדֶר chỉ một phần mỡ của con vật dùng trong lễ vật, có thể cụ thể là mỡ lá hoặc lớp mỡ bao phủ. “Phần mỡ” rõ nghĩa và dễ hiểu; độ bất định giải phẫu được giữ trong chú thích.
- source_word: עַל הָעֵצִים
  choice: trên củi
  rationale: עֵצִים ở đây mang nghĩa tập hợp là củi dùng làm nhiên liệu trên bàn thờ.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: ở trên lửa nơi bàn thờ
  rationale: 'Diễn đạt tự nhiên quan hệ không gian: củi ở trên lửa, và lửa ở nơi bàn thờ. Tránh câu tiếng Việt nặng nề nhưng không đảo ngược các lớp không gian của nguyên văn.'
theological_decisions: []
