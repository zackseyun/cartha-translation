id: LEV.1.5
reference: Leviticus 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: vi
  text: Người ấy phải giết con bò đực non[a] trước mặt Yahweh. Các con trai A-rôn, là những thầy tế lễ, phải mang huyết đến, rồi hất huyết[b] vào khắp các phía của bàn thờ đặt tại lối vào Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “con của đàn bò,” một thành ngữ chỉ một con thuộc loài bò; ở đây được dịch là “con bò đực non.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tạt huyết” hoặc, theo cách nói truyền thống hơn, “rảy huyết.” Động từ Hê-bơ-rơ chỉ việc ném hoặc hất huyết để áp vào bàn thờ trong nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: phải giết
  rationale: Trong văn cảnh chỉ dẫn nghi lễ, động từ diễn tả hành động bắt buộc kế tiếp. “Giết” tự nhiên trong tiếng Việt; đối tượng và văn cảnh đã cho thấy đây là việc giết con vật để dâng tế.
- source_word: בֶּן הַבָּקָר
  choice: con bò đực non
  rationale: Cụm từ có nghĩa đen là “con của đàn bò,” một thành ngữ chỉ gia súc thuộc loài bò; “bò đực non” diễn đạt tự nhiên đối tượng hiến tế trong văn cảnh.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ sắc thái không gian và nghi lễ của cụm từ, đồng thời dùng danh riêng giao ước Yahweh cho יהוה.
- source_word: וְהִקְרִיבוּ
  choice: phải mang huyết đến
  rationale: Dạng khiến khiến của קרב mang nghĩa đem lại gần hoặc trình ra. “Mang huyết đến” tránh hàm ý rằng chính hành động này đã là toàn bộ việc dâng sinh tế.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: các con trai A-rôn, là những thầy tế lễ
  rationale: Giữ cả quan hệ gia đình lẫn thành phần đồng vị xác định chức vụ tư tế của họ.
- source_word: וְזָרְקוּ
  choice: rồi hất
  rationale: זרק chỉ động tác ném hoặc hất chất lỏng trong nghi lễ, mạnh và cụ thể hơn “rảy”; “hất” tự nhiên hơn “ném huyết” trong tiếng Việt.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: vào khắp các phía của bàn thờ
  rationale: Diễn đạt việc huyết được hất vào các mặt xung quanh bàn thờ, thay vì chỉ đặt trên mặt bàn thờ.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: đặt tại lối vào Lều Hội Kiến
  rationale: Mệnh đề quan hệ xác định vị trí của bàn thờ; cách diễn đạt này gọn và rõ trong tiếng Việt.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Bản dịch trực tiếp, trang trọng và quen thuộc của danh xưng chỉ chiếc lều nơi hội kiến.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Giữ danh riêng giao ước được văn bản Hê-bơ-rơ dùng trực tiếp, thay vì thay bằng một tước hiệu.
- issue: Chủ thể thực hiện việc giết con vật
  choice: Người ấy
  alternative: Thầy tế lễ
  rationale: Động từ số ít tiếp nối người dâng lễ trong mạch chỉ dẫn, còn vế sau nêu rõ các thầy tế lễ đảm trách việc xử lý huyết; không chuyển hành động giết sang cho thầy tế lễ.
- issue: Mức độ mạnh của động tác áp dụng huyết
  choice: hất huyết
  alternative: rảy huyết
  rationale: Giữ lực nghĩa của זרק và không làm động tác nhẹ đi theo thuật ngữ nghi lễ truyền thống, đồng thời ghi nhận cách dịch quen thuộc trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phải” để thể hiện tính chỉ dẫn của chuỗi động từ; dùng “huyết” thay vì “máu” để duy trì sắc thái nghi lễ mà vẫn quen thuộc với độc giả Kinh Thánh tiếng Việt. Các dấu chú thích được đặt ngay sau từ ngữ mà chúng giải thích.
