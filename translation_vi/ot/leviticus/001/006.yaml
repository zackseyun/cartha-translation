  text: וְ/הִפְשִׁ֖יט אֶת הָ/עֹלָ֑ה וְ/נִתַּ֥ח אֹתָ֖/הּ לִ/נְתָחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/006.yaml
  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: vi
  text: Rồi người ấy phải lột da con vật làm lễ thiêu và chặt nó thành từng phần.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “chặt nó thành các phần của nó,” tức là chia con vật thành những phần để dâng làm lễ.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: lột da
  rationale: Dạng Hifil của פשט trong bối cảnh hiến tế chỉ hành động lấy da khỏi con vật. “Lột da” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: הָעֹלָה
  choice: con vật làm lễ thiêu
  rationale: עֹלָה là thuật ngữ chỉ lễ vật được thiêu trọn. Trong câu này, đại từ và các hành động lột da, chặt ra cho thấy từ này nói đến chính con vật dùng làm lễ thiêu; cách dịch này giữ rõ đối tượng cụ thể.
- source_word: וְנִתַּח
  choice: và chặt
  rationale: נתח chỉ việc phân con vật thành các phần để hiến tế. “Chặt” diễn đạt tự nhiên hành động chia thân con vật, còn cụm theo sau làm rõ kết quả.
- source_word: לִנְתָחֶיהָ
  choice: thành từng phần
  rationale: Danh từ נתח có nghĩa là một phần hay khúc đã được cắt. Giới từ ל ở đây diễn tả kết quả hoặc sự phân chia; “thành từng phần” vừa tự nhiên vừa giữ đúng thủ tục nghi lễ.
- source_word: וְ
  choice: Rồi
  rationale: Liên từ nối mệnh lệnh này với bước trước trong trình tự nghi lễ. “Rồi” thể hiện mạch tuần tự rõ ràng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để giữ nguyên chủ thể số ít giống đực nhưng không xác định của động từ Hê-bơ-rơ; “con vật làm lễ thiêu” làm rõ rằng đối tượng bị lột da và chặt ra là con vật hiến tế.
