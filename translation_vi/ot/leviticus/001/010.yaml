  source_fidelity: Bản dịch giữ đúng cấu trúc điều kiện, các loài vật (chiên hoặc dê), yêu cầu con đực không tì vết, và lực quy định của động từ dâng. Tuy nhiên, עֹלָה chỉ loại tế lễ được thiêu trọn vẹn; “lễ thiêu” có thể hiểu rộng là một lễ có việc thiêu, nên “lễ toàn thiêu” chính xác hơn trong thuật ngữ tế lễ.
