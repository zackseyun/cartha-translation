revisions:
- from: Nếu lễ vật người ấy dâng là một con trong đàn chiên hoặc đàn dê để làm lễ thiêu[a], thì người ấy phải dâng một con đực không tì vết[b].
  to: Nếu lễ vật người ấy dâng là một con trong đàn chiên hoặc đàn dê để làm lễ toàn thiêu[a], thì người ấy phải dâng một con đực không tì vết[b].
  rationale: Chỉ điều chỉnh thuật ngữ chỉ עֹלָה từ “lễ thiêu” thành “lễ toàn thiêu” để biểu đạt chính xác hơn hạng mục tế lễ trong nguyên ngữ. Những thành phần còn lại của bản dịch và các chú thích được giữ nguyên về ý nghĩa; chú thích a được cập nhật để khớp với bản văn sửa.
  reviewer_model: gpt-5.6-terra
