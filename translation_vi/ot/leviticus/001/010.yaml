id: LEV.1.10
reference: Leviticus 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: vi
  text: Nếu lễ vật người ấy dâng là một con trong đàn chiên hoặc đàn dê để làm lễ toàn thiêu[a], thì người ấy phải dâng một con đực không tì vết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để dâng làm lễ toàn thiêu.”'
    reason: lexical_alternative
  - marker: b
    text: “Không tì vết” nghĩa là không có khuyết tật thể chất; đây là điều kiện bắt buộc đối với con vật dùng cho lễ tế này.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Nếu
  rationale: Mở đầu trường hợp có điều kiện tiếp theo; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ.
- source_word: מִן הַצֹּאן ... מִן הַכְּשָׂבִים אוֹ מִן הָעִזִּים
  choice: một con trong đàn chiên hoặc đàn dê
  rationale: צֹאן là gia súc nhỏ sống theo đàn, rồi câu xác định hai loại là chiên và dê. Cách diễn đạt này giữ đủ phạm vi mà tránh lặp gượng trong tiếng Việt.
- source_word: קָרְבָּנוֹ
  choice: lễ vật người ấy dâng
  rationale: קָרְבָּן chỉ vật được đem đến dâng trong nghi lễ; cụm này rõ nghĩa và tự nhiên hơn đại từ sở hữu dễ gây mơ hồ.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là loại lễ vật được thiêu toàn bộ trên bàn thờ; “lễ thiêu” là thuật ngữ ngắn gọn, dễ hiểu trong ngữ cảnh tế lễ.
- source_word: זָכָר תָּמִים
  choice: một con đực không tì vết
  rationale: Giữ nguyên yêu cầu về giới tính và tình trạng không có khuyết tật của con vật.
- source_word: יַקְרִיבֶנּוּ
  choice: người ấy phải dâng
  rationale: Động từ Hiphil của קרב trong ngữ cảnh tế lễ mang nghĩa đem đến/dâng; “phải” thể hiện lực chỉ thị của quy định.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ עֹלָה
  choice: lễ thiêu
  alternative: lễ vật thăng lên
  rationale: “Lễ thiêu” truyền đạt loại tế lễ theo ngữ cảnh Lê-vi mà không buộc người đọc theo cách giải thích từ nguyên về điều “đi lên”.
- issue: Yêu cầu זָכָר đối với con vật
  choice: một con đực
  alternative: một con
  rationale: Bản Hê-bơ-rơ nói rõ giới tính của con vật, nên không được lược bỏ.
- issue: Ý nghĩa của תָּמִים
  choice: không tì vết
  alternative: toàn vẹn
  rationale: Trong luật tế lễ, từ này nói đến con vật không có khuyết tật thể chất đủ làm nó không thích hợp để dâng, chứ không hàm ý hoàn hảo đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để chỉ người dâng lễ, tránh mặc định giới tính của người này; yêu cầu con vật phải là con đực vẫn được giữ rõ ràng. Cấu trúc được làm tự nhiên trong tiếng Việt nhưng vẫn bảo toàn các thành phần của câu Hê-bơ-rơ.
