id: LEV.1.3
reference: Leviticus 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: vi
  text: Nếu lễ vật của người ấy là lễ thiêu từ đàn bò, thì người ấy phải dâng một con đực không tì vết. Người ấy phải dâng nó tại cửa Lều Hội Kiến, để được chấp nhận trước mặt Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “theo ý muốn của người ấy trước mặt Yahweh”; truyền thống cũng hiểu là người ấy tự nguyện dâng.'
    reason: Cụm לִרְצֹנוֹ có thể chỉ việc người dâng được chấp nhận, nhưng cũng có lịch sử lâu đời được hiểu theo nghĩa tự nguyện.
lexical_decisions:
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ chỉ lễ vật được thiêu trọn trên bàn thờ; “lễ thiêu” là cách gọi ngắn gọn, quen thuộc và phù hợp với ngữ cảnh tế lễ.
- source_word: קָרְבָנוֹ
  choice: lễ vật người ấy dâng
  rationale: קָרְבָּן là vật được đem đến để dâng. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ quan hệ sở hữu của hậu tố ngôi thứ ba.
- source_word: מִן הַבָּקָר
  choice: lấy từ đàn bò
  rationale: הַבָּקָר chỉ đại gia súc thuộc loài bò; “đàn bò” diễn đạt tự nhiên phạm vi vật nuôi được nói đến.
- source_word: זָכָר תָּמִים
  choice: một con đực không tì vết
  rationale: Giữ nguyên cả yêu cầu về giới tính lẫn tình trạng không có khuyết tật của con vật hiến tế.
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: phải dâng … / phải dâng nó
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến trình dâng. “Dâng” vừa tự nhiên vừa giữ được sắc thái tế lễ; đại từ “nó” thể hiện tân ngữ trong tiếng Hebrew.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: lối vào Lều Hội Kiến
  rationale: Diễn đạt rõ địa điểm tại cửa/lối vào của nơi thánh; “Lều Hội Kiến” là tên gọi trang trọng và dễ hiểu.
- source_word: לִרְצֹנוֹ
  choice: để được chấp nhận
  rationale: Trong ngữ cảnh tế lễ, cụm này có thể chỉ việc người dâng được Yahweh vui nhận. Cách dịch này tự nhiên nhưng không che giấu cách hiểu truyền thống về sự tự nguyện, được ghi ở chú thích.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי mang nghĩa “trước mặt/trong sự hiện diện của”; danh riêng giao ước יְהוָה được chuyển là “Yahweh”.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Bản nguồn trực tiếp dùng danh giao ước; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của לִרְצֹנוֹ
  choice: để được chấp nhận
  alternative: theo ý nguyện của mình / do mình tự nguyện
  rationale: Cú pháp Hebrew cho phép cách hiểu liên quan đến sự chấp nhận của Yahweh, đồng thời truyền thống dịch thuật cũng hiểu là sự tự nguyện của người dâng. Bản chính chọn nghĩa phù hợp ngữ cảnh tế lễ, còn chú thích giữ cách hiểu kia để bảo tồn sự mơ hồ thực sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” thay cho đại từ đánh dấu giới tính vì chủ thể được nói đến theo chức năng người dâng lễ; giữ các thuật ngữ tế lễ nhất quán và tránh thêm diễn giải giáo phái.
