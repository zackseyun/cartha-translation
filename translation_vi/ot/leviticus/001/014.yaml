  source_fidelity: 'Bản dịch giữ đúng cấu trúc điều kiện của câu, loại tế lễ עֹלָה là “lễ thiêu,” đối tượng dâng là Yahweh, và hai lựa chọn được nêu rõ: תֹּרִים là “chim cu” và בְּנֵי הַיּוֹנָה là “bồ câu non.” Cách dùng “bằng chim” diễn đạt tự nhiên ý lễ thiêu thuộc loại/chọn từ các loài chim. “Phải dâng” phù hợp sắc thái chỉ dẫn của động từ וְהִקְרִיב trong ngữ cảnh luật tế lễ.'
