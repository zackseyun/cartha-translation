id: LEV.1.14
reference: Leviticus 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: vi
  text: Nếu lễ vật người ấy dâng lên Yahweh là lễ thiêu bằng chim, thì người ấy phải dâng chim cu hoặc bồ câu non làm lễ vật.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Nếu
  rationale: Mở đầu trường hợp kế tiếp trong chuỗi chỉ dẫn; tiếng Việt không cần dịch riêng liên từ וְ để vẫn giữ được mạch văn tự nhiên.
- source_word: מִן הָעוֹף
  choice: bằng chim
  rationale: עוֹף chỉ loài chim trong ngữ cảnh tế lễ; giới từ מִן diễn tả loại vật được dùng làm lễ vật, nên “bằng chim” tự nhiên hơn “từ chim” trong tiếng Việt.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ quen thuộc cho loại tế lễ được thiêu trên bàn thờ; giữ nghĩa nghi lễ cụ thể mà không diễn giải căn nguyên liên quan đến sự bay lên.
- source_word: קָרְבָּנוֹ
  choice: lễ vật người ấy
  rationale: קָרְבָּן là vật được đem đến dâng; cách diễn đạt này rõ ràng, tự nhiên và tránh đại từ chỉ giới không cần thiết.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: לְ trong ngữ cảnh này biểu thị Đấng tiếp nhận lễ vật; dùng danh riêng Yahweh để thể hiện trực tiếp יהוה.
- source_word: וְהִקְרִיב
  choice: thì người ấy phải dâng
  rationale: Dạng Hiphil của קרב có nghĩa đem đến hoặc trình dâng; “thì” thể hiện kết quả của mệnh đề điều kiện, còn “phải” truyền đạt sắc thái chỉ thị.
- source_word: מִן הַתֹּרִים
  choice: chim cu
  rationale: תֹּרִים chỉ loài turtledove; “chim cu” là tên gọi thông dụng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: אוֹ
  choice: hoặc
  rationale: Giữ nguyên quan hệ lựa chọn giữa hai loại chim được phép dâng.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: bồ câu non
  rationale: Thành ngữ “con của chim bồ câu” chỉ chim non; “bồ câu non” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: אֶת קָרְבָּנוֹ
  choice: làm lễ vật
  rationale: Danh từ được lặp lại ở cuối câu trong tiếng Hê-bơ-rơ; “làm lễ vật” giữ nội dung và chức năng nhấn mạnh mà không tạo cấu trúc tiếng Việt gượng gạo.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” thay cho đại từ phân giới tính vì tiếng Hê-bơ-rơ dùng hậu tố giống đực theo quy ước ngữ pháp, còn đối tượng chỉ dẫn không cần được nhấn mạnh về giới. Cấu trúc điều kiện được sắp xếp tự nhiên trong tiếng Việt, đồng thời giữ hai lựa chọn lễ vật.
