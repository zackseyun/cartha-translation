revisions:
- from: Người ấy phải xé con chim ra nơi hai cánh nhưng không được tách lìa; rồi thầy tế lễ sẽ thiêu nó trên bàn thờ, trên củi đang cháy. Đó là lễ thiêu, một lễ vật dâng bằng lửa[a], có hương thơm làm đẹp lòng Yahweh.
  to: Thầy tế lễ phải xé nó ra ở chỗ cánh, nhưng không được tách lìa; rồi sẽ thiêu nó trên bàn thờ, trên củi đặt trên lửa. Đó là lễ thiêu, một lễ vật dâng bằng lửa[a], hương thơm đẹp lòng Yahweh.
  rationale: Bản sửa làm rõ chủ thể theo mạch văn, giữ hành động xé mở mà không tách rời hoàn toàn, và bảo tồn cấu trúc «củi ... trên lửa» của tiếng Hê-bơ-rơ. Công thức tế lễ cuối câu được giữ ngắn gọn, trang trọng và sát nghĩa; chú thích chỉ nêu các phương án hợp lý cho אִשֶּׁה.
