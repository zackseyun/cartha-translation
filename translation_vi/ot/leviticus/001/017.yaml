language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Thầy tế lễ phải xé nó ra ở chỗ cánh, nhưng không được tách lìa; rồi sẽ thiêu nó trên bàn thờ, trên củi đặt trên lửa. Đó là lễ thiêu, một lễ vật dâng bằng lửa[a], hương thơm đẹp lòng Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật bằng lửa” hoặc “lễ vật dùng lửa”.
    reason: Bảo tồn các cách diễn đạt khả dĩ của thuật ngữ tế lễ אִשֶּׁה, vốn chỉ lễ vật liên hệ với lửa.
lexical_decisions:
- source_word: שִׁסַּע
  choice: xé ... ra
  rationale: Diễn tả việc xé hoặc chẻ thân chim ra, đồng thời phù hợp với mệnh lệnh tiếp theo là không tách lìa hoàn toàn.
- source_word: בִכְנָפָיו
  choice: nơi hai cánh
  rationale: Giữ hình ảnh cụ thể của nguyên ngữ và để ngỏ sắc thái vị trí hoặc phương diện của giới từ בְּ.
- source_word: לֹא יַבְדִּיל
  choice: không được tách lìa
  rationale: Hiphil của בדל chỉ sự phân tách; “tách lìa” nói rõ rằng con chim được xé mở nhưng hai phần không bị rời hẳn.
- source_word: וְהִקְטִיר
  choice: sẽ thiêu nó
  rationale: Trong ngữ cảnh tế lễ, động từ chỉ việc đốt lễ vật trên bàn thờ cho bốc khói; “thiêu” vừa gọn vừa trang trọng.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Cách diễn đạt tự nhiên và chính xác cho vị trí thực hiện nghi thức.
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: trên củi đang cháy
  rationale: Diễn đạt tự nhiên trong tiếng Việt về lớp củi ở trên lửa, tránh câu cứng “trên củi ở trên lửa” mà vẫn giữ bố cục của nghi thức.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ tế lễ quen thuộc, chỉ lễ vật được thiêu trọn trên bàn thờ.
- source_word: אִשֵּׁה
  choice: một lễ vật dâng bằng lửa
  rationale: Phản ánh trực tiếp nghĩa tế lễ được dâng qua lửa; giữ khả năng hiểu khác trong chú thích.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm làm đẹp lòng
  rationale: Giữ nguyên ẩn dụ tế lễ và diễn đạt ý được tiếp nhận cách hài lòng mà không giải thích thần học quá mức.
- source_word: לַיהוָה
  choice: làm đẹp lòng Yahweh
  rationale: Giới từ לְ được thể hiện tự nhiên trong cấu trúc tiếng Việt của cả cụm, đồng thời giữ danh riêng giao ước Yahweh.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Công thức tế lễ רֵיחַ נִיחֹחַ
  choice: hương thơm làm đẹp lòng Yahweh
  alternative: hương thơm êm dịu dâng lên Yahweh
  rationale: Cách dịch giữ ẩn dụ về mùi hương và hàm ý lễ vật được đón nhận, nhưng không đưa thêm một hệ thống giải thích thần học vào câu.
- issue: Ý nghĩa của אִשֵּׁה
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật / thức ăn dâng lên
  rationale: Từ này có cách phân tích từ nguyên và sắc thái gây tranh luận. Bản chính ưu tiên mối liên hệ rõ với lửa trong ngữ cảnh, còn chú thích bảo tồn cách hiểu “lễ vật” hay “thức ăn dâng lên”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “người ấy” cho chủ thể ngầm tiếp nối người dâng lễ trong ngữ cảnh; dùng “thầy tế lễ” theo thuật ngữ Lê-vi Ký. Cấu trúc được làm tự nhiên hơn tiếng Hê-bơ-rơ nhưng vẫn giữ trình tự hành động và công thức tế lễ.
