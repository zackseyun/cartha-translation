- from: '“Hãy nói với con cái Israel[a] và bảo họ: ‘Khi một người[b] trong các con đem lễ vật đến dâng cho Yahweh, thì các con phải đem lễ vật từ gia súc—từ đàn bò hoặc đàn chiên dê.’”'
