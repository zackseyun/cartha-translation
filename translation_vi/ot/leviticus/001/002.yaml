  rationale: Bổ sung “của mình” để phản ánh hậu tố sở hữu trong קָרְבַּנְכֶם, và thay cách nối phần chỉ nguồn chọn lễ vật để tiếng Việt rõ, tự nhiên hơn. Các lựa chọn từ vựng chính và hai chú thích được giữ nguyên vì vẫn trung thành với tiếng Hê-bơ-rơ.
