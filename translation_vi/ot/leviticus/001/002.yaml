source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: vi
  text: '“Hãy nói với con cái Israel[a] và bảo họ: ‘Khi một người[b] trong các con đem lễ vật đến dâng cho Yahweh, thì các con phải đem lễ vật của mình trong số gia súc, tức là từ đàn bò hoặc đàn chiên dê.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Israel”; thành ngữ này chỉ dân Israel.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bất cứ ai”. Từ Hê-bơ-rơ ’adam (“người”) ở đây chỉ một cá nhân theo nghĩa đại diện.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ thành ngữ chỉ cộng đồng theo sát tiếng Hê-bơ-rơ, đồng thời đây là cách diễn đạt trang trọng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: אָדָם
  choice: một người
  rationale: Danh từ số ít mở đầu một trường hợp luật định và có ý nghĩa đại diện. “Một người” tự nhiên trong tiếng Việt mà không thu hẹp đối tượng thành nam giới.
- source_word: יַקְרִיב
  choice: đem lễ vật đến dâng
  rationale: Thể Hiphil của קרב trong ngữ cảnh tế lễ hàm ý đem đến hoặc trình dâng; cách dịch này giữ cả chuyển động cụ thể lẫn mục đích dâng hiến.
- source_word: מִכֶּם
  choice: trong các con
  rationale: 'Diễn đạt ý phân bộ: một cá nhân thuộc cộng đồng đang được nói với.'
- source_word: קָרְבָּן
  choice: lễ vật
  rationale: Đây là thuật ngữ rộng chỉ vật được đem đến dâng, phù hợp hơn “sinh tế”, vốn có thể khiến nghĩa bị thu hẹp vào vật bị giết.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ danh riêng giao ước יהוה bằng dạng chuyển tự “Yahweh”, và dùng “cho” tự nhiên với hành động dâng lễ vật.
- source_word: הַבְּהֵמָה
  choice: gia súc
  rationale: Chỉ phạm trù chung gồm những động vật nuôi thích hợp làm lễ vật.
- source_word: הַבָּקָר
  choice: đàn bò
  rationale: Chỉ đại gia súc thuộc loài bò, là một phân nhóm của gia súc trong câu.
- source_word: הַצֹּאן
  choice: đàn chiên dê
  rationale: Từ này bao gồm tiểu gia súc, đặc biệt cả chiên lẫn dê; nêu rõ hai loài tránh để “đàn chiên” bị hiểu là loại trừ dê.
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  choice: các con phải đem lễ vật
  rationale: Giữ sự chuyển đổi từ trường hợp cá nhân số ít sang lời chỉ dẫn cho cộng đồng ở ngôi thứ hai số nhiều, đồng thời duy trì liên hệ từ vựng với động từ יקריב trước đó.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Chuyển tự “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng một tước hiệu.
- issue: Ngôn ngữ giống đực có tính đại diện trong אָדָם và בְּנֵי יִשְׂרָאֵל
  choice: Dịch אָדָם là “một người” và בְּנֵי יִשְׂרָאֵל là “con cái Israel”, kèm chú thích nguyên ngữ
  alternative: “một người nam” và “các con trai Israel”
  rationale: Trong ngữ cảnh này, אָדָם chỉ một cá nhân đại diện, không nhất thiết giới hạn ở nam giới; còn בְּנֵי יִשְׂרָאֵל là thành ngữ chỉ toàn cộng đồng. Bản dịch giữ dấu vết hình thức Hê-bơ-rơ nơi tiếng Việt vẫn tự nhiên và dùng chú thích để minh bạch.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. “Các con” thể hiện lời Đức Chúa Trời truyền qua Môi-se cho cộng đồng và giúp làm rõ dạng số nhiều ở mệnh đề cuối. Cấu trúc câu giữ nhịp mở đầu luật tế lễ, đồng thời dùng “đàn chiên dê” để truyền đạt đầy đủ phạm vi của הַצֹּאן.
