  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh nói với cộng đồng Israel, trường hợp một cá nhân dâng lễ vật, và sự chuyển sang ngôi thứ hai số nhiều ở mệnh đề cuối. Tuy nhiên, hậu tố sở hữu số nhiều trong קָרְבַּנְכֶם (“lễ vật của các con”) chưa được biểu đạt; đồng thời “đem lễ vật từ gia súc” dễ tạo cảm giác “gia súc” là vật được mang theo hơn là nguồn/phạm vi chọn lễ vật.
  naturalness: Văn phong nhìn chung trang trọng, hiện đại và dễ hiểu. “Các con” thích hợp trong lời truyền phán trực tiếp. Cụm “từ gia súc—từ đàn bò hoặc đàn chiên dê” cần được nối lại tự nhiên hơn bằng “trong số gia súc, tức là...”.
