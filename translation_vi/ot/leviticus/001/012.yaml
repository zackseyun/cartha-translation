revisions:
- from: Người ấy phải chặt con vật ra thành từng phần, cùng với đầu và mỡ của nó[a]; rồi thầy tế lễ phải xếp tất cả trên củi đang ở trên lửa, là lửa trên bàn thờ.
  to: Người ấy phải chặt con vật thành từng phần, gồm cả đầu và mỡ của nó[a]; rồi thầy tế lễ phải xếp các phần ấy trên củi ở trên ngọn lửa trên bàn thờ.
  rationale: 'Sửa câu để phản ánh rõ và tự nhiên chuỗi bổ nghĩa trong tiếng Hê-bơ-rơ: các phần được xếp trên củi; củi ở trên lửa; lửa ở trên bàn thờ. Đồng thời thay “tất cả” bằng một cụm quy chiếu rõ hơn. Chú thích về פִּדְרוֹ được giữ nguyên vì phù hợp với tính không hoàn toàn xác định của thuật ngữ.'
