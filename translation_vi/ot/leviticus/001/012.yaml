base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: vi
  text: Người ấy phải chặt con vật thành từng phần, gồm cả đầu và mỡ của nó[a]; rồi thầy tế lễ phải xếp các phần ấy trên củi ở trên ngọn lửa trên bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lớp mỡ” hoặc “mỡ quanh nội tạng.” Từ Hê-bơ-rơ chỉ mô mỡ gắn với con vật hiến tế.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: phải chặt con vật ra thành từng phần
  rationale: Trong nghi thức hiến tế, động từ נתח chỉ việc chặt xác con vật thành các phần. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ tính chất chỉ dẫn của câu.
- source_word: רֹאשׁוֹ
  choice: đầu ... của nó
  rationale: Thuật ngữ giải phẫu trực tiếp; đại từ chỉ lại con vật hiến tế.
- source_word: פִּדְרוֹ
  choice: mỡ của nó
  rationale: פדר chỉ mô mỡ hoặc lớp mỡ gắn với con vật hiến tế. “Mỡ” là cách diễn đạt rõ ràng, hiện đại; chú thích ghi nhận nghĩa cụ thể hơn có thể có.
- source_word: וְעָרַךְ
  choice: phải xếp
  rationale: Trong ngữ cảnh tế lễ, ערך có nghĩa là sắp/xếp theo trật tự. “Xếp” tự nhiên và vẫn diễn đạt hành động nghi thức có chủ ý.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi phổ thông, trang trọng và dễ hiểu đối với כהן trong luật tế lễ.
- source_word: אֹתָם
  choice: tất cả
  rationale: 'Chỉ chung các phần vừa nêu: những phần thịt, đầu và mỡ. “Tất cả” tránh đại từ số nhiều thiếu tự nhiên trong tiếng Việt mà vẫn giữ đủ phạm vi quy chiếu.'
- source_word: עַל הָעֵצִים
  choice: trên củi
  rationale: Danh từ số nhiều tiếng Hê-bơ-rơ được diễn đạt tự nhiên bằng danh từ tập hợp “củi” trong tiếng Việt.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: đang ở trên lửa, là lửa trên bàn thờ
  rationale: 'Giữ chuỗi mô tả không gian của nguyên văn: củi ở trên lửa và lửa ở trên bàn thờ, đồng thời làm rõ quan hệ quy chiếu trong tiếng Việt.'
