revisions:
- from: Thầy tế lễ phải đem con chim đến bàn thờ, ngắt đầu nó[a] và đốt trên bàn thờ cho bốc khói; máu nó phải được vắt cho chảy ra trên thành bàn thờ.[b]
  to: Thầy tế lễ phải đem con chim đến bàn thờ, bấm đứt đầu nó[a] và đốt nó trên bàn thờ cho bốc khói; máu nó phải được ép ra trên thành bàn thờ.[b]
  rationale: Bản sửa làm rõ đối tượng của hành động đốt, cải thiện cách diễn đạt bị động về máu bị ép ra, và chọn cách nói tự nhiên hơn cho thuật ngữ nghi lễ מָלַק. Các sửa đổi vẫn giữ nguyên trình tự, mức độ cụ thể và sắc thái luật lệ của tiếng Hê-bơ-rơ; chú thích bảo tồn phương án dịch từ vựng có thể tranh luận.
