base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: vi
  text: Thầy tế lễ phải đem con chim đến bàn thờ, bấm đứt đầu nó[a] và đốt nó trên bàn thờ cho bốc khói; máu nó phải được ép ra trên thành bàn thờ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ ở đây là một thuật ngữ chuyên môn chỉ thao tác thầy tế lễ giết chim hiến tế bằng cách xử lý phần đầu; cũng có thể dịch là “vặn đứt đầu nó”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch sát nghĩa là “trên vách của bàn thờ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: phải đem con chim đến
  rationale: Dạng Hiphil của קרב diễn tả việc đem lại gần hoặc trình dâng. Vì ngay sau đó có אֶל הַמִּזְבֵּחַ, cách dịch này giữ rõ chuyển động cụ thể đến bàn thờ; thêm “con chim” thay cho đại từ giúp câu tiếng Việt tự nhiên và đúng đối tượng trong ngữ cảnh.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Thuật ngữ tiếng Việt thông dụng, trang trọng cho chức vụ tư tế trong luật tế lễ của Lê-vi.
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: ngắt đầu nó
  rationale: מלק là động từ chuyên môn chỉ thao tác thầy tế lễ giết chim hiến tế tại phần đầu. “Ngắt đầu” cụ thể, dễ hiểu mà không xác định quá mức thao tác là vặn hay bẻ.
- source_word: וְהִקְטִיר
  choice: đốt ... cho bốc khói
  rationale: Trong văn cảnh hiến tế, קטר không chỉ nói chung về đốt mà nhấn mạnh việc đốt lễ vật trên bàn thờ để nó bốc khói. Cách dịch này giữ sắc thái nghi lễ của động từ.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Dạng có hậu tố chỉ hướng được hiểu theo thành ngữ nghi lễ là hành động diễn ra tại hoặc trên bàn thờ; “trên bàn thờ” phù hợp với việc đốt lễ vật.
- source_word: וְנִמְצָה דָמוֹ
  choice: máu nó phải được vắt cho chảy ra
  rationale: Dạng Niphal của מצה giữ sắc thái bị động và chỉ việc máu được ép hoặc vắt ra. “Được vắt cho chảy ra” diễn đạt cả thao tác lẫn kết quả một cách tự nhiên.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: trên thành bàn thờ
  rationale: קִיר nghĩa đen là vách hoặc tường; với bàn thờ, “thành bàn thờ” tự nhiên hơn “tường bàn thờ” mà vẫn giữ hình ảnh phần mặt đứng bên ngoài, thay vì làm mờ thành từ chung chung “bên”.
