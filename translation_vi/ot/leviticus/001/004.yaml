revisions:
- from: Người ấy phải đặt tay mình trên đầu con vật làm lễ thiêu, và lễ vật đó sẽ được chấp nhận cho người ấy[a], để chuộc tội thay cho người ấy.
  to: Người ấy sẽ đặt tay mình trên đầu con vật làm lễ vật toàn thiêu, và lễ vật ấy sẽ được chấp nhận cho người ấy[a], để chuộc tội cho người ấy.
  rationale: Sửa lực tình thái của động từ, chuẩn hóa cách gọi עֹלָה là “lễ vật toàn thiêu”, và thay “thay cho” bằng “cho” để không diễn giải quá mức giới từ trong cụm chỉ sự chuộc tội. Bản chính vẫn theo cách hiểu trong vệt kiểm tra tiếng Anh rằng lễ vật được chấp nhận; chú thích giữ cách hiểu thay thế rằng người dâng lễ được chấp nhận.
