  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: vi
  text: Người ấy sẽ đặt tay mình trên đầu con vật làm lễ vật toàn thiêu, và lễ vật ấy sẽ được chấp nhận cho người ấy[a], để chuộc tội cho người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và người ấy sẽ được chấp nhận.” Động từ bị động trong tiếng Hê-bơ-rơ có thể được hiểu là quy trực tiếp sự được chấp nhận về người dâng lễ, thay vì về lễ vật.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Người ấy phải đặt tay mình
  rationale: Động từ סמך trong nghi thức hiến tế chỉ hành động đặt hoặc tì tay lên con vật. “Đặt tay” tự nhiên trong tiếng Việt và không xác định quá mức lực tác động; giữ số ít của יָדוֹ.
- source_word: עַל רֹאשׁ הָעֹלָה
  choice: trên đầu con vật làm lễ thiêu
  rationale: Diễn đạt rõ cử chỉ thể chất và dùng “lễ thiêu” cho עֹלָה, tức lễ vật được thiêu trọn; thêm “con vật làm” để câu tiếng Việt tự nhiên và làm rõ đối tượng có đầu.
- source_word: וְנִרְצָה
  choice: lễ vật đó sẽ được chấp nhận
  rationale: Giữ thể bị động và ý nghĩa được tiếp nhận thuận lợi trong bối cảnh hiến tế. Danh ngữ “lễ vật đó” giúp tiếng Việt có chủ ngữ rõ ràng, trong khi cách hiểu quy trực tiếp sự chấp nhận cho người dâng được giữ ở chú thích.
- source_word: לוֹ
  choice: cho người ấy
  rationale: Giữ nghĩa lợi ích hoặc đại diện của giới từ לְ mà không thu hẹp quan hệ thần học.
- source_word: לְכַפֵּר עָלָיו
  choice: để chuộc tội thay cho người ấy
  rationale: “Chuộc tội” giữ trọng lượng nghi lễ–thần học của כפר; “thay cho người ấy” diễn đạt chức năng đại diện của עַל trong văn cảnh hiến tế và tránh lặp vụng “cho người ấy”.
theological_decisions:
- issue: Đối tượng được chấp nhận trong וְנִרְצָה
  choice: lễ vật được chấp nhận
  alternative: người dâng lễ được chấp nhận
  rationale: Văn cảnh nghi lễ liên kết việc đặt tay, sự chấp nhận và việc chuộc tội, nên bản chính diễn đạt lễ vật được chấp nhận vì lợi ích của người dâng. Tuy nhiên, động từ Hê-bơ-rơ ở giống đực số ít trong khi עֹלָה là danh từ giống cái, và cấu trúc bị động cũng có thể được hiểu là nói trực tiếp về người dâng; vì vậy cách hiểu ấy được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “người ấy” để giữ chủ thể số ít không được nêu tên; dùng “lễ thiêu” và “chuộc tội” như các thuật ngữ nghi lễ rõ nghĩa, không gắn với một hệ phái riêng.
