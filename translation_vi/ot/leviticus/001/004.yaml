review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng hành động đặt tay, sự được chấp nhận và mục đích chuộc tội. Tuy nhiên, “phải” dễ chuyển lời mô tả thủ tục trong tiếng Hê-bơ-rơ thành một mệnh lệnh bắt buộc. Cụm “thay cho người ấy” diễn giải עָלָיו theo hướng thay thế mạnh hơn điều văn nói; “cho người ấy” giữ quan hệ lợi ích/đại diện rộng hơn.
  naturalness: “Con vật làm lễ thiêu” hơi gượng trong tiếng Việt hiện đại. “Con vật làm lễ vật toàn thiêu” xác định tự nhiên hơn con vật là lễ vật được dâng. “Sẽ đặt” phù hợp văn phong quy định nghi lễ mà không thêm sắc thái bắt buộc.
  terminology: Dùng “lễ vật toàn thiêu” cho עֹלָה là thuật ngữ nghi lễ rõ ràng và chuẩn hơn “lễ thiêu”. Giữ “chuộc tội” cho כפר. Chú thích cần tiếp tục bảo tồn cách hiểu khác về chủ thể của động từ bị động, không quyết định thay cho bản văn.
  issues:
  - severity: medium
    issue: “phải đặt” thêm sắc thái mệnh lệnh/bắt buộc.
    rationale: וְסָמַךְ trong câu quy định nghi lễ này được diễn đạt an toàn hơn là “sẽ đặt”, tương ứng với lối dịch “shall lay” và không làm thay đổi lực tình thái của câu.
  - severity: medium
    issue: “thay cho người ấy” diễn giải quá cụ thể quan hệ của עָלָיו.
    rationale: Trong kết cấu לְכַפֵּר עַל, giới từ chỉ người được hưởng việc chuộc tội; “cho người ấy” bảo toàn ý nghĩa mà không áp đặt một mô hình thay thế.
  - severity: low
    issue: “con vật làm lễ thiêu” chưa tự nhiên và thuật ngữ chưa đủ xác định.
    rationale: “Con vật làm lễ vật toàn thiêu” diễn đạt rõ đây là con vật được dâng làm עֹלָה, đồng thời dùng thuật ngữ nghi lễ quen thuộc.
