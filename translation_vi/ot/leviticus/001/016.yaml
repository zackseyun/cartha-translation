revisions:
- from: Người phải lấy diều[a] cùng với lông của nó[b] ra, rồi ném sang bên bàn thờ, về phía đông, tại chỗ để tro.
  to: Người ấy phải lấy diều[a] cùng với lông của nó[b] ra, rồi ném nó cạnh bàn thờ, về phía đông, vào chỗ để tro.
  rationale: Chỉ điều chỉnh cách diễn đạt các quan hệ không gian và hướng chuyển động để phản ánh sát hơn אֵצֶל (“cạnh”) và אֶל (“vào/đến”), không thay đổi nghĩa nghi lễ hay cách xử lý chỗ văn bản khó về “lông.”
