base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: vi
  text: Người ấy phải lấy diều[a] cùng với lông của nó[b] ra, rồi ném nó cạnh bàn thờ, về phía đông, vào chỗ để tro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Diều” là phần phình ra trong thực quản của chim, nơi tạm chứa thức ăn; cũng có thể gọi là “bầu diều.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “cùng với lông của nó.” Cụm từ này khó hiểu; một số bản dịch hiểu là “cùng với chất bẩn trong đó.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: phải lấy ... ra
  rationale: Dạng Hiphil của סור diễn tả việc làm cho một vật được loại bỏ. “Lấy ... ra” tự nhiên trong tiếng Việt và giữ được tính chất chỉ dẫn của nghi thức.
- source_word: מֻרְאָתוֹ
  choice: diều của nó
  rationale: Trong ngữ cảnh hiến tế chim, từ này chỉ diều, tức bộ phận phình ra của thực quản dùng để chứa thức ăn. “Diều” là thuật ngữ giải phẫu thông dụng và chính xác trong tiếng Việt.
- source_word: בְּנֹצָתָהּ
  choice: cùng với lông của nó
  rationale: Cụm từ khó này theo nghĩa trực tiếp của נוצה chỉ lông hoặc bộ lông chim. Bản dịch giữ nghĩa hiển nhiên theo văn bản phụ âm, đồng thời ghi chú cách hiểu khác liên quan đến chất bẩn hay thức ăn trong diều.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: rồi ném
  rationale: Dạng Hiphil của שלך thường có nghĩa là ném hoặc quăng. “Ném” trực tiếp, tự nhiên và phù hợp với chỉ dẫn nghi lễ.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: sang bên bàn thờ
  rationale: אצל chỉ vị trí ở cạnh hoặc bên một vật. “Bên bàn thờ” diễn đạt rõ quan hệ không gian này.
- source_word: קֵדְמָה
  choice: về phía đông
  rationale: Trạng từ chỉ hướng xác định phía đông của bàn thờ; “về phía đông” giữ được sắc thái định hướng mà không giải thích quá mức.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: tại chỗ để tro
  rationale: דשן trong ngữ cảnh tế lễ chỉ tro, có thể là tro lẫn chất béo từ bàn thờ. “Chỗ để tro” rõ nghĩa và không đặc tả quá điều tiếng Hê-bơ-rơ nói.
