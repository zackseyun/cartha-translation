  source_fidelity: 'Bản dịch truyền đạt đầy đủ trình tự và các thành tố của tiếng Hê-bơ-rơ: người dâng rửa bộ lòng và chân bằng nước; thầy tế lễ dâng toàn bộ rồi đốt cho bốc khói trên bàn thờ; lễ vật được xác định là lễ thiêu, lễ vật dâng bằng lửa, và hương thơm đẹp lòng Đức Giê-hô-va. “Đốt cho bốc khói” phân biệt thích đáng động từ nghi lễ וְהִקְטִיר với hành động dâng ở trước. Cách giữ danh riêng “Đức Giê-hô-va” phản ánh לַיהוָה.'
  naturalness: Văn phong hiện đại, trang trọng và tự nhiên. “Bộ lòng,” “các chân,” “bằng nước,” “thầy tế lễ,” và “trên bàn thờ” đều rõ nghĩa trong văn cảnh nghi lễ. Cấu trúc “có hương thơm đẹp lòng Đức Giê-hô-va” diễn đạt tự nhiên thành ngữ רֵיחַ נִיחֹחַ mà vẫn giữ hình ảnh của nguyên văn.
  terminology: “Lễ thiêu” là thuật ngữ ổn định cho עֹלָה. “Lễ vật dâng bằng lửa” là cách dịch thận trọng và sát ngữ cảnh cho אִשֵּׁה; chú thích bảo lưu khả năng hiểu liên hệ với “thức ăn” mà không biến một cách giải thích còn tranh luận thành nội dung chính. Danh Đức Giê-hô-va được dùng nhất quán và phù hợp với quyết định dịch thuật đã nêu.
