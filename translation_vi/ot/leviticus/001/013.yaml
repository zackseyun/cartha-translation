id: LEV.1.13
reference: Leviticus 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Người ấy phải rửa bộ lòng và các chân bằng nước. Rồi thầy tế lễ phải dâng tất cả và đốt cho bốc khói trên bàn thờ. Đó là một lễ thiêu, một lễ vật dâng bằng lửa[a], có hương thơm đẹp lòng Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “một lễ vật làm thức ăn”.
    reason: Bảo lưu cách phân tích từ vựng khác của אִשֵּׁה, bên cạnh nghĩa truyền thống “lễ vật dâng bằng lửa”.
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: bộ lòng
  rationale: Trong nghi thức hiến tế, từ này chỉ các phần bên trong của con vật. “Bộ lòng” cụ thể, tự nhiên trong tiếng Việt và phù hợp ngữ cảnh.
- source_word: הַכְּרָעַיִם
  choice: các chân
  rationale: Chỉ chân, đặc biệt là phần chân dưới, của con vật hiến tế. “Các chân” rõ ràng và không thu hẹp nghĩa quá mức.
- source_word: יִרְחַץ בַּמָּיִם
  choice: phải rửa ... bằng nước
  rationale: Giữ nguyên nghĩa của động từ “rửa” và diễn đạt rõ phương tiện “bằng nước” có trong tiếng Hê-bơ-rơ.
- source_word: וְהִקְרִיב
  choice: phải dâng
  rationale: Thể Hiphil của קרב mang nghĩa đem đến gần hoặc trình dâng trong nghi lễ; “dâng” tự nhiên trong tiếng Việt và vẫn phân biệt với hành động đốt tiếp theo.
- source_word: אֶת־הַכֹּל
  choice: tất cả
  rationale: Diễn đạt tính toàn bộ của những phần đã chuẩn bị mà thầy tế lễ đem dâng.
- source_word: וְהִקְטִיר
  choice: đốt cho bốc khói
  rationale: Động từ hiến tế này cụ thể hơn “đốt”, nhấn mạnh việc làm cho lễ vật bốc lên thành khói trên bàn thờ.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Cách diễn đạt tự nhiên, chính xác về địa điểm thực hiện nghi thức.
- source_word: עֹלָה
  choice: một lễ thiêu
  rationale: Thuật ngữ tiếng Việt quen thuộc cho loại sinh tế được thiêu toàn bộ trên bàn thờ, đồng thời phản ánh ý niệm vật dâng đi lên.
- source_word: אִשֵּׁה
  choice: một lễ vật dâng bằng lửa
  rationale: Giữ rõ mối liên hệ từ vựng với lửa trong thuật ngữ hiến tế này; cách hiểu “lễ vật làm thức ăn” được ghi ở chú thích vì là một khả năng khác.
- source_word: רֵיחַ נִיחֹחַ
  choice: có hương thơm đẹp lòng
  rationale: Giữ hình ảnh khứu giác của nguyên văn đồng thời diễn đạt tự nhiên ý nghĩa lễ vật được chấp nhận và làm đẹp lòng Đức Chúa Trời.
- source_word: לַיהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng יהוה bằng dạng phiên âm đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Ngôn ngữ nhân hình trong רֵיחַ נִיחֹחַ
  choice: có hương thơm đẹp lòng
  alternative: có mùi thơm làm nguôi lòng
  rationale: Bản dịch giữ ẩn dụ cảm giác và ý nghĩa Đức Chúa Trời chấp nhận lễ vật, nhưng không diễn giải thành một tuyên bố về cơ thể hay cho rằng cơn giận của Ngài nhất thiết được xoa dịu.
- issue: Ý nghĩa của אִשֵּׁה
  choice: một lễ vật dâng bằng lửa
  alternative: một lễ vật làm thức ăn
  rationale: “Dâng bằng lửa” bám sát hình thức và ngữ cảnh thiêu đốt của từ Hê-bơ-rơ. Cách hiểu liên quan đến thức ăn hiến tế vẫn được bảo lưu trong chú thích để không che khuất sự bất định từ vựng.
- issue: Danh יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời; bản dịch giữ chức năng danh riêng thay vì âm thầm thay bằng tước hiệu, đồng thời dùng dạng tiếng Việt quen thuộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để giữ đại từ số ít trong nguyên văn mà không bổ sung một chủ thể cụ thể hơn từ ngữ cảnh; dùng thuật ngữ nghi lễ quen thuộc như “thầy tế lễ”, “bàn thờ” và “lễ thiêu”.
