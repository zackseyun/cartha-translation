base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/005.yaml
  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: vi
  text: Vậy, họ đến gần và khiêng họ trong áo của họ ra ngoài trại[a], đúng như Môi-se đã nói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng áo của họ.” Giới từ Hê-bơ-rơ ở đây có thể chỉ phương tiện; nghĩa là họ nắm hoặc dùng áo để khiêng các thi thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: họ đến gần
  rationale: Động từ קרב ở thể qal diễn tả việc tiến đến gần thi thể theo mệnh lệnh ở câu trước; cách dịch này giữ nghĩa chuyển động mà không thêm sắc thái nghi lễ.
- source_word: וַיִּשָּׂאֻם
  choice: khiêng hai người
  rationale: נשׂא với hậu tố số nhiều chỉ Na-đáp và A-bi-hu. Trong ngữ cảnh đưa thi thể đi, “khiêng” tự nhiên và chính xác hơn “nâng” hoặc “mang”; “hai người” làm rõ đối tượng đã được xác định trong văn cảnh.
- source_word: בְּכֻתֳּנֹתָם
  choice: vẫn mặc áo dài
  rationale: כֻּתֹּנֶת chỉ loại áo dài mặc sát thân hoặc áo lễ dài. Giới từ ב có thể chỉ hoàn cảnh (“trong áo của họ”) hoặc phương tiện (“bằng/nắm áo của họ”); bản chính diễn đạt cách hiểu hoàn cảnh tự nhiên trong tiếng Việt, còn chú thích giữ cách hiểu phương tiện.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ra bên ngoài trại
  rationale: Cụm אֶל מִחוּץ biểu thị chuyển động đến một nơi ở ngoài trại; “ra bên ngoài trại” chuyển tải rõ hướng đi bằng tiếng Việt tự nhiên.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: đúng như Môi-se đã truyền
  rationale: דבר theo nghĩa đen là “nói”, nhưng trong văn cảnh lời nói trước đó là một mệnh lệnh; “đã truyền” diễn đạt chức năng ấy rõ ràng, còn “đúng như” giữ lực so sánh của כַּאֲשֶׁר.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Áo dài” được dùng theo nghĩa áo choàng dài thời cổ, không nhằm chỉ riêng áo dài truyền thống Việt Nam. Dấu chú thích [a] được đặt ngay sau cụm từ có cách hiểu khác.
