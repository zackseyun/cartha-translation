    rationale: Nguyên ngữ chỉ nói họ được khiêng “trong/bằng áo của họ”; không khẳng định trực tiếp rằng họ “vẫn mặc” áo, và không cần xác định kiểu áo là “áo dài.”
  - severity: low
    issue: “Môi-se đã truyền” diễn giải דִּבֶּר là một mệnh lệnh.
    rationale: Trong ngữ cảnh Môi-se quả có lời chỉ dẫn trước đó, nhưng động từ nguyên văn là “đã nói.” Nên giữ cách dịch ít diễn giải hơn.
