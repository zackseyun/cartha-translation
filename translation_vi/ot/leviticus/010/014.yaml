revisions:
- from: Các con hãy ăn phần ức của lễ vật đưa qua đưa lại[a] và phần đùi của lễ vật dâng lên[b] tại một nơi thanh sạch—con cùng các con trai và con gái của con—vì đó là phần đã được ban cho con và các con trai của con từ những lễ vật bình an[c] của con cái Y-sơ-ra-ên.
  to: Ngươi cùng các con trai và con gái của ngươi hãy ăn phần ức của lễ vật đưa qua đưa lại[a] và phần đùi của lễ vật dâng lên[b] tại một nơi thanh sạch, vì đó là phần đã được ban cho ngươi và các con trai ngươi từ những lễ vật bình an[c] của con cái Y-sơ-ra-ên.
  rationale: Sửa duy nhất cần thiết là phục hồi chủ ngữ số ít và đặt nhóm “ngươi cùng các con trai và con gái của ngươi” ở vị trí tự nhiên trước mệnh lệnh. Bản sửa bảo toàn thứ tự ý nghĩa, tính bao gồm rõ ràng của con trai và con gái trong quyền ăn phần lễ, đồng thời giữ nguyên các thuật ngữ tế tự và các chú thích từ vựng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:45:24Z'
