source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: vi
  text: Ngươi cùng các con trai và con gái của ngươi hãy ăn phần ức của lễ vật đưa qua đưa lại[a] và phần đùi của lễ vật dâng lên[b] tại một nơi thanh sạch, vì đó là phần đã được ban cho ngươi và các con trai ngươi từ những lễ vật bình an[c] của con cái Y-sơ-ra-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phần ức của lễ vật trình dâng.” Từ Hê-bơ-rơ chỉ phần lễ vật được đưa qua đưa lại theo nghi thức trước mặt Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phần đùi của lễ vật biệt riêng.” Từ Hê-bơ-rơ nói đến vật được nhấc lên hoặc dành riêng làm phần thuộc về tư tế.'
    reason: lexical_alternative
  - marker: c
    text: “Lễ vật bình an” cũng có thể được dịch là “lễ vật thông công,” nhưng từ Hê-bơ-rơ còn gợi ý nghĩa rộng hơn về sự bình an, toàn vẹn hoặc an lành.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: phần ức của lễ vật đưa qua đưa lại
  rationale: חֲזֶה chỉ phần ức/ngực của con vật; תְּנוּפָה chỉ nghi thức đưa lễ vật qua đưa lại trước Đức Chúa Trời. Cách dịch này giữ hình ảnh nghi lễ mà vẫn dễ hiểu.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: phần đùi của lễ vật dâng lên
  rationale: שׁוֹק là phần đùi/chân; תְּרוּמָה là vật được nhấc lên, biệt riêng hoặc đóng góp làm phần dành cho tư tế. “Lễ vật dâng lên” giữ được động tác nghi lễ và tính chất được biệt riêng.
- source_word: תֹּאכְלוּ
  choice: hãy ăn
  rationale: Dạng vị hoàn thành chưa hoàn tất ở đây có lực chỉ thị trong văn bản luật lệ; “hãy ăn” diễn đạt mệnh lệnh tự nhiên trong tiếng Việt.
- source_word: בְּמָקוֹם טָהוֹר
  choice: tại một nơi thanh sạch
  rationale: טָהוֹר trong ngữ cảnh Lê-vi liên quan đến sự thanh sạch theo nghi lễ. “Thanh sạch” giữ sắc thái này mà không giải thích quá mức.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: con cùng các con trai và con gái của con
  rationale: Giữ rõ cả con trai lẫn con gái như nguyên văn và diễn đạt אִתָּךְ bằng “cùng” cho tự nhiên.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: phần đã được ban cho con và các con trai của con
  rationale: חֹק ở đây chỉ phần được quy định hoặc cấp cho tư tế, không chủ yếu có nghĩa là một điều luật.
- source_word: נִתְּנוּ
  choice: đã được ban
  rationale: Thể bị động hoàn thành diễn tả một sự cấp ban đã được thiết lập và vẫn có hiệu lực.
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: từ những lễ vật bình an
  rationale: זִבְחֵי שַׁלְמֵי chỉ các sinh tế thuộc loại lễ bình an; cách dịch gọn này tránh lối nói nặng nề “các sinh tế của lễ vật” và giữ trường nghĩa bình an, toàn vẹn, an lành.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Đây là thành ngữ tập thể chỉ dân Y-sơ-ra-ên. “Con cái Y-sơ-ra-ên” vừa giữ hình thức huyết thống của tiếng Hê-bơ-rơ vừa là cách nói Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công
  rationale: “Bình an” giữ trường nghĩa rộng của từ Hê-bơ-rơ, gồm bình an, toàn vẹn và an lành; “thông công” có thể thu hẹp nghĩa theo một cách giải thích riêng.
- issue: Cách dịch danh xưng tập thể בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: Lựa chọn chính giữ hình ảnh con cháu trong nguyên văn, đồng thời trong ngữ cảnh vẫn chỉ toàn thể cộng đồng giao ước chứ không chỉ nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “con/các con” phù hợp với lời Môi-se nói trực tiếp với A-rôn và gia đình ông. Câu được sắp xếp lại nhẹ để mệnh lệnh rõ ràng trong tiếng Việt, nhưng vẫn giữ đủ các thành phần của nguyên văn.
