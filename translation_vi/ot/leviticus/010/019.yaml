  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: vi
  text: 'A-rôn nói với Môi-se: “Này, hôm nay họ đã dâng lễ vật chuộc tội[a] và lễ thiêu của mình trước mặt Đức Giê-hô-va; và những việc như thế đã xảy đến với tôi.[b] Nếu hôm nay tôi ăn lễ vật chuộc tội, liệu điều đó có tốt đẹp trước mắt Đức Giê-hô-va không?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy” (ở cả hai chỗ trong câu). Từ Hê-bơ-rơ חַטָּאת có thể chỉ tội lỗi hoặc sinh tế liên quan đến việc thanh tẩy khỏi tội lỗi hay sự ô uế; trong Lê-vi Ký, “lễ vật chuộc tội” là cách dịch quen dùng.
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “những việc như thế này đã xảy đến với tôi.” A-rôn nhắc đến những tai họa trong ngày ấy, đặc biệt là cái chết của các con ông.'
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “liệu điều đó có làm đẹp lòng Đức Giê-hô-va không?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Này
  rationale: Tiểu từ thu hút sự chú ý và mở đầu lời giải thích của A-rôn; “Này” trang trọng, tự nhiên hơn “Kìa” trong ngữ cảnh đối thoại này.
- source_word: הִקְרִיבוּ
  choice: đã dâng
  rationale: Dạng Hiphil của קרב mang nghĩa tế tự là đem đến hoặc dâng lễ vật; “dâng” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: חַטָּאתָם / חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ của Lê-vi Ký, חַטָּאת chỉ sinh tế chứ không phải khái niệm tội lỗi trừu tượng. Cách dịch này quen thuộc, đồng thời chú thích giữ lại khả năng hiểu là “lễ vật thanh tẩy”.
- source_word: עֹלָתָם
  choice: lễ thiêu
  rationale: Thuật ngữ tế lễ chỉ lễ vật được thiêu trên bàn thờ; “lễ thiêu” ngắn gọn và đã thành cách gọi thông dụng.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: Giữ hình ảnh không gian của thành ngữ Hê-bơ-rơ, tức là dâng trong sự hiện diện của Đức Chúa Trời.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: thế mà những việc như thế này lại xảy đến với tôi
  rationale: Diễn đạt tự nhiên ý những biến cố đau thương đã xảy đến với A-rôn, nhưng không giải thích ngay trong câu rằng đó chính là cái chết của các con ông.
- source_word: וְאָכַלְתִּי
  choice: Nếu ... tôi ăn
  rationale: Waw cộng qatal nằm trong câu hỏi tu từ và có lực điều kiện phản thực theo ngữ cảnh; tiếng Việt thể hiện tự nhiên bằng “Nếu ...” mà không cần áp đặt thêm sắc thái thời quá khứ.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: liệu điều đó có tốt đẹp trước mắt Đức Giê-hô-va không
  rationale: Giữ thành ngữ “tốt đẹp trước mắt” và dạng câu hỏi tu từ về sự chấp thuận của Đức Chúa Trời, thay vì diễn giải thẳng thành “có làm đẹp lòng”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời vốn rõ nghĩa và quen thuộc trong tiếng Việt, thay vì thay danh này bằng một tước hiệu.
theological_decisions:
- issue: Cơ sở cho lời biện giải của A-rôn về việc không ăn lễ vật
  choice: Giữ câu hỏi tu từ nối trực tiếp những tai họa trong ngày với việc ăn lễ vật, cho thấy A-rôn nghi ngờ hành động ấy có được Đức Giê-hô-va chấp thuận hay không.
  alternative: Giải thích rõ rằng A-rôn bị mất tư cách nghi lễ do tang chế, hoặc rằng ông chỉ đang bày tỏ nỗi đau cá nhân.
  rationale: Bản Hê-bơ-rơ không xác định vấn đề nằm ở tình trạng nghi lễ, tang chế hay sự thích đáng nói chung; bản dịch vì thế giữ nguyên sự căng thẳng và không áp đặt một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu hỏi tu từ cùng thành ngữ “trước mắt” được giữ để phản ánh sát sắc thái Hê-bơ-rơ; các chú thích được đặt ngay sau phần văn bản liên quan.
