- from: 'A-rôn nói với Môi-se: “Này, hôm nay họ đã dâng lễ vật chuộc tội[a] và lễ thiêu của mình trước mặt Đức Giê-hô-va; thế mà những việc như thế này lại xảy đến với tôi.[b] Nếu hôm nay tôi ăn lễ vật chuộc tội, liệu điều đó có tốt đẹp trước mắt Đức Giê-hô-va không?”[c]'
  to: 'A-rôn nói với Môi-se: “Này, hôm nay họ đã dâng lễ vật chuộc tội[a] và lễ thiêu của mình trước mặt Đức Giê-hô-va; và những việc như thế đã xảy đến với tôi.[b] Nếu hôm nay tôi ăn lễ vật chuộc tội, liệu điều đó có tốt đẹp trước mắt Đức Giê-hô-va không?”[c]'
  rationale: Chỉ thay “thế mà” bằng “và” và giản lược “như thế này” thành “như thế” để tránh thêm quan hệ đối lập vào nguyên văn, đồng thời vẫn giữ lời A-rôn liên kết các biến cố đau thương trong ngày với câu hỏi tu từ về việc ăn lễ vật. Các thuật ngữ, tên riêng, độ mơ hồ diễn giải và hệ thống chú thích được giữ nguyên.
