revisions:
- from: 'Môi-se nói với A-rôn và với hai con trai ông là Ê-lê-a-sa và Y-tha-ma: “Các ông không được để tóc xõa rối[a], cũng không được xé áo mình, kẻo các ông phải chết và Ngài nổi giận với toàn thể hội chúng. Nhưng anh em của các ông, tức toàn thể nhà Y-sơ-ra-ên, hãy than khóc về vụ thiêu đốt mà Yahweh đã gây ra[b].”'
  to: 'Môi-se nói với A-rôn và với hai con trai ông là Ê-lê-a-sa và Y-tha-ma: “Các ông không được để tóc xõa[a], cũng không được xé áo mình, kẻo các ông phải chết và Ngài nổi giận với toàn thể hội chúng. Nhưng anh em của các ông, tức toàn thể nhà Y-sơ-ra-ên, sẽ than khóc về sự thiêu đốt mà Yahweh đã gây nên[b].”'
  rationale: Đổi “hãy than khóc” thành “sẽ than khóc” để phản ánh đúng hình thức trần thuật của động từ Hê-bơ-rơ. Lược “rối” để không thêm sắc thái ngoài nguyên văn. Các phần khác được giữ vì trung thành với nguồn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:45:15Z'
