  naturalness: Văn phong trang trọng, hiện đại và các tên riêng nhất quán. “Để tóc xõa” tự nhiên hơn “để tóc xõa rối” mà vẫn giữ đúng dấu hiệu tang chế trong nguyên văn.
  terminology: Giữ “Yahweh” theo quyết định đã nêu. “Hội chúng,” “nhà Y-sơ-ra-ên,” và “than khóc” đều phù hợp. “Sự thiêu đốt” giữ được danh từ đồng gốc của tiếng Hê-bơ-rơ tốt hơn cách diễn giải thành một tai họa hay sự phán xét.
