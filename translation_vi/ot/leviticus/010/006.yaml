source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל אַהֲרֹ֡ן וּ/לְ/אֶלְעָזָר֩ וּ/לְ/אִֽיתָמָ֨ר בָּנָ֜י/ו רָֽאשֵׁי/כֶ֥ם אַל תִּפְרָ֣עוּ וּ/בִגְדֵי/כֶ֤ם לֹֽא תִפְרֹ֨מוּ֙ וְ/לֹ֣א תָמֻ֔תוּ וְ/עַ֥ל כָּל הָ/עֵדָ֖ה יִקְצֹ֑ף וַ/אֲחֵי/כֶם֙ כָּל בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת הַ/שְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהוָֽה־׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: vi
  text: 'Môi-se nói với A-rôn và với hai con trai ông là Ê-lê-a-sa và Y-tha-ma: “Các ông không được để tóc xõa[a], cũng không được xé áo mình, kẻo các ông phải chết và Ngài nổi giận với toàn thể hội chúng. Nhưng anh em của các ông, tức toàn thể nhà Y-sơ-ra-ên, sẽ than khóc về sự thiêu đốt mà Yahweh đã gây nên[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được để đầu trần.” Cụm từ Hê-bơ-rơ nói đến một dấu hiệu tang chế liên quan đến đầu hoặc tóc.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “sự thiêu đốt mà Yahweh đã thiêu đốt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: không được để tóc xõa rối
  rationale: Động từ פרע ở đây nói đến việc để tóc buông xõa, không sửa sang như một dấu hiệu tang chế. Cách dịch này diễn đạt hành động liên quan đến tóc mà không mặc nhiên xác định đó là tháo khăn che đầu.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: cũng không được xé áo mình
  rationale: פרם chỉ việc xé áo, đặc biệt như một cử chỉ than tang; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: וְלֹא תָמֻתוּ
  choice: kẻo các ông phải chết
  rationale: ‘Kẻo’ giữ được sắc thái cảnh báo về hậu quả của hai lệnh cấm đứng trước.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: và Ngài nổi giận với toàn thể hội chúng
  rationale: Động từ ở ngôi thứ ba số ít, còn chủ thể không được nêu trực tiếp. Trong ngữ cảnh, Yahweh là chủ thể được hàm ý; đại từ ‘Ngài’ giúp câu tiếng Việt rõ nghĩa nhưng vẫn không lặp lại danh Yahweh.
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: anh em của các ông, tức toàn thể nhà Y-sơ-ra-ên
  rationale: Giữ hình ảnh thân tộc ‘anh em’ và thành ngữ cộng đồng giao ước ‘toàn thể nhà Y-sơ-ra-ên’; ‘tức’ làm rõ quan hệ đồng vị.
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: hãy than khóc về vụ thiêu đốt
  rationale: ‘Than khóc’ thể hiện việc công khai để tang; ‘vụ thiêu đốt’ giữ hình ảnh cụ thể của שְׂרֵפָה mà không diễn giải thành ‘tai họa’ hay ‘sự phán xét’.
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: mà Yahweh đã gây ra
  rationale: Cách nói này tránh lặp vụng ‘vụ thiêu đốt mà Yahweh đã thiêu đốt’, đồng thời vẫn quy hành động trực tiếp cho Yahweh. Nghĩa sát chữ được ghi trong chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Chủ thể không được nói rõ của יִקְצֹף
  choice: Ngài nổi giận với toàn thể hội chúng
  alternative: cơn thịnh nộ giáng trên toàn thể hội chúng
  rationale: Bản Hê-bơ-rơ dùng động từ số ít nhưng không nêu chủ thể. Ngữ cảnh hàm ý Yahweh; ‘Ngài’ giữ tính ngôi vị của hành động, còn viết hoa giúp đại từ quy chiếu rõ ràng. Chú thích bảo tồn sự không minh thị của nguyên văn.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng danh giao ước, vì vậy bản dịch giữ danh riêng thay vì thay bằng tước hiệu.
- issue: Bản chất của việc than khóc
  choice: toàn thể nhà Y-sơ-ra-ên được phép và được truyền phải than khóc, trong khi A-rôn cùng các con không được thực hiện các dấu hiệu tang chế được nêu
  alternative: diễn giải lệnh này như một sự cấm đoán mọi cảm xúc đau buồn của các thầy tế lễ
  rationale: Câu chỉ cấm hai dấu hiệu tang chế cụ thể là để tóc xõa rối và xé áo; không nên mở rộng thành lời cấm mọi nỗi đau buồn nội tâm.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng ‘các ông’ để nói chung với A-rôn và hai người con trưởng thành, tránh sắc thái trẻ nhỏ của ‘các con’. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt, riêng danh Yahweh được giữ nguyên dạng chuyển tự.
