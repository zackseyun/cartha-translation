id: LEV.10.20
reference: Leviticus 10:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּיטַ֖ב בְּ/עֵינָֽי/ו׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: vi
  text: Môi-se nghe vậy, và thấy điều đó là phải.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “điều đó là tốt trong mắt ông”; cũng có thể dịch: “điều đó đẹp lòng ông” hoặc “ông chấp thuận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe vậy
  rationale: Động từ שׁמע ở thể qal trước hết có nghĩa là “nghe”. Từ “vậy” nối tự nhiên với lời giải thích của A-rôn ở câu trước mà không diễn giải quá mức thành “hiểu” hay “đồng ý”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: וַיִּיטַב
  choice: thấy điều đó là phải
  rationale: יטב ở đây diễn tả sự đánh giá tích cực, rằng điều vừa nghe là đúng hoặc chấp nhận được. Cách dịch này tự nhiên trong tiếng Việt và không đẩy ý nghĩa xa đến mức khẳng định một sự chuẩn thuận chính thức.
- source_word: בְּעֵינָיו
  choice: thấy
  rationale: Thành ngữ Hê-bơ-rơ “trong mắt ông” diễn tả sự đánh giá theo quan điểm của Môi-se. Tiếng Việt tự nhiên dùng “thấy ... là phải”; nghĩa đen được giữ trong chú thích.
theological_decisions:
- issue: Mức độ đồng tình của Môi-se
  choice: thấy điều đó là phải
  alternative: chấp thuận
  rationale: Nguyên văn nói sự việc “tốt trong mắt ông”, hàm ý Môi-se nhận thấy lời giải thích là hợp lý hoặc chấp nhận được. Tránh “chấp thuận” để không biến hàm ý thành một hành vi phê chuẩn chính thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dịch ưu tiên lối nói tự nhiên của tiếng Việt, còn chú thích bảo tồn hình ảnh thành ngữ Hê-bơ-rơ và các sắc thái dịch khả hữu.
