  terminology: Tên riêng “Môi-se” nhất quán với lối phiên âm Kinh Thánh tiếng Việt. Chú thích nêu đúng nghĩa đen của thành ngữ và những khả năng diễn đạt như “đẹp lòng” hoặc “chấp thuận,” không áp đặt diễn giải thần học.
