- from: Na-đáp và A-bi-hu, các con trai của A-rôn, mỗi người lấy lư đựng than của mình, bỏ lửa vào đó, đặt hương lên trên, rồi dâng trước mặt Yahweh một thứ lửa không được phép[a], mà Ngài không truyền cho họ.
  to: Na-đáp và A-bi-hu, các con trai của A-rôn, mỗi người lấy lư đựng than của mình, cho lửa vào đó và đặt hương lên trên, rồi dâng trước mặt Yahweh một thứ lửa trái phép[a], là điều Ngài không truyền cho họ.
