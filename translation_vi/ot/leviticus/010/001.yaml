reference: Leviticus 10:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: vi
  text: Na-đáp và A-bi-hu, các con trai của A-rôn, mỗi người lấy lư đựng than của mình, cho lửa vào đó và đặt hương lên trên, rồi dâng trước mặt Yahweh một thứ lửa trái phép[a], là điều Ngài không truyền cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lửa lạ” hoặc “lửa ngoại lai”. Cụm từ Hê-bơ-rơ chỉ thứ lửa không được Yahweh cho phép, như mệnh đề tiếp theo giải thích.
    reason: Nêu các cách dịch sát mặt chữ của אֵשׁ זָרָה và bảo tồn sắc thái từ vựng.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: lấy
  rationale: Động từ kể chuyện thông dụng; “lấy” tự nhiên và phù hợp với chuỗi hành động trong câu.
- source_word: בְנֵי אַהֲרֹן
  choice: các con trai của A-rôn
  rationale: Giữ rõ quan hệ gia đình của cụm danh từ sở hữu trong tiếng Hê-bơ-rơ.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Na-đáp và A-bi-hu
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: mỗi người lấy lư đựng than của mình
  rationale: אִישׁ mang nghĩa phân phối “mỗi người”; מַחְתָּה là dụng cụ đựng hoặc mang than lửa, nên “lư đựng than” rõ hơn từ mang sắc thái chuyên biệt “bình hương”.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: bỏ lửa vào đó
  rationale: Diễn đạt tự nhiên hành động cho lửa hoặc than cháy vào từng chiếc lư; “đó” tiếp nối cách nói phân phối số ít “mỗi người… của mình”.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: đặt hương lên trên
  rationale: Giữ quan hệ không gian “trên” và dùng “hương” theo nghĩa chất thơm được đốt trong nghi lễ.
- source_word: וַיַּקְרִבוּ
  choice: dâng
  rationale: Dạng Hiphil của קרב trong bối cảnh tế lễ chỉ việc đem đến hoặc trình dâng; “dâng” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ chỉ sự hiện diện trong nghi lễ và phiên âm trực tiếp danh giao ước יְהוָה.
- source_word: אֵשׁ זָרָה
  choice: một thứ lửa không được phép
  rationale: Trong bối cảnh luật lệ thánh, זָרָה chỉ điều nằm ngoài phạm vi được chuẩn nhận; cách dịch này làm rõ tính trái phép mà mệnh đề kế tiếp giải thích, nhưng không suy đoán cụ thể nguồn lửa hay lỗi nghi lễ.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: mà Ngài không truyền cho họ
  rationale: Giữ nguyên mệnh đề quan hệ và tân ngữ “họ”, không thêm nội dung cụ thể mà bản Hê-bơ-rơ không nêu.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; “Yahweh” bảo tồn tên riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của אֵשׁ זָרָה
  choice: lửa không được phép
  alternative: lửa lạ / lửa ngoại lai
  rationale: Mệnh đề “mà Ngài không truyền cho họ” cho thấy trọng tâm là thiếu sự chuẩn nhận theo mệnh lệnh của Đức Chúa Trời. Bản dịch không xác định thêm bản chất hay nguồn gốc của lửa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc phân phối số ít “mỗi người… của mình… vào đó” để xử lý tự nhiên sự chuyển đổi số trong nguyên văn; đặt dấu chú thích ngay sau cụm từ mà chú thích giải nghĩa.
