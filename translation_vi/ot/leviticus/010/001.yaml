    rationale: “Lửa trái phép” diễn đạt gọn và tự nhiên hơn trong tiếng Việt, vẫn bảo toàn nghĩa ‘unauthorized’ và không xác định thêm loại hay nguồn lửa.
  - severity: low
    issue: Mệnh đề “mà Ngài không truyền cho họ” có thể hơi lửng về quan hệ cú pháp.
    rationale: Thêm “là điều” làm rõ đây là sự giải thích về thứ lửa được dâng, tương ứng với mệnh đề quan hệ tiếng Hê-bơ-rơ.
