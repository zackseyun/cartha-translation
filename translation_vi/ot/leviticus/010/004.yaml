  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל מִֽישָׁאֵל֙ וְ/אֶ֣ל אֶלְצָפָ֔ן בְּנֵ֥י עֻזִּיאֵ֖ל דֹּ֣ד אַהֲרֹ֑ן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם קִ֠רְב֞וּ שְׂא֤וּ אֶת אֲחֵי/כֶם֙ מֵ/אֵ֣ת פְּנֵי הַ/קֹּ֔דֶשׁ אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se gọi Mi-sa-ên và Ên-xa-phan, các con trai của U-xi-ên, chú/bác của A-rôn, rồi bảo họ: “Hãy đến gần, khiêng anh em của các ngươi[a] từ trước nơi thánh[b] ra ngoài trại.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “anh em” cũng có thể chỉ bà con nam gần gũi; ở đây Na-đáp và A-bi-hu là anh em họ của họ.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “khỏi trước mặt nơi thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: Trong mạch kể chuyện, קרא chỉ việc Môi-se gọi hai người đến; “gọi” tự nhiên và giữ được nghĩa trực tiếp.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: các con trai của U-xi-ên
  rationale: Cụm từ này trực tiếp xác định Mi-sa-ên và Ên-xa-phan là con trai của U-xi-ên, không chỉ là hậu duệ nói chung.
- source_word: דֹּד אַהֲרֹן
  choice: chú của A-rôn
  rationale: דּוֹד trong ngữ cảnh gia tộc chỉ người chú/bác trai. “Chú” là cách gọi gọn, tự nhiên trong tiếng Việt, dù nguyên ngữ không phân biệt người ấy lớn hay nhỏ tuổi hơn cha của A-rôn.
- source_word: קִרְבוּ
  choice: Hãy đến gần
  rationale: Mệnh lệnh của קרב mang nghĩa tiến hoặc đến gần, thích hợp với bối cảnh họ phải đến chỗ các thi thể gần nơi thánh.
- source_word: שְׂאוּ
  choice: khiêng
  rationale: נשא có nghĩa nâng, mang hoặc vác. Trong ngữ cảnh đưa thi thể đi, “khiêng” diễn đạt hành động rõ ràng và tự nhiên hơn “mang”.
- source_word: אֲחֵיכֶם
  choice: anh em của các ngươi
  rationale: אָח có thể chỉ anh em ruột hoặc bà con nam gần gũi. Giữ cách gọi thân tộc của nguyên văn, đồng thời chú thích rằng ở đây họ là anh em họ.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: từ trước nơi thánh
  rationale: Cách dịch giữ hình ảnh không gian của פְּנֵי và hiểu הַקֹּדֶשׁ là khu vực thánh; chú thích nêu cách diễn đạt sát chữ khác.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: “Ra ngoài trại” diễn đạt tự nhiên hướng chuyển động được đánh dấu bởi אֶל và מִחוּץ.
