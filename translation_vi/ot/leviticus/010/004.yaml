translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “các ngươi” để phù hợp lời truyền lệnh trong bối cảnh cổ và tránh làm mờ số nhiều. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
