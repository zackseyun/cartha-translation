- from: Này, máu của nó đã không được đem vào bên trong nơi thánh. Anh em đáng lẽ phải ăn nó tại nơi thánh, như tôi đã truyền.[a]
  to: Này, máu của nó đã không được đem vào bên trong nơi thánh. Anh em đáng lẽ phải ăn lễ vật ấy tại nơi thánh, như tôi đã truyền.[a]
  rationale: Bản sửa chỉ làm rõ rằng đối tượng được ăn là lễ vật, không phải máu, đồng thời chỉnh chú thích để giải thích chính xác hơn kết cấu nhấn mạnh của tiếng Hê-bơ-rơ. Các lựa chọn về “nơi thánh,” hướng “vào bên trong,” và sắc thái quá khứ của lời quở trách được giữ nguyên.
