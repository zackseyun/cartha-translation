source:
  edition: WLC
  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: vi
  text: Này, máu của nó đã không được đem vào bên trong nơi thánh. Anh em đáng lẽ phải ăn lễ vật ấy tại nơi thánh, như tôi đã truyền.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn lặp động từ “ăn” để nhấn mạnh; trong ngữ cảnh lời quở trách về việc đã qua, có nghĩa là “anh em đáng lẽ phải ăn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Này
  rationale: Từ gọi sự chú ý và nhấn mạnh lập luận; “Này” trang trọng, tự nhiên trong lời quở trách.
- source_word: הוּבָא
  choice: đã không được đem vào
  rationale: Dạng Hophal của בוא mang nghĩa bị động; ngữ cảnh nói về một hành động đã không xảy ra.
- source_word: דָּמָהּ
  choice: máu của nó
  rationale: Hậu tố giống cái số ít quy chiếu về con vật/lễ vật chuộc tội; tiếng Việt dùng “của nó” tự nhiên.
- source_word: אֶל הַקֹּדֶשׁ פְּנִימָה
  choice: vào bên trong nơi thánh
  rationale: Giữ cả hướng chuyển động của אֶל, thuật ngữ thánh thiêng הַקֹּדֶשׁ và sắc thái vào phía trong của פְּנִימָה, nhưng không xác định quá mức một khu vực cụ thể.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: đáng lẽ phải ăn
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh nghĩa vụ; trong lời quở trách về việc đã qua, “đáng lẽ phải” truyền đạt tự nhiên sắc thái này.
- source_word: אֹתָהּ
  choice: nó
  rationale: Đại từ tân ngữ chỉ lễ vật đã được nhắc đến trong ngữ cảnh.
- source_word: בַּקֹּדֶשׁ
  choice: tại nơi thánh
  rationale: Chỉ địa điểm thánh được quy định để các tư tế ăn lễ vật; “tại” phân biệt rõ với chuyển động “vào” ở vế trước.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: như tôi đã truyền
  rationale: Diễn đạt trực tiếp việc Môi-se nhắc lại mệnh lệnh đã ban trước đó.
theological_decisions:
- issue: Thuật ngữ không gian trong nghi thức
  choice: Dịch אֶל הַקֹּדֶשׁ פְּנִימָה là “vào bên trong nơi thánh,” còn בַּקֹּדֶשׁ là “tại nơi thánh.”
  alternative: Dịch vế đầu là “vào nơi chí thánh” hoặc “vào trong đền thánh.”
  rationale: Bản dịch giữ sự khác biệt giữa hướng đưa máu vào phía trong và địa điểm ăn lễ vật, đồng thời tránh đồng nhất הַקֹּדֶשׁ פְּנִימָה với một khu vực kiến trúc cụ thể hơn điều câu Hê-bơ-rơ tự nó nói rõ.
- issue: Sắc thái của אָכוֹל תֹּאכְלוּ
  choice: “đáng lẽ phải ăn”
  alternative: “nhất định phải ăn” hoặc “phải ăn cho bằng được”
  rationale: Ngữ cảnh là lời trách cứ về một nghĩa vụ đã không được thực hiện. Cách dịch đã chọn giữ sức nhấn mạnh mà không biến câu thành một mệnh lệnh hướng về tương lai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” vì động từ số nhiều hướng đến các tư tế được nói với; tránh từ quá cổ. Dấu chú thích [a] xuất hiện trong chính văn.
