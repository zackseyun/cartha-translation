id: LEV.10.2
reference: Leviticus 10:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: vi
  text: Lửa từ trước mặt Yahweh[a] phóng ra, thiêu nuốt họ, và họ chết trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ sự hiện diện của Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: phóng ra
  rationale: Động từ יצא ở dạng kể chuyện diễn tả lửa phát xuất từ nơi có sự hiện diện của Yahweh; “phóng ra” tự nhiên trong ngữ cảnh lửa bùng phát mà vẫn giữ hướng chuyển động của nguyên văn.
- source_word: אֵשׁ
  choice: lửa
  rationale: Danh từ chỉ lửa theo nghĩa trực tiếp, là tác nhân thi hành sự phán xét trong câu.
- source_word: מִלִּפְנֵי יְהוָה
  choice: từ trước mặt Yahweh
  rationale: Giữ hình ảnh Hê-bơ-rơ về điều phát xuất từ trước mặt hoặc từ sự hiện diện của Yahweh, đồng thời bảo tồn danh giao ước.
- source_word: וַתֹּאכַל
  choice: thiêu nuốt
  rationale: אכל có nghĩa cơ bản là “ăn, nuốt”; khi chủ thể là lửa, “thiêu nuốt” vừa tự nhiên trong tiếng Việt vừa giữ sức mạnh hủy diệt của hình ảnh gốc.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ tân ngữ số nhiều chỉ Na-đáp và A-bi-hu trong văn cảnh liền trước.
- source_word: וַיָּמֻתוּ
  choice: họ chết
  rationale: Giữ động từ chủ động nội động như nguyên văn, không đổi thành “bị giết”; mệnh đề trước đã nêu rõ nguyên nhân cái chết.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Bảo tồn cách diễn đạt và sự lặp lại trang nghiêm của cụm từ chỉ vị trí trước sự hiện diện của Yahweh.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” giúp bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Nên dịch וַיָּמֻתוּ là kết quả đơn thuần hay dạng bị động chỉ nguyên nhân
  choice: họ chết
  alternative: họ bị giết
  rationale: Động từ Hê-bơ-rơ là dạng chủ động nội động, nghĩa là “họ chết”; dịch bị động sẽ giải thích thêm điều mà hình thái động từ không nói trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và súc tích. Cấu trúc câu giữ hai lần “trước mặt Yahweh” để phản ánh sự lặp lại có chủ ý trong nguyên văn; “thiêu nuốt” truyền đạt tự nhiên hình ảnh lửa nuốt chửng mà không làm yếu sắc thái phán xét.
