base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: vi
  text: Họ phải đem phần đùi làm lễ vật dâng lên và phần ức làm lễ vật vẫy, cùng với các lễ vật dâng bằng lửa liên hệ với các phần mỡ, để vẫy làm lễ vật vẫy trước mặt Yahweh. Những phần ấy sẽ thuộc về con và các con trai con ở cùng con, làm một quy định vĩnh viễn, đúng như Yahweh đã truyền.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹק הַתְּרוּמָה
  choice: đùi của phần dâng
  rationale: שׁוֹק chỉ phần trên của chân sau con vật; תְּרוּמָה là phần được biệt riêng để dâng. Cách dịch này chính xác mà không dùng thuật ngữ nghi lễ cổ khó hiểu.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: ức của lễ đưa qua đưa lại
  rationale: חָזֶה là phần ức; תְּנוּפָה chỉ lễ vật được trình trước Yahweh bằng một động tác nghi lễ, thường được hiểu là đưa qua đưa lại.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: cùng với những phần mỡ dùng làm lễ vật thiêu bằng lửa
  rationale: Cụm từ liên kết đùi và ức với các phần mỡ được dâng bằng lửa. “Cùng với” diễn đạt tự nhiên sắc thái đi kèm của עַל trong ngữ cảnh này.
- source_word: לְהָנִיף תְּנוּפָה
  choice: để đưa qua đưa lại làm lễ
  rationale: Giữ lại cả động tác nghi lễ của động từ נוּף và chức năng lễ nghi của danh từ đồng gốc תְּנוּפָה, nhưng tránh lặp nặng nề trong tiếng Việt.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: “Trước mặt” là cách diễn đạt tự nhiên cho sự trình dâng trong sự hiện diện của Đức Chúa Trời; danh YHWH được phiên là Yahweh.
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ
  choice: Đó sẽ là phần dành cho con và các con trai ở cùng con
  rationale: Diễn đạt quyền được nhận phần lễ vật của A-rôn và các con trai ông, đồng thời giữ ngôi thứ hai số ít của lời chỉ bảo.
- source_word: לְחָק עוֹלָם
  choice: theo một quy định vĩnh viễn
  rationale: חֹק là quy định đã được ấn định, còn עוֹלָם nói đến tính lâu dài, không xác định điểm kết thúc trong trật tự nghi lễ được ban truyền.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: đúng như Yahweh đã truyền
  rationale: “Đúng như” thể hiện rõ lực so sánh của כַּאֲשֶׁר và nhấn mạnh sự phù hợp với mệnh lệnh trước đó.
theological_decisions:
- issue: Cách thể hiện danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ ghi trực tiếp danh giao ước YHWH. Dùng “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Cách dịch thuật ngữ nghi lễ תְּנוּפָה
  choice: lễ đưa qua đưa lại
  alternative: lễ vẫy; lễ trình dâng
  rationale: Cách dịch được chọn bảo tồn động tác nghi lễ và mối liên hệ với động từ cùng gốc trong câu. Chú thích thừa nhận rằng hình thức chính xác của động tác không được câu này mô tả.
- issue: Phạm vi thời gian của חָק עוֹלָם
  choice: quy định vĩnh viễn
  alternative: luật lệ đời đời; quy định lâu dài
  rationale: Giữ sức nặng của עוֹלָם mà không tự ý giải quyết câu hỏi thần học về quan hệ giữa quy định này và các giai đoạn giao ước.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ các hình ảnh nghi lễ cần thiết, giải thích thuật ngữ chuyên biệt bằng chú thích, và dùng “con” vì câu này tiếp tục lời Yahweh phán trực tiếp với A-rôn.
