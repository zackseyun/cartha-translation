- from: Họ phải đem đùi của phần dâng[a] và ức của lễ đưa qua đưa lại[b], cùng với những phần mỡ dùng làm lễ vật thiêu bằng lửa, để đưa qua đưa lại làm lễ trước mặt Yahweh[c]. Đó sẽ là phần dành cho con và các con trai ở cùng con, theo một quy định vĩnh viễn[d], đúng như Yahweh đã truyền.
  to: Họ phải đem phần đùi làm lễ vật dâng lên và phần ức làm lễ vật vẫy, cùng với các lễ vật dâng bằng lửa liên hệ với các phần mỡ, để vẫy làm lễ vật vẫy trước mặt Yahweh. Những phần ấy sẽ thuộc về con và các con trai con ở cùng con, làm một quy định vĩnh viễn, đúng như Yahweh đã truyền.
  rationale: Bản sửa làm rõ quan hệ cú pháp của các lễ vật dâng bằng lửa với các phần mỡ, dùng thuật ngữ nghi lễ tiếng Việt tự nhiên hơn, và không áp đặt một cách hiểu cụ thể về động tác của lễ vật vẫy. Đại từ “con” được giữ vì Yahweh đang phán trực tiếp với A-rôn; “những phần ấy” làm rõ rằng quyền hưởng thuộc về cả đùi lẫn ức.
  reviewer_model: gpt-5.6-terra
