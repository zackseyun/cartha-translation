review_pass:
  verdict: revise
  source_fidelity: Cần sửa cụm עַל אִשֵּׁי הַחֲלָבִים. Bản nháp khiến “những phần mỡ” trở thành vật được dùng làm “lễ vật thiêu bằng lửa”, trong khi cụm Hê-bơ-rơ nói đến các lễ vật dâng bằng lửa liên hệ với các phần mỡ. Cũng nên tránh việc diễn tả động tác תְּנוּפָה là “đưa qua đưa lại” như một chi tiết chắc chắn, vì hình thức động tác nghi lễ không được câu này xác định.
  naturalness: “Đùi của phần dâng” và “ức của lễ đưa qua đưa lại” hơi gượng trong tiếng Việt hiện đại. Cách “phần đùi làm lễ vật dâng lên” và “phần ức làm lễ vật vẫy” rõ cấu trúc hơn; động từ đồng gốc được giữ tự nhiên trong “để vẫy làm lễ vật vẫy”.
  terminology: Dùng “Yahweh” nhất quán với chính sách dự án. “Lễ vật dâng bằng lửa” phản ánh אִשֵּׁי tốt hơn “lễ vật thiêu bằng lửa”, vốn dễ gợi một loại lễ thiêu riêng. “Lễ vật vẫy” là thuật ngữ nghi lễ thông dụng; chú thích cần nói đây là sự trình dâng nghi lễ, không khẳng định hướng chuyển động chính xác.
  issues:
  - severity: medium
    issue: Cụm “những phần mỡ dùng làm lễ vật thiêu bằng lửa” không phản ánh rõ cấu trúc עַל אִשֵּׁי הַחֲלָבִים.
    rationale: Cụm này nên nói về “các lễ vật dâng bằng lửa liên hệ với các phần mỡ”, thay vì mô tả chính các phần mỡ là vật liệu cho một lễ thiêu.
  - severity: medium
    issue: “Đưa qua đưa lại” khẳng định quá cụ thể hình thức của nghi thức תְּנוּפָה.
    rationale: Ý nghĩa nghi lễ trình dâng/waving được bảo đảm, nhưng hướng và kiểu chuyển động không được câu này mô tả; “vẫy” cùng chú thích trung tính giữ được thuật ngữ mà không diễn giải quá mức.
  - severity: low
    issue: Cách ghép danh từ “đùi của phần dâng” và “ức của lễ đưa qua đưa lại” chưa tự nhiên.
    rationale: Đổi thành “phần đùi làm lễ vật dâng lên” và “phần ức làm lễ vật vẫy” giúp người đọc nhận ra đây là các phần thịt được chỉ định trong nghi lễ.
  revised_text: Họ phải đem phần đùi làm lễ vật dâng lên và phần ức làm lễ vật vẫy, cùng với các lễ vật dâng bằng lửa liên hệ với các phần mỡ, để vẫy làm lễ vật vẫy trước mặt Yahweh. Những phần ấy sẽ thuộc về con và các con trai con ở cùng con, làm một quy định vĩnh viễn, đúng như Yahweh đã truyền.
  revised_footnotes:
  - marker: a
    text: “Lễ vật dâng lên” dịch từ một thuật ngữ chỉ phần được biệt riêng và dâng lên; theo cách gọi truyền thống cũng có thể là “lễ vật giơ lên”.
    reason: lexical_alternative
  - marker: b
    text: “Lễ vật vẫy” chỉ một nghi thức trình dâng trước Yahweh. Câu này không mô tả chính xác hướng hay kiểu chuyển động; cũng có thể dịch khái quát là “lễ vật trình dâng”.
    reason: cultural_note
  - marker: c
    text: “Yahweh” phiên âm danh Hê-bơ-rơ YHWH, danh riêng của Đức Chúa Trời.
    reason: lexical_alternative
  - marker: d
    text: Cũng có thể dịch là “luật lệ đời đời” hoặc “quy định lâu dài”.
    reason: lexical_alternative
