source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: vi
  text: để phân biệt giữa điều thánh và điều thường[a], giữa điều ô uế và điều thanh sạch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều thánh và điều phàm.” Trong tiếng Hê-bơ-rơ, đây là sự đối lập giữa điều được biệt riêng làm thánh và điều không thánh; “điều thường” không hàm ý hành vi bất kính.'
    reason: lexical_alternative
  - marker: b
    text: Tức là tình trạng ô uế và thanh sạch theo nghi lễ.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: để phân biệt
  rationale: Động từ nguyên mẫu có tiền tố ל tiếp nối câu trước và diễn tả mục đích. “Để phân biệt” tự nhiên trong tiếng Việt, đồng thời nhấn mạnh nhiệm vụ nhận định của các thầy tế lễ hơn là hành động tách rời về không gian.
- source_word: בֵּין
  choice: giữa
  rationale: Giới từ này đánh dấu sự đối chiếu giữa từng cặp phạm trù; “giữa” giữ được cấu trúc lặp của nguyên văn.
- source_word: הַקֹּדֶשׁ
  choice: điều thánh
  rationale: Danh từ chỉ phạm trù những gì được biệt riêng là thánh. “Điều thánh” giữ nghĩa khái quát mà không tự ý giới hạn vào một loại người, vật hay nơi chốn.
- source_word: הַחֹל
  choice: điều thường
  rationale: Trong ngôn ngữ tư tế, từ này chỉ điều không thuộc phạm vi thánh, chứ không nhất thiết là xấu xa hay bất kính. “Điều thường” diễn đạt sự đối lập ấy bằng tiếng Việt hiện đại; chú thích bảo lưu cách dịch truyền thống “điều phàm”.
- source_word: הַטָּמֵא
  choice: điều ô uế
  rationale: Trong bối cảnh Lê-vi, từ này chủ yếu chỉ tình trạng ô uế theo nghi lễ. Cách dịch quen thuộc “ô uế” giữ được phạm trù luật lễ mà không đồng nhất nó với tội lỗi đạo đức.
- source_word: הַטָּהוֹר
  choice: điều thanh sạch
  rationale: “Thanh sạch” tạo thành cặp đối nghĩa tự nhiên với “ô uế” và phù hợp với tình trạng thanh sạch theo luật lễ.
theological_decisions:
- issue: Sự đối lập tư tế giữa חֹל và קֹדֶשׁ
  choice: điều thánh và điều thường
  alternative: điều thánh và điều phàm
  rationale: Bản dịch cần phân biệt những gì được biệt riêng là thánh với những gì không thánh, nhưng không hàm ý rằng “điều thường” tất yếu là gian ác hoặc bị xúc phạm. “Thế tục” bị tránh vì dễ mang sắc thái hiện đại và ý thức hệ.
- issue: Bản chất của các phạm trù טָמֵא / טָהוֹר
  choice: điều ô uế và điều thanh sạch, được giải thích là tình trạng theo luật lễ
  alternative: điều không tinh sạch và điều tinh sạch
  rationale: Trong ngữ cảnh luật tư tế, đây trước hết là các tình trạng nghi lễ. Chú thích ngăn người đọc tự động hiểu mọi sự ô uế là tội lỗi đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc song song “giữa… và…, giữa… và…” phản ánh nhịp đối chiếu của tiếng Hê-bơ-rơ. “Điều” được dùng để biểu thị các phạm trù khái quát mà không thêm một đối tượng cụ thể ngoài nguyên văn.
