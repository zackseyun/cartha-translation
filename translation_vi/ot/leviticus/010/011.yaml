source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: vi
  text: và dạy cho con cái Israel mọi luật lệ mà Yahweh đã phán với họ qua Môi-se[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “qua tay Môi-se.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: và dạy
  rationale: Liên từ וּ và động từ nguyên mẫu Hiphil của ירה tiếp nối các nhiệm vụ của thầy tế lễ ở câu trước; “dạy” tự nhiên, rõ nghĩa và phù hợp với ý truyền đạt sự chỉ dẫn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh gia tộc của cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Israel,” đồng thời “con cái Israel” là cách nói tự nhiên, trang trọng và mang nghĩa tập thể trong tiếng Việt.
- source_word: כָּל הַחֻקִּים
  choice: mọi luật lệ
  rationale: חֻקִּים chỉ những quy định được thiết lập; “luật lệ” dễ hiểu trong tiếng Việt hiện đại mà vẫn giữ sắc thái pháp quy của giao ước.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: mà Yahweh đã phán với họ
  rationale: Thể hiện mệnh đề quan hệ bổ nghĩa cho “mọi luật lệ,” giữ động từ trang trọng “phán,” đại từ chỉ đối tượng אֲלֵיהֶם và danh riêng giao ước Yahweh.
- source_word: בְּיַד מֹשֶׁה
  choice: qua tay Môi-se
  rationale: Giữ gần thành ngữ Hê-bơ-rơ “bởi/qua tay,” diễn tả vai trò trung gian của Môi-se; cách nói thông dụng hơn “qua Môi-se” được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi giới tính của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel; dân Israel
  rationale: Cụm Hê-bơ-rơ có hình thức giống đực nhưng được dùng như danh xưng tập thể của dân giao ước. “Con cái Israel” vừa giữ quan hệ gia tộc vừa tránh khiến độc giả hiểu rằng lời dạy chỉ dành cho nam giới.
- issue: Vai trò trung gian trong בְּיַד מֹשֶׁה
  choice: qua tay Môi-se
  alternative: qua Môi-se
  rationale: Giữ hình ảnh nguyên văn và vai trò trung gian mà không hàm ý Môi-se là nguồn ban hành các luật lệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu này tiếp nối về mặt ngữ pháp với các nhiệm vụ của thầy tế lễ ở câu trước, nên mở đầu bằng “và”. Dùng “Môi-se” theo dạng tên quen thuộc trong tiếng Việt; giữ “Yahweh” như danh riêng.
