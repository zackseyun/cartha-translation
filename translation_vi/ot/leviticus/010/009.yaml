  rationale: Bản sửa tái lập phạm vi đầy đủ của người nhận lệnh và của cảnh báo tử vong, đồng thời chọn từ tương đương rộng cho שֵׁכָר mà không hàm ý sai rằng chỉ riêng nó là đồ uống lên men. Cấu trúc pháp lý, giới hạn “khi vào,” và tính lâu dài xuyên các thế hệ của quy định đều được duy trì.
