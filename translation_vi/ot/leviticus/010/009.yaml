source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: vi
  text: “Ngươi và các con trai ngươi không được uống rượu hay thức uống gây say[a] khi vào Lều Hội Kiến, để các ngươi không chết[b]. Đây là một quy định vĩnh viễn cho các thế hệ các ngươi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thức uống có cồn.” Từ Hê-bơ-rơ chỉ chung các loại đồ uống gây say khác với rượu nho.
    reason: lexical_alternative
  - marker: b
    text: Hay “kẻo các ngươi chết.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַיִן
  choice: rượu nho
  rationale: Chỉ loại rượu được làm từ nho; cách dịch này phân biệt rõ với שֵׁכָר là những thức uống có men khác.
- source_word: שֵׁכָר
  choice: thức uống có men
  rationale: Chỉ chung đồ uống gây say không phải rượu nho. Cách diễn đạt này tự nhiên và rộng hơn “rượu mạnh”, vì từ Hê-bơ-rơ không nhất thiết nói đến đồ uống chưng cất.
- source_word: אַל תֵּשְׁתְּ
  choice: không được uống
  rationale: Thể hiện rõ sức nặng của lệnh cấm trong văn bản luật mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: con và các con trai con ở cùng con
  rationale: Giữ đủ đối tượng được nói trực tiếp là A-rôn và các con trai ông, đồng thời bảo lưu ý nhấn mạnh của “ở cùng con”.
- source_word: בְּבֹאֲכֶם
  choice: khi vào
  rationale: Diễn đạt tự nhiên giá trị thời gian/hoàn cảnh của cấu trúc nguyên mẫu có giới từ בְּ.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Danh xưng quen thuộc, trang trọng và dễ hiểu cho nơi Đức Chúa Trời gặp dân Ngài.
- source_word: וְלֹא תָמֻתוּ
  choice: để các con khỏi chết
  rationale: Giữ sắc thái phòng tránh hậu quả chết người sau lệnh cấm, không khẳng định quá mức một quan hệ nhân quả máy móc.
- source_word: חֻקַּת עוֹלָם
  choice: quy định vĩnh viễn
  rationale: Phản ánh công thức pháp lý chỉ một điều lệ có hiệu lực lâu dài bằng tiếng Việt hiện đại.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của các con
  rationale: Giữ ý quy định tiếp tục áp dụng qua những thế hệ kế tiếp.
theological_decisions:
- issue: Sức nặng của mệnh đề nói về cái chết
  choice: “để các con khỏi chết”
  alternative: “kẻo các con chết”; “và các con sẽ không chết”
  rationale: Bản Hê-bơ-rơ có thể được hiểu là hậu quả cần tránh sau lệnh cấm. Cách dịch được chọn truyền đạt lời cảnh báo rõ ràng và tự nhiên, đồng thời chú thích phương án trực tiếp hơn.
- issue: Phạm vi của lệnh cấm
  choice: Lệnh cấm được giới hạn bởi hoàn cảnh “khi vào Lều Hội Kiến”.
  alternative: Lệnh kiêng hoàn toàn dành cho các thầy tế lễ trong mọi hoàn cảnh.
  rationale: Cụm thời gian בְּבֹאֲכֶם giới hạn trực tiếp việc cấm uống vào lúc họ vào Lều Hội Kiến; bản dịch không mở rộng điều răn vượt quá văn cảnh.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “con/các con” vì Đức Chúa Trời đang trực tiếp phán với A-rôn và các con trai ông. Viết hoa “Lều Hội Kiến” như một danh xưng quen thuộc. Không giữ chú thích tiếng Anh gắn sai vị trí về “quy định vĩnh viễn”; chính văn đã diễn đạt rõ חֻקַּת עוֹלָם, nên không cần một chú thích chỉ lặp lại từ đồng nghĩa.
