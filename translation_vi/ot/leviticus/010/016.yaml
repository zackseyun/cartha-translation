  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: vi
  text: 'Môi-se đã tìm kiếm kỹ lưỡng con dê đực của lễ chuộc tội[a], thì thấy nó đã bị thiêu rồi[b]. Ông nổi giận với Ê-lê-a-sa và Y-tha-ma, là hai người con còn lại của A-rôn[c], rồi nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã tìm đi tìm lại con dê đực của lễ chuộc tội.” Tiếng Hê-bơ-rơ dùng nguyên mẫu tuyệt đối đi với động từ hữu hạn để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nó đã bị thiêu rụi.” Tiếng Hê-bơ-rơ mô tả con dê trong tình trạng đã bị thiêu khi Môi-se tìm thấy nó.'
    reason: lexical_alternative
  - marker: c
    text: “Hai người con còn lại của A-rôn” là Ê-lê-a-sa và Y-tha-ma, những người còn lại sau khi Na-đáp và A-bi-hu chết (Lê-vi Ký 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: con dê đực của lễ chuộc tội
  rationale: שְׂעִיר chỉ dê đực; cách dịch này giữ rõ loại con vật và phạm trù tế lễ חַטָּאת, đồng thời tự nhiên trong tiếng Việt.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: đã tìm kiếm kỹ lưỡng
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động. “Tìm kiếm kỹ lưỡng” truyền đạt sắc thái nhấn mạnh mà không dùng lối lặp gượng trong tiếng Việt.
- source_word: וְהִנֵּה
  choice: thì thấy
  rationale: Trong ngữ cảnh tìm kiếm và phát hiện, הִנֵּה hướng sự chú ý đến kết quả bất ngờ. “Thì thấy” diễn đạt tự nhiên chức năng trần thuật ấy trong tiếng Việt hiện đại.
- source_word: שֹׂרָף
  choice: nó đã bị thiêu rồi
  rationale: Phân từ bị động mô tả tình trạng con dê khi được phát hiện. Cách dịch giữ thể bị động và kết quả đã xảy ra, nhưng không nhất thiết quyết đoán rằng nó bị thiêu hoàn toàn.
- source_word: וַיִּקְצֹף
  choice: Ông nổi giận
  rationale: Động từ diễn tả sự tức giận. “Nổi giận” tự nhiên, đủ mạnh nhưng không cường điệu thành thịnh nộ.
- source_word: הַנּוֹתָרִם
  choice: hai người con còn lại
  rationale: Phân từ xác định Ê-lê-a-sa và Y-tha-ma là các con còn lại của A-rôn sau cái chết của Na-đáp và A-bi-hu; thêm “hai người” làm rõ cấu trúc tiếng Việt mà không thêm nội dung mới.
- source_word: לֵאמֹר
  choice: 'mà nói:'
  rationale: Công thức dẫn lời nối trực tiếp sang câu kế tiếp. Dấu hai chấm phù hợp với quy ước tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “lễ chuộc tội” như thuật ngữ tế lễ quen thuộc; giữ sự mơ hồ của שֹׂרָף về mức độ bị thiêu trong chính văn và nêu khả năng “thiêu rụi” ở chú thích.
