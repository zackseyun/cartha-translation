id: LEV.10.3
reference: Leviticus 10:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: vi
  text: 'Bấy giờ, Môi-se nói với A-rôn: “Đây là điều Yahweh đã phán: ‘Giữa những người đến gần ta, ta sẽ được tỏ ra là thánh[a]; và trước mặt toàn dân, ta sẽ được tôn vinh[b].’” A-rôn lặng im.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bởi những người đến gần ta, ta sẽ được coi là thánh.” Tiếng Hê-bơ-rơ có thể nói đến việc sự thánh khiết của Đức Chúa Trời được bày tỏ, hoặc việc những người đến gần Ngài nhìn nhận và đối đãi với Ngài là thánh.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “ta sẽ được tôn kính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng chuyển tự của danh riêng Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Đây là điều Yahweh đã phán
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ cấu trúc xác định và động từ 'phán' của nguyên văn.
- source_word: בִּקְרֹבַי
  choice: Giữa những người đến gần ta
  rationale: Giữ ý những người đến gần Đức Chúa Trời trong việc thờ phượng và phụng sự mà không thu hẹp thành riêng 'các thầy tế lễ'.
- source_word: אֶקָּדֵשׁ
  choice: ta sẽ được tỏ ra là thánh
  rationale: Phản ánh thể Niphal và giữ trọng tâm nơi sự thánh khiết của Đức Chúa Trời được bày tỏ, nhưng không loại trừ sắc thái Ngài được nhìn nhận hoặc đối đãi là thánh.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: và trước mặt toàn dân
  rationale: Cách nói tự nhiên, sát nghĩa, làm rõ tính công khai của sự việc.
- source_word: אֶכָּבֵד
  choice: ta sẽ được tôn vinh
  rationale: Giữ thể bị động và sắc thái thần học của כבד khi nói về vinh dự công khai dành cho Đức Chúa Trời.
- source_word: וַיִּדֹּם
  choice: A-rôn lặng im
  rationale: Ngắn gọn, trang nghiêm và truyền đạt cả sự im lặng lẫn nét bất động trong phản ứng của A-rôn.
theological_decisions:
- issue: Cách diễn đạt sự thánh khiết của Đức Chúa Trời liên quan đến những người đến gần Ngài
  choice: Giữa những người đến gần ta, ta sẽ được tỏ ra là thánh
  alternative: Bởi những người đến gần ta, ta sẽ được coi là thánh
  rationale: Nguyên văn có thể chỉ sự thánh khiết của Đức Chúa Trời được bày tỏ, được nhìn nhận, hoặc việc Ngài được đối đãi là thánh. Bản chính giữ sắc thái bày tỏ mà không âm thầm loại bỏ cách hiểu nhấn mạnh trách nhiệm của người đến gần.
- issue: Cách dịch אֶכָּבֵד về vinh dự công khai dành cho Đức Chúa Trời
  choice: ta sẽ được tôn vinh
  alternative: ta sẽ được tôn kính
  rationale: '''Được tôn vinh'' giữ sắc thái vinh quang và trọng lượng thần học của từ nguồn; ''được tôn kính'' vẫn là một khả năng từ vựng hợp lệ.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Dùng đại từ 'ta' trong lời phán trực tiếp của Đức Chúa Trời; giữ tên riêng Yahweh và các tên Môi-se, A-rôn theo dạng quen thuộc.
