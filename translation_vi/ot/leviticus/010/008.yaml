  text: And Yahweh spoke to Aaron[a], saying,
translation:
  language: vi
  text: 'Bấy giờ Gia-vê phán với A-rôn rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời phán của Đức Chúa Trời được diễn đạt tự nhiên và trang trọng bằng “phán”; liên từ וַ nối tiếp diễn tiến câu chuyện nhưng không nhất thiết phải dịch thành một từ riêng trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu chỉ hành vi nói với một người, “phán với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dạng nguyên thể này giới thiệu nội dung lời phán; “rằng” truyền đạt chức năng ấy tự nhiên hơn lối dịch sát chữ “mà nói”.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” giữ đây là danh riêng, đồng thời phù hợp với lối gọi trang trọng, dễ nhận biết trong tiếng Việt; không thay bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng; giữ công thức dẫn nhập lời phán nhưng diễn đạt theo cú pháp tiếng Việt tự nhiên.
