  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: vi
  text: Anh em phải ăn lễ vật ấy tại một nơi thánh, vì đó là phần được ấn định cho anh và các con trai anh, lấy từ các lễ vật dâng bằng lửa cho Yahweh[a], vì tôi đã được truyền lệnh như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “từ các hỏa tế của Yahweh.”'
    reason: Nêu phương án ngắn gọn, sát hình thức hơn cho thuật ngữ tế tự אִשֵּׁי, trong khi bản văn chính diễn đạt rõ quan hệ phần được lấy từ các lễ vật.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Anh em phải ăn
  rationale: Động từ hướng đến nhiều người nam và mang tính chỉ thị. “Phải ăn” diễn đạt mệnh lệnh tự nhiên trong tiếng Việt; “anh em” giữ số nhiều của lời nói trực tiếp.
- source_word: אֹתָהּ
  choice: lễ vật ấy
  rationale: Đại từ giống cái số ít chỉ phần lễ vật đang được nói đến. Nêu lại “lễ vật” giúp câu tiếng Việt rõ nghĩa hơn đại từ “nó”.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: tại một nơi thánh
  rationale: Cụm từ không có mạo từ xác định; “một nơi thánh” tránh thu hẹp nghĩa thành một gian hay địa điểm thánh cụ thể.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: phần được ấn định cho anh và cho các con trai anh
  rationale: Trong ngữ cảnh tư tế, חֹק chỉ phần được quy định hay phân cho tư tế, không đơn thuần là một đạo luật. Số ít “anh” và “các con trai anh” bảo tồn sự chuyển đổi từ nhóm người nghe sang lời hướng riêng đến A-rôn.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: từ những lễ vật dâng bằng lửa lên Yahweh
  rationale: אִשֶּׁה là thuật ngữ tế tự chỉ lễ vật được dâng qua lửa. Cách dịch này giữ hình ảnh và phạm trù tế lễ của tiếng Hê-bơ-rơ, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: bởi vì ta đã được truyền lệnh như vậy
  rationale: Giữ liên từ giải thích, thể bị động và ý Môi-se đã nhận lệnh từ Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của חֹק trong bối cảnh phần dành cho tư tế
  choice: phần được ấn định
  alternative: quy định; phần; phần được phân
  rationale: Mạch văn nói về phần lễ vật mà A-rôn và các con trai được nhận. “Phần được ấn định” vừa diễn đạt phần vật chất vừa giữ sắc thái được quy định chính thức.
- issue: Cách dịch thuật ngữ tế tự אִשֵּׁי
  choice: lễ vật dâng bằng lửa
  alternative: hỏa tế; lễ vật làm thức ăn
  rationale: Bản dịch chính giữ mối liên hệ trực tiếp với lửa và không mặc nhiên giải quyết mọi sắc thái của thuật ngữ; chú thích nêu cách gọi ngắn gọn hơn.
- issue: Sự chuyển đổi giữa người nghe số nhiều và đại từ số ít
  choice: Anh em ... cho anh và cho các con trai anh
  alternative: Các ông ... cho ông và cho các con trai ông
  rationale: Tiếng Hê-bơ-rơ dùng động từ số nhiều nhưng các hậu tố sở hữu sau đó ở số ít, có lẽ chuyển trọng tâm đến A-rôn. Bản dịch giữ sự chuyển đổi này thay vì đồng nhất hóa các đại từ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Anh em” dùng cho nhóm người nam trong lời nói trực tiếp; “ta” phù hợp với lời Môi-se truyền lại mệnh lệnh. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
