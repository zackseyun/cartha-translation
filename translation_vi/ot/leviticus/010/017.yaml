  to: Tại sao các con không ăn lễ vật chuộc tội[a] tại nơi thánh? Vì đó là vật chí thánh, và Ngài đã ban nó cho các con để gánh lấy tội lỗi của hội chúng và để chuộc tội cho họ trước mặt Đức Giê-hô-va.
