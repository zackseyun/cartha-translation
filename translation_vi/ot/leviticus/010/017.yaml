  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: vi
  text: Tại sao các con không ăn lễ vật chuộc tội[a] tại nơi thánh? Vì đó là vật chí thánh, và Ngài đã ban nó cho các con để gánh lấy tội lỗi của hội chúng và để chuộc tội cho họ trước mặt Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy.” Từ חַטָּאת trong tiếng Hê-bơ-rơ có thể chỉ lễ vật liên quan đến việc loại bỏ sự ô uế cũng như xử lý tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: Tại sao các con không ăn
  rationale: Diễn đạt trực tiếp câu chất vấn mang tính quở trách. Đại từ “các con” phù hợp với việc Môi-se đang nói với Ê-lê-a-sa và Y-tha-ma, đồng thời tự nhiên hơn lối “các ngươi” trong tiếng Việt hiện đại.
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh này, từ này chắc chắn chỉ sinh tế được dâng theo nghi thức liên quan đến tội lỗi hoặc sự thanh tẩy. “Lễ vật chuộc tội” là cách gọi quen thuộc; khả năng dịch “lễ vật thanh tẩy” được giữ trong chú thích.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: tại nơi thánh
  rationale: Chỉ khu vực thánh đã được quy định để các thầy tế lễ ăn phần lễ vật; cách dịch này giữ sát cấu trúc nguồn mà vẫn tự nhiên.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Cấu trúc lặp trong tiếng Hê-bơ-rơ biểu thị mức độ cao nhất. “Chí thánh” trang trọng, gọn và tránh nhầm với Nơi Chí Thánh trong Đền Tạm.
- source_word: וְאֹתָהּ נָתַן לָכֶם
  choice: và Ngài đã ban nó cho các con
  rationale: Động từ giống đực số ít không nêu chủ ngữ; ngữ cảnh cho thấy chủ thể ngầm hiểu là Đức Chúa Trời. “Ngài” giữ chủ thể hàm ẩn mà không nêu thêm danh xưng không có trong mệnh đề.
- source_word: לָשֵׂאת אֶת עֲוֹן הָעֵדָה
  choice: để gánh lấy tội lỗi của hội chúng
  rationale: Giữ hình ảnh “mang/gánh” của נשא và nghĩa rộng của עָוֹן là tội lỗi/sự gian ác, không thu hẹp thành hình phạt hay chỉ cảm giác mắc tội.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: làm lễ chuộc tội cho họ
  rationale: Trong bối cảnh tế lễ, כפר nói đến hành động nghi lễ nhằm thực hiện sự chuộc tội; cách diễn đạt này rõ nghĩa với độc giả phổ thông mà không xác định quá mức cơ chế thần học.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: “Trước mặt” diễn đạt sự hiện diện mang tính nghi lễ; “Đức Giê-hô-va” bảo tồn danh riêng giao ước יהוה theo cách gọi quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Ngữ cảnh xác định đây là một lễ vật, nhưng bản thân thuật ngữ có thể nhấn mạnh việc xử lý tội lỗi hoặc loại bỏ ô uế. Bản chính dùng cách gọi quen thuộc và chú thích bảo tồn chiều kích thanh tẩy.
- issue: Chủ ngữ ngầm của נָתַן
  choice: Ngài đã ban nó cho các con
  alternative: nó đã được ban cho các con
  rationale: Động từ Hê-bơ-rơ có chủ ngữ ngôi ba số ít nhưng không nêu danh tính. Ngữ cảnh hợp lý nhất là Đức Chúa Trời; dùng “Ngài” giữ cách nói chủ động nhưng không thêm danh xưng vào câu.
- issue: Sắc thái của לָשֵׂאת אֶת עֲוֹן
  choice: gánh lấy tội lỗi
  alternative: mang sự gian ác; gánh trách nhiệm về tội lỗi
  rationale: Thành ngữ có thể bao hàm việc mang tội, trách nhiệm hoặc hậu quả của tội trong vai trò tế lễ. “Gánh lấy tội lỗi” giữ được độ căng và không giải quyết dứt khoát bản chất của việc mang ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “các con” theo quan hệ và tình huống phát ngôn trong ngữ cảnh, tránh đại từ cổ “các ngươi.” Thuật ngữ tế lễ được giữ nhất quán và không diễn giải cơ chế chuộc tội theo một truyền thống giáo phái cụ thể.
