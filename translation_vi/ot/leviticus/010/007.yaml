revisions:
- from: Các con không được ra khỏi cửa Lều Hội Kiến, kẻo phải chết, vì dầu xức của Yahweh đang ở trên các con.” Họ làm theo lời Môi-se.
  to: Các con không được rời khỏi cửa Lều Hội Kiến, kẻo chết, vì dầu xức của Yahweh ở trên các con.” Họ làm theo lời Môi-se.
  rationale: Chỉnh nhẹ để sát sắc thái tiếng Hê-bơ-rơ và tự nhiên trong tiếng Việt hiện đại, không thêm diễn giải thần học hay thay đổi nội dung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:45:13Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lệnh cấm, lời cảnh cáo chết, lý do liên quan đến dầu xức của Yahweh, và việc họ vâng theo lời Môi-se. Tuy nhiên, “đang ở trên” thêm sắc thái tiếp diễn không được biểu thị riêng trong tiếng Hê-bơ-rơ; “kẻo chết” sát với תָּמֻתוּ hơn “kẻo phải chết”.
  naturalness: “Rời khỏi cửa Lều Hội Kiến” tự nhiên và rõ hơn “ra khỏi cửa Lều Hội Kiến”, vốn có thể gợi việc đi từ bên trong ra ngoài qua cánh cửa. Bỏ “đang” cũng làm câu gọn và trang trọng hơn.
  terminology: Giữ nhất quán “Lều Hội Kiến”, “dầu xức”, “Yahweh”, và “Môi-se”. “Các con” phù hợp ngữ cảnh trực tiếp Môi-se nói với các con trai của A-rôn còn lại.
  issues:
  - severity: low
    issue: “đang ở trên các con” thêm sắc thái tiếp diễn
    rationale: Cụm עֲלֵיכֶם chỉ nói dầu xức của Yahweh “ở trên các con”; động từ tiếp diễn “đang” không cần thiết.
  - severity: low
    issue: “kẻo phải chết” hơi diễn giải lực cảnh cáo
    rationale: תָּמֻתוּ nghĩa trực tiếp là “các con sẽ chết/chết”; “kẻo chết” giữ lời cảnh báo ngắn gọn và sát hơn.
  - severity: low
    issue: “ra khỏi cửa” có thể mơ hồ về không gian
    rationale: “Rời khỏi cửa Lều Hội Kiến” diễn đạt rõ lệnh không rời vị trí tại lối vào, phù hợp với מִפֶּתַח.
  revised_text: Các con không được rời khỏi cửa Lều Hội Kiến, kẻo chết, vì dầu xức của Yahweh ở trên các con.” Họ làm theo lời Môi-se.
