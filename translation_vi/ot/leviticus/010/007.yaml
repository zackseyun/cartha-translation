source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: vi
  text: Các con không được rời khỏi cửa Lều Hội Kiến, kẻo chết, vì dầu xức của Yahweh ở trên các con.” Họ làm theo lời Môi-se.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח אֹהֶל מוֹעֵד
  choice: khỏi cửa Lều Hội Kiến
  rationale: מִן diễn tả việc đi ra khỏi một vị trí; פֶּתַח là cửa/lối vào. “Lều Hội Kiến” là cách gọi quen thuộc, trang trọng cho אֹהֶל מוֹעֵד.
- source_word: לֹא תֵצְאוּ
  choice: Các con không được ra
  rationale: Cấu trúc phủ định mang lực cấm đoán. “Không được” tự nhiên trong tiếng Việt hiện đại và giữ rõ tính mệnh lệnh.
- source_word: פֶּן תָּמֻתוּ
  choice: kẻo phải chết
  rationale: פֶּן nêu hậu quả cần tránh; “kẻo phải chết” vừa trang trọng vừa truyền đạt lời cảnh báo nghiêm trọng.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: dầu xức của Yahweh
  rationale: Giữ sát chuỗi liên kết Hê-bơ-rơ, chỉ loại dầu dùng trong nghi thức xức và biệt riêng các thầy tế lễ cho Yahweh.
- source_word: עֲלֵיכֶם
  choice: đang ở trên các con
  rationale: Giữ hình ảnh cụ thể của giới từ עַל và cho thấy dầu xức hiện ở trên họ, không diễn giải thêm ý nghĩa thần học.
- source_word: וַיַּעֲשׂוּ כִּדְבַר מֹשֶׁה
  choice: Họ làm theo lời Môi-se
  rationale: Diễn đạt tự nhiên sự tuân hành đúng theo điều Môi-se đã nói, đồng thời giữ danh từ דָּבָר là “lời”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Văn bản ghi trực tiếp danh riêng giao ước יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của dầu xức ở trên các thầy tế lễ
  choice: giữ nguyên hình ảnh “dầu xức của Yahweh đang ở trên các con”
  alternative: diễn giải là “các con đã được Yahweh biệt riêng”
  rationale: Nguyên văn nêu dầu xức như lý do của lệnh cấm nhưng không giải thích đầy đủ quan hệ thần học; bản dịch giữ sự cô đọng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” vì đây là lời Môi-se trực tiếp nói với A-rôn và các con trai còn lại trong ngữ cảnh; cách xưng hô này tự nhiên hơn đại từ số nhiều trung tính mà vẫn phù hợp quan hệ gia đình và thẩm quyền. Giữ dấu ngoặc kép đóng theo mạch lời nói từ câu trước.
