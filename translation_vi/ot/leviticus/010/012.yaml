source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: vi
  text: 'Rồi Môi-se nói với A-rôn và với hai người con trai còn lại của ông là Ê-lê-a-sa và Y-tha-ma: “Hãy lấy phần lễ vật ngũ cốc còn lại từ các lễ vật dâng bằng lửa cho Yahweh[a], rồi ăn phần ấy không men bên cạnh bàn thờ, vì đó là vật chí thánh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các lễ vật làm thức ăn dâng lên Yahweh.”
    reason: Thuật ngữ Hê-bơ-rơ אִשֵּׁי thường được dịch là «lễ vật dâng bằng lửa», nhưng cũng có thể được diễn đạt theo chức năng tế lễ là «lễ vật làm thức ăn dâng lên Yahweh».
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi Môi-se nói
  rationale: Dạng kể chuyện với waw liên tiếp đẩy trình tự sự việc tiến lên; “Rồi” tự nhiên trong tiếng Việt và không thêm sắc thái đối lập.
- source_word: הַנּוֹתָרִים
  choice: những người con trai còn lại
  rationale: Phân từ chỉ các con trai của A-rôn còn lại sau cái chết của Na-đáp và A-bi-hu; cách dịch này sát nghĩa mà không diễn giải mạnh thành “sống sót”.
- source_word: הַמִּנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong ngữ cảnh tế lễ của sách Lê-vi, từ này chỉ lễ vật làm từ sản vật ngũ cốc, không phải lễ vật nói chung.
- source_word: הַנּוֹתֶרֶת
  choice: phần ... còn lại
  rationale: Phân từ giống cái bổ nghĩa cho lễ vật ngũ cốc, chỉ phần còn lại sau khi phần dành dâng lên đã được xử lý.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: từ các lễ vật dâng bằng lửa lên Yahweh
  rationale: Giữ rõ hình ảnh lửa trong thuật ngữ tế lễ אִשֶּׁה và diễn đạt quan hệ dâng lên Đức Chúa Trời bằng tiếng Việt tự nhiên; chú thích ghi nhận cách hiểu “lễ vật làm thức ăn”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: rồi ăn phần ấy không men
  rationale: מַצּוֹת có chức năng nêu cách thức hoặc trạng thái của lễ vật khi ăn; “ăn ... không men” gọn và giữ được cấu trúc của nguyên văn.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: bên cạnh bàn thờ
  rationale: אֵצֶל diễn tả sự ở gần; “bên cạnh” tự nhiên và không hàm ý phải tiếp xúc trực tiếp.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Thành ngữ lặp danh từ trong tiếng Hê-bơ-rơ biểu thị mức độ thánh cao nhất; “vật chí thánh” vừa trang trọng vừa phân biệt lễ vật này với nơi Chí Thánh.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu hoặc chọn một dạng phiên âm truyền thống khác.
- issue: Ý nghĩa của אִשֵּׁי trong thuật ngữ tế lễ
  choice: các lễ vật dâng bằng lửa
  alternative: các lễ vật làm thức ăn dâng lên Yahweh
  rationale: Cách chọn giữ hình ảnh lửa hiển hiện trong thuật ngữ truyền thống, còn chú thích bảo tồn cách hiểu từ này như lễ vật hoặc thức ăn dâng cho Đức Chúa Trời mà không quyết đoán về nguồn gốc từ.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Tên người được phiên âm theo lối quen thuộc trong tiếng Việt: Môi-se, A-rôn, Ê-lê-a-sa, Y-tha-ma. Cụm “vật chí thánh” giữ sắc thái nghi lễ và tránh khiến độc giả nhầm với danh xưng của gian Nơi Chí Thánh.'
