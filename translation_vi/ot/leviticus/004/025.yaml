  to: Rồi thầy tế lễ sẽ dùng ngón tay lấy một ít máu của lễ vật chuộc tội[a], bôi lên các sừng của bàn thờ dâng lễ thiêu, và đổ phần máu còn lại ở chân bàn thờ dâng lễ thiêu.
