    issue: “dưới chân bàn thờ”
    rationale: Cụm này có thể được hiểu là đổ máu ở phía dưới bàn thờ. Từ יְסוֹד chỉ chân/bệ/nền của bàn thờ, nên “ở chân bàn thờ” diễn đạt đúng vị trí hơn.
