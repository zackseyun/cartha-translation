id: LEV.4.25
reference: Leviticus 4:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: vi
  text: Rồi thầy tế lễ sẽ dùng ngón tay lấy một ít máu của lễ vật chuộc tội[a], bôi lên các sừng của bàn thờ dâng lễ thiêu, và đổ phần máu còn lại ở chân bàn thờ dâng lễ thiêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ có thể chỉ lễ vật liên quan đến việc loại bỏ sự ô uế cũng như tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ... sẽ ... lấy
  rationale: Dạng waw + qatal tiếp nối trình tự nghi lễ; “Rồi” diễn đạt tự nhiên bước kế tiếp trong chỉ dẫn.
- source_word: מִדַּם
  choice: một ít máu
  rationale: 'Giới từ מִן mang nghĩa phân lượng: thầy tế lễ chỉ lấy một phần máu để bôi lên bàn thờ.'
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ lễ vật liên quan đến tội lỗi hoặc sự thanh tẩy, chứ không chỉ khái niệm trừu tượng “tội lỗi”. Cách dịch này rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: בְּאֶצְבָּעוֹ
  choice: dùng ngón tay
  rationale: Giới từ בְּ biểu thị phương tiện; cách nói này tự nhiên trong tiếng Việt.
- source_word: וְנָתַן עַל
  choice: bôi lên
  rationale: Trong hành động nghi lễ bằng ngón tay, “bôi lên” diễn đạt cụ thể và tự nhiên hơn “đặt lên” mà không làm thay đổi nội dung.
- source_word: קַרְנוֹת
  choice: các sừng
  rationale: Chỉ những phần nhô lên giống sừng tại các góc bàn thờ; giữ thuật ngữ tế lễ truyền thống và sát hình ảnh Hê-bơ-rơ.
- source_word: מִזְבַּח הָעֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: Cụm từ xác định bàn thờ dùng cho lễ thiêu; cách diễn đạt này rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: וְאֶת־דָּמוֹ יִשְׁפֹּךְ
  choice: đổ phần máu còn lại
  rationale: Vì trước đó đã lấy một ít máu, “phần máu còn lại” làm rõ hàm ý phân lượng vốn có trong trình tự Hê-bơ-rơ.
- source_word: אֶל יְסוֹד
  choice: dưới chân
  rationale: יְסוֹד chỉ phần nền hoặc chân của bàn thờ; “dưới chân bàn thờ” là cách nói tự nhiên và xác định nơi đổ máu.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ Hê-bơ-rơ có thể nhấn mạnh tội lỗi hoặc tác dụng loại bỏ ô uế. Trong câu này, nó rõ ràng chỉ lễ vật/nghi lễ. Bản chính dùng thuật ngữ quen thuộc “lễ vật chuộc tội”, đồng thời chú thích giữ lại khả năng “lễ vật thanh tẩy” để không thu hẹp sắc thái của nguyên ngữ.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng hiện đại. Dùng “thầy tế lễ” cho כֹּהֵן, “bàn thờ” và “lễ thiêu” theo cách gọi phổ thông; tránh lối văn cổ và không áp đặt một lý thuyết chuộc tội riêng.
