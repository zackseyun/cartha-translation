  terminology: “Thầy tế lễ,” “các sừng,” “bàn thờ dâng lễ thiêu,” và “lễ vật chuộc tội” nhất quán với văn cảnh tế lễ. Chú thích về khả năng dịch “lễ vật thanh tẩy” bảo toàn sắc thái từ vựng của חַטָּאת mà không áp đặt một cách hiểu thần học hẹp.
  issues:
