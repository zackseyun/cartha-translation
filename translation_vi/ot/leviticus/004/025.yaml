  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng trình tự nghi lễ, tính phân lượng của מִדַּם (“một ít máu”), việc dùng ngón tay, các “sừng” bàn thờ và thuật ngữ חַטָּאת với chú thích thay thế thích hợp. Tuy nhiên, “dưới chân bàn thờ” có thể gợi nghĩa ở bên dưới/ở dưới bàn thờ, trong khi אֶל־יְסוֹד chỉ đến phần chân, bệ hay nền của bàn thờ. “Ở chân bàn thờ” chính xác hơn về không gian.
