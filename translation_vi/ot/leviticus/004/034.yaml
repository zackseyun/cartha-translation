id: LEV.4.34
reference: Leviticus 4:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: vi
  text: Sau đó, thầy tế lễ phải dùng ngón tay lấy một ít huyết của lễ chuộc tội[a], bôi lên các sừng của bàn thờ dâng lễ thiêu, rồi đổ toàn bộ huyết của nó tại chân bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy”. Từ Hê-bơ-rơ này có thể chỉ lễ vật được dâng liên quan đến tội lỗi và sự thanh tẩy theo nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Sau đó ... phải ... lấy
  rationale: Dạng waw + qatal tiếp nối trình tự nghi lễ; “Sau đó” diễn đạt tự nhiên bước kế tiếp, còn “phải” giữ sắc thái quy định.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, quen thuộc trong tiếng Việt đối với người thi hành nghi lễ.
- source_word: מִדַּם
  choice: một ít huyết
  rationale: 'Giới từ מִן mang nghĩa phân lượng trong ngữ cảnh: thầy tế lễ chỉ lấy một phần huyết để bôi trước khi đổ huyết xuống chân bàn thờ.'
- source_word: הַחַטָּאת
  choice: lễ chuộc tội
  rationale: Trong luật tế lễ, danh từ này chỉ lễ vật liên quan đến tội lỗi và sự thanh tẩy, chứ không chỉ khái niệm trừu tượng “tội lỗi”. “Lễ chuộc tội” là cách gọi quen thuộc và dễ hiểu; phương án “lễ thanh tẩy” được giữ trong chú thích.
- source_word: בְּאֶצְבָּעוֹ
  choice: dùng ngón tay
  rationale: 'Giới từ בְּ chỉ phương tiện: thầy tế lễ dùng ngón tay để lấy và bôi huyết.'
- source_word: וְנָתַן
  choice: bôi
  rationale: נתן có nghĩa rộng là đặt hoặc đưa; trong thao tác dùng ngón tay đưa huyết lên sừng bàn thờ, “bôi” diễn đạt hành động nghi lễ tự nhiên và chính xác.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: lên các sừng của bàn thờ dâng lễ thiêu
  rationale: Giữ hình ảnh cụ thể “các sừng” là những phần nhô ra của bàn thờ, đồng thời xác định đây là bàn thờ dùng để dâng lễ thiêu.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: toàn bộ huyết của nó
  rationale: כָּל biểu thị toàn thể. Dù theo trình tự đây là lượng huyết còn lại sau khi đã lấy một ít, bản dịch giữ nguyên cách nói “toàn bộ huyết” của tiếng Hê-bơ-rơ.
- source_word: יִשְׁפֹּךְ
  choice: đổ
  rationale: Diễn tả hành động có chủ ý trong nghi lễ, không mang nghĩa làm đổ do sơ ý.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: xuống chân bàn thờ
  rationale: יְסוֹד là nền hoặc phần chân; “chân bàn thờ” tự nhiên trong tiếng Việt và phù hợp với vị trí nhận huyết.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: Trong ngữ cảnh này, từ chắc chắn chỉ một loại lễ vật, nhưng tên gọi có thể nhấn mạnh mối liên hệ với tội lỗi hoặc chức năng thanh tẩy. Bản chính dùng cách gọi quen thuộc “lễ chuộc tội”, đồng thời chú thích phương án “lễ thanh tẩy” để không xóa bỏ sắc thái từ vựng thực sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyết” thay vì “máu” để phù hợp ngữ vực nghi lễ, nhưng cấu trúc câu vẫn tự nhiên; giữ các thuật ngữ cụ thể “sừng”, “bàn thờ” và “lễ thiêu” của văn bản nguồn.
