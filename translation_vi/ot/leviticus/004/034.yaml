  source_fidelity: Bản dịch phản ánh đúng trình tự mệnh lệnh nghi lễ, tính phân lượng của מִן trong “một ít huyết,” hành động bôi huyết lên các sừng bàn thờ, và tính toàn thể của “toàn bộ huyết của nó.” “Lễ chuộc tội” là cách gọi đã ổn định cho חַטָּאת, đồng thời chú thích bảo lưu lựa chọn “lễ thanh tẩy.” Cần chỉnh giới từ/vị trí ở vế cuối để diễn đạt sát và tự nhiên hơn cho אֶל יְסוֹד הַמִּזְבֵּחַ.
  naturalness: Câu văn hiện đại, trang trọng và dễ hiểu. Tuy nhiên, “đổ ... xuống chân bàn thờ” hơi gượng trong tiếng Việt và có thể khiến “chân” được hiểu là các bộ phận đỡ của bàn thờ. “Đổ ... tại chân bàn thờ” tự nhiên hơn, đồng thời diễn đạt vị trí ở nền/chân bàn thờ.
  terminology: Các thuật ngữ “thầy tế lễ,” “huyết,” “lễ chuộc tội,” “sừng,” và “lễ thiêu” phù hợp ngữ vực nghi lễ Kinh Thánh. Chú thích về phạm vi ngữ nghĩa của חַטָּאת là cân bằng và không áp đặt cách hiểu giáo phái.
