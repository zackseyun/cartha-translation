  to: Sau đó, thầy tế lễ phải dùng ngón tay lấy một ít huyết của lễ chuộc tội[a], bôi lên các sừng của bàn thờ dâng lễ thiêu, rồi đổ toàn bộ huyết của nó tại chân bàn thờ.
