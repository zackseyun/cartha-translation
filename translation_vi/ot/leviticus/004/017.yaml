  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: vi
  text: Rồi thầy tế lễ phải nhúng ngón tay vào huyết, rồi rảy huyết bảy lần trước mặt Yahweh, hướng về phía bức màn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “màn ngăn” hoặc “màn che”. Từ Hê-bơ-rơ này chỉ bức màn trong nơi thánh, dùng để ngăn cách các khu vực thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: Rồi ... phải nhúng
  rationale: Động từ טבל có nghĩa là “nhúng”; “rồi” thể hiện trình tự của nghi thức, còn “phải” phù hợp với tính chất chỉ dẫn trong văn mạch luật tế lễ.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, quen thuộc trong tiếng Việt hiện đại đối với chức vụ כֹּהֵן trong nghi lễ Israel.
- source_word: אֶצְבָּעוֹ
  choice: ngón tay mình
  rationale: Giữ nguyên số ít và chỉ rõ ngón tay thuộc về chính thầy tế lễ.
- source_word: מִן הַדָּם
  choice: vào một phần huyết
  rationale: 'Giới từ מִן ở đây có thể mang sắc thái phân lượng: ngón tay được nhúng vào một phần trong lượng huyết dùng cho nghi thức. “Huyết” giữ sắc thái trang trọng, tế lễ.'
- source_word: וְהִזָּה
  choice: và rảy một phần huyết ấy
  rationale: Trong văn mạch tế lễ, הזה chỉ hành động rảy chất lỏng. Tân ngữ được hiểu ngầm từ văn cảnh nên được nêu rõ bằng “một phần huyết ấy” để câu tiếng Việt tự nhiên.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Chuyển ngữ trực tiếp và tự nhiên.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי diễn tả hành động diễn ra trước mặt hoặc trong sự hiện diện của Yahweh; cách dịch này giữ được sắc thái không gian và nghi lễ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: ở phía trước bức màn
  rationale: Cụm từ nói đến mặt trước hoặc khu vực phía trước bức màn nơi thánh; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh không gian của nguyên văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn danh này thay vì chuyển thành tước hiệu hoặc dùng một lối phiên âm khác.
- issue: Cách dịch פָּרֹכֶת
  choice: bức màn
  alternative: màn ngăn / tấm màn che
  rationale: Từ này chỉ bức màn trong nơi thánh, phân cách không gian thánh. “Bức màn” dễ hiểu trong tiếng Việt hiện đại, còn chú thích làm rõ chức năng chuyên biệt của nó.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu, phù hợp với chỉ dẫn nghi lễ. Dùng “huyết” thay cho “máu” để giữ sắc thái tế lễ quen thuộc; duy trì danh riêng Yahweh và tránh thêm diễn giải giáo phái.
