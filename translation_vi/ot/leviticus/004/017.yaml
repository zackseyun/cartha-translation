revisions:
- from: Rồi thầy tế lễ phải nhúng ngón tay mình vào một phần huyết và rảy một phần huyết ấy bảy lần trước mặt Yahweh, ở phía trước bức màn[a].
  to: Rồi thầy tế lễ phải nhúng ngón tay vào huyết, rồi rảy huyết bảy lần trước mặt Yahweh, hướng về phía bức màn[a].
  rationale: Bản sửa loại bỏ ý phân lượng không cần thiết, làm câu tiếng Việt tự nhiên hơn, và diễn đạt rõ hướng rảy về phía mặt trước bức màn. Danh Yahweh và các thuật ngữ nghi lễ chủ yếu được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ đúng chủ thể, trình tự nghi lễ, số lần, danh Yahweh và bức màn. Tuy nhiên, “nhúng ... vào một phần huyết” không tự nhiên và diễn giải מִן־הַדָּם như một phần huyết riêng biệt; tiếng Việt có thể diễn đạt trung tính hơn là “nhúng ... vào huyết”. “Rảy một phần huyết ấy” cũng thêm ý phân lượng và chỉ định không cần thiết. Cụm אֵת פְּנֵי הַפָּרֹכֶת nêu hướng về/mặt trước bức màn, nên “hướng về phía bức màn” phản ánh quan hệ không gian rõ hơn.
  naturalness: “Một phần huyết” lặp lại hai lần gây gượng trong tiếng Việt hiện đại. “Nhúng ngón tay vào huyết, rồi rảy huyết” là cách diễn đạt trang trọng, rõ ràng và tự nhiên trong văn cảnh nghi lễ.
  terminology: “Thầy tế lễ”, “huyết”, “rảy”, “Yahweh” và “bức màn” phù hợp với văn phong tế lễ trang trọng. Chú thích nên gọi đây là bức màn của nơi thánh và tránh cách nói “phân cách không gian thánh” hơi trừu tượng.
  issues:
  - severity: medium
    issue: “vào một phần huyết” và “một phần huyết ấy” diễn giải quá mức giới từ מִן־הַדָּם.
    rationale: Nguyên văn chỉ nói nhúng ngón tay từ/vào huyết; trong tiếng Việt, “một phần huyết” gợi một phần đã được phân định riêng, điều không được nêu rõ.
  - severity: low
    issue: “ở phía trước bức màn” có thể được hiểu như một vị trí độc lập hơn là hướng rảy.
    rationale: Cụm Hê-bơ-rơ gắn hành động rảy với mặt trước bức màn; “hướng về phía bức màn” làm rõ hướng mà không thêm chi tiết.
  - severity: low
    issue: Câu chú thích “phân cách không gian thánh” chưa thật tự nhiên.
    rationale: “Ngăn cách các khu vực thánh” tự nhiên hơn và vẫn chỉ giải thích tham chiếu kiến trúc của thuật ngữ.
  revised_text: Rồi thầy tế lễ phải nhúng ngón tay vào huyết, rồi rảy huyết bảy lần trước mặt Yahweh, hướng về phía bức màn[a].
  revised_footnotes:
