source:
  edition: WLC
  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: vi
  text: Còn da con bò đực[a] và tất cả thịt của nó, kể cả đầu và chân, cùng với bộ lòng[b] và phân của nó—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con bò tơ đực.”
    reason: lexical_alternative
  - marker: b
    text: Hay “nội tạng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: da
  rationale: “Da” là cách gọi tự nhiên và chính xác trong tiếng Việt đối với lớp da của con vật đã bị giết; ngữ cảnh hiến tế làm rõ ý nghĩa.
- source_word: הַפָּר
  choice: con bò đực
  rationale: פַּר chỉ bò đực, thường có thể là bò đực còn non; bản dịch chính giữ cách gọi gọn và rõ.
- source_word: כָּל בְּשָׂרוֹ
  choice: tất cả thịt của nó
  rationale: Giữ nghĩa cụ thể của בָּשָׂר trong ngữ cảnh phân chia thân thể con vật, thay vì khái quát thành “toàn thân”.
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: kể cả đầu và chân
  rationale: Trong cấu trúc liệt kê này, עַל mang ý bao gồm các phần ấy cùng với toàn bộ thịt; “kể cả” diễn đạt quan hệ tự nhiên hơn trong tiếng Việt so với dịch máy móc là “trên”.
- source_word: וְקִרְבּוֹ
  choice: cùng với bộ lòng
  rationale: קֶרֶב trong ngữ cảnh giải phẫu tế lễ chỉ các phần bên trong; “bộ lòng” cụ thể, dễ hiểu và phân biệt được với phân.
- source_word: וּפִרְשׁוֹ
  choice: và phân của nó
  rationale: פֶּרֶשׁ chỉ chất thải, tức phân, chứ không phải nội tạng hay các phần bỏ đi nói chung.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Còn” để nối phần này với các chỉ dẫn trước đó, và giữ dấu gạch ngang cuối câu vì cú pháp tiếp tục sang câu 12.
