id: LEV.4.22
reference: Leviticus 4:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: vi
  text: Khi một người lãnh đạo[a] phạm tội, vô ý[b] làm một trong những điều mà Yahweh, Đức Chúa Trời của người ấy, đã truyền không được làm, và mắc tội,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thủ lĩnh” hoặc “người cai trị”; từ Hê-bơ-rơ נָשִׂיא chỉ một người lãnh đạo hay người đứng đầu được công nhận.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “do sơ suất” hoặc “không chủ ý”; từ Hê-bơ-rơ nói đến một hành vi sai phạm không cố ý.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Từ này chỉ một người đứng đầu hay thủ lĩnh được công nhận, không nhất thiết là hoàng tử hoặc vua; “người lãnh đạo” rõ nghĩa và phù hợp với ngữ cảnh luật tế lễ.
- source_word: יֶחֱטָא
  choice: phạm tội
  rationale: Giữ cách diễn đạt trực tiếp của động từ חטא và dùng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: וְעָשָׂה אַחַת מִכָּל
  choice: làm một trong những điều
  rationale: 'Diễn đạt tự nhiên ý nghĩa phân bộ: thực hiện một hành vi thuộc số những điều bị cấm.'
- source_word: מִצְוֺת יְהוָה אֱלֹהָיו אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: những điều mà Yahweh, Đức Chúa Trời của người ấy, đã truyền không được làm
  rationale: Kết hợp ý “các điều răn” với mệnh đề quan hệ chỉ những việc không được làm, đồng thời giữ đại từ sở hữu trong אֱלֹהָיו.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: בִּשְׁגָגָה
  choice: vô ý
  rationale: Trong luật tế lễ Lê-vi, từ này nói đến hành vi sai phạm không chủ ý hoặc do sơ suất.
- source_word: וְאָשֵׁם
  choice: và trở nên có tội
  rationale: Phản ánh trạng thái mắc tội phát sinh sau hành vi vi phạm mà không thêm từ nối giải thích quan hệ nhân quả.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; hoặc thay bằng tước hiệu CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn tính chất danh riêng thay vì âm thầm thay bằng một tước hiệu.
- issue: Ý nghĩa của וְאָשֵׁם
  choice: trở nên có tội
  alternative: mắc tội; chịu tội
  rationale: Cách dịch này giữ trọng tâm ở tình trạng có tội do hành vi vi phạm, không diễn giải thêm về hình phạt hay cảm giác chủ quan.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “người lãnh đạo” để người đọc phổ thông dễ hiểu. Dấu chú thích được đặt ngay sau đúng từ ngữ mà mỗi chú thích giải thích. Câu kết bằng dấu phẩy vì câu Hê-bơ-rơ tiếp tục sang phần quy định ở câu kế tiếp.
