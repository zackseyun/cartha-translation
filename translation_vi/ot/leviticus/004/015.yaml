id: LEV.4.15
reference: Leviticus 4:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: vi
  text: Các trưởng lão của hội chúng phải đặt tay mình trên đầu con bò đực trước mặt Yahweh; rồi người ấy phải giết[a] con bò đực trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn chuyển từ chủ thể số nhiều “các trưởng lão” sang động từ số ít “người ấy phải giết”; người thực hiện không được nêu rõ. Cũng có thể dịch: “rồi con bò đực phải bị giết trước mặt Yahweh.”'
    reason: Giải thích sự chuyển đổi số ngữ pháp và cung cấp cách dịch bị động không xác định chủ thể.
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: phải đặt
  rationale: Trong nghi thức tế lễ, סמך chỉ hành động đặt hoặc tì tay trên lễ vật. “Đặt tay” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: זִקְנֵי הָעֵדָה
  choice: các trưởng lão của hội chúng
  rationale: זִקְנֵי là “các trưởng lão”, còn עֵדָה chỉ cộng đồng giao ước được tập hợp; “hội chúng” giữ được sắc thái cộng đồng trang trọng của sách Lê-vi.
- source_word: אֶת יְדֵיהֶם
  choice: tay mình
  rationale: Tiếng Hê-bơ-rơ dùng danh từ số nhiều với hậu tố ngôi thứ ba số nhiều. Trong tiếng Việt, “đặt tay mình” diễn đạt tự nhiên hành động chung mà không buộc phải hiểu mỗi người dùng cả hai tay.
- source_word: עַל רֹאשׁ הַפָּר
  choice: trên đầu con bò đực
  rationale: Bản dịch trực tiếp cụm chỉ vị trí; פַּר ở đây là bò đực dùng làm sinh tế.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי có nghĩa “trước mặt/trong sự hiện diện của”; “trước mặt” vừa chính xác vừa tự nhiên trong quy định tế lễ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng bốn phụ âm Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: וְשָׁחַט
  choice: rồi người ấy phải giết
  rationale: Động từ ở ngôi thứ ba giống đực số ít, dù chủ thể trước đó là “các trưởng lão”. “Người ấy” bảo tồn sự chuyển đổi sang số ít và không xác định người thực hiện cụ thể.
- source_word: הַפָּר
  choice: con bò đực
  rationale: פַּר chỉ bò đực, có thể là bò đực non; câu này không đòi hỏi phải thêm sắc thái tuổi.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng.
- issue: Sự chuyển từ chủ thể số nhiều sang động từ số ít וְשָׁחַט
  choice: 'giữ số ít: “người ấy phải giết”'
  alternative: “họ phải giết”; “con bò đực phải bị giết”
  rationale: Bản Hê-bơ-rơ chuyển từ “các trưởng lão” số nhiều sang động từ số ít. Giữ số ít bảo tồn nét căng và sự không xác định của nguyên văn, có thể hàm ý một người đại diện nhưng không nói rõ là ai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hội chúng” cho cộng đồng phụng tự, “con bò đực” thay cho thuật ngữ quá chuyên biệt, và giữ danh Yahweh. Dấu chú thích [a] đặt ngay sau mệnh đề có điểm không rõ trong nguyên văn.
