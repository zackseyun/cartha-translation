  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: các trưởng lão của hội chúng, hành động đặt tay lên đầu con bò đực, và việc diễn ra trước mặt Yahweh. Cách dùng “người ấy” giữ được động từ số ít chủ động וְשָׁחַט sau chủ ngữ số nhiều, không biến nó thành số nhiều. Chú thích cũng nêu đúng sự bất thường về số và cách diễn đạt bị động như một khả năng dịch thay thế.'
