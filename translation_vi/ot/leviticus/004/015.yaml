  terminology: “Trưởng lão”, “hội chúng”, “con bò đực”, và “trước mặt Yahweh” đều nhất quán, chính xác và có sắc thái phù hợp. Giữ “Yahweh” phản ánh trực tiếp danh יהוה. “Giết” truyền đạt שׁחט rõ ràng; trong bối cảnh tế lễ, đây không phải cách dùng thô tục.
