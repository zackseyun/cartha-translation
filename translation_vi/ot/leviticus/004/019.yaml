translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Người ấy” tiếp nối chủ thể thực hiện nghi lễ từ ngữ cảnh trước; “thiêu” giữ sắc thái hiến tế mà không quá nặng tính thuật ngữ.
