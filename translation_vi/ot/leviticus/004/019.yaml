  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: vi
  text: Người ấy phải lấy hết mỡ ra khỏi con vật và thiêu trên bàn thờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát hơn: “làm cho bốc thành khói trên bàn thờ.” Động từ Hê-bơ-rơ đặc biệt chỉ việc làm cho lễ vật bốc thành khói trong nghi thức hiến tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: và
  rationale: Liên từ nối hành động này với trình tự nghi lễ ở câu trước; dấu chỉ trực bổ ngữ không cần dịch riêng trong tiếng Việt.
- source_word: כָּל
  choice: hết
  rationale: 'Diễn đạt tính toàn thể: toàn bộ phần mỡ được chỉ định phải được lấy ra.'
- source_word: חֶלְבּוֹ
  choice: mỡ của con vật
  rationale: Hậu tố giống đực số ít quy chiếu về con vật hiến tế; cách nói này tự nhiên và tránh đại từ có thể mơ hồ trong tiếng Việt.
- source_word: יָרִים
  choice: phải lấy ... ra
  rationale: Dạng Hiphil của רום có nghĩa nâng lên hoặc lấy đi; trong ngữ cảnh tế lễ, hành động là tách phần mỡ khỏi con vật.
- source_word: מִמֶּנּוּ
  choice: của con vật ra
  rationale: Giới từ biểu thị sự tách khỏi con vật hiến tế; tiếng Việt tự nhiên dùng kết cấu “lấy ... của con vật ra”.
- source_word: וְהִקְטִיר
  choice: và thiêu
  rationale: Trong ngôn ngữ tế lễ, הקטיר chỉ việc làm cho lễ vật bốc thành khói; “thiêu” vừa tự nhiên vừa giữ sắc thái nghi lễ rõ hơn từ “đốt” chung chung.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Dù hậu tố chỉ hướng có thể gợi chuyển động về phía bàn thờ, kết hợp với הקטיר, tiếng Việt tự nhiên diễn đạt nơi thiêu lễ vật là “trên bàn thờ”.
