id: LEV.4.14
reference: Leviticus 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: vi
  text: và tội họ đã phạm bị phát hiện[a], thì hội chúng phải dâng một con bò đực trong đàn làm lễ vật tạ tội và đem nó đến trước Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong tiếng Hê-bơ-rơ, cùng một từ חַטָּאת (ḥaṭṭā’t) được dùng hai lần trong câu này: lần đầu có nghĩa là “tội”, lần sau là “lễ vật tạ tội”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: bị phát hiện
  rationale: Dạng Niphal của ידע diễn tả việc tội lỗi trở nên được biết đến mà không nêu tác nhân; “bị phát hiện” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh.
- source_word: הַחַטָּאת
  choice: tội
  rationale: Mệnh đề theo sau “họ đã phạm” xác định từ này là hành vi phạm tội, không phải lễ vật.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: họ đã phạm
  rationale: Diễn đạt tự nhiên quan hệ giữa động từ חטא và danh từ “tội” mà không chuyển giới từ על một cách máy móc.
- source_word: הַקָּהָל
  choice: hội chúng
  rationale: Giữ nghĩa tập thể được triệu tập trong bối cảnh nghi lễ-pháp lý, đồng thời là cách nói trang trọng và dễ hiểu.
- source_word: וְהִקְרִיבוּ
  choice: phải dâng
  rationale: Trong ngữ cảnh hiến tế, Hiphil của קרב chỉ việc đưa lễ vật đến để dâng; “dâng” rõ nghĩa nghi lễ và phân biệt được với động từ “đem” theo sau.
- source_word: פַּר בֶּן בָּקָר
  choice: một con bò đực trong đàn
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ một con bò đực thuộc đàn gia súc, không mặc nhiên thêm ý “bò tơ” vốn không được nói rõ tại đây.
- source_word: לְחַטָּאת
  choice: làm lễ vật tạ tội
  rationale: Ở lần xuất hiện này, חַטָּאת chỉ loại lễ vật hiến tế; cách dịch nêu rõ chức năng nghi lễ.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: và đem nó
  rationale: Động từ Hiphil của בוא mang nghĩa “đem”; đại từ chỉ lại con bò đực.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: đến trước Lều Hội Kiến
  rationale: Giữ đúng địa điểm nghi lễ và dịch אֹהֶל theo nghĩa trực tiếp là “lều”, không thay bằng thuật ngữ truyền thống mang tính diễn giải hơn.
theological_decisions:
- issue: Hai nghĩa của חַטָּאת trong cùng một câu
  choice: Dịch lần đầu là “tội”, lần sau là “lễ vật tạ tội”
  alternative: Dịch đồng nhất cả hai lần là “tội” hoặc “lễ vật tạ tội”; hoặc dùng “lễ vật thanh tẩy” ở lần sau
  rationale: Ngữ cảnh buộc lần đầu chỉ hành vi mà dân đã phạm, còn lần sau chỉ loại lễ vật được dâng. Phân biệt hai nghĩa giúp câu rõ ràng mà không áp đặt một cách hiểu thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ “và” ở đầu câu để phản ánh sự tiếp nối cú pháp từ câu trước; dùng “phải” để thể hiện sắc thái quy định của lời chỉ dẫn.
