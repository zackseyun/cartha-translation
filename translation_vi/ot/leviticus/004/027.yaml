revisions:
- from: Nếu một người trong dân thường[a] vô ý phạm tội vì làm một trong những điều răn của Yahweh mà người ta không được làm, và mắc tội[b],
  to: Nếu một người trong dân thường[a] vô ý phạm tội khi làm một trong các điều Yahweh đã truyền không được làm, và mắc tội[b],
  rationale: Bản sửa làm rõ rằng hành vi bị cấm là «các điều Yahweh đã truyền không được làm», thay vì để mệnh đề quan hệ có vẻ bổ nghĩa cho «điều răn». «Khi làm» phản ánh tự nhiên hơn quan hệ hoàn cảnh của tiếng Hê-bơ-rơ. Chú thích a được chỉnh để bảo tồn đầy đủ phương án sát nghĩa, trong khi bản văn chính vẫn dùng «dân thường» theo chức năng ngữ cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:35Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng chủ thể số ít, tính vô ý, phạm trù «dân thường», danh Yahweh, và tình trạng có tội. Tuy nhiên, «vì làm» làm quan hệ của בַּעֲשֹׂתָהּ nghiêng về nguyên nhân hơn là hoàn cảnh/cách thức; đồng thời «một trong những điều răn ... mà người ta không được làm» có tiền ngữ không rõ trong tiếng Việt, như thể chính các điều răn là vật «không được làm».
  naturalness: Câu văn nhìn chung trang trọng, tự nhiên và phù hợp vì câu điều kiện còn tiếp diễn sang câu sau. Đổi sang «khi làm» và «các điều Yahweh đã truyền không được làm» giúp câu rõ ràng, tự nhiên hơn mà không thêm diễn giải.
  terminology: «Dân thường» diễn đạt phù hợp chức năng xã hội-pháp lý của מֵעַם הָאָרֶץ trong ngữ cảnh này; chú thích nên nêu chính xác phương án sát nghĩa là «từ dân trong xứ». «Mắc tội» là cách nói tự nhiên cho וְאָשֵׁם và chú thích bảo lưu các sắc thái khả dĩ.
  issues:
  - severity: medium
    issue: Mệnh đề quan hệ sau «điều răn» mơ hồ
    rationale: Cụm «một trong những điều răn của Yahweh mà người ta không được làm» về ngữ pháp tiếng Việt có thể hiểu rằng «điều răn» là đối tượng không được làm. Hebrew dùng công thức chỉ các điều Yahweh truyền không được làm; cần làm rõ đối tượng của lệnh cấm.
  - severity: low
    issue: «vì làm» chưa phản ánh tối ưu quan hệ của בַּעֲשֹׂתָהּ
    rationale: Giới từ בְּ với bất định thức ở đây chỉ hoàn cảnh/cách thức của việc phạm tội. «Khi làm» giữ quan hệ này tự nhiên hơn «vì làm», vốn dễ biểu thị nguyên nhân.
  - severity: low
    issue: Chú thích a thiếu ý «từ» trong phương án sát nghĩa
    rationale: מֵעַם có nghĩa «từ [dân]»; chú thích hiện ghi «thuộc dân trong xứ», không phải là phương án sát nghĩa đã nêu.
