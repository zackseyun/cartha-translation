id: LEV.4.27
reference: Leviticus 4:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: vi
  text: Nếu một người trong dân thường[a] vô ý phạm tội khi làm một trong các điều Yahweh đã truyền không được làm, và mắc tội[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “từ dân trong xứ.” Ở đây, cụm từ này chỉ một thành viên bình thường của cộng đồng, trái với thầy tế lễ hoặc người lãnh đạo trong các luật xung quanh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trở nên có tội” hoặc “phải mang tội.” Động từ Hê-bơ-rơ có thể diễn tả việc rơi vào tình trạng có tội hoặc mang trách nhiệm về tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: một người
  rationale: Trong văn cảnh luật pháp, נֶפֶשׁ chỉ một cá nhân; “một người” tự nhiên và giữ được số ít.
- source_word: תֶּחֱטָא
  choice: phạm tội
  rationale: Diễn đạt trực tiếp động từ חטא bằng cách nói thông dụng, trang trọng trong tiếng Việt.
- source_word: בִשְׁגָגָה
  choice: vô ý
  rationale: Chỉ hành vi sai phạm không cố ý trong văn cảnh luật tế lễ.
- source_word: מֵעַם הָאָרֶץ
  choice: trong dân thường
  rationale: Trong mạch văn, cụm từ chỉ một thành viên bình thường của cộng đồng, đối lập với thầy tế lễ hoặc người lãnh đạo; chú thích giữ nghĩa sát chữ.
- source_word: בַּעֲשֹׂתָהּ
  choice: vì làm
  rationale: Giữ quan hệ giữa việc phạm tội và hành vi vi phạm, đồng thời tự nhiên trong tiếng Việt.
- source_word: אַחַת מִמִּצְוֺת יְהוָה
  choice: một trong những điều răn của Yahweh
  rationale: 'Phản ánh cấu trúc bộ phận: một điều thuộc toàn bộ các điều răn của Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: mà người ta không được làm
  rationale: Truyền đạt rõ sức bắt buộc của điều cấm và giữ cách diễn đạt phiếm chỉ của thể bị động Hebrew.
- source_word: וְאָשֵׁם
  choice: và mắc tội
  rationale: Có thể chỉ việc rơi vào tình trạng có tội hoặc phải mang tội; “mắc tội” giữ được sắc thái kết quả mà không giải thích quá mức.
theological_decisions:
- issue: Ý nghĩa của מֵעַם הָאָרֶץ trong luật tế lễ
  choice: trong dân thường
  alternative: thuộc dân trong xứ
  rationale: Cách chọn thể hiện phạm trù xã hội-pháp lý của một người Israel bình thường trong tương quan với thầy tế lễ, toàn hội chúng và người lãnh đạo ở các đoạn lân cận, đồng thời chú thích bảo tồn nghĩa sát chữ.
- issue: Sắc thái của וְאָשֵׁם
  choice: và mắc tội
  alternative: và trở nên có tội / và phải mang tội
  rationale: Bản dịch giữ diễn tiến từ hành vi vi phạm đến tình trạng có tội, nhưng không quyết định dứt khoát giữa việc bước vào tình trạng có tội và mang trách nhiệm về tội.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ dạng điều kiện chưa hoàn tất vì nội dung tiếp tục sang câu sau; dùng “dân thường” theo nghĩa một thành viên bình thường của cộng đồng, không mang sắc thái miệt thị.
