reference: Leviticus 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: vi
  text: Người sẽ lấy một phần huyết bôi lên các sừng của bàn thờ ở trước Yahweh, là bàn thờ ở trong Lều Hội Kiến; rồi sẽ đổ toàn bộ huyết tại chân bàn thờ của lễ thiêu, là bàn thờ ở lối vào Lều Hội Kiến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: lấy một phần huyết
  rationale: Cụm Hê-bơ-rơ theo sát mặt chữ là “từ huyết”; “một phần” diễn đạt rõ nghĩa bộ phận, đối lập với “tất cả huyết” ở vế sau.
- source_word: יִתֵּן
  choice: bôi
  rationale: Động từ נתן cơ bản là “đặt/để”; trong nghi thức bôi huyết lên sừng bàn thờ, “bôi” tự nhiên và nêu đúng hành động trong tiếng Việt.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: các sừng của bàn thờ
  rationale: Giữ hình ảnh cụ thể “sừng”, là thuật ngữ nghi lễ chỉ các phần nhô ra ở bốn góc bàn thờ.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: ở trước mặt Đức Giê-hô-va
  rationale: לִפְנֵי vừa chỉ vị trí “ở trước” vừa có sắc thái hiện diện; “ở trước mặt” giữ được cả hai nét nghĩa.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi ngắn gọn, trang trọng và quen thuộc cho lều thánh nơi Đức Chúa Trời gặp dân Ngài.
- source_word: וְאֵת כָּל הַדָּם
  choice: còn tất cả huyết
  rationale: Giữ nguyên “tất cả huyết” của bản Hê-bơ-rơ, dù theo ngữ cảnh đó là lượng huyết còn lại; “còn” làm rõ sự chuyển sang hành động kế tiếp mà không đổi định lượng của nguyên văn.
- source_word: יִשְׁפֹּךְ
  choice: đổ
  rationale: Diễn đạt trực tiếp và tự nhiên hành động đổ huyết trong nghi thức.
- source_word: אֶל יְסוֹד
  choice: nơi chân
  rationale: יְסוֹד là nền hoặc phần chân đế; “nơi chân bàn thờ” là cách nói tự nhiên, dễ hình dung trong tiếng Việt.
- source_word: מִזְבַּח הָעֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: Nêu rõ đây là bàn thờ dùng để dâng עֹלָה, tức lễ vật được thiêu trên bàn thờ.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: ở lối vào Lều Hội Kiến
  rationale: פֶּתַח chỉ cửa mở hoặc lối vào; “lối vào” là cách diễn đạt hiện đại và rõ về vị trí.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước. Bản dịch giữ đây là danh riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng Việt hóa trang trọng, quen thuộc với độc giả phổ thông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; duy trì thuật ngữ nghi lễ “huyết”, “sừng của bàn thờ”, “lễ thiêu” và “Lều Hội Kiến”. Đại từ “ông” tiếp nối chủ thể tư tế được hàm ẩn trong động từ Hê-bơ-rơ.
