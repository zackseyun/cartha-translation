  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: vi
  text: Hoặc nếu người ấy được cho biết về tội mình đã phạm, thì người ấy phải đem lễ vật của mình là một con dê đực không tì vết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֽוֹ
  choice: hoặc
  rationale: Liên từ phân cách đơn giản, tiếp nối trường hợp luật định từ câu trước.
- source_word: הוֹדַע אֵלָיו
  choice: được báo cho người ấy biết
  rationale: 'Dạng Hophal của ידע mang nghĩa bị động: người ấy được người khác cho biết về tội mình, chứ không nhất thiết tự nhận ra.'
- source_word: חַטָּאתוֹ
  choice: tội người ấy
  rationale: Ở đây חַטָּאת chỉ hành vi phạm tội, không phải lễ vật chuộc tội; hậu tố sở hữu được giữ lại tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: đã phạm
  rationale: Mệnh đề quan hệ xác định tội đang nói đến; giới từ בָּהּ đi với חטא mang tính thành ngữ và không cần dịch riêng trong tiếng Việt.
- source_word: וְהֵבִיא
  choice: thì người ấy phải đem
  rationale: Trong văn luật, waw cùng động từ hoàn thành diễn tả hệ quả và nghĩa vụ được quy định; “thì... phải” rõ ràng, tự nhiên.
- source_word: קָרְבָּנוֹ
  choice: làm lễ vật
  rationale: קָרְבָּן là vật được đem dâng; cách nói này phù hợp cú pháp tiếng Việt sau động từ “đem”.
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: một con dê đực
  rationale: Cụm từ chỉ một con dê giống đực; bản dịch giữ rõ giới tính của con vật.
- source_word: תָּמִים
  choice: không tì vết
  rationale: Thuật ngữ tế lễ quen thuộc, chỉ con vật không có khuyết tật.
theological_decisions:
- issue: Nghĩa của חַטָּאת trong câu này
  choice: tội, tức hành vi phạm tội
  alternative: lễ vật chuộc tội
  rationale: Mệnh đề “đã phạm” cho thấy từ này chỉ tội lỗi; lễ vật được gọi riêng là קָרְבָּנוֹ ở phần sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc điều kiện-hệ quả của luật tế lễ, đồng thời tránh lối diễn đạt cổ hoặc quá chuyên môn.
