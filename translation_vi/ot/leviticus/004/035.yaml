base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: vi
  text: Người ấy phải lấy hết mỡ của nó ra, như cách lấy mỡ của con chiên ra khỏi sinh tế bình an. Rồi thầy tế lễ phải thiêu các phần mỡ ấy trên bàn thờ, cùng với các lễ vật được dâng bằng lửa cho Yahweh.[a] Như vậy, thầy tế lễ sẽ làm lễ chuộc tội cho người ấy về tội người ấy đã phạm, và người ấy sẽ được tha thứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm Hê-bơ-rơ này là một thuật ngữ tế lễ; cũng có thể dịch: “các hỏa lễ dâng lên Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: mỡ
  rationale: Chỉ phần mỡ của con vật được tách ra để dâng trên bàn thờ; “mỡ” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: יָסִיר / יוּסַר
  choice: lấy ... ra
  rationale: Trong quy trình tế lễ, động từ diễn tả việc tách phần mỡ khỏi con vật; cách nói này tự nhiên hơn “loại bỏ” mà vẫn giữ đúng hành động nghi lễ.
- source_word: הַכֶּשֶׂב
  choice: con chiên
  rationale: Trong ngữ cảnh hiến tế, từ này chỉ một con thuộc loài chiên, thường là chiên non; “con chiên” giữ được cách gọi quen thuộc mà không khẳng định độ tuổi khi câu này không nêu rõ.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sinh tế bình an
  rationale: Giữ đây là tên một loại sinh tế riêng trong hệ thống tế lễ. “Bình an” bảo tồn liên hệ từ nguyên với שלום mà không thu hẹp ý nghĩa chỉ còn sự thông công.
- source_word: וְהִקְטִיר
  choice: phải thiêu
  rationale: Trong ngữ cảnh bàn thờ, động từ nói đến việc đốt phần lễ vật cho bốc khói; “thiêu” ngắn gọn, trang trọng và rõ nghĩa.
- source_word: אֹתָם
  choice: các phần mỡ ấy
  rationale: Đại từ Hê-bơ-rơ ở số nhiều. Việc nói rõ “các phần mỡ ấy” vừa phản ánh số nhiều vừa tránh đại từ tiếng Việt mơ hồ sau danh từ tập hợp “mỡ”.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Hình thái chỉ hướng trong câu này được diễn đạt tự nhiên theo nơi diễn ra việc thiêu lễ vật.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: bên trên các lễ vật dùng lửa dâng lên Yahweh
  rationale: עַל được giữ với nghĩa vị trí “bên trên”; אִשֵּׁי là thuật ngữ tế lễ chỉ những lễ vật được dâng bằng lửa, thay vì bị diễn giải hẹp thành thức ăn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được viết trong bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: וְכִפֶּר עָלָיו
  choice: sẽ làm lễ chuộc tội cho người ấy
  rationale: Giữ nguyên phạm trù nghi lễ-thần học của כפר, không áp đặt một lý thuyết chuộc tội cụ thể.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: về tội người ấy đã phạm
  rationale: Diễn đạt tự nhiên quan hệ giữa nghi thức chuộc tội và hành vi phạm tội, đồng thời giữ sự lặp ý có chủ đích của nguyên văn.
- source_word: וְנִסְלַח לוֹ
  choice: người ấy sẽ được tha thứ
  rationale: Thể bị động phản ánh kết quả của nghi thức mà không bổ sung chủ thể không được nói rõ trong câu.
theological_decisions:
- issue: Ngôn ngữ chuộc tội trong nghi lễ
  choice: làm lễ chuộc tội cho người ấy
  alternative: làm lễ xá tội cho người ấy
  rationale: “Chuộc tội” giữ được độ rộng của thuật ngữ tế lễ כפר và không quyết định thay nguyên văn một mô hình thần học cụ thể.
- issue: Danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה; phiên âm bảo tồn danh này thay vì thay thế bằng tước hiệu.
- issue: Ý nghĩa của זֶבַח הַשְּׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế hiệp thông
  rationale: Thuật ngữ có thể gợi đến bình an, sự toàn vẹn và mối thông công. “Bình an” bảo tồn tên loại tế lễ quen thuộc mà không âm thầm chọn riêng sắc thái “hiệp thông”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để theo dõi chủ thể rõ ràng; dùng “các phần mỡ ấy” nhằm bảo tồn số nhiều của đại từ Hê-bơ-rơ. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
