revisions:
- from: Nếu toàn thể cộng đồng Y-sơ-ra-ên vô ý phạm tội[a], nhưng sự việc ấy khuất khỏi mắt hội chúng[b], và họ làm một trong những điều mà Yahweh đã truyền không được làm, khiến họ mắc tội,
  to: Nếu toàn thể cộng đồng Y-sơ-ra-ên vô ý phạm tội[a], mà sự việc ấy khuất khỏi mắt hội chúng[b], và họ làm một trong những điều mà Yahweh đã truyền không được làm, thì họ mắc tội,
  rationale: 'Sửa hai điểm cú pháp–ngữ nghĩa: thay “nhưng” bằng “mà” để không thêm ý tương phản, và thay “khiến họ mắc tội” bằng “thì họ mắc tội” để chuyển đúng kết quả pháp lý của động từ וְאָשֵׁמוּ. Các chú thích hiện có được giữ nguyên và các neo chú thích vẫn gắn đúng cụm từ được giải thích.'
