id: LEV.4.13
reference: Leviticus 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: vi
  text: Nếu toàn thể cộng đồng Y-sơ-ra-ên vô ý phạm tội[a], mà sự việc ấy khuất khỏi mắt hội chúng[b], và họ làm một trong những điều mà Yahweh đã truyền không được làm, thì họ mắc tội,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ ở đây chỉ việc phạm tội do vô ý hoặc nhầm lẫn, chứ không phải cố tình chống nghịch.
    reason: cultural_note
  - marker: b
    text: 'Nguyên văn: “sự việc ấy khuất khỏi mắt hội chúng”, một thành ngữ có nghĩa là hội chúng không nhận biết sự việc đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: cộng đồng Y-sơ-ra-ên
  rationale: עֵדָה chỉ toàn thể cộng đồng dân giao ước; “cộng đồng” tự nhiên trong tiếng Việt và được phân biệt với הַקָּהָל ở vế sau.
- source_word: יִשְׁגּוּ
  choice: vô ý phạm tội
  rationale: Trong luật tế lễ Lê-vi 4, שׁגה nói đến hành vi sai phạm do vô ý hoặc nhầm lẫn, không phải sự chống nghịch có chủ ý.
- source_word: וְנֶעְלַם דָּבָר
  choice: sự việc ấy khuất
  rationale: Giữ nét nghĩa bị che khuất của thể bị động, đồng thời dùng cách diễn đạt tiếng Việt dễ hiểu.
- source_word: מֵעֵינֵי הַקָּהָל
  choice: khỏi mắt hội chúng
  rationale: Bảo tồn hình ảnh Hê-bơ-rơ về mắt như khả năng nhận biết; “hội chúng” phân biệt קהל với עדה ở đầu câu.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת
  choice: họ làm một trong những điều ... đã truyền không được làm
  rationale: Diễn đạt tự nhiên cấu trúc chỉ một hành vi thuộc số các hành vi bị điều răn cấm, tránh cách dịch máy móc như thể họ “làm một điều răn”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay bằng một tước hiệu.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: không được làm
  rationale: Thể hiện rõ sức cấm đoán của cấu trúc bị động trong tiếng Việt hiện đại.
- source_word: וְאָשֵׁמוּ
  choice: khiến họ mắc tội
  rationale: Diễn tả trạng thái chịu tội phát sinh từ hành vi; “khiến” liên kết kết quả ấy với mệnh đề trước mà không đưa thêm ý niệm chuộc tội.
theological_decisions:
- issue: Tính chất của tội được mô tả bằng שׁגה
  choice: vô ý phạm tội
  alternative: lầm lỗi; đi lạc
  rationale: Ngữ cảnh luật tế lễ trong Lê-vi 4 xác định đây là tội do vô ý hoặc sai lầm, không phải hành vi ngang nhiên chống nghịch.
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ giữa hành vi bị cấm và tình trạng có tội
  choice: khiến họ mắc tội
  alternative: và họ mắc tội; và họ trở nên có tội
  rationale: וְאָשֵׁמוּ chỉ kết quả chịu tội hoặc mắc lỗi; cách dịch này giữ quan hệ kết quả nhưng không giải thích thêm mức độ trách nhiệm.
translation_notes:
  register: Văn phong pháp lý–tế lễ trang trọng nhưng hiện đại. Dùng “cộng đồng” cho עֵדָה và “hội chúng” cho קָהָל để phản ánh hai từ Hê-bơ-rơ khác nhau. Giữ hình ảnh “khuất khỏi mắt” trong chính văn và giải thích thành ngữ ở chú thích.
