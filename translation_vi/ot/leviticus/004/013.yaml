    rationale: Các vế được nối bằng וְ, theo diễn tiến điều kiện, không phải bằng một đối lập giữa việc cộng đồng phạm tội và việc sự việc không được nhận biết.
  - severity: medium
    issue: “Khiến họ mắc tội” chuyển mệnh đề kết quả thành cấu trúc tác khiến.
    rationale: וְאָשֵׁמוּ có nghĩa là “họ mắc/có tội, trở nên có tội”; chủ ngữ trực tiếp ở tình trạng này. “Thì họ mắc tội” vừa sát nghĩa vừa tự nhiên hơn.
