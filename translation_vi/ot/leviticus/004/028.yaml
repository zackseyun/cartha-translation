  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: vi
  text: Hoặc nếu tội mà người ấy đã phạm được cho người ấy biết[a], thì người ấy phải đem một con dê cái không tì vết làm lễ vật vì tội mình đã phạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tội ấy trở nên rõ cho người ấy” hoặc “người ấy được báo cho biết tội mình.” Cấu trúc bị động trong tiếng Hê-bơ-rơ có thể nói đến việc người ấy tự nhận biết hoặc được người khác báo cho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Hoặc nếu
  rationale: Mở đầu một trường hợp thay thế trong chuỗi luật lệ; “Hoặc nếu” diễn đạt tự nhiên cả ý nối kết lẫn điều kiện trong tiếng Việt.
- source_word: הוֹדַע אֵלָיו
  choice: được cho người ấy biết
  rationale: 'Giữ sắc thái bị động của thể Hophal: tội lỗi được đưa đến nhận thức của người ấy, dù qua tự nhận biết hay do người khác báo cho.'
- source_word: חַטָּאתוֹ
  choice: tội người ấy / tội mình
  rationale: Trong cả hai lần xuất hiện, từ này chỉ hành vi phạm tội, không phải lễ vật chuộc tội; đại từ phản thân “mình” ở lần sau giúp câu tiếng Việt tự nhiên mà vẫn cùng quy chiếu.
- source_word: אֲשֶׁר חָטָא
  choice: đã phạm
  rationale: Cách diễn đạt gọn, tự nhiên trong tiếng Việt cho mệnh đề mô tả tội đã được thực hiện.
- source_word: וְהֵבִיא
  choice: thì người ấy phải đem
  rationale: Diễn đạt rõ hệ quả và tính bắt buộc của chỉ thị pháp luật.
- source_word: קָרְבָּנוֹ
  choice: làm lễ vật
  rationale: קָרְבָּן là vật được đem dâng; “làm lễ vật” tự nhiên sau động từ “đem” và không xác định quá mức loại nghi lễ.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: một con dê cái
  rationale: Diễn đạt rõ loài vật và giới tính; tiếng Việt không cần lặp lại yếu tố giống cái như cấu trúc Hê-bơ-rơ.
- source_word: תְּמִימָה
  choice: không tì vết
  rationale: Thuật ngữ tế lễ quen thuộc, chỉ con vật không có khuyết tật.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: vì tội mình đã phạm
  rationale: “Vì” diễn đạt quan hệ của lễ vật đối với tội đã phạm mà không biến חַטָּאת thành tên gọi của lễ vật.
theological_decisions:
- issue: Ý nghĩa của חַטָּאת trong bối cảnh luật tế lễ
  choice: Dịch cả hai lần là “tội”, chỉ hành vi phạm tội.
  alternative: Dịch lần thứ hai là “lễ vật chuộc tội”.
  rationale: Câu đã gọi con dê là קָרְבָּנוֹ, “lễ vật của người ấy”; các cụm חַטָּאתוֹ אֲשֶׁר חָטָא đều nói đến tội mà người ấy đã phạm. Cách dịch này tránh nhập nghĩa “lễ vật chuộc tội” vốn có thể đúng ở những ngữ cảnh khác.
- issue: Tác nhân hoặc cách thức người phạm tội biết tội mình
  choice: Giữ cấu trúc bị động “được cho ... biết”.
  alternative: Dịch xác định hơn là “người ấy nhận ra” hoặc “có người báo cho người ấy”.
  rationale: Nguyên văn không xác định người ấy tự nhận biết hay được người khác thông báo; bản dịch và chú thích giữ nguyên sự rộng nghĩa này.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “người ấy” để giữ quy chiếu ngôi thứ ba rõ ràng; “không tì vết” bảo tồn cách nói tế lễ quen thuộc. Câu giữ sự lặp lại có chủ ý của “tội ... đã phạm” nhưng điều chỉnh đại từ để tiếng Việt tự nhiên.
