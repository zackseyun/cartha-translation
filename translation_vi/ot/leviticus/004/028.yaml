  terminology: “Lễ vật”, “dê cái”, và “không tì vết” phù hợp văn phong luật tế lễ trang trọng, hiện đại. “Vì tội mình đã phạm” diễn đạt được quan hệ của lễ vật với tội mà không gọi חַטָּאת là tên lễ vật.
