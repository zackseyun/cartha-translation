  source_fidelity: Bản dịch giữ đúng chủ thể số ít, hành động đặt tay lên đầu lễ vật chuộc tội, và hành động giết lễ vật. Tuy nhiên, cụm “tại nơi người ta giết lễ vật thiêu” thêm chủ thể phiếm chỉ “người ta” không có trong tiếng Hê-bơ-rơ và chuyển “nơi của lễ toàn thiêu” thành một mệnh đề quan hệ. “Nơi dâng lễ toàn thiêu” diễn đạt địa điểm nghi lễ được chỉ định mà không thêm tác nhân.
