  - severity: low
    issue: “Lễ vật thiêu” chưa phải cách gọi thuật ngữ tự nhiên nhất cho עֹלָה.
    rationale: “Lễ vật toàn thiêu” là cách gọi hiện đại, phổ biến và chính xác hơn cho loại lễ vật được thiêu trọn.
