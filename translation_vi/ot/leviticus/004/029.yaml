  terminology: Giữ “lễ vật chuộc tội” cho חטאת là chấp nhận được trong truyền thống Việt ngữ; chú thích bảo lưu lựa chọn học thuật “lễ vật thanh tẩy.” Đổi “lễ vật thiêu” thành “lễ vật toàn thiêu” để phản ánh thuật ngữ hiến tế ổn định cho עֹלָה.
