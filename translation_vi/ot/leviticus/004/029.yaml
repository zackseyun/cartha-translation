source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: vi
  text: Người ấy phải đặt tay mình trên đầu lễ vật chuộc tội[a] và giết lễ vật chuộc tội tại nơi dâng lễ vật toàn thiêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy.” Từ Hê-bơ-rơ חטאת có thể chỉ lễ vật liên quan đến tội lỗi và sự thanh tẩy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: phải đặt
  rationale: Trong nghi thức hiến tế, סמך chỉ việc đặt hoặc ấn tay lên con vật. “Phải đặt” diễn đạt tự nhiên tính chất chỉ dẫn của luật nghi lễ.
- source_word: יָדוֹ
  choice: tay mình
  rationale: Nguyên văn dùng danh từ số ít với hậu tố ngôi thứ ba giống đực số ít, nên giữ số ít.
- source_word: עַל רֹאשׁ
  choice: trên đầu
  rationale: Cách dịch trực tiếp, tự nhiên, giữ rõ vị trí của hành động nghi lễ.
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh này, חטאת chỉ con vật hiến tế liên quan đến tội lỗi và sự thanh tẩy. “Lễ vật chuộc tội” là cách gọi quen thuộc và dễ hiểu; chú thích bảo lưu cách hiểu “lễ vật thanh tẩy”.
- source_word: וְשָׁחַט
  choice: rồi giết
  rationale: שחט là thuật ngữ chỉ việc giết con vật để hiến tế. “Giết” tự nhiên trong tiếng Việt và ngữ cảnh đã xác định rõ tính nghi lễ.
- source_word: בִּמְקוֹם
  choice: tại nơi
  rationale: Cụm từ chỉ địa điểm được ấn định để thực hiện việc giết con vật.
- source_word: הָעֹלָה
  choice: lễ vật thiêu
  rationale: עלה là thuật ngữ hiến tế theo truyền thống chỉ lễ vật được thiêu trên bàn thờ; “lễ vật thiêu” ngắn gọn và dễ hiểu.
theological_decisions:
- issue: Cách dịch חטאת trong luật hiến tế
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Danh từ mang nghĩa kỹ thuật về một loại lễ vật. Cách dịch chính giữ lối gọi quen thuộc, trong khi chú thích nêu chức năng thanh tẩy mà thuật ngữ cũng có thể nhấn mạnh.
- issue: Giá trị của dạng động từ Hebrew trong ngữ cảnh luật nghi lễ
  choice: phải đặt ... rồi giết
  alternative: đã đặt ... rồi giết
  rationale: Dù hình thái Hebrew có thể mang sắc thái kể chuyện, văn cảnh là thủ tục bắt buộc; cấu trúc “phải ... rồi ...” truyền đạt rõ lực chỉ dẫn mà không biến câu thành lời kể quá khứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để nối với chủ thể của điều luật trong văn cảnh; thêm “người ta giết” ở vế cuối nhằm tránh cách hiểu sai rằng “nơi của lễ vật thiêu” là quan hệ sở hữu, đồng thời diễn đạt địa điểm hiến tế tự nhiên trong tiếng Việt.
