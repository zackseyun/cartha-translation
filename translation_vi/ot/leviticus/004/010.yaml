  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: vi
  text: đúng như các phần ấy được lấy khỏi con bò của sinh tế bình an[a]; rồi thầy tế lễ phải thiêu chúng trên bàn thờ của lễ thiêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “được nâng lên khỏi con bò của sinh tế bình an.” Động từ Hê-bơ-rơ vừa gợi việc lấy các phần dâng tế ra, vừa gợi động tác nâng chúng lên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn đạt rõ sự đối chiếu với thủ tục của sinh tế cầu bình an, đồng thời tự nhiên trong tiếng Việt.
- source_word: יוּרַם
  choice: được lấy khỏi
  rationale: Dạng Hophal của רום theo nghĩa đen là “được nâng lên”, nhưng trong ngữ cảnh tế lễ chỉ việc lấy các phần mỡ ra khỏi con vật; chú thích giữ lại sắc thái nâng lên của nguyên ngữ.
- source_word: מִשּׁוֹר
  choice: khỏi con bò
  rationale: שׁוֹר chỉ gia súc thuộc loài bò; “con bò” là cách gọi rộng, tự nhiên và không xác định giới tính quá mức cần thiết.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sinh tế cầu bình an
  rationale: Giữ cả danh từ זֶבַח (“sinh tế”) và thuật ngữ שְׁלָמִים, vốn gắn với ý niệm bình an/toàn vẹn, mà không diễn giải thành một nét thần học riêng.
- source_word: וְהִקְטִירָם
  choice: rồi ... phải thiêu chúng
  rationale: Trong ngữ cảnh tế lễ, קטר chỉ việc đốt lễ vật trên bàn thờ; “chúng” quy chiếu về các phần mỡ đã nêu ở câu trước.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ nghĩa, trang trọng và quen thuộc trong tiếng Việt hiện đại.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: trên bàn thờ lễ thiêu
  rationale: Diễn đạt gọn thuật ngữ chỉ bàn thờ dùng cho עֹלָה, lễ vật được thiêu trọn.
theological_decisions:
- issue: Ý nghĩa của זֶבַח הַשְּׁלָמִים
  choice: sinh tế cầu bình an
  alternative: sinh tế giao hảo / sinh tế bình an
  rationale: “Cầu bình an” giữ liên hệ từ nguyên với שׁלם và là thuật ngữ tế lễ dễ hiểu, nhưng không thu hẹp lễ này chỉ vào ý niệm thông công.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Cụm “các phần ấy” bổ sung chủ thể được ngầm hiểu từ câu trước để câu tiếng Việt rõ nghĩa; dấu chấm phẩy làm nổi bật hai bước của nghi thức.
