source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: vi
  text: Người ấy phải đem con bò đực đến lối vào[a] Lều Hội Kiến, trước mặt Yahweh[b]. Người ấy phải đặt tay mình trên đầu con bò rồi giết con bò ấy trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cửa Lều Hội Kiến.”
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ này cũng có thể dịch là “trong sự hiện diện của Yahweh”; đây là cách nói dùng trong bối cảnh thờ phượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Người ấy phải đem
  rationale: Dạng Hiphil của בוא diễn tả việc người dâng lễ phải đưa con vật đến. “Phải đem” phù hợp với văn cảnh quy định nghi lễ và chuyển tự nhiên chủ thể được nêu ở câu trước.
- source_word: הַפָּר
  choice: con bò đực
  rationale: פַּר chỉ bò đực dùng làm sinh tế; bản thân từ trong câu này không nhất thiết phải dịch thêm ý “còn trẻ”.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: lối vào Lều Hội Kiến
  rationale: פֶּתַח là chỗ mở hoặc lối vào; אֹהֶל מוֹעֵד là tên gọi nơi thánh. “Lều Hội Kiến” là cách gọi trang trọng, gọn và quen thuộc trong tiếng Việt.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי có thể mang nghĩa “ở trước” hoặc “trong sự hiện diện của.” “Trước mặt” giữ được hình ảnh không gian của tiếng Hê-bơ-rơ và sắc thái nghi lễ.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: Người ấy phải đặt tay mình trên đầu con bò
  rationale: סמך trong nghi lễ hiến tế nói đến hành động đặt hoặc tì tay lên con vật. “Đặt tay” diễn đạt rõ hành động mà không tự thêm cách giải thích về ý nghĩa biểu tượng.
- source_word: וְשָׁחַט
  choice: rồi giết nó
  rationale: שׁחט là động từ giết con vật trong bối cảnh hiến tế. “Giết” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt; ngữ cảnh đã xác định đây là hành động nghi lễ.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Văn bản Hê-bơ-rơ dùng trực tiếp danh riêng יְהוָה. Phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của nghi thức đặt tay
  choice: Chỉ dịch hành động thể lý được nêu trong câu
  alternative: Giải thích đó là sự đồng nhất với sinh tế hoặc sự chuyển giao tội lỗi
  rationale: Câu này không giải thích đầy đủ ý nghĩa thần học của cử chỉ. Bản dịch vì thế không áp đặt một cách giải nghĩa riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người ấy phải” để thể hiện tính quy định của nghi lễ; lặp lại chủ thể ở câu thứ hai nhằm tránh một câu quá dài. “Lều Hội Kiến” được viết hoa như tên gọi của nơi thánh.
