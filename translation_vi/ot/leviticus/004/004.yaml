  source_fidelity: 'Bản dịch truyền đạt đúng các hành động chính và tính quy định của nghi thức: đem con bò đực đến Lều Hội Kiến, đặt tay lên đầu nó, và giết nó trước mặt Yahweh. Tuy nhiên, động từ שָׁחַט là động từ kỹ thuật chỉ việc giết/sát tế con vật; trong bản dịch tối ưu-tương-đương, nên giữ danh ngữ «con bò ấy» ở vế cuối như tiếng Hê-bơ-rơ thay vì thay bằng đại từ «nó».'
