  terminology: «Lều Hội Kiến», «trước mặt Yahweh», và «đặt tay ... trên đầu» là các cách diễn đạt phù hợp, nhất quán với văn cảnh nghi lễ, và không áp đặt diễn giải thần học cho cử chỉ đặt tay. Danh Yahweh được giữ đúng theo quyết định thuật ngữ đã nêu.
  issues:
