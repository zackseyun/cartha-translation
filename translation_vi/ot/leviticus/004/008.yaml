source:
  edition: WLC
  text: וְ/אֶת כָּל חֵ֛לֶב פַּ֥ר הַֽ/חַטָּ֖את יָרִ֣ים מִמֶּ֑/נּוּ אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה עַל הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: vi
  text: 'Người ấy phải lấy khỏi con bò đực dâng làm lễ chuộc tội[a] tất cả phần mỡ: phần mỡ bao phủ nội tạng và toàn bộ phần mỡ ở trên nội tạng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con bò đực dâng làm lễ thanh tẩy.” Từ Hê-bơ-rơ חַטָּאת có thể chỉ cả “tội lỗi” lẫn lễ vật liên quan đến việc loại bỏ tội lỗi hoặc sự ô uế.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: tất cả / toàn bộ
  rationale: Giữ nguyên sức khái quát của tiếng Hê-bơ-rơ; cách thay đổi nhẹ giữa hai lần xuất hiện giúp câu tiếng Việt tự nhiên mà không làm đổi nghĩa.
- source_word: חֵלֶב
  choice: phần mỡ
  rationale: Trong ngữ cảnh hiến tế, từ này chỉ các phần mỡ được quy định; “phần mỡ” rõ và tự nhiên hơn “mỡ” đứng riêng.
- source_word: פַּר הַחַטָּאת
  choice: con bò đực dâng làm lễ chuộc tội
  rationale: 'Diễn đạt tự nhiên quan hệ cấu tạo trong tiếng Hê-bơ-rơ: con bò đực được dùng cho lễ này, chứ không phải bản thân con vật được gọi ẩn dụ là tội lỗi.'
- source_word: יָרִים
  choice: phải lấy khỏi
  rationale: Động từ có nghĩa cơ bản là nâng lên, nhưng trong thủ tục hiến tế tại đây chỉ hành động tách và lấy các phần mỡ ra khỏi con vật.
- source_word: מִמֶּנּוּ
  choice: khỏi con bò đực
  rationale: Nêu lại đối tượng thay vì dùng đại từ dễ mơ hồ trong tiếng Việt, đồng thời giữ đúng quy chiếu của nguyên văn.
- source_word: הַמְכַסֶּה
  choice: phủ trên
  rationale: Chuyển phân từ thuộc tính thành cách diễn đạt gọn, tự nhiên, mô tả vị trí/chức năng của phần mỡ.
- source_word: קֶּרֶב
  choice: nội tạng
  rationale: Trong ngữ cảnh giải phẫu hiến tế, “nội tạng” cụ thể, hiện đại và dễ hiểu; chính xác hơn cách nói rộng là “các phần bên trong”.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: ở trên nội tạng
  rationale: Giữ sắc thái không gian của עַל và phân biệt phần mỡ phủ nội tạng với toàn bộ phần mỡ nằm trên hoặc gắn quanh nội tạng.
theological_decisions:
- issue: Cách dịch חַטָּאת trong ngữ cảnh hiến tế
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: “Lễ chuộc tội” là thuật ngữ quen thuộc, phù hợp trong tiếng Việt; chú thích giữ lại khả năng hiểu là “lễ thanh tẩy,” vì từ Hê-bơ-rơ có thể nhấn mạnh việc xử lý tội lỗi hoặc sự ô uế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để phản ánh chủ thể ngôi thứ ba số ít trong mạch luật lệ; dùng “nội tạng” thay cho thuật ngữ quá cổ hoặc quá chuyên môn.
