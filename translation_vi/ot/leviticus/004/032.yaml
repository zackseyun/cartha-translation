source:
  edition: WLC
  text: וְ/אִם כֶּ֛בֶשׂ יָבִ֥יא קָרְבָּנ֖/וֹ לְ/חַטָּ֑את נְקֵבָ֥ה תְמִימָ֖ה יְבִיאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: vi
  text: Nếu người ấy đem một con chiên làm lễ chuộc tội[a], thì phải đem một con chiên cái không tì vết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật dùng để xử lý tội lỗi và sự ô uế nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nếu
  rationale: Mở đầu một trường hợp lựa chọn tiếp theo trong các quy định tế lễ; tiếng Việt không cần dịch riêng liên từ וְ để giữ câu tự nhiên.
- source_word: כֶּבֶשׂ
  choice: một con chiên
  rationale: Chỉ con vật thuộc loài chiên trong bối cảnh tế lễ. “Con chiên” tự nhiên và không buộc phải xác định tuổi của con vật khi câu này không nêu rõ.
- source_word: יָבִיא
  choice: đem
  rationale: Dạng Hiphil của בוא diễn tả hành động mang hoặc đem lễ vật đến, nên “đem” giữ được ý cụ thể của động từ.
- source_word: קָרְבָּנוֹ
  choice: làm lễ vật
  rationale: קָרְבָּן là vật được đem đến để dâng; cách diễn đạt này truyền đạt chức năng của con vật và đại từ sở hữu được tiếng Việt hiểu theo chủ thể trong câu.
- source_word: לְחַטָּאת
  choice: dâng làm lễ chuộc tội
  rationale: Trong luật tế lễ Lê-vi, חַטָּאת là tên một loại tế lễ liên quan đến tội lỗi và sự thanh tẩy. “Lễ chuộc tội” là cách gọi rõ ràng, quen thuộc, còn sắc thái “lễ thanh tẩy” được bảo lưu trong chú thích.
- source_word: נְקֵבָה
  choice: một con cái
  rationale: Nêu rõ giới tính cái của con vật; cách nói này tự nhiên sau khi “con chiên” đã được nhắc đến.
- source_word: תְמִימָה
  choice: không tì vết
  rationale: Trong luật tế lễ, תמים mô tả con vật không có khuyết tật khiến nó không đủ tiêu chuẩn để dâng.
- source_word: יְבִיאֶנָּה
  choice: phải đem
  rationale: Động từ lặp lại với hậu tố giống cái chỉ về con vật; “phải” thể hiện lực quy định của lời chỉ dẫn mà không lặp đối tượng một cách nặng nề.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: Thuật ngữ có thể chỉ của lễ xử lý tội lỗi, đồng thời nhấn mạnh tác dụng thanh tẩy khỏi ô uế. Bản chính dùng cách gọi truyền thống, dễ hiểu trong tiếng Việt, nhưng chú thích giữ lại cách hiểu “lễ thanh tẩy” để không xóa bỏ sắc thái học thuật và thần học thực sự của từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc điều kiện được diễn đạt tự nhiên bằng “Nếu… thì…”, còn thuật ngữ tế lễ được giữ nhất quán và có chú thích cho nghĩa thay thế.
