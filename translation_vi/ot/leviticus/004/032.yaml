revisions:
- from: Nếu người ấy đem một con chiên làm lễ vật dâng làm lễ chuộc tội[a], thì phải đem một con cái không tì vết.
  to: Nếu người ấy đem một con chiên làm lễ chuộc tội[a], thì phải đem một con chiên cái không tì vết.
  rationale: Bản sửa loại bỏ sự lặp từ không cần thiết, giữ sát quan hệ cú pháp của nguyên ngữ (“đem ... làm lễ chuộc tội”), và nêu rõ con vật phải là chiên cái không tì vết. Chú thích vẫn bảo lưu cách hiểu “lễ thanh tẩy” của חַטָּאת mà không áp đặt một cách giải thích thần học riêng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:36Z'
