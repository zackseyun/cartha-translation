language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: vi
  text: '“Hãy nói với con dân Israel[a] rằng: Nếu một người vô ý[b] phạm tội, vi phạm bất cứ điều răn nào của Yahweh về những việc không được làm, và làm một trong những việc ấy,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Israel”; cũng có thể dịch: “con cái Israel” hoặc “người Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “Vô ý” cũng có thể hiểu là “do lầm lỗi” hoặc “do sơ suất”; từ Hê-bơ-rơ nói đến tội phạm phải mà không chủ ý, chứ không phải hành vi ngang nhiên chống nghịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Mệnh lệnh trực tiếp mở đầu lời Đức Chúa Trời truyền cho Môi-se; cách dịch tự nhiên và trang trọng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm Hê-bơ-rơ nghĩa đen là ‘các con trai của Israel’, nhưng trong ngữ cảnh chỉ cộng đồng hậu duệ Israel nói chung; ‘con dân Israel’ vừa giữ sắc thái huyết tộc vừa tự nhiên trong tiếng Việt.
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Ở đây từ này chỉ một cá nhân trong điều luật, không nhấn mạnh phần hồn.
- source_word: תֶחֱטָא בִשְׁגָגָה
  choice: vô ý phạm tội
  rationale: Diễn đạt hành vi phạm tội do sơ suất hoặc nhầm lẫn, không phải cố tình chống nghịch.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: vi phạm bất cứ điều răn nào của Yahweh
  rationale: Giới từ מן trong kết cấu này nêu điều răn bị vi phạm; cách dịch làm rõ quan hệ pháp lý mà không đổi nội dung.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: về những việc không được làm
  rationale: Giữ lực bị động, phiếm chỉ của mệnh đề Hê-bơ-rơ nói về các hành vi bị cấm.
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: và làm một trong những việc ấy
  rationale: Chỉ việc thực hiện một trong các hành vi bị cấm vừa nêu.
theological_decisions:
- issue: Cách chuyển danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Chuyển trực tiếp danh giao ước trong bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- issue: Tính chất của tội בִשְׁגָגָה
  choice: vô ý
  alternative: do lầm lỗi; do sơ suất
  rationale: Giữ sự phân biệt của văn bản giữa lỗi vô tình và hành vi cố ý, nhưng không xác định hẹp hơn mức từ Hê-bơ-rơ cho phép.
translation_notes:
  register: Văn phong luật pháp, trang trọng nhưng hiện đại. Dùng ‘con dân Israel’ để tránh việc ‘con trai’ bị hiểu là chỉ nam giới, đồng thời vẫn giữ sắc thái cộng đồng hậu duệ. Câu kết bằng dấu phẩy vì đây là phần mở đầu của điều luật tiếp tục ở các câu sau.
