  source_fidelity: 'Bản dịch chuyển đạt đúng cấu trúc điều kiện luật pháp: mệnh lệnh truyền nói, đối tượng là cộng đồng Israel, một người phạm tội do vô ý liên quan đến các điều răn của Yahweh về điều bị cấm, rồi làm một điều trong số đó. “Con dân Israel” là cách diễn đạt tự nhiên, bao quát cộng đồng; chú thích vẫn minh định cách nói sát chữ là “các con trai của Israel”.'
