source:
  edition: WLC
  text: וְ/הוֹצִ֣יא אֶת הַ/פָּ֗ר אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/שָׂרַ֣ף אֹת֔/וֹ כַּ/אֲשֶׁ֣ר שָׂרַ֔ף אֵ֖ת הַ/פָּ֣ר הָ/רִאשׁ֑וֹן חַטַּ֥את הַ/קָּהָ֖ל הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: vi
  text: Người ấy phải đem con bò đực ra ngoài trại và thiêu nó[a], như đã thiêu con bò đực thứ nhất. Đó là lễ vật chuộc tội của hội chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy.” Từ Hê-bơ-rơ có thể nhấn mạnh vai trò của lễ vật trong việc loại bỏ sự ô uế cũng như xử lý tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: phải đem ... ra
  rationale: Dạng Hiphil của יצא diễn tả việc đưa hoặc đem một vật ra ngoài; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái chỉ thị của ngữ cảnh luật lệ.
- source_word: הַפָּר
  choice: con bò
  rationale: פַּר chỉ bò đực, thường là bò đực non dùng làm sinh tế. Trong mạch văn đã xác định con vật, “con bò” là cách gọi gọn và tự nhiên.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Cụm giới từ diễn tả sự di chuyển tới một nơi bên ngoài ranh giới trại; “ra ngoài trại” truyền đạt cả hướng chuyển động lẫn địa điểm.
- source_word: וְשָׂרַף אֹתוֹ
  choice: và thiêu nó
  rationale: שׂרף có nghĩa là đốt hoặc thiêu. “Thiêu” phù hợp với văn phong trang trọng của nghi lễ mà không thêm ý nghĩa kỹ thuật ngoài nguyên văn.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: như đã thiêu
  rationale: כַּאֲשֶׁר nêu sự tương ứng với cách xử lý con bò trước đó. Chủ thể được lược bỏ tự nhiên trong tiếng Việt nhưng vẫn rõ từ mạch văn.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: con bò thứ nhất
  rationale: רִאשׁוֹן chỉ con bò đã được nói đến trong trường hợp trước; “thứ nhất” giữ sát quan hệ quy chiếu của tiếng Hê-bơ-rơ.
- source_word: חַטַּאת
  choice: lễ vật chuộc tội
  rationale: Trong luật tế lễ, חַטָּאת chỉ sinh tế liên quan đến tội và việc thanh tẩy. “Lễ vật chuộc tội” là thuật ngữ Việt ngữ dễ hiểu và quen thuộc; chú thích bảo tồn khả năng dịch là “lễ vật thanh tẩy”.
- source_word: הַקָּהָל
  choice: hội chúng
  rationale: קָהָל là cộng đồng được quy tụ. “Hội chúng” giữ sắc thái tập thể và trang trọng, không đồng nhất thuật ngữ này với một cơ cấu giáo phái hiện đại.
- source_word: הוּא
  choice: Đó là
  rationale: Đại từ làm vị ngữ, xác định con bò vừa nói là lễ vật của hội chúng; “Đó là” tự nhiên và rõ trong tiếng Việt.
theological_decisions:
- issue: Cách dịch חַטַּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ Hê-bơ-rơ có thể nhấn mạnh việc xử lý tội lỗi hoặc chức năng thanh tẩy của nghi lễ. Bản chính dùng thuật ngữ quen thuộc “lễ vật chuộc tội”, còn chú thích nêu cách hiểu thay thế để không xóa bỏ phạm vi nghĩa và sự căng thẳng thần học của từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “người ấy” để nối với chủ thể tư tế trong mạch văn mà không tự ý ghi rõ chức danh ở câu này; dùng “trại” cho bối cảnh cộng đồng Israel trong hoang mạc.
