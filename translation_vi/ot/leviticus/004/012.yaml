    issue: “con bò” không xác định giới tính
    rationale: Danh từ Hê-bơ-rơ פַּר có nghĩa là bò đực/bull. Trong quy định tế lễ, việc xác định con vật là bò đực là chi tiết của văn bản, nên cần được nêu trong bản dịch.
