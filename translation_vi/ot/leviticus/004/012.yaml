id: LEV.4.12
reference: Leviticus 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הוֹצִ֣יא אֶת כָּל הַ֠/פָּר אֶל מִ/ח֨וּץ לַֽ/מַּחֲנֶ֜ה אֶל מָק֤וֹם טָהוֹר֙ אֶל שֶׁ֣פֶךְ הַ/דֶּ֔שֶׁן וְ/שָׂרַ֥ף אֹת֛/וֹ עַל עֵצִ֖ים בָּ/אֵ֑שׁ עַל שֶׁ֥פֶךְ הַ/דֶּ֖שֶׁן יִשָּׂרֵֽף־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: vi
  text: Người ấy phải đem cả con bò đực ra ngoài trại, đến một nơi thanh sạch[a], là nơi đổ tro[b], rồi thiêu nó trên củi, trong lửa; nó phải được thiêu tại nơi đổ tro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là một nơi thanh sạch theo nghi lễ.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “nơi tro được đổ ra”, tức nơi quy định để đổ tro từ bàn thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Người ấy phải đem ... ra ngoài
  rationale: Dạng Hiphil của יצא mang nghĩa khiến đi ra, tức “đem ra”; cách dịch này giữ hướng chuyển động và phù hợp văn phong chỉ dẫn.
- source_word: כָּל הַפָּר
  choice: cả con bò
  rationale: כָּל với danh từ xác định nhấn mạnh toàn bộ con vật; “cả con bò” tự nhiên và chính xác trong tiếng Việt.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Cụm từ chỉ địa điểm bên ngoài ranh giới trại; kết hợp với “đem ... ra” tạo câu tiếng Việt tự nhiên.
- source_word: מָקוֹם טָהוֹר
  choice: một nơi thanh sạch
  rationale: טָהוֹר trong bối cảnh Lê-vi thường có sắc thái thanh sạch về nghi lễ. “Thanh sạch” vừa trang trọng, dễ hiểu, vừa giữ được sắc thái ấy mà không diễn giải quá mức.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: nơi đổ tro
  rationale: Cụm Hê-bơ-rơ chỉ nơi tro được đổ ra, tức địa điểm quy định để xử lý tro bàn thờ. Dịch sát “nơi đổ tro” rõ nghĩa hơn một danh từ có thể gợi một đống tro bất kỳ.
- source_word: וְשָׂרַף אֹתוֹ
  choice: rồi thiêu nó
  rationale: שׂרף nghĩa là đốt hoặc thiêu. “Thiêu” phù hợp với việc đốt toàn bộ xác con vật; “rồi” diễn đạt tự nhiên trình tự của chỉ dẫn.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: trên củi trong lửa
  rationale: 'Giữ cả hai yếu tố của nguyên văn: con vật ở trên củi và được thiêu trong lửa, thay vì gộp chúng thành một ý.'
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: nó phải được thiêu tại nơi đổ tro
  rationale: Giữ thể bị động và sự lặp lại mang tính nhấn mạnh pháp quy của câu Hê-bơ-rơ; “tại” diễn đạt địa điểm tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái nghi lễ của טָהוֹר
  choice: một nơi thanh sạch
  alternative: một nơi sạch / một nơi thanh sạch về nghi lễ
  rationale: Bối cảnh tế lễ cho thấy sự thanh sạch theo nghi lễ có lẽ được nói đến. Bản chính dùng “thanh sạch” để bảo toàn sắc thái mà không thêm lời giải nghĩa; chú thích nêu rõ khả năng này.
- issue: Ý nghĩa của שֶׁפֶךְ הַדֶּשֶׁן
  choice: nơi đổ tro
  alternative: đống tro / bãi tro
  rationale: Cụm từ nói đến một địa điểm được dùng để đổ tro bàn thờ, không nhất thiết mô tả hình dạng là một đống hay một bãi. Cách dịch theo chức năng giữ được độ chính xác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc chỉ dẫn bằng “phải”, đồng thời bảo lưu sự lặp lại địa điểm ở cuối câu để phản ánh nét nhấn mạnh của nguyên văn.
