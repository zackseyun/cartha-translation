revisions:
- from: Người ấy phải đem cả con bò ra ngoài trại, đến một nơi thanh sạch[a], là nơi đổ tro[b], rồi thiêu nó trên củi trong lửa; nó phải được thiêu tại nơi đổ tro.
  to: Người ấy phải đem cả con bò đực ra ngoài trại, đến một nơi thanh sạch[a], là nơi đổ tro[b], rồi thiêu nó trên củi, trong lửa; nó phải được thiêu tại nơi đổ tro.
  rationale: Bổ sung “đực” để dịch chính xác פַּר. Giữ nguyên cách dịch “thanh sạch”, “nơi đổ tro” và sự lặp lại ở cuối câu, vì chúng truyền đạt trung thực sắc thái nghi lễ, chức năng của địa điểm, và tính nhấn mạnh của chỉ dẫn. Dấu phẩy giữa “trên củi” và “trong lửa” giúp biểu thị rõ hai yếu tố của nguyên văn mà không thay đổi nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa “con bò” thành “con bò đực”, vì פַּר chỉ con bò đực (bull), không phải bò nói chung. Các thành tố còn lại giữ đúng trình tự và sự nhấn mạnh của nguyên văn: đem ra ngoài trại đến nơi thanh sạch/nơi đổ tro, thiêu trên củi trong lửa, rồi lặp lại địa điểm thiêu.'
  naturalness: Bản dịch nhìn chung tự nhiên, trang trọng và phù hợp văn phong quy định. Thêm dấu phẩy trong “trên củi, trong lửa” làm rõ hai bổ ngữ được nguyên văn giữ riêng, đồng thời đọc tự nhiên hơn.
  terminology: “Thanh sạch” phù hợp ngữ cảnh nghi lễ và chú thích giải thích đúng mức. “Nơi đổ tro” phản ánh tốt שֶׁפֶךְ הַדֶּשֶׁן là địa điểm đổ/loại bỏ tro, không áp đặt hình dạng như “đống tro”. “Thiêu” phù hợp với שׂרף.
  issues:
