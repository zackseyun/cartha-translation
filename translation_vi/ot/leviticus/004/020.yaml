base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: vi
  text: Người ấy phải làm với con bò này đúng như đã làm với con bò của lễ chuộc tội; người ấy phải làm với nó như vậy. Vị tư tế sẽ làm lễ chuộc tội cho họ[a], và họ sẽ được tha thứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “lễ chuộc tội” cũng có thể dịch là “lễ thanh tẩy”. Từ Hê-bơ-rơ này có thể chỉ lễ vật xử lý tội lỗi bằng cách đem lại sự thanh tẩy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: Người ấy phải làm với con bò này
  rationale: Động từ עשה trong chỉ dẫn nghi lễ mang sắc thái bắt buộc; “phải làm” tự nhiên trong tiếng Việt. Giới từ ל ở đây chỉ việc xử lý con vật, nên dịch “làm với”. Đại từ chỉ định “này” giúp nhận rõ con bò đang được nói đến trong ngữ cảnh.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: y như đã làm
  rationale: כַּאֲשֶׁר nêu sự tương ứng với nghi thức trước đó; “y như” diễn đạt rõ sự giống nhau mà vẫn tự nhiên.
- source_word: לְפַר הַחַטָּאת
  choice: với con bò của lễ chuộc tội
  rationale: Cụm từ chỉ con bò đã được dùng trong nghi lễ trước. “Lễ chuộc tội” là cách gọi quen thuộc, dễ hiểu cho חטאת trong ngữ cảnh tế lễ.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: người ấy phải làm với nó như vậy
  rationale: כֵּן nhấn mạnh việc thực hiện cùng một cách; “với nó” quy chiếu về con bò hiện tại.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: Vị tư tế sẽ làm lễ chuộc tội cho họ
  rationale: כפר là thuật ngữ nghi lễ chủ chốt, được diễn đạt bằng “làm lễ chuộc tội”; עֲלֵהֶם chỉ những người được hưởng hiệu quả của nghi lễ. “Tư tế” là danh xưng trang trọng, rõ nghĩa cho הַכֹּהֵן.
- source_word: וְנִסְלַח לָהֶם
  choice: và họ sẽ được tha thứ
  rationale: 'Dạng Niphal diễn tả kết quả thụ động: sự tha thứ được ban cho cộng đồng.'
theological_decisions:
- issue: Ý nghĩa của חטאת trong luật tế lễ
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: חטאת vừa có thể gọi lễ vật xử lý tội lỗi vừa có thể nhấn mạnh hiệu quả thanh tẩy. Bản chính dùng cách gọi quen thuộc “lễ chuộc tội”, còn cách hiểu “lễ thanh tẩy” được giữ trong chú thích để không xóa bỏ sắc thái từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lặp của câu Hê-bơ-rơ để phản ánh tính chính xác của chỉ dẫn nghi lễ; dùng “người ấy” cho chủ thể được hiểu từ ngữ cảnh và “vị tư tế” cho chức danh nghi lễ.
