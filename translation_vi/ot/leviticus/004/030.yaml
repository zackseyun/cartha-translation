source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: vi
  text: Thầy tế lễ sẽ dùng ngón tay lấy một ít huyết của con vật ấy và bôi lên các sừng của bàn thờ dâng lễ thiêu[b], rồi đổ tất cả huyết của nó tại chân bàn thờ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Các sừng” là những phần nhô lên giống sừng ở các góc bàn thờ.
    reason: cultural_note
  - marker: c
    text: Nguyên văn là “tất cả huyết của nó”. Theo trình tự nghi thức, đây là lượng huyết còn lại sau khi thầy tế lễ đã dùng một ít để bôi lên các sừng bàn thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: sẽ lấy
  rationale: Trong mạch luật lệ về nghi thức, dạng động từ này diễn đạt chỉ thị phải thực hiện, không phải một hành động quá khứ.
- source_word: מִדָּמָהּ בְּאֶצְבָּעוֹ
  choice: lấy ngón tay chấm một ít huyết của con vật
  rationale: מִן có nghĩa phân phần, tức lấy một phần huyết; cách diễn đạt 'lấy ngón tay chấm' tự nhiên trong tiếng Việt và vẫn thể hiện ngón tay là phương tiện.
- source_word: וְנָתַן
  choice: bôi
  rationale: נתן có nghĩa rộng là đặt/để; trong nghi thức dùng ngón tay đưa huyết lên bàn thờ, 'bôi' diễn đạt hành động rõ ràng mà không thêm ý nghĩa thần học.
- source_word: קַרְנֹת מִזְבַּח הָעֹלָה
  choice: các sừng của bàn thờ dâng lễ thiêu
  rationale: Giữ nguyên thuật ngữ nghi lễ 'sừng', chỉ các phần nhô lên giống sừng ở các góc bàn thờ; cụm sở thuộc xác định đây là bàn thờ dùng dâng lễ thiêu.
- source_word: וְאֶת כָּל דָּמָהּ יִשְׁפֹּךְ
  choice: rồi đổ hết huyết của nó
  rationale: Giữ nghĩa toàn thể của כָּל và động từ 'đổ' của שׁפך; không tự đổi thành 'phần huyết còn lại', dù trình tự cho thấy đó là lượng huyết còn sau khi đã bôi một ít.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: xuống chân bàn thờ
  rationale: Trong ngữ cảnh bàn thờ, יְסוֹד là phần nền/chân; 'xuống chân bàn thờ' là cách nói tự nhiên và thể hiện hướng đổ.
theological_decisions:
- issue: Thể động từ trong chỉ dẫn nghi lễ
  choice: 'Dịch theo nghĩa quy định: ''sẽ lấy ... rồi đổ'''
  alternative: 'Dịch như lời kể quá khứ: ''đã lấy ... đã đổ'''
  rationale: Ngữ cảnh là luật nghi lễ, nên các động từ mô tả điều thầy tế lễ phải làm, chứ không thuật lại một sự kiện đơn lẻ.
- issue: Thuật ngữ về phần nhô ra của bàn thờ
  choice: Giữ cách gọi theo hình ảnh là 'sừng'
  alternative: Diễn giải thành 'các góc' hoặc 'các phần nhô lên'
  rationale: קַרְנוֹת là thuật ngữ nghi lễ cụ thể; giữ 'sừng' bảo toàn hình ảnh và tính chất văn hóa của bản nguồn, còn chú thích giải nghĩa hình dạng.
- issue: Quan hệ giữa 'một ít huyết' và 'hết huyết'
  choice: 'Giữ nguyên sức căng của câu nguồn: trước lấy một ít, sau đổ hết huyết'
  alternative: Làm rõ trong chính văn thành 'đổ hết phần huyết còn lại'
  rationale: Bản Hê-bơ-rơ nói כָּל דָּמָהּ, 'tất cả huyết của nó'; trình tự tự nhiên hàm ý lượng còn lại nhưng không nói trực tiếp, nên chỉ giải thích bằng chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'thầy tế lễ' theo văn phong Kinh Thánh phổ thông; 'huyết' và 'lễ thiêu' giữ sắc thái nghi lễ. Không đặt chú thích [a] vì cách hiểu phân phần của מִדָּמָהּ đã được thể hiện minh nhiên bằng 'một ít huyết', nên không còn phương án dịch cần chú giải trong bản tiếng Việt.
