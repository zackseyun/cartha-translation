language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: vi
  text: Nếu thầy tế lễ được xức dầu phạm tội, làm cho dân chúng mang tội[a], thì vì tội mình đã phạm, người phải dâng lên Đức Giê-hô-va một con bò đực thuộc đàn bò, không tì vết, làm lễ vật chuộc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dẫn đến tình trạng dân chúng mang tội.” Cụm từ Hê-bơ-rơ cô đọng, nhấn mạnh rằng tội của thầy tế lễ gây hậu quả liên đới cho dân chúng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: thầy tế lễ được xức dầu
  rationale: Phản ánh trực tiếp cụm Hê-bơ-rơ “thầy tế lễ, người được xức dầu,” không diễn giải thành “thầy tế lễ thượng phẩm,” dù chức vụ ấy có thể được nói đến trong ngữ cảnh.
- source_word: יֶחֱטָא
  choice: phạm tội
  rationale: Thể hiện tự nhiên mệnh đề điều kiện pháp lý “nếu ... phạm tội.”
- source_word: לְאַשְׁמַת הָעָם
  choice: khiến dân chúng mắc tội
  rationale: Diễn đạt hệ quả liên đới của tội vị thầy tế lễ đối với dân chúng, đồng thời không xác định quá mức cơ chế của sự liên đới ấy.
- source_word: וְהִקְרִיב
  choice: phải dâng lên
  rationale: Trong ngữ cảnh tế lễ, động từ chỉ việc đem đến hoặc trình dâng lễ vật; “phải dâng lên” vừa tự nhiên vừa giữ sắc thái quy định.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: vì tội mình đã phạm
  rationale: Chuyển đạt rõ mục đích và nguyên do của lễ vật, đồng thời giữ sự quy chiếu về chính tội người ấy đã phạm.
- source_word: פַּר בֶּן בָּקָר
  choice: một con bò đực thuộc đàn bò
  rationale: Giữ cả ý “bò đực” và sự phân loại thuộc đàn gia súc lớn mà không thêm hàm ý chắc chắn về độ tuổi.
- source_word: תָּמִים
  choice: không tì vết
  rationale: Thuật ngữ tự nhiên và chính xác trong tiếng Việt đối với phẩm chất nghi lễ của con vật hiến tế.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng יהוה quen thuộc trong truyền thống Kinh Thánh tiếng Việt và kết hợp với động từ “dâng lên.”
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong luật tế lễ, חַטָּאת chỉ lễ vật liên quan đến tội; cách dịch này phân biệt lễ vật với chính hành vi phạm tội.
theological_decisions:
- issue: Có nên diễn giải הַכֹּהֵן הַמָּשִׁיחַ là “thầy tế lễ thượng phẩm” hay không
  choice: thầy tế lễ được xức dầu
  alternative: thầy tế lễ thượng phẩm được xức dầu
  rationale: Bản văn chỉ nói trực tiếp “thầy tế lễ được xức dầu.” Giữ nguyên cách gọi này tránh đưa chức danh được suy ra từ ngữ cảnh vào chính văn.
- issue: Cách thể hiện hệ quả cộng đồng của לְאַשְׁמַת הָעָם
  choice: khiến dân chúng mắc tội
  alternative: đưa dân chúng vào tình trạng mắc lỗi
  rationale: Cụm Hê-bơ-rơ cô đọng và có thể nói đến tình trạng mang tội hoặc mắc lỗi của dân do tội vị thầy tế lễ. Cách dịch chính giữ hệ quả cộng đồng mà không giải thích cơ chế thần học.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “thầy tế lễ” để người đọc phổ thông dễ hiểu; giữ cấu trúc điều kiện của điều luật và sự mơ hồ có thật về hệ quả tội lỗi đối với cộng đồng.
