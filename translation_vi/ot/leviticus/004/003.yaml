revisions:
- from: Nếu thầy tế lễ được xức dầu phạm tội, khiến dân chúng mắc tội[a], thì vì tội mình đã phạm, người phải dâng lên Đức Giê-hô-va một con bò đực thuộc đàn bò, không tì vết, làm lễ vật chuộc tội.
  to: Nếu thầy tế lễ được xức dầu phạm tội, làm cho dân chúng mang tội[a], thì vì tội mình đã phạm, người phải dâng lên Đức Giê-hô-va một con bò đực thuộc đàn bò, không tì vết, làm lễ vật chuộc tội.
  rationale: Thay “khiến dân chúng mắc tội” bằng “làm cho dân chúng mang tội” để không biến hệ quả cộng đồng được diễn đạt cô đọng trong tiếng Hê-bơ-rơ thành việc dân chúng trực tiếp phạm tội. Chú thích được sửa tương ứng và vẫn neo đúng tại cụm có cách hiểu thay thế.
