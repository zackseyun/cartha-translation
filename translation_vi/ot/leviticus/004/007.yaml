revisions:
- from: Thầy tế lễ sẽ lấy một phần huyết bôi lên các sừng của bàn thờ xông hương thơm[b] trước mặt Yahweh, là bàn thờ ở trong Lều Hội Kiến. Rồi ông sẽ đổ toàn bộ huyết con bò đực[a] xuống chân bàn thờ dâng lễ thiêu, là bàn thờ ở lối vào Lều Hội Kiến.
  to: Thầy tế lễ sẽ lấy một phần huyết bôi lên các sừng của bàn thờ xông hương thơm[b] trước mặt Yahweh, ở trong Lều Hội Kiến. Rồi ông sẽ đổ toàn bộ huyết con bò đực[a] tại chân bàn thờ dâng lễ thiêu, ở lối vào Lều Hội Kiến.
  rationale: Chỉnh câu để các định ngữ về vị trí của bàn thờ được diễn đạt trực tiếp, tự nhiên trong tiếng Việt, đồng thời thay “xuống chân” bằng “tại chân” nhằm phản ánh chính xác nơi đổ huyết. Không thêm “phần còn lại” vào chính văn; sự hàm ý theo trình tự nghi lễ vẫn được giải thích tại chú thích [a].
  reviewer_model: gpt-5.6-terra
