source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: vi
  text: Thầy tế lễ sẽ lấy một phần huyết bôi lên các sừng của bàn thờ xông hương thơm[b] trước mặt Yahweh, ở trong Lều Hội Kiến. Rồi ông sẽ đổ toàn bộ huyết con bò đực[a] tại chân bàn thờ dâng lễ thiêu, ở lối vào Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ nói theo nghĩa đen: “toàn bộ huyết con bò đực”; trong ngữ cảnh, đó là phần huyết còn lại sau khi một phần đã được bôi lên các sừng bàn thờ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch ngắn gọn: “bàn thờ xông hương”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן הַכֹּהֵן מִן הַדָּם
  choice: Thầy tế lễ sẽ lấy một phần huyết bôi
  rationale: מִן có nghĩa phân lượng, nên “một phần huyết” truyền đạt đúng ý. “Bôi” diễn tả tự nhiên việc đưa huyết lên các sừng bàn thờ mà không làm thay đổi nghi thức.
- source_word: קַרְנוֹת
  choice: các sừng
  rationale: Giữ thuật ngữ nghi lễ chỉ những phần nhô ra ở các góc bàn thờ.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: bàn thờ xông hương thơm
  rationale: קְטֹרֶת chỉ hương được đốt, còn הַסַּמִּים nhấn mạnh các hương liệu thơm; cách dịch này vừa rõ công dụng vừa giữ sắc thái miêu tả.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ cả ý nghĩa không gian-nghi lễ của לִפְנֵי và danh riêng của Đức Chúa Trời trong nguyên văn.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, dễ hiểu, diễn tả chiếc lều dành cho cuộc gặp gỡ theo nghi lễ.
- source_word: וְאֵת כָּל דַּם הַפָּר
  choice: toàn bộ huyết con bò đực
  rationale: Bám sát cách nói của tiếng Hê-bơ-rơ là “toàn bộ huyết con bò đực”; chú thích giải thích rằng theo trình tự nghi lễ, đây là phần còn lại sau khi một phần đã được bôi lên bàn thờ.
- source_word: יִשְׁפֹּךְ אֶל יְסוֹד
  choice: đổ ... xuống chân
  rationale: “Đổ” diễn tả chính xác hành động của שׁפך; “xuống chân” là cách nói tiếng Việt tự nhiên cho nơi huyết được đổ tại phần nền của bàn thờ.
- source_word: מִזְבַּח הָעֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: Phân biệt rõ bàn thờ bên ngoài dùng để dâng עֹלָה, lễ vật được thiêu trọn.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: lối vào Lều Hội Kiến
  rationale: פֶּתַח chỉ cửa hoặc lối vào; “lối vào” phù hợp với vị trí của bàn thờ ở phía trước lều.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” giữ đây là danh riêng thay vì thay bằng một tước hiệu.
- issue: Cách hiểu כָּל דַּם הַפָּר sau khi một phần huyết đã được sử dụng
  choice: toàn bộ huyết con bò đực, kèm chú thích về nghĩa theo ngữ cảnh
  alternative: toàn bộ phần huyết còn lại của con bò đực
  rationale: Bản văn nói theo nghĩa đen là “toàn bộ huyết con bò đực”, trong khi trình tự nghi lễ cho thấy một phần huyết đã được bôi lên các sừng. Giữ cách nói của nguyên văn trong chính văn và giải thích bằng chú thích tránh âm thầm thêm “phần còn lại”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “huyết” thay vì “máu” để giữ sắc thái nghi lễ; dùng “thầy tế lễ”, “Lều Hội Kiến” và “lễ thiêu” nhất quán với ngữ cảnh Lê-vi Ký. Lặp lại “là bàn thờ” giúp các mệnh đề quan hệ trong tiếng Việt không bị hiểu nhầm.
