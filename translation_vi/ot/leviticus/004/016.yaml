base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: vi
  text: Rồi thầy tế lễ đã được xức dầu phải đem một phần huyết của con bò vào Lều Hội Kiến.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “từ huyết của con bò.” Tiếng Hê-bơ-rơ ở đây có lẽ hàm ý chỉ một phần huyết được đem vào.'
    reason: lexical_alternative
  - marker: b
    text: “Lều Hội Kiến” cũng thường được gọi theo lối truyền thống là “Đền Tạm.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: Rồi ... phải đem
  rationale: Dạng động từ nối tiếp trình tự nghi lễ; “Rồi” diễn đạt tự nhiên quan hệ tuần tự, còn “phải” phù hợp sắc thái chỉ thị pháp lễ.
- source_word: הַ/כֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ nghĩa, trang trọng và quen thuộc trong ngữ cảnh tế tự.
- source_word: הַ/מָּשִׁיחַ
  choice: đã được xức dầu
  rationale: Chỉ thầy tế lễ được lập chức bằng nghi thức xức dầu, không phải danh hiệu Đấng Mê-si trong câu này.
- source_word: מִ/דַּם
  choice: một phần huyết
  rationale: 'Giới từ מִן ở đây nhiều khả năng mang nghĩa bộ phận: chỉ một phần huyết được đem vào.'
- source_word: הַ/פָּר
  choice: của con bò
  rationale: פַּר chỉ con bò dùng làm sinh tế; câu này không đòi hỏi phải thêm nghĩa “bò tơ”.
- source_word: אֶל
  choice: vào
  rationale: Trong ngữ cảnh di chuyển đến không gian thánh, “vào” diễn đạt đích đến và sự đi vào tự nhiên hơn “đến”.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Giữ sát hình ảnh “lều” và chức năng là nơi hội kiến; dùng như tên gọi của nơi thánh.
theological_decisions:
- issue: Cách dịch הַמָּשִׁיחַ trong ngữ cảnh chức tế lễ
  choice: đã được xức dầu
  alternative: được thánh hiến; Đấng Mê-si
  rationale: Ở đây từ này mô tả thầy tế lễ đã được xức dầu để nhận chức. “Được thánh hiến” diễn giải rộng hơn, còn “Đấng Mê-si” dễ tạo một cách hiểu Kitô luận không do ngữ cảnh này yêu cầu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyết” thay vì “máu” để phù hợp ngữ vực nghi lễ; “Lều Hội Kiến” giữ tính trong suốt của danh xưng Hê-bơ-rơ.
