source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: vi
  text: Người ấy phải đặt tay mình trên đầu con dê đực và giết nó tại nơi người ta giết lễ thiêu trước mặt Yahweh. Đó là lễ vật chuộc tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đó là lễ vật thanh tẩy.” Từ Hê-bơ-rơ חַטָּאת có thể chỉ “tội lỗi” hoặc lễ vật liên quan đến việc loại bỏ tội lỗi hay sự ô uế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: phải đặt tay mình
  rationale: Trong nghi thức hiến tế, cụm này chỉ hành động đặt tay lên con vật. “Đặt tay mình” tự nhiên trong tiếng Việt, đồng thời giữ số ít của יָדוֹ.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: trên đầu con dê đực
  rationale: שָׂעִיר ở đây là dê đực dùng làm sinh tế; nêu rõ giống đực phù hợp ngữ cảnh và phân biệt với dê cái ở phần luật kế tiếp.
- source_word: וְשָׁחַט אֹתוֹ
  choice: và giết nó
  rationale: שׁחט chỉ việc giết con vật theo nghi thức hiến tế. “Giết” rõ ràng, trang trọng vừa phải và tự nhiên hơn các cách diễn đạt mang sắc thái mổ thịt.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: tại nơi người ta giết
  rationale: Giữ cấu trúc chủ động của động từ Hê-bơ-rơ và dùng “người ta” cho chủ thể không xác định.
- source_word: הָעֹלָה
  choice: lễ thiêu
  rationale: Đây là thuật ngữ tiếng Việt ngắn gọn, quen thuộc cho loại sinh tế được thiêu dâng trọn vẹn.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: “Trước mặt” diễn đạt tự nhiên ý hiện diện trong לִפְנֵי; danh riêng giao ước được phiên âm là “Yahweh” thay vì thay bằng một tước hiệu.
- source_word: חַטָּאת הוּא
  choice: Đó là lễ vật chuộc tội
  rationale: Mệnh đề xác định loại lễ vật. “Lễ vật chuộc tội” là cách gọi dễ hiểu trong tiếng Việt; nghĩa liên quan đến thanh tẩy được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” giữ tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái nghi lễ của חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Trong luật hiến tế, חַטָּאת vừa gắn với tội lỗi vừa có chức năng thanh tẩy. Bản chính dùng cách gọi truyền thống, dễ nhận biết, còn chú thích bảo lưu khả năng dịch khác.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại; dùng câu mệnh lệnh “phải” để thể hiện quy định, tránh từ cổ và giữ các thuật ngữ hiến tế nhất quán.
