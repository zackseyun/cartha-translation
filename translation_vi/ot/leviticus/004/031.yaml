    text: Cũng có thể dịch là “tế lễ thông công”.
    reason: lexical_alternative
  - marker: b
    text: “Hương thơm đẹp lòng” là cách nói cố định trong nghi lễ hiến tế, chỉ một lễ vật được Đức Giê-hô-va vui nhận.
    reason: cultural_note
  revision_rationale: Bản sửa loại bỏ việc thêm “con vật” ở mệnh đề đầu, nhưng làm rõ một cách tự nhiên trong mệnh đề so sánh rằng mỡ được lấy khỏi con vật thuộc tế lễ bình an. Các thuật ngữ tế lễ và công thức về chuộc tội/tha thứ được giữ nguyên để phản ánh sát nguyên văn mà không áp đặt diễn giải giáo phái.
