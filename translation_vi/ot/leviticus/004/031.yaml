reference: Leviticus 4:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: vi
  text: Người ấy phải lấy tất cả mỡ của nó khỏi nó, như mỡ được lấy khỏi con vật dùng làm tế lễ bình an[a]. Thầy tế lễ sẽ đốt mỡ ấy trên bàn thờ, làm hương thơm đẹp lòng Đức Giê-hô-va[b]. Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy, và người ấy sẽ được tha thứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tế lễ thông công”.
    reason: lexical_alternative
  - marker: b
    text: “Hương thơm đẹp lòng” là cách nói cố định trong nghi lễ hiến tế, chỉ một lễ vật được Đức Giê-hô-va vui nhận.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: mỡ của con vật / mỡ
  rationale: Chỉ phần mỡ được lấy ra để thiêu trong nghi thức hiến tế; cách dịch này trực tiếp, dễ hiểu và không thêm ý 'những phần mỡ' khi tiếng Hê-bơ-rơ không nói rõ như vậy.
- source_word: יָסִיר
  choice: phải lấy ... ra
  rationale: Thể Hiphil diễn tả việc làm cho rời khỏi; 'phải' giữ sắc thái quy định của luật tế lễ, còn 'lấy ... ra' tự nhiên trong tiếng Việt.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: như cách ... được lấy khỏi
  rationale: Giữ phép so sánh với thủ tục hiến tế đã được quy định và bảo toàn thể bị động của nguyên văn.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: tế lễ bình an
  rationale: Đây là tên gọi quen thuộc và tương đối sát nghĩa của loại tế lễ שְׁלָמִים; chú thích nêu cách dịch khác nhấn mạnh sự thông công.
- source_word: וְהִקְטִיר
  choice: sẽ đốt
  rationale: Trong ngữ cảnh tế lễ, động từ chỉ việc thiêu phần lễ vật trên bàn thờ; 'đốt' rõ ràng và tự nhiên.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Cách diễn đạt chuẩn và tự nhiên trong ngữ cảnh hiến tế.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: làm hương thơm đẹp lòng
  rationale: Giữ hình ảnh khứu giác và ý lễ vật được Đức Chúa Trời vui nhận mà không biến phép ẩn dụ thành lời giải thích trong chính câu.
- source_word: לַיהוָה
  choice: Đức Giê-hô-va
  rationale: Dịch danh riêng יהוה bằng cách gọi quen thuộc trong tiếng Việt, thay vì làm mờ thành một danh xưng chung.
- source_word: וְכִפֶּר עָלָיו
  choice: Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy
  rationale: Giữ ngôn ngữ nghi lễ của כפר và đối tượng được hưởng hiệu lực của nghi thức, đồng thời dùng cách nói dễ hiểu đối với độc giả phổ thông.
- source_word: וְנִסְלַח לוֹ
  choice: và người ấy sẽ được tha thứ
  rationale: Giữ thể bị động và diễn tả tự nhiên kết quả là người phạm lỗi nhận được sự tha thứ.
theological_decisions:
- issue: Công thức tế lễ וְכִפֶּר עָלָיו ... וְנִסְלַח לוֹ
  choice: Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy, và người ấy sẽ được tha thứ.
  alternative: Thầy tế lễ sẽ thực hiện sự đền tội thay cho người ấy, và lỗi của người ấy sẽ được tha.
  rationale: Bản dịch giữ mối liên hệ mà nguyên văn nêu giữa nghi thức chuộc tội do thầy tế lễ thực hiện và sự tha thứ, nhưng không bổ sung một cơ chế thần học hay xác định điều nguyên văn để ngỏ.
- issue: Danh xưng của loại tế lễ שְׁלָמִים
  choice: tế lễ bình an
  alternative: tế lễ thông công
  rationale: '''Bình an'' giữ liên hệ từ vựng gần hơn với שׁלם, còn phương án ''thông công'' làm nổi bật khía cạnh chia sẻ và hiệp thông nhưng mang tính diễn giải hơn; vì vậy phương án ấy được để trong chú thích.'
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại; dùng câu ngắn, thuật ngữ tế lễ quen thuộc và đại từ “người ấy” để tránh mơ hồ về người dâng lễ. Các dấu chú thích [a], [b] được đặt ngay sau cụm từ tương ứng, sửa sự lệch vị trí trong lớp tham khảo tiếng Anh.
