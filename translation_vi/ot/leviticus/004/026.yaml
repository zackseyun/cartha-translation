  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: thiêu toàn bộ mỡ trên bàn thờ theo cách của tế lễ bình an, sự chuộc tội của thầy tế lễ liên hệ đến tội của người ấy, và sự tha thứ. Tuy nhiên, chủ ngữ ngầm của יַקְטִיר trong trình tự nghi lễ là thầy tế lễ; mở đầu bằng “Người ấy” dễ khiến người đọc hiểu nhầm người phạm tội là người thiêu mỡ, nhất là vì mệnh đề sau mới nêu “thầy tế lễ.”'
