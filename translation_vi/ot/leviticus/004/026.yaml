  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: vi
  text: Thầy tế lễ phải thiêu toàn bộ mỡ của con vật trên bàn thờ, như mỡ của của lễ bình an[a]. Như vậy, thầy tế lễ sẽ làm lễ chuộc tội cho người ấy về tội của người ấy[b], và người ấy sẽ được tha thứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Của lễ bình an” cũng có thể dịch là “của lễ hiệp thông” hoặc “của lễ an lành.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ חַטָּאת có thể có nghĩa là “tội” hoặc “lễ vật chuộc tội”; tại đây nhiều khả năng từ này chỉ tội của người ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: mỡ của con vật
  rationale: חֵלֶב chỉ các phần mỡ của con vật được dành để thiêu trong nghi thức tế lễ. Dịch rõ sở hữu bằng “của con vật” tự nhiên hơn “mỡ nó” trong tiếng Việt.
- source_word: יַקְטִיר
  choice: phải thiêu
  rationale: Trong thể Hiphil và ngữ cảnh tế lễ, קטר nói đến việc thiêu lễ vật trên bàn thờ cho bốc khói. “Thiêu” vừa trang trọng vừa diễn đạt rõ hành động nghi lễ.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Dù hình thái chỉ hướng có thể mang nghĩa chuyển động về phía bàn thờ, tiếng Việt tự nhiên dùng “thiêu ... trên bàn thờ” để chỉ nơi thực hiện nghi thức.
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: như mỡ của sinh tế bình an
  rationale: Cụm từ so sánh cách xử lý phần mỡ với sinh tế שְׁלָמִים. “Sinh tế bình an” giữ tên gọi tế lễ quen thuộc, còn chú thích bảo lưu các sắc thái hiệp thông và an lành.
- source_word: וְכִפֶּר עָלָיו
  choice: thầy tế lễ sẽ làm lễ chuộc tội cho người ấy
  rationale: כפר trong văn cảnh tư tế chỉ hành động nghi lễ nhằm xử lý tội lỗi và phục hồi mối quan hệ. “Làm lễ chuộc tội” giữ sắc thái tế lễ mà không áp đặt một học thuyết riêng về cơ chế chuộc tội.
- source_word: מֵחַטָּאתוֹ
  choice: về tội của người ấy
  rationale: חַטָּאת có thể là “tội” hoặc “lễ vật chuộc tội”, nhưng cú pháp sau כפר và mệnh đề nói người ấy được tha thứ nghiêng về chính tội lỗi. “Về” diễn đạt tự nhiên quan hệ mà giới từ מִן biểu thị tại đây.
- source_word: וְנִסְלַח לוֹ
  choice: và người ấy sẽ được tha thứ
  rationale: Thể Niphal của סלח cùng ל chỉ người nhận sự tha thứ. Câu bị động bảo toàn sắc thái tác nhân không được nêu rõ trong nguyên văn.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế hiệp thông; sinh tế an lành
  rationale: שְׁלָמִים có trường nghĩa gồm bình an, toàn vẹn, an lành và sự hiệp thông. “Sinh tế bình an” phù hợp truyền thống thuật ngữ và dễ nhận biết, trong khi chú thích bảo lưu các khả năng khác.
- issue: Nghĩa của חַטָּאת trong מֵחַטָּאתוֹ
  choice: tội của người ấy
  alternative: lễ vật chuộc tội của người ấy
  rationale: Trong Lê-vi Ký, חַטָּאת có thể chỉ cả tội lẫn lễ vật chuộc tội. Ở đây, đối tượng được làm lễ chuộc tội và sau đó được tha thứ là người phạm tội, nên nghĩa “tội” phù hợp hơn, nhưng chú thích vẫn ghi nhận nghĩa kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để tránh đại từ mơ hồ; dùng “thầy tế lễ” và “sinh tế” nhất quán với văn cảnh nghi lễ. Cấu trúc “Như vậy” thể hiện quan hệ kết quả của וְ mà không làm mất trình tự nghi thức.
