  to: Thầy tế lễ phải thiêu toàn bộ mỡ của con vật trên bàn thờ, như mỡ của của lễ bình an[a]. Như vậy, thầy tế lễ sẽ làm lễ chuộc tội cho người ấy về tội của người ấy[b], và người ấy sẽ được tha thứ.
