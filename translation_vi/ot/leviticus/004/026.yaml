  terminology: Giữ “thầy tế lễ,” “bàn thờ,” “chuộc tội,” và “được tha thứ.” Dịch שְׁלָמִים là “của lễ bình an,” đồng thời chú thích bảo lưu các khả năng “của lễ hiệp thông” và “của lễ an lành.” Chú thích về חַטָּאת vẫn cần thiết để giữ nhận thức về tính đa nghĩa của từ Hê-bơ-rơ, dù ngữ cảnh này ưu tiên nghĩa “tội.”
