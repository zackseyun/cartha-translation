  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng hiện đại. Dùng thuật ngữ giải phẫu phổ thông, tránh từ quá chuyên môn; dấu chấm phẩy giúp phân định danh sách các bộ phận với mệnh lệnh lấy ra.
