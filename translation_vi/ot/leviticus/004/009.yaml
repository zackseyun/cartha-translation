base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: vi
  text: cùng hai quả thận, mỡ trên chúng, tức là ở vùng hông, và phần phụ trên gan[a]; người ấy phải lấy phần phụ ấy ra cùng với hai quả thận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thùy gan”. Thuật ngữ giải phẫu trong tiếng Hê-bơ-rơ ở đây không chắc chắn; “phần phụ” là cách dịch thận trọng.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: hai quả thận
  rationale: Chỉ rõ hai quả thận trong mô tả giải phẫu; cách nói tự nhiên và cụ thể trong tiếng Việt.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: lớp mỡ bọc quanh chúng ở vùng hông
  rationale: חֵלֶב là phần mỡ dành cho lễ vật; cụm giới từ mô tả lớp mỡ quanh thận tại vùng hông. 'Bọc quanh' diễn đạt tự nhiên vị trí giải phẫu mà không làm thay đổi đối tượng.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: phần phụ trên gan
  rationale: יוֹתֶרֶת là thuật ngữ giải phẫu chưa chắc chắn, có thể chỉ một phần phụ hoặc thùy của gan; 'phần phụ trên gan' thận trọng và giữ giới từ עַל.
- source_word: עַל הַכְּלָיוֹת
  choice: cùng với hai quả thận
  rationale: Trong công thức hiến tế lặp lại, cụm này chỉ việc lấy phần nói trên ra cùng với thận; cách dịch làm rõ sự phối hợp trong thao tác.
- source_word: יְסִירֶנָּה
  choice: người ấy phải lấy phần phụ ấy ra
  rationale: Động từ Hiphil diễn tả việc lấy bỏ một phần khỏi con vật. Hậu tố giống cái số ít phù hợp trực tiếp với יוֹתֶרֶת, vì vậy lặp 'phần phụ ấy' để giữ tham chiếu số ít và tránh đại từ mơ hồ trong tiếng Việt.
theological_decisions: []
