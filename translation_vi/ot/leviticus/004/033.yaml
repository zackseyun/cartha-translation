base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: vi
  text: Người ấy phải đặt tay mình lên đầu con vật dùng làm lễ vật chuộc tội, rồi giết nó làm lễ vật chuộc tội tại nơi người ta giết lễ vật toàn thiêu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch cả hai chỗ “lễ vật chuộc tội” là “lễ vật thanh tẩy”; từ Hê-bơ-rơ có thể chỉ lễ vật xử lý tội lỗi và tình trạng ô uế nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: phải đặt
  rationale: Trong nghi thức hiến tế, động từ này chỉ hành động đặt hoặc ấn tay lên con vật. “Đặt” tự nhiên trong tiếng Việt và không diễn giải quá mức ý nghĩa biểu tượng của hành động.
- source_word: יָדוֹ
  choice: tay mình
  rationale: Danh từ Hê-bơ-rơ ở số ít và có hậu tố ngôi thứ ba giống đực số ít; bản dịch giữ nguyên số ít thay vì đổi thành “hai tay”.
- source_word: עַל רֹאשׁ הַחַטָּאת
  choice: trên đầu con vật dùng làm lễ vật chuộc tội
  rationale: חַטָּאת trong ngữ cảnh có thể chỉ chính con vật hiến tế. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời làm rõ rằng tay được đặt trên đầu con vật mà không thêm ý nghĩa thần học.
- source_word: וְשָׁחַט
  choice: rồi giết
  rationale: שׁחט là động từ chuyên dùng cho việc giết con vật hiến tế. “Giết” rõ ràng, trang trọng vừa phải và phù hợp với tiếng Việt hiện đại.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: 'Giới từ לְ đánh dấu mục đích hoặc tư cách của con vật: nó bị giết để làm lễ vật này.'
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: tại nơi người ta giết
  rationale: Động từ Hê-bơ-rơ ở ngôi thứ ba số ít không nêu rõ chủ thể; “người ta” diễn đạt quy trình thông thường mà không gán hành động cho một người cụ thể.
- source_word: הָעֹלָה
  choice: lễ vật toàn thiêu
  rationale: Thuật ngữ này chỉ lễ vật được thiêu trọn trên bàn thờ. “Lễ vật toàn thiêu” vừa dễ hiểu vừa phân biệt loại tế lễ này với các lễ vật chỉ được thiêu một phần.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật hiến tế
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ Hê-bơ-rơ có thể nhấn mạnh tội lỗi được xử lý hoặc sự thanh tẩy khỏi ô uế nghi lễ. “Lễ vật chuộc tội” là cách gọi quen thuộc và phù hợp với ngữ cảnh, còn sắc thái “thanh tẩy” được giữ trong chú thích để không xóa bỏ sự đa nghĩa thật sự.
translation_notes:
  register: Văn phong luật lệ, trang trọng nhưng hiện đại và dễ hiểu. Dùng “phải” để thể hiện hiệu lực chỉ dẫn của thể động từ trong luật nghi lễ; giữ “tay” ở số ít và tránh giải thích biểu tượng của nghi thức đặt tay.
