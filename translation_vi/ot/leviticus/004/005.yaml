base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: vi
  text: Thầy tế lễ được xức dầu sẽ lấy một ít huyết[a] của con bò đực và đem vào[b] Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “lấy từ huyết của con bò đực.” Trong tiếng Hê-bơ-rơ, cách nói này nhiều khả năng có nghĩa là lấy một phần huyết.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ là “đến Lều Hội Kiến”; dịch là “vào” theo ngữ cảnh nghi lễ, vì những hành động tiếp theo diễn ra bên trong nơi thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: sẽ lấy
  rationale: Trong trình tự nghi lễ, waw + qatal mang chức năng chỉ dẫn và diễn tả hành động kế tiếp; “sẽ lấy” tự nhiên trong tiếng Việt và giữ sắc thái quy định.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: thầy tế lễ được xức dầu
  rationale: Giữ nghĩa trực tiếp của מָשִׁיחַ là người đã được xức dầu, không thay bằng danh xưng diễn giải “thầy tế lễ thượng phẩm” và cũng không gợi thêm hàm ý Kitô học.
- source_word: מִדַּם הַפָּר
  choice: một ít huyết của con bò đực
  rationale: 'מִן ở đây nhiều khả năng có nghĩa bộ phận: thầy tế lễ lấy một phần huyết chứ không lấy toàn bộ. “Huyết” phù hợp văn phong nghi lễ Kinh Thánh, còn “con bò đực” chuyển tải rõ פַּר.'
- source_word: וְהֵבִיא אֹתוֹ
  choice: và đem
  rationale: Đại từ chỉ về lượng huyết vừa nói; tiếng Việt có thể lược đại từ mà vẫn rõ nghĩa và tự nhiên. Sắc thái chỉ dẫn của hành động tiếp nối được kế thừa từ “sẽ” ở động từ đầu.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: vào Lều Hội Kiến
  rationale: אֶל về mặt hình thức có thể là “đến”, nhưng ngữ cảnh nghi lễ ở các câu sau cho thấy thầy tế lễ đi vào bên trong. “Lều Hội Kiến” là cách gọi trang trọng, gọn và quen thuộc cho אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Cách dịch הַכֹּהֵן הַמָּשִׁיחַ
  choice: thầy tế lễ được xức dầu
  alternative: thầy tế lễ thượng phẩm; thầy tế lễ đã được biệt riêng
  rationale: Bản dịch giữ ý nghĩa từ vựng “được xức dầu” và địa vị nghi lễ được nêu trong tiếng Hê-bơ-rơ, thay vì thay thế bằng một chức danh suy diễn hoặc đưa hàm ý Đấng Mê-si vào văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” và “huyết” để duy trì sắc thái nghi lễ; viết hoa “Lều Hội Kiến” như tên gọi của nơi thánh. Cả hai dấu chú thích [a], [b] đều được đặt trong chính văn.
