  terminology: “Thầy tế lễ,” “huyết,” “rảy,” “Yahweh,” và “bức màn của nơi thánh” phù hợp với văn phong nghi lễ trang trọng, hiện đại. Giữ “nơi thánh” viết thường trong bản văn chính để không áp đặt đây nhất thiết là tên kỹ thuật của một gian cụ thể.
