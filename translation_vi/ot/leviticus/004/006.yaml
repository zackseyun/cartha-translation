  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của tiếng Hê-bơ-rơ: thầy tế lễ nhúng ngón tay vào huyết, rảy từ huyết bảy lần, trước mặt Yahweh và ở phía trước bức màn thuộc nơi thánh. Tuy nhiên, “về phía trước bức màn” có thể gợi hành động rảy theo hướng bức màn hơn là vị trí nghi lễ được diễn đạt bởi thành ngữ אֶת־פְּנֵי.'
