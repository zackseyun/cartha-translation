  rationale: Chỉ thay “về phía trước” bằng “ở phía trước” để tiếng Việt tự nhiên hơn và phản ánh chính xác hơn ý vị trí của cụm אֶת־פְּנֵי. Các lựa chọn thuật ngữ và chú thích hiện có được giữ lại.
