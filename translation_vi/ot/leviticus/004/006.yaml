id: LEV.4.6
reference: Leviticus 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: vi
  text: Thầy tế lễ sẽ nhúng ngón tay mình vào huyết, rồi rảy một phần huyết ấy bảy lần trước mặt Yahweh, ở phía trước bức màn của nơi thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước bức màn của Nơi Thánh.”'
    reason: Cấu trúc và cách phân đoạn của cụm cuối cho phép hiểu הַקֹּדֶשׁ là “Nơi Thánh” và gắn “trước” với bức màn.
lexical_decisions:
- source_word: וְטָבַל
  choice: sẽ nhúng
  rationale: Dạng waw + qatal tiếp nối chuỗi chỉ dẫn nghi lễ; “sẽ nhúng” diễn đạt tự nhiên lực chỉ thị trong văn luật lệ tiếng Việt.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Danh từ xác định số ít, chỉ người chủ trì nghi lễ; đây là cách gọi rõ và quen thuộc trong tiếng Việt.
- source_word: אֶצְבָּעוֹ בַּדָּם
  choice: ngón tay mình vào huyết
  rationale: Giữ số ít và đại từ quy chiếu về thầy tế lễ; “nhúng ... vào” là cấu trúc tiếng Việt tự nhiên cho ב chỉ chất mà ngón tay được nhúng vào.
- source_word: וְהִזָּה
  choice: rồi rảy
  rationale: Ở dạng Hiphil trong ngữ cảnh tế lễ, נזה chỉ hành động rảy huyết theo nghi thức; “rảy” chính xác và gọn hơn “vẩy” trong văn cảnh này.
- source_word: מִן־הַדָּם
  choice: một phần huyết ấy
  rationale: 'מן có nghĩa phân lượng: thầy tế lễ lấy một phần từ lượng huyết để rảy.'
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Cách diễn đạt số lần trực tiếp và tự nhiên.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי vừa có sắc thái không gian vừa chỉ sự hiện diện trong nghi lễ; “trước mặt” bảo toàn cả hai nét nghĩa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển trực tiếp danh riêng giao ước YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: về phía trước bức màn của nơi thánh
  rationale: אֶת־פְּנֵי chỉ hướng nhắm vào mặt trước của bức màn; פָּרֹכֶת הַקֹּדֶשׁ được hiểu tự nhiên là bức màn thuộc nơi thánh, nhưng cấu trúc Hê-bơ-rơ cho phép một cách phân đoạn khác nên được ghi chú.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh; giữ “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ cú pháp giữa לִפְנֵי יְהוָה và אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: trước mặt Yahweh, về phía trước bức màn của nơi thánh
  alternative: trước bức màn của Nơi Thánh
  rationale: Bản chính giữ cách phân đoạn theo các dấu ngắt Masoretic, gắn “trước mặt Yahweh” với hành động rảy và xem cụm sau là hướng rảy. Cách phân đoạn khác có thể hiểu cụm từ là “trước bức màn của Nơi Thánh”, vì vậy không nên xóa bỏ sự nhập nhằng này.
- issue: Thuật ngữ cultic פָּרֹכֶת הַקֹּדֶשׁ
  choice: bức màn của nơi thánh
  alternative: bức màn của Nơi Thánh / màn che nơi chí thánh
  rationale: “Bức màn” dễ hiểu và sát vật thể; “nơi thánh” không áp đặt rằng הַקֹּדֶשׁ nhất thiết là tên kỹ thuật của một gian cụ thể trong câu này.
translation_notes:
  register: Văn phong nghi lễ trang trọng nhưng hiện đại. Dùng “huyết” thay cho “máu” để duy trì sắc thái tế lễ quen thuộc mà vẫn dễ hiểu; dùng “thầy tế lễ” thay cho thuật ngữ cổ hơn. Dấu chú thích [a] xuất hiện đúng trong câu chính.
