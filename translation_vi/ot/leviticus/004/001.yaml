base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH, thường được phiên âm là “Yahweh”; cũng có cách phiên âm “Giê-hô-va”.'
    reason: Ghi nhận dạng nguyên ngữ của danh Đức Chúa Trời và một cách phiên âm khác.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời phán của Đức Chúa Trời được dịch là “phán”, cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và phân biệt phù hợp với lời nói thông thường.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, từ “với” là tương đương tự nhiên trong tiếng Việt cho đối tượng tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tên Moses.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dạng nguyên mẫu này giới thiệu nội dung lời phán; “rằng” chuyển tải chức năng ấy tự nhiên hơn trong tiếng Việt hiện đại so với lối dịch sát hình thức “nói rằng”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. “Yahweh” bảo tồn danh riêng và phản ánh cách phục nguyên được giới học thuật sử dụng rộng rãi, trong khi chú thích ghi nhận cách gọi truyền thống khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức mở đầu lời phán ngắn gọn; dùng “phán” cho lời Đức Chúa Trời và dấu hai chấm để dẫn vào nội dung tiếp theo.
