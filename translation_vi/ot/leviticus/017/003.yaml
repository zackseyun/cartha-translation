  text: אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל אֲשֶׁ֨ר יִשְׁחַ֜ט שׁ֥וֹר אוֹ כֶ֛שֶׂב אוֹ עֵ֖ז בַּֽ/מַּחֲנֶ֑ה א֚וֹ אֲשֶׁ֣ר יִשְׁחַ֔ט מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: vi
  text: Bất cứ người nào trong nhà Y-sơ-ra-ên giết một con bò, một con chiên hoặc một con dê trong trại, hay giết nó ngoài trại—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Bất cứ người nào
  rationale: Lối lặp phân phối trong tiếng Hê-bơ-rơ có nghĩa là bất cứ cá nhân nào; cách dịch này tự nhiên trong tiếng Việt và không thu hẹp phạm vi hơn nguyên văn.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: thuộc nhà Y-sơ-ra-ên
  rationale: Giữ thành ngữ giao ước–dân tộc “nhà Y-sơ-ra-ên”, đồng thời dùng “thuộc” cho quan hệ thành viên tự nhiên trong tiếng Việt.
- source_word: יִשְׁחַט
  choice: giết
  rationale: Trong ngữ cảnh luật về gia súc, động từ chỉ việc cắt cổ/giết thịt con vật. “Giết” rõ ràng, trang trọng vừa phải và không tự thêm ý rằng đây nhất thiết là hành vi dâng tế.
- source_word: שׁוֹר
  choice: con bò
  rationale: Danh từ chỉ một con thuộc loài bò, không nhất thiết riêng bò đực; “con bò” giữ độ khái quát của nguyên văn.
- source_word: כֶשֶׂב
  choice: con chiên
  rationale: Chỉ con vật thuộc loài chiên nói chung, không nhất thiết là chiên con; “chiên” phù hợp văn cảnh luật tế lễ.
- source_word: עֵז
  choice: con dê
  rationale: Cách tương đương thông dụng và chính xác cho loài vật này.
- source_word: בַּמַּחֲנֶה
  choice: trong trại
  rationale: Diễn đạt trực tiếp vị trí ở bên trong khu trại của dân Y-sơ-ra-ên.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ngoài trại
  rationale: Cách nói tự nhiên, súc tích cho vị trí bên ngoài khu trại.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: nào ... hay
  rationale: Giữ cấu trúc pháp lý song song nhưng tránh lặp đại từ quan hệ một cách nặng nề trong tiếng Việt.
- source_word: '[tân ngữ được hiểu ngầm sau יִשְׁחַט thứ hai]'
  choice: giết nó
  rationale: Bổ sung đại từ “nó” để chỉ lại con vật đã nêu, làm câu tiếng Việt rõ nghĩa mà không thêm nội dung mới.
theological_decisions:
- issue: Động từ שׁחט có nên được dịch theo nghĩa chuyên biệt là “dâng sinh tế” hay không
  choice: giết
  alternative: dâng sinh tế / giết làm sinh tế
  rationale: Bản thân động từ mô tả việc giết con vật và câu kế tiếp mới quy định việc đem nó đến Đền Tạm làm lễ vật. Vì vậy không đưa trước một ý nghĩa tế lễ chuyên biệt hơn điều câu này trực tiếp nói.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “nhà Y-sơ-ra-ên” để bảo tồn thành ngữ Hê-bơ-rơ; câu kết bằng gạch ngang vì cú pháp và phán quyết tiếp tục ở câu sau.
