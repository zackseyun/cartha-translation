revisions:
- from: Bất cứ người nào thuộc nhà Y-sơ-ra-ên giết một con bò, một con chiên hoặc một con dê trong trại, hay giết nó ngoài trại—
  to: Bất cứ người nào trong nhà Y-sơ-ra-ên giết một con bò, một con chiên hoặc một con dê trong trại, hay giết nó ngoài trại—
