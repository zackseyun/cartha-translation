source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: vi
  text: mà không đem nó đến lối vào Lều Hội Kiến để dâng nó lên Yahweh[a], thì người ấy sẽ bị cắt đứt khỏi dân mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “để làm/thực hiện nó cho Yahweh”; trong văn cảnh này, thành ngữ Hê-bơ-rơ nói đến việc dâng sinh tế.'
    reason: lexical_alternative
  - marker: b
    text: “Bị cắt đứt” là một công thức pháp lý; câu này không nói rõ hình phạt được thi hành theo cách nào. Cụm từ có thể hàm ý bị loại khỏi cộng đồng giao ước hoặc chịu sự phán xét trực tiếp của Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: lối vào
  rationale: Chỉ chỗ đi vào hoặc cửa vào; “lối vào” tự nhiên trong tiếng Việt hiện đại và phù hợp với bối cảnh nơi thánh.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Danh xưng cố định của nơi thánh dạng lều; cách dịch này vừa trang trọng vừa diễn đạt chức năng gặp gỡ của nơi ấy.
- source_word: יְבִיאֶנּוּ
  choice: đem nó đến
  rationale: Hậu tố giống đực số ít quy chiếu về con vật hiến tế trong văn cảnh trước; “nó” giữ hành động cụ thể mà không diễn giải thêm nghi lễ.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: để dâng nó lên Yahweh
  rationale: Nghĩa sát là “để làm/thực hiện nó cho Yahweh”, nhưng trong văn cảnh tế lễ, עשה là cách nói chỉ việc thực hiện hoặc dâng sinh tế. “Dâng nó lên” truyền đạt tự nhiên ý nghĩa nghi lễ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng chuyển tự thông dụng, thay vì thay thế bằng một tước hiệu.
- source_word: וְנִכְרַת
  choice: sẽ bị cắt đứt
  rationale: Giữ hình ảnh và công thức pháp lý của động từ Niphal כרת, không thu hẹp hình phạt thành xử tử hay khai trừ hành chính.
- source_word: הָאִישׁ הַהוּא
  choice: người ấy
  rationale: Trong tiếng Việt, “người ấy” là cách chỉ cá nhân phạm luật tự nhiên và chính xác; tiếng Việt không bắt buộc đánh dấu giống ngữ pháp như tiếng Hê-bơ-rơ.
- source_word: מֵעַמָּיו
  choice: khỏi dân mình
  rationale: Diễn đạt sự phân cách khỏi cộng đồng thuộc về người phạm luật, đồng thời giữ ngắn gọn cấu trúc nguồn.
theological_decisions:
- issue: Ý nghĩa của hình phạt וְנִכְרַת (“bị cắt đứt”)
  choice: Giữ công thức “sẽ bị cắt đứt khỏi dân mình” mà không xác định cơ chế thi hành.
  alternative: “sẽ bị xử tử”, “sẽ bị khai trừ khỏi cộng đồng”, hoặc “sẽ bị hủy diệt”
  rationale: Công thức pháp lý Hê-bơ-rơ tại đây không nói rõ đó là cái chết, khai trừ khỏi cộng đồng hay sự phán xét trực tiếp của Đức Chúa Trời. Bản dịch giữ nguyên sức nặng và tính chưa xác định của câu.
- issue: Cách thể hiện הָאִישׁ הַהוּא
  choice: Dịch là “người ấy”.
  alternative: “người đàn ông ấy”
  rationale: Danh từ Hê-bơ-rơ ở dạng giống đực số ít, nhưng trong công thức pháp lý này nó chỉ cá nhân phạm luật. “Người ấy” chuyển tải chính xác trong tiếng Việt tự nhiên mà không thêm sự nhấn mạnh giới tính không có chức năng rõ ràng trong văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mở đầu bằng “mà” để giữ liên kết cú pháp với mệnh đề điều kiện ở câu trước. “Lều Hội Kiến” được viết hoa như một danh xưng nơi thánh; tên Yahweh được giữ dưới dạng tên riêng.
