source:
  edition: WLC
  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: vi
  text: 'Vì thế, Ta đã phán với con cái Israel[a]: “Không một ai trong các con được ăn máu; người ngoại kiều đang cư ngụ giữa các con[b] cũng không được ăn máu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các con trai của Israel” hoặc “dân Israel.” Nguyên văn Hebrew là “các con trai của Israel.”
    reason: lexical_alternative
  - marker: b
    text: “Người ngoại kiều” ở đây là người không thuộc Israel nhưng cư trú giữa cộng đồng Israel và sống dưới luật lệ của cộng đồng ấy; cũng có thể dịch là “ngoại nhân cư trú” hoặc “người nước ngoài cư trú.”
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: 'Diễn đạt tự nhiên quan hệ kết luận với lý do ở câu trước: sự sống ở trong máu.'
- source_word: אָמַרְתִּי
  choice: Ta đã phán
  rationale: Giữ ngôi thứ nhất và sắc thái trang trọng của lời Đức Chúa Trời trong văn mạch luật pháp; thì hoàn thành tiếng Việt phù hợp với động từ Hebrew ở thể hoàn thành.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: với con cái Israel
  rationale: “Con cái Israel” là cách nói tiếng Việt tự nhiên, trang trọng và gần với thành ngữ Hebrew theo nghĩa đen là “các con trai của Israel,” đồng thời chỉ cộng đồng Israel.
- source_word: כָּל נֶפֶשׁ מִכֶּם לֹא תֹאכַל דָּם
  choice: Không một ai trong các con được ăn máu
  rationale: נֶפֶשׁ ở đây chỉ một cá nhân, không phải riêng phần “linh hồn.” Cấu trúc “không một ai” chuyển tải rõ lực phân bố và lệnh cấm.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: người ngoại kiều đang cư ngụ giữa các con
  rationale: גֵּר là người không thuộc Israel nhưng cư trú trong cộng đồng và chịu luật lệ của cộng đồng ấy. “Ngoại kiều” giữ được địa vị pháp lý-xã hội; “đang cư ngụ” tái hiện quan hệ từ vựng giữa danh từ và phân từ Hebrew.
- source_word: לֹא יֹאכַל דָּם
  choice: cũng không được ăn máu
  rationale: Diễn đạt lệnh cấm bằng tiếng Việt hiện đại; “cũng” làm rõ rằng cùng một điều cấm áp dụng cho người ngoại kiều.
theological_decisions:
- issue: Danh xưng giao ước có hình thức giống đực לִבְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai của Israel; dân Israel
  rationale: “Con cái Israel” giữ hình ảnh huyết thống của thành ngữ nguồn mà không khiến độc giả Việt hiểu sai rằng luật chỉ nói với nam giới; chú thích ghi rõ dạng chữ của Hebrew.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải. “Ta đã phán” phù hợp với lời thần phán trong văn mạch; “máu” thông dụng và trực tiếp hơn “huyết.” Cấu trúc song song của hai lệnh cấm được giữ lại, còn “cũng” được thêm để câu tiếng Việt liên kết tự nhiên.
