  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: vi
  text: để con dân Israel đem những sinh tế mà họ đang dâng ngoài đồng[a] đến cho thầy tế lễ tại cửa Lều Hội Kiến trước mặt Yahweh, rồi dâng chúng làm sinh tế bình an[b] cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở ngoài đồng trống.”'
    reason: Làm rõ thành ngữ עַל־פְּנֵי הַשָּׂדֶה chỉ vùng đồng trống bên ngoài nơi thánh.
  - marker: b
    text: “Sinh tế bình an” cũng có thể dịch là “sinh tế thông công” hoặc “sinh tế đem lại sự an lành.”
    reason: Ghi nhận phạm vi nghĩa của tên loại sinh tế שְׁלָמִים mà không quyết đoán một sắc thái duy nhất.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: để
  rationale: Diễn đạt tự nhiên mệnh đề chỉ mục đích, nối trực tiếp với mệnh lệnh ở câu trước.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Giữ sắc thái cộng đồng giao ước có nguồn gốc gia tộc, đồng thời tự nhiên và dễ hiểu hơn lối dịch sát chữ “các con trai Israel” trong tiếng Việt hiện đại.
- source_word: זִבְחֵיהֶם אֲשֶׁר הֵם זֹבְחִים
  choice: những sinh tế mà họ đang dâng
  rationale: “Sinh tế” biểu thị lễ vật được giết làm của lễ; “đang dâng” phản ánh cấu trúc phân từ chỉ hành động đang diễn ra hoặc theo lệ thường mà không lặp từ nặng nề.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: ngoài đồng
  rationale: Thành ngữ tự nhiên chỉ nơi trống trải ngoài khu thánh, không dịch máy móc là “trên mặt cánh đồng”.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ danh riêng giao ước יהוה; giới từ được diễn đạt là “cho” khi nói về việc đem và dâng sinh tế.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: lối vào Lều Hội Kiến
  rationale: Cách gọi trang trọng, rõ nghĩa cho địa điểm thánh; “lối vào” tự nhiên trong tiếng Việt.
- source_word: אֶל הַכֹּהֵן
  choice: đến với thầy tế lễ
  rationale: Giữ mạo từ xác định của tiếng Hê-bơ-rơ và cho thấy sinh tế được đưa đến vị tư tế thi hành chức vụ tại nơi thánh.
- source_word: זִבְחֵי שְׁלָמִים
  choice: sinh tế bình an
  rationale: Giữ đây là một loại sinh tế cụ thể và bảo tồn liên hệ ngữ nghĩa của שְׁלָמִים với sự bình an, toàn vẹn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA hoặc Đức Giê-hô-va
  rationale: Nguyên văn dùng danh giao ước יהוה; phiên âm “Yahweh” phân biệt danh riêng này với tước hiệu “Chúa”.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai Israel hoặc dân Israel
  rationale: Cụm Hê-bơ-rơ mang hình thức gia tộc giống đực nhưng trong ngữ cảnh chỉ cộng đồng giao ước; “con dân Israel” giữ được sắc thái thuộc dân tộc mà không gây hiểu nhầm rằng chỉ nói đến con trai theo nghĩa sinh học.
- issue: Ý nghĩa của זִבְחֵי שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công hoặc sinh tế cầu an
  rationale: “Bình an” giữ trường nghĩa rộng của שׁלם gồm bình an, toàn vẹn và phúc lành, không thu hẹp loại lễ này chỉ còn khía cạnh thông công hay cầu xin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “sinh tế” để phân biệt lễ vật được giết hiến tế với khái niệm rộng hơn là “lễ vật”; viết hoa “Lều Hội Kiến” như tên gọi thiết chế thánh. Câu giữ chuỗi hành động của nguyên văn nhưng thêm “rồi” để quan hệ tuần tự rõ ràng trong tiếng Việt.
