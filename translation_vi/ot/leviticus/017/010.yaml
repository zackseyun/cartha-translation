  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: vi
  text: “Bất cứ ai thuộc nhà Y-sơ-ra-ên, hoặc là người ngoại kiều cư ngụ giữa họ[a], hễ ăn bất cứ huyết nào, Ta sẽ hướng mặt Ta chống lại người ăn huyết ấy[b] và cắt bỏ người ấy khỏi giữa dân mình[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngoại kiều” cũng có thể dịch là “kiều dân” hoặc “người nước ngoài cư trú giữa họ”; từ Hê-bơ-rơ chỉ người không phải bản địa nhưng sống trong cộng đồng Y-sơ-ra-ên.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “sinh mạng/người ăn huyết”; ở đây từ này chỉ chính cá nhân phạm luật.
    reason: lexical_alternative
  - marker: c
    text: “Cắt bỏ” là một công thức hình phạt trong bối cảnh giao ước. Tại đây, câu không nói rõ đó là cái chết, sự khai trừ hay một hình thức phán xét khác của Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: Bất cứ ai
  rationale: Lối lặp אִישׁ אִישׁ có ý nghĩa phân phối, chỉ bất cứ cá nhân nào. “Bất cứ ai” truyền đạt tự nhiên lực của công thức pháp lý này trong tiếng Việt mà không buộc từ ngữ phải chỉ riêng nam giới.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: thuộc nhà Y-sơ-ra-ên
  rationale: Giữ thành ngữ giao ước “nhà Y-sơ-ra-ên” thay vì giản lược thành “Y-sơ-ra-ên”; “thuộc” diễn đạt tự nhiên quan hệ thành viên.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: hay thuộc số ngoại kiều đang cư ngụ giữa họ
  rationale: גֵּר chỉ người không phải bản địa nhưng cư trú trong xã hội Y-sơ-ra-ên, không đơn thuần là khách qua đường. Cụm “đang cư ngụ” phản ánh phân từ đồng gốc הַגָּר mà vẫn tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: mà ăn bất kỳ thứ huyết nào
  rationale: Giữ nghĩa thông thường của יֹאכַל là “ăn”; “bất kỳ thứ huyết nào” thể hiện phạm vi toàn diện của כָּל דָּם.
- source_word: וְנָתַתִּי פָנַי
  choice: Ta sẽ hướng mặt chống lại
  rationale: Giữ hình ảnh nhân hình của thành ngữ Hê-bơ-rơ về sự chống đối và phán xét của Đức Chúa Trời, thay vì diễn giải thành “Ta sẽ trừng phạt” hay “Ta sẽ nổi giận”.
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: chống lại người ăn
  rationale: Trong ngữ cảnh pháp lý này, נֶפֶשׁ chỉ chính cá nhân phạm luật. “Người” tránh tạo ấn tượng rằng câu chỉ nói đến một phần phi vật chất gọi là “linh hồn”.
- source_word: אֶת הַדָּם
  choice: huyết ấy
  rationale: Từ chỉ định “ấy” quy chiếu rõ về thứ huyết vừa được nhắc đến, tương ứng với tính xác định của הַדָּם.
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: và sẽ cắt bỏ người ấy
  rationale: “Cắt bỏ” duy trì hình ảnh và tính nghiêm trọng của הִכְרִית nhưng không tự ý xác định hình thức thi hành là xử tử, trục xuất hay một sự phán xét trực tiếp khác.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: khỏi giữa dân mình
  rationale: “Khỏi giữa” phản ánh מִקֶּרֶב; “dân mình” quy chiếu tự nhiên đến cộng đồng của người phạm luật mà không cần gán giới tính cho đại từ.
theological_decisions:
- issue: Ý nghĩa của công thức hình phạt “cắt bỏ”
  choice: Giữ cách nói “cắt bỏ ... khỏi giữa dân mình” mà không xác định cơ chế của hình phạt.
  alternative: Diệt người ấy; xử tử người ấy; khai trừ người ấy; loại người ấy bằng sự phán xét của Đức Chúa Trời.
  rationale: Câu này công bố sự phán xét giao ước nghiêm trọng nhưng không nói rõ hình thức thực hiện. Giữ công thức có tính hình ảnh bảo tồn sự mơ hồ thật sự của nguyên văn, thay vì thiên về tử hình, khai trừ khỏi cộng đồng hay một cách hiểu giáo lý riêng.
translation_notes:
  register: Văn phong pháp lý, trang nghiêm nhưng hiện đại. Dùng “huyết” thay cho “máu” để phù hợp ngữ vực nghi lễ của Lê-vi Ký, đồng thời vẫn dễ hiểu. Đại từ “Ta” thể hiện lời phán trực tiếp của Đức Chúa Trời. Tên “Y-sơ-ra-ên” theo lối phiên âm quen thuộc trong tiếng Việt.
