id: LEV.17.15
reference: Leviticus 17:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: vi
  text: Bất cứ ai ăn xác con vật tự chết hoặc con vật bị thú dữ xé[a], dù là người bản xứ hay ngoại kiều cư trú[b], đều phải giặt quần áo, tắm bằng nước và sẽ bị ô uế cho đến chiều tối; sau đó người ấy sẽ được thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “xác thú” và “con vật bị xé”; từ Hê-bơ-rơ thứ nhất chỉ xác con vật chết mà không được giết mổ đúng quy cách.
    reason: lexical_alternative
  - marker: b
    text: “Ngoại kiều cư trú” là người ngoại quốc sống giữa cộng đồng, không chỉ là khách qua đường.
    reason: lexical_clarification
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: bất cứ ai
  rationale: Trong văn bản luật pháp, từ này chỉ một cá nhân; cách diễn đạt này tự nhiên trong mệnh đề điều kiện phổ quát.
- source_word: נְבֵלָה
  choice: xác con vật tự chết
  rationale: Diễn đạt loại xác thú chết mà không qua việc giết mổ đúng quy cách, đồng thời rõ nghĩa hơn từ đơn thuần “xác”.
- source_word: טְרֵפָה
  choice: con vật bị thú dữ xé
  rationale: Giữ ý con vật bị loài săn mồi xé, phù hợp phạm vi nghĩa của từ Hê-bơ-rơ.
- source_word: בָּאֶזְרָח
  choice: người bản xứ
  rationale: Chỉ thành viên bản địa của cộng đồng Y-sơ-ra-ên và tạo thế đối xứng rõ với ngoại kiều cư trú.
- source_word: בַגֵּר
  choice: ngoại kiều cư trú
  rationale: Chỉ người ngoại quốc sống lâu dài giữa cộng đồng, không phải khách vãng lai.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: phải giặt quần áo
  rationale: Thể hiện yêu cầu pháp định bằng tiếng Việt tự nhiên và hiện đại.
- source_word: וְרָחַץ בַּמַּיִם
  choice: tắm bằng nước
  rationale: Chỉ việc rửa thân thể trong nghi thức; cách dịch ngắn gọn và sát nghĩa.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: sẽ bị ô uế cho đến chiều tối
  rationale: Giữ phạm trù ô uế nghi lễ và thời hạn được nêu trong nguyên văn, không biến thành sự gian ác về đạo đức.
- source_word: וְטָהֵר
  choice: sau đó người ấy sẽ được thanh sạch
  rationale: Nêu rõ trình tự kết thúc tình trạng ô uế tạm thời sau việc tẩy rửa và khi thời hạn đã qua.
theological_decisions:
- issue: Bản chất của tình trạng טָמֵא/טָהֵר trong luật thanh sạch
  choice: Dịch là “bị ô uế/được thanh sạch” theo nghĩa nghi lễ.
  alternative: “bị nhơ bẩn/được tẩy sạch” theo nghĩa có thể bị hiểu là đạo đức.
  rationale: Ngữ cảnh nói về địa vị nghi lễ phát sinh do ăn xác thú, không đồng nhất trực tiếp tình trạng ấy với sự suy đồi đạo đức hay tội lỗi cá nhân.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại; dùng “bất cứ ai… đều phải” để truyền đạt cấu trúc phổ quát, và giữ thuật ngữ nghi lễ “ô uế/thanh sạch” nhất quán với sách Lê-vi.
