source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: vi
  text: Vì sự sống[a] của xác thịt ở trong máu, và chính Ta đã ban máu ấy cho các con trên bàn thờ để chuộc tội cho các con; vì chính máu chuộc tội nhờ sự sống[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng nephesh, có thể mang nghĩa “sự sống”, “mạng sống”, “bản thân” hoặc “con người” tùy ngữ cảnh; trong câu này nghĩa chính là sự sống.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “vì chính máu chuộc tội bởi sự sống.” Cụm từ Hê-bơ-rơ cô đọng và có thể hiểu theo vài cách; cũng có thể hiểu là máu chuộc tội nhờ sự sống ở trong máu.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: sự sống / mạng sống
  rationale: Trong mạch văn tế lễ này, từ này chỉ sự sống của sinh vật chứ không nhất thiết là một “linh hồn” phi vật chất. “Sự sống” hợp với mệnh đề nói về máu; “mạng sống” tự nhiên hơn khi chỉ mạng sống của những người được chuộc tội.
- source_word: הַבָּשָׂר
  choice: xác thịt
  rationale: Giữ sát nghĩa về phần xác của sinh vật sống, đồng thời không thu hẹp thành “thịt” dùng làm thực phẩm.
- source_word: בַּדָּם
  choice: ở trong máu
  rationale: Diễn đạt nghĩa vị trí/phạm vi của giới từ ב và giữ nguyên mối liên hệ được bản Hê-bơ-rơ xác lập giữa sự sống với máu.
- source_word: נְתַתִּיו לָכֶם
  choice: chính Ta đã ban máu ấy cho các con
  rationale: Đại từ giống đực số ít quy chiếu tự nhiên nhất về “máu”; nói rõ “máu ấy” giúp tiếng Việt tránh đại từ mơ hồ. “Chính Ta” cũng chuyển tải sự nhấn mạnh của וַאֲנִי.
- source_word: עַל הַמִּזְבֵּחַ
  choice: trên bàn thờ
  rationale: Cách nói tự nhiên, chính xác trong ngữ cảnh tế lễ.
- source_word: לְכַפֵּר
  choice: để chuộc tội
  rationale: Đây là thuật ngữ tế lễ quen thuộc và dễ hiểu trong tiếng Việt; nó diễn đạt hành động xóa bỏ hoặc xử lý tội lỗi mà không áp đặt một lý thuyết thần học chi tiết.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: cho mạng sống các con
  rationale: “Mạng sống” giữ nghĩa נֶפֶשׁ trong câu và tránh hàm ý phân đôi thân xác–linh hồn không có trong nguyên văn.
- source_word: בַּנֶּפֶשׁ יְכַפֵּר
  choice: chuộc tội nhờ sự sống ở trong nó
  rationale: Hiểu ב theo nghĩa phương tiện/căn cứ và làm rõ rằng sự sống được nói đến là sự sống ở trong máu. Chú thích lưu lại cách dịch sát, cô đọng hơn của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của נֶפֶשׁ trong luật tế lễ
  choice: Dịch là “sự sống” và “mạng sống”, không dịch là “linh hồn”.
  alternative: “linh hồn” hoặc “bản thân/con người”
  rationale: Lập luận của câu dựa trên sự sống gắn với máu. “Linh hồn” có thể đưa vào một sự phân biệt nhân học mà bản Hê-bơ-rơ không đòi hỏi.
- issue: Lực nghĩa của בַּנֶּפֶשׁ trong mệnh đề cuối
  choice: “nhờ sự sống ở trong nó”
  alternative: “bởi sự sống”; “vì sự sống”; “nhờ sự sống”
  rationale: Cụm Hê-bơ-rơ cô đọng và có thể được hiểu theo vài cách. Bản chính dùng cách diễn đạt tự nhiên nhưng không tách hiệu lực chuộc tội của máu khỏi sự sống gắn với máu; chú thích bảo tồn cách diễn đạt sát hơn.
- issue: Đối tượng của hành động כפר
  choice: “chuộc tội cho mạng sống các con”
  alternative: “chuộc tội cho các con” hoặc “làm lễ xá tội cho linh hồn các con”
  rationale: Giữ mối liên hệ từ vựng giữa hai lần xuất hiện của נֶפֶשׁ, đồng thời không xác định quá mức cơ chế thần học của sự chuộc tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” cho lời Đức Chúa Trời phán với cộng đồng; “chuộc tội” giữ sắc thái tế lễ. Hai chú thích được đặt đúng tại những điểm có vấn đề từ vựng và cú pháp thực sự.
