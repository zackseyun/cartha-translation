id: LEV.17.13
reference: Leviticus 17:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: vi
  text: Bất cứ người nào trong con dân Israel, hoặc ngoại kiều đang cư ngụ giữa họ[a], nếu săn được thú rừng hay chim có thể dùng làm thức ăn, thì phải đổ huyết nó ra và lấy đất phủ lên huyết ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngoại kiều” là người không thuộc Israel nhưng đang cư trú trong cộng đồng của họ.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “lấy đất phủ nó”; đại từ “nó” rất có thể chỉ huyết vừa được nhắc đến.'
    reason: ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Bất cứ người nào
  rationale: Cách lặp danh từ trong tiếng Hê-bơ-rơ mang ý phân phối; lối dịch này diễn đạt tự nhiên nghĩa “bất kỳ ai” trong tiếng Việt.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: trong con dân Israel
  rationale: “Con dân Israel” giữ được sắc thái cộng đồng giao ước của cụm từ nguồn mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: ngoại kiều đang cư ngụ giữa họ
  rationale: גר chỉ người không thuộc Israel nhưng cư trú trong cộng đồng; “ngoại kiều” nêu rõ địa vị này, còn “đang cư ngụ” phản ánh động từ cùng gốc.
- source_word: יָצוּד צֵיד
  choice: săn được
  rationale: Cấu trúc động từ–danh từ cùng gốc diễn tả việc săn bắt; “săn được” tự nhiên và phù hợp với con thú hoặc chim sau đó bị lấy huyết.
- source_word: חַיָּה אוֹ עוֹף
  choice: thú rừng hay chim
  rationale: Trong ngữ cảnh săn bắt, חַיָּה là thú hoang chứ không phải động vật nói chung; “thú rừng” là cách nói rõ và thông dụng.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: có thể dùng làm thức ăn
  rationale: Dạng bị động cho phép hiểu là loài được phép hoặc thích hợp để ăn; cách dịch này giữ sắc thái khả dụng mà không giải thích quá mức.
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: thì phải đổ huyết nó ra
  rationale: Trong văn luật pháp, động từ mang lực mệnh lệnh; “phải” diễn đạt rõ tính bắt buộc. Đại từ chỉ con thú hoặc chim vừa săn được.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: và lấy đất phủ lên huyết ấy
  rationale: עָפָר có thể là bụi hoặc đất tơi; “đất” tự nhiên trong hành động che phủ. Việc lặp “huyết ấy” làm rõ đại từ mà không làm mất nội dung nguồn.
theological_decisions:
- issue: Đối tượng của đại từ trong וְכִסָּהוּ
  choice: huyết được phủ bằng đất
  alternative: con vật được phủ hoặc chôn
  rationale: Tiền ngữ gần nhất là “huyết nó”, và quy định trong ngữ cảnh Lê-vi Ký 17 tập trung vào cách xử lý huyết. Bản dịch nêu cách hiểu tự nhiên nhất, đồng thời chú thích ghi nhận cấu trúc đại từ của nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “huyết” thay vì “máu” để duy trì sắc thái Kinh Thánh và mạch thần học của Lê-vi Ký; dùng “phải” để diễn đạt lực mệnh lệnh tự nhiên trong tiếng Việt hiện đại.
