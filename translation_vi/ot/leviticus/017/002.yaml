source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: vi
  text: 'Hãy nói với A-rôn, với các con trai ông và với toàn thể các con trai của Y-sơ-ra-ên[a], rồi nói với họ: ‘Đây là điều Yahweh đã truyền[b]:’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “toàn thể dân Y-sơ-ra-ên”. Nguyên văn là “toàn thể các con trai của Y-sơ-ra-ên”, một danh xưng tập thể chỉ dân Y-sơ-ra-ên.
    reason: lexical_alternative
  - marker: b
    text: “Điều” cũng có thể dịch là “lời” hoặc “việc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Mệnh lệnh Piel ngôi hai số ít, trực tiếp truyền cho Môi-se phải nói; “Hãy nói” giữ rõ lực mệnh lệnh và tự nhiên trong tiếng Việt.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Danh từ giống đực số nhiều với hậu tố ngôi ba giống đực số ít, chỉ các con trai của A-rôn trong bối cảnh tư tế.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: toàn thể con cái Y-sơ-ra-ên
  rationale: Đây là cách gọi dân tộc theo quan hệ gia tộc, theo nghĩa đen là “mọi con trai/con cái của Y-sơ-ra-ên”; “con cái Y-sơ-ra-ên” vừa bảo lưu hình ảnh gia tộc vừa là cách nói tiếng Việt dễ hiểu.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: rồi bảo họ
  rationale: Mệnh lệnh tiếp nối sau động từ mệnh lệnh đầu tiên; “rồi bảo họ” thể hiện trình tự và tránh lặp “nói ... nói với” nặng nề trong tiếng Việt.
- source_word: זֶה הַדָּבָר
  choice: Đây là điều
  rationale: דָּבָר có thể là “lời”, “việc” hoặc “điều”. Trong công thức dẫn nhập một mệnh lệnh cụ thể, “điều” tự nhiên và vẫn giữ độ rộng nghĩa của từ Hê-bơ-rơ.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Thể hoàn thành của צוה; “đã truyền” diễn đạt mệnh lệnh đã được ban và sắp được nêu ra.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng danh riêng giao ước thay vì thay thế bằng một tước hiệu; “Đức” là kính ngữ tự nhiên trong tiếng Việt, còn “Giê-hô-va” là dạng tên đã quen thuộc với độc giả Việt.
- source_word: לֵאמֹר
  choice: dấu hai chấm
  rationale: Phân từ nguyên dạng này giới thiệu nội dung được phán. Trong tiếng Việt hiện đại, dấu hai chấm trước lời tiếp theo chuyển tải chức năng ấy tự nhiên hơn việc thêm “rằng” ở cuối câu.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản nguồn dùng trực tiếp danh riêng của Đức Chúa Trời. Bản dịch giữ danh riêng, không thay bằng “CHÚA”; dạng “Đức Giê-hô-va” trang trọng và quen thuộc trong tiếng Việt.
- issue: Có giữ nguyên cách gọi mang tính gia tộc בְּנֵי יִשְׂרָאֵל hay không
  choice: toàn thể con cái Y-sơ-ra-ên
  alternative: toàn thể dân Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” bảo lưu hình ảnh gia tộc của nguyên văn, nhưng trong thành ngữ này chỉ toàn dân Y-sơ-ra-ên chứ không nhất thiết chỉ nam giới; chú thích nêu cách diễn đạt chức năng.
- issue: Cách thể hiện לֵאמֹר ở cuối câu
  choice: dùng dấu hai chấm để dẫn nội dung tiếp theo
  alternative: “mà rằng” hoặc “rằng”
  rationale: Nguyên văn báo hiệu lời truyền tiếp diễn sang câu sau. Dấu hai chấm giữ đúng chức năng diễn ngôn mà không tạo một kết câu gượng trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ riêng “các con trai” khi nói về con của A-rôn, nhưng dùng thành ngữ quen thuộc “con cái Y-sơ-ra-ên” cho danh xưng dân tộc. Dấu hai chấm cho thấy lời truyền tiếp tục ở câu sau.
