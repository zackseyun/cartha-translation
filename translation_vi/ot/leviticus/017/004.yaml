  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: vi
  text: 'mà không đem con vật ấy đến lối vào Lều Hội Kiến để dâng con vật ấy làm lễ vật cho Đức Giê-hô-va, trước Đền Tạm của Đức Giê-hô-va, thì máu sẽ bị quy cho người ấy[a]: người ấy đã làm đổ máu, và người ấy sẽ bị cắt khỏi giữa dân mình.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “máu sẽ bị kể cho người ấy.” Đây là cách diễn đạt pháp lý chỉ trách nhiệm về việc làm đổ máu.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “bị cắt khỏi” ở đây không nói rõ hình phạt là chết, trục xuất hay một hình thức loại khỏi cộng đồng giao ước khác.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: cửa Lều Hội Kiến
  rationale: “Cửa” diễn đạt tự nhiên פֶּתַח, còn “Lều Hội Kiến” là cách gọi quen thuộc và chính xác của nơi thánh אֹהֶל מוֹעֵד.
- source_word: הֱבִיאוֹ
  choice: đem con vật ấy đến
  rationale: Động từ Hiphil của בוא có nghĩa “đem đến”; đại từ bổ ngữ chỉ con vật bị giết ở câu trước, nên nói rõ “con vật ấy” giúp tiếng Việt tự nhiên.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: để dâng làm lễ vật
  rationale: Cách dịch này giữ ý nghi lễ của הקריב và קָרְבָּן mà tránh lối lặp gượng “dâng một lễ dâng”.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước יהוה bằng dạng phiên âm quen thuộc trong tiếng Việt; “dâng ... lên” là kết hợp từ tự nhiên.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: trước Đền Tạm của Đức Giê-hô-va
  rationale: לִפְנֵי mang nghĩa không gian “trước”; מִשְׁכָּן chỉ nơi ngự/thánh sở di động và được diễn đạt bằng thuật ngữ quen thuộc “Đền Tạm”.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: người ấy bị kể là đã làm đổ máu
  rationale: Giữ động từ pháp lý “bị kể là” và chuyển thành câu tiếng Việt tự nhiên, thể hiện trách nhiệm về việc làm đổ máu mà không dùng thuật ngữ khó hiểu.
- source_word: דָּם שָׁפָךְ
  choice: người ấy đã làm đổ máu
  rationale: Bảo toàn thành ngữ Hê-bơ-rơ và sức nặng pháp lý–đạo đức của lời tuyên bố.
- source_word: וְנִכְרַת ... מִקֶּרֶב עַמּוֹ
  choice: sẽ bị khai trừ khỏi dân mình
  rationale: “Khai trừ khỏi dân mình” truyền đạt công thức loại khỏi cộng đồng, nhưng không xác định phương thức thi hành mà nguyên văn không nói rõ.
theological_decisions:
- issue: Ý nghĩa pháp lý của דָּם יֵחָשֵׁב
  choice: bị kể là đã làm đổ máu
  alternative: máu sẽ bị quy cho người ấy
  rationale: Cách chọn làm rõ đây là lời quy trách nhiệm về đổ máu, đồng thời chú thích bảo tồn hình thức sát chữ và tránh suy diễn thêm về bản chất hình phạt.
- issue: Ý nghĩa hình phạt וְנִכְרַת
  choice: sẽ bị khai trừ khỏi dân mình
  alternative: sẽ bị xử tử / sẽ bị trục xuất
  rationale: Nguyên văn không xác định tại đây việc bị loại khỏi dân được thực hiện bằng cái chết, trục xuất hay một hình thức đoạn tuyệt giao ước khác; bản dịch không giải quyết sự mơ hồ ấy.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng rõ ràng với độc giả Việt Nam hiện đại. Dùng “Lều Hội Kiến,” “Đền Tạm” và “Đức Giê-hô-va” nhất quán; giữ sự lặp lại có chủ ý của “làm đổ máu” trong nguyên văn.
