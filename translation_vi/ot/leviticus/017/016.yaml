  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: vi
  text: Nhưng nếu người ấy không giặt y phục và không tắm rửa thân thể[a], thì người ấy phải mang tội mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “thịt mình”; tại đây chỉ việc tắm rửa thân thể.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phải chịu tội mình” hoặc “phải chịu hình phạt vì tội mình”. Thành ngữ pháp lý Hê-bơ-rơ có thể bao hàm cả tội lỗi lẫn hậu quả của tội ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ mở đầu trường hợp phủ định, tương phản với thủ tục thanh tẩy ở câu trước; “Nhưng nếu” diễn đạt tự nhiên sắc thái ấy.
- source_word: יְכַבֵּס
  choice: giặt y phục
  rationale: Dạng piel của כבס thường chỉ việc giặt đồ. Tân ngữ “y phục” được lược trong tiếng Hê-bơ-rơ nhưng được hiểu rõ từ câu trước và từ cách dùng thông thường của động từ này.
- source_word: וּבְשָׂרוֹ
  choice: thân thể
  rationale: בשר có nghĩa đen là “thịt”, nhưng trong ngữ cảnh tắm rửa theo nghi thức, từ này chỉ toàn thân của người ấy.
- source_word: יִרְחָץ
  choice: tắm rửa
  rationale: רחץ ở đây nói đến việc rửa thân thể; “tắm rửa” giúp phân biệt với việc giặt y phục.
- source_word: וְנָשָׂא
  choice: thì ... phải mang lấy
  rationale: Cấu trúc này nêu hậu quả của việc không thực hiện các việc tẩy rửa bắt buộc; “thì ... phải” phù hợp với văn phong luật lệ.
- source_word: עֲוֹנוֹ
  choice: tội mình
  rationale: עון có thể chỉ sự gian ác, tình trạng mắc tội, hoặc trách nhiệm và hậu quả do tội gây ra. “Mang lấy tội mình” giữ được độ rộng nghĩa của thành ngữ pháp lý Hê-bơ-rơ.
theological_decisions:
- issue: Ý nghĩa của thành ngữ pháp lý נָשָׂא עָוֹן
  choice: “phải mang lấy tội mình”, không xác định cụ thể hình phạt
  alternative: “phải chịu tội mình” hoặc “phải chịu hình phạt vì tội mình”
  rationale: Thành ngữ Hê-bơ-rơ có thể bao hàm cả tình trạng mắc tội lẫn hậu quả của tội. Bản dịch giữ nguyên sức căng này thay vì giới hạn nghĩa vào lỗi đạo đức hoặc hình phạt.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cụm “người ấy” phù hợp với văn bản luật lệ; “mang lấy tội mình” giữ sắc thái pháp lý-thần học và sự mơ hồ có chủ ý của nguyên văn.
