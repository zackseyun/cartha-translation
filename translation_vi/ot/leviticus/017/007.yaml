  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: vi
  text: Họ không được dâng các sinh tế của mình cho các quỷ dê nữa[a], là những kẻ mà họ làm điếm theo[b]. Đây sẽ là một quy định vĩnh viễn[c] cho họ, qua mọi thế hệ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tượng thần dê” hoặc “các thần dê”; từ Hê-bơ-rơ chỉ những hữu thể giống dê gắn với sự thờ phượng trái phép.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “mà họ làm điếm theo”; đây là ẩn dụ chỉ sự bất trung trong thờ phượng hoặc việc thờ thần tượng.'
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “một quy định thường trực” hoặc “một quy định lâu dài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... עוֹד
  choice: không được dâng ... nữa
  rationale: Thể chưa hoàn thành đi với phủ định trong văn luật pháp diễn tả lệnh cấm; “không được… nữa” truyền đạt cả tính cấm đoán lẫn ý chấm dứt một tập tục.
- source_word: זִבְחֵיהֶם
  choice: sinh tế của mình
  rationale: “Sinh tế” là cách gọi trang trọng nhưng dễ hiểu về lễ vật được giết để dâng, đồng thời giữ liên hệ với động từ “dâng” trong ngữ cảnh tế lễ.
- source_word: לַשְּׂעִירִם
  choice: cho các quỷ dê
  rationale: Danh từ nghĩa đen là những sinh vật có lông/dê, nhưng trong ngữ cảnh thờ phượng trái phép chỉ các hữu thể tà linh mang hình tượng dê; “quỷ dê” tránh đồng nhất với dê bình thường.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: là những thần mà họ chạy theo để làm điếm
  rationale: Giữ hình ảnh tình dục mạnh của động từ זנה và ý “chạy theo” của אַחֲרֵי; thêm “những thần” làm rõ đại từ chỉ các quỷ dê mà không xóa bỏ ẩn dụ về sự bất trung tôn giáo.
- source_word: חֻקַּת עוֹלָם
  choice: một quy định vĩnh viễn
  rationale: Cụm từ pháp lý chỉ một quy định có hiệu lực lâu dài, bền vững; “vĩnh viễn” giữ sắc thái mạnh của עוֹלָם, còn chú thích nêu phương án ít tuyệt đối hơn.
- source_word: לְדֹרֹתָם
  choice: qua mọi thế hệ
  rationale: Diễn đạt tự nhiên việc quy định tiếp tục áp dụng trong các thế hệ kế tiếp.
theological_decisions:
- issue: Đối tượng được gọi là שְּׂעִירִם trong sự thờ phượng trái phép
  choice: các hữu thể tà linh mang hình tượng dê (“quỷ dê”)
  alternative: dê, tượng thần dê, hoặc thần dê
  rationale: Ngữ cảnh hiến tế và mệnh đề nói đến việc làm điếm theo chúng ủng hộ đối tượng siêu nhiên hoặc thờ tượng hơn là loài dê thông thường; chú thích bảo lưu các khả năng từ vựng.
- issue: Sức mạnh của ẩn dụ זֹנִים về sự bất trung tôn giáo
  choice: giữ rõ ẩn dụ bằng “làm điếm”
  alternative: bất trung hoặc thờ thần tượng
  rationale: Nguyên văn dùng ngôn ngữ mại dâm để lên án việc chạy theo các thần khác. Dịch thẳng ẩn dụ bảo tồn sức nặng và sự căng thẳng thần học thay vì giải nghĩa ngay trong câu.
- issue: Phạm vi thời gian của חֻקַּת עוֹלָם
  choice: vĩnh viễn
  alternative: lâu dài hoặc thường trực
  rationale: “Vĩnh viễn” phản ánh trực tiếp công thức pháp lý Hê-bơ-rơ, nhưng chú thích thừa nhận rằng trong công thức giao ước từ này cũng có thể nhấn mạnh tính bền vững qua các thế hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm điếm” được giữ vì phản ánh ẩn dụ gay gắt của nguyên văn; “sinh tế” duy trì sắc thái nghi lễ mà không quá chuyên môn. Tất cả dấu chú thích đều được đặt ngay sau cụm từ liên quan.
