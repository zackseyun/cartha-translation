revisions:
- from: 'Đức Giê-hô-va phán với Môi-se[a] rằng:'
  to: 'Yahweh[a] phán với Môi-se rằng:'
  rationale: Sửa danh riêng để nhất quán với lựa chọn “Yahweh” trong bản POB đối chiếu, bỏ yếu tố “Đức” không có tương ứng trực tiếp trong nguyên văn, và chuyển neo chú thích đến đúng từ được chú giải. Các thành phần còn lại giữ nguyên ý nghĩa và chức năng công thức của câu Hê-bơ-rơ.
