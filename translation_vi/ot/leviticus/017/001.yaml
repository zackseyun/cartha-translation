  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Dạng wayyiqtol của דבר mở đầu một sự kiện phát ngôn mới. Trong công thức lời phán của Đức Chúa Trời, “phán” là cách diễn đạt tự nhiên, trang trọng và đúng ngữ cảnh hơn “nói”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng YHWH theo cách gọi đã quen thuộc trong tiếng Việt, không thay bằng tước hiệu “CHÚA”; yếu tố “Đức” phù hợp với lối xưng hô tôn kính tự nhiên.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu tiếng Việt “phán với ai”, “với” diễn đạt tự nhiên đối tượng tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tiếng Việt quen thuộc của tên riêng Hebrew מֹשֶׁה.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn lời tiếng Việt, “rằng” giới thiệu nội dung phát ngôn một cách tự nhiên, tránh lối dịch cứng “mà rằng” hoặc sự lặp thừa “phán… nói rằng”.
theological_decisions:
- issue: Cách thể hiện danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Bản dịch giữ đây là danh riêng thay vì thay bằng tước hiệu; chú thích cho biết dạng Hebrew và cách phiên chuyển khác để minh bạch truyền thống văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn nhập lời phán nhưng diễn đạt tự nhiên trong tiếng Việt; dấu [a] đặt ngay sau “Môi-se” theo vị trí của lớp tham khảo tiếng Anh, dù nội dung chú thích giải thích danh “Đức Giê-hô-va”.
