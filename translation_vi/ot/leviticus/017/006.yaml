id: LEV.17.6
reference: Leviticus 17:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Thầy tế lễ phải hắt[a] máu lên bàn thờ của Yahweh tại lối vào Lều Hội Kiến, rồi thiêu mỡ để làm hương thơm đẹp lòng Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vẩy” hoặc “rảy” máu lên bàn thờ; động từ Hê-bơ-rơ chỉ việc thầy tế lễ áp dụng máu lên bàn thờ theo nghi thức.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “làm một hương thơm êm dịu cho Yahweh”; cũng có thể dịch: “làm hương thơm được Yahweh vui nhận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: phải hắt
  rationale: Trong nghi lễ hiến tế, זָרַק chỉ việc thầy tế lễ hắt hoặc vẩy máu vào bàn thờ. “Hắt” giữ được động tác mạnh và cụ thể hơn “rảy”.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi tự nhiên, trang trọng và quen thuộc đối với כֹּהֵן trong ngữ cảnh Lê-vi.
- source_word: הַדָּם
  choice: máu
  rationale: Từ tương đương trực tiếp, dễ hiểu trong tiếng Việt hiện đại; đối tượng xác định đã rõ qua ngữ cảnh.
- source_word: עַל מִזְבַּח יְהוָה
  choice: vào bàn thờ của Yahweh
  rationale: Kết hợp với “hắt”, giới từ “vào” diễn đạt tự nhiên việc máu được hắt lên hoặc vào bề mặt bàn thờ, thay vì chỉ mô tả vị trí tĩnh.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: Giữ nghĩa địa điểm của פֶּתַח và dùng tên gọi trang trọng, dễ nhận biết cho אֹהֶל מוֹעֵד.
- source_word: וְהִקְטִיר
  choice: rồi thiêu
  rationale: Trong ngôn ngữ tế lễ, động từ chỉ việc đốt lễ vật trên bàn thờ cho bốc khói; “thiêu” ngắn gọn và trang trọng.
- source_word: הַחֵלֶב
  choice: mỡ
  rationale: Chỉ những phần mỡ dành riêng để thiêu trên bàn thờ trong luật hiến tế.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: làm hương thơm đẹp lòng
  rationale: Diễn đạt tự nhiên thành ngữ tế lễ về mùi hương được Đức Chúa Trời vui nhận, đồng thời không biến nó thành lời khẳng định thuần túy về mùi vị vật chất.
- source_word: יְהוָה / לַיהוָה
  choice: Yahweh / đẹp lòng Yahweh
  rationale: Giữ danh riêng giao ước được viết bằng Tứ Tự Danh; giới từ trong vế cuối được diễn đạt theo quan hệ của “hương thơm đẹp lòng” trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” bảo tồn chức năng danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng Yahweh
  alternative: hương thơm êm dịu cho Yahweh
  rationale: Cách dịch chính giữ ý Đức Chúa Trời vui nhận lễ vật nhưng chú thích vẫn bảo tồn khả năng chuyển dịch sát chữ hơn của thành ngữ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ trình tự nghi lễ của nguyên văn, dùng “phải” cho chỉ thị pháp luật và tránh thuật ngữ giáo phái riêng.
