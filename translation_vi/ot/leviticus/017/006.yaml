  rationale: Sửa “vào” thành “lên” để phản ánh chính xác hơn זָרַק עַל trong bối cảnh nghi thức, điều chỉnh chú thích a cho cùng hướng nghĩa, và di chuyển cả hai ký hiệu chú thích đến đúng từ/cụm từ được chú giải. “Để làm” làm rõ cấu trúc mục đích của việc thiêu mỡ mà không thêm nội dung.
  reviewer_model: gpt-5.6-terra
