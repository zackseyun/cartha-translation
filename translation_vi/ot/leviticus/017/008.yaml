language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/אֲלֵ/הֶ֣ם תֹּאמַ֔ר אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל וּ/מִן הַ/גֵּ֖ר אֲשֶׁר יָג֣וּר בְּ/תוֹכָ֑/ם אֲשֶׁר יַעֲלֶ֥ה עֹלָ֖ה אוֹ זָֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: vi
  text: 'Ngươi hãy nói với họ: Bất cứ người nam nào trong nhà Israel[a], hoặc bất cứ kiều dân nào cư ngụ giữa họ[b], mà dâng một lễ toàn thiêu hay một sinh tế—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn lặp từ “người nam” (“người nam, người nam”), một thành ngữ pháp lý có nghĩa là xét từng người trong mọi trường hợp.
    reason: lexical_alternative
  - marker: b
    text: “Kiều dân” chỉ người không phải Israel nhưng cư trú giữa dân Israel; cũng có thể dịch là “ngoại kiều” hoặc “khách trú”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: Ngươi hãy nói với họ
  rationale: Giữ lực nối tiếp của וַ và sắc thái chỉ thị của thể vị hoàn thành, đồng thời dùng trật tự câu tự nhiên trong tiếng Việt.
- source_word: אִישׁ אִישׁ
  choice: Bất cứ người nam nào
  rationale: Cụm danh từ lặp là thành ngữ phân phối trong văn luật, chỉ từng trường hợp; “người nam” giữ đúng hình thức giống đực của nguyên văn.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: thuộc nhà Israel
  rationale: “Nhà Israel” bảo toàn cách gọi cộng đồng giao ước; “thuộc” diễn đạt tự nhiên quan hệ thành viên do tiền tố מִן biểu thị trong ngữ cảnh.
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: hoặc bất cứ kiều dân nào đang cư ngụ giữa họ
  rationale: גֵּר là người ngoại tộc cư trú trong cộng đồng Israel; “kiều dân” ngắn gọn và mang sắc thái pháp lý, còn “đang cư ngụ” giữ liên hệ với động từ cùng gốc גּוּר.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: dâng
  rationale: Thể Hiphil của עלה với lễ vật là thành ngữ tế tự, nghĩa là đem dâng làm lễ; tiếng Việt không cần dịch máy móc ý ‘đưa lên’.
- source_word: עֹלָה
  choice: tế lễ thiêu
  rationale: Thuật ngữ chỉ lễ vật được thiêu trọn trên bàn thờ; đây là cách gọi rõ ràng, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: אוֹ זָבַח
  choice: hay một sinh tế
  rationale: Danh từ זֶבַח chỉ lễ vật là con vật bị giết để tế, phân biệt với tế lễ thiêu; “sinh tế” cô đọng và giữ sự phân biệt tế tự.
theological_decisions:
- issue: Thành ngữ phân phối giống đực אִישׁ אִישׁ
  choice: Bất cứ người nam nào
  alternative: Bất cứ ai
  rationale: Nguyên văn dùng danh từ giống đực số ít theo lối phân phối của văn luật. Bản dịch giữ dấu hiệu giới tính thay vì trung tính hóa, nhưng diễn đạt thành ngữ tự nhiên bằng “bất cứ... nào”.
- issue: Địa vị của גֵּר
  choice: kiều dân
  alternative: ngoại kiều; khách trú; người ngoại quốc cư trú
  rationale: Từ này chỉ người không phải Israel nhưng sinh sống giữa cộng đồng và chịu các quy định tế tự của cộng đồng; “kiều dân” thể hiện địa vị cư trú-pháp lý mà không đồng nhất họ với khách vãng lai.
- issue: Quan hệ giữa עֹלָה và זָבַח
  choice: tế lễ thiêu hay một sinh tế
  alternative: lễ toàn thiêu hay một tế lễ
  rationale: 'Giữ hai phạm trù lễ tế riêng biệt trong nguyên văn: עֹלָה là lễ vật bị thiêu trọn, còn זֶבַח là sinh vật bị giết để tế. Không thu hẹp thêm loại sinh tế khi câu này chưa nói rõ.'
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “ngươi” vì lời được truyền trực tiếp cho Moses trong ngữ cảnh; giữ “nhà Israel” như một cách gọi giao ước. Dấu gạch ngang cuối câu cho thấy cú pháp và chế tài còn tiếp diễn ở câu sau.
