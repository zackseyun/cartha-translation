  - severity: low
    issue: Quan hệ xưng hô “con dân Israel” / “Các con”
    rationale: “Các con” có thể gợi sắc thái Đức Chúa Trời nói như cha với con cái, trong khi cụm nguồn chỉ là “con trai/dân Israel”. “Dân Israel” / “Các ngươi” rõ đối tượng mệnh lệnh hơn và không thêm sắc thái này.
