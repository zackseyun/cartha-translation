id: LEV.17.14
reference: Leviticus 17:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: vi
  text: 'Vì sự sống của mọi xác thịt là máu của nó; máu ấy ở trong sự sống của nó.[a] Vì thế, Ta đã phán với dân Israel[b]: “Các ngươi không được ăn máu của bất cứ xác thịt nào, vì sự sống của mọi xác thịt là máu của nó.” Bất cứ ai ăn máu ấy sẽ bị loại trừ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm tiếng Hê-bơ-rơ rất cô đọng; cũng có thể hiểu là “máu của nó ở trong sự sống của nó”, hoặc diễn ý hơn: “máu của nó chính là sự sống của nó”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “các con trai của Israel”, một cách gọi dân Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: sự sống
  rationale: Trong ngữ cảnh luật về máu và tế lễ, từ này chỉ sự sống làm cho sinh vật sống, không nhất thiết nói đến một “linh hồn” phi vật chất. “Sự sống” giữ đúng lập luận nối kết sự sống với máu.
- source_word: בָּשָׂר
  choice: loài xác thịt
  rationale: Cách dịch này giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ và cụm từ được lặp lại, đồng thời thêm “loài” để câu tiếng Việt tự nhiên hơn khi nói đến các sinh vật có thân xác.
- source_word: דָּם / דָּמוֹ
  choice: máu / máu của nó
  rationale: Dịch trực tiếp vì máu là thuật ngữ trung tâm của lý do và lệnh cấm trong câu.
- source_word: בְנַפְשׁוֹ הוּא
  choice: máu ấy ở trong sự sống của nó
  rationale: Giữ cấu trúc cô đọng và sự lặp lại của nguyên văn, không thu hẹp mối liên hệ giữa máu và sự sống thành một cách giải thích duy nhất; các cách hiểu khác được nêu trong chú thích.
- source_word: וָאֹמַר
  choice: Vì thế, Ta đã phán
  rationale: “Vì thế” thể hiện quan hệ suy luận từ nguyên tắc về sự sống và máu đến lệnh cấm; “Ta đã phán” phù hợp với lời Đức Chúa Trời trong văn phong luật giao ước.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: với con dân Israel
  rationale: “Con dân Israel” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại và chỉ toàn thể người Israel; nghĩa sát chữ được ghi ở chú thích.
- source_word: לֹא תֹאכֵלוּ
  choice: Các con không được ăn
  rationale: Diễn đạt rõ một lệnh cấm trực tiếp trong tiếng Việt hiện đại mà vẫn giữ giọng của lời phán.
- source_word: אֹכְלָיו
  choice: bất cứ ai ăn máu ấy
  rationale: Thể phân từ cùng hậu tố chỉ từng người ăn thứ máu đang được nói đến. Cách diễn đạt này tự nhiên và giữ sắc thái áp dụng cho mọi cá nhân.
- source_word: יִכָּרֵת
  choice: sẽ bị loại trừ
  rationale: Giữ tính khái quát của công thức chế tài giao ước, không tự ý xác định đó là hành quyết, khai trừ khỏi cộng đồng hay sự phán xét trực tiếp của Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của נֶפֶשׁ trong mối liên hệ với máu
  choice: Dịch là “sự sống”, trình bày máu như gắn liền với sự sống của sinh vật.
  alternative: “linh hồn” theo nghĩa siêu hình; hoặc diễn giải dứt khoát rằng máu hoàn toàn đồng nhất với sự sống.
  rationale: Lập luận của câu tập trung vào mối liên hệ giữa máu và sự sống trong luật tế lễ, chứ không trình bày một học thuyết chi tiết về cấu tạo con người. Bản dịch và chú thích giữ độ cô đọng của nguyên văn.
- issue: Ý nghĩa của hình phạt יִכָּרֵת
  choice: Dịch là “sẽ bị loại trừ” mà không nói rõ cơ chế thi hành.
  alternative: “sẽ bị xử tử”, “sẽ bị khai trừ khỏi cộng đồng”, hoặc “sẽ bị Đức Chúa Trời tiêu diệt”.
  rationale: Công thức Hê-bơ-rơ có thể được hiểu theo nhiều cách trong các ngữ cảnh luật giao ước. Câu này không tự xác định cụ thể hình thức chế tài, nên bản dịch không giải quyết thay cho nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Bản dịch duy trì sự lặp lại của “sự sống”, “mọi loài xác thịt” và “máu” để bảo toàn lập luận của nguyên văn. Đại từ “Ta/các con” thể hiện lời phán trực tiếp trong bối cảnh giao ước mà không dùng lối nói quá cổ; “bị loại trừ” cố ý không xác định cụ thể hình thức hình phạt.
