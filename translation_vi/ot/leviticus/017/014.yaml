revisions:
- from: 'Vì sự sống của mọi loài xác thịt là máu của nó; máu ấy ở trong sự sống của nó.[a] Vì thế, Ta đã phán với con dân Israel[b]: “Các con không được ăn máu của bất cứ loài xác thịt nào, vì sự sống của mọi loài xác thịt là máu của nó.” Bất cứ ai ăn máu ấy sẽ bị loại trừ.'
  to: 'Vì sự sống của mọi xác thịt là máu của nó; máu ấy ở trong sự sống của nó.[a] Vì thế, Ta đã phán với dân Israel[b]: “Các ngươi không được ăn máu của bất cứ xác thịt nào, vì sự sống của mọi xác thịt là máu của nó.” Bất cứ ai ăn máu ấy sẽ bị loại trừ.'
  rationale: 'Sửa hai điểm về cách diễn đạt: thay “mọi loài xác thịt” bằng “mọi xác thịt” để sát cụm Hê-bơ-rơ lặp lại và tự nhiên hơn trong văn phong Kinh Thánh Việt ngữ; thay cặp “con dân Israel/Các con” bằng “dân Israel/Các ngươi” để giữ nhất quán xưng hô và không thêm sắc thái quan hệ. Giữ nguyên cấu trúc cô đọng, có phần tối nghĩa chủ ý, của “máu ấy ở trong sự sống của nó” và giữ chế tài không được diễn giải cụ thể.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:21Z'
