base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH.” Theo truyền thống thường dịch là “ĐỨC GIÊ-HÔ-VA” hoặc “CHÚA”; cũng có thể chuyển tự là “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức mở đầu lời phán của Đức Chúa Trời, “phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và thể hiện rõ hành động nói.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt để biểu đạt trực tiếp Danh Thánh YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu tiếng Việt “phán với”, từ này diễn đạt tự nhiên người tiếp nhận lời phán.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tiếng Việt thông dụng của tên riêng Hê-bơ-rơ מֹשֶׁה.
- source_word: לֵאמֹר
  choice: rằng
  rationale: “Rằng” tự nhiên dẫn vào nội dung lời phán trong tiếng Việt; tránh lối dịch cứng “nói rằng” ngay sau động từ “phán”.
theological_decisions:
- issue: Cách dịch Danh Thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê) hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh Thánh; vì vậy bản dịch giữ một dạng tên riêng thay vì âm thầm thay bằng tước hiệu. “Đức Giê-hô-va” là dạng đã quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt, đồng thời tiền tố “Đức” phù hợp với cách xưng danh trang trọng trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng công thức tiếng Việt tự nhiên “phán với ... rằng” thay cho việc mô phỏng máy móc hai động từ của tiếng Hê-bơ-rơ.
