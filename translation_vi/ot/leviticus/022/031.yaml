id: LEV.22.31
reference: Leviticus 22:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: vi
  text: Vậy, các ngươi phải tuân giữ các điều răn của Ta và thi hành chúng. Ta là Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH (theo truyền thống thường được dịch là “ĐỨC CHÚA”; cũng được phiên âm là “Yahweh”).'
    reason: Ghi nhận danh thần linh trong nguyên văn và lối dịch truyền thống.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vậy, các ngươi phải tuân giữ
  rationale: Động từ שׁמר trong ngữ cảnh luật giao ước mang nghĩa gìn giữ, tuân giữ. “Tuân giữ” tự nhiên trong tiếng Việt và giữ được sắc thái pháp lý–giao ước; “Vậy” thể hiện quan hệ tiếp nối với lời dạy trước đó.
- source_word: מִצְוֺתַי
  choice: các điều răn của Ta
  rationale: מִצְוָה là điều răn hoặc mệnh lệnh. “Các điều răn” giữ sắc thái trang trọng quen thuộc của luật Torah; “Ta” phù hợp với lời Đức Chúa Trời tự phán.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: và thi hành chúng
  rationale: עשה ở đây theo nghĩa làm, thực hiện các điều răn. “Thi hành chúng” là tiếng Việt tự nhiên, đồng thời bảo tồn sự phân biệt giữa việc tuân giữ và việc thực sự làm theo.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Giữ nguyên công thức tự xưng nhấn mạnh trong tiếng Hê-bơ-rơ và phiên âm danh giao ước יְהוָה là “Yahweh” thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ trực tiếp dùng Tetragrammaton. “Yahweh” bảo tồn danh giao ước dưới dạng phiên âm được giới nghiên cứu chấp nhận rộng rãi; chú thích ghi nhận lối dịch truyền thống để người đọc nhận biết.
- issue: Quan hệ giữa “tuân giữ” và “thi hành”
  choice: Giữ hai hành động riêng biệt
  alternative: Gộp thành “vâng theo”
  rationale: Nguyên văn cố ý đặt שׁמר và עשה song song. Không gộp hai động từ, nhằm bảo tồn sức nhấn mạnh rằng các điều răn vừa phải được gìn giữ vừa phải được thực hiện.
translation_notes:
  register: Văn phong luật giao ước, trang trọng nhưng rõ ràng. “Các ngươi” biểu đạt đúng ngôi thứ hai số nhiều của nguyên văn; “Ta” duy trì giọng tự xưng uy nghiêm. Dấu chú thích được đặt ngay sau “Yahweh”, là từ mà chú thích giải thích.
