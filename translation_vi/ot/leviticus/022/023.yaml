  to: Nhưng bò hoặc chiên có một chi quá dài hay quá ngắn thì các ngươi có thể dâng làm lễ vật tự nguyện[a]; còn làm lễ vật khấn nguyện thì nó sẽ không được chấp nhận.
  rationale: Thay “để hoàn nguyện” bằng “làm lễ vật khấn nguyện” để diễn đạt minh bạch hơn chức năng của לְנֵדֶר trong sự đối lập với נְדָבָה. Thêm “một” trước “chi” giúp câu tiếng Việt tự nhiên hơn, đồng thời không làm tăng mức độ chắc chắn về chi tiết giải phẫu vốn đã được chú thích.
