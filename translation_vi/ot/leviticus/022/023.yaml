  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc đối lập của tiếng Hê-bơ-rơ: con vật có một chi mất cân đối có thể dùng làm lễ vật tự nguyện, nhưng không được chấp nhận trong trường hợp lễ vật khấn nguyện. Cách dịch cụ thể của cặp שָׂרוּעַ / קָלוּט là hợp lý khi kèm chú thích nêu bất định từ vựng.'
  naturalness: Văn phong nhìn chung tự nhiên và phù hợp văn cảnh luật tế lễ. Tuy nhiên, “để hoàn nguyện” dễ được hiểu như một mục đích chung của việc dâng, trong khi לְנֵדֶר đối lập loại lễ vật khấn nguyện với lễ vật tự nguyện. “Làm lễ vật khấn nguyện” rõ và trực tiếp hơn.
