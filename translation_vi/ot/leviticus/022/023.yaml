id: LEV.22.23
reference: Leviticus 22:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: vi
  text: Nhưng bò hoặc chiên có một chi quá dài hay quá ngắn thì các ngươi có thể dâng làm lễ vật tự nguyện[a]; còn làm lễ vật khấn nguyện thì nó sẽ không được chấp nhận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch khái quát hơn: “bị dị dạng hoặc còi cọc.” Hai từ Hê-bơ-rơ có lẽ mô tả hai dạng mất cân đối cơ thể trái ngược nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: bò
  rationale: Danh từ שׁוֹר chỉ gia súc thuộc loài bò; “bò” là cách gọi tự nhiên, bao quát và phù hợp với luật tế lễ.
- source_word: וָשֶׂה
  choice: hoặc chiên
  rationale: שֶׂה chỉ một con vật nhỏ trong bầy, có thể là chiên hoặc dê. Trong cặp đối chiếu với bò, “chiên” là cách dịch truyền thống và dễ hiểu, nhưng không hàm ý một độ tuổi cụ thể.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: có chi quá dài hay quá ngắn
  rationale: 'Hai từ hiếm này dường như mô tả hai dạng mất cân đối trái ngược: một chi bị kéo dài và một chi co ngắn. Cách dịch cụ thể giữ hình ảnh khả dĩ nhất của tiếng Hê-bơ-rơ, còn độ bất định được nêu trong chú thích.'
- source_word: נְדָבָה
  choice: lễ vật tự nguyện
  rationale: נְדָבָה là lễ vật được tự nguyện dâng, không phát sinh từ một lời khấn nguyện có tính ràng buộc.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: có thể dâng làm
  rationale: Nghĩa đen là “làm nó”, nhưng trong ngữ cảnh tế lễ, “dâng làm” truyền đạt tự nhiên việc dùng con vật ấy làm lễ vật.
- source_word: וּלְנֵדֶר
  choice: còn để hoàn nguyện
  rationale: נֵדֶר là lời khấn nguyện mang nghĩa vụ phải thực hiện; “để hoàn nguyện” diễn đạt mục đích dâng lễ vật nhằm thực hiện lời nguyện.
- source_word: לֹא יֵרָצֶה
  choice: nó sẽ không được chấp nhận
  rationale: Thể Niphal của רצה trong ngữ cảnh tế lễ nói đến việc lễ vật được chấp nhận hoặc đoái nhận; câu dịch giữ lối nói bị động và không chỉ rõ tác nhân ngoài điều văn bản nói.
theological_decisions:
- issue: Bản chất của các khuyết tật שָׂרוּעַ và קָלוּט
  choice: Dịch cụ thể là “có chi quá dài hay quá ngắn”.
  alternative: “dị dạng hoặc còi cọc”; “một bộ phận quá lớn hoặc quá nhỏ”
  rationale: Cặp từ có vẻ chỉ hai dạng mất cân đối cơ thể trái ngược nhau trong danh sách khuyết tật của sinh tế. Vì ý nghĩa giải phẫu chính xác không hoàn toàn chắc chắn, phương án rộng hơn được bảo lưu trong chú thích.
- issue: Ý nghĩa của נֵדֶר trong sự đối lập với נְדָבָה
  choice: “để hoàn nguyện”, tức lễ vật thực hiện một lời khấn nguyện ràng buộc
  alternative: “làm lễ vật khấn nguyện”; “cho một lời nguyện”
  rationale: Cách dịch làm rõ sự đối lập pháp lý giữa lễ vật tự nguyện và lễ vật phải dâng để thực hiện lời đã nguyện, nhưng không thêm một hệ thống thần học ngoài ngữ cảnh.
translation_notes:
  register: Văn phong luật tế lễ trang trọng nhưng hiện đại. Dùng “các ngươi” để thể hiện số nhiều trong lời quy định dành cho cộng đồng; dùng dấu chấm phẩy để làm rõ sự tương phản giữa lễ vật tự nguyện và lễ vật hoàn nguyện.
