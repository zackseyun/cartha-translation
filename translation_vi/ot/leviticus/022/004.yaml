base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: vi
  text: Bất cứ người nam nào thuộc dòng dõi A-rôn mà mắc bệnh ngoài da gây ô uế[a] hoặc có dịch tiết thì không được ăn các vật thánh cho đến khi người ấy được thanh sạch. Người nào chạm vào bất cứ ai mang sự ô uế do xác chết[b], hoặc chạm vào một người nam có tinh dịch xuất ra từ người ấy,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo truyền thống: “mắc bệnh phong.” Từ Hê-bơ-rơ chỉ chung một tình trạng ngoài da gây ô uế về nghi lễ, không nhất thiết là bệnh phong Hansen theo y học hiện đại.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bất cứ vật gì bị ô uế do xác chết.” Cụm Hê-bơ-rơ cô đọng, chỉ sự ô uế có liên quan đến xác chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Bất cứ người nam nào
  rationale: Lối lặp mang nghĩa phân phối, chỉ bất cứ người nam nào; ngữ cảnh nói về nam giới thuộc dòng tư tế A-rôn.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: thuộc dòng dõi A-rôn
  rationale: זֶרַע ở đây chỉ huyết thống và hậu duệ, không phải hạt giống theo nghĩa đen.
- source_word: צָרוּעַ
  choice: mắc bệnh ngoài da gây ô uế
  rationale: Từ này chỉ một tình trạng ngoài da gây ô uế nghi lễ, không nhất thiết là bệnh phong Hansen theo y học hiện đại.
- source_word: זָב
  choice: bị tiết dịch
  rationale: Diễn đạt ngắn gọn tình trạng tiết dịch cơ thể gây ô uế nghi lễ.
- source_word: בַּקֳּדָשִׁים
  choice: các vật thánh
  rationale: Chỉ những phần lễ vật đã được biệt riêng mà các tư tế có thể ăn.
- source_word: לֹא יֹאכַל
  choice: không được ăn
  rationale: Thể hiện rõ lệnh cấm pháp lý bằng tiếng Việt tự nhiên.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: cho đến khi người ấy được thanh sạch
  rationale: Giữ ý chuyển sang tình trạng thanh sạch về nghi lễ mà không đồng nhất với chữa lành y khoa.
- source_word: וְהַנֹּגֵעַ
  choice: Người nào chạm vào
  rationale: Phân từ được dùng như danh từ để mở đầu một trường hợp khác gây mất tư cách tạm thời.
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: bất cứ ai bị ô uế vì người chết
  rationale: Cụm khó này được hiểu là một người mang sự ô uế liên quan đến xác chết; bản dịch giữ yếu tố tiếp xúc với người đó và chú thích khả năng hiểu khác.
- source_word: שִׁכְבַת זָרַע
  choice: tinh dịch
  rationale: Thành ngữ chỉ sự xuất tinh; cách nói trực tiếp, hiện đại và trang trọng.
- source_word: תֵּצֵא מִמֶּנּוּ
  choice: có tinh dịch xuất ra
  rationale: Giữ hình ảnh cụ thể của động từ 'đi ra, xuất ra' trong cách diễn đạt tự nhiên.
theological_decisions:
- issue: Thuật ngữ ô uế nghi lễ và giả định y khoa về צָרוּעַ
  choice: Dịch là “mắc bệnh ngoài da gây ô uế” và “được thanh sạch”
  alternative: “mắc bệnh phong” và “được chữa lành”
  rationale: Câu này quy định tư cách nghi lễ của tư tế, không chẩn đoán bệnh Hansen hay quy ô uế thành tội lỗi đạo đức.
- issue: Chủ thể nam giới trong luật tư tế
  choice: Giữ “người nam”
  alternative: “người” hoặc “bất cứ ai”
  rationale: Ngữ pháp Hê-bơ-rơ và bối cảnh đều chỉ nam giới thuộc dòng dõi A-rôn trong chức vụ tư tế.
- issue: Cách hiểu בְּכָל טְמֵא נֶפֶשׁ
  choice: Một người bị ô uế vì người chết
  alternative: Một vật ô uế do xác chết hoặc chính xác chết
  rationale: Cấu trúc Hê-bơ-rơ cô đọng và có thể được hiểu khác nhau; bản chính chọn cách hiểu về người mang ô uế do xác chết, đồng thời bảo tồn phương án khác trong chú thích.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại; dùng “không được” thay cho lối cổ “chớ.” Câu kết bằng dấu phẩy vì câu Hê-bơ-rơ tiếp tục sang câu sau. Các thuật ngữ về cơ thể được diễn đạt trực tiếp, rõ ràng và có phẩm cách.
