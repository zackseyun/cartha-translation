language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: vi
  text: Các ngươi không được làm ô uế danh thánh của Ta; và Ta sẽ được tôn là thánh[a] giữa con dân Israel.[b] Ta là Yahweh, Đấng thánh hóa các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta sẽ được bày tỏ là thánh” hoặc “Ta sẽ được đối xử là thánh.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ có nghĩa đen là “các con trai của Israel”, một cách nói thông dụng chỉ dân Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: xúc phạm
  rationale: Dạng Piel của חלל ở đây nói đến việc làm ô uế hoặc đối xử như tầm thường với điều thánh. “Xúc phạm” là cách nói tự nhiên, trang trọng trong tiếng Việt và diễn đạt rõ hành vi phạm đến danh thánh.
- source_word: שֵׁם קָדְשִׁי
  choice: danh thánh của Ta
  rationale: Cách diễn đạt này giữ nguyên cả ý “danh” và thuộc tính “thánh”, đồng thời tự nhiên hơn lối dịch sát chữ “danh của sự thánh khiết Ta”.
- source_word: וְנִקְדַּשְׁתִּי
  choice: và Ta sẽ được tôn là thánh
  rationale: 'Niphal của קדשׁ mang sắc thái bị động: Yahweh được nhìn nhận, bày tỏ hoặc đối xử là thánh. Cách dịch này tự nhiên hơn “được thánh hóa” khi chủ thể là Đức Chúa Trời, nhưng vẫn giữ tính bị động và trường nghĩa về sự thánh khiết.'
- source_word: בְּתוֹךְ
  choice: giữa
  rationale: “Giữa” diễn đạt gọn và tự nhiên vị trí hay phạm vi trong cộng đồng giao ước.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Israel” nhưng thường chỉ toàn thể dân Israel. “Con dân Israel” vừa giữ dấu vết của hình ảnh gia tộc vừa bao quát cộng đồng trong tiếng Việt tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp trực tiếp với יהוה trong bản nguồn.
- source_word: מְקַדִּשְׁכֶם
  choice: Đấng thánh hóa các ngươi
  rationale: Phân từ Piel diễn tả hành động của Yahweh làm cho dân thuộc về sự thánh khiết. “Thánh hóa” giữ mối liên hệ từ vựng với קדשׁ ở mệnh đề trước và phù hợp văn phong Kinh Thánh trang trọng.
theological_decisions:
- issue: Sắc thái của וְנִקְדַּשְׁתִּי
  choice: Ta sẽ được tôn là thánh
  alternative: Ta sẽ được bày tỏ là thánh; Ta sẽ được đối xử là thánh
  rationale: Bản dịch giữ thể bị động và không quyết định dứt khoát liệu trọng tâm là sự nhìn nhận, cách đối xử hay việc bày tỏ sự thánh khiết của Yahweh.
- issue: Cách thể hiện בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai Israel; dân Israel; người Israel
  rationale: Trong ngữ cảnh, cụm từ quy chiếu đến cộng đồng giao ước nói chung. “Con dân Israel” tránh thu hẹp đối tượng chỉ còn nam giới nhưng vẫn phản ánh sắc thái dòng dõi của thành ngữ Hê-bơ-rơ.
- issue: Danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng danh riêng được ghi trực tiếp trong tiếng Hê-bơ-rơ, không thay bằng tước hiệu và không áp đặt một cách đọc mang tính giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/các ngươi” duy trì sắc thái lời phán trực tiếp và số nhiều của đối tượng. Dấu chấm phẩy giúp giữ quan hệ liên kết của וְ giữa hai mệnh đề mà không tự ý biến nó thành quan hệ tương phản.
