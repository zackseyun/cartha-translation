  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và các thành tố chính của tiếng Hê-bơ-rơ: lệnh cấm, danh thánh của Yahweh, việc Yahweh được nhìn nhận là thánh giữa cộng đồng Israel, và Yahweh là Đấng thánh hóa họ. Tuy nhiên, “xúc phạm” thiên về gây tổn thương hoặc làm phật ý, chưa diễn đạt đủ nét nghĩa nghi lễ của חלל ở đây: làm điều thánh thành phàm tục/ô uế. “Làm ô uế” sát nghĩa hơn trong ngữ cảnh Lê-vi Ký.'
