  text: הַ/מּוֹצִ֤יא אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: vi
  text: Đấng đã đưa các ngươi ra khỏi đất Ai Cập để làm Đức Chúa Trời của các ngươi. Ta là Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH (יהוה), danh riêng được phiên âm là “Yahweh”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Giải thích việc phiên âm danh riêng của Đức Chúa Trời và nêu cách dịch truyền thống.
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: Đấng đã đưa ... ra
  rationale: Phân từ Hiphil của יצא mô tả Yahweh như Đấng thực hiện cuộc xuất hành; tiếng Việt tự nhiên dùng mệnh đề với “đã đưa ... ra” để diễn tả hành động quá khứ trong công thức giao ước.
- source_word: אֶתְכֶם
  choice: các ngươi
  rationale: Hậu tố ngôi thứ hai số nhiều được thể hiện rõ bằng “các ngươi”, phù hợp với lời phán trực tiếp cho cộng đồng Israel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ra khỏi đất Ai Cập
  rationale: Giữ đầy đủ công thức xuất hành “đất Ai Cập”; “ra khỏi” diễn đạt rõ hướng chuyển động của giới từ מִן sau động từ Hiphil.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: để làm Đức Chúa Trời của các ngươi
  rationale: 'Diễn đạt tự nhiên công thức giao ước היה + ל, đồng thời giữ ý nghĩa quan hệ: Ngài là Đức Chúa Trời thuộc về và cai trị dân Ngài.'
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Câu định danh không có động từ trong tiếng Hê-bơ-rơ được chuyển tự nhiên thành “Ta là”; danh giao ước יהוה được phiên âm là “Yahweh” thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn nêu trực tiếp Tứ Tự Danh. Phiên âm “Yahweh” phân biệt danh riêng giao ước với tước hiệu אֱלֹהִים trong cùng câu và không áp đặt cách thay thế theo truyền thống đọc.
- issue: Ý nghĩa của לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: để làm Đức Chúa Trời của các ngươi
  alternative: để trở thành Đức Chúa Trời của các ngươi
  rationale: Động từ היה có thể mang nghĩa “là” hoặc “trở thành”, nhưng đây là công thức quan hệ giao ước; “để làm” giữ mục đích của cuộc xuất hành mà không hàm ý rằng trước đó Yahweh chưa phải là Đức Chúa Trời.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và trực tiếp. “Các ngươi” giữ số nhiều của nguyên văn và sắc thái lời phán giao ước; “Đấng” nối câu này với mệnh đề trước trong ngữ cảnh. Dấu chú thích [a] được đặt ngay sau “Yahweh”, là từ mà chú thích giải thích.
