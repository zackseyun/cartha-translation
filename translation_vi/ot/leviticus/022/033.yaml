  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính của tiếng Hê-bơ-rơ: phân từ Hiphil mang chức năng mệnh đề quan hệ («Đấng đã đưa»), đối tượng số nhiều («các ngươi»), công thức «ra khỏi đất Ai Cập», mục đích giao ước «để làm Đức Chúa Trời của các ngươi», và lời tự-xưng «Ta là Yahweh».'
  naturalness: Văn phong trang trọng và tự nhiên trong ngữ cảnh lời phán giao ước. «Đất Ai Cập» giữ sát אֶרֶץ và vẫn rõ nghĩa trong tiếng Việt hiện đại.
  terminology: «Yahweh» nhất quán với quyết định phiên âm danh riêng יהוה; «Đức Chúa Trời» phân biệt hợp lý với danh riêng này và diễn đạt אֱלֹהִים. Tuy nhiên, chú thích hiện tại nói Yahweh chỉ là một khả năng phiên âm, trong khi bản dịch thực tế đã chọn chính cách phiên âm đó; cần chỉnh để chú thích mô tả đúng cách xử lý trong bản dịch.
  issues:
