revisions:
- from: Họ không được xúc phạm những vật thánh của con cái Y-sơ-ra-ên, tức là những gì họ dâng lên cho Đức Giê-hô-va.[a]
  to: Họ không được làm ô uế các vật thánh của con cái Y-sơ-ra-ên mà con cái ấy dâng lên cho Yahweh.[a]
  rationale: Bản sửa làm rõ rằng người dâng các vật thánh là con cái Y-sơ-ra-ên, thay «xúc phạm» bằng cách diễn đạt nghi lễ chính xác hơn cho חלל, và dùng «Yahweh» theo quyết định hiện hành. «Các vật thánh» được giữ để không áp đặt rằng mọi đối tượng chỉ là lễ vật.
  reviewer_model: gpt-5.6-terra
