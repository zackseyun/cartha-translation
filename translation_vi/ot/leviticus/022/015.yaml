source:
  edition: WLC
  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: vi
  text: Họ không được làm ô uế các vật thánh của con cái Y-sơ-ra-ên mà con cái ấy dâng lên cho Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Dâng lên» cũng có thể dịch là «trình dâng» hoặc «dâng làm lễ vật».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: xúc phạm
  rationale: Trong văn cảnh nghi lễ, dạng Piel của חלל chỉ việc làm mất tính thánh hoặc đối xử bất kính với điều thánh. “Xúc phạm” tự nhiên và trang trọng trong tiếng Việt, đồng thời giữ được sự đối lập giữa thánh và phàm.
- source_word: קָדְשֵׁי
  choice: những vật thánh
  rationale: Danh từ dạng cấu trúc có nghĩa rộng là những thứ đã được biệt riêng làm thánh. Cách dịch này tránh thu hẹp nghĩa thành riêng các lễ vật, dù văn cảnh cho thấy đó là những thứ được dân dâng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ thành ngữ giao ước quen thuộc và sát với nghĩa đen của tiếng Hê-bơ-rơ, chỉ cộng đồng Y-sơ-ra-ên.
- source_word: אֲשֶׁר יָרִימוּ
  choice: tức là những gì họ dâng lên
  rationale: Hiphil của רום có nghĩa đen là nâng lên và trong văn cảnh tế lễ mang nghĩa trình dâng hoặc dâng làm lễ vật. “Dâng lên” vừa giữ hình ảnh hướng lên vừa tự nhiên trong tiếng Việt.
- source_word: לַיהוָה
  choice: cho Đức Giê-hô-va
  rationale: Dịch danh riêng giao ước יהוה bằng dạng tiếng Việt quen thuộc “Đức Giê-hô-va”, thay vì thay thế bằng tước hiệu “CHÚA”.
- source_word: וְלֹא
  choice: không được
  rationale: Động từ chưa hoàn thành có phủ định trong luật pháp diễn đạt điều cấm; “không được” là cách nói pháp quy tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh giao ước. Bản dịch giữ đây là danh riêng; “Đức Giê-hô-va” là dạng trang trọng, quen thuộc trong truyền thống Kinh Thánh tiếng Việt, dù “Yahweh” phản ánh cách phục nguyên phát âm thường được giới học thuật ưu tiên.
- issue: Chủ thể của động từ “không được xúc phạm”
  choice: Giữ đại từ “họ” theo mạch văn
  alternative: Nêu rõ “các thầy tế lễ”
  rationale: Câu Hê-bơ-rơ chỉ có chủ ngữ ngầm số nhiều. Mạch văn hướng đến các thầy tế lễ, nhưng không nên đưa danh từ ấy vào chính câu khi nguyên văn không lặp lại.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Những vật thánh” giữ phạm vi nghĩa rộng của קָדְשֵׁי; “tức là” làm rõ mệnh đề quan hệ có phần gãy trong tiếng Việt mà không xác định cụ thể loại lễ vật.
