  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: vi
  text: '“Hãy nói với A-rôn, các con trai ông và toàn thể người Israel; hãy nói với họ rằng: Bất cứ ai thuộc nhà Israel hoặc là người ngoại kiều cư ngụ tại Israel, khi dâng lễ vật của mình lên Yahweh làm của lễ thiêu, dù để thực hiện bất cứ lời khấn nào hay làm lễ vật tự nguyện nào—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Mệnh lệnh Piel mở đầu lời chỉ thị trực tiếp; “Hãy nói” giữ sắc thái trang trọng, rõ ràng của văn bản luật tế lễ.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Danh từ số nhiều giống đực chỉ các con trai của A-rôn trong bối cảnh chức tế lễ, nên không chuyển thành từ trung tính.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: toàn thể con cái Israel
  rationale: Giữ hình ảnh thân tộc của thành ngữ Hê-bơ-rơ nhưng dùng cách diễn đạt quen thuộc, trang trọng trong tiếng Việt.
- source_word: אִישׁ אִישׁ
  choice: Bất cứ người nào
  rationale: Lối lặp phân phối có nghĩa là từng người hay bất cứ ai; cách dịch này tự nhiên trong luật pháp tiếng Việt mà không giới hạn phạm vi quá mức.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: thuộc nhà Israel
  rationale: Giữ thành ngữ giao ước “nhà Israel” thay vì giản lược thành một nhãn dân tộc.
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: ngoại kiều cư ngụ tại Israel
  rationale: גֵּר là người không thuộc dân bản địa nhưng sống lâu dài giữa cộng đồng Israel và ở dưới trật tự cộng đồng ấy; “ngoại kiều cư ngụ” rõ hơn “khách lạ” trong tiếng Việt hiện đại.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: dâng lễ vật của mình
  rationale: Trong ngữ cảnh tế lễ, Hiphil của קרב nói đến việc đem đến hoặc trình dâng, còn קָרְבָּן là thuật ngữ rộng chỉ lễ vật.
- source_word: לְכָל נִדְרֵיהֶם
  choice: theo bất kỳ lời khấn nguyện nào
  rationale: Giữ khả năng câu nói đến lễ vật được dâng liên quan đến lời khấn nguyện mà không tự ý thêm danh từ “lễ vật” vào chính cụm này.
- source_word: נִדְבוֹתָם
  choice: bất kỳ lễ vật tự nguyện nào
  rationale: Diễn đạt loại lễ vật được tự nguyện dâng, là một phạm trù tế lễ trong Lê-vi Ký.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Phiên âm danh riêng giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: עֹלָה là thuật ngữ kỹ thuật chỉ lễ vật được thiêu trọn; “lễ thiêu” ngắn gọn và quen thuộc.
theological_decisions:
- issue: Ngôn ngữ giống đực mang tính đại diện trong אִישׁ אִישׁ
  choice: Bất cứ người nào
  alternative: Bất cứ người nam nào
  rationale: Danh từ Hê-bơ-rơ ở giống đực nhưng cấu trúc lặp có chức năng phân phối trong văn luật. “Bất cứ người nào” truyền đạt chức năng ấy tự nhiên hơn và không quyết định thêm rằng điều luật chỉ áp dụng cho nam giới.
- issue: Cách thể hiện Danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Văn bản dùng trực tiếp Danh giao ước; giữ “Yahweh” phân biệt danh riêng này với các tước hiệu.
- issue: Sự chuyển đổi từ chủ thể số ít sang đại từ số nhiều
  choice: Giữ “lễ vật của mình” rồi chuyển sang “họ dâng”
  alternative: Đồng nhất toàn câu ở số ít
  rationale: Bản Hê-bơ-rơ bắt đầu bằng chủ thể phân phối số ít nhưng sau đó dùng hình thái số nhiều. Bản dịch giữ phần nào sự chuyển đổi này thay vì âm thầm san bằng hoàn toàn.
translation_notes:
  register: Văn phong luật tế lễ trang trọng nhưng hiện đại; giữ các thuật ngữ “nhà Israel”, “lễ vật”, “lời khấn nguyện”, “lễ vật tự nguyện” và “lễ thiêu”. Dấu gạch ngang cuối câu được giữ vì mệnh đề tiếp tục sang câu kế tiếp.
