revisions:
- from: '“Hãy nói với A-rôn, các con trai ông và toàn thể con cái Israel[a] rằng: Bất cứ người nào thuộc nhà Israel hay là ngoại kiều cư ngụ tại Israel[b], khi dâng lễ vật của mình theo bất kỳ lời khấn nguyện nào hoặc bất kỳ lễ vật tự nguyện nào[c] mà họ dâng lên Yahweh làm lễ thiêu—”'
  to: '“Hãy nói với A-rôn, các con trai ông và toàn thể người Israel; hãy nói với họ rằng: Bất cứ ai thuộc nhà Israel hoặc là người ngoại kiều cư ngụ tại Israel, khi dâng lễ vật của mình lên Yahweh làm của lễ thiêu, dù để thực hiện bất cứ lời khấn nào hay làm lễ vật tự nguyện nào—”'
  rationale: Đổi thành ngữ “con cái Israel” trong thân câu thành “người Israel” để câu hiện đại tự nhiên, đồng thời chuyển sắc thái thân tộc sang chú thích với cách mô tả chính xác hơn. Sắp xếp lại phần về lời khấn và lễ vật tự nguyện để cho thấy đây là các hoàn cảnh hoặc loại lễ vật của hành động dâng, không biến “lời khấn” thành một loại lễ vật. “Của lễ thiêu” diễn đạt rõ hơn chức năng kỹ thuật của עֹלָה so với “làm lễ thiêu”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần làm rõ hai điểm: בְּנֵי יִשְׂרָאֵל nghĩa đen là “các con trai Israel” nhưng là thành ngữ chỉ toàn dân Israel; và hai cụm לְכָל נִדְרֵיהֶם / לְכָל נִדְבוֹתָם chỉ mục đích hoặc loại lễ vật. Bản sửa giữ tính phân phối của אִישׁ אִישׁ, “nhà Israel”, và phạm trù tế lễ עֹלָה.'
  naturalness: Câu dự thảo có cấu trúc “theo ... lời khấn nguyện nào hoặc ... lễ vật tự nguyện nào mà họ dâng” chưa song hành và gây mơ hồ về thành phần được dâng. Bản sửa sắp xếp lại mệnh đề để tiếng Việt hiện đại rõ và tự nhiên hơn, đồng thời vẫn giữ dấu gạch ngang nối sang câu sau.
  terminology: Giữ nhất quán các thuật ngữ “nhà Israel”, “người ngoại kiều cư ngụ”, “lễ vật”, “lời khấn”, “lễ vật tự nguyện”, “của lễ thiêu”, và danh Yahweh. “Toàn thể người Israel” là cách dịch thành ngữ tự nhiên; chú thích bảo lưu dạng chữ của nguyên ngữ.
  issues:
  - severity: medium
    issue: “Toàn thể con cái Israel” và chú thích a không phản ánh chính xác dạng từ của tiếng Hê-bơ-rơ.
    rationale: בְּנֵי có nghĩa đen là “các con trai”, dù toàn cụm là thành ngữ chỉ dân Israel. “Con cái” là cách Việt hóa có thể chấp nhận về nghĩa tập thể, nhưng chú thích hiện gọi đó là nguyên văn, làm mờ chi tiết từ vựng.
  - severity: medium
    issue: Cụm “theo bất kỳ lời khấn nguyện nào hoặc bất kỳ lễ vật tự nguyện nào mà họ dâng” không song hành và mơ hồ cú pháp.
    rationale: Lời khấn và lễ vật tự nguyện không cùng loại ngữ pháp; nguyên ngữ nói đến các lễ vật được dâng trong liên hệ với lời khấn hay như lễ vật tự nguyện. Cần diễn đạt rõ quan hệ này.
  revised_text: '“Hãy nói với A-rôn, các con trai ông và toàn thể người Israel; hãy nói với họ rằng: Bất cứ ai thuộc nhà Israel hoặc là người ngoại kiều cư ngụ tại Israel, khi dâng lễ vật của mình lên Yahweh làm của lễ thiêu, dù để thực hiện bất cứ lời khấn nào hay làm lễ vật tự nguyện nào—”'
  revised_footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn thể con cái Israel”. Nghĩa đen của cụm Hê-bơ-rơ là “toàn thể các con trai Israel”, một thành ngữ chỉ toàn dân Israel.'
    reason: lexical_alternative
  - marker: b
    text: “Người ngoại kiều cư ngụ” chỉ người không phải là người Israel bản địa nhưng sống giữa Israel dưới trật tự cộng đồng của họ.
    reason: lexical_clarification
  - marker: c
    text: 'Cũng có thể hiểu: “vì mọi lễ vật khấn nguyện và mọi lễ vật tự nguyện của họ”. Cụm Hê-bơ-rơ có thể chỉ cụ thể hơn các lễ vật gắn với lời khấn nguyện.'
    reason: alternative_reading
  revision_rationale: Đổi thành ngữ “con cái Israel” trong thân câu thành “người Israel” để câu hiện đại tự nhiên, đồng thời chuyển sắc thái thân tộc sang chú thích với cách mô tả chính xác hơn. Sắp xếp lại phần về lời khấn và lễ vật tự nguyện để cho thấy đây là các hoàn cảnh hoặc loại lễ vật của hành động dâng, không biến “lời khấn” thành một loại lễ vật. “Của lễ thiêu” diễn đạt rõ hơn chức năng kỹ thuật của עֹלָה so với “làm lễ thiêu”.
