base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: vi
  text: Dù là bò hay chiên, các ngươi không được giết thịt nó và con của nó[a] trong cùng một ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ sát chữ: “nó và con trai của nó”; trong ngữ cảnh này, “con” chỉ con non/đời con. Câu không trực tiếp nêu giới tính của con vật cha mẹ, dù thường được hiểu là quy định về con mẹ và con non. Từ được dịch là “chiên” cũng có thể chỉ một con dê thuộc đàn gia súc nhỏ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: bò
  rationale: Từ này chỉ gia súc thuộc loài bò; “bò” tự nhiên trong tiếng Việt và không xác định giới tính quá mức như “bò đực”.
- source_word: שֶׂה
  choice: chiên
  rationale: Từ này có thể chỉ một con thuộc đàn chiên hoặc dê. “Chiên” phù hợp với cách dùng đại diện trong văn cảnh luật tế lễ, nhưng cần ghi nhận phạm vi nghĩa rộng hơn trong chú thích.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: con vật mẹ cùng với con của nó
  rationale: Nguyên văn là “nó và con trai/con của nó”. Trong quy định về việc giết thịt con vật và con non, tiếng Việt cần làm rõ quan hệ sinh sản; “con vật mẹ” diễn đạt tự nhiên, song đây là sự làm rõ theo văn cảnh nên được chú thích.
- source_word: תִשְׁחֲטוּ
  choice: không được giết thịt
  rationale: שׁחט là động từ chuyên dùng cho việc giết súc vật, nhất là trong văn cảnh tế lễ và luật lệ; “giết thịt” chính xác hơn từ rộng nghĩa “giết”.
- source_word: בְּיוֹם אֶחָד
  choice: trong cùng một ngày
  rationale: Nghĩa sát là “trong một ngày”; trong điều luật này, “trong cùng một ngày” truyền đạt rõ và tự nhiên rằng không được giết cả hai vào một ngày duy nhất.
- source_word: וְ... אוֹ
  choice: Dù là... hay...
  rationale: Liên từ mở đầu cùng אוֹ tạo cấu trúc nêu hai trường hợp thay thế; “Dù là... hay...” tự nhiên trong văn phong luật lệ tiếng Việt.
theological_decisions:
- issue: Giới tính của con vật cha mẹ
  choice: con vật mẹ
  alternative: nó
  rationale: Bản Hê-bơ-rơ dùng đại từ giống đực theo ngữ pháp và nói sát là “nó và con của nó”, không trực tiếp ghi “mẹ”. Tuy nhiên, quy định thường được hiểu là nói đến con mẹ và con non; bản dịch làm rõ để câu tiếng Việt tự nhiên nhưng giữ chú thích về nguyên văn nhằm tránh che khuất điểm này.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “các ngươi” để giữ số nhiều của động từ Hê-bơ-rơ và sắc thái lời phán truyền cho cộng đồng; “không được” diễn đạt lệnh cấm tự nhiên trong tiếng Việt hiện đại.
