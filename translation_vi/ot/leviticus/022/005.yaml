revisions:
- from: hoặc người nào chạm vào bất cứ sinh vật nhỏ lúc nhúc nào khiến mình bị ô uế[a], hoặc chạm vào một người khiến mình bị ô uế, bất kể sự ô uế của người ấy là gì[b].
  to: hoặc người nào chạm vào bất cứ sinh vật lúc nhúc nào làm người ấy bị ô uế[a], hoặc chạm vào một người[b] khiến người ấy bị ô uế, dù người đó mắc bất cứ loại ô uế nào.
  rationale: Sửa các đại từ để phân biệt rõ người chạm vào (“người ấy”) với người bị chạm vào, là người đang ở trong tình trạng ô uế (“người đó”). Chuyển dấu chú thích b đến “một người” và điều chỉnh nội dung chú thích để phản ánh tính khái quát của các danh từ giống đực cũng như cách hiểu tự nhiên của cụm cuối. Không thay đổi ý nghĩa hay làm đạo đức hóa thuật ngữ nghi lễ.
