source:
  edition: WLC
  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: vi
  text: hoặc người nào chạm vào bất cứ sinh vật lúc nhúc nào làm người ấy bị ô uế[a], hoặc chạm vào một người[b] khiến người ấy bị ô uế, dù người đó mắc bất cứ loại ô uế nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất cứ loài bò lúc nhúc nào.” Từ Hê-bơ-rơ chỉ các sinh vật nhỏ tụ tập lúc nhúc hoặc di chuyển sát mặt đất.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng các danh từ giống đực số ít theo nghĩa khái quát. Cụm cuối có nghĩa là: “dù người đó mắc bất cứ loại ô uế nào.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ אִישׁ אֲשֶׁר יִגַּע
  choice: hoặc người nào chạm vào
  rationale: Giữ liên từ tiếp nối danh sách và diễn đạt אִישׁ theo chức năng pháp lý khái quát bằng tiếng Việt tự nhiên.
- source_word: בְּכָל שֶׁרֶץ
  choice: bất cứ sinh vật nhỏ lúc nhúc nào
  rationale: שֶׁרֶץ chỉ nhóm sinh vật nhỏ bò sát mặt đất hoặc tụ tập lúc nhúc; cách dịch này tránh xác định quá hẹp về loài.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: khiến mình bị ô uế
  rationale: Diễn đạt kết quả của việc tiếp xúc, đồng thời dùng 'mình' để quy chiếu tự nhiên về chủ thể trong câu luật.
- source_word: בְאָדָם
  choice: chạm vào một người
  rationale: אָדָם ở đây là một con người làm nguồn truyền sự ô uế; động từ 'chạm' được lặp lại để câu tiếng Việt rõ nghĩa.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: bất kể sự ô uế của người ấy là gì
  rationale: Giữ phạm vi bao quát của לְכֹל và làm rõ đại từ hậu tố chỉ người được chạm vào, không quy định cụ thể loại ô uế.
- source_word: טמא / טֻמְאָה
  choice: bị ô uế / sự ô uế
  rationale: Duy trì liên hệ từ vựng giữa động từ và danh từ, phù hợp ngữ cảnh thanh sạch nghi lễ.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật Lê-vi
  choice: Dùng 'ô uế' theo nghĩa tình trạng không thanh sạch về nghi lễ
  alternative: Dùng 'không tinh sạch' hoặc hiểu theo nghĩa tội lỗi đạo đức
  rationale: Ngữ cảnh nói về điều kiện thanh sạch của thầy tế lễ, không nhất thiết quy kết lỗi đạo đức.
- issue: Đối tượng được אָדָם chỉ đến
  choice: Hiểu là một người nói chung, có thể truyền sự ô uế qua tiếp xúc
  alternative: Giới hạn là một người nam
  rationale: אָדָם có nghĩa khái quát là con người; văn cảnh không đòi hỏi giới hạn giới tính.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Cụm 'sinh vật nhỏ lúc nhúc' giữ sắc thái phân loại rộng của שֶׁרֶץ; 'ô uế' được dùng nhất quán cho tình trạng nghi lễ. Các đại từ được xử lý để tránh mơ hồ về việc sự ô uế thuộc về người bị chạm vào.
