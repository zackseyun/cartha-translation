  text: וּ/בָ֥א הַ/שֶּׁ֖מֶשׁ וְ/טָהֵ֑ר וְ/אַחַר֙ יֹאכַ֣ל מִן הַ/קֳּדָשִׁ֔ים כִּ֥י לַחְמ֖/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: vi
  text: Khi mặt trời lặn, người ấy sẽ trở nên thanh sạch; sau đó, người ấy có thể ăn các vật thánh[b], vì đó là thức ăn của người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “vì đó là bánh của người ấy.” Ở đây, “bánh” có nghĩa rộng là thức ăn, tức phần được cấp cho người ấy từ các phần lễ vật thánh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các lễ vật thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: Khi mặt trời lặn
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “mặt trời đi vào/đến”, nhưng trong ngữ cảnh chỉ lúc mặt trời lặn; cách dịch này tự nhiên và giữ rõ mốc thời gian nghi lễ.
- source_word: וְטָהֵר
  choice: người ấy sẽ được tinh sạch
  rationale: Động từ chỉ việc trở lại tình trạng thanh sạch theo nghi lễ sau khi mặt trời lặn. “Được tinh sạch” truyền đạt sự phục hồi tình trạng ấy mà không biến nó thành sự trong sạch đạo đức.
- source_word: וְאַחַר
  choice: sau đó
  rationale: Giữ trình tự của quy định một cách gọn và tự nhiên trong tiếng Việt.
- source_word: יֹאכַל
  choice: có thể ăn
  rationale: Trong văn cảnh luật lệ, dạng động từ diễn tả hành động được phép sau khi tình trạng thanh sạch được phục hồi.
- source_word: מִן הַקֳּדָשִׁים
  choice: ăn các vật thánh
  rationale: קֳדָשִׁים là số nhiều, chỉ những thứ đã được biệt riêng làm thánh, trong ngữ cảnh là các phần lễ vật dành cho tư tế. “Các vật thánh” giữ cách nói rộng của nguyên văn.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do cho phép người ấy ăn.
- source_word: לַחְמוֹ הוּא
  choice: vì đó là thức ăn của người ấy
  rationale: לֶחֶם theo nghĩa đen là “bánh”, nhưng ở đây mang nghĩa rộng là lương thực hay phần ăn. Đại từ số ít הוּא được phản ánh bằng “đó”, quy chiếu tổng thể đến phần đồ thánh làm thức ăn của tư tế.
theological_decisions:
- issue: Bản chất của sự tinh sạch
  choice: Sự tinh sạch theo nghi lễ
  alternative: Sự trong sạch về đạo đức hoặc tâm linh
  rationale: Lê-vi Ký 22 nói về quyền của tư tế được ăn đồ thánh sau một thời kỳ ô uế. Bản dịch giữ ngôn ngữ “tinh sạch” và để ngữ cảnh nghi lễ xác định ý nghĩa, không nhập thêm phạm trù đạo đức.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để nối rõ với đối tượng nam trong ngữ cảnh trước đó; “tinh sạch” giúp gợi đúng phạm vi nghi lễ. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
