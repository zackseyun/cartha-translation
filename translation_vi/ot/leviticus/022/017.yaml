base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; cũng được phiên âm là «Giê-hô-va» hoặc «Jehovah».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר với dạng kể tiếp mở đầu một lời phán mới. “Phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng YHWH theo cách gọi quen thuộc trong tiếng Việt, không thay bằng một tước hiệu chung.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc chỉ hành động nói hướng đến một người, “phán với” là cách kết hợp tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng đã phổ biến trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dạng nguyên mẫu này giới thiệu nội dung lời nói trực tiếp theo sau; “rằng” truyền đạt chức năng ấy tự nhiên và gọn trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. “Đức Giê-hô-va” giữ đây là danh riêng và là cách gọi dễ nhận biết đối với độc giả Kinh Thánh tiếng Việt; không thay bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ công thức dẫn nhập lời phán nhưng diễn đạt tự nhiên bằng tiếng Việt. Không cần chú thích vì bản văn không có dị bản hay nét mơ hồ thiết yếu cần giải thích.
