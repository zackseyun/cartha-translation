source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: vi
  text: Nếu một người[a] vô ý[c] ăn vật thánh[b], người ấy phải bồi thêm một phần năm[d] rồi giao vật thánh ấy cho thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “một người đàn ông”; trong công thức luật pháp, cách nói giống đực số ít này có thể chỉ một người nói chung.
    reason: lexical_alternative
  - marker: b
    text: “Vật thánh” chỉ thức ăn hoặc tài vật đã được biệt riêng cho việc thánh và dành cho các thầy tế lễ sử dụng.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “do nhầm lẫn” hoặc “do sơ suất”.'
    reason: lexical_alternative
  - marker: d
    text: 'Dịch sát: “thêm một phần năm của nó vào nó”; nghĩa là cộng thêm một phần năm vào phần phải hoàn lại.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְאִישׁ
  choice: một người
  rationale: Trong công thức luật pháp này, אִישׁ ở dạng giống đực số ít nhưng có thể chỉ một người nói chung. “Một người” là cách diễn đạt tự nhiên trong tiếng Việt; chú thích vẫn nêu rõ hình thức Hê-bơ-rơ.
- source_word: כִּי
  choice: nếu
  rationale: כִּי mở đầu một trường hợp có điều kiện trong luật lệ; “nếu” diễn đạt rõ quan hệ này.
- source_word: יֹאכַל
  choice: ăn
  rationale: Động từ chỉ việc ăn hoặc dùng thức được biệt riêng; “ăn” phù hợp trực tiếp với ngữ cảnh.
- source_word: קֹדֶשׁ
  choice: vật thánh
  rationale: קֹדֶשׁ ở đây chỉ vật hoặc thức ăn đã được biệt riêng cho mục đích thánh. “Vật thánh” giữ được phạm vi rộng của từ gốc, không thu hẹp thành riêng “thức ăn thánh” hay “phần lễ thánh”.
- source_word: בִּשְׁגָגָה
  choice: vô ý
  rationale: Từ này chỉ hành động do sơ suất hoặc nhầm lẫn, đối lập với hành động cố tình. “Vô ý” ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: וְיָסַף
  choice: phải thêm
  rationale: Trong vế chính của điều luật, động từ mang sức bắt buộc; “phải thêm” truyền đạt rõ tính quy định.
- source_word: חֲמִשִׁיתוֹ עָלָיו
  choice: thêm một phần năm vào đó
  rationale: Cụm Hê-bơ-rơ nói đến việc cộng thêm một phần năm của vật đã ăn vào khoản phải hoàn lại. Cách dịch này tự nhiên hơn việc lặp đại từ nhưng vẫn giữ phép tính một phần năm.
- source_word: וְנָתַן לַכֹּהֵן אֶת־הַקֹּדֶשׁ
  choice: và trao vật thánh ấy cho thầy tế lễ
  rationale: Bám sát động từ “trao/đưa” và giữ sự lặp lại của קֹדֶשׁ, không tự ý đổi thành “trả tiền” dù ngữ cảnh có hàm ý bồi hoàn.
theological_decisions:
- issue: Giống đực trong công thức luật pháp
  choice: Dịch אִישׁ là “một người” trong câu chính và ghi chú dạng nguyên văn
  alternative: “một người nam” hoặc “một người đàn ông”
  rationale: Tiếng Hê-bơ-rơ dùng danh từ giống đực số ít, nhưng trong điều luật từ này có thể mang nghĩa khái quát. “Một người” tránh tạo ấn tượng rằng bản văn nhất thiết loại trừ phụ nữ, đồng thời chú thích bảo tồn dữ kiện ngữ pháp và từ vựng.
- issue: Bản chất của đối tượng phải hoàn lại
  choice: Giữ “vật thánh” ở cả hai lần xuất hiện
  alternative: “thức ăn thánh”, “phần thánh” hoặc “giá trị của vật thánh”
  rationale: Bản văn dùng cùng từ קֹדֶשׁ và không nói rõ đó là chính vật, một phần tương đương hay giá trị của vật. Giữ cách gọi rộng bảo tồn độ mở và sự căng nghĩa của nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng “phải” để thể hiện tính bắt buộc. “Thầy tế lễ” phù hợp với cách gọi Kinh Thánh quen thuộc trong tiếng Việt. Trật tự các dấu chú thích theo vị trí từ ngữ trong câu; mọi dấu [a]–[d] đều xuất hiện trong chính văn.
