revisions:
- from: Khi anh em dâng một sinh tế tạ ơn lên Yahweh, hãy dâng sao cho sinh tế ấy được chấp nhận vì anh em.[a]
  to: Khi anh em dâng một sinh tế tạ ơn cho Yahweh, hãy dâng sinh tế ấy để anh em được chấp nhận.[a]
  rationale: Sửa “vì anh em” thành “để anh em được chấp nhận” nhằm diễn đạt mục đích/sự chấp nhận mà לִרְצֹנְכֶם nêu trong công thức tế lễ. Việc chuyển chủ thể rõ ràng hơn trong tiếng Việt không xác định thêm cơ chế thần học; chú thích cung cấp phương án giữ chủ thể là sinh tế. Cũng đổi “lên Yahweh” thành “cho Yahweh” cho tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
