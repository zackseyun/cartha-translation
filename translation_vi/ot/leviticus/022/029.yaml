    rationale: Giới từ ל với רָצוֹן và hậu tố số nhiều trong công thức tế lễ chỉ sự chấp nhận hướng đến/lợi cho người dâng, không tự nhiên mang nghĩa nguyên nhân “vì anh em” trong tiếng Việt.
  - severity: low
