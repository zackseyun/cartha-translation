  - severity: low
    issue: Chú thích hiện tại gọi một cách diễn đạt chưa thật sáng rõ là “dịch sát hơn.”
    rationale: Nên ghi chú rõ đây là cách bảo lưu cấu trúc cô đọng của nguyên văn, đồng thời tránh để câu chú thích tối nghĩa về chủ thể được chấp nhận.
