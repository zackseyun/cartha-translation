  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: vi
  text: Khi anh em dâng một sinh tế tạ ơn cho Yahweh, hãy dâng sinh tế ấy để anh em được chấp nhận.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy dâng sinh tế ấy để nó được chấp nhận cho anh em.” Cụm Hê-bơ-rơ cô đọng, nói đến sự chấp nhận trong bối cảnh tế lễ.'
    reason: Bảo lưu cách diễn đạt gần cấu trúc לִרְצֹנְכֶם, trong khi bản văn chính dùng cú pháp tiếng Việt tự nhiên hơn.
lexical_decisions:
- source_word: וְ/כִי
  choice: Khi
  rationale: Trong văn luật lệ, cụm này mở đầu một trường hợp mang sắc thái thời gian/điều kiện. “Khi” tự nhiên trong tiếng Việt và không biến hành động thành điều chỉ có tính giả định.
- source_word: תִזְבְּחוּ / תִּזְבָּחוּ
  choice: dâng một sinh tế / hãy dâng
  rationale: Động từ זבח chỉ việc hiến dâng bằng nghi thức sát tế. Cách dịch này tự nhiên trong tiếng Việt; lần thứ hai vẫn giữ ý lặp của nguyên văn mà tránh diễn đạt nặng nề.
- source_word: זֶבַח תּוֹדָה
  choice: một sinh tế tạ ơn
  rationale: Cụm danh từ ghép chỉ một loại sinh tế mang tính tạ ơn. “Sinh tế tạ ơn” vừa gọn vừa bảo toàn phạm trù tế lễ.
- source_word: לַ/יהוָה
  choice: lên Yahweh
  rationale: Giới từ ל biểu thị hướng dâng/đối tượng tiếp nhận trong ngôn ngữ tế lễ; “lên” là cách nói tự nhiên trong tiếng Việt. Danh thánh được phiên âm là “Yahweh”.
- source_word: לִֽ/רְצֹנְ/כֶם
  choice: sao cho sinh tế ấy được chấp nhận vì anh em
  rationale: Trong bối cảnh tế lễ, רָצוֹן nói đến sự được chấp nhận trước mặt Đức Chúa Trời. Cách diễn đạt này nêu rõ kết quả hàm ẩn và giữ כֶם là những người được hưởng sự chấp nhận, thay vì hiểu là ý muốn chủ quan của họ.
theological_decisions:
- issue: Cách dịch danh thánh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh thánh giao ước יהוה; phiên âm “Yahweh” bảo toàn tính chất tên riêng mà không áp đặt một danh xưng thay thế.
- issue: Ý nghĩa của לִרְצֹנְכֶם trong bối cảnh tế lễ
  choice: sao cho sinh tế ấy được chấp nhận vì anh em
  alternative: theo ý muốn của anh em
  rationale: Ngữ cảnh tế lễ ưu tiên nghĩa được Đức Chúa Trời chấp nhận thay vì ý thích hoặc thiện nguyện của người dâng. “Vì anh em” giữ mối liên hệ lợi ích/đại diện của hậu tố ngôi thứ hai số nhiều mà không xác định quá mức cơ chế thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều; “sinh tế” duy trì sắc thái tế lễ. Dấu chú thích [a] được đặt sau toàn mệnh đề mà chú thích giải thích.
