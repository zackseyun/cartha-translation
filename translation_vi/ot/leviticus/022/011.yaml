id: LEV.22.11
reference: Leviticus 22:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: vi
  text: Nhưng nếu một thầy tế lễ dùng tiền mua một người làm tài sản của mình[a], thì người ấy được ăn thức ăn đó[b]; những người sinh ra trong nhà thầy tế lễ cũng được ăn thức ăn của ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một người, vật được mua bằng tiền của ông”, tức là một người được mua bằng tiền và thuộc quyền sở hữu của ông.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng đại từ “nó”, chỉ phần thức ăn thánh đang được nói đến; cuối câu gọi thức ăn ấy theo nghĩa đen là “bánh của ông”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: Nhưng nếu một thầy tế lễ
  rationale: Liên từ tiếp nối và tạo nét tương phản với trường hợp ở câu trước; כִּי trong quy định pháp lý mở đầu một tình huống có điều kiện.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: mua một người
  rationale: קנה ở đây chỉ việc mua, còn נֶפֶשׁ chỉ một con người chứ không phải phần linh hồn.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: dùng tiền mua ... làm tài sản của mình
  rationale: Cách dịch giữ rõ cả phương tiện mua bằng tiền lẫn địa vị tài sản được diễn đạt trong nguyên văn, không làm nhẹ đi quan hệ sở hữu.
- source_word: הוּא יֹאכַל בּוֹ
  choice: thì người ấy được ăn thức ăn đó
  rationale: הוּא quay lại chỉ người vừa được mua; nói rõ 'người ấy' tránh nhầm với thầy tế lễ. Dạng động từ trong luật lệ diễn đạt sự cho phép, còn בּוֹ chỉ thức ăn thánh đang được bàn đến trong ngữ cảnh.
- source_word: וִילִיד בֵּיתוֹ
  choice: những người sinh ra trong nhà thầy tế lễ
  rationale: Cụm từ chỉ người sinh ra trong hộ gia đình; dù hình thức là số ít tập hợp, đại từ và động từ theo sau ở số nhiều. Lặp lại 'thầy tế lễ' giúp đại từ sở hữu trong tiếng Việt không mơ hồ.
- source_word: בְלַחְמוֹ
  choice: thức ăn của ông
  rationale: לֶחֶם theo nghĩa đen là 'bánh', nhưng trong ngữ cảnh tư tế có nghĩa rộng hơn là phần lương thực hay thức ăn được cấp cho thầy tế lễ.
theological_decisions:
- issue: Cách diễn đạt thuật ngữ pháp lý liên quan đến thân phận tài sản và chế độ nô lệ
  choice: dùng tiền mua một người làm tài sản của mình
  alternative: mua một người bằng tiền của mình
  rationale: Bản dịch minh bạch giữ lại chiều kích sở hữu của קִנְיַן כַּסְפּוֹ thay vì làm dịu thành quan hệ phục vụ nói chung; đây là sự phản ánh văn bản, không phải lời tán thành thể chế được nhắc đến.
- issue: Đối tượng được phép ăn
  choice: người ấy được ăn
  alternative: ông được ăn
  rationale: Đại từ הוּא gần nhất và hợp cú pháp nhất với người được mua. Cách dịch này tránh hiểu nhầm rằng câu chỉ nói thầy tế lễ được ăn.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng tự nhiên trong tiếng Việt hiện đại. Dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh quen thuộc; lặp danh từ để tránh sự mơ hồ của đại từ. Cụm “làm tài sản của mình” cố ý giữ sắc thái pháp lý khắc nghiệt của nguyên văn.
