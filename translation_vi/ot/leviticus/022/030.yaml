id: LEV.22.30
reference: Leviticus 22:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: vi
  text: Lễ vật ấy phải được ăn trong chính ngày đó[a]; các ngươi không được để lại phần nào cho đến sáng. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong ngày đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: chính trong ngày ấy
  rationale: Cụm từ có nghĩa đen là “trong ngày ấy”; thêm “chính” diễn đạt tự nhiên sắc thái giới hạn vào đúng ngày dâng lễ mà không mở rộng ý nghĩa.
- source_word: יֵאָכֵל
  choice: lễ vật phải được ăn hết
  rationale: Dạng Niphal diễn tả quy định ở thể bị động/vô nhân xưng. “Phải được ăn hết” giữ sức bắt buộc và làm rõ đối tượng ngầm theo văn cảnh tế lễ.
- source_word: לֹא תוֹתִירוּ מִמֶּנּוּ
  choice: các ngươi không được để lại chút nào
  rationale: Hiphil của יתר nghĩa là để lại phần dư. Cách dịch này giữ nguyên lời cấm ở ngôi thứ hai số nhiều và diễn đạt tự nhiên đại từ chỉ phần lễ vật.
- source_word: עַד בֹּקֶר
  choice: đến sáng
  rationale: Thành ngữ thời gian cấm giữ phần còn lại qua đêm; “đến sáng” là cách nói gọn và tự nhiên trong tiếng Việt.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Giữ công thức tự xưng giao ước và phiên âm trực tiếp danh riêng יהוה là “Yahweh”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ tự thánh; phiên âm “Yahweh” bảo tồn tính chất danh riêng và phù hợp lớp tham khảo POB được cung cấp.
- issue: Đối tượng phải được ăn
  choice: lễ vật
  alternative: nó
  rationale: Động từ Hê-bơ-rơ không nêu danh từ trong câu này, nhưng đối tượng được hiểu từ văn cảnh là lễ vật. Nêu “lễ vật” giúp tiếng Việt rõ nghĩa mà không áp đặt một loại tế lễ cụ thể.
translation_notes:
  register: 'Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “các ngươi” để giữ ngôi thứ hai số nhiều và sắc thái giao ước; dùng “Ta” trong lời tự xưng của Đức Chúa Trời. Không giữ chú thích b của lớp tiếng Anh vì nội dung ghi “Hebrew: ‘I am Yahweh’” không phải một cách đọc khác và bản dịch chính đã dịch đầy đủ công thức ấy.'
