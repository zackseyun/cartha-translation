base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: vi
  text: Các ngươi không được dâng bất cứ con vật nào có tì vết[a], vì nó sẽ không đem lại sự chấp nhận cho các ngươi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “có khuyết tật”. Từ Hê-bơ-rơ thường chỉ một khiếm khuyết thể chất khiến con vật không đủ điều kiện làm lễ vật.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “vì nó sẽ không được chấp nhận thay mặt các ngươi.” Cụm từ Hê-bơ-rơ nói về sự chấp nhận thuận ý của lễ vật liên quan đến người dâng.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: bất cứ con vật nào có tì vết
  rationale: Cụm Hê-bơ-rơ là một cách diễn đạt bao quát, theo sát nghĩa là “bất cứ thứ gì có tì vết”. Trong ngữ cảnh luật tế lễ, đối tượng được dâng là con vật; nêu rõ “con vật” giúp câu tiếng Việt tự nhiên mà không làm hẹp phạm vi theo ngữ cảnh.
- source_word: מוּם
  choice: tì vết
  rationale: Từ này thường chỉ khuyết tật hoặc khiếm khuyết thể chất khiến lễ vật không đủ điều kiện. “Tì vết” giữ được sắc thái tế lễ truyền thống; chú thích nêu cách diễn đạt trực tiếp hơn.
- source_word: לֹא תַקְרִיבוּ
  choice: không được dâng
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa đem đến hoặc trình dâng làm lễ vật. “Dâng” ngắn gọn, tự nhiên và đúng với hành động tế lễ.
- source_word: כִּי
  choice: vì
  rationale: כִּי giới thiệu lý do của lệnh cấm; “vì” thể hiện rõ quan hệ nguyên nhân.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: nó sẽ không được chấp nhận cho các ngươi
  rationale: לְרָצוֹן trong luật tế lễ nói đến việc lễ vật được đón nhận thuận ý; לָכֶם giữ ý nghĩa “cho các ngươi”, có thể hàm ý “thay mặt các ngươi”. Bản dịch giữ cách diễn đạt này và ghi cách hiểu thay thế trong chú thích.
theological_decisions:
- issue: Ngôn ngữ về sự chấp nhận trong tế lễ
  choice: không được chấp nhận cho các ngươi
  alternative: không được chấp nhận thay mặt các ngươi
  rationale: Cách dịch chính giữ cả ý lễ vật được Đức Chúa Trời đón nhận và đại từ lợi ích לָכֶם, nhưng không quyết định dứt khoát liệu sắc thái là “cho các ngươi” hay “thay mặt các ngươi”.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “các ngươi” để phản ánh lời truyền trực tiếp cho cộng đồng trong ngữ cảnh cổ; “dâng” và “tì vết” giữ sắc thái tế lễ mà vẫn quen thuộc trong tiếng Việt hiện đại.
