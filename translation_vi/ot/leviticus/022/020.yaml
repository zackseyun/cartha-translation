  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh cấm dâng vật có מוּם và lý do về tính được chấp nhận trong tế lễ. Tuy nhiên, cụm “không được chấp nhận cho các ngươi” là lối kết hợp chưa tự nhiên trong tiếng Việt hiện đại. Cách sửa giữ ý לְרָצוֹן לָכֶם là lễ vật không đem lại sự chấp nhận cho người dâng, mà không buộc phải hiểu là hoàn toàn mang nghĩa đại diện “thay mặt”.
  naturalness: “Bất cứ con vật nào có tì vết” và “không được dâng” phù hợp với văn cảnh tế lễ và văn phong luật lệ. “Sẽ không đem lại sự chấp nhận cho các ngươi” tự nhiên hơn, đồng thời diễn đạt rõ quan hệ giữa lễ vật và sự chấp nhận dành cho người dâng.
