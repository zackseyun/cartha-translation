  terminology: Thuật ngữ “tinh hoàn” chính xác về giải phẫu và phù hợp với văn cảnh luật tế lễ. Tuy nhiên, danh riêng יהוה nên được thống nhất là “Yahweh”, theo quyết định danh thánh trong hồ sơ POB tiếng Anh và chính sách dự án nêu kèm, thay vì “Đức Giê-hô-va”.
