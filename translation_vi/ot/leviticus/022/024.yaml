id: LEV.22.24
reference: Leviticus 22:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: vi
  text: Các con không được dâng lên Yahweh con vật nào có tinh hoàn bị giập, bị nghiền nát, bị giật đứt hoặc bị cắt bỏ[a]; trong xứ của các con, các con cũng không được làm điều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn chỉ liệt kê bốn tình trạng: “bị giập, bị nghiền nát, bị giật đứt hoặc bị cắt bỏ”; ngữ cảnh cho thấy chúng chỉ các dạng tổn hại tinh hoàn của con vật đực.'
    reason: Làm rõ danh từ được ngầm hiểu trong tiếng Hê-bơ-rơ và bảo toàn sự phân biệt giữa bốn thuật ngữ.
lexical_decisions:
- source_word: מָעוּךְ
  choice: bị giập
  rationale: Diễn tả tổn thương do ép hoặc va đập, đồng thời phân biệt với כָתוּת là mức độ nghiền nát.
- source_word: כָתוּת
  choice: nghiền nát
  rationale: Giữ hình ảnh cụ thể của bộ phận bị đập hoặc nghiền nát.
- source_word: נָתוּק
  choice: giằng đứt
  rationale: Diễn đạt ý bị kéo hoặc giật cho lìa ra, không đồng nhất với việc dùng vật sắc để cắt.
- source_word: כָרוּת
  choice: cắt bỏ
  rationale: Phản ánh động từ gốc mang nghĩa cắt lìa; trong ngữ cảnh đây là một dạng thiến hoặc làm tổn hại cơ quan sinh dục.
- source_word: תַקְרִיבוּ
  choice: dâng lên
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ việc đem con vật đến để hiến dâng, rộng hơn riêng hành động thiêu trên bàn thờ.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho danh riêng יהוה, thay vì thay bằng một tước hiệu; giới từ được diễn đạt tự nhiên cùng động từ 'dâng lên'.
- source_word: בְאַרְצְכֶם
  choice: trong xứ của các con
  rationale: Chỉ lãnh thổ nơi cộng đồng Ít-ra-ên cư trú; 'xứ' phù hợp văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: תַעֲשׂוּ
  choice: các con cũng không được làm điều ấy
  rationale: Động từ 'làm' có đối tượng bị lược; 'điều ấy' giữ tính khái quát và liên kết với các hành vi gây tổn hại vừa nêu.
- source_word: implicit object of the four participles
  choice: tinh hoàn
  rationale: Bốn phân từ không nêu danh từ, nhưng ngữ cảnh về con vật đực cho thấy chúng nói đến cơ quan sinh dục; nêu rõ 'tinh hoàn' giúp câu tiếng Việt chính xác và dễ hiểu.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; ĐỨC CHÚA
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng phiên âm đã quen thuộc trong tiếng Việt, không biến danh ấy thành tước hiệu.
- issue: Phạm vi của mệnh lệnh cuối וּבְאַרְצְכֶם לֹא תַעֲשׂוּ
  choice: Cấm thực hiện trong xứ các hành vi làm tổn hại cơ quan sinh dục vừa nêu
  alternative: Chỉ cấm dâng những con vật ấy trong xứ; hoặc cấm chuẩn bị chúng làm sinh tế
  rationale: Động từ 'làm' rộng và bị lược đối tượng. Cụm 'làm điều ấy' bảo toàn độ rộng của nguyên văn, còn ngữ cảnh gần nhất hướng về các hành vi gây tổn hại vừa được liệt kê.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng 'các con' theo lời phán cho cộng đồng giao ước; dùng thuật ngữ giải phẫu 'tinh hoàn' thay cho lối nói tránh cổ. Từ 'cũng' thể hiện liên kết của וּ trước mệnh đề cuối.
