  rationale: Sửa nhẹ để bảo toàn sắc thái hoàn cảnh của בְּאָכְלָם, làm rõ thành ngữ chỉ trách nhiệm tội lỗi có hàm ý bồi thường, và tăng tính tự nhiên của tiếng Việt. Các mốc chú thích được giữ đúng tại cụm từ chúng giải thích; sự mơ hồ về đối tượng của «họ» được bảo tồn.
