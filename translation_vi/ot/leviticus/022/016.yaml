id: LEV.22.16
reference: Leviticus 22:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: vi
  text: và khiến họ mang tội phải bồi thường khi họ ăn những vật thánh của mình,[a][b] vì Ta là Yahweh, Đấng thánh hóa họ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và khiến họ mắc tội”; cách diễn đạt Hê-bơ-rơ ở đây khó và có thể nhấn mạnh trách nhiệm về một tội phạm.'
    reason: lexical_alternative
  - marker: b
    text: “Những vật thánh” chỉ các phần hoặc lễ vật đã được thánh hiến.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “Đấng làm cho họ nên thánh” hoặc “Đấng thánh hiến họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: và như thế khiến
  rationale: Dạng Hiphil mang ý nghĩa gây khiến; cụm “và như thế” thể hiện mối liên hệ hệ quả với điều cấm ở câu trước mà không diễn giải quá mức.
- source_word: אוֹתָם
  choice: họ
  rationale: Giữ đại từ số nhiều chỉ những người đang được nói đến trong ngữ cảnh, thay vì tự ý xác định rõ hơn trong chính văn.
- source_word: עֲוֺן אַשְׁמָה
  choice: tội cần bồi hoàn
  rationale: Cụm Hê-bơ-rơ kết hợp ý niệm tội/lỗi với trách nhiệm do hành vi phạm lỗi; trong bối cảnh tế tự, nó hàm ý trách nhiệm phải bồi hoàn. Cách dịch này tự nhiên hơn lối dịch sát từng chữ nhưng vẫn giữ sắc thái pháp lý-tế tự.
- source_word: בְּאָכְלָם
  choice: vì đã ăn
  rationale: Giới từ בְּ đi với động từ nguyên mẫu có thể nêu phương tiện, hoàn cảnh hoặc nguyên nhân. “Vì đã ăn” truyền đạt tự nhiên quan hệ gây nên trách nhiệm trong câu.
- source_word: קָדְשֵׁיהֶם
  choice: những vật thánh của mình
  rationale: Dịch sát danh từ “những vật thánh” cùng hậu tố sở hữu; trong ngữ cảnh Lê-vi Ký, đây là các phần hoặc lễ vật đã được biệt riêng ra thánh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: מְקַדְּשָׁם
  choice: Đấng thánh hóa họ
  rationale: Phân từ Piel của קדשׁ có nghĩa làm nên thánh, biệt riêng ra thánh. “Thánh hóa” giữ được sắc thái tế tự-thần học và đại từ “họ” của nguyên văn.
theological_decisions:
- issue: Đối tượng của hậu tố “họ” trong mệnh đề cuối
  choice: Giữ nguyên “Đấng thánh hóa họ” mà không xác định rõ trong chính văn
  alternative: Hiểu là Yahweh thánh hóa các vật thánh
  rationale: Hậu tố số nhiều giống đực tự nhiên có thể quy về những người đang được nói đến, nhưng cấu trúc và các đối tượng trong ngữ cảnh tạo ra độ căng diễn giải. Bản dịch giữ cú pháp và sự mơ hồ chân thực thay vì chèn một lời giải thích giáo lý.
- issue: Sắc thái của עֲוֺן אַשְׁמָה
  choice: tội cần bồi hoàn
  alternative: tội lỗi; hình phạt vì phạm lỗi
  rationale: Cụm từ khó này vừa chỉ tình trạng có tội vừa có thể nhấn mạnh trách nhiệm phát sinh từ một hành vi phạm lỗi trong hệ thống tế tự. Cách dịch được chọn giữ cả hai nét nghĩa mà không đồng nhất nó hoàn toàn với một nghi thức hoặc hình phạt cụ thể.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Mang tội cần bồi hoàn” giữ sắc thái pháp lý-tế tự của nguyên văn; “những vật thánh” bảo tồn hình ảnh Hê-bơ-rơ và được giải thích bằng chú thích. Danh Yahweh được giữ nguyên.
