base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “YHWH”; theo truyền thống thường dịch là “Đức Giê-hô-va” hoặc “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”; dạng có waw nối tiếp mở đầu một sự kiện phát ngôn mới.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để biểu thị trực tiếp danh riêng YHWH, thay vì thay bằng tước hiệu “Chúa”.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, giới từ này đánh dấu người tiếp nhận lời nói và phù hợp cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng משה đã quen dùng trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn lời, “rằng” liên kết tự nhiên lời phán với nội dung trực tiếp ở câu kế tiếp, đồng thời bảo toàn chức năng của dạng nguyên mẫu “nói”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê); CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. “Đức Giê-hô-va” giữ đây là danh riêng và là hình thức quen thuộc, trang trọng đối với độc giả Kinh Thánh tiếng Việt; không thay danh ấy bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên tính công thức của lời dẫn nhập thần phán, dùng dấu hai chấm vì nội dung lời phán tiếp tục ở câu sau.
