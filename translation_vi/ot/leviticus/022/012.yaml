source:
  edition: WLC
  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: vi
  text: Nhưng nếu con gái của một thầy tế lễ lấy một người không phải là thầy tế lễ[a], thì nàng không được ăn phần dâng hiến của các vật thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cho một người đàn ông lạ/ở ngoài.” Trong văn cảnh này, cụm từ chỉ người ở ngoài phạm vi tư tế, tức người không phải là thầy tế lễ; không nhất thiết chỉ người ngoại quốc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phần dâng hiến thuộc các vật thánh,” “của lễ vật thánh,” hoặc “các lễ vật thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: Nhưng nếu con gái của một thầy tế lễ
  rationale: Waw được hiểu theo ý tương phản với quy định trước; quan hệ cấu trúc danh từ được diễn đạt tự nhiên là “con gái của một thầy tế lễ”.
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: lấy một người ngoài giới thầy tế lễ
  rationale: Cụm “trở thành/thuộc về một người đàn ông bên ngoài” chỉ việc kết hôn. Trong văn cảnh luật về gia đình tư tế, זָר là người ngoài phạm vi tư tế, không nhất thiết là người ngoại quốc.
- source_word: הִוא
  choice: thì nàng
  rationale: Đại từ độc lập được thể hiện bằng chủ ngữ rõ ràng; “nàng” phù hợp với văn phong trang trọng và tránh lặp dài.
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: phần lễ vật thánh
  rationale: תְּרוּמָה là phần đóng góp/lễ vật được biệt riêng; kết hợp với קֳדָשִׁים chỉ phần thuộc các vật thánh. Cách dịch này tự nhiên mà vẫn giữ phạm vi khái quát của cụm Hê-bơ-rơ.
- source_word: לֹא תֹאכֵל
  choice: không được ăn
  rationale: Diễn đạt rõ sức quy định của thể chưa hoàn thành phủ định trong văn bản luật pháp.
theological_decisions:
- issue: Ý nghĩa của זָר trong luật lệ về chức tế lễ
  choice: người ngoài giới thầy tế lễ
  alternative: người lạ; người ngoại quốc; người không phải thầy tế lễ
  rationale: Văn cảnh nói về quyền ăn vật thánh trong gia đình tư tế. Cách dịch đã chọn biểu thị người ở ngoài phạm vi tư tế mà không biến sự phân biệt này thành vấn đề sắc tộc.
- issue: Phạm vi của תְרוּמַת הַקֳּדָשִׁים
  choice: phần lễ vật thánh
  alternative: lễ vật dâng từ các vật thánh; phần đóng góp thuộc những vật thánh
  rationale: Giữ ý về phần lễ vật được biệt riêng mà không thu hẹp cụm từ thành một loại nghi lễ cụ thể hơn điều nguyên văn xác định.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh quen thuộc; câu luật được diễn đạt bằng “không được”. Các chú thích giữ lại sắc thái nguyên văn và những khả năng dịch thực sự.
