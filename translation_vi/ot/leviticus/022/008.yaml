source:
  edition: WLC
  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: vi
  text: Người ấy không được ăn con vật chết tự nhiên hoặc con vật bị thú dữ xé[a], kẻo tự làm mình ô uế vì những thứ ấy. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “xác của con vật chết tự nhiên hoặc con vật bị thú dữ xé.”'
    reason: Giữ phương án sát nghĩa danh từ נְבֵלָה (“xác [con vật]”), trong khi chính văn diễn đạt rõ hơn trong ngữ cảnh luật thực phẩm.
lexical_decisions:
- source_word: נְבֵלָה
  choice: con vật chết tự nhiên
  rationale: Danh từ này chỉ xác động vật, đặc biệt là con vật chết mà không được giết đúng cách. Cách dịch này tự nhiên trong tiếng Việt và phân biệt rõ với con vật bị thú dữ xé.
- source_word: וּטְרֵפָה
  choice: hoặc bị thú dữ xé
  rationale: טְרֵפָה chỉ con vật bị mãnh thú vồ xé; thêm “thú dữ” diễn đạt tác nhân được hàm ý và phù hợp ngữ cảnh luật thực phẩm.
- source_word: לֹא יֹאכַל
  choice: không được ăn
  rationale: Thể vị hoàn với phủ định trong văn luật pháp biểu thị lệnh cấm; “không được” vừa rõ lực pháp lệnh vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: לְטָמְאָה בָהּ
  choice: để khỏi bị ô uế vì nó
  rationale: Cụm nguyên mẫu với ל có thể nêu mục đích hoặc kết quả. Trong tiếng Việt, cách diễn đạt phủ định theo lệnh cấm truyền đạt tự nhiên rằng việc ăn sẽ khiến người ấy rơi vào tình trạng ô uế nghi lễ.
- source_word: אֲנִי יְהוָה
  choice: Ta là Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước יהוה thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt trang trọng, quen thuộc và phân biệt rõ danh này với “Chúa”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản nguồn ghi trực tiếp Danh Thánh. Bản dịch dùng một dạng danh riêng đã quen thuộc trong tiếng Việt, không thay danh ấy bằng tước hiệu và không giải thích thêm ý nghĩa thần học.
- issue: Sắc thái ô uế của טמא
  choice: bị ô uế
  alternative: tự làm mình ô uế
  rationale: “Bị ô uế” giữ trọng tâm ở tình trạng ô uế nghi lễ phát sinh do ăn; tránh khiến câu bị hiểu chủ yếu theo nghĩa ô nhiễm hay suy đồi đạo đức.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Người ấy” nối với đối tượng là thầy tế lễ trong ngữ cảnh trước đó; “không được” thể hiện lệnh cấm rõ ràng. Thuật ngữ “ô uế” giữ sắc thái thanh sạch nghi lễ của sách Lê-vi.
