revisions:
- from: Hãy nói với A-rôn và các con trai ông rằng họ phải tránh xa những vật thánh của con dân Y-sơ-ra-ên, để không làm ô danh thánh của Ta khi đến gần những vật mà dân ấy biệt riêng cho Ta[a]. Ta là Đức Giê-hô-va.
  to: Hãy nói với A-rôn và các con trai ông rằng họ phải tự tách mình khỏi các vật thánh của con dân Y-sơ-ra-ên, là những vật họ biệt riêng cho Ta, và không được làm ô danh thánh của Ta[a]. Ta là Đức Giê-hô-va.
  rationale: Loại bỏ chi tiết “khi đến gần” không có trong nguồn. Sắp xếp lại câu để mệnh đề “họ biệt riêng cho Ta” quy chiếu rõ ràng đến “các vật thánh,” đồng thời giữ sự phối hợp của hai mệnh đề mệnh lệnh bằng “và không được.”
  reviewer_model: gpt-5.6-terra
