review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp thêm ý “khi đến gần”, vốn không có trong tiếng Hê-bơ-rơ. Cụm này còn làm đổi quan hệ cú pháp: mệnh đề cuối trong nguyên ngữ được hiểu hợp lý nhất là bổ nghĩa cho “những vật thánh” do con dân Y-sơ-ra-ên biệt riêng cho Đức Chúa Trời, chứ không nói về việc các thầy tế lễ “đến gần” các vật ấy. Bản sửa giữ mệnh lệnh tự tách/kiêng khỏi vật thánh, lệnh không làm ô danh thánh, và sở chỉ của mệnh đề quan hệ.'
  naturalness: “Tự tách mình khỏi” là cách nói hiện đại, rõ nghĩa và phản ánh dạng phản thân của động từ. Đưa mệnh đề “là những vật họ biệt riêng cho Ta” sát sau “các vật thánh” giúp câu tiếng Việt không mơ hồ; “làm ô danh thánh” phù hợp văn phong trang trọng và ngữ cảnh thánh khiết.
  terminology: Giữ “A-rôn,” “con dân Y-sơ-ra-ên,” “vật thánh,” “danh thánh,” và “Đức Giê-hô-va.” “Biệt riêng cho Ta” truyền đạt ý hiến thánh/dâng riêng mà không thu hẹp “vật thánh” thành một loại lễ vật cụ thể.
  issues:
  - severity: high
    issue: Cụm “khi đến gần những vật” được thêm vào bản văn.
    rationale: Nguyên ngữ không có động từ hay mệnh đề nào mang nghĩa “đến gần.” Đây là một diễn giải bối cảnh, không nên đưa vào thân bài dịch.
  - severity: high
    issue: Mệnh đề cuối bị gắn vào “danh thánh của Ta” theo cấu trúc tiếng Việt của bản nháp.
    rationale: “Danh thánh của Ta khi đến gần những vật mà dân ấy biệt riêng cho Ta” vừa không phản ánh cú pháp/ý nghĩa nguồn vừa làm mờ sở chỉ được English audit trail xác định là “những vật thánh.”
  - severity: medium
    issue: Chú thích hiện tại lặp lại một bản văn thay thế có cấu trúc không tự nhiên và không cần thiết.
    rationale: Chú thích nên nêu lựa chọn từ vựng cho וְיִנָּזְרוּ, không nên tạo một câu thay thế khiến quan hệ giữa danh thánh và vật thánh thêm rối.
