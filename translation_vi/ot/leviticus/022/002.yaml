  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: vi
  text: Hãy nói với A-rôn và các con trai ông rằng họ phải tự tách mình khỏi các vật thánh của con dân Y-sơ-ra-ên, là những vật họ biệt riêng cho Ta, và không được làm ô danh thánh của Ta[a]. Ta là Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “phải kiêng các vật thánh” hoặc “phải tránh xa các vật thánh.”'
    reason: Ghi nhận các sắc thái có thể có của וְיִנָּזְרוּ (tự tách mình, kiêng, tránh xa) mà không thêm chi tiết không có trong nguyên văn.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Mệnh lệnh Piel của דבר, dùng để mở đầu chỉ thị Đức Chúa Trời truyền cho Môi-se; “Hãy nói” trực tiếp và tự nhiên.
- source_word: וְיִנָּזְרוּ
  choice: phải tránh xa
  rationale: Niphal của נזר diễn tả việc tự tách mình hoặc kiêng không đụng đến điều thánh. “Phải tránh xa” truyền đạt rõ yêu cầu thực hành, trong khi chú thích giữ các khả năng “tự tách mình” và “kiêng”.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: những vật thánh của con dân Y-sơ-ra-ên
  rationale: “Những vật thánh” giữ phạm vi rộng của קָדְשֵׁי, không thu hẹp thành một loại lễ vật cụ thể; “con dân Y-sơ-ra-ên” là cách gọi dân tộc tự nhiên và trang trọng trong tiếng Việt.
- source_word: יְחַלְּלוּ
  choice: làm ô danh
  rationale: Piel của חלל trong ngữ cảnh thánh khiết có nghĩa làm cho ra phàm tục hoặc xúc phạm sự thánh. Với đối tượng là “danh thánh”, “làm ô danh” tự nhiên hơn “làm tục” nhưng vẫn giữ sức nặng thần học.
- source_word: שֵׁם קָדְשִׁי
  choice: danh thánh của Ta
  rationale: Cách diễn đạt trang trọng, tự nhiên, bảo toàn ý nghĩa giao ước gắn với danh Đức Chúa Trời.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: những vật mà dân ấy biệt riêng cho Ta
  rationale: Diễn đạt rõ mệnh đề quan hệ quy về các vật thánh và giữ ý nghĩa “làm nên thánh/biệt riêng” của קדש. “Dân ấy” làm rõ chủ thể số nhiều là con dân Y-sơ-ra-ên.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc, trang trọng trong tiếng Việt để biểu thị Tứ Tự Danh, thay vì thay bằng tước hiệu “Chúa”.
theological_decisions:
- issue: Sở chỉ của mệnh đề אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: Mệnh đề quy về “những vật thánh” mà dân Y-sơ-ra-ên biệt riêng cho Đức Chúa Trời.
  alternative: Có thể đọc theo dòng câu như thể mệnh đề liên hệ gần hơn với “danh thánh của Ta”.
  rationale: 'Ngữ pháp và bối cảnh nghi lễ ủng hộ sở chỉ là những vật thánh: dân Y-sơ-ra-ên biệt riêng chúng cho Đức Chúa Trời, còn việc các thầy tế lễ xử sự sai với chúng sẽ làm ô danh Ngài. Bản dịch làm rõ quan hệ này nhưng ghi nhận vấn đề cú pháp.'
- issue: Quan hệ giữa việc tránh vật thánh và không làm ô danh
  choice: Dịch “để không” nhằm thể hiện hệ quả/mục đích thực tế của hai mệnh đề phối hợp.
  alternative: Dịch sát hình thức là “và không làm ô danh”.
  rationale: Liên từ וְ có thể mang lực kết quả trong chuỗi mệnh lệnh; tiếng Việt cần nêu quan hệ cho tự nhiên. Cách dịch không thay đổi nội dung cấm đoán.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con dân Y-sơ-ra-ên” như danh xưng dân tộc theo ngữ cảnh giao ước; “vật thánh” giữ độ rộng nghi lễ của nguyên ngữ. Đại từ “Ta” phù hợp lời phán trực tiếp của Đức Chúa Trời.
