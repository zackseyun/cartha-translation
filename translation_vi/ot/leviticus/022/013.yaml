  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: vi
  text: Nhưng nếu con gái của một thầy tế lễ góa chồng hoặc ly dị, không có con cái, và trở về nhà cha mình như thuở còn trẻ, thì nàng được ăn thức ăn của cha mình[a]; nhưng không một người ngoài nào[b] được ăn thức ăn ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “bánh của cha mình.” Ở đây, “bánh” có lẽ chỉ rộng hơn phần lương thực thuộc gia đình thầy tế lễ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người không được phép.” Từ Hê-bơ-rơ này chỉ người ở ngoài phạm vi được phép theo luật tế lễ, không nhất thiết là người ngoại quốc về mặt sắc tộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת כֹּהֵן
  choice: Nhưng nếu con gái của một thầy tế lễ
  rationale: Liên từ וּ trong mạch luật lệ mang sắc thái tương phản với trường hợp trước, nên dịch là “Nhưng”; כִּי mở đầu điều kiện, được thể hiện tự nhiên bằng “nếu”.
- source_word: אַלְמָנָה וּגְרוּשָׁה
  choice: góa chồng hoặc ly dị
  rationale: Hai từ chỉ hai tình trạng thay thế nhau trong điều khoản này. “Hoặc” làm rõ quan hệ lựa chọn mà tiếng Việt đòi hỏi, không hàm ý người phụ nữ phải đồng thời ở cả hai tình trạng.
- source_word: וְזֶרַע אֵין לָהּ
  choice: không có con cái
  rationale: זֶרַע nghĩa đen là “hạt giống” nhưng trong ngữ cảnh gia đình chỉ con cháu/hậu duệ. “Con cái” tự nhiên, dễ hiểu và không thu hẹp vào một người con duy nhất.
- source_word: וְשָׁבָה אֶל־בֵּית אָבִיהָ
  choice: và trở về nhà cha mình
  rationale: שׁוב diễn tả việc trở lại gia đình bên cha, là đơn vị gia đình mà người phụ nữ từng thuộc về trước khi kết hôn.
- source_word: כִּנְעוּרֶיהָ
  choice: như thuở còn trẻ
  rationale: Giữ phép so sánh với địa vị trước kia của nàng trong nhà cha, đồng thời dùng cách nói trang trọng và tự nhiên trong tiếng Việt hiện đại.
- source_word: מִלֶּחֶם אָבִיהָ תֹּאכֵל
  choice: thì nàng được ăn thức ăn của cha mình
  rationale: לֶחֶם có nghĩa đen là “bánh” nhưng ở đây có thể chỉ rộng hơn các phần lương thực thuộc gia đình thầy tế lễ. “Được ăn” biểu đạt quyền được phép trong văn bản luật.
- source_word: וְכָל־זָר
  choice: nhưng không một người ngoài nào
  rationale: זָר trong luật tế lễ là người nằm ngoài phạm vi được phép ăn, không nhất thiết là người ngoại quốc hay khác dân tộc.
- source_word: לֹא יֹאכַל בּוֹ
  choice: được ăn thức ăn ấy
  rationale: Sau cấu trúc phủ định “không ... nào”, “được ăn” diễn đạt lệnh cấm về tư cách; “thức ăn ấy” nêu rõ sở chỉ của đại từ בּוֹ trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của “bánh/thức ăn của cha nàng” trong luật dành cho gia đình thầy tế lễ
  choice: Dịch לֶחֶם là “thức ăn”, chỉ chung phần lương thực mà nàng được phép dùng trong nhà cha.
  alternative: Dịch sát là “bánh của cha mình”.
  rationale: Bối cảnh Lê-vi Ký 22 bàn về tư cách được ăn các phần thánh thuộc gia đình thầy tế lễ. “Thức ăn” truyền đạt nghĩa hoán dụ tự nhiên hơn mà không xác định quá mức loại lương thực.
- issue: Ý nghĩa của זָר
  choice: “người ngoài”, tức người ngoài phạm vi được luật tế lễ cho phép.
  alternative: “người lạ” hoặc “người ngoại quốc”.
  rationale: Từ này ở đây phân định tư cách tế lễ chứ không chủ yếu phân định sắc tộc; bản dịch tránh khiến độc giả hiểu thành một lệnh cấm nhắm vào người nước ngoài.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp tiếng Việt hiện đại. Dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh quen thuộc; dùng “nàng” để duy trì sở chỉ nữ giới rõ ràng mà không quá khẩu ngữ. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
