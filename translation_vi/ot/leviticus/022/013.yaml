  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc điều kiện và các yếu tố pháp lý của Hê-bơ-rơ: con gái thầy tế lễ ở tình trạng góa chồng hoặc ly dị, không có con cái, trở về nhà cha như thời trẻ, được ăn phần thức ăn của cha; người ngoài phạm vi được phép thì không được ăn. “Con cái” phản ánh tự nhiên nghĩa hậu duệ/con cháu của זֶרַע mà không giới hạn vào một người con. “Thức ăn” là cách chuyển nghĩa hoán dụ phù hợp của לֶחֶם trong ngữ cảnh này.'
  naturalness: Tiếng Việt hiện đại, rõ ràng và có nhịp điệu pháp lý thích hợp. “Góa chồng hoặc ly dị” diễn đạt tự nhiên hai tình trạng thay thế; “như thuở còn trẻ” giữ sát phép so sánh của nguyên văn. Cách dùng “nàng” phù hợp văn phong Kinh Thánh trang trọng và giúp giữ rõ chủ ngữ nữ.
  terminology: “Thầy tế lễ” là thuật ngữ Kinh Thánh quen thuộc. “Người ngoài” diễn đạt đúng זָר như người không thuộc phạm vi được phép trong luật tế lễ, tránh hiểu sai theo sắc tộc. Các chú thích làm rõ hợp lý “bánh” và “người ngoài”; vị trí ký hiệu chú thích khớp với các cụm được giải thích.
