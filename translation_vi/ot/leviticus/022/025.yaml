source:
  edition: WLC
  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: vi
  text: Từ tay người ngoại quốc, các ngươi không được dâng bất cứ con nào trong số ấy làm thức ăn cho Đức Chúa Trời của mình[a], vì chúng bị hư hại và có khuyết tật[b]. Chúng sẽ không được chấp nhận cho các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bánh của Đức Chúa Trời các ngươi”. Ở đây, “bánh” là một thành ngữ tế lễ Hê-bơ-rơ chỉ thức ăn được dâng lên Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ này cũng có thể dịch là “tì vết”; nó chỉ một khuyết tật khiến con vật không đủ điều kiện dùng làm lễ vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: nhận từ tay
  rationale: Giữ hình ảnh “từ tay” của thành ngữ Hê-bơ-rơ, đồng thời dùng “nhận” để câu tiếng Việt nêu rõ nguồn cung cấp con vật.
- source_word: בֶּן נֵכָר
  choice: người ngoại quốc
  rationale: Cụm từ có nghĩa đen là “con của người ngoại”, nhưng là thành ngữ chỉ người không thuộc dân Y-sơ-ra-ên; “người ngoại quốc” tự nhiên và phù hợp ngữ cảnh pháp lý-nghi lễ.
- source_word: תַקְרִיבוּ
  choice: dâng
  rationale: Thể Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến hoặc trình dâng; “dâng” là cách diễn đạt ngắn gọn, rõ ràng trong tiếng Việt hiện đại.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: thức ăn cho Đức Chúa Trời của mình
  rationale: לֶחֶם nghĩa đen là “bánh” nhưng trong văn cảnh tế lễ chỉ rộng hơn về lễ vật được dâng làm thức ăn. “Cho” diễn đạt chức năng tế lễ tự nhiên hơn cách sở hữu cứng nhắc trong tiếng Việt; chú thích giữ nghĩa đen.
- source_word: מִכָּל אֵלֶּה
  choice: bất cứ con nào trong số ấy
  rationale: Cụm từ quy chiếu đến các con vật có khuyết tật đã nêu; thêm danh từ loại “con” làm rõ đối tượng mà không thêm nội dung mới.
- source_word: מָשְׁחָתָם
  choice: chúng mang dấu hư hại
  rationale: Danh từ có thể chỉ sự hư hỏng, tổn hại hoặc biến dạng. Cách dịch này giữ nét nghĩa rộng và tránh đồng nhất hoàn toàn với מוּם ở vế kế tiếp.
- source_word: מוּם
  choice: khuyết tật
  rationale: Đây là thuật ngữ thường dùng trong Lê-vi Ký 21–22 về một khiếm khuyết khiến con vật không đủ điều kiện tế lễ.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: Chúng sẽ không được chấp nhận khi dâng thay cho các ngươi
  rationale: Thể Niphal của רצה chỉ việc lễ vật được chấp nhận; “thay cho các ngươi” thể hiện quan hệ vì hoặc đại diện cho người dâng trong לָכֶם, nhưng chú thích ghi nhận phạm vi nghĩa của giới từ.
theological_decisions:
- issue: Cách diễn đạt lễ vật như thức ăn của Đức Chúa Trời
  choice: thức ăn cho Đức Chúa Trời của mình
  alternative: bánh của Đức Chúa Trời các ngươi
  rationale: “Thức ăn” truyền đạt thành ngữ tế lễ của văn bản tư tế mà không khiến độc giả hiểu đối tượng chỉ là bánh; đây là quyết định từ vựng-văn hóa, không phải sự mở rộng giáo lý.
- issue: Quan hệ của sự chấp nhận lễ vật với người dâng
  choice: được chấp nhận khi dâng thay cho các ngươi
  alternative: được chấp nhận cho các ngươi
  rationale: לָכֶם có thể chỉ lợi ích hoặc quan hệ đại diện đối với người dâng. Bản dịch chính dùng cách nói tự nhiên trong ngữ cảnh tế lễ, còn chú thích giữ khả năng hiểu rộng hơn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “các ngươi” để phù hợp lời luật truyền cho cộng đồng. Câu được sắp xếp lại nhẹ theo cú pháp tiếng Việt, vẫn giữ nguồn con vật, chức năng tế lễ, hai mô tả về tình trạng không đạt chuẩn và kết luận về việc không được chấp nhận.
