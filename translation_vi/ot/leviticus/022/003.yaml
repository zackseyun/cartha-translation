revisions:
- from: 'Hãy nói với họ: Qua mọi thế hệ của các ngươi, bất cứ người nam nào trong dòng dõi các ngươi đến gần những vật thánh mà con dân Israel biệt ra thánh cho Yahweh, trong khi sự ô uế vẫn còn trên mình, thì người ấy sẽ bị truất khỏi trước mặt ta.[a][b] Ta là Yahweh.'
  to: 'Hãy nói với họ: Qua mọi thế hệ của các ngươi, bất cứ người nam nào thuộc dòng dõi các ngươi đến gần những vật thánh mà con dân Israel biệt riêng làm thánh cho Yahweh, trong khi sự ô uế vẫn còn trên mình người ấy, thì người ấy sẽ bị đoạn tuyệt khỏi trước mặt ta.[a][b] Ta là Yahweh.'
  rationale: Thay “bị truất” bằng “bị đoạn tuyệt” để tránh nghĩa phế truất khỏi chức vụ và để giữ tính chưa xác định của hình phạt כרת. Điều chỉnh “biệt ra thánh” thành “biệt riêng làm thánh” cho tự nhiên hơn, không thay đổi nghĩa. Các chú thích vẫn được neo sau “khỏi trước mặt ta” và bao quát đúng hai vấn đề văn bản cần giải thích.
  reviewer_model: gpt-5.6-terra
