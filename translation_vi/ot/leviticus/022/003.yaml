  source_fidelity: Bản dịch phản ánh đúng cấu trúc pháp quy của câu, phạm vi liên thế hệ, giới tính nam của אִישׁ trong ngữ cảnh tư tế, trạng thái ô uế còn trên người, và không áp đặt một cách hiểu cụ thể cho hình phạt כרת. Tuy nhiên, “bị truất” thường chỉ việc phế truất khỏi chức vị, không phù hợp với công thức pháp lý rộng hơn của וְנִכְרְתָה.
  naturalness: Câu nhìn chung rõ và có văn phong nghi lễ-pháp quy phù hợp. “Biệt riêng làm thánh” tự nhiên hơn “biệt ra thánh”; “bị đoạn tuyệt” tránh liên tưởng hành chính không chủ ý của “bị truất.”
  terminology: Giữ nhất quán và phù hợp các thuật ngữ “vật thánh,” “sự ô uế,” và Yahweh. “Đoạn tuyệt” truyền đạt tính nghiêm trọng của công thức כרת mà không xác định đó là xử tử hay khai trừ.
  issues:
