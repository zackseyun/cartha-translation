reference: Leviticus 22:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: vi
  text: 'Hãy nói với họ: Qua mọi thế hệ của các ngươi, bất cứ người nam nào thuộc dòng dõi các ngươi đến gần những vật thánh mà con dân Israel biệt riêng làm thánh cho Yahweh, trong khi sự ô uế vẫn còn trên mình người ấy, thì người ấy sẽ bị đoạn tuyệt khỏi trước mặt ta.[a][b] Ta là Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi sự hiện diện của ta.”'
    reason: lexical_alternative
  - marker: b
    text: “Bị đoạn tuyệt” là một công thức hình phạt trong giao ước; câu này không nói rõ người ấy bị xử tử, bị khai trừ khỏi cộng đồng hay bị loại bỏ theo một cách khác.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: Hãy nói với họ
  rationale: Giữ mệnh lệnh số ít nói với Môi-se và đối tượng số nhiều, bằng cách diễn đạt pháp quy tự nhiên trong tiếng Việt.
- source_word: לְדֹרֹתֵיכֶם
  choice: Qua mọi thế hệ của các ngươi
  rationale: Diễn đạt tính hiệu lực liên tục đối với các thế hệ kế tiếp, đồng thời giữ đại từ số nhiều của nguyên văn.
- source_word: כָּל אִישׁ
  choice: bất cứ người nam nào
  rationale: Trong ngữ cảnh các hậu duệ nam thuộc dòng tư tế của A-rôn, איש được giữ rõ là người nam thay vì khái quát hóa thành bất cứ ai.
- source_word: מִכָּל זַרְעֲכֶם
  choice: trong dòng dõi các ngươi
  rationale: זרע ở đây chỉ hậu duệ theo dòng tộc; 'dòng dõi' tự nhiên và phù hợp văn phong luật pháp.
- source_word: יִקְרַב אֶל הַקֳּדָשִׁים
  choice: đến gần những vật thánh
  rationale: Giữ nghĩa không gian-nghi lễ của קרב và phạm vi rộng của danh từ số nhiều הַקֳּדָשִׁים, không thu hẹp thành một loại lễ vật cụ thể.
- source_word: יַקְדִּישׁוּ
  choice: biệt ra thánh
  rationale: Thể hiện Hiphil của קדשׁ là làm cho hoặc dành riêng làm thánh, bằng cụm từ dễ hiểu trong tiếng Việt hiện đại.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Giữ sắc thái dân tộc-cộng đồng của thành ngữ Hê-bơ-rơ mà không khiến độc giả hiểu lầm rằng chỉ nói đến các con trai theo nghĩa giới tính.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: trong khi sự ô uế vẫn còn trên mình
  rationale: Bảo toàn hình ảnh trạng thái ô uế 'ở trên' người ấy, thay vì chỉ diễn đạt phẳng là người ấy ô uế.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: người ấy sẽ bị truất
  rationale: נפש trong công thức pháp lý chỉ chính cá nhân; 'bị truất' giữ ý bị loại bỏ nhưng không quyết đoán phương thức hình phạt.
- source_word: מִלְּפָנַי
  choice: khỏi trước mặt ta
  rationale: Bám sát thành ngữ chỉ sự loại khỏi hiện diện của Đức Chúa Trời, đồng thời giữ nét diễn đạt hữu hình của nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay bằng tước hiệu.
theological_decisions:
- issue: Ý nghĩa công thức hình phạt וְנִכְרְתָה
  choice: người ấy sẽ bị truất
  alternative: người ấy sẽ bị xử tử; người ấy sẽ bị khai trừ khỏi cộng đồng; người ấy sẽ bị đoạn tuyệt khỏi địa vị giao ước
  rationale: Công thức כרת ở thể Niphal không tự xác định trong câu này hình phạt được thi hành bằng cái chết, sự khai trừ hay hành động trực tiếp của Đức Chúa Trời. Bản dịch giữ sự không xác định ấy.
- issue: Ý nghĩa của מִלְּפָנַי
  choice: khỏi trước mặt ta
  alternative: khỏi sự hiện diện của ta
  rationale: Cả hai đều khả dĩ; cách dịch chính giữ hình ảnh ngôn ngữ của nguyên văn, còn chú thích nêu cách diễn đạt trừu tượng tự nhiên hơn.
- issue: Danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Giữ danh riêng của Đức Chúa Trời như nguồn Hê-bơ-rơ và tránh thay danh ấy bằng một tước hiệu.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và mang sắc thái luật pháp-tế lễ. Dùng “các ngươi/ta” để phân biệt chuẩn xác số nhiều của đối tượng với lời phán của Yahweh. “Vật thánh”, “biệt ra thánh” và “sự ô uế” bảo tồn thuật ngữ nghi lễ mà vẫn dễ hiểu với độc giả Việt hiện đại. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
