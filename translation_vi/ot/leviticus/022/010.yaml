source:
  edition: WLC
  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: vi
  text: Không một người ngoài nào được ăn vật thánh[a]. Người tạm trú ở với thầy tế lễ[b] hay người làm thuê cũng không được ăn vật thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thức ăn thánh” hoặc “phần thánh”. Danh từ Hê-bơ-rơ số ít, nghĩa đen là “vật thánh”, ở đây chỉ thức ăn từ các lễ vật thánh dành cho những người được phép trong gia đình tư tế.
    reason: lexical_alternative
  - marker: b
    text: Cụm Hê-bơ-rơ chỉ người tạm trú hoặc người lệ thuộc không thuộc gia đình nhưng gắn với nhà của thầy tế lễ; cũng có thể dịch là “người cư trú của thầy tế lễ” hoặc “ngoại kiều cư trú với thầy tế lễ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: người ngoài
  rationale: Trong ngữ cảnh thức ăn thánh dành cho giới tư tế, từ này chỉ người không thuộc nhóm được phép hưởng phần thánh, chứ không nhất thiết là người ngoại quốc. “Người ngoài” giữ được ý loại trừ khỏi đặc quyền thiêng liêng mà không thêm căn tính sắc tộc.
- source_word: קֹדֶשׁ
  choice: vật thánh
  rationale: Danh từ số ít có nghĩa đen là “vật thánh”, trong văn cảnh chỉ phần thức ăn từ lễ vật đã biệt riêng cho việc thánh. Cách dịch này bám sát hình thức Hê-bơ-rơ; chú thích làm rõ nghĩa cụ thể.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: người tạm trú ở với thầy tế lễ
  rationale: Cụm từ chỉ một người cư trú hoặc lệ thuộc gắn với nhà của thầy tế lễ nhưng không phải thành viên gia đình có quyền ăn phần thánh. “Ở với” diễn đạt mối liên hệ hộ gia đình mà không quyết đoán rằng người ấy nhất thiết là ngoại kiều.
- source_word: שָׂכִיר
  choice: người làm thuê
  rationale: Từ này chỉ người lao động nhận công, phân biệt với người thuộc gia đình thầy tế lễ. “Người làm thuê” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: לֹא יֹאכַל
  choice: không được ăn
  rationale: Thể chưa hoàn thành đi với phủ định trong luật lệ diễn tả điều cấm. “Không được ăn” truyền đạt rõ sự cấm đoán bằng tiếng Việt tự nhiên.
- source_word: וְכָל
  choice: không một ... nào
  rationale: Khi đi với mệnh đề phủ định, cấu trúc này được diễn đạt tự nhiên trong tiếng Việt là “không một người ngoài nào”, thay vì dịch máy móc là “và mọi người ngoài không”.
theological_decisions:
- issue: Phạm vi của זָר
  choice: Không hiểu từ này mặc nhiên là người ngoại quốc, nhưng là người ngoài nhóm được phép ăn vật thánh.
  alternative: Dịch là “người ngoại quốc” hoặc “người thường”.
  rationale: Ngữ cảnh luật về phần thánh nhấn mạnh tư cách được phép trong gia đình tư tế, không chủ yếu nói đến nguồn gốc dân tộc. “Người ngoài” giữ được phạm vi rộng và không áp đặt một cách hiểu hệ phái.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “thầy tế lễ” để chỉ כֹּהֵן, “vật thánh” để giữ sắc thái chuyên biệt của văn bản tư tế, và tách thành hai câu nhằm giúp người đọc phổ thông nhận rõ hai nhóm bị cấm.
