source:
  edition: WLC
  text: לִֽ/רְצֹנְ/כֶ֑ם תָּמִ֣ים זָכָ֔ר בַּ/בָּקָ֕ר בַּ/כְּשָׂבִ֖ים וּ/בָֽ/עִזִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/019.yaml
  text: for your acceptance, it must be a sound male from the cattle, the sheep, or the goats.
translation:
  language: vi
  text: Để được chấp nhận, lễ vật phải là con đực lành lặn, lấy từ bò, cừu hoặc dê.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: Để được chấp nhận
  rationale: Diễn đạt tự nhiên ý nghĩa mục đích của לְ cùng danh từ רָצוֹן trong ngữ cảnh lễ vật được tiếp nhận, đồng thời không xác định rõ tác nhân hơn nguyên văn.
- source_word: תָּמִים
  choice: lành lặn
  rationale: Chỉ tình trạng toàn vẹn, không có khuyết tật khiến con vật không thích hợp làm lễ vật; tránh cách hiểu chủ yếu mang nghĩa đạo đức của “hoàn hảo”.
- source_word: זָכָר
  choice: con đực
  rationale: Phản ánh trực tiếp yêu cầu về giới tính của con vật.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: lấy từ bò, cừu hoặc dê
  rationale: Giữ đủ ba nhóm gia súc được liệt kê; “lấy từ” chuyển tự nhiên cấu trúc giới từ בְּ chỉ nhóm mà lễ vật thuộc về.
theological_decisions:
- issue: Ý nghĩa của לִרְצֹנְכֶם
  choice: Để được chấp nhận
  alternative: theo ý nguyện của anh em
  rationale: Trong luật dâng lễ, cụm này hợp lý nhất là chỉ mục đích lễ vật được chấp nhận; tuy vậy, bản dịch tránh thêm rõ “được Đức Chúa Trời chấp nhận” vì tác nhân không được nêu trong câu.
- issue: Sắc thái của תָּמִים
  choice: lành lặn
  alternative: không tì vết
  rationale: “Lành lặn” giữ trọng tâm ở tình trạng thể chất nguyên vẹn của con vật và không đưa thêm sắc thái thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Thêm “lễ vật” để làm rõ chủ thể được tiếp nối từ câu trước; đây là bổ sung ngữ cảnh cần thiết trong tiếng Việt, không làm thay đổi nội dung.
