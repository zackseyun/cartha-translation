  variant: modern standard Vietnamese
source:
  edition: WLC
  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: vi
  text: Người nào chạm vào điều ấy sẽ bị ô uế cho đến chiều tối và không được ăn bất cứ vật thánh nào[a], trừ khi đã tắm rửa thân thể bằng nước[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thánh” hoặc “những vật đã được biệt riêng làm thánh.”
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “rửa thịt mình trong nước.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: người nào
  rationale: Trong văn luật, từ này chỉ một cá nhân, không phải phần linh hồn phi vật chất. “Người nào” tự nhiên trong tiếng Việt và giữ sắc thái quy định áp dụng cho từng người.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: chạm vào vật ấy
  rationale: Động từ giống cái phù hợp với danh từ נֶפֶשׁ về mặt ngữ pháp, không xác định giới tính sinh học. Đại từ chỉ về nguồn gây ô uế trong ngữ cảnh trước; “vật ấy” tránh mặc nhiên coi đối tượng là một người nam.
- source_word: וְטָמְאָה
  choice: sẽ bị ô uế
  rationale: Cụm từ nói đến tình trạng ô uế theo nghi lễ phát sinh sau khi tiếp xúc. Cách dịch này phù hợp văn phong luật định mà không hàm ý tội lỗi đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt về thời hạn của tình trạng ô uế theo nghi lễ.
- source_word: וְלֹא יֹאכַל
  choice: không được ăn
  rationale: Thể vị lai chưa hoàn thành trong ngữ cảnh luật pháp mang lực cấm đoán; “không được” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: מִן הַקֳּדָשִׁים
  choice: bất cứ vật thánh nào
  rationale: Danh từ số nhiều chỉ những vật hoặc lễ phẩm đã được biệt riêng làm thánh; “bất cứ… nào” truyền đạt lực phân cách của מִן trong câu phủ định.
- source_word: כִּי אִם
  choice: trừ khi
  rationale: Thành ngữ này đưa ra điều kiện phải được đáp ứng trước khi người ấy có thể ăn; “trừ khi” ngắn gọn và tự nhiên.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: đã tắm rửa thân thể bằng nước
  rationale: בָּשָׂר nghĩa đen là “thịt”, nhưng trong ngữ cảnh này chỉ toàn thân. “Tắm rửa thân thể bằng nước” diễn đạt rõ hành động thanh tẩy cụ thể mà không gây hiểu lầm.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: ô uế theo nghi lễ
  alternative: ô uế về đạo đức
  rationale: Câu này nói về tư cách ăn vật thánh sau khi tiếp xúc với nguồn gây ô uế và tắm rửa. Bản dịch giữ ngôn ngữ “ô uế” theo nghi lễ, không thêm ý phạm tội hay nhơ bẩn đạo đức vốn không được nêu trong nguyên văn.
translation_notes:
  register: Văn phong luật định, trang trọng nhưng dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “người nào” để không quy định giới tính; “vật ấy” giữ tham chiếu mở theo ngữ cảnh trước. Các dấu chú thích được đặt ngay sau cụm từ tương ứng.
