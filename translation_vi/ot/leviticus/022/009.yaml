revisions:
- from: Họ phải tuân giữ điều Ta đã giao phó[a], để khỏi vì điều ấy mà mang tội và chết vì điều ấy khi xúc phạm sự thánh của nó[b][c]. Ta là Yahweh, Đấng thánh hóa họ[d].
  to: Họ phải tuân giữ phận sự Ta giao[a], để họ không mang tội vì điều ấy và chết vì điều ấy[b] khi họ làm ô uế nó[c]. Ta là Yahweh, Đấng thánh hóa họ[d].
  rationale: Sửa động từ chỉ sự xúc phạm điều thánh thành “làm ô uế nó” để bám sát cấu trúc và trường nghĩa của חילל, mà vẫn giữ sự mơ hồ có chủ ý về đối tượng của đại từ. Bổ sung chú thích cho “chết vì điều ấy” và sắp xếp lại các dấu neo theo các điểm từ vựng chính. Không thay đổi ý nghĩa của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:37Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp nhìn chung phản ánh đúng mệnh lệnh tuân giữ, thành ngữ “mang tội,” hậu quả chết, và lời tự xưng của Yahweh. Tuy nhiên, “xúc phạm sự thánh của nó” không dịch trực tiếp động từ חילל với tân ngữ số ít và thêm khái niệm “sự thánh” như một danh từ trừu tượng. “Làm ô uế nó” giữ trực tiếp tân ngữ, phù hợp ngữ cảnh điều thánh, đồng thời vẫn không xác định quá mức quy chiếu của đại từ.
  naturalness: “Xúc phạm sự thánh của nó” gượng và dễ gây khó hiểu trong tiếng Việt hiện đại. Cấu trúc “khi họ làm ô uế nó” tự nhiên, trang trọng, và duy trì chủ ngữ số nhiều vốn có trong động từ Hê-bơ-rơ.
  terminology: Giữ “Yahweh” và “Đấng thánh hóa họ” là thích hợp. “Phận sự Ta giao” diễn đạt tốt מִשְׁמַרְתִּי trong bối cảnh trách nhiệm tư tế được giao. Các chú thích được sắp lại để bao gồm rõ phương án cho “chết vì điều ấy,” vốn có trong hồ sơ kiểm tra tiếng Anh nhưng đang thiếu trong bản nháp.
  issues:
  - severity: medium
    issue: Cụm “xúc phạm sự thánh của nó” không chuyển tải trực tiếp יְחַלְּלוּהוּ.
    rationale: Động từ חילל có tân ngữ là “nó” và nghĩa là làm ô uế, làm phàm, hoặc đối xử như thông thường với điều thánh. Bản nháp thay tân ngữ ấy bằng “sự thánh của nó,” vừa kém tự nhiên vừa làm đổi cấu trúc ngữ nghĩa.
  - severity: medium
    issue: Thiếu chú thích phương án dịch cho “chết vì điều ấy.”
    rationale: Hồ sơ tiếng Anh có chú thích riêng cho וּמֵתוּ בוֹ. Bản tiếng Việt nên phản ánh phương án “chết bởi/do điều ấy” để bảo đảm dấu neo và hồ sơ từ vựng đầy đủ.
