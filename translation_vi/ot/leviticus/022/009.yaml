id: LEV.22.9
reference: Leviticus 22:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: vi
  text: Họ phải tuân giữ phận sự Ta giao[a], để họ không mang tội vì điều ấy và chết vì điều ấy[b] khi họ làm ô uế nó[c]. Ta là Yahweh, Đấng thánh hóa họ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trách nhiệm Ta giao” hoặc “mệnh lệnh của Ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chết bởi điều ấy” hoặc “chết do điều ấy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “làm cho nó thành phàm” hoặc “coi nó như vật thông thường.” Các đại từ “điều ấy/nó” có thể chỉ phận sự vừa được nhắc đến hoặc điều thánh trong văn cảnh; nguyên văn không nêu lại danh từ.'
    reason: lexical_alternative; ambiguity
  - marker: d
    text: 'Cũng có thể dịch: “Đấng làm cho họ nên thánh” hoặc “Đấng biệt riêng họ làm thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: phải tuân giữ
  rationale: Trong chỉ thị pháp luật và nghi lễ, động từ này diễn tả việc nghiêm túc gìn giữ, tuân thủ; “phải tuân giữ” tự nhiên trong tiếng Việt và giữ rõ sắc thái nghĩa vụ.
- source_word: מִשְׁמַרְתִּי
  choice: điều Ta đã giao phó
  rationale: Danh từ chỉ phận sự hay trách nhiệm được trao để gìn giữ. Cách dịch này thể hiện cả nội dung phải tuân giữ lẫn sắc thái được giao trách nhiệm.
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: vì điều ấy mà mang tội
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ “mang tội”, đồng thời dùng “vì điều ấy” để diễn đạt quan hệ do עָלָיו mà không xác định quá mức đối tượng của đại từ.
- source_word: וּמֵתוּ בוֹ
  choice: và chết vì điều ấy
  rationale: Giới từ ב ở đây biểu thị cái dẫn đến hậu quả chết; “vì điều ấy” rõ và tự nhiên hơn “bởi nó” trong tiếng Việt.
- source_word: יְחַלְּלֻהוּ
  choice: xúc phạm sự thánh của nó
  rationale: חלל trong ngữ cảnh thánh khiết đối lập điều thánh với điều thông thường. Cách dịch này truyền đạt ý làm ô uế hoặc coi thường tính thánh mà không phải ép đại từ thành một danh từ cụ thể.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: מְקַדְּשָׁם
  choice: Đấng thánh hóa họ
  rationale: Phân từ diễn tả Yahweh là Đấng biệt riêng họ làm thánh; “thánh hóa” giữ được từ vựng chủ đạo về sự thánh khiết trong sách Lê-vi.
theological_decisions:
- issue: Đối tượng của các đại từ số ít trong עָלָיו, בּוֹ và יְחַלְּלֻהוּ
  choice: Dùng “điều ấy/nó”, không xác định rõ hơn đối tượng.
  alternative: Xác định các đại từ là chỉ thức ăn thánh, các vật thánh, hoặc chính phận sự Yahweh giao.
  rationale: Nguyên văn dùng các đại từ số ít mà không lặp lại danh từ. Ngữ cảnh nói đến vật thánh, còn câu này nhắc đến phận sự được giao; vì vậy bản dịch bảo tồn sự không xác định thay vì âm thầm giải quyết nó.
- issue: Sắc thái của מְקַדְּשָׁם
  choice: Đấng thánh hóa họ
  alternative: Đấng làm cho họ nên thánh; Đấng biệt riêng họ
  rationale: “Thánh hóa” vừa giữ quan hệ từ vựng với chủ đề thánh khiết, vừa không quyết định riêng rằng hành động chỉ nói đến địa vị, nghi lễ hay sự biến đổi đạo đức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ thần linh “Ta” được viết hoa; danh Yahweh được giữ nguyên. Tránh cách nói quá cổ, đồng thời duy trì trường từ vựng về sự thánh khiết của sách Lê-vi.
