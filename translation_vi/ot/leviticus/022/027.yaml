id: LEV.22.27
reference: Leviticus 22:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: vi
  text: Khi một con bò, một con chiên hay một con dê được sinh ra, nó phải ở với mẹ nó bảy ngày. Từ ngày thứ tám trở đi, nó sẽ được chấp nhận làm lễ vật dâng bằng lửa[a] cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lễ vật thực phẩm dâng cho Yahweh.” Từ Hê-bơ-rơ chỉ một lễ vật được dâng bằng lửa.'
    reason: Giữ lại cách hiểu từ vựng khác của אִשֶּׁה, một thuật ngữ tế lễ có cách giải thích không hoàn toàn thống nhất.
lexical_decisions:
- source_word: שׁוֹר
  choice: con bò
  rationale: Danh từ này chỉ gia súc thuộc loài bò; cách dịch khái quát này không giới hạn giới tính hay công dụng của con vật.
- source_word: כֶשֶׂב
  choice: con chiên
  rationale: Trong danh sách các loài vật đủ điều kiện dâng tế lễ, từ này chỉ loài chiên nói chung, không nhất thiết là chiên con.
- source_word: עֵז
  choice: con dê
  rationale: Ở đây từ này được dùng như tên loài, nên không cần xác định giới tính.
- source_word: כִּי יִוָּלֵד
  choice: khi ... được sinh ra
  rationale: Trong điều luật nêu trường hợp, כִּי mang nghĩa tự nhiên là “khi”; thể Niphal của ילד diễn tả việc được sinh ra.
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: nó phải ở dưới mẹ nó bảy ngày
  rationale: Giữ hình ảnh cụ thể “dưới mẹ” của nguyên văn, đồng thời dùng “phải ở” để diễn đạt yêu cầu pháp luật một cách tự nhiên.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: Từ ngày thứ tám trở đi
  rationale: Diễn đạt rõ thời điểm bắt đầu đủ điều kiện.
- source_word: יֵרָצֶה
  choice: sẽ được chấp nhận
  rationale: Thể Niphal ở đây nói đến việc con vật được chấp nhận cho mục đích tế lễ.
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: làm lễ vật hỏa tế
  rationale: קָרְבָּן là lễ vật được đem dâng; אִשֶּׁה là thuật ngữ tế lễ liên quan đến lửa. “Lễ vật hỏa tế” ngắn gọn và giữ được nét nghĩa này.
- source_word: לַיהוָה
  choice: dâng lên Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước יהוה và diễn đạt hướng dâng của giới từ לְ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; ĐỨC CHÚA
  rationale: Dùng dạng danh riêng quen thuộc, trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu; không làm mất việc nguyên văn trực tiếp dùng danh giao ước.
- issue: Ý nghĩa của אִשֶּׁה
  choice: lễ vật hỏa tế
  alternative: lễ vật làm thức ăn; lễ vật dâng bằng lửa
  rationale: Nguồn gốc và sắc thái chính xác của thuật ngữ này có tranh luận. Bản dịch chính giữ mối liên hệ rõ với lửa mà không khẳng định cách giải thích “thức ăn”; chú thích bảo tồn phương án khác.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, câu chữ dễ hiểu. “Con chiên” phù hợp ngôn ngữ Kinh Thánh tiếng Việt mà vẫn thông dụng. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
