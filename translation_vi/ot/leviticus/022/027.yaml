revisions:
- from: Khi một con bò, một con chiên hay một con dê được sinh ra, nó phải ở dưới mẹ nó bảy ngày. Từ ngày thứ tám trở đi, nó sẽ được chấp nhận làm lễ vật hỏa tế dâng lên Đức Giê-hô-va.[a]
  to: Khi một con bò, một con chiên hay một con dê được sinh ra, nó phải ở với mẹ nó bảy ngày. Từ ngày thứ tám trở đi, nó sẽ được chấp nhận làm lễ vật dâng bằng lửa[a] cho Yahweh.
  rationale: Sửa thành ngữ chỉ thời gian con non ở với mẹ theo tiếng Việt tự nhiên và nghĩa ngữ cảnh; dùng “Yahweh” theo quyết định danh riêng của nguồn; diễn đạt אִשֶּׁה là “lễ vật dâng bằng lửa” và neo chú thích trực tiếp vào thuật ngữ này. Không thay đổi phạm vi pháp lý hay ý nghĩa tế lễ của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:45Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng ba loài vật, thời hạn bảy ngày với mẹ, và việc được chấp nhận kể từ ngày thứ tám. Tuy nhiên, “ở dưới mẹ nó” là lối dịch sát chữ nhưng không đúng cách nói tự nhiên của tiếng Việt cho thành ngữ תַּחַת אִמּוֹ trong ngữ cảnh con non ở với/bú mẹ. Danh יהוה nên được chuyển là “Yahweh” phù hợp với quyết định nguồn và tránh thay bằng dạng phiên âm thuộc truyền thống khác.
  naturalness: Câu văn nhìn chung rõ ràng và đúng văn phong luật lệ. “Ở với mẹ nó” tự nhiên, chính xác hơn “ở dưới mẹ nó”; “lễ vật dâng bằng lửa” là cách diễn đạt hiện đại, dễ hiểu cho thuật ngữ tế lễ.
  terminology: “Con bò, con chiên, con dê” phù hợp với các tên loài trong ngữ cảnh luật tế lễ. “Lễ vật dâng bằng lửa” chuyển tải אִשֶּׁה mà không áp đặt cách hiểu gây tranh luận là “lễ vật thực phẩm”. Chú thích giữ phương án đó như một khả năng từ vựng. Di chuyển ký hiệu chú thích đến ngay sau thuật ngữ được giải thích.
  issues:
  - severity: medium
    issue: “ở dưới mẹ nó” dịch quá sát chữ và không tự nhiên
    rationale: תַּחַת אִמּוֹ theo ngữ cảnh chỉ việc con non ở với, lệ thuộc và được mẹ nuôi trong bảy ngày đầu; tiếng Việt “ở với mẹ nó” truyền đạt đúng nghĩa ngữ cảnh mà không tạo hình ảnh không phù hợp.
  - severity: medium
    issue: Danh יהוה được dịch là “Đức Giê-hô-va” thay vì “Yahweh”
    rationale: Nguồn và audit trail xác định lựa chọn là “Yahweh”. “Giê-hô-va” là dạng đọc truyền thống khác, không phản ánh lựa chọn danh riêng đã nêu cho dự án.
  - severity: low
    issue: Ký hiệu chú thích không đặt ngay sau “lễ vật hỏa tế”
    rationale: Chú thích giải thích אִשֶּׁה, tương ứng với “hỏa tế”, nên cần đặt tại cụm đó thay vì cuối câu sau danh Yahweh.
