revisions:
- from: Khi một người nam dâng lên Yahweh sinh tế cầu an, hoặc để thực hiện một lời khấn, hoặc làm lễ vật tự nguyện, lấy từ bò hay chiên dê, thì con vật phải toàn vẹn để được chấp nhận; không được có bất cứ khuyết tật nào nơi nó.
  to: Nếu một người đàn ông dâng lên Yahweh một sinh tế cầu an để thực hiện một lời khấn hoặc làm lễ vật tự nguyện, bằng một con vật trong đàn bò hoặc đàn chiên dê, thì con vật ấy phải toàn vẹn để được chấp nhận; không được có bất cứ khuyết tật nào nơi nó.
  rationale: Bản sửa làm rõ rằng việc thực hiện lời khấn hoặc dâng tự nguyện là hai trường hợp của sinh tế cầu an, giữ nguyên danh Yahweh và các thuật ngữ tế lễ, đồng thời dùng cú pháp tiếng Việt hiện đại, rõ ràng hơn. Không cần chú thích vì không có chú thích nào trong bản tiếng Việt cần neo hoặc giải thích để bảo toàn nghĩa câu.
  reviewer_model: gpt-5.6-terra
