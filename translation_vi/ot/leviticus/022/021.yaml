id: LEV.22.21
reference: Leviticus 22:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: vi
  text: Nếu một người đàn ông dâng lên Yahweh một sinh tế cầu an để thực hiện một lời khấn hoặc làm lễ vật tự nguyện, bằng một con vật trong đàn bò hoặc đàn chiên dê, thì con vật ấy phải toàn vẹn để được chấp nhận; không được có bất cứ khuyết tật nào nơi nó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Khi một người nam
  rationale: Công thức luật lệ nêu một trường hợp; אִישׁ được giữ rõ là danh từ giống đực số ít, còn כִּי được diễn đạt tự nhiên bằng “khi” trong quy định có tính điều kiện.
- source_word: יַקְרִיב
  choice: dâng lên
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ chỉ việc đem đến và dâng một lễ vật; “dâng lên” tự nhiên và giữ sắc thái thờ phượng.
- source_word: זֶבַח שְׁלָמִים
  choice: sinh tế cầu an
  rationale: “Sinh tế” thể hiện זֶבַח là vật/sinh lễ hiến tế, còn “cầu an” là cách gọi tiếng Việt trang trọng, tương đối sát loại lễ שְׁלָמִים mà không diễn giải riêng thành sự thông công.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng “Yahweh” thay vì thay bằng một tước hiệu.
- source_word: לְפַלֵּא נֶדֶר
  choice: để thực hiện một lời khấn
  rationale: Trong luật tế lễ, cụm này nói đến việc thi hành điều đã khấn; “thực hiện” giữ được sắc thái hành động mà không hàm ý quá mức rằng mọi nghĩa vụ đã hoàn tất.
- source_word: אוֹ לִנְדָבָה
  choice: hoặc làm lễ vật tự nguyện
  rationale: נְדָבָה là lễ vật được tự nguyện dâng, đối lập với lễ dâng theo lời khấn.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: lấy từ bò hay chiên dê
  rationale: בקר chỉ đại gia súc thuộc đàn bò; צאן bao gồm đàn gia súc nhỏ, tức chiên và dê. Cách dịch nêu rõ các loài mà tiếng Việt không thể gói tự nhiên trong một từ tương đương.
- source_word: תָּמִים
  choice: toàn vẹn
  rationale: Trong luật hiến tế, từ này đòi hỏi con vật nguyên vẹn, không có tì vết thể chất; “toàn vẹn” phù hợp với mệnh đề giải thích tiếp theo.
- source_word: לְרָצוֹן
  choice: để được chấp nhận
  rationale: Cụm từ chỉ điều kiện để lễ vật được tiếp nhận với sự ưng thuận; bản dịch giữ chủ thể tiếp nhận ngầm như trong tiếng Hê-bơ-rơ.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: không được có bất cứ khuyết tật nào nơi nó
  rationale: מוּם là khuyết tật thể chất khiến con vật không đủ tiêu chuẩn; cấu trúc tiếng Việt diễn đạt rõ yêu cầu pháp định.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA hoặc Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn chức năng danh riêng và không thay nó bằng tước hiệu.
- issue: Chủ thể giống đực אִישׁ
  choice: một người nam
  alternative: một người hoặc bất cứ ai
  rationale: Nguyên văn là danh từ giống đực số ít trong công thức luật lệ. Bản dịch giữ hình thức ấy, không tự động trung hòa giới tính.
- issue: Ý nghĩa của שְׁלָמִים
  choice: sinh tế cầu an
  alternative: sinh tế thông công
  rationale: Từ này có liên hệ từ nguyên với trường nghĩa toàn vẹn/bình an nhưng tên gọi chính xác của loại lễ vẫn có mức độ bất định. “Cầu an” giữ cách gọi tế lễ quen thuộc hơn và tránh quyết định rằng mục đích cốt yếu nhất là “thông công”.
translation_notes:
  register: Văn phong luật tế lễ trang trọng nhưng hiện đại. Dùng “chiên dê” để thể hiện chính xác phạm vi của צאן, “con vật” để làm rõ chủ thể ngữ pháp trong tiếng Việt, và giữ sự lặp ý giữa “toàn vẹn” với “không có khuyết tật” vì chính nguyên văn nhấn mạnh như vậy.
