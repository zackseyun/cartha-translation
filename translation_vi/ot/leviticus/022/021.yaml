review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: chủ thể nam số ít, việc dâng sinh tế cầu an cho Yahweh, lời khấn/lễ tự nguyện, đàn bò hay đàn chiên dê, và đòi hỏi không khuyết tật. Tuy nhiên, dấu phẩy và từ “hoặc” sau “sinh tế cầu an” khiến tiếng Việt có thể hiểu lời khấn và lễ tự nguyện là những phương án thay thế cho chính sinh tế cầu an, thay vì là hai mục đích/căn cứ của sinh tế ấy. Cần gắn hai vế này trực tiếp với động từ “dâng”.'
  naturalness: “Khi một người nam” hơi gượng trong tiếng Việt hiện đại; “Nếu một người đàn ông” vừa tự nhiên vừa giữ giới tính ngữ pháp của אִישׁ. “Bằng một con vật trong đàn bò hoặc đàn chiên dê” liên kết tự nhiên hơn với sinh tế được dâng, đồng thời làm rõ tham chiếu của các mệnh đề sau.
  terminology: Giữ “Yahweh”, “sinh tế cầu an”, “lời khấn”, “lễ vật tự nguyện”, “toàn vẹn”, và “khuyết tật” là phù hợp với nguyên ngữ và văn phong luật tế lễ. “Sinh tế cầu an” bảo tồn tên loại lễ mà không áp đặt cách diễn giải “thông công”.
  issues:
  - severity: medium
    issue: Quan hệ cú pháp của “hoặc để thực hiện một lời khấn, hoặc làm lễ vật tự nguyện” chưa rõ.
    rationale: Trong tiếng Việt, cách ngắt bằng dấu phẩy sau “sinh tế cầu an” có thể làm các vế với “hoặc” được đọc như các loại lễ thay thế. Nguyên văn xác định sinh tế cầu an được dâng nhằm thực hiện lời khấn hoặc như một lễ tự nguyện; cần đặt “để” ngay sau cụm chỉ lễ và không tách thành lựa chọn độc lập.
  - severity: low
    issue: “Khi một người nam” kém tự nhiên trong văn phong hiện đại.
    rationale: Dù giữ giống đực là đúng, “Nếu một người đàn ông” diễn đạt điều kiện pháp lý của כִּי tự nhiên hơn và vẫn không trung hòa chủ thể nam.
  revised_text: Nếu một người đàn ông dâng lên Yahweh một sinh tế cầu an để thực hiện một lời khấn hoặc làm lễ vật tự nguyện, bằng một con vật trong đàn bò hoặc đàn chiên dê, thì con vật ấy phải toàn vẹn để được chấp nhận; không được có bất cứ khuyết tật nào nơi nó.
