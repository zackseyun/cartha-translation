id: LEV.22.22
reference: Leviticus 22:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: vi
  text: Con vật nào bị mù, gãy xương, bị cắt xẻo, có mụn cóc, ghẻ lở hoặc bệnh ngoài da, thì các ngươi không được dâng lên Đức Yahweh; cũng không được đặt bất cứ con nào như thế trên bàn thờ làm lễ vật dâng bằng lửa[a] cho Đức Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật làm thức ăn.”'
    reason: Thuật ngữ Hê-bơ-rơ אִשֶּׁה có thể được hiểu là lễ vật dâng bằng lửa hoặc lễ vật làm thức ăn.
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: bị mù
  rationale: Chỉ khuyết tật mù ở con vật; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: שָׁבוּר
  choice: gãy xương
  rationale: Dạng bị động chỉ tình trạng có phần thân thể hoặc chi bị gãy; thêm “xương” giúp tránh nghĩa quá rộng của “bị gãy”.
- source_word: חָרוּץ
  choice: bị cắt xẻo
  rationale: Từ này chỉ khuyết tật do bị cắt hoặc rạch; “cắt xẻo” truyền đạt tình trạng thân thể bị tổn hại mà không xác định quá mức bộ phận nào.
- source_word: יַבֶּלֶת
  choice: mụn cóc
  rationale: Tương đương phổ thông, dễ hiểu cho một u nhỏ bất thường trên da.
- source_word: גָרָב
  choice: ghẻ
  rationale: Chỉ một chứng bệnh ngoài da có biểu hiện đóng vảy hoặc ngứa; “ghẻ” là cách gọi tự nhiên trong tiếng Việt, dù căn bệnh chính xác không chắc chắn.
- source_word: יַלֶּפֶת
  choice: bệnh ngoài da
  rationale: Căn bệnh cụ thể không xác định chắc chắn; cách dịch khái quát này tránh tạo độ chính xác giả.
- source_word: תַקְרִיבוּ
  choice: dâng lên
  rationale: Trong văn cảnh tế lễ, Hiphil của קרב chỉ việc đem đến và trình dâng một lễ vật.
- source_word: אֵלֶּה
  choice: các ... như thế
  rationale: Đại từ chỉ định quy chiếu về những con vật mang các khuyết tật vừa kể; chuyển thành cấu trúc tiếng Việt tự nhiên nhưng vẫn giữ rõ đối tượng.
- source_word: אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Thuật ngữ tế lễ này gắn với lễ vật được dâng trên lửa; cách dịch rõ nghĩa hơn “hỏa tế”, đồng thời chú thích giữ lại cách hiểu “lễ vật làm thức ăn”.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: đặt bất cứ con nào như thế trên bàn thờ
  rationale: Giữ hành động cụ thể và sắc thái phân phối của מֵהֶם, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: לַיהוָה
  choice: cho Đức Giê-hô-va / lên Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn; giới từ được chuyển linh hoạt theo động từ tiếng Việt.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ danh giao ước dưới dạng phiên âm quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu; không làm thay đổi chức năng danh riêng trong câu.
- issue: Cách hiểu אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật làm thức ăn
  rationale: Từ ngữ tế lễ này có thể nhấn mạnh lễ vật được dâng bằng lửa hoặc lễ vật được xem như thức ăn. Bản văn chính dùng cách diễn đạt trực tiếp về phương thức dâng, còn chú thích bảo tồn cách hiểu kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh ngôi thứ hai số nhiều trong lời luật định; tránh thuật ngữ chuyên môn khó hiểu như “hỏa tế”. Danh sách khuyết tật được diễn đạt cụ thể nhưng không cố xác định chính xác những bệnh da còn bất định.
