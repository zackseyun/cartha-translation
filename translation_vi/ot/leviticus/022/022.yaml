revisions:
- from: Con vật nào bị mù, gãy xương, bị cắt xẻo, có mụn cóc, ghẻ hoặc bệnh ngoài da, thì các ngươi không được dâng lên Đức Giê-hô-va; cũng không được đặt bất cứ con nào như thế trên bàn thờ làm lễ vật dâng bằng lửa[a] cho Đức Giê-hô-va.
  to: Con vật nào bị mù, gãy xương, bị cắt xẻo, có mụn cóc, ghẻ lở hoặc bệnh ngoài da, thì các ngươi không được dâng lên Đức Yahweh; cũng không được đặt bất cứ con nào như thế trên bàn thờ làm lễ vật dâng bằng lửa[a] cho Đức Yahweh.
  rationale: Đổi dạng danh riêng יהוה để phù hợp quyết định POB hiện hành. Điều chỉnh “ghẻ” thành “ghẻ lở” nhằm không gán cho גָרָב một chẩn đoán da liễu quá chính xác. Các thành tố khác, thứ tự danh sách, hai mệnh lệnh phủ định và chú thích cho אִשֶּׁה được giữ nguyên về nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:42Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc cấm dâng các con vật có khuyết tật và cấm đặt chúng trên bàn thờ. Tuy nhiên, “Đức Giê-hô-va” không nhất quán với quyết định danh יהוה trong hồ sơ POB, vốn dùng “Yahweh”. “Ghẻ” có thể bị hiểu quá cụ thể là bệnh ghẻ/scabies, trong khi גָרָב chỉ một chứng tổn thương da, và từ quy chiếu chính xác còn bất định.
  naturalness: Câu văn trang trọng, rõ ràng và phù hợp văn phong luật lệ. “Lễ vật dâng bằng lửa” tự nhiên hơn thuật ngữ cổ “hỏa tế”; “ghẻ lở” bao quát và tự nhiên hơn “ghẻ” trong danh sách các tình trạng da.
  terminology: Dùng “Đức Yahweh” để giữ danh riêng יהוה theo hồ sơ POB. Giữ “lễ vật dâng bằng lửa” cho אִשֶּׁה và bảo tồn cách hiểu thay thế trong chú thích. “Ghẻ lở” tránh đồng nhất גָרָב với một chẩn đoán hiện đại cụ thể.
  issues:
  - severity: medium
    issue: Danh יהוה được dịch là “Đức Giê-hô-va”.
    rationale: Hồ sơ quyết định thần học của POB cho chính câu này quy định Yahweh. Nên dùng dạng “Đức Yahweh” để vừa giữ danh riêng vừa phù hợp lối xưng hô trang trọng tiếng Việt.
  - severity: low
    issue: “Ghẻ” có thể định danh quá cụ thể גָרָב.
    rationale: Từ Hê-bơ-rơ chỉ một bệnh/tổn thương da; “ghẻ lở” chuyển được ý bệnh da thấy rõ mà không khẳng định đó là scabies.
  revised_text: Con vật nào bị mù, gãy xương, bị cắt xẻo, có mụn cóc, ghẻ lở hoặc bệnh ngoài da, thì các ngươi không được dâng lên Đức Yahweh; cũng không được đặt bất cứ con nào như thế trên bàn thờ làm lễ vật dâng bằng lửa[a] cho Đức Yahweh.
