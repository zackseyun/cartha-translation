source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: vi
  text: Ngay trong ngày này, các ngươi không được làm bất cứ công việc nào, vì đó là Ngày Chuộc Tội[a], để làm lễ chuộc tội cho các ngươi trước mặt Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hê-bơ-rơ: “một ngày của những sự chuộc tội”; danh từ “chuộc tội” ở số nhiều.'
    reason: Bảo tồn sắc thái số nhiều của כִּפֻּרִים trong nguyên văn, trong khi bản văn chính dùng tên ngày lễ tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ
  choice: các ngươi không được làm bất cứ công việc nào
  rationale: מְלָאכָה chỉ công việc hay lao động, đặc biệt trong các lệnh cấm ngày nghỉ và lễ hội. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ trọn tính bắt buộc của luật.
- source_word: בְּ/עֶצֶם הַ/יּ֣וֹם הַ/זֶּ֑ה
  choice: Trong chính ngày này
  rationale: Thành ngữ Hê-bơ-rơ nhấn mạnh đúng ngày đang được nói đến; “chính ngày này” chuyển tải sắc thái nhấn mạnh ấy một cách tự nhiên.
- source_word: כִּ֣י
  choice: vì
  rationale: כִּי dẫn vào lý do của lệnh cấm, nên “vì” diễn đạt rõ quan hệ giải thích.
- source_word: י֤וֹם כִּפֻּרִים֙
  choice: Ngày Chuộc Tội
  rationale: Cụm từ nguyên văn là “ngày của những sự chuộc tội,” nhưng “Ngày Chuộc Tội” là tên lễ rõ ràng, tự nhiên và đã quen dùng trong tiếng Việt; dạng số nhiều được ghi lại ở chú thích.
- source_word: לְ/כַפֵּ֣ר
  choice: để thực hiện việc chuộc tội
  rationale: Động từ כפר ở thể Piel trong bối cảnh tế lễ chỉ hành động tiến hành nghi thức chuộc tội. Cách dịch này giữ sắc thái nghi lễ mà không áp đặt một lý thuyết thần học hẹp hơn.
- source_word: עֲלֵי/כֶ֔ם
  choice: cho các ngươi
  rationale: Đi với כפר, עַל đánh dấu những người được hưởng việc chuộc tội; “cho các ngươi” là cách nói rõ và tự nhiên.
- source_word: לִ/פְנֵ֖י
  choice: trước mặt
  rationale: Giới từ này chỉ sự hiện diện trước Yahweh trong bối cảnh thờ phượng; “trước mặt” bảo toàn hình ảnh và nghĩa quan hệ.
- source_word: יְהוָ֥ה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tứ Tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵי/כֶֽם
  choice: Đức Chúa Trời của các ngươi
  rationale: Trong công thức giao ước với YHWH, אֱלֹהִים kèm hậu tố ngôi thứ hai số nhiều có nghĩa số ít; cách dịch này giữ quan hệ giao ước và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch danh YHWH (יְהוָה)
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay bằng tước hiệu.
- issue: Thuật ngữ nghi lễ כפר / כִּפֻּרִים
  choice: chuộc tội / Ngày Chuộc Tội
  alternative: tẩy sạch; che phủ; Ngày của những sự chuộc tội
  rationale: Trong luật tế lễ, “chuộc tội” truyền đạt tốt chức năng nghi lễ và hòa giải mà không quyết định một mô hình thần học về cơ chế chuộc tội. Sắc thái số nhiều của כִּפֻּרִים được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng “các ngươi” để phản ánh ngôi thứ hai số nhiều trong lời phán dành cho cộng đồng. “Trong chính ngày này” giữ sự nhấn mạnh của nguyên văn; “bất cứ công việc nào” làm rõ phạm vi toàn diện của lệnh cấm.
