revisions:
- from: Các ngươi không được ăn bánh, hạt rang hay hạt mới[a] cho đến chính ngày ấy, cho đến khi các ngươi đã dâng lễ vật lên Đức Chúa Trời của mình. Đây là quy định lâu dài[b] trải qua các thế hệ của các ngươi, tại mọi nơi các ngươi cư ngụ.
  to: Các ngươi không được ăn bánh, ngũ cốc rang hay ngũ cốc mới chín[a] cho đến đúng ngày này, cho đến khi các ngươi đem lễ vật dâng lên Đức Chúa Trời của các ngươi. Đây là quy định vĩnh viễn[b] qua các thế hệ các ngươi, tại mọi nơi các ngươi cư ngụ.
  rationale: Bản sửa làm rõ ba dạng sản phẩm ngũ cốc, khôi phục chỉ định gần và sắc thái nhấn mạnh của “đúng ngày này”, đồng thời diễn đạt rõ đối tượng của lễ vật. Không thay đổi lực cấm đoán, điều kiện thời gian, hoặc tính bền vững của quy định.
