source:
  edition: WLC
  text: וְ/לֶחֶם֩ וְ/קָלִ֨י וְ/כַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה עַ֚ד הֲבִ֣יאֲ/כֶ֔ם אֶת קָרְבַּ֖ן אֱלֹהֵי/כֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: vi
  text: Các ngươi không được ăn bánh, ngũ cốc rang hay ngũ cốc mới chín[a] cho đến đúng ngày này, cho đến khi các ngươi đem lễ vật dâng lên Đức Chúa Trời của các ngươi. Đây là quy định vĩnh viễn[b] qua các thế hệ các ngươi, tại mọi nơi các ngươi cư ngụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ngũ cốc tươi” hoặc “ngũ cốc mới”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “quy định lâu dài” hoặc “quy định đời đời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: bánh
  rationale: Giữ nghĩa cụ thể là bánh làm từ ngũ cốc, phù hợp với chuỗi các dạng sản phẩm của vụ mùa trong ngữ cảnh.
- source_word: קָלִי
  choice: hạt rang
  rationale: Chỉ ngũ cốc được làm chín bằng cách rang; cách nói này tự nhiên, dễ hiểu và vẫn giữ nét nông nghiệp.
- source_word: כַרְמֶל
  choice: hạt mới
  rationale: Trong chuỗi 'bánh, hạt rang, כַרְמֶל', từ này chỉ hạt ngũ cốc mới chín hoặc còn tươi, không phải địa danh Cạt-mên. 'Hạt mới' phù hợp ngữ cảnh luật về vụ mùa; chú thích giữ phương án 'hạt tươi'.
- source_word: לֹא תֹאכְלוּ
  choice: các ngươi không được ăn
  rationale: Thể chưa hoàn thành với phủ định trong văn luật mang lực cấm đoán; 'không được ăn' rõ và tự nhiên trong tiếng Việt hiện đại.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: cho đến chính ngày ấy
  rationale: עֶצֶם nhấn mạnh ngày được nói đến. Tiếng Việt dùng 'chính ngày ấy' tự nhiên hơn cách dịch sát 'chính ngày này' trong mạch quy định lễ lịch.
- source_word: עַד הֲבִיאֲכֶם
  choice: cho đến khi các ngươi đã dâng
  rationale: Diễn đạt hành động phải hoàn tất trước khi lệnh cấm chấm dứt.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: lễ vật lên Đức Chúa Trời của mình
  rationale: קָרְבָּן là vật được đem đến/dâng lên cho Đức Chúa Trời. Thêm 'lên' làm rõ quan hệ hướng đến trong tiếng Việt, không chuyên biệt hóa loại tế lễ.
- source_word: חֻקַּת עוֹלָם
  choice: quy định lâu dài
  rationale: Giữ ý một quy định có hiệu lực bền vững trong khung giao ước và luật pháp, bằng lối nói hiện đại, không tự ý giải quyết phạm vi thần học về sau.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của các ngươi
  rationale: Thể hiện sự tiếp nối qua nhiều thế hệ.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: tại mọi nơi các ngươi cư ngụ
  rationale: Diễn đạt tự nhiên rằng luật áp dụng ở tất cả nơi dân chúng sinh sống.
theological_decisions:
- issue: Hiệu lực của חֻקַּת עוֹלָם trong luật Môi-se
  choice: quy định lâu dài
  alternative: quy định vĩnh viễn; quy định đời đời
  rationale: Bản dịch giữ lực bền vững của quy định trong khuôn khổ giao ước Lê-vi Ký nhưng không áp đặt kết luận về sự tiếp tục hay chấm dứt của luật nghi lễ trong các bối cảnh thần học về sau.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng 'các ngươi' để thể hiện lời truyền cho toàn cộng đồng số nhiều; dùng 'Đức Chúa Trời' theo văn phong Kinh Thánh tiếng Việt phổ thông. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
