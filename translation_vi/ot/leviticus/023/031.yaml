  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh phủ định bao quát của כָּל מְלָאכָה לֹא תַעֲשׂוּ, tính chất quy định lâu dài của חֻקַּת עוֹלָם, và phạm vi áp dụng qua các thế hệ, tại mọi nơi cư ngụ. Tuy nhiên, “trải qua các thế hệ của các ngươi” chưa tự nhiên trong tiếng Việt hiện đại; “qua các thế hệ các ngươi” diễn đạt cùng ý sát hơn và trôi chảy hơn.
  naturalness: “Các ngươi không được làm bất cứ công việc nào” phù hợp văn phong luật lệ trang trọng, hiện đại. Cụm “qua các thế hệ các ngươi” tự nhiên và gọn hơn “trải qua các thế hệ của các ngươi,” đồng thời không làm thay đổi ý nghĩa.
  terminology: “Quy định lâu dài” là cách chuyển ngữ thận trọng, giữ độ mở của עוֹלָם; chú thích nêu “vĩnh viễn” như một phương án từ vựng. “Nơi các ngươi cư ngụ” phù hợp với מֹשְׁבֹתֵיכֶם và tránh thu hẹp nghĩa thành chỉ các khu định cư.
