base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: vi
  text: Các ngươi không được làm bất cứ công việc nào. Đây là quy định lâu dài[a] qua các thế hệ các ngươi, tại mọi nơi các ngươi cư ngụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quy định vĩnh viễn.” Từ Hê-bơ-rơ עוֹלָם có thể chỉ một thời gian lâu dài hoặc không có điểm kết thúc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong mọi khu định cư của các ngươi” hoặc “dù các ngươi sống ở đâu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Các ngươi không được làm bất cứ công việc nào
  rationale: 'Cấu trúc phủ định với כָּל מְלָאכָה mang nghĩa bao quát: không được làm bất cứ công việc nào. “Không được” diễn đạt tự nhiên sức ràng buộc của điều luật, còn “các ngươi” giữ số nhiều của động từ.'
- source_word: חֻקַּת עוֹלָם
  choice: quy định lâu dài
  rationale: חֻקָּה chỉ một quy định có tính ràng buộc; עוֹלָם có thể chỉ thời gian lâu dài hoặc vĩnh viễn. “Lâu dài” giữ được độ mở ngữ nghĩa mà không áp đặt ý niệm tuyệt đối vượt quá từ Hê-bơ-rơ.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của các ngươi
  rationale: Diễn đạt việc quy định tiếp tục có hiệu lực qua những thế hệ kế tiếp, đồng thời giữ đại từ sở hữu số nhiều trong nguyên văn.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: tại mọi nơi các ngươi cư ngụ
  rationale: מוֹשָׁב có thể chỉ nơi ở hoặc khu định cư. Cách dịch này tự nhiên trong tiếng Việt và giữ phạm vi bao quát của בְּכֹל.
theological_decisions:
- issue: Thời hạn của luật nghi lễ trong cụm חֻקַּת עוֹלָם
  choice: quy định lâu dài
  alternative: quy định vĩnh viễn
  rationale: עוֹלָם có thể diễn tả sự lâu bền hoặc vĩnh viễn tùy ngữ cảnh. Bản dịch chính giữ sự căng thẳng ngữ nghĩa; chú thích nêu cách hiểu mạnh hơn mà không tự ý giải quyết vấn đề thần học.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “các ngươi” để giữ lời truyền phán trực tiếp ở số nhiều; tránh từ cổ như “đời đời” trong câu chính, đồng thời bảo tồn phương án “vĩnh viễn” trong chú thích.
