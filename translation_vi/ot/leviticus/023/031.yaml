  to: Các ngươi không được làm bất cứ công việc nào. Đây là quy định lâu dài[a] qua các thế hệ các ngươi, tại mọi nơi các ngươi cư ngụ[b].
  rationale: Chỉ điều chỉnh cách diễn đạt cụm chỉ sự tiếp nối qua các thế hệ để phù hợp hơn với tiếng Việt hiện đại. Bản sửa giữ nguyên lực pháp lệnh, phạm vi tuyệt đối của lệnh cấm làm việc, sắc thái thời lượng không hoàn toàn được giải quyết của עוֹלָם, và các vị trí chú thích.
  reviewer_model: gpt-5.6-terra
