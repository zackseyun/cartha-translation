id: LEV.23.41
reference: Leviticus 23:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: vi
  text: Các ngươi phải cử hành lễ ấy để tôn kính Yahweh trong bảy ngày mỗi năm. Đây là quy định lâu dài[a] qua các thế hệ các ngươi; vào tháng thứ bảy, các ngươi phải cử hành lễ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “quy định đời đời” hay “quy định vĩnh viễn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: các ngươi phải cử hành lễ
  rationale: Động từ חָגַג chỉ việc cử hành một kỳ lễ, thường là lễ hành hương. “Cử hành lễ” tự nhiên, trang trọng và giữ được sự lặp lại của động từ trong câu.
- source_word: אֹתוֹ
  choice: lễ ấy
  rationale: Đại từ chỉ về kỳ lễ đang được nói đến. Tiếng Việt cần nêu lại “lễ” để câu rõ ràng và tự nhiên.
- source_word: חַג
  choice: lễ
  rationale: חַג chỉ một kỳ lễ tôn giáo, thường có sắc thái hành hương; “lễ” là cách dịch gọn và phù hợp với văn cảnh Lê-vi.
- source_word: לַיהוָה
  choice: kính Yahweh
  rationale: Giới từ ל biểu thị sự quy hướng hoặc dâng kính. “Kính Yahweh” diễn đạt tự nhiên rằng kỳ lễ được cử hành để tôn kính Ngài, đồng thời giữ danh riêng Yahweh.
- source_word: שִׁבְעַת יָמִים בַּשָּׁנָה
  choice: trong bảy ngày mỗi năm
  rationale: Cụm từ nêu thời lượng bảy ngày và tính thường niên. “Mỗi năm” truyền đạt rõ giá trị ngữ cảnh của בַּשָּׁנָה hơn lối dịch sát chữ “trong năm” vốn thiếu tự nhiên trong tiếng Việt.
- source_word: חֻקַּת עוֹלָם
  choice: quy định lâu dài
  rationale: חֻקָּה là quy định có tính bắt buộc; עוֹלָם ở đây nhấn mạnh hiệu lực kéo dài. “Lâu dài” giữ được sức nặng của cụm từ mà không áp đặt nghĩa tuyệt đối, phi thời gian.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của các ngươi
  rationale: Cách nói này thể hiện sự tiếp tục áp dụng qua những thế hệ kế tiếp.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: vào tháng thứ bảy
  rationale: Cách diễn đạt thời gian trực tiếp, rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi nghĩa của עוֹלָם trong luật nghi lễ
  choice: lâu dài
  alternative: đời đời; vĩnh viễn
  rationale: Trong ngữ cảnh luật pháp giao ước, עוֹלָם có thể chỉ hiệu lực bền vững qua các thế hệ mà không nhất thiết xác quyết tính vô hạn theo nghĩa triết học. “Lâu dài” giữ lại độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để thể hiện lời truyền cho cộng đồng số nhiều và giữ sắc thái Kinh Thánh; tránh từ cổ khó hiểu. Không cần chú thích vì các phương án khác không tạo ra khác biệt thiết yếu cần đưa vào văn bản xuất bản.
