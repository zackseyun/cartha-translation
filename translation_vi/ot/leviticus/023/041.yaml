revisions:
- from: Các ngươi phải cử hành lễ ấy kính Yahweh trong bảy ngày mỗi năm. Đây là quy định lâu dài trải qua các thế hệ của các ngươi; vào tháng thứ bảy, các ngươi phải cử hành lễ ấy.
  to: Các ngươi phải cử hành lễ ấy để tôn kính Yahweh trong bảy ngày mỗi năm. Đây là quy định lâu dài[a] qua các thế hệ các ngươi; vào tháng thứ bảy, các ngươi phải cử hành lễ ấy.
  rationale: Chỉnh nhẹ để câu tự nhiên hơn và để neo chú thích cho חֻקַּת עוֹלָם. Bản văn vẫn giữ sự lặp lại của חָגַג, thời lượng bảy ngày, tính hằng năm, và thời điểm tháng thứ bảy; không thêm diễn giải giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: mệnh lệnh số nhiều, việc cử hành kỳ lễ bảy ngày hằng năm, tính quy định kéo dài qua các thế hệ, và tháng thứ bảy. Tuy nhiên, “trải qua các thế hệ của các ngươi” không phải kết hợp từ tự nhiên trong tiếng Việt; “qua các thế hệ các ngươi” phản ánh לְדֹרֹתֵיכֶם sát hơn và rõ hơn. Chú thích cho עוֹלָם nên được giữ để bảo toàn các khả năng “đời đời/vĩnh viễn” mà không buộc bản văn chính phải chọn nghĩa tuyệt đối.'
  naturalness: “Cử hành lễ ấy để tôn kính Yahweh” là tiếng Việt hiện đại, trang trọng, và làm rõ quan hệ quy hướng của לַיהוָה. “Qua các thế hệ các ngươi” tự nhiên hơn “trải qua các thế hệ của các ngươi.”
  terminology: Giữ nhất quán Yahweh cho יהוה, “cử hành lễ” cho חָגַג, và “quy định lâu dài” cho חֻקַּת עוֹלָם. Chú thích nêu các cách dịch thay thế của עוֹלָם để không thu hẹp độ mở ngữ nghĩa của thuật ngữ.
  issues:
  - severity: low
    issue: Cụm “trải qua các thế hệ của các ngươi” thiếu tự nhiên.
    rationale: Trong tiếng Việt hiện đại, “qua các thế hệ các ngươi” hoặc “cho các thế hệ các ngươi” phù hợp hơn với ý tiếp diễn của לְדֹרֹתֵיכֶם.
  - severity: low
    issue: Bản nháp không giữ chú thích về các cách hiểu từ vựng của עוֹלָם.
    rationale: Audit trail tiếng Anh nêu rõ các phương án “everlasting/perpetual.” Một chú thích tiếng Việt ở đúng neo giúp bảo toàn sự mơ hồ hợp lệ của nguyên ngữ.
  revised_text: Các ngươi phải cử hành lễ ấy để tôn kính Yahweh trong bảy ngày mỗi năm. Đây là quy định lâu dài[a] qua các thế hệ các ngươi; vào tháng thứ bảy, các ngươi phải cử hành lễ ấy.
