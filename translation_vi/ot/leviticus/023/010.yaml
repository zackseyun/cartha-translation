source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: vi
  text: '“Hãy nói với dân Y-sơ-ra-ên[a] và bảo họ: Khi các ngươi vào miền đất Ta đang ban cho các ngươi và gặt mùa màng của đất ấy, thì phải đem bó lúa đầu mùa của mùa gặt các ngươi[b] đến cho thầy tế lễ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Y-sơ-ra-ên”, một cách gọi dân Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ô-me hoa lợi đầu mùa của mùa gặt các ngươi”. Từ Hê-bơ-rơ ô-me ở đây có thể chỉ một bó lúa, và cũng được dùng như một thuật ngữ kỹ thuật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, chỉ toàn thể cộng đồng giao ước; chú thích giữ lại nghĩa đen của thành ngữ Hê-bơ-rơ.
- source_word: כִּי
  choice: Khi
  rationale: Trong ngữ cảnh này, từ này mở đầu hoàn cảnh mà mệnh lệnh sẽ được áp dụng, chứ không chủ yếu nêu nguyên nhân.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Giữ nghĩa địa lý và giao ước của từ Hê-bơ-rơ, đồng thời tự nhiên hơn cách dùng riêng từ “xứ” trong tiếng Việt hiện đại.
- source_word: נֹתֵן
  choice: đang ban
  rationale: Thể phân từ diễn tả hành động ban cho đang diễn tiến hoặc sắp thành hiện thực; “ban” phù hợp với hành động của Đức Chúa Trời trong văn phong trang trọng.
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: và gặt mùa màng của đất ấy
  rationale: Giữ sự lặp từ cùng gốc giữa động từ “gặt” và danh từ chỉ mùa thu hoạch, đồng thời biểu đạt rõ hậu tố sở hữu quay lại miền đất.
- source_word: וַהֲבֵאתֶם
  choice: thì phải đem
  rationale: Diễn đạt rõ trình tự và hiệu lực mệnh lệnh sau mệnh đề hoàn cảnh mà không làm câu tiếng Việt nặng nề.
- source_word: עֹמֶר רֵאשִׁית קְצִירְכֶם
  choice: bó lúa đầu mùa của các ngươi
  rationale: Trong nghi thức này, עֹמֶר chỉ một bó sản vật vừa gặt được đem đến cho thầy tế lễ; “đầu mùa” diễn đạt phần đầu tiên của mùa gặt, còn thuật ngữ “ô-me” được giữ trong chú thích.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Thuật ngữ tiếng Việt quen thuộc và trang trọng dành cho chức vụ tư tế trong luật tế lễ.
theological_decisions:
- issue: Cách gọi cộng đồng giao ước có hình thức giống đực
  choice: dân Y-sơ-ra-ên
  alternative: con trai Y-sơ-ra-ên; con cái Y-sơ-ra-ên
  rationale: בְּנֵי יִשְׂרָאֵל là thành ngữ chỉ dân Israel nói chung. Tiếng Việt không buộc phải đánh dấu giống ngữ pháp; “dân Y-sơ-ra-ên” truyền đạt đúng đối tượng cộng đồng mà không ngầm giới hạn mệnh lệnh chỉ cho nam giới, còn nghĩa đen được nêu trong chú thích.
- issue: Ý nghĩa nghi lễ của עֹמֶר
  choice: bó lúa
  alternative: ô-me
  rationale: Vật được đem đến cho thầy tế lễ trong câu này là sản vật thu hoạch ở dạng một bó. Bản dịch chính dùng nghĩa cụ thể, dễ hiểu, nhưng chú thích bảo lưu khả năng đọc đây là thuật ngữ kỹ thuật “ô-me”.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp lời luật định. Đại từ “Ta” và “các ngươi” duy trì sắc thái lời phán trực tiếp của Đức Chúa Trời, còn cấu trúc câu được điều chỉnh để tự nhiên với độc giả Việt Nam hiện đại.
