id: LEV.23.17
reference: Leviticus 23:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: vi
  text: Từ nơi anh em cư ngụ, anh em phải đem đến hai ổ bánh làm lễ vật được đưa qua đưa lại. Chúng phải được làm bằng hai phần mười ê-pha[a] bột mịn, được nướng có men[b], làm lễ vật đầu mùa dâng lên Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “hai phần mười”; theo hệ đo lường tư tế, nghĩa là hai phần mười ê-pha.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “được nướng thành bánh có men.” Nguyên văn nhấn mạnh rằng những ổ bánh đầu mùa này có men.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: Từ nơi anh em cư ngụ
  rationale: Diễn đạt tự nhiên מוֹשָׁב là nơi ở hoặc khu dân cư, đồng thời giữ ý lễ vật được đem từ nơi dân chúng sinh sống.
- source_word: תָּבִיאוּ
  choice: anh em phải đem đến
  rationale: Thể Hiphil của בוא mang tính chỉ thị trong luật nghi lễ; “phải đem đến” rõ nghĩa và phù hợp văn phong quy định.
- source_word: לֶחֶם תְּנוּפָה
  choice: hai ổ bánh làm lễ vật đưa qua đưa lại
  rationale: לֶחֶם tuy ở dạng số ít nhưng được xác định là hai; תְּנוּפָה chỉ lễ vật được trình dâng bằng động tác đưa qua đưa lại, nên bản dịch giữ cả tính chất lễ vật lẫn hành động nghi lễ.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: hai phần mười ê-pha
  rationale: עִשָּׂרוֹן là đơn vị bằng một phần mười ê-pha trong hệ đo lường tư tế; bổ sung “ê-pha” giúp độc giả nhận biết đơn vị hàm ẩn.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Thuật ngữ thông dụng và chính xác cho loại bột tinh dùng trong các lễ vật ngũ cốc.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: được nướng có men
  rationale: Giữ rõ cả trạng thái có men của חָמֵץ và ý bị động của תֵּאָפֶינָה, không giải thích thêm ý nghĩa thần học.
- source_word: בִּכּוּרִים
  choice: lễ vật đầu mùa
  rationale: Trong ngữ cảnh, từ này chỉ sản vật đầu mùa được dâng cho Đức Chúa Trời; cách dịch nêu rõ chức năng của hai ổ bánh.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: לְ biểu thị hướng hoặc sự biệt riêng của lễ vật; dùng danh Yahweh để thể hiện trực tiếp danh giao ước יהוה.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh; “Yahweh” giữ danh riêng mà không thay bằng một tước hiệu hay áp đặt cách đọc “Jehovah”.
- issue: Thuật ngữ nghi lễ תְּנוּפָה
  choice: lễ vật đưa qua đưa lại
  alternative: lễ vật dâng đưa; lễ vật vẫy
  rationale: Cách dịch mô tả ngắn gọn động tác trình dâng gắn với thuật ngữ tư tế, nhưng không xác định quá mức hướng hoặc hình thức chính xác của động tác khi từ ngữ có thể bao quát nghi thức nâng/đưa.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng “anh em” cho ngôi thứ hai số nhiều. Giữ thuật ngữ nghi lễ ở dạng dễ hiểu, tránh từ cổ khó tiếp cận; các dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong chính văn.
