  to: Từ nơi anh em cư ngụ, anh em phải đem đến hai ổ bánh làm lễ vật được đưa qua đưa lại. Chúng phải được làm bằng hai phần mười ê-pha[a] bột mịn, được nướng có men[b], làm lễ vật đầu mùa dâng lên Yahweh.
