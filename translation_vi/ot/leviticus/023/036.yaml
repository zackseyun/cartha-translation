  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: vi
  text: Trong bảy ngày, anh em phải dâng lễ vật hỏa tế lên Yahweh. Vào ngày thứ tám, anh em phải có một cuộc hội họp thánh và dâng lễ vật hỏa tế lên Yahweh. Đó là một cuộc hội họp trọng thể; anh em không được làm bất cứ công việc thường ngày nào.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Trong bảy ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian mà việc dâng lễ phải được thực hiện.
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: phải dâng
  rationale: Động từ Hiphil của קרב mang nghĩa nghi lễ là đem đến để hiến dâng; “dâng” vừa tự nhiên vừa giữ rõ sắc thái tế lễ.
- source_word: אִשֶּׁה
  choice: lễ vật hỏa tế
  rationale: Danh từ nghi lễ chỉ lễ vật được dâng bằng lửa. “Lễ vật hỏa tế” chính xác và trang trọng hơn “thức ăn dâng”, đồng thời không khẳng định mọi phần của lễ vật đều bị thiêu hết.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: ל biểu thị đối tượng hoặc hướng dâng hiến; “dâng ... lên Yahweh” là cách nói tự nhiên trong tiếng Việt và giữ nguyên danh giao ước.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Vào ngày thứ tám
  rationale: Chuyển đạt trực tiếp và tự nhiên cụm từ chỉ thời điểm.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Cụm từ chỉ một cuộc tụ họp thiêng liêng được chính thức triệu tập; “hội họp thánh” giữ được cả ý triệu tập lẫn tính thánh.
- source_word: עֲצֶרֶת
  choice: một lễ bế mạc trọng thể
  rationale: Trong bối cảnh lễ hội, từ này chỉ cuộc hội họp đặc biệt vào lúc kết thúc, gắn với việc ngưng công việc; cách dịch này làm rõ chức năng kết lễ mà vẫn giữ sắc thái trang trọng.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc thường ngày nào
  rationale: Cụm từ cấm loại lao động thông thường hay nghề nghiệp trong ngày lễ, chứ không nhất thiết cấm mọi hoạt động; cách dịch này rõ nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh Bốn Chữ; phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay thế bằng một tước hiệu.
- issue: Phạm vi của אִשֶּׁה
  choice: lễ vật hỏa tế
  alternative: lễ vật thực phẩm
  rationale: Từ này là thuật ngữ tế tự liên hệ đến việc dâng bằng lửa. Bản dịch không đồng nhất nó với một loại sinh tế cụ thể hay hàm ý rằng toàn bộ lễ vật nhất thiết bị thiêu.
- issue: Ý nghĩa của עֲצֶרֶת
  choice: lễ bế mạc trọng thể
  alternative: cuộc hội họp trọng thể
  rationale: Ngữ cảnh ngày thứ tám ủng hộ sắc thái kết thúc kỳ lễ, nhưng từ cũng có thể nhấn mạnh việc tập họp hoặc ngưng công việc; lựa chọn này giữ tính nghi lễ mà không gán thêm nội dung giáo phái.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” cho số nhiều לָכֶם và các động từ số nhiều, phù hợp lời truyền cho cộng đồng Israel. Không dùng chú thích vì bản dịch chính đã thể hiện trực tiếp các thuật ngữ quan trọng; do đó không có dấu chú thích cần đặt trong câu.
