source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: vi
  text: 'Đây là các kỳ lễ đã định của Đức Chúa, mà anh em phải công bố là những cuộc hội họp thánh, để dâng lên cho Đức Chúa một lễ vật dâng bằng lửa[a]: lễ thiêu, lễ vật ngũ cốc, sinh tế và các lễ vật rưới—mỗi ngày theo phần quy định cho ngày ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ có truyền thống được hiểu là “lễ vật dâng bằng lửa”; cũng có thể liên hệ với ý “lễ vật làm thức ăn dâng cho Đức Chúa”.
    reason: Bảo tồn sự bất định về sắc thái của אִשֶּׁה, trong khi bản văn chính dùng cách diễn đạt truyền thống và tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: những kỳ lễ ấn định
  rationale: Diễn đạt các thời điểm đã được ấn định để cử hành lễ, phù hợp ngữ cảnh chương 23 hơn nghĩa chung là “cuộc hẹn”.
- source_word: יְהוָה
  choice: Đức Chúa
  rationale: Dùng danh xưng trang trọng, quen thuộc trong tiếng Việt để đại diện cho thần danh YHWH, đồng thời phân biệt với אֲדֹנָי khi có ngữ cảnh cần thiết.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: những cuộc hội họp thánh
  rationale: Giữ cả ý triệu tập/hội họp của מִקְרָא và tính biệt riêng, thánh khiết của קֹדֶשׁ.
- source_word: אִשֶּׁה
  choice: lễ vật dùng lửa dâng lên
  rationale: Phản ánh cách hiểu truyền thống liên hệ với lửa mà không thu hẹp thành một loại sinh tế cụ thể; chú thích bảo tồn khả năng hiểu là lễ vật/thức ăn dâng cho Đức Chúa.
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong hệ thống tế lễ Lê-vi, từ này chỉ lễ vật làm từ sản phẩm ngũ cốc, tự nhiên và chính xác hơn “của lễ chay” trong tiếng Việt hiện đại.
- source_word: נְסָכִים
  choice: các lễ quán
  rationale: Thuật ngữ chỉ các lễ vật dạng chất lỏng được rưới đổ; số nhiều của nguyên văn được giữ lại.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: mỗi ngày theo phần quy định cho ngày ấy
  rationale: Thành ngữ nói đến phần việc/lễ vật thuộc từng ngày; cách dịch này rõ nghĩa mà không thêm chi tiết ngoài ngữ cảnh.
theological_decisions:
- issue: Bản chất của אִשֶּׁה
  choice: Dịch trong câu chính là “lễ vật dùng lửa dâng lên” và ghi chú nghĩa khả dĩ khác.
  alternative: “lễ vật làm thức ăn” hoặc đơn giản “lễ vật”
  rationale: Ngữ nguyên và sắc thái chính xác của thuật ngữ còn được tranh luận. Cách trình bày này không biến hình ảnh “thức ăn của Đức Chúa” thành khẳng định thần học rằng Đức Chúa cần ăn, cũng không che khuất truyền thống hiểu là lễ vật qua lửa.
- issue: Cách thể hiện thần danh יהוה
  choice: Đức Chúa
  alternative: YHWH hoặc Gia-vê
  rationale: Dùng lối thay thế thần danh quen thuộc và trang trọng trong bản văn chính, không áp đặt một cách phục nguyên phát âm đang còn bất định.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh em” cho ngôi thứ hai số nhiều nhằm nói với toàn thể cộng đồng; giữ các thuật ngữ tế lễ đủ chính xác, đồng thời diễn đạt mệnh đề cuối theo tiếng Việt tự nhiên.
