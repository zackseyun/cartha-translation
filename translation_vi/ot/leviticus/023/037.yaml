    issue: Cụm “lễ vật dùng lửa dâng lên” gượng và lặp ý.
    rationale: אִשֶּׁה là tân ngữ của לְהַקְרִיב (“dâng/trình”), nên việc chứa thêm “dâng lên” trong chính danh ngữ tạo lặp và làm câu kém tự nhiên. “Lễ vật dâng bằng lửa” giữ được cách hiểu truyền thống mà cú pháp rõ hơn.
  - severity: low
    issue: “Các lễ quán” không phải cách dùng thông dụng của tiếng Việt hiện đại.
    rationale: Dù có nền tảng trong truyền thống dịch thuật, thuật ngữ này khó hiểu đối với độc giả hiện đại. “Các lễ vật rưới” diễn đạt chính xác các lễ vật chất lỏng được rưới/đổ.
