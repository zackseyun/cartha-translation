source:
  edition: WLC
  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: vi
  text: Các ngươi phải ở trong lều tạm suốt bảy ngày[a]; mọi người bản xứ trong Y-sơ-ra-ên đều phải ở trong lều tạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nơi trú tạm”; từ Hê-bơ-rơ chỉ những nơi trú tạm được dựng cho kỳ lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: trong lều tạm
  rationale: סֻכּוֹת chỉ những nơi trú tạm được dựng cho kỳ lễ. “Lều tạm” tự nhiên trong tiếng Việt và giữ được hình ảnh cụ thể cùng tính chất tạm thời.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: phải ở / đều phải ở
  rationale: Trong ngữ cảnh cư trú, ישׁב có nghĩa là ở hoặc cư ngụ, không đơn thuần là ngồi. “Ở” là cách diễn đạt hiện đại, rõ ràng và phù hợp cho việc lưu lại trong lều suốt kỳ lễ.
- source_word: שִׁבְעַת יָמִים
  choice: suốt bảy ngày
  rationale: Cụm từ là trạng ngữ chỉ khoảng thời gian; “suốt bảy ngày” diễn đạt tự nhiên và cho thấy việc ở kéo dài trong toàn bộ thời hạn.
- source_word: כָּל הָאֶזְרָח
  choice: mọi người bản xứ
  rationale: אֶזְרָח chỉ thành viên bản địa của cộng đồng, đối lập với kiều dân hoặc ngoại kiều. “Người bản xứ” tránh đưa vào khái niệm chính trị hiện đại hàm chứa trong “công dân”.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Y-sơ-ra-ên
  rationale: Cách dịch trực tiếp, xác định cộng đồng Y-sơ-ra-ên là phạm vi áp dụng mệnh lệnh.
theological_decisions:
- issue: Phạm vi giới tính của הָאֶזְרָח
  choice: mọi người bản xứ
  alternative: mọi người đàn ông bản xứ
  rationale: Danh từ Hê-bơ-rơ ở giống đực số ít nhưng có giá trị đại diện chung. “Mọi người bản xứ” giữ phạm vi tổng quát, không tự ý giới hạn mệnh lệnh cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ngươi” bảo tồn lời truyền trực tiếp ở số nhiều; “lều tạm” giữ hình ảnh nghi lễ cụ thể mà không dùng từ quá cổ.
