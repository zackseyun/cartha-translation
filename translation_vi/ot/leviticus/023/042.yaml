  terminology: “Y-sơ-ra-ên” nhất quán với cách phiên âm Kinh Thánh tiếng Việt. “Người bản xứ” phản ánh הָאֶזְרָח mà không áp đặt khái niệm quốc tịch hiện đại hoặc giới hạn mệnh lệnh vào nam giới. Chú thích neo đúng tại lần xuất hiện đầu của “lều tạm” và nêu được lựa chọn từ vựng thay thế.
