  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh cư trú trong סֻכּוֹת trong bảy ngày và áp dụng cho toàn thể người sinh tại bản xứ trong cộng đồng Y-sơ-ra-ên. “Phải ở” phản ánh thích đáng ý nghĩa cư trú của ישׁב; “suốt bảy ngày” diễn đạt đúng thời lượng. “Lều tạm” là cách gọi đã quen thuộc, giữ được tính tạm thời và bối cảnh lễ hội, dù không nhấn mạnh riêng hình dạng “chòi/booth”.
