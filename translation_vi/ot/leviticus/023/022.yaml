  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: vi
  text: Khi các ngươi gặt mùa màng trên đất mình, đừng gặt cho hết phần rìa ruộng[a], cũng đừng nhặt lượm phần sót lại của mùa gặt. Hãy để chúng lại cho người nghèo và người ngoại kiều[b]. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “góc ruộng.” Từ Hê-bơ-rơ có thể chỉ rìa, mép, cạnh hoặc góc.
    reason: lexical_alternative
  - marker: b
    text: Tức là người ngoại quốc cư trú giữa dân Israel và được luật pháp của họ bảo hộ; cũng có thể dịch là “kiều dân.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: Khi các ngươi gặt mùa màng trong đất mình
  rationale: Cụm giới từ với động từ nguyên mẫu diễn tả thời điểm; cách dịch này tự nhiên trong tiếng Việt và giữ rõ bối cảnh thu hoạch trên đất thuộc về cộng đồng.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ
  choice: đừng gặt hết đến tận rìa ruộng[a]
  rationale: Piel của כלה mang nghĩa làm cho hết hoặc hoàn tất; cách diễn đạt này truyền đạt lệnh không thu hoạch đến tận giới hạn ruộng. פאה có thể là rìa, mép hoặc góc nên giữ phương án khác trong chú thích.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: cũng đừng nhặt những gì rơi sót trong mùa gặt
  rationale: לקט chỉ phần nông sản rơi hoặc còn sót để nhặt sau vụ gặt. Cụm diễn giải này dễ hiểu hơn một thuật ngữ nông nghiệp cổ mà vẫn giữ đúng nội dung pháp luật.
- source_word: לֶעָנִי
  choice: cho người nghèo
  rationale: עני ở đây chỉ người nghèo khó, dễ bị tổn thương về kinh tế; 'người nghèo' là trực tiếp và tự nhiên.
- source_word: וְלַגֵּר
  choice: và ngoại kiều cư trú[b]
  rationale: גר là người không thuộc dân bản địa nhưng sống giữa Israel và được luật pháp bảo hộ. 'Ngoại kiều cư trú' phân biệt với khách qua đường, dù chú thích cung cấp cách nói phổ thông hơn.
- source_word: תַּעֲזֹב אֹתָם
  choice: Hãy để chúng lại
  rationale: עזב trong ngữ cảnh này có nghĩa để lại cho người khác, không phải ruồng bỏ theo nghĩa tình cảm.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ta là Yahweh, Đức Chúa Trời của các ngươi
  rationale: Giữ danh riêng giao ước יהוה dưới dạng Yahweh và tái hiện công thức tuyên xưng trang trọng của nguyên văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm. Phiên âm 'Yahweh' bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Phạm vi xã hội của גֵּר
  choice: ngoại kiều cư trú
  alternative: kiều dân; người ngoại quốc sống giữa các ngươi; khách lạ
  rationale: Từ này chỉ người ngoài Israel cư trú trong cộng đồng và chịu sự điều chỉnh, bảo hộ của luật Israel; không nên hiểu đơn thuần là khách vãng lai hay áp đặt phạm trù di trú hiện đại.
- issue: Sự chuyển đổi số trong lời luật
  choice: giữ 'các ngươi' ở các mệnh đề cộng đồng nhưng dùng 'ruộng' theo nghĩa khái quát
  alternative: dịch toàn bộ bằng số ít 'ngươi'
  rationale: Tiếng Hê-bơ-rơ mở đầu và kết thúc ở số nhiều nhưng chuyển sang hậu tố số ít trong phần quy định về ruộng và mùa gặt. Bản dịch Việt ưu tiên câu tự nhiên, hiểu là luật áp dụng cho từng thành viên trong toàn cộng đồng, mà không biến sự chuyển đổi này thành khác biệt thần học.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng mệnh lệnh trực tiếp và từ ngữ nông nghiệp dễ hiểu. Đại từ 'các ngươi' giữ sắc thái diễn từ giao ước; 'Ta' phù hợp với lời tự xưng của Đức Chúa Trời. Mọi ký hiệu chú thích [a], [b] đều có trong chính văn.
