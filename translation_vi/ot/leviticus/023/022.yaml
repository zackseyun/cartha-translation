revisions:
- from: Khi các ngươi gặt mùa màng trong đất mình, đừng gặt hết đến tận rìa ruộng[a], cũng đừng nhặt những gì rơi sót trong mùa gặt. Hãy để chúng lại cho người nghèo và ngoại kiều cư trú[b]. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  to: Khi các ngươi gặt mùa màng trên đất mình, đừng gặt cho hết phần rìa ruộng[a], cũng đừng nhặt lượm phần sót lại của mùa gặt. Hãy để chúng lại cho người nghèo và người ngoại kiều[b]. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  rationale: Thay cách diễn giải hẹp “những gì rơi sót” bằng “phần sót lại của mùa gặt” để phản ánh đầy đủ hơn לֶקֶט. Điều chỉnh cách gọi người cư trú không phải người Israel cho tự nhiên hơn, còn sắc thái pháp lý-xã hội được bảo toàn trong chú thích. “Gặt cho hết phần rìa ruộng” giữ rõ đối tượng của lệnh cấm là phần rìa/góc ruộng.
  reviewer_model: gpt-5.6-terra
