language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: vi
  text: Lễ phẩm ngũ cốc của nó là hai phần mười ê-pha bột mịn trộn với dầu; đó là một lễ vật dâng bằng lửa[a] cho Yahweh, có hương thơm làm đẹp lòng Ngài; lễ quán của nó là một phần tư hin rượu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «lễ vật thực phẩm dâng cho Yahweh.»'
    reason: Phương án từ vựng cho thuật ngữ tế lễ אִשֶּׁה, tương ứng với chú thích trong dấu vết kiểm tra tiếng Anh; bản văn chính giữ cách dịch minh bạch «lễ vật dâng bằng lửa».
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: Lễ phẩm ngũ cốc kèm theo
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ phẩm bằng ngũ cốc; hậu tố số ít giống đực quy chiếu về con chiên ở câu trước. Cụm “kèm theo” diễn đạt tự nhiên mối liên hệ ấy trong tiếng Việt.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: hai phần mười ê-pha
  rationale: Nguyên văn là “hai phần mười”; trong luật tế lễ, đơn vị ngầm hiểu là ê-pha. Nêu rõ đơn vị giúp độc giả hiện đại hiểu lượng đo.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Đây là thuật ngữ tế lễ quen dùng cho loại bột đã được tinh chế.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn với dầu
  rationale: Phân từ bị động diễn tả bột được hòa trộn với dầu; cách nói này tự nhiên và chính xác trong tiếng Việt.
- source_word: אִשֶּׁה לַיהוָה
  choice: một lễ vật dâng bằng lửa lên Yahweh
  rationale: אִשֶּׁה là thuật ngữ chỉ lễ vật được trình dâng bằng lửa. Bản dịch trực tiếp này phù hợp với chứng cứ từ nguyên văn và tránh biến thuật ngữ thành “thức ăn” khi câu không dùng danh từ לֶחֶם.
- source_word: רֵיחַ נִיחֹחַ
  choice: có hương thơm làm đẹp lòng Ngài
  rationale: Giữ hình ảnh tế lễ về hương thơm đồng thời diễn đạt tự nhiên ý được Yahweh vui nhận, không xóa bỏ ẩn dụ.
- source_word: וְנִסְכֹּה
  choice: còn lễ quán kèm theo
  rationale: נֶסֶךְ là lễ vật dạng lỏng được rót dâng. “Lễ quán” là thuật ngữ tiếng Việt ngắn gọn, còn “kèm theo” làm rõ hậu tố quy chiếu về sinh tế.
- source_word: יַיִן
  choice: rượu
  rationale: Tương đương trực tiếp và tự nhiên của danh từ chỉ rượu nho trong ngữ cảnh này.
- source_word: רְבִיעִת הַהִין
  choice: một phần tư hin
  rationale: Giữ nguyên tên đơn vị đo lường cổ và chuyển phân số sang cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn nêu trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật làm thức ăn
  rationale: Từ này là thuật ngữ tế lễ liên hệ đến việc dâng bằng lửa; chọn cách dịch hình thức hơn vì chính câu không có từ “thức ăn”, qua đó tránh giải quyết quá mức sắc thái còn được tranh luận.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Giữ các đơn vị cổ “ê-pha” và “hin” để bảo toàn bối cảnh luật tế lễ; dùng “lễ quán” như thuật ngữ nghi lễ, với “kèm theo” hỗ trợ khả năng lĩnh hội.
