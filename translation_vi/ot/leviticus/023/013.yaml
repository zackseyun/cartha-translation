revisions:
- from: Lễ phẩm ngũ cốc kèm theo là hai phần mười ê-pha bột mịn trộn với dầu, một lễ vật dâng bằng lửa lên Yahweh, có hương thơm làm đẹp lòng Ngài; còn lễ quán kèm theo là một phần tư hin rượu.
  to: Lễ phẩm ngũ cốc của nó là hai phần mười ê-pha bột mịn trộn với dầu; đó là một lễ vật dâng bằng lửa[a] cho Yahweh, có hương thơm làm đẹp lòng Ngài; lễ quán của nó là một phần tư hin rượu.
  rationale: Bản sửa làm sáng tỏ cấu trúc đồng vị của câu, dùng các đại từ sở hữu phản ánh trực tiếp nguyên văn, và thêm chú thích có neo cho phương án dịch của thuật ngữ tế lễ còn có sắc thái tranh luận. Không thay đổi lượng đo, loại lễ vật, hay danh Yahweh.
