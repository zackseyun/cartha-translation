revisions:
- from: Trong bảy ngày, anh em phải dâng lễ vật hỏa tế lên Yahweh.[a] Ngày thứ bảy sẽ có một cuộc hội họp thánh; anh em không được làm bất cứ công việc lao động nào.
  to: Trong bảy ngày, anh em phải dâng lên Yahweh lễ vật dâng bằng lửa.[a] Ngày thứ bảy sẽ có một thánh hội; anh em không được làm bất cứ công việc lao động nào.
  rationale: Bản sửa thay cách kết hợp gượng “lễ vật hỏa tế” bằng “lễ vật dâng bằng lửa”, là cách diễn đạt tiếng Việt hiện đại rõ ràng cho thuật ngữ tế tự אִשֶּׁה. “Thánh hội” thay cho “cuộc hội họp thánh” để chuyển đạt thành ngữ phụng tự מִקְרָא קֹדֶשׁ một cách gọn, trang trọng và sát nghĩa. Trật tự “dâng lên Yahweh” vẫn diễn đạt đúng hướng/dâng hiến của לַיהוָה. Chú thích bảo lưu cách hiểu “lễ vật làm thức ăn”, không quyết định thay bản văn một vấn đề từ nguyên/học thuật còn được thảo luận.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: mệnh lệnh số nhiều, thời hạn bảy ngày, lễ dâng cho Yahweh, ngày thứ bảy là một cuộc nhóm họp thánh, và lệnh cấm công việc lao động. Tuy nhiên, “lễ vật hỏa tế” không phải kết hợp tự nhiên trong tiếng Việt hiện đại; dùng “lễ vật dâng bằng lửa” phản ánh trực tiếp hơn cách hiểu truyền thống của אִשֶּׁה, đồng thời chú thích vẫn bảo lưu phương án “lễ vật làm thức ăn” vốn có cơ sở từ vựng được tranh luận.'
  naturalness: “Lễ vật dâng bằng lửa” tự nhiên và minh bạch hơn “lễ vật hỏa tế”. “Một cuộc hội họp thánh” dễ hiểu, nhưng “một thánh hội” là thuật ngữ trang trọng, gọn và quen thuộc trong ngữ cảnh ngày lễ phụng tự, diễn đạt sát מִקְרָא־קֹדֶשׁ hơn.
  terminology: Giữ “Yahweh” nhất quán với quyết định về יהוה. Dùng “thánh hội” cho מִקְרָא קֹדֶשׁ và “công việc lao động” cho כָּל־מְלֶאכֶת עֲבֹדָה. Chú thích không nên liệt kê “lễ vật bằng lửa” như một phương án độc lập khi bản chính đã dùng chính ý đó; thay vào đó nêu các cách dịch thay thế thực sự khác biệt.
  issues:
  - severity: low
    issue: Cụm “lễ vật hỏa tế” chưa tự nhiên trong tiếng Việt hiện đại.
    rationale: “Hỏa tế” thường tự nó đã chỉ lễ tế/lễ dâng bằng lửa; ghép với “lễ vật” tạo kết hợp gượng và hơi trùng ý. “Lễ vật dâng bằng lửa” rõ nghĩa hơn, vẫn giữ phạm vi tế tự của אִשֶּׁה.
  - severity: low
    issue: “Cuộc hội họp thánh” có thể được thay bằng thuật ngữ gọn và chính xác hơn.
    rationale: מִקְרָא קֹדֶשׁ là một cuộc hội họp được triệu tập với tính chất thánh. “Thánh hội” là cách gọi tiếng Việt trang trọng, tự nhiên trong văn cảnh Kinh Thánh và không làm mất ý nghĩa này.
  - severity: low
    issue: Chú thích hiện tại lặp lại gần như cùng một cách hiểu với bản chính.
    rationale: Sau khi bản chính dùng “lễ vật dâng bằng lửa”, chú thích nên nêu phương án từ vựng khác biệt là “lễ vật làm thức ăn”, đồng thời có thể ghi “lễ tế bằng lửa” như biến thể diễn đạt, để phản ánh bất định học thuật mà không gây lặp.
