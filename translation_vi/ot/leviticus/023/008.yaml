source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: vi
  text: Trong bảy ngày, anh em phải dâng lên Yahweh lễ vật dâng bằng lửa.[a] Ngày thứ bảy sẽ có một thánh hội; anh em không được làm bất cứ công việc lao động nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật làm thức ăn”; hoặc: “lễ tế bằng lửa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: anh em phải dâng
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ mang nghĩa đem đến hoặc trình dâng lễ vật; “dâng” tự nhiên và chính xác trong tiếng Việt.
- source_word: אִשֶּׁה
  choice: lễ vật hỏa tế
  rationale: Từ ngữ tế tự này chỉ lễ vật được dâng bằng lửa. “Lễ vật hỏa tế” giữ được mối liên hệ trực tiếp với lửa mà không mặc nhiên giới hạn vào một loại sinh tế cụ thể.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giới từ ל biểu thị đối tượng tiếp nhận hoặc sự dâng hiến; “dâng ... lên Yahweh” là cách diễn đạt tự nhiên trong tiếng Việt và giữ nguyên danh riêng của Đức Chúa Trời.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Cụm từ diễn tả khoảng thời gian các lễ vật được dâng; “trong bảy ngày” rõ nghĩa và tự nhiên.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Ngày thứ bảy
  rationale: Cách dịch trực tiếp, tự nhiên của cụm từ chỉ thời gian.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Cụm từ chỉ một cuộc tụ họp được triệu tập cho mục đích thánh. “Cuộc hội họp thánh” dễ hiểu hơn “thánh hội” mà vẫn giữ sắc thái trang trọng và tính chất được triệu tập.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc lao động nào
  rationale: Cụm từ nói đến công việc lao động hay nghề nghiệp thông thường bị cấm trong ngày lễ, chứ không nhất thiết mọi hoạt động; cách dịch này giữ yếu tố כָּל mà không dùng từ cổ.
- source_word: לֹא תַעֲשׂוּ
  choice: anh em không được làm
  rationale: Diễn đạt rõ một điều cấm áp dụng cho cộng đồng số nhiều.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của אִשֶּׁה
  choice: lễ vật hỏa tế
  alternative: lễ vật làm thức ăn
  rationale: Nguồn gốc và phạm vi chính xác của thuật ngữ tế tự này còn được thảo luận. Bản chính giữ cách hiểu truyền thống gắn với lửa, đồng thời ghi nhận cách hiểu “lễ vật làm thức ăn” trong chú thích thay vì giải quyết dứt khoát sự không chắc chắn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều nói với cộng đồng Israel; giữ danh Yahweh và thuật ngữ tế tự ở mức rõ nghĩa nhưng không diễn giải quá mức.
