  verdict: revise
  source_fidelity: 'Bản nháp nhìn chung giữ đúng cấu trúc nghi lễ: thầy tế lễ thực hiện hành vi תְּנוּפָה đối với đại từ số nhiều không xác định rõ, có bánh đầu mùa và hai chiên, trước mặt Yahweh; rồi các vật ấy là vật thánh cho Yahweh và cho phần thầy tế lễ. Tuy nhiên, “bánh hoa quả đầu mùa” dễ gợi bánh làm từ trái cây hơn là “bánh đầu mùa/bánh của lễ đầu mùa” trong ngữ cảnh lễ vật ngũ cốc. Cụm “làm nghi thức đưa qua đưa lại” cũng nặng nề hơn cần thiết.'
  naturalness: “Làm lễ đưa qua đưa lại” là cách nói gọn và tự nhiên hơn trong văn phong nghi lễ hiện đại, đồng thời vẫn phản ánh động từ và danh từ kỹ thuật trong tiếng Hê-bơ-rơ. “Bánh đầu mùa” phù hợp, sáng rõ và tránh nghĩa lệch của “hoa quả”.
  terminology: Giữ “Yahweh”, “thầy tế lễ”, “chiên”, và “vật thánh”. “Các lễ vật ấy” là một cách xử lý thận trọng cho אֹתָם, không áp đặt một tiền ngữ duy nhất trong khi ngữ cảnh trước đó cung cấp các lễ vật liên quan. “Thuộc về Yahweh, dành cho thầy tế lễ” giữ được quan hệ biệt riêng cho Yahweh và phần được chỉ định cho thầy tế lễ.
