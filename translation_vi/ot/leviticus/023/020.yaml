  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: vi
  text: Thầy tế lễ phải làm lễ đưa qua đưa lại các lễ vật ấy cùng với bánh đầu mùa và hai con chiên, trước mặt Yahweh[a]. Chúng sẽ là vật thánh thuộc về Yahweh, dành cho thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đưa qua đưa lại các lễ vật ấy trên bánh đầu mùa ... trên hai con chiên”; giới từ Hê-bơ-rơ có thể mang nghĩa không gian là “trên”, nhưng ở đây có lẽ chỉ việc các lễ vật được cùng trình dâng trong nghi thức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: phải làm nghi thức đưa qua đưa lại
  rationale: Dạng Hiphil của נוּף trong bối cảnh tế lễ chỉ động tác nghi lễ đưa lễ vật qua đưa lại hoặc trình dâng; cách diễn đạt này vừa dễ hiểu vừa giữ sắc thái hành động cụ thể.
- source_word: אֹתָם
  choice: các lễ vật ấy
  rationale: Đại từ số nhiều hồi chỉ các vật đã được quy định trong ngữ cảnh trước; thêm danh từ loại 'lễ vật' giúp câu tiếng Việt tự nhiên mà không xác định chúng quá mức.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: cùng với bánh hoa quả đầu mùa
  rationale: עַל có thể mang nghĩa không gian 'trên', nhưng trong nghi thức này có khả năng biểu thị sự kết hợp khi trình dâng; 'cùng với' tránh khẳng định chắc chắn rằng các vật được đặt chồng lên nhau.
- source_word: תְּנוּפָה
  choice: nghi thức đưa qua đưa lại
  rationale: Danh từ kỹ thuật chỉ lễ vật được đưa qua đưa lại trước mặt Đức Chúa Trời; được kết hợp với động từ để tạo cách nói rõ nghĩa, tự nhiên trong tiếng Việt hiện đại.
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: cùng với hai con chiên con
  rationale: Giống lần xuất hiện trước của עַל, bản dịch hiểu đây là sự kết hợp trong nghi thức, đồng thời ghi chú khả năng hiểu theo nghĩa không gian.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: Chúng sẽ là vật thánh
  rationale: Cụm danh từ vị ngữ với היה xác định địa vị thánh của các lễ vật; 'vật thánh' tự nhiên hơn và làm rõ rằng đại từ chỉ các lễ vật.
- source_word: לַיהוָה לַכֹּהֵן
  choice: thuộc về Yahweh, dành cho thầy tế lễ
  rationale: Hai cụm ל־ diễn tả sự biệt riêng cho Yahweh và quyền nhận phần thánh của thầy tế lễ; cách dịch giữ cả hai quan hệ mà không xóa bỏ sức căng giữa chúng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước, phù hợp trực tiếp với יהוה và lớp tư vấn tiếng Anh đã được kiểm định.
theological_decisions:
- issue: Quan hệ giữa việc thuộc về Yahweh và phần dành cho thầy tế lễ
  choice: thuộc về Yahweh, dành cho thầy tế lễ
  alternative: thánh cho Yahweh và cho thầy tế lễ
  rationale: Bản dịch giữ sự phân biệt giữa việc lễ vật được biệt riêng cho Yahweh và việc thầy tế lễ được quyền nhận chúng, nhưng không giải thích thêm cách thức sở hữu hay sử dụng.
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm 'Yahweh' giữ tính chất danh riêng và phù hợp dữ liệu tư vấn được cung cấp.
translation_notes:
  register: Văn phong trang trọng, sáng rõ, dùng 'thầy tế lễ' và 'chiên con' là những thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt. Cụm 'làm nghi thức đưa qua đưa lại' giải thích thuật ngữ tế lễ mà không dùng một danh xưng khó hiểu; dấu chân chú [a] được đặt ngay sau mệnh đề nghi lễ liên quan.
