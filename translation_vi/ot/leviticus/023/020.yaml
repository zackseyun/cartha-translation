revisions:
- from: Thầy tế lễ phải làm nghi thức đưa qua đưa lại các lễ vật ấy cùng với bánh hoa quả đầu mùa và hai con chiên con trước mặt Yahweh[a]. Chúng sẽ là vật thánh thuộc về Yahweh, dành cho thầy tế lễ.
  to: Thầy tế lễ phải làm lễ đưa qua đưa lại các lễ vật ấy cùng với bánh đầu mùa và hai con chiên, trước mặt Yahweh[a]. Chúng sẽ là vật thánh thuộc về Yahweh, dành cho thầy tế lễ.
  rationale: Sửa “bánh hoa quả đầu mùa” thành “bánh đầu mùa” để phản ánh chính xác hơn bánh gắn với lễ đầu mùa. Rút gọn cách gọi nghi thức thành “làm lễ đưa qua đưa lại” để tiếng Việt tự nhiên hơn mà vẫn giữ thuật ngữ tế tự. Các yếu tố còn lại, kể cả tính không xác định của “các lễ vật ấy” và sắc thái “thuộc về Yahweh, dành cho thầy tế lễ”, được giữ nguyên.
  reviewer_model: gpt-5.6-terra
