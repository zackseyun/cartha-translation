  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: vi
  text: Vào ngày anh em đưa bó lúa qua lại[a], anh em phải dâng một con chiên đực một tuổi, không tì vết, làm của lễ thiêu dâng lên Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đưa ô-me qua lại”. “Ô-me” là cách phiên âm một từ Hê-bơ-rơ cũng có thể chỉ đơn vị đong; nhưng trong bối cảnh này, nhiều khả năng từ ấy chỉ bó lúa được dùng trong nghi thức dâng lễ.'
    reason: Nêu phương án từ vựng và bảo tồn khả năng đa nghĩa của עֹמֶר.
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: anh em phải dâng
  rationale: Trong ngữ cảnh tế lễ, עשה mang nghĩa thực hiện hoặc dâng một sinh tế; “phải dâng” vừa tự nhiên vừa thể hiện tính bắt buộc.
- source_word: בְּיוֹם
  choice: Vào ngày
  rationale: Diễn đạt tự nhiên chỉ thời điểm của nghi thức được truyền phải thực hiện.
- source_word: הֲנִיפְכֶם
  choice: anh em đưa ... qua lại
  rationale: Dạng Hiphil của נוף chỉ động tác nghi lễ đưa lễ vật qua lại trước Yahweh; cách diễn đạt này rõ nghĩa hơn việc chỉ dùng “vẫy” trong tiếng Việt.
- source_word: הָעֹמֶר
  choice: bó lúa
  rationale: Trong bối cảnh mùa gặt, עֹמֶר nhiều khả năng là bó lúa dùng trong nghi thức, dù từ này cũng có thể chỉ đơn vị đong gọi là ô-me.
- source_word: כֶּבֶשׂ
  choice: một con chiên đực
  rationale: כֶּבֶשׂ chỉ chiên non; giống đực phù hợp với hình thức danh từ Hê-bơ-rơ và quy định tế lễ ở đây.
- source_word: תָּמִים
  choice: không tì vết
  rationale: Trong luật tế lễ, תמים chỉ con vật không có khuyết tật; “không tì vết” là cách nói trang trọng và quen thuộc.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ xác định tuổi con vật; “một tuổi” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: עֹלָה là loại tế lễ được thiêu trọn; “lễ thiêu” giữ được thuật ngữ tế lễ và dễ hiểu.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giới từ לְ chỉ đối tượng tiếp nhận lễ vật; giữ danh riêng giao ước Yahweh theo văn bản Hê-bơ-rơ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Văn bản dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa nghi lễ của תנופה qua động từ הניף
  choice: đưa bó lúa qua lại
  alternative: dâng bó lúa làm lễ đưa qua đưa lại
  rationale: Giữ động tác cụ thể được văn bản nêu mà không bổ sung công thức thần học hoặc chi tiết nghi lễ không có trong câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho chủ thể số nhiều và “phải” để thể hiện mệnh lệnh. “Đưa ... qua lại” diễn đạt cụ thể động tác nghi lễ, tránh từ “vẫy” dễ gợi sắc thái đời thường.
