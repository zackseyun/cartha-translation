  to: Vào ngày anh em đưa bó lúa qua lại[a], anh em phải dâng một con chiên đực một tuổi, không tì vết, làm của lễ thiêu dâng lên Yahweh.
  rationale: Chỉ điều chỉnh thuật ngữ עֹלָה thành “của lễ thiêu” để phản ánh đúng loại lễ vật, và làm chính xác hơn cách trình bày phương án “ô-me” trong chú thích. Không thay đổi ý nghĩa hoặc thêm chi tiết nghi lễ.
