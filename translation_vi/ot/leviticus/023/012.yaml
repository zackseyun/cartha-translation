    issue: “làm lễ thiêu” chưa xác định rõ עֹלָה là loại lễ vật được dâng.
    rationale: לְעֹלָה nghĩa là “làm của lễ thiêu”/“như một của lễ thiêu”; cách sửa tránh hiểu rằng con chiên chỉ thực hiện một nghi thức mang tên “lễ thiêu”.
  - severity: low
    issue: Chú thích gọi “ô-me” trực tiếp là “đơn vị đong” có thể làm mờ sự phân biệt giữa cách phiên âm thuật ngữ và nghĩa từ vựng trong ngữ cảnh.
    rationale: Nên nêu “ô-me” là cách phiên âm; từ này cũng có thể chỉ đơn vị đong, nhưng tại đây nhiều khả năng chỉ bó lúa trong nghi thức.
  revised_text: Vào ngày anh em đưa bó lúa qua lại[a], anh em phải dâng một con chiên đực một tuổi, không tì vết, làm của lễ thiêu dâng lên Yahweh.
