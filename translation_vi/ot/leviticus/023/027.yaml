base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: vi
  text: Nhưng vào ngày mồng mười của tháng bảy này[a] là Ngày Chuộc Tội. Đó sẽ là một cuộc hội họp thánh cho các ngươi; các ngươi phải khổ chế bản thân[b] và dâng lên Đức Giê-hô-va một lễ vật hỏa tế[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên gọi trong tiếng Hê-bơ-rơ có dạng số nhiều, theo nghĩa đen là “Ngày Các Sự Chuộc Tội”.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “phải hạ mình” hoặc “phải ép mình”. Cụm từ này không nhất thiết chỉ riêng việc kiêng ăn.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “lễ vật thực phẩm” hoặc “lễ vật được dâng bằng lửa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Nhưng
  rationale: Diễn tả sự chuyển ý có tính nhấn mạnh và giới hạn so với những chỉ dẫn về kỳ lễ trước đó.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: vào ngày mồng mười tháng bảy này
  rationale: Cách nói tự nhiên trong tiếng Việt về ngày trong tháng, đồng thời giữ đại từ chỉ định 'này' của nguyên văn.
- source_word: יוֹם הַכִּפֻּרִים
  choice: Ngày Chuộc Tội
  rationale: Dùng tên lễ trang trọng, quen thuộc và tự nhiên trong tiếng Việt; danh từ Hê-bơ-rơ ở dạng số nhiều có thể chỉ toàn bộ nghi thức chuộc tội chứ không nhất thiết đòi hỏi hình thức số nhiều trong tên gọi tiếng Việt.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Thể hiện một cuộc tụ họp được chính thức triệu tập vì mục đích thánh, thay vì chỉ một đám đông hay buổi họp thông thường.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: phải khổ chế bản thân
  rationale: Giữ nghĩa tự hạ mình và tự chịu thiếu thốn của thành ngữ nhưng không thu hẹp mệnh lệnh chỉ còn việc kiêng ăn.
- source_word: וְהִקְרַבְתֶּם
  choice: dâng lên
  rationale: Trong ngữ cảnh tế lễ, động từ chỉ việc đem lễ vật đến và trình dâng cho Đức Chúa Trời.
- source_word: אִשֶּׁה
  choice: một lễ vật hỏa tế
  rationale: Thuật ngữ tiếng Việt gọn và trang trọng, phản ánh lễ vật được dâng bằng lửa mà không khẳng định quá mức từ nguyên còn được tranh luận.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước יהוה bằng hình thức tiếng Việt phổ biến, giúp phân biệt với tước hiệu chung 'Chúa'.
theological_decisions:
- issue: Dạng số nhiều của כִּפֻּרִים trong tên ngày lễ
  choice: Ngày Chuộc Tội
  alternative: Ngày Các Sự Chuộc Tội
  rationale: Tiếng Hê-bơ-rơ dùng hình thức số nhiều, nhưng cụm này vận hành như tên gọi cố định của ngày lễ. Dịch số ít là tự nhiên trong tiếng Việt và không loại bỏ tính đa diện của các nghi thức chuộc tội; chú thích bảo tồn dữ kiện hình thái của nguyên văn.
- issue: Ý nghĩa của việc làm khổ chính mình
  choice: khổ chế bản thân
  alternative: hạ mình; ép mình; kiêng ăn
  rationale: Không thu hẹp thành ngữ vào riêng việc nhịn ăn hoặc chỉ một thái độ nội tâm; cách dịch giữ được chiều kích nghi lễ và ăn năn của mệnh lệnh.
- issue: Ý nghĩa chính xác của אִשֶּׁה
  choice: lễ vật hỏa tế
  alternative: lễ vật thực phẩm; lễ vật thiêu bằng lửa
  rationale: Từ này chỉ loại lễ vật được dâng qua lửa, nhưng mối liên hệ chính xác với 'lửa' hay 'thực phẩm' vẫn được bàn luận. Bản dịch chọn cách gọi truyền thống, tương đối trung tính và chú thích phương án khác.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng lối xưng hô số nhiều “các ngươi” phù hợp lời luật trực tiếp cho cộng đồng Y-sơ-ra-ên. “Ngày mồng mười” là cách nói tự nhiên trong tiếng Việt. Các thuật ngữ nghi lễ được giữ nhất quán và chú thích những điểm nguyên ngữ còn có nhiều cách hiểu.
