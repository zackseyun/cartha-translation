  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “YHWH”; theo truyền thống được dịch là “CHÚA.”'
    reason: Nêu dạng danh riêng trong nguyên văn Hê-bơ-rơ và cách dịch thay thế theo truyền thống; neo ngay sau “Yahweh”, là từ được chú thích.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời trực tiếp của Đức Chúa Trời được dịch là “phán”, cách diễn đạt tự nhiên và trang trọng trong tiếng Việt; וַ đánh dấu diễn tiến của lời thuật.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm quen thuộc của danh riêng YHWH trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Sau động từ “phán”, giới từ אֶל được diễn đạt tự nhiên trong tiếng Việt bằng “với”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn lời, “rằng” chuyển tải tự nhiên chức năng mở đầu nội dung phát ngôn của phân từ nguyên mẫu לֵאמֹר mà không lặp lại “phán/nói” một cách nặng nề.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” bảo tồn tính chất danh riêng và là dạng dễ nhận biết đối với độc giả Việt; chú thích nêu rõ dạng Hê-bơ-rơ để không che khuất chứng cứ nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích. “Phán… rằng” là công thức dẫn lời tự nhiên trong tiếng Việt. Dấu [a] đặt ngay sau “Môi-se” theo vị trí của lớp tham khảo tiếng Anh, dù nội dung chú thích liên quan đến danh “Đức Giê-hô-va”.
