  to: Các ngươi không được làm bất cứ công việc lao động nào, và phải dâng lên Đức Giê-hô-va một lễ vật dâng bằng lửa[a].
  rationale: Chỉ sửa cách diễn đạt thuật ngữ tế tự אִשֶּׁה để tiếng Việt tự nhiên hơn. Bản sửa vẫn phản ánh nghĩa thông thường «lễ vật dâng bằng lửa» và chú thích vẫn bảo lưu lựa chọn «lễ vật thực phẩm», vì nghĩa chính xác của thuật ngữ này có thảo luận học thuật.
