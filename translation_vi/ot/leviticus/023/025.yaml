  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: vi
  text: Các ngươi không được làm bất cứ công việc lao động nào, và phải dâng lên Đức Giê-hô-va một lễ vật dâng bằng lửa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một lễ vật thực phẩm”; hoặc “một lễ vật bằng lửa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: không được làm bất cứ ... nào
  rationale: Cấu trúc phủ định với כָּל mang ý nghĩa cấm toàn bộ loại công việc được nói đến; cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên lực bao quát.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: công việc lao động
  rationale: Cụm từ chỉ công việc lao động hay công việc thường nhật, chứ không nhất thiết mọi hành động; cách dịch này rõ ràng, trang trọng và không thu hẹp vào nghề nghiệp kiếm sống.
- source_word: וְהִקְרַבְתֶּם
  choice: và phải dâng lên
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa đem đến hoặc trình dâng làm lễ vật; “dâng lên” là cách nói tự nhiên trong tiếng Việt.
- source_word: אִשֶּׁה
  choice: một lễ vật dùng lửa dâng
  rationale: Danh từ tế tự này chỉ một lễ vật được dâng bằng lửa. Cách dịch giữ mối liên hệ với lửa mà không khẳng định quá mức rằng chính lễ vật là thức ăn.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước יהוה dưới dạng phiên âm quen thuộc trong tiếng Việt, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước. “Đức Giê-hô-va” là dạng danh riêng quen thuộc với độc giả Kinh Thánh tiếng Việt; không thay danh ấy bằng tước hiệu.
- issue: Ý nghĩa của thuật ngữ tế tự אִשֶּׁה
  choice: lễ vật dùng lửa dâng
  alternative: lễ vật thực phẩm; lễ vật bằng lửa
  rationale: Nguồn gốc và sắc thái chính xác của thuật ngữ có phần tranh luận. Bản chính giữ yếu tố dâng bằng lửa, còn chú thích bảo lưu cách hiểu “lễ vật thực phẩm” thường gặp trong nghiên cứu hiện đại.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng đại từ số nhiều “các ngươi” để phản ánh ngôi thứ hai số nhiều trong luật truyền cho cộng đồng; giữ nhịp câu luật lệ bằng “không được” và “phải”.
