- from: Các ngươi phải đếm đủ năm mươi ngày[a], cho đến ngày sau ngày Sa-bát thứ bảy; rồi các ngươi phải dâng một lễ vật ngũ cốc mới lên Đức Giê-hô-va.
  to: Các ngươi phải đếm năm mươi ngày[a], đến ngày sau Sa-bát thứ bảy; rồi các ngươi phải dâng một lễ vật bằng ngũ cốc mới cho Yahweh.
  rationale: Bản sửa loại bỏ sự lặp từ không tự nhiên trong cụm thời gian, dùng cách gọi tự nhiên hơn cho lễ vật מִנְחָה, và thống nhất việc chuyển יהוה là “Yahweh” theo hồ sơ POB. Thân bài vẫn giữ “Sa-bát thứ bảy”, không giải quyết thay người đọc vấn đề lịch pháp đang được chú thích nêu rõ.
