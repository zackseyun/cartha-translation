base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: vi
  text: Các ngươi phải đếm năm mươi ngày[a], đến ngày sau Sa-bát thứ bảy; rồi các ngươi phải dâng một lễ vật bằng ngũ cốc mới cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đến ngày sau tuần thứ bảy.” Bản Hê-bơ-rơ ghi “ngày sau Sa-bát thứ bảy”; các cách hiểu khác nhau về cách diễn đạt việc tính kỳ lễ này theo lịch.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מִמָּחֳרַת
  choice: cho đến ngày sau
  rationale: Diễn đạt tự nhiên giới hạn thời gian của việc đếm, đồng thời giữ quan hệ trực tiếp với mệnh đề thời gian trong tiếng Hê-bơ-rơ.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: ngày Sa-bát thứ bảy
  rationale: Giữ nguyên từ שַׁבָּת của bản nguồn thay vì chuyển thành cách giải thích là “tuần lễ thứ bảy”; thêm “ngày” để tiếng Việt rõ và tự nhiên.
- source_word: תִּסְפְּרוּ חֲמִשִּׁים יוֹם
  choice: các ngươi phải đếm đủ năm mươi ngày
  rationale: “Phải” phù hợp với chỉ thị luật định; “đủ” làm rõ số ngày phải đạt tới mà không thay đổi nội dung.
- source_word: וְהִקְרַבְתֶּם
  choice: rồi các ngươi phải dâng
  rationale: Trong ngữ cảnh tế lễ, động từ có nghĩa đem đến hoặc trình dâng lễ vật; “rồi” biểu thị trình tự của câu.
- source_word: מִנְחָה חֲדָשָׁה
  choice: một lễ vật ngũ cốc mới
  rationale: מִנְחָה trong hệ thống tế lễ Lê-vi thường chỉ lễ vật bằng ngũ cốc; חֲדָשָׁה được giữ là “mới”, có thể hàm ý sản vật mới.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Dùng danh riêng giao ước cho יהוה; “dâng ... lên” là kết hợp từ tự nhiên trong tiếng Việt đối với lễ vật dâng cho Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng giao ước thay vì thay bằng tước hiệu. Dạng “Đức Giê-hô-va” quen thuộc, trang trọng và dễ hiểu trong tiếng Việt.
- issue: Có nên diễn giải הַשַּׁבָּת הַשְּׁבִיעִת là “tuần lễ thứ bảy” hay không
  choice: ngày Sa-bát thứ bảy
  alternative: tuần lễ thứ bảy
  rationale: Bản Hê-bơ-rơ dùng שַׁבָּת, không dùng từ thông thường chỉ “tuần lễ”; bản dịch chính giữ cách nói của nguồn và đưa cách hiểu lịch pháp khác vào chú thích.
translation_notes:
  register: Văn phong luật định, trang trọng nhưng hiện đại. Đại từ “các ngươi” phản ánh lời truyền cho cộng đồng trong ngữ cảnh luật pháp; thuật ngữ “lễ vật ngũ cốc” rõ nghĩa hơn “của lễ chay” đối với độc giả hiện đại.
