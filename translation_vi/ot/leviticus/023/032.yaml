  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הוּא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם בְּ/תִשְׁעָ֤ה לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב מֵ/עֶ֣רֶב עַד עֶ֔רֶב תִּשְׁבְּת֖וּ שַׁבַּתְּ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: vi
  text: Đó là ngày sa-bát, ngày nghỉ hoàn toàn dành cho anh em; anh em phải hãm mình[a]. Vào chiều ngày mồng chín trong tháng, từ chiều đến chiều[b], anh em phải giữ ngày sa-bát của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hạ mình”, “tự làm khổ mình” hoặc “tự chế”. Thành ngữ Hê-bơ-rơ này nói đến việc hãm mình trong sự sám hối; theo truyền thống, điều này gắn với việc kiêng ăn.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “từ chiều đến chiều”; cách nói này xác định thời gian tuân giữ ngày này theo cách tính ngày của người Y-sơ-ra-ên.'
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: ngày sa-bát để anh em nghỉ hoàn toàn
  rationale: Cặp danh từ nhấn mạnh sự ngừng mọi công việc và nghỉ trọn vẹn. Cách dịch này giữ được sắc thái tăng cường mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: anh em phải hãm mình
  rationale: Trong ngữ cảnh nghi lễ, cụm từ chỉ việc tự làm khổ hoặc tự chế trong tinh thần ăn năn; נֶפֶשׁ ở đây mang chức năng phản thân, nên dịch là “mình” thay vì “linh hồn”.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: vào chiều ngày mồng chín trong tháng
  rationale: Giữ đúng trình tự và thời điểm được nêu trong tiếng Hê-bơ-rơ, đồng thời dùng cách diễn đạt ngày tháng tự nhiên trong tiếng Việt.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: từ chiều đến chiều
  rationale: Dịch sát cấu trúc tiếng Hê-bơ-rơ và không tự ý thay “chiều” bằng “lúc mặt trời lặn”, dù đó có thể là ý nghĩa thực hành.
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: anh em phải giữ kỳ nghỉ sa-bát của mình
  rationale: Diễn đạt thành ngữ gồm động từ “ngừng/nghỉ” và danh từ “sa-bát” theo cách dễ hiểu, đồng thời bảo tồn ý niệm tuân giữ kỳ nghỉ được truyền lệnh.
theological_decisions:
- issue: Ý nghĩa của việc tự làm khổ trong bối cảnh nghi lễ
  choice: hãm mình
  alternative: kiêng ăn; hạ mình; tự làm khổ mình
  rationale: Câu Hê-bơ-rơ không nói thẳng là “kiêng ăn”, dù truyền thống thực hành có liên hệ chặt chẽ với việc kiêng ăn. Bản dịch chính giữ phạm vi nghĩa rộng hơn và ghi các khả năng diễn giải trong chú thích.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Sa-bát” được giữ như thuật ngữ Kinh Thánh quen thuộc; “anh em” biểu đạt đại từ số nhiều của nguyên văn mà không đưa thêm phân biệt giới tính không có trong ngữ cảnh.
