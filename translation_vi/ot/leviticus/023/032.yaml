  - severity: low
    issue: Chú thích b dùng cụm “giữ lễ”.
    rationale: Nguyên văn không gọi đây là một “lễ” trong câu này, mà quy định thời gian tuân giữ ngày sa-bát. Đổi thành “tuân giữ ngày này” tránh thêm sắc thái không cần thiết.
