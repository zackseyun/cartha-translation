- from: Đó là ngày sa-bát để anh em nghỉ hoàn toàn; anh em phải hãm mình[a]. Vào chiều ngày mồng chín trong tháng, từ chiều đến chiều[b], anh em phải giữ kỳ nghỉ sa-bát của mình.
  to: Đó là ngày sa-bát, ngày nghỉ hoàn toàn dành cho anh em; anh em phải hãm mình[a]. Vào chiều ngày mồng chín trong tháng, từ chiều đến chiều[b], anh em phải giữ ngày sa-bát của anh em.
