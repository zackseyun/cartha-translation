  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: vi
  text: Vào ngày thứ nhất, sẽ có một cuộc triệu tập thánh[a]; các ngươi không được làm bất cứ công việc lao động thường ngày nào[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một cuộc nhóm họp thánh” hoặc “một hội họp thánh”. Cụm từ Hê-bơ-rơ מִקְרָא קֹדֶשׁ là một thuật ngữ chỉ cuộc tụ họp thánh được chính thức triệu tập.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “công việc thường ngày” hoặc, theo nghĩa sát hơn, “công việc phục dịch”. Cụm từ này chỉ lao động thông thường gắn với nghề nghiệp hay sự phục vụ, không nhất thiết bao gồm mọi hoạt động.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Ngày thứ nhất
  rationale: Cụm giới từ chỉ thời gian với số thứ tự được diễn đạt tự nhiên và sát nghĩa trong tiếng Việt là “Ngày thứ nhất”.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: מִקְרָא mang sắc thái một cuộc tụ họp được triệu tập, còn קֹדֶשׁ xác định tính thánh biệt; cách dịch này giữ được cả yếu tố triệu tập lẫn tính chất thánh.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc lao động nào
  rationale: Cụm từ nói đến công việc lao động hay nghề nghiệp thông thường bị cấm trong ngày lễ, chứ không nhất thiết cấm mọi hành động; “công việc lao động” bám sát hai thành tố מְלָאכָה và עֲבֹדָה.
- source_word: לֹא תַעֲשׂוּ
  choice: các ngươi không được làm
  rationale: Thể chưa hoàn thành ngôi hai số nhiều trong quy định pháp luật được diễn đạt tự nhiên bằng lệnh cấm “các ngươi không được làm”.
