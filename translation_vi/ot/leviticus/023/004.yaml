source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: vi
  text: Đây là những kỳ đã định[a] của Yahweh, tức những cuộc hội họp thánh[b], mà anh em phải công bố vào đúng thời điểm đã định của mỗi kỳ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các kỳ lễ đã định” hoặc “những thời điểm ấn định”. Từ Hê-bơ-rơ מוֹעֵד có nghĩa rộng hơn một lễ hội và chỉ những thời điểm do Yahweh ấn định.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những cuộc triệu tập thánh” hoặc “những buổi nhóm họp thánh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ thị số nhiều mở đầu danh sách; tiếng Việt dùng tự nhiên cấu trúc “Đây là”.
- source_word: מוֹעֲדֵי
  choice: những kỳ đã định
  rationale: מוֹעֵד chỉ thời gian hay dịp được ấn định; cách dịch này giữ trọng tâm thời gian và đủ rộng để bao gồm cả ngày sa-bát lẫn các kỳ lễ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: những cuộc hội họp thánh
  rationale: Cụm từ chỉ những dịp dân chúng được triệu tập để hội họp với tính chất biệt riêng; cách diễn đạt này tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: mà anh em phải công bố
  rationale: Trong ngữ cảnh này, קרא mang nghĩa công khai loan báo hay ấn định việc cử hành, không chỉ đơn thuần là gọi tên. Đại từ số nhiều được tiếng Việt hiểu theo bổ ngữ đứng trước.
- source_word: בְּמוֹעֲדָם
  choice: vào kỳ đã định cho chúng
  rationale: Giữ sự lặp lại từ מוֹעֵד và diễn đạt rằng mỗi dịp phải được công bố vào thời điểm riêng đã ấn định cho nó.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Phạm vi nghĩa của מוֹעֵד
  choice: kỳ đã định
  alternative: kỳ lễ
  rationale: Chương này dùng thuật ngữ cho các thời điểm thánh được ấn định, kể cả ngày sa-bát; vì vậy không thu hẹp nghĩa thành những lễ hội hay yến tiệc.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh em” biểu đạt ngôi thứ hai số nhiều hướng đến cộng đồng Israel; “kỳ đã định” được lặp lại để phản ánh phép lặp từ vựng trong nguyên văn.
