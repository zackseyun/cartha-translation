source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֲמִשָּׁ֨ה עָשָׂ֜ר י֗וֹם לַ/חֹ֤דֶשׁ הַ/שְּׁבִיעִי֙ הַ/זֶּ֔ה חַ֧ג הַ/סֻּכּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים לַ/יהֹוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: vi
  text: '“Hãy nói với con dân Israel rằng: Vào ngày mười lăm của tháng thứ bảy này là Lễ Lều Trại[a] trong bảy ngày, dành cho Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo truyền thống: “Lễ Lều Tạm.”'
    reason: Ghi nhận tên gọi truyền thống của lễ, trong khi thân bài chuyển ngữ minh bạch הַסֻּכּוֹת là các lều/chòi tạm.
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Hãy nói với con dân Israel rằng
  rationale: Giữ sắc thái mệnh lệnh và công thức dẫn lời của nguyên văn. “Con dân Israel” là cách nói tự nhiên, trang trọng trong tiếng Việt, chỉ chung cộng đồng giao ước mà không giới hạn vào nam giới.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: Vào ngày mười lăm của tháng thứ bảy này
  rationale: Chuyển công thức ghi ngày tháng Hê-bơ-rơ sang trật tự tự nhiên trong tiếng Việt, đồng thời giữ đại từ chỉ định “này”.
- source_word: חַג הַסֻּכּוֹת
  choice: Lễ Lều Tạm
  rationale: סֻכּוֹת là các lều hoặc chỗ trú tạm. “Lễ Lều Tạm” vừa phản ánh nghĩa gốc vừa là tên lễ quen thuộc và dễ hiểu trong tiếng Việt.
- source_word: שִׁבְעַת יָמִים
  choice: kéo dài bảy ngày
  rationale: Nguyên văn nêu khoảng thời gian bằng một cụm danh từ. Thêm “kéo dài” làm rõ quan hệ cú pháp trong tiếng Việt mà không thêm nội dung.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giữ danh riêng giao ước יהוה là “Yahweh”. “Dành cho” diễn đạt tự nhiên nét nghĩa quy hướng hoặc biệt riêng của giới từ ל mà không xác định quá mức đó là dâng lễ hay thuộc quyền sở hữu.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; giữ “Yahweh” giúp phân biệt danh riêng này với một tước hiệu.
- issue: Tên lễ סֻכּוֹת
  choice: Lễ Lều Tạm
  alternative: Lễ Lều Trại; Lễ các lều
  rationale: “Lễ Lều Tạm” chuyển tải bản chất tạm thời của các lều, đồng thời phù hợp cách gọi đã quen thuộc trong tiếng Việt. Chú thích nêu sát hình thức số nhiều của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ cấu trúc lời truyền phán của sách Lê-vi, nhưng dùng trật tự từ tự nhiên trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau tên lễ mà chú thích giải thích.
