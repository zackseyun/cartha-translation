- from: '“Hãy nói với con dân Israel rằng: Vào ngày mười lăm của tháng thứ bảy này là Lễ Lều Tạm[a], kéo dài bảy ngày, dành cho Yahweh.”'
  to: '“Hãy nói với con dân Israel rằng: Vào ngày mười lăm của tháng thứ bảy này là Lễ Lều Trại[a] trong bảy ngày, dành cho Yahweh.”'
  rationale: Bản sửa ưu tiên nghĩa trực tiếp của הַסֻּכּוֹת trong thân bài, đồng thời bảo lưu tên gọi quen thuộc theo truyền thống ở chú thích. Các yếu tố ngữ nghĩa khác—đối tượng được truyền lệnh, ngày tháng, thời lượng, và sự quy hướng về Yahweh—đều được giữ nguyên.
