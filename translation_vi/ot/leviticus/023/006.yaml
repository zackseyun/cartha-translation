  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: vi
  text: Vào ngày mười lăm của tháng này là Lễ Bánh Không Men dành cho Yahweh[a]; trong bảy ngày, các ngươi phải ăn bánh không men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuộc về Yahweh” hoặc “dâng cho Yahweh.” Giới từ Hê-bơ-rơ có thể diễn tả sự dâng hiến hoặc sự thuộc về.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר יוֹם
  choice: Ngày mười lăm
  rationale: Đây là cách diễn đạt ngày thứ mười lăm theo lối tính lịch; tiếng Việt tự nhiên không cần dịch liên từ וּ ở đầu câu thành “và” trong ngữ cảnh quy định nối tiếp.
- source_word: לַ/חֹדֶשׁ הַ/זֶּה
  choice: tháng này
  rationale: Cụm từ xác định ngày trong tháng đang được nói đến; “ngày mười lăm tháng này” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: חַג הַ/מַּצּוֹת
  choice: Lễ Bánh Không Men
  rationale: חַג chỉ một lễ hội tôn giáo, còn הַמַּצּוֹת là tên đặc định của lễ; cách viết hoa cho thấy đây là tên lễ, không phải chỉ món ăn.
- source_word: לַ/יהוָה
  choice: dành cho Yahweh
  rationale: Giữ danh riêng giao ước יהוה là “Yahweh”; “dành cho” diễn đạt tự nhiên quan hệ dâng hiến hoặc thuộc về do giới từ ל biểu thị, đồng thời chú thích bảo lưu khả năng khác.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Cụm chỉ khoảng thời gian mà việc ăn bánh không men được thực hiện; “trong bảy ngày” tự nhiên và không hàm ý vượt quá khoảng thời gian ấy.
- source_word: מַצּוֹת
  choice: bánh không men
  rationale: Danh từ số nhiều chỉ các bánh không dùng men, nhưng tiếng Việt thường dùng danh từ khối “bánh không men” cho loại thực phẩm này.
- source_word: תֹּאכֵלוּ
  choice: các ngươi phải ăn
  rationale: Động từ ngôi thứ hai số nhiều mang lực quy định trong văn bản luật lệ; “phải ăn” truyền đạt rõ nghĩa bắt buộc, còn “các ngươi” giữ số nhiều và sắc thái trang trọng.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh giao ước יהוה; phiên âm “Yahweh” giữ tư cách danh riêng thay vì thay bằng một tước hiệu.
- issue: Quan hệ của lễ với Yahweh trong לַ/יהוָה
  choice: dành cho Yahweh
  alternative: thuộc về Yahweh; dâng cho Yahweh
  rationale: Giới từ ל có thể biểu thị sự dành riêng, dâng hiến hoặc thuộc về. Bản chính dùng cách nói rộng “dành cho” và chú thích nêu các khả năng để không giải quyết dứt khoát điều nguyên văn còn linh hoạt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lễ Bánh Không Men” được dùng như tên riêng của ngày lễ; “các ngươi” duy trì cách xưng hô số nhiều trong quy định dành cho cộng đồng.
