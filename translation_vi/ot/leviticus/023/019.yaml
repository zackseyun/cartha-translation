source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: vi
  text: Các ngươi phải dâng một con dê đực làm lễ vật chuộc tội[a], và hai con chiên đực một tuổi làm sinh tế bình an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sinh tế thông công”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: các ngươi phải dâng
  rationale: Động từ có nghĩa cơ bản là “làm”, nhưng trong ngữ cảnh quy định về sinh tế, “dâng” diễn đạt tự nhiên và chính xác hành động nghi lễ.
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: một con dê đực
  rationale: Giữ nguyên số lượng và giới tính của con vật hiến tế.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Đây là cách gọi quen thuộc, dễ hiểu của loại lễ vật חַטָּאת; chức năng thanh tẩy có thể được nhấn mạnh bằng cách dịch khác nên được bảo lưu trong chú thích.
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: và hai con chiên đực
  rationale: כְבָשִׂים chỉ chiên non và trong quy định hiến tế này là chiên đực; bản dịch nêu rõ giới tính.
- source_word: בְּנֵי שָׁנָה
  choice: một tuổi
  rationale: Dịch trực tiếp thành ngữ Hê-bơ-rơ chỉ những con vật một tuổi.
- source_word: לְזֶבַח שְׁלָמִים
  choice: làm sinh tế bình an
  rationale: “Sinh tế” phản ánh זֶבַח là lễ tế có giết con vật, còn “bình an” giữ mối liên hệ gần với שְׁלָמִים mà không thu hẹp ý nghĩa vào riêng khía cạnh thông công.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Cách dịch chính quen thuộc và dễ nhận biết, trong khi chú thích giữ lại cách hiểu nhấn mạnh chức năng thanh tẩy mà không quyết định thay người đọc về toàn bộ thần học của lễ này.
- issue: Cách dịch שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công
  rationale: “Bình an” gần với từ Hê-bơ-rơ và tên gọi truyền thống của loại sinh tế hơn; “thông công” làm nổi bật một khía cạnh diễn giải nên được ghi ở chú thích.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “các ngươi” để thể hiện lời truyền cho cộng đồng số nhiều; dùng thuật ngữ tế lễ nhất quán và dễ hiểu, tránh lối diễn đạt quá cổ.
