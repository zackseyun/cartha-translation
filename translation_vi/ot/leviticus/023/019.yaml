  source_fidelity: 'Bản dịch giữ đúng cấu trúc và nội dung Hê-bơ-rơ: một dê đực làm lễ חטאת, cùng hai chiên đực một tuổi làm sinh tế שְׁלָמִים. “Dâng” là cách chuyển ngữ thích hợp cho וַעֲשִׂיתֶם trong ngữ cảnh tế lễ. Số lượng, giới tính, và độ tuổi của các con vật đều được bảo toàn.'
  naturalness: Câu văn rõ ràng, tự nhiên trong văn phong quy định tế lễ trang trọng mà vẫn có thể hiểu được trong tiếng Việt hiện đại. “Các ngươi phải dâng” phù hợp với ngôi số nhiều của lời truyền lệnh. “Sinh tế bình an” là thuật ngữ Kinh Thánh có tính chuyên biệt nhưng vẫn sáng nghĩa trong ngữ cảnh.
  terminology: “Lễ vật chuộc tội” chuyển tải cách gọi truyền thống của חַטָּאת, đồng thời chú thích bảo lưu cách hiểu “lễ vật thanh tẩy” mà không áp đặt một diễn giải thần học. “Sinh tế bình an” phản ánh gần nghĩa שְׁלָמִים; chú thích “sinh tế thông công” nêu một phương án quen dùng mang tính diễn giải hơn. Các dấu chú thích được đặt đúng tại các thuật ngữ tương ứng.
