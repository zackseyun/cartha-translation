reference: Leviticus 23:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: vi
  text: Vào ngày thứ nhất, các ngươi phải lấy cho mình trái của cây đẹp đẽ[a], tàu lá chà là, cành cây rậm lá và cành liễu bên khe suối; rồi các ngươi phải vui mừng trước mặt Yahweh, Đức Chúa Trời của các ngươi, suốt bảy ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể là “trái thanh yên” (etrog), theo truyền thống Do Thái về sau. Tiếng Hê-bơ-rơ theo nghĩa đen là “trái của cây đẹp đẽ/lộng lẫy.”
    reason: Bảo tồn cách hiểu truyền thống như một khả năng mà không thu hẹp cụm từ khái quát trong nguyên văn.
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: các ngươi phải lấy cho mình
  rationale: Cấu trúc động từ trong văn mệnh lệnh pháp luật mang ý nghĩa chỉ thị; “phải lấy” diễn đạt rõ sức bắt buộc, còn “cho mình” giữ lại לָכֶם.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: vào ngày thứ nhất
  rationale: Dịch trực tiếp cụm từ chỉ thời gian, không thêm “của kỳ lễ” vì điều đó chỉ được hiểu từ văn cảnh.
- source_word: פְּרִי עֵץ הָדָר
  choice: trái của cây đẹp đẽ
  rationale: הָדָר chỉ vẻ đẹp, sự lộng lẫy hoặc huy hoàng. Cách dịch khái quát này giữ nguyên phạm vi nghĩa của tiếng Hê-bơ-rơ và không đưa cách đồng nhất hóa muộn hơn với thanh yên vào chính văn.
- source_word: כַּפֹּת תְּמָרִים
  choice: tàu lá chà là
  rationale: כַּפֹּת trong cụm này chỉ phần lá lớn của cây chà là. “Tàu lá chà là” tự nhiên và chính xác hơn “cành cây chà là” trong tiếng Việt.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: cành cây rậm lá
  rationale: עָבֹת mang nghĩa dày, rậm, có lẽ nói về tán lá; “rậm lá” truyền đạt hình ảnh ấy rõ ràng mà không xác định một loài cây không được nêu trong nguyên văn.
- source_word: וְעַרְבֵי נָחַל
  choice: cành liễu bên khe suối
  rationale: עַרְבֵי chỉ cây liễu hoặc một loại cây tương tự mọc ven nước, còn נָחַל là khe suối hoặc lòng suối; thêm “cành” phù hợp với chuỗi vật liệu thực vật được lấy.
- source_word: וּשְׂמַחְתֶּם
  choice: các ngươi phải vui mừng
  rationale: Động từ mang nghĩa vui mừng, hân hoan; trong văn cảnh chỉ thị, “phải vui mừng” giữ cả nội dung từ vựng lẫn sắc thái mệnh lệnh.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: trước mặt Yahweh, Đức Chúa Trời của các ngươi
  rationale: לִפְנֵי được diễn đạt tự nhiên là “trước mặt”; danh riêng giao ước יהוה được phiên là “Yahweh” thay vì thay bằng một tước hiệu.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: “Trong” diễn đạt tự nhiên khoảng thời gian kéo dài bảy ngày trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng và không thay nó bằng một tước hiệu.
- issue: Nhận diện פְּרִי עֵץ הָדָר
  choice: cụm từ khái quát “trái của cây đẹp đẽ”
  alternative: trái thanh yên (etrog)
  rationale: Truyền thống Do Thái về sau thường hiểu đây là trái thanh yên, nhưng bản thân cụm Hê-bơ-rơ có nghĩa rộng hơn. Chính văn giữ sự không xác định ấy, còn cách hiểu truyền thống được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời truyền phán trực tiếp cho cộng đồng số nhiều; cấu trúc câu giữ nhịp liệt kê của nguyên văn nhưng chọn các thuật ngữ thực vật tự nhiên trong tiếng Việt.
