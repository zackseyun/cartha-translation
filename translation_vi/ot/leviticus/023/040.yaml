revisions:
- from: Vào ngày thứ nhất, các ngươi phải lấy cho mình trái của cây đẹp đẽ[a], tàu lá chà là, cành cây rậm lá và cành liễu bên khe suối; rồi các ngươi phải vui mừng trước mặt Yahweh, Đức Chúa Trời của các ngươi, trong bảy ngày.
  to: Vào ngày thứ nhất, các ngươi phải lấy cho mình trái của cây đẹp đẽ[a], tàu lá chà là, cành cây rậm lá và cành liễu bên khe suối; rồi các ngươi phải vui mừng trước mặt Yahweh, Đức Chúa Trời của các ngươi, suốt bảy ngày.
