  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: vi
  text: Bất cứ ai làm bất cứ công việc nào ngay trong ngày này, Ta sẽ tiêu diệt người đó khỏi giữa dân mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta sẽ dứt người đó khỏi giữa dân mình.” Động từ Hê-bơ-rơ ở đây có nghĩa là “tiêu diệt/làm cho chết mất,” chứ không phải động từ thường dùng với nghĩa “dứt bỏ.” Tuy vậy, cả hai cách diễn đạt đều liên hệ đến sự loại bỏ trong phán xét.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: người
  rationale: Trong văn luật pháp giao ước, נֶפֶשׁ ở đây chỉ một cá nhân, không riêng phần linh hồn; “người” tự nhiên và đúng nghĩa trong cả hai lần xuất hiện.
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: làm bất kỳ công việc gì
  rationale: Cách diễn đạt này truyền đạt tự nhiên động từ עשה đi với מְלָאכָה, đồng thời giữ phạm vi bao quát của כָּל.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: trong chính ngày ấy
  rationale: “Chính” giữ sắc thái nhấn mạnh của thành ngữ עֶצֶם הַיּוֹם; “ngày ấy” liên kết tự nhiên với ngày đang được quy định trong ngữ cảnh.
- source_word: וְהַאֲבַדְתִּי
  choice: Ta sẽ tiêu diệt
  rationale: Dạng Hiphil của אבד có nghĩa “làm cho chết mất/tiêu diệt”; “tiêu diệt” phản ánh trực tiếp lực nghĩa của động từ hơn một thuật ngữ kỹ thuật như “khai trừ”.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: khỏi dân mình
  rationale: Cụm này diễn tả việc người ấy bị loại khỏi cộng đồng trong sự phán xét. “Dân mình” tránh áp đặt giới tính tự nhiên từ giống ngữ pháp giống cái của נֶפֶשׁ.
theological_decisions:
- issue: Bản chất hình phạt trong וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ
  choice: Ta sẽ tiêu diệt người đó khỏi dân mình
  alternative: Ta sẽ loại người đó khỏi dân mình
  rationale: Bản Hê-bơ-rơ dùng אבד ở dạng Hiphil, nghĩa là “tiêu diệt/làm cho chết mất,” chứ không dùng כרת, động từ thường được dịch là “loại trừ” hay “dứt bỏ.” Vì vậy bản chính giữ lực nghĩa trực tiếp, còn chú thích bảo tồn cách hiểu nhấn mạnh việc bị loại khỏi cộng đồng mà không xác định quá mức cơ chế của hình phạt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” biểu thị lời Đức Chúa Trời; “bất cứ người nào” và “người đó” có nghĩa bao gồm mọi giới. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
