revisions:
- from: Còn bất cứ người nào làm bất kỳ công việc gì trong chính ngày ấy, Ta sẽ tiêu diệt người đó khỏi dân mình.[a]
  to: Bất cứ ai làm bất cứ công việc nào ngay trong ngày này, Ta sẽ tiêu diệt người đó khỏi giữa dân mình.[a]
  rationale: Điều chỉnh cách diễn đạt thời điểm để phản ánh tự nhiên và đầy đủ hơn thành ngữ nhấn mạnh “ngày này”; thay “khỏi dân mình” bằng “khỏi giữa dân mình” để bộc lộ rõ hơn cụm מִקֶּרֶב. Chú thích được sửa để phân biệt chính xác động từ אבד với động từ thường dùng cho ý “dứt bỏ,” mà không áp đặt cách hiểu về cơ chế hình phạt.
  reviewer_model: gpt-5.6-terra
