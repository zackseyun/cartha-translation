id: LEV.23.7
reference: Leviticus 23:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בַּ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: vi
  text: Ngày thứ nhất, các ngươi phải có một cuộc hội họp thánh[a]; không được làm bất cứ công việc lao động thường ngày nào[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cuộc nhóm họp thiêng liêng” hoặc “một hội chúng thánh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “công việc lao động/phục vụ”, tức công việc thường ngày.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Ngày thứ nhất
  rationale: Diễn đạt tự nhiên mốc thời gian do giới từ בְּ, danh từ xác định và số thứ tự tạo thành.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: “Hội họp” chuyển tải ý nghĩa một cuộc triệu tập/tập hợp trong bối cảnh nghi lễ; “thánh” giữ sắc thái biệt riêng cho Đức Chúa Trời.
- source_word: יִהְיֶה לָכֶם
  choice: các ngươi phải có
  rationale: Cách nói tự nhiên trong tiếng Việt, thể hiện quy định rằng cộng đồng phải có cuộc hội họp ấy, dù cấu trúc sát chữ là “sẽ có cho các ngươi”.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc lao động thường ngày nào
  rationale: “Bất cứ… nào” giữ phạm vi bao quát của כָּל dưới thể phủ định; “lao động thường ngày” phản ánh cụm chỉ công việc phục vụ/lao động thông thường, không đồng nhất với mọi hành động có thể có.
- source_word: לֹא תַעֲשׂוּ
  choice: không được làm
  rationale: Thể hiện rõ lệnh cấm pháp quy, tự nhiên hơn trong tiếng Việt hiện đại so với cách dịch sát hình thái tương lai.
theological_decisions:
- issue: Phạm vi lệnh cấm trong מְלֶאכֶת עֲבֹדָה
  choice: Cấm mọi công việc lao động thường ngày.
  alternative: Cấm tuyệt đối mọi loại công việc hoặc hành động.
  rationale: Cụm từ chuyên biệt trong luật về các kỳ lễ hẹp hơn một lệnh cấm trần trụi đối với mọi công việc; bản dịch giữ giới hạn ấy mà không quy định thêm những ngoại lệ không được câu này nêu rõ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Đại từ “các ngươi” phù hợp lời truyền trực tiếp cho toàn dân trong văn mạch Lê-vi Ký; “cuộc hội họp thánh” dễ hiểu hơn thuật ngữ Hán-Việt cổ, đồng thời giữ sắc thái nghi lễ.
