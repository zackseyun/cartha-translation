id: LEV.23.43
reference: Leviticus 23:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: vi
  text: để các thế hệ của các ngươi biết rằng Ta đã cho con cái Israel ở trong các lều tạm[a] khi Ta đưa họ ra khỏi đất Ai Cập. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những chỗ trú tạm.” Từ Hê-bơ-rơ sukkot chỉ các lều hoặc chỗ trú có tính tạm thời.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ דֹרֹתֵיכֶם
  choice: để qua mọi thế hệ, các ngươi biết
  rationale: Diễn đạt tự nhiên mục đích của לְמַעַן với động từ chưa hoàn thành, đồng thời giữ ý sự hiểu biết phải được duy trì qua các thế hệ của cộng đồng giao ước.
- source_word: בַסֻּכּוֹת
  choice: trong những căn lều
  rationale: סֻכּוֹת chỉ những lều hoặc chỗ trú tạm; “căn lều” dễ hiểu trong tiếng Việt hiện đại và giữ liên hệ với Lễ Lều Tạm.
- source_word: הוֹשַׁבְתִּי
  choice: Ta đã cho ... ở
  rationale: Giữ sắc thái khiến/cho ở của thể Hiphil, nhưng tự nhiên hơn cách dịch cứng “khiến cư ngụ”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ gần nghĩa đen của cụm từ Hê-bơ-rơ và cách gọi tập thể mang tính giao ước, không giới hạn vào nam giới.
- source_word: בְּהוֹצִיאִי אוֹתָם
  choice: khi Ta đưa họ ra
  rationale: Tiền tố בְּ với động từ nguyên thể cấu trúc biểu thị hoàn cảnh thời gian; “khi” là cách diễn đạt tự nhiên và chính xác.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: khỏi đất Ai Cập
  rationale: Giữ danh từ “đất/xứ” có trong nguyên văn và diễn đạt hướng rời khỏi bằng “khỏi”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Diễn đạt trực tiếp công thức giao ước, với đại từ số nhiều phù hợp nguyên văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh giao ước; “Yahweh” bảo tồn đây là danh riêng, không biến nó thành tước hiệu.
- issue: Cách hiểu בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel / người Israel
  rationale: “Con cái Israel” giữ hình thức và âm hưởng giao ước của nguyên ngữ, trong khi được hiểu theo nghĩa tập thể gồm toàn dân.
- issue: Bản chất của nơi ở trong סֻכּוֹת
  choice: những căn lều
  alternative: những chỗ trú tạm
  rationale: Không xác định thêm vật liệu hay hình thức mà nguyên văn không nói; chú thích nêu phương án rộng hơn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Ta/các ngươi” để phản ánh lời phán trực tiếp của Đức Chúa Trời với cộng đồng số nhiều; giữ danh Yahweh và cụm “con cái Israel” vì giá trị giao ước.
