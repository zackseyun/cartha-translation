source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: vi
  text: Tuy nhiên, vào ngày mười lăm của tháng thứ bảy, khi các ngươi đã thu gom hoa lợi của đất, các ngươi phải cử hành lễ hội[a] của Yahweh trong bảy ngày. Ngày thứ nhất là một ngày nghỉ trang trọng[b], và ngày thứ tám cũng là một ngày nghỉ trang trọng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “kỳ lễ”. Từ Hê-bơ-rơ có thể chỉ một cuộc cử hành lễ hội, thường là kỳ lễ hành hương.
    reason: lexical_alternative
  - marker: b
    text: Hay “kỳ nghỉ như ngày Sa-bát”. Từ Hê-bơ-rơ chỉ sự ngưng nghỉ đặc biệt gắn với việc cử hành nghi lễ thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Ở đây, từ này đánh dấu sự chuyển tiếp và bổ sung một quy định cụ thể sau phần tóm lược trước đó; “Tuy nhiên” giữ được sắc thái chuyển ý mà không biến nó thành sự nhấn mạnh tuyệt đối.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: vào ngày mười lăm tháng thứ bảy
  rationale: Cách diễn đạt ngày tháng tự nhiên trong tiếng Việt, đồng thời bảo toàn đầy đủ mốc thời gian của tiếng Hê-bơ-rơ.
- source_word: בְּאָסְפְּכֶם
  choice: khi các ngươi đã thu gom
  rationale: Cấu trúc với בְּ diễn tả hoàn cảnh thời gian; “đã thu gom” phản ánh việc thu sản vật vào sau mùa gặt mà không giới hạn nghĩa vào riêng ngũ cốc.
- source_word: תְּבוּאַת הָאָרֶץ
  choice: hoa lợi của đất
  rationale: תְּבוּאָה chỉ sản vật hay hoa lợi nói chung. “Hoa lợi của đất” vừa rộng nghĩa vừa phù hợp bối cảnh nông nghiệp.
- source_word: תָּחֹגּוּ אֶת חַג
  choice: các ngươi phải cử hành lễ hội
  rationale: Động từ חגג và danh từ חַג cùng thuộc trường nghĩa cử hành một kỳ lễ, thường có tính hành hương. Cách dịch này tự nhiên và giữ được tính chất lễ nghi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm tên riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: שַׁבָּתוֹן
  choice: ngày nghỉ long trọng
  rationale: Từ này chỉ sự ngưng nghỉ đặc biệt gắn với nghi lễ thánh. Cách dịch tránh đồng nhất mặc nhiên với ngày Sa-bát hằng tuần, đồng thời giữ sắc thái trang nghiêm.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn trực tiếp dùng danh riêng gồm bốn phụ âm. Giữ “Yahweh” bảo toàn chức năng tên riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của שַׁבָּתוֹן trong luật về kỳ lễ
  choice: ngày nghỉ long trọng
  alternative: ngày Sa-bát / kỳ nghỉ hoàn toàn
  rationale: Trong câu này, שַׁבָּתוֹן nói đến sự ngưng nghỉ thánh vào ngày đầu và ngày thứ tám của kỳ lễ. “Ngày nghỉ long trọng” giữ được ý nghỉ ngơi và tính chất thiêng liêng, nhưng không khẳng định đó là ngày Sa-bát hằng tuần.
- issue: Quan hệ giữa bảy ngày lễ và ngày thứ tám
  choice: giữ nguyên cả “trong bảy ngày” lẫn “ngày thứ tám”
  alternative: diễn giải ngày thứ tám như thuộc trọn trong bảy ngày
  rationale: Nguyên văn đặt hai cách nói cạnh nhau, tạo một độ căng có thật trong cách tính kỳ lễ. Bản dịch không âm thầm giải quyết hay xóa bỏ sự phân biệt ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời truyền cho cộng đồng số nhiều; tránh thuật ngữ giáo phái. Dấu chú thích được đặt ngay sau từ ngữ mà chú thích giải thích.
