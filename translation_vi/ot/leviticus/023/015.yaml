    rationale: תְּמִימֹת trực tiếp bổ nghĩa cho “bảy Sa-bát”, với nghĩa “trọn vẹn/hoàn chỉnh”. “Trọn vẹn” bám sát hơn và tránh biến mệnh đề thành chỉ yêu cầu đủ số lượng.
