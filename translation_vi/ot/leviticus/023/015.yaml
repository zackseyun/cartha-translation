source:
  edition: WLC
  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: vi
  text: 'Các ngươi phải tự đếm, từ ngày sau ngày Sa-bát, từ ngày các ngươi dâng bó lúa làm lễ vật đưa qua đưa lại: phải có bảy ngày Sa-bát trọn vẹn[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bảy tuần trọn vẹn”. Tiếng Hê-bơ-rơ theo nghĩa đen là “bảy ngày Sa-bát trọn vẹn”.
    reason: Nêu cách hiểu từ vựng và lịch pháp khác mà không xóa cách diễn đạt nguyên văn.
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: Các ngươi phải tự đếm
  rationale: Thể động từ trong văn mệnh lệnh luật pháp mang ý chỉ thị bắt buộc. “Phải… đếm” diễn đạt tự nhiên lực mệnh lệnh; “tự” đồng thời chuyển tải sắc thái của לָכֶם.
- source_word: לָכֶם
  choice: tự
  rationale: Đại từ hướng đích làm nổi bật việc cộng đồng phải tự thực hiện phép đếm; tiếng Việt diễn đạt gọn và tự nhiên bằng “tự đếm”.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: kể từ ngày sau ngày Sa-bát
  rationale: Giữ rõ mốc thời gian “ngày kế sau” và giữ thuật ngữ nghi lễ Sa-bát, thay vì khái quát thành “ngày nghỉ”.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: tức là từ ngày các ngươi đem
  rationale: Cụm này xác định cụ thể mốc bắt đầu vừa nêu. “Tức là” làm rõ quan hệ đồng vị mà không thêm cách giải nghĩa lịch pháp.
- source_word: עֹמֶר
  choice: bó lúa
  rationale: Trong ngữ cảnh này, từ chỉ vật phẩm nông sản được đem dâng, không chủ yếu nói đến đơn vị đo lường; “bó lúa” rõ nghĩa với độc giả hiện đại.
- source_word: הַתְּנוּפָה
  choice: làm lễ vật đưa qua đưa lại
  rationale: Diễn tả hành động nghi lễ đặc trưng của תְּנוּפָה bằng tiếng Việt dễ hiểu, thay vì chỉ phiên âm hoặc dùng một thuật ngữ giáo hội khó hiểu.
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: bảy ngày Sa-bát
  rationale: Giữ danh từ Sa-bát đúng như tiếng Hê-bơ-rơ và không âm thầm giải quyết tranh luận lịch pháp bằng cách đổi thành “bảy tuần”.
- source_word: תְּמִימֹת
  choice: đủ
  rationale: Trong cách tính thời gian, từ này nói đến sự đầy đủ, trọn vẹn; “có đủ bảy…” tự nhiên trong tiếng Việt và tránh sắc thái hoàn hảo về đạo đức.
- source_word: תִּהְיֶינָה
  choice: phải có
  rationale: Chuyển tải cấu trúc tồn tại của mệnh đề và lực quy định trong văn luật pháp.
theological_decisions:
- issue: Cách hiểu שַׁבָּת / שַׁבָּתוֹת trong chỉ dẫn lịch lễ
  choice: Giữ “ngày Sa-bát” trong chính văn.
  alternative: Dịch số nhiều là “tuần”, tức “bảy tuần trọn vẹn”.
  rationale: Bản Hê-bơ-rơ dùng chính từ Sa-bát. Giữ từ này bảo toàn sự căng thẳng và tính mơ hồ lịch pháp của văn bản; cách hiểu thông dụng là “tuần” được nêu trong chú thích thay vì áp đặt vào chính văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. “Các ngươi” giữ ngôi số nhiều trực tiếp của nguyên văn; câu dùng từ hiện đại, tránh thuật ngữ hệ phái. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
