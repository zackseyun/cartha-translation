source:
  edition: WLC
  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: vi
  text: Vì bất cứ ai không tự hạ mình ngay trong ngày ấy[a] sẽ bị loại khỏi dân mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không tự làm khổ mình.” Thành ngữ Hê-bơ-rơ này chỉ việc tự chế hoặc tự hạ mình, thường được liên hệ với việc kiêng ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Dẫn vào lý do giải thích cho mệnh lệnh ngay trước đó và phù hợp với mạch văn luật pháp.
- source_word: כָל הַנֶּפֶשׁ
  choice: bất cứ người nào
  rationale: נֶפֶשׁ ở đây chỉ một con người hay cá nhân, không phải “linh hồn” theo nghĩa thuật ngữ nhân học; cách dịch này tự nhiên và có tính bao quát.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: không hạ mình
  rationale: Trong bối cảnh Ngày Chuộc Tội, động từ diễn tả việc tự hạ mình hoặc ép mình, gắn với kiêng ăn và tự chế. “Hạ mình” truyền đạt tư thế khiêm hạ, ăn năn mà không giới hạn ý nghĩa vào sự hành xác.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: trong chính ngày ấy
  rationale: Thành ngữ dùng עֶצֶם để nhấn mạnh chính ngày đã được xác định; “chính ngày ấy” giữ được sắc thái nhấn mạnh và tự nhiên trong tiếng Việt.
- source_word: וְנִכְרְתָה
  choice: sẽ bị loại khỏi
  rationale: Giữ sức nặng của công thức chế tài giao ước nhưng không xác định cơ chế là tử hình, trục xuất hay sự phán xét trực tiếp của Đức Chúa Trời.
- source_word: מֵעַמֶּיהָ
  choice: dân mình
  rationale: Hậu tố giống cái phù hợp ngữ pháp với נֶפֶשׁ, nhưng đối tượng là bất kỳ người nào; “dân mình” diễn đạt tự nhiên mà không áp đặt giới tính.
theological_decisions:
- issue: Ý nghĩa của lệnh truyền tự làm khổ/hạ mình trong Ngày Chuộc Tội
  choice: Dịch thành “hạ mình” trong chính văn.
  alternative: “tự làm khổ mình” hoặc “ép mình”
  rationale: Cụm từ Hê-bơ-rơ nói đến sự tự hạ hay tự chế gắn với ăn năn và kiêng ăn. “Hạ mình” rõ ràng trong tiếng Việt hiện đại, còn phương án sát chữ được giữ trong chú thích để bảo tồn độ rộng nghĩa.
- issue: Bản chất của hình phạt כרת
  choice: Dịch “sẽ bị loại khỏi dân mình” mà không giải thích cơ chế.
  alternative: “sẽ bị khai trừ khỏi dân mình” hoặc “sẽ bị dứt khỏi dân mình”
  rationale: Câu Hê-bơ-rơ không nói rõ đây là cái chết, sự trục xuất hay phán xét trực tiếp từ Đức Chúa Trời. Bản dịch vì thế không giải quyết thay sự mơ hồ thần học của nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “bất cứ người nào” để diễn đạt tính phổ quát; “dân mình” tránh gán giới tính do giống ngữ pháp của danh từ Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
