id: LEV.23.5
reference: Leviticus 23:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: vi
  text: Vào tháng thứ nhất, ngày mười bốn của tháng, lúc chạng vạng[a], là lễ Vượt Qua[b] dành cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “giữa hai buổi chiều/tối”, một thành ngữ Hê-bơ-rơ chỉ khoảng chạng vạng quanh lúc mặt trời lặn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sinh tế Vượt Qua” hoặc “lễ vật Vượt Qua”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Vào tháng thứ nhất
  rationale: Trong ngữ cảnh lịch lễ nghi, חֹדֶשׁ chỉ “tháng”; הָרִאשׁוֹן xác định đây là tháng thứ nhất của năm lễ nghi.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: ngày mười bốn của tháng
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên độ chính xác của ngày tháng trong tiếng Hê-bơ-rơ.
- source_word: בֵּין הָעַרְבָּיִם
  choice: lúc chạng vạng
  rationale: Thành ngữ này theo nghĩa đen là “giữa hai buổi chiều/tối”, chỉ khoảng tranh tối tranh sáng quanh lúc mặt trời lặn; “lúc chạng vạng” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: פֶּסַח
  choice: lễ Vượt Qua
  rationale: פֶּסַח có thể chỉ kỳ lễ, nghi thức hoặc sinh tế Vượt Qua. Ngữ cảnh lịch các kỳ lễ nghiêng về tên kỳ lễ, nhưng chú thích vẫn bảo lưu nghĩa liên quan đến sinh tế.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ ל biểu thị sự quy hướng hoặc dâng dành cho; “dành cho” tự nhiên trong tiếng Việt và không biến cụm từ thành một quan hệ sở hữu đơn thuần.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Nghĩa của פֶּסַח trong ngữ cảnh lễ nghi
  choice: lễ Vượt Qua
  alternative: sinh tế Vượt Qua / lễ vật Vượt Qua
  rationale: Từ Hê-bơ-rơ có thể chỉ kỳ lễ hoặc sinh tế/nghi thức. Bản văn chính dùng nghĩa rộng phù hợp với lịch các kỳ lễ, còn chú thích bảo tồn sắc thái sinh tế mà không thu hẹp sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên đối với độc giả Việt Nam hiện đại. Cấu trúc câu giữ tính chất công bố lịch lễ của nguyên văn; các dấu chú thích được đặt đúng tại những cụm từ có phương án dịch khác.
