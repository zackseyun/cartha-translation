  - severity: low
    issue: «Tại mọi nơi anh em cư ngụ» có thể được điều chỉnh thành «trong mọi nơi anh em cư ngụ».
    rationale: Giới từ בְּ ở đây chỉ phạm vi áp dụng “trong/khắp” các nơi cư ngụ; «trong» phù hợp hơn với cách nói pháp lý của câu.
