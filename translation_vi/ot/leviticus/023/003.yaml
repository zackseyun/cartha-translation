base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: vi
  text: “Trong sáu ngày, người ta được làm việc; nhưng ngày thứ bảy là ngày Sa-bát, một ngày nghỉ hoàn toàn[a], một cuộc hội họp thánh. Anh em không được làm bất cứ công việc nào; ấy là ngày Sa-bát dành cho Yahweh trong mọi nơi anh em cư ngụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngày nghỉ Sa-bát” hoặc “ngày Sa-bát nghỉ trọng thể.” Cụm từ Hê-bơ-rơ nhấn mạnh sự nghỉ hoàn toàn trong ngày Sa-bát.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong mọi cộng đồng định cư của anh em.” Từ Hê-bơ-rơ có thể chỉ nơi cư ngụ hoặc cộng đồng định cư.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: người ta được làm việc
  rationale: Giữ sắc thái bị động/phiếm chỉ của động từ Nifal và ý cho phép trong bối cảnh, đồng thời diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: ngày Sa-bát nghỉ hoàn toàn
  rationale: Cụm danh từ lặp gốc שבת có tác dụng nhấn mạnh sự ngừng nghỉ; cách dịch này giữ cả tên ngày Sa-bát lẫn cường độ của sự nghỉ.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Diễn đạt một cuộc tụ họp thiêng liêng được triệu tập, bằng lối nói rõ ràng và trang trọng trong tiếng Việt.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Anh em không được làm bất cứ công việc nào
  rationale: Phản ánh lệnh cấm trực tiếp ở ngôi thứ hai số nhiều; “bất cứ… nào” truyền đạt phạm vi toàn diện của כָּל trong câu phủ định.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: ấy là ngày Sa-bát dành cho Yahweh
  rationale: “Dành cho” giữ hướng quy thuộc và sự biệt riêng hàm chứa trong giới từ לְ mà không biến câu thành một khẳng định sở hữu mạnh hơn nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: tại mọi nơi anh em cư ngụ
  rationale: Truyền đạt tự nhiên phạm vi áp dụng tại tất cả nơi ở hoặc cộng đồng định cư của dân chúng.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: nhưng ngày thứ bảy
  rationale: Waw được dịch theo quan hệ tương phản giữa sáu ngày làm việc và ngày thứ bảy nghỉ, phù hợp ngữ cảnh mà không thêm nội dung.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn danh ấy và tránh thay bằng tước hiệu.
- issue: Mức độ nhấn mạnh của שַׁבַּת שַׁבָּתוֹן
  choice: ngày Sa-bát nghỉ hoàn toàn
  alternative: ngày nghỉ Sa-bát hoặc ngày Sa-bát nghỉ trọng thể
  rationale: Bản dịch thể hiện sự ngừng nghỉ được nhấn mạnh nhưng không thêm những diễn giải giáo lý về bản chất hay cách tuân giữ ngày Sa-bát.
- issue: Ý nghĩa của לַיהוָה
  choice: dành cho Yahweh
  alternative: thuộc về Yahweh
  rationale: “Dành cho” bảo tồn định hướng thờ phượng và sự biệt riêng của ngày này, trong khi tránh quyết định rằng giới từ chỉ thuần túy quyền sở hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng giao ước, tránh sắc thái cổ hoặc miệt thị có thể có của “các ngươi”. Các dấu chú thích được đặt đúng ngay sau những cụm từ mà chú thích giải thích.
