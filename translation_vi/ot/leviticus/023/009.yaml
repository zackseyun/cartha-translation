  yaml_path: translation/ot/leviticus/023/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức dẫn nhập lời phán của Đức Chúa Trời, “phán” là cách diễn đạt tự nhiên, trang trọng và chính xác trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho danh riêng YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Sau động từ “phán”, tiếng Việt tự nhiên dùng kết cấu “phán với” để chỉ người tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức mở đầu lời trực tiếp, “rằng” dẫn tự nhiên vào nội dung lời phán ở câu kế tiếp mà không tạo một câu tiếng Việt nặng nề.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” giữ chức năng danh riêng và là dạng quen thuộc, trang trọng với độc giả Việt, thay vì thay danh ấy bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc dẫn nhập lời phán cô đọng; dấu hai chấm báo trước nội dung phát ngôn ở câu tiếp theo.
