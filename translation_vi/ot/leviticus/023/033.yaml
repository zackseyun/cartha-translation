base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/033.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Gia-vê[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; cũng được phiên là “Yahweh” hoặc “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn lời của Đức Chúa Trời được dịch là “phán”, cách diễn đạt tự nhiên, trang trọng và quen thuộc trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng đã phổ biến trong tiếng Việt để thể hiện trực tiếp danh YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל chỉ đối tượng được phán với; “với Môi-se” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: לֵאמֹר
  choice: dấu hai chấm
  rationale: Trong công thức dẫn lời này, לֵאמֹר báo hiệu nội dung lời phán sẽ theo sau. Vì câu trực tiếp bắt đầu ở câu kế tiếp, dấu hai chấm truyền đạt chức năng ấy tự nhiên hơn “rằng” hay “mà rằng”.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ tự danh. Bản dịch giữ đây là tên riêng của Đức Chúa Trời; “Đức Giê-hô-va” là dạng Việt hóa đã được dùng rộng rãi, còn chú thích nêu dạng ký âm khác mà không thay danh bằng tước hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn lời súc tích; dùng dấu hai chấm vì nội dung lời phán tiếp nối ở câu sau.
