  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/023.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se[a] rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”, danh riêng của Đức Chúa Trời; thường được phiên âm là “Yahweh” (Gia-vê), và dạng truyền thống là “Giê-hô-va”.'
    reason: Nêu dạng phụ âm trong nguyên văn và làm rõ các cách phiên âm/biểu đạt danh riêng.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר với waw liên tiếp mở đầu một lời phán mới. Trong công thức trang trọng khi Đức Chúa Trời truyền lời cho Môi-se, “phán” là cách diễn đạt tự nhiên và chính xác hơn “nói”.
- source_word: יְהוָה
  choice: YHWH
  rationale: Giữ nguyên bốn phụ âm của danh riêng Đức Chúa Trời trong tiếng Hê-bơ-rơ, không thay bằng một tước hiệu và không quyết định một cách phát âm vốn không được văn bản phụ âm xác định chắc chắn.
- source_word: אֶל
  choice: với
  rationale: Sau động từ “phán”, tiếng Việt tự nhiên dùng “phán với” để chỉ người tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn lời tiếng Hê-bơ-rơ, động từ nguyên mẫu này báo hiệu nội dung lời phán tiếp theo; “rằng” chuyển tải chức năng ấy tự nhiên hơn lối dịch sát chữ “mà nói”.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: YHWH
  alternative: Gia-vê; Giê-hô-va; CHÚA
  rationale: Nguyên văn ghi Tetragrammaton, tức danh riêng gồm bốn phụ âm. “YHWH” bảo toàn trực tiếp chứng cứ văn bản, tránh thay danh bằng tước hiệu “CHÚA” hoặc khẳng định một cách phát âm đang còn được bàn luận; chú thích cung cấp các cách đọc quen thuộc.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên. “Phán với… rằng” giữ sắc thái công thức truyền lời của sách Lê-vi mà không tạo câu tiếng Việt nặng nề; dấu hai chấm báo trước nội dung bắt đầu ở câu kế tiếp.
