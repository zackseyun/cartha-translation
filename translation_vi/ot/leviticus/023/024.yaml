  - severity: medium
    issue: “bằng tiếng kèn vang” thu hẹp và làm quan hệ ngữ pháp kém tự nhiên.
    rationale: תְּרוּעָה là tiếng hô/tiếng hiệu lớn, có thể gồm tiếng tù và hoặc kèn, nhưng từ này không tự xác định nhạc cụ. “Với tiếng hiệu vang” giữ tính mơ hồ của nguyên văn, còn chú thích nêu các khả năng cụ thể.
