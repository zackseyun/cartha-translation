source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: vi
  text: 'Hãy nói với con cái Y-sơ-ra-ên rằng: “Trong tháng thứ bảy, vào ngày mồng một của tháng, các ngươi sẽ có một ngày nghỉ trọng thể, một lễ tưởng niệm với tiếng hiệu vang[a], một buổi hội họp thánh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một lễ tưởng niệm bằng tiếng hô vang.” Từ Hê-bơ-rơ có thể chỉ âm thanh lớn dùng làm hiệu, gồm tiếng hô hoặc tiếng tù và, tiếng kèn; nguyên văn không xác định rõ nhạc cụ.'
    reason: Nêu phạm vi nghĩa của תְּרוּעָה và tránh xác định một nhạc cụ khi nguyên văn không xác định.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh gia tộc của cụm Hê-bơ-rơ theo nghĩa đen là ‘các con của Israel’, đồng thời trong tiếng Việt cụm này có thể chỉ chung toàn thể cộng đồng giao ước.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: Trong tháng thứ bảy
  rationale: Chuyển đạt trực tiếp cách nói chỉ thời gian theo lịch của nguyên văn.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: vào ngày mồng một của tháng
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ, theo nghĩa là ngày đầu tiên của tháng.
- source_word: יִהְיֶה לָכֶם
  choice: các ngươi sẽ có
  rationale: Giữ sắc thái tương lai/quy định của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: שַׁבָּתוֹן
  choice: một ngày nghỉ trọng thể
  rationale: Diễn tả sự ngưng công việc được cử hành đặc biệt trong bối cảnh lễ hội, đồng thời phân biệt với việc chỉ phiên âm ‘Sa-bát’.
- source_word: זִכְרוֹן
  choice: một lễ tưởng niệm
  rationale: Danh từ chỉ một điều hoặc nghi lễ dùng để ghi nhớ; thêm ‘lễ’ để cụm từ rõ và tự nhiên trong ngữ cảnh lịch phụng lễ.
- source_word: תְּרוּעָה
  choice: tiếng kèn vang
  rationale: Trong bối cảnh lễ hội, tiếng hiệu vang bằng kèn hoặc tù và là cách hiểu có cơ sở; ‘vang’ cũng phần nào giữ sắc thái âm thanh lớn của từ Hê-bơ-rơ.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một buổi hội họp thánh
  rationale: Chuyển đạt cuộc tụ họp được triệu tập cho mục đích thánh bằng cách nói trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của תְּרוּעָה trong tên gọi ngày lễ
  choice: tiếng kèn vang
  alternative: tiếng hô vang hoặc tiếng hiệu lớn
  rationale: Ngữ cảnh lịch lễ hỗ trợ cách hiểu là tiếng kèn hoặc tù và, nhưng bản thân từ Hê-bơ-rơ có phạm vi rộng hơn; chú thích giữ lại sự không xác định này thay vì xem tên nhạc cụ là tuyệt đối chắc chắn.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp lời quy định nghi lễ. Dùng “các ngươi” để duy trì lời phán trực tiếp với cộng đồng trong văn cảnh cổ, nhưng cấu trúc câu vẫn tự nhiên đối với độc giả Việt Nam hiện đại.
