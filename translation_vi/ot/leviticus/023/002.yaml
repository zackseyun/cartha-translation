  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: vi
  text: '“Hãy nói với con cái Israel và bảo họ: Các kỳ định[a] của Yahweh mà các ngươi phải công bố là những cuộc hội họp thánh[b]—đó là các kỳ định của Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kỳ định” cũng có thể dịch là “kỳ lễ” hoặc “dịp đã ấn định”; từ Hebrew chỉ chung những thời điểm hay dịp thánh được quy định, không chỉ các lễ hội.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những cuộc triệu tập thánh” hoặc “những hội chúng thánh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Động từ Piel mệnh lệnh truyền lệnh trực tiếp cho Môi-se nói với dân; cách dịch này tự nhiên và trang trọng trong ngữ cảnh luật pháp.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Đây là thành ngữ giao ước chỉ chung dân Israel. “Con cái Israel” vừa gần nghĩa đen vừa tự nhiên hơn “các con trai Israel” trong tiếng Việt hiện đại.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và bảo họ
  rationale: Giữ chuỗi mệnh lệnh của tiếng Hebrew nhưng tránh lặp “nói ... nói với họ” một cách gượng gạo trong tiếng Việt.
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: các kỳ định / các kỳ định của Ta
  rationale: מוֹעֵד chỉ thời điểm hoặc dịp đã được ấn định; cách dịch rộng này phù hợp vì chương 23 kể cả ngày Sa-bát, chứ không chỉ các lễ hội.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước, không thay bằng một tước hiệu.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: mà các ngươi phải công bố
  rationale: קרא ở đây có nghĩa công bố hoặc triệu tập công khai. “Phải” diễn đạt lực chỉ thị của dạng chưa hoàn thành trong lời luật định.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: những cuộc hội họp thánh
  rationale: Diễn đạt cả tính chất được triệu tập của מִקְרָא và tính biệt riêng, thánh của קֹדֶשׁ bằng tiếng Việt dễ hiểu.
- source_word: אֵלֶּה הֵם
  choice: đó là
  rationale: Thể hiện cấu trúc xác định và nhấn mạnh ở cuối câu một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Giữ danh riêng của Đức Chúa Trời trong bản nguồn, không thay bằng tước hiệu hay áp đặt truyền thống hệ phái.
- issue: Phạm vi nghĩa của מוֹעֵד
  choice: kỳ định
  alternative: kỳ lễ; lễ hội
  rationale: “Kỳ định” không thu hẹp thuật ngữ vào yến tiệc hay lễ hội, và thích hợp với phạm vi của chương gồm cả ngày Sa-bát.
- issue: Cách diễn đạt בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel; dân Israel
  rationale: Thành ngữ mang nghĩa tập thể chỉ dân giao ước. “Con cái Israel” giữ hình ảnh huyết thống mà không khiến độc giả Việt hiểu sai rằng chỉ nam giới được nói đến.
- issue: Ngôi xưng hô trong lời phán
  choice: các ngươi ... Ta
  alternative: anh em ... Ta; các con ... Ta
  rationale: “Các ngươi ... Ta” giữ sắc thái lời phán tập thể, trang trọng của luật giao ước mà không thêm sắc thái thân mật không có trong nguồn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Giữ trật tự ý của tiếng Hebrew: trước hết nêu các kỳ định thuộc về Yahweh, rồi mệnh đề công bố, sau cùng nhấn mạnh “đó là các kỳ định của Ta.” Dùng dấu gạch ngang để bảo toàn sự nhấn mạnh ở vế cuối.'
