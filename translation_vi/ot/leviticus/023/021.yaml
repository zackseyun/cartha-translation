revisions:
- from: Ngay chính ngày ấy, anh em phải công bố một cuộc hội họp thánh[a]; đó sẽ là cuộc hội họp dành cho anh em. Anh em không được làm bất cứ công việc lao dịch nào[b]. Đây là quy định lâu dài[c] tại mọi nơi anh em cư ngụ, trải qua các thế hệ của anh em.
  to: Vào chính ngày ấy, anh em phải công bố một cuộc hội họp thánh[a]. Anh em không được làm bất cứ công việc thường ngày nào[b]. Đây là một quy lệ vĩnh viễn tại mọi nơi anh em cư ngụ, cho các thế hệ anh em[c].
  rationale: Bản sửa gộp đúng ý “sẽ là cho anh em” vào cuộc hội họp thánh đã được công bố, loại bỏ mệnh đề lặp và sai hướng. Cách dịch lệnh cấm được đổi từ “lao dịch” sang “công việc thường ngày” để tránh hàm ý cưỡng bách, trong khi chú thích vẫn cho biết cấu trúc Hê-bơ-rơ và giới hạn phạm vi. “Quy lệ vĩnh viễn” phản ánh công thức pháp lý bền vững của חֻקַּת עוֹלָם; chú thích giữ các phương án không tuyệt đối hóa cách hiểu thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mệnh lệnh công bố cuộc hội họp thánh, lệnh cấm loại công việc lao động thông thường, và tính áp dụng liên tục của quy lệ. Tuy nhiên, câu “đó sẽ là cuộc hội họp dành cho anh em” lặp lại và làm lệch cấu trúc: nguyên văn nói chính cuộc hội họp thánh ấy “sẽ là cho anh em,” không nói đến một cuộc hội họp thứ hai. “Lao dịch” cũng thường gợi lao động cưỡng bách, hẹp và không tự nhiên hơn sắc thái công việc lao động/thường nhật của מְלֶאכֶת עֲבֹדָה.'
  naturalness: Cần bỏ câu lặp thừa để câu văn luật lệ gọn và tự nhiên. “Vào chính ngày ấy,” “công việc thường ngày,” và “quy lệ vĩnh viễn” phù hợp tiếng Việt hiện đại, trang trọng. Cụm “đại hội thánh” trong chú thích dễ bị hiểu là hội nghị của Hội Thánh, nên nên thay bằng lựa chọn trung tính hơn.
  terminology: Giữ “cuộc hội họp thánh” cho מִקְרָא קֹדֶשׁ. Dùng “công việc thường ngày” trong chính văn để biểu đạt phạm vi công việc lao động thông thường mà không biến nó thành lệnh cấm mọi hoạt động; chú thích bảo lưu cách diễn đạt sát chữ. “Quy lệ vĩnh viễn” diễn đạt công thức חֻקַּת עוֹלָם rõ hơn “quy định lâu dài,” đồng thời chú thích nêu các cách dịch khác.
  issues:
  - severity: medium
    issue: Câu “đó sẽ là cuộc hội họp dành cho anh em” lặp và diễn đạt không đúng quan hệ cú pháp của יִהְיֶה לָכֶם.
    rationale: יִהְיֶה לָכֶם vị ngữ cho מִקְרָא קֹדֶשׁ, tức cuộc hội họp thánh vừa được công bố là dành cho cộng đồng. Câu nháp khiến như có thêm một cuộc hội họp khác.
  - severity: medium
    issue: “Công việc lao dịch” có thể gợi lao động cưỡng bách.
    rationale: עֲבֹדָה trong công thức này chỉ công việc lao động/phục dịch, thường được hiểu là công việc thông thường; “lao dịch” trong tiếng Việt hiện đại thường hẹp hơn và mang sắc thái cưỡng bách.
  - severity: low
    issue: Chú thích [a] dùng “đại hội thánh.”
    rationale: Cụm này dễ liên tưởng đến một đại hội của Hội Thánh Cơ Đốc hơn là một cách dịch trung tính của “holy/sacred assembly.”
