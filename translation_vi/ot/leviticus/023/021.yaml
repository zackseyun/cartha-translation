  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: vi
  text: Vào chính ngày ấy, anh em phải công bố một cuộc hội họp thánh[a]. Anh em không được làm bất cứ công việc thường ngày nào[b]. Đây là một quy lệ vĩnh viễn tại mọi nơi anh em cư ngụ, cho các thế hệ anh em[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cuộc hội họp thiêng liêng” hoặc “một hội họp thánh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “mọi công việc lao động/phục dịch”; tức không làm công việc lao động thông thường, không nhất thiết là mọi hoạt động.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “một quy lệ đời đời” hoặc “một quy lệ lâu dài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: anh em phải công bố
  rationale: Động từ קרא trong bối cảnh lễ nghi chỉ việc chính thức công bố hoặc triệu tập, nên “công bố” giữ được sắc thái công khai và quy phạm.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ngay chính ngày ấy
  rationale: Cụm từ nhấn mạnh đúng ngày đang được nói đến; “ngay chính ngày ấy” vừa tự nhiên vừa giữ được lực nhấn mạnh.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Cụm từ lễ nghi cố định chỉ một cuộc tụ họp được chính thức triệu tập và biệt riêng; cách dịch này dễ hiểu hơn thuật ngữ Hán-Việt nặng tính chuyên môn.
- source_word: יִהְיֶה לָכֶם
  choice: đó sẽ là cuộc hội họp dành cho anh em
  rationale: Dịch rõ mệnh đề vị ngữ “sẽ là cho anh em”, thay vì lược bỏ nó; đồng thời tránh cách diễn đạt tiếng Việt gượng.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc lao dịch nào
  rationale: Giữ cả ý bao quát của כָּל lẫn sắc thái lao động phục vụ/thường nhật của עֲבֹדָה, không mở rộng thành cấm tuyệt đối mọi hoạt động.
- source_word: לֹא תַעֲשׂוּ
  choice: anh em không được làm
  rationale: Diễn đạt tự nhiên mệnh lệnh cấm trong văn phong luật lệ tiếng Việt hiện đại.
- source_word: חֻקַּת עוֹלָם
  choice: quy định lâu dài
  rationale: עוֹלָם trong công thức pháp luật diễn tả tính bền vững qua thời gian; “lâu dài” bảo toàn phạm vi ngữ nghĩa mà không ép thành một khẳng định siêu hình tuyệt đối.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: tại mọi nơi anh em cư ngụ
  rationale: Diễn đạt rõ phạm vi phân bố ở tất cả các nơi dân chúng sinh sống, bằng tiếng Việt tự nhiên.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của anh em
  rationale: Thể hiện việc quy định tiếp tục có hiệu lực qua những thế hệ kế tiếp.
theological_decisions:
- issue: Phạm vi của lệnh cấm làm việc trong luật về kỳ lễ
  choice: Dịch כָּל מְלֶאכֶת עֲבֹדָה là “bất cứ công việc lao dịch nào”.
  alternative: “không được làm bất cứ công việc nào” hoặc “không được làm công việc thường nhật nào”
  rationale: Cụm Hê-bơ-rơ nhắm đến loại công việc lao động/phục dịch, không nhất thiết mọi hành động có thể gọi là việc làm. Bản dịch tránh áp đặt một lệnh cấm rộng hơn chính câu chữ.
- issue: Thời hạn của חֻקַּת עוֹלָם
  choice: Dịch là “quy định lâu dài”.
  alternative: “quy định đời đời” hoặc “quy định vĩnh viễn”
  rationale: Giữ tính kéo dài bền vững của công thức pháp luật, đồng thời để ngỏ độ rộng thời gian vốn có của עוֹלָם thay vì mặc nhiên giải quyết theo một lập trường thần học.
translation_notes:
  register: Văn phong luật lệ trang nghiêm nhưng hiện đại. Dùng “anh em” làm đại từ số nhiều hướng đến cộng đồng giao ước; tránh thuật ngữ quá cổ. Các dấu chú thích [a], [b], [c] đều được đặt trong chính văn.
