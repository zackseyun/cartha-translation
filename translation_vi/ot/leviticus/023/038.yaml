- from: ngoài các ngày Sa-bát của Yahweh[a], ngoài các lễ vật của anh em, ngoài mọi lễ vật đã khấn nguyện của anh em, và ngoài mọi lễ vật tự nguyện của anh em, là những gì anh em dâng lên Yahweh.
