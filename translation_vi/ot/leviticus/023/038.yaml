  text: מִ/לְּ/בַ֖ד שַׁבְּתֹ֣ת יְּהוָ֑ה וּ/מִ/לְּ/בַ֣ד מַתְּנֽוֹתֵי/כֶ֗ם וּ/מִ/לְּ/בַ֤ד כָּל נִדְרֵי/כֶם֙ וּ/מִ/לְּ/בַד֙ כָּל נִדְב֣וֹתֵי/כֶ֔ם אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: vi
  text: ngoài các ngày Sa-bát của Yahweh[a], ngoài các quà dâng của anh em, ngoài mọi điều anh em đã khấn, và ngoài mọi lễ vật tự nguyện của anh em mà anh em dâng cho Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngoài” ở mỗi lần xuất hiện cũng có thể hiểu là “không kể” hoặc “thêm vào” các điều vừa được quy định.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: ngoài
  rationale: Giữ sự lặp lại bốn lần của nguyên văn và để ngỏ sắc thái ‘không kể/ngoài ra/thêm vào’ trong quan hệ với các kỳ lễ vừa nêu.
- source_word: שַׁבְּתֹת יְהוָה
  choice: các ngày Sa-bát của Yahweh
  rationale: Phản ánh danh từ số nhiều và cấu trúc sở hữu với danh riêng của Đức Chúa Trời; ‘ngày Sa-bát’ là cách nói rõ ràng, tự nhiên trong tiếng Việt.
- source_word: מַתְּנוֹתֵיכֶם
  choice: các lễ vật của anh em
  rationale: Trong ngữ cảnh thờ phượng và dâng hiến, ‘lễ vật’ diễn đạt tự nhiên hơn ‘quà tặng’ mà không thu hẹp loại vật được dâng.
- source_word: כָּל נִדְרֵיכֶם
  choice: mọi lễ vật đã khấn nguyện của anh em
  rationale: נֶדֶר có thể chỉ lời khấn hoặc vật đã khấn; trong danh sách những gì được dâng lên Yahweh, cách dịch này làm rõ ý vật dâng do lời khấn mà vẫn giữ mối liên hệ với hành vi khấn nguyện.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: mọi lễ vật tự nguyện của anh em
  rationale: Trong ngữ cảnh tế lễ, נְדָבָה chỉ lễ vật được tự nguyện dâng, đối lập về loại với lễ vật gắn với lời khấn.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: là những gì anh em dâng lên Yahweh
  rationale: Mệnh đề quan hệ được hiểu là quy chiếu chung đến các vật dâng vừa liệt kê; ‘dâng lên’ chuyển tải נתן tự nhiên trong ngữ cảnh thờ phượng.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Dùng tên riêng để phản ánh trực tiếp Danh Giao Ước trong nguyên văn, không thay bằng một tước hiệu.
- issue: Phạm vi của mệnh đề אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: quy chiếu chung đến các lễ vật vừa liệt kê
  alternative: chỉ bổ nghĩa cho các lễ vật tự nguyện gần nhất
  rationale: Cấu trúc phối hợp và nội dung của danh sách ủng hộ phạm vi chung, nhưng tiếng Hê-bơ-rơ về mặt cú pháp không buộc phải loại trừ cách gắn với mục gần nhất.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; dùng ‘anh em’ cho hậu tố ngôi thứ hai số nhiều, ‘các ngày Sa-bát’ cho số nhiều trong nguyên văn, và lặp ‘ngoài’ để giữ nhịp liệt kê nhấn mạnh của câu Hê-bơ-rơ.
