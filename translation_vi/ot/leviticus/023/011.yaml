source:
  edition: WLC
  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: vi
  text: Thầy tế lễ phải đưa bó lúa qua lại trước mặt Yahweh để các ngươi được chấp nhận[a]. Vào ngày sau Sa-bát, thầy tế lễ phải đưa bó lúa ấy qua lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để bó lúa được chấp nhận vì các ngươi.” Cụm từ Hê-bơ-rơ có thể diễn tả việc những người thờ phượng được Yahweh chấp nhận qua lễ vật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף / יְנִיפֶנּוּ
  choice: phải đưa ... qua lại
  rationale: Động từ נוּף ở thể Hiphil chỉ nghi thức đưa lễ vật qua lại trước Đức Chúa Trời. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được hành động nghi lễ, thay vì chỉ nói chung là “dâng”.
- source_word: הָעֹמֶר
  choice: bó lúa
  rationale: Trong ngữ cảnh hoa lợi đầu mùa, עֹמֶר chỉ bó lúa được mang đến làm lễ vật, chứ không chủ yếu nói về đơn vị đo lường.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ chỉ việc trình lễ vật trong sự hiện diện của Đức Chúa Trời, đồng thời chuyển chính danh יהוה là “Yahweh”.
- source_word: לִרְצֹנְכֶם
  choice: để anh em được chấp nhận
  rationale: Cụm từ diễn tả sự chấp nhận dành cho những người thờ phượng qua lễ vật. Lối dịch này rõ nghĩa trong tiếng Việt nhưng vẫn ghi nhận khả năng hiểu khác ở chú thích.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: vào ngày sau ngày Sa-bát
  rationale: Phản ánh trực tiếp ý nghĩa thời gian của cụm từ, không tự xác định ngày nào trong tuần ngoài điều văn bản nói.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi tự nhiên, trang trọng và dễ hiểu đối với chức vụ כֹּהֵן trong luật tế lễ.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Văn bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất tên riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của לִרְצֹנְכֶם trong nghi thức dâng lễ
  choice: để anh em được chấp nhận
  alternative: để bó lúa được chấp nhận vì anh em; nhằm đem lại sự chấp nhận cho anh em
  rationale: Cấu trúc Hê-bơ-rơ có thể quy chiếu đến sự chấp nhận của người dâng hoặc tính được chấp nhận của lễ vật vì lợi ích của họ. Bản chính dùng cách hiểu tự nhiên nhất trong tiếng Việt, còn chú thích bảo tồn sự mơ hồ thật sự.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho hậu tố số nhiều ngôi thứ hai; lặp “thầy tế lễ” ở hai vế để tránh đại từ mơ hồ. “Đưa ... qua lại” diễn đạt hành động nghi lễ mà không thêm một hình thức chuyển động cụ thể ngoài động từ Hê-bơ-rơ.
