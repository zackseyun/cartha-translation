revisions:
- from: Thầy tế lễ phải đưa bó lúa qua lại trước mặt Yahweh để anh em được chấp nhận[a]. Vào ngày sau ngày Sa-bát, thầy tế lễ phải đưa bó lúa ấy qua lại.
  to: Thầy tế lễ phải đưa bó lúa qua lại trước mặt Yahweh để các ngươi được chấp nhận[a]. Vào ngày sau Sa-bát, thầy tế lễ phải đưa bó lúa ấy qua lại.
