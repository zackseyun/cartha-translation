    issue: Cụm “ngày sau ngày Sa-bát” bị lặp và chưa tự nhiên.
    rationale: מִמָּחֳרַת הַשַּׁבָּת có nghĩa là “vào ngày sau Sa-bát”; cách sửa này không định danh thêm ngày lễ hoặc ngày trong tuần.
  - severity: low
    issue: “Anh em” chưa phù hợp bằng “các ngươi” cho hậu tố số nhiều ngôi thứ hai trong văn cảnh luật lệ.
    rationale: “Các ngươi” giữ rõ đối tượng được trực tiếp quy định trong bản văn và tránh sắc thái xưng hô cộng đồng hiện đại không có trong tiếng Hê-bơ-rơ.
