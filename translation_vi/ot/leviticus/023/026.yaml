  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; cũng được chuyển tự là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר với waw liên tiếp mở đầu một lời phán mới. Trong tiếng Việt Kinh Thánh, “phán” là cách diễn đạt tự nhiên, trang trọng khi Đức Chúa Trời nói.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Danh riêng bốn phụ âm YHWH được chuyển theo dạng quen thuộc “Giê-hô-va” trong tiếng Việt, không thay bằng một tước hiệu; chú thích ghi nhận dạng “Yahweh” cũng được dùng.
- source_word: אֶל
  choice: với
  rationale: Giới từ đánh dấu người tiếp nhận lời phán; cấu trúc tiếng Việt tự nhiên là “phán với Môi-se”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này dẫn vào nội dung lời phán. “Rằng” giữ chức năng ấy tự nhiên hơn lối dịch sát chữ “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng thay vì thay bằng tước hiệu “CHÚA”; chú thích bảo tồn các cách chuyển tự khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng; giữ công thức dẫn nhập lời phán nhưng dùng cú pháp tiếng Việt tự nhiên.
