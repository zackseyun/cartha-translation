    rationale: Nguyên văn dùng Danh Bốn Mẫu tự, và audit trail của POB quy định chuyển là “Yahweh”. Thêm “Đức” cũng biến danh riêng thành một cách gọi mang sắc thái tước hiệu không có trong bản văn.
