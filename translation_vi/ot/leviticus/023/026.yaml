  source_fidelity: Động từ וַיְדַבֵּר được dịch là “phán”, אֶל מֹשֶׁה là “với Môi-se”, và לֵאמֹר là “rằng”, đều truyền đạt đúng công thức dẫn nhập lời phán trong tiếng Hê-bơ-rơ. Tuy nhiên, יהוה phải được chuyển là “Yahweh” theo quyết định của bản POB và audit trail tiếng Anh, thay vì “Đức Giê-hô-va”.
