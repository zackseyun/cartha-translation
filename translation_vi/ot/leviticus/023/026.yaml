  terminology: Giữ “Môi-se” theo cách dùng Kinh Thánh tiếng Việt. Dùng “Yahweh” để nhất quán với chính sách chuyển tự Danh Bốn Mẫu tự; “Giê-hô-va” có thể được nêu như một cách chuyển tự thay thế trong chú thích.
