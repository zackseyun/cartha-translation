  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của nguyên văn: Môi-se là chủ ngữ, hành động thông báo/công bố, các מוֹעֲדֵי của Yahweh, và đối tượng là בני ישראל. “Các kỳ đã định” giữ được phạm vi lịch thánh rộng hơn “các lễ hội”. Tuy nhiên, “Vậy” thêm sắc thái suy luận/kết luận không được biểu thị riêng bởi liên từ tự sự וַ־, và nên bỏ. Thêm “đã” diễn đạt tự nhiên hơn thì quá khứ tự sự trong tiếng Việt.'
