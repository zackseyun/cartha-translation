  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: vi
  text: Môi-se đã công bố các kỳ đã định của Yahweh cho con cái Y-sơ-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Y-sơ-ra-ên”; sát nghĩa Hê-bơ-rơ là “các con trai của Y-sơ-ra-ên”.
    reason: Nêu cách diễn đạt tự nhiên và nghĩa sát chữ của בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: công bố
  rationale: Ở câu tổng kết lịch lễ này, động từ piel דּבר diễn tả việc Môi-se truyền đạt công khai các quy định; “công bố” tự nhiên với tân ngữ trực tiếp và rõ hơn “nói” trong tiếng Việt.
- source_word: מֹעֲדֵי
  choice: các kỳ đã định
  rationale: מוֹעֵד chỉ những thời điểm được ấn định trong lịch thánh, bao gồm cả ngày Sa-bát chứ không chỉ các lễ hội; cách dịch này giữ được phạm vi rộng của từ Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ Tự, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: cho
  rationale: Trong tiếng Việt, “công bố ... cho” diễn đạt tự nhiên đối tượng tiếp nhận lời công bố; “với” hoặc “đến” kém tự nhiên hơn trong cấu trúc này.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Y-sơ-ra-ên”, nhưng trong ngữ cảnh chỉ toàn thể cộng đồng giao ước. “Con cái Y-sơ-ra-ên” vừa giữ hình ảnh huyết thống truyền thống vừa được hiểu theo nghĩa bao quát trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יְהוָה. Phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu, đồng thời tránh khẳng định cách phát âm “Giê-hô-va” vốn xuất hiện muộn.
- issue: Phạm vi của מֹעֲדֵי
  choice: các kỳ đã định
  alternative: các kỳ lễ
  rationale: Chương 23 dùng thuật ngữ này cho toàn bộ lịch thánh, kể cả Sa-bát; “các kỳ đã định” tránh thu hẹp ý nghĩa thành những lễ hội בלבד.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se”, “Y-sơ-ra-ên” theo dạng tên quen thuộc trong Kinh Thánh tiếng Việt; giữ “Yahweh” làm danh riêng. Từ “Vậy” thể hiện chức năng tổng kết của וַ־ trong ngữ cảnh.
