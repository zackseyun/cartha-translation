  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Cùng với bánh ấy, các ngươi phải dâng bảy con chiên đực một tuổi[a], không tì vết, một con bò đực từ đàn bò và hai con cừu đực. Chúng sẽ là lễ thiêu dâng lên Yahweh, cùng với lễ vật ngũ cốc và các lễ quán đi kèm—một lễ vật dâng bằng lửa[b], có hương thơm đẹp lòng Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “bên cạnh bánh ấy” hoặc “ngoài bánh ấy”; giới từ Hê-bơ-rơ có thể diễn tả sự đi kèm chứ không phải vị trí đặt ở trên.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ chỉ một lễ vật được dâng bằng lửa; một số bản dịch diễn đạt là “lễ vật thức ăn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: các ngươi phải dâng
  rationale: Thể Hiphil của קרב trong ngữ cảnh tế lễ chỉ việc đem đến hoặc trình dâng lễ vật; “dâng” tự nhiên và chính xác trong tiếng Việt.
- source_word: עַל הַלֶּחֶם
  choice: cùng với bánh ấy
  rationale: עַל ở đây diễn tả sự đi kèm hoặc bổ sung cho bánh đã nói ở câu trước, không nhất thiết là đặt các con vật lên trên bánh.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: bảy con chiên đực một tuổi, không tì vết
  rationale: Phản ánh số lượng, giống đực, độ tuổi và tiêu chuẩn tế lễ của các con chiên.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: một con bò đực từ đàn bò
  rationale: Giữ sắc thái פַר בֶּן־בָּקָר là một con bò đực thuộc đàn gia súc mà không xác định tuổi quá mức.
- source_word: וְאֵילִם שְׁנָיִם
  choice: và hai con cừu đực
  rationale: אַיִל chỉ cừu đực trưởng thành; cách gọi này rõ nghĩa với độc giả Việt hiện đại.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ chỉ lễ vật được thiêu toàn bộ; “lễ thiêu” là cách gọi ngắn gọn, quen thuộc trong văn cảnh Kinh Thánh.
- source_word: וּמִנְחָתָם
  choice: cùng với lễ vật ngũ cốc
  rationale: מִנְחָה trong hệ thống tế lễ Lê-vi là lễ vật bằng ngũ cốc đi kèm lễ thiêu.
- source_word: וְנִסְכֵּיהֶם
  choice: và các lễ quán của chúng
  rationale: נֶסֶךְ là lễ vật dạng chất lỏng được rưới hoặc đổ ra; “lễ quán” giữ thuật ngữ tế lễ chính xác.
- source_word: אִשֵּׁה
  choice: một lễ vật dùng lửa
  rationale: Giữ yếu tố lửa vốn rõ trong thuật ngữ Hê-bơ-rơ và tránh diễn giải thành “lễ vật thức ăn”, điều không được từ nguyên trực tiếp xác quyết.
- source_word: רֵיחַ נִיחֹחַ
  choice: có hương thơm đẹp lòng
  rationale: Diễn đạt thành ngữ tế lễ theo cách tự nhiên, chỉ hương thơm được tiếp nhận với sự hài lòng.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng “Yahweh” theo lớp tham khảo đã hiệu đính.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của אִשֵּׁה
  choice: lễ vật dùng lửa
  alternative: lễ vật thức ăn
  rationale: “Lễ vật dùng lửa” bảo tồn yếu tố nghi lễ được từ Hê-bơ-rơ biểu thị và không giải quyết quá mức mối liên hệ thần học giữa lễ vật, lửa và thức ăn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời truyền trực tiếp ở số nhiều; giữ các thuật ngữ tế lễ ngắn gọn, nhất quán. Mọi ký hiệu chú thích đều xuất hiện trong câu chính.
