language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: vi
  text: Đó là các luật lệ, các phán quyết và các chỉ dẫn mà Yahweh đã ban hành để quy định mối quan hệ giữa Ngài và con cái Israel tại núi Si-nai, qua tay Môi-se.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Qua tay Môi-se” là một thành ngữ Hê-bơ-rơ, nghĩa là “qua Môi-se” hoặc “thông qua Môi-se.”
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Cụm chỉ thị mở đầu dùng để tổng kết phần luật giao ước vừa trình bày; “Đó là” tự nhiên trong câu kết luận tiếng Việt.
- source_word: הַחֻקִּים
  choice: các luật lệ
  rationale: Diễn đạt những quy định cố định, đồng thời giữ sắc thái pháp lý và phân biệt tương đối với hai danh từ kế tiếp.
- source_word: הַמִּשְׁפָּטִים
  choice: các phán quyết
  rationale: Giữ nghĩa pháp lý của מִשְׁפָּט là phán quyết hoặc quyết định có tính quy phạm.
- source_word: הַתּוֹרֹת
  choice: các chỉ dẫn
  rationale: Số nhiều תּוֹרֹת chỉ những chỉ dạy có thẩm quyền; “các chỉ dẫn” tránh đồng nhất hoàn toàn từ này với חֻקִּים, nhưng vẫn phù hợp ngữ cảnh luật pháp.
- source_word: אֲשֶׁר נָתַן
  choice: mà ... đã ban
  rationale: Phản ánh trực tiếp động từ נָתַן (“ban/cho”); “ban” tự nhiên khi chủ thể là Đức Chúa Trời và đối tượng là luật lệ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: giữa Ngài với con cái Israel
  rationale: Giữ cấu trúc quan hệ “giữa... với...” và thành ngữ nguồn “con cái Israel”; đại từ “Ngài” trang trọng, rõ quy chiếu về Yahweh.
- source_word: בְּהַר סִינַי
  choice: tại núi Sinai
  rationale: Cách diễn đạt địa điểm tự nhiên trong tiếng Việt, không buộc phải xác định là trên đỉnh núi.
- source_word: בְּיַד מֹשֶׁה
  choice: qua tay Môi-se
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ, đồng thời tiếng Việt vẫn hiểu tự nhiên là thông qua sự trung gian của Môi-se.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm bảo tồn sự phân biệt giữa danh riêng và tước hiệu.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel / người Israel
  rationale: Giữ thành ngữ gia tộc–giao ước của nguyên văn mà trong tiếng Việt vẫn có thể chỉ toàn thể cộng đồng, không chỉ nam giới.
- issue: Quan hệ được diễn tả bởi בֵּינוֹ וּבֵין
  choice: giữa Ngài với con cái Israel
  alternative: cho con cái Israel
  rationale: Giữ nét nghĩa hai bên của nguyên văn, dù động từ “ban” kết hợp với cấu trúc này tạo một cách nói trang trọng mang sắc thái giao ước.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu giữ bộ ba thuật ngữ pháp lý của nguyên văn, nhưng dùng “chỉ dẫn” cho תּוֹרֹת để bảo tồn sắc thái chỉ dạy có thẩm quyền. Dấu chú thích [a] được đặt ngay sau thành ngữ cần giải thích.
