id: LEV.26.25
reference: Leviticus 26:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: vi
  text: Ta sẽ đem một thanh gươm đến chống lại các ngươi để thi hành sự báo trả của giao ước[a]; các ngươi sẽ tụ lại trong các thành của mình. Rồi Ta sẽ sai dịch bệnh đến giữa các ngươi, và các ngươi sẽ bị trao vào tay kẻ thù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thi hành sự báo trả vì giao ước” hoặc “báo thù cho giao ước.” Trong tiếng Hê-bơ-rơ, từ “báo trả” đi với danh từ cùng gốc là “sự báo trả” để nhấn mạnh, liên kết thanh gươm với sự phán xét theo giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם חֶרֶב
  choice: Ta sẽ khiến gươm đến nghịch cùng các ngươi
  rationale: Giữ sắc thái nguyên nhân của thể Hiphil בוא và ý thù nghịch của עַל; cách diễn đạt này cũng bảo toàn hình ảnh gươm như công cụ chiến tranh và phán xét.
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: thi hành sự báo trả của giao ước
  rationale: “Thi hành sự báo trả” chuyển tải cấu trúc nhấn mạnh gồm phân từ và danh từ cùng gốc mà không tạo lối lặp gượng trong tiếng Việt; “của giao ước” giữ nguyên quan hệ hàm nghĩa có thể được hiểu theo vài sắc thái gần nhau.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: các ngươi sẽ tụ tập vào trong các thành mình
  rationale: Thể Niphal có thể mang sắc thái trung gian hoặc phản thân; “sẽ tụ tập” tự nhiên hơn “sẽ bị tập hợp” trong ngữ cảnh dân chúng dồn vào thành để tránh chiến tranh, còn “vào trong” nêu rõ hướng di chuyển.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: Rồi Ta sẽ sai dịch bệnh đến giữa các ngươi
  rationale: “Rồi” thể hiện diễn tiến của các tai họa; דֶבֶר trong lời nguyền giao ước chỉ bệnh dịch lan rộng, nên “dịch bệnh” vừa chính xác vừa dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: các ngươi sẽ bị trao vào tay kẻ thù
  rationale: Giữ thể bị động của נתן và thành ngữ Hê-bơ-rơ “vào tay,” biểu thị việc rơi vào quyền lực của kẻ thù; danh từ số ít được giữ lại.
theological_decisions:
- issue: Ý nghĩa của “sự báo trả của giao ước”
  choice: Giữ nguyên cụm từ tương đối sát nguồn, nối việc báo trả với giao ước mà không xác định duy nhất loại quan hệ.
  alternative: “báo trả vì giao ước bị vi phạm” hoặc “báo thù cho giao ước”
  rationale: Cấu trúc Hê-bơ-rơ có thể chỉ sự phán xét căn cứ trên giao ước, sự báo trả vì giao ước bị vi phạm, hoặc sự báo trả nhằm bênh vực giao ước. Bản dịch không âm thầm chọn riêng một cách giải nghĩa.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “Ta/các ngươi” phù hợp lời Đức Chúa Trời phán trực tiếp với cộng đồng trong văn mạch Lê-vi Ký; tránh từ quá cổ như “ôn dịch,” đồng thời duy trì thành ngữ Kinh Thánh “vào tay kẻ thù.”
