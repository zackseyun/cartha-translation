  to: Ta sẽ đem một thanh gươm đến chống lại các ngươi để thi hành sự báo trả của giao ước[a]; các ngươi sẽ tụ lại trong các thành của mình. Rồi Ta sẽ sai dịch bệnh đến giữa các ngươi, và các ngươi sẽ bị trao vào tay kẻ thù.
  rationale: 'Bản sửa thay cách diễn đạt không tự nhiên bằng tiếng Việt hiện đại, đồng thời giữ các yếu tố nguồn: hành động sai khiến của Đức Chúa Trời, gươm như khí cụ chống lại dân, sự báo trả gắn với giao ước, sắc thái không hoàn toàn chủ động của việc tụ về thành, dịch bệnh ở giữa dân, và sự bị trao vào quyền kẻ thù. Chú thích được làm gọn và chính xác hơn về lối nhấn mạnh cùng gốc trong tiếng Hê-bơ-rơ.'
  reviewer_model: gpt-5.6-terra
