language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: vi
  text: Ta sẽ sai thú hoang dã chống lại các ngươi[a]; chúng sẽ làm các ngươi mất con[b], tiêu diệt gia súc của các ngươi, khiến các ngươi chỉ còn ít người, và đường sá của các ngươi sẽ trở nên hoang vắng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thú vật ngoài đồng.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng một động từ Hê-bơ-rơ thường chỉ việc làm cho ai mất con; từ “con” được hàm ý chứ không được nêu riêng trong câu.
    reason: lexical_alternative
  - marker: c
    text: “Đường sá” cũng có thể dịch là “các nẻo đường”; trong ngữ cảnh này có lẽ chỉ những tuyến đường đi lại trở nên vắng vẻ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: Ta sẽ sai ... đến chống lại các ngươi
  rationale: Hiphil của שלח diễn tả việc sai phái; ב trong ngữ cảnh hành động thù nghịch mang nghĩa “chống lại”. Cách diễn đạt này giữ rõ chủ thể thần linh và sắc thái phán xét.
- source_word: חַיַּת הַשָּׂדֶה
  choice: thú hoang ngoài đồng
  rationale: Cụm từ chỉ các loài thú sống hoang dã trên đất liền. “Thú hoang ngoài đồng” tự nhiên trong tiếng Việt hiện đại và vẫn giữ hình ảnh của nguyên văn.
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: chúng sẽ làm các ngươi mất con
  rationale: Piel của שׁכל thường chỉ việc làm cho ai mất con. Tiếng Việt cần nêu đối tượng hàm ẩn để truyền đạt tự nhiên ý của thành ngữ Hê-bơ-rơ.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: tiêu diệt súc vật của các ngươi
  rationale: הכרית trong ngữ cảnh tai họa mang nghĩa trừ diệt hoặc làm cho không còn; “tiêu diệt” rõ nghĩa hơn lối dịch sát chữ “cắt đứt”. בְּהֵמָה ở đây là gia súc, vật nuôi nói chung.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: khiến các ngươi chỉ còn ít người
  rationale: Hiphil của מעט nghĩa là làm cho ít đi. Cách dịch này truyền đạt trực tiếp sự suy giảm dân số mà không thêm nguyên nhân ngoài văn bản.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: đường sá của các ngươi sẽ trở nên hoang vắng
  rationale: נשׁם chỉ tình trạng hoang vu, vắng vẻ; דְּרָכִים trong bối cảnh xã hội bị tàn phá hợp lý nhất là đường sá hoặc tuyến đi lại theo nghĩa đen.
theological_decisions:
- issue: Đối tượng hàm ẩn của động từ שׁכל
  choice: Dịch rõ là “làm các ngươi mất con”
  alternative: 'Giữ mơ hồ hơn: “làm các ngươi chịu cảnh tang tóc”'
  rationale: Động từ thường chuyên chỉ sự mất con, nhưng danh từ “con” không hiện diện minh nhiên trong câu. Bản chính dùng cách diễn đạt tự nhiên và chú thích cho biết đây là ý hàm ẩn của thành ngữ, nhờ đó vừa rõ nghĩa vừa minh bạch về hình thức nguyên văn.
translation_notes:
  register: Văn phong trang nghiêm nhưng dễ hiểu, dùng đại từ “Ta/các ngươi” phù hợp lời giao ước trực tiếp trong Lê-vi Ký. Tránh từ cổ khó hiểu; giữ nhịp liệt kê dồn dập của các tai họa trong nguyên văn.
