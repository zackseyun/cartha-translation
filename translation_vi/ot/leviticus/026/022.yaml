revisions:
- from: Ta sẽ sai thú hoang ngoài đồng[a] đến chống lại các ngươi; chúng sẽ làm các ngươi mất con[b], tiêu diệt súc vật của các ngươi, khiến các ngươi chỉ còn ít người, và đường sá của các ngươi sẽ trở nên hoang vắng[c].
  to: Ta sẽ sai thú hoang dã chống lại các ngươi[a]; chúng sẽ làm các ngươi mất con[b], tiêu diệt gia súc của các ngươi, khiến các ngươi chỉ còn ít người, và đường sá của các ngươi sẽ trở nên hoang vắng[c].
  rationale: Chỉnh nhẹ để dùng “gia súc” cho đúng nghĩa vật nuôi của בְּהֶמְתְּכֶם và làm câu mở đầu tự nhiên hơn trong tiếng Việt hiện đại. Giữ “mất con” cùng chú thích, vì đó là nghĩa thành ngữ thông dụng của שׁכל trong ngữ cảnh này, đồng thời chú thích minh bạch rằng danh từ này không xuất hiện riêng trong tiếng Hê-bơ-rơ.
