    issue: Chú thích b dùng ‘vô số’ làm nghĩa thay thế của רְבָבָה.
    rationale: רְבָבָה có thể được diễn đạt là ‘một vạn’ hoặc ‘myriad’, nhưng trong câu có phép song đối số học, không nên chú giải thành một lượng vô định ‘vô số’.
  - severity: low
    issue: ‘Dưới lưỡi gươm’ thêm chi tiết ‘lưỡi’ và là cách diễn đạt kém trực tiếp hơn cho לֶחָרֶב.
    rationale: Cụm Hê-bơ-rơ nghĩa là ‘bởi/nhờ gươm’ trong ngữ cảnh chiến trận. ‘Bởi gươm’ giữ được hình ảnh và quan hệ phương tiện.
  revised_text: Năm người trong các ngươi sẽ đuổi theo một trăm người[a], và một trăm người trong các ngươi sẽ đuổi theo một vạn người[b]. Kẻ thù của các ngươi sẽ ngã xuống trước mặt các ngươi bởi gươm.
