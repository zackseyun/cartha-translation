source:
  edition: WLC
  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: vi
  text: Năm người trong các ngươi sẽ đuổi theo một trăm người[a], và một trăm người trong các ngươi sẽ đuổi theo một vạn người[b]. Kẻ thù của các ngươi sẽ ngã xuống trước mặt các ngươi bởi gươm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “truy đuổi”; tương tự ở vế sau.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ רְבָבָה có thể có nghĩa là “mười nghìn” hoặc “một vạn” (myriad); ở đây “một vạn” phù hợp với phép tăng tiến số học.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: sẽ đuổi theo
  rationale: Động từ רדף thường có nghĩa là đuổi theo hoặc truy đuổi. “Đuổi theo” tự nhiên trong tiếng Việt hiện đại và giữ nguyên hình ảnh quân sự.
- source_word: מִכֶּם
  choice: trong các ngươi
  rationale: 'Giới từ מן ở đây mang nghĩa bộ phận: năm người và một trăm người thuộc trong cộng đồng được nói đến.'
- source_word: רְבָבָה
  choice: một vạn người
  rationale: Danh từ này có thể chỉ mười nghìn hoặc một số đông vô kể; trong phép tăng tiến số học của câu, “một vạn” truyền đạt rõ giá trị mười nghìn.
- source_word: וְנָפְלוּ
  choice: sẽ ngã
  rationale: Giữ nghĩa và hình ảnh trực tiếp của נפל; trong văn cảnh chiến trận, từ này hàm ý bị đánh bại hoặc tử trận mà không cần diễn giải thêm.
- source_word: לִפְנֵיכֶם
  choice: trước mặt các ngươi
  rationale: Diễn đạt sát thành ngữ Hê-bơ-rơ về kẻ thù ngã xuống trước lực lượng chiến thắng.
- source_word: לֶחָרֶב
  choice: dưới lưỡi gươm
  rationale: Cụm từ chỉ việc ngã xuống bởi gươm trong chiến trận; cách nói này giữ hình ảnh cụ thể và có sắc thái trang trọng tự nhiên trong tiếng Việt.
theological_decisions:
- issue: 'Lời hứa quân sự trong phước lành giao ước: con số cụ thể hay lối nói nhấn mạnh'
  choice: Giữ nguyên lời hứa quân sự trực tiếp cùng các con số tăng tiến, không làm nhẹ thành lời khích lệ chung chung.
  alternative: Diễn giải các con số chỉ như hình ảnh tổng quát về ưu thế hoặc tinh thần can đảm.
  rationale: Nguyên văn trình bày cụ thể chiến thắng với tương quan lực lượng áp đảo trong bối cảnh các phước lành của giao ước. Bản dịch giữ cả tính cụ thể lẫn khả năng tu từ mà không quyết định thay cho người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ cách xưng hô số nhiều trực tiếp trong lời giao ước; dùng “một vạn” thay cho “mười nghìn” vì gọn, cân xứng với “một trăm” và phù hợp nhịp văn Kinh Thánh.
