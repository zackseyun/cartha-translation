  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: vi
  text: Ta sẽ bẻ gãy niềm kiêu hãnh về sức mạnh của các ngươi, và Ta sẽ làm cho bầu trời[a] của các ngươi như sắt, còn đất đai của các ngươi như đồng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các trời,” một hình thức số nhiều trong tiếng Hê-bơ-rơ thường được dùng để chỉ bầu trời phía trên.
    reason: source_form
  - marker: b
    text: Từ Hê-bơ-rơ có thể chỉ đồng đỏ hoặc đồng thiếc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Ta sẽ bẻ gãy
  rationale: Động từ שׁבר có nghĩa là bẻ gãy hoặc đập vỡ. “Bẻ gãy” tự nhiên trong tiếng Việt và phù hợp với hình ảnh khuất phục sự kiêu hãnh mà không làm tăng mức độ mạnh hơn nguyên văn.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: niềm kiêu hãnh về sức mạnh của các ngươi
  rationale: גְּאוֹן có thể chỉ sự kiêu hãnh, cao trọng hoặc uy nghi; עֹז là sức mạnh hoặc quyền năng. Trong bối cảnh lời nguyền giao ước, cách dịch này thể hiện sự tự phụ vì sức mạnh, đồng thời giữ mối liên hệ giữa hai danh từ.
- source_word: וְנָתַתִּי
  choice: Ta sẽ làm cho
  rationale: נתן thường có nghĩa là ban, đặt hoặc khiến thành. Trong kết cấu so sánh ở đây, “làm cho” diễn đạt tự nhiên kết quả được mô tả.
- source_word: שְׁמֵיכֶם
  choice: bầu trời của các ngươi
  rationale: Danh từ Hê-bơ-rơ có hình thức số nhiều nhưng thường chỉ bầu trời phía trên. “Bầu trời” là cách nói tự nhiên trong tiếng Việt và phù hợp với bối cảnh hạn hán.
- source_word: כַּבַּרְזֶל
  choice: như sắt
  rationale: Giữ nguyên phép so sánh của nguyên văn, gợi hình ảnh bầu trời cứng và không ban mưa mà không giải thích trực tiếp trong câu.
- source_word: אַרְצְכֶם
  choice: đất đai của các ngươi
  rationale: אֶרֶץ có thể là đất, xứ hoặc mặt đất. “Đất đai” phù hợp với bối cảnh nông nghiệp và chỉ vùng đất chịu sự phán xét.
- source_word: כַּנְּחֻשָׁה
  choice: như đồng
  rationale: נְחֻשָׁה có thể chỉ đồng đỏ hoặc đồng thiếc. “Đồng” vừa tự nhiên vừa giữ được độ rộng nghĩa trong tiếng Việt; chú thích nêu rõ khả năng từ vựng.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của hình ảnh lời nguyền
  choice: Giữ hình ảnh bầu trời như sắt và đất đai như đồng, qua đó gợi sự hạn hán và đất cằn cỗi.
  alternative: Diễn giải trực tiếp rằng trời không mưa và đất không sinh hoa lợi.
  rationale: Bối cảnh lời nguyền giao ước cho thấy hạn hán và mất mùa, nhưng nguyên văn diễn đạt bằng ẩn dụ. Giữ nguyên ẩn dụ bảo toàn sức gợi và không thu hẹp ý nghĩa của câu.
- issue: Sắc thái của גְּאוֹן trong cụm גְּאוֹן עֻזְּכֶם
  choice: Hiểu theo nghĩa tiêu cực là niềm kiêu hãnh dựa vào sức mạnh.
  alternative: Dịch trung tính hơn là “uy thế của sức mạnh các ngươi” hoặc “sự cao trọng của sức mạnh các ngươi.”
  rationale: Trong lời cảnh cáo dành cho một dân chống nghịch, sắc thái kiêu hãnh phù hợp nhất; tuy vậy, bản dịch không thêm khái niệm thần học ngoài quan hệ từ ngữ của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “Ta” dành cho Đức Chúa Trời và “các ngươi” dành cho cộng đồng Ít-ra-ên giữ sắc thái trực tiếp của lời giao ước. Câu giữ cấu trúc song song cùng hai hình ảnh kim loại của nguyên văn.
