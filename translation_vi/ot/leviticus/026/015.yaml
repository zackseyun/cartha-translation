id: LEV.26.15
reference: Leviticus 26:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: vi
  text: và nếu các ngươi khước từ những luật lệ của Ta, nếu lòng các ngươi ghê tởm các phán quyết của Ta[a], đến nỗi không thi hành mọi điều răn của Ta, như thế là phá bỏ giao ước của Ta[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “linh hồn các ngươi ghê tởm”; cũng có thể hiểu là “toàn thể con người các ngươi ghê tởm.” “Các phán quyết” cũng có thể dịch là “các quy định” hoặc “các luật định.”'
    reason: Bảo tồn thành ngữ Hê-bơ-rơ dùng נֶפֶשׁ và ghi nhận phạm vi nghĩa pháp lý của מִשְׁפָּטִים.
  - marker: b
    text: 'Cũng có thể dịch: “như thế là vi phạm giao ước của Ta.”'
    reason: Ghi nhận phương án tự nhiên khác cho פרר trong ngữ cảnh giao ước.
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: những luật lệ của Ta
  rationale: Giữ sắc thái luật pháp–giao ước của חֻקִּים, đồng thời phân biệt tương đối với מִשְׁפָּטִים là “các phán quyết” ở vế sau.
- source_word: תִּמְאָסוּ
  choice: khước từ
  rationale: מָאַס diễn tả sự từ bỏ có hàm ý coi thường; “khước từ” tự nhiên, trang trọng và mạnh hơn “không chấp nhận” mà không nhất thiết đẩy nghĩa đến “khinh miệt”.
- source_word: מִשְׁפָּטַי
  choice: các phán quyết của Ta
  rationale: מִשְׁפָּטִים mang sắc thái quyết định hoặc quy định pháp lý; “phán quyết” giữ màu sắc pháp lý và không đồng nhất với חֻקִּים.
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: lòng các ngươi ghê tởm
  rationale: Cụm Hê-bơ-rơ lấy נֶפֶשׁ làm chủ ngữ. “Lòng các ngươi” bảo tồn cách diễn đạt nội tâm/toàn thể con người nhưng tự nhiên hơn “linh hồn các ngươi” trong tiếng Việt hiện đại; “ghê tởm” chuyển tải cường độ của געל.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: đến nỗi không thi hành
  rationale: Thể hiện quan hệ kết quả có thể có của cấu trúc לְבִלְתִּי, đồng thời “thi hành” phù hợp với văn cảnh luật pháp.
- source_word: כָּל מִצְוֺתַי
  choice: mọi điều răn của Ta
  rationale: “Điều răn” là cách dịch chính xác, quen thuộc của מִצְוֹת và duy trì sắc thái giao ước.
- source_word: לְהַפְרְכֶם
  choice: như thế là phá bỏ
  rationale: Hiphil của פרר chỉ việc làm mất hiệu lực hay vi phạm giao ước. Cách dịch này diễn đạt hệ quả của sự bất tuân mà vẫn để chú thích nêu phương án “vi phạm”.
- source_word: בְּרִיתִי
  choice: giao ước của Ta
  rationale: “Giao ước” là thuật ngữ tiếng Việt chuẩn cho בְּרִית trong quan hệ ràng buộc giữa Đức Chúa Trời và dân Ngài.
theological_decisions:
- issue: Cách thể hiện נֶפֶשׁ trong thành ngữ תִּגְעַל נַפְשְׁכֶם
  choice: lòng các ngươi ghê tởm
  alternative: toàn thể con người các ngươi ghê tởm; linh hồn các ngươi ghê tởm; các ngươi ghê tởm
  rationale: “Lòng” giữ chủ thể nội tâm được nêu rõ trong tiếng Hê-bơ-rơ và cường độ cảm xúc, nhưng không áp đặt một quan niệm kỹ thuật về linh hồn tách biệt khỏi thân thể. Chú thích bảo tồn nghĩa rộng hơn là “toàn thể con người”.
- issue: Phân biệt các từ ngữ luật pháp–giao ước
  choice: luật lệ / phán quyết / điều răn / giao ước
  alternative: quy chế / quy định / mệnh lệnh / giao ước
  rationale: Bản dịch duy trì sự xếp chồng của những thuật ngữ gần nghĩa nhưng khác nhau trong nguyên bản, thay vì gộp tất cả thành một từ chung.
- issue: Sắc thái của לְהַפְרְכֶם אֶת־בְּרִיתִי
  choice: như thế là phá bỏ giao ước của Ta
  alternative: như thế là vi phạm giao ước của Ta
  rationale: “Phá bỏ” giữ lực nghĩa mạnh của פרר; “vi phạm” là khả năng dịch pháp lý tự nhiên hơn và được ghi ở chú thích để không che khuất phạm vi nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để phù hợp lời phán trực tiếp của Đức Chúa Trời và đối tượng số nhiều. Câu bắt đầu bằng “và nếu” vì đây là phần tiếp nối cú pháp của câu trước; dấu phẩy cuối câu phản ánh việc ý cảnh báo còn tiếp diễn.
