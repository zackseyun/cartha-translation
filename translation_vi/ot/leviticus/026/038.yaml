base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: vi
  text: Các ngươi sẽ diệt vong giữa các dân tộc, và đất của kẻ thù các ngươi sẽ nuốt chửng các ngươi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: các ngươi sẽ diệt vong
  rationale: Động từ אבד ở thể Qal diễn tả hậu quả là bị tiêu vong trong chuỗi lời nguyền giao ước. “Diệt vong” truyền đạt sự hủy hoại nghiêm trọng nhưng không xác định quá mức cách thức xảy ra.
- source_word: בַּגּוֹיִם
  choice: giữa các dân tộc
  rationale: גּוֹיִם chỉ các dân hoặc các nước. “Giữa các dân tộc” tự nhiên trong tiếng Việt và phù hợp với bối cảnh lưu đày, không đưa vào sắc thái tôn giáo về sau của từ “dân ngoại”.
- source_word: וְאָכְלָה
  choice: sẽ nuốt chửng
  rationale: אכל có nghĩa đen là “ăn”. Khi chủ ngữ là “đất”, “nuốt chửng” giữ được hình ảnh nhân hóa mạnh mẽ và tự nhiên hơn lối dịch sát chữ “ăn các ngươi”.
- source_word: אֶתְכֶם
  choice: các ngươi
  rationale: Tiểu từ đánh dấu tân ngữ trực tiếp đi với hậu tố ngôi thứ hai số nhiều giống đực; tiếng Việt thể hiện tự nhiên bằng tân ngữ “các ngươi”.
- source_word: אֶרֶץ
  choice: đất
  rationale: Trong cụm sở hữu אֶרֶץ אֹיְבֵיכֶם và bối cảnh lưu đày, từ này chỉ miền đất hoặc xứ thuộc về kẻ thù. “Đất của kẻ thù” vừa gọn vừa bảo toàn hình ảnh đất nuốt chửng.
- source_word: אֹיְבֵיכֶם
  choice: của kẻ thù các ngươi
  rationale: Dịch trực tiếp cấu trúc sở hữu và hậu tố ngôi thứ hai số nhiều, giữ nguyên bối cảnh phán xét trong lời nguyền giao ước.
theological_decisions:
- issue: Hình ảnh “đất của kẻ thù” nuốt chửng những người bị lưu đày
  choice: Giữ nguyên ẩn dụ đất sẽ “nuốt chửng” họ.
  alternative: Diễn giải thành “đất của kẻ thù các ngươi sẽ hủy diệt các ngươi”.
  rationale: Bản Hê-bơ-rơ dùng động từ thông thường có nghĩa là “ăn” với “đất” làm chủ ngữ. “Nuốt chửng” bảo tồn sức nặng và tính nhân hóa của lời nguyền mà không giải thích thêm nguyên nhân hay phương thức diệt vong.
translation_notes:
  register: Văn phong trang trọng, hiện đại và trực tiếp. Đại từ “các ngươi” phù hợp với lời Đức Chúa Trời phán với cộng đồng giao ước trong ngữ cảnh pháp luật cổ, đồng thời giữ rõ số nhiều. Không cần chú thích vì “nuốt chửng” đã truyền đạt công khai hình ảnh nghĩa đen của động từ אכל và không có dị bản đáng kể cần nêu.
