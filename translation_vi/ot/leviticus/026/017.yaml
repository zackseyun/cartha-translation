base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: vi
  text: Ta sẽ hướng mặt chống lại các ngươi,[a] và các ngươi sẽ bị đánh bại trước mặt quân thù. Những kẻ ghét các ngươi sẽ cai trị các ngươi, và các ngươi sẽ chạy trốn khi không một ai truy đuổi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “đặt mặt Ta chống lại các ngươi”, một thành ngữ diễn tả quyết tâm chống lại để phán xét.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “dù không một ai truy đuổi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּכֶם
  choice: Ta sẽ hướng mặt chống lại các ngươi
  rationale: Giữ hình ảnh “mặt” trong thành ngữ Hê-bơ-rơ để diễn tả sự chống đối có chủ ý của Đức Chúa Trời trong sự phán xét; “hướng mặt chống lại” tự nhiên và rõ nghĩa hơn lối dịch sát chữ “đặt mặt”.
- source_word: וְנִגַּפְתֶּם
  choice: các ngươi sẽ bị đánh bại
  rationale: Dạng Niphal của נגף trong bối cảnh quân sự chỉ việc bị đánh bại hoặc đánh gục. “Bị đánh bại” truyền đạt rõ kết quả mà không dùng từ cổ.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: trước mặt quân thù
  rationale: Giữ ý nghĩa không gian và quân sự của לִפְנֵי; “quân thù” phù hợp với cảnh chiến trận và phân biệt với “những kẻ ghét” ở vế kế tiếp.
- source_word: וְרָדוּ בָכֶם
  choice: sẽ cai trị các ngươi
  rationale: רדה diễn tả việc cai trị hay nắm quyền trên người khác. “Cai trị” giữ nguyên ý bị khuất phục mà không tự thêm sắc thái tàn bạo quá mức câu chữ.
- source_word: שֹׂנְאֵיכֶם
  choice: những kẻ ghét các ngươi
  rationale: Dịch rõ dạng phân từ “những kẻ ghét” thay vì đồng nhất với אֹיְבֵיכֶם, nhờ đó giữ được sự phân biệt từ vựng trong nguyên văn.
- source_word: וְנַסְתֶּם
  choice: các ngươi sẽ chạy trốn
  rationale: נוס là động từ thông dụng chỉ việc chạy trốn; cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với nỗi kinh hoàng do phán xét.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: khi không một ai truy đuổi
  rationale: Mệnh đề không động từ cho biết họ hoảng sợ bỏ chạy trong lúc thực tế không có người đuổi theo. “Khi” giữ cấu trúc mở của tiếng Hê-bơ-rơ; “dù” cũng là một khả năng hợp lý.
theological_decisions:
- issue: Ngôn ngữ nhân hình về Đức Chúa Trời trong sự phán xét
  choice: Giữ hình ảnh “Ta sẽ hướng mặt chống lại các ngươi”
  alternative: Ta sẽ chống lại các ngươi
  rationale: Hình ảnh khuôn mặt diễn tả lập trường mang tính cá vị và giao ước của Đức Chúa Trời; không nên giản lược thành một lời tuyên bố trừu tượng về sự chống đối.
- issue: Tính chất quyền lực của kẻ thù
  choice: sẽ cai trị các ngươi
  alternative: sẽ thống trị các ngươi
  rationale: Nguyên văn nói đến việc thi hành quyền cai trị trên dân nhưng ở câu này không xác định cụ thể mức độ hà khắc; “cai trị” tránh diễn giải quá mức.
- issue: Quan hệ logic trong mệnh đề cuối
  choice: khi không một ai truy đuổi
  alternative: dù không một ai truy đuổi
  rationale: Tiếng Hê-bơ-rơ đặt cạnh hai mệnh đề mà không nêu rõ quan hệ thời gian hay nhượng bộ. Bản chính dùng “khi”, còn chú thích bảo lưu cách hiểu nhượng bộ tự nhiên trong văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Đại từ “Ta—các ngươi” phù hợp với lời Đức Chúa Trời phán với toàn dân trong ngữ cảnh cảnh cáo. Bản dịch giữ hình ảnh Hê-bơ-rơ khi hình ảnh ấy còn hiểu được trong tiếng Việt, đồng thời dùng chú thích để giải thích thành ngữ và bảo lưu điểm mơ hồ của mệnh đề cuối.
