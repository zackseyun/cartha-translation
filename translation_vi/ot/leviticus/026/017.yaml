  source_fidelity: 'Bản dịch truyền đạt đầy đủ các vế của nguyên văn: Đức Chúa Trời hướng mặt chống lại dân; họ bị đánh bại trước kẻ thù; những kẻ ghét họ cai trị họ; và họ chạy trốn khi không có người truy đuổi. Bản dịch cũng giữ được sự phân biệt từ vựng giữa אֹיְבֵיכֶם (“quân thù/kẻ thù”) và שֹׂנְאֵיכֶם (“những kẻ ghét các ngươi”). “Bị đánh bại” là một cách dịch xác đáng trong ngữ cảnh quân sự cho וְנִגַּפְתֶּם.'
  naturalness: Văn bản rõ ràng, tự nhiên trong tiếng Việt hiện đại và vẫn có sắc thái trang nghiêm phù hợp với lời cảnh cáo giao ước. Cấu trúc “Ta—các ngươi” nhất quán với ngữ cảnh diễn ngôn trực tiếp. “Khi không một ai truy đuổi” là cách đọc có thể chấp nhận được cho mệnh đề Hê-bơ-rơ đặt phối hợp; chú thích đã bảo lưu cách hiểu nhượng bộ cũng tự nhiên trong văn cảnh.
