  text: וַ/אֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵי/כֶ֑ם וּ/בְשַׂ֥ר בְּנֹתֵי/כֶ֖ם תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: vi
  text: Các ngươi sẽ ăn thịt con trai các ngươi, và các ngươi sẽ ăn thịt con gái các ngươi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Các ngươi sẽ ăn
  rationale: Động từ Qal ngôi hai số nhiều trong chuỗi lời nguyền giao ước mang sắc thái dự báo. “Sẽ ăn” diễn đạt tự nhiên lực tương lai; liên từ וַ được thể hiện qua sự tiếp nối của câu trong văn mạch, không nhất thiết thêm “và” ở đầu câu tiếng Việt.
- source_word: בְּשַׂר
  choice: thịt
  rationale: בָּשָׂר chỉ phần thịt của thân thể. Trong tiếng Việt, “thịt” là cách nói trực tiếp, không giảm nhẹ thực tại ghê rợn được mô tả.
- source_word: בְּנֵיכֶם
  choice: con trai mình
  rationale: Danh từ số nhiều giống đực được giữ cụ thể là “con trai,” vì vế sau nêu riêng “con gái.” “Mình” quy chiếu tự nhiên về chủ ngữ số nhiều “các ngươi.”
- source_word: וּבְשַׂר
  choice: và ... thịt
  rationale: Giữ liên từ và lặp lại danh từ “thịt” trong vế thứ hai nhằm bảo toàn cấu trúc song hành cùng sức nặng tu từ của nguyên văn.
- source_word: בְּנֹתֵיכֶם
  choice: con gái mình
  rationale: Dịch trực tiếp để giữ cặp đối xứng con trai–con gái trong tiếng Hê-bơ-rơ.
- source_word: תֹּאכֵלוּ
  choice: các ngươi sẽ ăn
  rationale: Lặp lại đầy đủ động từ như nguyên văn thay vì lược bỏ, qua đó duy trì nhịp điệu và sự nhấn mạnh nghiêm khắc của lời cảnh báo.
theological_decisions:
- issue: Diễn đạt hành vi ăn thịt người trong lời nguyền giao ước
  choice: 'Dịch trực tiếp như một lời dự báo phán xét: “Các ngươi sẽ ăn thịt con trai mình ... con gái mình.”'
  alternative: Diễn đạt giảm nhẹ hoặc dùng lối nói uyển chuyển
  rationale: Nguyên văn đưa ra lời cảnh báo trực diện và không có dấu hiệu cho phép giảm nhẹ. Bản dịch giữ nguyên mức độ kinh hoàng mà không thêm lời giải thích thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. “Các ngươi” giữ sắc thái lời phán hướng đến cộng đồng số nhiều; câu duy trì phép song hành và sự lặp lại có chủ ý của nguyên văn.
