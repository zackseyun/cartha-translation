  terminology: “Các ngươi,” “sẽ ăn,” và “thịt” thích hợp với văn cảnh lời phán xét giao ước; “thịt” không làm nhẹ nội dung. Giữ sự lặp lại của động từ trong hai vế phản ánh nguyên văn.
