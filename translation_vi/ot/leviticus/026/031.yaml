source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: vi
  text: Ta sẽ biến các thành của các ngươi thành chốn hoang tàn, làm cho các nơi thánh của các ngươi hoang phế, và Ta sẽ không ngửi hương thơm đẹp lòng từ các lễ vật của các ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “Ta sẽ không ngửi hương thơm đẹp lòng của các ngươi.” Đây là một thành ngữ tế lễ quen thuộc, nói đến việc Đức Chúa Trời vui nhận lễ vật; cụm từ “từ các lễ vật” được thêm vào cho rõ nghĩa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת עָרֵיכֶם חָרְבָּה
  choice: Ta sẽ biến các thành của các ngươi thành đống hoang tàn
  rationale: נתן có nghĩa cơ bản là “đặt/cho”, nhưng trong kết cấu này mang ý gây nên một tình trạng. Cách dịch “biến ... thành” tự nhiên trong tiếng Việt và giữ rõ hậu quả tàn phá; חָרְבָּה được diễn đạt cụ thể là “đống hoang tàn”.
- source_word: וַהֲשִׁמּוֹתִי
  choice: làm cho ... hoang phế
  rationale: Dạng Hiphil của שמם mang nghĩa khiến một nơi trở nên hoang vu, tiêu điều. “Làm cho ... hoang phế” vừa thể hiện tính gây khiến vừa phù hợp với nơi thờ phượng.
- source_word: מִקְדְּשֵׁיכֶם
  choice: các nơi thánh của các ngươi
  rationale: Danh từ số nhiều מקדש chỉ những nơi được biệt riêng làm thánh hoặc các nơi thờ phượng. “Các nơi thánh” giữ được số nhiều và không thu hẹp từ này thành một đền thờ duy nhất.
- source_word: וְלֹא אָרִיחַ
  choice: Ta sẽ không ngửi
  rationale: Giữ nguyên hình ảnh nhân hình của động từ ריח thay vì thay bằng nghĩa diễn giải “chấp nhận”, qua đó bảo tồn sắc thái tế lễ và sự căng thẳng thần học của nguyên văn.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: mùi thơm làm vui lòng từ các lễ vật của các ngươi
  rationale: רֵיחַ נִיחֹחַ là thành ngữ tế lễ chỉ “mùi thơm làm vui lòng”. Cụm “từ các lễ vật” được bổ sung trong bản dịch để người đọc hiện đại nhận ra đối tượng tế lễ hàm ẩn trong văn cảnh, đồng thời được ghi rõ trong chú thích.
theological_decisions:
- issue: Nên giữ ngôn ngữ cảm giác theo nghĩa đen hay chuyển sang ý nghĩa diễn giải là Đức Chúa Trời khước từ lễ vật
  choice: Giữ cách nói “Ta sẽ không ngửi mùi thơm làm vui lòng”
  alternative: Ta sẽ không chấp nhận các lễ vật của các ngươi
  rationale: Nguyên văn dùng rõ động từ “ngửi” cùng thành ngữ tế lễ “mùi thơm làm vui lòng”. Giữ hình ảnh này bảo tồn kết cấu và sắc thái thần học của câu, không thay lời văn bằng kết luận diễn giải.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “Ta/các ngươi” phù hợp với lời phán trực tiếp của Đức Chúa Trời trong bối cảnh giao ước. Giữ số nhiều của “các nơi thánh” và hình ảnh “ngửi” của nguyên văn; tránh thuật ngữ giáo phái.
