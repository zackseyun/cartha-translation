revisions:
- from: Ta sẽ biến các thành của các ngươi thành đống hoang tàn, làm cho các nơi thánh của các ngươi hoang phế; Ta sẽ không ngửi mùi thơm làm vui lòng từ các lễ vật của các ngươi.[a]
