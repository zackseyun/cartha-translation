    rationale: Cụm này không phải kết hợp từ ngữ thông dụng trong tiếng Việt hiện đại. “Hương thơm đẹp lòng” vừa tự nhiên vừa bảo tồn tính thành ngữ tế lễ, không đổi “ngửi” thành “chấp nhận”.
