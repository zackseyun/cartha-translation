  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: vi
  text: Anh em sẽ ăn lương thực cũ đã để lâu[a], và sẽ đem lương thực cũ ra để nhường chỗ cho lương thực mới.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “Anh em sẽ ăn lương thực cũ để lâu, và vì lương thực mới, sẽ đem lương thực cũ ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Anh em sẽ ăn
  rationale: Dạng Qal hoàn thành có waw trong chuỗi lời chúc phước mang nghĩa tương lai. “Anh em” diễn đạt ngôi thứ hai số nhiều tự nhiên trong tiếng Việt.
- source_word: יָשָׁן נוֹשָׁן
  choice: lương thực cũ đã để lâu
  rationale: יָשָׁן được dùng như danh từ chỉ sản vật dự trữ, còn נוֹשָׁן nhấn mạnh thời gian lưu trữ kéo dài. “Lương thực” đủ rộng, không thu hẹp thành riêng ngũ cốc.
- source_word: וְיָשָׁן
  choice: đồ cũ
  rationale: Tính từ được danh từ hóa, chỉ lương thực cũ đã nhắc đến; cách nói này giữ được sự cô đọng của tiếng Hê-bơ-rơ.
- source_word: מִפְּנֵי חָדָשׁ
  choice: vì có đồ mới
  rationale: מִפְּנֵי ở đây biểu thị nguyên nhân hoặc sự nhường chỗ trước sản vật mới. Thêm “có” giúp câu tiếng Việt tự nhiên mà không biến hàm ý thành lời giải thích quá mức.
- source_word: תּוֹצִיאוּ
  choice: sẽ đem ... ra
  rationale: Dịch sát nghĩa Hiphil của יצא là “làm cho đi ra, đem ra”; giữ nguyên độ mở của động từ thay vì diễn giải cụ thể là dọn bỏ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Đức Chúa Trời phán với cộng đồng giao ước; tránh cách gọi cổ “các ngươi”. Câu chính giữ hình ảnh lương thực dự trữ dồi dào nhưng không xác định quá mức đó là ngũ cốc hay toàn bộ nông sản.
