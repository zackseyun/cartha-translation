  rationale: Bản sửa thay “đồ cũ/đồ mới” bằng “lương thực cũ/lương thực mới” để giữ đúng đối tượng ngầm định của nguyên ngữ và nhất quán với vế đầu. Cụm “để nhường chỗ cho” diễn đạt tự nhiên tác động thực tế của việc đem sản vật cũ ra khi sản vật mới đến, trong khi chú thích bảo lưu trật tự và quan hệ nguyên nhân trực tiếp hơn của tiếng Hê-bơ-rơ.
