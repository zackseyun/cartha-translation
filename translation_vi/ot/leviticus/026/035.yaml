  to: Suốt những ngày bị hoang vu, đất sẽ nghỉ ngơi, hưởng sự nghỉ ngơi mà nó đã không được hưởng trong những kỳ sa-bát của các ngươi[a], khi các ngươi còn cư ngụ trên đất ấy.
