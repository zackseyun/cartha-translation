  text: כָּל יְמֵ֥י הָשַּׁמָּ֖/ה תִּשְׁבֹּ֑ת אֵ֣ת אֲשֶׁ֧ר לֹֽא שָׁבְתָ֛ה בְּ/שַׁבְּתֹתֵי/כֶ֖ם בְּ/שִׁבְתְּ/כֶ֥ם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: vi
  text: Suốt những ngày bị hoang vu, đất sẽ nghỉ ngơi, hưởng sự nghỉ ngơi mà nó đã không được hưởng trong những kỳ sa-bát của các ngươi[a], khi các ngươi còn cư ngụ trên đất ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Những kỳ sa-bát của các ngươi” ở đây nói đến những kỳ nghỉ sa-bát dành cho đất, đặc biệt là các năm sa-bát trong văn cảnh liền trước.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: Suốt những ngày đất bị hoang vu
  rationale: Diễn đạt tự nhiên giá trị thời gian bao quát của כָּל יְמֵי; הַשַּׁמָּה chỉ tình trạng hoang vu của đất, và chủ thể “đất” được nêu rõ theo ngữ cảnh.
- source_word: תִּשְׁבֹּת
  choice: đất sẽ được nghỉ
  rationale: Động từ שׁבת ở giống cái số ít quy chiếu về đất; “được nghỉ” giữ hình ảnh đất hưởng sự ngưng canh tác trong bối cảnh năm sa-bát.
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: bù lại sự nghỉ ngơi mà đất đã không có
  rationale: אֵת אֲשֶׁר giới thiệu điều mà đất sẽ được nghỉ. “Bù lại” làm rõ quan hệ bù đắp hàm chứa trong cú pháp, còn “sự nghỉ ngơi” bảo tồn sự lặp lại của gốc שׁבת.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: trong những kỳ sa-bát của các ngươi
  rationale: Giữ danh từ “sa-bát” thay vì thu hẹp ngay thành “năm sa-bát”; số nhiều và sở hữu ngôi thứ hai được bảo tồn, còn chú thích giải thích nghĩa theo văn cảnh.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: khi các ngươi còn cư ngụ trên đất ấy
  rationale: Infinitive construct của ישׁב có giá trị thời gian; “cư ngụ” trang trọng nhưng dễ hiểu, và “trên đất ấy” làm rõ đại từ giống cái.
theological_decisions:
- issue: Phạm vi nghĩa của “những kỳ sa-bát của các ngươi”
  choice: Giữ cách gọi rộng “những kỳ sa-bát” trong câu chính và giải thích theo văn cảnh bằng chú thích.
  alternative: Dịch trực tiếp là “những năm sa-bát của đất”.
  rationale: Bản Hê-bơ-rơ dùng שַׁבָּתוֹת với hậu tố “của các ngươi”, không ghi trực tiếp “năm”; văn cảnh câu 34 cho thấy trọng tâm là những kỳ nghỉ sa-bát đáng lẽ đất phải được hưởng. Cách dịch này tránh thu hẹp quá mức mà vẫn giúp người đọc hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ ngôi số nhiều trong lời phán xét trực tiếp; lặp “nghỉ/sự nghỉ ngơi” nhằm phản ánh phép lặp của gốc Hê-bơ-rơ שׁבת.
