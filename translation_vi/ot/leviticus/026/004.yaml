id: LEV.26.4
reference: Leviticus 26:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: vi
  text: thì Ta sẽ ban mưa cho các ngươi đúng mùa[a]; đất sẽ sinh hoa lợi, và cây cối ngoài đồng sẽ ra trái[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào đúng thời điểm” hoặc “đến kỳ”.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng danh từ số ít “cây ngoài đồng” với nghĩa tập hợp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Ta sẽ ban
  rationale: Động từ נתן có nghĩa thông thường là “cho”; “ban” tự nhiên trong lời hứa của Đức Chúa Trời mà không thêm ý nghĩa ngoài nguyên văn.
- source_word: גִשְׁמֵיכֶם
  choice: mưa cho các ngươi
  rationale: Dạng số nhiều chỉ những trận hoặc mùa mưa dành cho Israel. Tiếng Việt tự nhiên dùng danh từ khối “mưa”; cụm “cho các ngươi” giữ ý của hậu tố ngôi thứ hai số nhiều.
- source_word: בְּעִתָּם
  choice: đúng mùa
  rationale: Cụm từ nói đến thời điểm thích hợp của mưa trong chu kỳ nông nghiệp; “đúng mùa” ngắn gọn, tự nhiên và sát nghĩa.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: đất sẽ sinh
  rationale: Nguyên văn là “đất sẽ cho”; trong tiếng Việt, “đất sinh hoa lợi” diễn đạt tự nhiên hoạt động sản xuất của đất.
- source_word: יְבוּלָהּ
  choice: hoa lợi
  rationale: יְבוּל chỉ sản vật hay sản lượng do đất tạo ra. “Hoa lợi” phù hợp bối cảnh nông nghiệp và không giới hạn vào một loại cây trồng.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: cây cối ngoài đồng
  rationale: Danh từ số ít trong tiếng Hê-bơ-rơ có nghĩa tập hợp. “Cây cối ngoài đồng” chuyển tải lực tập hợp một cách tự nhiên trong tiếng Việt.
- source_word: יִתֵּן פִּרְיוֹ
  choice: sẽ ra trái
  rationale: Dịch sát là “sẽ cho trái của nó”; “ra trái” là cách nói tiếng Việt tự nhiên đối với cây, vẫn giữ nghĩa cụ thể về khả năng sinh sản.
theological_decisions:
- issue: Phước lành giao ước gắn với mưa và sự màu mỡ của đất
  choice: Trình bày trực tiếp lời hứa về mưa đúng mùa và sản lượng nông nghiệp.
  alternative: Khái quát thành lời hứa thịnh vượng vật chất cho mọi thời đại, hoặc thiêng liêng hóa thành sự dư dật hoàn toàn ẩn dụ.
  rationale: Trong ngữ cảnh Lê-vi Ký 26, câu này nói cụ thể về phước lành nông nghiệp trong giao ước. Bản dịch không mở rộng hay thu hẹp lời hứa theo một hệ thống thần học về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để thể hiện lời phán trực tiếp của Đức Chúa Trời với cộng đồng Israel. Chuyển danh từ số ít tập hợp sang “cây cối” cho tự nhiên trong tiếng Việt, đồng thời ghi chú hình thức Hê-bơ-rơ.
