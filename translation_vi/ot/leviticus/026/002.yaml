base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: vi
  text: Các ngươi phải giữ các ngày Sa-bát của Ta và tôn kính nơi thánh của Ta.[a] Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kính sợ nơi thánh của Ta” hoặc “đứng trong sự kính sợ trước nơi thánh của Ta.” Động từ Hê-bơ-rơ có thể diễn tả sự sợ hãi, lòng tôn kính hoặc sự kinh sợ tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: các ngày Sa-bát của Ta
  rationale: Dạng số nhiều kèm hậu tố ngôi thứ nhất số ít được giữ rõ trong tiếng Việt. “Các ngày Sa-bát” tự nhiên hơn “những Sa-bát” và không thu hẹp cách hiểu vào chỉ một ngày duy nhất.
- source_word: תִּשְׁמֹרוּ
  choice: phải giữ
  rationale: Trong ngữ cảnh mệnh lệnh giao ước, שׁמר mang nghĩa tuân giữ, cẩn thận thực hành. “Phải giữ” vừa ngắn gọn vừa thể hiện lực mệnh lệnh của thể chưa hoàn thành.
- source_word: וּמִקְדָּשִׁי
  choice: và nơi thánh của Ta
  rationale: מִקְדָּשׁ chỉ nơi được biệt riêng là thánh, tức thánh sở. “Nơi thánh” dễ hiểu trong tiếng Việt hiện đại và không xác định quá mức hình thức kiến trúc.
- source_word: תִּירָאוּ
  choice: tôn kính
  rationale: ירא có thể diễn tả sợ hãi, kính sợ hoặc lòng tôn kính. Với nơi thánh làm đối tượng, “tôn kính” truyền đạt thái độ kính cẩn thích hợp, còn các sắc thái khác được bảo lưu trong chú thích.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Công thức tự xưng được dịch trực tiếp, giữ đại từ nhấn mạnh אֲנִי và phiên âm danh riêng giao ước יְהוָה thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước YHWH. “Yahweh” bảo tồn tính chất danh riêng và tránh thay nó bằng một tước hiệu.
- issue: Sắc thái của ירא đối với nơi thánh
  choice: tôn kính
  alternative: kính sợ; kinh sợ; đứng trong niềm kính awe
  rationale: Ngữ cảnh đòi hỏi sự kính cẩn thánh khiết, nhưng động từ vẫn có trường nghĩa gồm sợ hãi, kính sợ và thán phục. Bản chính chọn cách diễn đạt tự nhiên nhất, còn chú thích giữ sự đa nghĩa thực sự của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ngươi” giữ lời phán trực tiếp với cộng đồng số nhiều; “Ta” phù hợp với lời tự xưng của Đức Chúa Trời. Dùng “Sa-bát” là thuật ngữ quen thuộc trong tiếng Việt. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
