  source_fidelity: 'Bản dịch chính chuyển đạt đúng các thành phần của tiếng Hê-bơ-rơ: mệnh lệnh số nhiều «hãy giữ», số nhiều «các ngày Sa-bát của Ta», «nơi thánh của Ta», mệnh lệnh «hãy tôn kính», và công thức tự xưng «Ta là Yahweh». «Tôn kính» phù hợp với ירא trong ngữ cảnh này; chú thích nên bảo lưu các khả năng «kính sợ» và «đứng trong sự kinh sợ/trước sự uy nghi».'
  naturalness: Câu chính tự nhiên, trang trọng và rõ ràng trong tiếng Việt hiện đại. Tuy nhiên, cụm «đứng trong niềm kính awe» trong chú thích là pha trộn tiếng Việt–tiếng Anh, không tự nhiên và không phù hợp với bản tiếng Việt.
  terminology: «Sa-bát», «nơi thánh», và «Yahweh» được dùng nhất quán và thích hợp. «Tôn kính» là một cách dịch tốt cho תיראו; các phương án thay thế trong chú thích cần được diễn đạt bằng tiếng Việt thuần nhất.
  issues:
