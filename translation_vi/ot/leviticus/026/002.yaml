    rationale: «awe» là tiếng Anh chưa được dịch, làm chú thích thiếu tự nhiên và không đáp ứng chuẩn tiếng Việt hiện đại. Có thể thay bằng «đứng trong sự kính sợ trước nơi thánh của Ta» hoặc «kính sợ nơi thánh của Ta», vẫn phản ánh phổ nghĩa của ירא.
