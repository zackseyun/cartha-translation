id: LEV.26.27
reference: Leviticus 26:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֨ם בְּ/זֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י בְּ/קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/027.yaml
  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: vi
  text: Nhưng nếu bất chấp những điều ấy[a], các ngươi vẫn không nghe Ta và cứ sống chống nghịch Ta[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dù vậy” hoặc “dẫu đã trải qua tất cả những điều này.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ nói theo lối thành ngữ: “đi với Ta trong sự chống nghịch,” nghĩa là sống hoặc hành xử đối kháng với Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn tả cả điều kiện lẫn bước chuyển đối lập trong chuỗi lời cảnh báo giao ước đang tăng dần.
- source_word: בְּזֹאת
  choice: bất chấp những điều ấy
  rationale: 'Trong văn cảnh, cụm này chỉ về các hình phạt sửa trị đã nêu trước đó và mang ý nhượng bộ: dù đã trải qua những điều ấy.'
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: không nghe Ta
  rationale: Giữ hình ảnh nghe của động từ שׁמע, đồng thời trong cấu trúc với לִי vẫn hàm ý không chịu nghe theo hay vâng lời.
- source_word: וַהֲלַכְתֶּם
  choice: cứ sống
  rationale: הלך ở đây nói theo lối ẩn dụ về cách ăn ở và hành xử. “Cứ sống” chuyển tải tự nhiên sắc thái tiếp diễn trong tiếng Việt.
- source_word: עִמִּי בְּקֶרִי
  choice: chống nghịch Ta
  rationale: Toàn cụm diễn tả lối hành xử đối kháng trong quan hệ với Đức Chúa Trời. Cách dịch này tránh lối dịch sát chữ khó hiểu nhưng không thu hẹp nghĩa thành sự bất tuân đơn thuần.
theological_decisions:
- issue: Thành ngữ cảnh báo giao ước trong Lê-vi Ký 26
  choice: Giữ sắc thái quan hệ đối kháng qua cụm “cứ sống chống nghịch Ta”.
  alternative: cứ không vâng lời Ta
  rationale: Nguyên văn không chỉ nói đến việc không vâng lời mà còn mô tả một thái độ và lối sống đối nghịch trong quan hệ giao ước; vì vậy không nên làm phẳng sắc thái này.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “các ngươi—Ta” phù hợp với lời Đức Chúa Trời trực tiếp phán cùng toàn dân trong văn cảnh. Dấu phẩy cuối câu được giữ vì câu cảnh báo còn tiếp sang câu kế tiếp.
