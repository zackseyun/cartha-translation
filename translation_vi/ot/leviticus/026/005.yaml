  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: vi
  text: Mùa đập lúa của các ngươi sẽ kéo dài đến mùa hái nho, và mùa hái nho sẽ kéo dài đến mùa gieo hạt. Các ngươi sẽ ăn bánh cho no nê và sống yên ổn trong xứ mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: mùa đập lúa
  rationale: Danh từ chỉ việc hoặc mùa đập lúa; thêm “mùa” giúp diễn đạt tự nhiên và làm rõ sự nối tiếp của các chu kỳ nông nghiệp.
- source_word: בָּצִיר
  choice: mùa hái nho
  rationale: Chỉ mùa thu hoạch nho, phù hợp với bối cảnh nông nghiệp và phân biệt với việc thu hoạch nói chung.
- source_word: יַשִּׂיג / וְהִשִּׂיג
  choice: sẽ kéo dài đến
  rationale: Động từ mang nghĩa “đuổi kịp/chạm tới”; trong ngữ cảnh mùa màng dồi dào, ý là công việc của mùa trước kéo dài cho đến mùa sau.
- source_word: לָשֹׂבַע
  choice: no nê
  rationale: Diễn đạt trạng thái ăn đến thỏa đủ, tự nhiên trong tiếng Việt hiện đại.
- source_word: לָבֶטַח
  choice: an toàn
  rationale: Giữ nghĩa sống trong sự yên ổn, không phải lo sợ hiểm họa.
theological_decisions:
- issue: Tính chất của lời hứa giao ước
  choice: Giữ lời hứa cụ thể về mùa màng sung túc và đời sống an toàn trong xứ
  alternative: Khái quát hóa thành sự thịnh vượng hoặc bình an thuộc linh
  rationale: Nguyên văn nói trực tiếp về chu kỳ nông nghiệp, lương thực và sự cư ngụ an toàn trong đất; không nên linh hóa hoặc mở rộng ngoài văn cảnh.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “các ngươi” để giữ lối xưng hô số nhiều trong lời giao ước; “xứ mình” phản ánh בְּאַרְצְכֶם, tức vùng đất của cộng đồng được nói đến.
