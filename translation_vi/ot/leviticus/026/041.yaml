  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: vi
  text: Ta cũng sẽ đi ngược lại với họ[a] và đưa họ vào xứ của kẻ thù của họ; hoặc bấy giờ[b], tấm lòng không cắt bì của họ[c] sẽ hạ mình, và bấy giờ họ sẽ chấp nhận hình phạt vì tội lỗi mình[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đi với họ trong sự thù nghịch,” hoặc “đi ngược lại với họ.” Đây là công thức được lặp lại trong các lời nguyền rủa của giao ước trong chương này.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “hoặc bấy giờ.” Cụm từ này khó xác định về cú pháp và có thể chỉ thời điểm tấm lòng họ hạ mình, với sắc thái gần như “nếu bấy giờ” hoặc “hoặc có lẽ bấy giờ.”'
    reason: alternative_reading
  - marker: c
    text: “Tấm lòng không cắt bì” là ẩn dụ giao ước chỉ tình trạng cứng cỏi và ô uế bên trong.
    reason: cultural_note
  - marker: d
    text: 'Cũng có thể dịch: “họ sẽ chịu hình phạt vì tội lỗi mình,” “họ sẽ làm cho tội lỗi mình được trả đủ,” hoặc “tội lỗi của họ sẽ được trả xong.” Thành ngữ Hê-bơ-rơ nói đến việc chấp nhận hoặc chịu hậu quả thích đáng của tội lỗi.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Ta cũng
  rationale: 'Giữ sắc thái nhấn mạnh và tương ứng trong hành động của Đức Chúa Trời: họ đối nghịch với Ngài, nên chính Ngài cũng đối nghịch với họ.'
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: sẽ bước đi đối nghịch với họ
  rationale: Giữ hình ảnh “bước đi” và công thức về sự đối nghịch được lặp lại trong các lời nguyền giao ước của Lê-vi Ký 26; chú thích giải thích thành ngữ cho độc giả hiện đại.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: và đưa họ vào đất của kẻ thù họ
  rationale: Diễn đạt trực tiếp thể Hiphil của בוא và giữ rõ bối cảnh bị lưu đày sang lãnh thổ của quân thù.
- source_word: אוֹ אָז
  choice: hoặc bấy giờ
  rationale: Giữ lực phân cách của אוֹ và sự khó hiểu thực sự của cú pháp Hê-bơ-rơ, thay vì tự ý chuyển thành một quan hệ điều kiện chắc chắn.
- source_word: יִכָּנַע
  choice: sẽ hạ mình
  rationale: Với “tấm lòng” làm chủ ngữ, cách diễn đạt này truyền đạt sự khuất phục hoặc khiêm hạ bên trong, đồng thời không loại trừ sắc thái bị hạ xuống của thể Niphal.
- source_word: לְבָבָם הֶעָרֵל
  choice: tấm lòng không cắt bì của họ
  rationale: Giữ nguyên ẩn dụ giao ước giàu ý nghĩa của nguyên văn, thay vì làm phẳng thành “lòng cứng cỏi” hoặc “lòng không ăn năn”.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: và bấy giờ họ sẽ gánh chịu hình phạt vì tội lỗi mình
  rationale: Làm rõ thành ngữ chỉ việc chịu hậu quả thích đáng của sự gian ác, nhưng chú thích vẫn bảo lưu các khả năng “chấp nhận hình phạt” và “đền trả”.
theological_decisions:
- issue: Ẩn dụ הֶעָרֵל được dùng cho tấm lòng
  choice: Giữ “tấm lòng không cắt bì”
  alternative: tấm lòng cứng cỏi; tấm lòng không ăn năn
  rationale: Đây là một ẩn dụ giao ước có liên hệ với Phục Truyền Luật Lệ Ký và các sách tiên tri, không chỉ là lời mô tả chung về sự ngoan cố.
- issue: Ý nghĩa của יִרְצוּ אֶת עֲוֺנָם
  choice: Họ gánh chịu hình phạt vì tội lỗi mình
  alternative: Họ chấp nhận hình phạt vì tội lỗi mình; họ đền trả tội lỗi mình; tội lỗi của họ được trả xong
  rationale: Cụm từ nói đến việc chịu hậu quả của tội lỗi trong khuôn khổ hình phạt giao ước. Cách dịch không biến hành động này thành sự tự chuộc tội có công trạng, nhưng chú thích giữ lại độ rộng nghĩa của thành ngữ.
- issue: Quan hệ cú pháp của אוֹ אָז
  choice: Giữ cách nói khó “hoặc bấy giờ”
  alternative: nếu bấy giờ; hoặc có lẽ bấy giờ
  rationale: Cú pháp Hê-bơ-rơ không hoàn toàn rõ. Không nên âm thầm quyết định rằng đây chắc chắn là mệnh đề điều kiện hay một lời khẳng định theo trình tự.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “Ta” phù hợp lời phán trực tiếp của Đức Chúa Trời. Bản dịch giữ các hình ảnh “bước đi” và “tấm lòng không cắt bì” vì giá trị giao ước và liên văn bản, đồng thời dùng chú thích để tránh gây khó hiểu. Cấu trúc “hoặc bấy giờ” được cố ý giữ hơi gồ ghề nhằm phản ánh sự mơ hồ của nguyên văn.
