  to: Ta cũng sẽ đi ngược lại với họ[a] và đưa họ vào xứ của kẻ thù của họ; hoặc bấy giờ[b], tấm lòng không cắt bì của họ[c] sẽ hạ mình, và bấy giờ họ sẽ chấp nhận hình phạt vì tội lỗi mình[d].
  rationale: Bản sửa tăng tính tự nhiên của tiếng Việt mà không làm phẳng các điểm khó hoặc tranh luận của nguyên văn. “Hoặc bấy giờ” được bảo lưu; ẩn dụ “tấm lòng không cắt bì” cũng được giữ nguyên và được giải thích bằng chú thích. Động từ cuối được chuyển sang “chấp nhận hình phạt” để phản ánh tốt hơn sắc thái của thành ngữ chỉ sự chấp nhận/chịu hậu quả của tội lỗi.
