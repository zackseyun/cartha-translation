    rationale: Cụm Hê-bơ-rơ diễn tả đất ở trong tình trạng hoang vu không có họ. “Vì vắng họ” có thể bị hiểu là một lời quy nguyên nhân; “khi bị hoang vu, không có họ” giữ quan hệ trạng thái và sự vắng mặt rõ hơn.
