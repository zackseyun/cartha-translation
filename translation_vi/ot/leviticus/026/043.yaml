  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: vi
  text: Nhưng đất sẽ bị họ bỏ lại và sẽ hưởng các kỳ nghỉ Sa-bát của mình khi bị hoang vu, không có họ; còn họ sẽ gánh chịu hình phạt vì tội lỗi mình[a], bởi vì—thật vậy, bởi vì—họ đã khước từ các phán quyết của ta, và lòng họ đã ghê tởm các luật lệ của ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhận lấy tội lỗi mình” hoặc “đền bù cho tội lỗi mình.” Thành ngữ Hê-bơ-rơ có thể được hiểu theo nhiều cách; tại đây được dịch theo nghĩa tư pháp trong bối cảnh hình phạt của giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב מֵהֶם
  choice: sẽ bị họ bỏ lại
  rationale: Giữ thể bị động của động từ Nifal và ý đất bị dân cư bỏ lại; cách diễn đạt này tự nhiên hơn lối dịch sát chữ “bị bỏ khỏi họ”.
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: sẽ được hưởng những kỳ sa-bát của mình
  rationale: Trong văn cảnh đất được nghỉ bù các năm sa-bát, רצה diễn tả việc đất nhận hoặc hưởng sự nghỉ ngơi đến hạn; “kỳ sa-bát” giữ thuật ngữ giao ước và làm rõ đây là những thời kỳ nghỉ của đất.
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: trong thời gian bị hoang vu vì vắng họ
  rationale: Diễn đạt cả tình trạng hoang vu của đất lẫn sự vắng mặt của dân, không quy nguyên nhân luân lý vượt quá câu Hê-bơ-rơ.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: sẽ gánh chịu hình phạt vì tội lỗi mình
  rationale: Trong bối cảnh hình phạt giao ước và lưu đày, thành ngữ có sắc thái chịu hậu quả do tội lỗi. “Gánh chịu” tự nhiên trong tiếng Việt và tránh hàm ý họ tự lập công chuộc tội.
- source_word: יַעַן וּבְיַעַן
  choice: bởi vì—thật vậy, bởi vì—
  rationale: Giữ sự lặp lại nhấn mạnh của cấu trúc nguyên nhân trong nguyên văn.
- source_word: בְּמִשְׁפָּטַי
  choice: các phán quyết của ta
  rationale: Phân biệt מִשְׁפָּטִים, các quyết định hay quy định pháp lý trong giao ước, với חֻקּוֹת là “luật lệ” ở vế sau.
- source_word: מָאָסוּ
  choice: khước từ
  rationale: Truyền đạt hành động bác bỏ có chủ ý và sắc thái coi thường, đồng thời phù hợp văn phong trang trọng hiện đại.
- source_word: חֻקֹּתַי
  choice: các luật lệ của ta
  rationale: Cách gọi rõ ràng, tự nhiên cho những quy định đã được ấn định, đồng thời giữ khác biệt từ vựng với “các phán quyết”.
- source_word: גָּעֲלָה נַפְשָׁם
  choice: lòng họ ghê tởm
  rationale: נפשׁ số ít mang nghĩa tập thể chỉ con người nội tâm của họ; tiếng Việt dùng “lòng họ” tự nhiên hơn “linh hồn họ” mà vẫn giữ sức nặng nội tâm của cách nói Hê-bơ-rơ.
theological_decisions:
- issue: Ý nghĩa của עָוֹן trong יִרְצוּ אֶת עֲוֺנָם
  choice: “gánh chịu hình phạt vì tội lỗi mình” theo nghĩa tư pháp
  alternative: “nhận lấy tội lỗi mình” hoặc “đền bù cho tội lỗi mình”
  rationale: Văn cảnh là lời nguyền giao ước, cảnh lưu đày và đất được hưởng những kỳ sa-bát đã bị bỏ qua. עָוֹן có thể chỉ tội lỗi, tình trạng mắc tội hoặc hậu quả hình phạt; ở đây nghĩa hình phạt nổi bật hơn, nhưng chú thích vẫn bảo tồn phạm vi đa nghĩa thật sự của thành ngữ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ta” cho lời Đức Chúa Trời theo văn phong Kinh Thánh; giữ nhịp nhấn mạnh của יַעַן וּבְיַעַן và phân biệt “phán quyết” với “luật lệ”.
