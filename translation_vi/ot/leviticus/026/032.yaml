  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: vi
  text: Chính Ta sẽ làm cho xứ trở nên hoang tàn, và những kẻ thù của các ngươi đang cư ngụ tại đó sẽ kinh hoàng[a] trước cảnh ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ sững sờ” hoặc “sẽ kinh hãi.” Động từ Hê-bơ-rơ có thể diễn tả sự sửng sốt đầy kinh hãi trước cảnh hoang tàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: sẽ làm cho ... trở nên hoang tàn
  rationale: Động từ שׁמם ở thể nguyên nhân diễn tả việc khiến một nơi trở nên hoang vu, tiêu điều. Cách dịch này giữ rõ lực nguyên nhân và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲנִי
  choice: Chính Ta
  rationale: Đại từ độc lập đi kèm hình thái động từ tạo sắc thái nhấn mạnh; “Chính Ta” diễn đạt việc Đức Chúa Trời đích thân tuyên bố hành động này.
- source_word: הָאָרֶץ
  choice: xứ
  rationale: Trong ngữ cảnh các lời nguyền giao ước của Lê-vi Ký, từ này chỉ vùng đất giao ước chứ không phải toàn thể địa cầu. “Xứ” vừa chính xác theo ngữ cảnh vừa phù hợp văn phong trang trọng.
- source_word: וְשָׁמְמוּ
  choice: sẽ kinh hoàng
  rationale: Ở thể đơn, שׁמם có thể nói đến sự hoang tàn hoặc phản ứng sững sờ, kinh hãi. Vì chủ ngữ là những kẻ thù đang cư ngụ trong xứ, “sẽ kinh hoàng” diễn đạt tự nhiên phản ứng của họ trước sự tàn phá, đồng thời chú thích giữ lại các khả năng gần nghĩa.
- source_word: עָלֶיהָ
  choice: trước cảnh ấy
  rationale: Khi đi với שׁמם, עַל có thể đánh dấu đối tượng hoặc nguyên cớ gây kinh hoàng. “Trước cảnh ấy” tự nhiên trong tiếng Việt và quy chiếu về tình trạng hoang tàn của xứ.
- source_word: אֹיְבֵיכֶם
  choice: những kẻ thù của các ngươi
  rationale: Dịch trực tiếp cấu trúc sở hữu, giữ ngôi số nhiều và sắc thái trang trọng của lời phán.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: đang cư ngụ tại đó
  rationale: Phân từ của ישׁב chỉ việc cư trú. “Đang cư ngụ tại đó” cho thấy những kẻ thù sống ngay trong xứ bị tàn phá.
theological_decisions:
- issue: Phạm vi quy chiếu của הָאָרֶץ trong bối cảnh hình phạt giao ước
  choice: xứ, tức vùng đất giao ước trong ngữ cảnh
  alternative: đất hoặc địa cầu
  rationale: Mạch văn nói về các tai họa giáng trên xứ của dân giao ước. Dịch là “xứ” tránh mở rộng phán xét này ra toàn thế giới khi bản văn không đòi hỏi cách hiểu đó.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu; dùng “Ta/các ngươi” để giữ giọng phán trực tiếp của giao ước. Cấu trúc liên kết bằng “và” phản ánh וְ, không thêm ý mục đích hay kết quả.
