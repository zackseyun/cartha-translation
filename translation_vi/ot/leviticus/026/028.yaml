  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: vi
  text: thì Ta cũng sẽ bước đi nghịch với các ngươi trong cơn thịnh nộ[a], và chính Ta sẽ sửa phạt các ngươi gấp bảy lần[b] vì tội lỗi của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta sẽ bước đi với các ngươi trong cơn thịnh nộ của sự chống nghịch”; theo lối dịch truyền thống: “Ta sẽ bước đi nghịch lại các ngươi trong cơn thịnh nộ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Ta sẽ sửa phạt các ngươi bảy lần vì tội lỗi của các ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי עִמָּכֶם
  choice: Ta cũng sẽ đối nghịch với các ngươi
  rationale: Động từ הָלַךְ theo nghĩa đen là “đi/bước đi”, nhưng khi kết hợp với עִם và קֶרִי trong chuỗi lời nguyền giao ước, cụm này diễn tả cách Đức Chúa Trời đối xử trong thế đối nghịch. “Đối nghịch với” truyền đạt tự nhiên ý quan hệ chống đối; nghĩa đen được giữ trong chú thích.
- source_word: בַּחֲמַת קֶרִי
  choice: trong cơn thịnh nộ
  rationale: חֵמָה chỉ cơn giận dữ, thịnh nộ; קֶרִי là từ khó, có thể mang nghĩa “sự đối nghịch/chống đối”. Vì ý đối nghịch đã được thể hiện trong mệnh đề chính, bản văn dùng “trong cơn thịnh nộ” để tránh lặp gượng, đồng thời chú thích bảo lưu cấu trúc và khả năng dịch khác.
- source_word: וְיִסַּרְתִּי
  choice: sẽ sửa phạt
  rationale: יָסַר bao hàm việc sửa trị bằng hình phạt, không chỉ sự trừng phạt thuần túy. “Sửa phạt” giữ được cả sắc thái sửa trị lẫn tính nghiêm khắc của lời cảnh cáo giao ước.
- source_word: אַף אֲנִי
  choice: chính Ta
  rationale: Cụm này nhấn mạnh chủ thể. “Chính Ta” thể hiện sức nhấn tự nhiên trong tiếng Việt; ý “cũng” được thể hiện ở mệnh đề trước.
- source_word: שֶׁבַע
  choice: gấp bảy lần
  rationale: שֶׁבַע theo nghĩa đen là “bảy”, trong ngữ cảnh này diễn tả mức sửa phạt gia tăng. “Gấp bảy lần” rõ nghĩa và tự nhiên, nhưng không quyết định liệu đây phải là con số định lượng tuyệt đối hay cách nói nhấn mạnh.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: vì tội lỗi của các ngươi
  rationale: עַל ở đây nêu căn cứ của sự sửa phạt. “Vì” diễn đạt trực tiếp quan hệ nguyên nhân.
theological_decisions:
- issue: Bản chất sự đáp trả của Đức Chúa Trời trong lời nguyền giao ước
  choice: 'Giữ cả ngôn ngữ đối nghịch và sửa phạt: Đức Chúa Trời đối nghịch với dân và sửa phạt họ.'
  alternative: Chỉ diễn đạt bằng ngôn ngữ trừng phạt, hoặc làm nhẹ ý đối nghịch thành sự không hài lòng nói chung.
  rationale: Nguyên văn kết hợp thành ngữ הָלַךְ + עִם + קֶרִי, diễn tả thế đối nghịch trong mối quan hệ, với יָסַר, từ có thể chỉ sự sửa trị bằng hình phạt. Giữ cả hai tránh thu hẹp câu thành sự báo ứng thuần túy hoặc làm nhẹ tính nghiêm khắc của lời cảnh cáo.
- issue: Ý nghĩa của “bảy” trong mức sửa phạt
  choice: Dịch “gấp bảy lần” và không giải thích thêm trong chính văn.
  alternative: Hiểu hoàn toàn theo nghĩa số học là “bảy lần”, hoặc giải thích thành “hình phạt trọn vẹn”.
  rationale: שֶׁבַע cho phép cách diễn đạt định lượng “bảy lần/gấp bảy lần”, nhưng trong văn cảnh cũng có chức năng nhấn mạnh sự gia tăng. Bản dịch không áp đặt một cách hiểu biểu tượng riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và trực tiếp. Đại từ “Ta–các ngươi” phù hợp lời phán xét trực tiếp của Đức Chúa Trời với toàn dân. “Đối nghịch” và “sửa phạt” giữ sắc thái giao ước cùng độ căng thần học của nguyên văn mà vẫn dễ hiểu.
