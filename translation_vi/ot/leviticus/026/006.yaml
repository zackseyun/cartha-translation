  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: vi
  text: Ta sẽ ban bình an trong xứ; các ngươi sẽ nằm nghỉ mà không ai làm cho các ngươi kinh hãi. Ta sẽ trừ khỏi xứ những thú dữ[a], và gươm[b] sẽ không đi qua xứ các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những thú hoang nguy hiểm.” Cụm từ Hê-bơ-rơ chỉ các loài vật gây hại hoặc đe dọa trong xứ.'
    reason: lexical_alternative
  - marker: b
    text: “Gươm” là hình ảnh Hê-bơ-rơ dùng để chỉ chiến tranh hoặc cuộc xâm lăng bằng vũ lực.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Ta sẽ ban
  rationale: Động từ נָתַן có nghĩa cơ bản là “cho”; “ban” tự nhiên trong lời hứa về phước lành của Đức Chúa Trời mà vẫn giữ nguyên ý nghĩa nguồn.
- source_word: שָׁלוֹם
  choice: bình an
  rationale: שָׁלוֹם bao hàm hòa bình, an ổn và phúc lợi. Trong ngữ cảnh này, “bình an” diễn đạt tự nhiên sự an toàn toàn diện, được cụ thể hóa bằng việc không còn sợ hãi, thú dữ hay chiến tranh.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: אֶרֶץ ở đây chỉ vùng đất giao ước. “Xứ” giữ được sắc thái lãnh thổ cụ thể và phù hợp với văn phong Kinh Thánh trang trọng, dễ hiểu.
- source_word: וּשְׁכַבְתֶּם
  choice: các ngươi sẽ nằm nghỉ
  rationale: שׁכב có nghĩa đen là “nằm xuống”. Thêm “nghỉ” giúp câu tiếng Việt tự nhiên mà vẫn giữ hình ảnh nằm xuống trong sự an toàn, không thu hẹp thành chỉ ngủ.
- source_word: וְאֵין מַחֲרִיד
  choice: mà không ai làm cho các ngươi kinh hãi
  rationale: מַחֲרִיד là dạng gây khiến, chỉ kẻ hoặc điều làm người khác run sợ. Cách dịch này giữ lực gây khiến và phù hợp với hình ảnh nghỉ ngơi an toàn.
- source_word: וְהִשְׁבַּתִּי
  choice: Ta sẽ trừ khỏi
  rationale: Dạng Hiphil của שׁבת nghĩa là khiến chấm dứt. Trong ngữ cảnh loại bỏ thú nguy hiểm khỏi xứ, “trừ khỏi” diễn đạt rõ kết quả mà không thêm ý tiêu diệt tuyệt đối.
- source_word: חַיָּה רָעָה
  choice: những thú dữ
  rationale: Cụm từ chỉ loài vật gây hại hoặc nguy hiểm, không hàm ý chúng xấu xa về đạo đức. “Thú dữ” là cách nói gọn, tự nhiên trong tiếng Việt; số nhiều diễn đạt danh từ tập hợp của tiếng Hê-bơ-rơ.
- source_word: מִן הָאָרֶץ
  choice: khỏi xứ
  rationale: Diễn đạt trực tiếp sự loại bỏ ra khỏi vùng đất đang được nói đến.
- source_word: וְחֶרֶב
  choice: và gươm
  rationale: חֶרֶב nghĩa đen là “gươm” và thường được dùng hoán dụ cho chiến tranh hoặc cuộc xâm lăng. Giữ hình ảnh “gươm” bảo toàn cách diễn đạt của nguyên văn.
- source_word: לֹא תַעֲבֹר
  choice: sẽ không đi qua
  rationale: עבר có nghĩa là đi hoặc vượt qua. Cách dịch trực tiếp này giữ hình ảnh quân thù hay chiến tranh không tiến qua lãnh thổ.
- source_word: בְּאַרְצְכֶם
  choice: xứ các ngươi
  rationale: Hậu tố sở hữu số nhiều chỉ vùng đất thuộc về cộng đồng Y-sơ-ra-ên; “xứ các ngươi” giữ trọng tâm giao ước và lãnh thổ.
theological_decisions:
- issue: Phạm vi của sự bình an được hứa ban
  choice: Lời hứa nói về sự an ổn theo giao ước trong xứ của Y-sơ-ra-ên, bao gồm không còn sợ hãi, thú dữ gây hại và chiến tranh hay xâm lăng.
  alternative: Hiểu sự bình an chỉ là trạng thái nội tâm, hoặc chỉ là ổn định chính trị.
  rationale: Các hình ảnh cụ thể về nằm nghỉ an toàn, thú dữ và gươm cho thấy một phước lành toàn diện nhưng gắn với đời sống thực tế trong xứ. Bản dịch không thu hẹp lời hứa thành thuần túy tinh thần hay thuần túy chính trị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—các ngươi” phản ánh lời Đức Chúa Trời phán với cộng đồng Y-sơ-ra-ên. Dấu chú thích được đặt đúng tại “thú dữ” [a] và “gươm” [b], tương ứng với nội dung từng chú thích.
