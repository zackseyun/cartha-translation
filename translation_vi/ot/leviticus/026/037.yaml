  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh đại từ số nhiều ngôi thứ hai trong lời giao ước; giữ hình ảnh gươm và ý không thể đứng vững trước quân thù.
