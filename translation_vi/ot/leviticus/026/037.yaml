  terminology: “Gươm,” “kẻ thù,” và “đứng vững” phù hợp ngữ cảnh quân sự. Chuyển neo chú thích về ngay sau “nhau” để nó thực sự chú giải cụm אִישׁ בְּאָחִיו, thay vì có vẻ chú giải “gươm.”
