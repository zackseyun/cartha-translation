base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: vi
  text: Họ sẽ vấp ngã lên nhau[a] như chạy trốn trước gươm, dù chẳng ai đuổi theo; và các ngươi sẽ không thể đứng vững trước kẻ thù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “người này vào/chống người anh em mình”; đây là cách nói diễn tả cảnh họ hoảng loạn, va vào nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: họ sẽ vấp
  rationale: Động từ כשל diễn tả việc vấp hoặc loạng choạng; “vấp” giữ được hình ảnh cụ thể và phù hợp với cảnh hoảng loạn.
- source_word: אִישׁ בְּאָחִיו
  choice: vào nhau
  rationale: Cụm từ có nghĩa đen là “người này vào/chống người anh em mình”; cách nói “vấp vào nhau” truyền đạt tự nhiên ý họ va vào nhau trong cơn hoảng loạn.
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: như thể đang đối mặt với gươm
  rationale: Giữ sắc thái so sánh của כְּ và hình ảnh “trước mặt gươm” mà không thêm rõ hành động chạy trốn vốn chỉ được ngữ cảnh gợi ra.
- source_word: וְרֹדֵף אָיִן
  choice: dù chẳng có ai truy đuổi
  rationale: Mệnh đề Hê-bơ-rơ nói không có người truy đuổi; “dù” diễn đạt quan hệ tương phản do ngữ cảnh tạo nên.
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: các ngươi sẽ không thể đứng vững
  rationale: תְּקוּמָה chỉ sự đứng dậy, đứng vững hoặc khả năng kháng cự; trong bối cảnh quân sự, “không thể đứng vững” diễn tả việc không giữ nổi vị thế trước quân thù.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: trước mặt quân thù
  rationale: Cách dịch trực tiếp và tự nhiên trong bối cảnh đối đầu; “quân thù” phù hợp sắc thái tập thể, quân sự của câu.
