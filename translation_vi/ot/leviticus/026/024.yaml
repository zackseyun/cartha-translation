source:
  edition: WLC
  text: וְ/הָלַכְתִּ֧י אַף אֲנִ֛י עִמָּ/כֶ֖ם בְּ/קֶ֑רִי וְ/הִכֵּיתִ֤י אֶתְ/כֶם֙ גַּם אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: vi
  text: thì chính Ta cũng sẽ chống lại các ngươi[a], và chính Ta sẽ đánh phạt các ngươi gấp bảy lần[b] vì tội lỗi của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đối nghịch với các ngươi” hoặc “đối xử thù nghịch với các ngươi”. Từ Hê-bơ-rơ này được lặp lại trong Lê-vi Ký 26 để mô tả sự đối nghịch tương ứng giữa Israel và Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: Hay “bảy lần vì tội lỗi của các ngươi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: thì ... sẽ
  rationale: Động từ הלך theo nghĩa đen là “đi/bước đi”, nhưng trong kết hợp với בְּקֶרִי, tiếng Việt tự nhiên diễn đạt cả thành ngữ là “chống lại”. Liên từ được dịch là “thì” để thể hiện diễn tiến hệ quả trong chuỗi cảnh báo.
- source_word: אַף אֲנִי
  choice: chính Ta cũng
  rationale: Giữ cả ý đáp lại (“cũng”) lẫn sắc thái nhấn mạnh chủ thể thần linh (“chính Ta”).
- source_word: עִמָּכֶם בְּקֶרִי
  choice: chống lại các ngươi
  rationale: Cụm này mô tả thái độ đối nghịch có tính tương ứng trong giao ước. “Chống lại” là cách nói rõ ràng, tự nhiên trong tiếng Việt, đồng thời không giới hạn nghĩa vào cảm xúc thù địch.
- source_word: וְהִכֵּיתִי
  choice: và ... sẽ đánh phạt
  rationale: נכה có nghĩa là đánh; trong ngữ cảnh hình phạt giao ước, “đánh phạt” truyền đạt rõ hành động trừng phạt mà không dùng từ cổ.
- source_word: גַּם אָנִי
  choice: chính Ta
  rationale: Lần nhấn mạnh thứ hai làm nổi bật việc Đức Chúa Trời đích thân thi hành hình phạt.
- source_word: שֶׁבַע
  choice: gấp bảy lần
  rationale: Giữ hình ảnh số bảy và cường độ tu từ của công thức hình phạt, nhưng không quả quyết rằng đây chỉ là phép tính số học cứng nhắc.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: vì tội lỗi của các ngươi
  rationale: עַל ở đây chỉ căn nguyên hay cơ sở của hình phạt; “vì” là cách diễn đạt tự nhiên và chính xác.
theological_decisions:
- issue: Cách dịch thành ngữ phán xét giao ước בְּקֶרִי khi nói về quan hệ đối nghịch giữa Đức Chúa Trời và Israel
  choice: chống lại
  alternative: đối nghịch với; đối xử thù nghịch với
  rationale: “Chống lại” bảo toàn tính tương ứng của sự đối nghịch trong chương này mà không diễn giải quá mức thành một trạng thái cảm xúc đơn thuần.
- issue: Mức độ theo sát nghĩa của công thức hình phạt שֶׁבַע
  choice: gấp bảy lần
  alternative: bảy lần
  rationale: Cách dịch này giữ cường độ cảnh báo và hình ảnh nguyên văn, đồng thời để ngỏ sắc thái tu từ thay vì thu hẹp thành con số thuần túy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/các ngươi” phù hợp lời phán trực tiếp của Đức Chúa Trời trong ngữ cảnh luật giao ước. Không giữ máy móc động từ “bước đi”, vì “bước đi chống lại” thiếu tự nhiên trong tiếng Việt; ý của toàn thành ngữ được chuyển thành “chống lại”.
