source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: vi
  text: Những người còn sót lại trong anh em sẽ hao mòn trong các xứ của kẻ thù anh em vì tội lỗi của họ; và cũng vì các tội lỗi của tổ phụ họ ở cùng họ[a], họ sẽ hao mòn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “ở cùng họ” có thể có nghĩa là các tội lỗi của tổ phụ đi cùng họ hoặc tiếp tục tác động đến họ; cũng có thể hiểu là họ hao mòn cùng với các tội lỗi ấy.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “sẽ mục nát” hoặc “sẽ tàn lụi”; động từ Hê-bơ-rơ diễn tả sự tiêu hao hay phân rã dưới sự phán xét.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: Những người còn sót lại trong anh em
  rationale: Diễn đạt phân từ שׁאר là những người sống sót hoặc còn lại sau sự phán xét, đồng thời giữ ý 'ở trong số anh em' của בָּכֶם.
- source_word: יִמַּקּוּ
  choice: sẽ hao mòn
  rationale: Động từ Niphal của מקק chỉ sự tiêu hao hoặc mục nát dưới sự phán xét. 'Hao mòn' tự nhiên trong tiếng Việt và dùng nhất quán ở cả hai lần xuất hiện.
- source_word: בַּעֲוֺנָם
  choice: vì tội lỗi của chính họ
  rationale: עָוֹן có thể chỉ tội lỗi, sự mắc tội hoặc hậu quả của tội. Giới từ ב được hiểu theo nghĩa nguyên nhân; thêm 'chính' giúp phân biệt rõ với tội lỗi của tổ phụ được nhắc tiếp theo mà không thêm ý thần học.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: tại xứ của kẻ thù mình
  rationale: Giữ bối cảnh lưu đày trên lãnh thổ của quân thù; tiếng Việt có thể dùng danh từ tập hợp 'xứ' tự nhiên dù tiếng Hê-bơ-rơ dùng số nhiều.
- source_word: וְאַף
  choice: và cũng
  rationale: Giữ lực bổ sung và nhấn mạnh của cụm từ mà không làm câu quá cổ kính.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: vì tội lỗi của tổ phụ họ
  rationale: Giữ số nhiều về các tội lỗi và dùng 'tổ phụ' cho אבות, phù hợp văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: אִתָּם
  choice: vẫn ở cùng họ
  rationale: 'Giữ sự cô đọng và mơ hồ của nguyên văn: cụm này có thể nói các tội lỗi của tổ phụ vẫn đi cùng họ, hoặc liên hệ sự hao mòn của họ với các tội lỗi ấy.'
theological_decisions:
- issue: Tội lỗi và sự phán xét qua các thế hệ
  choice: Giữ cả tội lỗi của thế hệ hiện tại lẫn tội lỗi của tổ phụ như nguyên nhân được câu Kinh Thánh nêu ra.
  alternative: Chỉ diễn giải là hậu quả lịch sử của tội tổ tiên, hoặc nói rằng con cháu đơn thuần lặp lại cùng những tội ấy.
  rationale: Nguyên văn nêu rõ cả 'tội lỗi của họ' và 'tội lỗi của tổ phụ họ'. Bản dịch không nên làm nhẹ hoặc tự giải quyết mối căng thẳng về trách nhiệm cá nhân và ảnh hưởng liên thế hệ.
- issue: Quan hệ cú pháp của אִתָּם
  choice: Gắn 'vẫn ở cùng họ' với tội lỗi của tổ phụ nhưng đánh dấu chú thích về tính mơ hồ.
  alternative: Hiểu là họ hao mòn cùng với tội lỗi của tổ phụ.
  rationale: Cách chọn này đọc tự nhiên hơn trong tiếng Việt, nhưng chú thích giữ lại khả năng cú pháp khác của cụm Hê-bơ-rơ ngắn gọn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' để duy trì lời phán trực tiếp với cộng đồng giao ước; dùng 'tổ phụ' thay vì cách gọi quá khẩu ngữ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
