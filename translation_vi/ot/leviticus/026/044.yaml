source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: vi
  text: Dù vậy, ngay cả trong lúc họ ở trong xứ kẻ thù của họ, Ta cũng sẽ không ruồng bỏ họ, không ghê tởm họ đến mức diệt sạch họ[a] và phá vỡ giao ước của Ta với họ; vì Ta là Yahweh[b], Đức Chúa Trời của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hủy diệt họ hoàn toàn” hoặc “làm cho họ tuyệt diệt”.'
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” phiên âm danh riêng יהוה (YHWH) của Đức Chúa Trời.
    reason: divine_name
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: Thế nhưng, ngay cả khi
  rationale: 'Cụm từ này nhấn mạnh ý nhượng bộ và tương phản: dù các hình phạt và cảnh lưu đày đã xảy ra, điều Đức Chúa Trời sắp khẳng định vẫn còn hiệu lực. Cách diễn đạt này tự nhiên trong tiếng Việt và gắn זֹאת với hoàn cảnh được nêu ngay sau đó.'
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: họ ở trong xứ của kẻ thù
  rationale: ב với động từ nguyên mẫu cấu tạo diễn tả hoàn cảnh thời gian; chuỗi sở hữu אֶרֶץ אֹיְבֵיהֶם được chuyển trực tiếp là “xứ của kẻ thù”.
- source_word: לֹא מְאַסְתִּים
  choice: Ta cũng sẽ không ruồng bỏ họ
  rationale: מָאַס ở đây chỉ sự khước từ, loại bỏ về quan hệ. “Ruồng bỏ” diễn đạt rõ việc chối bỏ một dân trong bối cảnh giao ước mà không làm yếu sắc thái của từ.
- source_word: וְלֹא גְעַלְתִּים
  choice: không ghê tởm họ
  rationale: גָּעַל mang sắc thái ghê tởm, chán ghét mạnh. “Ghê tởm” giữ được cường độ cảm xúc và vẫn là cách nói trang trọng, dễ hiểu.
- source_word: לְכַלֹּתָם
  choice: đến mức diệt sạch họ
  rationale: Động từ כָּלָה có thể nói đến việc làm cho hết hẳn hoặc tiêu diệt hoàn toàn. “Đến mức” thể hiện quan hệ kết quả/mức độ với hai động từ đi trước, còn “diệt sạch” giữ sắc thái toàn diện.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: và phá vỡ giao ước của Ta với họ
  rationale: הֵפֵר khi đi với בְּרִית chỉ việc phá bỏ, làm mất hiệu lực giao ước. “Phá vỡ giao ước” là cách diễn đạt minh bạch và tự nhiên trong tiếng Việt.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: vì Ta là Yahweh, Đức Chúa Trời của họ
  rationale: כִּי nêu lý do làm nền cho lời cam kết. Danh riêng יהוה được phiên là “Yahweh”, còn אֱלֹהֵיהֶם được dịch là “Đức Chúa Trời của họ” để giữ lời khẳng định về quan hệ giao ước.
theological_decisions:
- issue: Cách thể hiện phương diện/thời gian của các động từ qatal מְאַסְתִּים và גְעַלְתִּים
  choice: 'Dùng hướng tương lai: “Ta cũng sẽ không… không…”'
  alternative: 'Có thể dịch theo hiện tại hoặc hoàn thành: “Ta không…” hay “Ta đã không…”'
  rationale: Các hình thái qatal tự chúng không tương ứng máy móc với một thì tiếng Việt. Trong mạch lời tiên báo về cảnh dân ở xứ kẻ thù, cách dùng “sẽ không” truyền đạt rõ lực cam kết hướng đến hoàn cảnh ấy mà không biến nhận định về hình thái thành một quy tắc tuyệt đối.
- issue: Cách chuyển danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: CHÚA hoặc Giê-hô-va
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh giao ước יהוה. Phiên “Yahweh” giúp phân biệt danh riêng này với tước hiệu “Chúa” và không thêm một cách giải nghĩa mang tính hệ phái.
- issue: Quan hệ của hai động từ nguyên mẫu לְכַלֹּתָם và לְהָפֵר
  choice: 'Hiểu là kết quả/mức độ của việc ruồng bỏ và ghê tởm: “đến mức… và…”'
  alternative: 'Có thể trình bày như hai mục đích song song: “để… để…”'
  rationale: Cấu trúc Hê-bơ-rơ cho phép sắc thái mục đích hoặc kết quả. Bản dịch chọn cách diễn đạt tự nhiên hơn trong tiếng Việt nhưng không biến hai hành động thành những lời hứa tách rời nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời; “họ” giữ mạch quy chiếu đến dân Israel. Câu duy trì sự căng thẳng giữa hình phạt lưu đày và lòng trung tín với giao ước, không suy diễn rằng hình phạt bị hủy bỏ.
