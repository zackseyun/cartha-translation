source:
  edition: WLC
  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: vi
  text: Nếu qua những việc ấy, các ngươi vẫn không chịu để Ta sửa dạy, mà cứ đi ngược lại Ta[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn là một thành ngữ khó dịch, sát nghĩa: “đi với Ta trong sự chống nghịch”; cũng có thể dịch: “sống trong thái độ thù nghịch với Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: qua những việc ấy
  rationale: Giới từ בְּ được hiểu theo nghĩa phương tiện, chỉ những hình phạt đã nêu trước đó; “qua” vừa tự nhiên trong tiếng Việt vừa giữ mối liên hệ với văn cảnh.
- source_word: תִוָּסְרוּ לִי
  choice: không chịu để Ta sửa dạy
  rationale: Dạng Nifal của יסר diễn tả việc được uốn nắn hoặc sửa trị. Cách nói “không chịu để” cho thấy những hình phạt đã xảy ra nhưng không đạt kết quả sửa đổi; לִי được diễn đạt theo quan hệ với Đấng phán là “Ta” mà không thêm ý ngoài văn bản.
- source_word: וַהֲלַכְתֶּם
  choice: mà cứ đi
  rationale: Động từ “đi” được giữ để bảo tồn hình ảnh chỉ lối sống; “mà cứ” thể hiện sự tương phản và tiếp diễn ngoan cố trong mệnh đề điều kiện.
- source_word: עִמִּי קֶרִי
  choice: ngược lại Ta
  rationale: Đây là một thành ngữ khó xác định hoàn toàn, gồm “với Ta” và danh từ קֶרִי chỉ thái độ đối nghịch hoặc thù nghịch. “Đi ngược lại Ta” là tiếng Việt tự nhiên, giữ được cả hình ảnh bước đi lẫn ý chống đối.
theological_decisions:
- issue: Thành ngữ giao ước עִמִּי קֶרִי
  choice: đi ngược lại Ta
  alternative: sống trong thái độ thù nghịch với Ta; đi đối nghịch với Ta
  rationale: Bản dịch giữ sức căng của hình ảnh về một lối sống chống lại Đức Chúa Trời, không thu hẹp thành một hành vi bất tuân riêng lẻ và cũng không áp đặt một phạm trù thần học về sau.
- issue: Chức năng của לִי sau תִוָּסְרוּ
  choice: để Ta sửa dạy
  alternative: được sửa dạy mà quay về với Ta; được Ta sửa dạy
  rationale: Đại từ giới từ có sắc thái thành ngữ và có thể nhấn mạnh Đấng sửa dạy hoặc sự đáp ứng hướng về Ngài. Bản chính chọn cách diễn đạt tự nhiên theo văn cảnh nhưng không thêm mục đích “quay về” vốn không được nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “các ngươi” phù hợp lời phán trực tiếp với cộng đồng giao ước trong văn cảnh Lê-vi Ký; viết hoa “Ta” để chỉ Đấng phán. Dấu phẩy cuối câu được giữ vì câu này tiếp nối sang câu kế.
