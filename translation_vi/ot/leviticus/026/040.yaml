  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: vi
  text: Nhưng nếu họ xưng nhận tội lỗi của mình và tội lỗi của cha ông họ, về sự bất trung mà họ đã tỏ ra đối với Ta[a], và cả việc họ đã sống chống nghịch Ta[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “sự phản bội” hoặc “hành vi bội tín”. Tiếng Hê-bơ-rơ dùng danh từ và động từ cùng một gốc để nhấn mạnh việc vi phạm lòng trung thành: “trong sự bất trung mà họ đã bất trung với Ta”.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đã sống thù nghịch với Ta”. Từ Hê-bơ-rơ được dùng ở đây là một từ khó, xuất hiện nhiều lần trong chương này để chỉ cách hành xử đối nghịch hoặc thù nghịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Nhưng nếu họ xưng nhận
  rationale: Động từ Hitpael của ידה mang nghĩa “xưng nhận”. Trong mạch điều kiện tiếp nối câu trước, “Nhưng nếu” diễn đạt tự nhiên quan hệ cú pháp, dù hình thức Hê-bơ-rơ có thể được hiểu sát hơn là “và họ sẽ xưng nhận”.
- source_word: עֲוֺנָם
  choice: tội lỗi của mình
  rationale: עָוֹן có thể chỉ sự gian ác, tội lỗi hoặc tội trạng; ở đây đó là hành vi đáng trách phải được xưng nhận. “Tội lỗi” rõ ràng, tự nhiên và vẫn giữ sức nặng đạo đức.
- source_word: עֲוֺן אֲבֹתָם
  choice: tội lỗi của cha ông mình
  rationale: Giữ nguyên chiều kích tập thể và liên thế hệ của cụm sở hữu Hê-bơ-rơ. “Cha ông” là cách nói tự nhiên trong tiếng Việt cho tổ phụ nam giới mà từ אָבוֹת nêu rõ.
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: tức là sự bất trung họ đã phạm đối với Ta
  rationale: Danh từ và động từ cùng gốc מעל nhấn mạnh hành vi vi phạm lòng trung thành trong quan hệ giao ước. “Sự bất trung… đã phạm” truyền đạt ý nghĩa ấy, dù không thể tái tạo hoàn toàn phép lặp cùng gốc một cách tự nhiên trong tiếng Việt.
- source_word: וְאַף
  choice: và cũng
  rationale: Đánh dấu nội dung bổ sung trong lời xưng nhận mà không cường điệu sắc thái nhấn mạnh.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: họ đã sống chống nghịch Ta
  rationale: הלך được dùng theo nghĩa lối sống/cách hành xử; קֶרִי là từ khó, trong chương này chỉ thái độ đối nghịch hoặc thù nghịch. “Sống chống nghịch” tự nhiên hơn lối dịch từng chữ “đi với Ta cách chống nghịch”.
theological_decisions:
- issue: Lời xưng nhận bao gồm tội lỗi của cha ông
  choice: Giữ “tội lỗi của cha ông mình” trong chính văn
  alternative: tội lỗi của tổ tiên; hậu quả tội lỗi của cha ông
  rationale: Nguyên văn nói trực tiếp đến עֲוֺן אֲבֹתָם, không chỉ hậu quả hay gương xấu của thế hệ trước. Bản dịch giữ chiều kích giao ước và tập thể mà không thêm một cách giải thích giáo lý.
- issue: Sắc thái của בְּקֶרִי
  choice: chống nghịch Ta
  alternative: thù nghịch với Ta; cư xử trái nghịch với Ta
  rationale: Từ קֶרִי hiếm và khó xác định chính xác. Chính văn dùng cách diễn đạt rộng “chống nghịch”, còn chú thích bảo tồn khả năng mang sắc thái thù nghịch.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Trời theo văn thể Kinh Thánh tiếng Việt. Cấu trúc “tức là… và cũng xưng nhận rằng…” làm rõ hai nội dung của sự xưng nhận nhưng không giải quyết thay sự căng thẳng thần học về trách nhiệm tập thể.
