  terminology: “Xưng nhận”, “tội lỗi”, “bất trung”, và “chống nghịch” phù hợp. “Bất trung” giữ bình diện quan hệ giao ước của מעל; chú thích nêu các khả năng “phản bội/bội tín”. “Chống nghịch” là cách dịch thận trọng cho từ קשה/khó xác định qeri trong ngữ cảnh này, với chú thích bảo lưu sắc thái “thù nghịch”.
