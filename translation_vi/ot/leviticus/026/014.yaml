  text: וְ/אִם לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: vi
  text: Nhưng nếu các ngươi không lắng nghe Ta và không làm theo mọi điều răn này,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vâng lời Ta.” Động từ Hê-bơ-rơ có thể mang nghĩa lắng nghe với thái độ vâng phục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Trong ngữ cảnh, liên từ mở đầu phần tương phản với các phước lành trước đó, còn אִם giữ rõ ý điều kiện.
- source_word: תִשְׁמְעוּ לִי
  choice: lắng nghe Ta
  rationale: שׁמע với ל có thể chỉ việc nghe với thái độ vâng phục. Cách dịch này giữ hình ảnh nghe theo sát tiếng Hê-bơ-rơ, trong khi mệnh đề kế tiếp nói riêng về việc thực hành điều răn.
- source_word: וְלֹא תַעֲשׂוּ
  choice: và không làm theo
  rationale: עשה có nghĩa rộng là làm hoặc thực hiện; trong ngữ cảnh luật pháp, “làm theo” tự nhiên hơn trong tiếng Việt và diễn đạt việc thực hành các điều răn.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: mọi điều răn này
  rationale: כָּל là “mọi/tất cả,” מִצְוֺת là “điều răn,” và הָאֵלֶּה là đại từ chỉ định “này.” Cụm tiếng Việt ngắn gọn, tự nhiên và giữ sắc thái giao ước-pháp luật.
theological_decisions:
- issue: Nên dịch שׁמע ל là “lắng nghe Ta” hay diễn giải thành “vâng lời Ta”
  choice: lắng nghe Ta
  alternative: vâng lời Ta
  rationale: Nguyên văn nói đến việc nghe Đức Chúa Trời, còn mệnh đề tiếp theo nói riêng đến việc làm theo các điều răn. Giữ “lắng nghe” bảo tồn sự phân biệt trong câu và không thu gọn hai ý thành một.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ ngôi số nhiều trong lời giao ước trực tiếp; viết hoa “Ta” vì người nói trong ngữ cảnh là Đức Chúa Trời. Dấu phẩy đặt trước ký hiệu chú thích vì câu còn tiếp tục sang câu kế.
