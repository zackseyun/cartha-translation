  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: vi
  text: Các ngươi sẽ truy đuổi kẻ thù của các ngươi, và họ sẽ ngã xuống trước mặt các ngươi dưới gươm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «bởi gươm». Cụm từ Híp-ri có thể diễn tả việc ngã xuống trong chiến trận do gươm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: Các ngươi sẽ truy đuổi
  rationale: Động từ רדף thường có nghĩa là truy đuổi; cách dịch này giữ rõ sắc thái quân sự và tự nhiên trong tiếng Việt.
- source_word: אֹיְבֵיכֶם
  choice: kẻ thù mình
  rationale: Danh từ אֹיֵב là từ thông dụng chỉ kẻ thù; “mình” quy chiếu tự nhiên về chủ ngữ số nhiều “các ngươi”.
- source_word: וְנָפְלוּ
  choice: và chúng sẽ ngã
  rationale: Giữ hình ảnh trực tiếp của נפל là “ngã”; trong bối cảnh chiến trận, từ này có thể hàm ý bị đánh bại hoặc tử trận mà không cần diễn giải thêm.
- source_word: לִפְנֵיכֶם
  choice: trước mặt các ngươi
  rationale: Diễn đạt thành ngữ לפני kèm hậu tố, vừa sát nghĩa vừa rõ ràng trong tiếng Việt.
- source_word: לֶחָרֶב
  choice: bởi gươm
  rationale: Trong ngữ cảnh chiến trận, לְ với חֶרֶב có thể biểu thị phương tiện hoặc kết quả; “bởi gươm” giữ hình ảnh nguyên văn và diễn đạt phương tiện gây nên sự ngã xuống.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh ngôi thứ hai số nhiều trong lời giao ước; “chúng” tạo sự phân biệt rõ với dân được nói đến. Không thêm chú thích vì phương án “bởi gươm” tự nhiên trong tiếng Việt và không cần nêu một biến thể thuần thành ngữ tiếng Anh.
