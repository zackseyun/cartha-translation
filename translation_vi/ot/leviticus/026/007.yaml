  to: Các ngươi sẽ truy đuổi kẻ thù của các ngươi, và họ sẽ ngã xuống trước mặt các ngươi dưới gươm[a].
  rationale: Sửa sở hữu ngữ để rõ và tự nhiên hơn, dùng đại từ quy chiếu trung tính, và thay «bởi gươm» bằng thành ngữ tiếng Việt tự nhiên hơn. Chú thích bảo tồn khả năng diễn đạt khác của cụm Híp-ri mà không thay đổi ý nghĩa đoạn văn.
