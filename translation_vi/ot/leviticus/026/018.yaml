id: LEV.26.18
reference: Leviticus 26:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: vi
  text: Nhưng nếu bất chấp tất cả những điều này[a], các ngươi vẫn không nghe lời Ta, thì Ta sẽ tiếp tục sửa phạt các ngươi gấp bảy lần[b] vì tội lỗi của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sau tất cả những điều này” hoặc “mặc cho những điều này.” Thành ngữ Hê-bơ-rơ nói đến việc vẫn không vâng lời bất chấp các hình phạt đã nêu trước đó.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “bảy”; có thể hiểu là “bảy lần.” Cách nói Hê-bơ-rơ này có thể chỉ hình phạt được tăng cường, chứ không nhất thiết là một con số phải hiểu hoàn toàn theo nghĩa đen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Giữ sức nối tiếp của וְ, đồng thời diễn đạt tự nhiên sự chuyển sang một điều kiện trái với phản ứng đáng lẽ phải có sau các hình phạt trước đó.
- source_word: עַד אֵלֶּה
  choice: bất chấp tất cả những điều này
  rationale: Trong văn cảnh, thành ngữ này chỉ sự tiếp tục không vâng lời mặc cho các hình phạt đã nêu, chứ không đơn thuần mang nghĩa thời gian là “cho đến”.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: không nghe lời Ta
  rationale: “Nghe lời” giữ hình ảnh nghe của שׁמע và đồng thời truyền đạt hàm ý đáp ứng bằng sự vâng phục trong tiếng Việt tự nhiên.
- source_word: וְיָסַפְתִּי
  choice: Ta sẽ tiếp tục
  rationale: Diễn đạt ý tiếp diễn và gia tăng của יסף trong chuỗi lời cảnh cáo.
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: sửa phạt các ngươi
  rationale: “Sửa phạt” giữ cả hai sắc thái sửa dạy và trừng phạt của יסר trong bối cảnh các chế tài giao ước.
- source_word: שֶׁבַע
  choice: gấp bảy lần
  rationale: Diễn đạt cách dùng trạng từ của “bảy” để chỉ mức độ hình phạt gia tăng, đồng thời giữ khả năng hiểu theo số lượng cụ thể.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: vì tội lỗi của các ngươi
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân hoặc căn cứ do עַל biểu thị ở đây.
theological_decisions:
- issue: Bản chất của יָסַר trong bối cảnh lời nguyền giao ước
  choice: sửa phạt
  alternative: trừng phạt; sửa dạy
  rationale: “Sửa phạt” bảo tồn sự căng thẳng giữa tính trừng trị và mục đích sửa dạy, không thu hẹp hành động này thành báo ứng thuần túy cũng không làm nhẹ yếu tố hình phạt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/các ngươi” phù hợp lời phán trực tiếp của Đức Chúa Trời với cộng đồng giao ước. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
