  text: וְ/זָכַרְתִּ֖י אֶת בְּרִיתִ֣/י יַעֲק֑וֹב וְ/אַף֩ אֶת בְּרִיתִ֨/י יִצְחָ֜ק וְ/אַ֨ף אֶת בְּרִיתִ֧/י אַבְרָהָ֛ם אֶזְכֹּ֖ר וְ/הָ/אָ֥רֶץ אֶזְכֹּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: vi
  text: Bấy giờ, Ta sẽ nhớ đến giao ước của Ta với Gia-cốp[a], và cả giao ước của Ta với Y-sác; Ta cũng sẽ nhớ đến giao ước của Ta với Áp-ra-ham, và Ta sẽ nhớ đến đất ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và Ta sẽ nhớ đến.” Liên từ Hê-bơ-rơ có thể chỉ đơn giản là “và”; “bấy giờ” thể hiện mối liên hệ của câu này với ngữ cảnh ngay trước đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Bấy giờ, Ta sẽ nhớ lại
  rationale: Động từ זכר trong bối cảnh giao ước hàm ý nhớ đến với ý định hành động, nhưng bản dịch giữ nguyên cách nói “nhớ lại” thay vì diễn giải thêm. Liên từ וְ được dịch theo mạch văn là “bấy giờ”; nghĩa đơn giản “và” được ghi ở chú thích.
- source_word: בְּרִיתִי
  choice: giao ước của Ta
  rationale: בְּרִית là thuật ngữ tiêu chuẩn chỉ mối cam kết ràng buộc; “giao ước” vừa chính xác vừa quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: וְאַף
  choice: cũng
  rationale: Trong chuỗi liệt kê này, וְאַף mang sắc thái bổ sung và nhấn mạnh. “Cũng” diễn đạt tự nhiên lực bổ sung ấy; cấu trúc lặp lại giúp duy trì sự nhấn mạnh.
- source_word: יִצְחָק
  choice: Y-sác
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֶזְכֹּר
  choice: Ta sẽ nhớ
  rationale: Giữ động từ hữu hạn được lặp lại trong tiếng Hê-bơ-rơ để bảo tồn nhịp điệu và sức nhấn tu từ, thay vì lược bỏ cho trơn câu.
- source_word: וְהָאָרֶץ
  choice: xứ ấy
  rationale: הָאָרֶץ trong ngữ cảnh giao ước chỉ vùng đất đã được nói đến, tức đất hứa. “Xứ ấy” tự nhiên trong tiếng Việt và thể hiện tính xác định của mạo từ Hê-bơ-rơ mà không thêm tên địa lý không có trong câu.
theological_decisions:
- issue: Thứ tự và sự nhấn mạnh của các giao ước với các tổ phụ
  choice: 'Giữ thứ tự Hê-bơ-rơ: Gia-cốp, Y-sác, Áp-ra-ham, đồng thời giữ cụm “giao ước của Ta” với từng tổ phụ.'
  alternative: Đổi thành thứ tự niên đại Áp-ra-ham, Y-sác, Gia-cốp, hoặc gộp thành “giao ước với Áp-ra-ham, Y-sác và Gia-cốp”.
  rationale: Thứ tự đảo ngược và sự lặp lại là những đặc điểm có chủ ý của nguyên văn, tạo trọng âm tu từ; không nên làm phẳng thành công thức quen thuộc.
- issue: Ý nghĩa việc Đức Chúa Trời “nhớ”
  choice: Dịch bằng “nhớ lại/nhớ đến”, không mở rộng thành hành động cụ thể.
  alternative: “Nhớ lại và hành động”, “thực hiện” hoặc “lập lại giao ước”.
  rationale: Trong bối cảnh giao ước, việc Đức Chúa Trời nhớ thường hướng đến hành động, nhưng nguyên văn chỉ dùng זכר. Giữ cách nói này bảo tồn chiều sâu và sự căng thẳng thần học của câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Dấu chấm phẩy giúp giữ sự lặp lại có chủ ý của động từ “nhớ” mà câu tiếng Việt vẫn rõ ràng.
