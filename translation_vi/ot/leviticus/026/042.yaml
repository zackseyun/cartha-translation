  naturalness: Câu nhìn chung trang trọng và dễ hiểu. Dùng nhất quán “nhớ đến” làm câu tự nhiên, sáng rõ hơn; việc thêm “sẽ” ở các vế tiếng Việt chỉ biểu thị rõ thì tương lai đã có ở động từ Hê-bơ-rơ, không thêm nghĩa.
  terminology: “Giao ước,” “Ta,” và các dạng tên Gia-cốp, Y-sác, Áp-ra-ham đều phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Đất ấy” sát với “the land” hơn “xứ ấy” trong ngữ cảnh đất giao ước, đồng thời không xác định địa danh ngoài nguyên văn.
