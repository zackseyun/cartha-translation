  - severity: low
    issue: Chú thích dùng cụm “cạn kiệt cho điều hư không” không tự nhiên trong tiếng Việt.
    rationale: Có thể nêu lựa chọn sát chữ hơn bằng “sẽ bị dùng cạn cho điều hư không,” đồng thời giải thích rằng danh từ “cây” ở dạng số ít nhưng mang nghĩa tập hợp.
