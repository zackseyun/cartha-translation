  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: vi
  text: Sức lực các ngươi sẽ bị tiêu hao vô ích,[a] đất của các ngươi sẽ không cho hoa lợi, và cây cối trong đất sẽ không cho trái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát chữ hơn: “Sức lực các ngươi sẽ bị dùng cạn cho điều hư không.” Trong vế cuối, tiếng Hê-bơ-rơ dùng “cây” ở dạng số ít với nghĩa tập hợp: “cây trong đất sẽ không cho trái của nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: sẽ hao mòn
  rationale: Động từ תמם diễn tả sức lực bị dùng cạn hoặc kiệt dần; “hao mòn” tự nhiên trong tiếng Việt và phù hợp với lao động không đem lại kết quả.
- source_word: לָרִיק
  choice: vô ích
  rationale: Cụm từ chỉ sự luống công, không đạt mục đích; “vô ích” truyền đạt rõ ý nghĩa trong lời nguyền giao ước.
- source_word: כֹּחֲכֶם
  choice: sức lực các ngươi
  rationale: כח ở đây là sức lực được bỏ ra trong lao động; cách dịch này giữ sắc thái cụ thể hơn “quyền năng”.
- source_word: אַרְצְכֶם
  choice: đất đai các ngươi
  rationale: ארץ trong ngữ cảnh nói về đất canh tác thuộc về dân; “đất đai” rõ nghĩa và tự nhiên.
- source_word: יְבוּלָהּ
  choice: hoa lợi
  rationale: יבול chỉ sản vật hoặc sản lượng do đất sinh ra; “hoa lợi” là cách diễn đạt trang trọng, dễ hiểu và đủ rộng.
- source_word: תִתֵּן
  choice: sinh
  rationale: Nghĩa đen là “cho”, nhưng với đất và cây, “sinh” diễn đạt tự nhiên hành động tạo ra hoa lợi và trái.
- source_word: וְעֵץ הָאָרֶץ
  choice: cây cối trong xứ
  rationale: Danh từ עץ ở số ít có chức năng tập hợp; tiếng Việt tự nhiên dùng “cây cối”. הָאָרֶץ tại đây chỉ vùng đất/xứ đang được nói đến.
- source_word: פִּרְיוֹ
  choice: trái
  rationale: Hậu tố Hê-bơ-rơ ở số ít hòa hợp với danh từ tập hợp עץ; “trái” trong tiếng Việt không buộc phải đánh dấu số và giữ nguyên ý.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phù hợp lời phán trực tiếp với toàn dân trong ngữ cảnh giao ước; giữ phép song hành giữa đất không sinh hoa lợi và cây không sinh trái.
