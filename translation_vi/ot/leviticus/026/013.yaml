revisions:
- from: Ta là Yahweh, Đức Chúa Trời của các ngươi, Đấng đã đưa các ngươi ra khỏi đất Ai Cập, thoát cảnh làm nô lệ cho chúng. Ta đã bẻ gãy những đòn ách của các ngươi và khiến các ngươi bước đi thẳng lưng.[a]
