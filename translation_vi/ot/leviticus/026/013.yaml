  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִֽ/הְיֹ֥ת לָ/הֶ֖ם עֲבָדִ֑ים וָ/אֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּ/כֶ֔ם וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֖ם קֽוֹמְמִיּֽוּת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: vi
  text: Ta là Yahweh, Đức Chúa Trời của các ngươi, Đấng đã đưa các ngươi ra khỏi đất Ai Cập, khỏi cảnh làm nô lệ cho họ. Ta đã bẻ gãy những thanh ngang của ách các ngươi và khiến các ngươi bước đi thẳng lưng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khiến các ngươi bước đi hiên ngang” hoặc “khiến các ngươi bước đi ngẩng cao đầu.”'
    reason: Từ קוֹמְמִיּוּת chỉ tư thế thẳng đứng; trong ngữ cảnh, từ này cũng có thể gợi phẩm giá của người không còn bị cúi mình dưới ách.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó giữ rõ công thức giao ước trong nguyên văn.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Trong công thức giao ước, từ này chỉ Đức Chúa Trời duy nhất của Israel; đại từ số nhiều phù hợp với cộng đồng đang được phán bảo.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: đã đưa các ngươi ra khỏi đất Ai Cập
  rationale: Giữ sắc thái tác động của thể Hiphil, tức Yahweh khiến dân ra khỏi Ai Cập, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: מִהְיוֹת לָהֶם עֲבָדִים
  choice: thoát cảnh làm nô lệ cho chúng
  rationale: עֲבָדִים ở đây nói đến thân phận bị áp bức tại Ai Cập nên “nô lệ” chính xác hơn “tôi tớ”; “thoát cảnh” thể hiện sự giải phóng khỏi tình trạng ấy.
- source_word: מֹטֹת עֻלְּכֶם
  choice: những đòn ách của các ngươi
  rationale: Giữ hình ảnh cụ thể về các thanh hoặc đòn thuộc chiếc ách, đồng thời dùng cách gọi gọn và dễ hiểu trong tiếng Việt.
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: khiến các ngươi bước đi
  rationale: Giữ nghĩa tác động của thể Hiphil thay vì làm phẳng thành “dẫn các ngươi đi”.
- source_word: קוֹמְמִיּוּת
  choice: thẳng lưng
  rationale: Diễn tả tư thế đứng thẳng, đối lập với cảnh cúi mình dưới ách, và vẫn gợi phẩm giá được phục hồi mà không biến nghĩa hàm ẩn thành lời giải thích.
theological_decisions:
- issue: Thân phận của Israel tại Ai Cập
  choice: nô lệ
  alternative: tôi tớ
  rationale: Bối cảnh là sự áp bức và giải phóng khỏi lao dịch cưỡng bức; “nô lệ” giữ rõ tình trạng bị lệ thuộc, không làm nhẹ ý của câu.
- issue: Hình ảnh giải phóng ở cuối câu
  choice: khiến các ngươi bước đi thẳng lưng
  alternative: dẫn các ngươi đi hiên ngang / khiến các ngươi bước đi ngẩng cao đầu
  rationale: Bản dịch giữ cả nghĩa tác động của động từ lẫn hình ảnh tư thế thẳng đứng. Những cách nói về sự hiên ngang hoặc ngẩng cao đầu truyền đạt đúng hàm ý phẩm giá nhưng diễn giải nhiều hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “Ta/các ngươi” để phản ánh lời phán giao ước với toàn thể Israel; giữ danh Yahweh và hình ảnh cụ thể về ách, đồng thời tránh lối diễn đạt cổ khó hiểu.
