  rationale: Chỉnh nhẹ để đại từ chỉ người Ai Cập tự nhiên và rõ hơn, đồng thời làm rõ hình ảnh “các thanh ngang của ách”. Bản sửa giữ nguyên sắc thái giải phóng khỏi thân phận nô lệ, hành động trực tiếp của Yahweh, và tư thế bước đi thẳng đứng ở cuối câu.
