  terminology: “Yahweh”, “Đức Chúa Trời”, “nô lệ”, và “thẳng lưng” đều phù hợp. “Thanh ngang của ách” giữ hình ảnh cụ thể của מֹטֹת mà không áp đặt diễn giải thần học.
