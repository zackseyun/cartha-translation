source:
  edition: WLC
  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: vi
  text: Nhưng vì họ, Ta sẽ nhớ lại giao ước với những người thuở trước[a], là những người Ta đã đưa ra khỏi đất Ai Cập trước mắt các dân tộc, để Ta là Đức Chúa Trời của họ. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giao ước với tổ phụ họ” hoặc “giao ước với các thế hệ trước”. Tiếng Hê-bơ-rơ nói sát nghĩa là “giao ước [với] những người trước”, chỉ thế hệ giao ước thuở trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Nhưng ... Ta sẽ nhớ lại
  rationale: וְ có thể là “và”, nhưng trong mạch văn ở đây nó đánh dấu bước chuyển tương phản sau lời phán xét; “nhưng” diễn đạt tự nhiên chức năng diễn ngôn ấy. זכר được dịch là “nhớ lại”.
- source_word: לָהֶם
  choice: vì họ
  rationale: Giữ sắc thái của giới từ ל, cho thấy việc nhớ đến giao ước hướng tới lợi ích của họ, thay vì hiểu là đối tượng trực tiếp “nhớ họ”.
- source_word: בְּרִית רִאשֹׁנִים
  choice: giao ước với những người thuở trước
  rationale: רִאשֹׁנִים là tính từ số nhiều được danh từ hóa, nghĩa đen là “những người trước/thuở trước”. Cách dịch này gần nguồn Hê-bơ-rơ và không xác định quá mức họ là tổ phụ, trong khi mệnh đề sau cho thấy đó là thế hệ được đưa khỏi Ai Cập.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: là những người Ta đã đưa ra
  rationale: Đại từ quan hệ quy chiếu tự nhiên về những người thuở trước chứ không phải giao ước; “là những người” làm rõ quan hệ cú pháp trong tiếng Việt.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: khỏi đất Ai Cập
  rationale: Giữ công thức lịch sử giao ước quen thuộc, đồng thời dùng lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: trước mắt các dân tộc
  rationale: Phản ánh khá sát thành ngữ Hê-bơ-rơ và nhấn mạnh cuộc xuất hành diễn ra công khai, có các dân tộc chứng kiến.
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: để Ta làm Đức Chúa Trời của họ
  rationale: Diễn đạt tự nhiên công thức giao ước “làm Đức Chúa Trời của họ”, đồng thời giữ chủ thể ngôi thứ nhất từ văn cảnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Đối tượng của cụm “giao ước với những người trước”
  choice: Giữ cách gọi “những người thuở trước”, với mệnh đề kế tiếp xác định họ là những người được đưa khỏi Ai Cập.
  alternative: “giao ước với tổ phụ họ” hoặc “giao ước với các thế hệ trước”
  rationale: Cấu trúc Hê-bơ-rơ cô đọng và רִאשֹׁנִים chỉ có nghĩa căn bản là “những người trước”. Mệnh đề “Ta đã đưa [họ] ra khỏi đất Ai Cập” hướng đến con người, nhưng không buộc phải thêm khái niệm huyết thống “tổ phụ”. Bản dịch giữ độ mở của nguyên văn.
- issue: Quan hệ giữa việc nhớ giao ước và dân đang chịu hình phạt
  choice: Dịch לָהֶם là “vì họ”.
  alternative: “nhớ đến giao ước của họ” hoặc lược bỏ sắc thái lợi ích
  rationale: Giới từ ל biểu thị việc Đức Chúa Trời nhớ giao ước vì lợi ích của dân; cách dịch không diễn giải thêm bản chất hay điều kiện của sự phục hồi.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “Ta” phù hợp lời phán trực tiếp của Đức Chúa Trời. Dấu chấm tách lời tuyên bố kết “Ta là Yahweh” để tạo nhịp rõ ràng trong tiếng Việt.
