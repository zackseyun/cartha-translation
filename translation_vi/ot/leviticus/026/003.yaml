base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: vi
  text: Nếu các ngươi bước đi theo các luật lệ của ta,[a] tuân giữ các điều răn của ta và thực hành chúng,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “bước đi trong các luật lệ của ta”, một thành ngữ giao ước nói về việc sắp đặt đời sống theo các luật lệ ấy; cũng có thể dịch là “làm theo các luật lệ của ta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Giữ nguyên lực điều kiện rõ ràng của công thức giao ước; “khi” sẽ làm yếu sắc thái này.
- source_word: בְּחֻקֹּתַי תֵּלֵכוּ
  choice: các ngươi bước đi theo các luật lệ của ta
  rationale: Giữ hình ảnh “bước đi” của הלך, đồng thời dùng “theo” để thành ngữ tự nhiên và dễ hiểu trong tiếng Việt, diễn tả việc sống phù hợp với các luật lệ của Đức Chúa Trời.
- source_word: מִצְוֺתַי
  choice: các điều răn của ta
  rationale: “Điều răn” giữ sắc thái pháp lý-giao ước của מִצְוָה và phân biệt hợp lý với “luật lệ” ở vế trước.
- source_word: תִּשְׁמְרוּ
  choice: tuân giữ
  rationale: Trong ngữ cảnh luật pháp, שׁמר chỉ việc gìn giữ bằng cách vâng theo; “tuân giữ” tự nhiên và chính xác hơn nghĩa đen đơn thuần “canh giữ”.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: và thực hành chúng
  rationale: Diễn đạt trực tiếp việc đem các điều răn ra thực hiện; “thực hành” tự nhiên hơn “làm chúng” trong tiếng Việt nhưng vẫn giữ sự nhấn mạnh vào hành động.
theological_decisions:
- issue: Thành ngữ về sự vâng phục trong giao ước
  choice: Giữ ẩn dụ “bước đi” trong cụm “bước đi theo các luật lệ của ta”.
  alternative: sống theo các luật lệ của ta; làm theo các luật lệ của ta
  rationale: Nguyên văn dùng hình ảnh הלך, vừa nói đến nếp sống vừa mang sắc thái giao ước. Giữ “bước đi” bảo tồn hình ảnh Kinh Thánh, còn giới từ “theo” giúp câu rõ nghĩa trong tiếng Việt mà không áp đặt cách giải thích giáo phái.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “các ngươi… ta” để phản ánh lời phán trực tiếp với cộng đồng Israel số nhiều và duy trì sắc thái uy nghiêm; câu kết bằng dấu phẩy vì câu điều kiện tiếp tục ở các câu sau.
