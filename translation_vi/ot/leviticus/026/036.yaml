revisions:
- from: Còn những người sống sót trong các ngươi, Ta sẽ khiến lòng họ khiếp nhược tại xứ của kẻ thù họ. Tiếng một chiếc lá bị gió cuốn[a] cũng sẽ đuổi theo họ; họ sẽ chạy trốn như chạy trốn gươm, rồi ngã xuống dù không ai đuổi theo.
  to: Còn những người còn lại trong các ngươi, Ta sẽ khiến lòng họ nhụt chí trong các xứ của kẻ thù họ. Tiếng một chiếc lá bị cuốn đi[a] sẽ đuổi theo họ; họ sẽ chạy trốn như chạy trốn trước gươm, và sẽ ngã xuống dù không ai đuổi theo.
  rationale: Bản sửa giữ sát các chi tiết ngữ pháp và từ vựng của tiếng Hê-bơ-rơ, đặc biệt số nhiều «các xứ» và tác nhân không được nêu của chiếc lá bị cuốn đi. Đồng thời, bản sửa dùng tiếng Việt hiện đại, tự nhiên hơn và giữ nguyên tính mơ hồ của «ngã xuống».
  reviewer_model: gpt-5.6-terra
