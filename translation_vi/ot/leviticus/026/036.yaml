source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: vi
  text: Còn những người còn lại trong các ngươi, Ta sẽ khiến lòng họ nhụt chí trong các xứ của kẻ thù họ. Tiếng một chiếc lá bị cuốn đi[a] sẽ đuổi theo họ; họ sẽ chạy trốn như chạy trốn trước gươm, và sẽ ngã xuống dù không ai đuổi theo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tiếng một chiếc lá bị gió cuốn.”'
    reason: Động từ נִדָּף diễn tả chiếc lá bị thổi hoặc cuốn đi, nhưng không nêu rõ gió là tác nhân.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: những người sống sót trong các ngươi
  rationale: Phân từ שׁאר chỉ những người còn lại sau sự đoán phạt; “sống sót” làm rõ bối cảnh, còn “trong các ngươi” giữ cách trực tiếp nói với Israel.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: Ta sẽ khiến lòng họ khiếp nhược
  rationale: Hiphil của בוא diễn tả hành động gây nên, còn מֹרֶךְ là sự suy sụp lòng can đảm; cách dịch này tự nhiên trong tiếng Việt và giữ rõ tác nhân thần linh.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: tại xứ của kẻ thù họ
  rationale: Giữ ý họ ở trong lãnh thổ của kẻ thù; danh từ số nhiều tiếng Hê-bơ-rơ có thể chỉ các vùng đất phân tán, nhưng tiếng Việt dùng “xứ” theo nghĩa tập hợp tự nhiên hơn.
- source_word: קוֹל עָלֶה נִדָּף
  choice: tiếng một chiếc lá bị gió cuốn
  rationale: קוֹל là “tiếng”, עָלֶה là “lá”, còn נִדָּף mô tả vật bị thổi hoặc cuốn đi. “Bị gió cuốn” diễn đạt hình ảnh tự nhiên trong tiếng Việt; chú thích ghi nhận cách dịch ít xác định tác nhân hơn.
- source_word: וְרָדַף אֹתָם
  choice: cũng sẽ đuổi theo họ
  rationale: 'Giữ phép nhân hóa đầy mỉa mai: chỉ tiếng lá mà trở thành vật đuổi bắt họ.'
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: họ sẽ chạy trốn như chạy trốn gươm
  rationale: Cụm danh từ chỉ cách thức chạy trốn như khi đối diện với gươm; cách lặp động từ tự nhiên, rõ nghĩa và giữ phép so sánh.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: rồi ngã xuống dù không ai đuổi theo
  rationale: “Ngã xuống” giữ độ rộng nghĩa của נפל, không quyết định đó là vấp ngã, gục xuống hay chết; “dù” nêu bật nghịch lý của câu cuối.
theological_decisions:
- issue: Bản chất của sự đoán phạt
  choice: Nỗi khiếp đảm nội tâm do chính Đức Chúa Trời gây nên trong cảnh lưu đày, dẫn đến hoảng loạn vô cớ
  alternative: Chỉ là cuộc truy đuổi quân sự bên ngoài hoặc chỉ là cảm giác bất an mang tính ẩn dụ
  rationale: Câu Hê-bơ-rơ trực tiếp quy việc lòng họ suy nhược cho hành động của Đức Chúa Trời, rồi mô tả họ chạy và ngã dù không có người truy đuổi. Bản dịch giữ cả tác nhân thần linh lẫn phương diện tâm lý mà không thêm một khuôn khổ giáo lý về sau.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ta” và “các ngươi” để duy trì lời phán trực tiếp có tính giao ước; tránh từ cổ khó hiểu. Dấu [a] được đặt ngay sau cụm từ liên quan.
