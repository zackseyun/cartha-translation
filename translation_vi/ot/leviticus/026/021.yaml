source:
  edition: WLC
  text: וְ/אִם תֵּֽלְכ֤וּ עִמִּ/י֙ קֶ֔רִי וְ/לֹ֥א תֹאב֖וּ לִ/שְׁמֹ֣עַֽ לִ֑/י וְ/יָסַפְתִּ֤י עֲלֵי/כֶם֙ מַכָּ֔ה שֶׁ֖בַע כְּ/חַטֹּאתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: vi
  text: Nếu các ngươi cư xử chống nghịch Ta[a] và không chịu nghe Ta, thì Ta sẽ giáng thêm trên các ngươi tai họa gấp bảy lần, tương xứng với tội lỗi của các ngươi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hành xử thù nghịch với Ta” hoặc “sống đối lập với Ta”. Thành ngữ Hê-bơ-rơ ở đây, sát nghĩa là “đi với Ta trong קֶרִי”, rất khó xác định; trong chương này, nó diễn tả thái độ đối nghịch hơn là hành động do ngẫu nhiên.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát cấu trúc hơn: “Ta sẽ thêm vào mà đánh phạt các ngươi gấp bảy lần vì tội lỗi của các ngươi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: cư xử chống nghịch Ta
  rationale: Động từ “đi” được dùng như thành ngữ chỉ cách sống hay cách hành xử; קֶרִי là từ khó, nhưng trong Lê-vi Ký 26 diễn tả thái độ đối nghịch với Đức Chúa Trời. Cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ ý đối kháng.
- source_word: תֹאבוּ
  choice: không chịu
  rationale: Diễn đạt ý chí không sẵn lòng, thậm chí khước từ, chứ không chỉ đơn thuần là không làm.
- source_word: לִשְׁמֹעַ לִי
  choice: nghe Ta
  rationale: Giữ nghĩa từ vựng “nghe/lắng nghe”; trong bối cảnh giao ước, hàm ý vâng lời vẫn được để ngỏ thay vì được đưa thẳng vào bản dịch.
- source_word: וְיָסַפְתִּי עֲלֵיכֶם מַכָּה
  choice: Ta sẽ giáng thêm trên các ngươi tai họa
  rationale: וְיָסַפְתִּי mang nghĩa thêm vào hoặc gia tăng; מַכָּה có phạm vi nghĩa rộng gồm đòn đánh, sự giáng phạt hay tai họa, nên không thu hẹp thành một loại dịch bệnh cụ thể.
- source_word: שֶׁבַע
  choice: gấp bảy lần
  rationale: Trong công thức hình phạt lặp lại của chương này, số bảy có chức năng chỉ mức độ gia tăng; “gấp bảy lần” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: tương xứng với tội lỗi của các ngươi
  rationale: Giới từ כְּ biểu thị sự tương ứng hoặc tỷ lệ; cách dịch này bảo toàn sắc thái hình phạt tương xứng, thay vì chỉ diễn đạt nguyên nhân.
theological_decisions:
- issue: Tính chất của công thức hình phạt trong giao ước
  choice: Diễn tả sự gia tăng hình phạt của Đức Chúa Trời tương xứng với tội lỗi của dân, nhưng không xác định hình thức tai họa cụ thể.
  alternative: Dịch מַכָּה riêng là “dịch bệnh” hoặc hiểu כְּחַטֹּאתֵיכֶם chỉ theo nghĩa nguyên nhân là “vì tội lỗi của các ngươi”.
  rationale: Mạch văn nói đến các chế tài của giao ước và sự gia tăng hình phạt. Nguyên văn không buộc phải giới hạn מַכָּה vào dịch bệnh, còn giới từ כְּ thích hợp với ý tương ứng hoặc tỷ lệ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/các ngươi” phù hợp với lời phán trực tiếp trong ngữ cảnh luật giao ước. Bản dịch ưu tiên tương đương tối ưu, giữ sắc thái ý chí trong “không chịu”, tính khó xác định của קֶרִי qua chú thích, và ý tương xứng trong công thức hình phạt.
