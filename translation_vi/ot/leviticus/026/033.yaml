source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: vi
  text: Ta sẽ làm các ngươi tản lạc giữa các dân tộc, và Ta sẽ rút gươm truy đuổi các ngươi; đất các ngươi sẽ trở nên hoang vu, và các thành của các ngươi sẽ thành phế tích.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱזָרֶה
  choice: Ta sẽ làm ... tản lạc
  rationale: Động từ זרה ở thể Hiphil diễn tả việc làm cho phân tán. “Làm ... tản lạc” tự nhiên trong tiếng Việt và giữ nguyên hình ảnh phán xét dẫn đến lưu đày.
- source_word: בַגּוֹיִם
  choice: giữa các dân tộc
  rationale: גּוֹיִם chỉ các dân hay các quốc gia. “Các dân tộc” phù hợp với bối cảnh dân Israel bị phân tán giữa những dân ngoại mà không đưa thêm sắc thái thần học hậu kỳ.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: tuốt gươm
  rationale: Thành ngữ ריק kết hợp với חֶרֶב có nghĩa rút hoặc tuốt gươm. “Tuốt gươm” là cách diễn đạt cụ thể, trang trọng và tự nhiên trong tiếng Việt.
- source_word: אַחֲרֵיכֶם
  choice: đuổi theo các ngươi
  rationale: Nghĩa đen là “sau các ngươi”, nhưng trong ngữ cảnh thanh gươm, cụm từ diễn tả sự truy đuổi thù nghịch. “Đuổi theo” truyền đạt rõ chức năng ngữ cảnh mà không làm tăng mức độ ý nghĩa.
- source_word: שְׁמָמָה
  choice: hoang vu
  rationale: Danh từ này chỉ tình trạng tan hoang, vắng vẻ. Cấu trúc “trở nên hoang vu” là tiếng Việt tự nhiên và giữ sắc thái của lời nguyền giao ước.
- source_word: חָרְבָּה
  choice: phế tích
  rationale: Từ này chỉ nơi bị phá hủy hoặc tình trạng đổ nát. Với “các thành”, “thành phế tích” diễn đạt tự nhiên kết quả của sự tàn phá.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: sẽ trở nên ... sẽ thành
  rationale: Trong ngữ cảnh phán xét, היה mang sắc thái chuyển sang một tình trạng mới; cách dịch này làm rõ kết quả hoang tàn mà vẫn sát cấu trúc Hê-bơ-rơ.
theological_decisions:
- issue: Ngôn ngữ phán xét giao ước mô tả sự phân tán và truy đuổi bằng quân sự
  choice: 'Giữ nguyên tác nhân trực tiếp ở ngôi thứ nhất của Đức Chúa Trời: “Ta sẽ làm ... tản lạc” và “tuốt gươm đuổi theo”'
  alternative: Dùng thể bị động hoặc cách nói phi ngôi để giảm nhẹ vai trò trực tiếp của Đức Chúa Trời
  rationale: Bản Hê-bơ-rơ quy trực tiếp các hình phạt giao ước này cho hành động của Đức Chúa Trời; bản dịch cần giữ nguyên sức nặng thần học ấy, không giảm nhẹ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta/các ngươi” để phản ánh lời phán trực tiếp mang tính giao ước. Không đặt chú thích vì phương án “tuốt gươm đuổi theo” truyền đạt ngay trong chính văn cả thành ngữ rút gươm lẫn ý truy đuổi; chú thích tiếng Anh được cung cấp dường như đặt sai vị trí sau “nations” và nội dung của nó thực chất liên quan đến cụm וַהֲרִיקֹתִי ... חָרֶב.
