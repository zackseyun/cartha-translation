  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: vi
  text: Ta sẽ phá hủy những nơi thờ tự trên cao của các ngươi, chặt hạ các trụ thờ[a] của các ngươi, đặt xác chết của các ngươi lên trên xác chết của các thần tượng của các ngươi[b]; tâm hồn Ta sẽ ghê tởm các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các trụ thờ mặt trời”. Từ Hê-bơ-rơ chỉ những vật thờ cúng; hình dạng và công dụng chính xác vẫn còn được tranh luận.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ lặp lại cùng một từ “xác chết” cho cả dân chúng lẫn các thần tượng, nhấn mạnh tính vô tri và sự ô nhục của các thần tượng. Từ được dịch là “thần tượng” cũng mang sắc thái khinh miệt mạnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: Ta sẽ phá hủy
  rationale: Dạng Hiphil diễn tả việc gây nên sự hủy diệt; “phá hủy” mạnh, rõ và tự nhiên trong tiếng Việt.
- source_word: בָּמֹתֵיכֶם
  choice: những nơi thờ tự trên cao của các ngươi
  rationale: בָּמוֹת chỉ các địa điểm thờ tự trên nơi cao; cách dịch này rõ nghĩa hơn lối dịch sát chữ nhưng khó hiểu “những nơi cao”.
- source_word: הִכְרַתִּי
  choice: triệt hạ
  rationale: כרת mang hình ảnh cắt bỏ hoặc chặt hạ. “Triệt hạ” giữ được sắc thái phá bỏ cụ thể, đồng thời phù hợp với sự bất định về hình dạng của חַמָּנִים.
- source_word: חַמָּנֵיכֶם
  choice: các bàn thờ hương của các ngươi
  rationale: Từ này chỉ những vật dụng thờ cúng có thể liên quan đến việc dâng hương hoặc thờ mặt trời; bản chính dùng cách diễn đạt chức năng dễ hiểu, còn phương án cụ thể khác được giữ trong chú thích.
- source_word: פִּגְרֵיכֶם ... פִּגְרֵי גִּלּוּלֵיכֶם
  choice: xác chết của các ngươi ... xác chết của các thần tượng các ngươi
  rationale: Lặp lại “xác chết” phản ánh việc tiếng Hê-bơ-rơ dùng cùng một danh từ cho người và thần tượng, qua đó nhấn mạnh sự ô nhục và tính vô tri của thần tượng.
- source_word: גִּלּוּלֵיכֶם
  choice: các thần tượng các ngươi
  rationale: “Thần tượng” truyền đạt rõ đối tượng thờ giả; sắc thái khinh miệt mạnh của từ Hê-bơ-rơ được giải thích trong chú thích thay vì thêm một tính từ diễn giải vào câu.
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: tâm hồn Ta sẽ ghê tởm các ngươi
  rationale: Giữ lại chủ ngữ נַפְשִׁי, “tâm hồn Ta”, để bảo tồn hình ảnh nhân cách hóa và cường độ của sự ghê tởm trong nguyên văn.
theological_decisions:
- issue: Cách diễn tả mang tính nhân cách hóa về sự ghê tởm của Đức Chúa Trời
  choice: tâm hồn Ta sẽ ghê tởm các ngươi
  alternative: Ta sẽ ghê tởm các ngươi
  rationale: Nguyên văn nêu rõ “tâm hồn Ta”; giữ cách nói này bảo tồn sức nặng và sự căng thẳng thần học của câu thay vì làm phẳng thành một phát biểu trừu tượng hơn.
translation_notes:
  register: Văn phong trang nghiêm nhưng hiện đại. “Nơi thờ tự trên cao” giúp độc giả phổ thông hiểu thuật ngữ nghi lễ; “triệt hạ” phù hợp với nhiều khả năng của vật thờ được nói đến. Đại từ “Ta” được viết hoa để chỉ lời phán của Đức Chúa Trời, còn “các ngươi” giữ giọng phán xét trực tiếp và số nhiều.
