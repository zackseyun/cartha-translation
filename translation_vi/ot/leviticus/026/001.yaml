  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: vi
  text: “Các ngươi không được làm thần tượng cho mình; không được dựng tượng chạm hoặc trụ đá cho mình; cũng không được đặt trong xứ mình một hòn đá có hình chạm[a] để phủ phục trước nó, vì Ta là Yahweh[b], Đức Chúa Trời của các ngươi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hòn đá chạm khắc” hoặc “hình tượng bằng đá”. Sắc thái chính xác của cụm từ Hê-bơ-rơ אֶבֶן מַשְׂכִּית còn được tranh luận, nhưng nó chỉ một vật bằng đá gắn với sự thờ phượng bị cấm.
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: YHWH; theo truyền thống thường được dịch bằng một tước hiệu tương đương với “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: các thần tượng
  rationale: Danh từ này chỉ các thần tượng, thường hàm ý chúng hư không hoặc vô giá trị. “Thần tượng” rõ nghĩa trong tiếng Việt hiện đại mà không đưa sắc thái miệt thị vào quá mức.
- source_word: פֶסֶל
  choice: tượng chạm
  rationale: Từ này chỉ một hình tượng được tạo tác bằng cách chạm hoặc khắc. “Tượng chạm” giữ được nét nghĩa cụ thể và phân biệt với các vật thờ phượng khác trong câu.
- source_word: מַצֵּבָה
  choice: trụ đá
  rationale: Từ này chỉ một tảng đá hay bia đá được dựng đứng. “Trụ đá” ngắn gọn, cụ thể và không tự động thêm tính từ “thiêng” vốn không có trong chính danh từ.
- source_word: אֶבֶן מַשְׂכִּית
  choice: một phiến đá có hình chạm
  rationale: Cụm từ có lẽ chỉ một vật bằng đá mang hình trang trí hoặc hình tượng được chạm khắc trong bối cảnh thờ phượng. Cách dịch này vừa dễ hiểu vừa giữ khác biệt với פֶסֶל; chú thích nêu rõ sự bất định về sắc thái chính xác.
- source_word: תַעֲשׂוּ לָכֶם
  choice: làm ... cho mình
  rationale: Giữ cả động từ “làm” lẫn sắc thái phản thân–hưởng lợi của לָכֶם, đồng thời phù hợp cú pháp tiếng Việt.
- source_word: תָקִימוּ לָכֶם
  choice: dựng ... cho mình
  rationale: Thể Hiphil của קום tại đây có nghĩa dựng hoặc thiết lập một vật thể. “Dựng” tự nhiên và đặc biệt thích hợp với tượng cùng trụ đá.
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: đặt trong xứ mình
  rationale: נתן với địa điểm mang nghĩa “đặt”. “Trong xứ mình” giữ nguyên phạm vi đất giao ước và đại từ số nhiều của lời phán.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: để phủ phục trước nó
  rationale: Động từ diễn tả hành động cúi rạp hoặc phủ phục; nguyên mẫu nêu mục đích. “Trước nó” truyền đạt đối tượng được tôn kính, đồng thời tránh cách hiểu kém khả dĩ là phủ phục ở trên phiến đá.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu, qua đó phản ánh trực tiếp יהוה trong bản Hê-bơ-rơ.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: vì Ta là Yahweh, Đức Chúa Trời của các ngươi
  rationale: כִּי nêu nền tảng cho các lệnh cấm nên được dịch là “vì”. Cách xưng hô “Ta/các ngươi” giữ giọng phán truyền trang nghiêm và số nhiều của אֱלֹהֵיכֶם.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn tư cách danh riêng và không thay thế nó bằng một tước hiệu.
- issue: Phân biệt các vật thể thờ phượng bị cấm
  choice: 'Dùng các từ riêng biệt: “thần tượng”, “tượng chạm”, “trụ đá” và “phiến đá có hình chạm”'
  alternative: Gộp tất cả thành “thần tượng” hoặc “hình tượng”
  rationale: Câu Hê-bơ-rơ cố ý liệt kê nhiều thuật ngữ khác nhau. Giữ các phân biệt này phản ánh tính cụ thể của luật và tránh làm phẳng ý nghĩa.
- issue: Đối tượng của hành động phủ phục trong עָלֶיהָ
  choice: phủ phục trước nó
  alternative: phủ phục trên đó
  rationale: Giới từ עַל có thể gợi cách hiểu về vị trí, nhưng trong cấu trúc thờ phượng này nhiều khả năng nó hướng đến vật được tôn kính. “Trước nó” diễn đạt tự nhiên mà không biến hành vi thành việc đứng hoặc quỳ trên phiến đá.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. “Các ngươi” thể hiện đối tượng số nhiều và phù hợp lời phán trực tiếp của Đức Chúa Trời; “phủ phục” cụ thể hơn “thờ lạy”, giữ hình ảnh thân thể của động từ Hê-bơ-rơ. Dấu chấm phẩy giúp người đọc nhận ra ba lệnh cấm song song.
