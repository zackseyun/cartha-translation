  source_fidelity: Bản dịch phân biệt đúng bốn loại vật thể trong tiếng Hê-bơ-rơ và giữ được cấu trúc các mệnh lệnh cấm, mục đích của hành động phủ phục, cùng lý do giao ước. Tuy nhiên, “phiến đá” thêm một đặc điểm hình dạng (phiến, thường là đá phẳng) không có trong אֶבֶן; nên dùng cách gọi trung tính hơn là “hòn đá”.
  naturalness: Văn phong trang nghiêm, hiện đại và tự nhiên. “Ta/các ngươi”, “dựng”, và “phủ phục” phù hợp thể loại luật pháp. Việc bỏ mạo từ số nhiều không cần thiết trước “thần tượng” làm câu tiếng Việt gọn và tự nhiên hơn mà không làm mất nghĩa khái quát số nhiều.
