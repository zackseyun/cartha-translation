  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: vi
  text: Ta sẽ hướng về các ngươi[a], làm cho các ngươi sinh sôi nảy nở và thêm đông đảo; Ta sẽ thiết lập giao ước của Ta với các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta sẽ đoái đến các ngươi với thiện ý.” Tiếng Hê-bơ-rơ nói theo nghĩa đen: “Ta sẽ hướng về các ngươi”; trong bối cảnh này, cách nói ấy hàm ý sự ưu ái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: Ta sẽ hướng về các ngươi
  rationale: Giữ hình ảnh cụ thể của động từ פנה, nghĩa là quay hoặc hướng về ai; trong bối cảnh phước lành giao ước, cách nói này hàm ý Đức Chúa Trời đoái đến với thiện ý mà không biến hàm ý ấy thành nghĩa duy nhất.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: làm cho các ngươi sinh sôi
  rationale: Dạng Hiphil của פרה mang nghĩa khiến cho sinh sản, sinh sôi. Cách dịch này tự nhiên trong tiếng Việt và giữ được âm hưởng của công thức phước lành trong Ngũ Kinh.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: gia tăng đông đảo
  rationale: Dạng Hiphil của רבה có nghĩa làm cho nhiều lên. 'Gia tăng đông đảo' diễn đạt rõ việc dân số trở nên đông mà vẫn kết hợp tự nhiên với 'sinh sôi'.
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי
  choice: Ta sẽ thiết lập giao ước của Ta
  rationale: Hiphil của קום đi với בְּרִית thường có nghĩa thiết lập, xác lập hoặc làm cho giao ước đứng vững. 'Thiết lập' là cách dịch trang trọng, minh bạch và không thu hẹp nghĩa thành chỉ 'xác nhận'.
- source_word: אִתְּכֶם
  choice: với các ngươi
  rationale: Giới từ đánh dấu các bên trong quan hệ giao ước; 'với các ngươi' là cách diễn đạt trực tiếp và tự nhiên.
theological_decisions:
- issue: Có nên nói rõ ý nghĩa thiện ý trong việc Đức Chúa Trời hướng về dân hay không
  choice: Giữ cách nói cụ thể 'Ta sẽ hướng về các ngươi' trong chính văn
  alternative: Ta sẽ đoái thương các ngươi / Ta sẽ nhìn các ngươi với thiện ý
  rationale: Bối cảnh cho thấy đây là sự đoái đến để ban phước, nhưng động từ Hê-bơ-rơ tự nó là động từ thông thường chỉ việc quay hoặc hướng về. Giữ hình ảnh nguồn bảo toàn độ mở của câu.
- issue: Cách diễn đạt công thức sinh sôi và trở nên đông đảo
  choice: làm cho các ngươi sinh sôi, gia tăng đông đảo
  alternative: làm cho các ngươi màu mỡ và tăng số lượng
  rationale: Cách chọn giữ âm hưởng công thức phước lành xuyên suốt Ngũ Kinh, đồng thời tránh thu hẹp lời hứa thành một phát biểu thuần túy về nhân khẩu.
- issue: Sắc thái của וַהֲקִימֹתִי đối với giao ước
  choice: thiết lập giao ước
  alternative: xác nhận giao ước / duy trì giao ước
  rationale: Động từ có thể hàm ý làm cho giao ước đứng vững hoặc xác nhận giao ước đã có; 'thiết lập' giữ cách nói giao ước quen thuộc, còn chú thích ghi nhận khả năng dịch khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ 'Ta/các ngươi' để phản ánh lời phán trực tiếp của Đức Chúa Trời với toàn dân; tránh từ quá cổ như 'san sẻn' hoặc cách diễn giải mang màu sắc hệ phái.
