    rationale: Chú thích hiện được đặt sau “các ngươi” ở cuối câu nhưng giải thích “thiết lập”. Theo nguồn và audit trail, chú thích cần neo ngay sau “hướng về các ngươi” và nêu rõ rằng cách nói này có thể hàm ý sự đoái đến với thiện ý.
