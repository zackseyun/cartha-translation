  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: vi
  text: 'Ta cũng sẽ làm điều này với các ngươi: Ta sẽ giáng trên các ngươi nỗi kinh hoàng bất ngờ[a], bệnh suy kiệt[b] và sốt nóng, khiến mắt lụi tàn và sinh lực hao mòn[c]. Các ngươi sẽ gieo giống luống công, và kẻ thù của các ngươi sẽ ăn nó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự kinh hoàng” hoặc “cơn hoảng loạn.”'
    reason: Từ Hê-bơ-rơ chỉ nỗi kinh hãi hay hoảng loạn, có thể hàm ý xảy đến đột ngột.
  - marker: b
    text: Tên chính xác của căn bệnh trong tiếng Hê-bơ-rơ không chắc chắn; từ này có lẽ chỉ một chứng bệnh khiến cơ thể hao mòn.
    reason: Tránh đồng nhất thuật ngữ cổ với một chẩn đoán hiện đại cụ thể.
  - marker: c
    text: 'Cũng có thể dịch: “khiến mắt suy yếu và sự sống hao mòn.”'
    reason: Hai cụm từ Hê-bơ-rơ giàu hình ảnh và khó xác định chính xác; chú thích bảo tồn cách hiểu gần hình thức nguyên văn hơn.
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Ta cũng
  rationale: Giữ sắc thái tiếp nối và nhấn mạnh của אַף cùng đại từ độc lập; trong ngữ cảnh lời phán của Đức Chúa Trời, “Ta cũng” tự nhiên và trang trọng.
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: sẽ làm điều này với các ngươi
  rationale: Diễn đạt hành động hướng đến người nghe trong bối cảnh hình phạt; “với các ngươi” tự nhiên hơn cách dịch máy móc bằng “cho các ngươi”.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: Ta sẽ giáng trên các ngươi
  rationale: Hiphil của פקד ở đây chỉ việc áp đặt hoặc đem hình phạt đến. “Giáng trên” phù hợp tiếng Việt và giữ lực phán xét, trong khi ý “đặt trên/cắt đặt trên” quá cứng.
- source_word: בֶּהָלָה
  choice: nỗi kinh hoàng bất ngờ
  rationale: Bao quát ý kinh hãi, hoảng loạn và tính đột ngột của danh từ.
- source_word: הַשַּׁחֶפֶת
  choice: bệnh suy kiệt
  rationale: Tên bệnh cổ không xác định chắc chắn; cách dịch này mô tả tác dụng làm cơ thể hao mòn mà không gán một chẩn đoán hiện đại quá cụ thể.
- source_word: הַקַּדַּחַת
  choice: sốt nóng
  rationale: Danh từ gợi cơn sốt có tính thiêu đốt; “sốt nóng” giữ sắc thái ấy và vẫn dễ hiểu.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: khiến mắt lụi tàn
  rationale: Giữ hình ảnh mạnh của כלה là hao mòn, tiêu kiệt, đồng thời diễn đạt tự nhiên việc đôi mắt suy yếu vì bệnh tật.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: và sinh lực hao mòn
  rationale: נפש trong ngữ cảnh này chỉ sự sống và sức sống của con người, không nhất thiết là linh hồn phi vật chất; bản dịch giữ sự mơ hồ về tình trạng suy kiệt.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: Các ngươi sẽ gieo giống luống công
  rationale: לריק có nghĩa là vô ích, không đạt kết quả; “gieo giống luống công” là thành ngữ nông nghiệp tự nhiên và cô đọng.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: và kẻ thù của các ngươi sẽ ăn hết
  rationale: Giữ trực tiếp liên từ waw là “và”; “ăn hết” diễn đạt rõ hậu quả đối với hạt giống hoặc hoa lợi mà không thêm quan hệ nhân quả ngoài văn bản.
theological_decisions:
- issue: Ý nghĩa của נָפֶשׁ trong lời nguyền giao ước
  choice: sinh lực
  alternative: linh hồn; sự sống; bản thân
  rationale: “Sinh lực” phù hợp với bệnh tật làm cơ thể suy kiệt và tránh áp đặt một quan niệm nhị nguyên về con người lên từ נָפֶשׁ.
- issue: Chủ thể thi hành hình phạt
  choice: 'Giữ ngôi thứ nhất trực tiếp: “Ta sẽ giáng”'
  alternative: 'Cách bị động: “các ngươi sẽ gặp”'
  rationale: Nguyên văn trình bày Đức Chúa Trời là chủ thể trực tiếp áp đặt lời nguyền; bản dịch không làm nhẹ đi sức căng thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “Ta/các ngươi” để thể hiện lời phán mang tính giao ước với cộng đồng số nhiều. Nhịp câu giữ cấu trúc liệt kê của nguyên văn nhưng chia thành hai câu để dễ đọc. Tất cả dấu chú thích [a], [b], [c] đều được đặt ngay sau từ hoặc mệnh đề liên quan.
