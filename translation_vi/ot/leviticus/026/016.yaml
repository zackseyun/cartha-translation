revisions:
- from: 'Ta cũng sẽ làm điều này với các ngươi: Ta sẽ giáng trên các ngươi nỗi kinh hoàng bất ngờ[a], bệnh suy kiệt[b] và sốt nóng, khiến mắt lụi tàn và sinh lực hao mòn[c]. Các ngươi sẽ gieo giống luống công, và kẻ thù của các ngươi sẽ ăn hết.'
  to: 'Ta cũng sẽ làm điều này với các ngươi: Ta sẽ giáng trên các ngươi nỗi kinh hoàng bất ngờ[a], bệnh suy kiệt[b] và sốt nóng, khiến mắt lụi tàn và sinh lực hao mòn[c]. Các ngươi sẽ gieo giống luống công, và kẻ thù của các ngươi sẽ ăn nó.'
  rationale: Chỉ thay “ăn hết” bằng “ăn nó” để không thêm mức độ hoàn tất không có trong nguyên văn. Các lựa chọn còn lại, bao gồm “giáng trên,” “bệnh suy kiệt,” và “sinh lực,” đều trung thành với ngữ cảnh và tự nhiên trong tiếng Việt hiện đại.
