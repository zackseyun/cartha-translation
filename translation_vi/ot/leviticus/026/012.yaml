base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: vi
  text: Ta sẽ đi lại giữa các ngươi[a], sẽ là Đức Chúa Trời của các ngươi, và các ngươi sẽ là dân Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, theo lối sát nghĩa hơn: “Ta sẽ đi lại ở giữa các ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: Ta sẽ đi lại
  rationale: Dạng Hitpael của הלך diễn tả sự đi lại hoặc hiện diện năng động giữa cộng đồng. “Đi lại” giữ được hình ảnh cụ thể của nguyên văn; “ngự” hay “ở” sẽ diễn giải quá mức ý nghĩa trực tiếp của động từ.
- source_word: בְּתוֹכְכֶם
  choice: giữa các ngươi
  rationale: Cụm từ có nghĩa là “ở giữa các ngươi”, nói đến sự hiện diện trong cộng đồng, không phải sự ngự trị bên trong mỗi cá nhân.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: sẽ làm Đức Chúa Trời của các ngươi
  rationale: Đây là công thức giao ước quen thuộc. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được quan hệ thuộc về nhau hàm chứa trong היה + ל.
- source_word: לֵאלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong bối cảnh giao ước của Israel, אֱלֹהִים chỉ chính Đức Chúa Trời, không phải một vị thần bất định.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: các ngươi sẽ làm dân Ta
  rationale: Cách dịch này giữ công thức giao ước có tính tương hỗ và tự nhiên hơn lối dịch sát chữ “sẽ là một dân cho Ta”.
theological_decisions:
- issue: Cách diễn đạt công thức giao ước
  choice: “Ta sẽ ... làm Đức Chúa Trời của các ngươi, và các ngươi sẽ làm dân Ta.”
  alternative: “Ta sẽ là Đức Chúa Trời cho các ngươi, và các ngươi sẽ là một dân cho Ta.”
  rationale: Bản chọn giữ nguyên tính tương hỗ và quan hệ của công thức giao ước trong tiếng Hê-bơ-rơ, đồng thời dùng tiếng Việt rõ ràng mà không thêm nội dung giáo lý.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp lời phán trực tiếp của Đức Chúa Trời. Dùng “Ta/các ngươi” để giữ sắc thái giao ước và cho thấy đại từ số nhiều của nguyên văn; “đi lại giữa” bảo tồn hình ảnh về sự hiện diện của Đức Chúa Trời.
