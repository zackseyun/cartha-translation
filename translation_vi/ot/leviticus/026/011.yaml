  terminology: “Nơi ngự của Ta” là lựa chọn phù hợp cho מִשְׁכָּנִי trong câu này, giữ được nghĩa nơi cư ngụ/hiện diện mà không nhất thiết biến thành tên kỹ thuật “Đền Tạm”. “Ghê tởm” phản ánh tốt cường độ của גָּעַל. Cặp xưng hô “Ta/các ngươi” nhất quán với lời phán trang trọng.
