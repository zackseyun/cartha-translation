base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/011.yaml
  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: vi
  text: Ta sẽ đặt nơi ngự của Ta giữa các ngươi, và Ta sẽ không ghê tởm các ngươi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: nơi ngự của Ta
  rationale: Danh từ מִשְׁכָּן chỉ nơi cư ngụ, đồng thời trong ngữ cảnh Lê-vi ký gợi đến nơi Đức Chúa Trời hiện diện giữa dân; “nơi ngự” tự nhiên, trang trọng và không thu hẹp nghĩa vào riêng một loại kiến trúc.
- source_word: בְּתוֹכְכֶם
  choice: ở giữa các ngươi
  rationale: Diễn đạt trực tiếp ý Đức Chúa Trời đặt nơi ngự ngay giữa cộng đồng giao ước.
- source_word: נַפְשִׁי
  choice: linh hồn Ta
  rationale: Giữ hình thức nhân xưng đậm nét của nguyên văn và sự nhấn mạnh thần học, thay vì lược thành đại từ đơn thuần.
- source_word: תִגְעַל
  choice: ghê tởm
  rationale: Động từ גָּעַל diễn tả sự chán ghét hoặc loại bỏ mạnh mẽ; “ghê tởm” giữ được cường độ ấy.
theological_decisions:
- issue: Cách diễn đạt נַפְשִׁי khi Đức Chúa Trời là chủ thể
  choice: linh hồn Ta
  alternative: Ta
  rationale: Nguyên văn nói rõ “linh hồn Ta”; giữ lại cụm từ này bảo tồn lối diễn đạt nhân hình và sức nhấn mạnh, không âm thầm giản lược căng thẳng thần học.
- issue: Ý nghĩa của מִשְׁכָּן
  choice: nơi ngự
  alternative: Đền Tạm
  rationale: Trong lời hứa này, từ ngữ nhấn mạnh sự cư ngụ của Đức Chúa Trời giữa dân. “Nơi ngự” giữ nghĩa rộng và tránh tự động đồng nhất từ này với tên riêng của một công trình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để phản ánh lời phán trực tiếp của Đức Chúa Trời với cộng đồng Israel và duy trì sắc thái giao ước.
