  source_fidelity: 'Bản nháp truyền đạt đúng hai mệnh đề của tiếng Hê-bơ-rơ: Đức Chúa Trời đặt מִשְׁכָּנִי giữa dân, và không גָּעַל họ. Tuy nhiên, “linh hồn Ta” là cách hiểu quá vật thể hóa của נַפְשִׁי trong lối nói Hê-bơ-rơ. Ở đây cụm này là thành ngữ nhân hình, nhấn mạnh chính Đức Chúa Trời sẽ không ghê tởm/ruồng bỏ họ; tiếng Việt tự nhiên không cần dịch thành một ‘linh hồn’ riêng biệt.'
