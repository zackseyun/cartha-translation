base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: vi
  text: Khi Ta bẻ gãy nguồn cung bánh của các ngươi[a], mười phụ nữ sẽ nướng bánh của các ngươi trong cùng một lò và trả bánh lại cho các ngươi theo trọng lượng; các ngươi sẽ ăn nhưng không no.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “cây gậy của bánh,” một thành ngữ chỉ nguồn cung bánh nâng đỡ và duy trì sự sống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: Khi Ta bẻ gãy
  rationale: Dạng nguyên mẫu với בְּ tạo mệnh đề thời gian. “Bẻ gãy” giữ hình ảnh phán xét mạnh của động từ שׁבר mà không biến thành hành động đập vỡ theo nghĩa đen.
- source_word: מַטֵּה לֶחֶם
  choice: nguồn bánh nuôi sống các ngươi
  rationale: Thành ngữ nghĩa đen là “cây gậy của bánh,” chỉ bánh như nguồn nâng đỡ sự sống. Cách dịch này tự nhiên trong tiếng Việt, vẫn giữ hình ảnh bánh và nêu rõ ý nuôi sống.
- source_word: עֶשֶׂר נָשִׁים
  choice: mười người nữ
  rationale: Giữ nguyên con số và chủ thể nữ được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: בְּתַנּוּר אֶחָד
  choice: chung trong một lò
  rationale: 'Nêu bật cảnh khan hiếm: lượng bánh của mười người có thể nướng chung trong chỉ một lò.'
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: rồi cân mà giao lại
  rationale: Hiphil của שוב mang nghĩa đem hoặc giao trở lại; בַּמִּשְׁקָל cho biết bánh được cân để phân phát do khan hiếm.
- source_word: וְלֹא תִשְׂבָּעוּ
  choice: nhưng không no
  rationale: שׂבע trong ngữ cảnh ăn uống là được no đủ. “Không no” ngắn gọn, tự nhiên và cụ thể hơn “không thỏa mãn” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” và “các ngươi” duy trì lời phán trực tiếp trong bối cảnh giao ước. Cấu trúc câu giữ trình tự phán xét, khan hiếm, phân phối theo cân và hậu quả là ăn mà vẫn không no.
