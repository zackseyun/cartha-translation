  to: Bấy giờ, trong suốt những ngày đất bị hoang phế, đất ấy sẽ hưởng các kỳ Sa-bát của nó[a], trong khi các ngươi ở trong xứ của kẻ thù các ngươi. Bấy giờ, đất ấy sẽ nghỉ và hưởng các kỳ Sa-bát của nó.
