source:
  edition: WLC
  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: vi
  text: Bấy giờ, trong suốt những ngày đất bị hoang phế, đất ấy sẽ hưởng các kỳ Sa-bát của nó[a], trong khi các ngươi ở trong xứ của kẻ thù các ngươi. Bấy giờ, đất ấy sẽ nghỉ và hưởng các kỳ Sa-bát của nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ bù lại các kỳ Sa-bát của nó” hoặc “sẽ nhận lại điều phải được dành cho các kỳ Sa-bát của nó.” Trong ngữ cảnh này, động từ Hê-bơ-rơ mang ý đất nhận được điều vốn phải dành cho nó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Bấy giờ
  rationale: Trạng từ thời gian chỉ hệ quả của sự phán xét đã nêu trước đó; “Bấy giờ” trang trọng, tự nhiên và giữ được mạch văn.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: sẽ được hưởng / được hưởng
  rationale: Trong ngữ cảnh đất đai được nghỉ bù vào thời lưu đày, động từ רצה diễn tả việc đất nhận được điều vốn phải dành cho nó. “Được hưởng” tự nhiên trong tiếng Việt và được lặp lại để bảo toàn phép lặp của nguyên văn; chú thích ghi nhận sắc thái đền bù.
- source_word: הָאָרֶץ
  choice: đất ấy
  rationale: Chỉ miền đất giao ước đang được nói đến, không phải toàn thể trái đất. “Đất ấy” vừa rõ nghĩa vừa tự nhiên khi lặp lại trong câu.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: những kỳ sa-bát của mình
  rationale: Chỉ các kỳ nghỉ sa-bát thuộc về đất, đặc biệt là các năm sa-bát trong ngữ cảnh. “Kỳ sa-bát” tránh làm người đọc chỉ liên tưởng đến ngày sa-bát hằng tuần.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: suốt những ngày bị hoang phế
  rationale: Diễn tả trọn thời gian đất ở trong tình trạng tiêu điều, không được canh tác. Cách nói này tự nhiên hơn việc danh từ hóa cứng nhắc.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: trong khi các ngươi ở trong xứ của kẻ thù mình
  rationale: Mệnh đề mang ý hoàn cảnh và thời gian; “trong khi” làm rõ sự đồng thời mà không thêm nội dung.
- source_word: תִּשְׁבַּת
  choice: sẽ nghỉ
  rationale: Động từ שבת ở đây nói đất ngừng được canh tác và nhờ đó được nghỉ; đồng thời duy trì mối liên hệ từ vựng với các kỳ sa-bát.
theological_decisions:
- issue: Quan hệ giữa đất và các kỳ sa-bát trong thời lưu đày
  choice: Đất được hưởng những kỳ nghỉ sa-bát đã không được dành cho nó.
  alternative: Đất bù lại hoặc được đền bù cho những kỳ sa-bát của mình.
  rationale: Ngữ cảnh lời rủa sả giao ước cho thấy sắc thái bù đắp tư pháp, nhưng động từ רצה vẫn có độ rộng nghĩa. Bản chính dùng “được hưởng” để giữ hình ảnh của nguyên văn, còn chú thích bảo tồn nghĩa khả dĩ về việc nhận lại điều đáng ra phải có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đại từ số nhiều “các ngươi” phù hợp lời phán trực tiếp trong ngữ cảnh luật pháp; dùng “kỳ sa-bát” để chỉ rõ các thời kỳ nghỉ của đất và bảo toàn sự nhân cách hóa có trong nguyên văn.
