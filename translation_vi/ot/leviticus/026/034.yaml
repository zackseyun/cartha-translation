    rationale: Hai động từ tiếng Hê-bơ-rơ có “đất” làm chủ thể. Dạng bị động tiếng Việt gợi một tác nhân ngầm cho phép hoặc ban cho đất hưởng, không có trong nguyên văn.
  - severity: low
    issue: “kẻ thù mình” mơ hồ
    rationale: Đại từ “mình” có thể gây mơ hồ trong cụm sở hữu; “kẻ thù của các ngươi” phản ánh rõ hậu tố ngôi thứ hai số nhiều trong אֹיְבֵיכֶם.
