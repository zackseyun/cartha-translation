id: LEV.8.2
reference: Leviticus 8:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: vi
  text: Hãy đem A-rôn cùng các con trai ông, các lễ phục, dầu xức, con bò đực dùng làm lễ vật chuộc tội[a], hai con chiên đực và giỏ bánh không men đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ này có thể chỉ lễ vật liên quan đến tội lỗi và sự thanh tẩy theo nghi lễ.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Hãy đem ... đến
  rationale: Mệnh lệnh ngôi hai số ít của לקח. Trong ngữ cảnh Môi-se phải tập hợp người và lễ vật tại cửa Lều Hội Kiến (câu 3), “hãy đem ... đến” diễn đạt tự nhiên cả hành động tiếp nhận lẫn hướng di chuyển mà ngữ cảnh đòi hỏi.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt quen thuộc.
- source_word: בָּנָיו אִתּוֹ
  choice: cùng các con trai ông
  rationale: “Cùng” chuyển tải אִתּוֹ (‘với ông’) mà không tạo cách diễn đạt nặng nề; đại từ “ông” quy chiếu tự nhiên về A-rôn.
- source_word: הַבְּגָדִים
  choice: các lễ phục
  rationale: בְּגָדִים về từ vựng là quần áo/y phục; trong nghi thức tấn phong tư tế ở đây, “lễ phục” vừa tự nhiên vừa cho thấy chức năng nghi lễ mà không xác định quá mức từng món.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Cụm sở hữu ‘dầu của sự xức’; “dầu xức” là cách nói gọn, quen thuộc và giữ rõ ý nghĩa nghi lễ.
- source_word: פַּר הַחַטָּאת
  choice: con bò đực dùng làm lễ vật chuộc tội
  rationale: פַּר là bò đực; חַטָּאת ở đây chỉ loại lễ vật. “Dùng làm” thể hiện quan hệ giữa con vật và lễ vật tự nhiên hơn trong tiếng Việt, còn “lễ vật chuộc tội” là thuật ngữ dễ hiểu, với sắc thái thanh tẩy được bảo lưu ở chú thích.
- source_word: שְׁנֵי הָאֵילִים
  choice: hai con chiên đực
  rationale: Diễn đạt trực tiếp số từ và danh từ; “chiên đực” là cách gọi rõ ràng, phổ thông của אַיִל trong ngữ cảnh tế lễ.
- source_word: סַל הַמַּצּוֹת
  choice: giỏ bánh không men
  rationale: מַצּוֹת chỉ bánh/thực phẩm không lên men. “Giỏ bánh không men” là cách diễn đạt tự nhiên và không xác định hình dạng bánh vượt quá câu này.
theological_decisions:
- issue: Cách dịch חַטָּאת trong ngữ cảnh tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Danh từ ở đây chỉ loại tế lễ chứ không chỉ bản thân ‘tội lỗi’. Cách dịch chính duy trì thuật ngữ quen thuộc và mối liên hệ với tội; chú thích bảo lưu cách hiểu nhấn mạnh chức năng thanh tẩy nghi lễ của cùng thuật ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại, dễ hiểu. Chuỗi đối tượng được trình bày tự nhiên trong tiếng Việt; động từ “đến” đặt cuối câu phù hợp với ngữ cảnh tập hợp tại một địa điểm. Dấu chú thích [a] được đặt ngay sau thuật ngữ có cách dịch thay thế.
source_grounding:
  english_pob_role: consult_only
