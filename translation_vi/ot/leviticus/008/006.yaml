  text: וַ/יַּקְרֵ֣ב מֹשֶׁ֔ה אֶֽת אַהֲרֹ֖ן וְ/אֶת בָּנָ֑י/ו וַ/יִּרְחַ֥ץ אֹתָ֖/ם בַּ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/006.yaml
  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: vi
  text: Rồi Môi-se đưa A-rôn và các con trai ông đến gần, rồi lấy nước tắm rửa cho họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: đưa ... đến gần
  rationale: Dạng Hiphil của קרב có nghĩa là đưa đến gần. Cách dịch này giữ được chuyển động cụ thể vào nơi cử hành nghi lễ mà không diễn giải quá mức thành “trình diện”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng tên riêng quen dùng trong tiếng Việt hiện đại.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dạng tên riêng quen dùng trong tiếng Việt hiện đại.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Trong ngữ cảnh phong chức tư tế, בנים chỉ các con trai của A-rôn; “ông” quy chiếu rõ về A-rôn.
- source_word: וַיִּרְחַץ
  choice: tắm rửa cho
  rationale: רחץ có thể chỉ việc rửa hoặc tắm. Với toàn bộ những người làm tân ngữ trong nghi thức này, “tắm rửa cho” tự nhiên và không giới hạn hành động vào việc rửa một bộ phận cơ thể.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ tân ngữ chỉ chung A-rôn và các con trai ông.
- source_word: בַּמָּיִם
  choice: lấy nước
  rationale: Giới từ ב ở đây biểu thị phương tiện. “Lấy nước tắm rửa” là cách nói tự nhiên trong tiếng Việt và giữ rõ nước là phương tiện của hành động.
- source_word: וַ
  choice: Rồi ... rồi
  rationale: Các waw liên tiếp thúc đẩy trình tự thuật chuyện; “rồi” thể hiện rõ diễn tiến mà vẫn tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cách diễn đạt cụ thể của nguyên văn; không thêm ý nghĩa thần học hoặc mô tả chi tiết hơn về phạm vi của việc tắm rửa.
