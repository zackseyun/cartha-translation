language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: vi
  text: Ông rảy dầu ấy trên bàn thờ bảy lần[a], rồi xức dầu cho bàn thờ và mọi dụng cụ của bàn thờ, cũng như chậu và bệ chậu, để thánh hiến chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “rảy từ đó trên bàn thờ”; “đó” chỉ dầu xức được nhắc đến ở câu trước.'
    reason: Giải thích cấu trúc מִמֶּנּוּ và vật quy chiếu của đại từ.
lexical_decisions:
- source_word: וַיַּז מִמֶּנּוּ
  choice: Ông lấy dầu ấy rảy
  rationale: Động từ נזה ở thể Hiphil chỉ việc rảy chất lỏng trong nghi lễ. מִמֶּנּוּ theo nghĩa đen là “từ đó/từ dầu ấy”; cách diễn đạt “lấy dầu ấy rảy” tự nhiên trong tiếng Việt và giữ rõ vật quy chiếu là dầu xức đã nêu trong ngữ cảnh.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Thuật ngữ tiếng Việt thông dụng và chính xác cho מִזְבֵּחַ trong bối cảnh tế lễ.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Diễn đạt trực tiếp số lần hành động nghi lễ được lặp lại.
- source_word: וַיִּמְשַׁח
  choice: rồi xức dầu cho
  rationale: משׁח trong bối cảnh thánh lễ chỉ hành động xức dầu để thánh hiến; “xức dầu” vừa rõ nghĩa vừa giữ sắc thái nghi lễ.
- source_word: כָּל כֵּלָיו
  choice: mọi dụng cụ của bàn thờ
  rationale: כְּלִי có nghĩa rộng là dụng cụ hoặc vật dụng. Lặp rõ “của bàn thờ” giúp đại từ sở hữu tự nhiên và không mơ hồ trong tiếng Việt.
- source_word: הַכִּיֹּר
  choice: chậu
  rationale: כִּיּוֹר là chậu dùng để rửa trong khuôn viên Đền Tạm; “chậu” là cách gọi hiện đại, dễ hiểu.
- source_word: כַּנּוֹ
  choice: chân chậu
  rationale: כֵּן ở đây là bộ phận nâng đỡ chậu. “Chân chậu” tự nhiên trong tiếng Việt; “bệ chậu” cũng có thể dùng.
- source_word: לְקַדְּשָׁם
  choice: để biệt riêng chúng ra thánh
  rationale: קדשׁ ở đây chỉ việc dành riêng các vật ấy cho địa vị và công dụng thánh. Cách dịch này thể hiện cả ý phân riêng lẫn tính thánh, không chỉ nói chung chung là chuẩn bị.
theological_decisions:
- issue: Thuật ngữ nghi lễ về việc thánh hiến các vật dụng
  choice: Dùng “xức dầu” và “biệt riêng ... ra thánh”
  alternative: Dùng “thánh hiến” hoặc “làm cho nên thánh”
  rationale: Bản dịch giữ sắc thái nghi lễ của משׁח và קדשׁ mà không gán thêm ý nghĩa giáo phái. “Biệt riêng ... ra thánh” làm rõ hành động dành các vật cho công dụng thánh, đồng thời tránh hàm ý rằng bản chất vật chất của chúng bị biến đổi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ nghi lễ quen thuộc nhưng tránh từ cổ; cấu trúc câu giữ trình tự hành động của nguyên văn Hê-bơ-rơ.
