  terminology: “Bàn thờ,” “xức dầu,” “dụng cụ,” và “chậu” đều phù hợp. “Bệ chậu” rõ hơn “chân chậu” cho כַּנּוֹ, là cấu trúc/bộ phận đỡ chậu. “Thánh hiến” giữ sắc thái nghi lễ mà không áp đặt diễn giải giáo phái.
