review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các hành động và đối tượng trong tiếng Hê-bơ-rơ: rảy dầu trên bàn thờ bảy lần, xức dầu cho bàn thờ cùng các vật dụng, chậu và bộ phận đỡ chậu, nhằm thánh hiến các vật ấy. Tuy nhiên, “lấy dầu ấy rảy” diễn giải thêm động tác ‘lấy’; động từ gốc chỉ nói ‘rảy từ nó’.'
