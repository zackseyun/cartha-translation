  - severity: medium
    issue: “để biệt riêng chúng ra thánh” chưa tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này gây vấp về cú pháp và phong cách. “Để thánh hiến chúng” diễn đạt chính xác mục đích của לְקַדְּשָׁם.
  - severity: low
