- from: Rồi Môi-se lấy phần ức, đưa qua đưa lại làm lễ vật đưa qua đưa lại trước mặt Yahweh. Đó là phần dành cho Môi-se từ con chiên đực dùng trong lễ tấn phong[a], đúng như Yahweh đã truyền cho Môi-se.
  to: Rồi Môi-se lấy phần ức, dâng làm lễ vật đưa qua đưa lại trước mặt Yahweh. Đó là phần dành cho Môi-se từ con chiên đực dùng trong lễ tấn phong[a], đúng như Yahweh đã truyền cho Môi-se.
  rationale: Sửa riêng cụm diễn tả וַיְנִיפֵהוּ תְנוּפָה. “Dâng làm lễ vật đưa qua đưa lại” diễn đạt chức năng nghi lễ của động từ và danh từ cùng gốc trong tiếng Hê-bơ-rơ bằng tiếng Việt tự nhiên, không tạo lặp từ không cần thiết. Các yếu tố khác của câu và chú thích được giữ nguyên.
