source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Rồi Môi-se lấy phần ức, dâng làm lễ vật đưa qua đưa lại trước mặt Yahweh. Đó là phần dành cho Môi-se từ con chiên đực dùng trong lễ tấn phong[a], đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con chiên đực dùng trong lễ thánh hiến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Rồi Môi-se lấy
  rationale: Thể wayyiqtol tiếp nối diễn tiến câu chuyện; “Rồi” diễn đạt tự nhiên trình tự hành động.
- source_word: הֶחָזֶה
  choice: phần ức
  rationale: Trong bối cảnh tế lễ, חָזֶה chỉ phần ức của con vật được dành riêng.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: đưa qua đưa lại làm lễ vật đưa qua đưa lại
  rationale: Giữ cả động từ נוּף và danh từ cùng gốc תְּנוּפָה, qua đó phản ánh động tác nghi lễ lẫn tên gọi của lễ vật.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Cách diễn đạt tự nhiên cho công thức chỉ việc dâng trình trong sự hiện diện của Yahweh.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: từ con chiên đực dùng trong lễ tấn phong
  rationale: אֵיל là chiên đực; trong ngữ cảnh thiết lập chức tư tế, מִלֻּאִים chỉ nghi thức tấn phong hoặc biệt riêng để nhận chức.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: Đó là phần dành cho Môi-se
  rationale: מָנָה là phần hoặc suất được ấn định; cách dịch này nêu rõ phần tế lễ ấy thuộc về Môi-se.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: Phản ánh công thức xác nhận hành động được thực hiện phù hợp với mệnh lệnh đã ban trước đó.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của מִלֻּאִים trong nghi thức lập chức tư tế
  choice: lễ tấn phong
  alternative: lễ thánh hiến
  rationale: “Lễ tấn phong” phù hợp với ngữ cảnh A-rôn và các con trai ông được thiết lập vào chức tư tế; chú thích giữ lại khả năng dịch là “lễ thánh hiến” mà không áp đặt khác biệt thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phần ức” để rõ đây là phần thịt tế lễ; giữ lối diễn đạt lặp “đưa qua đưa lại” nhằm phản ánh phép lặp cùng gốc trong tiếng Hê-bơ-rơ và thuật ngữ nghi lễ.
