revisions:
- from: Rồi ông đem đến con chiên đực thứ hai[a], là con chiên đực dùng trong lễ tấn phong. A-rôn và các con trai ông đặt tay mình trên đầu con chiên đực ấy.
  to: Rồi ông đem con chiên đực thứ hai đến, tức là con chiên đực dùng trong lễ tấn phong[a]. A-rôn và các con trai ông đặt tay lên đầu con chiên đực ấy.
  rationale: Chỉ chỉnh sửa an toàn về cấu trúc câu, vị trí neo chú thích và cách diễn đạt phương án từ vựng trong chú thích. Bản sửa giữ nguyên nghĩa nguyên văn, bao gồm trình tự, sự lặp lại của «con chiên đực», và cử chỉ nghi lễ của A-rôn cùng các con trai ông.
