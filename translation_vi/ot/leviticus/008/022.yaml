base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: vi
  text: Rồi ông đem con chiên đực thứ hai đến, tức là con chiên đực dùng trong lễ tấn phong[a]. A-rôn và các con trai ông đặt tay lên đầu con chiên đực ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con chiên đực dùng trong lễ thánh hiến.” Cụm từ Hê-bơ-rơ này là một thuật ngữ tư tế chỉ nghi lễ thiết lập người vào chức vụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Rồi ông đem đến
  rationale: Dạng Hiphil của קרב có nghĩa là đem lại gần hoặc trình ra. “Đem đến” tự nhiên trong tiếng Việt, vẫn giữ được sắc thái nghi lễ; “rồi” thể hiện diễn tiến của mạch kể.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: con chiên đực thứ hai
  rationale: אַיִל là chiên đực trưởng thành, còn הַשֵּׁנִי là số thứ tự “thứ hai”; cách dịch này xác định rõ con vật thứ hai trong chuỗi nghi lễ.
- source_word: אֵיל הַמִּלֻּאִים
  choice: con chiên đực dùng trong lễ tấn phong
  rationale: מִלֻּאִים nguyên nghĩa liên hệ đến việc “làm đầy tay”, nhưng trong văn liệu tư tế là thuật ngữ chỉ nghi lễ thiết lập người vào chức vụ. “Lễ tấn phong” diễn đạt rõ chức năng của nghi lễ trong tiếng Việt hiện đại.
- source_word: וַיִּסְמְכוּ
  choice: đặt
  rationale: Trong bối cảnh hiến tế, סמך chỉ hành động đặt hoặc ấn tay lên con vật. “Đặt tay” là cách diễn đạt rõ ràng, tự nhiên và quen thuộc trong tiếng Việt.
- source_word: אֶת יְדֵיהֶם
  choice: tay mình
  rationale: Nguyên văn dùng dạng số nhiều “các tay của họ”. Tiếng Việt tự nhiên thường dùng danh từ không đánh dấu số sau chủ thể số nhiều; “tay mình” cho thấy mỗi người thực hiện động tác mà không làm câu nặng nề.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: trên đầu con chiên đực ấy
  rationale: Dịch trực tiếp giới từ và danh từ, đồng thời dùng “ấy” để quy chiếu tự nhiên về con chiên vừa được nhắc đến.
- source_word: אַהֲרֹן וּבָנָיו
  choice: A-rôn và các con trai ông
  rationale: בָּנִים ở đây chỉ các con trai của A-rôn tham gia nghi lễ chức tư tế. Cách phiên âm và diễn đạt này rõ ràng, chính xác về giới và phù hợp văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch thuật ngữ tư tế מִלֻּאִים trong bối cảnh nghi lễ
  choice: lễ tấn phong
  alternative: lễ biệt riêng
  rationale: Cả hai cách đều phản ánh việc dành riêng A-rôn và các con trai cho chức tư tế. “Tấn phong” nhấn đúng việc thiết lập họ vào chức vụ trong Lê-vi Ký 8, còn chú thích giữ lại khả năng dịch theo khía cạnh biệt riêng/thánh hiến mà không áp đặt một hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con chiên đực” để phân biệt rõ giới tính con vật; “lễ tấn phong” diễn đạt thuật ngữ nghi lễ bằng tiếng Việt thông dụng. Đại từ “ông” quy chiếu về Môi-se theo văn cảnh, đúng với chủ ngữ ngầm của động từ Hê-bơ-rơ.
