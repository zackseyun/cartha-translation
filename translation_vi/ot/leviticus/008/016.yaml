  text: וַ/יִּקַּ֗ח אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וַ/יַּקְטֵ֥ר מֹשֶׁ֖ה הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: vi
  text: Ông lấy tất cả phần mỡ trên nội tạng, thùy gan[a], hai quả thận cùng phần mỡ của chúng; rồi Môi-se đốt chúng trên bàn thờ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phần phụ của gan”; từ Hê-bơ-rơ chỉ một phần cụ thể gắn với gan được lấy ra khi chuẩn bị sinh tế.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ ở đây có nghĩa cụ thể là đốt lễ vật để nó hóa thành khói hoặc được dâng lên trong khói.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Ông lấy
  rationale: Dạng kể chuyện của לָקַח diễn tả hành động tiếp theo trong chuỗi sự kiện. “Ông lấy” tự nhiên trong tiếng Việt và giữ chủ thể được hiểu từ văn cảnh.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: tất cả phần mỡ bọc nội tạng
  rationale: חֵלֶב trong nghi lễ chỉ các phần mỡ dành để dâng; קֶרֶב ở đây là nội tạng. “Mỡ bọc nội tạng” diễn đạt tự nhiên quan hệ vị trí của cụm Hê-bơ-rơ.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: thùy gan
  rationale: Cụm từ chỉ một phần cụ thể của gan được lấy ra khi chuẩn bị sinh tế. “Thùy gan” ngắn gọn, dễ hiểu; chú thích bảo lưu khả năng hiểu là phần phụ gắn với gan.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: hai quả thận
  rationale: Chuyển trực tiếp danh từ dạng đôi sang cách nói giải phẫu tự nhiên trong tiếng Việt.
- source_word: חֶלְבְּהֶן
  choice: phần mỡ của chúng
  rationale: Giữ rõ đại từ sở hữu số nhiều, quy chiếu về hai quả thận.
- source_word: וַיַּקְטֵר
  choice: đốt tất cả ... cho bốc khói
  rationale: Trong ngữ cảnh tế lễ, קטר không chỉ là đốt nói chung mà là đốt lễ vật để nó bốc khói trên bàn thờ. “Tất cả” là tân ngữ được bổ sung từ danh sách đi trước.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Đuôi chỉ hướng/địa điểm gắn với “bàn thờ” được diễn đạt tự nhiên bằng “trên bàn thờ”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nội tạng”, “thùy gan” và “quả thận” để mô tả giải phẫu rõ ràng; giữ tên “Môi-se” theo cách gọi quen thuộc trong tiếng Việt. Dấu chấm phẩy giúp phân biệt việc chuẩn bị các phần của sinh tế với hành động đốt trên bàn thờ.
