revisions:
- from: Ông lấy tất cả phần mỡ bọc nội tạng, thùy gan[a], hai quả thận cùng phần mỡ của chúng; rồi Môi-se đốt tất cả trên bàn thờ cho bốc khói.[b]
  to: Ông lấy tất cả phần mỡ trên nội tạng, thùy gan[a], hai quả thận cùng phần mỡ của chúng; rồi Môi-se đốt chúng trên bàn thờ.[b]
  rationale: Chỉ điều chỉnh cách dịch quan hệ vị trí của phần mỡ đối với nội tạng và thay «tất cả» bằng đại từ quy chiếu «chúng» ở mệnh đề cuối. Những thay đổi này tăng độ sát nguyên ngữ và độ rõ ràng, không thay đổi nội dung tế lễ hay các điểm mơ hồ từ vựng được chú thích.
