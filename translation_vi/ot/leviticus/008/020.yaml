base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/020.yaml
  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: vi
  text: Ông xẻ con chiên đực ra từng phần; rồi Môi-se thiêu cái đầu, các phần thịt và mỡ[a] cho bốc khói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mỡ đặc.” Từ Hê-bơ-rơ chỉ phần mỡ của con vật hiến tế; ở đây không nhất thiết có nghĩa cụ thể là “đuôi mỡ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: con chiên đực
  rationale: Trong ngữ cảnh hiến tế, אַיִל chỉ con chiên đực trưởng thành; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: נִתַּח לִנְתָחָיו
  choice: xẻ ... ra từng phần
  rationale: Cụm từ diễn tả việc phân chia thân con vật thành các phần; “xẻ ... ra từng phần” vừa sát nghĩa vừa tự nhiên.
- source_word: וַיַּקְטֵר
  choice: thiêu ... cho bốc khói
  rationale: Thể Hiphil của קטר trong nghi lễ hiến tế diễn tả việc khiến lễ vật bốc lên thành khói, không chỉ đơn thuần là đốt.
- source_word: הָרֹאשׁ
  choice: cái đầu
  rationale: Từ chỉ bộ phận cơ thể mang nghĩa trực tiếp trong ngữ cảnh.
- source_word: הַנְּתָחִים
  choice: các phần thịt
  rationale: Chỉ các phần thân con vật vừa được xẻ; thêm “thịt” giúp câu tiếng Việt rõ và tự nhiên mà không đổi nghĩa.
- source_word: הַפָּדֶר
  choice: mỡ
  rationale: פָּדֶר chỉ phần mỡ của con vật hiến tế, có thể là mỡ đặc; bằng chứng từ ngữ không đủ chắc chắn để thu hẹp thành “đuôi mỡ”.
