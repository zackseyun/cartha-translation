translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự chuyển đổi trong nguyên văn từ đại từ “ông” sang tên “Môi-se,” đồng thời dùng thuật ngữ nghi lễ tự nhiên trong tiếng Việt.
