  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành phần nghi lễ: giỏ bánh không men, ba loại bánh, các phần mỡ và đùi phải. Tuy nhiên, mệnh đề quan hệ אֲשֶׁר לִפְנֵי יְהוָה chỉ nêu vị trí của cái giỏ là «ở trước Yahweh», không khẳng định hành động «đặt» cái giỏ; nên tránh thêm sắc thái hành động này.'
