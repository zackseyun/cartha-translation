  terminology: Giữ «Yahweh» phù hợp với quyết định thuật ngữ đã nêu. «Bánh không men», «bánh làm với dầu», «bánh mỏng», và «các phần mỡ» phản ánh tốt thuật ngữ tế lễ mà không diễn giải quá mức. Chú thích về dầu bảo tồn đúng tính không xác định của cách chế biến.
  issues:
