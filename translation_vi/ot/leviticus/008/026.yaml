  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: vi
  text: Từ giỏ bánh không men ở trước Yahweh, ông lấy một chiếc bánh không men, một chiếc bánh làm với dầu[a] và một chiếc bánh mỏng, rồi đặt chúng trên các phần mỡ và trên đùi phải.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một chiếc bánh trộn với dầu.” Cụm từ Hê-bơ-rơ mô tả bánh được làm với dầu, nhưng không nói rõ cách dùng dầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִסַּל הַמַּצּוֹת
  choice: Từ giỏ bánh không men
  rationale: מִן chỉ nguồn lấy ra, còn הַמַּצּוֹת nói đến các loại bánh không men trong giỏ dùng cho nghi lễ.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: đặt trước mặt Yahweh
  rationale: Cụm לִפְנֵי diễn tả vật được đặt trong sự hiện diện của Yahweh; cách dịch này tự nhiên trong tiếng Việt và giữ nguyên danh riêng giao ước.
- source_word: חַלַּת מַצָּה אַחַת
  choice: một chiếc bánh không men
  rationale: חַלָּה là một chiếc bánh hoặc ổ bánh; kết hợp với מַצָּה chỉ rõ đây là bánh không dùng men.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: một chiếc bánh làm với dầu
  rationale: Cụm Hê-bơ-rơ liên kết bánh với dầu nhưng không nói rõ dầu được trộn vào, phết lên hay dùng theo cách khác; cách dịch giữ được độ khái quát ấy.
- source_word: וְרָקִיק אֶחָד
  choice: một chiếc bánh mỏng
  rationale: רָקִיק là loại bánh dẹt, mỏng dùng trong lễ vật; 'bánh mỏng' rõ nghĩa hơn từ vay mượn hoặc thuật ngữ ít quen thuộc.
- source_word: וַיָּשֶׂם
  choice: rồi đặt chúng
  rationale: Động từ Hê-bơ-rơ ở số ít nhưng có ba vật vừa được kể làm đối tượng; đại từ số nhiều là cách diễn đạt tự nhiên và rõ ràng trong tiếng Việt.
- source_word: הַחֲלָבִים
  choice: các phần mỡ
  rationale: Trong bối cảnh tế lễ, từ này chỉ những phần mỡ đã được quy định để dâng, không phải mỡ nói chung.
- source_word: שׁוֹק הַיָּמִין
  choice: đùi phải
  rationale: שׁוֹק chỉ phần chân hoặc đùi của con vật trong bối cảnh phân chia sinh tế; 'đùi phải' là cách gọi gọn và phù hợp.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh giao ước יהוה; giữ 'Yahweh' giúp thể hiện đây là danh riêng mà không thay bằng một tước hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng 'chiếc' để phân biệt từng món bánh trong nghi lễ; tránh thuật ngữ cổ hoặc quá chuyên môn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
