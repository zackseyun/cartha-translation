source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: vi
  text: 'Môi-se nói với hội chúng: “Đây là điều Đức Gia-vê đã truyền phải làm.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng kể chuyện với waw nối tiếp thúc đẩy mạch thuật; tiếng Việt tự nhiên không cần dịch riêng liên từ וַ trong câu này.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: הָעֵדָה
  choice: hội chúng
  rationale: Chỉ toàn thể cộng đồng Israel đang được triệu tập, đồng thời giữ sắc thái tập thể trong bối cảnh nghi lễ.
- source_word: זֶה הַדָּבָר
  choice: Đây là điều
  rationale: Diễn đạt tự nhiên cấu trúc chỉ định cộng danh từ, không làm yếu đi tính xác định của mệnh lệnh sắp được thực hiện.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Thể hoàn thành nói đến mệnh lệnh đã được ban trước thời điểm Môi-se công bố.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ đây là danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu; dạng Giê-hô-va đã quen thuộc trong tiếng Việt.
- source_word: לַעֲשׂוֹת
  choice: phải làm
  rationale: Nguyên ngữ dùng động từ nguyên mẫu chủ động, nhưng trong ngữ cảnh có nghĩa phiếm chỉ về điều được truyền thực hiện; “phải làm” vừa tự nhiên vừa giữ lực mệnh lệnh.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn nêu trực tiếp danh giao ước chứ không dùng tước hiệu “Chúa”; bản dịch vì thế giữ một dạng danh riêng quen thuộc trong tiếng Việt, không thay bằng tước hiệu.
- issue: Chủ thể hàm ẩn của לַעֲשׂוֹת
  choice: phải làm
  alternative: phải được thực hiện
  rationale: Dạng nguyên mẫu về hình thức là chủ động nhưng không nêu chủ thể. “Phải làm” bảo tồn sự không xác định ấy và không buộc câu sang thể bị động.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và gọn. Dùng “hội chúng” cho cộng đồng Israel được tập hợp trong bối cảnh nghi lễ; không thêm liên từ mở đầu vì tiếng Việt kể chuyện tự nhiên không đòi hỏi.
