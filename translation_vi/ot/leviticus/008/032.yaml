review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: phần còn lại, thịt, bánh, mệnh lệnh ngôi hai số nhiều, và việc thiêu bằng/trong lửa. Tuy nhiên, trật tự «Phần thịt và bánh còn lại» có thể khiến «còn lại» được hiểu là chỉ bổ nghĩa cho «bánh».'
  naturalness: «Những phần thịt và bánh còn lại» làm rõ phạm vi của phân từ danh từ «những gì còn lại» trong tiếng Hê-bơ-rơ, đồng thời tự nhiên trong tiếng Việt hiện đại. «Thiêu trong lửa» là cách diễn đạt rõ ràng, trang trọng và sát ngữ cảnh nghi lễ.
  terminology: «Thịt» phù hợp với בָּשָׂר trong ngữ cảnh thức ăn tế lễ; chú thích nên phản ánh lựa chọn từ vựng này, tương ứng với dấu vết kiểm tra tiếng Anh, thay vì tạo một chú thích thay thế không cần thiết cho «dùng lửa/ trong lửa». «Các con» phù hợp với đối tượng trực tiếp trong ngữ cảnh gần (A-rôn và các con trai ông).
  issues:
  - severity: low
    issue: Phạm vi của «còn lại» chưa hoàn toàn rõ trong cụm «Phần thịt và bánh còn lại».
    rationale: Nguyên văn chỉ chung những gì còn lại của cả thịt lẫn bánh. Đặt «những phần» ở đầu và «còn lại» sau cụm phối hợp giúp tránh cách hiểu rằng chỉ bánh là còn lại.
  - severity: low
    issue: Nội dung chú thích hiện có không phản ánh chú thích từ vựng của bản tiếng Anh và ít cần thiết với cách dịch «dùng lửa».
    rationale: Chú thích tiếng Anh nêu nghĩa đen «flesh» của בָּשָׂר. Chú thích tiếng Việt về nghĩa đen «xác thịt» giữ được thông tin từ vựng hữu ích và gắn đúng vào «thịt».
  revised_text: Những phần thịt[a] và bánh còn lại, các con phải thiêu trong lửa.
