  yaml_path: translation/ot/leviticus/008/032.yaml
  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: vi
  text: Những phần thịt[a] và bánh còn lại, các con phải thiêu trong lửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nghĩa đen là “xác thịt”; trong ngữ cảnh này chỉ thịt của lễ vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Phần ... còn lại
  rationale: Phân từ Niphal được dùng như danh từ, chỉ phần còn dư; cách diễn đạt này tự nhiên và giữ đúng ý của nguyên văn.
- source_word: בַּבָּשָׂר
  choice: thịt
  rationale: בָּשָׂר có nghĩa đen là “xác thịt/thịt”; trong ngữ cảnh thức ăn tế lễ, “thịt” là cách nói tiếng Việt rõ ràng và tự nhiên.
- source_word: וּבַלָּחֶם
  choice: và bánh
  rationale: לֶחֶם là từ thông dụng chỉ bánh; kết hợp “thịt và bánh” diễn đạt gọn cấu trúc song song của tiếng Hê-bơ-rơ.
- source_word: בָּאֵשׁ
  choice: dùng lửa
  rationale: Giới từ בְּ ở đây có thể chỉ phương tiện hoặc phạm vi; “dùng lửa” diễn đạt tự nhiên phương tiện thiêu đốt mà không thêm ý.
- source_word: תִּשְׂרֹפוּ
  choice: các con phải ... thiêu đi
  rationale: Động từ chưa hoàn thành ngôi hai số nhiều mang lực mệnh lệnh trong văn luật pháp; “phải” thể hiện rõ tính bắt buộc, còn “thiêu đi” phù hợp ngữ cảnh xử lý phần lễ vật còn dư.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại. Dùng “các con” để biểu đạt ngôi hai số nhiều trong lời Môi-se nói với A-rôn và các con trai ông theo ngữ cảnh gần; tránh lối “các ngươi” cổ và xa lạ.
