- from: Phần thịt và bánh còn lại, các con phải dùng lửa thiêu đi.[a]
  to: Những phần thịt[a] và bánh còn lại, các con phải thiêu trong lửa.
  rationale: Chỉnh nhẹ để «còn lại» chi phối rõ cả thịt lẫn bánh, dùng «trong lửa» như một cách dịch trực tiếp và tự nhiên của בָּאֵשׁ, và thay chú thích về giới từ bằng chú thích từ vựng về בָּשָׂר, tương ứng với hồ sơ kiểm tra tiếng Anh. Không thay đổi ý nghĩa hay thêm diễn giải giáo phái.
