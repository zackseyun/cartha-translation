id: LEV.8.31
reference: Leviticus 8:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: vi
  text: 'Môi-se nói với A-rôn và các con trai ông: “Hãy luộc thịt tại lối vào Lều Hội Kiến; tại đó, các ông hãy ăn thịt ấy và bánh trong giỏ lễ vật phong chức[a], đúng như ta đã truyền rằng: ‘A-rôn và các con trai ông phải ăn nó.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giỏ lễ vật cung hiến.” Từ Hê-bơ-rơ chỉ các lễ vật gắn với nghi thức thiết lập các tư tế vào chức vụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: hãy luộc
  rationale: Trong bối cảnh tế lễ, động từ này thường chỉ việc luộc hoặc nấu thịt; “luộc” diễn đạt nghĩa cụ thể và phù hợp với nghi thức.
- source_word: הַבָּשָׂר
  choice: thịt
  rationale: Chỉ phần ăn được của con vật hiến tế; “thịt” tự nhiên và chính xác hơn cách dịch quá sát là “xác thịt”.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: Giữ rõ địa điểm nghi lễ và dùng tên gọi trang trọng, quen thuộc cho אֹהֶל מוֹעֵד.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: tại đó, các ông hãy ăn thịt ấy
  rationale: Đưa “tại đó” lên trước để giữ sự nhấn mạnh địa điểm trong tiếng Hê-bơ-rơ, đồng thời làm rõ đại từ chỉ phần thịt.
- source_word: הַלֶּחֶם
  choice: bánh
  rationale: Trong ngữ cảnh này, từ chỉ bánh dùng kèm trong nghi thức phong chức; “bánh” là cách dịch trực tiếp và tự nhiên.
- source_word: סַל הַמִּלֻּאִים
  choice: giỏ lễ vật phong chức
  rationale: מִלֻּאִים chỉ nghi thức thiết lập A-rôn và các con trai ông vào chức vụ tư tế. “Lễ vật phong chức” truyền đạt chức năng nghi lễ mà không dịch máy móc thành “làm đầy”.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: đúng như ta đã truyền rằng
  rationale: Diễn đạt tự nhiên cấu trúc mệnh lệnh kèm lời trích dẫn, đồng thời giữ sắc thái “đúng như” của כַּאֲשֶׁר.
- source_word: יֹאכְלֻהוּ
  choice: phải ăn những thứ ấy
  rationale: Thể chưa hoàn thành ở đây mang lực chỉ thị. Tiếng Việt dùng “phải” để thể hiện nghĩa vụ; số nhiều “những thứ ấy” quy chiếu tự nhiên đến thịt và bánh vừa nêu.
theological_decisions:
- issue: Cách dịch מִלֻּאִים trong bối cảnh thiết lập chức tư tế
  choice: lễ vật phong chức
  alternative: lễ vật cung hiến
  rationale: “Phong chức” làm rõ đây là nghi thức đặt A-rôn và các con trai ông vào chức vụ tư tế, nhưng không gắn thuật ngữ với cơ cấu giáo hội về sau. “Cung hiến” vẫn là một khả năng từ vựng và được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Lều Hội Kiến” như tên riêng của địa điểm thờ phượng; dùng “các ông” trong lời nói trực tiếp để tránh đại từ cổ “các ngươi”. Giữ sự nhấn mạnh vào địa điểm bằng cách đặt “tại đó” ở đầu mệnh đề.
