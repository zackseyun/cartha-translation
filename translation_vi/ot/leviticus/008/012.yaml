source:
  edition: WLC
  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: vi
  text: Rồi ông đổ một ít dầu xức trên đầu A-rôn và xức dầu cho ông để thánh hiến ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: đổ
  rationale: Động từ יצק chỉ hành động đổ chất lỏng; “đổ” là cách diễn đạt tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: một ít dầu xức
  rationale: Giới từ מִן ở đây có sắc thái phân lượng, tức lấy một phần trong số dầu dùng cho nghi thức xức; “một ít dầu xức” diễn đạt rõ và tự nhiên.
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: trên đầu A-rôn
  rationale: Cụm từ chỉ vị trí trực tiếp, được chuyển sang tiếng Việt theo trật tự tự nhiên.
- source_word: וַיִּמְשַׁח אֹתוֹ
  choice: xức dầu cho ông
  rationale: משׁח là thuật ngữ nghi lễ chỉ việc xức dầu. Thêm “dầu” trong tiếng Việt làm rõ hành động vốn đã được xác định bởi ngữ cảnh ngay trước đó.
- source_word: לְקַדְּשׁוֹ
  choice: để biệt riêng ông ra thánh
  rationale: Cách dịch này giữ cả ý đặt riêng cho việc thánh và địa vị thánh trong ngữ cảnh thiết lập chức vụ tế lễ, đồng thời dễ hiểu hơn lối nói Hán-Việt chuyên biệt.
- source_word: וַ
  choice: Rồi
  rationale: Waw liên tiếp đẩy trình thuật sang hành động kế tiếp; “Rồi” thể hiện trình tự tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch קדשׁ trong bối cảnh thiết lập chức vụ tế lễ
  choice: để biệt riêng ông ra thánh
  alternative: để thánh hóa ông; để hiến thánh ông
  rationale: Ngữ cảnh nói đến việc A-rôn được dành riêng cho sự phục vụ thánh. “Biệt riêng ông ra thánh” giữ được chiều kích nghi lễ và chức vụ mà không áp đặt sắc thái giáo phái hoặc một học thuyết về sự thánh hóa về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “A-rôn” theo lối phiên âm Kinh Thánh quen thuộc; tránh từ quá cổ. Sự lặp lại giữa “dầu xức” và “xức dầu” phản ánh phép liên kết từ vựng có chủ ý trong nguyên văn.
