  text: וַ/יַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽ/חַטָּ֑את וַ/יִּסְמֹ֨ךְ אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת יְדֵי/הֶ֔ם עַל רֹ֖אשׁ פַּ֥ר הַֽ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: vi
  text: Rồi ông đưa con bò đực dùng làm lễ vật chuộc tội[a] đến; A-rôn và các con trai ông đặt tay mình trên đầu con bò đực dùng làm lễ vật chuộc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trình con bò đực dùng làm lễ vật chuộc tội ra” hoặc “đưa con bò ấy lại gần.”'
    reason: Nêu các sắc thái khả dĩ của וַיַּגֵּשׁ trong bối cảnh nghi lễ.
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: đưa ... đến
  rationale: Dạng Hiphil của נגשׁ có nghĩa là đem lại gần hoặc trình ra. “Đưa ... đến” tự nhiên trong tiếng Việt và giữ được ý nghĩa nghi lễ mà không xác định quá mức nơi chốn hay đối tượng tiếp nhận.
- source_word: פַּר
  choice: con bò đực
  rationale: Trong bối cảnh hiến tế, פַּר chỉ bò đực; câu này không buộc phải thêm ý “non”.
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: Ở đây חַטָּאת chỉ lễ vật hiến tế liên quan đến tội lỗi, không chỉ bản thân tội lỗi. Cách dịch này rõ nghĩa trong tiếng Việt hiện đại và phù hợp thuật ngữ nghi lễ.
- source_word: וַיִּסְמֹךְ
  choice: đặt
  rationale: Trong nghi lễ hiến tế, סמך diễn tả hành động đặt hoặc tì tay lên con vật. “Đặt” thuật lại hành động mà không khẳng định mức độ đè hay một cơ chế thần học cụ thể.
- source_word: יְדֵיהֶם
  choice: tay mình
  rationale: Nguyên văn dùng danh từ số nhiều với hậu tố chỉ nhiều người. Tiếng Việt tự nhiên dùng “tay mình” sau chủ ngữ số nhiều, vẫn cho thấy mỗi người tham gia hành động.
- source_word: עַל רֹאשׁ
  choice: trên đầu
  rationale: Diễn đạt trực tiếp quan hệ không gian của nghi thức bằng tiếng Việt hiện đại, trang trọng và rõ ràng.
theological_decisions:
- issue: Ý nghĩa của việc đặt tay trong nghi lễ hiến tế
  choice: Chỉ mô tả hành động đặt tay, không đưa lời giải thích thần học vào chính văn.
  alternative: Có thể hiểu cử chỉ này là sự đồng nhất với lễ vật, chuyển giao tội lỗi hoặc trách nhiệm, hay chỉ định con vật cho việc hiến tế.
  rationale: Câu Hê-bơ-rơ thuật lại nghi thức nhưng không giải thích cơ chế hay ý nghĩa thần học cụ thể; bản dịch vì thế giữ nguyên độ mở của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Rồi” để nối diễn tiến tường thuật; giữ cách gọi “A-rôn” quen thuộc. Cấu trúc “dùng làm lễ vật chuộc tội” tránh khiến người đọc hiểu con vật và lễ vật là hai đối tượng khác nhau.
