  to: Môi-se mặc áo trong cho A-rôn, thắt đai quanh lưng ông, khoác áo choàng cho ông, rồi mặc ê-phốt cho ông. Ông dùng đai dệt tinh xảo của ê-phốt[a] thắt ê-phốt vào người A-rôn và dùng chính đai ấy cố định ê-phốt vào người ông[b].
