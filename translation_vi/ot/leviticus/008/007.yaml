  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: vi
  text: Môi-se mặc áo trong cho A-rôn, thắt đai quanh lưng ông, khoác áo choàng cho ông, rồi mặc ê-phốt cho ông. Ông dùng đai dệt tinh xảo của ê-phốt[a] thắt ê-phốt vào người A-rôn và dùng chính đai ấy cố định ê-phốt vào người ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đai trang trí của ê-phốt” hoặc “đai lưng của ê-phốt.”
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ hiếm gặp ở đây có lẽ nói đến việc cố định ê-phốt vào người A-rôn bằng chính chiếc đai dệt của nó.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: áo dài
  rationale: Chỉ chiếc áo căn bản của lễ phục thầy tế lễ; “áo dài” là cách gọi tự nhiên, trang trọng và không thêm ý nghĩa chức năng ngoài văn bản.
- source_word: אַבְנֵט
  choice: đai
  rationale: Chỉ dải vải quấn quanh eo; “đai” phù hợp với lễ phục hơn “thắt lưng” theo nghĩa vật dụng hiện đại.
- source_word: מְעִיל
  choice: áo choàng
  rationale: Chỉ lớp áo mặc bên ngoài áo dài; “áo choàng” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אֵפֹד
  choice: ê-phốt
  rationale: Đây là một lễ phục chuyên biệt của thầy tế lễ, không có từ tương đương chính xác trong tiếng Việt; phiên âm bảo toàn tính chuyên môn.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: đai dệt tinh xảo của ê-phốt
  rationale: Trong ngữ cảnh lễ phục, cụm này chỉ chiếc đai được chế tác bằng kỹ thuật dệt và gắn với ê-phốt; chú thích giữ lại các khả năng “đai trang trí” và “đai lưng”.
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: thắt đai quanh lưng ông
  rationale: Diễn đạt hành động quấn và thắt đai quanh eo bằng tiếng Việt tự nhiên, thay vì dịch sát theo cấu trúc “thắt ông bằng đai”.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: dùng chính đai ấy buộc ê-phốt vào người ông
  rationale: Động từ hiếm có cùng gốc với “ê-phốt” mô tả việc cố định ê-phốt bằng chiếc đai vừa nhắc đến; cách dịch nêu rõ quan hệ phương tiện mà ngữ cảnh tiếng Hê-bơ-rơ hàm ý.
- source_word: וַיִּתֵּן עָלָיו
  choice: mặc ... cho ông
  rationale: Đây là lối nói Hê-bơ-rơ về việc đặt y phục lên người; “mặc ... cho” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch thuật ngữ lễ phục thầy tế lễ
  choice: Phiên âm thuật ngữ chuyên biệt אֵפֹד là “ê-phốt”, nhưng dịch các loại y phục thông dụng sang tiếng Việt.
  alternative: Dịch אֵפֹד theo hình dáng, chẳng hạn “lễ phục giống tạp dề”.
  rationale: Hình dáng chính xác của ê-phốt không được xác định đầy đủ chỉ từ từ này. Phiên âm tránh áp đặt một hình dung cụ thể, đồng thời giữ tính đặc thù của lễ phục thờ phượng.
- issue: Chủ thể và đối tượng của hành động mặc lễ phục
  choice: Nêu Môi-se và A-rôn theo ngữ cảnh trực tiếp để các đại từ tiếng Việt không bị lẫn.
  alternative: Giữ nguyên hoàn toàn các đại từ “ông” như trong cấu trúc Hê-bơ-rơ.
  rationale: Tiếng Hê-bơ-rơ dựa vào ngữ cảnh trước đó để xác định “ông” là Môi-se và “người” là A-rôn. Nêu tên không giải quyết một điểm thần học còn tranh luận mà chỉ làm rõ các tham chiếu vốn đã hiển nhiên trong mạch văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tách làm hai để tránh chuỗi động từ quá dài; các tên riêng làm rõ chủ thể và đối tượng trong tiếng Việt. Thuật ngữ “ê-phốt” được phiên âm và viết thường như tên một loại lễ phục.
