id: LEV.8.9
reference: Leviticus 8:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Môi-se đặt khăn xếp lên đầu A-rôn; rồi ông gắn tấm thẻ vàng, tức miện thánh[a], vào mặt trước của khăn xếp, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vương miện thánh.”'
    reason: Phương án gần nghĩa cho נֵזֶר הַקֹּדֶשׁ; cụm này đồng vị với “tấm thẻ vàng”.
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: khăn xếp
  rationale: Chỉ loại khăn đội đầu đặc trưng của thầy tế lễ; “khăn xếp” vừa cụ thể, dễ hiểu, vừa phù hợp với vật được quấn hoặc đội trên đầu hơn từ khái quát “mũ đội đầu”.
- source_word: אֶל מוּל פָּנָיו
  choice: vào phía trước khăn xếp
  rationale: Thành ngữ này xác định vị trí tấm vàng ở phần hướng ra phía trước của khăn, chứ không chỉ nói nó ở trước mặt A-rôn.
- source_word: צִיץ
  choice: tấm thẻ bằng vàng
  rationale: Trong trang phục tế lễ, từ này chỉ vật trang sức bằng vàng gắn trên khăn đội đầu; “tấm thẻ” diễn đạt rõ hình thức và chức năng trong ngữ cảnh, dù nghĩa cơ bản của từ cũng có thể liên quan đến hoa hoặc vật trang trí.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: miện thánh
  rationale: Cụm đồng vị xác định tấm thẻ vàng là biểu hiệu thánh được biệt riêng cho chức tế lễ. “Miện thánh” trang trọng, ngắn gọn và giữ được sắc thái của נֵזֶר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự Danh, thay vì thay bằng một tước hiệu.
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: đội ... gắn
  rationale: 'Cùng một động từ Hê-bơ-rơ được chuyển theo hai hành động cụ thể trong tiếng Việt: đội khăn lên đầu và gắn tấm vàng vào khăn.'
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: “Đúng như” làm rõ sự tương ứng trọn vẹn giữa hành động của Môi-se và mệnh lệnh của Yahweh.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh giao ước; chuyển là “Yahweh” bảo tồn đây là danh riêng, không biến nó thành tước hiệu.
- issue: Quan hệ giữa tấm vàng và נֵזֶר הַקֹּדֶשׁ
  choice: tức là miện thánh
  alternative: tấm thẻ vàng và miện thánh là hai vật riêng
  rationale: Cấu trúc đồng vị trong tiếng Hê-bơ-rơ phù hợp nhất với cách hiểu “miện thánh” là tên gọi hoặc sự xác định thêm cho chính tấm thẻ vàng, không phải một món riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng tên Môi-se và A-rôn thay cho chuỗi đại từ của tiếng Hê-bơ-rơ để tránh mơ hồ trong tiếng Việt; giữ dấu chấm phẩy nhằm phản ánh hai hành động liên tiếp. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
