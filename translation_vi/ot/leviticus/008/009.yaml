    rationale: וַיָּשֶׂם ... עַל־רֹאשׁוֹ có chủ thể là Môi-se và đại từ “đầu người ấy” chỉ A-rôn. Tiếng Việt cần dùng “đặt khăn xếp lên đầu A-rôn” để biểu đạt đúng quan hệ này.
  - severity: low
    issue: Chú thích nêu “dải miện thánh” như một phương án dịch.
    rationale: Phương án này thêm một mô tả hình dạng không cần thiết; đối chiếu tiếng Anh chỉ nêu “sacred diadem”. Nên giới hạn chú thích ở biến thể “vương miện thánh”.
