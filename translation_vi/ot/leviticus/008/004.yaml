id: LEV.8.4
reference: Leviticus 8:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: vi
  text: Môi-se làm như Yahweh đã truyền cho ông, và hội chúng tụ họp tại lối vào Lều Hội Kiến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hội chúng quy tụ” hoặc “hội chúng được tập hợp”. Động từ Hê-bơ-rơ có thể được diễn đạt bằng những cách khác nhau trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה có nghĩa rộng là “làm”; trong ngữ cảnh vâng theo mệnh lệnh, “làm” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự phù hợp với mệnh lệnh đã ban; “đúng như” tự nhiên trong tiếng Việt và làm rõ sắc thái làm theo chính điều được truyền.
- source_word: צִוָּה
  choice: đã truyền
  rationale: צוה chỉ một mệnh lệnh có thẩm quyền. “Truyền” giữ được sức nặng ấy và phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֹתוֹ
  choice: cho ông
  rationale: Đại từ chỉ Môi-se. Với động từ “truyền” trong tiếng Việt, cấu trúc “truyền cho ông” tự nhiên hơn cách dịch máy móc theo dấu hiệu tân ngữ của tiếng Hê-bơ-rơ.
- source_word: וַתִּקָּהֵל
  choice: tụ họp
  rationale: Dạng Niphal của קהל ở đây diễn tả hội chúng cùng quy tụ; “tụ họp” là nội động từ tự nhiên và không buộc phải hiểu theo nghĩa bị động.
- source_word: הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng giao ước của Y-sơ-ra-ên trong tư cách một tập thể. “Hội chúng” phù hợp với ngữ cảnh Ngũ Kinh; “toàn thể” phản ánh ý nghĩa tập thể xác định trong ngữ cảnh.
- source_word: אֶל פֶּתַח
  choice: tại lối vào
  rationale: אֶל cơ bản chỉ hướng đến, nhưng với hành động tụ họp, tiếng Việt tự nhiên dùng “tại” để diễn tả nơi hội chúng đến và đứng tụ lại.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Giữ cả hình ảnh vật chất là “lều” và chức năng là nơi gặp gỡ; viết hoa như tên gọi cố định của nơi thánh.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יְהוָה; phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng một tước hiệu.
- issue: Sắc thái chủ động hay bị động của וַתִּקָּהֵל
  choice: hội chúng tụ họp
  alternative: hội chúng được triệu tập
  rationale: Dạng Niphal có thể được diễn đạt bằng nội động từ hoặc bị động, nhưng ngữ cảnh không xác định rõ một tác nhân triệu tập. “Tụ họp” giữ sự kiện quy tụ mà không thêm tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ tên Môi-se quen thuộc trong tiếng Việt và dùng “Lều Hội Kiến” như một danh xưng cố định. Không cần chú thích vì biến thể nội động từ/bị động của וַתִּקָּהֵל có thể được thể hiện đầy đủ trong phần quyết định dịch mà không gây mất nghĩa đáng kể ở câu chính.
