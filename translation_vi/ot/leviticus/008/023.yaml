base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: vi
  text: Ông giết con chiên đực ấy, rồi Môi-se lấy một ít máu của nó, bôi lên dái tai phải của A-rôn[a], lên ngón cái của bàn tay phải ông, và lên ngón chân cái của bàn chân phải ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đầu tai phải của A-rôn.”'
    reason: Từ Hê-bơ-rơ chỉ phần ngoài cùng của tai có thể được hiểu là dái tai hoặc đầu/chóp tai; chú thích bảo lưu khả năng từ vựng này.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Ông giết con chiên đực ấy
  rationale: Động từ chỉ việc giết sinh tế theo nghi thức. Tiếng Việt tự nhiên dùng “giết”; bổ sung “con chiên đực ấy” từ đối tượng được nêu ngay trong câu trước để tránh đại từ mơ hồ.
- source_word: מִדָּמוֹ
  choice: một ít máu của nó
  rationale: מִן diễn tả việc lấy một phần máu, không phải toàn bộ; “một ít máu” truyền đạt điều này tự nhiên.
- source_word: תְּנוּךְ אֹזֶן
  choice: dái tai
  rationale: Trong ngữ cảnh nghi lễ, cụm từ chỉ phần ngoài ở đầu hoặc thùy tai; “dái tai” là cách gọi giải phẫu rõ ràng và thông dụng.
- source_word: הַיְמָנִית
  choice: phải
  rationale: Tính từ xác định bộ phận phía bên phải; cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: בֹּהֶן יָדוֹ
  choice: ngón cái bàn tay
  rationale: בֹּהֶן khi nói về bàn tay là ngón cái; giữ “bàn tay” để phản ánh đầy đủ cấu trúc nguồn.
- source_word: בֹּהֶן רַגְלוֹ
  choice: ngón cái bàn chân
  rationale: בֹּהֶן khi nói về bàn chân là ngón chân cái; “ngón cái bàn chân” rõ nghĩa trong tiếng Việt.
- source_word: וַיִּתֵּן עַל
  choice: bôi lên
  rationale: Trong ngữ cảnh lấy máu rồi đặt lên các bộ phận cơ thể, “bôi lên” diễn đạt tự nhiên hành động nghi lễ mà không thêm ý nghĩa biểu tượng.
theological_decisions:
- issue: Việc bôi máu sinh tế lên các chi thể của A-rôn
  choice: Chỉ thuật lại hành động nghi lễ, không giải thích biểu tượng trong chính văn
  alternative: Thêm ý nghĩa thánh hiến hoặc giải thích biểu tượng chức tế lễ
  rationale: Bản Hê-bơ-rơ tại câu này mô tả hành động chứ không trực tiếp giải thích ý nghĩa thần học; bản dịch không nên đưa phần diễn giải vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” và “A-rôn” theo dạng tên quen thuộc trong tiếng Việt; các chuỗi bộ phận cơ thể được trình bày song song để giữ nhịp của nguyên văn.
