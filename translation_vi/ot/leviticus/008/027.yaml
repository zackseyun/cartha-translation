  verdict: revise
  source_fidelity: Bản dịch bảo tồn đúng tác nhân ngầm định từ ngữ cảnh (Môi-se), đối tượng là toàn bộ các phần lễ vật, việc đặt chúng vào lòng bàn tay A-rôn và các con trai ông, và nghi thức được thực hiện trước mặt Đức Giê-hô-va. Tuy nhiên, cụm hiện tại lặp lại vụng về động tác và danh từ nghi lễ, khiến quan hệ của וַיָּנֶף אֹתָם תְּנוּפָה không tự nhiên trong tiếng Việt.
