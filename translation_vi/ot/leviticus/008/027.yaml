  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: vi
  text: Ông đặt tất cả những phần ấy vào lòng bàn tay A-rôn và vào lòng bàn tay các con trai ông[a], rồi ông làm lễ đưa qua đưa lại các lễ vật ấy trước mặt Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trên lòng bàn tay A-rôn và trên lòng bàn tay các con trai ông.” Giới từ Hê-bơ-rơ theo nghĩa đen là “trên”, nhưng trong ngữ cảnh này, các phần lễ vật được đặt vào những bàn tay đang khum lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ông đặt
  rationale: Động từ נתן có thể mang nghĩa “trao, đặt, để”; trong nghi thức này, “đặt” diễn tả hành động cụ thể mà không hàm ý chuyển quyền sở hữu.
- source_word: אֶת הַכֹּל
  choice: tất cả những phần ấy
  rationale: Cụm từ chỉ toàn bộ các phần lễ vật đã nêu ở câu trước; cách diễn đạt này làm rõ sở chỉ mà không thêm nội dung mới.
- source_word: עַל כַּפֵּי
  choice: vào lòng bàn tay
  rationale: עַל theo sát chữ là “trên”, còn כַּף là lòng bàn tay. Trong ngữ cảnh các bàn tay khum để nhận những phần lễ vật, “vào lòng bàn tay” tự nhiên trong tiếng Việt; cách dịch sát chữ được giữ trong chú thích.
- source_word: וְעַל כַּפֵּי בָנָיו
  choice: và lòng bàn tay các con trai ông
  rationale: Giữ cấu trúc lặp lại và dịch chính xác בָנָיו là các con trai của A-rôn trong nghi thức phong chức.
- source_word: וַיָּנֶף אֹתָם תְּנוּפָה
  choice: rồi đưa chúng qua lại làm lễ vật đưa qua đưa lại
  rationale: Hiphil của נוף cùng danh từ kỹ thuật תְּנוּפָה diễn tả cách trình dâng bằng động tác đưa qua đưa lại. Đại từ “chúng” chỉ các phần lễ vật, không chỉ A-rôn và các con trai ông.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: לִפְנֵי diễn tả hành động được thực hiện trước sự hiện diện của Đức Chúa Trời; dùng cách phiên âm tiếng Việt quen thuộc cho danh YHWH.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: “Đức Giê-hô-va” là dạng danh riêng quen thuộc và trang trọng trong tiếng Việt, đồng thời cho người đọc nhận biết rằng nguyên văn dùng danh YHWH.
- issue: Sở chỉ của אֹתָם
  choice: “chúng” chỉ các phần lễ vật
  alternative: A-rôn và các con trai ông
  rationale: Ngữ pháp và diễn tiến nghi lễ cho thấy đối tượng được đưa qua đưa lại là toàn bộ các phần vừa được đặt vào lòng bàn tay họ; giữ đại từ số nhiều để không diễn giải quá mức.
- issue: Thuật ngữ תְּנוּפָה
  choice: lễ vật đưa qua đưa lại
  alternative: lễ vật dâng qua lại; lễ vật vẫy
  rationale: Cách dịch mô tả động tác nghi lễ mà không ấn định một hướng chuyển động không được câu này nêu rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thuật ngữ nghi lễ bằng cụm mô tả “lễ vật đưa qua đưa lại”; tránh từ “vẫy”, vốn dễ gợi một cử chỉ thông thường. Đại từ “ông” ở đầu câu tiếp nối Môi-se từ ngữ cảnh trước.
