  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Rồi Môi-se đưa các con trai A-rôn đến gần[a], mặc áo dài cho họ, thắt đai lưng cho từng người[b], và đội mũ cho họ, đúng như Yahweh[c] đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đưa các con trai A-rôn ra trình diện.” Động từ Hê-bơ-rơ có thể mang nghĩa “đưa đến gần” hoặc “trình diện” trong bối cảnh nghi lễ.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng danh từ số ít “đai lưng” theo nghĩa phân phối, tức là mỗi người được thắt một đai.
    reason: lexical_alternative
  - marker: c
    text: Trong nguyên văn Hê-bơ-rơ là danh יהוה (YHWH), tại đây được phiên âm là “Yahweh”; theo truyền thống cũng thường được dịch là “CHÚA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: đưa ... đến gần
  rationale: Hiphil của קרב có nghĩa là đưa đến gần hoặc trình diện. Cách dịch này giữ được sắc thái tiến đến trong nghi thức mà không biến động từ thành một thuật ngữ chuyên biệt quá mức.
- source_word: בְּנֵי אַהֲרֹן
  choice: các con trai A-rôn
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu, đồng thời giữ rõ tham chiếu nam giới trong nguyên văn.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: mặc áo dài cho họ
  rationale: Hiphil của לבשׁ là mặc áo cho người khác; כֻּתֹּנֶת chỉ loại áo thân dài cơ bản. “Áo dài” dễ hiểu trong tiếng Việt và không đồng nhất y phục này với áo choàng ngoài.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: thắt đai lưng cho từng người
  rationale: 'חגר diễn tả việc thắt quanh thân, còn אַבְנֵט là dải đai bằng vải của tư tế. Danh từ số ít được hiểu theo nghĩa phân phối: mỗi người một đai.'
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: đội mũ cho họ
  rationale: חבשׁ ở đây nói đến việc buộc hoặc đội vật che đầu; מִגְבָּעוֹת là mũ của các tư tế thường, khác với khăn đội đầu của thượng tế. Tiếng Việt tự nhiên dùng “đội mũ cho” mà không cần suy diễn hình dạng chính xác.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: Mọi việc đều đúng như Đức Giê-hô-va đã truyền cho Môi-se
  rationale: Giữ công thức nhấn mạnh sự tuân thủ chính xác, đồng thời sắp xếp lại câu cho tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Phiên âm danh riêng YHWH theo dạng đã quen thuộc rộng rãi trong tiếng Việt; yếu tố “Đức” tạo sắc thái tôn kính phù hợp với văn phong Kinh Thánh.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc, còn chú thích cho biết dạng chữ Hê-bơ-rơ và cách dịch truyền thống.
- issue: Sắc thái nghi lễ của וַיַּקְרֵב
  choice: đưa ... đến gần
  alternative: trình diện
  rationale: “Đưa đến gần” bảo tồn khả năng đây vừa là chuyển động đến gần vừa là hành vi trình diện trong lễ phong chức, không quyết định thay nguyên văn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Rồi” để nối tiếp chuỗi hành động trong nghi lễ; tách công thức kết câu thành một câu ngắn nhằm tránh chuỗi liên từ nặng nề. Các tên riêng dùng dạng Việt hóa quen thuộc: Môi-se, A-rôn.'
