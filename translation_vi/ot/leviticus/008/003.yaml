  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: vi
  text: Hãy tập hợp toàn thể hội chúng tại lối vào Lều Hội Kiến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tập hợp toàn thể cộng đồng.” Từ Hê-bơ-rơ עֵדָה có thể mang nghĩa “hội chúng”, “đoàn hội” hoặc “cộng đồng”, tùy văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: Hãy
  rationale: וְ nối tiếp chuỗi mệnh lệnh, còn אֵת là dấu hiệu của tân ngữ xác định và không cần dịch riêng trong tiếng Việt. Dùng “Hãy” để thể hiện tự nhiên lực mệnh lệnh của động từ theo sau.
- source_word: כָּל
  choice: toàn thể
  rationale: כָּל đi với danh từ xác định nhấn mạnh toàn bộ cộng đồng; “toàn thể” trang trọng, tự nhiên và diễn đạt rõ tính trọn vẹn.
- source_word: הָעֵדָה
  choice: hội chúng
  rationale: עֵדָה chỉ cộng đồng Israel được triệu tập. “Hội chúng” giữ được sắc thái tập thể và nghi lễ trong văn cảnh tư tế, dù “cộng đồng” hoặc “toàn dân” cũng có thể dùng.
- source_word: הַקְהֵל
  choice: tập hợp
  rationale: Đây là mệnh lệnh Hiphil của קהל, nghĩa là khiến người ta tụ họp. “Tập hợp” là cách nói hiện đại, rõ ràng và phù hợp với mệnh lệnh dành cho Môi-se.
- source_word: אֶל
  choice: tại
  rationale: Trong cụm chỉ vị trí với פֶּתַח, “tại lối vào” tự nhiên trong tiếng Việt và diễn đạt địa điểm nơi hội chúng phải được tập hợp.
- source_word: פֶּתַח
  choice: lối vào
  rationale: פֶּתַח là chỗ mở hoặc nơi đi vào. “Lối vào” rõ nghĩa và tự nhiên hơn “cửa” khi nói về một căn lều.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cụm từ chỉ chiếc lều là nơi Đức Chúa Trời gặp gỡ theo sự định liệu. “Lều Hội Kiến” là cách gọi trang trọng, gọn và quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nguyên tính mệnh lệnh trực tiếp; thuật ngữ “hội chúng” bảo lưu sắc thái cộng đồng nghi lễ mà không gán thêm nét nghĩa giáo phái.
