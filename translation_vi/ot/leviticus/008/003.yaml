  rationale: 'Chỉ sửa chú thích từ vựng: thay «đại hội», vốn thường chỉ một sự kiện, bằng «đoàn hội», vốn có thể chỉ tập thể được quy tụ. Nội dung câu và vị trí ký hiệu chú thích được giữ nguyên.'
