    rationale: Nguồn tiếng Hê-bơ-rơ dùng trực tiếp יהוה, và vết kiểm toán tiếng Anh chỉ rõ quyết định dự án là «Yahweh». «Giê-hô-va» là một quy ước phiên âm khác, không nhất quán với quyết định này.
  - severity: low
