  terminology: Giữ «A-rôn», «Môi-se», «các con trai ông» và «mọi điều». Đổi danh YHWH sang «Yahweh» để phù hợp với chính sách thuật ngữ đã nêu; không dùng tước hiệu thay cho danh riêng.
  issues:
