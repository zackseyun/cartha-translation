base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/036.yaml
  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: vi
  text: A-rôn và các con trai ông đã làm mọi điều mà Yahweh đã truyền qua Môi-se.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “bởi tay Môi-se,” một thành ngữ có nghĩa là “qua Môi-se” hoặc “do Môi-se làm trung gian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: đã làm
  rationale: Động từ עשה ở đây tóm lược việc vâng theo các chỉ thị; “đã làm” tự nhiên, trực tiếp và phù hợp với tân ngữ “mọi điều”.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: וּבָנָיו
  choice: và các con trai ông
  rationale: בנים trong bối cảnh chức tế lễ chỉ các con trai của A-rôn; cách dịch này giữ chính xác giới tính và quan hệ sở hữu.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: mọi điều
  rationale: דברים có thể là lời, sự việc hoặc điều; trong ngữ cảnh thi hành các mệnh lệnh nghi lễ, “mọi điều” vừa tự nhiên vừa giữ được phạm vi bao quát của nguyên ngữ.
- source_word: צִוָּה
  choice: truyền
  rationale: Trong cấu trúc tiếng Việt, “đã làm mọi điều ... truyền” diễn đạt tự nhiên rằng mệnh lệnh có trước sự vâng phục mà không cần đánh dấu thì quá khứ hoàn thành.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng Việt hóa quen thuộc, trang trọng của danh YHWH.
- source_word: בְּיַד מֹשֶׁה
  choice: qua Môi-se
  rationale: Thành ngữ nguyên văn “bởi tay Môi-se” chỉ phương tiện hoặc vai trò trung gian; “qua Môi-se” truyền đạt rõ nghĩa ấy trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu; chọn dạng Việt hóa quen thuộc “Đức Giê-hô-va” thay vì dạng phiên âm quốc tế “Yahweh”.
- issue: Vai trò của Môi-se trong cụm בְּיַד מֹשֶׁה
  choice: qua Môi-se
  alternative: bởi tay Môi-se; do Môi-se
  rationale: Cách dịch này giữ ý Đức Giê-hô-va là nguồn ban lệnh và Môi-se là người trung gian truyền đạt, nhưng không mở rộng thành một khẳng định thần học ngoài câu.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu với độc giả Việt Nam hiện đại. Dùng “mọi điều” thay cho “mọi lời” vì câu nhấn mạnh việc thực hiện các chỉ thị nghi lễ. Dấu chú thích [a] được đặt ngay sau cụm liên quan.
