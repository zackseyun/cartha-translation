id: LEV.8.17
reference: Leviticus 8:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶת הַ/פָּ֤ר וְ/אֶת עֹר/וֹ֙ וְ/אֶת בְּשָׂר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Còn con bò đực, cùng với da[a], thịt và phân[b] của nó, ông đem đốt bằng lửa ở ngoài trại, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “bộ da”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ chỉ cụ thể phân hoặc chất bài tiết, không phải chất thải nói chung.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַפָּר
  choice: con bò đực
  rationale: פַּר chỉ bò đực, có thể là bò đực non. Bản văn câu này không gọi rõ nó là lễ vật chuộc tội, nên không thêm ý đó.
- source_word: עֹרוֹ
  choice: da của nó
  rationale: עוֹר là da hoặc bộ da của con vật; “da” tự nhiên và chính xác trong tiếng Việt.
- source_word: בְּשָׂרוֹ
  choice: thịt của nó
  rationale: בָּשָׂר ở đây chỉ phần thịt của con vật; “thịt” tự nhiên hơn “xác thịt” trong ngữ cảnh này.
- source_word: פִּרְשׁוֹ
  choice: phân của nó
  rationale: פֶּרֶשׁ chỉ cụ thể phân hoặc chất bài tiết, không phải rác hay nội tạng nói chung.
- source_word: שָׂרַף בָּאֵשׁ
  choice: đem đốt bằng lửa
  rationale: Giữ cả động từ “đốt” và cụm “bằng lửa” của tiếng Hê-bơ-rơ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ở ngoài trại
  rationale: Cách dịch trực tiếp, rõ ràng cho vị trí bên ngoài khu trại của dân Israel.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: đúng như ... đã truyền
  rationale: Diễn tả sự làm theo hoàn toàn phù hợp với mệnh lệnh đã ban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: cùng với da, thịt và phân của nó
  rationale: Truyền đạt sức tích lũy của chuỗi liên từ và dấu chỉ tân ngữ bằng một danh sách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn danh ấy mà không thay bằng tước hiệu.
- issue: Có gọi con bò là lễ vật chuộc tội hay không
  choice: Không thêm cụm “của lễ chuộc tội”
  alternative: con bò đực dùng làm lễ vật chuộc tội
  rationale: Ngữ cảnh trước đó xác định chức năng của con bò, nhưng chính câu này chỉ nói הַפָּר, “con bò đực”; không đưa phần giải thích theo ngữ cảnh vào lời câu.
- issue: Chủ thể của động từ שָׂרַף
  choice: ông
  alternative: Môi-se
  rationale: Tiếng Hê-bơ-rơ chỉ thể ngôi thứ ba số ít “ông/người ấy”, rồi mới nhắc tên Môi-se trong mệnh đề cuối. Giữ đại từ tránh làm rõ quá mức điều nguyên văn để hàm ẩn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đem đốt bằng lửa” để giữ sắc thái cụ thể của nguyên văn; dùng “ông” nhằm bảo tồn chủ thể hàm ẩn trong động từ Hê-bơ-rơ. Các dấu chú thích [a], [b] được đặt ngay sau những từ liên quan, sửa sự lệch vị trí dấu chú thích trong lớp tham khảo tiếng Anh.
