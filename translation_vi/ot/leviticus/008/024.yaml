revisions:
- from: Rồi ông đưa các con trai A-rôn đến gần. Môi-se bôi một ít máu lên dái tai phải, ngón cái bàn tay phải và ngón cái bàn chân phải của họ. Sau đó, Môi-se hắt máu lên quanh bàn thờ.
  to: Rồi Môi-se đưa các con trai A-rôn đến gần. Môi-se bôi một ít máu lên dái tai phải, ngón cái bàn tay phải và ngón cái bàn chân phải của họ. Sau đó, Môi-se hắt máu lên bàn thờ, chung quanh.
  rationale: Chỉnh sửa tối thiểu để xác định rõ chủ ngữ ở câu đầu và làm rõ rằng hành động hắt máu nhắm vào bàn thờ ở mọi phía quanh đó. Không thêm diễn giải về ý nghĩa nghi thức.
  reviewer_model: gpt-5.6-terra
