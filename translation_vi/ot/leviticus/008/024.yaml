base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: vi
  text: Rồi Môi-se đưa các con trai A-rôn đến gần. Môi-se bôi một ít máu lên dái tai phải, ngón cái bàn tay phải và ngón cái bàn chân phải của họ. Sau đó, Môi-se hắt máu lên bàn thờ, chung quanh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: đưa ... đến gần
  rationale: Giữ nghĩa Híp-ri căn bản là khiến ai đó đến gần, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: תְּנוּךְ
  choice: dái tai
  rationale: Chỉ phần dưới mềm của vành tai; đây là cách gọi phổ thông, rõ nghĩa.
- source_word: בֹּהֶן
  choice: ngón cái
  rationale: Theo ngữ cảnh, từ này chỉ ngón cái của bàn tay và ngón cái của bàn chân.
- source_word: וַיִּזְרֹק
  choice: hắt
  rationale: Động từ chỉ hành động ném/hắt chất lỏng; “hắt máu lên” tự nhiên và vẫn giữ sắc thái chủ động mạnh hơn “rảy”.
- source_word: סָבִיב
  choice: quanh
  rationale: Diễn đạt việc máu được hắt lên các phía quanh bàn thờ.
