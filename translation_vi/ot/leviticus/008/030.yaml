source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: vi
  text: Môi-se lấy một ít dầu xức và một ít huyết ở trên bàn thờ, rồi rảy dầu và huyết ấy lên A-rôn, lên y phục của ông, lên các con trai ông và lên y phục của các con trai ông đang ở cùng ông. Như vậy, Môi-se thánh hiến A-rôn, y phục của ông, các con trai ông và y phục của các con trai ông đang ở cùng ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... מִן
  choice: lấy một ít
  rationale: Động từ có hai bổ ngữ với מִן, biểu thị Môi-se lấy một phần dầu và một phần huyết, không phải toàn bộ.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: một ít dầu xức
  rationale: “Dầu xức” là cách diễn đạt tự nhiên, ngắn gọn trong tiếng Việt và giữ được ý nghĩa nghi lễ của מִשְׁחָה.
- source_word: וּמִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: và một ít huyết trên bàn thờ
  rationale: Giữ ý lấy một phần huyết; mệnh đề quan hệ được rút gọn tự nhiên trong tiếng Việt mà không thay đổi quan hệ định vị.
- source_word: וַיַּז
  choice: rồi rảy
  rationale: Dạng Hiphil của נזה trong nghi lễ tư tế chỉ hành động rảy chất lỏng; “rảy” là thuật ngữ tiếng Việt rõ ràng và phù hợp.
- source_word: בְּגָדָיו
  choice: y phục ông
  rationale: “Y phục” trang trọng và phù hợp bối cảnh nghi lễ hơn “quần áo”, nhưng không diễn giải quá mức như “lễ phục tư tế”.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Giữ chính xác giống đực số nhiều của nguyên văn và đối tượng là các con trai của A-rôn tham dự lễ phong chức.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: y phục của các con trai đang ở cùng ông
  rationale: אִתּוֹ tự nhiên nhất là bổ nghĩa cho các con trai; “đang ở cùng ông” làm rõ quan hệ cú pháp mà không thêm nội dung.
- source_word: וַיְקַדֵּשׁ
  choice: Như vậy, ông biệt thánh
  rationale: Trong bối cảnh lập chức tư tế, קדשׁ có nghĩa đặt riêng ra làm thánh cho sự phục vụ thánh. “Biệt thánh” bảo toàn ý niệm thánh khiết và hành động nghi lễ.
theological_decisions:
- issue: Cách dịch קדשׁ trong nghi lễ lập chức tư tế
  choice: biệt thánh
  alternative: thánh hóa; làm cho nên thánh
  rationale: “Biệt thánh” diễn tả việc đặt riêng A-rôn, các con trai và y phục của họ cho chức vụ thánh, đồng thời không áp đặt phạm trù thần học về sự biến đổi đạo đức.
- issue: Cách gọi hậu duệ của A-rôn
  choice: các con trai ông
  alternative: các con ông
  rationale: Nguyên văn dùng danh từ giống đực số nhiều và bối cảnh nói cụ thể đến những người nam được lập làm tư tế.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng tên riêng “Môi-se”, “A-rôn”; dùng “huyết” và “biệt thánh” để giữ sắc thái nghi lễ. Không đặt chú thích vì bản văn Hê-bơ-rơ không có biến thể cần thiết phải ghi chú; chú thích tiếng Anh được cung cấp dường như không tương ứng đúng vị trí hoặc nội dung của dấu chú thích.
