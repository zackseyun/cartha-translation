- from: Môi-se lấy một ít dầu xức và một ít huyết trên bàn thờ, rồi rảy trên A-rôn, trên y phục ông, trên các con trai ông và trên y phục của các con trai đang ở cùng ông. Như vậy, ông biệt thánh A-rôn, y phục ông, các con trai ông và y phục của các con trai đang ở cùng ông.
  to: Môi-se lấy một ít dầu xức và một ít huyết ở trên bàn thờ, rồi rảy dầu và huyết ấy lên A-rôn, lên y phục của ông, lên các con trai ông và lên y phục của các con trai ông đang ở cùng ông. Như vậy, Môi-se thánh hiến A-rôn, y phục của ông, các con trai ông và y phục của các con trai ông đang ở cùng ông.
  rationale: 'Bản sửa dùng thuật ngữ hiện đại và trang trọng hơn cho קדשׁ, làm rõ chất được rảy và quan hệ «ở trên bàn thờ», đồng thời duy trì đầy đủ danh sách lặp lại trong tiếng Hê-bơ-rơ. Không cần chú thích tiếng Việt: chú thích trong vệt kiểm tra tiếng Anh là một phương án dịch cho «consecrated/sanctified», nhưng vị trí neo của nó trong tiếng Anh không tương ứng với nội dung và không đòi hỏi chú thích trong bản tiếng Việt.'
