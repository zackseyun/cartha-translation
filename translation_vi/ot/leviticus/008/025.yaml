base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: vi
  text: Rồi ông lấy mỡ, đuôi mỡ, tất cả mỡ bao quanh nội tạng, phần phụ của gan,[a] hai quả thận cùng mỡ của chúng, và đùi phải.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thùy gan”. Từ Hê-bơ-rơ chỉ một bộ phận cụ thể được lấy ra trong nghi thức dâng sinh tế.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Rồi ông lấy
  rationale: Dạng waw liên tiếp đẩy câu chuyện sang hành động kế tiếp; “Rồi ông lấy” tự nhiên trong tiếng Việt và giữ được trình tự.
- source_word: הַחֵלֶב
  choice: phần mỡ
  rationale: Đây là thuật ngữ chỉ những phần mỡ dành riêng trong nghi thức dâng sinh tế; thêm “phần” giúp diễn đạt rõ đây là phần được lấy ra.
- source_word: הָאַלְיָה
  choice: cái đuôi mỡ
  rationale: Chỉ chiếc đuôi tích nhiều mỡ của giống cừu dùng trong nghi thức, không chỉ là đuôi nói chung.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: tất cả mỡ bọc nội tạng
  rationale: קֶרֶב trong ngữ cảnh giải phẫu sinh tế chỉ các cơ quan bên trong; “mỡ bọc nội tạng” vừa cụ thể vừa tự nhiên.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: phần phụ của gan
  rationale: Thuật ngữ chỉ một bộ phận cụ thể gắn với gan được lấy ra trong thủ tục dâng sinh tế. “Phần phụ” giữ được độ khái quát của từ Hê-bơ-rơ hơn là xác định chắc chắn đó là một thùy gan.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: hai quả thận
  rationale: Tương đương giải phẫu trực tiếp và tự nhiên trong tiếng Việt.
- source_word: חֶלְבְּהֶן
  choice: cùng với mỡ của chúng
  rationale: Giữ rõ quan hệ sở hữu giữa hai quả thận và phần mỡ đi kèm.
- source_word: שׁוֹק הַיָּמִין
  choice: đùi phải
  rationale: שׁוֹק chỉ phần chân trên trong ngữ cảnh pha thịt sinh tế; “đùi” chính xác hơn từ rộng nghĩa “chân”.
