  source_fidelity: 'Cần sửa “con chiên” thành “con chiên đực”: con vật được nói đến trong ngữ cảnh trực tiếp (Lv 8:18–19) là chiên đực dùng làm tế lễ toàn thiêu. Bản dịch giữ đúng trình tự hành động và diễn đạt thích hợp động từ זָרַק bằng “hắt”; “chung quanh” phản ánh סָבִיב.'
  naturalness: Câu sửa vẫn hiện đại, trang trọng và tự nhiên. Nêu rõ A-rôn giúp tránh đại từ “ông” thiếu điểm quy chiếu khi câu được đọc tách riêng.
  terminology: “Chiên đực,” “huyết,” “bàn thờ,” và “Môi-se” phù hợp với cách dùng Kinh Thánh tiếng Việt. “Hắt huyết lên bàn thờ chung quanh” tránh nhầm với hành động “rảy” nhẹ.
  issues:
