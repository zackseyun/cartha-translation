    rationale: Chủ thể ngầm trong tiếng Hê-bơ-rơ là A-rôn theo câu trước. Dùng “A-rôn” làm câu rõ ràng hơn mà không đổi nghĩa.
  revised_text: A-rôn giết con chiên đực, rồi Môi-se hắt huyết lên bàn thờ chung quanh.[a]
