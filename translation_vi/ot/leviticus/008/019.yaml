  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: vi
  text: A-rôn giết con chiên đực, rồi Môi-se hắt huyết lên bàn thờ chung quanh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hắt huyết lên mọi phía của bàn thờ.” Động từ Hê-bơ-rơ chỉ một động tác mạnh khi đưa huyết tế lễ lên bàn thờ, chứ không phải rảy nhẹ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Ông giết con chiên
  rationale: Động từ שׁחט trong ngữ cảnh tế lễ chỉ việc giết con vật hiến tế. Tiếng Việt cần nêu bổ ngữ; “con chiên” được bổ sung từ câu trước.
- source_word: וַיִּזְרֹק
  choice: hắt
  rationale: Động từ זרק diễn tả việc đưa huyết lên bàn thờ bằng một động tác mạnh; “hắt” tự nhiên trong tiếng Việt và tránh sắc thái nhẹ của “rảy”.
- source_word: הַדָּם
  choice: huyết
  rationale: “Huyết” là cách gọi trang trọng, quen thuộc trong ngữ cảnh tế lễ, đồng thời tương ứng với danh từ xác định “máu ấy” trong tiếng Hê-bơ-rơ.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Cách dịch tiêu chuẩn và tự nhiên của מִזְבֵּחַ trong ngữ cảnh tế lễ.
- source_word: סָבִיב
  choice: khắp các phía
  rationale: Diễn đạt ý phân bố quanh các mặt hoặc chu vi của bàn thờ, không chỉ tại một điểm.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Phiên âm tên riêng theo cách dùng tiếng Việt phổ biến trong văn bản Kinh Thánh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” nối với A-rôn là chủ thể được ngầm hiểu từ văn cảnh; “con chiên” làm rõ tân ngữ được lược trong tiếng Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
