base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: vi
  text: Như điều đã được làm hôm nay[a], Đức Giê-hô-va đã truyền phải làm như thế để làm lễ chuộc tội cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Như đã làm trong ngày hôm nay, Đức Giê-hô-va đã truyền phải làm như thế để làm lễ chuộc tội cho anh em.”'
    reason: Cú pháp Hê-bơ-rơ cho phép diễn đạt mệnh đề so sánh gần với hình thức nguyên văn hơn; chủ thể của “đã làm” không được nêu rõ.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Đúng như
  rationale: Giữ lực so sánh với các nghi thức vừa được cử hành, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: עָשָׂה
  choice: việc đã làm
  rationale: Động từ hình thái ngôi ba số ít nhưng tác nhân không được nêu; cách diễn đạt phiếm chỉ tránh tự ý xác định chủ thể.
- source_word: בַּיּוֹם הַזֶּה
  choice: hôm nay
  rationale: Diễn đạt tự nhiên cụm thời gian chỉ chính ngày đang diễn ra nghi lễ.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Thể hoàn thành chỉ mệnh lệnh đã được ban và đang chi phối nghi thức hiện tại.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: לַעֲשֹׂת
  choice: phải làm như vậy
  rationale: Giữ sự lặp lại của động từ עשה và truyền đạt lực mệnh lệnh mà không buộc phải nêu tác nhân.
- source_word: לְכַפֵּר
  choice: để làm lễ chuộc tội
  rationale: Trong ngữ cảnh nghi lễ tế lễ, cách dịch này giữ nghĩa chuyên biệt của כפר nhưng vẫn dễ hiểu đối với độc giả phổ thông.
- source_word: עֲלֵיכֶם
  choice: cho anh em
  rationale: Với כפר, giới từ על có nghĩa vì lợi ích hoặc thay mặt; “cho anh em” ngắn gọn và tự nhiên.
theological_decisions:
- issue: Ý nghĩa của כפר trong bối cảnh tế lễ
  choice: làm lễ chuộc tội cho anh em
  alternative: chuộc tội cho anh em; làm lễ xá tội cho anh em
  rationale: “Làm lễ chuộc tội” bảo toàn sắc thái nghi lễ-tế tự và không thu hẹp cơ chế thần học thành riêng sự xoa dịu hay tẩy sạch.
- issue: Chủ thể của עָשָׂה và לַעֲשֹׂת
  choice: 'diễn đạt phiếm chỉ: “việc đã làm… phải làm”'
  alternative: “Ngài đã làm… phải làm”; “Môi-se đã làm… phải làm”
  rationale: Bản Hê-bơ-rơ không nêu rõ chủ thể trong câu này; không nên tự ý đồng nhất chủ thể với Đức Chúa Trời hay Môi-se.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” phù hợp lời Môi-se nói với A-rôn cùng các con trai ông; “làm lễ chuộc tội” giữ sắc thái nghi lễ của phân đoạn.
