source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: vi
  text: Anh em không được ra khỏi cửa Lều Hội Kiến trong bảy ngày, cho đến khi những ngày phong chức cho anh em hoàn tất, vì sẽ làm đầy tay anh em[a] trong bảy ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “làm đầy tay anh em”, một thành ngữ Hê-bơ-rơ chỉ việc phong chức hoặc lập vào chức vụ tư tế.'
    reason: Giải thích thành ngữ kỹ thuật được giữ lại trong chính văn.
lexical_decisions:
- source_word: וּמִפֶּתַח אֹהֶל מוֹעֵד
  choice: khỏi lối vào Lều Hội Kiến
  rationale: Giữ nghĩa không gian của פֶּתַח là “lối vào” và dịch אֹהֶל מוֹעֵד bằng danh xưng trong sáng, sát cấu tạo Hê-bơ-rơ là “Lều Hội Kiến”.
- source_word: לֹא תֵצְאוּ שִׁבְעַת יָמִים
  choice: không được ra ... trong suốt bảy ngày
  rationale: “Không được” truyền đạt rõ lực cấm đoán; “trong suốt” diễn tả tự nhiên khoảng thời gian liên tục của שִׁבְעַת יָמִים.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: cho đến ngày mãn thời gian làm lễ lập chức cho anh em
  rationale: “Mãn thời gian” diễn đạt ý hoàn tất của מלאת và tránh lối lặp cứng “ngày các ngày”; מִלֻּאִים trong ngữ cảnh tư tế được thể hiện bằng “lễ lập chức”.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: người sẽ làm đầy tay anh em
  rationale: Giữ nguyên hình ảnh kỹ thuật “làm đầy tay” của nguyên văn thay vì hoàn toàn thay bằng lời giải nghĩa; đại từ “người” không xác định thêm chủ thể vốn không được nêu rõ trong câu Hê-bơ-rơ.
theological_decisions:
- issue: Thành ngữ tư tế מלא את־יד
  choice: Giữ “làm đầy tay” trong chính văn và giải thích bằng chú thích.
  alternative: lập chức cho anh em; phong chức cho anh em; biệt riêng anh em
  rationale: Cách dịch này bảo tồn mối liên hệ từ vựng giữa nghi thức lập chức và hình ảnh đặc thù của nguyên văn, nhưng chú thích vẫn giúp độc giả hiểu ý nghĩa trong ngữ cảnh.
- issue: Chủ thể của יְמַלֵּא
  choice: Dùng “người” viết thường, không xác định rõ là Đức Chúa Trời hay Môi-se.
  alternative: Đức Chúa Trời sẽ; Môi-se sẽ; dạng bị động không nêu tác nhân
  rationale: Động từ Hê-bơ-rơ ở ngôi thứ ba số ít nhưng câu này không nêu danh tính chủ thể; bản dịch không nên âm thầm giải quyết điểm mơ hồ ấy.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Anh em” phù hợp với lời Môi-se nói với A-rôn cùng các con trai ông; “Lều Hội Kiến” được dùng nhất quán như danh xưng nơi thánh. Cấu trúc hơi khác thường “làm đầy tay” được chủ ý giữ lại và có chú thích.
