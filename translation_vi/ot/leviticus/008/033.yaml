revisions:
- from: Anh em không được ra khỏi lối vào Lều Hội Kiến trong suốt bảy ngày, cho đến ngày mãn thời gian làm lễ lập chức cho anh em, vì người sẽ làm đầy tay anh em[a] trong bảy ngày.
  to: Anh em không được ra khỏi cửa Lều Hội Kiến trong bảy ngày, cho đến khi những ngày phong chức cho anh em hoàn tất, vì sẽ làm đầy tay anh em[a] trong bảy ngày.
  rationale: 'Bản sửa thay những cách diễn đạt chưa tự nhiên bằng tiếng Việt hiện đại hơn, đồng thời giữ nguyên các yếu tố quan trọng của nguyên văn: lệnh cấm kéo dài bảy ngày, sự hoàn tất của các ngày phong chức, và thành ngữ “làm đầy tay”. Chủ thể không được nêu tên của động từ cuối được bảo toàn bằng cách lược chủ ngữ, không áp đặt một cách giải thích thần học hay nhân vật cụ thể.'
