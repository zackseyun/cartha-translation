  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: vi
  text: Bấy giờ, Môi-se lấy các phần lễ vật ấy khỏi lòng bàn tay họ rồi đốt cho bốc khói trên bàn thờ, bên trên lễ vật toàn thiêu. Các lễ vật ấy là lễ vật phong chức[a], tỏa hương thơm đẹp lòng Đức Giê-hô-va; là lễ vật dùng lửa dâng lên Đức Giê-hô-va[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thánh hiến”. Từ Hê-bơ-rơ מִלֻּאִים là thuật ngữ chỉ lễ vật dùng trong nghi thức thiết lập các thầy tế lễ vào chức vụ.
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách hiểu khác: “lễ vật làm thức ăn”. Từ Hê-bơ-rơ אִשֶּׁה là một thuật ngữ chuyên biệt về tế lễ, thường chỉ lễ vật được đốt trên bàn thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֹתָם מֵעַל כַּפֵּיהֶם
  choice: lấy các phần lễ vật ấy khỏi lòng bàn tay họ
  rationale: Đại từ אֹתָם chỉ các phần lễ vật đã được đặt vào tay A-rôn và các con trai ông ở câu trước. “Lòng bàn tay” phản ánh cụ thể כַּפִּים, còn “các phần lễ vật ấy” làm rõ sở chỉ trong tiếng Việt.
- source_word: וַיַּקְטֵר
  choice: đốt cho bốc khói
  rationale: Dạng Hiphil của קטר trong nghi lễ tế lễ diễn tả việc làm cho lễ vật cháy và bốc khói trên bàn thờ; cách dịch này chính xác hơn từ “thiêu” đơn thuần.
- source_word: הַמִּזְבֵּחָה עַל הָעֹלָה
  choice: trên bàn thờ, bên trên lễ vật toàn thiêu
  rationale: Hướng cách הַמִּזְבֵּחָה nêu nơi diễn ra hành động, còn עַל thường mang nghĩa “trên/bên trên”; bản dịch giữ cả hai quan hệ không gian.
- source_word: מִלֻּאִים
  choice: lễ vật phong chức
  rationale: Đây là thuật ngữ kỹ thuật chỉ lễ vật trong nghi thức thiết lập các thầy tế lễ, theo ý niệm “làm đầy tay”. “Phong chức” tự nhiên trong tiếng Việt và diễn đạt chức năng nghi lễ mà không gắn với cơ cấu giáo hội về sau.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: tỏa hương thơm đẹp lòng Đức Giê-hô-va
  rationale: Thành ngữ tế lễ này nói đến hương thơm được Đức Chúa Trời vui nhận. “Đẹp lòng” diễn đạt sắc thái chấp nhận, thay vì chỉ mô tả mùi hương theo nghĩa vật lý.
- source_word: אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Đây là thuật ngữ tế lễ khó xác định hoàn toàn về từ nguyên; cách dịch truyền thống “dâng bằng lửa” giữ mối liên hệ bề mặt với אֵשׁ và phù hợp với hành động đốt cho bốc khói trong câu.
- source_word: לַיהוָה
  choice: lên Ngài / Đức Giê-hô-va
  rationale: Danh riêng יהוה được chuyển tự theo dạng quen thuộc trong tiếng Việt là “Đức Giê-hô-va”. Đại từ “Ngài” ở vế cuối tránh lặp nặng nề nhưng vẫn chỉ rõ cùng một Đấng.
theological_decisions:
- issue: Ý nghĩa của מִלֻּאִים trong nghi thức thiết lập chức tế lễ
  choice: lễ vật phong chức
  alternative: lễ vật thánh hiến
  rationale: Ngữ cảnh là lễ thiết lập A-rôn và các con trai vào chức tế lễ. “Phong chức” nêu rõ chức năng cụ thể, trong khi chú thích bảo tồn cách hiểu rộng hơn là “thánh hiến”.
- issue: Cách diễn đạt אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật làm thức ăn dâng lên Đức Chúa Trời
  rationale: Từ Hê-bơ-rơ là thuật ngữ tế lễ có cách giải thích khác nhau. Bản chính giữ hình ảnh lửa rõ trong ngữ cảnh; chú thích ghi nhận cách dịch nhấn mạnh lễ vật như thức ăn trên bàn thờ mà không khẳng định dứt khoát từ nguyên.
- issue: Chủ thể vui nhận trong לְרֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng Đức Giê-hô-va
  alternative: hương thơm dễ chịu
  rationale: Thành ngữ trong văn liệu tế lễ biểu thị sự vui nhận của Đức Chúa Trời. Cách dịch vẫn giữ hình ảnh hương thơm, đồng thời tránh để câu chỉ còn là nhận xét về mùi.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Môi-se”, “bàn thờ”, “lễ vật toàn thiêu” và “Đức Giê-hô-va” dùng dạng quen thuộc với độc giả Kinh Thánh tiếng Việt. Câu giữ trình tự nghi lễ của nguyên văn, đồng thời thêm “các phần lễ vật” để đại từ số nhiều tự nhiên và rõ nghĩa trong tiếng Việt.
