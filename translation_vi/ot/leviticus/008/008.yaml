id: LEV.8.8
reference: Leviticus 8:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם עָלָ֖י/ו אֶת הַ/חֹ֑שֶׁן וַ/יִּתֵּן֙ אֶל הַ/חֹ֔שֶׁן אֶת הָ/אוּרִ֖ים וְ/אֶת הַ/תֻּמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: vi
  text: Ông đặt bảng đeo ngực lên A-rôn[a], rồi đặt U-rim và Thu-mim vào trong bảng đeo ngực[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “lên ông”; trong mạch văn, người được nói đến là A-rôn.'
    reason: referent_clarification
  - marker: b
    text: “U-rim” và “Thu-mim” là các thuật ngữ nghi lễ Hê-bơ-rơ được phiên âm; hình dạng và cách sử dụng chính xác của chúng không được biết chắc.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: đặt
  rationale: Động từ שׂוּם mang nghĩa đặt, để; “đặt” tự nhiên trong ngữ cảnh mặc lễ phục và không cường điệu khác biệt với động từ נָתַן theo sau.
- source_word: עָלָיו
  choice: lên A-rôn
  rationale: Đại từ chỉ người trong tiếng Hê-bơ-rơ quy chiếu về A-rôn trong mạch văn. Nêu tên giúp câu tiếng Việt rõ ràng mà không thay đổi đối tượng.
- source_word: הַחֹשֶׁן
  choice: bảng đeo ngực
  rationale: חֹשֶׁן là vật dụng nghi lễ đeo trước ngực của thầy tế lễ thượng phẩm. “Bảng đeo ngực” tránh gợi ý đây là áo giáp và phù hợp với chức năng chứa U-rim và Thu-mim.
- source_word: וַיִּתֵּן
  choice: đặt
  rationale: נָתַן có thể mang nghĩa cho, đặt, để. Ở đây vật được đưa vào bảng đeo ngực, nên “đặt” phù hợp với ngữ cảnh.
- source_word: אֶל הַחֹשֶׁן
  choice: vào trong bảng đeo ngực
  rationale: Dù אֶל thường có nghĩa “đến, tới”, trong ngữ cảnh này nó diễn tả việc đưa các vật vào bên trong bảng đeo ngực; cách dịch này tự nhiên và làm rõ quan hệ không gian.
- source_word: הָאוּרִים
  choice: U-rim
  rationale: Đây là thuật ngữ nghi lễ Hê-bơ-rơ có hình dạng và cách sử dụng không chắc chắn; phiên âm bảo toàn tên gọi mà không áp đặt nghĩa suy đoán như “ánh sáng”.
- source_word: הַתֻּמִּים
  choice: Thu-mim
  rationale: Đây là thuật ngữ nghi lễ đi đôi với U-rim. Phiên âm giữ nguyên tính đặc thù và tránh cách giải nghĩa còn tranh luận như “sự trọn vẹn”.
theological_decisions:
- issue: Cách dịch אוּרִים וְתֻּמִּים, các vật dùng trong nghi lễ thầy tế lễ
  choice: Phiên âm là “U-rim và Thu-mim”
  alternative: “ánh sáng và sự trọn vẹn” hoặc “các thẻ xin ý thiêng”
  rationale: Bản văn gọi tên các vật này nhưng không giải thích chính xác hình dạng hay phương thức sử dụng. Phiên âm giữ nguyên tính cụ thể và sự bất định của nguyên văn, không đưa một cách giải thích còn tranh luận vào chính văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “bảng đeo ngực” thay vì “bảng đeo trước ngực” để gọn câu, đồng thời tránh từ ngữ gợi áo giáp. Tên A-rôn và các thuật ngữ U-rim, Thu-mim được viết theo lối phiên âm quen thuộc trong tiếng Việt.
