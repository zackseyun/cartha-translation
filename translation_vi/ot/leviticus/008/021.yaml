id: LEV.8.21
reference: Leviticus 8:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶת הַ/קֶּ֥רֶב וְ/אֶת הַ/כְּרָעַ֖יִם רָחַ֣ץ בַּ/מָּ֑יִם וַ/יַּקְטֵר֩ מֹשֶׁ֨ה אֶת כָּל הָ/אַ֜יִל הַ/מִּזְבֵּ֗חָ/ה עֹלָ֨ה ה֤וּא לְ/רֵֽיחַ נִיחֹ֨חַ֙ אִשֶּׁ֥ה הוּא֙ לַ/יהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Ông rửa bộ lòng và các chân bằng nước. Rồi Môi-se thiêu cả con cừu đực trên bàn thờ. Đó là lễ toàn thiêu, có hương thơm đẹp lòng Yahweh, là lễ vật dâng bằng lửa[a] lên Yahweh, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật dùng làm thức ăn dâng lên Yahweh.”
    reason: Bảo lưu cách hiểu khác của thuật ngữ tế lễ אִשֶּׁה, vốn có thể nhấn mạnh việc dâng qua lửa hoặc chức năng lễ vật như thức ăn trên bàn thờ.
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: bộ lòng
  rationale: Chỉ các phần bên trong của con vật hiến tế; “bộ lòng” cụ thể, tự nhiên và phù hợp với ngữ cảnh nghi lễ.
- source_word: הַכְּרָעַיִם
  choice: các chân
  rationale: Chỉ các chi, nhất là phần chân dưới, của con vật; “các chân” rõ ràng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: רָחַץ בַּמָּיִם
  choice: rửa ... bằng nước
  rationale: Giữ nguyên cả động tác rửa lẫn phương tiện được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: וַיַּקְטֵר
  choice: thiêu
  rationale: Trong văn cảnh tế lễ, động từ chỉ việc đốt lễ vật trên bàn thờ cho bốc khói; “thiêu” tự nhiên hơn một cách diễn đạt dài nhưng vẫn giữ sắc thái nghi lễ.
- source_word: כָּל הָאַיִל
  choice: cả con cừu đực
  rationale: Diễn đạt rõ toàn bộ con vật được dâng, đồng thời nhận diện chính xác אַיִל là cừu đực.
- source_word: עֹלָה
  choice: lễ vật thiêu
  rationale: Thuật ngữ tế lễ chỉ lễ vật được thiêu trọn trên bàn thờ; cách dịch này ngắn gọn và quen thuộc.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: tỏa hương thơm làm đẹp lòng
  rationale: Giữ hình ảnh khứu giác và ý nghĩa lễ vật được chấp nhận, không giải thích quá mức bản chất của hình ảnh.
- source_word: אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Phản ánh trực tiếp loại lễ vật được dâng qua lửa; cách hiểu “lễ vật dùng làm thức ăn” được ghi ở chú thích vì từ này và bối cảnh tế lễ cho phép cách diễn đạt ấy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: “Đúng như” làm nổi bật sự tương ứng chính xác giữa mệnh lệnh và việc thực hiện; thì quá khứ phù hợp mạch kể chuyện.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Cụm tế lễ לְרֵיחַ נִיחֹחַ
  choice: tỏa hương thơm làm đẹp lòng Yahweh
  alternative: có hương thơm êm dịu dâng lên Yahweh
  rationale: Cách chọn giữ nguyên ẩn dụ về hương thơm và ý niệm đẹp lòng, nhưng không biến ẩn dụ thành một khẳng định thô về khứu giác của Đức Chúa Trời.
- issue: Ý nghĩa của אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật dùng làm thức ăn
  rationale: “Dâng bằng lửa” bám sát hình thức hiến tế trong câu và tránh quyết định dứt khoát rằng từ này phải được hiểu là thức ăn của Đức Chúa Trời; cách hiểu còn lại được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “ông” để nối chủ ngữ Môi-se từ văn cảnh trước mà không thêm danh tính vào vế đầu; dùng “rồi” để làm rõ diễn tiến kể chuyện. Các thuật ngữ tế lễ được giữ nhất quán và cụ thể.
