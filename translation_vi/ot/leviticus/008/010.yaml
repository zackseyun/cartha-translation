  to: Sau đó, Môi-se lấy dầu xức, xức Đền Tạm và mọi vật ở trong đó, rồi thánh hiến chúng[a].
  rationale: Bản sửa thay cách nói gượng “biệt chúng ra thánh” bằng “thánh hiến chúng,” một thuật ngữ tiếng Việt tự nhiên và chính xác cho קדשׁ trong nghi lễ tư tế. Đồng thời bỏ “cho” sau “xức” để câu gọn, tự nhiên hơn, không thay đổi nghĩa hay phạm vi quy chiếu số nhiều của “chúng.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:44:40Z'
