base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: vi
  text: Sau đó, Môi-se lấy dầu xức, xức Đền Tạm và mọi vật ở trong đó, rồi thánh hiến chúng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thánh hóa chúng” hoặc “làm cho chúng nên thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Sau đó, Môi-se lấy
  rationale: Dạng wayyiqtol tiếp nối trình tự câu chuyện; “Sau đó” diễn đạt tự nhiên sự kế tiếp, còn “lấy” giữ nghĩa đơn giản của động từ.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Cụm sở thuộc chỉ loại dầu dùng để xức trong nghi lễ. “Dầu xức” ngắn gọn, tự nhiên và không thêm ý “thánh” vốn không được nói rõ trong cụm này.
- source_word: וַיִּמְשַׁח
  choice: xức
  rationale: Đây là động từ nghi lễ chỉ việc dùng dầu để biệt riêng; “xức” giữ được cả hành động cụ thể lẫn sắc thái thờ phượng.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ quen dùng trong tiếng Việt cho nơi thánh lưu động trong Xuất Ê-díp-tô Ký và Lê-vi Ký; chữ viết hoa đánh dấu tên gọi chuyên biệt.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: mọi vật ở trong đó
  rationale: Cụm từ bao gồm toàn bộ đồ vật và vật dụng thuộc Đền Tạm; “mọi vật ở trong đó” rõ nghĩa và sát nguyên văn.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: rồi biệt chúng ra thánh
  rationale: Trong bối cảnh nghi lễ tư tế, קדשׁ chỉ việc dành riêng cho tình trạng và công dụng thánh. “Biệt ... ra thánh” truyền đạt rõ ý này, còn đại từ số nhiều “chúng” quy chiếu Đền Tạm cùng mọi vật trong đó.
theological_decisions:
- issue: Cách dịch קדשׁ trong nghi lễ tư tế
  choice: biệt chúng ra thánh
  alternative: thánh hóa chúng
  rationale: “Biệt ... ra thánh” nhấn mạnh việc dành riêng Đền Tạm và các vật dụng cho Đức Chúa Trời trong nghi lễ, tránh khiến người đọc mặc nhiên hiểu theo một nghĩa giáo lý hậu kỳ. Chú thích giữ lại cách diễn đạt thay thế hợp lệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể nối tiếp của tiếng Hê-bơ-rơ, dùng thuật ngữ nghi lễ quen thuộc nhưng tránh lối diễn đạt quá cổ.
