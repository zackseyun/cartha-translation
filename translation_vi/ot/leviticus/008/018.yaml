source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת אֵ֣יל הָ/עֹלָ֑ה וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: vi
  text: Rồi ông đem con chiên đực dùng làm lễ thiêu đến gần[a], và A-rôn cùng các con trai ông đặt tay[b] trên đầu con chiên đực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đem ra trình” hoặc “đưa ra”.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ cũng có thể được dịch là “tì” hoặc “đặt” tay; đây là một hành động nghi lễ thực hiện trên con vật hiến tế.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Rồi ông đem ... đến gần
  rationale: Dạng Hiphil của קרב có nghĩa là đem đến gần hoặc trình ra. Cách dịch này giữ sắc thái nghi lễ; đại từ “ông” chỉ Môi-se theo văn cảnh trực tiếp.
- source_word: אֵיל הָעֹלָה
  choice: con chiên đực dùng làm lễ thiêu
  rationale: אֵיל là chiên đực, còn עֹלָה là thuật ngữ chỉ lễ vật được thiêu trọn. “Dùng làm” diễn đạt tự nhiên việc con vật này được dành cho lễ thiêu.
- source_word: וַיִּסְמְכוּ
  choice: đặt
  rationale: Trong nghi lễ hiến tế, סמך chỉ hành động đặt hoặc tì tay lên con vật. “Đặt tay” là cách nói tự nhiên, không tự thêm ý nghĩa thần học mà câu không nêu rõ.
- source_word: יְדֵיהֶם
  choice: tay họ
  rationale: Giữ số nhiều được nêu rõ trong tiếng Hê-bơ-rơ và liên hệ hành động với A-rôn cùng các con trai ông.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: trên đầu con chiên đực
  rationale: Chuyển ngữ trực tiếp và tự nhiên cụm giới từ trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của việc đặt tay trong nghi lễ hiến tế
  choice: đặt tay họ trên đầu con chiên đực
  alternative: tì tay họ trên đầu con chiên đực
  rationale: Bản dịch mô tả hành động nghi lễ nhưng không giải thích đó là sự chuyển tội, đồng nhất hay một ý nghĩa thần học cụ thể nào khác, vì câu này không nói rõ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “lễ thiêu” như thuật ngữ hiến tế ngắn gọn; giữ chủ thể là “ông” vì Môi-se đã được xác định trong văn cảnh. Các dấu chú thích đều được đặt ngay sau phần văn bản liên quan.
