  terminology: “Chiên đực” cho אֵיל, “lễ thiêu” cho עֹלָה, và “đặt tay” cho סמך trong bối cảnh nghi lễ đều phù hợp. Không nên thêm diễn giải về ý nghĩa thần học của việc đặt tay.
