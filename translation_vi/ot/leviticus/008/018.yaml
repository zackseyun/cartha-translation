  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các thành tố chính của tiếng Hê-bơ-rơ: Môi-se đem/con vật đến, con chiên đực thuộc lễ thiêu, và A-rôn cùng các con trai ông thực hiện hành động đặt tay trên đầu con vật. Tuy nhiên, chú thích cho סמך nên được neo ngay tại cụm “đặt tay”, thay vì ở cuối toàn câu sau “con chiên đực”, để tham chiếu không bị mơ hồ.'
