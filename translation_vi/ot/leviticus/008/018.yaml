  rationale: Chỉ sửa vị trí neo của chú thích b để nó gắn trực tiếp với “đặt tay”, và tinh chỉnh phương án thay thế trong chú thích a. Nội dung, sự mơ hồ diễn giải của nghi thức, và thuật ngữ hiến tế đều được giữ nguyên.
