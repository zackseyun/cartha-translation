base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”. Một cách chuyển khác là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa mạch kể tiến lên; “rồi” diễn đạt trình tự tự nhiên, còn “phán” là cách nói trang trọng và thông dụng khi Đức Chúa Trời truyền lời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời theo cách phiên âm đã quen thuộc trong tiếng Việt, thay vì thay hoàn toàn bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל chỉ người tiếp nhận lời nói; “phán với Môi-se” là cấu trúc tiếng Việt tự nhiên.
- source_word: לֵאמֹר
  choice: dấu hai chấm
  rationale: Công thức nguyên ngữ giới thiệu nội dung lời phán ở câu tiếp theo. Trong tiếng Việt hiện đại, dấu hai chấm chuyển tải chức năng này tự nhiên hơn việc dịch máy móc là “rằng” hay “mà rằng”.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng Danh Thánh chứ không phải một tước hiệu. “Đức Giê-hô-va” bảo tồn tính chất danh riêng và là dạng quen thuộc với nhiều độc giả Việt; chú thích nêu rõ dạng Hê-bơ-rơ và các cách chuyển khác mà không biến một cách phát âm được phục dựng thành điều chắc chắn tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” phù hợp ngữ cảnh lời Đức Chúa Trời; dùng dấu hai chấm để mở sang nội dung trực tiếp ở câu kế tiếp. Dấu chú thích [a] đặt ngay sau “Môi-se” theo vị trí của lớp tham khảo tiếng Anh, dù nội dung chú thích liên quan đến Danh Thánh.
