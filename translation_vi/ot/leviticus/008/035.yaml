revisions:
- from: Các con phải ở tại lối vào Lều Hội Kiến cả ngày lẫn đêm trong bảy ngày, và tuân giữ phận sự Đức Giê-hô-va giao, để các con không phải chết[a], vì ta đã được truyền lệnh như vậy.
  to: Các con phải ở lối vào Lều Hội Kiến cả ngày lẫn đêm trong bảy ngày, và tuân giữ mệnh lệnh của Yahweh, để các con không chết[a], vì ta đã được truyền lệnh như vậy.
  rationale: Bản sửa chỉ điều chỉnh danh riêng יהוה theo chuẩn POB, thay cách diễn đạt về מִשְׁמֶרֶת יהוה bằng một tương đương trực tiếp hơn, và làm tự nhiên hóa lời cảnh báo. Cấu trúc, ngôi nói của Môi-se, tính liên tục ‘ngày và đêm’, và các khả năng cú pháp của vế cảnh báo đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
