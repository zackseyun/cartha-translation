  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: vi
  text: Các con phải ở lối vào Lều Hội Kiến cả ngày lẫn đêm trong bảy ngày, và tuân giữ mệnh lệnh của Yahweh, để các con không chết[a], vì ta đã được truyền lệnh như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và các con sẽ không chết”; hoặc: “kẻo các con chết.”'
    reason: 'Giữ lại các khả năng về quan hệ cú pháp và sắc thái của וְלֹא תָמֻתוּ: kết quả, lời bảo đảm có điều kiện, hoặc lời cảnh báo.'
lexical_decisions:
- source_word: וּפֶתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: פֶתַח chỉ lối vào hoặc cửa vào; אֹהֶל מוֹעֵד là danh xưng cố định của nơi thánh, được diễn đạt trang trọng và tự nhiên là “Lều Hội Kiến”.
- source_word: תֵּשְׁבוּ
  choice: phải ở
  rationale: Trong ngữ cảnh nghi lễ, ישׁב không đơn thuần là ngồi mà là lưu lại tại chỗ trong suốt thời gian quy định; “phải ở” truyền đạt mệnh lệnh rõ ràng, tự nhiên.
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: cả ngày lẫn đêm trong bảy ngày
  rationale: Cụm “ngày và đêm” diễn tả sự liên tục; thêm “cả... lẫn...” và “trong” phù hợp cú pháp tiếng Việt mà không làm thay đổi nghĩa.
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמֶרֶת יְהוָה
  choice: và tuân giữ phận sự Đức Giê-hô-va giao
  rationale: Sự kết hợp שׁמר + משׁמרת nói đến việc tuân thủ trách nhiệm hay phận sự được quy định. Thêm “giao” làm rõ quan hệ tự nhiên trong tiếng Việt mà không biến phận sự thành quyền sở hữu mơ hồ.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: וְלֹא תָמֻתוּ
  choice: để các con không phải chết
  rationale: Trong chuỗi mệnh lệnh này, mệnh đề có thể nêu hậu quả được tránh nhờ vâng lời. “Để... không phải chết” diễn đạt rõ nét mục đích/kết quả, đồng thời ghi nhận cách hiểu phối hợp trong chú thích.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: vì ta đã được truyền lệnh như vậy
  rationale: Dạng bị động cho thấy Môi-se nói về lệnh mình đã nhận; cách dịch giữ nguyên chủ thể ngôi thứ nhất và quan hệ giải thích của כִּי.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh bốn phụ âm. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu; hình thức “Đức Giê-hô-va” phù hợp lối xưng danh trang trọng, quen thuộc trong tiếng Việt.
- issue: Sắc thái của lời cảnh báo về cái chết
  choice: để các con không phải chết
  alternative: và các con sẽ không chết; kẻo các con chết
  rationale: 'Quan hệ mục đích/kết quả phù hợp với mạch văn: việc tuân giữ mệnh lệnh tránh hậu quả chết. Chú thích bảo tồn khả năng hiểu וְלֹא theo nghĩa phối hợp hoặc cảnh báo.'
- issue: Người nói trong mệnh đề cuối
  choice: Môi-se nói rằng chính ông đã được truyền lệnh
  alternative: 'Diễn đạt vô chủ: vì đã có lệnh như vậy'
  rationale: Động từ צֻוֵּיתִי ở ngôi thứ nhất số ít, bị động; vì vậy cần giữ lời chứng của người nói, không xóa ngôi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các con” phù hợp lời Môi-se trực tiếp nói với A-rôn và các con trai ông trong ngữ cảnh gần; “phận sự” giữ sắc thái nghi lễ mà không quá cổ. Dùng nhất quán “Lều Hội Kiến” như danh xưng nơi thánh.
