  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: vi
  text: Ông giết con bò, rồi Môi-se lấy máu, dùng ngón tay bôi máu lên các sừng của bàn thờ chung quanh, và thanh tẩy bàn thờ.[a] Ông đổ máu xuống chân bàn thờ và thánh hiến bàn thờ để làm lễ chuộc tội cho nó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tẩy sạch bàn thờ.” Động từ Hê-bơ-rơ trong ngữ cảnh nghi lễ này có nghĩa là thanh tẩy khỏi sự ô uế, chứ không phải làm cho phạm tội.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “làm lễ tẩy uế cho nó” hoặc “thực hiện lễ chuộc tội trên đó.” Động từ Hê-bơ-rơ diễn tả sự chuộc tội/thanh tẩy trong nghi lễ hiến tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Ông giết con bò
  rationale: Trong ngữ cảnh hiến tế, שׁחט chỉ việc giết con vật làm sinh tế. Tân ngữ được xác định từ câu trước là con bò; nêu rõ giúp tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: các sừng bàn thờ
  rationale: Giữ thuật ngữ nghi lễ chỉ những phần nhô ra như sừng ở các góc bàn thờ.
- source_word: סָבִיב בְּאֶצְבָּעוֹ
  choice: dùng ngón tay bôi ... ở chung quanh
  rationale: Diễn đạt tự nhiên phương tiện thực hiện và phạm vi phân bố của máu quanh các sừng bàn thờ.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: thanh tẩy bàn thờ
  rationale: Dạng piel của חטא trong nghi lễ tư tế mang nghĩa thanh tẩy khỏi ô uế, không phải khiến bàn thờ phạm tội.
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: đổ phần máu còn lại xuống chân bàn thờ
  rationale: יְסוֹד là nền hay phần chân của bàn thờ. Tiếng Hê-bơ-rơ nói 'máu'; 'phần ... còn lại' được làm rõ từ diễn tiến nghi lễ sau khi một phần máu đã được bôi lên các sừng.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: thánh hóa bàn thờ
  rationale: קדשׁ ở đây có nghĩa làm cho bàn thờ nên thánh, được biệt riêng cho việc thờ phượng.
- source_word: לְכַפֵּר עָלָיו
  choice: để làm lễ chuộc tội cho nó
  rationale: כפר là thuật ngữ hiến tế trọng yếu. 'Làm lễ chuộc tội' giữ sắc thái nghi lễ; עָלָיו được hiểu là bàn thờ, đối tượng nhận tác dụng của nghi thức.
theological_decisions:
- issue: Nghĩa của חטא trong nghi lễ thanh tẩy
  choice: thanh tẩy bàn thờ
  alternative: tẩy sạch bàn thờ
  rationale: Cách dịch cho thấy bàn thờ được thanh tẩy theo nghi lễ, chứ không hàm ý bàn thờ đã phạm tội.
- issue: Nghĩa của כפר khi bàn thờ là đối tượng
  choice: làm lễ chuộc tội cho nó
  alternative: làm lễ xá tội trên đó; làm lễ tẩy uế cho nó
  rationale: Giữ sức nặng và độ căng của thuật ngữ nghi lễ mà không thu hẹp nó chỉ còn một cơ chế thần học; chú thích nêu các khả năng diễn đạt khác.
- issue: Đối tượng của hậu tố giống đực số ít trong וַיְקַדְּשֵׁהוּ và עָלָיו
  choice: bàn thờ ... cho nó
  alternative: thánh hóa nó để thực hiện lễ chuộc tội trên đó
  rationale: Tiền ngữ tự nhiên là bàn thờ. Lặp lại 'bàn thờ' một lần giúp tiếng Việt rõ nghĩa, rồi dùng 'nó' để giữ cấu trúc quy chiếu của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Môi-se,” “bàn thờ,” “thanh tẩy,” “thánh hóa” và “lễ chuộc tội” như các thuật ngữ Kinh Thánh quen thuộc; tránh lối diễn đạt quá cổ. Tách câu dài của tiếng Hê-bơ-rơ thành hai câu tiếng Việt để dễ đọc mà vẫn giữ đúng trình tự hành động.
