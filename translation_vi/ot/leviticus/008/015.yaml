  source_fidelity: Bản dịch phản ánh đúng trình tự nghi lễ và các động từ chính. Tuy nhiên, “phần máu còn lại” là thông tin suy ra từ nghi thức, không được nói rõ trong câu Hê-bơ-rơ; nên không đưa vào bản văn chính. Cụm “các sừng bàn thờ ở chung quanh” cũng chưa diễn đạt rõ trạng từ סָבִיב, vốn chỉ việc bôi máu chung quanh các sừng/bàn thờ.
  naturalness: Văn phong nhìn chung tự nhiên, trang nghiêm. Sửa vị trí của “chung quanh” và bỏ “phần ... còn lại” sẽ làm câu gọn, rõ và sát nguyên văn hơn. “Thánh hiến” là cách dùng hiện đại, chính xác trong ngữ cảnh nghi lễ.
  terminology: Giữ nhất quán các thuật ngữ “Môi-se”, “bàn thờ”, “thanh tẩy”, và “lễ chuộc tội”. Chú thích b cần tránh diễn giải “xá tội”, vì đối tượng là bàn thờ và động từ כפר trong ngữ cảnh này có sắc thái chuộc/tẩy uế nghi lễ, không nhất thiết là tha tội.
