  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: vi
  text: Thầy tế lễ sẽ giết tế con chiên làm lễ vật chuộc lỗi. Thầy tế lễ sẽ lấy một ít máu của lễ vật chuộc lỗi, bôi lên dái tai phải của người đang được thanh tẩy, lên ngón cái của bàn tay phải và lên ngón cái của bàn chân phải của người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Người ta sẽ giết
  rationale: Động từ chỉ việc giết con vật trong nghi thức hiến tế; “giết” tự nhiên và rõ nghĩa trong tiếng Việt, còn chủ thể không được nêu trong câu Hê-bơ-rơ nên dùng “người ta” để không đồng nhất chủ thể với thầy tế lễ.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: con chiên dùng làm lễ vật chuộc lỗi
  rationale: 'Diễn đạt quan hệ cấu tạo: con chiên được chỉ định cho loại lễ vật אָשָׁם.'
- source_word: אָשָׁם
  choice: lễ vật chuộc lỗi
  rationale: Trong ngữ cảnh Lê-vi, từ này chỉ một loại lễ vật cụ thể. Cách dịch này dễ hiểu, đồng thời không giản lược thành cảm giác tội lỗi trừu tượng.
- source_word: מִדַּם הָאָשָׁם
  choice: một ít máu của lễ vật chuộc lỗi
  rationale: 'Giới từ מִן mang nghĩa phân lượng ở đây: thầy tế lễ chỉ lấy một phần máu để bôi.'
- source_word: תְּנוּךְ אֹזֶן ... הַיְמָנִית
  choice: dái tai phải
  rationale: תְּנוּךְ chỉ phần ngoài nhô ra ở rìa tai; “dái tai” là cách gọi giải phẫu tự nhiên và phù hợp với điểm bôi máu trong nghi thức.
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Phân từ Hitpael mô tả người đang trải qua tiến trình trở nên thanh sạch theo nghi thức.
- source_word: בֹּהֶן יָדוֹ הַיְמָנִית
  choice: ngón cái bàn tay phải của người ấy
  rationale: בֹּהֶן khi đi với “bàn tay” là ngón cái; thêm “của người ấy” ở cuối cụm song song để tiếng Việt rõ ràng mà không lặp nặng nề.
- source_word: בֹּהֶן רַגְלוֹ הַיְמָנִית
  choice: ngón cái bàn chân phải của người ấy
  rationale: בֹּהֶן khi đi với “bàn chân” là ngón chân cái; “ngón cái bàn chân” là cách diễn đạt thông dụng và cân xứng với “ngón cái bàn tay”.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Thuật ngữ tiếng Việt quen thuộc cho người đảm nhiệm chức vụ tế lễ trong luật nghi lễ.
theological_decisions:
- issue: Cách dịch thuật ngữ hiến tế אָשָׁם
  choice: lễ vật chuộc lỗi
  alternative: lễ vật bồi thường; tế lễ chuộc sự mắc lỗi
  rationale: Câu này nói đến một loại lễ vật cụ thể trong hệ thống hiến tế Lê-vi. “Lễ vật chuộc lỗi” rõ ràng với độc giả hiện đại và không áp đặt một cách giải thích giáo phái về cơ chế chuộc tội.
- issue: Chủ thể của וְשָׁחַט
  choice: Người ta
  alternative: người ấy; thầy tế lễ
  rationale: Động từ Hê-bơ-rơ ở ngôi thứ ba số ít nhưng không nêu danh từ làm chủ thể; mệnh đề kế tiếp mới nói rõ “thầy tế lễ”. Bản dịch không tự ý quyết định rằng chính thầy tế lễ là người giết con chiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp chỉ dẫn nghi lễ bằng hai câu; dùng nhất quán “thanh tẩy” cho tiến trình làm cho thanh sạch theo nghi thức. Không dùng chú thích vì các phương án từ vựng có thể được thể hiện đầy đủ trong bản dịch mà không tạo ra mơ hồ quan trọng cần công bố.
