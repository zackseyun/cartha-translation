  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: vi
  text: Phần dầu còn lại trên lòng bàn tay thầy tế lễ, thầy tế lễ phải đặt lên đầu người đang được thanh tẩy; rồi thầy tế lễ sẽ làm lễ chuộc tội cho người ấy trước mặt Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: Phần dầu còn lại
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nghĩa phần còn dư của dầu, đồng thời giữ chức năng danh từ của phân từ נוֹתָר.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: trên lòng bàn tay thầy tế lễ
  rationale: כַּף chỉ cụ thể lòng bàn tay, còn עַל được giữ là “trên”; cách nói này vừa sát nguồn vừa rõ trong bối cảnh nghi thức.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: ông phải đặt lên đầu
  rationale: נתן có nghĩa rộng là cho, đặt hoặc để. “Đặt lên” giữ sát động tác được mô tả mà không quy định thêm cách thoa dầu.
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Dạng phân từ Hitpael mô tả người đang trải qua tiến trình thanh tẩy theo nghi thức; “đang được thanh tẩy” giữ được sắc thái tiến hành này.
- source_word: וְכִפֶּר עָלָיו
  choice: rồi thầy tế lễ sẽ làm lễ chuộc tội cho người ấy
  rationale: Trong ngữ cảnh nghi lễ của Lê-vi Ký, כפר được chuyển là “làm lễ chuộc tội”, giữ ý nghĩa nghi thức quen thuộc mà không áp đặt một lý thuyết thần học hẹp hơn.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: “Trước mặt” diễn đạt tự nhiên לִפְנֵי theo nghĩa ở trước hoặc trong sự hiện diện của; danh riêng Yahweh bảo tồn danh giao ước trong bản nguồn.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản nguồn trực tiếp dùng danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa nghi lễ của כפר
  choice: làm lễ chuộc tội
  alternative: thực hiện sự chuộc tội; làm lễ tẩy uế
  rationale: Cách dịch này giữ thuật ngữ nghi lễ-thần học truyền thống và không quyết định quá mức giữa các cách giải thích như chuộc tội hay tẩy uế.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “thầy tế lễ” và “thanh tẩy” để phân biệt nghi thức thanh sạch với việc vệ sinh thông thường; đại từ “ông” giúp câu tự nhiên mà vẫn xác định rõ chủ thể.
