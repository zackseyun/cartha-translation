  terminology: '“Thầy tế lễ,” “lòng bàn tay,” “người đang được thanh tẩy,” “làm lễ chuộc tội,” và “trước mặt Yahweh” đều nhất quán, chuẩn mực, và phù hợp ngữ cảnh. Không cần chú thích: chú thích tiếng Anh được cung cấp không tương ứng với một điểm mơ hồ cần duy trì trong bản tiếng Việt và vị trí neo của nó cũng không phù hợp với nội dung chú thích.'
