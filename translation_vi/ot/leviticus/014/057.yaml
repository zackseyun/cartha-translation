base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/057.yaml
  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: vi
  text: để chỉ dạy khi nào là ô uế và khi nào là thanh sạch. Đây là luật về tình trạng gây ô uế[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo truyền thống: “bệnh phong.” Thuật ngữ Hê-bơ-rơ có thể chỉ các tình trạng gây ô uế liên quan đến người, vải vóc hoặc nhà cửa, chứ không chỉ bệnh Hansen ngày nay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: để chỉ dạy
  rationale: Động từ Hiphil diễn tả việc đưa ra chỉ dẫn có thẩm quyền nhằm phân định các tình trạng nghi lễ trong những luật lệ trước đó.
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: khi nào là ô uế và khi nào là thanh sạch
  rationale: Thành ngữ thời gian ở đây nói đến lúc tình trạng được xác định là ô uế hay thanh sạch, chứ không nhất thiết chỉ một ngày theo lịch.
- source_word: תּוֹרַת
  choice: luật về
  rationale: Danh từ ở thể liên kết giới thiệu toàn bộ chỉ dẫn chi phối loại tình trạng được nêu sau đó; “luật về” tự nhiên và trang trọng trong tiếng Việt.
- source_word: הַצָּרָעַת
  choice: chứng ô uế
  rationale: Thuật ngữ Hê-bơ-rơ chỉ một loại tình trạng gây ô uế nghi lễ có thể xuất hiện trên người, vải vóc hoặc nhà cửa, nên không thể giới hạn vào một bệnh da cụ thể.
theological_decisions:
- issue: Cách dịch צָרַעַת trong luật thanh sạch của Lê-vi
  choice: chứng ô uế
  alternative: bệnh phong; chứng bệnh ngoài da
  rationale: Cách dịch này giữ phạm vi rộng của loại tình trạng nghi lễ trong ngữ cảnh, tránh đồng nhất sai với bệnh Hansen hiện đại hoặc chỉ giới hạn ở da người. Chú thích vẫn nêu cách dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ô uế/thanh sạch” duy trì thuật ngữ nghi lễ xuyên suốt; cấu trúc “khi nào” chuyển đạt tự nhiên thành ngữ thời gian của nguyên văn.
