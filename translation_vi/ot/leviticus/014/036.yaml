review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng trình tự: thầy tế lễ ra lệnh làm trống nhà trước khi kiểm tra, nhằm ngăn đồ vật trong nhà trở nên ô uế, rồi mới vào xem xét nhà. Tuy nhiên, “chỗ bị tổn hại” diễn đạt negaʿ khá gượng và không phải cách gọi tự nhiên cho dấu hiệu đang được kiểm tra trong ngữ cảnh này.'
  naturalness: “Phải truyền dọn hết đồ đạc ra khỏi nhà” không tự nhiên trong tiếng Việt hiện đại. “Ra lệnh dọn trống căn nhà” rõ ràng, tự nhiên, và vẫn giữ chủ thể số nhiều bất định của động từ Hê-bơ-rơ. “Vết” là cách gọi ngắn gọn, phù hợp hơn trong câu chính.
  terminology: Giữ “thầy tế lễ,” “ô uế,” và “xem xét” là phù hợp với văn cảnh pháp lễ. “Ô uế” cần được hiểu theo nghi lễ; bản văn không hàm ý phán xét đạo đức. Dùng “vết” cho נגע, đồng thời nêu các khả năng khác trong chú thích, tránh khẳng định một chẩn đoán hiện đại.
  issues:
  - severity: medium
    issue: Cụm “phải truyền dọn hết đồ đạc ra khỏi nhà” thiếu tự nhiên và chưa diễn đạt trôi chảy mệnh lệnh làm trống nhà.
    rationale: וּפִנּוּ אֶת־הַבַּיִת nói đến việc làm trống nhà theo lệnh của thầy tế lễ. “Ra lệnh dọn trống căn nhà” diễn đạt chính xác chức năng sai khiến và tự nhiên hơn.
  - severity: low
    issue: “Chỗ bị tổn hại” là cách dịch hơi mơ hồ và không tự nhiên cho הַנֶּגַע.
    rationale: Negaʿ chỉ vết/chỗ hoặc tình trạng bị ảnh hưởng đang được tư tế kiểm tra. “Vết” trong câu chính là lựa chọn tự nhiên; chú thích bảo lưu các cách hiểu khác.
  - severity: low
