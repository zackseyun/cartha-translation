base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: vi
  text: Thầy tế lễ phải ra lệnh dọn trống căn nhà trước khi ông vào xem xét vết[a], để mọi vật trong nhà không bị ô uế. Sau đó, thầy tế lễ sẽ vào xem xét căn nhà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chỗ bị tổn hại”, “chỗ nhiễm bệnh”, hoặc theo cách dịch truyền thống: “tai họa”. Từ Hê-bơ-rơ negaʿ chỉ vết hoặc tình trạng bất thường mà thầy tế lễ xem xét.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Bấy giờ, ... phải truyền
  rationale: Trong luật nghi lễ theo trình tự, waw kết hợp với động từ hoàn thành diễn tả bước kế tiếp và tính bắt buộc; “Bấy giờ” cùng “phải truyền” thể hiện tự nhiên cả hai sắc thái.
- source_word: וּפִנּוּ אֶת הַבַּיִת
  choice: dọn hết đồ đạc ra khỏi nhà
  rationale: Động từ số nhiều có chủ thể không xác định. Trong ngữ cảnh, “làm trống căn nhà” nghĩa là đưa các vật chứa trong nhà ra ngoài; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: לִרְאוֹת
  choice: xem xét
  rationale: Nghĩa cơ bản là “nhìn, xem”, nhưng trong thủ tục tư tế ở đây từ này chỉ việc kiểm tra chính thức; “xem xét” vừa chính xác vừa không quá chuyên môn.
- source_word: הַנֶּגַע
  choice: chỗ bị tổn hại
  rationale: נֶגַע chỉ chỗ hoặc tình trạng bị tác động đang được thầy tế lễ xem xét. “Chỗ bị tổn hại” tránh đồng nhất hiện tượng này với một bệnh hay tác nhân lây nhiễm theo y học hiện đại.
- source_word: וְלֹא יִטְמָא
  choice: để ... khỏi bị ô uế
  rationale: Mệnh đề diễn tả mục đích phòng ngừa. “Bị ô uế” ở đây thuộc phạm vi nghi lễ, không mặc nhiên hàm ý tội lỗi đạo đức.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: mọi vật trong nhà
  rationale: Cụm này nói đến toàn bộ đồ vật hoặc tài sản ở trong nhà; “mọi vật” phù hợp hơn “mọi thứ” với văn phong trang trọng.
- source_word: וְאַחַר כֵּן
  choice: Sau đó
  rationale: Đánh dấu bước kế tiếp trong trình tự thủ tục một cách rõ ràng, tự nhiên.
- source_word: לִרְאוֹת אֶת הַבָּיִת
  choice: xem xét căn nhà
  rationale: Ở lần xuất hiện thứ hai, đối tượng trực tiếp là toàn bộ căn nhà; giữ “xem xét” tạo sự nhất quán với thủ tục kiểm tra.
theological_decisions:
- issue: Thuật ngữ về tình trạng ô uế nghi lễ
  choice: bị ô uế
  alternative: bị nhiễm uế; trở nên không thanh sạch
  rationale: טמא trong Lê-vi Ký chủ yếu nói đến tình trạng ô uế theo nghi lễ. “Bị ô uế” là cách diễn đạt quen thuộc, trang trọng và không tự động biến khái niệm này thành sự phạm tội về đạo đức.
- issue: Bản chất của נֶגַע trên căn nhà
  choice: chỗ bị tổn hại
  alternative: vết; chỗ nhiễm bệnh; tai họa
  rationale: Nguyên ngữ không xác định theo thuật ngữ khoa học hiện đại bản chất của hiện tượng. Bản dịch giữ tính khái quát, không khẳng định đó là bệnh truyền nhiễm, nấm mốc hay một tai họa cụ thể.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo ngữ cảnh Lê-vi, “xem xét” cho thủ tục kiểm tra, và tách thành hai câu để trình tự pháp lễ sáng rõ. Dấu chú thích [a] được đặt ngay sau cụm từ tương ứng.
