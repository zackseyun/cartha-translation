revisions:
- from: Bấy giờ, thầy tế lễ phải truyền dọn hết đồ đạc ra khỏi nhà trước khi ông vào xem xét chỗ bị tổn hại[a], để mọi vật trong nhà khỏi bị ô uế. Sau đó, thầy tế lễ sẽ vào xem xét căn nhà.
  to: Thầy tế lễ phải ra lệnh dọn trống căn nhà trước khi ông vào xem xét vết[a], để mọi vật trong nhà không bị ô uế. Sau đó, thầy tế lễ sẽ vào xem xét căn nhà.
  rationale: Sửa cách diễn đạt mệnh lệnh dọn nhà cho tự nhiên hơn, thay cụm từ không idiomatic về negaʿ bằng “vết” trong câu chính, và chỉnh chú thích để bảo lưu phạm vi nghĩa không chắc chắn của từ Hê-bơ-rơ. Không thay đổi trình tự, ý nghĩa nghi lễ, hay mức độ mơ hồ của nguyên ngữ.
