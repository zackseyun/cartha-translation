  yaml_path: translation/ot/leviticus/014/026.yaml
  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
translation:
  language: vi
  text: Rồi thầy tế lễ sẽ lấy dầu ấy đổ lên lòng bàn tay trái của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “trên lòng bàn tay của thầy tế lễ, bên trái.”'
    reason: Giữ lại cấu trúc bất thường của tiếng Hê-bơ-rơ, trong đó tính từ “trái” bổ nghĩa cho lòng bàn tay theo cách nói rút gọn.
lexical_decisions:
- source_word: וּ/מִן
  choice: Rồi ... lấy
  rationale: וּ tiếp nối trình tự nghi lễ, còn מִן chỉ nguồn mà một phần dầu được lấy ra; cách diễn đạt này tự nhiên trong tiếng Việt mà không làm thay đổi ý.
- source_word: הַ/שֶּׁמֶן
  choice: dầu ấy
  rationale: Danh từ có mạo từ chỉ số dầu đã được nhắc đến trong nghi lễ; “dầu ấy” giúp liên kết rõ với ngữ cảnh trước.
- source_word: יִצֹק
  choice: sẽ ... đổ
  rationale: Dạng yiqtol mang chức năng chỉ dẫn trong trình tự nghi lễ; “sẽ đổ” phù hợp với lối trình bày thủ tục bằng tiếng Việt.
- source_word: הַ/כֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ nghĩa, trang trọng và quen thuộc trong văn cảnh nghi lễ Lê-vi.
- source_word: עַל
  choice: vào
  rationale: Trong tiếng Việt, dầu được “đổ vào lòng bàn tay” là cách nói tự nhiên, diễn tả hướng chuyển động đến bề mặt lõm của bàn tay.
- source_word: כַּף
  choice: lòng bàn tay
  rationale: כַּף ở đây chỉ phần lòng hoặc chỗ hõm của bàn tay, nên “lòng bàn tay” chính xác hơn từ chung “tay”.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: lòng bàn tay trái của mình
  rationale: Cách diễn đạt tự nhiên cho thấy đó là tay trái của chính thầy tế lễ, đồng thời tránh lặp danh xưng nặng nề.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “thầy tế lễ” nhất quán với văn cảnh nghi lễ. “Rồi” biểu thị bước kế tiếp trong thủ tục, còn “của mình” làm rõ chủ thể sở hữu mà không tạo thêm nội dung thần học.
