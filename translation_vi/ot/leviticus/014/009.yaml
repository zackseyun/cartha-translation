source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: vi
  text: 'Vào ngày thứ bảy, người ấy phải cạo hết lông tóc của mình: tóc trên đầu, râu và lông mày. Người ấy phải cạo hết mọi lông tóc, giặt quần áo, rửa thân thể bằng nước[a], rồi sẽ thanh sạch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “rửa da thịt mình bằng nước”; trong cách nói Hê-bơ-rơ ở đây, “da thịt” chỉ thân thể của người ấy.
    reason: Giải thích cách chuyển thành ngữ בְּשָׂרוֹ sang tiếng Việt tự nhiên mà vẫn cho thấy cách diễn đạt sát chữ.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: Đến ngày thứ bảy
  rationale: Diễn đạt tự nhiên chức năng thời gian và trình tự của thành ngữ Hê-bơ-rơ, đồng thời giữ rõ ngày được ấn định trong nghi thức.
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: người ấy phải cạo hết lông tóc của mình
  rationale: Động từ Piel יְגַלַּח chỉ việc cạo bỏ; “lông tóc” bao quát tóc trên đầu và lông trên thân thể, phù hợp với danh sách theo sau.
- source_word: רֹאשׁוֹ
  choice: tóc trên đầu
  rationale: Nguyên văn nói “đầu của người ấy” như vùng cần cạo; tiếng Việt cần nói rõ “tóc trên đầu” để tự nhiên và tránh hiểu là cạo chính phần đầu.
- source_word: זְקָנוֹ
  choice: râu
  rationale: Đây là nghĩa thông thường và trực tiếp của זָקָן trong ngữ cảnh.
- source_word: גַּבֹּת עֵינָיו
  choice: lông mày
  rationale: Thành ngữ Hê-bơ-rơ, theo sát chữ là “vòm/lông phía trên mắt”, chỉ lông mày.
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: Người ấy phải cạo hết mọi lông tóc
  rationale: Giữ lại sự lặp lại của nguyên văn sau danh sách để bảo toàn sắc thái nhấn mạnh tính toàn bộ.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: giặt quần áo
  rationale: כִּבֵּס trong ngữ cảnh này nói đến việc giặt đồ mặc; cách diễn đạt hiện đại, rõ ràng.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: tắm thân thể bằng nước
  rationale: בָּשָׂר theo sát chữ là “thịt/da thịt” nhưng ở đây chỉ toàn thân người; “thân thể” tự nhiên hơn trong tiếng Việt và vẫn giữ cụm “bằng nước”.
- source_word: וְטָהֵר
  choice: rồi sẽ được thanh sạch
  rationale: Diễn tả tình trạng thanh sạch theo nghi lễ đạt được sau các hành động vừa nêu; “rồi” làm rõ trình tự vốn có trong mạch văn.
theological_decisions:
- issue: Thuật ngữ về tình trạng tinh sạch theo nghi lễ
  choice: thanh sạch
  alternative: tinh sạch; được thanh tẩy
  rationale: טָהֵר ở đây nói về tình trạng hợp lệ theo luật thanh sạch, không phải sự vô tội về đạo đức. “Thanh sạch” giữ được phạm trù nghi lễ, còn “được thanh tẩy” có thể làm lệch từ trạng thái sang tiến trình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để nối với đối tượng đang trải qua nghi thức trong ngữ cảnh. Giữ nguyên sự lặp lại về việc cạo hết lông tóc nhằm bảo toàn điểm nhấn của bản Hê-bơ-rơ. Dấu chú thích [a] được đặt sau “bằng nước”, đúng với cụm từ mà chú thích giải thích.
