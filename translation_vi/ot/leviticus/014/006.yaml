id: LEV.14.6
reference: Leviticus 14:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: vi
  text: Còn con chim sống, người ấy phải lấy nó cùng với miếng gỗ bá hương, sợi chỉ đỏ thắm và cây bài hương, rồi nhúng các vật ấy cùng con chim sống vào huyết của con chim đã bị giết mổ trên nước chảy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “nước sống”; cũng có thể dịch là “nước nguồn” hoặc “nước đang chảy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: con chim sống
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ sự đối lập trực tiếp với con chim đã bị giết.
- source_word: יִקַּח
  choice: người ấy phải lấy
  rationale: Thể chưa hoàn thành mang chức năng mệnh lệnh trong luật nghi lễ; “phải” truyền đạt rõ lực quy định.
- source_word: עֵץ הָאֶרֶז
  choice: miếng gỗ bá hương
  rationale: Cụm từ chỉ vật liệu bằng gỗ bá hương dùng trong nghi lễ; “miếng” làm rõ đây là một vật được cầm và nhúng mà không thay đổi ý nghĩa.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: sợi chỉ đỏ thắm
  rationale: Chỉ vật liệu dạng sợi nhuộm màu đỏ thắm; cách gọi này rõ ràng và quen thuộc trong tiếng Việt.
- source_word: הָאֵזֹב
  choice: cây bài hương
  rationale: Giữ thuật ngữ truyền thống cho loài cây dùng trong nghi lễ, dù việc xác định chính xác loài thực vật vẫn còn được bàn luận.
- source_word: וְטָבַל
  choice: rồi nhúng
  rationale: Diễn tả hành động đưa vật vào chất lỏng trong chốc lát, phù hợp với nghi thức ở đây.
- source_word: אוֹתָם
  choice: các vật ấy
  rationale: Làm rõ đại từ số nhiều quy chiếu đến các vật dụng nghi lễ vừa kể, đồng thời tránh sự mơ hồ không tự nhiên trong tiếng Việt.
- source_word: בְּדַם
  choice: vào huyết của
  rationale: Giới từ sau động từ “nhúng” chỉ chất lỏng mà các vật và con chim được nhúng vào; “huyết” phù hợp văn phong nghi lễ trang trọng.
- source_word: הַצִּפֹּר הַשְּׁחֻטָה
  choice: con chim đã bị giết
  rationale: Truyền đạt phân từ chỉ con chim đã bị giết theo nghi thức, không thêm chi tiết về phương thức ngoài điều bản văn nêu.
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: trên nước chảy
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “nước sống”, thường chỉ nước tươi hoặc đang chảy; “nước chảy” truyền đạt nghĩa cụ thể trong ngữ cảnh nghi lễ.
theological_decisions:
- issue: Cách dịch מַיִם חַיִּים trong bối cảnh thanh tẩy nghi lễ
  choice: nước chảy
  alternative: nước sống; nước sạch; nước nguồn
  rationale: “Nước chảy” phản ánh nghĩa thành ngữ trong ngữ cảnh mà không đưa các liên tưởng thần học về sau vào câu; chú thích vẫn bảo tồn hình thức sát chữ và khả năng diễn đạt khác.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại. Giữ sự lặp lại “con chim sống” của nguyên văn để nêu rõ cả các vật dụng lẫn con chim đều được nhúng; dùng “người ấy” vì chủ thể được xác định từ chỉ dẫn liền trước.
