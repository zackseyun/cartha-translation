source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: vi
  text: Và hai con chim cu gáy hoặc hai con bồ câu non, tùy theo khả năng của người ấy. Một con sẽ dùng làm lễ chuộc tội[a], còn con kia làm lễ toàn thiêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy.” Từ Hê-bơ-rơ này có thể chỉ lễ vật được dùng để thanh tẩy trong các bối cảnh nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: và hai con chim gáy
  rationale: Liên từ nối tiếp danh sách lễ vật ở câu trước; תֹרִים chỉ loài chim gáy dùng trong nghi lễ hiến tế.
- source_word: אוֹ
  choice: hoặc
  rationale: Diễn đạt trực tiếp sự lựa chọn giữa hai loại chim được phép dâng.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: hai con bồ câu non
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “hai con của bồ câu,” chỉ bồ câu còn non; bản dịch giữ rõ sắc thái về độ tuổi.
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: tùy theo khả năng của người ấy
  rationale: Thành ngữ “tay người ấy đạt tới” nói về khả năng kinh tế; cách diễn đạt này tự nhiên trong tiếng Việt và giữ đúng ý về mức người ấy có thể lo liệu.
- source_word: וְהָיָה אֶחָד
  choice: Một con sẽ dùng làm
  rationale: Dạng số ít phân định công dụng của từng con chim; thêm “dùng làm” giúp câu tiếng Việt rõ và tự nhiên mà không bổ sung ý mới.
- source_word: חַטָּאת
  choice: lễ chuộc tội
  rationale: Đây là thuật ngữ quen thuộc cho loại lễ vật này trong hệ thống tế lễ Lê-vi; chú thích bảo lưu nghĩa khả dĩ nhấn mạnh sự thanh tẩy.
- source_word: וְהָאֶחָד
  choice: còn con kia
  rationale: Mạo từ cùng phép đối chiếu cho biết đây là con còn lại trong cặp; “còn con kia” là cách nói tiếng Việt rõ ràng.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ tiếng Việt gọn, quen thuộc cho lễ vật được thiêu dâng trọn vẹn; tránh dịch máy móc theo từ nguyên là “lễ dâng lên.”
theological_decisions:
- issue: Cách dịch חַטָּאת trong bối cảnh nghi lễ thanh tẩy
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: חַטָּאת là tên một loại lễ vật thường được dịch là “lễ chuộc tội,” nhưng trong các nghi thức xử lý tình trạng ô uế, chức năng thanh tẩy nổi bật. Giữ thuật ngữ chính quen thuộc trong bản văn và nêu phương án “lễ thanh tẩy” ở chú thích để không xóa bỏ sắc thái nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu đầu được giữ như phần tiếp nối câu trước theo liên từ Hê-bơ-rơ; các thuật ngữ tế lễ dùng dạng ngắn gọn, nhất quán. Dấu chú thích [a] được đặt ngay sau thuật ngữ חַטָּאת mà chú thích giải thích.
