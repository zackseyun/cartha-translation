  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/שָׁחַ֖ט אֶת הַ/צִּפּ֣וֹר הָ/אֶחָ֑ת אֶל כְּלִי חֶ֖רֶשׂ עַל מַ֥יִם חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/005.yaml
  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: vi
  text: Sau đó, thầy tế lễ sẽ ra lệnh giết một con chim trên một bình đất nung đựng nước chảy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “nước sống”, tức nước chảy hoặc nước tự nhiên, không tù đọng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Rồi ... sẽ truyền
  rationale: Trong chỉ dẫn nghi lễ, waw đi với thể hoàn thành mang lực tuần tự và quy định; “Rồi ... sẽ truyền” diễn đạt tự nhiên cả trình tự lẫn thẩm quyền.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, trang trọng và quen thuộc trong ngữ cảnh tế tự của Lê-vi Ký.
- source_word: וְשָׁחַט
  choice: giết
  rationale: Động từ chủ động số ít có thể chỉ thầy tế lễ hoặc người thi hành theo lệnh; cấu trúc “truyền giết” giữ cho người trực tiếp thực hiện không bị xác định quá mức.
- source_word: אֶת הַצִּפּוֹר הָאֶחָת
  choice: một con chim
  rationale: Chỉ một con trong hai con chim đã nêu ở câu trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: trên một bình đất nung
  rationale: Trong bối cảnh giết chim cùng một vật chứa, אֶל chỉ hướng về phía bình; “trên” cho thấy máu chảy vào bình mà không diễn đạt khó hiểu rằng con chim bị giết ở bên trong bình.
- source_word: עַל מַיִם חַיִּים
  choice: đựng nước sạch
  rationale: Cụm này theo nghĩa đen là “nước sống”, chỉ nước tự nhiên, không tù đọng; “đựng” làm rõ quan hệ giữa nước và bình theo ngữ cảnh nghi lễ, còn chú thích bảo lưu cách nói sát chữ và khả năng hiểu là nước chảy.
theological_decisions:
- issue: Cách dịch מַיִם חַיִּים trong nghi thức thanh tẩy
  choice: nước sạch
  alternative: nước sống; nước chảy
  rationale: Ở đây cụm từ trước hết mô tả loại nước dùng trong nghi thức, không nên tự động gán ý nghĩa biểu tượng thần học về sau. Bản chính dùng cách nói dễ hiểu, còn chú thích giữ nguyên hình ảnh và phạm vi nghĩa của tiếng Hê-bơ-rơ.
- issue: Ai trực tiếp giết con chim
  choice: không nêu rõ người thực hiện trong cấu trúc “truyền giết”
  alternative: thầy tế lễ giết; một người khác giết theo lệnh
  rationale: Dạng động từ tiếng Hê-bơ-rơ có thể tiếp tục lấy thầy tế lễ làm chủ ngữ, nhưng cú pháp sau “truyền” cũng có thể được hiểu là hành động được ra lệnh. Không nên xác quyết điều văn bản không hoàn toàn làm rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Bình đất nung” cụ thể và tự nhiên hơn “vật chứa bằng đất”; “truyền giết” giữ sắc thái quy định nghi lễ và không ấn định quá mức tác nhân trực tiếp.
