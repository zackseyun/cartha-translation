  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: vi
  text: Rồi họ phải lấy những viên đá khác đem đặt thay cho những viên đá[a]; người ấy phải lấy vữa khác[b] và trát lại ngôi nhà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đến dưới những viên đá”; trong ngữ cảnh này, thành ngữ ấy có nghĩa là “thay cho những viên đá” hoặc “để thay thế những viên đá.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đất khác”; sát nghĩa hơn là “bụi/đất khác.” Từ Hê-bơ-rơ chỉ vật liệu dùng để trát lại ngôi nhà sau khi thay những viên đá bị ảnh hưởng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Rồi họ phải lấy
  rationale: Động từ số nhiều trong chuỗi chỉ dẫn nghi lễ được diễn đạt bằng “phải”; “rồi” thể hiện trình tự của וְ trong ngữ cảnh.
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: những viên đá khác
  rationale: Diễn đạt trực tiếp các viên đá mới dùng để thay thế những viên đã bị dỡ bỏ.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: đem đến thay cho những viên đá cũ
  rationale: תַּחַת ở đây chỉ sự thay thế chứ không phải vị trí vật lý ở bên dưới; thêm “cũ” làm rõ rằng đây là những viên đá vừa bị lấy ra mà không thay đổi ý nghĩa.
- source_word: וְעָפָר אַחֵר
  choice: vữa khác
  rationale: עָפָר theo nghĩa gốc là bụi hoặc đất, nhưng trong việc sửa nhà ở đây chỉ vật liệu đất dùng để trát; “vữa” tự nhiên và đúng chức năng hơn trong tiếng Việt.
- source_word: יִקַּח
  choice: người ấy phải lấy
  rationale: Giữ sự chuyển đổi từ chủ thể số nhiều sang động từ ngôi ba số ít trong tiếng Hê-bơ-rơ, thay vì âm thầm đồng nhất thành “họ”.
- source_word: וְטָח אֶת הַבָּיִת
  choice: và trát lại ngôi nhà
  rationale: טוח chỉ việc phủ hoặc trát bề mặt; “trát lại” diễn đạt tự nhiên hành động tái phủ nhà sau khi thay đá.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại, dễ hiểu. Bản dịch giữ sự chuyển đổi số nhiều–số ít của động từ Hê-bơ-rơ và dùng thuật ngữ xây dựng thông dụng “vữa”, “trát lại”.
