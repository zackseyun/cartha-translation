- from: Rồi họ phải lấy những viên đá khác đem đến thay cho những viên đá cũ[a]; người ấy phải lấy vữa khác[b] và trát lại ngôi nhà.
  to: Rồi họ phải lấy những viên đá khác đem đặt thay cho những viên đá[a]; người ấy phải lấy vữa khác[b] và trát lại ngôi nhà.
  rationale: Bỏ “cũ” để không thêm một mô tả không có trong câu tiếng Hê-bơ-rơ. Thay “đem đến thay cho” bằng “đem đặt thay cho” cho tự nhiên hơn trong ngữ cảnh thay đá, mà vẫn giữ chính xác ý “mang đến để thay thế.” Chú thích và cách dịch “vữa” được giữ vì chúng bảo lưu sự không chắc chắn từ vựng của עָפָר.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:30Z'
