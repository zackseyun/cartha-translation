  source_fidelity: 'Bản dịch theo sát trình tự thủ tục của tiếng Hê-bơ-rơ: thầy tế lễ đi ra khỏi nhà, đến lối vào của chính ngôi nhà ấy, rồi đóng kín nhà trong thời hạn bảy ngày. “Rồi” diễn đạt hợp lý chức năng tiếp diễn của waw trong văn luật lệ; “phải” truyền đạt phù hợp sắc thái quy định.'
  naturalness: Câu văn tự nhiên, rõ ràng và giữ được văn phong luật lệ trang trọng nhưng hiện đại. “Đóng kín nhà ấy trong bảy ngày” dễ hiểu trong ngữ cảnh thủ tục kiểm tra và không diễn giải thành một thuật ngữ y tế hoặc pháp lý hiện đại.
  terminology: “Thầy tế lễ” là cách gọi chuẩn, dễ hiểu trong văn mạch Lê-vi. “Lối vào” phản ánh פתח mà không áp đặt nghĩa hẹp là một cánh cửa. Chú thích nêu một khả năng từ vựng hợp lệ và giải thích đúng chức năng hạn chế việc ra vào của động từ.
