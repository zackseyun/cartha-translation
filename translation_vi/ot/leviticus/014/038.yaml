  yaml_path: translation/ot/leviticus/014/038.yaml
  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: vi
  text: Rồi thầy tế lễ phải đi ra khỏi nhà, đến lối vào nhà, và đóng kín nhà ấy trong bảy ngày.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khóa nhà ấy lại trong bảy ngày.” Động từ Hê-bơ-rơ có thể chỉ việc ngăn người ta ra vào trong thời gian chờ kiểm tra lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Rồi ... phải đi ra
  rationale: Trong văn luật lệ theo trình tự, waw kết hợp với động từ ở đây dẫn sang bước kế tiếp. “Rồi” diễn đạt tự nhiên trình tự ấy, còn “phải đi ra” giữ sắc thái chỉ thị.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu đối với כֹּהֵן trong bối cảnh luật Lê-vi; tính xác định được thể hiện qua ngữ cảnh.
- source_word: מִן הַבַּיִת
  choice: khỏi nhà
  rationale: Đi với động từ “đi ra”, “khỏi nhà” diễn đạt tự nhiên hướng từ bên trong ra ngoài mà không thêm ý.
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: đến lối vào nhà
  rationale: פֶּתַח chỉ chỗ mở hoặc lối vào. “Lối vào” cụ thể, tự nhiên và không giả định có một cánh cửa.
- source_word: וְהִסְגִּיר
  choice: và đóng kín
  rationale: Dạng Hiphil của סגר ở đây chỉ việc đóng hoặc ngăn không cho ra vào trong một thời hạn. “Đóng kín” giữ hình ảnh cụ thể và tránh diễn giải quá mức bằng “cách ly”.
- source_word: אֶת הַבַּיִת
  choice: nhà ấy
  rationale: Dấu chỉ tân ngữ không được dịch; “ấy” giúp tiếng Việt nhận diện tự nhiên chính ngôi nhà vừa được nhắc đến.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Cách diễn đạt thời lượng tự nhiên trong tiếng Việt, tương ứng trực tiếp với cụm số từ Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại; câu giữ rõ trình tự hành động. Dùng “lối vào” thay vì “cửa” để không xác định quá mức cấu trúc vật lý, và dùng “đóng kín” thay vì thuật ngữ diễn giải “cách ly”.
