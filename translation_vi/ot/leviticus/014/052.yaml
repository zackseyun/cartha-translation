source:
  edition: WLC
  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: vi
  text: Vậy, thầy tế lễ sẽ thanh tẩy ngôi nhà bằng máu con chim, bằng nước sống[a], bằng con chim còn sống, bằng gỗ tuyết tùng, bằng cây bài hương[b] và bằng sợi chỉ đỏ thắm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nước tươi” hoặc “nước chảy”; nguyên văn Hê-bơ-rơ là “nước sống”, một cách nói thông dụng chỉ nước lấy từ nguồn nước tươi đang chảy.
    reason: lexical_alternative
  - marker: b
    text: Tên thực vật Hê-bơ-rơ này thường được dịch là “bài hương” (hyssop), nhưng việc xác định chính xác loài cây vẫn còn được tranh luận.
    reason: lexical_uncertainty
  - marker: c
    text: Hay “sợi len đỏ thắm”. Cụm từ Hê-bơ-rơ chỉ một vật liệu dạng sợi được nhuộm đỏ thắm để dùng trong nghi lễ thanh tẩy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: Vậy, thầy tế lễ sẽ thanh tẩy
  rationale: Dạng Piel của חטא trong bối cảnh nghi lễ mang nghĩa thanh tẩy, loại bỏ tình trạng ô uế. Chủ thể được diễn đạt rõ là “thầy tế lễ” theo ngữ cảnh trước đó; “Vậy” thể hiện liên kết với tiến trình nghi lễ.
- source_word: הַבַּיִת
  choice: ngôi nhà
  rationale: Chỉ căn nhà vật chất đang được thanh tẩy khỏi tình trạng ô uế do dấu vết bất thường trên tường.
- source_word: בְּדַם הַצִּפּוֹר
  choice: bằng máu con chim
  rationale: Giới từ בְּ chỉ phương tiện được dùng trong nghi lễ.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: bằng nước sống
  rationale: Giữ hình ảnh sát nguyên ngữ מַיִם חַיִּים và âm hưởng liên văn bản; chú thích giải thích thành ngữ này chỉ nước tươi từ nguồn đang chảy.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: bằng con chim còn sống
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời làm rõ sự tương phản với con chim đã bị giết để lấy máu.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: bằng gỗ bá hương
  rationale: עֵץ đi với tên loài cây ở đây chỉ vật liệu gỗ dùng trong nghi lễ; “gỗ bá hương” là thuật ngữ Kinh Thánh quen thuộc cho gỗ cedar.
- source_word: וּבָאֵזֹב
  choice: bằng cây bài hương
  rationale: Giữ tên gọi truyền thống của אֵזֹב trong tiếng Việt; việc định danh thực vật chính xác vẫn còn được tranh luận.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: bằng sợi chỉ đỏ thắm
  rationale: Cụm từ chỉ vật liệu dạng sợi được nhuộm màu đỏ thắm dùng trong nghi lễ; “sợi chỉ” là cách diễn đạt rõ và tự nhiên.
theological_decisions:
- issue: Sắc thái nghi lễ của וְחִטֵּא
  choice: thanh tẩy
  alternative: chuộc tội cho / làm sạch
  rationale: “Thanh tẩy” truyền đạt việc loại bỏ tình trạng ô uế nghi lễ mà không biến hành động đối với căn nhà thành sự tha thứ tội lỗi về luân lý.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc lặp “bằng” giữ nhịp liệt kê cùng sắc thái phương tiện của nguyên văn. Các thuật ngữ nghi lễ và thực vật truyền thống được giữ lại nhưng giải thích khi cần.
