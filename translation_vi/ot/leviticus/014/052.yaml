  to: Vậy, thầy tế lễ sẽ thanh tẩy ngôi nhà bằng máu con chim, bằng nước sống[a], bằng con chim còn sống, bằng gỗ tuyết tùng, bằng cây bài hương[b] và bằng sợi chỉ đỏ thắm[c].
