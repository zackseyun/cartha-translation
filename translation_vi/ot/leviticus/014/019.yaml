  - severity: low
    issue: “giết con vật làm lễ thiêu”
    rationale: Cách này hiểu đúng ngữ cảnh, nhưng “giết” ít chuyên biệt hơn động từ שׁחט, và “làm lễ thiêu” không phải tên thuật ngữ nhất quán. “Sát tế con vật dùng làm lễ toàn thiêu” tự nhiên, chính xác trong nghi lễ, và vẫn nêu rõ đối tượng hàm ẩn.
