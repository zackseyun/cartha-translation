base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: vi
  text: Rồi thầy tế lễ sẽ dâng lễ vật chuộc tội[a] và cử hành nghi thức chuộc tội cho người đang được thanh tẩy khỏi ô uế của mình; sau đó, ông sẽ sát tế con vật dùng làm lễ toàn thiêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת trong các nghi lễ của sách Lê-vi có thể chỉ lễ vật dùng để thanh tẩy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: sẽ dâng
  rationale: Động từ có nghĩa cơ bản là “làm”, nhưng khi có một lễ vật làm tân ngữ, nó chỉ việc cử hành hay dâng sinh tế.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, quen thuộc trong ngữ cảnh nghi lễ Lê-vi.
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: Danh từ ở đây chỉ một loại sinh tế. Cách dịch này giữ tên gọi truyền thống, còn nghĩa nghi lễ thanh tẩy được ghi nhận trong chú thích.
- source_word: וְכִפֶּר עַל
  choice: làm lễ chuộc tội cho
  rationale: Diễn đạt chức năng nghi lễ của כפר mà không quy định một học thuyết riêng về cơ chế chuộc tội; עַל đánh dấu người được hưởng nghi lễ ấy.
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Phân từ Hitpael chỉ người đang trải qua tiến trình thanh tẩy; cách dịch giữ sắc thái tiến hành và phù hợp văn cảnh.
- source_word: מִטֻּמְאָתוֹ
  choice: khỏi tình trạng ô uế của mình
  rationale: טֻמְאָה tại đây là tình trạng ô uế theo nghi lễ. “Của mình” quy chiếu tự nhiên về người số ít đang được thanh tẩy.
- source_word: וְאַחַר
  choice: sau đó
  rationale: Đánh dấu trình tự kế tiếp trong thủ tục nghi lễ.
- source_word: יִשְׁחַט
  choice: sẽ giết con vật
  rationale: שׁחט là động từ chuyên dùng cho việc giết súc vật làm sinh tế. Bổ sung “con vật” để tiếng Việt tự nhiên và làm rõ đối tượng hàm chứa trong tên lễ vật.
- source_word: הָעֹלָה
  choice: con vật làm lễ thiêu
  rationale: עֹלָה là lễ thiêu; trong cấu trúc với שׁחט, từ này hoán dụ chỉ con vật được dùng cho lễ ấy. Cách dịch tránh cách nói thiếu tự nhiên “giết lễ thiêu”.
theological_decisions:
- issue: Cách dịch חַטָּאת trong ngữ cảnh nghi lễ thanh tẩy
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: חַטָּאת là tên một loại sinh tế và có thể nhấn mạnh chức năng thanh tẩy trong sách Lê-vi. Bản chính giữ thuật ngữ quen thuộc “lễ vật chuộc tội”, đồng thời chú thích bảo tồn cách hiểu “lễ vật thanh tẩy” thích hợp với văn cảnh ô uế nghi lễ.
- issue: Ý nghĩa của כפר
  choice: làm lễ chuộc tội cho
  alternative: thực hiện nghi thức thanh tẩy cho
  rationale: Cách dịch giữ sức nặng nghi lễ-thần học của động từ nhưng không xác định một lý thuyết riêng về sự chuộc tội.
- issue: Đại từ sở hữu giống đực số ít trong מִטֻּמְאָתוֹ
  choice: của mình
  alternative: của người ấy
  rationale: Tiếng Việt không đánh dấu giống ở đại từ phản thân. “Của mình” vẫn giữ tham chiếu số ít đến chính người đang được thanh tẩy mà không thêm giới tính không cần thiết vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ”, “lễ vật chuộc tội”, “lễ thiêu” làm thuật ngữ nghi lễ nhất quán; diễn đạt “tình trạng ô uế” để làm rõ đây là phạm trù nghi lễ, không phải nhận xét về vệ sinh.
