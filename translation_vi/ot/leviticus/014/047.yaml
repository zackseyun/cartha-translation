source:
  edition: WLC
  text: וְ/הַ/שֹּׁכֵ֣ב בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָ֑י/ו וְ/הָ/אֹכֵ֣ל בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: vi
  text: Ai nằm trong nhà ấy thì phải giặt quần áo mình[a]; ai ăn trong nhà ấy cũng phải giặt quần áo mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ai ngủ trong nhà ấy.” Động từ Hê-bơ-rơ có thể mang nghĩa “nằm” hoặc “ngủ”; “nằm” rộng nghĩa hơn và phù hợp với ngữ cảnh luật lệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: Ai nằm
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ chung bất cứ người nào. “Nằm” giữ nghĩa rộng của שׁכב, không buộc phải hiểu là thực sự ngủ.
- source_word: בַּבַּיִת
  choice: trong nhà ấy
  rationale: Cụm từ chỉ địa điểm; “ấy” làm rõ đây là căn nhà đang được nói đến trong ngữ cảnh luật lệ.
- source_word: יְכַבֵּס
  choice: thì phải giặt
  rationale: Thể vị hoàn thành trong văn luật tế lễ diễn tả nghĩa vụ; “phải giặt” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אֶת־בְּגָדָיו
  choice: quần áo mình
  rationale: בֶּגֶד chỉ y phục. Đại từ phản thân “mình” tự nhiên trong tiếng Việt, giữ số ít và không áp đặt giới tính mà tiếng Việt không cần biểu thị.
- source_word: וְהָאֹכֵל
  choice: ai ăn ... cũng
  rationale: Phân từ có mạo từ mang nghĩa khái quát tương ứng với mệnh đề đầu; cấu trúc “ai... cũng...” diễn đạt mạch luật lệ tự nhiên.
theological_decisions:
- issue: Cách thể hiện dạng giống đực số ít dùng theo nghĩa khái quát trong luật lệ
  choice: Dùng “ai ... quần áo mình”
  alternative: Dùng “người nào ... quần áo của người ấy” hoặc “người nam nào ... quần áo mình”
  rationale: Tiếng Hê-bơ-rơ dùng dạng giống đực số ít theo nghĩa đại diện, không nhất thiết giới hạn ở nam giới. Tiếng Việt không đánh dấu giống ngữ pháp trong “ai” và “mình”, nên cách dịch này bảo toàn phạm vi khái quát mà không thêm một giới hạn không có trong văn bản.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “phải” để diễn đạt nghĩa vụ rõ ràng; lược liên từ mở đầu theo cú pháp tiếng Việt, đồng thời dùng “cũng” để giữ quan hệ song song giữa hai mệnh đề.
