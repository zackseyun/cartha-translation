  source_fidelity: 'Bản dịch truyền đạt đúng hai mệnh đề song song của tiếng Hê-bơ-rơ: người nằm trong nhà và người ăn trong nhà đều có nghĩa vụ giặt quần áo. “Nằm” bảo toàn nghĩa rộng của שׁכב, không thu hẹp thành “ngủ”; “phải giặt” diễn đạt thích đáng sắc thái quy định của thể chưa hoàn thành trong văn luật tế lễ.'
