base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: vi
  text: Nhưng nếu vết bệnh[a] trở lại và lan ra trong nhà sau khi người ta đã gỡ các viên đá, sau khi đã cạo nhà, và sau khi đã trát nhà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tình trạng nhiễm bệnh” hoặc “bệnh chứng”. Từ Hê-bơ-rơ negaʿ là một thuật ngữ trong sách Lê-vi ký chỉ tình trạng bất thường có dấu hiệu thấy được, có thể ảnh hưởng đến người, quần áo hoặc nhà cửa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một trường hợp có điều kiện tiếp nối quy trình pháp lý trước đó; “Nhưng nếu” diễn đạt cả ý nối kết lẫn sự chuyển sang tình huống trái với kết quả mong đợi.
- source_word: יָשׁוּב הַנֶּגַע
  choice: vết bệnh trở lại
  rationale: שוב chỉ sự tái xuất hiện; נגע là thuật ngữ chỉ tình trạng bất thường có dấu hiệu thấy được trên người, đồ vật hoặc nhà cửa.
- source_word: וּפָרַח
  choice: và lan ra
  rationale: Động từ có nghĩa gốc là nảy hoặc mọc, nhưng trong ngữ cảnh tình trạng trên nhà diễn tả sự bùng phát hay lan rộng; “lan ra” tự nhiên và phù hợp với hiện tượng trên bề mặt.
- source_word: בַּבַּיִת
  choice: trong nhà
  rationale: Giới từ ב mang nghĩa vị trí; “trong nhà” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אַחַר חִלֵּץ אֶת־הָאֲבָנִים
  choice: sau khi người ta đã gỡ các viên đá
  rationale: חלץ trong ngữ cảnh này chỉ việc lấy các viên đá bị ảnh hưởng ra khỏi kết cấu. Chủ thể không được nêu rõ trong cấu trúc nguyên ngữ, nên dùng “người ta” để tránh quy định quá mức.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת־הַבַּיִת
  choice: cạo nhà
  rationale: Dạng động từ ở đây chỉ việc cạo các bề mặt của nhà theo quy trình đã truyền; giữ hành động vật lý cụ thể thay vì khái quát thành “làm sạch”.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: và trát lại
  rationale: טוח chỉ việc trát hoặc phủ vữa. “Trát lại” tự nhiên trong tiếng Việt và cho thấy đây là bước phục hồi sau khi cạo.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ, trang trọng nhưng dễ hiểu. Giữ nguyên câu điều kiện chưa hoàn tất vì câu tiếp tục sang câu 44. Dùng “vết bệnh” thay vì cách gọi chẩn đoán hiện đại cụ thể, nhằm bảo toàn phạm vi rộng và tính kỹ thuật của נגע.
