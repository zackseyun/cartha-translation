  yaml_path: translation/ot/leviticus/014/056.yaml
  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: vi
  text: và về chỗ sưng[a], mảng vảy[b], và đốm sáng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vùng da nhô lên” hoặc “chỗ nổi lên”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mảng phát ban” hoặc “chỗ đóng vảy”; nghĩa da liễu chính xác của từ Hê-bơ-rơ này không chắc chắn.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “mảng sáng” hoặc, theo ngữ cảnh, “đốm trắng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: chỗ sưng
  rationale: Trong ngữ cảnh Lê-vi Ký 13–14, từ này chỉ một vùng da nhô lên hoặc sưng lên. “Chỗ sưng” ngắn gọn, tự nhiên và không khẳng định quá mức một chẩn đoán y khoa cụ thể.
- source_word: סַפַּחַת
  choice: mảng nổi vảy
  rationale: Từ này chỉ một dạng tổn thương hoặc mảng phát ra trên da, nhưng ý nghĩa da liễu chính xác không chắc chắn. “Mảng nổi vảy” giữ được sắc thái của một vùng da có biểu hiện bề mặt mà không đồng nhất nó với một bệnh hiện đại cụ thể.
- source_word: בֶּהֶרֶת
  choice: đốm sáng
  rationale: Danh từ này nhấn mạnh vẻ sáng hoặc nhạt màu của một đốm trên da. “Đốm sáng” bám sát nghĩa từ vựng hơn “đốm trắng”, vì màu trắng chủ yếu được làm rõ bởi ngữ cảnh rộng hơn.
- source_word: וְ/לַ
  choice: và về
  rationale: Liên từ kết hợp với giới từ tiếp tục danh sách tóm lược các trường hợp thuộc phạm vi luật lệ ở những câu trước. “Và về” giữ được mối nối cú pháp và văn phong liệt kê pháp lý.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc ngắn gọn, mang tính liệt kê, được giữ để nối tự nhiên với phần tóm lược luật lệ ở câu trước. Các thuật ngữ không được đồng nhất với chẩn đoán da liễu hiện đại.
