  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: vi
  text: Đây là luật dành cho người mắc chứng bệnh ngoài da[a] mà không đủ khả năng lo liệu việc thanh tẩy của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ צָרָעַת theo truyền thống thường được dịch là “bệnh phong”, nhưng trong Lê-vi Ký, từ này chỉ rộng hơn, bao gồm nhiều tình trạng ngoài da nghiêm trọng và các tình trạng ô uế theo nghi lễ có liên quan.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “tay người ấy không với tới trong việc thanh tẩy của mình”, một thành ngữ có nghĩa là người ấy không đủ phương tiện để lo liệu lễ vật thanh tẩy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: luật
  rationale: Trong văn liệu tư tế, từ này chỉ quy định hoặc thủ tục đã được ấn định; “luật” ngắn gọn, trang trọng và phù hợp ngữ cảnh.
- source_word: בּוֹ נֶגַע צָרָעַת
  choice: người mắc chứng bệnh ngoài da
  rationale: Cách dịch tự nhiên trong tiếng Việt, diễn đạt tình trạng hiện diện nơi người ấy mà không đồng nhất צָרָעַת với bệnh Hansen hiện đại.
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: không đủ khả năng lo liệu
  rationale: Đây là thành ngữ nói về phương tiện hoặc nguồn lực không đủ; chuyển nghĩa thành cách nói tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: בְּטָהֳרָתוֹ
  choice: việc thanh tẩy mình
  rationale: “Thanh tẩy” giữ sắc thái nghi lễ của tiến trình được quy định trong ngữ cảnh, thay vì gợi ý đơn thuần là vệ sinh thân thể.
theological_decisions:
- issue: Phạm vi nghĩa của צָרָעַת
  choice: chứng bệnh ngoài da
  alternative: bệnh phong
  rationale: Trong Lê-vi Ký, thuật ngữ này bao quát một nhóm hiện tượng nghi lễ và ngoài da, không thể xác định đơn giản là bệnh phong theo nghĩa y học hiện đại.
- issue: Ý nghĩa của sự thanh tẩy
  choice: thanh tẩy theo nghi lễ
  alternative: chữa khỏi bệnh
  rationale: Câu này nói đến khả năng lo liệu những gì cần cho thủ tục thanh tẩy, không khẳng định lễ vật là phương tiện chữa bệnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc được làm tự nhiên; “thanh tẩy” duy trì sắc thái nghi lễ, còn chú thích bảo tồn hình ảnh thành ngữ Hê-bơ-rơ và sự không chắc chắn về thuật ngữ bệnh lý.
