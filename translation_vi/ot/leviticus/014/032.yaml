revisions:
- from: Đây là luật dành cho người mắc chứng bệnh ngoài da[a] nhưng không đủ khả năng lo liệu việc thanh tẩy mình[b].
  to: Đây là luật dành cho người mắc chứng bệnh ngoài da[a] mà không đủ khả năng lo liệu việc thanh tẩy của mình[b].
  rationale: Chỉnh nhẹ liên từ và sở hữu cách để phản ánh đúng quan hệ mệnh đề trong tiếng Hê-bơ-rơ và cho câu tiếng Việt mạch lạc hơn. Chú thích a được biên tập để tự nhiên, song song về cấu trúc, và vẫn duy trì sự thận trọng cần thiết đối với phạm vi nghĩa của צָרָעַת. Không thay đổi ý nghĩa nghi lễ hay thêm diễn giải giáo phái.
  reviewer_model: gpt-5.6-terra
