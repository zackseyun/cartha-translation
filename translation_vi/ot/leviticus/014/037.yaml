base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: vi
  text: Thầy tế lễ phải xem xét vết nhiễm ấy. Nếu trên các vách nhà có những chỗ lõm[a] màu xanh lục nhạt hoặc hơi đỏ, và các chỗ ấy có vẻ thấp hơn bề mặt vách[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những chỗ hõm.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “thấp hơn vách,” tức là trông như lõm xuống dưới bề mặt vách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: phải xem xét
  rationale: Trong thủ tục chẩn định của giới tế lễ, động từ ראה mang nghĩa kiểm tra, xem xét chứ không chỉ đơn thuần là nhìn thấy.
- source_word: הַנֶּגַע
  choice: vết nhiễm
  rationale: נגע ở Lê-vi Ký 13–14 chỉ một vùng bất thường cần được chẩn định; “vết nhiễm” phù hợp cả với bề mặt vách nhà và tránh sắc thái dịch bệnh lan rộng của “ôn dịch”.
- source_word: וְהִנֵּה
  choice: nếu
  rationale: Trong văn luật lệ mang tính thủ tục, וְהִנֵּה giới thiệu tình trạng được phát hiện khi xem xét; “nếu” diễn đạt tự nhiên chức năng điều kiện trong tiếng Việt.
- source_word: בְּקִירֹת הַבַּיִת
  choice: trên các vách nhà
  rationale: Tiếng Việt tự nhiên dùng “trên vách” để nói về dấu vết xuất hiện ở bề mặt vách, trong khi phần sau vẫn cho biết vết ấy trông như ăn sâu xuống dưới bề mặt.
- source_word: שְׁקַעֲרוּרֹת
  choice: những chỗ lõm
  rationale: Từ hiếm này chỉ các vùng hõm hoặc lõm xuống; “những chỗ lõm” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: יְרַקְרַקֹּת
  choice: xanh xanh
  rationale: Dạng lặp âm diễn tả sắc xanh nhạt hoặc ngả xanh, không nhất thiết là màu xanh thuần đậm; cách nói “xanh xanh” giữ được sắc thái giảm nhẹ và song song với “đỏ đỏ”.
- source_word: אֲדַמְדַּמֹּת
  choice: đỏ đỏ
  rationale: Dạng lặp âm diễn tả sắc hơi đỏ; “đỏ đỏ” bảo tồn hình thức và sắc thái của nguyên ngữ mà không xác định quá mức một gam màu cụ thể.
- source_word: וּמַרְאֵיהֶן
  choice: và trông chúng
  rationale: מראה ở đây nói đến diện mạo nhìn thấy được; “trông chúng” tự nhiên hơn cách danh từ hóa nặng nề trong tiếng Việt.
- source_word: שָׁפָל מִן הַקִּיר
  choice: thấp hơn bề mặt vách
  rationale: Nguyên văn là “thấp hơn vách”; thêm “bề mặt” làm rõ tiêu chuẩn thị giác rằng các chỗ ấy có vẻ lõm xuống, đồng thời chú thích bảo tồn nghĩa đen.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” để làm rõ chủ thể được tiếp nối từ ngữ cảnh trước; câu được tách sau mệnh đề đầu cho tự nhiên trong tiếng Việt, nhưng vẫn giữ dấu phẩy cuối vì câu cú pháp tiếp tục sang câu kế tiếp. Các dạng màu lặp “xanh xanh” và “đỏ đỏ” cố ý phản ánh sắc thái giảm nhẹ trong nguyên ngữ.
