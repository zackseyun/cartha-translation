reference: Leviticus 14:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: vi
  text: Thầy tế lễ sẽ lấy một ít dầu trong lòng bàn tay mình, bôi lên dái tai phải của người đang được thanh tẩy, lên ngón cái của bàn tay phải và ngón cái của bàn chân phải của người ấy, ngay tại chỗ có huyết của lễ vật chuộc lỗi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngay tại chỗ huyết của lễ vật chuộc lỗi đã được bôi.”'
    reason: Nguyên văn dùng cụm danh từ “tại chỗ của huyết lễ vật chuộc lỗi”; theo nghi thức ở câu trước, điều này có thể được diễn đạt rõ là chỗ huyết đã được bôi.
lexical_decisions:
- source_word: וְנָתַן
  choice: bôi
  rationale: נתן có nghĩa rộng là “đặt/để/trao”; trong nghi thức bôi dầu lên các bộ phận cơ thể, “bôi” diễn đạt tự nhiên và đúng hành động theo ngữ cảnh.
- source_word: מִן הַשֶּׁמֶן
  choice: một ít dầu
  rationale: Giới từ מן mang nghĩa phân lượng, nên “một ít dầu” tự nhiên hơn cách dịch sát chữ “từ dầu”.
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: trong lòng bàn tay mình
  rationale: כף ở đây chỉ lòng bàn tay, nơi vị tế lễ đang giữ dầu; tiếng Việt tự nhiên dùng “trong lòng bàn tay” dù tiếng Hê-bơ-rơ dùng giới từ עַל.
- source_word: תְּנוּךְ אֹזֶן
  choice: dái tai
  rationale: Trong các đoạn nghi lễ của Ngũ Kinh, תנוך chỉ phần dái tai; đây là cách gọi giải phẫu rõ ràng, phổ thông.
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Phân từ Hitpael mô tả người đang trải qua tiến trình thanh tẩy theo nghi lễ, không chỉ một tình trạng đã hoàn tất.
- source_word: בֹּהֶן יָדוֹ
  choice: ngón cái bàn tay
  rationale: בֹּהֶן khi nói về bàn tay là ngón cái; cách diễn đạt này rõ nghĩa trong chuỗi bộ phận cơ thể.
- source_word: בֹּהֶן רַגְלוֹ
  choice: ngón cái bàn chân
  rationale: Khi nói về bàn chân, בֹּהֶן chỉ ngón chân cái; “ngón cái bàn chân” tự nhiên và song song với “ngón cái bàn tay”.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: ngay tại chỗ có huyết của lễ chuộc lỗi
  rationale: מקום là “chỗ/nơi”; câu nói đến vị trí của huyết lễ chuộc lỗi. “Có huyết” giữ gần cấu trúc danh từ của nguyên văn mà vẫn dễ hiểu, còn ý huyết đã được bôi tại đó được nêu như một cách hiểu trong chú thích.
theological_decisions:
- issue: Cách dịch אָשָׁם
  choice: lễ chuộc lỗi
  alternative: lễ bồi hoàn
  rationale: אָשָׁם vừa liên quan đến lỗi phạm vừa có thể nhấn mạnh sự bồi hoàn. “Lễ chuộc lỗi” là thuật ngữ dễ nhận biết trong ngữ cảnh tế lễ Lê-vi, nhưng không loại bỏ sắc thái bồi hoàn của từ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “thầy tế lễ” cho הַכֹּהֵן, “thanh tẩy” cho tiến trình làm sạch theo nghi lễ, và lặp cấu trúc các bộ phận bên phải để giữ nhịp liệt kê của nguyên văn.
