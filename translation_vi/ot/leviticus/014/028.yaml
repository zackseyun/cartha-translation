revisions:
- from: Thầy tế lễ sẽ lấy một ít dầu trong lòng bàn tay mình, bôi lên dái tai phải của người đang được thanh tẩy, lên ngón cái bàn tay phải và ngón cái bàn chân phải của người ấy, ngay tại chỗ có huyết của lễ chuộc lỗi.[a]
  to: Thầy tế lễ sẽ lấy một ít dầu trong lòng bàn tay mình, bôi lên dái tai phải của người đang được thanh tẩy, lên ngón cái của bàn tay phải và ngón cái của bàn chân phải của người ấy, ngay tại chỗ có huyết của lễ vật chuộc lỗi.[a]
  rationale: Sửa nhẹ cú pháp chỉ các ngón và làm rõ rằng אָשָׁם là lễ vật. Giữ “ngay tại chỗ có huyết” trong bản văn để gần với cụm danh từ tiếng Hê-bơ-rơ, đồng thời giữ chú thích nêu cách diễn đạt theo ngữ cảnh trước đó.
