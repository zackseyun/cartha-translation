id: LEV.14.12
reference: Leviticus 14:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: vi
  text: Rồi thầy tế lễ phải lấy một con chiên đực, dâng nó làm lễ vật chuộc lỗi[a] cùng với một lôg dầu[b], và làm nghi thức đưa qua đưa lại cho cả hai trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật bồi thường.”
    reason: lexical_alternative
  - marker: b
    text: “Lôg” là một đơn vị đo chất lỏng nhỏ được dùng trong hệ thống nghi lễ của Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ... phải lấy
  rationale: Liên từ waw nối tiếp trình tự nghi lễ; “rồi” diễn đạt bước kế tiếp, còn “phải” giữ sắc thái quy định.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi tự nhiên, quen thuộc trong tiếng Việt đối với chức vụ tư tế trong bối cảnh nghi lễ Israel.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: một con chiên đực
  rationale: כֶּבֶשׂ chỉ chiên non, thường là con đực trong ngữ cảnh tế lễ; “một” nhận diện con vật được chọn trong số các lễ vật đã nêu.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: dâng nó
  rationale: הקריב ở đây là đem đến hoặc trình dâng làm lễ vật, chưa nhất thiết mô tả toàn bộ hành động hiến tế.
- source_word: לְאָשָׁם
  choice: làm lễ vật chuộc lỗi
  rationale: אָשָׁם là thuật ngữ tế lễ kỹ thuật; “lễ vật chuộc lỗi” vừa quen thuộc vừa giữ ý liên quan đến lỗi phạm, trong khi chú thích bảo lưu nghĩa bồi thường.
- source_word: לֹג הַשָּׁמֶן
  choice: một lôg dầu
  rationale: לֹג là đơn vị đo chất lỏng cụ thể. Phiên âm tên đơn vị thay vì đổi sang một dung tích hiện đại không chắc chắn.
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: đưa cả hai qua lại làm lễ vật đưa qua lại
  rationale: Giữ mối liên hệ giữa động từ הניף và danh từ תְּנוּפָה, đồng thời diễn tả rõ động tác trình dâng mang tính nghi lễ; “cả hai” làm rõ đại từ số nhiều chỉ con chiên và phần dầu.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Diễn đạt công thức nghi lễ לִפְנֵי và giữ nguyên danh riêng giao ước יהוה theo dạng Yahweh.
theological_decisions:
- issue: Nghĩa của אָשָׁם trong hệ thống tế lễ
  choice: lễ vật chuộc lỗi
  alternative: lễ vật bồi thường
  rationale: Từ này vừa gắn với tình trạng mắc lỗi vừa có thể nhấn mạnh việc đền bù. Bản chính dùng thuật ngữ quen thuộc, còn chú thích giữ phương án nhấn mạnh tính bồi thường.
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
translation_notes:
  register: Văn phong quy định nghi lễ, trang trọng nhưng dễ hiểu. Cụm “đưa qua lại” được dùng thay cho từ ít thông dụng hơn như “dao động” hoặc “phất,” và các dấu chú thích [a], [b] được đặt đúng ngay sau thuật ngữ liên quan.
