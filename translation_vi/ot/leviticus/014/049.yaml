  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: vi
  text: Ông phải lấy hai con chim, gỗ tuyết tùng, sợi chỉ đỏ thắm[b] và kinh giới để thanh tẩy căn nhà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để tẩy sạch căn nhà.” Động từ Hê-bơ-rơ ở đây nói đến việc thanh tẩy khỏi tình trạng ô uế theo nghi lễ.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “sợi len đỏ thắm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Ông phải lấy
  rationale: Trong chuỗi chỉ dẫn nghi lễ, động từ hoàn thành có waw mang sắc thái quy định; “phải lấy” diễn đạt tự nhiên lực tình thái ấy trong tiếng Việt.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: để làm lễ thanh tẩy căn nhà
  rationale: Dạng piel của חטא ở đây chỉ việc loại bỏ tình trạng ô uế theo nghi lễ. Cách dịch này giữ rõ bình diện nghi lễ nhưng không thêm “khỏi tội lỗi” vào câu chính, vì đối tượng là căn nhà chứ không phải một tác nhân đạo đức.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: hai con chim
  rationale: Dịch đúng lượng từ và danh từ trong câu, không thêm ý “còn sống” vốn không được nêu tại câu này.
- source_word: וְעֵץ אֶרֶז
  choice: gỗ tuyết tùng
  rationale: Cách gọi tự nhiên, quen thuộc của vật liệu bằng gỗ cedar trong tiếng Việt Kinh Thánh.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: sợi chỉ đỏ thắm
  rationale: Cụm Hê-bơ-rơ chỉ vật liệu được nhuộm màu đỏ thắm; “sợi chỉ” phù hợp với một vật dùng trong nghi lễ, đồng thời chú thích bảo lưu khả năng hiểu là sợi len.
- source_word: וְאֵזֹב
  choice: cây kinh giới
  rationale: Dùng tên gọi truyền thống, dễ nhận biết trong tiếng Việt cho אֵזוֹב, dù việc xác định chính xác loài thực vật cổ này vẫn còn bất định.
theological_decisions:
- issue: Ý nghĩa nghi lễ của לְחַטֵּא khi căn nhà là đối tượng
  choice: làm lễ thanh tẩy căn nhà
  alternative: thanh tẩy căn nhà khỏi tội lỗi; chuộc tội cho căn nhà
  rationale: Ngữ cảnh Lê-vi Ký 14 nói về việc khử tình trạng ô uế nghi lễ của một căn nhà. “Làm lễ thanh tẩy” bảo toàn phạm trù nghi lễ, không biến căn nhà thành chủ thể có tội về mặt đạo đức và cũng không áp đặt ý niệm chuộc tội vốn không được phát biểu rõ trong câu này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, theo lối chỉ dẫn nghi lễ. Trật tự câu được điều chỉnh tự nhiên cho tiếng Việt, đưa mục đích “để làm lễ thanh tẩy căn nhà” xuống cuối câu; không thêm “còn sống” vào “hai con chim” và không xác quyết quá mức về cơ chế thần học.
