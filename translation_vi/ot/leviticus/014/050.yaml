  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: vi
  text: Rồi người ấy phải giết một con chim vào trong một bình bằng đất nung, trên nước chảy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “nước sống”; tức nước chảy, nước từ nguồn.'
    reason: Giải thích thành ngữ Hê-bơ-rơ מַיִם חַיִּים, đồng thời bảo lưu cách diễn đạt sát nguyên văn.
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Rồi người ấy phải giết
  rationale: Liên từ với động từ trong chuỗi chỉ dẫn nghi lễ mang ý nghĩa tiếp nối; “rồi” diễn đạt trình tự, còn “phải giết” thể hiện tính chỉ thị. Tiếng Việt không có một động từ thông dụng tương ứng chính xác với sắc thái giết trong nghi lễ, nên dùng “giết” tự nhiên và không thêm ý hiến tế vốn không được nêu rõ ở đây.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: một con chim
  rationale: Cụm từ xác định một con để phân biệt với con còn lại. Cách dịch này tự nhiên trong tiếng Việt và không biến nó thành “con thứ nhất”, vì nguyên văn không dùng số thứ tự.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: trên một bình đất nung
  rationale: אֶל hướng hành động về phía bình, với hàm ý việc giết được thực hiện để chất lỏng đi vào bình. Trong tiếng Việt, dịch máy móc là “giết vào trong bình” không tự nhiên; “trên một bình” diễn đạt tư thế thực hiện nghi thức mà không nói rõ thêm “máu”, từ không xuất hiện trong câu.
- source_word: עַל
  choice: bên trên
  rationale: Giữ quan hệ không gian của giới từ עַל giữa việc giết trong/ở bình và nước, đồng thời tránh giải thích quá mức cấu tạo của nghi thức.
- source_word: מַיִם חַיִּים
  choice: nước sống
  rationale: Giữ sát thành ngữ Hê-bơ-rơ, theo nghĩa đen là “nước sống”. Chú thích giải thích nghĩa chỉ nước tươi mới hoặc nước chảy mà không xóa bỏ âm hưởng và độ mở của cách nói nguyên văn.
theological_decisions:
- issue: Cách dịch מַיִם חַיִּים trong quy định thanh tẩy
  choice: nước sống
  alternative: nước chảy; nước sạch và tươi mới
  rationale: Trong ngữ cảnh nghi lễ, cụm từ thường chỉ nước từ nguồn đang chảy hoặc nước tươi mới, không tù đọng. Tuy nhiên, giữ “nước sống” trong chính văn bảo toàn hình ảnh nguyên ngữ và những liên hệ Kinh Thánh rộng hơn; chú thích cung cấp nghĩa thông thường mà không áp đặt một cách hiểu thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bình đất nung” tự nhiên hơn “dụng cụ bằng đất” trong tiếng Việt. Cấu trúc giới từ được giữ tương đối sát để không thêm chi tiết như máu hay miệng bình, dù cách diễn đạt nghi lễ này hơi khác lời nói hằng ngày.
