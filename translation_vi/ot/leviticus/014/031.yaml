  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: vi
  text: tùy theo khả năng của mình[a], một con làm lễ vật chuộc tội[b], một con làm lễ thiêu, cùng với lễ vật ngũ cốc. Thầy tế lễ sẽ làm lễ chuộc tội cho người đang được thanh tẩy trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hê-bơ-rơ, nghĩa đen là “điều tay người ấy với tới”, tức là điều người ấy có khả năng lo liệu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lễ vật thanh tẩy”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: tùy theo khả năng của mình
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “điều tay người ấy với tới”, chỉ những gì nằm trong khả năng tài chính của người ấy. Cách dịch này tự nhiên trong tiếng Việt và phù hợp với mạch câu tiếp nối từ câu trước.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Đây là thuật ngữ tế lễ quen thuộc trong sách Lê-vi; cách dịch giữ được liên hệ với tội lỗi, đồng thời chú thích nêu cách hiểu theo chức năng thanh tẩy.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ chỉ lễ vật được thiêu dâng trọn vẹn; “lễ thiêu” là cách gọi ngắn gọn, rõ ràng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: עַל הַמִּנְחָה
  choice: cùng với lễ vật ngũ cốc
  rationale: Trong thủ tục tế lễ ở đây, עַל diễn tả sự đi kèm hoặc bổ sung, không phải vị trí ở trên. “Cùng với” thể hiện quan hệ này tự nhiên.
- source_word: וְכִפֶּר
  choice: sẽ làm lễ chuộc tội
  rationale: Cách dịch bảo toàn sắc thái nghi lễ của động từ כפר mà không áp đặt một lý thuyết thần học cụ thể về sự chuộc tội.
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Phân từ chỉ người đang trải qua tiến trình thanh tẩy theo nghi lễ; cách dịch giữ được tính tiếp diễn và thể bị động theo ngữ cảnh.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Diễn đạt trực tiếp ý “trước mặt/trong sự hiện diện của” và giữ nguyên danh riêng Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng chuyển tự của danh Đức Chúa Trời, phù hợp với quy ước dự án và phân biệt danh riêng với tước hiệu.
theological_decisions:
- issue: Cách dịch thuật ngữ חַטָּאת trong nghi lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: “Lễ vật chuộc tội” duy trì thuật ngữ tế lễ truyền thống và mối liên hệ từ vựng với tội lỗi; “lễ vật thanh tẩy” vẫn là cách hiểu khả dĩ theo chức năng nghi lễ nên được bảo lưu trong chú thích.
- issue: Cách diễn đạt כפר mà không thu hẹp ý nghĩa thần học
  choice: làm lễ chuộc tội
  alternative: thực hiện sự thanh tẩy
  rationale: Bản dịch giữ ngôn ngữ nghi lễ và thần học của bản Hê-bơ-rơ, nhưng không xác định cơ chế chuộc tội vượt quá điều câu này nói.
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Dùng danh riêng được chuyển tự để phản ánh trực tiếp văn bản nguồn và theo quy ước của dự án.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mở đầu được giữ như một phần tiếp nối của câu 30 trong nguyên văn. Dùng “một con” vì các lễ vật đang nói đến là chim; đặt chú thích [b] ngay sau thuật ngữ mà chú thích giải thích.
