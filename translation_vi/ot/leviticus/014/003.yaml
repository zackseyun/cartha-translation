  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: vi
  text: Thầy tế lễ phải ra ngoài trại, rồi khám người ấy; và kìa, vết bệnh ngoài da[a] đã lành khỏi người mắc bệnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “bệnh phong đã lành khỏi người mắc bệnh phong.” Các từ Hê-bơ-rơ ở đây chỉ một phạm vi bệnh trạng hoặc tổn thương ngoài da rộng hơn, không nhất thiết là bệnh phong (bệnh Hansen) theo nghĩa hiện đại.'
    reason: Giải thích cách dịch rộng, không đồng nhất thuật ngữ nghi lễ cổ với một bệnh cụ thể trong y học hiện đại.
lexical_decisions:
- source_word: וְיָצָא
  choice: phải đi ra
  rationale: Trong văn cảnh luật lệ và nghi thức, động từ chỉ hành động được quy định; “phải” diễn đạt nghĩa bắt buộc tự nhiên trong tiếng Việt.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu đối với chức vụ tư tế trong bối cảnh Lê-vi Ký; sự lặp lại của tiếng Hê-bơ-rơ được giữ lại.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Diễn đạt tự nhiên hướng chuyển động đến khu vực bên ngoài trại.
- source_word: וְרָאָה
  choice: sẽ khám người ấy
  rationale: ראה có nghĩa cơ bản là “thấy, xem”, nhưng trong luật kiểm tra bệnh trạng, “khám” truyền đạt đúng hành động xem xét để đưa ra phán định.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ sắc thái trình bày điều được phát hiện khi khám, thay vì chuyển hẳn thành một mệnh đề điều kiện.
- source_word: נִרְפָּא
  choice: đã lành
  rationale: Dạng Niphal diễn tả trạng thái kết quả sau khi được chữa lành; “đã lành” tự nhiên và không nhất thiết xác định tác nhân.
- source_word: נֶגַע הַצָּרַעַת
  choice: vết bệnh ngoài da
  rationale: נגע chỉ vết hoặc chứng bệnh, còn צרעת là một phạm trù bệnh trạng gây ô uế theo nghi lễ, rộng hơn bệnh phong hiện đại.
- source_word: מִן הַצָּרוּעַ
  choice: trên người mắc bệnh
  rationale: Trong ngữ cảnh này מן biểu thị bệnh đã rời khỏi người mắc; tiếng Việt diễn đạt tự nhiên trạng thái được quan sát là vết bệnh “trên người” ấy đã lành.
theological_decisions:
- issue: Cách dịch צָרַעַת và צָרוּעַ
  choice: bệnh ngoài da / người mắc bệnh
  alternative: bệnh phong / người phong cùi
  rationale: Thuật ngữ Hê-bơ-rơ bao gồm nhiều dạng tổn thương hoặc bệnh trạng liên quan đến sự ô uế nghi lễ, không đồng nhất chắc chắn với bệnh Hansen hiện đại. Bản dịch tránh áp đặt một chẩn đoán y khoa sai niên đại, đồng thời ghi cách dịch truyền thống trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại “thầy tế lễ” và từ giới thiệu phát hiện “kìa” để phản ánh cấu trúc Hê-bơ-rơ, nhưng dùng “khám” và “vết bệnh ngoài da” cho rõ nghĩa trong văn cảnh.
