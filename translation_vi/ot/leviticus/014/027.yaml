  text: וְ/הִזָּ֤ה הַ/כֹּהֵן֙ בְּ/אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: vi
  text: Rồi thầy tế lễ dùng ngón tay phải rảy một ít dầu trong lòng bàn tay trái mình bảy lần trước mặt Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: Rồi ... rảy
  rationale: Dạng Hiphil của נזה trong nghi lễ có nghĩa là “rảy”; “Rồi” diễn đạt tự nhiên trình tự thủ tục do liên từ וְ đánh dấu.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách dịch chuẩn, rõ nghĩa trong tiếng Việt hiện đại cho chức vụ כֹּהֵן.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: dùng ngón tay phải
  rationale: Giữ số ít của אֶצְבַּע và sự nhấn mạnh phía bên phải; “dùng” diễn đạt tự nhiên chức năng công cụ của giới từ בְּ.
- source_word: מִן הַשֶּׁמֶן
  choice: một ít dầu
  rationale: 'מִן mang nghĩa bộ phận ở đây: chỉ một phần dầu được dùng để rảy.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: trong lòng bàn tay trái mình
  rationale: כַּף trong ngữ cảnh chỉ lòng bàn tay; tiếng Việt tự nhiên dùng “trong lòng bàn tay” khi nói dầu được chứa ở đó.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Cách diễn đạt đếm số lần trực tiếp và tự nhiên.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי chỉ hành động diễn ra trước sự hiện diện của Đức Chúa Trời trong bối cảnh nghi lễ; giữ nguyên danh giao ước Yahweh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn danh giao ước và phù hợp quyết định thần học đã cung cấp.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo cách gọi quen thuộc; câu giữ đầy đủ chi tiết về tay phải, lòng bàn tay trái, số lần và hành động trước mặt Yahweh.
