base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: vi
  text: Rồi thầy tế lễ phải ra lệnh lấy cho người đang được thanh tẩy hai con chim còn sống, thanh sạch, gỗ bá hương, sợi đỏ tươi[a] và cây bài hương[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chỉ đỏ tươi”. Cụm từ Hê-bơ-rơ này chỉ một vật liệu được nhuộm đỏ tươi, nhưng hình dạng chính xác của vật liệu ấy không rõ.
    reason: lexical_alternative
  - marker: b
    text: Không chắc “cây bài hương” chỉ chính xác loài thực vật nào; ở đây giữ cách gọi truyền thống.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: Rồi thầy tế lễ phải truyền
  rationale: Trong chỉ dẫn nghi lễ, waw kết hợp với động từ hoàn thành nối tiếp trình tự hành động; “Rồi” diễn đạt tự nhiên bước kế tiếp, còn “phải truyền” giữ sắc thái mệnh lệnh pháp quy.
- source_word: וְלָקַח
  choice: truyền lấy
  rationale: Dù động từ ở ngôi thứ ba số ít, sau động từ “truyền” nó được hiểu theo lối chỉ thị là phải lấy các vật phẩm; cách diễn đạt này không nhất thiết khẳng định chính thầy tế lễ tự tay lấy.
- source_word: לַמִּטַּהֵר
  choice: cho người đang được thanh tẩy
  rationale: Phân từ Hitpael chỉ người đang trải qua tiến trình thanh tẩy theo nghi lễ; “đang được thanh tẩy” giữ được sắc thái tiến trình và thụ động.
- source_word: שְׁתֵּי צִפֳּרִים חַיּוֹת טְהֹרוֹת
  choice: hai con chim sống và thanh sạch
  rationale: צִפּוֹר là từ khái quát chỉ chim, không nhất thiết là chim sẻ; “sống” và “thanh sạch” giữ hai phẩm tính được bản Hê-bơ-rơ nêu rõ, trong đó “thanh sạch” thuộc bối cảnh nghi lễ.
- source_word: עֵץ אֶרֶז
  choice: gỗ bá hương
  rationale: Cụm cấu tạo chỉ loại gỗ dùng trong nghi lễ; “gỗ bá hương” là cách gọi truyền thống, trang trọng và dễ hiểu trong tiếng Việt Kinh Thánh.
- source_word: שְׁנִי תוֹלַעַת
  choice: chỉ đỏ tươi
  rationale: Thành ngữ chỉ vật liệu được nhuộm màu đỏ tươi bằng phẩm nhuộm có nguồn gốc từ côn trùng; “chỉ” diễn đạt rõ vật liệu nghi lễ, nhưng hình dạng chính xác không hoàn toàn chắc chắn nên có chú thích.
- source_word: אֵזֹב
  choice: cây bài hương
  rationale: Giữ tên gọi truyền thống của loài cây dùng trong nghi lễ, đồng thời chú thích rằng việc xác định chính xác loài thực vật vẫn chưa chắc chắn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ thuật ngữ Lê-vi “thanh sạch” cùng tên gọi truyền thống “bá hương” và “bài hương”. Cấu trúc câu thể hiện chuỗi chỉ dẫn nghi lễ mà không buộc phải hiểu thầy tế lễ đích thân lấy các vật phẩm.
