base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: vi
  text: Rồi thầy tế lễ phải thả con chim còn sống ra ngoài thành, vào đồng trống. Như vậy, thầy tế lễ sẽ làm lễ chuộc tội cho ngôi nhà[a], và nhà ấy sẽ được thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thanh tẩy ngôi nhà” hoặc “làm lễ xá tội cho ngôi nhà.” Tiếng Hê-bơ-rơ dùng thuật ngữ chuộc tội trong nghi lễ, trong bối cảnh thanh sạch này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: Rồi thầy tế lễ phải thả
  rationale: Dạng Piel của שלח chỉ hành động nghi lễ thả con chim đi. “Thả” tự nhiên trong tiếng Việt; “rồi” diễn đạt trình tự của liên từ waw. Chủ thể “thầy tế lễ” được nêu rõ theo ngữ cảnh để câu tiếng Việt không mơ hồ.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: con chim còn sống
  rationale: Cụm này đối lập con chim này với con chim đã bị giết trước đó trong nghi lễ. “Còn sống” vừa tự nhiên vừa giữ rõ sự tương phản.
- source_word: אֶל מִחוּץ לָעִיר
  choice: ra ngoài thành
  rationale: Cụm giới từ diễn tả chuyển động đến một nơi vượt khỏi ranh giới thành. “Ra ngoài thành” là cách nói gọn và tự nhiên.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: về phía đồng trống
  rationale: Thành ngữ theo nghĩa đen là “đến mặt đồng,” chỉ vùng đồng trống ngoài thành. “Về phía đồng trống” bảo tồn hướng chuyển động mà không dịch cứng nhắc.
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: sẽ làm lễ chuộc tội cho ngôi nhà
  rationale: כפר là ngôn ngữ nghi lễ của giới tế lễ. “Làm lễ chuộc tội” giữ phạm trù thần học của nguyên văn, đồng thời từ “lễ” cho thấy đây là hành động nghi thức áp dụng cho một ngôi nhà.
- source_word: וְטָהֵר
  choice: và nhà ấy sẽ được thanh sạch
  rationale: Động từ טהר diễn tả tình trạng thanh sạch của ngôi nhà sau nghi lễ. Nêu lại “nhà ấy” làm rõ chủ thể; “được thanh sạch” phù hợp với văn cảnh thanh sạch nghi lễ.
theological_decisions:
- issue: Cách dịch כפר trong bối cảnh thanh sạch nghi lễ dành cho một ngôi nhà
  choice: làm lễ chuộc tội cho ngôi nhà
  alternative: thanh tẩy ngôi nhà; làm lễ xá tội cho ngôi nhà
  rationale: Nguyên văn dùng thuật ngữ chuộc tội của hệ thống tế lễ ngay cả đối với một ngôi nhà. Bản dịch giữ nguyên sức căng thần học ấy, không giản lược thành việc làm sạch thông thường và cũng không áp đặt một học thuyết chuộc tội về sau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo ngữ cảnh gần để làm rõ chủ thể hàm ẩn; giữ ngôn ngữ “chuộc tội” của nguyên văn và giải thích các khả năng khác trong chú thích.
