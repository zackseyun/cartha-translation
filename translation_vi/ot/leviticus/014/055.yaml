review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng chức năng tiếp nối của וּלְ (‘và về’) và tránh đồng nhất צָרַעַת với bệnh phong theo nghĩa lâm sàng. Tuy nhiên, gọi đó là “bệnh” ngay trong câu dễ tạo cảm giác đây là một bệnh lý ở người, dù nguyên ngữ cùng thuật ngữ này cũng áp dụng cho y phục và nhà. “Nhà cửa” cũng làm số ít khái quát của הַבָּיִת trở nên kém chính xác.
  naturalness: 'Cấu trúc “trên y phục hoặc trên nhà cửa” chưa tự nhiên: “trên nhà” trong tiếng Việt thường gợi mái nhà. “Trên y phục hoặc trong nhà” diễn đạt địa điểm theo ngữ cảnh rõ và tự nhiên hơn.'
  terminology: Giữ chuyển tự “tsaraʿat” là lựa chọn thận trọng, không áp đặt một chẩn đoán hiện đại. Dùng “tình trạng” làm danh từ bao quát phù hợp hơn “bệnh” khi thuật ngữ áp dụng cho cả đồ vật và nhà. Chú thích nên nói đến “hiện tượng” hoặc “sự nhiễm uế,” không gọi chung là “tổn hại,” vốn không sát nghĩa bằng.
  issues:
  - severity: medium
    issue: “bệnh tsaraʿat” thu hẹp thuật ngữ thành bệnh lý.
    rationale: צָרַעַת trong ngữ cảnh Lê-vi Ký 13–14 được dùng cho người, y phục và nhà; một cách gọi trung tính hơn cần thiết để không gợi chẩn đoán y khoa không có trong bản văn.
  - severity: low
    issue: “trên nhà cửa” vừa không tự nhiên vừa không giữ tốt danh từ số ít khái quát.
    rationale: הַבָּיִת là “nhà”; trong tiếng Việt, “trong nhà” phù hợp với ngữ cảnh hơn “trên nhà,” còn “nhà cửa” có sắc thái tập hợp/plural.
  - severity: low
    issue: Chú thích dùng “tổn hại” cho phạm vi nghĩa của thuật ngữ.
    rationale: “Tổn hại” quá chung và không phản ánh rõ khía cạnh hiện tượng/ô nhiễm nghi lễ được nêu trong ngữ cảnh; “hiện tượng hoặc sự nhiễm uế” sát hơn mà vẫn không quyết định bản chất vật lý của nó.
