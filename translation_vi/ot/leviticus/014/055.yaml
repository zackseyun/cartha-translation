  text: and for a skin disease in a garment or in a house,[a]
translation:
  language: vi
  text: và về tình trạng tsaraʿat trên y phục hoặc trong nhà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ tsaraʿat theo truyền thống thường được dịch là “bệnh phong”, nhưng trong sách Lê-vi Ký, từ này có nghĩa rộng hơn, chỉ nhiều dạng hiện tượng hoặc sự nhiễm uế khác nhau, kể cả những dạng xuất hiện trên y phục và trong nhà.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: và về
  rationale: Liên từ và giới từ tiếp nối danh sách những trường hợp thuộc phạm vi của luật lệ đã nêu; “và về” vừa tự nhiên vừa giữ được cấu trúc liệt kê.
- source_word: צָרַעַת
  choice: bệnh tsaraʿat
  rationale: Thuật ngữ Hê-bơ-rơ chỉ một loại tổn hại hay hiện tượng nhiễm uế có thể xuất hiện trên người, y phục và nhà cửa. Giữ dạng chuyển tự tránh đồng nhất sai với bệnh phong hoặc chỉ riêng nấm mốc.
- source_word: הַבֶּגֶד
  choice: y phục
  rationale: Danh từ số ít có mạo từ nhưng được dùng theo nghĩa loại; “y phục” là cách diễn đạt gọn, trang trọng và tự nhiên trong tiếng Việt.
- source_word: וְלַבָּיִת
  choice: hoặc trên nhà cửa
  rationale: Trong danh sách phân loại, “hoặc” diễn đạt tự nhiên các nơi khác nhau mà cùng hiện tượng có thể xuất hiện; “trên” làm rõ quan hệ vị trí được ngữ cảnh hàm ý, còn “nhà cửa” mang nghĩa khái quát.
theological_decisions:
- issue: Phạm vi nghĩa của צָרַעַת khi áp dụng cho đồ vật và nhà
  choice: Giữ thuật ngữ chuyển tự “tsaraʿat” và giải thích bằng chú thích
  alternative: Dịch là “bệnh phong”, “nấm mốc” hoặc “vết nhiễm uế”
  rationale: Nguyên ngữ duy trì một phạm trù chung cho người, y phục và nhà cửa. Một từ chẩn đoán hiện đại sẽ thu hẹp nghĩa và giải quyết sự căng thẳng khái niệm mà bản văn vẫn để ngỏ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ từ chuyển tự chuyên biệt ở chỗ không có một từ tiếng Việt đơn lẻ nào bao quát chính xác phạm vi nghĩa của nguyên ngữ; chú thích giải nghĩa ngay tại câu.
