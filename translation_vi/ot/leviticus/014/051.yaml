base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: vi
  text: Rồi thầy tế lễ phải lấy gỗ bá hương, cây bài hương, sợi chỉ đỏ thắm[a] và con chim còn sống, nhúng các vật ấy vào máu của con chim đã bị giết và nước từ nguồn tự nhiên[b], rồi rảy lên ngôi nhà bảy lần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “đỏ thắm của con sâu”, thường được hiểu là chỉ hoặc sợi đã nhuộm đỏ thắm.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “nước sống”, chỉ nước từ nguồn tự nhiên, thường là nước chảy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi thầy tế lễ phải lấy
  rationale: Động từ trong chuỗi chỉ dẫn nghi lễ mang ý nghĩa tiếp nối và bắt buộc. Chủ thể được làm rõ từ ngữ cảnh là thầy tế lễ, giúp câu tiếng Việt tự nhiên.
- source_word: עֵץ הָאֶרֶז
  choice: gỗ bá hương
  rationale: Cách gọi quen thuộc, trang trọng trong tiếng Việt cho vật liệu nghi lễ bằng gỗ cedar.
- source_word: הָאֵזֹב
  choice: cây bài hương
  rationale: Dùng tên gọi truyền thống trong Kinh Thánh tiếng Việt cho אֵזוֹב, đồng thời thêm “cây” để người đọc hiểu đây là thực vật.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: sợi chỉ đỏ thắm
  rationale: Cụm Hê-bơ-rơ chỉ vật liệu dạng sợi được nhuộm màu đỏ thắm; cách dịch này tự nhiên và phù hợp hình ảnh bó vật dùng trong nghi lễ.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: con chim còn sống
  rationale: Làm rõ sự tương phản trực tiếp với con chim đã bị giết.
- source_word: וְטָבַל אֹתָם
  choice: nhúng tất cả
  rationale: טבל nghĩa là nhúng; đại từ số nhiều bao gồm các vật vừa kể, nên “tất cả” diễn đạt tự nhiên và tránh mơ hồ trong tiếng Việt.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: vào máu của con chim đã bị giết
  rationale: שׁחט chỉ việc giết theo nghi thức; trong câu tiếng Việt, “đã bị giết” rõ ràng và không hàm ý đây nhất thiết là sinh tế trên bàn thờ.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: vào nước nguồn
  rationale: Thành ngữ nghĩa đen là “nước sống”, chỉ nước tự nhiên còn tươi hoặc đang chảy. “Nước nguồn” gọn, dễ hiểu trong bối cảnh nghi lễ, còn nghĩa đen được giữ ở chú thích.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: rồi rảy trên ngôi nhà
  rationale: נזה ở thể Hiphil là thuật ngữ về rảy trong nghi lễ. Giới từ אֶל có hướng đến/nhằm vào; “rảy trên ngôi nhà” là cách nói tự nhiên trong tiếng Việt.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Dịch trực tiếp cụm số lượng làm trạng ngữ.
theological_decisions:
- issue: Cách dịch מַיִם חַיִּים trong luật nghi lễ
  choice: nước nguồn
  alternative: nước sống; nước chảy
  rationale: Trong ngữ cảnh này, cụm từ chỉ nước tự nhiên, tươi hoặc đang chảy, chứ không nên bị giải thích theo những liên tưởng thần học về sau. Chú thích giữ nghĩa đen và phạm vi nghĩa của nguyên văn.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại, dùng câu mệnh lệnh gián tiếp dễ hiểu. Các thuật ngữ truyền thống chỉ được giữ khi vẫn rõ nghĩa; những thành ngữ Hê-bơ-rơ khó hiểu được diễn đạt tự nhiên và chú thích minh bạch.
