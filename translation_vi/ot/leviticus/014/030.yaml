  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה אֶת הָֽ/אֶחָד֙ מִן הַ/תֹּרִ֔ים א֖וֹ מִן בְּנֵ֣י הַ/יּוֹנָ֑ה מֵ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: vi
  text: Người ấy phải dâng một con chim gáy hoặc một con bồ câu non, tùy theo khả năng của mình—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה
  choice: phải dâng
  rationale: Trong ngữ cảnh tế lễ, động từ עשה mang nghĩa thực hiện nghi thức hay dâng lễ vật; “dâng” diễn đạt tự nhiên và chính xác chức năng tế tự.
- source_word: אֶת הָאֶחָד
  choice: một con
  rationale: Cụm này chỉ một cá thể thuộc một trong hai loại chim được nêu tiếp theo; tiếng Việt cần loại từ “con”.
- source_word: מִן־הַתֹּרִים
  choice: chim gáy
  rationale: תֹּרִים chỉ loài turtledove dùng trong luật tế lễ; “chim gáy” là tên gọi thông dụng và phân biệt với bồ câu.
- source_word: אוֹ מִן־בְּנֵי הַיּוֹנָה
  choice: hoặc một con bồ câu non
  rationale: בְּנֵי הַיּוֹנָה là thành ngữ chỉ bồ câu non; lặp lại “một con” giúp hai phương án song song và rõ nghĩa trong tiếng Việt.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: tùy theo khả năng của mình
  rationale: Nghĩa đen là “theo điều tay người ấy đạt tới”, một thành ngữ Hê-bơ-rơ nói về khả năng kinh tế; cách dịch này tự nhiên mà vẫn giữ ý mức lễ vật tùy thuộc phương tiện của người dâng.
theological_decisions: []
