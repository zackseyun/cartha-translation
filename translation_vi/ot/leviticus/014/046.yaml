base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: vi
  text: Bất cứ ai vào nhà trong suốt thời gian ngôi nhà bị cách ly[a] đều sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị đóng lại” hoặc “bị giữ riêng”. Từ Hê-bơ-rơ nói đến việc ngôi nhà bị đặt riêng dưới sự hạn chế của thầy tế lễ để kiểm tra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: Bất cứ ai vào
  rationale: Mạo từ đi với phân từ tạo nghĩa chỉ người nói chung trong quy định pháp lý; cách diễn đạt này tự nhiên trong tiếng Việt và giữ phạm vi bao quát.
- source_word: אֶל הַ/בַּיִת
  choice: vào nhà
  rationale: Động từ בוא cùng אֶל diễn tả chuyển động đi vào; tiếng Việt diễn đạt tự nhiên là “vào nhà”.
- source_word: כָּל יְמֵי
  choice: trong suốt thời gian
  rationale: Cụm từ bao quát toàn bộ những ngày ngôi nhà ở trong tình trạng bị hạn chế; “trong suốt thời gian” tự nhiên hơn việc dịch sát là “mọi ngày”.
- source_word: הִסְגִּיר אֹתוֹ
  choice: ngôi nhà bị cách ly
  rationale: Trong thủ tục về ô uế ở Lê-vi Ký 13–14, סגר chỉ việc đặt đối tượng riêng ra và hạn chế tiếp cận để thầy tế lễ theo dõi. “Bị cách ly” truyền đạt chức năng pháp lý-nghi lễ ấy, còn chú thích bảo lưu nghĩa sát là “bị đóng lại” hoặc “bị giữ riêng”.
- source_word: יִטְמָא
  choice: đều sẽ bị ô uế
  rationale: Động từ nói đến việc người bước vào rơi vào tình trạng ô uế theo nghi lễ; “sẽ bị ô uế” phù hợp văn phong quy định và thể hiện kết quả.
- source_word: עַד הָ/עָרֶב
  choice: cho đến chiều tối
  rationale: Đây là công thức chỉ thời hạn của tình trạng ô uế tạm thời; “cho đến chiều tối” là cách nói rõ ràng, tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý-nghi lễ trang trọng nhưng dễ hiểu. Dùng “ô uế” theo thuật ngữ quen thuộc của Lê-vi Ký, không hàm ý sự suy đồi đạo đức; dùng “cách ly” theo nghĩa hạn chế tiếp cận để kiểm tra, không chủ yếu theo nghĩa y khoa hiện đại.
