id: LEV.14.8
reference: Leviticus 14:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: vi
  text: Người đang được thanh tẩy[a] phải giặt quần áo mình, cạo hết lông tóc và tắm bằng nước; bấy giờ người ấy sẽ thanh sạch. Sau đó, người ấy được vào trong trại[b], nhưng phải ở bên ngoài lều mình trong bảy ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người đang được làm cho thanh sạch”. Tiếng Hê-bơ-rơ chỉ người đang trải qua tiến trình thanh tẩy theo nghi thức đã quy định.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “người ấy sẽ vào trong trại”. Dạng Hê-bơ-rơ có thể được hiểu là lời nói về tương lai hoặc sự cho phép; văn cảnh cho thấy người ấy được trở lại trại nhưng vẫn còn chịu hạn chế.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Dạng phân từ Hitpael chỉ người đang trải qua tiến trình thanh tẩy theo nghi thức. Cách dịch này giữ được tính tiến triển và ý nghĩa nghi lễ, không biến câu thành lời nói về sự thanh sạch đạo đức.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: phải giặt quần áo mình
  rationale: כִּבֵּס thường chỉ việc giặt đồ. “Quần áo” là cách nói hiện đại, rõ nghĩa; “phải” phù hợp với tính quy định của chuỗi động từ trong luật nghi lễ.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: cạo hết lông tóc
  rationale: כָּל nhấn mạnh toàn bộ, còn שֵׂעָר có thể bao gồm tóc và lông trên thân thể. “Lông tóc” truyền đạt phạm vi rộng tự nhiên hơn việc chỉ nói “tóc”.
- source_word: רָחַץ בַּמַּיִם
  choice: tắm bằng nước
  rationale: Trong văn cảnh nghi lễ, רָחַץ nói đến việc rửa thân thể. “Tắm” giúp phân biệt rõ với hành động giặt quần áo ở đầu câu.
- source_word: וְטָהֵר
  choice: bấy giờ người ấy sẽ thanh sạch
  rationale: Mệnh đề nêu tình trạng thanh sạch theo nghi lễ đạt được sau các hành động vừa kể. “Bấy giờ” thể hiện trình tự, còn “thanh sạch” tránh hàm ý rằng đây chỉ là vệ sinh thân thể.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: người ấy được vào trong trại
  rationale: Trong văn cảnh, người ấy được phép trở lại trại nhưng vẫn chịu hạn chế chưa được vào lều. Tuy nhiên, dạng động từ cũng có thể được hiểu đơn giản là “sẽ vào”, nên giữ cách đọc ấy trong chú thích.
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: nhưng phải ở bên ngoài lều mình
  rationale: יָשַׁב ở đây chỉ việc lưu lại hoặc cư trú tạm thời. “Nhưng” diễn đạt tự nhiên sự tương phản giữa việc được vào trại và việc chưa được trở về lều, dù liên từ Hê-bơ-rơ theo hình thức là “và”.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho khoảng thời gian kéo dài bảy ngày.
theological_decisions:
- issue: Bản chất của ngôn ngữ thanh sạch theo nghi lễ
  choice: Dùng “được thanh tẩy” và “thanh sạch” để chỉ tình trạng nghi lễ.
  alternative: Dùng “được làm sạch” và “sạch”.
  rationale: Văn cảnh nói về việc phục hồi địa vị thanh sạch theo luật nghi lễ, không trực tiếp nói về sự thánh hóa nội tâm hay phẩm chất đạo đức. “Thanh tẩy/thanh sạch” giữ được sắc thái nghi lễ mà không nhập thêm một lập trường giáo phái.
- issue: Việc trở lại trại là được phép hay chỉ là sự việc tương lai
  choice: 'Dịch theo nghĩa cho phép: “được vào trong trại”.'
  alternative: “sẽ vào trong trại”.
  rationale: Hạn chế ngay sau đó—phải ở ngoài lều bảy ngày—cho thấy người ấy đã được phép tái nhập trại nhưng chưa hoàn toàn trở lại đời sống gia đình. Vì dạng Hê-bơ-rơ vẫn có thể được hiểu là tương lai đơn thuần, phương án ấy được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” thay cho đại từ mang giới tính để tiếng Việt tự nhiên mà không làm thay đổi đối tượng số ít; giữ các thuật ngữ “thanh tẩy” và “thanh sạch” nhằm biểu đạt chính xác địa vị nghi lễ. Hai dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan trong chính văn.
