language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: vi
  text: “Khi các con vào đất Ca-na-an mà Ta ban cho các con làm sản nghiệp, và Ta đặt một vết bệnh[a] trong một ngôi nhà trên đất sản nghiệp của các con,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ tsara'at thường được dịch là “bệnh phong” hoặc “phung hủi”, nhưng ở đây chỉ một loại vết hay tình trạng bất thường có thể xuất hiện trên người, vải vóc và nhà cửa; vì vậy, nó không đồng nhất với bệnh phong theo cách hiểu y khoa hiện đại.
    reason: Giải thích phạm vi nghĩa rộng của צָרַעַת và tránh đồng nhất sai với bệnh phong hiện đại.
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: Khi các con vào
  rationale: כִּי mở đầu hoàn cảnh tương lai của luật lệ này, nên “khi” tự nhiên hơn “nếu”; תָבֹאוּ là ngôi thứ hai số nhiều, chỉ dân Y-sơ-ra-ên.
- source_word: אֶרֶץ כְּנַעַן
  choice: đất Ca-na-an
  rationale: Giữ tên địa lý và ý nghĩa lãnh thổ của cụm từ Hê-bơ-rơ.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: mà Ta ban cho các con
  rationale: Phân từ נֹתֵן diễn tả hành động ban đất của Đức Chúa Trời đang được thực hiện hoặc sắp thực hiện; “ban” phù hợp với văn cảnh trang trọng.
- source_word: לַאֲחֻזָּה
  choice: làm sản nghiệp
  rationale: אֲחֻזָּה chỉ đất đai được nắm giữ lâu dài. “Sản nghiệp” vừa gọn vừa giữ sắc thái sở hữu đất, không nhất thiết giới hạn vào việc thừa kế.
- source_word: וְנָתַתִּי
  choice: và Ta đặt
  rationale: Giữ sát động từ “ban/đặt” và đặc biệt duy trì tác nhân thần linh được nêu rõ trong nguyên văn, dù cách nói này tạo sức căng thần học.
- source_word: נֶגַע צָרַעַת
  choice: một vết bệnh[a]
  rationale: נֶגַע là vết hoặc hiện tượng gây hại; צָרַעַת là nhóm tình trạng được luật Lê-vi ký xem xét trên người, vải và nhà. “Vết bệnh” phù hợp với ngữ cảnh ngôi nhà hơn “bệnh ngoài da”, còn chú thích bảo tồn phạm vi nghĩa và cách dịch truyền thống.
- source_word: בְּבֵית אֶרֶץ אֲחֻזַּתְכֶם
  choice: trong một ngôi nhà thuộc xứ các con sở hữu
  rationale: “Trong một ngôi nhà” thể hiện בְּבֵית; phần sau được diễn đạt tự nhiên bằng tiếng Việt nhưng vẫn lặp lại ý sở hữu đất của אֲחֻזָּה.
theological_decisions:
- issue: Tác nhân gây ra vết bệnh trong nhà
  choice: 'Giữ lời ngôi thứ nhất của Đức Chúa Trời: “Ta đặt một vết bệnh”'
  alternative: Diễn đạt vô nhân xưng như “một vết bệnh xuất hiện”
  rationale: וְנָתַתִּי quy sự việc trực tiếp cho Đức Chúa Trời. Bản dịch không làm nhẹ hoặc loại bỏ sức căng thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; dùng “Ta/các con” cho lời Đức Chúa Trời phán với cộng đồng Y-sơ-ra-ên. Câu được để mở bằng dấu phẩy vì câu luật tiếp tục ở câu kế tiếp.
