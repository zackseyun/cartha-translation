revisions:
- from: Đến ngày thứ tám, người ấy phải đem hai chiên con đực không tì vết, một chiên con cái một tuổi không tì vết, ba phần mười ê-pha[a] bột lọc trộn với dầu làm lễ vật ngũ cốc, và một lô-ga[b] dầu.
  to: Vào ngày thứ tám, người ấy phải đem hai chiên con đực không tì vết, một chiên con cái một tuổi không tì vết, ba phần mười ê-pha[a] bột mịn trộn với dầu để làm lễ vật ngũ cốc, và một lô-ga[b] dầu.
  rationale: Sửa mốc thời gian để phản ánh trực tiếp giới từ בַּ (‘vào ngày’), thay “bột lọc” bằng “bột mịn” cho tự nhiên và chính xác hơn đối với סֹלֶת, đồng thời điều chỉnh chú thích ê-pha để không trình bày một ước lượng khảo cổ còn bất định như giá trị cố định. Các chi tiết về giới tính, tuổi, tình trạng không tì vết, lượng bột, dầu trộn, và lô-ga dầu đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
