language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: vi
  text: Vào ngày thứ tám, người ấy phải đem hai chiên con đực không tì vết, một chiên con cái một tuổi không tì vết, ba phần mười ê-pha[a] bột mịn trộn với dầu để làm lễ vật ngũ cốc, và một lô-ga[b] dầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ê-pha là một đơn vị đo khô cổ. Ba phần mười ê-pha là ba phần mười của một ê-pha.
    reason: Giải thích đơn vị và tỷ phần trong nguyên ngữ mà không áp đặt một quy đổi hiện đại không chắc chắn.
  - marker: b
    text: Lô-ga là một đơn vị đo chất lỏng nhỏ được dùng trong nghi lễ của người Israel.
    reason: Giải thích đơn vị đo nghi lễ cổ không có từ tương đương chính xác trong tiếng Việt hiện đại.
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Đến ngày thứ tám
  rationale: Diễn đạt tự nhiên trình tự của nghi thức trong tiếng Việt, đồng thời giữ rõ mốc ngày thứ tám.
- source_word: יִקַּח
  choice: người ấy phải đem
  rationale: Thể vị hoàn thành chưa hoàn tất ở đây mang lực quy định trong văn luật; “phải đem” vừa rõ tính bắt buộc vừa hợp với việc mang lễ vật đến.
- source_word: שְׁנֵי כְבָשִׂים
  choice: hai chiên con đực
  rationale: Giữ rõ giống đực, tương phản có chủ ý với danh từ giống cái ngay sau đó.
- source_word: תְּמִימִים / תְּמִימָה
  choice: không tì vết
  rationale: Trong bối cảnh tế lễ, từ này chỉ con vật không có khuyết tật; đây là cách nói trang trọng và quen thuộc trong tiếng Việt.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: một chiên con cái một tuổi
  rationale: Phản ánh cả giới tính và yêu cầu về tuổi của con vật bằng cách diễn đạt gọn, tự nhiên.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ba phần mười ê-pha
  rationale: עִשָּׂרוֹן là đơn vị một phần mười, ở đây được hiểu là một phần mười ê-pha; nêu đơn vị ngầm giúp độc giả nhận biết lượng đo.
- source_word: סֹלֶת
  choice: bột lọc
  rationale: Chỉ loại bột mịn, tinh tuyển dùng trong lễ vật; “bột lọc” là cách diễn đạt kinh văn trang trọng và dễ hiểu.
- source_word: מִנְחָה
  choice: làm lễ vật ngũ cốc
  rationale: Trong thuật ngữ tế lễ của Lê-vi Ký, từ này chỉ lễ vật làm từ ngũ cốc; “làm” thể hiện quan hệ chức năng của lượng bột.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn với dầu
  rationale: Truyền đạt trực tiếp trạng thái bột đã được hòa trộn với dầu.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: một lô-ga dầu
  rationale: Giữ nguyên đơn vị đo chất lỏng đặc thù của Israel bằng phiên âm, thay vì thay bằng một dung tích hiện đại không hoàn toàn tương đương.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “người ấy” vì chủ thể là người đang được thanh tẩy trong ngữ cảnh trước; dùng “phải” để giữ lực quy định. Phiên âm các đơn vị cổ và giải thích bằng chú thích, không thay thế chúng bằng đơn vị hiện đại trong chính văn.
