base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: vi
  text: Nhưng nếu thầy tế lễ vào xem và nhận thấy vết nhiễm không lan ra trong nhà sau khi nhà đã được trát lại, thì thầy tế lễ sẽ tuyên bố căn nhà là thanh sạch[a], vì vết nhiễm đã lành[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thầy tế lễ sẽ tẩy sạch căn nhà.” Động từ Hê-bơ-rơ có thể chỉ việc làm cho thanh sạch hoặc tuyên bố là thanh sạch trong nghi lễ.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ chỉ một vết hoặc tình trạng gây ô uế; các bản dịch truyền thống đôi khi dịch là “tai họa” hay “bệnh dịch”. Ở đây, từ này nói về tình trạng ảnh hưởng đến căn nhà.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu trường hợp có điều kiện, tương phản với tình huống trước đó trong thủ tục pháp lý.
- source_word: בֹּא יָבֹא
  choice: vào
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ nhấn mạnh hành động đi vào; tiếng Việt tự nhiên diễn đạt đơn giản là “vào” trong bối cảnh kiểm tra căn nhà.
- source_word: וְרָאָה
  choice: xem và nhận thấy
  rationale: Động từ có nghĩa cơ bản là “thấy/xem”; trong ngữ cảnh, cụm này vừa chỉ việc quan sát vừa nêu kết quả quan sát mà không nâng mức diễn giải thành một cuộc khám nghiệm kỹ thuật.
- source_word: וְהִנֵּה
  choice: nhận thấy
  rationale: Ý nhấn mạnh kết quả bất ngờ hoặc đáng chú ý của הִנֵּה được chuyển tự nhiên vào cụm “nhận thấy”, thay vì dùng từ cổ “này” hay “kìa”.
- source_word: לֹא פָשָׂה
  choice: không lan ra
  rationale: Trong các quy định về נגע, פשה chỉ tình trạng lan rộng; “không lan ra” rõ ràng và tự nhiên.
- source_word: הַנֶּגַע
  choice: vết nhiễm
  rationale: נגע ở đây chỉ tình trạng hoặc dấu vết gây ô uế nơi căn nhà, không nhất thiết là một bệnh theo nghĩa y khoa hiện đại. “Vết nhiễm” tránh xác định đó là mốc hoặc gọi là dịch bệnh.
- source_word: בַּבַּיִת
  choice: trong nhà
  rationale: Giữ nghĩa thông thường của giới từ ב và phù hợp với tình trạng ảnh hưởng đến kết cấu bên trong căn nhà.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: sau khi nhà đã được trát lại
  rationale: טוח chỉ việc trát hoặc phủ bề mặt. “Trát lại” liên kết tự nhiên với công việc sửa chữa đã được quy định trước đó, còn thể bị động giữ nguyên việc tác nhân không được nhấn mạnh.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבַּיִת
  choice: thầy tế lễ sẽ tuyên bố căn nhà là thanh sạch
  rationale: Trong hệ thống thanh sạch nghi lễ, טהר ở dạng này có thể chỉ phán định của thầy tế lễ. Cách dịch này không hàm ý rằng chính ông thực hiện việc vệ sinh vật lý vào lúc ấy.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: vì vết nhiễm đã lành
  rationale: נרפא có nghĩa là “được lành/lành lại”. Giữ hình ảnh chữa lành vốn được tiếng Hê-bơ-rơ áp dụng cho tình trạng của căn nhà, thay vì làm phẳng thành “đã biến mất”.
theological_decisions:
- issue: טהר chỉ sự tuyên bố thanh sạch theo nghi lễ hay hành động làm sạch vật lý
  choice: Thầy tế lễ tuyên bố căn nhà là thanh sạch
  alternative: Thầy tế lễ tẩy sạch căn nhà
  rationale: Mạch luật lệ trình bày thầy tế lễ kiểm tra rồi xác định tình trạng nghi lễ của căn nhà. “Tuyên bố… là thanh sạch” thể hiện vai trò phán định ấy mà không loại bỏ phạm vi nghĩa rộng hơn của động từ, được ghi trong chú thích.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. “Thầy tế lễ” là cách gọi quen thuộc, dễ hiểu; “thanh sạch” bảo toàn phạm trù nghi lễ. Câu giữ hình ảnh “vết nhiễm đã lành” dù hơi khác cách nói thông thường về một căn nhà, vì đây là ẩn dụ rõ ràng của nguyên văn.
