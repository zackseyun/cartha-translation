source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: vi
  text: Rồi thầy tế lễ phải lấy con chiên dùng làm lễ chuộc lỗi[a] và một lô-gơ dầu[b]; thầy tế lễ phải dâng cả hai làm lễ vẫy trước mặt Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát cấu trúc là “con chiên của lễ chuộc lỗi”; theo cách dịch truyền thống, “con chiên của lễ mắc lỗi”.
    reason: lexical_alternative
  - marker: b
    text: “Lô-gơ” là một đơn vị đo chất lỏng nhỏ được dùng trong hệ thống nghi lễ của Ít-ra-ên.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ... phải lấy
  rationale: Liên từ với động từ ở thể hoàn thành tiếp nối trình tự nghi lễ; “Rồi” diễn đạt tự nhiên bước kế tiếp, còn “phải” giữ sắc thái quy định.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, quen thuộc trong tiếng Việt đối với chức vụ tư tế trong luật nghi lễ; chủ ngữ lặp lại được giữ theo nguyên văn.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: con chiên dùng làm lễ chuộc lỗi
  rationale: Diễn đạt tự nhiên quan hệ kết cấu giữa con chiên và lễ אָשָׁם, đồng thời giữ rõ đây là một loại sinh tế riêng.
- source_word: לֹג הַשָּׁמֶן
  choice: một lô-gơ dầu
  rationale: Giữ tên đơn vị đo chất lỏng chuyên biệt thay vì thay bằng từ chung “lượng”; mạo từ Hê-bơ-rơ xác định vật đã được quy định trong trình tự, nhưng tiếng Việt tự nhiên dùng “một” khi nêu lượng.
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: phải đưa ... qua lại làm lễ đưa qua đưa lại
  rationale: Giữ cả động tác nghi lễ và danh từ cùng gốc trong tiếng Hê-bơ-rơ. Cụm từ mô tả dễ hiểu hơn cách dịch thuần kỹ thuật “vẫy” nhưng không xác định thêm hướng hay cách thức ngoài nguyên văn.
- source_word: אֹתָם
  choice: cả hai
  rationale: Đại từ số nhiều cùng chỉ con chiên và lô-gơ dầu; “cả hai” làm quan hệ quy chiếu rõ ràng trong tiếng Việt.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: Giữ ý trình diện trong sự hiện diện của YHWH và chuyển danh riêng giao ước bằng dạng tiếng Việt đã quen dùng.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước. “Đức Giê-hô-va” giữ đây là danh riêng và có sắc thái trang trọng, dễ nhận biết trong tiếng Việt; không thay bằng tước hiệu “CHÚA”.
- issue: Cách dịch אָשָׁם trong luật tế lễ
  choice: lễ chuộc lỗi
  alternative: lễ bồi thường; lễ mắc lỗi
  rationale: “Lễ chuộc lỗi” là cách diễn đạt rõ và quen thuộc cho loại tế lễ liên quan đến tình trạng có lỗi và trách nhiệm phát sinh. Chú thích nêu cách hiểu theo cấu trúc sát chữ mà không áp đặt một hệ phái.
- issue: Bản chất của động tác תְּנוּפָה
  choice: lễ đưa qua đưa lại
  alternative: lễ vẫy; lễ dâng trình
  rationale: Nguyên văn nêu một động tác nghi lễ nhưng không mô tả cụ thể hướng chuyển động. Bản dịch giữ tính chất động tác và tránh giải thích chi tiết vượt quá chứng cứ.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại. Giữ sự lặp lại “thầy tế lễ” của nguyên văn, bảo toàn các thuật ngữ tế lễ, đồng thời dùng cách diễn đạt đủ rõ cho độc giả phổ thông.
