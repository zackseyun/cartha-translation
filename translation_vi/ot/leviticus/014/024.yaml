revisions:
- from: Rồi thầy tế lễ phải lấy con chiên dùng làm lễ chuộc lỗi[a] và một lô-gơ dầu[b]; thầy tế lễ phải đưa cả hai qua lại làm lễ đưa qua đưa lại trước mặt Đức Giê-hô-va.
  to: Rồi thầy tế lễ phải lấy con chiên dùng làm lễ chuộc lỗi[a] và một lô-gơ dầu[b]; thầy tế lễ phải dâng cả hai làm lễ vẫy trước mặt Đức Giê-hô-va.
  rationale: Bản sửa thay cách diễn đạt mô tả, lặp và gượng về nghi thức bằng “dâng cả hai làm lễ vẫy”. Cách này bảo toàn việc vị tư tế thực hiện hành vi nghi lễ đối với cả con chiên lẫn dầu, đồng thời phản ánh danh từ tế lễ תְּנוּפָה mà không áp đặt một hướng vẫy cụ thể. Các thành phần còn lại trung thành với tiếng Hê-bơ-rơ và phù hợp văn phong Việt ngữ hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng trình tự nghi lễ, chủ ngữ được lặp lại, hai vật được chỉ chung bằng “cả hai”, và cụm “trước mặt Đức Giê-hô-va” phản ánh chính xác לִפְנֵי יְהוָה. Tuy nhiên, “đưa cả hai qua lại làm lễ đưa qua đưa lại” diễn giải động tác theo cách nặng nề, lặp từ, và kém chính xác về thuật ngữ hơn cách gọi nghi lễ thông dụng “lễ vẫy”.
  naturalness: “Đưa ... qua lại làm lễ đưa qua đưa lại” không tự nhiên trong tiếng Việt hiện đại và gây cảm giác mô tả cơ học thay vì nêu hành vi tế lễ kỹ thuật. “Dâng chúng làm lễ vẫy” trang trọng, rõ nghĩa và tự nhiên hơn trong văn cảnh luật nghi lễ.
  terminology: Giữ “thầy tế lễ”, “lễ chuộc lỗi”, “lô-gơ”, và “Đức Giê-hô-va”. “Lễ vẫy” là thuật ngữ ngắn gọn, đã định hình trong tiếng Việt Kinh Thánh, phản ánh cặp động từ-danh từ וְהֵנִיף ... תְּנוּפָה mà không xác định hướng chuyển động vượt quá nguyên văn.
  issues:
  - severity: medium
    issue: Cụm “đưa cả hai qua lại làm lễ đưa qua đưa lại” vừa trùng lặp vừa không tự nhiên.
    rationale: Cụm này cố tái tạo cùng gốc từ của tiếng Hê-bơ-rơ nhưng tạo ra lối diễn đạt gượng trong tiếng Việt. Nó cũng mô tả “qua lại” như thể hướng chuyển động đã được xác định, trong khi văn bản chỉ nêu hành vi nghi lễ nuph/tenuphah.
  - severity: low
    issue: Chú thích a dùng cách nói truyền thống “con chiên làm lễ chuộc sự mắc lỗi” không tự nhiên.
    rationale: Cách nói này không phải tương đương tiếng Việt hiện đại rõ ràng. Nên nêu lựa chọn cấu trúc sát hơn và thuật ngữ truyền thống thông dụng “lễ chuộc lỗi/lễ mắc lỗi” nếu cần.
