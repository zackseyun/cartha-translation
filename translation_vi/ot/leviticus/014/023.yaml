id: LEV.14.23
reference: Leviticus 14:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: vi
  text: Vào ngày thứ tám, người ấy phải đem các lễ vật đó đến cho thầy tế lễ để được thanh tẩy[a], tại lối vào Lều Hội Kiến, trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để được làm cho tinh sạch.” Từ Hê-bơ-rơ ở đây nói đến sự thanh sạch theo nghi lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: phải đem
  rationale: Trong văn mạch luật lệ, dạng động từ này mang sắc thái chỉ thị; “phải đem” diễn đạt tự nhiên nghĩa vụ theo nghi thức.
- source_word: אֹתָם
  choice: các lễ vật đó
  rationale: Đại từ số nhiều giống đực chỉ những vật dùng làm lễ đã được nêu ở câu trước; diễn đạt rõ sở chỉ mà không bổ sung nội dung mới.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: vào ngày thứ tám
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, tương ứng trực tiếp với cụm Hê-bơ-rơ.
- source_word: לְטָהֳרָתוֹ
  choice: để được thanh tẩy
  rationale: Diễn tả mục đích của thủ tục thanh sạch theo nghi lễ; thể bị động tự nhiên trong tiếng Việt và không hàm ý thanh tẩy đạo đức.
- source_word: אֶל הַכֹּהֵן
  choice: đến gặp thầy tế lễ
  rationale: Giữ hướng chuyển động đến thầy tế lễ và tạo câu tiếng Việt tự nhiên; “thầy tế lễ” là cách gọi dễ hiểu trong bối cảnh Lê-vi Ký.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: Cụm từ xác định địa điểm tiến hành nghi thức; “Lều Hội Kiến” giữ danh xưng riêng quen thuộc của אֹהֶל מוֹעֵד.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ chỉ sự hiện diện mang tính thờ phượng và tên riêng của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; “Yahweh” bảo tồn tư cách danh riêng và tránh thay thế bằng tước hiệu.
- issue: Ý nghĩa nghi lễ của לְטָהֳרָתוֹ
  choice: để được thanh tẩy
  alternative: để được làm cho tinh sạch
  rationale: Cụm từ nói đến tình trạng thanh sạch theo nghi lễ trong thủ tục phục hồi, không nhất thiết nói đến sự tẩy sạch về đạo đức; chú thích làm rõ sắc thái này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ trình tự thủ tục của nguyên văn, đồng thời dùng “các lễ vật đó” để làm rõ sở chỉ của đại từ số nhiều trong tiếng Việt.
