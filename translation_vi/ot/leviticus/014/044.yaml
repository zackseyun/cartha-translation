review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng tính thủ tục của câu và xác định đúng đối tượng của lời tuyên bố cuối là căn nhà. Tuy nhiên, “vết nhiễm” dễ gợi một sự nhiễm trùng theo y học hiện đại, còn “ăn hại” không phải cách diễn đạt tự nhiên hay chính xác cho מַמְאֶרֶת trong tiếng Việt hiện đại. Bản sửa dùng “vết ấy” để không xác định quá mức bản chất hiện tượng và “nguy hại” để diễn đạt tính từ này mà không y khoa hóa nó.
  naturalness: “Chứng tsaraʿat ăn hại” rất gượng trong văn phong hiện đại. “Một chứng tsaraʿat nguy hại” tự nhiên hơn, vẫn trang trọng và phù hợp với một phạm trù nghi lễ áp dụng cho nhà. Cấu trúc có dấu chấm phẩy giúp liên kết các bước thủ tục trong câu.
  terminology: Giữ “thầy tế lễ”, “tsaraʿat”, và “ô uế” là phù hợp. Phiên âm “tsaraʿat” cùng chú thích là giải pháp thận trọng, vì từ này không được đồng nhất an toàn với bệnh phong, bệnh da, hoặc nấm mốc. “Nhà ấy là ô uế” diễn đạt tình trạng nghi lễ trực tiếp hơn “bị ô uế”.
  issues:
  - severity: medium
    issue: “vết nhiễm” xác định hiện tượng theo hướng y khoa
    rationale: נֶגַע chỉ dấu vết/đốm hay tai họa nghi lễ trong ngữ cảnh này; bản văn không xác định đó là sự nhiễm trùng.
  - severity: medium
    issue: “ăn hại” không tự nhiên và không tương ứng sát với מַמְאֶרֶת
    rationale: Trong tiếng Việt hiện đại, “ăn hại” thường chỉ người hoặc việc vô ích/gây hại, không thích hợp làm tính từ mô tả tsaraʿat. “Nguy hại” giữ sắc thái bất lợi nghiêm trọng mà không áp đặt chẩn đoán.
  - severity: low
    issue: “bị ô uế” làm mờ lời xác định tình trạng nghi lễ
    rationale: טָמֵא הוּא là lời tuyên bố trực tiếp rằng nhà là không thanh sạch theo nghi lễ; “nhà ấy là ô uế” phản ánh rõ hơn.
  revised_text: thì thầy tế lễ phải đến xem xét; nếu thấy vết ấy đã lan rộng trong nhà, thì đó là một chứng tsaraʿat nguy hại trong nhà[a]; nhà ấy là ô uế.
