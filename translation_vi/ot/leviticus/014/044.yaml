source:
  edition: WLC
  text: וּ/בָא֙ הַ/כֹּהֵ֔ן וְ/רָאָ֕ה וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖גַע בַּ/בָּ֑יִת צָרַ֨עַת מַמְאֶ֥רֶת הִ֛וא בַּ/בַּ֖יִת טָמֵ֥א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: vi
  text: thì thầy tế lễ phải đến xem xét; nếu thấy vết ấy đã lan rộng trong nhà, thì đó là một chứng tsaraʿat nguy hại trong nhà[a]; nhà ấy là ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraʿat là thuật ngữ Hê-bơ-rơ chỉ một phạm trù gây ô uế theo nghi lễ, có thể xuất hiện trên người, y phục hoặc nhà cửa. Vì vậy, ở đây không nên hiểu riêng là bệnh phong, bệnh ngoài da, hay nấm mốc. Tính từ đi kèm cũng có thể dịch là “hủy hoại”, “xâm thực” hoặc “ác hại”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: thì ... phải đến
  rationale: Trong văn luật lệ theo trình tự, waw + qatal diễn tả bước thủ tục tiếp theo; cách dịch này tự nhiên hơn lối kể quá khứ.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi thông dụng, trang trọng cho chức vụ phụng tự trong tiếng Việt.
- source_word: וְרָאָה
  choice: xem xét
  rationale: Động từ nghĩa đen là “thấy/nhìn”, nhưng tại đây chỉ việc kiểm tra để đưa ra phán định.
- source_word: וְהִנֵּה
  choice: nếu quả thật
  rationale: Trong thủ tục kiểm tra, cụm từ giới thiệu tình trạng được xác nhận; “nếu quả thật” giữ cả sắc thái điều kiện lẫn chứng thực.
- source_word: פָּשָׂה
  choice: đã lan rộng
  rationale: Diễn tả vết bệnh hay hiện tượng ô nhiễm phát triển và lan ra.
- source_word: הַנֶּגַע
  choice: vết nhiễm
  rationale: נֶגַע ở đây là dấu/vết gây tình trạng ô uế trên căn nhà, không nhất thiết là nhiễm trùng theo nghĩa y khoa hiện đại.
- source_word: צָרַעַת
  choice: chứng tsaraʿat
  rationale: Thuật ngữ Hê-bơ-rơ chỉ một phạm trù ô uế nghi lễ có thể áp dụng cho người, y phục và nhà cửa; phiên âm tránh đồng nhất sai với bệnh phong hoặc giới hạn nó thành nấm mốc.
- source_word: מַמְאֶרֶת
  choice: ăn hại
  rationale: Truyền đạt sắc thái nghiêm trọng, có tính xâm thực hoặc hủy hoại mà không áp đặt chẩn đoán y khoa hiện đại.
- source_word: טָמֵא הוּא
  choice: nhà ấy bị ô uế
  rationale: Đại từ giống đực số ít quy về בַּיִת, “nhà”; nói rõ chủ thể giúp tiếng Việt tự nhiên và giữ nghĩa về tình trạng ô uế nghi lễ.
theological_decisions:
- issue: Cách diễn đạt צָרַעַת khi đối tượng là một căn nhà
  choice: Giữ thuật ngữ phiên âm “tsaraʿat” và giải thích bằng chú thích
  alternative: bệnh phong; bệnh ngoài da; nấm mốc
  rationale: “Bệnh phong” và “bệnh ngoài da” không thể áp dụng thích đáng cho nhà cửa, còn “nấm mốc” xác định hiện tượng cụ thể hơn điều tiếng Hê-bơ-rơ cho phép. Phiên âm bảo tồn phạm trù nghi lễ khác thường và tính liên tục của thuật ngữ trong Lê-vi Ký.
- issue: Chủ thể của lời tuyên bố טָמֵא הוּא
  choice: “nhà ấy bị ô uế”
  alternative: “nó là ô uế”; “chứng ấy là ô uế”
  rationale: Hình thái giống đực của הוּא phù hợp với בַּיִת và không phù hợp với צָרַעַת giống cái; vì vậy lời phán định nói về căn nhà.
- issue: Thể thức của câu luật lệ
  choice: 'Dùng cấu trúc chỉ thủ tục: “thì ... phải ... Nếu ... thì ...”'
  alternative: Dịch như lời kể ở quá khứ
  rationale: Ngữ cảnh là quy định tư tế, không phải một biến cố lịch sử riêng lẻ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc; giữ thuật ngữ nguồn “tsaraʿat” vì các từ thuần Việt như “bệnh ngoài da” hay “nấm mốc” đều thu hẹp nghĩa quá mức trong ngữ cảnh nhà cửa.
