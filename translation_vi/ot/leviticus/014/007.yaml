id: LEV.14.7
reference: Leviticus 14:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: vi
  text: Ông phải rảy hỗn hợp ấy bảy lần trên người đang được thanh tẩy khỏi bệnh ngoài da[a], rồi tuyên bố người ấy là thanh sạch[b]. Sau đó, ông phải thả con chim còn sống ra ngoài đồng trống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “bệnh phong”. Từ Hê-bơ-rơ chỉ nhiều tình trạng liên quan đến da trong Lê-vi Ký, không nhất thiết là bệnh phong theo nghĩa hiện đại.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “xác nhận người ấy là thanh sạch”. Đây là hành động chính thức trong nghi lễ của thầy tế lễ, không chỉ là một nhận định y khoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: rảy hỗn hợp ấy
  rationale: Động từ hiphil của נזה chỉ hành động rảy chất lỏng trong nghi lễ. Tân ngữ không được nói rõ trong câu này, nhưng theo văn cảnh ngay trước đó là hỗn hợp dùng trong nghi thức; thêm “hỗn hợp ấy” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Phân từ hitpael của טהר mô tả người đang trải qua tiến trình thanh tẩy, chứ không chỉ người đã ở trạng thái thanh sạch.
- source_word: מִן הַצָּרַעַת
  choice: khỏi bệnh ngoài da
  rationale: צָרַעַת trong Lê-vi Ký bao quát một nhóm tình trạng liên quan đến da và không thể đồng nhất đơn giản với bệnh phong hiện đại.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Cách chuyển ngữ trực tiếp, tự nhiên của cụm chỉ số lần.
- source_word: וְטִהֲרוֹ
  choice: rồi tuyên bố người ấy là thanh sạch
  rationale: Trong bối cảnh tư tế và nghi lễ, động từ diễn tả sự xác nhận chính thức về tình trạng thanh sạch; “tuyên bố” truyền đạt chức năng nghi lễ-pháp lý mà không biến hành động này thành chẩn đoán y khoa.
- source_word: וְשִׁלַּח
  choice: phải thả
  rationale: שׁלח có nghĩa là sai đi hoặc phóng thích; ở đây “thả” diễn đạt tự nhiên việc cho con chim sống bay đi.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: con chim còn sống
  rationale: Cụm này phân biệt con chim ấy với con chim đã bị giết trong nghi thức trước đó.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: ra ngoài đồng trống
  rationale: Thành ngữ chỉ không gian rộng mở của đồng ruộng; cách diễn đạt này giữ được hình ảnh không gian và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch צָרַעַת
  choice: bệnh ngoài da
  alternative: bệnh phong
  rationale: Thuật ngữ Hê-bơ-rơ chỉ một phạm trù ô uế nghi lễ rộng hơn bệnh Hansen hiện đại; “bệnh ngoài da” tránh áp đặt một chẩn đoán y khoa không phù hợp lên bản văn.
- issue: Ý nghĩa của וְטִהֲרוֹ
  choice: tuyên bố người ấy là thanh sạch
  alternative: thanh tẩy người ấy
  rationale: Ở đây thầy tế lễ chính thức xác nhận địa vị thanh sạch trong nghi lễ. Cách dịch này phân biệt sự công nhận nghi lễ với việc chữa bệnh hay chỉ làm sạch thân thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” giữ chủ ngữ hàm ẩn của tiếng Hê-bơ-rơ và dựa vào văn cảnh để chỉ thầy tế lễ. “Thanh tẩy/thanh sạch” duy trì sự phân biệt giữa tiến trình nghi lễ và địa vị được công nhận sau nghi lễ.
