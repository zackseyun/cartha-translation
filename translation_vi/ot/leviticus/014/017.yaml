  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: vi
  text: Từ phần dầu còn lại trên lòng bàn tay mình, thầy tế lễ sẽ thoa một ít lên dái tai phải[a] của người đang được thanh tẩy, lên ngón cái của bàn tay phải và ngón cái của bàn chân phải của người ấy, trên máu của lễ tế chuộc lỗi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầu tai phải”. Từ Hê-bơ-rơ chỉ phần ngoài cùng của tai; trong nghi thức này, “dái tai” là cách hiểu rõ nhất.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “ngay tại chỗ đã thoa máu của lễ tế chuộc lỗi”; tức dầu được thoa vào cùng vị trí đã được đánh dấu bằng máu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: một ít dầu còn lại
  rationale: יֶתֶר chỉ phần còn dư; giới từ מִן mang nghĩa lấy từ phần ấy. Cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy thầy tế lễ chỉ dùng một phần dầu còn lại.
- source_word: עַל כַּפּוֹ
  choice: trên lòng bàn tay mình
  rationale: כַּף ở đây là lòng bàn tay, nơi thầy tế lễ đang giữ dầu; עַל được giữ bằng “trên”. Đại từ phản thân “mình” quy chiếu tự nhiên về thầy tế lễ.
- source_word: יִתֵּן
  choice: thoa lên
  rationale: נתן có nghĩa rộng là đặt hoặc cho. Trong nghi thức xức dầu lên các bộ phận cơ thể, “thoa lên” diễn đạt hành động tự nhiên, không thêm ý nghĩa thần học.
- source_word: תְּנוּךְ אֹזֶן
  choice: dái tai
  rationale: תְּנוּךְ chỉ phần ngoài hoặc phần tận cùng của tai trong công thức nghi lễ này; “dái tai” là thuật ngữ giải phẫu rõ ràng, quen thuộc trong tiếng Việt.
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Phân từ Hitpael diễn tả người đang trải qua tiến trình thanh tẩy theo nghi lễ; cách dịch giữ được sắc thái tiến hành và không đồng nhất việc này với sự thanh sạch đạo đức.
- source_word: בֹּהֶן יָדוֹ
  choice: ngón cái bàn tay phải
  rationale: בֹּהֶן khi nói về bàn tay là ngón cái. Việc lặp “bàn tay phải” phản ánh chính xác công thức nghi lễ.
- source_word: בֹּהֶן רַגְלוֹ
  choice: ngón cái bàn chân phải
  rationale: בֹּהֶן khi nói về bàn chân là ngón cái; đây là cách gọi thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: עַל דַּם הָאָשָׁם
  choice: trên máu của lễ chuộc lỗi
  rationale: עַל được dịch sát là “trên”, giữ khả năng dầu được đặt chồng lên hoặc đúng tại chỗ đã có máu. אָשָׁם là tên một loại lễ vật cụ thể liên quan đến lỗi phạm và trách nhiệm phải đền bù.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ אָשָׁם
  choice: lễ chuộc lỗi
  alternative: lễ bồi hoàn
  rationale: “Lễ chuộc lỗi” là cách gọi dễ hiểu và quen thuộc cho loại lễ vật này, đồng thời vẫn giữ trọng tâm về lỗi phạm. “Lễ bồi hoàn” làm nổi bật khía cạnh trách nhiệm và đền bù nhưng có thể thu hẹp trường nghĩa trong câu.
- issue: Quan hệ giữa dầu và máu trong cụm עַל דַּם הָאָשָׁם
  choice: giữ cách nói “trên máu” trong chính văn
  alternative: diễn giải là “ngay tại chỗ đã thoa máu”
  rationale: Giới từ עַל có thể gợi dầu được đặt lên trên máu hoặc tại đúng vị trí đã được đánh dấu bằng máu. Chính văn giữ cấu trúc nguồn, còn chú thích nêu rõ khả năng diễn giải theo nghi thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ nhịp liệt kê của công thức nghi lễ, dùng “thanh tẩy” để phân biệt sự thanh sạch nghi lễ với việc tẩy rửa thông thường. Các dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong chính văn.
