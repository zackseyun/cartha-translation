revisions:
- from: Thầy tế lễ sẽ lấy một ít dầu còn lại trên lòng bàn tay mình mà thoa lên dái tai phải[a] của người đang được thanh tẩy, lên ngón cái bàn tay phải và ngón cái bàn chân phải của người ấy, trên máu của lễ chuộc lỗi.[b]
  to: Từ phần dầu còn lại trên lòng bàn tay mình, thầy tế lễ sẽ thoa một ít lên dái tai phải[a] của người đang được thanh tẩy, lên ngón cái của bàn tay phải và ngón cái của bàn chân phải của người ấy, trên máu của lễ tế chuộc lỗi.[b]
  rationale: Bản sửa đặt rõ quan hệ “từ phần dầu còn lại”, vẫn giữ ý chỉ dùng một phần dầu để thoa, và làm cho chuỗi các bộ phận cơ thể sáng nghĩa hơn. Cụm “trên máu” được giữ nguyên để bảo tồn độ mở của giới từ עַל; chú thích giải thích cách hiểu theo nghi thức. Thuật ngữ tên lễ vật được điều chỉnh tối thiểu thành “lễ tế chuộc lỗi”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng trình tự nghi lễ, các bộ phận bên phải, và quan hệ dầu được thoa trên máu của lễ vật. Tuy nhiên, mở đầu “sẽ lấy một ít dầu còn lại” làm mờ cấu trúc partitive của tiếng Hê-bơ-rơ: hành động được thực hiện “từ phần dầu còn lại”, rồi dầu được thoa. Cần diễn đạt rõ hơn để không gợi rằng “một ít” là một lượng được lấy tách biệt trước hết.'
  naturalness: Câu có thể tự nhiên và sáng rõ hơn khi đưa cụm “Từ phần dầu còn lại...” lên đầu câu, đồng thời liên kết nhất quán các bộ phận cơ thể với người đang được thanh tẩy.
  terminology: “Dái tai” và “người đang được thanh tẩy” phù hợp. Để phân biệt thuật ngữ tế lễ אָשָׁם với các loại lễ khác và giữ tính kỹ thuật của danh từ này, “lễ tế chuộc lỗi” rõ hơn “lễ chuộc lỗi” trong ngữ cảnh nghi lễ.
  issues:
  - severity: medium
    issue: Cấu trúc partitive ở đầu câu chưa được phản ánh tối ưu.
    rationale: וּמִיֶּתֶר הַשֶּׁמֶן nghĩa là “từ phần dầu còn lại”. “Sẽ lấy một ít dầu còn lại” có thể hiểu là lấy một lượng dầu vốn còn lại, nhưng không biểu đạt trực tiếp quan hệ “từ phần còn lại” của câu nguồn.
  - severity: low
    issue: Tên lễ vật cần được đánh dấu rõ là thuật ngữ tế lễ.
    rationale: אָשָׁם là tên của một loại lễ vật cụ thể. Thêm “tế” trong “lễ tế chuộc lỗi” giúp tránh đọc như một hành động chuộc lỗi nói chung, mà không áp đặt một cách giải thích giáo phái.
