base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: vi
  text: Thầy tế lễ phải cho cạo phía trong ngôi nhà, khắp xung quanh; rồi người ta phải đem bụi[a] đã cạo ra đổ bên ngoài thành, tại một nơi ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nghĩa đen là “bụi” hoặc “đất bụi”; ở đây chỉ vật liệu bị cạo khỏi các bức tường của ngôi nhà.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַקְצִעַ
  choice: phải cho cạo
  rationale: 'Thể Hiphil mang ý gây khiến: người ấy truyền hoặc sắp xếp cho việc cạo được thực hiện, chứ không nhất thiết tự tay cạo.'
- source_word: מִבַּיִת סָבִיב
  choice: khắp mặt trong của ngôi nhà
  rationale: Cụm từ chỉ phần bên trong nhà, còn סָבִיב diễn tả việc cạo quanh khắp bề mặt nội thất.
- source_word: וְשָׁפְכוּ
  choice: người ta phải đem ... đổ
  rationale: Động từ ở số nhiều không nêu rõ chủ thể; cách diễn đạt phiếm chỉ bằng “người ta” tự nhiên trong tiếng Việt và giữ sự chuyển đổi số của nguyên văn.
- source_word: הֶעָפָר
  choice: phần bụi
  rationale: עָפָר có nghĩa đen là “bụi/đất bụi”; trong ngữ cảnh này, đó là vật liệu dạng bụi được cạo khỏi tường. Bản dịch giữ từ rộng hơn thay vì xác định đó là vữa.
- source_word: אֲשֶׁר הִקְצוּ
  choice: đã cạo ra
  rationale: Diễn tả phần vật liệu bị lấy khỏi bề mặt tường bằng hành động cạo.
- source_word: אֶל מִחוּץ לָעִיר אֶל מָקוֹם טָמֵא
  choice: tại một nơi ô uế bên ngoài thành
  rationale: Diễn đạt tự nhiên đích đến của việc đem đổ, đồng thời bảo toàn cả vị trí bên ngoài thành lẫn tính chất ô uế của nơi ấy.
theological_decisions:
- issue: Cách dịch טָמֵא trong bối cảnh thanh sạch nghi lễ của Lê-vi Ký
  choice: ô uế
  alternative: không tinh sạch; bị ô nhiễm
  rationale: “Ô uế” là thuật ngữ tiếng Việt quen thuộc cho phạm trù nghi lễ này và không tự động quy nó thành sự xấu xa về đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngôi nhà” được dùng cho tự nhiên trong tiếng Việt; “phải cho cạo” giữ sắc thái gây khiến, còn “người ta” phản ánh chủ thể số nhiều không được nêu rõ trong vế sau.
