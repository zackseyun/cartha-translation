revisions:
- from: Người ấy phải cho cạo khắp mặt trong của ngôi nhà; rồi người ta phải đem phần bụi[a] đã cạo ra đổ tại một nơi ô uế bên ngoài thành.
  to: Thầy tế lễ phải cho cạo phía trong ngôi nhà, khắp xung quanh; rồi người ta phải đem bụi[a] đã cạo ra đổ bên ngoài thành, tại một nơi ô uế.
  rationale: Bản sửa làm rõ chủ thể mà ngữ cảnh đã xác định là thầy tế lễ, giữ sắc thái gây khiến của Hiphil bằng “phải cho cạo”, và diễn đạt phạm vi bên trong quanh nhà tự nhiên hơn. “Bụi” được giữ theo nghĩa rộng của עָפָר; “nơi ô uế” bảo toàn thuật ngữ nghi lễ טָמֵא. Trật tự “bên ngoài thành, tại một nơi ô uế” phản ánh cả hai đích ngữ tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính: mệnh lệnh gây khiến ở động từ Hiphil הראשון, hành động số nhiều không nêu chủ thể ở vế sau, việc đổ vật liệu ra ngoài thành, và tính chất nghi lễ của nơi đó. Tuy nhiên, “Người ấy” không xác định tự nhiên trong một câu đứng riêng; chủ thể trong ngữ cảnh trực tiếp là thầy tế lễ. “Khắp mặt trong” cũng kém tự nhiên và có thể gợi một bề mặt đơn lẻ, trong khi tiếng Hê-bơ-rơ nói đến phía/bề mặt bên trong quanh nhà.'
  naturalness: Nên dùng “Thầy tế lễ” để câu tiếng Việt tự đủ nghĩa, “phía trong ngôi nhà, khắp xung quanh” để diễn đạt tự nhiên hơn מִבַּיִת סָבִיב, và “bụi đã cạo ra” thay cho “phần bụi” vốn hơi gượng. “Nơi ô uế” là tự nhiên trong văn phong Kinh Thánh hiện đại.
  terminology: “Ô uế” là lựa chọn phù hợp cho טָמֵא trong phạm trù thanh sạch nghi lễ. Không nên cụ thể hóa עָפָר thành vữa hay thạch cao; “bụi” cùng chú thích là sát nghĩa và đủ rộng.
  issues:
  - severity: medium
    issue: Chủ ngữ “Người ấy” thiếu quy chiếu rõ ràng.
    rationale: Đại từ ngôi ba số ít của nguyên văn quy chiếu đến thầy tế lễ trong ngữ cảnh gần. Trong tiếng Việt, đặc biệt khi câu được trích riêng, “Người ấy” gây mơ hồ; nêu “Thầy tế lễ” làm rõ mà không đổi nghĩa.
  - severity: low
    issue: Cụm “khắp mặt trong của ngôi nhà” chưa tự nhiên.
    rationale: Cụm này có thể gợi một “mặt” đơn lẻ. “Phía trong ngôi nhà, khắp xung quanh” diễn đạt rõ phạm vi nội thất quanh nhà của מִבַּיִת סָבִיב.
  - severity: low
    issue: “Phần bụi” hơi gượng trong tiếng Việt hiện đại.
    rationale: Danh từ xác định “bụi” đã đủ để chỉ vật liệu bị cạo; mệnh đề “đã cạo ra” xác định rõ vật liệu ấy.
