  text: וְ/הֶעֱלָ֧ה הַ/כֹּהֵ֛ן אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה הַ/מִּזְבֵּ֑חָ/ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/טָהֵֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: vi
  text: Rồi thầy tế lễ sẽ dâng tế lễ thiêu và lễ vật ngũ cốc trên bàn thờ. Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy, và người ấy sẽ trở nên thanh sạch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và người ấy sẽ được thanh tẩy.” Tiếng Hê-bơ-rơ sát nghĩa hơn nêu tình trạng kết quả: “và người ấy sẽ thanh sạch.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: sẽ dâng
  rationale: Dạng Hiphil của עלה trong ngữ cảnh tế lễ chỉ việc dâng lễ vật lên bàn thờ, chứ không chỉ đơn thuần đem đến.
- source_word: הָעֹלָה
  choice: tế lễ thiêu
  rationale: Đây là thuật ngữ tế lễ chỉ lễ vật được thiêu dâng; cách dịch này quen thuộc, rõ nghĩa và phù hợp văn mạch Lê-vi.
- source_word: הַמִּנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong luật tế lễ của sách Lê-vi, מִנְחָה chỉ lễ vật làm từ sản phẩm ngũ cốc; cách dịch này tránh nghĩa rộng hơn là quà biếu hay cống vật.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Hậu tố chỉ hướng ở đây, theo cách dùng nghi lễ, diễn tả việc dâng lễ vật trên bàn thờ.
- source_word: וְכִפֶּר עָלָיו
  choice: sẽ làm lễ chuộc tội cho người ấy
  rationale: Trong văn liệu tư tế, כפר chỉ hành động nghi lễ tạo sự chuộc tội; עָלָיו được diễn đạt tự nhiên là “cho người ấy”.
- source_word: וְטָהֵר
  choice: và người ấy sẽ trở nên thanh sạch
  rationale: Dạng Qal nêu tình trạng đạt được sau nghi lễ. “Trở nên thanh sạch” diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ phạm trù thanh sạch theo nghi lễ.
theological_decisions:
- issue: Bản chất của sự thanh sạch trong luật tư tế
  choice: thanh sạch theo nghi lễ
  alternative: sự trong sạch về đạo đức
  rationale: Lê-vi 14 nói về việc phục hồi địa vị thanh sạch sau tình trạng ô uế liên quan đến bệnh ngoài da. Bản dịch giữ thuật ngữ “thanh sạch” và không biến câu này thành lời khẳng định về sự biến đổi đạo đức.
- issue: Sắc thái của וְטָהֵר
  choice: 'nêu kết quả: “người ấy sẽ trở nên thanh sạch”'
  alternative: 'diễn tả tiến trình hoặc thể bị động: “người ấy sẽ được thanh tẩy”'
  rationale: Hình thái Qal trực tiếp nêu tình trạng của người ấy sau khi thầy tế lễ làm lễ chuộc tội; bản dịch chính giữ trọng tâm ấy, còn cách hiểu thiên về tiến trình được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thầy tế lễ” duy trì thuật ngữ quen thuộc; “lễ vật ngũ cốc” làm rõ loại מִנְחָה trong văn mạch. Tách thành hai câu để tiếng Việt tự nhiên hơn mà vẫn giữ trình tự nghi lễ của nguyên văn.
