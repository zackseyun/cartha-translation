base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/015.yaml
  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: vi
  text: Rồi thầy tế lễ phải lấy một ít dầu từ một lô-gơ dầu và đổ vào lòng bàn tay trái của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lô-gơ” là một đơn vị đo chất lỏng thời xưa.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ... phải lấy
  rationale: Dạng waw + qatal tiếp nối trình tự nghi lễ; “rồi” cùng “phải” diễn đạt tự nhiên tính tuần tự và quy định trong tiếng Việt.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi phổ thông, trang trọng và rõ nghĩa của כֹּהֵן trong bối cảnh nghi lễ.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: một ít dầu trong đấu lô-gơ
  rationale: מִן có sắc thái nguồn hoặc bộ phận; cách dịch cho thấy thầy tế lễ lấy một phần dầu từ lượng dầu đựng trong đơn vị lô-gơ, chứ không nhấc cả vật đo.
- source_word: לֹג
  choice: đấu lô-gơ
  rationale: Giữ tên riêng của đơn vị đo chất lỏng cổ bằng phiên âm, đồng thời thêm “đấu” để độc giả nhận biết đây là đơn vị đo.
- source_word: וְיָצַק
  choice: và đổ
  rationale: Động từ phối hợp tiếp tục chịu hiệu lực của “phải”, phù hợp văn phong chỉ dẫn nghi lễ.
- source_word: עַל כַּף
  choice: vào lòng bàn tay
  rationale: Dù עַל thường là “trên”, trong hành động rót vào bàn tay khum, “vào lòng bàn tay” diễn đạt tự nhiên và chính xác ý nghĩa thực tế.
- source_word: הַשְּׂמָאלִית
  choice: tay trái của chính mình
  rationale: Cụm từ làm rõ đó là tay trái của chính thầy tế lễ, phản ánh chủ thể được lặp lại trong tiếng Hê-bơ-rơ và tránh mơ hồ.
