  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: vi
  text: 'Thì chủ nhà phải đến báo cho thầy tế lễ rằng: “Trong nhà tôi xuất hiện một dấu vết như vết bệnh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “như một vết bệnh.” Chủ nhà chỉ báo một dấu vết hoặc tình trạng có vẻ như vậy, chứ chưa đưa ra chẩn đoán dứt khoát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: thì ... phải đến
  rationale: Trong trình tự luật lệ, động từ hoàn thành Qal có liên từ mang ý nghĩa hành động kế tiếp; “thì” thể hiện diễn tiến thủ tục, còn “phải đến” diễn đạt tính quy định tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: chủ nhà
  rationale: Cụm này có nghĩa đen là “người có ngôi nhà/người mà ngôi nhà thuộc về”; “chủ nhà” ngắn gọn, tự nhiên và truyền đạt đúng quan hệ sở hữu.
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: báo cho thầy tế lễ
  rationale: Thể Hiphil của נגד có nghĩa là làm cho biết hoặc trình báo. “Báo cho” phù hợp với bối cảnh trình báo chính thức, còn “thầy tế lễ” là cách gọi rõ ràng, trang trọng của כֹּהֵן.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dẫn lời trực tiếp tự nhiên trong tiếng Việt mà không cần dịch cứng thành “nói rằng” sau động từ “báo”.
- source_word: כְּנֶגַע
  choice: một thứ giống như vết bệnh
  rationale: Tiền tố כְּ biểu thị sự tương tự hoặc chưa xác định, nên “giống như” giữ nguyên tính dè dặt của lời trình báo. נֶגַע chỉ một vết hay tình trạng bất thường trong các luật về ô uế; “vết bệnh” dễ hiểu và không áp đặt một chẩn đoán y khoa hiện đại.
- source_word: נִרְאָה לִי
  choice: Tôi thấy ... xuất hiện
  rationale: Cách diễn đạt này giữ cả ý người chủ chỉ thuật lại điều mình quan sát và sắc thái “xuất hiện/được thấy” của thể Niphal, đồng thời tự nhiên trong tiếng Việt.
- source_word: בַּבָּיִת
  choice: trong nhà
  rationale: Giới từ בְּ ở đây chỉ ngôi nhà như nơi có tình trạng bất thường; “trong nhà” là cách diễn đạt rộng và tự nhiên.
theological_decisions:
- issue: Người chủ có xác quyết đây là một vết bệnh hay không
  choice: 'Giữ lời trình báo dè dặt: “một thứ giống như vết bệnh”'
  alternative: “một vết bệnh đã xuất hiện”
  rationale: Bản Hê-bơ-rơ dùng כְּ (“giống như”), cho thấy người chủ không tự đưa ra kết luận chính thức; việc thẩm định thuộc về thầy tế lễ trong trình tự kế tiếp.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. “Chủ nhà” và “báo cho” giúp câu gọn, dễ hiểu; lời trích dẫn giữ rõ sự quan sát có giới hạn của người trình báo. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
