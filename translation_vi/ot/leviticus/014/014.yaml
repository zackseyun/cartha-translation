    rationale: Tiếng Hê-bơ-rơ nêu rõ “ngón cái của tay phải người ấy” và “ngón cái của chân phải người ấy.” Thêm “của” và nêu “người ấy” cho cả hai cụm giúp tiếng Việt chuẩn, rõ, và phản ánh cấu trúc nguồn mà không đổi nghĩa.
