revisions:
- from: Rồi thầy tế lễ phải lấy một phần huyết của lễ vật chuộc lỗi[a]. Thầy tế lễ phải bôi huyết ấy lên dái tai phải[b] của người đang được thanh tẩy, lên ngón cái bàn tay phải và lên ngón cái bàn chân phải của người ấy.
  to: Rồi thầy tế lễ phải lấy một phần huyết của lễ vật chuộc lỗi[a]. Thầy tế lễ phải bôi huyết ấy lên dái tai phải[b] của người đang được thanh tẩy, lên ngón cái của bàn tay phải của người ấy, và lên ngón cái của bàn chân phải của người ấy.
  rationale: Chỉnh sửa chỉ nhằm làm rõ cú pháp sở hữu cách của hai cụm “ngón cái” và cải thiện cách diễn đạt chú thích. Nội dung nghi thức, thuật ngữ tế lễ, sắc thái đang được thanh tẩy, và các neo chú thích đều được giữ nguyên theo tiếng Hê-bơ-rơ.
