base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: vi
  text: Rồi thầy tế lễ phải lấy một phần huyết của lễ vật chuộc lỗi[a]. Thầy tế lễ phải bôi huyết ấy lên dái tai phải[b] của người đang được thanh tẩy, lên ngón cái của bàn tay phải của người ấy, và lên ngón cái của bàn chân phải của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “lấy từ huyết của lễ vật chuộc lỗi”; ý nói lấy một phần huyết để dùng trong nghi thức.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chóp tai phải”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: một phần huyết của
  rationale: Giới từ מִן mang nghĩa phân chia trong ngữ cảnh này. “Một phần huyết của” diễn đạt rõ rằng thầy tế lễ chỉ lấy một phần huyết để thực hiện nghi thức, đồng thời giữ sắc thái trang trọng.
- source_word: הָאָשָׁם
  choice: lễ vật chuộc lỗi
  rationale: אָשָׁם là lễ vật đặc thù trong hệ thống tế lễ Lê-vi, gắn với lỗi phạm và sự đền bù. “Lễ vật chuộc lỗi” vừa dễ hiểu vừa phân biệt với các loại lễ vật khác.
- source_word: תְּנוּךְ אֹזֶן
  choice: dái tai
  rationale: תְּנוּךְ chỉ phần ngoài cùng hoặc phần mềm của tai trong các nghi thức. “Dái tai” là cách gọi giải phẫu tự nhiên, dễ hiểu trong tiếng Việt hiện đại; phương án “đầu tai” được giữ trong chú thích vì nghĩa chính xác của từ Hê-bơ-rơ không hoàn toàn chắc chắn.
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Phân từ Hitpael trong ngữ cảnh chỉ người đang trải qua tiến trình thanh tẩy theo nghi thức. Cách dịch này tránh hàm ý rằng người ấy tự thanh tẩy mình hoặc nghi thức đã hoàn tất.
- source_word: הַיְמָנִית
  choice: phải
  rationale: Tính từ này xác định bộ phận ở bên phải; cách nói “tai phải”, “bàn tay phải”, “bàn chân phải” là tự nhiên trong tiếng Việt.
- source_word: בֹּהֶן יָדוֹ
  choice: ngón cái bàn tay
  rationale: Khi đi với יָד, בֹּהֶן chỉ ngón cái của bàn tay.
- source_word: בֹּהֶן רַגְלוֹ
  choice: ngón cái bàn chân
  rationale: Khi đi với רֶגֶל, בֹּהֶן chỉ ngón lớn nhất của bàn chân. “Ngón cái bàn chân” là cách nói phổ thông và rõ nghĩa.
- source_word: וְלָקַח ... וְנָתַן
  choice: phải lấy ... phải bôi
  rationale: Các động từ trong văn cảnh luật nghi lễ mang lực chỉ thị. “Phải” truyền đạt tính quy định; với huyết, “bôi” diễn đạt hành động đặt huyết lên một bộ phận cơ thể tự nhiên hơn “đặt” mà không thêm ý nghĩa ngoài văn bản.
theological_decisions:
- issue: Tình trạng của người tham dự nghi thức thanh tẩy
  choice: người đang được thanh tẩy
  alternative: người tự thanh tẩy; người đã được thanh tẩy
  rationale: Văn cảnh mô tả người này đang trải qua nghi thức do thầy tế lễ thực hiện. Cách dịch giữ tiến trình chưa hoàn tất và không biến người ấy thành chủ thể tự làm mình thanh sạch.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp thể loại luật nghi lễ. Dùng “huyết” thay cho “máu” để duy trì sắc thái tế lễ trong tiếng Việt Kinh Thánh; lặp lại “thầy tế lễ” theo cấu trúc nguồn để làm rõ chủ thể của cả hai hành động.
