base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: vi
  text: Bấy giờ, thầy tế lễ phải truyền cho người ta gỡ những viên đá có vết nhiễm[a] ra và ném chúng ra ngoài thành, đến một nơi ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “những viên đá mà trong đó có vết nhiễm.” Cụm từ Hê-bơ-rơ dịch sát là “những viên đá mà vết nhiễm ở trong đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Bấy giờ, ... phải truyền
  rationale: Liên từ waw với thể hoàn thành tiếp nối trình tự thủ tục và mang lực chỉ thị; “Bấy giờ” diễn đạt bước kế tiếp tự nhiên, còn “phải truyền” giữ sắc thái quy định.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách dịch chuẩn, rõ nghĩa của כֹּהֵן trong bối cảnh nghi lễ Lê-vi; mạo từ xác định được thể hiện theo cách tự nhiên trong tiếng Việt.
- source_word: וְחִלְּצוּ
  choice: cho người ta gỡ ... ra
  rationale: Động từ chỉ việc rút hoặc tháo vật ra. Với đá trong tường nhà, “gỡ ... ra” tự nhiên và cụ thể vừa đủ; chủ thể số nhiều không xác định được diễn đạt bằng “người ta” sau động từ truyền khiến.
- source_word: הָאֲבָנִים
  choice: những viên đá
  rationale: Dịch trực tiếp אֲבָנִים; loại từ “viên” phù hợp với đá xây mà không thêm chi tiết ngoài nguyên văn.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: có vết nhiễm[a]
  rationale: נֶגַע trong Lê-vi 13–14 là một dấu/vết gây ô nhiễm nghi lễ trên da, vải hoặc nhà. “Vết nhiễm” dễ hiểu và không khẳng định đó là một bệnh hay loại nấm mốc hiện đại cụ thể; chú thích bảo lưu cấu trúc sát nghĩa “vết nhiễm ở trong chúng”.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: và ném chúng
  rationale: “Ném” là tương đương hiện đại tự nhiên của השליך; “chúng” quy chiếu rõ đến những viên đá.
- source_word: אֶל מִחוּץ לָעִיר
  choice: ra ngoài thành
  rationale: Cụm giới từ biểu thị chuyển động đến bên ngoài khu dân cư; “ra ngoài thành” vừa tự nhiên vừa giữ hướng chuyển động.
- source_word: אֶל מָקוֹם טָמֵא
  choice: vào một nơi ô uế
  rationale: טָמֵא là thuật ngữ then chốt về tình trạng không thanh sạch theo nghi lễ. “Ô uế” là cách dịch quen thuộc và trang trọng trong ngữ cảnh này, không nhất thiết hàm ý bẩn về mặt vệ sinh hay tội lỗi đạo đức.
theological_decisions:
- issue: Thuật ngữ về tình trạng không thanh sạch trong luật Lê-vi
  choice: Dùng “ô uế” cho טָמֵא và “vết nhiễm” cho נֶגַע trong bối cảnh căn nhà
  alternative: Có thể dùng “không thanh sạch” cho טָמֵא; hoặc “tai họa”, “vết mốc”, “vết bệnh” cho נֶגַע.
  rationale: Câu này quy định về tình trạng nghi lễ, không xác định một chẩn đoán khoa học hiện đại. “Ô uế” giữ được phạm trù nghi lễ truyền thống; “vết nhiễm” diễn tả hiện tượng tác động đến đá mà không quyết đoán đó là bệnh phong hay nấm mốc.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại. Dùng “thầy tế lễ” và “ô uế” là những thuật ngữ Kinh Thánh quen thuộc; cấu trúc câu được điều chỉnh cho tự nhiên trong tiếng Việt mà vẫn giữ trình tự mệnh lệnh của nguyên văn.
