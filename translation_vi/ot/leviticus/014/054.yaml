base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/054.yaml
  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: vi
  text: Đây là luật về mọi trường hợp bệnh ngoài da và về chứng lở da đầu hoặc râu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “chứng phát ban có vảy”, theo truyền thống là “chốc đầu”. Từ Hê-bơ-rơ chỉ một chứng bệnh cụ thể, nhất là ở da đầu hoặc vùng râu, nhưng chưa xác định chắc chắn tương đương với bệnh nào trong y học hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Đây là luật
  rationale: Công thức kết luận chỉ toàn bộ quy định pháp lý và thủ tục đã nêu; “luật” tự nhiên và phù hợp văn cảnh Lê-vi Ký.
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: về mọi trường hợp bệnh ngoài da nghiêm trọng
  rationale: נֶגַע trong văn cảnh là một trường hợp tổn thương cần được khám xét; צָרַעַת không đồng nhất chắc chắn với bệnh phong Hansen hiện đại. Cách dịch này tránh sự đồng nhất sai nhưng vẫn diễn đạt đây không phải bệnh da thông thường.
- source_word: וְלַנָּתֶק
  choice: và về chứng lở da đầu hoặc râu
  rationale: נֶתֶק là tình trạng đặc thù tại vùng da đầu hoặc râu theo Lê-vi Ký 13; “lở” dễ hiểu hơn một thuật ngữ y khoa suy đoán, còn vị trí được nêu để phân biệt nghĩa.
