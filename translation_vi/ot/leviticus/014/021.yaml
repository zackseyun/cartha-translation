base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: vi
  text: Nhưng nếu người ấy nghèo, không đủ phương tiện[a], thì người ấy phải lấy một con chiên đực làm lễ vật chuộc lỗi, để dâng theo nghi thức đưa qua đưa lại, hầu làm lễ chuộc tội cho người ấy; cùng với một phần mười ê-pha bột mịn trộn dầu làm lễ vật ngũ cốc, và một lôg dầu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “tay người ấy không với tới”, tức là người ấy không đủ phương tiện.
    reason: lexical_alternative
  - marker: b
    text: “Lôg” là một đơn vị đo chất lỏng nhỏ được dùng trong luật nghi lễ của người Y-sơ-ra-ên.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: nghèo
  rationale: Diễn đạt trực tiếp tình trạng kinh tế thấp trong điều luật này bằng từ ngữ tự nhiên, dễ hiểu.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: không đủ khả năng
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “tay người ấy không với tới”, nhưng trong ngữ cảnh chỉ việc không đủ phương tiện tài chính; cách dịch này giữ đúng nghĩa mà không diễn giải quá mức.
- source_word: כֶּבֶשׂ אֶחָד
  choice: một con chiên đực
  rationale: כֶּבֶשׂ chỉ chiên non giống đực; nêu rõ giới tính phù hợp với tính chính xác của luật tế lễ.
- source_word: אָשָׁם
  choice: lễ vật chuộc lỗi
  rationale: Đây là thuật ngữ tế lễ riêng trong Lê-vi Ký; “lễ vật chuộc lỗi” vừa phân biệt loại lễ này vừa dễ hiểu trong tiếng Việt hiện đại.
- source_word: לִתְנוּפָה
  choice: để dâng đưa qua đưa lại
  rationale: Diễn tả nghi thức đưa qua đưa lại trước mặt Đức Chúa Trời, đồng thời cho thấy đây là cách trình dâng con chiên dùng làm lễ vật chuộc lỗi, chứ không phải một lễ vật riêng biệt.
- source_word: לְכַפֵּר עָלָיו
  choice: nhằm chuộc tội cho mình
  rationale: Giữ ngôn ngữ tế lễ và ý nghĩa nghi thức của כפר mà không áp đặt một lý thuyết thần học hẹp hơn; đại từ phản thân tự nhiên hơn trong câu tiếng Việt.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: một phần mười ê-pha bột mịn
  rationale: עִשָּׂרוֹן là đơn vị bằng một phần mười ê-pha trong luật tế lễ; cách dịch này làm rõ lượng đo mà vẫn giữ đơn vị cổ.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: trộn dầu
  rationale: Diễn đạt rõ ràng việc bột mịn được hòa trộn với dầu.
- source_word: לְמִנְחָה
  choice: làm lễ vật ngũ cốc
  rationale: Trong văn mạch tế lễ của Lê-vi Ký, מִנְחָה chỉ loại lễ vật làm từ sản phẩm ngũ cốc.
- source_word: לֹג שָׁמֶן
  choice: một lôg dầu
  rationale: Giữ nguyên tên đơn vị đo chất lỏng chuyên biệt vì không có phép quy đổi hiện đại nào hoàn toàn chắc chắn; chú thích giải thích đơn vị này.
theological_decisions:
- issue: Cách dịch hệ thuật ngữ tế lễ trong luật tư tế
  choice: Duy trì các thuật ngữ phân biệt như “lễ vật chuộc lỗi”, “dâng đưa qua đưa lại”, “chuộc tội” và “lễ vật ngũ cốc”.
  alternative: Dùng các lối diễn giải rộng hơn như “lễ vật bồi hoàn”, “trình dâng theo nghi thức” hoặc “thực hiện nghi thức thanh tẩy”.
  rationale: Câu này là chỉ dẫn pháp lý-nghi lễ, nên cần bảo tồn các phạm trù tế lễ riêng của tiếng Hê-bơ-rơ. Cách dịch được chọn giữ độ chính xác và sự căng thẳng thần học của nguyên văn mà không gắn כפר với một học thuyết giải tội riêng.
- issue: Quan hệ giữa lễ vật chuộc lỗi và nghi thức đưa qua đưa lại
  choice: Hiểu לִתְנוּפָה là nghi thức được thực hiện với chính con chiên làm lễ vật chuộc lỗi.
  alternative: Dịch thành một “lễ vật đưa qua đưa lại” riêng biệt.
  rationale: Cấu trúc câu gắn nghi thức đưa qua đưa lại với con chiên duy nhất dùng làm אָשָׁם; cách dịch tránh tạo ra một loại lễ vật thứ hai không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng, phù hợp với một điều luật tế lễ. Dùng “người ấy” thay cho đại từ mang dấu ấn cổ; giữ các đơn vị cổ “ê-pha” và “lôg”, đồng thời giải thích đơn vị ít quen thuộc hơn bằng chú thích. Dấu chấm phẩy giúp người đọc nhận ra con chiên, bột mịn và dầu là các thành phần trong cùng chỉ dẫn.
