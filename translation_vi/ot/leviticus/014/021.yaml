revisions:
- from: Nhưng nếu người ấy nghèo, không đủ khả năng[a], thì phải lấy một con chiên đực làm lễ vật chuộc lỗi để dâng đưa qua đưa lại, nhằm chuộc tội cho mình; cùng với một phần mười ê-pha bột mịn trộn dầu làm lễ vật ngũ cốc, và một lôg dầu[b].
  to: Nhưng nếu người ấy nghèo, không đủ phương tiện[a], thì người ấy phải lấy một con chiên đực làm lễ vật chuộc lỗi, để dâng theo nghi thức đưa qua đưa lại, hầu làm lễ chuộc tội cho người ấy; cùng với một phần mười ê-pha bột mịn trộn dầu làm lễ vật ngũ cốc, và một lôg dầu[b].
  rationale: Chỉnh nhẹ để phản ánh rõ hơn thành ngữ về phương tiện tài chính, tránh sự mơ hồ của “mình,” và làm tự nhiên cách diễn đạt nghi thức đưa qua đưa lại. Các nội dung tế lễ, thứ tự các lễ vật và các đơn vị đo đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
