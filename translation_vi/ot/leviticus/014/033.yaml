  source_fidelity: 'Bản dịch phản ánh đầy đủ công thức tiếng Hê-bơ-rơ: động từ kể chuyện «Yahweh phán», hai người nhận lời là Môi-se và A-rôn, cùng công thức dẫn lời «rằng:». Việc dùng «với Môi-se và A-rôn» diễn đạt tự nhiên mà vẫn bao quát cả hai đối tượng của אֶל ... וְאֶל.'
  naturalness: «Yahweh phán với Môi-se và A-rôn rằng:» là câu tiếng Việt hiện đại, trang trọng, súc tích và phù hợp với công thức văn xuôi Kinh Thánh. Dấu hai chấm sau «rằng» chuẩn bị cho lời phán tiếp theo.
  terminology: Giữ «Yahweh» nhất quán với quyết định dịch danh יהוה bằng danh riêng thay vì thay thế bằng tước hiệu. «Môi-se» và «A-rôn» là các dạng tên quen thuộc, dễ nhận biết trong tiếng Việt. «Phán» phù hợp với ngữ vực trang trọng nhưng không cổ khó hiểu.
