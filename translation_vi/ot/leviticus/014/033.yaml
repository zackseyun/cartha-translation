source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/033.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời Đức Chúa Trời được dịch là “phán”, một cách diễn đạt tự nhiên và trang trọng trong tiếng Việt; hình thái kể chuyện đánh dấu một sự kiện phát ngôn mới.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל ... וְאֶל
  choice: với ... và
  rationale: Giới từ đánh dấu những người trực tiếp nhận lời phán. Tiếng Việt tự nhiên dùng “phán với Môi-se và A-rôn”; liên từ vẫn cho thấy cả hai đều là người nhận lời.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng tên riêng quen dùng, dễ nhận biết trong tiếng Việt hiện đại.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dạng tên riêng quen dùng, dễ nhận biết trong tiếng Việt hiện đại.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Động từ nguyên mẫu này là công thức dẫn vào lời nói trực tiếp. “Rằng:” truyền đạt chức năng ấy tự nhiên hơn việc lặp “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH. Giữ “Yahweh” bảo tồn việc văn bản gọi đích danh Đức Chúa Trời, không âm thầm thay bằng tước hiệu hoặc một lối phiên âm khác.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và súc tích. Dùng công thức dẫn lời tự nhiên trong tiếng Việt: “phán với ... rằng:”. Không cần chú thích vì “Yahweh” xuất hiện trực tiếp trong chính văn và câu không có biến thể hay sự mơ hồ đáng kể cần giải thích.'
