  terminology: “Thầy tế lễ” là cách gọi dễ hiểu và phù hợp cho הַכֹּהֵן. “Rảy” là thuật ngữ nghi lễ thích hợp cho הִזָּה. Danh riêng “Yahweh” phản ánh trực tiếp יהוה và nhất quán với quyết định dự án được cung cấp.
