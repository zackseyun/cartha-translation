base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: vi
  text: Thầy tế lễ phải nhúng ngón tay phải vào dầu trên lòng bàn tay trái của mình, rồi dùng ngón tay rảy dầu bảy lần trước mặt Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: nhúng
  rationale: Động từ chỉ việc đưa một phần cơ thể hoặc vật vào chất lỏng; “nhúng” tự nhiên và phù hợp với hành động nghi lễ bằng ngón tay.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: ngón tay phải
  rationale: Cách diễn đạt trực tiếp, tự nhiên, đồng thời giữ sự xác định cụ thể về phía phải trong nghi lễ.
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: vào dầu trên lòng bàn tay trái của mình
  rationale: Sau động từ “nhúng”, מִן được diễn đạt tự nhiên bằng “vào”; כַּף trong ngữ cảnh này là lòng bàn tay chứ không chỉ chung cả bàn tay.
- source_word: הִזָּה
  choice: rảy
  rationale: “Rảy” là thuật ngữ tiếng Việt gọn và quen thuộc cho hành động làm văng những giọt chất lỏng trong nghi lễ.
- source_word: בְּאֶצְבָּעוֹ
  choice: dùng ngón tay
  rationale: Giới từ בְּ biểu thị phương tiện; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Giữ nguyên con số vì số lần thực hiện có ý nghĩa quy định trong nghi lễ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: “Trước mặt” bảo toàn ý niệm hiện diện trong לִפְנֵי và phù hợp với văn phong nghi lễ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong bản Hê-bơ-rơ, không thay bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” giữ được tính chất danh riêng và tránh biến nó thành tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” cho הַכֹּהֵן, “lòng bàn tay” để thể hiện chính xác כַּף, và “rảy” làm thuật ngữ nghi lễ ngắn gọn.
