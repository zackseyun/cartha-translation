  source_fidelity: 'Bản dịch bám sát tiếng Hê-bơ-rơ: chủ tế nhúng ngón tay phải vào dầu ở lòng bàn tay trái của mình, rồi dùng ngón tay ấy rảy dầu bảy lần trước mặt Yahweh. Cách diễn đạt “nhúng ... vào dầu” chuyển tải tự nhiên quan hệ מִן sau טָבַל; “rảy dầu” phù hợp với הִזָּה trong ngữ cảnh nghi lễ.'
