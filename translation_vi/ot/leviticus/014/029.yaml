  to: Thầy tế lễ phải bôi phần dầu còn lại trong lòng bàn tay thầy tế lễ lên đầu người đang được thanh tẩy, để làm lễ chuộc tội cho người ấy trước mặt Yahweh.
  rationale: Loại bỏ chú thích không an toàn vì nó có thể làm sai vai trò của người đang được thanh tẩy. Chỉnh “mình” thành “thầy tế lễ” chỉ nhằm làm rõ quy chiếu; các lựa chọn dịch thuật chính của bản nháp được giữ nguyên.
