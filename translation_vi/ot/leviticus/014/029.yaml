source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: vi
  text: Thầy tế lễ phải bôi phần dầu còn lại trong lòng bàn tay thầy tế lễ lên đầu người đang được thanh tẩy, để làm lễ chuộc tội cho người ấy trước mặt Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: phần dầu còn lại
  rationale: Cụm này diễn đạt lượng dầu còn dư trong nghi thức; cách nói này tự nhiên trong tiếng Việt và giữ được sắc thái bộ phận của מִן.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: trong lòng bàn tay mình
  rationale: כַּף là lòng bàn tay; dù עַל theo nghĩa sát là “trên”, tiếng Việt nói chất lỏng được giữ “trong lòng bàn tay” tự nhiên hơn. “Mình” quy chiếu rõ về thầy tế lễ.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: phải bôi ... lên đầu
  rationale: נתן có nghĩa rộng là đặt hoặc cho; với dầu trong hành động nghi lễ này, “bôi ... lên” diễn đạt tự nhiên và cụ thể mà không thêm ý niệm thần học ngoài văn bản.
- source_word: הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: Phân từ Hitpael chỉ người đang trải qua tiến trình trở nên thanh sạch theo nghi lễ; cách dịch giữ được khía cạnh đang diễn tiến.
- source_word: לְכַפֵּר עָלָיו
  choice: để làm lễ chuộc tội cho người ấy
  rationale: כפר là thuật ngữ tế tự quan trọng. “Làm lễ chuộc tội cho” giữ sắc thái nghi lễ và quan hệ thụ hưởng được đánh dấu bởi עַל.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי diễn tả hành động trong sự hiện diện của Đức Chúa Trời; tên giao ước יהוה được phiên âm là “Yahweh”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Văn bản Hê-bơ-rơ dùng trực tiếp danh riêng giao ước יהוה; phiên âm “Yahweh” bảo tồn đặc tính danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của כפר trong nghi thức thanh tẩy
  choice: làm lễ chuộc tội cho
  alternative: thực hiện sự đền chuộc cho; làm phép xá tội cho
  rationale: Cách dịch giữ ngôn ngữ tế tự của nguyên văn nhưng không tự quyết định cơ chế thần học của sự chuộc tội hay đồng nhất sự thanh sạch nghi lễ với việc được tha thứ về đạo đức.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt, đặt chủ ngữ “thầy tế lễ” ở đầu câu; các hình ảnh cụ thể của nghi thức và thuật ngữ tế tự vẫn được giữ lại.
