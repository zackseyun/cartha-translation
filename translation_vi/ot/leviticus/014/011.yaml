source:
  edition: WLC
  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: vi
  text: Thầy tế lễ làm lễ thanh tẩy sẽ đưa người đàn ông đang được thanh tẩy cùng với các vật ấy ra trước mặt Yahweh, tại lối vào Lều Hội Kiến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: sẽ trình diện
  rationale: Dạng Hiphil của עמד có nghĩa là khiến người hoặc vật đứng trước Yahweh trong bối cảnh nghi lễ. “Trình diện” diễn đạt tự nhiên hành động chính thức này; các lễ vật đi kèm cũng được bao hàm trong việc dâng trình trước mặt Ngài.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: thầy tế lễ làm lễ thanh tẩy
  rationale: Phân từ הַמְטַהֵר chỉ vai trò nghi lễ của thầy tế lễ trong tiến trình thanh tẩy. Cách dịch này tránh hàm ý rằng ông tạo nên sự tinh sạch về phương diện đạo đức.
- source_word: הָאִישׁ הַמִּטַּהֵר
  choice: người đang được thanh tẩy
  rationale: הָאִישׁ là người đàn ông được nói đến trong ngữ cảnh, còn phân từ Hitpael הַמִּטַּהֵר mô tả người đang trải qua tiến trình thanh tẩy theo nghi lễ. Tiếng Việt có thể dùng “người” tự nhiên mà không làm thay đổi đối tượng cụ thể.
- source_word: וְאֹתָם
  choice: cùng với những lễ vật ấy
  rationale: Đại từ số nhiều chỉ các con vật và những vật phẩm đã nêu ở câu trước. “Những lễ vật ấy” làm rõ sở chỉ theo ngữ cảnh và phù hợp chức năng nghi lễ của chúng.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ chỉ sự hiện diện trong nghi lễ và phiên âm trực tiếp danh giao ước יְהוָה là “Yahweh”.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: “Lối vào” diễn đạt tự nhiên địa điểm được chỉ định; “Lều Hội Kiến” là cách gọi trang trọng, quen thuộc cho אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Cách dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ ghi trực tiếp danh giao ước יְהוָה. Dùng “Yahweh” bảo tồn danh riêng thay vì thay thế bằng một tước hiệu.
- issue: Bản chất của sự thanh tẩy
  choice: ngôn ngữ thanh tẩy theo nghi lễ
  alternative: thanh tẩy đạo đức hoặc tha tội
  rationale: Ngữ cảnh Lê-vi Ký 14 nói đến quy trình khôi phục tình trạng tinh sạch theo nghi lễ; câu này không đồng nhất hành động của thầy tế lễ với việc tạo nên sự tinh sạch đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” cho כֹּהֵן, “thanh tẩy” để duy trì sắc thái nghi lễ, và viết hoa “Lều Hội Kiến” như tên gọi của nơi thánh.
