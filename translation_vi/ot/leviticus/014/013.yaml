source:
  edition: WLC
  text: וְ/שָׁחַ֣ט אֶת הַ/כֶּ֗בֶשׂ בִּ֠/מְקוֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת הַֽ/חַטָּ֛את וְ/אֶת הָ/עֹלָ֖ה בִּ/מְק֣וֹם הַ/קֹּ֑דֶשׁ כִּ֡י כַּ֠/חַטָּאת הָ/אָשָׁ֥ם הוּא֙ לַ/כֹּהֵ֔ן קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: vi
  text: Người ấy phải giết con chiên tại nơi thánh, nơi người ta giết lễ vật chuộc tội[a] và lễ vật thiêu; vì cũng như lễ vật chuộc tội, lễ vật chuộc lỗi[b] thuộc về thầy tế lễ; đó là vật chí thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”, nhấn mạnh chức năng thanh tẩy của nghi lễ trong luật tế lễ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lễ vật bồi hoàn”, nhấn mạnh phương diện đền bù của loại tế lễ này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Người ấy phải giết
  rationale: Trong ngữ cảnh tế lễ, שׁחט chỉ hành động giết con vật theo nghi thức. Tiếng Việt tự nhiên dùng “giết”; ngữ cảnh hiến tế giữ rõ sắc thái nghi lễ.
- source_word: הַכֶּבֶשׂ
  choice: con chiên
  rationale: כֶּבֶשׂ chỉ chiên non dùng làm sinh tế. “Con chiên” là cách gọi trang trọng, quen thuộc trong văn liệu Kinh Thánh tiếng Việt.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: tại nơi người ta giết
  rationale: Động từ số ít có chức năng phiếm chỉ trong điều luật; “người ta” truyền đạt tập quán/quy định chung mà không ấn định một chủ thể cụ thể.
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: חַטָּאת là tên một loại tế lễ; “lễ vật chuộc tội” giữ cách hiểu truyền thống, còn chức năng thanh tẩy được ghi nhận trong chú thích.
- source_word: הָעֹלָה
  choice: lễ vật thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn trên bàn thờ; “lễ vật thiêu” ngắn gọn và phân biệt rõ loại tế lễ.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: trong nơi thánh
  rationale: Mạo từ xác định chỉ khu vực thánh được quy định cho việc giết sinh tế; “nơi thánh” giữ sắc thái không gian phụng tự.
- source_word: כִּי כַחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: vì cũng như lễ vật chuộc tội, lễ vật chuộc lỗi thuộc về thầy tế lễ
  rationale: Câu diễn đạt sự tương đồng giữa hai loại tế lễ và quyền được nhận của thầy tế lễ. Cấu trúc tiếng Việt giữ cả phép so sánh lẫn ý sở thuộc.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: đó là vật chí thánh
  rationale: Cấu trúc sở thuộc trong tiếng Hê-bơ-rơ mang nghĩa cấp cao nhất của sự thánh; “vật chí thánh” giữ sắc thái phân loại kỹ thuật và trang trọng.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ này có thể nhấn mạnh tội lỗi hoặc chức năng thanh tẩy của nghi lễ. Bản chính dùng tên gọi truyền thống, dễ nhận biết; chú thích bảo lưu cách hiểu chức năng thanh tẩy.
- issue: Cách dịch אָשָׁם
  choice: lễ vật chuộc lỗi
  alternative: lễ vật bồi hoàn
  rationale: “Lễ vật chuộc lỗi” giữ tên loại tế lễ và mối liên hệ với tình trạng mắc lỗi; “lễ vật bồi hoàn” làm nổi bật phương diện đền bù nhưng có thể thu hẹp nghĩa trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; dùng thuật ngữ tế lễ nhất quán. Giữ phép so sánh và ý sở thuộc của nguyên văn, đồng thời bảo lưu các phương án dịch có ý nghĩa thần học trong chú thích.
