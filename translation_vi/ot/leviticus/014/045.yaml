  text: וְ/נָתַ֣ץ אֶת הַ/בַּ֗יִת אֶת אֲבָנָי/ו֙ וְ/אֶת עֵצָ֔י/ו וְ/אֵ֖ת כָּל עֲפַ֣ר הַ/בָּ֑יִת וְ/הוֹצִיא֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: vi
  text: Thầy tế lễ phải phá dỡ ngôi nhà, cả đá, gỗ và toàn bộ lớp vữa trát của nhà[a], rồi đem tất cả những thứ ấy ra một nơi ô uế bên ngoài thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «toàn bộ bụi (đất vụn) của nhà»; trong ngữ cảnh xây dựng, có lẽ chỉ vật liệu vữa trát bị cạo khỏi tường.'
    reason: Từ Hê-bơ-rơ עָפָר nghĩa đen là «bụi/đất vụn», nhưng có thể chỉ lớp vật liệu trát trong ngữ cảnh xử lý ngôi nhà.
lexical_decisions:
- source_word: וְנָתַץ
  choice: phải phá dỡ
  rationale: Động từ נתץ trong ngữ cảnh này chỉ việc tháo phá hoàn toàn một ngôi nhà bị nhiễm ô. “Phá dỡ” tự nhiên và chính xác trong tiếng Việt hiện đại; từ nối וְ tiếp tục mệnh lệnh/hệ quả của quy trình trong văn cảnh.
- source_word: הַבַּיִת
  choice: ngôi nhà
  rationale: בַּיִת ở đây nói đến công trình vật chất đang được kiểm tra và xử lý.
- source_word: אֲבָנָיו
  choice: đá
  rationale: Danh từ số nhiều có nghĩa đen là “đá của nó”; cách diễn đạt liệt kê “gồm đá...” truyền đạt tự nhiên rằng toàn bộ vật liệu của ngôi nhà phải bị dỡ bỏ.
- source_word: עֵצָיו
  choice: gỗ
  rationale: עֵץ có thể chỉ gỗ hay các cấu kiện bằng gỗ. “Gỗ” giữ được độ rộng của từ Hê-bơ-rơ, không thu hẹp riêng thành xà hoặc dầm.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: mọi lớp vữa trát của nhà
  rationale: עָפָר theo nghĩa đen là bụi hoặc đất vụn, nhưng trong quy trình xử lý nhà ở của đoạn này nhiều khả năng chỉ vật liệu trát bị cạo khỏi tường. “Lớp vữa trát” phù hợp ngữ cảnh xây dựng và dễ hiểu.
- source_word: וְהוֹצִיא
  choice: rồi đem tất cả ra
  rationale: Dạng sai khiến của יצא có nghĩa là đưa hoặc mang ra. “Đem tất cả ra” diễn đạt tự nhiên việc vận chuyển toàn bộ vật liệu vừa liệt kê.
- source_word: אֶל מִחוּץ לָעִיר
  choice: bên ngoài thành
  rationale: Cụm từ chỉ đích đến ở ngoài ranh giới khu dân cư; “thành” phù hợp bối cảnh đô thị cổ và lối văn Kinh Thánh trang trọng.
- source_word: אֶל מָקוֹם טָמֵא
  choice: một nơi ô uế
  rationale: טָמֵא là thuật ngữ về tình trạng không thanh sạch theo nghi lễ. “Ô uế” bảo toàn sắc thái luật nghi lễ, thay vì chỉ gợi sự bẩn thỉu vật lý.
theological_decisions:
- issue: Cách dịch thuật ngữ thanh sạch nghi lễ טָמֵא
  choice: ô uế
  alternative: không thanh sạch
  rationale: “Ô uế” là cách nói ngắn gọn, quen thuộc trong tiếng Việt Kinh Thánh và giữ được phạm vi nghi lễ-pháp lý của Lê-vi Ký, không biến câu thành nhận định đơn thuần về vệ sinh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ta phải” để giữ chủ thể không xác định của động từ Hê-bơ-rơ trong mạch luật lệ; tránh tự ý xác định đó là thầy tế lễ hay chủ nhà. Cấu trúc “gồm...” làm rõ rằng đá, gỗ và vữa trát là các bộ phận/vật liệu của ngôi nhà bị phá dỡ.
