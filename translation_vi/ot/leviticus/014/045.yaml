- from: Người ta phải phá dỡ ngôi nhà, gồm đá, gỗ và mọi lớp vữa trát của nhà, rồi đem tất cả ra một nơi ô uế bên ngoài thành.
  to: Thầy tế lễ phải phá dỡ ngôi nhà, cả đá, gỗ và toàn bộ lớp vữa trát của nhà[a], rồi đem tất cả những thứ ấy ra một nơi ô uế bên ngoài thành.
