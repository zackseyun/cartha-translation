source:
  edition: WLC
  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: vi
  text: 'Đây sẽ là quy định dành cho người bị chứng phong[a] vào ngày thanh tẩy của người ấy: người ấy sẽ được đưa đến thầy tế lễ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng một từ chỉ người bị tình trạng צָרַעַת (tsa-ra-át), theo truyền thống thường được dịch là “phong” hoặc “phung”; tình trạng này không nhất thiết là bệnh phong Hansen theo y học hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Đây sẽ là
  rationale: Giữ cách mở đầu bằng đại từ chỉ định và sắc thái quy định của động từ chưa hoàn thành trong văn bản luật, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: תּוֹרַת
  choice: quy định dành cho
  rationale: Trong ngữ cảnh này, תּוֹרָה chỉ thủ tục nghi lễ được ấn định. “Quy định” diễn đạt rõ chức năng pháp-nghi lễ hơn là một giáo lý trừu tượng; “dành cho” thể hiện quan hệ sở thuộc với danh từ theo sau.
- source_word: הַמְּצֹרָע
  choice: người mắc bệnh phong
  rationale: Diễn tả một người bị tình trạng צָרַעַת mà không đồng nhất căn tính của người ấy với bệnh trạng. Cách gọi truyền thống được giữ lại, còn chú thích làm rõ rằng đây không nhất thiết là bệnh Hansen theo y học hiện đại.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: vào ngày người ấy được thanh tẩy
  rationale: Diễn đạt tự nhiên cụm chỉ thời gian và ý nghĩa thanh sạch theo nghi lễ của căn טהר; cấu trúc bị động cho thấy người ấy trải qua nghi thức thanh tẩy.
- source_word: וְהוּבָא
  choice: người ấy sẽ được đưa
  rationale: Giữ thể bị động Hophal và sắc thái trình tự của thủ tục. Dấu hai chấm trong tiếng Việt đảm nhiệm việc nối mệnh đề nên không cần dịch riêng liên từ וְ.
- source_word: אֶל הַכֹּהֵן
  choice: đến thầy tế lễ
  rationale: Giữ tính xác định của danh từ tiếng Hê-bơ-rơ, chỉ vị thầy tế lễ phụ trách việc kiểm tra và nghi thức trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch מְצֹרָע và mối liên hệ với thuật ngữ “bệnh phong”
  choice: người mắc bệnh phong
  alternative: người mắc bệnh ngoài da; người phung
  rationale: מְצֹרָע là người bị צָרַעַת, một tình trạng liên quan đến ô uế nghi lễ và không thể đồng nhất chính xác với bệnh phong Hansen hiện đại. Bản dịch giữ thuật ngữ quen thuộc nhưng dùng “người mắc” để không biến bệnh trạng thành căn tính, đồng thời chú thích giới hạn y học của thuật ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quy định” phù hợp với thủ tục nghi lễ; “thầy tế lễ” giữ cách gọi quen thuộc trong văn cảnh Lê-vi Ký. Đại từ “người ấy” tránh giả định giới tính trong tiếng Việt dù hậu tố Hê-bơ-rơ ở giống đực số ít.
