base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/039.yaml
  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: vi
  text: Đến ngày thứ bảy, thầy tế lễ sẽ trở lại xem xét; nếu thấy vết nhiễm đã lan ra trên các bức tường của ngôi nhà,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: sẽ trở lại
  rationale: Diễn đạt tự nhiên ý thầy tế lễ quay lại sau thời gian ngôi nhà bị đóng cửa.
- source_word: וְרָאָה
  choice: xem xét
  rationale: Trong bối cảnh kiểm tra nghi lễ, “xem xét” tự nhiên và chính xác hơn “nhìn” đơn thuần.
- source_word: הַנֶּגַע
  choice: vết nhiễm
  rationale: Danh từ chỉ dấu/vết bất thường gây tình trạng ô uế trên nhà; “vết nhiễm” giữ sắc thái vật chất mà không áp đặt một chẩn đoán hiện đại.
- source_word: פָשָׂה
  choice: đã lan ra
  rationale: Thể hiện rõ sự phát triển hoặc lan rộng của vết trên bề mặt tường.
- source_word: בְּקִירֹת הַבָּיִת
  choice: trên các bức tường của ngôi nhà
  rationale: Giới từ ב trong ngữ cảnh bề mặt được diễn đạt tự nhiên bằng “trên”; số nhiều của קִיר được giữ lại.
theological_decisions:
- issue: Cách hiểu וְהִנֵּה trong chuỗi điều kiện
  choice: nếu thấy
  alternative: và kìa
  rationale: Ở đây וְהִנֵּה giới thiệu kết quả quan sát làm điều kiện cho mệnh đề tiếp theo; “nếu thấy” truyền đạt chức năng cú pháp tự nhiên trong tiếng Việt, không thêm diễn giải thần học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ câu chưa trọn ý bằng dấu phẩy vì câu này dẫn trực tiếp sang chỉ dẫn ở câu 40.
