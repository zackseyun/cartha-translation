  yaml_path: translation/ot/leviticus/014/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “ĐỨC GIÊ-HÔ-VA” hoặc “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn lời trực tiếp của Đức Chúa Trời được dịch là “phán”, cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời dưới dạng phiên âm đã quen thuộc trong tiếng Việt, thay vì thay bằng tước hiệu “CHÚA”.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, giới từ אֶל được chuyển sang cách nói tự nhiên của tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng phổ biến trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Từ này dẫn vào nội dung lời phán ở câu kế tiếp; “rằng” chuyển tải chức năng cú pháp ấy tự nhiên hơn “nói rằng” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ đây là danh riêng chứ không thay bằng một tước hiệu. “Đức Giê-hô-va” là dạng trang trọng và dễ nhận biết đối với độc giả Việt; “Yahweh” phản ánh cách phục nguyên học thuật thường gặp nhưng chưa tự nhiên bằng trong văn bản tiếng Việt phổ thông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và tự nhiên. Dùng công thức “phán với … rằng” để nối trực tiếp sang nội dung lời phán ở câu tiếp theo.
