  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: vi
  text: 'Còn trong số các sinh vật bò lúc nhúc trên đất, những loài sau đây là ô uế đối với các ngươi: chuột chũi[a], chuột và thằn lằn lớn, theo loài của nó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Danh tính chính xác của hai tên động vật Hê-bơ-rơ được dịch là “chuột chũi” và “thằn lằn lớn” chưa chắc chắn. Các cách dịch truyền thống khác gồm “chồn” hoặc “chuột chũi” cho tên thứ nhất, và “rùa cạn” hoặc đơn giản là “thằn lằn” cho tên thứ hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Còn ... những loài sau đây
  rationale: Dù đại từ Hê-bơ-rơ ở số ít, nó dẫn vào một danh sách gồm nhiều con vật. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời giữ chức năng chuyển tiếp của וְ và ý chỉ định của זֶה.
- source_word: לָכֶם
  choice: đối với các ngươi
  rationale: Giới từ לְ ở đây nêu quan hệ với cộng đồng được phán bảo. “Đối với các ngươi” diễn đạt rõ rằng các con vật này bị xem là ô uế trong phạm vi luật dành cho Israel.
- source_word: הַטָּמֵא
  choice: ô uế
  rationale: Đây là thuật ngữ quen thuộc và thích hợp cho tình trạng không thanh sạch theo nghi lễ trong luật Lê-vi, không tự động hàm ý xấu xa về đạo đức.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: trong số các sinh vật bò lúc nhúc
  rationale: שֶׁרֶץ chỉ các sinh vật nhỏ di chuyển đông đúc hoặc sát mặt đất. “Bò lúc nhúc” truyền đạt hình ảnh của gốc từ lặp lại trong tiếng Hê-bơ-rơ mà vẫn dễ hiểu trong tiếng Việt.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Trong ngữ cảnh phân loại động vật, cụm từ chỉ môi trường trên mặt đất; “trên đất” tự nhiên hơn “trên trái đất”.
- source_word: הַחֹלֶד
  choice: chuột chũi
  rationale: Danh tính động vật học không chắc chắn. “Chuột chũi” là một cách hiểu hiện đại có thể biện hộ, còn các khả năng truyền thống khác được nêu trong chú thích.
- source_word: הָעַכְבָּר
  choice: chuột nhắt
  rationale: עַכְבָּר thường chỉ chuột nhỏ hoặc nhóm gặm nhấm giống chuột. “Chuột nhắt” giúp phân biệt tự nhiên với “chuột chũi” đứng trước.
- source_word: הַצָּב
  choice: thằn lằn lớn
  rationale: Danh tính chính xác không chắc chắn, nhưng một loài bò sát thuộc nhóm thằn lằn phù hợp với ngữ cảnh; yếu tố “lớn” phản ánh một cách nhận diện từ vựng có cơ sở mà không khẳng định loài cụ thể.
- source_word: לְמִינֵהוּ
  choice: tùy theo từng loại
  rationale: Cụm phân loại cố định này cho biết con vật vừa nêu bao gồm các loại thuộc nhóm của nó. Cách dịch giữ ý phân loại và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Tính chất của sự ô uế
  choice: ô uế
  alternative: dơ bẩn; xấu xa
  rationale: Trong văn mạch luật về thanh sạch, טָמֵא nói đến địa vị nghi lễ. Bản dịch tránh biến khái niệm này thành nhận định thuần vệ sinh hoặc phán xét đạo đức.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Đại từ “các ngươi” giữ sắc thái lời phán trực tiếp cho toàn cộng đồng; các tên động vật được diễn đạt bằng từ ngữ phổ thông, còn sự bất định về nhận diện loài được bảo lưu trong chú thích.
