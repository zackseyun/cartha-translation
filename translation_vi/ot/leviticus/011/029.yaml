  source_fidelity: Bản dịch truyền đạt đúng cấu trúc liệt kê các sinh vật bị xem là ô uế trong nhóm שֶׁרֶץ trên đất, đồng thời bảo lưu sự bất định về hai tên loài. Tuy nhiên, עַכְבָּר là từ khái quát hơn “chuột nhắt”; “chuột” sát nghĩa hơn. Cụm לְמִינֵהוּ có hậu tố số ít quy về con vật cuối danh sách, nên “theo loài của nó” phản ánh sát hơn “tùy theo từng loại.”
