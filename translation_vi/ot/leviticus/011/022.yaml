  text: אֶת אֵ֤לֶּה מֵ/הֶם֙ תֹּאכֵ֔לוּ אֶת הָֽ/אַרְבֶּ֣ה לְ/מִינ֔/וֹ וְ/אֶת הַ/סָּלְעָ֖ם לְ/מִינֵ֑/הוּ וְ/אֶת הַ/חַרְגֹּ֣ל לְ/מִינֵ֔/הוּ וְ/אֶת הֶ/חָגָ֖ב לְ/מִינֵֽ/הוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: vi
  text: 'Trong số chúng, các ngươi được ăn những loài này: châu chấu theo từng loại[a], châu chấu trụi theo từng loại, dế theo từng loại, và cào cào theo từng loại.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngoài từ “châu chấu”, việc xác định chính xác các tên côn trùng Hê-bơ-rơ trong câu này vẫn chưa chắc chắn; theo cách dịch truyền thống, סָלְעָם được dịch là “châu chấu trụi” và חַרְגֹּל là “dế”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: Trong số chúng, ... những loài này
  rationale: Cụm này giới thiệu một nhóm được phép ăn trong số các sinh vật có cánh đã nói trước đó; cách diễn đạt tiếng Việt tự nhiên mà vẫn giữ quan hệ bộ phận.
- source_word: תֹּאכֵלוּ
  choice: các ngươi được ăn
  rationale: Dạng vị hoàn thành ở đây mang ý nghĩa cho phép trong luật ăn uống; “được ăn” truyền đạt rõ sự cho phép, không biến thành mệnh lệnh phải ăn.
- source_word: הָאַרְבֶּה
  choice: châu chấu
  rationale: Đây là tên Hê-bơ-rơ thông dụng chỉ châu chấu di cư và là nhận dạng chắc chắn nhất trong danh sách.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: theo từng loại
  rationale: Giữ ý nghĩa phân loại của công thức lặp lại trong Ngũ Kinh và đọc tự nhiên trong tiếng Việt hiện đại.
- source_word: הַסָּלְעָם
  choice: châu chấu trụi
  rationale: Việc xác định chính xác loài côn trùng này không chắc chắn. Cách gọi này phản ánh lối dịch truyền thống “bald locust”, còn sự bất định được nêu trong chú thích.
- source_word: הַחַרְגֹּל
  choice: dế
  rationale: “Dế” là cách dịch truyền thống, dễ hiểu cho một côn trùng bộ Cánh thẳng biết nhảy; tuy nhiên nhận dạng chính xác vẫn chưa chắc chắn.
- source_word: הֶחָגָב
  choice: cào cào
  rationale: Từ này thường chỉ một loại côn trùng giống châu chấu; “cào cào” vừa tự nhiên trong tiếng Việt vừa phân biệt nó với אַרְבֶּה trong cùng câu.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “các ngươi” để diễn đạt ngôi thứ hai số nhiều trong lời luật; cấu trúc liệt kê và sự lặp lại “theo từng loại” được giữ nguyên nhằm phản ánh nhịp điệu và tính phân loại của nguyên văn.
