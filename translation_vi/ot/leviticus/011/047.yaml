  text: לְ/הַבְדִּ֕יל בֵּ֥ין הַ/טָּמֵ֖א וּ/בֵ֣ין הַ/טָּהֹ֑ר וּ/בֵ֤ין הַֽ/חַיָּה֙ הַֽ/נֶּאֱכֶ֔לֶת וּ/בֵין֙ הַֽ/חַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: vi
  text: để phân biệt loài ô uế với loài thanh sạch, và sinh vật được phép ăn với sinh vật không được phép ăn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: để phân biệt
  rationale: Động từ nguyên mẫu có tiền tố לְ diễn tả mục đích trong mạch văn trước; “để phân biệt” tự nhiên và giữ đúng ý nhận định các loại theo luật định.
- source_word: בֵּין ... וּבֵין
  choice: phân biệt ... với ...
  rationale: Cách diễn đạt tiếng Việt này chuyển tải rõ hai cặp đối lập do giới từ בֵּין được lặp lại, đồng thời tránh cấu trúc gượng ép.
- source_word: הַטָּמֵא / הַטָּהֹר
  choice: loài ô uế / loài thanh sạch
  rationale: “Ô uế” và “thanh sạch” thể hiện các phạm trù nghi lễ-pháp lý trong Lê-vi Ký, không biến chúng thành phán đoán về đạo đức. Thêm “loài” theo đối tượng động vật được tóm lược trong câu.
- source_word: הַחַיָּה
  choice: sinh vật
  rationale: Ở đây từ này chỉ động vật hay sinh vật sống nói chung; “sinh vật” đủ rộng và không giới hạn nghĩa vào thú hoang.
- source_word: הַנֶּאֱכֶלֶת
  choice: được phép ăn
  rationale: Phân từ Niphal trong ngữ cảnh luật ăn uống nói đến điều được cho phép hoặc thích hợp để ăn, chứ không chỉ điều có khả năng ăn được.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: không được phép ăn
  rationale: Mệnh đề này đối lập điều bị cấm với điều được phép; cách dịch làm rõ sắc thái quy định của luật mà vẫn dùng tiếng Việt hiện đại.
theological_decisions:
- issue: Thuật ngữ thanh sạch nghi lễ trong luật Lê-vi
  choice: Dịch טָמֵא/טָהֹר là “ô uế/thanh sạch” theo nghĩa nghi lễ-pháp lý.
  alternative: “không tinh sạch/tinh sạch” hoặc “dơ sạch/thanh sạch”
  rationale: Cặp từ đã chọn bảo tồn sự phân loại của văn bản mà không hàm ý rằng loài ô uế tự thân là xấu xa về đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc song song của hai cặp phân biệt; dùng “được phép ăn/không được phép ăn” để nêu rõ tính cho phép và cấm đoán trong luật ăn uống.
