  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: vi
  text: Mọi thức ăn có thể ăn được[a] mà nước chạm vào sẽ trở nên ô uế; và mọi thức uống có thể uống được trong bất cứ vật chứa nào cũng sẽ trở nên ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát nghĩa hơn: “mọi thức ăn được ăn, mà nước đến trên đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: Mọi thức ăn
  rationale: Cụm giới từ mang ý nghĩa khái quát/phân phối trong điều luật; “mọi thức ăn” tự nhiên và bao quát trong tiếng Việt.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: có thể ăn được
  rationale: Dạng Niphal chưa hoàn thành xác định loại thức ăn dùng để ăn hoặc ăn được, thay vì chỉ nói đến hành động đã ăn.
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: nếu nước dính vào
  rationale: Diễn đạt điều kiện pháp lý một cách tự nhiên; “dính vào” chuyển tải việc nước tiếp xúc với thức ăn mà không nêu tác nhân không có trong nguyên văn.
- source_word: יִטְמָא
  choice: sẽ trở nên ô uế
  rationale: Động từ chỉ sự chuyển sang tình trạng ô uế theo nghi lễ; “trở nên” giữ rõ kết quả thay đổi trạng thái.
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: thức uống có thể uống được
  rationale: Giữ sự song hành với mệnh đề về thức ăn và diễn đạt loại chất dùng để uống.
- source_word: בְּכָל כְּלִי
  choice: ở trong bất cứ vật đựng nào
  rationale: כְּלִי là từ rộng chỉ đồ dùng hay vật chứa; “vật đựng” rõ nghĩa hơn “bình” và không thu hẹp loại đồ vật.
theological_decisions:
- issue: Ý nghĩa của טמא trong luật thanh sạch
  choice: ô uế
  alternative: không tinh sạch
  rationale: “Ô uế” là cách gọi quen thuộc cho tình trạng nghi lễ trong Lê-vi Ký, không hàm ý rằng thức ăn hay thức uống tự thân mang tội lỗi đạo đức.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “vật đựng” thay cho từ chuyên biệt nhằm giữ phạm vi rộng của כְּלִי; giữ cấu trúc song hành giữa thức ăn và thức uống.
