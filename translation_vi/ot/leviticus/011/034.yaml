revisions:
- from: Mọi thức ăn có thể ăn được[a], nếu nước dính vào, thì sẽ trở nên ô uế; và mọi thức uống có thể uống được ở trong bất cứ vật đựng nào cũng sẽ trở nên ô uế.
  to: Mọi thức ăn có thể ăn được[a] mà nước chạm vào sẽ trở nên ô uế; và mọi thức uống có thể uống được trong bất cứ vật chứa nào cũng sẽ trở nên ô uế.
  rationale: Bản sửa làm rõ đại từ quy chiếu của nguyên văn bằng mệnh đề quan hệ, dùng “chạm vào” làm cách diễn đạt trung tính cho việc nước đến trên thức ăn, và thay “vật đựng” bằng “vật chứa” để tự nhiên hơn. Không thay đổi ý nghĩa nghi lễ hay thêm tác nhân.
