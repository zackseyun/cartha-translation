  terminology: “Ô uế” phù hợp cho tình trạng nghi lễ trong Lê-vi Ký. “Xác” là cách dịch gọn, đúng cho נְבֵלָה trong ngữ cảnh này. Không cần chú thích; cách dịch giữ được ý câu mà không áp đặt diễn giải giáo phái.
