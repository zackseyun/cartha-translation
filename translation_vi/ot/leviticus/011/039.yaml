  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: vi
  text: Nếu một con trong số các gia súc mà các ngươi được dùng làm thức ăn chết, thì ai chạm vào xác nó sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện tiếp nối các quy định trước; trong tiếng Việt, “Nếu” diễn đạt tự nhiên lực điều kiện, còn quan hệ nối kết đã rõ từ văn cảnh.
- source_word: יָמוּת
  choice: chết
  rationale: Động từ Qal vị hoàn trong mệnh đề điều kiện được diễn đạt tự nhiên bằng “chết”.
- source_word: מִן הַבְּהֵמָה
  choice: một con trong số gia súc
  rationale: 'מִן mang nghĩa phân bộ: một con thuộc nhóm בְּהֵמָה; “gia súc” phù hợp với loài vật nuôi trong văn cảnh luật thực phẩm.'
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: dùng làm thức ăn cho anh em
  rationale: Giữ sát ý phân loại con vật là thức ăn dành cho cộng đồng, đồng thời tự nhiên hơn lối dịch từng chữ “là cho anh em để ăn”.
- source_word: הַנֹּגֵעַ
  choice: ai chạm vào
  rationale: Phân từ được danh từ hóa chỉ bất cứ người nào thực hiện hành động; “ai chạm vào” rõ ràng và tự nhiên trong điều luật tiếng Việt.
- source_word: בְּנִבְלָתָהּ
  choice: xác nó
  rationale: נְבֵלָה chỉ xác của con vật đã chết; “xác nó” ngắn gọn, chính xác và phù hợp văn cảnh.
- source_word: יִטְמָא
  choice: sẽ bị ô uế
  rationale: Diễn đạt tình trạng trở nên ô uế theo nghi lễ mà không biến nó thành sự dơ bẩn thông thường.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Công thức thời gian chỉ tình trạng kéo dài đến buổi chiều tối; cách nói này rõ và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: ô uế
  alternative: không tinh sạch
  rationale: “Ô uế” là thuật ngữ quen thuộc cho phạm trù nghi lễ trong luật Lê-vi, tránh hiểu đơn thuần là mất vệ sinh hay phạm tội đạo đức.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, câu cú trực tiếp và dễ hiểu. Dùng “anh em” làm đại từ số nhiều chỉ cộng đồng giao ước; không thêm chú thích vì bản dịch có thể truyền đạt đầy đủ câu Hê-bơ-rơ mà không cần nêu dị bản.
