  source_fidelity: Bản nháp truyền đạt đúng cấu trúc điều kiện, ý phân bộ của מִן־הַבְּהֵמָה, việc chạm vào xác, và thời hạn đến chiều tối. Tuy nhiên, “cho anh em” thu hẹp đại từ số nhiều לָכֶם thành cách xưng hô mang sắc thái nội bộ/giới tính không có trong nguyên ngữ. “Các ngươi được dùng làm thức ăn” phản ánh sát hơn quan hệ phân loại của cụm Hê-bơ-rơ.
