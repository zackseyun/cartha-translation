id: LEV.11.11
reference: Leviticus 11:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: vi
  text: Chúng sẽ là vật đáng ghê tởm[a] đối với các ngươi; các ngươi không được ăn bất cứ phần thịt nào của chúng, và phải coi xác chúng là đáng ghê tởm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “điều gớm ghiếc”; từ Hê-bơ-rơ chỉ điều bị xem là đáng ghê tởm hoặc phải tránh về mặt nghi lễ trong bối cảnh luật ăn uống này.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: vật đáng ghê tởm
  rationale: Danh từ này chỉ điều bị xem là ghê tởm hoặc đáng tránh trong bối cảnh luật ăn uống. Cách dịch này giữ được sắc thái nghi lễ mạnh hơn “ô uế” mà không tự động biến nó thành một phạm trù đạo đức rộng hơn.
- source_word: יִהְיוּ לָכֶם
  choice: sẽ là ... đối với các ngươi
  rationale: Giữ ý của giới từ chỉ thái độ hoặc sự đánh giá mà dân Israel phải có đối với các sinh vật đang được nói đến.
- source_word: מִבְּשָׂרָם
  choice: bất cứ phần thịt nào của chúng
  rationale: Sau động từ ăn bị phủ định, מִן mang nghĩa phân lượng; cách diễn đạt này truyền đạt rõ rằng không được ăn chút thịt nào của chúng.
- source_word: לֹא תֹאכֵלוּ
  choice: các ngươi không được ăn
  rationale: Diễn đạt tự nhiên sức bắt buộc của mệnh lệnh phủ định trong văn bản luật pháp.
- source_word: נִבְלָתָם
  choice: xác chúng
  rationale: נְבֵלָה chỉ xác chết của động vật; “xác” ngắn gọn, chính xác và tự nhiên trong tiếng Việt.
- source_word: תְּשַׁקֵּצוּ
  choice: phải coi ... là đáng ghê tởm
  rationale: Động từ Piel cùng gốc với שֶׁקֶץ, mang nghĩa xem hoặc đối xử với một vật như điều đáng ghê tởm. “Phải coi” giữ được tính quy định chứ không thu hẹp nghĩa thành cảm xúc chủ quan.
theological_decisions:
- issue: Bản chất của ngôn ngữ về sự ghê tởm trong luật ăn uống
  choice: 'Dùng ngôn ngữ chỉ sự ghê tởm theo phân loại nghi lễ: “đáng ghê tởm”.'
  alternative: Dịch là “điều gớm ghiếc” với sắc thái đạo đức mạnh hơn, hoặc “ô uế” với sắc thái nhẹ hơn.
  rationale: Câu này nói về những phân biệt trong luật ăn uống của giao ước dành cho Israel. “Đáng ghê tởm” giữ sức nặng của nguyên ngữ mà không nhập thêm một phán đoán đạo đức rộng hơn điều câu văn khẳng định.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và trực tiếp. “Các ngươi” duy trì lời phán ở số nhiều hướng đến dân Israel; dấu chấm phẩy giữ ba mệnh đề pháp lý liên kết chặt chẽ trong nguyên văn.
