  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: vi
  text: cú mèo nhỏ[a], chim cốc và cú lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không chắc có thể xác định chính xác các loài chim này. “Cú mèo nhỏ”, “chim cốc” và “cú lớn” là những cách dịch hợp lý theo truyền thống hoặc nghiên cứu; các phương án khác gồm “cú” hoặc “cú rít” cho כּוֹס, “bồ nông” cho שָׁלָךְ, và “cú sừng” hoặc “cú đại bàng” cho יַנְשׁוּף.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: chim cú nhỏ
  rationale: Từ này chỉ một loài chim bị xem là ô uế, nhưng không chắc chính xác là loài nào. “Chim cú nhỏ” theo một cách nhận diện hiện đại khá phổ biến và giữ được ý rằng tiếng Hê-bơ-rơ có lẽ nói đến một loài cụ thể.
- source_word: הַשָּׁלָךְ
  choice: chim cốc
  rationale: Danh tính chính xác của loài chim này còn gây tranh luận. “Chim cốc” là cách hiểu lâu đời và hợp lý, có thể liên quan đến một loài chim lao xuống nước bắt cá; chú thích bảo lưu phương án “bồ nông”.
- source_word: הַיַּנְשׁוּף
  choice: chim cú lớn
  rationale: Từ này xuất hiện trong các danh sách chim và có lẽ chỉ một loài chim ăn đêm cỡ lớn. “Chim cú lớn” diễn đạt mức độ cụ thể của tên gọi mà không khẳng định quá mức về loài hiện đại tương ứng.
- source_word: וְאֶת
  choice: và
  rationale: Liên từ lặp lại cùng dấu hiệu đánh dấu tân ngữ cho thấy đây là phần tiếp nối của danh sách trước. Tiếng Việt tự nhiên dùng dấu phẩy và “và” trước mục cuối, không cần lặp liên từ một cách máy móc.
