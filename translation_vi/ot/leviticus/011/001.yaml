  text: Yahweh phán với Môi-se và A-rôn rằng:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “Đức Giê-hô-va” hoặc “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời truyền phán của Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: Giới từ אֶל đánh dấu hai người tiếp nhận lời phán; tiếng Việt tự nhiên dùng “phán với”, không cần lặp lại giới từ.
- source_word: לֵאמֹר אֲלֵהֶם
  choice: rằng
  rationale: Cụm này giới thiệu nội dung lời phán và xác nhận lời ấy hướng đến cả hai người. Trong tiếng Việt, “rằng” diễn đạt chức năng này tự nhiên; ý số nhiều đã rõ từ hai bổ ngữ đứng trước.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” bảo tồn tính chất danh riêng và là hình thức quen thuộc trong tiếng Việt; không thay danh ấy bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ công thức lời phán của sách Lê-vi nhưng tránh lối diễn đạt nặng tính sao phỏng như “nói với họ rằng”.
