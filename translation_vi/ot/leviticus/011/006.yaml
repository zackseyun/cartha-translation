id: LEV.11.6
reference: Leviticus 11:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: vi
  text: Còn con thỏ rừng[a], vì nó nhai lại nhưng móng không chẻ, nên nó là loài ô uế đối với các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “con thỏ”. Từ Hê-bơ-rơ אַרְנֶבֶת theo truyền thống được hiểu là “thỏ rừng”, dù một số người hiểu theo nghĩa rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: con thỏ rừng
  rationale: Từ Hê-bơ-rơ này theo truyền thống được hiểu là thỏ rừng; cách gọi này tự nhiên trong tiếng Việt và phân biệt với thỏ nhà, dù việc định danh có thể được hiểu rộng hơn.
- source_word: כִּי
  choice: vì
  rationale: Liên từ giới thiệu lý do con vật bị xếp vào loại ô uế.
- source_word: מַעֲלַת גֵּרָה
  choice: nhai lại
  rationale: Đây là cách diễn đạt tự nhiên, quen thuộc trong tiếng Việt cho thành ngữ chỉ việc đưa thức ăn lên để nhai lại.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: nhưng không có móng chẻ
  rationale: Diễn đạt rõ tiêu chí thứ hai theo lối nói tự nhiên; liên từ 'nhưng' thể hiện sự tương phản với việc nhai lại.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: đối với các ngươi, nó là loài ô uế
  rationale: Giữ thuật ngữ Kinh Thánh 'ô uế' và ý hướng đến cộng đồng giao ước trong לָכֶם, không diễn giải quá mức ngay trong chính văn.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật ăn uống Lê-vi
  choice: Giữ cách nói 'loài ô uế' trong chính văn, được hiểu theo phạm vi nghi lễ và luật ăn uống của đoạn văn
  alternative: ô uế về đạo đức
  rationale: Câu này phân loại động vật theo luật ăn uống dành cho Israel, chứ không tuyên bố con vật xấu xa về mặt đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'các ngươi' để bảo toàn sắc thái số nhiều và bối cảnh lời luật truyền cho cộng đồng; 'móng chẻ' là cách gọi thông dụng trong tiếng Việt.
