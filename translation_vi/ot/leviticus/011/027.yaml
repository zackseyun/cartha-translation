revisions:
- from: Mọi loài vật đi bằng bàn chân, trong số các loài vật đi bằng bốn chân, đều là ô uế đối với các con. Ai chạm vào xác chúng sẽ bị ô uế cho đến chiều tối.
  to: Mọi loài vật đi bằng bốn bàn chân, trong các loài vật đi bằng bốn chân, đều là ô uế đối với các ngươi. Ai chạm vào xác chết của chúng sẽ bị ô uế cho đến chiều tối.
  rationale: Sửa cách diễn đạt đầu câu để phản ánh cụm chỉ việc đi trên bàn chân trong một cách nói tiếng Việt rõ ràng, đồng thời giảm sự gượng và lặp của bản nháp. Giữ nguyên thuật ngữ "ô uế" theo phạm trù nghi lễ, hậu quả pháp quy, và thời hạn "cho đến chiều tối".
  reviewer_model: gpt-5.6-terra
