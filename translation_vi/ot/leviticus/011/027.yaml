base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: vi
  text: Mọi loài vật đi bằng bốn bàn chân, trong các loài vật đi bằng bốn chân, đều là ô uế đối với các ngươi. Ai chạm vào xác chết của chúng sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: Mọi loài vật đi bằng bàn chân
  rationale: Cụm phân từ có ý nghĩa phân loại trong ngữ cảnh các loài vật. כַּף chỉ lòng bàn tay hoặc lòng bàn chân; với động vật, “bàn chân” tự nhiên và đủ rộng hơn “bàn chân có đệm” hay “chân vuốt”.
- source_word: בְּכָל הַחַיָּה הַהֹלֶכֶת עַל אַרְבַּע
  choice: trong số các loài vật đi bằng bốn chân
  rationale: חַיָּה ở đây chỉ các loài vật trên cạn; cách dịch giữ cấu trúc phân loại và diễn đạt tự nhiên trong tiếng Việt.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: đều là ô uế đối với các con
  rationale: “Ô uế” là thuật ngữ quen thuộc chỉ tình trạng không thanh sạch về nghi lễ, không hàm ý trực tiếp về tội lỗi đạo đức. Dạng số nhiều được diễn đạt bằng “đều”.
- source_word: כָּל הַנֹּגֵעַ בְּנִבְלָתָם
  choice: Ai chạm vào xác chúng
  rationale: כָּל הַנֹּגֵעַ có lực phân phối và pháp quy; “Ai… sẽ…” là cấu trúc luật lệ tự nhiên. נְבֵלָה chỉ xác động vật, còn hậu tố số nhiều được giữ bằng “chúng”.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: sẽ bị ô uế cho đến chiều tối
  rationale: Thể chưa hoàn thành trong luật lệ diễn tả hệ quả bắt buộc. “Cho đến chiều tối” truyền đạt rõ giới hạn thời gian.
theological_decisions:
- issue: Thuật ngữ về sự thanh sạch nghi lễ
  choice: ô uế
  alternative: không thanh sạch; bị nhiễm uế
  rationale: Trong Lê-vi Ký, טמא chủ yếu chỉ tình trạng nghi lễ chứ không trực tiếp phán xét đạo đức; “ô uế” bảo tồn phạm trù chuyên biệt này và phù hợp văn phong Kinh Thánh tiếng Việt.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng cách xưng hô “các con” cho לָכֶם theo lời phán dành cho cộng đồng Ít-ra-ên. Không thêm chú thích vì các sắc thái nguồn được chuyển đạt đầy đủ trong câu chính.
