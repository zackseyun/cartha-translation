source:
  edition: WLC
  text: וְ/כָל הַ/נֹּשֵׂ֖א מִ/נִּבְלָתָ֑/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: vi
  text: Bất cứ ai mang bất kỳ xác nào của chúng thì phải giặt quần áo mình và sẽ bị ô uế cho đến chiều tối.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo hình thức hơn: “mang từ xác của chúng.” Cấu trúc Hê-bơ-rơ với giới từ מִן có thể được hiểu theo cách này; bản dịch chính diễn đạt ý phân phối tự nhiên hơn trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Bất cứ ai
  rationale: וְ nối quy định này với văn cảnh trước, còn כָּל đi với phân từ mang ý nghĩa phân phối, chỉ mọi người thuộc trường hợp được nêu. “Bất cứ ai” tự nhiên trong tiếng Việt và giữ nguyên phạm vi phổ quát.
- source_word: הַ/נֹּשֵׂא
  choice: mang
  rationale: Phân từ của נָשָׂא có nghĩa là mang, vác hoặc đem đi. Trong luật thanh sạch này, “mang” diễn đạt tự nhiên hành động cầm và di chuyển xác động vật.
- source_word: מִ/נִּבְלָתָ/ם
  choice: bất kỳ xác nào của chúng
  rationale: נְבֵלָה chỉ xác động vật trong các luật về thanh sạch của Lê-vi. Sau נָשָׂא, מִן có thể mang sắc thái phân phối hoặc chỉ một phần lấy từ xác; cách dịch chính truyền đạt tự nhiên phạm vi bất định mà không đổi đối tượng thành thi thể người.
- source_word: יְכַבֵּס
  choice: phải giặt
  rationale: Dạng vị hoàn thành ở đây biểu thị nghĩa vụ trong quy định pháp luật. “Phải giặt” rõ ràng, hiện đại và giữ lực bắt buộc của câu.
- source_word: בְּגָדָי/ו
  choice: quần áo mình
  rationale: בְּגָדִים là quần áo hoặc y phục. Đại từ phản thân “mình” quy chiếu tự nhiên về cá nhân số ít “ai”, đồng thời phản ánh hậu tố sở hữu số ít giống đực mà không gây nặng nề trong tiếng Việt.
- source_word: וְ/טָמֵא
  choice: và bị ô uế
  rationale: טָמֵא ở đây nói về tình trạng ô uế theo nghi lễ, không phải sự gian ác về đạo đức. “Bị ô uế” là cách diễn đạt quen thuộc và tránh hiểu sai theo nghĩa vệ sinh đơn thuần.
- source_word: עַד הָ/עָרֶב
  choice: cho đến chiều tối
  rationale: Cụm từ xác định thời hạn của tình trạng ô uế. “Cho đến chiều tối” vừa tự nhiên vừa phản ánh đầy đủ giới từ עַד và danh từ có mạo từ.
theological_decisions:
- issue: Các hình thức giống đực số ít trong một quy định áp dụng chung
  choice: Dùng “bất cứ ai” và đại từ phản thân số ít “mình”
  alternative: Dùng “người ấy ... quần áo của người ấy” hoặc chuyển sang số nhiều
  rationale: Tiếng Hê-bơ-rơ dùng giống đực số ít để đại diện cho một cá nhân thuộc bất kỳ trường hợp nào. Cấu trúc tiếng Việt giữ tính cá nhân và phạm vi phổ quát mà không áp đặt giới tính không cần thiết hay chuyển câu sang số nhiều.
- issue: Ý nghĩa của טָמֵא
  choice: Hiểu là tình trạng ô uế theo nghi lễ
  alternative: Hiểu là bẩn về thể chất hoặc xấu xa về đạo đức
  rationale: Văn cảnh các luật thanh sạch trong Lê-vi ký cho thấy đây là một tình trạng nghi lễ có thời hạn đến chiều tối, chứ không phải phán quyết về phẩm chất đạo đức.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. “Phải” thể hiện nghĩa vụ rõ hơn lối dịch cổ; “quần áo” dễ hiểu hơn “y phục”. Thuật ngữ “ô uế” được giữ vì thuộc trường nghĩa nghi lễ của phân đoạn.
