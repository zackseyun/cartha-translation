  to: Bất cứ ai mang bất kỳ xác nào của chúng thì phải giặt quần áo mình và sẽ bị ô uế cho đến chiều tối.[a]
  rationale: 'Chỉ điều chỉnh tối thiểu: thêm “sẽ” để biểu thị rõ tình trạng ô uế là hệ quả được quy định, và viết lại chú thích để bảo toàn sự mơ hồ hợp lý của giới từ מִן, không diễn giải thành “một phần” một cách chắc chắn.'
