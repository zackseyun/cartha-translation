    issue: Thiếu trợ từ chỉ hệ quả/tương lai trong “và bị ô uế”.
    rationale: 'Sau mệnh đề nghĩa vụ “phải giặt”, tiếng Việt cần “sẽ” để diễn đạt mạch lạc hệ quả pháp lý/tình trạng được nêu trong câu: người ấy sẽ ở tình trạng ô uế đến chiều tối.'
  - severity: low
    issue: Chú thích diễn giải “mang một phần từ xác” quá cụ thể.
    rationale: Giới từ מִן cho phép cách dịch hình thức “từ xác của chúng”, nhưng bản thân cấu trúc không buộc phải xác định rằng vật được mang là một phần tách rời của xác. Chú thích cần giữ tính dè dặt của phương án này.
