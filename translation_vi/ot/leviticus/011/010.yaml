id: LEV.11.10
reference: Leviticus 11:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: vi
  text: Nhưng mọi loài ở biển và sông ngòi[b] không có vây và vảy—trong số mọi loài lúc nhúc dưới nước và mọi sinh vật sống trong nước—đều là vật đáng ghê tởm đối với các ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vật gớm ghiếc đối với các ngươi.” Danh từ Hê-bơ-rơ chỉ điều bị ghê tởm, đặc biệt trong bối cảnh luật ăn uống nghi lễ này.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ có thể chỉ sông, suối hoặc khe có dòng nước, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Nhưng mọi loài
  rationale: Liên từ ו trong ngữ cảnh chuyển sang trường hợp đối lập với câu trước; “nhưng” diễn đạt quan hệ tương phản, còn “mọi loài” giữ phạm vi bao quát của כֹל và phù hợp với các sinh vật được liệt kê.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: không có
  rationale: Diễn đạt trực tiếp và tự nhiên cấu trúc chỉ sự thiếu vắng hai đặc điểm bắt buộc.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: vây và vảy
  rationale: Đây là hai dấu hiệu giải phẫu cùng được yêu cầu; liên từ phải được giữ là “và”, không phải “hoặc”.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: ở biển và sông ngòi
  rationale: “Biển” tương ứng với יַמִּים; “sông ngòi” là cách nói tự nhiên, rộng nghĩa cho נְחָלִים trong ngữ cảnh các dòng nước, đồng thời chú thích bảo lưu khả năng chỉ suối hoặc lòng khe có nước.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: dù thuộc các loài lúc nhúc dưới nước
  rationale: מִן mang ý phân loại/phân bộ ở đây; שֶׁרֶץ mô tả những sinh vật chuyển động lúc nhúc hoặc chen chúc. “Dù thuộc” nối tự nhiên hai nhóm nằm trong phạm vi “mọi loài”.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: hay các sinh vật sống
  rationale: נֶפֶשׁ הַחַיָּה chỉ rộng các hữu thể sống; “sinh vật sống” rõ nghĩa và tránh dịch máy móc thành “linh hồn sống”.
- source_word: אֲשֶׁר בַּמָּיִם
  choice: trong nước
  rationale: Giữ phạm vi môi trường thủy sinh của mệnh đề quan hệ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: שֶׁקֶץ
  choice: vật đáng ghê tởm
  rationale: Diễn đạt sức nặng của danh từ chỉ điều bị ghê tởm trong quy định ăn uống, nhưng không tự ý thay bằng thuật ngữ “ô uế” vốn không xuất hiện tại đây.
- source_word: הֵם לָכֶם
  choice: đều là ... đối với các ngươi
  rationale: Mệnh đề danh từ xác định địa vị của chúng đối với cộng đồng Israel; “đều” liên kết lại với chủ ngữ bao quát, còn “các ngươi” giữ ngôi số nhiều của לָכֶם.
theological_decisions:
- issue: Thuật ngữ chỉ địa vị nghi lễ trong luật ăn uống
  choice: vật đáng ghê tởm
  alternative: vật gớm ghiếc; vật ghê tởm
  rationale: שֶׁקֶץ mang sắc thái mạnh về điều bị ghê tởm trong phân loại ăn uống theo giao ước. Cách dịch này không biến câu thành lời kết án đạo đức phổ quát, cũng không thêm từ “ô uế” khi câu này không dùng thuật ngữ đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh đối tượng số nhiều trong lời luật, “sông ngòi” để bao quát các dòng nước nội địa, và giữ hai nhóm sinh vật thủy sinh mà nguyên văn nêu riêng.
