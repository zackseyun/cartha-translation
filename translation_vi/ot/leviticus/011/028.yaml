    rationale: טְמֵאִים הֵמָּה chỉ nói “chúng là ô uế”; tuy các đối tượng là động vật theo ngữ cảnh, từ “loài” không cần thiết trong bản dịch câu này.
  - severity: low
    issue: Chú thích cần diễn đạt sát hơn sự mơ hồ số ít/tập hợp của danh từ tiếng Hê-bơ-rơ.
