  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc luật lệ và tình trạng ô uế nghi lễ. Tuy nhiên, “sẽ bị ô uế” dùng bị động không có trong tiếng Hê-bơ-rơ; vị ngữ tính từ טָמֵא diễn tả tình trạng: “sẽ ô uế”. “Những loài” thêm một phân loại không được nêu rõ trong câu, dù đối tượng quy chiếu là các con vật của ngữ cảnh trước.'
  naturalness: “Xác chết của chúng” có thể hiểu được nhưng hơi nặng và dễ gợi xác người; “xác của chúng” tự nhiên hơn trong ngữ cảnh con vật. Bỏ “những loài” làm câu gọn và sát hơn. “Đối với anh em” vẫn là cách xưng hô cộng đồng phù hợp với văn cảnh luật pháp.
  terminology: Giữ “ô uế” là phù hợp và nhất quán cho טמא như một phạm trù nghi lễ, không mặc nhiên hàm ý lỗi đạo đức. “Quần áo” là cách dùng hiện đại, phù hợp cho בְּגָדָיו.
