  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: vi
  text: Ai mang xác của chúng phải giặt quần áo mình và sẽ ô uế cho đến chiều tối.[a] Chúng là ô uế đối với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các xác của chúng.” Tiếng Hê-bơ-rơ dùng danh từ số ít với hậu tố số nhiều; có thể hiểu theo nghĩa tập hợp hoặc phân phối, nói đến xác của các con vật đang được đề cập.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: Ai mang
  rationale: Phân từ có mạo từ mang ý nghĩa khái quát trong điều luật; “Ai mang” tự nhiên trong tiếng Việt và giữ được phạm vi áp dụng chung.
- source_word: נִבְלָתָם
  choice: xác chết của chúng
  rationale: נְבֵלָה chỉ xác của con vật đã chết. Hậu tố số nhiều quy chiếu về các loài vật trong ngữ cảnh trước; cách diễn đạt này giữ được hình thức số ít của danh từ mà không làm mất quy chiếu số nhiều.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: phải giặt quần áo mình
  rationale: Thể vị hoàn thành trong văn luật pháp có lực mệnh lệnh; “phải” diễn đạt rõ nghĩa vụ, còn “quần áo” là cách nói hiện đại và tự nhiên.
- source_word: וְטָמֵא
  choice: và sẽ bị ô uế
  rationale: Mệnh đề nêu tình trạng ô uế nghi lễ phát sinh sau hành động; “sẽ bị ô uế” truyền đạt kết quả và không hàm ý tội lỗi đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Cách dịch này tự nhiên, trang trọng vừa phải và biểu đạt rõ giới hạn thời gian.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: Chúng là những loài ô uế đối với anh em
  rationale: “Chúng” quy chiếu về các con vật đang được nói đến; “đối với anh em” bảo lưu לָכֶם, còn “những loài” giúp câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Thuật ngữ về tình trạng ô uế nghi lễ
  choice: ô uế
  alternative: không tinh sạch; bị nhơ bẩn
  rationale: Trong luật thanh sạch của Lê-vi Ký, טמא là một phạm trù nghi lễ. “Ô uế” là thuật ngữ quen thuộc, giữ được tính kỹ thuật và không tự động đồng nhất tình trạng này với tội lỗi đạo đức.
translation_notes:
  register: Văn phong luật pháp, trang trọng nhưng hiện đại và dễ hiểu. Dùng “anh em” ở số nhiều để truyền đạt đối tượng cộng đồng của לָכֶם; tránh các từ quá cổ như “y phục” hoặc cách diễn đạt có thể biến ô uế nghi lễ thành sự kết án đạo đức.
