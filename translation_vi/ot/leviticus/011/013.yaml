source:
  edition: WLC
  text: וְ/אֶת אֵ֨לֶּה֙ תְּשַׁקְּצ֣וּ מִן הָ/ע֔וֹף לֹ֥א יֵאָכְל֖וּ שֶׁ֣קֶץ הֵ֑ם אֶת הַ/נֶּ֨שֶׁר֙ וְ/אֶת הַ/פֶּ֔רֶס וְ/אֵ֖ת הָ/עָזְנִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: vi
  text: '“Trong các loài chim, phải coi những loài sau đây là đáng ghê tởm; không được ăn chúng, vì chúng là vật đáng ghê tởm: đại bàng[a], kền kền râu[b] và kền kền đen[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên các loài chim trong danh sách Hê-bơ-rơ này không phải lúc nào cũng có thể xác định chắc chắn. Từ được dịch là “đại bàng” có thể chỉ chung một loài chim săn mồi lớn, thậm chí một loài kền kền.
    reason: lexical_alternative
  - marker: b
    text: Có thể dịch là “kền kền” nói chung. Loài này thường được nhận diện là kền kền râu, còn gọi là lammergeier; một số bản dịch cổ dùng tên “chim đập xương”.
    reason: lexical_alternative
  - marker: c
    text: Việc nhận diện loài chim này chưa chắc chắn. Một số bản dịch hiểu là chim ó cá hoặc một loại đại bàng hay kền kền.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: phải coi ... là đáng ghê tởm
  rationale: Động từ Piel diễn tả việc xem hoặc đối xử với một vật là đáng ghê tởm trong bối cảnh luật thực phẩm, chứ không chỉ nói đến cảm xúc chủ quan.
- source_word: מִן הָעוֹף
  choice: trong các loài chim
  rationale: Giữ nghĩa phân bộ của מִן và dùng cách diễn đạt tự nhiên trong tiếng Việt; עוֹף có thể rộng hơn là các sinh vật biết bay, nhưng ở danh sách này chủ yếu chỉ các loài chim.
- source_word: לֹא יֵאָכְלוּ
  choice: không được ăn chúng
  rationale: Chuyển thể bị động cấm đoán của tiếng Hê-bơ-rơ thành lối cấm đoán tự nhiên, rõ ràng trong tiếng Việt mà không thay đổi lực pháp lý.
- source_word: שֶׁקֶץ
  choice: vật đáng ghê tởm
  rationale: Giữ sắc thái mạnh của điều bị cấm kỵ trong luật thực phẩm, không làm nhẹ thành chỉ ‘ô uế’ và cũng tránh từ ngữ quá cổ.
- source_word: הַנֶּשֶׁר
  choice: đại bàng
  rationale: Đây là cách dịch truyền thống và hợp lý, nhưng danh từ Hê-bơ-rơ có thể bao gồm một loài chim săn mồi lớn hoặc chim ăn xác; sự bất định được ghi chú.
- source_word: הַפֶּרֶס
  choice: kền kền râu
  rationale: Thường được nhận diện là loài bearded vulture/lammergeier, song không hoàn toàn chắc chắn; bản dịch dùng tên hiện đại và nêu phương án khác trong chú thích.
- source_word: הָעָזְנִיָּה
  choice: kền kền đen
  rationale: Một nhận diện hiện đại thường gặp và phù hợp với ngữ cảnh chim ăn xác, dù tên loài chính xác vẫn chưa chắc chắn.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” cho ngôi thứ hai số nhiều để nói với cộng đồng Israel, tránh sắc thái cổ của “các ngươi”. Cấu trúc lặp “đáng ghê tởm” được giữ vì chính nguyên văn nhấn mạnh như vậy.
