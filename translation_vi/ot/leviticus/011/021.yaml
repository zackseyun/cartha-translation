  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: vi
  text: Tuy nhiên, trong mọi loài vật nhỏ có cánh di chuyển bằng bốn chân, các ngươi được phép ăn những loài có[a] cặp chân bật nhảy[b] ở phía trên các chân của chúng, để nhảy trên mặt đất bằng các chân ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Truyền thống văn bản Hê-bơ-rơ ghi theo mặt chữ là “không có chân”; cách đọc truyền thống, phù hợp với ngữ cảnh và các bản dịch cổ, là “có chân”.
    reason: textual_variant
  - marker: b
    text: Cũng có thể dịch là “chân có khớp”; từ Hê-bơ-rơ ở đây chỉ đôi chân sau chuyên dùng để bật nhảy.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Đánh dấu ngoại lệ đối với lệnh cấm ngay trước đó, bằng một từ nối tương phản tự nhiên trong tiếng Việt hiện đại.
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: các ngươi được phép ăn những con
  rationale: Dạng số ít mở đầu cho một loại sinh vật; ngữ cảnh luật pháp cho thấy động từ diễn đạt sự cho phép, nên chuyển thành số nhiều theo nghĩa tập hợp.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: trong mọi loài vật nhỏ có cánh
  rationale: Giữ phạm vi rộng của שֶׁרֶץ là các sinh vật nhỏ bò hoặc lúc nhúc, đồng thời tránh đồng nhất hoàn toàn thuật ngữ phân loại cổ với khái niệm sinh học hiện đại ‘côn trùng’.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: bò bằng bốn chân
  rationale: Diễn đạt tự nhiên cách di chuyển trên bốn chi theo hệ phân loại của bản văn cổ.
- source_word: אֲשֶׁר לוֹא כְרָעַיִם
  choice: những con có cặp chân bật nhảy
  rationale: Theo cách đọc truyền thống לוֹ và các chứng bản cổ, câu nói các con vật ấy có chân chuyên dùng để nhảy; ‘cặp chân bật nhảy’ nêu rõ chức năng mà không áp đặt một thuật ngữ giải phẫu quá hẹp.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: ở phía trên các chân của chúng
  rationale: Giữ hình ảnh vị trí tương đối trong tiếng Hê-bơ-rơ và dùng số nhiều phù hợp với cả lớp sinh vật.
- source_word: לְנַתֵּר בָּהֵן עַל הָאָרֶץ
  choice: để dùng cặp chân ấy nhảy trên mặt đất
  rationale: Nêu rõ mục đích của các chân đặc biệt và xác định tự nhiên sở chỉ của đại từ בָּהֵן.
