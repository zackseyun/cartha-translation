  to: Tuy nhiên, trong mọi loài vật nhỏ có cánh di chuyển bằng bốn chân, các ngươi được phép ăn những loài có[a] cặp chân bật nhảy[b] ở phía trên các chân của chúng, để nhảy trên mặt đất bằng các chân ấy.
