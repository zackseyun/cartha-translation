  source_fidelity: Bản dịch truyền đạt đúng ngoại lệ cho phép ăn và, theo cách đọc truyền thống của văn bản Hê-bơ-rơ, đặc điểm là cặp chân dùng để nhảy. Tuy nhiên, “bò bằng bốn chân” thu hẹp và làm lệch động từ הַהֹלֵךְ (“đi/di chuyển”); trong ngữ cảnh sinh vật có cánh, “di chuyển bằng bốn chân” trung tính và sát hơn.
  naturalness: Cú pháp nhìn chung rõ ràng, văn phong phù hợp với văn bản luật pháp. Thay “bò” bằng “di chuyển” tránh gợi một kiểu vận động riêng và làm câu tự nhiên hơn trong mô tả phân loại cổ.
  terminology: “Loài vật nhỏ có cánh” giữ được phạm vi rộng của שֶׁרֶץ הָעוֹף mà không áp đặt phân loại sinh học hiện đại. “Cặp chân bật nhảy” và chú thích về “chân có khớp” phản ánh hợp lý nghĩa từ vựng cùng khả năng diễn đạt khác.
