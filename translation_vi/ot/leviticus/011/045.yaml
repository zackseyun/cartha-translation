reference: Leviticus 11:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: vi
  text: Vì Ta là Đức Giê-hô-va[a], Đấng đã đem các ngươi lên khỏi đất Ai Cập để làm Đức Chúa Trời của các ngươi. Hãy nên thánh[b], vì Ta là thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Danh Hê-bơ-rơ là YHWH, cũng thường được phiên âm là “Yahweh”. Cũng có thể hiểu phân từ là: “Đấng đang đem các ngươi lên khỏi đất Ai Cập.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Các ngươi sẽ nên thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt cho danh giao ước YHWH, đồng thời phân biệt với danh xưng chung “Đức Chúa Trời” xuất hiện sau đó.
- source_word: הַמַּעֲלֶה
  choice: Đấng đã đưa các ngươi lên
  rationale: Phân từ Híp-ri có nghĩa sát là “Đấng đưa lên”; thì quá khứ diễn đạt tự nhiên biến cố xuất hành đã xảy ra, còn “lên” giữ lại hình ảnh của động từ עלה.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: khỏi đất Ai Cập
  rationale: Giữ danh từ “đất” của nguyên văn và công thức nhắc đến cuộc xuất hành.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: để làm Đức Chúa Trời của các ngươi
  rationale: Diễn đạt tự nhiên công thức giao ước, bảo toàn quan hệ thuộc về nhau giữa Đức Chúa Trời và dân Ngài.
- source_word: וִהְיִיתֶם
  choice: Các ngươi phải nên
  rationale: Trong ngữ cảnh, hình thái này mang sức nặng mệnh lệnh; “phải nên” rõ nghĩa trong tiếng Việt hiện đại mà không thêm ý ngoài bản văn.
- source_word: קְדֹשִׁים
  choice: thánh
  rationale: “Thánh” là thuật ngữ chính xác và quen thuộc, rộng nghĩa hơn cách diễn giải thu hẹp là “được biệt riêng”.
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: vì Ta là thánh
  rationale: '“Vì” giữ quan hệ nguyên nhân: sự thánh khiết của Đức Chúa Trời là nền tảng cho đòi hỏi dân Ngài phải nên thánh.'
theological_decisions:
- issue: Nền tảng giao ước của sự thánh khiết
  choice: Giữ mệnh lệnh nên thánh gắn với danh Đức Giê-hô-va, hành động đưa dân ra khỏi Ai Cập và quan hệ Ngài là Đức Chúa Trời của họ.
  alternative: Hiểu câu này chỉ như một quy định về thanh sạch nghi lễ, không có chiều kích giao ước rộng hơn.
  rationale: Dù văn cảnh trực tiếp nói về thức ăn thanh sạch, chính câu này đặt mệnh lệnh trong công thức xuất hành và căn cứ vào sự thánh khiết của Đức Chúa Trời.
- issue: Sắc thái của כִּי trước קָדוֹשׁ אָנִי
  choice: 'Dịch theo quan hệ nguyên nhân: “vì Ta là thánh.”'
  alternative: Dịch “quả thật Ta là thánh” hoặc dùng một liên từ giải thích ít trực tiếp hơn.
  rationale: Trong mạch câu, mệnh đề này nêu nền tảng cho yêu cầu nên thánh; cách dịch vẫn không mở rộng nội dung thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng rõ ràng, dùng “Ta/các ngươi” phù hợp lời phán trực tiếp trong bối cảnh giao ước. “Đức Giê-hô-va” và “Đức Chúa Trời” phân biệt danh riêng YHWH với אֱלֹהִים. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
