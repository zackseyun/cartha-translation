  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính của câu Hê-bơ-rơ: danh riêng YHWH, phân từ chỉ Đấng đã/đang đem dân lên khỏi Ai Cập, công thức giao ước “làm Đức Chúa Trời của các ngươi”, mệnh lệnh nên thánh, và lý do là sự thánh của chính Đức Chúa Trời. Dùng quá khứ cho הַמַּעֲלֶה là tự nhiên trong công thức Xuất Hành; chú thích giữ phương án sát hình thức phân từ.'
  naturalness: “Đem các ngươi lên khỏi đất Ai Cập” tự nhiên và sát hơn “đưa ... lên khỏi”. “Hãy nên thánh” là mệnh lệnh trực tiếp, rõ ràng trong tiếng Việt hiện đại, mà vẫn bảo toàn lực mệnh lệnh của וִהְיִיתֶם. Cặp xưng hô “Ta/các ngươi” phù hợp với lời phán trang trọng trong bản văn.
  terminology: Giữ “Đức Giê-hô-va” để phân biệt danh riêng YHWH với “Đức Chúa Trời” cho אֱלֹהִים, đồng thời chú thích nêu dạng phiên âm Yahweh. Sửa “Híp-ri” thành “Hê-bơ-rơ”, cách gọi hiện hành trong tiếng Việt. “Thánh” được giữ làm thuật ngữ trung tâm, không diễn giải thu hẹp thành “biệt riêng”.
