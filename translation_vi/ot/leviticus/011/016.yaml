  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: vi
  text: Và đà điểu[a], chim ưng, mòng biển, và chim cắt, tùy theo loài;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Việc nhận diện một số loài chim trong câu này từ tiếng Hê-bơ-rơ chưa chắc chắn. Theo các truyền thống dịch khác, những tên gọi tương ứng có thể là “cú” thay cho “đà điểu”, “cú” hoặc “ưng đêm” thay cho “chim ưng”, “tu hú” thay cho “mòng biển”, và “chim ưng” thay cho “chim cắt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: đà điểu
  rationale: Cụm từ theo nghĩa đen là “con gái của ya'anah”, nhưng trong danh sách động vật, nó hoạt động như tên một loài chim. “Đà điểu” là cách nhận diện có cơ sở từ từ vựng và ngôn ngữ cùng họ, dù vẫn còn bất định.
- source_word: הַתַּחְמָס
  choice: chim ưng
  rationale: Danh tính chính xác của loài chim này không chắc chắn. “Chim ưng” là tên gọi rộng, tự nhiên trong tiếng Việt cho chim săn mồi và tránh xác định quá cụ thể.
- source_word: הַשָּׁחַף
  choice: mòng biển
  rationale: Từ Hê-bơ-rơ này chưa được nhận diện hoàn toàn chắc chắn, nhưng “mòng biển” phù hợp với cách hiểu phổ biến trong các từ điển hiện đại và là tên chim quen thuộc trong tiếng Việt.
- source_word: הַנֵּץ
  choice: chim cắt
  rationale: Từ này chỉ một loài chim săn mồi, thường được hiểu là falcon hoặc hawk. “Chim cắt” phân biệt nó với תַּחְמָס trong cùng câu mà không vượt quá phạm vi nghĩa có thể có.
- source_word: לְמִינֵהוּ
  choice: tùy theo loài
  rationale: Cụm từ phân loại này chỉ các loài hay nhóm thuộc cùng loại. “Tùy theo loài” ngắn gọn, tự nhiên và giữ được ý nghĩa phân loại.
- source_word: וְאֵת / וְאֶת
  choice: và / dấu phẩy trong danh sách
  rationale: Các hình thức này gồm liên từ và dấu chỉ tân ngữ xác định, tiếp nối danh sách từ câu trước. Tiếng Việt không dịch dấu chỉ tân ngữ; liên từ được thể hiện tự nhiên bằng phép liệt kê và “và” trước mục cuối.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Vì đây là phần tiếp nối trực tiếp của danh sách ở câu trước, bản dịch giữ dạng cụm liệt kê thay vì tạo thành câu độc lập; dùng “và” trước mục cuối theo cú pháp tự nhiên của tiếng Việt. Dấu chú thích [a] được đặt ngay sau tên chim đầu tiên nhưng giải thích sự bất định của nhiều tên chim trong toàn câu.
