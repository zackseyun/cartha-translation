revisions:
- from: Trong mọi loài sinh vật bò lúc nhúc trên đất, bất cứ con nào trườn bằng bụng[a], con nào đi bằng bốn chân, cho đến con có nhiều chân, thì các ngươi không được ăn[b], vì chúng là loài đáng ghê tởm[c].
  to: Trong mọi loài vật bò lúc nhúc[b] trên đất, tất cả những loài trườn bằng bụng[a], tất cả những loài đi bằng bốn chân, cho đến mọi loài có nhiều chân, các ngươi không được ăn chúng, vì chúng là vật đáng ghê tởm[c].
