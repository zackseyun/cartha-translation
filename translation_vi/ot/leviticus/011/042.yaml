  source_fidelity: Bản dịch phản ánh đúng các nhóm sinh vật và mệnh lệnh cấm ăn trong tiếng Hê-bơ-rơ. Tuy nhiên, chú thích [b] hiện được đặt sau «ăn», trong khi nó giải thích cụm đồng gốc «mọi loài sinh vật bò lúc nhúc»; cần chuyển mốc chú thích về đúng cụm từ được giải thích.
