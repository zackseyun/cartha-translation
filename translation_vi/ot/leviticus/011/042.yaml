id: LEV.11.42
reference: Leviticus 11:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: vi
  text: Trong mọi loài vật bò lúc nhúc[b] trên đất, tất cả những loài trườn bằng bụng[a], tất cả những loài đi bằng bốn chân, cho đến mọi loài có nhiều chân, các ngươi không được ăn chúng, vì chúng là vật đáng ghê tởm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bò bằng bụng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ lặp lại cùng một gốc từ: “loài bò lúc nhúc bò lúc nhúc,” nhằm nhấn mạnh nhóm sinh vật này.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “vật gớm ghiếc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: bất cứ con nào / mọi loài
  rationale: Diễn đạt lực phân phối và bao quát của כֹּל một cách tự nhiên trong tiếng Việt.
- source_word: הוֹלֵךְ עַל גָּח
  choice: trườn bằng bụng
  rationale: Giữ hình ảnh về cách di chuyển sát với tiếng Hê-bơ-rơ; “trườn” tự nhiên hơn cách dịch từng chữ “đi trên bụng”.
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: đi bằng bốn chân
  rationale: Diễn đạt cụ thể và rõ ràng phương thức di chuyển trong nguyên văn.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: cho đến con có nhiều chân
  rationale: Giữ sắc thái mở rộng phạm vi của עַד, từ loài bốn chân đến mọi loài nhiều chân, mà không ép thành một cách hiểu duy nhất như “kể cả”.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: trong mọi loài sinh vật bò lúc nhúc
  rationale: Tái hiện phần nào cấu trúc đồng căn danh từ–phân từ, đồng thời tránh lối lặp quá gượng trong tiếng Việt.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Trong ngữ cảnh các sinh vật di chuyển, “đất” tự nhiên và cụ thể hơn “trái đất”.
- source_word: לֹא תֹאכְלֻם
  choice: các ngươi không được ăn
  rationale: Thể hiện rõ lực cấm đoán của điều luật và ngôi số nhiều trong tiếng Hê-bơ-rơ.
- source_word: שֶׁקֶץ
  choice: loài đáng ghê tởm
  rationale: Truyền đạt sắc thái ghê tởm mạnh trong luật ăn uống mà không đưa thêm cách giải thích thần học ngoài câu.
theological_decisions:
- issue: Bản chất của lệnh cấm trong luật thánh khiết
  choice: Trình bày trực tiếp như một lệnh cấm ăn trong văn mạch luật thanh sạch.
  alternative: Giải thích đây là luật đạo đức vĩnh viễn hoặc chỉ là tập tục văn hóa.
  rationale: Nguyên văn nêu lệnh cấm pháp lý nhưng không tự giải quyết vấn đề về hiệu lực của luật trong các bối cảnh thần học về sau.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu; dùng “các ngươi” để biểu thị ngôi số nhiều và sắc thái lời phán cổ trang nghiêm. Các dấu chú thích [a], [b], [c] đều có mặt trong chính văn và được đặt ngay sau nội dung liên quan.
