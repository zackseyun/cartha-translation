  yaml_path: translation/ot/leviticus/011/019.yaml
  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: vi
  text: chim cò, chim diệc[a] tùy theo loài[c], chim đầu rìu[b], và con dơi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể là “cò quăm” hoặc một loài chim nước chân dài khác; chưa xác định chắc chắn từ Hê-bơ-rơ này chỉ loài chim nào.
    reason: lexical_alternative
  - marker: b
    text: Theo cách dịch truyền thống là “chim te te”; tuy nhiên, từ Hê-bơ-rơ nhiều khả năng chỉ chim đầu rìu.
    reason: alternative_reading
  - marker: c
    text: Cụm từ “tùy theo loài” bao gồm những giống có liên hệ trong cùng một nhóm chim nói chung.
    reason: cultural_note
lexical_decisions:
- source_word: חֲסִידָה
  choice: chim hạc
  rationale: Tên gọi này chỉ loài stork trong tiếng Việt hiện đại, phân biệt với chim diệc ở mục kế tiếp; từ Hê-bơ-rơ ở đây được dùng như tên một loài chim.
- source_word: אֲנָפָה
  choice: chim diệc
  rationale: Đây là cách nhận diện thông dụng và phù hợp với loài chim nước chân dài, dù danh tính động vật học chính xác của từ Hê-bơ-rơ vẫn chưa chắc chắn.
- source_word: לְמִינָהּ
  choice: tùy theo loài
  rationale: Diễn đạt tự nhiên ý phân loại các dạng có liên hệ trong cùng một nhóm chim, đồng thời giữ phạm vi số nhiều hàm ý của công thức Hê-bơ-rơ.
- source_word: דּוּכִיפַת
  choice: chim đầu rìu
  rationale: Đây là tên tiếng Việt hiện hành của hoopoe, phù hợp với nhận định từ vựng hiện đại hơn cách nhận diện truyền thống là lapwing.
- source_word: עֲטַלֵּף
  choice: con dơi
  rationale: Danh tính của từ này chắc chắn; giữ nguyên cách phân loại theo hiện tượng quan sát của danh sách cổ, không áp đặt hệ phân loại sinh học hiện đại.
- source_word: וְאֵת / וְאֶת
  choice: dấu phẩy và “và” ở mục cuối
  rationale: Các liên từ Hê-bơ-rơ kết nối từng mục trong danh sách; tiếng Việt tự nhiên dùng dấu phẩy và đặt “và” trước mục cuối, còn dấu chỉ tân ngữ không cần dịch riêng.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, phù hợp cấu trúc một danh sách luật lệ. Dùng tên chim phổ thông trong tiếng Việt hiện đại; các chỗ chưa chắc chắn về động vật học được giữ lại trong chú thích thay vì giải quyết dứt khoát trong chính văn.
