  source_fidelity: 'Cần sửa liên từ כִּי: trong câu này nó nêu lý do/cơ sở phân loại (“vì/bởi vì”), không phải quan hệ nhượng bộ “tuy”. Bản sửa vẫn giữ hai mô tả lặp/nhấn mạnh về móng chẻ, cùng tiêu chí không nhai lại và tình trạng nghi lễ.'
  naturalness: “Heo” và “không nhai lại” là tiếng Việt hiện đại, tự nhiên. Cấu trúc “vì... nhưng... nên...” vừa rõ nghĩa vừa phù hợp văn phong luật lệ.
  terminology: “Không thanh sạch” thích hợp để biểu thị טָמֵא trong ngữ cảnh luật ăn uống/nghi lễ, không hàm ý phán xét đạo đức. “Các ngươi” bảo toàn số nhiều của לָכֶם.
  issues:
  - severity: medium
    issue: “Tuy” dịch כִּי như một liên từ nhượng bộ.
    rationale: 'כִּי ở đây có lực nguyên nhân/giải thích: con heo bị xếp là không thanh sạch vì, dù có đặc điểm móng cần thiết, nó không nhai lại. Tương phản được tiếng Hê-bơ-rơ biểu thị bằng “nhưng” (וְהוּא), không phải bởi כִּי.'
  - severity: low
