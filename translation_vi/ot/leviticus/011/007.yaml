id: LEV.11.7
reference: Leviticus 11:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: vi
  text: Còn heo, vì có móng chẻ, tức là móng chẻ hẳn thành hai, nhưng không nhai lại[a], nên nó không thanh sạch đối với các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “không ợ lại thức ăn đã nhai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזִיר
  choice: con heo
  rationale: “Heo” là từ thông dụng, tự nhiên trong tiếng Việt hiện đại và chỉ loài vật nói chung.
- source_word: כִּי
  choice: tuy
  rationale: Trong cấu trúc toàn câu, כִּי nêu đặc điểm có vẻ đáp ứng một tiêu chuẩn nhưng bị đối lập bởi việc không nhai lại; “tuy... nhưng” diễn đạt tự nhiên quan hệ nhượng bộ này.
- source_word: מַפְרִיס פַּרְסָה
  choice: có móng chẻ
  rationale: Cách nói gọn, tự nhiên, diễn tả móng guốc bị chia tách.
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: tức móng được tách làm hai
  rationale: Giữ lại vế mô tả thứ hai và sắc thái nhấn mạnh của tiếng Hê-bơ-rơ, đồng thời tránh một câu dịch máy móc.
- source_word: גֵּרָה לֹא יִגָּר
  choice: không nhai lại
  rationale: Đây là cách diễn đạt phổ thông trong tiếng Việt cho hành vi nhai lại; nghĩa sát chữ được ghi ở chú thích.
- source_word: טָמֵא הוּא לָכֶם
  choice: thì không thanh sạch đối với các ngươi
  rationale: “Không thanh sạch” giữ phạm trù nghi lễ và ăn uống của Lê-vi Ký, không biến nó thành sự kết án đạo đức; “đối với các ngươi” bảo toàn quan hệ hướng đến cộng đồng được truyền lệnh.
theological_decisions:
- issue: Ý nghĩa của טָמֵא trong luật ăn uống
  choice: không thanh sạch theo nghĩa nghi lễ và luật ăn uống
  alternative: ô uế; không sạch
  rationale: Ngữ cảnh Lê-vi Ký 11 phân loại các loài vật cho dân Israel. Cách dịch này bảo toàn phạm trù nghi lễ, không hàm ý rằng bản thân con vật là xấu xa về đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để duy trì sắc thái số nhiều của לָכֶם và giọng luật pháp cổ; cấu trúc “tuy... nhưng...” thể hiện rõ sự tương phản trong câu.
