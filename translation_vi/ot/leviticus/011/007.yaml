revisions:
- from: Còn con heo, tuy có móng chẻ, tức móng được tách làm hai, nhưng không nhai lại[a], thì không thanh sạch đối với các ngươi.
  to: Còn heo, vì có móng chẻ, tức là móng chẻ hẳn thành hai, nhưng không nhai lại[a], nên nó không thanh sạch đối với các ngươi.
  rationale: Thay “tuy” bằng “vì” để phản ánh đúng giá trị nhân quả của כִּי. Dùng “nhưng... nên...” để diễn đạt sự đối lập do vế “không nhai lại” và kết luận phân loại. Cụm “móng chẻ hẳn thành hai” duy trì mô tả nhấn mạnh thứ hai của nguyên ngữ mà vẫn tự nhiên trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:45:32Z'
