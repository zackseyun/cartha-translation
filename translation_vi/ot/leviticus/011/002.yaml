  text: דַּבְּר֛וּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֤את הַֽ/חַיָּה֙ אֲשֶׁ֣ר תֹּאכְל֔וּ מִ/כָּל הַ/בְּהֵמָ֖ה אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: vi
  text: 'Hãy nói với dân Israel[a] rằng: “Đây là những sinh vật[b] mà các ngươi được phép ăn trong số mọi loài động vật trên đất[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Israel”; cụm từ này cũng có thể dịch là “con cái Israel” hoặc “người Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ có hình thức số ít: “Đây là sinh vật”; ở đây danh từ được hiểu theo nghĩa tập thể, mở đầu cho việc phân loại nhiều sinh vật.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “trên đất liền”; cụm từ này phân biệt các sinh vật trên cạn với những nhóm khác được đề cập trong chương.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Hãy nói
  rationale: Động từ mệnh lệnh số nhiều, trong ngữ cảnh hướng đến Môi-se và A-rôn; cách dịch này tự nhiên và giữ sắc thái chỉ thị trực tiếp.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  rationale: Nguyên văn là “các con trai của Israel”, nhưng đây là cách gọi tập thể chỉ dân Israel; “dân Israel” rõ ràng và tự nhiên trong tiếng Việt hiện đại, còn nghĩa đen được ghi ở chú thích.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Đây là dạng dẫn lời trực tiếp quen thuộc trong tiếng Hê-bơ-rơ; “rằng” tránh lối diễn đạt nặng nề “mà nói rằng” trong tiếng Việt.
- source_word: זֹאת הַחַיָּה
  choice: Đây là những sinh vật
  rationale: זֹאת và הַחַיָּה có hình thức số ít, nhưng danh từ mang nghĩa tập thể và mở đầu cho việc phân loại nhiều loài; số nhiều diễn đạt tự nhiên phạm vi liệt kê trong tiếng Việt mà không che giấu hình thức nguyên văn, được nêu tại chú thích.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: mà các ngươi được phép ăn
  rationale: Dạng chưa hoàn thành ngôi hai số nhiều trong văn cảnh luật lệ diễn tả điều được phép ăn, không chỉ một hành động tương lai.
- source_word: מִכָּל
  choice: trong số mọi
  rationale: Giới từ מִן kết hợp với כָּל biểu thị sự chọn ra từ một tập hợp lớn hơn.
- source_word: הַבְּהֵמָה
  choice: loài động vật
  rationale: Trong văn cảnh này, từ chỉ rộng các động vật sống trên đất; “động vật” là cách gọi hiện đại, rõ nghĩa và không thu hẹp thành gia súc.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: trên đất
  rationale: Cụm từ xác định nhóm sinh vật trên mặt đất, đối lập với các nhóm dưới nước và có cánh được bàn tiếp theo.
