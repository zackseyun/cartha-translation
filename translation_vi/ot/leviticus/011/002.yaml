translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “các ngươi” để giữ ngôi hai số nhiều và sắc thái lời phán dành cho cộng đồng; dùng tên gọi hiện đại “Israel”. Các cấu trúc Hê-bơ-rơ nặng tính công thức được chuyển thành cú pháp tiếng Việt tự nhiên.
