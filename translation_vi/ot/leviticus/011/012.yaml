base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: vi
  text: Mọi vật trong nước không có vây và vảy đều là vật đáng ghê tởm đối với các ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vật gớm ghiếc đối với các ngươi.” Từ Hê-bơ-rơ שֶׁקֶץ chỉ điều bị xem là đáng ghê tởm hoặc gớm ghiếc về mặt nghi lễ trong ngữ cảnh luật ăn uống này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Mọi loài
  rationale: Trong ngữ cảnh phân loại các sinh vật dưới nước, cách dịch này diễn đạt tự nhiên phạm vi bao quát của כֹּל cùng mệnh đề quan hệ אֲשֶׁר.
- source_word: אֵין לוֹ
  choice: không có
  rationale: Diễn đạt trực tiếp cấu trúc phủ định sở hữu của tiếng Hê-bơ-rơ bằng tiếng Việt tự nhiên.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: vây và vảy
  rationale: Danh từ số ít tiếng Hê-bơ-rơ mang nghĩa loại; tiếng Việt dùng danh từ không đánh dấu số, phù hợp với cách mô tả đặc điểm của loài vật.
- source_word: בַּמָּיִם
  choice: sống dưới nước
  rationale: Giữ phạm vi chỉ các sinh vật ở trong nước, đồng thời tạo câu tiếng Việt rõ nghĩa; từ “sống” được hàm ý bởi ngữ cảnh phân loại sinh vật.
- source_word: שֶׁקֶץ
  choice: vật đáng ghê tởm
  rationale: Giữ cấu trúc vị ngữ danh từ và sắc thái ghê tởm mạnh trong luật ăn uống, không đồng nhất từ này với thuật ngữ chung chỉ sự ô uế.
- source_word: לָכֶם
  choice: đối với các ngươi
  rationale: Giữ hướng quy chiếu của giới từ לְ và lời phán trực tiếp ở số nhiều dành cho cộng đồng Y-sơ-ra-ên.
theological_decisions:
- issue: Thuật ngữ về tình trạng nghi lễ của שֶׁקֶץ trong luật ăn uống
  choice: vật đáng ghê tởm
  alternative: vật gớm ghiếc
  rationale: “Vật đáng ghê tởm” truyền đạt lực đánh giá mạnh và phù hợp với ngữ cảnh nghi lễ, nhưng không nhập nó với từ vựng riêng về “ô uế.” Chú thích bảo lưu một cách diễn đạt tiếng Việt khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ngươi” giữ sắc thái lời phán trực tiếp với cộng đồng số nhiều; “mọi loài sống dưới nước” tự nhiên hơn lối dịch từng chữ “mọi vật ở trong nước” trong ngữ cảnh động vật thủy sinh.
