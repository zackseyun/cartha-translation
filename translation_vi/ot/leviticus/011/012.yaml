revisions:
- from: Mọi loài sống dưới nước mà không có vây và vảy đều là vật đáng ghê tởm đối với các ngươi.[a]
  to: Mọi vật trong nước không có vây và vảy đều là vật đáng ghê tởm đối với các ngươi.[a]
  rationale: Thay «mọi loài sống dưới nước» bằng «mọi vật trong nước» để phản ánh trực tiếp hơn כֹּל אֲשֶׁר ... בַּמָּיִם, tránh thêm ý phân loại theo loài và ý ‘sống’, đồng thời giữ nguyên nghĩa luật ăn uống, thuật ngữ then chốt và văn phong hiện đại.
