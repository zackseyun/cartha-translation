revisions:
- from: Vì Ta là Yahweh, Đức Chúa Trời của các con. Vậy, hãy thánh hóa chính mình[a] và nên thánh, vì Ta là thánh. Các con không được làm ô uế bản thân bởi bất cứ sinh vật lúc nhúc nào di chuyển trên đất.[b]
  to: Vì Ta là Yahweh, Đức Chúa Trời của các con. Vậy, hãy tự thánh hóa mình[a] và hãy nên thánh, vì Ta là thánh. Các con không được làm ô uế bản thân bởi bất cứ loài vật lúc nhúc nào bò trên đất.[b]
  rationale: Điều chỉnh tối thiểu để tăng tính tự nhiên của tiếng Việt và làm rõ tính phản thân của động từ הראשון, đồng thời diễn đạt cụm chỉ loài vật theo sát hơn với hai thành tố Hê-bơ-rơ mà không áp đặt một phân loại động vật hiện đại. Các mốc chú thích vẫn được giữ đúng vị trí và nội dung chú thích được chỉnh để phản ánh chính xác hơn các lựa chọn từ vựng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:46:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu Hê-bơ-rơ: Yahweh là Đức Chúa Trời của dân, mệnh lệnh tự thánh hóa và nên thánh được đặt trên nền tảng sự thánh khiết của Ngài, rồi đến lệnh cấm tự làm mình ô uế bởi các loài vật được mô tả. Tuy nhiên, «sinh vật lúc nhúc nào di chuyển» vừa hơi gượng trong tiếng Việt vừa làm mờ sắc thái của cụm שֶׁרֶץ ... הָרֹמֵשׂ, vốn nói đến loài vật lúc nhúc/bò trên đất.'
  naturalness: Cặp xưng hô «Ta–các con» phù hợp văn cảnh lời phán với cộng đồng. «Hãy tự thánh hóa mình» rõ tính phản thân và tự nhiên hơn «hãy thánh hóa chính mình». «Bất cứ loài vật lúc nhúc nào bò trên đất» trang trọng và dễ đọc hơn «bất cứ sinh vật lúc nhúc nào di chuyển trên đất».
  terminology: Giữ «Yahweh», «Đức Chúa Trời», «thánh», và «làm ô uế» là nhất quán. «Loài vật lúc nhúc» bảo toàn trường nghĩa của שֶׁרֶץ mà không thu hẹp thành riêng loài bò sát; «bò trên đất» diễn đạt tự nhiên phân từ הָרֹמֵשׂ trong ngữ cảnh này.
  issues:
  - severity: low
    issue: Cụm «hãy thánh hóa chính mình» hơi nặng và chưa biểu lộ tính phản thân một cách tự nhiên nhất.
    rationale: וְהִתְקַדִּשְׁתֶּם là Hitpael phản thân. «Hãy tự thánh hóa mình» giữ đúng sắc thái ấy trong tiếng Việt hiện đại.
  - severity: medium
    issue: «Sinh vật lúc nhúc nào di chuyển trên đất» không tự nhiên và làm yếu nét “bò/chuyển động sát đất” của הָרֹמֵשׂ.
    rationale: «Di chuyển» quá khái quát và có sắc thái hành chính. «Loài vật lúc nhúc nào bò trên đất» vừa phù hợp ngữ cảnh Lê-vi Ký 11 vừa không đồng nhất שֶׁרֶץ với một nhóm phân loại hiện đại cụ thể.
  - severity: low
    issue: Chú thích b hiện giải thích quá rộng và gộp hai từ Hê-bơ-rơ theo cách có thể gây hiểu nhầm rằng mọi loài này đều nhỏ hoặc tụ thành nhiều.
    rationale: Nên trình bày đây là cách dịch thay thế cho toàn cụm, không thêm đặc điểm phân loại không được câu này xác định.
