  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: vi
  text: Vì Ta là Yahweh, Đức Chúa Trời của các con. Vậy, hãy tự thánh hóa mình[a] và hãy nên thánh, vì Ta là thánh. Các con không được làm ô uế bản thân bởi bất cứ loài vật lúc nhúc nào bò trên đất.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy biệt riêng mình ra thánh.” Động từ Hê-bơ-rơ ở thể phản thân, chỉ việc tự biệt riêng mình cho sự thánh khiết.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bất cứ loài vật bò lúc nhúc nào trên đất.” Cụm Hê-bơ-rơ chỉ các loài vật lúc nhúc hay bò trên mặt đất; không nhất thiết tương ứng với một nhóm phân loại hiện đại duy nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời dưới dạng phiên âm, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các con
  rationale: Trong công thức giao ước với Yahweh làm chủ thể, từ này mang nghĩa số ít; cách xưng hô “Ta–các con” tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: hãy thánh hóa chính mình
  rationale: 'Thể Hitpael mang nghĩa phản thân: dân chúng phải biệt riêng chính mình để thuộc về sự thánh khiết. Cách dịch này giữ được cả sắc thái nghi lễ lẫn đạo đức.'
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: và nên thánh
  rationale: Diễn đạt trạng thái hoặc kết quả được đòi hỏi sau hành động thánh hóa, đồng thời giữ lực mệnh lệnh theo ngữ cảnh.
- source_word: קָדוֹשׁ
  choice: thánh
  rationale: Giữ cùng một từ ngữ cho sự thánh khiết của dân và của chính Đức Chúa Trời, phản ánh sự lặp lại của gốc קדשׁ.
- source_word: תְטַמְּאוּ
  choice: làm ô uế
  rationale: Diễn đạt việc gây nên tình trạng ô uế, phù hợp với bối cảnh thanh sạch nghi lễ mà không loại trừ chiều kích đạo đức.
- source_word: נַפְשֹׁתֵיכֶם
  choice: bản thân
  rationale: Trong cấu trúc này, נֶפֶשׁ chỉ toàn thể con người; “bản thân” tránh áp đặt cách hiểu nhị nguyên thân thể–linh hồn.
- source_word: שֶּׁרֶץ
  choice: sinh vật lúc nhúc
  rationale: “Lúc nhúc” thể hiện đặc điểm tụ thành nhiều và chuyển động của nhóm sinh vật được nói đến trong Lê-vi Ký 11, chính xác hơn cách gọi quá hẹp như “loài bò sát”.
- source_word: הָרֹמֵשׂ
  choice: di chuyển
  rationale: Động từ chỉ sự chuyển động trên mặt đất; “di chuyển” giữ phạm vi nghĩa rộng, không mặc nhiên giới hạn vào cách bò hoặc trườn.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho sự chuyển động trên mặt đất; không buộc הָאָרֶץ phải mang nghĩa toàn thể địa cầu.
theological_decisions:
- issue: Mối liên hệ giữa sự thánh khiết của Đức Chúa Trời và bổn phận của dân
  choice: Dùng “thánh” nhất quán cho cả dân và Đức Chúa Trời
  alternative: Dịch một hoặc cả hai chỗ là “được biệt riêng”
  rationale: Sự lặp lại của gốc קדשׁ đặt bổn phận nên thánh của dân trên nền tảng chính sự thánh khiết của Đức Chúa Trời; dùng cùng một từ bảo toàn mối liên hệ thần học này.
- issue: Ý nghĩa của נַפְשֹׁתֵיכֶם
  choice: Dịch theo thành ngữ là “bản thân”
  alternative: “linh hồn của các con” hoặc “mạng sống của các con”
  rationale: Câu này nói đến việc chính con người bị ô uế do các sinh vật bị cấm, chứ không trình bày một học thuyết kỹ thuật về cấu tạo con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng cặp đại từ “Ta–các con” cho lời Đức Chúa Trời phán với cộng đồng Israel; giữ tên “Yahweh” và thuật ngữ then chốt “thánh.” Dấu [a], [b] đều xuất hiện trong chính văn và tương ứng với chú thích.
