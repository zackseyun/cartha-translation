  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כֹּ֚ל שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: vi
  text: Mọi loài côn trùng có cánh, đi bằng bốn chân, đều là vật đáng ghê tởm đối với các ngươi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đi trên bốn”; cách nói này chỉ việc di chuyển bằng bốn chân. Các câu tiếp theo nêu ngoại lệ đối với một số côn trùng có chân dùng để nhảy.'
    reason: cultural_note
  - marker: b
    text: '“Đáng ghê tởm” ở đây diễn tả sự ghê tởm hay cấm kỵ theo luật thực phẩm; cũng có thể dịch: “là vật ghê tởm đối với các ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Mọi loài
  rationale: Diễn đạt tính bao quát, đồng thời kết hợp tự nhiên với danh từ chỉ một lớp sinh vật trong tiếng Việt.
- source_word: שֶׁרֶץ הָעוֹף
  choice: côn trùng có cánh
  rationale: Trong ngữ cảnh các câu 20–23, cụm từ chỉ những sinh vật nhỏ có cánh sống thành bầy, cụ thể là côn trùng; cách dịch này tự nhiên và tránh khiến độc giả nghĩ đến riêng loài chim.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: đi bằng bốn chân
  rationale: Bám sát thành ngữ Hê-bơ-rơ 'đi trên bốn', chỉ cách di chuyển bằng bốn chân; câu kế tiếp sẽ nêu ngoại lệ liên quan đến chân dùng để nhảy.
- source_word: שֶׁקֶץ
  choice: vật đáng ghê tởm
  rationale: Giữ sắc thái ghê tởm, cấm kỵ trong luật thực phẩm, mạnh hơn từ 'ô uế' và không đồng nhất hai thuật ngữ Hê-bơ-rơ khác nhau.
- source_word: לָכֶם
  choice: đối với các ngươi
  rationale: 'Diễn đạt quan hệ mà giới từ Hê-bơ-rơ đánh dấu: dân Y-sơ-ra-ên phải xem các sinh vật ấy là đáng ghê tởm.'
theological_decisions:
- issue: Sắc thái nghi lễ của שֶׁקֶץ
  choice: Dịch là 'vật đáng ghê tởm' và giải thích trong chú thích rằng đây là sự ghê tởm theo luật thực phẩm.
  alternative: Dịch trực tiếp là 'vật ô uế' hoặc hiểu như một phán quyết đạo đức phổ quát.
  rationale: Nguyên văn dùng שֶׁקֶץ chứ không dùng thuật ngữ thông thường cho 'ô uế'; ngữ cảnh là luật ăn uống dành cho Y-sơ-ra-ên, nên không mở rộng hay thu hẹp ý nghĩa thần học của câu.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng rõ ràng, dùng tiếng Việt hiện đại. Đại từ “các ngươi” duy trì sắc thái lời phán trực tiếp với cộng đồng Y-sơ-ra-ên. “Côn trùng có cánh” được ưu tiên hơn cách dịch từng chữ “sinh vật lúc nhúc thuộc loài bay” vì ngữ cảnh gần xác định nhóm sinh vật, trong khi các chú thích bảo tồn nét thành ngữ và sắc thái nghi lễ.
