  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc điều kiện, thể bị động của יֻתַּן, quy chiếu của עָלָיו về hạt giống, và tính chất nghi lễ của טָמֵא. Tuy nhiên, “một phần xác chết của chúng” không tự nhiên và có thể gợi một “phần” xác định; מִן ở đây được hiểu hợp lý hơn theo nghĩa bộ phận/phiếm chỉ: bất cứ phần nào của xác chúng.'
  naturalness: Cần thay “rồi” bằng “và” để không nhấn quá mức trình tự thời gian, và dùng “xác chúng” thay cho “xác chết của chúng” cho gọn, tự nhiên hơn trong ngữ cảnh xác động vật.
