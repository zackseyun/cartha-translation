    rationale: Cụm tiếng Hê-bơ-rơ có thể chỉ bất cứ phần nào từ xác của các loài đã nêu, chứ không nhất thiết một phần xác định. “Bất cứ phần nào của xác chúng” phản ánh rõ hơn cách hiểu này mà vẫn giữ tính thận trọng.
  - severity: low
