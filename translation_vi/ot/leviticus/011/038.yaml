source:
  edition: WLC
  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: vi
  text: Nhưng nếu nước đã được đổ lên hạt giống, và bất cứ phần nào của xác chúng[a] rơi trên đó, thì hạt giống ấy bị ô uế đối với các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “xác của bất cứ con nào trong số chúng.” Từ Hê-bơ-rơ נְבֵלָה chỉ xác của một con vật đã chết; giới từ đi kèm có thể mang nghĩa bộ phận, tức là bất cứ phần nào của xác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện tương phản với trường hợp ở câu trước, đồng thời giữ sắc thái liên kết của וְ.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: nước đã được đổ lên hạt giống
  rationale: Giữ thể bị động của יֻתַּן và ý nghĩa trực tiếp là nước được đặt/đổ lên hạt giống; tránh diễn giải rộng thành ‘hạt giống đã được làm ẩm’.
- source_word: מִנִּבְלָתָם
  choice: một phần xác chết của chúng
  rationale: נְבֵלָה chỉ xác động vật, còn מִן ở đây có thể mang nghĩa bộ phận; cách dịch này phản ánh cả hai yếu tố và hợp với ngữ cảnh luật thanh sạch.
- source_word: עָלָיו
  choice: trên đó
  rationale: Đại từ giống đực số ít quy chiếu về זֶרַע; ‘trên đó’ tự nhiên trong tiếng Việt và không gây nhầm về vật được chạm tới.
- source_word: טָמֵא הוּא לָכֶם
  choice: hạt giống ấy bị ô uế đối với các ngươi
  rationale: Giữ công thức tuyên bố tình trạng ô uế theo nghi lễ và biểu đạt לָכֶם bằng ‘đối với các ngươi’, không biến nó thành sự phạm tội về đạo đức.
theological_decisions:
- issue: Bản chất của tình trạng טָמֵא
  choice: ô uế theo nghi lễ
  alternative: dơ bẩn hoặc phạm uế theo nghĩa đạo đức
  rationale: Ngữ cảnh là luật thanh sạch của Lê-vi Ký; câu này xác định tình trạng nghi lễ của hạt giống chứ không nhất thiết quy kết tội lỗi đạo đức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và rõ ràng. Dùng ‘các ngươi’ để giữ lối xưng hô cộng đồng trong luật giao ước; lặp lại ‘hạt giống ấy’ ở mệnh đề kết để tránh đại từ mơ hồ.
