  text: וְ/כִ֤י יִפֹּל֙ מִ/נִּבְלָתָ֔/ם עַל כָּל זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: vi
  text: Và nếu một phần xác của chúng rơi trên bất cứ hạt giống nào dùng để gieo, thì hạt giống đó thanh sạch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Nếu xác của một trong chúng rơi trên bất cứ hạt giống nào dùng để gieo.” Cụm Hê-bơ-rơ מִנִּבְלָתָם có thể được hiểu theo nghĩa phân bộ (“một phần xác của chúng”) hoặc theo nghĩa tập hợp/số nhiều (“xác của chúng”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện trong chuỗi luật lệ; tiếng Việt không cần dịch riêng liên từ וְ để nối ý được tự nhiên.
- source_word: יִפֹּל
  choice: rơi
  rationale: Động từ Qal chưa hoàn thành trong luật tình huống diễn tả sự việc giả định; “rơi” là cách nói tự nhiên và chính xác.
- source_word: מִ/נִּבְלָתָם
  choice: một phần xác chết của chúng
  rationale: מִן có thể mang nghĩa phân bộ, còn נְבֵלָה chỉ xác động vật chết. Cách dịch này truyền đạt tự nhiên rằng một phần thuộc xác của những con vật vừa nêu rơi xuống, đồng thời ghi nhận cách hiểu số nhiều trong chú thích.
- source_word: עַל כָּל זֶרַע זֵרוּעַ
  choice: trên bất cứ hạt giống nào để gieo
  rationale: כָּל có nghĩa phân phối trong điều kiện pháp lý; cụm זֶרַע זֵרוּעַ nói đến hạt giống dành cho việc gieo trồng.
- source_word: אֲשֶׁר יִזָּרֵעַ
  choice: để gieo
  rationale: Mệnh đề quan hệ mang ý hướng tới việc gieo; tiếng Việt diễn đạt gọn và tự nhiên bằng cụm chỉ mục đích.
- source_word: טָהוֹר הוּא
  choice: hạt giống ấy vẫn thanh sạch
  rationale: טָהוֹר trong luật thanh sạch nghi lễ được dịch là “thanh sạch”. Đại từ được nói rõ là “hạt giống ấy” để tránh mơ hồ; “vẫn” làm rõ kết quả pháp lý trong ngữ cảnh mà không thay đổi phán định.
theological_decisions:
- issue: Phạm vi của sự thanh sạch
  choice: Hạt giống bị xác chết rơi lên vẫn được xem là thanh sạch trong trường hợp này.
  alternative: Dịch đơn giản “nó thanh sạch”, để đại từ không được xác định rõ.
  rationale: Chủ thể ngữ pháp gần nhất và nội dung luật cho thấy הוּא quy chiếu về זֶרַע, tức hạt giống; nói rõ chủ thể giúp tiếng Việt dễ hiểu mà không thêm một chủ thể mới.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Dùng “xác chết” cho נְבֵלָה và “thanh sạch” cho thuật ngữ nghi lễ טָהוֹר. Dấu chú thích [a] xuất hiện ngay sau câu chính.
