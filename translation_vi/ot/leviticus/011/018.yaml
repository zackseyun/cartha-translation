  language: vi
  text: chim cú[a], chim bồ nông[b] và kền kền[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không rõ chính xác là loài chim nào; cũng có thể là một loài cú cụ thể.
    reason: Bảo lưu sự bất định về danh tính của תִּנְשֶׁמֶת.
  - marker: b
    text: Tên loài trong tiếng Hê-bơ-rơ không được xác định chắc chắn; theo truyền thống là chim bồ nông.
    reason: Cho biết cách dịch dựa trên truyền thống nhưng không che giấu vấn đề định danh.
  - marker: c
    text: Có thể chỉ cụ thể loài kền kền Ai Cập.
    reason: Nêu khả năng định danh hẹp hơn của רָחָם mà không đưa điều chưa chắc chắn vào chính văn.
lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (ha-tinšemet)
  choice: chim cú
  rationale: Tên loài chim này không thể xác định chắc chắn. “Chim cú” giữ cách hiểu truyền thống và phù hợp với ngữ cảnh danh sách các loài chim, nhưng sự bất định được nêu rõ trong chú thích.
- source_word: הַקָּאָת (ha-qāʾat)
  choice: chim bồ nông
  rationale: “Chim bồ nông” là cách nhận diện truyền thống và được nhiều bản dịch sử dụng; tuy vậy, các ngữ cảnh khác mô tả loài này ở nơi hoang vu nên không thể coi việc nhận diện là tuyệt đối chắc chắn.
- source_word: הָרָחָם (hā-rāḥām)
  choice: kền kền ăn xác
  rationale: Các từ cùng gốc trong ngôn ngữ Semit và truyền thống cổ hỗ trợ việc nhận diện đây là một loài kền kền, có thể cụ thể là kền kền Ai Cập. Cách dịch rộng hơn tránh khẳng định quá mức về loài chính xác.
