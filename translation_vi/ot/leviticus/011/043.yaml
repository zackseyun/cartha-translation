language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: vi
  text: Đừng làm cho bản thân trở nên ghê tởm vì bất cứ sinh vật lúc nhúc nào[a]; cũng đừng tự làm mình ô uế vì chúng, kẻo trở nên ô uế vì chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất cứ sinh vật bò trườn nào.” Từ Hê-bơ-rơ chỉ rộng một nhóm sinh vật nhỏ chuyển động, lúc nhúc hoặc đầy dẫy; không chỉ riêng các loài bò sát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: làm cho chính mình trở nên ghê tởm
  rationale: Giữ nghĩa phản thân của động từ שׁקץ và sắc thái “ghê tởm”, đồng thời không nhập nó với thuật ngữ ô uế טמא ở phần sau.
- source_word: נַפְשֹׁתֵיכֶם
  choice: chính mình
  rationale: Trong cấu trúc này, נֶפֶשׁ chỉ toàn thể con người/bản thân; dịch sát là “linh hồn” sẽ thu hẹp nghĩa không thích đáng.
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: bởi bất cứ loài vật lúc nhúc nào
  rationale: “Loài vật lúc nhúc” diễn đạt lớp sinh vật nhỏ di chuyển thành đàn hoặc đầy dẫy mà שׁרץ chỉ đến. Tiếng Việt khó giữ tự nhiên hoàn toàn phép lặp từ nguyên “sinh vật lúc nhúc đang lúc nhúc”, nên ưu tiên nghĩa loại.
- source_word: תִטַּמְּאוּ
  choice: làm cho mình ra ô uế
  rationale: Giữ lực phản thân của hình thái hitpael và thuật ngữ “ô uế” quen thuộc trong luật thanh sạch của Lê-vi.
- source_word: בָּהֶם / בָּם
  choice: bởi chúng / vì chúng
  rationale: 'Diễn đạt quan hệ phương tiện hoặc nguyên nhân: các sinh vật ấy là điều qua đó tình trạng ô uế phát sinh; thay đổi nhẹ giới từ để câu tiếng Việt tự nhiên mà vẫn giữ sự lặp ý.'
- source_word: וְנִטְמֵתֶם
  choice: rồi trở nên ô uế
  rationale: Giữ liên từ וְ theo hướng kết quả/tiếp diễn mà không quyết đoán quá mức giữa “và”, “đến nỗi” hay lời cảnh báo “kẻo”.
theological_decisions:
- issue: Thuật ngữ về tình trạng טמא trong luật thánh sạch
  choice: ô uế
  alternative: không thanh sạch; bị ô nhiễm
  rationale: “Ô uế” là cách nói rõ và quen thuộc trong văn cảnh nghi lễ, nhưng không tự động quy tình trạng này thành tội lỗi luân lý.
- issue: Quan hệ của וְנִטְמֵתֶם với mệnh lệnh cấm trước đó
  choice: rồi trở nên ô uế
  alternative: kẻo các ngươi trở nên ô uế; để các ngươi không trở nên ô uế
  rationale: Tiếng Hê-bơ-rơ dùng liên từ đơn giản và có thể được hiểu là kết quả hoặc lời cảnh báo. Bản dịch chính giữ quan hệ kết quả tương đối mở, tránh thêm một phủ định không có mặt trực tiếp trong mệnh đề cuối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “mình/chính mình” để biểu đạt tính phản thân tự nhiên trong tiếng Việt; giữ “ô uế” như thuật ngữ nhất quán của văn cảnh Lê-vi. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
