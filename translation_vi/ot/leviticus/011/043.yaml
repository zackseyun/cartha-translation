    rationale: Cách dịch này xác nhận một diễn tiến thực tế và làm yếu lực cảnh báo của câu sau hai mệnh lệnh cấm. “Kẻo trở nên ô uế” truyền đạt tự nhiên chức năng cảnh báo/kết quả trong ngữ cảnh mà không thêm diễn giải giáo lý.
  - severity: low
    issue: Cụm “làm cho mình ra ô uế” thiếu tự nhiên.
    rationale: Trong tiếng Việt hiện đại, “tự làm mình ô uế” là cách diễn đạt phản thân tự nhiên hơn, vẫn phản ánh hình thái hitpael.
  - severity: low
    issue: “Loài vật lúc nhúc” và chú thích “loài bò lúc nhúc” chưa thật tự nhiên và có thể thu hẹp phạm vi từ vựng.
    rationale: שׁרץ chỉ một lớp sinh vật chuyển động/đầy dẫy, không chỉ bò sát. “Sinh vật lúc nhúc” cùng chú thích giải thích phạm vi rộng hơn vừa tự nhiên vừa chính xác hơn.
