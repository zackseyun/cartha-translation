- from: Đừng làm cho chính mình trở nên ghê tởm bởi bất cứ loài vật lúc nhúc nào[a]; cũng đừng làm cho mình ra ô uế bởi chúng, rồi trở nên ô uế vì chúng.
  to: Đừng làm cho bản thân trở nên ghê tởm vì bất cứ sinh vật lúc nhúc nào[a]; cũng đừng tự làm mình ô uế vì chúng, kẻo trở nên ô uế vì chúng.
