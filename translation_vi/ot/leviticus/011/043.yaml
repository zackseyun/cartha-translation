review_pass:
  verdict: revise
  source_fidelity: Bản nháp phân biệt đúng שׁקץ (trở nên ghê tởm) với טמא (ô uế) và giữ được tính phản thân. Tuy nhiên, “rồi trở nên ô uế” khiến mệnh đề cuối nghe như một kết quả được khẳng định, trong khi trong chuỗi mệnh lệnh phủ định, וְנִטְמֵתֶם mang lực cảnh báo/kết quả cần tránh, phù hợp hơn với “kẻo”.
  naturalness: “Làm cho mình ra ô uế” không tự nhiên trong tiếng Việt hiện đại; “tự làm mình ô uế” gọn và rõ hơn. “Sinh vật lúc nhúc” bao quát nhóm שׁרץ tốt hơn “loài vật lúc nhúc”, vốn cũng hơi gượng trong cách kết hợp từ.
  terminology: Giữ “ghê tởm” cho שׁקץ và “ô uế” cho טמא là thích hợp, giúp không đồng nhất hai trường nghĩa. “Sinh vật” tránh thu hẹp nhóm שׁרץ vào các loài bò sát.
  issues:
