source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: vi
  text: Còn con đa man đá[a], vì nó nhai lại nhưng móng guốc không chẻ đôi, nên nó là loài ô uế đối với các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hyrax”, một loài thú nhỏ sống ở vùng núi đá. Các bản dịch tiếng Anh truyền thống thường gọi là “coney”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: con đa man đá
  rationale: שָׁפָן thường được nhận diện là loài hyrax sống ở vùng núi đá. “Đa man đá” là tên gọi động vật học tương đối chính xác trong tiếng Việt; chú thích thêm tên “hyrax” và mô tả ngắn để hỗ trợ độc giả phổ thông.
- source_word: כִּי
  choice: vì
  rationale: Từ này dẫn vào lý do con vật bị xếp vào loại ô uế; “vì” diễn đạt tự nhiên và rõ quan hệ nguyên nhân trong tiếng Việt.
- source_word: מַעֲלֵה גֵרָה
  choice: nhai lại
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ Hê-bơ-rơ có nghĩa đen là “đưa thức ăn đã nuốt lên lại”, đồng thời giữ nguyên cách phân loại theo quan sát của bản văn.
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: nhưng móng guốc không chẻ đôi
  rationale: Cách dịch này thể hiện rõ sự tương phản và việc con vật không có móng guốc chẻ đôi theo tiêu chuẩn của luật ăn uống trong đoạn văn.
- source_word: טָמֵא
  choice: ô uế
  rationale: Trong Lê-vi Ký 11, từ này chỉ tình trạng không thanh sạch theo nghi lễ và luật ăn uống. “Ô uế” là thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt, không nên được hiểu là phán xét đạo đức về con vật.
- source_word: לָכֶם
  choice: đối với các ngươi
  rationale: Giữ rõ đối tượng số nhiều là cộng đồng Israel đang được truyền luật; cách xưng hô trang trọng phù hợp với lời luật định.
theological_decisions:
- issue: Bản chất của טָמֵא trong luật ăn uống Lê-vi
  choice: Tình trạng ô uế theo nghi lễ, không phải sự xấu xa về đạo đức
  alternative: Ô uế về luân lý hoặc bản chất
  rationale: Ngữ cảnh Lê-vi Ký 11 phân loại động vật theo tình trạng thanh sạch và ô uế dành cho cộng đồng giao ước; câu không gán lỗi đạo đức cho con vật.
- issue: Cách mô tả מַעֲלֵה גֵרָה đối với loài đa man
  choice: Giữ cách nói “nhai lại” của hệ thống phân loại trong bản văn
  alternative: Điều chỉnh theo cách phân loại động vật học hiện đại
  rationale: Bản dịch cần phản ánh cách quan sát và thuật ngữ của nguyên bản, không âm thầm sửa lời văn theo phân loại khoa học hiện đại.
translation_notes:
  register: Văn phong luật định, trang trọng nhưng dễ hiểu. Cấu trúc “vì… nhưng… nên…” làm rõ lý do phân loại trong tiếng Việt. Dùng “đa man đá” vì chính xác hơn về loài vật, kèm chú thích cho độc giả không quen tên này.
