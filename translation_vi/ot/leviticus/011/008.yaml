base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: vi
  text: Anh em không được ăn bất cứ thịt nào của chúng, cũng không được chạm vào xác của chúng[a]; chúng là ô uế đối với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ xác của một con vật đã chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: chút thịt nào của chúng
  rationale: 'Giới từ מִן với בָּשָׂר có sắc thái phân lượng: không được ăn bất cứ phần thịt nào của các con vật ấy. Cách diễn đạt này vừa giữ được ý phân lượng vừa tự nhiên trong tiếng Việt.'
- source_word: לֹא תֹאכֵלוּ
  choice: anh em không được ăn
  rationale: Thể vị hoàn thành dùng trong luật lệ mang lực cấm đoán. “Không được” diễn đạt rõ mệnh lệnh cấm bằng tiếng Việt hiện đại; “anh em” thể hiện ngôi thứ hai số nhiều mà không quá cổ.
- source_word: וּבְנִבְלָתָם
  choice: xác chúng
  rationale: נְבֵלָה chỉ xác của con vật đã chết. “Xác” chính xác và tự nhiên trong văn cảnh luật thanh sạch, không khiến người đọc hiểu là thi thể người.
- source_word: לֹא תִגָּעוּ
  choice: không được chạm vào
  rationale: נגע có nghĩa trực tiếp là chạm hoặc tiếp xúc. Bản dịch giữ động từ “chạm” và không thêm hệ quả nghi lễ vốn không được nói rõ trong câu này.
- source_word: טְמֵאִים
  choice: loài ô uế
  rationale: טָמֵא ở đây là phạm trù ô uế theo nghi lễ Lê-vi. “Ô uế” là thuật ngữ quen thuộc, trang trọng và không đồng nhất tình trạng này với sự gian ác về đạo đức.
- source_word: הֵם לָכֶם
  choice: chúng là loài ô uế đối với anh em
  rationale: לָכֶם diễn tả quan hệ của các con vật này với cộng đồng được truyền luật. “Đối với anh em” giữ sắc thái quan hệ ấy mà không suy diễn thêm.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật thực phẩm Lê-vi
  choice: Dùng “ô uế” như một phạm trù nghi lễ trong chính văn.
  alternative: Dùng “không thanh sạch” hoặc giải thích đây là điều xấu về đạo đức.
  rationale: Câu này thuộc hệ thống thanh sạch của giao ước dành cho Israel. Bản dịch giữ nguyên phạm trù của văn bản, không biến nó thành phán đoán đạo đức và cũng không quyết định vấn đề áp dụng trong các giao ước về sau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều nhằm tránh sắc thái cổ hoặc xa cách của “các ngươi”; cấu trúc song hành của hai lệnh cấm được giữ lại.
