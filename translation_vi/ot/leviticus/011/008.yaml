  source_fidelity: Bản dịch truyền đạt đúng hai mệnh lệnh phủ định và kết luận về tình trạng ô uế. Tuy nhiên, «loài ô uế» diễn giải các cá thể được nói đến như một phân loại loài; tiếng Hê-bơ-rơ chỉ nói đơn giản «chúng ô uế đối với anh em».
  naturalness: «Anh em không được…» và cấu trúc song hành rất tự nhiên trong tiếng Việt Kinh Thánh hiện đại. Đổi «chút thịt nào» thành «bất cứ thịt nào» tránh sắc thái hơi thu hẹp vào một lượng nhỏ, trong khi vẫn diễn đạt ý phân lượng của מן. «Xác của chúng» rõ và trôi chảy hơn «xác chúng».
  terminology: Giữ «ô uế» để phản ánh טְמֵאִים như một thuật ngữ thanh sạch nghi lễ. Giữ «xác» cho נְבֵלָה và chú thích xác định đây là xác động vật, không phải thi thể người.
