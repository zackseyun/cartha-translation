source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: vi
  text: Đây là luật lệ[a] về các loài thú, các loài chim, mọi sinh vật[b] di chuyển trong nước và mọi sinh vật lúc nhúc trên đất[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự chỉ dạy về”; từ Hê-bơ-rơ תּוֹרָה có thể chỉ sự giáo huấn có thẩm quyền cũng như luật lệ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên ngữ cũng có thể dịch là “mọi hữu thể sống”; cụm נֶפֶשׁ הַחַיָּה chỉ sự sống có sinh khí, không nhất thiết nói đến một “linh hồn” phi vật chất.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “trên mặt đất” hoặc “trên trái đất.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: luật lệ về
  rationale: Trong câu tổng kết này, תּוֹרָה chỉ toàn bộ những quy định có thẩm quyền vừa được trình bày. “Luật lệ về” tự nhiên trong tiếng Việt và vẫn giữ được sắc thái pháp quy, trong khi chú thích ghi nhận nghĩa rộng hơn là sự chỉ dạy.
- source_word: הַבְּהֵמָה
  choice: các loài thú
  rationale: בְּהֵמָה ở đây là tên gọi khái quát cho nhóm động vật trên cạn đã được bàn đến, không nhất thiết chỉ gia súc. “Các loài thú” rõ nghĩa và tránh thu hẹp phạm vi.
- source_word: הָעוֹף
  choice: các loài chim
  rationale: עוֹף có thể bao quát các sinh vật bay, nhưng trong ngữ cảnh phân loại này, “các loài chim” là cách diễn đạt tự nhiên và đủ chính xác.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: mọi sinh vật
  rationale: Cụm נֶפֶשׁ הַחַיָּה là thành ngữ chỉ một hữu thể sống. “Sinh vật” truyền đạt đúng ý mà không gợi nghĩa linh hồn phi vật chất.
- source_word: הָרֹמֶשֶׂת
  choice: di chuyển
  rationale: Động từ רמש diễn tả sự chuyển động của sinh vật, thường là sinh vật nhỏ. Với sinh vật dưới nước, “di chuyển” vừa rộng vừa tự nhiên hơn “bò” hay “bò lúc nhúc”.
- source_word: בַּמָּיִם
  choice: trong nước
  rationale: Dù מַיִם có hình thức số nhiều trong tiếng Hê-bơ-rơ, tiếng Việt tự nhiên dùng “trong nước” để chỉ môi trường sống dưới nước.
- source_word: הַשֹּׁרֶצֶת
  choice: lúc nhúc
  rationale: שׁרץ gợi chuyển động đông đúc của các sinh vật nhỏ. “Lúc nhúc” phân biệt từ này với רמש ở vế trước và phù hợp với ngữ cảnh.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Ở đây אֶרֶץ đối lập với “nước”, nên “trên đất” là cách diễn đạt tiếng Việt tự nhiên; từ Hê-bơ-rơ cũng có thể được hiểu rộng là “trên mặt đất” hoặc “trên trái đất”.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc liệt kê của nguyên văn được giữ lại; “lúc nhúc” bảo tồn sự khác biệt giữa hai động từ Hê-bơ-rơ chỉ chuyển động, còn “các loài thú” tránh thu hẹp בְּהֵמָה thành riêng gia súc.
