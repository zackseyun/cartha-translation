review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: mệnh lệnh cấm ăn, hai tiêu chí phân loại, lạc đà có đặc điểm nhai lại nhưng không chẻ móng, và kết luận là ô uế đối với người được luật pháp ngỏ lời. Tuy nhiên, “những loài sau đây” không tự nhiên khi danh sách trong câu chỉ nêu một con vật; “những con sau đây” phản ánh tốt hơn cách nguyên văn mở đầu một danh sách ví dụ về động vật.'
  naturalness: Câu nhìn chung rõ và có văn phong luật lệ trang trọng. Việc lặp “các loài” ở hai vế phân loại giúp cấu trúc tiếng Việt cân đối, dễ hiểu hơn mà không thay đổi nghĩa.
  terminology: “Nhai lại,” “móng chẻ,” “lạc đà,” và “ô uế” là các lựa chọn chuẩn, tự nhiên, và phù hợp với thuật ngữ trong Lê-vi Ký. Giữ “ô uế” thay vì diễn giải vào thân câu là thích hợp; chú thích chỉ giải thích bối cảnh pháp luật Israel.
  issues:
  - severity: low
    issue: Cụm “những loài sau đây” dẫn vào chỉ một ví dụ là lạc đà.
    rationale: Tiếng Hê-bơ-rơ dùng dạng số nhiều để giới thiệu một nhóm/danh sách các con vật bị cấm; trong câu riêng lẻ này, “những con sau đây” tự nhiên hơn và vẫn bảo toàn chức năng giới thiệu ví dụ của nguyên văn.
  revised_text: 'Tuy nhiên, trong số các loài nhai lại hoặc các loài có móng chẻ[a], các ngươi không được ăn những con sau đây: lạc đà, vì nó nhai lại nhưng không có móng chẻ; nó là ô uế đối với các ngươi[b].'
