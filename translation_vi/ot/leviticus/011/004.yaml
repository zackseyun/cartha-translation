  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: vi
  text: 'Tuy nhiên, trong số các loài nhai lại hoặc các loài có móng chẻ[a], các ngươi không được ăn những con sau đây: lạc đà, vì nó nhai lại nhưng không có móng chẻ; nó là ô uế đối với các ngươi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “móng rẽ làm hai.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “ô uế đối với các ngươi”, tức là bị xem là ô uế đối với Israel theo luật về thức ăn.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Giữ sắc thái hạn định và đối lập với quy tắc ở câu trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: trong số những loài nhai lại
  rationale: Thành ngữ Hê-bơ-rơ nói sát nghĩa là “đưa thức ăn đã nhai lên”; “nhai lại” là cách gọi rõ ràng, thông dụng cho đặc điểm phân loại này.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: hoặc có móng chẻ
  rationale: Trong ngữ cảnh, các con vật bị cấm có một trong hai đặc điểm nhưng không hội đủ cả hai; “hoặc” diễn đạt đúng quan hệ phân loại, còn “móng chẻ” là cách nói tự nhiên.
- source_word: הַגָּמָל
  choice: lạc đà
  rationale: Tương đương trực tiếp và thông dụng của tên con vật.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: vì nó nhai lại
  rationale: Nêu đặc điểm thứ nhất mà lạc đà đáp ứng, bằng thuật ngữ sinh học phổ thông trong tiếng Việt.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: nhưng không có móng chẻ
  rationale: 'Diễn đạt rõ sự tương phản: lạc đà không đáp ứng đặc điểm thứ hai. Cách nói này tự nhiên hơn lối dịch sát cú pháp “không chẻ móng”.'
- source_word: טָמֵא הוּא לָכֶם
  choice: nó là ô uế đối với các ngươi
  rationale: “Ô uế” giữ thuật ngữ trọng yếu về tình trạng thanh sạch trong Lê-vi Ký; “đối với các ngươi” bảo toàn góc nhìn pháp luật giao ước của nguyên văn mà không diễn giải quá mức.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật ăn uống của Lê-vi Ký
  choice: ô uế
  alternative: ô uế về nghi lễ
  rationale: Nguyên văn טָמֵא chỉ sự phân loại ô uế đối với Israel trong bối cảnh này. Bản dịch chính giữ thuật ngữ rộng của Kinh Thánh, không thu hẹp ngay trong câu thành “về nghi lễ”; chú thích cung cấp bối cảnh cần thiết.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu, dùng “các ngươi” để phản ánh lời luật trực tiếp nói với cộng đồng Israel. Cấu trúc câu được sắp xếp lại vừa phải để mệnh lệnh và hai tiêu chí phân loại rõ ràng trong tiếng Việt hiện đại; không thêm sắc thái hệ phái.
