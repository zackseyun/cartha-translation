  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê ngắn gọn của nguyên văn; dùng tên động vật thông dụng trong tiếng Việt, đồng thời ghi chú mức độ bất định cao về việc định danh.
