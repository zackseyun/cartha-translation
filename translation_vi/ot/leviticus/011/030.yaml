  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: vi
  text: tắc kè[a], kỳ đà, thằn lằn, thằn lằn cát và tắc kè hoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Không thể xác định chắc chắn một số loài vật trong câu này. Các đề xuất truyền thống và hiện đại gồm: “tắc kè” cũng có thể là “chồn” hoặc “chuột chù”; “kỳ đà” có thể là “tắc kè hoa”; “thằn lằn cát” có thể là “thằn lằn bóng,” hoặc theo truyền thống cổ là “ốc sên”; “tắc kè hoa” có thể là “chuột chũi” hoặc một loài thằn lằn khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: tắc kè
  rationale: Loài vật chính xác không chắc chắn; trong danh sách các loài bò sát nhỏ ở đây, cách dịch bằng một loài thằn lằn hợp ngữ cảnh hơn các đề xuất chỉ động vật có vú như chồn hoặc chuột chù.
- source_word: הַכֹּחַ
  choice: kỳ đà
  rationale: Từ này thường được hiểu là một loài thằn lằn lớn; “kỳ đà” là tên gọi tự nhiên, dễ hiểu trong tiếng Việt và phân biệt được với các loài thằn lằn khác trong câu.
- source_word: הַלְּטָאָה
  choice: thằn lằn
  rationale: Dùng tên gọi khái quát vì không thể xác định chắc chắn loài cụ thể, tránh tạo cảm giác chính xác quá mức.
- source_word: הַחֹמֶט
  choice: thằn lằn cát
  rationale: Trong danh sách bò sát này, cách nhận diện là một loài thằn lằn hợp lý hơn cách dịch cổ là “ốc sên”; tuy vậy, “thằn lằn bóng” cũng là một khả năng.
- source_word: הַתִּנְשָׁמֶת
  choice: tắc kè hoa
  rationale: Dù từ Hê-bơ-rơ này ở chỗ khác có thể chỉ một loài chim, ngữ cảnh tại đây đòi hỏi một sinh vật bò sát; “tắc kè hoa” là cách nhận diện phổ biến nhưng không chắc chắn tuyệt đối.
