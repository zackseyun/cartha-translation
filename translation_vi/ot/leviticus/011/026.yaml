source:
  edition: WLC
  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: vi
  text: Còn mọi loài vật có móng chẻ nhưng móng không chẻ hoàn toàn[a] và không nhai lại, thì chúng là ô uế đối với anh em. Bất cứ ai chạm vào chúng đều sẽ trở nên ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có lối nói “không chẻ một đường chẻ”; cấu trúc Hê-bơ-rơ nhấn mạnh rằng móng không chẻ hoàn toàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: Còn mọi loài vật
  rationale: Giới từ לְ mở ra một hạng mục đang được xét; “Còn” diễn đạt tự nhiên chức năng chuyển đề, còn בְּהֵמָה ở đây chỉ chung loài vật trên cạn.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: có móng chẻ
  rationale: Cụm từ chỉ đặc điểm móng bị phân chia; “có móng chẻ” ngắn gọn, tự nhiên và chính xác trong tiếng Việt.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: nhưng móng không chẻ hoàn toàn
  rationale: Cấu trúc danh từ–động từ cùng gốc nhấn mạnh rằng khe móng không tách hẳn; “hoàn toàn” truyền đạt ý này mà không làm câu quá sát chữ.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: và không nhai lại
  rationale: Nghĩa đen là không đưa thức ăn đã nhai lên lại; “nhai lại” là thuật ngữ tiếng Việt thông dụng và tương đương về động vật học.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: chúng là ô uế đối với anh em
  rationale: “Ô uế” giữ phạm trù thanh sạch theo nghi lễ của Lê-vi Ký; “đối với anh em” bảo lưu góc nhìn pháp lý–giao ước của לָכֶם bằng lối xưng hô cộng đồng, hiện đại.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Bất cứ ai chạm vào chúng
  rationale: כָּל đi với phân từ số ít tạo một mệnh đề khái quát; cách dịch này rõ ràng và tự nhiên.
- source_word: יִטְמָא
  choice: đều sẽ bị ô uế
  rationale: Dạng chưa hoàn thành nêu hậu quả pháp lý; “sẽ bị ô uế” diễn đạt việc người chạm phải đi vào tình trạng ô uế.
theological_decisions:
- issue: Thuật ngữ thanh sạch trong luật Lê-vi
  choice: ô uế
  alternative: không thanh sạch
  rationale: Câu này nói về tình trạng thanh sạch theo nghi lễ, không nhất thiết là sự xấu xa về đạo đức. “Ô uế” là thuật ngữ Kinh Thánh quen thuộc, đồng thời không tự ý biến phạm trù nghi lễ thành phán xét đạo đức.
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại; dùng “anh em” cho đối tượng số nhiều của cộng đồng giao ước, tránh lối “các ngươi” dễ mang sắc thái cổ hoặc miệt thị trong tiếng Việt hiện nay.
