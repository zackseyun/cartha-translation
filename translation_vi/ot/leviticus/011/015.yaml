  text: mọi loài quạ, tùy theo loài của chúng,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “mọi loài quạ lớn, tùy theo loài của chúng.” Từ Hê-bơ-rơ có thể chỉ rộng các loài thuộc họ quạ, dù nghĩa “quạ lớn” thường gặp.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת
  choice: '[không dịch riêng]'
  rationale: Đây là tiểu từ đánh dấu tân ngữ trực tiếp; chức năng của nó được thể hiện qua vị trí của cụm danh từ trong danh sách lớn hơn.
- source_word: כָּל
  choice: mọi
  rationale: Khi đi với danh từ số ít mang nghĩa tập hợp trong danh sách các loài chim bị cấm, từ này diễn đạt tính bao quát một cách tự nhiên.
- source_word: עֹרֵב
  choice: quạ
  rationale: Từ Hê-bơ-rơ thường chỉ quạ lớn (raven), nhưng có thể được dùng rộng hơn cho họ quạ; tiếng Việt thường dùng danh từ chung “quạ” tự nhiên hơn, còn phạm vi nghĩa được nêu trong chú thích.
- source_word: לְמִינוֹ
  choice: loài
  rationale: Cụm từ phân loại theo nghĩa đen là “theo loài của nó”; trong cấu trúc “mọi loài quạ”, tiếng Việt diễn đạt gọn và tự nhiên mà vẫn giữ ý bao gồm các loại thuộc nhóm này.
