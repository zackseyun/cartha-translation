base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: vi
  text: Trong số mọi loài sinh vật lúc nhúc[a], những loài này là ô uế đối với các ngươi. Bất cứ ai chạm vào chúng khi chúng đã chết[b] sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong tất cả các sinh vật lúc nhúc.” Từ Hê-bơ-rơ chỉ chung những sinh vật nhỏ bò, trườn hoặc tụ thành đàn.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong sự chết của chúng”; nghĩa là chạm vào chúng trong tình trạng đã chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַטְּמֵאִים לָכֶם
  choice: những con này là ô uế đối với các ngươi
  rationale: Giữ cấu trúc chỉ định và tư cách ô uế theo nghi lễ; “đối với các ngươi” phản ánh לָכֶם và mối liên hệ với cộng đồng đang nhận luật.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: trong tất cả các loài vật nhỏ lúc nhúc
  rationale: שֶׁרֶץ là một phạm trù rộng chỉ các sinh vật nhỏ bò, trườn hoặc tụ thành đàn; cách dịch này tự nhiên trong tiếng Việt mà không giới hạn vào một nhóm động vật học cụ thể.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Bất cứ ai chạm vào chúng
  rationale: Diễn đạt rõ ý khái quát, phân phối của כָּל kết hợp với phân từ.
- source_word: בְּמֹתָם
  choice: khi chúng đã chết
  rationale: Chỉ tình trạng đã chết của các con vật khi có sự tiếp xúc, thay vì chỉ khoảnh khắc chúng chết.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: đều sẽ bị ô uế cho đến chiều tối
  rationale: Thể hiện kết quả là người chạm phải mang tình trạng ô uế theo nghi lễ trong một thời hạn xác định.
theological_decisions:
- issue: Tính chất của sự ô uế
  choice: Dùng “ô uế” theo ngữ cảnh luật thanh sạch nghi lễ
  alternative: “không sạch” hoặc hiểu như sự nhơ bẩn đạo đức
  rationale: Đoạn văn quy định tình trạng nghi lễ phát sinh do tiếp xúc với xác động vật, không trực tiếp đưa ra phán xét đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ sắc thái lời luật phán trực tiếp với cộng đồng số nhiều; dùng “ô uế” nhất quán với ngữ cảnh thanh sạch nghi lễ trong Lê-vi Ký.
