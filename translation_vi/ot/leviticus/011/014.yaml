  text: וְ/אֶת הַ֨/דָּאָ֔ה וְ/אֶת הָ/אַיָּ֖ה לְ/מִינָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/014.yaml
  text: the kite[a], and the falcon according to its kind,
translation:
  language: vi
  text: diều hâu[a], và chim cắt theo loài của nó;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chính xác các loài chim này; cũng có thể dịch tên thứ nhất là “kền kền” và tên thứ hai là “diều hâu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּאָה
  choice: diều hâu
  rationale: Tên loài chim này không chắc chắn; “diều hâu” là cách gọi hiện đại, dễ hiểu cho một loài chim săn mồi và phù hợp với một cách nhận diện phổ biến của từ Hê-bơ-rơ.
- source_word: הָאַיָּה
  choice: chim cắt
  rationale: Từ này chỉ một loài chim săn mồi, có thể được nhận diện là chim cắt hoặc diều hâu. Chọn “chim cắt” để biểu thị hai tên chim Hê-bơ-rơ khác nhau mà không vượt quá phạm vi nghĩa có thể có.
- source_word: לְמִינָהּ
  choice: theo loài của nó
  rationale: Cách dịch sát và tự nhiên, giữ ý phân loại của cụm từ Hê-bơ-rơ.
- source_word: וְאֶת ... וְאֶת
  choice: … và …
  rationale: Không dịch riêng dấu chỉ tân ngữ אֵת; liên từ được thể hiện tự nhiên bằng “và” trong danh sách đang tiếp diễn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc của một mục trong danh sách; dấu chấm phẩy cho thấy câu còn tiếp nối theo ngữ cảnh. Sự bất định về việc nhận diện các loài chim được giữ trong chú thích.
