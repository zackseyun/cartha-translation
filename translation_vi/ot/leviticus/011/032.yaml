source:
  edition: WLC
  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: vi
  text: Bất cứ đồ dùng bằng gỗ, y phục, da hay vải thô—tức bất cứ vật dụng nào dùng để làm việc—mà xác của bất cứ con nào trong số chúng rơi trúng đều sẽ trở nên ô uế. Vật ấy phải được đưa vào nước[a] và sẽ ô uế cho đến chiều tối; rồi sẽ thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải được nhúng vào nước.” Tiếng Hê-bơ-rơ theo sát nghĩa là “phải được đưa vào nước.”'
    reason: Giữ cách diễn đạt sát nguyên văn và cho biết cách hiểu thường gặp trong nghi thức tẩy sạch.
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: Mọi vật mà xác của bất cứ con nào trong số chúng rơi trúng
  rationale: Diễn đạt tự nhiên quan hệ tiếp xúc gây ô uế; thêm “xác” làm rõ בְּמֹתָם chỉ tình trạng chúng đã chết, chứ không phải hành động rơi đúng vào lúc chết.
- source_word: יִטְמָא
  choice: sẽ trở nên ô uế
  rationale: Giữ sắc thái chuyển sang tình trạng ô uế theo luật nghi lễ.
- source_word: מִכָּל כְּלִי עֵץ אוֹ בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: bất cứ đồ dùng nào bằng gỗ, y phục, da hoặc vải thô
  rationale: כְּלִי có nghĩa rộng là đồ dùng hay vật dụng; שָׂק ở đây là chất liệu vải dệt thô, nên “vải thô” rõ nghĩa hơn “bao” trong danh sách vật liệu.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: tức mọi vật dụng được dùng để làm việc
  rationale: Hiểu mệnh đề này là phần khái quát các đồ vật làm từ những chất liệu vừa nêu; “tức” giúp thể hiện quan hệ đồng vị mà không thu hẹp loại công việc.
- source_word: בַּמַּיִם יוּבָא
  choice: phải được cho vào nước
  rationale: Sát nghĩa hành động khiến vật đi vào nước, đồng thời tự nhiên trong tiếng Việt; không khẳng định quá mức rằng nhất thiết phải ngâm chìm hoàn toàn.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: sẽ bị ô uế cho đến chiều tối; sau đó nó sẽ được thanh sạch
  rationale: 'Giữ trình tự luật định: tình trạng ô uế kéo dài đến chiều tối rồi chấm dứt. “Thanh sạch” đối ứng rõ với “ô uế” trong ngữ cảnh nghi lễ.'
theological_decisions:
- issue: Bản chất của טמא và טהר
  choice: ô uế / thanh sạch theo địa vị nghi lễ
  alternative: dơ bẩn / sạch sẽ theo nghĩa vệ sinh, hoặc phạm tội / được tha tội theo nghĩa đạo đức
  rationale: Ngữ cảnh là luật thanh sạch nghi lễ. Cặp từ này không tự thân quy kết tội lỗi đạo đức hay chỉ nói đến vệ sinh vật lý.
- issue: Mức độ ngập nước trong בַּמַּיִם יוּבָא
  choice: được cho vào nước
  alternative: được nhúng chìm trong nước
  rationale: Động từ Hoph'al của בוא theo nghĩa đen là “được đưa vào”; bản văn không xác định rõ mức độ ngập, nên bản dịch chính giữ sự rộng nghĩa và nêu cách hiểu mạnh hơn trong chú thích.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “vật dụng/đồ dùng” thay cho từ cổ hoặc quá chuyên biệt; “ô uế/thanh sạch” duy trì thuật ngữ nhất quán của luật nghi lễ. Dấu hai chấm và gạch ngang làm rõ danh sách cùng phần khái quát đồng vị.
