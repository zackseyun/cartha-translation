revisions:
- from: 'Mọi vật mà xác của bất cứ con nào trong số chúng rơi trúng đều sẽ trở nên ô uế: bất cứ đồ dùng nào bằng gỗ, y phục, da hoặc vải thô—tức mọi vật dụng được dùng để làm việc. Vật ấy phải được cho vào nước[a] và sẽ bị ô uế cho đến chiều tối; sau đó nó sẽ được thanh sạch.'
  to: Bất cứ đồ dùng bằng gỗ, y phục, da hay vải thô—tức bất cứ vật dụng nào dùng để làm việc—mà xác của bất cứ con nào trong số chúng rơi trúng đều sẽ trở nên ô uế. Vật ấy phải được đưa vào nước[a] và sẽ ô uế cho đến chiều tối; rồi sẽ thanh sạch.
  rationale: Bản sửa làm rõ rằng mọi đồ vật thuộc các loại được liệt kê, nếu bị xác của một trong các loài ấy rơi trúng, đều trở nên ô uế. Nó giữ nguyên phạm vi, trình tự và tính không xác định về mức độ ngập nước của nguyên văn, đồng thời dùng cú pháp tiếng Việt hiện đại tự nhiên hơn.
