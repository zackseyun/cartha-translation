base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: vi
  text: Trong các loài thú trên cạn, bất cứ con nào có móng chẻ, tức móng tách hẳn làm hai[a], và nhai lại[b] thì các ngươi được phép ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng hai cách diễn đạt cùng gốc từ, theo nghĩa sát là “chẻ móng” và “tách hẳn một chỗ tách của các móng,” để nhấn mạnh rằng móng phải thực sự được chẻ làm hai.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn theo nghĩa sát là “đưa thức ăn lên lại”; đây là cách nói về việc nhai lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: bất cứ con nào
  rationale: Dùng theo nghĩa phân phối để chỉ mọi con vật hội đủ các đặc điểm được nêu; cách diễn đạt này tự nhiên trong quy định cho phép.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: có móng chẻ
  rationale: Diễn đạt tự nhiên đặc điểm móng bị chẻ, đồng thời giữ hình ảnh cụ thể của nguyên văn.
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: móng tách hẳn làm hai
  rationale: 'Cụm Hê-bơ-rơ liên hệ và làm rõ điều kiện trước đó: móng phải thực sự phân đôi. ''Tách hẳn làm hai'' truyền đạt sự nhấn mạnh mà không quá nặng lối dịch sát chữ.'
- source_word: מַעֲלַת גֵּרָה
  choice: nhai lại
  rationale: Thành ngữ nguyên văn là 'đưa thức ăn đã nhai lên'; 'nhai lại' là cách gọi thông dụng, chính xác và dễ hiểu trong tiếng Việt.
- source_word: בַּבְּהֵמָה
  choice: trong các loài thú trên cạn
  rationale: בְּהֵמָה trong ngữ cảnh phân loại thức ăn chỉ nhóm thú sống trên cạn, không chỉ riêng gia súc; thêm 'trên cạn' giúp phân biệt với các nhóm sinh vật ở những câu sau.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: thì các con được phép ăn
  rationale: Trong luật về thức ăn, thể chưa hoàn thành diễn đạt sự cho phép hơn là mệnh lệnh buộc phải ăn; đại từ số nhiều được chuyển thành 'các con' theo đối tượng nghe trong ngữ cảnh.
theological_decisions: []
