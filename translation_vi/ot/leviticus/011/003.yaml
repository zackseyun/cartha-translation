  rationale: Bản sửa loại bỏ sắc thái gia tộc không có trong đại từ ngôi thứ hai số nhiều của nguyên văn, đồng thời làm rõ quan hệ giải thích giữa hai mô tả về móng. Các chú thích được chỉnh để phản ánh sát hơn các thành ngữ Hê-bơ-rơ mà vẫn giữ cách dịch chính văn tự nhiên.
