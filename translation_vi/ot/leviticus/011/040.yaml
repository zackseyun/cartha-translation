  source_fidelity: Bản nháp phản ánh đúng cấu trúc song hành và hệ quả thanh sạch của tiếng Hê-bơ-rơ. Tuy nhiên, việc thêm “thịt” trong “ăn thịt từ xác nó” thu hẹp נִבְלָה (xác con vật) thành phần thịt, không có trong nguyên ngữ. Cần diễn đạt trực tiếp sắc thái phân phần của מִן mà không thêm đối tượng.
  naturalness: Văn phong luật lệ nhìn chung tự nhiên, hiện đại và trang trọng. “Ai … phải giặt quần áo mình” giữ được tính khái quát và song hành. “Ăn bất cứ phần nào của xác nó” tự nhiên, rõ nghĩa hơn “ăn thịt từ xác nó”.
  terminology: “Xác” phù hợp với xác con vật trong ngữ cảnh Lê-vi; “ô uế” là thuật ngữ thích hợp và không đưa diễn giải “nghi lễ” vào chính văn. Chú thích văn hóa vẫn cần thiết. Các ký hiệu chú thích nên đặt ngay sau đơn vị được chú giải, thay vì cùng đặt ở cuối mệnh đề.
