language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: vi
  text: Ai ăn bất cứ phần nào của xác nó[a] phải giặt quần áo mình và sẽ bị ô uế[b] cho đến chiều tối; ai mang xác nó phải giặt quần áo mình và sẽ bị ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ăn từ xác nó” hoặc “ăn một phần xác nó”; cách diễn đạt Hê-bơ-rơ mang nghĩa phân phần.
    reason: lexical_alternative
  - marker: b
    text: Tức là ô uế theo luật thanh sạch nghi lễ của Israel.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: ai ăn
  rationale: Phân từ có mạo từ được dùng như danh từ chỉ bất cứ người nào thực hiện hành động; “ai ăn” tự nhiên trong điều luật tiếng Việt và vẫn giữ nghĩa khái quát.
- source_word: מִנִּבְלָתָהּ
  choice: ăn thịt từ xác nó
  rationale: 'מִן mang nghĩa phân phần: ăn từ, tức một phần của xác con vật. Thêm “thịt” để câu tiếng Việt tự nhiên, còn chú thích bảo lưu cách diễn đạt sát chữ và tính phân phần.'
- source_word: נִבְלָתָהּ
  choice: xác nó
  rationale: Trong luật thanh sạch về động vật, נְבֵלָה chỉ xác con vật đã chết; “xác” chính xác và tự nhiên hơn “thi thể” vốn thường dùng cho người.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: phải giặt quần áo mình
  rationale: Thể vị hoàn thành trong văn luật mang lực mệnh lệnh; “phải” diễn đạt rõ tính bắt buộc. “Mình” quy chiếu về chủ thể số ít mà không làm câu tiếng Việt nặng nề.
- source_word: וְטָמֵא
  choice: và sẽ bị ô uế
  rationale: Cụm từ nêu tình trạng ô uế phát sinh và kéo dài; “sẽ bị ô uế” tự nhiên trong tiếng Việt, không thêm từ “nghi lễ” vào chính văn.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Diễn đạt công thức thời hạn của luật Lê-vi bằng tiếng Việt hiện đại, trang trọng và rõ ràng.
- source_word: הַנֹּשֵׂא
  choice: ai mang
  rationale: Phân từ có mạo từ mang nghĩa khái quát; “ai mang” song song tự nhiên với “ai ăn”.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: Dịch טָמֵא là “ô uế” và giải thích ý nghĩa theo luật thanh sạch trong chú thích.
  alternative: “ô uế về nghi lễ” ngay trong chính văn
  rationale: Ngữ cảnh xác định đây là tình trạng theo luật thanh sạch của Israel, nhưng tiếng Hê-bơ-rơ chỉ nói “ô uế”; không nên đưa phần giải nghĩa vào chính văn.
- issue: Giới tính trong công thức luật số ít
  choice: Dùng “ai … quần áo mình”, giữ chủ thể đại diện ở số ít mà không đánh dấu giới tính không có trong cách diễn đạt tự nhiên của tiếng Việt.
  alternative: “người ấy … quần áo của người ấy” hoặc đại từ giống đực
  rationale: Các dạng giống đực số ít trong tiếng Hê-bơ-rơ có chức năng đại diện. Tiếng Việt không buộc phải biểu thị giống ở đây; “mình” bảo toàn số ít và quan hệ quy chiếu.
translation_notes:
  register: 'Văn phong luật lệ trang trọng nhưng hiện đại. Hai vế được giữ song song. Thứ tự dấu chú thích [b][a] theo bản tư vấn tiếng Anh: chú thích [b] giải thích “ô uế”, còn [a] ghi nhận sắc thái phân phần của מִן.'
