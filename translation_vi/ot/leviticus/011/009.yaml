revisions:
- from: 'Trong tất cả những loài sống dưới nước, các ngươi được ăn những loài sau đây: bất cứ loài nào sống dưới nước, dù ở biển hay sông suối,[a] có vây và vảy thì các ngươi được ăn.'
  to: 'Trong tất cả những loài sống dưới nước, các ngươi được ăn những loài sau đây: bất cứ loài nào sống dưới nước, ở biển và sông suối,[a] có vây và vảy thì các ngươi được ăn.'
  rationale: Chỉ sửa liên từ địa điểm từ «hay» thành «và» để theo sát phép liệt kê của nguyên văn. Chú thích được chỉnh nhẹ để nêu nghĩa «wadi» chính xác và tự nhiên hơn. Các lựa chọn còn lại giữ nguyên vì truyền đạt đầy đủ ý cho phép, điều kiện phân loại, và sự nhấn mạnh ở phần kết.
  reviewer_model: gpt-5.6-terra
