  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֣ל אֲשֶׁר ל/וֹ֩ סְנַפִּ֨יר וְ/קַשְׂקֶ֜שֶׂת בַּ/מַּ֗יִם בַּ/יַּמִּ֛ים וּ/בַ/נְּחָלִ֖ים אֹתָ֥/ם תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: vi
  text: 'Trong tất cả những loài sống dưới nước, các ngươi được ăn những loài sau đây: bất cứ loài nào sống dưới nước, ở biển và sông suối,[a] có vây và vảy thì các ngươi được ăn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ נְחָלִים có thể chỉ sông, suối, dòng nước, hoặc lòng khe/lòng sông cạn theo mùa (wadi), tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת זֶה
  choice: những loài sau đây
  rationale: Đại từ chỉ định số ít trong tiếng Hê-bơ-rơ mở đầu một quy định phân loại; diễn đạt bằng số nhiều trong tiếng Việt giúp câu tự nhiên và hướng đến các loài được phép ăn.
- source_word: תֹּאכְלוּ
  choice: các ngươi được ăn
  rationale: Thể vị hoàn thành chưa trọn 2 số nhiều trong văn luật pháp mang ý nghĩa cho phép; “được ăn” truyền đạt rõ địa vị được phép thay vì một mệnh lệnh buộc phải ăn.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: trong tất cả những loài sống dưới nước
  rationale: Giữ ý phân xuất của מִן trong phạm vi mọi sinh vật ở dưới nước, đồng thời dùng cách nói tiếng Việt tự nhiên.
- source_word: כֹּל אֲשֶׁר לוֹ
  choice: bất cứ loài nào ... có
  rationale: Thể hiện sức phân phối của כֹּל אֲשֶׁר và cấu trúc sở hữu לוֹ bằng một mệnh đề tiếng Việt rõ ràng.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: vây và vảy
  rationale: Hai danh từ số ít mang nghĩa loại trong tiếng Hê-bơ-rơ được dịch bằng các danh từ khối tự nhiên trong tiếng Việt.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: ở biển hay sông suối
  rationale: יַמִּים chỉ biển; נְחָלִים có thể chỉ suối, dòng sông hoặc lòng khe có nước. “Sông suối” là cách gọi bao quát, dễ hiểu đối với các thủy vực nội địa.
- source_word: אֹתָם תֹּאכֵלוּ
  choice: thì các ngươi được ăn
  rationale: Mệnh đề cuối nhắc lại và nhấn mạnh rằng những loài đáp ứng cả hai đặc điểm đều được phép ăn.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “các ngươi” để biểu thị ngôi thứ hai số nhiều của bản Hê-bơ-rơ; câu được sắp xếp lại vừa phải cho tự nhiên trong tiếng Việt, đồng thời giữ phần mở đầu và phần kết lặp lại để bảo toàn sắc thái nhấn mạnh.
