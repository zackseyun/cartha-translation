  - severity: low
    issue: “hay” làm quan hệ giữa lò và bếp có vẻ loại trừ.
    rationale: Văn bản Hê-bơ-rơ liệt kê “lò và bếp/kiềng bếp”; dùng “và” phản ánh danh sách này trực tiếp hơn.
