  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: vi
  text: Bất cứ vật nào mà một phần xác của chúng rơi lên thì sẽ trở nên ô uế.[a] Lò nướng và bếp đun[b] phải bị đập phá; chúng là ô uế và sẽ là ô uế đối với các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ô uế” ở đây nói về tình trạng không thanh sạch theo nghi lễ, không phải sự gian ác về đạo đức. “Xác của chúng” chỉ xác của những con vật ô uế.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ chỉ một cấu trúc dùng để nấu, có thể là bếp, giá đặt nồi hoặc một dạng lò xây.
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: xác chết của chúng
  rationale: נְבֵלָה chỉ xác của con vật đã chết, đặc biệt trong ngữ cảnh luật thanh sạch. Cách dịch này tự nhiên trong tiếng Việt và không mở rộng thành thi thể người.
- source_word: יִפֹּל ... עָלָיו
  choice: bị ... rơi trúng
  rationale: Dạng vị hoàn thành diễn tả trường hợp tổng quát trong luật. Cấu trúc tiếng Việt này diễn đạt tự nhiên việc một phần xác chết rơi lên vật nào đó.
- source_word: יִטְמָא
  choice: sẽ trở nên ô uế
  rationale: Diễn đạt trạng thái ô uế phát sinh do tiếp xúc, đồng thời giữ thuật ngữ chủ chốt của luật thanh sạch.
- source_word: תַּנּוּר
  choice: lò nướng
  rationale: Từ này chỉ lò dùng để nướng, nhất là nướng bánh; đây là tương đương hiện đại rõ ràng.
- source_word: כִירַיִם
  choice: bếp đun
  rationale: Từ này chỉ một thiết bị hoặc cấu trúc dùng để nấu, có thể là bếp, giá đặt nồi hoặc dạng lò sưởi; “bếp đun” dễ hiểu mà không xác định quá mức cấu tạo cổ đại.
- source_word: יֻתָּץ
  choice: đều phải bị phá bỏ
  rationale: Thể bị động nêu nghĩa vụ phá hủy các cấu trúc nấu ăn đã nhiễm ô uế. “Phá bỏ” phù hợp với lò hoặc bếp xây bằng vật liệu có thể đập vỡ.
- source_word: טְמֵאִים הֵם
  choice: chúng là ô uế
  rationale: Giữ thuật ngữ nhất quán và không khiến người đọc hiểu đây là sự gian ác về đạo đức.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: sẽ là ô uế đối với các ngươi
  rationale: 'Giữ sắc thái quan hệ của לָכֶם: dân Israel phải xem các vật ấy là ô uế, mà không thêm ý “tiếp tục” vốn không được nói rõ.'
theological_decisions:
- issue: Bản chất của sự ô uế trong luật Lê-vi
  choice: Dùng “ô uế” trong chính văn.
  alternative: “ô uế về nghi lễ” hoặc “không thanh sạch về nghi lễ”
  rationale: Ngữ cảnh nói về tình trạng nghi lễ chứ không phải điều ác về đạo đức. “Ô uế” duy trì thuật ngữ Kinh Thánh quen thuộc và tính nhất quán, còn chú thích làm rõ phạm vi nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ lời phán trực tiếp số nhiều trong bối cảnh luật giao ước. Câu đầu dùng “một phần xác chết” vì ngữ cảnh nói đến phần xác có thể rơi trúng đồ vật, dù từ Hê-bơ-rơ tự nó có thể chỉ chung xác chết hoặc các xác chết.
