base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: vi
  text: Các ngươi sẽ trở nên ô uế vì những loài này:[a] ai chạm vào xác chúng[b] sẽ ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Còn về những loài này, các ngươi sẽ trở nên ô uế.” Cụm mở đầu có thể giới thiệu khái quát nhóm được nói đến sau đây, thay vì chỉ rõ nguyên nhân hay phương tiện gây ô uế.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng danh từ số ít “xác” với hậu tố sở hữu số nhiều; cũng có thể dịch là “xác của chúng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: Vì những loài này
  rationale: ו kết hợp với לְ và đại từ chỉ định có thể nêu nguyên nhân/phương tiện gây ô uế hoặc mở sang phạm vi đang được nói đến. Trong mạch luật về xác động vật, cách dịch này tự nhiên và giữ được nghĩa các loài ấy là căn nguyên của tình trạng ô uế; chú thích bảo lưu cách hiểu khái quát hơn.
- source_word: תִּטַּמָּאוּ
  choice: các ngươi sẽ bị ô uế
  rationale: Động từ טמא ở ngôi hai số nhiều diễn tả việc rơi vào tình trạng ô uế theo nghi lễ, không hàm ý tội lỗi đạo đức. Dạng “bị ô uế” phù hợp vì nguyên nhân nằm ở sự tiếp xúc được nói đến.
- source_word: כָּל הַנֹּגֵעַ
  choice: bất cứ ai chạm vào
  rationale: Phân từ số ít đi sau כָּל mang nghĩa khái quát. “Bất cứ ai” vừa tự nhiên trong tiếng Việt hiện đại vừa giữ phạm vi phổ quát.
- source_word: בְּנִבְלָתָם
  choice: xác của chúng
  rationale: נְבֵלָה chỉ xác động vật chết. Tiếng Hê-bơ-rơ dùng danh từ số ít với hậu tố sở hữu số nhiều; “xác của chúng” giữ nguyên nét hình thái này và vẫn tự nhiên trong tiếng Việt.
- source_word: יִטְמָא
  choice: sẽ bị ô uế
  rationale: Động từ số ít tương ứng với chủ thể khái quát “bất cứ ai”. Cách dịch này nhất quán với thuật ngữ về tình trạng ô uế theo nghi lễ.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Cụm từ xác định thời hạn kéo dài của tình trạng ô uế. “Cho đến chiều tối” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Bản chất của ngôn ngữ ô uế trong luật về sự thánh sạch
  choice: Dịch טמא là “bị ô uế”, chỉ tình trạng ô uế theo nghi lễ
  alternative: “bị nhơ bẩn” hoặc cách diễn đạt gợi tội lỗi đạo đức
  rationale: Câu này nói về tình trạng phát sinh do chạm vào xác động vật. “Ô uế” bảo tồn phạm trù nghi lễ của bản văn mà không đồng nhất nó với sự phạm tội về đạo đức.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “các ngươi” để biểu thị ngôi hai số nhiều của lời phán cho cộng đồng; dùng “ô uế” theo nghĩa nghi lễ. Các dấu chú thích [a], [b] đều được đặt ngay trong chính văn.
