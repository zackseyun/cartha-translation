base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: vi
  text: Nhưng mọi loài côn trùng có cánh mà có bốn chân đều là vật đáng ghê tởm đối với các ngươi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi sinh vật lúc nhúc biết bay.” Cụm từ Hê-bơ-rơ chỉ chung các sinh vật nhỏ bay hoặc lúc nhúc, đặc biệt là côn trùng.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “có bốn chân.”'
    reason: formal_correspondence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Nhưng mọi
  rationale: וְ có thể là “và”, nhưng ở đây sắc thái tương phản với ngoại lệ trong câu trước phù hợp hơn; כֹל mang nghĩa bao quát “mọi”.
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: loài côn trùng có cánh
  rationale: Cụm Hê-bơ-rơ chỉ rộng các sinh vật nhỏ bay thành đàn hoặc lúc nhúc, đặc biệt là côn trùng. Cách dịch này tự nhiên, dễ hiểu trong tiếng Việt hiện đại; chú thích giữ nghĩa rộng hơn của nguyên ngữ.
- source_word: אֲשֶׁר ל/וֹ
  choice: đi bằng
  rationale: Nguyên văn là “có”, nhưng khi nói về chân của sinh vật, “đi bằng bốn chân” tự nhiên trong tiếng Việt và phù hợp chức năng được mô tả trong ngữ cảnh.
- source_word: אַרְבַּע רַגְלָיִם
  choice: bốn chân
  rationale: רַגְלַיִם có thể chỉ chân hoặc bàn chân; “bốn chân” là cách nói tự nhiên đối với sinh vật trong tiếng Việt, đồng thời giữ nguyên con số của bản Hê-bơ-rơ.
- source_word: שֶׁקֶץ
  choice: vật đáng ghê tởm
  rationale: Trong luật về thức ăn, từ này diễn tả điều bị xem là ghê tởm và bị cấm; cách dịch tránh đồng nhất nó một cách không cần thiết với thuật ngữ “ô uế”.
- source_word: הוּא לָ/כֶם
  choice: đều là vật đáng ghê tởm đối với các ngươi
  rationale: Bổ sung hệ từ theo cú pháp tiếng Việt và giữ cụm “đối với các ngươi”, phản ánh đối tượng giao ước được luật này trực tiếp nhắm đến.
theological_decisions:
- issue: Quan hệ giữa “đáng ghê tởm” và “ô uế” trong luật ăn uống
  choice: Giữ “đáng ghê tởm”
  alternative: Dịch là “ô uế”
  rationale: שֶׁקֶץ nhấn mạnh tính ghê tởm và bị cấm; dịch thành “ô uế” sẽ làm mờ sự phân biệt từ vựng với các thuật ngữ Hê-bơ-rơ chuyên chỉ sự ô uế.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “các ngươi” để giữ lời phán trực tiếp số nhiều trong bối cảnh giao ước; “côn trùng có cánh” bảo đảm tính dễ hiểu, còn chú thích bảo tồn phạm vi rộng và hình ảnh của nguyên ngữ.
