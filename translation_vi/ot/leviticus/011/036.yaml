  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: vi
  text: Tuy nhiên, một nguồn nước hay một bể, là nơi nước tụ lại, vẫn thanh sạch; còn ai chạm vào xác chúng sẽ bị ô uế.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Đánh dấu ngoại lệ đối với quy định gây ô uế ngay trước đó; cách diễn đạt này tự nhiên và không mang sắc thái hạn định quá mạnh.
- source_word: מַעְיָן
  choice: mạch nước
  rationale: Chỉ nguồn nước tự nhiên; “mạch nước” là cách gọi rõ ràng, thông dụng trong tiếng Việt hiện đại.
- source_word: בּוֹר
  choice: bể chứa nước
  rationale: Trong ngữ cảnh này, từ này chỉ một hố hoặc công trình dùng để trữ nước; “bể chứa nước” tránh khiến người đọc hiểu là giếng có mạch nước.
- source_word: מִקְוֵה מַיִם
  choice: bể chứa nước
  rationale: Cụm từ diễn tả nơi nước tụ lại. Tiếng Việt có thể diễn đạt tự nhiên bằng cách gắn ý chứa nước với בּוֹר, thay vì lặp một cụm đồng vị gượng ép.
- source_word: יִהְיֶה טָהוֹר
  choice: vẫn thanh sạch
  rationale: Trong mạch văn, nguồn hoặc nơi chứa nước không trở nên ô uế do xác chết nói ở câu trước; “vẫn” diễn đạt sự tiếp tục được ngầm hiểu.
- source_word: נֹגֵעַ
  choice: ai chạm vào
  rationale: Phân từ được dùng như danh từ với nghĩa khái quát; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: נִבְלָתָם
  choice: xác chúng
  rationale: נְבֵלָה chỉ xác động vật, còn hậu tố số nhiều giống đực quy chiếu về các loài vật đã nói trước đó.
- source_word: יִטְמָא
  choice: sẽ bị ô uế
  rationale: Giữ thuật ngữ nghi lễ quen thuộc và diễn tả trạng thái phát sinh do sự tiếp xúc.
theological_decisions:
- issue: Thuật ngữ về tình trạng thanh sạch theo nghi lễ
  choice: thanh sạch / bị ô uế
  alternative: tinh sạch / không tinh sạch
  rationale: “Thanh sạch / ô uế” giữ rõ phạm vi nghi lễ của Lê-vi Ký, đồng thời tránh biến quy định này thành một phán xét đạo đức.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “mạch nước” và “bể chứa nước” để truyền đạt tự nhiên hai loại nguồn/nơi nước tụ lại; dấu chấm phẩy giữ rõ thế tương phản giữa vật chứa vẫn thanh sạch và người chạm xác bị ô uế.
