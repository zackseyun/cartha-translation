revisions:
- from: Tuy nhiên, một mạch nước hay một bể chứa nước vẫn thanh sạch; nhưng ai chạm vào xác chúng thì sẽ bị ô uế.
  to: Tuy nhiên, một nguồn nước hay một bể, là nơi nước tụ lại, vẫn thanh sạch; còn ai chạm vào xác chúng sẽ bị ô uế.
  rationale: Đổi “mạch nước” thành “nguồn nước” để phản ánh chính xác hơn nguồn nước tự nhiên. Bổ sung phần đồng vị “là nơi nước tụ lại” để bảo toàn nội dung của מִקְוֵה מַיִם, đồng thời giữ cách hiểu linh hoạt về quan hệ của cụm này với “nguồn nước” và “bể.” Giữ “vẫn thanh sạch” vì câu này nêu ngoại lệ đối với sự ô uế vừa được đề cập trong mạch văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:46:01Z'
review_pass:
