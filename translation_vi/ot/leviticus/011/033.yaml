  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: đồ chứa bằng gốm/đất nung, một trong các sinh vật đã nói đến rơi vào bên trong, mọi vật chứa trong đó trở nên ô uế, và đồ chứa phải bị đập vỡ. Tuy nhiên, cấu trúc “Mọi đồ đựng ... mà ... rơi vào thì” hơi gượng; đặt điều kiện lên trước sẽ phản ánh rõ và tự nhiên hơn quan hệ điều kiện–hệ quả của câu.'
