  terminology: “Đất nung” và “ô uế” phù hợp với כְּלִי חֶרֶשׂ và טמא trong ngữ cảnh luật thanh sạch. Chú thích hiện có phương án “đồ bằng đất”, nhưng cách nói này không nhất thiết chỉ một đồ chứa bằng vật liệu đã nung; nên sửa thành các lựa chọn giữ rõ nghĩa đồ chứa/gốm.
  issues:
