  - severity: low
    issue: Chú thích thay thế “đồ bằng đất” quá rộng.
    rationale: כְּלִי חֶרֶשׂ chỉ một vật/đồ chứa bằng gốm hoặc đất nung; “đồ bằng đất” có thể không phải đồ chứa và không gợi vật liệu nung.
