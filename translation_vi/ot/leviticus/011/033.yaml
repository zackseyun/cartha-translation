  to: Bất cứ đồ đựng bằng đất nung[a] nào mà một con trong số chúng rơi vào thì mọi thứ ở trong đó sẽ trở nên ô uế; phải đập vỡ nó.
  rationale: Bản sửa làm mạch điều kiện–hệ quả tự nhiên hơn trong tiếng Việt, vẫn giữ tính bao quát của “mọi/bất cứ”, quy chiếu số nhiều của “chúng” về các sinh vật trong văn mạch, và duy trì thuật ngữ nghi lễ “ô uế”. Chú thích được thu hẹp để các phương án thay thế vẫn nêu rõ đồ chứa bằng gốm/đất nung.
