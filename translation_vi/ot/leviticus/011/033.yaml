base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: vi
  text: Bất cứ đồ đựng bằng đất nung[a] nào mà một con trong số chúng rơi vào thì mọi thứ ở trong đó sẽ trở nên ô uế; phải đập vỡ nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đồ chứa bằng gốm”, “đồ chứa bằng đất sét nung” hoặc “vật gốm”. Tiếng Hê-bơ-rơ chỉ cụ thể một đồ chứa làm bằng đất sét nung.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: đồ đựng bằng đất nung
  rationale: כְּלִי chỉ một vật dụng hay đồ chứa, còn חֶרֶשׂ xác định chất liệu là đất sét đã nung. Cách dịch này tự nhiên trong tiếng Việt và giữ được ý nghĩa vật liệu cụ thể trong luật thanh sạch.
- source_word: יִפֹּל מֵהֶם
  choice: một con nào trong số chúng rơi vào
  rationale: 'Đại từ số nhiều chỉ về các sinh vật đã được nhắc đến trong văn cảnh. Thêm danh từ loại “con” làm rõ đối tượng trong tiếng Việt, còn “nào” giữ ý nghĩa bất định: chỉ cần một con trong số ấy rơi vào.'
- source_word: אֶל תּוֹכוֹ
  choice: rơi vào
  rationale: תּוֹךְ nói đến phần bên trong. Trong tiếng Việt, “rơi vào” cùng danh từ đồ đựng đã diễn đạt tự nhiên việc đi vào bên trong mà không cần dịch cứng là “vào trong lòng nó”.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: mọi thứ ở trong đó
  rationale: “Mọi thứ” bảo toàn phạm vi bao quát của כֹּל, còn “ở trong đó” chỉ rõ toàn bộ những gì nằm bên trong đồ đựng.
- source_word: יִטְמָא
  choice: sẽ trở nên ô uế
  rationale: Trong ngữ cảnh luật thanh sạch Lê-vi, “ô uế” diễn đạt tình trạng nghi lễ, không mặc nhiên đồng nhất với tội lỗi hay sự bẩn thỉu thông thường. “Trở nên” thể hiện tình trạng phát sinh do sự tiếp xúc được mô tả.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: anh em phải đập vỡ đồ ấy
  rationale: “Phải” truyền đạt hiệu lực mệnh lệnh của động từ; “đập vỡ” diễn tả hành động phá hủy đồ đất nung rõ hơn “làm vỡ”. Lặp lại “đồ ấy” thay cho đại từ đơn thuần giúp xác định rõ vật phải bị phá vỡ.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh em” thể hiện ngôi thứ hai số nhiều của nguyên văn mà tránh sắc thái xa cách, cổ kính của “các ngươi”. Dấu chấm phẩy phân tách hậu quả về tình trạng ô uế với mệnh lệnh phải phá vỡ đồ đựng.
