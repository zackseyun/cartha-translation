source:
  edition: WLC
  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: vi
  text: Mọi loài vật nhỏ bò lúc nhúc trên mặt đất đều là vật ghê tởm[a]; không được ăn chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vật đáng ghê tởm”. Ở đây, từ Hê-bơ-rơ chỉ loài vật bị xem là ghê tởm và không được dùng làm thức ăn theo luật nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Mọi
  rationale: כָּל mang nghĩa bao quát. Trong tiếng Việt, không cần dịch riêng וְ ở đầu câu vì mối liên kết với các luật trước vẫn rõ và câu tự nhiên hơn.
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: loài vật nhỏ bò lúc nhúc
  rationale: שֶׁרֶץ chỉ rộng các sinh vật nhỏ di chuyển sát mặt đất hoặc tụ thành đàn; cụm 'bò lúc nhúc' diễn đạt tự nhiên đặc tính chuyển động và phần nào giữ được sắc thái nhấn mạnh của việc lặp cùng một gốc từ.
- source_word: עַל הָ/אָ֑רֶץ
  choice: trên mặt đất
  rationale: Trong ngữ cảnh phân loại sinh vật, אָרֶץ nói đến phạm vi mặt đất, đối lập với nước và không trung; 'trên mặt đất' chính xác và tự nhiên hơn 'trên trái đất'.
- source_word: שֶׁ֥קֶץ
  choice: vật ghê tởm
  rationale: שֶׁקֶץ ở đây chỉ thứ bị xem là đáng ghê tởm trong khuôn khổ luật ăn uống, không nhất thiết là một phán xét đạo đức phổ quát.
- source_word: ה֖וּא
  choice: đều là
  rationale: Đại từ độc lập làm nổi bật lời xác định; 'đều là' vừa nối với chủ ngữ bao quát 'mọi loài' vừa giữ lực nhấn mạnh.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: không được ăn chúng
  rationale: Dạng Niphal diễn đạt lệnh cấm ở thể bị động. Tiếng Việt dùng 'không được ăn' tự nhiên trong văn luật; 'chúng' quy chiếu về các loài vật vừa nêu.
theological_decisions:
- issue: Phạm vi của từ שֶׁקֶץ
  choice: Dịch là 'vật ghê tởm' trong ngữ cảnh cấm dùng làm thức ăn.
  alternative: Dịch là 'vật ô uế' hoặc 'điều đáng nguyền rủa'.
  rationale: Nguyên văn nhấn mạnh sự ghê tởm theo quy định ăn uống. Không đồng nhất từ này với thuật ngữ kỹ thuật 'ô uế', cũng không mở rộng thành một phán xét đạo đức ngoài văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. 'Bò lúc nhúc' gợi rõ chuyển động của các sinh vật nhỏ mà không giới hạn cứng vào một phân loại sinh học hiện đại; cấu trúc 'không được ăn' giữ giọng luật định tự nhiên trong tiếng Việt.
