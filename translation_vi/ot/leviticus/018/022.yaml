base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: vi
  text: Ngươi không được nằm với một người nam như nằm với một người nữ[a]; đó là điều ghê tởm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “những sự nằm của một người nữ,” một thành ngữ chỉ việc quan hệ tình dục với một người nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: một người nam
  rationale: Danh từ này chỉ một người thuộc giới tính nam, không tự nó giới hạn ở người trưởng thành. “Một người nam” trực tiếp hơn “một người đàn ông” và không thu hẹp nghĩa của tiếng Hê-bơ-rơ.
- source_word: תִשְׁכַּב
  choice: nằm với
  rationale: Động từ שׁכב trong điều luật này là một cách nói uyển chỉ quan hệ tình dục. “Nằm với” giữ được hình ảnh của nguyên văn và vẫn rõ nghĩa trong ngữ cảnh.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: như nằm với một người nữ
  rationale: Nguyên văn có cụm số nhiều “những sự nằm của một người nữ,” một thành ngữ chỉ việc giao hợp với phụ nữ. Cách dịch này truyền đạt ý nghĩa tự nhiên, đồng thời giữ phép so sánh của tiếng Hê-bơ-rơ.
- source_word: תּוֹעֵבָה
  choice: điều ghê tởm
  rationale: Từ này diễn tả một điều bị xem là hết sức đáng ghét hoặc đáng loại bỏ trong bối cảnh các luật về sự thánh khiết. “Điều ghê tởm” giữ được sức nặng của lời phán mà không thêm một phạm vi thần học ngoài câu.
- source_word: הִוא
  choice: đó là
  rationale: Đại từ giống cái quay lại hành vi vừa bị cấm và phù hợp với danh từ giống cái תּוֹעֵבָה. Tiếng Việt tự nhiên dùng “đó là” để nêu nhận định này.
theological_decisions:
- issue: Phạm vi của điều cấm trong bối cảnh Luật Thánh Khiết
  choice: Dịch như một lệnh cấm trực tiếp hành vi một người nam nằm với một người nam khác theo cách nằm với phụ nữ, không thêm điều kiện hạn định mà nguyên văn không nêu.
  alternative: Thu hẹp câu này vào riêng những hành vi mang tính nghi lễ ngoại giáo, bóc lột hoặc một hoàn cảnh chuyên biệt khác.
  rationale: Bản Hê-bơ-rơ trực tiếp cấm việc nằm với người nam “như nằm với một người nữ” và gọi hành vi ấy là תּוֹעֵבָה. Bản dịch cần giữ đúng phạm vi phát biểu của câu, không tự ý thu hẹp hoặc mở rộng bằng lối diễn giải giáo lý.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ngươi không được” giữ giọng của một điều luật trực tiếp; “nằm với” bảo tồn cách nói uyển của nguyên văn, còn chú thích làm rõ thành ngữ.
