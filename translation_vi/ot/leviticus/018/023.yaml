  to: Ngươi không được ăn nằm[a] với bất cứ con vật nào để tự làm mình ô uế với nó. Người nữ cũng không được đứng trước một con vật để nó giao phối với mình[b]. Đó là một sự đảo lộn trật tự[c].
  rationale: Chỉnh “vì nó” thành “với nó” để phản ánh sát hơn בָּהּ và làm rõ rằng sự ô uế gắn với quan hệ với con vật. Rút chú thích a về đúng chức năng giải thích thành ngữ, không thêm một sắc thái chưa cần thiết trong ngữ cảnh. Các yếu tố còn lại được giữ vì trung thành với văn bản nguồn và phù hợp tiếng Việt hiện đại.
