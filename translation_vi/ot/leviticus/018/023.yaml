    rationale: Trong Lê-vi Ký 18:23, שְׁכָבְתְּךָ trong thành ngữ với “trao/cho” chỉ hành vi nằm/giao hợp. Việc nêu xuất tinh như một hàm ý có thể làm người đọc hiểu hẹp hoặc chuyển trọng tâm khỏi thành ngữ của câu.
