source:
  edition: WLC
  text: וּ/בְ/כָל בְּהֵמָ֛ה לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/טָמְאָה בָ֑/הּ וְ/אִשָּׁ֗ה לֹֽא תַעֲמֹ֞ד לִ/פְנֵ֧י בְהֵמָ֛ה לְ/רִבְעָ֖/הּ תֶּ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: vi
  text: Ngươi không được ăn nằm[a] với bất cứ con vật nào để tự làm mình ô uế với nó. Người nữ cũng không được đứng trước một con vật để nó giao phối với mình[b]. Đó là một sự đảo lộn trật tự[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn gần như: “trao sự nằm của ngươi”; đây là lối nói chỉ quan hệ tình dục.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ ở đây nói đến việc con vật phủ hoặc giao phối với người nữ.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “một điều đồi bại” hoặc “một sự hỗn loạn”; từ Hê-bơ-rơ chỉ sự vi phạm hay đảo lộn trật tự đúng đắn, nhất là trong lĩnh vực tính dục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: với bất cứ con vật nào
  rationale: “Con vật” diễn đạt tự nhiên phạm vi rộng của בְּהֵמָה, còn “bất cứ” giữ lực bao quát của כָּל.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: ngươi không được ăn nằm
  rationale: Cụm Hê-bơ-rơ có nghĩa đen gần như “không được trao sự nằm của ngươi”; “ăn nằm” là thành ngữ tiếng Việt tự nhiên chỉ quan hệ tình dục, giữ sắc thái uyển ngữ mà không tạo câu tối nghĩa.
- source_word: לְטָמְאָה בָהּ
  choice: mà làm mình ra ô uế vì nó
  rationale: Giữ khái niệm ô uế của טמא và diễn đạt kết quả hoặc mục đích gắn với hành vi; “vì nó” quy sự ô uế về việc quan hệ với con vật.
- source_word: וְאִשָּׁה
  choice: Người nữ cũng
  rationale: אִשָּׁה ở đây chỉ người nữ nói chung, không nhất thiết là người vợ; “cũng” nối tự nhiên với lệnh cấm song song.
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: không được đứng trước một con vật
  rationale: Giữ hình ảnh cụ thể của động từ “đứng” và giới từ “trước”, không diễn giải quá mức thành “dâng mình” hay “đặt mình vào tư thế”.
- source_word: לְרִבְעָהּ
  choice: để nó giao phối với mình
  rationale: Động từ רבע trong ngữ cảnh này nói đến việc con vật phủ hoặc giao phối; hậu tố giống cái cho thấy người nữ là đối tượng của hành vi. Cách dịch này nêu rõ chiều tác động mà vẫn trang trọng.
- source_word: תֶּבֶל הוּא
  choice: Đó là một sự đảo lộn trật tự
  rationale: תֶּבֶל chỉ sự pha trộn hoặc vi phạm trật tự đúng đắn, đặc biệt trong bối cảnh tính dục. Cách dịch này giữ trường nghĩa “đảo lộn” thay vì thu hẹp ngay thành một thuật ngữ đạo đức hệ phái.
theological_decisions:
- issue: Ngôn ngữ ô uế mang chiều kích nghi lễ và đạo đức
  choice: làm mình ra ô uế vì nó
  alternative: tự làm nhơ uế mình bởi nó
  rationale: Bản dịch giữ nguyên phạm trù “ô uế” của văn bản, không giản lược thành sự mất vệ sinh hay chỉ giới hạn vào tình trạng nghi lễ.
- issue: Ý nghĩa của תֶּבֶל
  choice: một sự đảo lộn trật tự
  alternative: một điều đồi bại
  rationale: “Sự đảo lộn trật tự” bảo tồn sự căng nghĩa giữa pha trộn, rối loạn và vi phạm trật tự; “đồi bại” tự nhiên hơn nhưng dễ thu hẹp từ ngữ vào một phán đoán luân lý tổng quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “ngươi” để phù hợp lời luật truyền cho cá nhân số ít; “ăn nằm” là uyển ngữ phổ thông nhưng rõ nghĩa. Các câu được tách để tiếng Việt dễ đọc, trong khi vẫn giữ cấu trúc hai lệnh cấm và lời kết luận của nguyên văn.
