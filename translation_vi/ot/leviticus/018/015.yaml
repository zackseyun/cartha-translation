base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: vi
  text: Ngươi không được phơi bày sự trần truồng của con dâu ngươi[a]. Người ấy là vợ của con trai ngươi; ngươi không được phơi bày sự trần truồng của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “phơi bày sự trần truồng”, một uyển ngữ pháp lý được lặp lại trong Lê-vi Ký để chỉ những quan hệ tình dục bị cấm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: sự lõa lồ của
  rationale: Giữ danh từ chỉ sự trần truồng trong công thức pháp lý lặp lại của Lê-vi Ký 18, thay vì diễn giải thẳng thành quan hệ tình dục.
- source_word: כַּלָּתְךָ
  choice: con dâu mình
  rationale: Đây là từ thân tộc trực tiếp chỉ vợ của con trai người được nói với; “mình” giúp câu tiếng Việt tự nhiên mà không đổi ngôi xưng hô.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: không được lột trần
  rationale: Động từ Piel גלה đi với עֶרְוָה tạo thành công thức cấm đoán quen thuộc; “không được” diễn đạt tự nhiên sức pháp lệnh trong tiếng Việt.
- source_word: אֵשֶׁת בִּנְךָ
  choice: vợ của con trai con
  rationale: Giữ nguyên quan hệ sở thuộc và chức năng giải thích của mệnh đề đồng vị.
- source_word: הִוא
  choice: Nàng là
  rationale: Đại từ giống cái xác định lại người phụ nữ vừa nêu; “nàng” có sắc thái trang trọng, rõ quy chiếu.
- source_word: עֶרְוָתָהּ
  choice: sự lõa lồ của nàng
  rationale: Lặp lại đầy đủ cụm từ như nguyên văn để duy trì nhịp điệu và tính nhất quán pháp lý.
theological_decisions:
- issue: Cách dịch thành ngữ pháp lý “lột trần sự lõa lồ” trong ngữ cảnh cấm quan hệ tình dục
  choice: Giữ thành ngữ “lột trần sự lõa lồ” trong chính văn.
  alternative: “quan hệ tình dục với” hoặc “ăn nằm với”
  rationale: Nguyên văn dùng một công thức uyển ngữ ổn định xuyên suốt Lê-vi Ký 18. Giữ hình ảnh này bảo toàn sự liên kết nội văn và không làm mất sắc thái uyển ngữ, còn chú thích giải nghĩa cho độc giả hiện đại.
translation_notes:
  register: Văn phong pháp lệnh trang trọng nhưng dễ hiểu. Dùng “con” theo lối diễn ngôn luật pháp trực tiếp trong ngữ cảnh; “không được” tự nhiên hơn lối cổ “chớ”. Giữ sự lặp lại có chủ ý của nguyên văn.
