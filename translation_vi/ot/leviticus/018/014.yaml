  source_fidelity: 'Bản dịch giữ đúng hai mệnh lệnh cấm, quan hệ là anh/em trai của cha, người vợ của ông ấy, và câu xác định quan hệ ở cuối. Tuy nhiên, “cô hoặc thím” không đúng quan hệ thân tộc: “cô” thông thường là chị/em gái của cha, không phải vợ của anh/em trai cha. Với tính không xác định về tuổi tác trong tiếng Hê-bơ-rơ, “bác hoặc thím” là tương ứng phù hợp hơn.'
