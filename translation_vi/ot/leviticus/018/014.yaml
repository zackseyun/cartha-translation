source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: vi
  text: Con không được phơi bày sự trần truồng của anh/em trai của cha con; con không được đến gần vợ người ấy[a]. Bà ấy là bác hoặc thím của con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đến gần”; trong công thức luật cấm loạn luân ở đây, động từ này mang hàm ý tình dục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: sự lõa lồ của
  rationale: Giữ hình ảnh cụ thể trong công thức luật pháp “lột trần sự lõa lồ”, vốn là cách nói chỉ quan hệ tình dục bị cấm trong Lê-vi Ký 18, thay vì diễn giải hoàn toàn.
- source_word: אֲחִי אָבִיךָ
  choice: anh em trai cha mình
  rationale: Phản ánh trực tiếp chuỗi sở hữu “anh/em trai của cha con” và không ép nghĩa thành anh hay em khi tiếng Hê-bơ-rơ không phân biệt.
- source_word: לֹא תְגַלֵּה
  choice: không được lột trần
  rationale: Động từ Piel của גלה thuộc công thức pháp lý “lột trần sự lõa lồ”; “không được” diễn đạt tự nhiên sức mạnh của lệnh cấm trong tiếng Việt.
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: con không được đến gần vợ người ấy
  rationale: Giữ động từ giảm nhẹ “đến gần” của nguyên văn; trong văn cảnh luật cấm loạn luân, động từ mang hàm ý tình dục, được chú thích để tránh hiểu đơn thuần là khoảng cách vật lý.
- source_word: דֹּדָתְךָ
  choice: cô hoặc thím của con
  rationale: Trong văn cảnh này, דֹּדָה là vợ của anh hoặc em trai bên cha. Tiếng Việt hiện đại phải phân biệt “cô” (vợ bác trai) và “thím” (vợ chú), trong khi nguyên văn không cho biết người đàn ông lớn hay nhỏ tuổi hơn cha; dùng cả hai từ để bảo toàn sự không xác định.
- source_word: הִוא
  choice: Bà ấy là
  rationale: Đại từ giống cái số ít làm vị ngữ trong câu xác định quan hệ; không thêm “vì” hay “bởi vì”, nhằm tránh làm sắc thái giải thích mạnh hơn nguyên văn.
theological_decisions:
- issue: Cách dịch thành ngữ luật cấm quan hệ tình dục
  choice: Giữ công thức “lột trần sự lõa lồ” trong chính văn.
  alternative: Diễn giải thành “quan hệ tình dục với”.
  rationale: Cách chọn giữ được sự lặp lại có chủ ý của công thức pháp lý trong chương và minh bạch với nguyên văn, trong khi văn cảnh cùng chú thích làm rõ hàm ý tình dục.
- issue: Xác định quan hệ thân tộc ở דֹּדָתְךָ
  choice: Dịch “cô hoặc thím của con”.
  alternative: Chỉ dùng “thím của con” hoặc diễn giải “vợ của anh em trai cha con”.
  rationale: Tiếng Hê-bơ-rơ xác định đây là vợ của anh/em trai người cha nhưng không xác định người ấy lớn hay nhỏ tuổi hơn cha. Cặp từ tiếng Việt bảo toàn tính mơ hồ thật sự ấy và tránh thu hẹp phạm vi lệnh cấm.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại; dùng “con” theo lối xưng hô trực tiếp của các điều cấm trong chương. Giữ cách nói giảm nhẹ và hình ảnh của tiếng Hê-bơ-rơ. Cụm “cô hoặc thím” là cần thiết vì hệ thống thân tộc tiếng Việt phân biệt tuổi tương đối mà nguyên văn không nêu.
