    rationale: “Lột trần” và “lõa lồ” đều biểu đạt tình trạng không che phủ, nên cụm này gây nặng nề. “Phơi bày sự trần truồng” bảo lưu sát hơn cấu trúc thành ngữ pháp lý mà vẫn là tiếng Việt tự nhiên.
