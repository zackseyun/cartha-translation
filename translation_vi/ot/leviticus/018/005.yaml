  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: vi
  text: Vậy, các ngươi phải tuân giữ các luật lệ và phán quyết của Ta; ai làm theo những điều ấy thì sẽ sống nhờ chúng.[a] Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thì sẽ sống trong những điều ấy.” Giới từ Hê-bơ-rơ có thể chỉ phương tiện (“nhờ”) hoặc phạm vi (“trong”).'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vậy, các ngươi phải tuân giữ
  rationale: Dạng động từ đi với liên từ trong lời luật pháp mang lực mệnh lệnh; “tuân giữ” diễn đạt tự nhiên ý gìn giữ và vâng theo các điều giao ước. “Vậy” nối câu này với các điều cấm trước đó.
- source_word: חֻקֹּתַי
  choice: các luật lệ của Ta
  rationale: חֻקּוֹת chỉ những quy định được thiết lập. “Luật lệ” giữ sắc thái pháp lý và phân biệt với מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: phán quyết của Ta
  rationale: מִשְׁפָּט có thể chỉ các phán quyết hoặc quy định pháp lý. “Phán quyết” bảo tồn sự phân biệt từ vựng với “luật lệ” thay vì gộp hai thuật ngữ.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם
  choice: ai làm theo những điều ấy
  rationale: הָאָדָם là danh từ số ít mang nghĩa đại diện, tức bất cứ người nào. Tiếng Việt dùng “ai” tự nhiên, bao quát đúng phạm vi ngữ nghĩa mà không cần tái tạo giống ngữ pháp của tiếng Hê-bơ-rơ. “Làm theo” giữ ý vâng giữ cụ thể của עשה.
- source_word: וָחַי
  choice: thì sẽ sống
  rationale: Cách dịch trực tiếp, giữ nguyên nội hàm rộng của “sống” mà không xác định đó chỉ là tuổi thọ, đời sống giao ước hay sự sống đời đời.
- source_word: בָּהֶם
  choice: nhờ chúng
  rationale: Giới từ בְּ có thể mang nghĩa phương tiện “nhờ/bởi” hoặc phạm vi “trong”. “Nhờ chúng” tự nhiên trong tiếng Việt; cách hiểu “trong đó” được ghi ở chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Phạm vi ý nghĩa của “sẽ sống nhờ chúng”
  choice: Giữ cách nói rộng “sẽ sống nhờ chúng”, không xác định loại sự sống.
  alternative: “sẽ sống trong đó” hoặc diễn giải là được sống lâu, sống trong giao ước hay nhận sự sống đời đời
  rationale: Bản Hê-bơ-rơ không xác định rõ phạm vi của sự sống được nói đến. Cách dịch tránh giải quyết trước sự căng thẳng thần học mà câu này mang trong các truyền thống giải thích về sau.
- issue: Ý nghĩa đại diện của הָאָדָם
  choice: Dịch là “ai”
  alternative: “một người”, “con người”
  rationale: Trong tiếng Hê-bơ-rơ, danh từ giống đực số ít ở đây có chức năng đại diện, không chỉ riêng nam giới. “Ai” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “các ngươi” vì lời được truyền cho toàn thể dân Israel, và viết hoa “Ta” khi Yahweh tự xưng. Chỉ dùng một chú thích cho điểm mơ hồ thực sự còn giữ trong nguyên ngữ.
