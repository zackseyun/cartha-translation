revisions:
- from: Con không được phơi bày sự trần truồng của chị em gái mình—dù là con gái của cha hay con gái của mẹ, sinh trong gia đình hay sinh bên ngoài.[a]
  to: Không được phơi bày sự trần truồng của chị hoặc em gái của mình—dù là con gái của cha hay con gái của mẹ, được sinh ra trong gia đình hay bên ngoài.[a]
  rationale: Bản sửa loại bỏ đại từ «Con» vốn thêm nội dung không có trong nguyên văn, làm sáng rõ quan hệ thân tộc bằng «chị hoặc em gái», và hoàn chỉnh cách diễn đạt của các vế nói về sự sinh ra. Thành ngữ pháp lý và sự mơ hồ có chủ ý về «nhà/gia đình» và «bên ngoài» được bảo tồn; chú thích vẫn neo đúng tại cụm từ liên quan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các thành tố chính của câu Hê-bơ-rơ: lệnh cấm, quan hệ chị/em gái, các phạm trù con gái của cha hoặc mẹ, và cặp đối lập «trong nhà/trong hộ» với «bên ngoài». Tuy nhiên, «Con» thêm một quan hệ xưng hô cha–con không có trong câu gốc; nguyên văn là lệnh trực tiếp giống đực số ít, không xác định người nói là cha của người được nói đến. Cần bỏ yếu tố thêm này. Bản sửa cũng làm rõ rằng «sinh» bổ nghĩa cho người chị/em gái.'
  naturalness: «Chị em gái mình» có thể được hiểu là nhiều người hoặc là một cách gọi chung; «chị hoặc em gái của mình» rõ hơn trong tiếng Việt hiện đại. «Được sinh ra trong gia đình hay bên ngoài» là một cấu trúc hoàn chỉnh và tự nhiên hơn «sinh trong gia đình hay sinh bên ngoài», đồng thời vẫn bảo lưu tính không hoàn toàn xác định của cặp בית/חוץ.
  terminology: Giữ «phơi bày sự trần truồng» để phản ánh thành ngữ pháp lý עָרְוָה / גלה trong cả chương, thay vì diễn giải thành quan hệ tình dục. Không dùng «Con», vì đây không phải là thuật ngữ thần học hay đại từ được nguyên văn quy định.
  issues:
  - severity: medium
    issue: Đại từ «Con» được thêm vào đầu câu.
    rationale: Câu Hê-bơ-rơ chỉ dùng lệnh cấm ở ngôi thứ hai giống đực số ít và không nêu quan hệ cha–con. «Con» tạo thêm khung xưng hô không có trong nguồn.
  - severity: low
    issue: «chị em gái mình» có thể mơ hồ về số lượng và «sinh trong gia đình» thiếu cấu trúc chủ-vị rõ ràng.
    rationale: «chị hoặc em gái của mình» phản ánh một người chị/em gái mà không phân biệt tuổi; «được sinh ra...» cho thấy rõ các mệnh đề này mô tả người ấy.
  revised_text: Không được phơi bày sự trần truồng của chị hoặc em gái của mình—dù là con gái của cha hay con gái của mẹ, được sinh ra trong gia đình hay bên ngoài.[a]
  revised_footnotes:
