  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: vi
  text: Không được phơi bày sự trần truồng của chị hoặc em gái của mình—dù là con gái của cha hay con gái của mẹ, được sinh ra trong gia đình hay bên ngoài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “được sinh ra trong nhà hay bên ngoài.” Tiếng Hê-bơ-rơ đối chiếu việc sinh “trong nhà/gia đình” với việc sinh “bên ngoài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: sự trần truồng của
  rationale: Trong Lê-vi Ký 18, đây là thành ngữ pháp lý chỉ sự lõa thể mang ý nghĩa tình dục trong các quan hệ bị cấm. Cách dịch này giữ được hình ảnh và công thức của nguyên văn.
- source_word: אֲחוֹתְךָ
  choice: chị em gái mình
  rationale: Thuật ngữ thân tộc trực tiếp; tiếng Việt cần dùng cụm bao quát cả chị và em gái vì nguyên văn không phân biệt tuổi.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: con gái của cha / con gái của mẹ
  rationale: Giữ cấu trúc song song và tính chính xác về quan hệ huyết thống của điều luật.
- source_word: מוֹלֶדֶת
  choice: sinh
  rationale: Diễn đạt tự nhiên chức năng tính từ/phân từ của từ này, chỉ người được sinh ra trong hoàn cảnh được nêu.
- source_word: בַּיִת / חוּץ
  choice: trong gia đình / bên ngoài
  rationale: Cặp từ đối lập giữa phạm vi nhà/gia đình và bên ngoài. 'Gia đình' chuyển tải bình diện hộ gia đình tốt hơn cách hiểu thuần túy là tòa nhà, nhưng nguyên văn vẫn có thể được hiểu sát là 'trong nhà'.
- source_word: לֹא תְגַלֶּה
  choice: không được phơi bày
  rationale: Giữ nguyên công thức cấm đoán và động từ hình ảnh 'phơi bày' của tiếng Hê-bơ-rơ, đồng thời phù hợp văn phong luật pháp tiếng Việt hiện đại.
- source_word: אוֹ ... אוֹ
  choice: dù ... hay
  rationale: Diễn đạt tự nhiên hai trường hợp song song mà điều cấm đều áp dụng.
theological_decisions:
- issue: Phạm vi quan hệ bị cấm
  choice: Điều cấm bao gồm chị hoặc em gái cùng cha hay cùng mẹ, bất kể sinh trong gia đình hay bên ngoài.
  alternative: Các vế cuối có thể được hiểu là phân biệt chị em cùng cha mẹ với chị em cùng cha khác mẹ hoặc cùng mẹ khác cha, hay người sinh tại nhà với người sinh ở nơi khác.
  rationale: Công thức pháp lý Hê-bơ-rơ mở rộng, chứ không thu hẹp, phạm vi của từ 'chị em gái'. Bản dịch không đưa thêm những phân loại pháp lý mà câu không nói rõ.
- issue: Ý nghĩa của 'phơi bày sự trần truồng'
  choice: Giữ thành ngữ chỉ hành vi tình dục bị cấm thay vì diễn giải thẳng thành 'quan hệ tình dục'.
  alternative: Không được quan hệ tình dục với chị em gái mình.
  rationale: Lối dịch thành ngữ bảo tồn hình ảnh, tính liên kết với toàn chương và mức độ gián tiếp có chủ ý của nguyên văn, trong khi ngữ cảnh pháp lý vẫn làm rõ ý nghĩa.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. Đại từ 'con' phản ánh lời phán trực tiếp trong ngữ cảnh giao ước; 'chị em gái' là cách nói tiếng Việt bao quát cả người nữ lớn tuổi và nhỏ tuổi hơn. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
