base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức lời phán của Đức Chúa Trời được dịch là “phán”, vừa chính xác theo ngữ cảnh vừa tự nhiên và trang trọng trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho danh riêng יהוה, không thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu nói/phán với một người, “với” là cách diễn đạt tự nhiên của tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này giới thiệu nội dung lời phán; “rằng” chuyển tải chức năng ấy tự nhiên hơn lối dịch sát “mà nói rằng” trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản nguồn ghi trực tiếp danh riêng của Đức Chúa Trời. Bản dịch giữ danh riêng ấy bằng dạng phiên âm quen thuộc trong tiếng Việt, thay vì thay thế bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Công thức Hê-bơ-rơ được diễn đạt gọn theo cú pháp tiếng Việt; dấu hai chấm báo trước nội dung lời phán ở câu kế tiếp.
