review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng cấu trúc quan hệ và công thức cấm của tiếng Hê-bơ-rơ. Tuy nhiên, chú thích xác định người nữ là “cùng cha khác mẹ” đi xa hơn nguyên văn: mô tả không loại trừ khả năng là chị/em ruột cùng cha mẹ. Cần giữ quan hệ rộng là chị hoặc em gái.'
  naturalness: “Lột trần sự lõa lồ” không tự nhiên trong tiếng Việt hiện đại. “Phơi bày sự trần truồng” là cách diễn đạt trang trọng, dễ hiểu hơn, đồng thời vẫn phản ánh thành ngữ pháp lý của chương. “Chị hoặc em gái” diễn đạt tự nhiên hơn “chị em gái” khi cần tránh tự quyết định tuổi tác.
  terminology: Dùng nhất quán “phơi bày sự trần truồng” cho עֶרְוָה/גלה; “vợ của cha con” giữ đúng quan hệ được nêu; “do cha con sinh ra” bảo toàn nét dòng dõi từ người cha. Không nên đưa “cùng cha khác mẹ” vào chú thích như một lựa chọn tương đương không điều kiện.
  issues:
  - severity: medium
    issue: Chú thích thêm “cùng cha khác mẹ”.
    rationale: Tiếng Hê-bơ-rơ chỉ kết luận “nàng là chị/em gái của con”; mô tả trước đó xác định cha chung nhưng không minh thị loại trừ mẹ chung. Chú thích hiện tại làm hẹp quan hệ vượt quá nguồn.
  - severity: low
    issue: “lột trần sự lõa lồ” kém tự nhiên.
    rationale: Cụm này nặng tính ghép chữ và không phải lối diễn đạt pháp lý Kinh Thánh tự nhiên trong tiếng Việt hiện đại. “Phơi bày sự trần truồng” giữ được thành ngữ mà rõ hơn.
  revised_text: Con không được phơi bày sự trần truồng của con gái vợ của cha con, là người do cha con sinh ra; nàng là chị hoặc em gái của con.[a]
