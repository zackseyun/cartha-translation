- from: Con không được lột trần sự lõa lồ của con gái người vợ của cha con, là người do cha con sinh ra; nàng là chị em gái của con.[a]
  to: Con không được phơi bày sự trần truồng của con gái vợ của cha con, là người do cha con sinh ra; nàng là chị hoặc em gái của con.[a]
  rationale: Chỉnh thành ngữ cấm đoán sang tiếng Việt tự nhiên hơn, đồng thời thay chú thích diễn giải quá hẹp bằng chú thích chỉ giải thích việc tiếng Hê-bơ-rơ không phân biệt chị và em. Chính văn vẫn giữ quan hệ gia đình và sắc thái pháp lý của nguồn.
