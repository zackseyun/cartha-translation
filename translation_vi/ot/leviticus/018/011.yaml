  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: vi
  text: Con không được phơi bày sự trần truồng của con gái vợ của cha con, là người do cha con sinh ra; nàng là chị hoặc em gái của con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ nói sát chữ: “nàng là chị em gái của con”; từ này không phân biệt chị hay em.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: sự lõa lồ của… / sự lõa lồ của nàng
  rationale: Trong Lê-vi Ký 18, đây là thành ngữ cố định trong các điều cấm về quan hệ tình dục. Cách dịch này giữ hình ảnh và sắc thái pháp lý của nguyên văn, thay vì diễn giải thành “nỗi nhục” hoặc chỉ rõ bộ phận cơ thể.
- source_word: בַּת
  choice: con gái
  rationale: Từ chỉ quan hệ thân thuộc trực tiếp, được dịch sát nghĩa.
- source_word: אֵשֶׁת אָבִיךָ
  choice: người vợ của cha con
  rationale: Giữ cấu trúc quan hệ được nguyên văn nêu rõ; “mẹ kế” sẽ hàm ý và thu hẹp cách diễn đạt hơn bản Hê-bơ-rơ.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: người do cha con sinh ra
  rationale: Diễn đạt dòng dõi sinh học từ phía người cha bằng tiếng Việt tự nhiên, đồng thời không làm mất trọng tâm phụ hệ của cụm từ Hê-bơ-rơ.
- source_word: אֲחוֹתְךָ הִוא
  choice: nàng là chị em gái của con
  rationale: Nguyên văn dùng danh từ chung chỉ chị hoặc em gái, không phân biệt tuổi và không thêm yếu tố “cùng cha khác mẹ”; bản dịch giữ sự khái quát ấy.
- source_word: לֹא תְגַלֶּה
  choice: Con không được lột trần
  rationale: “Không được” phù hợp với công thức cấm đoán pháp lý trong tiếng Việt hiện đại; “lột trần sự lõa lồ” duy trì thành ngữ và tính nhất quán trong chương.
theological_decisions:
- issue: Có nên ghi rõ quan hệ là chị em cùng cha khác mẹ trong chính văn hay không
  choice: 'Giữ lời nguyên văn: “nàng là chị em gái của con”, để phần mô tả trước đó xác định quan hệ.'
  alternative: “nàng là chị em cùng cha khác mẹ của con”
  rationale: Cụm “con gái người vợ của cha con, là người do cha con sinh ra” đã xác định mối quan hệ, còn câu kết Hê-bơ-rơ chỉ nói “nàng là chị/em gái của con”. Thêm “cùng cha khác mẹ” vào chính văn sẽ giải thích vượt quá cách diễn đạt trực tiếp của nguồn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “con” theo lối xưng hô của lời luật truyền cho từng cá nhân; dùng “nàng” để quy chiếu rõ đến người nữ. Cụm “chị em gái” tránh tự ý xác định người ấy lớn hay nhỏ tuổi hơn.
