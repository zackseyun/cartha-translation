  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: vi
  text: Ngươi không được quan hệ tình dục[a] với vợ của người đồng loại của ngươi, và như thế tự làm mình ra ô uế với nàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ, sát chữ: “Ngươi không được trao sự nằm của mình để làm giống cho vợ của người đồng loại của ngươi.” Đây là một thành ngữ chỉ quan hệ tình dục.'
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: vợ của người đồng loại
  rationale: Trong luật này, עָמִית chỉ một người khác thuộc cộng đồng. “Người đồng loại” tự nhiên và trang trọng, đồng thời tránh thu hẹp nghĩa thành người sống gần nhà.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: không được quan hệ tình dục
  rationale: Cụm Hê-bơ-rơ dùng hình ảnh về việc trao sự giao hợp/tinh dịch làm giống để chỉ hành vi giao hợp. Chuyển đạt nghĩa thành ngữ giúp lời cấm rõ ràng; hình ảnh nguyên văn được bảo lưu trong chú thích.
- source_word: לְטָמְאָה בָהּ
  choice: để khỏi làm mình ra ô uế vì nàng
  rationale: Động từ nguyên mẫu diễn tả sự ô uế của người nam do hành vi với người nữ. Cách dịch này giữ ngôn ngữ ô uế mà không tự ý giới hạn nó chỉ vào phạm trù nghi lễ.
theological_decisions:
- issue: Bản chất của điều cấm và ngôn ngữ ô uế
  choice: Cấm quan hệ tình dục với vợ của người đồng loại, vì hành vi ấy làm người được truyền lệnh ra ô uế.
  alternative: Giữ nguyên hình ảnh về tinh dịch trong chính văn, hoặc diễn đạt sự ô uế chỉ như tình trạng ô uế nghi lễ.
  rationale: Thành ngữ Hê-bơ-rơ rõ ràng nói đến giao hợp, còn mệnh đề cuối nêu sự ô uế. Bản dịch chuyển tải nghĩa của thành ngữ trong chính văn, ghi nghĩa sát chữ ở chú thích, và không thu hẹp tính chất ô uế quá mức điều nguyên bản nói.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, rõ ràng và trang trọng. Dùng “ngươi” để phù hợp lời luật trực tiếp ở số ít; “quan hệ tình dục” là cách nói hiện đại, dễ hiểu nhưng không thô tục. Đại từ “nàng” giữ đối tượng giống cái của hậu tố Hê-bơ-rơ.
