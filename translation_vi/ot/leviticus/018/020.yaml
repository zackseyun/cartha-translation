review_pass:
  verdict: revise
  source_fidelity: Bản chính truyền đạt đúng điều cấm về giao hợp với vợ của người đồng loại. Tuy nhiên, “để khỏi” thêm sắc thái tránh né không có trong nguyên văn; “vì nàng” dễ hiểu là nàng là nguyên nhân, thay vì diễn tả hành vi với nàng. Cần giữ quan hệ “với nàng” và ý hệ quả/hành vi của cụm לְטָמְאָה בָהּ.
  naturalness: “Ngươi không được quan hệ tình dục” rõ ràng, chuẩn hiện đại và phù hợp văn phong luật lệ. “Và như thế tự làm mình ra ô uế với nàng” tự nhiên hơn “để khỏi làm mình ra ô uế vì nàng.”
  terminology: “Vợ của người đồng loại” phù hợp với אֵשֶׁת עֲמִיתְךָ, nhưng thêm “của ngươi” phản ánh hậu tố sở hữu. “Ra ô uế” giữ được thuật ngữ rộng của טמא mà không võ đoán chỉ là ô uế nghi lễ. Chú thích nên phản ánh hình ảnh “sự nằm”/giao hợp và “làm giống” sát hơn, thay vì cụm không tự nhiên “trao sự giao hợp ... làm giống.”
  issues:
  - severity: medium
    issue: “để khỏi” trong mệnh đề cuối
    rationale: לְטָמְאָה בָהּ nói việc tự làm mình ô uế với nàng như mục đích/hệ quả gắn với hành vi bị cấm; “để khỏi” diễn giải thành mục đích tránh hậu quả và không có đối ứng trực tiếp trong tiếng Hê-bơ-rơ.
  - severity: medium
    issue: “vì nàng” thay cho quan hệ với nàng
    rationale: Hậu tố בָהּ nghĩa là “với/trong nàng”; “vì nàng” có thể gán nguyên nhân của sự ô uế cho người phụ nữ, thay vì xác định hành vi quan hệ với nàng.
  - severity: low
    issue: Thiếu “của ngươi” trong “người đồng loại”
    rationale: עֲמִיתְךָ mang hậu tố ngôi hai số ít. Việc bổ sung “của ngươi” tăng tính sát nguồn mà vẫn tự nhiên.
  - severity: low
    issue: Chú thích sát chữ chưa chính xác và hơi gượng
    rationale: שְׁכָבְתְּךָ theo nghĩa đen là “sự nằm của ngươi,” trong thành ngữ chỉ giao hợp/xuất tinh; “làm giống” tương ứng với לְזָרַע. Cần tránh trình bày “sự giao hợp” như thể đó là sát chữ.
