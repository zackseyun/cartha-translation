revisions:
- from: Vậy, các ngươi phải tuân giữ điều Ta truyền, không làm theo bất cứ tục lệ ghê tởm nào[a] đã được thực hành trước các ngươi, và không làm cho mình ra ô uế bởi những điều ấy. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  to: Vậy, các ngươi phải tuân giữ điều Ta truyền, để không làm theo bất cứ tục lệ ghê tởm nào[a] đã được thực hành trước khi các ngươi đến, và đừng tự làm mình ô uế bởi các tục lệ ấy. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  rationale: Sửa “trước các ngươi” thành “trước khi các ngươi đến” để truyền đạt nghĩa thời gian được ngữ cảnh xác định mà không thêm diễn giải về chủ thể thực hành. Thay đổi mệnh đề cuối thành “đừng tự làm mình ô uế bởi các tục lệ ấy” để diễn đạt tự nhiên hơn sắc thái phản thân và quy chiếu rõ ràng của tiếng Hê-bơ-rơ.
  reviewer_model: gpt-5.6-terra
