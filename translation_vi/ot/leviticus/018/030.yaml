  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: vi
  text: Vậy, các ngươi phải tuân giữ điều Ta truyền, để không làm theo bất cứ tục lệ ghê tởm nào[a] đã được thực hành trước khi các ngươi đến, và đừng tự làm mình ô uế bởi các tục lệ ấy. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quy định ghê tởm” hoặc “những lệ tục đáng ghê tởm”. Từ Hê-bơ-rơ có thể chỉ các quy định, những cách thực hành đã được ấn định, hoặc các tập tục, chứ không chỉ luật lệ chính thức.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: các ngươi phải tuân giữ
  rationale: Động từ שׁמר mang nghĩa giữ gìn, tuân giữ; dạng chưa hoàn thành trong văn cảnh luật pháp có lực chỉ thị. “Phải tuân giữ” diễn đạt rõ nghĩa vụ giao ước.
- source_word: מִשְׁמַרְתִּי
  choice: điều Ta truyền
  rationale: מִשְׁמֶרֶת chỉ điều được giao phó để gìn giữ hoặc bổn phận phải tuân hành. Cách dịch này tự nhiên trong tiếng Việt và giữ được ý về nghĩa vụ do Đức Chúa Trời giao.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: không làm theo
  rationale: Cấu trúc diễn tả mục đích hoặc sự ngăn ngừa. “Không làm theo” tự nhiên khi nói đến các tập tục và hàm ý không thực hành chúng.
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: bất cứ tục lệ ghê tởm nào
  rationale: מִן có nghĩa phân phần, được diễn đạt bằng “bất cứ… nào”; חֻקּוֹת ở đây có thể chỉ các quy định hoặc tập tục đã thành lệ, còn תּוֹעֵבֹת biểu thị sự đáng ghê tởm mạnh mẽ.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: đã được thực hành trước các ngươi
  rationale: Giữ thể bị động của nguyên văn. “Trước các ngươi” được giữ lại để bảo toàn cách diễn đạt súc tích, với nghĩa theo văn cảnh là trước thời Israel.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: và không làm cho mình ra ô uế bởi những điều ấy
  rationale: Cách dịch giữ sắc thái phản thân của động từ và diễn đạt בָּהֶם như phương tiện hoặc nguyên nhân gây ô uế.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ta là Yahweh, Đức Chúa Trời của các ngươi
  rationale: Giữ công thức tự xưng mang tính giao ước và chuyển trực tiếp danh riêng יהוה thành “Yahweh”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” phân biệt danh riêng này với tước hiệu và không che khuất nó.
- issue: Sắc thái đạo đức và nghi lễ của תּוֹעֵבֹת
  choice: ghê tởm
  alternative: đáng ghét; khả ố
  rationale: “Ghê tởm” giữ cường độ phán xét mạnh của từ Hê-bơ-rơ mà không tự ý giới hạn nó vào riêng phạm trù đạo đức hay nghi lễ.
- issue: Ý nghĩa của sự ô uế trong וְלֹא תִטַּמְּאוּ
  choice: không làm cho mình ra ô uế
  alternative: không tự làm nhơ uế; không trở nên ô uế
  rationale: Bản dịch giữ nguyên sức căng giữa ô uế nghi lễ và ô uế do hành vi đạo đức, không thu hẹp thuật ngữ vào một hệ thống giải thích riêng.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và trực tiếp. Đại từ “Ta—các ngươi” giữ quan hệ giữa Đức Chúa Trời và cộng đồng Israel trong diễn ngôn luật pháp; tuy có sắc thái trang trọng, cách dùng vẫn dễ hiểu trong tiếng Việt hiện đại. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải nghĩa.
