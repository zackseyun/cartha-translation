  - severity: low
    issue: “Bảo họ” có sắc thái truyền bảo/ra lệnh.
    rationale: אָמַר ở đây là “nói”; “nói với họ rằng” giữ mệnh lệnh kép của tiếng Hê-bơ-rơ mà không thêm sắc thái mệnh lệnh thứ hai.
  - severity: low
