  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: vi
  text: 'Hãy nói với con cái Y-sơ-ra-ên và nói với họ rằng: “Ta là Yahweh[a], Đức Chúa Trời của các ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: YHWH trong tiếng Hê-bơ-rơ, theo truyền thống thường được dịch là “CHÚA.”
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Mệnh lệnh của động từ דבר, mở đầu lời Đức Chúa Trời truyền cho Môi-se; “hãy nói” tự nhiên, trang trọng và giữ được tính trực tiếp.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Israel” nhưng ở đây chỉ toàn thể dân giao ước; “con cái Israel” vừa giữ sắc thái gia tộc vừa bao quát cộng đồng.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và bảo họ
  rationale: Giữ nhịp hai động từ của nguyên văn mà tránh lặp “nói ... nói với” thiếu tự nhiên trong tiếng Việt.
- source_word: אֲנִי
  choice: Ta là
  rationale: Đại từ độc lập trong công thức tự xưng được diễn đạt tự nhiên bằng “Ta là”; “Ta” phù hợp lời phán trực tiếp của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước YHWH, không thay bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: אֱלֹהִים chỉ Đức Chúa Trời số ít trong quan hệ giao ước; hậu tố ngôi hai số nhiều được thể hiện bằng “của các ngươi”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH; giữ “Yahweh” bảo tồn tư cách danh riêng và không biến danh ấy thành tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel / dân Israel
  rationale: “Con cái Israel” giữ hình ảnh gia tộc của cụm từ đồng thời phản ánh nghĩa tập thể chỉ dân Israel; dịch “các con trai” có thể bị hiểu hẹp là chỉ nam giới.
- issue: Sắc thái đại từ trong lời Đức Chúa Trời
  choice: Ta ... các ngươi
  alternative: Ta ... các con / Tôi ... anh em
  rationale: “Ta ... các ngươi” giữ giọng uy nghiêm, trực tiếp và quan hệ giao ước, không thêm sắc thái thân mật hoặc bình đẳng không có trong nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc mệnh lệnh cùng công thức tự xưng giao ước; dùng “con cái Israel” thay cho lối dịch quá hẹp theo giới tính. Dấu chú thích được đặt ngay sau câu có danh Yahweh.
