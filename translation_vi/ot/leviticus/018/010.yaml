revisions:
- from: Con không được lột trần sự lõa lồ của cháu gái nội hay cháu gái ngoại mình,[a] vì chúng là sự lõa lồ của chính con.[b]
  to: Con không được phơi bày sự trần truồng của cháu gái nội hoặc cháu gái ngoại của con,[a] vì chúng là sự trần truồng của con.[b]
  rationale: Bản sửa chỉ điều chỉnh thành ngữ tiếng Việt để đạt cách diễn đạt hiện đại, tự nhiên hơn, trong khi vẫn giữ sát công thức pháp lý Hê-bơ-rơ và mệnh đề kết có chủ ý khó hiểu. Quan hệ “con gái của con trai” và “con gái của con gái” vẫn được thể hiện chính xác bằng “cháu gái nội” và “cháu gái ngoại.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng hai quan hệ huyết thống theo dòng con trai/con gái và bảo tồn cấu trúc lý do của tiếng Hê-bơ-rơ: “vì chúng là sự lõa lồ của con.” Tuy nhiên, “lột trần sự lõa lồ” không phải cách diễn đạt tự nhiên cho thành ngữ גלה ערוה trong tiếng Việt hiện đại; “phơi bày sự trần truồng” giữ được tính uyển ngữ, công thức pháp lý và tính liên kết của chương tốt hơn.'
  naturalness: “Cháu gái nội/ngoại” là tự nhiên và chính xác. Đổi “lột trần” thành “phơi bày” giúp câu trang trọng, rõ nghĩa hơn, đồng thời tránh sự gượng lặp về ngữ nghĩa trong “lột trần sự lõa lồ.” Dùng nhất quán “của con” thay cho “mình” phù hợp với lời trực tiếp trong ngữ cảnh.
  terminology: Giữ “sự trần truồng” làm tương ứng hình thức với עֶרְוָה và giữ nguyên mệnh đề kết khó hiểu nhưng quan trọng, không thay bằng “máu thịt” hay một diễn giải giáo lý. Chú thích giải nghĩa thành ngữ là thích hợp.
  issues:
  - severity: medium
    issue: “lột trần sự lõa lồ” là một kết hợp từ không tự nhiên trong tiếng Việt hiện đại.
    rationale: “Lột trần” thường đã bao hàm việc làm ai đó trần truồng, nên khi đi với “sự lõa lồ” tạo cảm giác lặp và không vận hành tốt như một công thức pháp lý. “Phơi bày sự trần truồng” vừa tự nhiên hơn vừa duy trì tính uyển ngữ của thành ngữ Hê-bơ-rơ.
  - severity: low
    issue: Cụm “cháu gái nội hay cháu gái ngoại mình” pha trộn với đại từ xưng hô “con.”
    rationale: Không sai nghĩa, nhưng “của con” tạo sự nhất quán trong lời truyền phán trực tiếp và có sắc thái pháp lý rõ hơn.
