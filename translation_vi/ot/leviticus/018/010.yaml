source:
  edition: WLC
  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: vi
  text: Con không được phơi bày sự trần truồng của cháu gái nội hoặc cháu gái ngoại của con,[a] vì chúng là sự trần truồng của con.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, diễn ý: “Con không được quan hệ tình dục với cháu gái nội hoặc cháu gái ngoại của con.” Thành ngữ Hê-bơ-rơ theo nghĩa đen là “phơi bày sự trần truồng của.”'
    reason: lexical_alternative
  - marker: b
    text: Mệnh đề cuối theo sát nguyên văn là “vì chúng là sự trần truồng của con,” diễn tả rằng những hậu duệ gần này được xem là thuộc chính phạm vi thân tộc của người ấy, nên quan hệ tình dục với họ bị nghiêm cấm.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: sự lõa lồ
  rationale: Giữ hình ảnh và công thức pháp lý uyển ngữ của tiếng Hê-bơ-rơ גלה ערוה, đồng thời duy trì sự liên kết với mệnh đề kết của câu.
- source_word: בַּת בִּנְךָ
  choice: cháu gái nội
  rationale: Diễn đạt tự nhiên và chính xác quan hệ 'con gái của con trai con' trong tiếng Việt.
- source_word: בַת בִּתְּךָ
  choice: cháu gái ngoại
  rationale: Diễn đạt tự nhiên và chính xác quan hệ 'con gái của con gái con', đồng thời tạo thế song song với 'cháu gái nội'.
- source_word: לֹא תְגַלֶּה
  choice: không được lột trần
  rationale: Phản ánh sát mệnh lệnh cấm và động từ 'lột/mở ra', giữ nguyên thành ngữ pháp lý thay vì đưa cách giải nghĩa trực tiếp vào chính văn.
- source_word: כִּי
  choice: vì
  rationale: Thể hiện rõ quan hệ nguyên nhân trong tiếng Việt hiện đại.
- source_word: הֵנָּה
  choice: chúng là
  rationale: Giữ cách phát biểu trực tiếp bằng đại từ giống cái số nhiều trong nguyên văn, quy chiếu đến hai người cháu gái.
theological_decisions:
- issue: Ý nghĩa của mệnh đề kết כִּי עֶרְוָתְךָ הֵנָּה
  choice: vì chúng là sự lõa lồ của chính con
  alternative: vì sự lõa lồ của chúng là sự lõa lồ của con
  rationale: Giữ cấu trúc vị ngữ nguyên văn, theo đó hai hậu duệ gần được đồng nhất với 'sự lõa lồ' của người được nói đến; không âm thầm chuyển thành cách giải thích như 'máu thịt của con'.
- issue: Phạm vi của thành ngữ 'lột trần sự lõa lồ'
  choice: giữ thành ngữ trong chính văn và giải nghĩa ở chú thích
  alternative: không được quan hệ tình dục với
  rationale: Cách này vừa bảo toàn công thức lặp lại xuyên suốt Lê-vi Ký 18 vừa giúp độc giả hiện đại hiểu ý nghĩa tình dục của điều luật.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Đại từ “con” phù hợp lời truyền dạy trực tiếp trong mạch văn. “Cháu gái nội/ngoại” tự nhiên hơn lối nói dài “con gái của con trai/con gái con”; “sự lõa lồ” được giữ có chủ ý để bảo toàn thành ngữ và sự căng thẳng trong mệnh đề kết.
