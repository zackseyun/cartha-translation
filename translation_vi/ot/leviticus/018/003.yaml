revisions:
- from: Các ngươi không được làm theo những gì người ta làm tại đất Ai Cập[a], nơi các ngươi từng cư ngụ; cũng không được làm theo những gì người ta làm tại đất Ca-na-an, nơi Ta đang đưa các ngươi đến. Các ngươi không được sống theo những quy định của họ.[b]
  to: Các ngươi không được làm theo các việc làm của xứ Ai Cập[a], nơi các ngươi đã cư ngụ; cũng không được làm theo các việc làm của xứ Ca-na-an, nơi Ta đang đưa các ngươi đến. Các ngươi không được đi theo các luật lệ của họ[b].
  rationale: Bản sửa giữ sát hơn thành ngữ lặp lại כְּמַעֲשֵׂה אֶרֶץ mà không gán hành động theo nghĩa đen cho đất đai, tránh đại từ “người ta” kém trang trọng, và phục hồi hình ảnh “đi theo” cho לֹא תֵלֵכוּ. “Luật lệ” duy trì sắc thái chuẩn tắc của חֻקּוֹת, còn các khả năng từ vựng khác được bảo lưu trong chú thích.
  reviewer_model: gpt-5.6-terra
