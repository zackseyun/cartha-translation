source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: vi
  text: Các ngươi không được làm theo các việc làm của xứ Ai Cập[a], nơi các ngươi đã cư ngụ; cũng không được làm theo các việc làm của xứ Ca-na-an, nơi Ta đang đưa các ngươi đến. Các ngươi không được đi theo các luật lệ của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “theo việc làm của xứ Ai Cập”; vế nói về xứ Ca-na-an cũng có cùng cấu trúc. Thành ngữ Hê-bơ-rơ quy các việc làm hoặc tập tục cho vùng đất, ngụ ý các cư dân của vùng đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Các ngươi không được bước đi trong các quy định (hoặc tập tục) của họ.” “Đi/bước đi” là hình ảnh chỉ nếp sống và cách hành xử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: làm theo những gì người ta làm
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ, vốn nói sát nghĩa là “theo việc làm của đất”; “người ta” chỉ cư dân của vùng đất mà không thêm một đối tượng mới vào ý câu.
- source_word: אֶרֶץ מִצְרַיִם
  choice: đất Ai Cập
  rationale: Giữ yếu tố địa lý אֶרֶץ và là cách nói rõ ràng, tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: nơi các ngươi từng cư ngụ
  rationale: Phản ánh hành động cư trú trước đây tại Ai Cập; “từng” làm rõ quan hệ thời gian do ngữ cảnh xác định.
- source_word: לֹא תַעֲשׂוּ
  choice: các ngươi không được làm theo
  rationale: Trong văn cảnh luật pháp, lối cấm “không được” tự nhiên và có sức ràng buộc trong tiếng Việt hiện đại.
- source_word: וּכְמַעֲשֵׂה אֶרֶץ כְּנַעַן
  choice: cũng không được làm theo những gì người ta làm tại đất Ca-na-an
  rationale: Giữ cấu trúc song song với vế Ai Cập và chuyển thành ngữ quy các việc làm cho “đất” sang cách nói dễ hiểu về cư dân.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: nơi Ta đang đưa các ngươi đến
  rationale: “Đang đưa” phản ánh sắc thái tiến hành hoặc cận kề của phân từ מֵבִיא; “đến” thể hiện שָׁמָּה là đích đến.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: theo những quy định của họ
  rationale: חֻקּוֹת có thể chỉ các điều lệ, quy định hoặc tập tục cố định; “quy định” giữ sức nặng chuẩn tắc mà vẫn tự nhiên.
- source_word: לֹא תֵלֵכוּ
  choice: không được sống theo
  rationale: Động từ “đi/bước đi” được dùng ẩn dụ về cách sống; “sống theo” truyền đạt rõ nghĩa hành xử liên tục trong tiếng Việt, còn hình ảnh sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Có nên nói rõ các hành vi bị cấm là hành vi của cư dân Ai Cập và Ca-na-an thay vì của chính vùng đất hay không
  choice: “làm theo những gì người ta làm tại đất Ai Cập/Ca-na-an”
  alternative: “làm theo các việc làm của đất Ai Cập/Ca-na-an”
  rationale: Nguyên văn quy các “việc làm” cho vùng đất theo một thành ngữ. Bản dịch nêu cư dân hàm ẩn để tránh cách hiểu rằng đất đai tự hành động, nhưng không thu hẹp nội dung vào một loại tập tục riêng.
- issue: Nên dịch חֻקֹּתֵיהֶם theo nghĩa quy phạm hay tập quán
  choice: “những quy định của họ”
  alternative: “các tập tục của họ”
  rationale: “Quy định” bảo toàn sức nặng của những chuẩn mực cố định và sự tương phản với các quy định của Đức Chúa Trời trong văn cảnh; “tập tục” vẫn là một khả năng từ vựng nên được nêu ở chú thích.
- issue: Nên giữ nguyên ẩn dụ “bước đi” trong לֹא תֵלֵכוּ hay diễn nghĩa
  choice: “không được sống theo”
  alternative: “không được bước đi theo”
  rationale: “Sống theo” truyền đạt tự nhiên ý nghĩa ẩn dụ về lối sống và sự tuân theo, không biến mệnh lệnh thành lời cấm di chuyển theo nghĩa đen; chú thích bảo tồn hình ảnh nguyên ngữ.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. Dùng “các ngươi” cho ngôi thứ hai số nhiều hướng đến toàn thể cộng đồng, và “Ta” cho lời phán của Đức Chúa Trời. Giữ nhịp song song giữa Ai Cập và Ca-na-an; dùng “sống theo” để ẩn dụ Hê-bơ-rơ dễ hiểu với độc giả phổ thông.
