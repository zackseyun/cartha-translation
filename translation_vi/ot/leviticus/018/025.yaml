  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: vi
  text: Vì thế, đất trở nên ô uế[a]. Ta đã phạt đất ấy vì tội lỗi của nó[b], và đất đã mửa cư dân của nó ra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đất đã bị làm cho ô uế.” Động từ Hê-bơ-rơ có thể nhấn mạnh tình trạng đất trở nên ô uế hoặc việc đất bị làm cho ô uế.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “Ta đã xét phạt tội lỗi của nó trên nó.” Đây là một thành ngữ chỉ việc Đức Chúa Trời gọi tội lỗi của đất ra xét đoán và giáng phạt trên chính đất ấy.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “phun cư dân của nó ra.” Tiếng Hê-bơ-rơ giữ hình ảnh mạnh về sự nôn mửa để mô tả việc đất loại bỏ cư dân vì bị ô uế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: đã bị ô uế
  rationale: Động từ טמא diễn tả đất rơi vào tình trạng ô uế do các hành vi ghê tởm trong văn cảnh. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ sắc thái thụ động hoặc kết quả của nguyên ngữ.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Trong Lê-vi Ký 18, אֶרֶץ chỉ vùng đất cụ thể nơi các dân đang cư ngụ, chứ không phải toàn thể địa cầu.
- source_word: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  choice: Ta trừng phạt đất ấy vì tội lỗi của nó
  rationale: פקד đi với עון là thành ngữ về việc xét đến và buộc tội lỗi phải chịu phán xét. Cách dịch này diễn đạt rõ tác nhân thần linh và ý nghĩa trừng phạt, đồng thời tránh một cấu trúc dịch sát khó hiểu trong tiếng Việt.
- source_word: עֲוֺנָהּ
  choice: tội lỗi của nó
  rationale: עון có thể chỉ sự gian ác, tình trạng mắc tội hoặc hậu quả của tội. “Tội lỗi” giữ được sức nặng đạo đức và phù hợp với văn cảnh.
- source_word: וַתָּקִא
  choice: đã mửa ... ra
  rationale: קיא mang nghĩa cụ thể là “mửa, nôn ra.” Giữ hình ảnh mạnh này để bảo toàn phép nhân hóa về đất loại bỏ cư dân vì sự ô uế.
- source_word: יֹשְׁבֶיהָ
  choice: những cư dân của mình
  rationale: Phân từ của ישב chỉ tập thể những người đang cư ngụ trong đất; “những cư dân” vừa gọn vừa tự nhiên.
theological_decisions:
- issue: Phép nhân hóa đất như phản ứng trước sự ô uế
  choice: Giữ hình ảnh đất “mửa” cư dân ra.
  alternative: Dịch nhẹ hơn là “đất trục xuất cư dân.”
  rationale: Nguyên ngữ cố ý dùng hình ảnh cụ thể và mạnh, nối kết tội lỗi, sự ô uế, phán xét và việc bị loại khỏi đất.
- issue: Ý nghĩa của וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ trong sự phán xét của Đức Chúa Trời
  choice: Diễn đạt là “Ta trừng phạt đất ấy vì tội lỗi của nó.”
  alternative: Dịch sát thành “Ta viếng tội lỗi của nó trên nó” hoặc diễn giải là “Ta đòi nó chịu trách nhiệm về tội lỗi.”
  rationale: Câu này trực tiếp quy hành động phán xét cho Đức Chúa Trời. “Trừng phạt ... vì” truyền đạt rõ chức năng thành ngữ trong tiếng Việt mà không làm lu mờ tác nhân hay tính nghiêm trọng của tội.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Dùng “Ta” cho lời phán trực tiếp của Đức Chúa Trời. Giữ phép nhân hóa và hình ảnh mạnh của nguyên ngữ; điều chỉnh thành ngữ פקד עון sang cú pháp tiếng Việt tự nhiên.
