  to: Ngươi không được để lộ chỗ kín của một người phụ nữ và con gái bà ấy.[a] Ngươi không được lấy con gái của con trai bà ấy hoặc con gái của con gái bà ấy để lộ chỗ kín của bà ấy; họ là những người thân ruột thịt của bà ấy.[b] Đó là hành vi đồi bại.[c]
