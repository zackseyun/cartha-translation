source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: vi
  text: Ngươi không được để lộ chỗ kín của một người phụ nữ và con gái bà ấy.[a] Ngươi không được lấy con gái của con trai bà ấy hoặc con gái của con gái bà ấy để lộ chỗ kín của bà ấy; họ là những người thân ruột thịt của bà ấy.[b] Đó là hành vi đồi bại.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “để lộ chỗ kín” dịch thành ngữ Hê-bơ-rơ nghĩa đen là “phơi bày sự trần truồng”, chỉ quan hệ tình dục bị cấm.
    reason: cultural_note
  - marker: b
    text: Cụm “những người thân ruột thịt” dịch một từ có nghĩa đen là “thịt của bà ấy”, tức những người cùng huyết thống gần gũi.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “việc gian ác”, “việc dâm loạn” hoặc “hành vi ô nhục”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה / לְגַלּוֹת עֶרְוָתָהּ
  choice: phơi bày sự trần truồng của
  rationale: Giữ hình ảnh và sắc thái pháp lý của thành ngữ Hê-bơ-rơ, đồng thời chú thích rằng trong ngữ cảnh này thành ngữ chỉ quan hệ tình dục bị cấm.
- source_word: אִשָּׁה
  choice: một người đàn bà
  rationale: Danh từ có thể là “người đàn bà” hoặc “vợ”; ngữ cảnh không buộc phải hiểu là quan hệ hôn nhân, nên chọn nghĩa rộng hơn.
- source_word: תִקַּח
  choice: lấy
  rationale: Giữ độ rộng của động từ Hê-bơ-rơ, vốn trong ngữ cảnh có thể bao hàm việc lấy làm vợ hoặc kết hợp tình dục; không thu hẹp thành hôn nhân chính thức.
- source_word: בַּת בְּנָהּ / בַּת בִּתָּהּ
  choice: con gái của con trai bà ấy / con gái của con gái bà ấy
  rationale: Diễn đạt minh bạch cấu trúc thân tộc cụ thể của nguyên văn, thay vì dùng từ “cháu gái” vốn không phân biệt nhánh con trai và nhánh con gái.
- source_word: שַׁאֲרָה הֵנָּה
  choice: họ là người ruột thịt của bà ấy
  rationale: שְׁאֵר mang nghĩa thịt, huyết tộc hoặc thân thuộc gần; cách dịch này tự nhiên trong tiếng Việt và giữ hậu tố giống cái số ít “của bà ấy” trong nguyên văn.
- source_word: זִמָּה
  choice: một hành vi đồi bại
  rationale: Từ này lên án một hành vi xấu xa nghiêm trọng, đặc biệt có sắc thái nhục dục trong ngữ cảnh; “hành vi đồi bại” rõ nghĩa, trang trọng và không quá diễn giải.
theological_decisions:
- issue: Đối tượng của hậu tố giống cái số ít trong לְגַלּוֹת עֶרְוָתָהּ
  choice: Giữ là “sự trần truồng của bà ấy”, quy chiếu tự nhiên về người đàn bà ban đầu.
  alternative: Có thể hiểu theo lối phân phối, quy chiếu lần lượt đến mỗi người cháu gái vừa được nhắc đến.
  rationale: Cách dịch bằng đại từ “bà ấy” giữ nguyên liên kết ngữ pháp và sự căng nghĩa của bản Hê-bơ-rơ, không giải thích thêm vào chính văn.
- issue: Phạm vi của động từ תִקַּח trong luật cấm quan hệ cùng huyết tộc
  choice: Dịch là “lấy”, không giới hạn vào việc cưới hỏi chính thức.
  alternative: “lấy làm vợ” hoặc “cưới”
  rationale: Nguyên văn dùng động từ rộng hơn, còn cụm chỉ mục đích theo sau xác định bản chất tình dục của điều bị cấm.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dùng cú pháp tiếng Việt hiện đại. Đại từ “ngươi” duy trì lời truyền phán trực tiếp ở số ít. Các quan hệ thân tộc được viết đầy đủ để bảo toàn sự phân biệt giữa dòng con trai và dòng con gái; thành ngữ Hê-bơ-rơ được giữ trong chính văn và giải thích bằng chú thích.
