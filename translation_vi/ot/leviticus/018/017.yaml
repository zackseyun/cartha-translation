review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc cấm đoán, các quan hệ thân tộc theo cả nhánh con trai và con gái, động từ "lấy" không bị thu hẹp thành hôn nhân, và sự quy chiếu của "bà ấy" về người phụ nữ ban đầu. Tuy nhiên, "phơi bày sự trần truồng" là cách kết hợp từ không tự nhiên trong tiếng Việt; "chỗ kín" là thành ngữ Việt ngữ gần chức năng hơn, còn chú thích bảo lưu nghĩa thành ngữ Hê-bơ-rơ.
  naturalness: 'Cần chỉnh nhẹ để câu văn hiện đại, rõ và trang trọng hơn: "một người phụ nữ" tự nhiên hơn "một người đàn bà" trong văn bản luật; "những người thân ruột thịt" tự nhiên hơn dạng số ít "người ruột thịt" khi chủ ngữ là số nhiều. Bỏ "một" trong mệnh đề kết giúp lời kết cô đọng hơn.'
  terminology: '"Chỗ kín" trong chính văn, kèm chú thích về thành ngữ "phơi bày sự trần truồng", vừa tránh một cách nói gượng trong tiếng Việt vừa không khẳng định quá mức ngoài sắc thái uyển ngữ pháp lý của tiếng Hê-bơ-rơ. "Hành vi đồi bại" phản ánh phù hợp זִמָּה; chú thích thay "đáng ghê tởm" bằng phương án gần nghĩa hơn là "hành vi ô nhục".'
  issues:
  - severity: medium
    issue: Cụm "phơi bày sự trần truồng" thiếu tự nhiên trong tiếng Việt hiện đại.
    rationale: '"Sự trần truồng" không thường được dùng như một đối tượng sở hữu trong kết hợp này. "Để lộ chỗ kín" là cách nói Việt ngữ tự nhiên hơn, vẫn giữ tính uyển ngữ của thành ngữ nguồn và được giải thích bằng chú thích.'
  - severity: low
    issue: '"Người ruột thịt" không hòa hợp hoàn toàn với chủ ngữ số nhiều "họ".'
    rationale: Dùng "những người thân ruột thịt" diễn đạt rõ số nhiều và quan hệ huyết thống gần của שַׁאֲרָה הֵנָּה.
  - severity: low
    issue: '"Một người đàn bà" có thể mang sắc thái kém trung tính trong văn phong hiện đại.'
    rationale: '"Một người phụ nữ" là cách gọi rộng, trung tính và tự nhiên, phù hợp với nghĩa không nhất thiết là "vợ" của אִשָּׁה.'
