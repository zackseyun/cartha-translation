base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: vi
  text: Ngươi không được đến gần một phụ nữ đang trong tình trạng ô uế do kinh nguyệt để phơi bày sự lõa lồ của nàng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong tình trạng ô uế do kinh nguyệt của nàng.” Tiếng Hê-bơ-rơ dùng ngôn ngữ về thanh sạch và ô uế nghi lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה ... לֹא תִקְרַב
  choice: Con không được đến gần một người nữ
  rationale: Cấu trúc אֶל với קָרַב tạo thành ý 'đến gần'. 'Một người nữ' giữ phạm vi khái quát của אִשָּׁה, không tự ý giới hạn thành 'vợ'.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: trong thời gian ô uế vì kinh nguyệt của nàng
  rationale: Cách dịch này diễn đạt trạng thái liên quan đến kinh nguyệt, đồng thời giữ ngôn ngữ thanh sạch nghi lễ của טֻמְאָה trong sách Lê-vi.
- source_word: לְ/גַלּוֹת עֶרְוָתָהּ
  choice: để lộ sự trần truồng của nàng
  rationale: Giữ nguyên lối nói giảm nói tránh pháp lý 'lộ sự trần truồng' của chương 18, thay vì diễn giải rõ hơn nguồn Hê-bơ-rơ.
theological_decisions:
- issue: Nên hiểu ngôn ngữ ô uế theo nghĩa nghi lễ hay chỉ như một tình trạng sinh lý/y khoa
  choice: Giữ phạm trù ô uế nghi lễ
  alternative: Chỉ dịch là 'trong kỳ kinh nguyệt'
  rationale: טֻמְאָה là thuật ngữ về thanh sạch nghi lễ trong sách Lê-vi; bản dịch không biến phạm trù của văn bản thành một nhận định thuần túy y khoa hay đạo đức.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Đại từ 'con' phù hợp lời phán trực tiếp trong văn mạch luật pháp; 'người nữ' tránh đồng nhất אִשָּׁה với 'vợ'. Dấu chú thích [a] được đặt ngay sau câu.
