  source_fidelity: 'Bản nháp giữ đúng cấu trúc lệnh cấm, quan hệ “vợ của cha”, và mệnh đề kết “đó là sự trần truồng của cha con.” Tuy nhiên, “lột trần sự lõa lồ” không chuyển tải tự nhiên thành ngữ גלה ערוה: động từ “lột trần” thường cần một người hay một vật được cởi bỏ/khỏa lộ, còn “sự lõa lồ” là kết quả trừu tượng. Cần thay bằng cách diễn đạt thành ngữ phù hợp hơn mà vẫn không diễn giải thẳng trong chính văn.'
