  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: vi
  text: Con không được phơi bày sự trần truồng của vợ của cha con[a]; đó là sự trần truồng của cha con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “Con không được quan hệ tình dục với vợ của cha con.” Nguyên văn Hê-bơ-rơ nói theo nghĩa đen là “phơi bày sự trần truồng của”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: sự lõa lồ của
  rationale: Giữ lại thành ngữ pháp lý lặp đi lặp lại trong Lê-vi Ký 18, thay vì diễn giải trực tiếp là quan hệ tình dục; cách diễn đạt này cũng duy trì lối nói uyển ngữ trang nghiêm của nguyên văn.
- source_word: אֵשֶׁת אָבִיךָ
  choice: vợ cha mình
  rationale: אֵשֶׁת ở cấu trúc sở hữu với 'cha' chỉ người vợ của cha. 'Mình' quy chiếu tự nhiên về chủ thể 'con' trong mệnh lệnh.
- source_word: לֹא תְגַלֵּה
  choice: không được lột trần
  rationale: Thể chưa hoàn thành có phủ định trong văn luật được chuyển thành lệnh cấm 'không được'; 'lột trần' bảo tồn hình ảnh của động từ גלה và công thức nhất quán của đoạn.
- source_word: אָבִיךָ
  choice: cha con
  rationale: Chuyển đúng ngôi thứ hai số ít; ở vế sau dùng 'cha con' để rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: הִוא
  choice: đó là
  rationale: Đại từ giống cái quay lại danh từ giống cái עֶרְוָה, tức 'sự lõa lồ', chứ không đồng nhất người phụ nữ với cha; 'đó là' thể hiện đúng quan hệ quy chiếu này.
theological_decisions:
- issue: Có nên diễn giải rõ thành ngữ uyển ngữ thành lệnh cấm quan hệ tình dục hay không
  choice: Giữ thành ngữ 'lột trần sự lõa lồ' trong chính văn
  alternative: Con không được quan hệ tình dục với vợ của cha mình
  rationale: Nguyên văn dùng một công thức luật giao ước được lặp lại trong chương. Giữ thành ngữ bảo tồn cách diễn đạt và độ uyển ngữ của bản Hê-bơ-rơ; chú thích giải thích ý nghĩa pháp lý mà không thay thế hình ảnh nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng dễ hiểu trong tiếng Việt hiện đại. Đại từ 'con' phù hợp lời phán trực tiếp trong ngữ cảnh luật giao ước; cụm 'sự lõa lồ' có chủ ý giữ lối nói uyển ngữ của nguyên văn.
