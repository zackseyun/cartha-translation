    rationale: “Dòng dõi” có thể bao gồm mọi hậu duệ, kể cả các thế hệ sau; trong lệnh cấm này, từ “hạt giống/offspring” chỉ con cái được người nghe đem cho nghi lễ. Cụm “bất cứ ai” cũng không phù hợp với cách nói về con cái trong tiếng Việt.
  - severity: low
