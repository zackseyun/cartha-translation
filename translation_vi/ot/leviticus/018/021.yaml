source:
  edition: WLC
  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: vi
  text: Ngươi không được trao bất cứ ai trong số con cái mình[a] để khiến họ đi qua cho Mô-léc[b], và ngươi không được làm ô danh Đức Chúa Trời của ngươi. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “từ hạt giống của ngươi”; cũng có thể dịch là “bất cứ con cái nào của ngươi”.
    reason: lexical_alternative
  - marker: b
    text: Tức là tham dự một nghi lễ liên quan đến Mô-léc. Nhiều người hiểu đây là việc dâng trẻ em làm sinh tế, thường được mô tả ở những chỗ khác là khiến chúng “đi qua lửa”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: bất cứ ai trong dòng dõi mình
  rationale: זֶרַע theo nghĩa đen là “hạt giống”, nhưng trong luật này chỉ con cháu. Cách dịch này giữ sắc thái bộ phận của מִן và không giới hạn độ tuổi như “con cái” có thể gợi ra.
- source_word: תִתֵּן
  choice: không được trao
  rationale: נתן là động từ thông thường nghĩa là “trao, cho”; trong ngữ cảnh luật pháp, “không được” diễn đạt rõ lệnh cấm.
- source_word: לְהַעֲבִיר
  choice: để khiến họ đi qua
  rationale: Dạng Hiphil của עבר có nghĩa là “khiến cho đi qua”. Cách dịch giữ thành ngữ Hê-bơ-rơ và không tự ý thêm “lửa” hay xác quyết hình thức nghi lễ.
- source_word: לַמֹּלֶךְ
  choice: cho Mô-léc
  rationale: Cách đọc truyền thống xem מֹלֶךְ là tên riêng của thần liên quan đến nghi lễ bị cấm; phiên âm Mô-léc tự nhiên trong tiếng Việt.
- source_word: תְחַלֵּל
  choice: xúc phạm
  rationale: חלל ở thể Piel có nghĩa là làm ô uế, xúc phạm hoặc phạm thượng. “Xúc phạm danh” vừa tự nhiên vừa giữ sắc thái làm tổn hại sự thánh khiết và danh dự của danh Đức Chúa Trời.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: danh Đức Chúa Trời của ngươi
  rationale: Giữ nguyên sức nặng thần học của “danh”, biểu thị danh dự và uy tín được bày tỏ của Đức Chúa Trời trong bối cảnh giao ước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng יהוה thay vì thay thế bằng một tước hiệu, qua đó giữ sự phân biệt giữa danh riêng của Đức Chúa Trời và danh xưng chung.
theological_decisions:
- issue: Bản chất của lệnh cấm liên quan đến Mô-léc
  choice: Giữ thành ngữ “khiến họ đi qua” trong chính văn, không thêm “qua lửa” hay “làm sinh tế”.
  alternative: Dịch là “dâng con cái làm sinh tế cho Mô-léc” hoặc “khiến con cái đi qua lửa cho Mô-léc”.
  rationale: Câu Hê-bơ-rơ nói “trao… để khiến đi qua cho Mô-léc” nhưng không nêu rõ lửa. Các đoạn khác liên hệ nghi lễ này với việc dâng trẻ em và đi qua lửa, song chính văn ở đây nên giữ độ mở của nguyên bản; chú thích giải thích bối cảnh có khả năng nhất.
- issue: Phạm vi nghĩa của זֶרַע
  choice: Dịch là “dòng dõi” thay vì chỉ “con cái”.
  alternative: con cái; hạt giống
  rationale: Từ Hê-bơ-rơ rộng hơn một nhóm tuổi cụ thể và theo nghĩa đen là “hạt giống”; “dòng dõi” chính xác, tự nhiên và phù hợp văn phong luật pháp.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp, phù hợp thể luật. Dùng đại từ “ngươi/ta” để giữ giọng phán truyền có uy quyền; phiên âm tên thần là “Mô-léc” và giữ danh riêng “Yahweh”. Hai dấu chú thích được đặt ngay sau mệnh đề nghi lễ vì chú thích [a] giải thích đối tượng và [b] giải thích hành động.
