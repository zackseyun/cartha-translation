revisions:
- from: Ngươi không được trao bất cứ ai trong dòng dõi mình để khiến họ đi qua cho Mô-léc,[a][b] và ngươi không được xúc phạm danh Đức Chúa Trời của ngươi. Ta là Yahweh.
  to: Ngươi không được trao bất cứ ai trong số con cái mình[a] để khiến họ đi qua cho Mô-léc[b], và ngươi không được làm ô danh Đức Chúa Trời của ngươi. Ta là Yahweh.
  rationale: Sửa đối tượng của lệnh cấm để phản ánh chính xác hơn nghĩa ngữ cảnh của זֶרַע mà vẫn giữ sắc thái “từ/bất cứ ... nào” của מִן. Chuyển vị trí các ký hiệu chú thích để [a] neo trực tiếp vào cụm chỉ con cái và [b] neo vào Mô-léc/nghi lễ. Thay “xúc phạm danh” bằng “làm ô danh” để diễn đạt tự nhiên và sát hơn động từ חלל. Không thay đổi tính mơ hồ của nghi thức “khiến đi qua”, và không thêm yếu tố lửa vào chính văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:33Z'
