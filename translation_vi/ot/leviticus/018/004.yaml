source:
  edition: WLC
  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: vi
  text: Các ngươi phải làm theo các phán quyết của Ta và tuân giữ các luật lệ của Ta, để bước đi theo các điều ấy.[a] Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để sống theo các điều ấy.” Nguyên văn Hê-bơ-rơ là “để bước đi trong chúng,” một thành ngữ nói về việc định hướng đời sống theo các mệnh lệnh của Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: những phán quyết của ta
  rationale: Giữ sắc thái pháp lý của מִשְׁפָּט và phân biệt từ này với חֻקֹּתַי; trong ngữ cảnh luật giao ước, cụm từ chỉ những phán quyết hoặc quy định có thẩm quyền của Đức Chúa Trời.
- source_word: תַּעֲשׂוּ
  choice: phải thực hiện
  rationale: עשה có nghĩa cơ bản là “làm”; “thực hiện” tự nhiên hơn trong tiếng Việt khi đi với các phán quyết và diễn đạt việc đem chúng ra thi hành.
- source_word: חֻקֹּתַי
  choice: các luật lệ của ta
  rationale: חֻקָּה chỉ điều luật hoặc quy chế đã được ấn định. “Luật lệ” rõ nghĩa với độc giả phổ thông và vẫn khác với “phán quyết” ở vế trước.
- source_word: תִּשְׁמְרוּ
  choice: tuân giữ
  rationale: שׁמר vốn mang nghĩa giữ gìn, canh giữ; trong ngữ cảnh giao ước, “tuân giữ” diễn đạt sự cẩn trọng làm theo mà không chỉ là ghi nhớ.
- source_word: לָלֶכֶת בָּהֶם
  choice: để bước đi trong đó
  rationale: Giữ hình ảnh ẩn dụ “bước đi” của động từ הלך và quan hệ từ ב, qua đó diễn tả nếp sống được định hướng bởi các phán quyết và luật lệ; chú thích giải thích cách nói tự nhiên hơn là “sống theo đó”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: 'Dạng sở hữu ngôi thứ hai số nhiều diễn tả trực tiếp mối quan hệ giao ước: Yahweh là Đức Chúa Trời của cộng đồng đang được phán bảo.'
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của לָלֶכֶת בָּהֶם
  choice: để bước đi trong đó
  alternative: để sống theo đó
  rationale: Bản chính giữ ẩn dụ Hê-bơ-rơ về cách ăn ở, không âm thầm chuyển nó thành một cách diễn giải. Chú thích cung cấp ý nghĩa thành ngữ bằng tiếng Việt tự nhiên.
translation_notes:
  register: Văn phong trang trọng nhưng rõ ràng. “Các ngươi” thể hiện ngôi thứ hai số nhiều trong lời Đức Chúa Trời phán với cộng đồng; “phải” truyền đạt lực mệnh lệnh của các động từ. Bản dịch giữ ẩn dụ Hê-bơ-rơ trong câu chính và giải thích bằng chú thích.
