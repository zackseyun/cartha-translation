    rationale: “Vì” và “bởi” cùng đánh dấu quan hệ nguyên nhân, tạo cảm giác chồng lặp trong tiếng Việt. Nguyên văn chỉ có כִּי cộng với cụm בְּכָל־אֵלֶּה; có thể diễn đạt rõ bằng cách gắn “bởi tất cả những điều ấy” với mệnh đề “đã trở nên ô uế.”
