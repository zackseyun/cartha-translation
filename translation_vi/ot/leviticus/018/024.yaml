revisions:
- from: Đừng làm mình trở nên ô uế bởi bất cứ điều nào trong những điều này[a], vì bởi tất cả những điều ấy, các dân tộc mà Ta đang đuổi đi khỏi trước mặt các con đã trở nên ô uế.
  to: Đừng tự làm mình ô uế bởi bất cứ điều nào trong số những điều này, vì các dân tộc mà Ta đang đuổi đi khỏi trước mặt các con đã trở nên ô uế bởi tất cả những điều ấy[a].
  rationale: Bản chỉnh sửa loại bỏ lối diễn đạt chồng lặp, làm câu văn Việt tự nhiên hơn, và vẫn bảo toàn sự đối ứng từ vựng giữa hai lần טמא (“ô uế / trở nên ô uế”), tính phản thân ở mệnh đề lệnh cấm, cùng quan hệ nguyên nhân/phương tiện trong nguyên văn. Chú thích được giữ như một phương án từ vựng hợp lệ mà không quyết định quá mức sắc thái của Niphal.
