source:
  edition: WLC
  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: vi
  text: Đừng tự làm mình ô uế bởi bất cứ điều nào trong số những điều này, vì các dân tộc mà Ta đang đuổi đi khỏi trước mặt các con đã trở nên ô uế bởi tất cả những điều ấy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Đừng tự làm mình nhơ nhuốc bởi bất cứ điều nào trong số những điều này ... các dân tộc ... đã bị làm ô uế.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: Đừng làm mình trở nên ô uế
  rationale: אַל với thể vị hoàn thành diễn tả lệnh cấm; dạng Hitpael của טמא nhấn mạnh chính người nghe khiến mình rơi vào tình trạng ô uế.
- source_word: בְּכָל אֵלֶּה
  choice: bởi bất cứ điều nào trong những điều này
  rationale: בְּ chỉ phương tiện hoặc phạm vi; dưới lệnh phủ định, כָּל được diễn đạt tự nhiên là “bất cứ điều nào”.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do làm nền cho lệnh cấm.
- source_word: נִטְמְאוּ
  choice: đã trở nên ô uế
  rationale: Dạng Niphal của טמא diễn tả trạng thái kết quả, đồng thời duy trì nhất quán từ vựng với mệnh đề đầu.
- source_word: הַגּוֹיִם
  choice: các dân tộc
  rationale: Trong ngữ cảnh này, từ chỉ những cộng đồng không thuộc Y-sơ-ra-ên đang cư ngụ trong xứ; “các dân tộc” tránh sắc thái hậu kỳ của cách gọi “dân ngoại”.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: mà Ta đang đuổi đi
  rationale: Trong bối cảnh phán xét và chiếm hữu đất, שׁלח mang nghĩa trục xuất, không chỉ đơn thuần là sai đi.
- source_word: מִפְּנֵיכֶם
  choice: khỏi trước mặt các con
  rationale: Giữ hình ảnh không gian của nguyên văn, nói đến việc các dân bị loại khỏi trước sự hiện diện và bước tiến của Y-sơ-ra-ên.
theological_decisions:
- issue: Thuật ngữ ô uế mang chiều kích nghi lễ và đạo đức trong Lê-vi Ký 18
  choice: ô uế / trở nên ô uế
  alternative: làm nhơ nhuốc / bị làm ô uế
  rationale: “Ô uế” bảo tồn phạm trù đặc trưng của Lê-vi Ký mà không thu hẹp nó thành điều chỉ thuộc nghi lễ hoặc làm tăng sắc thái tu từ. Chú thích ghi nhận cách hiểu “làm nhơ nhuốc/bị làm ô uế” vốn cũng có cơ sở từ động từ טמא.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” và “các con” thể hiện lời Đức Chúa Trời phán trực tiếp với cộng đồng. Cấu trúc hơi lặp lại “những điều” có chủ ý để phản ánh phép lặp trong tiếng Hê-bơ-rơ.
