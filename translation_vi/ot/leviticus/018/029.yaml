revisions:
- from: Vì bất cứ ai làm một trong tất cả những điều ghê tởm này, thì những người làm các điều ấy sẽ bị loại khỏi[a] dân mình.
  to: Vì bất cứ ai làm bất cứ điều nào trong những điều ghê tởm này, những người làm các điều ấy sẽ bị cắt đứt[a] khỏi dân mình.
  rationale: Bản sửa thay cách diễn đạt phân phần chưa tự nhiên bằng “bất cứ điều nào trong những điều ghê tởm này”, đồng thời phục hồi thành ngữ pháp lý “bị cắt đứt” trong thân văn. Chú thích tiếp tục nêu các khả năng diễn giải mà không quyết định thay cho nguyên ngữ.
  reviewer_model: gpt-5.6-terra
