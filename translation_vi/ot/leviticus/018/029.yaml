id: LEV.18.29
reference: Leviticus 18:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: vi
  text: Vì bất cứ ai làm bất cứ điều nào trong những điều ghê tởm này, những người làm các điều ấy sẽ bị cắt đứt[a] khỏi dân mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “sẽ bị cắt đứt”; cũng có thể được hiểu là “sẽ bị xử tử” hoặc “sẽ bị loại trừ khỏi cộng đồng.” Tiếng Hê-bơ-rơ không cho biết chính xác hình thức phán xét.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích/lập luận nối với các điều cấm và lời cảnh báo ở phần trước.
- source_word: כָּל אֲשֶׁר
  choice: bất cứ ai
  rationale: 'Diễn đạt tự nhiên cấu trúc quan hệ bất định mang nghĩa phổ quát: mọi người, không trừ ai.'
- source_word: יַעֲשֶׂה
  choice: làm
  rationale: Giữ nghĩa rộng và cơ bản của động từ, không thu hẹp thành một thuật ngữ đạo đức chuyên biệt.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: một trong tất cả những điều ghê tởm này
  rationale: Thể hiện cả sắc thái phân phần của מִן và phạm vi toàn thể của כֹּל, đồng thời vẫn rõ nghĩa trong tiếng Việt.
- source_word: תּוֹעֵבוֹת
  choice: những điều ghê tởm
  rationale: Truyền đạt sức nặng đạo đức và nghi lễ của danh từ trong ngữ cảnh luật thánh khiết mà không diễn giải quá mức.
- source_word: וְנִכְרְתוּ
  choice: sẽ bị loại khỏi
  rationale: Cụm tiếng Việt giữ hình ảnh bị tách khỏi cộng đồng và không xác định chính xác hình thức thi hành phán quyết; chú thích nêu rõ độ mở của thành ngữ Hê-bơ-rơ.
- source_word: הַנְּפָשׁוֹת
  choice: những người
  rationale: Trong văn cảnh pháp luật, נֶפֶשׁ chỉ con người/cá nhân; cách dịch này tránh hàm ý nhị nguyên không có trong câu.
- source_word: הָעֹשֹׂת
  choice: làm các điều ấy
  rationale: Phân từ xác định chính những người thực hiện các điều ghê tởm vừa được nhắc đến.
- source_word: מִקֶּרֶב עַמָּם
  choice: khỏi dân mình
  rationale: Diễn đạt gọn và tự nhiên công thức chỉ việc bị tách khỏi cộng đồng giao ước; đại từ số ít tập thể phù hợp cách dùng tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của công thức hình phạt וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  choice: sẽ bị loại khỏi dân mình
  alternative: sẽ bị xử tử; sẽ bị khai trừ khỏi cộng đồng
  rationale: Công thức pháp lý Hê-bơ-rơ không tự xác định đây là sự phán xét trực tiếp của Đức Chúa Trời, án tử do con người thi hành hay sự trục xuất. Bản dịch chính giữ độ mở ấy thay vì chọn một cách giải thích hẹp.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại, dễ hiểu. Dùng “điều ghê tởm” để giữ sức nặng của nguyên ngữ; dùng “bị loại khỏi” trong câu chính cho tiếng Việt tự nhiên, còn chú thích bảo tồn hình ảnh nguyên văn và sự không xác định về hình thức hình phạt.
