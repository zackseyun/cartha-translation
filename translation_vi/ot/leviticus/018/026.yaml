revisions:
- from: Nhưng chính các ngươi phải tuân giữ các luật lệ và phán quyết của ta, không được làm bất cứ điều ghê tởm nào trong những điều này, dù là người bản xứ hay ngoại kiều cư ngụ giữa các ngươi.[a]
  to: Nhưng chính các ngươi phải tuân giữ các luật lệ và quy định của Ta. Cả người bản xứ lẫn người ngoại quốc cư ngụ giữa các ngươi đều không được làm bất cứ điều nào trong số những điều ghê tởm này.[a]
  rationale: Bản sửa làm rõ cấu trúc cú pháp áp dụng điều cấm cho cả người bản xứ và người không phải bản xứ cư trú, chỉnh cụm diễn đạt tập hợp các điều ghê tởm cho tự nhiên và sát nghĩa hơn, và dùng thuật ngữ pháp lý hiện đại, rõ nghĩa. Không thêm diễn giải thần học vượt quá câu văn.
