  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: vi
  text: Nhưng chính các ngươi phải tuân giữ các luật lệ và quy định của Ta. Cả người bản xứ lẫn người ngoại quốc cư ngụ giữa các ngươi đều không được làm bất cứ điều nào trong số những điều ghê tởm này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “người kiều ngụ đang sống giữa các ngươi.”'
    reason: Giải thích cách dịch khác của גֵּר và הַגָּר; thuật ngữ này chỉ người không phải bản xứ cư trú trong cộng đồng.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: phải tuân giữ
  rationale: Trong văn cảnh luật giao ước, שׁמר mang nghĩa tuân giữ, giữ gìn và thi hành. “Phải tuân giữ” diễn đạt rõ sức nặng mệnh lệnh trong tiếng Việt hiện đại.
- source_word: אַתֶּם
  choice: chính các ngươi
  rationale: Đại từ độc lập nhấn mạnh chủ thể bên cạnh hình thái động từ. “Chính các ngươi” giữ được nét nhấn mạnh ấy.
- source_word: חֻקֹּתַי
  choice: các luật lệ của ta
  rationale: חֻקִּים chỉ những quy định đã được ấn định. “Luật lệ” tự nhiên, dễ hiểu và vẫn giữ sắc thái pháp lý.
- source_word: מִשְׁפָּטַי
  choice: phán quyết của ta
  rationale: מִשְׁפָּטִים có thể chỉ các phán quyết hoặc quy định pháp lý. “Phán quyết” duy trì nét tư pháp và phân biệt tương đối với “luật lệ”.
- source_word: תַעֲשׂוּ
  choice: làm
  rationale: עשה là động từ rộng, trực tiếp nói đến việc thực hiện các hành vi bị cấm; không cần thêm hàm ý lặp đi lặp lại.
- source_word: מִכֹּל
  choice: bất cứ ... nào
  rationale: Kết hợp với phủ định, מן + כל diễn đạt sự cấm đoán toàn diện; cấu trúc “bất cứ ... nào” là tự nhiên trong tiếng Việt.
- source_word: הַתּוֹעֵבֹת
  choice: điều ghê tởm
  rationale: תּוֹעֵבָה mang sức đánh giá mạnh đối với điều đáng ghê tởm về luân lý hoặc nghi lễ. Cách dịch này rõ nghĩa mà không làm nhẹ sắc thái.
- source_word: הָאֶזְרָח
  choice: người bản xứ
  rationale: אֶזְרָח chỉ người thuộc dân bản địa trong cộng đồng, đối lập với גֵּר. “Người bản xứ” rõ ràng hơn “công dân”, vốn dễ gợi khái niệm nhà nước hiện đại.
- source_word: הַגֵּר
  choice: ngoại kiều
  rationale: גֵּר là người không phải bản xứ nhưng cư trú trong cộng đồng và chịu các nghĩa vụ liên quan. “Ngoại kiều” ngắn gọn, giữ được cả yếu tố ngoại quốc lẫn cư trú.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: cư ngụ giữa các ngươi
  rationale: Phân từ nhắc lại địa vị cư trú của גֵּר. “Cư ngụ giữa các ngươi” giữ ý sống thường trú trong cộng đồng mà không lặp từ vụng về.
theological_decisions:
- issue: Phạm vi điều cấm đối với người bản xứ và người ngoại kiều
  choice: Cả người bản xứ lẫn ngoại kiều cư ngụ giữa Israel đều nằm dưới điều cấm.
  alternative: Cụm cuối có thể được hiểu đơn thuần là phần đồng vị nêu các nhóm chịu mệnh lệnh, không chủ ý nhấn mạnh sự bình đẳng giữa họ.
  rationale: Cú pháp đặt הָאֶזְרָח và הַגֵּר như hai nhóm cùng liên hệ với mệnh lệnh phủ định; bản dịch giữ cả hai trong cùng một phạm vi nghĩa vụ mà không thêm một tuyên bố thần học rộng hơn câu văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “các ngươi” để giữ ngôi số nhiều và sắc thái trang nghiêm của lời phán; dùng “chính” để thể hiện sự nhấn mạnh của אַתֶּם. Dấu chú thích [a] được đặt ngay sau cụm mà chú thích giải nghĩa.
