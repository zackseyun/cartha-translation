revisions:
- from: Không một người nào trong các ngươi được đến gần bất cứ người bà con ruột thịt nào để lột trần sự lõa lồ[a]. Ta là Yahweh.
  to: Không một người nào trong các ngươi được đến gần bất cứ người thân ruột thịt nào để phơi bày sự trần truồng[a]. Ta là Yahweh.
  rationale: Sửa thành ngữ chính văn thành «phơi bày sự trần truồng» để phản ánh sát גלה ערוה bằng tiếng Việt hiện đại, đồng thời giữ tính thành ngữ và sự không hoàn toàn cụ thể của nguyên văn. Chú thích được chỉnh cho tự nhiên và tránh giới hạn thành ngữ vào một dạng hành vi duy nhất. Các yếu tố còn lại, gồm tính phân phối của lệnh cấm và danh Yahweh, được giữ nguyên.
  reviewer_model: gpt-5.6-terra
