source:
  edition: WLC
  text: אִ֥ישׁ אִישׁ֙ אֶל כָּל שְׁאֵ֣ר בְּשָׂר֔/וֹ לֹ֥א תִקְרְב֖וּ לְ/גַלּ֣וֹת עֶרְוָ֑ה אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: vi
  text: Không một người nào trong các ngươi được đến gần bất cứ người thân ruột thịt nào để phơi bày sự trần truồng[a]. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “phơi bày sự trần truồng”, một thành ngữ pháp lý trong chương này chỉ hành vi tình dục bị cấm liên quan đến người thân gần.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Không một người nào trong các ngươi
  rationale: Cách lặp danh từ số ít mang nghĩa phân phối, nhấn mạnh từng cá nhân. Cách dịch này kết hợp tự nhiên với lệnh cấm; “trong các ngươi” được bổ sung theo ngữ cảnh cộng đồng của luật.
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: người bà con ruột thịt
  rationale: Diễn đạt quan hệ thân thuộc gần gũi dựa trên huyết thống/thân xác, bằng tiếng Việt hiện đại và dễ hiểu.
- source_word: לֹא תִקְרְבוּ
  choice: không ... được đến gần
  rationale: Giữ hình ảnh “đến gần” của động từ קָרַב và thể hiện rõ lực cấm của cấu trúc phủ định trong văn luật.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: để lột trần sự lõa lồ
  rationale: Giữ thành ngữ pháp lý lặp lại trong chương thay vì diễn giải thẳng thành quan hệ tình dục; chú thích giải thích phạm vi nghĩa.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Giữ công thức tự xưng trang trọng và phiên âm trực tiếp danh riêng giao ước יהוה.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Có diễn giải rõ thành ngữ tình dục trong chính văn hay không
  choice: Giữ thành ngữ “lột trần sự lõa lồ” trong chính văn
  alternative: để quan hệ tình dục với
  rationale: Thành ngữ này là mô-típ pháp lý được lặp lại xuyên suốt chương 18. Giữ nó bảo tồn hình ảnh và độ rộng nghĩa của nguyên văn; chú thích giúp độc giả hiện đại hiểu hàm ý.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Các ngươi” và “Ta” duy trì sắc thái giao ước; thành ngữ nguồn được giữ trong chính văn và được giải thích bằng chú thích.
