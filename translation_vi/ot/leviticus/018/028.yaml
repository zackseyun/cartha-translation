  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: vi
  text: để đất không mửa các ngươi ra khi các ngươi làm ô uế nó,[a] như đã mửa ra dân tộc ở trước các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nôn các ngươi ra.” Tiếng Hê-bơ-rơ dùng hình ảnh sống động về đất tống cư dân của nó ra vì bị làm ô uế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: mửa ... ra / đã mửa ... ra
  rationale: Giữ nguyên hình ảnh trục xuất mạnh và sống động của động từ קיא. “Mửa ... ra” tự nhiên hơn “nôn ... ra” khi chủ thể được nhân cách hóa là đất, đồng thời không làm nhẹ ẩn dụ thành “đuổi đi”.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Trong ngữ cảnh Lê-vi Ký 18, từ này chỉ miền đất Ca-na-an chứ không phải toàn thể trái đất. Tiếng Việt có thể dùng “đất” tự nhiên khi đất được nhân cách hóa.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: khi các ngươi làm ô uế nó
  rationale: בְּ với động từ nguyên mẫu có thể mang sắc thái thời gian hoặc phương tiện. “Khi” diễn đạt tự nhiên lời cảnh báo, còn “làm ô uế” giữ nghĩa tác động của dạng Piel טמא.
- source_word: הַגּוֹי
  choice: dân tộc
  rationale: Danh từ số ít mang nghĩa tập thể, chỉ nhóm cư dân trước đó. “Dân tộc” giữ số ít và tránh đưa vào sắc thái thần học về “dân ngoại” không được nói rõ tại đây.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: từng ở đó trước các ngươi
  rationale: Cụm từ nói đến dân cư đã sống trong miền đất trước Israel. Thêm “ở đó” làm rõ quan hệ không gian-thời gian vốn hiển nhiên trong ngữ cảnh mà không đổi nghĩa.
- source_word: וְלֹא
  choice: để ... không
  rationale: Trong mạch văn, liên từ với phủ định có chức năng chỉ mục đích hoặc kết quả phủ định. “Để ... không” là cách diễn đạt hiện đại, gọn và phù hợp với quan hệ cú pháp nối từ câu trước.
theological_decisions:
- issue: Nhân cách hóa đất như tác nhân phán xét
  choice: Giữ “đất” làm chủ thể ngữ pháp thực hiện hành động “mửa ... ra”.
  alternative: Diễn giải trừu tượng rằng Đức Chúa Trời dùng đất để trục xuất cư dân.
  rationale: Tiếng Hê-bơ-rơ trực tiếp nhân cách hóa đất như phản ứng trước sự ô uế. Giữ hình ảnh này bảo toàn chiều sâu thần học của phân đoạn mà không phủ nhận quyền tể trị tối hậu của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “các ngươi” để phù hợp lời phán hướng đến toàn thể cộng đồng và giữ sắc thái Kinh Thánh trang nghiêm; dùng “mửa” nhằm bảo toàn sức mạnh gây ấn tượng của ẩn dụ gốc.
