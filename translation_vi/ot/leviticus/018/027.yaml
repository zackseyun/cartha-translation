id: LEV.18.27
reference: Leviticus 18:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: vi
  text: Vì những người trong xứ, những người ở trước các ngươi, đã làm mọi điều ghê tởm ấy, và xứ trở nên ô uế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và xứ bị ô uế.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do của lời cấm và cảnh báo ở trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: mọi điều ghê tởm ấy
  rationale: Diễn đạt đầy đủ số nhiều và sắc thái chỉ định, đồng thời giữ sức nặng đạo đức-giao ước của תּוֹעֵבָה bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: עָשׂוּ
  choice: đã làm
  rationale: Dịch trực tiếp động từ thông dụng עשה, không áp đặt một sắc thái pháp lý hay nghi lễ chuyên biệt.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: những người sống trong xứ
  rationale: Cụm Hê-bơ-rơ theo hình thức là 'những người đàn ông của xứ' nhưng có chức năng tập thể, chỉ cư dân trước đó; cách dịch này truyền đạt đúng sở chỉ trong tiếng Việt tự nhiên mà không ngụ ý chỉ riêng nam giới.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: trước các ngươi
  rationale: 'Giữ ý nghĩa thời gian: những cư dân có mặt trước cộng đồng đang được phán bảo.'
- source_word: וַתִּטְמָא
  choice: khiến ... bị ô uế
  rationale: Cấu trúc kết quả tự nhiên trong tiếng Việt, thể hiện đất đã trở nên ô uế do các hành vi vừa nêu mà không thu hẹp sự ô uế thành hoàn toàn nghi lễ hay hoàn toàn ẩn dụ.
- source_word: הָאָרֶץ
  choice: xứ
  rationale: Ngữ cảnh nói đến lãnh thổ cụ thể chứ không phải toàn thể địa cầu; 'xứ' cũng duy trì sự liên kết với cụm 'người sống trong xứ'.
theological_decisions:
- issue: Bản chất sự ô uế của xứ
  choice: xứ bị ô uế
  alternative: xứ trở nên không thanh sạch
  rationale: Giữ mối liên hệ thần học-đạo đức trong nguyên văn giữa hành vi của cư dân và tình trạng ô uế của đất, nhưng không xác định tình trạng ấy chỉ mang tính nghi lễ hay chỉ mang nghĩa bóng.
- issue: Quan hệ cú pháp giữa hành vi và tình trạng của xứ
  choice: khiến xứ bị ô uế
  alternative: và xứ trở nên ô uế
  rationale: Liên từ וַ trong mạch văn biểu thị hệ quả; 'khiến' làm rõ quan hệ vốn hiện diện trong câu mà không thêm một tác nhân thần học không được nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ lối xưng hô số nhiều trực tiếp trong diễn từ luật pháp; dùng “xứ” cho lãnh thổ cụ thể. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
