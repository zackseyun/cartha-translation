revisions:
- from: Ngươi không được lấy chị em của vợ mình làm vợ lẽ để khiến họ trở thành tình địch[a], mà ăn nằm với người ấy khi vợ mình vẫn còn sống.
  to: Ngươi không được lấy một người nữ làm vợ cùng với chị hoặc em gái của người ấy, khiến họ trở thành tình địch, để ăn nằm với người nữ ấy khi chị hoặc em gái của người ấy còn sống.[a]
  rationale: Bản sửa loại bỏ cách gọi “vợ lẽ” mang tính diễn giải, nêu rõ “chị hoặc em gái” thay vì cụm có thể bao hàm anh/em trai hoặc số nhiều, và đổi liên từ sang cấu trúc mục đích phù hợp với nguyên văn. Bản dịch vẫn giới hạn điều cấm trong thời gian người chị/em gái đầu tiên còn sống, không mở rộng phạm vi của luật.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:32Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp nêu đúng phạm vi thời gian của điều cấm và giữ ý về sự đối địch, nhưng “vợ lẽ” thêm một phân loại không có trong tiếng Hê-bơ-rơ; văn bản nói về một người nữ được lấy thêm làm vợ, không xác định địa vị là thiếp. “Mà ăn nằm” cũng tạo quan hệ đối lập không có trong nguyên văn; לְגַלּוֹת diễn tả mục đích/hệ quả của việc lấy người nữ ấy.
  naturalness: “Chị em của vợ mình” có thể được hiểu là nhiều người anh/chị/em hoặc bao gồm cả anh/em trai, trong khi אֲחֹת chỉ chị/em gái. Cách lặp lại có kiểm soát “chị hoặc em gái” và “người nữ ấy” làm rõ các quy chiếu mà vẫn tự nhiên trong văn phong pháp luật hiện đại.
  terminology: Dùng “làm vợ” thay cho “làm vợ lẽ” tránh diễn giải về địa vị hôn nhân. “Ăn nằm” là uyển ngữ tiếng Việt phù hợp với cách nói uyển ngữ của לְגַלּוֹת עֶרְוָה; “khiến họ trở thành tình địch” diễn đạt đúng לִצְרֹר.
  issues:
  - severity: high
    issue: “làm vợ lẽ” thêm ý về địa vị hôn nhân không được nguyên văn xác định.
    rationale: אִשָּׁה trong ngữ cảnh này là người nữ/vợ được lấy thêm; bản văn không gọi người ấy là thiếp hoặc vợ lẽ.
  - severity: medium
    issue: “mà ăn nằm” dịch sai liên kết cú pháp.
    rationale: Lְגַלּוֹת là cụm mục đích đi với lệnh cấm, không phải một mệnh đề tương phản.
  - severity: medium
    issue: “chị em của vợ mình” không giữ rõ giới tính và số ít của אֲחֹתָהּ.
    rationale: Cần chỉ rõ là chị hoặc em gái của người nữ thứ nhất; cách hiện tại có thể gợi các anh chị em nói chung.
