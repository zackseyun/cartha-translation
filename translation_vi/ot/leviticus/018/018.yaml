source:
  edition: WLC
  text: וְ/אִשָּׁ֥ה אֶל אֲחֹתָ֖/הּ לֹ֣א תִקָּ֑ח לִ/צְרֹ֗ר לְ/גַלּ֧וֹת עֶרְוָתָ֛/הּ עָלֶ֖י/הָ בְּ/חַיֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: vi
  text: Ngươi không được lấy một người nữ làm vợ cùng với chị hoặc em gái của người ấy, khiến họ trở thành tình địch, để ăn nằm với người nữ ấy khi chị hoặc em gái của người ấy còn sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ngươi không được lấy một người nữ bên cạnh chị hoặc em gái của nàng để khiến nàng thành tình địch.” Câu Hê-bơ-rơ cô đọng; ý nói không được lấy chị hoặc em gái của một người vợ làm vợ thêm khi người vợ ấy còn sống.'
    reason: Nêu một cách diễn đạt gần hơn với cấu trúc Hê-bơ-rơ và giải thích quan hệ giữa các đại từ.
lexical_decisions:
- source_word: וְאִשָּׁה אֶל אֲחֹתָהּ
  choice: chị em của vợ mình ... làm vợ lẽ
  rationale: Thành ngữ Hê-bơ-rơ nói đến việc lấy một phụ nữ bên cạnh chị hoặc em của nàng. Tiếng Việt cần diễn đạt rõ quan hệ hôn nhân; “chị em” giữ nguyên sự không xác định về người chị hay người em, còn “vợ lẽ” truyền đạt đây là người vợ được lấy thêm khi người vợ trước vẫn sống.
- source_word: לֹא תִקָּח
  choice: Ngươi không được lấy
  rationale: Đây là lệnh cấm pháp lý. “Không được” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ giọng trang trọng của luật pháp.
- source_word: לִצְרֹר
  choice: để khiến họ trở thành tình địch
  rationale: Động từ diễn tả việc tạo nên quan hệ đối địch hoặc ganh đua. Cách dịch này giữ sắc thái mục đích/kết quả và không gộp toàn bộ ý vào danh từ “vợ lẽ”.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: mà ăn nằm với người ấy
  rationale: Cụm từ nguyên văn là “phơi bày sự lõa lồ của nàng,” một uyển ngữ Lê-vi ký chỉ quan hệ tình dục. “Ăn nằm với” là uyển ngữ tự nhiên, trang nghiêm và dễ hiểu trong tiếng Việt.
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: khi vợ mình vẫn còn sống
  rationale: Cụm cuối giới hạn điều cấm vào thời gian người chị/em đã được lấy làm vợ còn sống. Nêu “vợ mình” giúp làm rõ quy chiếu vốn có thể mơ hồ nếu dịch sát từng chữ sang tiếng Việt.
theological_decisions:
- issue: Phạm vi điều cấm đối với việc lấy hai chị em làm vợ
  choice: Cấm lấy chị hoặc em của người vợ làm người vợ bổ sung trong khi người vợ ấy còn sống.
  alternative: Cấm kết hôn với cả hai chị em trong mọi hoàn cảnh, kể cả sau khi người thứ nhất qua đời.
  rationale: Cụm בְּחַיֶּיהָ, “trong lúc nàng còn sống,” xác định rõ giới hạn thời gian. Bản dịch không mở rộng điều cấm vượt quá điều câu Hê-bơ-rơ nói rõ.
- issue: Sắc thái của לִצְרֹר
  choice: Giữ ý rằng việc lấy thêm người chị/em khiến hai người thành tình địch.
  alternative: Hiểu câu này chỉ như một lệnh cấm quan hệ hôn nhân giữa hai chị em, không biểu đạt yếu tố đối địch.
  rationale: לִצְרֹר mang sắc thái gây đối nghịch hoặc biến thành tình địch; giữ yếu tố này bảo tồn sức căng và lý do được diễn đạt trong nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “ngươi” để duy trì lời truyền phán trực tiếp ở số ít; “chị em” bảo tồn tính không xác định giữa chị và em. Uyển ngữ tình dục được chuyển thành cách nói tiếng Việt tự nhiên thay vì mô phỏng cứng nhắc hình ảnh “phơi bày sự lõa lồ”.
