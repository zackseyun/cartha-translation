source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחוֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה שְׁאֵ֥ר אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: vi
  text: Con không được phơi bày sự trần truồng của cô con[a]; vì cô là người ruột thịt của cha con.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong Lê-vi Ký, “phơi bày sự trần truồng của” là một thành ngữ pháp lý chỉ sự phơi bày thân thể hoặc quan hệ tình dục bị cấm.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “cô là thịt của cha con”; nghĩa là người có quan hệ huyết thống gần gũi với cha con.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: sự trần truồng của
  rationale: Giữ hình ảnh pháp lý của nguyên văn và tính nhất quán với công thức lặp lại trong Lê-vi Ký 18; chú thích làm rõ hàm ý tình dục của thành ngữ.
- source_word: תְגַלֵּה
  choice: không được phơi bày
  rationale: Động từ ở thể Piel kết hợp với עֶרְוָה tạo thành công thức cấm đoán. “Phơi bày” tự nhiên hơn “khám phá” trong tiếng Việt hiện đại mà vẫn giữ hình ảnh của tiếng Hê-bơ-rơ.
- source_word: אֲחוֹת אָבִיךָ
  choice: cô mình
  rationale: Trong cách gọi thân tộc tiếng Việt, “cô” chỉ chị hoặc em gái của cha, diễn đạt chính xác và tự nhiên cụm “chị/em gái của cha con.”
- source_word: שְׁאֵר
  choice: người ruột thịt
  rationale: Trong ngữ cảnh thân tộc, từ này chỉ quan hệ gần gũi về huyết thống, theo nghĩa gốc gắn với “thịt.” “Người ruột thịt” vừa tự nhiên vừa giữ được sắc thái thân thể và huyết tộc.
- source_word: הִוא
  choice: cô ấy là
  rationale: Đại từ giống cái xác định người phụ nữ ấy thuộc quan hệ thân tộc bị luật này nhắc đến; cách diễn đạt đơn giản, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Cách dịch thành ngữ pháp lý về quan hệ tình dục bị cấm
  choice: Giữ hình ảnh “phơi bày sự trần truồng” trong chính văn.
  alternative: Diễn ý thành “quan hệ tình dục với.”
  rationale: Nguyên văn dùng một công thức pháp lý giàu hình ảnh xuyên suốt chương 18. Giữ công thức này bảo toàn sự liên kết nội văn và không thu hẹp hoặc giải thích quá mức điều tiếng Hê-bơ-rơ trực tiếp nói; chú thích cung cấp hàm ý trong ngữ cảnh.
- issue: Sắc thái của שְׁאֵר אָבִיךָ
  choice: Dịch là “người ruột thịt của cha con.”
  alternative: Dịch sát chữ là “thịt của cha con.”
  rationale: “Người ruột thịt” giữ ý niệm cùng huyết nhục và quan hệ thân tộc gần gũi, đồng thời tránh một câu tối nghĩa hoặc thiếu tự nhiên trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “con” theo lối diễn đạt trực tiếp của luật dành cho người nghe; dùng thuật ngữ thân tộc tự nhiên “cô” thay cho cụm giải thích dài. Giữ thành ngữ nguồn trong chính văn và giải nghĩa ngắn gọn ở chú thích.
