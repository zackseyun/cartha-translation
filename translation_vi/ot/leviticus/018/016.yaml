  yaml_path: translation/ot/leviticus/018/016.yaml
  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: vi
  text: Ngươi không được phơi bày sự trần truồng của vợ người anh em ngươi[a]; đó là sự trần truồng của người anh em ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “Ngươi không được quan hệ tình dục với vợ người anh em ngươi.” Tiếng Hê-bơ-rơ dùng thành ngữ “phơi bày sự trần truồng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: sự trần truồng của
  rationale: Giữ hình ảnh và sự lặp lại của danh từ Hê-bơ-rơ עֶרְוָה trong công thức pháp lý uyển ngữ của Lê-vi Ký 18, thay vì trực tiếp diễn giải thành hành vi tình dục.
- source_word: אֵשֶׁת אָחִיךָ
  choice: vợ anh em mình
  rationale: אֵשֶׁת ở trạng thái liên kết chỉ người vợ; אָחִיךָ là anh hoặc em trai. Cách nói “anh em mình” tự nhiên hơn trong mệnh lệnh tiếng Việt và không buộc phải xác định người ấy lớn hay nhỏ tuổi hơn.
- source_word: לֹא תְגַלֵּה
  choice: không được phơi bày
  rationale: לֹא với thể vị hoàn thành trong văn luật diễn đạt điều cấm. “Không được” có sắc thái pháp lý rõ ràng; “phơi bày” giữ được động tác ẩn dụ của גלה mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: đó là sự trần truồng của anh em ngươi
  rationale: Giữ nguyên sự lặp lại của עֶרְוָה và lý do pháp lý-thân tộc trong nguyên văn, không chuyển thành cách giải thích như “nàng thuộc về anh em ngươi”.
theological_decisions:
- issue: Có nên diễn giải trực tiếp thành lệnh cấm quan hệ tình dục hay giữ uyển ngữ pháp lý Hê-bơ-rơ
  choice: Giữ thành ngữ bằng câu “phơi bày sự trần truồng” trong chính văn
  alternative: Ngươi không được quan hệ tình dục với vợ anh em mình
  rationale: Nguyên văn cố ý dùng uyển ngữ pháp lý גלה ערוה. Giữ hình ảnh ấy bảo toàn sắc thái và tính nhất quán của chương, còn chú thích nêu rõ nghĩa thực dụng.
- issue: Cách hiểu mệnh đề “đó là sự trần truồng của anh em ngươi”
  choice: Giữ nguyên phép đồng nhất trong nguyên văn
  alternative: Nàng thuộc về anh em ngươi
  rationale: Cách thay thế sẽ giải nghĩa quan hệ theo hướng sở hữu và làm mất sự căng thẳng cũng như phép lặp từ của nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Ngươi” giữ lời xưng hô số ít giống đực của điều luật; “mình” trong cụm đầu tránh hai lần “ngươi” quá nặng nề, còn mệnh đề sau dùng “ngươi” để giữ rõ quan hệ quy chiếu. Cách gọi “anh em” không áp đặt người anh hay người em, điều mà tiếng Hê-bơ-rơ không xác định.
