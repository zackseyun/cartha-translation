revisions:
- from: Con không được phơi bày sự trần truồng của cha mình[a], tức là sự trần truồng của mẹ mình. Bà là mẹ của con; con không được phơi bày sự trần truồng của bà.
  to: Ngươi không được phơi bày sự trần truồng của cha ngươi[a], tức là sự trần truồng của mẹ ngươi. Bà ấy là mẹ ngươi; ngươi không được phơi bày sự trần truồng của bà ấy.
  rationale: Chỉnh đại từ xưng hô để phản ánh ngôi thứ hai số ít của luật mà không áp đặt quan hệ người nói–người nghe, và sửa chú thích cho nhất quán. Giữ cách dịch giải thích “tức là” theo bản tiếng Anh POB, đồng thời chú thích bảo lưu liên từ “và” của tiếng Hê-bơ-rơ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ được phép uyển ngữ pháp lý lặp lại của גלה ערוה và đúng đối tượng người mẹ ở câu giải thích. Tuy nhiên, việc dùng “con/mình” không được đánh dấu trong tiếng Hê-bơ-rơ và dễ thêm sắc thái lời cha dạy con; đại từ ngôi hai trung tính, trang trọng hơn sẽ sát văn bản luật.
  naturalness: “Phơi bày sự trần truồng” có thể dùng để giữ hình thức uyển ngữ của nguyên văn, nhưng “cha mình/mẹ mình” trong lời nói trực tiếp kém tự nhiên và thiếu nhất quán với “mẹ của con.” Dùng “ngươi” và “cha ngươi/mẹ ngươi” tạo giọng luật pháp rõ ràng, hiện đại-standard trong ngữ cảnh Kinh Thánh.
  terminology: Giữ “sự trần truồng” và “phơi bày” để bảo toàn thành ngữ pháp lý uyển ngữ, không diễn giải thành quan hệ tình dục. “Bà ấy” phản ánh đại từ giống cái số ít הִוא mà không thêm diễn giải.
  issues:
  - severity: medium
    issue: Đại từ xưng hô “con” và các dạng “mình/của con” không nhất quán và thêm sắc thái quan hệ gia đình của người nói.
    rationale: Nguyên văn chỉ dùng ngôi thứ hai số ít trong một bộ luật, không xác định người nói là cha/mẹ của người nghe. “Ngươi” là cách xưng hô trung tính hơn trong văn phong luật pháp Kinh Thánh; đồng thời “cha ngươi/mẹ ngươi” phản ánh nhất quán hậu tố ngôi hai.
  - severity: low
