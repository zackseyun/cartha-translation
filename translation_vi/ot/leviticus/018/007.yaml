source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: vi
  text: Ngươi không được phơi bày sự trần truồng của cha ngươi[a], tức là sự trần truồng của mẹ ngươi. Bà ấy là mẹ ngươi; ngươi không được phơi bày sự trần truồng của bà ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát chữ hơn: “Ngươi không được phơi bày sự trần truồng của cha ngươi và sự trần truồng của mẹ ngươi.” Câu này giải thích rằng điều ấy nói đến mẹ ngươi: “Bà ấy là mẹ ngươi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: sự trần truồng của
  rationale: Giữ hình ảnh và công thức pháp lý uyển ngữ của cụm גלה ערוה trong Lê-vi Ký 18, vốn chỉ quan hệ tình dục bị cấm, mà không diễn giải quá mức thành một cách nói trực tiếp hơn.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: không được phơi bày
  rationale: Diễn đạt tự nhiên mệnh lệnh cấm ở ngôi thứ hai số ít trong tiếng Việt, đồng thời duy trì động từ lặp lại và phép uyển ngữ pháp lý của nguyên văn.
- source_word: אָבִיךָ
  choice: cha mình
  rationale: Chuyển trực tiếp danh từ thân tộc có hậu tố ngôi thứ hai số ít; “mình” phù hợp với lời luật nói trực tiếp với “con”.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: tức là sự trần truồng của mẹ mình
  rationale: Hiểu liên từ וְ theo chức năng giải thích trong ngữ cảnh, phù hợp với mệnh đề tiếp theo “Bà là mẹ của con”; cách đọc sát mặt chữ với “và” được bảo lưu trong chú thích.
- source_word: הִוא
  choice: Bà là
  rationale: Đại từ giống cái số ít quy chiếu về người mẹ; “bà” là đại từ trang trọng và rõ nghĩa trong văn cảnh.
- source_word: אִמְּךָ
  choice: mẹ của con
  rationale: Giữ nguyên danh từ thân tộc được lặp lại để nhấn mạnh và xác định rõ đối tượng của điều cấm.
theological_decisions:
- issue: Ý nghĩa của “sự trần truồng của cha”
  choice: 'Trình bày vế sau như lời giải thích: “sự trần truồng của cha mình, tức là sự trần truồng của mẹ mình.”'
  alternative: 'Dịch sát cấu trúc liên hợp: “sự trần truồng của cha mình và sự trần truồng của mẹ mình.”'
  rationale: Vế “Bà là mẹ của con” cho thấy người mẹ là đối tượng trực tiếp của lệnh cấm, còn cách nói về sự trần truồng của người cha phản ánh quan hệ hôn nhân và danh dự gia đình. Chú thích bảo lưu sự mơ hồ cú pháp thật sự của liên từ Hebrew.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng dễ hiểu. Dùng “con” cho ngôi thứ hai số ít trong lời chỉ dạy, “không được” cho lệnh cấm, và giữ phép uyển ngữ “phơi bày sự trần truồng” nhằm phản ánh hình thức cũng như sắc thái của nguyên văn.
