source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחֽוֹת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה כִּֽי שְׁאֵ֥ר אִמְּ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: vi
  text: Con không được phơi bày chỗ kín của chị hoặc em gái của mẹ con,[a] vì bà ấy là người cốt nhục của mẹ con.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay diễn đạt trực tiếp hơn: “Con không được quan hệ tình dục với chị hoặc em gái của mẹ con.” Theo chữ, tiếng Hê-bơ-rơ là: “Con không được phơi bày sự trần truồng của chị hoặc em gái của mẹ con.”'
    reason: lexical_alternative
  - marker: b
    text: “Người cốt nhục” dịch từ שְׁאֵר (she’er), một thuật ngữ thân tộc chỉ người có quan hệ gần gũi về huyết nhục.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: không được lột trần sự khỏa thân của
  rationale: Giữ lại uyển ngữ pháp lý lặp đi lặp lại trong Lê-vi Ký 18, thay vì diễn giải thẳng thành quan hệ tình dục; “không được” diễn đạt tự nhiên sức mạnh của lệnh cấm trong tiếng Việt hiện đại.
- source_word: אֲחוֹת אִמְּךָ
  choice: chị em gái mẹ mình
  rationale: Cụm Hê-bơ-rơ chỉ người chị hoặc em gái của mẹ mà không xác định tuổi tương đối; cách dịch này bảo toàn sự không xác định ấy hơn “dì” hoặc “bác gái”.
- source_word: שְׁאֵר אִמְּךָ
  choice: người thân ruột thịt của mẹ con
  rationale: שְׁאֵר là thuật ngữ thân tộc chỉ người gần gũi về huyết nhục; “người thân ruột thịt” truyền đạt rõ ý nghĩa trong ngữ cảnh luật thân tộc.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho lệnh cấm một cách tự nhiên và trang trọng.
- source_word: הִוא
  choice: bà ấy là
  rationale: Đại từ giống cái số ít nói về chị hoặc em gái của mẹ; “bà ấy” phù hợp với quan hệ thuộc thế hệ của mẹ trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch uyển ngữ pháp lý về quan hệ tình dục bị cấm
  choice: Giữ thành ngữ “lột trần sự khỏa thân của” trong chính văn
  alternative: Dịch trực tiếp theo nghĩa động là “quan hệ tình dục với”
  rationale: Nguyên văn dùng một uyển ngữ pháp lý được lặp lại xuyên suốt chương 18. Giữ hình ảnh này bảo toàn sắc thái, cấu trúc văn chương và sức căng của nguyên ngữ; chú thích giải thích nghĩa hàm ẩn.
- issue: Quan hệ họ hàng không xác định chị hay em
  choice: Dùng “chị em gái mẹ mình”
  alternative: Dùng “dì”, “bác gái” hoặc chỉ chọn “chị gái/em gái của mẹ”
  rationale: אֲחוֹת không cho biết người ấy lớn hay nhỏ tuổi hơn mẹ. Không nên tự ý xác định một quan hệ mà nguyên văn để ngỏ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Đại từ “con” phù hợp lời luật phán trực tiếp cho từng người Y-sơ-ra-ên. Cụm “chị em gái mẹ mình” hơi ít thông dụng nhưng cần thiết để không áp đặt sự phân biệt chị/em hoặc bác/dì vốn không có trong nguyên văn.
