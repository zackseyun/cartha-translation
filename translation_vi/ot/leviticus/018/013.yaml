revisions:
- from: Con không được lột trần sự khỏa thân của chị em gái mẹ mình,[a] vì bà ấy là người thân ruột thịt của mẹ con.[b]
  to: Con không được phơi bày chỗ kín của chị hoặc em gái của mẹ con,[a] vì bà ấy là người cốt nhục của mẹ con.[b]
  rationale: Bản sửa giữ hình thức uyển ngữ và giọng điệu luật pháp của công thức עֶרְוָה ... לֹא תְגַלֶּה, nhưng thay kết hợp từ không thành ngữ bằng tiếng Việt hiện đại tự nhiên hơn. Quan hệ họ hàng vẫn được dịch theo cách không xác định chị hay em; chú thích cung cấp phương án diễn đạt trực tiếp mà không thay thế uyển ngữ trong chính văn.
  reviewer_model: gpt-5.6-terra
