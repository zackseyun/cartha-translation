review_pass:
  verdict: revise
  source_fidelity: Bản nháp nhận diện đúng cấu trúc mệnh lệnh phủ định và quan hệ “chị/em gái của mẹ”, nhưng “lột trần sự khỏa thân” là cách kết hợp từ không tự nhiên trong tiếng Việt và làm mờ thành ngữ pháp lý của nguyên văn. “Người thân ruột thịt của mẹ con” có thể hiểu là bất cứ thân nhân nào của mẹ, trong khi שְׁאֵר nhấn mạnh quan hệ cốt nhục/gần về huyết thống.
  naturalness: Cần thay cụm “lột trần sự khỏa thân” bằng “phơi bày chỗ kín”, một lối nói uyển ngữ, trang trọng và dễ hiểu trong văn cảnh luật lệ. “Chị hoặc em gái của mẹ con” tự nhiên hơn “chị em gái mẹ mình”, đồng thời vẫn không áp đặt người này lớn hay nhỏ hơn mẹ.
  terminology: Giữ “Con không được” cho mệnh lệnh pháp lý trực tiếp. Dùng “chỗ kín” trong thành ngữ để chuyển tải עֶרְוָה mà không diễn giải thẳng trong chính văn; chú thích nêu rõ nghĩa tình dục. Dùng “người cốt nhục của mẹ con” cho שְׁאֵר, giữ sắc thái thân tộc gần/gắn với huyết nhục.
  issues:
  - severity: medium
    issue: “lột trần sự khỏa thân” không tự nhiên và bị trùng nghĩa.
    rationale: “Lột trần” đã hàm ý làm cho trần truồng, nên không kết hợp tự nhiên với “sự khỏa thân”. Cụm này không tái tạo tốt uyển ngữ pháp lý cố định của tiếng Hê-bơ-rơ.
  - severity: low
    issue: “chị em gái mẹ mình” thiếu từ nối và kém tự nhiên.
    rationale: “Chị hoặc em gái của mẹ con” diễn đạt số ít của אֲחוֹת rõ ràng, vẫn bảo toàn việc nguyên văn không xác định thứ bậc tuổi.
  - severity: low
    issue: “người thân ruột thịt của mẹ con” rộng nghĩa hơn thuật ngữ thân tộc gần trong ngữ cảnh.
    rationale: “Người cốt nhục của mẹ con” ngắn gọn hơn và giữ được sắc thái שְׁאֵר là quan hệ gần về huyết nhục.
