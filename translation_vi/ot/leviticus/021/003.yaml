source:
  edition: WLC
  text: וְ/לַ/אֲחֹת֤/וֹ הַ/בְּתוּלָה֙ הַ/קְּרוֹבָ֣ה אֵלָ֔י/ו אֲשֶׁ֥ר לֹֽא הָיְתָ֖ה לְ/אִ֑ישׁ לָ֖/הּ יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: vi
  text: và vì chị/em gái còn trinh của mình, là người thân cận của người ấy[a], chưa thuộc về người đàn ông nào, thì người ấy có thể tự làm mình bị ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là người gần gũi với người ấy.” Cụm từ này chỉ mối quan hệ thân thuộc gần gũi. Cụm tiếp theo, “chưa thuộc về người đàn ông nào,” là một thành ngữ Hê-bơ-rơ, cũng có thể hiểu là “chưa có chồng” hoặc “chưa ăn ở với đàn ông.”'
    reason: Nêu sắc thái của הַקְּרוֹבָה אֵלָיו và bảo lưu các khả năng nghĩa của thành ngữ אֲשֶׁר לֹא הָיְתָה לְאִישׁ.
lexical_decisions:
- source_word: וְ/לַ/אֲחֹתוֹ
  choice: và vì người chị em ruột
  rationale: Tiếp nối danh sách những thân nhân mà thầy tế lễ được phép chịu ô uế vì họ. “Chị em ruột” diễn đạt tự nhiên quan hệ sở hữu và thân tộc trong tiếng Việt mà không xác định tuổi lớn hay nhỏ.
- source_word: הַבְּתוּלָה
  choice: còn trinh
  rationale: Giữ trọng tâm về tình trạng tính dục của בְּתוּלָה, đồng thời kết hợp tự nhiên với danh từ “người chị em ruột” trong tiếng Việt.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: là người thân cận với mình
  rationale: Giữ hình ảnh về sự gần gũi trong tiếng Hê-bơ-rơ nhưng dùng “thân cận” để chỉ quan hệ thân thuộc, tránh chỉ được hiểu là gần về không gian.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: chưa thuộc về một người đàn ông
  rationale: Bảo lưu phần nào cấu trúc và độ rộng của thành ngữ Hê-bơ-rơ, vốn có thể liên quan đến việc chưa kết hôn hoặc chưa kết hợp với đàn ông; chú thích nêu các cách hiểu tự nhiên hơn.
- source_word: לָהּ
  choice: được hàm chứa trong mệnh đề “chưa thuộc về một người đàn ông”
  rationale: Yếu tố đại từ không cần biểu đạt riêng trong tiếng Việt; dịch từng chữ sẽ thiếu tự nhiên.
- source_word: יִטַּמָּא
  choice: được phép làm cho mình ra ô uế
  rationale: Trong ngữ cảnh luật về thi thể, động từ chỉ việc trở nên ô uế theo nghi lễ. “Được phép” thể hiện giá trị cho phép của điều khoản, còn “làm cho mình ra ô uế” giữ dạng phản thân.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật dành cho thầy tế lễ
  choice: Dùng “làm cho mình ra ô uế” trong bối cảnh quy định về tiếp xúc với người chết, không coi đây là sự suy đồi đạo đức.
  alternative: “làm nhơ bẩn chính mình” hoặc cách diễn đạt hàm ý phạm tội
  rationale: Ngữ cảnh nói về tình trạng ô uế theo nghi lễ của thầy tế lễ do người chết, chứ không nhất thiết quy kết hành vi ấy là tội lỗi; cách dịch giữ nguyên phạm trù luật-lễ nghi của sách Lê-vi.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “người chị em ruột” để không áp đặt đó là chị hay em; dùng “người ấy” để tránh đại từ khẩu ngữ và nối rõ với thầy tế lễ trong ngữ cảnh.
