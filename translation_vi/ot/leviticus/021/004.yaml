source:
  edition: WLC
  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: vi
  text: Người không được làm mình ô uế với tư cách là chồng giữa dân mình[a], và như thế tự làm mình ra phàm tục.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người không được làm mình ô uế với tư cách là người có địa vị giữa dân mình, và như thế tự làm mình ra phàm tục.” Mệnh đề Hê-bơ-rơ này khó hiểu; một số người hiểu theo nghĩa khái quát hơn rằng thầy tế lễ không được làm mình ô uế trong vai trò có địa vị giữa dân mình, thay vì hiểu riêng là với tư cách chồng.'
    reason: Giữ lại các cách phân tích khả dĩ của cụm בַּעַל בְּעַמָּיו, thay vì âm thầm giải quyết sự mơ hồ của nguyên văn.
lexical_decisions:
- source_word: יִטַּמָּא
  choice: làm mình ô uế
  rationale: Động từ ở thể Hitpael trong ngữ cảnh này chỉ việc mắc ô uế nghi lễ do tiếp xúc với người chết. Cách dịch này vừa tự nhiên vừa giữ được sắc thái chủ động của việc tự chuốc lấy tình trạng ô uế.
- source_word: בַּעַל
  choice: vì là chồng
  rationale: בַּעַל thường có nghĩa là “chồng”; trong mạch luật về những thân nhân mà thầy tế lễ được phép chịu ô uế vì họ, nghĩa quan hệ này hợp lý nhất. Tuy nhiên, từ này cũng có thể chỉ người có địa vị hay người đứng đầu, nên phương án ấy được giữ trong chú thích.
- source_word: בְּעַמָּיו
  choice: giữa dân mình
  rationale: Dịch sát nghĩa cơ bản “giữa dân mình”, đồng thời không thu hẹp thành “họ hàng” khi nguyên văn dùng עַם. Trong ngữ cảnh, cụm từ có thể hàm ý cộng đồng thân tộc.
- source_word: לְהֵחַלּוֹ
  choice: mà khiến mình ra phàm tục
  rationale: Nguyên ngữ dùng חלל, đối lập tình trạng thánh với tình trạng phàm tục. “Khiến mình ra phàm tục” giữ được thuật ngữ thánh–phàm rõ hơn cách diễn đạt chung chung như “làm nhục mình”, đồng thời לְ có thể biểu thị kết quả hay mục đích.
theological_decisions:
- issue: Cách hiểu cụm khó בַּעַל בְּעַמָּיו
  choice: 'Hiểu בַּעַל là “chồng”: thầy tế lễ không được chịu ô uế vì người vợ đã chết.'
  alternative: 'Hiểu בַּעַל là “người đứng đầu/người có địa vị”, hoặc hiểu câu theo nghĩa khái quát: người không được làm mình ô uế giữa dân mình.'
  rationale: Cú pháp Hê-bơ-rơ cô đọng và khó xác định. Nghĩa “chồng” phù hợp với nghĩa thông dụng của בַּעַל và mạch văn về các ngoại lệ dành cho thân nhân gần; tuy vậy, vì các cách hiểu khác có cơ sở thực sự, bản dịch không loại bỏ chúng mà ghi rõ trong chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Ô uế” duy trì thuật ngữ nghi lễ quen thuộc; “phàm tục” giữ thế đối lập tư tế giữa thánh và phàm. Đại từ “người” tiếp nối đối tượng là thầy tế lễ trong mạch văn.
