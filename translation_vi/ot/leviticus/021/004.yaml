- from: Người không được làm mình ô uế vì là chồng giữa dân mình[a], mà khiến mình ra phàm tục.
  to: Người không được làm mình ô uế với tư cách là chồng giữa dân mình[a], và như thế tự làm mình ra phàm tục.
  rationale: Sửa “vì là chồng” thành “với tư cách là chồng” để phản ánh đúng hơn cách hiểu chính của cụm khó בַּעַל בְּעַמָּיו mà không áp đặt quan hệ nguyên nhân. Sửa mệnh đề cuối để tiếng Việt tự nhiên hơn, đồng thời duy trì sự đối lập nghi lễ giữa điều thánh và điều phàm. Chú thích được chỉnh cho khớp với bản văn và tiếp tục bảo tồn các cách hiểu có cơ sở.
