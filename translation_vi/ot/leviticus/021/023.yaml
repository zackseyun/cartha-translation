source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: vi
  text: Tuy nhiên, người ấy không được vào chỗ bức màn[a] hay đến gần bàn thờ, vì người ấy có khuyết tật[b], để không làm ô uế những nơi thánh của Ta[c]; vì Ta là Yahweh, Đấng thánh hóa chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bức rèm”. Từ Hê-bơ-rơ chỉ bức màn trong nơi thánh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch sát là “trong người có một khuyết tật” hoặc “người có tì vết”. Đây là tình trạng thể chất khiến người ấy không được thực hiện việc tư tế này, không phải lỗi đạo đức.
    reason: lexical_alternative
  - marker: c
    text: 'Tiếng Hê-bơ-rơ dùng dạng số nhiều: “những nơi thánh của Ta”; một số bản dịch dùng số ít: “nơi thánh của Ta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Diễn tả sự hạn chế tương phản với quyền được ăn thức ăn thánh ở câu trước, bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: הַפָּרֹכֶת
  choice: bức màn
  rationale: Chỉ bức màn trong nơi thánh; “bức màn” vừa rõ nghĩa vừa giữ được đối tượng phụng tự cụ thể.
- source_word: יָבֹא אֶל־הַפָּרֹכֶת
  choice: đi vào phía bức màn
  rationale: Giữ ý chuyển động vào khu vực hướng đến bức màn mà không diễn giải quá mức rằng người ấy đi xuyên qua màn.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Cách dịch tiêu chuẩn và dễ hiểu cho bàn thờ tế lễ.
- source_word: יִגַּשׁ
  choice: đến gần
  rationale: Phản ánh ngôn ngữ chuyên biệt về việc tư tế tiến đến gần bàn thờ, đồng thời tự nhiên trong tiếng Việt.
- source_word: מוּם בּוֹ
  choice: người có khuyết tật
  rationale: Trong luật này, מוּם nói đến một tình trạng thể chất khiến tư tế không được thực hiện một số phận sự, chứ không phải lỗi đạo đức.
- source_word: יְחַלֵּל
  choice: xúc phạm
  rationale: Truyền đạt hành vi vi phạm tính thánh và đối xử không đúng với điều thuộc về thánh; tránh thu hẹp nghĩa thành sự ô nhiễm vật chất.
- source_word: מִקְדָּשַׁי
  choice: những nơi thánh của Ta
  rationale: Giữ nguyên hình thức số nhiều của tiếng Hê-bơ-rơ và diễn đạt tự nhiên hơn “các thánh sở” đối với độc giả phổ thông.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: מְקַדְּשָׁם
  choice: Đấng thánh hóa chúng
  rationale: Giữ thuật ngữ về sự thánh hóa và đại từ số nhiều, với tiền ngữ gần nhất là “những nơi thánh của Ta”.
theological_decisions:
- issue: Đối tượng của hậu tố số nhiều trong מְקַדְּשָׁם
  choice: “chúng” chỉ về “những nơi thánh của Ta”
  alternative: “chúng” có thể chỉ rộng hơn về các tư tế hoặc dân chúng
  rationale: Tiền ngữ gần nhất về mặt ngữ pháp là מִקְדָּשַׁי ở số nhiều, và mạch văn trực tiếp nói về quyền tiếp cận không gian thánh. Bản dịch vẫn giữ đại từ “chúng” thay vì giải nghĩa thêm.
- issue: Ý nghĩa của מוּם trong luật về chức tư tế
  choice: khuyết tật thể chất dẫn đến hạn chế về nghi lễ
  alternative: tì vết; dị tật
  rationale: Ngữ cảnh quy định tư cách tiến đến bàn thờ, không đưa ra phán xét về tội lỗi, phẩm giá hay giá trị đạo đức của người ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “người ấy” cho chủ thể tư tế đã được xác định trong văn cảnh. Đại từ thần linh “Ta” được viết hoa. Cụm “đi vào phía bức màn” cố ý giữ giới từ và hướng chuyển động của nguyên văn mà không khẳng định người ấy đi qua bức màn. Các chú thích giải thích thuật ngữ nghi lễ và tránh khiến “khuyết tật” bị hiểu như một lỗi đạo đức.
