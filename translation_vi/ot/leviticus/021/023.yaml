revisions:
- from: Tuy nhiên, người ấy không được đi vào phía bức màn[a] hay đến gần bàn thờ, vì người có khuyết tật[b], để không xúc phạm những nơi thánh của Ta[c]; vì Ta là Yahweh, Đấng thánh hóa chúng.
  to: Tuy nhiên, người ấy không được vào chỗ bức màn[a] hay đến gần bàn thờ, vì người ấy có khuyết tật[b], để không làm ô uế những nơi thánh của Ta[c]; vì Ta là Yahweh, Đấng thánh hóa chúng.
  rationale: Bản sửa cải thiện thành ngữ tiếng Việt ở cụm chỉ bức màn và dùng “làm ô uế” để chuyển tải sát hơn động từ חילל trong ngữ cảnh luật nghi lễ. Những yếu tố có chủ ý của bản thảo—số nhiều “những nơi thánh,” đại từ “chúng,” và diễn giải phi-đạo-đức của “khuyết tật”—được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ được cấu trúc hạn chế của אַךְ, hai hành vi bị cấm, lý do là מוּם, số nhiều của מִקְדָּשַׁי, và đại từ số nhiều trong מְקַדְּשָׁם. Tuy nhiên, “đi vào phía bức màn” không tự nhiên trong tiếng Việt và chưa diễn đạt rõ hướng đi vào không gian liên hệ với bức màn. “Xúc phạm những nơi thánh” cũng quá khái quát cho יְחַלֵּל, động từ trong ngữ cảnh nghi lễ chỉ việc làm điều thánh bị ô uế/thông tục.
  naturalness: Cần thay “đi vào phía bức màn” bằng “vào chỗ bức màn” để tiếng Việt tự nhiên hơn mà không khẳng định người ấy đi xuyên qua bức màn. Lặp lại “người ấy” sau “vì” giúp câu rõ chủ ngữ và tự nhiên hơn trong văn phong trang trọng hiện đại.
  terminology: “Khuyết tật” cùng chú thích hiện có diễn đạt đúng tính chất thể chất và nghi lễ của מוּם, không hàm ý lỗi đạo đức. “Bàn thờ,” “những nơi thánh của Ta,” “Yahweh,” và “Đấng thánh hóa chúng” đều phù hợp. Đổi “xúc phạm” thành “làm ô uế” để phản ánh cụ thể hơn ngôn ngữ thanh sạch/thánh khiết của חילל trong văn cảnh.
