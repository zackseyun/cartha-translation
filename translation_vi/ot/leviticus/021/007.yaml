source:
  edition: WLC
  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: vi
  text: Họ không được lấy một phụ nữ là gái mại dâm hoặc bị làm nhơ[a] làm vợ; cũng không được lấy một phụ nữ bị chồng ly dị làm vợ, vì thầy tế lễ là thánh đối với Đức Chúa Trời của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: bị làm cho mất tình trạng thánh; tiếng Hê-bơ-rơ dùng một từ có nghĩa là bị làm thành phàm/tục.'
    reason: Làm rõ sắc thái rộng và chuyên biệt của חֲלָלָה, tránh đồng nhất nó với một dạng ô uế nghi lễ cụ thể.
lexical_decisions:
- source_word: אִשָּׁה זֹנָה
  choice: một người đàn bà làm gái mại dâm
  rationale: זֹנָה chỉ người phụ nữ hành nghề mại dâm; cách diễn đạt này rõ nghĩa, tự nhiên và không làm nhẹ sắc thái của nguyên ngữ.
- source_word: וַחֲלָלָה
  choice: hoặc đã bị ô uế
  rationale: חֲלָלָה trong bối cảnh tư tế chỉ người phụ nữ bị xem là mất tư cách thanh sạch/thánh biệt; chọn “đã bị ô uế” theo lớp nghĩa được bản tư vấn xác nhận, đồng thời tránh thêm một nguyên nhân cụ thể mà câu không nêu.
- source_word: יִקָּחוּ
  choice: được lấy
  rationale: Trong ngữ cảnh hôn nhân, động từ “lấy” có nghĩa là lấy làm vợ; tiếng Việt tự nhiên không cần lặp “làm vợ”.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ
  choice: đã ly dị chồng
  rationale: Diễn đạt tự nhiên quan hệ hôn nhân đã chấm dứt, tương ứng với nghĩa đen là người phụ nữ bị tách/đuổi khỏi chồng mình.
- source_word: קָדֹשׁ הוּא לֵאלֹהָיו
  choice: thầy tế lễ là thánh đối với Đức Chúa Trời của mình
  rationale: Chủ ngữ số ít “người ấy” quy chiếu đến từng thầy tế lễ trong nhóm số nhiều; nêu rõ “thầy tế lễ” giúp tiếng Việt tránh đại từ mơ hồ mà vẫn giữ sự chuyển đổi số của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của חֲלָלָה
  choice: đã bị ô uế
  alternative: bị mất phẩm giá thánh / bị xúc phạm
  rationale: Từ này có sắc thái chuyên biệt liên quan đến việc bị làm cho không còn thích hợp với địa vị thánh. Bản dịch giữ cách hiểu “ô uế” đã được lớp tư vấn tiếng Anh xác nhận, nhưng không quy định nguyên nhân hay tình trạng đạo đức vượt quá câu văn.
- issue: Sự chuyển từ chủ ngữ số nhiều sang số ít
  choice: “Họ” ở các lệnh cấm, rồi “thầy tế lễ” ở mệnh đề lý do
  alternative: “họ… vì họ là thánh”
  rationale: Nguyên văn dùng các động từ số nhiều nhưng kết luận bằng הוּא số ít, nhấn mạnh từng thầy tế lễ; bản dịch bảo tồn sự chuyển đổi này thay vì đồng nhất hóa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “gái mại dâm” thay cho từ miệt thị; dùng “ly dị” theo cách nói thông dụng. “Đức Chúa Trời” phù hợp văn phong Kinh Thánh tiếng Việt, còn “của mình” giữ quan hệ sở hữu trong לֵאלֹהָיו.
