revisions:
- from: Họ không được lấy một người đàn bà làm gái mại dâm hoặc đã bị ô uế, cũng không được lấy một người đàn bà đã ly dị chồng, vì thầy tế lễ là thánh đối với Đức Chúa Trời của mình.
  to: Họ không được lấy một phụ nữ là gái mại dâm hoặc bị làm nhơ[a] làm vợ; cũng không được lấy một phụ nữ bị chồng ly dị làm vợ, vì thầy tế lễ là thánh đối với Đức Chúa Trời của mình.
  rationale: Bản sửa bảo toàn các lệnh cấm số nhiều và mệnh đề lý do số ít của nguyên văn. Nó sửa sắc thái của חֲלָלָה theo nghĩa «bị làm phàm/mất tính thánh» và biểu đạt rõ tính bị động cùng nguồn tác động trong «bị chồng ly dị». Chú thích giữ lại độ mở của thuật ngữ khó mà không bổ sung nguyên nhân hoặc quy tắc pháp lý không có trong câu.
