  - severity: medium
    issue: «đã ly dị chồng» cho גְּרוּשָׁה מֵאִישָׁהּ
    rationale: Phân từ bị động «bị ly dị/đẩy đi» kèm «từ chồng mình» xác định người chồng là bên ly dị. Câu tiếng Việt hiện tại có thể đảo chiều tác thể.
