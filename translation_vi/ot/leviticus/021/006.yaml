  - severity: low
    issue: “thánh đối với Đức Chúa Trời” và “phải nên thánh” chưa thật tự nhiên.
    rationale: “Thánh cho Đức Chúa Trời” phù hợp lối nói tận hiến trong tiếng Việt; “phải thánh” bảo toàn trực tiếp tính lặp lại của קְדֹשִׁים…קֹדֶשׁ.
