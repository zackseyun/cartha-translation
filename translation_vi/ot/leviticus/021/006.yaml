revisions:
- from: Họ phải thánh đối với Đức Chúa Trời của mình và không được xúc phạm danh Đức Chúa Trời của mình, vì họ dâng các lễ vật hỏa tế của Đức Giê-hô-va, là thức ăn của Đức Chúa Trời mình; bởi vậy, họ phải nên thánh.[a]
  to: Họ phải thánh cho Đức Chúa Trời của mình và không được làm ô danh Đức Chúa Trời của mình, vì họ dâng các lễ vật hỏa tế của Đức Giê-hô-va, là thức ăn của Đức Chúa Trời mình; bởi vậy, họ phải thánh.[a]
  rationale: Bản sửa thay hai cách diễn đạt ít tự nhiên hoặc chưa đủ sắc thái bằng “thánh cho” và “làm ô danh”, đồng thời bảo toàn lực quy định, sự lặp lại về thánh khiết, thuật ngữ tế tự, và danh riêng Đức Giê-hô-va. Chú thích giữ nghĩa sát hơn của động từ “làm thành phàm tục” và các nghĩa đen liên quan đến lễ vật/bánh.
