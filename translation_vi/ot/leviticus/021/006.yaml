source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: vi
  text: Họ phải thánh cho Đức Chúa Trời của mình và không được làm ô danh Đức Chúa Trời của mình, vì họ dâng các lễ vật hỏa tế của Đức Giê-hô-va, là thức ăn của Đức Chúa Trời mình; bởi vậy, họ phải thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Làm ô danh” cũng có thể dịch sát hơn là “làm cho thành phàm tục”. “Lễ vật hỏa tế” chỉ các lễ vật được dâng bằng lửa; “thức ăn” dịch một từ có nghĩa đen là “bánh”.
    reason: Giữ sắc thái thánh/phàm của יְחַלְּלוּ cùng các sắc thái từ vựng của אִשֵּׁי và לֶחֶם mà không làm câu chính trở nên nặng nề.
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ לֵאלֹהֵיהֶם
  choice: Họ phải thánh đối với Đức Chúa Trời của mình
  rationale: Diễn đạt lực quy định của thể vị hoàn trong văn luật lệ bằng “phải”, đồng thời giữ quan hệ được đánh dấu bởi לֵ là “đối với” Đức Chúa Trời.
- source_word: יְחַלְּלוּ
  choice: xúc phạm
  rationale: Trong ngữ cảnh thánh khiết, động từ Piel חלל có nghĩa làm cho ra phàm tục hoặc báng bổ. “Xúc phạm danh” là cách nói tự nhiên, trang trọng trong tiếng Việt, dù sắc thái đối lập thánh/phàm được giải thích thêm ở chú thích.
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: danh Đức Chúa Trời của mình
  rationale: Giữ cấu trúc và ý nghĩa giao ước của “danh”, dùng “mình” để quy chiếu tự nhiên về chủ ngữ số nhiều.
- source_word: אִשֵּׁי יְהוָה
  choice: các lễ vật hỏa tế của Đức Giê-hô-va
  rationale: אִשִּׁים là thuật ngữ tế tự chỉ những lễ vật được dâng bằng lửa; “lễ vật hỏa tế” vừa rõ nghĩa vừa bảo toàn yếu tố lửa trong nguyên văn.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước YHWH bằng dạng tiếng Việt quen thuộc “Đức Giê-hô-va”, thay vì thay bằng một tước hiệu.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: thức ăn của Đức Chúa Trời mình
  rationale: לֶחֶם nghĩa đen là bánh nhưng trong ngữ cảnh tế lễ có nghĩa rộng hơn là thức ăn; “thức ăn” tránh giới hạn sai vào bánh nướng.
- source_word: מַקְרִיבִם
  choice: họ dâng
  rationale: Hiphil của קרב chỉ việc đem đến hoặc trình dâng lễ vật. “Dâng” là thuật ngữ tế lễ tự nhiên và chính xác trong tiếng Việt.
- source_word: וְהָיוּ קֹדֶשׁ
  choice: bởi vậy, họ phải nên thánh
  rationale: “Bởi vậy” biểu đạt quan hệ suy luận theo mạch nhân quả của câu; “phải nên thánh” giữ lực quy định và sự lặp lại chủ đề thánh khiết.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Bản dịch dùng một dạng phiên âm danh riêng đã quen thuộc trong tiếng Việt, không thay danh ấy bằng tước hiệu.
- issue: Cụm tế tự אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם
  choice: các lễ vật hỏa tế của Đức Giê-hô-va, là thức ăn của Đức Chúa Trời mình
  alternative: các lễ vật bằng lửa của Đức Giê-hô-va, bánh của Đức Chúa Trời mình
  rationale: Giữ cả thuật ngữ liên quan đến lửa và hình ảnh lễ vật như “thức ăn” của Đức Chúa Trời, nhưng không hàm ý rằng Đức Chúa Trời có nhu cầu ăn uống theo nghĩa thể lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; duy trì thuật ngữ tế tự “lễ vật hỏa tế” và sự lặp lại có chủ ý của “thánh”. Đại từ “mình” giúp quan hệ sở hữu tự nhiên trong tiếng Việt.
