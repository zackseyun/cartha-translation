  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: Yahweh phán với Môi-se, chỉ thị cho các thầy tế lễ là con trai A-rôn, và lệnh cấm mỗi người tự chuốc ô uế nghi lễ liên quan đến người chết trong dân mình. Tuy nhiên, “được làm cho mình trở nên ô uế” hơi nặng và có thể gợi sắc thái bị động/được phép không chủ ý trong tiếng Việt. “Tự làm mình ô uế” diễn đạt trực tiếp hơn sắc thái phản thân của יִטַּמָּא.'
