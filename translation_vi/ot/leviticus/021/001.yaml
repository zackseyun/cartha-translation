id: LEV.21.1
reference: Leviticus 21:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Hãy nói với các thầy tế lễ, là các con trai A-rôn, và bảo họ: Không ai trong họ được tự làm mình ô uế[a] vì một người chết[b] trong dân mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được trở nên ô uế” hoặc “không được làm nhơ uế chính mình”. Tiếng Hê-bơ-rơ ở đây nói về sự ô uế nghi lễ do tiếp xúc với người chết.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “vì một נֶפֶשׁ (nephesh)”; trong ngữ cảnh luật thanh sạch này, đây là cách nói chỉ một người chết hoặc thi thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng chuyển tự của danh riêng trong tiếng Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: Hãy nói ... và bảo
  rationale: Giữ lại hai lần dùng động từ אמר, đồng thời diễn đạt tự nhiên trong tiếng Việt và tránh lặp máy móc.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: các thầy tế lễ, là các con trai A-rôn
  rationale: Giữ cấu trúc đồng vị xác định các thầy tế lễ được nói đến; “các con trai A-rôn” bảo toàn cách gọi theo dòng họ của nguyên văn.
- source_word: לְנֶפֶשׁ
  choice: vì một người chết
  rationale: Trong luật thanh sạch, נֶפֶשׁ ở đây là cách nói chỉ người đã chết hoặc thi thể, chứ không mang nghĩa thông thường là “sinh mạng” hay “linh hồn”.
- source_word: יִטַּמָּא
  choice: được làm cho mình trở nên ô uế
  rationale: Diễn đạt sắc thái phản thân và phạm trù ô uế nghi lễ do tiếp xúc với người chết, không biến câu này thành lời kết án về đạo đức.
- source_word: בְּעַמָּיו
  choice: trong dân mình
  rationale: Bám sát nghĩa “trong dân mình/giữa những người thuộc dân mình”; các câu tiếp theo mới nêu rõ những thân nhân gần được ngoại lệ.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật dành cho thầy tế lễ
  choice: 'Dùng ngôn ngữ về ô uế nghi lễ: “làm cho mình trở nên ô uế”.'
  alternative: “làm nhơ uế chính mình” hoặc cách diễn đạt dễ bị hiểu là sự bại hoại đạo đức
  rationale: Ngữ cảnh nói về tình trạng ô uế do người chết trong luật nghi lễ, không trực tiếp khẳng định một hành vi gian ác về mặt đạo đức.
- issue: Chủ thể hàm ẩn của động từ số ít יִטַּמָּא trong lời nói với các thầy tế lễ
  choice: “Không ai trong họ”
  alternative: “Một thầy tế lễ không được”
  rationale: Cách dịch này thể hiện mệnh lệnh áp dụng cho từng người trong tập thể các thầy tế lễ mà không thêm danh từ không có ngay tại vị trí ấy trong nguyên văn.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “phán” cho lời Đức Chúa Trời, “thầy tế lễ” cho chức vụ tư tế, và giữ danh riêng “Yahweh”. Cụm “trong dân mình” cố ý bảo toàn độ rộng của בְּעַמָּיו thay vì thu hẹp ngay thành “trong họ hàng mình”.
