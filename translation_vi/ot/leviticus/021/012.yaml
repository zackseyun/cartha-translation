  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: vi
  text: Người không được rời khỏi nơi thánh, cũng không được xúc phạm nơi thánh của Đức Chúa Trời của người, vì sự thánh hiến[a] bởi dầu xức của Đức Chúa Trời của người đang ở trên người. Ta là Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát chữ: “vương miện của dầu xức của Đức Chúa Trời của người.” Từ Hê-bơ-rơ có thể chỉ “vương miện” hoặc “sự thánh hiến.”'
    reason: Bảo tồn khả năng nghĩa kép của נֵזֶר giữa hình ảnh vương miện và tình trạng được thánh hiến.
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ לֹא יֵצֵא
  choice: Người không được rời khỏi nơi thánh
  rationale: מִקְדָּשׁ chỉ nơi thánh hoặc thánh điện; trong mạch luật dành cho thầy tế lễ thượng phẩm, “nơi thánh” tự nhiên và không thu hẹp quá mức phạm vi. “Không được rời khỏi” diễn đạt rõ lệnh cấm của thể vị hoàn thành chưa trọn trong văn luật.
- source_word: וְלֹא יְחַלֵּל אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: cũng không được làm ô uế nơi thánh của Đức Chúa Trời mình
  rationale: חלל ở thể piel trong văn mạch thánh khiết có nghĩa làm mất tính thánh, xúc phạm hoặc làm ô uế. “Làm ô uế” dễ hiểu trong tiếng Việt hiện đại và giữ sự đối lập với tính thánh.
- source_word: כִּי נֵזֶר
  choice: vì dấu biệt riêng
  rationale: נֵזֶר có thể chỉ vương miện/miện hoặc sự biệt riêng, hiến thánh. “Dấu biệt riêng” truyền đạt địa vị được thánh hiến do dầu xức, đồng thời tránh khẳng định rằng đây là một vương miện vật chất; nghĩa sát chữ được giữ trong chú thích.
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: dầu xức của Đức Chúa Trời người
  rationale: Giữ đủ chuỗi sở hữu trong tiếng Hê-bơ-rơ và dùng thuật ngữ quen thuộc “dầu xức” cho dầu dùng trong nghi thức xức phong.
- source_word: עָלָיו
  choice: ở trên người
  rationale: Giữ hình ảnh cụ thể và trạng thái tiếp diễn của sự biệt riêng được đánh dấu bởi dầu xức.
- source_word: אֲנִי יְהוָה
  choice: Ta là Đức Giê-hô-va
  rationale: Giữ công thức tự xưng và danh riêng giao ước יהוה bằng dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của נֵזֶר đối với địa vị thầy tế lễ thượng phẩm
  choice: “dấu biệt riêng” trong chính văn
  alternative: “miện của dầu xức” hoặc “vương miện của dầu xức”
  rationale: Trong ngữ cảnh, cụm từ giải thích địa vị thánh hiến đang ở trên thầy tế lễ do dầu xức. Tuy nhiên, נֵזֶר thực sự cũng có nghĩa là miện; vì vậy không xóa bỏ sắc thái ấy mà ghi nhận trong chú thích.
- issue: Phạm vi của lệnh không rời khỏi nơi thánh
  choice: Giữ nguyên lời cấm mà không giải thích thêm tình huống áp dụng
  alternative: Diễn giải là không được rời nơi thánh để dự tang lễ
  rationale: Câu Hê-bơ-rơ tự nó nêu lệnh cấm rộng; văn cảnh trước liên quan đến tang chế nhưng bản dịch không nên chèn một giới hạn diễn giải không có ngay trong câu.
translation_notes:
  register: Văn phong luật định, trang nghiêm nhưng hiện đại. Dùng “người” để chỉ thầy tế lễ thượng phẩm theo văn cảnh; lặp lại “nơi thánh” như nguyên văn. Mọi dấu chú thích trong phần chú thích đều xuất hiện trong chính văn.
