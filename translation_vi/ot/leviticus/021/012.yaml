- from: Người không được rời khỏi nơi thánh, cũng không được làm ô uế nơi thánh của Đức Chúa Trời mình, vì dấu biệt riêng[a] bởi dầu xức của Đức Chúa Trời người ở trên người. Ta là Đức Giê-hô-va.
  to: Người không được rời khỏi nơi thánh, cũng không được xúc phạm nơi thánh của Đức Chúa Trời của người, vì sự thánh hiến[a] bởi dầu xức của Đức Chúa Trời của người đang ở trên người. Ta là Đức Giê-hô-va.
  rationale: Bản sửa thay thuật ngữ chưa sát của חלל bằng “xúc phạm,” làm rõ rằng sự thánh hiến liên hệ với dầu xức là lý do của mệnh lệnh, và chỉnh các cấu trúc sở hữu cho tự nhiên trong tiếng Việt. Nghĩa tranh luận của נֵזֶר được giữ nguyên trong chú thích, không áp đặt cách hiểu về một vương miện vật chất.
