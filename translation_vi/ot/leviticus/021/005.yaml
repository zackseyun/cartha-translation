source:
  edition: WLC
  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: vi
  text: Họ không được cạo trọc một mảng trên đầu, không được cạo sạch phần rìa râu[a], cũng không được rạch da thịt mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “góc râu.” Từ Hê-bơ-rơ có thể chỉ rìa, phía bên hoặc góc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: cạo trọc một mảng
  rationale: Cặp động từ–danh từ cùng gốc nhấn mạnh hành động chủ ý tạo ra một mảng hói, chứ không nói đến việc hói tự nhiên. Cách diễn đạt này cụ thể và tự nhiên trong tiếng Việt.
- source_word: בְּרֹאשָׁם
  choice: trên đầu
  rationale: Danh từ Hê-bơ-rơ ở số ít với hậu tố số nhiều mang nghĩa phân phối; “trên đầu” là cách nói tự nhiên trong tiếng Việt khi chủ ngữ là số nhiều.
- source_word: פְאַת זְקָנָם
  choice: phần rìa bộ râu
  rationale: פֵּאָה có thể chỉ rìa, phía bên hoặc góc. “Phần rìa” giữ được hình ảnh cụ thể mà không xác định quá mức kiểu cạo tỉa.
- source_word: יְגַלֵּחוּ
  choice: cạo sạch
  rationale: Thể piel diễn tả việc cạo bỏ lông; “cạo sạch” truyền đạt rõ ý loại bỏ trong tiếng Việt hiện đại.
- source_word: וּבִבְשָׂרָם
  choice: da thịt mình
  rationale: בָּשָׂר theo nghĩa đen là “thịt”; “da thịt mình” vừa giữ tính cụ thể của nguyên văn vừa tự nhiên khi nói về hành vi tự rạch thân thể.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: rạch
  rationale: Cặp động từ–danh từ cùng gốc chỉ việc tạo vết cắt hoặc vết rạch. “Rạch” ngắn gọn, trực tiếp, không quá lâm sàng và không thêm mục đích không có trong câu.
theological_decisions:
- issue: Bản chất của điều cấm
  choice: Trình bày trực tiếp các hành vi bị cấm liên quan đến tóc, râu và thân thể, không thêm mục đích “vì người chết”.
  alternative: Bổ sung rằng đây là những hành vi để tang người chết dựa trên Lê-vi Ký 19:28 hoặc Phục Truyền Luật Lệ Ký 14:1.
  rationale: Câu này chỉ nêu các hành vi bị cấm, không nêu cụm giải thích có trong những đoạn song song. Bản dịch không đưa thông tin từ ngữ cảnh khác vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “không được” để diễn đạt mệnh lệnh cấm; “mình” làm rõ ý phân phối và hành động tác động lên chính thân thể của từng người.
