id: LEV.21.8
reference: Leviticus 21:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: vi
  text: Ngươi phải coi người ấy là thánh, vì người dâng thức ăn[a] của Đức Chúa Trời của ngươi. Người phải là thánh đối với ngươi, vì Ta, Yahweh, là Đấng thánh hóa các ngươi, là thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bánh”. Trong văn cảnh này, “bánh” có lẽ chỉ rộng hơn, đến các lễ vật thực phẩm được dâng lên Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: Ngươi phải tôn người ấy là thánh
  rationale: Động từ קדשׁ ở thể Piel với đại từ làm tân ngữ có nghĩa biệt riêng hoặc nhìn nhận một người là thánh. Cách diễn đạt này tự nhiên trong tiếng Việt, giữ được mệnh lệnh và không hàm ý rằng dân chúng tự tạo nên sự thánh khiết của thầy tế lễ.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: thức ăn của Đức Chúa Trời ngươi
  rationale: לֶחֶם theo nghĩa đen là “bánh”, nhưng trong văn cảnh tế lễ có thể chỉ rộng hơn về các lễ vật được dâng làm thức ăn. “Thức ăn” phù hợp với nghĩa nghi lễ ở đây; nghĩa đen được giữ trong chú thích.
- source_word: מַקְרִיב
  choice: dâng
  rationale: Phân từ Hiphil của קרב trong văn cảnh tế lễ nói đến việc đem đến hoặc trình dâng lễ vật. “Dâng” là cách diễn đạt ngắn gọn, tự nhiên và chính xác trong tiếng Việt.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: Người phải là thánh đối với ngươi
  rationale: Bản dịch giữ cả địa vị “thánh” của thầy tế lễ lẫn sắc thái quan hệ của giới từ לְ, đồng thời bảo tồn sự lặp lại từ ngữ về sự thánh khiết.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng tên riêng Yahweh để thể hiện trực tiếp danh xưng יהוה trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- source_word: מְקַדִּשְׁכֶם
  choice: Đấng thánh hóa các ngươi
  rationale: Phân từ Piel của קדשׁ mô tả hành động liên tục hoặc đặc trưng của Yahweh. “Thánh hóa” duy trì mối liên hệ từ vựng với “thánh” và giữ số nhiều của hậu tố כֶם.
theological_decisions:
- issue: Cụm từ nghi lễ לֶחֶם אֱלֹהֶיךָ
  choice: thức ăn của Đức Chúa Trời ngươi
  alternative: bánh của Đức Chúa Trời ngươi
  rationale: Văn cảnh nói về chức vụ tế lễ nên nghĩa rộng chỉ các lễ vật làm thức ăn là phù hợp hơn, nhưng nghĩa đen “bánh” vẫn được ghi nhận trong chú thích để bảo tồn hình ảnh Hê-bơ-rơ.
- issue: Sự lặp lại của gốc קדשׁ
  choice: tôn ... là thánh / là thánh / thánh hóa
  alternative: biệt riêng / được biệt riêng / biệt riêng các ngươi
  rationale: 'Cách chọn này bảo tồn mạch thần học của câu: dân phải nhìn nhận thầy tế lễ là thánh; địa vị ấy được đặt nền trên sự thánh khiết của Yahweh và hành động thánh hóa dân Ngài.'
- issue: Sự chuyển đổi từ số ít sang số nhiều trong lời xưng hô
  choice: giữ “ngươi” ở hai mệnh đề đầu và “các ngươi” ở mệnh đề cuối
  alternative: đồng nhất toàn câu thành số nhiều để tiếng Việt trôi chảy hơn
  rationale: Nguyên văn dùng hậu tố số ít trong “Đức Chúa Trời ngươi” và “đối với ngươi”, rồi dùng hậu tố số nhiều trong “thánh hóa các ngươi”. Giữ sự chuyển đổi này tránh âm thầm san phẳng một đặc điểm có thật của bản Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi/người ấy/các ngươi” giữ sắc thái luật pháp và phân biệt rõ người được truyền lệnh với thầy tế lễ. Cấu trúc hơi trang trọng “là thánh đối với ngươi” được giữ để phản ánh sát quan hệ trong nguyên văn.
