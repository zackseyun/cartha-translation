  source_fidelity: 'Bản dịch phản ánh đúng các mệnh đề chính của tiếng Hê-bơ-rơ: mệnh lệnh đối với người nghe số ít, vị trí thánh của thầy tế lễ, lý do là người dâng "lương thực/thức ăn của Đức Chúa Trời", và lời tự xưng của Yahweh là Đấng thánh hóa dân số nhiều. Chú thích cho phép nghĩa đen "bánh" đồng thời giải thích nghĩa nghi lễ rộng của לֶחֶם.'
  naturalness: 'Cần chỉnh nhẹ để tiếng Việt hiện đại tự nhiên và rõ quan hệ sở hữu hơn: "coi người ấy là thánh" diễn đạt trực tiếp ý phải đối xử/nhìn nhận người ấy là thánh; "Đức Chúa Trời của ngươi" là cấu trúc sở hữu thông dụng hơn; và vị ngữ apposition cuối câu nên đặt "là Đấng" sau tên Yahweh.'
  terminology: Giữ nhất quán trường từ vựng thánh/thánh hóa cho קדשׁ. Giữ "Yahweh" theo quyết định danh xưng của dự án. "Thức ăn" là cách chuyển nghĩa phù hợp trong ngữ cảnh tế tự; chú thích giữ phương án "bánh".
  issues:
