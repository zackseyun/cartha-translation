source:
  edition: WLC
  text: וְ/לֹֽא יְחַלֵּ֥ל זַרְע֖/וֹ בְּ/עַמָּ֑י/ו כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשֽׁ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: vi
  text: Người không được làm cho dòng dõi mình trở nên phàm tục giữa dân mình,[a][b] vì Ta là Yahweh, Đấng thánh hóa người.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm ô tục dòng dõi mình” hoặc “làm nhục dòng dõi mình”. Động từ Hê-bơ-rơ diễn tả việc làm điều đáng lẽ thánh trở thành phàm tục.'
    reason: lexical_alternative
  - marker: b
    text: Trong văn cảnh này, việc vi phạm các quy định về hôn nhân sẽ khiến dòng dõi của vị thượng tế bị làm thành phàm tục trong cộng đồng giao ước.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “Đấng làm cho người nên thánh” hoặc “Đấng biệt riêng người ra thánh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: làm ô uế
  rationale: Dạng Piel của חלל trong bối cảnh về sự thánh khiết mang nghĩa biến điều đáng lẽ thánh thành phàm tục hoặc làm cho bị ô uế. “Làm ô uế” tự nhiên trong tiếng Việt và vẫn giữ sắc thái thánh–phàm.
- source_word: זַרְעוֹ
  choice: dòng dõi mình
  rationale: זֶרַע có thể chỉ hạt giống, con cái hoặc hậu duệ. Trong bối cảnh hôn nhân và dòng tư tế, “dòng dõi mình” diễn đạt tự nhiên ý nghĩa gia hệ mà không thu hẹp vào một người con.
- source_word: בְּעַמָּיו
  choice: giữa dân mình
  rationale: Cụm בְּעַמָּיו được chuyển sát nghĩa là “giữa dân mình”, giữ nguyên khung cảnh cộng đồng của lời cấm.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng chuyển tự Yahweh, thay vì thay bằng một tước hiệu.
- source_word: מְקַדְּשׁוֹ
  choice: Đấng thánh hóa người
  rationale: Phân từ của קדשׁ nói đến việc làm nên thánh hoặc biệt riêng ra. “Thánh hóa” giữ được thuật ngữ về sự thánh khiết và không thu hẹp nghĩa chỉ vào một nghi lễ tấn phong.
theological_decisions:
- issue: Đối tượng của việc làm ô uế và lý do về sự thánh khiết
  choice: Câu này nói rằng vị thượng tế không được làm ô uế dòng dõi mình giữa dân mình, vì Yahweh là Đấng thánh hóa người.
  alternative: Có thể hiểu cụ thể hơn rằng vị thượng tế không được khiến dòng dõi mình mất tư cách tư tế do kết hôn với người nữ bị cấm.
  rationale: Văn cảnh trực tiếp nói về các hạn chế hôn nhân của vị thượng tế, nhưng câu Hê-bơ-rơ dùng cách diễn đạt rộng hơn và không nói tường minh đến việc mất chức tư tế. Vì vậy, bản dịch giữ sự căng thẳng và độ rộng của nguyên văn thay vì đưa phần diễn giải vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “người” tiếp nối vị thượng tế trong văn cảnh; “Ta” thể hiện lời phán trực tiếp của Yahweh. Các thuật ngữ “ô uế” và “thánh hóa” duy trì trường nghĩa thánh–phàm của văn bản tư tế.
