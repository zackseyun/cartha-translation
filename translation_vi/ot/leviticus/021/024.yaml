  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶֽל אַהֲרֹ֖ן וְ/אֶל בָּנָ֑י/ו וְ/אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/024.yaml
  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: vi
  text: Vậy, Môi-se nói với A-rôn, các con trai của A-rôn và toàn thể con dân Y-sơ-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “tất cả các con trai của Y-sơ-ra-ên”; cũng có thể dịch là “toàn thể dân Y-sơ-ra-ên” hoặc theo cách dịch truyền thống là “toàn thể con cái Y-sơ-ra-ên.” Đây là danh xưng giao ước thông dụng chỉ dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Vậy, Môi-se nói
  rationale: Động từ với waw liên tiếp vừa tiếp nối mạch kể vừa có sắc thái tổng kết ở cuối phân đoạn; “Vậy” diễn đạt tự nhiên chức năng này.
- source_word: אֶל
  choice: với
  rationale: Trong tiếng Việt, “nói với” là cách diễn đạt tự nhiên để chỉ những người được Môi-se nói cho nghe.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Hình thái Hê-bơ-rơ là danh từ giống đực số nhiều kèm hậu tố ngôi ba giống đực số ít, chỉ rõ các con trai của A-rôn.
- source_word: כָּל
  choice: toàn thể
  rationale: “Toàn thể” diễn đạt đầy đủ ý bao quát toàn bộ cộng đồng và tự nhiên trong văn cảnh trang trọng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Đây là danh xưng cộng đồng theo giao ước. “Con dân Y-sơ-ra-ên” vừa giữ được yếu tố con cháu/dân thuộc về Y-sơ-ra-ên, vừa tự nhiên và dễ hiểu trong tiếng Việt; nghĩa sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch danh xưng giao ước בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên; con cái Y-sơ-ra-ên
  rationale: Cụm từ nguyên văn có nghĩa sát chữ là “các con trai của Y-sơ-ra-ên” nhưng thường được dùng như danh xưng tập thể cho dân Y-sơ-ra-ên. Bản dịch chính giữ tính cộng đồng mà không thu hẹp đối tượng chỉ còn nam giới; chú thích bảo tồn hình thức nguyên ngữ và các cách dịch khả dĩ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se,” “A-rôn” và “Y-sơ-ra-ên” theo dạng tên quen thuộc trong Kinh Thánh tiếng Việt; giữ câu ngắn, có tính kết đoạn.
