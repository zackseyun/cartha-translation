base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: vi
  text: 'Hãy nói với A-rôn rằng: “Bất cứ người nam nào thuộc dòng dõi ông trong mọi thế hệ, nếu có khuyết tật[a], thì không được đến gần để dâng thức ăn[b] của Đức Chúa Trời mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tì vết”. Từ Hê-bơ-rơ mum trong ngữ cảnh này chỉ một khuyết tật thể chất khiến người ấy không được thực hiện nhiệm vụ tư tế này.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa đen là “bánh”. Trong ngữ cảnh tư tế này, “bánh” được dùng theo nghĩa rộng hơn, chỉ thức ăn được dâng làm lễ vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: Hãy nói với A-rôn rằng
  rationale: Diễn đạt tự nhiên công thức truyền lệnh của tiếng Hê-bơ-rơ, đồng thời giữ mệnh lệnh trực tiếp.
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: bất cứ người nam nào trong dòng dõi của ông
  rationale: אִישׁ là danh từ giống đực số ít; trong quy định về tư tế, cụm này chỉ nam giới thuộc dòng dõi A-rôn. “Dòng dõi” truyền đạt ý nghĩa huyết thống của זֶרַע mà không dùng cách nói cổ “hạt giống”.
- source_word: לְדֹרֹתָם
  choice: qua các thế hệ
  rationale: Cho thấy quy định tiếp tục có hiệu lực trong những thế hệ nối tiếp của dòng A-rôn.
- source_word: מוּם
  choice: khuyết tật
  rationale: Trong ngữ cảnh tư tế, מוּם chỉ một khiếm khuyết thể chất khiến người ấy không đủ điều kiện thực hiện nhiệm vụ tế lễ cụ thể. “Khuyết tật” rõ nghĩa hơn “tì vết”, vốn dễ bị hiểu là dấu vết nhỏ hoặc vấn đề đạo đức.
- source_word: לֹא יִקְרַב
  choice: không được đến gần
  rationale: Giữ hình ảnh tiếp cận nơi thánh của động từ קרב và thể hiện rõ hiệu lực cấm đoán của quy định.
- source_word: לְהַקְרִיב
  choice: để dâng
  rationale: Trong ngữ cảnh tế lễ, dạng Hiphil của קרב nói đến việc đem lễ vật đến dâng; “dâng” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: לֶחֶם אֱלֹהָיו
  choice: thức ăn của Đức Chúa Trời mình
  rationale: לֶחֶם theo nghĩa đen là “bánh”, nhưng trong thành ngữ tế lễ ở đây chỉ rộng hơn đến thức ăn được dâng làm lễ vật. “Thức ăn” truyền đạt nghĩa theo ngữ cảnh, còn nghĩa đen được bảo lưu trong chú thích.
theological_decisions:
- issue: Quy định nghi lễ đối với tư tế có khuyết tật thể chất
  choice: Diễn đạt đây là lệnh cấm đến gần để thực hiện việc dâng lễ vật cụ thể.
  alternative: Diễn đạt theo cách có thể hàm ý người có khuyết tật thấp kém về đạo đức hoặc bị loại khỏi toàn bộ cộng đồng giao ước.
  rationale: Câu này giới hạn một chức năng tư tế tại nơi thánh; bản văn không đưa ra phán xét về tội lỗi, phẩm giá con người hay địa vị giao ước của người ấy.
- issue: Hình ảnh לֶחֶם אֱלֹהָיו
  choice: Dùng “thức ăn của Đức Chúa Trời mình”, kèm chú thích nghĩa đen “bánh”.
  alternative: Dùng trực tiếp “bánh của Đức Chúa Trời mình”.
  rationale: “Thức ăn” làm rõ thành ngữ tế lễ cho độc giả hiện đại mà không xóa hình ảnh nguyên ngữ, vì nghĩa đen được ghi trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” để quy chiếu rõ đến A-rôn trong lời truyền đạt, tránh đại từ cổ “ngươi”. Cấu trúc câu giữ sắc thái pháp lý-nghi lễ nhưng không gán ý nghĩa đạo đức cho tình trạng khuyết tật.
