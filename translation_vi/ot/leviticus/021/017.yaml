- from: 'Hãy nói với A-rôn rằng: “Qua các thế hệ, bất cứ người nam nào trong dòng dõi của ông mà có khuyết tật[a] thì không được đến gần để dâng thức ăn[b] của Đức Chúa Trời mình.”'
  to: 'Hãy nói với A-rôn rằng: “Bất cứ người nam nào thuộc dòng dõi ông trong mọi thế hệ, nếu có khuyết tật[a], thì không được đến gần để dâng thức ăn[b] của Đức Chúa Trời mình.”'
  rationale: Chỉ điều chỉnh vị trí và cách diễn đạt của cụm chỉ sự tiếp nối qua các thế hệ để phản ánh rõ hơn cú pháp và phạm vi của לְדֹרֹתָם. Nghĩa pháp lý-nghi lễ, ngôn ngữ về khuyết tật, và thành ngữ tế tự của bản gốc đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh nói với A-rôn, giới hạn đối với người nam thuộc hậu duệ A-rôn có מוּם, hành động «đến gần» theo thuật ngữ nghi lễ, và mục đích dâng «lương thực/bánh của Đức Chúa Trời mình». «Khuyết tật» và «thức ăn» là các lựa chọn ngữ cảnh có thể chấp nhận được, với chú thích bảo lưu nghĩa đen của לֶחֶם.
  naturalness: Câu hiện có nhìn chung tự nhiên và trang trọng. Tuy nhiên, «Qua các thế hệ» đứng đầu câu dễ tạo cảm giác là trạng ngữ lỏng, không gắn rõ với «dòng dõi» như לְדֹרֹתָם. «Trong mọi thế hệ» đặt cạnh cụm chỉ dòng dõi diễn đạt rõ và tự nhiên hơn trong tiếng Việt hiện đại.
  terminology: Giữ A-rôn, «khuyết tật», «đến gần», «dâng», và «thức ăn của Đức Chúa Trời mình». Các từ này duy trì sắc thái pháp lý-nghi lễ mà không suy diễn về giá trị hay tình trạng đạo đức của người có khuyết tật. Chú thích về «bánh» giải thích đúng nghĩa tế tự rộng của לֶחֶם.
