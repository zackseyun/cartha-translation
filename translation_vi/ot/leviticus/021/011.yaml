source:
  edition: WLC
  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: vi
  text: Người không được đến gần bất cứ thi thể nào[a]; ngay cả vì cha hay mẹ mình, người cũng không được làm cho mình ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xác chết.” Theo sát mặt chữ: “những người chết”; trong luật thanh sạch, đây là một cách nói chỉ thi thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל ... לֹא יָבֹא
  choice: không được đến gần
  rationale: Trong luật thanh sạch của giới tư tế, בוא với עַל diễn tả việc đến gần hoặc tiếp xúc với thi thể, chứ không đơn thuần là chuyển động đến một nơi. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ sức mạnh của lệnh cấm.
- source_word: כָּל
  choice: bất cứ ... nào
  rationale: Khi đi với mệnh đề phủ định, cách diễn đạt này truyền đạt rõ phạm vi tuyệt đối của lệnh cấm.
- source_word: נַפְשֹׁת מֵת
  choice: thi thể
  rationale: Cụm từ theo sát mặt chữ có thể là “người chết” hoặc “sinh mạng của người chết”, nhưng trong luật ô uế của Lê-vi, נֶפֶשׁ ở cấu trúc này chỉ thi thể người. “Thi thể” rõ nghĩa và tránh gợi sai rằng đây là linh hồn.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: ngay cả vì cha hay mẹ mình
  rationale: 'לְ ở đây nêu trường hợp liên hệ: lệnh cấm vẫn áp dụng khi người chết là cha hoặc mẹ. “Ngay cả” thể hiện sự nhấn mạnh ngầm khi hai thân nhân gần gũi nhất được nêu sau lệnh cấm tổng quát; “hay” phù hợp với ý phân phối trong tiếng Việt.'
- source_word: לֹא יִטַּמָּא
  choice: không được làm cho mình ô uế
  rationale: Dạng Hitpael có nghĩa phản thân. Cách dịch này giữ thuật ngữ về tình trạng ô uế theo luật thanh sạch mà không biến nó thành một nhận định thuần túy về đạo đức.
theological_decisions:
- issue: Thuật ngữ về sự ô uế
  choice: Giữ cách nói “làm cho mình ô uế”.
  alternative: “làm nhơ uế mình” hoặc “trở nên ô uế về nghi lễ”
  rationale: Câu này nói về sự ô uế do thi thể trong luật dành cho giới tư tế. “Ô uế” bảo toàn phạm trù Kinh Thánh mà không đồng nhất nó với tội lỗi; thêm “về nghi lễ” sẽ giải thích nhiều hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người” để tiếp nối chủ thể là thầy tế lễ thượng phẩm trong văn cảnh. Cấu trúc “không được” phù hợp với lệnh cấm pháp quy trong tiếng Việt; “ngay cả” làm nổi bật việc không có ngoại lệ cho cha mẹ mà không thêm một ngoại lệ thần học mới.
