  yaml_path: translation/ot/leviticus/021/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn lời của Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”; liên từ וַ đánh dấu diễn tiến của trình thuật nhưng không nhất thiết phải biểu đạt riêng bằng “và” trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu nói năng tiếng Việt, “phán với” diễn đạt tự nhiên đối tượng tiếp nhận lời phán.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng phổ biến trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức mở đầu lời nói, “rằng” là cách chuyển ngữ tiếng Việt tự nhiên, báo hiệu nội dung lời phán tiếp theo.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” giữ chức năng danh riêng và là dạng quen thuộc, trang trọng đối với độc giả Việt, không thay danh ấy bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn lời ngắn gọn; dấu hai chấm cho biết lời phán được tiếp nối ở câu sau.
