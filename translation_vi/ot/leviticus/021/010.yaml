id: LEV.21.10
reference: Leviticus 21:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/כֹּהֵן֩ הַ/גָּד֨וֹל מֵ/אֶחָ֜י/ו אֲֽשֶׁר יוּצַ֥ק עַל רֹאשׁ֣/וֹ שֶׁ֤מֶן הַ/מִּשְׁחָה֙ וּ/מִלֵּ֣א אֶת יָד֔/וֹ לִ/לְבֹּ֖שׁ אֶת הַ/בְּגָדִ֑ים אֶת רֹאשׁ/וֹ֙ לֹ֣א יִפְרָ֔ע וּ/בְגָדָ֖י/ו לֹ֥א יִפְרֹֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: vi
  text: “Còn vị thượng tế, người cao trọng hơn các anh em mình, trên đầu người đã được đổ dầu xức và tay người đã được làm đầy[a] để mặc các lễ phục, thì không được để tóc xõa[b], cũng không được xé áo mình.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “tay người đã được làm đầy”, một thành ngữ chỉ việc được tấn phong hoặc lập vào chức vụ tư tế.'
    reason: lexical_alternative
  - marker: b
    text: Để tóc xõa hoặc đầu tóc rối bù và xé áo là những dấu hiệu tang chế theo phong tục thời ấy.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: vị thượng tế
  rationale: “Thượng tế” là cách gọi tự nhiên, trang trọng và đã được xác lập trong tiếng Việt cho chức vụ tư tế cao nhất.
- source_word: מֵאֶחָיו
  choice: người cao trọng hơn các anh em mình
  rationale: 'מִן được hiểu theo nghĩa so sánh: vị này có địa vị cao hơn các tư tế đồng hàng được gọi là “anh em”; cách dịch vẫn giữ ngôn ngữ nam giới của bối cảnh tư tế.'
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: đã được đổ dầu xức trên đầu
  rationale: Giữ hình ảnh nghi lễ cụ thể của động tác đổ dầu trên đầu và sắc thái bị động của nguyên văn.
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: được làm đầy tay
  rationale: Giữ thành ngữ nghi lễ Hê-bơ-rơ trong chính văn; chú thích giải thích rằng thành ngữ này chỉ việc được tấn phong hoặc lập vào chức tư tế.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: để mặc các lễ phục
  rationale: “Các lễ phục” diễn đạt tự nhiên trong tiếng Việt và làm rõ rằng הַבְּגָדִים là những y phục dành cho chức vụ vừa được nói đến.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: không được để tóc xõa
  rationale: Trong ngữ cảnh tang chế, פרע chỉ việc để tóc buông xõa hoặc đầu tóc rối bù; cách dịch này tự nhiên hơn lối dịch sát chữ “để đầu buông lỏng” mà không đồng nhất động từ với việc cởi khăn che đầu.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: cũng không được xé áo mình
  rationale: Diễn đạt rõ hành động xé y phục như một dấu hiệu tang chế, đồng thời giữ quan hệ sở hữu của nguyên văn.
theological_decisions:
- issue: Thành ngữ tấn phong מִלֵּא אֶת יָדוֹ
  choice: Giữ “được làm đầy tay” trong chính văn và giải nghĩa bằng chú thích.
  alternative: được tấn phong; được lập vào chức tư tế
  rationale: Thành ngữ mang hình ảnh nghi lễ riêng của bản văn. Giữ thành ngữ giúp người đọc thấy cách diễn đạt của nguyên ngữ, còn chú thích bảo đảm ý nghĩa chức vụ vẫn dễ hiểu.
- issue: Ý nghĩa của מֵאֶחָיו
  choice: người cao trọng hơn các anh em mình
  alternative: người đứng đầu giữa các anh em mình; người được chọn từ giữa các anh em mình
  rationale: Trong cấu trúc này, מִן thích hợp nhất với ý so sánh về địa vị. Tuy vậy, không diễn giải thêm “anh em” thành “các tư tế” trong chính văn, để giữ cách gọi mang tính gia tộc/cộng đồng của nguyên ngữ.
- issue: Dấu hiệu tang chế trong אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: không được để tóc xõa
  alternative: không được để đầu tóc rối bù; không được để đầu trần
  rationale: Ngữ cảnh song song với việc xé áo cho thấy đây là dấu hiệu tang chế. “Để tóc xõa” giữ trọng tâm về tình trạng tóc mà không quả quyết rằng câu này nói đến việc bỏ vật che đầu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “thượng tế”, “dầu xức” và “lễ phục” để phù hợp ngữ cảnh nghi lễ; giữ thành ngữ khó trong chính văn nhưng giải thích ngay bằng chú thích. Cấu trúc câu dài phản ánh chuỗi mệnh đề quan hệ của nguyên văn, song được ngắt bằng dấu phẩy để tiếng Việt tự nhiên.
