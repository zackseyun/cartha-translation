  source_fidelity: Bản dịch truyền đạt đúng chức vụ thượng tế, địa vị cao hơn các anh em, dầu xức được đổ trên đầu, hai điều cấm về dấu hiệu tang chế. Tuy nhiên, cụm “được làm đầy tay” làm mờ cấu trúc sở hữu của tiếng Hê-bơ-rơ, vốn nói rõ “tay người ấy đã được làm đầy.” Điều chỉnh cấu trúc này giữ thành ngữ nghi lễ mà phản ánh sát hơn nguyên văn.
  naturalness: Văn phong trang trọng và dễ hiểu nhìn chung. Đưa “trên đầu người” và “tay người” vào hai mệnh đề quan hệ giúp câu tiếng Việt minh bạch hơn, tránh để “được làm đầy tay” bị hiểu như một cách nói tiếng Việt thông thường nhưng không rõ nghĩa.
  terminology: “Vị thượng tế”, “dầu xức”, “lễ phục” và “tóc xõa” phù hợp với ngữ cảnh nghi lễ và tang chế. Giữ “các anh em mình” là thích hợp với cách gọi của nguyên ngữ. Chú thích về thành ngữ tấn phong là cần thiết và cần khớp chính xác với chính văn đã hiệu chỉnh.
