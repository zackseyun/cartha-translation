  yaml_path: translation/ot/leviticus/021/013.yaml
  text: And he shall take a wife in her virginity[a].
translation:
  language: vi
  text: Ông phải lấy vợ khi nàng còn đồng trinh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lấy một trinh nữ làm vợ.” Nguyên văn Hê-bơ-rơ là “trong sự đồng trinh của nàng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ông
  rationale: Đại từ độc lập làm rõ và hơi nhấn mạnh chủ thể trong mạch luật lệ. Tiếng Việt không cần dịch máy móc liên từ וְ là “và” ở đầu câu này.
- source_word: אִשָּׁה
  choice: một người vợ
  rationale: Trong kết cấu với לקח chỉ việc kết hôn, từ này mang nghĩa “vợ” hơn là nghĩa chung “người phụ nữ”.
- source_word: בִּבְתוּלֶיהָ
  choice: khi nàng còn đồng trinh
  rationale: Diễn đạt tự nhiên trạng thái đồng trinh được chỉ bởi giới từ בְּ cùng danh từ có hậu tố ngôi thứ ba giống cái; chú thích giữ lại cách dịch sát cấu trúc Hê-bơ-rơ.
- source_word: יִקָּח
  choice: phải lấy
  rationale: Trong văn cảnh luật lệ, dạng vị hoàn biểu thị nghĩa bắt buộc; “lấy một người vợ” vừa giữ thành ngữ Hê-bơ-rơ vừa rõ nghĩa kết hôn trong tiếng Việt.
theological_decisions:
- issue: Thuật ngữ hôn nhân trong luật lệ dành cho thầy tế lễ
  choice: Giữ thành ngữ “lấy một người vợ”
  alternative: Ông phải cưới một trinh nữ
  rationale: Cách chọn này bảo tồn sắc thái công thức pháp lý và thành ngữ hôn nhân của nguyên bản, đồng thời không diễn giải quá mức cụm từ chỉ tình trạng đồng trinh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; “nàng” tránh lặp nặng nề “người vợ ấy” và phù hợp với hậu tố giống cái trong nguyên văn. Dấu chú thích [a] xuất hiện ngay sau câu liên quan.
