id: LEV.21.20
reference: Leviticus 21:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֽוֹ גִבֵּ֣ן אוֹ דַ֔ק א֖וֹ תְּבַלֻּ֣ל בְּ/עֵינ֑/וֹ א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת א֖וֹ מְר֥וֹחַ אָֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: vi
  text: hoặc bị gù lưng[a], hoặc thân hình còi cọc[b], hoặc có khuyết tật ở mắt[c], hoặc bị chứng ngứa da, hoặc mắc bệnh ngoài da đóng vảy[d], hoặc có tinh hoàn bị giập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lưng cong”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ ở đây không chắc nghĩa; có thể chỉ vóc người thấp bé, không phát triển hoặc thân thể teo tóp.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể là “có đốm trong mắt”; không xác định được chính xác loại khuyết tật ở mắt.
    reason: lexical_alternative
  - marker: d
    text: Hai từ Hê-bơ-rơ trong câu này có lẽ chỉ hai bệnh ngoài da khác nhau; không xác định được chính xác các bệnh ấy theo thuật ngữ y khoa hiện đại.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: bị gù lưng
  rationale: Chỉ một dị tật ở lưng, có lẽ lưng gù hoặc cong; cách diễn đạt này tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: דַק
  choice: thân hình còi cọc
  rationale: Từ Hê-bơ-rơ khó xác định, có thể chỉ vóc người thấp bé, không phát triển hoặc teo tóp; “thân hình còi cọc” giữ được phạm vi nghĩa mà không khẳng định quá mức.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: có khuyết tật ở mắt
  rationale: Cụm từ chỉ một bất thường ở mắt nhưng không đủ căn cứ để xác định bệnh trạng hiện đại cụ thể.
- source_word: גָרָב
  choice: mắc bệnh ghẻ ngứa
  rationale: Chỉ một bệnh hoặc chứng kích ứng ngoài da; cách dịch này giữ sắc thái ngứa/ghẻ nhưng không gán một chẩn đoán y khoa quá chuyên biệt.
- source_word: יַלֶּפֶת
  choice: mắc bệnh ngoài da đóng vảy
  rationale: Đây là bệnh da khác với גָרָב; cách dịch phân biệt hai thuật ngữ đồng thời tránh đồng nhất chắc chắn với một bệnh hiện đại.
- source_word: מְרֹחַ אָשֶׁךְ
  choice: có tinh hoàn bị giập
  rationale: Cụm từ nói trực tiếp đến tinh hoàn bị nghiền, giập hoặc tổn thương; bản dịch giữ sự rõ ràng về giải phẫu và mức độ cụ thể của nguyên văn.
- source_word: אוֹ
  choice: hoặc
  rationale: Tiểu từ phân tuyển được lặp lại để đánh dấu từng mục trong danh sách; dịch nhất quán là “hoặc”.
theological_decisions:
- issue: Cách diễn đạt các tình trạng cơ thể trong luật về chức vụ tư tế
  choice: Dùng ngôn ngữ thể chất trực tiếp, không gán ý nghĩa đạo đức cho các tình trạng này.
  alternative: Dùng lối nói giảm nhẹ hoặc thuật ngữ chẩn đoán y khoa hiện đại.
  rationale: Câu này liệt kê các tình trạng ảnh hưởng đến tư cách thực hiện việc phụng sự nơi bàn thờ, chứ không tuyên bố rằng người mang tình trạng ấy có tội. Bản dịch vì thế giữ trọng tâm cụ thể của nguyên văn mà không thêm phán xét đạo đức.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ cấu trúc liệt kê bằng “hoặc”; dùng thuật ngữ cơ thể trực tiếp nhưng không miệt thị, và ghi chú những chỗ nguyên ngữ không chắc chắn.
