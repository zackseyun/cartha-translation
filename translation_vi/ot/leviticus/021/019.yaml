  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc tuyển lựa tiếp diễn của אוֹ và đúng hai tình trạng song song: gãy chân và gãy tay. “Chân/tay” là cách dùng tiếng Việt tự nhiên, đồng thời không thu hẹp quá mức phạm vi ngữ nghĩa có thể bao gồm chi dưới/chi trên của רָגֶל và יָד. Trong văn mạch trực tiếp về các tư tế nam, “người” xác định đủ đối tượng mà không cần thêm “đàn ông” trong từng mục liệt kê.'
