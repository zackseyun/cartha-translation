  text: hoặc người bị gãy chân hay gãy tay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “người mà trong người ấy có chỗ gãy ở chân hoặc chỗ gãy ở tay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: hoặc
  rationale: Liên từ phân cách đơn giản, tiếp tục danh sách các khuyết tật thân thể khiến một người không đủ điều kiện thi hành chức vụ.
- source_word: אִישׁ
  choice: người
  rationale: Trong ngữ cảnh luật dành cho các tư tế nam, “người” tự nhiên và rõ nghĩa trong tiếng Việt; không cần thêm “đàn ông” vì ngữ cảnh đã xác định đối tượng.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: bị
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “mà trong người ấy có”; tiếng Việt diễn đạt tình trạng này tự nhiên nhất bằng “bị”.
- source_word: שֶׁבֶר
  choice: gãy
  rationale: Danh từ chỉ chỗ gãy hoặc tình trạng gãy xương. “Gãy” là cách nói thông dụng, gọn và tự nhiên hơn “có chỗ gãy” hay thuật ngữ lâm sàng “nứt/gãy xương”.
- source_word: רָגֶל
  choice: chân
  rationale: רָגֶל thường chỉ bàn chân nhưng cũng có thể chỉ chân nói chung; trong tiếng Việt, “gãy chân” là cách diễn đạt tự nhiên và không buộc phải xác định riêng bàn chân.
- source_word: שֶׁבֶר יָד
  choice: gãy tay
  rationale: יָד có nghĩa cơ bản là bàn tay nhưng có thể mở rộng chỉ tay/cánh tay. “Gãy tay” là cách nói tự nhiên trong tiếng Việt, đồng thời giữ được phạm vi nghĩa rộng của từ Hê-bơ-rơ.
