id: LEV.21.18
reference: Leviticus 21:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: vi
  text: 'Vì bất cứ người nam nào có khuyết tật đều không được đến gần[a]: người mù, người què, người có khuôn mặt bị biến dạng[b], hoặc người có chi thể dài quá mức[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đến gần” ở đây nói đến việc đến gần để thực hiện phận sự tư tế.
    reason: cultural_note
  - marker: b
    text: Từ Hê-bơ-rơ này hiếm và không rõ nghĩa; có thể chỉ sự tổn thương hoặc biến dạng ở khuôn mặt, có lẽ cụ thể là mũi.
    reason: lexical_alternative
  - marker: c
    text: 'Có thể dịch: “người có một chi thể bị kéo dài hoặc biến dạng”; từ Hê-bơ-rơ có lẽ chỉ một bộ phận cơ thể dài quá mức hoặc mất cân xứng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do cho quy định ngay trước đó.
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: bất cứ người nam nào có khuyết tật
  rationale: Trong cấu trúc có phủ định, כָל אִישׁ mang nghĩa không một người nam nào thuộc trường hợp này; “người nam” phù hợp bối cảnh các con trai A-rôn làm tư tế. מוּם chỉ khuyết tật thân thể khiến người ấy không đủ điều kiện thực hiện việc phụng sự tư tế trong ngữ cảnh này.
- source_word: לֹא יִקְרָב
  choice: đều không được đến gần
  rationale: Diễn đạt tự nhiên giá trị cấm đoán của thể chưa hoàn thành có לֹא; “đến gần” giữ sắc thái nghi lễ, được chú thích để nêu rõ phạm vi phụng sự tư tế.
- source_word: עִוֵּר
  choice: người mù
  rationale: Cách diễn đạt trực tiếp, tự nhiên và sát nghĩa.
- source_word: פִסֵּחַ
  choice: người què
  rationale: Từ ngữ tiếng Việt thông dụng chỉ tình trạng đi lại khập khiễng hoặc suy giảm khả năng vận động được nói đến ở đây.
- source_word: חָרֻם
  choice: người có bộ phận bị biến dạng
  rationale: Từ Hê-bơ-rơ hiếm và không chắc nghĩa; có thể liên quan đến một bộ phận bị tổn thương hoặc biến dạng, đôi khi được hiểu cụ thể là mũi. Bản dịch chính tránh xác định là khuôn mặt khi chứng cứ từ vựng chưa đủ chắc.
- source_word: שָׂרוּעַ
  choice: người có chi thể dài quá mức
  rationale: Có lẽ chỉ một chi hoặc bộ phận cơ thể dài, phát triển quá mức hay mất cân xứng; cách dịch này cụ thể nhưng vẫn kèm chú thích về độ bất định.
theological_decisions:
- issue: Phạm vi của lệnh cấm
  choice: Hiểu “đến gần” là đến gần để thực hiện việc phụng sự tư tế.
  alternative: Hiểu là sự loại trừ xã hội nói chung hoặc là phán quyết về phẩm giá đạo đức.
  rationale: Văn cảnh Lê-vi Ký 21 nói về điều kiện nghi lễ dành cho các tư tế thuộc dòng A-rôn. Câu này không khẳng định rằng khuyết tật làm giảm phẩm giá con người hay hàm ý tội lỗi cá nhân.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “người nam” thay vì “người” để giữ giới tính được nêu trong bối cảnh tư tế thuộc các con trai A-rôn. Các thuật ngữ mô tả thể trạng được dùng trung tính; những từ Hê-bơ-rơ hiếm được dịch thận trọng và giữ sự bất định trong chú thích.
