  source_fidelity: Bản dịch phản ánh đúng cấu trúc phủ định của כָּל־אִישׁ ... לֹא יִקְרָב và phạm vi tư tế của động từ ‘đến gần’. ‘Người có chi thể dài quá mức’ chuyển tải hợp lý שָׂרוּעַ, đồng thời chú thích giữ lại tính bất định. Tuy nhiên, ‘người có bộ phận bị biến dạng’ cho חָרֻם quá rộng và làm mờ nét nghĩa thường được liên hệ với sự biến dạng ở mặt, đặc biệt là mũi. Dịch chính nên nêu khuôn mặt, với chú thích bảo lưu sự không chắc chắn về chi tiết.
  naturalness: Văn phong nhìn chung hiện đại, rõ ràng và phù hợp văn cảnh luật lệ nghi lễ. ‘Người mù’, ‘người què’ và ‘người có chi thể dài quá mức’ là các cụm dễ hiểu trong một bản dịch sát nghĩa. Cấu trúc liệt kê tự nhiên.
  terminology: ‘Khuyết tật’ và ‘đến gần’ là các lựa chọn phù hợp; chú thích [a] cần thiết để giới hạn ‘đến gần’ vào việc phụng sự tư tế. ‘Khuôn mặt bị biến dạng’ phù hợp hơn ‘bộ phận bị biến dạng’ đối với חָרֻם, nhưng không nên khẳng định chắc chắn là mũi trong bản văn chính.
