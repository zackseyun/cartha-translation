- from: 'Vì bất cứ người nam nào có khuyết tật đều không được đến gần[a]: người mù, người què, người có bộ phận bị biến dạng[b], hoặc người có chi thể dài quá mức[c].'
  to: 'Vì bất cứ người nam nào có khuyết tật đều không được đến gần[a]: người mù, người què, người có khuôn mặt bị biến dạng[b], hoặc người có chi thể dài quá mức[c].'
  rationale: Điều chỉnh duy nhất trong bản văn chính là thay ‘bộ phận bị biến dạng’ bằng ‘khuôn mặt bị biến dạng’ để phản ánh sát hơn nghĩa có khả năng cao của חָרֻם. Chú thích [b] vẫn nêu rõ tính hiếm và bất định của từ này, bao gồm khả năng chỉ mũi, nên không áp đặt một cách giải thích quá chắc chắn. Các lựa chọn còn lại giữ nguyên vì chúng trung thành với tiếng Hê-bơ-rơ, tự nhiên trong tiếng Việt hiện đại, và không mở rộng lệnh nghi lễ thành nhận định về phẩm giá cá nhân.
