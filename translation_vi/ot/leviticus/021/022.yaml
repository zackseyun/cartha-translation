base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: vi
  text: Người ấy được ăn thức ăn[a] của Đức Chúa Trời của mình, cả những vật chí thánh lẫn những vật thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bánh”. Ở đây, “bánh” được dùng theo nghĩa rộng để chỉ các khẩu phần thánh dành cho thầy tế lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: thức ăn
  rationale: Danh từ này theo nghĩa đen là “bánh”, nhưng trong ngữ cảnh luật tế lễ có thể chỉ rộng hơn về khẩu phần dành cho thầy tế lễ. “Thức ăn” diễn đạt tự nhiên ý nghĩa thành ngữ mà không giới hạn vào bánh.
- source_word: אֱלֹהָיו
  choice: Đức Chúa Trời mình
  rationale: Hậu tố ngôi ba số ít giống đực quy chiếu về thầy tế lễ. Cách dịch này giữ quan hệ sở hữu trong tiếng Hê-bơ-rơ và tự nhiên trong tiếng Việt.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: những vật chí thánh
  rationale: Cụm kết cấu này là cách diễn đạt cấp cao nhất về độ thánh, chỉ hạng vật thánh cao nhất trong luật tế lễ. “Chí thánh” vừa trang trọng vừa giữ được sự phân hạng.
- source_word: וּמִן הַקֳּדָשִׁים
  choice: lẫn những vật thánh
  rationale: Cụm này chỉ hạng vật thánh còn lại và đối ứng với “những vật chí thánh”. “Cả… lẫn…” diễn đạt rõ việc người ấy được ăn từ cả hai hạng.
- source_word: יֹאכֵל
  choice: được ăn
  rationale: 'Trong ngữ cảnh pháp lý này, thể chưa hoàn thành biểu thị sự cho phép: dù bị hạn chế trong việc đến gần và dâng lễ, thầy tế lễ ấy vẫn có quyền ăn các phần thánh.'
theological_decisions:
- issue: Sắc thái pháp lý của יֹאכֵל trong luật dành cho thầy tế lễ
  choice: sự cho phép (“được ăn”)
  alternative: thì tương lai (“sẽ ăn”) hoặc nghĩa vụ (“phải ăn”)
  rationale: Mạch văn phân biệt điều thầy tế lễ có khuyết tật không được làm với quyền ăn các phần thánh mà người ấy vẫn giữ. “Được ăn” bảo toàn sự tương phản pháp lý ấy mà không biến quyền này thành nghĩa vụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để nối với chủ thể trong ngữ cảnh; “Đức Chúa Trời mình” giữ sắc thái sở hữu tự nhiên; “vật chí thánh/vật thánh” duy trì thuật ngữ và sự phân hạng tế lễ. Dấu chú thích [a] được đặt sau toàn câu vì chú thích giải thích cụm “thức ăn của Đức Chúa Trời mình” ở đầu câu.
