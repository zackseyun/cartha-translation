  source_fidelity: Bản dịch truyền đạt đúng cấu trúc cấm bốn hạng phụ nữ và mệnh lệnh chỉ được cưới một trinh nữ từ trong dân mình. Tuy nhiên, “bị ô danh” chủ yếu chỉ tình trạng mang tiếng xấu/danh dự bị tổn hại, không tương ứng đủ với חֲלָלָה, một thuật ngữ thuộc trường nghĩa bị làm phàm, bị xúc phạm tính thánh trong luật tư tế.
  naturalness: Câu văn rõ, hiện đại và phù hợp văn phong luật lệ. “Trong số dân mình” làm rõ hơn ý xuất thân từ giữa dân của ông.
  terminology: “Góa phụ”, “đã ly dị”, “phụ nữ mại dâm”, “trinh nữ” và “lấy ... làm vợ” đều phù hợp. Thay “bị ô danh” bằng “bị làm ô uế” để phản ánh tốt hơn thuật ngữ thánh khiết, đồng thời chú thích các cách dịch sát gốc và tránh khẳng định nguyên nhân cụ thể của tình trạng này.
