id: LEV.21.14
reference: Leviticus 21:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: vi
  text: Ông không được lấy một góa phụ, một người phụ nữ đã ly dị, một người phụ nữ bị làm ô uế[a], hay một phụ nữ mại dâm làm vợ. Ông chỉ được lấy một trinh nữ trong số dân mình làm vợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một người phụ nữ bị làm cho phàm tục” hoặc “một người phụ nữ bị xúc phạm tính thánh”. Từ Hê-bơ-rơ chỉ một người phụ nữ có tình trạng bị xem là không thích hợp theo luật thánh khiết dành cho giới tư tế; bản văn không nêu rõ nguyên nhân cụ thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: một góa phụ
  rationale: Nghĩa thông dụng của từ Hê-bơ-rơ; cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: גְרוּשָׁה
  choice: một người đàn bà đã ly dị
  rationale: Dạng từ này chỉ người phụ nữ đã bị chấm dứt hôn nhân; cách dịch tránh lối nói cổ và giữ rõ ý nghĩa pháp lý-hôn nhân.
- source_word: חֲלָלָה
  choice: một người đàn bà bị ô danh
  rationale: Trong luật thánh khiết dành cho giới tư tế, từ này nói đến người phụ nữ có địa vị bị xem là không còn phù hợp với sự thánh khiết. “Bị ô danh” giữ sắc thái bị hạ khỏi địa vị thích hợp mà không đồng nhất từ này với thuật ngữ thông thường chỉ sự ô uế nghi lễ.
- source_word: זֹנָה
  choice: một phụ nữ mại dâm
  rationale: Tương đương trực tiếp, rõ ràng và không cổ trong tiếng Việt hiện đại.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: Ông không được lấy ... làm vợ
  rationale: Diễn đạt tự nhiên thành ngữ pháp lý Hê-bơ-rơ “lấy” một người nữ, đồng thời nêu rõ quan hệ hôn nhân.
- source_word: כִּי אִם
  choice: chỉ được
  rationale: Sau mệnh đề cấm, cụm này giới hạn lựa chọn được phép; “chỉ được” thể hiện rõ sự tương phản và tính độc quyền.
- source_word: בְּתוּלָה
  choice: một trinh nữ
  rationale: Trong quy định hôn nhân này, từ chỉ một người nữ còn trinh; “trinh nữ” chính xác hơn “thiếu nữ”.
- source_word: מֵעַמָּיו
  choice: trong dân mình
  rationale: Giữ ý người vợ phải xuất thân từ giữa cộng đồng dân tộc của ông, với cách nói gọn và tự nhiên.
- source_word: אִשָּׁה
  choice: làm vợ
  rationale: Nêu rõ chức năng hôn nhân của danh từ trong thành ngữ “lấy ... làm vợ”.
theological_decisions:
- issue: Cách dịch thuật ngữ về địa vị thánh khiết חֲלָלָה trong lệnh hạn chế hôn nhân của thầy tế lễ thượng phẩm
  choice: một người đàn bà bị ô danh
  alternative: một người đàn bà bị làm cho phàm tục; một người đàn bà bị mất địa vị thánh
  rationale: Gốc từ gợi ý sự làm mất tính thánh hoặc địa vị thích hợp trong khuôn khổ luật thánh khiết. Bản dịch chính tránh giải thích quá mức bản chất cụ thể của địa vị ấy; chú thích giữ lại các khả năng sát gốc hơn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “ông” để tiếp nối chủ thể là thầy tế lễ thượng phẩm trong ngữ cảnh; dùng “lấy ... làm vợ” thay cho cách nói kỹ thuật hoặc cổ, và lặp lại cụm này để câu rõ nghĩa.
