  to: Ông không được lấy một góa phụ, một người phụ nữ đã ly dị, một người phụ nữ bị làm ô uế[a], hay một phụ nữ mại dâm làm vợ. Ông chỉ được lấy một trinh nữ trong số dân mình làm vợ.
  rationale: Sửa thuật ngữ chính cho חֲלָלָה để tránh chuyển nghĩa sang “mang tiếng xấu”, vốn không phải trọng tâm của từ gốc. Chú thích giữ các lựa chọn gần nghĩa gốc và bảo toàn sự không xác định về tình trạng cụ thể. Các điều chỉnh nhỏ về “người phụ nữ” và “trong số dân mình” tăng tính nhất quán và rõ nghĩa mà không thay đổi nội dung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:21Z'
