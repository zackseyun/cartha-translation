base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/002.yaml
  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: vi
  text: 'nhưng chỉ vì người ruột thịt[a] gần nhất của mình: vì mẹ mình, vì cha mình, vì con trai mình, vì con gái mình và vì anh hoặc em trai mình—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שְׁאֵר có nghĩa đen là “thịt” và trong ngữ cảnh này chỉ người thân cùng huyết tộc; cũng có thể dịch là “bà con huyết thống.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: nhưng chỉ vì
  rationale: Trong mạch luật nối với câu trước, cụm này nêu ngoại lệ đối với lệnh cấm bị ô uế; cách diễn đạt này tự nhiên khi đi cùng chuỗi לְ mang nghĩa “vì”.
- source_word: שְׁאֵרוֹ
  choice: người ruột thịt của mình
  rationale: שְׁאֵר có nghĩa gốc liên quan đến “thịt” và chỉ người cùng huyết tộc; “người ruột thịt” vừa rõ nghĩa thân tộc vừa giữ được sắc thái của từ Hê-bơ-rơ.
- source_word: הַקָּרֹב אֵלָיו
  choice: gần gũi với mình
  rationale: Giữ ý về mức độ gần trong quan hệ họ hàng mà không ép tính từ thành một cấp so sánh tuyệt đối không được biểu thị rõ bằng hình thái Hê-bơ-rơ.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: vì mẹ, vì cha, vì con trai, vì con gái và vì anh em trai của mình
  rationale: Lặp lại “vì” để phản ánh chuỗi giới từ לְ và cho thấy đây là những người mà vì họ thầy tế lễ được phép chịu ô uế; giữ các danh từ ở số ít theo văn phong luật pháp của nguyên bản.
theological_decisions:
- issue: Mối liên hệ với lệnh cấm chịu ô uế ở câu trước
  choice: Diễn đạt ngoại lệ bằng “nhưng chỉ vì” và giữ “vì” trước từng thân nhân
  alternative: “ngoại trừ người ruột thịt...” rồi liệt kê không có giới từ
  rationale: Lựa chọn này không bổ sung trực tiếp động từ “chịu ô uế” vốn nằm ở câu trước, nhưng vẫn bảo toàn cấu trúc ngoại lệ và vai trò của giới từ לְ trong câu Hê-bơ-rơ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Đại từ sở hữu “mình” giúp câu tự nhiên trong tiếng Việt và quy chiếu nhất quán về thầy tế lễ ở câu trước. Dấu gạch ngang cuối câu được giữ vì cú pháp và danh sách còn tiếp sang câu sau.
