id: LEV.21.9
reference: Leviticus 21:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִ/זְנ֑וֹת אֶת אָבִ֨י/הָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: vi
  text: Nếu con gái của một thầy tế lễ tự làm mình thành phàm tục vì bán dâm[a], thì cô làm nhục cha mình; cô phải bị thiêu bằng lửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bắt đầu bán dâm.” Động từ Hê-bơ-rơ có thể mang nghĩa “bắt đầu”; trong ngữ cảnh này, nó cũng có thể được hiểu là tự làm mình thành phàm tục hoặc bị làm cho phàm tục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: con gái của một thầy tế lễ
  rationale: Cụm từ nguyên văn là “con gái của một người đàn ông, một thầy tế lễ”; cách diễn đạt đã chọn chuyển đúng nghĩa sở thuộc sang tiếng Việt tự nhiên mà vẫn giữ giọng luật lệ trang trọng.
- source_word: כִּי
  choice: nếu
  rationale: Trong điều luật theo tình huống này, כִּי mở đầu trường hợp có điều kiện; “nếu” thể hiện rõ chức năng ấy.
- source_word: תֵחֵל
  choice: tự làm mình ra ô uế
  rationale: Hiểu động từ từ căn חלל theo nghĩa trở nên ô uế hoặc tự làm mình mất tính thánh, phù hợp với ngữ cảnh luật thánh khiết. Cách dịch này cũng giữ được mối liên hệ từ vựng với מְחַלֶּלֶת ở mệnh đề sau.
- source_word: לִזְנוֹת
  choice: vì làm gái mại dâm
  rationale: זנה ở đây chỉ hành vi làm gái điếm/mại dâm. “Làm gái mại dâm” cụ thể hơn cách khái quát thành mọi hình thức gian dâm, nhưng vẫn là tiếng Việt hiện đại và dễ hiểu.
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: thì cô làm ô uế cha mình
  rationale: Bản dịch giữ cha là tân ngữ trực tiếp và duy trì từ vựng ô uế/phàm tục của căn חלל, thay vì thu hẹp ý thành chỉ “làm ô danh”.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: cô phải bị thiêu trong lửa
  rationale: Thể bị động cùng dạng vị lai trong văn luật diễn tả hình phạt bắt buộc. “Phải bị thiêu trong lửa” giữ sắc thái pháp lý và hình ảnh lửa của nguyên văn.
theological_decisions:
- issue: Cách chuyển ngữ hai lần xuất hiện của căn חלל trong luật về sự thánh khiết của chức tế lễ
  choice: Dùng “làm ... ra ô uế” và “làm ô uế” ở cả hai mệnh đề
  alternative: Dịch lần đầu là “bắt đầu” hoặc dịch lần sau là “làm ô danh”
  rationale: Việc duy trì trường nghĩa ô uế/phàm tục bảo tồn mối liên hệ thần học nội tại giữa hành vi của người con gái và địa vị thánh của người cha là thầy tế lễ, nhưng không thêm một kết luận giáo phái nào.
- issue: Phạm vi của hình phạt thiêu
  choice: Không xác định trong chính văn người ấy bị thiêu sống hay thi thể bị thiêu sau khi xử tử
  alternative: Diễn giải rõ là thiêu sống hoặc xử tử rồi mới thiêu
  rationale: Câu Hê-bơ-rơ chỉ quy định “bị thiêu trong lửa” và không tự nó nêu rõ trình tự hành hình; bản dịch giữ nguyên sự không xác định ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ giọng luật lệ bằng cấu trúc “nếu ... thì ...; phải ...”. “Thầy tế lễ” duy trì thuật ngữ quen thuộc trong ngữ cảnh Lê-vi Ký, còn “làm gái mại dâm” tránh lối nói cổ nhưng vẫn thể hiện nghĩa cụ thể của hành vi.
