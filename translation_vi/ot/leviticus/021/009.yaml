revisions:
- from: Nếu con gái của một thầy tế lễ tự làm mình ra ô uế vì làm gái mại dâm[a], thì cô làm ô uế cha mình; cô phải bị thiêu trong lửa.[b]
  to: Nếu con gái của một thầy tế lễ tự làm mình thành phàm tục vì bán dâm[a], thì cô làm nhục cha mình; cô phải bị thiêu bằng lửa.
  rationale: Bản sửa dùng ngôn ngữ Việt hiện đại, trang trọng và tự nhiên hơn. “Thành phàm tục” bảo tồn trường nghĩa thánh/phàm của động từ đầu, còn “làm nhục cha mình” chuyển tải hệ quả đối với người cha bằng một thành ngữ Việt tự nhiên, không khẳng định quá mức cơ chế nghi lễ. Bỏ chú thích b vì câu nguồn không nêu trình tự hành hình và không có bất định từ vựng cần chú thích tại vị trí ấy.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:24Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc điều kiện và hình phạt của tiếng Hê-bơ-rơ, nhưng cách dùng “làm ô uế cha mình” không tự nhiên trong tiếng Việt và không diễn đạt rõ ý làm xúc phạm/vi phạm tính thánh gắn với địa vị tư tế của người cha. “Trong lửa” cũng kém sát ngữ thức pháp lý tự nhiên hơn “bằng lửa.”
  naturalness: “Tự làm mình ra ô uế” và nhất là “làm ô uế cha mình” là những cụm gượng trong tiếng Việt hiện đại. “Tự làm mình thành phàm tục” giữ được trường nghĩa thánh/phàm của חלל trong mệnh đề đầu; “làm nhục cha mình” là cách diễn đạt Việt ngữ tự nhiên cho hệ quả đối với người cha trong mệnh đề sau.
  terminology: Giữ “thầy tế lễ” nhất quán với thuật ngữ Lê-vi Ký. “Phàm tục” thích hợp hơn “ô uế” cho חלל, vốn thuộc trường nghĩa làm mất tính thánh/profanation, không nhất thiết là ô uế theo nghĩa nghi lễ. “Bán dâm” diễn đạt cụ thể זנה mà không dùng cụm từ thừa “làm gái mại dâm.”
  issues:
  - severity: medium
    issue: Cụm “tự làm mình ra ô uế”/“làm ô uế cha mình” thiếu tự nhiên và làm mờ phân biệt giữa ‘ô uế’ và ‘phàm tục’.
    rationale: חלל ở đây liên hệ đến sự thánh/phàm của chức tư tế. Người cha là đối tượng của מְחַלֶּלֶת, nhưng tiếng Việt không nói tự nhiên rằng một người ‘làm ô uế cha mình’; cần một cách chuyển ngữ tự nhiên hơn mà không biến câu thành một kết luận giáo lý.
  - severity: low
    issue: Chú thích b thêm một vấn đề lịch sử-pháp lý không phải là bất định văn bản trong câu Hê-bơ-rơ.
    rationale: Chính văn chỉ cần dịch hình phạt theo công thức pháp lý. Chú thích này không giúp làm rõ một từ hay cấu trúc được neo trong bản dịch và có thể hướng người đọc vào một suy luận ngoài câu.
