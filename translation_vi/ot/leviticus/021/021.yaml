revisions:
- from: Không một người nam nào thuộc dòng dõi thầy tế lễ A-rôn mà có khuyết tật được đến gần để dâng các lễ vật bằng lửa lên Đức Giê-hô-va[a]. Người ấy có khuyết tật; người ấy không được đến gần để dâng bánh của Đức Chúa Trời mình[b].
  to: Không một người nam nào trong dòng dõi A-rôn, thầy tế lễ, mà có khuyết tật được đến gần để dâng các lễ vật thực phẩm của Yahweh[a]. Người ấy có khuyết tật; người ấy không được đến gần để dâng bánh của Đức Chúa Trời của người ấy[b].
  rationale: Sửa tên יהוה thành “Yahweh” để phù hợp quyết định dự án; làm rõ A-rôn là “thầy tế lễ”; và đưa “lễ vật thực phẩm” vào bản văn chính theo lựa chọn ngữ nghĩa của POB. Bản sửa vẫn giữ nguyên sự lặp lại, giọng văn pháp luật và thành ngữ tế lễ của nguyên văn, không thêm diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:28Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được cấu trúc cấm đoán bao quát, dòng dõi A-rôn, sự lặp lại của “có khuyết tật” và “đến gần để dâng”, cũng như thành ngữ “bánh của Đức Chúa Trời”. Tuy nhiên, tên riêng יהוה nên nhất quán với quyết định dự án và vệt kiểm tra tiếng Anh là “Yahweh”, không phải “Đức Giê-hô-va”. Cụm đồng vị הַכֹּהֵן cũng nên được thể hiện rõ là bổ nghĩa cho A-rôn.
  naturalness: Bản sửa dùng câu văn luật pháp trang trọng, hiện đại. “A-rôn, thầy tế lễ” làm rõ quan hệ đồng vị; “Đức Chúa Trời của người ấy” tự nhiên và rõ sở hữu hơn “Đức Chúa Trời mình”.
  terminology: Giữ “khuyết tật” là cách diễn đạt hiện đại, không miệt thị, cho מוּם trong ngữ cảnh điều kiện phụng tự. Dùng “lễ vật thực phẩm” cho אִשֵּׁי theo lựa chọn chính của POB, đồng thời chú thích phương án kỹ thuật “lễ vật bằng lửa”. Giữ “bánh” cho לֶחֶם và giải thích nghĩa tế lễ trong chú thích.
  issues:
  - severity: medium
    issue: Tên יהוה được dịch là “Đức Giê-hô-va” thay vì “Yahweh”.
    rationale: Vệt kiểm tra tiếng Anh và quyết định thuật ngữ của dự án chọn “Yahweh” làm cách thể hiện trực tiếp tên riêng יהוה. Cần nhất quán liên bản dịch.
  - severity: low
    issue: “thuộc dòng dõi thầy tế lễ A-rôn” có thể thoáng gây mơ hồ về phạm vi đồng vị.
    rationale: Nguyên văn nói “dòng dõi A-rôn, thầy tế lễ”; đặt “thầy tế lễ” sau A-rôn phản ánh rõ hơn cấu trúc ấy.
  - severity: low
    issue: Cách dịch chính của אִשֵּׁי không theo lựa chọn “food offerings” trong vệt kiểm tra tiếng Anh.
    rationale: “Lễ vật bằng lửa” là một phương án truyền thống có cơ sở, nhưng dự án chọn nghĩa chính “lễ vật thực phẩm”; phương án liên hệ lửa thích hợp hơn ở chú thích.
