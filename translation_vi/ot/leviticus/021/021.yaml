id: LEV.21.21
reference: Leviticus 21:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: vi
  text: Không một người nam nào trong dòng dõi A-rôn, thầy tế lễ, mà có khuyết tật được đến gần để dâng các lễ vật thực phẩm của Yahweh[a]. Người ấy có khuyết tật; người ấy không được đến gần để dâng bánh của Đức Chúa Trời của người ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các lễ vật bằng lửa của Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: '“Bánh của Đức Chúa Trời của người ấy” là thành ngữ tế lễ chỉ thức ăn được dâng lên Đức Chúa Trời; cũng có thể dịch: “thức ăn của Đức Chúa Trời của người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: Không một người nam nào ... được
  rationale: Kết cấu כָּל đi với mệnh đề phủ định diễn đạt lệnh cấm bao quát. “Người nam” giữ đúng hình thức giống đực và bối cảnh chức tế lễ.
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: thuộc dòng dõi thầy tế lễ A-rôn
  rationale: זֶרַע ở đây chỉ hậu duệ theo dòng tộc; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ הַכֹּהֵן làm danh xưng đồng vị của A-rôn.
- source_word: מוּם
  choice: khuyết tật
  rationale: Trong luật dành cho thầy tế lễ, từ này nói đến tình trạng thân thể khiến một người không đủ điều kiện thực hiện nhiệm vụ tế lễ; “khuyết tật” là cách nói hiện đại, rõ nghĩa.
- source_word: יִגַּשׁ
  choice: đến gần
  rationale: Giữ sát nghĩa động từ נגשׁ trong bối cảnh phụng tự và bảo toàn sự lặp lại có chủ ý trong câu.
- source_word: לְהַקְרִיב
  choice: để dâng
  rationale: Trong bối cảnh hiến tế, הקריב có nghĩa trình dâng hoặc dâng lễ vật; “dâng” tự nhiên và trang trọng.
- source_word: אִשֵּׁי יְהוָה
  choice: các lễ vật bằng lửa lên Đức Giê-hô-va
  rationale: אִשֶּׁה là thuật ngữ tế lễ có liên hệ với lửa; bản dịch chính giữ cách hiểu truyền thống, còn nghĩa rộng “lễ vật thực phẩm” được ghi ở chú thích.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt để biểu thị trực tiếp Danh Giao Ước יהוה, thay vì thay bằng tước hiệu “Chúa”.
- source_word: לֶחֶם אֱלֹהָיו
  choice: bánh của Đức Chúa Trời mình
  rationale: Giữ nghĩa cụ thể “bánh” và thành ngữ tế lễ của nguyên văn; chú thích giải thích rằng ở đây từ này có thể chỉ rộng hơn đến thức ăn được dâng cho Đức Chúa Trời.
theological_decisions:
- issue: Cách chuyển dịch Danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng Danh riêng יהוה. Bản tiếng Việt biểu thị Danh ấy bằng dạng quen thuộc “Đức Giê-hô-va”, không thay bằng một tước hiệu.
- issue: Ý nghĩa của אִשֵּׁי trong ngôn ngữ tế lễ
  choice: các lễ vật bằng lửa
  alternative: các lễ vật thực phẩm
  rationale: Ngữ nguyên và cách dùng truyền thống nâng đỡ nghĩa liên quan đến lửa, trong khi sự song hành với “bánh của Đức Chúa Trời mình” cho phép cách hiểu nhấn mạnh thực phẩm; giữ phương án chính và nêu phương án kia trong chú thích để không xóa bỏ sự căng nghĩa.
- issue: “Bánh của Đức Chúa Trời mình”
  choice: giữ thành ngữ theo nghĩa đen
  alternative: thức ăn của Đức Chúa Trời mình
  rationale: Cách nói này là ngôn ngữ tế lễ về vật được dâng lên Đức Chúa Trời, không hàm ý Ngài cần thức ăn. Giữ hình ảnh nguyên văn và giải thích ở chú thích tránh diễn giải thần học quá mức ngay trong câu.
translation_notes:
  register: Văn phong luật pháp, trang trọng nhưng hiện đại. Lặp lại “có khuyết tật” và “đến gần để dâng” nhằm bảo toàn cấu trúc nhấn mạnh của tiếng Hê-bơ-rơ. Dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh tiếng Việt phổ thông; không dùng lối nói miệt thị.
