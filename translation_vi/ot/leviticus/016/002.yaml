source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Hãy bảo A-rôn, anh con, không được tùy tiện đi vào nơi thánh, phía trong bức màn, đến trước nắp chuộc tội[a] ở trên Hòm Giao Ước, kẻo A-rôn phải chết; vì Ta sẽ hiện ra trong đám mây, trên nắp chuộc tội.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngai thi ân”, theo cách dịch truyền thống.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời bằng dạng phiên âm quen dùng trong dự án, thay vì thay bằng một tước hiệu.
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: Hãy bảo A-rôn, anh con
  rationale: “Hãy bảo” truyền đạt tự nhiên sức mạnh của mệnh lệnh; “anh con” giữ quan hệ gia đình và khá sát trật tự Hê-bơ-rơ.
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: không được tùy tiện đi vào
  rationale: Mệnh đề cấm A-rôn vào nơi ấy vào bất cứ lúc nào mình muốn, chứ không nói rằng ông không được vào liên tục.
- source_word: הַקֹּדֶשׁ מִבֵּית לַפָּרֹכֶת
  choice: nơi thánh phía trong bức màn
  rationale: Diễn đạt vị trí ở phía bên trong bức màn mà không tự ý thay danh từ nguồn bằng thuật ngữ cụ thể hơn như “Nơi Chí Thánh”.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Chỉ vật thể là chiếc nắp trên Hòm, đồng thời chuyển tải mối liên hệ từ vựng với nghi thức chuộc tội; cách dịch truyền thống được ghi ở chú thích.
- source_word: הָאָרֹן
  choice: Hòm Giao Ước
  rationale: “Hòm” một mình dễ thiếu rõ nghĩa trong tiếng Việt hiện đại; “Hòm Giao Ước” dùng tên gọi quen thuộc của vật được nói đến, dù nguyên văn tại đây chỉ ghi “Hòm”.
- source_word: וְלֹא יָמוּת
  choice: kẻo người phải chết
  rationale: Diễn đạt ngắn gọn hậu quả cần tránh của việc vi phạm lệnh cấm, với sắc thái trang trọng nhưng vẫn tự nhiên.
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: vì Ta sẽ hiện ra trong đám mây
  rationale: Giữ quan hệ nguyên nhân của כִּי và hình ảnh “đám mây” trong nguyên văn, không xác định thêm đó là mây vinh quang hay khói hương.
theological_decisions:
- issue: Ý nghĩa của כַּפֹּרֶת trong nghi lễ chuộc tội
  choice: nắp chuộc tội
  alternative: ngai thi ân
  rationale: Bản dịch chính giữ cả tính chất cụ thể của chiếc nắp và chức năng nghi lễ liên quan đến sự chuộc tội; chú thích bảo tồn cách gọi truyền thống mà không buộc từ Hê-bơ-rơ phải mang hình ảnh một chiếc ngai.
- issue: Phạm vi của בְּכָל עֵת
  choice: cấm việc tùy tiện vào nơi cực thánh
  alternative: không được vào mọi lúc
  rationale: Ngữ cảnh quy định thời điểm và cách thức được phép vào; “tùy tiện” làm rõ đây là sự cấm đoán quyền ra vào không hạn chế, không hàm ý A-rôn từng ở đó liên tục.
- issue: Bản chất của đám mây trong câu
  choice: giữ cách gọi chung “đám mây”
  alternative: mây vinh quang hoặc khói hương
  rationale: Câu Hê-bơ-rơ không trực tiếp giải thích bản chất đám mây; không nên giải quyết thay người đọc mối liên hệ có thể có với sự hiện diện thần linh hoặc khói hương ở câu 13.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Môi-se”, “A-rôn” theo dạng phiên âm tiếng Việt quen thuộc; viết hoa “Hòm Giao Ước” như tên của vật thánh. Đại từ “Ta” và “người” giữ sắc thái tôn nghiêm trong lời phán.
