source:
  edition: WLC
  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: vi
  text: Sau đó, A-rôn sẽ vào Lều Hội Kiến, cởi các y phục bằng vải lanh mà ông đã mặc khi vào nơi thánh[a], rồi để chúng lại tại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thánh sở”; dựa vào toàn cảnh Ngày Chuộc Tội, một số người hiểu cụ thể hơn là “Nơi Chí Thánh”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָא
  choice: Sau đó, ... sẽ vào
  rationale: Trong chuỗi chỉ dẫn nghi lễ, waw + qatal mang ý nghĩa hành động kế tiếp. “Sau đó” diễn đạt rõ trình tự, còn “sẽ vào” chuyển tải tự nhiên động từ בוא trong ngữ cảnh này.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Đây là danh xưng quen thuộc của lều thánh, nơi Đức Chúa Trời gặp dân Ngài; cách viết hoa cho thấy đây là tên gọi của một cơ sở thờ phượng cụ thể.
- source_word: וּפָשַׁט
  choice: cởi
  rationale: “Cởi” là cách nói tự nhiên, chính xác trong tiếng Việt khi nói về việc bỏ y phục đang mặc.
- source_word: בִּגְדֵי הַבָּד
  choice: bộ lễ phục bằng vải gai
  rationale: בגדים chỉ y phục, còn בד chỉ loại vải dùng cho y phục nghi lễ. “Bộ lễ phục” phù hợp ngữ cảnh tư tế, và “bằng vải gai” giữ lại thông tin về chất liệu.
- source_word: אֲשֶׁר לָבַשׁ
  choice: mà ông đã mặc
  rationale: Mệnh đề quan hệ xác định chính bộ y phục A-rôn mặc khi đi vào nơi thánh; “đã mặc” diễn đạt tự nhiên quan hệ thời gian trước hành động cởi.
- source_word: בְּבֹאוֹ
  choice: khi vào
  rationale: Giới từ ב với động từ nguyên mẫu cấu trúc diễn đạt hoàn cảnh thời gian; “khi vào” ngắn gọn và tự nhiên.
- source_word: הַקֹּדֶשׁ
  choice: nơi thánh
  rationale: Cụm từ Hê-bơ-rơ có nghĩa đen là “nơi thánh” hoặc “thánh sở”. Cách dịch này giữ nguyên mức độ khái quát của nguồn, không tự xác định đó là Nơi Chí Thánh.
- source_word: וְהִנִּיחָם שָׁם
  choice: rồi để chúng lại tại đó
  rationale: הניח ở đây có nghĩa đặt hoặc để lại. “Để chúng lại tại đó” diễn đạt rõ chỉ dẫn mà không thêm chi tiết về cách đặt.
theological_decisions:
- issue: Phạm vi chỉ nơi chốn của הַקֹּדֶשׁ
  choice: nơi thánh
  alternative: thánh sở; Nơi Chí Thánh
  rationale: Câu Hê-bơ-rơ chỉ dùng הַקֹּדֶשׁ, không dùng danh xưng đầy đủ và cụ thể hơn cho gian trong cùng. Vì vậy, bản chính giữ cách gọi khái quát, còn chú thích nêu cách hiểu cụ thể dựa trên toàn cảnh nghi lễ Ngày Chuộc Tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “A-rôn” theo lối phiên âm Kinh Thánh quen thuộc; “Lều Hội Kiến” như danh xưng riêng. Cấu trúc câu giữ rõ trình tự nghi lễ và dấu chú thích [a] xuất hiện ngay sau cụm từ có cách hiểu khác.
