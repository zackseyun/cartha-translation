id: LEV.16.1
reference: Leviticus 16:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: vi
  text: Yahweh phán với Môi-se sau cái chết của hai con trai A-rôn, khi họ đến gần trước mặt Yahweh[a] và chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “trong lúc họ đến gần trước mặt Yahweh.”'
    reason: Giữ lại hình thức danh động từ và sắc thái hoàn cảnh của cụm Hê-bơ-rơ בְּקָרְבָתָם.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức mở đầu lời phán của Đức Chúa Trời, “phán” là cách diễn đạt tự nhiên, trang trọng và phân biệt phù hợp với lời nói thông thường.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: אַחֲרֵי מוֹת
  choice: sau cái chết của
  rationale: Diễn đạt tự nhiên kết cấu Hê-bơ-rơ chỉ thời điểm sau biến cố hai người cùng chết, đồng thời giữ danh từ số ít của nguyên văn.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: hai con trai A-rôn
  rationale: Giữ đầy đủ số lượng và quan hệ gia đình bằng cách nói tự nhiên trong tiếng Việt.
- source_word: בְּקָרְבָתָם
  choice: khi họ đến gần
  rationale: 'Tiền tố בְּ đi với động từ nguyên thể kết cấu và hậu tố ngôi thứ ba số nhiều mang nghĩa hoàn cảnh hoặc thời gian: “khi họ đến gần.”'
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Cách dịch minh bạch, giữ được cả sắc thái không gian lẫn việc tiến vào sự hiện diện thánh trong bối cảnh nghi lễ.
- source_word: וַיָּמֻתוּ
  choice: và chết
  rationale: Giữ liên từ và sự lặp lại ngắn, mạnh của nguyên văn, dù cái chết đã được nhắc đến trước đó.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của việc hai con trai A-rôn đến gần
  choice: khi họ đến gần trước mặt Yahweh
  alternative: do họ đến gần trước mặt Yahweh
  rationale: Cấu trúc בְּ + động từ nguyên thể trước hết mô tả thời điểm hoặc hoàn cảnh. Không nên tự động biến nó thành quan hệ nguyên nhân rõ rệt hơn điều nguyên văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại “cái chết… và chết” vì đây là nét nhấn mạnh có thật trong câu Hê-bơ-rơ; dùng “trước mặt” để bảo tồn sắc thái hiện diện và nghi lễ.
