base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: vi
  text: Người đốt chúng phải giặt quần áo của mình và tắm rửa thân thể mình trong nước[a]; sau đó mới được vào trại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “thịt mình”; trong cách nói về việc tắm rửa ở đây, từ này có nghĩa là “thân thể”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người ấy sẽ vào trại.” Động từ Híp-ri có thể chỉ tương lai đơn thuần, nhưng ở đây có lẽ diễn tả việc được phép vào lại sau khi thanh tẩy.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: Người đốt
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ người thực hiện việc thiêu những phần đã nói ở câu trước.
- source_word: אֹתָם
  choice: chúng
  rationale: Đại từ tân ngữ số nhiều quy chiếu về con bò đực và con dê đực, hoặc các phần còn lại của chúng, trong ngữ cảnh ngay trước đó.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: phải giặt quần áo mình
  rationale: Dạng vị hoàn trong luật nghi lễ mang sắc thái quy định; “phải” diễn đạt nghĩa bắt buộc tự nhiên trong tiếng Việt hiện đại.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: và tắm thân thể bằng nước
  rationale: בשר nghĩa đen là “thịt”, nhưng trong thành ngữ tẩy rửa này chỉ toàn thân. “Tắm thân thể bằng nước” phân biệt rõ với việc giặt quần áo và giữ được phương tiện/chất dùng để tắm.
- source_word: וְאַחֲרֵי כֵן
  choice: sau đó
  rationale: Diễn đạt tự nhiên trình tự thời gian sau các hành động thanh tẩy.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: người ấy mới được vào trại
  rationale: Trong mạch luật thanh sạch, việc vào lại trại chỉ được phép sau khi giặt và tắm; “mới được” làm rõ quan hệ điều kiện và sự tái nhập mà không thêm nội dung thần học.
theological_decisions:
- issue: Sắc thái nghi lễ của mệnh đề cuối
  choice: người ấy mới được vào trại
  alternative: người ấy sẽ vào trại
  rationale: Dạng Híp-ri có thể được hiểu đơn thuần là tương lai, nhưng ngữ cảnh về thanh tẩy trước khi tái nhập trại nghiêng về sắc thái cho phép. Chú thích giữ lại cách đọc hình thức hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “quần áo” thay cho “y phục”, “trại” cho מחנה, và giữ giọng quy định nghi lễ bằng “phải”. Mọi dấu chú thích đều xuất hiện trong chính văn.
