- from: Người đốt chúng phải giặt quần áo mình và tắm thân thể bằng nước[a]; sau đó người ấy mới được vào trại[b].
  to: Người đốt chúng phải giặt quần áo của mình và tắm rửa thân thể mình trong nước[a]; sau đó mới được vào trại[b].
  rationale: Chỉ chỉnh cách diễn đạt “tắm thân thể bằng nước” thành “tắm rửa thân thể mình trong nước” để câu tiếng Việt tự nhiên hơn và sát cách dùng nghi lễ của nguyên văn. Giữ “sau đó mới được vào trại” vì nó diễn đạt hợp lý trình tự thanh tẩy rồi tái nhập trại; chú thích vẫn bảo lưu cách hiểu tương lai đơn thuần.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:06Z'
