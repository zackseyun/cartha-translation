  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa chính của Híp-ri: người thiêu các vật đã nêu phải giặt quần áo, rửa thân thể trong nước, rồi mới được trở vào trại. Cách hiểu sắc thái cho phép ở mệnh đề cuối được ghi nhận minh bạch bằng chú thích, đồng thời vẫn bảo lưu cách đọc tương lai đơn thuần.'
