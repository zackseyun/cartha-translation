  source_fidelity: 'Bản nháp giữ đúng trật tự và ba lần lặp của động từ כפר: cho thánh sở, Lều Hội Kiến và bàn thờ, rồi cho các thầy tế lễ và toàn dân của hội chúng. Tuy nhiên, “Nơi Chí Thánh” trong chú thích là một khả năng diễn giải theo ngữ cảnh hơn là một bất định văn bản; cần diễn đạt chú thích thận trọng hơn. Cách gọi “Lều Gặp Gỡ” truyền đạt trực tiếp hơn אֹהֶל מוֹעֵד trong tiếng Việt hiện đại.'
  naturalness: “Thánh Sở” và “Lều Hội Kiến” là những cách gọi có sắc thái Kinh Thánh truyền thống nhưng khá Hán-Việt và kém minh bạch đối với tiếng Việt hiện đại. “nơi thánh” và “Lều Gặp Gỡ” tự nhiên, rõ nghĩa hơn, đồng thời vẫn giữ register trang trọng. Việc lặp lại “Người phải làm lễ chuộc tội” phù hợp với nhịp và sự lặp lại của nguyên văn.
  terminology: Giữ nhất quán “làm lễ chuộc tội cho” đối với cả các nơi/vật thánh và con người là hợp lý, vì nguyên văn lặp lại cùng động từ כפר. “Các thầy tế lễ” và “toàn thể dân của hội chúng” là những tương ứng chính xác. Chú thích cho כפר nên giữ “thanh tẩy” như một khả năng theo ngữ cảnh nghi lễ, không thay thế bản dịch chính.
