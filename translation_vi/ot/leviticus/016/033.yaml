source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: vi
  text: Người phải làm lễ chuộc tội[a] cho nơi thánh[b], cho Lều Gặp Gỡ và cho bàn thờ; người phải làm lễ chuộc tội cho các thầy tế lễ và cho toàn thể dân của hội chúng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làm lễ xá tội” hoặc, trong ngữ cảnh nghi lễ này, “thanh tẩy”; động từ Hê-bơ-rơ כפר có thể bao hàm việc loại bỏ sự ô uế cũng như việc chuộc tội.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ này cũng có thể được hiểu là “Nơi Chí Thánh”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “toàn thể dân trong cộng đồng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: làm lễ chuộc tội
  rationale: Động từ כפר được lặp lại ba lần với nghĩa nghi lễ chuyên biệt. “Làm lễ chuộc tội” là cách diễn đạt tự nhiên, trang trọng, áp dụng được cho cả nơi thánh lẫn con người, đồng thời không giới hạn ý nghĩa vào một học thuyết chuộc tội riêng biệt.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: Thánh Sở
  rationale: Cụm từ chỉ khu vực thánh thiêng của đền tạm. “Thánh Sở” giữ được cả ý về nơi thánh và sắc thái phụng tự, nhưng không xác quyết quá mức rằng đây nhất thiết là “Nơi Chí Thánh”.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách dịch rõ nghĩa và quen thuộc, giữ hình ảnh “lều” cùng chức năng là nơi gặp gỡ được diễn tả trong tiếng Hê-bơ-rơ.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Thuật ngữ tự nhiên và chuẩn xác trong ngữ cảnh nghi lễ.
- source_word: עַל
  choice: cho
  rationale: Khi đi với כפר, giới từ עַל được diễn đạt tự nhiên trong tiếng Việt bằng “cho” trong cấu trúc “làm lễ chuộc tội cho”.
- source_word: הַכֹּהֲנִים
  choice: các thầy tế lễ
  rationale: Cách gọi rõ ràng, trang trọng và phù hợp với chức vụ tư tế trong bối cảnh Lê-vi Ký.
- source_word: כָּל עַם הַקָּהָל
  choice: toàn thể dân của hội chúng
  rationale: Cách dịch giữ được cả “toàn thể dân” và yếu tố cộng đồng nhóm họp trong הַקָּהָל, thay vì rút gọn thành “toàn dân”.
theological_decisions:
- issue: Ngôn ngữ chuộc tội được dùng cho cả vật thánh và con người
  choice: Dùng nhất quán cụm “làm lễ chuộc tội cho” đối với Thánh Sở, Lều Hội Kiến, bàn thờ, các thầy tế lễ và dân chúng.
  alternative: Dùng “thanh tẩy” cho các nơi hoặc vật thánh, nhưng “làm lễ chuộc tội” cho con người.
  rationale: Tiếng Hê-bơ-rơ cố ý lặp lại cùng một động từ כפר. Giữ một cách dịch thống nhất phản ánh sự hợp nhất của nghi lễ và không tự ý phân chia hành động thành hai loại khác nhau, dù ý thanh tẩy thực sự nằm trong trường nghĩa của động từ.
- issue: Mức độ xác định của מִקְדַּשׁ הַקֹּדֶשׁ
  choice: Dịch là “Thánh Sở” và ghi chú khả năng hiểu là “Nơi Chí Thánh”.
  alternative: Dịch thẳng là “Nơi Chí Thánh”.
  rationale: Cụm Hê-bơ-rơ nhấn mạnh tính thánh của thánh sở nhưng không hoàn toàn loại trừ hơn một cách xác định phạm vi. Bản dịch chính tránh giải quyết dứt khoát điều văn bản còn có thể để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc lặp “người phải làm lễ chuộc tội” phản ánh ba lần xuất hiện của động từ כפר trong nguyên văn; các thuật ngữ “Thánh Sở”, “Lều Hội Kiến”, “bàn thờ” và “thầy tế lễ” duy trì sắc thái nghi lễ của Lê-vi Ký.
