id: LEV.16.13
reference: Leviticus 16:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָתַ֧ן אֶֽת הַ/קְּטֹ֛רֶת עַל הָ/אֵ֖שׁ לִ/פְנֵ֣י יְהוָ֑ה וְ/כִסָּ֣ה עֲנַ֣ן הַ/קְּטֹ֗רֶת אֶת הַ/כַּפֹּ֛רֶת אֲשֶׁ֥ר עַל הָ/עֵד֖וּת וְ/לֹ֥א יָמֽוּת־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: vi
  text: Ông phải đặt hương trên lửa trước mặt Yahweh, để mây hương bao phủ nắp chuộc tội[a] ở trên Chứng Ước, để ông không chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nắp thi ân.” Từ Hê-bơ-rơ này chỉ nắp của Hòm Giao Ước, đặc biệt trong các nghi thức chuộc tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Ông phải đặt
  rationale: Trong quy định nghi lễ này, dạng động từ mang ý chỉ thị. “Phải đặt” diễn đạt rõ nghĩa bắt buộc; “ông” tiếp nối chủ thể nam đã được xác định trong ngữ cảnh.
- source_word: הַקְּטֹרֶת
  choice: hương
  rationale: Chỉ loại hương dùng trong nghi lễ nơi thánh; “hương” là cách nói tự nhiên, không thêm ý rằng đây là một hỗn hợp.
- source_word: עַל הָאֵשׁ
  choice: trên lửa
  rationale: Giữ sát hình ảnh đặt hương trên lửa hoặc than đang cháy mà không giải thích thêm vào chính văn.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Diễn đạt sự hiện diện và vị trí nghi lễ trước Yahweh; cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp định hướng của dự án.
- source_word: וְכִסָּה
  choice: để ... bao phủ
  rationale: Liên từ trong mạch chỉ dẫn nêu mục đích hoặc kết quả dự kiến; “để” giữ được quan hệ ấy mà không quyết định quá mức giữa mục đích và kết quả.
- source_word: עֲנַן הַקְּטֹרֶת
  choice: đám mây hương
  rationale: Giữ nguyên hình ảnh đám mây do hương tạo nên bằng một cụm từ gọn và tự nhiên.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Chỉ nắp Hòm Giao Ước trong chức năng nghi lễ chuộc tội. Cách dịch này minh bạch hơn với độc giả hiện đại; cách gọi truyền thống được ghi ở chú thích.
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: ở trên Chứng Ước
  rationale: Giữ cách gọi ngắn gọn của nguyên văn đối với chứng vật giao ước đặt trong hòm, không tự ý bổ sung “các bảng” vào chính văn.
- source_word: וְלֹא יָמוּת
  choice: hầu cho ông không chết
  rationale: Diễn đạt hậu quả bảo toàn mạng sống gắn với việc đám mây che phủ nắp; “hầu cho” phù hợp văn phong trang trọng mà vẫn dễ hiểu.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת trong bối cảnh nơi thánh và nghi lễ chuộc tội
  choice: nắp chuộc tội
  alternative: nắp thi ân
  rationale: Từ Hê-bơ-rơ chỉ nắp hòm gắn với nghi lễ chuộc tội. “Nắp chuộc tội” cho thấy cả vật thể lẫn chức năng; “nắp thi ân” là cách dịch truyền thống có giá trị nhưng có thể khiến độc giả tưởng đây là một chỗ ngồi.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Giữ danh riêng được bày tỏ trong nguyên văn và tránh thay danh ấy bằng một tước hiệu.
- issue: Quan hệ giữa hai mệnh đề cuối câu
  choice: để ... hầu cho
  alternative: và ... thì ông sẽ không chết
  rationale: Cấu trúc được trình bày như mục đích hoặc kết quả nghi lễ, nhưng không khẳng định một cơ chế thần học vượt quá điều nguyên văn nói.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” để chỉ vị tư tế đang thực hiện nghi lễ, tránh dùng “người” vì dễ bị hiểu là đang chỉ Yahweh. Viết hoa “Chứng Ước” như tên gọi quy ước của chứng vật giao ước trong hòm.
