  source_fidelity: 'Bản dịch phản ánh đúng trình tự nghi lễ và các yếu tố chính của tiếng Hê-bơ-rơ: đặt hương trên lửa trước mặt Yahweh, mây hương che nắp chuộc tội trên Chứng Ước, nhằm tránh cái chết. “Nắp chuộc tội” chuyển đạt hợp lý הַכַּפֹּרֶת; chú thích bảo lưu cách gọi truyền thống “nắp thi ân.”'
