id: LEV.16.14
reference: Leviticus 16:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: vi
  text: Người phải lấy một ít huyết của con bò đực, dùng ngón tay rảy trên mặt phía đông của nắp chuộc tội[a]; rồi trước nắp chuộc tội, người phải dùng ngón tay rảy một ít huyết bảy lần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngai thương xót.” Từ Hê-bơ-rơ kapporet chỉ chiếc nắp của Hòm Giao Ước, là nơi gắn với nghi thức chuộc tội.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Người phải lấy
  rationale: Dạng động từ trong chuỗi chỉ dẫn nghi lễ mang ý nghĩa quy định, nên dùng “phải” thay vì kể lại một hành động trong quá khứ.
- source_word: מִדַּם הַפָּר
  choice: một ít huyết của con bò đực
  rationale: מִן có nghĩa phân lượng ở đây; “một ít” diễn đạt tự nhiên rằng chỉ một phần huyết được dùng.
- source_word: וְהִזָּה / יַזֶּה
  choice: rảy
  rationale: Trong ngữ cảnh nghi lễ tế lễ, נזה chỉ việc dùng ngón tay làm cho huyết bắn thành giọt; “rảy” là từ ngắn gọn, rõ và trang trọng trong tiếng Việt.
- source_word: בְאֶצְבָּעוֹ
  choice: dùng ngón tay
  rationale: Giới từ בְּ đánh dấu phương tiện; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת
  choice: lên mặt nắp chuộc tội
  rationale: עַל chỉ vị trí tiếp xúc “lên/trên,” còn פְּנֵי ở đây chỉ mặt hoặc bề mặt; cách dịch tránh xác định quá mức là “mặt trước” khi קֵדְמָה đã nêu hướng đông.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: כַּפֹּרֶת là chiếc nắp trên Hòm Giao Ước, gắn với nghi thức chuộc tội. “Nắp chuộc tội” vừa nêu vật thể cụ thể vừa giữ liên hệ thần học của thuật ngữ.
- source_word: קֵדְמָה
  choice: về phía đông
  rationale: Trạng từ chỉ hướng được diễn đạt tự nhiên là “về phía đông,” không buộc phải hiểu là một vị trí cố định ở cạnh đông.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: rồi ở phía trước nắp chuộc tội
  rationale: לִפְנֵי biểu thị vị trí phía trước; “rồi” thể hiện bước kế tiếp trong trình tự nghi lễ.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Giữ nguyên con số nghi lễ được văn bản nêu rõ.
theological_decisions:
- issue: Cách dịch הַכַּפֹּרֶת
  choice: nắp chuộc tội
  alternative: ngai thương xót
  rationale: “Nắp chuộc tội” phản ánh trực tiếp đây là nắp Hòm Giao Ước và giữ mối liên hệ từ vựng với sự chuộc tội. “Ngai thương xót” là cách gọi truyền thống có giá trị thần học nhưng dễ khiến độc giả hiện đại hình dung một chiếc ngai riêng; phương án ấy được ghi ở chú thích.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng hiện đại. Dùng “người” để tiếp nối chủ thể là thầy tế lễ thượng phẩm trong ngữ cảnh, và dùng “huyết” thay cho “máu” nhằm phù hợp ngữ vực tế lễ Kinh Thánh mà vẫn dễ hiểu.
