revisions:
- from: Người phải lấy một ít huyết của con bò đực, dùng ngón tay rảy lên mặt nắp chuộc tội[a] về phía đông; rồi ở phía trước nắp chuộc tội, người phải dùng ngón tay rảy một ít huyết bảy lần.
  to: Người phải lấy một ít huyết của con bò đực, dùng ngón tay rảy trên mặt phía đông của nắp chuộc tội[a]; rồi trước nắp chuộc tội, người phải dùng ngón tay rảy một ít huyết bảy lần.
  rationale: Chỉnh sửa duy nhất ở nội dung chính là làm rõ và làm tự nhiên chỉ hướng קֵדְמָה như một vị trí ở phía đông của nắp chuộc tội, đồng thời rút gọn cách diễn đạt vị trí thứ hai. Không thay đổi trình tự nghi lễ, chủ thể, số lượng, hay thuật ngữ then chốt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:02Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng tính quy định của chuỗi nghi lễ, nghĩa phân lượng của huyết, phương tiện bằng ngón tay, sự phân biệt giữa việc rảy trên nắp và rảy trước nắp, cùng số lần là bảy. Tuy nhiên, “về phía đông” sau “mặt nắp” nghe như hướng chuyển động/orientation hơn là vị trí của chỗ rảy; tiếng Hê-bơ-rơ xác định vị trí ở mặt/hướng đông của nắp.
  naturalness: Ngữ vực nghi lễ hiện đại, với “huyết” và “rảy,” là phù hợp. “trên mặt phía đông của nắp chuộc tội” tự nhiên và rõ nghĩa hơn “lên mặt nắp chuộc tội về phía đông”; “trước nắp” cũng gọn hơn “ở phía trước nắp.”
  terminology: “Nắp chuộc tội” là lựa chọn có cơ sở cho kapporet, vì nêu đúng vật thể là nắp Hòm Giao Ước mà vẫn bảo toàn liên hệ với nghi thức chuộc tội. Chú thích giữ phương án truyền thống “ngai thương xót,” đồng thời giải thích đây là tên gọi của nắp Hòm Giao Ước, không phải một vật thể khác.
  issues:
  - severity: low
    issue: Cụm “lên mặt nắp chuộc tội về phía đông” có thể bị hiểu là cách/hướng rảy thay vì vị trí ở phía đông của nắp.
    rationale: Cụm עַל־פְּנֵי הַכַּפֹּרֶת קֵדְמָה xác định nơi huyết được rảy trên nắp, với chỉ hướng đông. Đặt “ở phía đông” sát danh từ vị trí làm quan hệ này rõ và tự nhiên hơn trong tiếng Việt.
  revised_text: Người phải lấy một ít huyết của con bò đực, dùng ngón tay rảy trên mặt phía đông của nắp chuộc tội[a]; rồi trước nắp chuộc tội, người phải dùng ngón tay rảy một ít huyết bảy lần.
