source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: vi
  text: 'Đây sẽ là một quy định vĩnh viễn cho các ngươi: vào tháng thứ bảy, ngày mười của tháng, các ngươi phải tự hạ mình[a] và không được làm bất cứ công việc nào, cả người bản xứ lẫn ngoại kiều cư ngụ giữa các ngươi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “phải tự làm khổ mình.” Cụm từ này theo truyền thống được hiểu là bao gồm việc kiêng ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Đây sẽ là
  rationale: Trong công thức pháp luật này, היה giới thiệu một quy định có hiệu lực lâu dài; “đây” tự nhiên trong tiếng Việt và quy chiếu về những chỉ thị ở trước.
- source_word: לְחֻקַּת עוֹלָם
  choice: một quy định vĩnh viễn
  rationale: חֻקָּה là điều lệ hay quy định được ấn định; עוֹלָם nhấn mạnh tính lâu dài, bền vững của nghĩa vụ trong khuôn khổ giao ước.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: vào tháng thứ bảy
  rationale: חֹדֶשׁ trong cách ghi niên lịch ở đây có nghĩa thông thường là “tháng”.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: ngày mồng mười trong tháng
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “vào ngày thứ mười của tháng”; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: các ngươi phải hạ mình
  rationale: Cấu trúc ענה ở thể piel với נֶפֶשׁ chỉ việc tự hạ mình hoặc tự khắc chế. “Hạ mình” giữ được phạm vi nghĩa rộng, không thu hẹp mệnh lệnh chỉ còn việc kiêng ăn; nghĩa sát chữ hơn được ghi ở chú thích.
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: không được làm bất cứ công việc nào
  rationale: מְלָאכָה chỉ công việc hay lao động; cách dịch này truyền đạt rõ lệnh cấm toàn diện.
- source_word: הָאֶזְרָח
  choice: người bản xứ
  rationale: אֶזְרָח chỉ thành viên bản địa của cộng đồng và tạo thế đối lập với ngoại kiều cư trú.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: ngoại kiều đang cư ngụ giữa các ngươi
  rationale: גֵּר là người từ bên ngoài đến nhưng sống thường trú trong cộng đồng Y-sơ-ra-ên. “Ngoại kiều đang cư ngụ” giữ được sắc thái pháp lý và phản ánh sự lặp lại cùng gốc từ trong tiếng Hê-bơ-rơ một cách tự nhiên.
theological_decisions:
- issue: Ý nghĩa của mệnh lệnh tự khắc chế trong luật về Ngày Chuộc Tội
  choice: Dịch rộng là “phải hạ mình”, không quy định cụ thể việc kiêng ăn trong chính văn.
  alternative: “phải làm khổ chính mình” hoặc “phải kiêng ăn”
  rationale: Thành ngữ Hê-bơ-rơ rộng hơn một nghi thức đơn lẻ, dù truyền thống thường hiểu là bao gồm việc kiêng ăn. Bản dịch duy trì phạm vi nghĩa và sự căng thẳng của nguyên văn, không đưa cách áp dụng hẹp hơn vào chính văn.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. Đại từ “các ngươi” duy trì lời phán trực tiếp cho toàn cộng đồng; “ngoại kiều” được dùng theo nghĩa người ngoài cộng đồng đang cư trú lâu dài, không theo nghĩa du khách.
