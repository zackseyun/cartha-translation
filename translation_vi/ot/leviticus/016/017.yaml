  source_fidelity: 'Bản dịch giữ đúng cấu trúc và nội dung tiếng Hê-bơ-rơ: không có ai ở trong Lều Hội Kiến trong lúc A-rôn vào nơi thánh để thực hiện việc chuộc tội, cho đến khi ông ra; sau đó việc chuộc tội được nêu rõ là cho chính ông, nhà/hộ gia đình ông và toàn thể hội chúng Y-sơ-ra-ên. “Không một ai” phản ánh tự nhiên אָדָם trong mệnh đề phủ định mà không áp đặt giới hạn giới tính của bản tiếng Anh audit.'
