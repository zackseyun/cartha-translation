source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: vi
  text: Khi ông vào Nơi Thánh để làm lễ chuộc tội, không một ai được ở trong Lều Hội Kiến cho đến khi ông đi ra. Ông sẽ làm lễ chuộc tội cho chính mình, cho gia đình mình và cho toàn thể hội chúng Y-sơ-ra-ên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל־אָדָם לֹא יִהְיֶה
  choice: không một ai được ở
  rationale: Trong câu phủ định, כָל־אָדָם có nghĩa bao quát là không một người nào; cách dịch này tự nhiên và chính xác hơn việc giới hạn vào nam giới.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Thuật ngữ quen thuộc, trang trọng, diễn đạt nơi Đức Chúa Trời gặp dân Ngài theo ngữ cảnh Lê-vi Ký.
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: làm lễ chuộc tội
  rationale: Giữ ý nghĩa nghi lễ của động từ כפר trong ngữ cảnh Ngày Chuộc Tội, thay vì hiểu thuần túy là sự tha thứ.
- source_word: בַּקֹּדֶשׁ
  choice: Nơi Thánh
  rationale: Ở đây danh từ có mạo từ chỉ khu vực thánh mà thầy tế lễ thượng phẩm đi vào; viết hoa để biểu thị địa điểm trong đền tạm.
- source_word: בֵּיתוֹ
  choice: gia đình mình
  rationale: בַּיִת trong ngữ cảnh này chỉ hộ gia đình, không phải tòa nhà.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: toàn thể hội chúng Y-sơ-ra-ên
  rationale: Giữ sắc thái tập thể và tôn giáo-pháp lý của קהל, đồng thời dùng cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Chủ thể được lệnh không hiện diện trong Lều Hội Kiến
  choice: không một ai
  alternative: không một người nam nào
  rationale: אָדָם ở đây mang nghĩa chung là con người/người; không có dấu hiệu ngữ cảnh buộc phải giới hạn lệnh này vào nam giới.
- issue: Ý nghĩa của כפר
  choice: làm lễ chuộc tội
  alternative: thực hiện nghi thức thanh tẩy
  rationale: Cụm từ cần giữ chiều kích chuộc tội theo cách dùng xuyên suốt chương 16, nhưng không nên thêm một lý thuyết cụ thể về cơ chế chuộc tội.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Đảo mệnh đề thời gian lên đầu để câu tiếng Việt rõ chủ thể và tự nhiên, trong khi vẫn giữ đầy đủ trình tự: vào Nơi Thánh, không ai hiện diện trong Lều Hội Kiến, rồi đi ra. Đại từ “ông” theo mạch văn chỉ A-rôn.'
