id: LEV.16.30
reference: Leviticus 16:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: vi
  text: Vì trong ngày này, sự chuộc tội sẽ được thực hiện cho anh em để thanh tẩy anh em[a]; trước mặt Yahweh[b], anh em sẽ được thanh sạch khỏi mọi tội lỗi của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ấy sẽ làm sự chuộc tội cho anh em.” Động từ Hê-bơ-rơ ở số ít, nhưng mệnh đề này không nói rõ chủ thể.'
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: YHWH; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do của mệnh lệnh ngay trước đó và tự nhiên trong tiếng Việt.
- source_word: בַיּוֹם הַזֶּה
  choice: trong ngày này
  rationale: Bám sát cụm từ chỉ thời gian cùng đại từ chỉ định trong bối cảnh nghi lễ.
- source_word: יְכַפֵּר
  choice: lễ chuộc tội sẽ được thực hiện
  rationale: Diễn đạt nghĩa nghi lễ của động từ כפר và dùng cấu trúc bị động để không tự ý xác định chủ thể mà động từ số ít trong mệnh đề này không nêu rõ.
- source_word: עֲלֵיכֶם
  choice: cho anh em
  rationale: Với כפר, giới từ על chỉ những người được hưởng việc chuộc tội; cách nói này tự nhiên trong tiếng Việt.
- source_word: לְטַהֵר אֶתְכֶם
  choice: để thanh tẩy anh em
  rationale: Thể hiện mục đích hoặc kết quả của việc chuộc tội và giữ sắc thái thanh sạch nghi lễ.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: khỏi mọi tội lỗi của mình
  rationale: Trong ngữ cảnh thanh tẩy dân chúng, חטאת chỉ tội lỗi chứ không phải lễ vật chuộc tội.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Diễn đạt tự nhiên nghĩa ở trước hoặc trong sự hiện diện của Đức Chúa Trời, đồng thời phiên âm danh giao ước.
- source_word: תִּטְהָרוּ
  choice: anh em sẽ được thanh sạch
  rationale: Nêu trạng thái thanh sạch đạt được, đồng thời phân biệt với hành động 'thanh tẩy' ở mệnh đề trước.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Phiên âm danh giao ước, không thay bằng một tước hiệu; chú thích ghi nhận cách dịch truyền thống quen thuộc.
- issue: Chủ thể của יְכַפֵּר
  choice: dùng cấu trúc bị động, không nêu chủ thể
  alternative: người ấy sẽ làm lễ chuộc tội cho anh em
  rationale: Động từ Hê-bơ-rơ ở số ít nhưng mệnh đề không nêu chủ thể; cấu trúc bị động bảo toàn sự mơ hồ thật của nguyên văn.
- issue: Ý nghĩa nghi lễ của כפר
  choice: lễ chuộc tội sẽ được thực hiện
  alternative: sự chuộc tội sẽ được thực hiện; người ấy sẽ làm lễ chuộc tội
  rationale: Giữ phạm trù tế lễ của phân đoạn mà không áp đặt một mô hình thần học hậu kỳ như chỉ riêng sự đền bù hay nguôi giận.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh em” cho đại từ số nhiều ngôi thứ hai, “thanh tẩy” cho hành động nghi lễ và “thanh sạch” cho trạng thái kết quả. Trật tự câu được điều chỉnh vừa phải để tiếng Việt rõ nghĩa mà vẫn giữ quan hệ giữa chuộc tội, thanh tẩy, tội lỗi và sự hiện diện của Yahweh.
