    rationale: Trong nguyên văn, cụm này đứng trước động từ kết quả “anh em sẽ thanh sạch.” Đưa cụm ấy lên đầu mệnh đề cuối giúp tiếng Việt rõ nghĩa hơn mà không thay đổi trọng tâm.
