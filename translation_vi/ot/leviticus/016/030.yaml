revisions:
- from: Vì trong ngày này, lễ chuộc tội sẽ được thực hiện cho anh em để thanh tẩy anh em[a]; anh em sẽ được thanh sạch khỏi mọi tội lỗi của mình trước mặt Yahweh[b].
  to: Vì trong ngày này, sự chuộc tội sẽ được thực hiện cho anh em để thanh tẩy anh em[a]; trước mặt Yahweh[b], anh em sẽ được thanh sạch khỏi mọi tội lỗi của mình.
  rationale: Thay “lễ chuộc tội sẽ được thực hiện” bằng “sự chuộc tội sẽ được thực hiện” để phản ánh động từ כפר mà không biến nó thành tên một nghi thức cụ thể. Sắp lại mệnh đề cuối theo trật tự rõ ràng hơn, giữ nguyên nghĩa thanh sạch khỏi mọi tội lỗi trong sự hiện diện của Yahweh. Chú thích a cũng được điều chỉnh từ “làm lễ chuộc tội” thành “làm sự chuộc tội” để nhất quán với giá trị của động từ nguyên ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng quan hệ chính của câu: sự chuộc tội, mục đích thanh tẩy, và kết quả thanh sạch khỏi mọi tội lỗi trước mặt Yahweh. Tuy nhiên, “lễ chuộc tội sẽ được thực hiện” dễ khiến động từ יְכַפֵּר được hiểu là một danh từ chỉ nghi lễ cố định, trong khi nguyên văn là động từ “làm sự chuộc tội”; cách diễn đạt sửa đổi giữ tính nghi lễ và sự không nêu chủ thể rõ hơn.'
  naturalness: 'Câu sửa dùng trật tự tự nhiên hơn trong tiếng Việt: cụm “Trước mặt Yahweh” được đưa lên đầu mệnh đề cuối để không mơ hồ về phạm vi bổ nghĩa. “Sự chuộc tội sẽ được thực hiện” là cách bị động trang trọng, hiện đại và phù hợp văn cảnh nghi lễ.'
  terminology: Giữ “Yahweh” cho יְהוָה, “chuộc tội” cho כפר, “thanh tẩy” cho hành động làm sạch nghi lễ, và “thanh sạch” cho trạng thái kết quả. Không thêm mô hình giải thích thần học nào.
