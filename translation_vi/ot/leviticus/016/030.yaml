    rationale: יְכַפֵּר là động từ số ít, nghĩa là “sẽ làm sự chuộc tội,” dù chủ thể không được nêu trong mệnh đề. “Sự chuộc tội sẽ được thực hiện” phản ánh trực tiếp hơn giá trị động từ và vẫn không xác định tác nhân.
  - severity: low
