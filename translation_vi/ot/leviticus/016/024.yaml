  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: vi
  text: Người phải rửa thân thể mình bằng nước tại một nơi thánh[a], mặc lại y phục, rồi đi ra dâng lễ thiêu của mình và lễ thiêu của dân chúng, và làm lễ chuộc tội cho mình và cho dân chúng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “tại một nơi thánh”, không nhất thiết là gian trong đền tạm được gọi là “Nơi Thánh”.'
    reason: lexical_alternative
  - marker: b
    text: “Làm lễ chuộc tội” cũng có thể được diễn đạt là “thực hiện nghi thức xá tội”; trong một số ngữ cảnh nghi lễ, động từ Hê-bơ-rơ còn có sắc thái “thanh tẩy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַמַּיִם
  choice: Người phải lấy nước tắm rửa thân thể
  rationale: Chuỗi động từ trong quy định nghi lễ mang sắc thái chỉ thị; “thân thể” diễn đạt tự nhiên nghĩa cụ thể của בשר trong ngữ cảnh tắm rửa, còn “lấy nước” phản ánh phương tiện của hành động.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: tại một nơi thánh
  rationale: מקום không có mạo từ; cách dịch này tránh đồng nhất cụm từ với một gian cụ thể mang tên “Nơi Thánh”, đồng thời giữ sắc thái được biệt riêng cho việc thánh.
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: mặc lại y phục
  rationale: “Y phục” giữ văn phong trang trọng của ngữ cảnh nghi lễ; “lại” được ngữ cảnh trước đó hỗ trợ vì thầy tế lễ đã cởi bộ y phục bằng vải gai.
- source_word: וְיָצָא
  choice: rồi đi ra
  rationale: Diễn đạt tự nhiên sự di chuyển từ nơi tắm rửa ra ngoài và duy trì trình tự nghi lễ.
- source_word: וְעָשָׂה אֶת־עֹלָתוֹ וְאֶת־עֹלַת הָעָם
  choice: dâng lễ thiêu của mình và lễ thiêu của dân chúng
  rationale: Với עֹלָה làm bổ ngữ, עשה chỉ việc thực hiện/dâng sinh tế; “lễ thiêu” là thuật ngữ Việt ngữ rõ và quen thuộc cho loại lễ vật được thiêu trọn.
- source_word: וְכִפֶּר בַּעֲדוֹ וּבְעַד הָעָם
  choice: để làm lễ chuộc tội cho mình và cho dân chúng
  rationale: “Làm lễ chuộc tội” giữ nghĩa nghi lễ rộng của כפר mà không áp đặt một lý thuyết thần học riêng; “cho” truyền đạt tự nhiên sắc thái đại diện của בעד.
theological_decisions:
- issue: Ý nghĩa của כפר trong luật tế lễ
  choice: làm lễ chuộc tội
  alternative: thực hiện nghi thức xá tội; thanh tẩy
  rationale: Trong ngữ cảnh Ngày Chuộc Tội, cụm từ chỉ hành động tế lễ đem lại sự chuộc tội cho thầy tế lễ và dân chúng. Cách dịch chính giữ thuật ngữ thần học quen thuộc nhưng không giới hạn cơ chế của hành động; chú thích bảo tồn các sắc thái nghi lễ khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “người” để nối rõ với thầy tế lễ A-rôn trong văn mạch, tránh lặp danh xưng không có trong câu Hê-bơ-rơ. Các động từ được trình bày theo trình tự chỉ thị nghi lễ.
