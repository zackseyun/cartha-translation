revisions:
- from: Người phải lấy nước tắm rửa thân thể tại một nơi thánh[a], mặc lại y phục, rồi đi ra dâng lễ thiêu của mình và lễ thiêu của dân chúng, để làm lễ chuộc tội cho mình và cho dân chúng.[b]
  to: Người phải rửa thân thể mình bằng nước tại một nơi thánh[a], mặc lại y phục, rồi đi ra dâng lễ thiêu của mình và lễ thiêu của dân chúng, và làm lễ chuộc tội cho mình và cho dân chúng.[b]
