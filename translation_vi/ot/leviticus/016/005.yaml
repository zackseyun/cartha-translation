  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: nguồn lấy lễ vật là cộng đồng Y-sơ-ra-ên, hai dê đực cho חַטָּאת, và một chiên đực cho lễ thiêu. Tuy nhiên, đại từ viết hoa “Người” không do nguyên văn yêu cầu và trong tiếng Việt dễ gợi cách xưng hô tôn kính, trong khi chủ ngữ theo văn mạch là A-rôn.'
