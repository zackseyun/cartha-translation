id: LEV.16.5
reference: Leviticus 16:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: vi
  text: Ông phải lấy từ cộng đồng dân Y-sơ-ra-ên hai con dê đực làm lễ vật chuộc tội[a], và một con chiên đực làm lễ thiêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת trong sách Lê-vi có thể chỉ lễ vật dùng để xử lý tội lỗi và sự ô uế nghi lễ.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: phải lấy từ
  rationale: 'Giới từ chỉ nguồn gốc: các con vật được lấy từ cộng đồng; liên từ được diễn đạt tự nhiên trong mạch câu tiếng Việt.'
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: cộng đồng con dân Y-sơ-ra-ên
  rationale: “Cộng đồng” truyền đạt עֵדָה trong bối cảnh toàn thể dân giao ước; “con dân Y-sơ-ra-ên” vừa gần với thành ngữ Hê-bơ-rơ vừa tự nhiên hơn cách dịch máy móc “các con trai của Y-sơ-ra-ên”.
- source_word: יִקַּח
  choice: Người phải lấy
  rationale: Thể vị hoàn ở đây mang lực chỉ thị trong luật nghi lễ; “phải” thể hiện rõ tính bắt buộc. Chủ thể được viết “Người” theo mạch văn chỉ A-rôn.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: hai con dê đực
  rationale: Diễn đạt rõ số lượng và giới tính của vật hiến tế bằng tiếng Việt hiện đại.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: חַטָּאת trong ngữ cảnh tế lễ chỉ một loại lễ vật xử lý tội lỗi và tình trạng ô uế; cách dịch truyền thống, dễ hiểu này được giữ trong chính văn, còn sắc thái thanh tẩy được nêu ở chú thích.
- source_word: וְאַיִל אֶחָד
  choice: và một con chiên đực
  rationale: אַיִל chỉ chiên đực; “một con” giữ nguyên con số được nêu rõ trong nguyên văn.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: עֹלָה là tế lễ được thiêu trọn; “lễ thiêu” là thuật ngữ tiếng Việt ngắn gọn, quen thuộc và phù hợp ngữ cảnh.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Trong thành ngữ tập thể này, cụm từ chỉ toàn dân chứ không nhất thiết chỉ nam giới. “Con dân” bảo lưu hình ảnh quan hệ dòng dõi mà không tạo ra sự giới hạn giới tính không có trong ý nghĩa ngữ cảnh.
- issue: Ý nghĩa của חַטָּאת trong nghi lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Thuật ngữ có thể nhấn mạnh cả tội lỗi lẫn chức năng thanh tẩy khỏi ô uế nghi lễ. Chính văn dùng cách gọi quen thuộc, còn chú thích bảo tồn cách hiểu về chức năng thanh tẩy mà không buộc người đọc chọn riêng một cách giải thích.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại. Câu dùng “phải” để thể hiện lực chỉ thị; danh xưng và thuật ngữ tế lễ được chọn sao cho người đọc phổ thông dễ hiểu. Chỉ đặt một chú thích vì cách diễn đạt “con dân Y-sơ-ra-ên” đã truyền đạt tự nhiên thành ngữ tập thể, không cần thêm chú thích lexical.
