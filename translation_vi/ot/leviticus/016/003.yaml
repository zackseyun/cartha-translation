  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: A-rôn, việc vào Nơi Thánh, bò đực thuộc đàn, cừu đực và hai loại lễ. Tuy nhiên, חַטָּאת trong văn cảnh tế lễ nên được dịch chính là “lễ chuộc tội”, là thuật ngữ tế lễ Việt ngữ ổn định và tương ứng trực tiếp với “sin offering”; sắc thái “thanh tẩy” nên được giữ ở chú thích. Cách “như sau” diễn đạt tự nhiên chức năng chỉ phương thức của בְּזֹאת mà không thêm ý nghĩa.'
  naturalness: “A-rôn sẽ vào Nơi Thánh như sau” tự nhiên hơn “theo cách này” khi tiếp theo là một danh sách lễ vật. Bỏ “đem theo” tránh gợi ý đơn thuần mang các con vật vào bên trong, trong khi tiếng Hê-bơ-rơ dùng בְּ để nêu các lễ vật/phương tiện quy định.
