base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: vi
  text: 'A-rôn sẽ vào Nơi Thánh như sau: với một con bò đực từ đàn bò làm lễ chuộc tội[a], và một con cừu đực làm lễ thiêu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Thuật ngữ Hê-bơ-rơ có thể nhấn mạnh sự thanh tẩy theo nghi lễ cũng như mối liên hệ với tội lỗi.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזֹאת
  choice: theo cách này
  rationale: Cụm giới từ có thể chỉ phương tiện hoặc cách thức; trong ngữ cảnh luật lệ, câu này tự nhiên dẫn vào những điều kiện và lễ vật cần thiết để A-rôn được vào.
- source_word: יָבֹא
  choice: sẽ vào
  rationale: Thể chưa hoàn thành ở đây mang sắc thái chỉ dẫn trong luật lệ; “sẽ vào” vừa tự nhiên vừa giữ tính quy định, không biến câu thành một lời cho phép đơn thuần.
- source_word: אֶל הַקֹּדֶשׁ
  choice: vào Nơi Thánh
  rationale: Trong bối cảnh Ngày Chuộc Tội, từ này chỉ khu vực thánh mà A-rôn tiến vào; viết hoa cho thấy đây là tên gọi không gian phụng tự.
- source_word: בְּפַר בֶּן בָּקָר
  choice: đem theo một con bò đực từ đàn bò
  rationale: Thành ngữ Hê-bơ-rơ sát nghĩa là “một con bò đực, con của đàn bò”; cách dịch này truyền đạt tự nhiên rằng đó là bò thuộc đàn gia súc mà không võ đoán thêm độ tuổi.
- source_word: לְחַטָּאת
  choice: làm lễ vật thanh tẩy
  rationale: Trong luật tế lễ, חַטָּאת là lễ vật liên quan đến tội lỗi nhưng cũng có chức năng thanh tẩy nghi lễ. “Lễ vật thanh tẩy” làm rõ chức năng trong ngữ cảnh này; cách gọi truyền thống được giữ trong chú thích.
- source_word: וְאַיִל
  choice: và một con cừu đực
  rationale: אַיִל chỉ con cừu đực trưởng thành; cách gọi này rõ ràng với độc giả Việt ngữ.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn trên bàn thờ; “lễ thiêu” là cách gọi ngắn gọn, quen thuộc và chính xác.
theological_decisions:
- issue: Ý nghĩa thuật ngữ tế lễ חַטָּאת
  choice: lễ vật thanh tẩy
  alternative: lễ vật chuộc tội
  rationale: Thuật ngữ vừa liên hệ đến tội lỗi vừa nhấn mạnh hiệu quả thanh tẩy trong nghi lễ. Bản chính chọn cách diễn đạt chức năng tế lễ trong văn mạch Lê-vi Ký, đồng thời chú thích cách gọi truyền thống để không xóa bỏ chiều kích về tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “A-rôn”, “Nơi Thánh”, “lễ vật thanh tẩy” và “lễ thiêu” nhất quán với ngữ cảnh tế lễ; tránh lối dịch sát chữ thiếu tự nhiên “con trai của đàn bò”.
