  source_fidelity: Bản dịch phản ánh đúng trình tự nghi lễ, hướng “đi ra”, bàn thờ trước Yahweh, hành vi כפר hướng đến bàn thờ, và hai nguồn huyết. Tuy nhiên, “các sừng quanh bàn thờ” có thể hiểu là những sừng nằm xung quanh bàn thờ, trong khi סָבִיב bổ nghĩa cho việc đặt huyết trên các sừng ở mọi phía của bàn thờ.
  naturalness: Văn phong nhìn chung hiện đại, trang trọng và rõ ràng. Cụm “làm lễ chuộc tội cho bàn thờ ấy” là cách diễn đạt nghi lễ có thể chấp nhận; chú thích đã hữu ích trong việc nêu sắc thái thanh tẩy. Chỉnh câu cuối giúp tiếng Việt rõ nghĩa hơn.
  terminology: Giữ “Yahweh”, “bàn thờ”, “huyết”, “bò đực”, và “dê đực” là nhất quán với ngữ cảnh nghi lễ. “Làm lễ chuộc tội” được giữ để phản ánh cách dịch chính trong vệt kiểm toán tiếng Anh, không áp đặt cách hiểu giáo phái; chú thích bảo lưu nghĩa “thanh tẩy”.
  issues:
