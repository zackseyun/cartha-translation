  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: vi
  text: Sau đó, ông sẽ đi ra bàn thờ ở trước mặt Yahweh và làm lễ chuộc tội cho bàn thờ ấy[a]. Ông sẽ lấy một ít huyết của con bò đực và một ít huyết của con dê đực, rồi bôi huyết ấy lên tất cả các sừng của bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thanh tẩy bàn thờ ấy”; trong các nghi thức tư tế, động từ Hê-bơ-rơ này có thể mang nghĩa thanh tẩy khỏi sự ô uế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Sau đó, ông sẽ đi ra
  rationale: Diễn tả tự nhiên trình tự các hành động được truyền phải thực hiện, đồng thời giữ hướng di chuyển ra khỏi nơi chí thánh.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: bàn thờ ở trước mặt Yahweh
  rationale: Giữ nghĩa không gian của לִפְנֵי và nhận diện bàn thờ theo vị trí của nó trong nơi thánh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וְכִפֶּר עָלָיו
  choice: làm lễ chuộc tội cho bàn thờ ấy
  rationale: Giữ sức nặng nghi lễ-thần học của כפר và làm rõ đại từ hậu tố chỉ về bàn thờ; chú thích bảo tồn sắc thái thanh tẩy.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: lấy một ít huyết của con bò đực và một ít huyết của con dê đực
  rationale: Diễn đạt giá trị phân lượng của מִן được lặp lại; nêu 'dê đực' để phản ánh chính xác שָׂעִיר.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: bôi huyết ấy lên các sừng quanh bàn thờ
  rationale: Trong nghi thức dùng huyết, 'bôi' là cách nói tiếng Việt tự nhiên cho נָתַן; 'huyết ấy' phản ánh đối tượng số ít được ngầm hiểu, còn סָבִיב được gắn tự nhiên với các sừng quanh bàn thờ.
theological_decisions:
- issue: Ý nghĩa của כפר khi đối tượng là bàn thờ
  choice: làm lễ chuộc tội cho bàn thờ ấy
  alternative: thanh tẩy bàn thờ ấy
  rationale: Cách dịch chính giữ thuật ngữ nghi lễ rộng và quen thuộc mà không áp đặt một học thuyết chuộc tội cụ thể; chú thích ghi nhận nghĩa thanh tẩy đặc biệt nổi bật trong văn mạch tư tế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để tiếp nối chủ thể là thầy tế lễ trong văn mạch; dùng “huyết” thay vì “máu” vì đây là mô tả nghi lễ tế lễ. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
