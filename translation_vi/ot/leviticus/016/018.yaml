    issue: “các sừng quanh bàn thờ” đặt sai hoặc mơ hồ phạm vi của “chung quanh”.
    rationale: Cụm Hê-bơ-rơ עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב nói đến việc đặt huyết lên các sừng của bàn thờ ở mọi phía, không mô tả “các sừng” như thể chúng ở quanh bàn thờ. “Tất cả các sừng của bàn thờ” diễn đạt rõ hiệu lực bao quát của סָבִיב.
