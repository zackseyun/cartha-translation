  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: vi
  text: A-rôn sẽ đặt cả hai tay mình trên đầu con dê đực còn sống và xưng trên đầu nó mọi điều gian ác của dân Y-sơ-ra-ên[a], mọi sự phản nghịch và mọi tội lỗi của họ. Ông sẽ đặt tất cả những điều ấy trên đầu con dê, rồi sai một người đã được chỉ định[b] đưa con dê vào hoang mạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; đây là cách gọi dân Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ mô tả người này khó xác định chính xác; có thể hiểu là người đã sẵn sàng, đã được chỉ định hoặc thích hợp cho nhiệm vụ vào dịp ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: đặt
  rationale: Trong nghi thức tế lễ, סמך chỉ hành động đặt hoặc tì tay trên lễ vật. “Đặt” tự nhiên trong tiếng Việt và không xác định quá mức sức ấn của tay.
- source_word: שְׁתֵּי יָדוֹ
  choice: cả hai tay mình
  rationale: Diễn đạt tự nhiên cấu trúc số đôi của tiếng Hê-bơ-rơ và làm rõ hai tay thuộc về A-rôn.
- source_word: הַשָּׂעִיר הַחַי
  choice: con dê đực còn sống
  rationale: שָׂעִיר là dê đực, còn הַחַי phân biệt nó với con đã bị giết trong nghi thức.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: xưng trên nó
  rationale: 'Giữ động từ “xưng” và quan hệ không gian/nghi lễ của עַל: A-rôn xưng các tội trên con vật.'
- source_word: עֲוֺנֹת
  choice: những điều gian ác
  rationale: Diễn đạt sức nặng đạo đức của עָוֹן, đồng thời phân biệt với “sự phản nghịch” và “tội lỗi” ở sau.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Đây là thành ngữ chỉ cộng đồng Y-sơ-ra-ên. Cách dịch này rõ nghĩa trong tiếng Việt; nghĩa đen được ghi ở chú thích.
- source_word: פִּשְׁעֵיהֶם
  choice: sự phản nghịch của họ
  rationale: פֶּשַׁע nhấn mạnh sự vi phạm mang tính nổi loạn; “phản nghịch” giữ được sắc thái ấy.
- source_word: לְכָל חַטֹּאתָם
  choice: mọi tội lỗi của họ
  rationale: Trong chuỗi ba thuật ngữ, cụm này có tác dụng bao quát toàn bộ tội lỗi của dân; cách dịch không ép giới từ לְ theo một quan hệ thần học riêng.
- source_word: וְנָתַן אֹתָם
  choice: đặt tất cả những điều ấy
  rationale: Đại từ số nhiều quy chiếu đến các điều gian ác, sự phản nghịch và tội lỗi vừa được xưng; thêm “tất cả” giúp tiếng Việt rõ mạch.
- source_word: וְשִׁלַּח בְּיַד
  choice: giao nó cho ... để người ấy đưa
  rationale: Chuyển thành cấu trúc tiếng Việt tự nhiên, vẫn giữ ý con dê được sai đi qua trung gian của một người.
- source_word: אִישׁ עִתִּי
  choice: một người đã được chỉ định
  rationale: עִתִּי là từ khó, có thể nhấn mạnh người ấy đã được chuẩn bị, chỉ định hoặc thích hợp đúng dịp; bản chính chọn cách hiểu theo chức năng và ghi các khả năng ở chú thích.
- source_word: הַמִּדְבָּרָה
  choice: vào hoang mạc
  rationale: Đuôi chỉ hướng biểu thị chuyển động vào nơi hoang vắng; “hoang mạc” không giới hạn địa hình thành sa mạc cát.
theological_decisions:
- issue: Ba thuật ngữ chỉ tội lỗi
  choice: mọi điều gian ác / mọi sự phản nghịch / mọi tội lỗi
  alternative: mọi tội ác / mọi vi phạm / mọi tội lỗi
  rationale: Giữ ba cách gọi riêng biệt để phản ánh lối liệt kê dồn dập của nguyên văn và tính toàn diện của lời xưng tội, nhưng không biến chúng thành ba phạm trù thần học cứng nhắc.
- issue: Cách hiểu nghi thức đặt tội trên đầu con dê
  choice: dịch trực tiếp “đặt tất cả những điều ấy trên đầu con dê”
  alternative: diễn giải là chuyển giao hoặc quy tội cho con dê
  rationale: Nguyên văn mô tả hành động nghi lễ nhưng không giải thích đầy đủ cơ chế thần học; bản dịch giữ hình ảnh cụ thể, không thêm một học thuyết giải thích.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên
  rationale: Cụm từ chỉ toàn thể cộng đồng giao ước chứ không chỉ nam giới; chú thích bảo lưu hình thức nghĩa đen của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “A-rôn”, “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; giữ hình ảnh nghi lễ cụ thể và tránh thuật ngữ hệ phái.
