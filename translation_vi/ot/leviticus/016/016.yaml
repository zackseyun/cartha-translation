  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: vi
  text: Như vậy, ông sẽ làm lễ chuộc tội[c] cho nơi thánh[a] vì các sự ô uế của dân Israel[b], vì các sự vi phạm của họ, vì mọi tội lỗi của họ. Ông cũng sẽ làm như thế cho Lều Hội Kiến ở giữa họ, giữa những sự ô uế của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thánh sở.” Từ Hê-bơ-rơ הַקֹּדֶשׁ trong bối cảnh nghi lễ này có thể chỉ nơi thánh hoặc thánh sở.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen là “con cái Israel,” một cách gọi tập thể chỉ dân Israel.
    reason: lexical_alternative
  - marker: c
    text: Trong bối cảnh Ngày Chuộc Tội, “làm lễ chuộc tội” cũng bao hàm ý “thanh tẩy” hoặc “tẩy sạch,” vì nghi lễ xử lý cả sự ô uế lẫn tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: làm lễ chuộc tội
  rationale: Trong nghi lễ Lê-vi, כפר chỉ hành động nghi lễ nhằm xử lý cả sự ô uế lẫn tội lỗi. “Làm lễ chuộc tội” giữ được nội dung nghi lễ và thần học, trong khi “thanh tẩy” chỉ nhấn mạnh một phương diện của kết quả.
- source_word: עַל הַקֹּדֶשׁ
  choice: cho nơi thánh
  rationale: הַקֹּדֶשׁ ở đây chỉ khu vực thánh thuộc nơi thờ phượng. “Nơi thánh” tự nhiên trong tiếng Việt và vẫn để ngỏ mức độ cụ thể của địa điểm trong nghi lễ.
- source_word: מִטֻּמְאֹת
  choice: vì những sự ô uế
  rationale: מִן trong ngữ cảnh này nêu nguyên nhân cần thực hiện nghi lễ. Dạng số nhiều được giữ lại để phản ánh nhiều tình trạng hay trường hợp ô uế theo nghi lễ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “con cái Israel” nhưng chỉ toàn thể cộng đồng giao ước; “dân Israel” là cách diễn đạt hiện đại, rõ nghĩa và bao gồm cả cộng đồng mà không làm thay đổi đối tượng quy chiếu.
- source_word: וּמִפִּשְׁעֵיהֶם
  choice: vì những sự vi phạm của họ
  rationale: פֶּשַׁע mang sắc thái vượt phạm, chống nghịch. “Sự vi phạm” giữ được tính nghiêm trọng về đạo đức mà không buộc mọi trường hợp phải được hiểu là sự nổi loạn công khai.
- source_word: לְכָל חַטֹּאתָם
  choice: tức mọi tội lỗi của họ
  rationale: חַטֹּאות ở đây hợp lý nhất là “tội lỗi,” song quan hệ chính xác của לְכָל với mệnh đề trước có thể được hiểu theo vài cách. “Tức” trình bày các sự vi phạm trong phạm vi toàn bộ tội lỗi và tạo câu tiếng Việt rõ ràng mà không hiểu từ này là “lễ vật chuộc tội.”
- source_word: וְכֵן יַעֲשֶׂה
  choice: ông cũng sẽ làm như thế
  rationale: Cụm này chuyển cùng một thủ tục nghi lễ sang Lều Hội Kiến; “cũng sẽ làm như thế” diễn đạt tự nhiên ý tương ứng ấy.
- source_word: לְאֹהֶל מוֹעֵד
  choice: cho Lều Hội Kiến
  rationale: Đây là tên gọi trực tiếp của אֹהֶל מוֹעֵד, vừa giữ hình ảnh “lều” vừa thể hiện chức năng hội kiến.
- source_word: הַשֹּׁכֵן אִתָּם
  choice: đang ở cùng họ
  rationale: Phân từ שׁכן bổ nghĩa cho Lều Hội Kiến và diễn tả việc lều hiện diện giữa cộng đồng. “Ở cùng” giữ ý quan hệ và vị trí mà không đổi chủ thể thành Đức Chúa Trời.
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: giữa những sự ô uế của họ
  rationale: Cách dịch này giữ hình ảnh không gian của בְּתוֹךְ và dạng số nhiều của טֻמְאוֹת, nhấn mạnh rằng nơi thánh hiện diện giữa một cộng đồng có sự ô uế theo nghi lễ.
theological_decisions:
- issue: Ý nghĩa của כפר trong bối cảnh Ngày Chuộc Tội
  choice: làm lễ chuộc tội
  alternative: thanh tẩy; tẩy sạch
  rationale: Nghi lễ trong câu này xử lý cả sự ô uế và tội lỗi liên quan đến nơi thánh. “Làm lễ chuộc tội” giữ phạm vi nghi lễ-thần học rộng hơn, còn chú thích nêu phương diện thanh tẩy vốn thực sự có trong ngữ cảnh.
- issue: Đối tượng của hành động chuộc tội
  choice: cho nơi thánh
  alternative: thanh tẩy nơi thánh; chuộc tội trên nơi thánh
  rationale: Câu nói nghi lễ được thực hiện liên quan đến nơi thánh vì sự ô uế và tội lỗi của dân. Bản dịch không giải quyết quá mức cơ chế của hành động bằng cách chỉ dùng thuật ngữ thanh tẩy.
- issue: Cách diễn đạt בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  alternative: con cái Israel
  rationale: Cụm nguồn mang hình thức giống đực nhưng dùng như tên tập thể của cộng đồng Israel. Tiếng Việt hiện đại dùng “dân Israel” tự nhiên hơn và không thu hẹp đối tượng chỉ còn nam giới; nghĩa đen được ghi trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng thuật ngữ nghi lễ quen thuộc và cấu trúc câu dễ hiểu. “Ông” tiếp nối chủ thể tư tế trong ngữ cảnh gần; “Lều Hội Kiến” được viết hoa như danh xưng. Bản dịch tránh dùng “ngự” cho chiếc lều để không chuyển ngầm chủ thể của הַשֹּׁכֵן sang Đức Chúa Trời.
