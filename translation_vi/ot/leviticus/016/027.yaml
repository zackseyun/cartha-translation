revisions:
- from: Con bò đực dùng làm lễ vật chuộc tội và con dê đực dùng làm lễ vật chuộc tội—những con có máu đã được đem vào nơi thánh để thực hiện nghi thức chuộc tội—thì ông phải đem chúng ra ngoài trại; rồi họ phải dùng lửa thiêu da, thịt và phân của chúng.[a]
  to: Con bò đực dùng làm lễ vật chuộc tội và con dê đực dùng làm lễ vật chuộc tội—mà máu của chúng đã được đem vào nơi thánh để làm lễ chuộc tội—thì ông phải đem chúng ra ngoài trại; rồi họ phải dùng lửa thiêu da, thịt và phân của chúng.[a]
  rationale: Sửa mệnh đề quan hệ để biểu đạt minh bạch quan hệ giữa các con vật và máu của chúng; đồng thời rút gọn cách diễn đạt về việc chuộc tội cho tự nhiên. Các chi tiết nghi lễ, số của động từ, và thuật ngữ chính được giữ nguyên.
