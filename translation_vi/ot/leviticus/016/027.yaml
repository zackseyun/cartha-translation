base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: vi
  text: Con bò đực dùng làm lễ vật chuộc tội và con dê đực dùng làm lễ vật chuộc tội—mà máu của chúng đã được đem vào nơi thánh để làm lễ chuộc tội—thì ông phải đem chúng ra ngoài trại; rồi họ phải dùng lửa thiêu da, thịt và phân của chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chuyển từ chủ thể số ít (“ông phải đem”) sang chủ thể số nhiều (“họ phải… thiêu”), có thể phân biệt người chủ trì nghi lễ với những người phụ giúp.
    reason: cultural_note
lexical_decisions:
- source_word: פַּר הַחַטָּאת / שְׂעִיר הַחַטָּאת
  choice: con bò đực dùng làm lễ vật chuộc tội / con dê đực dùng làm lễ vật chuộc tội
  rationale: Diễn đạt rõ chức năng tế lễ của hai con vật bằng thuật ngữ quen thuộc, đồng thời giữ cấu trúc song song của nguyên văn.
- source_word: הוּבָא אֶת־דָּמָם
  choice: những con có máu đã được đem vào
  rationale: Giữ thể bị động và hướng chuyển động vào khu vực thánh; bổ sung “những con” để quan hệ đại từ được rõ ràng, tự nhiên trong tiếng Việt.
- source_word: לְכַפֵּר
  choice: để thực hiện nghi thức chuộc tội
  rationale: Trong ngữ cảnh nghi lễ Ngày Chuộc Tội, cách dịch này truyền đạt chức năng tế lễ mà không thu hẹp ý nghĩa vào một học thuyết giải tội cụ thể.
- source_word: בַּקֹּדֶשׁ
  choice: trong nơi thánh
  rationale: “Nơi thánh” chỉ địa điểm thuộc khu vực thánh trong ngữ cảnh này và không xác định quá mức đó là một phần kiến trúc cụ thể nào.
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: ông phải đem chúng ra ngoài trại
  rationale: Diễn đạt tự nhiên lực gây khiến và hướng chuyển động của động từ Híp-in, đồng thời nêu rõ tân ngữ số nhiều vốn được hiểu ngầm trong tiếng Hê-bơ-rơ.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: họ phải dùng lửa thiêu
  rationale: Giữ động từ số nhiều của nguyên văn và diễn đạt phương tiện “bằng lửa” theo cách tự nhiên trong tiếng Việt.
- source_word: עֹרֹתָם וְאֶת־בְּשָׂרָם וְאֶת־פִּרְשָׁם
  choice: da, thịt và phân của chúng
  rationale: Ba danh từ cụ thể được giữ nguyên, kể cả từ thẳng nghĩa “phân”, phù hợp với quy định xử lý xác con vật tế lễ.
theological_decisions:
- issue: Thuật ngữ חטאת và כפר trong nghi lễ
  choice: “lễ vật chuộc tội” và “thực hiện nghi thức chuộc tội”
  alternative: “lễ vật thanh tẩy” và “thanh tẩy”
  rationale: Cách chọn giữ ngôn ngữ tế lễ dễ nhận biết và phạm vi thần học rộng của כפר, nhưng thêm “nghi thức” để làm rõ đây là hành động phụng tự trong văn cảnh.
- issue: Sự chuyển từ động từ số ít יוֹצִיא sang số nhiều וְשָׂרְפוּ
  choice: 'Giữ sự chuyển đổi: “ông phải đem…; rồi họ phải… thiêu”'
  alternative: 'Làm phẳng thành một chủ thể: “ông phải đem… và thiêu”'
  rationale: Nguyên văn phân biệt chủ thể số ít với nhóm thực hiện việc thiêu; bản dịch giữ nguyên nét chuyển đổi này thay vì âm thầm đồng nhất các chủ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ mệnh đề quan hệ dài; “ông” phù hợp với A-rôn là chủ thể được hiểu từ văn cảnh, còn “họ” giữ sự chuyển đổi số của nguyên văn.
