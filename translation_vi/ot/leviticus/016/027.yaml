    rationale: Nguyên văn nói về hai con vật “mà máu của chúng đã được đem vào”. Nêu rõ “máu của chúng” vừa sát cấu trúc sở hữu số nhiều của tiếng Hê-bơ-rơ vừa rõ nghĩa hơn trong tiếng Việt.
  - severity: low
    issue: “Thực hiện nghi thức chuộc tội” hơi dài và thêm sắc thái thủ tục không cần thiết.
    rationale: לְכַפֵּר nêu mục đích “để chuộc tội/làm lễ chuộc tội”. “Làm lễ chuộc tội” giữ sắc thái tế lễ trong văn cảnh mà tự nhiên hơn.
  revised_text: Con bò đực dùng làm lễ vật chuộc tội và con dê đực dùng làm lễ vật chuộc tội—mà máu của chúng đã được đem vào nơi thánh để làm lễ chuộc tội—thì ông phải đem chúng ra ngoài trại; rồi họ phải dùng lửa thiêu da, thịt và phân của chúng.[a]
