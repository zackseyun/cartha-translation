source:
  edition: WLC
  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: vi
  text: Khi đã hoàn tất việc làm lễ chuộc tội[b] cho nơi thánh[a], Lều Hội Kiến và bàn thờ, A-rôn phải trình[c] con dê đực còn sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đền thánh.”
    reason: lexical_alternative
  - marker: b
    text: Trong văn cảnh này, “làm lễ chuộc tội” cũng có thể được hiểu là thực hiện nghi thức thanh tẩy.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “đem đến gần”; tức là trình ra cho nghi thức tiếp theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה
  choice: Khi đã hoàn tất
  rationale: Diễn đạt tự nhiên quan hệ thời gian và ý hoàn thành của động từ כלה trước hành động kế tiếp.
- source_word: מִכַּפֵּר
  choice: việc làm lễ chuộc tội
  rationale: Giữ thuật ngữ tế tự then chốt כפר, đồng thời thêm “lễ” để người đọc Việt hiểu đây là hành động nghi lễ chứ không chỉ là sự bồi thường thông thường.
- source_word: הַקֹּדֶשׁ
  choice: nơi thánh
  rationale: Phản ánh trực tiếp không gian thánh được nói đến; “đền thánh” cũng có thể diễn đạt sở chỉ theo văn cảnh nhưng dễ gợi một kiến trúc cố định.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, tương đối quen thuộc và sát nghĩa cho chiếc lều nơi Đức Chúa Trời gặp dân Ngài.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Tương đương tự nhiên và chính xác của thuật ngữ tế tự.
- source_word: וְהִקְרִיב
  choice: phải trình
  rationale: Trong văn cảnh nghi lễ, הקריב là đưa đến gần để trình ra cho hành động kế tiếp; “trình” tự nhiên hơn cách dịch từng chữ “đem đến gần”.
- source_word: הַשָּׂעִיר הֶחָי
  choice: con dê đực còn sống
  rationale: שָׂעִיר chỉ dê đực; “còn sống” làm rõ sự tương phản với con dê đã bị giết.
theological_decisions:
- issue: Ý nghĩa của כפר trong nghi lễ
  choice: làm lễ chuộc tội
  alternative: thanh tẩy theo nghi lễ
  rationale: Bản chính giữ chiều kích chuộc tội rộng của thuật ngữ mà không áp đặt một cơ chế thần học riêng; chú thích ghi nhận hiệu quả thanh tẩy khả hữu trong văn cảnh.
- issue: Sở chỉ của הַקֹּדֶשׁ
  choice: nơi thánh
  alternative: đền thánh
  rationale: “Nơi thánh” giữ được phạm vi từ vựng và tránh khiến độc giả nghĩ đến một đền thờ xây cố định; chú thích bảo tồn cách hiểu thay thế.
- issue: Chủ ngữ ngầm của động từ
  choice: A-rôn
  alternative: ông
  rationale: Tiếng Hê-bơ-rơ chỉ biểu thị chủ ngữ ngôi ba số ít giống đực qua động từ; nêu “A-rôn” theo chủ thể đang tiếp diễn trong phân đoạn giúp câu tiếng Việt độc lập và rõ nghĩa mà không thay đổi tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phải” cho dạng chỉ thị nghi lễ; viết hoa “Lều Hội Kiến” như tên gọi của cơ sở thờ phượng. Tất cả dấu chú thích được đặt ngay sau thành phần liên quan.
