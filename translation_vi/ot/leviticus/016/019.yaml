source:
  edition: WLC
  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: vi
  text: Ông phải dùng ngón tay rảy một ít máu trên bàn thờ bảy lần, rồi thanh tẩy[a] và thánh hóa[b] bàn thờ khỏi những sự ô uế của con dân Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làm cho sạch”; động từ Hê-bơ-rơ là thuật ngữ tư tế thường dùng cho việc làm cho sạch về mặt nghi lễ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “biệt riêng làm thánh” hoặc “làm cho nên thánh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Ông phải ... rảy
  rationale: Dạng Hiphil của נזה trong nghi lễ chỉ hành động rảy máu; “rảy” là từ tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: עָלָיו
  choice: trên bàn thờ
  rationale: Đại từ chỉ về bàn thờ ở câu trước; lặp lại danh từ giúp câu tiếng Việt rõ đối tượng mà không thay đổi ý nghĩa.
- source_word: מִן־הַדָּם
  choice: một ít máu
  rationale: מִן mang nghĩa bộ phận, chỉ lấy một phần lượng máu để rảy.
- source_word: בְּאֶצְבָּעוֹ
  choice: dùng ngón tay
  rationale: Giới từ בְּ chỉ phương tiện; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Giữ nguyên con số và tính chính xác của nghi thức.
- source_word: וְטִהֲרוֹ
  choice: thanh tẩy
  rationale: טהר trong văn cảnh tư tế chỉ việc làm cho sạch về mặt nghi lễ; “thanh tẩy” vừa dễ hiểu vừa giữ sắc thái nghi lễ.
- source_word: וְקִדְּשׁוֹ
  choice: thánh hóa
  rationale: קדש ở đây chỉ việc làm cho vật trở nên thánh hoặc biệt riêng là thánh; “thánh hóa” giữ được quan hệ động từ với ý niệm thánh.
- source_word: מִטֻּמְאֹת
  choice: khỏi những sự ô uế
  rationale: Giữ dạng số nhiều của tiếng Hê-bơ-rơ và sắc thái ô uế nghi lễ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Đây là thành ngữ tập thể chỉ cộng đồng Israel. “Con dân Israel” tự nhiên, trang trọng và bao quát cộng đồng, đồng thời vẫn phản ánh yếu tố quan hệ dòng dõi trong בְּנֵי.
theological_decisions:
- issue: Ngôn ngữ thanh tẩy bàn thờ
  choice: Bàn thờ được thanh tẩy và thánh hóa khỏi những sự ô uế của Israel.
  alternative: Có thể dịch hai động từ là “làm cho sạch” và “biệt riêng làm thánh”.
  rationale: Câu nói về tác dụng nghi lễ trên bàn thờ, không phải sự biến đổi đạo đức hay nội tâm. Cách dịch giữ nguyên phạm trù tư tế mà không áp đặt một hệ thần học về sau.
- issue: Cách hiểu בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai Israel; dân Israel; người Israel
  rationale: Trong ngữ cảnh này, cụm từ là tên gọi tập thể của cộng đồng giao ước. “Con dân Israel” truyền đạt tự nhiên chức năng tập thể ấy trong tiếng Việt mà không thu hẹp đối tượng chỉ còn nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” theo mạch chỉ thầy tế lễ thượng phẩm; lặp lại “bàn thờ” thay cho đại từ để tránh mơ hồ. Các thuật ngữ “thanh tẩy”, “thánh hóa” giữ sắc thái nghi lễ nhưng vẫn quen thuộc với độc giả phổ thông.
