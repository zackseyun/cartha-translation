  source_fidelity: 'Bản dịch giữ đúng cấu trúc và các thuật ngữ chính của tiếng Hê-bơ-rơ: ngày Sa-bát có tính nghỉ ngơi trọn vẹn, mệnh lệnh tự hạ mình, và quy định có hiệu lực lâu dài. Tuy nhiên, “hạ mình xuống” thêm sắc thái vận động/thể lý không có trong ענה và không tự nhiên trong tiếng Việt ở đây.'
