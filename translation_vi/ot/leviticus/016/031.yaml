base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: vi
  text: Đây là một ngày Sa-bát nghỉ ngơi hoàn toàn dành cho các ngươi; các ngươi phải tự hạ mình[a]. Đó là một quy định đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự làm khổ mình”; theo cách hiểu truyền thống, điều này bao gồm kiêng ăn và tự khước từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת
  choice: ngày Sa-bát
  rationale: Giữ thuật ngữ cố định mang ý nghĩa nghi lễ và thần học trong Ngũ Kinh, thay vì chỉ dịch là một ngày nghỉ thông thường.
- source_word: שַׁבָּתוֹן
  choice: nghỉ hoàn toàn
  rationale: Diễn đạt sắc thái nhấn mạnh của cụm שַׁבַּת שַׁבָּתוֹן bằng tiếng Việt tự nhiên, cho thấy đây là sự nghỉ ngơi triệt để.
- source_word: הִיא לָכֶם
  choice: Đó là ... cho các ngươi
  rationale: Bảo toàn cấu trúc vị ngữ và lời phán trực tiếp cho cộng đồng; “các ngươi” phù hợp với văn phong luật pháp trang trọng và ngôi số nhiều.
- source_word: וְעִנִּיתֶם
  choice: các ngươi phải hạ mình xuống
  rationale: Trong bối cảnh nghi lễ, dạng piel của ענה cùng với נֶפֶשׁ chỉ việc tự hạ mình, tự khước từ; cách dịch này tránh hàm ý tự hành hạ thân thể và không thu hẹp mệnh lệnh thành việc kiêng ăn בלבד.
- source_word: נַפְשֹׁתֵיכֶם
  choice: mình
  rationale: Trong thành ngữ ענה + נפשׁ, từ này có chức năng phản thân; dịch là “mình” tự nhiên hơn “linh hồn” và tránh gán cho câu một quan niệm phân chia thân thể–linh hồn không có trong thành ngữ Hê-bơ-rơ.
- source_word: חֻקַּת עוֹלָם
  choice: một quy định vĩnh viễn
  rationale: Truyền đạt công thức luật pháp về hiệu lực lâu dài; “quy định” dễ hiểu trong tiếng Việt hiện đại, còn “vĩnh viễn” giữ được sức nặng của עוֹלָם.
theological_decisions:
- issue: Ý nghĩa của mệnh lệnh tự khước từ trong Ngày Chuộc Tội
  choice: hạ mình xuống
  alternative: tự làm khổ mình; kiêng ăn
  rationale: Bản Hê-bơ-rơ dùng thành ngữ rộng hơn là ענה + נפשׁ, chứ không dùng động từ trực tiếp có nghĩa “kiêng ăn”. Bản chính vì thế giữ phạm vi rộng của mệnh lệnh, còn chú thích nêu cách dịch sát chữ và cách hiểu truyền thống.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Sa-bát” như thuật ngữ Kinh Thánh quen thuộc; dùng “các ngươi” để duy trì sắc thái lời luật truyền cho toàn cộng đồng. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
