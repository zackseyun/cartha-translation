id: LEV.16.6
reference: Leviticus 16:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְרִ֧יב אַהֲרֹ֛ן אֶת פַּ֥ר הַ/חַטָּ֖את אֲשֶׁר ל֑/וֹ וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: vi
  text: A-rôn phải trình con bò đực làm lễ vật chuộc tội dành cho mình[a], rồi làm lễ chuộc tội cho chính mình và cho gia đình mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật chuộc tội, và trong một số ngữ cảnh nhấn mạnh sự thanh tẩy theo nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: phải trình
  rationale: Trong ngữ cảnh tế lễ, động từ này chỉ việc đem lễ vật đến trình trước Đức Chúa Trời; “trình” giữ được ý nghi lễ mà không hàm ý rằng toàn bộ việc dâng tế đã hoàn tất.
- source_word: פַּר
  choice: con bò đực
  rationale: פַּר chỉ bò đực dùng làm sinh tế; cách dịch này rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong luật tế lễ, חַטָּאת chỉ lễ vật liên quan đến tội, chứ không phải bản thân tội lỗi. “Lễ vật chuộc tội” là cách gọi dễ hiểu; sắc thái thanh tẩy được ghi ở chú thích.
- source_word: אֲשֶׁר לוֹ
  choice: dành cho mình
  rationale: Cụm từ xác định con bò này là lễ vật dành riêng cho A-rôn, đối lập với lễ vật của dân chúng trong ngữ cảnh.
- source_word: וְכִפֶּר
  choice: rồi làm lễ chuộc tội
  rationale: כפר trong ngữ cảnh tư tế mang ý thực hiện nghi thức chuộc tội. “Làm lễ chuộc tội” giữ sắc thái nghi lễ và thần học mà không thu hẹp cơ chế của hành động.
- source_word: בַּעֲדוֹ
  choice: cho chính mình
  rationale: בְּעַד với hậu tố chỉ người được hưởng lợi hoặc người mà nghi thức được thực hiện thay mặt; “cho chính mình” tự nhiên và nhấn rõ sự quy chiếu về A-rôn.
- source_word: וּבְעַד בֵּיתוֹ
  choice: và cho gia đình mình
  rationale: בַּיִת ở đây chỉ gia đình hay hộ gia đình của A-rôn, không phải ngôi nhà vật chất.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Danh từ ở đây rõ ràng chỉ một lễ vật. Bản chính dùng cách gọi quen thuộc và dễ hiểu, đồng thời chú thích bảo lưu cách hiểu nhấn mạnh chức năng thanh tẩy của nghi thức.
- issue: Phạm vi nghĩa của בֵּיתוֹ
  choice: gia đình mình
  alternative: nhà mình
  rationale: Trong ngữ cảnh này, từ Hê-bơ-rơ nói đến những người thuộc nhà A-rôn, không phải một công trình vật chất; cách dịch không xác định hẹp hơn điều văn bản cho phép.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và mang tính chỉ dẫn nghi lễ. Dùng “phải” để thể hiện quy định trong trình tự nghi lễ; chọn “gia đình” thay vì “nhà” để tránh hiểu theo nghĩa kiến trúc.
