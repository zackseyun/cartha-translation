source:
  edition: WLC
  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: vi
  text: Ông phải lấy hai con dê và đặt chúng trước mặt Yahweh, tại lối vào Lều Hội Kiến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ông bắt
  rationale: Trong chuỗi chỉ dẫn nghi lễ, dạng động từ này mang ý nghĩa hành động tiếp nối. “Rồi” diễn đạt tự nhiên trình tự ấy; “bắt” phù hợp với việc đem và giữ hai con dê để đặt chúng tại nơi quy định.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: hai con dê
  rationale: שָׂעִיר chỉ dê, thường là dê đực. Ngữ cảnh trước đã xác định các con vật; cách dịch gọn này tự nhiên và không làm thay đổi đối tượng được nói đến.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: và đặt chúng
  rationale: Dạng Hiphil của עמד có nghĩa khiến đứng, đặt hoặc trình diện. “Đặt chúng” giữ được ý nghĩa bố trí cụ thể trong nghi lễ mà không diễn giải quá mức.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי diễn tả vị trí hay sự hiện diện, còn יהוה là danh riêng của Đức Chúa Trời. “Trước mặt Yahweh” bảo toàn cả ý không gian-lễ nghi lẫn danh giao ước.
- source_word: פֶּתַח
  choice: tại lối vào
  rationale: פֶּתַח là chỗ mở hoặc lối vào. “Tại lối vào” là cách nói tự nhiên, rõ địa điểm của hành động.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cụm từ có nghĩa đen là lều của sự gặp gỡ/hội kiến. “Lều Hội Kiến” là danh xưng trang trọng, quen dùng và không thay thế hình ảnh chiếc lều bằng thuật ngữ kiến trúc khác.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Phiên chuyển “Yahweh” bảo toàn việc đây là danh riêng, thay vì biến nó thành một tước hiệu.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng hiện đại. Đại từ “ông” nối tự nhiên với A-rôn là chủ thể trong ngữ cảnh, còn “chúng” tránh lặp lại “hai con dê”.
