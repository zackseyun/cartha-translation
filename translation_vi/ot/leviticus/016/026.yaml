  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: vi
  text: Người đưa con dê đến A-xa-xên[a] phải giặt áo quần và tắm rửa thân thể trong nước; chỉ sau đó người ấy mới được vào trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cho A-xa-xên.” Nghĩa của thuật ngữ Hê-bơ-rơ này còn nhiều tranh luận; có thể hiểu đây là một tên riêng hoặc danh xưng, hoặc hiểu theo chức năng là sự loại bỏ hay điều thường được gọi là “con dê gánh tội.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: Người dẫn ... đi
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ người được giao đưa con dê đi. Trong ngữ cảnh nghi lễ, “dẫn ... đi” tự nhiên hơn lối dịch sát chữ “sai ... đi” mà vẫn giữ ý đưa con dê rời khỏi trại.
- source_word: הַשָּׂעִיר
  choice: con dê
  rationale: Danh từ chỉ dê đực, nhưng con dê nghi lễ này đã được xác định trong văn cảnh; “con dê” là cách nói tự nhiên và đầy đủ trong tiếng Việt.
- source_word: לַעֲזָאזֵל
  choice: đến A-xa-xên
  rationale: Thuật ngữ Hê-bơ-rơ còn nhiều tranh luận. Phiên âm như một danh xưng và dùng “đến” bảo toàn hướng chuyển động trong nghi lễ mà không áp đặt cách giải thích như “để đem đi” hay “con dê gánh tội”.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: phải giặt quần áo
  rationale: Đây là quy định thanh tẩy mang tính bắt buộc. “Phải giặt quần áo” rõ ràng, hiện đại và phù hợp văn phong luật lệ.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: và tắm mình trong nước
  rationale: בָּשָׂר theo nghĩa đen là “thịt/thân thể”; “tắm mình” diễn đạt tự nhiên hành động thanh tẩy toàn thân, đồng thời giữ cụm “trong nước” của nguyên văn.
- source_word: וְאַחֲרֵי כֵן
  choice: sau đó
  rationale: Diễn đạt trực tiếp và tự nhiên trình tự thời gian.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: mới được vào trại
  rationale: Dạng vị hoàn thành ở đây nêu việc được phép trở lại sau khi hoàn tất thanh tẩy. Từ “mới” làm rõ điều kiện về trình tự vốn có trong câu, còn “được” thể hiện sắc thái cho phép.
theological_decisions:
- issue: Ý nghĩa của לַעֲזָאזֵל trong nghi lễ Ngày Chuộc Tội
  choice: 'Giữ như một danh xưng được phiên âm: “đến A-xa-xên”'
  alternative: “để đem đi,” “cho sự loại bỏ,” “con dê gánh tội,” hoặc cách hiểu là một hữu thể nơi hoang mạc
  rationale: Nguồn gốc và nghĩa của từ còn đang được tranh luận. Phiên âm bảo toàn sự mơ hồ của tiếng Hê-bơ-rơ và tránh đưa một cách giải thích thần học cụ thể vào chính văn.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại, dùng câu ngắn và từ ngữ phổ thông. “A-xa-xên” được phiên âm để người đọc tiếng Việt dễ đọc, còn chú thích giữ các cách hiểu cạnh tranh.
