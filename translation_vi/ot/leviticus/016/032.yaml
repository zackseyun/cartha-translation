source:
  edition: WLC
  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: vi
  text: Thầy tế lễ sẽ được xức dầu và được phong chức[a] để làm thầy tế lễ thay cha mình sẽ làm lễ chuộc tội, và sẽ mặc các lễ phục bằng vải lanh, tức là các lễ phục thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “tay người ấy được làm đầy”; đây là một thành ngữ chỉ việc được phong chức hoặc được lập vào chức vụ tế lễ.
    reason: Bảo tồn hình ảnh nguyên ngữ đứng sau cách dịch thành ngữ tự nhiên trong chính văn.
lexical_decisions:
- source_word: וְכִפֶּר
  choice: sẽ làm lễ chuộc tội
  rationale: Trong ngữ cảnh nghi lễ của Lê-vi Ký, động từ כפר chỉ việc thực hiện nghi thức đem lại sự chuộc tội hoặc thanh tẩy. Cách dịch này tự nhiên trong tiếng Việt và không xác định quá mức cơ chế thần học.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Nguyên văn chỉ nói 'thầy tế lễ', rồi xác định người ấy qua việc được xức dầu, phong chức và kế nhiệm cha; vì vậy không thêm danh hiệu 'thầy tế lễ thượng phẩm' dù văn cảnh nói đến chức vụ ấy.
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: đã được xức dầu
  rationale: Dạng bị động trong tiếng Việt diễn đạt tự nhiên việc người này được biệt lập cho chức vụ, đồng thời không buộc phải xác định chủ thể ngầm của hành động xức dầu.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: và được phong chức[a]
  rationale: '''Làm đầy tay'' là thành ngữ Hê-bơ-rơ về việc lập một người vào chức vụ. ''Được phong chức'' truyền đạt ý nghĩa cho độc giả hiện đại, còn chú thích giữ lại hình ảnh nguyên văn.'
- source_word: לְכַהֵן
  choice: để phục vụ trong chức tế lễ
  rationale: Cụm từ diễn tả việc thi hành chức năng tế lễ; cách dịch này rõ nghĩa và giữ sắc thái phục vụ.
- source_word: תַּחַת אָבִיו
  choice: thay cha mình
  rationale: תחת ở đây chỉ sự thay thế hoặc kế nhiệm trong chức vụ cha truyền con nối.
- source_word: וְלָבַשׁ
  choice: phải mặc
  rationale: Diễn đạt nghĩa vụ nghi lễ của hành động mặc trang phục; từ nối được thể hiện tự nhiên qua dấu chấm phẩy và chủ ngữ được nhắc lại.
- source_word: בִּגְדֵי הַבָּד
  choice: các lễ phục bằng vải lanh
  rationale: בד chỉ loại vải lanh dùng trong trang phục tế lễ; 'lễ phục' phù hợp với văn cảnh nghi lễ và dễ hiểu.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: tức là các lễ phục thánh
  rationale: Cụm lặp mang tính đồng vị, xác định các lễ phục bằng vải lanh là những trang phục được biệt riêng cho việc thánh.
theological_decisions:
- issue: Dịch הַכֹּהֵן là 'thầy tế lễ' hay diễn giải thành 'thầy tế lễ thượng phẩm'
  choice: thầy tế lễ
  alternative: thầy tế lễ thượng phẩm
  rationale: Văn cảnh cho thấy đây là người kế nhiệm chức tế lễ thượng phẩm, nhưng chính câu Hê-bơ-rơ dùng danh từ thông thường rồi mô tả người ấy. Bản dịch giữ cách gọi của nguyên văn.
- issue: Cách chuyển thành ngữ 'làm đầy tay'
  choice: được phong chức, kèm chú thích nghĩa đen
  alternative: được làm đầy tay
  rationale: Dịch sát trong chính văn sẽ tối nghĩa đối với phần lớn độc giả Việt. Cách dịch theo nghĩa thành ngữ giúp câu rõ ràng, trong khi chú thích bảo tồn hình ảnh và cho phép kiểm chứng nguyên văn.
- issue: Sắc thái của כפר trong nghi lễ
  choice: làm lễ chuộc tội
  alternative: thực hiện nghi thức thanh tẩy
  rationale: Động từ có thể bao hàm các khía cạnh chuộc tội và thanh tẩy trong văn chương tế lễ. 'Làm lễ chuộc tội' giữ thuật ngữ quen thuộc mà không loại trừ tác dụng thanh tẩy của nghi thức.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'thầy tế lễ' và 'lễ phục' để giữ bối cảnh nghi lễ; tránh thêm danh hiệu không có trực tiếp trong câu Hê-bơ-rơ. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
