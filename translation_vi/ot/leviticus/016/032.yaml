revisions:
- from: Thầy tế lễ đã được xức dầu và được phong chức[a] để phục vụ trong chức tế lễ thay cha mình sẽ làm lễ chuộc tội; người ấy phải mặc các lễ phục bằng vải lanh, tức là các lễ phục thánh.
  to: Thầy tế lễ sẽ được xức dầu và được phong chức[a] để làm thầy tế lễ thay cha mình sẽ làm lễ chuộc tội, và sẽ mặc các lễ phục bằng vải lanh, tức là các lễ phục thánh.
