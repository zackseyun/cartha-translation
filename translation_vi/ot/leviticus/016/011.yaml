source:
  edition: WLC
  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: vi
  text: A-rôn sẽ trình con bò đực dùng làm lễ vật chuộc tội dành cho mình[a] và thực hiện việc chuộc tội cho mình cùng gia đình mình[b]; rồi ông sẽ giết con bò đực dùng làm lễ vật chuộc tội dành cho mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con bò đực của lễ chuộc tội.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ chép: “cho mình và cho nhà mình”; ở đây “nhà” chỉ những người thuộc gia đình ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: phải trình
  rationale: Thể Hiphil của קרב trong nghi lễ tế lễ có nghĩa là đem đến gần hoặc trình ra. “Trình” diễn đạt hành động đưa con vật đến trước Đức Chúa Trời mà không đồng nhất sớm hành động này với toàn bộ việc dâng lễ, vì câu còn nói đến việc giết con vật.
- source_word: פַּר הַחַטָּאת
  choice: con bò đực dùng làm lễ vật chuộc tội
  rationale: Cách diễn đạt này chuyển tải tự nhiên quan hệ cấu tạo trong tiếng Hê-bơ-rơ và giữ thuật ngữ tế lễ, đồng thời cho thấy con bò được chỉ định làm lễ vật chuộc tội.
- source_word: אֲשֶׁר לוֹ
  choice: dành cho mình
  rationale: Trong ngữ cảnh nghi lễ, cụm từ nói đến con vật được chỉ định cho chính A-rôn, chứ không chỉ khẳng định quyền sở hữu.
- source_word: וְכִפֶּר
  choice: làm lễ chuộc tội
  rationale: כפר trong văn cảnh tế lễ của sách Lê-vi thường chỉ hành động thực hiện sự chuộc tội. Cách dịch này giữ nghĩa nghi lễ quen thuộc mà không áp đặt một lý thuyết thần học cụ thể về cơ chế chuộc tội.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: cho mình cùng gia đình mình
  rationale: בְּעַד biểu thị người được hưởng ích lợi hoặc người mà hành động được thực hiện thay cho; בֵּיתוֹ theo nghĩa thành viên trong nhà được diễn đạt tự nhiên là “gia đình mình” trong tiếng Việt hiện đại.
- source_word: וְשָׁחַט
  choice: rồi ông phải giết
  rationale: שחט là thuật ngữ chỉ việc giết con vật trong nghi lễ tế lễ. “Rồi” thể hiện trình tự của liên từ וְ trong ngữ cảnh, còn “giết” là cách nói rõ ràng, tự nhiên trong tiếng Việt.
- source_word: פַּר הַחַטָּאת אֲשֶׁר לוֹ
  choice: con bò đực dùng làm lễ vật chuộc tội dành cho mình
  rationale: Giữ nguyên cách diễn đạt ở cả hai lần xuất hiện để phản ánh sự lặp lại và tính nhấn mạnh nghi lễ của nguyên văn.
theological_decisions:
- issue: Cách dịch thuật ngữ chuộc tội כפר
  choice: làm lễ chuộc tội
  alternative: thực hiện sự thanh tẩy; thực hiện việc chuộc tội
  rationale: “Làm lễ chuộc tội” giữ được ý nghĩa tế lễ trong văn mạch tư tế nhưng không xác định hẹp rằng hành động chỉ là thanh tẩy, cũng không đưa vào câu một học thuyết hậu kỳ về cơ chế chuộc tội.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Tên A-rôn theo cách phiên âm Kinh Thánh quen thuộc. Câu giữ sự lặp lại có chủ ý của nguyên văn và không giải thích thêm cơ chế thần học của việc chuộc tội.
