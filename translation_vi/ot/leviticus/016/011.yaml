    issue: “phải” cho các động từ chưa hoàn thành
    rationale: Trong tiếng Việt hiện đại, “phải” thường nhấn mạnh tính bắt buộc. “Sẽ” phù hợp hơn với lối chỉ dẫn nghi lễ của nguyên văn mà không thêm sắc thái mệnh lệnh.
  - severity: medium
    issue: “làm lễ chuộc tội” cho וְכִפֶּר
    rationale: Cụm này có thể được hiểu là tiến hành một nghi lễ/lễ vật, trong khi động từ כפר nêu hành động chuộc tội được thực hiện cho các đối tượng đã nói. “Thực hiện việc chuộc tội” minh bạch hơn và vẫn giữ độ mở ngữ nghĩa.
