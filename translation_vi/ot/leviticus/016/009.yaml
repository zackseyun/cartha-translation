source:
  edition: WLC
  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: vi
  text: Rồi A-rôn sẽ trình con dê mà lá thăm dành cho Yahweh đã rơi vào, và dùng nó làm lễ vật chuộc tội.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: sẽ trình
  rationale: Trong ngữ cảnh tế lễ, động từ này chỉ việc đem con vật đến và trình ra cho nghi thức; “trình” giữ được ý ấy mà chưa nói trước hành động dâng tế ở cuối câu.
- source_word: הַשָּׂעִיר
  choice: con dê
  rationale: שׂעיר ở đây là dê đực, nhưng “con dê” tự nhiên và đủ rõ trong mạch nghi lễ đã xác định loại vật tế.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: mà lá thăm ... đã rơi trúng
  rationale: Cách nói này diễn đạt tự nhiên thành ngữ Hê-bơ-rơ về kết quả lá thăm được ấn định cho con dê, đồng thời giữ hình ảnh “rơi trúng”.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ ל biểu thị sự chỉ định của lá thăm; יהוה được chuyển tự là “Yahweh” để bảo tồn danh riêng trong nguyên văn.
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: và dùng nó làm lễ vật chuộc tội
  rationale: Trong luật tế lễ, חטאת chỉ loại lễ vật xử lý tội lỗi; “lễ vật chuộc tội” rõ nghĩa trong tiếng Việt và cấu trúc “dùng nó làm” phản ánh động từ עשה cùng đại từ tân ngữ.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; chuyển tự “Yahweh” bảo tồn danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy; tội lỗi
  rationale: Ở đây từ này gọi tên một loại lễ vật, không chỉ khái niệm “tội lỗi”. “Lễ vật chuộc tội” là cách gọi dễ hiểu, dù thuật ngữ cũng có sắc thái thanh tẩy trong hệ thống nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “A-rôn” theo lối phiên âm Kinh Thánh quen thuộc; giữ “Yahweh” là danh riêng. Cụm “lễ vật chuộc tội” ưu tiên tính dễ hiểu nhưng không loại trừ sắc thái thanh tẩy của nghi lễ.
