revisions:
- from: Rồi A-rôn sẽ trình con dê mà lá thăm dành cho Yahweh đã rơi trúng[a], và dùng nó làm lễ vật chuộc tội.
  to: Rồi A-rôn sẽ trình con dê mà lá thăm dành cho Yahweh đã rơi vào, và dùng nó làm lễ vật chuộc tội.
  rationale: Chỉ sửa “đã rơi trúng” thành “đã rơi vào” để loại bỏ chỗ thiếu bổ ngữ trong tiếng Việt và phản ánh trực tiếp hơn thành ngữ Hê-bơ-rơ về lá thăm rơi trên con dê. Các thuật ngữ và ý nghĩa nghi lễ còn lại được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:28:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của tiếng Hê-bơ-rơ: A-rôn đem/trình con dê, lá thăm dành cho Yahweh đã được chỉ định cho nó, rồi xử lý nó như lễ vật chuộc tội. Tuy nhiên, cụm “lá thăm ... đã rơi trúng” thiếu bổ ngữ được nêu rõ và kém sát thành ngữ “lá thăm rơi vào/trên nó” của nguyên văn.'
  naturalness: Cần chỉnh nhẹ để câu tiếng Việt hoàn chỉnh và tự nhiên hơn. “Đã rơi vào” trong mệnh đề quan hệ diễn đạt rõ rằng lá thăm rơi vào con dê; “Rồi” và “A-rôn” vẫn phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
  terminology: “Yahweh” bảo tồn danh יהוה; “lễ vật chuộc tội” là thuật ngữ dễ hiểu và phù hợp với חטאת trong ngữ cảnh tế lễ. “Con dê” chấp nhận được dù từ Hê-bơ-rơ thường chỉ dê đực trong ngữ cảnh này.
  issues:
  - severity: medium
    issue: Cụm “lá thăm dành cho Yahweh đã rơi trúng” không nêu đối tượng của động từ “rơi trúng”.
    rationale: Trong tiếng Việt hiện đại, “rơi trúng” thường cần bổ ngữ rõ ràng (rơi trúng ai/vật gì). Nguyên văn nói lá thăm “đã lên/rơi vào nó”; đổi thành “đã rơi vào” trong mệnh đề bổ nghĩa cho “con dê” vừa tự nhiên vừa giữ quan hệ ngữ nghĩa.
  revised_text: Rồi A-rôn sẽ trình con dê mà lá thăm dành cho Yahweh đã rơi vào, và dùng nó làm lễ vật chuộc tội.
  revised_footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con dê mà lá thăm dành cho Yahweh được rút lên.”'
    reason: Giữ cách diễn đạt sát hơn với động từ עָלָה (“đi lên, được rút lên”) trong thành ngữ chỉ việc bắt thăm.
  revision_rationale: Chỉ sửa “đã rơi trúng” thành “đã rơi vào” để loại bỏ chỗ thiếu bổ ngữ trong tiếng Việt và phản ánh trực tiếp hơn thành ngữ Hê-bơ-rơ về lá thăm rơi trên con dê. Các thuật ngữ và ý nghĩa nghi lễ còn lại được giữ nguyên.
