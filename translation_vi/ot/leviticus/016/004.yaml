source:
  edition: WLC
  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: vi
  text: Người phải mặc chiếc áo trong thánh bằng vải lanh[a], và mặc quần lót bằng vải lanh sát thân; người phải thắt đai bằng vải lanh quanh mình và quấn khăn đội đầu bằng vải lanh. Đó là những lễ phục thánh. Người phải rửa thân thể bằng nước[b], rồi mặc các lễ phục ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chiếc áo trong bằng vải lanh dùng cho việc thánh.”'
    reason: Cụm từ Hê-bơ-rơ có thể được diễn đạt theo quan hệ phẩm chất hoặc công dụng; cả hai đều chỉ y phục được biệt riêng cho nghi lễ.
  - marker: b
    text: 'Nguyên văn: “rửa da thịt mình bằng nước.”'
    reason: Ghi lại cách nói sát nguyên văn của בשר, trong khi chính văn dùng lối diễn đạt tiếng Việt tự nhiên hơn.
lexical_decisions:
- source_word: כְּתֹנֶת
  choice: áo trong
  rationale: Chỉ chiếc áo mặc bên trong của tư tế. “Áo trong” truyền đạt công dụng rõ ràng và tránh khiến “áo dài” bị hiểu là trang phục truyền thống Việt Nam.
- source_word: בַּד
  choice: vải lanh
  rationale: Trong ngữ cảnh lễ phục tư tế, từ này chỉ loại vải lanh; cách gọi này chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: קֹדֶשׁ
  choice: thánh
  rationale: Giữ sắc thái được biệt riêng cho việc phụng sự trong nơi thánh, đồng thời nhất quán với ngôn ngữ Kinh Thánh tiếng Việt.
- source_word: מִכְנְסֵי בַד
  choice: quần lót bằng vải lanh
  rationale: Chỉ y phục che phần dưới cơ thể và mặc sát da; “quần lót” là cách diễn đạt hiện đại, trực tiếp hơn các từ cổ.
- source_word: עַל בְּשָׂרוֹ
  choice: sát thân
  rationale: Diễn đạt tự nhiên việc y phục nằm trực tiếp trên da thịt, không gán cho בשר sắc thái thần học không có trong ngữ cảnh.
- source_word: אַבְנֵט
  choice: đai
  rationale: Chỉ dải vải quấn quanh thân trong lễ phục tư tế; “đai” trang trọng và phù hợp hơn “thắt lưng” thông thường.
- source_word: מִצְנֶפֶת
  choice: khăn
  rationale: Chỉ khăn đội đầu được quấn lại; động từ đi kèm làm rõ hình thức, nên “khăn” tự nhiên hơn một thuật ngữ vay mượn.
- source_word: יִצְנֹף
  choice: quấn ... trên đầu
  rationale: Giữ nét nghĩa quấn hoặc cuốn khăn đội đầu, thay vì chỉ nói chung là đội.
- source_word: בִּגְדֵי קֹדֶשׁ
  choice: lễ phục thánh
  rationale: Vừa giữ lời khẳng định các y phục là thánh, vừa cho thấy đây là y phục dành cho nghi lễ tư tế.
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ
  choice: lấy nước tắm rửa thân thể
  rationale: Truyền đạt tự nhiên hành động thanh tẩy toàn thân bằng nước; “thân thể” phù hợp ngữ cảnh hơn cách dịch sát là “da thịt”.
- source_word: וּלְבֵשָׁם
  choice: rồi mặc các lễ phục ấy
  rationale: Đại từ số nhiều trở lại toàn bộ các lễ phục vừa kể; “rồi” thể hiện trình tự tắm rửa trước khi mặc vốn được chuỗi động từ trong ngữ cảnh biểu đạt.
theological_decisions:
- issue: Tính thánh của lễ phục
  choice: Dịch là “lễ phục thánh”, hiểu là các y phục được biệt riêng cho việc phụng sự tư tế.
  alternative: “lễ phục thiêng liêng” hoặc “lễ phục dùng cho việc thánh”
  rationale: Bản văn trực tiếp gọi các y phục là thánh nhưng không giải thích thêm biểu tượng thần học; bản dịch giữ nguyên lời khẳng định mà không khai triển giáo lý ngoài câu.
- issue: Cách hiểu בשר trong yêu cầu thanh tẩy
  choice: Dùng “thân” và “thân thể” theo nghĩa cơ thể cụ thể.
  alternative: “da thịt”
  rationale: Trong câu này, בשר nói đến cơ thể tiếp xúc với y phục và nước, không nhất thiết mang nghĩa thần học đối lập với thần linh; cách dịch tự nhiên tránh tạo hàm ý ngoài văn cảnh.
- issue: Trình tự tắm rửa và mặc lễ phục
  choice: Dùng “rồi” để cho thấy người ấy tắm rửa trước, sau đó mặc lễ phục.
  alternative: Nối bằng “và” mà không nêu rõ trình tự
  rationale: Chuỗi mệnh lệnh và nội dung nghi lễ cho thấy hành động tắm rửa đi trước việc mặc; “rồi” diễn đạt trình tự hàm chứa mà không thêm ý nghĩa giáo lý.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cấu trúc mệnh lệnh “phải” phù hợp luật nghi lễ. Tránh từ quá cổ và tránh để “áo dài” gợi nhầm trang phục truyền thống Việt Nam. Các thuật ngữ “vải lanh”, “đai”, “lễ phục thánh” rõ nghĩa đối với độc giả phổ thông.
