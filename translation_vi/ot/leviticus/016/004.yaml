  to: Người phải mặc chiếc áo trong thánh bằng vải lanh[a], và mặc quần lót bằng vải lanh sát thân; người phải thắt đai bằng vải lanh quanh mình và quấn khăn đội đầu bằng vải lanh. Đó là những lễ phục thánh. Người phải rửa thân thể bằng nước[b], rồi mặc các lễ phục ấy.
