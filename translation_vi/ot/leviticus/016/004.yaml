  source_fidelity: Bản dịch truyền đạt đúng các y phục bằng vải lanh, tính thánh của chúng, việc chúng được mặc trực tiếp trên thân thể, và trình tự rửa thân thể rồi mặc y phục. Tuy nhiên, “lấy nước tắm rửa” diễn đạt rộng hơn động từ רָחַץ (“rửa”) và kém sát hơn cách nói trực tiếp “rửa thân thể bằng nước”. “Khăn đội đầu” cũng xác định rõ hơn מִצְנֶפֶת là khăn quấn dùng để đội đầu.
  naturalness: Văn phong nhìn chung trang trọng, hiện đại và dễ hiểu. “Rửa thân thể bằng nước” tự nhiên, gọn và phù hợp hơn “lấy nước tắm rửa thân thể”. “Khăn đội đầu” tránh khả năng hiểu “khăn ... trên đầu” như một chiếc khăn chỉ được đặt trên đầu, trong khi động từ Hê-bơ-rơ nhấn mạnh việc quấn.
  terminology: “Áo trong”, “vải lanh”, “đai”, và “thánh” phù hợp ngữ cảnh lễ phục tư tế. “Quần lót” là một cách gọi hiện đại cho y phục mặc sát thân; trong câu này không mang sắc thái suồng sã. Giữ “lễ phục thánh” là cách diễn đạt rõ nghĩa cho בִּגְדֵי קֹדֶשׁ, dù “y phục thánh” cũng có thể dùng.
