revisions:
- from: 'Đây sẽ là một quy định vĩnh viễn cho các ngươi: mỗi năm một lần phải làm lễ chuộc tội cho con cái Israel[a] vì mọi tội lỗi của họ.[b] Ông đã làm đúng như Yahweh truyền cho Môi-se.'
  to: Đây sẽ là một quy định vĩnh viễn cho các ngươi, để chuộc tội cho con cái Israel[a] khỏi mọi tội lỗi của họ[b], mỗi năm một lần. Ông đã làm đúng như Yahweh truyền cho Môi-se.
  rationale: Bản sửa loại bỏ yếu tố mệnh lệnh không có trong nguyên văn, chuyển cách dịch chính của מִכָּל sang “khỏi” để phản ánh sắc thái thanh tẩy, và bảo lưu cách hiểu nhân quả trong chú thích. Các danh xưng, thuật ngữ nghi lễ, tính mơ hồ của chủ ngữ “Ông”, và hai neo chú thích đều được giữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:17Z'
review_pass:
  verdict: revise
  source_fidelity: Cần bỏ “phải”, vì nguyên văn dùng mệnh đề mục đích (“để chuộc tội”) chứ không nêu trực tiếp một mệnh lệnh bằng động từ tình thái. Giới từ מִן trong cụm “khỏi mọi tội lỗi của họ” có thể diễn tả kết quả thanh tẩy; cách dịch này phản ánh sắc thái đó tốt hơn “vì”.
  naturalness: Bản sửa giữ văn phong trang trọng, hiện đại. “Mỗi năm một lần” là cách nói tự nhiên; việc đặt nó ở cuối mệnh đề mục đích sát trật tự và phạm vi của tiếng Hê-bơ-rơ hơn. “Ông đã làm” tiếp tục bảo lưu chủ ngữ số ít không được nêu tên.
  terminology: Giữ “Yahweh”, “Môi-se”, “con cái Israel”, và “chuộc tội” nhất quán với các lựa chọn thuật ngữ của bản thảo. “Quy định vĩnh viễn” phù hợp cho חֻקַּת עוֹלָם.
  issues:
