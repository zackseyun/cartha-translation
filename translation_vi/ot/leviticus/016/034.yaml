    rationale: Đặt [b] ngay sau “mọi tội lỗi của họ” giúp người đọc hiểu chú thích liên quan đến cách dịch מִכָּל חַטֹּאתָם, thay vì có thể hiểu là liên quan đến toàn câu hoặc tần suất hằng năm.
