  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: vi
  text: Đây sẽ là một quy định vĩnh viễn cho các ngươi, để chuộc tội cho con cái Israel[a] khỏi mọi tội lỗi của họ[b], mỗi năm một lần. Ông đã làm đúng như Yahweh truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Israel” hoặc “người Israel”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “vì mọi tội lỗi của họ”, theo sắc thái nguyên nhân của cách diễn đạt Hê-bơ-rơ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם
  choice: Đây sẽ là ... cho các ngươi
  rationale: Giữ sắc thái pháp quy hướng tới tương lai của mệnh đề Hê-bơ-rơ, đồng thời dùng cách diễn đạt rõ ràng trong tiếng Việt hiện đại.
- source_word: לְחֻקַּת עוֹלָם
  choice: một quy định vĩnh viễn
  rationale: חֻקָּה chỉ điều lệ hay quy định cố định; עוֹלָם diễn tả tính lâu dài, thường trực trong khuôn khổ giao ước.
- source_word: לְכַפֵּר
  choice: làm lễ chuộc tội
  rationale: Trong bối cảnh nghi lễ tế lễ của Lê-vi Ký 16, cụm này diễn tả hành động chuộc tội; thêm “lễ” giúp người đọc nhận ra bối cảnh nghi thức mà không thay đổi ý chính.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: cho con cái Israel
  rationale: Giữ hình thức danh xưng tập thể sát với cụm Hê-bơ-rơ “con cái Israel”; các cách nói tự nhiên hơn được ghi ở chú thích.
- source_word: מִכָּל חַטֹּאתָם
  choice: vì mọi tội lỗi của họ
  rationale: Diễn đạt tự nhiên quan hệ giữa việc chuộc tội và toàn bộ tội lỗi của dân; giới từ מִן cũng có thể làm nổi bật ý được thanh tẩy khỏi tội, nên phương án đó được bảo lưu trong chú thích.
- source_word: אַחַת בַּשָּׁנָה
  choice: mỗi năm một lần
  rationale: Đây là cách nói tiếng Việt tự nhiên, chính xác về việc nghi lễ được lặp lại hằng năm.
- source_word: וַיַּעַשׂ
  choice: Ông đã làm
  rationale: Động từ số ít không nêu chủ ngữ; đại từ “ông” giữ cho chủ thể không bị gọi đích danh, dù ngữ cảnh gần nhất hướng đến A-rôn.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh truyền cho Môi-se
  rationale: Chuyển đạt thành ngữ kể chuyện Hê-bơ-rơ một cách tự nhiên và giữ nguyên danh riêng giao ước יהוה dưới dạng Yahweh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh giao ước יהוה; “Yahweh” bảo lưu danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của כפר trong nghi lễ Ngày Chuộc Tội
  choice: làm lễ chuộc tội
  alternative: thanh tẩy; xóa tội
  rationale: “Chuộc tội” giữ được thuật ngữ thần học-nghi lễ trung tâm mà không thu hẹp từ này chỉ còn một khía cạnh; sắc thái thanh tẩy liên quan đến giới từ מִן được ghi nhận ở chú thích.
- issue: Chủ thể của וַיַּעַשׂ
  choice: 'không nêu đích danh: “Ông”'
  alternative: A-rôn đã làm; Môi-se đã làm
  rationale: Hê-bơ-rơ chỉ dùng động từ ngôi thứ ba số ít. Ngữ cảnh có thể khiến người đọc hiểu là A-rôn, nhưng câu này không nêu tên, nên bản dịch không tự ý giải quyết hoàn toàn điều còn hàm ẩn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp lời kết của một điều luật nghi lễ. Dùng “các ngươi” để phản ánh lời phán với cộng đồng số nhiều; giữ “con cái Israel” trong câu chính và cung cấp cách nói thuần Việt hơn ở chú thích. Tất cả dấu chú thích [a], [b] đều xuất hiện trong chính văn.
