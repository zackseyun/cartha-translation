id: LEV.16.12
reference: Leviticus 16:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: vi
  text: Ông phải lấy một lư đầy than hồng từ trên bàn thờ trước mặt Yahweh, cùng hai vốc đầy hương liệu thơm đã nghiền mịn, rồi đem vào phía sau bức màn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào phía trong bức màn.” Cụm từ Hê-bơ-rơ chỉ khu vực ở phía sau bức màn, tức khu thánh bên trong.'
    reason: Cụm מִבֵּית לַפָּרֹכֶת có cấu trúc không gian cô đọng; chú thích nêu cách diễn đạt thay thế và làm rõ đích đến phía sau bức màn.
lexical_decisions:
- source_word: וְלָקַח
  choice: Ông phải lấy
  rationale: Trong chuỗi chỉ dẫn nghi lễ, dạng động từ này mang sắc thái mệnh lệnh/quy định; “phải lấy” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מְלֹא הַמַּחְתָּה
  choice: một lư đầy
  rationale: Giữ cả vật chứa lẫn lượng chứa đầy. “Lư” phù hợp với dụng cụ dùng để mang than trong nghi lễ, còn văn cảnh cho biết đây chưa phải là hương đang cháy.
- source_word: גַּחֲלֵי אֵשׁ
  choice: than hồng
  rationale: Diễn đạt tự nhiên những cục than đang cháy/nóng mà cụm Hê-bơ-rơ “than của lửa” chỉ đến.
- source_word: מֵעַל הַמִּזְבֵּחַ מִלִּפְנֵי יְהוָה
  choice: từ trên bàn thờ trước mặt Yahweh
  rationale: 'Bảo toàn chi tiết không gian: than được lấy từ trên bàn thờ, và bàn thờ ở trước mặt Yahweh.'
- source_word: וּמְלֹא חָפְנָיו
  choice: cùng hai vốc đầy
  rationale: Danh từ ở dạng đôi chỉ hai bàn tay khum lại; “hai vốc đầy” chuyển tải tự nhiên cả cách đong lẫn lượng hương.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: hương liệu thơm đã nghiền mịn
  rationale: Thể hiện đây là hỗn hợp hương từ các chất thơm và giữ chi tiết דַּקָּה là được nghiền nhỏ/mịn.
- source_word: וְהֵבִיא מִבֵּית לַפָּרֹכֶת
  choice: rồi đem vào bên trong bức màn
  rationale: Cụm từ cô đọng chỉ chuyển động vào khu vực phía sau bức màn; cách dịch này rõ ràng mà không gọi tên khu vực bằng một thuật ngữ thần học không có trực tiếp trong câu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước יהוה thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; “Yahweh” bảo toàn chức năng danh riêng và không thay nó bằng tước hiệu.
- issue: Đích đến phía sau bức màn
  choice: bên trong bức màn
  alternative: vào Nơi Chí Thánh
  rationale: Câu chỉ nêu quan hệ không gian với bức màn. Không bổ sung tên gọi “Nơi Chí Thánh” giúp tránh diễn giải vượt quá lời văn, dù văn cảnh cho thấy đó là khu vực thánh bên trong.
translation_notes:
  register: Văn phong quy định nghi lễ, trang trọng nhưng dễ hiểu. Dùng “ông” để nối với chủ thể là thầy tế lễ thượng phẩm trong văn cảnh; dùng “hai vốc đầy” thay cho lối dịch sát chữ nhưng gượng “độ đầy của hai bàn tay”.
