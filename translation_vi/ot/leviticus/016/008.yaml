  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: vi
  text: 'A-rôn sẽ bắt thăm cho hai con dê: một thăm dành cho Đức Giê-hô-va, và một thăm dành cho A-xa-xên.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thăm dành cho con dê gánh tội.” Nghĩa của từ Hê-bơ-rơ “A-xa-xên” còn có tranh luận; từ này có thể được hiểu là một tên riêng, chức năng của con dê, hoặc một thuật ngữ liên quan đến việc loại bỏ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: sẽ bắt thăm
  rationale: Động từ có nghĩa đen là “đặt/trao”, nhưng khi đi với גּוֹרָלוֹת và עַל, cụm này diễn tả nghi thức dùng thăm để phân định. “Bắt thăm” là cách nói tự nhiên trong tiếng Việt.
- source_word: עַל שְׁנֵי הַשְּׂעִירִם
  choice: cho hai con dê
  rationale: עַל có nghĩa cơ bản là “trên”, nhưng trong tiếng Việt, “bắt thăm trên hai con dê” không tự nhiên và dễ gợi hành động đặt vật lên lưng dê. “Cho hai con dê” truyền đạt đúng quan hệ phân định bằng thăm.
- source_word: גּוֹרָלוֹת / גּוֹרָל אֶחָד
  choice: thăm / một thăm
  rationale: “Thăm” là từ tiếng Việt thông dụng chỉ vật hoặc kết quả dùng trong việc bắt thăm; việc lặp lại “một thăm” giữ cấu trúc nghi lễ của câu Hê-bơ-rơ.
- source_word: לַיהוָה
  choice: dành cho Đức Giê-hô-va
  rationale: Giới từ לְ biểu thị sự chỉ định của lá thăm. “Dành cho” tự nhiên và rõ nghĩa; danh xưng giao ước được thể hiện bằng cách phiên âm quen thuộc “Đức Giê-hô-va” trong tiếng Việt.
- source_word: לַעֲזָאזֵל
  choice: dành cho A-xa-xên
  rationale: עֲזָאזֵל là thuật ngữ còn tranh luận. Phiên âm như một tên riêng trong chính văn giữ nguyên tính mơ hồ, thay vì quyết định rằng từ này chỉ con dê, sự loại bỏ, địa điểm hay một hữu thể.
theological_decisions:
- issue: Ý nghĩa của עֲזָאזֵל trong nghi lễ Ngày Chuộc Tội
  choice: Giữ dưới dạng tên phiên âm “A-xa-xên” trong chính văn
  alternative: “con dê gánh tội”, “sự loại bỏ hoàn toàn”, hoặc một hữu thể/địa điểm trong hoang mạc
  rationale: Bản thân câu không xác định dứt khoát từ này nói đến chức năng của con dê, nơi nó được đưa đến hay một hữu thể mang tên riêng. Phiên âm giúp bảo toàn sự căng thẳng và mơ hồ của nguyên văn; cách hiểu truyền thống “con dê gánh tội” được ghi ở chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Dùng “bắt thăm” theo lối nói tự nhiên của tiếng Việt; giữ nhịp song song “một thăm... và một thăm...”. Phiên âm A-rôn và A-xa-xên theo âm tiết tiếng Việt.
