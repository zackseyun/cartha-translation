language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: vi
  text: Rồi ông phải giết con dê dùng làm lễ chuộc tội cho dân chúng, đem huyết nó vào phía sau bức màn, làm với huyết nó như ông đã làm với huyết bò đực, và rảy huyết ấy trên nắp chuộc tội[a] và trước nắp chuộc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách dịch truyền thống: “nắp thi ân.”'
    reason: Ghi nhận cách dịch truyền thống của כַּפֹּרֶת, trong khi chính văn giữ cách dịch nêu rõ đây là chiếc nắp dùng trong nghi thức chuộc tội.
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Rồi ông phải giết
  rationale: Động từ chỉ việc giết con vật trong nghi lễ. “Rồi” thể hiện trình tự do liên từ waw dẫn vào, còn “phải” phù hợp với lời chỉ dẫn nghi lễ trong ngữ cảnh luật pháp.
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  choice: con dê làm lễ vật chuộc tội cho dân chúng
  rationale: Diễn đạt tự nhiên quan hệ cấu tạo trong tiếng Hê-bơ-rơ và cho thấy con dê này được dâng thay cho dân chúng, đối lập với con bò đực dành cho A-rôn.
- source_word: וְהֵבִיא אֶת דָּמוֹ אֶל מִבֵּית לַפָּרֹכֶת
  choice: đem huyết nó vào phía trong bức màn
  rationale: Động từ hiphil của בוא mang nghĩa đem vào; cụm chỉ nơi chốn nói đến khu vực ở phía trong, tức phía sau bức màn.
- source_word: וְעָשָׂה אֶת דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: thực hiện với huyết nó như đã thực hiện với huyết con bò đực
  rationale: Giữ nét diễn đạt hơi tỉnh lược của nguyên văn nhưng vẫn rõ rằng cùng một nghi thức phải được làm với cả hai loại huyết.
- source_word: וְהִזָּה אֹתוֹ
  choice: ông phải rảy huyết ấy
  rationale: נזה trong văn cảnh tế lễ chỉ động tác rảy huyết. Lặp lại “huyết ấy” giúp đại từ chỉ đối tượng rõ ràng trong tiếng Việt.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Thuật ngữ chỉ nắp bằng vàng của Hòm Giao Ước và có liên hệ từ vựng với ý niệm chuộc tội. Cách dịch này vừa nêu được vật thể vừa giữ chức năng nghi lễ; cách dịch truyền thống được ghi ở chú thích.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: và phía trước nắp đó
  rationale: לִפְנֵי xác định vị trí ở phía trước, phân biệt với việc rảy “trên” nắp. “Nắp đó” tránh lặp nặng mà vẫn có cùng sở chỉ.
theological_decisions:
- issue: Cách dịch כַּפֹּרֶת
  choice: nắp chuộc tội
  alternative: ngai thương xót
  rationale: Nguyên ngữ trước hết chỉ chiếc nắp của Hòm Giao Ước trong nghi thức Ngày Chuộc Tội. “Nắp chuộc tội” làm rõ vật thể và giữ mối liên hệ với gốc כפר, trong khi “ngai thương xót” là cách dịch truyền thống có giá trị nhưng dễ khiến người đọc hình dung một chiếc ngai riêng biệt.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; giữ thuật ngữ nghi lễ “huyết” thay vì “máu” để phù hợp văn cảnh tế lễ. Đại từ “ông” tiếp nối chủ thể thầy tế lễ thượng phẩm trong ngữ cảnh. Hai lần xuất hiện của כַּפֹּרֶת được hiểu nhất quán là cùng một vật thể.
