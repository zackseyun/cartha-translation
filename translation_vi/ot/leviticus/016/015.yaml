revisions:
- from: 'Rồi ông phải giết con dê làm lễ vật chuộc tội cho dân chúng, đem huyết nó vào phía trong bức màn, và thực hiện với huyết nó như đã thực hiện với huyết con bò đực: ông phải rảy huyết ấy trên nắp chuộc tội[a] và phía trước nắp đó.'
  to: Rồi ông phải giết con dê dùng làm lễ chuộc tội cho dân chúng, đem huyết nó vào phía sau bức màn, làm với huyết nó như ông đã làm với huyết bò đực, và rảy huyết ấy trên nắp chuộc tội[a] và trước nắp chuộc tội.
  rationale: Bản sửa chỉ làm rõ thành ngữ không gian «phía sau bức màn», cải thiện cú pháp tiếng Việt và chuẩn hóa chú thích truyền thống. Nghĩa nghi lễ, sự lặp lại của כַּפֹּרֶת, và sự phân biệt «trên» với «trước» được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:05Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự nghi lễ, con dê làm lễ chuộc tội cho dân, việc đem huyết vào phía trong/sau bức màn, sự tương ứng với huyết bò đực, và hai vị trí rảy huyết trên và trước כַּפֹּרֶת. Tuy nhiên, cách nói về vị trí nên rõ hơn là khu vực phía sau bức màn, và động từ «thực hiện» cần có chủ thể rõ ràng hơn trong tiếng Việt.
  naturalness: «Đem huyết nó vào phía trong bức màn» và nhất là «thực hiện với huyết nó như đã thực hiện» hơi gượng, đồng thời dạng bị động vô nhân xưng làm mờ chủ thể. «Đem ... vào phía sau bức màn» và «làm ... như ông đã làm» tự nhiên, rõ nghĩa, vẫn sát nguyên văn.
  terminology: «Huyết», «lễ chuộc tội», và «nắp chuộc tội» phù hợp văn cảnh tế tự và tiếng Việt hiện đại. Chú thích cho cách dịch truyền thống nên dùng cách gọi Việt ngữ đã phổ biến là «nắp thi ân», thay vì «ngai thương xót», vì כַּפֹּרֶת trước hết là nắp Hòm Giao Ước chứ không phải một chiếc ngai.
  issues:
  - severity: low
    issue: Cụm chỉ vị trí «vào phía trong bức màn» chưa tự nhiên và có thể bị hiểu là vào trong chính tấm màn.
    rationale: מִבֵּית לַפָּרֹכֶת chỉ không gian ở phía trong, tức phía sau bức màn. «Vào phía sau bức màn» diễn đạt tự nhiên và chính xác hơn trong ngữ cảnh nghi lễ.
  - severity: low
    issue: «Thực hiện với huyết nó như đã thực hiện» mơ hồ chủ thể và không tự nhiên.
    rationale: Câu Hê-bơ-rơ tỉnh lược nhưng chủ thể vẫn là vị thầy tế lễ. Thêm «ông» trong mệnh đề so sánh làm rõ mà không thêm nghĩa.
  - severity: medium
    issue: Chú thích «ngai thương xót» không phải cách gọi truyền thống thông dụng và làm yếu nghĩa vật thể của thuật ngữ.
    rationale: Cách gọi truyền thống Việt ngữ cho kapporet thường là «nắp thi ân». Chú thích này vừa cung cấp tương đương truyền thống vừa không biến vật thể thành một chiếc ngai trong chính văn.
