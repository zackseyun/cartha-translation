source:
  edition: WLC
  text: וְ/נָשָׂ֨א הַ/שָּׂעִ֥יר עָלָ֛י/ו אֶת כָּל עֲוֺנֹתָ֖/ם אֶל אֶ֣רֶץ גְּזֵרָ֑ה וְ/שִׁלַּ֥ח אֶת הַ/שָּׂעִ֖יר בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: vi
  text: Con dê sẽ mang trên mình mọi tội lỗi của họ đến một vùng đất biệt lập[a]; rồi người ấy sẽ thả con dê vào hoang mạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một vùng đất cô quạnh”, “một vùng đất không thể đến được” hoặc “một vùng đất hoang vu”. Từ Hê-bơ-rơ có lẽ chỉ một nơi bị tách biệt, xa khu dân cư.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: sẽ mang
  rationale: 'Giữ hình ảnh cụ thể của động từ נשׂא: con dê mang tội lỗi đi, đồng thời là cách diễn đạt tự nhiên trong tiếng Việt.'
- source_word: הַשָּׂעִיר
  choice: con dê
  rationale: שָׂעִיר ở đây chỉ con dê đực dùng trong nghi lễ; ngữ cảnh đã xác định con vật nên cách dịch gọn này tự nhiên và đầy đủ.
- source_word: עָלָיו
  choice: trên mình
  rationale: Diễn đạt rõ rằng các tội lỗi được đặt trên chính con dê, không làm mất hình ảnh chuyển giao của nguyên văn.
- source_word: כָּל עֲוֺנֹתָם
  choice: mọi tội lỗi của họ
  rationale: עָוֹן có thể bao hàm sự gian ác, tội lỗi và hậu quả tội; “tội lỗi” là cách nói hiện đại, trang trọng và phù hợp ngữ cảnh nghi lễ.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: đến một vùng đất biệt lập
  rationale: גְּזֵרָה khó xác định chính xác nhưng có ý niệm bị tách lìa, cô lập. “Vùng đất biệt lập” giữ được ý chính mà vẫn tự nhiên trong tiếng Việt; các khả năng khác được ghi ở chú thích.
- source_word: וְשִׁלַּח
  choice: rồi người ấy sẽ thả
  rationale: Trong nghi thức này, שׁלח nói đến việc cho con dê đi khỏi cộng đồng. “Thả” tự nhiên hơn “sai đi” đối với một con vật và vẫn giữ hành động chủ ý.
- source_word: בַּמִּדְבָּר
  choice: vào hoang mạc
  rationale: מִדְבָּר chỉ miền hoang vu, thảo nguyên khô cằn hoặc sa mạc. “Hoang mạc” phù hợp văn cảnh và không giới hạn nghĩa vào vùng toàn cát.
theological_decisions:
- issue: Hình ảnh con dê mang tội lỗi
  choice: Giữ cách nói cụ thể rằng con dê mang mọi tội lỗi trên mình.
  alternative: Diễn giải thành “cất tội lỗi của họ đi”.
  rationale: Nguyên văn mô tả việc chuyển giao và loại bỏ bằng hình ảnh nghi lễ cụ thể. Bản dịch không nên thay hình ảnh ấy bằng một kết luận thần học khái quát.
- issue: Ý nghĩa của אֶרֶץ גְּזֵרָה
  choice: Dịch là “một vùng đất biệt lập” và ghi các khả năng khác trong chú thích.
  alternative: Dịch dứt khoát là “vùng đất hoang vu” hoặc “vùng đất không thể đến được”.
  rationale: Cụm từ Hê-bơ-rơ có sự bất định từ vựng. Cách dịch chính giữ ý tách biệt mà không giải quyết quá mức bản chất địa hình hay khả năng tiếp cận nơi ấy.
- issue: Chủ thể của וְשִׁלַּח
  choice: Dùng “người ấy”, quy chiếu về người được giao nhiệm vụ trong câu trước.
  alternative: Dùng chủ thể không xác định “người ta” hoặc lược bỏ chủ thể.
  rationale: Động từ ở ngôi thứ ba số ít giống đực; văn cảnh gần nhất là người đã được chỉ định đem con dê đi. “Người ấy” giữ liên kết văn mạch mà không thêm danh tính.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ hình ảnh nghi lễ cụ thể và sự bất định của cụm אֶרֶץ גְּזֵרָה; dùng “hoang mạc” thay vì cách nói cổ hoặc quá chuyên biệt.
