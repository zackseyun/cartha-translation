source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: vi
  text: Nhưng con dê mà lá thăm dành cho A-xa-xên rơi vào phải được trình diện trước mặt Đức Giê-hô-va khi còn sống, để cử hành nghi thức chuộc tội trên nó, rồi thả nó vào hoang mạc cho A-xa-xên.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “dành cho con dê bị đuổi đi.” Thuật ngữ Hê-bơ-rơ “A-xa-xên” còn gây tranh luận; nó có thể là một tên riêng hoặc một từ gắn với ý niệm loại bỏ.
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “để cử hành nghi thức chuộc tội cho nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: Nhưng con dê
  rationale: Danh từ שָׂעִיר chỉ con dê, thường là dê đực; trong ngữ cảnh nghi lễ, “con dê” tự nhiên và đủ rõ. Liên từ được dịch là “Nhưng” để nêu sự tương phản với con dê kia.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: bắt thăm trúng phần
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ về lá thăm rơi vào con dê bằng cách nói tự nhiên trong tiếng Việt, vẫn giữ ý con dê được chọn qua việc bắt thăm.
- source_word: לַעֲזָאזֵל
  choice: dành cho A-xa-xên
  rationale: עֲזָאזֵל có nghĩa còn tranh luận. Phiên âm tên này trong chính văn giúp tránh quyết định trước rằng nó chỉ một hữu thể, một nơi chốn, con dê bị đuổi đi hay sự loại bỏ hoàn toàn.
- source_word: יָעֳמַד חַי
  choice: phải được đặt còn sống
  rationale: Thể Hophal mang sắc thái khiến cho hoặc đặt cho đứng; cách dịch này giữ thể bị động và nhấn mạnh rằng con dê vẫn sống, đồng thời tự nhiên hơn lối dịch sát chữ “bị làm cho đứng”.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: “Trước mặt” phản ánh לִפְנֵי trong bối cảnh trình dâng nghi lễ. Danh riêng giao ước יהוה được thể hiện bằng cách gọi quen thuộc và dễ hiểu trong tiếng Việt là “Đức Giê-hô-va”.
- source_word: לְכַפֵּר עָלָיו
  choice: để làm lễ chuộc tội trên nó
  rationale: “Làm lễ chuộc tội” truyền đạt chức năng nghi lễ của כפר; “trên nó” giữ lực cơ bản của giới từ עַל và không quyết định rằng con dê là đối tượng được hưởng sự chuộc tội hay là vật liên quan đến nghi thức.
- source_word: לְשַׁלַּח אֹתוֹ
  choice: rồi thả nó
  rationale: Động từ diễn tả việc sai đi hoặc thả đi. “Thả nó” tự nhiên trong tiếng Việt và phù hợp với việc đưa con dê ra khỏi cộng đồng.
- source_word: הַמִּדְבָּרָה
  choice: vào hoang mạc
  rationale: Hậu tố chỉ hướng được thể hiện bằng “vào”; “hoang mạc” diễn đạt vùng hoang vu ngoài nơi cư trú.
theological_decisions:
- issue: Ý nghĩa của עֲזָאזֵל
  choice: A-xa-xên (phiên âm)
  alternative: con dê bị đuổi đi; sự loại bỏ hoàn toàn; một hữu thể hoặc địa điểm trong hoang mạc
  rationale: Nguồn Hê-bơ-rơ không giải quyết dứt khoát cách hiểu thuật ngữ này. Phiên âm trong chính văn bảo tồn sự mơ hồ và tránh đưa một cách giải thích thần học vào bản dịch.
- issue: Lực của לְכַפֵּר עָלָיו
  choice: làm lễ chuộc tội trên nó
  alternative: làm lễ chuộc tội cho nó
  rationale: Giữ “trên” cho עַל để không xác định quá mức con dê là đối tượng được chuộc tội hay vật mà nghi thức được thực hiện trên đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bắt thăm trúng phần” theo cách nói tự nhiên của tiếng Việt; giữ “A-xa-xên” và cụm “trên nó” để bảo tồn các điểm mơ hồ thực sự của nguyên văn.
