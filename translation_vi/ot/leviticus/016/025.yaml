source:
  edition: WLC
  text: וְ/אֵ֛ת חֵ֥לֶב הַֽ/חַטָּ֖את יַקְטִ֥יר הַ/מִּזְבֵּֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: vi
  text: Ông phải thiêu mỡ của lễ chuộc tội trên bàn thờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy”. Từ Hê-bơ-rơ có thể chỉ lễ vật dùng để thanh tẩy khỏi tội lỗi hoặc tình trạng ô uế.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Ông phải
  rationale: Liên từ וְ nối hành động này với trình tự nghi lễ trước đó; trong tiếng Việt, không nhất thiết phải dịch riêng là “và” khi câu vẫn nối tiếp tự nhiên. Dấu chỉ tân ngữ אֵת không có từ tương ứng trực tiếp.
- source_word: חֵלֶב
  choice: mỡ
  rationale: חֵלֶב chỉ phần mỡ dành riêng để dâng trong nghi lễ. “Mỡ” trực tiếp và không thêm mức độ cụ thể mà câu Hê-bơ-rơ không nêu.
- source_word: הַחַטָּאת
  choice: lễ chuộc tội
  rationale: Trong luật tế lễ, חַטָּאת thường chỉ lễ vật liên quan đến tội lỗi và sự thanh tẩy. “Lễ chuộc tội” là cách gọi quen thuộc, dễ hiểu; phương án “lễ thanh tẩy” được giữ trong chú thích để bảo toàn sắc thái chức năng nghi lễ.
- source_word: יַקְטִיר
  choice: thiêu
  rationale: Dạng Hiphil của קטר trong ngữ cảnh tế lễ chỉ việc đốt trên bàn thờ để lễ vật bốc khói. “Thiêu” vừa tự nhiên vừa trang trọng trong tiếng Việt.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Dạng có hậu tố chỉ hướng có thể dịch sát là “đến bàn thờ”, nhưng trong ngữ cảnh thiêu lễ vật, tiếng Việt tự nhiên diễn đạt địa điểm hành động là “trên bàn thờ”.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: Từ Hê-bơ-rơ có thể chỉ lễ vật xử lý tội lỗi hoặc tình trạng ô uế. Bản chính dùng cách gọi quen thuộc “lễ chuộc tội”, đồng thời chú thích “lễ thanh tẩy” để không xóa bỏ sự nhập nhằng và tranh luận về chức năng nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” tiếp nối chủ thể là thầy tế lễ trong ngữ cảnh; “phải” thể hiện sắc thái quy định của động từ chưa hoàn thành trong luật nghi lễ.
