- from: Các con trai A-rôn đem huyết đến cho ông[a]. Ông nhúng ngón tay mình vào huyết, bôi huyết lên các sừng của bàn thờ[b], rồi đổ phần huyết còn lại xuống chân bàn thờ[c].
  to: Các con trai A-rôn đem huyết đến cho ông[a]. Ông nhúng ngón tay mình vào huyết, bôi huyết lên các sừng của bàn thờ[b], rồi đổ huyết tại chân bàn thờ[c].
  rationale: Chỉ bỏ phần diễn giải “còn lại” và thay “xuống chân” bằng “tại chân” để bản dịch không khẳng định điều nguyên văn không phát biểu, đồng thời vẫn giữ ý nghĩa, trình tự nghi lễ, văn phong trang trọng, và các neo chú thích.
