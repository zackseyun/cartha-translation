source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: vi
  text: Các con trai A-rôn đem huyết đến cho ông[a]. Ông nhúng ngón tay mình vào huyết, bôi huyết lên các sừng của bàn thờ[b], rồi đổ huyết tại chân bàn thờ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dâng huyết cho ông”; động từ Hê-bơ-rơ có thể mang nghĩa “đem lại gần” hoặc “dâng trình” trong bối cảnh nghi lễ.'
    reason: lexical_alternative
  - marker: b
    text: “Các sừng của bàn thờ” là những phần nhô lên giống như sừng ở các góc bàn thờ.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “tại nền (hay bệ) bàn thờ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: đem ... đến
  rationale: Dạng Hiphil của קרב có nghĩa là đem lại gần hoặc dâng trình. Trong ngữ cảnh các con trai A-rôn phụ giúp nghi lễ, “đem ... đến” vừa tự nhiên vừa giữ được ý chuyển huyết đến cho A-rôn.
- source_word: בְּנֵי אַהֲרֹן
  choice: các con trai A-rôn
  rationale: Giữ rõ quan hệ gia đình và vai trò của những người đang phụ giúp A-rôn.
- source_word: הַדָּם
  choice: huyết
  rationale: “Huyết” là từ trang trọng, quen thuộc trong văn cảnh tế lễ và chỉ lượng huyết của sinh tế đang được nói đến.
- source_word: אֵלָיו
  choice: đến cho ông
  rationale: Đại từ được giữ dưới dạng đại từ; theo mạch văn, người được nhắc đến tự nhiên nhất là A-rôn.
- source_word: וַיִּטְבֹּל
  choice: nhúng
  rationale: טבל diễn tả việc nhúng vào chất lỏng; “nhúng” phù hợp tự nhiên với hành động đưa ngón tay vào huyết.
- source_word: אֶצְבָּעוֹ
  choice: ngón tay mình
  rationale: Giữ số ít và chỉ rõ ngón tay thuộc về chủ thể A-rôn.
- source_word: וַיִּתֵּן עַל
  choice: bôi ... lên
  rationale: Nghĩa đen là đặt trên, nhưng trong hành động nghi lễ bằng ngón tay, “bôi ... lên” diễn đạt rõ cách huyết được áp vào các sừng bàn thờ.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: các sừng của bàn thờ
  rationale: Giữ hình ảnh thuật ngữ tế lễ của nguyên văn; chú thích giải thích đây là những phần nhô ra ở các góc.
- source_word: יָצַק
  choice: đổ
  rationale: Diễn đạt trực tiếp hành động rót hoặc đổ huyết trong nghi lễ.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: xuống chân bàn thờ
  rationale: יְסוֹד có thể chỉ nền hoặc phần chân. “Xuống chân bàn thờ” tự nhiên trong tiếng Việt và thể hiện hướng אל trong hành động đổ.
theological_decisions:
- issue: Đối tượng quy chiếu của đại từ אֵלָיו
  choice: A-rôn, được diễn đạt bằng “ông”
  alternative: Bàn thờ hoặc một đối tượng ngầm khác
  rationale: Mạch văn đặt A-rôn là người cử hành nghi lễ còn các con trai ông phụ giúp, nên A-rôn là tiền ngữ tự nhiên nhất; bản dịch vẫn giữ đại từ thay vì thay bằng tên riêng.
- issue: Đối tượng ngầm của וַיִּתֵּן
  choice: Nêu rõ “huyết” trong “bôi huyết”
  alternative: Dịch sát cấu trúc là “đặt lên” mà không nêu bổ ngữ
  rationale: Tiếng Hê-bơ-rơ có thể lược đối tượng đã rõ từ ngữ cảnh. Tiếng Việt cần nhắc lại “huyết” để câu rõ và tự nhiên, không làm thay đổi nội dung nghi lễ.
- issue: Quan hệ giữa lượng huyết dùng trên sừng và lượng huyết được đổ
  choice: “phần huyết còn lại”
  alternative: Chỉ lặp lại “huyết” mà không nói “còn lại”
  rationale: 'Mạo từ và trình tự hành động chỉ cùng lượng huyết: một ít được dùng bằng ngón tay, sau đó lượng còn lại được đổ xuống chân bàn thờ. Cách diễn đạt này làm rõ hàm ý ngữ cảnh mà không thêm một nghi thức mới.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyết” nhất quán với ngữ cảnh tế lễ; giữ thuật ngữ hình ảnh “sừng của bàn thờ” và giải thích bằng chú thích. Các dấu chú thích [a], [b], [c] đều xuất hiện ngay tại nội dung tương ứng trong câu.
