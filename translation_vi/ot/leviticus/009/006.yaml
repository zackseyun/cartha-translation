id: LEV.9.6
reference: Leviticus 9:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: vi
  text: 'Môi-se nói: “Đây là điều Đức Yahweh đã truyền anh em phải làm; rồi vinh quang của Đức Yahweh sẽ hiện ra cho anh em.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để vinh quang của Đức Yahweh hiện ra cho anh em.”'
    reason: Cụm וְיֵרָא có thể được hiểu là mệnh đề chỉ mục đích/kết quả, thay vì một lời hứa nối tiếp.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Môi-se nói
  rationale: Động từ với waw nối tiếp thúc đẩy mạch kể. Tiếng Việt không cần dịch máy móc bằng “và”; cách này tự nhiên mà vẫn giữ trình tự tường thuật.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: זֶה הַדָּבָר
  choice: Đây là điều
  rationale: Giữ tính xác định và số ít của cụm Hê-bơ-rơ, đồng thời tự nhiên hơn “đây là sự việc” trong tiếng Việt hiện đại.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Thể hoàn thành chỉ mệnh lệnh đã được ban; “truyền” diễn đạt thẩm quyền trong bối cảnh nghi lễ và giao ước.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Thể hiện danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là dạng quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt.
- source_word: תַּעֲשׂוּ
  choice: anh em phải làm
  rationale: Đại từ số nhiều hướng đến cộng đồng; “phải” làm rõ nội dung mang tính mệnh lệnh mà không biến động từ thành một mệnh lệnh mới tách biệt.
- source_word: וְיֵרָא
  choice: rồi ... sẽ hiện ra
  rationale: Waw cùng dạng chưa hoàn thành có thể diễn tả hệ quả hoặc lời hứa tiếp theo. “Rồi ... sẽ hiện ra” giữ quan hệ nối tiếp trực tiếp và tránh khẳng định quá mức ý nghĩa mục đích.
- source_word: אֲלֵיכֶם
  choice: cho anh em
  rationale: Với động từ “hiện ra”, “cho anh em” diễn đạt tự nhiên những người được chứng kiến sự hiển hiện.
- source_word: כְּבוֹד יְהוָה
  choice: vinh quang của Đức Giê-hô-va
  rationale: Dịch minh bạch kết cấu sở hữu và giữ thuật ngữ Kinh Thánh quen thuộc chỉ sự uy nghi, hiện diện hữu hình của Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu. Dạng “Đức Giê-hô-va” phù hợp văn phong Kinh Thánh tiếng Việt phổ thông; “Yahweh” gần cách phục nguyên học thuật hơn nhưng kém quen thuộc với độc giả thông thường.
- issue: Sắc thái của mệnh đề וְיֵרָא אֲלֵיכֶם כְּבוֹד יְהוָה
  choice: 'kết quả/lời hứa nối tiếp: “rồi vinh quang ... sẽ hiện ra”'
  alternative: 'mục đích hoặc kết quả: “để vinh quang ... hiện ra”'
  rationale: Cấu trúc Hê-bơ-rơ cho phép hiểu là diễn tiến hay kết quả sau khi thi hành mệnh lệnh, nhưng cũng có thể mang sắc thái mục đích. Bản chính giữ cách nối tiếp trực tiếp; chú thích bảo tồn cách hiểu còn lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ nhóm người được Môi-se nói với; dấu chấm phẩy giúp thể hiện rõ hai mệnh đề có quan hệ chặt chẽ. Mọi dấu chú thích đều xuất hiện trong bản văn.
