source:
  edition: WLC
  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: vi
  text: A-rôn đưa qua lại các phần ức và đùi phải trước mặt Yahweh, làm lễ vật đưa qua lại, đúng như Môi-se đã truyền.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: các phần ức
  rationale: Trong ngữ cảnh tế lễ, חָזֶה chỉ phần ức của con vật được dành riêng theo nghi thức; số nhiều được giữ bằng “các phần ức”.
- source_word: שׁוֹק הַיָּמִין
  choice: đùi phải
  rationale: שׁוֹק chỉ phần chân hoặc đùi; “đùi phải” là cách gọi tự nhiên và phù hợp với thuật ngữ tế lễ trong tiếng Việt.
- source_word: הֵנִיף
  choice: đưa qua đưa lại
  rationale: Dạng Hiphil của נוּף mô tả động tác nghi lễ đưa lễ vật trước mặt Đức Chúa Trời; cách dịch này diễn đạt hành động cụ thể mà không giải thích quá mức.
- source_word: תְּנוּפָה
  choice: lễ vật đưa qua đưa lại
  rationale: Danh từ kỹ thuật chỉ lễ vật được trình dâng bằng động tác đưa qua đưa lại; cách dịch duy trì liên hệ từ vựng với động từ הֵנִיף.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי có nghĩa là “trước mặt, trong sự hiện diện của”; danh riêng giao ước יהוה được chuyển tự là “Yahweh” theo lớp tham chiếu đã cung cấp.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: đúng như Môi-se đã truyền
  rationale: Mệnh đề nhấn mạnh A-rôn làm đúng theo mệnh lệnh Môi-se đã ban trước đó.
- source_word: וְאֵת ... וְאֵת
  choice: các phần ức và đùi phải
  rationale: Hai dấu hiệu tân ngữ phối hợp hai thành phần; tiếng Việt diễn đạt tự nhiên bằng liên từ “và”.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn tính chất danh riêng và phù hợp với quyết định thần học của lớp tham chiếu tiếng Anh.
- issue: Bản chất của תְּנוּפָה
  choice: lễ vật đưa qua đưa lại
  alternative: lễ vật dâng đưa; lễ vật nâng lên
  rationale: Từ ngữ chỉ một cách trình dâng mang tính nghi lễ, nhưng hướng chuyển động chính xác không được câu này giải thích. Cách dịch không đồng nhất nghi thức với việc chỉ nâng lễ vật lên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phần ức” để làm rõ đây là phần thịt tế lễ, đồng thời lặp “đưa qua đưa lại” nhằm giữ mối liên hệ giữa động từ và danh từ cùng gốc trong nguyên văn.
