revisions:
- from: Còn mỡ, hai quả thận và phần phụ của gan lấy từ lễ vật chuộc tội[a], ông thiêu cho bốc khói trên bàn thờ, đúng như Yahweh đã truyền cho Môi-se.
  to: Còn mỡ, hai quả thận và phần phụ của gan—lấy từ lễ vật chuộc tội[a]—ông thiêu thành khói trên bàn thờ, đúng như Yahweh đã truyền cho Môi-se.
  rationale: 'Bản sửa chỉ điều chỉnh cú pháp và cách diễn đạt: đặt cụm “lấy từ lễ vật chuộc tội” trong dấu gạch ngang để nó bổ nghĩa minh bạch cho cả ba phần được nêu; thay “thiêu cho bốc khói” bằng “thiêu thành khói” để diễn đạt tự nhiên hơn hành động הִקְטִיר. Không thay đổi nghĩa, thuật ngữ chính, hay mức độ dè dặt của bản dịch.'
