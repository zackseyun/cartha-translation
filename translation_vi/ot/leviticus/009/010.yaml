base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Còn mỡ, hai quả thận và phần phụ của gan—lấy từ lễ vật chuộc tội[a]—ông thiêu thành khói trên bàn thờ, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ có thể nhấn mạnh vai trò của lễ vật trong việc loại bỏ sự ô uế cũng như xử lý tội lỗi.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: mỡ
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ phần mỡ dành để dâng; “mỡ” trực tiếp, tự nhiên và không diễn giải quá mức.
- source_word: כְּלָיֹת
  choice: hai quả thận
  rationale: Danh từ số nhiều chỉ hai quả thận; cách diễn đạt này giữ chi tiết giải phẫu và tự nhiên trong tiếng Việt.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: phần phụ của gan
  rationale: Danh ngữ chỉ một phần phụ hoặc thùy gắn với gan. “Phần phụ của gan” giữ được sự dè dặt trước bất định giải phẫu hơn cách xác định là một thùy cụ thể.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Đây là tên gọi quen thuộc, dễ hiểu cho loại tế lễ này; chú thích bảo lưu khả năng hiểu theo chức năng thanh tẩy.
- source_word: הִקְטִיר
  choice: thiêu cho bốc khói
  rationale: Động từ Hiphil trong ngữ cảnh tế lễ nói đến việc làm cho lễ vật bốc lên thành khói trên bàn thờ, cụ thể hơn “đốt” đơn thuần.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Dù dạng có hậu tố chỉ hướng, kết hợp với động từ tế lễ này, “trên bàn thờ” là cách diễn đạt tự nhiên và đúng ngữ cảnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời theo dạng chuyển tự, thay vì thay bằng một tước hiệu.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ Hê-bơ-rơ có thể nhấn mạnh cả tội lỗi lẫn chức năng loại bỏ sự ô uế. Bản văn chính dùng tên gọi truyền thống, dễ nhận biết; chú thích giữ lại sắc thái chức năng hợp lệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Còn” để nối tự nhiên với hành động ở câu trước; chủ ngữ “ông” được giữ theo động từ số ít của nguyên văn và ngữ cảnh gần.
