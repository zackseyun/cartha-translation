  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: vi
  text: Ông dâng lễ toàn thiêu và cử hành lễ ấy theo thể thức đã quy định.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “theo quy định”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: dâng
  rationale: Dạng Hiphil của קרב có nghĩa là đem đến gần hoặc trình dâng. Trong ngữ cảnh tế lễ, “dâng” tự nhiên và giữ được ý nghĩa nghi lễ.
- source_word: הָעֹלָה
  choice: lễ vật thiêu
  rationale: עֹלָה là thuật ngữ chỉ lễ vật được thiêu trọn. “Lễ vật thiêu” rõ nghĩa, trang trọng và phù hợp ngữ cảnh Lê-vi.
- source_word: וַיַּעֲשֶׂהָ
  choice: cử hành lễ ấy
  rationale: עשה là động từ rộng, nghĩa là làm hoặc thực hiện; trong ngữ cảnh này, nó chỉ việc tiến hành nghi thức tế lễ. “Cử hành lễ ấy” tránh cách diễn đạt mơ hồ “làm nó” và không thu hẹp thành riêng một thao tác.
- source_word: כַּמִּשְׁפָּט
  choice: theo đúng quy định
  rationale: מִשְׁפָּט ở đây chỉ chuẩn mực hoặc thể thức đã được ấn định. “Theo đúng quy định” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái pháp quy-nghi lễ.
theological_decisions: []
translation_notes:
