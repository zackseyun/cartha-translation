base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: vi
  text: 'Rồi ông dâng lễ vật của dân chúng. Ông lấy con dê đực làm lễ vật chuộc tội cho dân, giết nó và dâng nó làm lễ vật chuộc tội[a], như với lễ vật đầu tiên.


    [a] Cũng có thể dịch: “cử hành nghi thức thanh tẩy bằng nó.” Động từ Hê-bơ-rơ ở đây có thể chỉ việc thực hiện nghi thức lễ vật chuộc tội hoặc việc thanh tẩy trong nghi lễ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cử hành nghi thức thanh tẩy bằng nó.” Động từ Hê-bơ-rơ ở đây có thể chỉ việc thực hiện nghi thức lễ vật chuộc tội hoặc việc thanh tẩy trong nghi lễ.'
    reason: 'Bảo lưu phạm vi nghĩa nghi lễ của וַיְחַטְּאֵהוּ: thực hiện nghi thức חַטָּאת với con dê, hoặc thanh tẩy trong nghi lễ.'
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: tiến dâng
  rationale: Động từ Hiphil của קרב trong bối cảnh tế lễ có nghĩa đem đến gần hoặc trình dâng. “Tiến dâng” diễn đạt tự nhiên hành động nghi lễ mà không đồng nhất nó với toàn bộ tiến trình hiến tế.
- source_word: קָרְבַּן הָעָם
  choice: lễ vật của dân chúng
  rationale: קָרְבָּן là lễ vật được đem đến dâng; cụm sở thuộc được chuyển trực tiếp và rõ ràng.
- source_word: שְׂעִיר הַחַטָּאת
  choice: con dê đực làm lễ vật thanh tẩy tội lỗi
  rationale: שָׂעִיר là dê đực; חַטָּאת trong ngữ cảnh tế lễ chỉ lễ vật liên quan đến việc loại bỏ ô uế do tội lỗi. Cách dịch này tránh hiểu từ ấy chỉ là khái niệm trừu tượng “tội lỗi” và phản ánh sắc thái thanh tẩy của nghi lễ.
- source_word: אֲשֶׁר לָעָם
  choice: cho dân chúng
  rationale: Giới từ ל biểu thị con vật được chỉ định vì lợi ích hoặc thay mặt dân chúng, chứ không đơn thuần thuộc quyền sở hữu của họ.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: giết nó
  rationale: שׁחט là động từ chuyên dùng cho việc giết súc vật trong nghi lễ. Trong tiếng Việt, “giết” là cách diễn đạt tự nhiên; bối cảnh đã làm rõ đây là hành động hiến tế.
- source_word: וַיְחַטְּאֵהוּ
  choice: dâng nó làm lễ vật thanh tẩy tội lỗi
  rationale: Dạng Piel của חטא ở đây chỉ việc thực hiện nghi thức חַטָּאת với con dê. Cách dịch theo chức năng tránh gợi ý sai rằng chính con dê được thanh tẩy, đồng thời chú thích bảo lưu nghĩa thanh tẩy/nghi thức của động từ.
- source_word: כָּרִאשׁוֹן
  choice: như đã làm với con vật trước
  rationale: Cụm từ quy chiếu đến lễ vật thanh tẩy tội lỗi đã được dâng trước đó và cho biết cùng một thủ tục được áp dụng.
theological_decisions:
- issue: Nghĩa của חַטָּאת trong ngữ cảnh tế lễ
  choice: lễ vật thanh tẩy tội lỗi
  alternative: lễ vật chuộc tội; tội lỗi
  rationale: Ngữ cảnh cho thấy từ này chỉ chính lễ vật chứ không phải tội lỗi theo nghĩa trừu tượng. “Thanh tẩy tội lỗi” làm nổi bật chức năng nghi lễ mà không đưa thêm thuật ngữ chuộc tội vốn không trực tiếp nằm trong từ này.
- issue: Nghĩa của וַיְחַטְּאֵהוּ
  choice: dâng nó làm lễ vật thanh tẩy tội lỗi
  alternative: thanh tẩy nó; làm lễ chuộc tội bằng nó
  rationale: Động từ có độ căng nghĩa giữa việc thực hiện nghi thức lễ vật và việc thanh tẩy. Bản văn chính dùng lối diễn đạt chức năng, còn chú thích giữ lại khả năng hiểu theo hướng thanh tẩy, tránh khẳng định rằng con dê là đối tượng được làm sạch hoặc nhập thêm một thuật ngữ thần học cụ thể hơn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “dân chúng” và “lễ vật” là những từ phổ thông. Cấu trúc được chia thành hai câu để dễ đọc, đồng thời vẫn giữ tuần tự hành động của nguyên văn Hê-bơ-rơ.
