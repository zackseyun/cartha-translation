    issue: “Lễ vật thanh tẩy tội lỗi” là thuật ngữ không tự nhiên và có thể gợi ý sai về đối tượng được thanh tẩy.
    rationale: חַטָּאת ở đây là tên lễ vật tế lễ, không phải một mệnh đề nói rằng tội lỗi được thanh tẩy. “Lễ vật chuộc tội” là tương đương tiếng Việt chuẩn, rõ ràng cho loại lễ vật này.
