    rationale: כָּרִאשׁוֹן quy chiếu đến nghi thức/lễ vật chuộc tội đã cử hành trước đó (cc. 8, 11), nên “như với lễ vật đầu tiên” bảo toàn quy chiếu rộng hơn.
