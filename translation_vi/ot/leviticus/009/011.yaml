  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: vi
  text: Còn thịt và da, ông dùng lửa thiêu ở bên ngoài trại.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: Còn
  rationale: וְ tiếp nối trình tự nhưng đồng thời tạo sự chuyển ý nhẹ so với phần được dâng trên bàn thờ ở câu trước; “Còn” diễn đạt tự nhiên quan hệ diễn ngôn này. אֵת là dấu chỉ tân ngữ nên không dịch riêng.
- source_word: הַ/בָּשָׂר
  choice: thịt
  rationale: בָּשָׂר chỉ phần thịt của con vật; “thịt” là cách nói tự nhiên, chính xác trong tiếng Việt hiện đại và không hàm ý đây là thức ăn đã chế biến.
- source_word: הָ/ע֑וֹר
  choice: da
  rationale: עוֹר chỉ da của con vật; “da” rõ ràng và tự nhiên trong ngữ cảnh tế lễ.
- source_word: שָׂרַף
  choice: thiêu
  rationale: שׂרף nghĩa là đốt, thiêu. “Thiêu” phù hợp với việc dùng lửa tiêu hủy vật tế lễ và giữ sắc thái trang trọng mà không thêm ý nghĩa biểu tượng.
- source_word: בָּ/אֵשׁ
  choice: dùng lửa
  rationale: בְּ ở đây biểu thị phương tiện; “dùng lửa thiêu” là cách diễn đạt tự nhiên trong tiếng Việt và phản ánh trực tiếp hành động bằng lửa.
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: ở bên ngoài trại
  rationale: Cụm từ xác định nơi hành động diễn ra, phía ngoài khu trại của Israel; cách dịch này giữ nguyên ý nghĩa không gian-nghi lễ.
theological_decisions:
- issue: Ngôn ngữ xử lý vật tế lễ trong nghi thức
  choice: Diễn đạt cụ thể việc thiêu thịt và da bên ngoài trại, không đưa biểu tượng thần học về sau vào bản văn.
  alternative: Dịch theo hướng loại hình học, làm nổi bật các liên hệ thần học xuất hiện trong những phần Kinh Thánh về sau.
  rationale: Câu này trực tiếp mô tả thủ tục tế lễ. Bản dịch cần giữ nguyên hành động nghi lễ của tiếng Hê-bơ-rơ và không cài thêm cách giải nghĩa vượt quá câu gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể là A-rôn từ ngữ cảnh trước; đại từ này không có mặt trong chính câu Hê-bơ-rơ nhưng cần thiết để câu tiếng Việt tự nhiên. Không đặt chú thích vì các lựa chọn “và/còn,” “da,” và “bằng/dùng lửa” không tạo khác biệt nội dung đáng kể trong tiếng Việt.
