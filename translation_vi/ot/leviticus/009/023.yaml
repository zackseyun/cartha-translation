id: LEV.9.23
reference: Leviticus 9:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: vi
  text: Môi-se và A-rôn đi vào lều hội kiến; rồi họ đi ra và chúc phước cho dân chúng. Bấy giờ, vinh quang của Đức Giê-hô-va hiện ra cho toàn dân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: lều hội kiến
  rationale: Cách dịch quen thuộc, tự nhiên trong tiếng Việt, vẫn giữ nghĩa chuyên biệt của nơi Đức Chúa Trời gặp dân Ngài.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: đi vào ... đi ra
  rationale: Giữ trực tiếp trình tự chuyển động của bản Hê-bơ-rơ. Dù động từ đầu ở dạng số ít, chủ ngữ kép Môi-se và A-rôn cùng các động từ số nhiều tiếp theo cho thấy cả hai cùng đi vào.
- source_word: וַיְבָרֲכוּ
  choice: chúc phước
  rationale: Diễn đạt tự nhiên hành động ban lời chúc phước mà không xác định thêm hình thức của lời chúc.
- source_word: הָעָם / כָּל הָעָם
  choice: dân chúng / toàn dân
  rationale: Chỉ cộng đồng giao ước đang tụ họp; các cách nói này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: כְבוֹד יְהוָה
  choice: vinh quang của Đức Giê-hô-va
  rationale: Giữ ý niệm về sự vinh hiển hữu hình của Đức Chúa Trời và chuyển tự danh riêng giao ước יְהוָה thay vì thay bằng một tước hiệu.
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Diễn tả tự nhiên sắc thái Niphal về một sự hiện diện trở nên thấy được trong bối cảnh thần hiện.
- source_word: אֶל כָּל הָעָם
  choice: cho toàn dân
  rationale: Phản ánh giới từ אֶל sau động từ 'hiện ra' mà không thêm ý giải thích như 'trước mắt'.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Trời; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. 'Đức Giê-hô-va' là dạng danh riêng đã quen thuộc trong tiếng Việt, tránh thay danh ấy bằng một tước hiệu.
- issue: Quan hệ thời gian giữa các mệnh đề
  choice: rồi ... Bấy giờ
  alternative: và ... và
  rationale: Chuỗi wayyiqtol biểu thị diễn tiến của câu chuyện. Các từ nối này làm trình tự rõ ràng trong tiếng Việt mà không áp đặt quan hệ nhân quả.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc tường thuật tuần tự, không thêm chi tiết về lời chúc phước hoặc cách vinh quang hiện ra.
