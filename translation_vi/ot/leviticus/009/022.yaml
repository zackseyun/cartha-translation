base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: vi
  text: Sau đó, A-rôn giơ tay về phía dân chúng và chúc phước cho họ.[a] Rồi ông đi xuống, sau khi đã dâng lễ vật chuộc tội,[b] lễ thiêu và các lễ vật bình an.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ là số ít, “tay ông”; cũng có thể hiểu theo nghĩa tập hợp là “hai tay” trong cử chỉ chúc phước.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lễ vật thanh tẩy”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “các lễ vật thông công” hoặc “các lễ vật an lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: giơ
  rationale: Động từ נשׂא đi với “tay” chỉ hành động nâng hoặc giơ lên. “Giơ” tự nhiên trong tiếng Việt và diễn tả rõ cử chỉ chúc phước.
- source_word: יָדוֹ
  choice: hai tay
  rationale: Hình thái Hê-bơ-rơ là số ít, “tay ông”, nhưng trong thành ngữ chỉ cử chỉ chúc phước có thể được hiểu theo nghĩa tập hợp. “Hai tay” là cách diễn đạt tự nhiên; cách đọc sát hình thái được ghi ở chú thích.
- source_word: אֶל הָעָם
  choice: về phía dân chúng
  rationale: אֶל biểu thị hướng. Cách dịch này giữ được chiều hướng không gian của cử chỉ A-rôn.
- source_word: וַיְבָרְכֵם
  choice: và chúc phước cho họ
  rationale: ברך ở thể piel có nghĩa trực tiếp là ban hoặc tuyên lời chúc phước. “Chúc phước” trang trọng, rõ nghĩa và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: וַיֵּרֶד
  choice: Rồi ông bước xuống
  rationale: ירד nghĩa là đi hoặc xuống. “Bước xuống” tự nhiên và phù hợp với việc A-rôn rời nơi dâng lễ, nhưng không xác định quá mức cấu trúc địa hình.
- source_word: מֵעֲשֹׂת
  choice: sau khi đã dâng
  rationale: Cấu trúc מן + động từ nguyên mẫu diễn tả việc rời khỏi hoặc chuyển tiếp sau hành động vừa hoàn tất. Trong ngữ cảnh tế lễ, “sau khi đã dâng” rõ và tự nhiên hơn cách dịch sát chữ “từ việc làm”.
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: חטאת là thuật ngữ tế lễ có thể nhấn mạnh tội lỗi hoặc chức năng thanh tẩy. “Lễ vật chuộc tội” là thuật ngữ tiếng Việt dễ nhận biết; phương án “lễ vật thanh tẩy” được bảo lưu trong chú thích.
- source_word: הָעֹלָה
  choice: lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trên bàn thờ. “Lễ thiêu” ngắn gọn, trang trọng và quen dùng.
- source_word: הַשְּׁלָמִים
  choice: các lễ vật bình an
  rationale: שׁלמים là thuật ngữ tế lễ ở dạng số nhiều, liên hệ đến sự bình an, toàn vẹn và thông công. “Các lễ vật bình an” giữ thuật ngữ truyền thống mà không loại bỏ các sắc thái khác, vốn được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch các thuật ngữ tế lễ
  choice: Dùng “lễ vật chuộc tội”, “lễ thiêu” và “các lễ vật bình an” trong chính văn.
  alternative: “Lễ vật thanh tẩy”; “lễ toàn thiêu”; “các lễ vật thông công” hoặc “các lễ vật cầu phúc lành”.
  rationale: Đây là những phạm trù tế lễ chuyên biệt trong sách Lê-vi. Chính văn dùng các thuật ngữ tiếng Việt dễ nhận biết và nhất quán, còn chú thích bảo lưu những cách dịch làm nổi bật chức năng thanh tẩy, thông công hoặc trạng thái an lành.
- issue: Số của từ “tay” trong cử chỉ chúc phước
  choice: Dịch tự nhiên là “hai tay” và ghi chú hình thái số ít của tiếng Hê-bơ-rơ.
  alternative: Dịch sát là “tay mình” hoặc “tay ông”.
  rationale: 'Không nên che khuất dữ liệu nguồn: יָדוֹ có hình thái số ít. Tuy vậy, trong cử chỉ chúc phước, số ít có thể mang nghĩa tập hợp; chú thích giữ nguyên sự không chắc chắn này.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tên riêng dùng dạng quen thuộc “A-rôn”. Trật tự câu giữ chuỗi hành động của nguyên văn, đồng thời dùng “sau khi đã dâng” để diễn đạt tự nhiên quan hệ hoàn tất trong מֵעֲשֹׂת. Mọi dấu chú thích đều xuất hiện ngay sau thành phần liên quan trong chính văn.
