id: LEV.9.5
reference: Leviticus 9:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: vi
  text: Họ đem những gì Môi-se đã truyền đến trước Lều Hội Kiến; toàn thể hội chúng tiến lại gần và đứng trước mặt Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: họ đem
  rationale: Động từ לקח thường có nghĩa là “lấy”, nhưng đích đến được nêu ngay sau đó cho thấy ở đây hành động là đem các lễ vật đến một nơi; “đem” tự nhiên và đúng hướng chuyển động trong tiếng Việt.
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: những gì Môi-se đã truyền
  rationale: Mệnh đề quan hệ chỉ các vật đã được Môi-se truyền phải chuẩn bị trong ngữ cảnh trước; “những gì” giữ cách nói khái quát của nguyên văn mà không tự ý liệt kê.
- source_word: אֶל־פְּנֵי
  choice: đến phía trước
  rationale: Cụm này mang nghĩa không gian, chỉ vị trí phía trước Lều Hội Kiến, đồng thời phân biệt với לִפְנֵי יְהוָה ở cuối câu.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách dịch trang trọng, tương đối minh bạch và quen thuộc, diễn đạt chiếc lều là nơi gặp gỡ theo chỉ định.
- source_word: וַיִּקְרְבוּ
  choice: tiến đến
  rationale: קרב diễn tả việc đến gần. “Tiến đến” là lối nói tự nhiên, giữ được chuyển động hướng về nơi thánh.
- source_word: כָּל־הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ toàn cộng đồng Israel được triệu tập; “hội chúng” phù hợp với bối cảnh cộng đồng và thờ phượng.
- source_word: וַיַּעַמְדוּ
  choice: đứng
  rationale: Dịch trực tiếp động từ עמד, không thêm ý “tiếp tục đứng” hay sắc thái nghi lễ mà nguyên văn không nói rõ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: “Trước mặt” giữ cả nghĩa không gian lẫn sự hiện diện thờ phượng; danh riêng giao ước được phiên theo cách dùng tiếng Việt phổ biến.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước YHWH. “Đức Giê-hô-va” là dạng danh riêng đã quen thuộc trong tiếng Việt và tránh thay danh ấy bằng một tước hiệu; không thêm cách giải thích thần học ngoài văn bản.
- issue: Ý nghĩa của לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  alternative: trong sự hiện diện của Đức Giê-hô-va
  rationale: Cách dịch được chọn bảo tồn đồng thời chiều kích vị trí trước nơi thánh và chiều kích hiện diện của Đức Chúa Trời, thay vì chỉ xác định một nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai cụm אֶל־פְּנֵי và לִפְנֵי được dịch khác nhau (“đến phía trước” / “trước mặt”) để phản ánh sự phân biệt giữa vị trí trước Lều Hội Kiến và việc đứng trước Đức Giê-hô-va. Không cần chú thích cho câu này.
