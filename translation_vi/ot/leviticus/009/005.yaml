revisions:
- from: Họ đem những gì Môi-se đã truyền đến phía trước Lều Hội Kiến. Toàn thể hội chúng tiến đến và đứng trước mặt Đức Giê-hô-va.
  to: Họ đem những gì Môi-se đã truyền đến trước Lều Hội Kiến; toàn thể hội chúng tiến lại gần và đứng trước mặt Yahweh.
  rationale: 'Bản sửa chỉ chuẩn hóa cách chuyển dịch danh YHWH thành “Yahweh” theo chính sách POB và làm rõ sắc thái “đến gần” của קרב. Các tương ứng không gian vẫn được phân biệt: “đến trước Lều Hội Kiến” cho אֶל־פְּנֵי, và “trước mặt Yahweh” cho לִפְנֵי יהוה.'
