  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁחַ֤ט אֶת הַ/שּׁוֹר֙ וְ/אֶת הָ/אַ֔יִל זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לָ/עָ֑ם וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת הַ/דָּם֙ אֵלָ֔י/ו וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: vi
  text: Rồi ông giết con bò và con chiên đực làm sinh tế bình an[a] cho dân chúng. Các con trai A-rôn đem huyết đến cho ông, và ông hắt huyết lên bàn thờ, chung quanh các phía.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sinh tế thông công” hoặc “sinh tế an lành/toàn vẹn.” Từ Hê-bơ-rơ שְׁלָמִים gợi các ý niệm về bình an, sự toàn vẹn và sự hiệp thông.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Rồi ông giết
  rationale: Động từ chỉ việc giết con vật trong nghi thức tế lễ; “Rồi” diễn đạt tự nhiên sự tiếp nối của câu chuyện, còn “giết” rõ ràng và trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: הַשּׁוֹר
  choice: con bò
  rationale: שׁוֹר chỉ gia súc thuộc loài bò và ở đây không nhất thiết nhấn mạnh giới tính; “con bò” tránh xác định quá mức.
- source_word: הָאַיִל
  choice: con chiên đực
  rationale: אַיִל chỉ con chiên đực trưởng thành; cách dịch này chính xác và dễ hiểu hơn từ chuyên biệt “cừu đực” trong nhiều ngữ cảnh tiếng Việt.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sinh tế bình an
  rationale: “Sinh tế” thể hiện זֶבַח là lễ vật bằng con vật bị giết; “bình an” duy trì mối liên hệ của שְׁלָמִים với sự bình an, toàn vẹn và hiệp thông, đồng thời chú thích bảo tồn các sắc thái khác.
- source_word: אֲשֶׁר לָעָם
  choice: cho dân chúng
  rationale: Cụm này xác định sinh tế được dâng vì hoặc thay mặt dân chúng; bản dịch ngắn gọn và tự nhiên mà không buộc phải chọn giữa các sắc thái ấy.
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: đem ... đến cho ông
  rationale: Trong trình tự tế lễ, động từ diễn tả việc đưa hoặc trình huyết cho người chủ lễ; đại từ “ông” giữ cách quy chiếu của tiếng Hê-bơ-rơ về A-rôn.
- source_word: וַיִּזְרְקֵהוּ
  choice: ông hắt huyết
  rationale: זָרַק ở đây chỉ động tác tung/hắt huyết vào bàn thờ, mạnh hơn “rảy”; lặp lại “huyết” tự nhiên và rõ nghĩa hơn dùng đại từ “nó” trong tiếng Việt.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: chung quanh bàn thờ
  rationale: Cách diễn đạt này truyền đạt việc áp huyết quanh các phía của bàn thờ, đồng thời tránh xác định quá mức liệu nên hiểu עַל là “trên” hay “vào/áp vào” trong nghi thức.
theological_decisions:
- issue: Ý nghĩa của שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công; sinh tế cầu an/toàn vẹn
  rationale: Từ Hê-bơ-rơ gợi cả bình an, sự toàn vẹn và mối hiệp thông. Bản chính dùng thuật ngữ quen thuộc nhưng không đồng nhất nó với chỉ một học thuyết; chú thích nêu các sắc thái thực sự của từ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “A-rôn”, “huyết”, “bàn thờ” và “sinh tế” để phù hợp văn cảnh tế lễ; tránh lối cổ quá mức. Đại từ “ông” chỉ A-rôn theo ngữ cảnh.
