- from: Rồi ông giết con bò và con chiên đực làm sinh tế bình an[a] cho dân chúng. Các con trai A-rôn đem huyết đến cho ông, và ông hắt huyết chung quanh bàn thờ.
  to: Rồi ông giết con bò và con chiên đực làm sinh tế bình an[a] cho dân chúng. Các con trai A-rôn đem huyết đến cho ông, và ông hắt huyết lên bàn thờ, chung quanh các phía.
  rationale: Chỉ chỉnh câu cuối để nêu rõ huyết được hắt lên bàn thờ, đồng thời giữ sắc thái “quanh các phía” của סָבִיב. Chú thích được chỉnh nhẹ để các phương án là cách dịch trực tiếp, ngắn gọn và song song hơn; ý nghĩa vẫn được bảo toàn.
