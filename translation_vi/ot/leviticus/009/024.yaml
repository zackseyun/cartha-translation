  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: vi
  text: Từ trước mặt Yahweh, lửa phát ra, thiêu hết lễ vật thiêu và các phần mỡ trên bàn thờ. Toàn dân thấy vậy thì reo mừng[a] và sấp mặt xuống đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cất tiếng reo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: Lửa ... phóng ra
  rationale: יצא diễn tả chuyển động từ trong ra ngoài; “phóng ra” tự nhiên trong tiếng Việt khi nói về lửa và giữ được tính sống động của trình thuật.
- source_word: מִלִּפְנֵי יְהוָה
  choice: từ trước mặt Yahweh
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hebrew לִפְנֵי, đồng thời có thể hàm ý lửa phát xuất từ sự hiện diện của Yahweh.
- source_word: וַתֹּאכַל
  choice: thiêu hết
  rationale: Động từ có nghĩa đen là “ăn”; với chủ thể là lửa, “thiêu hết” là cách diễn đạt tự nhiên và thể hiện việc lễ vật bị lửa tiêu thụ hoàn toàn.
- source_word: הָעֹלָה
  choice: lễ vật thiêu
  rationale: Thuật ngữ tế lễ chỉ lễ vật được dâng lên bằng cách thiêu; cách gọi này rõ nghĩa và phù hợp với tiếng Việt hiện đại.
- source_word: הַחֲלָבִים
  choice: các phần mỡ
  rationale: Số nhiều và bối cảnh tế lễ nói đến những phần mỡ được quy định để dâng, chứ không phải mỡ nói chung.
- source_word: וַיָּרֹנּוּ
  choice: reo mừng
  rationale: רנן chỉ tiếng reo vang đầy vui mừng; “reo mừng” truyền đạt cả âm thanh lẫn niềm hân hoan mà không biến hành động thành một bài hát trang trọng.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: sấp mặt xuống đất
  rationale: Diễn đạt tự nhiên tư thế phủ phục trong sự kính sợ hoặc thờ phượng, đồng thời giữ hình ảnh cụ thể của nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” giúp phân biệt danh riêng này với tước hiệu “Chúa” và không áp đặt một truyền thống hệ phái.
- issue: Ý nghĩa phản ứng וַיָּרֹנּוּ
  choice: reo mừng
  alternative: cất tiếng reo
  rationale: Ngữ căn có thể chỉ tiếng reo vang nói chung hoặc tiếng reo vui. Bối cảnh thần hiển hỗ trợ sắc thái vui mừng, nhưng bản dịch không diễn giải thêm động cơ thần học của dân chúng.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Duy trì nhịp kể liên tiếp của Hebrew, giữ hình ảnh “từ trước mặt Yahweh” và tư thế phủ phục cụ thể; dùng thuật ngữ tế lễ nhất quán, không quá cổ kính.
