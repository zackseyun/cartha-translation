base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: vi
  text: Họ đem lễ vật thiêu đến cho ông, từng phần một[a], cùng với đầu; rồi ông thiêu chúng trên bàn thờ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo từng phần của nó.” Tiếng Hê-bơ-rơ nói đến các phần của con vật đã được pha ra và đem đến cho A-rôn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dâng chúng lên trong khói.” Trong ngữ cảnh tế lễ, động từ này cụ thể hơn là thiêu lễ vật trên bàn thờ để khói bốc lên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלָה
  choice: lễ vật thiêu
  rationale: Đây là thuật ngữ tiêu chuẩn chỉ lễ vật được thiêu trọn trên bàn thờ. “Lễ vật thiêu” rõ nghĩa, tự nhiên và phù hợp với ngữ cảnh tế lễ trong sách Lê-vi.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: họ đem ... đến cho ông
  rationale: Dạng Hiphil của מצא ở đây diễn tả việc làm cho vật được đưa đến, tức đem các phần lễ vật đến cho A-rôn trong tiến trình nghi lễ.
- source_word: לִנְתָחֶיהָ
  choice: từng phần một
  rationale: נֶתַח chỉ những phần thịt đã được pha ra; cách diễn đạt này truyền đạt tự nhiên ý các phần được lần lượt đem đến.
- source_word: הָרֹאשׁ
  choice: cái đầu
  rationale: Giữ nghĩa giải phẫu trực tiếp vì câu này phân biệt cái đầu với các phần đã pha khác.
- source_word: וַיַּקְטֵר
  choice: ông dâng tất cả lên thành khói
  rationale: Trong ngữ cảnh tế lễ, קטר không chỉ có nghĩa đốt mà nhấn mạnh việc thiêu trên bàn thờ để lễ vật hóa thành khói dâng lên.
- source_word: עַל הַמִּזְבֵּחַ
  choice: trên bàn thờ
  rationale: Cách diễn đạt thông dụng, rõ ràng cho vị trí thực hiện nghi thức.
theological_decisions:
- issue: Sắc thái tế lễ của וַיַּקְטֵר
  choice: dâng tất cả lên thành khói
  alternative: thiêu tất cả
  rationale: Lựa chọn chính giữ sắc thái chuyên biệt của động từ trong nghi lễ mà không diễn giải thêm ý nghĩa thần học; chú thích bảo lưu cách dịch ngắn gọn hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” giữ nguyên quy chiếu ngữ cảnh của bản Hê-bơ-rơ mà không tự ý thêm tên A-rôn vào chính văn; “tất cả” diễn đạt tự nhiên tân ngữ tập hợp gồm các phần thịt và cái đầu.
