base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: vi
  text: Bấy giờ, A-rôn đến gần bàn thờ và giết làm tế lễ con bê làm lễ chuộc tội cho mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy”. Từ Hê-bơ-rơ có thể chỉ lễ vật liên quan đến tội lỗi và việc loại bỏ sự ô uế.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: đến gần
  rationale: Diễn đạt trực tiếp hành động A-rôn tiến đến bàn thờ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Cách dịch tiêu chuẩn và rõ nghĩa của מִזְבֵּחַ trong bối cảnh tế lễ.
- source_word: וַיִּשְׁחַט
  choice: giết
  rationale: Trong ngữ cảnh hiến tế, động từ chỉ việc giết con vật để dâng lễ. “Giết” tự nhiên và chính xác trong tiếng Việt; chức năng nghi lễ đã được ngữ cảnh làm rõ.
- source_word: עֵגֶל
  choice: con bê
  rationale: עֵגֶל chỉ một con bò còn non; “con bê” là cách gọi thông dụng và trực tiếp.
- source_word: הַחַטָּאת
  choice: lễ vật chuộc tội
  rationale: Ở đây חַטָּאת chỉ loại lễ vật hiến tế, không phải bản thân tội lỗi. “Lễ vật chuộc tội” là thuật ngữ quen thuộc, còn sắc thái thanh tẩy được giữ trong chú thích.
- source_word: אֲשֶׁר לוֹ
  choice: dành cho mình
  rationale: Cụm từ xác định đây là lễ vật của A-rôn và được dâng vì chính ông, đối lập với các lễ vật dành cho dân chúng trong văn cảnh.
theological_decisions:
- issue: Cách dịch חַטָּאת trong bối cảnh tế lễ của sách Lê-vi
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ Hê-bơ-rơ vừa là tên một loại lễ vật liên quan đến tội lỗi, vừa có thể nhấn mạnh chức năng loại bỏ ô uế. Bản chính dùng cách gọi quen thuộc mà không phủ nhận sắc thái thanh tẩy; cách hiểu kia được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “A-rôn” theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc; giữ câu văn gọn và sát trình tự của nguyên văn Hê-bơ-rơ.
