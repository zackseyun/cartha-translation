base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: vi
  text: 'Cùng các phần mỡ của con bò đực[a] và con chiên đực: đuôi đầy mỡ, lớp mỡ bao phủ nội tạng, hai quả thận và thùy gan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con bò”. Từ Hê-bơ-rơ שׁוֹר có thể chỉ chung gia súc thuộc loài bò hoặc cụ thể là bò đực, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: cùng các phần mỡ
  rationale: Cụm từ tiếp nối danh sách ở câu trước; dạng số nhiều chỉ những phần mỡ được quy định dùng trong lễ tế, chứ không phải mỡ nói chung.
- source_word: מִן הַשּׁוֹר
  choice: của con bò đực
  rationale: שׁוֹר chỉ gia súc thuộc loài bò và trong ngữ cảnh tế lễ này có thể được hiểu là bò đực; cách dịch này tự nhiên và phù hợp với con vật đã được nhắc đến.
- source_word: וּמִן הָאַיִל
  choice: và con chiên đực
  rationale: אַיִל là chiên đực trưởng thành trong ngữ cảnh tế lễ.
- source_word: הָאַלְיָה
  choice: chiếc đuôi mỡ
  rationale: Thuật ngữ chỉ chiếc đuôi tích nhiều mỡ của giống chiên đuôi mỡ, là một phần riêng biệt được dâng trong lễ tế.
- source_word: הַמְכַסֶּה
  choice: lớp mỡ bao phủ nội tạng
  rationale: Danh từ hóa từ động từ 'bao phủ'; trong danh sách giải phẫu tế lễ, cụm này chỉ lớp mỡ phủ các cơ quan bên trong.
- source_word: הַכְּלָיֹת
  choice: hai quả thận
  rationale: Danh từ ở dạng số nhiều chỉ cặp thận; thêm 'hai quả' tạo cách diễn đạt tự nhiên trong tiếng Việt mà không đổi ý.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: thùy gan
  rationale: Cụm từ chỉ một phần gắn với gan; 'thùy gan' là cách diễn đạt ngắn gọn, dễ hiểu và quen thuộc trong các danh sách tế lễ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ cấu trúc liệt kê của nguyên văn. Dùng các thuật ngữ giải phẫu rõ ràng, dễ hiểu; đặt chú thích ngay sau “con bò đực”, là từ mà chú thích giải nghĩa.
