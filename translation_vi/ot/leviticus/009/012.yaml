language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁחַ֖ט אֶת הָ/עֹלָ֑ה וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֵלָי/ו֙ אֶת הַ/דָּ֔ם וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: vi
  text: Sau đó, ông giết con vật dâng làm lễ thiêu. Các con trai A-rôn đem máu đến cho ông, rồi ông tạt máu ấy[a] lên khắp các phía của bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ ở đây chỉ việc hắt hoặc tạt máu vào bàn thờ, chứ không phải rảy nhẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Sau đó, ông giết
  rationale: Trong bối cảnh tế lễ, שׁחט chỉ việc giết con vật theo nghi thức; “Sau đó” diễn đạt tự nhiên trình tự kể chuyện của liên từ waw.
- source_word: הָעֹלָה
  choice: con vật dâng làm lễ thiêu
  rationale: עוֹלָה là lễ vật được thiêu toàn bộ. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ rằng đối tượng bị giết là con vật dùng cho lễ thiêu.
- source_word: וַיַּמְצִאוּ
  choice: đem ... đến
  rationale: Trong trình tự nghi lễ, các con trai A-rôn mang máu đến cho A-rôn để ông áp dụng máu lên bàn thờ.
- source_word: בְּנֵי אַהֲרֹן
  choice: Các con trai A-rôn
  rationale: Giữ nguyên quan hệ gia đình và vai trò của những người tham gia nghi lễ, với cách phiên âm tên quen thuộc trong tiếng Việt.
- source_word: הַדָּם
  choice: máu
  rationale: “Máu” là từ hiện đại, trực tiếp và dễ hiểu; tính xác định được thể hiện ở lần nhắc lại bằng “máu ấy”.
- source_word: וַיִּזְרְקֵהוּ
  choice: ông tạt máu ấy
  rationale: זרק trong nghi thức tế lễ diễn tả việc hắt hoặc tạt máu vào bàn thờ, mạnh hơn hành động rảy nhẹ. “Tạt” vừa tự nhiên vừa bảo toàn lực của động tác.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: lên khắp các phía của bàn thờ
  rationale: Diễn đạt việc máu được tạt lên bàn thờ ở chung quanh, bảo toàn ý phân bố của סָבִיב.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lễ thiêu” cho thuật ngữ tế lễ עוֹלָה, “máu” thay vì từ cổ hoặc chuyên biệt hơn là “huyết”, và giữ tên riêng theo dạng quen thuộc “A-rôn”.
