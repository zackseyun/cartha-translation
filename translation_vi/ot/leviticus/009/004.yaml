id: LEV.9.4
reference: Leviticus 9:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: vi
  text: và một con bò đực cùng một con chiên đực để làm lễ vật bình an[a], để dâng tế trước mặt Yahweh, và một lễ vật ngũ cốc trộn với dầu; vì hôm nay Yahweh sẽ hiện ra với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật tương giao” hoặc “lễ vật an lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: con bò đực
  rationale: Danh từ chỉ gia súc thuộc loài bò; trong ngữ cảnh tế lễ, “con bò đực” là cách diễn đạt tự nhiên và phù hợp, dù từ này tự nó có thể không luôn nhấn mạnh giới tính.
- source_word: אַיִל
  choice: con chiên đực
  rationale: Chỉ cụ thể chiên đực trưởng thành; cách dịch này rõ nghĩa hơn từ chuyên biệt ít thông dụng “cừu đực” trong tiếng Việt.
- source_word: שְׁלָמִים
  choice: lễ vật bình an
  rationale: Thuật ngữ tế lễ có trường nghĩa gồm bình an, an lành và sự hiệp thông; giữ cách gọi quen thuộc nhưng chú thích các khả năng khác.
- source_word: לִזְבֹּחַ
  choice: để dâng
  rationale: Trong ngữ cảnh tế lễ, động từ diễn tả việc giết và hiến tế; “dâng” truyền đạt chức năng nghi lễ tự nhiên trong câu mà không chỉ thu hẹp vào hành động giết mổ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ ý trực tiếp “trước mặt/trong sự hiện diện của” và phiên âm danh thần יְהוָה là Yahweh.
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong luật tế lễ Lê-vi, từ này chỉ lễ vật làm từ sản phẩm ngũ cốc; cách dịch giúp độc giả hiện đại nhận biết loại lễ vật.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: trộn với dầu
  rationale: Diễn đạt tự nhiên cách chuẩn bị lễ vật ngũ cốc bằng việc trộn với dầu.
- source_word: כִּי הַיּוֹם
  choice: vì hôm nay
  rationale: כִּי nêu lý do, còn הַיּוֹם nhấn mạnh thời điểm trong ngày ấy.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: sẽ hiện ra với anh em
  rationale: Dạng hoàn thành Niphal mang lực tương lai gần trong ngữ cảnh này; “hiện ra với” giữ ý về sự tự bày tỏ của Yahweh.
theological_decisions:
- issue: Cách dịch danh thần יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” giữ sự phân biệt giữa danh riêng và tước hiệu.
- issue: Ý nghĩa lời nói về sự hiện ra của Đức Chúa Trời
  choice: Yahweh sẽ hiện ra với anh em
  alternative: vinh quang của Yahweh sẽ hiện ra với anh em; Yahweh đã hiện ra với anh em
  rationale: Câu này nêu chính Yahweh, không có danh từ “vinh quang”; trong mạch văn, sự hiện ra vẫn sắp xảy đến nên dùng tương lai, đồng thời không nhập cách diễn đạt của câu kế tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho hậu tố số nhiều אֲלֵיכֶם vì lời được nói với cộng đồng; giữ thuật ngữ tế lễ nhất quán và tránh cách diễn đạt cổ.
