- from: cùng một con bò đực và một con chiên đực làm lễ vật bình an[a] để dâng trước mặt Yahweh, và một lễ vật ngũ cốc trộn với dầu; vì hôm nay Yahweh sẽ hiện ra với anh em.
  to: và một con bò đực cùng một con chiên đực để làm lễ vật bình an[a], để dâng tế trước mặt Yahweh, và một lễ vật ngũ cốc trộn với dầu; vì hôm nay Yahweh sẽ hiện ra với anh em.
