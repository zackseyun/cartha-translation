  text: וַ/יִּרְחַ֥ץ אֶת הַ/קֶּ֖רֶב וְ/אֶת הַ/כְּרָעָ֑יִם וַ/יַּקְטֵ֥ר עַל הָ/עֹלָ֖ה הַ/מִּזְבֵּֽחָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: vi
  text: Ông rửa bộ lòng và các cẳng chân, rồi thiêu chúng cho bốc khói[a] trên bàn thờ, bên trên lễ vật thiêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dâng chúng lên thành khói.”'
    reason: Giữ lại sắc thái hiến dâng của động từ tế lễ קטר, bên cạnh nghĩa cụ thể là thiêu cho bốc khói.
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: ông rửa
  rationale: Động từ רחץ trong nghi thức hiến tế chỉ việc rửa bằng nước; “rửa” là cách diễn đạt rõ ràng và tự nhiên trong tiếng Việt.
- source_word: הַקֶּרֶב
  choice: bộ lòng
  rationale: Trong ngữ cảnh hiến tế, קֶרֶב chỉ các bộ phận nội tạng của con vật. “Bộ lòng” cụ thể, tự nhiên và dễ hiểu hơn “phần bên trong”.
- source_word: הַכְּרָעָיִם
  choice: các cẳng chân
  rationale: כְּרָעַיִם chỉ chân hoặc phần chân dưới của con vật; “cẳng chân” giữ được nét nghĩa giải phẫu cụ thể.
- source_word: וַיַּקְטֵר
  choice: thiêu chúng cho bốc khói
  rationale: Dạng Hiphil của קטר trong văn cảnh tế lễ không chỉ nói đến việc đốt nói chung mà còn gợi hành động làm lễ vật bốc lên thành khói trên bàn thờ. Cách dịch này vừa tự nhiên vừa giữ sắc thái nghi lễ.
- source_word: עַל
  choice: bên trên
  rationale: Giới từ עַל ở đây biểu thị vị trí của các phần vừa rửa so với lễ vật thiêu đã ở trên bàn thờ.
- source_word: הָעֹלָה
  choice: lễ vật thiêu
  rationale: עֹלָה là thuật ngữ tế lễ chỉ lễ vật được thiêu trọn; “lễ vật thiêu” rõ nghĩa và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: מִזְבֵּחַ nghĩa là “bàn thờ”; hậu tố chỉ hướng được thể hiện tự nhiên qua cụm giới từ tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để nối tiếp chủ thể nam trong mạch tường thuật; “bộ lòng” và “cẳng chân” là các thuật ngữ cụ thể, thông dụng. Cấu trúc “trên bàn thờ, bên trên lễ vật thiêu” bảo toàn hai quan hệ vị trí trong nguyên văn.
