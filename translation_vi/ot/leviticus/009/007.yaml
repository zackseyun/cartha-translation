  to: 'Môi-se nói với A-rôn: “Hãy đến gần bàn thờ, dâng lễ vật chuộc tội[a] và lễ toàn thiêu của anh, rồi làm lễ chuộc tội cho chính mình và cho dân chúng. Sau đó, hãy dâng lễ vật của dân chúng và làm lễ chuộc tội cho họ, đúng như Đức Giê-hô-va đã truyền.”'
  rationale: Chỉ thay thuật ngữ chỉ עֹלָה bằng “lễ toàn thiêu”. Bản sửa giữ nguyên cấu trúc, ý nghĩa tế lễ, tên riêng thần linh và chú thích từ vựng của bản thảo.
