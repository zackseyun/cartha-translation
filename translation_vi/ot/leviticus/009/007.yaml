  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: vi
  text: 'Môi-se nói với A-rôn: “Hãy đến gần bàn thờ, dâng lễ vật chuộc tội[a] và lễ toàn thiêu của anh, rồi làm lễ chuộc tội cho chính mình và cho dân chúng. Sau đó, hãy dâng lễ vật của dân chúng và làm lễ chuộc tội cho họ, đúng như Đức Giê-hô-va đã truyền.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật chuộc tội, đồng thời trong một số văn cảnh nhấn mạnh sự thanh tẩy khỏi ô uế.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב
  choice: Hãy đến gần
  rationale: Mệnh lệnh của קרב trong bối cảnh tế lễ có nghĩa là tiến đến hoặc đến gần; cách dịch này tự nhiên và giữ được lời truyền trực tiếp cho A-rôn.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Thuật ngữ thông dụng và chính xác cho nơi dâng tế lễ; tính xác định được thể hiện tự nhiên theo văn cảnh tiếng Việt.
- source_word: וַעֲשֵׂה
  choice: dâng
  rationale: Dù nghĩa cơ bản là “làm”, khi đi với các lễ vật, động từ này chỉ việc cử hành hoặc dâng sinh tế; “dâng” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: חַטָּאתְךָ
  choice: lễ vật chuộc tội
  rationale: Trong luật tế lễ, חַטָּאת chỉ lễ vật xử lý tội lỗi hoặc sự ô uế. Cách dịch quen thuộc này giữ trọng tâm về tội, còn sắc thái thanh tẩy được ghi ở chú thích.
- source_word: עֹלָתֶךָ
  choice: lễ vật thiêu
  rationale: Chỉ sinh tế được thiêu trọn trên bàn thờ; “lễ vật thiêu” ngắn gọn và chính xác trong ngữ cảnh tế tự.
- source_word: וְכַפֵּר
  choice: làm lễ chuộc tội
  rationale: כפר trong ngữ cảnh tư tế chỉ hành động tế lễ nhằm chuộc tội hoặc thanh tẩy. Cách dịch này giữ sức nặng thần học mà không áp đặt một học thuyết chuộc tội cụ thể.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: cho chính mình và cho dân chúng
  rationale: בְּעַד diễn tả việc hành động vì hoặc thay mặt cho người khác; “cho” tự nhiên trong tiếng Việt, còn “chính mình” làm rõ đại từ phản thân.
- source_word: קָרְבַּן הָעָם
  choice: lễ vật của dân chúng
  rationale: Giữ quan hệ sở thuộc của cấu trúc Hê-bơ-rơ và cho thấy đây là lễ vật thuộc về hoặc được dâng thay cho dân chúng.
- source_word: בַּעֲדָם
  choice: cho họ
  rationale: Duy trì cách dịch nhất quán của בְּעַד và phù hợp với văn phong tiếng Việt tự nhiên.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: đúng như Đức Giê-hô-va đã truyền
  rationale: “Đúng như” nhấn mạnh sự phù hợp với mệnh lệnh; danh xưng cá nhân יהוה được phiên âm theo cách quen thuộc, trang trọng trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; thêm “Đức” phù hợp lối xưng hô trang trọng tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch חַטָּאת trong bối cảnh tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ này có thể nhấn mạnh tội lỗi được xử lý hoặc tác dụng thanh tẩy của nghi lễ. Bản văn chính dùng cách gọi quen thuộc, còn chú thích bảo tồn cách hiểu thanh tẩy chính đáng.
- issue: Cách dịch כפר
  choice: làm lễ chuộc tội
  alternative: làm lễ thanh tẩy
  rationale: Động từ có phạm vi ý nghĩa liên quan đến chuộc tội, thanh tẩy và khôi phục quan hệ trong nghi lễ. Cách dịch chính không thu hẹp ý nghĩa vào một lý thuyết thần học riêng.
- issue: Cách thể hiện יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA
  rationale: Bản nguồn có danh riêng יהוה; phiên âm danh này bảo tồn sự phân biệt giữa tên riêng và tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh” khi Môi-se nói trực tiếp với A-rôn để phản ánh đại từ ngôi hai số ít mà không tạo sắc thái quá cổ; giữ thuật ngữ tế lễ nhất quán và đặt dấu chú thích ngay sau cụm từ liên quan.
