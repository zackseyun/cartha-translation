    rationale: Cấu trúc này là sự mô phỏng quá sát nguyên ngữ. “Bốc một nắm từ lễ phẩm ấy” truyền đạt chức năng thành ngữ—lấy một phần trong tay—một cách rõ ràng; nghĩa đen được lưu trong chú thích.
  - severity: low
