  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: vi
  text: Rồi ông dâng lễ phẩm ngũ cốc, bốc một nắm từ lễ phẩm ấy[a] và thiêu trên bàn thờ, ngoài lễ thiêu buổi sáng ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “làm đầy lòng bàn tay mình từ đó”, một cách nói chỉ việc lấy một phần lễ phẩm ngũ cốc vào tay để thiêu trên bàn thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: dâng
  rationale: Trong bối cảnh tế lễ, dạng Hiphil của קרב chỉ việc đem đến hoặc trình dâng lễ phẩm. “Dâng” tự nhiên trong tiếng Việt và giữ rõ sắc thái nghi lễ.
- source_word: הַמִּנְחָה
  choice: lễ phẩm ngũ cốc
  rationale: Trong luật tế lễ Lê-vi, מִנְחָה là lễ phẩm làm từ ngũ cốc, không chỉ là một lễ vật chung chung. Cách dịch này rõ nghĩa đối với độc giả hiện đại.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: lấy đầy lòng bàn tay từ lễ phẩm ấy
  rationale: Cách diễn đạt giữ hình ảnh cụ thể của כַּף, “lòng bàn tay”, đồng thời dùng động từ “lấy” để câu tiếng Việt tự nhiên và cho thấy ông lấy một phần từ lễ phẩm.
- source_word: וַיַּקְטֵר
  choice: thiêu
  rationale: Dạng Hiphil của קטר trong bối cảnh tế lễ nói đến việc đốt lễ phẩm cho bốc khói. “Thiêu” ngắn gọn, trang trọng và phù hợp với hành động trên bàn thờ.
- source_word: עַל הַמִּזְבֵּחַ
  choice: trên bàn thờ
  rationale: Đây là cách diễn đạt vị trí trực tiếp, tự nhiên và chính xác trong tiếng Việt.
- source_word: מִלְּבַד
  choice: ngoài
  rationale: Từ này cho biết hành động vừa nêu được thực hiện thêm vào lễ vật buổi sáng; “ngoài” giữ cấu trúc gọn và không diễn giải quá mức.
- source_word: עֹלַת הַבֹּקֶר
  choice: lễ vật thiêu buổi sáng
  rationale: עֹלָה là loại lễ vật được thiêu trên bàn thờ. “Lễ vật thiêu buổi sáng” phân biệt rõ lễ vật này với lễ phẩm ngũ cốc.
