id: LEV.9.2
reference: Leviticus 9:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: vi
  text: 'Ông nói với A-rôn: “Hãy lấy cho mình một con bê[a] làm lễ chuộc tội và một con cừu đực làm lễ toàn thiêu, cả hai đều không tì vết, rồi đem chúng đến trước mặt Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “một con bê, con của đàn bò”, nghĩa là một con bò non.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־אַהֲרֹן
  choice: Ông nói với A-rôn
  rationale: Giữ dòng kể chuyện của thể wayyiqtol mà không nhấn mạnh quá mức trình tự thời gian; chủ ngữ được tiếp nối từ văn cảnh.
- source_word: קַח לְךָ
  choice: Hãy lấy cho mình
  rationale: Diễn đạt cả mệnh lệnh קַח lẫn sắc thái quy chiếu về người nhận trong לְךָ.
- source_word: עֵגֶל בֶּן־בָּקָר
  choice: một con bê
  rationale: Đây là cách nói tự nhiên trong tiếng Việt về một con bò non; cấu trúc Hê-bơ-rơ sát chữ được ghi trong chú thích để không làm câu chính nặng nề.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh nghi lễ, חַטָּאת chỉ một loại lễ vật liên quan đến việc xử lý tội lỗi và sự ô uế, chứ không chỉ khái niệm trừu tượng về tội.
- source_word: וְאַיִל לְעֹלָה
  choice: và một con cừu đực làm lễ vật thiêu
  rationale: אַיִל là cừu đực; עֹלָה là thuật ngữ nghi lễ chỉ lễ vật được thiêu dâng.
- source_word: תְּמִימִם
  choice: cả hai đều không tì vết
  rationale: Tính từ số nhiều bổ nghĩa cho cả hai con vật; “cả hai” làm rõ phạm vi mà vẫn giữ tiêu chuẩn nghi lễ.
- source_word: וְהַקְרֵב
  choice: Hãy trình chúng ra
  rationale: Thể Hifil của קרב có nghĩa đem đến gần hoặc trình dâng trong bối cảnh thờ phượng. “Trình” tránh ngụ ý rằng hành động hiến tế đã hoàn tất, vì các thủ tục còn theo sau.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Diễn đạt trực tiếp ý ở trong sự hiện diện của Đức Chúa Trời và giữ nguyên danh giao ước được nêu trong bản Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản nguồn dùng trực tiếp danh riêng giao ước; phiên âm “Yahweh” giúp phân biệt danh này với tước hiệu “Chúa”.
- issue: Ý nghĩa nghi lễ của חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: “Lễ vật chuộc tội” là cách gọi dễ hiểu và quen thuộc trong tiếng Việt, nhưng từ Hê-bơ-rơ cũng có thể nhấn mạnh tác dụng thanh tẩy trong nghi lễ; không nên thu hẹp nó thành một lý thuyết chuộc tội riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng thuật ngữ nghi lễ nhất quán; giữ danh Yahweh theo bản nguồn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
