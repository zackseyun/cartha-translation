  terminology: “Các phần mỡ,” “thiêu,” và “bàn thờ” là các lựa chọn nhất quán, chính xác trong văn mạch tế lễ. “Các phần ức” nên thay cho “những miếng ức” để diễn đạt חָזוֹת như các phần ức dành trong nghi thức, không thêm chi tiết về cách cắt.
