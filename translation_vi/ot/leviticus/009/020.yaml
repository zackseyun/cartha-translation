base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/020.yaml
  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: vi
  text: Họ đặt các phần mỡ lên các phần ức, rồi ông thiêu các phần mỡ trên bàn thờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “làm cho các phần mỡ bốc khói trên bàn thờ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Họ đặt
  rationale: Động từ שׂים có nghĩa thông dụng là đặt, để. “Họ đặt” tự nhiên trong tiếng Việt và giữ nguyên chủ ngữ số nhiều của nguyên văn.
- source_word: הַחֲלָבִים
  choice: các phần mỡ
  rationale: Dạng số nhiều của חֵלֶב trong ngữ cảnh tế lễ chỉ những phần mỡ được tách ra để dâng; cách dịch này vừa cụ thể vừa giữ sắc thái số nhiều.
- source_word: עַל הֶחָזוֹת
  choice: lên những miếng ức
  rationale: Trong luật tế lễ, חָזֶה chỉ phần ức của con vật. “Những miếng ức” diễn đạt rõ đây là các phần thịt tế lễ, không phải lồng ngực nói chung.
- source_word: וַיַּקְטֵר
  choice: ông thiêu
  rationale: Trong ngữ cảnh tế lễ của sách Lê-vi, קטר chỉ việc thiêu lễ vật trên bàn thờ, làm cho nó bốc khói. “Thiêu” trang trọng, rõ nghĩa và phù hợp với hành động nghi lễ; chú thích giữ lại sắc thái sát chữ hơn.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Dạng có hậu tố chỉ hướng sau קטר được hiểu theo thành ngữ nghi lễ là nơi lễ vật được thiêu, nên tiếng Việt tự nhiên là “trên bàn thờ”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự chuyển đổi chủ ngữ từ số nhiều “họ” sang số ít “ông” như trong tiếng Hê-bơ-rơ. Dấu chú thích được đặt sau mệnh đề về việc thiêu, đúng với từ ngữ mà chú thích giải nghĩa.
