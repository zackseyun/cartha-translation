id: LEV.9.3
reference: Leviticus 9:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: vi
  text: 'Con hãy nói với con cái Y-sơ-ra-ên rằng: ‘Hãy lấy một con dê đực làm lễ vật chuộc tội[a], một con bê và một con chiên con, cả hai đều một tuổi và không tì vết, làm lễ thiêu.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”; trong các văn bản tư tế, từ Hê-bơ-rơ חַטָּאת có thể nhấn mạnh chức năng thanh tẩy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל תְּדַבֵּר
  choice: Con hãy nói với con cái Y-sơ-ra-ên
  rationale: Mệnh lệnh được nói với A-rôn trong ngữ cảnh trước; “con hãy nói” diễn đạt tự nhiên lực chỉ thị của thể vị hoàn 2ms. “Con cái Y-sơ-ra-ên” là cách gọi tập thể trang trọng, quen thuộc, đồng thời phản ánh thành ngữ Hê-bơ-rơ.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dùng từ dẫn lời trực tiếp tự nhiên trong tiếng Việt, thay vì dịch máy móc là “mà nói rằng”.
- source_word: קְחוּ
  choice: Hãy lấy
  rationale: Bảo toàn mệnh lệnh số nhiều hướng đến cộng đồng; “lấy” là nghĩa trực tiếp, không thêm ý về địa điểm phải đem tới.
- source_word: שְׂעִיר עִזִּים
  choice: một con dê đực
  rationale: Cụm từ chỉ rõ một con dê giống đực, là chi tiết có ý nghĩa trong quy định tế lễ.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ một loại lễ vật. “Lễ vật chuộc tội” dễ hiểu và quen thuộc, còn khả năng nhấn mạnh sự thanh tẩy được giữ trong chú thích.
- source_word: וְעֵגֶל וָכֶבֶשׂ
  choice: một con bê và một con chiên con
  rationale: Phân biệt đúng hai con vật; “bê” và “chiên con” là cách gọi rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּנֵי שָׁנָה תְּמִימִם
  choice: cả hai đều một tuổi và không tì vết
  rationale: Dạng số nhiều bổ nghĩa cho cả con bê lẫn con chiên; “cả hai đều” làm rõ phạm vi mà không thay đổi nội dung. “Không tì vết” diễn đạt tiêu chuẩn không có khuyết tật của sinh tế.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: Đây là thuật ngữ tế lễ chỉ sinh tế được thiêu trọn; “lễ thiêu” ngắn gọn, trang trọng và quen thuộc.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: người Y-sơ-ra-ên
  rationale: Giữ hình ảnh quan hệ dòng dõi trong thành ngữ Hê-bơ-rơ và cách gọi giao ước của cả cộng đồng, thay vì chuyển hoàn toàn thành tên dân tộc.
- issue: Ý nghĩa của חַטָּאת trong văn mạch tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ Hê-bơ-rơ vừa là tên một loại sinh tế thường gọi là lễ chuộc tội, vừa có thể nhấn mạnh chức năng thanh tẩy trong các văn bản tư tế. Bản chính dùng cách gọi dễ nhận biết; chú thích bảo tồn cách hiểu thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “con” vì người nói là Môi-se và người nhận mệnh lệnh là A-rôn theo ngữ cảnh liền trước; tránh lối dịch cổ “ngươi”. Dấu [a] được đặt ngay sau thuật ngữ liên quan.
