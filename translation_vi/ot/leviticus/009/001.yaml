  text: וַ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁמִינִ֔י קָרָ֣א מֹשֶׁ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו וּ/לְ/זִקְנֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: vi
  text: Vào ngày thứ tám, Môi-se gọi A-rôn, các con trai của A-rôn và các trưởng lão Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “triệu tập” thay cho “gọi”; động từ Hê-bơ-rơ này cũng có thể được hiểu theo nghĩa đó trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Đến
  rationale: Trong mạch kể chuyện, וַיְהִי chuyển sang một thời điểm mới. Tiếng Việt tự nhiên không cần dịch máy móc là “và đã xảy ra”; “Đến” kết hợp với cụm thời gian vẫn giữ rõ bước chuyển của trình thuật.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ngày thứ tám
  rationale: Dịch trực tiếp cụm chỉ thời gian, không thêm “sau đó”; bối cảnh cho biết đây là ngày tiếp theo sau bảy ngày làm lễ phong chức.
- source_word: קָרָא
  choice: gọi
  rationale: Động từ có thể mang nghĩa “gọi” hoặc “triệu tập”. “Gọi” là cách dịch trực tiếp, tự nhiên hơn, còn khả năng “triệu tập” được giữ trong chú thích.
- source_word: לְאַהֲרֹן
  choice: A-rôn
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: וּלְבָנָיו
  choice: các con trai ông
  rationale: Trong bối cảnh chức tế lễ, בָּנָיו chỉ các con trai của A-rôn; thêm “ông” làm rõ đại từ sở hữu mà tiếng Hê-bơ-rơ biểu thị.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: và các trưởng lão Israel
  rationale: Chỉ những người lãnh đạo hoặc đại diện cao niên được công nhận của Israel; “các trưởng lão Israel” là cách diễn đạt gọn và quen thuộc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu tiếng Việt lược bỏ công thức kể chuyện “và đã xảy ra” để tránh gượng ép, nhưng vẫn thể hiện bước chuyển thời gian bằng “Đến ngày thứ tám”. Dùng “Israel” theo dạng quốc tế hiện đại, còn các tên Môi-se và A-rôn theo lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
