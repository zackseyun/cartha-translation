revisions:
- from: Khi một ngoại kiều[a] cư ngụ với các ngươi trong xứ của các ngươi, các ngươi không được ngược đãi người ấy.[b]
  to: Khi một ngoại kiều[a] cư ngụ với ngươi trong xứ các ngươi, các ngươi không được ngược đãi người ấy.[b]
  rationale: Chỉ sửa «với các ngươi» thành «với ngươi» để bảo tồn hậu tố số ít của אִתְּךָ. Giữ «các ngươi» ở hai chỗ sau vì nguyên văn tại đó dùng số nhiều. Các chú thích và lựa chọn từ vựng khác phù hợp với ngữ nghĩa nguồn và tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
