id: LEV.19.33
reference: Leviticus 19:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִֽי יָג֧וּר אִתְּ/ךָ֛ גֵּ֖ר בְּ/אַרְצְ/כֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: vi
  text: Khi một ngoại kiều[a] cư ngụ với ngươi trong xứ các ngươi, các ngươi không được ngược đãi người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngoại kiều” dịch từ từ Hê-bơ-rơ ger, chỉ người không phải dân bản địa nhưng đang sống giữa cộng đồng Israel; cũng có thể dịch là “kiều dân” hoặc “người tạm trú.”
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “không được áp bức người ấy” hoặc “không được làm điều sai trái với người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Khi
  rationale: Mở đầu một trường hợp pháp lý có thể xảy ra; “Khi” tự nhiên trong tiếng Việt và không nhấn quá mức tính giả định.
- source_word: יָגוּר
  choice: cư ngụ
  rationale: Động từ גור chỉ việc sống tại một nơi với tư cách người không phải dân bản địa; “cư ngụ” trang trọng, hiện đại và diễn tả sự lưu trú tương đối ổn định.
- source_word: אִתְּךָ
  choice: với các ngươi
  rationale: Dịch sát giới từ “với”. Dù hậu tố ở số ít, mệnh đề tiếp theo chuyển sang số nhiều; dùng “các ngươi” giúp câu tiếng Việt nhất quán với lời truyền cho cộng đồng.
- source_word: גֵּר
  choice: ngoại kiều
  rationale: Chỉ người không phải dân bản địa nhưng đang cư trú giữa cộng đồng Israel. “Ngoại kiều” giữ được cả nét nghĩa ngoại quốc lẫn cư trú, dù cần chú thích để tránh cách hiểu thuần túy hành chính hiện đại.
- source_word: בְּאַרְצְכֶם
  choice: trong xứ của các ngươi
  rationale: “Xứ” giữ sắc thái lãnh thổ của cộng đồng giao ước; hậu tố số nhiều được thể hiện bằng “các ngươi”.
- source_word: לֹא תוֹנוּ
  choice: không được ngược đãi
  rationale: Dạng Hiphil của ינה có thể mang nghĩa làm điều sai trái, áp bức hoặc đối xử tệ. “Ngược đãi” rõ ràng, tự nhiên và đủ rộng; các khả năng “áp bức” và “làm thiệt hại” được giữ trong chú thích.
- source_word: אֹתוֹ
  choice: người ấy
  rationale: Đại từ giống đực số ít quy chiếu về גֵּר. Tiếng Việt không bắt buộc biểu thị giống; “người ấy” giữ số ít và sự quy chiếu mà không tạo sắc thái xa lạ của “hắn”.
theological_decisions:
- issue: Cách dịch גֵּר trong luật về sự thánh khiết của Israel
  choice: ngoại kiều
  alternative: người tạm trú; kiều dân; người ngoại quốc cư trú
  rationale: Thuật ngữ chỉ người không thuộc dân bản địa nhưng sống giữa Israel và nằm trong phạm vi bảo hộ xã hội-pháp lý của cộng đồng. “Ngoại kiều” truyền đạt gọn cả hai nét nghĩa; chú thích làm rõ rằng đây không chỉ là khách qua đường.
- issue: Phạm vi nghĩa của lệnh cấm לֹא תוֹנוּ
  choice: không được ngược đãi
  alternative: không được áp bức; không được làm điều sai trái với; không được làm thiệt hại
  rationale: Nguồn Hê-bơ-rơ cho phép một phạm vi nghĩa từ đối xử sai trái đến áp bức. Bản dịch chính dùng cách nói rộng, dễ hiểu, còn chú thích bảo tồn các sắc thái mạnh hoặc mang tính pháp lý hơn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. “Các ngươi” phản ánh lời truyền cho cộng đồng Israel và giữ sắc thái Kinh Thánh; “ngoại kiều” được chú thích vì trong tiếng Việt hiện đại từ này có thể gợi ngôn ngữ hành chính.
