  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa chính: גֵּר là người không phải bản địa đang cư trú, và lệnh לֹא תוֹנוּ cấm đối xử sai trái/ngược đãi. Tuy nhiên, אִתְּךָ mang hậu tố số ít («với ngươi»), trong khi בְּאַרְצְכֶם và lệnh cấm ở số nhiều. Bản nháp dùng «các ngươi» ở cả hai vị trí, làm mất sự chuyển đổi số ít–số nhiều có chủ ý trong tiếng Hê-bơ-rơ.'
  naturalness: «Khi một ngoại kiều cư ngụ với ngươi trong xứ các ngươi» vẫn tự nhiên trong văn phong Kinh Thánh–pháp luật trang trọng, đồng thời giữ được sự chuyển số của nguyên văn. «Ngoại kiều» có sắc thái hành chính hiện đại, nhưng chú thích văn hóa đã giải thích đầy đủ và cách dùng này vẫn có thể chấp nhận.
