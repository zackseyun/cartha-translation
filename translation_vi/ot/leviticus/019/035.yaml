  text: לֹא תַעֲשׂ֥וּ עָ֖וֶל בַּ/מִּשְׁפָּ֑ט בַּ/מִּדָּ֕ה בַּ/מִּשְׁקָ֖ל וּ/בַ/מְּשׂוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: vi
  text: Không được làm điều bất công khi phân xử[a], khi đo chiều dài, cân trọng lượng hay đong dung tích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Không được làm điều sai trái trong việc phán xét, đo lường, cân hoặc đong.”'
    reason: Giữ lại phạm vi nghĩa của מִשְׁפָּט (phán xét, phân xử, công lý) và cách diễn đạt sát cấu trúc các danh từ đo lường trong tiếng Hê-bơ-rơ.
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: Không được làm
  rationale: Diễn đạt tự nhiên một lệnh cấm dành cho số nhiều; không thêm đại từ xưng hô vốn không cần thiết trong tiếng Việt.
- source_word: עָוֶל
  choice: điều bất công
  rationale: Từ này chỉ sự sai trái, bất công hoặc gian lận; “điều bất công” phù hợp cả với việc phân xử lẫn các giao dịch đo lường.
- source_word: בַּמִּשְׁפָּט
  choice: khi phân xử
  rationale: מִשְׁפָּט có thể chỉ sự phán xét, việc phân xử hoặc công lý. “Khi phân xử” tự nhiên trong tiếng Việt và giữ sắc thái hành động mà không giới hạn vào một phiên tòa chính thức.
- source_word: בַּמִּדָּה
  choice: khi đo chiều dài
  rationale: מִדָּה là phép đo nói chung, thường liên quan đến chiều dài hoặc kích thước. Vì câu tiếp tục nêu riêng trọng lượng và dung tích, “đo chiều dài” giúp phân biệt ba loại phép đo.
- source_word: בַּמִּשְׁקָל
  choice: cân trọng lượng
  rationale: מִשְׁקָל chỉ trọng lượng hoặc việc cân; cách diễn đạt bằng động từ tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: וּבַמְּשׂוּרָה
  choice: đong dung tích
  rationale: מְשׂוּרָה chỉ đơn vị hoặc phép đo sức chứa. “Đong dung tích” bao quát hơn “đong chất lỏng” và phù hợp với ngữ cảnh thương mại.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ, trang trọng nhưng hiện đại. Lược đại từ chủ ngữ để tránh sắc thái cổ của “các ngươi” và không thêm quan hệ xưng hô không có trong nguyên văn; lệnh cấm vẫn rõ ràng trong tiếng Việt.
