revisions:
- from: Ngươi không được đi đây đi đó để vu khống giữa dân mình. Ngươi không được đứng chống lại máu của người lân cận mình.[a] Ta là Đức Giê-hô-va.
  to: Ngươi không được đi loan truyền lời phỉ báng giữa dân mình. Ngươi không được đứng chống lại mạng sống của người lân cận mình.[a] Ta là Yahweh.
  rationale: Sửa danh riêng Yahweh theo chính sách POB. Thay «đi đây đi đó để vu khống» bằng «đi loan truyền lời phỉ báng» để biểu đạt hành vi lưu truyền lời gây hại của רָכִיל mà không khẳng định quá mức rằng người nói trực tiếp bịa đặt. Thay «máu» bằng «mạng sống» trong chính văn để cụm tiếng Việt có nghĩa, vì דם tại đây có thể là hoán dụ chỉ mạng sống; chú thích bảo tồn cách đọc phổ biến về sự thờ ơ trước việc đổ máu. Không thêm một cách hiểu giáo phái hoặc pháp lý đặc thù.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:43Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng hai mệnh lệnh phủ định, cụm «giữa dân mình», hình ảnh «máu», và lời tự xưng của Đức Chúa Trời. Tuy nhiên, רָכִיל chỉ người đi loan truyền lời tố cáo/phỉ báng; «đi đây đi đó để vu khống» hơi thu hẹp sang hành vi trực tiếp vu khống hơn là lưu truyền chuyện phỉ báng. «Đứng chống lại máu» tuy sát từng từ nhưng không tự nhiên trong tiếng Việt và dễ tối nghĩa; cần vẫn giữ tính hàm súc của tiếng Hê-bơ-rơ mà không biến nó thành một kết luận diễn giải.
  naturalness: «Đi loan truyền lời phỉ báng» là cách diễn đạt tự nhiên, trang trọng và phản ánh rõ sắc thái lưu truyền của רָכִיל. «Đứng chống lại mạng sống của người lân cận» tự nhiên hơn «đứng chống lại máu», đồng thời vẫn bảo lưu hình ảnh pháp lý/đạo đức của cụm khó. Đại từ «ngươi» và văn phong mệnh lệnh phù hợp ngữ cảnh luật pháp.
  terminology: Danh riêng יהוה cần theo chính sách POB là «Yahweh», không phải «Đức Giê-hô-va». «Người lân cận» là tương đương phù hợp của רֵעֶךָ trong ngữ cảnh này. Dùng «mạng sống» trong chính văn cho דם là một hoán dụ tiếng Việt rõ nghĩa; chú thích giữ cách hiểu thay thế về «máu bị đổ» mà không quyết định dứt khoát toàn bộ phạm vi nghĩa.
  issues:
  - severity: medium
    issue: Danh danh יהוה được dịch là «Đức Giê-hô-va».
    rationale: Dấu vết quyết định tiếng Anh và chính sách dự án quy định phiên âm Tetragrammaton là «Yahweh». «Đức» cũng thêm một tước hiệu không có trong nguyên văn.
  - severity: medium
    issue: «Đi đây đi đó để vu khống» có thể thu hẹp nghĩa của רָכִיל.
    rationale: Từ này nhấn mạnh việc đi quanh cộng đồng để truyền các lời tố cáo hoặc phỉ báng gây hại, không nhất thiết là người nói lời vu khống do chính mình bịa ra.
  - severity: medium
    issue: «Đứng chống lại máu của người lân cận mình» không tự nhiên và khó hiểu trong tiếng Việt hiện đại.
    rationale: Cụm עמד על דם là thành ngữ Hê-bơ-rơ khó; bản dịch cần duy trì sự dè dặt diễn giải, nhưng tiếng Việt vẫn phải truyền đạt được đối tượng bị đe dọa là mạng sống của người lân cận. Chú thích giữ cách hiểu «đứng nhìn».
