source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: vi
  text: Ngươi không được đi loan truyền lời phỉ báng giữa dân mình. Ngươi không được đứng chống lại mạng sống của người lân cận mình.[a] Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ngươi không được đứng nhìn khi máu của người lân cận mình bị đổ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: đi đây đi đó để vu khống
  rationale: Giữ hình ảnh đi lại của הלך trong thành ngữ, đồng thời diễn đạt רָכִיל là việc lan truyền những lời gây tổn hại; cách nói này tự nhiên và nghiêm trang hơn từ “ngồi lê đôi mách”.
- source_word: בְּעַמֶּיךָ
  choice: giữa dân mình
  rationale: בְּ chỉ phạm vi sinh hoạt trong cộng đồng, còn עַמֶּיךָ là dân của người được truyền lệnh.
- source_word: תַעֲמֹד עַל דַּם
  choice: đứng chống lại máu
  rationale: Giữ động từ “đứng” và hình ảnh cụ thể “máu”; dịch עַל là “chống lại” trong chính văn, nhưng không xóa bỏ cách hiểu khác của cụm từ khó này.
- source_word: רֵעֶךָ
  choice: người lân cận mình
  rationale: Trong luật đạo đức này, רֵעַ chỉ người đồng loại hay thành viên cùng cộng đồng; “người lân cận” là cách dịch quen thuộc và có sắc thái trang trọng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Ý nghĩa của לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  choice: 'Giữ cách diễn đạt sát hình ảnh Hê-bơ-rơ: “không được đứng chống lại máu của người lân cận mình.”'
  alternative: “Không được đứng nhìn khi máu của người lân cận mình bị đổ,” tức không thờ ơ khi mạng sống người ấy gặp nguy hiểm.
  rationale: Cụm Hê-bơ-rơ cô đọng và có thể nói đến hành động thù nghịch, sự đồng lõa, hoặc thái độ khoanh tay trước nguy cơ chết người. Chính văn giữ sự căng thẳng ấy; chú thích nêu cách hiểu phổ biến về việc không được đứng nhìn.
translation_notes:
  register: Văn phong luật pháp trang nghiêm, trực tiếp và dễ hiểu. Dùng đại từ “ngươi” phù hợp lời phán trực tiếp trong Ngũ Kinh; tránh thành ngữ quá khẩu ngữ. Dấu chú thích [a] được đặt ngay sau mệnh đề có cách hiểu khác.
