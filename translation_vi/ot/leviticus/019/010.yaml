revisions:
- from: Ngươi không được hái vét vườn nho mình[a], cũng không được nhặt những trái nho rơi trong vườn; hãy để chúng lại cho người nghèo và ngoại kiều cư ngụ giữa các ngươi[b]. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  to: Ngươi không được hái vét vườn nho của ngươi[a], cũng không được nhặt những trái nho rơi trong vườn nho của ngươi; hãy để chúng lại cho người nghèo và người ngoại kiều[b]. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  rationale: Bản sửa loại bỏ phần giải thích không được phát biểu trực tiếp trong nguyên văn, chuyển nó vào chú thích, và điều chỉnh cách diễn đạt sở hữu cho tự nhiên hơn. Các lựa chọn “hái vét”, “nhặt những trái nho rơi”, “người nghèo”, “Yahweh” và công thức giao ước được giữ nguyên vì phù hợp với tiếng Hê-bơ-rơ và bản kiểm chứng tiếng Anh.
  reviewer_model: gpt-5.6-terra
