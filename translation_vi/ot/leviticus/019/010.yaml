source:
  edition: WLC
  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: vi
  text: Ngươi không được hái vét vườn nho của ngươi[a], cũng không được nhặt những trái nho rơi trong vườn nho của ngươi; hãy để chúng lại cho người nghèo và người ngoại kiều[b]. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được quay lại mót vườn nho của ngươi.” Động từ Hê-bơ-rơ chỉ việc đi qua các dây nho lần nữa để lấy những gì còn lại sau đợt thu hoạch chính.'
    reason: lexical_alternative
  - marker: b
    text: “Người ngoại kiều” chỉ người không thuộc dân bản địa nhưng đang cư trú trong cộng đồng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: vườn nho mình
  rationale: כֶּרֶם chỉ vườn trồng nho; “vườn nho” là cách gọi tự nhiên và chính xác trong tiếng Việt.
- source_word: תְעוֹלֵל
  choice: hái vét
  rationale: Trong ngữ cảnh này, động từ nói đến việc quay lại hái hết những gì còn sót trên dây nho sau đợt thu hoạch chính. “Hái vét” diễn đạt rõ hành vi thu hoạch đến mức không chừa lại.
- source_word: פֶּרֶט
  choice: những trái nho rơi
  rationale: פֶּרֶט chỉ những trái bị tách ra, rơi hoặc sót lại trong lúc thu hoạch; cách dịch cụ thể này phù hợp với ngữ cảnh vườn nho.
- source_word: תְלַקֵּט
  choice: nhặt
  rationale: לקט là thu gom hoặc nhặt lấy; đi với nho rơi, “nhặt” tự nhiên và cụ thể hơn “thu gom”.
- source_word: לֶעָנִי
  choice: cho người nghèo
  rationale: עָנִי chỉ người nghèo khó hoặc khốn cùng; “người nghèo” trực tiếp và phù hợp với văn bản luật pháp.
- source_word: וְלַגֵּר
  choice: và ngoại kiều cư ngụ giữa các ngươi
  rationale: גֵּר là người không thuộc dân bản địa nhưng sống lâu dài giữa cộng đồng Israel. Cụm này giữ cả yếu tố ngoại lai lẫn tư cách cư trú, tránh nghĩa quá rộng của “người nước ngoài”.
- source_word: תַּעֲזֹב אֹתָם
  choice: hãy để chúng lại
  rationale: עזב ở đây có nghĩa để lại sản vật cho người khác, không phải bỏ mặc theo nghĩa tuyệt đối.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Diễn đạt trực tiếp công thức giao ước אֲנִי יְהוָה אֱלֹהֵיכֶם và giữ số nhiều của đại từ sở hữu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH; phiên âm “Yahweh” bảo tồn chức năng tên giao ước thay vì thay bằng tước hiệu.
- issue: Phạm vi nghĩa của גֵּר
  choice: ngoại kiều cư ngụ giữa các ngươi
  alternative: người ngoại quốc hoặc kiều dân
  rationale: Cách dịch này không biến גֵּר thành bất kỳ người nước ngoài nào, nhưng nêu rõ đó là người không bản địa đang sống trong cộng đồng Israel.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “ngươi/các ngươi” để phản ánh sự chuyển đổi từ mệnh lệnh số ít sang công thức kết thúc số nhiều trong nguyên văn. “Hái vét” và “nhặt những trái nho rơi” giúp độc giả phổ thông hình dung hai hành vi bị cấm mà không làm mất sắc thái nông nghiệp.
