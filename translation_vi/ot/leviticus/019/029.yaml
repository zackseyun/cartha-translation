  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: vi
  text: Đừng làm ô nhục con gái mình bằng cách biến nó thành gái mại dâm,[a] kẻo xứ sở hành dâm[b] và xứ sở sẽ đầy dẫy sự đồi bại.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng cách khiến nó làm nghề mại dâm” hoặc “bằng cách đem nó làm gái mại dâm”. Động từ Hê-bơ-rơ ở thể khiến.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “kẻo xứ sở hành dâm”. Đây là cách nói ẩn dụ về việc cả cộng đồng trở nên băng hoại.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “sự dâm loạn” hoặc “sự gian ác”. Từ Hê-bơ-rơ chỉ sự đồi bại nghiêm trọng, thường trong bối cảnh tình dục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: làm ô uế
  rationale: Động từ חלל ở thể Piel mang nghĩa làm cho trở nên phàm tục hoặc xúc phạm điều thuộc phạm vi thánh. “Làm ô uế” vừa tự nhiên trong tiếng Việt vừa giữ được trường nghĩa thánh–tục xuyên suốt sách Lê-vi.
- source_word: בִּתְּךָ
  choice: con gái mình
  rationale: Giữ nguyên danh từ số ít và ngôi thứ hai giống đực số ít; “mình” tự nhiên trong câu mệnh lệnh tiếng Việt.
- source_word: לְהַזְנוֹתָהּ
  choice: bằng cách đẩy nó vào con đường mại dâm
  rationale: Đây là động từ זנה ở thể Hiphil, nguyên mẫu với hậu tố giống cái số ít, nên phải giữ sắc thái khiến hoặc đưa người con gái vào việc mại dâm. Cách diễn đạt này tự nhiên hơn “làm cho nó hành dâm” mà không thu hẹp thành một cơ chế cưỡng bức cụ thể.
- source_word: תִזְנֶה הָאָרֶץ
  choice: xứ sở hành dâm
  rationale: Giữ nguyên ẩn dụ mạnh của bản Hê-bơ-rơ, trong đó chính xứ sở được nói như một chủ thể hành dâm; không làm phẳng nghĩa thành sự suy đồi chung chung.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: và xứ sở đầy dẫy
  rationale: Diễn đạt hệ quả tiếp theo của lời cảnh báo, đồng thời giữ sự lặp lại của הָאָרֶץ trong nguyên văn.
- source_word: זִמָּה
  choice: sự đồi bại
  rationale: Từ này chỉ hành vi hoặc ý đồ xấu xa, đáng ghê tởm, thường có sắc thái tình dục trong Lê-vi. “Sự đồi bại” giữ được phạm vi đạo đức rộng mà vẫn phù hợp với ngữ cảnh.
theological_decisions:
- issue: Cách chuyển ẩn dụ xứ sở “hành dâm”
  choice: Giữ ẩn dụ bằng cụm “xứ sở hành dâm”.
  alternative: xứ sở trở nên vô luân; xứ sở sa vào nạn mại dâm
  rationale: Nguyên văn nhân cách hóa xứ sở và dùng chính động từ זנה. Giữ ẩn dụ bảo toàn sức nặng tu từ và mối liên hệ giữa tội cá nhân với sự băng hoại của toàn cộng đồng, nhưng không áp đặt một hệ giải thích thần học về sau.
- issue: Có nên dùng từ thuộc trường nghĩa thánh–tục cho חלל hay không
  choice: Dùng “làm ô uế”.
  alternative: làm nhục; xúc phạm
  rationale: Trong bối cảnh Lê-vi, חלל gắn với sự đối lập giữa thánh và phàm. “Làm ô uế” duy trì bối cảnh ấy rõ hơn “làm nhục”, đồng thời dễ hiểu hơn cách nói trừu tượng “làm thành phàm tục”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Xứ sở” được dùng thay vì “đất” để người đọc nhận ra ý nghĩa cộng đồng mà vẫn giữ hình ảnh הָאָרֶץ; sự lặp lại “xứ sở” phản ánh nguyên văn. Các dấu chú thích [a], [b], [c] đều xuất hiện ngay sau cụm từ liên quan.
