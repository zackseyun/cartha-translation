id: LEV.19.15
reference: Leviticus 19:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: vi
  text: Các ngươi không được làm điều bất công khi xét xử. Không được thiên vị người nghèo, cũng không được nể mặt người quyền thế; hãy lấy sự công chính mà xét xử người lân cận mình.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy xét xử người lân cận mình một cách công bằng.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn hai thành ngữ Hê-bơ-rơ là “nâng mặt người nghèo” và “tôn mặt người quyền thế”, chỉ sự thiên vị hoặc nể nang khi xét xử.
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל
  choice: điều bất công
  rationale: Trong ngữ cảnh pháp lý, từ này chỉ hành vi sai trái làm lệch công lý; cách dịch này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: בַּמִּשְׁפָּט
  choice: khi xét xử
  rationale: Cụm từ nói đến hoạt động phán xét trong một vụ việc pháp lý, nên dịch bằng cấu trúc động từ tự nhiên hơn là danh từ trừu tượng.
- source_word: תִשָּׂא פְנֵי דָל
  choice: thiên vị người nghèo
  rationale: Thành ngữ nguyên văn là “nâng mặt người nghèo”, mang nghĩa dành sự ưu ái thiên lệch khi xét xử.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: nể mặt người quyền thế
  rationale: Giữ được hình ảnh “mặt” của nguyên ngữ trong một thành ngữ Việt tự nhiên, đồng thời truyền đạt sự thiên vị vì địa vị xã hội.
- source_word: גָדוֹל
  choice: người quyền thế
  rationale: Ở đây từ này chỉ người có địa vị hoặc ảnh hưởng lớn, không đơn thuần nói đến kích thước hay sự giàu có.
- source_word: בְּצֶדֶק
  choice: lấy sự công chính
  rationale: צֶדֶק bao hàm cả chiều kích đạo đức lẫn pháp lý; “sự công chính” giữ được bề rộng ấy, còn “công bằng” được ghi nhận trong chú thích.
- source_word: תִּשְׁפֹּט
  choice: hãy ... xét xử
  rationale: Hình thức vị lai trong luật pháp có lực mệnh lệnh; tiếng Việt diễn đạt tự nhiên bằng “hãy”.
- source_word: עֲמִיתֶךָ
  choice: người lân cận mình
  rationale: Chỉ người đồng cộng đồng, người cùng sống trong quan hệ xã hội; “người lân cận” cũng phù hợp với mạch văn Lê-vi Ký 19.
theological_decisions:
- issue: Nghĩa của צֶדֶק trong bối cảnh pháp lý và đạo đức
  choice: lấy sự công chính
  alternative: một cách công bằng
  rationale: Bản chính giữ chiều kích đạo đức rộng hơn của danh từ Hê-bơ-rơ, trong khi chú thích bảo lưu cách hiểu trực tiếp theo pháp lý.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “các ngươi” để phản ánh lời truyền cho toàn thể cộng đồng; các mệnh đề sau lược chủ ngữ nhằm tránh nặng nề. “Nể mặt” vừa tự nhiên trong tiếng Việt vừa bảo tồn phần nào hình ảnh thành ngữ Hê-bơ-rơ.
