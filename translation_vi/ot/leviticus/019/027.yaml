id: LEV.19.27
reference: Leviticus 19:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹ֣א תַקִּ֔פוּ פְּאַ֖ת רֹאשְׁ/כֶ֑ם וְ/לֹ֣א תַשְׁחִ֔ית אֵ֖ת פְּאַ֥ת זְקָנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: vi
  text: Các ngươi không được cắt phần tóc ở rìa đầu mình thành hình tròn[a][b], cũng không được làm hỏng phần rìa râu mình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phần tóc ở hai bên đầu” hoặc “các góc/rìa đầu”. Từ Hê-bơ-rơ có thể chỉ rìa, phía bên hoặc góc.
    reason: lexical_alternative
  - marker: b
    text: Có lẽ nói đến việc cạo hoặc tỉa tóc quanh rìa đầu thành hình tròn.
    reason: cultural_note
  - marker: c
    text: Hay “phá hỏng”, “hủy hoại” hoặc “làm biến dạng phần rìa râu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: cắt tròn
  rationale: Dạng Hiphil của נקף trong ngữ cảnh này chỉ việc cắt tóc theo vòng tròn quanh rìa đầu; “cắt tròn” diễn đạt hành động cụ thể mà không xác định quá mức là cạo hay tỉa.
- source_word: פְּאַת
  choice: rìa
  rationale: פֵּאָה có nghĩa là rìa, mép, phía bên hoặc góc. “Rìa” dùng được tự nhiên trong cả hai vế và giữ sự lặp lại của từ Hê-bơ-rơ.
- source_word: רֹאשְׁכֶם
  choice: đầu mình
  rationale: 'Hậu tố số nhiều hướng đến cả cộng đồng. Trong tiếng Việt, “các ngươi ... đầu mình” truyền đạt tự nhiên ý phân phối: mỗi người đối với đầu của chính mình.'
- source_word: תַשְׁחִית
  choice: làm hỏng
  rationale: Dạng Hiphil của שׁחת có nghĩa làm hư, phá hỏng hoặc hủy hoại. “Làm hỏng” giữ sắc thái mạnh nhưng không hàm ý rằng bộ râu bị tiêu hủy hoàn toàn.
- source_word: זְקָנֶךָ
  choice: bộ râu mình
  rationale: Cách dịch trực tiếp זָקָן; hậu tố số ít phù hợp với việc chuyển từ lời nói với cộng đồng sang cách nói phân phối về từng cá nhân.
- source_word: לֹא ... וְלֹא
  choice: không được ... cũng không được ...
  rationale: Cấu trúc này thể hiện rõ sức nặng cấm đoán của điều luật trong tiếng Việt hiện đại, trang trọng mà dễ hiểu.
theological_decisions:
- issue: Bản chất của điều cấm
  choice: Diễn đạt như lệnh cấm cụ thể đối với hai cách xử lý tóc và râu, không đưa động cơ vào chính văn.
  alternative: Giải thích đây riêng biệt là lệnh cấm nghi thức tang chế ngoại giáo, hoặc rộng hơn là mọi kiểu chải chuốt gắn với các dân tộc chung quanh.
  rationale: Câu Hê-bơ-rơ nêu hành động bị cấm nhưng không nói rõ lý do. Bản dịch vì thế giữ sự dè dặt, không áp đặt một cách giải thích văn hóa hay thần học.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Các ngươi” giữ lời truyền trực tiếp đến cộng đồng, còn “mình” diễn đạt quan hệ phân phối tự nhiên trong tiếng Việt. Các dấu chú thích được đặt ngay sau những cụm từ liên quan và theo thứ tự a, b, c.
