- from: Các ngươi không được cắt tròn tóc quanh rìa đầu mình[a][b], cũng không được làm hỏng rìa bộ râu mình[c].
  to: Các ngươi không được cắt phần tóc ở rìa đầu mình thành hình tròn[a][b], cũng không được làm hỏng phần rìa râu mình[c].
  rationale: Sửa tối thiểu để làm rõ đối tượng của hành động “cắt tròn” và cải thiện văn phong tiếng Việt. Bản sửa vẫn giữ tính mơ hồ cần thiết về kỹ thuật xử lý tóc/râu và không đưa vào chính văn bất cứ lý giải nào về động cơ của lệnh cấm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:53Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hai mệnh lệnh phủ định và không thêm động cơ văn hóa hay nghi lễ. Tuy nhiên, “cắt tròn tóc quanh rìa đầu” không tự nhiên và có thể khiến hành động bị hiểu là cắt tóc ở khu vực quanh đầu, thay vì làm cho phần rìa/biên tóc thành tròn. Bản sửa diễn đạt rõ hơn mà không quy định phương pháp là cạo hay tỉa.
  naturalness: “Phần tóc ở rìa đầu” và “phần rìa râu” tự nhiên, dễ hiểu hơn “tóc quanh rìa đầu” và “rìa bộ râu”, đồng thời vẫn giữ được sự song song của פְּאַת trong hai vế.
  terminology: 'Giữ “Các ngươi không được” cho sắc thái luật pháp trực tiếp. “Làm hỏng” phản ánh thận trọng Hiphil של שׁחת, không áp đặt nghĩa “cạo” hoặc “cắt xén”. Chú thích được chỉnh để nêu đúng phạm vi ngữ nghĩa của פֵּאָה: rìa, phía bên, góc.'
