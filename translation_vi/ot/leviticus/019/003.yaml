id: LEV.19.3
reference: Leviticus 19:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: vi
  text: Mỗi người[a] phải kính sợ[b] mẹ và cha mình, và các ngươi phải giữ các ngày sa-bát của Ta. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng danh từ giống đực số ít, sát nghĩa là “mỗi người nam”, theo nghĩa phân phối cho cộng đồng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tôn kính” hoặc “kính nể”; động từ Hê-bơ-rơ có thể chỉ sự sợ hãi theo nghĩa tôn kính và kính nể.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Mỗi người
  rationale: Danh từ số ít được dùng theo nghĩa phân phối cho toàn thể cộng đồng. “Mỗi người” truyền đạt tự nhiên phạm vi áp dụng trong tiếng Việt; hình thức giống đực của nguyên ngữ được ghi rõ trong chú thích.
- source_word: אִמּוֹ וְאָבִיו
  choice: mẹ và cha mình
  rationale: Giữ nguyên hai danh xưng thân thuộc và thứ tự khác thường mẹ trước cha, thay vì gộp thành “cha mẹ”.
- source_word: תִּירָאוּ
  choice: phải kính sợ
  rationale: Động từ ירא bao gồm cả sự sợ hãi lẫn lòng tôn kính, kính nể. “Kính sợ” bảo toàn sức nặng của từ và phù hợp với bổn phận đối với cha mẹ mà không giản lược thành chỉ “tôn kính”.
- source_word: שַׁבְּתֹתַי
  choice: các ngày sa-bát của Ta
  rationale: Giữ rõ hình thức số nhiều và sở hữu cách của nguyên ngữ; “ngày sa-bát” là cách nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: תִּשְׁמֹרוּ
  choice: phải giữ
  rationale: Trong ngữ cảnh ngày sa-bát, שׁמר chỉ việc tuân giữ, cẩn thận thực hành. “Giữ” ngắn gọn và duy trì sắc thái giao ước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp với công thức giao ước trong câu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Dù אֱלֹהִים có hình thái số nhiều, ở đây từ này quy chiếu số ít đến Đức Chúa Trời của Israel và đi với danh Yahweh.
theological_decisions:
- issue: Sắc thái tình cảm và đạo đức trong mệnh lệnh đối với cha mẹ
  choice: kính sợ mẹ và cha mình
  alternative: tôn kính mẹ và cha mình
  rationale: “Kính sợ” giữ được cả yếu tố kính trọng lẫn sự kính nể của ירא; “tôn kính” tự nhiên hơn nhưng làm nhẹ một phần sức mạnh từ vựng.
- issue: Cách biểu đạt giống trong danh từ phân phối mở đầu
  choice: Mỗi người
  alternative: Mỗi người nam
  rationale: אִישׁ mang hình thức giống đực số ít, nhưng được dùng phân phối trong lời truyền cho cộng đồng. Tiếng Việt không bắt buộc đánh dấu giống ở “người”; bản dịch chính diễn đạt phạm vi áp dụng tự nhiên, còn chú thích bảo lưu hình thức nguyên ngữ.
- issue: Danh xưng giao ước יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Dùng danh riêng giúp phân biệt יהוה với tước hiệu và bảo toàn cách tự xưng trực tiếp trong công thức “Ta là Yahweh, Đức Chúa Trời của các ngươi”.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “các ngươi” để phản ánh các động từ và đại từ sở hữu số nhiều hướng đến toàn cộng đồng, đồng thời dùng “mình” ở mệnh đề đầu để diễn đạt tự nhiên cấu trúc phân phối số ít. Giữ thứ tự “mẹ và cha”, số nhiều “các ngày sa-bát”, và danh riêng “Yahweh”.
