source:
  edition: WLC
  text: בְּ/י֧וֹם זִבְחֲ/כֶ֛ם יֵאָכֵ֖ל וּ/מִֽ/מָּחֳרָ֑ת וְ/הַ/נּוֹתָר֙ עַד י֣וֹם הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: vi
  text: Thịt ấy phải được ăn trong ngày anh em dâng sinh tế và ngày hôm sau; nhưng phần còn lại đến ngày thứ ba phải bị thiêu trong lửa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם
  choice: trong ngày
  rationale: Giới từ בְּ cùng יוֹם chỉ thời gian; “trong ngày” tự nhiên trong tiếng Việt và diễn đạt rằng thịt được ăn ngay ngày dâng lễ.
- source_word: זִבְחֲכֶם
  choice: anh em dâng sinh tế
  rationale: זֶבַח chỉ sinh tế, tức lễ vật được giết để dâng. Chuyển danh ngữ thành mệnh đề giúp câu tiếng Việt tự nhiên mà vẫn giữ rõ bối cảnh tế lễ.
- source_word: יֵאָכֵל
  choice: Thịt ấy phải được ăn
  rationale: Niphal biểu thị thể bị động; “phải được ăn” giữ sắc thái quy định của văn bản luật. “Thịt ấy” được bổ sung từ ngữ cảnh để đối tượng được rõ ràng.
- source_word: וּמִמָּחֳרָת
  choice: và ngày hôm sau
  rationale: מָחֳרָת là ngày kế tiếp. Cách dịch này hiện đại, rõ ràng và phù hợp chuỗi thời gian trong câu.
- source_word: וְהַנּוֹתָר
  choice: nhưng phần còn lại
  rationale: Phân từ này chỉ phần thức ăn còn dư; “nhưng” diễn đạt tự nhiên sự chuyển sang quy định tương phản về phần còn lại.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: đến ngày thứ ba
  rationale: עַד đánh dấu giới hạn thời gian; “đến ngày thứ ba” giữ được ý nghĩa trực tiếp mà không quyết định quá mức thời điểm cụ thể trong ngày.
- source_word: בָּאֵשׁ
  choice: trong lửa
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ, nơi בְּ với אֵשׁ mô tả việc tiêu hủy bằng cách đốt trong lửa.
- source_word: יִשָּׂרֵף
  choice: phải bị thiêu
  rationale: Niphal là thể bị động, còn “phải” truyền đạt sức nặng quy định của thể luật pháp.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại và dễ hiểu. Dùng “anh em” làm đại từ số nhiều cộng đồng; “sinh tế” giữ sắc thái tế tự và phân biệt với việc giết mổ thông thường.
