  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: vi
  text: Các ngươi không được rạch mình vì người chết[a], cũng không được xăm mình[b]. Ta là Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì một người đã chết.” Cụm từ Hê-bơ-rơ mang tính thành ngữ và thường chỉ việc than tang cho người chết.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “khắc một dấu trên thân thể mình,” “dấu xăm.” Cụm từ Hê-bơ-rơ này hiếm gặp và có lẽ chỉ một dấu bền lâu trên thân thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: rạch mình
  rationale: Danh từ chỉ vết rạch hay hành vi rạch vào thân thể; cách nói này tự nhiên trong tiếng Việt và không xác định quá mức về dụng cụ hay độ sâu.
- source_word: לָנֶפֶשׁ
  choice: vì người chết
  rationale: Trong ngữ cảnh luật lệ này, cụm từ là một thành ngữ chỉ người đã chết, đặc biệt liên quan đến việc than tang.
- source_word: בִּבְשַׂרְכֶם
  choice: mình
  rationale: Nghĩa đen là “thịt/thân xác”; trong cụm “rạch mình”, tiếng Việt diễn đạt rõ và tự nhiên việc rạch trên thân thể.
- source_word: כְתֹבֶת קַעֲקַע
  choice: xăm dấu
  rationale: Cụm từ hiếm, chỉ một dấu được khắc hoặc ghi bền lâu trên thân thể; “xăm dấu” giữ được ý về dấu trên da mà không khẳng định quá chi tiết kỹ thuật thực hiện.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: không được ... trên mình
  rationale: Động từ נתן với giới từ ב diễn tả việc đặt hoặc tạo dấu trên thân thể; cấu trúc này là mệnh lệnh cấm tự nhiên trong tiếng Việt.
- source_word: אֲנִי יְהוָה
  choice: Ta là Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước YHWH bằng dạng phiên âm quen thuộc “Đức Giê-hô-va”, đồng thời bảo toàn công thức tự xưng ngắn gọn của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Phạm vi của lệnh cấm về việc tạo dấu trên thân thể
  choice: 'Dịch trực tiếp hai hành vi: rạch mình vì người chết và xăm dấu trên mình, không thêm lời giới hạn hay mở rộng.'
  alternative: Hiểu cả hai hành vi chỉ thuộc nghi thức tang chế ngoại giáo, hoặc diễn giải câu này thành lệnh cấm minh nhiên đối với mọi hình thức xăm trong mọi nền văn hóa.
  rationale: Cụm “vì người chết” gắn rõ với lệnh cấm thứ nhất nhưng không được lặp lại ở lệnh cấm thứ hai. Bản dịch bảo tồn cấu trúc và sức căng của nguyên văn, không đưa kết luận áp dụng thần học vào câu chữ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. “Các ngươi” duy trì lời phán trực tiếp ở số nhiều; “rạch mình” và “xăm dấu trên mình” là cách diễn đạt hiện đại, rõ nghĩa. Các ký hiệu [a], [b] đều xuất hiện trong chính văn.
