id: LEV.19.12
reference: Leviticus 19:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: vi
  text: Các ngươi không được nhân danh Ta mà thề gian, làm ô danh Đức Chúa Trời của mình.[a] Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát chữ hơn: “Các ngươi không được nhân danh Ta mà thề cho sự giả dối, và làm ô uế danh Đức Chúa Trời của mình.”'
    reason: Giữ cách diễn đạt sát chữ của לַשָּׁקֶר và nghĩa trực tiếp hơn của חלל, đồng thời cho thấy liên từ Hê-bơ-rơ cũng có thể được hiểu là phép nối đơn thuần.
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: thề
  rationale: Dạng Nifal của שׁבע trong ngữ cảnh luật pháp chỉ việc thề hoặc lập lời thề; “không được… thề” diễn đạt tự nhiên sức mạnh cấm đoán.
- source_word: בִשְׁמִי
  choice: nhân danh Ta
  rationale: Giới từ ב đi với “danh” trong ngữ cảnh lời thề chỉ danh được viện đến làm căn cứ; “nhân danh Ta” là cách nói tự nhiên trong tiếng Việt.
- source_word: לַשָּׁקֶר
  choice: thề gian
  rationale: Cụm này sát chữ là “cho sự giả dối”; “thề gian” truyền đạt gọn và đúng nghĩa việc thề dối, còn cách dịch sát chữ được giữ trong chú thích.
- source_word: וְחִלַּלְתָּ
  choice: làm ô danh
  rationale: Piel của חלל mang nghĩa xúc phạm hoặc làm ô uế điều thánh. Với tân ngữ là “danh”, “làm ô danh” vừa tự nhiên vừa giữ được ý làm tổn hại sự thánh khiết và uy danh của Đức Chúa Trời.
- source_word: שֵׁם
  choice: danh
  rationale: Giữ hình ảnh “danh” vì từ này chỉ danh xưng, uy tín và căn tính được bày tỏ của Đức Chúa Trời.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của mình
  rationale: Dù אֱלֹהִים có hình thức số nhiều, ngữ cảnh và hậu tố số ít chỉ Đức Chúa Trời duy nhất của Israel. “Của mình” quy chiếu tự nhiên về chủ thể số nhiều “các ngươi”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng יהוה thay vì thay thế bằng một tước hiệu, qua đó giữ danh giao ước xuất hiện trực tiếp trong bản Hê-bơ-rơ.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ giữa lời thề gian và việc xúc phạm danh Đức Chúa Trời
  choice: 'Phối hợp có sắc thái hậu quả: “thề gian, làm ô danh…”'
  alternative: 'Phối hợp đơn thuần: “thề gian và làm ô danh…”'
  rationale: Liên từ וְ có thể là phép nối đơn thuần, nhưng trong mạch luật này vế sau nêu hệ quả của hành vi ở vế trước. Dấu phẩy giữ liên hệ ấy mà không giải thích quá mức.
- issue: Ý nghĩa của חלל khi đi với “danh”
  choice: làm ô danh
  alternative: xúc phạm sự thánh khiết của danh
  rationale: “Làm ô danh” là thành ngữ tiếng Việt tự nhiên và truyền đạt sự xúc phạm danh thánh; cách dài hơn làm rõ sắc thái thiêng thánh nhưng bổ sung nhiều lời hơn nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. “Các ngươi” phản ánh đối tượng số nhiều của mệnh lệnh và tạo sắc thái giao ước; “Ta” viết hoa để chỉ Đức Chúa Trời. “Thề gian” và “làm ô danh” là các cách nói gọn, dễ hiểu trong tiếng Việt hiện đại.
