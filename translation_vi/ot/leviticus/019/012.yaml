  naturalness: Văn câu luật pháp trang trọng nhưng hiện đại và trôi chảy. “Các ngươi,” “Ta,” “nhân danh Ta,” và “thề gian” phù hợp ngữ cảnh giao ước/lập pháp. Cụm “Đức Chúa Trời của mình” quy chiếu được đến chủ ngữ số nhiều trong tiếng Việt, dù nguyên ngữ chuyển sang số ít ở động từ vế hai.
  terminology: 'Các thuật ngữ then chốt được xử lý nhất quán: “danh,” “Đức Chúa Trời,” và “Yahweh.” Không thay danh Yahweh bằng một tước hiệu. Chú thích giữ đúng lựa chọn sát chữ “cho sự giả dối” và nêu hợp lý khả năng liên từ chỉ phối hợp đơn thuần.'
