  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: vi
  text: Ngươi không được áp bức người lân cận mình, cũng không được cướp đoạt người lân cận mình. Ngươi không được giữ tiền công của người làm thuê cho đến sáng hôm sau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: áp bức
  rationale: Động từ עָשַׁק chỉ sự áp bức, thường bao hàm việc lạm dụng quyền thế hoặc giữ lại điều đáng phải trả; “áp bức” giữ được phạm vi đạo đức rộng của từ.
- source_word: רֵעֲךָ
  choice: người lân cận mình
  rationale: Trong ngữ cảnh luật pháp và đạo đức, רֵעַ chỉ người đồng loại hay thành viên khác trong cộng đồng; “người lân cận” vừa quen thuộc trong văn mạch Kinh Thánh vừa dễ hiểu.
- source_word: תִגְזֹל
  choice: cướp đoạt của họ
  rationale: גָּזַל nói đến việc chiếm lấy trái phép, thường bằng sức mạnh; “cướp đoạt” diễn đạt rõ sắc thái mạnh hơn hành vi trộm cắp nói chung. Đại từ “họ” dùng theo lối hiện đại để quy chiếu tự nhiên về “người lân cận” mà không ấn định giới tính.
- source_word: תָלִין
  choice: không được giữ lại
  rationale: Động từ ở ngôi thứ ba giống cái, hòa hợp với פְּעֻלַּת, có nghĩa đen là “qua đêm”; trong tiếng Việt, “không được giữ lại” diễn đạt tự nhiên hành vi trì hoãn trả công, còn giới hạn thời gian được nêu rõ ở cuối câu.
- source_word: פְּעֻלַּת
  choice: tiền công của
  rationale: פְּעֻלָּה có thể chỉ công việc hoặc khoản thù lao; khi đi với שָׂכִיר và lệnh cấm trì hoãn thanh toán, “tiền công” là nghĩa phù hợp nhất.
- source_word: שָׂכִיר
  choice: người làm thuê
  rationale: שָׂכִיר là người được thuê để làm việc và nhận công; “người làm thuê” là cách nói thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אִתְּךָ
  choice: nơi ngươi
  rationale: Giới từ cho biết tiền công vẫn đang ở phía người thuê; “nơi ngươi” bám sát hình ảnh nguyên ngữ và phù hợp với văn phong luật định trang trọng.
- source_word: עַד בֹּקֶר
  choice: cho đến sáng hôm sau
  rationale: Cụm từ xác định giới hạn không được trì hoãn việc trả công. “Sáng hôm sau” làm rõ ý qua đêm vốn hàm chứa trong תָלִין mà vẫn giữ mốc thời gian cụ thể.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng văn phong luật định trang trọng, trực tiếp và dễ hiểu. Đại từ “ngươi” được chọn để giữ giọng xưng hô số ít của nguyên văn; “họ” là đại từ quy chiếu trung tính theo tiếng Việt hiện đại. Hai mệnh đề đầu được nối bằng “cũng” để phản ánh cấu trúc cấm đoán song song.
