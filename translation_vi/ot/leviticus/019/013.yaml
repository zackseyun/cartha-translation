revisions:
- from: Ngươi không được áp bức người lân cận mình, cũng không được cướp đoạt của họ. Tiền công của người làm thuê không được giữ lại nơi ngươi cho đến sáng hôm sau.
  to: Ngươi không được áp bức người lân cận mình, cũng không được cướp đoạt người lân cận mình. Ngươi không được giữ tiền công của người làm thuê cho đến sáng hôm sau.
  rationale: Sửa các chỗ không tự nhiên bằng cấu trúc chủ động, diễn đạt rõ rằng người được nói đến không được giữ tiền công qua đêm đến sáng hôm sau. Bản sửa duy trì các thuật ngữ chính, giọng luật định và quan hệ song song của hai lệnh cấm đầu, không thêm diễn giải giáo phái.
