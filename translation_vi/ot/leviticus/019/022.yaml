source:
  edition: WLC
  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: vi
  text: Thầy tế lễ sẽ dùng chiên đực của lễ vật chuộc lỗi để làm lễ chuộc tội cho người ấy trước mặt Yahweh, vì tội người ấy đã phạm[a]; và người ấy sẽ được tha thứ về tội mình đã phạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “lễ vật chuộc lỗi” là “lễ vật đền bù”. Từ Hê-bơ-rơ אָשָׁם có thể chỉ cả tội lỗi lẫn phương diện bồi hoàn, sửa chữa hậu quả của lễ vật này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: Thầy tế lễ sẽ ... làm lễ chuộc tội cho người ấy
  rationale: Trong văn mạch tế lễ, כפר chỉ nghi thức chuộc tội do thầy tế lễ thực hiện vì một người; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ tác nhân cùng người thụ hưởng.
- source_word: בְּאֵיל הָאָשָׁם
  choice: dùng con chiên đực làm lễ vật chuộc lỗi
  rationale: איל là chiên đực; אָשָׁם vừa chỉ tình trạng mắc lỗi vừa chỉ lễ vật mang phương diện đền bù, nên “lễ vật chuộc lỗi” giữ được ý nghĩa tế lễ mà không giản lược thành cảm giác có tội.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ nguyên danh giao ước Yahweh và sắc thái hiện diện trong bối cảnh nghi lễ của לִפְנֵי.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: vì tội người ấy đã phạm
  rationale: Diễn đạt tự nhiên cấu trúc đồng căn “tội... đã phạm” và giữ quan hệ giữa nghi thức chuộc tội với hành vi vi phạm.
- source_word: וְנִסְלַח לוֹ
  choice: và người ấy sẽ được tha
  rationale: Thể bị động giữ nguyên tác nhân tha thứ được hàm ẩn như trong tiếng Hê-bơ-rơ.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: tội mình đã phạm
  rationale: Trong công thức tha thứ, מן được chuyển tự nhiên sang bổ ngữ trực tiếp của “tha”; đại từ phản thân tránh lặp nặng mà vẫn chỉ đúng người ấy.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Văn bản dùng trực tiếp danh riêng giao ước; phiên âm Yahweh bảo tồn chức năng danh riêng và phù hợp lớp tham khảo đã được hiệu chỉnh.
- issue: Ý nghĩa của אָשָׁם trong luật tế lễ
  choice: lễ vật chuộc lỗi
  alternative: lễ vật đền bù; lễ vật chuộc sự mắc lỗi
  rationale: “Chuộc lỗi” đủ dễ hiểu và giữ chiều kích lỗi phạm; chú thích nêu thêm sắc thái đền bù để không xóa sự đa nghĩa thật của từ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Dùng “thầy tế lễ” theo cách gọi quen thuộc trong tiếng Việt; giữ cấu trúc pháp lễ và sự lặp lại có chủ ý của nguyên văn, đồng thời giảm độ gượng bằng đại từ “người ấy/mình”.
