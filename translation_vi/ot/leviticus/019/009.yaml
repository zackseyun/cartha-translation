  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: vi
  text: Khi các ngươi gặt mùa màng trên đất của mình, đừng gặt hết phần rìa[a] ruộng của mình, cũng đừng nhặt phần còn sót lại của vụ gặt mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “góc ruộng”. Từ Hê-bơ-rơ có thể chỉ rìa, phía hoặc góc; ở đây, từ này nói đến phần ngoài của ruộng phải được chừa lại, không gặt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: Khi các ngươi gặt
  rationale: Cụm giới từ với động từ nguyên mẫu diễn tả hoàn cảnh thời gian; “Khi ... gặt” tự nhiên trong tiếng Việt và giữ sắc thái luật lệ.
- source_word: קְצִיר אַרְצְכֶם
  choice: mùa màng trong xứ mình
  rationale: קְצִיר chỉ mùa gặt hoặc sản vật thu hoạch, còn אֶרֶץ ở đây là đất/xứ canh tác. Cách dịch này tự nhiên và không khiến câu bị hiểu là nói về quốc gia theo nghĩa chính trị.
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: đừng gặt hết
  rationale: Piel của כלה mang nghĩa hoàn tất, làm cho hết; kết hợp với לִקְצֹר, “gặt hết” truyền đạt trực tiếp lệnh không thu hoạch sạch.
- source_word: פְּאַת שָׂדְךָ
  choice: phần rìa ruộng mình
  rationale: פֵּאָה có thể chỉ rìa, phía hoặc góc. “Phần rìa ruộng” phù hợp ngữ cảnh nông nghiệp, đồng thời chú thích bảo lưu khả năng dịch “góc ruộng”.
- source_word: לֶקֶט קְצִירְךָ
  choice: những gì rơi sót trong mùa gặt
  rationale: לֶקֶט là phần hoa màu rơi hoặc sót lại để được nhặt sau khi gặt. Diễn đạt mô tả này rõ ràng hơn thuật ngữ chuyên biệt đối với độc giả Việt hiện đại.
- source_word: לֹא תְלַקֵּט
  choice: cũng đừng nhặt
  rationale: לקט nghĩa là nhặt, thu gom những phần rơi sót; “nhặt” chính xác, gọn và tự nhiên trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “các ngươi” vì chủ thể số nhiều trong mệnh đề đầu, rồi dùng “mình” để diễn đạt tự nhiên các hậu tố sở hữu số ít trong phần luật áp dụng cho từng người. Marker [a] được đặt ngay sau cụm từ có phương án dịch khác.
