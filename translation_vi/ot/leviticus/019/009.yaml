revisions:
- from: Khi các ngươi gặt mùa màng trong xứ mình, đừng gặt hết phần rìa[a] ruộng mình, cũng đừng nhặt những gì rơi sót trong mùa gặt.
  to: Khi các ngươi gặt mùa màng trên đất của mình, đừng gặt hết phần rìa[a] ruộng của mình, cũng đừng nhặt phần còn sót lại của vụ gặt mình.
  rationale: Thay “trong xứ mình” bằng “trên đất của mình” để phản ánh nghĩa nông nghiệp của אֶרֶץ. Thay “những gì rơi sót” bằng “phần còn sót lại” để dịch לֶקֶט mà không thêm hoặc thu hẹp chi tiết. Chú thích giữ nguyên phương án từ vựng cần thiết và chỉ điều chỉnh nhẹ cho tự nhiên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:29:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc luật lệ và hai điều cấm: không gặt sạch phần biên của ruộng và không thu nhặt leqet. Tuy nhiên, “trong xứ mình” dễ gợi một xứ sở/quốc gia hơn là đất canh tác, và “rơi sót” thu hẹp לֶקֶט vào những gì đã rơi, trong khi từ này có thể bao gồm phần còn lại sau lúc gặt.'
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và dễ hiểu. “Trên đất của mình” phù hợp ngữ cảnh nông nghiệp hơn “trong xứ mình”; “phần còn sót lại của vụ gặt” giữ câu rõ ràng mà không đòi hỏi thuật ngữ nông nghiệp cổ.
  terminology: “Phần rìa ruộng” là lựa chọn phù hợp cho פאה, với chú thích bảo lưu cách hiểu “góc ruộng”. “Nhặt” phù hợp với לקט. Cần tránh diễn giải leqet chỉ là hoa màu “rơi” vì đó không phải là giới hạn được nêu rõ trong câu.
  issues:
  - severity: medium
    issue: “trong xứ mình” cho אַרְצְכֶם
    rationale: Trong ngữ cảnh gặt hái, אֶרֶץ chỉ đất đai canh tác. “Xứ” trong tiếng Việt hiện đại thường nghiêng về lãnh thổ hay quốc gia; “trên đất của mình” sát ngữ cảnh hơn.
  - severity: medium
    issue: “những gì rơi sót” cho לֶקֶט
    rationale: Cách nói này thêm nét nghĩa “rơi” như một điều kiện xác định. לֶקֶט trong luật thu hoạch chỉ phần thu hoạch còn lại/được nhặt gom; nên dùng cách diễn đạt rộng hơn để không thu hẹp nghĩa.
  revised_text: Khi các ngươi gặt mùa màng trên đất của mình, đừng gặt hết phần rìa[a] ruộng của mình, cũng đừng nhặt phần còn sót lại của vụ gặt mình.
