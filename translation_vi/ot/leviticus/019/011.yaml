source:
  edition: WLC
  text: לֹ֖א תִּגְנֹ֑בוּ וְ/לֹא תְכַחֲשׁ֥וּ וְ/לֹֽא תְשַׁקְּר֖וּ אִ֥ישׁ בַּ/עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: vi
  text: Các ngươi không được trộm cắp, không được lừa dối, và không được nói dối nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “mỗi người đối với người đồng loại của mình” hoặc “người này đối với người lân cận mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: không được trộm cắp
  rationale: Thể Qal chưa hoàn thành ngôi hai số nhiều đi với לֹא mang chức năng cấm đoán trong văn cảnh luật pháp. “Trộm cắp” truyền đạt trực tiếp nghĩa thông thường của גנב.
- source_word: תְכַחֲשׁוּ
  choice: không được lừa dối
  rationale: Thể Piel của כחש có thể chỉ việc lừa dối, phủ nhận hoặc cư xử gian dối. “Lừa dối” là cách nói tự nhiên trong tiếng Việt và vẫn giữ nghĩa rộng về hành vi bất thành thật.
- source_word: תְשַׁקְּרוּ
  choice: không được nói dối
  rationale: Thể Piel của שקר thường chỉ việc nói dối hoặc hành xử giả dối. “Nói dối” phân biệt rõ điều cấm này với “lừa dối” ngay trước đó và phù hợp với đối tượng liên cá nhân theo sau.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: nhau
  rationale: Cụm này theo sát hình thức là “mỗi người với/đối với người đồng loại của mình”, nhưng có lực phân phối và tương hỗ trong văn cảnh. “Nhau” diễn đạt tự nhiên quan hệ tương hỗ mà không giới hạn mệnh lệnh cho nam giới.
- source_word: עֲמִית
  choice: người đồng loại / thành viên cùng cộng đồng
  rationale: עֲמִית chỉ người cùng cộng đồng, người đồng loại hoặc người lân cận. Trong câu chính, ý này được chuyển tải gọn bằng cấu trúc tương hỗ “nhau”.
theological_decisions:
- issue: Cách diễn đạt phân phối mang giống đực אִישׁ ... עֲמִיתוֹ
  choice: Dịch bao quát là “nhau” trong câu chính
  alternative: mỗi người nam đối với người lân cận mình; người này với người đồng loại mình
  rationale: Giống đực số ít trong tiếng Hê-bơ-rơ có chức năng đại diện/phổ quát tại đây, không giới hạn điều cấm cho nam giới. Cách dịch “nhau” giữ đúng phạm vi áp dụng và tính tương hỗ.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “các ngươi” để phản ánh ngôi hai số nhiều và sắc thái lời phán trực tiếp trong Lê-vi Ký; chuỗi “không được” làm rõ lực cấm đoán. Dấu chú thích [a] đặt sau cụm tương hỗ mà chú thích giải thích.
