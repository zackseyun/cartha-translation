  to: Người ngoại kiều cư ngụ giữa anh em phải được anh em xem như người bản xứ[a]. Anh em phải yêu người ấy như chính mình, vì anh em từng là ngoại kiều trong đất Ai Cập. Ta là Yahweh, Đức Chúa Trời của anh em.
