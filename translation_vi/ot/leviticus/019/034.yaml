  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: vi
  text: Người ngoại kiều cư ngụ giữa anh em phải được anh em xem như người bản xứ[a]. Anh em phải yêu người ấy như chính mình, vì anh em từng là ngoại kiều trong đất Ai Cập. Ta là Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người ngoại quốc cư trú,” “người cư trú không phải bản địa,” hoặc “người lạ.” Từ Hê-bơ-rơ chỉ một người không phải bản địa nhưng đang sống giữa dân Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: như người bản xứ
  rationale: אֶזְרָח chỉ người bản địa thuộc cộng đồng; “người bản xứ” giữ được phép so sánh do כְּ và tự nhiên trong tiếng Việt.
- source_word: הַגֵּר
  choice: người ngoại kiều
  rationale: גֵּר ở đây là người không sinh ra trong dân Israel nhưng đang cư ngụ lâu dài giữa họ, chứ không chỉ là khách qua đường. “Ngoại kiều” diễn đạt khá gọn địa vị vừa là người ngoài vừa cư trú trong cộng đồng.
- source_word: הַגָּר אִתְּכֶם
  choice: đang cư ngụ giữa anh em
  rationale: Phân từ גָּר diễn tả việc cư trú đang tiếp diễn. Tiếng Việt khó giữ tự nhiên lối chơi chữ cùng gốc với גֵּר, nên dùng “đang cư ngụ” để làm rõ hoàn cảnh sinh sống giữa cộng đồng.
- source_word: יִהְיֶה לָכֶם
  choice: phải được anh em xem
  rationale: Cấu trúc diễn tả cách Israel phải nhìn nhận và đối xử với người ngoại kiều; cách dịch này truyền đạt lực quy định rõ ràng hơn lối dịch sát chữ “sẽ là đối với anh em”.
- source_word: וְאָהַבְתָּ לוֹ כָּמוֹךָ
  choice: Anh em phải yêu người ấy như chính mình
  rationale: Giữ lực mệnh lệnh giao ước và cụm so sánh quen thuộc của Lê-vi 19:18. Đại từ số nhiều tự nhiên trong tiếng Việt, phù hợp việc mệnh lệnh hướng đến cộng đồng.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: vì anh em từng là ngoại kiều
  rationale: Lặp lại “ngoại kiều” để bảo tồn mối liên hệ từ vựng với הַגֵּר và nền tảng lịch sử của mệnh lệnh.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: trong đất Ai Cập
  rationale: Giữ danh ngữ đầy đủ của tiếng Hebrew và sắc thái lịch sử giao ước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Cách diễn đạt trang trọng, dễ hiểu của công thức giao ước; hậu tố số nhiều được thể hiện bằng “của anh em”.
theological_decisions:
- issue: Nghĩa của גֵּר trong bối cảnh luật pháp và đạo đức
  choice: người ngoại kiều
  alternative: người ngoại quốc cư trú; người tạm trú; khách kiều ngụ
  rationale: Từ này chỉ một người không phải bản địa nhưng sống giữa Israel và được đặt dưới sự bảo hộ của cộng đồng. “Người ngoại kiều” tránh hiểu thành khách ghé qua, dù từ này trong tiếng Việt hiện đại đôi khi có sắc thái pháp lý; các cách hiểu khác được ghi ở chú thích.
- issue: Cách thể hiện số của đối tượng được truyền lệnh
  choice: anh em
  alternative: ngươi
  rationale: Các động từ ở số ít nhưng hậu tố trong “giữa các ngươi,” “đối với các ngươi,” và “Đức Chúa Trời của các ngươi” ở số nhiều, phản ánh lời truyền cho Israel vừa mang tính tập thể vừa đích thân. “Anh em” tự nhiên trong tiếng Việt và duy trì chiều kích cộng đồng mà không loại bỏ trách nhiệm cá nhân.
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hebrew trực tiếp dùng danh giao ước; “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Phải được anh em xem như” diễn đạt tự nhiên nghĩa quy định của יִהְיֶה לָכֶם. Dùng “người ấy” thay cho đại từ mang giới tính vì tiếng Hebrew nói đến loại người theo địa vị xã hội, dù hình thức ngữ pháp là giống đực. Mọi dấu chú thích đều xuất hiện trong chính văn.
