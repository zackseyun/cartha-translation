  - severity: low
    issue: Chú thích a nêu phương án “cân ngay chính”
    rationale: Phương án này không diễn đạt tự nhiên khi áp dụng cho các cân, quả cân và đơn vị đong. Nên trình bày “đúng” như một lựa chọn thay thế cho từ lặp lại trong cả bốn cụm.
