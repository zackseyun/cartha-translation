id: LEV.19.36
reference: Leviticus 19:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: vi
  text: Anh em phải có cân công bằng[a], quả cân công bằng, ê-pha công bằng[b] và hin công bằng[c]. Ta là Yahweh, Đức Chúa Trời của anh em, Đấng đã đưa anh em ra khỏi đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cân đúng, quả cân đúng, ê-pha đúng và hin đúng”; từ Hê-bơ-rơ được lặp lại trong cả bốn cụm từ, thường mang nghĩa “công chính” hoặc “công lý”, tại đây áp dụng cho việc cân đong trong mua bán.
    reason: lexical_alternative
  - marker: b
    text: Ê-pha là một đơn vị đong vật khô thời cổ.
    reason: cultural_note
  - marker: c
    text: Hin là một đơn vị đong chất lỏng thời cổ.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: cân công bằng
  rationale: מֹאזְנַיִם là cân dùng để cân hàng; צֶדֶק nhấn mạnh sự đúng đắn và công chính trong giao dịch. “Cân công bằng” tự nhiên trong tiếng Việt và giữ được sự lặp lại có chủ ý.
- source_word: אַבְנֵי צֶדֶק
  choice: quả cân công bằng
  rationale: אַבְנֵי nghĩa đen là “những hòn đá”, tại đây chỉ các quả cân bằng đá dùng trong mua bán. Dịch theo vật dụng thực tế để người đọc hiện đại hiểu rõ.
- source_word: אֵיפַת צֶדֶק
  choice: ê-pha công bằng
  rationale: אֵיפָה là đơn vị đong vật khô thời cổ. Giữ tên đơn vị thay vì quy đổi gần đúng, đồng thời chú thích chức năng.
- source_word: וְהִין צֶדֶק
  choice: hin công bằng
  rationale: הִין là đơn vị đong chất lỏng thời cổ. Giữ tên đơn vị để bảo tồn bối cảnh văn hóa nguồn.
- source_word: יִהְיֶה לָכֶם
  choice: Anh em phải dùng
  rationale: Nghĩa đen là “sẽ có cho các ngươi”; trong văn luật tiếng Việt, “phải dùng” truyền đạt tự nhiên nghĩa vụ sở hữu và sử dụng các dụng cụ đo lường đúng chuẩn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Trong công thức giao ước với יְהוָה, hình thức này mang nghĩa số ít và chỉ Đức Chúa Trời của cộng đồng Israel.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: Đấng đã đưa anh em ra khỏi đất Ai Cập
  rationale: Giữ nguyên công thức Xuất Hành, nêu nền tảng giao ước cho mệnh lệnh.
theological_decisions:
- issue: Cách dịch bốn lần lặp lại צֶדֶק trong luật thương mại
  choice: công bằng
  alternative: trung thực; chính xác; công chính
  rationale: “Công bằng” giữ gần trường nghĩa công lý/công chính của צֶדֶק, đồng thời phù hợp tự nhiên với cân, quả cân và dụng cụ đong. Việc lặp cùng một từ phản ánh phép lặp nhấn mạnh trong tiếng Hê-bơ-rơ.
- issue: Cách thể hiện các đơn vị đo lường cổ
  choice: giữ “ê-pha” và “hin”, kèm chú thích
  alternative: dụng cụ đong vật khô; dụng cụ đong chất lỏng; quy đổi sang đơn vị hiện đại
  rationale: Giữ các đơn vị cụ thể của văn hóa nguồn, tránh những phép quy đổi không chắc chắn hoặc gây hiểu lầm; chú thích cung cấp thông tin cần thiết.
- issue: Sự chuyển đổi ngôi xưng trong lời phán
  choice: “Anh em” cho số nhiều và “Ta” cho lời tự xưng của Yahweh
  alternative: các ngươi / Ta; các bạn / Ta
  rationale: “Anh em” là cách gọi cộng đồng số nhiều, trang trọng nhưng dễ hiểu; “Ta” thích hợp với lời tự xưng trực tiếp của Đức Chúa Trời trong văn phong Kinh Thánh tiếng Việt.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “công bằng” của nguyên văn; dùng danh xưng Yahweh và chú thích ngắn cho hai đơn vị cổ.
