revisions:
- from: Anh em phải dùng cân công bằng[a], quả cân công bằng, ê-pha công bằng[b] và hin công bằng[c]. Ta là Yahweh, Đức Chúa Trời của anh em, Đấng đã đưa anh em ra khỏi đất Ai Cập.
  to: Anh em phải có cân công bằng[a], quả cân công bằng, ê-pha công bằng[b] và hin công bằng[c]. Ta là Yahweh, Đức Chúa Trời của anh em, Đấng đã đưa anh em ra khỏi đất Ai Cập.
  rationale: Thay “phải dùng” bằng “phải có” để phản ánh trực tiếp cấu trúc “sẽ/phải có cho anh em” của nguyên văn. Điều chỉnh chú thích a để phương án thay thế có thể áp dụng nhất quán cho bốn lần lặp của צֶדֶק và dùng tiếng Việt tự nhiên hơn. Không thay đổi ý nghĩa hay các neo chú thích.
  reviewer_model: gpt-5.6-terra
