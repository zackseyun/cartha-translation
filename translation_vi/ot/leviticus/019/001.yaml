lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức mở đầu lời Đức Chúa Trời truyền cho Môi-se, động từ דבר được chuyển là “phán”, cách diễn đạt trang trọng nhưng vẫn quen thuộc trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Sau động từ “phán”, “với” là cách kết hợp tự nhiên trong tiếng Việt để chỉ người tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tiếng Việt thông dụng của tên riêng Hê-bơ-rơ מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Trong công thức dẫn lời Hê-bơ-rơ, לֵאמֹר báo hiệu nội dung phát ngôn theo sau; dấu hai chấm truyền đạt chức năng ấy tự nhiên hơn việc lặp lại “rằng” hoặc “mà rằng” trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Bản dịch giữ tên riêng “Yahweh”, còn cách dịch truyền thống được ghi ở chú thích để người đọc nhận biết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích. “Phán với” phù hợp với công thức lời truyền thần thượng; dấu hai chấm thể hiện tự nhiên chức năng dẫn lời của לֵאמֹר. Dấu chú thích đặt ngay sau “Môi-se” để giữ vị trí theo lớp tham khảo tiếng Anh, dù nội dung chú thích giải thích danh “Yahweh”.
