id: LEV.19.14
reference: Leviticus 19:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: vi
  text: Ngươi không được nguyền rủa người điếc[a], cũng không được đặt vật gây vấp ngã trước mặt người mù; nhưng phải kính sợ Đức Chúa Trời của ngươi. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ dùng các hình thức giống đực số ít cho “người điếc” và “người mù” như những trường hợp pháp lý mang tính đại diện.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְקַלֵּל
  choice: nguyền rủa
  rationale: Động từ קלל ở thể Piel có thể chỉ việc nguyền rủa hoặc khinh miệt; “nguyền rủa” trực tiếp, tự nhiên và giữ nguyên sức nặng của lệnh cấm.
- source_word: חֵרֵשׁ
  choice: người điếc
  rationale: Danh từ/tính từ số ít chỉ một người điếc làm trường hợp đại diện trong luật; tiếng Việt không buộc phải biểu thị giới tính tại đây.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Giữ rõ nghĩa không gian của giới từ và phù hợp tự nhiên với hành động đặt vật cản.
- source_word: עִוֵּר
  choice: người mù
  rationale: Hình thức số ít nêu một trường hợp pháp lý đại diện; cách nói này tự nhiên, trang trọng và không thêm giới tính mà tiếng Việt không đòi hỏi.
- source_word: תִתֵּן
  choice: đặt
  rationale: נתן có nghĩa cơ bản là “cho,” nhưng trong kết hợp này “đặt” là tương đương thành ngữ chính xác.
- source_word: מִכְשֹׁל
  choice: vật cản
  rationale: Từ này chỉ vật khiến người ta vấp ngã. “Vật cản” tự nhiên trong tiếng Việt và trong ngữ cảnh trước mặt người mù vẫn giữ hình ảnh cụ thể; “hòn đá gây vấp” sẽ thêm chất liệu không có trong nguyên văn.
- source_word: וְיָרֵאתָ
  choice: nhưng phải kính sợ
  rationale: Waw có thể là “và,” song tại đây mệnh đề chuyển từ sự lạm dụng kín đáo sang trách nhiệm trước Đức Chúa Trời; “nhưng” diễn đạt tự nhiên lực tương phản, còn “phải” truyền đạt giá trị mệnh lệnh.
- source_word: מֵאֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Sau ירא, giới từ מן đánh dấu đối tượng của sự kính sợ; tiếng Việt tự nhiên không dịch riêng là “từ.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Các hình thức giống đực số ít mang tính đại diện trong luật
  choice: Dịch là “người điếc” và “người mù,” kèm chú thích rằng nguyên ngữ dùng giống đực số ít
  alternative: “người đàn ông điếc” và “người đàn ông mù”
  rationale: Tiếng Hê-bơ-rơ dùng giống đực số ít làm ví dụ pháp lý đại diện. Tiếng Việt hiện đại thường không đánh dấu giới tính trong “người điếc/người mù”; thêm “đàn ông” sẽ làm giới tính nổi bật hơn mức tự nhiên của ngôn ngữ đích. Chú thích bảo tồn dữ kiện hình thái và phạm vi đại diện.
- issue: Lực của mệnh đề động cơ cuối câu
  choice: “nhưng phải kính sợ Đức Chúa Trời của ngươi”
  alternative: “và phải kính sợ Đức Chúa Trời của ngươi”
  rationale: Nguyên ngữ dùng waw, vốn có thể dịch “và”; trong diễn tiến câu, sự kính sợ Đức Chúa Trời đối lập với việc lợi dụng người dễ bị tổn thương và làm nền tảng cho các lệnh cấm. “Nhưng” truyền đạt chức năng diễn ngôn ấy mà không thay đổi nội dung thần học.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “ngươi” để giữ cách xưng hô số ít của nguyên văn và sắc thái giao ước; dùng “không được… phải…” là lối diễn đạt mệnh lệnh tự nhiên trong tiếng Việt hiện đại. Dấu chấm phẩy giữ mối liên hệ chặt giữa lệnh cấm và động cơ kính sợ Đức Chúa Trời.
