source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: vi
  text: Đừng quay sang những kẻ cầu hồn hay những kẻ thông linh[a]; đừng tìm đến họ để rồi bị ô uế vì họ. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Các thuật ngữ Hê-bơ-rơ cũng có thể được hiểu là “những kẻ gọi hồn” và “những người có linh quen thuộc.” Chúng chỉ những người hành nghề bị cấm, có liên hệ với việc cầu hỏi các linh hoặc người chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: quay sang
  rationale: Động từ פנה có nghĩa cơ bản là “quay” hoặc “hướng về.” Trong lệnh cấm này, “quay sang” diễn đạt tự nhiên việc tìm sự trợ giúp nơi những người hành nghề bị cấm mà không thu hẹp nghĩa thành “cầu hỏi.”
- source_word: הָאֹבֹת
  choice: những kẻ cầu hồn
  rationale: Trong ngữ cảnh luật pháp này, אוֹב chỉ người làm trung gian để cầu hỏi người chết, dù từ này cũng có thể được hiểu là hồn được gọi lên. “Kẻ cầu hồn” là cách gọi rõ ràng, hiện đại và phù hợp với việc câu văn nói đến những đối tượng người ta tìm đến.
- source_word: הַיִּדְּעֹנִים
  choice: những kẻ thông linh
  rationale: יִדְּעֹנִי chỉ người được cho là có tri thức huyền bí nhờ liên hệ với linh giới. “Kẻ thông linh” dễ hiểu trong tiếng Việt hiện đại, phân biệt tương đối với “kẻ cầu hồn,” đồng thời tránh hình ảnh giả tưởng dễ gắn với từ “phù thủy.”
- source_word: תְּבַקְשׁוּ
  choice: tìm đến họ
  rationale: בקש có nghĩa là “tìm kiếm.” Trong ngữ cảnh này, “tìm đến họ” diễn đạt tự nhiên hành động chủ động tìm những người ấy để cầu hỏi, nhưng không đưa ý “cầu hỏi” trực tiếp vào động từ.
- source_word: לְטָמְאָה בָהֶם
  choice: để rồi bị ô uế vì họ
  rationale: Cụm nguyên mẫu với לְ có thể biểu thị mục đích hoặc kết quả. “Để rồi” giữ sắc thái kết quả phát sinh mà không khẳng định người tìm đến họ chủ tâm muốn bị ô uế; “bị ô uế” không giới hạn sự ô uế vào riêng phương diện nghi lễ hay đạo đức.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng chuyển tự “Yahweh,” thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Diễn đạt trực tiếp sự nhận diện mang tính giao ước và giữ ngôi thứ hai số nhiều của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Bản chất của sự ô uế do việc tìm đến những người hành nghề huyền thuật
  choice: Dịch chung là “bị ô uế,” không xác định đó chỉ là ô uế nghi lễ hay chỉ là ô uế đạo đức.
  alternative: “bị ô uế về nghi lễ” hoặc “bị băng hoại về đạo đức”
  rationale: Trong sách Lê-vi, טמא có thể mang chiều kích nghi lễ lẫn đạo đức. Cách dịch chung giữ nguyên độ rộng và sự căng thẳng thần học của câu.
- issue: Đối tượng được chỉ bởi אוֹב và יִדְּעֹנִי
  choice: Thể hiện cả hai là những người hành nghề liên hệ với linh giới.
  alternative: Hiểu các từ này là chính các hồn hoặc linh được cầu hỏi.
  rationale: Các động từ “quay sang” và “tìm đến,” cùng dạng số nhiều song song, phù hợp tự nhiên với các hạng người hành nghề; tuy nhiên chú thích vẫn ghi nhận độ dao động từ vựng của các thuật ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô thần ngôn “Ta—các ngươi” để giữ sắc thái uy nghiêm và ngôi số nhiều; dùng “Yahweh” cho danh riêng יהוה. Hai thuật ngữ huyền thuật được dịch bằng các cách gọi thông dụng nhưng vẫn kèm chú thích vì nghĩa Hê-bơ-rơ không hoàn toàn chắc chắn.
