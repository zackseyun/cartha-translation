source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֶת אֲשָׁמ/וֹ֙ לַֽ/יהוָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: vi
  text: 'Người ấy phải đem lễ vật chuộc lỗi[a] của mình đến lối vào Lều Hội Kiến để dâng cho Yahweh: một con chiên đực làm lễ vật chuộc lỗi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật đền bù.” Từ Hê-bơ-rơ אָשָׁם có thể chỉ cả lỗi phạm lẫn lễ vật được dâng để đền bù cho lỗi ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Người ấy phải đem
  rationale: Dạng động từ trong văn luật pháp mang ý nghĩa quy định bắt buộc; “phải đem” tự nhiên trong tiếng Việt hiện đại và giữ rõ sắc thái chỉ thị.
- source_word: אֲשָׁמוֹ
  choice: lễ vật chuộc lỗi của mình
  rationale: אָשָׁם ở đây chỉ lễ vật được dâng để xử lý lỗi phạm; “lễ vật chuộc lỗi” vừa diễn đạt chức năng đền bù vừa phù hợp ngữ cảnh tế lễ.
- source_word: לַיהוָה
  choice: đến dâng cho Yahweh
  rationale: Giới từ לְ biểu thị hướng đến hoặc sự dâng hiến. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ danh riêng giao ước יהוה là “Yahweh”.
- source_word: אֶל פֶּתַח
  choice: tại lối vào
  rationale: פֶּתַח chỉ lối vào hay cửa ra vào; “tại lối vào” diễn đạt địa điểm nơi lễ vật được đưa đến.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Đây là tên gọi cố định của nơi thánh; “Lều Hội Kiến” trang trọng, rõ nghĩa và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: אֵיל
  choice: một con chiên đực
  rationale: אֵיל chỉ cụ thể con chiên đực trưởng thành dùng làm sinh tế.
- source_word: אָשָׁם
  choice: làm lễ vật chuộc lỗi
  rationale: Cụm cuối đồng vị với “một con chiên đực,” xác định chức năng tế lễ của con vật mà không làm mất sự liên hệ giữa lỗi phạm và việc đền bù.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng này với tước hiệu “Chúa” mà không thêm cách giải thích hệ phái.
- issue: Sắc thái kép của אָשָׁם
  choice: lễ vật chuộc lỗi
  alternative: lễ vật đền bù
  rationale: Từ này có thể chỉ cả tình trạng mắc lỗi lẫn lễ vật nhằm sửa chữa hậu quả. “Lễ vật chuộc lỗi” phù hợp ngữ cảnh hiến tế, còn khả năng dịch nhấn mạnh việc đền bù được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “phải” để thể hiện nghĩa bắt buộc; câu được sắp xếp tự nhiên theo tiếng Việt, còn dấu gạch ngang giữ quan hệ đồng vị giữa con chiên đực và loại lễ vật.
