revisions:
- from: Người ấy phải đem lễ vật chuộc lỗi[a] của mình đến dâng cho Yahweh tại lối vào Lều Hội Kiến—một con chiên đực làm lễ vật chuộc lỗi.
  to: 'Người ấy phải đem lễ vật chuộc lỗi[a] của mình đến lối vào Lều Hội Kiến để dâng cho Yahweh: một con chiên đực làm lễ vật chuộc lỗi.'
  rationale: Chỉnh nhẹ trật tự các cụm để phân biệt rõ đích dâng hiến («cho Yahweh») với nơi đem lễ vật đến («lối vào Lều Hội Kiến»), và dùng dấu hai chấm để đánh dấu cụm «một con chiên đực» đồng vị, xác định lễ vật phải dâng. Không thay đổi nghĩa hay thêm diễn giải.
