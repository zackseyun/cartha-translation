id: LEV.19.32
reference: Leviticus 19:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: vi
  text: Hãy đứng dậy trước người tóc bạc[a], hãy kính trọng một ông lão[b], và hãy kính sợ Đức Chúa Trời của ngươi. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong sự hiện diện của người tóc bạc.” Tiếng Hê-bơ-rơ dùng hình ảnh cụ thể “tóc bạc” để nói về tuổi già.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “hãy tôn kính mặt của một ông lão”; đây là một thành ngữ chỉ việc tôn kính chính người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: trước người tóc bạc
  rationale: Cụm từ dùng hình ảnh cụ thể “tóc bạc” để chỉ người cao tuổi; “trước” kết hợp tự nhiên với mệnh lệnh đứng dậy và giữ sắc thái ở trong sự hiện diện của người ấy.
- source_word: תָּקוּם
  choice: hãy đứng dậy
  rationale: Động từ קום ở đây truyền đạt mệnh lệnh đứng lên như một cử chỉ tôn trọng. Cách dùng “hãy” tự nhiên trong tiếng Việt và không buộc phải thêm một đại từ xưng hô không có tương đương hoàn toàn phù hợp.
- source_word: וְהָדַרְתָּ
  choice: hãy kính trọng
  rationale: Thể piel của הדר có nghĩa bày tỏ sự tôn trọng hay kính nể; “kính trọng” diễn đạt rõ nghĩa đạo đức mà không biến thành sự thờ phượng.
- source_word: פְּנֵי זָקֵן
  choice: một ông lão
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “mặt của một người già/ông lão.” Bản văn chính dùng cách nói tự nhiên trong tiếng Việt và giữ giống đực số ít của זָקֵן; chú thích bảo lưu thành ngữ có từ “mặt.”
- source_word: וְיָרֵאתָ
  choice: hãy kính sợ
  rationale: ירא khi có Đức Chúa Trời làm đối tượng bao gồm cả sự sợ hãi, kính phục và ý thức trách nhiệm trước Ngài. “Kính sợ” là cách diễn đạt tự nhiên, vẫn giữ sức nặng thần học hơn “tôn trọng.”
- source_word: מֵאֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Giữ sở hữu ngôi thứ hai số ít và tính chất giao ước của lời truyền. “Ngươi” giúp bảo toàn số ít của nguyên văn trong mệnh đề cần đại từ sở hữu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Giống của זָקֵן
  choice: một ông lão
  alternative: người cao tuổi; bậc cao niên
  rationale: Danh từ/tính từ trong nguyên văn là giống đực số ít. Bản dịch giữ dấu hiệu này, dù nguyên tắc tôn trọng người cao tuổi có thể mang ý nghĩa đại diện rộng hơn.
- issue: Ý nghĩa của ירא đối với Đức Chúa Trời
  choice: kính sợ Đức Chúa Trời
  alternative: tôn kính Đức Chúa Trời
  rationale: “Kính sợ” duy trì sự căng thẳng giữa nỗi sợ, lòng kính phục và sự vâng phục trong công thức của Luật Thánh Khiết, thay vì làm nhẹ thành sự tôn trọng đơn thuần.
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה; chuyển tự “Yahweh” bảo toàn tính chất danh riêng.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Dùng “hãy” để tránh lặp đại từ cổ trong hai mệnh đề đầu, đồng thời giữ “ngươi” ở cụm sở hữu nhằm phản ánh ngôi thứ hai số ít của nguyên văn. Hai hình ảnh Hê-bơ-rơ được giữ trong bản văn hoặc chú thích mà không làm câu tiếng Việt gượng ép.
