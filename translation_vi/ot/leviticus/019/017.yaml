id: LEV.19.17
reference: Leviticus 19:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: vi
  text: Ngươi không được ghét anh em mình trong lòng. Ngươi phải khiển trách người đồng bào của mình, và không được vì người ấy mà mang tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và không được chuốc lấy tội vì người ấy” hoặc “và không được dự phần vào tội của người ấy.” Thành ngữ Hê-bơ-rơ có thể chỉ việc trở nên có tội vì không đối diện và sửa lỗi sai trái của người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: ghét
  rationale: Động từ שׂנא trực tiếp chỉ sự ghét bỏ; “ghét” giữ nguyên sức nặng đạo đức của điều cấm.
- source_word: אָחִיךָ
  choice: anh em mình
  rationale: אָח có thể chỉ anh em ruột hoặc một thành viên cùng cộng đồng giao ước. “Anh em mình” giữ hình ảnh thân tộc và vẫn có thể mang nghĩa cộng đồng.
- source_word: בִּלְבָבֶךָ
  choice: trong lòng
  rationale: לֵבָב chỉ nội tâm, gồm tư tưởng và ý định; “trong lòng” vừa sát nguồn vừa tự nhiên trong tiếng Việt.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: phải thẳng thắn khiển trách
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ chia nhấn mạnh mệnh lệnh. “Phải” thể hiện tính bắt buộc, còn “thẳng thắn khiển trách” truyền đạt hành động đối diện và sửa lỗi một cách rõ ràng.
- source_word: עֲמִיתֶךָ
  choice: người đồng bào của mình
  rationale: עָמִית chỉ một người cùng cộng đồng. “Người đồng bào” thể hiện phạm vi cộng đồng giao ước rõ hơn “người lân cận” trong tiếng Việt hiện đại.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: để không vì người ấy mà mang tội
  rationale: נָשָׂא חֵטְא có thể là mang tội hoặc chuốc lấy tội; với עָלָיו, cụm từ liên hệ trách nhiệm ấy với người đang phạm lỗi. Cách dịch giữ gần thành ngữ Hê-bơ-rơ và không loại bỏ các sắc thái khả hữu.
theological_decisions:
- issue: Phạm vi của ngôn ngữ thân tộc trong đạo đức giao ước
  choice: Giữ “anh em mình” và dùng “người đồng bào của mình” để phản ánh các danh từ quan hệ số ít giống đực trong bản nguồn.
  alternative: người khác; người lân cận; một người Y-sơ-ra-ên khác
  rationale: Các hình thức giống đực số ít trong tiếng Hê-bơ-rơ có chức năng đại diện. Bản dịch giữ sắc thái thân tộc và cộng đồng giao ước mà không thu hẹp thành anh em ruột hay mở rộng quá mức thành toàn thể nhân loại.
- issue: Quan hệ giữa việc khiển trách và việc mang tội
  choice: 'Dịch thành một mệnh đề mục đích/kết quả: “để không vì người ấy mà mang tội,” đồng thời chú thích tính đa nghĩa.'
  alternative: và không được mang tội vì người ấy; và không được dự phần vào tội của người ấy
  rationale: Liên từ וְ có thể đơn giản nối mệnh lệnh, nhưng ngữ cảnh cho phép hiểu việc khiển trách là cách tránh mắc tội liên quan đến lỗi của người kia. Chú thích bảo tồn khả năng hiểu là chuốc lấy tội hoặc dự phần vào tội.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu, dùng đại từ “ngươi” phù hợp diễn ngôn giao ước. “Thẳng thắn khiển trách” tự nhiên hơn lối lặp hình thức của tiếng Hê-bơ-rơ, đồng thời vẫn giữ lực nhấn mạnh. Dấu chú thích [a] được đặt ngay sau mệnh đề có tính đa nghĩa.
