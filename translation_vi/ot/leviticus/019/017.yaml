review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển đạt đúng các ý chính: cấm ghét trong lòng, mệnh lệnh khiển trách người cùng cộng đồng, và cảnh báo về việc mang/chuốc tội liên hệ với người ấy. Tuy nhiên, “để không” biến mệnh đề cuối có liên từ nối פשוט thành một mệnh đề chỉ mục đích/kết quả. Dù đây là một cách hiểu khả dĩ, văn bản Hê-bơ-rơ không buộc phải diễn đạt quan hệ đó bằng “để”. “Thẳng thắn” cũng thêm một sắc thái về cách thức không được nêu trực tiếp trong câu nguồn.'
  naturalness: “Ngươi” phù hợp với văn phong luật lệ Kinh Thánh trang trọng. Câu sửa dùng cấu trúc song hành rõ ràng và tự nhiên hơn, đồng thời tránh gán trước quan hệ cú pháp giữa hai mệnh lệnh cuối.
  terminology: “Anh em mình” giữ được ngôn ngữ thân tộc của אָחִיךָ. “Người đồng bào của mình” là cách dịch chấp nhận được cho עֲמִיתֶךָ trong bối cảnh cộng đồng Y-sơ-ra-ên, dù có sắc thái quốc gia hiện đại; không cần thay đổi bắt buộc. “Khiển trách” và “mang tội” bám sát các thuật ngữ nguồn. Chú thích cần sửa “sửa trách” thành cách diễn đạt tiếng Việt chuẩn.
  issues:
  - severity: medium
    issue: Mệnh đề cuối được chuyển thành mệnh đề mục đích bằng “để không”.
    rationale: 'Vְלֹא nối một mệnh lệnh phủ định với mệnh lệnh trước: “và ngươi không được...”. Quan hệ hệ quả—không khiển trách thì mắc tội—là một cách giải thích hợp lý và nên giữ trong chú thích, nhưng không nên áp đặt vào văn bản chính.'
  - severity: low
    issue: “Thẳng thắn” thêm sắc thái cách thức không minh thị trong הוֹכֵחַ תּוֹכִיחַ.
    rationale: Cấu trúc nguyên mẫu tuyệt đối nhấn mạnh sự chắc chắn/kiên quyết của mệnh lệnh khiển trách; nó không nói rõ phải thực hiện “thẳng thắn”. “Phải khiển trách” giữ mệnh lệnh mà không thêm ý.
  - severity: low
    issue: Chú thích dùng cụm “sửa trách”, không tự nhiên trong tiếng Việt chuẩn.
    rationale: Nên dùng “sửa lỗi” hoặc “quở trách” để diễn đạt rõ việc đối diện với điều sai trái.
  revised_text: Ngươi không được ghét anh em mình trong lòng. Ngươi phải khiển trách người đồng bào của mình, và không được vì người ấy mà mang tội.[a]
  revised_footnotes:
