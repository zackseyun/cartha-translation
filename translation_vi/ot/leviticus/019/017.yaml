    text: 'Cũng có thể dịch: “và không được chuốc lấy tội vì người ấy” hoặc “và không được dự phần vào tội của người ấy.” Thành ngữ Hê-bơ-rơ có thể chỉ việc trở nên có tội vì không đối diện và sửa lỗi sai trái của người ấy.'
    reason: lexical_alternative
