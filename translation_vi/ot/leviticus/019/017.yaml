revisions:
- from: Ngươi không được ghét anh em mình trong lòng. Ngươi phải thẳng thắn khiển trách người đồng bào của mình, để không vì người ấy mà mang tội.[a]
  to: Ngươi không được ghét anh em mình trong lòng. Ngươi phải khiển trách người đồng bào của mình, và không được vì người ấy mà mang tội.[a]
  rationale: Bản sửa giữ các từ ngữ trọng yếu của bản nguồn, bỏ sắc thái “thẳng thắn” được thêm vào, và phục hồi cấu trúc liên kết bằng “và” thay vì giải thích ngay trong văn bản bằng “để”. Chú thích tiếp tục nêu cách hiểu nhân quả khả dĩ của thành ngữ, nhờ đó bảo tồn tính đa nghĩa của cụm תִשָּׂא עָלָיו חֵטְא.
  reviewer_model: gpt-5.6-terra
