id: LEV.19.18
reference: Leviticus 19:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: vi
  text: Con không được báo thù hay nuôi lòng oán hận đối với người thuộc dân mình,[a] nhưng phải yêu người lân cận như chính mình. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “các con trai của dân con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקֹּם
  choice: báo thù
  rationale: Động từ נקם chỉ hành động trả đũa hoặc báo thù; “báo thù” tự nhiên, rõ nghĩa và giữ nguyên sắc thái chủ động.
- source_word: תִטֹּר
  choice: nuôi lòng oán hận
  rationale: Trong ngữ cảnh này, נטר nói đến việc giữ mãi sự giận dữ hoặc hiềm oán; cách dịch này thể hiện tính kéo dài của thái độ ấy.
- source_word: בְּנֵי עַמֶּךָ
  choice: người thuộc dân mình
  rationale: Cụm từ có nghĩa đen là “các con trai của dân ngươi”, nhưng ở đây chỉ những thành viên trong dân giao ước. Cách dịch chính truyền đạt tự nhiên ý nghĩa tập thể; nghĩa đen được ghi ở chú thích.
- source_word: וְאָהַבְתָּ
  choice: nhưng phải yêu
  rationale: Dạng waw + perfect mang lực mệnh lệnh trong văn cảnh luật pháp. “Phải yêu” diễn đạt tự nhiên sức nặng của điều răn và liên kết đối lập với hai lệnh cấm trước đó.
- source_word: לְרֵעֲךָ
  choice: người lân cận
  rationale: רֵעַ có thể chỉ người bạn, người đồng bạn hoặc người lân cận. “Người lân cận” vừa phù hợp văn cảnh đạo đức-pháp lý vừa giữ được cách diễn đạt quen thuộc trong mạch Kinh Thánh.
- source_word: כָּמוֹךָ
  choice: như chính mình
  rationale: Cách dịch tự nhiên và sát với cấu trúc so sánh, giữ nguyên sự cô đọng cũng như khả năng hàm nghĩa của tiếng Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng יהוה thay vì thay thế bằng một tước hiệu, qua đó giữ sự phân biệt có trong nguyên văn.
theological_decisions:
- issue: Phạm vi đối tượng của điều răn
  choice: Giữ quy chiếu trực tiếp đến cộng đồng của Israel qua “người thuộc dân mình”, đồng thời dịch רֵעַ là “người lân cận”.
  alternative: Khái quát cả hai cụm thành ngôn ngữ phổ quát hơn trong chính văn.
  rationale: Câu này dùng hai cụm từ khác nhau. Bản dịch giữ nét riêng ấy mà không tự ý mở rộng hay thu hẹp phạm vi dựa trên các cách giải thích thần học về sau.
- issue: Ý nghĩa của כָּמוֹךָ
  choice: Dịch cô đọng là “như chính mình”.
  alternative: Diễn giải thành “yêu người ấy như con yêu bản thân” hoặc “yêu người ấy là người giống như con”.
  rationale: Cấu trúc Hê-bơ-rơ ngắn gọn và có thể được bàn luận về quan hệ cú pháp; bản dịch truyền thống, tự nhiên này không ép câu theo một lối diễn giải riêng.
- issue: Cách thể hiện danh Đức Chúa Trời
  choice: Yahweh
  alternative: CHÚA hoặc Giê-hô-va
  rationale: Giữ danh riêng trong nguyên văn, không biến danh ấy thành tước hiệu và không áp đặt một truyền thống giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp lời luật trực tiếp dành cho từng người Israel; “Ta” giữ giọng phán của Đức Chúa Trời. Dấu chú thích [a] được đặt ngay sau cụm từ tương ứng.
