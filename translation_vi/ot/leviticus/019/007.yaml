id: LEV.19.7
reference: Leviticus 19:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: vi
  text: Nhưng nếu thịt ấy thực sự bị ăn vào ngày thứ ba, thì đó là vật đáng ghê tởm[a]; lễ vật sẽ không được chấp nhận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “vật hư hỏng” hay “vật bị ô uế”. Từ Hê-bơ-rơ chỉ thịt tế lễ trở nên không thể được chấp nhận vì bị ăn quá thời hạn cho phép.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ mở đầu một điều kiện tương phản với quy định ở câu trước; “Nhưng nếu” vừa giữ quan hệ điều kiện vừa thể hiện mạch đối lập tự nhiên trong tiếng Việt.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: thực sự bị ăn
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ Nifal nhấn mạnh hành động ăn. Cách dịch này giữ sắc thái nhấn mạnh mà không thêm ý chắc chắn tuyệt đối.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: vào ngày thứ ba
  rationale: Cách diễn đạt thời gian trực tiếp, chính xác và tự nhiên trong tiếng Việt hiện đại.
- source_word: פִּגּוּל
  choice: thứ ô uế
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ thịt tế lễ trở nên không thích hợp và không thể được chấp nhận vì đã bị ăn quá thời hạn. “Thứ ô uế” thể hiện tình trạng bị làm cho không còn phù hợp về nghi lễ, nhưng chú thích vẫn bảo lưu các sắc thái “ghê tởm” hoặc “hư hỏng” có thể có.
- source_word: הוּא
  choice: đó là
  rationale: Đại từ mang chức năng chủ ngữ trong mệnh đề vị ngữ; “đó là” giúp câu tiếng Việt rõ ràng và tự nhiên.
- source_word: לֹא יֵרָצֶה
  choice: lễ vật sẽ không được chấp nhận
  rationale: Trong văn cảnh tế lễ, Nifal của רצה nói đến việc lễ vật có được tiếp nhận hay không. Nêu rõ “lễ vật” làm sáng tỏ sở chỉ của đại từ ngầm mà không thay đổi ý nghĩa tế lễ.
theological_decisions:
- issue: Tình trạng của thịt tế lễ bị ăn vào ngày thứ ba
  choice: Câu này tuyên bố thịt ấy trở nên không thích hợp về nghi lễ, khiến lễ vật không được chấp nhận.
  alternative: Thịt chỉ bị hư hỏng về thể chất; hoặc từ này mang nghĩa rộng và nặng như một điều hoàn toàn đáng ghê tởm.
  rationale: Văn cảnh trực tiếp nói về thời hạn ăn thịt tế lễ và sự chấp nhận lễ vật. Vì vậy, bản dịch giữ trọng tâm nghi lễ, đồng thời chú thích bảo lưu phạm vi nghĩa của פִּגּוּל thay vì đồng nhất nó với một thuật ngữ cấm kỵ khác.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Thịt ấy” làm rõ đối tượng được ăn theo văn cảnh, còn “lễ vật” làm rõ điều không được chấp nhận. Dấu chú thích [a] được đặt ngay sau thuật ngữ mà chú thích giải nghĩa.
