source:
  edition: WLC
  text: אֶֽת חֻקֹּתַ/י֮ תִּשְׁמֹרוּ֒ בְּהֶמְתְּ/ךָ֙ לֹא תַרְבִּ֣יעַ כִּלְאַ֔יִם שָׂדְ/ךָ֖ לֹא תִזְרַ֣ע כִּלְאָ֑יִם וּ/בֶ֤גֶד כִּלְאַ֨יִם֙ שַֽׁעַטְנֵ֔ז לֹ֥א יַעֲלֶ֖ה עָלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: vi
  text: Hãy tuân giữ các luật lệ của Ta. Không được cho vật nuôi của mình giao phối khác loài; không được gieo hai loại hạt giống trong ruộng mình; cũng không được mặc y phục bằng vải pha trộn, tức sha-at-nết[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sha-at-nết” là thuật ngữ Hê-bơ-rơ chỉ một loại vải pha trộn bị cấm. Phục Truyền Luật Lệ Ký 22:11 xác định đó là vải pha len với vải lanh.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: những luật lệ của Ta
  rationale: Diễn đạt các quy định được ấn định, giữ sắc thái pháp lý và vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: תִּשְׁמֹרוּ
  choice: phải tuân giữ
  rationale: Trong ngữ cảnh luật giao ước, động từ chỉ việc ghi nhớ và thực hành; “tuân giữ” chuyển tải cả hai phương diện.
- source_word: בְּהֶמְתְּךָ
  choice: gia súc
  rationale: Chỉ chung các loài vật nuôi trong bối cảnh nông nghiệp, không thu hẹp thành riêng bò.
- source_word: תַרְבִּיעַ כִּלְאַיִם
  choice: cho hai loài gia súc khác nhau giao phối với nhau
  rationale: Hiphil của רבע nói đến việc khiến vật nuôi giao phối; cách dịch này rõ nghĩa mà không đưa thêm thuật ngữ di truyền học hiện đại.
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: không được gieo hai loại hạt giống trong ruộng mình
  rationale: Ngữ cảnh gieo ruộng cho phép làm rõ rằng các “loại” ở đây là các loại hạt giống.
- source_word: בֶגֶד כִּלְאַיִם
  choice: áo bằng vật liệu pha trộn
  rationale: Giữ khái niệm vật liệu thuộc các loại khác nhau mà không vội xác định thành phần ngay trong chính văn.
- source_word: שַׁעַטְנֵז
  choice: sha-at-nết
  rationale: Đây là thuật ngữ kỹ thuật hiếm và khó xác định chỉ từ từ nguyên; phiên âm trong chính văn và giải thích bằng chú thích giúp bảo toàn tính đặc thù.
- source_word: לֹא יַעֲלֶה עָלֶיךָ
  choice: không được mặc
  rationale: Nghĩa đen là “không được lên trên người ngươi”; trong ngữ cảnh áo quần, “không được mặc” là cách diễn đạt tự nhiên và chính xác về chức năng.
theological_decisions:
- issue: Phạm vi chính xác của שַׁעַטְנֵז
  choice: Giữ thuật ngữ phiên âm trong chính văn và nêu cách hiểu truyền thống ở chú thích.
  alternative: Dịch thẳng là “vải pha len với vải lanh”.
  rationale: Phục Truyền Luật Lệ Ký 22:11 xác định len và vải lanh, nhưng bản thân thuật ngữ hiếm ở câu này vẫn mang tính kỹ thuật; cách trình bày này tránh xóa bỏ sắc thái từ vựng của nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng các mệnh đề “không được” dễ hiểu. Đại từ số nhiều “các con” phản ánh động từ số nhiều ở câu mở đầu; các hậu tố sở hữu số ít trong từng điều luật được chuyển tự nhiên bằng “mình” như lời áp dụng cho mỗi thành viên trong cộng đồng.
