revisions:
- from: Các con phải tuân giữ những luật lệ của Ta. Không được cho hai loài gia súc khác nhau giao phối với nhau; không được gieo hai loại hạt giống trong ruộng mình; cũng không được mặc áo bằng vật liệu pha trộn, tức sha-at-nết[a].
  to: Hãy tuân giữ các luật lệ của Ta. Không được cho vật nuôi của mình giao phối khác loài; không được gieo hai loại hạt giống trong ruộng mình; cũng không được mặc y phục bằng vải pha trộn, tức sha-at-nết[a].
  rationale: Bản sửa loại bỏ sắc thái “con” không có trong đại từ ngôi hai số nhiều, chỉnh điều cấm về vật nuôi cho tự nhiên và sát nghĩa hơn, và dùng “y phục” để giữ phạm vi rộng của בֶּגֶד. Thuật ngữ sha-at-nết vẫn được phiên âm để không quyết đoán quá mức về thuật ngữ kỹ thuật hiếm, trong khi chú thích nêu dữ liệu giải thích trực tiếp từ Phục Truyền Luật Lệ Ký 22:11.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:32Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển đạt đúng ba điều cấm về lai giống vật nuôi, gieo trộn giống, và y phục pha trộn. Tuy nhiên, “Các con” thêm sắc thái quan hệ con cái không được biểu thị bởi đại từ số nhiều trong tiếng Hê-bơ-rơ; “cho hai loài gia súc khác nhau giao phối với nhau” cũng không tự nhiên và hơi làm lệch trọng tâm từ vật nuôi của người nghe sang hai loài gia súc. “Áo” hẹp hơn בֶּגֶד, vốn chỉ y phục/garment nói chung.
  naturalness: Cần dùng mệnh lệnh số nhiều không gán thêm quan hệ thân tộc, và diễn đạt điều cấm về vật nuôi theo tiếng Việt hiện đại, rõ mà không dùng thuật ngữ di truyền học. “Y phục” phù hợp hơn “áo” trong văn phong pháp luật trang trọng.
  terminology: “Luật lệ,” “tuân giữ,” và “gia súc/vật nuôi” phù hợp. Giữ thuật ngữ kỹ thuật “sha-at-nết” trong chính văn là thận trọng; chú thích nên nói rõ Phục Truyền Luật Lệ Ký 22:11 xác định hỗn hợp len và lanh, thay vì quy điều đó chỉ là cách hiểu truyền thống của riêng thuật ngữ.
  issues:
  - severity: medium
    issue: “Các con” thêm một quan hệ không có trong nguyên văn.
    rationale: תִּשְׁמֹרוּ là ngôi hai số nhiều; bản thân hình thức này không gọi người nghe là “con.” Dùng mệnh lệnh số nhiều không chủ ngữ giữ được ý nghĩa mà không thêm sắc thái.
  - severity: medium
    issue: Cụm “cho hai loài gia súc khác nhau giao phối với nhau” thiếu tự nhiên và không bám sát cấu trúc sở hữu số ít của câu.
    rationale: בְּהֶמְתְּךָ là “vật nuôi của ngươi,” còn הִרְבִּיעַ diễn tả khiến vật nuôi giao phối. “Cho vật nuôi của mình giao phối khác loài” tự nhiên hơn và bảo toàn nội dung cấm.
  - severity: low
    issue: “Áo” thu hẹp nghĩa của בֶּגֶד.
    rationale: Danh từ này chỉ y phục/garment nói chung, không chỉ một chiếc áo; “y phục” phù hợp hơn.
  revised_text: Hãy tuân giữ các luật lệ của Ta. Không được cho vật nuôi của mình giao phối khác loài; không được gieo hai loại hạt giống trong ruộng mình; cũng không được mặc y phục bằng vải pha trộn, tức sha-at-nết[a].
