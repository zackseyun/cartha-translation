  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: vi
  text: Các ngươi phải giữ những ngày Sa-bát của Ta và kính sợ nơi thánh của Ta.[a] Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôn kính nơi thánh của Ta.” Động từ Hê-bơ-rơ có thể mang nghĩa “sợ” hoặc “tôn kính”; ở đây, từ này nói đến thái độ kính trọng thánh thiêng đối với nơi thuộc riêng về Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: những ngày Sa-bát của Ta
  rationale: Giữ rõ hình thức số nhiều của tiếng Hê-bơ-rơ, đồng thời thêm “ngày” để câu tiếng Việt tự nhiên và chỉ rõ các kỳ nghỉ Sa-bát do Yahweh ấn định.
- source_word: תִּשְׁמֹרוּ
  choice: phải giữ
  rationale: Trong văn cảnh luật giao ước, שׁמר mang nghĩa tuân giữ, vâng theo; “phải giữ” diễn đạt tự nhiên lực mệnh lệnh của dạng chưa hoàn thành.
- source_word: מִקְדָּשִׁי
  choice: nơi thánh của Ta
  rationale: מִקְדָּשׁ chỉ một nơi được biệt riêng là thánh; cách dịch này tự nhiên và không xác định quá mức là đền tạm hay đền thờ.
- source_word: תִּירָאוּ
  choice: kính sợ
  rationale: ירא bao hàm cả sợ và lòng tôn kính. “Kính sợ” giữ được sức nặng của từ gốc và sắc thái tôn kính thánh thiêng, thay vì thu hẹp thành nỗi khiếp sợ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Giữ nguyên công thức tự xưng nhấn mạnh và mang tính giao ước trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh giao ước; “Yahweh” bảo tồn đây là danh riêng, không thay bằng tước hiệu.
- issue: Sắc thái của ירא đối với nơi thánh
  choice: kính sợ nơi thánh của Ta
  alternative: tôn kính nơi thánh của Ta
  rationale: “Kính sợ” bảo tồn tính đa nghĩa và sức nặng của ירא—vừa sợ vừa tôn kính—trong khi chú thích làm rõ ý nghĩa trong văn cảnh.
translation_notes:
  register: Văn phong luật giao ước trang trọng nhưng hiện đại. Dùng “các ngươi—Ta” để phản ánh lời phán trực tiếp với cộng đồng số nhiều và sự tự xưng của Đức Chúa Trời; câu ngắn, rõ, không cổ hóa quá mức.
