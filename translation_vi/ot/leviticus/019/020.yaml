revisions:
- from: Nếu một người đàn ông ăn nằm với một phụ nữ và xuất tinh, mà người phụ nữ ấy là một nữ nô lệ được định cho một người đàn ông[a], nhưng nàng chưa được chuộc hoặc chưa được trả tự do, thì phải có sự tra xét[b]. Họ không bị xử tử, vì nàng chưa được tự do.
  to: Nếu một người đàn ông giao hợp với một phụ nữ và xuất tinh, và người phụ nữ ấy là một nữ nô lệ được định cho một người đàn ông[a], nhưng nàng chưa được chuộc hoặc chưa được trả tự do, thì phải có sự tra xét[b]. Họ không bị xử tử, vì nàng chưa được trả tự do.
  rationale: Chỉnh sửa tối thiểu nhằm loại bỏ khả năng hiểu “ăn nằm” là chung sống và nhằm nhất quán hóa cách diễn đạt tình trạng chưa được giải phóng. Không thay đổi cách xử lý thận trọng đối với các thuật ngữ Hê-bơ-rơ còn tranh luận, và giữ nguyên các neo chú thích.
