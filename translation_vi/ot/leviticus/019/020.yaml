id: LEV.19.20
reference: Leviticus 19:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: vi
  text: Nếu một người đàn ông giao hợp với một phụ nữ và xuất tinh, và người phụ nữ ấy là một nữ nô lệ được định cho một người đàn ông[a], nhưng nàng chưa được chuộc hoặc chưa được trả tự do, thì phải có sự tra xét[b]. Họ không bị xử tử, vì nàng chưa được trả tự do.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được hứa gả cho một người đàn ông” hoặc “đã đính hôn với một người đàn ông”. Từ Hê-bơ-rơ có lẽ cho biết nữ nô lệ này đã được dành hoặc hứa cho một người đàn ông, nhưng nàng chưa có địa vị pháp lý đầy đủ của một người vợ tự do.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “sự tra xét” rất hiếm và không chắc nghĩa; cũng có thể mang nghĩa “hình phạt” hoặc “sự bồi thường”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: Giữ đúng giống và số của danh từ Hê-bơ-rơ trong thể văn luật pháp giả định.
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: ăn nằm với một phụ nữ và xuất tinh
  rationale: Diễn đạt tự nhiên hành vi giao hợp đồng thời giữ chi tiết pháp lý về sự xuất tinh có trong thành ngữ Hê-bơ-rơ.
- source_word: שִׁפְחָה
  choice: nữ nô lệ
  rationale: Nêu rõ thân phận bị sở hữu, vốn có ý nghĩa quyết định trong điều luật này; tránh làm nhẹ thành “đầy tớ gái”.
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: được định cho một người đàn ông
  rationale: Giữ mối ràng buộc với người đàn ông mà không khẳng định quá mức rằng đây là lễ đính hôn đầy đủ về mặt pháp lý.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: chưa được chuộc
  rationale: Phản ánh ngôn ngữ pháp lý–kinh tế về việc chuộc người khỏi thân phận nô lệ.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: chưa được trả tự do
  rationale: Là cách nói tiếng Việt hiện đại, rõ nghĩa về việc giải phóng khỏi thân phận nô lệ.
- source_word: בִּקֹּרֶת
  choice: sự tra xét
  rationale: Từ Hê-bơ-rơ hiếm và không chắc nghĩa; “tra xét” giữ được khả năng chỉ một thủ tục xem xét chính thức mà không tự ý xác định hình phạt.
- source_word: לֹא יוּמְתוּ
  choice: Họ không bị xử tử
  rationale: Dạng số nhiều chỉ cả hai người và trong văn cảnh tư pháp mang nghĩa không thi hành án tử hình.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: vì nàng chưa được tự do
  rationale: Giữ nguyên lý do mà câu nêu ra, liên kết trực tiếp với tình trạng pháp lý chưa được giải phóng của người nữ.
theological_decisions:
- issue: Địa vị pháp lý của נֶחֱרֶפֶת לְאִישׁ
  choice: được định cho một người đàn ông
  alternative: được hứa gả cho một người đàn ông; đã đính hôn với một người đàn ông
  rationale: Người nữ vẫn là nô lệ, chưa được chuộc hay trả tự do. Cách dịch được chọn giữ mối cam kết nhưng không đồng nhất trường hợp này với địa vị của một phụ nữ tự do đã đính hôn.
- issue: Ý nghĩa của בִּקֹּרֶת
  choice: phải có sự tra xét
  alternative: phải chịu hình phạt; phải có sự bồi thường
  rationale: Vì danh từ này hiếm và nghĩa còn tranh luận, bản dịch không áp đặt một loại chế tài cụ thể; các khả năng chính được ghi ở chú thích.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “nữ nô lệ” để không che nhẹ thân phận bị lệ thuộc; dùng “ăn nằm” và “xuất tinh” để vừa tự nhiên vừa giữ chi tiết của nguyên văn. Đại từ “nàng” duy trì sắc thái trang trọng và quy chiếu rõ ràng, còn “Họ” giữ số nhiều của động từ Hê-bơ-rơ.
