  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố pháp lý chủ yếu: người nam, người nữ nô lệ được định cho một người nam khác, tình trạng chưa được chuộc/chưa được trả tự do, biện pháp không xác định rõ, và việc không xử tử cả hai. Tuy nhiên, “ăn nằm” có thể gợi nghĩa chung sống trong tiếng Việt hiện đại, kém chính xác hơn đối với hành vi tình dục cụ thể của nguyên văn. Mệnh đề cuối nên giữ rõ thể bị động pháp lý “chưa được trả tự do”.'
