base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: vi
  text: Nhưng vào năm thứ tư, toàn bộ hoa trái của cây ấy sẽ được biệt thánh[a], để ca ngợi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn có thể là: “thánh, những lời ca ngợi dành cho Yahweh” hoặc “thánh, để ca ngợi Yahweh”. Cụm từ Hê-bơ-rơ này hiếm gặp và có thể nhấn mạnh sự vui mừng ca ngợi Yahweh bằng hoa trái ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: Nhưng vào năm thứ tư
  rationale: Liên từ וּ đánh dấu sự tương phản với ba năm trước trong ngữ cảnh; בַּ diễn tả thời điểm, còn הָרְבִיעִת là số thứ tự bổ nghĩa cho “năm”.
- source_word: יִהְיֶה כָּל פִּרְיוֹ
  choice: mọi trái của cây ấy sẽ là
  rationale: Giữ cấu trúc vị lai của mệnh đề luật pháp; hậu tố giống đực số ít được diễn đạt tự nhiên bằng “của cây ấy” theo ngữ cảnh.
- source_word: קֹדֶשׁ
  choice: thánh
  rationale: Danh từ được dùng theo chức năng vị ngữ, xác định toàn bộ trái cây là thánh, tức được biệt riêng cho mục đích thiêng liêng.
- source_word: הִלּוּלִים
  choice: để ca ngợi
  rationale: Danh từ số nhiều hiếm này liên hệ với sự ca ngợi hoặc vui mừng tôn vinh; cách dịch không thêm khái niệm “lễ vật” vốn không được nêu rõ trong từ Hê-bơ-rơ.
- source_word: לַיהוָה
  choice: Đức Giê-hô-va
  rationale: Giới từ לְ chỉ hướng hoặc mục đích của sự ca ngợi; danh riêng giao ước יהוה được phiên âm theo cách gọi đã quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách hiểu cụm hiếm קֹדֶשׁ הִלּוּלִים לַיהוָה
  choice: sẽ là thánh, để ca ngợi Đức Giê-hô-va
  alternative: 'sẽ là thánh, những lời ca ngợi dâng lên Đức Giê-hô-va; hoặc: sẽ là thánh, dành cho sự ca ngợi Đức Giê-hô-va'
  rationale: Cách dịch chính truyền đạt công dụng tôn vinh mà không biến trái cây thành một “lễ vật” theo nghĩa chuyên biệt. Chú thích giữ lại cú pháp và sự mơ hồ của cụm từ hiếm.
- issue: Cách thể hiện יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Dùng danh riêng thay vì thay thế bằng tước hiệu, đồng thời chọn dạng phiên âm quen thuộc và trang trọng trong tiếng Việt.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng tự nhiên trong tiếng Việt hiện đại. “Mọi trái của cây ấy” làm rõ sở chỉ của hậu tố Hê-bơ-rơ mà không thêm nội dung mới; chú thích bảo tồn tính hiếm và đa nghĩa của cụm từ chỉ sự ca ngợi.
