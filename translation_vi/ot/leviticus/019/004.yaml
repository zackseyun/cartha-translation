revisions:
- from: Đừng hướng về các thần tượng[a], cũng đừng làm cho mình những thần bằng kim loại đúc[b]. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  to: Đừng hướng về các thần tượng[a], cũng đừng làm cho mình những thần được đúc bằng kim loại[b]. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  rationale: Chỉnh duy nhất cách diễn đạt cụm אֱלֹהֵי מַסֵּכָה và chú thích liên hệ, để tiếng Việt rõ và tự nhiên hơn mà vẫn bảo toàn ý “các thần” số nhiều được làm bằng kỹ thuật đúc. Các phần còn lại trung thành với nguyên văn và phù hợp audit trail tiếng Anh.
  reviewer_model: gpt-5.6-terra
