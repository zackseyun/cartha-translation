id: LEV.19.4
reference: Leviticus 19:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: vi
  text: Đừng hướng về các thần tượng[a], cũng đừng làm cho mình những thần được đúc bằng kim loại[b]. Ta là Yahweh, Đức Chúa Trời của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thần tượng vô giá trị”; từ Hê-bơ-rơ có thể mang sắc thái khinh miệt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các thần đúc” hoặc “các tượng thần bằng kim loại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: hướng về
  rationale: Động từ פנה đi với אֶל diễn tả việc quay hoặc hướng mình về đối tượng. “Hướng về” tự nhiên trong tiếng Việt và không thu hẹp ý nghĩa thành riêng hành vi thờ phượng.
- source_word: אֱלִילִים
  choice: các thần tượng
  rationale: Từ này chỉ các thần tượng và có thể hàm ý khinh miệt rằng chúng vô giá trị. “Các thần tượng” rõ nghĩa trong câu chính, còn sắc thái ấy được ghi ở chú thích.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: những thần bằng kim loại đúc
  rationale: Cụm từ giữ cả ý số nhiều của אֱלֹהֵי lẫn phương thức chế tạo bằng cách đúc của מַסֵּכָה, tránh diễn đạt mơ hồ như “thần đúc”.
- source_word: תַעֲשׂוּ לָכֶם
  choice: làm cho mình
  rationale: 'Giữ sắc thái thụ hưởng/sở hữu của לָכֶם: dân chúng không được làm các hình thần để dùng hay sở hữu cho chính mình.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong bản Hê-bơ-rơ thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Dù hình thức אֱלֹהִים có dạng số nhiều, cú pháp và công thức giao ước ở đây chỉ Đức Chúa Trời duy nhất của Israel. “Các ngươi” phù hợp lời phán trang trọng hướng đến toàn dân.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh יהוה; giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Có diễn giải việc hướng về thần tượng thành thờ phượng hay không
  choice: Đừng hướng về các thần tượng
  alternative: Đừng thờ các thần tượng
  rationale: פנה nói đến việc quay hoặc hướng về; “hướng về” giữ phạm vi ý nghĩa rộng và sự hàm ẩn của nguyên văn, không tự ý giới hạn vào hành vi thờ phượng.
- issue: Cách thể hiện số nhiều trong אֱלֹהֵי מַסֵּכָה
  choice: những thần bằng kim loại đúc
  alternative: tượng thần bằng kim loại đúc
  rationale: Giữ danh từ “thần” và số nhiều của nguyên văn, đồng thời không xóa đi mối liên hệ giữa các vật được đúc và địa vị thần linh mà người ta gán cho chúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” và “các ngươi” để giữ giọng phán trực tiếp có thẩm quyền của giao ước; “hướng về” bảo tồn độ rộng nghĩa của động từ Hê-bơ-rơ. Mọi dấu chú thích đều xuất hiện trong câu chính.
