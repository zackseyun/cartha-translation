  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: vi
  text: Khi các ngươi dâng tế lễ bình an cho Yahweh, hãy dâng lễ ấy sao cho các ngươi được chấp nhận.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “vì sự chấp nhận của các ngươi.”'
    reason: Ghi nhận cấu trúc danh từ cô đọng của לִרְצֹנְכֶם và cách diễn đạt sát chữ hơn.
lexical_decisions:
- source_word: וְ/כִי
  choice: Khi
  rationale: Trong luật lệ này, כִּי mở đầu một trường hợp mang sắc thái thời gian/điều kiện; “Khi” tự nhiên trong tiếng Việt và phù hợp với mạch chỉ dẫn.
- source_word: תִזְבְּחוּ
  choice: dâng sinh tế
  rationale: Động từ זבח chỉ hành động giết/dâng lễ vật hiến tế; “dâng sinh tế” truyền đạt rõ ý nghĩa nghi lễ mà không quá kỹ thuật.
- source_word: זֶבַח שְׁלָמִים
  choice: sinh tế bình an
  rationale: Cụm từ chỉ một loại sinh tế quen thuộc trong luật tế lễ. “Sinh tế bình an” vừa giữ liên hệ với שְׁלָמִים vừa là cách diễn đạt trang trọng, dễ hiểu.
- source_word: לַ/יהוָה
  choice: lên Yahweh
  rationale: Giới từ ל biểu thị hướng đến hoặc sự hiến dâng; “lên Yahweh” là cách nói tự nhiên trong ngữ cảnh dâng tế lễ và giữ nguyên danh giao ước.
- source_word: לִ/רְצֹנְ/כֶם
  choice: sao cho các ngươi được chấp nhận
  rationale: Trong văn cảnh tế lễ, רָצוֹן nói đến việc lễ vật và người dâng được Đức Chúa Trời chấp nhận, không phải làm theo sở thích của người dâng.
- source_word: תִּזְבָּחֻהוּ
  choice: hãy dâng
  rationale: Mệnh lệnh được diễn đạt tự nhiên bằng “hãy dâng”; đối tượng là sinh tế vừa nhắc đến nên không cần lặp “nó” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ danh riêng giao ước được ghi trực tiếp trong nguyên văn, không thay bằng một tước hiệu.
- issue: Ý nghĩa của לִרְצֹנְכֶם trong luật tế lễ
  choice: sao cho các ngươi được chấp nhận
  alternative: để được chấp nhận; vì sự chấp nhận các ngươi; theo ý các ngươi
  rationale: Chọn nghĩa nghi lễ về sự được chấp nhận trước Đức Chúa Trời, đồng thời tránh cách hiểu rằng việc dâng lễ tùy theo sở thích của người dâng.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “các ngươi” để thể hiện ngôi thứ hai số nhiều và sắc thái lời phán trực tiếp; giữ thuật ngữ “sinh tế bình an” nhất quán với ngữ cảnh Lê-vi Ký.
