  source_fidelity: Bản dịch truyền đạt đúng khung mệnh lệnh luật lệ và ý nghĩa nghi lễ của זֶבַח שְׁלָמִים. Tuy nhiên, “lên Yahweh” không phải cách dùng tự nhiên hay chính xác cho לַיהוָה trong tiếng Việt; “cho Yahweh” diễn tả đúng hướng hiến dâng. Việc lặp lại động từ với hậu tố chỉ lễ vật (תִּזְבָּחֻהוּ) nên được thể hiện bằng “dâng lễ ấy” để giữ đối tượng quy chiếu.
