  rationale: 'Chỉnh giới từ hiến dâng thành “cho Yahweh,” dùng thuật ngữ tự nhiên “tế lễ bình an,” và phục hồi đối tượng “lễ ấy” của động từ cuối. Cách dịch chính vẫn giữ ý nghĩa ngữ cảnh tế lễ: việc dâng lễ phải được thực hiện để người dâng được chấp nhận. Chú thích được viết lại cho rõ tiếng Việt mà không áp đặt một cách hiểu thần học vượt quá ngữ cảnh.'
