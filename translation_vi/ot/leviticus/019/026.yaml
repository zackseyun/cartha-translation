id: LEV.19.26
reference: Leviticus 19:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: vi
  text: Không được ăn trên máu.[a] Không được bói toán hay xem điềm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cùng với máu”. Cụm từ Hê-bơ-rơ khó hiểu; có thể nói đến việc ăn thịt còn máu hoặc tham gia một bữa ăn nghi lễ liên quan đến máu.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “làm thuật chiêm đoán”, hoặc theo cách dịch truyền thống: “xem ngày giờ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: Không được ăn
  rationale: Thể vị hoàn thành chưa trọn với לֹא trong văn luật pháp biểu thị lệnh cấm. “Không được ăn” tự nhiên trong tiếng Việt hiện đại, rõ nghĩa và vẫn giữ giọng quy định.
- source_word: עַל הַדָּם
  choice: trên máu
  rationale: Cụm từ này khó hiểu và đối tượng cụ thể của lệnh cấm không chắc chắn. Dịch tương đối sát giới từ עַל là “trên” để không tự ý quyết định rằng câu chỉ nói đến thịt còn máu hay một bữa ăn nghi lễ liên quan đến máu.
- source_word: תְנַחֲשׁוּ
  choice: bói toán
  rationale: Động từ נחשׁ ở thể piel chỉ việc thực hành bói đoán. “Bói toán” là cách nói gọn, tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: תְעוֹנֵנוּ
  choice: xem điềm
  rationale: Động từ ענן trong dạng này thường được hiểu là thực hành chiêm đoán hoặc giải đoán dấu hiệu. “Xem điềm” truyền đạt nghĩa có khả năng nhất mà không dùng lối nói cổ khó hiểu.
theological_decisions:
- issue: Mức độ cụ thể khi dịch cụm từ khó עַל הַדָּם
  choice: Giữ cách dịch tương đối sát “trên máu” trong chính văn
  alternative: “cùng với máu”, “khi thịt vẫn còn máu”, hoặc “trong một bữa ăn nghi lễ liên quan đến máu”
  rationale: Không rõ lệnh cấm nói đến việc ăn thịt còn máu, tham gia một nghi thức bên máu, hay một tập tục khác. Chính văn giữ sự mơ hồ thật sự của tiếng Hê-bơ-rơ; chú thích nêu các khả năng chính mà không áp đặt một cách giải thích.
translation_notes:
  register: Dùng lối cấm đoán trực tiếp “Không được…” để vừa trang trọng vừa tự nhiên trong tiếng Việt hiện đại. “Máu” dễ hiểu hơn “huyết” đối với độc giả phổ thông; cách nói bất thường “trên máu” được cố ý giữ lại và giải thích bằng chú thích.
