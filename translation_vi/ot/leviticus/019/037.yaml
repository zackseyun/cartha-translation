id: LEV.19.37
reference: Leviticus 19:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: vi
  text: Vậy, anh em hãy tuân giữ mọi luật lệ và mọi phán quyết của ta[a], và thực hành chúng. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “mọi sắc lệnh” thay cho “mọi luật lệ,” và “mọi quy tắc” hoặc “mọi luật xử” thay cho “mọi phán quyết.” Tiếng Hê-bơ-rơ dùng hai thuật ngữ pháp lý khác nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vậy, anh em phải tuân giữ
  rationale: Động từ שׁמר trong ngữ cảnh giao ước và luật pháp có nghĩa là tuân giữ, giữ gìn hoặc làm theo. “Tuân giữ” tự nhiên trong tiếng Việt và diễn đạt cả sự ghi nhớ lẫn vâng theo. Liên từ וּ được dịch là “Vậy” để thể hiện chức năng tổng kết của câu cuối chương.
- source_word: כָּל
  choice: mọi
  rationale: Giữ nguyên ý nghĩa bao quát của từ Hê-bơ-rơ trong cả hai lần xuất hiện.
- source_word: חֻקֹּתַי
  choice: mọi luật lệ của ta
  rationale: חֻקִּים chỉ những điều luật hay quy chế đã được ấn định. “Luật lệ” rõ nghĩa, phù hợp văn phong pháp lý và vẫn phân biệt được với מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: mọi quy định của ta
  rationale: מִשְׁפָּטִים có thể chỉ các phán quyết, quy tắc hoặc quy định pháp lý. “Quy định” dễ hiểu trong tiếng Việt hiện đại, đồng thời duy trì hai thuật ngữ pháp lý riêng biệt trong nguyên văn.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: và thi hành chúng
  rationale: עשה khi đi với các điều luật mang nghĩa thực hiện hoặc thi hành. “Thi hành chúng” tự nhiên hơn cách nói sát chữ “làm chúng” và giữ được tính trực tiếp của mệnh lệnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó phản ánh trực tiếp danh xưng trong nguyên văn.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. “Yahweh” bảo tồn danh giao ước dưới dạng phiên âm, không thay bằng một tước hiệu.
- issue: Mối quan hệ giữa việc tuân giữ và thi hành luật pháp
  choice: Giữ cả hai vế “tuân giữ” và “thi hành”
  alternative: Gộp thành một mệnh lệnh như “làm theo”
  rationale: Hai động từ שׁמר và עשה đều hiện diện trong nguyên văn. Giữ cả hai tránh làm mất sắc thái vừa chuyên tâm tuân giữ vừa thực sự đem các điều luật ra thực hành.
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Anh em” thể hiện đối tượng số nhiều là cộng đồng Ít-ra-ên mà không dùng đại từ “các ngươi” mang sắc thái cổ. Câu ngắn và nhịp mệnh lệnh được giữ gần với nguyên văn.
