  terminology: Dùng “luật lệ” cho חֻקּוֹת và “phán quyết” cho מִשְׁפָּטִים giúp duy trì rõ hơn hai thuật ngữ pháp lý khác nhau. Giữ “Yahweh” đúng theo chính sách đã nêu. Chú thích được chỉnh để các phương án thay thế là tiếng Việt hiện đại, rõ nghĩa.
