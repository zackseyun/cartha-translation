  verdict: approve
  source_fidelity: 'Bản dịch chuyển tải đầy đủ trình tự mệnh lệnh của tiếng Hê-bơ-rơ: nói với toàn thể cộng đồng, rồi truyền lời phải nên thánh. “Toàn thể cộng đồng con cái Israel” giữ được cả כָּל עֲדַת lẫn cách gọi thân tộc בְּנֵי יִשְׂרָאֵל. “Các ngươi phải nên thánh” diễn đạt phù hợp lực quy phạm của קְדֹשִׁים תִּהְיוּ, và mệnh đề nguyên nhân cùng danh Yahweh, quan hệ “Đức Chúa Trời của các ngươi”, đều chính xác.'
  naturalness: Văn bản tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại và giữ được sắc thái trang trọng. Cặp “Hãy nói ... và bảo họ” phản ánh đúng nhịp lặp có chủ ý của nguyên ngữ mà không gây gượng đáng kể. “Nên thánh” là cách nói đã định hình trong tiếng Việt Cơ Đốc cho lời truyền này.
  terminology: “Yahweh” phù hợp quyết định thuật ngữ của dự án về Tetragrammaton; “Đức Chúa Trời”, “thánh”, và “các ngươi” nhất quán với thanh giọng giao ước, trang trọng. Chú thích a bảo lưu các cách diễn đạt tập thể; chú thích b bảo lưu các phương án hợp lệ cho lực mệnh lệnh.
