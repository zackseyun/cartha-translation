id: LEV.19.2
reference: Leviticus 19:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: vi
  text: '“Hãy nói với toàn thể cộng đồng con cái Israel[a] và bảo họ: ‘Các ngươi phải nên thánh, vì Ta, Yahweh, Đức Chúa Trời của các ngươi, là thánh.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn thể hội chúng Israel” hoặc “toàn thể dân Israel.”'
    reason: lexical_alternative
  - marker: b
    text: '“Các ngươi phải nên thánh” cũng có thể dịch: “Hãy nên thánh” hoặc “Các ngươi sẽ nên thánh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Dạng mệnh lệnh Piel truyền lệnh trực tiếp cho Môi-se; “hãy nói” tự nhiên, trang trọng và sát nghĩa.
- source_word: כָּל עֲדַת
  choice: toàn thể cộng đồng
  rationale: עֵדָה chỉ cộng đồng giao ước xét như một tập thể; “toàn thể cộng đồng” chuyển tải rõ כָּל và tự nhiên hơn “hội chúng” trong tiếng Việt hiện đại.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh quan hệ huyết thống của thành ngữ Hê-bơ-rơ nhưng dùng “con cái” theo nghĩa tập thể, bao gồm dân Israel nói chung.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và bảo họ
  rationale: Trong chuỗi truyền lệnh pháp luật, “bảo họ” tránh lặp cứng “nói… nói” mà vẫn giữ lực trực tiếp của אָמַר.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: Các ngươi phải nên thánh
  rationale: Dạng tính từ vị ngữ số nhiều kết hợp với thể chưa hoàn thành mang lực quy định hay mệnh lệnh; “phải nên thánh” giữ sắc thái nghĩa vụ mà không biến nó thành một mệnh lệnh cụt.
- source_word: קָדוֹשׁ
  choice: thánh
  rationale: “Thánh” là cách diễn đạt đã được xác lập, bao hàm sự biệt riêng thuộc về Đức Chúa Trời mà không giản lược thành chỉ “được biệt riêng”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Diễn đạt rõ hậu tố sở hữu ngôi thứ hai số nhiều trong công thức giao ước.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל, danh xưng chỉ cộng đồng giao ước
  choice: con cái Israel
  alternative: dân Israel; người Israel
  rationale: “Con cái Israel” giữ hình ảnh thân tộc của nguyên ngữ nhưng trong tiếng Việt vẫn có thể chỉ toàn thể cộng đồng, không buộc người đọc hiểu là chỉ nam giới.
- issue: Lực nghĩa của קְדֹשִׁים תִּהְיוּ
  choice: Các ngươi phải nên thánh
  alternative: Hãy nên thánh; Các ngươi sẽ nên thánh
  rationale: Cấu trúc có thể mang sắc thái mệnh lệnh, nghĩa vụ hoặc lời xác quyết. Bản chính dùng “phải” để hợp văn cảnh luật lệ, còn chú thích bảo lưu khả năng dịch khác.
- issue: Quan hệ giữa sự thánh khiết của dân và của Yahweh
  choice: vì Ta, Yahweh, Đức Chúa Trời của các ngươi, là thánh
  alternative: vì Ta là thánh—Yahweh, Đức Chúa Trời của các ngươi
  rationale: 'Giữ nguyên nền tảng thần học được câu nêu trực tiếp: dân phải nên thánh vì Đức Chúa Trời của họ là thánh, không diễn giải thêm bản chất hay phương thức của sự nên thánh.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời phán trực tiếp với cộng đồng số nhiều và phân biệt với đại từ số ít; giữ danh Yahweh. Dấu chú thích [a], [b] đều xuất hiện trong bản văn chính.
