- from: Ai ăn thịt ấy sẽ phải mang lấy tội lỗi mình[a], vì người ấy đã xúc phạm vật thánh của Đức Giê-hô-va[b]; người ấy sẽ bị loại khỏi dân mình[c].
  to: Ai ăn thịt ấy sẽ mang tội mình[a], vì người ấy đã làm ô uế điều thánh của Đức Giê-hô-va[b]; người ấy sẽ bị cắt khỏi dân mình[c].
  rationale: Sửa động từ chỉ hành vi làm phàm/làm ô uế điều thánh để sát חילל; khôi phục thành ngữ “bị cắt khỏi” để không thu hẹp hoặc làm nhẹ công thức hình phạt đang được tranh luận; và làm gọn thành ngữ “mang tội mình” mà vẫn bảo tồn hàm nghĩa nguyên ngữ. Các mốc chú thích được giữ đúng và đều có chú thích tương ứng.
