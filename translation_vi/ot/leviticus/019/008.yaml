review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát câu Hê-bơ-rơ: chủ thể chung, thành ngữ chịu tội, lý do vì đã làm ô uế/phàm tục điều thánh của YHWH, và công thức bị cắt khỏi dân mình đều được giữ. Tuy nhiên, “xúc phạm vật thánh” thiên về gây xúc phạm hơn là đối xử điều thánh như thường/phàm; “làm ô uế điều thánh” hoặc “làm phàm điều thánh” phản ánh חילל chính xác hơn. “Bị loại khỏi” diễn giải nhẹ công thức נכרתה; nên giữ thành ngữ “bị cắt khỏi” và giải thích ở chú thích.'
  naturalness: Văn phong trang trọng, hiện đại và rõ. “Ai ăn thịt ấy” là cách nói tự nhiên trong ngữ cảnh tế lễ. “Mang lấy tội lỗi mình” hơi nặng và có thể gợi bản thân hành vi tội lỗi hơn là trách nhiệm tội; “mang tội mình” tự nhiên, súc tích và vẫn giữ tính thành ngữ.
  terminology: Tên riêng “Đức Giê-hô-va” được dùng nhất quán. “Vật thánh” phù hợp với קֹדֶשׁ, dù “điều thánh” bớt cảm giác một đồ vật tách biệt và giữ độ rộng của danh từ. Công thức giao ước cần được bảo toàn bằng “bị cắt khỏi dân mình”; chú thích nên dùng “người ấy” thay vì “linh hồn ấy” làm bản dịch nguyên văn, đồng thời giải thích נֶפֶשׁ là thành ngữ pháp lý chỉ một người.
  issues:
  - severity: medium
    issue: “đã xúc phạm vật thánh” chưa phản ánh sát động từ חילל.
    rationale: Trong ngữ cảnh này, חילל (Piel) là làm phàm, làm ô uế/desecrate điều thuộc thánh, không đơn thuần là xúc phạm. Cần chọn cách diễn đạt nêu việc vi phạm tính thánh.
  - severity: medium
    issue: “sẽ bị loại khỏi” làm yếu công thức וְנִכְרְתָה.
    rationale: “Loại khỏi” có thể chỉ một biện pháp hành chính và không giữ được thành ngữ pháp lý-giao ước “bị cắt khỏi”, vốn cố ý không xác định cơ chế hình phạt.
  - severity: low
    issue: “mang lấy tội lỗi mình” có thể được làm gọn thành “mang tội mình”.
    rationale: Cách sửa vẫn giữ thành ngữ עונו ישא và phạm vi bao hàm trách nhiệm cùng hậu quả, nhưng tự nhiên hơn trong tiếng Việt hiện đại.
