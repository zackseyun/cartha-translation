  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: vi
  text: Ai ăn thịt ấy sẽ mang tội mình[a], vì người ấy đã làm ô uế điều thánh của Đức Giê-hô-va[b]; người ấy sẽ bị cắt khỏi dân mình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ mang lấy tội lỗi mình.” Thành ngữ Hê-bơ-rơ có thể chỉ cả trách nhiệm về tội lẫn hậu quả của tội ấy.'
    reason: lexical_alternative
  - marker: b
    text: “Điều thánh của Đức Giê-hô-va” là điều đã được biệt riêng làm thánh cho Ngài; ở đây là thịt tế lễ.
    reason: cultural_note
  - marker: c
    text: Nguyên văn là “người ấy sẽ bị cắt khỏi dân mình”; chữ thường được dịch là “linh hồn” trong ngữ cảnh pháp lý này chỉ con người. Đây là một công thức hình phạt giao ước; câu này không nói rõ đó là cái chết, sự khai trừ khỏi cộng đồng hay sự phán xét trực tiếp của Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: Ai ăn thịt ấy
  rationale: Phân từ với hậu tố chỉ bất cứ người nào ăn phần thịt tế lễ đã nói ở câu trước. Thêm “thịt” để tiếng Việt tự nhiên và làm rõ sở chỉ theo ngữ cảnh.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: sẽ phải mang lấy tội lỗi mình
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, bao hàm cả trách nhiệm phạm tội lẫn hậu quả của tội ấy, thay vì thu hẹp thành chỉ “chịu hình phạt”.
- source_word: כִּי
  choice: vì
  rationale: Nêu lý do cho hình phạt một cách tự nhiên trong tiếng Việt.
- source_word: קֹדֶשׁ יְהוָה
  choice: vật thánh của Đức Giê-hô-va
  rationale: Giữ nghĩa rộng là điều đã được biệt riêng làm thánh cho Đức Giê-hô-va; trong ngữ cảnh, đó là thịt tế lễ, nhưng danh từ Hê-bơ-rơ ở đây không nói rõ “lễ vật”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi riêng, trang trọng và quen thuộc trong tiếng Việt để biểu thị danh giao ước YHWH.
- source_word: חִלֵּל
  choice: đã xúc phạm
  rationale: Trong thể Piel, động từ có nghĩa đối xử với vật thánh như vật thường, tức làm mất tính thiêng. “Xúc phạm” tự nhiên trong tiếng Việt và phù hợp với tân ngữ là “vật thánh”.
- source_word: וְנִכְרְתָה
  choice: sẽ bị loại khỏi
  rationale: Diễn đạt công thức hình phạt giao ước mà không xác định cơ chế là xử tử, khai trừ hay sự phán xét trực tiếp của Đức Chúa Trời.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: người ấy
  rationale: נֶפֶשׁ trong văn cảnh pháp lý chỉ toàn thể con người, nên “người ấy” tự nhiên hơn “linh hồn ấy”.
- source_word: מֵעַמֶּיהָ
  choice: khỏi dân mình
  rationale: Hậu tố giống cái hòa hợp ngữ pháp với נֶפֶשׁ, nhưng sở chỉ là người phạm luật; “dân mình” chuyển tải đúng quan hệ cộng đồng mà không áp đặt giới tính.
theological_decisions:
- issue: Ý nghĩa của công thức hình phạt וְנִכְרְתָה (“bị cắt khỏi”)
  choice: sẽ bị loại khỏi dân mình
  alternative: sẽ bị xử tử; sẽ bị khai trừ; sẽ bị Đức Chúa Trời trực tiếp tiêu diệt
  rationale: Câu này không nói rõ cách hình phạt được thi hành. Bản dịch giữ độ mở của công thức giao ước, không quyết định thay văn bản giữa các cách hiểu đang được tranh luận.
- issue: Phạm vi của thành ngữ “mang lấy tội lỗi mình”
  choice: Giữ cả trách nhiệm phạm tội và hậu quả trong cùng một thành ngữ
  alternative: sẽ chịu hình phạt vì tội mình
  rationale: Bản Hê-bơ-rơ không chỉ rõ riêng hình phạt; cách dịch được chọn bảo tồn sức nặng thần học và tính hàm nghĩa của thành ngữ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ thành ngữ “mang lấy tội lỗi” để bảo tồn sắc thái của nguyên văn, đồng thời dùng “người ấy” thay cho cách dịch máy móc “linh hồn ấy”. Các dấu chú thích [a]–[c] đều xuất hiện trong chính văn.
