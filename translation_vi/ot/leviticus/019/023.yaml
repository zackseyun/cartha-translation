  to: Khi các ngươi vào xứ và trồng bất cứ cây nào cho quả làm thức ăn, các ngươi phải coi quả của nó là chưa cắt bì.[a] Trong ba năm, quả ấy sẽ là chưa cắt bì đối với các ngươi; không được ăn.
  rationale: Chỉ thay “kể ... là” bằng “coi ... là” để tiếng Việt tự nhiên hơn, không thay đổi nghĩa pháp định hay phép ẩn dụ của nguyên văn. Giữ nguyên chú thích và vị trí ký hiệu chú thích tại lần xuất hiện đầu tiên của thuật ngữ.
