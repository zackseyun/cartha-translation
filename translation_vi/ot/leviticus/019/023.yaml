  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc luật định của Hê-bơ-rơ: hoàn cảnh tương lai (“Khi”), việc trồng cây dùng làm thức ăn, mệnh lệnh xem quả là עָרְלָה, thời hạn ba năm, và lệnh cấm ăn ở thể vô nhân xưng. Việc giữ hình ảnh “chưa cắt bì” là phù hợp hơn việc thay bằng “bị cấm”; chú thích giải thích đúng nghĩa pháp định của ẩn dụ.'
