id: LEV.19.23
reference: Leviticus 19:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: vi
  text: Khi các ngươi vào xứ và trồng bất cứ cây nào cho quả làm thức ăn, các ngươi phải coi quả của nó là chưa cắt bì.[a] Trong ba năm, quả ấy sẽ là chưa cắt bì đối với các ngươi; không được ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng từ “chưa cắt bì” theo nghĩa ẩn dụ: trong ba năm đầu, quả ấy chưa được phép ăn.'
    reason: Giải thích phép ẩn dụ khó hiểu trong ngôn ngữ nguồn và hệ quả pháp định của nó.
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל־הָאָרֶץ
  choice: Khi các ngươi vào xứ
  rationale: Trong văn luật pháp, וְכִי mở đầu một hoàn cảnh tương lai; “khi” tự nhiên hơn “vì.” “Xứ” giữ nguyên quy chiếu đến miền đất đã được nhắc trong mạch văn mà không tự ý thêm “Ca-na-an.”
- source_word: וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל
  choice: và trồng bất cứ cây nào cho quả làm thức ăn
  rationale: עֵץ מַאֲכָל chỉ cây có sản vật dùng làm thức ăn. Thêm “cho quả” làm rõ theo ngữ cảnh ngay sau đó mà không giới hạn vào một loài cây cụ thể.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ
  choice: các ngươi phải kể quả của nó là chưa cắt bì
  rationale: Cách dịch này giữ phép ẩn dụ ערל/ערלה của nguyên văn, đồng thời “kể ... là” diễn đạt địa vị pháp định chứ không gợi một hành động thể lý trên quả.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: Trong ba năm
  rationale: Giữ cụm thời gian ở đầu mệnh đề như tiếng Hê-bơ-rơ và diễn đạt tự nhiên trong tiếng Việt.
- source_word: יִהְיֶה לָכֶם עֲרֵלִים
  choice: quả ấy sẽ là chưa cắt bì đối với các ngươi
  rationale: “Quả ấy” được dùng theo nghĩa tập hợp, phù hợp với động từ số ít và tính từ số nhiều trong nguyên văn; “đối với các ngươi” bảo toàn לָכֶם.
- source_word: לֹא יֵאָכֵל
  choice: không được ăn
  rationale: Cấu trúc vô nhân xưng tự nhiên trong tiếng Việt giữ lực cấm đoán và gần với thể bị động/phiếm chỉ của Niphal hơn cách chuyển thành mệnh lệnh trực tiếp “các ngươi không được ăn.”
theological_decisions:
- issue: Có giữ phép ẩn dụ “chưa cắt bì” dành cho quả hay thay bằng nghĩa chức năng “bị cấm”
  choice: Giữ “chưa cắt bì” trong chính văn
  alternative: bị cấm; chưa tỉa
  rationale: Nguyên văn chủ ý dùng ערל/ערלה, ngôn ngữ gắn với sự cắt bì, theo nghĩa ẩn dụ. “Bị cấm” nêu đúng hệ quả nhưng xóa hình ảnh; “chưa tỉa” chuyển sang cách hiểu làm vườn không được mệnh đề cấm ăn kế tiếp nâng đỡ. Chú thích giải thích nghĩa thực hành mà không làm mất sắc thái thần học của từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ lối xưng hô số nhiều trong lời luật định; giữ phép ẩn dụ của nguyên văn nhưng kèm chú thích ngay tại lần xuất hiện đầu tiên.
