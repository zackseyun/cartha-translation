  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: vi
  text: Vào năm thứ năm, anh em được ăn trái của cây, để sản lượng của cây gia tăng cho anh em. Ta là Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: Sang năm thứ năm
  rationale: Diễn đạt tự nhiên sự chuyển tiếp trong chuỗi chỉ thị pháp luật, từ những năm bị hạn chế sang năm thứ năm.
- source_word: תֹּאכְלוּ
  choice: anh em được ăn
  rationale: Thể chưa hoàn thành số nhiều trong ngữ cảnh luật pháp mang ý cho phép sau lệnh cấm trước đó; “được ăn” truyền đạt rõ sắc thái này.
- source_word: אֶת־פִּרְיוֹ
  choice: trái của cây
  rationale: פְּרִי chỉ trái cây; diễn đạt rõ đối tượng mà đại từ giống đực số ít trong tiếng Hê-bơ-rơ quy chiếu đến trong ngữ cảnh.
- source_word: לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: để cây gia tăng sản lượng cho anh em
  rationale: לְ với động từ nguyên thể diễn tả mục đích hoặc kết quả; תְּבוּאָה là sản lượng hay hoa lợi. Cách dịch giữ mối liên hệ mục đích/kết quả mà không giải thích thêm cơ chế của sự gia tăng.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ta là Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ nguyên danh giao ước Yahweh và công thức tự xưng trang nghiêm; “anh em” thể hiện ngôi thứ hai số nhiều bằng tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Quan hệ mục đích/kết quả trong לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: để cây gia tăng sản lượng cho anh em
  alternative: hầu sản lượng của cây sẽ gia tăng cho anh em
  rationale: Cấu trúc Hê-bơ-rơ có thể nghiêng về mục đích hoặc kết quả. “Để” giữ được độ mở ấy và không biến lời này thành một giải thích giáo lý về tác nhân hay cơ chế ban phước.
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. “Anh em” tránh sắc thái cổ và xa cách của “các ngươi”; “Ta” phù hợp với lời tự xưng long trọng của Đức Chúa Trời. Không cần chú thích cho câu này.
