revisions:
- from: hoặc bất cứ vật gì mà người ấy đã thề dối về nó. Người ấy phải hoàn trả đầy đủ và thêm vào một phần năm. Người ấy phải trao số đó cho người có quyền sở hữu vào ngày dâng lễ chuộc lỗi[a].
  to: hoặc bất cứ điều gì mà người ấy đã thề gian về điều đó—người ấy phải hoàn trả đầy đủ và thêm một phần năm vào đó. Người ấy phải trao cho người có quyền sở hữu vào ngày dâng lễ chuộc lỗi[a].
  rationale: Đổi “vật gì” thành “điều gì” để không thu hẹp phạm vi của nguyên văn; đổi “số đó” thành cách quy chiếu trung tính; và chỉnh chú thích để chỉ phản ánh các nghĩa có cơ sở của אַשְׁמָתוֹ. Giữ “lễ chuộc lỗi” trong bản chính theo mạch nghi lễ, đồng thời bảo toàn nghĩa thay thế trong chú thích.
