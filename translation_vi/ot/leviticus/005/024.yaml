    rationale: Cụm Hê-bơ-rơ có phạm vi “bất cứ điều gì”, không chỉ một vật thể; “điều gì” giữ được độ bao quát của nguyên văn.
  - severity: low
    issue: “số đó” gợi một số tiền.
    rationale: Đối tượng hoàn trả có thể là tài sản hay giá trị nói chung. Đại từ “đó” sau mệnh đề hoàn trả tránh giới hạn không cần thiết.
  - severity: medium
