  text: א֠וֹ מִ/כֹּ֞ל אֲשֶׁר יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒ וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ יִתְּנֶ֖/נּוּ בְּ/י֥וֹם אַשְׁמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: vi
  text: hoặc bất cứ điều gì mà người ấy đã thề gian về điều đó—người ấy phải hoàn trả đầy đủ và thêm một phần năm vào đó. Người ấy phải trao cho người có quyền sở hữu vào ngày dâng lễ chuộc lỗi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào ngày người ấy mắc lỗi.” Từ Hê-bơ-rơ ở đây có thể chỉ tình trạng tội lỗi hoặc lễ chuộc lỗi.'
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּ֞ל אֲשֶׁר
  choice: hoặc bất cứ vật gì mà
  rationale: Tiếp nối danh sách ở câu trước và giữ phạm vi rộng của כֹּל אֲשֶׁר; “vật gì” phù hợp với ngữ cảnh tài sản phải hoàn trả.
- source_word: יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒
  choice: người ấy đã thề dối về nó
  rationale: Diễn đạt trực tiếp hành vi lập lời thề gian dối liên quan đến vật đang được nói tới, đồng thời giữ quan hệ do עַל biểu thị.
- source_word: וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ
  choice: phải hoàn trả đầy đủ
  rationale: Thành ngữ pháp lý “theo phần gốc của nó” chỉ việc hoàn trả toàn bộ giá trị ban đầu; “hoàn trả đầy đủ” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו
  choice: và thêm vào một phần năm
  rationale: Giữ nguyên tỷ lệ bồi hoàn được quy định trong tiếng Hê-bơ-rơ, tức thêm hai mươi phần trăm vào phần gốc.
- source_word: לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ
  choice: cho người có quyền sở hữu
  rationale: 'Chuyển thành ngữ sở hữu theo sát nghĩa pháp lý: trao cho người mà vật đó thực sự thuộc về.'
- source_word: יִתְּנֶ֖/נּוּ
  choice: phải trao số đó
  rationale: נתן có nghĩa cơ bản là “trao/đưa”; “số đó” quy chiếu tự nhiên đến toàn bộ khoản hoàn trả cùng phần cộng thêm.
- source_word: בְּ/י֥וֹם אַשְׁמָתֽ/וֹ
  choice: vào ngày dâng lễ chuộc lỗi
  rationale: Trong mạch luật tế lễ của Lê-vi, từ cùng trường nghĩa với אָשָׁם có thể chỉ lễ vật gắn với tội lỗi; cách dịch này làm rõ mối liên hệ nghi lễ nhưng được kèm chú thích để bảo toàn nghĩa khác có thể có.
theological_decisions:
- issue: Ý nghĩa của אַשְׁמָתוֹ trong bối cảnh tế lễ
  choice: lễ chuộc lỗi
  alternative: tình trạng mắc lỗi; ngày người ấy nhận mình có lỗi
  rationale: Ngữ cảnh gần nói đến việc bồi hoàn và tiếp nối bằng quy định tế lễ, nên nghĩa chỉ lễ vật là hợp lý. Tuy nhiên, từ Hê-bơ-rơ cũng có thể chỉ chính tình trạng mắc lỗi; chú thích giữ lại sự nhập nhằng thật sự của nguyên văn.
translation_notes:
  register: Văn phong pháp lý nhưng dễ hiểu, trang trọng vừa phải. Dùng “người ấy” để nối tự nhiên với chủ thể ở các câu trước; tránh thuật ngữ chuyên môn như “tiền gốc” vì đối tượng hoàn trả có thể là tài sản chứ không chỉ là tiền.
