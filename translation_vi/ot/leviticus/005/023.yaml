  naturalness: 'Nên dùng cấu trúc luật pháp tự nhiên hơn: “Khi ... phạm tội và phải chịu trách nhiệm về tội ấy”. Việc nhất quán dùng “người ấy” thay cho “mình” làm rõ chủ thể trong chuỗi các quan hệ sở hữu và ký thác.'
  terminology: “Hoàn trả”, “cướp đoạt”, “tài sản ký gửi”, và “vật bị mất” phù hợp ngữ cảnh pháp lý. “Chiếm đoạt bằng áp bức” tự nhiên và chính xác hơn “chiếm bằng sự áp bức”.
