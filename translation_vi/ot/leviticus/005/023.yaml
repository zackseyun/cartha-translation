base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: vi
  text: Khi người ấy phạm tội và phải chịu trách nhiệm về tội ấy[a], người ấy phải hoàn trả vật người ấy đã cướp đoạt, vật người ấy đã chiếm đoạt bằng áp bức[b], tài sản ký gửi đã được giao cho người ấy giữ, hoặc vật bị mất mà người ấy đã tìm thấy[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu người ấy phạm tội và phải chịu trách nhiệm về tội ấy.” Công thức luật trong tiếng Hê-bơ-rơ có thể được hiểu là “khi” hoặc “nếu”; cụm này cũng có thể được diễn đạt là “phạm tội và mắc tội.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vật người ấy đã chiếm giữ bất công” hoặc “vật người ấy đã chiếm đoạt bằng gian lận.” Từ Hê-bơ-rơ có thể chỉ việc lấy hoặc giữ tài sản của người khác bằng áp bức hay gian lận.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “tài sản thất lạc mà người ấy đã tìm thấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Thì khi
  rationale: Công thức luật tình huống của tiếng Hê-bơ-rơ được diễn đạt tự nhiên bằng “thì khi”, vừa nối với văn cảnh vừa giới thiệu trường hợp được quy định.
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: phạm tội và mắc tội
  rationale: Giữ riêng hành vi phạm tội và tình trạng mang tội/trách nhiệm pháp lý, không thu hẹp động từ thứ hai thành việc chủ quan nhận biết tội.
- source_word: וְהֵשִׁיב
  choice: phải hoàn trả
  rationale: Trong ngữ cảnh bồi hoàn theo luật, “phải” thể hiện nghĩa vụ và “hoàn trả” rõ hơn động từ trung tính “trả lại”.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: vật mình đã cướp đoạt
  rationale: Diễn đạt tự nhiên quan hệ danh từ–động từ cùng gốc, đồng thời giữ sắc thái chiếm lấy tài sản một cách trái phép.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: vật mình đã chiếm bằng sự áp bức
  rationale: Giữ sắc thái áp bức, bóc lột hoặc chiếm giữ bất công của עשׁק mà không giới hạn nghĩa vào một hình thức gian lận cụ thể.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: tài sản ký gửi đã được giao cho mình giữ
  rationale: Làm rõ đây là tài sản được đặt dưới sự trông giữ của người ấy; “tài sản ký gửi” phù hợp với văn cảnh pháp lý.
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: vật bị mất mà mình đã tìm thấy
  rationale: Bám sát cụm từ Hê-bơ-rơ và không diễn giải quá mức bản chất pháp lý của vật đó.
theological_decisions:
- issue: Quan hệ giữa phạm tội và mắc tội
  choice: phạm tội và mắc tội
  alternative: phạm tội và nhận biết mình có tội
  rationale: וְאָשֵׁם có thể liên quan đến tình trạng chịu tội hoặc trách nhiệm; bản dịch tránh biến nghĩa này thành sự nhận thức chủ quan vốn không được nói rõ ngay trong câu.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng “người ấy/mình” để tránh giả định giới tính trong tiếng Việt trong khi vẫn giữ chủ thể số ít. Câu kết thúc bằng dấu phẩy vì nội dung cú pháp tiếp tục sang câu kế tiếp trong văn mạch.
