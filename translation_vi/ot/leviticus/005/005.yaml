revisions:
- from: Khi một người mắc tội trong bất cứ điều nào kể trên và phải chịu tội[a], người ấy phải xưng nhận tội mình đã phạm liên quan đến điều đó.[b]
  to: Khi một người có tội[a] về một trong các điều này, người ấy phải xưng nhận tội mình đã phạm về điều đó.[b]
  rationale: Sửa để loại bỏ sự lặp ý và khả năng hiểu “chịu tội” là chịu hình phạt, đồng thời bảo tồn ý pháp lý của יֶאְשַׁם, tính đơn lẻ của “một trong các điều này”, mệnh lệnh xưng nhận, và hậu tố hồi chỉ ở cuối câu. Các dấu chú thích vẫn được neo đúng tại những chỗ cần giải thích.
  reviewer_model: gpt-5.6-terra
