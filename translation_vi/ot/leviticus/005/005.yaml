  text: וְ/הָיָ֥ה כִֽי יֶאְשַׁ֖ם לְ/אַחַ֣ת מֵ/אֵ֑לֶּה וְ/הִ֨תְוַדָּ֔ה אֲשֶׁ֥ר חָטָ֖א עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: vi
  text: Khi một người có tội[a] về một trong các điều này, người ấy phải xưng nhận tội mình đã phạm về điều đó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mắc tội”, “mang tội” hoặc “chịu trách nhiệm về tội”. Động từ Hê-bơ-rơ nhấn mạnh tình trạng có tội và trách nhiệm phát sinh, không chỉ cảm giác nhận biết mình làm sai.'
    reason: lexical_alternative
  - marker: b
    text: Cụm cuối theo sát nghĩa là “điều mà người ấy đã phạm tội về điều ấy”. Hậu tố giống cái số ít trong tiếng Hê-bơ-rơ chỉ về một trong các trường hợp vừa kể.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: Khi
  rationale: Công thức pháp luật này mở đầu hoàn cảnh dẫn đến quy định tiếp theo. Tiếng Việt tự nhiên không cần dịch riêng וְהָיָה, còn כִּי trong ngữ cảnh này phù hợp với “khi” hơn “nếu”.
- source_word: יֶאְשַׁם
  choice: mắc tội ... và phải chịu tội
  rationale: Động từ אשם nhấn mạnh tình trạng có tội và trách nhiệm pháp lý phát sinh, chứ không nhất thiết nói đến việc chủ quan nhận ra lỗi. Cách dịch này giữ được sắc thái ấy.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: trong bất cứ điều nào kể trên
  rationale: Cụm từ chỉ một trong các trường hợp vừa được liệt kê; “kể trên” làm rõ hồi chỉ mà vẫn tự nhiên trong văn bản luật.
- source_word: וְהִתְוַדָּה
  choice: phải xưng nhận
  rationale: Dạng Hitpael của ידה tại đây chỉ hành vi thú nhận; “phải” diễn đạt lực quy định của mệnh đề luật pháp.
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: tội mình đã phạm liên quan đến điều đó
  rationale: Cách dịch diễn đạt nội dung phải xưng nhận và giữ đại từ hậu tố giống cái số ít trong עָלֶיהָ, hồi chỉ trường hợp liên quan.
theological_decisions:
- issue: יֶאְשַׁם có chỉ sự nhận biết chủ quan về tội hay không
  choice: Dịch theo nghĩa mắc tội và chịu trách nhiệm pháp lý
  alternative: nhận biết mình có tội
  rationale: Bản thân động từ nhấn mạnh tình trạng có tội/trách nhiệm; đưa ý “nhận biết” vào chính văn sẽ giải quyết một điểm mà tiếng Hê-bơ-rơ không nói rõ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “một người/người ấy” để diễn đạt đại từ giống đực Hê-bơ-rơ theo nghĩa đại diện, không giới hạn quy định vào nam giới. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
