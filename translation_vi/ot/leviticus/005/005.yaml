    issue: Cụm “mắc tội ... và phải chịu tội” bị trùng nghĩa và có thể làm lệch sắc thái của יֶאְשַׁם.
    rationale: Động từ này chỉ việc trở nên/có tội, chịu trách nhiệm pháp lý; “phải chịu tội” trong tiếng Việt dễ chuyển nghĩa sang phải chịu hình phạt. Bản văn chưa nói đến hình phạt tại điểm này.
  - severity: low
    issue: “Bất cứ điều nào kể trên” kém sát với לְאַחַת מֵאֵלֶּה.
    rationale: Cụm Hê-bơ-rơ nói “một trong các điều này”; “một trong” giữ rõ tính đơn lẻ của một trường hợp thuộc danh sách.
  - severity: low
    issue: Chú thích b gọi là “sát nghĩa” nhưng phần trích dẫn tiếng Việt không tự nhiên và không phản ánh sáng rõ cấu trúc nguồn.
    rationale: Nên giải thích trực tiếp rằng hậu tố giống cái số ít trong עָלֶיהָ quy chiếu về trường hợp/điều liên hệ, thay vì đưa một bản dịch sát chữ khó hiểu.
