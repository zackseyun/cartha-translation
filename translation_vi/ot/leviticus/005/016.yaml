source:
  edition: WLC
  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: vi
  text: Người ấy phải bồi hoàn điều mình đã phạm lỗi liên quan đến vật thánh[a], thêm vào đó một phần năm, rồi giao cho thầy tế lễ. Thầy tế lễ sẽ dùng con chiên đực của lễ chuộc lỗi[b] mà làm lễ chuộc tội cho người ấy, và người ấy sẽ được tha thứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều người ấy đã giữ lại trái phép từ vật thánh.” Tiếng Hê-bơ-rơ nói đến việc bồi hoàn vì một hành vi phạm lỗi liên quan đến vật thánh hoặc phần thánh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dùng con chiên đực làm lễ chuộc lỗi”; hoặc “lễ bồi hoàn.”'
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: điều mình đã phạm đến liên quan đến vật thánh
  rationale: Cụm Hê-bơ-rơ nói đến một hành vi phạm lỗi liên quan đến tài vật thánh hoặc phần thuộc về nơi thánh; cách dịch này giữ được tính khái quát mà không tự ý thêm ý 'đền thánh'.
- source_word: יְשַׁלֵּם
  choice: phải bồi hoàn
  rationale: Trong văn cảnh luật pháp và tế lễ, động từ chỉ việc hoàn trả đầy đủ thiệt hại, không chỉ đơn thuần là trả tiền.
- source_word: חֲמִישִׁתוֹ ... יוֹסֵף עָלָיו
  choice: thêm vào đó một phần năm
  rationale: Diễn đạt tự nhiên khoản phụ thu bằng một phần năm trên số phải bồi hoàn.
- source_word: לַכֹּהֵן
  choice: giao cho thầy tế lễ
  rationale: Diễn đạt trực tiếp người nhận khoản bồi hoàn; 'giao' phù hợp hơn 'đưa' trong văn phong luật lệ trang trọng.
- source_word: יְכַפֵּר עָלָיו
  choice: làm lễ chuộc tội cho người ấy
  rationale: Cách nói quen thuộc, dễ hiểu trong tiếng Việt, diễn tả hành động tế lễ nhằm thực hiện sự chuộc tội cho người phạm lỗi.
- source_word: בְּאֵיל הָאָשָׁם
  choice: dùng con chiên đực của lễ chuộc lỗi
  rationale: Giữ quan hệ cấu tạo của nguyên văn giữa con chiên đực và lễ אָשָׁם, đồng thời dùng thuật ngữ nhấn mạnh cả lỗi phạm lẫn tính chất bồi hoàn.
- source_word: וְנִסְלַח לוֹ
  choice: và người ấy sẽ được tha thứ
  rationale: Thể bị động của nguyên văn được chuyển sang cách nói tự nhiên trong tiếng Việt mà không nêu thêm chủ thể tha thứ.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ אָשָׁם
  choice: lễ chuộc lỗi
  alternative: lễ bồi hoàn
  rationale: אָשָׁם có thể nhấn mạnh cả tình trạng mắc lỗi và việc bồi hoàn. 'Lễ chuộc lỗi' là cách gọi dễ hiểu trong tiếng Việt, còn khía cạnh bồi hoàn đã được nêu rõ ở nửa đầu câu; chú thích bảo lưu cách hiểu khác.
- issue: Chủ thể ban sự tha thứ
  choice: 'giữ thể bị động: ''người ấy sẽ được tha thứ'''
  alternative: Đức Chúa Trời sẽ tha thứ cho người ấy
  rationale: Nguyên văn không nêu chủ thể trong mệnh đề này; giữ thể bị động tránh bổ sung điều không được nói rõ, dù văn cảnh thần học hàm ý sự tha thứ đến từ Đức Chúa Trời.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại và dễ hiểu. Dùng 'người ấy' để giữ sắc thái quy định chung; dùng 'thầy tế lễ' nhất quán cho כֹּהֵן. Các dấu chú thích [a], [b] đều xuất hiện ngay sau cụm từ liên quan trong chính văn.
