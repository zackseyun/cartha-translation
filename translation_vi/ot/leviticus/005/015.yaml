source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: vi
  text: '“Nếu một người phạm điều bất trung và vô ý phạm tội đối với các vật thánh thuộc về Yahweh, người ấy phải đem đến cho Yahweh lễ vật bồi hoàn[a] của mình: một con chiên đực không tì vết từ trong bầy, theo giá ngươi định bằng các siếc-lơ bạc, tính theo siếc-lơ nơi thánh[b], để làm lễ vật bồi hoàn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật chuộc lỗi” hoặc “lễ vật đền tội”. Từ Hê-bơ-rơ אָשָׁם có thể chỉ cả trách nhiệm phát sinh từ lỗi phạm lẫn sinh tế dùng để bồi hoàn lỗi ấy; chú thích này áp dụng cho cả hai lần xuất hiện trong câu.
    reason: lexical_alternative
  - marker: b
    text: “Siếc-lơ nơi thánh” là đơn vị cân chuẩn được dùng khi định giá trong thánh sở.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Trong văn luật pháp, từ này chỉ một cá nhân, chứ không nhấn mạnh phần hồn; “một người” tự nhiên và giữ được số ít của điều luật.
- source_word: תִמְעֹל מַעַל
  choice: phạm điều bất trung
  rationale: Cấu trúc động từ–danh từ cùng gốc nhấn mạnh sự vi phạm lòng trung thành hoặc nghĩa vụ thiêng liêng; cách dịch này vừa trang trọng vừa dễ hiểu.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: và vô ý phạm tội
  rationale: בִשְׁגָגָה nói đến hành vi do sơ suất hoặc không chủ ý, không phải sự cố tình chống nghịch.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: đối với các vật thánh thuộc về Yahweh
  rationale: Cụm từ chỉ những vật, lễ phẩm hoặc quyền lợi đã được biệt riêng cho Yahweh; “đối với” giữ độ rộng của giới từ מִן trong ngữ cảnh này.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng tên riêng của Đức Chúa Trời được biểu thị bằng Tetragrammaton, thay vì thay thế bằng một tước hiệu.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: lễ vật bồi hoàn
  rationale: אָשָׁם có thể chỉ trách nhiệm do lỗi phạm và sinh tế dùng để xử lý, đền bù lỗi ấy. Trong bối cảnh thiệt hại liên quan đến vật thánh và việc định giá bằng bạc, “lễ vật bồi hoàn” làm rõ sắc thái phục hồi mà vẫn giữ đây là một loại sinh tế.
- source_word: אַיִל תָּמִים
  choice: một con chiên đực không tì vết
  rationale: אַיִל là chiên đực trưởng thành; תָּמִים trong luật tế lễ nghĩa là không có khuyết tật.
- source_word: מִן הַצֹּאן
  choice: từ trong bầy
  rationale: צֹאן là bầy gia súc nhỏ; danh từ אַיִל đã xác định con vật là chiên đực nên không cần diễn giải thêm dê hay chiên.
- source_word: בְּעֶרְכְּךָ
  choice: theo giá trị ngươi định
  rationale: Giữ đại từ ngôi hai số ít trong công thức pháp lý và ý nghĩa về sự thẩm định giá trị.
- source_word: כֶּסֶף שְׁקָלִים בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: bằng bạc, tính theo siếc-lơ nơi thánh
  rationale: Diễn đạt việc định giá bằng bạc theo đơn vị cân chuẩn dùng trong thánh sở, không tự ý thêm một con số mà bản Hê-bơ-rơ không nêu rõ.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ tế lễ אָשָׁם
  choice: lễ vật bồi hoàn
  alternative: lễ vật chuộc lỗi; lễ vật đền tội
  rationale: Thuật ngữ bao hàm cả trách nhiệm do lỗi phạm lẫn lễ vật giải quyết trách nhiệm ấy. Ngữ cảnh về vật thánh và định giá bằng bạc làm nổi bật khía cạnh bồi hoàn; chú thích giữ các cách dịch truyền thống có thể biện hộ được.
- issue: Chủ thể số ít trong công thức luật pháp
  choice: người ấy phải đem
  alternative: họ phải đem
  rationale: Tiếng Hê-bơ-rơ dùng chủ thể đại diện ở số ít; tiếng Việt có thể giữ số ít tự nhiên mà không buộc phải chỉ rõ giới tính.
- issue: Phạm vi của lỗi đối với קָדְשֵׁי יְהוָה
  choice: các vật thánh thuộc về Yahweh
  alternative: những điều thánh của Yahweh
  rationale: “Các vật thánh” phù hợp bối cảnh tài sản hoặc lễ phẩm thánh, nhưng không thu hẹp thành một loại vật cụ thể không được bản văn xác định.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “người ấy” để giữ số ít mà không áp đặt giới tính; dùng “ngươi” trong cụm định giá để bảo toàn lời phán trực tiếp ở ngôi hai số ít. “Siếc-lơ” được phiên âm theo cách quen dùng trong tiếng Việt, kèm chú thích về chức năng của đơn vị.
