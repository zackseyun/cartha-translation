  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: vi
  text: Nếu một người phạm tội và làm một trong các điều Yahweh đã truyền không được làm, dù người ấy không biết, thì người ấy có tội[a] và phải mang tội lỗi của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải chịu trách nhiệm về tội ấy.” Từ Hê-bơ-rơ có thể chỉ tình trạng có tội hoặc phải chịu trách nhiệm do hành vi phạm tội.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phải gánh trách nhiệm về tội lỗi của mình.” Thành ngữ Hê-bơ-rơ “mang tội lỗi” có thể nói đến việc gánh trách nhiệm hoặc hậu quả của hành vi sai trái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Trong văn bản luật pháp này, נֶפֶשׁ chỉ một cá nhân, không nhấn mạnh linh hồn như một phần phi vật chất.
- source_word: תֶחֱטָא
  choice: phạm tội
  rationale: Động từ חטא trong ngữ cảnh luật tế lễ mang nghĩa trực tiếp là phạm tội.
- source_word: וְעָשְׂתָה אַחַת מִכָּל
  choice: làm bất cứ một điều nào trong những điều
  rationale: 'Cách dịch giữ ý phân bố của tiếng Hê-bơ-rơ: làm một hành vi thuộc số những điều bị cấm, đồng thời diễn đạt tự nhiên trong tiếng Việt.'
- source_word: מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: những điều mà các điều răn của Yahweh cấm làm
  rationale: Diễn đạt rõ hiệu lực cấm đoán của cấu trúc אֲשֶׁר לֹא תֵעָשֶׂינָה mà không biến mọi điều răn thành các hành vi bị cấm.
- source_word: וְלֹא יָדַע
  choice: dù người ấy không biết
  rationale: 'Liên từ được hiểu theo sắc thái nhượng bộ trong ngữ cảnh: sự thiếu hiểu biết không xóa bỏ trách nhiệm phát sinh từ hành vi.'
- source_word: וְאָשֵׁם
  choice: thì người ấy vẫn mắc tội
  rationale: אָשֵׁם có thể chỉ tình trạng có tội hoặc phải chịu trách nhiệm về tội; “mắc tội” giữ được sắc thái pháp lý và hệ quả của hành vi.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: và phải mang lấy tội lỗi của mình
  rationale: Giữ hình ảnh và sức nặng của thành ngữ Hê-bơ-rơ נשׂא עון, vốn có thể bao hàm việc gánh trách nhiệm hay hậu quả do tội lỗi.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Văn bản dùng trực tiếp danh giao ước יְהוָה; phiên âm “Yahweh” phân biệt danh riêng này với tước hiệu.
- issue: Trách nhiệm đối với hành vi phạm tội do không biết
  choice: dù người ấy không biết, thì người ấy vẫn mắc tội
  alternative: nếu người ấy không biết thì sau đó nhận ra mình có tội
  rationale: Cú pháp của câu khẳng định tình trạng mắc tội dù người phạm không biết; bản dịch không thêm ý rằng người ấy về sau nhận biết, vì điều đó không được nói rõ trong câu này.
- issue: Ý nghĩa của thành ngữ נשׂא עון
  choice: mang lấy tội lỗi của mình
  alternative: chịu hình phạt vì tội lỗi của mình
  rationale: Giữ sự mơ hồ có thật giữa việc mang trách nhiệm, gánh tội và chịu hậu quả, thay vì thu hẹp thành hình phạt בלבד.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng “người ấy” để chỉ cá nhân đại diện mà không gượng ép theo giống ngữ pháp Hê-bơ-rơ. “Cấm làm” truyền đạt rõ lực pháp lý; “mang lấy tội lỗi” bảo tồn hình ảnh nguyên ngữ. Các dấu chú thích được đặt ngay sau những cụm từ mà chú thích giải thích.
