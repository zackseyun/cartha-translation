source:
  edition: WLC
  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: vi
  text: 'Người ấy phải đem lễ vật bồi hoàn của mình[a] đến cho Yahweh: một con chiên đực không tì vết[b] từ bầy, theo mức ngươi định giá, làm lễ vật chuộc lỗi, đến thầy tế lễ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật chuộc lỗi của mình.” Từ Hê-bơ-rơ אָשָׁם có thể chỉ lỗi phạm, sự bồi hoàn, hoặc lễ vật chuộc lỗi.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách diễn đạt truyền thống: “không có khuyết tật.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: lễ vật bồi hoàn của mình
  rationale: אָשָׁם có thể chỉ tình trạng mắc lỗi, sự bồi hoàn hoặc lễ vật gắn với việc bồi hoàn. Ở lần xuất hiện đầu tiên, cách dịch này giữ sắc thái pháp lý–đền bù và không đồng nhất hoàn toàn với tên loại tế lễ ở phần sau.
- source_word: יָבִיא
  choice: phải đem ... đến dâng
  rationale: Thể Hiphil chưa hoàn thành trong điều luật mang lực quy định; “phải” diễn đạt tự nhiên nghĩa bắt buộc trong tiếng Việt hiện đại.
- source_word: לַיהוָה
  choice: đến dâng lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng phiên âm Yahweh; giới từ ל được diễn đạt theo hướng dâng lễ vật cho Đức Chúa Trời.
- source_word: אַיִל
  choice: con chiên đực
  rationale: Chỉ chính xác một con cừu đực dùng làm sinh tế; “chiên đực” là cách gọi quen thuộc, trang trọng trong văn cảnh Kinh Thánh.
- source_word: תָּמִים
  choice: không tì vết
  rationale: Diễn đạt tình trạng nguyên vẹn, không có khuyết tật khiến con vật không đủ tiêu chuẩn làm sinh tế.
- source_word: מִן הַצֹּאן
  choice: lấy từ bầy
  rationale: צֹאן là bầy gia súc nhỏ, chủ yếu gồm chiên và dê; danh từ אַיִל phía trước đã xác định con vật là chiên đực.
- source_word: בְּעֶרְכְּךָ
  choice: theo giá trị ngươi ấn định
  rationale: Giữ sắc thái định giá pháp lý và hậu tố ngôi thứ hai số ít của nguyên văn, không tự ý xác định thêm người định giá.
- source_word: לְאָשָׁם
  choice: làm lễ vật chuộc lỗi
  rationale: Trong công thức tế lễ này, אָשָׁם chỉ loại lễ vật cụ thể; “lễ vật chuộc lỗi” rõ nghĩa và phân biệt với sắc thái bồi hoàn của lần xuất hiện đầu.
- source_word: אֶל הַכֹּהֵן
  choice: giao cho thầy tế lễ
  rationale: Diễn đạt hướng chuyển lễ vật đến thầy tế lễ để người này thi hành nghi thức.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” giữ tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Hai lần dùng אָשָׁם với sắc thái chồng lấn
  choice: 'Lần đầu: “lễ vật bồi hoàn”; lần sau: “lễ vật chuộc lỗi”'
  alternative: Dịch cả hai lần là “lễ vật chuộc lỗi” hoặc cả hai là “lễ vật bồi hoàn”
  rationale: Cách phân biệt này bảo toàn cả chiều kích bồi hoàn của điều luật và tên loại tế lễ, nhưng không phủ nhận rằng cùng một từ Hê-bơ-rơ có thể bao hàm cả hai nghĩa.
translation_notes:
  register: Văn phong luật tế lễ trang trọng nhưng dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “ngươi” để giữ hậu tố ngôi thứ hai số ít trong lời chỉ dẫn; dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh phổ thông. Trật tự câu được điều chỉnh nhẹ cho tự nhiên, đồng thời giữ các thành phần và độ mơ hồ quan trọng của nguyên văn.
