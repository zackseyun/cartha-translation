source:
  edition: WLC
  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: vi
  text: 'Nhưng nếu người ấy không đủ khả năng sắm một con chiên, thì vì tội mình đã phạm, người ấy phải dâng cho Đức Giê-hô-va lễ chuộc lỗi của mình: hai con chim gáy hoặc hai con bồ câu non, một con dùng làm lễ chuộc tội[a], còn một con dùng làm lễ thiêu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ “tội” hoặc lễ vật dùng để xử lý tội lỗi hay sự ô uế trong nghi thức tế lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: không đủ khả năng dâng một con chiên
  rationale: Thành ngữ theo nghĩa đen nói tay người ấy không với tới mức đủ cho một con chiên, tức là không có đủ điều kiện kinh tế; cách dịch này truyền đạt rõ ý mà không diễn giải quá mức.
- source_word: אֲשָׁמוֹ
  choice: lễ vật đền lỗi của mình
  rationale: Trong ngữ cảnh này, từ này chỉ lễ vật người phạm tội phải mang đến vì lỗi của mình. “Đền lỗi” giữ được sắc thái trách nhiệm và sự sửa chữa, đồng thời tránh đồng nhất lễ vật này với một con vật riêng biệt, vì ngay sau đó lễ vật gồm một lễ chuộc tội và một lễ thiêu.
- source_word: אֲשֶׁר חָטָא
  choice: vì tội mình đã phạm
  rationale: Diễn đạt tự nhiên quan hệ giữa hành vi phạm tội và lễ vật phải dâng.
- source_word: שְׁתֵּי תֹרִים
  choice: hai con chim gáy
  rationale: “Chim gáy” là tên gọi tiếng Việt thông dụng cho loài chim thuộc nhóm turtledove được dùng trong quy định tế lễ.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: hai con bồ câu non
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “hai con của bồ câu”, một thành ngữ chỉ bồ câu còn non.
- source_word: לַיהוָה
  choice: cho Đức Giê-hô-va
  rationale: Dùng tên riêng truyền thống trong tiếng Việt để thể hiện danh יהוה, thay vì thay thế danh ấy bằng một danh xưng chung.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong văn cảnh tế lễ, חַטָּאת chỉ loại lễ vật liên hệ đến việc xử lý tội lỗi hoặc sự ô uế; bản chính dùng cách gọi quen thuộc, còn nghĩa “thanh tẩy” được giữ trong chú thích.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; “lễ thiêu” là cách gọi ngắn gọn, rõ ràng và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ tế lễ חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Thuật ngữ có thể nhấn mạnh tội lỗi hoặc chức năng thanh tẩy khỏi tình trạng ô uế. Ngữ cảnh luật tế lễ và sự song hành với lễ thiêu ủng hộ cách gọi truyền thống trong bản chính, nhưng chú thích giữ lại cách hiểu quan trọng còn lại.
- issue: Cách hiểu אֲשָׁם trong câu này
  choice: lễ vật đền lỗi
  alternative: lễ vật chuộc lỗi
  rationale: Ở đây từ này bao quát lễ vật người ấy phải mang đến vì đã phạm tội, trong khi chính lễ vật gồm một con làm lễ chuộc tội và một con làm lễ thiêu. “Đền lỗi” giữ sắc thái trách nhiệm mà không xóa mối căng thẳng giữa nghĩa “lỗi” và nghĩa tên gọi tế lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc điều kiện của luật tế lễ. Dùng “người ấy” để diễn đạt chủ thể số ít không xác định, và dùng các thuật ngữ tế lễ nhất quán nhưng không quá cổ.
