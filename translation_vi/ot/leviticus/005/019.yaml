  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: vi
  text: Đó là lễ vật chuộc lỗi[a]; người ấy quả thật đã có lỗi với Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đó là lễ vật chuộc lỗi; người ấy chắc chắn có lỗi với Đức Giê-hô-va.” Tiếng Hê-bơ-rơ lặp lại gốc từ אשם (“lỗi”, “có lỗi”, “lễ vật chuộc lỗi”) để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: lễ vật chuộc lỗi
  rationale: Trong ngữ cảnh tế lễ, danh từ này chỉ lễ vật được dâng vì tình trạng có lỗi và nghĩa vụ khắc phục; cách dịch này tự nhiên, dễ hiểu và vẫn phân biệt với lễ vật chuộc tội.
- source_word: הוּא
  choice: Đó là
  rationale: Đại từ làm vị ngữ, xác định bản chất của lễ vật vừa được nói đến.
- source_word: אָשֹׁם אָשַׁם
  choice: quả thật đã mắc lỗi
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ hữu hạn cùng gốc tạo ý nhấn mạnh; “quả thật” chuyển tải sự nhấn mạnh ấy mà không lặp từ gượng gạo.
- source_word: לַיהוָה
  choice: với Đức Giê-hô-va
  rationale: Giới từ ל sau אשם diễn tả trách nhiệm hay tình trạng có lỗi trong tương quan với YHWH. “Với” giữ được độ mở giữa sắc thái “trước mặt” và “đối với/chống lại” hơn là quyết đoán quá mức.
- source_word: יהוה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh Đức Chúa Trời quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt.
theological_decisions:
- issue: Quan hệ của לַיהוָה với động từ אשם
  choice: Người ấy mắc lỗi trong tương quan với Đức Giê-hô-va.
  alternative: Người ấy mắc lỗi chống lại Đức Giê-hô-va; hoặc lễ vật chuộc lỗi được dâng lên Đức Giê-hô-va.
  rationale: Cú pháp gắn cụm từ này tự nhiên nhất với mệnh đề động từ, nhưng giới từ ל không nhất thiết hàm ý hành vi thù nghịch trực tiếp. Bản dịch “với” giữ lại sự căng thẳng và độ mơ hồ có thật của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự liên hệ từ vựng giữa “lễ vật chuộc lỗi” và “mắc lỗi”, đồng thời dùng chú thích để cho thấy phép lặp nhấn mạnh trong tiếng Hê-bơ-rơ.
