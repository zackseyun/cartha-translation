id: LEV.5.14
reference: Leviticus 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/014.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: YHWH; “Yahweh” là cách đọc thường được phục nguyên của danh này.'
    reason: Giải thích dạng danh thánh trong nguyên bản và tránh trình bày cách phát âm phục nguyên như điều hoàn toàn chắc chắn.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời phán của Đức Chúa Trời được diễn đạt tự nhiên và trang trọng bằng “phán”; dạng có waw tiếp diễn đánh dấu một sự kiện lời nói mới trong mạch trình thuật.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì âm thầm thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu chỉ việc nói với một người, “phán với” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dạng nguyên mẫu này dẫn vào nội dung lời phán ở câu kế tiếp; “rằng” duy trì chức năng liên kết ấy mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo toàn tính chất tên riêng; chú thích nêu rõ dạng phụ âm Hê-bơ-rơ và sự không chắc chắn về cách phát âm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán với” phù hợp với công thức lời phán thần linh; dấu hai chấm báo trước nội dung bắt đầu ở câu tiếp theo. Dấu chú thích [a] được đặt ngay sau từ “Yahweh”, là từ mà chú thích giải thích.
