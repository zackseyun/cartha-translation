revisions:
- from: Nếu một người phạm tội vì đã nghe lời thề nguyền công khai[a] và là nhân chứng—dù đã thấy hay biết sự việc—mà không khai báo, thì người ấy phải mang lấy tội mình[b].
  to: 'Nếu một người phạm tội: người ấy nghe lời hiệu triệu có lời thề, là nhân chứng—hoặc đã thấy, hoặc biết sự việc—mà không khai báo, thì người ấy phải mang lấy tội mình[a].'
  rationale: Bản sửa giữ cấu trúc điều luật và toàn bộ các thành tố của tiếng Hê-bơ-rơ, đồng thời tránh hiểu rằng hành vi nghe lời hiệu triệu tự nó là tội. “Lời hiệu triệu có lời thề” diễn tả chức năng pháp lý của קוֹל אָלָה mà không khẳng định một thủ tục tòa án hiện đại hoặc thêm tính từ “công khai” không có trong văn bản Hê-bơ-rơ. Chú thích bảo lưu cách hiểu sát chữ và nghĩa rộng của thành ngữ “mang lấy tội mình.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:44:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nắm đúng tình huống pháp lý: người có tư cách làm chứng, đã thấy hoặc biết sự việc, không khai báo thì phải chịu trách nhiệm về tội mình. Tuy nhiên, “vì đã nghe” có thể khiến người đọc hiểu việc nghe lời thề nguyền tự nó là nguyên nhân trực tiếp của tội. Trong nguyên văn, lỗi nằm ở việc không khai báo sau khi nghe lời hiệu triệu có lời thề. Cụm “dù đã thấy hay biết” cũng làm yếu cặp lựa chọn אוֹ ... אוֹ (“hoặc ... hoặc”).'
  naturalness: Văn phong nhìn chung tự nhiên và phù hợp register luật lệ. Bản sửa làm quan hệ điều kiện–hậu quả rõ hơn, thay “dù ... hay ...” bằng cặp “hoặc ... hoặc”, và dùng cách giải thích pháp lý rõ ràng hơn cho קוֹל אָלָה.
  terminology: “Một người,” “nhân chứng,” “khai báo,” và “mang lấy tội mình” phù hợp. “Lời thề nguyền công khai” dễ bị hiểu là một lời thề được thực hiện công khai, thay vì một lời hiệu triệu có lời thề buộc người biết việc phải lên tiếng. Trong chú thích b, “sự gian ác” không phải lựa chọn Việt ngữ tốt cho עָוֹן ở đây; “tội lỗi” hoặc “tội mình” phù hợp hơn.
  issues:
  - severity: medium
    issue: Quan hệ giữa việc nghe lời thề và hành vi phạm tội chưa đủ rõ
    rationale: “phạm tội vì đã nghe ... mà không khai báo” có thể gán quan hệ nguyên nhân trực tiếp cho việc nghe. Cần diễn đạt sao cho việc không khai báo là hành vi có lỗi trong điều kiện được nêu.
  - severity: low
    issue: Cặp lựa chọn “hoặc đã thấy hoặc biết” bị chuyển thành cấu trúc nhượng bộ
    rationale: אוֹ רָאָה אוֹ יָדָע nêu hai khả năng về căn cứ biết sự việc; “dù ... hay ...” kém sát hơn “hoặc ... hoặc”.
  - severity: low
    issue: Chú thích b dùng “sự gian ác”
    rationale: Cách nói này trong tiếng Việt hiện đại gợi tính chất độc ác hơn là trách nhiệm/tội lỗi pháp lý mà עָוֹן có thể chỉ ở đây.
