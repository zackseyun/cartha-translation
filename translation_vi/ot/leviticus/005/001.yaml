id: LEV.5.1
reference: Leviticus 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: vi
  text: 'Nếu một người phạm tội: người ấy nghe lời hiệu triệu có lời thề, là nhân chứng—hoặc đã thấy, hoặc biết sự việc—mà không khai báo, thì người ấy phải mang lấy tội mình[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “phải mang lấy tội lỗi mình.” Sát chữ, cụm đầu của câu là “nghe tiếng của một lời thề”; trong ngữ cảnh pháp lý, đây có thể chỉ một lời hiệu triệu long trọng, có lời thề, kêu gọi người biết sự việc ra làm chứng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Trong luật lệ, נֶפֶשׁ chỉ một cá nhân, không nhấn mạnh khái niệm siêu hình về “linh hồn”; “một người” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: תֶחֱטָא
  choice: phạm tội
  rationale: Động từ חטא diễn tả một hành vi có lỗi cả về đạo đức lẫn pháp lý; “phạm tội” giữ được hai sắc thái ấy.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: đã nghe lời thề nguyền công khai
  rationale: Cụm קוֹל אָלָה theo văn cảnh pháp lý chỉ lời thề nguyền hay lời hiệu triệu trang trọng yêu cầu người biết sự việc ra làm chứng. “Công khai” làm rõ chức năng pháp lý mà không giới hạn vào một thủ tục tòa án hiện đại.
- source_word: וְהוּא עֵד
  choice: và là nhân chứng
  rationale: Diễn đạt trực tiếp tư cách của người ấy đối với sự việc, đồng thời giữ sắc thái pháp lý của עֵד.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: dù đã thấy hay biết sự việc
  rationale: 'Giữ hai nguồn hiểu biết trong nguyên văn: trực tiếp nhìn thấy hoặc biết bằng cách khác; “sự việc” được thêm ngầm để câu tiếng Việt rõ và tự nhiên.'
- source_word: אִם לֹא יַגִּיד
  choice: mà không khai báo
  rationale: Hiphil của נגד có nghĩa làm cho biết, trình báo hoặc công bố. “Khai báo” phù hợp bối cảnh nhân chứng nhưng không ấn định quá mức một thủ tục xét xử cụ thể.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: phải mang lấy tội mình
  rationale: 'Giữ hình ảnh và sức nặng pháp lý-thần học của thành ngữ Hê-bơ-rơ: người ấy vẫn phải gánh trách nhiệm về tội lỗi và hậu quả của mình.'
theological_decisions:
- issue: Quan hệ giữa việc nghe lời thề nguyền và hành vi phạm tội
  choice: Dịch כִּי bằng “vì” trong cấu trúc “phạm tội vì đã nghe... mà không khai báo”
  alternative: 'Dịch theo chuỗi thời gian: “khi nghe... nếu không khai báo”'
  rationale: Trong điều luật này, tội không nằm ở việc chỉ nghe lời thề nguyền, nhưng ở việc người có tư cách nhân chứng nghe lời kêu gọi ấy mà vẫn không khai báo. Cấu trúc toàn câu tiếng Việt làm rõ quan hệ này mà không thêm một tội danh ngoài nguyên văn.
- issue: Phạm vi của קוֹל אָלָה
  choice: “lời thề nguyền công khai”
  alternative: “tiếng của một lời thề” hoặc “lời nguyền rủa”
  rationale: Cụm từ có thể được hiểu sát chữ là “tiếng/lời của một lời thề nguyền”, nhưng trong văn cảnh nó là lời hiệu triệu trang trọng buộc nhân chứng lên tiếng. Bản dịch chính nêu chức năng này; chú thích bảo lưu cách hiểu sát chữ.
- issue: Ý nghĩa của “mang lấy tội mình”
  choice: Giữ thành ngữ, không đồng nhất hoàn toàn với hình phạt
  alternative: “phải chịu hình phạt vì tội mình”
  rationale: עָוֹן có thể bao hàm tội lỗi, trách nhiệm và hậu quả, nên dịch thẳng thành “hình phạt” sẽ thu hẹp sự căng thẳng ngữ nghĩa và thần học của nguyên văn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “người ấy” thay cho đại từ mang giới tính vì נֶפֶשׁ ở đây có nghĩa chung là một người; tiếng Việt không cần áp đặt giới tính ngữ pháp. Dấu gạch ngang giúp tách phần giải thích về căn cứ làm chứng mà vẫn giữ cấu trúc một câu của nguyên văn.
