  text: 'Gia-vê phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời phán của Đức Chúa Trời được chuyển là “phán”, tự nhiên và trang trọng trong tiếng Việt, đồng thời phân biệt với לֵאמֹר theo sau.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước יְהוָה bằng cách gọi quen thuộc “Đức Giê-hô-va”, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, giới từ אֶל chỉ người tiếp nhận lời nói và được diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn nhập lời nói, “rằng” báo hiệu nội dung lời phán tiếp nối ở câu sau và tránh lối diễn đạt nặng nề “mà rằng”.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản nguồn dùng trực tiếp Tứ Tự Danh. “Đức Giê-hô-va” giữ chức năng danh riêng và là cách gọi dễ nhận biết đối với độc giả Kinh Thánh tiếng Việt, không thay danh ấy bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích; giữ nguyên công thức mở đầu một đơn vị lời phán, với dấu hai chấm cho biết nội dung tiếp tục ở câu kế.
