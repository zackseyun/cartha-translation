revisions:
- from: Nếu một người phạm tội và bất trung với Yahweh, khi lừa dối người đồng loại về vật được ký gửi, vật cầm cố[a], hoặc bằng cách cướp đoạt, hay khi bóc lột người đồng loại mình,
