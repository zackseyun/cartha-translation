source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: vi
  text: Nếu một người phạm tội và bội tín đối với Yahweh, khi người ấy lừa dối người đồng loại về tài sản được ký gửi, hoặc vật cầm cố[a], hoặc có hành vi cướp đoạt, hoặc áp bức người đồng loại mình,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “vật được đặt vào tay”; cũng có thể hiểu là vật được giao phó hoặc vật bảo chứng.'
    reason: Cụm תְשׂוּמֶת יָד hiếm và phạm vi nghĩa pháp lý của nó chưa hoàn toàn chắc chắn.
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Trong luật lệ, từ này chỉ một cá nhân, không nhấn mạnh phần linh hồn; “một người” tự nhiên và giữ chủ thể số ít.
- source_word: כִּי תֶחֱטָא
  choice: Nếu ... phạm tội
  rationale: כִּי cùng thể chưa hoàn thành mở đầu điều kiện trong thể văn luật pháp.
- source_word: וּמָעֲלָה מַעַל
  choice: và bất trung
  rationale: Cấu trúc đồng căn nhấn mạnh hành vi phản bội lòng tin; “bất trung” giữ sắc thái quan hệ và giao ước mà không dùng thuật ngữ cổ khó hiểu.
- source_word: בַּיהוָה
  choice: với Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời và diễn đạt hành vi bất trung hướng đến Ngài.
- source_word: וְכִחֵשׁ
  choice: khi lừa dối
  rationale: Động từ có thể chỉ chối, nói dối hoặc hành xử gian dối; “lừa dối” phù hợp phạm vi nghĩa trong bối cảnh pháp lý.
- source_word: בַּעֲמִיתוֹ
  choice: người đồng loại
  rationale: עָמִית chỉ người cùng cộng đồng; “người đồng loại” rõ nghĩa và trang trọng, không thu hẹp vào người sống gần nhà.
- source_word: בְּפִקָּדוֹן
  choice: về vật được ký gửi
  rationale: Danh từ chỉ tài sản được giao cho người khác giữ; cách dịch này nêu rõ vật và quan hệ ủy thác.
- source_word: בִתְשׂוּמֶת יָד
  choice: vật cầm cố
  rationale: Thành ngữ nghĩa đen là “vật đặt vào tay”, có lẽ chỉ vật được trao hoặc dùng làm bảo chứng; chọn cách diễn đạt pháp lý gọn, đồng thời ghi nhận sự bất định trong chú thích.
- source_word: בְגָזֵל
  choice: bằng cách cướp đoạt
  rationale: Danh từ chỉ hành vi hoặc tài vật bị lấy bằng sức mạnh; cách dịch này giữ mối liên hệ với hành vi gian dối mà không thêm một đối tượng không có trong câu.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: bóc lột người đồng loại mình
  rationale: Động từ bao quát sự áp bức kinh tế, cưỡng đoạt hoặc giữ lại điều thuộc về người khác; “bóc lột” tự nhiên trong tiếng Việt và hợp bối cảnh tài sản.
theological_decisions:
- issue: Một hành vi gian dối đối với người khác đồng thời là sự bất trung với Đức Chúa Trời
  choice: bất trung với Yahweh
  alternative: phạm điều bất tín đối với Yahweh
  rationale: Bản Hê-bơ-rơ trực tiếp đặt sai phạm xã hội và kinh tế trong quan hệ với Yahweh; bản dịch giữ chiều kích này mà không giải thích thêm.
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA
  rationale: Dùng “Yahweh” như một danh riêng, phù hợp chứng cứ ngôn ngữ nguồn và lớp tham khảo đã được định hướng.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Câu được để mở bằng dấu phẩy vì đây là mệnh đề điều kiện tiếp nối sang câu sau. Dùng “người ấy/người đồng loại” theo lối trung tính tự nhiên của tiếng Việt, không đưa giới tính ngữ pháp Hê-bơ-rơ vào bản dịch.
