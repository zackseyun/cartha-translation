  - severity: medium
    issue: Liên kết “lừa dối ... hoặc bằng cách cướp đoạt” có thể gây nhập nhằng cú pháp.
    rationale: Tiếng Hê-bơ-rơ liệt kê các trường hợp bằng các cụm song song. Nêu “có hành vi cướp đoạt” giúp độc giả nhận đây là một mục độc lập.
  - severity: low
