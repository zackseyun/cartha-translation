  text: וְ/הֵבִ֤יא אֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן וְ/הִקְרִ֛יב אֶת אֲשֶׁ֥ר לַ/חַטָּ֖את רִאשׁוֹנָ֑ה וּ/מָלַ֧ק אֶת רֹאשׁ֛/וֹ מִ/מּ֥וּל עָרְפּ֖/וֹ וְ/לֹ֥א יַבְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: vi
  text: Người ấy phải đem hai con chim đến cho thầy tế lễ. Trước hết, thầy tế lễ phải dâng con dành làm lễ chuộc tội[a], rồi bấm đầu nó ở phía trước gáy[b], nhưng không được làm đầu lìa hẳn khỏi thân[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy”; trong các luật tế lễ của sách Lê-vi, từ Hê-bơ-rơ חַטָּאת có thể nhấn mạnh việc thanh tẩy khỏi sự ô uế.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ chỉ vị trí thao tác ở cổ chim khó xác định chính xác; sát nghĩa là “ở phía trước” hoặc “đối diện gáy”.
    reason: textual_or_semantic_ambiguity
  - marker: c
    text: Tức là đầu chim không được tách rời hoàn toàn khỏi thân.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: Người ấy phải đem hai con chim đến cho thầy tế lễ
  rationale: Dạng luật lệ được diễn đạt tự nhiên bằng “phải”; “chúng” được nói rõ là “hai con chim” theo ngữ cảnh ngay trước đó, mà không thêm nội dung mới.
- source_word: וְהִקְרִיב אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: Trước hết, thầy tế lễ phải dâng con dành làm lễ chuộc tội
  rationale: “Dâng” thể hiện nghĩa tế lễ của קרב ở thể Hiphil, còn “trước hết” giữ rõ thứ tự רִאשׁוֹנָה. Sau khi người dâng lễ đem chim đến, nghi thức tiếp theo thuộc về thầy tế lễ; việc nêu lại chủ thể giúp tiếng Việt rõ ràng.
- source_word: חַטָּאת
  choice: lễ chuộc tội
  rationale: Đây là cách gọi quen thuộc và dễ hiểu trong tiếng Việt cho loại lễ vật này; chú thích giữ lại khả năng hiểu là “lễ thanh tẩy” trong ngữ cảnh tế lễ Lê-vi.
- source_word: וּמָלַק
  choice: bấm đứt cổ
  rationale: מלק là động từ chuyên biệt chỉ thao tác bằng tay của thầy tế lễ đối với cổ chim. “Bấm đứt cổ” diễn tả hành động mạnh ở cổ nhưng, nhờ mệnh đề sau, không hàm ý đầu bị tách rời hoàn toàn.
- source_word: מִמּוּל עָרְפּוֹ
  choice: ở phía trước gáy
  rationale: ערף là gáy hay phần sau cổ, còn מול chỉ vị trí ở phía trước hoặc đối diện; cách dịch này giữ cấu trúc không gian khó của tiếng Hê-bơ-rơ thay vì đổi thành một vị trí chắc chắn hơn.
- source_word: וְלֹא יַבְדִּיל
  choice: nhưng không được làm đầu lìa hẳn
  rationale: בדל có nghĩa tách hay phân rời. Trong nghi thức này, mệnh đề cấm việc tách đầu hoàn toàn khỏi thân chim; “lìa hẳn” truyền đạt rõ giới hạn đó.
theological_decisions:
- issue: Ý nghĩa của חַטָּאת trong luật tế lễ
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: Cả hai cách gọi đều có cơ sở trong ngữ cảnh Lê-vi. Bản chính dùng cách gọi phổ thông hơn, còn chú thích bảo tồn sắc thái thanh tẩy mà không áp đặt một cách giải thích thần học duy nhất.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng “phải” và “không được” thay cho lối cổ. Các thuật ngữ tế lễ được giữ nhất quán và dễ hiểu; những điểm không chắc chắn của thuật ngữ nghi lễ và vị trí giải phẫu được bảo tồn trong chú thích.
