    rationale: Nguyên văn nói thao tác מָלַק đối với “đầu nó”, rồi ngay sau đó nói không được phân tách. Bản dịch nên tránh từ “đứt” vì từ này thường xác nhận chính điều mệnh đề sau giới hạn.
