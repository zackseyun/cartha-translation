id: LEV.5.2
reference: Leviticus 5:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: vi
  text: Hoặc nếu một người chạm vào bất cứ vật gì ô uế—dù là xác thú hoang ô uế, xác gia súc ô uế, hay xác sinh vật bò lúc nhúc ô uế—mà người ấy không hay biết[a], thì người ấy bị ô uế và mắc tội[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “điều ấy bị che khuất khỏi người ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Tức là người ấy mắc trách nhiệm theo luật thanh sạch vì tình trạng ô uế này; câu không nhất thiết coi việc vô tình chạm vào xác là điều ác về mặt đạo đức giống như một tội cố ý.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Trong văn luật pháp, từ này chỉ một cá nhân, không nhấn mạnh phần linh hồn phi vật chất. “Một người” tự nhiên và bao quát trong tiếng Việt.
- source_word: תִּגַּע בְּ
  choice: chạm vào
  rationale: Động từ với giới từ ב diễn tả sự tiếp xúc; “chạm vào” là cách nói rõ ràng, trực tiếp.
- source_word: כָל דָּבָר טָמֵא
  choice: bất cứ vật gì ô uế
  rationale: דָּבָר có nghĩa rộng là “vật, sự việc”; tại đây chỉ hạng mục tổng quát được các trường hợp phía sau triển khai.
- source_word: נִבְלַת
  choice: xác
  rationale: Trong luật thanh sạch Lê-vi, נְבֵלָה chỉ xác động vật chết. “Xác” chính xác và tự nhiên trong tiếng Việt.
- source_word: חַיָּה טְמֵאָה
  choice: thú hoang ô uế
  rationale: חַיָּה ở đây đối lập với בְּהֵמָה, nên chỉ thú sống hoang dã chứ không phải động vật nói chung.
- source_word: בְּהֵמָה טְמֵאָה
  choice: gia súc ô uế
  rationale: בְּהֵמָה trong sự đối chiếu này chỉ các động vật lớn đã được thuần dưỡng; “gia súc” giữ rõ sự tương phản với thú hoang.
- source_word: שֶׁרֶץ טָמֵא
  choice: sinh vật bò lúc nhúc ô uế
  rationale: שֶׁרֶץ chỉ các sinh vật nhỏ di chuyển thành đàn hoặc bò lúc nhúc. Cách dịch này tránh thu hẹp sai thành riêng côn trùng hay dùng thuật ngữ phân loại hiện đại “bò sát”.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: mà người ấy không hay biết
  rationale: Nghĩa đen là sự việc “bị che khuất khỏi” người ấy, tức người ấy không nhận biết. Bản dịch chính dùng thành ngữ tiếng Việt tự nhiên; nghĩa đen được giữ trong chú thích.
- source_word: וְהוּא טָמֵא
  choice: thì người ấy bị ô uế
  rationale: Mệnh đề xác nhận tình trạng ô uế phát sinh. “Bị ô uế” diễn đạt trạng thái theo luật nghi lễ mà không đồng nhất nó với sự suy đồi đạo đức.
- source_word: וְאָשֵׁם
  choice: và mắc tội
  rationale: אָשֵׁם biểu thị việc mang tội hoặc mắc trách nhiệm trong bối cảnh luật pháp. “Mắc tội” giữ sức nặng của nguyên văn; chú thích làm rõ rằng ở đây không nhất thiết nói hành vi cố ý gian ác.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: Dịch טָמֵא/טְמֵאָה là “ô uế”.
  alternative: “không thanh sạch” hoặc “bị làm nhơ”
  rationale: Câu này nói về tình trạng ô uế theo luật nghi lễ do tiếp xúc với xác động vật, không mặc nhiên gọi sự tiếp xúc ấy là điều ác về mặt đạo đức. “Ô uế” là thuật ngữ quen thuộc, trang trọng và giữ được phạm trù của sách Lê-vi.
- issue: Ý nghĩa của אָשֵׁם
  choice: Giữ cách nói “mắc tội”, kèm chú thích về trách nhiệm theo luật thanh sạch.
  alternative: “phải chịu trách nhiệm” hoặc “mang lỗi”
  rationale: Nguyên văn dùng một từ có sức nặng về tội và trách nhiệm pháp lý. Không nên làm nhẹ thành hệ quả thuần túy kỹ thuật, nhưng cũng không nên khiến độc giả hiểu rằng việc vô tình chạm xác tự nó là điều ác cố ý.
- issue: Chủ thể đại diện
  choice: Dùng “một người” và lặp lại “người ấy”.
  alternative: Dùng “người nào” hoặc đại từ mang dấu ấn giới tính
  rationale: נֶפֶשׁ ở đây chỉ bất kỳ cá nhân nào. Tiếng Việt không cần áp giới tính cho đại từ số ít, nên “người ấy” vừa sát phạm vi chung vừa tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang phân định ba loại xác động vật. Câu kết bằng dấu phẩy vì mệnh đề luật pháp còn tiếp tục sang câu kế tiếp. Các thuật ngữ “ô uế” và “mắc tội” giữ âm hưởng pháp luật–nghi lễ của nguyên văn, với chú thích ngăn cách hiểu thuần đạo đức hóa.
