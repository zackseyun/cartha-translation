  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: vi
  text: Còn con chim thứ hai, thầy tế lễ phải dâng làm lễ thiêu theo thể thức đã định[a]. Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy về tội người ấy đã phạm, và người ấy sẽ được tha thứ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo quy định.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ dùng thể bị động và không nêu đích danh Đấng tha thứ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: con chim thứ hai
  rationale: Tính từ thứ tự chỉ con chim thứ hai trong nghi thức ở câu trước; thêm “con chim” để tiếng Việt rõ nghĩa theo ngữ cảnh.
- source_word: יַעֲשֶׂה עֹלָה
  choice: dâng ... làm lễ thiêu
  rationale: Trong ngữ cảnh tế lễ, עשה chỉ việc thực hiện/dâng sinh tế; cách diễn đạt này tự nhiên trong tiếng Việt mà không thêm chi tiết nghi lễ ngoài nguyên văn.
- source_word: כַּמִּשְׁפָּט
  choice: theo đúng quy định
  rationale: מִשְׁפָּט ở đây chỉ quy tắc hay thể thức đã được ấn định cho lễ vật.
- source_word: וְכִפֶּר עָלָיו
  choice: sẽ làm lễ chuộc tội cho người ấy
  rationale: Giữ thuật ngữ tế lễ của כפר và diễn đạt עָלָיו tự nhiên trong tiếng Việt.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: về tội người ấy đã phạm
  rationale: Phản ánh hành vi phạm tội làm căn cứ của nghi thức chuộc tội, đồng thời tránh lối lặp gượng của nguyên ngữ.
- source_word: וְנִסְלַח לוֹ
  choice: và người ấy sẽ được tha thứ
  rationale: Giữ cấu trúc bị động, không nêu rõ tác nhân tha thứ khi tiếng Hê-bơ-rơ để tác nhân ấy hàm ẩn.
theological_decisions:
- issue: Ngôn ngữ chuộc tội trong nghi lễ tế lễ
  choice: làm lễ chuộc tội cho người ấy
  alternative: thanh tẩy người ấy; xin sự tha thứ cho người ấy
  rationale: Cách dịch giữ phạm trù tế lễ của כפר, không thu hẹp ý nghĩa thành riêng sự thanh tẩy hoặc biến kết quả tha thứ thành chính nghĩa của động từ.
- issue: Công thức tha thứ ở thể bị động
  choice: người ấy sẽ được tha thứ
  alternative: Đức Giê-hô-va sẽ tha thứ cho người ấy
  rationale: Nguyên văn không nói rõ chủ thể của hành động tha thứ; giữ thể bị động bảo toàn sự dè dặt thần học ấy.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “thầy tế lễ” làm thuật ngữ phổ thông; “lễ thiêu” và “lễ chuộc tội” giữ sắc thái nghi lễ của sách Lê-vi Ký. Tách thành hai câu để tiếng Việt sáng rõ nhưng vẫn bảo toàn quan hệ tuần tự của nguyên văn.
