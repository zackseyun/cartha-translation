- from: Người ấy phải dâng con chim thứ hai làm lễ thiêu theo đúng quy định[a]. Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy về tội người ấy đã phạm, và người ấy sẽ được tha thứ[b].
  to: Còn con chim thứ hai, thầy tế lễ phải dâng làm lễ thiêu theo thể thức đã định[a]. Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy về tội người ấy đã phạm, và người ấy sẽ được tha thứ[b].
