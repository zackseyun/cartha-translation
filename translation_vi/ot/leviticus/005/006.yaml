source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: vi
  text: 'Người ấy phải dâng lên Yahweh lễ vật chuộc lỗi của mình vì tội mình đã phạm: một con cái thuộc đàn chiên dê—một chiên cái hoặc một dê cái—làm lễ vật chuộc tội; rồi thầy tế lễ sẽ thực hiện việc chuộc tội cho người ấy vì tội mình[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Sát chữ: “khỏi tội mình”; cách nói này có thể nhấn mạnh rằng sự chuộc tội đem lại kết quả là tội được cất bỏ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Người ấy phải đem đến
  rationale: Trong văn luật pháp, hình thái động từ này mang ý nghĩa quy định bắt buộc; “phải” diễn đạt tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: אֲשָׁמוֹ
  choice: lễ vật chuộc lỗi
  rationale: אשם có thể chỉ lỗi, trách nhiệm bồi hoàn, hoặc lễ vật gắn với lỗi ấy. Cách dịch này giữ thuật ngữ khác với חטאת xuất hiện sau đó mà không áp đặt một học thuyết riêng.
- source_word: לַיהוָה
  choice: đến Đức Yahweh
  rationale: Giữ danh riêng giao ước יהוה thay vì thay bằng một tước hiệu; thêm “Đức” cho phù hợp lối xưng hô trang trọng trong tiếng Việt.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: vì tội mình đã phạm
  rationale: Diễn đạt tự nhiên quan hệ căn cứ/nguyên do của lễ vật, đồng thời giữ rõ ý “tội đã phạm” trong nguyên văn.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: một con cái trong đàn chiên dê
  rationale: Giữ yêu cầu con vật phải là giống cái; צאן bao gồm gia súc nhỏ, ở đây được chính câu văn xác định là chiên hoặc dê.
- source_word: כִּשְׂבָּה
  choice: một chiên cái con
  rationale: Từ này chỉ chiên cái còn non; cách diễn đạt giữ cả giống và loại con vật.
- source_word: אוֹ שְׂעִירַת עִזִּים
  choice: hoặc một dê cái
  rationale: Giữ rõ lựa chọn thay thế và giống cái được nêu trong tiếng Hê-bơ-rơ.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חטאת chỉ loại lễ vật liên quan đến tội lỗi/thanh tẩy. “Lễ vật chuộc tội” là cách nói dễ hiểu, đồng thời được giữ khác với “lễ vật chuộc lỗi” ở đầu câu.
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: rồi thầy tế lễ sẽ làm lễ chuộc tội cho người ấy
  rationale: כפר trong ngữ cảnh tư tế chỉ hành động thực hiện sự chuộc tội; bản dịch không thu hẹp từ này vào một lý thuyết chuộc tội cụ thể.
- source_word: מֵחַטָּאתוֹ
  choice: về tội mình
  rationale: Cách dịch này tự nhiên trong tiếng Việt và để ngỏ sắc thái quan hệ với tội; nghĩa sát chữ “khỏi tội mình,” có thể nhấn mạnh kết quả loại bỏ tội, được ghi ở chú thích.
theological_decisions:
- issue: Cùng một câu dùng cả אשם và חטאת
  choice: 'Giữ hai cách gọi phân biệt: “lễ vật chuộc lỗi” và “lễ vật chuộc tội”'
  alternative: Đồng nhất cả hai thành “lễ vật chuộc tội,” hoặc dịch חטאת là “lễ vật thanh tẩy”
  rationale: Nguyên văn cố ý đặt hai thuật ngữ cạnh nhau. Giữ sự phân biệt tránh xóa đi sức căng từ vựng và nghi lễ vốn có trong bản Hê-bơ-rơ.
- issue: Cách thể hiện danh יהוה
  choice: Đức Yahweh
  alternative: ĐỨC CHÚA; Đức Giê-hô-va
  rationale: Dùng danh riêng thay vì thay thế bằng tước hiệu, đồng thời dùng hình thức xưng hô trang trọng, dễ nhận biết trong tiếng Việt.
- issue: Sắc thái của מֵחַטָּאתוֹ sau động từ כפר
  choice: Dịch trong câu chính là “về tội mình,” ghi nghĩa sát chữ ở chú thích
  alternative: Dịch thẳng là “khỏi tội mình”
  rationale: Giới từ מן có thể gợi ý sự lìa khỏi hoặc loại bỏ tội, nhưng trong cấu trúc này cũng có thể nêu tội liên quan đến nghi thức chuộc tội. Chú thích bảo tồn cả hai khả năng.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “phải” cho mệnh lệnh pháp quy, “thầy tế lễ” là thuật ngữ phổ thông, và “đàn chiên dê” để diễn đạt rõ phạm vi của צאן. Dấu gạch ngang giúp người đọc nhận ra hai lựa chọn con vật mà không làm câu nặng nề.
