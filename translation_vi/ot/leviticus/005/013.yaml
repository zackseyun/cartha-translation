  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: vi
  text: Như vậy, thầy tế lễ sẽ làm lễ chuộc tội cho người ấy về tội người ấy đã phạm trong một trong những điều ấy, và người ấy sẽ được tha thứ.[a] Lễ vật ấy sẽ thuộc về thầy tế lễ, như lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tội ấy sẽ được tha cho người ấy.” Tiếng Hê-bơ-rơ dùng thể bị động và không nói rõ ai là Đấng tha thứ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: thầy tế lễ sẽ làm lễ chuộc tội cho người ấy
  rationale: Trong luật tế lễ, כפר với עַל chỉ hành động nghi lễ do thầy tế lễ thực hiện để chuộc tội cho người phạm lỗi. “Làm lễ chuộc tội” vừa tự nhiên trong tiếng Việt vừa không áp đặt một học thuyết riêng về cơ chế chuộc tội.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: về tội người ấy đã phạm
  rationale: Mệnh đề “đã phạm” cho thấy חַטָּאתוֹ ở đây nói đến tội lỗi hơn là lễ vật chuộc tội.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: trong bất cứ điều nào kể trên
  rationale: Cụm từ có nghĩa bộ phận và quy chiếu về các trường hợp đã nêu trước đó; cách diễn đạt này rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: וְנִסְלַח לוֹ
  choice: và người ấy sẽ được tha thứ
  rationale: Giữ thể bị động và không nêu đích danh Đấng tha thứ, phù hợp với sự dè dặt của nguyên văn, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: Phần lễ vật ấy sẽ thuộc về thầy tế lễ
  rationale: Động từ giống cái quy chiếu đến phần lễ vật; thêm “phần lễ vật ấy” làm rõ đối tượng sở hữu vốn được ngữ cảnh ngầm hiểu.
- source_word: כַּמִּנְחָה
  choice: giống như lễ vật ngũ cốc
  rationale: Trong ngữ cảnh tế lễ của sách Lê-vi, מִנְחָה thường chỉ lễ vật làm từ ngũ cốc; cách dịch này cụ thể và dễ hiểu.
theological_decisions:
- issue: Công thức tha thứ sau nghi lễ chuộc tội
  choice: người ấy sẽ được tha thứ
  alternative: tội ấy sẽ được tha cho người ấy
  rationale: Động từ Hê-bơ-rơ ở thể bị động và không nêu chủ thể tha thứ. Bản dịch chính giữ thể bị động, không tự ý thêm “Đức Chúa Trời,” còn chú thích bảo lưu cách hiểu phi nhân xưng sát cấu trúc Hê-bơ-rơ hơn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “thầy tế lễ” và “lễ vật ngũ cốc” để độc giả phổ thông dễ hiểu. Đại từ “người ấy” duy trì quy chiếu rõ ràng và không mang sắc thái cổ.
