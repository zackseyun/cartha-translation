    rationale: Nguyên văn nói theo nghĩa bộ phận “một trong những điều này”. “Về một trong những điều ấy” bảo lưu sát hơn cấu trúc và quy chiếu của tiếng Hê-bơ-rơ.
  - severity: low
    issue: “Phần lễ vật ấy” thêm nét nghĩa “phần” không được nêu minh thị trong câu.
