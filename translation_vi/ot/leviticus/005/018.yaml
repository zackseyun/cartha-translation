  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: vi
  text: Người ấy phải đem đến cho thầy tế lễ một con chiên đực không tì vết từ bầy, theo mức định giá của ngươi, để làm lễ vật chuộc lỗi[a]. Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy về lỗi lầm người ấy đã vô ý phạm, dù người ấy không biết[b]; và người ấy sẽ được tha thứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật đền bồi”. Từ Hê-bơ-rơ אָשָׁם là tên một loại lễ vật tế lễ xác định.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “về tội người ấy đã vô ý phạm”. Tiếng Hê-bơ-rơ nhấn mạnh một lỗi phạm do không chủ ý.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Người ấy phải đem đến
  rationale: Trong văn luật pháp, dạng động từ này mang lực quy định. “Phải đem đến” diễn đạt tự nhiên nghĩa vụ được truyền, còn “người ấy” nối với chủ thể của điều luật.
- source_word: אַיִל תָּמִים מִן הַצֹּאן
  choice: một con chiên đực không tì vết từ trong bầy
  rationale: אַיִל là chiên đực trưởng thành dùng làm sinh tế; תָּמִים trong ngữ cảnh tế lễ chỉ con vật không có khuyết tật. “Từ trong bầy” giữ nghĩa tập thể của צֹאן.
- source_word: בְּעֶרְכְּךָ
  choice: theo mức ngươi định giá
  rationale: Giữ đại từ ngôi hai số ít và ý niệm định giá trong thủ tục tế lễ, không tự ý xác định thêm người định giá hay đơn vị tiền.
- source_word: לְאָשָׁם
  choice: để làm lễ vật chuộc lỗi
  rationale: אָשָׁם là tên một loại lễ vật riêng trong hệ thống tế lễ Lê-vi. “Lễ vật chuộc lỗi” vừa dễ hiểu vừa phân biệt với thuật ngữ chung về việc chuộc tội.
- source_word: וְכִפֶּר עָלָיו
  choice: Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy
  rationale: Cách diễn đạt này giữ hành động tế lễ của כפר, chủ thể là thầy tế lễ, và đối tượng thụ hưởng được biểu thị bởi עָלָיו.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: về lỗi người ấy đã vô ý phạm
  rationale: Bản dịch giữ liên hệ giữa danh từ שְׁגָגָה và động từ cùng gốc, đồng thời nêu rõ tính chất không cố ý của hành vi.
- source_word: וְהוּא לֹא יָדַע
  choice: mà không biết
  rationale: Giữ lời xác nhận rằng người phạm lỗi không nhận biết điều đó, không giải thích thêm nội dung mà người ấy không biết.
- source_word: וְנִסְלַח לוֹ
  choice: và người ấy sẽ được tha thứ
  rationale: Dạng bị động được giữ lại, diễn đạt kết quả là sự tha thứ mà không nêu rõ chủ thể ban sự tha thứ, tương ứng với lối bị động của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ אָשָׁם
  choice: lễ vật chuộc lỗi
  alternative: lễ vật đền bồi
  rationale: “Lễ vật chuộc lỗi” là cách gọi dễ nhận biết và phù hợp ngữ cảnh; chú thích bảo lưu khả năng nhấn mạnh khía cạnh đền bồi của thuật ngữ.
- issue: Cách dịch כפר
  choice: làm lễ chuộc tội
  alternative: thực hiện nghi thức đền tội
  rationale: “Làm lễ chuộc tội” giữ trọng lượng thần học và tính chất tế lễ của hành động, nhưng không xác định thêm một học thuyết về cơ chế chuộc tội.
- issue: Mối liên hệ giữa việc chuộc tội và sự tha thứ
  choice: 'giữ hai mệnh đề nối tiếp: thầy tế lễ làm lễ chuộc tội, rồi người ấy được tha thứ'
  alternative: gộp thành lời giải thích rằng nghi lễ trực tiếp tạo ra sự tha thứ
  rationale: Cấu trúc này bám sát văn bản, bảo toàn mối liên hệ được nêu mà không diễn giải vượt quá câu Hê-bơ-rơ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng rõ ràng. Dùng “người ấy” cho chủ thể của điều luật và giữ “ngươi” ở cụm định giá để phản ánh đại từ ngôi hai số ít trong nguyên văn. Các thuật ngữ “thầy tế lễ”, “không tì vết”, “lễ vật chuộc lỗi” và “làm lễ chuộc tội” phù hợp văn cảnh tế lễ, đồng thời vẫn dễ hiểu với độc giả Việt Nam hiện đại.
