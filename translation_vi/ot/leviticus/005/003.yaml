id: LEV.5.3
reference: Leviticus 5:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: vi
  text: Hoặc nếu người ấy chạm vào sự ô uế của một người[a]—bất cứ dạng ô uế nào khiến người ta trở nên ô uế—mà không hay biết, rồi sau đó nhận ra điều đó, thì người ấy mắc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự ô uế từ con người.” Từ Hê-bơ-rơ trong văn mạch luật này chỉ sự ô uế về nghi lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: chạm vào
  rationale: Động từ נגע đi với בְּ chỉ sự tiếp xúc; “chạm vào” diễn đạt trực tiếp và tự nhiên.
- source_word: טֻמְאַת אָדָם
  choice: sự ô uế từ con người
  rationale: טֻמְאָה trong văn mạch luật Lê-vi chỉ tình trạng ô uế về nghi lễ, còn אָדָם nói chung về con người như nguồn gây ô uế. “Từ con người” tự nhiên hơn cách sở hữu dễ gây hiểu lầm.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: bất cứ sự ô uế nào
  rationale: Cụm từ mở rộng phạm vi đến mọi dạng ô uế liên quan; lược dịch hậu tố sở hữu giúp câu tiếng Việt rõ và tự nhiên.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: khiến người ta trở nên ô uế
  rationale: Mệnh đề quan hệ nêu tác dụng của sự ô uế; “người ta” giữ sắc thái khái quát của câu.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: mà lúc ấy người ấy không hay biết
  rationale: Thể Niphal của עלם diễn tả sự việc nằm ngoài nhận thức của người ấy. Cách dịch làm rõ rằng người ấy chưa biết vào thời điểm tiếp xúc, còn chú thích bảo lưu hình ảnh sát chữ.
- source_word: וְהוּא יָדַע
  choice: rồi sau đó nhận ra
  rationale: Trong ngữ cảnh, cụm từ chỉ việc nhận biết xảy ra sau tình trạng không hay biết trước đó.
- source_word: וְאָשֵׁם
  choice: thì người ấy mắc lỗi
  rationale: אָשֵׁם trong ngữ cảnh pháp lý–tế lễ nói đến việc mắc lỗi và gánh trách nhiệm do vi phạm; “mắc lỗi” tránh hàm ý rằng bản thân tình trạng ô uế nhất thiết là điều ác về đạo đức.
theological_decisions:
- issue: Bản chất của טֻמְאָה trong luật Lê-vi
  choice: Dịch là “sự ô uế”, hiểu theo phạm trù nghi lễ.
  alternative: sự không thanh sạch; sự nhơ uế
  rationale: Câu nói về tình trạng ô uế phát sinh do tiếp xúc, không đồng nhất tình trạng ấy với sự đồi bại hay tội lỗi về đạo đức.
- issue: Ý nghĩa pháp lý của וְאָשֵׁם
  choice: thì người ấy mắc lỗi
  alternative: thì người ấy có tội; thì người ấy mắc tội
  rationale: “Mắc lỗi” giữ lực pháp lý của việc đã vi phạm và phải chịu trách nhiệm, đồng thời không đạo đức hóa quá mức tình trạng ô uế nghi lễ.
- issue: Cách hiểu אָדָם
  choice: con người, chỉ nguồn ô uế thuộc về người
  alternative: người nam; loài người
  rationale: אָדָם ở đây mang nghĩa khái quát, không giới hạn ở nam giới.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “người ấy” để giữ chủ thể số ít mà không quy định giới tính; dùng “ô uế” nhất quán cho phạm trù nghi lễ.
