revisions:
- from: Hoặc nếu người ấy chạm vào sự ô uế từ con người[a]—bất cứ sự ô uế nào khiến người ta trở nên ô uế—mà lúc ấy người ấy không hay biết[b], rồi sau đó nhận ra, thì người ấy mắc lỗi.
  to: Hoặc nếu người ấy chạm vào sự ô uế của một người[a]—bất cứ dạng ô uế nào khiến người ta trở nên ô uế—mà không hay biết, rồi sau đó nhận ra điều đó, thì người ấy mắc tội.
  rationale: Sửa “mắc lỗi” thành “mắc tội” để bảo toàn lực pháp lý của וְאָשֵׁם. Thay cách diễn đạt về טֻמְאַת אָדָם bằng cấu trúc sở hữu sát nghĩa hơn, đồng thời giữ phương án diễn giải trong chú thích. Chú thích về sự không hay biết được điều chỉnh để không khóa chặt đại từ vào một cách hiểu cụ thể. Thêm neo chú thích b vào câu để bộ chú thích khớp văn bản.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng trình tự và ý chính của tiếng Hê-bơ-rơ: tiếp xúc với ô uế thuộc về người, không biết, sau đó biết, và phát sinh tình trạng có tội/trách nhiệm. Tuy nhiên, “mắc lỗi” giảm nhẹ lực pháp lý của וְאָשֵׁם, vốn chỉ việc mắc tội/có tội, không đơn thuần phạm một sai sót. “Sự ô uế của một người” bám sát cấu trúc טֻמְאַת אָדָם hơn “sự ô uế từ con người”.'
  naturalness: Bản sửa giữ văn phong pháp lý trang trọng, rõ nghĩa trong tiếng Việt hiện đại. “Mà không hay biết, rồi sau đó nhận ra điều đó” diễn đạt tự nhiên sự không biết trước đó và sự nhận biết về sau, mà không cần thêm “lúc ấy” hay “sau đó” hai lần.
  terminology: Giữ nhất quán “ô uế” cho טֻמְאָה theo nghĩa nghi lễ. Dùng “mắc tội” cho וְאָשֵׁם để chuyển tải trách nhiệm pháp lý của câu, nhưng không nói rằng bản thân trạng thái ô uế nghi lễ là một điều ác đạo đức. Không cần áp đặt cách giải thích giáo phái.
  issues:
  - severity: medium
    issue: “mắc lỗi” dịch quá nhẹ וְאָשֵׁם.
    rationale: Trong ngữ cảnh luật tế lễ, וְאָשֵׁם biểu thị việc người ấy mắc tội/có tội và chịu trách nhiệm; “mắc lỗi” có thể chỉ một sơ suất không có hệ quả pháp lý.
  - severity: low
    issue: “sự ô uế từ con người” hơi diễn giải quan hệ sở hữu trong טֻמְאַת אָדָם.
    rationale: Cụm Hê-bơ-rơ nói trực tiếp về “ô uế của một người/người”. Cách sở hữu trong tiếng Việt vừa sát nguồn vừa tự nhiên; chú thích có thể nêu “từ con người” như phương án khác.
  - severity: low
    issue: Chú thích b thêm nội dung “mình đã bị ô uế”.
    rationale: Nguyên văn chỉ nói “điều ấy bị che khuất khỏi người ấy”; đại từ có thể quy về sự ô uế hay sự việc tiếp xúc, nên không nên xác định quá mức trong chú thích.
  revised_text: Hoặc nếu người ấy chạm vào sự ô uế của một người[a]—bất cứ dạng ô uế nào khiến người ta trở nên ô uế—mà không hay biết, rồi sau đó nhận ra điều đó, thì người ấy mắc tội.
