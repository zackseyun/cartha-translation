source:
  edition: WLC
  text: וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה וְ/נִסְלַ֣ח ל֑/וֹ עַל אַחַ֛ת מִ/כֹּ֥ל אֲשֶֽׁר יַעֲשֶׂ֖ה לְ/אַשְׁמָ֥ה בָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: vi
  text: Thầy tế lễ sẽ làm lễ chuộc tội cho người ấy trước mặt Yahweh, và người ấy sẽ được tha thứ về bất cứ điều nào trong mọi việc người ấy làm mà khiến người ấy mắc tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “về một điều trong mọi điều người ấy có thể làm để mắc tội bởi điều ấy.”'
    reason: Giữ cấu trúc “một điều trong mọi điều” của עַל אַחַת מִכֹּל và sắc thái khả năng của אֲשֶׁר יַעֲשֶׂה, đồng thời nêu rõ hành vi là điều khiến người ấy mắc tội.
lexical_decisions:
- source_word: וְכִפֶּר
  choice: sẽ làm lễ chuộc tội
  rationale: Thể Piel của כפר trong bối cảnh tế lễ chỉ việc thực hiện nghi thức chuộc tội; cách diễn đạt này tự nhiên trong tiếng Việt và không áp đặt một học thuyết riêng về cơ chế chuộc tội.
- source_word: עָלָיו
  choice: cho người ấy
  rationale: Khi đi với כפר, giới từ עַל thường chỉ người được thực hiện việc chuộc tội thay cho; “cho người ấy” vừa chính xác vừa tự nhiên.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Chuyển trực tiếp danh từ xác định chỉ người thi hành chức vụ tế lễ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי diễn tả việc ở trước sự hiện diện của Đức Chúa Trời trong khung cảnh thánh lễ; danh riêng giao ước יְהוָה được phiên là “Yahweh”.
- source_word: וְנִסְלַח לוֹ
  choice: và người ấy sẽ được tha thứ
  rationale: Thể Nifal diễn tả kết quả thụ động là người phạm lỗi được tha thứ, đồng thời không nói rõ chủ thể tha thứ vốn chỉ được hàm ý.
- source_word: עַל אַחַת מִכֹּל
  choice: về bất cứ điều nào trong tất cả những điều
  rationale: 'Giữ sắc thái phân phối: một trường hợp bất kỳ thuộc toàn bộ nhóm hành vi đang được nói đến.'
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: mình làm mà mắc tội
  rationale: Diễn đạt tự nhiên quan hệ giữa hành vi và tình trạng mắc tội, trong khi chú thích giữ cấu trúc sát chữ hơn và sự không xác định về sắc thái thời-thể của יַעֲשֶׂה.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn chức năng của danh riêng mà không thay bằng một tước hiệu.
- issue: Chủ thể của hành động tha thứ
  choice: dùng thể bị động “sẽ được tha thứ”
  alternative: “Yahweh sẽ tha thứ cho người ấy”
  rationale: Nguyên văn dùng Nifal thụ động và không nêu chủ thể ngữ pháp; bản dịch không bổ sung chủ thể dù trong ngữ cảnh Đức Chúa Trời được hiểu là Đấng tha thứ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “thầy tế lễ” là thuật ngữ phổ thông, dễ hiểu; “làm lễ chuộc tội” làm rõ bối cảnh nghi lễ. Đại từ “người ấy” tránh giả định giới tính trong tiếng Việt dù tiếng Hê-bơ-rơ dùng hình thức giống đực số ít.
