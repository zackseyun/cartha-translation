  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: vi
  text: Người ấy phải đem lễ vật đó đến thầy tế lễ. Thầy tế lễ sẽ bốc từ đó một nắm đầy làm phần tưởng niệm, rồi thiêu phần ấy trên bàn thờ, cùng với các lễ vật dâng bằng lửa lên Yahweh. Đây là lễ vật chuộc tội[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây là lễ vật thanh tẩy.” Từ Hê-bơ-rơ có thể chỉ lễ vật xử lý tội lỗi bằng nghi thức thanh tẩy.'
    reason: alternative_reading
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Người ấy phải đem lễ vật đó
  rationale: Động từ Hiphil của בוא cùng hậu tố giống cái chỉ lễ vật bằng bột trong văn cảnh trước; diễn đạt rõ chủ thể và đối tượng bằng tiếng Việt tự nhiên.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi thông dụng, trang trọng và dễ hiểu đối với chức vụ tư tế trong luật tế lễ.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: sẽ bốc ... một nắm đầy
  rationale: Diễn tả hành động nghi lễ chuyên biệt là lấy lượng bột đầy một nắm tay, đồng thời giữ sắc thái của מְלֹא.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: làm phần tưởng niệm
  rationale: אַזְכָּרָה là phần đại diện của lễ vật ngũ cốc được thiêu trên bàn thờ; thêm 'phần' làm rõ đây là một phần của lễ vật.
- source_word: וְהִקְטִיר
  choice: rồi thiêu phần ấy
  rationale: Trong ngữ cảnh tế lễ, Hiphil của קטר chỉ việc thiêu lễ vật trên bàn thờ để dâng lên; 'thiêu' trang trọng và chính xác hơn 'đốt'.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: cùng với các lễ vật dâng bằng lửa lên Yahweh
  rationale: עַל ở đây có thể chỉ sự kết hợp hoặc đặt cùng các lễ vật đã dâng; cách dịch này tránh khẳng định không chắc chắn rằng phần bột được đặt trực tiếp lên trên chúng, đồng thời giữ hình ảnh 'bằng lửa' của אִשֶּׁה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: חַטָּאת הִוא
  choice: Đây là lễ vật chuộc tội
  rationale: Trong công thức tế lễ, חַטָּאת chỉ loại lễ vật xử lý tội lỗi; 'lễ vật chuộc tội' là cách gọi rõ nghĩa và quen thuộc, còn sắc thái thanh tẩy được bảo lưu trong chú thích.
theological_decisions:
- issue: Ý nghĩa của חַטָּאת trong luật tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Danh từ có thể được gọi theo vấn đề là tội lỗi hoặc theo chức năng thanh tẩy của nghi lễ. Bản chính dùng cách gọi quen thuộc 'lễ vật chuộc tội', nhưng chú thích giữ lại phương án 'lễ vật thanh tẩy' để không xóa bỏ sức căng thần học và nghi lễ của thuật ngữ.
- issue: Quan hệ do עַל biểu thị trong עַל אִשֵּׁי יְהוָה
  choice: cùng với các lễ vật dâng bằng lửa lên Yahweh
  alternative: trên các lễ vật dâng bằng lửa lên Yahweh
  rationale: Giới từ có thể gợi vị trí 'trên' hoặc sự bổ sung/kết hợp trong trình tự dâng lễ. 'Cùng với' phù hợp ngữ cảnh mà không áp đặt chi tiết không hoàn toàn chắc chắn.
translation_notes:
  register: Văn phong luật lễ nghi trang trọng nhưng hiện đại. Dùng câu ngắn, rõ trình tự hành động; giữ danh Yahweh và thuật ngữ tế lễ nhất quán. Mọi dấu chú thích trong bản văn đều có chú thích tương ứng.
