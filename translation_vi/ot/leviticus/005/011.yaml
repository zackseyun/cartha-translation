revisions:
- from: Nhưng nếu người ấy không đủ khả năng dâng hai con chim gáy hoặc hai con bồ câu non[a], thì vì tội mình đã phạm, người ấy phải đem một phần mười ê-pha bột mịn làm lễ vật, tức là lễ chuộc tội. Người ấy không được đổ dầu hay đặt nhũ hương lên đó, vì đó là lễ chuộc tội.
  to: Nhưng nếu người ấy không đủ khả năng dâng hai con chim gáy hoặc hai con bồ câu non[a], thì vì tội mình đã phạm, người ấy phải đem một phần mười ê-pha bột mịn làm lễ chuộc tội. Người ấy không được cho dầu hay đặt nhũ hương lên đó, vì đó là lễ chuộc tội.
  rationale: Bản sửa giữ nguyên ý nghĩa và sự phân biệt các lễ vật trong nguyên văn, đồng thời loại bỏ lời giải thích “tức là” không cần thiết. Cách diễn đạt “làm lễ chuộc tội” gắn trực tiếp bột mịn với loại lễ vật mà câu quy định; các đại từ “đó” tiếp tục chỉ phần bột/lễ vật này. Chú thích được giữ nguyên vì neo [a] đúng tại thành ngữ đã được diễn dịch.
  reviewer_model: gpt-5.6-terra
