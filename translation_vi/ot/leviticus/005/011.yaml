source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: vi
  text: Nhưng nếu người ấy không đủ khả năng dâng hai con chim gáy hoặc hai con bồ câu non[a], thì vì tội mình đã phạm, người ấy phải đem một phần mười ê-pha bột mịn làm lễ chuộc tội. Người ấy không được cho dầu hay đặt nhũ hương lên đó, vì đó là lễ chuộc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “nếu tay người ấy không với tới”; đây là thành ngữ Hê-bơ-rơ chỉ việc không đủ khả năng vật chất.'
    reason: Giải thích thành ngữ nguồn và hình ảnh nghĩa đen đã được chuyển thành lối nói tự nhiên trong bản dịch.
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: không đủ khả năng
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “tay không với tới”, nhưng trong luật tế lễ chỉ việc không đủ điều kiện vật chất; cách dịch này tự nhiên và giữ rõ ý kinh tế.
- source_word: תֹרִים
  choice: chim gáy
  rationale: Từ này chỉ loài turtledove trong ngữ cảnh tế lễ; “chim gáy” là tên gọi thông dụng và chính xác trong tiếng Việt.
- source_word: בְנֵי יוֹנָה
  choice: bồ câu non
  rationale: Cụm từ có nghĩa đen là “con của bồ câu”, một cách nói chỉ bồ câu còn non.
- source_word: קָרְבָּנוֹ
  choice: lễ vật
  rationale: Đây là thuật ngữ rộng chỉ vật được đem đến dâng; “lễ vật” phù hợp cả với bột mịn, không hàm ý nhất thiết phải là con vật bị giết.
- source_word: אֲשֶׁר חָטָא
  choice: vì tội mình đã phạm
  rationale: Diễn đạt tự nhiên mối liên hệ giữa lỗi phạm và lễ vật được đem dâng.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: một phần mười ê-pha
  rationale: Giữ nguyên đơn vị đo lường cổ thay vì quy đổi gần đúng và có nguy cơ tạo độ chính xác giả.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Chỉ loại bột được xay kỹ dùng trong các lễ vật.
- source_word: לְחַטָּאת
  choice: làm lễ vật, tức là lễ chuộc tội
  rationale: Trong ngữ cảnh nghi lễ, חַטָּאת chỉ lễ vật liên quan đến việc xử lý tội lỗi; cách diễn đạt này vừa cho thấy bột là vật dâng, vừa xác định loại nghi lễ.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: không được đổ dầu ... lên đó
  rationale: Truyền đạt trực tiếp lệnh cấm thêm dầu vào bột dâng.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: hay đặt nhũ hương lên đó
  rationale: לְבֹנָה là nhũ hương, loại nhựa thơm dùng trong tế lễ; “đặt” phản ánh hành động thêm nó vào lễ vật.
- source_word: כִּי חַטָּאת הִיא
  choice: vì đó là lễ chuộc tội
  rationale: 'Mệnh đề nêu lý do không được thêm dầu và nhũ hương: lễ vật thuộc loại חַטָּאת.'
theological_decisions:
- issue: Nghĩa của חַטָּאת trong luật tế lễ
  choice: lễ chuộc tội
  alternative: lễ dâng vì tội; lễ tẩy tội
  rationale: Từ này có thể chỉ tội hoặc lễ vật/nghi lễ liên quan đến tội. Ở đây, cú pháp và các chỉ dẫn về bột cho thấy nó chỉ loại lễ vật. “Lễ chuộc tội” là cách gọi dễ hiểu, không giải thích thêm cơ chế thần học ngoài câu.
- issue: Cách diễn đạt điều kiện nghèo khó trong thành ngữ תַשִּׂיג יָדוֹ
  choice: không đủ khả năng
  alternative: tay không với tới; không đủ tiền mua
  rationale: Cách chọn giữ điều kiện kinh tế-pháp lý của sự nhượng bộ mà không thu hẹp quá mức thành riêng hành vi mua bán.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “người ấy” để tránh mặc định giới tính khi tiếng Hê-bơ-rơ dùng dạng giống đực theo quy ước. Giữ đơn vị cổ “ê-pha”; dùng các thuật ngữ phổ thông “chim gáy”, “bồ câu non”, “bột mịn”, “nhũ hương”.
