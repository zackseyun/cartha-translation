id: LEV.5.4
reference: Leviticus 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: vi
  text: Hoặc nếu một người buột miệng thề rằng mình sẽ làm điều xấu hay điều tốt—bất cứ điều gì người ta có thể nói ra trong lời thề—mà điều ấy bị che khuất khỏi người ấy, rồi người ấy nhận biết điều đó và mắc tội về một trong những điều này,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: một người
  rationale: Trong văn luật pháp, נֶפֶשׁ chỉ một cá nhân, không nhấn mạnh linh hồn như phần phi vật chất.
- source_word: תִשָּׁבַע
  choice: thề
  rationale: Động từ ở đây chỉ hành vi lập lời thề; cách dịch ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: dùng môi miệng thề cách thiếu suy xét
  rationale: Giữ hình ảnh phát ngôn bằng môi miệng, đồng thời diễn đạt sắc thái lời thề được nói ra vội vàng hoặc thiếu cân nhắc trong ngữ cảnh; chú thích bảo lưu nghĩa từ vựng rộng hơn là ‘nói ra’.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: làm điều xấu hay điều tốt
  rationale: Giữ hai cực đối lập của nguyên văn, qua đó bao quát nội dung có thể có của lời thề.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: bất cứ điều gì người ta có thể nói ra trong lời thề
  rationale: Diễn đạt tự nhiên ý khái quát của mệnh đề. ‘Người ta’ trong tiếng Việt là đại từ phiếm chỉ, phù hợp với הָאָדָם mang nghĩa đại diện cho con người nói chung.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: mà không nhận thức được điều đó
  rationale: Diễn đạt rõ tình trạng điều ấy thoát khỏi nhận thức của người thề, nhưng chú thích vẫn bảo lưu cấu trúc bị động giàu tính hình tượng của tiếng Hê-bơ-rơ.
- source_word: וְהוּא יָדַע
  choice: rồi sau đó nhận biết
  rationale: Làm rõ diễn tiến từ không nhận thức đến nhận biết về sau, phù hợp với chuỗi hành động trong câu.
- source_word: וְאָשֵׁם
  choice: mắc tội
  rationale: Diễn tả tình trạng có tội hoặc phải chịu trách nhiệm do hành vi đã nêu, không thêm cách giải thích về thời điểm phát sinh tội trạng.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: về một trong những điều ấy
  rationale: Chỉ trở lại một trong các trường hợp đã nêu trong đoạn luật pháp.
theological_decisions:
- issue: Phạm vi của danh từ giống đực đại diện הָאָדָם
  choice: Dịch là ‘người ta’ để chỉ bất cứ người nào
  alternative: ‘một người nam’ hoặc ‘con người’
  rationale: Ở đây הָאָדָם là số ít mang tính đại diện, không giới hạn điều luật cho nam giới. Tiếng Việt không cần đưa giới tính vào đại từ phiếm chỉ.
- issue: Thời điểm và bản chất của tình trạng có tội
  choice: Giữ chuỗi ‘không nhận thức… sau đó nhận biết và mắc tội’ mà không giải thích thêm
  alternative: Diễn giải rằng người ấy chỉ trở nên có tội khi nhận biết, hoặc đã có tội từ trước nhưng lúc ấy mới ý thức
  rationale: Cú pháp có thể gợi một diễn tiến thời gian nhưng không tự nó giải quyết đầy đủ quan hệ giữa nhận biết và tội trạng; bản dịch tránh áp đặt một kết luận thần học.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. ‘Dùng môi miệng’ giữ hình ảnh của nguyên văn; ‘thề cách thiếu suy xét’ tự nhiên hơn lối dịch quá sát. Câu được giữ ở dạng chưa kết thúc với dấu phẩy vì nội dung tiếp nối sang câu sau.
