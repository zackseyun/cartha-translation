  source_fidelity: Bản nháp truyền đạt đúng mạch hành vi và giữ được cấu trúc câu dang dở. Tuy nhiên, “nhặt được” thu hẹp מָצָא (tìm thấy) vào hành động nhặt lên, trong khi nguyên ngữ chỉ nói tìm thấy; “chối là không có” diễn giải cụ thể hơn כִּחֵשׁ בָּהּ, vốn là nói dối/phủ nhận liên quan đến vật ấy.
