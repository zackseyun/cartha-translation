base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: vi
  text: hoặc tìm được của thất lạc, nói dối về điều đó và thề dối—về bất cứ một điều nào trong mọi điều mà người ta làm để phạm tội trong những điều ấy—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָא אֲבֵדָה
  choice: nhặt được của thất lạc
  rationale: Diễn đạt tự nhiên hành động tìm thấy tài sản mà người khác đánh mất, đồng thời giữ nghĩa pháp lý của nguyên ngữ.
- source_word: וְכִחֶשׁ בָּהּ
  choice: mà chối là không có
  rationale: כחש ở đây chỉ việc phủ nhận gian dối về của thất lạc đã nhặt được; cách dịch này làm rõ đối tượng ngầm mà không thêm ý ngoài văn cảnh.
- source_word: וְנִשְׁבַּע עַל שָׁקֶר
  choice: rồi thề gian về điều đó
  rationale: Giữ trình tự hành vi và sắc thái pháp lý, tôn giáo của lời thề giả.
- source_word: הָאָדָם
  choice: người ta
  rationale: Trong mệnh đề khái quát, danh từ có mạo từ mang nghĩa con người nói chung; “người ta” là tiếng Việt tự nhiên và không hạn định giới tính.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: mà phạm tội
  rationale: Chuyển thành cấu trúc tiếng Việt tự nhiên; đại từ số nhiều trong tiếng Hê-bơ-rơ quy chiếu đến các việc đã nêu, nhưng không cần lặp máy móc trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của הָאָדָם
  choice: dịch khái quát là “người ta”
  alternative: “một người đàn ông” hoặc “một người”
  rationale: Ngữ cảnh luật pháp nói về hành vi của con người nói chung, không thiết lập một giới hạn thần học theo giới tính.
- issue: Quan hệ giữa hành vi và tội lỗi trong לַחֲטֹא בָהֵנָּה
  choice: “mọi việc người ta làm mà phạm tội”
  alternative: “mọi điều mà qua đó một người có thể phạm tội”
  rationale: Giữ ý rằng những hành vi vừa liệt kê cấu thành sự phạm tội, đồng thời tránh giải thích thêm bản chất hay mức độ quy tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ dấu gạch ngang cuối câu vì câu cú và lập luận tiếp tục sang câu kế tiếp trong phân đoạn Hê-bơ-rơ.
