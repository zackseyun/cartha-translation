language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: vi
  text: Người ấy phải rảy một phần máu của lễ chuộc tội lên thành bàn thờ[a]; phần máu còn lại phải được ép chảy xuống chân bàn thờ. Đó là lễ chuộc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy” ở cả hai chỗ có cụm từ “lễ chuộc tội”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật dâng vì tội, đồng thời nhấn mạnh chức năng thanh tẩy của lễ ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: phải rảy
  rationale: Thể Hiphil của נזה trong nghi thức tế lễ chỉ việc rảy hoặc làm văng máu lên một bề mặt; “rảy” là cách diễn đạt tự nhiên và quen thuộc trong tiếng Việt.
- source_word: מִדַּם
  choice: một phần máu
  rationale: 'Giới từ מִן ở đây mang nghĩa phân lượng: chỉ một phần máu được dùng trong thao tác này.'
- source_word: הַחַטָּאת
  choice: lễ chuộc tội
  rationale: Trong luật tế lễ, חַטָּאת chỉ lễ vật liên quan đến tội lỗi và có chức năng thanh tẩy. “Lễ chuộc tội” là thuật ngữ dễ hiểu, quen thuộc; sắc thái “lễ thanh tẩy” được giữ trong chú thích.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: lên cạnh bàn thờ
  rationale: קִיר theo nghĩa đen là “tường/vách”; đối với bàn thờ, “cạnh bàn thờ” diễn đạt tự nhiên bề mặt thẳng đứng được nhắm đến.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: phần máu còn lại
  rationale: Phân từ Niphal của שׁאר chỉ phần còn dư lại; cách dịch này rõ ràng và tự nhiên.
- source_word: יִמָּצֶה
  choice: phải được vắt ra
  rationale: Niphal của מצה diễn tả việc ép hoặc vắt cho phần máu còn lại chảy hết ra, cụ thể hơn động tác chỉ đơn thuần đổ.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: nơi chân bàn thờ
  rationale: יְסוֹד là nền hoặc phần chân; “chân bàn thờ” là cách nói tự nhiên về phần đáy của bàn thờ.
- source_word: חַטָּאת הוּא
  choice: Đó là lễ chuộc tội
  rationale: Mệnh đề xác định loại lễ vật; giữ cùng thuật ngữ với lần xuất hiện trước để nhất quán.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: Từ Hê-bơ-rơ có thể nhấn mạnh mối liên hệ với tội lỗi hoặc chức năng thanh tẩy của nghi lễ. Bản chính dùng thuật ngữ quen thuộc “lễ chuộc tội”, đồng thời chú thích giữ lại cách hiểu “lễ thanh tẩy” để không xóa bỏ sắc thái thực sự của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” vì chủ thể của động từ tiếp nối văn cảnh trước; dùng “phải” để thể hiện tính quy định của luật tế lễ. Dấu chú thích [a] được đặt ngay sau lần xuất hiện đầu tiên của thuật ngữ và áp dụng cho cả hai lần.
