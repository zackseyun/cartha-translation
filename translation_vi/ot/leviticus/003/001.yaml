id: LEV.3.1
reference: Leviticus 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: vi
  text: Nếu lễ vật của người ấy là một tế lễ bình an[a], nếu người ấy dâng từ đàn bò, dù là đực hay cái, thì người ấy phải dâng một con không tì vết trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tế lễ giao hảo”. Cụm từ Hê-bơ-rơ theo sát nghĩa là “một sinh tế của các lễ vật bình an”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: một tế lễ bình an
  rationale: זֶבַח chỉ một sinh tế/tế lễ, còn שְׁלָמִים là tên loại lễ vật, gợi ý niệm bình an, an lành và trọn vẹn. “Tế lễ bình an” giữ được cấu trúc và thuật ngữ tế tự của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: קָרְבָּנוֹ
  choice: lễ vật của người ấy
  rationale: קָרְבָּן là vật được đem đến để dâng. “Lễ vật” rõ nghĩa trong văn cảnh tế tự; “của người ấy” phản ánh hậu tố sở hữu ngôi thứ ba số ít giống đực mà không mặc định đó là người đọc.
- source_word: מִן הַבָּקָר
  choice: từ đàn bò
  rationale: בָּקָר chỉ gia súc thuộc loài bò. “Từ đàn bò” vừa sát nghĩa vừa phân biệt với các vật thuộc bầy chiên, dê ở phần sau.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: dâng / phải dâng
  rationale: Dạng Hiphil của קרב trong văn cảnh tế lễ có nghĩa là đem đến trình dâng. “Dâng” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt; “phải dâng” thể hiện lực quy định của thể vị hoàn thành trong luật lệ.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: dù đực hay cái
  rationale: Cặp אִם ... אִם cho phép một trong hai khả năng. “Dù đực hay cái” diễn đạt tự nhiên việc cả hai giới tính đều được chấp nhận.
- source_word: תָּמִים
  choice: không tì vết
  rationale: Trong luật tế lễ, תָּמִים nói về con vật không có khuyết tật. “Không tì vết” là cách nói trang trọng, dễ hiểu và phù hợp văn cảnh.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי có nghĩa là “trước mặt/trong sự hiện diện của”. Giữ tên riêng “Yahweh” để phản ánh trực tiếp danh giao ước יְהוָה trong nguyên văn.
theological_decisions:
- issue: Cách gọi lễ vật שְׁלָמִים
  choice: tế lễ bình an
  alternative: tế lễ giao hảo; tế lễ cầu an
  rationale: “Bình an” giữ được trường nghĩa rộng của gốc שׁלם, gồm bình an, an lành và sự trọn vẹn, mà không thu hẹp mục đích của lễ vật vào riêng sự giao hảo hay cầu xin bình an.
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tetragrammaton. Phiên âm “Yahweh” bảo tồn chức năng của danh riêng và tránh thay nó bằng một tước hiệu.
translation_notes:
  register: 'Văn phong luật lệ trang trọng nhưng hiện đại. Cấu trúc câu được sắp xếp lại nhẹ để tiếng Việt tự nhiên, đồng thời vẫn giữ điều kiện kép của nguyên văn: loại tế lễ và việc chọn con vật từ đàn bò.'
