  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: vi
  text: Người ấy phải đặt tay mình trên đầu lễ vật, rồi giết nó trước Lều Hội Kiến; các con trai A-rôn phải hắt máu nó vào các phía quanh bàn thờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ném” hoặc “vẩy mạnh”; động từ Hê-bơ-rơ diễn tả việc đưa máu vào các phía quanh bàn thờ bằng một động tác mạnh, không phải rảy nhẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: phải đặt
  rationale: Trong nghi lễ hiến tế, động từ סמך với tay đặt trên đầu con vật chỉ hành động đặt hoặc tì tay. “Đặt” tự nhiên trong tiếng Việt và không diễn giải thêm ý nghĩa biểu tượng.
- source_word: יָדוֹ
  choice: tay mình
  rationale: Danh từ số ít với hậu tố ngôi ba số ít giống đực là “tay của người ấy”; “tay mình” liên kết tự nhiên với chủ ngữ trong tiếng Việt và giữ số ít.
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: đầu lễ vật
  rationale: רֹאשׁ mang nghĩa giải phẫu thông thường là “đầu”; קָרְבָּן là vật được dâng, nên “lễ vật” vừa rộng vừa phù hợp ngữ cảnh.
- source_word: וְשָׁחַט אֹתוֹ
  choice: rồi giết nó
  rationale: שׁחט là thuật ngữ chỉ việc giết con vật hiến tế. “Giết” rõ ràng, tự nhiên trong tiếng Việt hiện đại; ngữ cảnh đã xác định đây là hành động nghi lễ.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: trước Lều Hội Kiến
  rationale: לִפְנֵי chỉ vị trí “trước”; אֹהֶל מוֹעֵד là danh xưng của lều thánh, được dịch trang trọng và súc tích là “Lều Hội Kiến”.
- source_word: בְּנֵי אַהֲרֹן
  choice: các con trai A-rôn
  rationale: Giữ nguyên quan hệ gia đình và giới tính được văn bản Hê-bơ-rơ nêu rõ, không khái quát hóa thành “hậu duệ” hay diễn giải thành “các thầy tế lễ”.
- source_word: וְזָרְקוּ
  choice: phải hắt
  rationale: זרק diễn tả việc đưa máu lên bàn thờ bằng một động tác mạnh. “Hắt” tự nhiên hơn “ném máu” trong tiếng Việt và không gợi một sự rảy nhẹ.
- source_word: דָּמוֹ
  choice: máu nó
  rationale: Hậu tố chỉ về con vật hiến tế; “máu nó” rõ ràng và tự nhiên trong lời chỉ dẫn nghi lễ.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: quanh bàn thờ
  rationale: Kết hợp עַל với סָבִיב trong nghi thức này chỉ việc đưa máu lên các phía quanh bàn thờ. Cách diễn đạt này tránh hàm ý chỉ đổ trên mặt bàn thờ.
theological_decisions:
- issue: Hành động đặt tay trong nghi lễ hiến tế
  choice: Mô tả đơn thuần là “đặt tay mình trên đầu lễ vật”.
  alternative: Dịch diễn giải là chuyển tội lỗi sang con vật hoặc đồng nhất mình với con vật.
  rationale: Câu này chỉ quy định hành động, không giải thích ý nghĩa thần học; bản dịch không đưa một cách giải thích biểu tượng vào chính văn.
- issue: Cụm từ giới tính và gia đình בְּנֵי אַהֲרֹן
  choice: “các con trai A-rôn”
  alternative: “hậu duệ A-rôn” hoặc “các thầy tế lễ”
  rationale: Nguyên văn chỉ đích danh các con trai; giữ cách gọi ấy bảo toàn phạm vi và sắc thái của nguồn.
- issue: Cách thức áp dụng máu lên bàn thờ
  choice: Dùng “hắt” để biểu thị động tác mạnh nhưng không xác định quá mức kỹ thuật thực hiện.
  alternative: “rảy” có thể gợi động tác nhẹ; “ném” sát nghĩa từ vựng hơn nhưng kém tự nhiên khi đi với máu trong tiếng Việt.
  rationale: Giữ đặc điểm nghi lễ của זרק và tránh đồng nhất với một động từ Hê-bơ-rơ khác thường được dịch là “rảy”.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “Lều Hội Kiến” như một danh xưng; phiên âm tên riêng là “A-rôn”. Dấu chú thích [a] đặt sau toàn bộ mệnh đề về nghi thức hắt máu để tránh gắn nhầm với “Lều Hội Kiến”.
