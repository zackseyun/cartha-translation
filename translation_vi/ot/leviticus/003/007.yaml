id: LEV.3.7
reference: Leviticus 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: vi
  text: Nếu người ấy dâng một con chiên làm lễ vật của mình[a], thì phải dâng nó trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “một con chiên con làm lễ vật của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện trong các chỉ dẫn về tế lễ; “nếu” diễn đạt trực tiếp cấu trúc pháp quy của câu.
- source_word: כֶּשֶׂב
  choice: con chiên
  rationale: Từ này chỉ chiên và trong một số ngữ cảnh có thể chỉ chiên con. “Con chiên” giữ nghĩa rộng, không xác định tuổi quá mức; cách hiểu “chiên con” được ghi ở chú thích.
- source_word: הוּא
  choice: người ấy
  rationale: Giữ đại từ được nêu rõ trong tiếng Hê-bơ-rơ, đồng thời phù hợp với văn phong chỉ dẫn bằng tiếng Việt.
- source_word: מַקְרִיב
  choice: dâng
  rationale: Động từ Hiphil của קרב mang nghĩa đem đến gần hay trình dâng như một lễ vật. “Dâng” tự nhiên, trang trọng và đúng ngữ cảnh thờ phượng.
- source_word: קָרְבָּנוֹ
  choice: lễ vật của mình
  rationale: קָרְבָּן là thuật ngữ khái quát cho vật được đem đến dâng, nên “lễ vật” rõ nghĩa hơn “vật hi sinh” và không thu hẹp phạm vi nghĩa.
- source_word: וְהִקְרִיב
  choice: thì phải dâng
  rationale: Trong ngữ cảnh luật lệ, dạng động từ này nêu hành động tiếp theo có tính bắt buộc; “thì phải” thể hiện rõ quan hệ điều kiện và chỉ thị.
- source_word: אֹתוֹ
  choice: nó
  rationale: Đại từ chỉ trở lại con vật được dâng; “nó” là cách quy chiếu tự nhiên trong tiếng Việt.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Diễn đạt tự nhiên ý nghĩa không gian và nghi lễ của việc trình dâng trong sự hiện diện của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. “Yahweh” giữ đây là danh riêng và phản ánh cách phục nguyên cách đọc được chấp nhận rộng rãi, trong khi không thay bằng tước hiệu.
- issue: Mức độ xác định tuổi của כֶּשֶׂב
  choice: con chiên
  alternative: con chiên con
  rationale: Ngữ cảnh phân loại vật tế lễ không buộc phải xác định đây là chiên non. Bản dịch chính giữ nghĩa rộng, còn khả năng chỉ chiên con được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “nếu… thì phải…” phù hợp với thể văn luật lệ; “dâng” được lặp lại có chủ ý để phản ánh cùng một gốc động từ trong nguyên văn.
