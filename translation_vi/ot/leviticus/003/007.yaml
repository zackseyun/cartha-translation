  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc điều kiện và tính chỉ thị của nguyên văn: אִם là “Nếu,” כֶּשֶׂב được giữ ở nghĩa rộng là “một con chiên,” קָרְבָּנוֹ là “lễ vật của mình,” và hành động kế tiếp được diễn đạt là “thì phải dâng nó.” “Trước mặt Yahweh” chuyển đạt chính xác לִפְנֵי יְהוָה. Việc lặp lại “dâng” cũng phù hợp với hai hình thức của cùng gốc קרב trong tiếng Hê-bơ-rơ.'
