id: LEV.3.6
reference: Leviticus 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: vi
  text: Còn nếu lễ vật người ấy dâng lên Yahweh làm sinh tế bình an[a] là từ bầy chiên hoặc bầy dê, thì người ấy phải dâng con đực hoặc con cái không tì vết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sinh tế hiệp thông”. Từ Hê-bơ-rơ שְׁלָמִים theo truyền thống được dịch là “sinh tế bình an”, nhưng cũng có thể nhấn mạnh sự an lành trọn vẹn hoặc sự hiệp thông được chia sẻ trong bữa ăn tế lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Còn nếu
  rationale: Giữ cả ý nối tiếp với các chỉ dẫn trước và sắc thái điều kiện của câu.
- source_word: מִן הַצֹּאן
  choice: thuộc đàn chiên hoặc đàn dê
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, chủ yếu gồm chiên và dê; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: קָרְבָּנוֹ
  choice: lễ vật của người ấy
  rationale: קָרְבָּן là thuật ngữ chỉ vật được đem đến để dâng; “lễ vật” rõ ràng và phù hợp với văn cảnh tế lễ.
- source_word: לְזֶבַח שְׁלָמִים
  choice: để làm sinh tế bình an
  rationale: “Sinh tế” thể hiện זֶבַח là lễ hiến tế con vật, còn “bình an” giữ cách hiểu truyền thống của thuật ngữ שְׁלָמִים mà không xóa bỏ khả năng nhấn mạnh sự hiệp thông hay phúc lành trọn vẹn.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giới từ לְ diễn tả hướng dâng hiến, còn danh thánh יהוה được phiên âm là “Yahweh”.
- source_word: זָכָר אוֹ נְקֵבָה
  choice: dù là con đực hay con cái
  rationale: Diễn đạt trực tiếp sự phân biệt giới tính của con vật và cho thấy cả hai đều được chấp nhận.
- source_word: תָּמִים
  choice: không tì vết
  rationale: Trong ngữ cảnh tế lễ, תָּמִים chỉ con vật không có khuyết tật; “không tì vết” là cách diễn đạt chính xác và trang trọng.
- source_word: יַקְרִיבֶנּוּ
  choice: người ấy phải dâng một con
  rationale: Thể Hiphil của קרב trong văn cảnh tế lễ có nghĩa là đem đến trình dâng; “phải dâng” truyền đạt lực quy định của động từ chưa hoàn thành trong chỉ thị luật pháp.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của שְׁלָמִים
  choice: lễ bình an
  alternative: lễ hiệp thông
  rationale: “Bình an” giữ thuật ngữ tế lễ truyền thống, nhưng chú thích nêu rõ sắc thái có thể bao gồm sự hiệp thông và phúc lành trọn vẹn, tránh thu hẹp ý nghĩa của từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Còn nếu” liên kết điều lệ này với phần trước; trật tự câu làm rõ rằng con vật, dù đực hay cái, đều phải không tì vết.
