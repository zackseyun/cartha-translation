  source_fidelity: Bản thảo truyền đạt đúng điều kiện, nguồn con vật, việc dâng cho Yahweh, và yêu cầu con đực hoặc con cái không tì vết. Tuy nhiên, cấu trúc “lễ vật ... dâng lên Yahweh là con vật...” không phản ánh tự nhiên quan hệ cú pháp của nguyên văn và làm câu tiếng Việt nặng, mơ hồ.
  naturalness: Cần đặt cụm “dâng lên Yahweh” sát với hành động dâng và diễn đạt nguồn gốc bằng “từ bầy chiên hoặc bầy dê”. Câu sửa giữ văn phong luật tế lễ trang trọng, hiện đại và rõ ràng.
  terminology: Giữ “Yahweh”, “sinh tế bình an”, và “không tì vết”. Chú thích cần nhất quán khi gọi thuật ngữ chính là “sinh tế bình an”, thay vì chuyển sang “lễ vật bình an”.
  issues:
