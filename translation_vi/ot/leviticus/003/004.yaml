revisions:
- from: cùng hai quả thận và lớp mỡ bọc chúng ở vùng hông. Còn phần phụ trên gan[a], người ấy phải lấy ra cùng với hai quả thận.
  to: cùng hai quả thận, mỡ trên chúng, tức là ở vùng hông, và phần phụ trên gan[a]; người ấy phải lấy phần phụ ấy ra cùng với hai quả thận.
  rationale: Sửa cấu trúc câu để phản ánh chuỗi phối hợp của nguyên văn, thay cách diễn giải “bọc” bằng quan hệ không gian trực tiếp “trên”, và làm rõ đối tượng số ít của động từ “lấy ra”. Chú thích được chỉnh nhẹ cho tự nhiên hơn mà vẫn bảo toàn tính bất định của thuật ngữ giải phẫu.
  reviewer_model: gpt-5.6-terra
