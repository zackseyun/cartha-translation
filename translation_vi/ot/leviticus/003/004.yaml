base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: vi
  text: cùng hai quả thận, mỡ trên chúng, tức là ở vùng hông, và phần phụ trên gan[a]; người ấy phải lấy phần phụ ấy ra cùng với hai quả thận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thùy trên gan.” Thuật ngữ giải phẫu trong tiếng Hê-bơ-rơ ở đây không chắc chắn; bản văn chính dùng “phần phụ” để không khẳng định mức độ chính xác vượt quá điều có thể xác định.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: hai quả thận
  rationale: Cụm từ chỉ rõ hai cơ quan thận; cách nói này chính xác và tự nhiên trong tiếng Việt hiện đại.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: lớp mỡ bọc chúng ở vùng hông
  rationale: Trong luật tế lễ, חֵלֶב là phần mỡ dành để dâng. Cách diễn đạt này giữ quan hệ giữa lớp mỡ, hai quả thận và vùng hông mà vẫn tự nhiên trong tiếng Việt.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: phần phụ trên gan
  rationale: Danh từ יוֹתֶרֶת là thuật ngữ giải phẫu khó xác định, chỉ một phần nhô ra liên quan đến gan. “Phần phụ” tránh khẳng định quá mức rằng đó chính xác là một thùy gan.
- source_word: עַל הַכְּלָיוֹת
  choice: cùng với hai quả thận
  rationale: 'Trong công thức tế lễ này, cụm từ được hiểu theo nghĩa thủ tục: phần liên quan đến gan được lấy ra cùng hai quả thận. Cách dịch này rõ nghĩa hơn một cách diễn đạt vị trí thiếu tự nhiên.'
- source_word: יְסִירֶנָּה
  choice: người ấy phải lấy ra
  rationale: Dạng Hiphil của סור truyền đạt mệnh lệnh nghi lễ phải tách và lấy phần ấy ra; “phải lấy ra” giữ được sắc thái quy định pháp luật.
