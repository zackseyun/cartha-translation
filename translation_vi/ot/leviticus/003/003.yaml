  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: vi
  text: 'Từ sinh tế bình an, người ấy phải dâng cho Yahweh một lễ vật dâng bằng lửa[a]: phần mỡ phủ nội tạng và mọi phần mỡ ở trên nội tạng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật làm thức ăn.”'
    reason: Từ Hê-bơ-rơ אִשֶּׁה thường được hiểu là lễ vật dâng qua lửa, nhưng trong văn liệu tư tế cũng có thể nhấn mạnh lễ vật như một thức ăn dâng cho Đức Chúa Trời.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: phải dâng lên
  rationale: Thể Hiphil của קרב trong bối cảnh tế lễ chỉ hành động chính thức đem đến và dâng lễ vật; “dâng lên” tự nhiên trong tiếng Việt mà vẫn giữ sắc thái nghi lễ.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: từ sinh tế cầu an
  rationale: זֶבַח là sinh tế, tức lễ vật có giết con vật; שְׁלָמִים là một loại tế lễ gắn với sự bình an, phúc lành và giao hảo. “Sinh tế cầu an” là cách gọi gọn, dễ hiểu và không thu hẹp ý nghĩa chỉ còn sự thông công.
- source_word: אִשֶּׁה
  choice: một lễ vật dâng bằng lửa
  rationale: Trong luật tế lễ, từ này chỉ lễ vật được đưa lên bàn thờ bằng lửa. Cách dịch này giữ yếu tố lửa rõ ràng; khả năng hiểu theo công dụng là lễ vật làm thức ăn được ghi ở chú thích.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Dùng trực tiếp danh giao ước יהוה là “Yahweh”; giới từ ל được diễn đạt tự nhiên cùng động từ “dâng lên”.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: phần mỡ phủ nội tạng
  rationale: חֵלֶב ở đây là phần mỡ của con vật dành cho tế lễ, còn קֶרֶב trong ngữ cảnh giải phẫu là nội tạng. Cụm từ giữ đúng quan hệ phần mỡ bao phủ các cơ quan bên trong.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: toàn bộ mỡ bám trên nội tạng
  rationale: “Bám trên” diễn đạt tự nhiên vị trí của lớp mỡ đối với nội tạng và phân biệt nó với phần mỡ phủ nội tạng vừa nêu.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ ghi trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của אִשֶּׁה trong luật tế lễ
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật làm thức ăn
  rationale: Từ này có thể được hiểu theo phương thức lễ vật được dâng qua lửa hoặc theo vai trò biểu tượng là thức ăn dâng cho Đức Chúa Trời. Bản chính giữ nét nghĩa gắn với lửa, còn chú thích bảo tồn cách hiểu kia mà không khẳng định quá mức.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Sinh tế” giữ độ chính xác của thuật ngữ nghi lễ, còn “cầu an,” “nội tạng” và “mỡ bám” giúp câu dễ hiểu đối với độc giả phổ thông. Dấu hai chấm làm rõ rằng các phần mỡ sau đó chính là lễ vật được dâng bằng lửa.
