revisions:
- from: 'Từ sinh tế cầu an, người ấy phải dâng lên Yahweh một lễ vật dâng bằng lửa[a]: phần mỡ phủ nội tạng và toàn bộ mỡ bám trên nội tạng.'
  to: 'Từ sinh tế bình an, người ấy phải dâng cho Yahweh một lễ vật dâng bằng lửa[a]: phần mỡ phủ nội tạng và mọi phần mỡ ở trên nội tạng.'
  rationale: Các chỉnh sửa thay “cầu an” bằng “bình an”, “dâng lên Yahweh” bằng “dâng cho Yahweh”, và “mỡ bám trên” bằng “mỡ ở trên”. Chúng cải thiện độ sát nguồn và cách dùng tiếng Việt mà không thay đổi nghĩa hay giải quyết võ đoán các điểm còn có thể tranh luận.
