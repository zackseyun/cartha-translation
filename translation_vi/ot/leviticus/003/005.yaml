  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Các con trai A-rôn sẽ đốt phần ấy trên bàn thờ, trên lễ thiêu đặt trên củi, còn củi ở trên lửa. Đó là một lễ vật dâng bằng lửa, có hương thơm đẹp lòng Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lễ vật làm thức ăn”.'
    reason: Bảo lưu cách hiểu khác của thuật ngữ hiến tế אִשֶּׁה; trong ngữ cảnh này, thuật ngữ cũng thường được hiểu là lễ vật dâng bằng lửa.
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: sẽ đốt
  rationale: Thể Hiphil của קטר trong nghi lễ hiến tế chỉ việc đốt lễ vật trên bàn thờ để khói bay lên. “Sẽ đốt” tự nhiên, rõ nghĩa và phù hợp với lời chỉ dẫn nghi lễ.
- source_word: אֹתוֹ
  choice: phần ấy
  rationale: Đại từ làm tân ngữ chỉ về phần lễ vật đã được nêu ở câu trước; “phần ấy” giúp người đọc tiếng Việt nhận rõ sở chỉ mà không thêm chi tiết ngoài văn cảnh.
- source_word: בְנֵי אַהֲרֹן
  choice: các con trai A-rôn
  rationale: Giữ nguyên cách gọi theo quan hệ gia đình và chức năng tư tế trong ngữ cảnh, bằng lối diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Đuôi chỉ hướng trong tiếng Hê-bơ-rơ được thể hiện tự nhiên bằng “trên”, vừa nêu đích đến vừa nêu vị trí của hành động đốt.
- source_word: עַל הָעֹלָה
  choice: bên trên lễ thiêu
  rationale: עַל ở đây thích hợp nhất với vị trí chồng lên trên. עֹלָה được dịch bằng thuật ngữ quen thuộc “lễ thiêu”.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: đặt trên củi đang cháy trong lửa
  rationale: 'Diễn đạt tự nhiên bố trí trên bàn thờ mà chuỗi mệnh đề quan hệ mô tả: lễ thiêu ở trên củi, còn củi ở trên/ngay trong lửa. “Củi” không cụ thể hóa quá mức như “khúc gỗ”.'
- source_word: אִשֵּׁה
  choice: lễ vật dùng lửa dâng lên
  rationale: Đây là thuật ngữ hiến tế chỉ lễ vật được dâng bằng lửa. Cách dịch này giữ rõ phương thức nghi lễ và tránh gợi ý rằng thần linh ăn theo nghĩa thô thiển; cách hiểu liên hệ đến “thức ăn” được ghi ở chú thích.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  rationale: Cụm từ nghi lễ cố định diễn tả lễ vật được Đức Chúa Trời vui nhận. “Đẹp lòng” tự nhiên hơn lối dịch sát “êm dịu” và không hàm ý mùi hương làm nguôi cơn giận.
- source_word: לַיהוָה
  choice: đẹp lòng Yahweh
  rationale: Giới từ ל trong công thức này diễn tả đối tượng tiếp nhận và vui nhận lễ vật. Danh riêng giao ước יהוה được giữ là “Yahweh”.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của אִשֵּׁה trong công thức hiến tế
  choice: lễ vật dùng lửa dâng lên
  alternative: phần lễ vật làm thức ăn
  rationale: Từ này là một thuật ngữ hiến tế có thể được hiểu theo phương thức dâng bằng lửa hoặc theo phạm trù phần lễ vật dành cho Đức Chúa Trời. Bản chính chọn cách trực tiếp gắn với lửa trong ngữ cảnh, còn cách hiểu “thức ăn” được bảo lưu ở chú thích để không xóa bỏ sự không chắc chắn về từ nguyên và sắc thái nghi lễ.
translation_notes:
  register: 'Văn phong trang trọng nhưng hiện đại, dùng thuật ngữ nghi lễ nhất quán và dễ hiểu. Cấu trúc chuỗi vị trí của bản Hê-bơ-rơ được làm mượt vừa đủ cho tiếng Việt, đồng thời vẫn giữ thứ tự: bàn thờ—lễ thiêu—củi—lửa.'
