revisions:
- from: Các con trai A-rôn sẽ đốt phần ấy trên bàn thờ, bên trên lễ thiêu đặt trên củi đang cháy trong lửa. Đó là lễ vật dùng lửa dâng lên[a], có hương thơm đẹp lòng Yahweh.
  to: Các con trai A-rôn sẽ đốt phần ấy trên bàn thờ, trên lễ thiêu đặt trên củi, còn củi ở trên lửa. Đó là một lễ vật dâng bằng lửa, có hương thơm đẹp lòng Yahweh.[a]
  rationale: Bản sửa loại bỏ diễn giải “đang cháy trong lửa,” giữ chuỗi quan hệ vị trí của tiếng Hê-bơ-rơ, và dùng cách gọi nghi lễ tiếng Việt tự nhiên hơn. Dấu chú thích được đặt ngay sau mệnh đề chứa thuật ngữ אִשֶּׁה để neo chú thích chính xác.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng chủ thể, hành động nghi lễ, sự xếp đặt bàn thờ—lễ thiêu—củi—lửa và công thức kết thúc dâng cho Yahweh. Tuy nhiên, cụm “củi đang cháy trong lửa” diễn giải quá mức: tiếng Hê-bơ-rơ chỉ nói củi “ở trên lửa,” không khẳng định trực tiếp rằng củi đang cháy hay ở trong lửa.'
  naturalness: Văn phong nhìn chung trang trọng, hiện đại. Cấu trúc vị trí được sửa thành hai mệnh đề rõ ràng để tránh cách nói hơi gượng “đặt trên củi đang cháy trong lửa.”
  terminology: “Lễ thiêu,” “bàn thờ,” và “Yahweh” phù hợp. “Lễ vật dâng bằng lửa” là cách gọi tự nhiên và chính xác hơn “lễ vật dùng lửa dâng lên” cho thuật ngữ nghi lễ אִשֶּׁה. Chú thích bảo lưu cách hiểu “lễ vật làm thức ăn” mà không áp đặt một từ nguyên chắc chắn.
  issues:
  - severity: medium
    issue: “củi đang cháy trong lửa”
    rationale: Cụm này thay đổi quan hệ không gian của nguyên văn אֲשֶׁר עַל־הָאֵשׁ (“ở trên lửa”) thành tình trạng “đang cháy trong lửa.” Đây là chi tiết diễn giải không được nêu trực tiếp.
  - severity: low
    issue: “lễ vật dùng lửa dâng lên”
    rationale: Cách diễn đạt có thể hiểu là phương tiện thực hiện hành động dâng; “lễ vật dâng bằng lửa” là thuật ngữ tiếng Việt rõ và tự nhiên hơn, đồng thời sát với chức năng nghi lễ của אִשֶּׁה.
  revised_text: Các con trai A-rôn sẽ đốt phần ấy trên bàn thờ, trên lễ thiêu đặt trên củi, còn củi ở trên lửa. Đó là một lễ vật dâng bằng lửa, có hương thơm đẹp lòng Yahweh.[a]
