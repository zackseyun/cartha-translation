- from: Từ con vật ấy, người dâng phải trình lễ vật của mình—một lễ vật dùng lửa dâng lên Đức Giê-hô-va[a]—gồm phần mỡ bao phủ nội tạng và toàn bộ phần mỡ bám trên nội tạng.
