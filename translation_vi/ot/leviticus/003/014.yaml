  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: vi
  text: 'Từ con vật ấy, người ấy phải dâng lễ vật của mình làm lễ vật dâng bằng lửa cho Yahweh: phần mỡ bao phủ nội tạng và toàn bộ phần mỡ bám trên nội tạng.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב מִמֶּנּוּ קָרְבָּנוֹ
  choice: Từ con vật ấy, người dâng phải trình lễ vật của mình
  rationale: Động từ Hiphil của קרב diễn tả việc đem đến hoặc trình lễ vật trong nghi thức. Đại từ trong מִמֶּנּוּ chỉ về con vật hiến tế; thêm “con vật” giúp tiếng Việt rõ nghĩa mà không đổi sở chỉ.
- source_word: אִשֶּׁה
  choice: một lễ vật dùng lửa dâng lên
  rationale: Danh từ nghi lễ này có liên hệ với lửa nhưng sắc thái chính xác còn được bàn luận. Cách dịch này giữ mối liên hệ hiển nhiên với việc thiêu lễ vật, thay vì diễn giải là thức ăn.
- source_word: לַיהוָה
  choice: dâng lên Đức Giê-hô-va
  rationale: Giới từ ל phù hợp với hướng dâng lễ vật lên cho Đức Chúa Trời; danh riêng giao ước יהוה được phiên âm theo cách quen thuộc trong tiếng Việt.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: phần mỡ bao phủ nội tạng
  rationale: חֵלֶב là phần mỡ được dành riêng trong luật tế lễ; קֶרֶב ở đây chỉ các bộ phận bên trong khoang bụng. “Nội tạng” chính xác và tự nhiên trong tiếng Việt hiện đại.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: và toàn bộ phần mỡ bám trên nội tạng
  rationale: “Bám trên” diễn đạt tự nhiên quan hệ không gian của עַל trong mô tả giải phẫu, đồng thời phân biệt với phần mỡ bao phủ vừa nêu.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; ĐỨC CHÚA
  rationale: Dùng danh riêng thay vì tước hiệu để giữ việc bản Hê-bơ-rơ nêu trực tiếp Tứ Tự Danh; “Đức Giê-hô-va” là dạng phiên âm trang trọng và quen thuộc với độc giả Kinh Thánh tiếng Việt.
- issue: Ý nghĩa của אִשֶּׁה
  choice: lễ vật dùng lửa dâng lên
  alternative: lễ vật làm thức ăn; lễ vật thiêu bằng lửa
  rationale: Ngữ cảnh nói đến phần mỡ được đốt trên bàn thờ, nhưng từ nguyên và sắc thái của thuật ngữ không hoàn toàn chắc chắn. Bản chính giữ liên hệ với lửa mà không khẳng định đây là “thức ăn” theo nghĩa thần học.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng dễ hiểu. Câu được sắp xếp lại nhẹ theo cú pháp tiếng Việt; dấu gạch ngang làm rõ rằng phần mỡ sau đó giải thích thành phần của lễ vật.
