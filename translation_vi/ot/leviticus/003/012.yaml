source:
  edition: WLC
  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: vi
  text: Còn nếu lễ vật của người ấy là một con dê, thì người ấy phải dâng nó trước mặt Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Danh này trong tiếng Hê-bơ-rơ được viết là “YHWH”; theo truyền thống thường được dịch là “CHÚA”.
    reason: Nêu dạng danh thần trong nguyên văn và cách dịch truyền thống, đồng thời phù hợp với việc bản văn chính phiên âm danh này là “Yahweh”.
lexical_decisions:
- source_word: וְאִם
  choice: Còn nếu
  rationale: Liên từ kết hợp với điều kiện mở đầu trường hợp kế tiếp trong chuỗi chỉ dẫn về lễ vật; “Còn nếu” diễn đạt tự nhiên sự chuyển sang một lựa chọn khác mà không tạo đối lập quá mạnh.
- source_word: עֵז
  choice: một con dê
  rationale: Danh từ số ít chỉ con dê; thêm loại từ và số từ để câu tiếng Việt tự nhiên, đồng thời giữ số ít của nguyên văn.
- source_word: קָרְבָּנוֹ
  choice: lễ vật của người ấy
  rationale: קָרְבָּן là thuật ngữ rộng chỉ vật được đem đến dâng; “lễ vật” phù hợp hơn “sinh tế”, vốn có thể thu hẹp nghĩa. Cụm “của người ấy” giữ hậu tố sở hữu ngôi ba số ít mà không mặc nhiên xác định giới tính.
- source_word: וְהִקְרִיבוֹ
  choice: thì người ấy phải dâng nó
  rationale: Thể Hiphil của קרב trong bối cảnh nghi lễ mang nghĩa đem đến gần hoặc trình dâng. “Phải dâng” truyền đạt rõ sắc thái quy định của câu và tự nhiên trong tiếng Việt hiện đại.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Cách dịch ngắn gọn, tự nhiên, giữ ý nghĩa không gian và nghi lễ của việc trình dâng trước sự hiện diện của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong bản văn Hê-bơ-rơ thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh thần יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn trực tiếp dùng Tetragrammaton YHWH. “Yahweh” bảo tồn chức năng danh riêng và tránh âm thầm thay thế bằng tước hiệu; chú thích nêu truyền thống dịch khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để diễn đạt chủ thể ngôi ba mà không bổ sung giới tính ngoài điều bản văn xác định; cấu trúc “Còn nếu… thì…” làm rõ quan hệ điều kiện trong chỉ dẫn pháp lễ.
