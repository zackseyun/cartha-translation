    rationale: Nên nói danh này “được viết là YHWH trong tiếng Hê-bơ-rơ” thay vì “Tiếng Hê-bơ-rơ là YHWH”; đồng thời chú thích nên giải thích cách dịch truyền thống là “CHÚA” thay vì trình bày “Yahweh” như một phương án khi đó đã là cách dịch trong bản văn.
