  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְטִירָ֥/ם הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֤חֶם אִשֶּׁה֙ לְ/רֵ֣יחַ נִיחֹ֔חַ כָּל חֵ֖לֶב לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: vi
  text: Thầy tế lễ sẽ thiêu các phần ấy trên bàn thờ cho bốc khói, làm lương thực của lễ hỏa tế, để có hương thơm dễ chịu[a]. Toàn bộ mỡ thuộc về Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “lương thực/bánh của lễ vật dùng lửa dâng lên, để có hương thơm dễ chịu.” Cũng có thể dịch: “làm thức ăn, tức một lễ vật dùng lửa dâng lên”; hoặc: “để có hương thơm êm dịu/làm hài lòng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Toàn bộ mỡ đều dành cho Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: sẽ đốt các phần ấy ... cho bốc khói
  rationale: Động từ Hiphil קטר trong nghi lễ chỉ việc thiêu lễ vật để khói bay lên. Cách dịch này vừa nêu hành động đốt vừa giữ sắc thái dâng lên bằng khói; “các phần ấy” chuyển đúng hậu tố số nhiều và quy chiếu về những phần lễ vật đã nêu trong ngữ cảnh.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Đuôi chỉ hướng/địa điểm ở đây diễn tả nơi các phần lễ vật được thiêu; “trên bàn thờ” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: לֶחֶם אִשֶּׁה
  choice: lương thực của lễ hỏa tế
  rationale: לֶחֶם có nghĩa rộng là thức ăn/lương thực chứ không nhất thiết là bánh; אִשֶּׁה là lễ vật được dâng bằng lửa. Cách dịch giữ quan hệ cô đọng của cụm Hê-bơ-rơ mà không khiến người đọc hiểu lầm đây là bánh theo nghĩa đen.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: tỏa hương thơm dễ chịu
  rationale: Giữ nguyên hình ảnh nghi lễ về mùi hương được vui nhận mà không diễn giải thêm giáo lý; “dễ chịu” cũng bảo tồn nét nghĩa có thể hiểu là êm dịu hoặc làm vui lòng.
- source_word: כָּל חֵלֶב
  choice: Tất cả mỡ
  rationale: Giữ lực bao quát của כָּל và chỉ những phần mỡ của sinh tế được dành riêng trong ngữ cảnh.
- source_word: לַיהוָה
  choice: đều dành cho Yahweh
  rationale: Giới từ ל có thể biểu thị sự dành riêng hoặc thuộc về. “Dành cho” bảo tồn sắc thái hiến dâng và không thu hẹp cụm từ chỉ còn ý sở hữu; danh thần יהוה được chuyển là “Yahweh”.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Chúa Trời / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” nhận diện đây là danh riêng thay vì thay thế bằng một tước hiệu.
- issue: Ý nghĩa của לַיהוָה trong câu kết
  choice: dành cho Yahweh
  alternative: thuộc về Yahweh
  rationale: Giới từ ל có thể mang sắc thái dâng riêng cho hoặc sở hữu. Bản chính dùng “dành cho” để phù hợp bối cảnh tế lễ và giữ độ mở; phương án sở hữu được ghi ở chú thích.
- issue: Công thức לְרֵיחַ נִיחֹחַ
  choice: tỏa hương thơm dễ chịu
  alternative: tỏa hương thơm làm vui lòng
  rationale: Cách dịch giữ ẩn dụ về mùi hương và tính khả duyệt của lễ vật, nhưng không thêm một chủ thể cảm nhận vốn không được nêu minh nhiên ngay trong cụm từ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thầy tế lễ” là cách gọi phổ thông; “lễ hỏa tế” giữ thuật ngữ nghi lễ ngắn gọn, còn chú thích giải nghĩa sát chữ. Cấu trúc hai câu theo nhịp và ranh giới mệnh đề của tiếng Hê-bơ-rơ.
