base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: vi
  text: cùng hai quả thận, mỡ trên hai quả thận, tức là phần mỡ ở vùng hông, và phần phụ trên gan[a]; người ấy phải lấy phần phụ ấy ra cùng với hai quả thận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thùy trên gan”. Nghĩa chính xác của thuật ngữ giải phẫu Hê-bơ-rơ này (יֹתֶרֶת) chưa chắc chắn; bản văn chính dùng “phần phụ” để tránh diễn đạt quá cụ thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: hai quả thận
  rationale: Cụm từ chỉ rõ hai quả thận trong phần mô tả giải phẫu của lễ vật; cách dịch cụ thể và tự nhiên trong tiếng Việt.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: lớp mỡ bọc chúng
  rationale: Trong nghi thức hiến tế, חֵלֶב chỉ phần mỡ nội tạng dành để dâng. “Bọc chúng” diễn đạt tự nhiên vị trí của lớp mỡ đối với hai quả thận.
- source_word: הַכְּסָלִים
  choice: vùng hông
  rationale: Từ này chỉ vùng hông hoặc thắt lưng. “Vùng hông” dễ hiểu và phù hợp với ngữ cảnh giải phẫu mà không tạo sắc thái cổ.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: phần phụ trên gan
  rationale: Danh từ יֹתֶרֶת chỉ một bộ phận giải phẫu liên quan đến gan nhưng nghĩa chính xác chưa chắc chắn. “Phần phụ” tránh xác định quá mức đó là một thùy cụ thể.
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: người ấy phải lấy phần phụ ấy ra cùng với hai quả thận
  rationale: Động từ Hiphil יְסִירֶנָּה mang nghĩa lấy hoặc tách ra. Cách dịch này giữ đại từ giống cái số ít quy chiếu về phần phụ và hiểu עַל theo quan hệ thủ tục là lấy cùng hai quả thận.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mở đầu bằng “cùng” vì câu Hê-bơ-rơ tiếp nối danh sách từ câu trước. Sự lặp lại “hai quả thận” được giữ lại nhằm bảo toàn cấu trúc và quan hệ cú pháp của nguyên văn.
