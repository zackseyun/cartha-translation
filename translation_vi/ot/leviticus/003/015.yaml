revisions:
- from: cùng với hai quả thận, lớp mỡ bọc quanh chúng ở vùng hông, và phần phụ trên gan[a]; người ấy phải lấy phần phụ ấy ra cùng với hai quả thận[b].
  to: Người ấy phải lấy ra hai quả thận và mỡ trên chúng, tức là phần mỡ ở vùng hông, cũng như phần phụ trên gan; phần phụ này phải được lấy ra cùng với hai quả thận[b].
  rationale: Sửa cấu trúc câu để hai quả thận, mỡ trên chúng và phần phụ trên gan đều hiện rõ trong danh sách các phần phải được lấy ra. Câu thứ hai sau dấu chấm phẩy bảo lưu mối liên hệ đặc biệt, có phần khó về cú pháp, giữa “phần phụ” và cụm “trên/cùng với hai quả thận”. Chú thích a được giữ lại về mặt nội dung nhưng hiện không có điểm neo trong bản văn chính; cần thêm ký hiệu [a] sau “phần phụ trên gan” để bộ chú thích nhất quán.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:43:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo làm rõ đúng các thuật ngữ chính: hai quả thận, mỡ trên chúng, vùng hông, và phần phụ trên gan. Tuy nhiên, cấu trúc hiện tại khiến “người ấy phải lấy phần phụ ấy ra” trở thành hành động duy nhất, còn hai quả thận và mỡ chỉ như các thành phần đi kèm. Điều này không phản ánh đầy đủ danh sách các phần phải được lấy ra trong câu Hê-bơ-rơ. Bản sửa giữ sự khó xử cú pháp của cụm “cùng/trên hai quả thận” bằng cách liên kết nó trực tiếp với phần phụ và chú thích nghĩa đen.'
  naturalness: Câu sửa dùng cấu trúc luật lệ tự nhiên trong tiếng Việt hiện đại, đồng thời tránh mở đầu lửng bằng “cùng với”, vốn trong bản thảo làm quan hệ cú pháp của cả câu kém rõ.
  terminology: “Hai quả thận”, “mỡ”, “vùng hông”, và “phần phụ trên gan” phù hợp. “Phần phụ” là lựa chọn thận trọng cho יֹתֶרֶת, một thuật ngữ giải phẫu chưa chắc chắn. Không nên xác định nó là một bộ phận cụ thể trong bản văn chính.
  issues:
  - severity: high
    issue: Mệnh đề chính chỉ nói lấy “phần phụ ấy” ra, khiến hai quả thận và mỡ không còn được trình bày rõ là các phần trong danh sách phải lấy ra.
    rationale: Văn bản Hê-bơ-rơ liệt kê hai quả thận, mỡ trên chúng ở vùng hông, và phần phụ trên gan trước động từ “lấy ra”. Dù hậu tố số ít cuối câu có thể hướng về “phần phụ”, bản dịch tiếng Việt cần biểu thị rõ toàn bộ danh sách nghi lễ.
  - severity: medium
    issue: Câu mở đầu bằng “cùng với” tạo một thành phần phụ thuộc không rõ nó bổ nghĩa cho hành động nào.
    rationale: Trong tiếng Việt, cách mở đầu này khiến người đọc dễ hiểu rằng chỉ “phần phụ” được lấy ra, với thận và mỡ chỉ là phần đi kèm.
  revised_text: Người ấy phải lấy ra hai quả thận và mỡ trên chúng, tức là phần mỡ ở vùng hông, cũng như phần phụ trên gan; phần phụ này phải được lấy ra cùng với hai quả thận[b].
  revised_footnotes:
