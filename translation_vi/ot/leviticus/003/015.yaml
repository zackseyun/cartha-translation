base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: vi
  text: Người ấy phải lấy ra hai quả thận và mỡ trên chúng, tức là phần mỡ ở vùng hông, cũng như phần phụ trên gan; phần phụ này phải được lấy ra cùng với hai quả thận[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Nguyên văn là “trên hai quả thận”. Trong ngữ cảnh này, cụm từ có lẽ diễn tả rằng phần ấy được lấy ra cùng với hai quả thận.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: hai quả thận
  rationale: Cụm từ chỉ rõ hai quả thận trong giải phẫu con vật tế lễ; cách nói này tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: lớp mỡ bọc quanh chúng
  rationale: Trong luật tế lễ, חֵלֶב chỉ phần mỡ đặc biệt được tách ra để dâng. “Bọc quanh” diễn đạt tự nhiên vị trí của lớp mỡ đối với hai quả thận mà không làm thay đổi nội dung.
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: ở vùng hông
  rationale: כְּסָלִים chỉ vùng hông hoặc thắt lưng trong mô tả giải phẫu. “Vùng hông” dễ hiểu và thích hợp hơn “thắt lưng” khi nói về con vật.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: phần phụ trên gan
  rationale: Danh từ יֹתֶרֶת là một thuật ngữ giải phẫu chưa xác định chắc chắn. “Phần phụ” giữ được tính khái quát, còn “trên gan” phản ánh trực tiếp giới từ עַל.
- source_word: עַל הַכְּלָיֹת
  choice: cùng với hai quả thận
  rationale: Nghĩa đen của giới từ là “trên”, nhưng trong công thức tế lễ này, cụm từ nhiều khả năng chỉ việc phần ấy được lấy ra cùng với hai quả thận; bản dịch chính chọn nghĩa thủ tục và ghi nghĩa đen ở chú thích.
- source_word: יְסִירֶנָּה
  choice: người ấy phải lấy phần phụ ấy ra
  rationale: Thể Hiphil của סור diễn tả hành động loại bỏ hoặc lấy ra. Hậu tố giống cái số ít có thể quy chiếu về יֹתֶרֶת, nên lặp lại “phần phụ ấy” giúp tiếng Việt rõ nghĩa mà vẫn giữ số ít của nguyên văn.
