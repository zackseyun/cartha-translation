translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Câu mở đầu bằng “cùng với” vì câu Hê-bơ-rơ tiếp nối danh sách từ câu trước. Dấu chấm phẩy giúp làm rõ sự chuyển sang mệnh đề động từ ở cuối câu, đồng thời vẫn giữ cấu trúc liệt kê của nguyên văn.
