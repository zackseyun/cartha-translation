  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: vi
  text: Thầy tế lễ sẽ thiêu phần ấy trên bàn thờ; đó là thức ăn của lễ vật dâng bằng lửa cho Đức Giê-hô-va.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “bánh/thức ăn của một lễ vật dâng bằng lửa cho Đức Giê-hô-va.” “Bánh” ở đây là thành ngữ trong hệ thống hiến tế, chỉ thức ăn chứ không nhất thiết là bánh theo nghĩa đen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: sẽ thiêu phần ấy
  rationale: Trong nghi lễ hiến tế, dạng Hiphil của קטר chỉ việc thiêu lễ vật trên bàn thờ để khói bay lên. “Thiêu” tự nhiên và trang trọng; “phần ấy” làm rõ đại từ chỉ phần lễ vật vừa được nói đến.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ nghĩa, quen thuộc trong văn cảnh nghi lễ của Kinh Thánh và dễ hiểu đối với độc giả Việt ngữ hiện đại.
- source_word: הַמִּזְבֵּחָה
  choice: trên bàn thờ
  rationale: Hậu tố chỉ hướng trong văn cảnh hành động thiêu lễ vật được diễn đạt tự nhiên bằng “trên bàn thờ”.
- source_word: לֶחֶם
  choice: thức ăn
  rationale: Dù nghĩa thường gặp là “bánh”, tại đây từ này thuộc thành ngữ hiến tế và chỉ phần lễ vật trên bàn thờ, không nhất thiết là bánh theo nghĩa đen.
- source_word: אִשֶּׁה
  choice: một lễ vật dâng bằng lửa
  rationale: Giữ được tính chất thuật ngữ nghi lễ và phương thức dâng qua lửa, đồng thời tự nhiên hơn lối dịch sát chữ “lễ vật lửa”.
- source_word: לַיהוָה
  choice: lên Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “lên” phù hợp với hành động dâng và hình ảnh khói lễ vật bay lên.
theological_decisions:
- issue: Cách dịch thành ngữ hiến tế לֶחֶם אִשֶּׁה
  choice: làm thức ăn, một lễ vật dâng bằng lửa
  alternative: làm bánh của lễ vật dâng bằng lửa
  rationale: Cách chọn giữ hai yếu tố của câu Hê-bơ-rơ nhưng tránh khiến người đọc tưởng lễ vật ở đây là bánh theo nghĩa đen hoặc hàm ý Đức Chúa Trời cần thức ăn vật chất. Chú thích bảo tồn hình thức nguyên văn.
- issue: Cách thể hiện יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA
  rationale: Dùng một dạng danh riêng quen thuộc trong tiếng Việt để phản ánh việc nguyên văn nêu thánh danh, thay vì âm thầm chuyển thành tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc nghi lễ cô đọng của nguyên văn; thuật ngữ “thầy tế lễ”, “bàn thờ” và “lễ vật” nhất quán với văn cảnh Lê-vi Ký.
