  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc pháp quy của חֻקַּת עוֹלָם, tính tiếp nối qua các thế hệ, phạm vi tại mọi nơi cư ngụ, và lệnh cấm ăn mỡ cùng huyết. Tuy nhiên, “trải qua các thế hệ của anh em” không phải là cách diễn đạt tự nhiên nhất cho לְדֹרֹתֵיכֶם; “cho các thế hệ anh em” giữ nghĩa chính xác hơn trong công thức luật lệ. Lệnh cấm có thể dùng danh từ khái quát trần (“mỡ hay huyết”) mà vẫn truyền đạt phạm vi toàn diện của כָּל...וְכָל.
  naturalness: “Một quy định lâu dài” hơi gượng trong tiếng Việt hiện đại, vì “lâu dài” thường bổ nghĩa cho quá trình hoặc thời gian hơn là cho một quy định. “Quy định có hiệu lực lâu dài” tự nhiên, rõ nghĩa pháp lý và vẫn không buộc עוֹלָם phải mang nghĩa vô tận tuyệt đối. “Ở mọi nơi anh em cư ngụ” cũng trôi chảy hơn “tại mọi nơi anh em cư ngụ.”
  terminology: “Quy định,” “huyết,” và “anh em” phù hợp văn phong Kinh Thánh trang trọng-hiện đại. Giữ “huyết” thích hợp trong ngữ cảnh tế lễ. Chú thích duy trì các khả năng “đời đời” và “vĩnh viễn” mà không quyết định quá mức sắc thái thời hạn của עוֹלָם.
