base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: vi
  text: 'Đây là quy định có hiệu lực lâu dài[a] cho các thế hệ anh em, ở mọi nơi anh em cư ngụ: anh em không được ăn mỡ hay huyết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quy định đời đời” hoặc “quy định vĩnh viễn”. Trong các văn bản luật pháp, từ Hê-bơ-rơ עוֹלָם thường chỉ hiệu lực bền vững và liên tục.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת
  choice: quy định
  rationale: Danh từ חֻקָּה chỉ một điều lệ hay quy tắc đã được ấn định. “Quy định” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ sắc thái pháp quy.
- source_word: עוֹלָם
  choice: lâu dài
  rationale: Trong công thức luật pháp, từ này nhấn mạnh hiệu lực bền vững, tiếp tục qua các thế hệ; “lâu dài” giữ được ý ấy mà không áp đặt nghĩa vô tận tuyệt đối.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của anh em
  rationale: Diễn đạt sự tiếp nối của quy định qua những thế hệ kế tiếp, đồng thời giữ đại từ số nhiều của nguyên văn.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: tại mọi nơi anh em cư ngụ
  rationale: מוֹשָׁב ở đây nói đến nơi ở hay nơi cư trú; cách dịch này rõ nghĩa và tự nhiên hơn lối nói sát chữ “trong mọi chỗ ở”.
- source_word: כָּל חֵלֶב
  choice: bất cứ mỡ
  rationale: כָּל trong câu cấm biểu thị phạm vi toàn diện. “Bất cứ” truyền đạt sức khái quát ấy; “mỡ” giữ thuật ngữ nhất quán với ngữ cảnh tế lễ của chương.
- source_word: וְכָל דָּם
  choice: hay huyết nào
  rationale: Cấu trúc “bất cứ… hay… nào” diễn đạt tự nhiên một lệnh cấm bao trùm cả hai đối tượng. “Huyết” là từ trang trọng, quen thuộc trong văn cảnh Kinh Thánh và tế lễ.
- source_word: לֹא תֹאכֵלוּ
  choice: anh em không được ăn
  rationale: Phủ định với động từ vị hoàn thành trong văn luật mang lực cấm. “Không được” thể hiện rõ lệnh cấm bằng tiếng Việt hiện đại.
theological_decisions:
- issue: Thời hạn của quy định được biểu thị bởi עוֹלָם
  choice: quy định lâu dài
  alternative: quy định đời đời; quy định vĩnh viễn
  rationale: Cụm pháp lý Hê-bơ-rơ nhấn mạnh hiệu lực bền vững xuyên suốt các thế hệ và nơi cư trú. “Lâu dài” bảo tồn lực nghĩa này nhưng không tự ý giải quyết câu hỏi liệu từ ngữ có hàm ý vô tận theo nghĩa tuyệt đối hay không.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh em” cho ngôi thứ hai số nhiều, “quy định” cho sắc thái pháp luật, và “huyết” để phù hợp văn cảnh tế lễ. Dấu hai chấm giữ quan hệ giữa công thức quy định và nội dung lệnh cấm.
