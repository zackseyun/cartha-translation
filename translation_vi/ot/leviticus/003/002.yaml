source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וּ/שְׁחָט֕/וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: vi
  text: Người ấy phải đặt tay mình trên đầu lễ vật rồi giết nó tại lối vào Lều Hội Kiến[a]. Các con trai A-rôn, các thầy tế lễ, phải hắt huyết vào các phía chung quanh bàn thờ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại cửa Lều Hội Kiến.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “phải tạt huyết vào khắp các phía của bàn thờ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: phải đặt tay mình
  rationale: סמך trong nghi thức hiến tế chỉ việc đặt hoặc tì tay lên con vật; “đặt tay” tự nhiên, trang trọng và không diễn giải quá mức về lực ấn. Đại từ sở hữu giữ dạng số ít của nguyên văn.
- source_word: עַל רֹאשׁ קָרְבָּנוֹ
  choice: trên đầu lễ vật
  rationale: Giữ hình ảnh cụ thể của רֹאשׁ và nghĩa rộng của קָרְבָּן là vật được dâng, không thu hẹp thành một loại tế lễ riêng.
- source_word: וּשְׁחָטוֹ
  choice: rồi giết nó
  rationale: שׁחט là giết con vật theo nghi thức hiến tế. “Giết” rõ ràng và tự nhiên trong tiếng Việt; ngữ cảnh đã xác định đây là hành động tế lễ.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: פֶּתַח có thể là lối vào hoặc cửa; “lối vào” phù hợp ngữ cảnh không gian. “Lều Hội Kiến” là cách gọi trang trọng, quen thuộc cho אֹהֶל מוֹעֵד.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: Các con trai A-rôn là những thầy tế lễ
  rationale: 'Thể hiện quan hệ đồng vị: các con trai A-rôn được xác định là những thầy tế lễ, đồng thời giữ cả yếu tố gia tộc lẫn chức vụ.'
- source_word: וְזָרְקוּ ... אֶת הַדָּם
  choice: phải hắt huyết
  rationale: זרק diễn tả việc ném hoặc hắt huyết vào bàn thờ, không phải động tác rảy bằng các giọt nhỏ. “Hắt” vừa tự nhiên vừa giữ hướng chuyển động của nghi thức.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: lên quanh bàn thờ
  rationale: עַל với זרק chỉ việc huyết được hắt lên bề mặt bàn thờ; סָבִיב cho biết hành động được thực hiện quanh các phía của bàn thờ.
theological_decisions:
- issue: Cách mô tả nghi thức áp dụng huyết
  choice: hắt huyết lên quanh bàn thờ
  alternative: rảy huyết trên bàn thờ chung quanh
  rationale: “Hắt” phản ánh זרק chính xác hơn “rảy”, tránh nhập một thao tác nghi lễ khác; “quanh bàn thờ” bảo toàn phạm vi do סָבִיב diễn tả mà không thêm chi tiết không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyết” thay vì “máu” để giữ sắc thái nghi lễ; “thầy tế lễ” phân biệt chức vụ tư tế với người chủ lễ trong cách dùng hiện đại. Mọi dấu chú thích đều xuất hiện trong chính văn.
