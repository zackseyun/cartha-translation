  source_fidelity: 'Bản dịch bảo toàn các thành tố chính của tiếng Hê-bơ-rơ: một tay của người dâng được đặt trên đầu lễ vật, lễ vật bị giết tại lối vào Lều Hội Kiến, và các con trai A-rôn là các thầy tế lễ thực hiện việc hắt huyết. Tuy nhiên, cụm “hắt huyết lên quanh bàn thờ” chưa diễn đạt rõ quan hệ của זרק với bàn thờ và phạm vi סָבִיב.'
  naturalness: Văn phong nhìn chung hiện đại, trang trọng. Cụm “Các con trai A-rôn là những thầy tế lễ phải” cần dấu phẩy để biểu thị đúng quan hệ đồng vị. “Hắt huyết vào các phía chung quanh bàn thờ” tự nhiên và rõ nghĩa hơn “hắt huyết lên quanh bàn thờ”.
  terminology: “Lễ vật,” “Lều Hội Kiến,” “thầy tế lễ,” và “huyết” phù hợp văn cảnh nghi lễ. “Hắt” phản ánh זרק tốt hơn “rảy” trong câu này và không áp đặt một thao tác nghi lễ khác.
  issues:
  - severity: medium
    issue: Cụm “hắt huyết lên quanh bàn thờ” không rõ quan hệ hướng tác động của huyết đối với bàn thờ.
    rationale: זרק diễn tả việc ném/hắt huyết vào hoặc trên bàn thờ; סָבִיב chỉ các phía chung quanh. “Lên quanh” có thể gợi hành động hắt lên khu vực quanh bàn thờ, thay vì hắt vào bàn thờ ở mọi phía.
  - severity: low
    issue: Quan hệ đồng vị trong “Các con trai A-rôn là những thầy tế lễ phải” chưa được đánh dấu rõ.
    rationale: הַכֹּהֲנִים là thành phần đồng vị với “các con trai A-rôn.” Dấu phẩy giúp tiếng Việt biểu thị rõ đây là sự xác định, không phải một mệnh đề hạn định.
