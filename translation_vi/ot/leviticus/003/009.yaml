source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: vi
  text: 'Từ sinh tế bình an[a], người ấy phải dâng làm lễ vật dùng lửa cho Yahweh: phần mỡ của nó, tức toàn bộ đuôi mỡ[b]—người ấy phải lấy nó ra gần cột sống[c]—phần mỡ phủ nội tạng và toàn bộ phần mỡ trên nội tạng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sinh tế thông công” hoặc “sinh tế cầu an”.
    reason: lexical_alternative
  - marker: b
    text: Đây là chiếc đuôi lớn tích nhiều mỡ của giống cừu đuôi mỡ được dùng làm sinh tế.
    reason: cultural_note
  - marker: c
    text: Cũng có thể hiểu là “đối diện cột sống” hoặc “ở gốc cột sống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sinh tế bình an
  rationale: Giữ thuật ngữ tế lễ truyền thống và sắc thái bình an, an lành của שְׁלָמִים; chú thích nêu các cách hiểu gần nghĩa khác.
- source_word: אִשֶּׁה
  choice: lễ vật dùng lửa dâng
  rationale: Diễn đạt rõ đây là lễ vật được trình dâng bằng lửa trên bàn thờ, đồng thời tránh hàm ý thức ăn thông thường.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Chuyển trực tiếp danh giao ước יהוה bằng dạng phiên âm Yahweh.
- source_word: חֶלְבּוֹ
  choice: phần mỡ của nó
  rationale: Chỉ phần mỡ của con vật được dành riêng cho nghi thức tế lễ.
- source_word: הָאַלְיָה תְמִימָה
  choice: nguyên cả cái đuôi mỡ
  rationale: אַלְיָה là chiếc đuôi lớn tích mỡ của giống cừu đuôi mỡ; תְמִימָה nhấn mạnh phải lấy nguyên vẹn, toàn bộ.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: sát xương sống
  rationale: Diễn đạt tự nhiên vị trí cắt bỏ chiếc đuôi trong tương quan với xương sống; nguyên ngữ cho phép một số cách xác định vị trí gần nghĩa.
- source_word: יְסִירֶנָּה
  choice: người ấy phải cắt bỏ
  rationale: Động từ Hiphil của סור có nghĩa làm cho rời đi, lấy bỏ; trong thao tác giải phẫu tế lễ, 'cắt bỏ' truyền đạt hành động cụ thể tự nhiên hơn.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: phần mỡ phủ nội tạng
  rationale: קֶרֶב trong ngữ cảnh giải phẫu tế lễ chỉ các bộ phận bên trong; 'nội tạng' rõ ràng và phù hợp tiếng Việt hiện đại.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: tất cả phần mỡ trên nội tạng
  rationale: Giữ sự phân biệt của nguyên văn giữa lớp mỡ phủ nội tạng và toàn bộ mỡ nằm trên nội tạng.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm 'Yahweh' bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của זֶבַח הַשְּׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công; sinh tế cầu an
  rationale: שְׁלָמִים có trường nghĩa gồm bình an, an lành và sự thông công. Bản dịch chính giữ thuật ngữ quen thuộc nhưng chú thích bảo tồn các sắc thái khả hữu, không đồng nhất lễ này với chỉ một cách giải thích thần học.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu chủ động và thuật ngữ tế lễ nhất quán. Cụm chen giữa bằng gạch ngang giúp giữ quan hệ cú pháp của nguyên văn mà câu tiếng Việt vẫn dễ theo dõi. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
