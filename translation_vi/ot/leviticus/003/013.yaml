translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Bản dịch giữ thuật ngữ tế tự “huyết” và danh xưng “Lều Hội Kiến”, đồng thời tránh dùng “rảy” vì từ đó có thể làm mờ sự khác biệt giữa các động từ nghi lễ trong nguyên văn.
