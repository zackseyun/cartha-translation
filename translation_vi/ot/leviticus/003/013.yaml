base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: vi
  text: Người ấy phải đặt tay mình trên đầu con vật rồi giết nó trước Lều Hội Kiến. Các con trai A-rôn phải tạt huyết nó lên bàn thờ, chung quanh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hắt huyết nó lên bàn thờ, chung quanh.” Động từ Hê-bơ-rơ chỉ việc tạt huyết nhằm vào bàn thờ và có thể được dịch là “tạt” hoặc “hắt”; không nhất thiết mang nghĩa rảy nhẹ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  choice: phải đặt tay mình
  rationale: Giữ rõ danh từ số ít “tay” như tiếng Hê-bơ-rơ. “Đặt tay” là cách diễn đạt tự nhiên trong tiếng Việt và phù hợp với hành động nghi lễ; động từ cũng có thể hàm ý ấn hoặc tựa tay lên.
- source_word: עַל רֹאשׁוֹ
  choice: trên đầu con vật
  rationale: Đại từ tiếp vĩ ngữ chỉ con vật hiến tế. Nêu “con vật” giúp tiếng Việt rõ nghĩa mà không thêm một đối tượng mới.
- source_word: וְשָׁחַט אֹתוֹ
  choice: rồi giết nó
  rationale: שׁחט chỉ hành động giết con vật, đặc biệt trong bối cảnh hiến tế. “Giết” là từ trang trọng vừa đủ và dễ hiểu; ngữ cảnh đã làm rõ đây là việc giết tế lễ.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: trước Lều Hội Kiến
  rationale: “Trước” giữ ý nghĩa không gian của לִפְנֵי; “Lều Hội Kiến” là tên gọi trang trọng, dễ hiểu cho địa điểm thánh.
- source_word: וְזָרְקוּ
  choice: phải tạt
  rationale: Trong nghi thức tế lễ, זרק diễn tả việc đưa huyết mạnh về phía hoặc lên bàn thờ. “Tạt” thể hiện động tác này và tránh đồng nhất với động tác rảy nhẹ thường gắn với các động từ Hê-bơ-rơ khác.
- source_word: בְּנֵי אַהֲרֹן
  choice: các con trai A-rôn
  rationale: Giữ nguyên cách gọi mang tính gia tộc và chức vụ tư tế trong cấu trúc Hê-bơ-rơ.
- source_word: אֶת דָּמוֹ
  choice: huyết nó
  rationale: “Huyết” phù hợp với văn phong nghi lễ và tế tự; “nó” giữ rõ huyết thuộc về con vật vừa bị giết.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: vào các phía chung quanh bàn thờ
  rationale: Cụm từ diễn tả việc huyết được tạt về phía bàn thờ ở chung quanh, không chỉ đặt yên trên mặt bàn thờ. Cách dịch này giữ được lực phân bố của סָבִיב.
