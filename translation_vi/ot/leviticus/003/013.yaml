  to: Người ấy phải đặt tay mình trên đầu con vật rồi giết nó trước Lều Hội Kiến. Các con trai A-rôn phải tạt huyết nó lên bàn thờ, chung quanh.[a]
  rationale: Điều chỉnh duy nhất là chuyển “chung quanh” để bổ nghĩa cho việc tạt huyết lên bàn thờ, sát hơn với cấu trúc nguyên ngữ và tránh hàm ý tạt huyết vào vùng đất hoặc các phía ngoài bàn thờ. Dấu phẩy giữ ý rằng huyết được tạt quanh bàn thờ, không chỉ trên một điểm.
