source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: vi
  text: Hãy đem kẻ đã nguyền rủa ra ngoài trại[a]. Tất cả những người đã nghe phải đặt tay trên đầu người ấy[b], rồi toàn thể hội chúng phải ném đá người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kẻ phạm thượng” hoặc “người đã phạm thượng”. Tiếng Hê-bơ-rơ theo nghĩa đen chỉ “kẻ đã nguyền rủa”.
    reason: alternative_reading
  - marker: b
    text: Việc đặt tay ở đây có lẽ đánh dấu sự xác nhận chính thức của các nhân chứng về người phạm tội; tuy nhiên, một số người cũng hiểu hành động này mang ý nghĩa biểu tượng.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: Hãy đem ... ra
  rationale: Thể sai khiến mệnh lệnh của יצא có nghĩa là khiến một người đi ra; cách diễn đạt này tự nhiên trong tiếng Việt và kết hợp rõ với địa điểm “ngoài trại”.
- source_word: הַמְקַלֵּל
  choice: kẻ đã nguyền rủa
  rationale: Phân từ của קלל chỉ người phạm tội cụ thể trong văn cảnh. “Đã nguyền rủa” giữ sát nghĩa từ vựng, không đưa cách hiểu diễn giải “phạm thượng” vào chính văn.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Cụm từ chỉ không gian được chuyển sang cách nói tự nhiên trong tiếng Việt, vẫn giữ bối cảnh loại người phạm tội khỏi khu vực cộng đồng.
- source_word: וְסָמְכוּ ... אֶת יְדֵיהֶם
  choice: phải đặt tay
  rationale: סמך với tay đặt trên đầu là hành động đặt tay. Tiếng Việt dùng số ít “tay” theo lối khái quát tự nhiên dù tiếng Hê-bơ-rơ dùng dạng số nhiều.
- source_word: כָל הַשֹּׁמְעִים
  choice: tất cả những người đã nghe
  rationale: Giữ nguyên việc câu Hê-bơ-rơ không nêu rõ tân ngữ của “nghe”, nhờ đó tránh bổ sung “người ấy” hoặc lời nguyền vào chính văn.
- source_word: עַל רֹאשׁוֹ
  choice: trên đầu người ấy
  rationale: Chuyển sát nghĩa đại từ giống đực số ít bằng cách gọi trung tính, trang trọng và rõ ràng trong tiếng Việt.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: phải ném đá người ấy
  rationale: רגם là động từ tiêu chuẩn chỉ việc xử tử bằng cách ném đá; cách dịch này chính xác và dễ hiểu.
- source_word: כָל הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng giao ước được tập hợp; “hội chúng” giữ sắc thái cộng đồng chính thức, còn “toàn thể” diễn đạt כָל tự nhiên.
theological_decisions:
- issue: Gọi người phạm tội là người “nguyền rủa” hay người “phạm thượng”
  choice: kẻ đã nguyền rủa
  alternative: kẻ phạm thượng / người đã phạm thượng
  rationale: Từ Hê-bơ-rơ trực tiếp là phân từ của קלל, “nguyền rủa”. Văn cảnh cho thấy đối tượng là Danh Đức Chúa Trời, nhưng chính văn giữ nghĩa từ vựng, còn cách hiểu “phạm thượng” được nêu trong chú thích.
- issue: Ý nghĩa của hành động đặt tay
  choice: Giữ nguyên hành động theo nghĩa đen trong chính văn
  alternative: Giải thích là việc các nhân chứng chính thức xác nhận người phạm tội hoặc là hành động mang ý nghĩa biểu tượng
  rationale: Câu này truyền lệnh thực hiện hành động nhưng không tự giải thích ý nghĩa của nó; vì vậy bản dịch không quyết định thay cho độc giả giữa các cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hội chúng” để giữ sắc thái cộng đồng chính thức; dùng “người ấy” thay đại từ giới tính nhằm tránh lặp từ thô cứng. Các mệnh lệnh nối tiếp được diễn đạt bằng “hãy”, “phải” và “rồi” để rõ quan hệ tuần tự trong tiếng Việt.
