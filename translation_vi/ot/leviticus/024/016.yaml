  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và nội dung của nguyên văn: động từ נָקַב trong ngữ cảnh pháp luật được chuyển là “xúc phạm” mà không đồng nhất với việc chỉ đơn thuần đọc danh; mệnh thức bị động của án tử hình được giữ; mệnh lệnh cộng đồng ném đá và sự áp dụng bình đẳng cho ngoại kiều lẫn người bản xứ đều được bảo toàn. Sự nhấn mạnh của מוֹת יוּמָת và רָגוֹם יִרְגְּמוּ được diễn đạt thích đáng bằng “chắc chắn phải” và “nhất định phải.”'
  naturalness: Văn bản tự nhiên, trang trọng và phù hợp với văn phong pháp lý Kinh Thánh tiếng Việt hiện đại. “Toàn thể hội chúng,” “người ngoại kiều,” và “người bản xứ” rõ nghĩa và giữ được các đối ứng của tiếng Hê-bơ-rơ. Cấu trúc “Dù là ... hay ...” diễn đạt rõ tính áp dụng cho cả hai nhóm.
  terminology: “Yahweh” nhất quán với quyết định thuật ngữ đã nêu. “Danh” viết hoa ở lần xuất hiện độc lập là lựa chọn kính cẩn có chú thích giải thích, không làm mất nghĩa gốc. “Xúc phạm” là cách chuyển phù hợp cho ý phạm thượng trong ngữ cảnh, đồng thời chú thích a bảo lưu đầy đủ các khả năng từ vựng đang được tranh luận.
