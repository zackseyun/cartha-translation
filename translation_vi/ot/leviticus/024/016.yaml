id: LEV.24.16
reference: Leviticus 24:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: vi
  text: Ai xúc phạm danh Yahweh[a] thì chắc chắn phải bị xử tử; toàn thể hội chúng nhất định phải ném đá người ấy. Dù là người ngoại kiều hay người bản xứ, khi xúc phạm Danh[b], người ấy phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phát âm danh Yahweh”, “gọi đích danh Yahweh” hoặc “nguyền rủa danh Yahweh”. Trong ngữ cảnh này, động từ Hê-bơ-rơ có thể chỉ việc phát âm rõ hay việc phỉ báng, xúc phạm.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “Danh”; ở đây từ này đứng độc lập như một cách gọi kính cẩn thay cho danh của Đức Chúa Trời.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: xúc phạm
  rationale: Động từ נקב có thể mang nghĩa gọi đích danh, phát âm rõ hoặc nguyền rủa. Trong điều luật này, “xúc phạm” diễn đạt tự nhiên hành vi phạm thượng đối với danh Đức Chúa Trời mà không mặc nhiên cho rằng chỉ phát âm danh ấy đã là tội; các khả năng từ vựng khác được giữ trong chú thích.
- source_word: שֵׁם יְהוָה
  choice: danh Yahweh
  rationale: שֵׁם là “danh/tên”, còn יהוה là danh giao ước Yahweh. “Danh” phù hợp với văn phong trang trọng và với ngữ cảnh nói về danh thần thánh.
- source_word: מוֹת יוּמָת
  choice: chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn và bắt buộc của án tử hình; thể bị động pháp lý được bảo toàn.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: nhất định phải ném đá người ấy
  rationale: Cấu trúc lặp gốc động từ mang sắc thái nhấn mạnh. “Nhất định phải” truyền đạt cả sự nhấn mạnh lẫn tính bắt buộc pháp lý.
- source_word: כָּל הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng giao ước được triệu tập; “hội chúng” giữ sắc thái cộng đồng và pháp lý.
- source_word: כַּגֵּר
  choice: người ngoại kiều
  rationale: גֵּר là người không thuộc dân bản địa nhưng cư trú giữa Israel. “Người ngoại kiều” rõ nghĩa trong tiếng Việt hiện đại và tạo thế đối xứng với “người bản xứ”.
- source_word: כָּאֶזְרָח
  choice: người bản xứ
  rationale: אֶזְרָח chỉ người bản địa của xứ hoặc cộng đồng, đối lập với גֵּר.
- source_word: בְּנָקְבוֹ שֵׁם
  choice: khi xúc phạm Danh
  rationale: 'בְּ với nguyên mẫu liên kết mang nghĩa thời gian hoặc hoàn cảnh: “khi”. “Danh” đứng độc lập nên được viết hoa như cách gọi kính cẩn thay cho danh Đức Chúa Trời.'
- source_word: יוּמָת
  choice: phải bị xử tử
  rationale: Giữ thể bị động và sắc thái phán quyết pháp lý của động từ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng Tứ Tự Danh. “Yahweh” bảo toàn danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- issue: Nghĩa của נקב khi đi với danh Đức Chúa Trời
  choice: xúc phạm
  alternative: phát âm; gọi đích danh; nguyền rủa
  rationale: Ngữ cảnh hình luật cho thấy đây là việc sử dụng danh thánh theo cách phạm thượng. “Xúc phạm” truyền đạt điều đó mà không giải quyết dứt khoát sự nhập nhằng từ vựng; các cách hiểu khác được nêu trong chú thích.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Các cụm “chắc chắn phải” và “nhất định phải” phản ánh hai cấu trúc nhấn mạnh trong tiếng Hê-bơ-rơ. Dùng “Yahweh” cho יהוה; viết hoa “Danh” khi từ này đứng độc lập như cách gọi kính cẩn.
