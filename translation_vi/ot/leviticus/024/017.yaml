source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: vi
  text: Còn nếu một người đàn ông đánh chết[a] bất cứ người nào[b], thì người ấy chắc chắn phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn là “đánh”; trong ngữ cảnh này, đó là cú đánh gây chết người. Cũng có thể dịch: “giết”.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát tiếng Hê-bơ-rơ: “bất cứ mạng sống nào của con người”. Cụm này chỉ một con người hay mạng người, không nói riêng về một “linh hồn” phi vật chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: Còn nếu một người đàn ông
  rationale: וְ nối điều luật này với văn mạch trước; כִּי mở đầu mệnh đề điều kiện; אִישׁ là danh từ giống đực số ít nên được thể hiện là “một người đàn ông” thay vì trung hòa thành “bất cứ ai”.
- source_word: יַכֶּה
  choice: đánh chết
  rationale: Động từ Hiphil của נכה có nghĩa cơ bản là “đánh”, nhưng đối tượng và công thức án tử phía sau cho thấy đây là cú đánh gây chết người. “Đánh chết” vừa giữ hình ảnh cụ thể vừa truyền đạt kết quả致命.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: bất cứ người nào
  rationale: Trong ngữ cảnh này, נֶפֶשׁ אָדָם chỉ một con người hay mạng người, không phải một “linh hồn” phi vật chất. Cách dịch này tự nhiên trong tiếng Việt và không giới hạn nạn nhân ở nam giới.
- source_word: מוֹת יוּמָת
  choice: chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ thụ động nhấn mạnh tính chắc chắn của hình phạt. “Phải bị xử tử” giữ ý pháp lý và thể thụ động của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Ý nghĩa của נֶפֶשׁ trong cụm נֶפֶשׁ אָדָם
  choice: người
  alternative: mạng người; linh hồn người
  rationale: Ở đây từ này chỉ chính con người sống bị giết, chứ không xác định một quan niệm về linh hồn phi vật chất.
- issue: Phạm vi của אָדָם
  choice: người nào
  alternative: người đàn ông nào
  rationale: אָדָם mang nghĩa loài người nói chung trong cụm này, nên không hàm ý rằng chỉ nạn nhân nam mới được luật bảo vệ.
- issue: Giữ giống đực của אִישׁ
  choice: một người đàn ông
  alternative: bất cứ ai; một người
  rationale: Nguyên văn dùng danh từ giống đực số ít אִישׁ; bản dịch giữ hình thức này mà không suy diễn thêm về phạm vi áp dụng của điều luật.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. “Còn nếu” duy trì liên kết với điều luật trước; “chắc chắn phải bị xử tử” chuyển tải sự nhấn mạnh của công thức án phạt mà vẫn tự nhiên, rõ nghĩa đối với độc giả phổ thông.
