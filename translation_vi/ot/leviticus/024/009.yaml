base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: vi
  text: Bánh ấy sẽ thuộc về A-rôn và các con trai ông; họ phải ăn bánh ấy tại một nơi thánh, vì đó là phần chí thánh dành cho ông, lấy từ các lễ vật dâng bằng lửa[a] cho Đức Giê-hô-va. Đây là một quy định vĩnh viễn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các lễ vật làm thức ăn dâng cho Đức Giê-hô-va.” Từ Hê-bơ-rơ theo truyền thống chỉ các lễ vật được dâng bằng lửa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: sẽ thuộc về
  rationale: Động từ היה đi với לְ chỉ quyền sở hữu hay phần được phân cho, chứ không đơn thuần có nghĩa là “sẽ là”.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: về A-rôn và các con trai ông
  rationale: Giữ đúng đối tượng nam giới cụ thể trong dòng tư tế; לְ diễn tả phần được phân cho họ.
- source_word: וַאֲכָלֻהוּ
  choice: họ phải ăn bánh ấy
  rationale: Trong văn cảnh luật lệ, hình thái động từ mang sắc thái quy định; “phải ăn” diễn đạt tự nhiên nghĩa vụ này.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: tại một nơi thánh
  rationale: Danh từ và tính từ không có mạo từ xác định; cách dịch này không thu hẹp nghĩa thành một gian cụ thể của nơi thánh.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: phần chí thánh
  rationale: Thành ngữ tăng cấp Hê-bơ-rơ chỉ mức thánh cao nhất; thêm “phần” giúp câu tiếng Việt tự nhiên và phù hợp với vật được phân cho tư tế.
- source_word: הוּא לוֹ
  choice: đó là phần chí thánh dành cho ông
  rationale: Giữ đại từ số ít לֹו, quy về A-rôn như người đứng đầu đại diện cho dòng tư tế, thay vì âm thầm đổi thành số nhiều.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: lấy từ các lễ vật dâng bằng lửa lên Đức Giê-hô-va
  rationale: אִשֶּׁה truyền thống chỉ lễ vật được dâng qua lửa. Cách dịch này giữ hình ảnh nghi lễ của từ nguồn mà không hàm ý Đức Chúa Trời ăn lễ vật.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc, trang trọng trong tiếng Việt để thể hiện Danh giao ước יהוה, thay vì thay bằng một tước hiệu.
- source_word: חָק עוֹלָם
  choice: một quy định vĩnh viễn
  rationale: Diễn đạt tự nhiên tính lâu dài, bền vững của điều luật mà không dùng lối nói cổ.
theological_decisions:
- issue: Sở chỉ của đại từ số ít לֹו sau khi nhắc đến A-rôn và các con trai ông
  choice: 'Giữ số ít: “dành cho ông,” quy về A-rôn'
  alternative: Đổi theo nghĩa tập thể thành “dành cho họ”
  rationale: Bản Hê-bơ-rơ dùng số ít. Giữ nguyên số này bảo tồn cấu trúc trong đó A-rôn đại diện cho hàng tư tế, thay vì làm phẳng sự căng thẳng ngữ pháp.
- issue: Nghĩa của אִשֵּׁי trong ngôn ngữ tế lễ
  choice: “các lễ vật dâng bằng lửa”
  alternative: “các lễ vật làm thức ăn”
  rationale: Từ có liên hệ truyền thống với việc dâng qua lửa; bản dịch chính giữ nét nghĩa nghi lễ trực tiếp và ghi chú khả năng dịch khác.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “bánh ấy” để nêu rõ sở chỉ từ ngữ cảnh về bánh trưng bày; giữ “các con trai” vì đây là những hậu duệ nam phục vụ chức tư tế. Dấu chú thích [a] đặt ngay sau cụm từ được giải thích.
