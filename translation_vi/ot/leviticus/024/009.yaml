revisions:
- from: Bánh ấy sẽ thuộc về A-rôn và các con trai ông; họ phải ăn bánh ấy tại một nơi thánh, vì đó là phần chí thánh dành cho ông, lấy từ các lễ vật dâng bằng lửa lên Đức Giê-hô-va,[a] theo một quy định vĩnh viễn.
  to: Bánh ấy sẽ thuộc về A-rôn và các con trai ông; họ phải ăn bánh ấy tại một nơi thánh, vì đó là phần chí thánh dành cho ông, lấy từ các lễ vật dâng bằng lửa[a] cho Đức Giê-hô-va. Đây là một quy định vĩnh viễn.
  rationale: Bản sửa chỉ làm rõ chức năng của «một quy định vĩnh viễn» như lời xác quyết pháp lý và chỉnh cú pháp chú thích. Các yếu tố ngữ nghĩa chính, gồm số ít «ông» và tính mơ hồ có kiểm soát của thuật ngữ tế lễ, được giữ nguyên.
