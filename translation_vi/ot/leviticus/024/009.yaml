    issue: «theo một quy định vĩnh viễn» làm thay đổi quan hệ cú pháp của חָק עוֹלָם.
    rationale: Cụm Hê-bơ-rơ là một xác quyết pháp lý độc lập, «một quy định vĩnh viễn», không nói rằng việc ăn hoặc việc phân phần được thực hiện «theo» một quy định. Tách câu tránh thêm sắc thái phương thức.
  - severity: low
