base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: vi
  text: Nếu một người gây thương tật cho người cùng cộng đồng mình[a], thì người ta cũng sẽ làm cho người ấy đúng như điều người ấy đã làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “gây một khuyết tật/tì vết cho người cùng cộng đồng mình”; cũng có thể dịch là “người lân cận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Nếu một người
  rationale: Trong thể luật nêu trường hợp, כִּי mang nghĩa điều kiện; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ ở đầu câu.
- source_word: יִתֵּן מוּם
  choice: gây thương tật
  rationale: Cụm này có nghĩa đen là “gây/đặt một khuyết tật”; trong ngữ cảnh tổn hại thân thể, “gây thương tật” vừa tự nhiên vừa giữ sắc thái pháp lý và hậu quả thể chất.
- source_word: בַּעֲמִיתוֹ
  choice: cho người đồng loại
  rationale: עָמִית chỉ người cùng cộng đồng, người đồng loại hay người lân cận. “Người đồng loại” giữ được quan hệ ngang hàng mà không thu hẹp thành người ở gần nhà.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: đã làm thế nào
  rationale: Giữ cấu trúc so sánh và nhấn mạnh sự tương xứng giữa hành vi với hình phạt.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: thì cũng sẽ bị đối xử như vậy
  rationale: Dạng Niphal được diễn đạt bằng thể bị động, giữ tính phi cá nhân của việc thi hành phán quyết và tránh hàm ý trả thù riêng.
theological_decisions:
- issue: Nguyên tắc báo ứng tương xứng trong bối cảnh luật pháp
  choice: 'Diễn đạt như một nguyên tắc xét xử tương xứng: người gây thương tật sẽ bị đối xử tương ứng với điều mình đã làm.'
  alternative: Diễn đạt như mệnh lệnh cho cá nhân tự mình trả đũa.
  rationale: Câu Hê-bơ-rơ dùng thể bị động, nêu chuẩn mực pháp lý mà không xác định cá nhân thực hiện; vì vậy không nên thêm ý trả thù riêng.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Gây thương tật” rõ nghĩa hơn cách dịch sát chữ “gây một khuyết tật,” còn cấu trúc bị động ở vế sau bảo toàn tính chất tư pháp của nguyên văn.
