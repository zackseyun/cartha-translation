revisions:
- from: Nếu một người gây thương tật cho người đồng loại[a], người ấy đã làm thế nào thì cũng sẽ bị đối xử như vậy.
  to: Nếu một người gây thương tật cho người cùng cộng đồng mình[a], thì người ta cũng sẽ làm cho người ấy đúng như điều người ấy đã làm.
  rationale: Bản sửa giữ nguyên điều kiện pháp lý, tổn hại thân thể và sự báo ứng tương xứng của nguyên văn. “Người ta cũng sẽ làm cho người ấy” tái tạo thể bị động phi cá nhân mà không quy hành động cho sự trả thù cá nhân. Chú thích được đặt ngay sau từ ngữ tương ứng với עֲמִיתוֹ và nêu nghĩa đen của cụm יִתֵּן מוּם mà không làm câu chính kém tự nhiên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc điều kiện và nguyên tắc tương ứng của tiếng Hê-bơ-rơ. Tuy nhiên, “bị đối xử như vậy” khái quát hơn động từ bị động יֵעָשֶׂה לּוֹ (“sẽ được làm cho người ấy / sẽ bị làm như vậy”), nên làm mờ sự tương ứng trực tiếp của hành vi pháp lý.
  naturalness: “Người đồng loại” có thể hiểu là người cùng loài và không tự nhiên trong tiếng Việt hiện đại ở ngữ cảnh luật lệ. “Người cùng cộng đồng mình” rõ và tự nhiên hơn. Cách diễn đạt bị động phi cá nhân ở vế sau được duy trì bằng “người ta cũng sẽ làm cho người ấy...”.
  terminology: “Gây thương tật” là cách dịch phù hợp trong ngữ cảnh tổn hại thân thể cho יִתֵּן מוּם, đồng thời chú thích giữ nghĩa đen “khuyết tật/tì vết.” “Người cùng cộng đồng mình” diễn đạt tốt עֲמִיתוֹ mà không áp đặt nghĩa “người lân cận” là lựa chọn duy nhất.
  issues:
  - severity: medium
    issue: “bị đối xử như vậy” làm yếu động từ “được làm cho người ấy”
    rationale: יֵעָשֶׂה לּוֹ dùng bị động của “làm,” nhấn mạnh điều đã làm sẽ được làm lại cho người gây hại. “Đối xử” là diễn giải rộng hơn và có thể không còn gợi hành vi tương ứng.
  - severity: low
    issue: “người đồng loại” không tự nhiên và dễ mơ hồ
    rationale: Trong tiếng Việt hiện đại, cụm này thường chỉ các cá thể cùng loài hơn là một người cùng cộng đồng. Cần một cách gọi rõ quan hệ xã hội/cộng đồng của עָמִית.
  revised_text: Nếu một người gây thương tật cho người cùng cộng đồng mình[a], thì người ta cũng sẽ làm cho người ấy đúng như điều người ấy đã làm.
