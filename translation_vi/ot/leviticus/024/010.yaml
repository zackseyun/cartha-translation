revisions:
- from: Người con trai của một phụ nữ Israel—anh là con của một người Ai Cập—đi ra giữa con dân Israel[a]. Trong trại, người con trai của phụ nữ Israel ấy đánh nhau với một người đàn ông Israel[b].
  to: Một người con trai của một phụ nữ Israel—cha anh là một người đàn ông Ai Cập—đi ra giữa con dân Israel[a]. Trong trại, người con trai của phụ nữ Israel ấy đánh nhau với một người đàn ông Israel[b].
  rationale: Chỉ điều chỉnh cách diễn đạt về người cha để nêu rõ “người đàn ông Ai Cập,” tương ứng với אִישׁ. Đổi mệnh đề chen thành “cha anh là...” giúp câu tiếng Việt tự nhiên mà không thêm ý nghĩa. Các neo chú thích tiếp tục đặt đúng tại “con dân Israel” và “đánh nhau.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:16Z'
