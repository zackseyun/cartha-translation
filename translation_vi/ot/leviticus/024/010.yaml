  terminology: “con dân Israel” là cách gọi tự nhiên cho בְּנֵי יִשְׂרָאֵל trong văn phong trang trọng; chú thích bảo lưu hình thức sát chữ. “Trong trại” và “đánh nhau” phù hợp; chú thích cho phép đọc “cãi nhau” vẫn giữ được độ rộng nghĩa của נצה.
