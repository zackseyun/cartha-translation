id: LEV.24.10
reference: Leviticus 24:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ בֶּן אִשָּׁ֣ה יִשְׂרְאֵלִ֔ית וְ/הוּא֙ בֶּן אִ֣ישׁ מִצְרִ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּנָּצוּ֙ בַּֽ/מַּחֲנֶ֔ה בֶּ֚ן הַ/יִּשְׂרְאֵלִ֔ית וְ/אִ֖ישׁ הַ/יִּשְׂרְאֵלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: vi
  text: Một người con trai của một phụ nữ Israel—cha anh là một người đàn ông Ai Cập—đi ra giữa con dân Israel[a]. Trong trại, người con trai của phụ nữ Israel ấy đánh nhau với một người đàn ông Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “giữa các con trai Israel”; đây là danh xưng chỉ dân Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cãi nhau.” Động từ Hê-bơ-rơ có thể chỉ một cuộc tranh cãi hoặc đánh nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: đi ra
  rationale: Giữ chuyển động trần thuật của động từ יצא mà không suy đoán anh đi ra từ đâu.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: người con trai của một phụ nữ Israel
  rationale: Phản ánh chuỗi liên kết xác định người đàn ông theo dòng mẹ và giữ rõ giới tính nam của בֶּן trong ngữ cảnh này.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: anh là con của một người Ai Cập
  rationale: Giữ cấu trúc nêu thân thế bên cha, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt mà không thêm thông tin ngoài bản nguồn.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: giữa con dân Israel
  rationale: בְּתוֹךְ được dịch là “giữa”; “con dân Israel” diễn đạt tự nhiên danh xưng cộng đồng בְּנֵי יִשְׂרָאֵל trong tiếng Việt, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: וַיִּנָּצוּ
  choice: đánh nhau
  rationale: Dạng Niphal của נצה có thể chỉ tranh cãi hoặc giao đấu; “đánh nhau” phù hợp diễn tiến căng thẳng của câu chuyện nhưng chú thích vẫn bảo lưu khả năng “cãi nhau”.
- source_word: בַּמַּחֲנֶה
  choice: trong trại
  rationale: Cách dịch trực tiếp và tự nhiên cho địa điểm מַחֲנֶה.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: người con trai của phụ nữ Israel ấy
  rationale: Giữ sự lặp lại có chủ ý trong tiếng Hê-bơ-rơ và dùng “ấy” để chỉ lại người phụ nữ đã được nhắc đến.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: với một người đàn ông Israel
  rationale: Diễn đạt tự nhiên quan hệ giữa hai bên trong động từ số nhiều; “một” phù hợp vì אִישׁ không có mạo từ, còn “đàn ông Israel” giữ sự tương phản về căn tính.
theological_decisions:
- issue: Danh xưng dân tộc mang hình thức giống đực בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai Israel; dân Israel
  rationale: Trong câu này, cụm từ là danh xưng quy ước cho cộng đồng Israel chứ không nhất thiết chỉ riêng nam giới. “Con dân Israel” vừa tự nhiên, trang trọng trong tiếng Việt vừa giữ được phần nào hình ảnh quan hệ dòng dõi; chú thích nêu cách đọc sát chữ để không che khuất hình thức nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ mệnh đề chen về người cha mà vẫn giữ thứ tự thông tin của nguyên văn. Sự lặp lại “người con trai của phụ nữ Israel” được bảo lưu vì có chức năng nhận diện và nhấn mạnh trong câu.
