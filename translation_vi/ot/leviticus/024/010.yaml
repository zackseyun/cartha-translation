  source_fidelity: 'Bản dịch truyền đạt đúng mạch chính: người con có mẹ là người Israel và cha là người Ai Cập đi ra giữa cộng đồng Israel, rồi xung đột với một người Israel trong trại. Tuy nhiên, “một người Ai Cập” không biểu thị rõ yếu tố nam của אִישׁ מִצְרִי. Sửa thành “một người đàn ông Ai Cập” để phản ánh nguyên ngữ mà vẫn tự nhiên.'
