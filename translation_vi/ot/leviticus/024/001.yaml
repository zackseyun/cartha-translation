  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”. “Yahweh” là cách phục nguyên thường dùng; tiếng Việt cũng có dạng phiên âm “Gia-vê”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa lời kể tiến sang hành động kế tiếp; “Rồi” thể hiện trình tự tự nhiên, còn “phán” là cách dùng trang trọng và quen thuộc khi Đức Chúa Trời nói.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ đây là danh riêng của Đức Chúa Trời thay vì thay bằng tước hiệu; “Giê-hô-va” là dạng danh xưng đã phổ biến và dễ nhận biết trong tiếng Việt.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu tiếng Việt “phán với”, từ này diễn đạt tự nhiên hướng lời nói đến người nghe.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tiếng Việt thông dụng của tên riêng Hê-bơ-rơ מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Phân từ nguyên dạng này mở đầu lời nói trực tiếp. Trong tiếng Việt, dấu hai chấm thực hiện chức năng ấy tự nhiên hơn việc thêm “rằng” khi câu sau là lời trực tiếp.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản văn dùng trực tiếp Tứ Tự Danh. Bản dịch giữ một danh riêng, không thay bằng tước hiệu “CHÚA”; chú thích nêu dạng chữ Hê-bơ-rơ và cách phục nguyên thường gặp vì cách phát âm cổ không hoàn toàn chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và súc tích. Dùng “phán” cho lời Đức Chúa Trời và dùng dấu hai chấm để dẫn vào nội dung trực tiếp ở câu kế tiếp. Mọi dấu chú thích trong phần chú thích đều có ký hiệu tương ứng trong chính văn.
