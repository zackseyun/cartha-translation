source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: vi
  text: Bên ngoài bức màn của Chứng Ước[a], trong Lều Hội Kiến, A-rôn phải sắp đặt đèn ấy từ chiều đến sáng trước mặt Yahweh, thường xuyên.[b] Đây là một quy định vĩnh viễn[c] qua các thế hệ của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “màn che của Chứng Ước.”'
    reason: lexical_alternative
  - marker: b
    text: “Thường xuyên” ở đây chỉ việc nghi thức được tuân giữ đều đặn; câu này xác định thời gian thực hiện là từ chiều đến sáng.
    reason: cultural_note
  - marker: c
    text: 'Hoặc: “quy định đời đời” hoặc “quy định lâu dài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: Bên ngoài bức màn của Chứng Ước
  rationale: Giữ quan hệ sở hữu rộng của cụm Hê-bơ-rơ, không xác định quá mức bức màn che vật gì; “bức màn” tự nhiên và phù hợp với bối cảnh nơi thánh.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Cách gọi ngắn gọn, trang trọng và quen thuộc cho lều thánh là nơi Yahweh gặp dân Ngài.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: phải sắp đặt đèn ấy
  rationale: Động từ ערך diễn tả việc sắp đặt hoặc chuẩn bị theo đúng trật tự nghi lễ; “đèn ấy” nêu rõ vật được đại từ số ít chỉ về trong văn mạch câu trước.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: từ chiều tối đến sáng
  rationale: Truyền đạt trực tiếp khoảng thời gian được quy định trong nguyên văn.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ ý hiện diện phụng tự của לִפְנֵי và phiên âm trực tiếp danh riêng giao ước יהוה.
- source_word: תָּמִיד
  choice: cứ tiếp tục như vậy
  rationale: Diễn đạt sự tuân giữ đều đặn, liên tục của nghi lễ mà không mâu thuẫn với giới hạn cụ thể “từ chiều tối đến sáng”.
- source_word: חֻקַּת עוֹלָם
  choice: quy định trường tồn
  rationale: Diễn tả một quy định có hiệu lực bền lâu; tránh ép עוֹלָם vào một sắc thái thời gian duy nhất.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua mọi thế hệ của anh em
  rationale: Diễn đạt phạm vi áp dụng nối tiếp từ thế hệ này sang thế hệ khác bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm Yahweh bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của תָּמִיד trong nghi thức thắp đèn
  choice: cứ tiếp tục như vậy
  alternative: liên tục; thường xuyên
  rationale: Cách dịch này giữ ý nghi thức phải được duy trì đều đặn, đồng thời để cụm “từ chiều tối đến sáng” xác định thời gian thực hiện mỗi lần.
- issue: Phạm vi thời gian của חֻקַּת עוֹלָם
  choice: quy định trường tồn
  alternative: quy định đời đời; quy định vĩnh viễn
  rationale: “Trường tồn” giữ được sức nặng lâu bền của עוֹלָם mà không giải quyết thay cho văn bản câu hỏi thần học về phạm vi cuối cùng của quy định.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “A-rôn” theo lối phiên âm Kinh Thánh quen thuộc; giữ “Yahweh” là danh riêng. Câu bám sát trật tự Hê-bơ-rơ, đặt khoảng thời gian ngay sau hành động và giữ các sắc thái có thể hiểu khác nhau trong chú thích.
