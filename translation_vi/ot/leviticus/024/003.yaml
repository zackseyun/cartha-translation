revisions:
- from: Bên ngoài bức màn của Chứng Ước[a], trong Lều Hội Kiến, A-rôn phải sắp đặt đèn ấy từ chiều tối đến sáng trước mặt Yahweh, cứ tiếp tục như vậy.[b] Đây là quy định trường tồn[c] qua mọi thế hệ của anh em.
  to: Bên ngoài bức màn của Chứng Ước[a], trong Lều Hội Kiến, A-rôn phải sắp đặt đèn ấy từ chiều đến sáng trước mặt Yahweh, thường xuyên.[b] Đây là một quy định vĩnh viễn[c] qua các thế hệ của anh em.
  rationale: Sửa các chỗ chưa tự nhiên và có tính diễn giải trong tiếng Việt, nhưng giữ nguyên trình tự, phạm vi thời gian, danh riêng Yahweh, và tính mở của các thuật ngữ Hê-bơ-rơ. “Đèn ấy” vẫn hợp lý vì đại từ số ít trong câu này quy chiếu về ngọn đèn đã nêu ở câu trước.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:20Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp theo sát cấu trúc và các thành tố chính của tiếng Hê-bơ-rơ. Tuy nhiên, “cứ tiếp tục như vậy” diễn giải quá đầy đủ תָּמִיד và tạo cảm giác như một mệnh đề mới; “thường xuyên” bảo lưu tốt hơn sắc thái nghi thức được thực hiện đều đặn. “Quy định trường tồn” cũng kém tự nhiên trong tiếng Việt hiện đại.
  naturalness: Câu sửa vẫn trang trọng và dễ đọc, đồng thời đặt trạng ngữ thời gian sát hành động như nguyên văn. “Một quy định vĩnh viễn” là cách diễn đạt tự nhiên hơn “quy định trường tồn.”
  terminology: Giữ Yahweh và A-rôn. Giữ thuật ngữ kỹ thuật “Chứng Ước” theo bản nháp, không đồng nhất hóa nó với Hòm Giao Ước; chú thích nêu phương án “màn che” mà không giải quyết quá mức quan hệ cú pháp của cụm Hê-bơ-rơ.
  issues:
  - severity: medium
    issue: “cứ tiếp tục như vậy” dịch תָּמִיד quá diễn giải và không tự nhiên
    rationale: תָּמִיד là trạng từ chỉ tính liên tục/đều đặn của việc tuân giữ nghi thức. Cụm hiện tại thêm “như vậy”, không có tương ứng trực tiếp trong nguyên văn, và dễ khiến độc giả hiểu là một chỉ dẫn độc lập.
  - severity: low
    issue: “quy định trường tồn” không phải cách kết hợp tự nhiên trong tiếng Việt hiện đại
    rationale: Cụm חֻקַּת עוֹלָם chỉ một quy định có hiệu lực lâu dài. “Một quy định vĩnh viễn” truyền đạt ý này tự nhiên, vẫn không quyết định các vấn đề thần học về phạm vi cuối cùng của עוֹלָם.
  - severity: low
    issue: Chú thích b hiện lặp lại cách diễn đạt diễn giải của bản văn
    rationale: Khi bản văn đổi sang “thường xuyên”, chú thích cần giải thích trực tiếp chức năng nghi lễ đều đặn của từ này và mối liên hệ với thời gian từ chiều đến sáng.
