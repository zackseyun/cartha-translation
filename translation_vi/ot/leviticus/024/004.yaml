  source_fidelity: 'Bản dịch phản ánh sát nguyên văn: עַל הַמְּנֹרָה הַטְּהֹרָה là “Trên chân đèn tinh sạch”; יַעֲרֹךְ אֶת־הַנֵּרוֹת là “phải sắp xếp các ngọn đèn”; לִפְנֵי יְהוָה là “trước mặt Yahweh”; và תָּמִיד được giữ bằng “luôn luôn”. Đại từ nam số ít “ông” phù hợp với chủ thể đã được xác định trong văn mạch gần là A-rôn, mà không cần bổ sung tên vào nguyên văn câu này.'
  naturalness: Câu tiếng Việt hiện đại, trang trọng và trôi chảy. “Chân đèn tinh sạch,” “các ngọn đèn,” và “trước mặt Yahweh” đều tự nhiên trong văn cảnh nghi lễ. “Luôn luôn” có thể gợi tính liên tục mạnh hơn sắc thái nghi thức đều đặn trong một số ngữ cảnh, nhưng chú thích đã nêu khả năng này và cách dịch chính vẫn nằm trong phạm vi nghĩa của תָּמִיד.
  terminology: “Chân đèn” dịch đúng מְנוֹרָה, và “tinh sạch” bảo lưu sắc thái nghi lễ của טָהוֹר. “Yahweh” nhất quán với quyết định dự án về יהוה. Chú thích được neo đúng vào תָּמִיד và giải thích minh bạch việc dùng danh YHWH; không áp đặt diễn giải giáo phái.
