  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: vi
  text: Trên chân đèn tinh sạch, ông phải sắp xếp các ngọn đèn trước mặt Yahweh luôn luôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Luôn luôn” cũng có thể hiểu là “đều đặn”. Tiếng Hê-bơ-rơ dùng danh riêng của Đức Chúa Trời là YHWH, được dịch là “Yahweh”.
    reason: Nêu sắc thái của תָּמִיד và giải thích cách thể hiện danh thánh YHWH.
lexical_decisions:
- source_word: עַל
  choice: Trên
  rationale: Giữ nghĩa vị trí trực tiếp của giới từ đối với chân đèn.
- source_word: הַמְּנֹרָה
  choice: chân đèn
  rationale: Chỉ giá đỡ đèn dùng trong nơi thánh; cách dịch này tự nhiên và chính xác hơn việc phiên âm tên đồ vật.
- source_word: הַטְּהֹרָה
  choice: tinh sạch
  rationale: Diễn đạt phẩm tính tinh sạch trong bối cảnh nghi lễ, đồng thời tránh hiểu đơn thuần là không bẩn.
- source_word: יַעֲרֹךְ
  choice: phải sắp xếp
  rationale: Động từ ערך nói đến việc đặt hoặc xếp theo trật tự; 'sắp xếp' giữ được hành động nghi lễ mà không mở rộng thành việc chăm nom nói chung.
- source_word: הַנֵּרוֹת
  choice: các ngọn đèn
  rationale: Chỉ những ngọn đèn riêng biệt đặt trên chân đèn; đây là cách nói tự nhiên trong tiếng Việt.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ chỉ việc ở trước hoặc trong sự hiện diện của Đức Chúa Trời trong bối cảnh thờ phượng.
- source_word: תָּמִיד
  choice: luôn luôn
  rationale: Bảo lưu ý nghĩa tiếp diễn hoặc được duy trì đều đặn của תָּמִיד, không thu hẹp thành một lịch trình cụ thể.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; 'Yahweh' bảo tồn danh giao ước thay vì thay bằng một tước hiệu.
- issue: Sắc thái của תָּמִיד
  choice: luôn luôn
  alternative: thường xuyên hoặc đều đặn
  rationale: Từ này có thể nhấn mạnh sự liên tục hoặc một nghi thức được duy trì đều đặn. Bản văn chính giữ cách diễn đạt rộng, còn chú thích nêu sắc thái khả dĩ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “ông” giữ chủ thể nam số ít đã được xác định trong văn mạch, còn “trước mặt” bảo lưu sắc thái nghi lễ của thành ngữ Hê-bơ-rơ.
