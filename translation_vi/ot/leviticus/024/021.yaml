source:
  edition: WLC
  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: vi
  text: Ai đánh chết một con vật thì phải bồi thường thiệt hại về con vật ấy; còn ai đánh chết một người[a] thì phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ở đây, từ Hê-bơ-rơ אָדָם chỉ một con người; trong câu này, từ ấy không nhất thiết chỉ riêng nam giới.
    reason: Làm rõ phạm vi nghĩa của từ Hê-bơ-rơ trong ngữ cảnh này và tránh hiểu hình thức giống đực số ít của công thức luật là một giới hạn về giới tính.
lexical_decisions:
- source_word: מַכֵּה
  choice: ai đánh chết
  rationale: Phân từ Hifil của נכה tạo công thức luật theo trường hợp. Trong văn cảnh này, hậu quả bồi thường đối với con vật và án tử hình đối với người cho thấy cú đánh gây chết; “đánh chết” diễn đạt rõ nghĩa ấy mà vẫn giữ hình ảnh hành động đánh.
- source_word: בְהֵמָה
  choice: một con vật
  rationale: Từ này chỉ súc vật hay thú vật, thường là vật nuôi. “Con vật” là cách nói rộng, tự nhiên trong tiếng Việt hiện đại và không thu hẹp nghĩa thành riêng gia súc.
- source_word: יְשַׁלְּמֶנָּה
  choice: phải bồi thường con vật ấy
  rationale: Động từ Piel của שלם mang nghĩa đền bù thiệt hại; hậu tố giống cái số ít quy chiếu về בְהֵמָה. Lặp lại “con vật ấy” làm rõ đối tượng bồi thường trong tiếng Việt.
- source_word: אָדָם
  choice: một người
  rationale: Trong thế đối lập với con vật, từ này chỉ một cá nhân thuộc loài người. “Một người” vừa đúng nghĩa rộng của אָדָם vừa tự nhiên trong công thức pháp luật tiếng Việt, không áp đặt giới tính mà tiếng Hê-bơ-rơ không nhất thiết đòi hỏi về mặt từ vựng.
- source_word: יוּמָת
  choice: phải bị xử tử
  rationale: Dạng Hophal diễn tả việc người phạm tội bị làm cho chết theo phán quyết pháp lý. “Phải bị xử tử” giữ thể bị động và sắc thái tư pháp rõ hơn “phải chết”.
theological_decisions:
- issue: Phạm vi nghĩa của אָדָם trong quy định pháp luật
  choice: một người
  alternative: một người nam
  rationale: אָדָם ở đây đối lập con người với con vật và có thể chỉ bất cứ cá nhân nào; hình thức số ít giống đực của câu luật không buộc nghĩa phải giới hạn ở nam giới. Bản dịch giữ nghĩa bao quát mà không xóa tính chất cá nhân của trường hợp luật.
- issue: Tính chất cái chết trong יוּמָת
  choice: phải bị xử tử
  alternative: phải chết
  rationale: Dạng động từ bị động-causative và văn cảnh hình phạt cho thấy đây là án tử hình do cộng đồng hay thẩm quyền thi hành, không chỉ là lời báo trước người ấy sẽ chết.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Cấu trúc “Ai… thì phải…” tái hiện tính khái quát của công thức luật; “còn” làm nổi bật sự đối chiếu giữa con vật và con người. Dấu chấm phẩy giúp câu rõ nhịp mà không thêm quan hệ ý nghĩa ngoài nguyên bản.
