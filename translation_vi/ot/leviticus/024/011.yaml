  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: vi
  text: Con trai của người phụ nữ Y-sơ-ra-ên ấy đã nêu Danh và nguyền rủa[a], và người ta đem người ấy đến Môi-se. Mẹ người ấy tên là Sê-lô-mít, con gái Đíp-ri, thuộc chi phái Đan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã xúc phạm Danh và nguyền rủa” hoặc “đã phạm thượng Danh.” Động từ Hê-bơ-rơ có thể mang nghĩa “nêu” hoặc “phát âm rõ ràng”; trong ngữ cảnh này, nó cũng có thể được hiểu là thuộc hành vi phạm thượng.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: đã nói rõ
  rationale: Động từ נקב có thể chỉ việc nêu hoặc phát âm rõ ràng; đi với “Danh” và theo sau bởi động từ riêng “nguyền rủa,” cách dịch này giữ nguyên chuỗi hai hành động thay vì đồng nhất chúng.
- source_word: אֶת הַשֵּׁם
  choice: Danh
  rationale: Cụm có mạo từ trong ngữ cảnh này là cách kính cẩn chỉ danh Đức Chúa Trời. Viết hoa “Danh” truyền đạt sở chỉ đặc biệt mà không tự ý đưa danh YHWH vào câu.
- source_word: וַיְקַלֵּל
  choice: rồi nguyền rủa
  rationale: קלל ở thể piel thường có nghĩa là nguyền rủa. “Rồi” diễn đạt tự nhiên sự tiếp nối của hai động từ trong tiếng Hê-bơ-rơ mà không xác định thêm nội dung lời nguyền.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: nên người ta dẫn anh ta đến Môi-se
  rationale: Chủ ngữ số nhiều không xác định được diễn đạt tự nhiên bằng “người ta”; “dẫn” phù hợp việc áp giải một người đến trước Môi-se.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mẹ anh ta tên là
  rationale: Diễn đạt tự nhiên phần thông tin bổ sung trong lời kể, không cần dịch máy móc liên từ וְ.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: Sê-lô-mít, con gái Đíp-ri
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc trong tiếng Việt và giữ rõ quan hệ huyết thống.
- source_word: לְמַטֵּה דָן
  choice: thuộc chi phái Đan
  rationale: Thành ngữ này xác định sự quy thuộc bộ tộc; “thuộc chi phái Đan” rõ ràng và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Nghĩa của נקב khi đi với “Danh” trong ngữ cảnh phạm thượng
  choice: Hiểu là nói hoặc nêu rõ Danh, rồi thực hiện hành động nguyền rủa riêng biệt.
  alternative: Hiểu chính động từ này là “xúc phạm Danh” hoặc “phạm thượng đến Danh.”
  rationale: Bản văn dùng hai động từ נקב và קלל. Giữ hai hành động riêng giúp bảo tồn sự mơ hồ từ vựng và diễn tiến của câu; chú thích ghi nhận cách hiểu khác mà không áp đặt một kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Danh” viết hoa như một lối kính cẩn chỉ danh Đức Chúa Trời; giữ nguyên nét mơ hồ của נקב bằng bản dịch chính và chú thích. Đại từ “anh ta” trung tính, tự nhiên đối với một người nam đã trưởng thành hoặc chưa rõ tuổi.
