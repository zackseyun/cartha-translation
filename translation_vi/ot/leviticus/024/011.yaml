  to: Con trai của người phụ nữ Y-sơ-ra-ên ấy đã nêu Danh và nguyền rủa[a], và người ta đem người ấy đến Môi-se. Mẹ người ấy tên là Sê-lô-mít, con gái Đíp-ri, thuộc chi phái Đan.
