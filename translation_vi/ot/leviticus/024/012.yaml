base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: vi
  text: Họ tạm giam người ấy để điều ấy được chỉ rõ cho họ theo lời Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “để Yahweh chỉ rõ cho họ.” Động từ Hê-bơ-rơ có thể mang nghĩa “làm rõ”, “giải thích” hoặc “tuyên bố rõ ràng”; nguyên văn không nói cụ thể điều gì cần được làm rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: Vì vậy, họ giam giữ người ấy
  rationale: Động từ ở thể nguyên nhân mang nghĩa đặt hoặc để; kết hợp với בַּמִּשְׁמָר, tiếng Việt tự nhiên là “giam giữ”. “Vì vậy” nối tiếp hệ quả trong trình thuật.
- source_word: בַּמִּשְׁמָר
  choice: giam giữ
  rationale: Danh từ chỉ tình trạng bị canh giữ hoặc tạm giữ, phù hợp với bối cảnh pháp lý.
- source_word: לִפְרֹשׁ
  choice: chờ ... chỉ rõ
  rationale: Động từ có nghĩa làm cho rõ, giải thích hoặc tuyên bố rõ ràng. Cách diễn đạt này giữ được tính chưa xác định của điều cần được làm rõ mà không tự ý thêm “phán quyết”.
- source_word: לָהֶם
  choice: cho họ
  rationale: Giữ nguyên đối tượng số nhiều đang chờ được chỉ dẫn rõ.
- source_word: עַל־פִּי
  choice: lời ...
  rationale: Thành ngữ nguyên nghĩa là “theo miệng”, chỉ lời phán có thẩm quyền. Trong cấu trúc tiếng Việt, “chờ lời Yahweh chỉ rõ” diễn đạt tự nhiên quan hệ này.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; giữ “Yahweh” bảo toàn tính chất danh riêng.
- issue: Nội dung cần được làm rõ
  choice: Không thêm một tân ngữ cụ thể
  alternative: chỉ rõ phán quyết
  rationale: Nguyên văn không nêu rõ điều gì phải được giải thích hay tuyên bố; bản dịch giữ sự hàm ẩn ấy thay vì xác định đó là “phán quyết”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người ấy” phù hợp văn cảnh hơn đại từ có thể mang sắc thái thiếu tôn trọng; cấu trúc “chờ lời Yahweh chỉ rõ” làm rõ ý chờ sự mặc khải mà không thêm nội dung không có trong tiếng Hê-bơ-rơ.
