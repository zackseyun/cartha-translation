revisions:
- from: Con phải đặt nhũ hương tinh khiết trên mỗi hàng[a]. Nhũ hương ấy sẽ là phần tưởng niệm của bánh, một lễ vật dâng bằng lửa[b] lên Yahweh.
  to: Hãy đặt nhũ hương tinh khiết trên mỗi hàng[a]. Nhũ hương ấy sẽ dùng làm phần tưởng niệm cho bánh, là lễ vật dâng bằng lửa cho Yahweh[b].
  rationale: Bản sửa làm rõ quan hệ ngữ pháp giữa nhũ hương, phần tưởng niệm và bánh; tránh thêm sắc thái xưng hô; đồng thời bảo toàn tính phân phối của “mỗi hàng” theo ngữ cảnh câu trước. Cách dịch chính của אִשֶּׁה vẫn là “lễ vật dâng bằng lửa”; lựa chọn “lễ vật thực phẩm” được giữ ở chú thích như audit trail yêu cầu.
