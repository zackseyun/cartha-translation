source:
  edition: WLC
  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: vi
  text: Hãy đặt nhũ hương tinh khiết trên mỗi hàng[a]. Nhũ hương ấy sẽ dùng làm phần tưởng niệm cho bánh, là lễ vật dâng bằng lửa cho Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trên sự sắp đặt”; trong ngữ cảnh, từ này chỉ hai hàng bánh được xếp theo thứ tự.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “lễ vật thực phẩm”. Thuật ngữ Hê-bơ-rơ này thường chỉ lễ vật được dâng bằng lửa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Con phải đặt
  rationale: Dạng động từ hoàn thành có waw trong mạch chỉ dẫn nghi lễ mang lực mệnh lệnh; “phải đặt” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: הַמַּעֲרֶכֶת
  choice: mỗi hàng
  rationale: Danh từ số ít chỉ sự sắp đặt có thể được hiểu theo nghĩa phân phối trong ngữ cảnh câu trước, nơi bánh được xếp thành hai hàng; cách dịch này giúp độc giả hình dung đúng bố cục.
- source_word: לְבֹנָה זַכָּה
  choice: nhũ hương tinh khiết
  rationale: “Nhũ hương” là tên gọi thông dụng, trang trọng của frankincense; tính từ diễn tả sự tinh sạch thích hợp cho nghi lễ.
- source_word: לְאַזְכָּרָה
  choice: phần tưởng niệm
  rationale: Đây là thuật ngữ tế lễ chỉ phần đại diện được dâng lên trước Đức Chúa Trời; thêm “phần” truyền đạt chức năng nghi lễ của từ mà không giải thích quá mức.
- source_word: אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Cách dịch này phản ánh trực tiếp thuật ngữ tế lễ thường chỉ vật được dâng bằng lửa, đồng thời giữ lựa chọn “lễ vật làm thức ăn” trong chú thích vì ngữ nguyên và cách hiểu của từ còn được bàn luận.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ tên giao ước được biểu thị trực tiếp bằng Tứ Tự YHWH; “dâng ... lên” là kết hợp từ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng giao ước; phiên âm “Yahweh” phân biệt danh này với tước hiệu và không áp đặt truyền thống giáo phái riêng.
- issue: Quan hệ giữa nhũ hương và bánh trong “לַלֶּחֶם לְאַזְכָּרָה”
  choice: “phần tưởng niệm của bánh”
  alternative: “thay cho bánh làm phần tưởng niệm”
  rationale: Cách chọn giữ quan hệ ngữ pháp “cho/của bánh” mà không khẳng định quá cụ thể rằng nhũ hương thay thế bánh, dù chức năng đại diện ấy có thể được suy ra từ nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “con” theo lối Đức Chúa Trời truyền lệnh trực tiếp cho Môi-se trong văn cảnh; giữ thuật ngữ nghi lễ “phần tưởng niệm” nhưng diễn đạt câu theo trật tự tự nhiên của tiếng Việt.
