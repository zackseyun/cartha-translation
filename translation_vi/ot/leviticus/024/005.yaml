  text: וְ/לָקַחְתָּ֣ סֹ֔לֶת וְ/אָפִיתָ֣ אֹתָ֔/הּ שְׁתֵּ֥ים עֶשְׂרֵ֖ה חַלּ֑וֹת שְׁנֵי֙ עֶשְׂרֹנִ֔ים יִהְיֶ֖ה הַֽ/חַלָּ֥ה הָ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: vi
  text: Ngươi phải lấy bột mịn, nướng thành mười hai ổ bánh[a]; mỗi ổ phải được làm từ hai phần mười ê-pha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mười hai chiếc bánh.” Từ Hê-bơ-rơ chỉ từng đơn vị bánh nướng, thường dùng trong bối cảnh nghi lễ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “hai phần mười”; trong hệ đo lường tư tế, điều này có nghĩa là hai phần mười ê-pha cho mỗi ổ bánh.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Ngươi phải lấy
  rationale: Thể hoàn thành Qal nối tiếp trong chuỗi chỉ thị mang lực mệnh lệnh; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái quy định.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Đây là thuật ngữ tế tự chỉ loại bột tinh chế dùng cho lễ vật và bánh thánh; nguyên văn không xác định rõ loại ngũ cốc nên không thêm 'lúa mì'.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: và dùng bột ấy nướng thành
  rationale: Đại từ giống cái chỉ lại סֹלֶת; diễn đạt rõ chất liệu được nướng thành các đơn vị bánh mà vẫn tự nhiên trong tiếng Việt.
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: mười hai ổ bánh
  rationale: חַלּוֹת chỉ các đơn vị bánh nướng trong bối cảnh nghi lễ; 'ổ bánh' rõ nghĩa hơn 'bánh' đơn thuần, nhưng chú thích vẫn bảo lưu khả năng dịch là 'bánh tròn/bánh nhỏ'.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: hai phần mười ê-pha
  rationale: Nghĩa đen là 'hai phần mười'; trong hệ đo lường tư tế, đơn vị được hiểu là ê-pha. Nêu đơn vị trong bản văn giúp độc giả hiện đại hiểu đúng lượng đo.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: mỗi ổ làm bằng
  rationale: Nghĩa sát là 'một ổ bánh sẽ là'; cách diễn đạt phân phối 'mỗi ổ' truyền đạt đúng rằng lượng bột áp dụng cho từng ổ.
theological_decisions: []
translation_notes:
  register: Văn phong quy định, trang trọng nhưng hiện đại. Dùng 'ngươi' để phù hợp lời truyền trực tiếp trong ngữ cảnh luật pháp; tránh thêm loại ngũ cốc mà nguyên văn không nêu. Cả hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
