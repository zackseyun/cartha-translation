source:
  edition: WLC
  text: שֶׁ֚בֶר תַּ֣חַת שֶׁ֔בֶר עַ֚יִן תַּ֣חַת עַ֔יִן שֵׁ֖ן תַּ֣חַת שֵׁ֑ן כַּ/אֲשֶׁ֨ר יִתֵּ֥ן מוּם֙ בָּֽ/אָדָ֔ם כֵּ֖ן יִנָּ֥תֶן בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: vi
  text: gãy xương đền gãy xương, mắt đền mắt, răng đền răng; người ấy gây thương tật[a] cho một người[b] thế nào, thì người ấy cũng sẽ bị gây thương tật như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “gây khuyết tật” hoặc “làm biến dạng”. Tiếng Hê-bơ-rơ dùng thành ngữ có nghĩa đen là “đặt/cho một tì vết”.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng từ chỉ “con người”; trong luật tình huống này, từ ấy chỉ một người bất kỳ.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר
  choice: gãy xương
  rationale: Danh từ chỉ sự gãy, đặc biệt là thương tích gãy xương trong ngữ cảnh luật pháp. Cách diễn đạt này rõ nghĩa và tự nhiên hơn “vết gãy” trong tiếng Việt.
- source_word: תַּחַת
  choice: đền
  rationale: Trong công thức báo ứng tương xứng, từ này diễn tả sự thay thế hoặc đối ứng. “Đền” giữ được nhịp pháp lý quen thuộc của “mắt đền mắt, răng đền răng” mà không tự diễn giải thành bồi thường tiền bạc.
- source_word: עַיִן
  choice: mắt
  rationale: Thuật ngữ giải phẫu trực tiếp, được giữ nguyên nghĩa trong công thức pháp lý.
- source_word: שֵׁן
  choice: răng
  rationale: Thuật ngữ giải phẫu trực tiếp, được giữ nguyên nghĩa trong công thức pháp lý.
- source_word: כַּאֲשֶׁר
  choice: thế nào
  rationale: Kết hợp với “như vậy” để diễn đạt tự nhiên cấu trúc so sánh tương ứng của tiếng Hê-bơ-rơ.
- source_word: יִתֵּן מוּם
  choice: gây thương tật
  rationale: Động từ có nghĩa đen là “cho/đặt” kết hợp với מוּם tạo thành thành ngữ chỉ việc gây ra một khuyết tật hay thương tích. “Gây thương tật” phù hợp ngữ cảnh hành hung và vẫn giữ sắc thái tổn hại thân thể lâu dài hoặc làm biến dạng.
- source_word: אָדָם
  choice: một người
  rationale: Ở đây danh từ số ít chỉ một con người bất kỳ trong luật tình huống; “một người” là cách diễn đạt tự nhiên, bao quát và chính xác trong tiếng Việt.
- source_word: כֵּן
  choice: như vậy
  rationale: Đánh dấu hậu quả tương ứng với hành vi đã gây ra.
- source_word: יִנָּתֶן בּוֹ
  choice: phải gây thương tật cho người ấy
  rationale: Dạng bị động của נתן cùng giới từ בּוֹ nói rằng điều tương ứng phải được thực hiện trên chính người gây thương tật. Chuyển sang cấu trúc chủ động vô nhân xưng là tự nhiên trong tiếng Việt và vẫn giữ lực quy định pháp lý.
theological_decisions:
- issue: Tính chất của công thức báo ứng tương xứng
  choice: Giữ công thức cụ thể “gãy xương đền gãy xương, mắt đền mắt, răng đền răng”.
  alternative: Diễn giải thành “thương tích tương xứng với thương tích” hoặc “bồi thường theo mức tổn hại”.
  rationale: Bản Hê-bơ-rơ dùng công thức thân thể cụ thể. Bản dịch không nên tự giới hạn câu này vào bồi thường vật chất, cũng không nên giải quyết trước cách áp dụng tư pháp của nó.
- issue: Phạm vi nghĩa của מוּם
  choice: thương tật
  alternative: tì vết; khuyết tật; biến dạng
  rationale: “Thương tật” tự nhiên trong ngữ cảnh pháp lý và bao quát tổn hại thân thể, nhưng chú thích vẫn bảo lưu những sắc thái “khuyết tật/biến dạng” của từ nguồn.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng dễ hiểu. Dùng công thức quen thuộc “mắt đền mắt, răng đền răng”; “gãy xương đền gãy xương” làm rõ loại thương tích mà không thêm một cách giải thích giáo phái. Cấu trúc “phải gây… cho” chuyển thể bị động Hê-bơ-rơ sang tiếng Việt tự nhiên, không xác định tác nhân thi hành.
