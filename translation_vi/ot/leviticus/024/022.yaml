base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: vi
  text: Các con sẽ có một chuẩn mực xét xử duy nhất, áp dụng cho người ngoại kiều cũng như cho người bản xứ, vì Ta là Đức Giê-hô-va, Đức Chúa Trời của các con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: cùng một chuẩn mực xét xử
  rationale: Diễn đạt tự nhiên ý nghĩa đen “một sự phán xét/luật lệ”, nhấn mạnh cùng một tiêu chuẩn pháp lý được áp dụng cho cả hai nhóm.
- source_word: גֵּר
  choice: người ngoại kiều
  rationale: Chỉ người từ nơi khác đến cư trú trong cộng đồng, không nhất thiết là khách qua đường; “ngoại kiều” giữ được sắc thái pháp lý của ngữ cảnh.
- source_word: אֶזְרָח
  choice: người bản xứ
  rationale: Chỉ người sinh ra hoặc thuộc về dân bản địa, tương phản trực tiếp với người ngoại kiều.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Thể hiện danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì chuyển thành một danh xưng chung.
- source_word: לָכֶם / אֱלֹהֵיכֶם
  choice: các con / của các con
  rationale: Giữ ngôi số nhiều của nguyên văn và dùng cách xưng hô trang trọng, dễ hiểu trong lời Đức Chúa Trời phán với cộng đồng.
theological_decisions:
- issue: Phạm vi bình đẳng trước luật pháp
  choice: “cho người ngoại kiều cũng như người bản xứ”
  alternative: “dù là người ngoại kiều hay người bản xứ”
  rationale: Giữ cấu trúc so sánh của nguyên văn và không mở rộng câu này thành một tuyên bố vượt quá hai nhóm được nêu rõ.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ quan hệ nguyên nhân ở cuối: cùng một chuẩn mực được đặt nền trên lời tự xác nhận của Đức Giê-hô-va.'
