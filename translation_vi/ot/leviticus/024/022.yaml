revisions:
- from: Các con phải có cùng một chuẩn mực xét xử cho người ngoại kiều cũng như người bản xứ, vì Ta là Đức Giê-hô-va, Đức Chúa Trời của các con.
  to: Các con sẽ có một chuẩn mực xét xử duy nhất, áp dụng cho người ngoại kiều cũng như cho người bản xứ, vì Ta là Đức Giê-hô-va, Đức Chúa Trời của các con.
  rationale: Sửa tối thiểu để phản ánh sát hơn hình thức tuyên bố pháp lý của nguyên văn và ý “một” theo nghĩa duy nhất, đồng thời giữ nguyên các thuật ngữ chính, ngôi xưng và phạm vi hai nhóm người được nêu trong câu.
  reviewer_model: gpt-5.6-terra
