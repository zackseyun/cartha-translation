review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng trọng tâm của nguyên văn: chỉ có một tiêu chuẩn pháp lý cho người ngoại kiều và người bản xứ, với lời tự xưng của Đức Giê-hô-va làm nền tảng. Tuy nhiên, “phải có” chuyển sắc thái của mệnh đề Hê-bơ-rơ יִהְיֶה (“sẽ có/ sẽ áp dụng”) thành mệnh lệnh trực tiếp. “Cùng một” cũng dễ hàm ý đối chiếu với một tiêu chuẩn khác, trong khi אֶחָד nhấn mạnh tính duy nhất.'
  naturalness: Câu sửa vẫn trang trọng, hiện đại và rõ nghĩa pháp lý. “Áp dụng cho ... cũng như cho ...” làm sáng tỏ rằng chuẩn mực xét xử được áp dụng bình đẳng cho cả hai nhóm.
  terminology: “Người ngoại kiều” phù hợp với גֵּר trong ngữ cảnh luật lệ, không đồng nhất hóa với khách vãng lai. “Người bản xứ” phù hợp với אֶזְרָח. “Đức Giê-hô-va, Đức Chúa Trời của các con” giữ danh riêng và ngôi số nhiều của nguyên văn.
  issues:
  - severity: low
    issue: “Các con phải có” mạnh hơn sắc thái của יִהְיֶה.
    rationale: Nguyên văn nêu quy định bằng thì/ý nghĩa “sẽ có, sẽ áp dụng”, không dùng mệnh lệnh trực tiếp. Nên tránh thêm sắc thái bắt buộc không được biểu đạt theo cùng hình thức.
  - severity: low
    issue: “Cùng một chuẩn mực” chưa nêu rõ tính duy nhất của אֶחָד.
    rationale: “Một chuẩn mực xét xử duy nhất” phản ánh trực tiếp hơn ý một tiêu chuẩn chung, đồng thời vẫn tự nhiên trong tiếng Việt.
  revised_text: Các con sẽ có một chuẩn mực xét xử duy nhất, áp dụng cho người ngoại kiều cũng như cho người bản xứ, vì Ta là Đức Giê-hô-va, Đức Chúa Trời của các con.
