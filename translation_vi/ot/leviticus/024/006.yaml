id: LEV.24.6
reference: Leviticus 24:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: vi
  text: Ngươi phải xếp chúng thành hai hàng[a], mỗi hàng sáu ổ bánh, trên bàn thanh sạch[b] trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thành hai cách sắp đặt” hoặc “thành hai chồng”; từ Hê-bơ-rơ chỉ các ổ bánh được sắp xếp có trật tự.
    reason: lexical_alternative
  - marker: b
    text: “Thanh sạch” ở đây mang nghĩa nghi lễ, không chỉ nói chiếc bàn sạch về mặt vật chất; cũng có thể dịch là “tinh sạch”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Con phải xếp
  rationale: Động từ שׂוּם có nghĩa là đặt, để, xếp. Trong chỉ dẫn về việc bày các ổ bánh, “xếp” diễn đạt tự nhiên cả hành động đặt lẫn tính có trật tự; chủ thể số ít giống đực được thể hiện bằng “con” theo mạch lời truyền cho Môi-se.
- source_word: אוֹתָם
  choice: chúng
  rationale: Đại từ tân ngữ chỉ về mười hai ổ bánh ở câu trước.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: thành hai hàng[a]
  rationale: מַעֲרָכָה chỉ một tập hợp được sắp đặt có trật tự. “Hai hàng” tự nhiên trong tiếng Việt và phù hợp với việc bày bánh, nhưng chú thích giữ lại khả năng hiểu là hai phần hoặc hai chồng được sắp đặt.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: mỗi hàng sáu cái
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “sáu, hàng ấy”; cách diễn đạt mang ý phân phối, tức mỗi hàng có sáu ổ. “Cái” tránh lặp từ “ổ bánh” nhưng vẫn rõ nhờ ngữ cảnh câu trước.
- source_word: עַל הַשֻּׁלְחָן
  choice: trên chiếc bàn
  rationale: עַל mang nghĩa thông thường là “trên”; mạo từ xác định được diễn đạt tự nhiên bằng “chiếc bàn” đã được xác định trong ngữ cảnh.
- source_word: הַטָּהֹר
  choice: thanh sạch[b]
  rationale: טָהוֹר trong bối cảnh thánh sở chỉ tình trạng thanh sạch về nghi lễ, không chỉ sạch về vật chất. “Thanh sạch” giữ sắc thái nghi lễ tốt hơn “sạch” và tự nhiên hơn khi bổ nghĩa cho đồ thánh.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי là “trước mặt, trước sự hiện diện của”; “trước mặt” vừa gần nghĩa vừa tự nhiên. Danh riêng giao ước יְהוָה được phiên là “Yahweh”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản văn trực tiếp dùng danh giao ước יהוה. “Yahweh” bảo tồn danh riêng mà không thay bằng tước hiệu hay nhập một cách phát âm khác.
- issue: Sắc thái nghi lễ của הַטָּהֹר
  choice: bàn thanh sạch
  alternative: bàn sạch; bàn tinh sạch
  rationale: Trong ngữ cảnh đồ dùng thánh sở, từ này chủ yếu nói đến tình trạng thanh sạch theo nghi lễ. “Thanh sạch” gợi đúng phạm vi ấy mà không thêm một luận giải thần học ngoài bản văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng lối chỉ dẫn trực tiếp “Con phải...” phù hợp diễn ngôn luật pháp; giữ “Yahweh” làm danh riêng. Các chú thích bảo tồn độ rộng nghĩa của מַעֲרָכָה và sắc thái nghi lễ của טָהוֹר.
