  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính: động từ mệnh lệnh số ít, đại từ chỉ mười hai ổ bánh của câu trước, hai hàng/cách sắp đặt, sáu ổ trong mỗi hàng, chiếc bàn thanh sạch, và vị trí trước mặt Yahweh. Tuy nhiên, “Con phải” thêm quan hệ xưng hô cha–con không có trong tiếng Hê-bơ-rơ; người được truyền lệnh trong văn cảnh là ngôi thứ hai số ít nhưng không được gọi là “con”. “Mỗi hàng sáu cái” cũng làm mờ đối tượng là các ổ bánh.'
