  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: vi
  text: 'Ai đánh chết một con vật thì phải bồi thường: mạng đền mạng[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “mạng đền mạng.” Trong văn cảnh bồi thường cho một con vật, cụm từ này diễn tả sự bồi hoàn tương xứng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה
  choice: Ai đánh chết
  rationale: Phân từ Hiphil của נכה nêu một trường hợp luật chung. Trong kết hợp với נֶפֶשׁ בְּהֵמָה, hành động mang nghĩa gây chết; “đánh chết” tự nhiên và giữ được sắc thái tác động của động từ.
- source_word: נֶפֶשׁ בְּהֵמָה
  choice: một con vật
  rationale: Theo nghĩa đen là “mạng/sự sống của một con vật”, nhưng trong tiếng Việt, “đánh chết một con vật” diễn đạt trực tiếp và tự nhiên cùng nội dung, không gợi ý khái niệm linh hồn phi vật chất.
- source_word: יְשַׁלְּמֶנָּה
  choice: phải bồi thường
  rationale: Dạng Piel của שלם chỉ việc hoàn trả hay bồi hoàn thiệt hại; hậu tố giống cái số ít quy chiếu về con vật. “Bồi thường” phù hợp văn cảnh pháp lý hiện đại.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: mạng đền mạng
  rationale: Giữ công thức pháp lý cô đọng của tiếng Hê-bơ-rơ và sự lặp lại của נֶפֶשׁ. Trong văn cảnh tài sản là con vật, công thức này nói đến sự bồi hoàn tương xứng.
theological_decisions:
- issue: Ý nghĩa của công thức bồi hoàn trong luật về con vật
  choice: Giữ “mạng đền mạng” như công thức chỉ sự bồi hoàn tương xứng, không quy định cụ thể hình thức bồi thường.
  alternative: Hiểu theo nghĩa cứng là bắt buộc phải giao một con vật khác thay thế, hoặc diễn giải hoàn toàn thành tiền hay tài sản tương đương.
  rationale: Động từ “bồi thường” chi phối cách hiểu câu; bản dịch giữ nguyên sức căng của công thức tiếng Hê-bơ-rơ mà không thêm một cơ chế pháp lý cụ thể ngoài điều văn bản nói.
translation_notes:
  register: Văn phong luật pháp ngắn gọn, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. “Con vật” rộng hơn “gia súc”; “bồi thường” tự nhiên hơn lối dịch sát chữ “trả lại”. Dấu hai chấm thể hiện mệnh đề sau giải thích nguyên tắc bồi thường.
