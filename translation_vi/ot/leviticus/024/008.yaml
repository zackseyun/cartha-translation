  - severity: low
    issue: “Luôn luôn” không phù hợp tối ưu với hành động được quy định mỗi Sa-bát.
    rationale: תָּמִיד trong văn cảnh tư tế chỉ sự đều đặn/thường xuyên theo quy định. “Đều đặn” tránh gợi ý hành động không ngừng giữa các ngày Sa-bát.
  - severity: low
