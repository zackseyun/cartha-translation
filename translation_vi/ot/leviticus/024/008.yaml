  to: Mỗi ngày Sa-bát,[a] người ấy phải sắp bánh ấy[b] trước mặt Yahweh, đều đặn. Đây là một giao ước đời đời của con cái Israel.[c]
  rationale: 'Bản sửa giữ thứ tự và nội dung nghi lễ của câu, đồng thời chỉnh phần cuối để phản ánh tự nhiên hơn cụm “từ con cái Israel, giao ước đời đời” mà không áp đặt cách giải thích giáo phái. Tách thành hai câu là một điều chỉnh cú pháp tiếng Việt, không thay đổi nghĩa: việc sắp bánh định kỳ trước Yahweh được xác định là giao ước đời đời liên hệ với con cái Israel.'
  reviewer_model: gpt-5.6-terra
