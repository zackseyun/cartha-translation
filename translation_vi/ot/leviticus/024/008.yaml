base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: vi
  text: Mỗi ngày Sa-bát,[a] người ấy phải sắp bánh ấy[b] trước mặt Yahweh, đều đặn. Đây là một giao ước đời đời của con cái Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “vào ngày Sa-bát, vào ngày Sa-bát”, một lối nói có nghĩa là mỗi ngày Sa-bát, hoặc từ Sa-bát này đến Sa-bát khác.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sắp đặt bánh ấy theo thứ tự”. Đại từ số ít chỉ chung toàn bộ số bánh hoặc cách bày bánh.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “do con cái Israel, theo một giao ước đời đời”. Cụm cuối trong nguyên văn được đặt ngắn gọn và quan hệ cú pháp chính xác với phần trước không được nêu tường minh.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: Mỗi ngày sa-bát
  rationale: Cụm từ được lặp lại theo lối phân phối, diễn tả việc đều đặn vào từng ngày sa-bát, chứ không nói đến hai ngày riêng biệt.
- source_word: יַעַרְכֶנּוּ
  choice: người phải ... sắp bánh ấy
  rationale: Động từ ערך chỉ việc sắp đặt theo thứ tự trong nghi lễ. Đại từ số ít chỉ toàn bộ số bánh hoặc cách bày bánh như một chỉnh thể; thêm danh từ “bánh” giúp câu tiếng Việt rõ nghĩa theo văn cảnh.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ nghi lễ chỉ việc đặt hoặc trình vật phẩm trong sự hiện diện của Yahweh, đồng thời phiên âm trực tiếp danh riêng giao ước.
- source_word: תָּמִיד
  choice: luôn luôn
  rationale: Trong văn cảnh tư tế, từ này nói đến sự tuân giữ liên tục và đều đặn; thời điểm hằng tuần đã được xác định ở đầu câu.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: đến từ con cái Israel
  rationale: מֵאֵת đánh dấu nguồn gốc. “Con cái Israel” giữ hình thức tập thể của nguyên văn, còn “đến từ” diễn đạt tự nhiên quan hệ nguồn gốc.
- source_word: בְּרִית עוֹלָם
  choice: một giao ước đời đời
  rationale: Giữ nguyên ngôn ngữ giao ước và ý nghĩa trường tồn, không diễn giải thành một “nghĩa vụ” hay “quy định” thuần túy.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ cú pháp của בְּרִית עוֹלָם với mệnh đề trước
  choice: như một giao ước đời đời
  alternative: theo một giao ước đời đời; đó là một giao ước đời đời
  rationale: Nguyên văn đặt cụm danh từ ở cuối mà không có từ nối giải thích rõ. “Như” giữ tương đối mở quan hệ giữa lễ bánh, Israel và giao ước, còn chú thích nêu các khả năng diễn đạt khác.
- issue: Phạm vi của đại từ số ít trong יַעַרְכֶנּוּ
  choice: bánh ấy, hiểu theo nghĩa tập thể
  alternative: cách bày bánh ấy; các bánh ấy
  rationale: Hình thái Hê-bơ-rơ là số ít nhưng văn cảnh nói đến toàn bộ bánh trưng bày. Bản dịch giữ số ít tập thể thay vì đổi hẳn sang số nhiều.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “sa-bát” là thuật ngữ đã quen thuộc; dùng “người” cho chủ thể số ít được xác định từ văn cảnh trước. Dấu chấm phẩy làm rõ quan hệ giữa hành động của tư tế và nguồn cung từ Israel mà không biến câu thành lời giải nghĩa dài.
