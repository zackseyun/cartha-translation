source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֥ישׁ אִ֛ישׁ כִּֽי יְקַלֵּ֥ל אֱלֹהָ֖י/ו וְ/נָשָׂ֥א חֶטְאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: vi
  text: 'Hãy nói với dân Israel rằng: ‘Nếu người nào nguyền rủa thần của mình, người ấy phải mang lấy tội mình.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mang lấy tội mình” là một thành ngữ Hê-bơ-rơ, chỉ việc người ấy phải gánh chịu tội lỗi hoặc trách nhiệm pháp lý về hành vi đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm từ theo nghĩa đen là “các con trai của Israel”, nhưng ở đây chỉ toàn thể dân Israel. “Con dân Israel” giữ được sắc thái thuộc về cộng đồng giao ước mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: Hãy nói ... rằng
  rationale: Diễn đạt tự nhiên mệnh lệnh pháp lý dành cho Môi-se và công thức dẫn lời trong tiếng Việt.
- source_word: אִישׁ אִישׁ
  choice: người nào
  rationale: Sự lặp lại danh từ “người” tạo ý nghĩa phân phối, tức bất cứ cá nhân nào; “người nào” truyền đạt lực này tự nhiên mà không giới hạn giới tính ngoài dụng ý của văn cảnh pháp lý.
- source_word: יְקַלֵּל
  choice: nguyền rủa
  rationale: Động từ piel của קלל có nghĩa nguyền rủa hoặc khinh miệt. “Nguyền rủa” giữ nghĩa trực tiếp, không diễn giải thành hành vi phạm thượng cụ thể được nói đến ở câu kế tiếp.
- source_word: אֱלֹהָיו
  choice: Đức Chúa Trời của mình
  rationale: Giữ đại từ sở hữu trong tiếng Hê-bơ-rơ và nghĩa số ít phù hợp với văn cảnh, nhưng không thay bằng danh xưng Đức Giê-hô-va vốn không xuất hiện trong câu này.
- source_word: וְנָשָׂא חֶטְאוֹ
  choice: người ấy phải mang lấy tội mình
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ về việc mang tội, đồng thời dùng “phải” để thể hiện hệ quả pháp lý của điều kiện.
theological_decisions:
- issue: Phạm vi nghĩa của אֱלֹהָיו
  choice: Đức Chúa Trời của mình
  alternative: Đức Giê-hô-va; Đức Chúa Trời
  rationale: Bản dịch giữ sở hữu cách của nguyên văn và không đồng nhất hóa từ này với danh Đức Giê-hô-va, nhờ đó bảo tồn sự phân biệt với hành vi cụ thể ở câu 16.
- issue: Chủ thể pháp lý mang hình thức nam tính
  choice: người nào
  alternative: bất cứ người đàn ông nào
  rationale: אִישׁ אִישׁ là công thức phân phối trong luật pháp. Trong tiếng Việt, “người nào” diễn đạt đúng phạm vi từng cá nhân mà không áp đặt rằng quy định chỉ áp dụng cho nam giới.
- issue: Ý nghĩa thành ngữ “mang tội”
  choice: Giữ thành ngữ trong chính văn và giải thích bằng chú thích
  alternative: chịu tội; chịu hình phạt vì tội mình
  rationale: “Mang lấy tội mình” bảo tồn hình ảnh và độ mở của nguyên văn, vốn có thể bao hàm trách nhiệm, tội lỗi và hậu quả pháp lý, thay vì thu hẹp thành hình phạt בלבד.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. Dùng “con dân Israel” theo nghĩa tập thể; câu điều kiện được giữ rõ ràng. Dấu chú thích [a] xuất hiện ngay sau thành ngữ cần giải thích.
