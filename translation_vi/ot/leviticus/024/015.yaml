- from: 'Hãy nói với con dân Israel rằng: ‘Nếu người nào nguyền rủa Đức Chúa Trời của mình, người ấy phải mang lấy tội mình.[a]’'
  to: 'Hãy nói với dân Israel rằng: ‘Nếu người nào nguyền rủa thần của mình, người ấy phải mang lấy tội mình.[a]’'
  rationale: Bản sửa thay danh xưng có tính định danh “Đức Chúa Trời” bằng “thần” để phản ánh đúng độ mở của אֱלֹהָיו, và dùng “dân Israel” cho công thức tập thể. Những yếu tố pháp lý và tính mơ hồ của thành ngữ “mang lấy tội mình” được giữ nguyên; chú thích được chỉnh để giải thích mà không thu hẹp thành hình phạt cụ thể.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:31:16Z'
review_pass:
  verdict: revise
  source_fidelity: Cấu trúc mệnh lệnh, đối tượng “dân Israel,” điều kiện phân phối, động từ “nguyền rủa,” và thành ngữ “mang ... tội mình” đều được truyền đạt sát nghĩa. Tuy nhiên, “Đức Chúa Trời của mình” định danh אֱלֹהָיו quá cụ thể theo cách dùng Cơ Đốc giáo Việt ngữ. Nguyên văn chỉ nói “thần/god của mình,” và câu này không dùng danh riêng của YHWH.
  naturalness: Câu văn trang trọng, rõ ràng, và tự nhiên. “Dân Israel” tự nhiên hơn “con dân Israel” trong một chỉ thị pháp luật và vẫn diễn đạt đúng nghĩa tập thể của בְּנֵי יִשְׂרָאֵל. “Mang lấy tội mình” là cách diễn đạt trang trọng, phù hợp với việc bảo lưu thành ngữ Hê-bơ-rơ.
  terminology: Nên dùng “thần của mình” thay cho “Đức Chúa Trời của mình” để giữ sở hữu cách và độ mở về quy chiếu của אֱלֹהָיו, không nhập một danh xưng hoặc cách hiểu giáo phái không có trong câu. Giữ “nguyền rủa,” không đổi thành “phạm thượng,” vì câu kế tiếp mới nêu hành vi liên quan đến Danh.
  issues:
  - severity: medium
    issue: “Đức Chúa Trời của mình” thu hẹp/định danh quá mức אֱלֹהָיו.
    rationale: Danh xưng “Đức Chúa Trời” trong tiếng Việt hiện đại thường chỉ Đức Chúa Trời theo cách dùng Cơ Đốc giáo. Trong khi đó אֱלֹהָיו có sở hữu cách và không nêu danh YHWH; bản dịch cần bảo tồn sự không xác định này.
  - severity: low
