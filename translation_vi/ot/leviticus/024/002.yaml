source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: vi
  text: “Hãy truyền cho con cái Y-sơ-ra-ên[a] đem đến cho con dầu ô-liu tinh khiết, làm từ ô-liu giã dập[b], để thắp sáng và giữ cho ngọn đèn cháy luôn luôn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; đây là danh xưng giao ước thông thường chỉ dân Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dầu ô-liu tinh khiết, loại giã dập.” Nguyên ngữ nói đến dầu ô-liu tinh sạch được làm bằng cách giã hoặc đập ô-liu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Hãy truyền
  rationale: Mệnh lệnh trực tiếp của động từ צוה; cách diễn đạt này giữ nguyên thẩm quyền của lời phán và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh thân tộc của nguyên ngữ, đồng thời đây là cách gọi quy ước chỉ toàn thể dân giao ước, không chỉ nam giới.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: đem đến cho con
  rationale: Trong cấu trúc có אֵלֶיךָ, לקח mang nghĩa thực tế là đem hoặc cung cấp đến cho người được nói với.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: dầu ô-liu nguyên chất, ép từ trái giã dập
  rationale: Nêu rõ nguyên liệu là ô-liu, phẩm chất tinh sạch và phương thức làm dầu từ trái được giã dập; tránh khiến người đọc hiểu כָּתִית mô tả bản thân dầu.
- source_word: לַמָּאוֹר
  choice: để thắp sáng
  rationale: Diễn đạt tự nhiên mục đích chiếu sáng của מָאוֹר mà không đồng nhất từ này với chân đèn.
- source_word: לְהַעֲלֹת נֵר תָּמִיד
  choice: giữ cho ngọn đèn cháy luôn luôn
  rationale: Thành ngữ Híp-ri nói về việc làm cho đèn cháy; với תָּמִיד, cách dịch này truyền đạt nhiệm vụ duy trì ánh đèn liên tục hoặc đều đặn mà không dùng lối nói gượng 'làm cho đèn đi lên'.
theological_decisions:
- issue: Danh xưng giao ước mang hình thức giống đực בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên / người Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” phản ánh hình ảnh dòng dõi trong nguyên ngữ, nhưng trong ngữ cảnh là danh xưng quy ước chỉ cộng đồng Y-sơ-ra-ên nói chung; chú thích bảo tồn cả nghĩa đen lẫn phạm vi quy chiếu.
- issue: Sắc thái thời gian của תָּמִיד
  choice: luôn luôn
  alternative: đều đặn / thường xuyên
  rationale: תָּמִיד trong văn liệu tế lễ có thể nhấn mạnh sự liên tục hoặc việc thực hiện đều đặn. Bản dịch chính giữ cách hiểu truyền thống “luôn luôn” mà không bổ sung một lịch trình không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con cái Y-sơ-ra-ên” để giữ dấu vết của cách gọi Híp-ri; “ô-liu” là tên cây quen thuộc trong tiếng Việt Kinh Thánh. Đại từ “con” thể hiện Đức Chúa Trời phán với Môi-se theo ngữ cảnh trực tiếp của phân đoạn.
