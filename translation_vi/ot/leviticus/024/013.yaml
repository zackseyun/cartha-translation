  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/013.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng wayyiqtol tiếp nối và đẩy mạch kể chuyện về phía trước; “rồi” diễn đạt tự nhiên trình tự này. “Phán” phù hợp với lời Đức Chúa Trời trong văn phong Kinh Thánh trang trọng mà vẫn hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng lối phiên âm thông dụng, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: Cụm giới từ אֶל với động từ nói năng được diễn đạt tự nhiên trong tiếng Việt là “phán với”; tên מֹשֶׁה dùng dạng phiên âm tiếng Việt quen thuộc “Môi-se”.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn lời, “rằng” báo hiệu nội dung phát ngôn tiếp theo một cách tự nhiên và gọn trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; giữ “Yahweh” bảo toàn sự phân biệt giữa danh riêng và các tước hiệu, không áp đặt cách thay thế theo truyền thống hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn lời ngắn gọn; không cần chú thích vì câu dịch trực tiếp và không có dị bản hay điểm mơ hồ đáng kể cần giải thích.
