base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: vi
  text: 'Rồi Môi-se nói với con dân Y-sơ-ra-ên, và họ đưa người đã nguyền rủa[a] ra ngoài trại rồi ném đá người ấy. Con dân Y-sơ-ra-ên đã làm như Yahweh truyền cho Môi-se.


    [a] Hay: “kẻ phạm thượng.” Phân từ Hê-bơ-rơ có nghĩa đen là “người nguyền rủa,” chỉ người đàn ông đã nguyền rủa Danh Đức Chúa Trời trong phần trước.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “kẻ phạm thượng.” Phân từ Hê-bơ-rơ có nghĩa đen là “người nguyền rủa,” chỉ người đàn ông đã nguyền rủa Danh Đức Chúa Trời trong phần trước.'
    reason: Nêu lựa chọn dịch theo văn cảnh cho הַמְקַלֵּל, trong khi bản văn chính giữ nghĩa từ vựng trực tiếp là người đã nguyền rủa.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nói
  rationale: Động từ דבר ở thể piel thường có nghĩa là “nói”; cách dịch này tự nhiên khi Môi-se truyền lời cho dân.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cách diễn đạt này giữ được ý về cộng đồng thuộc về Y-sơ-ra-ên nhưng tự nhiên và trang trọng hơn lối dịch sát chữ “các con trai Y-sơ-ra-ên” trong tiếng Việt hiện đại.
- source_word: וַיּוֹצִיאוּ
  choice: họ đưa ... ra
  rationale: Thể hiphil của יצא diễn tả việc khiến ai đi ra; “đưa ... ra” phù hợp với hành động dẫn người ấy ra ngoài trại.
- source_word: הַמְקַלֵּל
  choice: kẻ đã nguyền rủa
  rationale: Phân từ của קלל trực tiếp chỉ người đã nguyền rủa trong văn cảnh trước; thì hoàn thành trong tiếng Việt làm rõ sự việc đã xảy ra mà không thay bằng nhãn diễn giải mạnh hơn là “kẻ phạm thượng.”
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Cụm từ chỉ hướng đi ra bên ngoài doanh trại; “ra ngoài trại” vừa tự nhiên vừa giữ rõ chuyển động.
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: lấy đá ném người ấy
  rationale: Cách dịch này thể hiện cả động từ ném đá và danh từ “đá” trong nguyên văn, đồng thời tự nhiên hơn trong tiếng Việt so với lối lặp “ném đá bằng đá.”
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: đã làm đúng như ... truyền
  rationale: Đây là công thức tổng kết sự vâng lời đối với mệnh lệnh đã ban; “đúng như” diễn đạt sự tương ứng đầy đủ mà không thêm ý ngoài văn bản.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng chuyển tự gần với Danh Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Có nên dịch הַמְקַלֵּל bằng thuật ngữ mang tính diễn giải hơn là “kẻ phạm thượng” hay không
  choice: kẻ đã nguyền rủa
  alternative: kẻ phạm thượng
  rationale: Văn cảnh cho thấy người ấy đã nguyền rủa Danh Đức Chúa Trời, nhưng từ Hê-bơ-rơ trong câu này là phân từ của קלל, “nguyền rủa.” Bản văn chính giữ nghĩa trực tiếp, còn cách hiểu “kẻ phạm thượng” được nêu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “con dân Y-sơ-ra-ên” thay cho lối dịch quá sát chữ “các con trai Y-sơ-ra-ên”; dùng “lấy đá ném” để bảo toàn hình ảnh trong nguyên văn mà vẫn tự nhiên.
