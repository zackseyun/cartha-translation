source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: vi
  text: Ngài đã viết trên các bảng, như lần viết đầu tiên, Mười Lời—tức là những lời Yahweh đã phán với anh em trên núi, từ giữa lửa, vào ngày hội họp—rồi Yahweh trao chúng cho tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Ngài viết
  rationale: Động từ כתב ở thể wayyiqtol, ngôi thứ ba số ít, thuật lại hành động đã xảy ra. “Viết” tự nhiên và giữ được liên hệ với מִכְתָּב ở phần sau.
- source_word: הַלֻּחֹת
  choice: các bảng đá
  rationale: לֻחוֹת là các bảng dùng để ghi giao ước. Dù “đá” không xuất hiện ngay trong câu này, chất liệu đã được nêu rõ trong ngữ cảnh trực tiếp (Phục truyền 10:1, 3), và “bảng đá” giúp độc giả tiếng Việt hiểu đúng vật thể.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: giống như bản viết lần đầu
  rationale: כְּ diễn tả sự so sánh “giống như”; מִכְתָּב chỉ điều được viết hoặc bản viết. Cách dịch này giữ liên hệ từ vựng với động từ “viết” và tránh xác định quá mức đó là nét chữ hay văn bản.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: Mười Lời
  rationale: Cụm Hê-bơ-rơ có nghĩa sát là “mười lời/sự việc được phán”. “Mười Lời” phản ánh trực tiếp nguyên ngữ; cách gọi truyền thống “Mười Điều Răn” được ghi ở chú thích.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: những lời Yahweh đã phán với anh em
  rationale: Mệnh đề quan hệ xác định nội dung của “Mười Lời”. “Đã phán” biểu thị lời phán xảy ra trước việc viết và trao các bảng; “anh em” là cách xưng hô số nhiều tự nhiên trong diễn từ của Môi-se.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm phổ biến của danh giao ước YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: בָּהָר
  choice: trên núi
  rationale: Diễn đạt tự nhiên địa điểm của sự mặc khải tại Hô-rếp/Sinai mà không thêm tên núi vốn không có trong câu.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: từ giữa ngọn lửa
  rationale: Giữ hình ảnh lời phán phát ra từ bên trong lửa; “ngọn lửa” là cách nói tự nhiên trong tiếng Việt.
- source_word: בְּיוֹם הַקָּהָל
  choice: trong ngày hội chúng nhóm họp
  rationale: קָהָל có thể chỉ hội chúng hoặc hành động tập hợp. Cách dịch này truyền đạt cả ngày diễn ra sự kiện và việc dân Israel quy tụ, không biến nó thành một tên lễ hội.
- source_word: וַיִּתְּנֵם יְהוָה אֵלָי
  choice: rồi Yahweh trao chúng cho tôi
  rationale: נתן có nghĩa cơ bản là “ban/đưa/trao”. “Trao” phù hợp với việc giao các bảng cho Môi-se; đại từ “chúng” giữ nguyên sự quy chiếu có thể được hiểu là các bảng mang Mười Lời.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời. “Yahweh” bảo tồn chức năng của danh giao ước và không thay nó bằng tước hiệu.
- issue: Cách dịch עֲשֶׂרֶת הַדְּבָרִים
  choice: Mười Lời
  alternative: Mười Điều Răn
  rationale: Nguyên ngữ nói sát là “mười lời”, trong khi “Mười Điều Răn” là cách gọi truyền thống có giá trị giải thích. Bản chính ưu tiên hình thức nguyên ngữ và giữ cách gọi quen thuộc trong chú thích.
- issue: Chủ thể của וַיִּכְתֹּב
  choice: Ngài
  alternative: Yahweh
  rationale: Động từ chỉ có chủ thể ngôi thứ ba số ít; ngữ cảnh trước đó xác định Yahweh là Đấng viết. Dùng “Ngài” giữ cách diễn đạt của câu nguồn mà vẫn rõ trong mạch văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho đại từ số nhiều trong lời Môi-se nói với Israel; dùng “hội chúng nhóm họp” để tránh sắc thái giáo phái của các thuật ngữ hội thánh hiện đại. Dấu gạch ngang làm rõ rằng “những lời...” giải thích cho “Mười Lời” mà không thay đổi quan hệ cú pháp.
