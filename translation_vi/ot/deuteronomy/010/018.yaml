source:
  edition: WLC
  text: עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אֹהֵ֣ב גֵּ֔ר לָ֥/תֶת ל֖/וֹ לֶ֥חֶם וְ/שִׂמְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: vi
  text: Ngài thực thi công lý cho người mồ côi cha[a] và người góa phụ, yêu thương ngoại kiều[b], ban cho người ấy thức ăn và áo quần.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người mồ côi.” Từ Hê-bơ-rơ יָתוֹם nói đến người không còn cha; “mồ côi cha” giữ rõ sắc thái pháp lý-xã hội của từ này.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “người ngoại quốc cư trú” hoặc “kiều dân.” Từ Hê-bơ-rơ גֵּר chỉ người không thuộc dân bản xứ nhưng đang sống giữa Y-sơ-ra-ên, không chỉ là khách qua đường.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “bánh và áo quần.” Ở đây, “bánh” được dùng theo nghĩa rộng là thức ăn hoặc lương thực thiết yếu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: thực thi công lý
  rationale: Cụm từ Hê-bơ-rơ diễn tả việc thực hiện hoặc bảo đảm công lý cho những người dễ bị tổn thương, chứ không chỉ đơn thuần là “làm” hay đưa ra “phán xét”.
- source_word: יָתוֹם
  choice: người mồ côi cha
  rationale: Từ này chỉ người mất hoặc không còn cha; cách dịch này giữ được sắc thái pháp lý-xã hội cụ thể của nguyên ngữ.
- source_word: אַלְמָנָה
  choice: người góa bụa
  rationale: Cách gọi tự nhiên, trang trọng đối với nhóm người góa được nêu trong nguyên văn.
- source_word: אֹהֵב
  choice: yêu thương
  rationale: Truyền đạt trực tiếp thái độ tích cực và chủ động của Đức Chúa Trời đối với ngoại kiều.
- source_word: גֵּר
  choice: ngoại kiều
  rationale: Chỉ người không thuộc dân bản xứ nhưng đang cư ngụ giữa cộng đồng Y-sơ-ra-ên, không phải khách qua đường hay người xa lạ nói chung.
- source_word: לָתֶת לוֹ
  choice: ban cho người ấy
  rationale: Giữ quan hệ với ngoại kiều ở số ít trong nguyên văn và diễn tả hành động cụ thể qua đó tình yêu thương được bày tỏ.
- source_word: לֶחֶם
  choice: thức ăn
  rationale: Dù nghĩa đen là “bánh”, trong cặp từ với áo quần, từ này đại diện cho lương thực hoặc sự nuôi sống nói chung.
- source_word: שִׂמְלָה
  choice: áo quần
  rationale: Diễn đạt tự nhiên vật mặc thiết yếu được nói đến trong nguyên văn.
theological_decisions:
- issue: Sự quan tâm của Đức Chúa Trời đối với những người dễ bị tổn thương
  choice: Giữ cả hành động thực thi công lý lẫn tình yêu thương được thể hiện qua sự chu cấp vật chất.
  alternative: Chỉ nhấn mạnh sự bênh vực pháp lý, hoặc chỉ nhấn mạnh lòng thương cảm.
  rationale: Nguyên văn đặt hành động tư pháp (“thực thi công lý”) bên cạnh tình yêu chủ động (“yêu thương”) được biểu lộ bằng việc ban thức ăn và áo quần; bản dịch không giản lược chiều kích nào.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Thực thi công lý” giữ sắc thái tư pháp; “ngoại kiều” ngắn gọn và tương đối sát địa vị cư trú của גֵּר. Đại từ “người ấy” giữ số ít của nguyên văn mà không gán thêm giới tính trong tiếng Việt.
