id: DEU.10.8
reference: Deuteronomy 10:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: vi
  text: Lúc ấy, Yahweh biệt riêng chi tộc Lê-vi để khiêng Hòm Giao Ước của Yahweh, đứng trước mặt Yahweh mà phụng sự Ngài, và nhân danh Ngài mà chúc phước, cho đến ngày nay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבְדִּיל
  choice: biệt riêng
  rationale: Diễn đạt việc tách riêng chi tộc Lê-vi cho một nhiệm vụ đặc thù, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: chi tộc Lê-vi
  rationale: Giữ rõ tên chi tộc Levi; “chi tộc” phù hợp ngữ cảnh các bộ phận cấu thành dân Israel.
- source_word: לָשֵׂאת
  choice: khiêng
  rationale: Trong ngữ cảnh Hòm Giao Ước, “khiêng” diễn tả cụ thể việc mang một vật bằng sức người hơn từ chung “mang”.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: Hòm Giao Ước của Yahweh
  rationale: Giữ nguyên chuỗi sở thuộc và thuật ngữ giao ước; viết hoa danh xưng của vật thánh để văn bản rõ ràng.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: đứng trước mặt Yahweh
  rationale: Bảo toàn thành ngữ Hê-bơ-rơ về việc hiện diện để thi hành chức vụ, không diễn giải quá mức.
- source_word: לְשָׁרְתוֹ
  choice: phụng sự Ngài
  rationale: “Phụng sự” truyền đạt sắc thái phục vụ trong bối cảnh thánh lễ tốt hơn từ rộng hơn là “phục vụ”; đại từ chỉ Yahweh được viết hoa theo văn phong kính trọng.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: và nhân danh Ngài mà chúc phước
  rationale: Diễn đạt tự nhiên hành động chúc phước dưới thẩm quyền danh Yahweh, nhưng không xác định thêm đối tượng vốn không được nêu trong nguyên văn.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: cho đến ngày nay
  rationale: Thành ngữ tiếng Việt tự nhiên, thể hiện sự tiếp tục đến thời điểm của người kể.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Tính chất chức vụ trong לַעֲמֹד ... לְשָׁרְתוֹ
  choice: đứng trước mặt Yahweh mà phụng sự Ngài
  alternative: đứng trước mặt Yahweh để phục vụ Ngài
  rationale: Bản dịch giữ hình ảnh “đứng trước mặt” và sắc thái phục vụ thánh, nhưng không nhập vào văn bản những cơ cấu chức sắc về sau.
- issue: Đối tượng của hành động chúc phước
  choice: nhân danh Ngài mà chúc phước
  alternative: nhân danh Ngài mà chúc phước cho dân
  rationale: Nguyên văn không nêu tân ngữ; không thêm “cho dân” nhằm giữ lại độ mở cú pháp của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “biệt riêng” cho sự chỉ định có mục đích, “khiêng” cho nhiệm vụ đối với Hòm Giao Ước, và giữ nguyên danh Yahweh. Không cần chú thích vì các điểm nghĩa chính có thể được truyền đạt trực tiếp trong câu.
