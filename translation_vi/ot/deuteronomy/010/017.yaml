  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: vi
  text: Vì Giê-hô-va, Đức Chúa Trời của anh em, là Đức Chúa Trời của các thần và Chúa của các chúa, Đức Chúa Trời vĩ đại, quyền năng và đáng kính sợ[a], Đấng không thiên vị và không nhận hối lộ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đáng sợ” hoặc “gây lòng kính sợ”; từ Hê-bơ-rơ chỉ Đấng khiến người ta vừa sợ hãi vừa kính tôn.'
    reason: Nêu biên độ nghĩa của וְהַנּוֹרָא mà không thu hẹp sắc thái vào duy nhất sự kinh hãi hay kinh ngạc.
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ lực nguyên nhân của liên từ, nêu lý do cho lời khuyên bảo ở câu trước.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho danh YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Hậu tố ngôi thứ hai số nhiều chỉ cộng đồng Israel; cách xưng hô “anh em” tự nhiên trong diễn từ của Môi-se.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: Đức Chúa Trời của các thần
  rationale: Giữ cấu trúc sở hữu của tiếng Hê-bơ-rơ và công thức khẳng định quyền tối thượng, không quyết định bản thể của các “thần” được nhắc đến.
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: và Chúa của các chúa
  rationale: Bảo toàn phép song hành với “Đức Chúa Trời của các thần” và sắc thái chủ quyền.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר
  choice: là Đức Chúa Trời vĩ đại, quyền năng
  rationale: Diễn đạt tự nhiên chuỗi danh xưng đồng vị; “quyền năng” truyền đạt sức mạnh của גִּבּוֹר trong văn cảnh thần học.
- source_word: וְהַנּוֹרָא
  choice: và đáng kính sợ
  rationale: Phản ánh ý nghĩa Đấng khiến người ta kinh sợ và kính reverence, không làm yếu thành lời khen thông thường cũng không thu hẹp thành sự đáng sợ đơn thuần.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: Đấng không thiên vị
  rationale: Chuyển thành ngữ “không nâng mặt” sang ý nghĩa tư pháp tự nhiên trong tiếng Việt.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: và không nhận hối lộ
  rationale: Giữ rõ sức nặng pháp lý và đạo đức của mệnh đề.
theological_decisions:
- issue: Công thức “Đức Chúa Trời của các thần và Chúa của các chúa” có thể bị hiểu là xác nhận đa thần
  choice: Giữ nguyên công thức quyền tối thượng của bản Hê-bơ-rơ
  alternative: Diễn giải thành “Đức Chúa Trời và Chúa tối cao trên tất cả”
  rationale: Cấu trúc nguồn khẳng định địa vị vô song mà không giải thích bản thể của các thực thể được gọi là “thần” hay “chúa”; bản dịch không nên giải quyết thêm điều nguồn để ngỏ.
- issue: Sắc thái của וְהַנּוֹרָא
  choice: đáng kính sợ
  alternative: đáng sợ; uy nghiêm; gây kinh ngạc
  rationale: “Đáng kính sợ” giữ đồng thời yếu tố sợ hãi và lòng tôn kính trong danh xưng này; chú thích nêu các khả năng gần nghĩa.
- issue: Cách thể hiện danh יהוה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Dùng tên riêng thay vì tước hiệu để giữ chức năng của danh giao ước; “Giê-hô-va” là dạng Việt hóa dễ nhận biết, còn “Yahweh” gần cách phục nguyên học thuật hơn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ nhịp ba tính từ và phép song hành của nguyên văn. “Anh em” biểu thị đối tượng số nhiều trong diễn từ. Cần sửa từ ngoại ngữ còn sót trong chú thích khi xuất bản thành “tôn kính”.
