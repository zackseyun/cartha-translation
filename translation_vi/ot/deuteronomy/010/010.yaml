  text: וְ/אָנֹכִ֞י עָמַ֣דְתִּי בָ/הָ֗ר כַּ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וַ/יִּשְׁמַ֨ע יְהוָ֜ה אֵלַ֗/י גַּ֚ם בַּ/פַּ֣עַם הַ/הִ֔וא לֹא אָבָ֥ה יְהוָ֖ה הַשְׁחִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: vi
  text: Còn tôi, tôi ở lại trên núi như trong lần trước, bốn mươi ngày và bốn mươi đêm. Lần ấy, Yahweh cũng nhậm lời tôi; Yahweh không muốn hủy diệt anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Yahweh nghe tôi.” Động từ Hê-bơ-rơ có thể có nghĩa là “nghe” hoặc “lắng nghe thuận tình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Còn tôi
  rationale: Liên từ cùng đại từ độc lập tạo nét nhấn nhẹ và nối lại lời kể; “Còn tôi” diễn đạt tự nhiên sắc thái ấy.
- source_word: עָמַדְתִּי בָהָר
  choice: tôi ở trên núi
  rationale: Động từ עמד theo ngữ cảnh chỉ việc Môi-se lưu lại trên núi suốt một thời gian, không nhất thiết nói về tư thế đứng; “ở trên núi” tự nhiên và chính xác theo ngữ cảnh.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: như lần đầu
  rationale: Cụm này so sánh với thời kỳ bốn mươi ngày và đêm trước đó; tiếng Việt tự nhiên quy chiếu sự kiện ấy là “lần đầu”.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: bốn mươi ngày và bốn mươi đêm
  rationale: Giữ nguyên công thức thời lượng và sự lặp lại có trong tiếng Hê-bơ-rơ.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahweh nhậm lời tôi
  rationale: שמע với אֶל trong ngữ cảnh lời cầu thay mang nghĩa nghe theo cách đáp lại thuận lợi; “nhậm lời” truyền đạt sắc thái này mà không thêm nội dung cụ thể vào lời cầu xin.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: Lần ấy, Yahweh cũng
  rationale: Cách đặt “cũng” giữ rõ ý rằng đây là một dịp khác Yahweh đã nghe lời Môi-se.
- source_word: לֹא אָבָה
  choice: không muốn
  rationale: Giữ trực tiếp sắc thái ý chí, sự không sẵn lòng, của động từ אָבָה.
- source_word: הַשְׁחִיתֶךָ
  choice: hủy diệt anh em
  rationale: Dạng động từ nhân quả diễn tả việc tiêu diệt dân Israel; hậu tố số ít chỉ toàn thể dân được chuyển bằng đại từ tập thể tự nhiên “anh em” trong diễn từ của Môi-se.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Văn bản dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahweh nhậm lời tôi
  alternative: Yahweh nghe tôi; Yahweh lắng nghe tôi
  rationale: Ngữ cảnh là lời cầu thay của Môi-se. “Nhậm lời” thể hiện việc nghe với sự đáp ứng thuận lợi, nhưng chú thích vẫn bảo tồn nghĩa rộng hơn của động từ.
- issue: Đối tượng số ít trong הַשְׁחִיתֶךָ
  choice: hủy diệt anh em
  alternative: hủy diệt ngươi
  rationale: Hậu tố Hê-bơ-rơ ở số ít nhưng hướng đến Israel như một cộng đồng. “Anh em” phù hợp lời Môi-se nói với dân chúng và tránh khiến độc giả hiểu là chỉ một cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Chia thành hai câu để làm rõ hai mệnh đề chính; giữ phép lặp danh Yahweh theo nguyên văn và dùng “anh em” cho cộng đồng Israel.
