id: DEU.10.5
reference: Deuteronomy 10:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וָֽ/אָשִׂם֙ אֶת הַ/לֻּחֹ֔ת בָּ/אָר֖וֹן אֲשֶׁ֣ר עָשִׂ֑יתִי וַ/יִּ֣הְיוּ שָׁ֔ם כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: vi
  text: Rồi tôi quay người và xuống khỏi núi, đặt các bảng ấy vào trong chiếc hòm mà tôi đã làm. Chúng ở đó[a], đúng như Yahweh đã truyền cho tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “và chúng đã ở đó”; cách diễn đạt này cũng có thể hàm ý rằng chúng vẫn còn ở đó cho đến lúc Môi-se nói.'
    reason: Giữ lại sắc thái thời gian có thể hiểu theo hơn một cách của וַיִּהְיוּ שָׁם.
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Rồi tôi quay người
  rationale: Động từ פנה có nghĩa là quay hoặc xoay người. “Rồi” thể hiện diễn tiến của lời kể, còn “quay người” tránh khiến người đọc hiểu là Môi-se quay trở lại một nơi trước đó.
- source_word: וָאֵרֵד מִן הָהָר
  choice: xuống khỏi núi
  rationale: ירד diễn tả chuyển động đi xuống; giới từ מִן chỉ điểm xuất phát. Cách nói này tự nhiên trong tiếng Việt và giữ mạo từ xác định của “núi” theo ngữ cảnh.
- source_word: וָאָשִׂם
  choice: đặt
  rationale: שׂים thường có nghĩa là đặt, để hoặc xếp. “Đặt” phù hợp với hành động có chủ ý và tự nhiên trong văn kể.
- source_word: הַלֻּחֹת
  choice: các bảng ấy
  rationale: לֻחוֹת là những bảng dùng để ghi khắc. “Các bảng ấy” dựa vào đối tượng đã được xác định trong ngữ cảnh mà không thêm “đá”, chi tiết không xuất hiện trong chính cụm từ này.
- source_word: בָּאָרוֹן
  choice: vào trong chiếc hòm
  rationale: אָרוֹן chỉ một chiếc hòm hoặc rương. Ở đây ngữ cảnh là hòm giao ước, nhưng bản dịch không thêm danh xưng đầy đủ vốn không có trong câu; “vào trong” diễn đạt tự nhiên chuyển động đặt các bảng vào hòm.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: mà tôi đã làm
  rationale: Mệnh đề quan hệ bổ nghĩa cho chiếc hòm; “đã làm” cho thấy việc làm hòm xảy ra trước hành động đặt các bảng vào đó.
- source_word: וַיִּהְיוּ שָׁם
  choice: Chúng ở đó
  rationale: היה kết hợp với שׁם diễn tả trạng thái hiện hữu tại đó. Cách dịch này giữ được độ mở về thời điểm, không bắt buộc phải hiểu chỉ là quá khứ hay nhấn mạnh rõ rằng chúng tiếp tục còn ở đó.
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: đúng như … đã truyền cho tôi
  rationale: כַּאֲשֶׁר diễn tả sự tương ứng chính xác, còn צוה với hậu tố ngôi thứ nhất số ít có nghĩa là “truyền cho tôi” hoặc “ra lệnh cho tôi”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tứ Tự YHWH, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. “Yahweh” bảo tồn chức năng tên riêng và không thay nó bằng tước hiệu.
- issue: Các bảng còn ở trong hòm đến thời điểm người nói hay chỉ từng ở đó
  choice: Chúng ở đó, kèm chú thích về sắc thái thời gian
  alternative: Chúng vẫn còn ở đó / Chúng đã ở đó
  rationale: וַיִּהְיוּ שָׁם có thể được thuật lại như một trạng thái trong quá khứ, đồng thời trong ngữ cảnh cũng có thể hàm ý trạng thái ấy kéo dài đến lúc nói. Bản chính không ép một cách hiểu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “quay người” để tránh nghĩa nhập nhằng của “quay lại”; dùng “chiếc hòm” thay vì tự thêm danh xưng “Hòm Giao Ước”. Đại từ “chúng” nối rõ với “các bảng ấy”.
