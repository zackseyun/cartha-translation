revisions:
- from: Rồi tôi quay người, xuống khỏi núi và đặt các bảng ấy vào trong chiếc hòm mà tôi đã làm. Chúng ở đó[a], đúng như Yahweh đã truyền cho tôi.
  to: Rồi tôi quay người và xuống khỏi núi, đặt các bảng ấy vào trong chiếc hòm mà tôi đã làm. Chúng ở đó[a], đúng như Yahweh đã truyền cho tôi.
  rationale: 'Chỉ sửa liên kết câu để tiếng Việt tự nhiên hơn: “quay người và xuống khỏi núi.” Các lựa chọn từ vựng và chú thích hiện có nhìn chung trung thành với nguyên văn, nên được giữ lại.'
