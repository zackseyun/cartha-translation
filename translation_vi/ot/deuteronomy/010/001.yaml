  edition: WLC
  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: vi
  text: 'Lúc ấy, Yahweh phán với tôi: “Hãy đẽo cho mình hai bảng đá giống như hai bảng trước, rồi lên núi, đến với Ta, và làm cho mình một hòm bằng gỗ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Lúc ấy
  rationale: Cách diễn đạt tự nhiên, gọn và giữ chức năng xác định thời điểm của cụm từ Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: פְּסָל
  choice: đẽo
  rationale: Động từ chỉ việc cắt, tạo hình đá; “đẽo” tự nhiên và chính xác trong ngữ cảnh làm các bảng đá.
- source_word: לְךָ
  choice: cho mình
  rationale: Giữ sắc thái phản thân hoặc thụ hưởng của đại từ mà vẫn tự nhiên trong lời nói trực tiếp tiếng Việt.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים כָּרִאשֹׁנִים
  choice: hai bảng đá giống như hai bảng trước
  rationale: Diễn đạt rõ vật liệu và sự tương ứng với hai bảng ban đầu; “trước” tự nhiên hơn “đầu tiên” trong mạch kể này.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: rồi lên núi đến với Ta
  rationale: Giữ cả chuyển động đi lên, đích là núi và hướng đến Đấng đang phán, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: và làm cho mình một Hòm bằng gỗ
  rationale: “Hòm” phù hợp với vật chứa các bảng giao ước; viết hoa để chỉ chiếc Hòm đặc thù trong ngữ cảnh thánh, còn “bằng gỗ” phản ánh trực tiếp cấu trúc nguyên ngữ.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; giữ “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Nghĩa của אֲרוֹן trong bối cảnh giao ước
  choice: Hòm
  alternative: rương
  rationale: “Hòm” vừa dễ hiểu vừa phù hợp với vật thánh dùng để chứa các bảng đá; “rương” dễ làm giảm sắc thái chuyên biệt của ngữ cảnh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “phán” và đại từ “Ta” để phù hợp lời trực tiếp của Đức Chúa Trời; tránh lối văn cổ. Không thêm chú thích vì các chú thích trong lớp tham khảo tiếng Anh bị lệch vị trí và chỉ lặp lại những biến thể diễn đạt không tạo khác biệt nội dung đáng kể trong tiếng Việt.
