reference: Deuteronomy 10:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הֵ֚ן לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/שָּׁמַ֖יִם וּ/שְׁמֵ֣י הַ/שָּׁמָ֑יִם הָ/אָ֖רֶץ וְ/כָל אֲשֶׁר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: vi
  text: Kìa, các tầng trời, cả những tầng trời cao nhất[a], trái đất và mọi vật trong đó đều thuộc về Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các tầng trời và các tầng trời của các tầng trời.”'
    reason: Giữ lại cấu trúc tăng cấp của tiếng Hê-bơ-rơ bên cạnh cách diễn đạt tự nhiên trong chính văn.
lexical_decisions:
- source_word: הֵן
  choice: Kìa
  rationale: Tiểu từ này kêu gọi sự chú ý và nhấn mạnh lời tuyên bố. “Kìa” giữ được sắc thái trang trọng mà vẫn quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: לַיהוָה
  choice: đều thuộc về Yahweh
  rationale: Tiền tố ל biểu thị quan hệ sở hữu; tiếng Việt cần diễn đạt vị ngữ hàm ẩn bằng “thuộc về”. Đặt “đều” sau toàn bộ danh sách giúp câu tự nhiên và làm rõ rằng mọi sự được kể ra đều thuộc quyền sở hữu của Yahweh.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Danh từ có hậu tố ngôi hai số ít, chỉ Đức Chúa Trời của người đang được Môi-se trực tiếp xưng hô. “Anh em” là cách xưng hô tự nhiên, trang trọng với cộng đồng Israel trong tiếng Việt, dù hình thái Hê-bơ-rơ là số ít đại diện.
- source_word: הַשָּׁמַיִם
  choice: các tầng trời
  rationale: Cách dịch này phản ánh hình thức số nhiều của tiếng Hê-bơ-rơ và phù hợp với phạm vi vũ trụ của câu hơn từ “bầu trời”.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: kể cả tầng trời cao nhất
  rationale: Cụm sở thuộc “trời của các tầng trời” có chức năng tăng cấp. “Kể cả tầng trời cao nhất” truyền đạt rõ ý nhấn mạnh trong tiếng Việt hiện đại; cách nói sát chữ được giữ trong chú thích.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Trong thế song song với các tầng trời và với mọi vật ở trong đó, từ này mang phạm vi toàn thể địa cầu; “đất” diễn đạt gọn và tự nhiên.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: và mọi vật trong đó
  rationale: Cụm quan hệ này bao gồm toàn bộ những gì ở trong đất/thế giới dưới trời; “mọi vật trong đó” vừa rõ nghĩa vừa gần cấu trúc nguồn.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יְהוָה. Giữ “Yahweh” phân biệt danh riêng này với tước hiệu và không thay nó bằng một danh xưng.
- issue: Phạm vi quyền sở hữu được khẳng định
  choice: Mọi tầng trời, đất và mọi vật trong đó đều thuộc về Yahweh
  alternative: Chỉ miền đất được hứa thuộc về Yahweh
  rationale: Thế song song giữa “các tầng trời” và “đất”, cùng cụm “mọi vật trong đó”, cho thấy lời tuyên bố có phạm vi vũ trụ chứ không chỉ nói về một vùng đất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp theo trật tự tự nhiên của tiếng Việt, đặt vị ngữ sở hữu ở cuối sau danh sách. “Kìa” duy trì lực nhấn mạnh; “anh em” dùng để xưng hô với Israel như một cộng đồng.
