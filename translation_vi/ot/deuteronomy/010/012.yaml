  to: Vậy bây giờ, hỡi Israel, Yahweh Đức Chúa Trời của anh em đòi hỏi anh em điều gì, ngoài việc kính sợ Yahweh Đức Chúa Trời của anh em, bước đi trong mọi đường lối của Ngài, yêu mến Ngài, và phụng sự Yahweh Đức Chúa Trời của anh em với hết lòng và hết cả con người mình[a]?
