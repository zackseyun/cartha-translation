reference: Deuteronomy 10:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: vi
  text: Vậy bây giờ, hỡi Israel, Yahweh Đức Chúa Trời của anh em đòi hỏi anh em điều gì, ngoài việc kính sợ Yahweh Đức Chúa Trời của anh em, bước đi trong mọi đường lối của Ngài, yêu mến Ngài, và phụng sự Yahweh Đức Chúa Trời của anh em với hết lòng và hết cả con người mình[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hết lòng và hết cả mạng sống mình” hoặc “hết lòng và hết linh hồn mình.” Từ Hê-bơ-rơ được dịch là “con người mình” có thể chỉ bản thân, sự sống hoặc linh hồn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả sắc thái nối kết của וְ và bước chuyển sang lời khuyên nhủ của עַתָּה; cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: đòi hỏi ... điều gì
  rationale: Trong cấu trúc với מֵעִם, שׁאל mang nghĩa yêu cầu có tính nghĩa vụ; “đòi hỏi” truyền đạt rõ lực của câu hỏi tu từ.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng thần thánh đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Đại từ hậu tố ngôi hai số ít hướng đến Israel như một cộng đồng thống nhất; tiếng Việt dùng “anh em” để xưng hô tự nhiên với toàn dân.
- source_word: כִּי אִם
  choice: ngoài việc
  rationale: Diễn đạt lực giới hạn “chỉ/ngoài điều này” và dẫn tự nhiên vào chuỗi động từ nguyên mẫu.
- source_word: לְיִרְאָה
  choice: kính sợ
  rationale: Giữ yếu tố sợ hãi đồng thời biểu đạt lòng tôn kính và kính úy trong bối cảnh giao ước.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: đi theo mọi đường lối của Ngài
  rationale: Bảo tồn ẩn dụ đạo đức “đi” nhưng dùng kết hợp từ tự nhiên hơn trong tiếng Việt.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: yêu mến Ngài
  rationale: Truyền đạt trực tiếp cả chiều kích tình cảm lẫn sự gắn bó trong giao ước.
- source_word: וְלַעֲבֹד
  choice: phụng sự
  rationale: Bao quát sự phục vụ, thờ phượng và vâng phục dành cho Đức Chúa Trời mà không thu hẹp vào nghi lễ.
- source_word: בְּכָל לְבָבְךָ
  choice: hết lòng
  rationale: Thành ngữ tiếng Việt tự nhiên diễn đạt sự dấn thân trọn vẹn của nội tâm, ý chí và tư tưởng.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: hết cả con người mình
  rationale: נֶפֶשׁ ở đây có thể chỉ sự sống, bản thân hay toàn thể con người; cách dịch này tự nhiên và tránh áp đặt nghĩa nhị nguyên của “linh hồn”.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản văn dùng trực tiếp danh riêng giao ước; vì thế giữ một dạng phiên âm quen thuộc trong tiếng Việt thay vì thay bằng tước hiệu.
- issue: Sắc thái của ירא trong lời khuyên giao ước
  choice: kính sợ
  alternative: tôn kính; sợ
  rationale: “Kính sợ” bảo tồn sự căng thẳng giữa nỗi sợ, lòng kính úy và sự vâng phục, không giản lược thành sự tôn trọng đơn thuần.
- issue: Phạm vi nghĩa của נֶפֶשׁ
  choice: cả con người mình
  alternative: linh hồn; mạng sống
  rationale: Trong công thức chỉ sự tận hiến toàn diện, từ này có thể nói đến bản thân hay sự sống; lựa chọn chính không áp đặt một nhân học phân đôi.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, trực tiếp nói với cộng đồng Israel. “Anh em” thể hiện lối xưng hô tập thể dù các hậu tố Hê-bơ-rơ ở số ít. Chuỗi yêu cầu được giữ cân đối, dễ đọc thành tiếng.
