    rationale: Theo quy ước dự án và dấu vết kiểm tra tiếng Anh, danh riêng này phải được phiên âm là “Yahweh”, không thay bằng một dạng phiên âm khác.
  - severity: low
    issue: Mốc chú thích [a] hiện đứng ở cuối cả câu.
    rationale: Chú thích chỉ liên quan đến נַפְשֶׁךָ (“con người mình”), nên cần đặt ngay sau cụm này để neo chú thích chính xác.
  - severity: low
    issue: “Đi theo mọi đường lối của Ngài” diễn giải nhẹ ẩn dụ “đi/bước đi trong mọi đường lối của Ngài”.
    rationale: Đổi thành “bước đi trong mọi đường lối” bảo tồn sát hơn hình ảnh đạo đức của לָלֶכֶת בְּכָל דְּרָכָיו mà vẫn là tiếng Việt tự nhiên.
