id: DEU.10.16
reference: Deuteronomy 10:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מַלְתֶּ֕ם אֵ֖ת עָרְלַ֣ת לְבַבְ/כֶ֑ם וְ/עָ֨רְפְּ/כֶ֔ם לֹ֥א תַקְשׁ֖וּ עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/016.yaml
  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: vi
  text: Vậy, anh em hãy cắt bỏ da quy đầu của lòng mình[a][b], và đừng cứng cổ nữa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và anh em hãy cắt bỏ da quy đầu của lòng mình.” Liên từ có thể chỉ đơn thuần nối tiếp, dù văn cảnh cũng hỗ trợ ý suy luận như “Vậy” hoặc “Vì thế.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ giữ nguyên phép ẩn dụ cụ thể: “da quy đầu của lòng anh em,” nói về việc loại bỏ sự chống nghịch Thiên Chúa từ bên trong.'
    reason: cultural_note
  - marker: c
    text: 'Dịch sát hơn: “đừng làm cổ mình cứng nữa”; cũng có thể hiểu là “đừng ngoan cố nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: Vậy, anh em hãy cắt bỏ
  rationale: Động từ Qal hoàn thành ngôi hai số nhiều, có liên từ וּ, mang lực khuyên truyền/mệnh lệnh trong văn cảnh. “Vậy” diễn đạt quan hệ suy luận với phần trước, còn “hãy cắt bỏ” truyền đạt hành động cắt bì một cách tự nhiên khi có “da quy đầu” làm bổ ngữ.
- source_word: עָרְלַת לְבַבְכֶם
  choice: da quy đầu của lòng mình
  rationale: Giữ nguyên hình ảnh cụ thể và cấu trúc sở hữu của tiếng Hê-bơ-rơ, thay vì diễn giải thành “sự cứng lòng” hay “lòng bất phục.” “Mình” quy chiếu tự nhiên về chủ thể số nhiều “anh em” trong tiếng Việt.
- source_word: לְבַבְכֶם
  choice: lòng mình
  rationale: לֵבָב chỉ con người bên trong, gồm ý chí và sự hiểu biết. “Lòng” là từ tiếng Việt tự nhiên, trang trọng và phù hợp với phép ẩn dụ tại đây.
- source_word: וְעָרְפְּכֶם
  choice: cổ
  rationale: עֹרֶף là cổ hoặc gáy. “Cứng cổ” là thành ngữ tiếng Việt dễ hiểu, vẫn giữ hình ảnh thân thể của nguyên văn.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: đừng cứng ... nữa
  rationale: Thể Hiphil của קשׁה diễn tả làm cho cứng; đi với “cổ,” câu tiếng Việt tự nhiên nhất là “đừng cứng cổ nữa.” עוֹד trong lời cấm được chuyển là “nữa.”
theological_decisions:
- issue: Ngôn ngữ giao ước mang tính ẩn dụ về phép cắt bì bên trong
  choice: Giữ rõ hình ảnh “cắt bỏ da quy đầu của lòng mình”
  alternative: Thanh tẩy lòng mình; loại bỏ sự ngoan cố trong lòng
  rationale: Nguyên văn dùng hình ảnh phép cắt bì để nói đến sự đáp ứng từ bên trong. Giữ phép ẩn dụ tránh thu hẹp câu vào một lối giải thích thần học riêng và duy trì mối liên hệ giữa dấu hiệu bên ngoài với sự vâng phục nội tâm.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện đối tượng số nhiều; “lòng mình” tránh lặp đại từ nặng nề. Hình ảnh “da quy đầu của lòng” được giữ vì có ý nghĩa giao ước, còn “cứng cổ” là thành ngữ tự nhiên trong tiếng Việt và vẫn phản ánh phép ẩn dụ Hê-bơ-rơ.
