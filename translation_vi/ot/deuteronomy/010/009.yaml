source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: vi
  text: Vì thế, Lê-vi không có phần hay cơ nghiệp cùng với anh em mình[a]; chính Yahweh là cơ nghiệp của Lê-vi[b], như Yahweh, Đức Chúa Trời của anh em, đã phán với Lê-vi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “với anh em mình”. Tên số ít “Lê-vi” đại diện cho bộ tộc Lê-vi, đối lập với các bộ tộc Israel khác.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Yahweh là phần của Lê-vi.” Nguyên văn lặp lại từ chỉ “cơ nghiệp” để nhấn mạnh rằng phần của Lê-vi không phải là đất đai, nhưng là chính Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ kết luận từ ngữ cảnh trước, đồng thời giữ lực suy luận của cụm Hê-bơ-rơ.
- source_word: לְלֵוִי
  choice: Lê-vi
  rationale: Giữ tên riêng số ít của nguyên văn; ở đây tên Lê-vi đại diện cho bộ tộc.
- source_word: חֵלֶק וְנַחֲלָה
  choice: phần hay cơ nghiệp
  rationale: 'Giữ hai danh từ phân biệt: חֵלֶק là phần được chia, còn נַחֲלָה là cơ nghiệp, đặc biệt gợi đến quyền sở hữu đất được truyền lại.'
- source_word: עִם אֶחָיו
  choice: chung với anh em mình
  rationale: “Chung với” diễn đạt tự nhiên việc Lê-vi không cùng nhận phần đất với các bộ tộc anh em; “anh em mình” giữ hình ảnh thân tộc của nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: הוּא נַחֲלָתוֹ
  choice: chính Yahweh là cơ nghiệp của người
  rationale: “Chính” phản ánh đại từ nhấn mạnh הוּא; lặp lại “cơ nghiệp” để giữ liên kết từ vựng và sự tương phản với cơ nghiệp đất đai.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: như ... đã phán
  rationale: Giữ nghĩa “như đã nói/phán”, không diễn giải thành “đã hứa”; “phán” phù hợp với chủ thể là Đức Chúa Trời.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Đại từ Hê-bơ-rơ ở số ít tập thể, nói với toàn dân Israel; tiếng Việt dùng “anh em” để thể hiện lời xưng hô cộng đồng một cách tự nhiên.
- source_word: לוֹ
  choice: với người
  rationale: Giữ đại từ số ít quy chiếu về Lê-vi với tư cách đại diện cho bộ tộc; “người” tránh lặp tên mà vẫn trang trọng.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה; “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Lê-vi là đại diện số ít cho bộ tộc
  choice: Lê-vi không có phần hay cơ nghiệp
  alternative: bộ tộc Lê-vi không có phần hay cơ nghiệp
  rationale: Giữ hình thức số ít của nguyên văn và giải thích ý nghĩa đại diện trong chú thích, thay vì đưa phần diễn giải vào câu chính.
- issue: Yahweh là נַחֲלָתוֹ của Lê-vi
  choice: chính Yahweh là cơ nghiệp của người
  alternative: Yahweh là phần của người
  rationale: 'Lặp “cơ nghiệp” theo nguyên văn, bảo tồn sự căng thẳng thần học: Lê-vi không có cơ nghiệp đất đai vì chính Yahweh là cơ nghiệp của họ.'
- issue: Quan hệ thân tộc אֶחָיו
  choice: anh em mình
  alternative: các bộ tộc anh em / đồng bào Israel
  rationale: Giữ cách nói thân tộc giống đực của nguyên văn, trong khi chú thích làm rõ rằng đây là các bộ tộc Israel khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cơ nghiệp” để giữ sắc thái đất được thừa hưởng trong bối cảnh phân chia Đất Hứa; dùng “người” cho đại từ chỉ Lê-vi nhằm duy trì cách trình bày số ít đại diện. Cụm “Đức Chúa Trời của anh em” thể hiện đại từ số ít tập thể của tiếng Hê-bơ-rơ bằng lối xưng hô cộng đồng tự nhiên trong tiếng Việt.
