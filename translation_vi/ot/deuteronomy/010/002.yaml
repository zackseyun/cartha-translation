source:
  edition: WLC
  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: vi
  text: Ta sẽ viết trên các bảng ấy những lời đã có trên các bảng đầu tiên[a] mà con đã đập vỡ; rồi con hãy đặt chúng vào hòm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các điều răn”; tiếng Hê-bơ-rơ là “những lời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: Ta sẽ viết
  rationale: Động từ Qal chưa hoàn thành ngôi thứ nhất số ít, trong lời Đức Chúa Trời phán, diễn tả hành động tương lai; “Ta sẽ viết” tự nhiên và trang trọng.
- source_word: הַלֻּחֹת
  choice: các bảng ấy
  rationale: לוח chỉ các bảng dùng để khắc chữ. Không thêm “đá” vì từ này không được lặp lại trong câu, dù chất liệu đã rõ từ ngữ cảnh câu trước.
- source_word: הַדְּבָרִים
  choice: những lời
  rationale: דבר có nghĩa rộng; ở đây là những lời giao ước được khắc trên bảng. “Những lời” bám sát tiếng Hê-bơ-rơ hơn “các điều răn” và giữ nguyên sắc thái của nguyên văn.
- source_word: אֲשֶׁר הָיוּ
  choice: đã có
  rationale: Mệnh đề quan hệ với היה nói rằng những lời ấy hiện diện trên các bảng trước; “đã có” tự nhiên trong tiếng Việt.
- source_word: הָרִאשֹׁנִים
  choice: đầu tiên
  rationale: Chỉ bộ bảng thứ nhất, đối lập với bộ bảng thay thế; “đầu tiên” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: שִׁבַּרְתָּ
  choice: con đã đập vỡ
  rationale: Dạng Piel hoàn thành ngôi thứ hai giống đực số ít của שבר diễn tả việc làm vỡ các bảng; “đập vỡ” phù hợp hành động có chủ ý trong mạch truyện.
- source_word: וְשַׂמְתָּם
  choice: rồi con phải đặt chúng
  rationale: Dạng hoàn thành nối tiếp mang lực mệnh lệnh trong chuỗi chỉ dẫn. “Đặt” tự nhiên, còn “chúng” giữ đại từ số nhiều và theo ngữ cảnh quy chiếu về các bảng.
- source_word: בָּאָרוֹן
  choice: vào trong Hòm Giao Ước
  rationale: אָרוֹן theo nghĩa đen là hòm/rương; trong ngữ cảnh này là chiếc hòm thánh được truyền làm ở câu 1. “Hòm Giao Ước” là cách gọi rõ ràng, quen thuộc bằng tiếng Việt, dù “Giao Ước” được xác định từ ngữ cảnh.
theological_decisions:
- issue: Từ quy chiếu của đại từ trong וְשַׂמְתָּם (“đặt chúng”)
  choice: “Chúng” quy chiếu về các bảng.
  alternative: “Chúng” có thể được hiểu là những lời/các điều răn viết trên bảng.
  rationale: Hậu tố giống đực số nhiều về ngữ pháp có thể quy chiếu đến cả “các bảng” lẫn “những lời”; tuy nhiên, hành động đặt vật vào hòm và mạch văn Phục Truyền Luật Lệ Ký 10:1–5 cho thấy các bảng là từ quy chiếu hợp lý nhất.
- issue: Cách gọi אָרוֹן
  choice: Hòm Giao Ước
  alternative: cái hòm
  rationale: Nguyên văn chỉ nói “hòm”, nhưng ngữ cảnh xác định đây là hòm thánh chứa các bảng giao ước. Cách gọi truyền thống giúp độc giả nhận diện vật này mà không áp đặt một lập trường hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Ta—con” cho lời Đức Chúa Trời phán trực tiếp với Môi-se. Dấu chấm phẩy làm rõ hai hành động nối tiếp mà vẫn giữ cấu trúc một câu của nguyên văn.
