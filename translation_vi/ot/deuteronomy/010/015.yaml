revisions:
- from: Nhưng Đức Giê-hô-va chỉ quyến luyến tổ phụ anh em để yêu thương họ, và Ngài đã chọn dòng dõi họ sau họ—tức là anh em—giữa mọi dân tộc, như ngày nay.
  to: Nhưng Yahweh chỉ đem lòng quyến luyến tổ phụ anh em để yêu thương họ, và Ngài đã chọn dòng dõi của họ sau này—tức là anh em—từ giữa mọi dân tộc, như ngày nay.
  rationale: Bản sửa thay danh riêng bằng «Yahweh» theo chuẩn POB, làm tự nhiên hơn cách diễn đạt של חָשַׁק và אַחֲרֵיהֶם, đồng thời giữ nguyên tính hạn định/tương phản của רַק, ngôn ngữ yêu thương và chọn lựa, thành phần đồng vị «anh em», cùng thành ngữ xác nhận thực trạng hiện tại «như ngày nay».
