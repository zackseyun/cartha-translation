source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: vi
  text: Nhưng Yahweh chỉ đem lòng quyến luyến tổ phụ anh em để yêu thương họ, và Ngài đã chọn dòng dõi của họ sau này—tức là anh em—từ giữa mọi dân tộc, như ngày nay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Nhưng ... chỉ
  rationale: Giữ cả sắc thái tương phản với câu trước lẫn ý nhấn mạnh, giới hạn của רַק; trật tự tiếng Việt được điều chỉnh cho tự nhiên.
- source_word: בַּאֲבֹתֶיךָ חָשַׁק
  choice: quyến luyến tổ phụ anh em
  rationale: חָשַׁק diễn tả sự gắn bó trìu mến và có chủ ý; “quyến luyến” tự nhiên, trang trọng và không làm mất sắc thái tình cảm.
- source_word: לְאַהֲבָה אֹתָם
  choice: để yêu thương họ
  rationale: Giữ trực tiếp cấu trúc nguyên mẫu chỉ mục đích hoặc kết quả, đồng thời bảo tồn từ ngữ về tình yêu.
- source_word: וַיִּבְחַר
  choice: và Ngài đã chọn
  rationale: “Chọn” là nghĩa trực tiếp, thông dụng của בחר và giữ nguyên sức nặng thần học của hành động lựa chọn.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: dòng dõi họ sau họ
  rationale: זֶרַע ở đây mang nghĩa tập thể là hậu duệ; “dòng dõi” vừa tự nhiên vừa giữ được sắc thái tập thể và sự nối tiếp thế hệ.
- source_word: בָּכֶם
  choice: tức là anh em
  rationale: Cụm này đồng vị, xác định “dòng dõi” chính là cộng đồng đang được nói với; “tức là” làm rõ quan hệ ngữ pháp mà không thêm nội dung.
- source_word: מִכָּל הָעַמִּים
  choice: giữa mọi dân tộc
  rationale: Diễn đạt tự nhiên ý được chọn ra từ giữa toàn thể các dân; עַמִּים là “các dân/dân tộc” hơn là các quốc gia chính trị.
- source_word: כַּיּוֹם הַזֶּה
  choice: như ngày nay
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ thực trạng hiện tại làm bằng chứng xác nhận.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng truyền thống, dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Ngôn ngữ về sự lựa chọn của Đức Chúa Trời
  choice: Giữ nguyên các ý quyến luyến, yêu thương và chọn lựa được nêu rõ trong câu.
  alternative: Giảm nhẹ thành sự ưu ái lịch sử đơn thuần, hoặc mở rộng thành một hệ thống giáo lý về sự tuyển chọn.
  rationale: Bản Hê-bơ-rơ khẳng định trực tiếp tình cảm, tình yêu và hành động chọn lựa của Đức Giê-hô-va, nhưng không giải thích thêm cơ chế hay phạm vi thần học của sự lựa chọn ấy.
- issue: Quan hệ giữa חָשַׁק và לְאַהֲבָה
  choice: Dịch “quyến luyến ... để yêu thương,” giữ khả năng mục đích hoặc kết quả.
  alternative: Gộp thành “đặt tình yêu nơi” hoặc diễn giải dứt khoát là “vui thích vì yêu.”
  rationale: Cấu trúc nguyên ngữ đặt động từ quyến luyến bên cạnh nguyên mẫu “để yêu,” tạo sắc thái có phần trùng ý nhưng giàu biểu cảm; không nên âm thầm giải quyết hoàn toàn quan hệ cú pháp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều chỉ cộng đồng giao ước; dấu gạch ngang đánh dấu thành phần đồng vị. Không cần chú thích vì các sắc thái chính được giữ ngay trong câu.
