    rationale: Ý cư trú trong cộng đồng phù hợp với trường nghĩa của גֵּר và thích hợp hơn ở chú thích, nhưng bản văn gốc chỉ lặp cùng một danh từ ở cả hai vế. Bản dịch nên giữ sự lặp lại từ vựng này.
