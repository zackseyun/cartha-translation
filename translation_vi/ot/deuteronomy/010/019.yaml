  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh yêu thương và lý do dựa trên kinh nghiệm của Israel tại Ai Cập. Tuy nhiên, cách mở rộng גֵּר ở vế đầu thành “người ngoại quốc sống giữa anh em” thêm một chi tiết diễn giải trực tiếp vào câu, trong khi vế sau lại rút về “người ngoại quốc,” làm giảm sự lặp lại nhất quán của cùng một từ Hê-bơ-rơ. “Người ngụ cư” giữ được nét cư trú của גֵּר và cho phép lặp lại nhất quán.
  naturalness: Câu sửa vẫn hiện đại, trang trọng và dễ hiểu. “Trong đất Ai Cập” là cách nói tự nhiên trong văn phong Kinh Thánh và phản ánh sát giới từ cùng danh từ “đất/xứ” trong tiếng Hê-bơ-rơ.
