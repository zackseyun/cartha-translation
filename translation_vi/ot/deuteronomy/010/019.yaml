base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: vi
  text: Vậy, hãy yêu thương người ngụ cư[a], vì anh em đã từng là người ngụ cư trong đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người ngoại quốc,” “ngoại kiều” hoặc “người xa lạ.” Từ Hê-bơ-rơ ger chỉ người không phải dân bản xứ đang cư trú giữa dân Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: Vậy, hãy yêu thương
  rationale: Động từ אהב mang nghĩa “yêu thương.” Liên từ ו nối mệnh lệnh này với việc Đức Chúa Trời yêu thương người ngoại quốc ở câu trước; “Vậy” diễn đạt tự nhiên cả mối liên hệ suy luận lẫn sức mạnh mệnh lệnh.
- source_word: הַ/גֵּר
  choice: người ngoại quốc sống giữa anh em
  rationale: גֵּר chỉ một người không phải dân bản xứ nhưng đang cư trú trong cộng đồng Israel, thường ở địa vị dễ bị tổn thương. Cách diễn đạt này tránh khiến người đọc hiểu là khách qua đường hoặc một người hoàn toàn xa lạ.
- source_word: כִּי
  choice: vì
  rationale: כִּי ở đây đưa ra lý do cho mệnh lệnh; “vì” là cách diễn đạt nhân quả rõ ràng và tự nhiên trong tiếng Việt.
- source_word: גֵרִים
  choice: người ngoại quốc
  rationale: Đây là dạng số nhiều của גֵּר. Tiếng Việt không bắt buộc đánh dấu số nhiều sau chủ ngữ “anh em”; lựa chọn này duy trì sự liên kết từ vựng với vế trước mà vẫn tự nhiên.
- source_word: הֱיִיתֶם
  choice: đã từng là
  rationale: Động từ היה ở đây nói về tình trạng của Israel trong quá khứ. “Đã từng là” làm rõ kinh nghiệm lịch sử được dùng làm nền tảng cho mệnh lệnh.
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: trên đất Ai Cập
  rationale: Giữ lại danh từ אֶרֶץ, “đất/xứ,” thay vì rút gọn thành “ở Ai Cập,” đồng thời tạo câu tiếng Việt tự nhiên và trang trọng.
theological_decisions:
- issue: Ý nghĩa xã hội của גֵּר trong luật giao ước
  choice: người ngoại quốc sống giữa anh em
  alternative: người ngoại kiều; khách ngụ cư; người xa lạ
  rationale: Mệnh lệnh dựa trên ký ức Israel từng sống như những người không thuộc dân bản xứ tại Ai Cập. Bản dịch nêu rõ cả nguồn gốc ngoại quốc lẫn việc cư trú trong cộng đồng, không áp đặt một phạm trù pháp lý hiện đại và cũng không làm từ này thành khách qua đường.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” diễn đạt tự nhiên đại từ số nhiều hướng đến cộng đồng Israel. Cụm “người ngoại quốc sống giữa anh em” dài hơn một thuật ngữ đơn lẻ nhưng truyền đạt chính xác địa vị cư trú của גֵּר và tránh sắc thái hành chính của “ngoại kiều.”
