  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: vi
  text: vâng giữ các điều răn của Yahweh và các luật lệ của Ngài mà hôm nay tôi truyền cho anh em, để ích lợi cho anh em chăng?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vâng giữ” cũng có thể dịch là “tuân giữ” hoặc “gìn giữ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: vâng giữ
  rationale: Động từ שׁמר trong văn cảnh giao ước vừa mang nghĩa tuân hành vừa hàm ý gìn giữ, chuyên tâm làm theo. “Vâng giữ” tự nhiên trong tiếng Việt và diễn đạt rõ sự tuân phục thực tế.
- source_word: מִצְוֺת
  choice: các điều răn
  rationale: Danh từ số nhiều chỉ những mệnh lệnh có tính ràng buộc của Yahweh; “các điều răn” giữ được sắc thái giao ước và pháp lý của Phục Truyền Luật Lệ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp trực tiếp với văn bản Hê-bơ-rơ.
- source_word: חֻקֹּתָיו
  choice: các luật lệ của Ngài
  rationale: חֻקִּים chỉ những quy định đã được ấn định; “luật lệ” rõ nghĩa trong tiếng Việt hiện đại và kết hợp tự nhiên với “điều răn”.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Mệnh đề quan hệ bổ nghĩa chung cho “các điều răn” và “các luật lệ”. “Hôm nay” được giữ ở vị trí nổi bật, còn “anh em” thể hiện người nghe là cộng đồng Israel dù đại từ Hê-bơ-rơ ở số ít tập thể.
- source_word: לְטוֹב לָךְ
  choice: vì ích lợi của chính anh em
  rationale: Thành ngữ diễn tả điều có lợi cho người nghe. “Của chính anh em” nhấn đúng đối tượng thụ hưởng mà không biến câu thành một lời hứa cụ thể về phước lành.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה; giữ “Yahweh” bảo toàn sự phân biệt giữa danh giao ước và tước hiệu.
- issue: Sắc thái của לְטוֹב לָךְ
  choice: vì ích lợi của chính anh em
  alternative: để anh em được phúc
  rationale: “Ích lợi” giữ nghĩa rộng của טוֹב và tránh thu hẹp câu thành phước lành vật chất hoặc một kết quả được định nghĩa quá cụ thể.
- issue: Số của người được nói với
  choice: anh em
  alternative: ngươi
  rationale: Hê-bơ-rơ dùng hình thức số ít nhưng Môi-se đang nói với Israel như một tập thể. “Anh em” tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại và thể hiện đối tượng cộng đồng; “ngươi” dễ tạo sắc thái cổ hoặc miệt thị trong cách dùng hiện nay.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc phụ thuộc của câu 10:13 vào câu hỏi mở đầu ở 10:12, nên kết thúc bằng “chăng?”. Đại từ “tôi” dành cho Môi-se và “anh em” dành cho Israel tránh lối xưng hô cổ “ta—ngươi” nhưng vẫn giữ sắc thái diễn từ giao ước.
