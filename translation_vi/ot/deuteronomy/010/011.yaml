  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: vi
  text: 'Yahweh phán với tôi: “Hãy đứng dậy, lên đường đi trước dân chúng[a], để họ đi vào và chiếm hữu đất mà Ta đã thề với tổ phụ họ[b] rằng Ta sẽ ban đất ấy cho họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy đứng dậy, lên đường ở trước dân chúng.” Cụm này có thể hàm ý Môi-se dẫn đầu dân chúng trong cuộc hành trình.'
    reason: Cụm לְמַסַּע לִפְנֵי הָעָם nói đến việc lên đường ở trước dân chúng; nghĩa dẫn đầu là sắc thái ngữ cảnh có thể có.
  - marker: b
    text: “Tổ phụ” cũng có thể dịch là “tổ tiên”; nguyên văn là “các cha của họ.”
    reason: אֲבֹתָם là danh từ số nhiều của “cha”; trong ngữ cảnh này từ ấy chỉ các tổ phụ lịch sử của dân Israel.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp trực tiếp với bản nguồn.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Trong lời kể, אמר có nghĩa là “nói”; với chủ thể là Đức Chúa Trời, “phán” tự nhiên và trang trọng trong tiếng Việt.
- source_word: קוּם לֵךְ לְמַסַּע
  choice: Hãy đứng dậy, lên đường
  rationale: Diễn đạt tự nhiên chuỗi mệnh lệnh đứng dậy và bắt đầu hành trình; מַסַּע chỉ việc khởi hành hoặc một chặng hành trình.
- source_word: לִפְנֵי הָעָם
  choice: đi trước dân chúng
  rationale: Giữ nghĩa không gian “ở phía trước” và vẫn để ngỏ sắc thái Môi-se dẫn đầu dân chúng.
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: để họ vào và chiếm hữu
  rationale: 'Giữ cả hai động từ: đi vào miền đất và nắm quyền sở hữu nó; “để” thể hiện quan hệ mục đích hoặc kết quả sau mệnh lệnh.'
- source_word: הָאָרֶץ
  choice: vùng đất
  rationale: Chỉ vùng đất đã được hứa ban; cách nói này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: נִשְׁבַּעְתִּי
  choice: Ta đã thề
  rationale: Giữ nguyên ngôn ngữ lời thề trang trọng của bản nguồn.
- source_word: לַאֲבֹתָם
  choice: với tổ phụ họ
  rationale: “Tổ phụ” giữ sắc thái nam giới và liên hệ lịch sử cụ thể của אָבוֹת, đồng thời tự nhiên hơn cách dịch sát chữ “các cha của họ”.
- source_word: לָתֵת לָהֶם
  choice: Ta sẽ ban cho họ
  rationale: Chuyển cấu trúc nguyên mẫu chỉ nội dung lời thề thành mệnh đề tiếng Việt tự nhiên, vẫn giữ rõ Đấng ban và người nhận.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ đây là danh riêng trong bản nguồn, không thay bằng tước hiệu và không lựa chọn một cách đọc mang tính hệ phái.
- issue: Ý nghĩa của לַאֲבֹתָם
  choice: tổ phụ họ
  alternative: tổ tiên họ
  rationale: Bản nguồn dùng danh từ giống đực số nhiều và trong ngữ cảnh nói đến các tổ phụ lịch sử; “tổ phụ” giữ đặc điểm ấy mà không thêm một nhận định thần học.
- issue: Quan hệ của וְיָבֹאוּ וְיִרְשׁוּ với mệnh lệnh trước đó
  choice: để họ vào và chiếm hữu
  alternative: rồi họ sẽ vào và chiếm hữu
  rationale: Dạng động từ có thể mang sắc thái mục đích hoặc kết quả. “Để” phù hợp mạch lời phán nhưng không biến hành động của dân thành một mệnh lệnh trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” thể hiện lời Đức Chúa Trời trong diễn ngôn trực tiếp. Câu giữ riêng hai hành động “vào” và “chiếm hữu,” tránh làm mờ chuyển động vào đất và việc nắm quyền sở hữu.
