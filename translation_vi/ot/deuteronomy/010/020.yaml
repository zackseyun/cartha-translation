source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א אֹת֣/וֹ תַעֲבֹ֑ד וּ/ב֣/וֹ תִדְבָּ֔ק וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: vi
  text: Ngươi phải kính sợ Giê-hô-va, Đức Chúa Trời của ngươi[a]; phụng sự Ngài, gắn bó với Ngài[b], và nhân danh Ngài mà thề.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải sợ Giê-hô-va, Đức Chúa Trời của ngươi”; động từ Hê-bơ-rơ thường bao hàm nỗi sợ đi đôi với lòng tôn kính trong bối cảnh giao ước.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bám chặt lấy Ngài” hoặc “giữ lòng gắn bó với Ngài”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng đã quen thuộc và dễ nhận biết trong tiếng Việt để biểu đạt Danh Giao Ước, thay vì thay bằng tước hiệu “CHÚA”.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Giữ rõ hậu tố sở hữu ngôi thứ hai số ít và sắc thái giao ước của lời trực tiếp nói với Israel.
- source_word: תִּירָא
  choice: phải kính sợ
  rationale: “Kính sợ” giữ được cả ý sợ và lòng tôn kính của ירא trong bối cảnh giao ước; “phải” thể hiện lực mệnh lệnh của thể chưa hoàn thành.
- source_word: אֹתוֹ תַעֲבֹד
  choice: chỉ phụng sự Ngài
  rationale: Đại từ tân ngữ được đưa lên trước trong tiếng Hê-bơ-rơ để nhấn mạnh tính độc hữu. “Chỉ” chuyển tải trọng tâm ấy; “phụng sự” vừa giữ nghĩa phục vụ vừa phù hợp bối cảnh thờ phượng.
- source_word: וּבוֹ תִדְבָּק
  choice: gắn bó với Ngài
  rationale: Động từ דבק diễn tả sự bám chặt và trung thành gắn kết; “gắn bó” tự nhiên trong tiếng Việt và giữ sắc thái quan hệ giao ước.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: nhân danh Ngài mà thề
  rationale: Đây là thành ngữ chỉ việc lấy danh của một người làm cơ sở cho lời thề; cách nói này tự nhiên và rõ nghĩa pháp lý–giao ước trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của ירא trong lời khuyên răn giao ước
  choice: kính sợ
  alternative: sợ
  rationale: “Kính sợ” không xóa yếu tố sợ hãi nhưng cũng biểu đạt sự tôn kính vốn có trong ngữ cảnh giao ước.
- issue: Tính độc hữu của việc phụng sự
  choice: chỉ phụng sự Ngài
  alternative: phụng sự Ngài
  rationale: Trật tự nhấn mạnh אֹתוֹ (“chính Ngài”) được diễn đạt tự nhiên bằng “chỉ”, nhưng không thêm một đối tượng hay giáo lý ngoài văn bản.
- issue: Lực mệnh lệnh của chuỗi động từ chưa hoàn thành
  choice: Dùng “phải” ở mệnh đề đầu để chi phối cả chuỗi bổn phận
  alternative: Lặp “phải” trước từng động từ
  rationale: Cách này giữ lực truyền lệnh của lời giao ước mà tránh nặng nề, đồng thời duy trì nhịp câu tiếng Việt tự nhiên.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; dùng đại từ số ít “ngươi” để giữ lời xưng hô trực tiếp của giao ước. Viết hoa “Ngài” theo quy ước tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
