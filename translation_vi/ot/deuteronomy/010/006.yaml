  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל נָֽסְע֛וּ מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַ/יִּקָּבֵ֣ר שָׁ֔ם וַ/יְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: vi
  text: Con dân Israel khởi hành từ Bê-ê-rốt Bê-nê Gia-a-can đến Mô-sê-ra.[a] Tại đó, A-rôn qua đời; cũng tại đó, ông được mai táng. Rồi Ê-lê-a-sa, con trai ông, làm thầy tế lễ thay ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Bê-ê-rốt Bê-nê Gia-a-can có thể hiểu theo nghĩa đen là “các giếng của các con trai Gia-a-can”; tại đây tên này được phiên âm như một địa danh.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ê-lê-a-sa, con trai ông, làm thầy tế lễ kế nhiệm ông.” Nguyên văn nói “thay ông”, hàm ý sự kế nhiệm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: Con dân Israel
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “con cái Israel”, chỉ toàn dân với sắc thái nguồn gốc dân tộc. “Con dân Israel” tự nhiên và trang trọng trong tiếng Việt hiện đại; không thêm từ nối ở đầu câu vì ו có thể chỉ mang chức năng liên kết diễn ngôn.
- source_word: נָסְעוּ
  choice: khởi hành
  rationale: Động từ נסע trong hành trình nơi hoang mạc thường chỉ việc nhổ trại và lên đường; “khởi hành” giữ được nét nghĩa ấy rõ hơn “đi” hoặc “du hành”.
- source_word: מִ/בְּאֵרֹת בְּנֵי יַעֲקָן
  choice: từ Bê-ê-rốt Bê-nê Gia-a-can
  rationale: Đây là địa danh trong lộ trình nên được phiên âm thay vì dịch nghĩa; giới từ מִן được dịch là “từ”.
- source_word: מוֹסֵרָה
  choice: đến Mô-sê-ra
  rationale: Dù nguyên văn không có giới từ chỉ đích đến, công thức hành trình sau “từ” đòi hỏi đích đến; tiếng Việt tự nhiên bổ sung “đến”.
- source_word: שָׁם
  choice: Tại đó
  rationale: Trạng từ địa điểm được đặt đầu mệnh đề để giữ sự nhấn mạnh của nguyên văn. Lần xuất hiện thứ hai được thể hiện gọn qua cấu trúc cùng địa điểm, tránh câu tiếng Việt nặng nề.
- source_word: מֵת אַהֲרֹן
  choice: A-rôn qua đời
  rationale: Đảo trật tự sang chủ ngữ–động từ cho tự nhiên trong tiếng Việt; “qua đời” trang trọng nhưng vẫn rõ nghĩa.
- source_word: וַ/יִּקָּבֵר
  choice: được mai táng
  rationale: Thể Niphal được giữ ở nghĩa bị động; không chuyển thành chủ động với một chủ thể số nhiều không có trong văn bản.
- source_word: וַ/יְכַהֵן
  choice: làm thầy tế lễ
  rationale: Động từ כהן chỉ việc thi hành chức vụ tế lễ. “Làm thầy tế lễ” rõ ràng và tự nhiên, không thu hẹp nghĩa thành chỉ việc nhậm chức.
- source_word: אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: Ê-lê-a-sa, con trai ông, làm thầy tế lễ thay ông
  rationale: תַּחְתָּיו có nghĩa “ở vị trí của ông/thay ông”, diễn tả sự kế nhiệm. “Thay ông” tự nhiên trong tiếng Việt và vẫn giữ ý kế vị.
