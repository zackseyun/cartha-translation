  text: וָ/אַ֤עַשׂ אֲרוֹן֙ עֲצֵ֣י שִׁטִּ֔ים וָ/אֶפְסֹ֛ל שְׁנֵי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וָ/אַ֣עַל הָ/הָ֔רָ/ה וּ/שְׁנֵ֥י הַ/לֻּחֹ֖ת בְּ/יָדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: vi
  text: Vậy tôi làm một hòm bằng gỗ keo, đẽo hai bảng đá giống như hai bảng trước[a], rồi tôi đi lên núi với hai bảng ấy trong tay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “đục hai bảng đá giống như hai bảng trước.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: hòm
  rationale: Từ này chỉ một vật chứa dạng hòm. Trong tiếng Việt hiện đại, “hòm” vừa sát nghĩa cụ thể vừa phù hợp với chiếc hòm dùng để chứa các bảng giao ước; câu này chưa dùng danh xưng đầy đủ “Hòm Giao Ước”.
- source_word: עֲצֵי שִׁטִּים
  choice: gỗ keo
  rationale: Cụm từ chỉ loại gỗ cây acacia; “gỗ keo” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: וָאֶפְסֹל
  choice: đẽo
  rationale: Động từ פסל ở đây diễn tả việc cắt, gọt và tạo hình các bảng đá. “Đẽo” truyền đạt rõ thao tác gia công đá hơn từ khái quát “cắt”.
- source_word: לֻחֹת אֲבָנִים
  choice: bảng đá
  rationale: “Bảng đá” là cách diễn đạt gọn, tự nhiên và giữ đúng ý các tấm bảng làm bằng đá.
- source_word: כָּרִאשֹׁנִים
  choice: giống như hai bảng trước
  rationale: Dạng so sánh nói rằng hai bảng mới tương ứng với các bảng ban đầu. Thêm “hai bảng” theo ngữ cảnh giúp tiếng Việt rõ ràng mà không đổi nghĩa.
- source_word: וָאַעַל הָהָרָה
  choice: rồi lên núi
  rationale: Động từ עלה cùng dạng chỉ hướng diễn tả chuyển động đi lên núi; “lên núi” tự nhiên và chính xác trong tiếng Việt.
- source_word: בְּיָדִי
  choice: tay cầm
  rationale: Nguyên văn dùng số ít, nghĩa đen là “trong tay tôi”. “Tay cầm” giữ sắc thái số ít và diễn đạt tự nhiên hành động mang theo.
- source_word: וָאַעַשׂ
  choice: tôi làm
  rationale: עשה là động từ rộng nghĩa “làm, tạo nên”; “tôi làm” là cách dịch trực tiếp và phù hợp với chuỗi hành động.
theological_decisions:
- issue: Cách gọi vật chứa các bảng giao ước
  choice: hòm
  alternative: Hòm Giao Ước; rương
  rationale: “Hòm” phản ánh nghĩa thông thường của אֲרוֹן mà không thêm danh xưng đầy đủ vốn không xuất hiện trong câu. Cách dịch này vẫn giữ được liên hệ với vật thánh trong văn cảnh và tránh đưa thêm diễn giải thần học.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Vậy” để nối với mệnh lệnh và lời kể trước đó; cấu trúc “tay cầm” gọn, tự nhiên, đồng thời giữ hình ảnh số ít của nguyên văn.
