  text: ה֥וּא תְהִלָּתְ/ךָ֖ וְ/ה֣וּא אֱלֹהֶ֑י/ךָ אֲשֶׁר עָשָׂ֣ה אִתְּ/ךָ֗ אֶת הַ/גְּדֹלֹ֤ת וְ/אֶת הַ/נּֽוֹרָאֹת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר רָא֖וּ עֵינֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: vi
  text: Ngài là niềm ca ngợi của anh em[a], và Ngài là Đức Chúa Trời của anh em, Đấng đã làm cho anh em những việc lớn lao và đáng kính sợ này mà chính mắt anh em đã thấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng anh em ca ngợi” hoặc “niềm tự hào của anh em”. Nguyên văn tiếng Hê-bơ-rơ là: “niềm ca ngợi của anh em”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: niềm ca ngợi của anh em
  rationale: Giữ lối diễn đạt cô đọng của tiếng Hê-bơ-rơ, theo đó Đức Chúa Trời vừa là đối tượng vừa là căn nguyên cho lời ca ngợi của Ít-ra-ên.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cách dịch giao ước tự nhiên trong tiếng Việt; đại từ số ít tiếng Hê-bơ-rơ nói với Ít-ra-ên như một cộng đồng được chuyển thành cách xưng hô tập thể phù hợp với văn cảnh.
- source_word: עָשָׂה אִתְּךָ
  choice: đã làm cho anh em
  rationale: Diễn đạt ý nghĩa thụ hưởng của thành ngữ, chỉ những việc Đức Chúa Trời thực hiện vì lợi ích của Ít-ra-ên.
- source_word: הַגְּדֹלֹת
  choice: những việc lớn lao
  rationale: Tính từ được dùng như danh từ; cách dịch này giữ nghĩa rộng, không thu hẹp chỉ vào quyền năng.
- source_word: הַנּוֹרָאוֹת
  choice: đáng kính sợ
  rationale: Bao hàm cả sự sợ hãi lẫn lòng kính phục mà các việc của Đức Chúa Trời khơi dậy, không làm nhẹ hoặc giới hạn từ này vào nỗi kinh hoàng.
- source_word: רָאוּ עֵינֶיךָ
  choice: chính mắt anh em đã thấy
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ sự nhấn mạnh vào kinh nghiệm tận mắt chứng kiến.
- source_word: הוּא ... וְהוּא
  choice: Ngài là ... và Ngài là ...
  rationale: Lặp lại chủ ngữ để bảo tồn sự nhấn mạnh của nguyên văn mà không thêm ý độc quyền vốn không được nói rõ.
theological_decisions:
- issue: Cách hiểu cụm vị ngữ הוּא תְהִלָּתְךָ
  choice: Ngài là niềm ca ngợi của anh em
  alternative: Ngài là Đấng anh em ca ngợi; Ngài là niềm tự hào của anh em
  rationale: 'Giữ nguyên sức nén và sự căng nghĩa thần học của tiếng Hê-bơ-rơ: Đức Chúa Trời vừa là đối tượng, vừa là căn nguyên của lời ca ngợi.'
- issue: Sắc thái của הַנּוֹרָאוֹת
  choice: đáng kính sợ
  alternative: gây kinh hãi; khiến người ta kinh sợ
  rationale: Bảo tồn phạm vi nghĩa gồm sợ hãi và kính phục, phù hợp với những đại sự Ít-ra-ên đã tận mắt chứng kiến mà không biến từ này thành chỉ sự kinh hoàng tiêu cực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với toàn thể Ít-ra-ên, tương ứng với đại từ số ít mang tính cộng đồng trong nguyên văn. “Đáng kính sợ” giữ sắc thái trang nghiêm của ירא; cấu trúc lặp “Ngài là ... và Ngài là ...” bảo tồn điểm nhấn của câu.
