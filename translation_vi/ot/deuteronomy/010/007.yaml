translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lộ trình ngắn gọn của nguyên văn; phiên âm địa danh theo âm Hê-bơ-rơ ở dạng phù hợp với cách đọc tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
