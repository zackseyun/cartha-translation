base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: vi
  text: Từ đó, họ lên đường đến Gút-gô-đa, rồi từ Gút-gô-đa đến Giốt-ba-tha, một vùng đất có các dòng suối.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một vùng đất có các khe suối” hoặc “một vùng đất có những lòng suối có dòng nước chảy.” Cụm từ Hê-bơ-rơ נַחֲלֵי מָיִם chỉ các dòng chảy, khe suối hoặc lòng suối có nước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Từ đó
  rationale: Diễn đạt tự nhiên quan hệ không gian với địa điểm vừa được nhắc đến.
- source_word: נָסְעוּ
  choice: họ lên đường
  rationale: Trong hành trình nơi hoang mạc, נסע thường chỉ việc nhổ trại và khởi hành; “lên đường” giữ được sắc thái ấy.
- source_word: הַגֻּדְגֹּדָה
  choice: Gút-gô-đa
  rationale: Phiên âm địa danh Hê-bơ-rơ sang tiếng Việt, có dấu và gạch nối để dễ đọc.
- source_word: וּמִן
  choice: rồi từ
  rationale: Tiếp nối lộ trình một cách tự nhiên trong tiếng Việt; “rồi” thể hiện trình tự vốn rõ trong danh sách hành trình mà không thêm quan hệ nhân quả.
- source_word: יָטְבָתָה
  choice: Giốt-ba-tha
  rationale: Phiên âm địa danh Hê-bơ-rơ theo cách đọc dễ tiếp cận đối với độc giả Việt.
- source_word: אֶרֶץ
  choice: một vùng đất
  rationale: Ở đây אֶרֶץ mô tả Giốt-ba-tha; “vùng đất” tự nhiên hơn “xứ” và không gợi một thực thể chính trị.
- source_word: נַחֲלֵי מָיִם
  choice: có nhiều dòng nước
  rationale: נַחֲלֵי là dạng số nhiều, chỉ các dòng chảy, khe suối hoặc lòng suối có nước. “Có nhiều dòng nước” rõ nghĩa, tự nhiên và giữ được hình ảnh địa hình.
