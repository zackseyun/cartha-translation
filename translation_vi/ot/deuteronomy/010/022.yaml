  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và ý chính của nguyên văn: các tổ phụ đi xuống Ai Cập với số người là bảy mươi, rồi Yahweh khiến Israel đông đúc như sao trời. Tuy nhiên, “chỉ” thêm một mức độ hạn định không được nói trực tiếp trong tiếng Hebrew, dù sự tương phản có hàm ý; nên bỏ để giữ mức độ phát biểu của nguồn. Dấu phẩy quanh cụm đồng vị “Đức Chúa Trời của anh em” cũng cần thiết để xác định rõ Yahweh là chủ ngữ.'
  naturalness: “Tổ phụ của anh em” tự nhiên và rõ quan hệ sở hữu hơn “Tổ phụ anh em”. Câu chỉnh sửa vẫn giữ văn phong hiện đại, trang trọng và dễ đọc. “Đông như sao trên trời” là thành ngữ tự nhiên trong tiếng Việt.
  terminology: “Tổ phụ” phù hợp với אֲבֹתֶיךָ, bảo lưu quy chiếu các bậc cha ông nam giới mà không dùng lối xưng hô cổ “ngươi”. “Yahweh” được giữ theo chính sách dự án; “Đức Chúa Trời của anh em” là cách diễn đạt chuẩn. Chú thích c được sửa để không biến số nhiều hình thức của הַשָּׁמַיִם thành khẳng định về “các tầng trời”.
