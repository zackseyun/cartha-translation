  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: vi
  text: Tổ phụ[a] của anh em đã xuống Ai Cập, cả thảy có bảy mươi người[b]; còn bây giờ, Yahweh, Đức Chúa Trời của anh em, đã làm cho anh em đông như sao trên trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cha ông” hoặc “tổ tiên”; nguyên văn nói “các cha”, chỉ các bậc tiền nhân nam giới.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “bảy mươi linh hồn”; từ Hebrew נֶפֶשׁ ở đây là cách đếm người.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “như các vì sao trên trời”; ý so sánh nhấn mạnh số lượng đông đảo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: cả thảy chỉ có bảy mươi người
  rationale: נֶפֶשׁ ở đây là từ dùng để đếm người, không nhấn mạnh một phần phi vật chất của con người. “Cả thảy chỉ có” diễn đạt tự nhiên con số khởi đầu ít ỏi và làm rõ sự tương phản với tình trạng đông đảo hiện nay.
- source_word: יָרְדוּ
  choice: đã xuống
  rationale: Giữ nguyên động từ chỉ hướng ירד và lối nói quen thuộc về hành trình xuống Ai Cập.
- source_word: אֲבֹתֶיךָ
  choice: tổ phụ anh em
  rationale: “Tổ phụ” giữ sắc thái nam tính và chỉ các bậc cha ông của Israel; “anh em” diễn đạt tự nhiên đại từ số ít tập thể hướng đến dân Israel.
- source_word: מִצְרָיְמָה
  choice: xuống Ai Cập
  rationale: Hậu tố chỉ hướng biểu thị chuyển động đến Ai Cập; tiếng Việt không cần thêm giới từ sau “xuống”.
- source_word: וְעַתָּה
  choice: còn bây giờ
  rationale: Diễn đạt cả sự nối kết lẫn nét tương phản giữa con số ít ban đầu và dân số đông đảo hiện tại mà không biến liên từ thành một đối lập quá mạnh.
- source_word: שָׂמְךָ
  choice: đã làm cho anh em
  rationale: Trong ngữ cảnh này, שׂים có nghĩa kết quả là khiến dân trở nên đông đảo; cách dịch này tự nhiên hơn “đặt anh em”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cách diễn đạt trang trọng, rõ nghĩa và tự nhiên trong tiếng Việt; đại từ được hiểu theo nghĩa tập thể.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: đông như sao trên trời
  rationale: Kết hợp hình ảnh so sánh với לָרֹב để diễn đạt rõ sự đông đảo về số lượng, đồng thời giữ hình ảnh sao trời của nguyên văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Chuyển tự “Yahweh” giữ đây là danh riêng và không thay bằng một tước hiệu.
- issue: Từ chỉ tổ tiên mang giống đực אֲבֹתֶיךָ
  choice: tổ phụ anh em
  alternative: tổ tiên anh em; cha ông anh em
  rationale: “Tổ phụ” bảo toàn nét nam tính của אבות và phù hợp với các bậc cha ông của Israel, trong khi vẫn dễ hiểu trong văn phong Kinh Thánh hiện đại.
- issue: Đại từ số ít tập thể ngôi thứ hai
  choice: anh em
  alternative: ngươi
  rationale: Các hậu tố Hebrew ở số ít vì Môi-se nói với Israel như một cộng đồng thống nhất. Tiếng Việt tự nhiên dùng “anh em” để nói với toàn dân, tránh làm người đọc hiểu nhầm rằng câu chỉ hướng đến một cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Tổ phụ” giữ sắc thái của nguyên văn nhưng vẫn quen thuộc; “anh em” thể hiện đối tượng tập thể là Israel. Cấu trúc có dấu chấm phẩy làm nổi bật sự tương phản giữa bảy mươi người ban đầu và dân số đông đảo hiện tại.
