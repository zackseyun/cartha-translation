  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: vi
  text: Nếu có một vụ việc quá khó để anh em xét xử—giữa vụ đổ máu này với vụ đổ máu khác[a], giữa vụ kiện này với vụ kiện khác[b], hay giữa thương tích này với thương tích khác[c]—tức là những vụ tranh chấp tại cổng thành của anh em[d], thì anh em phải đứng dậy và đi lên nơi mà Yahweh, Đức Chúa Trời của anh em, sẽ chọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “giữa máu với máu”; cụm này nói đến việc phân biệt các vụ án đổ máu, có thể gồm những vụ giết người hoặc mắc nợ máu.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “giữa yêu sách pháp lý này với yêu sách pháp lý khác” hoặc “giữa vụ án này với vụ án khác”.'
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ cũng có thể chỉ vết đánh, tai họa, bệnh trạng hoặc bệnh dịch.
    reason: lexical_alternative
  - marker: d
    text: Cổng thành là nơi người ta thường nhóm họp để xét xử các vụ việc địa phương.
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא
  choice: quá khó
  rationale: Dạng Niphal của פלא trong văn cảnh xét xử chỉ điều vượt quá khả năng phân xử, nên “quá khó” vừa tự nhiên vừa đúng chức năng pháp lý.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: một vụ việc ... xét xử
  rationale: דָבָר có nghĩa rộng là sự việc hoặc vụ việc; kết hợp với מִשְׁפָּט, cụm này chỉ một vụ cần được phân xử.
- source_word: בֵּין דָּם לְדָם
  choice: giữa vụ đổ máu này với vụ đổ máu khác
  rationale: Giữ hình ảnh cụ thể của nguyên văn “giữa máu với máu”, đồng thời làm rõ đây là các vụ án liên quan đến đổ máu.
- source_word: בֵּין דִּין לְדִין
  choice: giữa vụ kiện này với vụ kiện khác
  rationale: דִּין có thể chỉ vụ kiện, yêu sách pháp lý hoặc phán quyết. “Vụ kiện” phù hợp ngữ cảnh tư pháp mà không quyết định quá hẹp loại tranh chấp.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: giữa thương tích này với thương tích khác
  rationale: נֶגַע có thể là vết đánh, thương tích, tai họa hay bệnh trạng. Trong danh sách pháp lý này, “thương tích” là cách hiểu tự nhiên, còn các nghĩa khác được giữ trong chú thích.
- source_word: דִּבְרֵי רִיבֹת
  choice: những vụ tranh chấp
  rationale: Cụm từ nói đến các vấn đề gây tranh tụng; “những vụ tranh chấp” gọn, hiện đại và giữ sắc thái pháp lý.
- source_word: בִּשְׁעָרֶיךָ
  choice: tại cổng thành của anh em
  rationale: Giữ danh từ “cổng” của nguyên văn và thêm “thành” để độc giả Việt hiểu đây là cổng đô thị, nơi thường diễn ra việc xét xử.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: phải đứng dậy và đi lên
  rationale: Giữ cả hai động từ, gồm hành động dứt khoát đứng lên và sắc thái đi lên đến địa điểm trung ương.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: nơi mà ... sẽ chọn
  rationale: Thể vị hoàn thành chưa hoàn tất (yiqtol) hướng tới địa điểm Yahweh sẽ chỉ định, nên dùng thì tương lai “sẽ chọn”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng trong nguyên văn thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn trực tiếp dùng Danh Thánh יהוה; “Yahweh” bảo tồn tính chất danh riêng và không thay bằng một tước hiệu.
- issue: Phạm vi nghĩa của נֶגַע
  choice: thương tích
  alternative: tai họa; bệnh trạng; vết đánh
  rationale: Ngữ cảnh tư pháp nghiêng về thương tích thân thể, nhưng từ Hê-bơ-rơ vẫn có phạm vi nghĩa rộng hơn; chú thích bảo tồn sự mơ hồ này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh em” cho ngôi thứ hai số ít mang nghĩa tập thể của Hê-bơ-rơ. Cấu trúc liệt kê được giữ để phản ánh nhịp điệu pháp lý của nguyên văn; dấu gạch ngang giúp câu dài vẫn dễ hiểu.
