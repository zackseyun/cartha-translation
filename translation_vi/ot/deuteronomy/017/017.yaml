base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: vi
  text: Vua không được lấy nhiều vợ cho mình[a], kẻo lòng vua quay đi; cũng không được tích trữ quá nhiều bạc vàng cho mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và lòng vua không được quay đi.” Tiếng Hê-bơ-rơ có thể được hiểu đây là một lệnh cấm ngang hàng, thay vì một mệnh đề nêu hậu quả hay mục đích rõ rệt.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה לּוֹ נָשִׁים
  choice: lấy nhiều vợ cho mình
  rationale: Trong quy định dành cho vua, נָשִׁים chỉ những người vợ. Tiếng Việt tự nhiên dùng “lấy nhiều vợ” để diễn đạt việc gia tăng số vợ, còn “cho mình” giữ sắc thái vị lợi của לּוֹ.
- source_word: יָסוּר לְבָבוֹ
  choice: lòng vua lìa lạc
  rationale: סור mang nghĩa quay lệch hoặc lìa khỏi đường đúng; “lìa lạc” giữ hình ảnh về sự chệch hướng mà không thêm một đối tượng không có trong nguyên văn. Lְבָבוֹ được diễn đạt là “lòng vua” để rõ chủ thể trong tiếng Việt.
- source_word: כֶסֶף וְזָהָב
  choice: bạc vàng
  rationale: Giữ hai danh từ cụ thể và cặp từ quen thuộc trong tiếng Việt, không khái quát hóa thành “tiền của” hay “tài sản”.
- source_word: יַרְבֶּה לּוֹ מְאֹד
  choice: tích trữ quá nhiều ... cho mình
  rationale: Ở vế nói về kim loại quý, “tích trữ” diễn đạt tự nhiên hành động làm cho của cải tăng lên; “quá nhiều” thể hiện sức nhấn của מְאֹד và tính chất vượt mức của điều bị cấm.
- source_word: וְלֹא ... וְלֹא ... לֹא
  choice: không được ... kẻo ... cũng không được
  rationale: “Không được” phù hợp văn phong luật định hiện đại; “kẻo” diễn đạt tự nhiên quan hệ cảnh báo về hậu quả có thể xảy ra, còn “cũng” nối hai lệnh cấm chính.
theological_decisions:
- issue: Quan hệ giữa việc lấy nhiều vợ và việc lòng vua lìa lạc
  choice: 'Dịch mệnh đề giữa như lời cảnh báo về hậu quả: “kẻo lòng vua lìa lạc”.'
  alternative: “và lòng vua không được lìa lạc” như một lệnh cấm ngang hàng.
  rationale: Cú pháp Hê-bơ-rơ cho phép hiểu là hậu quả/mục đích hoặc là một lệnh cấm phối hợp. “Kẻo” phản ánh mạch cảnh báo tự nhiên nhưng chú thích vẫn bảo tồn cách đọc phối hợp; không thêm đối tượng như “khỏi Đức Chúa Trời” vì nguyên văn không nêu.
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại, dùng “vua” thay cho đại từ dễ mơ hồ. Cấu trúc cân đối giữa hai điều cấm và tránh thêm đối tượng thần học không được nêu trong câu.
