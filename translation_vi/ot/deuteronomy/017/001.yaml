source:
  edition: WLC
  text: לֹא תִזְבַּח֩ לַ/יהוָ֨ה אֱלֹהֶ֜י/ךָ שׁ֣וֹר וָ/שֶׂ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם כֹּ֖ל דָּבָ֣ר רָ֑ע כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: vi
  text: Anh em không được dâng cho Yahweh, Đức Chúa Trời của anh em, một con bò hay một con vật thuộc bầy chiên hoặc dê có tì vết, tức là có bất cứ điều gì xấu, vì đó là điều ghê tởm đối với Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִזְבַּח
  choice: dâng
  rationale: Trong ngữ cảnh tế lễ, động từ זבח chỉ việc dâng con vật làm sinh tế; “dâng” tự nhiên trong tiếng Việt và không chỉ đơn thuần là giết.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ nguyên danh giao ước יהוה bằng dạng chuyển tự “Yahweh”; giới từ ל diễn tả đối tượng tiếp nhận lễ vật.
- source_word: שׁוֹר
  choice: một con bò
  rationale: שׁוֹר là một cá thể thuộc đại gia súc; “con bò” tự nhiên và không xác định giới tính quá mức như “bò đực”.
- source_word: שֶׂה
  choice: một con vật trong bầy chiên dê
  rationale: שֶׂה rộng hơn “chiên”, có thể chỉ cá thể thuộc bầy chiên hoặc dê; cách dịch này giữ đúng phạm vi nghĩa của tiếng Hê-bơ-rơ.
- source_word: מוּם
  choice: tì vết
  rationale: “Tì vết” là cách nói trang trọng, quen thuộc trong ngữ cảnh lễ vật, chỉ khuyết điểm khiến con vật không đủ điều kiện để dâng.
- source_word: כֹּל דָּבָר רָע
  choice: tức bất cứ khuyết tật nào
  rationale: Cụm từ theo sát mặt chữ là “bất cứ điều xấu nào”, nhưng trong cấu trúc đồng vị ở đây nó giải thích מוּם; “khuyết tật” truyền đạt đúng ý trong tiếng Việt mà không gán mức độ nghiêm trọng không có trong nguyên văn.
- source_word: תוֹעֲבַת
  choice: điều ghê tởm
  rationale: תּוֹעֵבָה diễn tả điều đáng ghê tởm trước mặt Đức Chúa Trời; cách dịch này giữ được sức nặng đạo đức và nghi lễ của từ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; chuyển tự “Yahweh” bảo tồn danh riêng mà không thay bằng một tước hiệu.
- issue: Phạm vi của שֶׂה
  choice: con vật trong bầy chiên dê
  alternative: con chiên
  rationale: Không thu hẹp từ Hê-bơ-rơ vào riêng loài chiên, vì từ này có thể chỉ cả chiên lẫn dê trong đàn vật nhỏ.
- issue: Quan hệ của כֹּל דָּבָר רָע với מוּם
  choice: 'cụm giải thích đồng vị: “tức bất cứ khuyết tật nào”'
  alternative: một điều xấu nào
  rationale: Ngữ cảnh luật tế lễ cho thấy cụm này triển khai ý “tì vết”; vẫn không thêm tiêu chuẩn “nghiêm trọng” vốn không được nêu trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho hậu tố ngôi hai số ít giống đực trong lời luật hướng đến từng thành viên của cộng đồng; giữ danh riêng Yahweh. Dấu [a] được đặt ngay sau cụm từ cần chú thích.
