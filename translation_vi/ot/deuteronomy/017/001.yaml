  - severity: low
    issue: Chú thích [a] lặp lại thông tin đã được nêu trong bản văn chính.
    rationale: Bản văn đã dịch שֶׂה là “con vật thuộc bầy chiên hoặc dê,” nên không còn một lựa chọn từ ngữ hẹp nào cần chú thích để bảo toàn nghĩa rộng của từ Hê-bơ-rơ.
