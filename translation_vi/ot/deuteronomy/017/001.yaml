  to: Anh em không được dâng cho Yahweh, Đức Chúa Trời của anh em, một con bò hay một con vật thuộc bầy chiên hoặc dê có tì vết, tức là có bất cứ điều gì xấu, vì đó là điều ghê tởm đối với Yahweh, Đức Chúa Trời của anh em.
