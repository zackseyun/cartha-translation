  terminology: Thay “kính sợ” bằng “sợ hãi” để không định hướng đối tượng hay bản chất của nỗi sợ vượt quá nguyên văn. “Xấc xược” diễn đạt thích hợp thái độ ngang nhiên, bất phục tùng hàm trong זיד; chú thích nêu các khả năng dịch khác.
