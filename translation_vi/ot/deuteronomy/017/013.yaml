base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: vi
  text: Toàn dân sẽ nghe, sẽ sợ hãi[a], và sẽ không còn hành động xấc xược nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sợ” hoặc “kính sợ”. Động từ Hê-bơ-rơ không nêu đối tượng của sự sợ hãi; có thể hàm ý sợ hình phạt, sự kính sợ, hoặc cả hai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: Toàn dân
  rationale: Cụm Hê-bơ-rơ nói rõ “toàn dân” mà không lặp lại “Y-sơ-ra-ên”; cách dịch này tự nhiên và giữ nguyên phạm vi của câu.
- source_word: יִשְׁמְעוּ
  choice: sẽ nghe
  rationale: שמע ở đây mang nghĩa thông thường là nghe, tức nghe biết về việc thi hành phán quyết; “sẽ nghe” giữ được sắc thái hệ quả tương lai.
- source_word: וְיִרָאוּ
  choice: và kính sợ
  rationale: ירא không nêu đối tượng của sự sợ. “Kính sợ” phù hợp với văn cảnh giao ước và pháp lý, đồng thời không thêm đối tượng mà nguyên văn không nói rõ.
- source_word: וְלֹא יְזִידוּן
  choice: không còn hành động ngạo mạn
  rationale: Dạng Hiphil của זיד chỉ hành động cố ý, xấc xược và đầy tự phụ; “hành động ngạo mạn” diễn đạt được sự chống đối ngang nhiên trong văn cảnh.
- source_word: עוֹד
  choice: nữa
  rationale: עוֹד ở đây diễn tả việc hành vi ấy không tiếp diễn hoặc tái diễn; “không còn… nữa” là cách nói tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất và đối tượng của sự sợ hãi do phán quyết tạo nên
  choice: Dịch là “kính sợ” nhưng không nêu rõ kính sợ Đức Chúa Trời, hình phạt hay cả hai
  alternative: “sợ Đức Giê-hô-va” hoặc “sợ hình phạt”
  rationale: Nguyên văn chỉ nói “và họ sẽ sợ” mà không có tân ngữ. Bản dịch giữ sự hàm súc và mơ hồ chân thực ấy, thay vì thu hẹp ý nghĩa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Toàn dân” gọn và tự nhiên; “không còn… nữa” diễn đạt rõ hệ quả răn đe của phán quyết. Dấu [a] được đặt ngay sau cụm từ liên quan.
