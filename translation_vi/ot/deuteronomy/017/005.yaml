base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: vi
  text: thì anh em phải dẫn người đàn ông ấy hoặc người phụ nữ ấy, là người đã làm việc xấu xa này[a], ra các cổng thành của anh em—người đàn ông ấy hoặc người phụ nữ ấy—rồi ném đá người ấy cho đến chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự việc xấu xa này.” Từ Hê-bơ-rơ có thể chỉ một “việc” hoặc một “sự việc,” nhất là trong văn cảnh pháp lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: thì anh em phải dẫn ... ra
  rationale: Waw đi với thể hoàn thành trong chỉ thị pháp lý diễn tả bước kế tiếp của thủ tục. “Thì ... phải dẫn ... ra” truyền đạt tự nhiên cả tính tuần tự lẫn tính bắt buộc trong tiếng Việt.
- source_word: הָאִישׁ הַהוּא אוֹ אֶת־הָאִשָּׁה הַהִוא
  choice: người đàn ông ấy hoặc người phụ nữ ấy
  rationale: Giữ nguyên tính xác định và cặp giới tính được nêu rõ trong tiếng Hê-bơ-rơ, thay vì trung tính hóa thành “người ấy” ngay lần đầu.
- source_word: אֲשֶׁר עָשׂוּ
  choice: là người đã làm
  rationale: Diễn đạt mệnh đề quan hệ một cách tự nhiên trong tiếng Việt. Dạng số nhiều của động từ Hê-bơ-rơ phù hợp với hai khả năng được phối hợp, còn hành vi thực tế thuộc về một trong hai người.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: việc xấu xa này
  rationale: דָּבָר có thể là “việc,” “sự việc” hoặc “vấn đề.” Trong văn cảnh pháp lý này, “việc xấu xa này” vừa tự nhiên vừa giữ được sắc thái đạo đức của רַע và từ chỉ định “này.”
- source_word: אֶל־שְׁעָרֶיךָ
  choice: ra các cổng thành của mình
  rationale: Giữ dạng số nhiều “các cổng” của nguyên văn, đồng thời thêm “thành” để độc giả Việt hiểu đây là cổng của cộng đồng đô thị, không phải cổng nhà.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: ném đá người ấy
  rationale: Động từ “ném đá” trong tiếng Việt đã bao hàm phương tiện là đá, nên tránh lối lặp thiếu tự nhiên “ném người ấy bằng đá” mà vẫn chuyển tải đầy đủ hình phạt cụ thể.
- source_word: וָמֵתוּ
  choice: cho đến chết
  rationale: Kết quả được diễn đạt gọn và tự nhiên cùng với hành động ném đá. Cách này tránh đại từ số nhiều khó hiểu trong tiếng Việt khi điều luật đang nói đến một người phạm tội, dù là nam hay nữ.
theological_decisions:
- issue: Cách diễn đạt giới tính trong quy định pháp lý
  choice: người đàn ông ấy hoặc người phụ nữ ấy
  alternative: người ấy
  rationale: Nguyên văn nêu đích danh cả nam lẫn nữ. Bản dịch giữ cặp diễn đạt này để không làm mất tính áp dụng rõ ràng cho cả hai giới.
- issue: Địa điểm thi hành phán quyết tại cổng thành
  choice: các cổng thành của mình
  alternative: nơi xét xử công khai
  rationale: Giữ hình ảnh cụ thể của nguyên văn; vai trò tư pháp và công cộng của cổng thành được giải thích trong chú thích thay vì đưa cách diễn giải vào chính văn.
- issue: Kết quả tử hình trong mệnh đề וָמֵתוּ
  choice: ném đá người ấy cho đến chết
  alternative: ném đá họ, và họ sẽ chết
  rationale: Nguyên văn dùng hình thức số nhiều vì câu nêu hai khả năng, nam hoặc nữ, nhưng mỗi vụ việc chỉ liên quan đến người phạm tội được xác định. Số ít trong tiếng Việt làm rõ đúng quy chiếu mà không thay đổi nội dung hình phạt.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “anh em” cho lời truyền dạy hướng đến cộng đồng giao ước, tránh đại từ cổ “ngươi.” Cấu trúc lặp “dù là người đàn ông hay người phụ nữ” giữ sự nhấn mạnh của nguyên văn mà vẫn trôi chảy trong tiếng Việt.
