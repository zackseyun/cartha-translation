source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: vi
  text: Căn cứ vào lời chứng của hai nhân chứng hoặc ba nhân chứng[a], người đáng phải chết sẽ bị xử tử[b]; người ấy không được xử tử chỉ căn cứ vào lời chứng của một nhân chứng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “theo miệng của hai nhân chứng hoặc ba nhân chứng.” Đây là thành ngữ Hê-bơ-rơ chỉ lời khai hoặc chứng cứ pháp lý.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người phải chết”; tức là người thuộc diện phải chịu án tử hình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: căn cứ vào lời chứng của
  rationale: Thành ngữ Hê-bơ-rơ, nghĩa đen là “theo miệng của”, trong ngữ cảnh pháp lý chỉ lời khai làm chứng. Cách dịch này tự nhiên và giữ rõ căn cứ chứng cứ của phán quyết.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: hai nhân chứng hoặc ba nhân chứng
  rationale: Giữ sự lặp lại từ “nhân chứng” sau mỗi số, phản ánh văn phong pháp lý nhấn mạnh của nguyên văn.
- source_word: יוּמַת
  choice: sẽ bị xử tử / không được bị xử tử
  rationale: Dạng Hoph‘al của מות có nghĩa bị khiến phải chết, tức bị thi hành án tử hình, chứ không chỉ đơn thuần là chết. Ở mệnh đề phủ định, “không được” diễn đạt tự nhiên hiệu lực cấm đoán pháp lý.
- source_word: הַמֵּת
  choice: người đáng phải chết
  rationale: Phân từ có mạo từ mang tính tỉnh lược, chỉ người thuộc diện phải chịu án tử hình. “Đáng phải chết” giữ ý nghĩa pháp lý mà không hiểu sai là người đã chết.
- source_word: עֵד אֶחָד
  choice: một nhân chứng
  rationale: Cách dịch trực tiếp, đồng thời duy trì thế đối xứng với hai hoặc ba nhân chứng.
theological_decisions:
- issue: Sở chỉ và sắc thái của הַמֵּת trong luật về án tử hình
  choice: người đáng phải chết
  alternative: người bị kết án tử hình; người phải chết; người chết
  rationale: Ngữ cảnh quy định tiêu chuẩn chứng cứ để thi hành án tử hình. “Người chết” không phù hợp ngữ cảnh, còn “người bị kết án tử hình” xác định kết quả xét xử rõ hơn nguyên văn. “Người đáng phải chết” bảo toàn sắc thái người thuộc diện chịu án chết và phần nào giữ tính tỉnh lược của tiếng Hê-bơ-rơ.
- issue: Hiệu lực pháp lý của לֹא יוּמַת
  choice: không được bị xử tử
  alternative: sẽ không bị xử tử
  rationale: Mệnh đề là một lệnh cấm pháp lý đối với việc xử tử chỉ dựa trên một nhân chứng. “Không được” thể hiện hiệu lực quy phạm rõ hơn trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Giữ sự lặp lại “nhân chứng” của nguyên văn để duy trì nhịp điệu và tính nhấn mạnh; dùng “xử tử” để làm rõ đây là việc thi hành án, không phải cái chết nói chung.
