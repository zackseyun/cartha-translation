source:
  edition: WLC
  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: vi
  text: Khi vua ngồi trên ngai của vương quốc mình, vua phải chép cho mình, trên một cuộn sách, một bản sao luật pháp này từ trước mặt các thầy tế lễ người Lê-vi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ dịch sát là “từ trước mặt các thầy tế lễ”; có thể hàm ý bản mẫu được đặt trước mặt họ hoặc do họ lưu giữ.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “các thầy tế lễ, những người Lê-vi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: Khi vua ngồi
  rationale: Cấu trúc וְהָיָה với nguyên mẫu có כְּ mở ra hoàn cảnh thời gian của điều luật. Nêu rõ “vua” theo ngữ cảnh giúp câu tiếng Việt tự nhiên mà không thay đổi chủ thể.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: trên ngai của vương quốc mình
  rationale: Giữ hình ảnh cụ thể “ngai” và quan hệ sở hữu của מַמְלַכְתּוֹ, thay vì rút gọn thành “ngai vua”.
- source_word: וְכָתַב לוֹ
  choice: vua phải chép cho mình
  rationale: Trong văn cảnh luật định, động từ nối tiếp diễn tả nghĩa vụ; “phải” truyền đạt rõ sắc thái quy định. לוֹ được hiểu là hành động được thực hiện cho chính nhà vua sử dụng.
- source_word: מִשְׁנֵה
  choice: một bản sao
  rationale: Trong ngữ cảnh này, từ này chỉ một bản chép lại hay bản thứ hai, không đơn thuần là sự lặp lại.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: luật pháp này
  rationale: תּוֹרָה ở đây chỉ phần luật lệ hay giáo huấn giao ước đang được nói đến. “Luật pháp này” phù hợp với văn cảnh pháp lý mà không mở rộng phạm vi ngoài câu.
- source_word: עַל סֵפֶר
  choice: vào một cuộn sách
  rationale: סֵפֶר có thể chỉ sách, văn kiện hoặc cuộn sách. “Cuộn sách” phản ánh phương tiện viết thời cổ, còn giới từ “vào” tạo cách diễn đạt tiếng Việt tự nhiên.
- source_word: מִלִּפְנֵי
  choice: dựa theo bản ở trước mặt
  rationale: Nghĩa sát là “từ trước mặt/từ nơi hiện diện của.” Cách dịch này cho thấy bản sao được chép dựa theo văn bản đặt trước mặt hoặc do các thầy tế lễ gìn giữ, nhưng phần chú thích vẫn bảo lưu độ mở của cụm từ.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: các thầy tế lễ người Lê-vi
  rationale: 'Diễn đạt tự nhiên mối quan hệ đồng vị: các thầy tế lễ được xác định là người Lê-vi. Nghĩa sát theo hình thức được ghi trong chú thích.'
theological_decisions:
- issue: Phạm vi của תּוֹרָה trong luật dành cho vua
  choice: luật pháp này
  alternative: giáo huấn này; Torah này
  rationale: Văn cảnh trực tiếp quy định nhà vua phải có một bản chép của phần luật giao ước. “Luật pháp” phù hợp văn cảnh mà không khẳng định một phạm vi kinh điển rộng hơn điều câu văn cho biết.
- issue: Mối liên hệ giữa bản sao của vua và các thầy tế lễ
  choice: dựa theo bản ở trước mặt các thầy tế lễ
  alternative: từ trước mặt các thầy tế lễ; trong sự hiện diện của các thầy tế lễ
  rationale: Cụm Hê-bơ-rơ có thể hàm ý bản mẫu được đặt trước mặt hoặc thuộc quyền lưu giữ của các thầy tế lễ. Bản dịch chính truyền đạt cách hiểu có khả năng nhất, còn chú thích bảo lưu nghĩa sát và cách hiểu khác.
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại. Lặp lại “vua” để chủ thể rõ ràng trong tiếng Việt; dùng “phải” cho nghĩa vụ pháp lý. “Cuộn sách” giúp người đọc hình dung vật liệu chép thời cổ. Các chú thích giữ lại cấu trúc sát nguyên văn và sự không chắc chắn quanh מִלִּפְנֵי.
