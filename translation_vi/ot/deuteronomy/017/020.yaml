  text: לְ/בִלְתִּ֤י רוּם לְבָב/וֹ֙ מֵֽ/אֶחָ֔י/ו וּ/לְ/בִלְתִּ֛י ס֥וּר מִן הַ/מִּצְוָ֖ה יָמִ֣ין וּ/שְׂמֹ֑אול לְמַעַן֩ יַאֲרִ֨יךְ יָמִ֧ים עַל מַמְלַכְתּ֛/וֹ ה֥וּא וּ/בָנָ֖י/ו בְּ/קֶ֥רֶב יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: vi
  text: để lòng vua không tự cao hơn anh em mình[a], cũng không đi chệch khỏi điều răn sang bên phải hay bên trái, hầu cho vua và các con trai mình được trị vì lâu dài trên vương quốc mình, giữa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hơn đồng bào Israel của mình.” Tiếng Hê-bơ-rơ chép “hơn anh em mình,” dùng ngôn ngữ thân tộc của cộng đồng giao ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי רוּם לְבָבוֹ
  choice: để lòng vua không tự cao
  rationale: Giữ hình ảnh 'lòng' của tiếng Hê-bơ-rơ nhưng diễn đạt thành ngữ về sự kiêu ngạo bằng tiếng Việt tự nhiên; ngữ cảnh xác định đại từ chỉ vua.
- source_word: מֵאֶחָיו
  choice: hơn anh em mình
  rationale: Giữ ngôn ngữ thân tộc giao ước 'anh em' và ý so sánh/vượt lên do giới từ מִן biểu đạt.
- source_word: וּלְבִלְתִּי סוּר
  choice: cũng không lệch khỏi
  rationale: Diễn đạt tự nhiên ý rời khỏi đường lối phải theo, đồng thời giữ sắc thái giao ước của động từ סוּר.
- source_word: הַמִּצְוָה
  choice: điều răn
  rationale: Danh từ số ít xác định có thể chỉ toàn thể mệnh lệnh đã được ban; 'điều răn' giữ văn phong Kinh Thánh mà vẫn thông dụng.
- source_word: יָמִין וּשְׂמֹאול
  choice: sang bên phải hay bên trái
  rationale: Bảo tồn ẩn dụ Hê-bơ-rơ về việc chệch hướng theo bất cứ phía nào.
- source_word: לְמַעַן
  choice: hầu cho
  rationale: Nêu quan hệ mục đích hoặc kết quả dự kiến bằng văn phong trang trọng, gọn và tự nhiên.
- source_word: יַאֲרִיךְ יָמִים עַל מַמְלַכְתּוֹ
  choice: được trị vì lâu dài
  rationale: Cụm Hê-bơ-rơ nói đến việc kéo dài ngày tháng trên vương quyền; cách dịch này truyền đạt rõ sự kéo dài triều đại, tránh cách nói tiếng Việt gượng 'kéo dài các ngày trên vương quốc'.
- source_word: הוּא וּבָנָיו
  choice: vua và các con trai mình
  rationale: Giữ rõ nghĩa triều đại và danh từ giống đực 'các con trai', không mở rộng thành 'hậu duệ'.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: giữa Israel
  rationale: Giữ hình ảnh không gian của nguyên văn và bối cảnh cộng đồng giao ước.
theological_decisions:
- issue: Ngôn ngữ thân tộc có giống trong luật dành cho vua
  choice: anh em mình
  alternative: đồng bào Israel
  rationale: Nguyên văn dùng 'anh em', nhấn mạnh vua vẫn thuộc cùng cộng đồng giao ước và không được tự đặt mình cao hơn họ; chú thích làm rõ phạm vi chỉ người Israel.
- issue: Cách diễn đạt lời hứa về triều đại
  choice: vua và các con trai mình
  alternative: vua và dòng dõi mình
  rationale: Nguyên văn nói cụ thể 'các con trai', phù hợp bối cảnh kế vị vương triều; không mở rộng từ ngữ thành mọi hậu duệ.
- issue: Quan hệ giữa sự vâng phục và triều đại lâu dài
  choice: hầu cho ... được trị vì lâu dài
  alternative: để ... kéo dài những ngày trên vương quyền
  rationale: Giữ quan hệ mục đích/kết quả của לְמַעַן mà không định nghĩa sâu hơn bản chất thần học của lời hứa; tiếng Việt diễn đạt rõ đối tượng được kéo dài là thời gian trị vì.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'vua' thay cho đại từ ở những vị trí cần thiết để tránh mơ hồ; giữ 'Israel' theo dạng tên riêng phổ biến của dự án. Câu dịch ưu tiên tương đương tối ưu, bảo tồn 'lòng', 'anh em', hai hướng phải-trái và 'các con trai', nhưng diễn đạt thành ngữ về thời gian cầm quyền theo lối Việt tự nhiên.
