  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: lòng, anh em, điều răn, lệch phải/trái, vua và các con trai, cùng bối cảnh Israel. Tuy nhiên, “giữa Israel” trong bản nháp gắn trực tiếp với “được trị vì lâu dài” mà chưa thể hiện rõ cụm עַל־מַמְלַכְתּוֹ, nghĩa là thời gian trị vì trên vương quốc của vua.'
  naturalness: Câu nhìn chung trang trọng và tự nhiên. Đổi “lệch khỏi điều răn, sang bên phải hay bên trái” thành “đi chệch khỏi điều răn sang bên phải hay bên trái” giúp quan hệ cú pháp và ẩn dụ hướng đi rõ hơn. Thêm “trên vương quốc mình” làm câu sát nghĩa mà vẫn đọc tự nhiên.
  terminology: “Lòng,” “anh em mình,” “điều răn,” và “các con trai mình” đều phù hợp với từ vựng Kinh Thánh và giữ được ngôn ngữ thân tộc/cương vị vương quyền của nguyên văn. Chú thích cho “anh em mình” thích hợp và không áp đặt diễn giải giáo phái.
  issues:
