  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: vi
  text: 'Chỉ có điều, vua không được tích lũy nhiều ngựa cho mình[a], cũng không được khiến dân chúng trở lại Ai Cập[b] để có thêm ngựa; vì Yahweh đã phán bảo anh em: “Anh em không bao giờ được trở lại theo con đường này nữa.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được làm tăng số ngựa cho mình.” Động từ Hê-bơ-rơ có nghĩa là làm cho nhiều lên hoặc gia tăng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không được đưa dân chúng trở lại Ai Cập.” Động từ Hê-bơ-rơ ở thể gây khiến: vua bị cấm làm cho dân trở về đó.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “Anh em không được thêm vào việc trở lại theo con đường này nữa,” một thành ngữ có nghĩa là không bao giờ được trở lại theo con đường ấy nữa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Chỉ có điều
  rationale: Giữ sắc thái hạn định, chuyển từ quyền lập vua sang điều vua tuyệt đối không được làm; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: không được gia tăng ngựa cho mình
  rationale: Phản ánh thể Hiphil của רבה, nghĩa là làm cho nhiều lên hoặc tăng thêm, đồng thời giữ לּוֹ là “cho mình”.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: cũng không được khiến dân chúng trở lại Ai Cập
  rationale: 'Giữ rõ nghĩa gây khiến của thể Hiphil שוב: nhà vua không được làm cho dân trở về Ai Cập.'
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: để gia tăng ngựa
  rationale: Diễn đạt quan hệ mục đích và duy trì liên hệ từ vựng với mệnh lệnh ở đầu câu.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Chuyển trực tiếp danh giao ước יהוה bằng dạng phiên âm quen dùng, thay vì thay bằng một tước hiệu.
- source_word: לֹא תֹסִפוּן לָשׁוּב
  choice: không bao giờ được trở lại ... nữa
  rationale: Diễn đạt tự nhiên thành ngữ יסף cộng động từ nguyên mẫu, theo nghĩa không được lặp lại hành động trở về.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: theo con đường này
  rationale: דרך có thể chỉ đường đi hoặc tuyến đường; “theo con đường này” vừa gần nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: עוֹד
  choice: nữa
  rationale: Nhấn mạnh việc không được tái diễn, tương ứng với sắc thái thời gian của עוד trong ngữ cảnh.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. “Yahweh” bảo toàn việc đây là danh giao ước, không biến nó thành tước hiệu và không gắn bản dịch với một truyền thống hệ phái riêng.
- issue: Chủ thể bị cấm đưa dân trở lại Ai Cập
  choice: Nhà vua không được khiến dân chúng trở lại
  alternative: Nhà vua không được đưa dân chúng trở lại
  rationale: Thể Hiphil của שוב có nghĩa gây khiến. Bản chính giữ cấu trúc này mà không xác định phương thức cụ thể như ép buộc, sai phái hay đích thân dẫn về.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “vua” để làm rõ chủ thể từ ngữ cảnh gần. Đại từ “anh em” giữ lời phán hướng đến cộng đồng Israel ở số nhiều. Các cấu trúc “gia tăng,” “khiến ... trở lại” bảo toàn liên hệ từ vựng và sắc thái gây khiến của nguyên văn, còn chú thích cung cấp các cách nói tự nhiên hơn.
