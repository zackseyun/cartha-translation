  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: vi
  text: Nếu người ta phát hiện giữa anh em, tại một trong các thành của anh em mà Giê-hô-va, Đức Chúa Trời của anh em, ban cho anh em, một người nam hoặc một người nữ làm điều ác trước mắt Giê-hô-va, Đức Chúa Trời của anh em, bằng cách vi phạm giao ước của Ngài,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Cũng có thể dịch: “do phá vỡ giao ước của Ngài” hoặc “để vi phạm giao ước của Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu mệnh đề điều kiện trong luật tình huống; “Nếu” diễn đạt tự nhiên chức năng này.
- source_word: יִמָּצֵא
  choice: người ta phát hiện
  rationale: Thể Niphal mang ý bị động; cách diễn đạt này giữ tính phiếm chỉ của công thức pháp lý mà vẫn tự nhiên trong tiếng Việt.
- source_word: בְקִרְבְּךָ
  choice: giữa anh em
  rationale: Chỉ sự hiện diện trong cộng đồng giao ước; “giữa anh em” tự nhiên và giữ ngôi thứ hai số ít mang nghĩa tập thể của tiếng Hê-bơ-rơ.
- source_word: בְאַחַד שְׁעָרֶיךָ
  choice: tại một trong các thành
  rationale: “Cổng” được dùng hoán dụ cho thành hoặc khu vực thuộc quyền tài phán của thành; bản văn chính chuyển nghĩa tự nhiên, còn chú thích giữ nghĩa đen.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: mà Giê-hô-va, Đức Chúa Trời của anh em, ban cho anh em
  rationale: Giữ công thức giao ước và lực tiếp diễn của phân từ נֹתֵן; “ban” phù hợp văn phong trang trọng hiện đại.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: một người nam hay người nữ
  rationale: Giữ nguyên cặp giới tính được nêu rõ trong nguyên văn, không khái quát thành “một người”.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת הָרַע
  choice: làm điều ác
  rationale: Chuyển thành ngữ Hê-bơ-rơ “làm điều ác” sang cách nói tiếng Việt tự nhiên mà vẫn giữ sức nặng đạo đức.
- source_word: בְעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: dưới mắt Giê-hô-va, Đức Chúa Trời của anh em
  rationale: Giữ hình ảnh đánh giá “trong mắt” của nguyên văn bằng thành ngữ tiếng Việt trang trọng, dễ hiểu.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: mà vi phạm giao ước của Ngài
  rationale: Diễn đạt hành vi ác như sự vi phạm giao ước, không xác định trước điều khoản cụ thể; “mà” giữ được độ mở về quan hệ cách thức/kết quả của cấu trúc nguyên ngữ.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong tiếng Việt để biểu thị danh giao ước YHWH, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Bản chất của hành vi vi phạm giao ước
  choice: “mà vi phạm giao ước của Ngài”
  alternative: “do phá vỡ giao ước của Ngài” hoặc “đến mức vi phạm giao ước của Ngài”
  rationale: Câu này nói chung về sự vi phạm giao ước, còn hành vi cụ thể được nêu ở câu kế tiếp. Bản dịch không đưa vào một hệ thống thần học hay tự xác định điều khoản giao ước đang được nói đến.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số ít mang nghĩa cộng đồng của nguyên văn; dùng “Ngài” để quy chiếu kính trọng về Giê-hô-va. Câu được giữ dang dở bằng dấu phẩy vì đây là mệnh đề điều kiện tiếp tục sang các câu sau.
