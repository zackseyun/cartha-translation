base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: vi
  text: rồi đi phụng sự các thần khác và sấp mình trước chúng, hoặc trước mặt trời, mặt trăng hay toàn thể đạo binh trên trời[a], điều Ta không truyền[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đạo binh trên trời” có thể chỉ toàn bộ các thiên thể trên trời; trong một số văn cảnh, cụm từ này cũng có thể gợi đến các hữu thể trên trời.
    reason: lexical_alternative
  - marker: b
    text: Mệnh đề “điều Ta không truyền” có thể nói riêng về “toàn thể đạo binh trên trời”, hoặc rộng hơn về toàn bộ hành vi phụng sự và sấp mình trước các thần khác.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: rồi đi
  rationale: Trong mệnh đề điều kiện pháp lý tiếp nối từ câu trước, dạng động từ Hê-bơ-rơ này tiếp tục chuỗi hành động; “rồi đi” giữ được sự liên kết mà không buộc câu sang thời quá khứ.
- source_word: וַיַּעֲבֹד
  choice: phụng sự
  rationale: עבד khi có đối tượng là thần linh chỉ việc phục vụ mang tính thờ phượng. “Phụng sự” giữ sắc thái phục vụ, đồng thời để động từ kế tiếp diễn tả riêng cử chỉ phủ phục.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: Đây là nghĩa trực tiếp; “thần ngoại bang” sẽ thêm sắc thái dân tộc không được אֲחֵרִים nói rõ.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: sấp mình trước chúng
  rationale: Động từ diễn tả hành động cúi rạp hoặc phủ phục. Cách dịch này giữ hình ảnh thể chất, thay vì đồng nhất hoàn toàn với động từ “thờ phượng”.
- source_word: וְלַשֶּׁמֶשׁ ... לַיָּרֵחַ
  choice: hoặc trước mặt trời, mặt trăng
  rationale: Chuỗi אוֹ ... אוֹ tạo quan hệ lựa chọn giữa các đối tượng; tiếng Việt tự nhiên không cần lặp “hoặc trước” ở từng thành phần.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: toàn thể thiên binh
  rationale: “Thiên binh” giữ hình ảnh tập hợp có tổ chức trong צבא và không loại bỏ hoàn toàn khả năng chỉ các thiên thể hoặc các hữu thể trên trời; ngữ cảnh trực tiếp nghiêng về các thiên thể.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: điều Ta không truyền
  rationale: Bản Hê-bơ-rơ nói điều Đức Chúa Trời không truyền, chứ không dùng riêng một động từ có nghĩa “cấm”. Đại từ quan hệ “điều” cho phép phạm vi quy chiếu vẫn rộng, phù hợp sự mơ hồ của nguyên văn.
theological_decisions:
- issue: Phạm vi của mệnh đề אֲשֶׁר לֹא צִוִּיתִי
  choice: Dịch “điều Ta không truyền”, không xác định dứt khoát mệnh đề chỉ bổ nghĩa cho “toàn thể thiên binh” hay nhận định về toàn bộ hành vi thờ các thần khác.
  alternative: Hiểu mệnh đề chỉ gắn với “toàn thể thiên binh”; hoặc hiểu nó tóm lược toàn bộ hành vi phụng sự và sấp mình trước các thần khác.
  rationale: Về cú pháp, mệnh đề quan hệ có thể gắn gần nhất với “toàn thể thiên binh”, nhưng trong văn cảnh cũng có thể là lời bác bỏ rộng hơn đối với hành vi thờ thần khác. Bản dịch và chú thích giữ nguyên độ căng này.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. Câu được giữ ở dạng mệnh đề tiếp nối câu 2; “Ta” phản ánh ngôi thứ nhất của Đức Chúa Trời trong nguyên văn. Dấu gạch ngang giúp người đọc nhận ra mệnh đề quan hệ cuối câu mà không ép phạm vi bổ nghĩa.
