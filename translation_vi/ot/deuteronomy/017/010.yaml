  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: vi
  text: Anh em phải làm theo lời họ công bố cho anh em từ nơi Yahweh sẽ chọn,[a] và phải cẩn thận làm theo mọi điều họ chỉ dạy cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo phán quyết họ công bố cho anh em.” Từ Hê-bơ-rơ דָּבָר có thể có nghĩa là “lời”, “việc” hoặc, trong văn cảnh xét xử, “phán quyết”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Anh em phải làm theo
  rationale: Động từ עשה có nghĩa rộng là “làm, thực hiện”; trong văn cảnh pháp lý, “phải làm theo” diễn đạt tự nhiên sức bắt buộc của mệnh lệnh.
- source_word: עַל פִּי הַדָּבָר
  choice: theo lời
  rationale: Thành ngữ עַל־פִּי chỉ sự phù hợp với hoặc dựa trên thẩm quyền; דָּבָר có thể là “lời”, “việc” hay “phán quyết”. “Theo lời” giữ được hình ảnh Hê-bơ-rơ, còn nghĩa tư pháp được ghi ở chú thích.
- source_word: יַגִּידוּ לְךָ
  choice: họ công bố cho anh em
  rationale: Dạng Hiphil của נגד mang nghĩa “báo cho biết, công bố”; “công bố” phù hợp tính chính thức và có thẩm quyền của phán quyết trong văn cảnh.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: từ nơi ấy, là nơi Đức Giê-hô-va sẽ chọn
  rationale: Giữ hướng thời gian tương lai của יִבְחַר và ý nghĩa của địa điểm trung tâm được Đức Chúa Trời chọn.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt để biểu đạt trực tiếp Danh Giao Ước יהוה, thay vì thay bằng một tước hiệu.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: phải cẩn thận làm theo
  rationale: Cấu trúc שׁמר kèm động từ nguyên mẫu diễn tả việc chú tâm tuân giữ và thi hành; cách dịch này vừa sát nghĩa vừa tự nhiên.
- source_word: כְּכֹל אֲשֶׁר
  choice: theo mọi điều
  rationale: Diễn đạt sự tuân thủ toàn diện đối với nội dung chỉ thị.
- source_word: יוֹרוּךָ
  choice: họ chỉ dẫn cho anh em
  rationale: Dạng Hiphil của ירה có thể mang nghĩa “dạy, chỉ dẫn, hướng dẫn”; “chỉ dẫn” giữ sắc thái có thẩm quyền pháp lý mà không thu hẹp thành hoạt động giảng dạy.
theological_decisions:
- issue: Cách dịch Danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ יהוה như một danh riêng thay vì thay bằng tước hiệu. “Đức Giê-hô-va” là dạng tiếng Việt trang trọng và quen thuộc; sự lựa chọn này không làm thay đổi nội dung mệnh lệnh của câu.
- issue: Phạm vi thẩm quyền của lời chỉ dẫn
  choice: Giữ nguyên mệnh lệnh phải làm theo mọi điều họ chỉ dẫn trong vụ việc được trình tại nơi Đức Giê-hô-va chọn
  alternative: Diễn giải thành một tuyên bố tổng quát về thẩm quyền tôn giáo không giới hạn
  rationale: Văn cảnh trực tiếp là thủ tục phân xử tư pháp (Phục Truyền 17:8–13). Bản dịch không mở rộng hoặc thu hẹp hàm ý thần học vượt quá câu và văn cảnh.
translation_notes:
  register: Văn phong pháp lý nhưng sáng rõ, trang trọng và tự nhiên trong tiếng Việt hiện đại. Đại từ số ít giống đực trong nguyên văn được dịch là “anh em”, cách xưng hô phổ biến trong diễn ngôn giao ước hướng đến dân Y-sơ-ra-ên; các lần xuất hiện được giữ nhất quán. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan.
