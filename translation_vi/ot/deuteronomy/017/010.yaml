    rationale: Nguồn và English POB audit trail quy định dùng “Yahweh” cho Tetragrammaton. “Đức” là phần bổ sung tước hiệu, còn “Giê-hô-va” là một dạng phiên âm khác; cả hai làm lệch lựa chọn thuật ngữ đã được xác định.
  - severity: low
