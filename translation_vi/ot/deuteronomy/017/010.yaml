  to: Anh em phải làm theo lời họ công bố cho anh em từ nơi Yahweh sẽ chọn,[a] và phải cẩn thận làm theo mọi điều họ chỉ dạy cho anh em.
  rationale: Sửa danh riêng יהוה thành “Yahweh” theo quyết định của dự án và làm gọn cụm chỉ địa điểm để câu tiếng Việt tự nhiên hơn. Giữ “lời” trong thân văn nhằm bảo tồn độ rộng nghĩa của דָּבָר, đồng thời duy trì phương án “phán quyết” trong chú thích. Không mở rộng thẩm quyền của những người phân xử vượt quá ngữ cảnh tư pháp.
  reviewer_model: gpt-5.6-terra
