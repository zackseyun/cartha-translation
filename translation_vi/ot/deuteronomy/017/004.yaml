  source_fidelity: Bản nháp truyền đạt bối cảnh điều tra tư pháp và hành vi đã xảy ra, nhưng “nếu quả thật” biến lời xác nhận sau điều tra thành một điều kiện, đồng thời “đã được xác minh” gộp và làm mờ cặp xác nhận אֱמֶת נָכוֹן. Đại từ số nhiều “anh em” cũng không phản ánh trực tiếp số ít של לְךָ và các động từ theo sau.
