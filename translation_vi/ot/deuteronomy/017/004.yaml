base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: vi
  text: 'Nếu việc ấy được báo tin cho ngươi và ngươi nghe biết, thì ngươi phải điều tra cặn kẽ. Và này, sự việc quả là thật và chắc chắn: điều ghê tởm này đã xảy ra trong Israel,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: việc ấy được báo cho anh em
  rationale: Giữ thể bị động của động từ Hoph'al נגד và bổ sung “việc ấy” từ ngữ cảnh để câu tiếng Việt rõ nghĩa.
- source_word: וְשָׁמָעְתָּ
  choice: và anh em nghe biết
  rationale: שׁמע có nghĩa cơ bản là nghe; “nghe biết” tự nhiên trong tiếng Việt khi nói đến việc nhận được tin về một sự việc.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: thì phải điều tra thật kỹ
  rationale: Trong bối cảnh pháp lý, דרש chỉ việc điều tra, còn הֵיטֵב nhấn mạnh sự kỹ lưỡng. “Phải” thể hiện lực chỉ thị của chuỗi mệnh đề trong luật lệ.
- source_word: וְהִנֵּה
  choice: nếu quả thật
  rationale: Trong kết cấu pháp lý này, הִנֵּה dẫn vào kết quả được xác nhận sau điều tra; “nếu quả thật” diễn đạt tự nhiên chức năng ấy trong tiếng Việt mà không làm yếu mức độ xác quyết.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: sự việc đã được xác minh
  rationale: Cụm công thức pháp lý khẳng định sự việc là thật và vững chắc. “Đã được xác minh” truyền đạt sự xác nhận tư pháp, nhưng không lặp lại riêng hai sắc thái nên được ghi chú bằng phương án sát chữ hơn.
- source_word: נֶעֶשְׂתָה
  choice: đã xảy ra
  rationale: Thể bị động của עשה nói hành vi đã thực sự được thực hiện; “đã xảy ra” tự nhiên với danh từ chỉ sự việc ghê tởm và vẫn xác nhận tính hoàn tất.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: điều ghê tởm này
  rationale: תּוֹעֵבָה là từ đánh giá đạo đức-giao ước rất mạnh. “Điều ghê tởm” trang trọng, dễ hiểu và không làm nhẹ mức độ lên án.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Israel
  rationale: Giữ cách gọi Israel và xác định hành vi xảy ra ở giữa cộng đồng giao ước.
theological_decisions:
- issue: Công thức xác nhận tư pháp אֱמֶת נָכוֹן הַדָּבָר
  choice: sự việc đã được xác minh
  alternative: sự việc là thật và chắc chắn
  rationale: Bản chính dùng cách nói tự nhiên trong văn cảnh điều tra pháp lý; phương án thay thế bảo tồn rõ hơn hai yếu tố “thật” và “vững chắc/chắc chắn”. Không thêm cách diễn giải thần học.
- issue: Cách dịch תּוֹעֵבָה
  choice: điều ghê tởm
  alternative: điều đáng ghê tởm; việc đáng ghê tởm
  rationale: Giữ sức nặng phán xét đạo đức của từ Hê-bơ-rơ trong Phục Truyền Luật Lệ Ký, đồng thời dùng từ ngữ hiện đại, dễ hiểu.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Đại từ “anh em” chỉ cộng đồng Israel được ngỏ lời ở số ít tập thể, phù hợp lối xưng hô chung trong bản dịch. Câu giữ dấu phẩy cuối vì câu luật pháp tiếp tục sang câu kế.
