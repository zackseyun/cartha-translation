reference: Deuteronomy 17:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: vi
  text: Nhưng người nào hành động ngạo mạn[a], không chịu nghe theo[b] thầy tế lễ đang đứng tại đó để phụng sự Yahweh[c], Đức Chúa Trời của anh em, hoặc không chịu nghe theo vị thẩm phán, thì người ấy phải chết. Như vậy, anh em phải trừ bỏ điều ác khỏi Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “hành động trong sự ngạo mạn”; cũng có thể dịch là “hành động xấc xược” hoặc “hành động cố ý.” Cụm từ này nói đến sự cố tình chống đối, không phải một sai sót vô ý.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “không vâng theo.” Động từ Hê-bơ-rơ có nghĩa đen là “nghe”, nhưng trong ngữ cảnh pháp lý thường bao hàm việc nghe theo và vâng lời.
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” là cách phiên âm danh יהוה (YHWH) trong tiếng Hê-bơ-rơ; theo truyền thống, danh này thường được dịch là “CHÚA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: Nhưng người nào
  rationale: Liên từ וְ tiếp nối điều luật trước với sắc thái tương phản, còn אִישׁ chỉ một cá nhân phạm luật. “Người nào” tự nhiên trong văn luật tiếng Việt mà vẫn giữ số ít.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: hành động ngạo mạn
  rationale: Thành ngữ diễn tả hành vi cố ý, tự phụ và chống đối thẩm quyền, chứ không phải một sai sót vô tình.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: không chịu nghe theo
  rationale: שׁמע về căn bản là “nghe”, nhưng trong bối cảnh pháp lý hàm ý nghe và làm theo. “Không chịu” thể hiện tính cố ý chống đối của ngữ cảnh.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם אֶת יְהוָה
  choice: đang đứng tại đó để phụng sự Yahweh
  rationale: Giữ hình ảnh vị thầy tế lễ đứng tại nơi được chỉ định và dùng “phụng sự” cho chức vụ thờ phượng dành cho Yahweh.
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: hoặc không chịu nghe theo vị thẩm phán
  rationale: Lặp lại động từ trong tiếng Việt để quan hệ cú pháp với cả thầy tế lễ lẫn thẩm phán được rõ ràng; שֹׁפֵט là thẩm quyền xét xử.
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: thì người ấy phải chết
  rationale: Trong ngữ cảnh điều luật, waw kèm động từ hoàn thành nêu hậu quả hình phạt bắt buộc; “phải chết” là cách diễn đạt pháp lý tự nhiên.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: Như vậy, anh em phải trừ bỏ điều ác khỏi Israel
  rationale: בער הרע là công thức pháp lý trong Phục Truyền Luật Lệ Ký về việc loại bỏ điều ác khỏi cộng đồng giao ước. “Trừ bỏ” giữ được sức nặng ấy mà vẫn tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” giữ danh riêng thay vì thay bằng một tước hiệu.
- issue: Chủ thể phạm luật ở số ít giống đực
  choice: người nào … người ấy
  alternative: người đàn ông ấy
  rationale: אִישׁ ở đây chỉ một cá nhân phạm luật trong công thức pháp lý. “Người nào … người ấy” giữ số ít và diễn đạt tự nhiên, đồng thời không khẳng định quá mức rằng điều luật chỉ áp dụng cho nam giới.
- issue: Sắc thái của hình phạt tử hình
  choice: phải chết
  alternative: sẽ chết
  rationale: Ngữ cảnh là phán quyết pháp lý chứ không chỉ dự báo một cái chết; “phải chết” thể hiện nghĩa vụ thi hành hình phạt mà không thêm cách thức hành hình.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” để thể hiện lời Môi-se nói với Israel như một cộng đồng, dù đại từ Hê-bơ-rơ ở dạng số ít tập thể. Cấu trúc được làm rõ vừa đủ trong tiếng Việt bằng cách lặp “không chịu nghe theo” trước “vị thẩm phán,” nhưng không giải quyết thay các sắc thái “nghe/vâng theo” và “ngạo mạn/cố ý,” vốn được bảo lưu trong chú thích.
