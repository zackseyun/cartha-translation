source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: vi
  text: Anh em nhất định phải lập một vua mà Yahweh, Đức Chúa Trời của anh em, sẽ chọn, để cai trị anh em. Anh em phải lập một vua từ giữa anh em mình[a] để cai trị anh em; anh em không được đặt một người ngoại bang[b] lên cai trị anh em, là người không phải là anh em của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em mình” là ngôn ngữ thân tộc; trong ngữ cảnh này chỉ một người thuộc cùng dân Israel.
    reason: Làm rõ phạm vi quy chiếu của אַחֶיךָ, đồng thời giữ ngôn ngữ thân tộc trong chính văn.
  - marker: b
    text: 'Nguyên văn sát chữ: “một người đàn ông ngoại bang.”'
    reason: Ghi nhận yếu tố אִישׁ (“người đàn ông”) trong cụm אִישׁ נָכְרִי, trong khi chính văn dùng cách nói tự nhiên hơn.
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: nhất định phải lập
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ cùng gốc nhấn mạnh mệnh lệnh; “nhất định phải” truyền đạt cả sắc thái nhấn mạnh lẫn tính bắt buộc một cách tự nhiên trong tiếng Việt.
- source_word: עָלֶיךָ
  choice: lên cai trị mình
  rationale: Giữ ý đặt một người ở trên dân để cai trị, đồng thời phản ánh ngôi thứ hai số ít mang nghĩa tập thể qua “mình” quy chiếu về cộng đồng được xưng hô là “anh em”.
- source_word: מֶלֶךְ
  choice: vua
  rationale: Cách dịch trực tiếp, thông dụng và phù hợp với chức vụ nam giới trong ngữ cảnh.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: mà Yahweh, Đức Chúa Trời của anh em, sẽ chọn
  rationale: Động từ chưa hoàn thành trong điều luật hướng tới việc lựa chọn sẽ diễn ra; “sẽ chọn” tự nhiên trong tiếng Việt và không thêm cách giải thích về phương thức lựa chọn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: từ giữa anh em mình
  rationale: Giữ hình ảnh thân tộc “anh em” và ý người được chọn phải thuộc chính cộng đồng Israel; chú thích làm rõ phạm vi dân tộc-giao ước.
- source_word: לֹא תוּכַל לָתֵת
  choice: không được đặt
  rationale: Nghĩa đen là “không thể đặt”, nhưng trong văn cảnh luật pháp cấu trúc này diễn tả sự cấm đoán; “không được” chuyển tải đúng lực ngôn trung.
- source_word: אִישׁ נָכְרִי
  choice: một người ngoại quốc
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ một cá nhân cụ thể và sự đối lập với người thuộc Israel; chú thích ghi nhận yếu tố אִישׁ, “người đàn ông”.
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: tức là người không phải anh em mình
  rationale: Giữ lời giải thích của bản Hê-bơ-rơ bằng ngôn ngữ thân tộc, không đồng nhất hóa âm thầm với một phạm trù pháp lý hiện đại.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH; giữ “Yahweh” phân biệt danh riêng này với các tước hiệu của Đức Chúa Trời.
- issue: Ngôn ngữ thân tộc אַחֶיךָ / אָחִיךָ
  choice: anh em mình / anh em mình
  alternative: đồng bào Israel / người Israel
  rationale: Giữ ẩn dụ thân tộc và sức nặng giao ước của nguyên văn; chú thích giải thích rằng trong câu này cụm từ chỉ một thành viên cùng dân Israel.
- issue: Quan hệ giữa sự bổ nhiệm của dân và sự lựa chọn của Đức Chúa Trời
  choice: giữ cả “anh em... lập” và “Yahweh... chọn”
  alternative: diễn giải phương thức dân nhận biết hoặc thi hành sự lựa chọn của Đức Chúa Trời
  rationale: Nguyên văn đặt hai tác nhân cạnh nhau nhưng không giải thích cơ chế; bản dịch không nên tự ý giải quyết sự căng thẳng đó.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Anh em” được dùng để Moses xưng hô với cộng đồng Israel và đồng thời bảo toàn ngôn ngữ thân tộc; “mình” giúp thể hiện đại từ số ít mang nghĩa tập thể của tiếng Hê-bơ-rơ mà không dùng lối “ngươi” quá cổ.
