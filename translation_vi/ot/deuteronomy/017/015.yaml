revisions:
- from: Anh em nhất định phải lập lên cai trị mình một vua mà Yahweh, Đức Chúa Trời của anh em, sẽ chọn. Anh em phải lập một vua từ giữa anh em mình[a] lên cai trị mình; anh em không được đặt một người ngoại quốc[b] lên cai trị mình, tức là người không phải anh em mình.
  to: Anh em nhất định phải lập một vua mà Yahweh, Đức Chúa Trời của anh em, sẽ chọn, để cai trị anh em. Anh em phải lập một vua từ giữa anh em mình[a] để cai trị anh em; anh em không được đặt một người ngoại bang[b] lên cai trị anh em, là người không phải là anh em của anh em.
  rationale: 'Bản sửa giữ nguyên nội dung và sự căng thẳng không được giải thích thêm trong nguyên văn: cộng đồng lập vua, nhưng Yahweh là Đấng chọn vua. Các thay đổi chỉ làm rõ cú pháp tiếng Việt, thay “ngoại quốc” bằng “ngoại bang” sát ngữ cảnh hơn, và chỉnh mệnh đề thân tộc cuối câu cho tự nhiên.'
