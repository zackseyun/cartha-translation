reference: Deuteronomy 17:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: vi
  text: Anh em phải làm theo lời chỉ dạy mà họ truyền cho anh em[a], và theo phán quyết mà họ nói với anh em. Anh em không được đi chệch khỏi lời họ công bố cho anh em[b], dù sang phải hay sang trái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “luật pháp” hoặc “sự dạy dỗ” (tiếng Hê-bơ-rơ: torah).'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “việc” hoặc “phán quyết” thay cho “lời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: làm theo
  rationale: Thành ngữ này có nghĩa là hành động phù hợp với một chỉ dẫn hay phán quyết; “làm theo” diễn đạt tự nhiên sức ràng buộc pháp lý trong tiếng Việt.
- source_word: הַתּוֹרָה אֲשֶׁר יוֹרוּךָ
  choice: lời chỉ dạy mà họ truyền cho anh em
  rationale: תּוֹרָה ở đây là sự chỉ dạy có thẩm quyền trong vụ việc đang xét; “lời chỉ dạy” tránh thu hẹp nghĩa thành bộ luật thành văn, còn “truyền cho” phản ánh thể Hiphil của ירה.
- source_word: הַמִּשְׁפָּט
  choice: phán quyết
  rationale: Trong bối cảnh tư pháp, מִשְׁפָּט chỉ quyết định xét xử; “phán quyết” rõ nghĩa và giữ văn phong pháp lý trang trọng.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: mà họ nói với anh em
  rationale: Giữ nghĩa thông thường của אָמַר và mô tả việc trực tiếp thông báo phán quyết.
- source_word: תַּעֲשֶׂה
  choice: phải làm
  rationale: Dạng chưa hoàn thành mang lực mệnh lệnh, nên “phải” diễn đạt nghĩa vụ rõ ràng trong tiếng Việt hiện đại.
- source_word: לֹא תָסוּר
  choice: không được làm sai lệch
  rationale: סוּר là rời khỏi hoặc chệch khỏi. Kết hợp với “lời” và thành ngữ phương hướng theo sau, cách dịch này tự nhiên và giữ ý không được lệch khỏi phán truyền.
- source_word: הַדָּבָר
  choice: lời
  rationale: דָּבָר có thể là lời, việc hoặc phán quyết. “Lời” giữ hình thức số ít và sắc thái của lời tuyên bố có thẩm quyền, đồng thời để chú thích bảo tồn các nghĩa khác.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: họ công bố cho anh em
  rationale: Thể Hiphil của נגד có nghĩa làm cho biết hoặc tuyên bố; “công bố” phù hợp bối cảnh tư pháp trang trọng.
- source_word: יָמִין וּשְׂמֹאל
  choice: dù sang phải hay sang trái
  rationale: Giữ nguyên hình ảnh thành ngữ về việc chệch khỏi phán quyết theo bất cứ hướng nào.
theological_decisions:
- issue: Phạm vi vâng phục thẩm quyền tư tế và tư pháp
  choice: Diễn đạt mệnh lệnh phải tuân theo lời chỉ dạy và phán quyết có thẩm quyền trong vụ việc đang được xét.
  alternative: Hiểu câu này như một tuyên bố về thẩm quyền tuyệt đối hoặc không thể sai lầm của các định chế tôn giáo về sau.
  rationale: Ngữ cảnh nói về thủ tục tư pháp giao ước của Israel. Bản dịch giữ nguyên sức mạnh của mệnh lệnh nhưng không đưa vào câu Kinh Thánh những khẳng định giáo hội học vượt quá nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số ít mang tính đại diện hướng đến cộng đồng Israel; giữ hai vế pháp lý song song và hình ảnh “phải hay trái” của nguyên văn.
