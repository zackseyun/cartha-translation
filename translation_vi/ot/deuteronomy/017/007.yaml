  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: vi
  text: Các nhân chứng phải là những người đầu tiên ra tay xử tử người ấy, rồi sau đó toàn dân cùng ra tay.[a] Như vậy, anh em phải trừ bỏ điều ác khỏi giữa anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Tay của các nhân chứng sẽ chống lại người ấy trước tiên để xử tử người ấy, rồi đến tay của toàn dân”; đây là thành ngữ pháp lý quy định các nhân chứng phải khởi đầu việc thi hành bản án.'
    reason: cultural_note
lexical_decisions:
- source_word: יַד
  choice: ra tay
  rationale: Trong ngữ cảnh pháp lý và hành quyết, “ra tay” diễn đạt tự nhiên thành ngữ Hê-bơ-rơ dùng “tay” để chỉ việc trực tiếp thực hiện và chịu trách nhiệm hành động.
- source_word: הָעֵדִים
  choice: các nhân chứng
  rationale: Danh từ chỉ các nhân chứng trong thủ tục xét xử, không chỉ những người cáo buộc.
- source_word: בָרִאשֹׁנָה
  choice: những người đầu tiên
  rationale: 'Giữ rõ thứ tự hành động: các nhân chứng phải khởi đầu việc thi hành bản án.'
- source_word: לַהֲמִיתוֹ
  choice: xử tử người ấy
  rationale: Động từ Hiphil của מות mang nghĩa làm cho chết; “xử tử” phù hợp với bối cảnh thi hành án tử hình hơn từ khái quát “giết”.
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  choice: rồi sau đó toàn dân cùng ra tay
  rationale: Giữ trình tự nhân chứng trước, cộng đồng sau, đồng thời diễn đạt thành ngữ về “tay” bằng tiếng Việt tự nhiên.
- source_word: וּבִעַרְתָּ
  choice: phải trừ bỏ
  rationale: Trong công thức luật pháp của Phục Truyền Luật Lệ Ký, בער chỉ việc loại bỏ khỏi cộng đồng, không hàm ý đốt theo nghĩa đen.
- source_word: הָרָע
  choice: điều ác
  rationale: Giữ tính khái quát của công thức Hê-bơ-rơ, không thu hẹp đối tượng thành riêng “kẻ ác”.
- source_word: מִקִּרְבֶּךָ
  choice: khỏi giữa mình
  rationale: Diễn đạt việc loại bỏ điều ác ra khỏi cộng đồng giao ước; “mình” quy chiếu tự nhiên về cộng đồng được gọi là “anh em”.
theological_decisions:
- issue: Công thức luật pháp וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình
  alternative: Như vậy, anh em phải loại kẻ làm ác ra khỏi cộng đồng
  rationale: Bản Hê-bơ-rơ nói “điều ác,” một công thức rộng hơn việc chỉ đích danh người phạm tội. Bản dịch giữ nguyên sức nặng pháp lý và thần học mà không thu hẹp sự mơ hồ chân thực ấy.
- issue: Đại từ số ít tập thể trong מִקִּרְבֶּךָ
  choice: anh em ... mình
  alternative: ngươi ... giữa ngươi
  rationale: Hình thức Hê-bơ-rơ là số ít nhưng hướng đến Israel như một cộng đồng. “Anh em” truyền đạt đối tượng tập thể bằng tiếng Việt hiện đại, trang trọng mà không dùng đại từ “ngươi” dễ tạo sắc thái cổ hoặc miệt thị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ra tay” được dùng hai lần để bảo tồn hình ảnh “tay” và trách nhiệm trực tiếp trong nguyên văn mà không tạo câu tiếng Việt gượng ép; “xử tử” làm rõ bối cảnh tư pháp.
