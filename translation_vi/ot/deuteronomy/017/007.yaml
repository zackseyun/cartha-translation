revisions:
- from: Các nhân chứng phải là những người đầu tiên ra tay xử tử người ấy, rồi sau đó toàn dân cùng ra tay.[a] Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.
  to: Các nhân chứng phải là những người đầu tiên ra tay xử tử người ấy, rồi sau đó toàn dân cùng ra tay.[a] Như vậy, anh em phải trừ bỏ điều ác khỏi giữa anh em.
  rationale: Chỉ điều chỉnh quy chiếu đại từ để câu tiếng Việt nhất quán, và sửa chú thích để phản ánh chính xác hơn thành ngữ “tay ... chống lại” cùng vai trò khởi đầu của nhân chứng. Ý nghĩa, mức độ khái quát của công thức “điều ác,” và sắc thái pháp lý của bản dịch được giữ nguyên.
