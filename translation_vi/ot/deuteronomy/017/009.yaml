base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: vi
  text: Anh em phải đến gặp các thầy tế lễ người Lê-vi và vị thẩm phán đương chức vào thời ấy; anh em phải hỏi, và họ sẽ cho anh em biết quyết định xét xử[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “lời của sự xét xử.” Cụm từ Hê-bơ-rơ chỉ quyết định tư pháp có thẩm quyền.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Anh em phải đến
  rationale: Dạng hoàn thành Qal nối tiếp trong chỉ thị pháp luật mang sức bắt buộc. “Phải đến” diễn đạt tự nhiên mệnh lệnh hướng người nghe đến cơ quan xét xử có thẩm quyền; đại từ số ít được chuyển thành “anh em” theo lối xưng hô cộng đồng tự nhiên trong tiếng Việt.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: các thầy tế lễ thuộc chi phái Lê-vi
  rationale: Cụm đồng vị xác định đây là các thầy tế lễ thuộc Lê-vi, không hàm ý mọi người Lê-vi đều là thầy tế lễ.
- source_word: הַשֹּׁפֵט אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: vị thẩm phán đang đương chức lúc ấy
  rationale: Cụm từ chỉ người giữ chức vụ tư pháp vào thời điểm vụ việc được đưa ra, chứ không nói đến một cá nhân được nêu tên. “Đang đương chức” làm rõ sắc thái thể chế.
- source_word: וְדָרַשְׁתָּ
  choice: anh em phải thỉnh cầu phán quyết
  rationale: Trong bối cảnh tư pháp, động từ diễn tả việc tìm cầu sự chỉ dẫn hay quyết định có thẩm quyền. Cách dịch này tự nhiên hơn “tra hỏi” và gắn rõ với thủ tục xét xử.
- source_word: וְהִגִּידוּ לְךָ
  choice: rồi họ sẽ công bố cho anh em
  rationale: Hiphil của נגד chỉ việc chính thức thông báo một quyết định; “công bố” giữ được sắc thái trang trọng và thẩm quyền.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: lời phán xử
  rationale: Nghĩa sát là “lời của sự xét xử/phán xét”; trong ngữ cảnh, đây là quyết định tư pháp có thẩm quyền. “Lời phán xử” vừa giữ hình ảnh “lời” vừa rõ nghĩa pháp lý.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại, dễ hiểu. Dùng “anh em” để xưng hô với cộng đồng giao ước, “thầy tế lễ” và “thẩm phán” theo thuật ngữ Kinh Thánh và pháp lý quen thuộc. Dấu [a] được đặt ngay sau cụm từ cần chú thích.
