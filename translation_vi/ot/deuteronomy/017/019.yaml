source:
  edition: WLC
  text: וְ/הָיְתָ֣ה עִמּ֔/וֹ וְ/קָ֥רָא ב֖/וֹ כָּל יְמֵ֣י חַיָּ֑י/ו לְמַ֣עַן יִלְמַ֗ד לְ/יִרְאָה֙ אֶת יְהוָ֣ה אֱלֹהָ֔י/ו לִ֠/שְׁמֹר אֶֽת כָּל דִּבְרֵ֞י הַ/תּוֹרָ֥ה הַ/זֹּ֛את וְ/אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה לַ/עֲשֹׂתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: vi
  text: Bản luật ấy phải ở bên vua, và vua phải đọc trong đó[a] suốt đời mình, để học kính sợ[b] Yahweh[c], Đức Chúa Trời của mình, tuân giữ mọi lời của luật pháp này cùng các luật lệ này, và làm theo chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đọc từ đó.” Nguyên văn nói sát là “đọc trong đó.”'
    reason: lexical_alternative
  - marker: b
    text: Từ này bao hàm sự sợ hãi, lòng tôn kính và thái độ quy phục; cũng có thể dịch là “sợ” hoặc “tôn kính.”
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” chuyển âm danh riêng của Đức Chúa Trời, được viết bằng bốn phụ âm Hê-bơ-rơ YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: Bản luật ấy phải ở bên vua
  rationale: Chủ ngữ ngầm chỉ bản sao luật pháp ở câu trước. Cách dịch này giữ ý bản luật luôn thuộc tầm sở hữu và sử dụng của vua, đồng thời nêu rõ đối tượng trong tiếng Việt.
- source_word: וְקָרָא בוֹ
  choice: và vua phải đọc trong đó
  rationale: Giữ giới từ בּוֹ theo nghĩa sát là “trong đó”; cách nói này tự nhiên khi nói đến việc đọc trong một văn bản. Chú thích ghi nhận phương án “đọc từ đó”.
- source_word: כָּל יְמֵי חַיָּיו
  choice: suốt đời mình
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ toàn bộ thời gian sống mà vẫn giữ rõ ý đọc luật trọn đời.
- source_word: לְמַעַן יִלְמַד
  choice: để học
  rationale: “Để” chuyển tải trực tiếp quan hệ mục đích của לְמַעַן; “học” giữ tiến trình được uốn nắn qua việc đọc.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: kính sợ Yahweh, Đức Chúa Trời của mình
  rationale: “Kính sợ” giữ được cả sự sợ hãi, lòng tôn kính và thái độ quy phục trong bối cảnh giao ước; “của mình” quy chiếu tự nhiên về nhà vua.
- source_word: לִשְׁמֹר
  choice: tuân giữ
  rationale: Trong ngữ cảnh luật pháp và giao ước, động từ này nói đến việc cẩn trọng giữ và vâng theo các điều đã truyền. “Tuân giữ” vừa trang trọng vừa rõ nghĩa trong tiếng Việt hiện đại.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: mọi lời của luật pháp này
  rationale: “Luật pháp” phù hợp với văn cảnh pháp lý-giao ước của Phục Truyền Luật Lệ Ký; “mọi lời” bảo toàn cách diễn đạt cụ thể của nguyên văn.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: các luật lệ này
  rationale: “Luật lệ” là từ pháp lý phổ thông, dễ hiểu và thể hiện những quy định được ấn định.
- source_word: לַעֲשֹׂתָם
  choice: và làm theo chúng
  rationale: “Làm theo” diễn đạt tự nhiên hành động thực thi các lời và luật lệ, đồng thời giữ động từ cụ thể “làm” thay vì chỉ diễn giải chung là “vâng lời”.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Dùng “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng một tước hiệu; chú thích giúp độc giả nhận biết nguồn gốc của cách ghi này.
- issue: Sắc thái của ירא trong bối cảnh giao ước
  choice: kính sợ
  alternative: sợ; tôn kính
  rationale: “Kính sợ” không thu hẹp từ này thành nỗi khiếp sợ đơn thuần hay sự tôn trọng nhẹ nhàng, mà giữ sức căng giữa sợ hãi, kính trọng và quy phục dẫn đến vâng giữ luật pháp.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “vua” thay cho đại từ lặp lại để tránh mơ hồ khi câu được đọc riêng; “bản luật ấy” nối rõ với bản sao luật pháp ở câu trước. Nhịp câu duy trì chuỗi mục đích của nguyên văn: học kính sợ, tuân giữ và làm theo.'
