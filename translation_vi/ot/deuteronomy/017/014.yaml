  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: vi
  text: 'Khi anh em vào vùng đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em, chiếm hữu vùng đất ấy và cư ngụ tại đó, rồi nói: “Tôi sẽ lập một vua cai trị tôi[a], giống như mọi dân tộc chung quanh tôi,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi muốn lập một vua cai trị tôi.” Nguyên văn Hê-bơ-rơ sát nghĩa là: “Tôi sẽ/ muốn đặt một vua trên tôi.”'
    reason: אָשִׂימָה là dạng cohortative, có thể diễn tả ý định hoặc quyết định của người nói; עָלַי (“trên tôi”) chỉ địa vị cai trị của vua.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Khi anh em vào
  rationale: כִּי mở đầu một hoàn cảnh tương lai được dự liệu, nên dịch là “Khi”; בוא với אֶל־הָאָרֶץ mang nghĩa đi vào. “Anh em” giữ lời xưng hô số ít mang tính tập thể với Israel theo lối Việt ngữ tự nhiên.
- source_word: הָאָרֶץ
  choice: vùng đất
  rationale: Chỉ miền đất Yahweh ban cho Israel. “Vùng đất” tự nhiên trong tiếng Việt và tránh gợi rằng đây chỉ là đất đai nói chung.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ nguyên danh riêng giao ước יְהוָה là “Yahweh”; אֱלֹהֶיךָ được dịch theo quan hệ ngôi thứ hai số ít tập thể.
- source_word: נֹתֵן לָךְ
  choice: đang ban cho anh em
  rationale: Phân từ נֹתֵן diễn tả hành động ban đang diễn tiến hoặc được xem là hiện thực chắc chắn trong bối cảnh tương lai; “ban” phù hợp văn phong trang trọng.
- source_word: וִירִשְׁתָּהּ
  choice: chiếm hữu
  rationale: ירשׁ trong ngữ cảnh về đất mang nghĩa tiếp quản và sở hữu vùng đất; “chiếm hữu” giữ được sắc thái chủ động mà không thu hẹp thành chỉ thừa kế.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: cư ngụ tại đó
  rationale: ישׁב ở đây chỉ việc định cư và sinh sống lâu dài; “cư ngụ” trang trọng nhưng vẫn dễ hiểu.
- source_word: וְאָמַרְתָּ
  choice: rồi nói
  rationale: Diễn đạt tự nhiên trình tự của chuỗi động từ có waw trong tình huống luật định.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: Tôi muốn lập một vua cai trị mình
  rationale: אָשִׂימָה là thể cohortative, biểu thị ý muốn hoặc quyết định của người nói; שׂים mang nghĩa đặt/lập, còn עָלַי thể hiện nhà vua ở trên người nói về quyền cai trị.
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: giống như mọi dân tộc chung quanh tôi
  rationale: גּוֹיִם ở đây là các dân tộc hay quốc gia lân cận; giữ ngôi thứ nhất trong lời trích dẫn.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH; phiên âm “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Sắc thái của yêu cầu lập vua
  choice: Tôi muốn lập một vua cai trị mình
  alternative: Tôi sẽ lập một vua trên mình
  rationale: Cohortative אָשִׂימָה có thể diễn tả ý muốn hoặc quyết định. Bản dịch giữ ý chủ động mong muốn mà không thêm phán xét thần học về chế độ quân chủ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho ngôi thứ hai số ít mang tính tập thể chỉ Israel; trong lời trích dẫn giữ ngôi “tôi”. Dùng “một vua” thay cho “một vị vua” để gần cấu trúc nguyên ngữ và tránh tăng sắc thái tôn kính.
