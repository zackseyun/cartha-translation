revisions:
- from: 'Khi anh em vào vùng đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em, chiếm hữu và cư ngụ tại đó, rồi nói: “Tôi muốn lập một vua cai trị mình[a], giống như mọi dân tộc chung quanh tôi,”'
  to: 'Khi anh em vào vùng đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em, chiếm hữu vùng đất ấy và cư ngụ tại đó, rồi nói: “Tôi sẽ lập một vua cai trị tôi[a], giống như mọi dân tộc chung quanh tôi,”'
  rationale: Sửa cụm lời trích dẫn để giữ trung tính hơn đối với sắc thái cohortative, làm rõ ngôi thứ nhất và quan hệ quyền cai trị, đồng thời chỉnh nhẹ cú pháp của chuỗi động từ. Ý nghĩa, thì cảnh tương lai, danh Yahweh và tính mơ hồ hợp lý của cohortative đều được bảo toàn trong bản văn và chú thích.
