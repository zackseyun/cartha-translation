  text: וְ/עָנִ֨יתָ וְ/אָמַרְתָּ֜ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲרַמִּי֙ אֹבֵ֣ד אָבִ֔/י וַ/יֵּ֣רֶד מִצְרַ֔יְמָ/ה וַ/יָּ֥גָר שָׁ֖ם בִּ/מְתֵ֣י מְעָ֑ט וַֽ/יְהִי שָׁ֕ם לְ/ג֥וֹי גָּד֖וֹל עָצ֥וּם וָ/רָֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: vi
  text: 'Anh em phải đáp và thưa trước mặt Yahweh, Đức Chúa Trời của anh em: “Cha tôi là một người A-ram đang lâm cảnh diệt vong[a]. Ông đã xuống Ai Cập và kiều ngụ tại đó với chỉ ít người; và tại đó, ông đã trở thành một dân tộc lớn, hùng mạnh và đông đảo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Cha tôi là một người A-ram phiêu bạt.” Phân từ Hê-bơ-rơ có thể được hiểu là “đang diệt vong” hoặc “phiêu bạt”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: phải đáp và thưa
  rationale: Giữ hai động từ trong công thức nghi lễ của tiếng Hê-bơ-rơ; “thưa” tạo sắc thái trang trọng, còn “đáp” bảo tồn thành ngữ nguồn.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: trước mặt Yahweh, Đức Chúa Trời của mình
  rationale: “Trước mặt” diễn đạt tự nhiên לִפְנֵי; “Yahweh” chuyển tự danh riêng của Đức Chúa Trời, còn đại từ phản thân tránh lặp “anh em” nặng nề.
- source_word: אֲרַמִּי
  choice: một người A-ram
  rationale: Đây là tên gọi sắc tộc chính xác hơn “người Sy-ri” trong bối cảnh tổ phụ.
- source_word: אֹבֵד
  choice: đang lâm cảnh diệt vong
  rationale: Phân từ Qal diễn tả tình trạng đang mất đi hoặc lâm nguy; cách dịch này bảo tồn nét nghĩa trực tiếp mà không biến nó thành hành động ngoại động. Nghĩa truyền thống “phiêu bạt” được ghi ở chú thích.
- source_word: אָבִי
  choice: cha tôi
  rationale: Giữ số ít và hình ảnh trực tiếp của nguyên văn, thay vì diễn giải thành “tổ tiên tôi”.
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: Ông đã xuống Ai Cập
  rationale: Giữ động từ chỉ hướng “xuống”, vốn là cách diễn đạt địa lý quen thuộc của tiếng Hê-bơ-rơ.
- source_word: וַיָּגָר שָׁם
  choice: kiều ngụ tại đó
  rationale: “Kiều ngụ” thể hiện việc cư trú với thân phận ngoại kiều, chính xác hơn “ở lại”.
- source_word: בִּמְתֵי מְעָט
  choice: khi chỉ có ít người
  rationale: Diễn đạt tự nhiên thành ngữ chỉ một nhóm người rất nhỏ, không giới hạn vào nam giới trưởng thành.
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: tại đó, ông đã trở thành một dân tộc
  rationale: 'Giữ chủ ngữ số ít mang tính đại diện của nguyên văn: người tổ phụ trở thành một dân tộc qua dòng dõi mình.'
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: lớn, hùng mạnh và đông đảo
  rationale: Bảo tồn ba vế tích lũy về quy mô, sức mạnh và số lượng.
theological_decisions:
- issue: Cách hiểu אֲרַמִּי אֹבֵד אָבִי
  choice: Cha tôi là một người A-ram đang lâm cảnh diệt vong
  alternative: Cha tôi là một người A-ram phiêu bạt
  rationale: Theo cách chấm nguyên âm Masoret, “cha tôi” tự nhiên là chủ ngữ của phân từ. אֹבֵד có thể chỉ người đang mất đi hoặc lâm cảnh diệt vong; truyền thống cũng hiểu là “phiêu bạt”. Bản dịch chính chọn nghĩa từ vựng trực tiếp hơn nhưng giữ cách hiểu kia trong chú thích, không dùng cách diễn giải ngoại động “một người A-ram tìm cách tiêu diệt cha tôi” vốn không do cú pháp này đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có tính nghi lễ. Dùng “anh em” theo lối xưng hô cộng đồng quen thuộc trong tiếng Việt, dù động từ Hê-bơ-rơ ở số ít và nói với từng người đại diện. “Kiều ngụ” hơi trang trọng nhưng diễn đạt gọn, đúng địa vị ngoại kiều. Danh Yahweh được chuyển tự để giữ tính chất danh riêng.
