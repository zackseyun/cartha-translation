  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: vi
  text: Hôm nay, anh em đã tuyên nhận rằng Yahweh là Đức Chúa Trời của anh em, rằng anh em sẽ bước đi trong đường lối Ngài, gìn giữ các luật lệ, điều răn và phán quyết của Ngài, và vâng nghe tiếng Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vâng nghe tiếng Ngài” dịch sát hình ảnh tiếng Hê-bơ-rơ là “nghe tiếng Ngài”; trong ngữ cảnh này, việc nghe bao hàm sự vâng phục.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: הֶאֱמַרְתָּ
  choice: đã tuyên nhận
  rationale: Dạng Hiphil hiếm gặp ở đây mang sắc thái tuyên bố hoặc xác nhận chính thức trong giao ước; “tuyên nhận” tự nhiên và trang trọng hơn “nói”.
- source_word: הַיּוֹם
  choice: Hôm nay
  rationale: Chuyển tải trực tiếp sự nhấn mạnh về thời điểm bằng tiếng Việt hiện đại.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: là Đức Chúa Trời của mình
  rationale: Diễn đạt tự nhiên mối quan hệ giao ước được thể hiện bởi cấu trúc nguyên mẫu tiếng Hê-bơ-rơ.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: bước đi trong các đường lối Ngài
  rationale: Giữ nguyên hình ảnh giao ước “bước đi” thay vì diễn giải thành “sống theo”.
- source_word: חֻקָּיו
  choice: các luật lệ của Ngài
  rationale: Phân biệt thuật ngữ pháp lý này với “điều răn” và “phán quyết”, đồng thời vẫn dễ hiểu.
- source_word: מִצְוֺתָיו
  choice: các điều răn của Ngài
  rationale: Cách dịch quen thuộc, phù hợp sắc thái mệnh lệnh trong giao ước.
- source_word: מִשְׁפָּטָיו
  choice: các phán quyết của Ngài
  rationale: Giữ mối liên hệ với hoạt động xét xử và không đồng nhất thuật ngữ này với luật lệ hay điều răn.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: vâng nghe tiếng Ngài
  rationale: “Vâng nghe” vừa giữ hình ảnh nghe tiếng vừa thể hiện sắc thái tuân phục của שׁמע trong ngữ cảnh giao ước.
theological_decisions:
- issue: Công thức tuyên nhận giao ước và phạm vi của các nguyên mẫu liên kết
  choice: Hiểu đây là lời Israel chính thức tuyên nhận Yahweh là Đức Chúa Trời của mình và cam kết thực hiện các bổn phận giao ước tiếp theo.
  alternative: 'Có thể dịch sát hình thức hơn bằng một chuỗi nguyên mẫu: “để Ngài làm Đức Chúa Trời của anh em, để bước đi..., giữ... và nghe...”'
  rationale: Động từ tuyên nhận hiếm gặp cùng các nguyên mẫu diễn tả một hành vi xác nhận giao ước và những cam kết đi kèm. Cách dịch làm rõ quan hệ cú pháp nhưng không thêm một hệ thống thần học riêng.
- issue: Sắc thái của שׁמע בקול
  choice: “vâng nghe tiếng Ngài”
  alternative: “nghe tiếng Ngài” hoặc “vâng lời Ngài”
  rationale: Cách chọn giữ đồng thời nghĩa đen liên quan đến nghe và hàm ý vâng phục, không ép câu chỉ theo một trong hai sắc thái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” biểu thị đại từ ngôi hai số ít mang tính tập thể trong tiếng Hê-bơ-rơ, chỉ toàn thể Israel. “Ngài” được dùng nhất quán cho đại từ quy chiếu về Yahweh.
