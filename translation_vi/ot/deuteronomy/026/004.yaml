base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: vi
  text: Rồi thầy tế lễ sẽ nhận chiếc giỏ từ tay bạn và đặt nó trước bàn thờ của Yahweh, Đức Chúa Trời của bạn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Nêu dạng danh trong nguyên văn và cách dịch truyền thống.
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ... sẽ nhận
  rationale: Trong chuỗi chỉ dẫn nghi lễ, động từ Qal hoàn thành có waw mang ý nghĩa bước tiếp theo; “Rồi ... sẽ” diễn đạt tự nhiên trình tự ấy. “Nhận ... từ tay” phù hợp hơn “lấy” trong hành động chuyển giao.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Danh từ số ít xác định, chỉ người thi hành nghi lễ; đây là cách gọi rõ ràng và quen thuộc trong tiếng Việt.
- source_word: הַטֶּנֶא
  choice: chiếc giỏ
  rationale: טֶנֶא chỉ chiếc giỏ đựng sản vật đầu mùa trong ngữ cảnh này.
- source_word: מִיָּדֶךָ
  choice: từ tay anh em
  rationale: Giữ hình ảnh cụ thể về việc trao chiếc giỏ từ tay người dâng lễ. Đại từ Hê-bơ-rơ ở ngôi hai số ít giống đực được chuyển thành “anh em” số ít theo lối xưng hô trực tiếp, trang trọng.
- source_word: וְהִנִּיחוֹ
  choice: và đặt nó
  rationale: Hiphil của נוח ở đây có nghĩa là đặt/để; “đặt nó” tự nhiên, không thêm sắc thái “xuống” không cần thiết. Đại từ “nó” quy chiếu về chiếc giỏ.
- source_word: לִפְנֵי
  choice: trước
  rationale: Giữ nghĩa không gian và nghi lễ thông thường của giới từ này trong quan hệ với bàn thờ.
- source_word: מִזְבַּח
  choice: bàn thờ
  rationale: Thuật ngữ tiếng Việt thông dụng chỉ nơi dâng sinh tế.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ lại danh giao ước thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở hữu và lời xưng hô trực tiếp của hậu tố ngôi hai số ít.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh. “Yahweh” giữ đây là danh riêng, còn chú thích nêu truyền thống thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi hai số ít giống đực trong lời luật pháp hướng đến từng người Y-sơ-ra-ên; câu giữ trình tự nghi lễ rõ ràng.
