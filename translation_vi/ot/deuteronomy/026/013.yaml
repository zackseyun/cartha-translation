revisions:
- from: 'Rồi anh em phải thưa trước mặt Yahweh, Đức Chúa Trời của mình: “Con đã đem phần thánh ra khỏi nhà và cũng đã trao phần ấy cho người Lê-vi, ngoại kiều thường trú[a], trẻ mồ côi, và góa phụ, đúng theo mọi điều Ngài đã truyền cho con. Con không vi phạm các điều răn của Ngài, cũng không quên chúng.”'
  to: 'Rồi ngươi phải thưa trước mặt Yahweh, Đức Chúa Trời của ngươi: “Con đã đem phần thánh ra khỏi nhà và cũng đã trao phần ấy cho người Lê-vi, ngoại kiều thường trú[a], trẻ mồ côi, và góa phụ, đúng theo mọi điều Ngài đã truyền cho con. Con không vi phạm các điều răn của Ngài, cũng không quên chúng.”'
  rationale: Chỉ sửa câu dẫn từ số nhiều “anh em” sang số ít “ngươi”, đồng thời đổi “của mình” thành “của ngươi”, để bảo toàn ngôi số ít của nguyên văn và tạo sự nhất quán với lời tuyên xưng “con—Ngài”. Các lựa chọn còn lại được giữ nguyên vì truyền đạt đúng nghĩa và phù hợp văn phong hiện đại trang trọng.
  reviewer_model: gpt-5.6-terra
