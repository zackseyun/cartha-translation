  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: vi
  text: 'Rồi ngươi phải thưa trước mặt Yahweh, Đức Chúa Trời của ngươi: “Con đã đem phần thánh ra khỏi nhà và cũng đã trao phần ấy cho người Lê-vi, ngoại kiều thường trú[a], trẻ mồ côi, và góa phụ, đúng theo mọi điều Ngài đã truyền cho con. Con không vi phạm các điều răn của Ngài, cũng không quên chúng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người ngoại quốc cư trú.” Từ Hê-bơ-rơ chỉ người ngoài dân Israel sống thường xuyên giữa cộng đồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Rồi anh em phải thưa
  rationale: Vav nối tiếp trình tự nghi lễ; “rồi” diễn đạt tiến trình tự nhiên. Đại từ số ít đại diện được chuyển thành “anh em” theo cách xưng hô cộng đồng tự nhiên trong tiếng Việt, còn “thưa” phù hợp lời tuyên xưng hướng lên Đức Chúa Trời.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: trước mặt Yahweh, Đức Chúa Trời của mình
  rationale: לִפְנֵי là “trước mặt/trong sự hiện diện của”; giữ trực tiếp danh giao ước יְהוָה là “Yahweh” và diễn đạt quan hệ ngôi thứ hai tự nhiên bằng “của mình”.
- source_word: בִּעַרְתִּי
  choice: Con đã đem ... ra
  rationale: Trong ngữ cảnh phần mười, động từ chỉ việc loại bỏ hoặc dọn phần đã biệt riêng khỏi nhà, không phải thiêu đốt.
- source_word: הַקֹּדֶשׁ
  choice: phần thánh
  rationale: Danh từ có nghĩa đen là “vật thánh,” nhưng ở đây chỉ phần sản vật hoặc phần mười đã được biệt riêng; “phần thánh” vừa rõ vừa gần nguyên văn.
- source_word: מִן הַבַּיִת
  choice: khỏi nhà
  rationale: Giữ danh từ xác định của tiếng Hê-bơ-rơ mà không thêm “nhà con,” dù ngữ cảnh hàm ý nhà của người nói.
- source_word: וְגַם נְתַתִּיו
  choice: và cũng đã trao phần ấy
  rationale: Hậu tố đại từ trở lại “phần thánh”; lặp “phần ấy” giúp câu tiếng Việt rõ nghĩa.
- source_word: לַלֵּוִי
  choice: cho người Lê-vi
  rationale: Bản văn nói đến người Lê-vi nói chung, không thu hẹp thành thầy tế lễ.
- source_word: לַגֵּר
  choice: ngoại kiều thường trú
  rationale: גֵּר chỉ người ngoại tộc cư trú giữa cộng đồng Israel; cách dịch này làm rõ cả địa vị ngoại kiều lẫn tính cư trú.
- source_word: לַיָּתוֹם
  choice: trẻ mồ côi
  rationale: Thuật ngữ chỉ người con mất sự bảo trợ của cha trong công thức pháp lý về các nhóm dễ bị tổn thương; “trẻ mồ côi” là cách nói tự nhiên hiện nay.
- source_word: וְלָאַלְמָנָה
  choice: góa phụ
  rationale: Cách dịch chính xác, gọn và trang trọng cho nhóm xã hội được nêu.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: đúng theo mọi điều Ngài đã truyền cho con
  rationale: Truyền đạt đầy đủ ý tuân theo toàn bộ mệnh lệnh, đồng thời tránh lối lặp “điều răn mà Ngài đã truyền” kém tự nhiên trong tiếng Việt.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: Con không vi phạm các điều răn của Ngài
  rationale: עבר מן trong ngữ cảnh luật pháp mang nghĩa vượt quá hoặc vi phạm; “vi phạm” rõ nghĩa và giữ số nhiều của מִצְוֺת.
- source_word: וְלֹא שָׁכָחְתִּי
  choice: cũng không quên chúng
  rationale: Đại từ “chúng” quy chiếu tự nhiên về các điều răn; giữ vế phủ định song song của nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” giữ sự phân biệt giữa danh riêng này và tước hiệu אֲדֹנָי.
- issue: Phạm vi của הַקֹּדֶשׁ
  choice: phần thánh
  alternative: vật thánh / phần mười đã biệt riêng
  rationale: “Phần thánh” bảo toàn ngôn ngữ thánh hiến mà không giải thích quá mức rằng danh từ tự nó có nghĩa riêng là “phần mười”; ngữ cảnh cho biết đó là phần được dành để phân phát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Lời tuyên xưng dùng cặp xưng hô “con—Ngài” để thể hiện lời thưa trực tiếp với Đức Chúa Trời; câu dẫn dùng “anh em” theo lối xưng hô cộng đồng phổ biến trong bản dịch Kinh Thánh tiếng Việt. Chỉ đặt chú thích tại thuật ngữ xã hội có sắc thái khó chuyển trọn vẹn.
