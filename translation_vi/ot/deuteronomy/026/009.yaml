source:
  edition: WLC
  text: וַ/יְבִאֵ֖/נוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יִּתֶּן לָ֨/נוּ֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: vi
  text: Ngài đã đưa chúng ta đến nơi này và ban cho chúng ta miền đất này, một miền đất tràn trề sữa và mật[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một miền đất dồi dào sữa và mật”; thành ngữ Hê-bơ-rơ mô tả sự màu mỡ và dư dật.'
    reason: lexical_alternative
  - marker: b
    text: Từ “mật” trong một số văn cảnh có thể bao gồm mật quả, chẳng hạn si-rô chà là, chứ không chỉ mật ong.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: Ngài đã đưa chúng ta đến
  rationale: Động từ בוא ở thể Hiphil với hậu tố ngôi thứ nhất số nhiều diễn tả việc khiến hoặc dẫn một nhóm người đến một đích; “đưa chúng ta đến” tự nhiên và giữ được sắc thái tác động.
- source_word: הַמָּקוֹם הַזֶּה
  choice: nơi này
  rationale: מָקוֹם có nghĩa thông thường là “nơi”; cách dịch này rõ ràng và giữ nguyên ý chỉ định của הַזֶּה.
- source_word: וַיִּתֶּן לָנוּ
  choice: và ban cho chúng ta
  rationale: נתן với לָנוּ diễn tả việc trao cho người nhận. “Ban cho” phù hợp với hành động của Đức Chúa Trời trong văn mạch và có sắc thái trang trọng tự nhiên, nhưng không thêm ý nghĩa ngoài động từ “cho”.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: miền đất này
  rationale: אֶרֶץ tại đây chỉ lãnh thổ được ban cho Israel. “Miền đất” tự nhiên trong tiếng Việt và cụ thể hơn “đất” đơn lẻ.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: một miền đất tràn trề sữa và mật
  rationale: Phân từ זָבַת theo nghĩa đen gợi hình ảnh tuôn chảy, và thành ngữ diễn tả sự màu mỡ, dư dật. “Tràn trề” vừa giữ hình ảnh phong phú vừa tự nhiên hơn cách nói cứng “chảy sữa và mật” trong tiếng Việt hiện đại.
- source_word: דְבָשׁ
  choice: mật
  rationale: דְבָשׁ thường chỉ mật ong nhưng trong một số văn cảnh có thể bao gồm mật quả hoặc si-rô, như mật chà là. “Mật” giữ được độ rộng nghĩa tốt hơn “mật ong”; chú thích nêu rõ khả năng này.
theological_decisions:
- issue: Chủ thể thần linh không được nêu đích danh trong chính câu này
  choice: Dùng đại từ “Ngài” thay vì thêm danh xưng “Đức Giê-hô-va”
  alternative: “Đức Giê-hô-va đã đưa chúng ta…” hoặc “Người đã đưa chúng ta…”
  rationale: Bản Hê-bơ-rơ dùng các động từ ngôi thứ ba số ít và dựa vào văn mạch trước để xác định chủ thể là Đức Giê-hô-va. “Ngài” duy trì sự liên kết ấy mà không chèn danh thần vào nơi nguyên văn không nhắc lại; đồng thời đây là đại từ tiếng Việt tự nhiên dành cho Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” phản ánh chủ thể thần linh đã rõ từ văn mạch mà không thêm danh xưng vào câu. “Tràn trề sữa và mật” bảo tồn hình ảnh của thành ngữ Hê-bơ-rơ trong một cấu trúc tiếng Việt tự nhiên. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn và theo đúng thứ tự.
