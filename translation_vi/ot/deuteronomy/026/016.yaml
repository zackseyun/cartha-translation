  text: הַ/יּ֣וֹם הַ/זֶּ֗ה יְהוָ֨ה אֱלֹהֶ֜י/ךָ מְצַוְּ/ךָ֧ לַ/עֲשׂ֛וֹת אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה וְ/אֶת הַ/מִּשְׁפָּטִ֑ים וְ/שָׁמַרְתָּ֤ וְ/עָשִׂ֨יתָ֙ אוֹתָ֔/ם בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: vi
  text: Hôm nay, Yahweh, Đức Chúa Trời của ngươi, truyền cho ngươi phải thi hành các luật lệ và phán quyết này. Ngươi phải tuân giữ và thi hành chúng hết lòng, hết linh hồn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “linh hồn” cũng có thể có nghĩa là “sự sống” hoặc “toàn thể con người.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: Hôm nay
  rationale: Cụm chỉ thời gian mang tính nhấn mạnh; “Hôm nay” tự nhiên trong tiếng Việt và vẫn giữ tính trực tiếp của lời giao ước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt quan hệ giao ước; “anh em” giữ lối xưng hô trực tiếp với cộng đồng Israel trong tiếng Việt tự nhiên.
- source_word: מְצַוְּךָ
  choice: truyền cho anh em
  rationale: Phân từ diễn tả mệnh lệnh có hiệu lực ngay trong hiện tại; động từ “truyền” phù hợp văn cảnh luật pháp trang trọng.
- source_word: לַעֲשׂוֹת
  choice: thi hành
  rationale: Trong văn cảnh luật pháp, “thi hành” diễn đạt tự nhiên hành động thực hiện điều được truyền, không chỉ nghe hay biết.
- source_word: הַחֻקִּים
  choice: các luật lệ
  rationale: Giữ sắc thái quy định được ấn định và phân biệt tương đối với מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: phán quyết
  rationale: Giữ sắc thái pháp lý của những phán quyết hoặc quy định tư pháp.
- source_word: וְשָׁמַרְתָּ
  choice: Anh em phải tuân giữ
  rationale: Thể hiện sức mạnh khuyến lệnh của dạng động từ trong ngữ cảnh giao ước; “tuân giữ” tự nhiên hơn “giữ” đơn thuần khi nói về luật.
- source_word: וְעָשִׂיתָ אֹתָם
  choice: và thi hành chúng
  rationale: Giữ sự lặp lại của động từ עשה và cặp ý “tuân giữ và thi hành” đặc trưng trong Phục Truyền Luật Lệ Ký.
- source_word: בְּכָל לְבָבְךָ
  choice: hết lòng
  rationale: Thành ngữ tiếng Việt tự nhiên, bao hàm ý chí, tư tưởng và tình cảm của לֵבָב.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: hết linh hồn
  rationale: Giữ thuật ngữ truyền thống đồng thời chú thích phạm vi nghĩa rộng của נֶפֶשׁ.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VА / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng; phiên âm giữ sự phân biệt giữa danh giao ước và tước hiệu.
- issue: Đại từ ngôi hai số ít chỉ Israel như một tập thể
  choice: anh em
  alternative: ngươi
  rationale: Tiếng Hebrew dùng số ít để trực tiếp nói với Israel như một cộng đồng giao ước. “Anh em” tự nhiên và trang trọng trong tiếng Việt hiện đại, dù không biểu thị hình thái số ít; không thêm tên “Israel” vốn không có trong câu.
- issue: Phạm vi nghĩa của נֶפֶשׁ
  choice: linh hồn, kèm chú thích “sự sống” hoặc “toàn thể con người”
  alternative: sự sống / toàn thể con người
  rationale: Giữ âm hưởng quen thuộc của công thức giao ước nhưng không thu hẹp từ Hebrew vào quan niệm linh hồn tách biệt khỏi thân thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu phẩy bao quanh “Đức Chúa Trời của anh em” làm rõ đây là thành phần đồng vị với Yahweh. Chia thành hai câu để tiếng Việt sáng rõ mà không thêm quan hệ suy luận; liên từ Hebrew được thể hiện qua sự tiếp nối trực tiếp. Dùng “anh em” nhất quán cho đối tượng giao ước tập thể.
