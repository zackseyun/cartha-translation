  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: vi
  text: Bấy giờ, chúng tôi kêu cầu Yahweh, Đức Chúa Trời của tổ phụ chúng tôi, và Yahweh nghe tiếng chúng tôi, thấy cảnh khốn khổ, nỗi nhọc nhằn và sự áp bức chúng tôi phải chịu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: chúng tôi kêu cầu
  rationale: Động từ צעק diễn tả tiếng kêu khẩn thiết xin cứu giúp; “kêu cầu” tự nhiên trong tiếng Việt và giữ được sắc thái hướng lời kêu lên Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Đức Chúa Trời của tổ phụ chúng tôi
  rationale: Giữ công thức giao ước nói về Đức Chúa Trời của các bậc cha ông Israel; “tổ phụ” trang trọng, rõ nghĩa và phù hợp ngữ cảnh.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: nghe tiếng chúng tôi
  rationale: Giữ sát thành ngữ Hê-bơ-rơ “nghe tiếng chúng tôi,” đồng thời tiếng Việt vẫn tự nhiên và hàm ý Ngài nghe lời kêu cứu.
- source_word: וַיַּרְא
  choice: thấy
  rationale: Phản ánh trực tiếp động từ ראה mà không diễn giải quá mức; trong ngữ cảnh, từ này hàm ý sự lưu tâm.
- source_word: עָנְיֵנוּ
  choice: cảnh khốn khổ
  rationale: עֳנִי chỉ tình trạng khốn khổ, đau đớn hoặc bị hạ nhục; cách dịch này tự nhiên và phân biệt với hai danh từ tiếp theo.
- source_word: עֲמָלֵנוּ
  choice: nỗi nhọc nhằn
  rationale: עָמָל có thể chỉ sự lao nhọc, vất vả hoặc khốn khó; “nỗi nhọc nhằn” giữ được độ rộng nghĩa và phù hợp cảnh lao dịch tại Ai Cập.
- source_word: לַחֲצֵנוּ
  choice: sự áp bức chúng tôi phải chịu
  rationale: לַחַץ chỉ sức ép hoặc sự áp bức do kẻ khác gây ra; thêm “chúng tôi phải chịu” làm rõ quan hệ sở hữu trong tiếng Việt mà không thêm ý mới.
theological_decisions:
- issue: Cách thể hiện danh giao ước יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh יהוה; chuyển tự “Yahweh” bảo tồn tính chất danh riêng và tránh thay bằng tước hiệu.
- issue: Ý nghĩa của việc Yahweh “thấy”
  choice: giữ nguyên động từ “thấy”
  alternative: đoái xem / lưu tâm đến
  rationale: Bản dịch không giải quyết thay nguyên văn mức độ hàm ý thần học của ראה; “thấy” vừa sát nguồn vừa cho phép ngữ cảnh truyền đạt sự quan tâm và can thiệp.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng tôi” theo lời tuyên xưng tập thể của Israel; giữ ba nét nghĩa song song nhưng phân biệt: cảnh khốn khổ, nỗi nhọc nhằn, và sự áp bức.'
