revisions:
- from: Yahweh đã đưa chúng tôi ra khỏi Ai Cập bằng bàn tay mạnh mẽ, bằng cánh tay giương ra, bằng nỗi kinh hoàng lớn lao[a], cùng những dấu lạ và những việc kỳ diệu.
  to: Yahweh đã đưa chúng tôi ra khỏi Ai Cập bằng bàn tay mạnh mẽ, bằng cánh tay giơ ra, bằng nỗi kinh hoàng lớn lao[a], cùng dấu lạ và việc kỳ diệu.
  rationale: Chỉnh sửa chỉ nhằm tăng tính tự nhiên của tiếng Việt và nhịp liệt kê, không thay đổi nghĩa. Cách dịch chính vẫn giữ sắc thái mạnh của מוֹרָא, còn chú thích bảo tồn các khả năng từ vựng khác của từ này.
