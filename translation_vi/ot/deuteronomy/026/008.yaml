source:
  edition: WLC
  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: vi
  text: Yahweh đã đưa chúng tôi ra khỏi Ai Cập bằng bàn tay mạnh mẽ, bằng cánh tay giơ ra, bằng nỗi kinh hoàng lớn lao[a], cùng dấu lạ và việc kỳ diệu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự kính sợ lớn lao” hoặc “những việc gây kinh sợ lớn lao.” Từ Hê-bơ-rơ có thể chỉ nỗi sợ, sự kinh hoàng, hoặc một sự biểu lộ khiến người ta kính sợ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: đã đưa chúng tôi ra
  rationale: Thể Hiphil của יצא mang nghĩa khiến đi ra hoặc đưa ra; cách dịch này tự nhiên trong tiếng Việt và giữ rõ mô-típ xuất hành.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản nguồn, thay vì thay thế bằng một tước hiệu.
- source_word: מִמִּצְרַיִם
  choice: ra khỏi Ai Cập
  rationale: Kết hợp tự nhiên với động từ “đưa ... ra” và phản ánh hướng chuyển động ra khỏi Ai Cập.
- source_word: בְּיָד חֲזָקָה
  choice: bằng bàn tay mạnh mẽ
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ về quyền năng hành động, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: bằng cánh tay giương ra
  rationale: Giữ nguyên hình ảnh “cánh tay” được duỗi hoặc giương ra, biểu thị quyền năng đang được thi hành.
- source_word: וּבְמֹרָא גָּדֹל
  choice: bằng nỗi kinh hoàng lớn lao
  rationale: מוֹרָא có thể chỉ sự sợ hãi, kinh hoàng hoặc một sự biểu lộ gây kính sợ; bản dịch chính giữ sắc thái mạnh của từ, còn chú thích bảo tồn các khả năng khác.
- source_word: וּבְאֹתוֹת
  choice: cùng những dấu lạ
  rationale: אוֹת ở đây là các dấu hiệu có ý nghĩa và mang tính siêu nhiên; “dấu lạ” rõ nghĩa, gọn và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: וּבְמֹפְתִים
  choice: và những việc kỳ diệu
  rationale: מוֹפֵת chỉ những việc phi thường gây kinh ngạc; cách dịch này phân biệt vừa đủ với “dấu lạ” mà không thu hẹp nghĩa thành một loại phép lạ cụ thể.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Chúa Hằng Hữu; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước; giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của מוֹרָא trong công thức xuất hành
  choice: nỗi kinh hoàng lớn lao
  alternative: sự kính sợ lớn lao; những việc gây kinh sợ lớn lao
  rationale: Từ này cho phép cả cách hiểu về nỗi sợ được gây nên lẫn sự biểu lộ gây kính sợ. Bản chính chọn sắc thái mạnh phù hợp bối cảnh, còn chú thích công khai giữ sự mơ hồ từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Phép lặp “bằng” phản ánh chuỗi בְּ trong nguyên văn và tạo nhịp liệt kê; các hình ảnh “bàn tay” và “cánh tay” được giữ nguyên thay vì diễn giải thành khái niệm trừu tượng.
