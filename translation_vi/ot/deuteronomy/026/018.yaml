source:
  edition: WLC
  text: וַֽ/יהוָ֞ה הֶאֱמִֽירְ/ךָ֣ הַ/יּ֗וֹם לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/לִ/שְׁמֹ֖ר כָּל מִצְוֺתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: vi
  text: Hôm nay, Đức Giê-hô-va đã tuyên bố rằng anh em là dân riêng quý báu của Ngài[a], như Ngài đã phán với anh em[b], và anh em phải tuân giữ mọi điều răn của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dân là sở hữu quý báu của Ngài”; tiếng Hê-bơ-rơ sát nghĩa là “một dân, một sở hữu quý báu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “như Ngài đã hứa với anh em”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để thể hiện danh riêng YHWH, thay vì thay bằng danh xưng chung “Chúa”.
- source_word: הֶאֱמִירְךָ
  choice: đã tuyên bố rằng anh em
  rationale: Động từ Hiphil hiếm gặp này mang sắc thái tuyên nhận chính thức trong bối cảnh giao ước. “Tuyên bố” giữ được tính chất ngôn hành mà không thêm ý “lựa chọn” vốn không được nói trực tiếp ở đây.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Cách diễn đạt tự nhiên, trực tiếp, giữ nguyên tính cấp thời của lời xác lập giao ước.
- source_word: לִהְיוֹת לוֹ
  choice: sẽ là ... thuộc về Ngài
  rationale: Diễn đạt mục đích hoặc kết quả của lời tuyên bố; “thuộc về Ngài” làm rõ quan hệ sở hữu trong לוֹ mà vẫn tự nhiên trong tiếng Việt.
- source_word: לְעַם סְגֻלָּה
  choice: dân quý báu thuộc về Ngài
  rationale: Giữ cả danh từ עַם, “dân”, lẫn sắc thái của סְגֻלָּה là một tài sản được đặc biệt quý trọng.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: như Ngài đã phán với anh em
  rationale: Bám sát nghĩa cơ bản của דִּבֶּר là “phán/nói”; chú thích ghi nhận cách hiểu theo ngữ cảnh giao ước là “đã hứa”.
- source_word: וְלִשְׁמֹר
  choice: và anh em phải tuân giữ
  rationale: שׁמר đi với điều răn mang nghĩa tuân giữ hoặc vâng giữ. “Phải” diễn đạt tự nhiên bổn phận hàm chứa trong cấu trúc nguyên mẫu liên kết với lời tuyên bố.
- source_word: כָּל מִצְוֺתָיו
  choice: mọi điều răn của Ngài
  rationale: Cách dịch trực tiếp, giữ đúng văn phong giao ước và luật pháp.
theological_decisions:
- issue: Sắc thái giao ước của הֶאֱמִיר
  choice: lời tuyên bố chính thức của Đức Giê-hô-va về địa vị của dân
  alternative: dịch thành “chọn” hoặc dùng một công thức tuyên thệ mạnh hơn
  rationale: “Tuyên bố” bảo toàn tính trang trọng và hiệu lực giao ước của động từ hiếm này, nhưng không đưa thêm một khẳng định thần học về sự tuyển chọn vượt quá câu chữ.
- issue: Quan hệ giữa địa vị dân quý báu và việc tuân giữ điều răn
  choice: giữ hai vế cùng nằm trong nội dung lời tuyên bố mà không giải thích quan hệ nhân quả
  alternative: diễn giải việc tuân giữ là điều kiện để trở thành dân quý báu hoặc là hệ quả của địa vị ấy
  rationale: Cú pháp Hê-bơ-rơ nối hai cấu trúc nguyên mẫu bằng וְ, nhưng không minh thị quan hệ nhân quả; bản dịch giữ nguyên sự căng thẳng đó.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh em” biểu đạt đại từ số ít tập thể trong tiếng Hê-bơ-rơ, tức toàn dân Israel được nói như một cộng đồng. Cấu trúc câu giữ hai nội dung song song: thuộc về Đức Giê-hô-va như dân quý báu và tuân giữ mọi điều răn của Ngài.'
