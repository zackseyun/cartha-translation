  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: vi
  text: và để đặt anh em cao hơn mọi dân tộc mà Ngài đã dựng nên, khiến anh em được ca ngợi, nổi danh và vinh hiển,[a] và để anh em trở thành một dân thánh thuộc về Đức Giê-hô-va, Đức Chúa Trời của anh em, như Ngài đã phán.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để anh em được ca ngợi, có danh tiếng và vẻ huy hoàng.” Từ Hê-bơ-rơ chỉ “danh” có thể hàm nghĩa “danh tiếng” hoặc “danh thơm”; từ cuối cũng có thể mang nghĩa “vẻ đẹp,” “sự huy hoàng,” hoặc “vinh quang.”'
    reason: Làm rõ miền nghĩa của שֵׁם và תִפְאָרֶת, đồng thời bảo tồn cách diễn đạt danh từ của nguyên văn.
  - marker: b
    text: 'Cũng có thể hiểu: “như Ngài đã hứa”; sát nghĩa là “như Ngài đã phán.”'
    reason: Nêu sắc thái lời hứa do văn cảnh gợi ra nhưng không thay thế nghĩa trực tiếp của động từ.
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: và để đặt anh em cao hơn mọi dân tộc
  rationale: Giữ quan hệ mục đích/kết quả của cấu trúc nguyên mẫu và sắc thái tôn cao của עֶלְיוֹן עַל; “cao hơn” tự nhiên hơn cách dịch sát chữ “cao ở trên”.
- source_word: אֲשֶׁר עָשָׂה
  choice: mà Ngài đã dựng nên
  rationale: עָשָׂה là động từ thông dụng chỉ việc làm nên; “dựng nên” phù hợp khi Đức Chúa Trời là chủ thể mà không nhấn mạnh quá mức như “sáng tạo”.
- source_word: לִתְהִלָּה וּלְשֵׁם וּלְתִפְאָרֶת
  choice: khiến anh em được ca ngợi, nổi danh và vinh hiển
  rationale: Ba danh từ chỉ mục đích/kết quả được diễn đạt tự nhiên trong tiếng Việt. שֵׁם ở đây mang nghĩa danh tiếng; תִפְאָרֶת bao gồm vẻ đẹp, sự huy hoàng và vinh hiển. Chú thích bảo tồn các khả năng từ vựng.
- source_word: וְלִהְיֹתְךָ עַם קָדֹשׁ
  choice: đồng thời trở thành một dân thánh
  rationale: Tiếp nối chuỗi mục đích; “trở thành” diễn đạt tự nhiên hơn cấu trúc sát chữ “để anh em là” trong tiếng Việt.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: thuộc về Đức Giê-hô-va, Đức Chúa Trời của anh em
  rationale: Giới từ לְ biểu thị quan hệ thuộc về; dịch rõ nghĩa này. יהוה được phiên âm theo cách gọi phổ biến, trang trọng trong truyền thống Kinh Thánh tiếng Việt.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: như Ngài đã phán
  rationale: Giữ nghĩa trực tiếp của דִּבֵּר là nói/phán, không tự ý làm rõ thành “hứa”, dù văn cảnh giao ước có thể hàm ý lời hứa.
theological_decisions:
- issue: Có nên diễn giải mệnh đề cuối thành một lời hứa rõ ràng hay không
  choice: như Ngài đã phán
  alternative: như Ngài đã hứa
  rationale: Động từ Hê-bơ-rơ chỉ nói/phán; bản dịch giữ nguyên độ rộng nghĩa và để văn cảnh giao ước truyền đạt sắc thái lời hứa.
- issue: Quan hệ giữa dân thánh và יהוה
  choice: một dân thánh thuộc về Đức Giê-hô-va
  alternative: một dân thánh cho Đức Giê-hô-va
  rationale: “Thuộc về” làm rõ giá trị sở hữu/quan hệ của לְ và tự nhiên trong tiếng Việt, nhưng không thêm một cơ chế thần học ngoài bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho đại từ số ít mang nghĩa tập thể chỉ Israel; viết hoa “Ngài” theo quy ước tôn kính phổ biến. Nhịp ba vế được giữ bằng “được ca ngợi, nổi danh và vinh hiển”.
