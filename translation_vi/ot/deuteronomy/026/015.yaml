source:
  edition: WLC
  text: הַשְׁקִיפָ/ה֩ מִ/מְּע֨וֹן קָדְשְׁ/ךָ֜ מִן הַ/שָּׁמַ֗יִם וּ/בָרֵ֤ךְ אֶֽת עַמְּ/ךָ֙ אֶת יִשְׂרָאֵ֔ל וְ/אֵת֙ הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּה לָ֑/נוּ כַּ/אֲשֶׁ֤ר נִשְׁבַּ֨עְתָּ֙ לַ/אֲבֹתֵ֔י/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: vi
  text: Xin từ nơi ngự thánh của Ngài, từ trời, đoái nhìn xuống và ban phước cho dân Ngài là Y-sơ-ra-ên, cùng đất đai Ngài đã ban cho chúng con, như Ngài đã thề với tổ phụ chúng con—một xứ đượm sữa và mật.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: đoái nhìn xuống
  rationale: Động từ mệnh lệnh diễn tả việc Đức Chúa Trời từ trên cao hướng mắt và sự quan tâm xuống; “đoái nhìn xuống” vừa giữ hướng nhìn vừa phù hợp giọng cầu nguyện trang trọng.
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: từ nơi ngự thánh của Ngài
  rationale: מָעוֹן là nơi ở/nơi ngự. “Nơi ngự thánh” tự nhiên trong tiếng Việt, đồng thời giữ sắc thái thiêng liêng của קָדְשְׁךָ.
- source_word: מִן הַשָּׁמַיִם
  choice: từ trời
  rationale: Dạng số nhiều tiếng Hê-bơ-rơ được chuyển theo cách nói địa điểm tự nhiên trong tiếng Việt; cụm này đồng vị với “nơi ngự thánh”.
- source_word: וּבָרֵךְ
  choice: và ban phước
  rationale: Cách diễn đạt rõ ràng, quen thuộc cho mệnh lệnh của ברך trong lời cầu xin.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: dân Ngài là Y-sơ-ra-ên
  rationale: Từ “là” thể hiện quan hệ đồng vị, xác định dân của Ngài chính là Y-sơ-ra-ên.
- source_word: הָאֲדָמָה
  choice: đất đai
  rationale: Trong ngữ cảnh hoa lợi đầu mùa, אֲדָמָה chỉ phần đất được ban để cư ngụ và canh tác. “Đất đai” tự nhiên hơn “đất” đơn lẻ và vẫn phân biệt phần nào với אֶרֶץ (“xứ”) ở cuối câu.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: Ngài đã ban cho chúng con
  rationale: Thì hoàn thành Hê-bơ-rơ được diễn đạt bằng “đã ban”, nêu hành động đã hoàn tất; “chúng con” phù hợp lời tuyên xưng cộng đồng trước Đức Chúa Trời.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: như Ngài đã thề với tổ phụ chúng con
  rationale: “Tổ phụ” giữ nghĩa nam giới cụ thể và sắc thái công thức giao ước, thường chỉ các tổ phụ của Y-sơ-ra-ên.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: một xứ đượm sữa và mật
  rationale: “Đượm sữa và mật” là cách diễn đạt cô đọng, có phẩm cách cho thành ngữ Hê-bơ-rơ chỉ sự phì nhiêu, sung túc; “xứ” giữ sự phân biệt với אֲדָמָה trước đó.
theological_decisions:
- issue: Đối tượng của לַאֲבֹתֵינוּ trong công thức giao ước
  choice: tổ phụ chúng con
  alternative: tổ tiên chúng con
  rationale: Danh từ Hê-bơ-rơ dùng dạng giống đực và trong ngữ cảnh này gợi đến các tổ phụ nhận lời thề giao ước. “Tổ phụ” bảo toàn nét ấy, thay vì mở rộng không cần thiết thành mọi tổ tiên.
- issue: Mối liên hệ giữa “đất đai” được ban và “một xứ đượm sữa và mật”
  choice: giữ cấu trúc bổ nghĩa có thể gắn với lời ban lẫn lời thề
  alternative: diễn giải rõ rằng Đức Chúa Trời đã thề ban chính xứ ấy
  rationale: Cú pháp Hê-bơ-rơ cô đọng; bản dịch không thêm từ để quyết định dứt khoát phạm vi của cụm “như Ngài đã thề”, nhờ đó giữ được độ mở của nguyên văn.
translation_notes:
  register: Văn phong cầu nguyện hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/chúng con” cho lời cộng đồng thưa với Đức Chúa Trời; giữ sự phân biệt từ vựng giữa אֲדָמָה (“đất đai”) và אֶרֶץ (“xứ”). Không đặt chú thích vì “tổ phụ” đã truyền đạt trực tiếp sắc thái của nguyên ngữ và không cần nêu phương án thay thế để hiểu câu.
