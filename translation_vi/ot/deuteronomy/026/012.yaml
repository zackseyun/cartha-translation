source:
  edition: WLC
  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: vi
  text: Khi anh em đã hoàn tất việc trích một phần mười từ toàn bộ sản vật của anh em vào năm thứ ba, là năm dâng phần mười, thì hãy trao phần ấy cho người Lê-vi, ngoại kiều, người mồ côi cha và góa phụ; họ sẽ ăn trong các thành của anh em và được no đủ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong các cổng của anh em,” tức là trong các thành hoặc khu dân cư của anh em.'
    reason: Giữ lại hình ảnh nguyên ngữ và giải thích nghĩa thành ngữ của בִשְׁעָרֶיךָ.
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong ngữ cảnh này, כִּי mở đầu một hoàn cảnh thời gian trước mệnh lệnh tiếp theo.
- source_word: תְכַלֶּה לַעְשֵׂר אֶת כָּל מַעְשַׂר
  choice: đã lấy đủ một phần mười
  rationale: Diễn đạt tự nhiên ý hoàn tất việc lấy riêng toàn bộ phần mười, đồng thời giữ mối liên hệ giữa động từ עשר và danh từ מַעְשַׂר.
- source_word: תְּבוּאָתְךָ
  choice: toàn bộ sản vật của mình
  rationale: תְּבוּאָה chỉ hoa lợi hoặc sản vật thu được từ đất đai; 'sản vật' có phạm vi thích hợp.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁת שְׁנַת הַמַּעֲשֵׂר
  choice: vào năm thứ ba, là năm dâng phần mười
  rationale: Giữ nguyên cách xác định năm thứ ba là năm dành cho phần mười này; thêm 'dâng' để cụm từ rõ và tự nhiên trong tiếng Việt.
- source_word: לַלֵּוִי
  choice: người Lê-vi
  rationale: Cách gọi quen thuộc và chính xác đối với thành viên chi phái Lê-vi.
- source_word: לַגֵּר
  choice: ngoại kiều
  rationale: גֵּר là người từ nơi khác đến nhưng cư trú giữa cộng đồng; 'ngoại kiều' giữ được tính pháp lý-xã hội hơn 'người lạ'.
- source_word: לַיָּתוֹם
  choice: trẻ mồ côi
  rationale: Diễn đạt tự nhiên nhóm người mất sự bảo trợ của cha mẹ trong tiếng Việt hiện đại mà không thu hẹp quá mức theo giới tính của người đã mất.
- source_word: בִשְׁעָרֶיךָ
  choice: trong các thành của anh em
  rationale: Nghĩa đen là 'trong các cổng của anh em', nhưng đây là hoán dụ chỉ các khu dân cư hoặc thành thị thuộc cộng đồng.
- source_word: וְשָׂבֵעוּ
  choice: ăn no nê
  rationale: Kết hợp với וְאָכְלוּ, từ này nói đến việc ăn và được no đủ; 'ăn no nê' gọn và tự nhiên.
theological_decisions:
- issue: Các nhóm được hưởng phần mười trong luật giao ước
  choice: 'Giữ riêng từng nhóm: người Lê-vi, ngoại kiều, trẻ mồ côi và góa phụ'
  alternative: Khái quát thành người phục vụ tôn giáo và những người nghèo khó
  rationale: Bản Hê-bơ-rơ nêu đích danh các đối tượng pháp lý-xã hội; giữ các nhóm cụ thể tránh đưa vào những phạm trù hiện đại rộng hơn.
- issue: Cách hiểu בִשְׁעָרֶיךָ
  choice: Dịch theo nghĩa thành ngữ là 'trong các thành của anh em' và ghi nghĩa đen ở chú thích
  alternative: Dịch sát là 'trong các cổng của anh em'
  rationale: Trong luật Phục Truyền, 'cổng' thường đại diện cho thành hoặc khu dân cư. Bản chính cần dễ hiểu, còn chú thích bảo tồn hình ảnh nguyên ngữ.
- issue: Đối tượng số ít trong tiếng Hê-bơ-rơ và cách xưng hô tiếng Việt
  choice: Dùng 'anh em' theo nghĩa cộng đồng
  alternative: Dùng 'ngươi' ở số ít
  rationale: Các hậu tố ngôi hai số ít trình bày toàn dân như một cộng đồng thống nhất; 'anh em' tự nhiên, trang trọng và không mang sắc thái cổ cứng trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong luật giao ước trang trọng nhưng hiện đại. Dùng 'anh em' để chỉ cộng đồng Ít-ra-ên, tránh đại từ cổ 'ngươi'. Dịch thành ngữ chỉ địa điểm theo nghĩa rõ ràng trong bản chính, kèm nghĩa đen ở chú thích.
