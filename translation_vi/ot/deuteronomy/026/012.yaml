revisions:
- from: Khi anh em đã lấy đủ một phần mười trong toàn bộ sản vật của mình vào năm thứ ba, là năm dâng phần mười, thì hãy trao phần ấy cho người Lê-vi, ngoại kiều, trẻ mồ côi và góa phụ; họ sẽ ăn no nê trong các thành của anh em.[a]
  to: Khi anh em đã hoàn tất việc trích một phần mười từ toàn bộ sản vật của anh em vào năm thứ ba, là năm dâng phần mười, thì hãy trao phần ấy cho người Lê-vi, ngoại kiều, người mồ côi cha và góa phụ; họ sẽ ăn trong các thành của anh em và được no đủ.[a]
  rationale: Sửa hai chỗ để phản ánh sát hơn hành động “hoàn tất việc làm phần mười” và đối tượng “người mồ côi cha”. Không thay đổi trình tự, các nhóm thụ hưởng, hay cách xử lý thành ngữ “trong cổng của anh em”; chú thích vẫn được neo đúng tại cụm địa điểm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:11:06Z'
review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh cụm động từ mở đầu. “đã lấy đủ một phần mười” có thể gợi việc thu/nhận đủ một phần mười, trong khi תְכַלֶּה לַעְשֵׂר diễn tả hoàn tất việc trích hoặc nộp phần mười. “trích một phần mười từ toàn bộ sản vật” phản ánh rõ hơn cấu trúc này. “trẻ mồ côi” là cách dùng tự nhiên, nhưng יָתוֹם theo nghĩa cơ bản là người mất cha; “người mồ côi cha” giữ được nét nghĩa ấy mà vẫn rõ trong tiếng Việt hiện đại. Các thành phần còn lại, gồm cách hiểu “trong các thành” cho בִשְׁעָרֶיךָ cùng chú thích nghĩa đen, là phù hợp.
  naturalness: Bản sửa duy trì văn phong luật lệ trang trọng, hiện đại. “hoàn tất việc trích” tự nhiên hơn “lấy đủ”; “được no đủ” tránh sắc thái cường điệu nhẹ của “ăn no nê” và phản ánh trực tiếp động từ “được thỏa/no”.
  terminology: Giữ “người Lê-vi”, “ngoại kiều”, “góa phụ”, và “phần mười”. “Năm dâng phần mười” được giữ vì là cách gọi rõ nghĩa cho שְׁנַת הַמַּעֲשֵׂר trong ngữ cảnh này, không thêm nội dung đáng kể.
  issues:
  - severity: medium
    issue: “đã lấy đủ một phần mười” chưa phản ánh chính xác hành động hoàn tất việc dâng/trích phần mười.
    rationale: Động từ כלה với infinitive עשר nói về hoàn tất hành vi làm phần mười, không phải về việc nhận hoặc thu đủ một phần mười.
  - severity: low
    issue: “trẻ mồ côi” làm mất nét nghĩa cụ thể “mồ côi cha” của יָתוֹם.
    rationale: Dù “trẻ mồ côi” có thể chấp nhận theo cách dùng bao quát hiện đại, bản dịch có thể giữ nét nghĩa nguyên ngữ mà vẫn tự nhiên bằng “người mồ côi cha”.
  revised_text: Khi anh em đã hoàn tất việc trích một phần mười từ toàn bộ sản vật của anh em vào năm thứ ba, là năm dâng phần mười, thì hãy trao phần ấy cho người Lê-vi, ngoại kiều, người mồ côi cha và góa phụ; họ sẽ ăn trong các thành của anh em và được no đủ.[a]
