  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: vi
  text: Anh em phải lấy một phần hoa lợi đầu mùa[a] từ mọi sản vật của đất mà anh em đem về từ xứ mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em; đặt hoa lợi ấy vào giỏ, rồi đi đến nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn để cho danh Ngài ngự tại đó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát theo lối truyền thống: “phần đầu mùa của mọi hoa lợi từ đất.”'
    reason: Giải thích khả năng dịch מֵרֵאשִׁית và cách hiểu cụm từ chỉ hoa lợi đầu mùa.
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “để cho danh Ngài ngự tại đó.” Đây là cách nói đặc trưng trong Phục Truyền Luật Lệ Ký về nơi Yahweh chọn, gắn với sự thờ phượng Ngài.'
    reason: Bảo tồn và giải thích công thức thần học về danh Đức Chúa Trời ngự tại nơi được chọn.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Anh em phải lấy
  rationale: Dạng hoàn thành Qal nối tiếp trong văn cảnh chỉ thị mang lực mệnh lệnh. “Phải lấy” diễn đạt tự nhiên sắc thái quy định; “anh em” chỉ cộng đồng Israel được nói với như một chủ thể tập thể.
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  choice: một phần hoa lợi đầu mùa trong mọi sản vật của đất
  rationale: מִן cho thấy lấy một phần từ phần đầu tiên, không nhất thiết toàn bộ những gì chín trước. “Hoa lợi đầu mùa” truyền đạt ý nghĩa nông nghiệp của רֵאשִׁית, còn “mọi sản vật của đất” giữ phạm vi rộng của פְּרִי הָאֲדָמָה, không giới hạn vào trái cây.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: mà anh em đem về từ xứ
  rationale: Hiphil của בוא giữ ý chuyển sản vật từ đất đai của người dâng đến nơi quy định. “Đem về” tự nhiên hơn cách dịch máy móc nhưng không thu hẹp nghĩa thành riêng hành động thu hoạch.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em
  rationale: Phân từ נֹתֵן nhấn mạnh hành động ban cho đang diễn ra hoặc có tính thường xuyên. Cấu trúc tiếng Việt gắn mệnh đề này với “xứ”, phù hợp quan hệ cú pháp gần nhất.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu, qua đó phân biệt danh Đức Chúa Trời với danh xưng “Chúa”.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: đặt hoa lợi ấy vào một cái giỏ
  rationale: טֶנֶא là giỏ dùng để đựng hoặc mang nông sản. Lặp lại “hoa lợi ấy” giúp đại từ quy chiếu rõ ràng và tự nhiên trong tiếng Việt.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: rồi đi đến nơi
  rationale: Diễn đạt chuỗi chỉ thị kế tiếp một cách gọn và tự nhiên; “nơi” phù hợp với công thức về địa điểm được chọn trong Phục Truyền Luật Lệ Ký.
- source_word: אֲשֶׁר יִבְחַר
  choice: sẽ chọn
  rationale: Dạng chưa hoàn thành hướng đến việc lựa chọn địa điểm trong tương lai so với lời Môi-se đang nói.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để khiến danh Ngài ngự tại đó
  rationale: Giữ sắc thái nguyên nhân của Hiphil שכן và hình ảnh thần học “danh” ngự tại nơi được chọn, thay vì giản lược thành việc đặt tên, sở hữu hay việc chính Đức Chúa Trời bị giới hạn trong một không gian.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. “Yahweh” bảo tồn tư cách danh giao ước thay vì thay bằng một tước hiệu.
- issue: Công thức nơi thánh לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để khiến danh Ngài ngự tại đó
  alternative: để đặt danh Ngài tại đó
  rationale: Cách dịch đã chọn giữ động tính nguyên nhân của שכן và sự căng thẳng thần học giữa sự hiện diện gắn với danh Đức Chúa Trời và việc Ngài không bị giản lược thành một hữu thể bị chứa trong địa điểm ấy.
- issue: Chủ thể số ít trong lời chỉ thị dành cho Israel
  choice: anh em
  alternative: ngươi
  rationale: Hê-bơ-rơ dùng ngôi hai số ít để nói với Israel như một cộng đồng thống nhất. “Anh em” là cách xưng hô tập thể hiện đại, dễ hiểu và trang trọng vừa phải, dù không biểu thị hình thái số ít của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho cộng đồng Israel, “xứ” cho אֶרֶץ và “đất” cho אֲדָמָה nhằm giữ sự phân biệt từ vựng. Câu vẫn duy trì chuỗi chỉ thị của nguyên văn nhưng dùng dấu chấm phẩy để tránh quá nặng nề.
