  to: Anh em phải lấy một phần hoa lợi đầu mùa[a] từ mọi sản vật của đất mà anh em đem về từ xứ mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em; đặt hoa lợi ấy vào giỏ, rồi đi đến nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn để cho danh Ngài ngự tại đó[b].
