  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: vi
  text: Anh em, người Lê-vi và người ngoại kiều[a] đang sống giữa anh em, hãy vui mừng về mọi điều tốt lành mà Yahweh, Đức Chúa Trời của anh em, đã ban cho anh em và gia đình anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kiều dân.” Từ Hê-bơ-rơ גֵּר chỉ một người không phải dân bản địa đang cư trú giữa dân Y-sơ-ra-ên và sống dưới sự bảo hộ của cộng đồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Anh em hãy vui mừng
  rationale: Trong ngữ cảnh chỉ dẫn, dạng động từ này mang ý nghĩa mệnh lệnh. “Hãy vui mừng” diễn đạt cả niềm vui lẫn sắc thái lễ hội giao ước; “anh em” là cách xưng hô tập thể tự nhiên trong tiếng Việt hiện đại dù tiếng Hê-bơ-rơ dùng ngôi thứ hai số ít.
- source_word: בְּכָל הַטּוֹב
  choice: về mọi điều tốt lành
  rationale: Giữ ý nghĩa toàn thể những phúc lành đã nhận; giới từ “về” diễn đạt tự nhiên đối tượng hay nguyên do của sự vui mừng mà không thu hẹp nghĩa.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: mà ... đã ban cho anh em
  rationale: “Đã ban” thể hiện hành động hoàn tất nhưng thành quả vẫn hiện hữu; “ban” phù hợp với chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tự nhiên công thức giao ước và giữ đại từ sở hữu.
- source_word: וּלְבֵיתֶךָ
  choice: và gia đình anh em
  rationale: בַּיִת ở đây chỉ đơn vị gia đình hay gia quyến, không chỉ một căn nhà vật chất.
- source_word: אַתָּה
  choice: anh em
  rationale: Giữ đại từ được nêu rõ để nhấn mạnh và mở đầu danh sách những người cùng vui hưởng phúc lành.
- source_word: הַלֵּוִי
  choice: người Lê-vi
  rationale: Cách gọi chuẩn, dễ hiểu, dành cho người thuộc chi phái Lê-vi.
- source_word: הַגֵּר
  choice: ngoại kiều
  rationale: Chỉ người không phải dân bản địa nhưng cư trú trong cộng đồng và được cộng đồng bảo hộ; “ngoại kiều” ngắn gọn và truyền đạt địa vị cư trú tốt hơn “người lạ”.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: đang sống giữa anh em
  rationale: Làm rõ sắc thái cư trú của גֵּר trong cộng đồng, đồng thời giữ ý “ở giữa” của cụm từ Hê-bơ-rơ.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; giữ “Yahweh” phân biệt danh riêng với các tước hiệu.
- issue: Phạm vi cộng đồng được dự phần vui mừng
  choice: Giữ người Lê-vi và ngoại kiều trong cùng danh sách với người dâng lễ
  alternative: Diễn giải họ như những người chỉ nhận phần phân phát
  rationale: Cú pháp nguyên văn đặt cả ba đối tượng cạnh nhau và không nói rõ hơn về cách họ tham dự; bản dịch không thêm một vai trò mà câu này không xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” để thể hiện ngôi thứ hai mang tính cộng đồng trong diễn từ, tránh “ngươi” vốn cổ và dễ tạo cảm giác gay gắt. Dấu gạch ngang giữ chức năng nêu rõ những người cùng vui mừng.
