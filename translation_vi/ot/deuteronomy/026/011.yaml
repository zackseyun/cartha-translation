revisions:
- from: Anh em hãy vui mừng về mọi điều tốt lành mà Yahweh, Đức Chúa Trời của anh em, đã ban cho anh em và gia đình anh em—anh em, người Lê-vi và ngoại kiều[a] đang sống giữa anh em.
  to: Anh em, người Lê-vi và người ngoại kiều[a] đang sống giữa anh em, hãy vui mừng về mọi điều tốt lành mà Yahweh, Đức Chúa Trời của anh em, đã ban cho anh em và gia đình anh em.
  rationale: Bản sửa chỉ điều chỉnh trật tự và cách diễn đạt để danh sách “anh em, người Lê-vi và người ngoại kiều” được nhận rõ là các chủ thể của lời mệnh lệnh “hãy vui mừng”. Nội dung, phạm vi phúc lành được ban cho, và tính bao gồm của câu nguyên ngữ vẫn được giữ nguyên.
