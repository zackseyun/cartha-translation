id: DEU.26.3
reference: Deuteronomy 26:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בָאתָ֙ אֶל הַ/כֹּהֵ֔ן אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/אָמַרְתָּ֣ אֵלָ֗י/ו הִגַּ֤דְתִּי הַ/יּוֹם֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ כִּי בָ֨אתִי֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵ֖י/נוּ לָ֥/תֶת לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: vi
  text: 'Hãy đến gặp thầy tế lễ đương nhiệm trong thời ấy[a] và nói với thầy tế lễ ấy: “Hôm nay, tôi tuyên bố[b] với Yahweh, Đức Chúa Trời của ông, rằng tôi đã vào miền đất mà Yahweh đã thề với tổ phụ chúng ta[c] sẽ ban cho chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “thầy tế lễ sẽ ở trong những ngày ấy”, tức thầy tế lễ đương nhiệm hoặc đang thi hành chức vụ khi đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Hôm nay, tôi đã tuyên bố.” Dạng động từ Hê-bơ-rơ có lẽ mang chức năng ngôn hành: người nói thực hiện lời tuyên bố bằng chính lời này.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “tổ tiên chúng ta.” Từ Hê-bơ-rơ mang hình thức giống đực và trong văn mạch này có thể chỉ cụ thể các tổ phụ của giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Anh hãy đến gặp
  rationale: Động từ בוא có thể chỉ việc đến, đi hoặc bước vào tùy điểm nhìn. Trong tiếng Việt, “đến gặp” diễn đạt tự nhiên chuyển động hướng tới thầy tế lễ và giữ được lực chỉ thị của chuỗi luật lệ.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: đang phục vụ vào thời ấy
  rationale: Nghĩa sát là “người sẽ có mặt trong những ngày ấy”; trong ngữ cảnh, cụm này chỉ thầy tế lễ đương nhiệm, đang thi hành chức vụ khi đó.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: Hôm nay, tôi tuyên bố
  rationale: 'Dạng hoàn thành Hiphil ở đây có thể mang chức năng ngôn hành: người nói thực hiện lời tuyên bố ngay khi thốt ra. Cách dịch hiện tại giữ được sắc thái ấy.'
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: với Yahweh, Đức Chúa Trời của ông
  rationale: 'Giữ danh giao ước Yahweh và đại từ sở hữu ngôi hai số ít: người dâng lễ nói với thầy tế lễ về “Đức Chúa Trời của ông”, không đổi thành “của chúng ta”.'
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: rằng tôi đã vào miền đất
  rationale: כִּי sau động từ tuyên bố giới thiệu nội dung lời tuyên bố; “đã vào” diễn đạt việc đặt chân vào đất hứa với kết quả còn hiệu lực ở hiện tại.
- source_word: לַאֲבֹתֵינוּ
  choice: với tổ phụ chúng ta
  rationale: “Tổ phụ” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt, vừa giữ sắc thái giống đực và khả năng quy chiếu đến các tổ phụ của giao ước.
- source_word: לָתֶת לָנוּ
  choice: sẽ ban cho chúng ta
  rationale: “Ban” diễn đạt tự nhiên hành động Đức Chúa Trời trao miền đất như một ân tặng; “sẽ” phù hợp với nội dung lời thề được thuật lại.
theological_decisions:
- issue: Cách phiên chuyển danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên chuyển “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng một tước hiệu.
- issue: Đối tượng của לַאֲבֹתֵינוּ
  choice: tổ phụ chúng ta
  alternative: tổ tiên chúng ta
  rationale: Trong văn mạch giao ước của Phục Truyền Luật Lệ Ký, từ giống đực số nhiều có thể đặc biệt hướng đến các tổ phụ; bản dịch không trung tính hóa nét nghĩa này, nhưng chú thích ghi nhận nghĩa rộng hơn.
- issue: Quan hệ trong cụm “Đức Chúa Trời của ông”
  choice: giữ ngôi hai số ít chỉ thầy tế lễ
  alternative: Đức Chúa Trời của chúng ta
  rationale: Bản Hê-bơ-rơ nói אֱלֹהֶיךָ, “Đức Chúa Trời của ông/ngươi”. Giữ nguyên cách nói này tránh hài hòa hóa thần học không có trong văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh” phản ánh lời chỉ dẫn ở ngôi hai số ít giống đực mà không dùng đại từ cổ “ngươi”; “vị ấy” giữ thái độ kính trọng đối với thầy tế lễ. Dấu câu đặt các chú thích ngay sau cụm từ liên quan.
