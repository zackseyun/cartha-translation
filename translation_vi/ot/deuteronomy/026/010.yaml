revisions:
- from: “Và bây giờ, này, con đã mang đến hoa lợi đầu mùa của đất[a] mà Ngài, lạy Yahweh, đã ban cho con.” Rồi anh em phải đặt lễ vật ấy trước mặt Yahweh, Đức Chúa Trời của anh em, và phủ phục[b] trước mặt Yahweh, Đức Chúa Trời của anh em.
  to: “Và bây giờ, này, con đã mang đến phần hoa lợi đầu tiên của đất[a] mà Ngài, lạy Yahweh, đã ban cho con.” Sau đó, hãy đặt nó trước mặt Yahweh, Đức Chúa Trời của anh, và phủ phục[b] trước mặt Yahweh, Đức Chúa Trời của anh.
  rationale: Sửa cách diễn đạt về lễ đầu mùa để nêu rõ «phần hoa lợi đầu tiên», và thay đại từ số nhiều bằng mệnh lệnh số trung tính nhằm phản ánh chỉ dẫn số ít của bản gốc. Giữ nguyên danh Yahweh, danh xưng Đức Chúa Trời, và sắc thái hành động của «phủ phục».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:11:10Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hành động mang phần đầu mùa, đặt trước Yahweh và phủ phục. Tuy nhiên, «hoa lợi đầu mùa» có thể được hiểu là hoa lợi của mùa sớm, trong khi רֵאשִׁית nhấn mạnh phần đầu tiên/đầu mùa được dâng. Đại từ «anh em» là số nhiều, nhưng cả hai động từ chỉ dẫn trong tiếng Hê-bơ-rơ đều ở ngôi thứ hai số ít.
  naturalness: Câu dịch nhìn chung trang trọng và dễ hiểu. «Hãy đặt» là cách chỉ dẫn hiện đại, tự nhiên hơn, đồng thời tránh sự chuyển đột ngột từ «con» sang «anh em».
  terminology: Giữ nhất quán Yahweh cho יהוה và «Đức Chúa Trời» cho אֱלֹהֶיךָ. «Phủ phục» biểu đạt tốt hành động thể lý của הִשְׁתַּחֲוִיתָ; không nên thay bằng «thờ phượng» trong thân câu.
  issues:
  - severity: medium
    issue: «Hoa lợi đầu mùa» chưa làm rõ nghĩa «phần/hoa lợi đầu tiên».
    rationale: רֵאשִׁית פְּרִי הָאֲדָמָה nói đến phần sản vật đầu tiên được đem dâng, không chỉ thời điểm thu hoạch sớm. «Phần hoa lợi đầu tiên của đất» bảo toàn rõ hơn quan hệ này.
  - severity: medium
    issue: «Anh em phải» chuyển ngôi thứ hai số ít của tiếng Hê-bơ-rơ thành số nhiều.
    rationale: וְהִנַּחְתּוֹ và וְהִשְׁתַּחֲוִיתָ đều là ngôi thứ hai giống đực số ít. Dùng mệnh lệnh không nêu đại từ («hãy») giữ được tính trực tiếp mà không thêm số nhiều.
  revised_text: “Và bây giờ, này, con đã mang đến phần hoa lợi đầu tiên của đất[a] mà Ngài, lạy Yahweh, đã ban cho con.” Sau đó, hãy đặt nó trước mặt Yahweh, Đức Chúa Trời của anh, và phủ phục[b] trước mặt Yahweh, Đức Chúa Trời của anh.
