  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: vi
  text: “Và bây giờ, này, con đã mang đến phần hoa lợi đầu tiên của đất[a] mà Ngài, lạy Yahweh, đã ban cho con.” Sau đó, hãy đặt nó trước mặt Yahweh, Đức Chúa Trời của anh, và phủ phục[b] trước mặt Yahweh, Đức Chúa Trời của anh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hoa lợi đầu mùa” hoặc “thổ sản đầu mùa.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ chỉ hành động cúi mình hoặc sấp mình xuống; “thờ phượng” là cách diễn đạt rộng hơn theo ý nghĩa của hành động này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Và bây giờ
  rationale: Giữ liên kết với lời tuyên xưng đi trước và đánh dấu việc chuyển sang hành động dâng lễ hiện tại.
- source_word: הִנֵּה
  choice: này
  rationale: Diễn đạt tự nhiên tiểu từ chỉ thị dùng để hướng sự chú ý vào lễ vật đang được trình dâng.
- source_word: הֵבֵאתִי
  choice: con đã mang đến
  rationale: Thể hiện hành động đã hoàn tất trong lời tuyên bố nghi lễ; “con” phù hợp khi người dâng trực tiếp thưa với Đức Chúa Trời.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: hoa lợi đầu mùa của đất
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ ý về phần sản vật đầu tiên do đất sinh ra.
- source_word: הָאֲדָמָה
  choice: đất
  rationale: Ngữ cảnh nhấn mạnh đất canh tác sinh hoa lợi, không chủ yếu nói đến lãnh thổ.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: mà Ngài ... đã ban cho con
  rationale: Giữ mệnh đề quan hệ và lời nhìn nhận trực tiếp rằng hoa lợi là ân ban của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וְהִנַּחְתּוֹ
  choice: Rồi anh em phải đặt lễ vật ấy
  rationale: Trong trình tự nghi lễ, động từ mang lực chỉ dẫn. “Lễ vật ấy” làm rõ vật được đặt xuống mà không thay đổi đối tượng quy chiếu.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Giữ ý đặt và phủ phục trong sự hiện diện của Đức Chúa Trời.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt danh xưng giao ước ở ngôi thứ hai; “anh em” phù hợp với lời chỉ dạy dành cho từng thành viên trong cộng đồng Israel.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: và phủ phục
  rationale: Giữ hành động cụ thể là cúi mình sát xuống, thay vì chỉ dùng khái niệm rộng hơn là “thờ phượng”.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước; giữ “Yahweh” giúp phân biệt danh riêng với các tước hiệu.
- issue: Ý nghĩa của וְהִשְׁתַּחֲוִיתָ
  choice: phủ phục
  alternative: thờ phượng
  rationale: “Phủ phục” bảo toàn hành động thân thể được động từ Hê-bơ-rơ biểu thị; trong ngữ cảnh đây là hành vi tôn thờ, nhưng không nên để cách dịch rộng hơn xóa mất hình ảnh cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Con/Ngài” được dùng trong lời người dâng trực tiếp thưa với Yahweh; sau dấu ngoặc kép, “anh em” đánh dấu lời chỉ dẫn của Môi-se cho người Israel. Giữ sự chuyển đổi ngôi xưng vốn có trong câu Hê-bơ-rơ.
