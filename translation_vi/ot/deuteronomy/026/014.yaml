    issue: Cụm “cũng không trao phần nào trong số đó cho người chết”
    rationale: Động từ נתן có nghĩa cơ bản là “ban/cho”, nhưng cách nói “trao ... cho người chết” không tự nhiên trong tiếng Việt và có thể khiến độc giả hiểu quá cụ thể là chuyển giao trực tiếp cho người đã chết. Cụm “dùng ... cho người chết” diễn đạt tự nhiên hơn, vẫn để ngỏ việc ấy liên quan đến nghi thức, một người đã chết, hay một cách dùng khác.
