  text: לֹא אָכַ֨לְתִּי בְ/אֹנִ֜י מִמֶּ֗/נּוּ וְ/לֹא בִעַ֤רְתִּי מִמֶּ֨/נּוּ֙ בְּ/טָמֵ֔א וְ/לֹא נָתַ֥תִּי מִמֶּ֖/נּוּ לְ/מֵ֑ת שָׁמַ֗עְתִּי בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י עָשִׂ֕יתִי כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: vi
  text: Con đã không ăn phần nào trong số đó khi đang để tang[a], không loại bỏ phần nào trong số đó khi đang ô uế[b], cũng không dùng phần nào trong số đó cho người chết[c]. Con đã vâng lời Yahweh, Đức Chúa Trời của con; con đã làm theo mọi điều Ngài truyền cho con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong nỗi đau buồn của con” hoặc “trong cảnh khốn khổ”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “không đốt phần nào trong số đó” hoặc “không dọn bỏ phần nào trong số đó”. Động từ Hê-bơ-rơ có thể chỉ việc đốt hoặc loại bỏ.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể hiểu là “cho một người đã chết” hoặc “trong việc liên quan đến người chết”; việc bị cấm cụ thể là gì không được nói rõ.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: khi đang để tang
  rationale: Danh từ אֹנִי có thể chỉ sự đau buồn, tang chế hoặc cảnh khốn khổ. Trong bối cảnh nghi lễ và sự ô uế ở mệnh đề kế tiếp, “khi đang để tang” diễn đạt tự nhiên trạng thái tang chế mà không biến nó thành một nghi thức cụ thể.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: không loại bỏ phần nào trong số đó
  rationale: Động từ בער ở thể Piel có phạm vi nghĩa gồm đốt, tiêu hủy, dọn sạch hoặc loại bỏ. “Loại bỏ” giữ được nghĩa rộng trong câu chính; khả năng “đốt” được bảo lưu ở chú thích.
- source_word: בְּטָמֵא
  choice: khi đang ô uế
  rationale: Cụm từ chỉ tình trạng ô uế, nhiều khả năng mang sắc thái nghi lễ. Cách dịch này rõ ràng và không bổ sung nguyên nhân hay loại ô uế mà bản Hê-bơ-rơ không nêu.
- source_word: לְמֵת
  choice: cho người chết
  rationale: Giữ cách nói ngắn gọn và rộng của nguyên văn, không xác định đó là lễ vật tang ma, việc liên quan đến thi thể hay một tập tục cụ thể khác.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: Con đã vâng lời
  rationale: Thành ngữ שמע בקול diễn tả việc nghe với sự tuân phục, nên “vâng lời” truyền đạt đúng chức năng giao ước và tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, nhờ đó phân biệt danh יהוה với các danh xưng thần học khác.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: con đã làm theo mọi điều Ngài truyền cho con
  rationale: Diễn đạt sự tuân hành toàn bộ mệnh lệnh, đồng thời giữ trực tiếp ngôi thứ hai của צִוִּיתָנִי trong lối xưng hô tiếng Việt tự nhiên.
theological_decisions:
- issue: Bản chất của việc bị cấm liên quan đến người chết
  choice: Giữ cách nói rộng “cho người chết”
  alternative: Dịch cụ thể là “cho nghi thức tang lễ”, “cho một thi thể” hoặc “liên quan đến người chết”
  rationale: Nguyên văn לְמֵת không xác định chính xác tập tục hay hành vi nghi lễ nào. Cách dịch rộng bảo toàn sự mơ hồ thật sự của bản Hê-bơ-rơ và tránh đưa một cách giải thích riêng vào câu chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con/Ngài” vì đây là lời tuyên xưng trực tiếp trước Đức Chúa Trời; cách xưng hô này tự nhiên trong tiếng Việt mà không thêm nội dung thần học. Các mệnh đề song song và nhịp tuyên xưng của nguyên văn được duy trì; mọi chú thích đều có dấu tương ứng trong câu chính.
