base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: vi
  text: Người Ai Cập đã ngược đãi chúng tôi[a], áp bức chúng tôi[b], và áp đặt việc lao dịch nặng nhọc lên chúng tôi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đối xử tàn tệ với chúng tôi” hoặc “làm hại chúng tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hành hạ chúng tôi” hoặc “làm khổ chúng tôi.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bắt chúng tôi lao dịch nặng nhọc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: đã ngược đãi chúng tôi
  rationale: Động từ רעע ở thể Hiphil diễn tả việc gây hại hoặc đối xử tồi tệ với ai. “Ngược đãi” tự nhiên trong tiếng Việt hiện đại, nêu rõ cách đối xử có hại nhưng không quy định cụ thể hình thức bạo lực.
- source_word: הַמִּצְרִים
  choice: Người Ai Cập
  rationale: Danh xưng xác định chỉ dân Ai Cập, là nhóm thực hiện các hành vi áp bức trong lời thuật lại lịch sử này.
- source_word: וַיְעַנּוּנוּ
  choice: áp bức chúng tôi
  rationale: Động từ ענה ở thể Piel có thể mang nghĩa làm khổ, áp bức hoặc hạ nhục. “Áp bức” phù hợp với bối cảnh và vẫn phân biệt được với động từ chỉ sự ngược đãi ở mệnh đề trước.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: áp đặt ... lên chúng tôi
  rationale: Thành ngữ נתן על diễn tả việc đặt hoặc áp một gánh nặng lên ai. Cách dịch này giữ được hình ảnh gánh nặng của nguyên văn mà vẫn rõ nghĩa trong tiếng Việt.
- source_word: עֲבֹדָה קָשָׁה
  choice: việc lao dịch nặng nhọc
  rationale: עֲבֹדָה chỉ công việc, sự phục dịch hay lao dịch; קָשָׁה chỉ tính chất nặng nhọc, khắc nghiệt. “Lao dịch nặng nhọc” phù hợp với bối cảnh người Israel bị cưỡng ép phục dịch tại Ai Cập.
theological_decisions:
- issue: Phân biệt chuỗi ba cách diễn tả sự áp bức
  choice: 'Giữ ba diễn đạt riêng biệt: “ngược đãi,” “áp bức,” và “áp đặt việc lao dịch nặng nhọc.”'
  alternative: Gộp hai động từ đầu thành một ý chung về sự áp bức, hoặc dùng thuật ngữ mạnh về chế độ nô lệ trong cả ba mệnh đề.
  rationale: Nguyên văn Hê-bơ-rơ dùng ba cách diễn đạt có liên hệ nhưng không đồng nhất. Giữ nguyên tiến trình này bảo toàn sức tu từ và không thêm những chi tiết vượt quá lời của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc ba vế giữ nhịp kể chuyện của nguyên văn; “lao dịch” truyền đạt công việc phục dịch nặng nề trong bối cảnh Ai Cập mà không thêm thuật ngữ giáo phái.
