id: DEU.26.1
reference: Deuteronomy 26:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: vi
  text: Khi ngươi vào đất mà Yahweh, Đức Chúa Trời của ngươi, ban cho ngươi làm cơ nghiệp, chiếm hữu đất ấy và cư ngụ tại đó,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Khi
  rationale: Công thức Hê-bơ-rơ mở đầu một hoàn cảnh trong tương lai; “Khi” diễn đạt tự nhiên giá trị thời gian mà không cần dịch sát, nặng nề là “Và sẽ xảy ra khi”.
- source_word: תָבֹוא אֶל הָאָרֶץ
  choice: anh em vào miền đất
  rationale: בוא với אֶל chỉ việc đi vào. “Miền đất” tự nhiên trong tiếng Việt và ở đây nói đến vùng đất được ban cho Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Nguyên văn dùng ngôi thứ hai giống đực số ít để nói với Israel như một cộng đồng. Tiếng Việt dùng “anh em” để lời truyền đạt tự nhiên mà vẫn giữ cách xưng hô trực tiếp với dân chúng.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: ban cho anh em làm cơ nghiệp
  rationale: Phân từ נֹתֵן trình bày hành động ban cho như điều đang diễn tiến hoặc chắc chắn sắp xảy ra; נַחֲלָה là phần sản nghiệp được phân ban. “Cơ nghiệp” giữ sắc thái đất được ban làm phần thuộc về dân.
- source_word: וִירִשְׁתָּהּ
  choice: rồi chiếm hữu
  rationale: Trong ngữ cảnh đất đai, ירשׁ chỉ việc tiếp quản và nắm quyền sở hữu. “Chiếm hữu” giữ sắc thái chủ động và tránh lặp ý với “cơ nghiệp”.
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: và cư ngụ tại đó
  rationale: ישׁב ở đây nói đến việc định cư, sinh sống lâu dài; “cư ngụ” là cách diễn đạt trang trọng vừa phải và tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc Chúa
  rationale: Nguyên văn trực tiếp dùng danh giao ước YHWH; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay thế bằng tước hiệu.
- issue: Mối quan hệ giữa sự ban đất của Đức Chúa Trời và hành động của Israel
  choice: Giữ trình tự Đức Chúa Trời ban đất, rồi Israel chiếm hữu và cư ngụ
  alternative: Gộp các hành động thành việc Israel nhận đất
  rationale: Nguyên văn phân biệt rõ sự ban cho của Đức Chúa Trời với việc dân tiếp quản và sinh sống trong đất; giữ cả hai vế bảo tồn sức căng và trình tự của câu.
- issue: Số ít tập thể trong lời xưng hô
  choice: anh em
  alternative: ngươi
  rationale: Các hậu tố và động từ Hê-bơ-rơ ở số ít, nói với Israel như một tập thể. “Anh em” chuyển tải lời nói với cộng đồng bằng tiếng Việt hiện đại, không biến lời xưng hô thành chỉ một cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được để mở bằng dấu phẩy vì đây là mệnh đề thời gian dẫn vào chỉ thị tiếp theo trong Phục Truyền Luật Lệ Ký 26:2. Không dùng chú thích vì các phương án từ vựng không tạo ra khác biệt đủ lớn cần ghi ngay tại câu này.
