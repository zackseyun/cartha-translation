  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: vi
  text: 'Mắt ngươi chớ thương xót: mạng đền mạng[a], mắt đền mắt, răng đền răng, tay đền tay, chân đền chân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mạng” ở đây là mạng sống, không nhất thiết có nghĩa “linh hồn” theo nghĩa thần học về sau.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: chớ thương xót
  rationale: Động từ חוס có thể chỉ việc thương xót hoặc dung tha. Trong mệnh lệnh pháp lý phủ định này, “chớ thương xót” tự nhiên, trang trọng và giữ được mức độ nghiêm khắc của nguyên văn.
- source_word: עֵינֶךָ
  choice: mắt anh em
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ, trong đó “mắt” là chủ thể của hành động thương xót, thay vì giản lược thành “anh em”.
- source_word: נֶפֶשׁ
  choice: mạng
  rationale: Trong công thức נֶפֶשׁ בְּנֶפֶשׁ, từ này chỉ mạng sống chứ không nhất thiết mang nghĩa thần học về “linh hồn”. “Mạng” phù hợp với công thức pháp lý tiếng Việt “mạng đền mạng”.
- source_word: בְּ
  choice: đền
  rationale: Trong từng cặp, giới từ בְּ biểu thị sự tương xứng hoặc báo trả. “Đền” diễn đạt ngắn gọn quan hệ pháp lý ấy và tạo thành công thức tự nhiên trong tiếng Việt.
- source_word: עַיִן
  choice: mắt
  rationale: Danh từ chỉ bộ phận cơ thể được dùng theo nghĩa trực tiếp trong công thức báo trả tương xứng.
- source_word: שֵׁן
  choice: răng
  rationale: Cách dịch trực tiếp, chính xác của danh từ chỉ bộ phận cơ thể trong công thức pháp lý.
- source_word: יָד
  choice: tay
  rationale: Giữ nghĩa trực tiếp của từ Hê-bơ-rơ và cấu trúc song hành của câu.
- source_word: רֶגֶל
  choice: chân
  rationale: “Chân” là cách dịch tự nhiên và phù hợp với chuỗi các thương tổn thân thể trong câu.
theological_decisions:
- issue: Giữ nguyên công thức báo trả cụ thể hay chuyển thành nguyên tắc khái quát về hình phạt tương xứng
  choice: 'Giữ công thức cụ thể: “mạng đền mạng, mắt đền mắt, răng đền răng, tay đền tay, chân đền chân.”'
  alternative: Diễn ý thành “hình phạt phải tương xứng với tội phạm”.
  rationale: Nguyên văn trình bày một công thức pháp lý cố định và cụ thể. Giữ nguyên hình thức này bảo tồn sức nặng tu từ, tính căng thẳng thần học và mối liên hệ với các đoạn luật Torah khác, thay vì giải thích hoặc làm nhẹ câu ngay trong bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít giống đực hướng đến một thành viên trong cộng đồng giao ước; giữ thành ngữ cụ thể “mắt anh em chớ thương xót”. Công thức “X đền X” vừa súc tích vừa quen thuộc trong tiếng Việt pháp lý–Kinh Thánh.
