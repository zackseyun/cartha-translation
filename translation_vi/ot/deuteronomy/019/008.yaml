  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם יַרְחִ֞יב יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת גְּבֻ֣לְ/ךָ֔ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶ֑י/ךָ וְ/נָ֤תַן לְ/ךָ֙ אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָ/תֵ֥ת לַ/אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: vi
  text: Và nếu Yahweh, Đức Chúa Trời của anh em, mở rộng lãnh thổ của anh em, như Ngài đã thề với tổ phụ anh em[a], và ban cho anh em toàn bộ miền đất mà Ngài đã hứa ban cho tổ phụ anh em,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “tổ tiên” ở cả hai chỗ có cụm từ “tổ phụ anh em”. Tiếng Hê-bơ-rơ theo nghĩa đen là “các cha của anh em”, chỉ các tổ phụ của Israel.
    reason: Bảo tồn một cách dịch từ vựng khả dĩ và giải thích sắc thái của אבות.
lexical_decisions:
- source_word: וְאִם
  choice: Và nếu
  rationale: Giữ cả liên từ nối tiếp mạch luật lệ ở câu trước lẫn ý điều kiện của אִם.
- source_word: יַרְחִיב ... אֶת גְּבֻלְךָ
  choice: mở rộng lãnh thổ của anh em
  rationale: Động từ Hiphil của רחב diễn tả việc làm cho rộng ra; גְּבוּל trong ngữ cảnh này chỉ phần lãnh thổ chứ không chỉ riêng đường biên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, bảo tồn cách văn bản Hê-bơ-rơ trực tiếp dùng danh YHWH.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt quan hệ sở hữu tự nhiên trong tiếng Việt; đại từ số nhiều mang nghĩa cộng đồng cho Israel dù hậu tố Hê-bơ-rơ ở số ít.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: như Ngài đã thề
  rationale: Giữ rõ sự tương ứng với lời thề giao ước đã được lập với các tổ phụ.
- source_word: לַאֲבֹתֶיךָ
  choice: với/cho tổ phụ anh em
  rationale: “Tổ phụ” giữ sắc thái nam giới và liên hệ đến các tổ phụ của Israel; giới từ được diễn đạt theo kết hợp tự nhiên của từng động từ tiếng Việt.
- source_word: וְנָתַן לְךָ
  choice: và ban cho anh em
  rationale: Thể hoàn thành có waw tiếp tục vế điều kiện hướng đến tương lai; tiếng Việt có thể dùng động từ không đánh dấu thì một cách tự nhiên sau “nếu”.
- source_word: כָּל הָאָרֶץ
  choice: toàn bộ miền đất
  rationale: אָרֶץ ở đây là miền đất được hứa ban, không phải toàn thể trái đất.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: mà Ngài đã hứa ban
  rationale: Dù דִּבֶּר theo nghĩa đen là “đã phán”, trong ngữ cảnh giao ước cụm này mang lực của một lời hứa; cách dịch này tự nhiên mà không làm thay đổi nội dung cam kết.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” phân biệt danh riêng này với các tước hiệu thần linh.
- issue: Cách dịch אבות
  choice: tổ phụ
  alternative: tổ tiên
  rationale: “Tổ phụ” bảo tồn hình thức nam giới của nguyên văn và sắc thái chỉ các vị cha ông trong lịch sử giao ước của Israel; “tổ tiên” là cách diễn đạt rộng hơn và được ghi ở chú thích.
- issue: Số ít tập thể của hậu tố ngôi thứ hai
  choice: anh em
  alternative: anh
  rationale: Nguyên văn nói với Israel như một cộng đồng bằng ngôi thứ hai số ít. “Anh em” tự nhiên hơn trong tiếng Việt khi Môi-se ngỏ lời với toàn dân, đồng thời vẫn giữ ý người nghe là cộng đồng Israel.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc điều kiện đang tiếp diễn sang câu kế tiếp, vì nguyên văn câu 8 chưa kết thúc mệnh đề pháp lý. “Ngài” làm rõ chủ thể thần linh; “anh em” được dùng theo nghĩa cộng đồng để nói với Israel.
