revisions:
- from: kẻo người báo thù huyết đuổi theo người ngộ sát, vì lòng đang nóng giận, rồi bắt kịp người ấy do đường quá xa và đánh chết người, mặc dù người không đáng bị kết án tử hình, vì trước đó người không hề thù ghét nạn nhân.
  to: kẻo người báo thù huyết đuổi theo người ngộ sát, vì lòng người báo thù đang nóng giận, rồi bắt kịp người ấy vì đường đi quá dài và đánh chết người ngộ sát ấy, mặc dù người ấy không phải chịu án tử hình, vì trước đó không hề thù ghét người kia.
  rationale: Bản sửa giữ nguyên ý nghĩa và trình tự lý do–hệ quả của tiếng Hê-bơ-rơ, đồng thời làm rõ các đại từ và thay cách nói về quãng đường cho đúng nghĩa hơn. “Người kia” trong mệnh đề cuối chỉ người đã bị giết, tương ứng với đối tượng của “không thù ghét” trong nguyên ngữ.
