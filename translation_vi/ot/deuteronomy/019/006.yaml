id: DEU.19.6
reference: Deuteronomy 19:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: פֶּן יִרְדֹּף֩ גֹּאֵ֨ל הַ/דָּ֜ם אַחֲרֵ֣י הָ/רֹצֵ֗חַ כִּי יֵחַם֮ לְבָב/וֹ֒ וְ/הִשִּׂיג֛/וֹ כִּֽי יִרְבֶּ֥ה הַ/דֶּ֖רֶךְ וְ/הִכָּ֣ה/וּ נָ֑פֶשׁ וְ/ל/וֹ֙ אֵ֣ין מִשְׁפַּט מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: vi
  text: kẻo người báo thù huyết đuổi theo người ngộ sát, vì lòng người báo thù đang nóng giận, rồi bắt kịp người ấy vì đường đi quá dài và đánh chết người ngộ sát ấy, mặc dù người ấy không phải chịu án tử hình, vì trước đó không hề thù ghét người kia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: kẻo
  rationale: Diễn đạt trực tiếp mục đích phòng ngừa của mệnh đề trong ngữ cảnh thiết lập các thành trú ẩn.
- source_word: גֹּאֵל הַדָּם
  choice: người báo thù huyết
  rationale: Giữ thành ngữ pháp lý–thân tộc của Torah, chỉ người bà con có vai trò báo thù cho người bị giết.
- source_word: הָרֹצֵחַ
  choice: người ngộ sát
  rationale: Ngữ cảnh xác định đây là người gây chết người ngoài ý muốn, không có thù ghét từ trước; vì vậy không dịch là 'kẻ sát nhân'.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: vì lòng đang nóng giận
  rationale: Giữ hình ảnh 'lòng nóng lên' của tiếng Hê-bơ-rơ đồng thời làm rõ trạng thái giận dữ trong tiếng Việt tự nhiên.
- source_word: וְהִשִּׂיגוֹ
  choice: rồi bắt kịp người ấy
  rationale: Diễn đạt tự nhiên kết quả của cuộc truy đuổi.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: do đường quá xa
  rationale: Chuyển thành cách nói tiếng Việt tự nhiên về quãng đường dài mà vẫn giữ hình ảnh cụ thể của con đường.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: và đánh chết người
  rationale: Thể hiện thành ngữ chỉ một cú đánh lấy mạng, giữ tính cụ thể và bạo liệt của hành động.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: mặc dù người không đáng bị kết án tử hình
  rationale: Truyền đạt sắc thái pháp lý rằng người ngộ sát không thuộc trường hợp phải chịu phán quyết tử hình.
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: vì ... người không hề thù ghét nạn nhân
  rationale: 'Nêu căn cứ pháp lý: không có sự thù ghét từ trước, phân biệt ngộ sát với cố sát.'
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: trước đó
  rationale: Diễn đạt tự nhiên thành ngữ thời gian Hê-bơ-rơ theo nghĩa 'từ trước' hay 'trước đây'.
theological_decisions:
- issue: Tình trạng pháp lý của người gây chết người
  choice: người ngộ sát ... không đáng bị kết án tử hình
  alternative: kẻ giết người ... không có án tử hình
  rationale: Bản dịch giữ sự phân biệt pháp lý trong văn mạch giữa việc vô ý gây chết người và giết người do thù ghét, không biến nhân vật thành kẻ sát nhân có chủ ý.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng 'người báo thù huyết' để giữ thuật ngữ pháp lý cổ; dùng 'người ngộ sát' nhằm diễn đạt chính xác địa vị của người vô ý gây chết người. Không cần chú thích vì các thành ngữ được chuyển nghĩa rõ ngay trong câu.
