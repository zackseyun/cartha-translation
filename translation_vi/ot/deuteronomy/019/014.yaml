source:
  edition: WLC
  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: vi
  text: Ngươi không được dời mốc ranh của người lân cận[a], là mốc mà những người đời trước đã thiết lập, trong phần cơ nghiệp mà ngươi sẽ thừa hưởng tại xứ Yahweh, Đức Chúa Trời của ngươi, ban cho ngươi để chiếm hữu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ranh giới”. Từ Hê-bơ-rơ chỉ ranh đất được xác định bằng một mốc.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסִּיג
  choice: dời
  rationale: Dạng Hiphil của נסג trong luật về đất đai chỉ việc dịch chuyển mốc ranh nhằm lấn đất. “Dời” tự nhiên và không xác định quá mức hướng dịch chuyển.
- source_word: גְּבוּל
  choice: mốc ranh giới
  rationale: Trong ngữ cảnh này, từ này chỉ ranh giới bất động sản được xác định cụ thể bằng một mốc; cách dịch này làm rõ vật có thể bị dời.
- source_word: רֵעֲךָ
  choice: của người lân cận
  rationale: רֵעַ trong ngữ cảnh pháp lý chỉ một người cùng cộng đồng; “người lân cận” phù hợp với quan hệ sở hữu đất đai.
- source_word: גָּבְלוּ
  choice: đã đặt
  rationale: Động từ diễn tả việc thiết lập hoặc đánh dấu ranh giới; “đặt” kết hợp tự nhiên với “mốc ranh giới” và giữ sắc thái hành động đã hoàn tất.
- source_word: רִאשֹׁנִים
  choice: những người thuở trước
  rationale: Cụm từ chỉ những người thuộc thời trước đã xác lập các ranh giới ban đầu. Cách dịch này giữ nguyên sự khái quát, không tự ý đồng nhất họ với tổ tiên trực hệ.
- source_word: בְּנַחֲלָתְךָ
  choice: trong phần cơ nghiệp
  rationale: נַחֲלָה là phần đất được ban và truyền lại; “phần cơ nghiệp” giữ được cả ý nghĩa pháp lý lẫn giao ước.
- source_word: תִּנְחַל
  choice: ngươi sẽ thừa hưởng
  rationale: Thể chưa hoàn thành hướng đến việc Israel sắp nhận phần đất; “sẽ thừa hưởng” giữ mối liên hệ từ vựng với cơ nghiệp.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: נֹתֵן לְךָ
  choice: ban cho ngươi
  rationale: Phân từ mô tả hành động ban đất của Yahweh. Tiếng Việt tự nhiên không nhất thiết phải biểu đạt bằng cấu trúc tiếp diễn.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: Động từ ירשׁ ở đây diễn tả việc tiếp nhận và nắm quyền sở hữu xứ; “để chiếm hữu” ngắn gọn và bảo toàn thuật ngữ về đất giao ước.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. “Yahweh” bảo tồn danh giao ước thay vì thay bằng tước hiệu.
- issue: Quan hệ giữa cơ nghiệp, thừa hưởng và chiếm hữu
  choice: Giữ cả ba ý niệm bằng “phần cơ nghiệp”, “thừa hưởng” và “chiếm hữu”
  alternative: Rút gọn thành “đất ngươi nhận được”
  rationale: Nguyên văn cố ý dùng cả נחל và ירשׁ; giữ sự lặp và phân biệt này phản ánh chiều kích ban tặng, thừa hưởng và nắm quyền sở hữu mà không hòa nhập chúng.
translation_notes:
  register: Văn phong trang trọng, rõ nghĩa và dễ hiểu trong tiếng Việt hiện đại. Đại từ “ngươi” giữ sắc thái lời luật truyền trực tiếp cho từng người Israel. Câu được sắp xếp gần cấu trúc Hê-bơ-rơ nhưng thêm “là mốc” để quan hệ của mệnh đề phụ không mơ hồ trong tiếng Việt.
