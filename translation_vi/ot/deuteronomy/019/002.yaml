  text: שָׁל֥וֹשׁ עָרִ֖ים תַּבְדִּ֣יל לָ֑/ךְ בְּ/ת֣וֹךְ אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/002.yaml
  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: vi
  text: Anh em phải dành riêng cho mình ba thành trong xứ của anh em mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em để chiếm hữu xứ ấy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để thừa hưởng xứ ấy.” Động từ Hê-bơ-rơ có thể mang nghĩa “chiếm hữu” hoặc “thừa hưởng” trong ngữ cảnh đất được ban.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: ba thành
  rationale: עִיר có thể chỉ thành phố hoặc thị trấn; “thành” ngắn gọn, trang trọng và phù hợp với ngữ cảnh pháp lý về các thành trú ẩn.
- source_word: תַּבְדִּיל
  choice: phải dành riêng
  rationale: Thể Hiphil của בדל diễn tả việc tách ra hoặc biệt riêng. “Dành riêng” tự nhiên trong tiếng Việt hiện đại và vẫn thể hiện hành động chỉ định các thành cho một mục đích đặc biệt.
- source_word: לָךְ
  choice: cho mình
  rationale: Giữ sắc thái thụ hưởng/phản thân của giới từ לְ với hậu tố ngôi thứ hai.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: trong xứ
  rationale: בְּתוֹךְ mang nghĩa ở trong hoặc giữa phạm vi; “trong xứ” tự nhiên và không hàm ý sai rằng các thành phải nằm đúng khu vực trung tâm địa lý.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt quan hệ giao ước và hậu tố ngôi thứ hai số ít; “anh em” là lối xưng hô hiện đại với dân Israel như một cộng đồng.
- source_word: נֹתֵן לְךָ
  choice: đang ban cho anh em
  rationale: Phân từ נֹתֵן có thể diễn tả hành động đang diễn ra hoặc sắp được thực hiện; “đang ban” giữ sắc thái tiến hành trong lời hứa ban đất.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: ירשׁ trong bối cảnh ban đất có thể là chiếm hữu hoặc thừa hưởng. “Chiếm hữu” thể hiện rõ việc nhận và nắm quyền sở hữu xứ, còn phương án “thừa hưởng” được bảo lưu trong chú thích.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo tồn tư cách danh riêng thay vì chuyển thành tước hiệu.
- issue: Sắc thái của ירשׁ trong việc nhận đất
  choice: chiếm hữu
  alternative: thừa hưởng
  rationale: Cả hai nghĩa đều được chứng thực trong ngữ cảnh đất được Đức Chúa Trời ban. Bản chính dùng “chiếm hữu” vì rõ nghĩa hành động nhận lấy xứ, đồng thời chú thích giữ lại nghĩa “thừa hưởng” để không xóa bỏ sự đa nghĩa.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “anh em” để chuyển lời xưng hô ngôi thứ hai giống đực số ít hướng đến Israel như một cộng đồng, tránh đại từ “ngươi” mang sắc thái cổ hoặc miệt thị trong tiếng Việt hiện nay. Dùng “xứ” theo nghĩa lãnh thổ/đất nước, phù hợp văn cảnh Phục Truyền Luật Lệ Ký.
