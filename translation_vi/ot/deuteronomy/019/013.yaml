base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: vi
  text: Mắt ngươi chớ thương xót kẻ ấy[a]; ngươi phải trừ máu vô tội khỏi Y-sơ-ra-ên[b], và mọi sự sẽ tốt lành cho ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mắt ngươi chớ dung tha kẻ ấy.” Thành ngữ Hê-bơ-rơ dùng “mắt” để diễn tả lòng thương xót hoặc sự dung tha.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát chữ: “trừ máu vô tội khỏi Y-sơ-ra-ên.” Trong ngữ cảnh pháp lý, đây là việc loại bỏ huyết tội, tức trách nhiệm cộng đồng về việc làm đổ máu người vô tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָחוֹס עֵינְךָ עָלָיו
  choice: Mắt anh em không được thương xót kẻ ấy
  rationale: Giữ hình ảnh Hê-bơ-rơ về “mắt” như nơi biểu lộ lòng thương xót, đồng thời dùng cách diễn đạt trang trọng, dễ hiểu trong tiếng Việt. “Không được dung tha” cũng có thể phù hợp, nhưng “không được thương xót” bảo tồn sắc thái cảm xúc của חוס.
- source_word: וּבִעַרְתָּ
  choice: anh em phải tẩy sạch
  rationale: Trong luật pháp Phục Truyền, בער thường chỉ việc loại bỏ điều gây ô uế hoặc tội lỗi khỏi cộng đồng, chứ không nói đến việc thiêu đốt theo nghĩa đen. “Tẩy sạch” giữ được sức nặng pháp lý và giao ước.
- source_word: דַם הַנָּקִי
  choice: tội làm đổ máu vô tội
  rationale: Cụm từ theo nghĩa đen là “máu vô tội”, nhưng trong mệnh đề này nói đến trách nhiệm về việc làm đổ máu người vô tội. Bổ sung “tội làm đổ” giúp câu tiếng Việt tự nhiên và làm rõ ý niệm huyết tội mà không thay đổi đối tượng của mệnh lệnh.
- source_word: מִיִּשְׂרָאֵל
  choice: khỏi Y-sơ-ra-ên
  rationale: Giới từ מן diễn tả sự loại bỏ khỏi cộng đồng giao ước; “khỏi Y-sơ-ra-ên” ngắn gọn và tự nhiên.
- source_word: וְטוֹב לָךְ
  choice: thì anh em sẽ được phước
  rationale: Đây là công thức quen thuộc trong Phục Truyền, chỉ kết quả tốt lành của sự vâng phục. “Được phước” tự nhiên trong văn phong Kinh Thánh tiếng Việt, dù cách sát chữ hơn là “mọi việc sẽ tốt đẹp cho anh em”.
theological_decisions:
- issue: Bản chất của mệnh lệnh đối với kẻ sát nhân
  choice: Câu này truyền lệnh cho cộng đồng thi hành công lý theo thủ tục pháp lý và loại bỏ huyết tội, không phải trả thù riêng.
  alternative: Có thể bị hiểu lầm là cho phép cá nhân báo thù.
  rationale: Ngữ cảnh Phục Truyền 19:11–12 nói về việc các trưởng lão giao kẻ cố ý giết người để chịu hình phạt. Bản dịch không thêm diễn giải ấy vào chính văn nhưng giữ cách nói mang tính cộng đồng và pháp lý.
- issue: Ý nghĩa của “máu vô tội”
  choice: Hiểu là huyết tội phát sinh từ việc làm đổ máu người vô tội.
  alternative: Có thể dịch hoàn toàn theo hình thức là “máu vô tội”, để ngỏ quan hệ giữa máu đã đổ và trách nhiệm của cộng đồng.
  rationale: Động từ “tẩy sạch khỏi” trong ngữ cảnh pháp lý hướng đến việc loại bỏ trách nhiệm huyết tội khỏi Y-sơ-ra-ên. Chú thích vẫn ghi nghĩa sát chữ để bảo tồn thành ngữ Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số ít mang tính đại diện hướng đến cộng đồng Y-sơ-ra-ên; giữ hình ảnh “mắt” của nguyên văn và dùng các chú thích để giải thích thành ngữ cùng ý niệm huyết tội.
