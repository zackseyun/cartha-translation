revisions:
- from: Mắt anh em không được thương xót kẻ ấy[a]; anh em phải tẩy sạch khỏi Y-sơ-ra-ên tội làm đổ máu vô tội[b], thì anh em sẽ được phước.
  to: Mắt ngươi chớ thương xót kẻ ấy[a]; ngươi phải trừ máu vô tội khỏi Y-sơ-ra-ên[b], và mọi sự sẽ tốt lành cho ngươi.
  rationale: Bản sửa bảo tồn các hình ảnh và thuật ngữ chính của Hebrew—«mắt», «máu vô tội», và việc «trừ» khỏi Y-sơ-ra-ên—trong khi đặt phần giải thích về huyết tội ở chú thích. Cụm kết được dịch theo nghĩa trực tiếp, không áp đặt thuật ngữ «phước».
  reviewer_model: gpt-5.6-terra
