revisions:
- from: Nhưng nếu một người cùng người lân cận vào rừng đốn củi, và khi người ấy vung rìu chặt cây, lưỡi sắt tuột khỏi cán[a], trúng người lân cận khiến người đó chết, thì người ấy có thể chạy trốn đến một trong các thành này để được sống.
  to: Nhưng nếu một người cùng người bạn mình vào rừng đốn củi, và khi người ấy vung rìu chặt cây, đầu rìu bằng sắt tuột khỏi cán[a], trúng người bạn ấy khiến người đó chết, thì người ấy có thể chạy trốn đến một trong các thành này để được sống.
  rationale: Chỉnh nhẹ để cách diễn đạt tự nhiên hơn và để phần sắt của dụng cụ được nhận diện chính xác là đầu rìu. Cấu trúc điều kiện, tính chất vô ý của tai nạn, và hệ quả pháp lý của nguyên văn đều được giữ nguyên.
