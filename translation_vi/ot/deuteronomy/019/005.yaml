source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: vi
  text: Nhưng nếu một người cùng người bạn mình vào rừng đốn củi, và khi người ấy vung rìu chặt cây, đầu rìu bằng sắt tuột khỏi cán[a], trúng người bạn ấy khiến người đó chết, thì người ấy có thể chạy trốn đến một trong các thành này để được sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “sắt tuột khỏi gỗ.” Ở đây, “sắt” chỉ đầu rìu bằng sắt, còn “gỗ” chỉ cán rìu bằng gỗ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Nhưng nếu một người
  rationale: Mệnh đề mở đầu nêu một trường hợp cụ thể trong văn mạch luật pháp; cách dịch có điều kiện này tự nhiên trong tiếng Việt và giữ đúng chức năng của câu.
- source_word: רֵעֵהוּ
  choice: người lân cận
  rationale: Trong văn bản luật, từ này chỉ người đồng loại hoặc người cùng cộng đồng, không nhất thiết là bạn thân.
- source_word: בַיַּעַר לַחְטֹב עֵצִים
  choice: vào rừng đốn củi
  rationale: Diễn đạt tự nhiên hoạt động khai thác hoặc chặt gỗ trong rừng mà không thu hẹp quá mức vào một thao tác cụ thể.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: khi người ấy vung rìu
  rationale: Chuyển động của bàn tay được diễn đạt theo thành ngữ tiếng Việt bằng hành động vung dụng cụ, vẫn giữ tính vô ý của tình huống.
- source_word: לִכְרֹת הָעֵץ
  choice: chặt cây
  rationale: כרת trong ngữ cảnh này chỉ việc chặt cây; tiếng Việt không cần thêm từ để diễn đạt hành động ấy rõ ràng.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן־הָעֵץ
  choice: lưỡi sắt tuột khỏi cán
  rationale: Nguyên văn là 'sắt tuột khỏi gỗ'; trong ngữ cảnh, 'sắt' là lưỡi rìu và 'gỗ' là cán. Bản dịch nêu rõ vật được ám chỉ, còn chú thích bảo tồn hình thức nguyên văn.
- source_word: וּמָצָא אֶת־רֵעֵהוּ
  choice: trúng người lân cận
  rationale: מצא ở đây diễn tả vật bay tới và chạm trúng người; 'trúng' tự nhiên và phù hợp với tai nạn hơn cách dịch từng chữ là 'tìm thấy'.
- source_word: וָמֵת
  choice: khiến người đó chết
  rationale: Làm rõ người bị trúng là người chết, tránh nhập nhằng đại từ trong tiếng Việt.
- source_word: הוּא יָנוּס אֶל־אַחַת הֶעָרִים הָאֵלֶּה וָחָי
  choice: người ấy có thể chạy trốn đến một trong các thành này để được sống
  rationale: Diễn đạt quyền chạy đến thành trú ẩn và kết quả được bảo toàn mạng sống trong văn mạch pháp lý.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng dễ hiểu; dùng câu điều kiện tự nhiên trong tiếng Việt hiện đại. Các đại từ được làm rõ để phân biệt người gây tai nạn với người bị nạn, nhưng không thêm yếu tố cố ý hay trách nhiệm đạo đức ngoài nguyên văn.
