  source_fidelity: 'Bản nháp truyền đạt đúng phần lớn nội dung. Tuy nhiên, vế וְהָיָה עָלֶיךָ דָּמִים là hệ quả pháp lý: nếu máu vô tội bị đổ thì trách nhiệm về máu sẽ thuộc về cộng đồng. Cách diễn đạt “để anh em không phải mang...” chuyển vế hệ quả này thành một mệnh đề mục đích phủ định, làm mờ cấu trúc và lực cảnh báo của nguyên văn.'
  naturalness: “Giữa đất của anh em” có thể hiểu được nhưng không tự nhiên bằng “trong đất của anh em”; “máu người vô tội” cũng rõ và tự nhiên hơn “máu vô tội.” Cấu trúc “kẻo anh em sẽ...” diễn đạt trang trọng, hiện đại, và phù hợp với lời cảnh báo pháp lý.
  terminology: Giữ “Yahweh”, “Đức Chúa Trời”, và “cơ nghiệp” là phù hợp. “Mắc tội đổ máu” truyền đạt ý nghĩa pháp lý của דָּמִים (bloodguilt) mà không áp đặt cách diễn giải giáo phái.
