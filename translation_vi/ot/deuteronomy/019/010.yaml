  text: וְ/לֹ֤א יִשָּׁפֵךְ֙ דָּ֣ם נָקִ֔י בְּ/קֶ֣רֶב אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וְ/הָיָ֥ה עָלֶ֖י/ךָ דָּמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: vi
  text: để máu người vô tội không bị đổ trong đất của anh em, là đất Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em làm cơ nghiệp, kẻo anh em sẽ mắc tội đổ máu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “và máu sẽ ở trên anh em”; thành ngữ Hê-bơ-rơ chỉ trách nhiệm pháp lý về việc đổ máu vô tội, tức tội đổ máu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: bị đổ ra
  rationale: Dạng Niphal của שׁפך diễn tả thể bị động; với דָּם trong văn cảnh luật về án mạng, “máu… bị đổ ra” là cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: דָּם נָקִי
  choice: máu vô tội
  rationale: Giữ cách nói pháp lý–đạo đức cô đọng của Hê-bơ-rơ, chỉ máu của người không đáng phải chết.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: giữa đất của anh em
  rationale: קֶרֶב mang nghĩa “ở giữa, bên trong”; cách dịch này giữ sắc thái không gian mà vẫn dễ hiểu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: ban cho anh em làm cơ nghiệp
  rationale: נֹתֵן có sắc thái đang/tiếp tục ban trong mạch diễn từ; נַחֲלָה là phần sở hữu được nhận làm cơ nghiệp. Tiếng Việt không cần biểu thị rõ thể tiếp diễn ở đây.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: để anh em không phải mang tội đổ máu
  rationale: Trong ngữ cảnh pháp lý, דָּמִים chỉ trách nhiệm về máu đã đổ; “mang tội” phản ánh ý niệm trách nhiệm đặt trên cộng đồng. Cấu trúc mục đích phủ định được diễn đạt tự nhiên theo quan hệ với mệnh đề trước.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng bốn phụ âm; “Yahweh” bảo tồn danh giao ước thay vì thay bằng tước hiệu.
- issue: Chủ thể mang trách nhiệm về máu
  choice: anh em, tức cộng đồng được xưng hô ở số ít tập thể
  alternative: cá nhân người nghe
  rationale: Các hậu tố ngôi thứ hai số ít trong đoạn luật hướng đến Israel như một cộng đồng. “Anh em” là cách xưng hô tập thể tự nhiên trong tiếng Việt và không thu hẹp trách nhiệm vào một cá nhân.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” cho ngôi thứ hai số ít mang nghĩa tập thể, “cơ nghiệp” để giữ thuật ngữ giao ước về đất, và đặt dấu chân chú thích [a] ngay sau thành ngữ được giải thích.
