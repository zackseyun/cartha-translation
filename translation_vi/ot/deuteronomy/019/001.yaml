  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: vi
  text: Khi Yahweh, Đức Chúa Trời của anh em, loại bỏ[a] các dân tộc mà Yahweh, Đức Chúa Trời của anh em, ban đất của họ cho anh em, và anh em tước quyền sở hữu đất của họ rồi cư ngụ trong các thành và nhà của họ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiêu diệt” hoặc “trừ bỏ”; nguyên văn Hê-bơ-rơ là “cắt đứt.”
    reason: Ghi nhận nghĩa đen và các khả năng dịch của יַכְרִית mà không làm câu chính thiếu tự nhiên.
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong ngữ cảnh luật pháp này, từ này mở đầu một hoàn cảnh tương lai được xem là chắc chắn và làm tiền đề cho mệnh lệnh tiếp theo; “khi” tự nhiên hơn “nếu”.
- source_word: יַכְרִית
  choice: loại bỏ
  rationale: Dạng Hiphil của כרת ở đây có nghĩa khiến các dân tộc bị trừ bỏ khỏi đất; “loại bỏ” truyền đạt rõ nghĩa trong tiếng Việt hiện đại, còn nghĩa đen “cắt đứt” được ghi ở chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên tên riêng của Đức Chúa Trời được biểu thị bằng Tetragrammaton, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Chuyển đúng danh từ với hậu tố ngôi thứ hai số ít giống đực; “anh em” phù hợp cách diễn đạt cộng đồng trong luật pháp Phục Truyền và vẫn giữ hình thức số ít tập thể.
- source_word: הַגּוֹיִם
  choice: các dân tộc
  rationale: Cách dịch thông dụng, không đưa vào những hàm ý muộn hơn của từ “dân ngoại”.
- source_word: נֹתֵן לְךָ אֶת אַרְצָם
  choice: ban đất của họ cho anh em
  rationale: Giữ rõ cấu trúc Hê-bơ-rơ “ban cho anh em đất của họ”; động tính từ hiện tại diễn tả hành động đang được thực hiện hoặc chắc chắn, nhưng tiếng Việt không cần đánh dấu thì.
- source_word: וִירִשְׁתָּם
  choice: anh em chiếm lấy chỗ của họ
  rationale: Với tân ngữ chỉ người, ירש diễn tả việc chiếm chỗ và tước quyền sở hữu của các dân ấy. Cách nói này tránh ngụ ý rằng chính con người là vật được thừa hưởng.
- source_word: וְיָשַׁבְתָּ
  choice: cư ngụ
  rationale: Giữ sắc thái định cư lâu dài và văn phong trang trọng của điều luật, đồng thời vẫn dễ hiểu.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: trong các thành và nhà của họ
  rationale: Giữ cả hai địa điểm cùng đại từ sở hữu; giới từ “trong” tự nhiên chi phối cả hai danh từ trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo toàn tính chất tên riêng thay vì thay thế bằng một tước hiệu.
- issue: Chủ thể của việc ban đất trong mệnh đề quan hệ
  choice: Ngài ban đất của họ cho anh em
  alternative: Yahweh, Đức Chúa Trời của anh em, ban đất của họ cho anh em
  rationale: “Ngài” có tiền ngữ rõ ràng là Yahweh, Đức Chúa Trời của anh em, giúp câu tiếng Việt bớt nặng mà không thay đổi chủ thể thần học của hành động ban đất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng cho ngôi thứ hai số ít mang tính đại diện/cộng đồng trong diễn ngôn luật pháp. Câu kết bằng dấu phẩy vì câu 1 là mệnh đề tiền đề tiếp nối sang mệnh lệnh ở câu sau.
