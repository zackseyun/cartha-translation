base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: vi
  text: Không một nhân chứng nào được đứng ra chống lại một người[a] về bất cứ điều sai trái nào, về bất cứ tội lỗi nào, hay về bất cứ tội nào người ấy phạm. Một vụ việc được xác lập[c] theo lời chứng[b] của hai hoặc ba nhân chứng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “một người nam”, dùng hình thức giống đực số ít theo nghĩa đại diện trong quy định pháp lý.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “theo miệng của hai nhân chứng hoặc theo miệng của ba nhân chứng”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “một vụ việc sẽ đứng vững”. Động từ Hê-bơ-rơ ở đây cũng được dùng ở đầu câu về một nhân chứng, tạo nên sự tương ứng pháp lý: một nhân chứng không được đứng lên chống lại ai, còn vụ việc được đứng vững nhờ hai hoặc ba nhân chứng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: không thể căn cứ ... chỉ được xác lập
  rationale: Trong ngữ cảnh pháp lý, קום nói đến việc lời chứng hay vụ việc có giá trị đứng vững. Cách dịch tiếng Việt diễn đạt rõ hiệu lực pháp lý; chú thích giữ lại sự lặp từ và hình ảnh nguyên văn.
- source_word: עֵד אֶחָד
  choice: một nhân chứng duy nhất
  rationale: Diễn đạt tự nhiên và nhấn mạnh rằng lời chứng đơn độc không đủ làm căn cứ pháp lý.
- source_word: בְּאִישׁ
  choice: để buộc tội một người
  rationale: Giới từ ב trong ngữ cảnh tố tụng chỉ việc làm chứng chống lại một người. “Một người” là cách nói pháp lý tự nhiên trong tiếng Việt và không thu hẹp phạm vi áp dụng của danh từ giống đực số ít mang nghĩa đại diện.
- source_word: לְכָל עָוֺן וּלְכָל חַטָּאת
  choice: về bất cứ điều gian ác hay tội lỗi nào
  rationale: Giữ hai thuật ngữ đạo đức–pháp lý riêng biệt thay vì gộp thành một, đồng thời dùng cách diễn đạt dễ hiểu trong tiếng Việt hiện đại.
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: tức bất cứ tội nào người ấy phạm
  rationale: Giữ tính bao quát và sự lặp ý của nguyên văn nhưng tránh lối dịch gượng “tội mà người ấy phạm tội”.
- source_word: עַל פִּי
  choice: dựa trên lời chứng
  rationale: Thành ngữ nguyên văn là “theo miệng của”, trong ngữ cảnh này chỉ cơ sở lời khai của nhân chứng.
- source_word: שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: hai hoặc ba nhân chứng
  rationale: Truyền đạt trực tiếp yêu cầu số lượng nhân chứng; “hoặc” phản ánh אוֹ trong nguyên văn.
- source_word: דָּבָר
  choice: một vụ việc
  rationale: Trong bối cảnh xét xử, דָּבָר là sự việc hay vụ việc đang được xem xét; “vụ việc” rõ nghĩa pháp lý hơn “lời” mà vẫn đủ rộng.
theological_decisions:
- issue: Ngôn ngữ giống đực mang nghĩa đại diện trong אִישׁ
  choice: một người
  alternative: một người nam
  rationale: Danh từ Hê-bơ-rơ ở dạng giống đực số ít, nhưng trong quy định pháp lý này nó đại diện cho người bị tố cáo nói chung. Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp, nên “một người” vừa tự nhiên vừa giữ phạm vi tổng quát; chú thích nêu rõ hình thức nguyên văn.
- issue: Quan hệ giữa lời chứng và việc xác lập vụ án
  choice: Một nhân chứng không đủ làm căn cứ; vụ việc chỉ được xác lập bằng hai hoặc ba nhân chứng
  alternative: Một nhân chứng không được đứng lên; một sự việc sẽ đứng vững
  rationale: Chọn nghĩa pháp lý của קום mà không suy diễn về mức hình phạt hay bản chất riêng của tội. Sự lặp động từ trong tiếng Hê-bơ-rơ được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại, dùng “buộc tội”, “căn cứ”, “lời chứng” và “xác lập” để người đọc phổ thông hiểu rõ. Câu dịch giữ ba lớp từ chỉ sự sai phạm của nguyên văn mà không biến chúng thành các loại tội danh kỹ thuật.
