    issue: Mệnh đề đầu chuyển “một nhân chứng” thành phương tiện căn cứ vô nhân xưng và thêm sắc thái kết án trong “buộc tội”.
    rationale: לֹא יָקוּם עֵד אֶחָד ... diễn tả trực tiếp việc một nhân chứng không được đứng lên/chống lại một người trong thủ tục pháp lý. “Buộc tội” có thể hiểu hẹp là khởi tố hoặc kết tội, trong khi nguyên văn bao quát lời làm chứng liên quan đến mọi sai phạm.
  - severity: medium
