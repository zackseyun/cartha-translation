source:
  edition: WLC
  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: vi
  text: Nếu anh em tuân giữ và thực hành trọn vẹn điều răn này[a] mà hôm nay tôi truyền cho anh em—yêu mến Yahweh, Đức Chúa Trời của anh em, và bước đi trong đường lối Ngài suốt đời mình—thì anh em phải thêm cho mình ba thành nữa ngoài ba thành này,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng danh từ số ít: “toàn bộ điều răn này.”'
    reason: Bảo tồn dạng số ít đáng chú ý của הַמִּצְוָה, trong khi câu tiếng Việt dùng “trọn vẹn” để diễn đạt lực bao quát của כָּל một cách tự nhiên.
lexical_decisions:
- source_word: כִּי תִשְׁמֹר
  choice: Nếu anh em tuân giữ
  rationale: כִּי mở đầu điều kiện, còn שׁמר trong văn cảnh giao ước mang nghĩa tuân giữ điều răn. “Nếu anh em tuân giữ” tự nhiên trong tiếng Việt và không thêm trạng từ không có trong nguyên văn.
- source_word: כָּל הַמִּצְוָה הַזֹּאת לַעֲשֹׂתָהּ
  choice: tuân giữ và thực hành trọn vẹn điều răn này
  rationale: Cách diễn đạt này giữ danh từ số ít מִּצְוָה, chuyển tải lực bao quát của כָּל bằng “trọn vẹn”, đồng thời thể hiện לַעֲשֹׂתָהּ là việc đem điều răn ra thực hành.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Mệnh đề quan hệ bổ nghĩa cho “điều răn này”; “hôm nay tôi truyền” diễn đạt trực tiếp hành vi truyền lệnh đang diễn ra trong lời Môi-se.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: yêu mến Yahweh, Đức Chúa Trời của anh em
  rationale: “Yêu mến” phù hợp với sắc thái giao ước của אהב; tên riêng יהוה được phiên âm là “Yahweh”, còn אֱלֹהֶיךָ được diễn đạt bằng cách gọi quen thuộc, trang trọng trong tiếng Việt.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: và bước đi trong đường lối Ngài
  rationale: Giữ nguyên ẩn dụ giao ước “bước đi” thay vì giản lược thành “sống theo”; “đường lối” diễn đạt tự nhiên dạng số nhiều.
- source_word: כָּל הַיָּמִים
  choice: suốt đời mình
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “mọi ngày”; trong ngữ cảnh lòng trung thành kéo dài cả đời, “suốt đời mình” là cách nói tiếng Việt tự nhiên mà không thay đổi phạm vi thời gian.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: thì anh em phải thêm cho mình ba thành nữa ngoài ba thành này
  rationale: “Thì” đánh dấu kết quả của điều kiện; “ba thành nữa ngoài ba thành này” truyền đạt rõ nghĩa bổ sung của עוֹד và עַל trong văn cảnh.
theological_decisions:
- issue: Cách dịch danh thánh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất tên riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi của “điều răn” ở dạng số ít
  choice: điều răn này
  alternative: các điều răn này
  rationale: Giữ dạng số ít của הַמִּצְוָה để không tự quyết định rằng từ này phải được hiểu như một tập hợp các điều răn; chú thích giúp người đọc nhận biết đặc điểm của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện lời nói với cộng đồng Israel dù các hình thức ngôi thứ hai trong câu là giống đực số ít; cách dùng này tự nhiên hơn trong tiếng Việt và vẫn giữ ý nghĩa tập thể. Dấu gạch ngang làm rõ rằng yêu mến Yahweh và bước đi trong đường lối Ngài trình bày nội dung của việc tuân giữ điều răn.
