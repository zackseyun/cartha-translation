base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: vi
  text: 'Đây là quy định về người gây chết người có thể chạy trốn đến đó để bảo toàn mạng sống: người nào vô ý đánh người lân cận mình mà trước đó[a] không thù ghét người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “từ hôm qua và hôm kia”; đây là một thành ngữ chỉ thời gian trước đó, tức “trước đây” hoặc “từ trước”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: quy định
  rationale: Trong văn cảnh pháp luật, từ này chỉ điều khoản xác định trường hợp được hưởng quyền lánh nạn; “quy định” tự nhiên và rõ nghĩa hơn cách dịch sát là “lời” hay “việc”.
- source_word: הָרֹצֵחַ
  choice: người ngộ sát
  rationale: Trong bối cảnh các thành trú ẩn, danh từ này chỉ người gây ra cái chết, còn câu sau xác định đây là trường hợp không cố ý. “Người ngộ sát” tránh hàm ý cố sát của “kẻ giết người”.
- source_word: יָנוּס שָׁמָּה וָחָי
  choice: có thể chạy trốn đến đó để được sống
  rationale: Dạng động từ xác định người đủ điều kiện chạy đến thành trú ẩn, còn vế sau diễn tả kết quả hay mục đích là bảo toàn mạng sống.
- source_word: יַכֶּה אֶת־רֵעֵהוּ
  choice: đánh chết người lân cận
  rationale: נכה tự nó có nghĩa là “đánh”, nhưng toàn bộ văn cảnh xác định cú đánh đã gây chết người. Thêm “chết” giúp tiếng Việt diễn đạt đầy đủ trường hợp pháp lý mà không biến hành vi thành cố sát.
- source_word: בִּבְלִי דַעַת
  choice: vô ý
  rationale: Nghĩa đen là “không biết/không có sự hay biết”; trong văn cảnh pháp lý, “vô ý” diễn đạt gọn và đúng việc không có chủ ý gây chết người.
- source_word: לֹא שֹׂנֵא לוֹ
  choice: không thù ghét người ấy
  rationale: Cách dịch này giữ nguyên tiêu chí về thái độ thù ghét từ trước, vốn liên quan đến việc phân biệt ngộ sát với cố sát.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: trước đó vốn
  rationale: Đây là thành ngữ chỉ thời gian trước đây. “Trước đó vốn không” diễn đạt tự nhiên tình trạng không có thù ghét từ trước; nghĩa đen được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “người ngộ sát” để phân biệt rõ cái chết ngoài ý muốn với hành vi cố sát; dùng “người lân cận” để giữ sắc thái quan hệ của רֵעַ. Dấu chú thích [a] được đặt sau mệnh đề nói về nạn nhân để gắn với câu có thành ngữ thời gian ở phần cuối.
