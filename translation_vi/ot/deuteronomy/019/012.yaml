  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: vi
  text: thì các trưởng lão của thành người ấy phải sai người đến đưa người ấy ra khỏi đó, giao người ấy cho người báo thù huyết[a], và người ấy phải chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người báo thù cho máu đã đổ.” Cụm từ Hê-bơ-rơ גֹּאֵל הַדָּם là một thuật ngữ pháp lý chỉ người có trách nhiệm báo thù cho việc làm đổ máu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: phải sai người đến
  rationale: Trong văn luật pháp, động từ mang sắc thái mệnh lệnh bắt buộc. Cách diễn đạt này tự nhiên trong tiếng Việt và hàm ý các trưởng lão sai người thi hành việc bắt giữ.
- source_word: זִקְנֵי עִירוֹ
  choice: các trưởng lão trong thành của người ấy
  rationale: זִקְנֵי chỉ các vị lãnh đạo dân sự được công nhận; עִיר có thể là thành hoặc thị trấn. “Thành” phù hợp văn cảnh hành chính-pháp lý và lối dùng Kinh Thánh tiếng Việt.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: bắt người ấy từ đó
  rationale: לקח có nghĩa rộng là “lấy, đem đi”; trong bối cảnh đưa kẻ sát nhân ra khỏi thành trú ẩn, “bắt” truyền đạt tự nhiên hành động cưỡng chế nhưng không thêm chi tiết ngoài nguyên văn.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: trao vào tay
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ נתן ביד, đồng thời diễn đạt rõ việc chuyển giao người ấy vào quyền của người khác.
- source_word: גֹּאֵל הַדָּם
  choice: người báo thù huyết
  rationale: Đây là thuật ngữ pháp lý chỉ người có trách nhiệm báo thù cho máu đã đổ. “Báo thù huyết” vừa giữ thành tố “máu/huyết” của nguyên văn vừa có sắc thái trang trọng, gọn.
- source_word: וָמֵת
  choice: và người ấy phải chết
  rationale: Mệnh đề nêu kết cục pháp lý một cách ngắn gọn. “Phải chết” bảo toàn sức bắt buộc/kết quả của lời quy định mà không giải thích thêm nguyên nhân hay cách thức.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Đại từ lặp lại “người ấy” để tránh sự mơ hồ của “ông ta/hắn” và không thêm sắc thái miệt thị; cấu trúc “trao vào tay” giữ hình ảnh pháp lý của nguyên văn.
