revisions:
- from: thì các trưởng lão trong thành của người ấy phải sai người đến bắt người ấy từ đó, trao vào tay người báo thù huyết[a], và người ấy phải chết.
  to: thì các trưởng lão của thành người ấy phải sai người đến đưa người ấy ra khỏi đó, giao người ấy cho người báo thù huyết[a], và người ấy phải chết.
  rationale: Đổi “trong thành” thành “của thành” để biểu đạt đúng quan hệ sở thuộc. Đổi “bắt ... từ đó” thành “đưa ... ra khỏi đó” để phản ánh hành động lấy người ấy khỏi nơi đang ở mà không thêm sắc thái bắt giữ. Đổi “trao vào tay” thành “giao ... cho” nhằm diễn đạt rõ, tự nhiên thành ngữ chuyển giao pháp lý, không thay đổi ý nghĩa.
  reviewer_model: gpt-5.6-terra
