base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/007.yaml
  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: vi
  text: 'Vì vậy, Ta truyền cho ngươi: “Ngươi phải biệt riêng[a] ba thành cho mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chỉ định”. Động từ Hê-bơ-rơ có thể có nghĩa là “tách riêng”, “biệt riêng”, hoặc, trong văn cảnh này, là “chỉ định”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ kết luận từ phần lập luận ngay trước đó.
- source_word: אָנֹכִי
  choice: tôi
  rationale: Giữ đại từ độc lập có tính nhấn mạnh vừa phải; tiếng Việt không cần thêm “chính tôi,” vốn có thể làm sắc thái mạnh quá mức.
- source_word: מְצַוְּךָ
  choice: truyền cho anh em
  rationale: Diễn đạt trực tiếp hành vi ban lệnh đang diễn ra. “Anh em” là cách xưng hô tự nhiên, trang trọng trong tiếng Việt đối với cộng đồng Israel, dù tiếng Hê-bơ-rơ dùng ngôi hai số ít mang tính tập thể.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dẫn nội dung mệnh lệnh một cách tự nhiên hơn lối dịch sát “nói rằng,” đồng thời vẫn giữ cấu trúc dẫn lời.
- source_word: שָׁלֹשׁ עָרִים
  choice: ba thành
  rationale: Dịch trực tiếp cụm số từ và danh từ; “thành” phù hợp văn cảnh đô thị cổ và văn phong Kinh Thánh.
- source_word: תַּבְדִּיל
  choice: phải biệt riêng
  rationale: Giữ nghĩa Hiphil là làm cho tách riêng hoặc dành riêng, đồng thời phù hợp với việc chính thức chọn các thành trong văn cảnh pháp luật.
- source_word: לָךְ
  choice: cho mình
  rationale: Phản ánh giới từ với hậu tố ngôi hai số ít, chỉ việc làm vì nhu cầu hoặc lợi ích của cộng đồng được xưng hô như một tập thể.
theological_decisions:
- issue: Lối xưng hô ngôi hai giống đực số ít trong luật giao ước
  choice: Dùng “anh em” để xưng hô với Israel như một cộng đồng, nhưng giữ “mình” nhằm phản ánh sắc thái tập thể được nói như một đơn vị.
  alternative: Dùng nhất quán số ít “ngươi” hoặc chuyển sang “các anh em.”
  rationale: Tiếng Hê-bơ-rơ xưng hô với Israel ở số ít tập thể. “Anh em” là lối Việt ngữ hiện đại, dễ hiểu và trang trọng, tránh sắc thái cổ hoặc bề trên quá mạnh của “ngươi”; “mình” giúp giữ phần nào hình thức số ít tập thể mà không biến câu thành vô nhân xưng.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “truyền” thay cho cụm nặng hơn “đang truyền lệnh”; dùng “biệt riêng” để vừa giữ hình ảnh tách riêng vừa hàm ý dành riêng cho chức năng pháp lý. Dấu chú thích [a] được đặt ngay sau câu trích dẫn mà chú thích giải thích.
