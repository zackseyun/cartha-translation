source:
  edition: WLC
  text: כִּֽי יָק֥וּם עֵד חָמָ֖ס בְּ/אִ֑ישׁ לַ/עֲנ֥וֹת בּ֖/וֹ סָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: vi
  text: Nếu một nhân chứng ác ý đứng lên chống lại một người để làm chứng rằng người ấy đã phản nghịch,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã sai phạm” hoặc “đã bội đạo.” Từ Hê-bơ-rơ chỉ sự lệch khỏi đường đúng, bất phục hay phản nghịch; trong ngữ cảnh pháp lý này, bản chất chính xác của lời cáo buộc không được nói rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong văn luật theo tình huống, כִּי mở đầu điều kiện giả định, nên dịch tự nhiên là “Nếu”.
- source_word: יָקוּם
  choice: đứng lên
  rationale: Giữ hình ảnh cụ thể của קום, đồng thời phù hợp với việc một nhân chứng xuất hiện hoặc đứng ra trong tố tụng.
- source_word: עֵד חָמָס
  choice: một nhân chứng gian ác
  rationale: Cụm từ có nghĩa sát là “nhân chứng của bạo lực/sai trái”, chỉ người làm chứng với ý đồ gây hại hoặc bất chính; “gian ác” giữ sắc thái đạo đức mạnh mà không mặc nhiên thu hẹp thành “làm chứng dối”.
- source_word: בְּאִישׁ
  choice: chống lại một người
  rationale: Giới từ בְּ ở đây đánh dấu người bị lời chứng nhắm đến. Tiếng Việt không cần duy trì giống ngữ pháp của אִישׁ bằng từ “đàn ông” trong công thức pháp lý đại diện này.
- source_word: לַעֲנוֹת
  choice: để làm chứng
  rationale: Trong bối cảnh xét xử, ענה chỉ việc đáp lời hay trình bày lời chứng; “làm chứng” rõ nghĩa và tự nhiên.
- source_word: בּוֹ
  choice: rằng người ấy
  rationale: Kết cấu tiếng Việt “làm chứng rằng người ấy...” diễn đạt tự nhiên nội dung cáo buộc; quan hệ đối nghịch đã được nêu bằng “chống lại” ở vế trước.
- source_word: סָרָה
  choice: đã phản nghịch
  rationale: סָרָה chỉ sự lệch khỏi đường đúng, bất phục hoặc phản nghịch. “Phản nghịch” giữ được sức nặng của từ mà không giới hạn nó vào nghĩa bội giáo.
theological_decisions:
- issue: Phạm vi ý nghĩa của סָרָה
  choice: phản nghịch
  alternative: sai phạm; bội đạo; lời gian dối
  rationale: Từ này có thể chỉ sự lệch lạc hay phản loạn nghiêm trọng. Bản dịch giữ nghĩa “phản nghịch” nhưng chú thích sự không chắc chắn, tránh quyết định rằng cáo buộc nhất thiết thuộc phạm vi tôn giáo.
- issue: Danh từ giống đực אִישׁ trong công thức pháp lý
  choice: một người
  alternative: một người đàn ông
  rationale: Trong tiếng Hê-bơ-rơ, אִישׁ số ít giống đực có thể dùng cho cá nhân trong một trường hợp luật định. “Một người” truyền đạt đúng đối tượng cá nhân mà không thêm khẳng định không chắc chắn rằng giới tính là điểm có chủ ý của điều luật.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Câu giữ cấu trúc điều kiện của nguyên văn và bảo lưu độ mơ hồ của סָרָה bằng chú thích; dấu chú thích [a] xuất hiện ngay sau từ ngữ liên quan.
