revisions:
- from: Nếu có một nhân chứng gian ác đứng lên chống lại một người để làm chứng rằng người ấy đã phản nghịch,[a]
  to: Nếu một nhân chứng ác ý đứng lên chống lại một người để làm chứng rằng người ấy đã phản nghịch,[a]
  rationale: Chỉ thay “gian ác” bằng “ác ý” để phản ánh tự nhiên và chính xác hơn cụm עֵד חָמָס trong tiếng Việt hiện đại. Giữ cấu trúc, cách dịch pháp lý, cách gọi đối tượng và chú thích về sự mơ hồ của סָרָה.
