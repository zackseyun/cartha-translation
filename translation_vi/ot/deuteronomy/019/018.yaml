revisions:
- from: Các thẩm phán phải điều tra kỹ lưỡng; và nếu quả thật người làm chứng ấy là nhân chứng gian dối, đã làm chứng dối nghịch cùng anh em mình,
  to: Các thẩm phán phải điều tra kỹ lưỡng; và hóa ra người làm chứng đó là người làm chứng gian dối, đã khai gian chống lại anh em mình,
  rationale: Bản sửa bảo tồn cấu trúc câu chưa hoàn tất để nối sang câu 19, chuyển dấu hiệu phát hiện וְהִנֵּה thành “và hóa ra,” và dùng thuật ngữ tố tụng tự nhiên hơn. Sự lặp lại “người làm chứng” được giữ để phản ánh sự lặp lại của עֵד trong nguyên ngữ.
  reviewer_model: gpt-5.6-terra
