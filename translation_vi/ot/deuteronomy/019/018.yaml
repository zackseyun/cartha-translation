  text: Các thẩm phán phải điều tra kỹ lưỡng; và hóa ra người làm chứng đó là người làm chứng gian dối, đã khai gian chống lại anh em mình,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ הַשֹּׁפְטִים הֵיטֵב
  choice: Các thẩm phán phải điều tra kỹ lưỡng
  rationale: Động từ דרשׁ trong ngữ cảnh pháp lý chỉ việc tra xét, điều tra; הֵיטֵב nhấn mạnh mức độ cẩn trọng, thấu đáo.
- source_word: וְהִנֵּה
  choice: và nếu quả thật
  rationale: Trong kết cấu điều kiện của luật án lệ, וְהִנֵּה giới thiệu kết quả được xác minh; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ sắc thái phát hiện/xác nhận.
- source_word: עֵד שֶׁקֶר
  choice: nhân chứng gian dối
  rationale: Cụm danh từ chỉ người làm chứng không trung thực, phù hợp văn cảnh xét xử.
- source_word: שֶׁקֶר עָנָה
  choice: đã làm chứng dối
  rationale: ענה ở đây mang nghĩa đưa lời chứng, còn שׁקר mô tả tính giả dối của lời chứng.
- source_word: בְאָחִיו
  choice: nghịch cùng anh em mình
  rationale: Giữ hình ảnh quan hệ cộng đồng của אָחִיו và sắc thái bất lợi của giới từ בְּ trong ngữ cảnh tố tụng.
theological_decisions:
- issue: Phạm vi của từ אָחִיו
  choice: anh em mình
  alternative: đồng bào mình / người khác
  rationale: Giữ cách diễn đạt thân tộc-cộng đồng của nguyên ngữ, không thu hẹp thành anh em ruột cũng không diễn giải rộng quá mức.
