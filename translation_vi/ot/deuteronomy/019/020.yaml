source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹֽא יֹסִ֨פוּ לַ/עֲשׂ֜וֹת ע֗וֹד כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: vi
  text: Những người còn lại[a] sẽ nghe và sợ, rồi sẽ không còn làm một việc ác như thế[b] ở giữa ngươi nữa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người sót lại” hoặc “phần dân còn lại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “như việc ác này,” tức là một hành vi ác cùng loại.'
    reason: lexical_alternative
  - marker: c
    text: “Ngươi” trong tiếng Hê-bơ-rơ là số ít, xưng hô với Israel như một toàn thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: những người còn lại
  rationale: Phân từ nifal của שׁאר chỉ những người còn lại trong cộng đồng sau khi hình phạt tư pháp được thi hành; cách diễn đạt này tự nhiên và sát nghĩa.
- source_word: יִשְׁמְעוּ
  choice: sẽ nghe
  rationale: Giữ nghĩa cơ bản của שמע. Trong văn cảnh, việc nghe hàm ý biết tin về sự việc, nhưng bản dịch không diễn giải thêm.
- source_word: וְיִרָאוּ
  choice: và sợ
  rationale: Diễn tả nỗi sợ phát sinh khi nghe về hình phạt, có tác dụng răn đe; “sợ” vừa trực tiếp vừa không thêm sắc thái ngoài nguyên văn.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: rồi sẽ không còn làm ... nữa
  rationale: Cấu trúc יסף kết hợp với động từ nguyên mẫu và עוֹד mang nghĩa không tiếp tục hoặc không tái phạm; “không còn ... nữa” là cách nói tiếng Việt tự nhiên.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: một việc ác như thế
  rationale: “Việc” phù hợp với דָּבָר trong văn cảnh hành vi tư pháp, còn “như thế” giữ lực so sánh của tiền tố כְּ.
- source_word: בְּקִרְבֶּךָ
  choice: ở giữa ngươi
  rationale: Giữ hình ảnh 'ở giữa' và hậu tố ngôi thứ hai số ít, qua đó phản ánh việc Israel được nói với như một tập thể thống nhất.
theological_decisions:
- issue: Số ít và đối tượng được xưng hô trong בְּקִרְבֶּךָ
  choice: giữ đại từ số ít “ngươi”
  alternative: dịch theo số nhiều là “ở giữa anh em” hoặc diễn đạt “trong cộng đồng”
  rationale: Hậu tố Hê-bơ-rơ ở ngôi thứ hai giống đực số ít, xưng hô với Israel như một toàn thể. Giữ số ít bảo tồn đặc điểm giao ước này mà không áp đặt cách giải thích thần học riêng.
translation_notes:
  register: Văn phong pháp luật–giao ước, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. “Ngươi” được giữ có chủ ý để thể hiện lối xưng hô số ít với Israel; các động từ ngắn gọn duy trì nhịp răn đe của nguyên văn.
