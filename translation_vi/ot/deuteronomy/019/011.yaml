reference: Deuteronomy 19:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: vi
  text: Nhưng nếu có một người ghét người láng giềng mình, rình phục người ấy, đứng lên chống lại người ấy, đánh người ấy chí mạng khiến người ấy chết, rồi chạy trốn đến một trong các thành này,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Nhưng nếu
  rationale: Mở đầu trường hợp có điều kiện tương phản với trường hợp ngộ sát ở phần trước.
- source_word: יִהְיֶה אִישׁ
  choice: có một người
  rationale: Diễn đạt tự nhiên cấu trúc hiện hữu của tiếng Hê-bơ-rơ trong một tình huống pháp lý điển hình.
- source_word: שֹׂנֵא לְרֵעֵהוּ
  choice: ghét người lân cận mình
  rationale: Giữ nghĩa trực tiếp của שֹׂנֵא và nghĩa xã hội-pháp lý của רֵעַ, không thu hẹp thành bạn thân.
- source_word: וְאָרַב לוֹ
  choice: rình phục người ấy
  rationale: Thể hiện hành vi phục kích có chủ ý và tính toán trước.
- source_word: וְקָם עָלָיו
  choice: rồi xông vào
  rationale: Chuyển thành ngữ 'trỗi dậy chống lại' sang cách nói tiếng Việt tự nhiên, chỉ hành động tấn công thù địch.
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: đánh chí mạng khiến người ấy chết
  rationale: נֶפֶשׁ trong kết hợp này chỉ cú đánh vào mạng sống, còn וָמֵת nêu kết quả là nạn nhân chết.
- source_word: וְנָס
  choice: sau đó chạy trốn
  rationale: Làm rõ trình tự hành động và tránh nhầm chủ thể với nạn nhân vừa được nhắc đến.
- source_word: אֶל אַחַת הֶעָרִים הָאֵל
  choice: đến một trong các thành này
  rationale: Chỉ các thành trú ẩn đã được nêu trong ngữ cảnh trực tiếp; giữ sắc thái chỉ định gần.
theological_decisions:
- issue: Phân biệt cố sát với ngộ sát
  choice: Giữ chuỗi hành động ghét, rình phục, xông vào, đánh chí mạng và chạy trốn.
  alternative: Tóm lược bằng cụm 'giết người ấy' hoặc 'mưu sát người ấy'.
  rationale: Chuỗi hành động trong nguyên văn bộc lộ sự tính toán trước mà không thay thế cách mô tả pháp lý của bản nguồn bằng một thuật ngữ diễn giải.
- issue: Ý nghĩa của וְהִכָּהוּ נֶפֶשׁ
  choice: đánh chí mạng khiến người ấy chết
  alternative: đánh người ấy, và người ấy chết
  rationale: Cách chọn phản ánh thành ngữ liên quan đến mạng sống đồng thời giữ mệnh đề riêng nêu kết quả tử vong, không biến נֶפֶשׁ thành một quan niệm thần học riêng về linh hồn.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại, dễ hiểu. Dùng 'người lân cận' theo nghĩa người đồng loại/người cùng cộng đồng trong bối cảnh luật pháp; phân biệt các đại từ để người đọc nhận rõ thủ phạm và nạn nhân. Câu kết bằng dấu phẩy vì câu luật tiếp tục ở câu sau.
