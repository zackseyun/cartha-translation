base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: vi
  text: Bấy giờ, hai người đàn ông có vụ tranh chấp[a] phải đứng trước mặt Yahweh, trước mặt các thầy tế lễ và các thẩm phán đương nhiệm vào thời ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang tranh chấp” hoặc “có vụ kiện giữa họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa hơn: “những người sẽ có trong những ngày ấy”; trong ngữ cảnh, chỉ những người đang giữ các chức vụ này vào thời ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: Bấy giờ ... phải đứng
  rationale: Liên từ waw cùng thể hoàn thành tiếp nối trình tự pháp lý; “Bấy giờ” diễn đạt tự nhiên bước kế tiếp, còn “phải đứng” giữ sắc thái quy định bắt buộc.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: hai người
  rationale: Dịch sát số từ và danh từ chỉ người. Trong tiếng Việt, “người” tự nhiên và không cần thêm từ mang giống ngữ pháp như trong tiếng Hê-bơ-rơ.
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: đang tranh chấp
  rationale: רִיב có thể chỉ sự tranh chấp, việc tranh tụng hoặc vụ kiện. Cách dịch này tự nhiên, rõ nghĩa trong ngữ cảnh tư pháp và không thu hẹp quá mức thành một thuật ngữ tố tụng chuyên biệt.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: “Trước mặt” giữ ý đứng trong sự hiện diện và dưới thẩm quyền xét xử; danh thánh יהוה được chuyển tự là “Yahweh”.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: trước mặt các thầy tế lễ và các thẩm phán
  rationale: Giữ hai nhóm chức vụ tôn giáo–tư pháp và lặp “trước mặt” theo cấu trúc Hê-bơ-rơ để làm rõ rằng các đương sự trình diện trước những người có thẩm quyền.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: đương nhiệm vào thời ấy
  rationale: Cụm từ theo sát mặt chữ là “những người sẽ có trong những ngày ấy”; trong ngữ cảnh, nó chỉ các thầy tế lễ và thẩm phán đang giữ chức vào thời điểm vụ việc được xét xử. “Đương nhiệm” diễn đạt hàm ý chức vụ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh thánh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Chuyển tự “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại, dễ hiểu. “Bấy giờ” thể hiện trình tự thủ tục; “đương nhiệm” truyền đạt ngắn gọn vai trò chính thức mà không dùng lối hành chính quá nặng.
