- from: Bấy giờ, hai người đang tranh chấp[a] phải đứng trước mặt Yahweh, trước mặt các thầy tế lễ và các thẩm phán đương nhiệm vào thời ấy.[b]
  to: Bấy giờ, hai người đàn ông có vụ tranh chấp[a] phải đứng trước mặt Yahweh, trước mặt các thầy tế lễ và các thẩm phán đương nhiệm vào thời ấy.[b]
  rationale: Chỉnh nhẹ để phản ánh giống đực của danh từ nguồn và dùng cách diễn đạt pháp lý gần hơn với kết cấu Hê-bơ-rơ, đồng thời giữ nguyên ý nghĩa, sắc thái thủ tục, danh thánh và các neo chú thích.
