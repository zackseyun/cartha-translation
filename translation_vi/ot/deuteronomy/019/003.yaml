  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: vi
  text: Ngươi phải chuẩn bị đường đi cho mình, và chia địa phận xứ mà Yahweh, Đức Chúa Trời của ngươi, ban cho ngươi làm cơ nghiệp thành ba phần, để bất cứ người nào đã giết người[a] cũng có thể chạy trốn đến đó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người gây ra cái chết”. Từ Hê-bơ-rơ ở đây có nghĩa rộng hơn “kẻ sát nhân” trong bối cảnh các thành trú ẩn.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “và sẽ là để chạy trốn đến đó.”'
    reason: literal_rendering
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: chuẩn bị con đường cho mình
  rationale: Động từ Hifil תָּכִין mang nghĩa làm cho sẵn sàng; הַדֶּרֶךְ trong bối cảnh địa lý-pháp lý chỉ tuyến đường thực tế dẫn đến các thành trú ẩn.
- source_word: וְשִׁלַּשְׁתָּ
  choice: chia ... thành ba phần
  rationale: Động từ Piel từ שלש diễn tả việc phân chia thành ba phần; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: גְּבוּל אַרְצְךָ
  choice: địa phận xứ ... của ngươi
  rationale: גְּבוּל tại đây chỉ toàn vùng lãnh thổ hơn là riêng đường ranh giới; “địa phận” giữ được sắc thái không gian của từ.
- source_word: יַנְחִילְךָ
  choice: ban cho ngươi làm cơ nghiệp
  rationale: Dạng Hifil của נחל diễn tả việc trao cho ai một sản nghiệp, vừa hàm ý ban tặng vừa giữ chủ đề cơ nghiệp của xứ.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của ngươi
  rationale: Dùng “Yahweh” để thể hiện trực tiếp danh giao ước יהוה; cụm còn lại được diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: để ... có thể chạy trốn đến đó
  rationale: Cấu trúc Hê-bơ-rơ cô đọng mang ý chỉ mục đích; cách dịch này làm rõ quan hệ mục đích mà không thêm nội dung.
- source_word: כָּל רֹצֵחַ
  choice: bất cứ người giết người nào
  rationale: Trong luật về thành trú ẩn, רֹצֵחַ có thể chỉ người gây ra cái chết, kể cả trường hợp vô ý; “người giết người” rộng hơn “kẻ sát nhân” và không phán quyết trước mức độ có tội.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Phiên âm danh riêng bảo tồn cách bản Hê-bơ-rơ trực tiếp dùng danh giao ước, thay vì thay thế bằng một tước hiệu.
- issue: רֹצֵחַ có mặc nhiên chỉ tội sát nhân hay không
  choice: người giết người
  alternative: kẻ sát nhân
  rationale: Ngữ cảnh kế tiếp bao gồm người vô ý gây chết người; lựa chọn này giữ phạm vi pháp lý rộng và không mặc nhiên kết luận người ấy cố sát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ngươi” để duy trì sắc thái lời luật giao trực tiếp cho dân giao ước; tránh thuật ngữ pháp lý cổ như “ngộ sát”, vì câu này tự nó chưa phân định cố ý hay vô ý.
