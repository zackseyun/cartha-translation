revisions:
- from: Anh em phải xử người ấy đúng như điều người ấy đã định làm cho anh em mình.[a] Như vậy, anh em sẽ loại trừ điều ác khỏi giữa mình.
  to: Anh em phải xử người ấy theo đúng điều người ấy đã định làm cho người anh em của mình.[a] Như vậy, anh em sẽ loại trừ điều ác khỏi giữa mình.
  rationale: Bản sửa làm rõ số ít của אָחִיו và dùng lối diễn đạt pháp lý Việt ngữ tự nhiên hơn. Bản văn vẫn giữ “người anh em” trong thân bài, đồng thời chú thích bảo tồn nghĩa rộng theo bối cảnh cộng đồng của từ này.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng nguyên tắc hình phạt tương xứng trong nguyên văn và công thức loại bỏ điều ác khỏi cộng đồng. Tuy nhiên, “anh em mình” ở mệnh đề thứ nhất dễ được hiểu là số nhiều hoặc có sở hữu ngữ không rõ quy chiếu, trong khi אָחִיו là danh từ số ít: “người anh em của mình.”'
  naturalness: “Phải xử người ấy đúng như điều...” khá hiểu được, nhưng “xử người ấy theo đúng điều...” tự nhiên và chính xác hơn trong văn phong pháp lý hiện đại. Cần làm rõ danh từ số ít ở mệnh đề nói về người bị hại.
  terminology: Giữ “anh em” làm lối xưng hô với cộng đồng, “điều ác” cho הָרָע, và “loại trừ ... khỏi giữa mình” cho công thức בער. “Người anh em của mình” giữ thuật ngữ thân tộc số ít; chú thích nêu khả năng nghĩa cộng đồng mà không áp đặt một cách hiểu hẹp.
  issues:
  - severity: medium
    issue: “anh em mình” không biểu đạt rõ danh từ số ít אָחִיו.
    rationale: Cụm này trong tiếng Việt có thể được hiểu là “các anh em của mình” hoặc như một lối gọi tập thể, trong khi tiếng Hê-bơ-rơ ở đây là “người anh em của người ấy,” với nghĩa mở rộng có thể là một thành viên cùng cộng đồng.
  - severity: low
    issue: Cách kết hợp “xử người ấy đúng như điều...” hơi gượng.
    rationale: “Xử người ấy theo đúng điều người ấy đã định làm...” là kết cấu pháp lý tự nhiên hơn mà vẫn bảo toàn quan hệ tương xứng כַּאֲשֶׁר.
  revised_text: Anh em phải xử người ấy theo đúng điều người ấy đã định làm cho người anh em của mình.[a] Như vậy, anh em sẽ loại trừ điều ác khỏi giữa mình.
