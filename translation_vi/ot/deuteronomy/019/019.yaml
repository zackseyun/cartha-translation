base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: vi
  text: Anh em phải xử người ấy theo đúng điều người ấy đã định làm cho người anh em của mình.[a] Như vậy, anh em sẽ loại trừ điều ác khỏi giữa mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người đồng bào của mình”; nguyên văn Hê-bơ-rơ là “người anh em của mình”, một cách gọi một thành viên cùng cộng đồng giao ước trong bối cảnh luật pháp này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Anh em phải xử
  rationale: Động từ số nhiều hướng đến cộng đồng hoặc những người thi hành xét xử. “Phải xử” truyền đạt tự nhiên sức nặng pháp lý của mệnh lệnh và phù hợp với đối tượng là kẻ làm chứng gian.
- source_word: לוֹ
  choice: người ấy
  rationale: Đại từ chỉ kẻ làm chứng gian trong ngữ cảnh; cách gọi này trang trọng, rõ ràng và không hàm ý thiếu tôn trọng.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn đạt rõ nguyên tắc hình phạt tương xứng với điều kẻ ấy đã mưu định.
- source_word: זָמַם
  choice: đã định
  rationale: זמם chỉ việc dự tính hoặc mưu định, thường mang ý gây hại. “Đã định” giữ được trọng tâm là chủ ý mà không thêm sắc thái tâm lý quá mức.
- source_word: לַעֲשׂוֹת
  choice: làm
  rationale: Dịch trực tiếp động từ nguyên mẫu bổ nghĩa cho זמם.
- source_word: לְאָחִיו
  choice: cho anh em mình
  rationale: אָח nghĩa đen là “anh/em trai” nhưng trong luật giao ước thường chỉ một thành viên khác trong cộng đồng. “Anh em mình” vừa giữ hình ảnh thân tộc của nguyên văn vừa có thể mang nghĩa cộng đồng trong tiếng Việt; chú thích nêu rõ nghĩa rộng hơn.
- source_word: וּבִעַרְתָּ
  choice: Như vậy, anh em sẽ loại trừ
  rationale: Trong công thức pháp lý của Phục Truyền Luật Lệ Ký, בער nói đến việc dẹp bỏ điều ác khỏi cộng đồng, không phải đốt theo nghĩa đen. “Loại trừ” tự nhiên và giữ được lực tư pháp.
- source_word: הָרָע
  choice: điều ác
  rationale: Giữ sức nặng luân lý và tính công thức của danh từ Hê-bơ-rơ, thay vì thu hẹp thành một hành vi vi phạm cụ thể.
- source_word: מִקִּרְבֶּךָ
  choice: khỏi giữa mình
  rationale: Bảo tồn hình ảnh điều ác bị dẹp khỏi bên trong cộng đồng, đồng thời tránh lặp đại từ xưng hô nặng nề trong tiếng Việt.
theological_decisions:
- issue: Từ thân tộc אָחִיו trong bối cảnh luật giao ước
  choice: anh em mình
  alternative: người đồng bào của mình; người cùng cộng đồng với mình
  rationale: Nguyên văn dùng danh từ giống đực số ít “anh/em trai”, nhưng trong văn luật từ này có thể chỉ một thành viên trong cộng đồng giao ước. “Anh em mình” giữ được hình ảnh thân tộc và độ rộng tập thể vốn có trong cách dùng tiếng Việt, còn chú thích bảo tồn khả năng hiểu là người đồng bào.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “anh em” để xưng hô với cộng đồng, “phải xử” cho lực mệnh lệnh tư pháp, và “loại trừ điều ác” để truyền đạt công thức pháp lý Hê-bơ-rơ mà không gợi nghĩa đốt theo nghĩa đen.
