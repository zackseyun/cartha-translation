base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: vi
  text: 'Bên kia sông Giô-đanh[a], trong xứ Mô-áp, Môi-se bắt đầu giải thích luật pháp này[b] như sau:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Qua sông Giô-đanh” hoặc “Ở phía bên kia sông Giô-đanh.” Cụm từ Hê-bơ-rơ phụ thuộc vào điểm nhìn địa lý của người nói.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự chỉ dạy này.” Từ Hê-bơ-rơ torah có thể có nghĩa là “luật pháp” hoặc, rộng hơn, “sự chỉ dạy”; ở đây chọn “luật pháp” vì bối cảnh pháp lý của giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: Bên kia sông Giô-đanh
  rationale: Cụm từ chỉ vùng ở phía bên kia sông Giô-đanh theo điểm nhìn địa lý của người nói. Cách dịch này tự nhiên trong tiếng Việt nhưng vẫn giữ tính tương đối của điểm nhìn; chú thích ghi nhận cách hiểu tương đương.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: trong xứ Mô-áp
  rationale: אֶרֶץ trong ngữ cảnh địa lý-chính trị có nghĩa là xứ hay đất; “xứ Mô-áp” trang trọng, rõ nghĩa và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: הוֹאִיל
  choice: bắt đầu
  rationale: Trong kết cấu này, động từ biểu thị việc khởi sự hoặc đảm nhận một hành động. “Bắt đầu” diễn đạt tự nhiên chức năng dẫn nhập phần Môi-se trình bày luật pháp.
- source_word: בֵּאֵר
  choice: giải thích
  rationale: Động từ באר mang nghĩa làm cho rõ, trình bày hoặc giải nghĩa. “Giải thích” là cách diễn đạt hiện đại, dễ hiểu mà không thêm sắc thái chuyên môn không cần thiết.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: luật pháp này
  rationale: תּוֹרָה có thể chỉ sự dạy dỗ hay chỉ dẫn nói chung, nhưng trong bối cảnh giao ước-pháp lý của Phục Truyền Luật Lệ Ký, “luật pháp” giữ được sức nặng pháp lý thích hợp; chú thích bảo lưu nghĩa rộng hơn.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Đây là công thức dẫn vào nội dung lời nói tiếp theo. “Rằng:” liên kết tự nhiên với phần trích dẫn sau trong tiếng Việt.
theological_decisions:
- issue: Cách dịch תּוֹרָה trong bối cảnh giao ước
  choice: luật pháp này
  alternative: sự chỉ dạy này
  rationale: “Luật pháp” bảo tồn chiều kích pháp lý-giao ước của lời Môi-se trình bày, nhưng không phủ nhận nghĩa rộng hơn là sự chỉ dạy; phương án ấy được ghi trong chú thích để tránh thu hẹp âm thầm phạm vi nghĩa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng các địa danh quen thuộc “Giô-đanh”, “Mô-áp” và tên “Môi-se”. Cấu trúc câu bám sát trật tự Hê-bơ-rơ nhưng vẫn tự nhiên; dấu hai chấm báo hiệu lời nói tiếp theo.
