  terminology: Các tên riêng “Giô-đanh”, “Mô-áp”, “Môi-se” và thuật ngữ “luật pháp” nhất quán với văn phong Kinh Thánh Việt ngữ trang trọng. “Xứ Mô-áp” phù hợp với nghĩa địa lý-chính trị của אֶרֶץ. Chú thích a nên nêu một phương án thực sự khác biệt hơn thay vì chỉ lặp lại gần như nguyên văn cách dịch chính.
