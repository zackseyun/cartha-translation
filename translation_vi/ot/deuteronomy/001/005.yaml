  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính của tiếng Hê-bơ-rơ: địa điểm tương đối bên kia sông Giô-đanh, xứ Mô-áp, hành động Môi-se khởi sự/đảm nhận việc làm sáng tỏ התורה này, và công thức dẫn nhập לֵאמֹר. “Bắt đầu giải thích” là một cách diễn đạt phù hợp trong ngữ cảnh này; “luật pháp này” giữ được sắc thái giao ước-pháp lý của הַתּוֹרָה הַזֹּאת, đồng thời chú thích bảo lưu nghĩa rộng hơn.'
