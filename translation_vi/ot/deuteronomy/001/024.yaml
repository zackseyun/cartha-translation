base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: vi
  text: Họ đổi hướng, đi lên miền đồi núi, đến tận thung lũng Ếch-côn[a] và do thám vùng ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khe suối Ếch-côn” hoặc “suối Ếch-côn”; từ Hê-bơ-rơ có thể chỉ một thung lũng có dòng nước theo mùa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: Họ quay lại
  rationale: Động từ פנה trong mạch kể chỉ việc đổi hướng; “quay lại” diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: וַיַּעֲלוּ
  choice: đi lên
  rationale: עלה diễn tả chuyển động lên cao; “đi lên” giữ được sắc thái địa hình mà vẫn tự nhiên.
- source_word: הָהָרָה
  choice: miền đồi núi
  rationale: Dạng có hậu tố chỉ hướng diễn tả chuyển động vào vùng núi/đồi; “miền đồi núi” phù hợp với địa hình và văn phong tiếng Việt hiện đại.
- source_word: וַיָּבֹאוּ עַד
  choice: đến tận
  rationale: בוא kết hợp với עַד nhấn mạnh việc đi đến một địa điểm giới hạn; “đến tận” bảo toàn sắc thái ấy.
- source_word: נַחַל אֶשְׁכֹּל
  choice: thung lũng Ếch-côn
  rationale: נחל có thể chỉ thung lũng khe suối hoặc dòng nước theo mùa. Trong chính văn, “thung lũng” rõ nghĩa và tự nhiên; các khả năng khác được ghi ở chú thích.
- source_word: וַיְרַגְּלוּ
  choice: do thám
  rationale: Dạng piel của רגל chỉ hoạt động trinh sát/do thám, không đơn thuần là khám phá; “do thám” giữ đúng sắc thái.
- source_word: אֹתָהּ
  choice: vùng ấy
  rationale: Đại từ giống cái số ít quy chiếu về vùng đất đang được nói đến; tiếng Việt dùng “vùng ấy” để làm rõ đối tượng mà không thêm một ý mới.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Địa danh אֶשְׁכֹּל được phiên âm là “Ếch-côn”. Dùng “do thám” để giữ sắc thái trinh sát của nguyên ngữ.
