source:
  edition: WLC
  text: וַ/יִּקְח֤וּ בְ/יָדָ/ם֙ מִ/פְּרִ֣י הָ/אָ֔רֶץ וַ/יּוֹרִ֖דוּ אֵלֵ֑י/נוּ וַ/יָּשִׁ֨בוּ אֹתָ֤/נוּ דָבָר֙ וַ/יֹּ֣אמְר֔וּ טוֹבָ֣ה הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: vi
  text: 'Họ cầm trong tay một ít hoa quả của xứ ấy, đem xuống cho chúng tôi, rồi thuật lại cho chúng tôi[a] rằng: “Xứ mà Yahweh, Đức Chúa Trời của chúng ta, đang ban cho chúng ta thật tốt đẹp.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ đem lời báo về cho chúng tôi”; sát nghĩa: “họ đem lại cho chúng tôi một lời [báo].”'
    reason: Làm rõ thành ngữ Hê-bơ-rơ וַיָּשִׁבוּ אֹתָנוּ דָבָר (‘đem lại lời/tin, báo cáo lại’) mà không dùng lối calque không chính xác.
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: Họ cầm trong tay
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: מִפְּרִי הָאָרֶץ
  choice: một ít hoa quả của xứ ấy
  rationale: 'Diễn đạt sắc thái phân lượng của מִן: họ mang một phần sản vật làm mẫu, chứ không phải toàn bộ.'
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: đem xuống cho chúng tôi
  rationale: Giữ hướng chuyển động ‘xuống’ của thể Hifil động từ ירד.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: thuật lại cho chúng tôi
  rationale: Chuyển thành ngữ ‘đem lời trở lại’ sang cách nói tiếng Việt tự nhiên, với chú thích bảo lưu hình ảnh nguyên văn.
- source_word: טוֹבָה הָאָרֶץ
  choice: xứ ... thật tốt đẹp
  rationale: טוֹבָה là lời đánh giá tích cực rộng về xứ; ‘thật tốt đẹp’ vừa rõ nghĩa vừa trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước trong bản nguồn, không thay bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Cách diễn đạt trang trọng, quen thuộc và thể hiện rõ đại từ sở hữu số nhiều.
- source_word: נֹתֵן לָנוּ
  choice: đang ban cho chúng ta
  rationale: ‘Đang ban’ phản ánh sắc thái tiếp diễn hoặc đang thành tựu của phân từ; ‘cho chúng ta’ giữ rõ đối tượng tiếp nhận.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Bản nguồn trực tiếp dùng danh riêng יהוה; phiên âm Yahweh bảo lưu danh ấy thay vì thay bằng tước hiệu.
- issue: Sắc thái thời của נֹתֵן לָנוּ
  choice: đang ban cho chúng ta
  alternative: ban cho chúng ta
  rationale: Giữ sắc thái hành động đang diễn ra hoặc sắp được thực hiện của phân từ mà không quyết định quá mức thời điểm hoàn tất lời ban.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “xứ” để phù hợp bối cảnh lãnh thổ được hứa ban; giữ “Yahweh” như danh riêng. Cấu trúc câu được làm tự nhiên nhưng vẫn bảo lưu hướng ‘đem xuống’, sắc thái phân lượng và hành động ban đang diễn tiến.
