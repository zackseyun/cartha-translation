- from: 'Họ cầm trong tay một ít hoa quả của xứ ấy, đem xuống cho chúng tôi, rồi thuật lại cho chúng tôi[a] rằng: “Xứ mà Yahweh, Đức Chúa Trời của chúng ta, đang ban cho chúng ta thật tốt đẹp.”'
