- from: Còn anh em, hãy quay lại và lên đường vào hoang mạc, theo đường hướng về Biển Đỏ.[a]
  to: Còn anh em, hãy quay lại, rồi lên đường về phía hoang mạc theo con đường về Biển Đỏ.[a]
  rationale: Chỉ chỉnh sửa cách diễn đạt tuyến đường để tiếng Việt tự nhiên và rõ nghĩa hơn. “Về phía hoang mạc” phản ánh hậu tố chỉ hướng của הַמִּדְבָּרָה mà không khẳng định quá mức việc đã đi vào bên trong hoang mạc. “Quay lại” vẫn diễn đạt mệnh lệnh đổi hướng trong ngữ cảnh.
