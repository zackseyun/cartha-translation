  text: וְ/אַתֶּ֖ם פְּנ֣וּ לָ/כֶ֑ם וּ/סְע֥וּ הַ/מִּדְבָּ֖רָ/ה דֶּ֥רֶךְ יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/040.yaml
  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: vi
  text: Còn anh em, hãy quay lại, rồi lên đường về phía hoang mạc theo con đường về Biển Đỏ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “Biển Sậy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Còn anh em
  rationale: Liên từ cùng đại từ độc lập tạo thế tương phản và nhấn mạnh đối tượng được truyền lệnh; “Còn anh em” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: פְּנוּ לָכֶם
  choice: hãy quay lại
  rationale: Động từ chỉ sự đổi hướng; לָכֶם đi kèm có tính thành ngữ, nhấn vào chính người nghe. “Quay lại” diễn đạt tự nhiên hành động đổi hướng mà không cần thêm đại từ phản thân gượng gạo.
- source_word: וּ/סְעוּ
  choice: và lên đường
  rationale: נסע thường chỉ việc nhổ trại và bắt đầu di chuyển; “lên đường” là cách nói hiện đại, rõ ràng.
- source_word: הַמִּדְבָּרָה
  choice: vào hoang mạc
  rationale: Đuôi chỉ hướng biểu thị chuyển động về phía hoang mạc; trong ngữ cảnh hành trình, “vào hoang mạc” là cách diễn đạt tự nhiên.
- source_word: דֶּרֶךְ
  choice: theo đường hướng về
  rationale: Danh từ này ở đây xác định tuyến đường. Cụm tiếng Việt này tránh hiểu nhầm rằng Biển Đỏ là đích đến cuối cùng, đồng thời vẫn giữ ý về hướng tuyến.
- source_word: יַם סוּף
  choice: Biển Đỏ
  rationale: “Biển Đỏ” là địa danh quen thuộc trong tiếng Việt; nghĩa sát mặt chữ “Biển Sậy” được ghi ở chú thích để bảo toàn vấn đề từ vựng.
theological_decisions: []
