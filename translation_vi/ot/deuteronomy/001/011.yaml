  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc lời chúc nguyện của tiếng Hê-bơ-rơ: Yahweh được gọi là Đức Chúa Trời của tổ phụ người nghe; ý gia tăng dân số “gấp ngàn lần” so với hiện trạng được giữ; và vế cuối dịch động từ דִּבֶּר theo nghĩa rộng là “đã phán”, không diễn giải hẹp thành “đã hứa”.'
