  terminology: “Yahweh” nhất quán với quyết định dịch danh riêng; “Đức Chúa Trời,” “tổ phụ,” và “ban phước” là các thuật ngữ chuẩn, dễ hiểu trong văn phong Kinh Thánh tiếng Việt. Viết hoa “Ngài” phù hợp quy ước kính ngữ, không thêm ý nghĩa vào nguyên văn.
