id: DEU.1.11
reference: Deuteronomy 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֣י אֲבֽוֹתֵ/כֶ֗ם יֹסֵ֧ף עֲלֵי/כֶ֛ם כָּ/כֶ֖ם אֶ֣לֶף פְּעָמִ֑ים וִ/יבָרֵ֣ךְ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: vi
  text: Nguyện Yahweh, Đức Chúa Trời của tổ phụ anh em, khiến anh em đông gấp ngàn lần hiện nay và ban phước cho anh em, như Ngài đã phán với anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Đức Chúa Trời của tổ phụ anh em
  rationale: Giữ ý nghĩa theo nghĩa đen là Đức Chúa Trời của các bậc cha ông, đồng thời dùng cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: khiến anh em đông gấp ngàn lần hiện nay
  rationale: Diễn đạt tự nhiên ý cầu chúc gia tăng số người lên một ngàn lần so với số lượng hiện tại.
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: và ban phước cho anh em
  rationale: Tiếp nối thức cầu chúc của mệnh đề trước; tiếng Việt không cần lặp lại từ 'nguyện'.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: như Ngài đã phán với anh em
  rationale: Giữ động từ rộng nghĩa 'phán/nói' của nguyên văn, không thu hẹp thành 'hứa'.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm giúp bảo tồn chức năng của danh giao ước.
- issue: Ý nghĩa của אֲבֹתֵיכֶם
  choice: tổ phụ anh em
  alternative: tổ tiên anh em
  rationale: Cụm từ chỉ các bậc cha ông trong lịch sử giao ước; 'tổ phụ' vừa giữ sắc thái nam tính của nguyên văn vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- issue: Quan hệ giữa lời phán và phước lành
  choice: như Ngài đã phán với anh em
  alternative: như Ngài đã hứa với anh em
  rationale: Ngữ cảnh có thể hàm ý lời hứa, nhưng דִּבֶּר tự nó chỉ việc phán/nói; bản dịch giữ độ rộng và sự mơ hồ chân thực của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' để chỉ cộng đồng Israel được Môi-se trực tiếp nói với; viết hoa đại từ 'Ngài' theo quy ước kính ngữ phổ biến trong tiếng Việt.
