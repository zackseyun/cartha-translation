  - severity: low
    issue: Bản nháp dùng “anh em” xuyên suốt, làm mất sự luân phiên số ít rồi số nhiều trong nguyên văn.
    rationale: Các hình thức ở nửa đầu câu là số ít tập thể, còn “anh em đã đi” là số nhiều. Có thể giữ sự luân phiên này trong tiếng Việt mà vẫn dễ hiểu.
