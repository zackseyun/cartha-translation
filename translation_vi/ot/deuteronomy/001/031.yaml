source:
  edition: WLC
  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: vi
  text: và trong hoang mạc[a], nơi ngươi đã thấy Yahweh, Đức Chúa Trời của ngươi, đã mang ngươi như một người mang con trai mình[b], trên khắp con đường anh em đã đi, cho đến khi anh em tới nơi này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sa mạc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “như một người mang con trai mình”; một số bản dịch diễn đạt khái quát hơn là “như người ta mang một đứa trẻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: và trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, khô cằn; “hoang mạc” tự nhiên trong tiếng Việt và phù hợp bối cảnh hành trình của Israel.
- source_word: אֲשֶׁר רָאִיתָ
  choice: nơi anh em đã thấy
  rationale: Mệnh đề quan hệ được nối tự nhiên với “trong hoang mạc”; động từ số ít hướng đến Israel như một cộng đồng, nhưng tiếng Việt dùng “anh em” để giữ lời nói trực tiếp với dân chúng.
- source_word: נְשָׂאֲךָ
  choice: mang anh em
  rationale: נשא ở đây có nghĩa là mang, bồng hoặc gánh; “mang” vừa rõ ràng vừa liên kết trực tiếp với hình ảnh so sánh tiếp theo.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc và dễ nhận biết trong tiếng Việt cho Danh Giao Ước, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Chuyển tải trực tiếp danh xưng giao ước; cách viết trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: như một người mang con trai mình
  rationale: Giữ nguyên hình ảnh giống đực cụ thể của אִישׁ và בְּנוֹ, không tăng nghĩa thành “người cha” cũng không khái quát hóa thành “đứa trẻ”.
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: suốt cả chặng đường
  rationale: Diễn đạt tự nhiên ý về sự chăm sóc liên tục trong toàn bộ hành trình.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: anh em đã đi
  rationale: הלך cơ bản là đi; trong ngữ cảnh hành trình, cách diễn đạt ngắn gọn này tự nhiên và không thêm sắc thái không có trong nguồn.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: cho đến khi anh em tới nơi này
  rationale: Chuyển cấu trúc nguyên ngữ thành mệnh đề thời gian tự nhiên, đồng thời giữ điểm đích được chỉ trực tiếp.
theological_decisions:
- issue: Cách chuyển Danh יהוה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là tên riêng của Đức Chúa Trời thay vì thay bằng tước hiệu. “Giê-hô-va” là dạng Việt hóa lâu đời, dễ đọc và dễ nhận biết đối với độc giả phổ thông.
- issue: Hình ảnh gia đình mang tính giống đực
  choice: một người mang con trai mình
  alternative: một người bồng đứa con; một người cha mang con mình
  rationale: Nguyên văn nói “một người” và “con trai mình”; bản dịch giữ nét cụ thể ấy mà không diễn giải אִישׁ thành “người cha”.
- issue: Số ít tập thể trong lời nói với Israel
  choice: anh em
  alternative: ngươi; các ngươi
  rationale: Tiếng Hê-bơ-rơ chuyển từ số ít ở đầu câu sang số nhiều khi nhắc đến hành trình. “Anh em” là cách xưng hô hiện đại, có phẩm giá, có thể chỉ cộng đồng mà vẫn phù hợp với số nhiều ở cuối câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; duy trì cấu trúc của câu Hê-bơ-rơ nhưng điều chỉnh vừa đủ cho tiếng Việt tự nhiên. “Anh em” tránh sắc thái cổ của “các ngươi,” còn “suốt cả chặng đường” làm rõ tính liên tục mà không thêm ý thần học.
