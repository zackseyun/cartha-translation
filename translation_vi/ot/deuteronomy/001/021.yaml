  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: vi
  text: Hãy xem, Giê-hô-va, Đức Chúa Trời của anh em, đã đặt xứ ấy trước mặt anh em. Hãy đi lên chiếm lấy xứ, đúng như Giê-hô-va, Đức Chúa Trời của tổ phụ[a] anh em, đã phán với anh em. Đừng sợ, cũng đừng nản lòng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tổ tiên”. Bản Hê-bơ-rơ viết “các tổ phụ/cha của anh em”, một công thức giao ước được giữ trong bản dịch chính.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Hãy xem
  rationale: Mệnh lệnh số ít dùng để thu hút sự chú ý; “Hãy xem” giữ được lực trực tiếp và vẫn tự nhiên trong văn phong trang trọng hiện đại.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt để biểu thị trực tiếp danh giao ước YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cụm sở hữu với hậu tố ngôi hai số ít. Tiếng Việt dùng “anh em” để diễn đạt lời Môi-se nói với cộng đồng Y-sơ-ra-ên được xem như một toàn thể.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: đã đặt ... trước mặt anh em
  rationale: 'Giữ hình ảnh của thành ngữ Hê-bơ-rơ: Đức Chúa Trời đặt xứ trước dân để họ tiến vào nhận lấy.'
- source_word: הָאָרֶץ
  choice: xứ ấy
  rationale: Trong ngữ cảnh, từ này chỉ xứ đã được nói đến và sắp được chiếm hữu; “xứ” phù hợp văn cảnh lãnh thổ hơn “đất”.
- source_word: עֲלֵה
  choice: Hãy đi lên
  rationale: Giữ hướng chuyển động lên vùng đồi núi và sắc thái tiến quân vào xứ.
- source_word: רֵשׁ
  choice: chiếm lấy
  rationale: Động từ ירשׁ ở đây diễn tả hành động tiến vào và nắm quyền sở hữu xứ được ban; “chiếm lấy” giữ sắc thái chủ động của mệnh lệnh.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: đúng như ... đã phán
  rationale: Không diễn giải động từ “phán/nói” thành “hứa,” dù lời hứa được hàm ý trong văn cảnh.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Đức Chúa Trời của tổ phụ anh em
  rationale: “Tổ phụ” giữ công thức giao ước mang nghĩa các bậc cha ông, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: אַל תִּירָא
  choice: Đừng sợ
  rationale: Mệnh lệnh cấm trực tiếp, ngắn gọn và tự nhiên.
- source_word: וְאַל תֵּחָת
  choice: cũng đừng kinh hãi
  rationale: חתת diễn tả bị khuất phục, hoảng hốt hoặc mất tinh thần; “kinh hãi” phân biệt phần nào với “sợ” mà vẫn rõ nghĩa.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ danh riêng của Đức Chúa Trời thay vì thay bằng tước hiệu. “Giê-hô-va” là dạng đã quen thuộc và dễ nhận biết trong tiếng Việt hiện đại.
- issue: Công thức giao ước אֱלֹהֵי אֲבֹתֶיךָ
  choice: Đức Chúa Trời của tổ phụ anh em
  alternative: Đức Chúa Trời của tổ tiên anh em
  rationale: “Tổ phụ” bảo tồn sắc thái nam tính và gia tộc của אבות trong công thức giao ước, thay vì trung hòa thành một từ chung chỉ mọi tổ tiên.
- issue: Ngôi hai số ít mang nghĩa tập thể
  choice: anh em
  alternative: ngươi; bạn
  rationale: Các hậu tố và động từ Hê-bơ-rơ ở số ít, nói với Y-sơ-ra-ên như một toàn thể. “Anh em” truyền đạt lời nói với cộng đồng một cách tự nhiên mà không biến giọng văn thành lời nói với một cá nhân hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; duy trì các mệnh lệnh ngắn, trực tiếp. Dùng “Giê-hô-va” cho YHWH, “Đức Chúa Trời” cho אֱלֹהִים, và “tổ phụ” để bảo tồn công thức giao ước. Không thêm chú thích vì bản văn chính không cần đánh dấu một dị bản hay sự mơ hồ thiết yếu.
