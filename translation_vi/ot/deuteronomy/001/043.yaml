revisions:
- from: Vậy, tôi đã nói với anh em, nhưng anh em không nghe; anh em chống lại mệnh lệnh của Yahweh[a], hành động ngạo mạn và đi lên vùng đồi núi.
  to: Vậy tôi đã nói với anh em, nhưng anh em không nghe; anh em đã phản nghịch lời phán của Yahweh[a], hành động một cách ngạo mạn, rồi lên miền núi.
  rationale: Bản sửa thay cách kết hợp từ chưa tự nhiên “chống lại mệnh lệnh” bằng “phản nghịch lời phán”, vốn sát thành ngữ nguồn hơn và không thu hẹp nghĩa quá mức. Cũng điều chỉnh cách diễn đạt địa hình và nhịp câu cho tự nhiên, trong khi giữ nguyên tên Yahweh, ngôi số nhiều “anh em”, trình tự hành động và sắc thái ngạo mạn/presumptuous của nguyên văn.
