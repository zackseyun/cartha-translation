source:
  edition: WLC
  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: vi
  text: Vậy tôi đã nói với anh em, nhưng anh em không nghe; anh em đã phản nghịch lời phán của Yahweh[a], hành động một cách ngạo mạn, rồi lên miền núi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “miệng của Yahweh”, một thành ngữ chỉ điều Yahweh đã phán hoặc truyền lệnh.
    reason: Giải thích thành ngữ nguyên ngữ, bảo lưu hình ảnh nghĩa đen, và cho biết hàm ý chỉ thị trong ngữ cảnh.
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Vậy, tôi đã nói với anh em
  rationale: Động từ דּבר ở thể piel có nghĩa là “nói”; ו nối tiếp mạch kể và hệ quả từ câu trước, nên “Vậy” tự nhiên trong tiếng Việt. “Anh em” biểu thị ngôi thứ hai số nhiều.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: nhưng anh em không nghe
  rationale: שׁמע có thể mang nghĩa nghe, lắng nghe hoặc vâng lời. “Không nghe” giữ được độ rộng nghĩa của nguyên văn, trong khi vế sau đã nói rõ sự chống nghịch.
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: anh em chống lại mệnh lệnh của Yahweh[a]
  rationale: מרה diễn tả sự chống nghịch quyền bính. Cụm “miệng của Yahweh” là thành ngữ chỉ điều Yahweh đã phán truyền; “mệnh lệnh” truyền đạt nghĩa rõ ràng trong tiếng Việt, còn nghĩa đen được bảo lưu trong chú thích.
- source_word: וַתָּזִדוּ
  choice: hành động ngạo mạn
  rationale: זיד chỉ hành động tự phụ, ngạo mạn hoặc liều lĩnh bất chấp thẩm quyền. Cách dịch này giữ sắc thái đạo đức mà không nhập hành động “đi lên” của động từ kế tiếp vào đây.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: đi lên vùng đồi núi
  rationale: עלה là “đi lên”; dạng chỉ hướng הָהָרָה diễn tả chuyển động vào khu vực cao nguyên hoặc đồi núi, không nhất thiết chỉ một ngọn núi riêng lẻ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng chuyển tự tên riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה; “Yahweh” bảo lưu tên riêng mà không thay bằng một tước hiệu.
- issue: Thành ngữ אֶת־פִּי יְהוָה
  choice: mệnh lệnh của Yahweh, kèm chú thích nghĩa đen
  alternative: miệng của Yahweh; lời của Yahweh
  rationale: “Mệnh lệnh” làm rõ thành ngữ trong ngữ cảnh bất tuân chỉ thị của Đức Chúa Trời, đồng thời chú thích bảo tồn hình ảnh nguyên ngữ và tránh che khuất dữ kiện nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với cộng đồng; giữ nhịp các động từ nối tiếp của lời tường thuật.
