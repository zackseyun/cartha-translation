base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: vi
  text: Hãy tự chọn từ các chi phái của anh em những người nam khôn ngoan, sáng suốt và được biết đến[a]; rồi tôi sẽ lập họ làm người đứng đầu của anh em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “được công nhận”; tiếng Hê-bơ-rơ có thể nhấn mạnh những người có uy tín đã được xác lập trong các chi phái.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen là “đầu”; cũng có thể dịch là “người lãnh đạo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Hãy chọn ... cho anh em
  rationale: Động từ mệnh lệnh הָבוּ theo nghĩa đen là “hãy trao/đưa,” nhưng trong ngữ cảnh tuyển người để Môi-se bổ nhiệm, nghĩa tự nhiên là “hãy chọn”; לָכֶם cho thấy việc chọn là vì chính cộng đồng.
- source_word: אֲנָשִׁים
  choice: những người nam
  rationale: Danh từ số nhiều giống đực chỉ những người nam được chọn vào vai trò lãnh đạo trong cơ cấu bộ tộc; cách dịch này giữ rõ giới tính của nguyên ngữ.
- source_word: חֲכָמִים
  choice: khôn ngoan
  rationale: Trong bối cảnh lãnh đạo và xét xử, từ này nói đến sự khôn ngoan và khả năng phán đoán, không chỉ kỹ năng chuyên môn.
- source_word: וּנְבֹנִים
  choice: sáng suốt
  rationale: Từ gốc בין nhấn mạnh khả năng hiểu thấu và phân định; “sáng suốt” tự nhiên trong tiếng Việt và phù hợp phẩm chất lãnh đạo.
- source_word: וִידֻעִים
  choice: được mọi người biết đến
  rationale: Dạng thụ động của ידע có thể chỉ những người được cộng đồng biết và công nhận, tức có uy tín đã được xác lập; bản dịch tránh hiểu đơn thuần là nổi tiếng.
- source_word: לְשִׁבְטֵיכֶם
  choice: trong các bộ tộc của anh em
  rationale: Cụm giới từ xác định phạm vi cộng đồng nơi các ứng viên được lựa chọn; tiếng Việt tự nhiên dùng “trong các bộ tộc”.
- source_word: וַאֲשִׂימֵם
  choice: rồi tôi sẽ lập họ
  rationale: Trong lời nói trực tiếp, hình thái này diễn tả hành động tiếp theo của Môi-se sau khi dân chọn người; “lập” truyền đạt việc chính thức giao chức vụ.
- source_word: בְּרָאשֵׁיכֶם
  choice: làm người đứng đầu anh em
  rationale: רֹאשׁ theo nghĩa đen là “đầu,” tại đây là ẩn dụ về quyền lãnh đạo; “người đứng đầu” vừa giữ hình ảnh vừa tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Giới tính của אֲנָשִׁים trong việc tuyển chọn lãnh đạo
  choice: những người nam
  alternative: những người
  rationale: Nguyên ngữ dùng danh từ số nhiều giống đực chỉ các lãnh đạo bộ tộc. Giữ “người nam” phản ánh chính xác hình thức và bối cảnh, không trung tính hóa giới tính.
- issue: Quan hệ giữa sự lựa chọn của dân và sự bổ nhiệm của Môi-se
  choice: dân chọn ứng viên, rồi Môi-se lập họ
  alternative: Môi-se tự mình chọn và bổ nhiệm
  rationale: Cấu trúc câu phân biệt mệnh lệnh dành cho dân (“hãy chọn”) với hành động kế tiếp của Môi-se (“tôi sẽ lập”), nên bản dịch bảo toàn cả hai vai trò.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để xưng hô với toàn thể cộng đồng theo số nhiều; giữ “người nam” vì nguyên ngữ xác định giới tính. Dấu chấm phẩy làm rõ hai bước: dân lựa chọn và Môi-se bổ nhiệm.'
