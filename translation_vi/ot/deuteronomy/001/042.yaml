revisions:
- from: 'Yahweh phán với tôi: “Hãy bảo họ: ‘Đừng đi lên và đừng giao chiến, vì Ta không ở giữa các ngươi, kẻo các ngươi bị đánh bại[a] trước mặt kẻ thù.’”'
  to: 'Yahweh phán với tôi: “Hãy bảo họ: ‘Đừng đi lên và đừng giao chiến, vì Ta không ở giữa các ngươi, kẻo các ngươi bị đánh bại trước mặt kẻ thù của các ngươi.’”'
  rationale: Chỉ bổ sung “của các ngươi” để phản ánh chính xác hậu tố sở hữu ngôi hai số nhiều trong אֹיְבֵיכֶם. Chú thích vẫn được giữ, với mốc chú thích đặt sau “bị đánh bại” trong bản văn sửa đổi.
