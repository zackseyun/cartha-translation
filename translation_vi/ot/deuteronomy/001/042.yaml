source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: vi
  text: 'Yahweh phán với tôi: “Hãy bảo họ: ‘Đừng đi lên và đừng giao chiến, vì Ta không ở giữa các ngươi, kẻo các ngươi bị đánh bại trước mặt kẻ thù của các ngươi.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước theo dạng phiên âm gần với tiếng Hê-bơ-rơ, thay vì thay bằng một tước hiệu hoặc dùng dạng ‘Giê-hô-va’.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Trong tiếng Việt Kinh Thánh, ‘phán’ là động từ tự nhiên và trang trọng khi Đức Chúa Trời trực tiếp nói.
- source_word: אֱמֹר לָהֶם
  choice: Hãy bảo họ
  rationale: Diễn đạt tự nhiên mệnh lệnh ‘hãy nói với họ’ mà không thêm nội dung.
- source_word: לֹא תַעֲלוּ
  choice: Đừng đi lên
  rationale: Giữ nghĩa địa lý-quân sự cơ bản của עלה là đi lên hoặc tiến lên.
- source_word: וְלֹא תִלָּחֲמוּ
  choice: và đừng giao chiến
  rationale: ‘Giao chiến’ truyền đạt rõ động từ לחם trong ngữ cảnh quân sự và giữ sắc thái trang trọng.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: vì Ta không ở giữa các ngươi
  rationale: Theo sát hình ảnh ‘ở giữa các ngươi’, nói về sự hiện diện của Yahweh giữa dân chúng mà không giải thích thêm về thần học.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: kẻo các ngươi bị đánh bại
  rationale: Trong ngữ cảnh, liên từ và thể động từ tạo thành lời cảnh báo về hậu quả cần tránh; ‘kẻo’ ngăn người đọc hiểu sai thành lời hứa rằng họ sẽ không thất bại.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: trước mặt kẻ thù
  rationale: Giữ thành ngữ Hê-bơ-rơ ‘trước mặt quân thù’; tiếng Việt vẫn hiểu tự nhiên là thất trận trước đối phương.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Dạng ‘Yahweh’ bảo tồn danh này và tránh thay nó bằng tước hiệu hoặc dạng phiên âm dựa trên truyền thống muộn hơn.
- issue: Lực nghĩa của וְלֹא תִּנָּגְפוּ
  choice: 'Lời cảnh báo: ‘kẻo các ngươi bị đánh bại’'
  alternative: ‘và các ngươi sẽ không bị đánh bại’
  rationale: Mạch văn cho thấy việc Yahweh không ở giữa họ sẽ dẫn đến thất bại nếu họ vẫn tiến quân. Cách dịch phủ định như một lời hứa sẽ đảo ngược ý nghĩa trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ ‘Ta’ phản ánh lời Đức Chúa Trời tự xưng; ‘các ngươi’ giữ sắc thái số nhiều và uy nghiêm của lời phán, dù trang trọng hơn khẩu ngữ hiện nay.
