  text: גַּם בִּ/י֙ הִתְאַנַּ֣ף יְהוָ֔ה בִּ/גְלַלְ/כֶ֖ם לֵ/אמֹ֑ר גַּם אַתָּ֖ה לֹא תָבֹ֥א שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: vi
  text: 'Vì anh em mà Yahweh cũng nổi giận với tôi[a] và phán[b]: “Ngay cả ngươi cũng sẽ không được vào đó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Yahweh cũng nổi giận chống lại tôi vì anh em.”'
    reason: lexical_alternative
  - marker: b
    text: So sánh Dân Số 20:12, nơi việc Môi-se không được vào đất được gắn với chính sự thất bại của ông tại Mê-ri-ba; tại đây, Phục Truyền Luật Lệ Ký nhấn mạnh vai trò của dân chúng trong sự việc.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: cũng / ngay cả
  rationale: Hai lần xuất hiện có sắc thái cộng thêm và nhấn mạnh. Ở vế đầu, “cũng” tự nhiên; ở lời phán trực tiếp, “ngay cả” làm rõ rằng Môi-se cũng bị kể vào số những người không được vào.
- source_word: בִּי
  choice: với tôi
  rationale: Sau הִתְאַנַּף, giới từ בְּ đánh dấu đối tượng của cơn giận. “Nổi giận với tôi” là cách nói tự nhiên trong tiếng Việt; “nổi giận nghịch cùng tôi” cũng có thể hiểu được nhưng kém hiện đại hơn.
- source_word: הִתְאַנַּף
  choice: nổi giận
  rationale: Dạng Hitpael của אנף diễn tả việc trở nên hoặc đang giận dữ. “Nổi giận” vừa rõ nghĩa vừa giữ được sức nặng của động từ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: בִּגְלַלְכֶם
  choice: vì anh em
  rationale: Cụm từ nêu nguyên nhân hoặc duyên cớ. “Vì anh em” trực tiếp, tự nhiên và không giải quyết thay cho bản văn vấn đề trách nhiệm rộng hơn.
- source_word: לֵאמֹר
  choice: và phán
  rationale: Phân từ nguyên mẫu này dẫn vào nội dung lời nói. Vì chủ thể là Yahweh, “phán” phù hợp với văn phong Kinh Thánh tiếng Việt; liên từ “và” nối tự nhiên với mệnh đề trước.
- source_word: אַתָּה
  choice: ngươi
  rationale: Đại từ ngôi hai số ít giống đực chỉ riêng Môi-se. “Ngươi” giữ rõ sự chuyển đổi từ “anh em” số nhiều sang lời trực tiếp nói với một người.
- source_word: לֹא תָבֹא
  choice: sẽ không được vào
  rationale: Trong ngữ cảnh này, בוא nói về việc vào miền đất đã được nhắc đến. Cách diễn đạt này truyền đạt lệnh loại trừ tự nhiên trong tiếng Việt, dù hình thức Hê-bơ-rơ sát hơn là “sẽ không vào”.
- source_word: שָׁם
  choice: đó
  rationale: Trạng từ chỉ nơi chốn hướng về miền đất đang được nói đến; “đó” giữ nguyên tính quy chiếu của bản văn.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ tự YHWH. Phiên âm “Yahweh” bảo tồn danh riêng thay vì thay thế bằng tước hiệu.
- issue: Nguyên nhân khiến Môi-se bị loại khỏi miền đất
  choice: Giữ nguyên lời khẳng định “vì anh em” trong câu chính
  alternative: Đưa lỗi của chính Môi-se tại Mê-ri-ba vào câu chính để hài hòa với Dân Số 20:12
  rationale: Phục Truyền Luật Lệ Ký 1:37 nhấn mạnh vai trò của dân chúng, trong khi Dân Số 20:12 nối việc Môi-se không được vào đất với thất bại của ông. Bản dịch không âm thầm giải quyết căng thẳng này; chú thích chỉ nêu đối chiếu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho hậu tố ngôi hai số nhiều nhằm phản ánh lời Môi-se nói với cộng đồng, và “ngươi” cho số ít trong lời Yahweh phán riêng với Môi-se. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
