    rationale: “Công chính” vẫn có thể dùng và bảo lưu chiều kích đạo đức, nhưng “xét xử công minh” tự nhiên, chính xác hơn về ngữ vực tư pháp. Chú thích bảo lưu nghĩa “công chính/công bằng” của צֶדֶק.
