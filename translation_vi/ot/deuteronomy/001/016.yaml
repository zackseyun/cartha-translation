source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: vi
  text: 'Lúc ấy, tôi truyền cho các thẩm phán của anh em rằng: “Hãy lắng nghe các vụ việc giữa anh em mình và xét xử công minh[a] giữa một người với người anh em của người ấy và với kiều dân của người ấy.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xét xử công chính” hoặc “xét xử theo lẽ công bằng.” Từ Hê-bơ-rơ צֶדֶק (tsedeq) trong bối cảnh tư pháp bao hàm cả sự công chính lẫn công bằng.
    reason: lexical_alternative
  - marker: b
    text: “Kiều dân” dịch từ từ Hê-bơ-rơ גֵּר (ger), chỉ người không phải bản địa nhưng cư trú trong cộng đồng Israel. Cụm từ này theo sát “kiều dân của người ấy” trong nguyên văn; mối liên hệ chính xác hàm trong hậu tố “của người ấy” không cần xác định thêm.
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: tôi truyền
  rationale: Động từ צוה diễn tả việc ban lệnh có thẩm quyền; “truyền” tự nhiên trong lời thuật trang trọng và giữ nguyên sắc thái mệnh lệnh của Môi-se.
- source_word: שֹׁפְטֵיכֶם
  choice: các thẩm phán của anh em
  rationale: Danh từ chỉ những người được bổ nhiệm để phân xử các vụ việc pháp lý; “thẩm phán” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בָּעֵת הַהִוא
  choice: Lúc ấy
  rationale: Cụm từ chỉ thời điểm hoặc giai đoạn đang được thuật lại; “Lúc ấy” ngắn gọn và tự nhiên.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: Hãy nghe các vụ việc giữa anh em mình
  rationale: שׁמע mang nghĩa nghe và xem xét trong bối cảnh tư pháp. Bổ sung “các vụ việc” làm rõ hàm ý pháp lý mà không xác định quá mức đó là tranh chấp; “anh em mình” giữ hình ảnh thân tộc của cộng đồng giao ước.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: và xét xử công chính
  rationale: צֶדֶק ở đây bổ nghĩa cho hành vi xét xử và bao hàm cả sự đúng đắn về đạo đức lẫn công lý pháp lý. “Xét xử công chính” giữ được hai chiều nghĩa ấy.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: giữa một người với người anh em của mình
  rationale: Cách dịch giữ cấu trúc số ít cụ thể và ngôn ngữ thân tộc của nguyên văn, thay vì làm phẳng thành “người này với người kia”.
- source_word: גֵּרוֹ
  choice: ngoại kiều đang cư ngụ cùng người ấy
  rationale: גֵּר chỉ người không phải bản địa nhưng cư trú lâu dài giữa cộng đồng và được luật pháp bảo hộ. “Ngoại kiều đang cư ngụ” truyền đạt cả địa vị người ngoài lẫn tính cư trú; “cùng người ấy” thể hiện hậu tố sở hữu ngôi thứ ba.
theological_decisions:
- issue: Ngôn ngữ thân tộc mang tính đại diện trong אֲחֵיכֶם và אָחִיו
  choice: anh em mình / người anh em của mình
  alternative: đồng bào / người lân cận
  rationale: Nguyên văn dùng danh từ thân tộc giống đực với chức năng đại diện cho các thành viên trong cộng đồng. Giữ “anh em” bảo tồn hình ảnh Israel như một cộng đồng thân tộc mà không buộc câu chỉ áp dụng cho nam giới.
- issue: Ý nghĩa của צֶדֶק trong bối cảnh tư pháp
  choice: công chính
  alternative: công minh / theo lẽ công bằng
  rationale: Từ Hê-bơ-rơ có thể chỉ cả sự công chính về đạo đức lẫn công lý trong xét xử. “Công chính” giữ sự căng nghĩa này, còn chú thích nêu cách hiểu thiên về tư pháp.
- issue: Địa vị của גֵּר
  choice: ngoại kiều đang cư ngụ
  alternative: kiều dân / người ngoại quốc cư trú
  rationale: Không đồng nhất גֵּר với người khách tạm thời hay một người ngoại quốc ở ngoài cộng đồng; từ này nói đến người không phải bản địa đang sống giữa Israel và thuộc phạm vi bảo hộ pháp lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ lời truyền trực tiếp cùng ngôn ngữ thân tộc của nguyên văn; thuật ngữ tư pháp được chọn sao cho rõ ràng nhưng không làm mất chiều kích đạo đức của צֶדֶק.
