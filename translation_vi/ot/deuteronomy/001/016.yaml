    rationale: Câu Hê-bơ-rơ có וּבֵין (“và giữa/với”) trước גֵּרוֹ. Dù trong thực hành pháp lý đây có thể nói đến các loại tranh chấp song phương khác nhau, bản dịch không nên biến liên kết của nguyên văn thành sự loại trừ bằng “hoặc”.
