revisions:
- from: là Đấng đi trước anh em trên đường, để tìm cho anh em một nơi đóng trại[a]. Ban đêm, Ngài ở trong lửa để chỉ cho anh em con đường phải đi[b], và ban ngày, Ngài ở trong đám mây.
  to: là Đấng đi trước anh em trên đường để tìm cho anh em chỗ để đóng trại[a], ban đêm trong lửa để chỉ cho anh em thấy con đường anh em phải đi[b], và ban ngày trong mây.
  rationale: Bản sửa bảo toàn mệnh đề phụ thuộc từ câu trước và giữ các cụm “trong lửa ban đêm”/“trong mây ban ngày” gắn với hành động đi trước, sát cấu trúc và ý nghĩa của tiếng Hê-bơ-rơ hơn. Cũng làm rõ rằng “chỗ” được tìm là chỗ để dân đóng trại, không thay đổi ý nghĩa hay thêm chi tiết “trụ lửa/trụ mây”.
  reviewer_model: gpt-5.6-terra
