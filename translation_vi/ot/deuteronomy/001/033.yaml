base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: vi
  text: là Đấng đi trước anh em trên đường để tìm cho anh em chỗ để đóng trại[a], ban đêm trong lửa để chỉ cho anh em thấy con đường anh em phải đi[b], và ban ngày trong mây.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để thăm dò cho anh em chỗ để đóng trại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “để chỉ cho anh em thấy con đường mà anh em sẽ đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: là Đấng đi
  rationale: Phân từ Qal dùng như mệnh đề quan hệ, tiếp nối chủ ngữ là CHÚA trong câu trước. “Đấng” giữ sắc thái tôn kính và cho thấy mối liên kết cú pháp ấy mà không lặp lại danh xưng không có trong câu này.
- source_word: לִפְנֵיכֶם
  choice: đi trước anh em
  rationale: Diễn đạt tự nhiên ý nghĩa không gian là đi phía trước dân để dẫn đường.
- source_word: בַּדֶּרֶךְ
  choice: trên đường
  rationale: Trong ngữ cảnh hành trình qua hoang mạc, דֶּרֶךְ chỉ con đường hoặc lộ trình dân đang đi.
- source_word: לָתוּר
  choice: để tìm
  rationale: תור mang nghĩa dò tìm, thăm dò nhằm xác định địa điểm thích hợp. “Tìm” rõ ràng và tự nhiên; chú thích bảo lưu sắc thái “thăm dò”.
- source_word: מָקוֹם
  choice: một nơi
  rationale: Cách tương đương trực tiếp và tự nhiên cho danh từ chỉ địa điểm.
- source_word: לַחֲנֹתְכֶם
  choice: cho anh em một nơi đóng trại
  rationale: 'Động từ nguyên mẫu với hậu tố ngôi thứ hai số nhiều diễn tả mục đích: tìm địa điểm để dân đóng trại.'
- source_word: בָּאֵשׁ לַיְלָה
  choice: Ban đêm, Ngài ở trong lửa
  rationale: Giữ giới từ בְּ (“trong/bằng”) và diễn tả hình thức hiện diện dẫn đường của Đức Chúa Trời. Việc thêm đại từ chủ ngữ trong tiếng Việt giúp câu tự nhiên mà không đổi đối tượng quy chiếu.
- source_word: לַרְאֹתְכֶם
  choice: để chỉ cho anh em
  rationale: Động từ nguyên mẫu Hiphil của ראה có nghĩa khiến thấy; trong ngữ cảnh dẫn đường, “chỉ cho” là cách nói tiếng Việt tự nhiên.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: con đường phải đi
  rationale: Diễn đạt chức năng chỉ dẫn của mệnh đề. Chú thích bảo lưu cấu trúc sát chữ hơn, vốn không nhất thiết chỉ nghĩa vụ đạo đức.
- source_word: וּבֶעָנָן יוֹמָם
  choice: và ban ngày, Ngài ở trong đám mây
  rationale: Đối xứng với “ban đêm... trong lửa” và chỉ đám mây quen thuộc trong hành trình hoang mạc.
theological_decisions:
- issue: Chủ thể của mệnh đề là CHÚA từ câu trước
  choice: Không lặp lại danh xưng “CHÚA”, nhưng dùng “Đấng” và “Ngài” để duy trì liên kết với câu trước.
  alternative: Thêm rõ “CHÚA, Đấng đi trước anh em...”
  rationale: Bản Hê-bơ-rơ phụ thuộc về cú pháp vào câu trước. Bản dịch giữ sự liên kết ấy, tránh thêm danh xưng vào câu 33, đồng thời vẫn rõ ràng và tự nhiên trong tiếng Việt.
- issue: Ý nghĩa của hình ảnh lửa và đám mây
  choice: Dịch trực tiếp là Ngài “ở trong lửa” ban đêm và “ở trong đám mây” ban ngày.
  alternative: Diễn giải thành “trong trụ lửa” và “trong trụ mây”.
  rationale: Nguyên văn câu này chỉ nói “lửa” và “đám mây”, không có từ “trụ”; vì vậy không đưa chi tiết quen thuộc từ các phân đoạn khác vào bản văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều khi Môi-se nói với dân; dùng “Đấng/Ngài” để tiếp nối chủ thể thần linh từ câu trước. Cấu trúc được chia thành hai câu để tránh một câu quá nặng, nhưng vẫn giữ sự song hành giữa ban đêm và ban ngày.
