source:
  edition: WLC
  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: vi
  text: Còn trẻ nhỏ của anh em[a], mà anh em đã nói sẽ trở thành chiến lợi phẩm, và con cái anh em, là những người ngày nay chưa biết điều thiện điều ác[b]—chính chúng sẽ vào đó, và Ta sẽ ban đất ấy cho chúng; chúng sẽ chiếm hữu đất ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những đứa bé của anh em” hoặc “những người lệ thuộc anh em.”'
    reason: lexical_alternative
  - marker: b
    text: “Chưa biết điều thiện điều ác” là một thành ngữ Hê-bơ-rơ chỉ việc chưa có khả năng phân định trưởng thành.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “chúng sẽ thừa hưởng đất ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: con trẻ của anh em
  rationale: טַף chỉ trẻ nhỏ hoặc những người nhỏ yếu lệ thuộc; cách dịch này phân biệt với בְנֵיכֶם ở vế sau và giữ sắc thái dễ bị tổn thương.
- source_word: לָבַז יִהְיֶה
  choice: sẽ trở thành chiến lợi phẩm
  rationale: בַּז là của cải hoặc người bị quân thù chiếm lấy; “chiến lợi phẩm” diễn đạt rõ bối cảnh chiến tranh và nỗi sợ của dân Y-sơ-ra-ên.
- source_word: בְנֵיכֶם
  choice: con cái anh em
  rationale: Dù danh từ ở dạng giống đực số nhiều, trong ngữ cảnh nó chỉ rộng đến thế hệ con cái; tiếng Việt dùng “con cái” tự nhiên và không thu hẹp hàm ý vào con trai.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: ngày nay chưa biết điều thiện điều ác
  rationale: Giữ sát thành ngữ Hê-bơ-rơ và sự mơ hồ thật của câu; “chưa” diễn tả tình trạng chưa có sự phân định trưởng thành trong hiện tại mà không áp đặt một học thuyết về trách nhiệm đạo đức.
- source_word: שָׁמָּה
  choice: vào đó
  rationale: Hậu tố chỉ hướng trong tiếng Hê-bơ-rơ cho biết chuyển động vào miền đất đang được nói tới; “vào đó” tự nhiên trong tiếng Việt.
- source_word: אֶתְּנֶנָּה
  choice: Ta sẽ ban đất ấy cho chúng
  rationale: Đại từ bổ ngữ giống cái số ít quy chiếu về miền đất; nêu rõ “đất ấy” giúp tiếng Việt minh bạch mà không thêm ý mới.
- source_word: יִירָשׁוּהָ
  choice: chúng sẽ chiếm hữu đất ấy
  rationale: ירשׁ trong ngữ cảnh này nói đến việc nhận và nắm giữ miền đất; “chiếm hữu” giữ sắc thái sở hữu thực tế, còn nghĩa “thừa hưởng” được ghi nhận ở chú thích.
theological_decisions:
- issue: Tình trạng của thế hệ trẻ trong cụm “chưa biết điều thiện điều ác”
  choice: Giữ nguyên thành ngữ như lời mô tả sự thiếu khả năng phân định trưởng thành.
  alternative: Diễn giải thành vô tội, không chịu trách nhiệm theo giao ước, hoặc chưa đến một độ tuổi chịu trách nhiệm nhất định.
  rationale: Bản văn đối lập thế hệ trưởng thành bị phán xét với con cái họ, nhưng chính thành ngữ không giải quyết các tranh luận thần học về sự vô tội hay tuổi chịu trách nhiệm.
- issue: Sắc thái của יִירָשׁוּהָ
  choice: Dịch là “chiếm hữu đất ấy”.
  alternative: “thừa hưởng đất ấy”.
  rationale: Động từ có thể bao hàm cả nhận làm cơ nghiệp lẫn nắm quyền sở hữu; bản chính giữ sắc thái chiếm hữu, đồng thời chú thích bảo tồn cách hiểu về cơ nghiệp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều ngôi thứ hai và “Ta” cho lời Đức Chúa Trời. Dấu gạch ngang làm nổi bật chủ thể được nhấn mạnh הֵמָּה; lặp “đất ấy” để các đại từ Hê-bơ-rơ có sở chỉ rõ ràng trong tiếng Việt.
