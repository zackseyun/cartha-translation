source:
  edition: WLC
  text: אֵיכָ֥ה אֶשָּׂ֖א לְ/בַדִּ֑/י טָרְחֲ/כֶ֥ם וּ/מַֽשַּׂאֲ/כֶ֖ם וְ/רִֽיבְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: vi
  text: Một mình tôi làm sao gánh nổi nỗi nhọc nhằn, gánh nặng và những vụ tranh chấp của anh em?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những cuộc cãi vã” hoặc “những vụ kiện tụng của anh em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: làm sao ... nổi
  rationale: Diễn đạt tự nhiên câu hỏi tu từ mang ý khó có thể hoặc không thể đảm đương.
- source_word: אֶשָּׂא
  choice: gánh
  rationale: Động từ נשׂא ở đây chỉ việc mang lấy trách nhiệm; “gánh” phù hợp với cả các danh từ trừu tượng theo sau.
- source_word: לְבַדִּי
  choice: một mình tôi
  rationale: Giữ trọng tâm nhấn mạnh rằng Môi-se không thể đơn độc đảm trách mọi việc.
- source_word: טָרְחֲכֶם
  choice: nỗi nhọc nhằn
  rationale: טֹרַח chỉ sự phiền nhọc, lao lực hoặc gánh nặng gây mệt mỏi; cách dịch này phân biệt với מַשָּׂא kế tiếp.
- source_word: מַשַּׂאֲכֶם
  choice: gánh nặng
  rationale: Chuyển tải nghĩa thông dụng của מַשָּׂא là vật nặng hay gánh nặng, ở đây được dùng theo nghĩa trách nhiệm đè nặng.
- source_word: רִיבְכֶם
  choice: những vụ tranh chấp
  rationale: רִיב có thể chỉ sự tranh cãi, xung đột hoặc vụ kiện; “vụ tranh chấp” giữ được cả sắc thái liên cá nhân lẫn pháp lý trong bối cảnh xét xử.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để chỉ cộng đồng được Môi-se trực tiếp nói với; cấu trúc “làm sao ... nổi” bảo toàn sức nặng của câu hỏi tu từ.
