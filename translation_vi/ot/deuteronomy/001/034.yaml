id: DEU.1.34
reference: Deuteronomy 1:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה אֶת ק֣וֹל דִּבְרֵי/כֶ֑ם וַ/יִּקְצֹ֖ף וַ/יִּשָּׁבַ֥ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: vi
  text: 'Yahweh nghe lời anh em nói[a], nổi giận và thề rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa tiếng Hê-bơ-rơ: “tiếng của những lời anh em.”'
    reason: Giữ lại thành ngữ קוֹל דִּבְרֵיכֶם của nguyên văn, vốn sẽ thiếu tự nhiên nếu dịch sát từng chữ trong phần chính.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên tên riêng giao ước của Đức Chúa Trời bằng dạng chuyển tự thông dụng “Yahweh”, thay vì thay bằng một tước hiệu.
- source_word: וַיִּשְׁמַע
  choice: nghe
  rationale: Trong mạch tường thuật này, שׁמע diễn tả trực tiếp việc nghe; “nghe” tự nhiên và không hàm ý thêm sắc thái vâng theo.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: lời anh em nói
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt đúng điều Yahweh nghe. Thành ngữ Hê-bơ-rơ sát chữ được giữ trong chú thích để bảo toàn hình ảnh nguyên ngữ.
- source_word: וַיִּקְצֹף
  choice: nổi giận
  rationale: קצף chỉ cơn giận dữ; “nổi giận” vừa tự nhiên vừa thể hiện diễn tiến của câu chuyện.
- source_word: וַיִּשָּׁבַע
  choice: thề
  rationale: Dạng Niphal của שׁבע có nghĩa là thề hoặc lập lời thề; “thề” ngắn gọn, rõ ràng, và nội dung lời thề theo sau.
- source_word: לֵאמֹר
  choice: rằng
  rationale: “Rằng” tự nhiên dẫn vào lời nói trực tiếp trong câu kế tiếp, tương ứng với chức năng dẫn lời của לֵאמֹר.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Dạng “Yahweh” bảo toàn tư cách tên riêng, không thay thế bằng tước hiệu và không áp đặt một truyền thống hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho hậu tố ngôi thứ hai số nhiều, phù hợp lời Môi-se nói với cộng đồng Israel; dấu hai chấm cho thấy lời thề được trình bày ở câu kế tiếp.
