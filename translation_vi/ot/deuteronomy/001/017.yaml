  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: vi
  text: Khi xét xử, anh em không được thiên vị[a]; phải lắng nghe người thấp kém cũng như người quyền thế. Anh em không được sợ bất cứ ai, vì việc xét xử thuộc về Đức Chúa Trời. Còn vụ việc nào quá khó đối với anh em, hãy trình lên tôi, và tôi sẽ nghe vụ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “nhận biết khuôn mặt khi xét xử”, một thành ngữ có nghĩa là thiên vị hoặc đối xử ưu ái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: thiên vị
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “nhận biết khuôn mặt”, nhưng trong bối cảnh tư pháp chỉ việc đối xử thiên lệch vì thân thế hay địa vị. “Thiên vị” tự nhiên, rõ nghĩa và giữ được sức nặng pháp lý–đạo đức.
- source_word: בַּמִּשְׁפָּט
  choice: khi xét xử
  rationale: Ở đây מִשְׁפָּט nói đến hoạt động phân xử các vụ việc, không chỉ khái niệm công lý trừu tượng. “Khi xét xử” phù hợp văn cảnh và tự nhiên trong tiếng Việt.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: người thấp kém cũng như người quyền thế
  rationale: Cặp “nhỏ–lớn” chỉ sự tương phản về địa vị xã hội. Cách dịch này chuyển tải ý nghĩa trong tiếng Việt hiện đại mà không hiểu thành vóc dáng hay tuổi tác.
- source_word: תִּשְׁמָעוּן
  choice: phải lắng nghe
  rationale: Trong bối cảnh pháp đình, שׁמע là nghe người liên quan hoặc nghe vụ kiện. “Lắng nghe” diễn đạt việc dành cho cả hai phía một sự tiếp nhận công bằng mà không thêm ý “phán quyết” vốn không nằm trực tiếp trong động từ.
- source_word: לֹא תָגוּרוּ מִפְּנֵי אִישׁ
  choice: không được sợ bất cứ ai
  rationale: 'Mệnh lệnh cấm các thẩm phán co lại vì sợ một người. Cách nói này trực tiếp, tự nhiên và giữ nguyên lý do được nêu tiếp theo: quyền xét xử thuộc về Đức Chúa Trời.'
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: vì việc xét xử thuộc về Đức Chúa Trời
  rationale: Cấu trúc לֵאלֹהִים diễn tả sự thuộc về hoặc thẩm quyền. “Việc xét xử” giữ trọng tâm ở chức năng tư pháp, còn “thuộc về Đức Chúa Trời” bảo toàn khẳng định thần học ngắn gọn của nguyên văn.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: vụ việc nào quá khó đối với anh em
  rationale: דָּבָר trong văn cảnh này là một vấn đề hay vụ kiện cần phân xử; “vụ việc” rõ hơn “lời”. Thành ngữ יִקְשֶׁה מִכֶּם chỉ điều vượt quá khả năng giải quyết của các thẩm phán.
- source_word: תַּקְרִבוּן אֵלַי
  choice: hãy đưa đến cho tôi
  rationale: Thể Hiphil của קרב có nghĩa đem lại gần hoặc trình lên. “Đưa đến cho tôi” tự nhiên trong thủ tục chuyển vụ việc lên Môi-se.
- source_word: וּשְׁמַעְתִּיו
  choice: và tôi sẽ nghe vụ ấy
  rationale: Hậu tố số ít giống đực phù hợp về ngữ pháp với הַדָּבָר, “vụ việc”. Dịch “nghe vụ ấy” duy trì sự lặp lại có chủ ý của động từ שׁמע và không diễn giải quá mức thành “phán quyết”.
theological_decisions:
- issue: Cơ sở của thẩm quyền xét xử trong câu כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: Giữ nguyên lời khẳng định rằng việc xét xử thuộc về Đức Chúa Trời.
  alternative: Diễn giải rằng Đức Chúa Trời sẽ xét xử các thẩm phán, hoặc rằng luật được áp dụng là luật của Đức Chúa Trời.
  rationale: Nguyên văn trực tiếp quy việc xét xử cho Đức Chúa Trời nhưng không giải thích chính xác mối quan hệ ấy theo nghĩa trách nhiệm giải trình, nguồn luật hay sự ủy quyền. Bản dịch giữ nguyên độ mở thần học này.
- issue: Phạm vi của danh từ số ít אִישׁ
  choice: Dịch theo nghĩa khái quát là “bất cứ ai”.
  alternative: Dịch sát hình thức giống đực là “bất cứ người đàn ông nào”.
  rationale: Trong câu phủ định, אִישׁ mang lực bất định khái quát, không giới hạn mệnh lệnh vào người nam. Tiếng Việt dùng “bất cứ ai” là cách tự nhiên và chính xác về nghĩa.
- issue: Ý nghĩa tư pháp của שׁמע
  choice: Giữ hình ảnh “nghe” ở cả mệnh lệnh dành cho các thẩm phán và lời của Môi-se.
  alternative: Diễn giải thành “xét xử” hoặc “phán quyết”.
  rationale: Trong ngữ cảnh, “nghe” bao hàm việc tiếp nhận vụ kiện, nhưng nguyên văn không dùng một động từ riêng có nghĩa là ra phán quyết. Việc giữ “nghe” tránh giải quyết quá mức trình tự tư pháp được nói đến.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. “Anh em” biểu thị đối tượng số nhiều mà Môi-se đang căn dặn; “người thấp kém” và “người quyền thế” làm rõ sự tương phản địa vị xã hội của cặp từ “nhỏ–lớn”. Dùng “Đức Chúa Trời” cho אֱלֹהִים theo lối gọi trang trọng, phổ thông trong tiếng Việt Kinh Thánh.
