  terminology: “Thiên vị”, “xét xử”, “vụ việc”, và “Đức Chúa Trời” nhất quán với văn cảnh pháp lý và thuật ngữ Kinh Thánh tiếng Việt. Giữ “nghe” thay vì diễn giải là “phán quyết” là phù hợp với động từ שׁמע.
