  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung phản ánh chính xác các mệnh lệnh tư pháp trong tiếng Hê-bơ-rơ: không thiên vị, nghe người nhỏ cũng như người lớn, không sợ hãi trước bất cứ ai, vì sự xét xử thuộc về Đức Chúa Trời, và trình những vụ việc quá khó lên Môi-se. Tuy nhiên, chú thích [b] nêu một khả năng quy chiếu cho hậu tố trong וּשְׁמַעְתִּיו mà văn cảnh không thực sự đặt thành một điểm mơ hồ cần chuyển tải: tiền ngữ trực tiếp là הַדָּבָר (“vụ việc/matter”), và cách dịch “tôi sẽ nghe vụ ấy” là đủ.'
