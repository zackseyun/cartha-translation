source:
  edition: WLC
  text: אָנָ֣ה אֲנַ֣חְנוּ עֹלִ֗ים אַחֵי/נוּ֩ הֵמַ֨סּוּ אֶת לְבָבֵ֜/נוּ לֵ/אמֹ֗ר עַ֣ם גָּד֤וֹל וָ/רָם֙ מִמֶּ֔/נּוּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצוּרֹ֖ת בַּ/שָּׁמָ֑יִם וְ/גַם בְּנֵ֥י עֲנָקִ֖ים רָאִ֥ינוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: vi
  text: 'Chúng ta đang đi lên đâu vậy? Anh em chúng ta đã làm lòng chúng ta tan chảy[a], rằng: ‘Dân ấy lớn mạnh và cao lớn hơn chúng ta; các thành thì lớn và kiên cố tận trời[b]; hơn nữa, chúng ta đã thấy con cháu A-na-kim[c] ở đó.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa là: “đã làm chúng ta nản lòng, mất hết can đảm.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “kiên cố tận trời”, một cách nói cường điệu về những thành lũy cực kỳ cao.'
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “người A-na-kim” hoặc “hậu duệ của A-nác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: Chúng ta đang đi lên đâu vậy?
  rationale: Giữ ý hỏi về đích đến và động từ chuyển động ‘đi lên’, đồng thời dùng trật tự câu hỏi tự nhiên trong tiếng Việt.
- source_word: אַחֵינוּ
  choice: Anh em chúng ta
  rationale: Giữ cách gọi thân tộc giống đực số nhiều của nguyên văn; trong ngữ cảnh, chỉ những người đồng bào Y-sơ-ra-ên.
- source_word: הֵמַסּוּ אֶת־לְבָבֵנוּ
  choice: đã làm lòng chúng ta tan chảy
  rationale: Bảo tồn hình ảnh sống động của thành ngữ Hê-bơ-rơ, diễn tả sự mất can đảm; chú thích nêu nghĩa hàm ý.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: Dân ấy đông và cao lớn hơn chúng ta
  rationale: Trong ngữ cảnh do thám và đối chiếu với dân Y-sơ-ra-ên, גָּדוֹל có thể nói đến quy mô/số lượng, còn רָם nhấn mạnh tầm vóc cao lớn.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: các thành thì lớn và kiên cố tận trời
  rationale: Giữ tính chất cường điệu của nguyên văn ‘kiên cố trong/tận trời’, thay vì giản lược thành ‘rất cao’.
- source_word: וְגַם
  choice: hơn nữa
  rationale: Thể hiện sức cộng dồn của một chi tiết đáng sợ bổ sung trong lời tường thuật.
- source_word: בְּנֵי עֲנָקִים
  choice: con cháu A-na-kim
  rationale: Dịch בְּנֵי theo nghĩa hậu duệ/con cháu và phiên âm tên nhóm người עֲנָקִים, tránh áp đặt cách hiểu về bản chất của họ.
- source_word: רָאִינוּ שָׁם
  choice: chúng ta đã thấy ... ở đó
  rationale: Thì quá khứ tự nhiên trong tiếng Việt, phù hợp với lời thuật lại chuyến do thám.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Giữ hình ảnh ‘lòng tan chảy’ và lối nói cường điệu ‘kiên cố tận trời’ của nguyên văn; dùng ‘A-na-kim’ làm phiên âm danh xưng dân tộc và giải thích các cách dịch khác trong chú thích.
