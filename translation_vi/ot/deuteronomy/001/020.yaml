source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: vi
  text: 'Tôi nói với anh em: “Anh em đã đến miền núi của người A-mô-rít[a], là nơi Yahweh, Đức Chúa Trời của chúng ta, đang ban cho chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “núi của người A-mô-rít.” Từ Hê-bơ-rơ có thể chỉ một ngọn núi hoặc, theo nghĩa rộng hơn, một miền đồi núi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: Tôi nói với anh em
  rationale: Động từ wayyiqtol tiếp nối mạch thuật chuyện. “Anh em” diễn đạt tự nhiên đại từ ngôi hai số nhiều trong lời Môi-se nói với dân chúng.
- source_word: בָּאתֶם עַד
  choice: anh em đã đến
  rationale: Dạng hoàn thành của בוא cùng עַד cho biết họ đã tới điểm đích; “đã đến” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: הַר הָאֱמֹרִי
  choice: miền núi của người A-mô-rít
  rationale: הַר ở đây có thể chỉ vùng địa hình đồi núi chứ không nhất thiết một ngọn núi riêng lẻ; danh từ chỉ dân tộc ở số ít mang nghĩa tập thể.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, Đức Chúa Trời của chúng ta
  rationale: Giữ tên riêng giao ước Yahweh và dịch trực tiếp hậu tố sở hữu ngôi thứ nhất số nhiều.
- source_word: נֹתֵן לָנוּ
  choice: đang ban cho chúng ta
  rationale: Phân từ diễn tả hành động đang diễn ra hoặc sắp được thực hiện; “đang ban” giữ sắc thái hiện thời, còn “cho chúng ta” thể hiện đối tượng tiếp nhận.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi hai số nhiều trong diễn từ của Môi-se; dùng “miền núi” để diễn đạt địa danh tự nhiên, đồng thời giữ phương án hẹp hơn trong chú thích.
