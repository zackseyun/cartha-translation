language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: יְהוָ֧ה אֱלֹהֵ֛י/נוּ דִּבֶּ֥ר אֵלֵ֖י/נוּ בְּ/חֹרֵ֣ב לֵ/אמֹ֑ר רַב לָ/כֶ֥ם שֶׁ֖בֶת בָּ/הָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: vi
  text: 'Yahweh, Đức Chúa Trời của chúng ta, đã phán với chúng ta tại Hô-rếp[a]: “Các ngươi đã ở tại núi này đủ lâu rồi.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: Hô-rếp, tên được dùng ở đây cho ngọn núi cũng gắn với Si-nai.'
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “Đủ rồi; các ngươi đừng ở tại núi này nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ đúng danh xưng trực tiếp trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Dù אֱלֹהִים có hình thức số nhiều, ngữ cảnh chỉ Đức Chúa Trời của Israel ở số ít; hậu tố ngôi thứ nhất số nhiều mang nghĩa “của chúng ta”.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: đã phán với chúng ta
  rationale: דבר diễn tả hành động nói; “phán” phù hợp với lời Đức Chúa Trời trong văn phong Kinh Thánh trang trọng, còn אֶל chỉ hướng lời nói đến người nghe.
- source_word: בְּחֹרֵב
  choice: tại Hô-rếp
  rationale: ב mang nghĩa địa điểm; giữ nguyên địa danh Hô-rếp của bản Hê-bơ-rơ, không đồng nhất hóa trong chính văn với Si-nai.
- source_word: לֵאמֹר
  choice: dấu hai chấm trước lời trực tiếp
  rationale: Công thức dẫn lời Hê-bơ-rơ được diễn đạt tự nhiên trong tiếng Việt bằng dấu hai chấm, không cần dịch máy móc là “rằng” hay “mà phán rằng”.
- source_word: רַב לָכֶם שֶׁבֶת
  choice: Các ngươi đã ở ... đủ lâu rồi
  rationale: Thành ngữ רַב לָכֶם kết hợp với שֶׁבֶת biểu thị thời gian cư trú đã đủ hoặc quá lâu; cách diễn đạt này tự nhiên và vẫn giữ sắc thái chấm dứt việc lưu lại.
- source_word: בָּהָר הַזֶּה
  choice: tại núi này
  rationale: הַר là “núi”; giới từ ב trong ngữ cảnh nơi đóng trại được diễn đạt tự nhiên là “tại”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Bản nguồn dùng trực tiếp Tứ Tự Danh; phiên âm “Yahweh” bảo tồn danh riêng và không thay bằng tước hiệu.
- issue: Sắc thái của רַב לָכֶם שֶׁבֶת
  choice: đã ở tại núi này đủ lâu rồi
  alternative: Đủ rồi; các ngươi đừng ở tại núi này nữa
  rationale: Cách chọn giữ ý nghĩa thông thường về thời gian lưu lại đã đủ lâu, đồng thời chú thích khả năng hiểu cấu trúc như một lời tuyên bố mạnh hơn rằng họ không nên lưu lại nữa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời của Đức Chúa Trời và “các ngươi” để phản ánh lời trực tiếp nói với toàn thể Israel. Dấu câu thay thế tự nhiên cho công thức לֵאמֹר; mọi dấu chú thích đều có mặt trong chính văn.
