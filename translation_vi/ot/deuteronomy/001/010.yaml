id: DEU.1.10
reference: Deuteronomy 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהֵי/כֶ֖ם הִרְבָּ֣ה אֶתְ/כֶ֑ם וְ/הִנְּ/כֶ֣ם הַ/יּ֔וֹם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: vi
  text: Yahweh, Đức Chúa Trời của anh em, đã làm cho anh em gia tăng; và kìa, hôm nay anh em đông như các ngôi sao trên trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “như các ngôi sao trên trời về số đông.”'
    reason: Giữ lại khả năng diễn đạt sát cấu trúc לָרֹב, trong khi chính văn dùng cách nói tiếng Việt tự nhiên hơn.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu, qua đó giữ nguyên chức năng giao ước của Danh trong câu Hê-bơ-rơ.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Trong ngữ cảnh giao ước, אֱלֹהִים mang nghĩa số ít là “Đức Chúa Trời”; hậu tố ngôi thứ hai số nhiều được diễn đạt là “của anh em”.
- source_word: הִרְבָּה אֶתְכֶם
  choice: đã làm cho anh em gia tăng
  rationale: Dạng Hiphil của רבה mang nghĩa nguyên nhân “làm cho gia tăng/làm nên đông đảo”. Cách dịch này giữ lực của động từ và tự nhiên trong tiếng Việt.
- source_word: וְהִנְכֶם
  choice: và kìa
  rationale: Giữ chức năng chỉ xuất, thu hút sự chú ý của הִנֵּה cùng sắc thái tu từ của lời Môi-se.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Diễn đạt trực tiếp ý nghĩa thời gian và tính tức thời của nguyên văn.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: đông như các ngôi sao trên trời
  rationale: Diễn đạt tự nhiên phép so sánh cùng ý chỉ số lượng rất đông; “trên trời” là cách nói tiếng Việt thông dụng tương ứng với thành ngữ Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự danh. Giữ “Yahweh” bảo tồn danh riêng trong văn bản, không thay bằng tước hiệu và không áp đặt một truyền thống giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện đối tượng được nói với ở ngôi thứ hai số nhiều; “kìa” được giữ để bảo tồn điểm nhấn tu từ của nguyên văn.
