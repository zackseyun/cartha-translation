  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: vi
  text: Từ Hô-rếp, theo đường núi Sê-i-rơ, đến Ca-đe Ba-nê-a mất mười một ngày đường.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là mười một ngày.” Thành ngữ Hê-bơ-rơ cho biết thời gian đi từ Hô-rếp đến Ca-đe Ba-nê-a theo tuyến đường này.'
    reason: lexical_alternative
  - marker: b
    text: Bản Hê-bơ-rơ tại đây dùng tên Hô-rếp; địa danh này thường được liên hệ với Si-na-i.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: mất mười một ngày đường
  rationale: Cụm Hê-bơ-rơ không có động từ và diễn tả thời gian hoặc quãng đường hành trình. Cách nói “mất mười một ngày đường” tự nhiên trong tiếng Việt, đồng thời giữ rõ ý về thời gian di chuyển.
- source_word: מֵחֹרֵב
  choice: từ Hô-rếp
  rationale: Giữ nguyên địa danh חֹרֵב bằng lối phiên âm quen thuộc trong tiếng Việt, thay vì thay bằng Si-na-i.
- source_word: דֶּרֶךְ הַר שֵׂעִיר
  choice: theo đường núi Sê-i-rơ
  rationale: דֶּרֶךְ chỉ đường hoặc tuyến đường; הַר có thể chỉ núi hay vùng núi. Cách dịch này tự nhiên và vẫn để ngỏ mức độ chính xác về địa hình.
- source_word: עַד
  choice: đến
  rationale: Trong ngữ cảnh địa lý, עַד đánh dấu điểm cuối của hành trình; “đến” là tương đương tự nhiên nhất.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Ca-đe Ba-nê-a
  rationale: Phiên âm địa danh kép sang tiếng Việt, không diễn giải hay đồng nhất với một địa danh khác.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngày đường” để diễn đạt thành ngữ chỉ thời gian hành trình; giữ Hô-rếp trong chính văn và chỉ nêu mối liên hệ với Si-na-i ở chú thích.
