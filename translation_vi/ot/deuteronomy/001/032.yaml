base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/032.yaml
  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: vi
  text: Nhưng trong việc này, anh em đã không tin cậy Giê-hô-va, Đức Chúa Trời của anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh em đã không tin Giê-hô-va, Đức Chúa Trời của anh em,” hoặc “anh em đã không tin nơi Giê-hô-va, Đức Chúa Trời của anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: Nhưng trong việc này
  rationale: דָּבָר ở đây chỉ sự việc vừa được thuật lại, không đơn thuần là một lời nói. וּ trong ngữ cảnh quở trách mang sắc thái tương phản nhẹ, nên dịch tự nhiên là “Nhưng”.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: anh em đã không tin cậy
  rationale: Cấu trúc phủ định với phân từ Hiphil của אמן diễn tả thái độ không tin kéo dài trong tình huống được kể. “Tin cậy” chuyển tải được cả ý tin và phó thác mà cấu trúc אמן + ב có thể hàm chứa.
- source_word: בַּ/יהוָה
  choice: Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn; giới từ ב được thể hiện tự nhiên trong tiếng Việt qua động từ “tin cậy”, không cần thêm giới từ.
- source_word: אֱלֹהֵי/כֶם
  choice: Đức Chúa Trời của anh em
  rationale: Dịch trực tiếp cấu trúc sở hữu với hậu tố ngôi thứ hai số nhiều, giữ trọng tâm về mối quan hệ giao ước.
theological_decisions:
- issue: Ý nghĩa của אמן + ב khi đối tượng là יהוה
  choice: tin cậy Giê-hô-va, Đức Chúa Trời của anh em
  alternative: tin Giê-hô-va, Đức Chúa Trời của anh em; tin nơi Giê-hô-va, Đức Chúa Trời của anh em
  rationale: Cấu trúc Hê-bơ-rơ có thể nói đến việc tin lời một người hoặc đặt lòng tin nơi người ấy. “Tin cậy” phù hợp ngữ cảnh về việc dân không nương dựa vào lời hứa và sự chăm sóc của Đức Chúa Trời, trong khi chú thích bảo lưu các cách hiểu khả hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều trong lời Môi-se nói trực tiếp với dân; dùng “việc này” để quy chiếu tự nhiên đến sự việc vừa kể.
