  source_fidelity: Bản dịch phản ánh đúng וּבַּדָּבָר הַזֶּה theo nghĩa chuyển ý tương phản nhẹ (“Nhưng trong việc này”), và chuyển אֵינְכֶם מַאֲמִינִם trong bối cảnh tường thuật bằng quá khứ tự nhiên (“đã không tin cậy”). “Tin cậy” diễn đạt phù hợp sắc thái của אמן với ב khi đối tượng là Đức Chúa Trời, mà không thu hẹp ý nghĩa vào chỉ tin một mệnh đề. “Giê-hô-va, Đức Chúa Trời của anh em” bảo toàn danh YHWH và cấu trúc sở hữu của אֱלֹהֵיכֶם.
