  terminology: “Giê-hô-va” là dạng phiên âm Việt ngữ quen thuộc cho יהוה; “Đức Chúa Trời” diễn đạt tự nhiên אֱלֹהִים trong văn phong Kinh Thánh Việt ngữ. Chú thích bảo lưu hai khả năng ngữ nghĩa chính của אמן + ב. Không có neo chú thích hoặc thuật ngữ nào cần điều chỉnh.
