base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: vi
  text: 'Anh em đã than phiền trong các lều của anh em và nói: “Vì Yahweh ghét chúng ta[a], Ngài đã đưa chúng ta ra khỏi đất Ai Cập để phó chúng ta vào tay dân A-mô-rít[b], để tiêu diệt chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa tiếng Hê-bơ-rơ: “trong sự căm ghét của Yahweh đối với chúng ta”; cụm từ này mang nghĩa nguyên nhân: “Vì Yahweh ghét chúng ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phó chúng ta vào quyền lực của dân A-mô-rít”; tiếng Hê-bơ-rơ sát nghĩa là “trao chúng ta vào tay người A-mô-rít”, trong đó danh từ số ít được dùng theo nghĩa tập thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: anh em đã lẩm bẩm
  rationale: Động từ רגן diễn tả việc than phiền, oán trách bằng lời lẩm bẩm. “Lẩm bẩm” là cách nói tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái nói nhỏ đầy bất mãn.
- source_word: בְאָהֳלֵיכֶם
  choice: trong lều mình
  rationale: Cụm từ chỉ địa điểm một cách cụ thể. “Lều mình” tự nhiên trong lời Môi-se trực tiếp nói với cộng đồng và vẫn giữ bối cảnh dân Israel sống trong lều.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: Vì Yahweh ghét chúng ta
  rationale: Giới từ בְּ đi với danh từ trừu tượng “sự căm ghét” mang nghĩa nguyên nhân trong ngữ cảnh này. Cách dịch thành mệnh đề dùng động từ vừa rõ ràng vừa bảo toàn lời cáo buộc của dân Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: Ngài đã đưa chúng ta ra khỏi đất Ai Cập
  rationale: Phản ánh đầy đủ động từ xuất hành và cụm từ “đất Ai Cập”; đại từ “Ngài” phù hợp với văn phong trang trọng hiện đại.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: để trao chúng ta vào tay dân A-mô-rít
  rationale: Giữ hình ảnh thành ngữ “vào tay”, nghĩa là đặt dưới quyền lực của đối phương. Danh từ số ít הָאֱמֹרִי được hiểu theo nghĩa tập thể nên dịch là “dân A-mô-rít”.
- source_word: לְהַשְׁמִידֵנוּ
  choice: mà tiêu diệt chúng ta
  rationale: Động từ Hiphil của שׁמד chỉ sự hủy diệt. “Tiêu diệt” truyền đạt đúng mức độ mạnh của từ mà không diễn giải thêm.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo toàn đây là danh riêng, không thay bằng tước hiệu; không thêm cách hiểu hệ phái.
- issue: Lời cáo buộc rằng Yahweh ghét Israel
  choice: 'Giữ nguyên dưới dạng lời trích dẫn của dân Israel: “Vì Yahweh ghét chúng ta”'
  alternative: Diễn giải giảm nhẹ như “Chúng ta tưởng rằng Yahweh ghét mình”
  rationale: Câu này thuật lại chính lời dân Israel nói trong lúc oán trách, không xác nhận lời ấy là đánh giá đúng về động cơ của Yahweh. Bản dịch không giảm nhẹ hay sửa lời cáo buộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Anh em” thể hiện lời Môi-se nói trực tiếp với cộng đồng; “lẩm bẩm” giữ sắc thái bất mãn kín đáo; “trao vào tay” bảo toàn hình ảnh Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
