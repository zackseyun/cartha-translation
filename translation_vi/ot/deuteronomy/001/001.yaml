  text: אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל כָּל יִשְׂרָאֵ֔ל בְּ/עֵ֖בֶר הַ/יַּרְדֵּ֑ן בַּ/מִּדְבָּ֡ר בָּֽ/עֲרָבָה֩ מ֨וֹל ס֜וּף בֵּֽין פָּארָ֧ן וּ/בֵֽין תֹּ֛פֶל וְ/לָבָ֥ן וַ/חֲצֵרֹ֖ת וְ/דִ֥י זָהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: vi
  text: Đây là những lời Môi-se đã nói với toàn thể Y-sơ-ra-ên ở bên kia sông Giô-đanh[a], trong hoang mạc, tại A-ra-ba[b], đối diện Su-phơ[c], giữa Pha-ran, Tô-phên, La-ban, Hát-xê-rốt và Đi-xa-háp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phía bên kia sông Giô-đanh” hoặc “bên đối diện sông Giô-đanh”. Cụm từ Hê-bơ-rơ có thể được hiểu theo những điểm nhìn địa lý khác nhau.
    reason: lexical_alternative
  - marker: b
    text: “A-ra-ba” là tên gọi địa lý của vùng trũng hoặc đồng bằng thuộc hệ thống thung lũng tách giãn; theo truyền thống cũng có thể dịch là “đồng bằng”.
    reason: cultural_note
  - marker: c
    text: Nguyên văn Hê-bơ-rơ là “Suph”. Có người hiểu đây là một địa danh; người khác liên hệ từ này với “Biển Sậy”, nhưng trong câu này không có từ “biển”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Đây là những lời
  rationale: Cách mở đầu tự nhiên trong tiếng Việt, giữ sắc thái giới thiệu của אֵלֶּה và nghĩa “lời” của דְּבָרִים trong ngữ cảnh Môi-se phát biểu.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: Môi-se đã nói
  rationale: Diễn đạt trực tiếp mệnh đề quan hệ và động từ דִּבֶּר; “đã nói” tự nhiên, trang trọng vừa phải và phù hợp với lời diễn giảng.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: với toàn thể Y-sơ-ra-ên
  rationale: “Toàn thể” thể hiện tính bao quát của כָּל đối với cộng đồng Y-sơ-ra-ên; “nói với” là kết hợp từ tự nhiên trong tiếng Việt.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ở bên kia sông Giô-đanh
  rationale: Giữ cách chỉ vùng đất phía bên kia sông nhưng không xác định tuyệt đối điểm nhìn; thêm “sông” để độc giả phổ thông nhận biết địa danh tự nhiên hơn.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, thưa dân, không nhất thiết là sa mạc cát; “hoang mạc” phù hợp văn phong Kinh Thánh hiện đại.
- source_word: בָּעֲרָבָה
  choice: tại A-ra-ba
  rationale: Giữ nguyên như một tên vùng địa lý thay vì thu hẹp thành danh từ chung “đồng bằng”; dùng “tại” để câu tiếng Việt rõ và tự nhiên.
- source_word: מוֹל סוּף
  choice: đối diện Su-phơ
  rationale: מוֹל là “đối diện”; סוּף đứng một mình, không có יַם “biển”, nên được phiên âm như địa danh và không diễn giải thành “Biển Sậy”.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: giữa Pha-ran, Tô-phên, La-ban, Hát-xê-rốt và Đi-xa-háp
  rationale: Danh sách dùng dấu phẩy và liên từ cuối theo cú pháp tiếng Việt tự nhiên, đồng thời giữ đủ các địa danh và quan hệ “giữa” của nguyên văn.
- source_word: דִי זָהָב
  choice: Đi-xa-háp
  rationale: Đây là địa danh nên được phiên âm, không dịch theo nghĩa từ nguyên liên quan đến vàng.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Phiên âm các địa danh theo lối có gạch nối quen thuộc trong bản văn Kinh Thánh tiếng Việt. Trật tự các cụm địa lý được giữ gần nguyên văn, còn danh sách địa danh được làm trôi chảy theo cú pháp tiếng Việt.
