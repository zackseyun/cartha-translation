  yaml_path: translation/ot/deuteronomy/001/029.yaml
  text: Then I said to you, ‘Do not be terrified of them, and do not fear them.’
translation:
  language: vi
  text: 'Bấy giờ tôi nói với anh em: “Đừng kinh hãi, cũng đừng sợ chúng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעַרְצוּן
  choice: kinh hãi
  rationale: Động từ ערץ diễn tả sự khiếp đảm hoặc kinh hãi trước mối đe dọa; “kinh hãi” vừa tự nhiên vừa phân biệt được với động từ “sợ” ở vế kế tiếp.
- source_word: תִירְאוּן
  choice: sợ
  rationale: Động từ ירא ở đây mang nghĩa thông thường là sợ; cách dịch ngắn gọn giữ nguyên phép song hành tăng cường của câu Hê-bơ-rơ.
- source_word: מֵהֶם
  choice: chúng
  rationale: Giới từ מן với đại từ số nhiều chỉ đối tượng gây sợ hãi; “sợ chúng” là cách diễn đạt tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh nói về các dân đối địch.
- source_word: וָאֹמַר אֲלֵכֶם
  choice: Bấy giờ tôi nói với anh em
  rationale: “Bấy giờ” thể hiện mạch kể tiếp diễn của waw; “anh em” phù hợp với lời Môi-se ngỏ cùng cộng đồng Israel và giữ sắc thái trang trọng, gần gũi.
