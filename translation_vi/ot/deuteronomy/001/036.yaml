revisions:
- from: Ngoại trừ Ca-lép, con trai Giê-phu-nê. Chính ông sẽ thấy xứ ấy; Ta sẽ ban cho ông và các con trai ông[a] miền đất mà ông đã đặt chân lên, vì ông đã hết lòng đi theo Yahweh.
  to: Ngoại trừ Ca-lép, con trai Giê-phu-nê; chính ông sẽ thấy xứ ấy. Ta sẽ ban cho ông miền đất mà ông đã đặt chân lên, và ban cho các con trai ông[a], vì ông đã hết lòng đi theo Yahweh.
  rationale: 'Bản sửa chỉ điều chỉnh dấu câu và trật tự các thành phần trong câu để phản ánh rõ hơn cấu trúc: đất Ca-lép đã đặt chân lên được hứa ban cho ông, và lời ban cũng mở rộng cho các con trai ông. Không thay đổi nghĩa, mức độ nhấn mạnh, tên riêng, hay thuật ngữ thần học.'
  reviewer_model: gpt-5.6-terra
