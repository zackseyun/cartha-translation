source:
  edition: WLC
  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: vi
  text: Ngoại trừ Ca-lép, con trai Giê-phu-nê; chính ông sẽ thấy xứ ấy. Ta sẽ ban cho ông miền đất mà ông đã đặt chân lên, và ban cho các con trai ông[a], vì ông đã hết lòng đi theo Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các con ông” hoặc “dòng dõi ông”; tiếng Hê-bơ-rơ viết là “các con trai ông.”
    reason: Nêu các khả năng về phạm vi nghĩa của בָנָיו trong ngữ cảnh thừa kế, đồng thời cho biết nghĩa hình thức của nguyên văn.
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: ngoại trừ
  rationale: Giới thiệu trường hợp ngoại lệ đối với phán quyết ở câu trước; cách diễn đạt này tự nhiên và giữ được sự liên kết cú pháp với văn cảnh.
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: Ca-lép, con trai Giê-phu-nê
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt và diễn đạt quan hệ phụ tử rõ ràng.
- source_word: ה֣וּא יִרְאֶ֔נָּה
  choice: Chính ông sẽ thấy xứ ấy
  rationale: Đại từ הוּא mang sắc thái nhấn mạnh; hậu tố giống cái của động từ chỉ về הָאָרֶץ, tức “xứ/đất”.
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: Ta sẽ ban cho ông
  rationale: Giữ ngôi thứ nhất của lời Đức Chúa Trời và sắc thái lời hứa; “ban” phù hợp văn phong trang trọng mà vẫn tự nhiên.
- source_word: אֶת הָאָ֛רֶץ
  choice: miền đất
  rationale: Trong mệnh đề này, הָאָרֶץ chỉ phần đất cụ thể Ca-lép đã đi qua; “miền đất” tự nhiên trong tiếng Việt và không thu hẹp hơn nguyên văn.
- source_word: אֲשֶׁ֥ר דָּֽרַךְ בָּ֖הּ
  choice: mà ông đã đặt chân lên
  rationale: Chuyển tải hình ảnh cụ thể của động từ דרך, “giẫm/bước trên,” bằng một thành ngữ tiếng Việt hiện đại.
- source_word: וּלְבָנָ֑יו
  choice: và các con trai ông
  rationale: Giữ đúng danh từ giống đực số nhiều בנים; chú thích nêu khả năng hiểu rộng hơn theo ngữ cảnh thừa kế.
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: vì
  rationale: Diễn đạt ngắn gọn và tự nhiên quan hệ nguyên nhân của liên từ kép.
- source_word: מִלֵּ֖א אַחֲרֵ֥י
  choice: đã hết lòng đi theo
  rationale: Đây là thành ngữ chỉ việc theo một cách trọn vẹn, trung thành; “hết lòng đi theo” giữ được cả mức độ trọn vẹn lẫn ý niệm theo sau.
- source_word: יְהוָֽה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước của Đức Chúa Trời, thay vì thay bằng một danh xưng.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Phạm vi nghĩa của בָנָיו
  choice: các con trai ông
  alternative: các con ông; dòng dõi ông
  rationale: Hình thức Hê-bơ-rơ nói rõ “các con trai của ông.” Bản chính giữ nghĩa hình thức này, còn chú thích ghi nhận khả năng từ ngữ chỉ con cái hoặc hậu duệ rộng hơn trong ngữ cảnh thừa kế.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ông” dùng cho Ca-lép; “Ta” giữ giọng nói trực tiếp của Đức Chúa Trời. Cụm mở đầu “Ngoại trừ…” cố ý giữ sự phụ thuộc vào câu trước, thay vì bổ sung chủ ngữ không có trong câu Hê-bơ-rơ.
