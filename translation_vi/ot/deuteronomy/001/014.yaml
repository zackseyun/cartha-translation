- from: 'Anh em đáp lời tôi rằng: “Điều ông đã nói, chúng tôi làm theo là tốt.”'
  to: 'Anh em đáp lời tôi rằng: “Điều ông đã nói là điều tốt mà chúng tôi nên làm.”'
  rationale: Chỉnh riêng mệnh đề cuối để phản ánh rõ hơn cấu trúc ‘điều ông đã nói’ + ‘tốt để [chúng tôi] thực hiện’, với tiếng Việt hiện đại tự nhiên. Không cần chú thích vì không có biến thể hay mơ hồ văn bản đáng kể cần bảo lưu.
