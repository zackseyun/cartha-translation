base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: vi
  text: Giô-suê, con trai của Nun, là người đang đứng trước mặt con; chính người ấy sẽ vào đó. Hãy làm cho người ấy vững mạnh, vì người sẽ khiến Y-sơ-ra-ên nhận đất ấy làm cơ nghiệp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người sẽ ban đất ấy cho Y-sơ-ra-ên làm cơ nghiệp” hoặc “người sẽ chia đất ấy cho Y-sơ-ra-ên làm cơ nghiệp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Giô-suê, con trai của Nun
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt; diễn đạt quan hệ phụ tử rõ ràng và tự nhiên.
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: là người đang đứng trước mặt con
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ thay vì diễn giải thành “phục vụ con”; thể phân từ được thể hiện bằng “đang đứng”.
- source_word: הוּא יָבֹא שָׁמָּה
  choice: chính người ấy sẽ vào đó
  rationale: “Chính người ấy” thể hiện đại từ nhấn mạnh הוּא; “vào đó” giữ hướng chuyển động vào miền đất đã được nhắc đến.
- source_word: אֹתוֹ חַזֵּק
  choice: Hãy làm cho người mạnh mẽ
  rationale: Giữ nghĩa rộng của חזק, bao gồm củng cố, khích lệ và làm vững mạnh, mà không thu hẹp chỉ vào cảm xúc.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho mệnh lệnh đứng trước một cách tự nhiên trong tiếng Việt.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: người sẽ khiến Y-sơ-ra-ên nhận đất ấy làm cơ nghiệp
  rationale: Thể Hiphil của נחל mang nghĩa khiến cho nhận làm cơ nghiệp hoặc phân chia làm cơ nghiệp; “đất ấy” làm rõ đại từ giống cái chỉ về miền đất trong ngữ cảnh.
theological_decisions:
- issue: Sở chỉ của hậu tố giống cái trong יַנְחִלֶנָּה
  choice: Dịch rõ là “đất ấy”, chỉ miền đất được hứa cho Y-sơ-ra-ên.
  alternative: 'Có thể để hàm ẩn: “người sẽ khiến Y-sơ-ra-ên nhận cơ nghiệp”, hoặc dịch “người sẽ chia đất ấy cho Y-sơ-ra-ên làm cơ nghiệp”.'
  rationale: Ngữ cảnh trực tiếp nói về việc vào và chiếm hữu miền đất; nêu “đất ấy” chỉ làm rõ sở chỉ của đại từ Hê-bơ-rơ, không thêm một khẳng định thần học mới.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ đại từ “con” vì lời Đức Chúa Trời trực tiếp phán với Môi-se; dùng “người” cho Giô-suê để tránh sắc thái suồng sã. Dấu chấm phẩy giúp bảo toàn quan hệ giữa mệnh đề nhận diện và lời tiên báo.
