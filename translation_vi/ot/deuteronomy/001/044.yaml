- from: Bấy giờ, dân A-mô-rít sống trong vùng đồi núi ấy kéo ra đón đánh anh em và đuổi theo anh em như đàn ong[a]. Chúng đánh tan anh em tại Sê-i-r, cho đến Họt-ma.
