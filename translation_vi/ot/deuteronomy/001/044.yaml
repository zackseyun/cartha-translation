base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: vi
  text: Bấy giờ, dân A-mô-rít sống trong vùng đồi núi ấy kéo ra đối đầu với anh em và đuổi theo anh em như ong làm vậy. Họ đánh bại anh em tại Sê-i-r, cho đến Họt-ma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: kéo ra
  rationale: Trong ngữ cảnh quân sự, יצא mô tả việc đối phương từ nơi cư trú tiến ra; “kéo ra” tự nhiên trong tiếng Việt và hàm ý một lực lượng xuất quân.
- source_word: הָאֱמֹרִי
  choice: dân A-mô-rít
  rationale: Danh từ tiếng Hê-bơ-rơ ở số ít nhưng mang nghĩa tập hợp, được xác nhận bởi các động từ số nhiều theo sau; “dân A-mô-rít” giữ được sắc thái tập thể.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: sống trong vùng đồi núi ấy
  rationale: Phân từ יֹשֵׁב chỉ sự cư trú; הָר ở đây hợp lý nhất khi hiểu theo nghĩa địa vực là vùng đồi núi, thay vì một ngọn núi riêng lẻ.
- source_word: לִקְרַאתְכֶם
  choice: đón đánh anh em
  rationale: לִקְרַאת nghĩa đen là đi ra gặp; trong bối cảnh thù địch, “đón đánh” diễn đạt tự nhiên mục đích đối đầu mà không thêm chi tiết chiến thuật.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: đuổi theo anh em
  rationale: רדף là động từ thông dụng chỉ việc truy đuổi; cách dịch này rõ ràng và phù hợp văn cảnh quân sự.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: như đàn ong
  rationale: Cụm gốc có nghĩa sát là “như loài ong làm”; tiếng Việt tự nhiên diễn đạt hình ảnh tập thể bằng “như đàn ong”, giữ nguyên phép so sánh sống động.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: đánh tan anh em
  rationale: כתת dạng Hiphil diễn tả việc đập, nghiền hoặc đánh bại dữ dội; “đánh tan” truyền đạt một thất bại quân sự nặng nề mà không nhất thiết khẳng định tất cả đều bị giết.
- source_word: בְּשֵׂעִיר
  choice: tại Sê-i-r
  rationale: Giới từ ב đánh dấu địa điểm hoặc phạm vi; “tại” giữ nghĩa địa điểm mà không buộc phải hiểu toàn bộ diễn biến chỉ nằm bên trong một ranh giới xác định.
- source_word: עַד חָרְמָה
  choice: cho đến Họt-ma
  rationale: עַד chỉ giới hạn địa lý của cuộc truy kích và đánh bại; “cho đến” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “anh em” cho đại từ ngôi thứ hai số nhiều trong lời Môi-se nói với cộng đồng Ít-ra-ên; dùng dạng phiên âm địa danh và dân danh quen thuộc trong tiếng Việt. Chỉ giữ một chú thích cần thiết cho cách diễn đạt thành ngữ về đàn ong.
