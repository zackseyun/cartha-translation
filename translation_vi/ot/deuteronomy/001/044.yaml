  rationale: Điều chỉnh các chỗ diễn giải vượt quá từ ngữ nguồn, đồng thời giữ nguyên ý nghĩa quân sự, phép so sánh với ong, đại từ cộng đồng “anh em,” và các dạng tên riêng hiện có. Chú thích cũ không còn cần thiết vì bản văn đã dịch rõ cấu trúc ‘như ong làm vậy’.
