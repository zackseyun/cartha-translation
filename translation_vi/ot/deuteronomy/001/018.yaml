  text: And at that time I commanded you all the things that you should do[a].
translation:
  language: vi
  text: Vào lúc ấy, tôi đã truyền cho anh em mọi điều anh em phải làm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi lời” hoặc “mọi sự việc”; từ Hê-bơ-rơ דְּבָרִים có thể chỉ lời chỉ dạy hoặc những việc cần thực hiện.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: tôi truyền
  rationale: Động từ צוה mang nghĩa ra lệnh hoặc truyền dạy với thẩm quyền; “truyền” giữ được sắc thái ấy trong văn phong Kinh Thánh tự nhiên.
- source_word: אֶתְכֶם
  choice: anh em
  rationale: Đại từ ngôi thứ hai số nhiều, chỉ cộng đồng Israel; “anh em” thể hiện rõ số nhiều và phù hợp lời Môi-se trực tiếp nói với dân.
- source_word: בָּעֵת הַהִוא
  choice: vào lúc ấy
  rationale: Cách diễn đạt thời gian tự nhiên, trang trọng và sát với cụm Hê-bơ-rơ.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: mọi điều
  rationale: דְּבָרִים có thể là lời nói, sự việc hoặc vấn đề; trong ngữ cảnh các chỉ thị cần thi hành, “mọi điều” vừa tự nhiên vừa không thu hẹp nghĩa quá mức.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: anh em phải làm
  rationale: Thể chưa hoàn thành ngôi thứ hai số nhiều trong mệnh đề sau động từ “truyền” diễn tả nội dung có tính nghĩa vụ; “phải làm” truyền đạt rõ lực mệnh lệnh mà không thêm nội dung.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để biểu thị rõ đối tượng số nhiều và “tôi” cho lời kể trực tiếp của Môi-se; giữ chú thích nhằm bảo tồn phạm vi nghĩa của דְּבָרִים.
