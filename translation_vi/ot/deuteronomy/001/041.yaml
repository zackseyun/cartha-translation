  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: vi
  text: 'Bấy giờ, anh em đáp lời tôi rằng: “Chúng tôi đã phạm tội chống lại Yahweh. Chính chúng tôi sẽ đi lên chiến đấu, đúng theo mọi điều Yahweh, Đức Chúa Trời của chúng tôi, đã truyền cho chúng tôi.” Sau đó, mỗi người trong anh em đều đeo vũ khí chiến đấu của mình, rồi anh em liều lĩnh[a] đi lên miền đồi núi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây rất hiếm, có thể diễn đạt là “liều lĩnh đi lên” hoặc “tự phụ đi lên”; từ này hàm ý hành động tự tin quá mức và thiếu suy xét.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “ngọn núi”; trong văn cảnh này, từ ấy có lẽ chỉ rộng hơn đến miền đồi núi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: anh em đáp lời tôi rằng
  rationale: Diễn đạt tự nhiên lời đáp của dân chúng với Môi-se, đồng thời giữ cả ý ‘đáp’ và động từ dẫn lời.
- source_word: חָטָאנוּ לַיהוָה
  choice: Chúng tôi đã phạm tội với Yahweh
  rationale: Giới từ ל đánh dấu Đấng bị xúc phạm; ‘phạm tội với’ là cách nói rõ ràng, tự nhiên trong tiếng Việt.
- source_word: נַעֲלֶה וְנִלְחַמְנוּ
  choice: sẽ đi lên chiến đấu
  rationale: Giữ ý chuyển động hướng lên của עלה và nghĩa tham chiến của לחם.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: đúng theo mọi điều ... đã truyền cho chúng tôi
  rationale: Giữ sắc thái làm phù hợp với toàn bộ mệnh lệnh, kể cả từ ‘mọi’.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: mỗi người trong anh em thắt vũ khí chiến đấu vào mình
  rationale: ‘Mỗi người’ thể hiện cách dùng số ít phân phối אִישׁ; ‘thắt ... vào mình’ truyền đạt hành động mang trang bị mà không xác định quá mức loại vũ khí.
- source_word: וַתָּהִינוּ
  choice: đã cả gan
  rationale: Động từ hiếm này mang sắc thái hành động liều lĩnh, tự tin quá mức; ‘cả gan’ giữ sắc thái tiêu cực mà vẫn tự nhiên trong tiếng Việt.
- source_word: לַעֲלֹת הָהָרָה
  choice: đi lên miền đồi núi
  rationale: Giữ hướng chuyển động và hiểu הָהָר trong văn cảnh theo nghĩa vùng cao nguyên/đồi núi, thay vì nhất thiết là một ngọn núi riêng lẻ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong bản Hê-bơ-rơ thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tetragrammaton; ‘Yahweh’ bảo tồn danh riêng và tránh biến danh ấy thành một tước hiệu.
- issue: Sắc thái của וַתָּהִינוּ trong việc dân Y-sơ-ra-ên đi lên
  choice: đã cả gan đi lên
  alternative: đã liều lĩnh đi lên; đã quyết chí đi lên
  rationale: Văn cảnh kế tiếp cho thấy đây là hành động bất tuân và tự tin quá mức. Bản dịch giữ sắc thái chê trách, đồng thời chú thích tính hiếm và phạm vi nghĩa của từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ ‘anh em’ thích hợp với lời Môi-se trực tiếp nói với cộng đồng; ‘chúng tôi’ giữ nguyên lời tự nhận của dân chúng. Dấu chú thích được đặt ngay sau cụm từ liên quan, sửa sự lệch vị trí thấy trong lớp tham khảo tiếng Anh.
