revisions:
- from: 'Bấy giờ, anh em đáp lời tôi rằng: “Chúng tôi đã phạm tội với Yahweh. Chính chúng tôi sẽ đi lên chiến đấu, đúng theo mọi điều Yahweh, Đức Chúa Trời của chúng tôi, đã truyền cho chúng tôi.” Rồi mỗi người trong anh em thắt vũ khí chiến đấu vào mình, và anh em đã cả gan đi lên miền đồi núi.[a][b]'
