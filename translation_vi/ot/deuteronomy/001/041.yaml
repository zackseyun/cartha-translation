  rationale: Sửa các cụm chưa tự nhiên và đặt lại cả hai ký hiệu chú thích ngay tại từ/cụm từ mà chúng giải thích. Bản sửa vẫn giữ chuyển động “đi lên”, tính phân phối của “mỗi người”, sắc thái chê trách nhưng không cường điệu của động từ hiếm, và tính dè dặt của chú thích địa hình.
