base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/023.yaml
  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: vi
  text: Việc ấy đẹp lòng tôi[a], nên tôi chọn từ giữa anh em mười hai người đàn ông, mỗi bộ tộc một người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đề nghị ấy làm tôi hài lòng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: đẹp lòng tôi
  rationale: Cách nói này diễn đạt tự nhiên ý đề nghị được Môi-se xem là tốt và chấp thuận, đồng thời phản ánh thành ngữ Hê-bơ-rơ ‘tốt trong mắt tôi’ mà không dịch cứng.
- source_word: הַדָּבָר
  choice: việc ấy
  rationale: Trong ngữ cảnh, danh từ chỉ điều hoặc đề nghị vừa được nêu. ‘Việc ấy’ giữ phạm vi nghĩa rộng và liên kết tự nhiên với câu trước.
- source_word: וָאֶקַּח
  choice: tôi chọn
  rationale: Động từ có nghĩa cơ bản là ‘lấy’, nhưng trong ngữ cảnh Môi-se lấy ra những người từ cộng đồng để thi hành nhiệm vụ; ‘chọn’ truyền đạt đúng hành động trong tiếng Việt tự nhiên.
- source_word: מִכֶּם
  choice: từ giữa anh em
  rationale: Giới từ chỉ những người được lấy ra từ trong chính cộng đồng đang được Môi-se nói với. ‘Từ giữa anh em’ thể hiện rõ ý nguồn và thành phần của nhóm.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: mười hai người đàn ông
  rationale: Cụm Hê-bơ-rơ chỉ rõ mười hai người nam trưởng thành; bản dịch giữ thông tin giới tính thay vì dùng từ trung tính.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: mỗi bộ tộc một người
  rationale: 'Cấu trúc mang ý phân phối: một người đại diện cho từng bộ tộc. Cách diễn đạt này ngắn gọn, rõ ràng và tự nhiên trong tiếng Việt.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘anh em’ để chuyển lời Môi-se trực tiếp nói với cộng đồng Y-sơ-ra-ên; dùng ‘bộ tộc’ cho שֵׁבֶט. Dấu chú thích [a] được đặt ngay sau cụm từ tương ứng.
