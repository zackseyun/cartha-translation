  to: Yahweh, Đức Chúa Trời của anh em, là Đấng đi trước anh em; chính Ngài sẽ chiến đấu cho anh em, đúng như mọi việc Ngài đã làm cho anh em[a] tại Ai Cập, ngay trước mắt anh em.
