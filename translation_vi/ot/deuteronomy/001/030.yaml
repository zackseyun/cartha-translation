base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: vi
  text: Yahweh, Đức Chúa Trời của anh em, là Đấng đi trước anh em; chính Ngài sẽ chiến đấu cho anh em, đúng như mọi việc Ngài đã làm cho anh em[a] tại Ai Cập, ngay trước mắt anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “đã làm với anh em”; trong ngữ cảnh, cụm từ nói đến những việc Yahweh đã làm vì lợi ích của Israel tại Ai Cập.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ nguyên tên riêng giao ước Yahweh và diễn đạt אֱלֹהֵיכֶם theo nghĩa số ít là Đức Chúa Trời của cộng đồng Israel.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: Đấng đi trước anh em
  rationale: Phân từ diễn tả hành động đang tiếp diễn hoặc đặc trưng; cách nói này tự nhiên, trang trọng và giữ hình ảnh Đức Chúa Trời dẫn đường.
- source_word: הוּא יִלָּחֵם לָכֶם
  choice: chính Ngài sẽ chiến đấu cho anh em
  rationale: Đại từ độc lập הוּא mang tính nhấn mạnh; “chính Ngài” thể hiện rằng Yahweh đích thân chiến đấu vì Israel.
- source_word: כְּכֹל אֲשֶׁר
  choice: như mọi điều
  rationale: Giữ cả ý so sánh lẫn sắc thái bao quát của כֹּל, thay vì rút gọn chỉ còn “như”.
- source_word: עָשָׂה אִתְּכֶם
  choice: Ngài đã làm cho anh em
  rationale: Trong ngữ cảnh, cụm từ chỉ những việc Yahweh thực hiện vì lợi ích của Israel; “làm cho anh em” là tiếng Việt tự nhiên, còn nghĩa sát chữ “làm với anh em” được ghi ở chú thích.
- source_word: בְּמִצְרַיִם לְעֵינֵיכֶם
  choice: tại Ai Cập, ngay trước mắt anh em
  rationale: “Tại Ai Cập” diễn đạt địa điểm; “ngay trước mắt anh em” giữ thành ngữ nhấn mạnh rằng Israel đã tận mắt chứng kiến.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn chức năng danh riêng thay vì thay bằng một tước hiệu.
- issue: Tác nhân được nhấn mạnh trong lời hứa chiến đấu
  choice: chính Ngài
  alternative: Ngài
  rationale: Giữ lực nhấn mạnh của đại từ độc lập הוּא mà không thêm diễn giải thần học ngoài văn bản.
- issue: Quan hệ trong עָשָׂה אִתְּכֶם
  choice: làm cho anh em
  alternative: làm với anh em
  rationale: Ngữ cảnh nghiêng về hành động có lợi cho Israel, nhưng giới từ אֵת cho phép cách đọc sát chữ “với”; chú thích bảo tồn sắc thái từ vựng này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ ngôi hai số nhiều khi Môi-se nói với cộng đồng Israel; tránh lối xưng hô cổ “các ngươi”. Tên Yahweh được giữ ở dạng phiên âm.
