language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: vi
  text: Hãy xem[a], Ta đã đặt xứ này trước mặt anh em. Hãy vào chiếm hữu xứ mà Yahweh đã thề ban cho tổ phụ anh em—Áp-ra-ham, Y-sác và Gia-cốp—cùng dòng dõi họ về sau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy nhìn” hoặc “Kìa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “hạt giống của họ sau họ”; ở đây chỉ dòng dõi của các tổ phụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Hãy xem
  rationale: Mệnh lệnh số ít dùng để nhấn mạnh và kêu gọi chú ý; cách dịch này giữ lực trực tiếp của nguyên văn mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: Ta đã đặt ... trước mặt anh em
  rationale: Trong kết cấu với לִפְנֵי, נתן mang ý đặt một điều trước mặt ai, đồng thời thể hoàn thành diễn tả xứ ấy nay đã được trao sẵn cho dân.
- source_word: הָאָרֶץ
  choice: xứ này / xứ
  rationale: Trong ngữ cảnh, từ này chỉ miền đất đã hứa. “Xứ” trang trọng, dễ hiểu và phù hợp với ngữ cảnh địa lý-giao ước.
- source_word: בֹּאוּ
  choice: Hãy vào
  rationale: Mệnh lệnh số nhiều chỉ việc tiến vào xứ; “vào” tự nhiên hơn cách dịch máy móc là “đến”.
- source_word: וּרְשׁוּ
  choice: chiếm hữu
  rationale: ירשׁ ở đây bao hàm việc tiến vào và nhận quyền sở hữu xứ; “chiếm hữu” giữ sắc thái chủ động mà không loại bỏ ý nhận cơ nghiệp.
- source_word: נִשְׁבַּע יְהוָה
  choice: Yahweh đã thề
  rationale: Giữ trực tiếp danh giao ước יהוה và diễn đạt hành động thề trong quá khứ bằng cấu trúc tiếng Việt tự nhiên.
- source_word: לַאֲבֹתֵיכֶם
  choice: với tổ phụ anh em
  rationale: “Tổ phụ” giữ quy chiếu giống đực và phù hợp với phần giải thích ngay sau đó là Áp-ra-ham, Y-sác và Gia-cốp.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: với Áp-ra-ham, với Y-sác và với Gia-cốp
  rationale: Lặp lại “với” phản ánh nhịp và sự nhấn mạnh của ba giới từ לְ trong tiếng Hê-bơ-rơ.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: rằng Ngài sẽ ban cho họ và dòng dõi họ về sau
  rationale: “Dòng dõi” diễn đạt tự nhiên danh từ tập hợp זרע; “về sau” giữ ý hậu thế đến sau các tổ phụ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng giao ước; phiên âm “Yahweh” phân biệt danh này với tước hiệu “Chúa” mà không gán thêm cách hiểu hệ phái.
- issue: Phạm vi của אֲבֹתֵיכֶם
  choice: tổ phụ anh em
  alternative: tổ tiên anh em
  rationale: Câu kế tiếp xác định cụ thể Áp-ra-ham, Y-sác và Gia-cốp, nên “tổ phụ” chính xác hơn và giữ quy chiếu nam giới của nguyên văn.
- issue: Sắc thái của ירשׁ
  choice: chiếm hữu
  alternative: thừa hưởng / sở hữu
  rationale: Động từ có thể bao gồm cả nhận cơ nghiệp lẫn thực sự tiến vào nắm giữ. “Chiếm hữu” giữ căng thẳng giữa lời ban của Đức Chúa Trời và hành động dân phải thực hiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ta” cho lời Đức Chúa Trời được Môi-se trích dẫn và “anh em” cho đại từ số nhiều hướng đến cộng đồng; mệnh lệnh mở đầu רְאֵה là số ít nhưng tiếng Việt không đánh dấu số ở “hãy xem”, nhờ đó giữ được sự mơ hồ hình thức tự nhiên.
