  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố chính: mốc thời gian בָּעֵת הַהִוא (“Lúc ấy”), lời Môi-se nói với cộng đồng, sự bất lực “không thể”, ý độc lực của לְבַדִּי (“Một mình tôi”), và động từ שְׂאֵת theo hình ảnh gánh/mang. Cấu trúc “rằng:” dẫn lời trực tiếp diễn đạt tự nhiên chức năng của לֵאמֹר; không cần lặp lại máy móc “nói rằng”.'
