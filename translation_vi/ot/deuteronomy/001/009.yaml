  text: וָ/אֹמַ֣ר אֲלֵ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר לֹא אוּכַ֥ל לְ/בַדִּ֖/י שְׂאֵ֥ת אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: vi
  text: 'Lúc ấy, tôi đã nói với anh em rằng: “Một mình tôi không thể gánh vác anh em.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Lúc ấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ nguyên ý chỉ thời điểm của cụm Hê-bơ-rơ.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dấu hiệu dẫn lời trực tiếp được thể hiện tự nhiên bằng “rằng” và dấu hai chấm; tránh lối dịch cứng “mà rằng”.
- source_word: לֹא אוּכַל
  choice: tôi không thể
  rationale: Phản ánh trực tiếp sự bất lực được nêu bởi động từ יכל.
- source_word: לְבַדִּי
  choice: Một mình tôi
  rationale: Đưa lên đầu câu trích dẫn để nhấn đúng ý ‘chỉ riêng tôi’, đồng thời giữ câu tiếng Việt tự nhiên.
- source_word: שְׂאֵת אֶתְכֶם
  choice: gánh vác anh em
  rationale: Giữ hình ảnh ‘mang/gánh’ của נשׂא, trong ngữ cảnh là đảm đương trách nhiệm lãnh đạo và xử lý công việc của dân.
theological_decisions:
- issue: Phạm vi của hình ảnh ‘gánh’
  choice: gánh vác anh em
  alternative: đảm đương công việc của anh em
  rationale: Bản dịch giữ hình ảnh nguyên văn và không thu hẹp ý sang riêng việc xét xử hay quản trị; ngữ cảnh kế tiếp sẽ làm rõ trách nhiệm liên quan.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải. Dùng “anh em” cho đối tượng số nhiều mà Môi-se trực tiếp nói với cộng đồng; cấu trúc dẫn lời đã được Việt hóa nhưng không làm mất nội dung của לֵאמֹר.
