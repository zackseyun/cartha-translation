    rationale: פְּנוּ là «quay/đổi hướng» trong chuỗi chuẩn bị lên đường, không khẳng định việc trở lại nơi cũ. «Quay lại» trong cách dùng hiện đại dễ thêm sắc thái không có trong nguồn.
