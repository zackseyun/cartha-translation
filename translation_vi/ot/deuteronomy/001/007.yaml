  text: פְּנ֣וּ וּ/סְע֣וּ לָ/כֶ֗ם וּ/בֹ֨אוּ הַ֥ר הָֽ/אֱמֹרִי֮ וְ/אֶל כָּל שְׁכֵנָי/ו֒ בָּ/עֲרָבָ֥ה בָ/הָ֛ר וּ/בַ/שְּׁפֵלָ֥ה וּ/בַ/נֶּ֖גֶב וּ/בְ/ח֣וֹף הַ/יָּ֑ם אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ/לְּבָנ֔וֹן עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: vi
  text: 'Hãy đổi hướng, lên đường và đi đến miền đồi núi của người A-mô-rít cùng tất cả các vùng lân cận: vùng A-ra-ba, miền đồi núi, miền chân đồi[a], vùng Nê-ghép và miền duyên hải—tức xứ của người Ca-na-an—cũng như Li-băng, cho đến sông lớn là sông Ơ-phơ-rát.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “miền đất thấp” hoặc dùng tên riêng “Sê-phê-la”; đây là vùng chân đồi thấp ở phía tây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ וּסְעוּ לָכֶם
  choice: Hãy quay lại, lên đường
  rationale: פּנה truyền đạt sự đổi hướng, còn נסע trong bối cảnh hành trình là nhổ trại/khởi hành. Tiếng Việt không cần dịch tách לָכֶם theo nghĩa phản thân vì ở đây đó là thành ngữ.
- source_word: וּבֹאוּ
  choice: và đi đến
  rationale: בוא có thể là “đến, vào”; trong chuỗi mệnh lệnh hướng dân chúng tới một đích, “đi đến” tự nhiên và vẫn giữ ý đạt tới nơi ấy.
- source_word: הַר הָאֱמֹרִי
  choice: miền đồi núi của người A-mô-rít
  rationale: הַר tại đây chỉ một vùng cao nguyên/đồi núi chứ không phải một ngọn núi riêng lẻ; danh từ dân tộc được hiểu theo nghĩa tập thể.
- source_word: שְׁכֵנָיו
  choice: tất cả các vùng lân cận
  rationale: Dạng chữ là “những kẻ/vùng lân cận của nó/người ấy”; trong mô tả địa lý, “các vùng lân cận” tự nhiên hơn và không buộc phải nhân cách hóa miền đồi núi.
- source_word: בָּעֲרָבָה
  choice: vùng A-ra-ba
  rationale: עֲרָבָה ở đây là tên địa lý của vùng trũng kéo dài dọc thung lũng Giô-đanh và về phía nam, nên phiên âm giữ được tính chuyên biệt.
- source_word: בָהָר
  choice: miền đồi núi
  rationale: Chỉ địa hình vùng cao, không nhất thiết là một ngọn núi.
- source_word: וּבַשְּׁפֵלָה
  choice: miền chân đồi
  rationale: שְׁפֵלָה chỉ vùng đất thấp/chân đồi phía tây; “miền chân đồi” vừa dễ hiểu vừa phân biệt với A-ra-ba.
- source_word: וּבַנֶּגֶב
  choice: vùng Nê-ghép
  rationale: Trong danh sách các miền địa lý, נֶגֶב là tên vùng phía nam hơn là chỉ phương “nam” nói chung.
- source_word: וּבְחוֹף הַיָּם
  choice: miền duyên hải
  rationale: Diễn đạt tự nhiên ý bờ biển/vùng ven biển của חוֹף הַיָּם.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: xứ của người Ca-na-an
  rationale: Danh từ dân tộc số ít mang nghĩa tập thể; cách dịch này giữ quan hệ lãnh thổ mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְהַלְּבָנוֹן
  choice: cũng như Li-băng
  rationale: Giữ địa danh riêng; “cũng như” làm rõ đây là một mục tiếp theo trong phạm vi được nêu.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: cho đến sông lớn là sông Ơ-phơ-rát
  rationale: Giữ cả danh xưng mô tả “sông lớn” và tên xác định “sông Ơ-phơ-rát”.
