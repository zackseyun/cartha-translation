revisions:
- from: 'Hãy quay lại, lên đường và đi đến miền đồi núi của người A-mô-rít cùng tất cả các vùng lân cận: vùng A-ra-ba, miền đồi núi, miền chân đồi[a], vùng Nê-ghép và miền duyên hải—tức xứ của người Ca-na-an—cũng như Li-băng, cho đến sông lớn là sông Ơ-phơ-rát.'
  to: 'Hãy đổi hướng, lên đường và đi đến miền đồi núi của người A-mô-rít cùng tất cả các vùng lân cận: vùng A-ra-ba, miền đồi núi, miền chân đồi[a], vùng Nê-ghép và miền duyên hải—tức xứ của người Ca-na-an—cũng như Li-băng, cho đến sông lớn là sông Ơ-phơ-rát.'
