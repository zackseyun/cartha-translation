translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Các địa danh được phiên âm theo lối Việt hóa; cấu trúc liệt kê được làm rõ bằng dấu hai chấm và gạch ngang nhưng không giải quyết quá mức quan hệ cú pháp vốn có thể hiểu “xứ của người Ca-na-an” là phần đồng vị hoặc phần bao quát của các vùng vừa kể.
