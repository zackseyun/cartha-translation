source:
  edition: WLC
  text: וְ/לֹ֥א אֲבִיתֶ֖ם לַ/עֲלֹ֑ת וַ/תַּמְר֕וּ אֶת פִּ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: vi
  text: Nhưng anh em không muốn đi lên, mà đã nổi loạn chống lại lệnh truyền[a] của Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “nổi loạn chống lại miệng của Yahweh, Đức Chúa Trời của anh em”; đây là một thành ngữ chỉ việc chống lại lời phán hoặc lệnh truyền của Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Nhưng ... không
  rationale: Liên từ tiếp nối câu chuyện nhưng tạo thế tương phản với lời khích lệ ở phần trước; “Nhưng” diễn đạt tự nhiên sắc thái đối lập này.
- source_word: אֲבִיתֶם
  choice: anh em không muốn
  rationale: Động từ אָבָה nói đến sự bằng lòng hay ưng thuận; cấu trúc phủ định giữ rõ sắc thái ý chí mà không diễn giải quá mức thành một hành động khác.
- source_word: לַעֲלֹת
  choice: đi lên
  rationale: Giữ nghĩa phương hướng thông thường của עָלָה và phù hợp với việc tiến lên vùng đất cao.
- source_word: וַתַּמְרוּ
  choice: đã nổi loạn chống lại
  rationale: מָרָה diễn tả sự phản nghịch hoặc bất tuân đối với thẩm quyền; cách dịch này giữ được sức nặng của từ gốc.
- source_word: אֶת־פִּי
  choice: lệnh truyền
  rationale: Nghĩa đen là “miệng”, nhưng trong thành ngữ này chỉ điều được chính Đức Chúa Trời phán truyền. “Lệnh truyền” truyền đạt tự nhiên cả lời nói lẫn thẩm quyền.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: 'Danh từ đi cùng Yahweh và hậu tố ngôi hai số nhiều, vì vậy mang nghĩa số ít: Đức Chúa Trời của cộng đồng Israel.'
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; giữ danh riêng tránh thay thế bằng một tước hiệu.
- issue: Thành ngữ “nổi loạn chống lại miệng” của Yahweh
  choice: nổi loạn chống lại lệnh truyền
  alternative: nổi loạn chống lại miệng
  rationale: “Miệng” là hoán dụ chỉ lời phán có thẩm quyền. Dịch theo nghĩa thành ngữ giúp câu tiếng Việt rõ ràng, còn chú thích bảo lưu hình ảnh nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” diễn đạt đại từ ngôi hai số nhiều hướng đến cộng đồng Israel; cấu trúc “không muốn… mà đã nổi loạn” giữ cả sắc thái ý chí lẫn mức độ phản nghịch của nguyên văn.
