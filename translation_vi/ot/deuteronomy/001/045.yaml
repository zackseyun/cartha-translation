    issue: Cách chuyển danh יהוה không nhất quán với quy ước POB.
    rationale: Hồ sơ nguồn và audit trail quy định יהוה được chuyển là “Yahweh”. “Đức Giê-hô-va” là một cách gọi truyền thống, nhưng không theo quyết định thuật ngữ được cung cấp cho bản dịch này.
  - severity: low
    issue: “Cũng chẳng để tâm đến anh em” làm rộng nghĩa động từ הֶאֱזִין.
    rationale: הֶאֱזִין thuộc trường nghĩa nghe, ghé tai, lắng nghe chăm chú. “Không lắng nghe anh em” bảo tồn sát hơn phép song song với “không nghe tiếng anh em” mà vẫn tự nhiên.
