  text: וַ/תָּשֻׁ֥בוּ וַ/תִּבְכּ֖וּ לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא שָׁמַ֤ע יְהוָה֙ בְּ/קֹ֣לְ/כֶ֔ם וְ/לֹ֥א הֶאֱזִ֖ין אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: vi
  text: Rồi anh em trở về và khóc trước mặt Yahweh[a], nhưng Yahweh không nghe tiếng anh em, cũng không lắng nghe anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yahweh là cách chuyển danh Hê-bơ-rơ יהוה (YHWH). Cũng có thể dịch: “Yahweh không lắng nghe tiếng anh em, cũng không ghé tai nghe anh em.” Hai động từ gần nghĩa nhấn mạnh rằng Yahweh đã không đáp lại lời kêu xin của họ.'
    reason: divine_name_and_lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: Rồi anh em trở về
  rationale: Động từ שׁוּב chỉ việc trở lại hoặc quay về; trong mạch kể này, “trở về” diễn tả tự nhiên việc dân chúng quay lại sau cuộc tiến đánh thất bại. “Rồi” thể hiện diễn tiến tự sự.
- source_word: וַתִּבְכּוּ
  choice: và khóc
  rationale: בכה có nghĩa là khóc, than khóc; “khóc” giữ sắc thái trang trọng mà không thêm mức độ đau đớn không được nêu rõ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: לִפְנֵי nghĩa là ở trước mặt hoặc trong sự hiện diện của; “trước mặt” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng đã quen thuộc và trang trọng trong tiếng Việt để thể hiện trực tiếp danh giao ước יהוה, thay vì thay bằng một tước hiệu.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: nhưng Đức Giê-hô-va không nghe tiếng anh em
  rationale: שׁמע với בְּקוֹל có thể chỉ nghe, lắng nghe hoặc đáp lại. “Không nghe tiếng” bảo tồn hình ảnh nguyên văn và để ngỏ sắc thái không nhậm lời; “nhưng” diễn tả sự tương phản với việc họ khóc trước mặt Ngài.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: cũng chẳng để tâm đến anh em
  rationale: האזין chỉ việc ghé tai, chăm chú nghe. “Để tâm đến” chuyển tải vế song song tăng cường bằng tiếng Việt hiện đại, tránh lặp máy móc động từ “nghe”.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. “Đức Giê-hô-va” giữ tính chất tên riêng trong lối văn tiếng Việt trang trọng, thay vì biến danh này thành tước hiệu; chú thích nêu dạng phục nguyên thường dùng là Yahweh.
- issue: Ý nghĩa việc Đức Giê-hô-va không nghe
  choice: Giữ cách nói “không nghe… cũng chẳng để tâm”
  alternative: không nhậm lời anh em
  rationale: Nguyên văn dùng hai động từ gần nghĩa về nghe/chú ý. Không diễn giải thành một kết luận thần học rộng hơn; cách dịch bảo tồn phép song song và hàm ý rằng Ngài không đáp lại lời than khóc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp với lời Môi-se nói cùng toàn thể Y-sơ-ra-ên. Giữ cấu trúc song song của hai động từ chỉ sự nghe, nhưng diễn đạt vế thứ hai tự nhiên trong tiếng Việt.
