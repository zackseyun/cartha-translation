  source_fidelity: Bản dịch diễn đạt đúng trình tự tự sự, hành động trở về và khóc, cùng hai vế song song phủ định về việc nghe/chú ý. Tuy nhiên, “để tâm đến” rộng nghĩa hơn הֶאֱזִין, vốn cụ thể là nghiêng tai/lắng nghe chăm chú. Tên יהוה nên được nhất quán chuyển là “Yahweh” theo hồ sơ POB, thay vì “Đức Giê-hô-va”.
  naturalness: “Rồi anh em trở về và khóc trước mặt Yahweh” là tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. “Cũng không lắng nghe anh em” giữ phép song song và tự nhiên hơn cách chuyển quá khái quát “cũng chẳng để tâm đến anh em”.
  terminology: Đổi “Đức Giê-hô-va” thành “Yahweh” để phản ánh trực tiếp danh יהוה và nhất quán với quyết định thuật ngữ của POB. Giữ “anh em” phù hợp với lời Môi-se ngỏ cùng dân chúng.
  issues:
