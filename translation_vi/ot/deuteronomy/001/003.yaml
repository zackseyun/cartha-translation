source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: vi
  text: Vào năm thứ bốn mươi, tháng thứ mười một, ngày mồng một của tháng, Môi-se nói với con cái Y-sơ-ra-ên theo mọi điều Yahweh đã truyền cho ông để nói với họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ có cấu trúc cô đọng, sát chữ là “đã truyền ông cho họ”; cũng có thể hiểu là “đã truyền cho ông liên quan đến họ”. Ngữ cảnh cho thấy điều Yahweh truyền cho Môi-se là điều ông phải nói với dân Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Vào
  rationale: Trong câu ghi niên đại này, công thức tường thuật וַיְהִי dẫn vào mốc thời gian; tiếng Việt tự nhiên không cần dịch riêng là “và đã xảy ra”.
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: năm thứ bốn mươi
  rationale: Cấu trúc số đếm với “năm” có chức năng chỉ thứ tự trong niên đại.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: tháng thứ mười một
  rationale: Đây là cách ghi tháng theo thứ tự, được diễn đạt tự nhiên trong tiếng Việt.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: ngày mồng một trong tháng
  rationale: Công thức ngày tháng Hê-bơ-rơ nghĩa là ngày đầu tiên của tháng; “mồng một” là cách nói hiện đại, rõ nghĩa trong tiếng Việt.
- source_word: דִּבֶּר
  choice: nói
  rationale: Giữ nghĩa rộng và trực tiếp của động từ, không diễn giải quá mức thành “tuyên bố” hay “truyền đạt”.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: với con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh thân tộc của nguyên văn בְּנֵי, đồng thời “con cái” có thể chỉ toàn thể cộng đồng chứ không chỉ nam giới.
- source_word: כְּכֹל אֲשֶׁר
  choice: mọi điều mà
  rationale: Trong tiếng Việt, cụm này diễn đạt tự nhiên sự tương ứng đầy đủ giữa lời Môi-se nói và điều được truyền, dù không dịch cứng giới từ כְּ.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Đã” thể hiện mệnh lệnh của Đức Giê-hô-va có trước việc Môi-se nói; “truyền” phù hợp ngữ vực Kinh Thánh trang trọng nhưng dễ hiểu.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng giao ước đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng tước hiệu “CHÚA”.
- source_word: אֹתוֹ אֲלֵהֶם
  choice: cho ông để nói với họ
  rationale: Cụm Hê-bơ-rơ nén nghĩa, sát chữ là “truyền ông đến/với họ”; cách dịch này làm rõ nội dung được truyền cho Môi-se là điều ông phải nói với dân, nhưng ghi chú vẫn bảo tồn độ nén và khả năng hiểu khác của nguyên văn.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp danh giao ước. Bản Việt giữ danh riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng trang trọng, dễ nhận biết đối với độc giả Việt.
- issue: Quan hệ trong אֹתוֹ אֲלֵיהֶם
  choice: đã truyền cho ông để nói với họ
  alternative: đã truyền cho ông về họ / đã truyền ông đến với họ
  rationale: Ngữ cảnh nói về lời Môi-se công bố cho Y-sơ-ra-ên, nhưng cấu trúc Hê-bơ-rơ có độ nén và không nêu tân ngữ nội dung; bản chính chọn cách hiểu tự nhiên mà không biến nó thành một khẳng định thần học rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Lược dịch công thức mở đầu וַיְהִי bằng cấu trúc ghi niên đại tự nhiên “Vào…”. Giữ tên Môi-se, Y-sơ-ra-ên và danh xưng Đức Giê-hô-va theo dạng Việt hóa quen thuộc; dùng “con cái Y-sơ-ra-ên” để bảo tồn hình ảnh thân tộc của nguyên văn.
