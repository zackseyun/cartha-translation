source:
  edition: WLC
  text: אִם יִרְאֶ֥ה אִישׁ֙ בָּ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה הַ/דּ֥וֹר הָ/רָ֖ע הַ/זֶּ֑ה אֵ֚ת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֣ר נִשְׁבַּ֔עְתִּי לָ/תֵ֖ת לַ/אֲבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: vi
  text: Không một người nào trong số những người này—thế hệ gian ác này—sẽ thấy miền đất tốt đẹp mà Ta đã thề ban cho tổ phụ các ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tổ tiên các ngươi.” Tiếng Hê-bơ-rơ viết: “các cha của các ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Không một ... nào ... sẽ
  rationale: Ở đây אִם nằm trong công thức phủ định mang tính thề nguyện, chứ không diễn tả một điều kiện đơn thuần. Cách dịch này truyền đạt lời phủ định dứt khoát và mạnh mẽ trong tiếng Việt.
- source_word: יִרְאֶה
  choice: sẽ được thấy
  rationale: Động từ ראה có nghĩa cơ bản là “thấy”. Trong ngữ cảnh phán xét, “sẽ được thấy” diễn tả việc họ bị loại khỏi cơ hội tận mắt chứng kiến và hưởng miền đất, đồng thời vẫn bám sát hình ảnh của nguyên văn.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: một người nào trong số những người
  rationale: 'Danh từ số ít אִישׁ trong công thức phủ định có ý phân phối: không một cá nhân nào. Giới từ בְּ mang nghĩa bộ phận, được diễn đạt tự nhiên là “trong số”.'
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: thế hệ gian ác này
  rationale: דּוֹר là “thế hệ”; רַע ở đây mang ý nghĩa đạo đức, nên “gian ác” phù hợp hơn cách hiểu đơn thuần là xấu hoặc bất hạnh.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: miền đất tốt đẹp
  rationale: Cách dịch trực tiếp, tự nhiên, giữ được ý về phẩm chất đáng ao ước và phước lành của miền đất.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: mà Ta đã thề
  rationale: Niphal của שׁבע có nghĩa “thề”. Đại từ “Ta” phản ánh lời phán trực tiếp của Đức Chúa Trời và giữ sắc thái trang trọng.
- source_word: לָתֵת
  choice: ban cho
  rationale: נתן có nghĩa thông thường là “cho”; trong lời hứa của Đức Chúa Trời, “ban cho” tự nhiên và trang trọng trong tiếng Việt mà không thêm nội dung thần học.
- source_word: לַאֲבֹתֵיכֶם
  choice: cho tổ phụ các ngươi
  rationale: Nguyên văn là danh từ giống đực số nhiều “các cha của các ngươi”, nhưng trong ngữ cảnh chỉ các bậc tiền nhân của Israel. “Tổ phụ” vừa giữ nét giống đực và ý nghĩa giao ước, vừa tự nhiên hơn cách dịch từng chữ “các cha”.
theological_decisions:
- issue: Cách dịch לַאֲבֹתֵיכֶם
  choice: cho tổ phụ các ngươi
  alternative: cho tổ tiên các ngươi
  rationale: “Tổ phụ” giữ hình thức giống đực của nguyên văn và thích hợp với các bậc tiền nhân của Israel; “tổ tiên” là nghĩa rộng hợp lệ nhưng trung tính hơn, nên được ghi trong chú thích.
- issue: Ý nghĩa của “thấy” trong lời phán xét
  choice: sẽ được thấy
  alternative: sẽ vào và hưởng
  rationale: Nguyên văn dùng ראה, “thấy”. Không diễn giải thẳng thành “vào” để tránh xóa bỏ hình ảnh và phạm vi nghĩa của câu, dù trong ngữ cảnh việc thấy miền đất hàm ý được vào và hưởng miền đất ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời phán trực tiếp của Đức Chúa Trời và “các ngươi” cho số nhiều ngôi thứ hai, phù hợp sắc thái diễn từ cổ trang trọng mà vẫn rõ nghĩa. Dấu chú thích [a] được đặt ngay sau nội dung liên quan.
