source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: vi
  text: Rồi chúng ta rời Hô-rếp, đi qua cả hoang mạc rộng lớn và đáng sợ ấy mà anh em đã thấy, trên đường đến miền núi của dân A-mô-rít,[a] đúng như Yahweh, Đức Chúa Trời của chúng ta, đã truyền cho chúng ta, rồi chúng ta đến tận Ca-đe Ba-nê-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm này cũng có thể hiểu là “theo đường qua miền núi của dân A-mô-rít.”
    reason: Cấu trúc דֶּרֶךְ הַר הָאֱמֹרִי có thể chỉ con đường hướng đến miền núi hoặc tuyến đường đi qua miền ấy.
lexical_decisions:
- source_word: וַנִּסַּע מֵחֹרֵב
  choice: chúng ta rời Hô-rếp
  rationale: Động từ נסע trong ngữ cảnh hành trình có nghĩa nhổ trại, lên đường; tiếng Việt tự nhiên có thể diễn đạt gọn là “rời”, đồng thời giữ rõ điểm xuất phát.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: đi qua cả hoang mạc
  rationale: Với אֵת và toàn vùng hoang mạc làm đối tượng của hành trình, cụm này diễn tả việc băng qua vùng ấy; “đi qua cả” vừa tự nhiên vừa giữ phạm vi כָּל.
- source_word: הַמִּדְבָּר הַגָּדוֹל וְהַנּוֹרָא
  choice: hoang mạc rộng lớn và đáng sợ
  rationale: Trong ngữ cảnh địa lý, גָּדוֹל chỉ quy mô nên “rộng lớn” tự nhiên hơn “vĩ đại”; נוֹרָא nói đến điều gây sợ hãi hoặc kinh hãi, được giữ bằng “đáng sợ”.
- source_word: אֲשֶׁר רְאִיתֶם
  choice: mà anh em đã thấy
  rationale: Giữ lời Môi-se trực tiếp nhắc đến trải nghiệm của cộng đồng; “anh em” là cách xưng hô số nhiều tự nhiên, trang trọng trong diễn ngôn giao ước.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: trên đường đến miền núi của dân A-mô-rít
  rationale: דֶּרֶךְ ở đây chỉ tuyến đường hướng đến một vùng; הַר mang nghĩa tập hợp là miền đồi núi chứ không nhất thiết một ngọn núi riêng lẻ.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: đúng như ... đã truyền
  rationale: Cách dịch này thể hiện sự tương ứng chính xác giữa hành trình và mệnh lệnh của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt để biểu thị trực tiếp danh giao ước YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời chúng ta
  rationale: Diễn đạt trực tiếp danh từ cùng hậu tố sở hữu ngôi thứ nhất số nhiều, theo cách gọi trang trọng và dễ hiểu trong tiếng Việt.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Ca-đe Ba-nê-a
  rationale: Phiên âm địa danh theo dạng quen dùng trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng của Đức Chúa Trời. “Giê-hô-va” giữ đây là tên riêng và là dạng dễ nhận biết đối với độc giả Việt, không thay danh ấy bằng tước hiệu.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “chúng ta/anh em” để giữ sự chuyển ngôi trong lời Môi-se. Các địa danh được phiên âm theo dạng quen thuộc với độc giả Kinh Thánh tiếng Việt.
