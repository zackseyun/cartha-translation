  revision_rationale: Sửa danh riêng thần linh thành “Yahweh” để nhất quán với nguồn và audit trail POB; thêm “đến tận” cho עַד; đồng thời làm rõ nhịp cú pháp mà không giải quyết thay tính không hoàn toàn xác định của cụm “đường/miền núi của dân A-mô-rít”. Chú thích được giữ để bảo lưu cách hiểu thay thế của cụm này.
