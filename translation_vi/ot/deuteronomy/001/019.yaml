revisions:
- from: Rồi chúng ta rời Hô-rếp, đi qua cả hoang mạc rộng lớn và đáng sợ ấy mà anh em đã thấy, trên đường đến miền núi của dân A-mô-rít,[a] đúng như Giê-hô-va Đức Chúa Trời chúng ta đã truyền cho chúng ta; rồi chúng ta đến Ca-đe Ba-nê-a.
  to: Rồi chúng ta rời Hô-rếp, đi qua cả hoang mạc rộng lớn và đáng sợ ấy mà anh em đã thấy, trên đường đến miền núi của dân A-mô-rít,[a] đúng như Yahweh, Đức Chúa Trời của chúng ta, đã truyền cho chúng ta, rồi chúng ta đến tận Ca-đe Ba-nê-a.
  rationale: Sửa danh riêng thần linh thành “Yahweh” để nhất quán với nguồn và audit trail POB; thêm “đến tận” cho עַד; đồng thời làm rõ nhịp cú pháp mà không giải quyết thay tính không hoàn toàn xác định của cụm “đường/miền núi của dân A-mô-rít”. Chú thích được giữ để bảo lưu cách hiểu thay thế của cụm này.
  reviewer_model: gpt-5.6-terra
