revisions:
- from: sau khi ông đã đánh hạ Si-hôn, vua dân A-mô-rít, là người sống tại Hết-bôn, và Óc, vua Ba-san, là người sống tại Ách-ta-rốt, tại Ét-rê-i.[a]
  to: sau khi ông đã đánh hạ Si-hôn, vua của dân A-mô-rít, đang ở tại Hết-bôn, và Óc, vua Ba-san, đang ở tại Ách-ta-rốt, tại Ét-rê-i.[a]
  rationale: Chỉnh sửa chỉ nhằm tăng tính tự nhiên của tiếng Việt và làm rõ quan hệ sở thuộc trong tước hiệu của Si-hôn. Bản sửa vẫn giữ mệnh đề thời gian phụ thuộc câu trước, đại từ “ông” theo văn mạch chỉ Môi-se, lực của động từ “đánh hạ,” và sự mơ hồ địa lý ở cụm cuối.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:23:04Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng mốc thời gian của אַחֲרֵי הַכֹּתוֹ (“sau khi ông đã đánh hạ”), hai tân ngữ Si-hôn và Óc, các tước hiệu, và việc lặp giới từ trước hai địa danh cuối. Cách giữ “Ách-ta-rốt, tại Ét-rê-i” cùng chú thích bảo toàn sự không chắc chắn về quan hệ giữa hai địa danh, phù hợp với tiếng Hê-bơ-rơ và audit tiếng Anh.
  naturalness: Cụm “là người sống tại” nặng và không tự nhiên trong văn xuôi tiếng Việt hiện đại, nhất là khi lặp hai lần. “Đang ở tại” diễn đạt tự nhiên hơn ý cư trú của יוֹשֵׁב mà không thêm diễn giải. “Vua của dân A-mô-rít” cũng rõ và tự nhiên hơn “vua dân A-mô-rít.”
  terminology: 'Giữ các dạng tên riêng đã dùng trong bản thảo: Si-hôn, Hết-bôn, Óc, Ba-san, Ách-ta-rốt và Ét-rê-i. “Đánh hạ” phù hợp với sắc thái mạnh của נכה trong ngữ cảnh này. Không có vấn đề thuật ngữ thần học.'
  issues:
  - severity: low
    issue: Cụm “là người sống tại” được lặp lại.
    rationale: Cách diễn đạt này gượng trong tiếng Việt hiện đại. Bỏ “là người” và dùng “đang ở tại” vừa tự nhiên hơn vừa vẫn chuyển tải phân từ chỉ sự cư trú.
  - severity: low
    issue: “vua dân A-mô-rít” thiếu quan hệ từ.
    rationale: “Vua của dân A-mô-rít” là cấu trúc tiếng Việt rõ ràng và thành ngữ hơn, đồng thời biểu thị đúng chuỗi cấu trúc tiếng Hê-bơ-rơ “vua của người A-mô-rít.”
  revised_text: sau khi ông đã đánh hạ Si-hôn, vua của dân A-mô-rít, đang ở tại Hết-bôn, và Óc, vua Ba-san, đang ở tại Ách-ta-rốt, tại Ét-rê-i.[a]
