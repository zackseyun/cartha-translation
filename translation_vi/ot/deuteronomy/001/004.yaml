source:
  edition: WLC
  text: אַחֲרֵ֣י הַכֹּת֗/וֹ אֵ֚ת סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן וְ/אֵ֗ת ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן אֲשֶׁר יוֹשֵׁ֥ב בְּ/עַשְׁתָּרֹ֖ת בְּ/אֶדְרֶֽעִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: vi
  text: sau khi ông đã đánh hạ Si-hôn, vua của dân A-mô-rít, đang ở tại Hết-bôn, và Óc, vua Ba-san, đang ở tại Ách-ta-rốt, tại Ét-rê-i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang ở tại Ách-ta-rốt và Ét-rê-i.” Tiếng Hê-bơ-rơ dùng giới từ “tại” trước cả hai địa danh, nhưng không nói hoàn toàn rõ mối quan hệ chính xác giữa hai nơi này.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי
  choice: sau khi
  rationale: Giới từ thời gian mở đầu hành động xảy ra trước lời Môi-se nói trong câu 3; “sau khi” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: הַכֹּתוֹ
  choice: ông đã đánh hạ
  rationale: Dạng nguyên mẫu cấu trúc của נכה với hậu tố ngôi 3 số ít giống đực chỉ hành động đã xảy ra trước; “đánh hạ” giữ được sắc thái mạnh hơn “đánh bại,” còn “ông” giữ tham chiếu về Môi-se từ văn cảnh.
- source_word: אֵת
  choice: '[dấu chỉ tân ngữ xác định, không dịch]'
  rationale: Đánh dấu Si-hôn và Óc là các tân ngữ xác định, không có từ tương đương cần biểu đạt riêng trong tiếng Việt.
- source_word: סִיחֹן
  choice: Si-hôn
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc và dễ đọc trong tiếng Việt.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: vua dân A-mô-rít
  rationale: Diễn đạt rõ chuỗi liên kết “vua của người A-mô-rít” bằng cấu trúc tự nhiên, gọn trong tiếng Việt.
- source_word: אֲשֶׁר יוֹשֵׁב
  choice: là người sống
  rationale: יָשַׁב trong ngữ cảnh này chỉ nơi cư trú hoặc nơi đặt quyền cai trị; “sống” là cách nói hiện đại, không cổ hóa thành “cư ngụ.”
- source_word: בְּחֶשְׁבּוֹן
  choice: tại Hết-bôn
  rationale: Giới từ בְּ trước địa danh được diễn đạt bằng “tại,” phù hợp với nơi cư trú và tránh hàm ý quá cụ thể về ranh giới đô thị.
- source_word: וְאֵת
  choice: và
  rationale: Liên từ được dịch, còn dấu chỉ tân ngữ không biểu đạt riêng trong tiếng Việt.
- source_word: עוֹג
  choice: Óc
  rationale: Phiên âm tên riêng theo dạng tiếng Việt quen dùng.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: vua Ba-san
  rationale: Cấu trúc sở thuộc được chuyển tự nhiên là “vua Ba-san,” nghĩa là vua cai trị vùng Ba-san.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: là người sống tại Ách-ta-rốt, tại Ét-rê-i
  rationale: Giữ lại cả hai giới từ בְּ được lặp lại và không tự ý xác định quan hệ địa lý giữa hai địa danh; dấu phẩy phản ánh cấu trúc nén của tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu được giữ liên tục với câu 3 vì đây là mệnh đề thời gian phụ thuộc vào câu trước. Các tên riêng được phiên âm theo dạng quen thuộc trong tiếng Việt. Bản dịch giữ sự mơ hồ địa lý của cụm cuối thay vì giải thích Ách-ta-rốt là thuộc hoặc ở gần Ét-rê-i.
