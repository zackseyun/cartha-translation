source:
  edition: WLC
  text: וָ/אֶקַּ֞ח אֶת רָאשֵׁ֣י שִׁבְטֵי/כֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽ/ידֻעִ֔ים וָ/אֶתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עֲלֵי/כֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְ/שָׂרֵ֣י מֵא֗וֹת וְ/שָׂרֵ֤י חֲמִשִּׁים֙ וְ/שָׂרֵ֣י עֲשָׂרֹ֔ת וְ/שֹׁטְרִ֖ים לְ/שִׁבְטֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: vi
  text: 'Vì vậy, tôi đã chọn những người đứng đầu các bộ tộc của anh em—những người khôn ngoan và hiểu biết[a]—rồi lập họ làm những người đứng đầu anh em: những người chỉ huy hàng ngàn, hàng trăm, hàng năm mươi và hàng chục, cùng các viên chức cho các bộ tộc của anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được biết đến” hoặc “được công nhận”; từ Hê-bơ-rơ có thể chỉ những người có hiểu biết hoặc những người được cộng đồng biết đến và công nhận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Vì vậy, tôi đã chọn
  rationale: Động từ לקח theo mạch kể chuyện có nghĩa cơ bản là “lấy”; trong ngữ cảnh tuyển chọn người lãnh đạo, “chọn” truyền đạt tự nhiên hành động của Môi-se, còn “Vì vậy” nối với lời chỉ dẫn trước đó.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: những người đứng đầu các bộ tộc của anh em
  rationale: Giữ hình ảnh “đầu” của רֹאשׁ, đồng thời diễn đạt rõ đây là những người lãnh đạo các bộ tộc.
- source_word: אֲנָשִׁים חֲכָמִים וִידֻעִים
  choice: những người khôn ngoan và hiểu biết
  rationale: “Khôn ngoan” phản ánh חֲכָמִים trong nghĩa khôn ngoan thực tiễn; “hiểu biết” thể hiện cách hiểu phù hợp ngữ cảnh nhất của וִידֻעִים, nhưng khả năng “được biết đến/được công nhận” được giữ trong chú thích.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: rồi lập họ làm người đứng đầu anh em
  rationale: נתן trong cấu trúc này diễn tả việc bổ nhiệm; “lập” tự nhiên trong tiếng Việt và “người đứng đầu” duy trì sự lặp từ của רֹאשׁ.
- source_word: שָׂרֵי
  choice: những người chỉ huy
  rationale: שַׂר chỉ người có thẩm quyền trên các đơn vị được phân cấp; “người chỉ huy” phù hợp sắc thái tổ chức quân sự-hành chính mà không khẳng định đây thuần túy là chức vụ quân sự.
- source_word: אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: hàng ngàn, hàng trăm, hàng năm mươi và hàng chục
  rationale: Cách nói “hàng…” tự nhiên trong tiếng Việt để chỉ các đơn vị phân cấp, đồng thời bảo toàn đầy đủ các cấp số của tiếng Hê-bơ-rơ.
- source_word: וְשֹׁטְרִים לְשִׁבְטֵיכֶם
  choice: cùng các viên chức cho các bộ tộc của anh em
  rationale: “Viên chức” đủ rộng cho שֹׁטְרִים, là những người thi hành hoặc phụ trách hành chính; “cho các bộ tộc” thể hiện quan hệ phân công của לְ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng Y-sơ-ra-ên; giữ sự lặp lại của hình ảnh “đứng đầu” và cấu trúc phân cấp trong nguyên văn.
