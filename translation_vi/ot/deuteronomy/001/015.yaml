    issue: Bổ ngữ chức vụ “người đứng đầu” sau “lập họ làm” không biểu thị số nhiều.
    rationale: Nguyên ngữ dùng רָאשִׁים, số nhiều, và đối tượng “họ” cũng là số nhiều. “Những người đứng đầu” bảo toàn rõ ràng số nhiều mà không đổi nghĩa.
