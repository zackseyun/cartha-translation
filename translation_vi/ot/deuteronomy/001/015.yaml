  to: 'Vì vậy, tôi đã chọn những người đứng đầu các bộ tộc của anh em—những người khôn ngoan và hiểu biết[a]—rồi lập họ làm những người đứng đầu anh em: những người chỉ huy hàng ngàn, hàng trăm, hàng năm mươi và hàng chục, cùng các viên chức cho các bộ tộc của anh em.'
