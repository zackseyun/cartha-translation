base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/046.yaml
  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: vi
  text: Vậy, anh em đã ở lại tại Ca-đe nhiều ngày[a], bằng số ngày anh em đã ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “nhiều ngày, như những ngày anh em đã ở.” Cụm cuối có tính tỉnh lược; có thể hiểu là “một thời gian dài, bằng thời gian anh em đã ở đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: Vì vậy, anh em đã ở lại
  rationale: Động từ ישׁב ở đây chỉ việc lưu lại tại một nơi; “ở lại” tự nhiên trong tiếng Việt và phù hợp với bối cảnh đóng trại kéo dài. “Vì vậy” thể hiện sự tiếp nối mang tính hệ quả từ câu trước.
- source_word: בְקָדֵשׁ
  choice: tại Ca-đe
  rationale: Giữ địa danh bằng hình thức phiên âm quen thuộc; “tại” diễn đạt địa điểm một cách trang trọng và tự nhiên.
- source_word: יָמִים רַבִּים
  choice: nhiều ngày
  rationale: Dịch trực tiếp danh từ và tính từ, giữ hình ảnh cụ thể của nguyên văn thay vì diễn giải thành “một thời gian dài”.
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: bằng với số ngày anh em đã ở đó
  rationale: כְּ nêu sự so sánh, còn mệnh đề cuối có tính tỉnh lược. Cách dịch này dễ hiểu nhưng vẫn để ngỏ điều được đem ra so sánh; “đó” được bổ sung theo ngữ cảnh, chỉ về Ca-đe.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với cộng đồng Y-sơ-ra-ên; giữ cấu trúc so sánh hơi tỉnh lược của tiếng Hê-bơ-rơ và giải thích trong chú thích.
