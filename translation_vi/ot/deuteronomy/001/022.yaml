  text: וַ/תִּקְרְב֣וּ/ן אֵלַ/י֮ כֻּלְּ/כֶם֒ וַ/תֹּאמְר֗וּ נִשְׁלְחָ֤ה אֲנָשִׁים֙ לְ/פָנֵ֔י/נוּ וְ/יַחְפְּרוּ לָ֖/נוּ אֶת הָ/אָ֑רֶץ וְ/יָשִׁ֤בוּ אֹתָ֨/נוּ֙ דָּבָ֔ר אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר נַעֲלֶה בָּ֔/הּ וְ/אֵת֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר נָבֹ֖א אֲלֵי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: vi
  text: 'Bấy giờ, tất cả anh em đều đến gần tôi và nói: “Chúng ta hãy phái những người đàn ông đi trước chúng ta để dò xét xứ ấy cho chúng ta, và báo lại cho chúng ta về con đường chúng ta phải đi lên để vào xứ ấy, cùng những thành chúng ta sẽ đến.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: Bấy giờ, tất cả anh em đến gần tôi
  rationale: Giữ nghĩa cụ thể của קָרַב là “đến gần” và sắc thái nhấn mạnh của כֻּלְּכֶם là “tất cả anh em”; “anh em” phù hợp với lời Môi-se trực tiếp nói với cộng đồng.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: Chúng ta hãy sai người
  rationale: Thể cohortative được diễn đạt tự nhiên bằng “hãy”; “người” trong tiếng Việt không phủ nhận rằng những người được chọn là nam giới và tránh lối diễn đạt gượng “những người nam”.
- source_word: לְפָנֵינוּ
  choice: đi trước
  rationale: Diễn đạt tự nhiên ý những người được phái đi trước đoàn dân, thay vì dịch sát nhưng cứng là “trước mặt chúng ta”.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: để dò xét xứ ấy cho chúng ta
  rationale: חָפַר ở đây chỉ việc khảo sát, thăm dò kỹ địa hình; “dò xét” bảo toàn sắc thái điều tra mà không nhất thiết áp đặt ý hoạt động gián điệp bí mật.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: rồi trở về báo cho chúng ta biết
  rationale: Chuyển thành cách nói Việt tự nhiên về việc mang tin trở lại, đồng thời giữ cả ý trở về và báo cáo.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: con đường phải đi lên
  rationale: Giữ động từ עָלָה là “đi lên”, một cách nói Kinh Thánh thường dùng khi tiến vào xứ hoặc vùng cao; “phải” thể hiện sắc thái cân nhắc về tuyến đường nên chọn.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: và những thành chúng ta sẽ đến
  rationale: 'Diễn đạt gọn, tự nhiên, vẫn giữ đối tượng thứ hai mà đoàn thám sát phải báo cáo: các thành đoàn dân sẽ tiến đến.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “xứ” cho הָאָרֶץ trong bối cảnh vùng đất được nhắc đến cụ thể; giữ “đi lên” để bảo toàn thành ngữ địa lý-thần học của nguyên văn. Không thêm chú thích vì các lựa chọn có thể được thể hiện rõ trong chính văn mà không làm mất một dị nghĩa quan trọng.
