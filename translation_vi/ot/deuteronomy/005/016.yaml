base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: vi
  text: Hãy hiếu kính cha và mẹ của bạn, như Yahweh, Đức Chúa Trời của bạn, đã truyền cho bạn, để bạn được sống lâu và để mọi sự được tốt đẹp cho bạn trên vùng đất mà Yahweh, Đức Chúa Trời của bạn, đang ban cho bạn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: Hãy hiếu kính
  rationale: Thể mệnh lệnh Piel của כבד trong quan hệ gia đình có nghĩa là tôn kính và đối đãi cha mẹ như người đáng trọng. “Hiếu kính” tự nhiên, trang trọng trong tiếng Việt và diễn đạt đúng nghĩa vụ đối với cha mẹ.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: cha và mẹ của anh em
  rationale: Giữ sự cân xứng do אֶת được lặp lại trước cả hai danh từ. Đại từ số ít giống đực chỉ từng thành viên trong cộng đồng giao ước; “anh em” là cách xưng hô tự nhiên trong diễn ngôn cộng đồng.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: như ... đã truyền cho anh em
  rationale: כַּאֲשֶׁר chỉ sự tương ứng với mệnh lệnh đã được ban, còn động từ hoàn thành được diễn đạt tự nhiên bằng “đã truyền”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt cấu trúc sở hữu với hậu tố ngôi thứ hai số ít và giữ sắc thái quan hệ giao ước.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích hoặc kết quả của לְמַעַן; hai lần xuất hiện được gộp thành một cấu trúc tiếng Việt trôi chảy nhưng cả hai kết quả vẫn được giữ.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: anh em được sống lâu
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ “ngày của anh em được dài lâu”, tránh lối dịch máy móc mà vẫn giữ lời hứa về tuổi thọ.
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: và được phước
  rationale: Thành ngữ ייטב לך nói đến việc được tốt lành, thịnh vượng hoặc mọi sự thuận lợi. “Được phước” ngắn gọn và phù hợp văn mạch giao ước, nhưng chú thích giữ cách dịch sát hơn để không thu hẹp nghĩa.
- source_word: עַל הָאֲדָמָה
  choice: trên đất
  rationale: אֲדָמָה ở đây là vùng đất Đức Chúa Trời ban, không chỉ là đất hay thổ nhưỡng nói chung; “trên đất” giữ gần giới từ עַל.
- source_word: נֹתֵן לָךְ
  choice: ban cho anh em
  rationale: Phân từ נֹתֵן trình bày việc ban đất như một thực tại đang tiến hành hoặc chắc chắn. Hiện tại “ban cho” tự nhiên trong tiếng Việt và không biến nó thành một tương lai thuần túy.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước יהוה; phiên âm “Yahweh” bảo tồn việc đây là tên riêng chứ không phải tước hiệu.
- issue: Bản chất của lời hứa gắn với việc hiếu kính cha mẹ
  choice: Giữ nguyên lời hứa giao ước về sống lâu và được tốt lành trên đất
  alternative: Hiểu như bảo đảm tuyệt đối về tuổi thọ cho mọi cá nhân, hoặc chỉ như lời hứa tập thể không có chiều kích cá nhân
  rationale: Câu Hê-bơ-rơ nêu một lời hứa thật trong bối cảnh giao ước nhưng không tự nó giải quyết quan hệ giữa phương diện cá nhân và cộng đồng. Bản dịch không thu hẹp lời hứa theo một trong hai hướng.
- issue: Phạm vi nghĩa của ייטב לך
  choice: được phước, kèm chú thích “được tốt lành”
  alternative: mọi việc được thuận lợi cho anh em
  rationale: Cụm từ chỉ tình trạng tốt lành hoặc an khang nói chung. Cách dịch chính tự nhiên trong văn phong Kinh Thánh Việt ngữ, còn chú thích bảo tồn độ rộng của thành ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hiếu kính” được chọn thay cho “tôn kính” vì diễn đạt tự nhiên nghĩa vụ của con cái đối với cả cha lẫn mẹ. “Anh em” biểu thị ngôi thứ hai số ít giống đực trong lời Môi-se nói với toàn thể Israel, vừa giữ tính cá nhân vừa phù hợp lời xưng hô cộng đồng.
