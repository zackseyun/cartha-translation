  - severity: low
    issue: Liên kết của “phán” với nội dung lời nói
    rationale: Tiếng Việt tự nhiên hơn khi dùng “phán với ngươi về toàn bộ điều răn”; bổ sung giới từ này chỉ làm rõ quan hệ cú pháp vốn có trong nguyên văn.
