source:
  edition: WLC
  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: vi
  text: Còn ngươi, hãy đứng đây với ta, rồi ta sẽ phán với ngươi về toàn bộ điều răn[a], các luật lệ và các phán quyết mà ngươi phải dạy họ, để họ làm theo trong đất ta đang ban cho họ chiếm hữu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dùng danh từ số ít “điều răn” tại đây, rồi tiếp theo bằng các danh từ số nhiều “luật lệ” và “phán quyết”. Cũng có thể dịch: “toàn thể mệnh lệnh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để thừa hưởng đất ấy” hoặc “để nhận lấy đất ấy làm sản nghiệp”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: hãy đứng đây với ta
  rationale: Giữ hình ảnh cụ thể của động từ עָמַד (“đứng”) cùng sắc thái mệnh lệnh trang nghiêm; “với ta” diễn đạt trực tiếp עִמָּדִי.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: rồi ta sẽ phán với ngươi
  rationale: Dạng cohortative nối sau mệnh lệnh chỉ hành động tiếp theo có ý hướng. “Phán” phù hợp với lời Đức Chúa Trời trong văn cảnh trang trọng, còn “rồi” làm rõ trình tự tự nhiên trong tiếng Việt.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: toàn bộ điều răn
  rationale: Giữ danh từ số ít מִצְוָה và ý nghĩa bao quát của כָּל, đồng thời tránh cách nói thiếu tự nhiên “tất cả điều răn” khi danh từ vẫn ở số ít.
- source_word: הַחֻקִּים
  choice: các luật lệ
  rationale: “Luật lệ” là cách diễn đạt rõ ràng, tự nhiên cho חֻקִּים trong văn cảnh giao ước và vẫn phân biệt được với “phán quyết”.
- source_word: הַמִּשְׁפָּטִים
  choice: các phán quyết
  rationale: Giữ sắc thái pháp lý và mối liên hệ của מִשְׁפָּטִים với việc xét xử, quyết định điều công chính.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: mà ngươi phải dạy họ
  rationale: Diễn đạt lực chỉ thị của thể chưa hoàn thành trong lời giao nhiệm vụ cho Môi-se; “phải” tự nhiên hơn trong tiếng Việt hiện đại mà không làm yếu nghĩa bắt buộc.
- source_word: וְעָשׂוּ
  choice: để họ làm theo
  rationale: Nêu rõ quan hệ mục đích hoặc kết quả của việc dạy dỗ. “Làm theo” tự nhiên trong tiếng Việt và chỉ sự thực hành các quy định vừa nêu.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: ta đang ban cho họ
  rationale: “Đang ban” phản ánh phân từ נֹתֵן, nhấn mạnh hành động ban đất hiện thực hoặc sắp thành tựu của Đức Chúa Trời.
- source_word: לְרִשְׁתָּהּ
  choice: chiếm hữu
  rationale: Diễn đạt ngắn gọn ý יָרַשׁ trong bối cảnh nhận và nắm quyền sở hữu đất; đại từ chỉ “đất” có thể lược bỏ tự nhiên trong cấu trúc tiếng Việt.
theological_decisions:
- issue: Bộ ba thuật ngữ pháp lý מִצְוָה / חֻקִּים / מִשְׁפָּטִים
  choice: Giữ ba thuật ngữ phân biệt là “điều răn”, “luật lệ” và “phán quyết”.
  alternative: Gộp thành một cụm khái quát như “luật pháp và quy định”.
  rationale: Bản dịch giữ kết cấu và sắc thái pháp lý đa dạng của nguyên văn, không đồng nhất hóa các phạm trù trong lời chỉ dạy giao ước.
- issue: Danh từ số ít מִצְוָה
  choice: Dịch ở số ít là “điều răn”, với từ bao quát “toàn bộ”.
  alternative: Dịch số nhiều là “mọi điều răn” hoặc khái quát thành “luật pháp”.
  rationale: Số ít trong tiếng Hê-bơ-rơ có thể mang nghĩa tập hợp; giữ số ít bảo toàn độ căng và tính bao quát của nguyên văn mà không quyết định thay người đọc.
- issue: Quan hệ của וְעָשׂוּ với việc Môi-se dạy dân
  choice: 'Dịch theo ý mục đích hoặc kết quả: “để họ làm theo”.'
  alternative: 'Dịch nối tiếp đơn thuần: “và họ sẽ làm theo”.'
  rationale: Văn cảnh cho thấy việc dạy nhằm dẫn đến sự vâng giữ, nhưng nguyên văn vẫn cho phép sắc thái kết quả; cách dịch không thêm nội dung giáo lý ngoài mạch cú pháp.
translation_notes:
  register: Văn phong hiện đại nhưng trang nghiêm. Đại từ “ta/ngươi” phản ánh lời Đức Chúa Trời trực tiếp phán với Môi-se và duy trì sắc thái giao ước; câu được sắp xếp trôi chảy theo tiếng Việt mà vẫn giữ bộ ba thuật ngữ pháp lý và số ít của “điều răn”.
