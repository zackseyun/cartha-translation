  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: vi
  text: Yahweh đã phán những lời này với toàn thể hội chúng của anh em trên núi, từ giữa lửa, mây và bóng tối dày đặc, bằng tiếng nói lớn; Ngài không phán thêm nữa.[a] Rồi Ngài viết những lời ấy trên hai bảng đá và trao cho tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài không tiếp tục phán.” Cụm từ Hê-bơ-rơ có thể được hiểu là Ngài không phán thêm lời nào hoặc Ngài không tiếp tục phán.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: những lời này
  rationale: Giữ nghĩa cơ bản của דְּבָרִים và nhấn mạnh đây là những lời vừa được phán, không diễn giải hẹp thành “các điều răn”.
- source_word: כָּל קְהַלְכֶם
  choice: toàn thể hội chúng của anh em
  rationale: קָהָל chỉ cộng đồng đã tập hợp; cách diễn đạt này vừa tự nhiên vừa giữ sắc thái tập thể và đại từ số nhiều ngôi thứ hai.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: từ giữa lửa, mây và bóng tối dày đặc
  rationale: “Từ giữa” thể hiện rõ מִתּוֹךְ; “bóng tối dày đặc” truyền đạt sắc thái của עֲרָפֶל.
- source_word: קוֹל גָּדוֹל
  choice: bằng một tiếng lớn
  rationale: Giữ tương đối sát cấu trúc “tiếng lớn” và sức mạnh thính giác của cảnh tượng; “tiếng” cũng không giới hạn quá mức קוֹל chỉ vào giọng nói.
- source_word: וְלֹא יָסָף
  choice: Ngài không phán thêm nữa
  rationale: Trong mạch văn về những lời giao ước, cách hiểu này diễn đạt rằng Ngài không thêm lời nào vào lời phán ấy, đồng thời chú thích bảo tồn khả năng hiểu là Ngài không tiếp tục phán.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: hai bảng đá
  rationale: Cách nói tiếng Việt tự nhiên, ngắn gọn và chính xác về chất liệu của hai bảng.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: trao cho tôi
  rationale: “Trao” phù hợp với hành động giao hai bảng cho Môi-se và giữ ngôi thứ nhất của lời thuật.
theological_decisions:
- issue: Cách dịch danh YHWH
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ danh riêng được biểu thị bởi יהוה, không thay bằng tước hiệu và không áp đặt cách gọi mang tính truyền thống giáo phái.
- issue: Ý nghĩa của וְלֹא יָסָף
  choice: Ngài không phán thêm nữa
  alternative: Ngài không tiếp tục phán; tiếng ấy không ngừng
  rationale: Chủ ngữ theo mạch văn là Yahweh, và ngữ cảnh nghiêng về việc Ngài không thêm hoặc không tiếp tục lời phán. Vì thành ngữ Hê-bơ-rơ có thể được hiểu theo cả hai cách gần nhau, bản dịch giữ cách đọc chính và nêu cách khác trong chú thích; cách hiểu “tiếng ấy không ngừng” ít phù hợp hơn với mạch văn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng giao ước; dùng “Ngài” để quy chiếu Yahweh. Cấu trúc câu được điều chỉnh vừa phải cho tiếng Việt nhưng vẫn giữ trình tự: lời phán công khai, hoàn cảnh thần hiện, việc không phán thêm, rồi viết và trao hai bảng đá.'
