revisions:
- from: Yahweh đã phán những lời này với toàn thể hội chúng của anh em trên núi, từ giữa lửa, mây và bóng tối dày đặc, bằng một tiếng lớn; Ngài không phán thêm nữa.[a] Rồi Ngài viết những lời ấy trên hai bảng đá và trao cho tôi.
  to: Yahweh đã phán những lời này với toàn thể hội chúng của anh em trên núi, từ giữa lửa, mây và bóng tối dày đặc, bằng tiếng nói lớn; Ngài không phán thêm nữa.[a] Rồi Ngài viết những lời ấy trên hai bảng đá và trao cho tôi.
  rationale: Chỉ điều chỉnh cách diễn đạt của קוֹל גָּדוֹל nhằm tăng tính tự nhiên trong tiếng Việt hiện đại. Bản văn vẫn giữ trật tự, quan hệ cú pháp và sự mơ hồ có kiểm soát của nguyên ngữ; chú thích vẫn được neo đúng sau mệnh đề וְלֹא יָסָף.
  reviewer_model: gpt-5.6-terra
