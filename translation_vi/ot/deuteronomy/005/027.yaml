  to: Ông hãy đến gần và nghe mọi điều ĐỨC CHÚA, Đức Chúa Trời của chúng ta, nói. Rồi ông hãy nói cho chúng tôi mọi điều ĐỨC CHÚA, Đức Chúa Trời của chúng ta, phán với ông; chúng tôi sẽ nghe và làm theo.
