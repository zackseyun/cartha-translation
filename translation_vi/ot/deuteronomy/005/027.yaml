  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: vi
  text: Ông hãy đến gần và nghe mọi điều ĐỨC CHÚA, Đức Chúa Trời của chúng ta, nói. Rồi ông hãy nói cho chúng tôi mọi điều ĐỨC CHÚA, Đức Chúa Trời của chúng ta, phán với ông; chúng tôi sẽ nghe và làm theo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב
  choice: hãy đến gần
  rationale: Giữ trực tiếp mệnh lệnh Híp-ri, chỉ việc Môi-se tiến đến gần Đức Chúa Trời thay cho dân chúng.
- source_word: יְהוָה
  choice: ĐỨC CHÚA
  rationale: Dùng cách trình bày trang trọng, quen thuộc trong Kinh Thánh tiếng Việt cho danh giao ước YHWH.
- source_word: תְּדַבֵּר אֵלֵינוּ
  choice: hãy thuật lại cho chúng tôi
  rationale: Trong ngữ cảnh trung gian truyền đạt, “thuật lại” diễn đạt tự nhiên việc Môi-se nói lại cho dân mọi điều đã nghe, mà không thêm ý giải thích.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: chúng tôi sẽ nghe và làm theo
  rationale: “Nghe” được giữ riêng, còn “làm theo” truyền đạt thành ngữ Híp-ri về nghe rồi vâng làm.
theological_decisions:
- issue: Vai trò trung gian của Môi-se
  choice: Giữ lời dân yêu cầu Môi-se đến gần, nghe và thuật lại lời Đức Chúa Trời
  alternative: Diễn giải thành Môi-se nhận mặc khải với thẩm quyền thần học rộng hơn
  rationale: Bản dịch chỉ thể hiện vai trò trung gian được câu văn nêu rõ, không nhập thêm một hệ thống thần học.
- issue: Sự đáp ứng của dân
  choice: “sẽ nghe và làm theo”
  alternative: “sẽ vâng lời”
  rationale: Giữ hai động từ riêng biệt của nguyên văn và sức căng giữa lời cam kết nghe với hành động thực hiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì dân chúng trực tiếp thưa với Môi-se; cấu trúc mệnh lệnh được giữ rõ nhưng không thô cứng. Lặp đầy đủ tước hiệu “ĐỨC CHÚA, Đức Chúa Trời của chúng ta” theo nguyên văn.
