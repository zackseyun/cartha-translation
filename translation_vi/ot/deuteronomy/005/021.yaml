base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: vi
  text: Ngươi không được ham muốn[a] vợ của người lân cận của ngươi; cũng không được khao khát nhà[b] của người lân cận của ngươi, ruộng, nô lệ nam, nô lệ nữ, bò, lừa, hay bất cứ điều gì thuộc về người lân cận của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ham muốn” dịch động từ חמד, chỉ sự ham muốn điều thuộc về người khác. Vế sau dùng một động từ tiếng Hê-bơ-rơ khác, được dịch là “khao khát”; hai từ gần nghĩa nhưng không hoàn toàn đồng nhất.
    reason: lexical_alternative
  - marker: b
    text: Từ tiếng Hê-bơ-rơ được dịch là “nhà” cũng có thể chỉ gia hộ hoặc gia sản. Danh mục tài sản theo sau khiến nghĩa liên quan đến tài sản có vẻ phù hợp trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: ham muốn
  rationale: Động từ חמד chỉ sự ham muốn điều thuộc về người khác và mang sức nặng đạo đức trong điều răn này. “Ham muốn” tự nhiên trong tiếng Việt, đồng thời diễn đạt một ước muốn chiếm hữu không chính đáng.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: vợ của người lân cận mình
  rationale: Cụm sở hữu này chỉ rõ người vợ của người khác; cách diễn đạt với “mình” tự nhiên sau chủ ngữ “ngươi”.
- source_word: תִתְאַוֶּה
  choice: khao khát
  rationale: Thể hitpael của אוה gần nghĩa nhưng không đồng nhất với חמד. “Khao khát” giữ được sự phân biệt giữa hai động từ mà không làm giảm cường độ của điều cấm.
- source_word: בֵּית רֵעֶךָ
  choice: nhà của người ấy
  rationale: בַּיִת có thể chỉ căn nhà, gia đình hoặc gia sản. Danh mục tài sản theo sau khiến nghĩa “nhà” theo phương diện tài sản phù hợp nhất, nhưng chú thích vẫn bảo lưu nghĩa rộng hơn.
- source_word: שָׂדֵהוּ
  choice: đồng ruộng
  rationale: שָׂדֶה ở đây là ruộng hoặc đất canh tác; “đồng ruộng” là cách gọi tự nhiên và phân biệt với căn nhà.
- source_word: עַבְדּוֹ
  choice: nô lệ nam
  rationale: Trong danh mục những gì thuộc gia hộ, עֶבֶד nói đến người ở địa vị nô lệ. Cách dịch thẳng này không che mờ tình trạng lệ thuộc và giữ sự đối xứng giới tính với từ kế tiếp.
- source_word: אֲמָתוֹ
  choice: nô lệ nữ
  rationale: אָמָה chỉ một phụ nữ ở địa vị nô lệ; “nô lệ nữ” rõ nghĩa trong tiếng Việt hiện đại và tương ứng với “nô lệ nam”.
- source_word: שׁוֹרוֹ
  choice: bò
  rationale: שׁוֹר chỉ gia súc thuộc loài bò, thường là con vật dùng trong lao động. “Bò” tránh xác định quá mức rằng con vật đã thiến hay chỉ là bò đực.
- source_word: חֲמֹרוֹ
  choice: lừa
  rationale: “Lừa” là từ tiếng Việt hiện đại, rõ ràng cho חֲמוֹר.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: hay bất cứ vật gì thuộc về người lân cận mình
  rationale: Cách diễn đạt này truyền đạt trọn vẹn phạm vi bao quát và quan hệ sở hữu của cụm Hebrew.
- source_word: רֵעֶךָ
  choice: người lân cận mình
  rationale: רֵעַ trong luật đạo đức liên cá nhân chỉ người khác trong cộng đồng. “Người lân cận” vừa quen thuộc trong văn phong Kinh Thánh vừa dễ hiểu.
theological_decisions:
- issue: Phân biệt hai động từ chỉ sự ham muốn trong điều răn
  choice: Dịch חמד là “ham muốn” và אוה là “khao khát”
  alternative: Dịch cả hai bằng cùng một từ như “ham muốn” hoặc “tham muốn”
  rationale: Bản Hebrew dùng hai động từ gần nghĩa nhưng khác nhau. Giữ hai cách diễn đạt giúp phản ánh cấu trúc tu từ và bảo tồn sắc thái của nguyên văn mà không khẳng định một khác biệt thần học quá mức.
- issue: Cách dịch các thuật ngữ về địa vị nô lệ
  choice: Dùng “nô lệ nam” và “nô lệ nữ”
  alternative: Dùng “đầy tớ nam” và “đầy tớ nữ”
  rationale: Ngữ cảnh liệt kê tài sản của gia hộ khiến địa vị lệ thuộc nổi bật. “Nô lệ” trình bày thẳng thực tại xã hội của văn bản, còn các từ chỉ giới tính bảo tồn cặp tương ứng trong nguyên văn.
- issue: Phạm vi nghĩa của בַּיִת
  choice: Dùng “nhà” trong chính văn và ghi chú khả năng chỉ gia hộ hoặc gia sản
  alternative: Dịch trực tiếp là “gia sản” hoặc “gia hộ”
  rationale: Danh mục theo sau thiên về nghĩa tài sản, nhưng danh từ Hebrew vẫn có độ rộng ngữ nghĩa. Chính văn dùng từ phổ thông nhất, còn chú thích bảo lưu sự mơ hồ thật của nguồn.
translation_notes:
  register: Dùng lối xưng hô luật pháp “ngươi” để giữ sắc thái trực tiếp, trang trọng của điều răn, nhưng cấu trúc câu và từ vựng vẫn hiện đại, dễ hiểu. Tránh các từ Hán-Việt quá chuyên biệt; dùng dấu chấm phẩy để làm rõ hai vế cấm song song.
