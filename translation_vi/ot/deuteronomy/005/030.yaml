  source_fidelity: Bản dịch giữ đúng hai mệnh lệnh số ít liên tiếp dành cho Môi-se ("Hãy đi nói") và lời truyền đạt ở số nhiều dành cho dân chúng ("Hãy trở về"). "lều của mình" diễn đạt tự nhiên ý quay về các lều riêng của họ; tuy danh từ tiếng Việt không đánh dấu số nhiều, ngữ cảnh với chủ thể số nhiều làm rõ nghĩa phân phối.
  naturalness: 'Câu văn hiện đại, rõ ràng và phù hợp văn phong Kinh Thánh trang trọng. Cấu trúc "Hãy đi nói với họ: ..." tự nhiên trong tiếng Việt.'
  terminology: '"Trở về" phản ánh tốt שוב trong ngữ cảnh này, và "lều" giữ hình ảnh cụ thể của אָהֳלֵיכֶם, không hiện đại hóa thành nhà ở. Không cần dùng cách xưng hô cổ "các ngươi" vì "mình" quy chiếu tự nhiên đến nhóm người được nói tới.'
