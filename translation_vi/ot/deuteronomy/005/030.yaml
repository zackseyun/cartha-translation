base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/030.yaml
  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: vi
  text: 'Hãy đi nói với họ: ‘Hãy trở về lều của mình.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: Hãy đi
  rationale: Mệnh lệnh số ít của הלך, trực tiếp sai Môi-se đi truyền lời; “Hãy đi” tự nhiên và giữ rõ sắc thái mệnh lệnh.
- source_word: אֱמֹר
  choice: nói với
  rationale: Mệnh lệnh số ít của אמר, chỉ hành vi truyền đạt lời tiếp theo; kết hợp “đi nói với họ” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לָהֶם
  choice: họ
  rationale: Giới từ לְ với hậu tố ngôi thứ ba số nhiều giống đực, biểu thị đối tượng tiếp nhận lời nói; tiếng Việt diễn đạt bằng “với họ”.
- source_word: שׁוּבוּ
  choice: Hãy trở về
  rationale: Mệnh lệnh số nhiều của שוב, ở đây chỉ việc dân chúng quay lại nơi ở trước đó sau cuộc thần hiện; “trở về” vừa rõ hướng vừa trang trọng tự nhiên.
- source_word: לָכֶם
  choice: của mình
  rationale: Cụm לָכֶם đi với động từ שוב mang ý trở lại nơi thuộc về chính họ. Tiếng Việt tự nhiên gộp ý này với danh từ theo sau thành “lều của mình”.
- source_word: לְאָהֳלֵיכֶם
  choice: lều
  rationale: Nghĩa cụ thể là “lều của các ngươi/các ông.” “Lều” giữ nguyên bối cảnh lịch sử, thay vì khái quát hóa thành “nhà” hay “nơi ở”.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “mình” theo lối quy chiếu tập thể tự nhiên trong tiếng Việt, tránh “các ngươi” vốn dễ tạo sắc thái cổ hoặc miệt thị. Không đặt chú thích theo bản tiếng Anh vì phương án “Go back to your tents” phát sinh từ khả năng gộp nghĩa trong tiếng Anh, còn nguyên văn Hê-bơ-rơ có hai mệnh lệnh riêng: “đi” và “hãy trở về”.'
