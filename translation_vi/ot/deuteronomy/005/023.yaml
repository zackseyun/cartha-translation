base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: vi
  text: Khi anh em nghe tiếng nói từ giữa bóng tối[a], trong lúc núi đang cháy rực trong lửa, thì anh em đã đến gần tôi—tất cả các trưởng tộc và các trưởng lão của anh em—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “âm thanh”; từ Hê-bơ-rơ qôl có thể chỉ âm thanh hoặc tiếng nói, nhưng trong văn cảnh Đức Chúa Trời đang phán, “tiếng nói” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: Khi anh em nghe
  rationale: Cấu trúc kể chuyện kết hợp כְּ với động từ שׁמע mang ý nghĩa thời gian. Tiếng Việt tự nhiên diễn đạt bằng “Khi anh em nghe”, không cần dịch máy móc thành “Và xảy ra khi”.
- source_word: הַקּוֹל
  choice: tiếng phán
  rationale: קוֹל có thể chỉ “tiếng” hoặc “giọng nói”. Trong văn cảnh Đức Chúa Trời đang nói, “tiếng phán” vừa biểu thị lời nói có chủ thể, vừa giữ sắc thái trang nghiêm; chú thích vẫn ghi nhận nghĩa rộng hơn.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: từ giữa bóng tối
  rationale: Giữ hình ảnh không gian của תּוֹךְ (“giữa, ở giữa”) mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: trong lúc núi đang cháy rực trong lửa
  rationale: Waw được hiểu theo nghĩa hoàn cảnh đồng thời; phân từ בֹּעֵר diễn tả trạng thái đang tiếp diễn. “Cháy rực trong lửa” giữ hình ảnh mạnh của nguyên văn.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: thì anh em đã đến gần tôi
  rationale: קרב diễn tả việc tiến đến gần Môi-se. “Thì” nối tự nhiên với mệnh đề thời gian mở đầu, còn “đã” đánh dấu sự việc hoàn tất trong lời hồi thuật.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: tất cả những người đứng đầu các bộ tộc
  rationale: רָאשִׁים theo nghĩa đen là “những cái đầu”, nhưng ở đây chỉ giới lãnh đạo. Cách dịch này truyền đạt rõ chức năng đại diện mà không dùng ẩn dụ gượng trong tiếng Việt.
- source_word: וְזִקְנֵיכֶם
  choice: và các trưởng lão của anh em
  rationale: זְקֵנִים trong ngữ cảnh này là các vị lãnh đạo được công nhận của cộng đồng, không chỉ đơn thuần là người cao tuổi.
