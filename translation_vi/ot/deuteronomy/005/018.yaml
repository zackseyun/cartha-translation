  text: And you shall not commit adultery[a].
translation:
  language: vi
  text: Và ngươi không được ngoại tình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch gọn: “Ngươi chớ ngoại tình.” Tiếng Hê-bơ-rơ có liên từ “và”, nối điều răn này với các điều răn chung quanh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: Và ... không được
  rationale: Tiền tố וְ liên kết điều răn này với chuỗi điều răn chung quanh nên được giữ bằng “Và”. לֹא đi với thể chưa hoàn thành trong văn luật pháp diễn đạt lệnh cấm dứt khoát; “không được” tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: תִּנְאָף
  choice: ngươi ... ngoại tình
  rationale: Động từ נאף ở Qal, ngôi hai giống đực số ít, chỉ hành vi ngoại tình. “Ngoại tình” là cách diễn đạt chính xác, thông dụng và giữ được ý nghĩa vi phạm sự chung thủy hôn nhân.
theological_decisions:
- issue: Cách diễn đạt lệnh cấm ở ngôi hai số ít trong luật giao ước
  choice: Và ngươi không được ngoại tình.
  alternative: Ngươi chớ ngoại tình.
  rationale: “Ngươi” giữ lời xưng hô trực tiếp ở số ít của tiếng Hê-bơ-rơ, còn “không được” truyền đạt rõ sức nặng của lệnh cấm bằng tiếng Việt hiện đại. Giữ “Và” để phản ánh sự liên kết của câu này với các điều răn chung quanh mà không thêm cách giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ ngôi hai số ít và sắc thái trực tiếp của lời giao ước; tránh từ cổ hơn như “phạm gian dâm”.
