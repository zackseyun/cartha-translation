revisions:
- from: Ngươi không được phủ phục trước chúng hoặc phụng sự chúng[a], vì Ta, Yahweh Đức Chúa Trời của ngươi, là Đức Chúa Trời ghen tương, truy xét tội lỗi của cha ông nơi con cháu, đến đời thứ ba và đời thứ tư[b], là những kẻ ghét Ta[c].
  to: Ngươi không được phủ phục trước chúng[a] hoặc phụng sự chúng, vì Ta, Yahweh, Đức Chúa Trời của ngươi, là Đức Chúa Trời ghen tương, truy xét tội lỗi của cha ông trên con cháu, đến đời thứ ba và đời thứ tư của những kẻ ghét Ta[b][c].
  rationale: Bản sửa giữ các lựa chọn từ vựng chính của bản thảo, nhưng dùng “trên con cháu” sát hơn với עַל và đổi phần cuối thành “của những kẻ ghét Ta” để bảo toàn độ mở cú pháp của nguyên văn. Dấu câu và vị trí chú thích cũng được chỉnh cho rõ ràng.
  reviewer_model: gpt-5.6-terra
