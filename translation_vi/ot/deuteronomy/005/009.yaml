  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: vi
  text: Ngươi không được phủ phục trước chúng[a] hoặc phụng sự chúng, vì Ta, Yahweh, Đức Chúa Trời của ngươi, là Đức Chúa Trời ghen tương, truy xét tội lỗi của cha ông trên con cháu, đến đời thứ ba và đời thứ tư của những kẻ ghét Ta[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Động từ Hê-bơ-rơ chỉ hành động cúi mình hoặc sấp mình để tỏ lòng tôn kính; cũng có thể dịch: “sấp mình trước chúng.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn chỉ nói “trên thứ ba và trên thứ tư”; từ “đời” được thêm vào để làm rõ ý về các thế hệ.
    reason: lexical_alternative
  - marker: c
    text: Cụm “của những kẻ ghét Ta” đứng cuối mệnh đề trong nguyên văn. Cụm này có thể liên hệ với phạm vi của sự truy xét; câu này không giải thích đầy đủ cách trách nhiệm của cha ông liên hệ với trách nhiệm của con cháu.
    reason: theological_ambiguity
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: phủ phục trước chúng
  rationale: Giữ hành động cụ thể là cúi mình hoặc sấp mình tỏ lòng tôn kính, đồng thời phân biệt với động từ “phụng sự” theo sau.
- source_word: תָעָבְדֵם
  choice: phụng sự chúng
  rationale: Diễn đạt sự phục vụ mang tính thờ phượng dành cho thần tượng, nhưng không nhập làm một với động từ “phủ phục”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Chuyển tải trực tiếp danh xưng giao ước cùng hậu tố ngôi thứ hai số ít.
- source_word: אֵל קַנָּא
  choice: Đức Chúa Trời ghen tương
  rationale: “Ghen tương” giữ được đòi hỏi độc quyền trong giao ước và sự không dung nhận việc thờ các thần khác.
- source_word: פֹּקֵד
  choice: truy xét
  rationale: “Truy xét” mang sắc thái tư pháp, đủ rộng để bao hàm việc xét đến, quy trách nhiệm và trừng phạt mà không thu hẹp nghĩa chỉ còn một hành động.
- source_word: עֲוֺן
  choice: tội lỗi
  rationale: Cách nói tự nhiên trong tiếng Việt, vẫn có thể bao hàm hành vi sai trái và trách nhiệm phát sinh từ hành vi ấy.
- source_word: אָבוֹת
  choice: cha ông
  rationale: Giữ sắc thái nam tính của danh từ Hê-bơ-rơ, đồng thời tự nhiên hơn “các người cha” khi nói về các thế hệ trước.
- source_word: עַל בָּנִים
  choice: nơi con cháu
  rationale: Trong ngữ cảnh các thế hệ, בנים chỉ hậu duệ nói chung; “con cháu” diễn đạt tự nhiên phạm vi liên thế hệ.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: đến đời thứ ba và đời thứ tư
  rationale: Bổ sung “đời” để làm rõ thành ngữ Hê-bơ-rơ; ý niệm thế hệ được hàm chứa nhưng không có danh từ tương ứng trong nguyên văn.
- source_word: לְשֹׂנְאָי
  choice: là những kẻ ghét Ta
  rationale: Đặt cụm từ cuối câu theo nguyên văn và nối rõ với những người thuộc các thế hệ đang được nói đến, nhưng không giải thích quá mức quan hệ thần học.
theological_decisions:
- issue: Cách diễn đạt sự ghen tương của Đức Chúa Trời
  choice: Đức Chúa Trời ghen tương
  alternative: Đức Chúa Trời đầy lòng sốt sắng
  rationale: Ngữ cảnh nói về quyền đòi hỏi sự thờ phượng độc nhất trong giao ước; “ghen tương” giữ sức nặng quan hệ này hơn “sốt sắng”.
- issue: Quan hệ giữa tội của cha ông, các thế hệ sau và cụm “những kẻ ghét Ta”
  choice: Giữ “là những kẻ ghét Ta” ở cuối và để nó xác định các đối tượng bị truy xét mà không giải thích thêm trong chính câu
  alternative: Diễn giải rằng mọi hậu duệ tự động chịu phạt chỉ vì tội của tổ tiên, hoặc ngược lại viết rõ rằng chỉ hậu duệ nào tiếp tục phạm tội mới chịu phạt
  rationale: Cú pháp cuối câu cho thấy cụm này giới hạn hoặc mô tả phạm vi phán xét, nhưng nguyên văn vẫn có độ căng về trách nhiệm liên thế hệ. Bản dịch không áp đặt một hệ thống thần học nhằm xóa bỏ độ căng ấy.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng đại từ “Ta—ngươi” để phù hợp lời phán trực tiếp mang sắc thái giao ước. “Phủ phục,” “phụng sự” và “truy xét” giữ nét trang nghiêm nhưng vẫn thông dụng; dấu câu được sắp xếp để câu dài của nguyên văn dễ đọc trong tiếng Việt.
