  edition: WLC
  text: אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: vi
  text: Ta là Yahweh, Đức Chúa Trời của ngươi, Đấng đã đưa ngươi ra khỏi đất Ai Cập, khỏi nhà nô lệ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “khỏi cảnh nô lệ.” Theo nghĩa sát chữ, tiếng Hê-bơ-rơ là “khỏi nhà của những người nô lệ.”'
    reason: Giải thích cách diễn đạt thành ngữ “nhà nô lệ”, đồng thời bảo lưu hình ảnh “nhà” và danh từ số nhiều “nô lệ” của nguyên văn.
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Ta là
  rationale: Đại từ ngôi thứ nhất độc lập đứng trong mệnh đề không có động từ; tiếng Việt tự nhiên cần thêm “là”. “Ta” phù hợp với lời tự xưng trang trọng của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước יהוה, không thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Chỉ Đức Chúa Trời chân thật trong ngữ cảnh giao ước; hậu tố ngôi hai số ít giống đực được thể hiện bằng “của ngươi”.
- source_word: אֲשֶׁר
  choice: Đấng
  rationale: Đại từ quan hệ quy chiếu về Yahweh; “Đấng” tạo câu tiếng Việt tự nhiên, trang trọng mà vẫn giữ quan hệ ngữ pháp.
- source_word: הוֹצֵאתִיךָ
  choice: đã đưa ngươi ra
  rationale: Dạng Hiphil của יצא mang nghĩa khiến đi ra hoặc đưa ra; “đưa ... ra” diễn đạt trực tiếp hành động giải phóng khỏi Ai Cập.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: khỏi đất Ai Cập
  rationale: מִן chỉ nguồn hoặc nơi rời khỏi; “khỏi” phối hợp tự nhiên với “đưa ... ra” và tránh lặp từ không cần thiết.
- source_word: מִבֵּית עֲבָדִים
  choice: khỏi nhà của những người nô lệ
  rationale: Giữ hình ảnh cụ thể của בֵּית (“nhà”) và danh từ số nhiều עֲבָדִים (“những người nô lệ”), thay vì chuyển thành danh từ trừu tượng “cảnh nô lệ”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה. Giữ “Yahweh” bảo tồn tính chất danh riêng và không thay nó bằng tước hiệu.
- issue: Cách hiểu עֲבָדִים trong công thức xuất hành
  choice: những người nô lệ
  alternative: cảnh nô lệ
  rationale: עֲבָדִים là danh từ số nhiều chỉ người. Bản dịch chính giữ hình ảnh xã hội cụ thể, còn cách diễn đạt trừu tượng hơn được ghi ở chú thích.
- issue: Ngôi xưng hô số ít trong lời giao ước
  choice: Ta ... ngươi
  alternative: Ta ... các ngươi
  rationale: Các hậu tố trong câu là ngôi thứ hai số ít giống đực. Bản dịch giữ số ít, dù lời này được công bố cho toàn thể Israel.
translation_notes:
  register: Văn phong trang trọng, hiện đại. Cặp xưng hô “Ta—ngươi” giữ tính long trọng và số ít của nguyên văn. “Nhà của những người nô lệ” hơi khác lối nói thường ngày nhưng được giữ có chủ ý để bảo tồn hình ảnh cụ thể của tiếng Hê-bơ-rơ; chú thích cung cấp các cách diễn đạt tự nhiên hơn.
