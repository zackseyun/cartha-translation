source:
  edition: WLC
  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: vi
  text: Ngươi không được làm cho mình một tượng chạm khắc[a], hay bất cứ hình tượng nào[b] về những gì ở trên trời cao, dưới đất, hoặc trong nước ở dưới đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “thần tượng”; từ Hê-bơ-rơ thường chỉ một hình tượng được dùng trong việc thờ thần tượng, nhưng ở đây giữ cách diễn đạt cụ thể hơn.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “bất cứ hình dạng nào”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: tượng chạm
  rationale: Giữ nghĩa cụ thể của một hình tượng được đục hoặc chạm, thường được dùng trong bối cảnh thờ thần tượng, nhưng không diễn giải trước thành “thần tượng”.
- source_word: תְּמוּנָה
  choice: hình dạng
  rationale: Diễn đạt nghĩa hình thể hay hình giống; ở đây cụm từ mở rộng phạm vi cấm đoán vượt ra ngoài riêng tượng chạm.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Ngươi không được làm cho mình
  rationale: Thể hiện sức nặng cấm đoán của luật giao ước và giữ thành tố לְךָ, chỉ việc làm cho chính mình hoặc để mình sử dụng.
- source_word: כָּל תְּמוּנָה
  choice: bất cứ hình dạng nào
  rationale: Trong câu phủ định, כָּל được diễn đạt tự nhiên bằng “bất cứ… nào”, truyền đạt phạm vi bao quát.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: của những gì ở trên trời cao
  rationale: Giữ mệnh đề quan hệ cùng sự đối lập không gian giữa phía trên và phía dưới; “những gì” không giới hạn đối tượng vào sinh vật hay đồ vật.
- source_word: בָּאָרֶץ מִתָּחַת
  choice: dưới đất thấp
  rationale: Cách nói gọn, tự nhiên, giữ sự tương phản theo chiều dọc với “trên trời cao” mà không hàm ý ở trong lòng đất.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: trong nước phía dưới đất
  rationale: Phản ánh trực tiếp hình ảnh không gian của bản Hê-bơ-rơ về nước ở dưới đất, không hiện đại hóa quan niệm này.
theological_decisions:
- issue: Phạm vi lệnh cấm hình tượng
  choice: Dịch như lệnh cấm làm tượng chạm hoặc bất cứ hình dạng nào, không thêm ý thờ phượng.
  alternative: Diễn giải thành lệnh cấm làm thần tượng để thờ.
  rationale: Câu 8 nói đến việc làm hình tượng; hành vi quỳ lạy và phụng thờ được nêu rõ ở câu 9. Giữ nguyên tiến trình này tránh đưa phần giải thích thần học của câu kế tiếp vào câu hiện tại.
translation_notes:
  register: Văn phong luật giao ước trang trọng nhưng dễ hiểu. Dùng “Ngươi” để phù hợp lời phán trực tiếp ở số ít trong Mười Điều Răn; tránh từ cổ “tượng chạm trổ” hay cách diễn giải mang tính hệ phái.
