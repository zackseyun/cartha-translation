base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: vi
  text: 'Anh em đã nói: “Này, CHÚA, Đức Chúa Trời của chúng ta, đã cho chúng ta thấy vinh quang và sự vĩ đại của Ngài; chúng ta đã nghe tiếng Ngài từ giữa ngọn lửa. Hôm nay, chúng ta đã thấy rằng Đức Chúa Trời có thể phán với con người mà người ấy vẫn sống.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: CHÚA
  rationale: Dùng lối trình bày trang trọng, quen thuộc trong tiếng Việt cho danh riêng YHWH, đồng thời giữ cách phân biệt bằng chữ hoa.
- source_word: הֶרְאָנוּ
  choice: đã cho chúng ta thấy
  rationale: 'Diễn đạt đúng thể khiến của động từ ראה: chính CHÚA khiến dân được thấy vinh quang và sự vĩ đại của Ngài.'
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: từ giữa ngọn lửa
  rationale: Bám sát hình ảnh không gian của nguyên văn, thay vì giản lược thành “từ ngọn lửa”.
- source_word: יְדַבֵּר אֱלֹהִים אֶת הָאָדָם וָחָי
  choice: Đức Chúa Trời có thể phán với con người mà người ấy vẫn sống
  rationale: “Có thể” phù hợp với lời kết luận về khả năng một việc xảy ra; “mà ... vẫn sống” làm rõ sự tương phản đáng kinh ngạc trong וָחָי mà không giải thích quá mức.
theological_decisions:
- issue: Khả năng con người nghe Đức Chúa Trời phán mà vẫn sống
  choice: có thể phán với con người mà người ấy vẫn sống
  alternative: phán với con người và người ấy sống
  rationale: 'Cách chọn giữ trọng tâm của lời chứng: cuộc gặp gỡ với tiếng phán của Đức Chúa Trời không tất yếu dẫn đến cái chết. Từ “có thể” diễn đạt giá trị khái quát của mệnh đề sau כִּי, không biến câu thành một tuyên bố giáo lý rộng hơn nguyên văn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện số nhiều của וַתֹּאמְרוּ trong lời Môi-se nói với dân; “Này” giữ sắc thái chú ý của הֵן. Đại từ “Ngài” được dùng kính trọng nhưng không thêm tước hiệu ngoài nguyên văn.
