  source_fidelity: 'Bản dịch bám sát các thành phần chính của tiếng Hê-bơ-rơ: הֵן được chuyển là “Này”; động từ thể khiến הֶרְאָנוּ là “đã cho chúng ta thấy”; “từ giữa ngọn lửa” phản ánh מִתּוֹךְ הָאֵשׁ; và mệnh đề cuối giữ được điều đáng kinh ngạc rằng Đức Chúa Trời phán với con người mà người ấy vẫn sống. “Có thể phán” là cách diễn đạt khả năng phù hợp ngữ cảnh kết luận của dân chúng và cũng tương ứng với audit trail tiếng Anh, không áp đặt một giải thích giáo phái.'
