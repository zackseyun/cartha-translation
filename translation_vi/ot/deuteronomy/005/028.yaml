source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת ק֣וֹל דִּבְרֵי/כֶ֔ם בְּ/דַבֶּרְ/כֶ֖ם אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שָׁ֠מַעְתִּי אֶת ק֨וֹל דִּבְרֵ֜י הָ/עָ֤ם הַ/זֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔י/ךָ הֵיטִ֖יבוּ כָּל אֲשֶׁ֥ר דִּבֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: vi
  text: 'Đức Giê-hô-va đã nghe lời các ngươi khi các ngươi nói với ta[a], rồi Đức Giê-hô-va phán với ta: “Ta đã nghe lời của dân này mà họ đã nói với ngươi. Họ đã nói phải lẽ trong mọi điều họ đã nói[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “tiếng của lời các ngươi”; đây là một thành ngữ thính giác trong tiếng Hê-bơ-rơ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Họ đã làm tốt trong mọi điều họ đã nói.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để thể hiện danh riêng giao ước יהוה, thay vì thay bằng tước hiệu “Chúa”.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: nghe / đã nghe
  rationale: Động từ שׁמע ở đây nói đến việc nghe lời dân đã nói; “đã nghe” trong lời trực tiếp diễn đạt hành động đã hoàn tất.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: tiếng lời các ngươi / tiếng lời của dân này
  rationale: Giữ sắc thái thính giác của thành ngữ Hê-bơ-rơ קול דבריכם; cách nói hơi trang trọng nhưng vẫn hiểu được trong tiếng Việt.
- source_word: בְּדַבֶּרְכֶם אֵלַי
  choice: khi các ngươi nói với ta
  rationale: Giới từ ב với động từ nguyên mẫu chỉ hành động đồng thời; “khi” diễn đạt tự nhiên quan hệ thời gian.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: Phản ánh danh từ tập hợp số ít עָם cùng đại từ chỉ định, tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: mà họ đã nói với ngươi
  rationale: Giữ mệnh đề quan hệ và mối liên hệ từ vựng với các lần dùng דבר trong câu.
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: Mọi điều họ nói đều phải lẽ
  rationale: Trong ngữ cảnh đánh giá lời nói, הֵיטִיבוּ mang ý họ nói đúng hoặc hợp lẽ; cấu trúc tiếng Việt này tự nhiên và vẫn bảo toàn phạm vi toàn thể của כָּל אֲשֶׁר.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Hằng Hữu; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Bản dịch giữ một danh riêng đã quen thuộc trong truyền thống tiếng Việt, không thay bằng một tước hiệu chung.
- issue: Ý nghĩa của הֵיטִיבוּ khi đánh giá lời dân nói
  choice: Mọi điều họ nói đều phải lẽ
  alternative: Họ đã làm tốt mọi điều họ nói; họ đã nói tốt mọi điều
  rationale: Động từ Hiphil của יטב có thể mang nghĩa “làm tốt/làm đúng”; ngữ cảnh gắn trực tiếp sự đánh giá với lời nói nên dịch là “phải lẽ”, đồng thời ghi chú khả năng hiểu sát hơn là “họ đã làm tốt”.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “ta/các ngươi/ngươi” giữ sắc thái diễn từ giao ước và phân biệt rõ số nhiều với số ít: dân chúng nói với Môi-se, còn Đức Giê-hô-va nói với Môi-se.'
