source:
  edition: WLC
  text: לֹא יִהְיֶ֥ה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/007.yaml
  text: You shall have no other gods before me[a].
translation:
  language: vi
  text: Ngươi không được có các thần khác trước mặt Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngoài Ta.” Tiếng Hê-bơ-rơ theo nghĩa đen là “trước mặt Ta,” một cách nói có thể diễn tả cả sự hiện diện lẫn tính độc quyền.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Diễn đạt tự nhiên sức mạnh cấm đoán của từ phủ định trong điều răn.
- source_word: יִהְיֶה לְךָ
  choice: Ngươi ... có
  rationale: Cấu trúc היה với לְךָ diễn tả sự hiện hữu hoặc sở hữu trong quan hệ với người được nói đến; tiếng Việt tự nhiên dùng động từ “có”. Đại từ số ít giữ cách Đức Chúa Trời phán với Israel như một đối tác giao ước.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: Danh từ số nhiều đi với tính từ “khác” chỉ các thần đối nghịch; cách dịch này trực tiếp và không thêm sắc thái “ngoại bang” vốn không nằm rõ trong từ ngữ.
- source_word: עַל פָּנָי
  choice: trước mặt Ta
  rationale: Giữ hình ảnh sát nghĩa “trước mặt Ta”, bao hàm sự hiện diện và không tự ý thu hẹp câu chỉ còn ý độc quyền.
theological_decisions:
- issue: Ý nghĩa của cụm עַל פָּנָי ở cuối lời cấm
  choice: trước mặt Ta
  alternative: ngoài Ta
  rationale: Cụm Hê-bơ-rơ có thể chỉ sự hiện diện (“trước mặt Ta”) và trong ngữ cảnh cấm đoán cũng có thể hàm ý độc quyền (“ngoài Ta”). Bản văn chính giữ cách diễn đạt gần nguyên ngữ, còn chú thích bảo lưu cách hiểu thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngươi” và “Ta” để duy trì lời phán trực tiếp ở ngôi số ít cùng sắc thái giao ước; “trước mặt Ta” vừa tự nhiên trong tiếng Việt vừa giữ được hình ảnh của nguyên ngữ.
