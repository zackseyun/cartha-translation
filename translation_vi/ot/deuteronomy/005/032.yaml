id: DEU.5.32
reference: Deuteronomy 5:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם לַ/עֲשׂ֔וֹת כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֶתְ/כֶ֑ם לֹ֥א תָסֻ֖רוּ יָמִ֥ין וּ/שְׂמֹֽאל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: vi
  text: Vậy, anh em phải cẩn thận làm đúng như Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em; đừng lệch sang bên phải hay bên trái.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đừng lệch sang bên phải hay bên trái” là thành ngữ Híp-ri, nghĩa là không được sai lệch theo bất cứ hướng nào khỏi điều Đức Chúa Trời đã truyền.
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: phải cẩn thận làm
  rationale: שׁמר đi với động từ nguyên mẫu chỉ mục đích diễn tả sự chú tâm dẫn đến vâng làm; cách dịch này tự nhiên trong tiếng Việt và giữ sức nặng khuyên truyền.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Cụm từ đòi hỏi hành động phải phù hợp chính xác với điều đã được truyền.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Thể hoàn thành Híp-ri chỉ mệnh lệnh đã được ban và vẫn có hiệu lực; “đã truyền” diễn đạt tự nhiên điều đó.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Dạng liên kết với hậu tố ngôi thứ hai số nhiều mang nghĩa sở hữu và giao ước; “anh em” phù hợp lời Môi-se nói với cộng đồng Israel.
- source_word: לֹא תָסֻרוּ
  choice: đừng lệch
  rationale: סור ở đây mang nghĩa ẩn dụ là rời khỏi đường lối được truyền; “lệch” rõ nghĩa và vẫn giữ hình ảnh về phương hướng.
- source_word: יָמִין וּשְׂמֹאל
  choice: sang bên phải hay bên trái
  rationale: Giữ nguyên thành ngữ phương hướng của tiếng Híp-ri, chỉ việc không được sai lệch theo bất cứ hướng nào.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng Danh Bốn Chữ; phiên âm “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng tước hiệu.
- issue: Phạm vi của lời truyền
  choice: làm đúng như Yahweh... đã truyền
  alternative: làm mọi điều Yahweh... đã truyền
  rationale: Nguyên văn không có từ tương ứng rõ ràng với “mọi điều”; bản dịch không thêm từ này, nhờ đó bám sát cấu trúc và phạm vi diễn đạt của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho hậu tố ngôi thứ hai số nhiều nhằm giữ lời xưng hô với toàn thể cộng đồng; dấu chú thích [a] được đặt ngay sau thành ngữ mà chú thích giải thích.
source_grounding:
  english_pob_role: consult_only
