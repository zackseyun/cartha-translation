source:
  edition: WLC
  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: vi
  text: Vậy bây giờ, tại sao chúng ta phải chết? Vì ngọn lửa lớn này sẽ thiêu nuốt chúng ta. Nếu chúng ta còn tiếp tục nghe tiếng của Yahweh, Đức Chúa Trời của chúng ta, thì chúng ta sẽ chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Còn bây giờ
  rationale: Giữ cả lực nối tiếp của וְ lẫn ý nghĩa thời điểm của עַתָּה, đồng thời mở ra kết luận tức thời của dân chúng từ sự hiện hiện trước đó.
- source_word: לָמָּה נָמוּת
  choice: tại sao chúng ta phải chết?
  rationale: Câu hỏi tu từ diễn tả viễn cảnh đáng sợ; “phải chết” tự nhiên trong tiếng Việt và không biến động từ chưa hoàn thành thành một lời tiên báo đơn thuần.
- source_word: כִּי תֹאכְלֵנוּ
  choice: Vì ... sẽ thiêu nuốt chúng ta
  rationale: כִּי nêu lý do; động từ אכל có nghĩa đen là “ăn/nuốt”, và với lửa làm chủ thể, “thiêu nuốt” vừa tự nhiên vừa giữ hình ảnh mạnh của nguyên văn.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: ngọn lửa lớn này
  rationale: Cách sắp xếp tự nhiên trong tiếng Việt, giữ danh từ, tính từ và đại từ chỉ định của tiếng Hebrew.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: Nếu chúng ta cứ tiếp tục nghe
  rationale: יסף kết hợp với động từ nguyên mẫu diễn tả tiếp tục hay làm thêm; “cứ tiếp tục nghe” truyền đạt sắc thái kéo dài và nỗi sợ của người nói.
- source_word: קוֹל יְהוָה אֱלֹהֵינוּ
  choice: tiếng của Yahweh, Đức Chúa Trời chúng ta
  rationale: קוֹל trong ngữ cảnh lời phán được dịch là “tiếng”; danh Yahweh được giữ như tên riêng, còn אֱלֹהֵינוּ được dịch theo cấu trúc sở hữu giao ước.
- source_word: עוֹד
  choice: tiếp tục
  rationale: Trong mệnh đề điều kiện, từ này nhấn mạnh việc còn nghe thêm nữa; ý nghĩa được diễn đạt tự nhiên cùng “cứ tiếp tục” thay vì lặp một trạng từ riêng.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Giữ “Yahweh” bảo tồn tính chất tên riêng, không thay bằng một tước hiệu hay dạng phiên âm truyền thống khác.
- issue: Sắc thái của נָמוּת trong câu hỏi tu từ
  choice: phải chết
  alternative: sẽ chết
  rationale: “Phải chết” giữ sắc thái lo sợ và chất vấn về kết cục, trong khi “sẽ chết” có thể khiến câu hỏi đầu nghe như một dự báo thuần túy. Ở cuối câu, וָמָתְנוּ được dịch thẳng là “chúng ta sẽ chết”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thiêu nuốt” để giữ ẩn dụ lửa ăn nuốt của tiếng Hebrew mà vẫn tự nhiên trong tiếng Việt; giữ tên riêng “Yahweh” theo dữ liệu dự án.
