  text: You shall not bear false witness against your neighbor[a].
translation:
  language: vi
  text: Ngươi không được làm chứng gian chống lại người lân cận của ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngươi không được khai man chống lại người lân cận của ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Diễn đạt tự nhiên sức mạnh cấm đoán của לֹא với động từ chưa hoàn thành trong Mười Điều Răn.
- source_word: תַעֲנֶה
  choice: làm chứng
  rationale: Động từ ענה có nghĩa cơ bản là đáp lại, nhưng khi đi với עֵד trong ngữ cảnh pháp lý thì chỉ hành vi đưa ra lời chứng.
- source_word: בְרֵעֲךָ
  choice: chống lại người lân cận mình
  rationale: רֵעַ chỉ người lân cận hoặc người đồng loại; giới từ בְ trong kết cấu pháp lý này được diễn đạt tự nhiên là “chống lại”.
- source_word: עֵד שָׁוְא
  choice: chứng gian
  rationale: Cụm từ chỉ lời chứng sai dối hoặc vô căn cứ; “chứng gian” là thành ngữ pháp lý ngắn gọn, rõ nghĩa và quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, trực tiếp, phù hợp thể mệnh lệnh của Mười Điều Răn. Dùng “ngươi” để giữ cách xưng hô số ít trong nguyên văn; “người lân cận” dễ hiểu trong tiếng Việt hiện đại, còn “làm chứng gian” bảo toàn sắc thái pháp lý.
