reference: Deuteronomy 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: vi
  text: 'Môi-se triệu tập toàn thể Y-sơ-ra-ên và nói với họ: “Hỡi Y-sơ-ra-ên, hãy lắng nghe[a] những luật lệ và phán quyết[b] mà hôm nay tôi nói cho anh em nghe. Hãy học biết, tuân giữ và thực hành những điều ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hãy nghe”. Động từ Hê-bơ-rơ có thể chỉ sự chú tâm lắng nghe dẫn đến vâng phục, chứ không chỉ tiếp nhận âm thanh.
    reason: lexical_alternative
  - marker: b
    text: “Phán quyết” cũng có thể dịch là “quy định”, “điều lệ” hoặc “luật lệ”. Từ Hê-bơ-rơ chỉ những quyết định pháp lý hoặc chuẩn mực đã được quy định.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: triệu tập
  rationale: Trong bối cảnh Môi-se gọi toàn dân đến để nghe lời giao ước, “triệu tập” diễn đạt tự nhiên hành động tập hợp mà không biến nó thành một nghi thức chuyên biệt.
- source_word: כָּל יִשְׂרָאֵל
  choice: toàn thể Y-sơ-ra-ên
  rationale: Giữ cách gọi tập thể dành cho cả dân tộc và không thu hẹp đối tượng vào một nhóm đại diện.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Hỡi Y-sơ-ra-ên, hãy lắng nghe
  rationale: “Lắng nghe” diễn đạt sự chú tâm tiếp nhận, đồng thời vẫn để văn cảnh cho thấy việc nghe phải dẫn đến vâng làm.
- source_word: הַחֻקִּים
  choice: những luật lệ
  rationale: Diễn đạt các quy định đã được thiết lập bằng một từ pháp lý rõ ràng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: הַמִּשְׁפָּטִים
  choice: phán quyết
  rationale: Giữ sắc thái tư pháp và duy trì sự phân biệt với חֻקִּים, dù từ này cũng có thể chỉ các quy định hay điều lệ.
- source_word: דֹּבֵר בְּאָזְנֵיכֶם הַיּוֹם
  choice: mà hôm nay tôi nói cho anh em nghe
  rationale: Diễn đạt tự nhiên thành ngữ “nói vào tai anh em”, đồng thời giữ tính trực tiếp và thời điểm hiện tại của lời công bố.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: Hãy học biết ... những điều ấy
  rationale: “Học biết” bao hàm việc tiếp nhận và nắm vững các luật lệ, thay vì chỉ nghe thoáng qua.
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: tuân giữ và thực hành những điều ấy
  rationale: Giữ cả ý bảo toàn, tuân thủ của שׁמר lẫn hành động thực tế của עשׂה bằng hai động từ tiếng Việt rõ ràng.
theological_decisions:
- issue: Sức nặng giao ước của שׁמע
  choice: hãy lắng nghe
  alternative: hãy nghe
  rationale: “Lắng nghe” cho thấy đây không chỉ là tiếp nhận âm thanh mà là chú tâm đón nhận lời truyền dạy; mệnh lệnh thực hành ở cuối câu làm rõ chiều kích vâng phục mà không cần đưa thêm ý ấy vào chính động từ.
- issue: Phân biệt cặp thuật ngữ pháp luật חֻקִּים / מִשְׁפָּטִים
  choice: luật lệ và phán quyết
  alternative: quy định và điều lệ
  rationale: Bản dịch giữ hai thuật ngữ riêng biệt và sắc thái tư pháp của מִשְׁפָּטִים, nhưng không gán cho chúng những phạm trù giáo lý về sau.
- issue: Quan hệ giữa tuân giữ và thực hành trong וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: tuân giữ và thực hành
  alternative: tuân giữ để thực hành
  rationale: Cách dịch được chọn giữ cả hai phương diện của nguyên văn và tự nhiên trong tiếng Việt; không quyết đoán quá mức rằng cấu trúc chỉ biểu thị mục đích hay chỉ là hai hành động song song.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng lời kêu gọi trực tiếp “Hỡi Y-sơ-ra-ên” và đại từ “anh em” để phù hợp diễn từ công khai của Môi-se. Câu cuối được diễn đạt bằng ba động tác rõ ràng—học biết, tuân giữ, thực hành—nhằm bảo toàn tiến trình của nguyên văn mà vẫn tự nhiên với độc giả phổ thông.
