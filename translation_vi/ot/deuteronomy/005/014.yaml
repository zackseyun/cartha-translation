  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: vi
  text: Nhưng ngày thứ bảy là ngày Sa-bát dành cho Yahweh, Đức Chúa Trời của anh em. Anh em không được làm bất cứ công việc nào—cả anh em, con trai hay con gái anh em, nô lệ nam hay nô lệ nữ của anh em, bò, lừa hay bất cứ gia súc nào của anh em, và ngoại kiều cư ngụ trong các thành của anh em[a]—để nô lệ nam và nô lệ nữ của anh em cũng được nghỉ ngơi như anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong các cổng của anh em”, một thành ngữ chỉ người cư trú trong thành hoặc cộng đồng thuộc phạm vi của anh em.'
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: ngày Sa-bát
  rationale: Giữ tên gọi quen thuộc của ngày thánh trong giao ước, thay vì giản lược thành một ngày nghỉ nói chung.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ ל biểu thị sự dành riêng hoặc thuộc về; cách dịch này tự nhiên trong tiếng Việt và giữ ý ngày ấy được biệt riêng cho Yahweh.
- source_word: מְלָאכָה
  choice: công việc
  rationale: Từ ngữ rộng, phù hợp luật ngày Sa-bát mà không tự ý giới hạn loại lao động bị cấm.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: nô lệ nam / nô lệ nữ của anh em
  rationale: Hai từ chỉ những người lệ thuộc trong gia hộ và phân biệt giới tính; “nô lệ” phản ánh rõ địa vị xã hội hơn “đầy tớ”.
- source_word: שׁוֹר / חֲמוֹר / בְּהֵמָה
  choice: bò / lừa / gia súc
  rationale: Các từ hiện đại, chính xác trong bối cảnh vật nuôi của gia hộ; שׁוֹר ở đây chỉ gia súc bò dùng trong lao động.
- source_word: גֵּר
  choice: ngoại kiều cư ngụ
  rationale: Chỉ người không phải bản địa nhưng đang sinh sống trong cộng đồng, không đơn thuần là khách qua đường.
- source_word: בִּשְׁעָרֶיךָ
  choice: trong các thành của anh em
  rationale: Chuyển thành ngữ Hê-bơ-rơ “trong các cổng của anh em” sang nghĩa cộng đồng đô thị thuộc phạm vi cư trú và thẩm quyền.
- source_word: כָּמוֹךָ
  choice: như anh em
  rationale: 'Giữ sự so sánh trực tiếp: những người nô lệ cũng được nghỉ giống chính người nhận điều răn.'
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Giữ danh giao ước được nêu trực tiếp trong nguyên văn, không thay bằng một tước hiệu.
- issue: Địa vị của עבד và אמה trong luật ngày Sa-bát
  choice: nô lệ nam / nô lệ nữ
  alternative: đầy tớ nam / đầy tớ nữ
  rationale: Nguyên văn nói đến những thành viên lệ thuộc trong gia hộ. “Nô lệ” giữ rõ thực trạng xã hội và sức nặng đạo đức của việc cho họ nghỉ ngơi.
- issue: Phạm vi của ngôi thứ hai số ít trong diễn ngôn luật pháp
  choice: anh em
  alternative: ngươi
  rationale: Dùng đại từ hiện đại, trang trọng vừa phải và có tính cộng đồng; không chuyển sang lối cổ, trong khi vẫn hiểu mỗi người nghe là đối tượng trực tiếp của điều răn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số ít mang tính đại diện trong diễn ngôn giao ước; giữ “Sa-bát” và “Yahweh” như các danh xưng đặc thù. Dấu gạch ngang giúp thể hiện danh sách bao quát trong lệnh cấm.
