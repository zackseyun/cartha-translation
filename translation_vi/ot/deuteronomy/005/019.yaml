  yaml_path: translation/ot/deuteronomy/005/019.yaml
  text: And you shall not steal[a].
translation:
  language: vi
  text: Và ngươi không được trộm cắp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong một số ngữ cảnh, גנב có thể mang nghĩa “bắt cóc” hoặc “đánh cắp một người”; ở đây, điều răn được phát biểu theo nghĩa khái quát: “trộm cắp”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: Và ... không được
  rationale: Liên từ וְ nối điều răn này với chuỗi điều răn trước đó; לֹא cùng thể vị hoàn thành chưa trọn dùng với chức năng cấm đoán. Cách dịch này giữ sự liên kết và truyền đạt rõ sức nặng của mệnh lệnh trong tiếng Việt hiện đại.
- source_word: תִּגְנֹב
  choice: ngươi ... trộm cắp
  rationale: Động từ גנב ở thể Qal, ngôi hai số ít giống đực, được dùng như một lệnh cấm. Vì câu không nêu đối tượng bị lấy, “trộm cắp” giữ nghĩa khái quát; trong những ngữ cảnh khác, từ này cũng có thể chỉ việc bắt cóc hay đánh cắp một người.
theological_decisions: []
translation_notes:
  register: Dùng văn phong trang trọng, súc tích, phù hợp nhịp điệu của Mười Điều Răn. Đại từ “ngươi” phản ánh lời phán trực tiếp ở ngôi hai số ít; “không được” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ lực cấm đoán.
