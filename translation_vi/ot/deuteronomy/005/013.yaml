  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: vi
  text: Trong sáu ngày, ngươi phải lao động và làm mọi công việc của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong sáu ngày, ngươi được lao động và làm mọi công việc của mình.” Trong văn cảnh luật pháp này, thể chưa hoàn thành của động từ Hê-bơ-rơ có thể được hiểu là lời chỉ thị hoặc sự cho phép.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Trong sáu ngày
  rationale: Cụm số từ ở dạng liên kết với danh từ diễn tả khoảng thời gian. Tiếng Việt tự nhiên cần giới từ “trong” để nêu khoảng sáu ngày, dù tiếng Hê-bơ-rơ không có giới từ tương ứng.
- source_word: תַּעֲבֹד
  choice: ngươi phải lao động
  rationale: Động từ עבד ở đây chỉ lao động thông thường. “Phải” thể hiện sắc thái chỉ thị của thể chưa hoàn thành trong văn cảnh luật pháp, còn “lao động” giúp phân biệt với động từ עשה theo sau.
- source_word: וְעָשִׂיתָ
  choice: và làm
  rationale: עשה có nghĩa rộng; trong cụm này, “làm” là cách diễn đạt tự nhiên, giữ nguyên phép nối bằng “và” của nguyên văn.
- source_word: כָּל
  choice: mọi
  rationale: כָּל chỉ toàn bộ các công việc; “mọi” kết hợp tự nhiên với danh từ “công việc” trong tiếng Việt.
- source_word: מְלַאכְתֶּךָ
  choice: công việc của mình
  rationale: מְלָאכָה thường chỉ công việc, nghề nghiệp hoặc nhiệm vụ, nhất là trong văn cảnh ngày Sa-bát. “Của mình” truyền đạt hậu tố ngôi thứ hai số ít và tự nhiên hơn “của ngươi” khi chủ ngữ đã là “ngươi”.
theological_decisions:
- issue: Sắc thái mệnh lệnh của động từ trong luật về ngày Sa-bát
  choice: 'Dịch với sắc thái chỉ thị: “ngươi phải lao động và làm mọi công việc của mình”'
  alternative: “ngươi được lao động và làm mọi công việc của mình”
  rationale: Câu này nằm trong ngôn ngữ giao ước mang tính luật định. “Phải” giữ sắc thái chỉ thị mà không chuyển thành câu mệnh lệnh cụt; chú thích vẫn bảo lưu khả năng hiểu thể chưa hoàn thành theo nghĩa cho phép trong văn cảnh pháp luật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ cách xưng hô ngôi thứ hai số ít của lời giao ước; dùng “phải” thay cho lối tương lai để truyền đạt lực chỉ thị trong tiếng Việt.
