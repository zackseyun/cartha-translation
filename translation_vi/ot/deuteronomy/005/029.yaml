source:
  edition: WLC
  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: vi
  text: 'Ước gì[a] họ có một tấm lòng như thế này: kính sợ Ta và vâng giữ mọi điều răn của Ta trọn đời, để họ và con cái họ được hưởng điều tốt lành mãi mãi!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Phải chi họ có một tấm lòng như thế này.” Trong nguyên văn Hê-bơ-rơ, lời mở đầu là một thành ngữ bày tỏ ước vọng, nghĩa đen là “Ai sẽ ban cho...?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ước gì
  rationale: Thành ngữ Hê-bơ-rơ diễn tả một ước vọng tha thiết, không phải câu hỏi theo nghĩa đen về người ban cho.
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: họ luôn có tấm lòng như thế này
  rationale: Diễn đạt tự nhiên nội dung của lời ước; 'tấm lòng' giữ nguyên hình ảnh nhân học Kinh Thánh, còn 'như thế này' thể hiện sắc thái phẩm chất của đại từ chỉ định.
- source_word: לְיִרְאָה אֹתִי
  choice: để kính sợ Ta
  rationale: '''Kính sợ'' truyền đạt sự kính畏, tôn kính và thái độ vâng phục trong quan hệ giao ước.'
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: và vâng giữ mọi điều răn của Ta
  rationale: '''Vâng giữ'' tự nhiên trong tiếng Việt và nêu đúng ý tuân hành các điều răn, không chỉ bảo quản chúng.'
- source_word: כָּל הַיָּמִים
  choice: trọn đời họ
  rationale: Cụm từ nghĩa đen là 'mọi ngày', ở đây chỉ toàn bộ thời gian sống và sự bền lòng liên tục.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: hầu cho họ ... được phước
  rationale: Công thức giao ước nói về tình trạng tốt lành dưới sự ban phước của Đức Chúa Trời; cách dịch này tự nhiên nhưng không giới hạn vào thịnh vượng vật chất.
- source_word: וְלִבְנֵיהֶם
  choice: và con cái họ
  rationale: Danh từ giống đực ở đây mang nghĩa đại diện, chỉ con cái hoặc hậu duệ nói chung.
- source_word: לְעֹלָם
  choice: mãi mãi
  rationale: Giữ sắc thái kéo dài không dứt của từ nguồn và liên kết phước lành với cả các thế hệ sau.
theological_decisions:
- issue: Ngôn ngữ nhân học của לְבָבָם
  choice: tấm lòng
  alternative: tâm trí; nội tâm
  rationale: Câu này nói về khuynh hướng đạo đức và thuộc linh bên trong; 'tấm lòng' giữ được phạm trù Kinh Thánh thay vì thu hẹp ý nghĩa vào nhận thức.
- issue: Ý nghĩa của יִיטַב trong công thức giao ước
  choice: được phước
  alternative: được tốt lành; mọi việc được tốt đẹp
  rationale: Cách dịch nêu tình trạng tốt lành đến từ Đức Chúa Trời mà không quy nó riêng về lợi ích vật chất.
- issue: Phạm vi giới tính của וְלִבְנֵיהֶם
  choice: con cái họ
  alternative: các con trai của họ
  rationale: Trong ngữ cảnh giao ước, từ này chỉ hậu duệ nói chung chứ không loại trừ con gái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng đại từ 'Ta' cho lời Đức Chúa Trời. Cấu trúc lời ước được diễn đạt tự nhiên; dấu phẩy phân định ước vọng, nội dung của tấm lòng và mục đích/kết quả.
