  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: vi
  text: Vì có ai trong loài người đã nghe tiếng Đức Chúa Trời hằng sống phán từ giữa lửa như chúng ta mà vẫn còn sống đâu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lý do cho nỗi sợ và lời thỉnh cầu của dân chúng trong văn cảnh.
- source_word: מִי כָל בָּשָׂר
  choice: trong cả loài người, có ai
  rationale: Chuyển thành câu hỏi tu từ tự nhiên trong tiếng Việt; בָּשָׂר ở đây chỉ nhân loại hữu hạn, mang thân xác.
- source_word: שָׁמַע קוֹל
  choice: đã nghe tiếng
  rationale: קוֹל với chủ thể đang phán phù hợp nhất với “tiếng”; thể hoàn thành được diễn đạt bằng “đã nghe”.
- source_word: אֱלֹהִים חַיִּים
  choice: Đức Chúa Trời hằng sống
  rationale: Dù có hình thái số nhiều, cụm từ là danh hiệu số ít chỉ Đức Chúa Trời của Israel; “hằng sống” là cách diễn đạt trang trọng, rõ nghĩa trong tiếng Việt.
- source_word: מְדַבֵּר
  choice: phán
  rationale: Phân từ mô tả Đức Chúa Trời đang nói; “phán” phù hợp với lời nói của Đức Chúa Trời và văn phong Kinh Thánh tiếng Việt.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: từ giữa ngọn lửa
  rationale: Giữ hình ảnh tiếng phán phát ra từ bên trong lửa, không chỉ từ gần lửa.
- source_word: כָּמֹנוּ
  choice: như chúng ta
  rationale: So sánh với chính kinh nghiệm của Israel; câu tiếng Việt tự nhiên mà không cần bổ sung động từ.
- source_word: וַיֶּחִי
  choice: mà vẫn còn sống
  rationale: Giữ nghĩa căn bản “sống” đồng thời diễn đạt rõ sắc thái kinh ngạc về việc sống sót sau cuộc gặp gỡ này.
theological_decisions:
- issue: Thành ngữ nhân học כָל בָּשָׂר
  choice: trong cả loài người
  alternative: trong mọi xác thịt
  rationale: “Mọi xác thịt” quá sát chữ và dễ gây hiểu sai trong tiếng Việt hiện đại. “Cả loài người” truyền đạt đúng phạm vi nhân loại hữu hạn mà không áp đặt thêm một hệ thống nhân học.
- issue: Số và nghĩa của אֱלֹהִים חַיִּים
  choice: Đức Chúa Trời hằng sống
  alternative: các thần sống
  rationale: Trong văn cảnh, cụm từ chỉ duy nhất Đức Chúa Trời của Israel; dịch số nhiều sẽ xuyên tạc chức năng ngữ pháp và thần học của thành ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu hỏi tu từ được giữ; “phán” và “Đức Chúa Trời hằng sống” duy trì sắc thái tôn nghiêm mà không cổ hóa quá mức.
