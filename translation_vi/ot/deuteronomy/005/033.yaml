  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: vi
  text: Anh em phải đi theo trọn con đường mà Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em, để anh em được sống, được phước, và được sống lâu trong xứ mà anh em sẽ chiếm hữu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xứ mà anh em sẽ thừa hưởng.” Động từ Hê-bơ-rơ có thể mang cả nghĩa chiếm hữu lẫn thừa hưởng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: bước đi trọn con đường
  rationale: Giữ danh từ số ít và hình ảnh ẩn dụ về con đường sống theo giao ước; “trọn” diễn đạt phạm vi toàn vẹn của כָּל tự nhiên hơn lối dịch từng chữ.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Diễn đạt một mệnh lệnh đã được ban nhưng vẫn có hiệu lực đối với dân Y-sơ-ra-ên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên chuyển trực tiếp danh giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ quan hệ giao ước và đại từ số nhiều.
- source_word: תֵּלֵכוּ
  choice: Anh em phải bước đi
  rationale: “Bước đi” giữ hình ảnh Hê-bơ-rơ về nếp sống và sự vâng phục; “phải” phù hợp sắc thái truyền lệnh, khuyên bảo trong ngữ cảnh.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt rõ và gọn quan hệ mục đích hoặc kết quả mà không quyết định quá mức giữa hai sắc thái.
- source_word: תִּחְיוּן
  choice: anh em được sống
  rationale: Giữ nghĩa trực tiếp của động từ “sống” trong bối cảnh phước lành giao ước.
- source_word: וְטוֹב לָכֶם
  choice: được mọi sự tốt lành
  rationale: Diễn đạt tự nhiên ý niệm về tình trạng tốt đẹp, an lành dành cho dân chúng, không thu hẹp thành lợi ích vật chất.
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: được sống lâu
  rationale: Thành ngữ tiếng Việt tự nhiên tương ứng với thành ngữ Hê-bơ-rơ “kéo dài ngày tháng”, vẫn giữ ý trường thọ.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: “Xứ” phù hợp ngôn ngữ về vùng đất giao ước và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: תִּירָשׁוּן
  choice: sẽ chiếm hữu
  rationale: Giữ nghĩa cụ thể là tiếp nhận và nắm quyền sở hữu xứ; động từ Hê-bơ-rơ cũng có thể mang nghĩa thừa hưởng.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng giao ước; phiên chuyển “Yahweh” phân biệt danh này với các tước hiệu.
- issue: Ngôn ngữ về việc nhận xứ
  choice: xứ mà anh em sẽ chiếm hữu
  alternative: xứ mà anh em sẽ thừa hưởng
  rationale: “Chiếm hữu” giữ nét nghĩa lãnh nhận và nắm giữ lãnh thổ trong ngữ cảnh Phục Truyền Luật Lệ Ký, còn khả năng dịch “thừa hưởng” được ghi ở chú thích để bảo tồn độ rộng nghĩa của ירשׁ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều chỉ cộng đồng Y-sơ-ra-ên; giữ ẩn dụ “bước đi… con đường” và nhịp ba vế của lời chúc phước.
