  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: vi
  text: Hãy nhớ rằng ngươi đã từng là nô lệ[a] trong đất Ai Cập, và Yahweh, Đức Chúa Trời của ngươi, đã bằng bàn tay mạnh mẽ và cánh tay giang ra đưa ngươi ra khỏi đó. Vì thế, Yahweh, Đức Chúa Trời của ngươi, đã truyền cho ngươi phải tuân giữ ngày Sa-bát[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tôi tớ”; ở đây từ Hê-bơ-rơ nói đến thân phận bị nô dịch tại Ai Cập.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “làm ngày Sa-bát”, một thành ngữ mang nghĩa tuân giữ hoặc thực hành ngày ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Hãy nhớ rằng
  rationale: Diễn đạt tự nhiên sức thúc giục của động từ trong mạch văn mệnh lệnh, đồng thời giữ chức năng dẫn vào nội dung cần ghi nhớ.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Trong bối cảnh cảnh nô dịch tại Ai Cập, từ này chỉ thân phận bị lệ thuộc chứ không đơn thuần là người phục vụ.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trong đất Ai Cập
  rationale: Giữ hình ảnh cụ thể của nguyên văn mà vẫn phù hợp với văn phong Kinh Thánh tiếng Việt.
- source_word: וַיֹּצִאֲךָ
  choice: đưa anh em ra
  rationale: Phản ánh thể khiến của động từ יצא và ý nghĩa giải thoát khỏi Ai Cập.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được viết trực tiếp trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở thuộc và lời xưng hô với cộng đồng giao ước; lặp lại ở cả hai vị trí như nguyên văn.
- source_word: בְּיָד חֲזָקָה
  choice: dùng bàn tay mạnh mẽ
  rationale: Giữ hình ảnh Hê-bơ-rơ về quyền năng giải cứu của Đức Chúa Trời và phản ánh trực tiếp tính từ חֲזָקָה.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: và cánh tay giang ra
  rationale: Bảo tồn hình ảnh song song của nguyên văn về quyền năng được thi thố công khai.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Thể hiện rõ quan hệ suy luận giữa việc được giải phóng khỏi ách nô lệ và mệnh lệnh về ngày Sa-bát.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: phải tuân giữ ngày Sa-bát
  rationale: Đây là cách diễn đạt tự nhiên bằng tiếng Việt cho thành ngữ nguyên văn, theo nghĩa thực hành và giữ ngày ấy.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng bốn phụ âm; giữ danh riêng giúp phân biệt tên giao ước với tước hiệu mà không thêm cách giải thích hệ phái.
- issue: Thân phận עֶבֶד của Israel tại Ai Cập
  choice: nô lệ
  alternative: tôi tớ
  rationale: Mạch văn nhấn mạnh cảnh nô dịch và hành động giải phóng; “nô lệ” truyền đạt chính xác hơn mức độ lệ thuộc trong trường hợp này.
- issue: Sắc thái của לַעֲשׂוֹת đối với ngày Sa-bát
  choice: tuân giữ
  alternative: làm / cử hành
  rationale: Nghĩa đen là “làm”, nhưng trong kết cấu này thành ngữ nói đến việc thực hành, giữ ngày Sa-bát; “tuân giữ” rõ nghĩa mà không quy định thêm cách thức.
- issue: Đại từ số ít giống đực ngôi thứ hai
  choice: anh em
  alternative: ngươi
  rationale: Nguyên văn dùng số ít để gọi Israel như một cộng đồng. “Anh em” chuyển tải lời hướng đến toàn dân bằng tiếng Việt hiện đại, trang trọng, tránh sắc thái cổ hoặc gay gắt ngoài ý của bản văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để nói với Israel như một cộng đồng, thay cho “ngươi” mang sắc thái cổ; giữ tên Yahweh và các hình ảnh “bàn tay”, “cánh tay” của nguyên văn.
