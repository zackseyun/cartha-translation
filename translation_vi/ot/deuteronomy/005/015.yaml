revisions:
- from: Hãy nhớ rằng anh em đã từng là nô lệ[a] trong đất Ai Cập, và Yahweh, Đức Chúa Trời của anh em, đã dùng bàn tay mạnh mẽ và cánh tay giang ra đưa anh em ra khỏi đó. Vì thế, Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em phải tuân giữ ngày Sa-bát[b].
  to: Hãy nhớ rằng ngươi đã từng là nô lệ[a] trong đất Ai Cập, và Yahweh, Đức Chúa Trời của ngươi, đã bằng bàn tay mạnh mẽ và cánh tay giang ra đưa ngươi ra khỏi đó. Vì thế, Yahweh, Đức Chúa Trời của ngươi, đã truyền cho ngươi phải tuân giữ ngày Sa-bát[b].
  rationale: Chỉ sửa đại từ xưng hô để bảo toàn ngôi số ít của nguyên văn, và điều chỉnh giới từ trong cụm diễn tả phương tiện cho tự nhiên hơn. Giữ nguyên các lựa chọn then chốt “Yahweh”, “Đức Chúa Trời”, “nô lệ”, “bàn tay mạnh mẽ”, và “tuân giữ ngày Sa-bát”, cũng như nội dung và vị trí các chú thích.
