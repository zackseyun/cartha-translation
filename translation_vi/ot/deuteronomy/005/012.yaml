revisions:
- from: Hãy tuân giữ ngày Sa-bát[a] để biệt riêng ngày ấy ra thánh, như Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em.
  to: Hãy tuân giữ ngày Sa-bát[a], để biệt riêng ngày ấy làm ngày thánh, như Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em.
  rationale: Chỉ sửa cách diễn đạt mục đích «để biệt riêng ngày ấy làm ngày thánh» để tiếng Việt tự nhiên hơn, đồng thời giữ ý nghĩa của לְקַדְּשׁוֹ là thánh hiến/dành riêng ngày Sa-bát. Dấu phẩy sau «Sa-bát[a]» giúp phân tách rõ cụm mục đích. Chú thích được chỉnh nhẹ từ «chuyên tâm» thành «chú tâm» để tránh cường điệu sắc thái của שָׁמוֹר.
