  edition: WLC
  text: שָׁמ֛וֹר אֶת י֥וֹם הַ/שַׁבָּ֖ת לְ/קַדְּשׁ֑/וֹ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: vi
  text: Hãy tuân giữ ngày Sa-bát[a], để biệt riêng ngày ấy làm ngày thánh, như Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy giữ ngày Sa-bát” hoặc “Hãy cẩn thận gìn giữ ngày Sa-bát.” Động từ Hê-bơ-rơ nhấn mạnh việc chú tâm tuân giữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Hãy tuân giữ
  rationale: Dạng nguyên mẫu tuyệt đối Qal mang chức năng mệnh lệnh. “Tuân giữ” diễn đạt việc chuyên tâm vâng giữ, đồng thời duy trì sự tương phản có chủ ý với “Hãy nhớ” trong Xuất Ai Cập 20:8.
- source_word: יוֹם הַשַׁבָּת
  choice: ngày Sa-bát
  rationale: Cách gọi tự nhiên, quen thuộc trong tiếng Việt, vừa nêu rõ một ngày cụ thể vừa giữ thuật ngữ chỉ ngày nghỉ của giao ước.
- source_word: לְקַדְּשׁוֹ
  choice: để biệt riêng ngày ấy ra thánh
  rationale: Giới từ לְ với động từ nguyên mẫu diễn tả mục đích. Cách dịch này nêu rõ ngày ấy phải được dành riêng như thánh, không hàm ý con người tạo ra sự thánh khiết vốn chưa có.
- source_word: כַּאֲשֶׁר
  choice: như
  rationale: Diễn đạt gọn và tự nhiên sự quy chiếu đến mệnh lệnh Đức Chúa Trời đã ban trước đó.
- source_word: צִוְּךָ
  choice: đã truyền cho anh em
  rationale: Động từ צוה chỉ mệnh lệnh có thẩm quyền. Thì quá khứ phù hợp với việc Môi-se nhắc lại mệnh lệnh đã ban; “anh em” diễn đạt tự nhiên đối tượng tập thể là Israel dù tiếng Hê-bơ-rơ dùng ngôi hai số ít.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu, qua đó giữ sự phân biệt giữa danh Yahweh và danh xưng “Đức Chúa Trời” ngay sau đó.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt danh xưng giao ước với hậu tố ngôi hai số ít; tiếng Việt dùng “anh em” để nói tự nhiên với toàn thể cộng đồng Israel.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn danh giao ước thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của việc làm cho ngày Sa-bát nên thánh
  choice: biệt riêng ngày ấy ra thánh
  alternative: thánh hóa ngày ấy; làm cho ngày ấy nên thánh
  rationale: Cách dịch được chọn nhấn mạnh việc đối xử với ngày ấy như một ngày đã được dành riêng cho Đức Chúa Trời, tránh giải quyết quá mức câu hỏi con người tạo nên sự thánh hay công nhận sự thánh của ngày ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng theo nghĩa cộng đồng để chuyển lời xưng hô ngôi hai số ít mang tính tập thể đối với Israel; tránh đại từ cổ “ngươi”.
