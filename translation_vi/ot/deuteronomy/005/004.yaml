base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/004.yaml
  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: vi
  text: Trên núi, Yahweh đã phán với anh em mặt đối mặt, từ giữa ngọn lửa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “mặt đối mặt”, một thành ngữ nói về sự trực tiếp, đích thân; so sánh Phục Truyền Luật Lệ Ký 4:12, nơi dân Y-sơ-ra-ên nghe tiếng phán nhưng không thấy hình dạng nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: mặt đối mặt
  rationale: Giữ nguyên thành ngữ Hê-bơ-rơ và sức mạnh tu từ của nó, diễn tả sự truyền phán trực tiếp, mang tính đích thân, nhưng không mặc nhiên khẳng định dân chúng đã nhìn thấy hình dạng của Đức Chúa Trời.
- source_word: דִּבֶּר ... עִמָּכֶם
  choice: đã phán với anh em
  rationale: Động từ có nghĩa là “nói/phán”, còn עִם là “với”. “Phán với” vừa tự nhiên trong văn cảnh lời Đức Chúa Trời vừa phản ánh quan hệ trực tiếp của cấu trúc Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: בָּהָר
  choice: trên núi
  rationale: Giới từ בְּ mang nghĩa chỉ địa điểm trong bối cảnh này; “trên núi” là cách diễn đạt tự nhiên cho khung cảnh Si-nai.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: từ giữa ngọn lửa
  rationale: מִתּוֹךְ chỉ sự phát xuất từ bên trong hoặc giữa một nơi; cách dịch này giữ được hình ảnh sống động và trang nghiêm của cuộc thần hiện.
theological_decisions:
- issue: Cách nói mang tính nhân hình “mặt đối mặt” trong trình thuật tại Si-nai
  choice: Giữ “mặt đối mặt” như thành ngữ chỉ sự truyền phán trực tiếp trong quan hệ giao ước.
  alternative: Diễn giải thành “trực tiếp” hoặc “đích thân”.
  rationale: Phục Truyền Luật Lệ Ký 4:12, 15 nói dân chúng nghe tiếng nhưng không thấy hình dạng nào. Vì vậy, bản dịch giữ thành ngữ và sự căng thẳng của nguyên văn, không biến nó thành lời khẳng định rằng họ thật sự nhìn thấy Đức Chúa Trời, cũng không làm phẳng hình ảnh bằng một lối diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “anh em” cho đại từ số nhiều עִמָּכֶם trong lời Môi-se nói với cộng đồng giao ước; dùng “phán” theo quy ước tự nhiên của tiếng Việt khi chủ thể là Đức Chúa Trời. Dấu chú thích [a] được đặt ngay sau câu liên quan.
