id: DEU.5.5
reference: Deuteronomy 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אָ֠נֹכִי עֹמֵ֨ד בֵּין יְהוָ֤ה וּ/בֵֽינֵי/כֶם֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/הַגִּ֥יד לָ/כֶ֖ם אֶת דְּבַ֣ר יְהוָ֑ה כִּ֤י יְרֵאתֶם֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ וְ/לֹֽא עֲלִיתֶ֥ם בָּ/הָ֖ר לֵ/אמֹֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: vi
  text: 'Lúc ấy, tôi đứng giữa Đức Giê-hô-va và anh em để truyền đạt cho anh em lời của Đức Giê-hô-va, vì anh em sợ ngọn lửa và không lên núi, rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָנֹכִי עֹמֵד
  choice: tôi đứng
  rationale: Đại từ ngôi thứ nhất nhấn mạnh vai trò của Môi-se; phân từ עֹמֵד trong hồi thuật chỉ tư thế/vai trò ông đảm nhận khi ấy. Tiếng Việt tự nhiên không cần thêm “chính tôi” hay dạng tiếp diễn.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: giữa Đức Giê-hô-va và anh em
  rationale: Giữ nguyên cấu trúc chỉ vị trí trung gian giữa hai bên; “anh em” phù hợp lời Môi-se nói với toàn dân.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước YHWH bằng dạng quen thuộc, trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: בָּעֵת הַהִוא
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên cụm thời gian chỉ biến cố tại Hô-rếp đang được nhắc lại.
- source_word: לְהַגִּיד לָכֶם
  choice: để truyền lại cho anh em
  rationale: Hiphil của נגד chỉ việc làm cho dân biết lời đã nhận; “truyền lại” làm rõ vai trò chuyển đạt của Môi-se mà không thêm ý giải thích.
- source_word: אֶת דְּבַר יְהוָה
  choice: lời của Đức Giê-hô-va
  rationale: Giữ cách nói thần học và giao ước “lời của YHWH”, đồng thời tự nhiên trong tiếng Việt.
- source_word: כִּי יְרֵאתֶם מִפְּנֵי הָאֵשׁ
  choice: vì anh em sợ ngọn lửa
  rationale: מִפְּנֵי theo ngữ cảnh nêu nguyên nhân của sự sợ hãi; tiếng Việt có thể diễn đạt trực tiếp, tránh lặp “vì... vì...”.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: và không lên núi
  rationale: Dịch sát, tự nhiên động từ עלה cùng địa điểm là ngọn núi.
- source_word: לֵאמֹר
  choice: 'Ngài phán rằng:'
  rationale: Dấu hiệu dẫn lời mở sang lời phán của Đức Giê-hô-va ở câu kế tiếp. Tiếng Việt cần nêu chủ thể để câu dẫn tự nhiên; “Ngài” quy chiếu về Đức Giê-hô-va.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng thay vì thay bằng tước hiệu; dạng “Đức Giê-hô-va” đã quen thuộc và có sắc thái tôn kính trong tiếng Việt.
- issue: Chủ thể hàm ẩn liên quan đến לֵאמֹר
  choice: 'Ngài phán rằng:'
  alternative: 'rằng:; nói rằng:'
  rationale: Ngữ cảnh câu 6 cho thấy lời trực tiếp tiếp theo là lời Đức Giê-hô-va mà Môi-se truyền đạt. Việc thêm đại từ chỉ làm rõ cú pháp tiếng Việt, không đổi người phát ngôn cuối cùng của nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với cộng đồng; tránh cách dịch quá sát thành ngữ Hê-bơ-rơ khiến câu gượng.
