source:
  edition: WLC
  text: לֹ֣א אֶת אֲבֹתֵ֔י/נוּ כָּרַ֥ת יְהוָ֖ה אֶת הַ/בְּרִ֣ית הַ/זֹּ֑את כִּ֣י אִתָּ֗/נוּ אֲנַ֨חְנוּ אֵ֥לֶּה פֹ֛ה הַ/יּ֖וֹם כֻּלָּ֥/נוּ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: vi
  text: Yahweh không lập giao ước này[b] với cha ông chúng ta[a], nhưng với chúng ta—chính chúng ta, là tất cả những người hôm nay có mặt ở đây và còn sống.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tổ tiên chúng ta”. Tiếng Hê-bơ-rơ viết sát nghĩa là “các cha của chúng ta”.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ viết sát nghĩa là “cắt giao ước này”.
    reason: lexical_alternative
  - marker: c
    text: 'Một số người hiểu sự tương phản này theo lối tu từ: không phải chỉ với cha ông chúng ta, nhưng đặc biệt là với chúng ta, những người hôm nay còn sống tại đây.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית הַזֹּאת
  choice: lập giao ước này
  rationale: Động từ כָּרַת, nghĩa đen là “cắt”, kết hợp với בְּרִית thành một thành ngữ chỉ việc thiết lập giao ước. “Lập giao ước này” diễn đạt tự nhiên trong tiếng Việt và giữ lại đại từ chỉ định הַזֹּאת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng hình thức phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֲבֹתֵינוּ
  choice: cha ông chúng ta
  rationale: Giữ hình ảnh “các cha của chúng ta” trong tiếng Hê-bơ-rơ, đồng thời dùng cách nói tiếng Việt tự nhiên để chỉ các thế hệ đi trước.
- source_word: כִּי
  choice: nhưng
  rationale: Trong cấu trúc theo sau mệnh đề phủ định, כִּי mang chức năng tương phản; “nhưng” chuyển tải trực tiếp quan hệ này.
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה
  choice: với chúng ta—chính chúng ta
  rationale: Dấu gạch ngang và “chính” tái hiện phép đồng vị nhấn mạnh của cụm Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: tất cả đều đang sống tại đây hôm nay
  rationale: Bản dịch giữ đủ ý toàn thể, sự hiện diện tại chỗ, thời điểm hiện tại và tình trạng còn sống của thế hệ đang được nói với.
theological_decisions:
- issue: Câu này phủ nhận tuyệt đối việc giao ước được lập với cha ông hay chủ yếu nhấn mạnh tính hiện tại của giao ước đối với thế hệ đang nghe
  choice: 'Giữ nguyên thế tương phản: “không ... với cha ông chúng ta, nhưng với chúng ta”.'
  alternative: Hiểu theo nghĩa “không chỉ với cha ông chúng ta” hoặc như một lối nhấn mạnh việc tái xác nhận giao ước với thế hệ hiện tại.
  rationale: Bản Hê-bơ-rơ không có từ tương đương với “chỉ”. Vì vậy, câu chính không thêm yếu tố giới hạn, còn chú thích nêu cách hiểu tu từ để bảo toàn sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lập giao ước” là cách nói tự nhiên trong tiếng Việt; “cha ông” giữ sắc thái thế hệ nam đi trước của nguyên văn mà không quá cổ. Phép lặp có nhấn mạnh “với chúng ta—chính chúng ta” được giữ để phản ánh cấu trúc Hê-bơ-rơ.
