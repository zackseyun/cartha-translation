source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: vi
  text: Ngươi không được dùng danh Yahweh, Đức Chúa Trời của ngươi, một cách hư vọng[a], vì Yahweh sẽ không kể là vô tội kẻ dùng danh Ngài một cách hư vọng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì điều giả dối”, “một cách sai trái” hoặc “một cách trống rỗng”. Từ Hê-bơ-rơ có thể bao gồm việc dùng danh Yahweh cách giả dối hoặc trống rỗng, chứ không chỉ một hình thức lạm dụng cụ thể.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ không miễn tội” hoặc “sẽ không tuyên trắng án”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: dùng
  rationale: Động từ có nghĩa gốc rộng như “nâng, mang, gánh”; trong kết hợp với “danh” và לַשָּׁוְא, “dùng” là cách diễn đạt tự nhiên trong tiếng Việt, đồng thời không giới hạn điều răn vào riêng việc thề gian hay một hình thức lạm dụng cụ thể.
- source_word: שֵׁם / שְׁמוֹ
  choice: danh / danh Ngài
  rationale: Giữ nguyên ý niệm “danh”, vốn có thể hàm ý danh tiếng, thẩm quyền và căn tính được cầu khẩn, thay vì diễn giải thành một ý nghĩa hẹp hơn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời được ghi trực tiếp bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Giữ lời phán trực tiếp ở ngôi thứ hai số ít và sắc thái giao ước của cụm từ.
- source_word: לַשָּׁוְא
  choice: một cách hư vọng
  rationale: שָׁוְא có trường nghĩa gồm sự trống rỗng, vô giá trị, giả dối và sai trái. “Hư vọng” giữ được phần lớn độ rộng ấy; chú thích nêu rõ các khả năng dịch khác.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho điều cấm bằng liên từ tự nhiên, rõ ràng trong tiếng Việt.
- source_word: יְנַקֶּה (נקה)
  choice: sẽ không để ... khỏi bị trừng phạt
  rationale: 'Thể piel ở đây mang lực pháp lý: không tuyên vô tội hoặc không cho thoát khỏi hậu quả trừng phạt. Cách dịch này rõ nghĩa đối với độc giả hiện đại.'
- source_word: אֲשֶׁר
  choice: kẻ
  rationale: Chỉ người vi phạm nói chung; “kẻ” phù hợp với ngữ cảnh cảnh cáo và giữ câu gọn.
theological_decisions:
- issue: Cách dịch danh YHWH
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng của danh giao ước.
- issue: Phạm vi của điều cấm
  choice: dùng danh ... một cách hư vọng
  alternative: mang danh ... cách giả dối; lạm dụng danh; viện danh để làm điều giả dối
  rationale: Câu Hê-bơ-rơ có thể bao gồm thề gian, cầu khẩn danh một cách trống rỗng và những cách sử dụng sai trái rộng hơn. Bản chính không thu hẹp điều răn vào một hành vi duy nhất; chú thích bảo tồn các sắc thái khác.
- issue: Sắc thái pháp lý của נקה
  choice: không để ... khỏi bị trừng phạt
  alternative: không kể là vô tội; không tuyên trắng án
  rationale: Cách chọn truyền đạt hậu quả xét xử rõ ràng nhưng chú thích vẫn giữ khả năng diễn đạt trực tiếp về tội trạng và sự tuyên trắng án.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Ngươi” giữ ngôi thứ hai số ít của lời giao ước và sắc thái điều răn; cấu trúc câu tránh lối cổ “chớ ... mà làm chơi”. “Hư vọng” được dùng để bảo tồn độ rộng giữa trống rỗng và giả dối, có chú thích giải nghĩa cho độc giả phổ thông.
