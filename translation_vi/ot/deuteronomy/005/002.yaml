source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֗י/נוּ כָּרַ֥ת עִמָּ֛/נוּ בְּרִ֖ית בְּ/חֹרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/002.yaml
  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: vi
  text: Yahweh, Đức Chúa Trời của chúng ta, đã lập giao ước với chúng ta tại Hô-rếp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “đã cắt một giao ước với chúng ta tại Hô-rếp.”'
    reason: Giữ lại hình ảnh của thành ngữ Hê-bơ-rơ כָּרַת בְּרִית, trong khi câu chính dùng cách nói tự nhiên của tiếng Việt.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời để giữ nguyên tính chất danh xưng cá nhân trong bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Diễn đạt tự nhiên cấu trúc có hậu tố ngôi thứ nhất số nhiều, đồng thời giữ sắc thái quan hệ giao ước.
- source_word: כָּרַת ... בְּרִית
  choice: lập giao ước
  rationale: Đây là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt cho thành ngữ Hê-bơ-rơ có nghĩa đen là “cắt một giao ước”; nghĩa đen được ghi ở chú thích.
- source_word: עִמָּנוּ
  choice: với chúng ta
  rationale: Dịch trực tiếp giới từ cùng hậu tố đại từ, giữ rõ các bên trong quan hệ giao ước.
- source_word: בְּחֹרֵב
  choice: tại Hô-rếp
  rationale: “Tại” diễn đạt tự nhiên ý nghĩa địa điểm của giới từ; địa danh được phiên âm theo âm quen dùng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ dạng phiên âm “Yahweh” bảo toàn sự phân biệt giữa danh riêng và tước hiệu, không áp đặt cách thay thế theo truyền thống hệ phái.
- issue: Sắc thái của בְּרִית
  choice: giao ước
  alternative: hiệp ước; thỏa thuận
  rationale: “Giao ước” giữ được sức nặng quan hệ và thần học của từ trong bối cảnh Đức Chúa Trời với Israel; các lựa chọn khác dễ thu hẹp thành một thỏa thuận thông thường.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lập giao ước” theo cách nói tự nhiên của tiếng Việt; giữ danh Yahweh và phiên âm địa danh Hô-rếp.
