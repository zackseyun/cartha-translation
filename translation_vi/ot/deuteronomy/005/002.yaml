  terminology: “Yahweh” nhất quán với quyết định giữ danh riêng; “Đức Chúa Trời” phù hợp cho אֱלֹהֵינוּ; “giao ước” bảo toàn thuật ngữ chuẩn của בְּרִית. “Hô-rếp” là dạng phiên âm quen dùng và phù hợp.
