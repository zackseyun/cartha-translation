  language: vi
  text: Ngươi không được giết người[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống hơn: “Ngươi không được giết.” Động từ Hê-bơ-rơ ở đây nói cụ thể hơn về việc giết người trái pháp luật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Tiểu từ phủ định לֹא đi với thể vị hoàn thành trong điều răn diễn đạt một lệnh cấm dứt khoát; “không được” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: תִּרְצָח
  choice: giết người
  rationale: Động từ רָצַח chỉ việc giết một người trái phép hoặc có tội, chứ không phải mọi hành vi làm chết nói chung. “Giết người” truyền đạt trực tiếp phạm vi đạo đức-pháp lý ấy trong tiếng Việt; chú thích giữ lại cách dịch truyền thống rộng hơn.
theological_decisions:
- issue: Phạm vi của điều răn cấm giết
  choice: Điều răn cấm hành vi giết người trái phép hoặc có tội, được dịch là “Ngươi không được giết người.”
  alternative: Ngươi không được giết.
  rationale: Bản Hê-bơ-rơ dùng רָצַח chứ không dùng một động từ rộng hơn cho mọi hành vi giết. Cách dịch “giết người” phản ánh chính xác hơn phạm vi từ vựng và vẫn giữ sự nhất quán với những luật khác trong Ngũ Kinh vốn phân biệt các trường hợp gây chết người.
translation_notes:
  register: Văn phong trang trọng, ngắn gọn, phù hợp hình thức điều răn. Đại từ “ngươi” duy trì sắc thái trực tiếp và long trọng quen thuộc của Mười Điều Răn; “không được” tự nhiên hơn “chớ” trong tiếng Việt hiện đại.
