base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/010.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: vi
  text: nhưng bày tỏ tình yêu thành tín cho hàng ngàn người yêu mến ta và tuân giữ các điều răn của Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản và bản dịch ghi “các điều răn của ta”, phù hợp với lời phán ở ngôi thứ nhất trong văn cảnh; bản Hê-bơ-rơ được cung cấp ở đây ghi “các điều răn của Ngài”.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: nhưng bày tỏ
  rationale: Phân từ của עשה tiếp nối sự tương phản với câu trước. “Nhưng” diễn đạt quan hệ đối lập theo ngữ cảnh, còn “bày tỏ” là cách nói tự nhiên khi đi với חֶסֶד.
- source_word: חֶסֶד
  choice: tình yêu thành tín
  rationale: Cụm từ này diễn đạt cả tình yêu lẫn lòng trung tín bền vững trong mối quan hệ giao ước, thay vì chỉ nói đến cảm xúc hay lòng thương xót.
- source_word: לַאֲלָפִים
  choice: với hàng ngàn người
  rationale: Bản Hê-bơ-rơ chỉ nói “với hàng ngàn” mà không nêu rõ “thế hệ”. “Người” được bổ sung để câu tiếng Việt tự nhiên và phù hợp với mệnh đề tiếp theo, nhưng không đưa ý “hàng ngàn thế hệ” vào chính văn.
- source_word: לְאֹהֲבַי
  choice: là những người yêu mến ta
  rationale: Phân từ kèm hậu tố ngôi thứ nhất được chuyển thành mệnh đề quan hệ tự nhiên trong tiếng Việt, đồng thời giữ nguyên đối tượng của tình yêu là Đấng đang phán.
- source_word: וּלְשֹׁמְרֵי
  choice: và tuân giữ
  rationale: שמר khi dùng với các điều răn mang nghĩa giữ, vâng theo hoặc tuân thủ. “Tuân giữ” vừa quen thuộc trong văn phong Kinh Thánh vừa rõ nghĩa đối với độc giả hiện đại.
- source_word: מצות/ו
  choice: các điều răn của Ngài
  rationale: Dạng văn bản được cung cấp có hậu tố ngôi thứ ba giống đực số ít, nghĩa là “của Ngài”. Bản dịch giữ nguyên cách đọc này thay vì âm thầm sửa cho phù hợp với ngôi thứ nhất trong ngữ cảnh.
theological_decisions:
- issue: Đại từ sở hữu trong cụm “các điều răn”
  choice: các điều răn của Ngài
  alternative: các điều răn của ta
  rationale: Văn bản Hê-bơ-rơ được cung cấp có hậu tố ngôi thứ ba số ít (“của Ngài”), dù lời phán ở ngôi thứ nhất và một số thủ bản cùng bản dịch đọc “của ta”. Chính văn theo nguồn đã cho; dị bản có ý nghĩa được ghi trong chú thích để bảo tồn sự căng thẳng của văn bản.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ta” cho lời Đức Chúa Trời đang phán và “Ngài” để thể hiện rõ sự chuyển bất thường sang ngôi thứ ba trong văn bản nguồn. Dấu chú thích [a] được đặt ngay sau cụm “hàng ngàn người” theo lớp tham khảo, dù nội dung chú thích chủ yếu giải thích dị bản đại từ ở cuối câu.
