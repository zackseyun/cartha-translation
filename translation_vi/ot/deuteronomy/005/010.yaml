    issue: Neo chú thích [a] hiện đặt sau “hàng ngàn người”, trong khi chú thích chỉ giải thích dị bản ở “các điều răn của Ngài”.
    rationale: Neo chú thích cần đứng ngay sau từ/cụm từ mà nó chú giải, để người đọc không hiểu nhầm chú thích liên quan đến “hàng ngàn”.
  - severity: low
    issue: Cụm “là những người yêu mến ta” tạo sắc thái đồng nhất hóa và hơi nặng trong tiếng Việt.
    rationale: Tiếng Hê-bơ-rơ dùng cụm phân từ với giới từ, không cần từ nối giải thích “là”. Bỏ cụm này giúp giữ cách diễn đạt cô đọng và tự nhiên hơn.
