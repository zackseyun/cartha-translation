base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/004.yaml
  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: vi
  text: 'Hãy nghe, hỡi Israel: Gia-vê, Đức Chúa Trời của chúng ta, Gia-vê là một.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Gia-vê là Đức Chúa Trời của chúng ta, chỉ một mình Gia-vê”; hoặc, theo một cách phân tích cú pháp khác: “Gia-vê, Đức Chúa Trời của chúng ta, là một Gia-vê.” Cách diễn đạt Hê-bơ-rơ rất cô đọng và cho phép hơn một cách hiểu hợp lý.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: hãy nghe
  rationale: Động từ mệnh lệnh số ít, nói với Israel như một cộng đồng. “Hãy nghe” vừa giữ nghĩa nghe bằng tai vừa hàm ý chú tâm và vâng theo lời giao ước.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Tên riêng của dân giao ước, được phiên chuyển theo cách viết thông dụng trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt để biểu thị Danh Thánh יהוה, thay vì thay thế bằng một tước hiệu chung.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Dù אֱלֹהִים có hình thức số nhiều, trong ngữ cảnh giao ước này từ có hậu tố ngôi thứ nhất số nhiều chỉ Đức Chúa Trời của Israel ở số ít.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nghĩa cơ bản của số từ/tính từ אֶחָד là “một”, không đưa ý diễn giải “duy nhất” hay “mà thôi” vào chính văn.
theological_decisions:
- issue: Cú pháp và ý nghĩa của mệnh đề cuối trong lời Shema
  choice: Đức Giê-hô-va, Đức Chúa Trời của chúng ta, Đức Giê-hô-va là một
  alternative: 'Đức Giê-hô-va là Đức Chúa Trời của chúng ta, chỉ một mình Đức Giê-hô-va; hoặc: Đức Giê-hô-va, Đức Chúa Trời của chúng ta, là Đức Giê-hô-va duy nhất'
  rationale: Câu Hê-bơ-rơ không có động từ nối và có cấu trúc cô đọng, nên cho phép nhiều cách phân tích cú pháp hợp lý. Chính văn giữ cách hiểu trực tiếp với אֶחָד là “một”; chú thích bảo tồn các cách đọc khác thay vì âm thầm giải quyết sự mơ hồ thần học.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu. “Hỡi Israel” làm rõ đối tượng được gọi; “hãy nghe” giữ sắc thái mệnh lệnh. Dùng dấu phẩy để phản ánh cấu trúc cô đọng của nguyên văn mà không thêm động từ ngoài điều tiếng Việt cần có.
