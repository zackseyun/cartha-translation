  terminology: “Yahweh”, “Đức Chúa Trời”, “kính sợ”, và “phụng sự” đều nhất quán với lựa chọn từ vựng và không thu hẹp nghĩa của nguyên ngữ. Tuy nhiên, chú thích a dùng “kinh ngạc”, vốn thường chỉ sự ngạc nhiên hơn là lòng kính sợ/uy nghiêm, nên cần chỉnh để tránh lệch nghĩa.
