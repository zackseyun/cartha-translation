source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א וְ/אֹת֣/וֹ תַעֲבֹ֑ד וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: vi
  text: Ngươi phải kính sợ Yahweh, Đức Chúa Trời của ngươi[a]; phải phụng sự Ngài[b] và nhân danh Ngài mà thề.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kính úy Yahweh, Đức Chúa Trời của ngươi”; động từ Hê-bơ-rơ bao hàm lòng tôn kính, sự kinh úy và kính sợ, chứ không chỉ sự khiếp đảm.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thờ phượng Ngài”; động từ Hê-bơ-rơ thường có nghĩa là “phục vụ” và trong ngữ cảnh này bao hàm sự phụng sự mang tính thờ phượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời theo dạng chuyển tự, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Dạng liên kết với hậu tố ngôi hai số ít giống đực được diễn đạt tự nhiên và giữ sắc thái giao ước.
- source_word: תִּירָא
  choice: phải kính sợ
  rationale: Cụm này giữ cả ý kính reverence, kinh ngạc và sợ hãi trước sự thánh khiết, chứ không chỉ là khiếp đảm.
- source_word: וְאֹתוֹ
  choice: Ngài
  rationale: Đại từ làm tân ngữ được thể hiện rõ; không thêm từ “chỉ” vì ý độc nhất tuy có trong ngữ cảnh nhưng không được nói minh nhiên trong câu này.
- source_word: תַעֲבֹד
  choice: phải phụng sự
  rationale: “Phụng sự” giữ nghĩa phục vụ đồng thời phù hợp với bối cảnh thờ phượng và trung thành giao ước, mà không thu hẹp động từ thành hoạt động nghi lễ.
- source_word: וּבִשְׁמוֹ
  choice: và nhân danh Ngài
  rationale: Trong ngữ cảnh lời thề, giới từ ב chỉ danh hoặc thẩm quyền được viện dẫn; “nhân danh” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: תִּשָּׁבֵעַ
  choice: mà thề
  rationale: Dạng Niphal của שׁבע có nghĩa là thề hoặc lập lời thề; cách dịch này ngắn gọn và tự nhiên khi đi với “nhân danh”.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Dấu hiệu tân ngữ trực tiếp không có từ tương đương độc lập trong tiếng Việt; chức năng của nó được thể hiện qua cú pháp.
theological_decisions:
- issue: Có nên làm nhẹ nghĩa “kính sợ” thành chỉ “tôn kính” hay không
  choice: Giữ “kính sợ” trong chính văn
  alternative: tôn kính; kính úy
  rationale: Động từ Hê-bơ-rơ bao hàm lòng tôn kính, kinh ngạc và nỗi sợ thánh; “kính sợ” bảo toàn sức nặng và sự căng thẳng thần học của mệnh lệnh.
- issue: Dịch עבד là “phụng sự” hay “thờ phượng”
  choice: phụng sự
  alternative: thờ phượng
  rationale: “Phụng sự” giữ phạm vi nghĩa rộng về sự phục vụ và lòng trung thành giao ước, đồng thời vẫn hàm chứa sự thờ phượng trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ lời xưng hô ngôi hai số ít và sắc thái mệnh lệnh giao ước; dùng “Ngài” khi quy chiếu về Yahweh. Cấu trúc ba vế được làm tự nhiên trong tiếng Việt nhưng vẫn giữ trật tự và trọng tâm của nguyên văn.
