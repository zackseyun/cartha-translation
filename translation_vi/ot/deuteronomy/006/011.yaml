  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: vi
  text: cùng những ngôi nhà đầy đủ mọi thứ tốt đẹp mà anh em không làm đầy, những bể chứa nước được đục mà anh em không đục[a], những vườn nho và những cây ô-liu mà anh em không trồng; và anh em sẽ ăn và no đủ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có thể được dịch là “giếng”. Tuy nhiên, từ này ở đây nhiều khả năng chỉ các bể chứa nước được đục vào đá để trữ nước.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “và anh em sẽ ăn và được no”. Các động từ tiếp tục chuỗi những điều sẽ xảy ra khi Israel vào xứ. Trong tiếng Hê-bơ-rơ, động từ ở dạng số ít, nói với Israel như một toàn thể.'
    reason: source_form_and_temporal_sequence
lexical_decisions:
- source_word: בָתִּים
  choice: những ngôi nhà
  rationale: Giữ nghĩa cụ thể của danh từ số nhiều trong danh sách các tài sản vật chất.
- source_word: מְלֵאִים כָּל טוּב
  choice: đầy mọi thứ tốt đẹp
  rationale: Diễn đạt tự nhiên ý nhà cửa chứa đầy mọi loại của cải và vật dụng hữu ích, không giới hạn vào phẩm chất đạo đức.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: mà anh em không chất vào
  rationale: Trong ngữ cảnh nhà cửa và tài sản, “chất vào” tự nhiên hơn “làm đầy”, đồng thời giữ sự tương phản rằng dân Israel không tự chuẩn bị những thứ ấy.
- source_word: בֹרֹת חֲצוּבִים
  choice: những bể chứa nước đã được đục trong đá
  rationale: בֹרֹת ở đây nhiều khả năng là bể chứa nước, còn חֲצוּבִים chỉ việc đục hoặc khoét; thêm “trong đá” làm rõ hình ảnh hàm chứa trong động từ mà không biến chúng thành giếng có mạch nước.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: mà anh em không đục
  rationale: Giữ sự lặp từ với “đã được đục” và nhấn mạnh công việc mà dân không thực hiện.
- source_word: כְּרָמִים
  choice: những vườn nho
  rationale: Chỉ khu đất trồng nho, không chỉ các cây nho riêng lẻ.
- source_word: זֵיתִים
  choice: cây ô-liu
  rationale: Trong mạch văn về những gì được trồng, số nhiều này tự nhiên được hiểu là cây ô-liu.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: mà anh em không trồng
  rationale: Bảo toàn cấu trúc lặp lại về những của cải dân Israel được hưởng nhưng không tự tạo ra.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: Khi anh em ăn no nê
  rationale: Hai động từ tiếp tục chuỗi sự việc sẽ xảy ra khi dân vào đất; “ăn no nê” truyền đạt gọn và tự nhiên cả hành động ăn lẫn trạng thái no đủ.
theological_decisions:
- issue: Tính chất của sự sung túc được hứa ban
  choice: Trình bày đơn thuần những của cải vật chất dân Israel được hưởng dù không tự tạo ra
  alternative: Đưa ngay lời cảnh báo hoặc hàm ý các của cải ấy là bất chính vào câu này
  rationale: Câu này liệt kê sự cung ứng; lời cảnh báo xuất hiện ở câu kế tiếp. Bản dịch không nhập phần giải thích đó vào câu 11.
- issue: Đại từ ngôi thứ hai số ít mang nghĩa tập thể
  choice: Dùng “anh em” để chỉ cộng đồng Israel
  alternative: Dùng “ngươi” để phản ánh hình thức số ít sát hơn
  rationale: Tiếng Hê-bơ-rơ dùng số ít giao ước để nói với Israel như một toàn thể. “Anh em” tự nhiên và trang trọng trong tiếng Việt hiện đại, tuy làm rõ nghĩa tập thể hơn hình thức nguồn; chú thích ghi nhận đặc điểm này.
- issue: Quan hệ thời gian của hai động từ cuối
  choice: Dịch “Khi anh em ăn no nê” như một sự việc trong chuỗi tương lai
  alternative: 'Dịch theo bề mặt hoàn thành: “anh em đã ăn và đã no”'
  rationale: Trong văn mạch, các động từ nối tiếp những điều sẽ xảy ra khi Israel vào đất. Cách dịch giữ quan hệ tương lai mà không buộc phải thêm “sẽ” vào từng động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho Israel tập thể; dùng “ô-liu” là cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt. Dấu gạch cuối câu giữ cho câu này nối sang lời cảnh báo ở câu 12.
