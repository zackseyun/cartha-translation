  text: וּ/צְדָקָ֖ה תִּֽהְיֶה לָּ֑/נוּ כִּֽי נִשְׁמֹ֨ר לַ/עֲשׂ֜וֹת אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵ֖י/נוּ כַּ/אֲשֶׁ֥ר צִוָּֽ/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: vi
  text: Và điều này sẽ là sự công chính[a] cho chúng ta nếu chúng ta cẩn thận làm theo toàn bộ điều răn này[b] trước mặt Yahweh, Đức Chúa Trời chúng ta, như Ngài đã truyền cho chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “điều đúng đắn” hoặc “sự công bằng”. Từ Hê-bơ-rơ צְדָקָה có thể chỉ điều phải lẽ hoặc công bằng, nhưng “sự công chính” phù hợp nhất với bối cảnh giao ước ở đây.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “toàn thể điều răn này”. Danh từ “điều răn” ở số ít có lẽ chỉ toàn bộ lời chỉ dạy như một thể thống nhất.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: sự công chính
  rationale: צְדָקָה chỉ điều đúng đắn hoặc công chính; trong bối cảnh giao ước, “sự công chính” giữ được sắc thái đạo đức và tư pháp mà không thu hẹp nghĩa thành công bằng xã hội.
- source_word: תִּהְיֶה לָּנוּ
  choice: sẽ là ... cho chúng ta
  rationale: Giữ cấu trúc vị ngữ của tiếng Hê-bơ-rơ và không đưa thêm ý niệm thần học kỹ thuật như “được kể là” khi nguyên văn không nói rõ.
- source_word: כִּי
  choice: nếu
  rationale: Trong ngữ cảnh này, כִּי hợp lý nhất khi giới thiệu điều kiện để lời khẳng định phía trước có hiệu lực; “nếu” diễn đạt tự nhiên trong tiếng Việt.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: cẩn thận làm theo
  rationale: שׁמר đi với động từ nguyên mẫu nhấn mạnh sự chuyên tâm, cẩn trọng trong việc thực hiện; cách dịch này vừa tự nhiên vừa giữ sắc thái ấy.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: toàn bộ điều răn này
  rationale: Danh từ số ít cùng כָּל có thể trình bày lời chỉ dạy như một tổng thể thống nhất; “toàn bộ điều răn này” giữ được số ít và tự nhiên hơn lối dịch sát từng từ.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Diễn đạt việc sống và hành động trong sự hiện diện, dưới ánh nhìn của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Giữ đầy đủ quan hệ giao ước được biểu thị bởi hậu tố sở hữu.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: như Ngài đã truyền cho chúng ta
  rationale: Thể hoàn thành chỉ mệnh lệnh đã được ban trước đó; “đã truyền” phù hợp với thời điểm và văn phong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “sự công chính” trong bối cảnh vâng phục giao ước
  choice: Bản dịch khẳng định rằng sự vâng phục ấy “sẽ là sự công chính cho chúng ta” trong phạm vi giao ước, nhưng không giải thích bằng một cơ chế thần học kỹ thuật về sự quy kể.
  alternative: Dịch là “công lý cho chúng ta” hoặc diễn giải thành “sẽ được kể là công chính cho chúng ta”.
  rationale: Nguyên văn liên kết thực sự sự vâng phục giao ước với sự công chính, nhưng không xác định những phạm trù hệ thống về sau; giữ nguyên cách nói giúp bảo tồn sức căng thần học của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Cẩn thận làm theo” chuyển tải thành ngữ Hê-bơ-rơ tự nhiên hơn “giữ để làm”; “trước mặt” giữ sắc thái sống trong sự hiện diện của Đức Chúa Trời. Các dấu chú thích xuất hiện ngay sau những cụm từ liên quan.
