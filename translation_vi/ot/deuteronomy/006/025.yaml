    rationale: Nguyên văn có cấu trúc vị ngữ được đặt lên đầu; tiếng Việt cần một chủ ngữ chỉ xuất tự nhiên hơn. “Điều này” có thể chỉ việc cẩn thận làm theo điều răn được diễn đạt ở mệnh đề điều kiện, mà không thay đổi nghĩa.
