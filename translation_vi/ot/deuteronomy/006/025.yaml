- from: Và điều ấy sẽ là sự công chính[a] cho chúng ta, nếu chúng ta cẩn thận làm theo toàn bộ điều răn này[b] trước mặt Yahweh, Đức Chúa Trời của chúng ta, như Ngài đã truyền cho chúng ta.
  to: Và điều này sẽ là sự công chính[a] cho chúng ta nếu chúng ta cẩn thận làm theo toàn bộ điều răn này[b] trước mặt Yahweh, Đức Chúa Trời chúng ta, như Ngài đã truyền cho chúng ta.
