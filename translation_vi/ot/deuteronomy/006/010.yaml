base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: vi
  text: Và khi Yahweh, Đức Chúa Trời của anh em, đưa anh em vào miền đất mà Ngài đã thề với các tổ phụ[a] của anh em—với Áp-ra-ham, Y-sác và Gia-cốp—để ban cho anh em những thành lớn và tốt đẹp mà anh em không xây cất,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tổ tiên.” Tiếng Hê-bơ-rơ nói “các cha của anh em,” và ngay sau đó nêu rõ Áp-ra-ham, Y-sác và Gia-cốp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Khi
  rationale: Cấu trúc này mở ra một hoàn cảnh tương lai. “Khi” diễn đạt tự nhiên trong tiếng Việt; mạch nối với câu trước được thể hiện qua ngữ cảnh.
- source_word: יְבִיאֲךָ
  choice: đưa anh em vào
  rationale: Dạng Hifil của בוא mang nghĩa khiến đi vào, tức “đưa vào”; cách dịch này giữ sắc thái nguyên nhân và tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở hữu của hậu tố ngôi thứ hai số ít; “anh em” phù hợp với cách Môi-se nói với toàn thể dân như một cộng đồng.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Trong bối cảnh lời hứa giao ước của Phục Truyền Luật Lệ Ký, từ này chỉ miền đất được hứa ban.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: mà Ngài đã thề
  rationale: Giữ rõ ngôn ngữ tuyên thệ của động từ שׁבע, không làm nhẹ thành lời hứa thông thường.
- source_word: לַאֲבֹתֶיךָ
  choice: với các tổ phụ
  rationale: Chỉ các bậc cha ông thuộc dòng tộc được nêu đích danh ngay sau đó; “tổ phụ” vừa chính xác vừa trang trọng, tự nhiên trong văn cảnh Kinh Thánh.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: với Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; giới từ chung “với” chi phối danh sách, tránh lặp gượng mà không làm mất quan hệ cú pháp.
- source_word: לָתֶת לָךְ
  choice: rằng sẽ ban cho anh em
  rationale: Diễn đạt mục đích/nội dung của lời thề theo cú pháp tiếng Việt, đồng thời giữ ý Đức Chúa Trời là Đấng ban đất.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: những thành lớn và tốt đẹp
  rationale: “Lớn” giữ nghĩa kích thước hoặc tầm vóc của גְּדֹלֹת; “tốt đẹp” chuyển tải phẩm chất đáng ưa của טֹבֹת mà không diễn giải quá mức thành “phồn thịnh”.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: mà anh em không xây cất
  rationale: Chuyển trực tiếp mệnh đề quan hệ phủ định; “xây cất” là cách nói tự nhiên và trang trọng vừa phải.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn đây là danh riêng thay vì thay bằng tước hiệu.
- issue: Cách dịch לַאֲבֹתֶיךָ
  choice: các tổ phụ của anh em
  alternative: tổ tiên của anh em
  rationale: Danh từ Hê-bơ-rơ mang giống đực số nhiều và văn cảnh lập tức xác định Áp-ra-ham, Y-sác và Gia-cốp. “Các tổ phụ” giữ nét chỉ những người cha của dân tộc, còn “tổ tiên” rộng và trung tính hơn.
- issue: Đối tượng số ít trong tiếng Hê-bơ-rơ khi nói với toàn dân
  choice: anh em
  alternative: ngươi
  rationale: Các hậu tố và động từ ở ngôi thứ hai giống đực số ít trình bày Y-sơ-ra-ên như một cộng đồng thống nhất. “Anh em” truyền đạt lời nói với toàn dân bằng tiếng Việt tự nhiên mà không biến đối tượng thành một cá nhân riêng lẻ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ tên Yahweh và ngôn ngữ giao ước; dùng “anh em” cho ngôi thứ hai số ít mang tính tập thể. Dấu phẩy cuối câu phản ánh câu 10 tiếp tục sang câu kế tiếp.
