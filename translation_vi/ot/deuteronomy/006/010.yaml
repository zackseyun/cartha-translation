- from: Khi Yahweh, Đức Chúa Trời của anh em, đưa anh em vào miền đất mà Ngài đã thề với các tổ phụ[a] của anh em—với Áp-ra-ham, Y-sác và Gia-cốp—rằng sẽ ban cho anh em, là nơi có những thành lớn và tốt đẹp mà anh em không xây cất,
