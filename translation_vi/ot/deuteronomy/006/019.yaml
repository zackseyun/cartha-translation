source:
  edition: WLC
  text: לַ/הֲדֹ֥ף אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/019.yaml
  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: vi
  text: để đánh đuổi mọi kẻ thù của anh em khỏi trước mặt anh em[a], như Yahweh đã phán[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “khỏi trước mặt anh em,” một thành ngữ chỉ việc loại bỏ quân thù khỏi đường đi hoặc sự hiện diện của dân.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “như Yahweh đã nói.” Động từ Hê-bơ-rơ theo nghĩa đen là “nói/phán,” chỉ lời Đức Chúa Trời đã nói trước đó và vẫn còn hiệu lực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַהֲדֹף
  choice: để đánh đuổi
  rationale: Dạng nguyên mẫu với ל־ diễn tả mục đích hoặc kết quả tiếp nối câu trước; Hiphil của נדף ở đây mang nghĩa khiến quân thù phải rời đi. “Đánh đuổi” tự nhiên trong bối cảnh quân sự.
- source_word: אֶת
  choice: '[dấu chỉ tân ngữ trực tiếp, không dịch]'
  rationale: Dấu chỉ tân ngữ trực tiếp trong tiếng Hê-bơ-rơ không có từ tương đương cần biểu đạt trong tiếng Việt.
- source_word: כָּל
  choice: mọi
  rationale: “Mọi” truyền đạt trọn vẹn ý bao quát của כָּל trước danh từ số nhiều.
- source_word: אֹיְבֶיךָ
  choice: kẻ thù của anh em
  rationale: Giữ đại từ ngôi thứ hai số ít chỉ tập thể Israel; “anh em” phù hợp văn phong tiếng Việt khi Môi-se trực tiếp nói với dân chúng.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt anh em
  rationale: Giữ hình ảnh nguyên văn “khỏi mặt/sự hiện diện của anh em” và giới từ מן, đồng thời chú thích ý nghĩa thành ngữ là loại bỏ khỏi đường đi hoặc sự hiện diện.
- source_word: כַּאֲשֶׁר
  choice: như
  rationale: Diễn đạt ngắn gọn quan hệ tương ứng giữa việc đánh đuổi quân thù và lời Đức Chúa Trời đã phán.
- source_word: דִּבֶּר
  choice: đã phán
  rationale: Dịch sát động từ דבר ở thể hoàn thành, chỉ lời thần phán trước đó; không đổi thành “đã hứa,” vì đó là cách diễn giải mạnh hơn từ ngữ gốc.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của דִּבֶּר trong văn mạch giao ước
  choice: đã phán
  alternative: đã hứa
  rationale: “Đã phán” giữ nguyên nghĩa từ vựng và mốc lời phán có trước, trong khi văn mạch vẫn cho phép người đọc nhận ra hiệu lực còn tiếp diễn; “đã hứa” sẽ giải quyết hàm ý theo hướng diễn giải.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu này tiếp nối cú pháp của câu 18 nên mở đầu bằng “để.” Dùng “anh em” cho đại từ số ít mang nghĩa tập thể hướng đến Israel; giữ “Yahweh” là danh riêng. Các dấu chú thích [a], [b] đều xuất hiện ngay sau thành phần liên quan.
