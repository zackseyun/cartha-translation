  - severity: medium
    issue: Liên kết của “trong một xứ...” bị lửng sau “đã phán với anh em”
    rationale: Cách đặt hiện tại dễ khiến cụm giới từ bổ nghĩa trực tiếp cho hành vi “đã phán”. Đưa cụm này vào mệnh đề kết quả phản ánh cách đọc chính văn đã chọn, trong khi chú thích vẫn bảo lưu cách đọc thay thế.
