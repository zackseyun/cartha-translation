base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: vi
  text: Vậy, hỡi Israel, hãy nghe và cẩn thận làm theo, để mọi sự được tốt lành cho anh em và anh em gia tăng thật đông đảo trong một xứ đượm sữa và mật, đúng như Yahweh, Đức Chúa Trời của tổ phụ anh em, đã phán với anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu phần cuối là: “như Yahweh, Đức Chúa Trời của tổ phụ anh em, đã hứa ban cho anh em một xứ đượm sữa và mật.” Nguyên văn Hê-bơ-rơ cô đọng; cụm “một xứ đượm sữa và mật” có thể được hiểu là nội dung điều Yahweh đã phán về hoặc hứa ban.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: hãy nghe
  rationale: Giữ nghĩa cơ bản của שׁמע, đồng thời để sắc thái vâng lời được thể hiện qua mệnh đề tiếp theo “cẩn thận làm theo”.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: cẩn thận làm theo
  rationale: Diễn đạt tự nhiên sự kết hợp giữa việc chuyên tâm tuân giữ và thực hành; “theo” quy chiếu đến các điều răn trong văn cảnh.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: để anh em được phước
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ về việc mọi sự tốt lành cho người nghe; “được phước” tự nhiên trong văn phong Kinh Thánh Việt ngữ nhưng không giới hạn ý vào thịnh vượng vật chất.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: và gia tăng thật đông đảo
  rationale: Nêu rõ sự gia tăng về số dân, là nghĩa thích hợp của רבה trong ngữ cảnh này.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: như ... đã phán
  rationale: Giữ nghĩa trực tiếp “đã phán”, không giải thích mạnh hơn thành “đã hứa”, dù lời hứa được hàm ý trong văn cảnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Đức Chúa Trời của tổ phụ anh em
  rationale: “Tổ phụ” giữ sắc thái nam tính của אָבוֹת, đồng thời là cách nói trang trọng và quen thuộc trong tiếng Việt.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: một xứ đượm sữa và mật
  rationale: Thành ngữ Việt ngữ gọn, trang trọng, chuyển tải hình ảnh vùng đất dồi dào sữa và mật.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng.
- issue: Cụm אֱלֹהֵי אֲבֹתֶיךָ
  choice: Đức Chúa Trời của tổ phụ anh em
  alternative: Đức Chúa Trời của tổ tiên anh em
  rationale: “Tổ phụ” phản ánh danh từ giống đực số nhiều trong nguyên văn, không trung tính hóa thành “tổ tiên”.
- issue: Quan hệ cú pháp của אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 'gắn với hoàn cảnh nơi Israel được gia tăng: “trong một xứ...”'
  alternative: 'coi là nội dung lời hứa: “đã hứa ban cho anh em một xứ...”'
  rationale: Cú pháp Hê-bơ-rơ cô đọng và có thể hiểu theo cả hai cách; chính văn giữ cách nối gần mặt chữ, còn chú thích bảo tồn cách hiểu thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” để chỉ Israel như một cộng đồng, phù hợp với đại từ số ít tập thể rồi chuyển sang động từ số nhiều trong nguyên văn. Giữ danh “Yahweh” và thuật ngữ “tổ phụ”; chú thích nêu cách phân tích cú pháp khác mà không áp đặt một cách hiểu duy nhất.
