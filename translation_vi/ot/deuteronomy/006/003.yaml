- from: Vậy, hỡi Israel, hãy nghe và cẩn thận làm theo, để anh em được phước và gia tăng thật đông đảo, như Yahweh, Đức Chúa Trời của tổ phụ anh em, đã phán với anh em, trong một xứ đượm sữa và mật.[a]
  to: Vậy, hỡi Israel, hãy nghe và cẩn thận làm theo, để mọi sự được tốt lành cho anh em và anh em gia tăng thật đông đảo trong một xứ đượm sữa và mật, đúng như Yahweh, Đức Chúa Trời của tổ phụ anh em, đã phán với anh em.[a]
