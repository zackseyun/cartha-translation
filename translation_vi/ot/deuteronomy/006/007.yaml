base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: vi
  text: Hãy dạy kỹ những lời ấy cho con trai[a] của anh, và nói về những lời ấy khi anh ngồi trong nhà, khi đi trên đường, khi nằm xuống và khi thức dậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt: “hãy làm cho con trai anh khắc ghi những lời ấy.” Động từ Hê-bơ-rơ theo nghĩa đen gợi ý việc mài sắc; trong ngữ cảnh này, nó chỉ sự truyền dạy kỹ lưỡng và lặp đi lặp lại. Nguyên văn là “con trai”; theo nghĩa mở rộng, lời chỉ dẫn này áp dụng cho gia đình nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: Hãy chuyên cần dạy những lời ấy
  rationale: Động từ שׁנן theo nghĩa đen liên quan đến việc mài sắc, nhưng tại đây được dùng theo nghĩa ẩn dụ về việc dạy đi dạy lại cách kỹ lưỡng. Cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái chuyên tâm, lặp lại.
- source_word: לְבָנֶיךָ
  choice: cho các con trai của anh em
  rationale: בנים là danh từ giống đực số nhiều, nghĩa trực tiếp là “các con trai”. Bản dịch giữ hình thức giới tính của nguyên văn; phạm vi áp dụng rộng hơn trong gia đình được ghi chú.
- source_word: וְדִבַּרְתָּ בָּם
  choice: và nói về những lời ấy
  rationale: Giới từ ב sau דבר trong cấu trúc này được hiểu tự nhiên là nói về điều gì. “Những lời ấy” làm rõ đại từ số nhiều chỉ các lời truyền dạy trong văn cảnh.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: khi anh em ngồi trong nhà
  rationale: Nguyên thể kết hợp với ב diễn tả hoàn cảnh thời gian; cách dịch ngắn gọn và mang nghĩa thói quen.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: khi đi trên đường
  rationale: דֶּרֶךְ là đường hoặc lối đi. Cụm “đi trên đường” vừa sát nghĩa vừa tự nhiên, bao hàm sinh hoạt và di chuyển thường ngày.
- source_word: וּבְשָׁכְבְּךָ
  choice: khi nằm xuống
  rationale: Cụm từ chỉ lúc nằm xuống, đặc biệt là lúc đi ngủ; cách dịch giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ.
- source_word: וּבְקוּמֶךָ
  choice: khi thức dậy
  rationale: קוּם có nghĩa là đứng dậy hoặc trỗi dậy. Trong cặp đối xứng với “nằm xuống”, “thức dậy” truyền đạt tự nhiên ý chỉ lúc bắt đầu ngày mới.
theological_decisions:
- issue: Danh từ chỉ con cái mang giống đực trong lời dạy giao ước
  choice: các con trai
  alternative: các con
  rationale: Nguyên văn dùng בנים, giống đực số nhiều. Giữ “các con trai” bảo toàn nét từ vựng của nguồn; chú thích nêu khả năng lời dạy được áp dụng rộng hơn trong gia đình mà không thay đổi câu chính.
- issue: Sắc thái của mệnh lệnh dạy dỗ
  choice: chuyên cần dạy
  alternative: khắc ghi vào lòng
  rationale: שׁנן mang hình ảnh “mài sắc” và trong ngữ cảnh có nghĩa dạy kỹ, lặp lại. “Chuyên cần dạy” không quyết định quá mức đối tượng được khắc ghi là lời hay lòng người, trong khi phương án “khắc ghi vào lòng” bổ sung một đối tượng không hiện diện rõ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ ngôi hai giống đực số ít mang tính đại diện trong lời Môi-se nói với dân giao ước; các động từ tiếp theo lược bớt chủ ngữ khi tiếng Việt cho phép để câu không nặng nề. Giữ nhịp liệt kê đối xứng của nguyên văn.
