  text: לְמַ֨עַן תִּירָ֜א אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ֠/שְׁמֹר אֶת כָּל חֻקֹּתָ֣י/ו וּ/מִצְוֺתָי/ו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ/ךָ֒ אַתָּה֙ וּ/בִנְ/ךָ֣ וּ/בֶן בִּנְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וּ/לְמַ֖עַן יַאֲרִכֻ֥/ן יָמֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: vi
  text: để anh em kính sợ Yahweh, Đức Chúa Trời của anh em,[a] bằng cách tuân giữ mọi luật lệ và điều răn của Ngài mà tôi truyền cho anh em—anh em, con trai và cháu trai của anh em[b]—suốt mọi ngày của đời anh em, và để anh em được sống lâu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôn kính Yahweh, Đức Chúa Trời của anh em.” Động từ Hê-bơ-rơ bao hàm sự kính cẩn, lòng tôn kính, cũng như sự sợ hãi.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “anh em, con trai anh em và con trai của con trai anh em.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “để những ngày của anh em được kéo dài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên mục đích hoặc kết quả của mệnh đề Hê-bơ-rơ.
- source_word: תִּירָא
  choice: kính sợ
  rationale: Giữ cả sắc thái sợ hãi, tôn kính và kính cẩn đối với Đức Chúa Trời, không giản lược thành sự tôn trọng đơn thuần.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được ghi trực tiếp trong bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Thể hiện quan hệ giao ước và phù hợp với đại từ số ít mang tính đại diện, được dịch tự nhiên bằng “anh em” trong tiếng Việt.
- source_word: לִשְׁמֹר
  choice: bằng cách tuân giữ
  rationale: Làm rõ việc tuân giữ là cách sự kính sợ Yahweh được biểu hiện; “tuân giữ” tự nhiên trong văn cảnh luật pháp giao ước.
- source_word: חֻקֹּתָיו
  choice: mọi luật lệ của Ngài
  rationale: Chỉ các quy định được thiết lập và duy trì sự phân biệt với מִצְוֺתָיו.
- source_word: מִצְוֺתָיו
  choice: điều răn của Ngài
  rationale: Giữ sắc thái trang trọng của các mệnh lệnh giao ước và phân biệt với “luật lệ”.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: mà tôi truyền cho anh em
  rationale: Phản ánh lời Môi-se đang trực tiếp truyền dạy; tiếng Việt hiện đại không cần hình thức tiếp diễn để thể hiện tình huống phát ngôn.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: anh em, con trai và cháu trai của anh em
  rationale: Giữ ba thế hệ được nêu rõ; “cháu trai” là cách nói tự nhiên, còn chú thích bảo lưu nghĩa đen “con trai của con trai”.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: suốt mọi ngày đời anh em
  rationale: Bám sát hình ảnh “mọi ngày của đời” mà vẫn trang trọng và dễ hiểu.
- source_word: יַאֲרִכֻן יָמֶיךָ
  choice: anh em được sống lâu
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ nói về việc các ngày được kéo dài; chú thích giữ cách diễn đạt sát chữ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH; giữ “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của ירא khi hướng về Đức Chúa Trời
  choice: kính sợ
  alternative: tôn kính
  rationale: “Kính sợ” bảo lưu sự căng thẳng giữa sợ hãi, kính cẩn và lòng tôn kính, đồng thời phù hợp với mối liên hệ giữa thái độ ấy và sự vâng phục giao ước.
- issue: Số của đại từ ngôi thứ hai
  choice: anh em
  alternative: ngươi
  rationale: Bản Hê-bơ-rơ dùng số ít để nói với dân Y-sơ-ra-ên như một cộng đồng thống nhất. “Anh em” tự nhiên và có phẩm cách trong tiếng Việt hiện đại, dù về hình thức là số nhiều.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chuyển đại từ số ít tập thể chỉ Y-sơ-ra-ên; dùng dấu gạch ngang để làm nổi bật ba thế hệ. Các thuật ngữ “luật lệ” và “điều răn” được phân biệt nhất quán.
