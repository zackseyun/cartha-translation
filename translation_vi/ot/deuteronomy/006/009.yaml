  yaml_path: translation/ot/deuteronomy/006/009.yaml
  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: vi
  text: Hãy viết những lời ấy trên các trụ cửa[a] nhà ngươi và trên các cổng[b] của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các khung cửa.” Từ Hê-bơ-rơ chỉ cụ thể các trụ ở hai bên lối cửa.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trên các trụ cổng của ngươi” hoặc “tại các cổng của ngươi.” Từ Hê-bơ-rơ có thể chỉ cổng, khu vực cổng, hoặc phần kết cấu của lối vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Hãy viết những lời ấy
  rationale: Động từ với liên từ trong chuỗi mệnh lệnh mang ý nghĩa truyền khiến; hậu tố số nhiều được diễn đạt rõ là “những lời ấy,” quy chiếu về những lời đã nêu trong ngữ cảnh trước.
- source_word: עַל
  choice: trên
  rationale: Giữ nguyên ý nghĩa không gian, chỉ vị trí nơi các lời được viết.
- source_word: מְזוּזֹת
  choice: các cột cửa
  rationale: Danh từ Hê-bơ-rơ chỉ các trụ hoặc cột hai bên lối cửa; “cột cửa” chính xác và tự nhiên hơn cách phiên âm thuật ngữ.
- source_word: בֵּיתֶךָ
  choice: nhà anh em
  rationale: “Nhà” giữ nghĩa cụ thể của בַּיִת. Đại từ Hê-bơ-rơ ở số ít, nhưng trong tiếng Việt dùng “anh em” để tiếp tục cách xưng hô tập thể với dân Y-sơ-ra-ên mà không làm câu văn thiếu tự nhiên.
- source_word: וּבִשְׁעָרֶיךָ
  choice: và trên các cổng của anh em
  rationale: שַׁעַר có thể chỉ cổng hoặc khu vực lối vào có cổng. “Các cổng” bảo toàn số nhiều và sự song song với vế trước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mệnh lệnh dùng “Hãy”; “anh em” thể hiện lời nói với cộng đồng giao ước, dù các hậu tố Hê-bơ-rơ có hình thức số ít. Cả hai dấu chú thích [a], [b] đều được đặt trong chính văn.
