- from: Hãy viết những lời ấy trên các cột cửa nhà anh em và trên các cổng của anh em.[a][b]
  to: Hãy viết những lời ấy trên các trụ cửa[a] nhà ngươi và trên các cổng[b] của ngươi.
  rationale: Sửa đại từ sở hữu từ “anh em” thành “ngươi” để giữ ngôi số ít của bản gốc. Thay “cột cửa” bằng “trụ cửa” để diễn đạt chính xác hơn các trụ bên của lối vào. Chuyển các ký hiệu chú thích đến ngay sau các thuật ngữ liên quan; không thay đổi ý nghĩa câu.
  reviewer_model: gpt-5.6-terra
