  text: וַ/יִּתֵּ֣ן יְהוָ֡ה אוֹתֹ֣ת וּ֠/מֹפְתִים גְּדֹלִ֨ים וְ/רָעִ֧ים בְּ/מִצְרַ֛יִם בְּ/פַרְעֹ֥ה וּ/בְ/כָל בֵּית֖/וֹ לְ/עֵינֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: vi
  text: Yahweh đã làm những dấu lạ và phép mầu lớn lao, khủng khiếp trên Ai Cập[a], trên Pha-ra-ôn và cả nhà Pha-ra-ôn, ngay trước mắt chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại Ai Cập”. Giới từ Hê-bơ-rơ có thể chỉ nơi các dấu lạ và phép mầu diễn ra, hoặc Ai Cập là đối tượng chịu tác động của các việc ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: đã giáng
  rationale: Động từ נתן có nghĩa cơ bản là “ban, đặt, khiến xảy đến”; trong ngữ cảnh các tai họa nhằm vào Ai Cập, “giáng” diễn đạt tự nhiên hành động khiến các dấu lạ và phép mầu xảy đến mà không làm mất sắc thái tác động lên đối tượng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: những dấu lạ và phép mầu
  rationale: 'Giữ hai danh từ song song: אוֹתֹת là những dấu hiệu có ý nghĩa, còn מֹפְתִים là những việc phi thường gây kinh ngạc. Cụm này tự nhiên và dễ hiểu trong tiếng Việt.'
- source_word: גְּדֹלִים וְרָעִים
  choice: lớn lao, khủng khiếp
  rationale: גְּדֹלִים nói đến tầm vóc lớn; רָעִים ở đây chỉ tính chất tai hại, dữ dội của các biến cố đối với Ai Cập, không nhất thiết hàm ý điều ác về mặt đạo đức.
- source_word: בְּמִצְרַיִם
  choice: trên Ai Cập
  rationale: Giới từ בְּ có thể chỉ địa điểm “tại Ai Cập” hoặc đối tượng chịu tác động. Sự song hành với “trên Pha-ra-ôn” và “trên toàn thể nhà vua” khiến nghĩa tai họa giáng trên Ai Cập phù hợp trong ngữ cảnh; chú thích bảo lưu cách hiểu địa điểm.
- source_word: בְּפַרְעֹה וּבְכָל־בֵּיתוֹ
  choice: trên Pha-ra-ôn và toàn thể nhà vua
  rationale: Các cụm với בְּ nêu những đối tượng chịu tác động. בֵּיתוֹ, “nhà của vua”, có thể bao gồm gia quyến, triều đình hoặc hoàng tộc; “toàn thể nhà vua” giữ được độ rộng và hình ảnh của nguyên văn.
- source_word: לְעֵינֵינוּ
  choice: ngay trước mắt chúng ta
  rationale: Thành ngữ Hê-bơ-rơ chỉ điều chính người nói đã tận mắt chứng kiến; “ngay” làm rõ sắc thái trực tiếp.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời. Bản dịch giữ danh riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt trang trọng, dễ nhận biết.
- issue: Ý nghĩa của וְרָעִים khi mô tả hành động của Đức Chúa Trời
  choice: khủng khiếp
  alternative: tai hại; dữ dội; ác
  rationale: Tính từ רַע ở đây nhấn mạnh hậu quả kinh hoàng của các dấu lạ đối với Ai Cập. “Khủng khiếp” giữ mức độ nghiêm trọng nhưng không tự ý gán cho hành động của Đức Chúa Trời tính ác về luân lý.
- issue: Phạm vi của בֵּיתוֹ
  choice: toàn thể nhà vua
  alternative: toàn thể gia đình vua; toàn thể triều đình vua
  rationale: “Nhà” trong tiếng Hê-bơ-rơ có thể chỉ gia đình, gia thuộc, triều đình hoặc hoàng tộc. Không thu hẹp nghĩa thành riêng gia đình hay triều đình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc ba vế “trên Ai Cập, trên Pha-ra-ôn và toàn thể nhà vua” giữ nhịp liệt kê của nguyên văn. Dấu chú thích [a] xuất hiện ngay sau cụm từ có cách hiểu khác.
