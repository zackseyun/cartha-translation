revisions:
- from: Đức Giê-hô-va đã giáng những dấu lạ và phép mầu lớn lao, khủng khiếp trên Ai Cập[a], trên Pha-ra-ôn và toàn thể nhà vua, ngay trước mắt chúng ta.
  to: Yahweh đã làm những dấu lạ và phép mầu lớn lao, khủng khiếp trên Ai Cập[a], trên Pha-ra-ôn và cả nhà Pha-ra-ôn, ngay trước mắt chúng ta.
  rationale: Bản sửa dùng “Yahweh” theo quyết định danh riêng của POB; thay động từ diễn giải “giáng” bằng “làm”; và thay cụm không tự nhiên “toàn thể nhà vua” bằng “cả nhà Pha-ra-ôn”. Chú thích tại Ai Cập được giữ đúng vị trí và bảo lưu khả năng đọc giới từ theo nghĩa chỉ địa điểm, không quyết đoán một cách không cần thiết.
  reviewer_model: gpt-5.6-terra
