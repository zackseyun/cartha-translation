source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: vi
  text: Anh em phải làm điều ngay thẳng và tốt lành trước mắt Yahweh, để anh em được phước, được vào và chiếm hữu[a] miền đất tốt lành mà Yahweh đã thề ban cho tổ phụ anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thừa hưởng”. Động từ Hê-bơ-rơ có thể mang nghĩa “thừa hưởng”, “sở hữu” hoặc “chiếm hữu”; tại đây, từ này nói đến việc Israel tiến vào và sở hữu miền đất đã được hứa bằng lời thề.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Anh em phải làm
  rationale: Dạng động từ trong văn mạch giáo huấn mang lực mệnh lệnh hướng tới tương lai. “Phải làm” diễn đạt rõ nghĩa vụ giao ước; “anh em” là cách xưng hô tập thể tự nhiên trong tiếng Việt hiện đại dù tiếng Hê-bơ-rơ dùng ngôi hai số ít để gọi Israel như một cộng đồng.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: điều ngay thẳng và tốt lành
  rationale: 'Giữ riêng cả hai phẩm tính đạo đức: יָשָׁר là ngay thẳng, đúng đắn; טוֹב là tốt, tốt lành.'
- source_word: בְּעֵינֵי יְהוָה
  choice: trước mắt Yahweh
  rationale: Thành ngữ đánh giá của tiếng Hê-bơ-rơ được chuyển sang thành ngữ tiếng Việt tự nhiên, vẫn giữ hình ảnh “mắt” và cho biết tiêu chuẩn là điều Yahweh xem là đúng và tốt.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: để anh em được mọi sự tốt đẹp
  rationale: Diễn đạt mục đích hoặc kết quả và tình trạng được thuận lợi, tốt lành, không thu hẹp nghĩa thành sự giàu có vật chất.
- source_word: וּבָאתָ
  choice: được vào
  rationale: Giữ ý chuyển động đi vào miền đất trong chuỗi kết quả được mong đợi.
- source_word: וְיָרַשְׁתָּ
  choice: chiếm hữu
  rationale: Động từ ירשׁ ở đây chỉ việc Israel tiến vào và sở hữu miền đất đã được hứa; “chiếm hữu” giữ sắc thái chủ động, trong khi “thừa hưởng” vẫn là một khả năng từ vựng đáng ghi chú.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: miền đất tốt lành
  rationale: Dịch trực tiếp tính từ đánh giá טוֹבָה mà không giới hạn nó vào độ màu mỡ hay vẻ đẹp.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ
  choice: mà Yahweh đã thề sẽ ban cho tổ phụ anh em
  rationale: “Đã thề” giữ rõ sức nặng của lời thề giao ước. “Sẽ ban” làm sáng tỏ nội dung được hàm ý trong cấu trúc tiếng Hê-bơ-rơ, còn “tổ phụ” phù hợp với sự quy chiếu lịch sử đến các vị cha ông của Israel.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Sắc thái của ירשׁ trong việc nhận miền đất
  choice: chiếm hữu
  alternative: thừa hưởng
  rationale: Văn mạch nói đến việc Israel đi vào và nắm quyền sở hữu miền đất đã được hứa. Bản dịch chính giữ nét chủ động nhưng chú thích bảo tồn khả năng hiểu là “thừa hưởng”.
- issue: Cụm לַאֲבֹתֶיךָ chỉ những người nhận lời thề
  choice: tổ phụ anh em
  alternative: tổ tiên anh em
  rationale: “Tổ phụ” giữ nét nam tính và sự quy chiếu cụ thể đến các vị cha ông gắn với lời hứa giao ước; “tổ tiên” rộng và trung tính hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng như lời xưng hô tập thể với Israel, tránh đại từ “ngươi” mang sắc thái cổ. Cấu trúc câu giữ mạch mệnh lệnh—mục đích/kết quả—lời hứa của nguyên văn.
