base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: vi
  text: Đây là điều răn—các luật lệ và phán quyết—mà Yahweh, Đức Chúa Trời của anh em, đã truyền rằng phải dạy anh em, để anh em thực hành trong xứ mà anh em sắp vượt qua để chiếm hữu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chiếm hữu” cũng có thể dịch là “nhận làm cơ nghiệp” hoặc “chiếm lấy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Đây là
  rationale: Cụm liên từ và đại từ chỉ định mở đầu một phần mới nhưng vẫn nối với phần trước. Tiếng Việt tự nhiên không cần thêm “và” ở đầu câu.
- source_word: הַמִּצְוָה
  choice: điều răn
  rationale: Giữ số ít của nguyên văn, có lẽ dùng như tiêu đề tập thể cho phần giáo huấn giao ước được triển khai ngay sau đó.
- source_word: הַחֻקִּים וְהַמִּשְׁפָּטִים
  choice: các luật lệ và phán quyết
  rationale: “Luật lệ” diễn đạt các quy định đã được ấn định; “phán quyết” giữ sắc thái pháp lý riêng của מִשְׁפָּטִים và tránh đồng nhất hai phạm trù.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu ngôi thứ hai số nhiều; “anh em” hướng đến cộng đồng được Môi-se nói với.
- source_word: לְלַמֵּד אֶתְכֶם
  choice: phải dạy cho anh em
  rationale: Động từ nguyên mẫu phụ thuộc vào “đã truyền”; thêm “phải” làm rõ quan hệ mệnh lệnh trong tiếng Việt mà không đổi tác nhân không được nêu rõ trong câu.
- source_word: לַעֲשׂוֹת
  choice: để anh em thực hành
  rationale: Diễn đạt quan hệ mục đích và ý nghĩa làm theo các quy định; “thực hành” tự nhiên hơn “làm chúng” trong tiếng Việt.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: mà anh em sắp vượt qua
  rationale: Dạng phân từ cùng từ chỉ hướng diễn tả việc cộng đồng sắp vượt qua để đến xứ ấy; cách dịch giữ hình ảnh chuyển sang bên kia mà không bổ sung địa danh không có trong câu.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: ירשׁ trong ngữ cảnh này chỉ việc tiến vào và nắm quyền sở hữu xứ; “chiếm hữu” giữ cả sắc thái chủ động và quyền sở hữu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Quan hệ giữa “điều răn” số ít và “các luật lệ và phán quyết” số nhiều
  choice: 'Giữ số ít rồi giải thích bằng cụm số nhiều: “điều răn—tức các luật lệ và phán quyết”'
  alternative: 'Đồng nhất thành các danh từ số nhiều: “các điều răn, luật lệ và phán quyết”'
  rationale: Nguyên văn cố ý đặt מִצְוָה số ít trước hai danh từ số nhiều; giữ sự phân biệt cho thấy khả năng số ít là tiêu đề hoặc ý niệm tập thể, thay vì âm thầm hài hòa hóa.
- issue: Chủ thể của hành động dạy
  choice: 'Giữ không xác định: “đã truyền phải dạy cho anh em”'
  alternative: Nêu rõ “đã truyền cho tôi dạy anh em”
  rationale: Câu Hê-bơ-rơ không nêu tân ngữ chỉ người nhận lệnh sau צִוָּה; dù ngữ cảnh có thể chỉ Môi-se, bản dịch không nên thêm “tôi” vào chính văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh em” cho ngôi thứ hai số nhiều khi Môi-se nói với toàn thể Israel. Dấu gạch ngang và “tức” thể hiện “điều răn” số ít như một tiêu đề tập thể được triển khai bằng hai phạm trù số nhiều. Dấu chú thích được đặt ngay sau từ ngữ mà chú thích giải thích.
