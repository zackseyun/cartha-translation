revisions:
- from: Ngươi phải yêu kính Yahweh, Đức Chúa Trời của ngươi, hết lòng, hết linh hồn[a] và hết sức lực[b].
  to: Bạn phải yêu Yahweh, Đức Chúa Trời của bạn, bằng cả tấm lòng, cả linh hồn[a] và tất cả sức lực[b] của bạn.
  rationale: Thay “yêu kính” bằng “yêu” để không thêm một nét nghĩa vượt quá אָהַב; thay đại từ cổ bằng cách xưng hô số ít hiện đại; và điều chỉnh cấu trúc giới từ để phản ánh rõ “với/bằng toàn bộ” của ba cụm בְּכָל. Các chú thích được giữ tại đúng các từ có trường nghĩa thay thế và được diễn đạt tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:27:20Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng trật tự ba vế, tên Yahweh, và lực mệnh lệnh của וְאָהַבְתָּ. Tuy nhiên, “yêu kính” thêm sắc thái tôn kính không được biểu thị trực tiếp bởi אָהַב; “yêu” trung tính hơn và trung thành hơn với từ nguồn.
  naturalness: “Ngươi” mang sắc thái cổ/truyền thống, không nhất quán với yêu cầu tiếng Việt chuẩn hiện đại. “Bạn” là cách xưng hô số ít hiện đại, đồng thời vẫn phản ánh hậu tố ngôi hai số ít trong tiếng Hê-bơ-rơ. Cấu trúc “bằng cả ...” diễn đạt tự nhiên chức năng của בְּכָל.
  terminology: Giữ “Yahweh” theo quyết định thuật ngữ. “Đức Chúa Trời” phù hợp cho אֱלֹהֶיךָ. Giữ các từ “lòng”, “linh hồn”, “sức lực” và các chú thích để không thu hẹp các trường nghĩa chồng lấn của לֵבָב, נֶפֶשׁ và מְאֹד.
