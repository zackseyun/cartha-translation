    rationale: אָהַב có nghĩa cơ bản là “yêu”; ngữ cảnh hướng về Đức Chúa Trời không tự nó đòi hỏi phải thêm thành tố “kính”. “Yêu” bảo toàn sự khái quát của nguyên văn.
  - severity: low
    issue: Đại từ “ngươi” không phải lựa chọn tiếng Việt chuẩn hiện đại tối ưu.
    rationale: Dù quen thuộc trong bản dịch Kinh Thánh truyền thống, “ngươi” có sắc thái cổ. “Bạn” hiện đại hơn mà vẫn có thể biểu thị ngôi hai số ít của bản gốc.
  - severity: low
