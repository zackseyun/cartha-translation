  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ וּ/בְ/כָל מְאֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: vi
  text: Bạn phải yêu Yahweh, Đức Chúa Trời của bạn, bằng cả tấm lòng, cả linh hồn[a] và tất cả sức lực[b] của bạn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “linh hồn” (nephesh) cũng có thể có nghĩa là “sự sống” hoặc “bản thân.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “sức lực” (me'od) có liên hệ với ý niệm “rất nhiều”; ở đây từ này có thể bao hàm sức mạnh, cường độ và các nguồn lực của một người.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: Ngươi phải yêu kính
  rationale: Dạng Qal hoàn thành ngôi hai số ít kèm liên từ, trong văn cảnh luật pháp–khuyên dạy, mang hiệu lực mệnh lệnh. “Phải” diễn đạt nghĩa vụ giao ước; “yêu kính” tự nhiên và trang trọng khi nói về tình yêu đối với Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Dù אֱלֹהִים có hình thái số nhiều, động lực ngữ cảnh và hậu tố sở hữu ở đây chỉ Đức Chúa Trời của Israel; cách dịch số ít là phù hợp.
- source_word: בְּכָל
  choice: hết
  rationale: Trong ba cụm song song, בְּכָל nhấn mạnh sự toàn vẹn và trọn vẹn của lòng tận hiến. Lặp “hết” tạo câu tiếng Việt tự nhiên mà vẫn giữ phép điệp của tiếng Hê-bơ-rơ.
- source_word: לְבָבְךָ
  choice: lòng
  rationale: לֵבָב chỉ con người bên trong, bao gồm tư tưởng và ý chí chứ không chỉ cảm xúc. “Lòng” là từ tiếng Việt rộng nghĩa và tự nhiên trong ngữ cảnh này.
- source_word: נַפְשְׁךָ
  choice: linh hồn
  rationale: נֶפֶשׁ có thể chỉ linh hồn, sự sống hoặc chính bản thân. “Linh hồn” giữ cách diễn đạt quen thuộc, còn chú thích bảo lưu trường nghĩa rộng của từ nguồn.
- source_word: מְאֹדֶךָ
  choice: sức lực
  rationale: מְאֹד vốn liên quan đến ý niệm “rất/nhiều” và được dùng như danh từ để chỉ toàn bộ năng lực, cường độ hoặc nguồn lực. “Sức lực” rõ nghĩa trong tiếng Việt nhưng cần chú thích để tránh thu hẹp trường nghĩa.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản văn dùng trực tiếp tên riêng YHWH. Giữ “Yahweh” bảo tồn tính chất tên giao ước thay vì thay bằng tước hiệu hoặc chọn một lối phiên âm khác.
- issue: Các thuật ngữ nhân học trong mệnh lệnh yêu kính
  choice: lòng ... linh hồn ... sức lực
  alternative: tâm trí ... sự sống ... mọi điều mình có
  rationale: Ba từ Hê-bơ-rơ có trường nghĩa chồng lấn và cùng diễn tả sự tận hiến của toàn thể con người, chứ không nhất thiết phân chia con người thành ba bộ phận. Bản dịch giữ ba vế và dùng chú thích để bảo tồn độ rộng nghĩa.
- issue: Sắc thái của וְאָהַבְתָּ
  choice: phải yêu kính
  alternative: sẽ yêu; hãy yêu
  rationale: Trong văn cảnh giao ước–luật pháp, dạng động từ mang lực mệnh lệnh. “Phải” thể hiện nghĩa vụ mà không biến câu thành một lời tiên báo đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng đại từ số ít “ngươi” để phản ánh trực tiếp hậu tố ngôi hai số ít trong tiếng Hê-bơ-rơ và giữ sắc thái giao ước; cấu trúc lặp “hết” bảo tồn nhịp điệu nhấn mạnh của nguyên văn.
