source:
  edition: WLC
  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: vi
  text: 'Khi sau này[a] con trai ngươi hỏi ngươi rằng: “Các lời chứng, luật lệ và phán quyết mà Yahweh, Đức Chúa Trời chúng ta, đã truyền cho các ngươi là gì?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “ngày mai”; ở đây từ này được dùng theo nghĩa rộng là một thời điểm trong tương lai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong lời chỉ dẫn này, từ này mở đầu một tình huống được dự liệu trong tương lai; “Khi” tự nhiên và phù hợp hơn “Nếu” hay “Vì”.
- source_word: יִשְׁאָלְךָ
  choice: hỏi anh
  rationale: Giữ nghĩa thông dụng của động từ שאל và ngôi thứ hai số ít trong lời cha nói với người Israel.
- source_word: בִנְךָ
  choice: con trai anh
  rationale: Danh từ Hê-bơ-rơ là giống đực số ít, nên không trung tính hóa thành “con cái”.
- source_word: מָחָר
  choice: mai sau
  rationale: Nghĩa đen là “ngày mai”, nhưng tại đây được dùng theo thành ngữ để chỉ một thời điểm trong tương lai; “mai sau” vừa tự nhiên vừa giữ sắc thái thời gian.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này dẫn vào nội dung câu hỏi; “hỏi ... rằng” là cách diễn đạt gọn và trang trọng trong tiếng Việt.
- source_word: מָה
  choice: là gì
  rationale: Giữ sát câu hỏi trực tiếp của bản Hê-bơ-rơ, không bổ sung rõ nghĩa “có ý nghĩa gì”, dù ý hỏi xin giải thích có thể được hàm chứa.
- source_word: הָעֵדֹת
  choice: các chứng ước
  rationale: “Chứng ước” bảo tồn sắc thái chứng nhận/giao ước và phân biệt thuật ngữ này với “luật lệ” và “phán quyết”.
- source_word: הַחֻקִּים
  choice: luật lệ
  rationale: Cách dịch quen thuộc, rõ nghĩa cho các quy định đã được thiết lập, đồng thời giữ sự phân biệt trong bộ ba thuật ngữ pháp lý.
- source_word: הַמִּשְׁפָּטִים
  choice: phán quyết
  rationale: Giữ sắc thái tư pháp và pháp lý của מִשְׁפָּטִים thay vì quy cả ba từ về nghĩa chung là luật.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời chúng ta
  rationale: Thể hiện trực tiếp cấu trúc sở hữu và mối quan hệ giao ước trong nguyên văn.
- source_word: צִוָּה ... אֶתְכֶם
  choice: đã truyền cho các anh
  rationale: “Đã truyền” diễn đạt hành động mệnh lệnh trong quá khứ; “các anh” làm rõ hậu tố tân ngữ ngôi thứ hai số nhiều, vốn tương phản đáng kể với “anh” số ít ở đầu câu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” giữ đây là danh riêng mà không thay bằng tước hiệu.
- issue: Giới tính của בִנְךָ
  choice: con trai anh
  alternative: con anh
  rationale: Nguyên văn xác định giống đực số ít; bản dịch bảo tồn chi tiết này.
- issue: Sự chuyển đổi từ đối tượng số ít sang số nhiều
  choice: anh ... các anh
  alternative: ngươi ... các ngươi / bạn ... các bạn
  rationale: Nguyên văn có “hỏi anh” ở số ít nhưng “truyền cho các anh” ở số nhiều. Bản dịch giữ sự chuyển đổi có ý nghĩa này thay vì làm phẳng cả hai thành đại từ không phân biệt số.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh/các anh” để biểu thị rõ sự tương phản số ít–số nhiều trong nguyên văn. Bộ ba pháp lý được giữ thành ba thuật ngữ khác nhau; cấu trúc câu hỏi “là gì?” bảo tồn cách nói trực tiếp và phần hàm ý xin giải thích.
