  rationale: Điều chỉnh cách diễn đạt để tiếng Việt hiện đại, rõ nghĩa và trang trọng hơn, đồng thời bảo toàn trực tiếp câu hỏi của nguyên văn, bộ ba thuật ngữ pháp lý, danh Yahweh, và tương phản số ít/số nhiều.
  reviewer_model: gpt-5.6-terra
