base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: vi
  text: Con phải buộc chúng làm dấu hiệu trên tay con, và chúng phải là vật đeo[a] giữa hai mắt con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này rất hiếm và nghĩa chính xác không chắc chắn; có thể chỉ những băng hoặc vật đeo ở vùng trán. Theo cách hiểu trong thực hành Do Thái về sau, từ này được liên hệ với các hộp nhỏ chứa những đoạn Kinh Thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: Con phải buộc chúng
  rationale: Động từ Qal hoàn thành có liên từ, nằm trong chuỗi lời chỉ dạy, mang sắc thái mệnh lệnh. “Buộc” giữ được hành động cụ thể; đại từ “chúng” giữ nguyên hậu tố số nhiều giống đực và quy chiếu về những lời đã nói ở ngữ cảnh trước.
- source_word: לְאוֹת
  choice: làm dấu hiệu
  rationale: אוֹת có nghĩa thông thường là “dấu” hoặc “dấu hiệu”; cách dịch này thể hiện chức năng biểu trưng mà không diễn giải quá mức.
- source_word: עַל יָדֶךָ
  choice: trên tay mình
  rationale: יָד trước hết có nghĩa là “tay”; không đổi thành “cánh tay,” vì đó là cách hiểu rộng và có tính diễn giải hơn. “Mình” liên kết tự nhiên với chủ ngữ “con” trong tiếng Việt.
- source_word: וְהָיוּ
  choice: và chúng phải là
  rationale: Động từ tiếp nối chuỗi lời chỉ dạy, nên “phải” giữ được sắc thái quy định, thay vì biến câu thành một lời dự báo đơn thuần.
- source_word: לְטֹטָפֹת
  choice: vật đeo
  rationale: טֹטָפֹת là từ hiếm, chỉ một vật được đeo ở vùng trán nhưng hình dạng chính xác không chắc chắn. “Vật đeo” tránh xác định quá cụ thể là dải, đồ trang sức hay hộp kinh; chú thích nêu cách hiểu truyền thống.
- source_word: בֵּין עֵינֶיךָ
  choice: giữa hai mắt con
  rationale: Dịch sát thành ngữ Hê-bơ-rơ, giữ nguyên hình ảnh cụ thể và không tự chuyển thành “trên trán” hay “trước mắt.”
theological_decisions:
- issue: Mệnh lệnh này nói về một thực hành thân thể theo nghĩa đen, một hình ảnh về sự ghi nhớ liên tục, hay cả hai
  choice: Giữ nguyên ngôn ngữ cụ thể về việc buộc trên tay và đeo giữa hai mắt, không quyết định cách hiểu
  alternative: Diễn giải thành lời kêu gọi luôn ghi nhớ, hoặc xác định thẳng đây là tục đeo hộp kinh về sau
  rationale: Bản Hê-bơ-rơ dùng hình ảnh thân thể cụ thể nhưng không giải thích mức độ literal hay biểu tượng. Bản dịch cần giữ sự căng thẳng diễn giải này thay vì giải quyết nó trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo lời Môi-se trực tiếp dạy dân Y-sơ-ra-ên ở ngôi thứ hai số ít; giữ “giữa hai mắt” để bảo toàn hình ảnh Hê-bơ-rơ.
