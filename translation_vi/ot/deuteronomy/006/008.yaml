revisions:
- from: Con phải buộc chúng trên tay mình làm dấu hiệu, và chúng phải là vật đeo[a] giữa hai mắt con.
  to: Con phải buộc chúng làm dấu hiệu trên tay con, và chúng phải là vật đeo[a] giữa hai mắt con.
  rationale: Sửa nhẹ trật tự từ để phản ánh rõ quan hệ "buộc chúng làm dấu hiệu" của nguyên văn, đồng thời giữ nguyên "tay" và thành ngữ cụ thể "giữa hai mắt". Chính văn không quyết định vật đeo là dải trán, hộp kinh, hay chỉ là hình ảnh biểu tượng; thông tin về cách hiểu Do Thái về sau được giữ trong chú thích với ngôn ngữ thận trọng.
  reviewer_model: gpt-5.6-terra
