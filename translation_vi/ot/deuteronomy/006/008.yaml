  - severity: low
    issue: Chú thích dùng "dải hoặc vật trang sức" nhưng chưa nêu rõ đây là các khả năng diễn giải từ hiếm, và mô tả cách hiểu về sau có thể được trình bày chính xác, trung tính hơn.
    rationale: טֹטָפֹת thường được hiểu là đồ/băng đeo vùng trán, nhưng nghĩa từ nguyên và vật thể cụ thể vẫn bất định. Cần giữ khoảng mở này và tránh khiến thực hành về sau trở thành nghĩa xác định của chính văn.
