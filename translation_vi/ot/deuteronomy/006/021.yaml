source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לְ/בִנְ/ךָ֔ עֲבָדִ֛ים הָיִ֥ינוּ לְ/פַרְעֹ֖ה בְּ/מִצְרָ֑יִם וַ/יּוֹצִיאֵ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: vi
  text: 'thì hãy nói với con trai mình[a]: “Chúng ta từng là nô lệ của Pha-ra-ôn tại Ai Cập, và Yahweh đã bằng bàn tay mạnh mẽ đưa chúng ta ra khỏi Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và hãy nói”. Liên từ Hê-bơ-rơ có thể đơn giản mang nghĩa “và”; “thì” làm rõ trình tự chỉ dẫn tiếp nối câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: thì hãy nói
  rationale: Liên từ וְ tiếp nối trình tự chỉ dẫn từ câu trước; “thì” làm rõ quan hệ tiếp nối, còn “hãy nói” diễn đạt tự nhiên sắc thái mệnh lệnh của ngữ cảnh.
- source_word: לְבִנְךָ
  choice: với con trai mình
  rationale: Danh từ Hê-bơ-rơ ở giống đực số ít, nên giữ nghĩa cụ thể là “con trai” thay vì trung tính hóa thành “con”.
- source_word: עֲבָדִים הָיִינוּ לְפַרְעֹה
  choice: Chúng ta từng là nô lệ của Pha-ra-ôn
  rationale: Trong bối cảnh Xuất Hành, עֲבָדִים chỉ tình trạng bị nô dịch; “nô lệ” thể hiện đầy đủ hơn “đầy tớ”. “Của Pha-ra-ôn” diễn đạt quan hệ lệ thuộc do giới từ לְ đánh dấu.
- source_word: בְּמִצְרָיִם
  choice: tại Ai Cập
  rationale: Giới từ בְּ mang nghĩa địa điểm; “tại Ai Cập” tự nhiên và rõ ràng trong tiếng Việt.
- source_word: וַיּוֹצִיאֵנוּ
  choice: đã … đưa chúng ta ra
  rationale: Thể Hifil của יצא có nghĩa khiến đi ra hoặc đưa ra; cách dịch này giữ hành động giải cứu chủ động.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ Tự YHWH, không thay bằng một tước hiệu.
- source_word: מִמִּצְרַיִם
  choice: ra khỏi Ai Cập
  rationale: Giới từ מִן chỉ nguồn hoặc nơi rời khỏi; kết hợp “đưa … ra khỏi” là tự nhiên trong tiếng Việt.
- source_word: בְּיָד חֲזָקָה
  choice: dùng bàn tay mạnh mẽ
  rationale: Giữ hình ảnh cụ thể “bàn tay” của nguyên ngữ và diễn đạt hành động đầy sức mạnh của Yahweh; “dùng” thể hiện sắc thái phương tiện của giới từ בְּ.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: Đức Chúa Hằng Hữu / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Giữ “Yahweh” bảo toàn sự phân biệt giữa danh riêng và tước hiệu, đồng thời không áp đặt truyền thống thay thế danh bằng “Chúa”.
- issue: Mức độ lệ thuộc trong עֲבָדִים
  choice: nô lệ
  alternative: đầy tớ
  rationale: Bối cảnh Ai Cập nhấn mạnh sự nô dịch dưới quyền Pha-ra-ôn; “nô lệ” giữ được sức nặng lịch sử và thần học của hành động giải phóng.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Lược chủ ngữ ở mệnh đề chỉ dẫn để tránh đại từ xưng hô cổ hoặc thiếu tự nhiên; “con trai mình” vẫn giữ ngôi số ít và giới tính của nguyên văn. Dùng “Pha-ra-ôn” và “Ai Cập” theo dạng quen thuộc trong tiếng Việt.
