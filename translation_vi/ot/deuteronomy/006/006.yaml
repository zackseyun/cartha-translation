revisions:
- from: Những lời này mà hôm nay ta truyền cho anh em phải ghi lòng tạc dạ.[a]
  to: Những lời này mà hôm nay ta truyền cho ngươi phải ở trong lòng ngươi.[a]
  rationale: Thay thành ngữ diễn giải “ghi lòng tạc dạ” bằng “phải ở trong lòng ngươi” để phản ánh sát hơn vị ngữ “phải ở” của tiếng Hê-bơ-rơ và tránh thêm sắc thái. Chú thích bảo lưu giới từ “trên” của nguyên văn, đồng thời giải thích cách diễn đạt tự nhiên trong tiếng Việt. Số ít được giữ nhất quán trong câu và chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:27:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng đối tượng “những lời này,” hành vi truyền lệnh, thời điểm “hôm nay,” và ý nội tâm hóa của thành ngữ Hê-bơ-rơ. Tuy nhiên, “ghi lòng tạc dạ” là một thành ngữ tăng cường, thiên về ghi nhớ tha thiết, thay cho cấu trúc đơn giản “những lời này ... phải ở trên/trong lòng ngươi.” “Anh em” cũng chuyển hậu tố số ít của tiếng Hê-bơ-rơ sang số nhiều mà không cần thiết.
  naturalness: “Ghi lòng tạc dạ” tự nhiên nhưng có sắc thái văn chương đậm và hơi diễn giải. “Phải ở trong lòng anh em” là cách nói hiện đại, trang trọng, rõ nghĩa hơn trong tiếng Việt, đồng thời vẫn phù hợp với thành ngữ nguồn.
  terminology: Giữ “lời,” “truyền,” “lòng,” và “hôm nay.” Dùng “ngươi” để bảo lưu số ít của hậu tố -ךָ; trong lời diễn từ Kinh Thánh, cách xưng hô này vẫn có thể mang ý tập thể. Chú thích nêu rõ cách đọc sát “trên lòng ngươi” và phương án tự nhiên “trong lòng ngươi.”
  issues:
  - severity: medium
    issue: “ghi lòng tạc dạ” diễn giải và cường điệu hóa thành ngữ nguồn.
    rationale: עַל־לְבָבֶךָ theo sát là “trên lòng ngươi,” với nghĩa thành ngữ là các lời ấy phải hiện diện/nằm trong nội tâm. “Ghi lòng tạc dạ” thêm hình ảnh khắc ghi bền chặt và sắc thái tu từ không được biểu đạt trực tiếp bởi động từ הָיוּ (“phải ở”).
  - severity: low
    issue: “anh em” không bảo lưu số ít của hậu tố Hê-bơ-rơ.
    rationale: מְצַוְּךָ và לְבָבֶךָ đều mang hậu tố số ít. Dù số ít có thể có chức năng tập thể trong diễn từ, “ngươi” bảo lưu hình thức nguồn mà vẫn phù hợp với văn phong Kinh Thánh trang trọng.
  revised_text: Những lời này mà hôm nay ta truyền cho ngươi phải ở trong lòng ngươi.[a]
