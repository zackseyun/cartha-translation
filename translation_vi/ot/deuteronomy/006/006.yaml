base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: vi
  text: Những lời này mà hôm nay ta truyền cho ngươi phải ở trong lòng ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “trên lòng ngươi”; cũng có thể dịch: “trong lòng ngươi.” Đây là thành ngữ nói về việc luôn giữ những lời này trong đời sống nội tâm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: phải
  rationale: Trong mạch văn mệnh lệnh, dạng động từ này mang sắc thái chỉ thị/nghĩa vụ; “phải” diễn đạt tự nhiên và rõ ràng trong tiếng Việt.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: những lời này
  rationale: Giữ nghĩa trực tiếp của דְּבָרִים là “lời”, đồng thời chỉ về những điều vừa được truyền dạy.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: ta truyền cho anh em
  rationale: “Truyền” phù hợp với hành vi ban lệnh trong lời nói hiện tại của Môi-se. Đại từ số ít tập thể chỉ toàn thể dân được chuyển thành “anh em”, cách xưng hô tự nhiên, trang trọng trong tiếng Việt.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Diễn đạt tự nhiên tính trực chỉ và tức thời của lời Môi-se.
- source_word: עַל לְבָבֶךָ
  choice: ghi lòng tạc dạ
  rationale: Thành ngữ tiếng Việt tự nhiên diễn đạt việc giữ những lời ấy thường xuyên và sâu đậm trong đời sống nội tâm; chú thích bảo lưu hình ảnh nguyên văn “ở trên lòng”.
theological_decisions:
- issue: Thành ngữ nhân học לְבָב
  choice: lòng
  alternative: tâm trí; con người bên trong
  rationale: “Lòng” trong tiếng Việt có thể bao gồm tư tưởng, ý chí và tình cảm, nên tránh thu hẹp nghĩa vào nhận thức בלבד.
- issue: Sắc thái của עַל לְבָבֶךָ
  choice: ghi lòng tạc dạ
  alternative: ở trên lòng anh em; ở trong lòng anh em
  rationale: Bản văn Hê-bơ-rơ dùng giới từ “trên”, nhưng đây là thành ngữ về sự ghi nhớ và nội tâm hóa. Cách dịch chính ưu tiên sự tự nhiên mà không giải quyết quá mức hình ảnh gốc, vì hình ảnh ấy được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta” cho người nói là Môi-se và “anh em” cho đại từ số ít tập thể chỉ dân Y-sơ-ra-ên. Thành ngữ “ghi lòng tạc dạ” tạo câu tiếng Việt tự nhiên, còn chú thích bảo lưu cấu trúc và phương án dịch sát của tiếng Hê-bơ-rơ.
