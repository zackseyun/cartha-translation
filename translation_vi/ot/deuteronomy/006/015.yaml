base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: vi
  text: Vì Yahweh, Đức Chúa Trời của anh em, là Đức Chúa Trời ghen ở giữa anh em; kẻo cơn giận của Yahweh, Đức Chúa Trời của anh em, bừng lên chống lại anh em, và Ngài tiêu diệt anh em khỏi mặt đất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “khỏi trên mặt đất,” một thành ngữ chỉ việc bị loại bỏ hoàn toàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: vì
  rationale: Nối câu này với lệnh cấm ở câu trước và nêu lý do cho lệnh ấy.
- source_word: אֵל קַנָּא
  choice: Đức Chúa Trời ghen
  rationale: Giữ lại hình ảnh mạnh của tiếng Hê-bơ-rơ về quyền đòi hỏi sự trung thành độc hữu trong giao ước, thay vì làm nhẹ thành lòng sốt sắng.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc và dễ nhận biết trong tiếng Việt để biểu đạt trực tiếp danh giao ước יהוה, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Hậu tố ngôi thứ hai giống đực số ít chỉ toàn thể Ít-ra-ên như một cộng đồng; tiếng Việt tự nhiên dùng “anh em” trong lời Môi-se nói với dân.
- source_word: בְּקִרְבֶּךָ
  choice: đang ở giữa anh em
  rationale: Diễn đạt sự hiện diện của Đức Chúa Trời giữa cộng đồng, không mang nghĩa cá nhân hóa là ở bên trong một người.
- source_word: פֶּן
  choice: nếu không
  rationale: Giới thiệu hậu quả đáng sợ có thể xảy ra; tự nhiên hơn “e rằng” trong cấu trúc cảnh báo hiện đại.
- source_word: יֶחֱרֶה אַף
  choice: cơn giận ... sẽ bừng lên
  rationale: Giữ ẩn dụ Hê-bơ-rơ về cơn giận cháy lên, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: בָּךְ
  choice: nghịch cùng anh em
  rationale: Trong ngữ cảnh cơn giận, giới từ mang nghĩa hướng chống lại đối tượng.
- source_word: וְהִשְׁמִידְךָ
  choice: và Ngài sẽ tiêu diệt anh em
  rationale: Thể Hiphil của שׁמד biểu thị việc hủy diệt hoặc loại bỏ hoàn toàn; “tiêu diệt” giữ được sức nặng của lời cảnh báo.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: khỏi mặt đất
  rationale: Bảo tồn thành ngữ không gian của nguyên văn, chỉ sự bị loại bỏ hoàn toàn khỏi đất nơi con người sinh sống.
theological_decisions:
- issue: Cách dịch sự ghen của Đức Chúa Trời
  choice: Đức Chúa Trời ghen
  alternative: Đức Chúa Trời đầy lòng sốt sắng
  rationale: קַנָּא nói đến quyền đòi hỏi lòng trung thành độc hữu của Đức Chúa Trời trong giao ước, chứ không phải lòng đố kỵ tội lỗi. Giữ “ghen” bảo tồn sức căng thần học của nguyên văn; chú thích giúp tránh hiểu sai.
- issue: Cách thể hiện danh יהוה
  choice: Giê-hô-va
  alternative: Đức Giê-hô-va; YHWH; Gia-vê
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời. Bản dịch giữ một dạng danh riêng đã quen thuộc trong tiếng Việt, không thay danh ấy bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Dùng “anh em” để diễn đạt ngôi thứ hai số ít mang tính tập thể khi Môi-se nói với Ít-ra-ên. Giữ hình ảnh “cơn giận ... bừng lên” và từ “ghen” nhằm bảo tồn ẩn dụ cùng sức căng của nguyên văn.
