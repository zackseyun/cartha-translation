revisions:
- from: vì Giê-hô-va, Đức Chúa Trời của anh em, đang ở giữa anh em, là Đức Chúa Trời ghen[a]; nếu không, cơn giận của Giê-hô-va, Đức Chúa Trời của anh em, sẽ bừng lên nghịch cùng anh em, và Ngài sẽ tiêu diệt anh em khỏi mặt đất.[b]
  to: Vì Yahweh, Đức Chúa Trời của anh em, là Đức Chúa Trời ghen ở giữa anh em; kẻo cơn giận của Yahweh, Đức Chúa Trời của anh em, bừng lên chống lại anh em, và Ngài tiêu diệt anh em khỏi mặt đất.[a]
  rationale: Đổi “Giê-hô-va” thành “Yahweh” theo chính sách danh riêng của POB; chỉnh cấu trúc câu để “Đức Chúa Trời ghen ở giữa anh em” phản ánh liền mạch vị ngữ của nguyên văn. “Kẻo,” “chống lại,” và “ở giữa” cải thiện độ sát nghĩa lẫn tính hiện đại. Chú thích được sắp lại để neo [a] ở “khỏi mặt đất”; chú thích về “ghen/sốt sắng” được giữ trong bộ chú thích với ký hiệu [b].
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:27:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa danh riêng יהוה từ “Giê-hô-va” thành “Yahweh” để nhất quán với quyết định dịch thuật đã nêu trong hồ sơ POB. Bản sửa cũng thể hiện trực tiếp hơn trật tự và quan hệ cú pháp của tiếng Hê-bơ-rơ: Yahweh là Đức Chúa Trời ghen và ở giữa dân. “Kẻo” phản ánh chính xác hơn chức năng cảnh báo của פֶּן; “chống lại” là cách diễn đạt hiện đại, tự nhiên cho בָּךְ trong ngữ cảnh cơn giận.'
  naturalness: 'Bản nháp có vài chỗ hơi gượng hoặc cổ: “đang ở giữa” không cần sắc thái tiếp diễn, “nghịch cùng” không còn tự nhiên trong tiếng Việt hiện đại, và “nếu không” kém sát hơn với liên từ cảnh báo. Bản sửa giữ giọng trang nghiêm nhưng sáng rõ.'
  terminology: Giữ “Đức Chúa Trời ghen” để bảo tồn ý nghĩa giao ước của אֵל קַנָּא, có chú thích về phương án “sốt sắng”. Dùng “Yahweh” theo chính sách hiện hành, không thay tên riêng bằng tước hiệu. “Tiêu diệt” và “khỏi mặt đất” phù hợp với הִשְׁמִידְךָ và thành ngữ מֵעַל פְּנֵי הָאֲדָמָה.
  issues:
  - severity: medium
    issue: Danh יהוה được dịch là “Giê-hô-va” thay vì “Yahweh”.
    rationale: Hồ sơ nguồn và quyết định thần học của POB quy định dùng “Yahweh” cho Tetragrammaton. Đây là thay đổi thuật ngữ cần thiết, không phải lựa chọn giáo phái.
  - severity: low
    issue: “Nếu không” và “nghịch cùng” chưa là những cách diễn đạt tối ưu cho פֶּן và בָּךְ.
    rationale: “Kẻo” duy trì quan hệ cảnh báo của nguyên văn; “chống lại” tự nhiên trong tiếng Việt hiện đại và truyền đạt đúng hướng đối kháng của cơn giận.
  - severity: low
    issue: “đang ở giữa” thêm sắc thái tiếp diễn không có trong nguyên văn.
    rationale: Động từ có ngụ ý trong mệnh đề danh từ chỉ sự hiện diện, không nhấn diễn tiến; “ở giữa” sát và gọn hơn.
  revised_text: Vì Yahweh, Đức Chúa Trời của anh em, là Đức Chúa Trời ghen ở giữa anh em; kẻo cơn giận của Yahweh, Đức Chúa Trời của anh em, bừng lên chống lại anh em, và Ngài tiêu diệt anh em khỏi mặt đất.[a]
  revised_footnotes:
