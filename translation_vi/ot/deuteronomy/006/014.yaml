source:
  edition: WLC
  text: לֹ֣א תֵֽלְכ֔וּ/ן אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים מֵ/אֱלֹהֵי֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר סְבִיבוֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: vi
  text: Anh em không được đi theo các thần khác[a]—các thần của những dân tộc ở chung quanh anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, phản ánh rõ hơn sắc thái phân xuất của tiếng Hê-bơ-rơ: “Anh em không được đi theo các thần khác, bất cứ thần nào trong số các thần của những dân tộc ở chung quanh anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: không được đi theo
  rationale: Trong ngữ cảnh điều cấm, לֹא với động từ chưa hoàn thành ngôi hai số nhiều diễn đạt sự nghiêm cấm; thành ngữ הלך אחרי chỉ việc đi theo, theo nghĩa rộng là dành lòng trung thành và thờ phụng.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: Cách dịch trực tiếp và rõ ràng, không thêm sắc thái 'ngoại bang' vốn không được אֲחֵרִים nêu rõ.
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: tức là các thần của những dân tộc
  rationale: מִן có thể mang sắc thái phân xuất ('trong số các thần của'), nhưng trong câu này cụm từ chủ yếu xác định 'các thần khác' là các thần của những dân tộc chung quanh. 'Tức là' diễn đạt quan hệ đồng vị tự nhiên trong tiếng Việt; sắc thái phân xuất được ghi ở chú thích.
- source_word: הָעַמִּים
  choice: những dân tộc
  rationale: עַמִּים chỉ các cộng đồng dân tộc; 'những dân tộc' vừa sát nghĩa vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: ở chung quanh anh em
  rationale: Giữ nguyên ý nghĩa địa lý về các dân tộc láng giềng bao quanh cộng đồng được ngỏ lời.
theological_decisions:
- issue: Ý nghĩa của lệnh cấm 'đi theo'
  choice: Giữ thành ngữ 'đi theo', hàm ý theo đuổi và dành lòng trung thành tôn giáo cho các thần khác.
  alternative: Diễn giải thẳng là 'thờ phượng' các thần khác, hoặc hiểu hẹp là đi về phía các nơi thờ tự.
  rationale: Trong Phục Truyền Luật Lệ Ký, הלך אחרי thường chỉ sự quy phục và thờ phụng, chứ không đơn thuần là di chuyển; giữ thành ngữ tránh thu hẹp hoặc giải nghĩa quá mức.
- issue: Quan hệ giữa 'các thần khác' và 'các thần của những dân tộc'
  choice: Hiểu cụm sau là phần xác định/đồng vị cho cụm trước, đồng thời ghi nhận khả năng sắc thái phân xuất của מִן trong chú thích.
  alternative: 'Dịch hoàn toàn theo nghĩa phân xuất: ''bất cứ thần nào trong số các thần của những dân tộc...'''
  rationale: Cả hai cách đều phù hợp với cấu trúc Hê-bơ-rơ; câu chính ưu tiên tiếng Việt tự nhiên, còn chú thích bảo tồn sắc thái hình thái học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” để chỉ cộng đồng số nhiều được ngỏ lời; “không được” diễn đạt lệnh cấm rõ ràng. Cụm “đi theo” bảo tồn hình ảnh và sức nặng giao ước của nguyên ngữ.
