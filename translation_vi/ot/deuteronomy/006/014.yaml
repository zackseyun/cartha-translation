- from: Anh em không được đi theo các thần khác[a], tức là các thần của những dân tộc ở chung quanh anh em.
  to: Anh em không được đi theo các thần khác[a]—các thần của những dân tộc ở chung quanh anh em.
  rationale: Thay “tức là” bằng gạch ngang để liên kết cụm “các thần của những dân tộc...” với “các thần khác” theo lối đồng vị, mà không quyết định quá mức giữa cách hiểu đồng vị và sắc thái phân xuất của tiền tố מִן. Chú thích giữ lựa chọn phân xuất có thể có trong nguyên ngữ.
