  variant: modern standard Vietnamese
source:
  edition: WLC
  text: שָׁמ֣וֹר תִּשְׁמְר֔וּ/ן אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/עֵדֹתָ֥י/ו וְ/חֻקָּ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: vi
  text: Anh em phải hết sức tuân giữ[a] các điều răn của Yahweh, Đức Chúa Trời của anh em, cùng các lời chứng[b] và luật lệ của Ngài—tức là những điều Ngài đã truyền cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng nguyên mẫu tuyệt đối đi với động từ cùng gốc để nhấn mạnh; cũng có thể dịch: “phải cẩn thận tuân giữ” hoặc “nhất định phải tuân giữ.”'
    reason: lexical_alternative
  - marker: b
    text: “Các lời chứng” cũng có thể dịch là “các sắc lệnh” hoặc “các điều khoản giao ước.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: phải hết sức tuân giữ
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ cùng gốc nhấn mạnh mạnh mẽ việc tuân giữ. Cách dịch này truyền đạt cả sắc thái bắt buộc lẫn sự chuyên tâm bằng tiếng Việt tự nhiên.
- source_word: מִצְוֺת
  choice: các điều răn
  rationale: מִצְוֹת chỉ những nghĩa vụ được truyền dạy; “các điều răn” giữ được văn phong giao ước và pháp luật quen thuộc.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng tên riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tự nhiên công thức giao ước, đồng thời thể hiện đại từ ngôi thứ hai số nhiều trong mạch văn.
- source_word: עֵדֹתָיו
  choice: các chứng lệnh của Ngài
  rationale: “Chứng lệnh” giữ nét nghĩa về những quy định làm chứng cho giao ước và phân biệt thuật ngữ này với “điều răn” và “luật lệ”, dù đây không phải từ thông dụng trong giao tiếp hằng ngày.
- source_word: חֻקָּיו
  choice: các luật lệ của Ngài
  rationale: חֻקִּים nói đến những quy định đã được ấn định; “luật lệ” trang trọng, dễ hiểu và vẫn phân biệt tương đối với “điều răn”.
- source_word: אֲשֶׁר צִוָּךְ
  choice: mà Ngài đã truyền cho anh em
  rationale: Mệnh đề quan hệ được hiểu là bổ nghĩa chung cho các loại quy định vừa nêu. “Đã truyền” phản ánh thể hoàn thành của động từ; “anh em” theo lời xưng hô số nhiều trong ngữ cảnh rộng hơn.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự; giữ “Yahweh” bảo tồn tính chất tên riêng trong công thức giao ước thay vì thay bằng tước hiệu.
- issue: Mối quan hệ giữa ba thuật ngữ pháp luật
  choice: 'Giữ ba cách gọi phân biệt: “điều răn”, “chứng lệnh”, “luật lệ”'
  alternative: Gộp hoặc diễn giải chung là “mọi luật lệ và quy định”
  rationale: Nguyên văn đặt ba thuật ngữ cạnh nhau. Giữ sự phân biệt bảo tồn kết cấu và sắc thái giao ước mà không áp đặt một hệ thống thần học chi tiết lên từng từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” để thể hiện lời Môi-se nói với cộng đồng Israel; tránh “các ngươi” vì cổ và tạo khoảng cách. Đại từ “Ngài” dùng cho Đức Chúa Trời. Dấu chú thích [a], [b] được đặt ngay sau những cụm từ cần chú giải.
