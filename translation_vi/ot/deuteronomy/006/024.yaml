  text: וַ/יְצַוֵּ֣/נוּ יְהוָ֗ה לַ/עֲשׂוֹת֙ אֶת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/ט֥וֹב לָ֨/נוּ֙ כָּל הַ/יָּמִ֔ים לְ/חַיֹּתֵ֖/נוּ כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: vi
  text: Đức Giê-hô-va đã truyền cho chúng ta thực hành tất cả những luật lệ này, kính sợ Giê-hô-va, Đức Chúa Trời của chúng ta, vì ích lợi của chúng ta trong mọi ngày, để chúng ta được sống còn như ngày nay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt để biểu thị danh riêng YHWH, đồng thời phân biệt với tước hiệu 'Chúa'.
- source_word: הַחֻקִּים
  choice: luật lệ
  rationale: Diễn đạt חֻקִּים bằng thuật ngữ pháp luật tự nhiên, trang trọng, chỉ các quy định đã được thiết lập.
- source_word: לְיִרְאָה
  choice: kính sợ
  rationale: Giữ cả ý kính trọng lẫn sợ hãi mang tính tôn giáo của động từ ירא, không giản lược thành chỉ 'tôn kính'.
- source_word: לְטוֹב לָנוּ כָּל הַיָּמִים
  choice: để chúng ta luôn được phước
  rationale: Diễn đạt tự nhiên ý 'vì điều tốt lành cho chúng ta trong mọi ngày'; 'được phước' phù hợp văn cảnh giao ước nhưng vẫn dễ hiểu.
- source_word: לְחַיֹּתֵנוּ
  choice: được gìn giữ mạng sống
  rationale: Dạng Hifil nguyên mẫu có ý khiến/giữ cho sống; cách dịch này bảo toàn sắc thái duy trì sự sống.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: như ngày nay
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ thực trạng đang thấy ở thời điểm người nói.
theological_decisions:
- issue: Mối liên hệ giữa vâng phục, kính sợ Đức Chúa Trời và phúc lợi của dân
  choice: 'Giữ các mục đích song song: để dân được phước và được gìn giữ mạng sống.'
  alternative: Diễn giải thành sự vâng phục tạo công trạng để được cứu rỗi.
  rationale: Nguyên văn nói đến mục đích và lợi ích của các điều răn trong bối cảnh giao ước, không xác định một học thuyết cứu rỗi bằng công trạng.
- issue: Ý nghĩa của ירא đối với Đức Chúa Trời
  choice: kính sợ
  alternative: chỉ 'tôn kính' hoặc chỉ 'khiếp sợ'
  rationale: Cụm từ mang sức căng thần học gồm sự kính trọng, quy phục và nỗi sợ thích đáng trước Đức Chúa Trời; 'kính sợ' giữ được độ rộng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc câu được làm tự nhiên trong tiếng Việt nhưng vẫn giữ chuỗi mục đích của nguyên văn. Danh YHWH được thể hiện nhất quán là 'Đức Giê-hô-va'.
