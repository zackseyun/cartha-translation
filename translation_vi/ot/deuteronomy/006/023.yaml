source:
  edition: WLC
  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: vi
  text: Còn chúng ta, Ngài đã đưa ra khỏi đó để đưa chúng ta vào và ban cho chúng ta đất mà Ngài đã thề hứa với các tổ phụ của chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tổ tiên của chúng ta.” Tiếng Hê-bơ-rơ: “các tổ phụ của chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוֹתָנוּ
  choice: Còn chúng ta
  rationale: Giữ vị trí nhấn mạnh của túc từ đứng đầu câu và sự tiếp nối, đối chiếu với điều Đức Chúa Trời đã làm cho Ai Cập trong câu trước.
- source_word: הוֹצִיא מִשָּׁם
  choice: đã đưa ra khỏi đó
  rationale: Thể Hiphil của יצא mang nghĩa khiến ra hoặc đưa ra; cách dịch này giữ hình ảnh Xuất Hành và tạo thế đối xứng với động từ “đưa vào” phía sau.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt rõ quan hệ mục đích bằng tiếng Việt hiện đại, tự nhiên.
- source_word: הָבִיא אֹתָנוּ
  choice: đưa chúng ta vào
  rationale: Thể Hiphil của בוא có nghĩa khiến đi vào; giữ nguyên nét đối xứng “đưa ra—đưa vào” của nguyên văn mà không thêm địa điểm không được nói rõ.
- source_word: לָתֵת לָנוּ אֶת־הָאָרֶץ
  choice: ban cho chúng ta miền đất
  rationale: “Ban” phù hợp với hành động Đức Chúa Trời trao tặng, còn “miền đất” diễn đạt tự nhiên danh từ xác định הָאָרֶץ trong bối cảnh đất hứa.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: mà Ngài đã thề sẽ ban
  rationale: Giữ rõ ngôn ngữ thề ước của שׁבע; bổ sung “sẽ ban” theo nghĩa của quan hệ từ và ngữ cảnh để câu tiếng Việt không bị cụt hoặc mơ hồ về nội dung lời thề.
- source_word: לַאֲבֹתֵינוּ
  choice: cho các tổ phụ của chúng ta
  rationale: “Tổ phụ” giữ sắc thái nam tính và mối liên hệ giao ước với các bậc cha ông, đồng thời trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách gọi mang giới tính trong לַאֲבֹתֵינוּ
  choice: các tổ phụ của chúng ta
  alternative: tổ tiên của chúng ta
  rationale: Nguyên văn dùng danh từ giống đực số nhiều và trong bối cảnh giao ước có thể đặc biệt gợi đến các tổ phụ Israel; bản dịch chính giữ nét ấy, còn cách hiểu rộng hơn được nêu trong chú thích.
- issue: Ngôn ngữ thề ước trong נִשְׁבַּע
  choice: đã thề sẽ ban
  alternative: đã hứa ban
  rationale: “Thề” bảo toàn sức nặng của lời thề giao ước, thay vì làm nhẹ thành một lời hứa nói chung.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Còn chúng ta” giữ sự nhấn mạnh của túc từ đứng đầu; cặp “đưa ra—đưa vào” bảo toàn phép đối xứng nổi bật trong nguyên văn.
