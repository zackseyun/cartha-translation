  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: vi
  text: Hãy cẩn thận, kẻo ngươi quên Yahweh, Đấng đã đưa ngươi ra khỏi xứ Ai Cập, khỏi nhà nô lệ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Có thể diễn đạt theo thành ngữ là “khỏi cảnh nô lệ”. Tiếng Hê-bơ-rơ nói sát nghĩa là “khỏi nhà nô lệ” (nghĩa là nơi nô dịch).
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy cẩn thận
  rationale: Mệnh lệnh Nifal kèm לְךָ là lời cảnh báo phải tự giữ mình. Cách dịch này tự nhiên trong tiếng Việt, vẫn giữ rõ sức mạnh của mệnh lệnh.
- source_word: פֶּן תִּשְׁכַּח
  choice: kẻo ngươi quên
  rationale: פֶּן mở đầu điều nguy hiểm cần tránh. “Kẻo” ngắn gọn, trang trọng và không biến lời cảnh báo thành một mệnh lệnh cấm đơn thuần.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: הוֹצִיאֲךָ
  choice: đã đưa ngươi ra
  rationale: Thể Hifil của יצא trong ngữ cảnh xuất hành có nghĩa thông dụng là “đưa ra”; cách dịch này giữ hành động giải cứu do Yahweh thực hiện.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ra khỏi đất Ai Cập
  rationale: Giữ danh từ אֶרֶץ (“đất/xứ”) và diễn đạt tự nhiên trong tiếng Việt.
- source_word: מִבֵּית עֲבָדִים
  choice: khỏi nhà của những người nô lệ
  rationale: Giữ hình ảnh cụ thể của בֵּית (“nhà”) và danh từ số nhiều עֲבָדִים (“những người nô lệ”), thay vì âm thầm đổi thành danh từ trừu tượng “cảnh nô lệ”.
theological_decisions:
- issue: Cách chuyển יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh thánh YHWH; phiên âm “Yahweh” bảo tồn danh riêng và không thay nó bằng tước hiệu.
- issue: Cách hiểu מִבֵּית עֲבָדִים
  choice: khỏi nhà của những người nô lệ
  alternative: khỏi cảnh nô lệ
  rationale: Bản chính giữ cách nói cụ thể và hơi khác thường của tiếng Hê-bơ-rơ. Cách hiểu thành nơi hoặc tình trạng nô lệ là thành ngữ tự nhiên hơn nhưng được ghi ở chú thích, không dùng để xóa bỏ hình ảnh nguyên văn.
- issue: Số ít trong lời xưng hô
  choice: ngươi
  alternative: anh em / các ngươi
  rationale: Các hậu tố và động từ đều ở ngôi thứ hai giống đực số ít, nói với Israel như một cộng đồng thống nhất. “Ngươi” giữ đặc điểm ngữ pháp này, dù đối tượng tập thể được hiểu từ văn cảnh.
translation_notes:
  register: Văn phong hiện đại nhưng trang nghiêm. Đại từ “ngươi” được dùng có chủ ý để giữ ngôi thứ hai số ít của nguyên văn và cách Đức Chúa Trời gọi Israel như một cộng đồng; không dùng “anh em” vì sẽ biến số ít thành số nhiều. Cấu trúc “nhà của những người nô lệ” hơi khác thường nhưng minh bạch, và chú thích cung cấp cách nói thuần Việt hơn.
