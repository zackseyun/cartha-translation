  text: לֹ֣א תְנַסּ֔וּ אֶת יְהוָ֖ה אֱלֹהֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר נִסִּיתֶ֖ם בַּ/מַּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: vi
  text: Anh em không được thử Yahweh, Đức Chúa Trời của anh em,[a] như anh em đã thử Ngài tại Ma-sa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh em không được đặt Yahweh, Đức Chúa Trời của anh em, vào sự thử thách.”'
    reason: Nêu cách diễn đạt khác cho נסה, với nghĩa đặt Đức Chúa Trời vào sự thử nghiệm.
  - marker: b
    text: Ma-sa là nơi dân Israel đã thử Yahweh trong hoang mạc (Xuất Ai Cập 17:1–7); tên này có liên hệ với từ “thử thách.”
    reason: Giải thích địa danh và dẫn chiếu biến cố lịch sử được câu này nhắc lại.
lexical_decisions:
- source_word: לֹא תְנַסּוּ
  choice: không được thử thách
  rationale: Cấu trúc phủ định với động từ Piel chưa hoàn thành ngôi hai số nhiều diễn đạt lệnh cấm. “Không được thử thách” tự nhiên trong tiếng Việt và giữ sắc thái cố tình đặt Đức Chúa Trời vào thế phải chứng tỏ mình.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Dạng có hậu tố ngôi hai số nhiều. “Anh em” biểu đạt lời nói với toàn thể cộng đồng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: כַּאֲשֶׁר
  choice: như
  rationale: Giới thiệu sự so sánh với hành động trước đây của Israel một cách ngắn gọn, chính xác.
- source_word: נִסִּיתֶם
  choice: anh em đã thử thách
  rationale: Giữ cùng cách dịch gốc נסה với mệnh lệnh ở đầu câu, qua đó bảo toàn liên kết từ vựng có chủ ý.
- source_word: בַּמַּסָּה
  choice: tại Ma-sa
  rationale: Đây là địa danh; phiên âm trong chính văn thay vì dịch nghĩa, còn ý nghĩa liên quan đến việc thử thách được giải thích trong chú thích.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; giữ “Yahweh” bảo toàn tính chất danh riêng và không thay nó bằng tước hiệu.
- issue: Có giải thích biến cố Xuất Ai Cập 17 trong chính văn hay không
  choice: Chỉ ghi “tại Ma-sa” trong chính văn
  alternative: “tại Ma-sa, nơi thử thách”
  rationale: Nguyên văn chỉ dùng địa danh. Việc thêm lời giải nghĩa vào chính văn sẽ làm rõ điều vốn chỉ được gợi nhắc; vì vậy thông tin ấy được dành cho chú thích.
- issue: Tân ngữ hàm ẩn của נִסִּיתֶם
  choice: Dùng “Ngài” để biểu đạt tân ngữ được hiểu từ mệnh đề trước
  alternative: 'Không nêu tân ngữ: “như anh em đã làm tại Ma-sa”'
  rationale: Trong tiếng Hê-bơ-rơ, mệnh đề so sánh không lặp lại tân ngữ, nhưng tân ngữ Yahweh được hiểu rõ từ mệnh đề chính. Tiếng Việt cần nêu “Ngài” để câu tự nhiên mà không thay đổi đối tượng của hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi hai số nhiều chỉ cộng đồng Israel; dùng “Ngài” kính trọng khi nhắc lại Yahweh. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn ngay tại nội dung liên quan.
