revisions:
- from: Người Am-môn hay người Mô-áp không được vào hội chúng của Yahweh[a]; ngay cả đến đời thứ mười[b], không một ai thuộc về họ được vào hội chúng của Yahweh cho đến đời đời.
  to: Người Am-môn hay người Mô-áp không được vào hội chúng của Yahweh[a]; ngay cả đến thế hệ thứ mười[b], không ai trong số họ được vào hội chúng của Yahweh cho đến đời đời.
  rationale: 'Chỉ sửa những chỗ cần thiết về tính tự nhiên và độ rõ của tiếng Việt: “trong số họ” chuyển đúng đại từ לָהֶם mà không diễn giải quá mức, và “thế hệ” làm rõ nghĩa của דּוֹר. Các yếu tố then chốt khác, đặc biệt sự lặp lại của “hội chúng của Yahweh” và hai cách diễn tả thời gian, được giữ nguyên.'
