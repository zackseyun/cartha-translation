language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: vi
  text: Người Am-môn hay người Mô-áp không được vào hội chúng của Yahweh[a]; ngay cả đến thế hệ thứ mười[b], không ai trong số họ được vào hội chúng của Yahweh cho đến đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cộng đồng của Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ vừa nói “đến thế hệ thứ mười” vừa nói “cho đến đời đời”; bản dịch giữ cả hai cách diễn tả thay vì giản lược một trong hai.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: được vào
  rationale: Trong văn luật, thể vị hoàn với לֹא diễn tả sự cấm đoán hoặc không được thừa nhận; “không được vào” tự nhiên và giữ sắc thái pháp lý.
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: người Am-môn hay người Mô-áp
  rationale: Dùng các tên dân tộc quen thuộc trong tiếng Việt; “hay” diễn đạt hai đối tượng cùng chịu quy định.
- source_word: קְהַל יְהוָה
  choice: hội chúng của Yahweh
  rationale: “Hội chúng” chỉ cộng đồng được triệu tập trong tư cách chính thức, đồng thời tránh thu hẹp nghĩa thành một buổi tụ họp đơn thuần.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: ngay cả đến đời thứ mười
  rationale: Giữ cả sắc thái nhấn mạnh của גַּם và công thức thế hệ trong nguyên văn.
- source_word: לָהֶם
  choice: thuộc về họ
  rationale: Làm rõ đại từ chỉ những người thuộc các dân vừa nêu mà không giới hạn rõ ràng vào một cách hiểu riêng như chỉ hậu duệ.
- source_word: עַד עוֹלָם
  choice: cho đến đời đời
  rationale: Cách diễn đạt trang trọng, dễ hiểu về thời hạn kéo dài; không lược bỏ dù câu đã nói đến đời thứ mười.
theological_decisions:
- issue: Quan hệ giữa “đời thứ mười” và “cho đến đời đời”
  choice: Giữ nguyên cả hai cách diễn tả thời gian trong chính văn.
  alternative: Đồng nhất “đời thứ mười” với “không bao giờ”, hoặc giảm nhẹ cụm “cho đến đời đời”.
  rationale: Bản Hê-bơ-rơ đặt cả hai cụm cạnh nhau; bản dịch bảo tồn sức căng và không tự ý dung hòa.
- issue: Phạm vi của לָהֶם
  choice: Dịch rộng là “thuộc về họ”.
  alternative: Diễn giải cụ thể là “con cháu của họ”.
  rationale: Đại từ có thể bao hàm những người thuộc các dân ấy, nhưng nguyên văn không dùng danh từ riêng có nghĩa “con cháu”; vì vậy không nên thu hẹp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “hội chúng” theo sắc thái cộng đồng chính thức; giữ danh Yahweh và giữ nguyên sự lặp lại có chủ ý của nguyên văn.
