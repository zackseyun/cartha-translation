  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: vi
  text: Con cái[a] được sinh ra cho họ, đến thế hệ thứ ba[b], có thể vào hội chúng của Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng từ có nghĩa đen là “các con trai”; trong ngữ cảnh luật pháp về dòng dõi này, từ ấy chỉ con cái hoặc hậu duệ nói chung.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “đến thế hệ thứ ba, họ sẽ vào”; trong văn cảnh, câu này cho biết việc vào hội chúng được phép bắt đầu từ thế hệ thứ ba.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: Con cháu
  rationale: Danh từ số nhiều giống đực này có nghĩa đen là “các con trai”, nhưng trong ngữ cảnh luật pháp và dòng dõi, nó chỉ hậu duệ nói chung. “Con cháu” diễn đạt tự nhiên phạm vi qua các thế hệ.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: sinh ra cho họ
  rationale: Dạng bị động của ילד đi với לָהֶם diễn tả những người được sinh ra trong dòng dõi của họ; cách dịch này giữ sát cấu trúc và ý nghĩa nguồn.
- source_word: דּוֹר שְׁלִישִׁי
  choice: đến đời thứ ba
  rationale: Cụm từ xác định mốc thế hệ bắt đầu được gia nhập. “Đến đời thứ ba” tự nhiên trong tiếng Việt và thể hiện rõ sắc thái luật định.
- source_word: יָבֹא
  choice: có thể gia nhập
  rationale: Động từ có nghĩa cơ bản là “đến/vào”. Trong điều luật về tư cách tham dự hội chúng, “có thể gia nhập” truyền đạt ý được phép từ đời thứ ba, trong khi chú thích bảo lưu cách dịch sát hình thức “sẽ vào”.
- source_word: בִּקְהַל יְהוָה
  choice: gia nhập hội chúng của Yahweh
  rationale: קהל chỉ cộng đồng được triệu tập trong bối cảnh giao ước và luật pháp. “Hội chúng” giữ sắc thái cộng đồng có tổ chức; “gia nhập” là cách diễn đạt tự nhiên với động từ đi vào cộng đồng ấy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng tên riêng Yahweh để thể hiện trực tiếp danh giao ước יהוה, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn chức năng tên riêng của từ này mà không thay bằng tước hiệu.
- issue: Phạm vi của בָּנִים trong luật về dòng dõi
  choice: Con cháu
  alternative: Các con trai
  rationale: Hình thái Hê-bơ-rơ là giống đực số nhiều, nhưng ngữ cảnh nói đến các thế hệ hậu duệ. “Con cháu” không giới hạn quá mức vào nam giới và làm rõ chiều kích dòng dõi.
- issue: Sắc thái của יָבֹא trong quy định gia nhập
  choice: có thể gia nhập
  alternative: sẽ vào
  rationale: Hình thức động từ có thể dịch sát là “sẽ vào”, nhưng trong văn cảnh luật định, câu xác lập tư cách được gia nhập từ đời thứ ba. Chú thích bảo lưu cách đọc hình thức để không che khuất độ căng giữa mệnh đề tương lai và sắc thái cho phép.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Con cháu” phù hợp với ngữ cảnh nhiều thế hệ; “hội chúng” giữ sắc thái cộng đồng giao ước. Hai dấu chú thích đều được đặt trong chính văn.
