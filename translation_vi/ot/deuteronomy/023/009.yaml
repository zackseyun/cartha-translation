revisions:
- from: Con cháu sinh ra cho họ, đến đời thứ ba, có thể gia nhập hội chúng của Yahweh[a][b].
  to: Con cái[a] được sinh ra cho họ, đến thế hệ thứ ba[b], có thể vào hội chúng của Yahweh.
  rationale: Bản sửa làm rõ cấu trúc bị động “được sinh ra cho họ”, thay “gia nhập” bằng “vào” để bám sát động từ Hê-bơ-rơ mà không thêm ý kết nạp, và neo từng chú thích tại đơn vị từ/cụm từ mà nó giải thích. Sắc thái pháp lý cho phép của động từ được giữ bằng “có thể”.
