  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: vi
  text: 'Ngươi không được tính lãi đối với anh em mình: lãi tiền[a], lãi lương thực, hay lãi trên bất cứ thứ gì được cho vay lấy lãi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lãi bạc”; từ Hê-bơ-rơ được dịch là “tiền” có nghĩa đen là “bạc”.
    reason: lexical_alternative
  - marker: b
    text: “Lãi” ở đây nói chung về khoản thu thêm khi cho vay, không chỉ riêng mức lãi quá cao hay việc cho vay nặng lãi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: tính lãi cho
  rationale: Dạng Hiphil của נשׁך trong luật lệ này chỉ việc người cho vay áp hoặc thu lãi; “tính lãi cho” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: לְאָחִיךָ
  choice: anh em mình
  rationale: Nghĩa đen là “anh/em trai của ngươi”, nhưng trong văn cảnh giao ước chỉ một người đồng bào Israel. “Anh em mình” giữ hình ảnh thân tộc mà vẫn có sức bao quát tự nhiên trong tiếng Việt.
- source_word: נֶשֶׁךְ
  choice: lãi
  rationale: Từ này nói chung về tiền lãi của khoản vay, không nhất thiết chỉ mức lãi quá cao; vì vậy “lãi” chính xác hơn “lãi cắt cổ” hay “cho vay nặng lãi”.
- source_word: כֶּסֶף
  choice: tiền
  rationale: Nghĩa gốc là “bạc”, nhưng trong văn cảnh kinh tế-pháp lý từ này thường có nghĩa là tiền.
- source_word: אֹכֶל
  choice: lương thực
  rationale: אֹכֶל là đồ ăn; trong bối cảnh cho vay, “lương thực” diễn đạt tự nhiên loại nhu yếu phẩm có thể được cho vay và hoàn trả.
- source_word: כָּל דָּבָר
  choice: bất cứ thứ gì
  rationale: Cụm từ mở rộng lệnh cấm đến mọi vật hay loại khoản vay ngoài tiền và lương thực.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: có thể tính lãi
  rationale: Cụm quan hệ này có nghĩa là thứ mà người ta tính hoặc thu lãi. Cách dịch giữ độ khái quát của tiếng Hebrew thay vì giới hạn vào một hình thức cho vay cụ thể.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “anh em mình” để giữ hình ảnh thân tộc-giao ước của nguyên văn mà không khiến câu tiếng Việt bị hiểu là chỉ nói đến anh/em trai ruột. Cấu trúc liệt kê được giữ gần nguyên văn.
