  naturalness: «Anh em không được» phù hợp với văn phong luật pháp hiện đại và cách xưng hô của bản dịch. Đưa «cho chủ của người ấy» về cuối câu làm quan hệ sở hữu rõ ràng hơn và câu tiếng Việt tự nhiên hơn.
