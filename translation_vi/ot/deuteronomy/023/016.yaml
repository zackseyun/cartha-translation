base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: vi
  text: Anh em không được giao nộp một nô lệ đã trốn khỏi chủ mình đến với anh em cho chủ của người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể được dịch là “đầy tớ”; tại đây, “nô lệ” được dùng vì tình trạng người ấy lệ thuộc một người chủ là trọng tâm của điều luật.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: giao nộp
  rationale: Dạng Hiphil của סגר ở đây có nghĩa là trao một người vào quyền kiểm soát của người khác. “Giao nộp” tự nhiên trong ngữ cảnh pháp lý và giữ được sắc thái cưỡng chế.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Trong luật này, việc người ấy lệ thuộc một người chủ và đã chạy trốn là trọng tâm; “nô lệ” diễn đạt địa vị bị lệ thuộc rõ hơn “đầy tớ”.
- source_word: אֶל אֲדֹנָיו
  choice: cho chủ
  rationale: Trong bối cảnh xã hội-pháp lý này, אָדוֹן chỉ người chủ của nô lệ, không phải tước hiệu thần linh.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: đã trốn khỏi
  rationale: Dạng Niphal của נצל có thể chỉ việc được giải thoát hoặc thoát đi. Trong bối cảnh một nô lệ rời khỏi chủ, “đã trốn khỏi” là cách diễn đạt phù hợp, đồng thời mệnh đề quan hệ được giữ lại.
- source_word: אֵלֶיךָ
  choice: mà đến với anh em
  rationale: Giới từ אֶל biểu thị sự chuyển động hướng tới người nghe. “Đến với anh em” giữ rõ hướng chuyển động ấy.
- source_word: מֵעִם אֲדֹנָיו
  choice: khỏi chủ mình
  rationale: מֵעִם diễn tả sự tách khỏi nơi hoặc người mà người ấy đang ở cùng; “khỏi chủ mình” là cách nói gọn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Địa vị xã hội được chỉ bằng עֶבֶד
  choice: nô lệ
  alternative: đầy tớ
  rationale: Điều luật nói đến một người thuộc quyền một người chủ, đã chạy trốn và không được trao trả. Vì tình trạng lệ thuộc là yếu tố trung tâm, “nô lệ” phản ánh trực tiếp hơn nghĩa của văn bản mà không làm nhẹ đi thực tại xã hội ấy.
- issue: Số của đại từ ngôi thứ hai אֵלֶיךָ
  choice: anh em
  alternative: ngươi
  rationale: Tiếng Hê-bơ-rơ dùng đại từ giống đực số ít để nói với cộng đồng giao ước như một tập thể. “Anh em” là lối xưng hô hiện đại, tự nhiên dành cho cộng đồng, dù hình thái nguồn là số ít.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “không được” cho mệnh lệnh cấm và “anh em” để diễn đạt cách Môi-se nói với cộng đồng Y-sơ-ra-ên; tránh từ cổ “ngươi”. Dấu chú thích [a] xuất hiện trong chính văn.
