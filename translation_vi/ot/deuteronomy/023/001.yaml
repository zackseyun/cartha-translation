base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: vi
  text: Không người đàn ông nào được lấy vợ của cha mình[a], cũng không được vén vạt áo của cha mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lấy” ở đây cũng có thể hiểu là “cưới làm vợ.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “vén sự che phủ của cha mình.” “Vạt áo” dịch hình ảnh về mép hoặc vạt y phục. Đây là lối nói uyển ngữ có hàm ý tình dục; có thể được hiểu gần với “phơi bày sự lõa lồ của cha mình” hoặc “xâm phạm quan hệ hôn nhân của cha mình.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: lấy
  rationale: Khi đi với “vợ”, לָקַח có thể mang nghĩa thành ngữ là lấy làm vợ. “Lấy” vừa tự nhiên trong tiếng Việt vừa giữ được phần nào cách diễn đạt của nguyên văn; “cưới” là một khả năng rõ nghĩa hơn nhưng cụ thể hơn.
- source_word: אִישׁ
  choice: Không người đàn ông nào
  rationale: Danh từ số ít giống đực chỉ một người nam; kết hợp với phủ định לֹא, cách diễn đạt này tự nhiên trong điều luật tiếng Việt.
- source_word: אֵשֶׁת אָבִיו
  choice: vợ của cha mình
  rationale: Giữ nguyên quan hệ pháp lý trong cụm sở hữu, không thu hẹp thành “mẹ kế”, vì người phụ nữ được nói đến không nhất thiết chỉ được hiểu theo cách gọi ấy.
- source_word: יְגַלֶּה
  choice: giở
  rationale: גלה có nghĩa mở ra, phơi bày. Với vạt áo, “giở” tạo thành hình ảnh tự nhiên hơn trong tiếng Việt mà vẫn giữ lối nói giảm về tình dục.
- source_word: כְּנַף
  choice: vạt áo
  rationale: כָּנָף có nghĩa cánh, mép hoặc phần vạt của y phục. “Vạt áo” phản ánh hình ảnh cụ thể của từ này tốt hơn “sự che phủ”, đồng thời chưa giải nghĩa hoàn toàn lối nói uyển ngữ.
theological_decisions:
- issue: Có nên nói thẳng ý nghĩa tình dục của thành ngữ trong chính văn hay không
  choice: Giữ hình ảnh “giở vạt áo của cha mình” trong chính văn
  alternative: xâm phạm quan hệ hôn nhân của cha mình; phơi bày sự lõa lồ của cha mình
  rationale: Nguyên văn dùng một thành ngữ uyển ngữ khác với công thức thông thường “phơi bày sự lõa lồ”. Giữ hình ảnh bảo tồn sự mơ hồ và sức gợi của tiếng Hê-bơ-rơ; chú thích giải thích hàm ý mà không áp đặt một cách diễn giải duy nhất vào chính văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “không người đàn ông nào được” để diễn đạt lệnh cấm tự nhiên; giữ thành ngữ bằng “vạt áo” và giải thích trong chú thích. Các dấu chú thích đều xuất hiện trong chính văn.
