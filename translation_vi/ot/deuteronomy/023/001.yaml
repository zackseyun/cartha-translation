  to: Không người đàn ông nào được lấy vợ của cha mình[a], cũng không được vén vạt áo của cha mình[b].
  rationale: Chỉ điều chỉnh động từ “giở” thành “vén” để tiếng Việt tự nhiên hơn và sát hơn với ý “làm lộ ra.” Chú thích được chỉnh để phân biệt hình ảnh từ vựng của nguyên văn với các cách giải nghĩa thành ngữ, nhờ đó bảo toàn tính uyển ngữ và phần mơ hồ của câu.
