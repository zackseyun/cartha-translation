source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: vi
  text: Nhưng Yahweh, Đức Chúa Trời của anh em, không muốn nghe Balaam; Yahweh, Đức Chúa Trời của anh em, đã biến lời nguyền rủa thành phước lành cho anh em, vì Yahweh, Đức Chúa Trời của anh em, đã yêu thương anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: không muốn
  rationale: Động từ diễn tả ý muốn hoặc sự thuận tình; “không muốn” giữ rõ sắc thái chủ ý và tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước của Đức Chúa Trời bằng dạng chuyển tự quen dùng, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cụm danh từ có hậu tố ngôi hai số ít. “Anh em” được dùng theo lối xưng hô tập thể tự nhiên trong tiếng Việt, tương ứng với việc Môi-se nói với Israel như một cộng đồng.
- source_word: לִשְׁמֹעַ אֶל
  choice: nghe
  rationale: Thành ngữ có thể mang nghĩa nghe hoặc thuận theo. Trong ngữ cảnh này, “nghe Balaam” giữ được độ mở của nguyên văn và tránh diễn giải quá mức.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Dạng chuyển tự phổ biến của tên riêng.
- source_word: וַיַּהֲפֹךְ
  choice: đã biến
  rationale: Diễn tả việc chuyển đổi lời nguyền rủa thành lời chúc phước; “đã biến… thành…” tự nhiên trong tiếng Việt hiện đại.
- source_word: הַקְּלָלָה
  choice: lời nguyền rủa
  rationale: Chỉ lời nguyền được dự định nhằm vào Israel; cách diễn đạt này rõ nghĩa và trang trọng.
- source_word: לִבְרָכָה
  choice: thành lời chúc phước
  rationale: Giới từ לְ đánh dấu kết quả của sự chuyển đổi; cấu trúc “biến… thành…” diễn đạt tự nhiên quan hệ này.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu nguyên nhân cho hành động của Yahweh.
- source_word: אֲהֵבְךָ
  choice: yêu thương anh em
  rationale: Diễn đạt trực tiếp tình yêu của Yahweh, đồng thời phù hợp với văn phong trang trọng và tự nhiên.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Dạng “Yahweh” bảo tồn danh ấy thay vì thay bằng tước hiệu, mà không thêm một cách giải thích thần học riêng.
- issue: Số ít tập thể của đại từ ngôi hai
  choice: anh em
  alternative: ngươi
  rationale: Các hậu tố Hê-bơ-rơ ở số ít vì Israel được nói đến như một cộng đồng thống nhất. “Anh em” truyền đạt cách Môi-se nói với toàn dân bằng tiếng Việt hiện đại, trong khi “ngươi” dễ tạo sắc thái cổ hoặc gay gắt không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ ba lần lặp lại cụm “Yahweh, Đức Chúa Trời của anh em” như trong nguyên văn, thay vì rút gọn bằng đại từ.
