review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng quy định: được phép ngắt các bông hạt bằng tay, nhưng không được thu hoạch bằng liềm. Tuy nhiên, “vung liềm trên đồng lúa” chưa diễn đạt rõ hành động áp liềm để gặt mà động từ Hiphil נוּף, trong ngữ cảnh này, nhắm đến. “Đám lúa chưa gặt” cũng sát hơn với קָמָה là lúa đang đứng, thay vì nhấn vào cả thửa ruộng.'
  naturalness: “Anh em” làm ngôi thứ hai số ít đại diện trở thành số nhiều và có thể gợi lối xưng hô nội bộ tôn giáo. “Bạn” là cách xưng hô ngôi thứ hai số ít phổ thông, hiện đại và vẫn giữ lối nói trực tiếp của bản gốc. Cụm “đưa liềm vào gặt” tự nhiên, rõ nghĩa hơn “vung liềm trên đồng lúa.”
  terminology: Giữ “người lân cận,” “lúa chưa gặt,” “bông lúa,” và “liềm.” “Bông lúa” là cách gọi tự nhiên cho các đầu/bông hạt trong tiếng Việt; chú thích làm rõ nghĩa nông nghiệp.
  issues:
  - severity: medium
    issue: Cụm “không được vung liềm trên đồng lúa” chưa rõ và hơi gượng.
    rationale: Câu này có thể chỉ cử động liềm phía trên ruộng, trong khi câu Hê-bơ-rơ cấm áp/đưa liềm vào lúa đứng để thu hoạch. Cần một cách diễn đạt Việt ngữ rõ hơn mà vẫn không biến động từ thành một thuật ngữ kỹ thuật quá mức.
  - severity: low
    issue: “Anh em” không phản ánh ổn định ngôi thứ hai số ít của bản gốc.
    rationale: Dù có thể dùng theo nghĩa đại diện trong một số bản dịch Kinh Thánh, từ này có sắc thái số nhiều và cộng đồng tôn giáo. “Bạn” phù hợp hơn với tiếng Việt chuẩn hiện đại và vẫn là lời quy định trực tiếp.
