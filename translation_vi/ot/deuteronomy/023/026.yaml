  to: Khi bạn đi vào đám lúa chưa gặt của người lân cận, bạn có thể dùng tay ngắt những bông lúa[a], nhưng không được đưa liềm vào gặt lúa của người ấy.[b]
  rationale: 'Sửa cách xưng hô sang ngôi thứ hai số ít hiện đại và thay cách diễn đạt về liềm để làm rõ sự đối lập của câu: chỉ được ngắt bằng tay, không được bắt đầu gặt bằng liềm. “Đám lúa chưa gặt” giữ nét nghĩa lúa đứng của קָמָה và tránh mở rộng đối tượng sang toàn bộ thửa ruộng.'
