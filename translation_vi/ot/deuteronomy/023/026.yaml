base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: vi
  text: Khi bạn đi vào đám lúa chưa gặt của người lân cận, bạn có thể dùng tay ngắt những bông lúa[a], nhưng không được đưa liềm vào gặt lúa của người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bông lúa” là phần mang hạt ở đầu thân cây lương thực.
    reason: lexical_clarification
  - marker: b
    text: 'Cũng có thể dịch: “không được vung liềm trên lúa của người lân cận.” Động từ Hê-bơ-rơ gợi hình ảnh giơ, vung, hoặc áp liềm vào lúa để gặt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Khi anh em đi vào
  rationale: כִּי mở đầu tình huống áp dụng luật, nên “khi” tự nhiên hơn “nếu”; תָבֹא có nghĩa là đi vào hoặc đến. “Anh em” diễn đạt ngôi thứ hai số ít dùng theo nghĩa đại diện trong luật pháp bằng tiếng Việt hiện đại.
- source_word: בְּקָמַת
  choice: đồng lúa chưa gặt
  rationale: קָמָה chỉ cây lương thực còn đứng ngoài đồng, chưa được thu hoạch. Cách dịch này tự nhiên trong tiếng Việt và giữ được nét nghĩa quan trọng là mùa màng chưa gặt.
- source_word: רֵעֶךָ
  choice: của người lân cận
  rationale: רֵעַ trong văn bản luật pháp chỉ người khác trong cộng đồng; “người lân cận” là cách tương đương rõ ràng, quen thuộc.
- source_word: וְקָטַפְתָּ
  choice: anh em có thể ... ngắt
  rationale: Trong mạch luật này, hình thức động từ diễn tả hành động được phép làm, không phải mệnh lệnh bắt buộc.
- source_word: מְלִילֹת
  choice: những bông lúa
  rationale: מְלִילֹת chỉ các bông hoặc đầu hạt có thể ngắt bằng tay. “Bông lúa” dễ hiểu và phù hợp ngữ cảnh nông nghiệp.
- source_word: בְּיָדֶךָ
  choice: dùng tay
  rationale: 'Cụm từ xác định giới hạn của điều được phép: chỉ ngắt bằng tay, không thu hoạch bằng dụng cụ.'
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: nhưng không được vung liềm
  rationale: Liên từ tạo thế đối lập giữa việc ngắt bằng tay và dùng liềm. Hiphil của נוּף mang ý giơ, vung hoặc đưa qua; “vung liềm” vừa sát hình ảnh vừa tự nhiên.
- source_word: עַל קָמַת רֵעֶךָ
  choice: trên đồng lúa của người ấy
  rationale: עַל có nghĩa cơ bản là “trên/đối với”; ở đây diễn tả việc đưa liềm trên mùa màng để gặt. “Người ấy” tránh lặp nặng nề mà vẫn quy chiếu rõ đến người lân cận.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số ít mang nghĩa đại diện; dùng “đồng lúa chưa gặt” để truyền đạt tự nhiên khái niệm lúa còn đứng ngoài đồng mà không giới hạn vào riêng lúa mì hay lúa mạch.
