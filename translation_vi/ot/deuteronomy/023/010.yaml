  text: כִּֽי תֵצֵ֥א מַחֲנֶ֖ה עַל אֹיְבֶ֑י/ךָ וְ/נִ֨שְׁמַרְתָּ֔ מִ/כֹּ֖ל דָּבָ֥ר רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: vi
  text: Khi anh em ra quân chống lại kẻ thù, anh em phải giữ mình khỏi mọi điều xấu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi điều ô uế” hoặc “bất cứ điều gì không thích hợp.” Cụm từ Hê-bơ-rơ có nghĩa rộng; trong văn cảnh này, nó có thể bao gồm sự ô uế nghi lễ nhưng không chỉ giới hạn ở đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong câu luật lệ này, כִּי mở đầu hoàn cảnh dẫn đến mệnh lệnh tiếp theo. “Khi” tự nhiên hơn “nếu” và phù hợp với sắc thái tình huống của nguyên ngữ.
- source_word: תֵצֵא מַחֲנֶה
  choice: anh em ra quân
  rationale: יצא có nghĩa cơ bản là “đi ra,” còn מַחֲנֶה trong văn cảnh quân sự chỉ lực lượng đóng trại hay đạo quân. “Ra quân” diễn đạt tự nhiên hành động tiến ra với tư cách một lực lượng quân sự mà không thêm chi tiết ngoài văn bản.
- source_word: עַל אֹיְבֶיךָ
  choice: chống lại kẻ thù
  rationale: Trong văn cảnh quân sự, עַל mang nghĩa đối kháng; אֹיְבֶיךָ là “kẻ thù của anh em.” Cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: וְנִשְׁמַרְתָּ
  choice: anh em phải giữ mình
  rationale: Dạng Nifal của שׁמר ở đây có sắc thái phản thân và mang chức năng mệnh lệnh trong văn luật lệ. “Phải giữ mình” bảo toàn cả ý tự canh giữ lẫn tính bắt buộc.
- source_word: מִכֹּל
  choice: khỏi mọi
  rationale: Giới từ מִן đi với כֹּל sau động từ שׁמר diễn tả điều phải tránh hay đề phòng; “khỏi mọi” giữ được sắc thái phân phối của cụm từ.
- source_word: דָּבָר רָע
  choice: mọi điều xấu
  rationale: דָּבָר có nghĩa rộng là “điều/sự việc,” còn רָע là “xấu, dữ.” “Điều xấu” giữ phạm vi rộng của cụm từ, không giới hạn nó vào sự ô uế nghi lễ hay chỉ vào hành vi gian ác.
theological_decisions:
- issue: Phạm vi của דָּבָר רָע trong luật về sự thánh sạch của trại quân
  choice: Dịch rộng là “mọi điều xấu.”
  alternative: “mọi điều ô uế” hoặc “bất cứ điều gì không thích hợp”
  rationale: Văn cảnh tiếp theo đề cập đến ô uế nghi lễ, nhưng bản thân cụm từ Hê-bơ-rơ có nghĩa rộng hơn. Giữ cách diễn đạt rộng tránh thu hẹp văn bản vào riêng một phạm trù nghi lễ hay đạo đức.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Anh em” diễn đạt lời xưng hô số ít mang tính đại diện hướng đến cộng đồng Y-sơ-ra-ên mà không dùng đại từ cổ “ngươi.” “Ra quân” làm rõ văn cảnh quân sự của מַחֲנֶה theo lối diễn đạt tự nhiên.
