revisions:
- from: Người sinh ra từ một mối quan hệ bị cấm không được vào hội chúng của Yahweh; cho đến đời thứ mười[a], không ai thuộc dòng dõi người ấy được vào hội chúng của Yahweh.
  to: Người có xuất thân không hợp lệ không được vào hội chúng của Yahweh; dù đến đời thứ mười[a], không ai thuộc dòng dõi người ấy được vào hội chúng của Yahweh.
  rationale: Sửa thân văn để không khẳng định rằng xuất thân bị loại trừ nhất thiết do một "mối quan hệ bị cấm", điều nguyên văn không nói rõ. Điều chỉnh cụm chỉ thế hệ thứ mười để phản ánh sát hơn lực nhấn của công thức pháp lý Hê-bơ-rơ. Các yếu tố còn lại được giữ vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lệnh cấm, cụm "vào hội chúng của Yahweh", và sự kéo dài đến thế hệ thứ mười. Tuy nhiên, "sinh ra từ một mối quan hệ bị cấm" khẳng định một cách quá cụ thể nguyên nhân xuất thân của מַמְזֵר. Nghĩa và phạm vi chính xác của thuật ngữ hiếm này còn bất định; nguyên văn không nêu rõ loại quan hệ nào. Cần dùng cách diễn đạt không áp đặt lời giải thích đó vào thân văn và giữ phương án truyền thống trong chú thích.
  naturalness: '"Hội chúng của Yahweh" và "không được vào" tự nhiên trong văn phong luật pháp hiện đại. "Người có xuất thân không hợp lệ" tuy khái quát nhưng rõ, không miệt thị, và phù hợp hơn trong câu này. "Dù đến đời thứ mười" phản ánh trực tiếp lực nhấn của גַּם mà không gợi ý chắc chắn rằng lệnh cấm chấm dứt sau thế hệ ấy.'
  terminology: Giữ "Yahweh" theo quyết định dự án và "hội chúng" cho קְהַל. Tránh "con ngoài giá thú" ở thân văn vì vừa mang sắc thái dễ kỳ thị vừa có thể thu hẹp nghĩa của מַמְזֵר; vẫn nêu đây là cách dịch truyền thống trong chú thích.
  issues:
  - severity: medium
    issue: Thân văn giải thích quá mức מַמְזֵר là người sinh từ một quan hệ bị cấm.
    rationale: Dù đây là một khả năng giải thích có cơ sở trong ngữ cảnh luật pháp, bản thân từ Hê-bơ-rơ hiếm và phạm vi của nó bị tranh luận. Bản dịch nên bảo toàn bất định thay vì xác định nguyên nhân sinh thành.
  - severity: low
    issue: '"Cho đến đời thứ mười" có thể được hiểu là lệnh cấm chắc chắn hết hiệu lực sau đời thứ mười.'
    rationale: Công thức Hê-bơ-rơ nhấn mạnh sự loại trừ "ngay cả đến" thế hệ thứ mười. "Dù đến đời thứ mười" giữ lực nhấn này trung tính hơn.
