id: DEU.23.3
reference: Deuteronomy 23:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: vi
  text: Người có xuất thân không hợp lệ không được vào hội chúng của Yahweh; dù đến đời thứ mười[a], không ai thuộc dòng dõi người ấy được vào hội chúng của Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Từ Hê-bơ-rơ được dịch là “người có xuất thân không hợp lệ” (mamzer) có nghĩa chính xác chưa chắc chắn. Theo cách dịch truyền thống: “Người con ngoài giá thú không được vào hội chúng của Yahweh.”'
    reason: Nêu phương án dịch truyền thống của מַמְזֵר, đồng thời bảo tồn sự bất định về phạm vi nghĩa của thuật ngữ.
lexical_decisions:
- source_word: מַמְזֵר
  choice: người sinh ra từ một mối quan hệ bị cấm
  rationale: Từ Hê-bơ-rơ hiếm gặp này chỉ một người có địa vị xuất thân bị loại trừ, rất có thể do sinh ra từ một quan hệ bị luật cấm. Cách dịch này tránh từ miệt thị và không thu hẹp nghĩa thành mọi trường hợp sinh ngoài hôn nhân.
- source_word: יָבֹא
  choice: được vào
  rationale: Động từ có nghĩa đen là “đến/vào”; trong điều luật phủ định, “không được vào” diễn đạt tự nhiên lệnh cấm gia nhập hoặc dự phần.
- source_word: קְהַל יְהוָה
  choice: hội chúng của Yahweh
  rationale: קָהָל chỉ cộng đồng giao ước được triệu tập; “hội chúng” vừa trang trọng vừa dễ hiểu, đồng thời không mặc nhiên đồng nhất với một buổi nhóm hay địa điểm thờ phượng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: cho đến đời thứ mười
  rationale: Diễn đạt phạm vi kéo dài của lệnh loại trừ theo công thức pháp lý Hê-bơ-rơ.
- source_word: לֹא יָבֹא לוֹ
  choice: không ai thuộc dòng dõi người ấy được vào
  rationale: Đại từ לוֹ theo sau lời nhắc đến “đời thứ mười” hướng đến những người thuộc về dòng của người ấy; cách dịch làm rõ hàm ý thế hệ nhưng không giới hạn vào con cái trực hệ.
theological_decisions:
- issue: Ý nghĩa của מַמְזֵר
  choice: người sinh ra từ một mối quan hệ bị cấm
  alternative: người sinh ngoài giá thú
  rationale: Phạm vi chính xác của từ còn gây tranh luận. Chọn cách dịch gắn với quan hệ bị luật cấm vì phù hợp hơn với địa vị loại trừ trong luật giao ước, nhưng thêm chú thích để bảo tồn bất định từ vựng.
- issue: Phạm vi của “vào hội chúng của Yahweh”
  choice: giữ nguyên thành ngữ “vào hội chúng”
  alternative: được tham dự thờ phượng / được hưởng tư cách công dân
  rationale: Nguyên văn không xác định rõ đây là tham dự nghi lễ, tư cách pháp lý-cộng đồng hay quyền đảm nhiệm một vai trò cụ thể; bản dịch không giải quyết thay sự mơ hồ ấy.
- issue: Danh YHWH
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Dùng dạng chuyển tự của danh giao ước xuất hiện trực tiếp trong nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Tránh từ ngữ miệt thị đối với hoàn cảnh sinh ra; giữ nguyên sự mơ hồ của “hội chúng” và dùng “Yahweh” nhất quán cho יהוה.
