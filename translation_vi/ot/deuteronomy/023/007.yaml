source:
  edition: WLC
  text: לֹא תִדְרֹ֥שׁ שְׁלֹמָ֖/ם וְ/טֹבָתָ֑/ם כָּל יָמֶ֖י/ךָ לְ/עוֹלָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/007.yaml
  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: vi
  text: Ngươi không được tìm cầu sự bình an hay điều tốt lành cho họ trong suốt mọi ngày đời ngươi, mãi mãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bình an” cũng có thể mang nghĩa “an lành” hoặc “phúc lợi”; “điều tốt lành” có thể chỉ “lợi ích” hay “sự thịnh vượng.” Hai từ Hê-bơ-rơ có nghĩa rộng hơn bình an chính trị và thịnh vượng kinh tế.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: tìm cầu
  rationale: Động từ דרש có nghĩa là tìm kiếm, cầu tìm hoặc hỏi han. Trong mệnh lệnh cấm đi với các đối tượng trừu tượng, “tìm cầu” vừa sát nghĩa vừa tự nhiên và trang trọng.
- source_word: שְׁלֹמָם
  choice: sự bình an ... cho họ
  rationale: שָׁלוֹם bao gồm bình an, an lành và phúc lợi. “Sự bình an” giữ được nghĩa quen thuộc và vẫn phân biệt với danh từ tiếp theo.
- source_word: טֹבָתָם
  choice: điều tốt lành cho họ
  rationale: טוֹבָה chỉ điều tốt, lợi ích hoặc tình trạng tốt đẹp. “Điều tốt lành” giữ được phạm vi nghĩa rộng của tiếng Hê-bơ-rơ, thay vì thu hẹp vào sự thịnh vượng kinh tế.
- source_word: כָּל יָמֶיךָ
  choice: trong suốt mọi ngày đời ngươi
  rationale: Cách dịch này bảo toàn hình ảnh “mọi ngày” và ngôi thứ hai số ít của nguyên văn.
- source_word: לְעוֹלָם
  choice: mãi mãi
  rationale: Cụm từ nhấn mạnh thời hạn kéo dài của lệnh cấm; “mãi mãi” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sự chồng nghĩa giữa “trong suốt mọi ngày đời ngươi” và “mãi mãi”
  choice: Giữ lại cả hai cách diễn đạt
  alternative: Gộp thành “suốt đời ngươi” hoặc bỏ cách dịch riêng của לְעוֹלָם
  rationale: Nguyên văn cố ý xếp liền כָּל יָמֶיךָ và לְעוֹלָם để nhấn mạnh. Giữ cả hai phản ánh sức nặng của câu Hê-bơ-rơ và không tự ý làm phẳng sự căng thẳng trong cách diễn đạt.
- issue: Quan hệ giữa hai đối tượng trong câu phủ định
  choice: Dùng “hay” trong cấu trúc phủ định
  alternative: Dịch máy móc liên từ וְ bằng “và”
  rationale: Trong tiếng Việt, “không ... hay ...” diễn đạt tự nhiên lệnh cấm áp dụng cho cả hai đối tượng, không làm thay đổi phạm vi phủ định của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và gần với cấu trúc Hê-bơ-rơ. Đại từ “ngươi” giữ ngôi thứ hai số ít của lời luật; cụm “mọi ngày đời ngươi, mãi mãi” cố ý bảo toàn sự nhấn mạnh kép của nguyên văn.
