  source_fidelity: 'Bản dịch phản ánh đầy đủ lệnh cấm của nguyên văn: động từ תִדְרֹשׁ được chuyển là “tìm cầu”; hai đối tượng “sự bình an” và “điều tốt lành” giữ được sự phân biệt giữa שָׁלוֹם và טוֹבָה; hậu tố sở hữu được diễn đạt tự nhiên bằng “cho họ.” Cụm thời gian “trong suốt mọi ngày đời ngươi, mãi mãi” bảo toàn cả כָּל־יָמֶיךָ lẫn לְעוֹלָם, kể cả hiệu ứng nhấn mạnh chồng lớp của tiếng Hê-bơ-rơ.'
