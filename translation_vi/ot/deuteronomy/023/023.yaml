revisions:
- from: Nhưng nếu anh em không khấn nguyện thì anh em sẽ không mắc tội.[a]
  to: Nhưng nếu ngươi không lập lời khấn thì ngươi sẽ không phạm tội.[a]
  rationale: Bản sửa thay “khấn nguyện” bằng “lập lời khấn” để dịch đúng hành vi נדר, và dùng ngôi số ít phù hợp với tiếng Hê-bơ-rơ. “Sẽ không phạm tội” giữ ý chính của חֵטְא trong văn cảnh; chú thích bảo lưu sắc thái trách nhiệm/tội lỗi có thể có của thành ngữ “không có tội nơi ngươi.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: không lập lời khấn không khiến người nghe phạm tội. Tuy nhiên, “khấn nguyện” thường chỉ việc cầu nguyện/khấn cầu trong tiếng Việt và không phân biệt rõ hành vi lập một lời khấn (נדר). Ngoài ra, tiếng Hê-bơ-rơ dùng ngôi thứ hai số ít; “anh em” chuyển sang số nhiều không cần thiết.'
  naturalness: “Không lập lời khấn” là cách diễn đạt hiện đại, tự nhiên và chính xác hơn “không khấn nguyện” trong ngữ cảnh luật lệ về lời khấn. Đại từ “ngươi” giữ sắc thái trang trọng của diễn từ Kinh Thánh và phản ánh số ít của bản gốc.
  terminology: Dùng “lập lời khấn” để nhất quán với thuật ngữ lời khấn/nguyện ước trong văn cảnh. “Phạm tội” diễn đạt tự nhiên ý חֵטְא; chú thích giữ khả năng hiểu theo sắc thái tội lỗi/trách nhiệm.
  issues:
  - severity: medium
    issue: “Khấn nguyện” không xác định rõ nghĩa của נדר.
    rationale: Trong tiếng Việt hiện đại, “khấn nguyện” thường có nghĩa là cầu nguyện hoặc khấn cầu, trong khi נדר ở đây là lập/đưa ra một lời khấn. Cần dùng “lập lời khấn” để tránh nhập nhằng hai hành vi.
  - severity: low
    issue: “Anh em” chuyển ngôi thứ hai số ít sang số nhiều.
    rationale: Các hình thức תֶחְדַּל và בְּךָ đều là số ít. Dùng “ngươi” phản ánh hình thức nguồn và phù hợp với văn phong trang trọng của sách Phục truyền.
  - severity: low
    issue: Chú thích hiện tại chưa phản ánh rõ phương án “guilt” trong vết kiểm tra tiếng Anh.
    rationale: “Không mang tội” có thể dùng được nhưng kém tự nhiên. “Không bị quy tội” diễn đạt rõ hơn sắc thái không có trách nhiệm/có tội, dù là cách diễn giải thành ngữ.
  revised_text: Nhưng nếu ngươi không lập lời khấn thì ngươi sẽ không phạm tội.[a]
  revised_footnotes:
  - marker: a
    text: 'Hay: “ngươi sẽ không bị quy tội.”'
    reason: lexical_alternative
