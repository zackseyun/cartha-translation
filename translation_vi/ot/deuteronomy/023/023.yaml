base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: vi
  text: Nhưng nếu ngươi không lập lời khấn thì ngươi sẽ không phạm tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “ngươi sẽ không bị quy tội.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Nhưng nếu
  rationale: 'Cụm liên từ mở đầu một điều kiện tương phản với câu trước: đã khấn nguyện thì phải thực hiện, nhưng không khấn nguyện thì không phạm tội.'
- source_word: תֶחְדַּל
  choice: không
  rationale: Động từ חדל mang nghĩa “ngưng, thôi, không làm”; đi với động từ nguyên mẫu “khấn nguyện”, cách nói tự nhiên trong tiếng Việt là “không khấn nguyện”.
- source_word: לִ/נְדֹּר
  choice: khấn nguyện
  rationale: נדר chỉ hành động lập lời khấn với Đức Chúa Trời. “Khấn nguyện” vừa gọn, vừa giữ được tính chất trang trọng và cụ thể của hành động này.
- source_word: לֹא יִהְיֶה בְ/ךָ חֵטְא
  choice: anh em sẽ không mắc tội
  rationale: Cụm Hê-bơ-rơ có nghĩa sát là “sẽ không có tội nơi anh em”. “Không mắc tội” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ ý rằng việc không lập lời khấn không khiến người ấy phạm tội.
theological_decisions:
- issue: Tình trạng đạo đức của việc không lập lời khấn
  choice: Không khấn nguyện thì không mắc tội.
  alternative: Không khấn nguyện thì không mang tội hoặc không bị quy tội.
  rationale: חֵטְא có thể chỉ “tội” hoặc tình trạng “mang tội”. Bản chính dùng “mắc tội” để thể hiện sự đối lập pháp lý–đạo đức trong văn cảnh, còn chú thích giữ sắc thái về trách nhiệm tội lỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” thể hiện ngôi thứ hai số ít mang nghĩa tập thể, thường dùng khi Môi-se nói với dân Y-sơ-ra-ên. Dấu chú thích được đặt sau cụm từ mà phương án dịch thay thế trực tiếp giải thích.
