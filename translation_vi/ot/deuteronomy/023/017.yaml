  text: עִמְּ/ךָ֞ יֵשֵׁ֣ב בְּ/קִרְבְּ/ךָ֗ בַּ/מָּק֧וֹם אֲשֶׁר יִבְחַ֛ר בְּ/אַחַ֥ד שְׁעָרֶ֖י/ךָ בַּ/טּ֣וֹב ל֑/וֹ לֹ֖א תּוֹנֶֽ/נּוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: vi
  text: Người ấy sẽ ở với anh em[a], ở giữa anh em, tại nơi người ấy chọn trong một thành[b] của anh em, nơi nào tốt cho người ấy. Anh em không được áp bức người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người ấy sẽ cư ngụ với anh em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong một cổng của anh em”. Trong tiếng Hê-bơ-rơ, “cổng” có thể được dùng để chỉ cả thành hoặc cộng đồng dân cư.'
    reason: cultural_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: sẽ ở
  rationale: Động từ ישב có thể chỉ việc ngồi, lưu lại hoặc cư trú. Trong luật lệ về nơi cư trú của người vừa được nhắc đến, “sẽ ở” tự nhiên trong tiếng Việt và vẫn giữ nghĩa cư trú lâu dài.
- source_word: עִמְּךָ
  choice: với anh em
  rationale: Giữ nghĩa trực tiếp của giới từ עם là “với”; đại từ số ít tập thể hướng đến Israel được diễn đạt tự nhiên là “anh em” trong tiếng Việt.
- source_word: בְּקִרְבְּךָ
  choice: ngay giữa anh em
  rationale: Cụm từ diễn tả việc sống trong cộng đồng. “Ngay giữa anh em” giữ hình ảnh không gian và nhấn mạnh sự hiện diện bên trong cộng đồng.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: tại nơi người ấy chọn
  rationale: Giữ rõ rằng chính người ấy là chủ thể chọn nơi cư trú, không phải Đức Chúa Trời hay cộng đồng Israel.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: trong một thành của anh em
  rationale: Danh từ שער nghĩa đen là “cổng”, nhưng ở đây được dùng hoán dụ để chỉ thành hoặc khu dân cư có cổng. Dịch “thành” truyền đạt đúng ý nghĩa văn hóa bằng tiếng Việt tự nhiên.
- source_word: בַּטּוֹב לוֹ
  choice: nơi nào tốt cho người ấy
  rationale: Cụm Hê-bơ-rơ có nghĩa sát là “trong điều tốt cho người ấy”, diễn tả nơi phù hợp hoặc tốt theo hoàn cảnh của người ấy. Cách dịch này giữ được độ mở thay vì thu hẹp thành sở thích chủ quan.
- source_word: לֹא תּוֹנֶנּוּ
  choice: không được áp bức người ấy
  rationale: Trong ngữ cảnh pháp lý, dạng Hiphil của ינה chỉ việc áp bức, bóc lột hoặc đối xử bất công với người dễ bị tổn thương. “Áp bức” giữ đúng sức nặng xã hội và đạo đức của lệnh cấm.
theological_decisions:
- issue: Đối tượng của các hình thức giống đực số ít
  choice: Dịch là “người ấy”, chỉ cá nhân được nói đến ở câu trước, đồng thời không thêm giới tính vào tiếng Việt.
  alternative: Dịch rõ là “người nam ấy” hoặc dùng “anh ta”.
  rationale: Tiếng Hê-bơ-rơ dùng các hình thức giống đực số ít, nhưng đại từ tiếng Việt “người ấy” vẫn giữ số ít và chỉ đúng đối tượng mà không buộc phải nêu giới tính ngữ pháp vốn không vận hành tương tự trong tiếng Việt.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” cho đại từ ngôi hai số ít mang nghĩa tập thể chỉ Israel; dùng “người ấy” để theo sát chuỗi tham chiếu số ít và tránh lối diễn đạt nặng nề. Hai dấu chú thích [a], [b] đều đã được đặt trong chính văn.
