revisions:
- from: vì họ đã không đem bánh và nước ra đón anh em dọc đường khi anh em ra khỏi Ai Cập, và vì hắn đã thuê Ba-la-am, con trai Bê-ô, từ Phê-thô thuộc A-ram Na-ha-ra-im[a] đến nguyền rủa anh em.
  to: vì họ đã không đem bánh và nước ra đón anh em trên đường khi anh em ra khỏi Ai Cập, và vì người ấy đã thuê Ba-la-am, con trai Bê-ô, từ Phê-thô thuộc A-ram Na-ha-ra-im[a] để nguyền rủa anh em.
