id: DEU.23.5
reference: Deuteronomy 23:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: vi
  text: vì họ đã không đem bánh và nước ra đón anh em trên đường khi anh em ra khỏi Ai Cập, và vì người ấy đã thuê Ba-la-am, con trai Bê-ô, từ Phê-thô thuộc A-ram Na-ha-ra-im[a] để nguyền rủa anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-ram Na-ha-ra-im theo nghĩa đen là “A-ram của Hai Sông”, thường được đồng nhất với vùng Mê-sô-pô-ta-mi.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: vì
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân với điều cấm ở câu trước.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: đã không đem ... ra đón anh em
  rationale: Động từ קדמ trong ngữ cảnh này chỉ việc đi ra gặp, với bánh và nước làm đồ tiếp tế; cách dịch này giữ cả ý ra gặp lẫn vật được mang theo mà không diễn giải mạnh thành 'tiếp đãi'.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: bánh và nước
  rationale: Giữ hai danh từ cụ thể của tiếng Hê-bơ-rơ, thay vì khái quát hóa thành 'thức ăn và nước uống'.
- source_word: בַּדֶּרֶךְ
  choice: dọc đường
  rationale: Cách nói tự nhiên trong tiếng Việt cho hoàn cảnh cuộc hành trình.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: khi anh em ra khỏi Ai Cập
  rationale: Thể hiện đúng giá trị thời gian của cấu trúc nguyên mẫu và nhắc trực tiếp biến cố ra khỏi Ai Cập.
- source_word: וַאֲשֶׁר
  choice: và vì
  rationale: Nêu rõ lý do thứ hai song song với lý do thứ nhất.
- source_word: שָׂכַר עָלֶיךָ
  choice: hắn đã thuê ... đến ... anh em
  rationale: שׂכר là 'thuê'; ngữ cảnh thù nghịch và động từ mục đích 'nguyền rủa' cho thấy người được thuê nhằm chống lại Israel. 'Hắn' phản ánh sự chuyển sang chủ thể số ít trong nguyên văn mà không tự ý xác định rõ dân nào trong hai dân được nhắc ở câu trước.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Ba-la-am, con trai Bê-ô
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong tiếng Việt và giữ quan hệ phụ tử.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: từ Phê-thô thuộc A-ram Na-ha-ra-im
  rationale: Giữ địa danh Hê-bơ-rơ và dùng 'thuộc' để diễn đạt tự nhiên quan hệ địa lý mà không thay bằng tên gọi truyền thống mang tính diễn giải.
- source_word: לְקַלְלֶךָּ
  choice: đến nguyền rủa anh em
  rationale: Diễn đạt trực tiếp mục đích của việc thuê; 'nguyền rủa' tương ứng chính xác với קלל.
theological_decisions:
- issue: Chủ thể số ít của שָׂכַר sau chủ thể số nhiều ở mệnh đề trước
  choice: hắn
  alternative: họ
  rationale: Nguyên văn chuyển từ 'họ đã không...' sang động từ số ít 'đã thuê'. Bản dịch giữ sự chuyển đổi và không san phẳng thành số nhiều, qua đó bảo tồn nét căng về quy chiếu trong văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai chỉ cộng đồng Israel; giữ các tên riêng dưới dạng phiên âm tiếng Việt. Dấu chú thích [a] đặt ngay sau địa danh mà chú thích giải thích.
source_grounding:
  english_pob_role: consult_only
