  text: מוֹצָ֥א שְׂפָתֶ֖י/ךָ תִּשְׁמֹ֣ר וְ/עָשִׂ֑יתָ כַּ/אֲשֶׁ֨ר נָדַ֜רְתָּ לַ/יהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נְדָבָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ בְּ/פִֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: vi
  text: Mọi điều miệng anh em đã nói ra, anh em phải giữ và thực hiện,[a] đúng như điều anh em đã khấn nguyện với Yahweh, Đức Chúa Trời của anh em, là một lễ vật tự nguyện mà anh em đã nói ra bằng miệng mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Điều phát ra từ môi anh em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “một của dâng tự nguyện.” Từ Hê-bơ-rơ chỉ lễ vật được dâng cách tự do, không do bị ép buộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: Điều môi miệng anh em đã nói ra
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ về điều phát ra từ môi, đồng thời diễn đạt tự nhiên trong tiếng Việt; trong văn cảnh, đó là lời khấn hứa.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: anh em phải giữ và làm theo
  rationale: שׁמר mang nghĩa giữ, tuân giữ; עשה là thực hiện. Cặp từ này vừa bảo toàn hai động từ của nguyên văn vừa rõ nghĩa về việc hoàn thành lời đã nói.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: đúng như điều anh em đã ... khấn hứa
  rationale: Diễn tả nghĩa vụ phải thực hiện đúng nội dung lời khấn, không chỉ nói chung rằng đã có một lời hứa.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: với Yahweh, Đức Chúa Trời của anh em
  rationale: Dùng danh riêng Yahweh cho יהוה và giữ nguyên công thức giao ước 'Đức Chúa Trời của anh em'.
- source_word: נְדָבָה
  choice: tự nguyện
  rationale: Từ này chỉ điều tự nguyện hoặc lễ vật tự nguyện. Ở đây nó có thể bổ nghĩa cho lời khấn như một hành vi tự nguyện; cách dịch này giữ độ mở của cú pháp và tránh mặc nhiên thêm danh từ 'lễ vật' vào chính văn.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: và đã nói bằng chính miệng mình
  rationale: Bảo tồn sự nhấn mạnh và lặp lại có chủ ý của nguyên văn về tính công khai bằng lời nói của lời khấn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm Yahweh bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Quan hệ cú pháp của נְדָבָה
  choice: 'hiểu theo trạng ngữ: ''tự nguyện khấn hứa'''
  alternative: 'hiểu như danh từ: ''một lễ vật tự nguyện'''
  rationale: Tiếng Hê-bơ-rơ cho phép נְדָבָה được hiểu là điều tự nguyện gắn với lời khấn hoặc là một lễ vật tự nguyện. Chính văn dùng lối tự nhiên trong tiếng Việt nhưng chú thích giữ cách hiểu nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số ít giống đực trong nguyên văn được chuyển là 'anh em' theo lối diễn đạt cộng đồng của luật pháp Phục Truyền; 'bằng chính miệng mình' giữ nét nhấn mạnh của nguyên bản.
