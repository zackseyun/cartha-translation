  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ מִתְהַלֵּ֣ךְ בְּ/קֶ֣רֶב מַחֲנֶ֗/ךָ לְ/הַצִּֽילְ/ךָ֙ וְ/לָ/תֵ֤ת אֹיְבֶ֨י/ךָ֙ לְ/פָנֶ֔י/ךָ וְ/הָיָ֥ה מַחֲנֶ֖י/ךָ קָד֑וֹשׁ וְ/לֹֽא יִרְאֶ֤ה בְ/ךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/שָׁ֖ב מֵ/אַחֲרֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: vi
  text: Vì Giê-hô-va, Đức Chúa Trời của anh em, đi lại giữa trại quân của anh em để giải cứu anh em và trao quân thù vào tay anh em. Vì thế, trại quân của anh em phải thánh, để Ngài không thấy giữa anh em điều gì đáng xấu hổ[a] mà quay khỏi anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều gì không đứng đắn” hoặc “một việc đáng xấu hổ.” Cụm từ Hê-bơ-rơ có nghĩa rộng, chỉ điều không phù hợp với sự thánh của trại và có thể làm trại bị ô uế.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “quay lại khỏi phía sau anh em,” gợi hình ảnh Giê-hô-va không còn đồng hành với trại quân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng cách phiên âm danh giao ước quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: מִתְהַלֵּךְ
  choice: đi lại
  rationale: Giữ hình ảnh cụ thể về sự hiện diện và chuyển động của Đức Chúa Trời trong trại quân.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: giữa trại quân của anh em
  rationale: Diễn đạt tự nhiên ý ở ngay trong phạm vi trại; 'trại quân' làm rõ bối cảnh quân sự.
- source_word: לְהַצִּילְךָ
  choice: để giải cứu anh em
  rationale: '''Giải cứu'' phù hợp bối cảnh chiến trận và không thêm nghĩa thần học ngoài ngữ cảnh.'
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: trao quân thù vào tay anh em
  rationale: Chuyển thành ngữ Hê-bơ-rơ sang thành ngữ tiếng Việt tự nhiên, diễn tả việc đặt kẻ thù dưới quyền đối phương.
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: trại quân của anh em phải thánh sạch
  rationale: '''Phải'' thể hiện lực quy định trong ngữ cảnh; ''thánh sạch'' vừa giữ ý biệt riêng cho Đức Chúa Trời vừa phù hợp mối quan tâm về sự thanh sạch của trại.'
- source_word: עֶרְוַת דָּבָר
  choice: điều gì ô uế
  rationale: Cụm từ rộng, chỉ một việc không đoan chính, đáng xấu hổ hoặc gây ô uế; chú thích giữ lại các sắc thái khác.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: quay khỏi anh em
  rationale: Phản ánh ý Đức Chúa Trời không còn đồng hành với trại mà không diễn giải quá mức giới từ và hình ảnh Hê-bơ-rơ.
theological_decisions:
- issue: Cách mô tả mang tính nhân hình về sự hiện diện của Đức Chúa Trời
  choice: Giữ hình ảnh Ngài 'đi lại' giữa trại quân
  alternative: Diễn đạt trừu tượng là 'hiện diện' trong trại quân
  rationale: Nguyên văn cố ý dùng ngôn ngữ chuyển động cụ thể để nhấn mạnh sự gần gũi thánh khiết của Đức Chúa Trời; bản dịch không suy diễn rằng Ngài có thân thể.
- issue: Lực nghĩa của mệnh đề về sự thánh khiết
  choice: 'Dịch theo nghĩa bắt buộc: ''phải thánh sạch'''
  alternative: 'Dịch như tương lai hoặc lời tuyên bố: ''sẽ thánh'''
  rationale: Trong mạch văn, sự hiện diện của Đức Chúa Trời đặt ra yêu cầu về sự thánh sạch của trại, chứ không chỉ dự báo một tình trạng.
- issue: Hệ quả khi Đức Chúa Trời thấy điều ô uế
  choice: Giữ cách nói 'quay khỏi anh em'
  alternative: Diễn giải là 'không còn đi theo anh em'
  rationale: Cách dịch giữ nguyên sức căng của hình ảnh Đức Chúa Trời rút sự đồng hành mà không xác định quá chi tiết hướng chuyển động.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; dùng 'anh em' để diễn đạt ngôi thứ hai số ít tập thể chỉ toàn dân Y-sơ-ra-ên. Các thuật ngữ 'trại quân', 'giải cứu', 'quân thù' duy trì bối cảnh chiến trận. Mọi dấu chú thích đều xuất hiện trong chính văn.
