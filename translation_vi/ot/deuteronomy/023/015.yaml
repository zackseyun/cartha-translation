    text: 'Cũng có thể dịch: “điều gì không đứng đắn” hoặc “một việc đáng xấu hổ.” Cụm từ Hê-bơ-rơ có nghĩa rộng, chỉ điều không phù hợp với sự thánh của trại và có thể làm trại bị ô uế.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “quay lại khỏi phía sau anh em,” gợi hình ảnh Giê-hô-va không còn đồng hành với trại quân.'
    reason: lexical_alternative
