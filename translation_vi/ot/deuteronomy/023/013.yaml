  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: vi
  text: Ngươi phải có một chỗ[a] ở bên ngoài trại, và ngươi phải đi ra đó, ra bên ngoài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “tay” (yad); tại đây có lẽ là một cách nói thành ngữ chỉ một địa điểm hoặc chỗ được dành riêng. Một số bản dịch hiểu từ này cụ thể hơn là “dụng cụ” hoặc “cọc”, dựa vào câu tiếp theo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: một chỗ
  rationale: Nghĩa thông thường của từ này là “tay”, nhưng trong cấu trúc và ngữ cảnh ở đây, từ này nhiều khả năng được dùng theo lối thành ngữ để chỉ một địa điểm được dành riêng. “Một chỗ” vừa rõ nghĩa trong tiếng Việt hiện đại vừa phù hợp với mệnh lệnh đi đến đó.
- source_word: תִּהְיֶה לְךָ
  choice: ngươi phải có
  rationale: Cấu trúc היה + לְ diễn tả điều một người có hoặc được dành cho người ấy; trong văn cảnh luật lệ, “phải có” truyền đạt tự nhiên sức nặng mệnh lệnh.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: bên ngoài trại quân
  rationale: Cụm từ chỉ vị trí nằm ngoài ranh giới của trại. “Trại quân” làm rõ מַחֲנֶה trong bối cảnh cộng đồng Israel đóng trại.
- source_word: וְיָצָאתָ
  choice: và ngươi phải đi ra ngoài
  rationale: Động từ יצא ở thể qal có nghĩa thông dụng là “đi ra”. Cách dịch này giữ cả ý chuyển động lẫn sắc thái chỉ thị của câu.
- source_word: שָׁמָּה חוּץ
  choice: đến đó
  rationale: שָׁמָּה hướng về địa điểm vừa nêu, còn חוּץ nhấn mạnh việc đi ra phía ngoài. Ý “ra ngoài” đã được diễn đạt ngay trước “đến đó”, nhờ vậy bản dịch giữ được sự nhấn mạnh mà không trở nên gượng ép.
theological_decisions: []
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và trực tiếp. Đại từ “ngươi” phù hợp với lời luật truyền cho từng người trong cộng đồng. Câu giữ cấu trúc mệnh lệnh và ý nhấn mạnh việc đi ra bên ngoài, nhưng tránh lặp từ thiếu tự nhiên.
