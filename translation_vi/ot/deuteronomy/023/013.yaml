- from: Ngươi phải có một chỗ[a] bên ngoài trại quân, và ngươi phải đi ra ngoài, đến đó.
  to: Ngươi phải có một chỗ[a] ở bên ngoài trại, và ngươi phải đi ra đó, ra bên ngoài.
  rationale: Bản sửa giữ “một chỗ” cùng chú thích về יָד, nhưng dùng “trại” để không cụ thể hóa danh từ Hê-bơ-rơ và đặt “ra đó, ra bên ngoài” theo trật tự của שָׁמָּה חוּץ. Sự lặp lại “ra” được giữ có chủ ý vì phản ánh nhấn mạnh của nguyên văn.
