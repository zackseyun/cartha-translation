  to: Về chiều, người ấy phải tắm rửa bằng nước; khi mặt trời lặn[a], người ấy được vào bên trong trại[b].
  rationale: Chỉ điều chỉnh mốc thời gian đầu câu từ “Đến chiều tối” thành “Về chiều” để phản ánh chính xác hơn ý ‘khi ngày ngả về chiều’ của nguyên văn. Chú thích b được làm rõ để nêu đúng sắc thái của từ chỉ ‘phần bên trong/giữa’ trại. Các yếu tố còn lại được giữ nguyên vì trung thành với nguyên văn và phù hợp tiếng Việt hiện đại.
