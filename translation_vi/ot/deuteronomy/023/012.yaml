base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: vi
  text: Về chiều, người ấy phải tắm rửa bằng nước; khi mặt trời lặn[a], người ấy được vào bên trong trại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “khi mặt trời đi vào”; đây là một thành ngữ Hê-bơ-rơ chỉ lúc mặt trời lặn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “vào giữa trại”; từ Hê-bơ-rơ nhấn mạnh việc vào phần bên trong trại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לִפְנוֹת עֶרֶב
  choice: Đến chiều tối
  rationale: Cụm mở đầu tiếp nối chỉ thị luật pháp và diễn tả lúc ngày chuyển dần sang buổi tối. “Đến chiều tối” tự nhiên trong tiếng Việt và giữ được trình tự thời gian.
- source_word: יִרְחַץ בַּמָּיִם
  choice: phải tắm rửa bằng nước
  rationale: Động từ רחץ trong ngữ cảnh này nói đến việc rửa thân thể. “Tắm rửa bằng nước” diễn đạt rõ hành động, còn “phải” thể hiện tính bắt buộc của chỉ thị.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: khi mặt trời lặn
  rationale: Cách nói Hê-bơ-rơ theo nghĩa sát chữ là khi mặt trời “đi vào”, một thành ngữ chỉ lúc mặt trời lặn. Bản dịch dùng cách nói tự nhiên trong tiếng Việt và ghi nghĩa sát chữ ở chú thích.
- source_word: יָבֹא
  choice: người ấy được vào
  rationale: Trong quy định này, thể vị hoàn thành chưa hoàn tất diễn tả việc người ấy được phép trở lại sau khi tắm rửa và mặt trời đã lặn, chứ không chỉ đơn thuần tiên báo một hành động tương lai.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: vào bên trong trại
  rationale: תּוֹךְ nhấn mạnh việc đi vào phần bên trong của trại. Cách dịch này vừa tự nhiên vừa giữ sắc thái cụ thể hơn cách nói đơn giản “vào trại”.
theological_decisions:
- issue: Sắc thái pháp lý của יָבֹא
  choice: người ấy được vào
  alternative: người ấy sẽ vào / phải vào
  rationale: Mạch luật pháp cho thấy đây là sự cho phép tái nhập trại sau khi đã hoàn tất việc tắm rửa và chờ đến lúc mặt trời lặn; bản dịch không biến sự cho phép thành mệnh lệnh phải đi vào.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng “người ấy” để chỉ lại người đàn ông đang được nói đến trong ngữ cảnh. Câu giữ hai mốc thời gian và quan hệ điều kiện-tuần tự rõ ràng, tránh lối dịch quá sát chữ gây khó hiểu.
