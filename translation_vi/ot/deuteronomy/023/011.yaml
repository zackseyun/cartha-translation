language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֤ה בְ/ךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא יִהְיֶ֥ה טָה֖וֹר מִ/קְּרֵה לָ֑יְלָה וְ/יָצָא֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: vi
  text: Nếu giữa anh em có một người đàn ông không thanh sạch vì xuất tinh ban đêm[a], người ấy phải đi ra ngoài trại và không được vào bên trong trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “một việc xảy ra ban đêm”, một lối nói chỉ sự xuất tinh ban đêm.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong văn cảnh luật theo trường hợp, từ này mở đầu một điều kiện giả định; “nếu” tự nhiên và chính xác hơn cách hiểu thuần thời gian.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: giữa anh em có một người đàn ông
  rationale: Giữ cấu trúc hiện hữu và bối cảnh cộng đồng giao ước; “người đàn ông” phù hợp vì tình trạng thân thể được nói đến là của nam giới.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: không thanh sạch
  rationale: Diễn đạt tình trạng thanh sạch theo nghi lễ mà không hàm ý người ấy phạm tội hay ô uế về đạo đức.
- source_word: מִקְּרֵה לָיְלָה
  choice: vì xuất tinh ban đêm
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “một việc xảy ra ban đêm”, một lối nói chỉ sự xuất tinh về đêm; cách dịch này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: người ấy phải đi ra ngoài trại
  rationale: Diễn đạt mệnh lệnh pháp lý và giữ rõ chuyển động ra khỏi phạm vi trại.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: không được vào bên trong trại
  rationale: “Bên trong” giữ sắc thái của תּוֹךְ, tức phần nội vi của trại, thay vì chỉ nói chung là không được vào trại.
theological_decisions:
- issue: Bản chất của tình trạng không thanh sạch
  choice: Diễn đạt đây là tình trạng không thanh sạch theo nghi lễ, không phải lỗi đạo đức.
  alternative: Hiểu tình trạng này là sự ô uế hàm ý phạm tội.
  rationale: Văn cảnh quy định sự thánh sạch của trại liên quan đến tình trạng thân thể; câu không quy lỗi đạo đức cho người đàn ông.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ cộng đồng số ít mang nghĩa tập thể; dùng “người ấy” để tránh lặp nặng nề. Thuật ngữ “không thanh sạch” duy trì phạm trù nghi lễ và tránh sắc thái kết án đạo đức.
