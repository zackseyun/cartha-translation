id: DEU.23.2
reference: Deuteronomy 23:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹֽא יָבֹ֧א פְצֽוּעַ דַּכָּ֛א וּ/כְר֥וּת שָׁפְכָ֖ה בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/002.yaml
  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: vi
  text: Người nào có tinh hoàn bị nghiền nát hoặc dương vật bị cắt đứt thì không được vào hội chúng của Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hội chúng của Yahweh” có thể nói đến việc chính thức tham gia cộng đồng giao ước của Israel; phạm vi chính xác của sự loại trừ này vẫn còn được tranh luận.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: được vào
  rationale: Động từ בוא có nghĩa là “đến/vào”; kết hợp với לֹא trong quy định pháp lý, “không được vào” diễn đạt tự nhiên sức cấm đoán mà không thêm cách giải thích về phạm vi.
- source_word: פְצוּעַ דַּכָּא
  choice: có tinh hoàn bị nghiền nát
  rationale: Cụm từ chỉ thương tổn do nghiền nát ở cơ quan sinh dục nam; “tinh hoàn” cụ thể và rõ hơn cách nói rộng là “bộ phận sinh dục”.
- source_word: וּכְרוּת שָׁפְכָה
  choice: hoặc dương vật bị cắt đứt
  rationale: Cụm từ nói đến cơ quan sinh dục nam bị cắt; cách dịch trực tiếp, chính xác và dễ hiểu. “Hoặc” thể hiện hai tình trạng được phân biệt trong câu.
- source_word: בִּקְהַל
  choice: hội chúng
  rationale: קהל chỉ cộng đồng được triệu tập hoặc tụ họp. “Hội chúng” giữ sắc thái cộng đồng giao ước mà không tự xác định đây chỉ là một buổi nhóm họp, một thiết chế dân sự hay một phạm vi thờ phượng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: לֹא
  choice: không được
  rationale: Trong văn cảnh luật pháp, cách diễn đạt này chuyển tải rõ lệnh cấm của phủ định tiếng Hê-bơ-rơ.
- source_word: implicit male referent of the participial phrases
  choice: Người nào
  rationale: “Người nào” là cách mở đầu luật định tự nhiên trong tiếng Việt; các mô tả giải phẫu theo sau đã xác định rõ đối tượng là nam giới, nên không cần thêm từ “đàn ông” vốn có thể làm câu nặng nề.
theological_decisions:
- issue: Bản chất của việc bị loại khỏi “hội chúng của Yahweh”
  choice: Giữ nguyên cụm “không được vào hội chúng của Yahweh” mà không xác định thêm phạm vi pháp lý hoặc thần học.
  alternative: Diễn giải là không được tham gia chính thức vào cộng đồng giao ước, không đủ tư cách công dân/hôn nhân trong Israel, hoặc bị loại khỏi sinh hoạt thờ phượng.
  rationale: Bản thân câu Hê-bơ-rơ không định rõ toàn bộ phạm vi của קהל hay hệ quả cứu rỗi. Dịch thẳng cụm từ giúp bảo toàn sự mơ hồ thực sự và tránh đưa kết luận giáo phái vào bản văn.
translation_notes:
  register: Văn phong luật định, trang trọng nhưng hiện đại và dễ hiểu. Dùng thuật ngữ giải phẫu trực tiếp, không dùng uyển ngữ mơ hồ. Dấu chú thích [a] xuất hiện ngay sau cụm câu liên quan.
