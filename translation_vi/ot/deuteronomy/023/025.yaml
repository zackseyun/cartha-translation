  terminology: “Vườn nho,” “người lân cận,” “ăn nho,” và “đồ đựng” đều nhất quán, dễ hiểu và không thu hẹp hoặc thêm thắt nghĩa của nguyên văn. Các chú thích giải thích đúng các điểm từ vựng và không áp đặt diễn giải thần học.
