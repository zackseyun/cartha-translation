  text: כִּ֤י תָבֹא֙ בְּ/כֶ֣רֶם רֵעֶ֔/ךָ וְ/אָכַלְתָּ֧ עֲנָבִ֛ים כְּ/נַפְשְׁ/ךָ֖ שָׂבְעֶ֑/ךָ וְ/אֶֽל כֶּלְיְ/ךָ֖ לֹ֥א תִתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: vi
  text: Khi vào vườn nho của người lân cận[a], anh em có thể ăn nho tùy thích cho đến no[b], nhưng không được bỏ nho vào đồ đựng của mình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu anh em vào vườn nho của người lân cận.” Từ Hê-bơ-rơ có thể mở đầu một mệnh đề chỉ thời gian hoặc điều kiện.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát chữ: “theo ham muốn của anh em, đến mức no đủ”; đây là thành ngữ chỉ việc ăn tùy nhu cầu cho đến khi no.'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “vật đựng.” Từ Hê-bơ-rơ có nghĩa rộng, không xác định đó là giỏ, túi hay một loại đồ chứa cụ thể nào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Tiểu từ này mở đầu một tình huống luật định; “khi” tự nhiên trong tiếng Việt, còn khả năng hiểu là “nếu” được giữ trong chú thích.
- source_word: תָבֹא בְּכֶרֶם
  choice: vào vườn nho
  rationale: Động từ בוא cùng giới từ בְּ diễn tả việc đi vào một nơi; cách nói này tự nhiên và chính xác trong tiếng Việt.
- source_word: רֵעֶךָ
  choice: của người lân cận
  rationale: רֵעַ chỉ người bên cạnh, đồng loại hoặc người khác trong cộng đồng; “người lân cận” phù hợp với văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: anh em có thể ăn nho
  rationale: Trong điều luật này, hình thái động từ diễn tả sự cho phép, không phải mệnh lệnh phải ăn.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: tùy thích cho đến no
  rationale: Cụm Hê-bơ-rơ theo sát chữ là “theo ham muốn của ngươi, đến sự no đủ của ngươi,” mang nghĩa được ăn theo nhu cầu bản thân đến khi no.
- source_word: וְאֶל כֶּלְיְךָ לֹא תִתֵּן
  choice: nhưng không được bỏ nho vào đồ đựng của mình
  rationale: נתן ở đây mang nghĩa đặt/bỏ vào; כְּלִי là từ khái quát chỉ vật dụng hay đồ chứa, nên không thu hẹp thành giỏ hoặc túi. “Nho” được nhắc lại để câu tiếng Việt rõ nghĩa.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và trực tiếp. Đại từ “anh em” thể hiện ngôi thứ hai số ít mang tính đại diện trong luật pháp Hê-bơ-rơ mà không dùng lối xưng hô cổ. Các dấu chú thích [a], [b], [c] đều đặt ngay sau nội dung liên quan.
