  text: וְ/יָתֵ֛ד תִּהְיֶ֥ה לְ/ךָ֖ עַל אֲזֵנֶ֑/ךָ וְ/הָיָה֙ בְּ/שִׁבְתְּ/ךָ֣ ח֔וּץ וְ/חָפַרְתָּ֣ה בָ֔/הּ וְ/שַׁבְתָּ֖ וְ/כִסִּ֥יתָ אֶת צֵאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: vi
  text: Con phải có một cái cọc[a] trong trang bị của mình[b]. Khi con ngồi ở ngoài[c], con phải dùng nó đào, rồi quay lại che lấp phân của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một cái chốt”; một số người hiểu vật này theo công dụng là dụng cụ đào hoặc chiếc xẻng nhỏ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “trên tai con”. Đây có lẽ là một thành ngữ chỉ đồ dùng hoặc trang bị mang theo.
    reason: lexical_alternative
  - marker: c
    text: Cụm từ “ngồi ở ngoài” là cách nói giảm kín đáo trong tiếng Hê-bơ-rơ về việc đi đại tiện.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: cái cọc
  rationale: Danh từ này thường chỉ cọc hoặc chốt. Trong ngữ cảnh, vật ấy được mang theo và dùng để đào; “cái cọc” giữ được hình ảnh từ vựng của tiếng Hê-bơ-rơ, còn chức năng được làm rõ trong mệnh đề sau.
- source_word: עַל אֲזֵנֶךָ
  choice: trong số dụng cụ của mình
  rationale: Nghĩa đen của אֹזֶן là “tai”, nhưng cách nói này trong ngữ cảnh doanh trại có lẽ chỉ phần trang bị hoặc dụng cụ mang theo. Cách dịch này truyền đạt ý theo ngữ cảnh mà không giữ một nghĩa đen khó hiểu trong tiếng Việt.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: khi ra ngoài ngồi xuống
  rationale: Cụm từ có nghĩa sát là “khi con ngồi ở ngoài”, dùng như một cách nói giảm kín đáo về việc đi đại tiện. Bản dịch giữ hình ảnh và sắc thái tế nhị của nguyên văn.
- source_word: וְחָפַרְתָּה בָהּ
  choice: dùng nó đào đất
  rationale: Đại từ giống cái chỉ lại יָתֵד. Nguyên văn không nêu rõ “một cái hố”; thêm “đất” giúp câu tiếng Việt tự nhiên mà không xác định quá mức vật được đào.
- source_word: וְשַׁבְתָּ
  choice: quay lại
  rationale: Động từ שׁוב ở đây diễn tả hành động quay lại sau khi đào để che lấp chất thải, đồng thời giữ rõ trình tự hành động.
- source_word: צֵאָתֶךָ
  choice: phân của mình
  rationale: Danh từ chỉ chất thải của con người. “Phân” là từ hiện đại, rõ nghĩa, không thô tục và phù hợp với văn bản luật pháp.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng tự nhiên, dùng đại từ số ít “con” phù hợp mạch lời truyền dạy trong Phục Truyền Luật Lệ Ký. Giữ cách nói giảm của nguyên văn, đồng thời đặt chú thích để người đọc hiện đại hiểu rõ.
