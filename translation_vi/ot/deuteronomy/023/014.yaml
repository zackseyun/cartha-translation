  to: Con phải có một cái cọc[a] trong trang bị của mình[b]. Khi con ngồi ở ngoài[c], con phải dùng nó đào, rồi quay lại che lấp phân của mình.
  rationale: 'Chỉnh sửa nhẹ để câu tiếng Việt tự nhiên hơn và sát mức độ minh thị của tiếng Hê-bơ-rơ: dùng “trang bị,” đặt lại cụm uyển ngữ thành “ngồi ở ngoài,” và bỏ tân ngữ “đất” được ngầm hiểu. Các chú thích được giữ đủ neo và nội dung, chỉ điều chỉnh chú thích c để khớp chính xác với bản văn sửa.'
