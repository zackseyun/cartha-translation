source:
  edition: WLC
  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: vi
  text: Không một con gái Israel nào được là người nữ hành nghề mại dâm nghi lễ[a], và không một con trai Israel nào được là người nam hành nghề mại dâm nghi lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mại dâm đền miếu.” Theo nghĩa đen, các từ Hê-bơ-rơ này liên hệ với người “được biệt riêng”; nhưng trong ngữ cảnh này, chúng thường được hiểu là chỉ người nữ hoặc người nam gắn với hoạt động tình dục trong việc thờ cúng ngoại giáo. Dịch là “người nữ/người nam được thánh hiến” có thể gây hiểu lầm.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: người nữ hành nghề mại dâm trong nghi lễ
  rationale: Danh từ giống cái chỉ một phụ nữ gắn với hoạt động tình dục trong bối cảnh thờ cúng bất chính. Cách dịch này nêu rõ cả giới tính lẫn phương diện nghi lễ, nhưng không thu hẹp địa điểm thành đền thờ.
- source_word: קָדֵשׁ
  choice: người nam hành nghề mại dâm trong nghi lễ
  rationale: Danh từ giống đực song song với קְדֵשָׁה, chỉ một người nam gắn với hoạt động tình dục trong bối cảnh thờ cúng bất chính. Giữ cấu trúc song song và thể hiện rõ sự phân biệt nam–nữ của nguyên văn.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: không được có
  rationale: Diễn đạt tự nhiên bằng tiếng Việt hiện đại tính chất cấm đoán của văn luật, đồng thời giữ cấu trúc tồn tại của động từ Hebrew.
- source_word: מִבְּנוֹת יִשְׂרָאֵל
  choice: trong các con gái Israel
  rationale: Trong ngữ cảnh này, giới từ מִן biểu thị người thuộc phạm vi cộng đồng. “Trong” tự nhiên hơn “từ” trong tiếng Việt, còn “các con gái Israel” giữ hình ảnh gia đình–dân tộc và giới tính của nguyên văn.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: trong các con trai Israel
  rationale: Giữ phép đối xứng với “các con gái Israel” và bảo tồn cách gọi mang tính giao ước–cộng đồng của nguyên văn.
theological_decisions:
- issue: Nghĩa của קָדֵשׁ / קְדֵשָׁה trong điều luật này
  choice: Những người nam và nữ hành nghề mại dâm gắn với nghi lễ thờ cúng bất chính
  alternative: Người gian dâm nói chung; hoặc người được biệt riêng/thánh hiến theo nghĩa trung tính
  rationale: Trong văn cảnh, đây là các thuật ngữ kỹ thuật có sắc thái nghi lễ, chứ không chỉ nói chung về vô luân tình dục và cũng không mang nghĩa thánh hiến tích cực. Bản dịch giữ rõ yếu tố nghi lễ mà không xác quyết quá mức rằng hoạt động nhất thiết diễn ra trong một đền thờ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Cặp “con gái Israel / con trai Israel” bảo tồn thế đối xứng của nguyên văn; việc thêm “người nữ / người nam” giúp tiếng Việt xác định rõ giới tính của hai danh từ. Thuật ngữ “trong nghi lễ” giữ chiều kích thờ cúng mà không khẳng định địa điểm cụ thể là đền thờ.
