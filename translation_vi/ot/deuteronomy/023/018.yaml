    rationale: Cấu trúc phủ định với “Không một ... nào được...” phù hợp hơn với tiếng Việt hiện đại và giữ giọng văn luật pháp.
  - severity: low
    issue: Chú thích cần nói rõ hơn rằng nghĩa “được biệt riêng” là nghĩa theo từ nguyên/đọc sát, không phải nghĩa phù hợp của câu.
