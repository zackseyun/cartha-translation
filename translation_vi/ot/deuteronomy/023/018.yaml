revisions:
- from: Trong các con gái Israel không được có người nữ hành nghề mại dâm trong nghi lễ[a], và trong các con trai Israel không được có người nam hành nghề mại dâm trong nghi lễ.
  to: Không một con gái Israel nào được là người nữ hành nghề mại dâm nghi lễ[a], và không một con trai Israel nào được là người nam hành nghề mại dâm nghi lễ.
  rationale: Bản sửa thay cách diễn đạt hơi gượng và có thể quá cụ thể “trong nghi lễ” bằng “mại dâm nghi lễ”, vốn giữ chiều kích thờ cúng của thuật ngữ Hê-bơ-rơ mà không ép nghĩa rằng hoạt động xảy ra trong một nghi lễ hoặc tại một đền thờ. Cấu trúc phủ định mới tự nhiên hơn trong tiếng Việt, đồng thời duy trì phép song song nữ/nam và phạm vi cộng đồng Israel.
