revisions:
- from: Nhưng nếu anh em khấn nguyện với Yahweh, Đức Chúa Trời của mình, thì đừng chậm thực hiện lời khấn ấy, vì Yahweh, Đức Chúa Trời của anh em, chắc chắn sẽ đòi điều đó nơi anh em, và anh em sẽ mắc tội.[a]
  to: Nhưng nếu anh em hứa nguyện với Yahweh, Đức Chúa Trời của anh em, thì đừng chậm thực hiện lời khấn ấy, vì Yahweh, Đức Chúa Trời của anh em, chắc chắn sẽ đòi điều ấy từ anh em, và anh em sẽ mắc tội.[a]
  rationale: Đổi “khấn nguyện” thành “hứa nguyện” để phản ánh chính xác động từ נדר và cụm đồng gốc “lập một lời khấn”, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại. Điều chỉnh đại từ sở hữu và cách diễn đạt “đòi ... từ anh em” nhằm tăng tính nhất quán, tự nhiên, mà không thay đổi nghĩa hay mức độ nhấn mạnh của nguyên văn. Chú thích giữ lại tính cô đọng và hình ảnh của cấu trúc וְהָיָה בְךָ חֵטְא.
  reviewer_model: gpt-5.6-terra
