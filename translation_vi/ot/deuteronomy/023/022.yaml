source:
  edition: WLC
  text: כִּֽי תִדֹּ֥ר נֶ֨דֶר֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תְאַחֵ֖ר לְ/שַׁלְּמ֑/וֹ כִּֽי דָּרֹ֨שׁ יִדְרְשֶׁ֜/נּוּ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מֵֽ/עִמָּ֔/ךְ וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: vi
  text: Nhưng nếu anh em hứa nguyện với Yahweh, Đức Chúa Trời của anh em, thì đừng chậm thực hiện lời khấn ấy, vì Yahweh, Đức Chúa Trời của anh em, chắc chắn sẽ đòi điều ấy từ anh em, và anh em sẽ mắc tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “và tội sẽ ở trong anh em”; cũng có thể hiểu là “và anh em sẽ mang tội.”'
    reason: Bảo lưu thành ngữ Hê-bơ-rơ và khả năng diễn đạt hậu quả là tội hoặc tình trạng mắc tội.
lexical_decisions:
- source_word: כִּי
  choice: Nhưng nếu
  rationale: Trong mạch văn tiếp nối câu trước, כִּי vừa mở đầu điều kiện vừa tạo nét tương phản nhẹ; “nhưng nếu” diễn đạt được cả hai sắc thái.
- source_word: תִדֹּר נֶדֶר
  choice: khấn nguyện
  rationale: Cấu trúc động từ đi với danh từ cùng gốc nói về việc lập một lời khấn; “khấn nguyện” tự nhiên trong tiếng Việt và phù hợp bối cảnh thờ phượng.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: với Yahweh, Đức Chúa Trời của mình
  rationale: Giới từ לְ đánh dấu Đấng nhận lời khấn. “Yahweh” giữ nguyên danh giao ước; “của mình” quy chiếu tự nhiên về chủ ngữ trong mệnh đề phụ.
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: đừng chậm thực hiện lời khấn ấy
  rationale: Phủ định với thể vị hoàn thành mang lực của mệnh lệnh pháp lý. Trong ngữ cảnh lời khấn, שׁלם chỉ việc hoàn tất hoặc thực hiện điều đã hứa, không nhất thiết chỉ là trả tiền.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: chắc chắn sẽ đòi điều đó
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ hữu hạn tạo ý nhấn mạnh; “chắc chắn sẽ đòi” giữ được sức nhấn và sắc thái trách nhiệm giao ước.
- source_word: מֵעִמָּךְ
  choice: nơi anh em
  rationale: Cụm từ chỉ người mà Yahweh sẽ đòi việc hoàn thành lời khấn; “nơi anh em” giữ sắc thái nguồn/người chịu trách nhiệm mà vẫn trang trọng.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: và anh em sẽ mắc tội
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ Hê-bơ-rơ, trong khi chú thích bảo lưu hình thức sát chữ “tội sẽ ở trong anh em”.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của hậu quả וְהָיָה בְךָ חֵטְא
  choice: anh em sẽ mắc tội
  alternative: tội sẽ ở trong anh em
  rationale: Bản chính diễn đạt thành ngữ theo tiếng Việt tự nhiên nhưng không thêm cách giải thích giáo lý; chú thích ghi lại cấu trúc sát chữ và sự cô đọng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” dùng cho đại từ số ít mang tính đại diện trong diễn từ giao ước gửi toàn dân; tránh “ngươi” vì cổ, đồng thời không làm thay đổi đối tượng tập thể. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
