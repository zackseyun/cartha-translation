id: DEU.23.8
reference: Deuteronomy 23:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: vi
  text: Ngươi không được ghê tởm người Ê-đôm[a], vì người ấy là anh em của ngươi[b]. Ngươi không được ghê tởm người Ai Cập, vì ngươi từng là ngoại kiều[c] trong đất của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khinh ghét” hoặc “coi là đáng ghê tởm.”
    reason: lexical_alternative
  - marker: b
    text: “Anh em của ngươi” nói đến quan hệ họ hàng giữa Israel và Ê-đôm qua Ê-sau.
    reason: cross_reference
  - marker: c
    text: Hay “người ngoại quốc cư trú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: ghê tởm
  rationale: Động từ ở thể Piel diễn tả việc coi một người là đáng ghê tởm; cách dịch này giữ được sắc thái mạnh và sự lặp lại song song của hai mệnh lệnh.
- source_word: אֲדֹמִי
  choice: người Ê-đôm
  rationale: Danh từ chỉ một người thuộc dân Ê-đôm; giữ số ít đại diện như trong tiếng Hê-bơ-rơ.
- source_word: אָחִיךָ
  choice: anh em của ngươi
  rationale: Giữ hình ảnh thân tộc trực tiếp của nguyên ngữ, không diễn giải hẹp thành một loại quan hệ họ hàng cụ thể.
- source_word: מִצְרִי
  choice: người Ai Cập
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với một người thuộc dân Ai Cập, đồng thời giữ số ít đại diện.
- source_word: גֵר
  choice: ngoại kiều
  rationale: Chỉ người cư trú ngoài quê hương và sống giữa một cộng đồng khác; từ này gọn, dễ hiểu và giữ được sắc thái xã hội-pháp lý hơn từ chung chung 'người nước ngoài'.
- source_word: בְאַרְצוֹ
  choice: trong đất của người ấy
  rationale: Giữ danh từ 'đất' và hậu tố số ít của nguyên văn, trong đó người Ai Cập số ít đại diện cho xứ và dân Ai Cập.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho từng điều cấm một cách tự nhiên và chính xác trong tiếng Việt.
theological_decisions:
- issue: Danh từ số ít đại diện cho các dân tộc
  choice: 'Giữ số ít: ''người Ê-đôm'', ''người Ai Cập'', ''người ấy'', ''đất của người ấy''.'
  alternative: 'Chuyển sang số nhiều: ''người Ê-đôm... người Ai Cập... đất của họ''.'
  rationale: Nguyên văn dùng danh từ chỉ dân tộc ở số ít theo lối luật pháp để đại diện cho từng thành viên và cả dân tộc; giữ số ít bảo tồn tính trực tiếp của mệnh lệnh.
- issue: Ngôn ngữ thân tộc dành cho Ê-đôm
  choice: Dịch sát là 'anh em của ngươi'.
  alternative: Diễn giải là 'họ hàng của ngươi' hoặc 'người bà con của ngươi'.
  rationale: Cách dịch sát giữ nguyên mối liên hệ gia tộc-lịch sử giữa Israel và Ê-đôm qua Ê-sau mà không âm thầm làm phẳng hình ảnh thần học của bản văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Đại từ 'ngươi' phù hợp lời truyền trực tiếp trong Ngũ Kinh; sự lặp lại được giữ để phản ánh cấu trúc song song của nguyên văn. Các tên dân tộc dùng dạng tiếng Việt quen thuộc.
