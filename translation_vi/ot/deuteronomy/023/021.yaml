base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: vi
  text: Anh em được phép lấy lãi của người ngoại quốc[a], nhưng không được lấy lãi của anh em mình[b], để Yahweh, Đức Chúa Trời của anh em, ban phước cho anh em trong mọi việc tay anh em làm tại miền đất mà anh em sắp vào chiếm hữu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho người ngoại quốc vay lấy lãi” hoặc “thu lãi của người ngoại quốc.”'
    reason: lexical_alternative
  - marker: b
    text: “Anh em mình” ở đây chỉ một người cùng thuộc dân Israel; nguyên văn Hê-bơ-rơ dùng từ thân tộc “anh/em trai.”
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: người ngoại quốc
  rationale: נָכְרִי chỉ người ngoại quốc hoặc người ngoài cộng đồng Israel, đối lập với אָחִיךָ; cách dịch này rõ ràng trong tiếng Việt hiện đại.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: được phép lấy lãi / không được lấy lãi
  rationale: Dạng Hiphil của נשׁך trong luật về cho vay nói đến việc áp hoặc thu tiền lãi. “Lấy lãi” tự nhiên, trung tính và không mặc nhiên hàm ý mức lãi bóc lột.
- source_word: אָחִיךָ
  choice: anh em mình
  rationale: Giữ hình ảnh thân tộc của từ Hê-bơ-rơ “anh/em trai,” đồng thời dùng cách diễn đạt tiếng Việt có thể chỉ một người cùng cộng đồng giao ước.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả mà liên từ Hê-bơ-rơ để ngỏ trong ngữ cảnh.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em, ban phước cho anh em
  rationale: Giữ danh giao ước יְהוָה dưới dạng Yahweh và thể hiện động từ trong mệnh đề mục đích bằng lối diễn đạt tự nhiên.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: trong mọi việc tay anh em làm
  rationale: Bảo lưu hình ảnh “tay” trong thành ngữ Hê-bơ-rơ, đồng thời làm rõ rằng thành ngữ nói về mọi công việc hoặc việc thực hiện.
- source_word: עַל הָאָרֶץ
  choice: tại miền đất
  rationale: Trong ngữ cảnh này, עַל xác định nơi chốn; “tại miền đất” tự nhiên hơn “trên miền đất” trong tiếng Việt.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: mà anh em sắp vào chiếm hữu
  rationale: Diễn đạt hành động sắp tiến vào đất và mục đích nhận lấy, chiếm hữu đất ấy, không thêm tên Ca-na-an vốn không xuất hiện trong câu.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יְהוָה; phiên âm “Yahweh” bảo lưu tư cách danh riêng và tránh thay bằng một tước hiệu.
- issue: Phạm vi của “anh em mình” trong luật giao ước
  choice: Giữ cách gọi thân tộc trong chính văn và giải thích bằng chú thích
  alternative: người đồng bào Israel
  rationale: Nguyên văn dùng אָחִיךָ, nghĩa đen là “anh/em trai của ngươi,” nhưng trong ngữ cảnh luật pháp chỉ một thành viên cùng dân Israel. Giữ từ ngữ thân tộc bảo toàn sắc thái giao ước mà không làm nghĩa xã hội bị mơ hồ nhờ chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” được dùng cho đối tượng Israel mang tính tập thể; cấu trúc câu giữ rõ sự tương phản giữa người ngoại quốc và thành viên cùng cộng đồng. Danh Yahweh được giữ nguyên theo nguồn Hê-bơ-rơ.
