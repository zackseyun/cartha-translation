  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: vi
  text: Anh em không được đem tiền công của gái mại dâm hoặc tiền bán chó[a] vào nhà Yahweh, Đức Chúa Trời của anh em, để thực hiện bất cứ lời khấn nào, vì cả hai đều là điều ghê tởm đối với Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “tiền công của nam mại dâm” nếu “chó” ở đây là từ miệt thị chỉ một nam mại dâm phục vụ nghi lễ.
    reason: Ghi nhận cách hiểu ẩn dụ có thể có của כֶּלֶב mà không đưa cách hiểu còn tranh luận ấy vào chính văn.
lexical_decisions:
- source_word: תָבִיא
  choice: đem ... vào
  rationale: Dạng Hiphil của בוא diễn tả việc đưa một vật vào một nơi; cách dịch này giữ rõ hướng chuyển động đến nhà Yahweh.
- source_word: אֶתְנַן זוֹנָה
  choice: tiền công của gái mại dâm
  rationale: אֶתְנַן là khoản tiền trả cho dịch vụ, còn זוֹנָה chỉ gái mại dâm; cách diễn đạt này rõ ràng, hiện đại và không làm nhẹ nghĩa.
- source_word: מְחִיר כֶּלֶב
  choice: tiền bán chó
  rationale: מְחִיר là giá hoặc khoản tiền thu được khi bán, còn כֶּלֶב theo nghĩa trực tiếp là chó. Bản văn chính giữ nghĩa từ vựng thay vì quyết định một cách hiểu ẩn dụ còn đang tranh luận.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: nhà Yahweh, Đức Chúa Trời của anh em
  rationale: בֵּית được dịch là “nhà”, tránh dùng “đền thờ” vốn cụ thể hơn nguyên văn. Danh giao ước יְהוָה được phiên là “Yahweh”; đại từ số ít chỉ cộng đồng giao ước được diễn đạt tự nhiên bằng “anh em” trong tiếng Việt.
- source_word: לְכָל נֶדֶר
  choice: cho bất cứ lời khấn nguyện nào
  rationale: Giữ quan hệ mục đích rộng của giới từ לְ mà không thêm ý “thực hiện” hay “dâng lễ” vốn không được nói rõ trong nguyên văn.
- source_word: תוֹעֲבַת
  choice: điều ghê tởm
  rationale: Cụm từ này truyền đạt sức nặng đạo đức và nghi lễ của תוֹעֵבָה bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: גַּם שְׁנֵיהֶם
  choice: cả hai đều
  rationale: Diễn đạt rõ sự nhấn mạnh rằng cả hai khoản tiền vừa nêu đều thuộc phạm vi phán quyết.
theological_decisions:
- issue: Cách hiểu כֶּלֶב trong cụm מְחִיר כֶּלֶב
  choice: Dịch theo nghĩa trực tiếp là “chó” trong chính văn.
  alternative: “Tiền công của nam mại dâm” hoặc một từ miệt thị chỉ nam mại dâm trong nghi lễ.
  rationale: Nghĩa từ vựng trực tiếp của כֶּלֶב là “chó”, còn cách hiểu chỉ nam mại dâm không chắc chắn. Giữ “chó” trong chính văn bảo tồn sự mơ hồ của nguồn Hê-bơ-rơ; chú thích ghi nhận cách hiểu khác.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: CHÚA hoặc Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יְהוָה; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh em” để nói với cộng đồng Israel, tránh lối cổ “ngươi”; giữ “nhà” thay vì diễn giải thành “đền thờ”. Dấu chú thích được đặt ngay sau từ “chó” để chỉ rõ từ ngữ đang được giải thích.
