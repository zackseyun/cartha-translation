source:
  edition: WLC
  text: לֹ֥א תִירָ֖א מֵ/הֶ֑ם זָכֹ֣ר תִּזְכֹּ֗ר אֵ֤ת אֲשֶׁר עָשָׂה֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/פַרְעֹ֖ה וּ/לְ/כָל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: vi
  text: Anh em không được sợ chúng; phải ghi nhớ thật kỹ[a] những việc Yahweh, Đức Chúa Trời của anh em, đã làm đối với Pha-ra-ôn và toàn thể Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo sát từng chữ là “nhớ, ngươi sẽ nhớ”, một kết cấu nhấn mạnh, có nghĩa là “nhất định phải nhớ” hoặc “phải ghi nhớ thật kỹ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא
  choice: Anh em không được sợ
  rationale: Dạng chưa hoàn thành đi với לֹא mang lực cấm đoán trong lời khuyên răn này. “Không được sợ” tự nhiên trong tiếng Việt hiện đại và vẫn giữ sắc thái mệnh lệnh nghiêm trang.
- source_word: מֵהֶם
  choice: chúng
  rationale: Sau động từ ירא, giới từ מִן có thể đánh dấu đối tượng gây sợ hãi; tiếng Việt tự nhiên diễn đạt là “sợ chúng”.
- source_word: זָכֹר תִּזְכֹּר
  choice: phải ghi nhớ thật kỹ
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ chưa hoàn thành tạo ý nhấn mạnh. “Phải ghi nhớ thật kỹ” truyền đạt cả lực mệnh lệnh lẫn sự nhấn mạnh mà không gượng ép.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: những gì … đã làm
  rationale: Cách diễn đạt này chuyển tự nhiên sang tiếng Việt là “những gì … đã làm”; thì hoàn thành chỉ hành động lịch sử đã xảy ra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tứ Tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Hậu tố ngôi hai giống đực số ít hướng đến Israel như một cộng đồng giao ước. “Anh em” là cách gọi tập thể tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: לְפַרְעֹה
  choice: làm cho Pha-ra-ôn
  rationale: Với עשה, giới từ לְ chỉ đối tượng chịu tác động; “đã làm cho Pha-ra-ôn” giữ cấu trúc khái quát của nguyên văn mà không tự ý thêm nghĩa phán xét.
- source_word: וּלְכָל מִצְרָיִם
  choice: và toàn thể Ai Cập
  rationale: Nguyên văn gọi tên Ai Cập theo nghĩa tập thể, không nói riêng “người Ai Cập”; “toàn thể Ai Cập” bảo toàn phạm vi ấy.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự YHWH. Phiên âm “Yahweh” giữ tên riêng của Đức Chúa Trời thay vì thay bằng tước hiệu.
- issue: Số ít trong lời trực tiếp nói với Israel
  choice: anh em … Đức Chúa Trời của anh em
  alternative: ngươi … Đức Chúa Trời của ngươi
  rationale: Tiếng Hê-bơ-rơ dùng số ít để nói với Israel như một toàn thể. “Anh em” chuyển tải cách xưng hô cộng đồng bằng tiếng Việt hiện đại, tránh sắc thái cổ hoặc gay gắt của “ngươi” mà không biến đối tượng thành một cá nhân riêng lẻ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để gọi Israel theo nghĩa cộng đồng; giữ tên Yahweh và tên riêng Pha-ra-ôn. Dấu chấm phẩy phản ánh sự chuyển từ lệnh cấm sợ hãi sang mệnh lệnh phải nhớ.
