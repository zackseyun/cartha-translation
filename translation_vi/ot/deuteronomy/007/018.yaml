    rationale: זָכוֹר תִּזְכּוֹר gồm động từ nguyên mẫu tuyệt đối và động từ chưa hoàn thành ngôi hai số ít. Có thể giải thích thành ngữ nghĩa là “hãy/nhất định phải nhớ”, nhưng phần theo sát từng chữ không nên thay số ít bằng “anh em”.
