  rationale: Chỉnh “làm cho” thành “làm đối với” để biểu thị rõ Pha-ra-ôn và Ai Cập là các đối tượng chịu tác động, đồng thời không thêm diễn giải về bản chất các hành động ấy. Chỉnh chú thích để phân biệt bản dịch xưng hô cộng đồng “anh em” với hình thức ngữ pháp số ít trong tiếng Hê-bơ-rơ.
