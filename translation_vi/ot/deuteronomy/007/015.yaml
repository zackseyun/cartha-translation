reference: Deuteronomy 7:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: vi
  text: Đức Yahweh sẽ cất khỏi anh em mọi bệnh tật. Ngài sẽ không giáng trên anh em bất cứ chứng bệnh tai hại[a] nào của Ai Cập mà anh em đã biết[b], nhưng sẽ giáng chúng trên tất cả những kẻ ghét anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hiểm nghèo” hoặc “ác nghiệt”. Từ Hê-bơ-rơ có thể chỉ điều xấu, ác, tai hại hoặc nghiêm trọng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “mà anh em đã trải qua”. Động từ “biết” trong tiếng Hê-bơ-rơ ở đây có thể mang nghĩa biết do kinh nghiệm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: sẽ cất khỏi
  rationale: Thể Hiphil của סור diễn tả việc khiến một điều rời đi. “Cất khỏi” truyền đạt rõ ý loại bỏ và đi tự nhiên với bệnh tật trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Yahweh
  rationale: Giữ nguyên danh riêng giao ước bằng dạng chuyển tự “Yahweh”; thêm “Đức” theo cách xưng gọi tôn kính, tự nhiên trong tiếng Việt, chứ không thay danh ấy bằng một tước hiệu.
- source_word: כָּל חֹלִי
  choice: mọi bệnh tật
  rationale: חֹלִי chỉ sự đau ốm hay bệnh tật; cách dịch tập hợp này vừa sát nghĩa vừa tự nhiên.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: những chứng bệnh tai hại của Ai Cập
  rationale: מַדְוֶה là bệnh hay chứng bệnh, còn רַע trong ngữ cảnh này có thể chỉ tính chất xấu, tai hại hoặc hiểm nghèo. “Tai hại” tránh khiến độc giả hiểu bệnh tật là có ác ý về luân lý.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: mà anh em đã biết
  rationale: יָדַע trước hết là “biết” nhưng ở đây có thể bao hàm điều đã trải qua. Bản chính giữ cách diễn đạt rộng của tiếng Hê-bơ-rơ, còn chú thích nêu sắc thái trải nghiệm.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: sẽ không giáng trên anh em
  rationale: שׂים với בְּ diễn tả đặt một điều trên ai đó. Với bệnh tật, “giáng trên” là cách nói tiếng Việt tự nhiên, đồng thời giữ hình ảnh tai họa được đặt lên một đối tượng.
- source_word: וּנְתָנָם בְּכָל שֹׂנְאֶיךָ
  choice: nhưng sẽ giáng chúng trên tất cả những kẻ ghét anh em
  rationale: נתן cơ bản là “ban, trao, đặt”; trong ngữ cảnh bệnh tật, “giáng” diễn đạt tự nhiên tác động gây bệnh. “Những kẻ ghét anh em” phản ánh chính xác phân từ שֹׂנְאֶיךָ hơn từ rộng hơn là “kẻ thù”.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Đức Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng YHWH. Dạng “Yahweh” bảo tồn danh này thay vì thay thế bằng một tước hiệu; “Đức” chỉ là yếu tố xưng gọi tôn kính tự nhiên trong tiếng Việt.
- issue: Phạm vi của lời hứa về bệnh tật
  choice: Trình bày như lời hứa cụ thể trong bối cảnh giao ước dành cho dân đang được nói với
  alternative: Hiểu thành lời bảo đảm vô điều kiện rằng mọi cá nhân thuộc mọi thời đại sẽ không bao giờ mắc bệnh
  rationale: Câu Hê-bơ-rơ nói cụ thể về bệnh tật và các chứng bệnh của Ai Cập, nhưng bản thân câu này không mở rộng lời hứa thành một giáo lý phổ quát về sức khỏe cho mọi người trong mọi hoàn cảnh.
- issue: Sắc thái của הָרָעִים khi bổ nghĩa cho bệnh tật
  choice: tai hại
  alternative: xấu; hiểm nghèo; ác
  rationale: Từ רַע có dải nghĩa gồm xấu, ác, có hại và nghiêm trọng. Trong quan hệ bổ nghĩa cho bệnh tật, “tai hại” truyền đạt sắc thái phù hợp mà không nhân cách hóa bệnh tật về phương diện đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng cho đại từ số ít giống đực trong nguyên văn vì người được nói với là Israel như một cộng đồng; cách này tự nhiên hơn “ngươi” trong tiếng Việt hiện đại. Cấu trúc được chia thành hai câu để dễ đọc nhưng vẫn giữ thế đối lập giữa việc không giáng bệnh trên Israel và giáng chúng trên những kẻ ghét họ.
