  source_fidelity: Bản dịch truyền đạt đúng chuỗi phước lành trong tương lai, «con cái» cho «trái của lòng», các sản vật nông nghiệp, và lời thề với tổ phụ. Tuy nhiên, hai cụm cuối về gia súc trong tiếng Hê-bơ-rơ chỉ con non/sản vật sinh ra của đàn, không trực tiếp nói hành động «sinh sôi/sinh sản» của cả đàn.
