  terminology: «Ngài», «ban phước», «tổ phụ», «ngũ cốc», «rượu mới» phù hợp văn thể Kinh Thánh hiện đại và sát nghĩa. Không cần chú thích bắt buộc; «tổ phụ» bảo lưu cách gọi giống đực của אבות.
