  text: וַ/אֲהֵ֣בְ/ךָ֔ וּ/בֵרַכְ/ךָ֖ וְ/הִרְבֶּ֑/ךָ וּ/בֵרַ֣ךְ פְּרִֽי בִטְנְ/ךָ֣ וּ/פְרִֽי אַ֠דְמָתֶ/ךָ דְּגָ֨נְ/ךָ֜ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ שְׁגַר אֲלָפֶ֨י/ךָ֙ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֔/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: vi
  text: Ngài sẽ yêu thương anh em, ban phước cho anh em và làm cho anh em thêm đông đảo. Ngài sẽ ban phước cho con cái anh em và hoa lợi của đất đai anh em—ngũ cốc, rượu mới và dầu của anh em, con non của đàn bò và con non của đàn chiên dê—trên đất mà Ngài đã thề với tổ phụ anh em rằng sẽ ban cho anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: Ngài sẽ yêu thương anh em
  rationale: Ngữ cảnh nối tiếp chuỗi phước lành giao ước nên dùng thì tương lai; “yêu thương” giữ nguyên ý tình yêu giao ước. Đại từ Hê-bơ-rơ ở số ít tập thể, nhưng “anh em” tự nhiên trong tiếng Việt khi nói với toàn dân.
- source_word: וּבֵרַכְךָ
  choice: ban phước cho anh em
  rationale: Cách diễn đạt quen thuộc, trang trọng và sát nghĩa ברך trong bối cảnh giao ước.
- source_word: וְהִרְבֶּךָ
  choice: làm cho anh em thêm đông đảo
  rationale: Diễn đạt tự nhiên ý khiến dân số gia tăng, rõ hơn cách dịch sát chữ “làm nhiều anh em”.
- source_word: פְּרִי בִטְנְךָ
  choice: con cái anh em
  rationale: Thành ngữ nghĩa đen là “trái của bụng/lòng”; “con cái” truyền đạt nghĩa chỉ hậu duệ một cách tự nhiên trong tiếng Việt.
- source_word: פְּרִי אַדְמָתֶךָ
  choice: hoa lợi của đất đai anh em
  rationale: “Hoa lợi” giữ được hình ảnh thành quả sinh ra từ đất và phù hợp văn cảnh nông nghiệp.
- source_word: דְּגָנְךָ
  choice: ngũ cốc của anh em
  rationale: Chỉ sản vật thuộc các giống cây lương thực có hạt; “ngũ cốc” rõ và hiện đại.
- source_word: תִירֹשְׁךָ
  choice: rượu mới của anh em
  rationale: Giữ nét nghĩa rượu mới hoặc sản phẩm nho mới ép, không đồng nhất hoàn toàn với từ chung chỉ rượu.
- source_word: יִצְהָרֶךָ
  choice: dầu của anh em
  rationale: Từ này thường chỉ dầu ô-liu; bản văn chỉ nói “dầu”, nên không bổ sung loại cây vào chính văn.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: đàn bò sinh sôi
  rationale: Cụm từ chỉ sản vật hoặc con non do bò sinh ra; cách dịch này tự nhiên và giữ trọng tâm vào sự gia tăng của đàn bò.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: đàn chiên dê sinh sản
  rationale: Danh từ hiếm trong kết hợp này chỉ con non hoặc sự gia tăng của bầy gia súc nhỏ; “chiên dê” thể hiện phạm vi của צֹאן mà không biến עַשְׁתְּרֹת thành tên riêng.
- source_word: עַל הָאֲדָמָה
  choice: trên mảnh đất
  rationale: Chỉ lãnh thổ được hứa ban; “trên mảnh đất” vừa tự nhiên vừa giữ giới từ và liên hệ với đất.
- source_word: לַאֲבֹתֶיךָ
  choice: với tổ phụ anh em
  rationale: “Tổ phụ” phản ánh danh từ giống đực số nhiều và phù hợp công thức lời thề trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Giá trị thời của chuỗi động từ mở đầu
  choice: 'Dùng thì tương lai: “sẽ yêu thương… ban phước… làm cho… đông đảo”'
  alternative: 'Dùng quá khứ cho động từ đầu: “đã yêu thương”'
  rationale: Trong mạch điều kiện và lời hứa ở các câu 12–13, các động từ này nêu hành động phước lành sẽ diễn ra; không nên tách động từ đầu thành một hành động quá khứ.
- issue: Cách dịch לַאֲבֹתֶיךָ
  choice: với tổ phụ anh em
  alternative: với tổ tiên anh em
  rationale: “Tổ phụ” giữ sắc thái giống đực của אבות và công thức giao ước, trong khi “tổ tiên” là cách khái quát tự nhiên hơn nhưng ít cụ thể hơn.
- issue: Đại từ số ít tập thể của dân Y-sơ-ra-ên
  choice: anh em
  alternative: ngươi
  rationale: Nguồn dùng ngôi thứ hai số ít để nói với toàn dân như một cộng đồng. Tiếng Việt hiện đại dùng “anh em” tự nhiên, dễ hiểu và vẫn biểu đạt lời nói hướng đến cộng đồng, dù không tái hiện hình thức số ít.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể thần linh đã rõ từ văn cảnh; dùng “anh em” để chuyển đại từ số ít tập thể sang cách xưng hô cộng đồng tự nhiên trong tiếng Việt. Không cần chú thích vì “tổ phụ” trực tiếp phản ánh אבות và các thành ngữ nông nghiệp đã được diễn đạt rõ trong chính văn.
