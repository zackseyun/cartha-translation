revisions:
- from: những cuộc thử thách lớn lao mà chính mắt anh em đã thấy[a], những dấu lạ, những việc kỳ diệu, bàn tay quyền năng và cánh tay giương ra mà Yahweh, Đức Chúa Trời của anh em, đã dùng để đưa anh em ra khỏi đó—Yahweh, Đức Chúa Trời của anh em, cũng sẽ làm như vậy với mọi dân tộc[b] mà anh em đang sợ.
  to: những cuộc thử thách lớn lao mà chính mắt anh em đã thấy[a], những dấu lạ, những việc kỳ diệu, bàn tay quyền năng và cánh tay giơ ra mà Yahweh, Đức Chúa Trời của anh em, đã dùng để đưa anh em ra—Yahweh, Đức Chúa Trời của anh em, cũng sẽ làm như vậy với mọi dân tộc[b] mà anh em đang sợ.
  rationale: Bỏ “đó” để không thêm một quy chiếu địa điểm ngoài câu nguồn. Đổi “giương ra” thành “giơ ra” vì tự nhiên hơn trong tiếng Việt, không thay đổi hình ảnh hay nghĩa của nguyên văn. Các yếu tố khác, kể cả các neo chú thích, được giữ nguyên.
