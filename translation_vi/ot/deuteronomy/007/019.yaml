  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: vi
  text: những cuộc thử thách lớn lao mà chính mắt anh em đã thấy[a], những dấu lạ, những việc kỳ diệu, bàn tay quyền năng và cánh tay giơ ra mà Yahweh, Đức Chúa Trời của anh em, đã dùng để đưa anh em ra—Yahweh, Đức Chúa Trời của anh em, cũng sẽ làm như vậy với mọi dân tộc[b] mà anh em đang sợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những cuộc thử nghiệm lớn lao.” Từ Hê-bơ-rơ có thể chỉ những sự thử nghiệm hoặc thử thách khắc nghiệt.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “mọi dân.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: những cuộc thử thách lớn lao
  rationale: מַסּוֹת chỉ những sự thử nghiệm hoặc thử thách khắc nghiệt; “thử thách” tự nhiên trong tiếng Việt và không gợi ý sự cám dỗ phạm tội.
- source_word: רָאוּ עֵינֶיךָ
  choice: mà chính mắt anh em đã thấy
  rationale: Giữ hình ảnh “mắt” và sắc thái nhấn mạnh của nguyên văn bằng thành ngữ tiếng Việt tự nhiên “chính mắt… thấy”.
- source_word: הָאֹתֹת
  choice: những dấu lạ
  rationale: אוֹת là dấu hiệu; trong ngữ cảnh hành động phi thường của Đức Chúa Trời, “dấu lạ” rõ nghĩa và phù hợp với cách kết hợp cùng “việc kỳ diệu”.
- source_word: הַמֹּפְתִים
  choice: những việc kỳ diệu
  rationale: מוֹפְתִים chỉ những việc phi thường gây kinh ngạc; cách dịch này không thu hẹp nghĩa thành một thuật ngữ kỹ thuật về phép lạ.
- source_word: הַיָּד הַחֲזָקָה
  choice: bàn tay quyền năng
  rationale: Giữ nguyên ẩn dụ Hê-bơ-rơ về quyền năng hành động của Đức Chúa Trời, đồng thời dùng cách diễn đạt trang trọng, quen thuộc trong tiếng Việt.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: cánh tay giương ra
  rationale: Bảo tồn hình ảnh cụ thể về quyền năng đang được thi hành để giải cứu và xét xử.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: mà ... đã dùng để đưa anh em ra khỏi đó
  rationale: Diễn đạt mệnh đề quan hệ như phương tiện Đức Chúa Trời dùng trong cuộc giải cứu; “đưa ra khỏi” phản ánh thể Hiphil của יצא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: כֵּן יַעֲשֶׂה
  choice: cũng sẽ làm như vậy
  rationale: Thể hiện rõ phép so sánh giữa những việc Yahweh đã làm tại Ai Cập và điều Ngài sẽ làm trong tương lai.
- source_word: לְכָל הָעַמִּים
  choice: với mọi dân tộc
  rationale: עַמִּים là số nhiều của “dân”; “mọi dân tộc” tự nhiên trong tiếng Việt và giữ được ý nghĩa tập thể của nguyên văn.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: mà anh em đang sợ
  rationale: מִפְּנֵיהֶם là thành ngữ chỉ đối tượng gây sợ hãi; cách dịch này tự nhiên hơn việc sao chép máy móc nghĩa đen “trước mặt họ”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Phạm vi của mệnh đề אֲשֶׁר הוֹצִאֲךָ
  choice: Diễn đạt như phương tiện giải cứu, có thể tự nhiên liên hệ với cả chuỗi hành động và hình ảnh vừa nêu
  alternative: Chỉ gắn mệnh đề với “cánh tay giương ra”
  rationale: Cấu trúc Hê-bơ-rơ cho phép mệnh đề quan hệ nối với chuỗi dấu lạ, việc kỳ diệu, bàn tay và cánh tay; bản dịch không nên thu hẹp quá mức vào riêng danh từ gần nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng Israel dù đại từ Hê-bơ-rơ ở số ít, qua đó giữ sắc thái lời nói trực tiếp với toàn dân mà không khiến tiếng Việt trở nên gượng. Câu được giữ như một đoạn tiếp nối cú pháp của câu trước, phù hợp với hình thức nguồn được cung cấp.
