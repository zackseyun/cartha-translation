source:
  edition: WLC
  text: לֹ֥א תַעֲרֹ֖ץ מִ/פְּנֵי/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/קִרְבֶּ֔/ךָ אֵ֥ל גָּד֖וֹל וְ/נוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: vi
  text: Đừng khiếp sợ chúng, vì Yahweh, Đức Chúa Trời của anh em, đang ở giữa anh em—Ngài là Đức Chúa Trời vĩ đại và đáng kính sợ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đáng kinh khiếp”; từ Hê-bơ-rơ mô tả Đấng khiến người ta kính sợ và kinh sợ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: khiếp sợ chúng
  rationale: Động từ ערץ diễn tả nỗi kinh hãi hoặc khiếp sợ trước đối phương; cách nói này tự nhiên trong tiếng Việt và giữ được cường độ mạnh hơn từ “sợ” chung chung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ rõ quan hệ giao ước qua đại từ sở hữu số ít tập thể; tiếng Việt dùng “anh em” để nói tự nhiên với cộng đồng Israel.
- source_word: בְּקִרְבְּךָ
  choice: đang ở giữa anh em
  rationale: Diễn tả sự hiện diện của Đức Chúa Trời giữa cộng đồng, tránh cách hiểu thuần túy nội tâm của “ở trong anh em”.
- source_word: אֵל גָּדוֹל
  choice: Đức Chúa Trời vĩ đại
  rationale: אֵל là danh xưng chỉ Đức Chúa Trời, còn גָּדוֹל mang nghĩa “lớn, vĩ đại”; cách dịch này giữ quan hệ bổ nghĩa tự nhiên trong tiếng Việt.
- source_word: וְנוֹרָא
  choice: và đáng kính sợ
  rationale: Dạng từ gốc ירא mô tả Đấng khiến người ta kinh sợ và tôn kính; “đáng kính sợ” giữ cả sức nặng lẫn sắc thái tôn kính, không làm nhẹ thành “tuyệt vời”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của וְנוֹרָא
  choice: đáng kính sợ
  alternative: đáng kinh khiếp
  rationale: Từ này có thể nhấn mạnh sự đáng sợ, nhưng trong mô tả về Đức Chúa Trời nó cũng gợi lòng kính úy. “Đáng kính sợ” bảo tồn sự căng thẳng giữa nỗi sợ và lòng tôn kính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” biểu thị cộng đồng Israel được xưng hô bằng số ít tập thể trong tiếng Hê-bơ-rơ. Dấu gạch ngang làm rõ rằng cụm cuối đồng vị với “Yahweh, Đức Chúa Trời của anh em” mà không thêm nội dung.
