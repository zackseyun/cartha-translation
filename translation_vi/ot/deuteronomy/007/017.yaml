  yaml_path: translation/ot/deuteronomy/007/017.yaml
  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: vi
  text: 'Nếu anh em tự nhủ: “Các dân tộc này đông hơn ta; làm sao ta có thể tước quyền chiếm hữu đất của họ[a] được?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đuổi họ đi.” Động từ Hê-bơ-rơ hàm ý khiến họ mất quyền chiếm hữu đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר בִּלְבָבְךָ
  choice: Nếu anh em tự nhủ
  rationale: כִּי mở đầu một tình huống điều kiện; תֹאמַר בִּלְבָבְךָ theo nghĩa đen là ‘nói trong lòng’, tức tự nói với mình. ‘Tự nhủ’ diễn đạt tự nhiên thành ngữ nội tâm này. Đại từ số ít trong tiếng Hê-bơ-rơ hướng đến Israel như một cộng đồng; ‘anh em’ giữ cách xưng hô trang trọng, dễ hiểu trong tiếng Việt.
- source_word: רַבִּים הַגּוֹיִם הָאֵלֶּה מִמֶּנִּי
  choice: Các dân tộc này đông hơn ta
  rationale: רַבִּים kết hợp với מִמֶּנִּי tạo ý so sánh về số lượng. ‘Đông hơn ta’ vừa rõ nghĩa vừa giữ ngôi số ít mang tính cộng đồng của nguyên văn.
- source_word: אֵיכָה אוּכַל
  choice: làm sao ta có thể ... được?
  rationale: Cụm từ đặt câu hỏi về khả năng. Kết cấu ‘làm sao ... có thể ... được?’ tự nhiên trong tiếng Việt và truyền đạt nỗi e ngại của câu hỏi.
- source_word: לְהוֹרִישָׁם
  choice: tước đất của họ
  rationale: Dạng Hiphil của ירש trong bối cảnh chiếm hữu đất mang nghĩa làm cho đối phương mất quyền chiếm hữu. ‘Tước đất của họ’ giữ rõ sắc thái về quyền sở hữu hơn cách dịch chung là ‘đuổi họ đi’.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Anh em’ dùng cho người nghe tập thể, còn ‘ta’ trong lời tự nhủ phản ánh hình thức số ít của nguyên văn và Israel được nhìn như một cộng đồng. Dấu chú thích [a] đặt ngay sau câu có từ ngữ cần giải thích.
