  naturalness: “Nếu anh em tự nhủ” và “làm sao ta có thể ... được?” là tiếng Việt hiện đại, trang trọng và tự nhiên. Việc đặt ký hiệu chú thích ngay sau từ/cụm từ được chú giải sẽ rõ ràng hơn so với đặt ở cuối toàn bộ câu.
