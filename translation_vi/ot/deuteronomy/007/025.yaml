base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: vi
  text: x
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּסִילֵי אֱלֹהֵיהֶם
  choice: các tượng chạm của các thần chúng
  rationale: “Tượng chạm” giữ nghĩa cụ thể của פֶּסֶל là hình tượng được chạm, đẽo hoặc tạc, còn cụm sở hữu diễn đạt trực tiếp אֱלֹהֵיהֶם.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: anh em phải thiêu trong lửa
  rationale: Diễn đạt mệnh lệnh số nhiều và giữ cả động từ “thiêu” lẫn phương tiện được nêu rõ là lửa.
- source_word: לֹא תַחְמֹד
  choice: không được tham muốn
  rationale: “Tham muốn” truyền đạt ham muốn chiếm hữu bị cấm, tự nhiên hơn trong tiếng Việt hiện đại mà không làm nhẹ sắc thái đạo đức.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: bạc hay vàng ở trên các tượng ấy
  rationale: “Ở trên” không xác định quá mức đó là đồ gắn vào hay lớp phủ. Trong câu phủ định, “hay” diễn đạt tự nhiên rằng cả bạc lẫn vàng đều không được tham muốn.
- source_word: וְלָקַחְתָּ לָךְ
  choice: mà lấy cho mình
  rationale: Giữ mối liên hệ giữa lòng tham muốn và hành động lấy vật ấy để làm lợi cho chính mình.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: kẻo vì nó anh em mắc bẫy
  rationale: “Mắc bẫy” giữ hình ảnh của căn יקשׁ; “nó” duy trì đại từ số ít và không khóa chặt vật quy chiếu.
- source_word: כִּי תוֹעֲבַת יְהוָה אֱלֹהֶיךָ הוּא
  choice: vì đó là điều ghê tởm đối với Yahweh, Đức Chúa Trời của anh em
  rationale: “Điều ghê tởm” giữ sức nặng của תוֹעֵבָה. “Đó” bảo toàn độ rộng trong vật quy chiếu của הוּא, còn “Yahweh” chuyển tự danh riêng יהוה.
theological_decisions:
- issue: Vật quy chiếu của đại từ הוּא ở cuối câu
  choice: Dùng “đó”, không xác định hẹp điều ghê tởm chỉ là kim loại, tượng chạm hay hành vi lấy chúng.
  alternative: Hiểu đại từ chỉ riêng tượng chạm, hoặc chỉ hành vi lấy bạc vàng.
  rationale: Mạch văn đặt bạc vàng và việc lấy chúng trong toàn bộ bối cảnh thờ thần tượng; cách diễn đạt rộng giữ nguyên sự không xác định của tiếng Hê-bơ-rơ.
- issue: Vật quy chiếu của בּוֹ
  choice: Dùng đại từ số ít “nó” và giữ mở vật quy chiếu.
  alternative: Nói rõ “bởi số bạc vàng ấy” hoặc “bởi tượng thần ấy”.
  rationale: Đại từ Hê-bơ-rơ là số ít và có thể hướng đến vật bị cấm hoặc toàn bộ sự việc liên quan đến tượng thần; không nên giải quyết thay cho nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh em” được dùng cho đối tượng tập thể là dân Israel, đồng thời làm cho sự chuyển đổi giữa ngôi thứ hai số nhiều và số ít trong tiếng Hê-bơ-rơ trở nên tự nhiên trong tiếng Việt. Cấu trúc câu giữ sát tiến trình mệnh lệnh—cấm đoán—cảnh báo—lý do của nguyên văn.
