revisions:
- from: Không phải vì anh em đông hơn mọi dân tộc mà Yahweh đem lòng quyến luyến anh em và chọn anh em[a], vì anh em là dân ít người nhất trong mọi dân tộc.
  to: Không phải vì anh em đông hơn mọi dân tộc mà Yahweh đã đặt lòng yêu mến anh em và chọn anh em[a], vì anh em ít người nhất trong mọi dân tộc.
  rationale: Thay cách diễn đạt có khả năng gợi sắc thái không phù hợp bằng “đặt lòng yêu mến,” vốn vừa tự nhiên vừa phản ánh sát ý tình cảm gắn bó của חָשַׁק. Chỉnh nhẹ mệnh đề cuối để tiếng Việt gọn hơn mà không thay đổi nghĩa hay mức độ so sánh của nguyên văn. Chú thích được điều chỉnh để nêu phương án từ vựng ngắn gọn, tương ứng với cách dịch chính.
  reviewer_model: gpt-5.6-terra
