  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: vi
  text: Không phải vì anh em đông hơn mọi dân tộc mà Yahweh đã đặt lòng yêu mến anh em và chọn anh em[a], vì anh em ít người nhất trong mọi dân tộc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Yahweh yêu mến anh em.” Động từ Hê-bơ-rơ diễn tả sự gắn bó hoặc tình cảm mạnh mẽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: vì anh em đông hơn mọi dân tộc
  rationale: Trong câu phủ định, מִן kết hợp với ý niệm số đông diễn tả căn cứ giả định dựa trên ưu thế về số lượng. Cách dịch này tự nhiên trong tiếng Việt và giữ được phép so sánh với các dân tộc khác.
- source_word: חָשַׁק
  choice: đem lòng quyến luyến
  rationale: Động từ diễn tả sự gắn bó, yêu mến hay hướng tình cảm mạnh mẽ về một đối tượng. “Đem lòng quyến luyến” giữ sắc thái tình cảm và chủ ý, đồng thời chú thích ghi nhận cách dịch quen thuộc hơn là “đem lòng yêu thương”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: וַיִּבְחַר בָּכֶם
  choice: và chọn anh em
  rationale: Dịch trực tiếp động từ בחר, bảo toàn ngôn ngữ về sự lựa chọn trong giao ước mà không thêm diễn giải thần học.
- source_word: כִּי אַתֶּם הַמְעַט מִכָּל הָעַמִּים
  choice: vì anh em là dân ít người nhất trong mọi dân tộc
  rationale: כִּי đưa ra lời giải thích cho mệnh đề phủ định trước đó; הַמְעַט chỉ sự ít ỏi về số lượng. Thêm “dân” theo ngữ cảnh để câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; Chúa
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn đặc tính tên riêng và không thay nó bằng tước hiệu.
- issue: Ý nghĩa thần học của việc Đức Chúa Trời lựa chọn Israel
  choice: chọn anh em
  alternative: tuyển chọn anh em theo một hệ thống giáo lý được diễn giải thêm
  rationale: Bản dịch giữ nguyên lời khẳng định về sự lựa chọn Israel và lời phủ nhận rằng số đông là nguyên nhân, nhưng không đưa các phạm trù thần học hệ thống về sau vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với cộng đồng Israel; giữ “mọi dân tộc” nhằm phản ánh số nhiều עַמִּים và sự đối chiếu giữa các cộng đồng dân tộc.
