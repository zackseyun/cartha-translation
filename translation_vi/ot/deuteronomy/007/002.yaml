  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: vi
  text: Khi Yahweh, Đức Chúa Trời của anh em, phó chúng cho anh em và anh em đánh hạ chúng, anh em phải hoàn toàn biệt riêng chúng cho sự hủy diệt.[a] Anh em không được lập giao ước với chúng, cũng không được ban ân huệ cho chúng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải đặt chúng dưới lệnh diệt tận.” Tiếng Hê-bơ-rơ dùng động từ חרם trong một cấu trúc nhấn mạnh, chỉ việc biệt riêng hoàn toàn cho sự hủy diệt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không được thương xót chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: phó chúng cho anh em
  rationale: Trong bối cảnh quân sự, נתן diễn tả việc trao đối phương vào quyền lực của bên kia. “Phó chúng cho anh em” giữ nguyên tác nhân thần linh mà không thêm hình ảnh “vào tay” vốn không có trực tiếp trong câu này.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự quen dùng, thay vì thay thế bằng một tước hiệu.
- source_word: לְפָנֶיךָ
  choice: cho anh em
  rationale: Cụm từ theo nghĩa đen là “trước mặt anh em”; kết hợp với נתן trong ngữ cảnh này, tiếng Việt tự nhiên diễn đạt là “phó chúng cho anh em”, vẫn truyền đạt việc các dân ấy bị đặt trước quyền lực của Israel.
- source_word: וְהִכִּיתָם
  choice: anh em đánh hạ chúng
  rationale: נכה trong chiến trận có nghĩa đánh bại hoặc đánh ngã. “Đánh hạ” giữ sắc thái bạo lực của hành động quân sự mà vẫn là cách nói hiện đại.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: anh em phải hoàn toàn biệt chúng ra để hủy diệt
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh tính triệt để. חרם không chỉ nói đến tiêu diệt mà còn hàm ý đặt đối tượng vào tình trạng bị biệt riêng theo lệnh cấm để hủy diệt; cách dịch này cố giữ cả sắc thái biệt riêng lẫn kết quả hủy diệt.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: Anh em không được lập giao ước với chúng
  rationale: כרת ברית là thành ngữ chỉ việc thiết lập giao ước. “Lập giao ước” tự nhiên trong tiếng Việt và không thu hẹp ý nghĩa thành một hiệp ước chính trị đơn thuần.
- source_word: וְלֹא תְחָנֵּם
  choice: cũng không được tỏ ân huệ cho chúng
  rationale: חנן chủ yếu chỉ việc ban ân hoặc tỏ đặc ân. “Tỏ ân huệ” phản ánh phạm vi từ vựng trực tiếp hơn “thương xót”, trong khi cách hiểu theo nghĩa thương xót được giữ ở chú thích.
theological_decisions:
- issue: Cách dịch חרם trong bối cảnh chiến tranh thánh
  choice: hoàn toàn biệt chúng ra để hủy diệt
  alternative: hoàn toàn tận diệt chúng; đặt chúng dưới lệnh diệt tận
  rationale: Cách chọn giữ lại cả chiều kích biệt riêng theo lệnh thiêng liêng và tính hủy diệt triệt để, thay vì giản lược từ này thành một hành động quân sự thông thường.
- issue: Cách dịch תְחָנֵּם
  choice: tỏ ân huệ cho chúng
  alternative: thương xót chúng
  rationale: Nghĩa gốc gắn với ân huệ và sự ưu đãi; “thương xót” là cách hiểu hợp ngữ cảnh nhưng hẹp hơn, nên được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “anh em” thể hiện ngôi thứ hai số ít trong tiếng Hê-bơ-rơ đang đại diện cho toàn thể Israel, đồng thời tránh sắc thái cổ của “ngươi”. Các dấu chú thích được đặt ngay sau những cụm từ mà chú thích giải thích.
