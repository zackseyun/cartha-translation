  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָתַ֤ן מַלְכֵי/הֶם֙ בְּ/יָדֶ֔/ךָ וְ/הַאֲבַדְתָּ֣ אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ בְּ/פָנֶ֔י/ךָ עַ֥ד הִשְׁמִֽדְ/ךָ֖ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: vi
  text: Ngài sẽ trao các vua của chúng vào tay anh em; anh em sẽ xóa tên chúng khỏi dưới bầu trời. Không một ai sẽ đứng nổi trước mặt anh em, cho đến khi anh em tiêu diệt chúng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַן
  choice: Ngài sẽ trao
  rationale: Dạng động từ trong mạch lời hứa mang ý nghĩa tương lai; chủ ngữ được hiểu từ văn cảnh là Đức Giê-hô-va. “Ngài” diễn đạt tự nhiên mà vẫn giữ quy chiếu ấy.
- source_word: מַלְכֵיהֶם
  choice: các vua của chúng
  rationale: Danh từ số nhiều kèm hậu tố ngôi ba số nhiều, nghĩa trực tiếp là các vua thuộc về những dân đang được nói đến.
- source_word: בְּיָדֶךָ
  choice: vào tay anh em
  rationale: Giữ hình ảnh Hê-bơ-rơ về việc trao kẻ thù vào quyền kiểm soát của một người. Đại từ số ít trong tiếng Hê-bơ-rơ chỉ Israel như một cộng đồng; “anh em” tự nhiên trong lời Môi-se nói với dân chúng.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: anh em sẽ xóa tên chúng
  rationale: Hiphil của אבד mang sắc thái khiến cho mất đi; với “tên” làm tân ngữ, thành ngữ nói đến việc xóa bỏ dấu tích hoặc sự tưởng nhớ, nên “xóa tên” vừa tự nhiên vừa giữ quan hệ với tân ngữ.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: khỏi dưới trời
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ sự loại bỏ hoàn toàn khỏi thế giới loài người, đồng thời dùng cách nói trang trọng, dễ hiểu trong tiếng Việt.
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  choice: Không một ai có thể đứng vững trước mặt anh em
  rationale: Hitpael của יצב gợi ý đứng vững hoặc giữ vị trí để chống cự. אִישׁ là danh từ số ít giống đực nhưng có nghĩa đại diện; “không một ai” truyền đạt đúng phạm vi phổ quát trong tiếng Việt mà không thêm giới tính không cần thiết.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: cho đến khi anh em tiêu diệt chúng
  rationale: Cấu trúc עַד với động từ nguyên mẫu xác định điểm kết thúc; שׁמד trong bối cảnh chiến tranh Phục Truyền Luật Lệ Ký mang nghĩa hủy diệt hoàn toàn.
theological_decisions:
- issue: Ý nghĩa đại diện của אִישׁ
  choice: Không một ai có thể đứng vững trước mặt anh em
  alternative: Không một người nam nào sẽ đứng trước mặt anh em
  rationale: אִישׁ ở đây là số ít mang nghĩa đại diện, không nhằm giới hạn lời khẳng định vào nam giới. Tiếng Việt tự nhiên diễn đạt phạm vi ấy bằng “không một ai”; cách này giữ nguyên ý nghĩa mà không giải quyết thêm bất kỳ vấn đề thần học nào.
- issue: Mức độ mạnh của שׁמד trong bối cảnh chiến tranh
  choice: tiêu diệt chúng
  alternative: đánh bại chúng
  rationale: “Đánh bại” làm nhẹ nghĩa của שׁמד. “Tiêu diệt” giữ sức nặng của lời phán và không né tránh căng thẳng thần học vốn có trong bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh em” cho đại từ ngôi hai số ít chỉ tập thể Israel, phù hợp với diễn từ của Môi-se. Không thêm chú thích vì “không một ai” đã chuyển tải rõ nghĩa đại diện của אִישׁ; chú thích tiếng Anh được cung cấp cũng có vị trí ký hiệu không khớp với nội dung nên không được sao chép máy móc.
