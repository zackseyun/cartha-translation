revisions:
- from: Ngài sẽ trao các vua của chúng vào tay anh em; anh em sẽ xóa tên chúng khỏi dưới trời. Không một ai có thể đứng vững trước mặt anh em cho đến khi anh em tiêu diệt chúng.
  to: Ngài sẽ trao các vua của chúng vào tay anh em; anh em sẽ xóa tên chúng khỏi dưới bầu trời. Không một ai sẽ đứng nổi trước mặt anh em, cho đến khi anh em tiêu diệt chúng.
  rationale: Chỉnh hai điểm nhỏ để câu văn tự nhiên hơn và bám sát hơn cấu trúc khẳng định tương lai của tiếng Hê-bơ-rơ. Không thêm chú thích, vì «không một ai» đã chuyển đạt chính xác nghĩa khái quát của אִישׁ; bản tiếng Anh đặt ký hiệu chú thích sau «your hand» nhưng nội dung chú thích lại liên quan đến «No man», nên không có neo chú thích đáng sao chép.
