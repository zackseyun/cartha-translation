source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ אֶת כָּל הָֽ/עַמִּ֗ים אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ לֹא תָחֹ֥ס עֵֽינְ/ךָ֖ עֲלֵי/הֶ֑ם וְ/לֹ֤א תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי מוֹקֵ֥שׁ ה֖וּא לָֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: vi
  text: Ngươi phải tiêu diệt tất cả các dân tộc mà Yahweh, Đức Chúa Trời của ngươi, ban cho ngươi.[a] Mắt ngươi không được thương xót họ,[b] và ngươi không được phụng sự các thần của họ, vì điều đó sẽ là một cái bẫy cho ngươi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ăn hết” hoặc “nuốt hết”; ở đây là cách nói về việc đánh bại và tiêu diệt hoàn toàn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ngươi không được tiếc họ.” Nguyên văn: “Mắt ngươi không được thương xót họ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “vì nó là một cái bẫy cho ngươi.” Đại từ “nó” nhiều khả năng chỉ việc phụng sự các thần của họ, nhưng cũng có thể chỉ rộng hơn đến các thần ấy hoặc toàn bộ hoàn cảnh dẫn đến sự thờ thần tượng.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: ngươi phải tiêu diệt
  rationale: Động từ אכל có nghĩa đen là “ăn/nuốt”, nhưng trong ngữ cảnh chiến tranh mang nghĩa thành ngữ là tiêu diệt hoàn toàn. “Tiêu diệt” truyền đạt rõ nghĩa trong tiếng Việt hiện đại; chú thích giữ lại hình ảnh nguyên ngữ.
- source_word: כָּל הָעַמִּים
  choice: tất cả các dân tộc
  rationale: עַמִּים chỉ nhiều cộng đồng dân tộc riêng biệt; “các dân tộc” sát hơn “các nước” trong ngữ cảnh này.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: mà Yahweh, Đức Chúa Trời của ngươi, ban cho ngươi
  rationale: Phân từ נֹתֵן diễn tả hành động đang diễn ra hoặc sắp xảy ra. Tiếng Việt dùng “ban cho” tự nhiên mà không buộc phải đánh dấu thể tiếp diễn; danh Yahweh được phiên âm trực tiếp.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: Mắt ngươi không được thương xót họ
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ về con mắt, đồng thời dùng “thương xót” để câu có thể hiểu được trong tiếng Việt.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: ngươi không được phụng sự các thần của họ
  rationale: עבד khi có các thần làm đối tượng bao hàm sự phục vụ với lòng quy phục và thờ phượng. “Phụng sự” giữ được nghĩa rộng hơn từ “thờ phượng”.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: vì điều đó sẽ là một cái bẫy cho ngươi
  rationale: מוֹקֵשׁ là bẫy hoặc cạm bẫy. “Điều đó” tự nhiên trong tiếng Việt và nhiều khả năng quy về việc phụng sự các thần, nhưng chú thích ghi nhận phạm vi quy chiếu có thể rộng hơn.
theological_decisions:
- issue: Đối tượng quy chiếu của הוּא trong mệnh đề “vì nó/điều đó là một cái bẫy cho ngươi”
  choice: Dùng “điều đó”, gần nhất quy về việc phụng sự các thần của họ.
  alternative: Đại từ có thể quy rộng hơn về các thần ấy, các dân tộc ấy, hoặc toàn bộ hoàn cảnh thờ thần ngoại bang.
  rationale: Mệnh đề ngay trước nói đến việc phụng sự các thần, nên đó là cách hiểu gần nhất. Tuy nhiên, “điều đó” và chú thích vẫn bảo toàn độ mở thật sự của đại từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại; dùng đại từ số ít “ngươi” để phản ánh lời giao ước trực tiếp với Israel như một cộng đồng. Giữ danh riêng Yahweh và hình ảnh “mắt ngươi”, nhưng diễn giải thành ngữ אכל trong chính văn để tránh cách nói “ăn các dân tộc” khó hiểu hoặc gây lệch nghĩa trong tiếng Việt.
