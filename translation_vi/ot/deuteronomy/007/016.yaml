  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: mệnh lệnh/viễn cảnh tiêu diệt toàn bộ các dân, mệnh đề quan hệ nói Yahweh là Đức Chúa Trời đang ban họ cho Israel, thành ngữ về “mắt” không thương xót, lệnh không phụng sự các thần của họ, và hình ảnh “bẫy/cạm bẫy”. “Tiêu diệt” là cách chuyển nghĩa thành ngữ hợp lý của אָכַל trong văn cảnh này; chú thích bảo lưu nghĩa đen và sắc thái “ăn/nuốt”. “Điều đó” trong mệnh đề cuối không đóng chặt quá mức quy chiếu của הוּא, và chú thích nêu các khả năng chính.'
  naturalness: Tiếng Việt rõ ràng, trang trọng và dễ đọc trong văn phong Kinh Thánh hiện đại. Cách xưng hô “ngươi” nhất quán với lời phán trực tiếp số ít mang tính tập thể. “Mắt ngươi không được thương xót họ” hơi sát thành ngữ nhưng vẫn tự nhiên đủ trong ngữ vực Kinh Thánh và giữ được hình ảnh của nguyên văn.
  terminology: “Yahweh, Đức Chúa Trời” nhất quán với quyết định danh thần của dự án. “Các dân tộc,” “phụng sự các thần,” và “cái bẫy” đều phản ánh tốt các từ và hình ảnh nguồn, không áp đặt diễn giải giáo phái. Các chú thích dùng thuật ngữ chính xác và không làm thay đổi nghĩa chính văn.
