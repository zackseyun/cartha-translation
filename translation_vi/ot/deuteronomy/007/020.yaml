revisions:
- from: Hơn nữa, Giê-hô-va Đức Chúa Trời của anh em sẽ sai ong vò vẽ[a] đến giữa chúng, cho đến khi những kẻ còn sót lại và những kẻ ẩn trốn khỏi anh em đều bị diệt vong.
  to: Hơn nữa, Giê-hô-va Đức Chúa Trời của anh em sẽ sai ong vò vẽ[a] đến giữa chúng, cho đến khi những kẻ còn sót lại và những kẻ trốn tránh anh em đều bị tiêu diệt.
  rationale: Chỉnh sửa chỉ nhằm sửa kết hợp từ tiếng Việt không tự nhiên và làm trơn cách diễn đạt về những kẻ lẩn trốn. Nghĩa nguồn, trật tự ý chính, danh riêng, và sự mơ hồ về “ong vò vẽ” đều được giữ nguyên.
