language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: vi
  text: Hơn nữa, Giê-hô-va Đức Chúa Trời của anh em sẽ sai ong vò vẽ[a] đến giữa chúng, cho đến khi những kẻ còn sót lại và những kẻ trốn tránh anh em đều bị tiêu diệt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc có thể hiểu là “nỗi kinh hoàng” hay “sự hoảng loạn”; một số người hiểu “ong vò vẽ” theo nghĩa bóng, chỉ nỗi khiếp sợ do Đức Chúa Trời giáng xuống chứ không phải côn trùng theo nghĩa đen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Hơn nữa
  rationale: Diễn đạt tự nhiên sắc thái bổ sung và nhấn mạnh, nối hành động này với các lời hứa chinh phục ở trước.
- source_word: הַצִּרְעָה
  choice: ong vò vẽ
  rationale: Giữ nghĩa từ vựng trực tiếp của danh từ số ít có mạo từ; trong tiếng Việt, cách gọi này cũng có thể được hiểu theo nghĩa tập hợp.
- source_word: יְשַׁלַּח
  choice: sẽ sai
  rationale: Thể hiện việc Đức Chúa Trời chủ động phái tác nhân này đến; “sai” tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc, rõ ràng và trang trọng trong tiếng Việt để biểu thị Danh Giao Ước.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở hữu trực tiếp; “anh em” phù hợp với lời Môi-se nói với dân Y-sơ-ra-ên như một cộng đồng.
- source_word: בָּם
  choice: đến giữa chúng
  rationale: Giữ sắc thái không gian của giới từ, tức tác nhân được sai vào giữa các kẻ thù.
- source_word: עַד אֲבֹד
  choice: cho đến khi ... đều bị diệt vong
  rationale: Biểu thị điểm kết thúc của hành động mà không xác định quá mức cách thức hủy diệt.
- source_word: הַנִּשְׁאָרִים
  choice: những kẻ còn sót lại
  rationale: Diễn đạt rõ những người sống sót hoặc còn lại sau các cuộc đoán phạt trước đó, không đưa vào sắc thái thần học chuyên biệt của “số sót”.
- source_word: וְהַנִּסְתָּרִים
  choice: và những kẻ ẩn trốn
  rationale: Thể hiện tự nhiên trong tiếng Việt ý những kẻ đang che giấu mình.
- source_word: מִפָּנֶיךָ
  choice: khỏi anh em
  rationale: Truyền đạt thành ngữ “khỏi mặt/sự hiện diện của anh em” bằng tiếng Việt tự nhiên, trong ngữ cảnh chúng lẩn trốn trước bước tiến của Y-sơ-ra-ên.
theological_decisions:
- issue: Cách chuyển dịch Danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh
  rationale: Giữ đây là danh riêng thay vì thay bằng một tước hiệu; dạng “Giê-hô-va” thông dụng và dễ hiểu đối với độc giả tiếng Việt hiện đại.
- issue: Nên hiểu הַצִּרְעָה theo nghĩa đen hay nghĩa bóng
  choice: Nghĩa đen “ong vò vẽ” trong chính văn
  alternative: Nỗi kinh hoàng hoặc sự hoảng loạn do Đức Chúa Trời giáng xuống
  rationale: Nghĩa từ vựng trực tiếp là một loài côn trùng chích; cách hiểu nghĩa bóng có thật nhưng không nên được áp đặt lên chính văn, nên được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai số ít mang tính tập thể khi Môi-se nói với Y-sơ-ra-ên; dùng “chúng/những kẻ” cho các dân thù địch. Giữ cấu trúc tiến đến kết quả cuối cùng của câu Hê-bơ-rơ nhưng tránh lối diễn đạt quá cổ.
