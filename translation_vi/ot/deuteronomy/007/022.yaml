source:
  edition: WLC
  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: vi
  text: Yahweh, Đức Chúa Trời của anh em, sẽ dần dần đuổi các dân tộc này khỏi trước mặt anh em[a]. Anh em sẽ không thể tiêu diệt họ nhanh chóng, kẻo thú hoang[b] sẽ sinh sôi quá nhiều đối với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “từng ít một”; cũng có thể dịch: “sẽ dần dần tước đất của các dân tộc này khỏi trước mặt anh em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “thú vật ngoài đồng” hoặc “thú đồng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: sẽ... đuổi... khỏi
  rationale: Trong ngữ cảnh chiếm hữu lãnh thổ, động từ diễn tả việc khiến các dân tộc phải rời khỏi đất; cách nói này tự nhiên trong tiếng Việt và vẫn giữ sắc thái loại bỏ khỏi địa bàn.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho danh riêng YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: הַגּוֹיִם הָאֵל
  choice: các dân tộc này
  rationale: Giữ cả nghĩa tập thể-chính trị của גּוֹיִם lẫn lực chỉ định của הָאֵל.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt anh em
  rationale: Bảo toàn hình ảnh không gian của thành ngữ Hê-bơ-rơ, chỉ việc bị loại khỏi đường đi và sự hiện diện của Israel.
- source_word: מְעַט מְעָט
  choice: dần dần
  rationale: Chuyển tải rõ ý tiến hành từng ít một bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại; nghĩa sát chữ được nêu ở chú thích.
- source_word: לֹא תוּכַל
  choice: anh em không được
  rationale: 'Trong mạch lời chỉ dẫn, cụm này có thể mang lực thực tiễn gần với sự ngăn cấm: Israel không nên và không được hoàn tất việc ấy quá nhanh. Chú thích ghi nhận nghĩa hình thức là ''không thể''.'
- source_word: כַּלֹּתָם
  choice: tiêu diệt họ
  rationale: Động từ mang nghĩa đưa họ đến chỗ chấm dứt hoàn toàn; 'tiêu diệt' trang trọng, trực tiếp và phù hợp văn cảnh.
- source_word: מַהֵר
  choice: nhanh chóng
  rationale: Diễn đạt tự nhiên giá trị trạng từ chỉ tốc độ.
- source_word: פֶּן
  choice: kẻo
  rationale: '''Kẻo'' gọn và tự nhiên, giữ sắc thái cảnh báo về hậu quả cần tránh.'
- source_word: תִּרְבֶּה
  choice: sinh sôi quá nhiều
  rationale: Diễn đạt sự gia tăng số lượng đến mức nguy hiểm trong văn cảnh.
- source_word: חַיַּת הַשָּׂדֶה
  choice: thú đồng
  rationale: Giữ hình ảnh 'thú vật ngoài đồng/nơi hoang' của nguyên văn; trong văn cảnh đây là các loài thú hoang.
- source_word: עָלֶיךָ
  choice: gây hại cho anh em
  rationale: Làm rõ quan hệ bất lợi, có tính đe dọa, của việc thú đồng gia tăng đối với Israel mà không chỉ dịch trung tính là 'đối với'.
theological_decisions:
- issue: Cách thể hiện danh YHWH
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Bản dịch giữ danh riêng thay vì thay bằng tước hiệu; 'Giê-hô-va' là dạng Việt hóa quen thuộc, dù 'Yahweh' gần với cách phục nguyên học thuật hiện nay hơn.
- issue: Lực ngữ khí của לֹא תוּכַל
  choice: không được
  alternative: không thể
  rationale: Ngữ cảnh giải thích vì sao Israel không nên tiêu diệt các dân nhanh chóng, nên cách dịch mang sắc thái quy định là tự nhiên. Tuy vậy, hình thức Hê-bơ-rơ nói 'không thể/không có khả năng', vì thế giữ phương án này trong chú thích để không xóa sự căng thẳng ngữ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' như đại từ số nhiều chỉ Israel; đặt mọi dấu chú thích ngay sau phần văn bản liên quan. Bản dịch ưu tiên tương đương tối ưu, đồng thời chú thích những chỗ nguyên văn cho phép hơn một cách hiểu.
