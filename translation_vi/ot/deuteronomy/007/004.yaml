id: DEU.7.4
reference: Deuteronomy 7:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: vi
  text: Vì người ấy sẽ khiến con trai anh em không còn theo Ta[a], rồi họ sẽ phụng thờ các thần khác[b]. Khi ấy, cơn giận của Yahweh[c] sẽ bùng cháy chống lại anh em, và Ngài sẽ nhanh chóng tiêu diệt anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “khỏi đằng sau Ta,” một thành ngữ chỉ việc không còn đi theo Ta.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ chuyển từ số ít (“con trai anh em”) sang số nhiều (“họ sẽ phụng thờ”); số nhiều có thể mở rộng lời cảnh báo đến gia đình, dòng dõi hoặc cộng đồng phát sinh từ cuộc hôn nhân ấy.
    reason: alternative_reading
  - marker: c
    text: “Yahweh” là cách phiên âm danh יהוה (YHWH) của Đức Chúa Trời; một số bản dịch dùng “ĐỨC CHÚA.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lý do cho lệnh cấm kết hôn trong câu trước và giữ rõ quan hệ giải thích.
- source_word: יָסִיר
  choice: sẽ khiến ... lìa bỏ
  rationale: Dạng Hiphil mang nghĩa gây khiến; cách dịch này diễn đạt tự nhiên việc một người làm cho người khác quay khỏi lòng trung thành với Đức Chúa Trời.
- source_word: בִּנְךָ
  choice: con trai anh em
  rationale: Giữ danh từ giống đực số ít của tiếng Hê-bơ-rơ trong lời nói hướng đến cộng đồng, thay vì khái quát hóa thành “con cái”.
- source_word: מֵאַחֲרַי
  choice: lìa bỏ việc theo Ta
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ có nghĩa đen là “khỏi đằng sau Ta,” tức không còn đi theo hay trung thành với Đức Chúa Trời.
- source_word: וְעָבְדוּ
  choice: rồi họ sẽ phụng thờ
  rationale: Giữ động từ số nhiều của bản Hê-bơ-rơ, không làm phẳng sự chuyển đổi từ “con trai” số ít sang chủ thể số nhiều.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: Cách dịch trực tiếp, rõ ràng, giữ sự tương phản với lòng trung thành độc nhất dành cho Yahweh.
- source_word: וְחָרָה אַף יְהוָה
  choice: cơn giận của Yahweh sẽ bùng cháy
  rationale: Giữ hình ảnh sinh động của thành ngữ Hê-bơ-rơ về cơn giận cháy lên, đồng thời dùng cấu trúc tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בָּכֶם
  choice: chống lại anh em
  rationale: Trong thành ngữ về cơn giận, giới từ chỉ đối tượng mà cơn giận hướng đến.
- source_word: וְהִשְׁמִידְךָ
  choice: Ngài sẽ ... tiêu diệt anh em
  rationale: Truyền đạt sức nặng của động từ Hiphil שׁמד bằng cách nói trang trọng, rõ ràng; “Ngài” làm sáng chủ thể là Yahweh.
- source_word: מַהֵר
  choice: nhanh chóng
  rationale: Giữ ý phán xét xảy đến mau lẹ và tính khẩn cấp của lời cảnh báo.
theological_decisions:
- issue: Chủ thể số ít gây cho con trai lìa bỏ Yahweh
  choice: người ấy
  alternative: người đàn ông ngoại bang ấy hoặc người phối ngẫu ngoại bang ấy
  rationale: Động từ tiếng Hê-bơ-rơ ở giống đực số ít, nhưng đối tượng cụ thể trong bối cảnh có thể được hiểu theo nhiều cách. “Người ấy” giữ giới tính ngữ pháp mà không xác định quá mức danh tính.
- issue: Sự chuyển đổi từ số ít sang số nhiều
  choice: giữ “con trai” số ít và “họ sẽ phụng thờ” số nhiều
  alternative: đồng nhất thành “người ấy sẽ phụng thờ” hoặc “con trai anh em sẽ phụng thờ”
  rationale: Bản Hê-bơ-rơ thực sự chuyển từ số ít sang số nhiều; bản dịch giữ nguyên sức căng này để lời cảnh báo có thể bao quát hậu quả rộng hơn trong gia đình hoặc cộng đồng.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA hoặc Giê-hô-va
  rationale: Dùng phiên âm danh riêng để phân biệt danh giao ước với tước hiệu, không gắn bản dịch với cách gọi riêng của một hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng như lối xưng hô với cộng đồng giao ước; “phụng thờ” giữ sắc thái tôn giáo của עבד. Bản dịch tránh lối nói quá cổ như “ngươi/các ngươi,” đồng thời giữ sự chuyển đổi số đáng chú ý trong nguyên văn.
