  terminology: «Yahweh», «các thần khác», «phụng thờ», «cơn giận», và «tiêu diệt» đều phù hợp. Cách xưng hô «anh em» nhất quán với lời ngỏ cùng cộng đồng và không che khuất số ít của «con trai».
