revisions:
- from: Vì người ấy sẽ khiến con trai anh em lìa bỏ việc theo Ta[a], rồi họ sẽ phụng thờ các thần khác[b]. Khi ấy, cơn giận của Yahweh[c] sẽ bùng cháy chống lại anh em, và Ngài sẽ nhanh chóng tiêu diệt anh em.
  to: Vì người ấy sẽ khiến con trai anh em không còn theo Ta[a], rồi họ sẽ phụng thờ các thần khác[b]. Khi ấy, cơn giận của Yahweh[c] sẽ bùng cháy chống lại anh em, và Ngài sẽ nhanh chóng tiêu diệt anh em.
  rationale: Chỉ thay «lìa bỏ việc theo Ta» bằng «không còn theo Ta» để có tiếng Việt hiện đại và tự nhiên hơn, đồng thời giữ nguyên ý thành ngữ Hê-bơ-rơ, các số ngữ pháp, quan hệ nhân quả, và toàn bộ hệ thống chú thích.
  reviewer_model: gpt-5.6-terra
