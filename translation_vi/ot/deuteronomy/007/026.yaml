revisions:
- from: Anh em không được đem vật ghê tởm vào nhà mình; nếu không, anh em cũng sẽ trở thành vật bị biệt riêng để tiêu diệt[a] như nó. Anh em phải hoàn toàn ghê tởm và hoàn toàn kinh tởm nó, vì nó là vật bị biệt riêng để tiêu diệt.
  to: Anh em không được đem vật ghê tởm vào nhà mình, kẻo anh em cũng sẽ bị dành cho sự hủy diệt như nó. Anh em phải hoàn toàn ghê tởm nó và hoàn toàn kinh tởm nó, vì nó là vật bị dành cho sự hủy diệt[a].
  rationale: Bản sửa thay “nếu không” bằng “kẻo” để diễn đạt đúng lời cảnh báo hậu quả; không gọi người nghe là “vật”; và dùng “bị dành cho sự hủy diệt” nhất quán cho חֵרֶם. Hai động từ song hành và sức nhấn của nguyên thể tuyệt đối được giữ bằng “phải hoàn toàn ... và hoàn toàn ...”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:06:32Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lệnh cấm, hậu quả trở nên חֵרֶם như vật ấy, hai mệnh lệnh nhấn mạnh song hành, và mệnh đề nguyên nhân. Tuy nhiên, dịch người nghe là “trở thành vật bị...” thêm danh từ “vật” không có trong tiếng Hê-bơ-rơ và không tự nhiên khi áp dụng cho con người.
  naturalness: '“Nếu không” tạo quan hệ điều kiện không đúng ý câu: câu không nói “nếu không đem vào” mà cảnh báo hậu quả của việc đem vào. “Kẻo” diễn đạt tự nhiên quan hệ cảnh báo/hậu quả. “Bị dành cho sự hủy diệt” tự nhiên hơn “bị biệt riêng để tiêu diệt,” đồng thời vẫn giữ ý חֵרֶם.'
  terminology: Giữ nhất quán חֵרֶם là “bị dành cho sự hủy diệt”; khi quy chiếu vật, dùng “vật bị dành cho sự hủy diệt.” Chú thích nêu các phương án “ở dưới lệnh cấm” và truyền thống “bị nguyền rủa,” cùng ý phán xét thần linh. “Vật ghê tởm,” “ghê tởm,” và “kinh tởm” phù hợp ngữ cảnh thờ hình tượng và giữ cặp động từ Hê-bơ-rơ.
  issues:
  - severity: medium
    issue: “nếu không” không biểu đạt đúng quan hệ cú pháp và ý cảnh báo của câu.
    rationale: Cụm này thường nghĩa là “if not/otherwise”; ở đây hậu quả xảy ra nếu người nghe đem vật ghê tởm vào nhà. “Kẻo” nối trực tiếp lệnh cấm với hậu quả cần tránh.
  - severity: medium
    issue: “anh em cũng sẽ trở thành vật bị biệt riêng để tiêu diệt” gọi con người là “vật.”
    rationale: חֵרֶם là vị ngữ chỉ tình trạng, không có danh từ “vật” ở vế nói về người. Bỏ “vật” tránh thêm nghĩa và giúp tiếng Việt tự nhiên hơn.
  - severity: low
    issue: “bị biệt riêng để tiêu diệt” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Bị dành cho sự hủy diệt” giữ ý một đối tượng được đặt dưới phán xét để hủy diệt và phù hợp hơn với cách nói hiện đại.
  revised_text: Anh em không được đem vật ghê tởm vào nhà mình, kẻo anh em cũng sẽ bị dành cho sự hủy diệt như nó. Anh em phải hoàn toàn ghê tởm nó và hoàn toàn kinh tởm nó, vì nó là vật bị dành cho sự hủy diệt[a].
