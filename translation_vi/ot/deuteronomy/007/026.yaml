  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: vi
  text: Anh em không được đem vật ghê tởm vào nhà mình, kẻo anh em cũng sẽ bị dành cho sự hủy diệt như nó. Anh em phải hoàn toàn ghê tởm nó và hoàn toàn kinh tởm nó, vì nó là vật bị dành cho sự hủy diệt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vật ở dưới lệnh cấm” hoặc, theo cách dịch truyền thống, là “vật bị nguyền rủa.” Từ Hê-bơ-rơ chỉ một vật bị dành cho sự hủy diệt dưới sự phán xét của Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבִיא
  choice: đem ... vào
  rationale: Dạng Hiphil của בוא diễn tả việc khiến một vật đi vào; “đem ... vào” tự nhiên và giữ rõ hướng chuyển động vào nhà.
- source_word: תּוֹעֵבָה
  choice: vật ghê tởm
  rationale: Trong Phục Truyền Luật Lệ Ký, từ này thường chỉ vật đáng ghê tởm về phương diện giao ước, đặc biệt là vật liên quan đến thần tượng. Cách dịch này mạnh nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: בֵּיתֶךָ
  choice: nhà mình
  rationale: Giữ hình ảnh cụ thể của ngôi nhà và phạm vi sinh hoạt gia đình; “mình” phù hợp với cách xưng hô tập thể “anh em” trong lời nói trực tiếp với Israel.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: nếu không, anh em cũng sẽ trở thành vật bị biệt riêng để tiêu diệt như nó
  rationale: Liên từ được diễn đạt theo ý hậu quả/cảnh báo. Cụm “bị biệt riêng để tiêu diệt” giữ ý một vật bị đặt dưới phán xét để hủy diệt, thay vì chỉ mang nghĩa bị nguyền rủa.
- source_word: חֵרֶם
  choice: vật bị biệt riêng để tiêu diệt
  rationale: Cách dịch diễn đạt cả ý bị dành riêng và mục đích hủy diệt dưới sự phán xét của Đức Chúa Trời; rõ nghĩa hơn lối nói “ở dưới lệnh cấm” và đầy đủ hơn “bị nguyền rủa”.
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: phải hoàn toàn ghê tởm ... nó
  rationale: Trạng từ “hoàn toàn” chuyển tải sức nhấn của động từ nguyên thể tuyệt đối đi với động từ hữu hạn.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: và hoàn toàn kinh tởm nó
  rationale: Giữ một cách diễn đạt thứ hai song song với “ghê tởm,” không nhập hai động từ Hê-bơ-rơ thành một, đồng thời thể hiện cấu trúc nhấn mạnh.
- source_word: כִּי חֵרֶם הוּא
  choice: vì nó là vật bị biệt riêng để tiêu diệt
  rationale: Mệnh đề nguyên nhân giải thích lý do phải ghê tởm vật ấy; lặp lại cùng cách dịch חֵרֶם để giữ mối liên kết từ vựng trong câu.
theological_decisions:
- issue: Cách dịch חֵרֶם trong bối cảnh phán xét theo giao ước
  choice: vật bị biệt riêng để tiêu diệt
  alternative: vật bị nguyền rủa; vật ở dưới lệnh cấm
  rationale: חֵרֶם không chỉ nói đến lời nguyền hay điều cấm kỵ, mà đến tình trạng một vật bị dành cho sự hủy diệt dưới phán xét của Đức Chúa Trời. Cách dịch đã chọn giữ được nội dung thần học ấy mà không gắn với cách giải thích riêng của một hệ phái.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện lời xưng hô với Israel như một cộng đồng, dù đại từ và động từ trong tiếng Hê-bơ-rơ ở số ít giống đực. Dấu chấm phẩy làm rõ quan hệ giữa lệnh cấm và hậu quả. Hai cụm “hoàn toàn ghê tởm” và “hoàn toàn kinh tởm” giữ phép song hành cùng sức nhấn của nguyên văn.
