  source_fidelity: 'Bản dịch phản ánh đúng lệnh cấm kết lập quan hệ hôn nhân với các dân vừa nêu và giữ cấu trúc hai chiều: không gả con gái mình cho con trai họ, cũng không cưới con gái họ cho con trai mình. Đại từ số nhiều “họ” là cách quy chiếu tự nhiên trong tiếng Việt đến nhóm dân ở văn cảnh trước, dù hậu tố tiếng Hê-bơ-rơ có hình thức số ít phân phối.'
  naturalness: “Kết thông gia” phù hợp với sắc thái liên minh hôn nhân của Hitpael חתן và với văn phong luật pháp. Tuy nhiên, cách ngắt “con gái họ, ngươi không được cưới cho...” làm câu thứ hai hơi nặng và “cưới cho” dễ bị chững nghĩa khi tách khỏi tân ngữ. Đảo lại theo trật tự động từ–tân ngữ giúp câu hiện đại, rõ và đối xứng hơn.
  terminology: Giữ “ngươi”, “con gái”, và “con trai” là thích hợp với diễn ngôn pháp lý trang trọng và các thuật ngữ thân thuộc có giới tính, số ít trong nguyên văn. “Gả” và “cưới ... cho con trai” diễn đạt đúng hai hành vi thu xếp hôn nhân trong tiếng Việt mà không mở rộng phạm vi lệnh cấm.
