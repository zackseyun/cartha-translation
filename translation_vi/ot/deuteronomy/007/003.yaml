source:
  edition: WLC
  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: vi
  text: 'Ngươi không được kết thông gia với họ: không được gả con gái ngươi cho con trai họ, cũng không được cưới con gái họ cho con trai ngươi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: kết thông gia
  rationale: Dạng Hitpael diễn tả việc thiết lập quan hệ hôn nhân giữa các gia đình hoặc cộng đồng. “Kết thông gia” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái tương hỗ và xã hội của từ.
- source_word: בָּם
  choice: với họ
  rationale: Đại từ số nhiều chỉ về các dân đã được nêu trong văn cảnh trước; “với họ” phù hợp với cách nói “kết thông gia”.
- source_word: בִּתְּךָ
  choice: con gái ngươi
  rationale: Giữ nguyên danh từ giống cái số ít cùng hậu tố ngôi thứ hai giống đực số ít.
- source_word: תִתֵּן
  choice: gả
  rationale: Nghĩa từ vựng cơ bản là “trao/đưa”, nhưng trong cấu trúc nói về cha trao con gái cho một người nam, “gả” là cách diễn đạt tiếng Việt tự nhiên và chính xác, không cần thêm “làm vợ”.
- source_word: לִבְנוֹ
  choice: cho con trai họ
  rationale: Giới từ ל đánh dấu đối tượng tiếp nhận. Đại từ tiếng Hê-bơ-rơ ở số ít, nhưng quy chiếu phân phối đến các dân được nhắc tới; tiếng Việt dùng “họ” tự nhiên và không áp đặt một cá nhân cụ thể.
- source_word: וּבִתּוֹ
  choice: con gái họ
  rationale: Dịch trực tiếp danh từ “con gái” với hậu tố ngôi thứ ba; “họ” nối rõ với đối tượng tập thể trong văn cảnh.
- source_word: תִקַּח
  choice: cưới cho
  rationale: Động từ cơ bản là “lấy/nhận”, nhưng trong văn cảnh người cha thu xếp hôn nhân cho con trai, “cưới cho” truyền đạt tự nhiên hành động nhận người nữ làm vợ cho con.
- source_word: לִבְנֶךָ
  choice: cho con trai ngươi
  rationale: Giữ danh từ giống đực số ít và quan hệ do giới từ ל biểu thị.
theological_decisions:
- issue: Phạm vi của lệnh cấm
  choice: Giữ đại từ “họ”, chỉ về các dân đã được nêu trong văn cảnh liền trước, và không thêm lý do của câu kế tiếp.
  alternative: Diễn đạt thành lệnh cấm chung đối với mọi cuộc hôn nhân với người ngoại quốc.
  rationale: Bản Hê-bơ-rơ giới hạn phát biểu bằng בָּם, “với họ”. Bản dịch không mở rộng lệnh cấm vượt quá đối tượng được văn cảnh xác định.
- issue: Các từ thân thuộc có giới tính
  choice: Giữ “con gái” và “con trai” ở số ít theo công thức pháp lý của nguyên văn.
  alternative: Dùng cách gọi trung tính hoặc số nhiều như “con cái”.
  rationale: Nguyên văn dùng những danh từ thân thuộc xác định giới tính và số ít; trung tính hóa sẽ làm mất cấu trúc đối xứng của điều luật.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “ngươi” để giữ cách xưng hô số ít trực tiếp của bản Hê-bơ-rơ; dùng “kết thông gia” thay vì cách dịch cứng “lập hôn nhân”. Hai vế sau được sắp theo cấu trúc đối xứng nhằm phản ánh nhịp điệu của nguyên văn.
