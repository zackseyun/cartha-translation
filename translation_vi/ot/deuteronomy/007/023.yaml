  rationale: Chỉ sửa cách diễn đạt về sự hoảng loạn để phản ánh tự nhiên hơn động từ המם và danh ngữ מְהוּמָה גְדֹלָה, không thay đổi ý nghĩa hay mức độ của ngôn ngữ chiến trận. Các chú thích vẫn neo đúng tại những cụm có phương án từ vựng khác.
