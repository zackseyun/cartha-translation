source:
  edition: WLC
  text: וּ/נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנֶ֑י/ךָ וְ/הָמָ/ם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: vi
  text: Nhưng Yahweh, Đức Chúa Trời của anh em, sẽ trao chúng vào tay anh em[a] và gây cho chúng một cơn hoảng loạn lớn[b], cho đến khi chúng bị tiêu diệt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “trước mặt anh em.” Trong ngữ cảnh này, cụm từ có nghĩa là Yahweh trao quân thù vào quyền của Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một sự hỗn loạn lớn” hoặc “một cuộc náo động lớn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: sẽ trao chúng vào tay
  rationale: Trong ngữ cảnh chiến trận, נתן kết hợp với tân ngữ và לְפָנֶיךָ diễn tả việc đặt quân thù dưới quyền đối phương; cách nói này tự nhiên trong tiếng Việt và giữ rõ sắc thái quân sự.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Dạng sở hữu ngôi thứ hai giống đực số ít; trong diễn ngôn Phục Truyền Luật Lệ Ký, tiếng Việt dùng “anh em” để chỉ tập thể Israel được nói với như một đơn vị.
- source_word: לְפָנֶיךָ
  choice: vào tay anh em
  rationale: Nghĩa đen là “trước mặt anh em”, nhưng cùng với נתן trong bối cảnh này mang nghĩa trao quân thù vào quyền của Israel; nghĩa đen được ghi ở chú thích.
- source_word: וְהָמָם
  choice: khiến chúng ... hoảng loạn
  rationale: Động từ המם có sắc thái gây kinh hoàng, rối loạn hoặc tan tác trong chiến trận; “khiến ... hoảng loạn” giữ lực gây khiến và hợp với danh từ theo sau.
- source_word: מְהוּמָה גְדֹלָה
  choice: vô cùng hoảng loạn
  rationale: מְהוּמָה có thể chỉ sự hoảng loạn, hỗn loạn hoặc náo động; cách dịch này tự nhiên và giữ sắc thái tâm lý lẫn tình trạng rối loạn trong chiến trận.
- source_word: עַד הִשָּׁמְדָם
  choice: cho đến khi chúng bị tiêu diệt
  rationale: עַד với động từ nguyên mẫu có hậu tố diễn tả điểm kết thúc của hành động; thể bị động tiếng Việt truyền đạt rõ kết quả bị hủy diệt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời YHWH
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh יְהוָה; giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của sự hủy diệt
  choice: cho đến khi chúng bị tiêu diệt
  alternative: cho đến khi chúng diệt vong
  rationale: Nguyên văn có thể được diễn đạt theo hướng kết quả bị tiêu diệt; cách dịch đã chọn không bổ sung chủ thể tác động và giữ nguyên sự căng thẳng của ngôn ngữ chiến trận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai giống đực số ít hướng đến Israel với tư cách cộng đồng; tránh lối nói cổ, đồng thời giữ danh riêng Yahweh và cường độ của ngôn ngữ chiến trận.
