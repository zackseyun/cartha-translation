  source_fidelity: Bản dịch chuyển đạt đầy đủ cấu trúc đối lập của כִּי אִם và chuỗi bốn mệnh lệnh trong nguyên văn. Các động từ “phá đổ,” “đập tan,” “chặt bỏ,” và “thiêu ... trong lửa” tương ứng sát với các động từ Hê-bơ-rơ và giữ lực mệnh lệnh. “Trụ đá thờ” phản ánh hợp lý מַצֵּבֹת trong ngữ cảnh thờ cúng; “cột A-sê-ra” cùng chú thích bảo lưu tính không hoàn toàn chắc chắn của đối tượng אֲשֵׁרִים.
