source:
  edition: WLC
  text: כִּֽי אִם כֹּ֤ה תַעֲשׂוּ֙ לָ/הֶ֔ם מִזְבְּחֹתֵי/הֶ֣ם תִּתֹּ֔צוּ וּ/מַצֵּבֹתָ֖/ם תְּשַׁבֵּ֑רוּ וַ/אֲשֵֽׁירֵ/הֶם֙ תְּגַדֵּע֔וּ/ן וּ/פְסִילֵי/הֶ֖ם תִּשְׂרְפ֥וּ/ן בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: vi
  text: 'Nhưng anh em phải làm thế này với chúng: phá đổ các bàn thờ của chúng, đập tan các trụ đá thờ[a], chặt bỏ các cột A-sê-ra[b], và thiêu các tượng chạm[c] của chúng trong lửa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các trụ thờ” hoặc “các phiến đá dựng đứng”.
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: A-sê-rim; có lẽ là những vật thờ bằng gỗ gắn với nữ thần A-sê-ra.'
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “các thần tượng”; từ Hê-bơ-rơ nói cụ thể hơn đến những tượng được chạm khắc.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Nhưng
  rationale: Cụm từ này nêu sự tương phản mạnh với mệnh lệnh ngay trước đó; “Nhưng” chuyển tải tự nhiên sắc thái đối lập trong tiếng Việt.
- source_word: כֹּה תַעֲשׂוּ לָהֶם
  choice: anh em phải làm thế này với chúng
  rationale: “Thế này” hướng tới danh sách hành động theo sau; “phải” thể hiện lực mệnh lệnh của thể vị hoàn thành trong ngữ cảnh luật lệ, còn “anh em” giữ địa chỉ số nhiều dành cho cộng đồng Israel.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: phá đổ các bàn thờ của chúng
  rationale: Động từ נתץ chỉ việc kéo sập hoặc phá hủy một công trình; “phá đổ” vừa cụ thể vừa tự nhiên khi nói về bàn thờ.
- source_word: מַצֵּבֹתָם
  choice: các trụ đá thờ của chúng
  rationale: מַצֵּבָה là những khối đá hay trụ đá dựng đứng có chức năng thờ cúng. “Trụ đá thờ” diễn đạt rõ đối tượng và công dụng mà không đồng nhất chúng một cách chung chung với mọi thần tượng.
- source_word: תְּשַׁבֵּרוּ
  choice: đập tan
  rationale: Dạng Piel nhấn mạnh hành động phá vỡ mạnh mẽ; “đập tan” giữ được cường độ ấy.
- source_word: אֲשֵׁירֵיהֶם
  choice: các cột A-sê-ra của chúng
  rationale: Từ số nhiều אֲשֵׁרִים chỉ các vật thờ gắn với nữ thần A-sê-ra, có lẽ bằng gỗ. “Cột A-sê-ra” giữ tên riêng và giúp độc giả hình dung loại vật thờ, trong khi chú thích bảo lưu mức độ bất định về hình dạng chính xác.
- source_word: תְּגַדֵּעוּן
  choice: chặt bỏ
  rationale: גדע diễn tả việc chặt đứt hoặc đốn xuống, đặc biệt phù hợp với vật bằng gỗ; “chặt bỏ” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: פְסִילֵיהֶם
  choice: các tượng chạm của chúng
  rationale: פֶּסֶל là tượng hay hình được tạo bằng cách chạm khắc. “Tượng chạm” giữ nghĩa cụ thể hơn từ khái quát “thần tượng” và tránh lối diễn đạt cổ.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: thiêu ... trong lửa
  rationale: Bản Hê-bơ-rơ nói rõ phương tiện hay phạm vi là lửa. Cách diễn đạt này bảo toàn chi tiết ấy và vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Hiểu אֲשֵׁרִים là vật thờ cụ thể hay thuật ngữ chung chỉ thần tượng
  choice: các cột A-sê-ra
  alternative: các vật thờ A-sê-ra; các A-sê-rim; các thần tượng
  rationale: Câu này phân biệt nhiều loại vật dụng thờ cúng của Ca-na-an. Giữ tên A-sê-ra tránh san phẳng một đối tượng tôn giáo-lịch sử cụ thể thành khái niệm thần tượng nói chung; chú thích thừa nhận rằng hình dạng chính xác của vật này không hoàn toàn chắc chắn.
- issue: Mức độ mạnh của mệnh lệnh phá hủy các nơi và vật thờ
  choice: Dùng “phải” cùng các động từ trực tiếp “phá đổ”, “đập tan”, “chặt bỏ”, “thiêu”
  alternative: Diễn đạt nhẹ hơn như “loại bỏ” hoặc “dẹp đi”
  rationale: Nguyên văn gồm những mệnh lệnh cụ thể và mạnh. Bản dịch không làm nhẹ mức độ nghiêm khắc, nhưng cũng không thêm lời biện minh thần học ngoài câu Kinh Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện lời nói với cộng đồng Israel ở số nhiều mà không dùng đại từ cổ “các ngươi”. Cấu trúc liệt kê và các động từ mạnh bám sát nhịp điệu mệnh lệnh của nguyên văn.
