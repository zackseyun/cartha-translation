  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: vi
  text: Khi Yahweh, Đức Chúa Trời của anh em, đưa anh em vào miền đất mà anh em sắp tiến vào để chiếm hữu, và Ngài xua đuổi[a] khỏi trước mặt anh em nhiều dân tộc—người Hê-tít, người Ghi-rê-ga-sít, người A-mô-rít, người Ca-na-an, người Phê-rê-sít, người Hê-vít và người Giê-bu-sít—tức bảy dân tộc đông hơn và hùng mạnh hơn anh em[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tước quyền sở hữu của nhiều dân tộc khỏi trước mặt anh em.”'
    reason: Động từ נשל có thể nhấn mạnh việc các dân bị đẩy đi hoặc bị mất quyền chiếm hữu đất.
  - marker: b
    text: 'Cũng có thể dịch: “nhiều hơn và mạnh hơn anh em.”'
    reason: רַבִּים có thể nhấn mạnh số lượng; trong cấu trúc so sánh này, “nhiều hơn” là phương án sát nghĩa. עֲצוּמִים chỉ sức mạnh vượt trội.
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Ở đây כִּי mở đầu hoàn cảnh dẫn đến các mệnh lệnh theo sau; nghĩa thời gian “khi” phù hợp hơn nghĩa nguyên nhân hoặc điều kiện.
- source_word: יְבִיאֲךָ
  choice: đưa anh em vào
  rationale: Dạng Hiphil của בוא diễn tả việc khiến một người đi vào nơi nào; “đưa ... vào” tự nhiên và vẫn giữ sắc thái gây khiến.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt trực tiếp quan hệ sở hữu/ngôi thứ hai số ít tập thể; “anh em” phù hợp cách Môi-se nói với toàn dân Israel.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Chỉ lãnh thổ mà Israel sắp nhận; “miền đất” tự nhiên trong tiếng Việt và giữ trọng tâm địa lý của דברים.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: mà anh em sắp tiến vào
  rationale: Phân từ בָא trong ngữ cảnh nói về việc Israel sắp đi vào đất ấy; tiếng Việt không cần dịch riêng שָׁמָּה là “đến đó”.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: ירשׁ có thể mang nghĩa chiếm lấy, sở hữu hoặc nhận làm cơ nghiệp; “chiếm hữu” giữ được tính chủ động trong bối cảnh này.
- source_word: וְנָשַׁל
  choice: và Ngài xua đuổi
  rationale: Động từ diễn tả việc khiến các dân bị dời khỏi đất hoặc mất quyền sở hữu; “xua đuổi” là cách nói rõ và tự nhiên.
- source_word: גּוֹיִם רַבִּים
  choice: nhiều dân tộc
  rationale: גּוֹיִם ở đây chỉ các cộng đồng dân tộc riêng biệt cư trú tại Ca-na-an.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt anh em
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về việc loại bỏ các dân khỏi sự hiện diện và đường tiến của Israel.
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: người Hê-tít, người Ghi-rê-ga-sít, người A-mô-rít, người Ca-na-an, người Phê-rê-sít, người Hê-vít và người Giê-bu-sít
  rationale: Dùng các dạng phiên âm tiếng Việt dễ đọc; các danh từ chỉ dân ở số ít trong tiếng Hê-bơ-rơ được hiểu theo nghĩa tập thể.
- source_word: שִׁבְעָה גוֹיִם רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: bảy dân tộc đông hơn và hùng mạnh hơn anh em
  rationale: Trong cấu trúc so sánh với מִן, רַבִּים tự nhiên mang nghĩa “đông hơn”; עֲצוּמִים nói đến sức mạnh vượt trội.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời. Giữ “Yahweh” phân biệt danh này với tước hiệu và tránh thay thế bằng một truyền thống giáo phái riêng.
- issue: Chủ thể của hành động xua đuổi
  choice: Nêu rõ “Ngài” để chỉ Yahweh
  alternative: Lược bỏ chủ ngữ trong vế thứ hai
  rationale: Động từ וְנָשַׁל tiếp tục có Yahweh làm chủ thể. Việc nhắc “Ngài” giúp câu tiếng Việt rõ nghĩa mà không thay đổi nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” diễn đạt ngôi thứ hai giống đực số ít dùng theo nghĩa tập thể để chỉ toàn dân Israel. Câu kết bằng dấu phẩy vì câu Hê-bơ-rơ tiếp tục sang mệnh đề và các mệnh lệnh ở câu 2. Dấu chú thích [a] được đặt ngay sau “xua đuổi”, là từ mà chú thích thực sự giải nghĩa; vị trí [a] sau “possess” trong lớp tham khảo tiếng Anh không phù hợp với nội dung chú thích.
