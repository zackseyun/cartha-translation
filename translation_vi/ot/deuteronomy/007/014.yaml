source:
  edition: WLC
  text: בָּר֥וּךְ תִּֽהְיֶ֖ה מִ/כָּל הָ/עַמִּ֑ים לֹא יִהְיֶ֥ה בְ/ךָ֛ עָקָ֥ר וַֽ/עֲקָרָ֖ה וּ/בִ/בְהֶמְתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: vi
  text: Ngươi sẽ được phước hơn mọi dân tộc[a]. Giữa ngươi sẽ không có người nam hay người nữ nào son sẻ[b], cũng không có con nào son sẻ trong đàn gia súc ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được phước vượt trên mọi dân tộc.” Giới từ Hê-bơ-rơ ở đây biểu thị sự so sánh.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ dùng rõ cả dạng giống đực lẫn dạng giống cái: “người nam hay người nữ son sẻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: Bạn sẽ được ban phước
  rationale: Diễn đạt tự nhiên trạng thái được chúc phước của phân từ thụ động בָּרוּךְ cùng động từ chưa hoàn thành תִּהְיֶה, đồng thời giữ sắc thái lời hứa trong giao ước.
- source_word: מִכָּל הָעַמִּים
  choice: hơn mọi dân tộc
  rationale: מן ở đây mang nghĩa so sánh; “hơn mọi dân tộc” trực tiếp, tự nhiên và giữ đúng quan hệ so sánh, không hàm ý thống trị.
- source_word: לֹא יִהְיֶה בְךָ
  choice: Giữa bạn sẽ không có
  rationale: Cấu trúc hiện hữu היה với בְּ chỉ sự vắng mặt trong cộng đồng. Đại từ số ít “bạn” giữ cách Đức Chúa Trời gọi Israel như một dân giao ước thống nhất.
- source_word: עָקָר וַעֲקָרָה
  choice: người nam hay người nữ nào son sẻ
  rationale: Giữ rõ hai dạng giống đực và giống cái trong tiếng Hê-bơ-rơ. “Son sẻ” là cách nói thông dụng, trang trọng vừa phải và không y khoa hóa câu văn.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: và trong đàn gia súc của bạn cũng vậy
  rationale: בְּהֵמָה là danh từ tập hợp chỉ vật nuôi; “đàn gia súc” tự nhiên trong tiếng Việt, còn “cũng vậy” chuyển tải việc tình trạng son sẻ cũng sẽ không có nơi vật nuôi.
theological_decisions:
- issue: Các từ chỉ tình trạng son sẻ theo giống trong lời chúc phước giao ước
  choice: Nêu rõ “người nam hay người nữ nào son sẻ”
  alternative: “không một ai son sẻ”
  rationale: Nguyên văn cố ý dùng cả dạng giống đực lẫn giống cái; bản dịch giữ sự phân biệt ấy thay vì khái quát hóa.
- issue: Đại từ số ít dùng cho Israel với tư cách tập thể
  choice: Giữ đại từ số ít “bạn”
  alternative: Dùng “các bạn” hoặc thêm “trong dân bạn”
  rationale: Tiếng Hê-bơ-rơ trực tiếp gọi Israel bằng ngôi thứ hai số ít. “Bạn” bảo tồn hình thức tập thể này mà không thêm lời giải thích vào chính văn.
- issue: Phạm vi lời chúc phước đối với con người và vật nuôi
  choice: Dùng “cũng vậy” để áp dụng sự vắng bóng tình trạng son sẻ cho gia súc
  alternative: Lặp đầy đủ “trong đàn gia súc của bạn cũng sẽ không có con nào son sẻ”
  rationale: Cách rút gọn phản ánh cấu trúc lược của nguyên văn và tránh diễn giải quá mức, nhưng vẫn rõ nghĩa trong tiếng Việt.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “được ban phước” theo văn cảnh giao ước; tránh từ ngữ y khoa. Dấu chấm tách hai vế để câu tự nhiên hơn trong tiếng Việt, trong khi vẫn giữ quan hệ ý nghĩa của nguyên văn.
