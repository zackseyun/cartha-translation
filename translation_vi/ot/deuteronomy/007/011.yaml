  text: וְ/שָׁמַרְתָּ֨ אֶת הַ/מִּצְוָ֜ה וְ/אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לַ/עֲשׂוֹתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: vi
  text: Vậy, anh em phải gìn giữ điều răn, các luật lệ và các phán quyết mà hôm nay tôi truyền cho anh em để thi hành.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và anh em phải gìn giữ” hoặc “Vì thế, anh em phải gìn giữ”; liên từ Hê-bơ-rơ có thể chỉ sự nối tiếp đơn thuần hoặc nêu kết luận từ các câu trước.'
    reason: lexical_alternative
  - marker: b
    text: “Các phán quyết” cũng có thể dịch là “các quy định” hoặc “các điều luật”; từ Hê-bơ-rơ chỉ những quyết định pháp lý hoặc quy tắc đã được ấn định.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Vậy, anh em phải gìn giữ
  rationale: שׁמר trong ngữ cảnh giao ước-pháp luật mang nghĩa giữ gìn, tuân giữ. “Vậy” thể hiện hợp lý sắc thái suy luận của וְ từ các câu trước, còn chú thích bảo lưu khả năng chỉ là liên từ nối tiếp.
- source_word: הַמִּצְוָה
  choice: điều răn
  rationale: Giữ nguyên số ít của מִצְוָה và dùng thuật ngữ tự nhiên, quen thuộc trong văn cảnh luật giao ước.
- source_word: הַחֻקִּים
  choice: các luật lệ
  rationale: Diễn đạt חֻקִּים bằng một từ ngữ pháp lý rõ ràng trong tiếng Việt hiện đại, đồng thời phân biệt với מִצְוָה và מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: các phán quyết
  rationale: Bảo lưu sắc thái về những quyết định hoặc quy định pháp lý của מִשְׁפָּטִים và không đồng nhất nó với חֻקִּים.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Phản ánh trực tiếp hành động truyền lệnh trong bối cảnh giao ước hiện tại; đặt “hôm nay” tự nhiên mà vẫn giữ sự nhấn mạnh của sách Phục Truyền Luật Lệ.
- source_word: לַעֲשׂוֹתָם
  choice: để thi hành
  rationale: Diễn đạt mục đích của לַעֲשׂוֹתָם bằng tiếng Việt tự nhiên, nhấn mạnh việc thực hiện cụ thể các điều đã truyền; tân ngữ được hiểu rõ từ ba hạng mục đứng trước.
- source_word: ךָ (các hậu tố ngôi thứ hai số ít giống đực)
  choice: anh em
  rationale: Tiếng Hê-bơ-rơ dùng số ít để nói với toàn dân Israel như một cộng đồng. “Anh em” là cách xưng hô tập thể trang trọng, tự nhiên trong tiếng Việt và tránh khiến người đọc hiểu rằng chỉ một cá nhân được nói đến.
theological_decisions:
- issue: Giữ sự phân biệt giữa ba thuật ngữ luật giao ước
  choice: điều răn, các luật lệ và các phán quyết
  alternative: mệnh lệnh, các quy định và các điều luật
  rationale: Ba thuật ngữ có phần chồng lấn nhưng được xếp cạnh nhau nhằm tạo sức nặng tu từ và pháp lý. Bản dịch giữ chúng riêng biệt thay vì gom thành một danh từ chung.
- issue: Sắc thái của liên từ mở đầu וְ
  choice: Vậy
  alternative: Và; Vì thế
  rationale: Mạch văn trước đó hỗ trợ sắc thái kết luận hoặc suy luận, nhưng liên từ Hê-bơ-rơ cũng có thể chỉ đơn thuần nối tiếp; sự mơ hồ này được nêu trong chú thích.
- issue: Đối tượng được xưng hô ở ngôi thứ hai số ít
  choice: anh em
  alternative: ngươi
  rationale: Số ít Hê-bơ-rơ xưng hô với Israel như một cộng đồng thống nhất. Tiếng Việt hiện đại không có một đại từ số ít tương đương vừa tự nhiên vừa trung tính; “anh em” truyền đạt đối tượng tập thể mà không áp đặt thêm ý nghĩa thần học.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng thuật ngữ pháp lý-giao ước dễ hiểu. Giữ số ít “điều răn” và sự phân biệt của ba danh mục luật. Dùng “tôi” cho Môi-se và “anh em” cho toàn dân Israel; tránh đại từ cổ “ngươi”. Hai dấu chú thích đều xuất hiện trong chính văn.
