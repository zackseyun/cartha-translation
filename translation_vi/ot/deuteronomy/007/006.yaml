revisions:
- from: Vì anh em là một dân thánh thuộc về Yahweh, Đức Chúa Trời của anh em. Yahweh, Đức Chúa Trời của anh em, đã chọn anh em giữa mọi dân tộc trên mặt đất để làm một dân quý báu của riêng Ngài.[a]
  to: Vì anh em là một dân thánh thuộc về Yahweh, Đức Chúa Trời của anh em. Yahweh, Đức Chúa Trời của anh em, đã chọn anh em giữa mọi dân trên mặt đất để trở thành dân riêng, là sở hữu quý báu của Ngài.[a]
  rationale: Bản sửa làm rõ rằng Yahweh chọn Israel từ giữa mọi dân trên mặt đất, đồng thời diễn đạt סְגֻלָּה như một sở hữu đặc biệt được trân quý mà không bỏ danh từ “dân.” Chú thích được chỉnh để nêu một phương án từ vựng sát nghĩa và tránh thêm ý “sản nghiệp.”
