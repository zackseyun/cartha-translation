source:
  edition: WLC
  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: vi
  text: Vì anh em là một dân thánh thuộc về Yahweh, Đức Chúa Trời của anh em. Yahweh, Đức Chúa Trời của anh em, đã chọn anh em giữa mọi dân trên mặt đất để trở thành dân riêng, là sở hữu quý báu của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một dân là sở hữu đặc biệt của Ngài.” Tiếng Hê-bơ-rơ nói theo nghĩa đen là “một dân của sở hữu quý báu,” kết hợp ý về một dân với ý về một tài sản đặc biệt được trân quý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu lý do cho mệnh lệnh ở văn cảnh trước.
- source_word: עַם קָדוֹשׁ
  choice: một dân thánh
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ ý một dân được biệt riêng và thuộc phạm vi thánh.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: thuộc về Yahweh, Đức Chúa Trời của anh em
  rationale: Làm rõ quan hệ thuộc về do giới từ ל biểu thị; cách nói này tự nhiên hơn việc mô phỏng máy móc cấu trúc Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước được ghi trực tiếp bằng Tetragrammaton trong nguồn Hê-bơ-rơ.
- source_word: בְּךָ בָּחַר
  choice: đã chọn anh em
  rationale: Giữ rõ hành động tuyển chọn của Đức Chúa Trời; đại từ số nhiều phù hợp với việc Môi-se nói với toàn dân.
- source_word: לִהְיוֹת לוֹ לְעַם סְגֻלָּה
  choice: để làm một dân quý báu của riêng Ngài
  rationale: Giữ cả danh từ עַם, sắc thái tài sản đặc biệt được trân quý của סְגֻלָּה, và quan hệ sở hữu trong לוֹ.
- source_word: מִכֹּל הָעַמִּים
  choice: giữa mọi dân tộc
  rationale: Diễn tả sự lựa chọn từ trong toàn thể các dân, không thêm ý rằng Israel vốn vượt trội hơn họ.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: trên mặt đất
  rationale: Giữ hình ảnh thành ngữ của nguyên văn bằng một cách nói quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước; phiên âm Yahweh bảo tồn sự phân biệt giữa danh riêng này và tước hiệu.
- issue: Ý nghĩa của מִכֹּל הָעַמִּים trong sự tuyển chọn Israel
  choice: giữa mọi dân tộc
  alternative: hơn mọi dân tộc
  rationale: Giới từ מן ở đây tự nhiên chỉ sự tuyển chọn từ giữa một tập hợp; không nên tự ý biến câu thành lời khẳng định về tính ưu việt nội tại.
- issue: Sắc thái của סְגֻלָּה
  choice: một dân quý báu của riêng Ngài
  alternative: một sản nghiệp quý báu của riêng Ngài
  rationale: Bản dịch chính giữ danh từ עַם và ý được đặc biệt trân quý; chú thích bảo tồn cách hiểu theo nghĩa tài sản/sản nghiệp đặc biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng Israel được xưng hô ở ngôi thứ hai số nhiều; viết hoa “Ngài” theo quy ước tôn kính. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
