source:
  edition: WLC
  text: כִּי֩ מֵֽ/אַהֲבַ֨ת יְהוָ֜ה אֶתְ/כֶ֗ם וּ/מִ/שָּׁמְר֤/וּ אֶת הַ/שְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹ֣תֵי/כֶ֔ם הוֹצִ֧יא יְהוָ֛ה אֶתְ/כֶ֖ם בְּ/יָ֣ד חֲזָקָ֑ה וַֽ/יִּפְדְּ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים מִ/יַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: vi
  text: Nhưng vì Yahweh yêu thương anh em và giữ lời thề Ngài đã thề với tổ phụ anh em, nên Yahweh đã dùng bàn tay quyền năng[a] đưa anh em ra và chuộc anh em khỏi nhà nô lệ[b], khỏi tay Pha-ra-ôn, vua Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng bàn tay mạnh mẽ.” Đây là thành ngữ chỉ hành động giải cứu đầy quyền năng của Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “nhà của những nô lệ”; cũng có thể dịch: “chốn nô lệ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nhưng vì ... nên
  rationale: Trong mạch văn, כִּי vừa nêu nguyên nhân vừa đối lập với lời phủ định ở câu 7; kết cấu “Nhưng vì ... nên” diễn đạt tự nhiên cả hai chức năng ấy.
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: vì Yahweh yêu thương anh em
  rationale: Chuyển danh hóa chỉ nguyên nhân thành mệnh đề động từ tự nhiên trong tiếng Việt, đồng thời giữ nguyên danh Yahweh.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: và giữ lời thề
  rationale: Giữ nghĩa Yahweh trung tín tuân giữ lời thề; “giữ lời thề” tự nhiên hơn một cấu trúc danh hóa sát chữ.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: Ngài đã thề với tổ phụ anh em
  rationale: “Tổ phụ” giữ nét chỉ các bậc cha ông trong lịch sử giao ước, thay vì khái quát hóa thành mọi tổ tiên.
- source_word: בְּיָד חֲזָקָה
  choice: dùng bàn tay quyền năng
  rationale: Giữ hình ảnh “bàn tay” của tiếng Hê-bơ-rơ và truyền đạt thành ngữ về quyền năng giải cứu của Đức Chúa Trời.
- source_word: וַיִּפְדְּךָ
  choice: chuộc anh em
  rationale: “Chuộc” giữ sắc thái giải phóng khỏi ách nô dịch bằng hành động cứu chuộc, đậm hơn từ khái quát “cứu”.
- source_word: מִבֵּית עֲבָדִים
  choice: khỏi nhà nô lệ
  rationale: Giữ hình ảnh cụ thể của nguyên văn, sát nghĩa đen “nhà của những nô lệ,” dù tiếng Việt cũng có thể diễn đạt trôi chảy hơn là “chốn nô lệ.”
- source_word: מִיַּד פַּרְעֹה
  choice: khỏi tay Pha-ra-ôn
  rationale: Bảo tồn hình ảnh “tay” mang nghĩa quyền lực hoặc sự kiểm soát trong thành ngữ Hê-bơ-rơ.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm Yahweh bảo tồn tư cách tên riêng thay vì thay bằng một tước hiệu.
- issue: Danh từ giao ước אֲבֹתֵיכֶם
  choice: tổ phụ anh em
  alternative: tổ tiên anh em
  rationale: “Tổ phụ” giữ tính đặc thù nam giới và bối cảnh các bậc cha ông nhận lời thề giao ước.
- issue: Hình ảnh nô dịch trong עֲבָדִים
  choice: nhà nô lệ
  alternative: chốn nô lệ
  rationale: Bối cảnh là ách nô dịch tại Ai Cập; giữ “nô lệ” tránh làm nhẹ bản chất của tình trạng bị áp bức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng Israel; cách gọi này cũng không làm lộ sự chuyển từ số nhiều sang số ít tập thể trong nguyên văn. Dấu phẩy quanh “vua Ai Cập” làm rõ đây là phần đồng vị của Pha-ra-ôn.
