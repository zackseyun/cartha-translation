  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: vi
  text: Vậy, hãy biết rằng Giê-hô-va, Đức Chúa Trời của anh em, chính Ngài là Đức Chúa Trời, là Đức Chúa Trời thành tín, Đấng giữ giao ước và tình yêu thành tín[a] đối với những người yêu kính Ngài và tuân giữ các điều răn của Ngài, đến ngàn thế hệ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ חֶסֶד cũng có thể được dịch là “lòng nhân từ,” “tình yêu bền vững” hoặc “lòng trung thành với giao ước.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “đối với những người yêu kính Ngài và tuân giữ các điều răn của Ngài, trải đến ngàn thế hệ.” Thành ngữ này nhấn mạnh sự thành tín giao ước bền lâu qua một khoảng thời gian vô cùng rộng lớn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Vậy, hãy biết rằng
  rationale: Động từ hoàn thành Qal ngôi hai số ít mang lực khuyên truyền trong ngữ cảnh; liên từ được hiểu theo ý suy luận từ những câu trước.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong tiếng Việt để thể hiện danh giao ước của Đức Chúa Trời.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Hậu tố ngôi hai giống đực số ít chỉ toàn thể Israel; “anh em” diễn đạt tự nhiên lời Môi-se nói với cộng đồng.
- source_word: הוּא הָאֱלֹהִים
  choice: chính là Đức Chúa Trời
  rationale: “Chính” thể hiện sức nhấn của đại từ הוּא và giữ lời tuyên xưng độc nhất mà không tạo cấu trúc gượng.
- source_word: הָאֵל הַנֶּאֱמָן
  choice: là Đức Chúa Trời thành tín
  rationale: Cụm đồng vị mô tả Ngài là Đấng đáng tin cậy và kiên định, đặc biệt trong quan hệ giao ước.
- source_word: שֹׁמֵר הַבְּרִית
  choice: Đấng giữ giao ước
  rationale: Phân từ diễn tả hành động liên tục; “giữ giao ước” vừa sát nghĩa vừa tự nhiên trong văn phong Kinh Thánh Việt.
- source_word: וְהַחֶסֶד
  choice: và tình yêu thành tín
  rationale: חֶסֶד bao hàm tình yêu bền vững, lòng thương xót và sự trung thành trong giao ước; cách dịch này giữ cả sắc thái yêu thương lẫn trung tín.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: đối với những người yêu kính Ngài và tuân giữ các điều răn của Ngài
  rationale: Giữ hai nhóm phân từ song song; “yêu kính” phù hợp đối tượng là Đức Chúa Trời, còn “tuân giữ” diễn đạt sự vâng phục điều răn tự nhiên hơn “giữ” trong tiếng Việt hiện đại.
- source_word: לְאֶלֶף דּוֹר
  choice: đến ngàn thế hệ
  rationale: Theo sát giới từ và diễn tả sự thành tín bền lâu qua một khoảng thời gian vô cùng rộng lớn.
theological_decisions:
- issue: Sự thành tín giao ước của Đức Chúa Trời trong quan hệ với tình yêu và sự vâng phục của con người
  choice: Đức Chúa Trời giữ giao ước và tình yêu thành tín đối với những người yêu kính Ngài và tuân giữ điều răn Ngài.
  alternative: Đức Chúa Trời bày tỏ lòng thương xót cho những người yêu kính Ngài.
  rationale: Bản dịch giữ nguyên mối liên hệ mà câu Hê-bơ-rơ đặt ra giữa lòng thành tín giao ước của Đức Chúa Trời với tình yêu và sự vâng phục của dân, không làm nhẹ tính điều kiện trong ngữ cảnh hay áp đặt một hệ thống thần học về sau.
- issue: Phạm vi của cụm “đến ngàn thế hệ”
  choice: Để cụm này bổ nghĩa cho việc Đức Chúa Trời giữ giao ước và tình yêu thành tín qua nhiều thế hệ.
  alternative: Gắn trực tiếp cụm này với “những người yêu kính Ngài và tuân giữ các điều răn của Ngài.”
  rationale: Trật tự tiếng Hê-bơ-rơ cho phép cảm nhận sự gắn kết với toàn bộ mệnh đề trước; chú thích bảo tồn khả năng phân đoạn cú pháp khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số ít tập thể chỉ Israel; viết hoa đại từ quy chiếu về Đức Chúa Trời theo quy ước văn phong Kinh Thánh Việt. Câu giữ nhịp tuyên xưng và chuỗi đồng vị của nguyên văn mà tránh lối diễn đạt quá cứng.
