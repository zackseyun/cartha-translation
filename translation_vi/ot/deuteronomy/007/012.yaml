revisions:
- from: Vì anh em lắng nghe các phán quyết này[a], gìn giữ và thi hành chúng, nên Yahweh, Đức Chúa Trời của anh em, sẽ giữ giao ước và tình yêu thành tín[b] dành cho anh em, như Ngài đã thề với tổ phụ anh em[c].
  to: Vì anh em lắng nghe các phán quyết này[a], gìn giữ và thi hành chúng, nên Yahweh, Đức Chúa Trời của anh em, sẽ giữ giao ước và tình yêu thành tín[b] dành cho anh em, mà Ngài đã thề với các tổ phụ của anh em[c].
  rationale: Thay “như Ngài đã thề với tổ phụ anh em” bằng “mà Ngài đã thề với các tổ phụ của anh em” để tái lập quan hệ cú pháp của mệnh đề Hê-bơ-rơ, làm rõ số nhiều, và không thêm diễn giải.
  reviewer_model: gpt-5.6-terra
