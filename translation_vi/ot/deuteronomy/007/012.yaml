source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: vi
  text: Vì anh em lắng nghe các phán quyết này[a], gìn giữ và thi hành chúng, nên Yahweh, Đức Chúa Trời của anh em, sẽ giữ giao ước và tình yêu thành tín[b] dành cho anh em, mà Ngài đã thề với các tổ phụ của anh em[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các luật lệ này” hoặc “các quy định này.”
    reason: lexical_alternative
  - marker: b
    text: “Tình yêu thành tín” dịch từ từ Hê-bơ-rơ hesed, chỉ tình yêu trung kiên, bền vững, thường gắn với giao ước; cũng có thể dịch là “tình yêu bền vững” hoặc “sự thành tín trong giao ước.”
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “các cha của anh em”; trong ngữ cảnh này chỉ các tổ phụ. Cũng có thể dịch là “tổ tiên anh em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: Vì ... nên
  rationale: Cấu trúc tương liên tự nhiên trong tiếng Việt diễn đạt rõ quan hệ điều kiện–hệ quả của thành ngữ Hê-bơ-rơ mà không giữ lối nói cứng 'và sẽ xảy ra rằng, bởi vì'.
- source_word: תִּשְׁמְעוּן
  choice: anh em lắng nghe
  rationale: שׁמע bao hàm việc nghe với thái độ đáp ứng. 'Lắng nghe' giữ sắc thái thính giác, còn các động từ kế tiếp làm rõ sự vâng phục.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: các phán quyết này
  rationale: מִשְׁפָּטִים là thuật ngữ pháp lý chỉ các phán quyết, quy định hay luật lệ; 'phán quyết' giữ được nét pháp lý và phân biệt với những thuật ngữ luật pháp khác.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: gìn giữ và thi hành chúng
  rationale: 'Giữ lại cả hai động từ của nguyên văn: một động từ nhấn mạnh việc chuyên tâm tuân giữ, động từ kia nhấn mạnh đưa vào thực hành.'
- source_word: וְשָׁמַר
  choice: sẽ giữ
  rationale: 'Dùng ''giữ'' để bảo tồn phép lặp có chủ ý của שׁמר: Israel gìn giữ các phán quyết thì Yahweh giữ giao ước.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cách diễn đạt tự nhiên, trang trọng, giữ quan hệ sở hữu giao ước; đại từ Hê-bơ-rơ là số ít tập thể nhưng tiếng Việt dùng 'anh em' để chỉ toàn dân.
- source_word: לְךָ
  choice: dành cho anh em
  rationale: Diễn đạt ý người thụ hưởng của hành động giữ giao ước, tự nhiên hơn 'cho anh em' trong cụm này.
- source_word: הַבְּרִית
  choice: giao ước
  rationale: Thuật ngữ chuẩn và nhất quán cho בְּרִית.
- source_word: הַחֶסֶד
  choice: tình yêu thành tín
  rationale: Cụm này giữ cả chiều kích yêu thương lẫn sự trung kiên bền vững trong quan hệ giao ước của חֶסֶד.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: như Ngài đã thề
  rationale: Nguyên văn nói đến lời thề; 'như' nối tự nhiên với cả giao ước và tình yêu thành tín mà lời thề bảo đảm.
- source_word: לַאֲבֹתֶיךָ
  choice: với tổ phụ anh em
  rationale: Giữ nét quy chiếu nam tính cụ thể đến các cha ông, đặc biệt các tổ phụ, thay vì khái quát hoàn toàn thành 'tổ tiên'.
theological_decisions:
- issue: Cách dịch חֶסֶד trong bối cảnh giao ước
  choice: tình yêu thành tín
  alternative: lòng nhân từ; tình yêu bền vững; sự thành tín trong giao ước
  rationale: Cách chọn này không thu hẹp חֶסֶד thành cảm xúc, lòng thương xót, hay nghĩa vụ pháp lý đơn thuần, mà duy trì đồng thời tình yêu và lòng trung thành giao ước.
- issue: Quan hệ giữa sự tuân giữ của Israel và việc Yahweh giữ giao ước
  choice: Vì ... nên
  alternative: Nếu ... thì; do kết quả của việc
  rationale: Giữ quan hệ điều kiện–hệ quả rõ ràng của עֵקֶב nhưng không diễn giải thêm về bản chất thần học của quan hệ ấy.
- issue: Đối tượng của לַאֲבֹתֶיךָ
  choice: tổ phụ anh em
  alternative: tổ tiên anh em
  rationale: Bảo tồn tham chiếu cụ thể của dạng giống đực số nhiều đến các cha ông/tổ phụ, không trung tính hóa thành một nhóm tổ tiên nói chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' cho ngôi thứ hai số ít có nghĩa tập thể, nhằm chỉ dân Israel như một cộng đồng. Cấu trúc 'Vì ... nên' làm rõ cú pháp Hê-bơ-rơ mà vẫn giữ độ căng điều kiện–hệ quả. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
