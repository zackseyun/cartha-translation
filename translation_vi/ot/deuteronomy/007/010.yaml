source:
  edition: WLC
  text: וּ/מְשַׁלֵּ֧ם לְ/שֹׂנְאָ֛י/ו אֶל פָּנָ֖י/ו לְ/הַאֲבִיד֑/וֹ לֹ֤א יְאַחֵר֙ לְ/שֹׂ֣נְא֔/וֹ אֶל פָּנָ֖י/ו יְשַׁלֶּם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: vi
  text: và Ngài báo trả những kẻ ghét Ngài ngay trước mặt họ[a], để tiêu diệt họ. Ngài không chậm trễ đối với kẻ ghét Ngài; Ngài sẽ báo trả kẻ ấy ngay trước mặt kẻ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “đến/trước mặt họ/người ấy”; thành ngữ này cũng có thể hiểu là “trước họ/người ấy” hoặc “ngay trong sự hiện diện của họ/người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: và Ngài báo trả
  rationale: Thể Piel của שׁלם ở đây diễn tả việc đáp trả tương xứng, mang sắc thái xét xử. “Báo trả” tự nhiên, trang trọng và giữ được tác nhân trực tiếp là Đức Chúa Trời.
- source_word: לְשֹׂנְאָיו
  choice: những kẻ ghét Ngài
  rationale: Phân từ của שׂנא chỉ những người có thái độ thù ghét đối với Ngài; cách dịch này sát hơn “kẻ thù”, vốn có nghĩa rộng hơn.
- source_word: אֶל־פָּנָיו
  choice: ngay trước mặt họ
  rationale: Thành ngữ theo mặt chữ là “đến/trước mặt người ấy”. Trong mệnh đề số nhiều, tiếng Việt tự nhiên dùng “họ”; từ “ngay” làm rõ tính trực diện mà không biến câu thành một hệ quả vô ngã.
- source_word: לְהַאֲבִידוֹ
  choice: để tiêu diệt họ
  rationale: Động từ nguyên mẫu Hiphil của אבד diễn tả mục đích hoặc kết quả của sự báo trả. “Để tiêu diệt” giữ trực tiếp cấu trúc mục đích và mức độ mạnh của động từ.
- source_word: לֹא יְאַחֵר
  choice: Ngài không chậm trễ
  rationale: Piel của אחר có nghĩa trì hoãn hoặc chậm thực hiện. Thì hiện tại phù hợp với lời khẳng định có tính nguyên tắc trong giao ước.
- source_word: לְשֹׂנְאוֹ
  choice: đối với kẻ ghét Ngài
  rationale: Giới từ לְ đánh dấu đối tượng mà sự chậm trễ hướng đến. “Đối với” vừa rõ nghĩa vừa giữ trọng tâm số ít của tiếng Hê-bơ-rơ.
- source_word: יְשַׁלֶּם לוֹ
  choice: Ngài sẽ báo trả kẻ ấy
  rationale: Cách dịch lặp lại “báo trả” để bảo toàn liên hệ từ vựng với động từ đầu câu, đồng thời giữ sự chuyển sang đối tượng số ít.
theological_decisions:
- issue: Ngôn ngữ về sự phán xét của Đức Chúa Trời
  choice: Đức Chúa Trời trực tiếp báo trả và tiêu diệt những kẻ ghét Ngài
  alternative: Diễn đạt như hậu quả chung chung hoặc vô ngã
  rationale: Bản Hê-bơ-rơ đặt Đức Chúa Trời làm chủ thể trực tiếp của việc báo trả và tiêu diệt; bản dịch không làm nhẹ đi tác nhân thần linh hay sự căng thẳng thần học của câu.
- issue: Số ít trong thành ngữ אֶל־פָּנָיו và đại từ hậu tố
  choice: Dịch theo số nhiều ở mệnh đề đầu và số ít ở mệnh đề sau, đồng thời chú thích hình thức sát chữ
  alternative: Giữ số ít cứng nhắc trong cả hai mệnh đề hoặc hiểu đại từ là chỉ về Đức Chúa Trời
  rationale: Cấu trúc tiếng Hê-bơ-rơ dùng tập hợp số nhiều rồi chuyển sang một cá nhân đại diện ở số ít. Tiếng Việt cần điều chỉnh hòa hợp số để rõ đối tượng, nhưng chú thích bảo lưu hình thức và các sắc thái thành ngữ của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để duy trì tham chiếu rõ ràng đến Đức Chúa Trời trong ngữ cảnh, và “kẻ ấy” để thể hiện sự chuyển từ nhóm số nhiều sang cá nhân đại diện ở nửa sau câu.
