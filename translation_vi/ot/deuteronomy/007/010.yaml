  naturalness: Văn phong trang trọng, rõ ràng và tự nhiên trong tiếng Việt chuẩn hiện đại. Sự lặp lại "kẻ ấy ... kẻ ấy" ở vế sau hơi nặng nhưng giúp bảo toàn sự lặp lại và trọng tâm của nguyên ngữ.
  terminology: '"Ngài", "báo trả", "tiêu diệt" phù hợp văn cảnh giao ước và ngôn ngữ phán xét, không làm giảm nhẹ tác nhân trực tiếp. Tuy nhiên chú thích hiện tại chỉ nêu dạng số ít "người ấy", trong khi thành ngữ xuất hiện với đối tượng số nhiều ở mệnh đề đầu và số ít ở mệnh đề sau; cần chỉnh để phản ánh cả hai.'
