translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng đại từ số ít “anh” để phản ánh lời xưng hô ngôi thứ hai giống đực số ít trong nguyên bản. Câu dịch làm rõ hành động quay lại thu phần nho còn sót mà không thêm một lý do thần học ngoài văn bản.
