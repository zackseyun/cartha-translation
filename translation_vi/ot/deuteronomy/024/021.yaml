  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc điều luật: thời điểm thu hoạch nho, cấm chủ vườn quay lại thu phần còn sót, và phần đó được để cho người ngoại kiều, trẻ mồ côi và góa phụ. “Quay lại hái những gì còn sót” diễn đạt phù hợp ý עולל אחריך mà không làm lẫn vai trò của chủ vườn với người đi mót.'
