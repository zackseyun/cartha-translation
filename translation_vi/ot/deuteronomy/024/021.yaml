source:
  edition: WLC
  text: כִּ֤י תִבְצֹר֙ כַּרְמְ/ךָ֔ לֹ֥א תְעוֹלֵ֖ל אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: vi
  text: Khi anh thu hoạch nho trong vườn nho của mình, anh không được quay lại hái những gì còn sót[a]; phần ấy phải dành cho người ngoại kiều[b], trẻ mồ côi[c] và góa phụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được mót lại sau đó” hoặc “không được hái vét lần nữa.” Động từ Hê-bơ-rơ chỉ việc đi qua vườn lần thứ hai để thu nhặt phần còn lại.'
    reason: lexical_alternative
  - marker: b
    text: “Người ngoại kiều” là người không thuộc dân bản địa nhưng cư trú giữa dân Y-sơ-ra-ên; cũng có thể dịch là “ngoại kiều cư trú.”
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “người không cha.” Trong nhiều ngữ cảnh, từ Hê-bơ-rơ này có nghĩa sát chữ là người không cha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong điều luật này, כִּי mở đầu một hoàn cảnh được dự liệu; “khi” tự nhiên và phù hợp hơn “nếu”.
- source_word: תִבְצֹר
  choice: thu hoạch nho
  rationale: Động từ בצר chỉ việc thu hái nho; thêm “nho” làm rõ đối tượng vốn hàm chứa trong động từ Hê-bơ-rơ.
- source_word: כַּרְמְךָ
  choice: vườn nho của mình
  rationale: Diễn đạt tự nhiên sở hữu ngôi thứ hai số ít của כַּרְמְךָ trong tiếng Việt.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: anh không được quay lại hái những gì còn sót
  rationale: Trong ngữ cảnh này, עולל nói đến việc thu nhặt phần nho còn lại sau lượt hái đầu; “quay lại hái những gì còn sót” truyền đạt rõ ý lượt hái thứ hai và sắc thái אַחֲרֶיךָ, tránh dùng “mót” theo cách dễ khiến người đọc nhầm vai trò của chủ vườn với người nghèo.
- source_word: לַגֵּר
  choice: cho người ngoại kiều
  rationale: גֵּר là người không thuộc dân bản địa nhưng cư trú giữa cộng đồng Y-sơ-ra-ên; “người ngoại kiều” giữ được sắc thái xã hội-pháp lý ấy.
- source_word: לַיָּתוֹם
  choice: cho trẻ mồ côi
  rationale: יָתוֹם có thể chỉ người không cha hoặc trẻ mồ côi; “trẻ mồ côi” là cách nói hiện đại, tự nhiên, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: וְלָאַלְמָנָה
  choice: và góa phụ
  rationale: אַלְמָנָה có nghĩa trực tiếp là người đàn bà góa.
- source_word: יִהְיֶה
  choice: phần ấy phải dành cho
  rationale: 'Chuyển tải ý sở hữu và nghĩa vụ trong công thức pháp luật: sản vật còn lại phải được để cho ba nhóm dễ bị tổn thương.'
