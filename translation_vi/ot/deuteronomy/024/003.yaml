base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: vi
  text: và người đàn ông sau ghét nàng[a], viết cho nàng một giấy ly hôn[b], trao vào tay nàng và cho nàng rời khỏi nhà mình; hoặc nếu người đàn ông sau, là người đã lấy nàng làm vợ[c], qua đời—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trở nên ghét nàng”. Dạng động từ Hê-bơ-rơ có thể được hiểu như một sự việc trong chuỗi tình huống pháp lý, với ý người đàn ông sau nảy sinh lòng thù ghét đối với nàng rồi tiến hành ly hôn.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “một văn bản cắt đứt”, tức văn bản chính thức chấm dứt hôn nhân.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “đã lấy nàng cho mình làm vợ”, nghĩa là đã cưới nàng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: ghét nàng
  rationale: Động từ שׂנא mang nghĩa trực tiếp là “ghét”. Cách dịch này giữ nguyên sức nặng từ vựng của tiếng Hê-bơ-rơ, thay vì làm nhẹ thành “không còn ưa”.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: người đàn ông sau
  rationale: אַחֲרוֹן có nghĩa là “sau/cuối”; trong tình huống pháp lý này, cụm từ chỉ người đàn ông được nhắc đến sau người chồng đầu, mà không thay danh từ “người đàn ông” bằng một diễn giải.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: viết cho nàng một giấy ly hôn
  rationale: סֵפֶר là văn bản, còn כְּרִיתֻת chỉ sự cắt đứt quan hệ. “Giấy ly hôn” là cách nói hiện đại, rõ ràng về văn bản chính thức chấm dứt hôn nhân.
- source_word: וְנָתַן בְּיָדָהּ
  choice: trao vào tay nàng
  rationale: 'Giữ hình ảnh và thủ tục cụ thể của nguyên văn: văn bản được đặt hoặc trao vào tay người phụ nữ.'
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: đuổi nàng ra khỏi nhà mình
  rationale: Trong bối cảnh ly hôn, שׁלח diễn tả việc cho đi hoặc đuổi đi; cụm מִבֵּיתוֹ được giữ rõ là “ra khỏi nhà mình”.
- source_word: אוֹ כִי יָמוּת
  choice: hoặc nếu ... qua đời
  rationale: Cụm này mở ra điều kiện thay thế trong quy định pháp lý. “Nếu” phù hợp với cấu trúc tình huống giả định, còn “qua đời” tự nhiên và trang trọng.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: là người đã lấy nàng làm vợ
  rationale: לקח + ל + אשה là thành ngữ chỉ việc cưới một phụ nữ. Cách dịch giữ hình thức “lấy ... làm vợ” của nguyên văn và vẫn tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “nàng” để theo sát các đại từ giống cái lặp lại trong nguyên văn và giữ nhịp câu; dùng dấu gạch ngang cuối câu vì điều kiện pháp lý còn tiếp tục sang câu kế. Trật tự mệnh đề cuối được điều chỉnh nhẹ trong tiếng Việt để đại từ quan hệ gắn rõ với “người đàn ông sau”, không làm thay đổi nội dung.
