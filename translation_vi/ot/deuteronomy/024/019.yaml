revisions:
- from: Khi anh em gặt mùa màng trong ruộng mình và để quên một bó lúa ngoài đồng, thì đừng quay lại lấy. Bó lúa ấy phải được dành cho ngoại kiều[a], trẻ mồ côi[b] và góa phụ, để Giê-hô-va, Đức Chúa Trời của anh em, ban phước cho mọi công việc tay anh em làm.
  to: Khi anh em gặt mùa màng trong ruộng mình mà để quên một bó lúa trong ruộng, thì đừng quay lại lấy nó. Bó lúa ấy phải được dành cho người ngoại kiều[a], người mồ côi cha[b] và góa phụ, để Yahweh, Đức Chúa Trời của anh em, ban phước cho anh em trong mọi việc tay anh em làm.
  rationale: Bản sửa dùng “Yahweh” theo quyết định danh riêng của POB, làm rõ cấu trúc “ban phước cho anh em trong mọi việc tay anh em làm”, và bảo toàn nghĩa hẹp hơn của יָתוֹם. Các mốc chú thích được giữ ngay sau những từ được giải thích.
  reviewer_model: gpt-5.6-terra
