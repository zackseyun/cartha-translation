source:
  edition: WLC
  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: vi
  text: Khi anh em gặt mùa màng trong ruộng mình mà để quên một bó lúa trong ruộng, thì đừng quay lại lấy nó. Bó lúa ấy phải được dành cho người ngoại kiều[a], người mồ côi cha[b] và góa phụ, để Yahweh, Đức Chúa Trời của anh em, ban phước cho anh em trong mọi việc tay anh em làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “kiều dân” hoặc “người ngoại quốc cư trú”; từ Hê-bơ-rơ chỉ người không thuộc dân bản địa nhưng đang sống giữa cộng đồng Israel.
    reason: lexical_alternative
  - marker: b
    text: Hay “trẻ mồ côi”; từ Hê-bơ-rơ chỉ người con mất cha, không nhất thiết đã mất cả cha lẫn mẹ.
    reason: lexical_scope
lexical_decisions:
- source_word: כִּי תִקְצֹר קְצִירְךָ
  choice: Khi anh em gặt mùa màng
  rationale: כִּי mở đầu trường hợp luật định và ở đây được diễn đạt tự nhiên bằng “khi”; תִקְצֹר chỉ việc gặt, còn קְצִירְךָ là mùa màng của người nghe.
- source_word: וְשָׁכַחְתָּ עֹמֶר בַּשָּׂדֶה
  choice: và để quên một bó lúa ngoài đồng
  rationale: עֹמֶר trong ngữ cảnh là bó lúa đã gặt, không phải đơn vị đong; “để quên” diễn đạt tự nhiên một vật bị bỏ lại do quên.
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: thì đừng quay lại lấy
  rationale: Giữ nguyên cả ý chuyển động trở lại của שׁוב lẫn hành động lấy của לקח, đồng thời dùng lối cấm đoán rõ ràng trong tiếng Việt hiện đại.
- source_word: לַגֵּר
  choice: ngoại kiều
  rationale: גֵּר là người không thuộc dân bản địa nhưng cư trú giữa cộng đồng Israel; “ngoại kiều” ngắn gọn và thể hiện cả tư cách người nước ngoài lẫn việc cư trú.
- source_word: לַיָּתוֹם
  choice: trẻ mồ côi
  rationale: יָתוֹם chỉ người con mất cha hoặc cha mẹ và thuộc nhóm dễ bị tổn thương; “trẻ mồ côi” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: יִהְיֶה
  choice: phải được dành cho
  rationale: Diễn đạt việc bó lúa được để lại làm phần cho những người dễ bị tổn thương, không áp đặt một khái niệm pháp lý quá chặt về quyền sở hữu.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶיךָ
  choice: cho mọi công việc tay anh em làm
  rationale: Giữ hình ảnh Hê-bơ-rơ về “công việc của tay” nhưng thêm “làm” để câu tiếng Việt tự nhiên và rõ nghĩa.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh; Đức Giê-hô-va; CHÚA
  rationale: Dùng hình thức danh riêng quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu; như vậy vẫn cho thấy bản Hê-bơ-rơ dùng danh giao ước.
- issue: Phạm vi của גֵּר
  choice: ngoại kiều
  alternative: kiều dân; người ngoại quốc cư trú; khách lạ
  rationale: Câu luật nói đến một người không phải dân bản địa nhưng sống trong cộng đồng, chứ không chỉ một khách qua đường. Chú thích giữ lại sắc thái này.
- issue: Ý nghĩa của lời chúc phước với לְמַעַן
  choice: để ... ban phước
  alternative: hầu cho ... ban phước; nhờ đó ... sẽ ban phước
  rationale: Giữ quan hệ mục đích hoặc kết quả được לְמַעַן biểu thị mà không xác định quá mức cơ chế thần học giữa sự vâng lời và phước lành.
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại. Đại từ “anh em” dịch ngôi thứ hai số ít giống đực theo nghĩa đại diện, phù hợp lời giao ước nói với từng thành viên Israel mà vẫn tự nhiên trong tiếng Việt. Câu giữ hình ảnh nông nghiệp và hình ảnh “công việc tay ... làm” của nguyên văn.
