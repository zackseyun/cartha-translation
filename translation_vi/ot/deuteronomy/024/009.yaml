source:
  edition: WLC
  text: זָכ֕וֹר אֵ֧ת אֲשֶׁר עָשָׂ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/מִרְיָ֑ם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: vi
  text: Hãy nhớ điều mà Gia-vê, Đức Chúa Trời của anh em, đã làm gì với Mi-ri-am dọc đường, khi anh em ra khỏi Ai Cập.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tức là trong hành trình của dân Israel sau khi ra khỏi Ai Cập; xem Dân Số 12:1–15.
    reason: cross_reference
lexical_decisions:
- source_word: זָכוֹר
  choice: Hãy nhớ
  rationale: Mệnh lệnh Qal số ít của זכר; “Hãy nhớ” truyền đạt trực tiếp mệnh lệnh ghi nhớ và phù hợp văn phong giao ước.
- source_word: אֵת אֲשֶׁר
  choice: điều
  rationale: Cụm này dẫn vào nội dung cần nhớ; “điều ... đã làm” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: עָשָׂה
  choice: đã làm
  rationale: Động từ עשה chỉ hành động của Đức Chúa Trời đối với Mi-ri-am; “đã làm” giữ cách diễn đạt rộng của nguyên văn, không giải thích cụ thể hành động.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc và rõ nghĩa trong tiếng Việt để thể hiện trực tiếp Danh YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Hậu tố ngôi hai số ít giống đực hướng đến từng người trong cộng đồng; tiếng Việt dùng “anh em” tự nhiên trong diễn ngôn với toàn thể Israel, còn “của anh em” giữ quan hệ giao ước.
- source_word: לְמִרְיָם
  choice: cho Mi-ri-am
  rationale: Giới từ ל đánh dấu người chịu tác động. “Làm cho Mi-ri-am” giữ độ rộng của nguyên văn; chú thích nêu phương án “đối với Mi-ri-am” để tránh hiểu “cho” là ban lợi ích.
- source_word: בַּדֶּרֶךְ
  choice: dọc đường
  rationale: Diễn đạt tự nhiên ý “trên đường/trong hành trình” mà không thêm địa điểm cụ thể.
- source_word: בְּצֵאתְכֶם
  choice: khi anh em ra
  rationale: Cấu trúc nguyên mẫu với בְּ có ý nghĩa thời gian; “khi ... ra” tự nhiên, đồng thời không ép sắc thái tiếp diễn vốn không bắt buộc trong tiếng Việt.
- source_word: מִמִּצְרַיִם
  choice: khỏi Ai Cập
  rationale: מן chỉ điểm xuất phát; “ra khỏi Ai Cập” là cách nói chuẩn và tự nhiên.
theological_decisions:
- issue: Cách thể hiện Danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh (Gia-vê) hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh riêng YHWH. Bản dịch giữ một dạng tên riêng quen thuộc trong tiếng Việt thay vì thay thế bằng tước hiệu, nhưng không khẳng định chắc chắn cách phát âm cổ.
- issue: Bản chất hành động đối với Mi-ri-am
  choice: đã làm cho Mi-ri-am
  alternative: đã làm đối với Mi-ri-am / đã xử với Mi-ri-am
  rationale: Câu không nói rõ ngay hành động là gì; giữ động từ rộng “làm” bảo toàn sự quy chiếu đến sự kiện Dân Số 12 mà không đưa hình phạt vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai hướng đến cộng đồng Israel; giữ câu ngắn và sức nặng của mệnh lệnh “Hãy nhớ”. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
