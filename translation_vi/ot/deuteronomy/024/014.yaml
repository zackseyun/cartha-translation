id: DEU.24.14
reference: Deuteronomy 24:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: vi
  text: Ngươi không được áp bức người làm thuê nghèo khó và túng thiếu[a], dù người ấy là một trong anh em ngươi hay là một ngoại kiều đang cư ngụ trong đất ngươi, tại các thành của ngươi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gian lận” hoặc “bóc lột” người làm thuê; động từ Hê-bơ-rơ bao hàm sự áp bức về kinh tế.
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “trong các cổng của ngươi”; đây là thành ngữ Hê-bơ-rơ chỉ các thành hoặc phạm vi cộng đồng thuộc quyền quản trị của ngươi.'
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: áp bức
  rationale: Động từ עָשַׁק chỉ sự áp bức hoặc bóc lột, thường trong bối cảnh kinh tế. “Áp bức” giữ được phạm vi rộng và sức nặng đạo đức của lệnh cấm; chú thích nêu rõ sắc thái gian lận, bóc lột.
- source_word: שָׂכִיר
  choice: người làm thuê
  rationale: Danh từ này chỉ người được thuê để làm việc và nhận công. “Người làm thuê” là cách nói tự nhiên, hiện đại và rõ nghĩa trong tiếng Việt.
- source_word: עָנִי וְאֶבְיוֹן
  choice: nghèo khó và túng thiếu
  rationale: Hai từ ghép đôi nhấn mạnh tình trạng dễ bị tổn thương về kinh tế. Cách dịch này giữ đủ hai nét nghĩa mà không đồng nhất chúng.
- source_word: מֵאַחֶיךָ
  choice: một trong anh em ngươi
  rationale: Cụm từ theo nghĩa đen là “từ anh em ngươi”, trong luật giao ước chỉ một người thuộc cộng đồng Israel. Bản dịch giữ hình ảnh thân tộc và số ít của đối tượng.
- source_word: מִגֵּרְךָ
  choice: ngoại kiều cư ngụ
  rationale: גֵּר chỉ người không phải bản xứ nhưng cư trú lâu dài trong xã hội Israel. “Ngoại kiều cư ngụ” diễn đạt địa vị người ngoài cộng đồng bản địa mà không áp đặt một phạm trù di trú pháp lý hiện đại quá cụ thể.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: trong đất ngươi
  rationale: Mệnh đề quan hệ số ít tự nhiên nhất bổ nghĩa cho người ngoại kiều vừa được nhắc đến. Tiếng Việt có thể diễn đạt gọn bằng “cư ngụ trong đất ngươi”.
- source_word: בִּשְׁעָרֶיךָ
  choice: tại các thành của ngươi
  rationale: Theo nghĩa đen là “trong các cổng ngươi”, nhưng đây là thành ngữ chỉ các thành và phạm vi cộng đồng thuộc quyền quản trị. Dịch nghĩa trong câu chính giúp độc giả hiện đại hiểu ngay; hình ảnh nguyên ngữ được giữ trong chú thích.
theological_decisions:
- issue: Từ thân tộc אַחֶיךָ trong luật giao ước
  choice: anh em ngươi
  alternative: đồng bào Israel của ngươi
  rationale: Giữ ngôn ngữ thân tộc của nguyên văn và sắc thái liên đới trong giao ước, thay vì âm thầm diễn giải thành một nhãn dân tộc.
- issue: Cách dịch גֵּר
  choice: ngoại kiều cư ngụ
  alternative: người ngoại quốc cư trú
  rationale: Cách chọn này thể hiện một người ngoài bản địa đang sống trong đất Israel và được luật pháp bảo vệ, đồng thời tránh đồng nhất hoàn toàn với các địa vị pháp lý di trú hiện đại.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và gần với lối diễn đạt luật pháp Kinh Thánh. Dùng đại từ “ngươi” để phản ánh lời truyền trực tiếp ở số ít; dùng “người làm thuê” và “tại các thành” để người đọc hiện đại dễ hiểu.
