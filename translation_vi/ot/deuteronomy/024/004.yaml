source:
  edition: WLC
  text: לֹא יוּכַ֣ל בַּעְלָ֣/הּ הָ/רִאשׁ֣וֹן אֲשֶֽׁר שִׁ֠לְּחָ/הּ לָ/שׁ֨וּב לְ/קַחְתָּ֜/הּ לִ/הְי֧וֹת ל֣/וֹ לְ/אִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי תוֹעֵבָ֥ה הִ֖וא לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹ֤א תַחֲטִיא֙ אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: vi
  text: thì người chồng đầu tiên của nàng, là người đã để nàng ra đi, không được trở lại lấy nàng làm vợ sau khi nàng đã bị ô uế[a], vì điều đó là điều ghê tởm trước mặt Yahweh. Ngươi không được làm cho xứ mà Yahweh, Đức Chúa Trời của ngươi, đang ban cho ngươi làm cơ nghiệp mang tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi nàng đã trở nên ô uế” hoặc “sau khi nàng đã bị làm cho ô uế.” Tiếng Hê-bơ-rơ nói “sau khi nàng đã bị ô uế” nhưng không xác định chính xác bản chất của sự ô uế ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: người chồng đầu tiên của nàng
  rationale: Trong ngữ cảnh hôn nhân, בַּעַל có nghĩa là “chồng”; הָרִאשׁוֹן chỉ người chồng đầu tiên, đối lập với người chồng sau.
- source_word: שִׁלְּחָהּ
  choice: đã đuổi nàng đi
  rationale: Giữ hình ảnh căn bản của động từ שׁלח là “sai/cho đi”; trong ngữ cảnh luật này, cụm từ chỉ hành động ly dị đã được nêu ở các câu trước.
- source_word: לָשׁוּב לְקַחְתָּהּ
  choice: lấy nàng lại
  rationale: 'Diễn đạt tự nhiên ý nối tiếp của hai động từ nguyên mẫu: trở lại lấy nàng, tức tái lập quan hệ vợ chồng.'
- source_word: לִהְיוֹת לוֹ לְאִשָּׁה
  choice: làm vợ
  rationale: Cách diễn đạt tiếng Việt tự nhiên cho thành ngữ hôn nhân Hê-bơ-rơ “để nàng thành vợ cho ông ấy”.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: sau khi nàng đã bị ô uế
  rationale: Dạng bị động của טמא được giữ nguyên, không xác định ô uế ở đây là nghi lễ, tình dục hay tư cách pháp lý.
- source_word: תוֹעֵבָה
  choice: điều ghê tởm
  rationale: Truyền đạt sức nặng luân lý-giao ước của תוֹעֵבָה bằng lối nói trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ nghĩa trực tiếp “trước mặt/trong sự hiện diện của” và phiên âm danh giao ước יְהוָה là Yahweh.
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: không được gây tội lỗi cho xứ
  rationale: Phản ánh thể Hiphil của חטא và giữ “xứ” làm đối tượng, không diễn giải thêm thành ô nhiễm hay hình phạt.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: đang ban cho anh em làm cơ nghiệp
  rationale: נַחֲלָה là phần thừa hưởng/cơ nghiệp trong bối cảnh đất giao ước; “cơ nghiệp” giữ sắc thái Kinh Thánh mà vẫn quen thuộc.
theological_decisions:
- issue: Ý nghĩa của הֻטַּמָּאָה trong lệnh cấm tái hôn
  choice: đã bị ô uế
  alternative: đã trở nên không thanh sạch; đã bị làm cho bất khiết; đã mất tư cách vì cuộc hôn nhân thứ hai
  rationale: Bản Hê-bơ-rơ dùng dạng bị động của טמא nhưng không nói rõ bản chất của sự ô uế. Bản dịch giữ độ rộng và sự căng thẳng pháp lý-thần học của nguyên văn.
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Phiên âm danh giao ước được nêu trực tiếp trong nguyên văn, tránh thay bằng một tước hiệu.
- issue: Số và đối tượng của đại từ ngôi thứ hai
  choice: anh em
  alternative: ngươi
  rationale: Các hậu tố trong câu ở số ít, nhưng hướng đến Israel như một cộng đồng giao ước. “Anh em” diễn đạt tự nhiên đối tượng tập thể trong tiếng Việt hiện đại mà không biến lời nói thành chỉ dành cho một cá nhân.
translation_notes:
  register: Văn phong luật pháp trang trọng, rõ ràng và dễ hiểu. Dùng “nàng” để duy trì tham chiếu đến người phụ nữ trong điều luật; dùng “anh em” cho đối tượng Israel mang tính tập thể. Dấu chân chú thích [a] xuất hiện ngay sau cụm từ cần chú giải.
