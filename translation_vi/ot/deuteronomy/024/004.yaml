- from: thì người chồng đầu tiên của nàng, là người đã đuổi nàng đi, không được lấy nàng lại làm vợ sau khi nàng đã bị ô uế[a], vì đó là điều ghê tởm trước mặt Yahweh. Anh em không được gây tội lỗi cho xứ mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em làm cơ nghiệp.
  to: thì người chồng đầu tiên của nàng, là người đã để nàng ra đi, không được trở lại lấy nàng làm vợ sau khi nàng đã bị ô uế[a], vì điều đó là điều ghê tởm trước mặt Yahweh. Ngươi không được làm cho xứ mà Yahweh, Đức Chúa Trời của ngươi, đang ban cho ngươi làm cơ nghiệp mang tội.
