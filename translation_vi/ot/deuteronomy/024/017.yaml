  text: לֹ֣א תַטֶּ֔ה מִשְׁפַּ֖ט גֵּ֣ר יָת֑וֹם וְ/לֹ֣א תַחֲבֹ֔ל בֶּ֖גֶד אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: vi
  text: Không được làm sai lệch công lý dành cho người ngoại kiều hoặc trẻ mồ côi[a], cũng không được lấy y phục của góa phụ làm vật cầm cố.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngoại kiều” cũng có thể dịch là “người ngoại quốc cư trú” hoặc “người lạ cư trú”. Từ Hê-bơ-rơ chỉ người không phải dân bản địa nhưng đang sống giữa dân Israel và được cộng đồng bảo hộ về mặt xã hội và pháp lý. Từ được dịch là “trẻ mồ côi” cũng có thể chỉ riêng người con không còn cha.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: làm sai lệch
  rationale: Thể Hiphil của נטה trong ngữ cảnh pháp lý mang nghĩa bẻ cong hoặc làm chệch hướng; “làm sai lệch” diễn đạt tự nhiên hành vi xuyên tạc công lý.
- source_word: מִשְׁפַּט
  choice: công lý dành cho
  rationale: מִשְׁפַּט ở đây có thể chỉ công lý, phán quyết hoặc quyền lợi pháp lý chính đáng; cách dịch này làm rõ điều không được khước từ đối với người yếu thế mà không thu hẹp thành một thủ tục cụ thể.
- source_word: גֵּר
  choice: ngoại kiều
  rationale: גֵּר chỉ người không phải dân bản địa nhưng đang cư trú giữa cộng đồng Israel và thuộc phạm vi bảo hộ xã hội, pháp lý; “ngoại kiều” tương đối gọn và dễ hiểu trong tiếng Việt hiện đại.
- source_word: יָתוֹם
  choice: trẻ mồ côi
  rationale: יָתוֹם chỉ người con mất sự che chở của cha; “trẻ mồ côi” là cách nói tự nhiên, thông dụng, dù từ Hê-bơ-rơ không nhất thiết khẳng định đã mất cả cha lẫn mẹ.
- source_word: תַחֲבֹל
  choice: lấy ... làm vật cầm cố
  rationale: Trong ngữ cảnh luật về nợ, חבל có nghĩa lấy tài sản để bảo đảm khoản nợ; cách diễn đạt này rõ ràng trong tiếng Việt hiện đại.
- source_word: בֶּגֶד
  choice: áo
  rationale: בֶּגֶד là từ khái quát chỉ trang phục. “Áo” tự nhiên hơn “y phục” trong câu này và không xác định quá mức đó là loại áo nào.
- source_word: אַלְמָנָה
  choice: góa phụ
  rationale: Danh từ chỉ người phụ nữ có chồng đã qua đời; “góa phụ” phù hợp với văn phong luật pháp trang trọng và dễ hiểu.
theological_decisions:
- issue: Cách dịch nhóm người được bảo vệ גֵּר
  choice: ngoại kiều
  alternative: người ngoại quốc cư trú / khách kiều ngụ / người xa lạ
  rationale: Câu này bảo vệ quyền pháp lý của một người không phải dân bản địa nhưng đang sống trong cộng đồng Israel. “Ngoại kiều” giữ được cả yếu tố ngoại quốc lẫn cư trú, còn chú thích làm rõ phạm vi xã hội-pháp lý của thuật ngữ.
translation_notes:
  register: Văn phong luật pháp trực tiếp, trang trọng nhưng hiện đại. Dùng đại từ “ngươi” để phù hợp lời luật truyền cho Israel; tránh thuật ngữ giáo phái. Cấu trúc song song của câu Hê-bơ-rơ được giữ tương đối sát.
