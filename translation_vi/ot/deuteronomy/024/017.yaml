    rationale: בֶּגֶד chỉ chung một món trang phục/y phục, không xác định đó là áo thân trên. “Y phục” giữ độ khái quát của nguyên ngữ.
  - severity: low
    issue: “Ngươi” không thật sự phù hợp với mục tiêu tiếng Việt chuẩn hiện đại.
    rationale: Đây là đại từ mang màu sắc Kinh Thánh truyền thống. Lược chủ ngữ là lối diễn đạt mệnh lệnh-pháp lý tự nhiên trong tiếng Việt hiện đại và không làm thay đổi ngôi số của mệnh lệnh gốc.
