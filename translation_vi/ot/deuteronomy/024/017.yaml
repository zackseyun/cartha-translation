revisions:
- from: Ngươi không được làm sai lệch công lý dành cho ngoại kiều hoặc trẻ mồ côi[a], cũng không được lấy áo của góa phụ làm vật cầm cố.
  to: Không được làm sai lệch công lý dành cho người ngoại kiều hoặc trẻ mồ côi[a], cũng không được lấy y phục của góa phụ làm vật cầm cố.
  rationale: Sửa “áo” thành “y phục” để phản ánh nghĩa khái quát của בֶּגֶד, và lược “ngươi” để câu luật lệ có văn phong hiện đại hơn. Chú thích được chỉnh nhẹ để bỏ lựa chọn “khách kiều ngụ” không tự nhiên trong tiếng Việt hiện đại, trong khi vẫn bảo tồn các khả năng từ vựng và sắc thái của nguyên ngữ.
