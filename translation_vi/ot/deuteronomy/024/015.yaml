revisions:
- from: Hãy trả tiền công cho người ấy ngay trong ngày[a], đừng để mặt trời lặn mà tiền công vẫn chưa được trả, vì người ấy nghèo khó và trông cậy vào tiền công đó để sống. Nếu không, người ấy có thể kêu cầu Yahweh tố cáo anh em, và anh em sẽ mắc tội.
  to: Hãy trả tiền công cho người ấy ngay trong ngày[a], đừng để mặt trời lặn mà tiền công vẫn chưa được trả, vì người ấy nghèo khó và trông cậy vào tiền công đó để sống. Kẻo người ấy kêu cầu Yahweh chống lại anh em, và anh em sẽ mắc tội.
  rationale: Sửa mệnh đề cảnh báo thành “Kẻo ...” để phản ánh chức năng của mệnh đề Hê-bơ-rơ, thay “tố cáo” bằng “chống lại” để làm rõ người lao động kêu cầu Yahweh chống lại người chủ, và điều chỉnh chú thích để không diễn giải quá mức “trong ngày của người ấy”. Các lựa chọn từ ngữ còn lại được giữ vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
