  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: vi
  text: Hãy trả tiền công cho người ấy ngay trong ngày[a], đừng để mặt trời lặn mà tiền công vẫn chưa được trả, vì người ấy nghèo khó và trông cậy vào tiền công đó để sống. Kẻo người ấy kêu cầu Yahweh chống lại anh em, và anh em sẽ mắc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong ngày của người ấy,” tức là trong ngày khoản tiền công phải được trả.'
    reason: Giữ lại thành ngữ Hê-bơ-rơ và giải thích ý nghĩa thời gian trong ngữ cảnh trả công, không giới hạn nó vào ngày làm việc.
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: ngay trong ngày
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “trong ngày của người ấy”; trong luật trả công, cách nói tự nhiên này diễn đạt việc phải thanh toán đúng ngày người lao động làm việc.
- source_word: שְׂכָרוֹ
  choice: tiền công
  rationale: Chỉ khoản thù lao mà người lao động đã làm để nhận; “tiền công” rõ ràng và phù hợp ngữ cảnh.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: đừng để mặt trời lặn mà tiền công vẫn chưa được trả
  rationale: Thành ngữ đặt thời hạn thanh toán trước lúc mặt trời lặn. Đại từ nhiều khả năng quy chiếu đến tiền công; bản dịch làm rõ ý mà vẫn giữ hình ảnh mặt trời lặn.
- source_word: כִּי עָנִי הוּא
  choice: vì người ấy nghèo khó
  rationale: עָנִי trong ngữ cảnh này nói đến tình trạng thiếu thốn và dễ bị tổn thương về kinh tế.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: trông cậy vào tiền công đó để sống
  rationale: Thành ngữ có nghĩa đen gần như “hướng/nâng mạng sống mình về phía nó,” diễn tả sự lệ thuộc cấp thiết vào tiền công để duy trì cuộc sống.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: Nếu không, người ấy có thể kêu cầu Yahweh tố cáo anh em
  rationale: וְלֹא trong chuỗi mệnh lệnh nêu hậu quả cần tránh; “kêu cầu ... tố cáo” truyền đạt lời thỉnh cầu của người bị áp bức chống lại kẻ giữ tiền công.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, không thay bằng một tước hiệu.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: anh em sẽ mắc tội
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho việc tội bị kể cho người vi phạm, giữ nguyên sức nặng đạo đức của câu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của וְהָיָה בְךָ חֵטְא
  choice: anh em sẽ mắc tội
  alternative: tội sẽ ở trong anh em
  rationale: Cách chọn không biến câu thành một khẳng định giáo lý kỹ thuật về bản thể của tội, nhưng diễn đạt tự nhiên trách nhiệm đạo đức mà tiếng Hê-bơ-rơ gán cho người vi phạm.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng “anh em” cho đại từ số ít giống đực nhằm giữ lối xưng hô cộng đồng quen thuộc trong Phục Truyền Luật Lệ Ký. Cấu trúc được điều chỉnh để tự nhiên trong tiếng Việt, đồng thời bảo tồn hình ảnh mặt trời lặn, tình trạng nghèo khó, lời kêu cầu lên Yahweh và hậu quả là mắc tội.
