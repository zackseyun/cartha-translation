  text: הִשָּׁ֧מֶר בְּ/נֶֽגַע הַ/צָּרַ֛עַת לִ/שְׁמֹ֥ר מְאֹ֖ד וְ/לַ/עֲשׂ֑וֹת כְּ/כֹל֩ אֲשֶׁר יוֹר֨וּ אֶתְ/כֶ֜ם הַ/כֹּהֲנִ֧ים הַ/לְוִיִּ֛ם כַּ/אֲשֶׁ֥ר צִוִּיתִ֖/ם תִּשְׁמְר֥וּ לַ/עֲשֽׂוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: vi
  text: 'Hãy cẩn thận trong trường hợp có chứng bệnh ngoài da[a]: anh em phải hết sức tuân giữ và làm theo mọi điều các thầy tế lễ người Lê-vi chỉ dẫn. Như tôi đã truyền cho họ, anh em phải cẩn thận làm theo như vậy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo cách dịch truyền thống là “bệnh phong”. Từ Hê-bơ-rơ này trong Torah chỉ nhiều loại tổn thương hoặc tình trạng ngoài da, không riêng bệnh Hansen ngày nay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Hãy cẩn thận
  rationale: Thể mệnh lệnh Niphal của שׁמר mang sắc thái cảnh báo, khuyên phải thận trọng; cách dịch này tự nhiên và giữ nguyên lực mệnh lệnh.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: khi có tổn thương ngoài da
  rationale: נֶגַע chỉ vết hoặc tổn thương, còn צָרַעַת trong luật Torah bao quát nhiều tình trạng ngoài da, không chỉ bệnh Hansen; cách diễn đạt này vừa tự nhiên vừa tránh xác định bệnh trạng quá hẹp.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: phải hết sức tuân giữ và làm theo
  rationale: Giữ cả hai ý chú tâm tuân giữ và thực hiện, đồng thời chuyển tải sức nhấn mạnh của מְאֹד.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: làm theo mọi điều ... chỉ dẫn anh em
  rationale: Hiphil của ירה có nghĩa dạy bảo, hướng dẫn hoặc chỉ dẫn; trong ngữ cảnh luật tế lễ, “chỉ dẫn” là tự nhiên và thích hợp.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: các thầy tế lễ người Lê-vi
  rationale: Cụm từ được hiểu là các thầy tế lễ thuộc chi phái Lê-vi, một cách gọi đặc trưng trong Phục Truyền Luật Lệ Ký, chứ không phải hai nhóm riêng biệt.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: Như tôi đã truyền cho họ
  rationale: Động từ ngôi thứ nhất số ít cùng hậu tố ngôi thứ ba số nhiều cho thấy Môi-se đã truyền lệnh cho các thầy tế lễ.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: anh em phải cẩn thận làm theo như vậy
  rationale: Phản ánh sự lặp lại của cấu trúc שׁמר + לעשות và sắc thái bắt buộc-khuyên nhủ; “như vậy” liên kết rõ với mệnh đề so sánh đứng trước.
theological_decisions:
- issue: Cách dịch צָרַעַת
  choice: tổn thương ngoài da
  alternative: bệnh phong; bệnh ngoài da
  rationale: Thuật ngữ Torah rộng hơn bệnh phong theo nghĩa bệnh Hansen hiện đại. “Tổn thương ngoài da” tránh áp đặt một chẩn đoán y khoa lỗi thời mà vẫn phù hợp với bối cảnh luật nghi lễ.
- issue: Nhận diện הַכֹּהֲנִים הַלְוִיִּם
  choice: các thầy tế lễ người Lê-vi
  alternative: các thầy tế lễ, tức người Lê-vi; các thầy tế lễ và người Lê-vi
  rationale: 'Cú pháp và cách dùng trong Phục Truyền Luật Lệ Ký ủng hộ việc hiểu đây là một nhóm: những thầy tế lễ thuộc Lê-vi, không phải hai nhóm tách biệt.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng giao ước; giữ sự lặp ý của bản Hê-bơ-rơ để thể hiện tính nhấn mạnh.
