base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: vi
  text: Khi anh em cho người lân cận vay bất cứ thứ gì, đừng vào nhà người ấy để lấy vật cầm cố.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong điều luật theo tình huống này, כִּי mở đầu một trường hợp giả định thường gặp; “khi” tự nhiên, còn “nếu” cũng có thể hiểu được.
- source_word: תַשֶּׁה
  choice: cho ... vay
  rationale: Thể Hiphil của נשה ở đây chỉ việc cho vay hoặc cấp tín dụng; “cho ... vay” là cách diễn đạt tiếng Việt tự nhiên.
- source_word: בְרֵעֲךָ
  choice: người lân cận
  rationale: רֵעַ chỉ một người đồng cộng đồng hoặc người có quan hệ gần gũi; “người lân cận” giữ được sắc thái liên cá nhân mà không thu hẹp thành bạn thân.
- source_word: מַשַּׁאת מְאוּמָה
  choice: bất cứ thứ gì
  rationale: Cụm từ nói đến một khoản cho vay thuộc bất kỳ loại nào; kết hợp với “cho ... vay”, cách dịch này truyền đạt đủ ý mà tránh lặp từ nặng nề.
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: đừng vào nhà người ấy
  rationale: לֹא với động từ chưa hoàn thành mang lực cấm đoán trong văn luật; “đừng” rõ ràng, tự nhiên và trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: לַעֲבֹט
  choice: để lấy
  rationale: Động từ עבט trong ngữ cảnh chỉ việc nhận hoặc lấy tài sản làm bảo đảm; “lấy” không hàm ý cưỡng đoạt quá mức như “tịch thu”.
- source_word: עֲבֹטוֹ
  choice: vật cầm cố
  rationale: Danh từ chỉ đồ vật được giao làm bảo đảm cho khoản vay; “vật cầm cố” chính xác và dễ hiểu trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ rõ ràng, trang nghiêm nhưng hiện đại. Dùng “anh em” cho ngôi thứ hai số ít hướng đến thành viên cộng đồng giao ước; “người ấy” tránh giả định giới tính không cần thiết trong tiếng Việt.
