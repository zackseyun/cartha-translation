    issue: Chú thích sát nghĩa dùng “thuộc về một người đàn ông khác.”
    rationale: Cụm Hê-bơ-rơ לְאִישׁ אַחֵר có nghĩa đen là “với/cho một người đàn ông khác,” chứ không phải động từ hay khái niệm “thuộc về.” Dù câu chính giải thích đúng thành ngữ theo ngữ cảnh, chú thích hiện tại vừa không sát chữ vừa có thể thêm sắc thái sở hữu.
