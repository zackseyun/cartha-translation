  language: vi
  text: rồi nàng rời khỏi nhà người ấy, ra đi và trở thành vợ của một người đàn ông khác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “với một người đàn ông khác.” Trong ngữ cảnh này, thành ngữ Hê-bơ-rơ có nghĩa là nàng kết hôn với một người đàn ông khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: rồi nàng rời khỏi nhà người ấy
  rationale: Động từ יצא với giới từ מן diễn tả việc đi ra khỏi nhà. “Rời khỏi nhà” là cách nói tự nhiên trong tiếng Việt, vẫn thể hiện đầy đủ điểm xuất phát; “rồi” nối tiếp trình tự của điều luật.
- source_word: וְהָלְכָה
  choice: ra đi
  rationale: הלך đánh dấu hành động kế tiếp sau khi rời nhà. “Ra đi” tự nhiên hơn việc lặp lại “đi” và không xác định thêm phương thức hay đích đến.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: và trở thành vợ của một người đàn ông khác
  rationale: היה với ל diễn tả việc bước vào một quan hệ hay tình trạng mới. Trong ngữ cảnh ly hôn và tái hôn, câu nói đến việc nàng trở thành vợ của người khác; từ “vợ” được bổ sung để diễn đạt rõ thành ngữ Hê-bơ-rơ.
theological_decisions: []
