source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: vi
  text: Nếu một người bị phát hiện đã bắt cóc một người anh em mình thuộc dân Y-sơ-ra-ên[a], rồi bắt người ấy làm nô lệ và bán người ấy, thì kẻ bắt cóc đó phải chết. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người anh em” ở đây chỉ một người đồng bào Y-sơ-ra-ên, không nhất thiết là anh em ruột.
    reason: cultural_note
lexical_decisions:
- source_word: יִמָּצֵא אִישׁ
  choice: Nếu phát hiện một người
  rationale: Cách diễn đạt điều luật tự nhiên trong tiếng Việt, phản ánh thể bị động của יִמָּצֵא mà không buộc phải dùng cấu trúc nặng nề “một người bị phát hiện”.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: bắt cóc một người
  rationale: Thành ngữ theo nghĩa đen là “đánh cắp một người”; trong ngữ cảnh pháp luật, “bắt cóc” truyền đạt chính xác hành vi cưỡng đoạt con người.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: một người anh em của mình trong con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh thân tộc giao ước của אָח và đồng thời để cụm tiếp theo xác định đây là một người đồng bào Y-sơ-ra-ên, không nhất thiết là anh em ruột.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: bắt người ấy làm nô lệ
  rationale: Trong mạch bắt cóc rồi đem bán, động từ chỉ việc đối xử với nạn nhân như tài sản hay nô lệ; cách dịch này rõ nghĩa và không làm nhẹ tính cưỡng bức.
- source_word: וּמְכָרוֹ
  choice: và bán đi
  rationale: Diễn đạt trực tiếp hành vi bán nạn nhân; đối tượng đã rõ từ vế trước nên “bán đi” tự nhiên trong tiếng Việt.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: thì kẻ bắt cóc đó phải chết
  rationale: “Kẻ bắt cóc” xác định rõ הַגַּנָּב là kẻ trộm người vừa được nói đến; “phải chết” phù hợp sắc thái chế tài của điều luật.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình
  rationale: Giữ công thức pháp lý lặp lại trong Phục Truyền Luật Lệ Ký; “trừ bỏ điều ác” trang trọng, rõ ràng, còn “anh em” diễn đạt đại từ số ít tập thể hướng đến cộng đồng.
theological_decisions:
- issue: Ngôn ngữ thân tộc giao ước trong điều luật
  choice: Giữ “một người anh em của mình” trong chính văn và làm rõ phạm vi bằng “trong con cái Y-sơ-ra-ên”.
  alternative: một người đồng bào Y-sơ-ra-ên
  rationale: Bản dịch giữ được hình ảnh gia đình của nguyên văn mà vẫn cho thấy đối tượng là thành viên của dân Y-sơ-ra-ên, không chỉ là anh em ruột.
- issue: Sắc thái của וְהִתְעַמֶּר בּוֹ
  choice: bắt người ấy làm nô lệ
  alternative: đối xử với người ấy như nô lệ; lợi dụng người ấy
  rationale: Ngữ cảnh bắt cóc và bán người đòi hỏi giữ rõ tình trạng nô dịch; “lợi dụng” quá rộng, còn cách đã chọn truyền đạt trực tiếp hành vi biến nạn nhân thành nô lệ mà không thêm một hệ thống thần học riêng.
- issue: Đối tượng của mệnh lệnh kết thúc
  choice: Dùng “anh em” để chỉ cộng đồng được ngỏ lời.
  alternative: ngươi
  rationale: Đại từ Hê-bơ-rơ ở số ít nhưng thường ngỏ lời với Y-sơ-ra-ên như một tập thể. “Anh em” tự nhiên hơn trong tiếng Việt hiện đại và tránh làm câu bị hiểu là chỉ nhắm đến một cá nhân.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại, dùng câu điều kiện rõ ràng. Giữ cách gọi giao ước “con cái Y-sơ-ra-ên” và “người anh em”, đồng thời tránh lối dịch quá sát chữ như “đánh cắp một linh hồn/người”. Danh xưng Y-sơ-ra-ên theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
