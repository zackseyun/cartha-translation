revisions:
- from: Nếu phát hiện một người bắt cóc một người anh em của mình trong con cái Y-sơ-ra-ên[a], rồi bắt người ấy làm nô lệ và bán đi, thì kẻ bắt cóc đó phải chết. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.
  to: Nếu một người bị phát hiện đã bắt cóc một người anh em mình thuộc dân Y-sơ-ra-ên[a], rồi bắt người ấy làm nô lệ và bán người ấy, thì kẻ bắt cóc đó phải chết. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.
