review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh đứng ngoài nhà và việc người vay đem vật bảo đảm ra. Tuy nhiên, “anh em” trong tiếng Việt thông thường là số nhiều, trong khi nguyên văn nhất quán dùng ngôi thứ hai số ít giống đực. Cần thay bằng một cách xưng hô số ít phù hợp văn phong luật lệ Kinh Thánh. Việc thêm “ngoài” sau “ra” cũng làm rõ hướng chuyển động của הַחוּצָה.
  naturalness: “Ngươi” là lối xưng hô số ít đã định hình trong văn phong Kinh Thánh Việt ngữ và phù hợp với lời luật trực tiếp. “Đem vật cầm cố ra ngoài cho ngươi” tự nhiên, rõ ràng, và giữ được cả hướng ra ngoài lẫn hướng đến người cho vay.
  terminology: “Vật cầm cố” diễn đạt tốt הָעֲבוֹט, là vật dùng làm bảo đảm cho khoản vay. Chú thích nên đổi đại từ tương ứng và nêu cách hiểu thay thế một cách tự nhiên hơn.
  issues:
  - severity: medium
    issue: “Anh em” không bảo toàn ngôi thứ hai số ít của nguyên văn.
    rationale: Đại từ và các hình thức động từ trong câu Hê-bơ-rơ là số ít giống đực. Dù “anh em” đôi khi được dùng theo lối cộng đồng, trong tiếng Việt hiện đại nó thường được hiểu là số nhiều; lý do trong hồ sơ cho rằng nó không làm câu thành số nhiều không thuyết phục.
  - severity: low
    issue: Bản dịch chưa biểu đạt tường minh yếu tố hướng ra ngoài ở הַחוּצָה.
    rationale: “Mang ... ra cho” có thể hiểu được trong ngữ cảnh, nhưng “ra ngoài” diễn đạt minh bạch hơn việc vật được đem từ trong nhà ra bên ngoài, đồng thời vẫn tự nhiên.
  revised_text: Ngươi phải đứng ở bên ngoài, còn người mà ngươi cho vay phải đem vật cầm cố ra ngoài cho ngươi.[a]
