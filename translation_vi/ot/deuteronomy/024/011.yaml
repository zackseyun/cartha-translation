base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/011.yaml
  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: vi
  text: Ngươi phải đứng ở bên ngoài, còn người mà ngươi cho vay phải đem vật cầm cố ra ngoài cho ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người mắc nợ ngươi”. Cách diễn đạt Hê-bơ-rơ có thể nhấn mạnh hành động cho vay của chủ nợ hoặc tình trạng mắc nợ của người vay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: ở ngoài
  rationale: Cụm từ chỉ vị trí bên ngoài căn nhà; “ở ngoài” tự nhiên trong tiếng Việt và phù hợp với quy định không được vào nhà người vay.
- source_word: תַּעֲמֹד
  choice: phải đứng
  rationale: Động từ עמד trước hết mang nghĩa cụ thể là “đứng”; trong văn cảnh cũng hàm ý chờ ở ngoài. “Phải đứng” giữ được hình ảnh và lực mệnh lệnh.
- source_word: וְהָאִישׁ
  choice: còn người
  rationale: הָאִישׁ chỉ người đàn ông trong tình huống luật định. Tiếng Việt thường dùng “người” tự nhiên hơn khi danh tính đã được xác định bằng mệnh đề theo sau, mà không làm thay đổi đối tượng được nói đến.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: mà anh em cho vay
  rationale: Cụm từ mô tả quan hệ chủ nợ–con nợ và có thể nhìn từ hành động cho vay hoặc tình trạng mắc nợ. Bản chính dùng cách diễn đạt theo phía người cho vay, đồng thời giữ cách hiểu kia trong chú thích.
- source_word: יוֹצִיא
  choice: sẽ mang ... ra
  rationale: Dạng Hiphil của יצא có nghĩa khiến vật đi ra, tức “mang ra”; kết hợp tự nhiên với הַחוּצָה trong tiếng Việt.
- source_word: אֵלֶיךָ
  choice: cho anh em
  rationale: Giới từ diễn tả hướng về phía chủ nợ. Trong câu tiếng Việt, “mang ... ra cho anh em” diễn đạt tự nhiên đích đến và người nhận.
- source_word: הָעֲבוֹט
  choice: vật cầm cố
  rationale: Danh từ chỉ vật được giao làm bảo đảm cho khoản vay. “Vật cầm cố” rõ nghĩa, thông dụng và phù hợp với ngữ cảnh pháp luật hơn từ kỹ thuật hiện đại “tài sản thế chấp”.
- source_word: הַחוּצָה
  choice: ra
  rationale: Dạng chỉ hướng có nghĩa “ra phía ngoài”; “ra” vừa bảo toàn chuyển động từ trong nhà ra ngoài vừa tránh lặp vụng về.
theological_decisions:
- issue: Chủ thể số ít giống đực ngôi thứ hai
  choice: anh em
  alternative: ngươi
  rationale: Tiếng Hê-bơ-rơ dùng đại từ số ít giống đực để nói với từng thành viên trong cộng đồng giao ước. “Anh em” là lối xưng hô hiện đại, trang trọng vừa phải và dễ hiểu; không biến mệnh lệnh thành số nhiều về mặt nội dung.
translation_notes:
  register: Văn phong luật định hiện đại, rõ ràng và trang trọng. Dùng “phải” cho lực mệnh lệnh, “vật cầm cố” cho thuật ngữ pháp lý dễ hiểu, và giữ sự mơ hồ của quan hệ tín dụng bằng chú thích.
