- from: Anh em phải đứng ở ngoài, còn người mà anh em cho vay[a] sẽ mang vật cầm cố ra cho anh em.
  to: Ngươi phải đứng ở bên ngoài, còn người mà ngươi cho vay phải đem vật cầm cố ra ngoài cho ngươi.[a]
  rationale: Bản sửa thay đại từ số nhiều bằng “ngươi” để phản ánh đúng người được trực tiếp nói đến trong nguyên văn, duy trì ngữ vực luật lệ Kinh Thánh, và làm rõ chuyển động “ra ngoài”. Không quyết định thay cho sự mơ hồ có kiểm soát của cụm từ chỉ quan hệ chủ nợ–con nợ; chú thích vẫn giữ cách hiểu thay thế.
