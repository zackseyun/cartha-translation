revisions:
- from: Hãy nhớ rằng anh em từng làm nô lệ tại Ai Cập, và Yahweh, Đức Chúa Trời của anh em, đã chuộc anh em khỏi đó. Vì vậy, tôi truyền cho anh em phải làm điều này.
  to: Hãy nhớ rằng anh em đã là nô lệ tại Ai Cập, và Yahweh, Đức Chúa Trời của anh em, đã chuộc anh em khỏi đó. Vì vậy, tôi truyền cho anh em phải làm điều này.
  rationale: Chỉ thay “từng làm nô lệ” bằng “đã là nô lệ” để phản ánh trực tiếp và đầy đủ hơn thân phận bị ràng buộc được nêu trong nguyên ngữ. Các thành phần còn lại được giữ nguyên vì truyền đạt trung thành nội dung và quan hệ lập luận của câu.
