source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: vi
  text: Hãy nhớ rằng anh em đã là nô lệ tại Ai Cập, và Yahweh, Đức Chúa Trời của anh em, đã chuộc anh em khỏi đó. Vì vậy, tôi truyền cho anh em phải làm điều này.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Hãy nhớ
  rationale: Dạng Qal hoàn thành ngôi hai số ít, nối bằng וְ, mang chức năng mệnh lệnh trong ngữ cảnh. “Hãy nhớ” diễn đạt tự nhiên lực khuyên truyền trực tiếp.
- source_word: כִּי
  choice: rằng
  rationale: Ở đây כִּי giới thiệu nội dung cần ghi nhớ, chứ không chủ yếu nêu nguyên nhân.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Từ này chỉ thân phận bị ràng buộc của Israel tại Ai Cập; “nô lệ” giữ nguyên sức nặng xã hội và đạo đức của câu.
- source_word: בְּמִצְרַיִם
  choice: tại Ai Cập
  rationale: Dịch trực tiếp địa danh mà không thêm “xứ”, vì từ ấy không có trong câu Hebrew.
- source_word: וַיִּפְדְּךָ
  choice: đã chuộc anh em
  rationale: פדה diễn tả việc giải cứu bằng hành động chuộc; “chuộc” giữ được sắc thái giải phóng và ý nghĩa thần học của động từ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cách diễn đạt tự nhiên cho danh từ với hậu tố sở hữu ngôi hai số ít, trong lời nói với Israel như một cộng đồng.
- source_word: מִשָּׁם
  choice: khỏi đó
  rationale: Chỉ về Ai Cập; “khỏi đó” tự nhiên trong tiếng Việt và phù hợp với ý được giải thoát ra khỏi nơi ấy.
- source_word: עַל כֵּן
  choice: Vì vậy
  rationale: Nêu kết luận đạo đức phát sinh từ việc Yahweh đã chuộc Israel.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: tôi truyền cho anh em
  rationale: Đại từ minh thị cùng phân từ nhấn mạnh hành động truyền lệnh hiện thời. “Tôi” xác định người nói là Môi-se mà không khiến lời ông nghe như lời phán trực tiếp của Đức Chúa Trời.
- source_word: לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה
  choice: phải làm điều này
  rationale: “Điều này” quy chiếu tự nhiên về luật lệ ngay trước đó; “phải” biểu đạt lực bắt buộc vốn có trong động từ “truyền” và cấu trúc mục đích.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản Hebrew dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tư cách danh riêng và không thay nó bằng tước hiệu.
- issue: Thân phận עֶבֶד của Israel tại Ai Cập
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Bối cảnh nhấn mạnh tình trạng bị áp bức và lệ thuộc; “nô lệ” truyền đạt điều này rõ hơn, đồng thời làm nổi bật nền tảng đạo đức của mệnh lệnh.
- issue: Số ít ngữ pháp của lời xưng hô
  choice: anh em
  alternative: ngươi
  rationale: Hebrew dùng ngôi hai số ít để nói với Israel như một tập thể. “Anh em” là lối xưng hô cộng đồng tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại, dù không biểu thị hình thái số ít của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho Israel như cộng đồng giao ước, tránh “ngươi” vì dễ tạo sắc thái cổ hoặc miệt thị trong tiếng Việt hiện nay. Hai mệnh đề được tách thành hai câu để quan hệ nguyên nhân–mệnh lệnh rõ ràng mà vẫn giữ nguyên nội dung.
