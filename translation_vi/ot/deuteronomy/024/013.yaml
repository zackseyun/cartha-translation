  terminology: “Vật cầm cố,” “áo choàng,” “chúc phước,” “sự công chính,” và “Yahweh, Đức Chúa Trời” đều phù hợp. Giữ “sự công chính” trong chính văn để không quyết định trước giữa sắc thái hành vi công chính và điều được kể là công chính; các khả năng được nêu ở chú thích.
  issues:
