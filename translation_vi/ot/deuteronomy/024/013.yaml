  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: vi
  text: Nhất định phải trả lại vật cầm cố cho người ấy khi mặt trời lặn[a], để người ấy có thể ngủ trong áo choàng của mình và chúc phước cho anh; điều đó sẽ là sự công chính[b] cho anh trước mặt Yahweh, Đức Chúa Trời của anh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vật thế chấp” hoặc “vật đã nhận làm bảo đảm.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “điều đó sẽ được kể là sự công chính cho anh” hoặc “đó sẽ là một việc công chính của anh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: Hãy nhất định trả lại
  rationale: Cấu trúc nguyên thể tuyệt đối đi cùng động từ hữu hạn nhấn mạnh mệnh lệnh; cách dịch này giữ được sức nhấn mà vẫn tự nhiên trong tiếng Việt.
- source_word: הַעֲבוֹט
  choice: vật cầm cố
  rationale: Danh từ chỉ vật được giữ làm bảo đảm cho khoản vay; “vật cầm cố” rõ nghĩa và phù hợp văn cảnh luật pháp.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: khi mặt trời lặn
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ lúc hoàng hôn; cách dịch trực tiếp này rõ ràng trong tiếng Việt.
- source_word: וְשָׁכַב
  choice: để người ấy có thể nằm ngủ
  rationale: Trong văn cảnh, mệnh đề diễn tả mục đích hoặc kết quả của việc trả áo trước đêm; “nằm ngủ” làm rõ công dụng của áo mà không diễn giải quá mức.
- source_word: בְּשַׂלְמָתוֹ
  choice: trong áo choàng của mình
  rationale: שַׂלְמָה là áo ngoài, ở đây cũng được dùng làm đồ đắp khi ngủ; “áo choàng” truyền đạt chức năng cụ thể hơn “áo” nói chung.
- source_word: וּבֵרֲכֶךָּ
  choice: và chúc phước cho anh
  rationale: Chủ thể là người nghèo nhận lại vật cầm cố, còn hậu tố ngôi hai số ít chỉ người cho vay.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: việc đó sẽ là sự công chính cho anh
  rationale: Giữ gần cấu trúc Hê-bơ-rơ và bảo tồn độ mở giữa ý nghĩa phẩm chất đúng đắn, hành vi công chính và điều được kể là công chính.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: trước mặt Yahweh, Đức Chúa Trời của anh
  rationale: “Trước mặt” thể hiện quan hệ hiện diện/đánh giá của לִפְנֵי; tên giao ước יהוה được phiên âm là “Yahweh” theo lớp tham khảo đã cung cấp.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn tính chất tên riêng và phù hợp quyết định thần học của lớp tham khảo, không đồng nhất danh ấy với tước hiệu.
- issue: Ý nghĩa của צְדָקָה
  choice: sự công chính
  alternative: một việc công chính; được kể là công chính
  rationale: Cụm Hê-bơ-rơ có thể nói về địa vị được nhìn nhận là công chính hoặc về hành động đúng đắn. Bản chính giữ cách nói gần nguyên văn, còn chú thích nêu các khả năng để tránh áp đặt một cách hiểu thần học duy nhất.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh/người ấy” để thể hiện ngôi hai số ít và ngôi ba số ít mà không làm câu quá cổ; “hãy nhất định” giữ sức nhấn của cấu trúc Hê-bơ-rơ. Mọi dấu chú thích đều xuất hiện trong chính văn.
