  - severity: low
    issue: Chú thích [b] chưa được đặt sát cụm từ mà chú thích giải thích.
    rationale: Nội dung chú thích [b] giải thích “sự công chính”; nên neo chú thích ngay sau cụm này, thay vì sau toàn câu.
