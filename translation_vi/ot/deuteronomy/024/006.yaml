  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: vi
  text: Không ai được lấy một bộ cối xay, hay dù chỉ thớt cối trên, làm vật cầm cố, vì người ấy lấy mạng sống làm vật cầm cố.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì người ấy lấy kế sinh nhai của người ta làm vật cầm cố.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: nhận ... làm vật cầm cố
  rationale: Trong bối cảnh luật pháp về khoản nợ, động từ חבל chỉ việc lấy hoặc giữ tài sản để bảo đảm khoản nợ. Cách dịch này tự nhiên trong tiếng Việt và giữ được sự lặp lại của từ trong nguyên văn.
- source_word: רֵחַיִם
  choice: cả cối xay
  rationale: Danh từ ở dạng đôi chỉ bộ cối gồm hai thớt đá; “cả cối xay” diễn đạt tự nhiên rằng không được lấy toàn bộ dụng cụ xay.
- source_word: וָרָכֶב
  choice: hay dù chỉ thớt cối trên
  rationale: 'רָכֶב là thớt đá phía trên của cối. “Hay dù chỉ” thể hiện lực pháp lý của câu: không được lấy cả bộ cối, cũng không được lấy ngay cả một bộ phận thiết yếu.'
- source_word: כִּי
  choice: vì
  rationale: Từ này dẫn vào lý do của lệnh cấm.
- source_word: נֶפֶשׁ
  choice: chính mạng sống của người ta
  rationale: Ở đây נֶפֶשׁ nói đến sự sống cụ thể bị đe dọa khi phương tiện làm ra thức ăn hằng ngày bị lấy đi; không nhất thiết mang nghĩa siêu hình là “linh hồn”.
- source_word: הוּא
  choice: như thế là
  rationale: 'Đại từ nhấn mạnh bản chất của hành động: người nhận vật cầm cố ấy thực chất đang nhận mạng sống của con nợ làm vật bảo đảm.'
theological_decisions:
- issue: Ý nghĩa của נֶפֶשׁ trong bối cảnh luật pháp và xã hội
  choice: mạng sống cụ thể
  alternative: kế sinh nhai; linh hồn; con người
  rationale: Cối xay là phương tiện thiết yếu để chuẩn bị lương thực, nên việc giữ nó làm vật cầm cố đe dọa sự sống của con nợ. Cách dịch giữ sức nặng đạo đức của nguyên văn mà không đưa vào một quan niệm giáo phái về bản tính con người.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Vật cầm cố” dễ hiểu và chính xác; “thớt cối trên” gọi rõ bộ phận của cối xay. Dấu chú thích được đặt sau toàn câu vì chú thích giải thích cách hiểu נֶפֶשׁ trong mệnh đề nêu lý do.
