revisions:
- from: Không ai được nhận cả cối xay hay dù chỉ thớt cối trên làm vật cầm cố, vì như thế là nhận chính mạng sống của người ta làm vật cầm cố.[a]
  to: Không ai được lấy một bộ cối xay, hay dù chỉ thớt cối trên, làm vật cầm cố, vì người ấy lấy mạng sống làm vật cầm cố.[a]
  rationale: Bản sửa dùng “lấy” để phản ánh chính xác hơn động từ חבל trong bối cảnh pháp lý, dùng “một bộ cối xay” để biểu đạt dạng đôi רֵחַיִם, và giữ sự lặp lại có chủ ý giữa “lấy” và “làm vật cầm cố.” “Mạng sống” vẫn được đặt trong văn bản chính; chú thích nêu “kế sinh nhai” như một cách diễn đạt theo ngữ cảnh, không thay thế nghĩa chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:37Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng lệnh cấm lấy cối xay làm vật bảo đảm và lý do rằng hành vi ấy tương đương với việc lấy mạng sống làm vật cầm cố. Tuy nhiên, “nhận” có thể gợi ý việc thụ động nhận tài sản hơn là chủ động lấy/xiết làm bảo đảm, trong khi חבל nhấn mạnh hành động lấy làm vật cầm cố. “Cả cối xay” cũng kém rõ hơn “một bộ cối xay” đối với dạng đôi רֵחַיִם.
  naturalness: Câu nhìn chung tự nhiên và đúng văn phong pháp luật hiện đại. Sửa “nhận” thành “lấy” và “cả cối xay” thành “một bộ cối xay” giúp câu rõ nghĩa, trực tiếp hơn. Cấu trúc “vì người ấy lấy mạng sống làm vật cầm cố” giữ được sắc thái nhấn mạnh và sự lặp lại của nguyên văn.
  terminology: “Vật cầm cố” và “thớt cối trên” phù hợp. “Mạng sống” diễn đạt tốt נֶפֶשׁ trong ngữ cảnh này; chú thích về “kế sinh nhai” bảo toàn lựa chọn diễn giải hợp lý mà không biến nó thành nghĩa duy nhất.
