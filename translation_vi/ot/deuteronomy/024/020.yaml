  text: כִּ֤י תַחְבֹּט֙ זֵֽיתְ/ךָ֔ לֹ֥א תְפָאֵ֖ר אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: vi
  text: Khi anh em đập cây ô-liu của mình, anh em không được quay lại hái nốt những quả còn sót[a]; số ấy phải dành cho ngoại kiều[b], người mồ côi cha[c] và người góa bụa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được thu hái sạch phần còn lại phía sau mình”; nghĩa là không được quay lại lượt thứ hai để lấy những quả ô-liu còn sót sau lượt đập cây đầu tiên.'
    reason: lexical_alternative
  - marker: b
    text: “Ngoại kiều” dịch từ גֵּר, chỉ người không thuộc dân bản địa nhưng đang cư trú giữa dân Israel; cũng có thể dịch là “người ngoại quốc cư trú”.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “trẻ mồ côi.” Từ này theo nghĩa đen nhấn mạnh người mất cha; trong các luật bảo trợ xã hội, nó chỉ người thiếu sự che chở và bảo đảm xã hội của cha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong luật lệ theo tình huống này, כִּי mở đầu hoàn cảnh xảy ra hành động, nên dịch tự nhiên theo nghĩa thời gian là “Khi”.
- source_word: תַחְבֹּט
  choice: đập ... để thu hoạch
  rationale: חבט chỉ việc đập hoặc rung cành để quả ô-liu rơi xuống; cách diễn đạt này làm rõ tập quán thu hoạch mà vẫn giữ hình ảnh cụ thể của nguyên văn.
- source_word: זֵיתְךָ
  choice: cây ô-liu của mình
  rationale: זַיִת có thể chỉ quả ô-liu hoặc cây ô-liu; động từ “đập” cho thấy ở đây là cây. Hậu tố ngôi thứ hai số ít được diễn đạt bằng “của mình” sau đại từ xưng hô tập thể “anh em”.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: không được quay lại hái nốt những trái còn sót
  rationale: Trong luật thu hoạch, cụm từ này cấm trở lại thu gom sạch phần quả còn sót sau lượt đầu. Bản dịch truyền đạt rõ ý lượt thu hoạch thứ hai mà không gán cho động từ một nghĩa kỹ thuật quá hẹp.
- source_word: לַגֵּר
  choice: cho ngoại kiều
  rationale: גֵּר là người không thuộc dân bản địa nhưng cư trú giữa cộng đồng Israel. “Ngoại kiều” ngắn gọn và phù hợp văn phong pháp luật hiện đại; chú thích giải thích sắc thái cư trú.
- source_word: לַיָּתוֹם
  choice: cho trẻ mồ côi
  rationale: יָתוֹם chỉ người con mất cha hoặc cha mẹ và vì thế dễ bị tổn thương về xã hội. “Trẻ mồ côi” là cách nói tự nhiên, thông dụng trong tiếng Việt; chú thích bảo tồn khả năng hiểu cụ thể là mất cha.
- source_word: וְלָאַלְמָנָה
  choice: và người góa bụa
  rationale: Đây là cách dịch chuẩn, trang trọng và dễ hiểu của אַלְמָנָה.
- source_word: יִהְיֶה
  choice: số ấy phải dành
  rationale: Động từ “là” ở đây biểu thị sự phân định theo luật đối với phần quả còn lại. “Phải dành” truyền đạt nghĩa vụ pháp lý tự nhiên hơn trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. Dùng “anh em” để chuyển đại từ ngôi thứ hai giống đực số ít mang tính đại diện trong lời dạy dành cho cộng đồng; tránh “ngươi” vì cổ và xa lạ với độc giả phổ thông. Câu giữ hình ảnh đập cây ô-liu, đồng thời diễn đạt rõ lệnh không quay lại thu sạch phần còn sót.
