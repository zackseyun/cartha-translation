revisions:
- from: Khi đập cây ô-liu của mình để thu hoạch, anh em không được quay lại hái nốt những trái còn sót[a]; số ấy phải dành cho ngoại kiều[b], trẻ mồ côi[c] và người góa bụa.
  to: Khi anh em đập cây ô-liu của mình, anh em không được quay lại hái nốt những quả còn sót[a]; số ấy phải dành cho ngoại kiều[b], người mồ côi cha[c] và người góa bụa.
  rationale: Bỏ phần mục đích được thêm vào ngoài nguyên văn. Đổi “trẻ mồ côi” thành “người mồ côi cha” để phản ánh sát hơn יָתוֹם trong công thức pháp lý, đồng thời giữ “trẻ mồ côi” như một phương án trong chú thích. Các yếu tố còn lại của bản dịch được giữ vì vừa trung thành với văn bản vừa tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng bối cảnh luật thu hoạch: đập cây ô-liu, không trở lại thu phần còn lại, và để phần ấy cho ba nhóm dễ bị tổn thương. Tuy nhiên, cụm thêm “để thu hoạch” không có trong tiếng Hê-bơ-rơ và không cần thiết. “Trẻ mồ côi” là cách hiểu khả dĩ của יָתוֹם, nhưng bản văn pháp luật này đặc biệt có thể chỉ người mất cha; nên cách dịch chính cần bảo lưu nét này rõ hơn.'
  naturalness: Câu văn nhìn chung tự nhiên, hiện đại và phù hợp với văn phong luật lệ. “Người mồ côi cha” tự nhiên vừa đủ trong ngữ cảnh trang trọng, đồng thời chính xác hơn “trẻ mồ côi”.
  terminology: “Ngoại kiều” phù hợp thanh ghi pháp lý và chú thích đã giải thích đúng nghĩa của גֵּר là người không thuộc dân bản địa đang cư trú trong Israel. “Người góa bụa” là cách gọi thông dụng cho אַלְמָנָה trong tiếng Việt Kinh Thánh, dù từ Hê-bơ-rơ là giống cái. Chú thích về người mồ côi cần tránh khẳng định quá rộng rằng từ này thường chỉ cả trẻ mất cha lẫn cha mẹ; nên nêu rõ nghĩa chính trong ngữ cảnh này là người mất cha, với “trẻ mồ côi” là cách dịch rộng hơn.
  issues:
  - severity: low
    issue: Thêm cụm “để thu hoạch”
    rationale: Nguyên văn chỉ nói “khi ngươi đập cây ô-liu của ngươi”; mục đích thu hoạch đã hàm ý trong hành động và không cần bổ sung vào bản dịch chính.
  - severity: medium
    issue: “Trẻ mồ côi” làm rộng nghĩa của יָתוֹם
    rationale: Trong công thức luật lệ “ngoại kiều, người mất cha, góa phụ,” יָתוֹם nhấn mạnh người không có cha/bị mất cha. “Trẻ mồ côi” có thể gợi người mất cả cha lẫn mẹ và thêm giới hạn tuổi không được nêu trong tiếng Hê-bơ-rơ.
