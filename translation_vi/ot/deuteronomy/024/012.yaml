  yaml_path: translation/ot/deuteronomy/024/012.yaml
  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: vi
  text: Còn nếu người ấy nghèo, anh em không được đi ngủ khi vẫn giữ vật thế chấp của người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “không được nằm ngủ với vật thế chấp của người ấy”; nghĩa là không được giữ qua đêm món đồ người ấy đã giao để bảo đảm khoản vay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một điều kiện tiếp nối câu trước; “nhưng nếu” diễn đạt tự nhiên sự chuyển sang trường hợp người vay nghèo.
- source_word: אִישׁ עָנִי הוּא
  choice: người ấy nghèo
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ nghĩa chỉ một người nam đã được nói đến trong ngữ cảnh mà không dùng cách nói nặng nề “một người đàn ông nghèo”.
- source_word: לֹא תִשְׁכַּב
  choice: không được đi ngủ
  rationale: Động từ שׁכב có nghĩa nằm xuống hoặc ngủ; trong luật này, cụm từ nói đến việc qua đêm trong khi còn giữ vật cầm cố.
- source_word: בַּעֲבֹטוֹ
  choice: khi vẫn giữ vật thế chấp của người ấy
  rationale: 'עֲבוֹט là vật được giao để bảo đảm khoản vay. Cách dịch này làm rõ ý nghĩa ngữ cảnh của giới từ ב: không được giữ vật ấy qua đêm.'
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” để chỉ người nghe số ít theo lối xưng hô quen thuộc trong Phục Truyền Luật Lệ Ký; câu chính diễn đạt rõ hàm ý của thành ngữ Hê-bơ-rơ, còn chú thích bảo lưu hình ảnh sát chữ.
