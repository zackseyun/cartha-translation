source:
  edition: WLC
  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: vi
  text: Không được xử tử cha vì con trai[a], cũng không được xử tử con trai vì cha; mỗi người sẽ bị xử tử vì tội của chính mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con cái”; nguyên văn Hê-bơ-rơ dùng từ “con trai” trong cả hai vế.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ nói cụ thể đến việc bị làm cho chết, tức bị xử tử, chứ không chỉ đơn thuần là chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: bị xử tử
  rationale: Thể Hophil của מות mang nghĩa khiến phải chết ở dạng bị động; trong văn cảnh luật pháp, “bị xử tử” diễn đạt rõ hình phạt tử hình hơn “chết” và tự nhiên hơn cách nói sát chữ “bị làm cho chết”.
- source_word: אָבוֹת
  choice: cha
  rationale: Danh từ Hê-bơ-rơ chỉ những người cha, không phải từ trung tính chỉ cha mẹ. Tiếng Việt có thể dùng danh từ tập hợp không cần đánh dấu số nhiều.
- source_word: בָּנִים
  choice: con trai
  rationale: Từ Hê-bơ-rơ theo nghĩa đen là “các con trai”. Cách dịch này bảo toàn từ ngữ giống đực của nguyên văn, trong khi chú thích ghi nhận khả năng diễn đạt rộng hơn là “con cái”.
- source_word: עַל
  choice: vì
  rationale: Trong ngữ cảnh pháp lý, עַל nêu căn cứ khiến một người chịu hình phạt; “vì” ngắn gọn, tự nhiên và giữ đúng quan hệ trách nhiệm.
- source_word: אִישׁ
  choice: mỗi người
  rationale: אִישׁ được dùng theo nghĩa phân phối, nhấn mạnh từng cá nhân. “Mỗi người” là cách diễn đạt tự nhiên trong tiếng Việt và không làm cho nguyên tắc pháp lý bị hiểu là chỉ áp dụng cho nam giới.
- source_word: בְּחֶטְאוֹ
  choice: vì tội của chính mình
  rationale: Giới từ ב trong ngữ cảnh xét xử chỉ căn cứ chịu án, còn hậu tố sở hữu chỉ “tội của người ấy”. “Của chính mình” làm rõ sự tương phản với việc chịu tử hình vì tội của thân nhân.
theological_decisions:
- issue: Trách nhiệm cá nhân trong việc áp dụng án tử hình
  choice: Câu này cấm xử tử một người vì tội của cha hoặc con mình và quy định rằng mỗi người chỉ chịu án tử hình vì tội của chính mình.
  alternative: Hiểu như một tuyên bố tổng quát về mọi hậu quả của tội lỗi qua các thế hệ.
  rationale: Động từ מות ở thể Hophil được lặp lại, cụ thể chỉ việc bị làm cho chết, nên phạm vi trực tiếp là việc thi hành án tử hình. Bản dịch giữ nguyên nguyên tắc trách nhiệm cá nhân nhưng không tự mở rộng câu này sang mọi hậu quả của tội lỗi.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Cấu trúc song song “cha… vì con trai / con trai… vì cha” được giữ lại; “mỗi người” truyền đạt tự nhiên lực phân phối của אִישׁ trong tiếng Việt.
