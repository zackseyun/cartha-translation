  text: And remember that you were a servant in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: vi
  text: Hãy nhớ rằng ngươi đã là nô lệ trong đất Ai Cập; vì vậy, Ta truyền cho ngươi phải làm điều này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “việc này” hay “mệnh lệnh này.” Tiếng Hê-bơ-rơ dùng một từ có nghĩa rộng, chỉ về lời chỉ dẫn ngay trước đó, là phải chừa lại nông sản cho những người dễ bị tổn thương.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Hãy nhớ
  rationale: Dạng hoàn thành Qal có liên từ trong văn cảnh luật pháp mang lực mệnh lệnh/khuyên nhủ; “Hãy nhớ” diễn đạt tự nhiên và rõ lực truyền bảo trong tiếng Việt.
- source_word: כִּי
  choice: rằng
  rationale: Từ này dẫn vào nội dung cần ghi nhớ, nên “rằng” là cách diễn đạt rõ và tự nhiên.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Trong bối cảnh Ai Cập, từ này chỉ thân phận bị lệ thuộc và cưỡng bức, không phải sự phục vụ thông thường.
- source_word: הָיִיתָ
  choice: đã từng là
  rationale: Diễn đạt trạng thái trong quá khứ, đồng thời làm rõ đây là kinh nghiệm lịch sử được nhắc lại.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: trong đất Ai Cập
  rationale: Giữ hình thức cụ thể của cụm Hê-bơ-rơ “trong đất Ai Cập” thay vì rút gọn thành “ở Ai Cập”.
- source_word: עַל כֵּן
  choice: vì thế
  rationale: Thể hiện quan hệ suy luận giữa thân phận nô lệ trước kia và mệnh lệnh hiện tại.
- source_word: אָנֹכִי
  choice: tôi
  rationale: Đại từ độc lập có sắc thái nhấn mạnh; “tôi” phù hợp lời Môi-se đang trực tiếp truyền dạy dân chúng mà không cường điệu thành “chính tôi”.
- source_word: מְצַוְּךָ
  choice: truyền cho anh em
  rationale: Phân từ diễn tả hành động truyền lệnh đang có hiệu lực; “truyền cho” giữ sắc thái thẩm quyền và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: לַעֲשׂוֹת
  choice: phải làm
  rationale: Động từ mang nghĩa rộng “làm/thực hiện”; thêm “phải” biểu đạt tự nhiên sự chi phối của động từ “truyền” trong tiếng Việt.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: điều này
  rationale: “Điều” đủ rộng để chỉ lời chỉ dẫn vừa nêu mà không thu hẹp thành riêng “mệnh lệnh”; cách nói này tự nhiên hơn “việc này” trong câu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít tập thể chỉ dân Israel, nhằm giữ tính cộng đồng của lời truyền dạy. Dùng “nô lệ” thay vì “đầy tớ” để phản ánh đúng thân phận bị áp bức tại Ai Cập.
