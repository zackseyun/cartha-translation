revisions:
- from: Nếu một người đàn ông lấy một phụ nữ làm vợ và chung sống với nàng, nhưng rồi nàng không còn được đẹp lòng chàng vì chàng thấy nơi nàng điều gì đó đáng xấu hổ[a], và chàng viết cho nàng giấy ly hôn, trao tận tay nàng rồi đuổi nàng ra khỏi nhà mình,
  to: Nếu một người đàn ông lấy một phụ nữ làm vợ và chung sống với nàng, rồi xảy ra là nàng không được đẹp lòng chàng vì chàng thấy nơi nàng một điều đáng xấu hổ[a], và chàng viết cho nàng giấy ly hôn, trao vào tay nàng và cho nàng rời khỏi nhà mình,
  rationale: Bản sửa loại bỏ ý tương phản và thời tính không có trong tiếng Hê-bơ-rơ, đồng thời giảm sắc thái cưỡng bức của “đuổi” thành cách diễn đạt sát nghĩa hơn là “cho nàng rời khỏi”. Dấu phẩy cuối câu được giữ vì đây là phần mở đầu của tình huống luật kéo dài đến các câu sau.
