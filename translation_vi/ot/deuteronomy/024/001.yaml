source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: vi
  text: Nếu một người đàn ông lấy một phụ nữ làm vợ và chung sống với nàng, rồi xảy ra là nàng không được đẹp lòng chàng vì chàng thấy nơi nàng một điều đáng xấu hổ[a], và chàng viết cho nàng giấy ly hôn, trao vào tay nàng và cho nàng rời khỏi nhà mình,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một điều không đứng đắn” hoặc “một việc đáng hổ thẹn”. Cụm từ Hê-bơ-rơ này có chủ ý không xác định rõ và đã được hiểu theo nhiều cách.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu một tình huống luật theo thể điều kiện; câu chính của trường hợp này chỉ xuất hiện về sau trong Phục truyền luật lệ ký 24:1–4.
- source_word: יִקַּח אִישׁ אִשָּׁה וּבְעָלָהּ
  choice: một người đàn ông lấy một phụ nữ làm vợ và chung sống với nàng
  rationale: “Lấy ... làm vợ” phản ánh thành ngữ Hê-bơ-rơ; “chung sống với nàng” diễn đạt việc bước vào quan hệ hôn nhân mà không mang sắc thái sở hữu sai lệch.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: nàng không còn được đẹp lòng chàng
  rationale: Diễn đạt tự nhiên thành ngữ “không tìm thấy ân huệ trong mắt chàng”; “không còn” phù hợp diễn tiến của tình huống hôn nhân nhưng không xác định thêm nguyên nhân.
- source_word: כִּי מָצָא בָהּ
  choice: vì chàng thấy nơi nàng
  rationale: Giữ quan hệ giải thích của כִּי và hình ảnh cụ thể của động từ “thấy/tìm thấy”.
- source_word: עֶרְוַת דָּבָר
  choice: điều gì đó đáng xấu hổ
  rationale: Giữ tính bất định của cụm từ khó này, không thu hẹp nó thành một hành vi cụ thể; chú thích nêu các khả năng dịch khác.
- source_word: סֵפֶר כְּרִיתֻת
  choice: giấy ly hôn
  rationale: Chỉ văn bản pháp lý chấm dứt hôn nhân; cách gọi này rõ ràng và thông dụng trong tiếng Việt hiện đại.
- source_word: וְנָתַן בְּיָדָהּ
  choice: trao tận tay nàng
  rationale: Bảo tồn hành động pháp lý cụ thể là đặt văn bản vào tay người vợ, đồng thời dùng lối nói tự nhiên trong tiếng Việt.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: đuổi nàng ra khỏi nhà mình
  rationale: Truyền đạt lực nghĩa gửi đi/cho ra khỏi nhà trong bối cảnh ly hôn và giữ yếu tố không gian của nguyên văn.
theological_decisions:
- issue: Câu này là mệnh lệnh cho phép ly hôn hay phần mở đầu của một trường hợp luật?
  choice: Dịch như mệnh đề điều kiện mở đầu một tình huống pháp lý, không như mệnh lệnh chuẩn thuận ly hôn.
  alternative: Có thể ngắt hoặc diễn đạt lỏng thành lời chỉ dẫn rằng người chồng nên hay được phép ly hôn trong hoàn cảnh này.
  rationale: Cú pháp Phục truyền luật lệ ký 24:1–4 kéo dài phần điều kiện qua các câu đầu, còn điều cấm pháp lý xuất hiện về sau. Dấu phẩy cuối câu 1 giúp bảo tồn cấu trúc chưa hoàn tất này.
- issue: Phạm vi nghĩa của עֶרְוַת דָּבָר
  choice: 'Giữ cách diễn đạt bất định: “điều gì đó đáng xấu hổ”.'
  alternative: Xác định cụ thể là ngoại tình, hành vi tình dục sai trái, hoặc một khuyết điểm riêng biệt.
  rationale: Cụm Hê-bơ-rơ có tính mơ hồ thực sự và từng được hiểu theo nhiều cách; bản dịch không nên âm thầm giải quyết tranh luận thần học-pháp lý ấy.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dễ hiểu. Đại từ “chàng/nàng” giúp theo dõi các chủ thể mà không lặp nặng “người đàn ông/người phụ nữ”. Câu được để kết bằng dấu phẩy vì đây mới là phần điều kiện của trường hợp luật kéo dài sang các câu tiếp theo.
