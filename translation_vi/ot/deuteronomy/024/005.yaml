translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại, dễ hiểu. Dùng “người ấy” để tránh lặp đại từ khẩu ngữ; “công vụ” biểu thị nghĩa vụ chính thức rộng hơn quân vụ. Các chú thích bảo tồn độ rộng nghĩa của צָבָא, דָּבָר và לְבֵיתוֹ, cũng như sắc thái gây khiến của וְשִׂמַּח.
