base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: vi
  text: Khi một người đàn ông mới cưới vợ, người ấy không được đi cùng quân đội[a], cũng không được giao bất cứ nhiệm vụ nào[b]. Người ấy được miễn mọi nghĩa vụ trong một năm để dành trọn thời gian cho gia đình mình[c] và làm cho người vợ mình đã cưới vui[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được đi phục vụ trong quân đội.” Nguyên văn là “không được đi ra cùng quân đội,” có thể bao gồm nghĩa vụ quân sự nói chung chứ không chỉ trực tiếp chiến đấu.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cũng không phải chịu bất cứ nghĩa vụ nào” hoặc “cũng không bị đặt lên bất cứ trách nhiệm nào.” Nguyên văn có phạm vi rộng hơn nghĩa vụ quân sự đơn thuần.'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “Người ấy được miễn trừ để ở nhà trong một năm.” Cụm từ Hê-bơ-rơ có thể nhấn mạnh sự tự do dành cho đời sống gia đình hoặc việc ở lại với gia đình mình.'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “và đem niềm vui đến cho người vợ mình đã cưới.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Mở đầu một trường hợp luật định; “Khi” tự nhiên trong tiếng Việt và diễn tả hoàn cảnh được dự liệu.
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: một người đàn ông mới cưới vợ
  rationale: לָקַח אִשָּׁה là thành ngữ chỉ việc cưới vợ; cách diễn đạt này tự nhiên và hiểu חֲדָשָׁה là cuộc hôn nhân mới diễn ra, không phải “một người vợ mới” đối lập với người vợ cũ.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: không được ra trận cùng quân đội
  rationale: Giữ hình ảnh “đi ra cùng quân đội” và sắc thái luật định, đồng thời tránh thu hẹp câu chỉ vào việc trực tiếp chiến đấu.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: cũng không phải gánh bất cứ công vụ nào
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ về một trách nhiệm hay nghĩa vụ được đặt lên người ấy; “công vụ” giữ phạm vi rộng hơn riêng nghĩa vụ quân sự.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ
  choice: được miễn các nghĩa vụ để lo cho gia đình mình
  rationale: נָקִי mang nghĩa được miễn, không bị ràng buộc; לְבֵיתוֹ hướng sự miễn trừ ấy về gia đình/hộ gia đình, không chỉ về địa điểm ở nhà.
- source_word: שָׁנָה אֶחָת
  choice: trong một năm
  rationale: Diễn đạt rõ thời hạn luật định.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: và làm cho người vợ ... được vui
  rationale: 'Giữ sắc thái tác động của thể Piel: người chồng làm cho vợ vui, thay vì chỉ nói hai người cùng vui.'
- source_word: אֲשֶׁר לָקָח
  choice: mình đã cưới
  rationale: Dịch thành ngữ לָקַח אִשָּׁה sang tiếng Việt tự nhiên; việc lặp lại ý “cưới” phản ánh sự lặp lại của động từ trong nguyên văn.
