  source_fidelity: 'Bản dịch chuyển đúng trình tự và các thành tố chính của Hê-bơ-rơ: mốc hoàn tất bốn mươi ngày và bốn mươi đêm, Yahweh là chủ thể, Môi-se là người nhận, hai bảng bằng đá, và sự nhắc lại đồng vị “các bảng giao ước”. “Vào cuối” bảo toàn sắc thái mốc kết thúc của מִקֵּץ tốt hơn “sau”.'
  naturalness: Câu văn hiện đại, rõ ràng và có sắc thái trang trọng vừa phải. “Ban cho” phù hợp ngữ cảnh mà không làm thay đổi nghĩa cơ bản của נתן. Cụm “tức là các bảng giao ước” diễn đạt tự nhiên quan hệ đồng vị của nguyên văn.
  terminology: “Yahweh” nhất quán với quyết định chuyển danh יהוה. “Bảng đá” và “bảng giao ước” là các thuật ngữ rõ nghĩa, giữ được sự lặp lại của לֻחֹת trong câu nguồn. Chú thích [a] được đặt đúng sau cụm thời gian và giải thích hợp lý việc không dịch minh nhiên công thức chuyển tiếp וַיְהִי.
