id: DEU.9.11
reference: Deuteronomy 9:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵ֛י לֻחֹ֥ת הָ/אֲבָנִ֖ים לֻח֥וֹת הַ/בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: vi
  text: Vào cuối bốn mươi ngày và bốn mươi đêm,[a] Yahweh ban cho tôi hai bảng đá, tức là các bảng giao ước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc mở đầu: “Và xảy ra rằng, vào cuối bốn mươi ngày và bốn mươi đêm, Yahweh ban cho tôi...”'
    reason: וַיְהִי có thể được thể hiện minh nhiên bằng “Và xảy ra rằng”, nhưng trong tiếng Việt hiện đại, ý chuyển tiếp kể chuyện này thường được chuyển tự nhiên qua mệnh đề thời gian.
lexical_decisions:
- source_word: וַיְהִי
  choice: Vào
  rationale: Trong mạch kể chuyện, וַיְהִי mở đầu một mệnh đề thời gian. Tiếng Việt tự nhiên có thể chuyển ý này bằng cụm “Vào cuối...” mà không cần câu sát chữ nhưng nặng nề “Và xảy ra rằng”.
- source_word: מִקֵּץ
  choice: vào cuối
  rationale: Cụm này chỉ thời điểm một khoảng thời gian đã đi đến chỗ kết thúc; “vào cuối” giữ rõ ranh giới thời gian hơn cách dịch khái quát “sau”.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: bốn mươi ngày và bốn mươi đêm
  rationale: Giữ nguyên lối diễn đạt song đôi của tiếng Hê-bơ-rơ bằng một cụm từ tự nhiên trong tiếng Việt.
- source_word: נָתַן
  choice: ban cho
  rationale: Động từ có nghĩa thông thường là “cho”. Trong ngữ cảnh Đức Chúa Trời trao các bảng đá, “ban cho” vừa tự nhiên, trang trọng vừa không thêm ý nghĩa ngoài bản văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp trực tiếp với יהוה trong bản nguồn.
- source_word: אֵלַי
  choice: cho tôi
  rationale: Diễn đạt tự nhiên cấu trúc נתן + אֶל, trong đó Môi-se là người nhận.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: hai bảng đá
  rationale: “Bảng đá” diễn đạt rõ các bảng làm bằng đá; “hai” giữ nguyên số lượng xác định trong nguyên văn.
- source_word: לֻחֹות הַבְּרִית
  choice: các bảng giao ước
  rationale: Giữ danh từ “bảng” được lặp lại trong nguyên văn và thể hiện quan hệ của các bảng ấy với giao ước.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn sự phân biệt giữa danh riêng và tước hiệu mà không đưa thêm lập trường hệ phái.
- issue: Quan hệ giữa các bảng đá và giao ước
  choice: “tức là các bảng giao ước” như một phần giải thích đồng vị
  alternative: “hai bảng đá của giao ước”
  rationale: Tiếng Hê-bơ-rơ lặp lại לֻחֹת (“các bảng”) và đặt “các bảng giao ước” đồng vị với “hai bảng đá”. Bản dịch giữ sự lặp lại này thay vì gộp thành một quan hệ sở hữu có thể làm mất cấu trúc nhấn mạnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ban cho” phù hợp với chủ thể thần linh; giữ danh “Yahweh” và lối lặp “các bảng” của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm thời gian mà chú thích giải thích.
