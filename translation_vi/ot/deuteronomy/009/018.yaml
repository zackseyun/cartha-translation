  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: vi
  text: Rồi tôi phủ phục trước mặt Yahweh như lần trước[a], suốt bốn mươi ngày và bốn mươi đêm. Tôi không ăn bánh, cũng không uống nước, vì mọi tội lỗi anh em đã phạm khi làm điều ác trước mắt Yahweh, làm Yahweh nổi giận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như ban đầu” hoặc “như trước kia.” Cụm từ Hê-bơ-rơ nhắc lại thời kỳ bốn mươi ngày trước đó, khi Môi-se ở trước mặt Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Rồi tôi sấp mình
  rationale: Dạng hitpael của נפל diễn tả Môi-se hạ mình phủ phục trước Đức Chúa Trời; “sấp mình” tự nhiên trong tiếng Việt và giữ rõ tư thế thân thể cùng sắc thái khẩn cầu.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי chỉ vị trí và tương quan, nghĩa là ở trước hoặc trong sự hiện diện của; “trước mặt” là cách nói tự nhiên và sát nghĩa.
- source_word: כָּרִאשֹׁנָה
  choice: như lần trước
  rationale: Cụm từ hồi chỉ giai đoạn bốn mươi ngày trước đó của Môi-se. Cách dịch này giữ lực so sánh nhưng cũng có thể được hiểu là “như ban đầu,” nên có chú thích.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: suốt bốn mươi ngày và bốn mươi đêm
  rationale: Giữ nguyên thời lượng của nguyên văn; “suốt” thể hiện tự nhiên khoảng thời gian kéo dài trong tiếng Việt.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: Tôi không ăn bánh
  rationale: Nguyên văn nói cụ thể “bánh,” không khái quát thành “thức ăn”; cấu trúc phủ định hiện đại, rõ ràng.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: cũng không uống nước
  rationale: Dịch trực tiếp và phối hợp tự nhiên với mệnh đề phủ định trước.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: vì mọi tội lỗi anh em
  rationale: עַל nêu lý do cho việc phủ phục và kiêng ăn. Danh từ số ít có lực tập hợp; “mọi tội lỗi” truyền đạt tự nhiên tổng thể hành vi phạm tội của cộng đồng.
- source_word: אֲשֶׁר חֲטָאתֶם
  choice: đã phạm
  rationale: “Phạm tội lỗi” là kết hợp từ tự nhiên trong tiếng Việt, còn “đã” thể hiện hành động xảy ra trước lời thuật.
- source_word: לַעֲשׂוֹת הָרַע
  choice: khi làm điều ác
  rationale: Nguyên mẫu diễn tả nội dung hoặc cách thức phạm tội. “Khi làm điều ác” rõ ràng mà không quyết định quá mức quan hệ cú pháp.
- source_word: בְּעֵינֵי יְהוָה
  choice: dưới mắt Yahweh
  rationale: Giữ hình ảnh “trong mắt” của thành ngữ Hê-bơ-rơ đồng thời diễn đạt tự nhiên sự đánh giá của Đức Chúa Trời.
- source_word: לְהַכְעִיסוֹ
  choice: chọc giận Ngài
  rationale: Dạng hiphil của כעס có nghĩa gây ra hoặc khơi lên cơn giận. “Chọc giận” giữ lực gây khiến và phù hợp văn cảnh.
theological_decisions:
- issue: Cách chuyển danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng Tứ Tự Danh. Giữ “Yahweh” bảo tồn danh giao ước mà không thay bằng một tước hiệu.
- issue: Sắc thái mục đích hoặc kết quả của לְהַכְעִיסוֹ
  choice: chọc giận Ngài
  alternative: để chọc giận Ngài
  rationale: Tiền tố לְ có thể gợi mục đích hoặc kết quả. Không thêm “để” tránh khẳng định chắc chắn rằng dân cố ý hành động nhằm làm Yahweh giận, trong khi vẫn giữ hậu quả gây giận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng Israel; viết hoa “Ngài” theo quy ước kính ngữ phổ biến. Giữ “bánh” và hình ảnh “dưới mắt” thay vì khái quát hóa.
