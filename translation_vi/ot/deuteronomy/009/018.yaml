revisions:
- from: Rồi tôi sấp mình trước mặt Yahweh như lần trước[a], suốt bốn mươi ngày và bốn mươi đêm. Tôi không ăn bánh, cũng không uống nước, vì mọi tội lỗi anh em đã phạm khi làm điều ác dưới mắt Yahweh, chọc giận Ngài.
  to: Rồi tôi phủ phục trước mặt Yahweh như lần trước[a], suốt bốn mươi ngày và bốn mươi đêm. Tôi không ăn bánh, cũng không uống nước, vì mọi tội lỗi anh em đã phạm khi làm điều ác trước mắt Yahweh, làm Yahweh nổi giận.
  rationale: 'Chỉnh nhẹ thành ngữ và sắc thái văn phong: “trước mắt Yahweh” là cách nói tiếng Việt tự nhiên cho thành ngữ Hê-bơ-rơ, còn “làm Yahweh nổi giận” trang trọng hơn và bảo toàn lực gây khiến. “Phủ phục” làm rõ tư thế tự hạ mình của động từ hitpael mà vẫn tự nhiên trong văn cảnh Kinh Thánh.'
