source:
  edition: WLC
  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: vi
  text: Hãy nhớ, đừng quên việc ngươi đã chọc giận Yahweh, Đức Chúa Trời của ngươi, trong hoang mạc như thế nào. Từ ngày ngươi ra khỏi đất Ai Cập cho đến khi anh em đến nơi này[a], anh em vẫn phản nghịch Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chuyển từ đại từ số ít mang nghĩa tập thể ở đầu câu sang số nhiều ở phần sau.
    reason: source_form
  - marker: b
    text: 'Theo sát chữ: “phản nghịch với Yahweh”; trong văn cảnh này, “với” mang ý đối nghịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: Hãy nhớ, đừng quên
  rationale: Giữ nguyên cả mệnh lệnh khẳng định lẫn mệnh lệnh phủ định, qua đó bảo toàn lối nhấn mạnh của tiếng Hê-bơ-rơ.
- source_word: הִקְצַפְתָּ
  choice: đã chọc giận
  rationale: 'Diễn đạt tự nhiên sắc thái tác khiến của thể Hiphil: dân chúng khiến Yahweh nổi giận.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cách gọi trang trọng, rõ nghĩa trong tiếng Việt; số nhiều 'anh em' phù hợp đối tượng tập thể được Môi-se nói với.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: '''Hoang mạc'' diễn tả vùng hoang vu của hành trình Xuất Hành mà không nhất thiết giới hạn ở sa mạc cát.'
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ מֵאֶרֶץ מִצְרַיִם
  choice: Từ ngày anh em ra khỏi đất Ai Cập
  rationale: Diễn đạt tự nhiên điểm khởi đầu của khoảng thời gian; giữ công thức ra khỏi Ai Cập.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: cho đến khi đến nơi này
  rationale: Cách nói tiếng Việt tự nhiên, truyền đạt đầy đủ đích thời gian và địa điểm; đại từ tập thể cũng phản ánh hậu tố số nhiều trong בֹּאֲכֶם.
- source_word: מַמְרִים הֱיִיתֶם
  choice: anh em vẫn luôn phản nghịch
  rationale: '''Phản nghịch'' bảo toàn ý chống lại thẩm quyền; ''vẫn luôn'' diễn tả kiểu hành xử kéo dài trong toàn khoảng thời gian vừa nêu.'
- source_word: עִם יְהוָה
  choice: Yahweh
  rationale: Trong kết cấu với מרה, giới từ עִם mang quan hệ đối nghịch; tiếng Việt có thể diễn đạt tự nhiên bằng động từ 'phản nghịch' trực tiếp hướng đến Yahweh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh giao ước יהוה; chuyển tự 'Yahweh' giữ đây là danh riêng và không biến nó thành tước hiệu.
- issue: Tính kéo dài của sự phản nghịch
  choice: vẫn luôn phản nghịch
  alternative: đã phản nghịch
  rationale: Cụm thời gian từ lúc ra khỏi Ai Cập đến nơi hiện tại cùng cấu trúc מַמְרִים הֱיִיתֶם mô tả một khuynh hướng liên tục, không chỉ một hành động đơn lẻ.
- issue: Sự chuyển đổi số ít sang số nhiều trong tiếng Hê-bơ-rơ
  choice: dùng 'anh em' xuyên suốt câu tiếng Việt
  alternative: chuyển từ 'ngươi' sang 'anh em'
  rationale: Nguyên văn chuyển từ số ít mang tính tập thể sang số nhiều. Tiếng Việt dùng 'anh em' xuyên suốt để lời nói tự nhiên, đồng thời chú thích sự chuyển đổi hình thái của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' cho cộng đồng Ít-ra-ên, tránh đại từ cổ; giữ danh riêng Yahweh. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
