base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/015.yaml
  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: vi
  text: Tôi quay lại và xuống núi, và núi đang cháy rực lửa[a], và hai bảng giao ước ở trên cả hai tay tôi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “trong khi núi đang cháy rực lửa.” Liên từ Hê-bơ-rơ có thể chỉ sự nối tiếp đơn giản, nhưng ngữ cảnh cũng cho phép hiểu mệnh đề này là một hoàn cảnh đồng thời.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “trên hai tay tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן וָאֵרֵד
  choice: Bấy giờ tôi quay lại và xuống
  rationale: Hai động từ ở dạng kể chuyện diễn tả các hành động nối tiếp. “Bấy giờ” tạo dòng kể tự nhiên, còn “quay lại và xuống” giữ sát trình tự của tiếng Hê-bơ-rơ.
- source_word: מִן הָהָר
  choice: núi
  rationale: Giới từ מִן được diễn đạt tự nhiên trong tiếng Việt bằng kết cấu động từ “xuống núi”; ngọn núi cụ thể đã rõ trong ngữ cảnh.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: trong khi núi đang cháy rực trong lửa
  rationale: Mệnh đề có thể mang sắc thái hoàn cảnh đồng thời với việc Môi-se xuống núi. “Cháy rực trong lửa” giữ cả động từ בֹּעֵר và cụm בָּאֵשׁ, đồng thời nghe tự nhiên và trang trọng.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: hai bảng giao ước
  rationale: לֻחֹת chỉ các bảng đá trong ngữ cảnh, còn הַבְּרִית là “giao ước”. Cách nói này ngắn gọn, rõ nghĩa và không thêm chất liệu “đá” vốn không được nêu trực tiếp trong câu.
- source_word: עַל שְׁתֵּי יָדָי
  choice: ở trên hai tay tôi
  rationale: Giữ hình ảnh cụ thể và giới từ עַל, thay vì diễn giải thành “trong tay”; tiếng Việt vẫn hiểu tự nhiên rằng Môi-se đang đỡ hoặc mang hai bảng trên hai tay.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu, giữ rõ hình ảnh “hai tay” và không giải quyết dứt khoát sắc thái của liên từ Hê-bơ-rơ; dị bản được ghi ở chú thích.
