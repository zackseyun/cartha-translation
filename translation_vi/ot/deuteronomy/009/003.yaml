    rationale: Trong ngữ cảnh, וְיָדַעְתָּ là lời kêu gọi/khẳng định hướng đến Israel. “Hãy biết” giữ lực khuyên bảo mà không bổ sung sắc thái bắt buộc.
  revised_text: Vậy, hôm nay hãy biết rằng chính Yahweh, Đức Chúa Trời của anh em, là Đấng vượt qua phía trước anh em[a], một ngọn lửa thiêu nuốt[b]. Chính Ngài sẽ hủy diệt chúng và khuất phục chúng trước anh em. Anh em sẽ tước quyền chiếm hữu đất của chúng[c] và nhanh chóng làm chúng diệt vong, đúng như Yahweh đã phán với anh em[d].
