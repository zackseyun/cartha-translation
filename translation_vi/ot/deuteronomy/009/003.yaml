  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: vi
  text: Vậy, hôm nay hãy biết rằng chính Yahweh, Đức Chúa Trời của anh em, là Đấng vượt qua phía trước anh em[a], một ngọn lửa thiêu nuốt[b]. Chính Ngài sẽ hủy diệt chúng và khuất phục chúng trước anh em. Anh em sẽ tước quyền chiếm hữu đất của chúng[c] và nhanh chóng làm chúng diệt vong, đúng như Yahweh đã phán với anh em[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi qua trước anh em” hoặc “đi trước anh em”. Phân từ Hê-bơ-rơ diễn tả Yahweh là Đấng vượt qua ở phía trước Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một ngọn lửa nuốt chửng”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đuổi chúng đi”. Động từ Hê-bơ-rơ ở đây bao hàm việc khiến chúng mất quyền chiếm hữu đất.'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “như Yahweh đã phán với anh em”; ý nói việc ấy xảy ra phù hợp với lời Yahweh đã phán trước đó với Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: Vậy hôm nay, anh em phải biết
  rationale: Liên từ nối câu này với lời cảnh báo trước đó; động từ ngôi hai số ít đại diện cho toàn dân Israel. Cách diễn đạt này truyền đạt lực khẳng định–khuyên bảo tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tự nhiên công thức giao ước ở ngôi thứ hai; “anh em” chỉ cộng đồng Israel đang được Môi-se nói với.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: chính ... là Đấng vượt qua trước anh em
  rationale: Giữ sắc thái nhấn mạnh của הוּא và hình ảnh cụ thể của phân từ עבר, đồng thời gợi đúng bối cảnh vượt qua để vào đất.
- source_word: אֵשׁ אֹכְלָה
  choice: một ngọn lửa thiêu nuốt
  rationale: Giữ nguyên ẩn dụ mạnh về sự hiện diện thánh khiết và phán xét của Đức Chúa Trời; “thiêu nuốt” tự nhiên và sát nghĩa động từ אכל.
- source_word: יַשְׁמִידֵם
  choice: Ngài sẽ hủy diệt chúng
  rationale: Phản ánh thể Hifil của שׁמד, chỉ việc khiến các dân ấy bị tiêu diệt, mà không thêm sắc thái kỹ thuật hiện đại.
- source_word: יַכְנִיעֵם
  choice: khuất phục chúng
  rationale: Trong bối cảnh chiến trận, thể Hifil của כנע nói đến việc hạ các dân xuống và bắt họ quy phục.
- source_word: וְהוֹרַשְׁתָּם
  choice: anh em sẽ tước đất của chúng
  rationale: Thể Hifil của ירשׁ ở đây mang nghĩa làm cho cư dân mất quyền chiếm hữu để Israel nhận lấy đất; cách dịch nêu rõ sắc thái lãnh thổ.
- source_word: וְהַאֲבַדְתָּם מַהֵר
  choice: nhanh chóng làm chúng diệt vong
  rationale: “Làm ... diệt vong” giữ lực gây khiến của thể Hifil אבד và phân biệt từ này với שׁמד ở vế trước; “nhanh chóng” phản ánh מַהֵר.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: đúng như Yahweh đã phán với anh em
  rationale: Giữ ý về lời phán trước đó mà không diễn giải quá mức thành một lời hứa, dù ngữ cảnh có thể hàm ý điều ấy.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH; phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay bằng tước hiệu.
- issue: Hình ảnh thần học אֵשׁ אֹכְלָה
  choice: một ngọn lửa thiêu nuốt
  alternative: một ngọn lửa thiêu hủy
  rationale: Giữ hình ảnh ẩn dụ nguyên gốc và sức nặng của sự hiện diện thánh khiết, phán xét của Yahweh, không làm nhẹ hoặc giải thích thêm.
- issue: Tác nhân thần linh và trách nhiệm của Israel
  choice: Chính Ngài sẽ hủy diệt... Anh em sẽ tước đất... và làm chúng diệt vong
  alternative: Gộp mọi hành động vào một tác nhân duy nhất
  rationale: 'Bảo tồn sự căng thẳng của nguyên văn: Yahweh là Đấng đi trước, hủy diệt và khuất phục; Israel tiếp đó tước quyền sở hữu và làm các dân diệt vong.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với Israel như một cộng đồng, dù các hình thái Hê-bơ-rơ là ngôi hai số ít. Lặp “chính” để bảo tồn sự nhấn mạnh của הוּא; tránh từ ngữ giáo phái và không làm nhẹ hình ảnh chiến trận.
