  text: וָ/אֶתְפַּלֵּ֣ל אֶל יְהוָה֮ וָ/אֹמַר֒ אֲדֹנָ֣/י יְהוִ֗ה אַל תַּשְׁחֵ֤ת עַמְּ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּ/גָדְלֶ֑/ךָ אֲשֶׁר הוֹצֵ֥אתָ מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: vi
  text: 'Tôi cầu nguyện lên Yahweh và thưa rằng: “Lạy Chúa Yahweh, xin đừng hủy diệt dân Ngài và cơ nghiệp Ngài, mà Ngài đã chuộc bằng sự vĩ đại của Ngài, mà Ngài đã dùng bàn tay mạnh mẽ đưa ra khỏi Ai Cập.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל יְהוָה וָאֹמַר
  choice: Vì thế, tôi cầu nguyện với Yahweh và thưa rằng
  rationale: Dịch chuỗi động từ tự sự theo quan hệ tiếp nối với ngữ cảnh; “thưa rằng” tự nhiên và phù hợp với lời cầu nguyện kính cẩn.
- source_word: אֲדֹנָי יְהוִה
  choice: Lạy Chúa Yahweh
  rationale: Giữ cả tước hiệu אֲדֹנָי và danh riêng יהוה; “Lạy” thể hiện trực tiếp cách xưng hô trong lời cầu nguyện mà không tạo sự lặp gượng.
- source_word: אַל תַּשְׁחֵת
  choice: xin đừng hủy diệt
  rationale: Giữ nguyên sức nặng của động từ שׁחת và thể hiện lời khẩn cầu phủ định bằng cách nói tự nhiên trong tiếng Việt.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: dân Ngài và cơ nghiệp Ngài
  rationale: “Cơ nghiệp” bảo lưu sắc thái giao ước và ý niệm dân Israel thuộc về Yahweh như phần sản nghiệp của Ngài.
- source_word: אֲשֶׁר פָּדִיתָ בְּגָדְלֶךָ
  choice: là dân Ngài đã chuộc bằng sự vĩ đại của Ngài
  rationale: “Chuộc” phù hợp với פדה trong bối cảnh Xuất Ai Cập; “sự vĩ đại” dịch sát danh từ גֹּדֶל, không tự ý thu hẹp nghĩa thành quyền năng.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם בְּיָד חֲזָקָה
  choice: là dân Ngài đã dùng bàn tay mạnh mẽ đưa ra khỏi Ai Cập
  rationale: Giữ công thức Xuất Ai Cập và hình ảnh cụ thể “bàn tay mạnh mẽ” của nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Phiên âm danh giao ước thay vì thay bằng một tước hiệu, phù hợp với sự phân biệt giữa יהוה và אֲדֹנָי trong chính câu này.
- issue: Đối tượng của hai mệnh đề quan hệ אֲשֶׁר
  choice: lặp lại “là dân Ngài”
  alternative: dùng đại từ quan hệ chung cho cả “dân Ngài và cơ nghiệp Ngài”
  rationale: Trong tiếng Việt, cách lặp này cho thấy đối tượng được chuộc và được đưa ra khỏi Ai Cập là chính dân Israel, đồng thời “cơ nghiệp” là cách gọi song song về họ, không biến cơ nghiệp thành một vật thể riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “Ngài” trong lời cầu nguyện. Giữ hình ảnh và thuật ngữ giao ước của nguyên văn, đồng thời tránh lối dịch quá cổ hoặc sự lặp thiếu tự nhiên.
