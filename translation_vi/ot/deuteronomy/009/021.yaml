  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: vi
  text: Tôi đã lấy tội lỗi của anh em—con bê mà anh em đã làm—thiêu nó trong lửa, rồi đập nó và nghiền thật kỹ cho đến khi nó mịn như bụi; sau đó, tôi ném bụi của nó xuống dòng suối[a] chảy từ núi xuống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này cũng có thể chỉ khe suối, lòng suối, hoặc một thung lũng có dòng nước chảy theo mùa (wadi).
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: tội lỗi của anh em
  rationale: Giữ cách đồng nhất mạnh và trực tiếp trong tiếng Hê-bơ-rơ giữa con bê và tội lỗi của Israel; trong ngữ cảnh này không mang nghĩa “lễ vật chuộc tội”.
- source_word: הָעֵגֶל
  choice: con bê
  rationale: Nghĩa thông thường của từ và phù hợp trực tiếp với sự kiện con bê vàng.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: thiêu trong lửa
  rationale: Diễn đạt tự nhiên bằng tiếng Việt mà vẫn giữ hình ảnh cụ thể của nguyên văn.
- source_word: וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב
  choice: đập và nghiền thật kỹ
  rationale: Thể hiện cả hành động đập và cách thức nghiền kỹ, bảo toàn diễn tiến nhấn mạnh của câu Hê-bơ-rơ.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: cho đến khi nó mịn như bụi
  rationale: Truyền đạt mức độ nghiền nhỏ và hình ảnh bụi một cách rõ ràng, tự nhiên.
- source_word: עֲפָרוֹ
  choice: bụi của nó
  rationale: Liên kết với hình ảnh “mịn như bụi” ngay trước đó và không thu hẹp nghĩa thành tro.
- source_word: הַנַּחַל
  choice: dòng suối
  rationale: Cách nói phổ thông, dễ hiểu; từ Hê-bơ-rơ cũng có thể chỉ khe suối hoặc lòng suối theo mùa, nên ghi chú giữ lại độ rộng nghĩa.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: chảy từ núi xuống
  rationale: Diễn đạt tự nhiên sắc thái hiện tại của phân từ mô tả dòng nước từ núi đi xuống.
theological_decisions:
- issue: Đồng nhất con bê với “tội lỗi của anh em”
  choice: Giữ nguyên cách gọi trực tiếp “tội lỗi của anh em—con bê mà anh em đã làm”.
  alternative: “vật tội lỗi của anh em” hoặc “con bê tội lỗi mà anh em đã làm”
  rationale: Cấu trúc đồng vị của nguyên văn cố ý diễn tả gay gắt rằng tượng thần ấy là hiện thân của tội lỗi Israel; không nên làm nhẹ sức nặng thần học này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng Israel; giữ chuỗi hành động dồn dập của nguyên văn nhưng điều chỉnh dấu câu để câu rõ ràng.
