revisions:
- from: Còn tội lỗi của anh em—con bê mà anh em đã làm—thì tôi lấy nó, thiêu trong lửa, rồi đập và nghiền thật kỹ cho đến khi nó mịn như bụi; sau đó, tôi ném bụi của nó xuống dòng suối[a] chảy từ núi xuống.
  to: Tôi đã lấy tội lỗi của anh em—con bê mà anh em đã làm—thiêu nó trong lửa, rồi đập nó và nghiền thật kỹ cho đến khi nó mịn như bụi; sau đó, tôi ném bụi của nó xuống dòng suối[a] chảy từ núi xuống.
  rationale: Bản sửa giữ nguyên mọi yếu tố nghĩa của nguyên văn và sức nặng của cách gọi con bê là “tội lỗi của anh em,” đồng thời làm câu hồi thuật tự nhiên hơn trong tiếng Việt hiện đại. Ghi chú được tinh chỉnh để phản ánh chính xác hơn trường nghĩa của נחל.
