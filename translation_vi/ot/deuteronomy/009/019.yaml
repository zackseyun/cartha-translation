  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: vi
  text: Vì tôi sợ cơn giận và thịnh nộ mà Yahweh đã nổi giận với anh em, để tiêu diệt anh em. Nhưng Yahweh cũng đã lắng nghe tôi trong dịp ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: tôi sợ
  rationale: Động từ Qal hoàn thành ngôi thứ nhất số ít diễn tả sự sợ hãi; “tôi sợ” tự nhiên, trực tiếp và giữ nguyên sắc thái cá nhân.
- source_word: מִפְּנֵי
  choice: vì
  rationale: Trong thành ngữ này, giới từ nêu nguyên nhân của nỗi sợ; “vì” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: הָאַף וְהַחֵמָה
  choice: cơn giận và thịnh nộ
  rationale: Hai danh từ được giữ riêng để phản ánh sự dồn lớp của ngôn ngữ chỉ cơn giận trong nguyên bản; “thịnh nộ” truyền đạt cường độ của חֵמָה.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: mà Yahweh đã nổi lên với anh em
  rationale: “Nổi [giận] với” chuyển tải קצף cùng עַל một cách tự nhiên, đồng thời tránh lặp từ “giận” quá nặng nề ngay sau cụm “cơn giận và thịnh nộ”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên bản, thay vì thay thế bằng một tước hiệu.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: đến mức Ngài muốn tiêu diệt anh em
  rationale: Giữ ý định/hướng tới việc tiêu diệt trong cấu trúc לְ + động từ nguyên mẫu; “đến mức… muốn” nối tự nhiên với cơn thịnh nộ mà không khẳng định việc tiêu diệt đã xảy ra.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Nhưng… Yahweh… đã nhậm lời tôi
  rationale: שׁמע אֶל trong bối cảnh Môi-se cầu thay không chỉ là nghe âm thanh mà là lắng nghe theo hướng đáp ứng thuận lợi; “nhậm lời” diễn đạt ý đó tự nhiên trong tiếng Việt.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: lần ấy… cũng
  rationale: Giữ lực bổ sung của גַּם và ý chỉ một dịp cụ thể của בַּפַּעַם הַהִוא bằng trật tự tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên bản dùng danh riêng, nên bản dịch giữ danh này bằng dạng phiên âm “Yahweh”, không thay bằng tước hiệu.
- issue: Cường độ của ngôn ngữ về cơn giận của Đức Chúa Trời
  choice: cơn giận và thịnh nộ… đã nổi lên với anh em
  alternative: cơn giận dữ mà Yahweh đã nổi giận cùng anh em
  rationale: Giữ hai danh từ אַף và חֵמָה cùng động từ קצף để không làm nhẹ mức độ nghiêm trọng, nhưng diễn đạt sao cho không gượng ép vì lặp từ trong tiếng Việt.
- issue: Ý nghĩa của việc Yahweh nghe lời Môi-se
  choice: nhậm lời tôi
  alternative: nghe tôi; lắng nghe tôi
  rationale: Bối cảnh cầu thay cho thấy sự nghe có kết quả thuận lợi, song “nhậm lời” không giải thích cụ thể cách Đức Chúa Trời đáp lại và vì thế vẫn giữ được độ mở của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều chỉ cộng đồng Israel; tránh từ cổ và tránh giải thích thần học vượt quá câu Hebrew.
