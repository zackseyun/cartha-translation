  naturalness: “Chọc giận” dễ hiểu nhưng hơi khẩu ngữ trong văn mạch diễn từ Kinh Thánh trang trọng. “Cứ làm Yahweh nổi giận” tự nhiên, trang trọng vừa phải, và vẫn biểu đạt nghĩa gây ra cơn giận.
  terminology: Giữ “Yahweh” là phù hợp với việc văn bản nguồn dùng יהוה. Các địa danh nên được phiên âm nhất quán là Ta-bê-ra, Ma-sa, và Kíp-rốt Ha-tha-a-va.
