source:
  edition: WLC
  text: וּ/בְ/תַבְעֵרָה֙ וּ/בְ/מַסָּ֔ה וּ/בְ/קִבְרֹ֖ת הַֽתַּאֲוָ֑ה מַקְצִפִ֥ים הֱיִיתֶ֖ם אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: vi
  text: Tại Ta-bê-ra, tại Ma-sa và tại Kíp-rốt Ha-tha-a-va[a], anh em cứ làm Yahweh nổi giận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kíp-rốt Ha-tha-a-va là tên địa điểm; nghĩa đen là “những ngôi mộ của sự thèm khát” hoặc “những ngôi mộ của ham muốn.”
    reason: Giữ địa danh trong chính văn nhưng cung cấp nghĩa từ nguyên đáng chú ý của קִבְרֹת הַתַּאֲוָה.
lexical_decisions:
- source_word: וּ/בְ/תַבְעֵרָה
  choice: Tại Tha-bê-ra
  rationale: Giới từ בְּ chỉ địa điểm trong danh sách các nơi chốn; địa danh được phiên âm thay vì dịch nghĩa.
- source_word: וּ/בְ/מַסָּה
  choice: Ma-sa
  rationale: Đây là địa danh cố định. Trong tiếng Việt, giới từ “tại” ở đầu danh sách áp dụng tự nhiên cho cả ba địa điểm.
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
  choice: Kíp-rốt Ha-tha-va[a]
  rationale: Cụm từ là một địa danh cố định nên được phiên âm; nghĩa cấu tạo của tên được nêu trong chú thích để người đọc vẫn nhận ra lối chơi nghĩa của trình thuật.
- source_word: מַקְצִפִים
  choice: chọc giận
  rationale: Phân từ Hiphil của קצף mang nghĩa gây cho ai nổi giận; “chọc giận” diễn đạt tự nhiên và giữ rõ lực khiến-gây.
- source_word: הֱיִיתֶם
  choice: cứ
  rationale: Khi היה kết hợp với phân từ, cấu trúc diễn tả hành động kéo dài hoặc lặp lại trong quá khứ; “cứ” thể hiện sắc thái tiếp diễn/đặc trưng mà không làm câu nặng nề.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: אֶת đánh dấu tân ngữ và không cần dịch riêng; danh riêng giao ước יהוה được phiên âm là “Yahweh” thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh. Giữ “Yahweh” giúp phân biệt danh riêng này với các tước hiệu và không đưa thêm một truyền thống hệ phái vào câu.
- issue: Sắc thái của היה kết hợp với phân từ מַקְצִפִים
  choice: anh em cứ chọc giận
  alternative: anh em đã chọc giận; anh em đang chọc giận
  rationale: Cấu trúc có thể được diễn đạt như một hành động tiếp diễn trong quá khứ. “Cứ” giữ sắc thái kéo dài hoặc lặp lại mà không xác định quá mức chính xác phương diện của hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều mà Môi-se dùng để nói với cộng đồng Israel, tránh sắc thái cổ hoặc miệt thị của “các ngươi”. Ba giới từ Hê-bơ-rơ được gom tự nhiên dưới một từ “Tại” trong tiếng Việt; liên từ được thể hiện bằng “và” trước địa điểm cuối. Dấu chú thích được đặt ngay sau Kíp-rốt Ha-tha-va vì chú thích giải nghĩa địa danh này.
