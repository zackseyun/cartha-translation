    rationale: וּ là liên từ nối tiếp và trong câu này được dịch tự nhiên là “Còn/Thế nhưng” hoặc có thể không dịch riêng. “Cũng” đầu câu dễ bị hiểu là một yếu tố bổ sung song song, trong khi גַּם ở mệnh đề sau mới là từ đánh dấu “cũng” rõ rệt.
  - severity: low
