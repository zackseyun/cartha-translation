source:
  edition: WLC
  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: vi
  text: Yahweh nổi giận dữ dội với A-rôn[a], để tiêu diệt ông; lúc ấy tôi cũng cầu nguyện cho A-rôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chống lại A-rôn.” Giới từ Hê-bơ-rơ ở đây cũng có thể được dịch theo cách này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: cũng ... với A-rôn
  rationale: Liên từ וּ tiếp nối ý trước, còn בְ với động từ chỉ sự nổi giận có thể diễn tả người hứng chịu cơn giận. Cách nói “nổi giận ... với A-rôn” tự nhiên trong tiếng Việt; “nghịch cùng A-rôn” vẫn là một khả năng nên được ghi ở chú thích.
- source_word: הִתְאַנַּף ... מְאֹד
  choice: nổi giận dữ dội
  rationale: Động từ Hitpael của אנף diễn tả sự nổi giận, và מְאֹד gia tăng cường độ. “Nổi giận dữ dội” vừa rõ nghĩa vừa giữ được sức nặng của nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: לְהַשְׁמִידוֹ
  choice: đến mức muốn tiêu diệt ông
  rationale: לְ cộng nguyên mẫu Hiphil của שׁמד nêu kết quả hoặc ý hướng gắn với cơn giận. “Đến mức muốn tiêu diệt ông” tự nhiên trong tiếng Việt và không xác định quá mức quan hệ cú pháp vốn có thể hiểu là “để tiêu diệt ông”.
- source_word: וָאֶתְפַּלֵּל
  choice: tôi ... cầu nguyện
  rationale: Hitpael của פלל thường có nghĩa là cầu nguyện. Ngữ cảnh và cụm בְּעַד cho thấy đây là lời cầu thay, nhưng giữ “cầu nguyện” sát hơn với từ nguồn.
- source_word: גַּם
  choice: cũng
  rationale: Từ này cho biết Môi-se đã cầu nguyện cho A-rôn ngoài việc cầu nguyện cho dân chúng.
- source_word: בְּעַד אַהֲרֹן
  choice: cho A-rôn
  rationale: Trong ngữ cảnh cầu nguyện, בְּעַד mang nghĩa “cho, thay cho”; “cầu nguyện cho A-rôn” là cách nói tự nhiên và rõ ràng.
- source_word: בָּעֵת הַהִוא
  choice: lúc ấy
  rationale: Cụm thời gian này chỉ về thời điểm của biến cố đang được thuật lại; “lúc ấy” gọn, tự nhiên và chính xác.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA hoặc Giê-hô-va
  rationale: Nguyên văn dùng danh riêng יהוה. Phiên âm “Yahweh” bảo tồn việc bản văn nêu danh của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- issue: Mức độ xác định ý định tiêu diệt A-rôn
  choice: đến mức muốn tiêu diệt ông
  alternative: để tiêu diệt ông
  rationale: Cấu trúc לְהַשְׁמִידוֹ có thể biểu đạt ý hướng hoặc kết quả dự kiến. Bản dịch chọn cách diễn đạt tự nhiên nhưng không biến việc tiêu diệt thành một biến cố đã xảy ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “A-rôn” theo lối phiên âm Kinh Thánh quen thuộc trong tiếng Việt; giữ danh “Yahweh” theo dạng phiên âm. Dấu chấm phẩy bảo tồn hai mệnh đề liên kết chặt chẽ của câu Hê-bơ-rơ.
