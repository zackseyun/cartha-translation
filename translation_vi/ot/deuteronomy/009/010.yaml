    rationale: Cấu trúc này có thể khiến «ngón tay» được hiểu như chủ thể trực tiếp thực hiện hành động. «Được viết bằng ngón tay Đức Chúa Trời» diễn đạt chính xác chức năng phương tiện của בְּ mà không giải thích giảm nhẹ hình ảnh nguyên văn.
  - severity: low
