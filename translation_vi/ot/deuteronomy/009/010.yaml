- from: Rồi Yahweh trao cho tôi hai bảng đá, do ngón tay Đức Chúa Trời viết[a]. Trên đó có tất cả những lời Yahweh đã phán với anh em[b] trên núi, từ giữa ngọn lửa, trong ngày hội họp.
  to: Rồi Yahweh trao cho tôi hai bảng đá, được viết bằng ngón tay Đức Chúa Trời[a]. Trên các bảng ấy có tất cả những lời Yahweh đã phán với anh em[b] trên núi, từ giữa ngọn lửa, trong ngày hội họp.
  rationale: Chỉnh sửa tối thiểu để làm rõ quan hệ phương tiện của «bằng ngón tay Đức Chúa Trời» và quy chiếu số nhiều của «các bảng ấy». Các yếu tố nội dung, trật tự ý chính, danh Yahweh, hình ảnh nhân hình, và sắc thái «phán với anh em» đều được giữ nguyên.
