  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: vi
  text: Rồi Yahweh trao cho tôi hai bảng đá, được viết bằng ngón tay Đức Chúa Trời[a]. Trên các bảng ấy có tất cả những lời Yahweh đã phán với anh em[b] trên núi, từ giữa ngọn lửa, trong ngày hội họp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do ngón tay Đức Chúa Trời viết.”'
    reason: Giới từ בְּ có thể được diễn đạt theo sắc thái phương tiện (“bằng”) hoặc tác nhân (“do”) trong tiếng Việt.
  - marker: b
    text: 'Cũng có thể dịch: “đã phán cho anh em.” Nguyên văn dùng giới từ mang nghĩa đen là “với.”'
    reason: Ghi nhận cách dịch tự nhiên theo đích hướng của lời nói, đồng thời cho biết cấu trúc trực tiếp của tiếng Hê-bơ-rơ.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: trao cho
  rationale: Diễn đạt tự nhiên hành động giao hai bảng đá cho Môi-se, đồng thời giữ đúng nghĩa cơ bản của נתן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước được nêu trực tiếp trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: hai bảng đá
  rationale: Cách nói ngắn gọn, tự nhiên trong tiếng Việt và thể hiện đúng chất liệu cùng số lượng của các bảng.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: do ngón tay Đức Chúa Trời viết
  rationale: Giữ nguyên hình ảnh nhân hình cụ thể của nguyên văn và thể hiện quan hệ phương tiện/tác nhân của giới từ בְּ.
- source_word: כְּכָל הַדְּבָרִים
  choice: tất cả những lời
  rationale: Trong ngữ cảnh mặc khải được nói ra rồi ghi trên bảng, דְּבָרִים chỉ nội dung lời phán; כְּ ở đây diễn tả sự tương ứng trọn vẹn về nội dung.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: Yahweh đã phán với anh em
  rationale: “Đã phán” phù hợp với sự kiện xảy ra trước lúc trao bảng; “với anh em” giữ gần nghĩa trực tiếp của עִם mà vẫn tự nhiên trong tiếng Việt.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: từ giữa ngọn lửa
  rationale: Bảo toàn ý nghĩa không gian cụ thể của מִתּוֹךְ, thay vì giản lược thành “từ ngọn lửa”.
- source_word: בְּיוֹם הַקָּהָל
  choice: trong ngày hội họp
  rationale: Diễn đạt ngày dân Y-sơ-ra-ên tập hợp thành cộng đồng để nghe lời Đức Chúa Trời, với văn phong trang trọng nhưng dễ hiểu.
theological_decisions:
- issue: Hình ảnh nhân hình về hành động của Đức Chúa Trời
  choice: do ngón tay Đức Chúa Trời viết
  alternative: do quyền năng của Đức Chúa Trời viết
  rationale: Nguyên văn nói rõ “ngón tay Đức Chúa Trời”; bản dịch giữ hình ảnh này thay vì giải nghĩa nó thành một khái niệm trừu tượng.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA
  rationale: Giữ danh riêng giao ước có trong nguyên văn, phù hợp với định hướng của dự án và không thay bằng tước hiệu.
- issue: Sắc thái của עִמָּכֶם sau động từ “phán”
  choice: phán với anh em
  alternative: phán cho anh em
  rationale: “Với” phản ánh trực tiếp giới từ עִם và giữ sắc thái cuộc gặp gỡ giữa Yahweh với dân chúng; “cho” là cách diễn đạt theo đích đến của lời phán nhưng ít sát hình thức hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được tách làm hai để tránh một câu tiếng Việt quá dài, nhưng vẫn giữ nguyên trình tự ý của bản Hê-bơ-rơ. Đại từ “anh em” thể hiện lời Môi-se trực tiếp nói với cộng đồng Y-sơ-ra-ên.
