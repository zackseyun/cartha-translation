  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְ/חֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת יְהוָ֑ה וַ/יִּתְאַנַּ֧ף יְהוָ֛ה בָּ/כֶ֖ם לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: vi
  text: Ngay tại Hô-rếp[a], anh em đã chọc giận Yahweh, và Yahweh nổi giận với anh em để tiêu diệt anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tại Hô-rếp” hoặc “Và tại Hô-rếp”; liên từ Hê-bơ-rơ có thể chỉ đơn thuần tiếp nối lời kể, dù ở đây có lẽ mang sắc thái nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “Yahweh nổi giận với anh em nhằm tiêu diệt anh em” hoặc “Yahweh nổi giận với anh em đến mức tiêu diệt anh em.” Tiếng Hê-bơ-rơ gắn trực tiếp cơn giận của Yahweh với việc tiêu diệt được nêu sau đó; cấu trúc này có thể diễn tả mục đích hoặc hệ quả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: Ngay tại Hô-rếp
  rationale: Liên từ וּ có thể chỉ tiếp nối lời kể, nhưng trong mạch văn này có thể mang sắc thái nhấn mạnh. “Ngay tại” diễn đạt tự nhiên sắc thái ấy, còn địa danh חֹרֵב được phiên âm là “Hô-rếp”.
- source_word: הִקְצַפְתֶּם
  choice: anh em đã chọc giận
  rationale: Dạng Hiphil của קצף có nghĩa gây nên cơn giận. “Chọc giận” giữ được ý gây ra sự phẫn nộ mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: וַיִּתְאַנַּף ... בָּכֶם
  choice: nổi giận với anh em
  rationale: Động từ אנף diễn tả cơn giận mạnh; “nổi giận với” là cách nói tự nhiên và trang trọng vừa phải trong tiếng Việt.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: để tiêu diệt anh em
  rationale: Dạng Hiphil của שׁמד diễn tả việc hủy diệt hoặc diệt trừ. Giới từ לְ gắn trực tiếp cơn giận với sự hủy diệt, có thể chỉ mục đích hoặc kết quả; bản dịch chính giữ cấu trúc “để” mà không làm nhẹ sức nặng của lời này.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” giúp phân biệt danh riêng này với tước hiệu “Chúa” và không áp đặt một cách đọc mang tính hệ phái.
- issue: Mối liên hệ giữa cơn giận của Yahweh và việc hủy diệt
  choice: nổi giận với anh em để tiêu diệt anh em
  alternative: nổi giận với anh em đến mức muốn tiêu diệt anh em
  rationale: Cấu trúc לְ + động từ nguyên mẫu có thể được hiểu theo mục đích hoặc kết quả. Bản dịch chính giữ mối liên hệ trực tiếp và căng thẳng thần học của nguyên văn, còn chú thích nêu cách hiểu khác mà không quyết định thay người đọc.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với dân chúng; giữ địa danh quen thuộc “Hô-rếp” và phiên âm thần danh là “Yahweh”.
