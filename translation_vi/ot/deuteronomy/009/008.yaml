    issue: Vị trí ký hiệu chú thích b
    rationale: Ký hiệu hiện đứng sau dấu chấm, trong khi chú thích giải thích cụm “để tiêu diệt anh em.” Nên đặt [b] ngay sau cụm này để neo chú thích rõ ràng.
  - severity: low
    issue: Chú thích b thêm ý “muốn”
    rationale: “Muốn tiêu diệt” là một cách diễn giải có thể chấp nhận về ý hướng của cấu trúc nguyên mẫu, nhưng không cần thiết và làm chú thích hẹp hơn nguyên văn. Nên nêu các khả năng “nhằm tiêu diệt” và “đến mức tiêu diệt” để giữ độ mở mục đích/hệ quả.
