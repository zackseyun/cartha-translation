  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: vi
  text: Hỡi Israel, hãy nghe! Hôm nay anh em sẽ vượt sông Giô-đanh để vào chiếm lấy đất đai của các dân tộc[a] lớn và hùng mạnh hơn anh em, có những thành lớn và kiên cố cao tận trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đuổi các dân tộc ấy đi để chiếm lấy xứ sở của họ.” Động từ Hê-bơ-rơ có thể mang nghĩa nhận hoặc chiếm hữu; trong bối cảnh chinh phục này, nó cũng hàm ý tước chỗ những cư dân trước.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “đến các tầng trời,” một lối nói cường điệu chỉ những công sự phòng thủ rất cao.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Hỡi Israel, hãy nghe!
  rationale: Mệnh lệnh số ít hướng đến Israel như một cộng đồng. Cách dịch này giữ lời kêu gọi giao ước quen thuộc trong Phục Truyền Luật Lệ Ký, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: עֹבֵר הַיּוֹם
  choice: Hôm nay anh em sẽ vượt
  rationale: Phân từ đi với “hôm nay” diễn tả hành động đang cận kề. “Sẽ vượt” phù hợp ngữ cảnh Israel chuẩn bị qua sông, còn việc đặt “hôm nay” đầu câu giữ trọng tâm thời gian.
- source_word: אֶת־הַיַּרְדֵּן
  choice: sông Giô-đanh
  rationale: Thêm danh từ loại “sông” để địa danh rõ ràng và tự nhiên đối với độc giả Việt, dù tiếng Hê-bơ-rơ chỉ dùng tên riêng có mạo từ.
- source_word: לָבֹא
  choice: để tiến vào
  rationale: Giữ sắc thái chuyển động vào trong miền đất sau khi vượt sông và liên kết tự nhiên với động từ nguyên mẫu kế tiếp.
- source_word: לָרֶשֶׁת גּוֹיִם
  choice: chiếm lấy lãnh thổ của các dân tộc
  rationale: Trong bối cảnh chinh phục, ירשׁ chỉ việc giành quyền sở hữu bằng cách thay thế hoặc truất chỗ những cư dân trước. Tiếng Việt cần nêu “lãnh thổ” để tránh cách nói thiếu tự nhiên “chiếm lấy các dân tộc”; chú thích giữ lại khả năng diễn đạt nhấn mạnh việc đuổi họ đi.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: lớn và hùng mạnh hơn anh em
  rationale: “Lớn” giữ phạm vi nghĩa về quy mô hoặc tầm vóc, còn “hùng mạnh” diễn đạt sức mạnh của các dân tộc. “Anh em” xưng hô với Israel như một cộng đồng bằng tiếng Việt tự nhiên.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת
  choice: những thành lớn và kiên cố
  rationale: Diễn đạt rõ các thành thuộc về những dân tộc vừa nói đến, với “kiên cố” mô tả công sự phòng thủ.
- source_word: בַּשָּׁמָיִם
  choice: cao tận trời
  rationale: Giữ hình ảnh cường điệu về độ cao phi thường của tường thành bằng một thành ngữ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của ירשׁ trong bối cảnh chinh phục
  choice: chiếm lấy lãnh thổ của các dân tộc
  alternative: đuổi các dân tộc ấy đi để chiếm chỗ của họ; nhận làm cơ nghiệp
  rationale: Động từ có thể chỉ nhận quyền sở hữu hoặc chiếm hữu bằng cách truất chỗ người đang ở. Bản dịch chính thể hiện kết quả chiếm hữu mà không áp đặt một cách diễn giải thần học riêng; chú thích bảo tồn sắc thái thay thế cư dân trong ngữ cảnh.
- issue: Lối nói cường điệu về thành lũy
  choice: kiên cố cao tận trời
  alternative: kiên cố đến các tầng trời; vô cùng cao và kiên cố
  rationale: Giữ nguyên hình ảnh tu từ của bản Hê-bơ-rơ thay vì làm phẳng thành một lời giải thích thuần túy hoặc hiểu theo nghĩa đen.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hỡi Israel, hãy nghe!” giữ sắc thái lời triệu gọi; “anh em” tránh đại từ cổ “ngươi” nhưng vẫn xưng hô với Israel như một cộng đồng. Hình ảnh “cao tận trời” được giữ thay vì giải nghĩa ngay trong câu.
