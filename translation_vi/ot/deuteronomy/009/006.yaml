source:
  edition: WLC
  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: vi
  text: Vậy, hãy biết rằng không phải vì sự công chính của anh em mà Đức Giê-hô-va, Đức Chúa Trời của anh em, ban cho anh em xứ tốt đẹp này để chiếm hữu[a], vì anh em là một dân cứng cổ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để thừa hưởng”. Động từ Hê-bơ-rơ có thể chỉ việc nhận cơ nghiệp, nhưng trong sách Phục Truyền Luật Lệ, từ này thường bao hàm ý tiến vào chiếm lấy và sở hữu xứ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Vậy, hãy biết rằng
  rationale: Động từ hoàn thành Qal ngôi hai số ít được dùng với sắc thái khuyên truyền/mệnh lệnh; liên từ nối kết câu này như kết luận từ lập luận trước.
- source_word: לֹא בְצִדְקָתְךָ
  choice: không phải vì sự công chính của anh em
  rationale: Giới từ בְּ chỉ căn cứ hay lý do, phủ nhận sự công chính của Israel là cơ sở để nhận đất.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Đức Giê-hô-va, Đức Chúa Trời của anh em
  rationale: Giữ danh riêng giao ước YHWH theo cách phiên âm quen thuộc trong tiếng Việt và diễn đạt rõ quan hệ giao ước.
- source_word: נֹתֵן לְךָ
  choice: ban cho anh em
  rationale: Phân từ diễn tả hành động đang diễn ra hoặc sắp được thực hiện; trong tiếng Việt, hiện tại không đánh dấu là tự nhiên và không xác định quá mức thời thể.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: xứ tốt đẹp này
  rationale: “Xứ” tự nhiên trong ngữ cảnh miền đất hứa và giữ được tính xác định của đại từ chỉ thị.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: ירשׁ trong Phục Truyền thường bao hàm việc tiếp nhận đồng thời tiến vào nắm quyền sở hữu xứ; “chiếm hữu” giữ sắc thái này.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: một dân cứng cổ
  rationale: Giữ nguyên ẩn dụ Hê-bơ-rơ về sự ngoan cố và phản nghịch thay vì chỉ diễn giải là “bướng bỉnh”.
theological_decisions:
- issue: Lý do Israel nhận được xứ
  choice: Câu này phủ nhận rằng sự công chính của Israel là căn cứ khiến Đức Giê-hô-va ban xứ.
  alternative: Diễn đạt câu như một lời khuyên khiêm nhường chung chung, không nhấn mạnh sự bất xứng trong giao ước.
  rationale: Nguyên văn đối chiếu rõ sự công chính bị phủ nhận với hành động ban xứ của Đức Chúa Trời và bản tính cứng cổ của dân.
- issue: Lối xưng hô số ít mang nghĩa tập thể
  choice: Dùng “anh em” để nói với Israel như một cộng đồng, rồi dùng danh từ tập thể “một dân”.
  alternative: Dùng “ngươi” theo đúng hình thái số ít hoặc mở rộng thành “tất cả anh em”.
  rationale: “Anh em” là lối xưng hô hiện đại, trang trọng và tự nhiên với cộng đồng; “một dân” vẫn bảo toàn ý niệm Israel là một tập thể thống nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ ẩn dụ “cứng cổ”, dùng “xứ” trong ngữ cảnh miền đất hứa, và dùng “anh em” cho đại từ số ít mang nghĩa tập thể. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
