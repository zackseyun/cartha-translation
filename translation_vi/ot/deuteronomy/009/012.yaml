id: DEU.9.12
reference: Deuteronomy 9:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với tôi: “Hãy đứng dậy, mau xuống khỏi đây, vì dân của con, dân mà con đã đưa ra khỏi Ai Cập, đã tự làm hư hỏng mình. Chúng đã mau chóng lìa khỏi con đường Ta truyền cho chúng; chúng đã làm cho mình một tượng đúc[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tượng kim loại đúc.” Từ Hê-bơ-rơ chỉ một hình tượng được tạo bằng cách đúc kim loại.'
    reason: Nêu rõ nghĩa vật chất và phương thức chế tác của thuật ngữ Hê-bơ-rơ.
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi riêng quen thuộc trong tiếng Việt để thể hiện danh giao ước YHWH, thay vì thay thế bằng một tước hiệu chung.
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: Hãy đứng dậy, mau xuống khỏi đây
  rationale: Giữ chuỗi mệnh lệnh dồn dập và ý chỉ hướng đi xuống từ nơi Môi-se đang ở.
- source_word: שִׁחֵת
  choice: đã tự làm mình bại hoại
  rationale: Diễn đạt sắc thái tự chuốc lấy sự hư hoại về đạo đức và tôn giáo trong ngữ cảnh, đồng thời không giảm nhẹ lời quở trách.
- source_word: עַמְּךָ אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: dân của con, dân mà con đã đưa ra khỏi Ai Cập
  rationale: Giữ nguyên cách Đức Chúa Trời quy dân ấy cho Môi-se và lời nói có tính chất tạo khoảng cách; lặp 'dân' giúp câu tiếng Việt rõ và tự nhiên.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: đã mau chóng lìa khỏi con đường
  rationale: Giữ sự lặp lại ý khẩn cấp của מַהֵר và ẩn dụ về việc rời bỏ nếp sống đã được truyền dạy.
- source_word: מַסֵּכָה
  choice: một tượng đúc
  rationale: Chỉ cụ thể một hình tượng được tạo bằng cách đúc kim loại, chính xác hơn từ chung 'thần tượng'.
theological_decisions:
- issue: Cách nói tạo khoảng cách trong cụm 'dân của con, dân mà con đã đưa ra khỏi Ai Cập'
  choice: Giữ nguyên việc Đức Giê-hô-va gọi họ là dân của Môi-se và nói Môi-se đã đưa họ ra khỏi Ai Cập.
  alternative: Làm mềm thành 'dân Ta' hoặc 'dân mà Ta đã đưa ra khỏi Ai Cập'.
  rationale: Nguyên văn đặt đại từ ngôi thứ hai trong lời quở trách. Bản dịch giữ nguyên sự căng thẳng tu từ và thần học, không tự giải thích hay điều hòa với các câu khác.
- issue: Bản chất của מַסֵּכָה
  choice: tượng đúc
  alternative: thần tượng; tượng kim loại nung chảy
  rationale: Nguyên văn nêu phương thức chế tác của hình tượng. 'Tượng đúc' giữ chi tiết cụ thể mà không thêm lời đánh giá vốn đã rõ từ ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “Ta/con” thể hiện lời Đức Giê-hô-va phán với Môi-se; “chúng” chỉ dân chúng và duy trì sắc thái quở trách. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
