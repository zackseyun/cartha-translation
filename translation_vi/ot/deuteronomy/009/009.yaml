id: DEU.9.9
reference: Deuteronomy 9:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: vi
  text: Khi tôi lên núi để nhận các bảng đá[a], tức là các bảng giao ước mà Yahweh đã lập với anh em[b], tôi ở lại trên núi bốn mươi ngày và bốn mươi đêm; tôi không ăn bánh, cũng không uống nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “lấy”; ở đây “nhận” diễn tả việc Môi-se lên núi để được trao các bảng đá.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen là “đã cắt với anh em”, một thành ngữ Hê-bơ-rơ thông dụng có nghĩa là lập giao ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי
  choice: Khi tôi lên
  rationale: Cấu trúc ב + động từ nguyên mẫu với hậu tố ngôi thứ nhất mang nghĩa thời gian; cách dịch này tự nhiên và giữ rõ chuyển động đi lên.
- source_word: הָהָרָה
  choice: núi
  rationale: Danh từ xác định kèm ה chỉ hướng nói đến ngọn núi cụ thể trong văn cảnh; tiếng Việt không cần lặp từ chỉ định để diễn đạt tính xác định này.
- source_word: לָקַחַת
  choice: để nhận
  rationale: Nghĩa cơ bản là “lấy”, nhưng trong văn cảnh Môi-se lên núi để được trao các bảng đá; “nhận” diễn đạt tự nhiên quan hệ cho–nhận mà không thay đổi ý.
- source_word: לוּחֹת הָאֲבָנִים
  choice: các bảng đá
  rationale: Diễn đạt gọn và tự nhiên chất liệu của các bảng, tương ứng với kết cấu sở thuộc trong tiếng Hê-bơ-rơ.
- source_word: לוּחֹת הַבְּרִית
  choice: các bảng giao ước
  rationale: Giữ cụm đồng vị lặp lại của nguyên văn, qua đó xác định các bảng đá là những bảng gắn với giao ước.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: mà Yahweh đã lập với anh em
  rationale: כרת, nghĩa đen là “cắt”, nằm trong thành ngữ lập giao ước; “lập” là cách nói chuẩn và tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu, phù hợp trực tiếp với dạng יְהוָה của nguyên văn.
- source_word: וָאֵשֵׁב
  choice: tôi ở lại
  rationale: ישב có thể là “ngồi”, “cư ngụ” hoặc “ở lại”; ở đây thời gian lưu lại trên núi là trọng tâm.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: bốn mươi ngày và bốn mươi đêm
  rationale: Cách diễn đạt trực tiếp, tự nhiên, giữ nguyên công thức chỉ thời lượng của tiếng Hê-bơ-rơ.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: tôi không ăn bánh
  rationale: Giữ danh từ cụ thể “bánh” của nguyên văn thay vì mở rộng thành “thức ăn”.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: cũng không uống nước
  rationale: “Cũng không” tạo thế song hành phủ định tự nhiên trong tiếng Việt với mệnh đề trước.
theological_decisions:
- issue: Cách dịch danh YHWH (יְהוָה)
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước; giữ “Yahweh” bảo tồn sự phân biệt giữa danh riêng và tước hiệu mà không đưa thêm cách giải thích hệ phái.
- issue: Thành ngữ כרת giao ước
  choice: lập giao ước
  alternative: cắt giao ước
  rationale: “Cắt” là hình thức nghĩa đen của thành ngữ Hê-bơ-rơ nhưng không phải cách nói tự nhiên trong tiếng Việt; “lập” giữ đúng ý mà không áp đặt nội dung thần học ngoài câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho hậu tố số nhiều ngôi thứ hai, phù hợp lời Môi-se nói với cộng đồng Israel. Giữ phép lặp “các bảng đá, tức là các bảng giao ước” để phản ánh cấu trúc nhấn mạnh của nguyên văn.
