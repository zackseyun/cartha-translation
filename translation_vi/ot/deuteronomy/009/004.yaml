  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: vi
  text: 'Khi Yahweh, Đức Chúa Trời của anh em, đuổi chúng khỏi trước mặt anh em, thì đừng tự nhủ[a]: “Vì sự công chính của tôi mà Yahweh đã đưa tôi vào để chiếm hữu xứ này.” Còn vì sự gian ác của các dân tộc ấy mà Yahweh trục xuất họ khỏi trước mặt anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đừng nói trong lòng anh em.”'
    reason: Giữ lại hình ảnh thành ngữ Hê-bơ-rơ đứng sau cách diễn đạt tự nhiên “đừng tự nhủ” trong chính văn.
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: đừng tự nhủ
  rationale: אַל với thể chưa hoàn thành diễn đạt lệnh cấm; בִּלְבָבְךָ chỉ lời nói hay suy nghĩ trong lòng. “Đừng tự nhủ” chuyển tải tự nhiên toàn thành ngữ trong tiếng Việt.
- source_word: בַּהֲדֹף
  choice: khi ... đuổi ... khỏi
  rationale: בְּ với động từ nguyên mẫu liên kết đánh dấu hoàn cảnh thời gian; נדף mang nghĩa xua hoặc đẩy đi. Cách dịch này rõ ràng trong bối cảnh chinh phục.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tự nhiên công thức giao ước với hậu tố sở hữu ngôi thứ hai số ít; “anh em” phù hợp lối xưng hô tập thể với Israel trong văn mạch.
- source_word: מִלְּפָנֶיךָ / מִפָּנֶיךָ
  choice: khỏi trước mặt anh em
  rationale: Giữ sắc thái không gian của thành ngữ Hê-bơ-rơ và vẫn tự nhiên trong tiếng Việt.
- source_word: בְּצִדְקָתִי
  choice: Vì sự công chính của tôi
  rationale: Giữ danh từ thần học צְדָקָה và quan hệ nguyên nhân, qua đó bảo toàn lời tự nhận về công trạng mà Môi-se đang bác bỏ.
- source_word: הֱבִיאַנִי
  choice: đã đưa tôi vào
  rationale: Dạng Hiphil của בוא có nghĩa khiến vào hay đưa vào; từ “vào” nêu rõ việc tiến vào đất.
- source_word: לָרֶשֶׁת
  choice: chiếm hữu
  rationale: ירשׁ trong ngữ cảnh này nói đến việc Israel nhận và nắm quyền sở hữu đất; “chiếm hữu” vừa gọn vừa giữ nét chủ động của từ.
- source_word: הָאָרֶץ הַזֹּאת
  choice: xứ này
  rationale: “Xứ” là cách diễn đạt trang trọng, dễ hiểu cho miền đất được nói đến trong ngữ cảnh giao ước.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: Trái lại, chính vì sự gian ác của các dân tộc ấy
  rationale: Waw tạo sự đối lập với lời tự cho mình là công chính. “Trái lại” làm rõ tương phản, còn “chính vì” phản ánh quan hệ nguyên nhân được nhấn mạnh trong mạch lập luận.
- source_word: מוֹרִישָׁם
  choice: đuổi chúng
  rationale: Dạng Hiphil của ירשׁ ở đây có nghĩa làm cho mất quyền sở hữu, tức trục xuất khỏi đất. “Đuổi chúng” tự nhiên và phù hợp với hành động được mô tả.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Văn bản dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Hàm ý Israel xứng đáng nhận đất nhờ công trạng
  choice: Giữ nguyên lời tự nhận “Vì sự công chính của tôi” trong câu trích dẫn, rồi nêu sự tương phản của mệnh đề sau
  alternative: Diễn giải thành “Vì tôi tốt lành/xứng đáng”
  rationale: צְדָקָה có chiều kích đạo đức và thần học; giữ “sự công chính” bảo toàn sức căng của lời cảnh cáo, không làm nhẹ hoặc giải thích thay cho bản văn.
- issue: Quan hệ giữa hai nguyên nhân được nêu trong câu
  choice: “Trái lại, chính vì”
  alternative: “và vì” hoặc “trong khi vì”
  rationale: Mạch văn đối lập lời Israel tự gán việc nhận đất cho sự công chính của mình với nguyên nhân liên quan đến sự gian ác của các dân. Cách dịch nêu rõ tương phản nhưng không khẳng định đây là toàn bộ nền tảng thần học của việc ban đất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai số ít có đối tượng tập thể là Israel; giữ “sự công chính,” “sự gian ác” và “xứ” để bảo toàn sắc thái Kinh Thánh mà không trở nên cổ kính quá mức.
