revisions:
- from: 'Khi Yahweh, Đức Chúa Trời của anh em, đuổi chúng khỏi trước mặt anh em, thì đừng tự nhủ[a]: ‘Vì sự công chính của tôi mà Yahweh đã đưa tôi vào chiếm hữu xứ này.’ Trái lại, chính vì sự gian ác của các dân tộc ấy mà Yahweh đuổi chúng khỏi trước mặt anh em.'
  to: 'Khi Yahweh, Đức Chúa Trời của anh em, đuổi chúng khỏi trước mặt anh em, thì đừng tự nhủ[a]: “Vì sự công chính của tôi mà Yahweh đã đưa tôi vào để chiếm hữu xứ này.” Còn vì sự gian ác của các dân tộc ấy mà Yahweh trục xuất họ khỏi trước mặt anh em.'
  rationale: 'Bản sửa chỉ điều chỉnh những điểm nhỏ để sát nguyên văn hơn: giữ quan hệ mục đích của “để chiếm hữu,” không thêm sự nhấn mạnh đối lập quá mức, và phân biệt hành động “đuổi” (נדף) với việc “trục xuất/làm mất quyền sở hữu” (הוריש). Dấu neo chú thích và nội dung chú thích vẫn đúng vị trí, không có thay đổi ý nghĩa.'
  reviewer_model: gpt-5.6-terra
