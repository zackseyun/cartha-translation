source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּ֞ל לִ/פְנֵ֣י יְהוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַ/יּ֛וֹם וְ/אֶת אַרְבָּעִ֥ים הַ/לַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי אָמַ֥ר יְהוָ֖ה לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: vi
  text: Vậy tôi đã phủ phục trước mặt Yahweh trong bốn mươi ngày và bốn mươi đêm ấy, là thời gian tôi đã phủ phục, vì Yahweh đã phán rằng Ngài sẽ tiêu diệt anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְנַפַּל / הִתְנַפָּלְתִּי
  choice: tôi phủ phục / tôi đã phủ phục như thế
  rationale: Thể Hitpael của נפל diễn tả Môi-se tự hạ mình, nằm sấp trước mặt Đức Chúa Trời trong sự cầu thay. “Phủ phục” vừa tự nhiên vừa giữ được sắc thái chủ động hạ mình; việc lặp lại động từ phản ánh sự lặp lại có thật trong tiếng Hê-bơ-rơ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי chỉ vị trí hoặc sự hiện diện, nên “trước mặt” phù hợp. Danh giao ước יְהוָה được phiên âm là “Yahweh”.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה
  choice: suốt bốn mươi ngày và bốn mươi đêm ấy
  rationale: Đối cách chỉ khoảng thời gian được diễn đạt tự nhiên bằng “suốt”; mạo từ xác định được thể hiện bằng “ấy”, liên kết với khoảng thời gian đã được nhắc đến.
- source_word: אֲשֶׁר הִתְנַפָּלְתִּי
  choice: tôi đã phủ phục như thế
  rationale: Mệnh đề quan hệ tiếng Hê-bơ-rơ nhắc lại hành động phủ phục. Chuyển thành mệnh đề sau dấu gạch ngang giúp câu tiếng Việt rõ ràng mà không xóa bỏ sự lặp lại của nguyên văn.
- source_word: כִּי
  choice: vì
  rationale: Từ này giới thiệu lý do Môi-se phủ phục và cầu thay.
- source_word: אָמַר יְהוָה
  choice: Yahweh phán
  rationale: “Phán” phù hợp với lời tuyên bố của Đức Chúa Trời. Quan hệ thời gian trước-sau đã rõ trong ngữ cảnh, nên tiếng Việt không cần thêm “đã” một cách bắt buộc.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: Ngài sẽ tiêu diệt anh em
  rationale: Động từ השמיד mang nghĩa hủy diệt. Cấu trúc nguyên mẫu sau אָמַר diễn tả hành động Yahweh tuyên bố sẽ thực hiện; “anh em” thể hiện đối tượng số nhiều trong lối nói hiện đại của Môi-se với dân Israel.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Sắc thái hành động của Môi-se
  choice: phủ phục
  alternative: ngã xuống
  rationale: Trong ngữ cảnh cầu thay, thể Hitpael nhấn mạnh việc Môi-se chủ ý hạ mình trước Yahweh hơn là vô tình té ngã; tuy vậy, chú thích vẫn ghi nhận cách dịch sát hình ảnh động từ.
- issue: Giữ sự lặp lại אֶתְנַפַּל…הִתְנַפָּלְתִּי
  choice: giữ lại bằng “tôi phủ phục…tôi đã phủ phục như thế”
  alternative: lược bỏ lần lặp thứ hai để câu gọn hơn
  rationale: Sự lặp lại hiện diện trong bản Hê-bơ-rơ và có thể nhấn mạnh thời gian cùng hành động cầu thay; bản dịch giữ lại nhưng điều chỉnh cú pháp để tiếng Việt tự nhiên.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh em” cho đối tượng số nhiều để tránh sắc thái cổ hoặc miệt thị của “các ngươi”; dùng dấu gạch ngang để giữ sự lặp lại của nguyên văn mà câu vẫn dễ hiểu.
