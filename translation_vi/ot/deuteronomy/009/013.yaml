id: DEU.9.13
reference: Deuteronomy 9:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với tôi: “Ta đã thấy dân này, và quả thật[a], đó là một dân cứng cổ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và kìa”.'
    reason: הִנֵּה có thể được chuyển sát hình thức hơn bằng lời gọi chú ý “kìa”, còn “quả thật” nhấn mạnh tính xác quyết trong văn cảnh.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, … phán
  rationale: Dạng waw liên tiếp đưa câu chuyện tiến sang lời phán kế tiếp; “Bấy giờ” diễn đạt tự nhiên trình tự ấy trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: אֵלַי לֵאמֹר
  choice: 'phán với tôi:'
  rationale: Dấu hai chấm mở lời trực tiếp truyền đạt tự nhiên công thức dẫn lời Hê-bơ-rơ; động từ “phán” phù hợp với lời của Đức Chúa Trời và vẫn giữ đối tượng “với tôi”.
- source_word: רָאִיתִי
  choice: Ta đã thấy
  rationale: Thể hoàn thành diễn tả điều Yahweh đã quan sát và nay đưa ra như một nhận định xác quyết.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: Giữ danh từ tập hợp số ít và từ chỉ định của nguyên văn.
- source_word: וְהִנֵּה
  choice: và quả thật
  rationale: “Quả thật” chuyển tải chức năng nhấn mạnh, thu hút sự chú ý của הִנֵּה bằng tiếng Việt tự nhiên, trang trọng.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: một dân cứng cổ
  rationale: Giữ hình ảnh Hê-bơ-rơ về cái cổ cứng, chỉ thái độ ngoan cố, không chịu phục tùng, thay vì chỉ diễn giải chung là “bướng bỉnh”.
- source_word: הוּא
  choice: đó là
  rationale: Cấu trúc này diễn đạt tự nhiên vị ngữ định danh số ít đi với danh từ tập hợp “dân”, không áp đặt đại từ số nhiều.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh riêng giao ước יהוה; phiên âm “Yahweh” bảo tồn tư cách tên riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của thành ngữ קְשֵׁה עֹרֶף
  choice: cứng cổ
  alternative: bướng bỉnh
  rationale: Giữ nguyên ẩn dụ thần học và văn chương về sự chống nghịch của dân, đồng thời nghĩa vẫn dễ hiểu trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Phán” dành cho lời Đức Chúa Trời; “dân cứng cổ” giữ hình ảnh Kinh Thánh. Dấu hai chấm thay cho việc dịch riêng לֵאמֹר, tránh lối nói nặng nề nhưng không làm mất chức năng dẫn lời.
