id: DEU.9.28
reference: Deuteronomy 9:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: vi
  text: 'Nếu không, xứ mà Ngài đã đưa chúng con ra khỏi đó sẽ nói[a]: ‘Vì Yahweh không thể đưa họ vào xứ mà Ngài đã hứa ban cho họ[b], và vì ghét họ, Ngài đã đưa họ ra để giết họ trong hoang mạc.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “xứ mà Ngài đã đưa chúng con ra khỏi đó”; “xứ” ở đây đại diện cho cư dân của xứ ấy.
    reason: cultural_note
  - marker: b
    text: 'Sát nghĩa hơn: “xứ mà Ngài đã phán với họ [về xứ ấy].”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Nếu không
  rationale: Diễn đạt tự nhiên hậu quả đáng lo ngại mà Môi-se muốn ngăn xảy ra; giữ được sắc thái cảnh báo của từ Hê-bơ-rơ.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: xứ mà Ngài đã đưa chúng con ra khỏi đó
  rationale: Giữ nguyên hình ảnh hoán dụ của nguyên văn, trong đó “xứ” đại diện cho cư dân của xứ ấy, đồng thời giữ đại từ ngôi thứ nhất số nhiều.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: Vì Yahweh không thể
  rationale: Truyền đạt trực tiếp lời xuyên tạc giả định của cư dân xứ ấy về khả năng của Yahweh, chứ không khẳng định Ngài thực sự bất lực.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: vào xứ mà Ngài đã hứa ban cho họ
  rationale: Trong ngữ cảnh giao ước, việc Yahweh “phán” về xứ cho dân mang lực nghĩa của lời hứa ban xứ; chú thích bảo lưu cách diễn đạt sát chữ.
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  choice: và vì ghét họ
  rationale: Giữ quan hệ nguyên nhân và lời cáo buộc gay gắt trong câu nói giả định, không làm nhẹ căng thẳng thần học.
- source_word: הוֹצִיאָם
  choice: Ngài đã đưa họ ra
  rationale: Giữ sự lặp lại của động từ יצא và âm hưởng cuộc xuất hành.
- source_word: לַהֲמִתָם
  choice: để giết họ
  rationale: Diễn đạt rõ mục đích của dạng động từ gây khiến, bằng tiếng Việt hiện đại và trang trọng.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: “Hoang mạc” phù hợp bối cảnh vùng đất hoang vu nơi dân Israel lưu lạc, đồng thời tự nhiên trong tiếng Việt chuẩn.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo toàn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Cách hiểu דִּבֶּר לָהֶם trong mệnh đề nói về xứ
  choice: đã hứa ban cho họ
  alternative: đã phán với họ [về xứ ấy]
  rationale: Ngữ cảnh lời cam kết ban đất hỗ trợ cách diễn đạt tự nhiên “hứa ban”; chú thích nêu cách hiểu sát chữ để không che khuất độ mở của cấu trúc Hê-bơ-rơ.
- issue: Lời nói rằng Yahweh không thể và ghét Israel
  choice: giữ nguyên như lời cáo buộc giả định trong câu trích dẫn
  alternative: làm nhẹ thành lời hiểu lầm về Yahweh
  rationale: Nguyên văn đặt các ý này trên môi cư dân xứ Ai Cập trong hậu quả mà Môi-se e ngại; bản dịch giữ nguyên sức căng nhưng không biến chúng thành lời khẳng định của người kể.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” khi nói với và nói về Yahweh; giữ sự chuyển đổi có chủ ý từ “chúng con” sang “họ” trong nguyên văn. Dấu chú thích [b] được đặt ngay sau cụm từ mà chú thích giải thích.
