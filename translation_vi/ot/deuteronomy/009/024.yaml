    issue: Tên יהוה được dịch là “Đức Giê-hô-va” thay vì “Yahweh”.
    rationale: Nguồn đối chiếu và quyết định thuật ngữ quy định rõ יהוה được thể hiện là “Yahweh”. Đổi sang một dạng tên khác làm bản tiếng Việt không nhất quán với chính sách tên riêng của dự án.
  - severity: low
    issue: Cụm “vẫn luôn” tăng cường mức độ liên tục.
    rationale: Nguyên ngữ diễn tả họ đã ở trong tình trạng phản nghịch kể từ ngày Môi-se biết họ. “Vẫn luôn” có thể gợi ý tính không gián đoạn tuyệt đối, vượt quá điều câu khẳng định.
  revised_text: Từ ngày tôi biết anh em, anh em đã chống nghịch Yahweh.[a]
