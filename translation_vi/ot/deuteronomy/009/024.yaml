  source_fidelity: Bản nháp truyền đạt đúng ý chính của מַמְרִים ... עִם יְהוָה và mốc thời gian מִיּוֹם דַּעְתִּי אֶתְכֶם. Tuy nhiên, “vẫn luôn” thêm sắc thái “luôn luôn” rõ hơn điều văn Hê-bơ-rơ nói; dạng hoàn thành cùng phân từ cho thấy tình trạng kéo dài từ khi Môi-se biết họ, không nhất thiết nhấn mạnh mọi thời điểm. Tên riêng יהוה nên nhất quán với quyết định nguồn và vệt kiểm chứng tiếng Anh là “Yahweh”, không phải “Đức Giê-hô-va”.
  naturalness: “Anh em đã chống nghịch Yahweh từ ngày tôi biết anh em” là tiếng Việt hiện đại, trang trọng, trực tiếp, và diễn đạt tự nhiên tính hồi cố kéo dài của câu.
