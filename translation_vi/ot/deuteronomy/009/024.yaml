  text: מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָ֑ה מִ/יּ֖וֹם דַּעְתִּ֥/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: vi
  text: Từ ngày tôi biết anh em, anh em đã chống nghịch Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ theo nghĩa đen: “phản nghịch với Yahweh”; trong ngữ cảnh, cụm từ này có nghĩa là chống lại Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: chống nghịch
  rationale: Dạng từ thuộc gốc מרה diễn tả sự phản nghịch, cưỡng lại thẩm quyền. “Chống nghịch” tự nhiên trong tiếng Việt và phù hợp với cấu trúc vị ngữ đi cùng הֱיִיתֶם.
- source_word: הֱיִיתֶם
  choice: vẫn luôn
  rationale: Động từ Qal hoàn thành ngôi hai số nhiều, trong lời tổng kết về thái độ kéo dài của Israel. “Vẫn luôn” diễn đạt trạng thái liên tục từ quá khứ đến thời điểm Môi-se đang nói.
- source_word: עִם
  choice: chống nghịch ... [với đối tượng trực tiếp]
  rationale: Nghĩa cơ bản là “với”, nhưng khi đi với מרה, giới từ này đánh dấu đối tượng bị chống lại. Tiếng Việt tự nhiên không cần dịch riêng giới từ sau động từ “chống nghịch”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi tên riêng quen thuộc và trang trọng trong tiếng Việt cho Danh Thánh יהוה, thay vì thay bằng một tước hiệu chung.
- source_word: מִיּוֹם
  choice: Từ ngày
  rationale: Giữ sát biểu thức thời gian đánh dấu điểm khởi đầu của lời cáo buộc.
- source_word: דַּעְתִּי אֶתְכֶם
  choice: tôi biết anh em
  rationale: Dịch trực tiếp động từ ידע và tân ngữ ngôi hai số nhiều; trong ngữ cảnh, câu nói đến quãng thời gian Môi-se biết và giao tiếp với dân Israel.
theological_decisions:
- issue: Cách thể hiện Danh Thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Danh Thánh. “Đức Giê-hô-va” giữ đây là tên riêng, đồng thời là hình thức lâu đời, dễ nhận biết và trang trọng trong tiếng Việt.
- issue: Sắc thái của עִם sau מַמְרִים
  choice: diễn đạt quan hệ đối nghịch bằng “chống nghịch Đức Giê-hô-va”
  alternative: “phản nghịch với Đức Giê-hô-va”
  rationale: Nghĩa đen của עִם là “với”, nhưng toàn cụm diễn tả sự chống lại Đức Giê-hô-va. Bản dịch chính truyền đạt nghĩa theo ngữ cảnh, còn chú thích bảo tồn hình thức Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều mà Môi-se dùng khi nói trực tiếp với dân Israel; “vẫn luôn” làm rõ tính kéo dài của lời cáo buộc mà không tăng mức độ bằng những từ như “ngoan cố”.
