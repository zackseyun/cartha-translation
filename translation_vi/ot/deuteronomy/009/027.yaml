base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: vi
  text: 'Xin nhớ đến các tôi tớ của Ngài: Áp-ra-ham, Y-sác và Gia-cốp. Xin đừng để tâm[a] đến sự ngoan cố[b] của dân này, đến sự gian ác của họ và tội lỗi của họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng nhìn đến” hoặc “đừng đoái đến”.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ có nghĩa là “sự cứng cỏi” hoặc “sự ngoan cố”; đây không phải chính thành ngữ “cứng cổ” được dùng ở những chỗ khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Xin nhớ đến
  rationale: Động từ mệnh lệnh זכר được dùng trong lời cầu thay dâng lên Đức Chúa Trời. “Xin nhớ đến” vừa giữ nghĩa trực tiếp vừa tự nhiên, trang trọng trong lời cầu nguyện tiếng Việt.
- source_word: לַעֲבָדֶיךָ
  choice: các tôi tớ Ngài
  rationale: עבד ở đây là cách gọi kính trọng các tổ phụ trong mối quan hệ với Đức Chúa Trời; “tôi tớ” phù hợp hơn “nô lệ” trong ngữ cảnh giao ước và cầu thay.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt hiện đại.
- source_word: אַל תֵּפֶן אֶל
  choice: Xin đừng để tâm đến
  rationale: פנה אֶל theo nghĩa đen là quay về phía, nhưng trong lời cầu xin này mang nghĩa chú ý hoặc xét đến. “Để tâm đến” diễn đạt tự nhiên ý nghĩa ấy; chú thích giữ các cách dịch sát hình ảnh hơn.
- source_word: קְשִׁי
  choice: sự cứng lòng
  rationale: Danh từ này chỉ sự cứng cỏi, ngoan cố. “Cứng lòng” tự nhiên trong tiếng Việt và không đưa vào thành ngữ “cứng cổ” vốn tương ứng với một cách diễn đạt Hê-bơ-rơ khác.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: עם chỉ một cộng đồng dân chúng; “dân này” giữ được đại từ chỉ định và phù hợp ngữ cảnh dân giao ước.
- source_word: רִשְׁעוֹ
  choice: sự gian ác của họ
  rationale: רשע ở đây nói đến điều ác về phương diện đạo đức. Hậu tố số ít quy chiếu đến danh từ tập hợp “dân”; tiếng Việt tự nhiên dùng “họ”.
- source_word: חַטָּאתוֹ
  choice: tội lỗi của họ
  rationale: חטאת chỉ tội hoặc hành vi phạm tội. Hậu tố số ít quy chiếu đến toàn dân; “của họ” diễn đạt tự nhiên quan hệ tập hợp này.
theological_decisions:
- issue: Cách dịch עבד khi nói về các tổ phụ
  choice: các tôi tớ Ngài
  alternative: các nô lệ của Ngài
  rationale: Trong lời cầu thay này, từ ngữ mang sắc thái kính trọng và chỉ mối quan hệ phục vụ Đức Chúa Trời của các tổ phụ, chứ không nhấn mạnh thân phận nô lệ.
- issue: Hậu tố số ít trên “sự gian ác” và “tội lỗi” quy chiếu đến danh từ tập hợp
  choice: của họ
  alternative: của dân ấy
  rationale: Tiếng Hê-bơ-rơ dùng hậu tố số ít phù hợp với עם như một tập thể. Tiếng Việt dùng đại từ số nhiều “họ” tự nhiên hơn mà không làm thay đổi ý nghĩa thần học.
- issue: Sắc thái của lời cầu xin Đức Chúa Trời không xét đến tội dân
  choice: Xin đừng để tâm đến
  alternative: Xin đừng nhìn đến / đoái đến
  rationale: Bản dịch giữ đây là lời cầu thay trực tiếp mà không diễn giải rằng Đức Chúa Trời quên, bỏ qua hay tha thứ theo một cơ chế thần học cụ thể không được phát biểu trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Xin” thể hiện phép lịch sự tự nhiên của lời cầu nguyện nhưng vẫn giữ lực của các mệnh lệnh Hê-bơ-rơ. Các vế cuối được phối hợp gọn bằng dấu phẩy và “hay”, tránh lặp từ không cần thiết mà vẫn giữ ba đối tượng song song của giới từ אֶל.
