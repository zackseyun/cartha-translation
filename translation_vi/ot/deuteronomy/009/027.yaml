- from: Xin nhớ đến các tôi tớ Ngài là Áp-ra-ham, Y-sác và Gia-cốp. Xin đừng để tâm[a] đến sự cứng lòng[b] của dân này, sự gian ác hay tội lỗi của họ.
  to: 'Xin nhớ đến các tôi tớ của Ngài: Áp-ra-ham, Y-sác và Gia-cốp. Xin đừng để tâm[a] đến sự ngoan cố[b] của dân này, đến sự gian ác của họ và tội lỗi của họ.'
  rationale: Sửa vị trí ký hiệu chú thích để mỗi chú thích có điểm neo đúng; phục hồi phép liệt kê ba vế bằng “và” và lặp “đến” để phản ánh ba lần אֶל; thay “sự cứng lòng” bằng “sự ngoan cố” nhằm dịch trực tiếp hơn từ קְשִׁי. Những điều chỉnh này không thêm diễn giải thần học.
