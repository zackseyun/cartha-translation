source:
  edition: WLC
  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: vi
  text: Không phải vì sự công chính của anh em hay vì lòng anh em ngay thẳng mà anh em vào chiếm hữu đất của chúng. Nhưng vì sự gian ác của các dân tộc này mà Yahweh, Đức Chúa Trời của anh em, đang đuổi chúng khỏi trước mặt anh em[a], và cũng để thực hiện lời[b] mà Yahweh đã thề với các tổ phụ của anh em[c], tức là Áp-ra-ham, Y-sác và Gia-cốp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang khiến chúng mất quyền sở hữu trước mặt anh em.” Động từ Hê-bơ-rơ có thể nhấn mạnh việc các dân ấy bị tước quyền sở hữu đất, chứ không chỉ việc họ bị đuổi đi.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lời hứa.” Từ Hê-bơ-rơ có nghĩa đen là “lời”, nhưng ở đây là lời đã được cam kết bằng một lời thề.'
    reason: lexical_alternative
  - marker: c
    text: '“Các tổ phụ” ở đây chỉ cụ thể ba vị được nêu ngay sau đó: Áp-ra-ham, Y-sác và Gia-cốp.'
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: vì sự công chính của anh em
  rationale: Giới từ בְּ trong mệnh đề phủ định mang ý nghĩa nguyên nhân; צְדָקָה chỉ sự công chính về đạo đức, được trình bày như điều không phải là căn cứ để Israel nhận đất.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: hay vì lòng anh em ngay thẳng
  rationale: יֹשֶׁר diễn tả sự ngay thẳng, còn לֵבָב chỉ nội tâm; cách diễn đạt này giữ hình ảnh Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: בָא לָרֶשֶׁת
  choice: vào chiếm hữu
  rationale: בוא kết hợp với động từ nguyên mẫu diễn tả việc đi vào xứ nhằm nhận lấy và nắm quyền sở hữu.
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: vì sự gian ác của các dân tộc này
  rationale: רִשְׁעָה là sự gian ác hoặc tội lỗi; בְּ được hiểu theo nghĩa nguyên nhân, song song với mệnh đề phủ định trước đó.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong bản Hê-bơ-rơ thay vì thay thế bằng một tước hiệu.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: đang đuổi chúng khỏi trước mặt anh em
  rationale: Dạng Hiphil của ירשׁ có thể nhấn mạnh việc khiến các dân mất quyền sở hữu hoặc bị trục xuất; bản chính dùng cách nói tự nhiên về việc Yahweh loại họ khỏi xứ, đồng thời chú thích sắc thái còn lại.
- source_word: וּלְמַעַן הָקִים
  choice: và cũng để thực hiện
  rationale: לְמַעַן nêu mục đích; הֵקִים với דָּבָר trong bối cảnh lời thề có nghĩa làm cho lời đã phán được xác lập và thực hiện.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: lời mà Yahweh đã thề
  rationale: דָּבָר theo nghĩa trực tiếp là “lời”, nhưng trong văn cảnh lời thề mang nội dung của một lời hứa; giữ “lời” bảo toàn cách diễn đạt Hê-bơ-rơ.
- source_word: לַאֲבֹתֶיךָ
  choice: với các tổ phụ của anh em
  rationale: Danh từ giống đực số nhiều ở đây được chính câu văn xác định là Áp-ra-ham, Y-sác và Gia-cốp; “tổ phụ” vừa chính xác vừa phù hợp văn phong Kinh Thánh hiện đại.
theological_decisions:
- issue: Lý do Israel được chiếm hữu đất
  choice: 'Giữ cả hai lý do được câu nêu ra: sự gian ác của các dân tộc và việc Yahweh thực hiện lời Ngài đã thề với các tổ phụ, đồng thời phủ nhận công chính của Israel là căn cứ.'
  alternative: Chỉ nhấn mạnh sự gian ác của các dân tộc, hoặc chỉ nhấn mạnh lời hứa giao ước.
  rationale: Bản Hê-bơ-rơ đặt mệnh đề כִּי bên cạnh mệnh đề mục đích וּלְמַעַן, nên không được thu hẹp lập luận thần học vào một lý do duy nhất.
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA hoặc Giê-hô-va
  rationale: Giữ danh riêng được dùng trực tiếp trong nguyên văn, không thay bằng tước hiệu.
- issue: Quan hệ giữa hành động của Yahweh và việc Israel vào nhận đất
  choice: Yahweh chủ động đuổi các dân, còn Israel vào chiếm hữu đất.
  alternative: Diễn giải hành động hoàn toàn như một thành tựu quân sự của Israel.
  rationale: Phân biệt này phản ánh chủ ngữ và động từ của nguyên văn mà không giải quyết vượt quá điều câu nói.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh em” thể hiện lời Môi-se nói với Israel như một cộng đồng, dù các hình thức ngôi thứ hai trong câu Hê-bơ-rơ ở số ít. Cấu trúc phủ định rồi đối lập được giữ rõ để bảo toàn lập luận của câu.
