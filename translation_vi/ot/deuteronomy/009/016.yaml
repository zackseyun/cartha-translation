  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: vi
  text: 'Tôi thấy, và kìa, anh em đã phạm tội chống lại Yahweh, Đức Chúa Trời của anh em: anh em đã làm cho mình một con bò con được đúc bằng kim loại[a]. Anh em đã mau chóng lìa khỏi con đường mà Yahweh đã truyền cho anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một con bò con đúc.” Cụm từ Hê-bơ-rơ chỉ một con bò con được chế tạo bằng cách đúc kim loại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Tôi nhìn
  rationale: Động từ ראה thường có nghĩa là “thấy, nhìn”. Trong mạch kể, “Tôi nhìn” kết hợp tự nhiên với từ thu hút sự chú ý tiếp theo là “kìa”.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: הִנֵּה là dấu hiệu diễn ngôn hướng sự chú ý vào điều được phát hiện. “Kìa” ngắn gọn, trang trọng và vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: anh em đã phạm tội nghịch với Yahweh, Đức Chúa Trời của anh em
  rationale: Thể hoàn thành được diễn đạt bằng “đã” trong lời hồi thuật. Với חטא, giới từ ל ở đây biểu thị đối tượng bị xúc phạm; “nghịch với” làm rõ tính chống lại Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên tên riêng giao ước được biểu thị bằng danh thánh יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: anh em đã làm cho mình
  rationale: Cấu trúc עשה + ל diễn tả việc làm một vật cho chính mình; cách dịch này giữ được sắc thái người hưởng lợi mà không gây hiểu lầm rằng họ tự tạo ra chính bản thân.
- source_word: עֵגֶל מַסֵּכָה
  choice: một con bò con bằng kim loại đúc
  rationale: מַסֵּכָה chỉ một vật, đặc biệt là tượng, được chế tạo bằng cách đúc kim loại. Cách dịch này truyền đạt cả hình dạng con bò con lẫn vật liệu và phương thức chế tác.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: Anh em đã nhanh chóng lìa khỏi con đường
  rationale: סור cùng với דֶּרֶךְ tạo hình ảnh rời khỏi con đường được truyền dạy. “Lìa khỏi” tự nhiên và giữ được ẩn dụ; מַהֵר được dịch là “nhanh chóng”.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: mà Yahweh đã truyền cho anh em
  rationale: Mệnh đề quan hệ bổ nghĩa cho “con đường”. “Đã truyền” phù hợp với lời kể lại một mệnh lệnh có trước hành vi của dân chúng.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh thánh יהוה. Phiên âm “Yahweh” bảo tồn tên riêng trong văn bản và không thay nó bằng một tước hiệu.
- issue: Sắc thái của חטא với giới từ ל
  choice: phạm tội nghịch với
  alternative: phạm tội với
  rationale: “Nghịch với” thể hiện rõ tội lỗi hướng chống lại Yahweh, nhưng không bổ sung một hệ thống thần học ngoài ý nghĩa thông thường của cấu trúc Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” thể hiện lời Môi-se nói với cộng đồng Israel. “Kìa” giữ lực nhấn của dấu hiệu diễn ngôn Hê-bơ-rơ mà không diễn giải quá mức.
