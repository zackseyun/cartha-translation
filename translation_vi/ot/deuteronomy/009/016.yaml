revisions:
- from: 'Tôi nhìn, và kìa, anh em đã phạm tội nghịch với Yahweh, Đức Chúa Trời của anh em: anh em đã làm cho mình một con bò con bằng kim loại đúc[a]. Anh em đã nhanh chóng lìa khỏi con đường mà Yahweh đã truyền cho anh em.'
  to: 'Tôi thấy, và kìa, anh em đã phạm tội chống lại Yahweh, Đức Chúa Trời của anh em: anh em đã làm cho mình một con bò con được đúc bằng kim loại[a]. Anh em đã mau chóng lìa khỏi con đường mà Yahweh đã truyền cho anh em.'
  rationale: Bản sửa thay các kết hợp từ gượng bằng cách diễn đạt tiếng Việt hiện đại hơn, đồng thời giữ nguyên trình tự hồi thuật, lực nhấn của “kìa,” danh thánh Yahweh, đại từ số nhiều “anh em,” và sắc thái của hình tượng con bò con được đúc. Không có thay đổi nào về nội dung hay diễn giải thần học.
