source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: vi
  text: 'Khi Yahweh sai anh em đi từ Ca-đe Ba-nê-a và phán: “Hãy đi lên, chiếm lấy đất mà Ta đã ban cho anh em,” thì anh em đã chống lại mệnh lệnh[a] của Yahweh, Đức Chúa Trời của anh em. Anh em không tin Ngài[b] và không nghe theo tiếng Ngài[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “chống lại miệng của Yahweh, Đức Chúa Trời của anh em”, một thành ngữ có nghĩa là chống lại lời truyền hoặc mệnh lệnh của Ngài.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không tin cậy Ngài”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “không vâng theo tiếng Ngài” hoặc “không vâng lời Ngài”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: Khi ... sai ... đi
  rationale: Cấu trúc giới từ với động từ nguyên mẫu diễn tả hoàn cảnh thời gian; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ ý Yahweh sai dân từ một địa điểm lên đường.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp trực tiếp với bản Hê-bơ-rơ.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: từ Ca-đe Ba-nê-a
  rationale: Phiên âm địa danh theo âm tiết dễ đọc đối với độc giả Việt.
- source_word: עֲלוּ
  choice: Hãy đi lên
  rationale: Giữ ý chuyển động đi lên của עלה, phù hợp với việc tiến vào vùng đất.
- source_word: וּרְשׁוּ
  choice: chiếm lấy
  rationale: Trong bối cảnh tiến vào đất, ירשׁ chỉ việc chiếm và nắm quyền sở hữu; “chiếm lấy” rõ ràng, tự nhiên hơn cách dịch cứng là “sở hữu”.
- source_word: הָאָרֶץ
  choice: vùng đất
  rationale: Chỉ vùng đất đã được hứa ban; “vùng đất” tự nhiên trong tiếng Việt mà không diễn giải quá mức.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: mà Ta đã ban cho anh em
  rationale: Thể hoàn thành trình bày sự ban cho như điều đã được xác lập; “đã ban” giữ nguyên lực ngữ pháp ấy.
- source_word: וַתַּמְרוּ
  choice: anh em đã chống lại
  rationale: מרה diễn tả sự phản nghịch hoặc chống lại thẩm quyền; cách dịch này kết hợp tự nhiên với “mệnh lệnh” trong tiếng Việt.
- source_word: אֶת־פִּי יְהוָה אֱלֹהֵיכֶם
  choice: mệnh lệnh của Yahweh, Đức Chúa Trời của anh em
  rationale: Nguyên văn là “miệng của Yahweh”, một thành ngữ chỉ lời truyền hay mệnh lệnh có thẩm quyền. Bản dịch chính truyền đạt nghĩa thành ngữ, còn nghĩa đen được ghi ở chú thích.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: Anh em không tin Ngài
  rationale: Hiphil của אמן với לוֹ có thể mang nghĩa tin hoặc tin cậy Ngài. “Tin Ngài” giữ được độ rộng nghĩa, không buộc phải chọn riêng sắc thái nhận lời là thật hay phó thác.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: và không nghe theo tiếng Ngài
  rationale: שׁמע בקול vừa giữ hình ảnh nghe tiếng vừa hàm ý vâng lời. “Nghe theo tiếng Ngài” diễn đạt tự nhiên cả hai sắc thái.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước. Giữ “Yahweh” giúp phân biệt danh riêng với tước hiệu mà không áp đặt truyền thống hệ phái.
- issue: Lực của נָתַתִּי trong lời ban đất
  choice: đã ban cho anh em
  alternative: ban cho anh em; đang ban cho anh em
  rationale: Thể hoàn thành trình bày việc ban đất như điều đã chắc chắn và được xác lập, nhưng bản dịch không mở rộng thành một hệ thống thần học.
- issue: Quan hệ giữa tin và vâng lời
  choice: không tin Ngài và không nghe theo tiếng Ngài
  alternative: không tin cậy Ngài và không vâng lời Ngài
  rationale: Giữ hai mệnh đề riêng của nguyên văn và bảo tồn sự căng thẳng giữa niềm tin với sự nghe/vâng lời, thay vì đồng nhất hoàn toàn hai ý.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh em” cho ngôi thứ hai số nhiều khi Môi-se nói với cộng đồng Israel và dùng “Ta” trong lời phán trực tiếp của Đức Chúa Trời. Câu được chia thành hai câu tiếng Việt để dễ đọc mà vẫn giữ quan hệ thời gian và kết quả của bản Hê-bơ-rơ.
