base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: vi
  text: Nhưng họ là dân của Ngài, là cơ nghiệp của Ngài[a], mà Ngài đã đem họ ra bằng quyền năng lớn lao và bằng cánh tay giơ ra của Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và họ là dân của Ngài, là cơ nghiệp của Ngài.” Liên từ tiếng Hê-bơ-rơ có thể chỉ đơn giản mang nghĩa “và”; “nhưng” phản ánh sự tương phản có thể được hàm ý trong lời cầu xin của Môi-se.'
    reason: lexical_alternative
  - marker: b
    text: “Cánh tay giơ ra” là cách nói quen thuộc trong các bản văn về cuộc Xuất Ai Cập, chỉ quyền năng giải cứu của Đức Chúa Trời.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: Nhưng họ là
  rationale: Liên từ וְ có thể đơn giản là “và”, nhưng trong lời cầu xin của Môi-se ở văn cảnh này, nó nhiều khả năng biểu thị sự tương phản. “Nhưng” diễn đạt sắc thái ấy tự nhiên mà không vượt quá nghĩa tiếng Hê-bơ-rơ.
- source_word: עַמְּךָ
  choice: dân của Ngài
  rationale: עַם chỉ một dân tộc hoặc cộng đồng dân, ở đây là dân thuộc về Đức Chúa Trời. Cách diễn đạt này tự nhiên và giữ rõ quan hệ sở thuộc.
- source_word: וְנַחֲלָתֶךָ
  choice: là cơ nghiệp của Ngài
  rationale: נַחֲלָה có nghĩa là phần thừa hưởng hoặc phần sở hữu được ban. “Cơ nghiệp” giữ được sắc thái giao ước và cách nói trang trọng quen thuộc của Kinh Thánh, mạnh hơn từ “tài sản” thuần túy.
- source_word: אֲשֶׁר
  choice: những người
  rationale: Đại từ quan hệ quy chiếu về “dân”, tức con người; cách dịch này làm câu tiếng Việt rõ và tự nhiên.
- source_word: הוֹצֵאתָ
  choice: Ngài đã đưa ra
  rationale: Thể Hiphil của יצא diễn tả hành động khiến ai đó đi ra và là cách nói tiêu biểu về cuộc Xuất Ai Cập. “Đưa ra” bám sát động từ nguồn mà vẫn tự nhiên.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: bằng quyền năng lớn lao
  rationale: בְּ mang nghĩa phương tiện; כֹּחַ là sức mạnh hoặc quyền năng, còn גָּדוֹל là lớn. Cụm từ này vừa sát nguồn vừa có phẩm cách trong tiếng Việt hiện đại.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: và bằng cánh tay dang rộng của Ngài
  rationale: Giữ nguyên hình ảnh nhân hình học זְרוֹעַ “cánh tay” và phân từ נְטוּיָה “dang ra/dang rộng”, một công thức gắn với quyền năng giải cứu trong biến cố Xuất Ai Cập.
theological_decisions:
- issue: Ngôn ngữ nhân hình học về hành động của Đức Chúa Trời
  choice: Giữ nguyên hình ảnh “cánh tay dang rộng của Ngài”.
  alternative: Diễn ý thành “những việc quyền năng của Ngài”.
  rationale: Tiếng Hê-bơ-rơ chủ ý dùng hình ảnh thân thể để diễn tả quyền năng giải cứu. Giữ ẩn dụ bảo toàn sức nặng văn chương và thần học mà không khẳng định thêm điều gì về bản thể Đức Chúa Trời.
- issue: Ngôn ngữ thuộc về giao ước trong נַחֲלָה
  choice: Dịch là “cơ nghiệp”.
  alternative: “Sản nghiệp”, “phần sở hữu” hoặc “tài sản”.
  rationale: Trong lời cầu xin này, Môi-se viện đến mối quan hệ của dân Y-sơ-ra-ên với Đức Chúa Trời. “Cơ nghiệp” giữ được ý về phần thuộc riêng và âm hưởng giao ước, nhưng không thêm một cách giải thích giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu về Đức Chúa Trời; giữ “cơ nghiệp” và hình ảnh “cánh tay dang rộng” vì giá trị giao ước và liên văn bản. Các dấu chú thích đều xuất hiện trong chính văn.
