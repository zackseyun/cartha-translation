  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: vi
  text: “Hãy để Ta yên[a], để Ta tiêu diệt chúng và xóa tên chúng khỏi dưới bầu trời[b]; và Ta sẽ làm cho con thành một dân tộc hùng mạnh và đông đảo hơn dân ấy.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy để Ta yên, Ta sẽ tiêu diệt chúng và xóa tên chúng khỏi dưới bầu trời.”'
    reason: Nguyên văn có thể được hiểu là nêu mục đích/kết quả (“để Ta”) hoặc nối tiếp bằng lời tuyên bố (“Ta sẽ”).
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “khỏi dưới các tầng trời”; cách nói này chỉ việc bị loại khỏi mặt đất, không còn tồn tại hay được người đời nhớ đến.'
    reason: Ghi nhận hình thức số nhiều trong nguyên văn và giải thích thành ngữ không tự nhiên nếu dịch sát từng chữ sang tiếng Việt.
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: Hãy để Ta yên
  rationale: Mệnh lệnh của רפה đi với מן và đại từ mang nghĩa thành ngữ là thôi can thiệp hoặc để một người yên. Cách dịch này tự nhiên trong tiếng Việt và không thêm ý rằng Môi-se phải rời đi.
- source_word: וְאַשְׁמִידֵם
  choice: để Ta tiêu diệt chúng
  rationale: שׁמד diễn tả sự hủy diệt hoàn toàn. Trong mạch câu sau mệnh lệnh, וְ với động từ chưa hoàn thành có thể biểu thị mục đích hoặc kết quả; “để Ta” truyền đạt tự nhiên mối liên hệ ấy mà vẫn giữ sức nặng của lời phán.
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: và xóa tên chúng
  rationale: מחה là xóa sạch; trong thành ngữ này, “xóa tên” chỉ việc loại bỏ cả sự tồn tại lẫn sự tưởng nhớ về một dân.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: khỏi dưới trời
  rationale: Cách nói tiếng Việt “dưới trời” tự nhiên và trang trọng, diễn tả việc bị loại khỏi cõi đất. Số nhiều của danh từ Hê-bơ-rơ được ghi nhận trong chú thích.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: rồi Ta sẽ làm cho con thành một dân tộc
  rationale: Cấu trúc עשה + tân ngữ + ל diễn tả việc làm cho một người trở thành điều gì; “làm cho con thành” thể hiện rõ sự biến đổi được hứa.
- source_word: עָצוּם
  choice: hùng mạnh
  rationale: Từ này nói đến sức mạnh hoặc quyền thế. Ý so sánh được biểu đạt chung với cụm “hơn chúng” ở cuối câu.
- source_word: וָרָב
  choice: đông đảo
  rationale: Trong ngữ cảnh một dân tộc, רב nói đến số lượng lớn; “đông đảo” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מִמֶּנּוּ
  choice: hơn chúng
  rationale: Hậu tố Hê-bơ-rơ ở số ít chỉ tập thể Ít-ra-ên; tiếng Việt tự nhiên dùng “chúng” để quy chiếu về những người vừa được nhắc đến.
theological_decisions:
- issue: Lời tuyên bố phán xét của Đức Chúa Trời và lời hứa làm cho Môi-se thành một dân tộc lớn hơn
  choice: Dịch thẳng như một lời tuyên bố thực sự trong diễn tiến câu chuyện, không giảm nhẹ sự hủy diệt được nói đến.
  alternative: Diễn giải ngay trong bản văn rằng đây chủ yếu là lời thử Môi-se hoặc chỉ là lời nói có tính tu từ.
  rationale: Nguyên văn trình bày lời phán trực tiếp về sự phán xét và lời hứa. Bản dịch cần giữ nguyên sức căng thần học của trình thuật, thay vì giải quyết tranh luận diễn giải trong câu dịch.
- issue: Quan hệ giữa mệnh lệnh הֶרֶף và các động từ tiếp theo
  choice: Dùng “để Ta” để thể hiện sắc thái mục đích hoặc kết quả.
  alternative: 'Dùng chuỗi mệnh đề đơn thuần: “Hãy để Ta yên, Ta sẽ tiêu diệt…”'
  rationale: Cú pháp Hê-bơ-rơ cho phép hiểu các động từ tiếp theo như kết quả hoặc mục đích của mệnh lệnh, nhưng cũng có thể đọc như trình tự hành động. Chú thích bảo lưu cách đọc phối hợp đơn thuần.
translation_notes:
  register: Dùng đại từ “Ta—con” cho lời Đức Chúa Trời phán với Môi-se, tạo sắc thái trang trọng nhưng vẫn rõ ràng đối với độc giả hiện đại. Câu văn giữ nhịp mạnh, trực tiếp của lời phán và tránh các thuật ngữ giáo phái.
