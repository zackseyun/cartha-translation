base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: vi
  text: 'một dân đông đảo và cao lớn, là con cháu A-nác[a], mà anh em biết và đã nghe nói: “Ai có thể đứng vững trước con cháu A-nác?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người A-na-kim.” Nguyên văn Hê-bơ-rơ: “các con trai của A-nác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: dân
  rationale: Trong ngữ cảnh này, עַם chỉ một cộng đồng sắc tộc; “dân” tự nhiên, trang trọng và phù hợp hơn “quốc gia”.
- source_word: גָּדוֹל וָרָם
  choice: lớn và cao lớn
  rationale: גָּדוֹל diễn tả quy mô hoặc sự lớn lao, còn רָם trong ngữ cảnh mô tả thể chất chỉ vóc dáng cao. Cách dịch này giữ cả hai nét nghĩa mà không đồng nhất chúng.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: con cháu của A-nác / con cháu A-nác
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của A-nác”, nhưng trong đây chỉ dòng dõi hoặc nhóm người mang tên tổ tiên; “con cháu” là cách nói tự nhiên trong tiếng Việt và vẫn giữ quan hệ huyết thống.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: là dân mà anh em biết
  rationale: Động từ hoàn thành diễn tả điều người nghe đã biết. “Anh em” phù hợp với đại từ số ít mang nghĩa tập thể khi Môi-se nói với toàn dân.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: và đã nghe nói rằng
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt và nối trực tiếp động từ “nghe” với lời được trích dẫn ngay sau đó.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: Ai có thể đứng vững trước mặt
  rationale: יִתְיַצֵּב לִפְנֵי theo ngữ cảnh đối đầu mang nghĩa đứng vững hoặc chống nổi trước một đối thủ. “Đứng vững trước mặt” giữ hình ảnh của nguyên văn và sức mạnh của câu hỏi tu từ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít mang nghĩa tập thể hướng đến toàn dân Y-sơ-ra-ên; giữ cấu trúc mô tả và câu hỏi tu từ của nguyên văn.
