  - severity: low
    issue: Chú thích dùng “tức người A-na-kim” quá khẳng định.
    rationale: Đây là lựa chọn diễn giải/đối ứng dân tộc danh; nên trình bày là phương án thay thế và vẫn nêu cách dịch sát chữ để bảo toàn sắc thái bản văn.
