base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: vi
  text: Vì vậy, tôi nắm lấy hai tấm bảng, ném chúng ra khỏi cả hai tay mình và làm vỡ chúng trước mắt anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đập vỡ chúng.” Động từ Hê-bơ-rơ có thể dịch đơn giản là “làm vỡ/bẻ gãy”; trong ngữ cảnh các tấm bảng bị ném đi, cũng có thể hiểu là chúng bị vỡ tan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: tôi nắm lấy
  rationale: Động từ תפשׂ diễn tả hành động nắm hoặc giữ lấy. “Nắm lấy” tự nhiên trong tiếng Việt và không thêm sắc thái bạo lực như “chộp lấy”.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: hai tấm bảng
  rationale: Danh từ לֻחוֹת chỉ các tấm bảng giao ước đã được xác định trong ngữ cảnh. Câu này không nói rõ chất liệu đá, nên không thêm “đá” vào bản văn.
- source_word: וָאַשְׁלִכֵם
  choice: ném chúng
  rationale: Động từ שלך có nghĩa là ném hoặc quăng. “Ném” là cách diễn đạt hiện đại, trực tiếp và không cường điệu.
- source_word: מֵעַל שְׁתֵּי יָדַי
  choice: khỏi hai tay mình
  rationale: Cụm từ theo sát nghĩa là “từ trên hai tay tôi”. “Khỏi hai tay mình” giữ được sự nhấn mạnh rõ ràng vào cả hai tay và tự nhiên hơn trong tiếng Việt.
- source_word: וָאֲשַׁבְּרֵם
  choice: đập vỡ chúng
  rationale: Động từ שׁבר có nghĩa là làm vỡ hoặc bẻ gãy. Trong ngữ cảnh các tấm bảng bị ném xuống, “đập vỡ” diễn đạt rõ hành động và kết quả mà không nhất thiết khẳng định chúng vỡ vụn hoàn toàn.
- source_word: לְעֵינֵיכֶם
  choice: trước mắt anh em
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa là ngay trước sự chứng kiến của người nghe. “Trước mắt anh em” vừa gần hình ảnh nguyên ngữ vừa tự nhiên, trang trọng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng Y-sơ-ra-ên mà Môi-se đang trực tiếp nói với; tránh thêm “bằng đá” vì chi tiết ấy không xuất hiện trong chính câu này.
