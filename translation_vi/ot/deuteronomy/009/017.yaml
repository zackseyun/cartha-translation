  rationale: Bản sửa tránh thêm cách thức “đập” vào động từ “làm vỡ”, cải thiện độ tự nhiên của cụm chỉ hành động ném khỏi tay, và giữ sự nhấn mạnh “cả hai tay” của nguyên ngữ. Chú thích giữ lựa chọn mạnh hơn như một khả năng theo ngữ cảnh mà không áp đặt nó vào bản văn chính.
