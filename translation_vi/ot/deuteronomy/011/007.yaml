  text: כִּ֤י עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֶת כָּל מַעֲשֵׂ֥ה יְהוָ֖ה הַ/גָּדֹ֑ל אֲשֶׁ֖ר עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: vi
  text: Vì chính mắt anh em đã thấy mọi công việc lớn lao mà Yahweh đã làm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ viết sát nghĩa là “mắt anh em, những mắt đang thấy”, một lối nói nhấn mạnh rằng họ là những người tận mắt chứng kiến.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng nêu lý do hoặc cơ sở giải thích cho lời khuyên ở câu trước.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: chính mắt anh em đã thấy
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ sự nhấn mạnh rằng chính những người nghe là nhân chứng tận mắt; thì hoàn thành trong tiếng Việt phù hợp với hành động họ đã chứng kiến.
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: mọi công việc
  rationale: Danh từ số ít có thể mang nghĩa tập hợp, chỉ toàn thể những điều Yahweh đã thực hiện; “mọi công việc” diễn đạt tự nhiên mà không thu hẹp thành một hành động riêng lẻ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: הַגָּדֹל
  choice: lớn lao
  rationale: Diễn đạt trực tiếp tầm vóc lớn của công việc, không thêm nét nghĩa về quyền năng vốn không được nói rõ trong tính từ này.
- source_word: אֲשֶׁר עָשָׂה
  choice: mà Yahweh đã làm
  rationale: Giữ mệnh đề quan hệ và ý nghĩa đơn giản của động từ hoàn thành; lặp lại tên Yahweh giúp câu tiếng Việt rõ chủ thể hơn đại từ “Ngài”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo tồn tính chất danh riêng và không thay bằng một tước hiệu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh em” thể hiện đối tượng số nhiều; “chính mắt” tái hiện nét nhấn mạnh của cấu trúc Hê-bơ-rơ theo cách tự nhiên trong tiếng Việt.
