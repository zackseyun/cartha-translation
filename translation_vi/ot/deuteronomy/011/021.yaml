revisions:
- from: để những ngày của anh em và những ngày của con trai anh em được thêm nhiều trên đất mà Yahweh đã thề với tổ phụ anh em rằng Ngài sẽ ban cho họ, lâu như trời còn ở trên đất.[a]
  to: để ngày tháng của anh em và ngày tháng của con trai anh em được gia tăng trên vùng đất mà Yahweh đã thề ban cho tổ phụ anh em, lâu như trời còn ở trên đất.[a]
  rationale: Bản sửa dùng cấu trúc “đã thề ban cho tổ phụ anh em” để phản ánh trực tiếp động từ “thề” kèm nguyên mẫu “ban cho họ”, không thêm thì tương lai. “Ngày tháng ... được gia tăng” tự nhiên hơn mà vẫn giữ hình ảnh số ngày gia tăng. “Vùng đất” làm rõ bối cảnh đất hứa. Cụm kết và chú thích tiếp tục bảo tồn cả cách hiểu thành ngữ về thời lượng lẫn hình ảnh sát chữ.
  reviewer_model: gpt-5.6-terra
