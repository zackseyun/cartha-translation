id: DEU.11.21
reference: Deuteronomy 11:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לְמַ֨עַן יִרְבּ֤וּ יְמֵי/כֶם֙ וִ/ימֵ֣י בְנֵי/כֶ֔ם עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵי/כֶ֖ם לָ/תֵ֣ת לָ/הֶ֑ם כִּ/ימֵ֥י הַ/שָּׁמַ֖יִם עַל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: vi
  text: để ngày tháng của anh em và ngày tháng của con trai anh em được gia tăng trên vùng đất mà Yahweh đã thề ban cho tổ phụ anh em, lâu như trời còn ở trên đất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “như những ngày của trời trên đất.” “Con trai” cũng có thể được hiểu rộng là “con cái.”'
    reason: Bảo lưu cả hình thức của phép so sánh Hê-bơ-rơ và khả năng nghĩa rộng của בנים.
lexical_decisions:
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên mục đích hoặc kết quả của những mệnh lệnh đứng trước.
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: những ngày của anh em ... được thêm nhiều
  rationale: Giữ hình ảnh Hê-bơ-rơ về số ngày gia tăng, thay vì diễn giải thẳng thành 'sống lâu'.
- source_word: וִימֵי בְנֵיכֶם
  choice: và những ngày của con trai anh em
  rationale: Phản ánh trực tiếp danh từ giống đực số nhiều בנים; ghi chú nêu khả năng hiểu rộng hơn là con cái.
- source_word: עַל הָאֲדָמָה
  choice: trên đất
  rationale: Giữ giới từ và sắc thái chỉ miền đất được hứa trong văn mạch Phục Truyền Luật Lệ Ký.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được nêu trực tiếp trong bản Hê-bơ-rơ.
- source_word: לַאֲבֹתֵיכֶם
  choice: với tổ phụ anh em
  rationale: '''Tổ phụ'' giữ sắc thái gia tộc và giao ước, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.'
- source_word: לָתֵת לָהֶם
  choice: rằng Ngài sẽ ban cho họ
  rationale: Làm rõ quan hệ cú pháp tự nhiên trong tiếng Việt mà không thêm tân ngữ 'đất ấy' vốn chỉ được hàm ý trong tiếng Hê-bơ-rơ.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: lâu như trời còn ở trên đất
  rationale: Diễn đạt thành ngữ chỉ thời gian bền lâu bằng tiếng Việt tự nhiên, đồng thời giữ hình ảnh trời và đất; ghi chú bảo lưu cách dịch sát hình thức hơn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn dùng danh riêng giao ước; phiên âm 'Yahweh' bảo tồn việc gọi đích danh mà không thay bằng tước hiệu.
- issue: Phạm vi nghĩa của בְנֵיכֶם
  choice: con trai anh em
  alternative: con cái anh em
  rationale: Bản chính giữ hình thức giống đực rõ ràng của tiếng Hê-bơ-rơ; ghi chú bảo tồn khả năng danh từ số nhiều được dùng theo nghĩa bao quát.
- issue: Ý nghĩa của cụm so sánh kết câu
  choice: lâu như trời còn ở trên đất
  alternative: như những ngày của trời trên đất
  rationale: Cụm Hê-bơ-rơ có thể được hiểu như thành ngữ về sự trường tồn hoặc theo hình ảnh sát chữ; chọn cách tự nhiên về thời lượng nhưng ghi nhận cách dịch sát chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' để chỉ cộng đồng được ngỏ lời ở ngôi thứ hai số nhiều; tránh lối cổ quá mức. Dấu chú thích [a] xuất hiện trong chính văn.
