base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: vi
  text: thì Ta sẽ ban mưa cho đất của anh em đúng mùa—mưa đầu mùa và mưa cuối mùa[a]—và anh em sẽ thu hoạch ngũ cốc, rượu mới[b] và dầu[c] của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mưa trước và mưa sau.” Mưa đầu mùa thường vào mùa thu, còn mưa cuối mùa thường vào mùa xuân.'
    reason: lexical_alternative
  - marker: b
    text: Tức là rượu mới làm từ vụ nho vừa thu hoạch; cũng có thể dịch đơn giản là “rượu.”
    reason: lexical_alternative
  - marker: c
    text: Tức là dầu ô-liu.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: thì Ta sẽ ban
  rationale: Dạng hoàn thành Qal ngôi thứ nhất số ít, đi với liên từ trong mạch điều kiện, mang ý nghĩa kết quả ở tương lai. “Thì” nối tự nhiên với điều kiện ở câu trước; “Ta” giữ nguyên lời hứa ở ngôi thứ nhất của Đức Chúa Trời.
- source_word: מְטַר אַרְצְכֶם
  choice: mưa xuống đất của anh em
  rationale: מְטַר là mưa, còn אֶרֶץ trong văn cảnh này là đất đai canh tác thuộc về dân Israel. Thêm “xuống” làm câu tiếng Việt tự nhiên mà không thay đổi nội dung.
- source_word: בְּעִתּוֹ
  choice: đúng mùa
  rationale: Cụm từ chỉ thời điểm thích hợp của mưa trong chu kỳ nông nghiệp. “Đúng mùa” ngắn gọn, tự nhiên và diễn đạt rõ ý hơn cách dịch máy móc “trong thời của nó”.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: mưa đầu mùa và mưa cuối mùa
  rationale: 'Hai từ chỉ các đợt mưa theo mùa: đợt mưa đầu tiên, thường vào mùa thu, và đợt mưa muộn hơn, thường vào mùa xuân. Cặp từ này giữ được sự đối xứng thời gian trong tiếng Hê-bơ-rơ.'
- source_word: וְאָסַפְתָּ
  choice: để anh em thu vào
  rationale: Động từ có nghĩa là gom hoặc thu sản vật. Trong mạch câu, mưa đúng mùa dẫn đến việc thu nông sản; “thu vào” giữ nghĩa nông nghiệp mà không diễn giải quá mức thành một thuật ngữ kỹ thuật.
- source_word: דְגָנֶךָ
  choice: ngũ cốc
  rationale: Từ này chỉ chung các loại lương thực dạng hạt. “Ngũ cốc” là cách gọi hiện đại, rộng nghĩa và dễ hiểu.
- source_word: וְתִירֹשְׁךָ
  choice: rượu mới
  rationale: תִּירוֹשׁ thường chỉ rượu mới làm hoặc sản phẩm nho mới, dù trong một số văn cảnh có thể hiểu đơn giản là rượu. “Rượu mới” giữ nét nghĩa nông sản mới thu được.
- source_word: וְיִצְהָרֶךָ
  choice: dầu
  rationale: Trong bộ ba quen thuộc gồm ngũ cốc, rượu mới và dầu, từ này chỉ dầu ô-liu. Giữ “dầu” trong chính văn để bảo toàn nhịp liệt kê, đồng thời giải thích rõ trong chú thích.
theological_decisions:
- issue: Ngôn ngữ phước lành nông nghiệp trong bối cảnh giao ước
  choice: Dịch như một lời hứa cụ thể về mưa theo mùa và nông sản dành cho Israel trong đất của họ.
  alternative: Hiểu mưa chủ yếu theo nghĩa biểu tượng, thuộc linh, cánh chung hoặc như một bảo đảm thịnh vượng phổ quát.
  rationale: Bản Hê-bơ-rơ trực tiếp nói về phước lành nông nghiệp trong bối cảnh giao ước. Bản dịch không nên đưa những cách áp dụng thần học về sau vào chính văn.
- issue: Sự chuyển đổi từ hậu tố số nhiều sang số ít
  choice: Dùng “anh em” xuyên suốt để chỉ cộng đồng Israel.
  alternative: Đổi sang “ngươi” ở phần nông sản để phản ánh hình thái số ít của các hậu tố.
  rationale: Tiếng Hê-bơ-rơ chuyển từ “đất của các ngươi” số nhiều sang “ngũ cốc/rượu/dầu của ngươi” số ít, nhìn Israel vừa như cộng đồng vừa như một tập thể. Trong tiếng Việt, “anh em” có thể tự nhiên chỉ toàn thể cộng đồng và tránh tạo cảm giác người nghe đột ngột thay đổi, trong khi không làm mất nội dung tập thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời phán ở ngôi thứ nhất của Đức Chúa Trời và “anh em” cho Israel với tư cách cộng đồng. Dấu gạch ngang làm rõ rằng “mưa đầu mùa và mưa cuối mùa” giải thích loại mưa được ban đúng mùa.
