source:
  edition: WLC
  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: vi
  text: Vậy, anh em hãy đặt những lời này của ta trên lòng và trên tâm hồn mình; hãy buộc chúng làm dấu trên tay mình, và chúng sẽ là vật đeo giữa hai mắt anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các dải đeo trước trán” hoặc “các hộp đựng kinh văn.” Từ Hê-bơ-rơ ở đây rất hiếm và nghĩa chính xác không chắc chắn; về sau, trong tập tục Do Thái, người ta đeo các hộp nhỏ đựng những đoạn Kinh Thánh.'
    reason: Nêu các khả năng từ vựng và bối cảnh tập tục về sau mà không đồng nhất thuật ngữ hiếm với một cách hiểu chuyên biệt trong chính văn.
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: Vậy, anh em phải ghi
  rationale: Động từ שׂים có nghĩa cơ bản là đặt, để. Trong tiếng Việt, “ghi ... vào lòng” giữ được hình ảnh tiếp nhận sâu xa mà vẫn tự nhiên; “Vậy” thể hiện sự tiếp nối với mạch văn trước.
- source_word: דְּבָרַי אֵלֶּה
  choice: những lời này của ta
  rationale: Giữ rõ hậu tố sở hữu ngôi thứ nhất số ít và sắc thái nhấn mạnh rằng đây là lời của chính người đang phán.
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: vào lòng và tâm hồn mình
  rationale: לֵבָב chỉ lòng, trung tâm của tư tưởng và ý chí; נֶפֶשׁ có phạm vi nghĩa rộng như sinh mạng, bản thân, tâm hồn. “Lòng và tâm hồn” vừa tự nhiên trong tiếng Việt vừa không phân chia hai thành phần này theo một hệ nhân học quá chặt.
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: phải buộc chúng
  rationale: קשר là buộc hoặc cột; “buộc” giữ nguyên hình ảnh cụ thể và để ngỏ nghĩa đen lẫn nghĩa biểu tượng.
- source_word: לְאוֹת
  choice: làm dấu
  rationale: אוֹת là dấu, dấu hiệu hay biểu hiệu. “Làm dấu” diễn đạt tự nhiên chức năng của vật được buộc.
- source_word: עַל יֶדְכֶם
  choice: trên tay
  rationale: יָד theo nghĩa thông thường là tay; không đổi thành “cánh tay,” vốn là cách diễn giải rộng hơn.
- source_word: וְהָיוּ
  choice: và chúng phải là
  rationale: Trong chuỗi chỉ thị này, cách dịch với “phải” tiếp tục lực mệnh lệnh của văn cảnh.
- source_word: לְטוֹטָפֹת
  choice: vật đeo trước trán
  rationale: טוֹטָפֹת là từ hiếm, thường được hiểu là vật hoặc dải đeo ở vùng trán. Cách dịch mô tả này dễ hiểu hơn một thuật ngữ cổ hiếm trong tiếng Việt nhưng không đồng nhất ngay với tập tục Do Thái về sau.
- source_word: בֵּין עֵינֵיכֶם
  choice: ở giữa hai mắt
  rationale: Giữ sát thành ngữ cụ thể của tiếng Hê-bơ-rơ thay vì chỉ dịch diễn giải là “trên trán.”
theological_decisions:
- issue: Mệnh lệnh buộc lời trên tay và đặt giữa hai mắt mang nghĩa đen hay nghĩa bóng
  choice: Giữ nguyên hình ảnh vật chất cụ thể mà không quyết định đó là mệnh lệnh hoàn toàn theo nghĩa đen, hoàn toàn mang tính biểu tượng, hay gồm cả hai.
  alternative: Diễn giải thành lời kêu gọi luôn ghi nhớ và thực hành; hoặc xác định trực tiếp đây là việc đeo hộp kinh.
  rationale: Bản Hê-bơ-rơ dùng ngôn ngữ cụ thể nhưng chính câu này không loại trừ nghĩa biểu tượng cũng không bắt buộc đồng nhất với hình thức nghi lễ phát triển về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với cộng đồng; dùng “ta” cho người đang phán. Hình ảnh cụ thể của nguyên văn được duy trì, còn thuật ngữ hiếm được diễn đạt mô tả và chú thích.
