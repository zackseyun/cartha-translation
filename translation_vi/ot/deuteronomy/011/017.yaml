  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: vi
  text: Bấy giờ, cơn giận của Yahweh sẽ bừng lên chống lại anh em,[a] và Ngài sẽ đóng bầu trời lại để không có mưa; đất đai sẽ không sinh hoa lợi, và anh em sẽ mau chóng bị diệt khỏi miền đất tốt đẹp mà Yahweh đang ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ, theo nghĩa sát chữ: “mũi/cơn giận của Yahweh sẽ bừng cháy chống lại anh em”; đây là một thành ngữ chỉ cơn giận dữ dội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: Bấy giờ, cơn giận của Yahweh sẽ bừng lên chống lại anh em
  rationale: Cụm חָרָה אַף là thành ngữ chỉ cơn giận bùng cháy. “Bừng lên” giữ hình ảnh của nguyên văn mà vẫn tự nhiên trong tiếng Việt; “chống lại anh em” diễn đạt בָכֶם trong bối cảnh phán xét.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn, thay vì thay bằng một tước hiệu.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: Ngài sẽ đóng các tầng trời lại
  rationale: Giữ hình ảnh trời bị đóng để mưa bị ngăn lại. “Các tầng trời” phản ánh dạng số nhiều tiếng Hê-bơ-rơ và phù hợp văn phong Kinh Thánh trang trọng.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: khiến không có mưa
  rationale: Diễn đạt tự nhiên quan hệ kết quả giữa việc trời bị đóng và tình trạng không mưa.
- source_word: וְהָאֲדָמָה
  choice: đất đai
  rationale: Chỉ đất canh tác, đồng thời phân biệt với הָאָרֶץ ở phần sau, vốn chỉ miền đất được ban.
- source_word: לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: sẽ không sinh hoa lợi
  rationale: Diễn đạt tự nhiên ý đất không cho sản vật hoặc năng suất của nó.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: anh em sẽ mau chóng bị diệt
  rationale: אבד có thể bao gồm bị hủy diệt hoặc bị loại khỏi miền đất. “Bị diệt” giữ mức độ nghiêm trọng mà không xác định thêm cơ chế.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: khỏi miền đất tốt đẹp
  rationale: “Khỏi” truyền đạt sự bị loại bỏ ra khỏi miền đất; “miền đất” phân biệt הָאָרֶץ với đất canh tác ở vế trước.
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: mà Yahweh đang ban cho anh em
  rationale: Dạng phân từ נֹתֵן được diễn đạt bằng “đang ban”, nhấn mạnh hành động ban đất đang diễn ra trong bối cảnh dân Israel sắp nhận lấy.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה. “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Thành ngữ nhân hình về cơn giận
  choice: cơn giận của Yahweh sẽ bừng lên chống lại anh em
  alternative: Yahweh sẽ nổi giận với anh em
  rationale: Giữ ẩn dụ cơn giận bùng cháy của tiếng Hê-bơ-rơ, nhưng không diễn giải thêm bản chất cảm xúc hay thuộc tính thần học.
- issue: Ý nghĩa của אבד trong lời nguyền giao ước
  choice: bị diệt khỏi miền đất
  alternative: bị tiêu diệt hoàn toàn; biến mất khỏi miền đất
  rationale: Cách dịch duy trì sức nặng của sự phán xét và mối liên hệ với việc mất đất, nhưng không quyết định rằng câu này nhất thiết nói đến tuyệt diệt hoàn toàn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng Israel; viết hoa “Ngài” theo quy ước tiếng Việt phổ biến, không dùng chữ hoa để thêm nội dung thần học.
