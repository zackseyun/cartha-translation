revisions:
- from: Bấy giờ, cơn giận của Yahweh sẽ bừng lên chống lại anh em,[a] và Ngài sẽ đóng các tầng trời lại, khiến không có mưa; đất đai sẽ không sinh hoa lợi, và anh em sẽ mau chóng bị diệt khỏi miền đất tốt đẹp mà Yahweh đang ban cho anh em.
  to: Bấy giờ, cơn giận của Yahweh sẽ bừng lên chống lại anh em,[a] và Ngài sẽ đóng bầu trời lại để không có mưa; đất đai sẽ không sinh hoa lợi, và anh em sẽ mau chóng bị diệt khỏi miền đất tốt đẹp mà Yahweh đang ban cho anh em.
  rationale: Chỉ điều chỉnh cách diễn đạt “các tầng trời” thành “bầu trời” và làm mượt liên hệ kết quả với việc không mưa. Các lựa chọn khác được giữ nguyên vì phản ánh nghĩa và mức độ mơ hồ của nguyên văn.
