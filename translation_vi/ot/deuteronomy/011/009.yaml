reference: Deuteronomy 11:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: vi
  text: để anh em được sống lâu trên đất mà Yahweh đã thề ban cho tổ phụ anh em và dòng dõi họ[a]—một vùng đất tuôn chảy sữa và mật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hạt giống họ”. Từ Hê-bơ-rơ có thể chỉ con cháu như một tập thể hoặc dòng hậu duệ nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả của mệnh đề Hê-bơ-rơ.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: anh em được sống lâu
  rationale: Chuyển ngữ thành ngữ nghĩa đen là “kéo dài ngày tháng” bằng cách nói tự nhiên trong tiếng Việt, đồng thời giữ sắc thái phước lành về tuổi thọ.
- source_word: עַל הָאֲדָמָה
  choice: trên đất
  rationale: Giữ giới từ עַל và hiểu אֲדָמָה trong văn cảnh Phục Truyền là miền đất được hứa ban, không chỉ là đất thổ nhưỡng.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: mà Đức Giê-hô-va đã thề
  rationale: Giữ rõ mệnh đề quan hệ, ngôn ngữ thề nguyện trang trọng và danh riêng giao ước.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh riêng của Đức Chúa Trời quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: לַאֲבֹתֵיכֶם
  choice: với tổ phụ anh em
  rationale: “Tổ phụ” tự nhiên trong văn phong Kinh Thánh tiếng Việt và bảo toàn nét nghĩa chỉ các bậc cha ông của dân giao ước.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: rằng Ngài sẽ ban cho họ và dòng dõi họ
  rationale: Bổ sung chủ ngữ “Ngài” để câu tiếng Việt rõ ràng; “dòng dõi” giữ được tính tập thể của זֶרַע và liên hệ giữa tổ phụ với hậu duệ.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: một vùng đất tuôn chảy sữa và mật
  rationale: Giữ hình ảnh truyền thống chỉ sự màu mỡ, dư dật; “vùng đất” làm rõ đây là phần đồng vị mô tả miền đất đã hứa.
theological_decisions:
- issue: Cách chuyển ngữ danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh Tứ Tự. Bản dịch giữ danh riêng thay vì thay bằng “CHÚA”; “Đức Giê-hô-va” là dạng tiếng Việt trang trọng và quen thuộc. Cách phát âm cổ “Yahweh/Gia-vê” vẫn là một phương án hợp lệ.
- issue: Đối tượng nhận đất trong lời thề
  choice: ban cho họ và dòng dõi họ
  alternative: ban cho tổ phụ anh em, tức là cho dòng dõi họ
  rationale: Giữ nguyên cả hai bổ ngữ song song לָהֶם וּלְזַרְעָם, không đồng nhất hóa hoặc loại bỏ sự căng thẳng giữa lời ban cho các tổ phụ và cho hậu duệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho ngôi thứ hai số nhiều nhằm giữ lời nói với cộng đồng. Dấu gạch ngang giúp nhận rõ cụm đồng vị mô tả miền đất mà không làm thay đổi quan hệ cú pháp.
