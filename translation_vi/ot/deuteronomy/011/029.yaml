reference: Deuteronomy 11:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: vi
  text: Khi Yahweh, Đức Chúa Trời của anh em, đưa anh em vào xứ mà anh em sắp vào để chiếm hữu, anh em phải đặt phước lành trên núi Ga-ri-xim và lời nguyền rủa trên núi Ê-banh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh em phải công bố phước lành tại núi Ga-ri-xim và lời nguyền rủa tại núi Ê-banh.” Tiếng Hê-bơ-rơ theo nghĩa đen dùng động từ “trao/đặt”; văn cảnh chung giải thích nghi thức cụ thể.'
    reason: Nêu phương án từ vựng và bảo toàn sự chưa xác định của động từ נתן về hành động nghi lễ.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Khi
  rationale: Công thức này mở đầu một hoàn cảnh trong tương lai; “Khi” diễn đạt tự nhiên ý nghĩa thời gian mà không rập khuôn cấu trúc Hê-bơ-rơ.
- source_word: יְבִיאֲךָ
  choice: đưa anh em vào
  rationale: Dạng Hiphil của בוא mang nghĩa tác khiến, tức “đưa vào”. “Anh em” diễn đạt đại từ ngôi hai số ít mang nghĩa tập thể, chỉ dân Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt trực tiếp kết cấu sở hữu và mối quan hệ giao ước; cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: הָאָרֶץ
  choice: xứ
  rationale: Trong ngữ cảnh Phục Truyền Luật Lệ Ký, từ này chỉ miền đất Israel sắp chiếm hữu; “xứ” tự nhiên và phân biệt với đất theo nghĩa vật chất.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: mà anh em sắp vào để chiếm hữu
  rationale: “Sắp vào” thể hiện hành động cận kề của phân từ בָא, còn “chiếm hữu” giữ sắc thái tiếp nhận và nắm quyền sở hữu của ירשׁ trong ngữ cảnh về xứ.
- source_word: וְנָתַתָּה
  choice: anh em phải đặt
  rationale: נתן có nghĩa cơ bản là “trao, đặt”. “Đặt” giữ hình ảnh cụ thể và không xác định quá mức nghi thức được thực hiện ra sao.
- source_word: הַבְּרָכָה
  choice: phước lành
  rationale: Danh từ xác định chỉ phước lành của giao ước đã được nêu trong văn cảnh.
- source_word: עַל הַר גְּרִזִים
  choice: trên núi Ga-ri-xim
  rationale: Giữ quan hệ vị trí do עַל biểu thị và dùng dạng địa danh quen thuộc trong tiếng Việt.
- source_word: הַקְּלָלָה
  choice: lời nguyền rủa
  rationale: Diễn đạt tự nhiên danh từ đối lập với “phước lành” trong cặp phạm trù giao ước.
- source_word: עַל הַר עֵיבָל
  choice: trên núi Ê-banh
  rationale: Giữ cấu trúc song song với núi Ga-ri-xim và dùng dạng địa danh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước; giữ “Yahweh” bảo toàn tính chất tên riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của hành động נתן đối với phước lành và lời nguyền rủa
  choice: đặt phước lành trên núi Ga-ri-xim và lời nguyền rủa trên núi Ê-banh
  alternative: công bố phước lành tại núi Ga-ri-xim và lời nguyền rủa tại núi Ê-banh
  rationale: Động từ Hê-bơ-rơ có nghĩa rộng là “trao/đặt”. Bản dịch chính giữ cách nói cụ thể nhưng còn mơ hồ của nguyên văn; chú thích nêu khả năng hiểu theo hành động công bố trong nghi thức mà không biến cách hiểu đó thành lựa chọn duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng cho đại từ số ít mang nghĩa tập thể, hướng đến toàn dân Israel. Câu giữ cấu trúc song song giữa phước lành và lời nguyền rủa; các địa danh dùng dạng phiên âm quen thuộc trong tiếng Việt.
