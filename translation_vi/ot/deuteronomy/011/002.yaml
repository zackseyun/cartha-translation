source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: vi
  text: Hôm nay, anh em hãy biết rằng tôi không nói với con cái anh em—những người chưa từng biết, chưa từng thấy sự sửa dạy của Yahweh, Đức Chúa Trời của anh em[a], sự vĩ đại của Ngài, bàn tay mạnh mẽ[b] và cánh tay giơ thẳng ra của Ngài—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ tỉnh lược, sát chữ là: “vì không phải con cái anh em, là những người chưa biết và chưa thấy...” Ý câu là Môi-se đang nói với những người đã tận mắt chứng kiến các việc của Yahweh, chứ không phải với thế hệ con cái họ.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “bàn tay quyền năng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם הַיּוֹם
  choice: Hôm nay, anh em hãy biết
  rationale: Dạng hoàn thành Qal ngôi hai số nhiều, nối bằng ו, có chức năng kêu gọi người nghe chú ý trong văn cảnh; cách dịch này giữ sắc thái trực tiếp và tính cấp thời.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: rằng tôi không nói với con cái anh em
  rationale: Câu Hê-bơ-rơ tỉnh lược, sát chữ là “vì không phải con cái anh em”. Bổ sung “tôi không nói với” làm rõ sự đối lập trong lời Môi-se đang trực tiếp nói với thế hệ đã chứng kiến các việc của Đức Chúa Trời.
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: những người chưa từng biết, chưa từng thấy
  rationale: “Biết” ở đây mang nghĩa nhận biết qua trải nghiệm; “chưa từng” diễn đạt tự nhiên việc họ không có trải nghiệm ấy và giữ hai vế song song.
- source_word: מוּסַר
  choice: sự sửa dạy
  rationale: Từ này bao hàm việc giáo huấn bằng uốn nắn và kỷ luật. “Sửa dạy” giữ được cả khía cạnh giáo dục lẫn hiệu chỉnh, không thu hẹp thành hình phạt.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: גָּדְלוֹ
  choice: sự vĩ đại của Ngài
  rationale: Diễn đạt trực tiếp sự lớn lao của Đức Chúa Trời được bày tỏ qua các công việc quyền năng.
- source_word: יָדוֹ הַחֲזָקָה
  choice: bàn tay mạnh mẽ
  rationale: Dịch minh bạch חֲזָקָה và giữ hình ảnh Hê-bơ-rơ chỉ quyền năng của Đức Chúa Trời trong giải cứu và xét đoán.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: cánh tay giơ ra của Ngài
  rationale: Giữ hình ảnh cụ thể của động tính từ נְטוּיָה và thành ngữ về quyền năng đang hành động của Đức Chúa Trời.
theological_decisions:
- issue: Cấu trúc tỉnh lược đối lập với “con cái anh em”
  choice: Bổ sung “tôi không nói với” trong câu chính
  alternative: “vì không phải con cái anh em, là những người chưa biết và chưa thấy...”
  rationale: 'Nguyên văn không nêu động từ chi phối sau כִּי לֹא אֶת־בְּנֵיכֶם. Cách dịch đã chọn làm sáng nghĩa diễn ngôn: Môi-se đang phân biệt người nghe hiện tại với con cái họ, nhưng không biến lời giải thích này thành một khẳng định giáo lý mới.'
- issue: Sắc thái của מוּסַר
  choice: sự sửa dạy
  alternative: sự kỷ luật; sự giáo huấn
  rationale: “Sửa dạy” duy trì sức căng giữa giáo huấn và hiệu chỉnh, không giới hạn hành động của Đức Chúa Trời vào trừng phạt mà cũng không làm mất sắc thái nghiêm khắc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi hai số nhiều trong lời Môi-se nói với toàn dân; dùng “Ngài” để tránh lặp lại danh xưng mà vẫn rõ sở thuộc. Dấu gạch ngang cuối câu cho thấy ý còn tiếp sang câu sau.
