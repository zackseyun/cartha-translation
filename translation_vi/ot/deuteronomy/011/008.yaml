source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְמַ֣עַן תֶּחֶזְק֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: vi
  text: Vậy, hãy tuân giữ mọi điều răn mà hôm nay tôi truyền cho anh em[a], để anh em trở nên mạnh mẽ[b], tiến vào và chiếm hữu vùng đất mà anh em đang vượt qua để chiếm hữu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “toàn bộ điều răn”; danh từ số ít “điều răn” được dùng theo nghĩa tập hợp, chỉ toàn thể các mệnh lệnh.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mạnh mẽ lên” hoặc “được thêm sức.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ được dịch là “chiếm hữu” ở cả hai chỗ cũng có thể mang nghĩa “thừa hưởng” hoặc “chiếm lấy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vậy, anh em phải tuân giữ
  rationale: Trong ngữ cảnh giao ước và luật pháp, שׁמר có nghĩa là tuân giữ, thực hành. “Vậy” diễn đạt tự nhiên sự tiếp nối mang tính kết luận từ phần trước.
- source_word: כָּל הַמִּצְוָה
  choice: mọi điều răn
  rationale: Danh từ số ít מִצְוָה được dùng theo nghĩa tập hợp với כָּל; “mọi điều răn” truyền đạt đầy đủ toàn bộ các mệnh lệnh bằng tiếng Việt tự nhiên.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Giữ lực hiện tại của phân từ מְצַוֶּה và cách Môi-se trực tiếp nói với Israel. “Anh em” là cách xưng hô tập thể tự nhiên, trang trọng vừa phải.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt rõ quan hệ mục đích hoặc kết quả mà không ấn định quá mức ranh giới giữa hai sắc thái.
- source_word: תֶּחֶזְקוּ
  choice: anh em được mạnh mẽ
  rationale: חזק ở Qal có thể chỉ trở nên mạnh hoặc được thêm sức; “được mạnh mẽ” giữ được phần nào độ mở ấy mà vẫn tự nhiên trong ngữ cảnh.
- source_word: וּבָאתֶם
  choice: tiến vào
  rationale: בוא trong bối cảnh vào đất thường mang nghĩa đi vào. “Tiến vào” tự nhiên và phù hợp với đoàn dân đang hướng tới vùng đất.
- source_word: וִירִשְׁתֶּם
  choice: chiếm hữu
  rationale: ירשׁ có thể mang nghĩa thừa hưởng, chiếm lấy hoặc sở hữu. Trong bối cảnh Israel vượt vào đất, “chiếm hữu” vừa diễn đạt hành động nhận lấy quyền sở hữu vừa tránh thu hẹp thành chỉ chiến trận.
- source_word: הָאָרֶץ
  choice: vùng đất
  rationale: הָאָרֶץ ở đây chỉ vùng đất Israel sắp vào; “vùng đất” giữ sắc thái địa lý và giao ước, tự nhiên hơn “xứ” trong tiếng Việt hiện đại phổ thông.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה לְרִשְׁתָּהּ
  choice: mà anh em đang vượt qua để chiếm hữu
  rationale: “Vượt qua” phản ánh עברים và bối cảnh vượt sông Giô-đanh. Hướng từ שָׁמָּה được hàm trong cấu trúc tiếng Việt; dịch riêng là “qua đó” sẽ dễ gượng. Cụm mục đích lặp lại căn từ ירשׁ bằng “để chiếm hữu”.
theological_decisions:
- issue: Sự chuyển đổi giữa đại từ số ít và số nhiều khi Israel được nói đến như một cộng đồng giao ước
  choice: Dùng nhất quán “anh em” trong tiếng Việt
  alternative: Đánh dấu chỗ số ít bằng “ngươi” và chỗ số nhiều bằng “các ngươi”
  rationale: Tiếng Hê-bơ-rơ dùng hậu tố số ít trong “tôi truyền cho ngươi” nhưng các động từ khác ở số nhiều, nhìn Israel vừa như một đơn vị vừa như toàn thể dân. Đổi qua lại “ngươi/các ngươi” trong một câu tiếng Việt sẽ gây chú ý không cần thiết và làm câu thiếu tự nhiên; “anh em” vẫn giữ được lời nói trực tiếp với cộng đồng mà không áp đặt một cách giải thích thần học riêng.
- issue: Sắc thái của ירשׁ đối với vùng đất
  choice: Dịch “chiếm hữu” ở cả hai lần
  alternative: “thừa hưởng” hoặc “chiếm lấy”
  rationale: “Chiếm hữu” duy trì liên kết từ vựng giữa hai lần xuất hiện và để ngỏ cả phương diện nhận đất lẫn thực sự nắm quyền sở hữu, thay vì chỉ nhấn mạnh tính thừa kế hoặc chinh phục.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Chọn “anh em” cho lời Môi-se nói với toàn dân; tránh lối cổ “các ngươi.” Giữ sự lặp lại của ירשׁ bằng “chiếm hữu” và đặt các ký hiệu chú thích ngay sau phần văn bản liên quan.
