  terminology: '"Điều răn", "tuân giữ", "vùng đất" và "chiếm hữu" đều nhất quán và thích hợp. "Anh em" duy trì được lối xưng hô cộng đồng mà không buộc phải tái tạo sự đan xen số ít/số nhiều của tiếng Hê-bơ-rơ.'
