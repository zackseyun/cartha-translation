revisions:
- from: thì Đức Giê-hô-va sẽ đuổi tất cả các dân tộc này khỏi trước mặt anh em, và anh em sẽ chiếm chỗ của những dân tộc lớn mạnh hơn mình.
  to: thì Yahweh sẽ đuổi tất cả các dân tộc này ra khỏi trước mặt anh em, và anh em sẽ tước quyền chiếm hữu của những dân tộc lớn và hùng mạnh hơn anh em.
  rationale: Sửa danh riêng theo quy ước POB; diễn đạt vế thứ hai sát hơn với ירשׁ khi đối tượng trực tiếp là các dân tộc; và bảo toàn hai tính từ so sánh của nguyên văn. Không cần chú thích vì câu sửa đã chuyển được nghĩa chính mà không thêm diễn giải lịch sử hoặc giáo phái.
