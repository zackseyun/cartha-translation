  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: vi
  text: thì Yahweh sẽ đuổi tất cả các dân tộc này ra khỏi trước mặt anh em, và anh em sẽ tước quyền chiếm hữu của những dân tộc lớn và hùng mạnh hơn anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: sẽ đuổi
  rationale: Thể Hifil của ירשׁ mang nghĩa khiến đối tượng mất quyền chiếm hữu; trong bối cảnh này, “đuổi” diễn đạt tự nhiên hành động loại các dân tộc khỏi đất.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “Giê-hô-va” là dạng danh xưng quen thuộc và trang trọng trong tiếng Việt.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: tất cả các dân tộc này
  rationale: גּוֹיִם chỉ các cộng đồng dân tộc trong bối cảnh địa-chính trị; “các dân tộc” rõ nghĩa hơn “các nước” ở đây.
- source_word: מִלִּפְנֵיכֶם
  choice: khỏi trước mặt anh em
  rationale: Giữ hình ảnh không gian của nguyên văn, đồng thời kết hợp tự nhiên với động từ “đuổi”.
- source_word: וִירִשְׁתֶּם
  choice: anh em sẽ chiếm chỗ của
  rationale: Qal ירשׁ với tân ngữ là các dân tộc nhấn mạnh việc Israel thay thế họ trong quyền chiếm hữu; “chiếm chỗ của” giữ được hướng nghĩa này mà không khiến câu tiếng Việt hàm ý chiếm hữu con người.
- source_word: גּוֹיִם
  choice: những dân tộc
  rationale: Giữ nhất quán với lần xuất hiện trước và phù hợp với nghĩa dân tộc-chính trị.
- source_word: גְּדֹלִים וַעֲצֻמִים מִכֶּם
  choice: lớn mạnh hơn mình
  rationale: Cụm so sánh diễn tả các dân tộc vượt Israel cả về tầm vóc lẫn sức mạnh; “lớn mạnh hơn mình” tự nhiên, gọn và bao quát cả hai tính từ.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Bản dịch giữ một dạng danh riêng thay vì thay bằng tước hiệu; dạng “Đức Giê-hô-va” dễ nhận biết, trang trọng và tự nhiên với đông đảo độc giả Việt.
- issue: Sắc thái của וִירִשְׁתֶּם khi tân ngữ là các dân tộc
  choice: chiếm chỗ của
  alternative: truất hữu; chiếm lấy; đánh đuổi
  rationale: ירשׁ có thể chỉ chiếm hữu hoặc khiến kẻ khác mất quyền sở hữu. Vì tân ngữ ở đây là “các dân tộc”, cách dịch được chọn bảo tồn sự căng nghĩa giữa việc họ bị thay thế và Israel chiếm đất, không diễn đạt như thể con người trở thành tài sản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “anh em” phù hợp lời Môi-se nói với cộng đồng Israel. “Thì” nối tự nhiên với điều kiện ở câu trước. Không thêm chú thích vì các điểm nghĩa chính có thể thể hiện ngay trong câu.
