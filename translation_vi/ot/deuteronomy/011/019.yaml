  text: וְ/לִמַּדְתֶּ֥ם אֹתָ֛/ם אֶת בְּנֵי/כֶ֖ם לְ/דַבֵּ֣ר בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: vi
  text: Hãy dạy những lời ấy cho con cái anh em, và hãy nói về những lời ấy khi anh em ngồi trong nhà mình, khi đi trên đường, khi nằm xuống và khi thức dậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: Hãy dạy
  rationale: Piel của למד có nghĩa thông thường là “dạy”. Dùng thể mệnh lệnh tự nhiên trong tiếng Việt để chuyển tải giá trị chỉ thị của dạng động từ trong mạch luật lệ; không thêm ý “chuyên cần”, vốn không có trong động từ này.
- source_word: אֹתָם
  choice: những lời ấy
  rationale: Đại từ đối cách số nhiều giống đực chỉ về các lời/mệnh lệnh trong văn cảnh trước. Tiếng Việt thường cần nêu nhẹ tiền ngữ để câu rõ và tự nhiên; “những lời ấy” không thu hẹp nội dung quá mức.
- source_word: אֶת־בְּנֵיכֶם
  choice: cho con cái anh em
  rationale: בנים có thể chỉ riêng “các con trai” hoặc nói rộng về con cái. Trong bối cảnh truyền dạy giao ước qua các thế hệ, “con cái” chuyển tải tự nhiên nghĩa đại diện, còn khả năng dịch hẹp được ghi ở chú thích.
- source_word: לְדַבֵּר בָּם
  choice: nói về chúng
  rationale: Cụm nguyên mẫu với ל diễn tả hoạt động đi kèm và nội dung của việc dạy. “Nói về chúng” là cách diễn đạt tự nhiên, giữ đại từ quy chiếu về những lời/mệnh lệnh.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: khi anh em ngồi trong nhà
  rationale: 'ב đi với nguyên mẫu cấu tạo diễn tả hoàn cảnh thời gian: “khi ngồi”; “trong nhà” phản ánh trực tiếp địa điểm.'
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: khi đi trên đường
  rationale: הלך có nghĩa thông thường là “đi/đi bộ”. “Đi trên đường” vừa sát nghĩa vừa tự nhiên, không buộc phải hiểu là chỉ đi bộ.
- source_word: וּבְשָׁכְבְּךָ
  choice: khi nằm xuống
  rationale: Nguyên mẫu của שכב với ב chỉ thời điểm hay hoàn cảnh. “Nằm xuống” giữ hình ảnh nguyên văn và tạo cặp tương ứng với “thức dậy”.
- source_word: וּבְקוּמֶךָ
  choice: khi thức dậy
  rationale: קום nghĩa là đứng dậy/trỗi dậy; trong cặp với “nằm xuống”, “thức dậy” truyền đạt tự nhiên ý khởi đầu ngày mới trong tiếng Việt.
theological_decisions:
- issue: Phạm vi giới tính của בְּנֵיכֶם
  choice: con cái anh em
  alternative: các con trai của anh em
  rationale: Danh từ số nhiều giống đực có thể mang nghĩa đại diện cho con cái nói chung. Bản chính dùng “con cái” để diễn đạt phạm vi tự nhiên trong việc giáo huấn giao ước, đồng thời chú thích bảo tồn khả năng dịch sát hình thái là “các con trai”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” biểu thị đối tượng số nhiều theo nguyên văn; chuỗi “khi…” giữ nhịp song hành của câu Hê-bơ-rơ mà tránh lối diễn đạt cổ.
