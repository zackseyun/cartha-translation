  to: Không một người nào có thể đứng vững trước mặt anh em[a]. Yahweh, Đức Chúa Trời của anh em, sẽ khiến nỗi khiếp sợ và nỗi kinh hãi đối với anh em bao trùm khắp miền đất mà anh em đặt chân đến[b], đúng như Ngài đã phán với anh em.
  rationale: Bản sửa giữ nguyên mệnh đề và hình ảnh của nguyên văn, nhưng dùng “nỗi khiếp sợ và nỗi kinh hãi ... bao trùm” để tiếng Việt không hiểu miền đất là chủ thể có cảm xúc. “Đối với anh em” làm rõ quan hệ đối tượng của hai danh từ Hê-bơ-rơ mà không diễn giải thành một cơ chế cụ thể. “Yahweh” thay cho “Đức Giê-hô-va” theo chính sách danh thần đã nêu.
