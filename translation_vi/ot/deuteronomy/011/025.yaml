base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: vi
  text: Không một người nào có thể đứng vững trước mặt anh em[a]. Yahweh, Đức Chúa Trời của anh em, sẽ khiến nỗi khiếp sợ và nỗi kinh hãi đối với anh em bao trùm khắp miền đất mà anh em đặt chân đến[b], đúng như Ngài đã phán với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Không ai sẽ đứng nổi trước anh em.” Thành ngữ Hê-bơ-rơ “đứng trước mặt” ở đây có thể mang nghĩa chống cự hoặc đối đầu thành công.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trên mặt toàn xứ/đất.” Từ Hê-bơ-rơ có thể chỉ “xứ, đất” hoặc “trái đất”, nhưng ở đây mệnh đề “mà anh em đặt chân đến” hướng đến lãnh thổ Israel sẽ tiến vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: Không một người nào có thể đứng vững trước mặt anh em
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ “đứng trước mặt,” đồng thời “có thể đứng vững” truyền đạt ý chịu nổi hoặc chống cự thành công trong ngữ cảnh.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: khiếp sợ và kinh hãi anh em
  rationale: Hai cách diễn đạt gần nghĩa được giữ thành một cặp tăng cường; “anh em” là đối tượng hoặc nguyên nhân gây nên nỗi sợ nơi cư dân trong xứ.
- source_word: יִתֵּן ... עַל־פְּנֵי
  choice: sẽ khiến khắp ... phải
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho ý Đức Chúa Trời đặt nỗi sợ về Israel trên toàn miền đất, tránh cấu trúc dịch sát nhưng khó hiểu “đặt nỗi sợ trên mặt đất.”
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Đức Giê-hô-va, Đức Chúa Trời của anh em
  rationale: Dùng cách phiên âm danh riêng giao ước đã quen thuộc và trang trọng trong tiếng Việt, đồng thời giữ nguyên tước hiệu cùng quan hệ sở hữu.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: khắp miền đất
  rationale: הָאָרֶץ có thể là “đất/xứ” hoặc “trái đất”; mệnh đề tiếp theo giới hạn phạm vi vào lãnh thổ Israel sẽ đặt chân đến, nên “miền đất” phù hợp hơn.
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: mà anh em đặt chân đến
  rationale: Diễn đạt tự nhiên hình ảnh cụ thể của động từ “giẫm/đặt chân,” chỉ nơi Israel tiến vào.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: đúng như Ngài đã phán với anh em
  rationale: “Phán” phù hợp với lời Đức Chúa Trời và không diễn giải động từ “nói” thành nghĩa cụ thể hơn là “hứa.”
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh giao ước יהוה. Bản dịch giữ đây là danh riêng thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là hình thức trang trọng, quen thuộc trong tiếng Việt.
- issue: Số ít đại diện אִישׁ
  choice: không một người nào
  alternative: không ai; không một người đàn ông nào
  rationale: Trong lời nói về mọi đối thủ, אִישׁ mang chức năng đại diện. “Không một người nào” giữ dấu vết của danh từ số ít mà không thu hẹp không cần thiết vào giới tính của từng cá nhân.
- issue: Tác động của nỗi sợ
  choice: miền đất phải khiếp sợ và kinh hãi anh em
  alternative: Đức Giê-hô-va sẽ đặt sự khiếp sợ và kinh hãi anh em trên khắp miền đất
  rationale: Cấu trúc tiếng Việt làm rõ rằng Đức Chúa Trời gây nên nỗi sợ Israel nơi cư dân trong miền đất, nhưng không xác định thêm phương thức hay mức độ ngoài điều nguyên văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “anh em” cho đại từ số nhiều chỉ Israel, “Ngài” cho Đức Chúa Trời, và giữ hình ảnh “đặt chân đến” của nguyên văn.
