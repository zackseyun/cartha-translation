    issue: Cụm “khắp miền đất ... phải khiếp sợ và kinh hãi anh em” khiến “miền đất” là chủ thể khiếp sợ.
    rationale: Nguyên văn đặt “sự sợ hãi của anh em và sự kinh hãi của anh em” trên khắp miền đất; cách diễn đạt nên quy chiếu nỗi sợ lan trên miền đất, không nói đất tự sợ.
  - severity: medium
    issue: “Đức Giê-hô-va” không nhất quán với quyết định hiện hành về יהוה.
    rationale: Hồ sơ nguồn và vết kiểm tiếng Anh quy định chuyển danh giao ước là “Yahweh”; cần giữ danh riêng này trong bản Việt ngữ.
