  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: vi
  text: và những gì Ngài đã làm cho anh em trong hoang mạc cho đến khi anh em tới nơi này—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶר
  choice: và những gì
  rationale: Liên từ cùng đại từ quan hệ tiếp nối danh sách những việc dân đã chứng kiến; “và những gì” giữ được ý chỉ nội dung các việc đã làm, thay vì chuyển sang sắc thái cách thức.
- source_word: עָשָׂה
  choice: đã làm
  rationale: Đây là cách dịch trực tiếp, tự nhiên của động từ עשה trong ngữ cảnh nói về các hành động của Đức Chúa Trời.
- source_word: לָכֶם
  choice: cho anh em
  rationale: Giới từ ל ở đây diễn tả hành động hướng đến hoặc vì lợi ích của dân; “cho anh em” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: “Hoang mạc” chỉ vùng hoang vu nơi Israel lưu lạc mà không giới hạn địa hình vào sa mạc cát.
- source_word: עַד
  choice: cho đến khi
  rationale: עַד thứ nhất biểu thị giới hạn thời gian kéo dài đến lúc dân tới nơi này.
- source_word: בֹּאֲכֶם
  choice: anh em tới
  rationale: Dạng nguyên mẫu có hậu tố sau עַד được diễn đạt tự nhiên bằng một mệnh đề hữu hạn; “tới” không hàm ý phải đi vào một lãnh thổ có ranh giới.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: tới nơi này
  rationale: עַד thứ hai có sắc thái không gian, chỉ đích đến; tiếng Việt không cần lặp thêm một giới từ sau cấu trúc “cho đến khi ... tới”.
theological_decisions:
- issue: Chủ ngữ ngầm của עָשָׂה
  choice: Ngài
  alternative: Đức Giê-hô-va
  rationale: Ngữ cảnh xác định chủ thể là Đức Giê-hô-va; dùng “Ngài” nối lại tiền ngữ mà không lặp danh xưng hoặc bổ sung nội dung ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều לָכֶם/בֹּאֲכֶם, phù hợp lời Môi-se nói với cộng đồng Israel. Giữ dấu gạch ngang cuối câu vì câu này tiếp tục cấu trúc liệt kê của ngữ cảnh rộng hơn.
