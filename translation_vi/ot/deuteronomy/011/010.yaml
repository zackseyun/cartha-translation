source:
  edition: WLC
  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: vi
  text: Vì đất anh em sắp vào để chiếm hữu không giống đất Ai Cập[a], từ nơi anh em đã đi ra, nơi anh em từng gieo hạt giống và dùng chân để tưới nước[b] như tưới một vườn rau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc hiểu cả mệnh đề theo nghĩa tập quán: “... nơi anh em thường gieo hạt giống và dùng chân để tưới nước...”'
    reason: lexical_alternative
  - marker: b
    text: “Dùng chân để tưới nước” có lẽ nói đến việc vận hành dụng cụ tưới bằng chân hoặc dùng chân mở, đóng hay dẫn nước qua các rãnh tưới.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích của câu này đối với lời khuyên dạy đi trước và nối mạch lập luận một cách tự nhiên.
- source_word: הָאָרֶץ
  choice: vùng đất
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ chủ đề về đất mà Israel sắp nhận.
- source_word: בָא שָׁמָּה
  choice: sắp vào
  rationale: Phân từ diễn tả việc tiến vào đang cận kề; “sắp vào” tự nhiên và đúng bối cảnh.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: Giữ ý nhận quyền sở hữu và cư ngụ trong đất; không tự động chuyển thành sắc thái thừa kế theo huyết thống.
- source_word: לֹא כְאֶרֶץ מִצְרַיִם
  choice: không giống như đất Ai Cập
  rationale: Thể hiện trực tiếp phép đối chiếu giữa vùng đất sắp vào và Ai Cập.
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: nơi anh em đã ra khỏi
  rationale: Giữ động từ “ra khỏi”, vốn gợi lại cuộc Xuất Hành, thay vì làm nhạt thành “rời bỏ”.
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: Tại đó, anh em từng gieo hạt giống
  rationale: “Từng” diễn đạt hợp lý sắc thái tập quán trong quá khứ của thể chưa hoàn thành; “hạt giống” giữ hình ảnh cụ thể của nguyên văn.
- source_word: וְהִשְׁקִיתָ
  choice: rồi ... tưới
  rationale: Diễn đạt hành động tưới tiêu rõ ràng, không thêm một tân ngữ không có trong nguyên văn.
- source_word: בְרַגְלְךָ
  choice: dùng chân mình mà tưới
  rationale: Giữ hình ảnh cụ thể nhưng khó xác định của nguyên văn, để chú thích trình bày các cách hiểu khả dĩ.
- source_word: כְּגַן הַיָּרָק
  choice: như tưới một vườn rau
  rationale: “Vườn rau” là cách nói hiện đại, dễ hiểu cho một khoảnh vườn nhỏ cần được tưới thường xuyên; việc lặp “tưới” làm rõ liên hệ cú pháp trong tiếng Việt.
theological_decisions:
- issue: Cách nói gợi lại cuộc Xuất Hành trong bối cảnh giao ước
  choice: nơi anh em đã ra khỏi
  alternative: nơi anh em đã rời đi
  rationale: Giữ ý “ra khỏi” của יצא và âm hưởng về cuộc Xuất Hành mà không thêm lời giải thích thần học vào chính văn.
- issue: Sự chuyển đổi số ít và số nhiều trong lời xưng hô tiếng Hê-bơ-rơ
  choice: dùng “anh em” xuyên suốt
  alternative: chuyển giữa “anh em” và “anh”
  rationale: Tiếng Hê-bơ-rơ chuyển từ số ít tập thể sang số nhiều rồi trở lại số ít. Trong tiếng Việt, đổi đại từ như vậy dễ bị hiểu là đổi đối tượng; “anh em” vẫn có thể chỉ cả cộng đồng và giữ lời nói trực tiếp với Israel.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “anh em” làm đại từ tập thể dành cho Israel; giữ hình ảnh “dùng chân mình mà tưới” trong chính văn thay vì chọn dứt khoát một kỹ thuật thủy lợi cụ thể.
