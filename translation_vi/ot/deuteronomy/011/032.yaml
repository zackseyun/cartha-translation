  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: vi
  text: Anh em phải cẩn thận làm theo mọi luật lệ và phán quyết mà hôm nay tôi đặt trước mặt anh em[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “mà hôm nay tôi trao trước mặt anh em”; thành ngữ Hê-bơ-rơ có nghĩa là “đặt trước mặt anh em”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: Anh em phải cẩn thận
  rationale: Trong cấu trúc đi với לַעֲשׂוֹת, động từ שׁמר mang nghĩa chú ý, cẩn thận để thực hiện; “phải” diễn đạt rõ sức nặng chỉ thị của lời giao ước.
- source_word: לַ/עֲשׂוֹת
  choice: làm theo
  rationale: עשה chỉ việc thực hiện các điều răn. “Làm theo” tự nhiên hơn “làm” đứng riêng trong tiếng Việt và vẫn giữ nghĩa thi hành.
- source_word: כָּל
  choice: mọi
  rationale: “Mọi” diễn đạt tính toàn thể và kết hợp tự nhiên với hai danh từ số nhiều mang nghĩa tập hợp.
- source_word: הַֽ/חֻקִּים
  choice: luật lệ
  rationale: חֻקִּים là những quy định được ấn định; “luật lệ” giữ sắc thái pháp lý-giao ước và phân biệt với מִשְׁפָּטִים.
- source_word: וְ/אֶת הַ/מִּשְׁפָּטִים
  choice: và phán quyết
  rationale: מִשְׁפָּטִים có thể chỉ các phán quyết, quyết định pháp lý hoặc quy định. “Phán quyết” giữ gần nét nghĩa từ vựng và tránh nhập làm một với חֻקִּים.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן
  choice: mà ... tôi đặt
  rationale: נתן nghĩa đen là “trao/ban”, nhưng khi kết hợp với לִפְנֵי tạo thành thành ngữ “đặt trước mặt”. Cách dịch này tự nhiên và giữ lực hiện tại của phân từ.
- source_word: לִ/פְנֵי/כֶם
  choice: trước mặt anh em
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ về việc trình bày các điều luật cho cộng đồng.
- source_word: הַ/יּוֹם
  choice: hôm nay
  rationale: Giữ tính tức thời về thời gian trong lời giao ước bằng tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh em” biểu thị đối tượng số nhiều là cộng đồng Israel; “luật lệ” và “phán quyết” duy trì sự phân biệt giữa hai thuật ngữ pháp lý Hê-bơ-rơ.
