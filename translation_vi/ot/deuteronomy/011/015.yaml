source:
  edition: WLC
  text: וְ/נָתַתִּ֛י עֵ֥שֶׂב בְּ/שָׂדְ/ךָ֖ לִ/בְהֶמְתֶּ֑/ךָ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: vi
  text: Ta sẽ cho cỏ trong đồng ruộng ngươi làm thức ăn cho gia súc ngươi[a]; ngươi sẽ ăn và được no đủ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể dịch là “cây cỏ”, “thảo mộc” hoặc “thực vật”; trong ngữ cảnh này, từ ấy chỉ cỏ làm thức ăn cho gia súc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “được thỏa lòng” hoặc “được no”; động từ Hê-bơ-rơ chỉ trạng thái no hoặc thỏa mãn sau khi ăn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Ta sẽ cho
  rationale: Động từ ngôi thứ nhất số ít, trong mạch lời hứa, được diễn đạt bằng thì tương lai. “Ta” giữ lời phán trực tiếp của Đức Chúa Trời.
- source_word: עֵשֶׂב
  choice: cỏ
  rationale: Từ này có thể chỉ cây cỏ nói chung, nhưng cụm “cho gia súc” cho thấy ở đây chủ yếu là cỏ dùng làm thức ăn cho vật nuôi.
- source_word: בְּשָׂדְךָ
  choice: trong đồng ruộng của ngươi
  rationale: Giữ hình ảnh nông nghiệp cụ thể và dạng số ít của שָׂדֶה; “đồng ruộng” tự nhiên trong tiếng Việt hiện đại.
- source_word: לִבְהֶמְתֶּךָ
  choice: để làm thức ăn cho gia súc của ngươi
  rationale: בְּהֵמָה mang nghĩa tập hợp về vật nuôi. Thêm “làm thức ăn” làm rõ quan hệ mục đích vốn hàm chứa trong ngữ cảnh mà không mở rộng ý nghĩa.
- source_word: וְאָכַלְתָּ
  choice: ngươi sẽ ăn
  rationale: Giữ ngôi thứ hai số ít trong lời giao ước hướng đến Israel như một tập thể được xưng ở số ít.
- source_word: וְשָׂבָעְתָּ
  choice: và được no đủ
  rationale: Diễn đạt trạng thái no và thỏa mãn sau khi ăn; “no đủ” tự nhiên, trang trọng và phù hợp với bối cảnh phước lành nông nghiệp.
theological_decisions:
- issue: Lối xưng hô số ít đại diện cho Israel
  choice: Giữ ngôi thứ hai số ít bằng “ngươi” và “của ngươi”
  alternative: Chuyển sang số nhiều như “các ngươi”
  rationale: Bản Hê-bơ-rơ nhất quán dùng ngôi thứ hai giống đực số ít. Giữ số ít bảo toàn hình thức và sức tu từ của lời giao ước.
- issue: Bản chất của phước lành được hứa
  choice: 'Diễn đạt sự chu cấp nông nghiệp cụ thể: cỏ cho gia súc và thức ăn khiến con người no đủ'
  alternative: Mở rộng thành lời hứa chung về thịnh vượng hoặc sung túc
  rationale: Câu này chỉ trực tiếp nói đến sự chu cấp trong nông nghiệp; không nên đưa vào những hàm ý thần học về thịnh vượng vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/ngươi” để giữ sắc thái lời phán giao ước và ngôi số ít của nguyên văn; tránh từ cổ khó hiểu. Cấu trúc câu giữ trình tự của tiếng Hê-bơ-rơ nhưng thêm “mọc” và “làm thức ăn” để tiếng Việt tự nhiên và thể hiện rõ quan hệ ngữ nghĩa trong ngữ cảnh.
