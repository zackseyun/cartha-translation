  - severity: medium
    issue: Chú thích [a] neo sau “gia súc” nhưng nội dung chú thích lại cần giải thích từ עֵשֶׂב (“cỏ”).
    rationale: Chú thích hiện tại vừa đặt sai vị trí vừa nêu các phương án thuộc trường nghĩa của “gia súc,” trong khi ghi chú đối chiếu nguồn cần nêu các lựa chọn “cây cỏ/thực vật” cho עֵשֶׂב.
