  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: vi
  text: Và nếu anh em thật sự lắng nghe các điều răn của Ta mà hôm nay Ta truyền cho anh em[a], để yêu mến Yahweh[b], Đức Chúa Trời của anh em, và phụng sự Ngài bằng cả tấm lòng và cả linh hồn[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “nếu anh em chuyên tâm lắng nghe”; thành ngữ này cũng có thể hàm ý “nếu anh em cẩn thận vâng lời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: יהוה (YHWH), theo truyền thống thường được dịch là “CHÚA”; ở đây được phiên âm là “Yahweh.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ này cũng có thể được hiểu là “mạng sống” hoặc “toàn thể con người.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Nếu
  rationale: Cụm này mở đầu mệnh đề điều kiện kéo dài sang câu sau. “Nếu” diễn đạt tự nhiên chức năng cú pháp ấy trong tiếng Việt; không cần dịch sát, nặng nề là “Và sẽ xảy ra rằng, nếu”.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: thật sự lắng nghe
  rationale: Động từ nguyên thể tuyệt đối đi với động từ cùng gốc tạo ý nhấn mạnh. “Thật sự lắng nghe” giữ được sắc thái nghe và đáp ứng của שׁמע mà chưa thu hẹp hoàn toàn thành “vâng lời”; sắc thái tuân phục được giải thích trong chú thích.
- source_word: אֶל מִצְוֺתַי
  choice: các điều răn của Ta
  rationale: “Điều răn” phù hợp với nghĩa vụ được truyền phán trong bối cảnh giao ước và là cách nói rõ ràng, quen thuộc trong tiếng Việt.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: mà hôm nay Ta truyền cho anh em
  rationale: Phân từ מְצַוֶּה diễn tả hành động truyền lệnh đang diễn ra trong lời tuyên bố; trật tự tiếng Việt này tự nhiên và vẫn giữ điểm nhấn thời gian “hôm nay”.
- source_word: לְאַהֲבָה
  choice: yêu mến
  rationale: Dịch trực tiếp động từ “yêu”; “yêu mến” mang sắc thái trang trọng, tự nhiên khi nói về lòng trung thành với Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Cách dịch chuẩn, trang trọng của danh xưng giao ước này; “anh em” diễn đạt đại từ số nhiều hướng đến toàn thể dân chúng.
- source_word: וּלְעָבְדוֹ
  choice: và phụng sự Ngài
  rationale: עבד ở đây bao gồm sự phục vụ tận hiến, vâng phục và thờ phượng. “Phụng sự” giữ nghĩa rộng hơn so với chỉ dịch là “thờ phượng”.
- source_word: בְּכָל לְבַבְכֶם
  choice: hết lòng
  rationale: Thành ngữ tiếng Việt tự nhiên, tương ứng với toàn bộ tấm lòng—ý chí, suy nghĩ và tình cảm.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: hết linh hồn
  rationale: Giữ từ tương ứng truyền thống của נֶפֶשׁ trong công thức giao ước, đồng thời chú thích các nghĩa rộng hơn là mạng sống và toàn thể con người.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo tồn tư cách danh giao ước, không âm thầm thay bằng một tước hiệu.
- issue: Sắc thái của שָׁמֹעַ תִּשְׁמְעוּ
  choice: thật sự lắng nghe
  alternative: chuyên tâm vâng lời; cẩn thận nghe theo
  rationale: Cấu trúc Hê-bơ-rơ vừa nhấn mạnh việc nghe vừa hàm ý đáp ứng bằng sự vâng phục. Bản chính giữ hình ảnh “lắng nghe”, còn chú thích nêu rõ sắc thái tuân hành để không giải quyết quá mức tính đa nghĩa.
- issue: Phạm vi nghĩa của נֶפֶשׁ
  choice: linh hồn
  alternative: mạng sống; toàn thể con người
  rationale: Trong công thức đi đôi với “lòng”, “linh hồn” bảo tồn cách diễn đạt quen thuộc và sự căng nghĩa của từ Hê-bơ-rơ; chú thích cho biết từ này cũng có thể chỉ sự sống hoặc toàn bộ con người, tránh áp đặt một quan niệm phân chia bản thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh em” biểu thị đối tượng số nhiều là cộng đồng giao ước; “Ta/Ngài” được viết hoa để giúp nhận diện quy chiếu thần linh trong lời phán. Dấu phẩy cuối câu được giữ vì mệnh đề điều kiện tiếp tục sang Phục Truyền Luật Lệ Ký 11:14.
