base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: vi
  text: phước lành[a], nếu anh em lắng nghe[b] các điều răn của Yahweh, Đức Chúa Trời của anh em, mà hôm nay tôi truyền cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phước lành đến khi anh em vâng theo các điều răn của Yahweh, Đức Chúa Trời của anh em.” Trong tiếng Hê-bơ-rơ, tiểu từ quan hệ ở đây mang ý nghĩa điều kiện.'
    reason: lexical_alternative
  - marker: b
    text: “Lắng nghe” cũng có thể dịch là “vâng theo”, vì động từ Hê-bơ-rơ này thường chỉ việc nghe và đáp ứng bằng sự vâng phục.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: phước lành
  rationale: Cụm có dấu hiệu chỉ tân ngữ tiếp nối cấu trúc tỉnh lược của câu 26; giữ cụm danh từ ngắn gọn mà không thêm nội dung không có trong nguyên văn.
- source_word: אֲשֶׁר
  choice: nếu
  rationale: Dù về hình thức là tiểu từ quan hệ, trong ngữ cảnh này từ ấy nêu điều kiện để nhận phước lành.
- source_word: תִּשְׁמְעוּ אֶל
  choice: lắng nghe
  rationale: Động từ שׁמע đi với אֶל diễn tả việc nghe chăm chú và trong ngữ cảnh giao ước hàm ý đáp ứng bằng sự vâng phục; “lắng nghe” giữ được nét nghĩa trực tiếp.
- source_word: מִצְוֺת
  choice: các điều răn
  rationale: Cách dịch trang trọng, tự nhiên và chính xác trong bối cảnh luật pháp giao ước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Thể hiện rõ danh từ với hậu tố sở hữu ngôi thứ hai số nhiều, đồng thời phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: “Mà” nối mệnh đề quan hệ với “các điều răn”; cách đặt “hôm nay” tự nhiên trong tiếng Việt và vẫn giữ tính tức thời của lời Môi-se đang công bố.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo toàn chức năng danh riêng mà không biến nó thành tước hiệu.
- issue: Quan hệ giữa phước lành và việc nghe lời
  choice: nếu anh em lắng nghe
  alternative: khi anh em vâng giữ
  rationale: Cách dịch này giữ lực điều kiện của אֲשֶׁר trong ngữ cảnh, đồng thời không thu hẹp שׁמע chỉ còn ý niệm vâng phục; hàm ý đáp ứng vẫn được ghi chú.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với cộng đồng Israel; giữ danh riêng “Yahweh”. Mọi dấu chú thích đều xuất hiện trong chính văn.
