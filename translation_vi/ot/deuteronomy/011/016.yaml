  text: הִשָּֽׁמְר֣וּ לָ/כֶ֔ם פֶּ֥ן יִפְתֶּ֖ה לְבַבְ/כֶ֑ם וְ/סַרְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: vi
  text: Hãy cẩn thận, kẻo lòng anh em bị dụ dỗ, rồi anh em quay đi, phụng sự các thần khác và cúi lạy chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kẻo lòng anh em bị lừa dối.” Động từ Hê-bơ-rơ có thể mang nghĩa bị thuyết phục, bị dụ dỗ hoặc bị lừa dối.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Hãy cẩn thận
  rationale: Cụm mệnh lệnh phản thân này là một công thức cảnh báo. “Hãy cẩn thận” truyền đạt tự nhiên cả sức mạnh mệnh lệnh lẫn ý tự giữ mình trong tiếng Việt.
- source_word: פֶּן
  choice: kẻo
  rationale: Từ này mở đầu mệnh đề cảnh báo về hậu quả cần tránh; “kẻo” ngắn gọn, tự nhiên và phù hợp với văn phong trang trọng.
- source_word: יִפְתֶּה
  choice: bị dụ dỗ
  rationale: Động từ פתה có thể chỉ việc bị thuyết phục, lôi cuốn hoặc lừa dối. “Bị dụ dỗ” giữ rõ sắc thái hấp dẫn, lôi kéo dẫn đến bội đạo; nghĩa “bị lừa dối” được ghi ở chú thích.
- source_word: לְבַבְכֶם
  choice: lòng anh em
  rationale: לֵבָב chỉ con người bên trong, gồm ý chí và nhận thức. “Lòng” là cách diễn đạt quen thuộc, trang trọng và phù hợp với ngữ cảnh giao ước.
- source_word: וְסַרְתֶּם
  choice: rồi anh em quay khỏi đường ngay
  rationale: סור diễn tả việc rời khỏi con đường hoặc lòng trung thành đúng đắn. Cách dịch này làm rõ hình ảnh chuyển hướng vốn hàm chứa trong động từ mà không giản lược thành một thuật ngữ thần học trừu tượng.
- source_word: וַעֲבַדְתֶּם
  choice: phụng sự
  rationale: עבד khi dùng với các thần mang nghĩa phục vụ với lòng sùng kính tôn giáo. “Phụng sự” phân biệt hành vi này với động tác sấp mình ở vế sau.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: Đây là nghĩa trực tiếp của cụm từ; “các thần ngoại bang” sẽ thêm một sắc thái không nhất thiết có trong câu.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: và sấp mình trước chúng
  rationale: Động từ השתחוה chỉ hành động cúi rạp hoặc phủ phục, thường để thờ lạy. “Sấp mình trước” giữ hình ảnh cụ thể và ngữ cảnh cho thấy ý nghĩa tôn giáo.
theological_decisions:
- issue: Bản chất của lời cảnh báo về sự bội đạo
  choice: Giữ tiến trình từ lòng bị dụ dỗ, đến quay khỏi đường ngay, rồi phụng sự và sấp mình trước các thần khác.
  alternative: Diễn giải toàn bộ câu đơn giản là lời cảnh báo đừng bị lôi kéo vào việc thờ thần tượng.
  rationale: Trình tự trong tiếng Hê-bơ-rơ phân biệt sự chuyển biến bên trong với các hành động bội ước bên ngoài. Bản dịch giữ nguyên sức căng và tiến trình ấy, không áp đặt một hệ thống giáo lý về cơ chế của sự sa ngã.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng Israel; tránh cách diễn đạt cổ hoặc mang dấu ấn hệ phái.
