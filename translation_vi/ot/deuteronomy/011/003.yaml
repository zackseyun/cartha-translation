source:
  edition: WLC
  text: וְ/אֶת אֹֽתֹתָי/ו֙ וְ/אֶֽת מַעֲשָׂ֔י/ו אֲשֶׁ֥ר עָשָׂ֖ה בְּ/ת֣וֹךְ מִצְרָ֑יִם לְ/פַרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם וּ/לְ/כָל אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: vi
  text: cùng các dấu lạ của Ngài và những việc Ngài đã làm giữa Ai Cập[a], đối với Pha-ra-ôn, vua Ai Cập, và toàn xứ của vua ấy—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bên trong Ai Cập.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “chống lại Pha-ra-ôn ... và chống lại toàn xứ của vua ấy”; nguyên văn dùng giới từ có nghĩa đen là “đối với,” còn ngữ cảnh nói đến những hành động phán xét.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: các dấu lạ
  rationale: אוֹת chỉ một dấu hiệu hoặc điềm có ý nghĩa đặc biệt; trong ngữ cảnh các hành động của Đức Chúa Trời tại Ai Cập, “dấu lạ” vừa tự nhiên trong tiếng Việt vừa giữ được ý niệm về dấu hiệu, thay vì đồng nhất hẳn với “phép lạ” hay מוֹפֵת.
- source_word: מַעֲשָׂיו
  choice: những việc Ngài đã làm
  rationale: מַעֲשֶׂה là việc làm hay hành động. Cách diễn đạt này tự nhiên hơn “các công việc của Ngài” và kết hợp gọn với mệnh đề אֲשֶׁר עָשָׂה mà không làm đổi nghĩa.
- source_word: אֲשֶׁר עָשָׂה
  choice: Ngài đã làm
  rationale: Mệnh đề quan hệ quy chiếu đến các dấu lạ và việc làm; trong tiếng Việt có thể gộp tự nhiên thành “các dấu lạ và những việc Ngài đã làm” mà vẫn chuyển tải hành động quá khứ.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: giữa Ai Cập
  rationale: בְּתוֹךְ mang nghĩa ở giữa, bên trong. “Giữa Ai Cập” giữ sắc thái cụ thể của nguyên văn mà vẫn là tiếng Việt tự nhiên.
- source_word: לְפַרְעֹה
  choice: đối với Pha-ra-ôn
  rationale: לְ đánh dấu đối tượng chịu tác động. “Đối với” giữ độ rộng của giới từ Hê-bơ-rơ, không tự động diễn giải thành “chống lại,” dù ngữ cảnh hàm ý phán xét.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: vua Ai Cập
  rationale: Cách chuyển ngữ trực tiếp và thông dụng của cấu trúc sở thuộc.
- source_word: וּלְכָל אַרְצוֹ
  choice: và toàn xứ của vua ấy
  rationale: אֶרֶץ ở đây là lãnh thổ hoặc xứ sở. “Vua ấy” làm rõ hậu tố giống đực số ít quy về Pha-ra-ôn, tránh để “xứ của ông” có sắc thái khẩu ngữ hoặc mơ hồ.
- source_word: וְאֶת ... וְאֶת
  choice: cùng ... và
  rationale: Các tiểu từ chỉ tân ngữ nối câu này với động từ “đã thấy” ở câu trước. “Cùng ... và” giữ tính chất tiếp nối của danh sách trong tiếng Việt.
theological_decisions:
- issue: Hướng tác động của các việc Đức Chúa Trời làm đối với Pha-ra-ôn và xứ Ai Cập
  choice: đối với
  alternative: chống lại
  rationale: Ngữ cảnh nói đến sự phán xét, nhưng giới từ לְ tự nó rộng hơn nghĩa đối nghịch. Bản chính giữ cách nói trung tính hơn, còn chú thích nêu cách hiểu theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Vì đây là phần tiếp nối câu trước, bản dịch mở đầu bằng “cùng” và giữ dấu gạch ngang cuối câu. Đại từ “Ngài” quy chiếu Đức Chúa Trời; “Pha-ra-ôn” theo cách phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
