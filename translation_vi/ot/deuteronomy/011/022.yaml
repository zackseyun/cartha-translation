  text: כִּי֩ אִם שָׁמֹ֨ר תִּשְׁמְר֜וּ/ן אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם לַ/עֲשֹׂתָ֑/הּ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לָ/לֶ֥כֶת בְּ/כָל דְּרָכָ֖י/ו וּ/לְ/דָבְקָה בֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: vi
  text: Vì nếu anh em cẩn thận tuân giữ[a] toàn bộ điều răn này[b] mà tôi đang truyền cho anh em thực hành—yêu mến Yahweh, Đức Chúa Trời của anh em, bước đi trong mọi đường lối Ngài và gắn bó với Ngài[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ nhấn mạnh động từ bằng cách đặt nguyên mẫu tuyệt đối bên cạnh động từ hữu hạn; cũng có thể dịch: “chuyên tâm tuân giữ.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “toàn bộ điều răn này” ở số ít, có lẽ là cách nói mang nghĩa tập hợp, chỉ toàn bộ trách nhiệm trong giao ước.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bám chặt lấy Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Vì nếu
  rationale: Giữ quan hệ nối kết với câu trước và chức năng mở đầu một mệnh đề điều kiện có sắc thái nhấn mạnh.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: anh em cẩn thận tuân giữ
  rationale: Kết cấu nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động; “cẩn thận tuân giữ” diễn đạt cả sự chuyên tâm lẫn vâng giữ giao ước.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: toàn bộ điều răn này
  rationale: Giữ danh từ số ít của tiếng Hê-bơ-rơ, có thể mang nghĩa tập hợp chỉ toàn bộ mệnh lệnh giao ước.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: mà tôi đang truyền cho anh em thực hành
  rationale: “Đang truyền” phản ánh sắc thái hiện tại của phân từ; “thực hành” chuyển tải tự nhiên động từ עשה trong ngữ cảnh thi hành điều răn mà không thêm ý không có trong câu.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: yêu mến Yahweh, Đức Chúa Trời của anh em
  rationale: “Yêu mến” phù hợp với quan hệ giao ước; “Yahweh” phiên âm danh riêng יְהוָה, còn אֱלֹהֵיכֶם được diễn đạt bằng cách xưng gọi tự nhiên trong tiếng Việt.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: bước đi trong mọi đường lối Ngài
  rationale: Bảo tồn ẩn dụ Kinh Thánh về cách sống và tính bao quát của כָּל, thay vì giải nghĩa hẹp thành một kiểu hành vi cụ thể.
- source_word: וּלְדָבְקָה בוֹ
  choice: và gắn bó với Ngài
  rationale: דבק chỉ sự bám chặt, gắn kết và trung thành; “gắn bó” tự nhiên trong tiếng Việt, đồng thời giữ sắc thái quan hệ mà không giới hạn vào một cách giải thích thần học.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước; phiên âm “Yahweh” phân biệt danh riêng này với một tước hiệu và không thay thế nó bằng truyền thống đọc khác.
- issue: Các ẩn dụ giao ước “bước đi” và “gắn bó”
  choice: Giữ các hình ảnh trong chính văn
  alternative: Diễn giải thành “sống theo” và “luôn trung thành với”
  rationale: Các hình ảnh nguyên văn vừa nói đến lối sống vừa nói đến sự gắn kết trong giao ước; giữ chúng tránh thu hẹp ý nghĩa và bảo tồn sức gợi của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng Israel, “tôi” cho lời Môi-se, và viết hoa “Ngài” khi quy chiếu đến Yahweh. Dấu gạch ngang cuối câu được giữ vì mệnh đề điều kiện tiếp tục sang câu sau.
