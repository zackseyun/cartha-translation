id: DEU.11.11
reference: Deuteronomy 11:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: vi
  text: Nhưng miền đất anh em đang vượt qua để chiếm hữu[a] là miền đất có núi non và thung lũng; đất ấy uống nước nhờ mưa từ trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thừa hưởng.” Động từ Hê-bơ-rơ có thể mang cả ý chiếm hữu lẫn thừa hưởng, nhất là trong bối cảnh giao ước.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ có hình thức số nhiều, nghĩa đen là “các trời,” một cách nói quen thuộc trong Kinh Thánh để chỉ bầu trời hoặc cõi trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Nhưng miền đất
  rationale: Liên từ וְ ở đây tạo thế tương phản với Ai Cập được mô tả trong câu trước; “Nhưng” diễn đạt rõ chức năng liên kết ấy. “Miền đất” tự nhiên trong tiếng Việt và phù hợp với vùng đất đang được nói đến.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: anh em đang vượt qua
  rationale: Phân từ עֹבְרִים diễn tả hành động đang hoặc sắp diễn ra. “Vượt qua” giữ được ý chuyển sang vùng đất bên kia; hướng từ שָׁמָּה đã được hàm chứa trong mạch câu nên không cần thêm “đến đó”.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: Động từ ירשׁ vừa có thể nói đến việc chiếm lấy, sở hữu, vừa có sắc thái thừa hưởng trong bối cảnh giao ước. “Chiếm hữu” giữ được tính chủ động của việc dân Israel tiến vào nhận đất; phương án “thừa hưởng” được ghi ở chú thích.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: miền đất có núi non và thung lũng
  rationale: Cụm đồng vị mô tả địa hình. “Núi non và thung lũng” là cách diễn đạt tự nhiên, rõ nghĩa, đồng thời giữ sự tương phản địa hình của הָרִים và בְקָעֹת.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: nhờ mưa từ trời
  rationale: Giới từ לְ trong ngữ cảnh này biểu thị phương tiện hoặc nguồn cung cấp nước. “Nhờ mưa từ trời” diễn đạt tự nhiên rằng đất nhận nước qua lượng mưa, còn chú thích lưu ý hình thức số nhiều của danh từ Hê-bơ-rơ.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: đất ấy uống nước
  rationale: Giữ nguyên phép nhân hóa sinh động của bản Hê-bơ-rơ, thay vì làm phẳng thành “được tưới nước.” Lặp lại “đất ấy” rõ ràng và tự nhiên hơn đại từ vô tri trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của ירשׁ trong bối cảnh giao ước
  choice: Dịch trong câu chính là “chiếm hữu,” đồng thời ghi “thừa hưởng” trong chú thích.
  alternative: Dịch trực tiếp là “thừa hưởng.”
  rationale: Nguyên ngữ có thể bao gồm cả hành động nhận quyền sở hữu và sắc thái thừa hưởng theo lời hứa. Cách trình bày này không loại bỏ một trong hai chiều nghĩa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để xưng hô với cộng đồng Israel; giữ phép nhân hóa “đất ấy uống nước” của nguyên ngữ. Các chú thích bảo toàn sắc thái từ vựng mà không áp đặt cách hiểu hệ phái.
