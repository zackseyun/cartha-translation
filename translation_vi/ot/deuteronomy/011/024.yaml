  text: כָּל הַ/מָּק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם יִהְיֶ֑ה מִן הַ/מִּדְבָּ֨ר וְ/הַ/לְּבָנ֜וֹן מִן הַ/נָּהָ֣ר נְהַר פְּרָ֗ת וְ/עַד֙ הַ/יָּ֣ם הָֽ/אַחֲר֔וֹן יִהְיֶ֖ה גְּבֻלְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: vi
  text: Mọi nơi mà lòng bàn chân anh em giẫm lên sẽ thuộc về anh em. Ranh giới của anh em sẽ trải từ hoang mạc đến Li-băng, từ sông lớn, tức sông Ơ-phơ-rát, cho đến biển phía tây.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa sát chữ: “biển cuối cùng” hoặc “biển phía sau”; cách gọi này thường chỉ Địa Trung Hải ở phía tây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: Mọi nơi
  rationale: 'Diễn đạt tự nhiên ý phân phối: mỗi nơi, mọi địa điểm.'
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: lòng bàn chân anh em giẫm lên
  rationale: Giữ hình ảnh cụ thể của thành ngữ כַּף רֶגֶל và nghĩa bước/giẫm của דרך, đồng thời dùng số nhiều tự nhiên trong tiếng Việt cho đại từ tập thể.
- source_word: לָכֶם יִהְיֶה
  choice: sẽ thuộc về anh em
  rationale: Truyền đạt rõ sắc thái sở hữu trong lời hứa.
- source_word: מִן הַמִּדְבָּר וְהַלְּבָנוֹן
  choice: từ hoang mạc đến Li-băng
  rationale: Trong công thức chỉ phạm vi địa lý, וְ có thể đánh dấu điểm tận cùng tương ứng; dùng “đến” giúp câu tiếng Việt rõ nghĩa mà không đồng nhất hoang mạc với Li-băng.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: từ Sông Cả, tức sông Ơ-phơ-rát
  rationale: Giữ danh xưng nhấn mạnh “Sông” rồi nêu phần đồng vị xác định đó là Ơ-phơ-rát; “Sông Cả” chuyển tải cách gọi tuyệt đối tự nhiên hơn trong tiếng Việt.
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: cho đến biển phía tây
  rationale: אַחֲרוֹן theo cách định hướng địa lý Hê-bơ-rơ chỉ phía sau, tức phía tây; bản dịch chính truyền đạt ý địa lý và chú thích giữ nghĩa sát chữ.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: Ranh giới của anh em sẽ trải
  rationale: גְּבוּל ở đây là đường biên hoặc phạm vi lãnh thổ; “sẽ trải từ… đến…” tạo cấu trúc địa lý tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ về lời hứa lãnh thổ
  choice: Trình bày trực tiếp lời hứa về phạm vi lãnh thổ
  alternative: Giải thích đây là biên giới lý tưởng hoặc quyền sở hữu vô điều kiện, vĩnh viễn
  rationale: Câu này nêu phạm vi địa lý của lời hứa trong bối cảnh giao ước nhưng không tự giải quyết các tranh luận rộng hơn về sự ứng nghiệm, tính vĩnh viễn hay hình bóng học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi hai số nhiều chỉ toàn thể dân chúng; dùng địa danh quen thuộc “Li-băng” và “Ơ-phơ-rát”. Cấu trúc được chia thành hai câu để phân biệt lời hứa sở hữu với phần mô tả ranh giới.
