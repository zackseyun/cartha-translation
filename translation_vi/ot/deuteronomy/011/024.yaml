revisions:
- from: Mọi nơi lòng bàn chân anh em giẫm lên sẽ thuộc về anh em. Ranh giới của anh em sẽ trải từ hoang mạc đến Li-băng, từ Sông Cả, tức sông Ơ-phơ-rát, cho đến biển phía tây.[a]
  to: Mọi nơi mà lòng bàn chân anh em giẫm lên sẽ thuộc về anh em. Ranh giới của anh em sẽ trải từ hoang mạc đến Li-băng, từ sông lớn, tức sông Ơ-phơ-rát, cho đến biển phía tây.[a]
  rationale: 'Chỉnh hai điểm diễn đạt an toàn: thêm “mà” để đánh dấu mệnh đề quan hệ tương ứng với אֲשֶׁר, và thay “Sông Cả” bằng “sông lớn” để tránh một cách gọi không tự nhiên hoặc dễ bị hiểu nhầm trong tiếng Việt hiện đại. Giữ nguyên ý nghĩa, các địa danh, phạm vi địa lý, và chú thích về “biển phía tây.”'
  reviewer_model: gpt-5.6-terra
