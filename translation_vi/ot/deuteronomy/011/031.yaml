  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: vi
  text: Vì anh em sắp vượt qua sông Giô-đanh để vào chiếm hữu vùng đất mà Yahweh[a], Đức Chúa Trời của anh em, đang ban cho anh em, và anh em sẽ chiếm hữu đất ấy và sinh sống tại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; ở đây được phiên âm là “Yahweh”, theo truyền thống thường được dịch bằng tước hiệu “ĐỨC CHÚA”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng liên kết, nêu lý do cho lời khuyên bảo ở câu trước.
- source_word: עֹבְרִים
  choice: sắp vượt qua
  rationale: Phân từ Qal diễn tả hành động cận kề trong bối cảnh dân Israel chuẩn bị qua sông; cách dịch này tự nhiên hơn trong tiếng Việt so với “đang vượt qua” khi họ chưa thực sự qua sông.
- source_word: הַיַּרְדֵּן
  choice: sông Giô-đanh
  rationale: Dùng tên gọi quen thuộc trong tiếng Việt và nói rõ đây là một con sông, điều vốn hàm ẩn trong địa danh.
- source_word: לָבֹא
  choice: để vào
  rationale: Giữ mục đích của việc vượt sông và trình tự động từ trong nguyên văn.
- source_word: לָרֶשֶׁת / וִירִשְׁתֶּם אֹתָהּ
  choice: chiếm hữu / sẽ chiếm hữu
  rationale: Động từ ירשׁ trong ngữ cảnh này chỉ việc tiếp nhận và nắm quyền sở hữu vùng đất; lặp lại cùng một cách dịch để phản ánh sự lặp lại của nguyên văn.
- source_word: הָאָרֶץ
  choice: vùng đất / đất ấy
  rationale: “Vùng đất” tự nhiên trong lần nhắc đầu; “đất ấy” tránh lặp nặng nề mà vẫn giữ nguyên đối tượng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng YHWH, không thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt rõ cấu trúc sở hữu ngôi thứ hai số nhiều và giữ sắc thái trang trọng, giao ước.
- source_word: נֹתֵן לָכֶם
  choice: đang ban cho anh em
  rationale: Giữ tính hiện tại, sống động của phân từ và nhấn mạnh đất là quà ban của Đức Chúa Trời.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: sinh sống tại đó
  rationale: Diễn đạt tự nhiên ý cư trú lâu dài của ישׁב mà không dùng từ cổ hoặc quá trang trọng.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo tồn tư cách danh riêng và tránh biến danh ấy thành một tước hiệu.
- issue: Quan hệ giữa quà ban của Đức Chúa Trời và việc Israel chiếm hữu đất
  choice: Giữ cả “đang ban” lẫn “sẽ chiếm hữu”
  alternative: Diễn giải sao cho chỉ nhấn mạnh quà ban hoặc chỉ nhấn mạnh hành động chiếm đất
  rationale: Nguyên văn đặt hành động ban đất của Đức Chúa Trời bên cạnh hành động Israel thực sự chiếm hữu đất; bản dịch không xóa bỏ sự căng thẳng thần học này.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng “anh em” cho ngôi thứ hai số nhiều vì phù hợp với lời Môi-se nói với cộng đồng Israel; dùng “sinh sống” thay cho cách nói cổ hơn như “cư ngụ”.
