- from: Hãy viết những lời ấy lên các cột cửa nhà anh em và trên các cổng của anh em.[a][b]
  to: Hãy viết những lời ấy trên các cột cửa của nhà anh em và trên các cổng của anh em.[a][b]
  rationale: Bản sửa chỉ cải thiện tính tự nhiên và minh bạch của cấu trúc sở hữu, đồng thời làm song song hai cụm chỉ vị trí. Nghĩa nguyên ngữ, số nhiều của «cột cửa/cổng», lực mệnh lệnh, và các neo chú thích đều được giữ nguyên.
