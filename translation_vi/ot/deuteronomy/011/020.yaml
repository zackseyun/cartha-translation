review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng lực chỉ thị của וּכְתַבְתָּם và quy chiếu hợp lý của hậu tố số nhiều là các lời/mệnh lệnh đã nói trước đó. «Cột cửa» dịch sát מְזוּזוֹת; «cổng» giữ nghĩa chính của שְׁעָרֶיךָ. Tuy nhiên, cách đặt «lên ... và trên ...» chưa song song tự nhiên, và cách xưng hô cần nhất quán hơn trong tiếng Việt hiện đại.
  naturalness: «Các cột cửa nhà anh em» thiếu giới từ sở hữu nên hơi nén và có thể gây lưỡng nghĩa. «Nhà của anh em» và «các cổng của anh em» rõ ràng, trang trọng, và phù hợp với lối xưng hô cộng đồng trong ngữ cảnh diễn từ giao ước.
  terminology: Giữ «cột cửa», không phiên âm thuật ngữ Do Thái hậu kỳ. Giữ «cổng» làm nghĩa chính; chú thích về nghĩa khu vực cổng là phù hợp. Chú thích a cần nói rõ «cột/khung hai bên cửa», tránh để «khung cửa» bị hiểu là toàn bộ khung theo cách dùng hiện đại.
  issues:
  - severity: low
    issue: Cụm «các cột cửa nhà anh em» thiếu dấu hiệu sở hữu rõ ràng.
    rationale: Thêm «của» giúp liên hệ giữa cột cửa và nhà minh bạch hơn trong tiếng Việt hiện đại.
  - severity: low
    issue: Giới từ «lên ... và trên ...» không song song.
    rationale: Dùng «trên» ở cả hai vế tạo nhịp câu cân đối mà không đổi nghĩa vị trí.
  - severity: low
    issue: Chú thích a gọi mezuzot là «các khung cửa» mà không nêu rõ nghĩa hẹp là các bộ phận hai bên lối vào.
    rationale: Nguồn từ chỉ các cột bên cửa; diễn đạt rõ hơn tránh đồng nhất với toàn bộ khung cửa.
  revised_text: Hãy viết những lời ấy trên các cột cửa của nhà anh em và trên các cổng của anh em.[a][b]
