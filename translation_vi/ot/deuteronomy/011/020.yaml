  yaml_path: translation/ot/deuteronomy/011/020.yaml
  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: vi
  text: Hãy viết những lời ấy trên các cột cửa của nhà anh em và trên các cổng của anh em.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các khung cửa”. Từ Hê-bơ-rơ chỉ các cột ở hai bên lối vào.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tại các cổng của anh em”. Từ Hê-bơ-rơ có thể chỉ khu vực cổng cũng như chính các cổng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Hãy viết những lời ấy
  rationale: Động từ Qal hoàn thành có liên từ, trong chuỗi mệnh lệnh giao ước, mang lực mệnh lệnh. Hậu tố số nhiều giống đực chỉ về những lời đã được nhắc đến; tiếng Việt diễn đạt rõ là “những lời ấy”.
- source_word: עַל
  choice: lên / trên
  rationale: Giới từ chỉ vị trí trên một bề mặt. “Lên” đi tự nhiên với động từ “viết”, còn “trên” phù hợp ở vế song song tiếp theo.
- source_word: מְזוּזוֹת
  choice: các cột cửa
  rationale: Danh từ chỉ các trụ hoặc cột hai bên lối cửa. “Cột cửa” là cách dịch trực tiếp, dễ hiểu, và không nhập thuật ngữ gắn với tập tục Do Thái về sau.
- source_word: בֵּיתֶךָ
  choice: nhà anh em
  rationale: בַּיִת có nghĩa thông thường là “nhà”. Hậu tố ngôi hai số ít được diễn đạt bằng “anh em” theo lối xưng hô cộng đồng trang trọng, dù về ngữ pháp Môi-se đang nói với Y-sơ-ra-ên như một đối tượng số ít tập thể.
- source_word: וּבִשְׁעָרֶיךָ
  choice: và trên các cổng của anh em
  rationale: שַׁעַר chỉ cổng, đôi khi bao gồm cả khu vực cổng. Bản dịch chính giữ nghĩa trực tiếp “cổng”; khả năng chỉ khu vực tại cổng được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng mệnh lệnh “Hãy viết” để thể hiện lực chỉ thị trong ngữ cảnh; giữ hình ảnh cụ thể “nhà” và “cổng”. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
