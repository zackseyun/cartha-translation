  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: vi
  text: Vậy[a], anh em hãy yêu mến Yahweh, Đức Chúa Trời của anh em, và tuân giữ điều Ngài giao phó, các luật lệ, phán quyết[b] và điều răn của Ngài suốt đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Và”. Liên từ Hê-bơ-rơ có thể được dịch đơn giản là “và”; ở đây được hiểu theo sắc thái kết luận từ ngữ cảnh trước.'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “các quy định của Ngài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: Vậy, anh em phải yêu kính
  rationale: Liên từ וְ ở đây có thể chỉ là “và”, nhưng trong mạch văn nó dẫn đến hệ quả từ phần trước, nên “Vậy” diễn đạt tự nhiên sắc thái suy luận. Dạng số ít giống đực hướng đến toàn thể cộng đồng Israel; “anh em” là cách gọi cộng đồng tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt cấu trúc sở hữu ngôi thứ hai số ít, đồng thời phù hợp với cách xưng hô cộng đồng trong tiếng Việt.
- source_word: וְשָׁמַרְתָּ
  choice: và luôn tuân giữ
  rationale: שׁמר trong ngữ cảnh giao ước mang nghĩa giữ, tuân thủ. “Tuân giữ” vừa tự nhiên vừa giữ sắc thái vâng phục; “luôn” phối hợp với cụm thời gian cuối câu.
- source_word: מִשְׁמַרְתּוֹ
  choice: điều Người giao phó
  rationale: מִשְׁמֶרֶת chỉ phận sự, trách nhiệm hay điều được giao phải gìn giữ. Cách dịch này sáng nghĩa hơn “sự canh giữ của Người” mà vẫn giữ ý về trách nhiệm được trao.
- source_word: חֻקֹּתָיו
  choice: các luật lệ của Người
  rationale: חֻקּוֹת là những quy định được ấn định; “luật lệ” giữ được sắc thái pháp lý và phân biệt tương đối với các danh từ kế tiếp.
- source_word: מִשְׁפָּטָיו
  choice: các phán quyết của Người
  rationale: מִשְׁפָּט có phạm vi nghĩa gồm phán quyết, quy định pháp lý và công lý. “Phán quyết” bám sát nghĩa từ vựng, còn phương án “quy định” được ghi chú.
- source_word: מִצְוֺתָיו
  choice: các điều răn của Người
  rationale: מִצְוָה là mệnh lệnh hay điều răn; “điều răn” phù hợp văn phong Kinh Thánh hiện đại và giữ sự phân biệt với các thuật ngữ pháp lý bên cạnh.
- source_word: כָּל־הַיָּמִים
  choice: suốt đời mình
  rationale: Nghĩa đen là “mọi ngày”; trong lời truyền dạy trực tiếp, “suốt đời mình” diễn đạt tự nhiên ý tuân giữ liên tục trong mọi ngày của đời sống.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” phân biệt danh riêng này với tước hiệu và tránh áp đặt cách đọc thay thế truyền thống.
- issue: Sắc thái của מִשְׁפָּטָיו
  choice: các phán quyết của Người
  alternative: các quy định của Người
  rationale: “Phán quyết” giữ nét nghĩa pháp lý và duy trì sự căng thẳng từ vựng giữa luật lệ, phán quyết và điều răn, thay vì gộp mọi thuật ngữ thành “luật” chung.
- issue: Phạm vi của mệnh lệnh ngôi thứ hai số ít
  choice: anh em ... mình
  alternative: ngươi ... ngươi
  rationale: Nguyên văn dùng ngôi thứ hai số ít để nói với Israel như một cộng đồng thống nhất. Tiếng Việt hiện đại dùng “anh em” tự nhiên hơn trong diễn ngôn cộng đồng, nhưng không biến mệnh lệnh thành lời chỉ dành cho một cá nhân.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Người” để quy chiếu về Đức Chúa Trời, tránh lối diễn đạt quá cổ. Câu giữ chuỗi bốn thuật ngữ giao ước riêng biệt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
