source:
  edition: WLC
  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: vi
  text: Còn sự nguyền rủa, nếu anh em không nghe theo[a] các điều răn của Yahweh, Đức Chúa Trời của anh em, và lìa khỏi con đường mà hôm nay tôi truyền cho anh em, để đi theo các thần khác mà anh em chưa từng biết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vâng theo.” Động từ Hê-bơ-rơ có nghĩa cơ bản là “nghe,” nhưng trong bối cảnh giao ước thường bao hàm việc vâng lời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: còn sự rủa sả
  rationale: Giữ danh từ xác định đối xứng với “phước lành” ở câu trước; “còn” diễn đạt tự nhiên quan hệ tương phản của liên từ וְ trong ngữ cảnh.
- source_word: אִם לֹא
  choice: nếu ... không
  rationale: Bảo toàn cấu trúc điều kiện nêu hoàn cảnh khiến sự rủa sả xảy đến.
- source_word: תִשְׁמְעוּ אֶל
  choice: nghe theo
  rationale: “Nghe theo” vừa giữ hình ảnh nghe, vừa truyền đạt sắc thái vâng phục thường có của שׁמע trong bối cảnh giao ước.
- source_word: מִצְוֺת
  choice: các điều răn
  rationale: Cách gọi trang trọng, quen thuộc và chính xác cho số nhiều מִצְוָה.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Phiên âm danh giao ước יהוה và diễn đạt cụm sở hữu theo tiếng Việt tự nhiên.
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: nhưng lìa khỏi con đường
  rationale: “Lìa khỏi” diễn đạt sự chệch hướng; “con đường” giữ nguyên ẩn dụ về nếp sống theo giao ước. Liên từ được dịch “nhưng” để làm rõ sự đối lập với việc nghe theo.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: tôi truyền cho anh em hôm nay
  rationale: Diễn đạt trực tiếp hành động truyền lệnh đang diễn ra trong lời nói của Môi-se, với trật tự tự nhiên trong tiếng Việt.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: mà đi theo
  rationale: Giữ hình ảnh chuyển động của động từ “đi” và liên kết tự nhiên với việc lìa khỏi con đường.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: những thần khác
  rationale: Cách dịch trực tiếp, không thêm ý “ngoại bang” vốn không được biểu thị rõ trong từ ngữ nguồn.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: là những thần anh em chưa từng biết
  rationale: Lặp lại “những thần” để đại từ quan hệ rõ nghĩa trong tiếng Việt; “chưa từng biết” thể hiện việc trước đó họ không hề biết các thần ấy.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguồn Hê-bơ-rơ dùng trực tiếp danh giao ước; “Yahweh” bảo tồn danh riêng mà không thay bằng một tước hiệu.
- issue: Có dịch שׁמע thành “vâng lời” hay không
  choice: nghe theo
  alternative: vâng lời
  rationale: “Nghe theo” giữ được nét từ vựng về sự nghe đồng thời vẫn hàm ý vâng phục trong bối cảnh giao ước; chú thích nêu rõ nghĩa khả dĩ.
- issue: Quan hệ cú pháp của לָלֶכֶת אַחֲרֵי
  choice: 'gắn với việc lìa khỏi con đường: “mà đi theo”'
  alternative: coi như một mệnh lệnh độc lập hoặc chỉ mục đích thuần túy
  rationale: Cách dịch bảo toàn việc đi theo các thần khác như sự triển khai của hành động lìa khỏi con đường được truyền dạy, không áp đặt thêm quan hệ thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến toàn thể dân; giữ ẩn dụ “con đường” và danh riêng “Yahweh”. Cụm “sẽ đến” được bổ sung ở cấp diễn đạt để mệnh đề danh từ nối tự nhiên với điều kiện trong tiếng Việt, theo quan hệ đã có từ câu trước.
