  source_fidelity: 'Bản dịch giữ đúng cấu trúc và ý chính của tiếng Hê-bơ-rơ: miền đất là đối tượng được Đức Chúa Trời quan tâm, hình ảnh «mắt» của Ngài luôn hướng trên miền đất ấy, và khoảng thời gian bao trùm cả năm. Tuy nhiên, danh יהוה nên được nhất quán chuyển là «Yahweh» theo audit trail, thay vì «Giê-hô-va».'
