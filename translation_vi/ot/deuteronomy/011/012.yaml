source:
  edition: WLC
  text: אֶ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ דֹּרֵ֣שׁ אֹתָ֑/הּ תָּמִ֗יד עֵינֵ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/הּ מֵֽ/רֵשִׁית֙ הַ/שָּׁנָ֔ה וְ/עַ֖ד אַחֲרִ֥ית שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: vi
  text: một miền đất mà Yahweh, Đức Chúa Trời của anh em, chăm nom[a]; mắt Yahweh, Đức Chúa Trời của anh em, hằng dõi theo miền đất ấy, từ đầu năm đến cuối năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Chăm nom» cũng có thể dịch là «tìm kiếm», «thăm hỏi» hoặc «để tâm đến». Động từ Hê-bơ-rơ có thể chỉ việc tìm kiếm, thăm hỏi hay chăm sóc; trong ngữ cảnh này, từ ấy diễn tả sự quan tâm chủ động của Yahweh đối với miền đất.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: xứ
  rationale: Trong ngữ cảnh Phục Truyền Luật Lệ Ký, từ này chỉ miền đất mà Israel sắp nhận, không phải toàn thể trái đất; “xứ” tự nhiên và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Chuyển âm danh riêng của Đức Chúa Trời theo hình thức đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Hậu tố ngôi thứ hai số ít giống đực hướng đến Israel như một cộng đồng; “anh em” phù hợp lời Môi-se trực tiếp nói với dân chúng trong tiếng Việt hiện đại.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: chăm nom
  rationale: Động từ דרש có thể mang nghĩa tìm kiếm, thăm hỏi hoặc quan tâm. Khi có xứ làm đối tượng, “chăm nom” diễn đạt sự quan tâm chủ động và coi sóc mà không biến câu thành một khẳng định quá cụ thể về phương thức.
- source_word: תָּמִיד
  choice: hằng
  rationale: Diễn đạt sự liên tục, thường xuyên; cách nói ngắn gọn, trang trọng và kết hợp tự nhiên với “đoái xem”.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: mắt của Giê-hô-va Đức Chúa Trời của anh em hằng đoái xem xứ ấy
  rationale: Giữ hình ảnh nhân hình “mắt” trong nguyên văn, đồng thời dùng “đoái xem” để diễn đạt tự nhiên ý ánh mắt hướng đến xứ với sự quan tâm và dõi theo.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: từ đầu năm cho đến cuối năm
  rationale: Chuyển tải rõ toàn bộ khoảng thời gian bằng một thành ngữ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Giê-hô-va
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng danh riêng giao ước; bản dịch giữ danh riêng thay vì thay bằng tước hiệu. “Giê-hô-va” là hình thức tiếng Việt quen thuộc, dễ đọc đối với độc giả phổ thông.
- issue: Hình ảnh “mắt của Giê-hô-va”
  choice: giữ nguyên hình ảnh nhân hình
  alternative: diễn ý thành “Giê-hô-va luôn quan tâm đến xứ ấy”
  rationale: Hình ảnh này là một phần nổi bật của nguyên văn và diễn tả sự chú ý, chăm sóc liên tục; không nên làm phẳng thành một mệnh đề trừu tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xứ” cho miền đất được hứa ban, “anh em” để thể hiện lời nói với Israel như một cộng đồng, và giữ nguyên hình ảnh “mắt” của nguyên văn.
