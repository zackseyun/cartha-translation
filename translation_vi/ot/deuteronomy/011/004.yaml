  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: vi
  text: và điều Ngài đã làm cho đạo quân Ai Cập, cho ngựa và chiến xa của Ai Cập, khi Ngài làm cho nước Biển Đỏ[a] tràn ngập họ lúc họ đuổi theo anh em, và Yahweh đã hủy diệt họ cho đến ngày nay,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “Biển Sậy.” Theo truyền thống thường dịch là “Biển Đỏ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: quân đội
  rationale: Trong ngữ cảnh quân sự, cùng với ngựa và chiến xa của Ai Cập, từ này chỉ lực lượng quân đội chứ không phải của cải hay sức mạnh nói chung.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: với ngựa và chiến xa của chúng
  rationale: Các hậu tố số ít quy chiếu về Ai Cập như một thực thể tập thể; tiếng Việt dùng “chúng” để chỉ lực lượng thù địch vừa được nhắc đến. “Chiến xa” diễn đạt rõ phương tiện quân sự.
- source_word: הֵצִיף
  choice: khiến ... tràn phủ
  rationale: Thể Hifil mang ý nghĩa khiến cho xảy ra; cách dịch này giữ rõ tác động gây khiến của Đức Chúa Trời và diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֵי יַם סוּף
  choice: nước Biển Đỏ[a]
  rationale: “Biển Đỏ” là tên gọi địa lý quen thuộc trong truyền thống tiếng Việt; nghĩa sát chữ “Biển Sậy” được nêu trong chú thích để bảo toàn tính minh bạch từ vựng.
- source_word: עַל־פְּנֵיהֶם
  choice: tràn phủ chúng
  rationale: Trong ngữ cảnh này, thành ngữ diễn tả nước tràn lên và bao phủ quân Ai Cập; dịch sát là “trên mặt chúng” sẽ thiếu tự nhiên và dễ gây hiểu sai.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: lúc chúng đuổi theo anh em
  rationale: Cấu trúc với בְּ và động từ nguyên mẫu chỉ hành động đồng thời. “Lúc” giữ quan hệ thời gian, còn “anh em” phù hợp với lời Môi-se nói với cộng đồng Israel.
- source_word: וַיְאַבְּדֵם
  choice: đã hủy diệt chúng
  rationale: Động từ ở thể gây khiến diễn tả việc Yahweh làm cho quân Ai Cập bị diệt; “hủy diệt” rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: cho đến ngày nay
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ kết quả kéo dài đến thời điểm phát ngôn, đồng thời không âm thầm giải thích lại mối liên hệ cú pháp với động từ “hủy diệt”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự YHWH. Phiên âm “Yahweh” bảo toàn đây là tên riêng, không thay bằng tước hiệu.
- issue: Cách dịch יַם סוּף
  choice: Biển Đỏ trong chính văn, kèm chú thích “Biển Sậy”
  alternative: Biển Sậy trong chính văn
  rationale: “Biển Đỏ” là tên truyền thống và quen thuộc với độc giả Việt, nhưng nghĩa từ nguyên liên quan đến sậy là một phương án dịch thực sự nên được ghi rõ trong chú thích.
- issue: Phạm vi của cụm עַד הַיּוֹם הַזֶּה
  choice: giữ trực tiếp là “hủy diệt chúng cho đến ngày nay”
  alternative: diễn giải thành “kết quả còn mãi cho đến ngày nay”
  rationale: Cú pháp Hê-bơ-rơ gắn cụm này với việc hủy diệt; bản dịch giữ nguyên độ căng và cách nói của nguyên văn thay vì thêm lời giải thích thần học hoặc lịch sử.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu được giữ ở dạng mệnh đề nối tiếp vì câu 11:4 là một phần của cấu trúc dài hơn trong văn cảnh. Đại từ “Ngài” chỉ Đức Chúa Trời; “anh em” chỉ cộng đồng Israel; “chúng” chỉ lực lượng Ai Cập.
