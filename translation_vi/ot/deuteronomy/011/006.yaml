source:
  edition: WLC
  text: וַ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/דָתָ֣ן וְ/לַ/אֲבִירָ֗ם בְּנֵ֣י אֱלִיאָב֮ בֶּן רְאוּבֵן֒ אֲשֶׁ֨ר פָּצְתָ֤ה הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלָעֵ֥/ם וְ/אֶת בָּתֵּי/הֶ֖ם וְ/אֶת אָהֳלֵי/הֶ֑ם וְ/אֵ֤ת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר בְּ/רַגְלֵי/הֶ֔ם בְּ/קֶ֖רֶב כָּל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: vi
  text: và điều Ngài đã làm cho Đa-than và A-bi-ram, các con của Ê-li-áp, con của Ru-bên—đất đã há miệng và nuốt chửng họ, nhà cửa[a], lều trại của họ, cùng mọi vật ở dưới chân họ[b], giữa toàn thể Y-sơ-ra-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “những ngôi nhà của họ”. Tiếng Hê-bơ-rơ có thể chỉ nhà cửa theo nghĩa vật chất hoặc, rộng hơn, hộ gia đình/gia quyến của họ.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa đen là “tất cả những gì hiện hữu ở dưới chân họ”. Cụm từ này có thể chỉ mọi người và mọi vật đi theo hoặc thuộc về họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: đã làm
  rationale: Giữ nghĩa thông dụng của động từ עשה và phù hợp với mệnh đề hồi tưởng nối tiếp văn cảnh.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: các con trai của Ê-li-áp, con trai Ru-bên
  rationale: Bảo tồn cách diễn đạt gia phả của tiếng Hê-bơ-rơ, không chuyển thành một danh xưng bộ tộc mang tính diễn giải.
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: đất đã há miệng
  rationale: Giữ nguyên hình ảnh nhân hóa sống động trong nguyên văn; “há miệng” tự nhiên hơn “mở miệng” khi đi với hành động nuốt.
- source_word: וַתִּבְלָעֵם
  choice: nuốt chửng họ
  rationale: Truyền đạt cụ thể động từ בלע; “nuốt chửng” là cách nói tự nhiên và mạnh trong tiếng Việt.
- source_word: בָּתֵּיהֶם
  choice: gia quyến
  rationale: Danh từ có nghĩa đen là “nhà”, nhưng ở đây có thể chỉ những người thuộc gia đình/hộ gia đình, nhất là khi lều trại được kể riêng.
- source_word: אָהֳלֵיהֶם
  choice: lều trại
  rationale: Cách dịch trực tiếp, rõ nghĩa và thích hợp với bối cảnh trong hoang mạc.
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: mọi thứ thuộc về họ
  rationale: Cụm từ hiếm, theo nghĩa đen liên quan đến “tất cả những gì hiện hữu/đứng ở chân họ”; bản dịch chính diễn đạt tự nhiên ý về người và vật đi theo hoặc thuộc quyền sở hữu của họ, đồng thời chú thích bảo tồn độ mơ hồ.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: ngay giữa toàn thể Y-sơ-ra-ên
  rationale: Giữ sắc thái không gian và tính công khai của biến cố; “ngay” làm nổi bật việc xảy ra giữa cộng đồng.
theological_decisions:
- issue: Phạm vi của בָּתֵּיהֶם và כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: Dùng “gia quyến” và “mọi thứ thuộc về họ”, kèm chú thích về nghĩa đen và các khả năng khác.
  alternative: Dịch hoàn toàn theo hình thức là “nhà cửa” và “mọi vật hiện hữu ở chân họ”.
  rationale: Không xác định quá mức chính xác ai hay vật gì bị bao gồm; cách dịch và chú thích giữ được sự rộng nghĩa của nguyên văn mà vẫn dễ hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ cấu trúc nối tiếp của câu trong văn cảnh, hình ảnh nhân hóa “đất há miệng”, cùng các tên riêng theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc. Các dấu chú thích [a], [b] đều có mặt trong chính văn.
