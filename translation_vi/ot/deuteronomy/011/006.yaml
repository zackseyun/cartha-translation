- from: 'và điều Ngài đã làm cho Đa-than và A-bi-ram, các con trai của Ê-li-áp, con trai Ru-bên: đất đã há miệng nuốt chửng họ, gia quyến[a], lều trại và mọi thứ thuộc về họ[b], ngay giữa toàn thể Y-sơ-ra-ên.'
  to: và điều Ngài đã làm cho Đa-than và A-bi-ram, các con của Ê-li-áp, con của Ru-bên—đất đã há miệng và nuốt chửng họ, nhà cửa[a], lều trại của họ, cùng mọi vật ở dưới chân họ[b], giữa toàn thể Y-sơ-ra-ên.
  rationale: Bản sửa giữ cấu trúc hồi tưởng, hình ảnh nhân hóa đất há miệng và trật tự liệt kê của tiếng Hê-bơ-rơ. “Nhà cửa” và “mọi vật ở dưới chân họ” tránh thu hẹp hoặc giải thích thay các cụm có nghĩa rộng/tranh luận; các chú thích bảo tồn những cách hiểu khả dĩ. Dấu chú thích được neo trực tiếp sau các từ ngữ tương ứng.
