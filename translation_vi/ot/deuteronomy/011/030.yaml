base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: vi
  text: Hai núi ấy chẳng phải ở bên kia sông Giô-đanh[a], ở phía sau con đường về phía mặt trời lặn[b], trong xứ của người Ca-na-an sống tại A-ra-ba, đối diện Ghinh-ganh, bên những cây sồi Mô-rê[c] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “qua bên kia sông Giô-đanh.” Đây là một thành ngữ địa lý Hê-bơ-rơ; nghĩa chính xác của “bên kia” tùy theo điểm quy chiếu.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “sau con đường nơi mặt trời đi vào.” Cụm này chỉ hướng mặt trời lặn, tức hướng tây.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “những cây terebinth Mô-rê.” Từ Hê-bơ-rơ có thể chỉ cây sồi hoặc một loài cây terebinth.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: Hai núi ấy chẳng phải ... sao?
  rationale: Câu hỏi tu từ mong đợi câu trả lời khẳng định. Đại từ số nhiều chỉ hai ngọn núi ở câu trước được diễn đạt rõ là “hai núi ấy” để tiếng Việt tự nhiên và tránh đại từ vô định.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ở bên kia sông Giô-đanh
  rationale: Giữ thành ngữ địa lý của tiếng Hê-bơ-rơ; “bên kia” tự nhiên trong tiếng Việt nhưng hướng quy chiếu vẫn tùy vào vị trí người nói.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: phía sau con đường dẫn về hướng mặt trời lặn
  rationale: Giữ cả yếu tố “phía sau”, “con đường” và hình ảnh mặt trời lặn, thay vì thu gọn toàn bộ thành “về phía tây” và qua đó giải quyết quá mức một cấu trúc địa lý khó xác định.
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: trong xứ của người Ca-na-an
  rationale: Danh từ dân tộc số ít trong nguyên văn mang nghĩa tập thể; tiếng Việt có thể dùng “người Ca-na-an” theo nghĩa cộng đồng.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: sống tại A-ra-ba
  rationale: Dịch phân từ bằng cách nói tự nhiên và giữ A-ra-ba như một địa danh/vùng địa lý thay vì khái quát thành “đồng bằng”.
- source_word: מוּל הַגִּלְגָּל
  choice: đối diện Ghinh-ganh
  rationale: Diễn đạt quan hệ không gian trực tiếp; địa danh được phiên âm theo cách dễ đọc trong tiếng Việt.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: bên những cây sồi Mô-rê
  rationale: “Bên” diễn đạt sự gần kề; אֵלוֹן có thể chỉ cây sồi hoặc cây thông nhựa, nên chọn cách gọi quen thuộc trong chính văn và giữ phương án thực vật học khác ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu hỏi tu từ được giữ bằng kết cấu “chẳng phải ... sao?”. Các địa danh được phiên âm nhất quán; hình ảnh cổ về mặt trời lặn được bảo tồn trong chính văn, còn ý nghĩa phương hướng được giải thích ở chú thích.
