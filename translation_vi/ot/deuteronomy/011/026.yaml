  text: רְאֵ֗ה אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּ֑וֹם בְּרָכָ֖ה וּ/קְלָלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: vi
  text: Hãy xem, hôm nay tôi đặt[a] trước mặt anh em một phước lành và một lời nguyền rủa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ cũng có thể có nghĩa là “ban” hoặc “trao”; trong cấu trúc đi với “trước mặt anh em”, “đặt” tự nhiên hơn trong tiếng Việt.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Hãy xem
  rationale: Mệnh lệnh số ít của ראה có chức năng thu hút sự chú ý của toàn thể dân chúng. “Hãy xem” tự nhiên, trang trọng vừa phải và giữ được sắc thái mệnh lệnh.
- source_word: אָנֹכִי
  choice: tôi
  rationale: Đại từ ngôi thứ nhất độc lập tạo mức độ nhấn mạnh nhất định. Tiếng Việt dùng “tôi” là đủ tự nhiên trong lời Môi-se nói; thêm “chính tôi” sẽ nhấn mạnh quá mức.
- source_word: נֹתֵן
  choice: đặt
  rationale: נתן có thể mang nghĩa “cho, trao, đặt”. Đi với לִפְנֵיכֶם (“trước mặt anh em”), “đặt trước mặt” diễn đạt tự nhiên việc đưa hai lựa chọn ra trước dân chúng.
- source_word: לִפְנֵיכֶם
  choice: trước mặt anh em
  rationale: Diễn đạt thành ngữ chỉ điều được đưa ra trước sự hiện diện và cân nhắc của những người nghe; đồng thời phản ánh hậu tố ngôi thứ hai số nhiều.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Cách diễn đạt thời gian rõ ràng, hiện đại và trực tiếp tương ứng với từ Hê-bơ-rơ.
- source_word: בְּרָכָה
  choice: một phước lành
  rationale: Danh từ số ít không xác định, đứng trong cặp đối lập với lời nguyền rủa. “Phước lành” là cách nói tự nhiên và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: וּקְלָלָה
  choice: và một lời nguyền rủa
  rationale: Giữ cấu trúc đối xứng với “một phước lành” và thể hiện rõ vế đối lập trong nguyên văn.
theological_decisions:
- issue: Bản chất của cặp phước lành và lời nguyền rủa
  choice: Trình bày đây là hai điều được đặt trước dân chúng trong bối cảnh giao ước, không thêm lời giải thích thần học.
  alternative: Diễn giải thành một nguyên tắc đạo đức phổ quát về thưởng và phạt.
  rationale: Câu này mở đầu phần trình bày về phước lành và lời nguyền rủa trong giao ước. Bản dịch cần giữ nguyên sức căng của hai khả năng mà không đưa thêm kết luận giáo lý.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi” cho lời người nói và “anh em” cho cộng đồng Y-sơ-ra-ên được xưng hô ở số nhiều; tránh lối nói cổ như “này” hoặc “các ngươi”.
