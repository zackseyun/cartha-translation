revisions:
- from: Bấy giờ, mọi dân tộc trên đất sẽ thấy rằng danh Yahweh được xưng trên anh em[a], và họ sẽ sợ anh em.
  to: Bấy giờ, mọi dân tộc trên đất sẽ thấy rằng anh em mang danh Yahweh[a], và họ sẽ sợ anh em.
  rationale: 'Sửa thành ngữ khó trong chính văn thành “anh em mang danh Yahweh” để tiếng Việt hiện đại rõ ràng và tự nhiên, đồng thời giữ ý cốt lõi của nguyên ngữ: Israel công khai được nhận diện là thuộc về Yahweh. Chú thích duy trì hình ảnh sát chữ “danh ... được gọi trên” và nêu phương án gần với bản dịch theo thành ngữ. Không thay đổi nghĩa của các vế còn lại.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:11:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng trình tự hệ quả tương lai của hai động từ hoàn thành có liên từ, phạm vi phổ quát của כָּל־עַמֵּי הָאָרֶץ, và ý nghĩa “sợ” của ירא. Tuy nhiên, “danh Yahweh được xưng trên anh em” không phải cách diễn đạt hiện đại rõ ràng cho thành ngữ נִקְרָא עָלֶיךָ; động từ “xưng” ở đây dễ bị hiểu là tuyên xưng/công bố danh, thay vì mang danh hay được gọi theo danh. Cần chuyển chính văn sang cách nói tự nhiên vẫn giữ ý được Yahweh nhận là thuộc về Ngài, đồng thời chú thích bảo lưu hình ảnh nguyên ngữ.
  naturalness: “Bấy giờ”, “mọi dân tộc trên đất”, và “họ sẽ sợ anh em” đều tự nhiên trong văn phong Kinh Thánh Việt ngữ hiện đại. “Anh em” có thể dùng để gọi tập thể Israel, dù nguyên ngữ là số ít tập thể. Cụm “mang danh Yahweh” tự nhiên và dễ hiểu hơn đáng kể so với “được xưng trên anh em.”
  terminology: Giữ “Yahweh” nhất quán với quyết định danh riêng giao ước. “Danh” có sắc thái trang trọng thích hợp. “Mang danh Yahweh” diễn đạt sự nhận diện/thuộc về trong giao ước mà không áp đặt một diễn giải giáo phái; chú thích nêu cách nói sát chữ và phương án dịch khác.
  issues:
  - severity: medium
    issue: Cụm “danh Yahweh được xưng trên anh em” không rõ và không tự nhiên trong tiếng Việt hiện đại.
    rationale: “Xưng” thường gợi hành động xưng danh hoặc tuyên xưng, trong khi Niphal của קרא với עַל trong ngữ cảnh này diễn tả việc một người/dân mang danh, được gọi theo danh, hay được danh ấy đặt trên họ. Cần một cách diễn đạt rõ nghĩa hơn trong chính văn.
  revised_text: Bấy giờ, mọi dân tộc trên đất sẽ thấy rằng anh em mang danh Yahweh[a], và họ sẽ sợ anh em.
