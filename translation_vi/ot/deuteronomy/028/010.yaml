id: DEU.28.10
reference: Deuteronomy 28:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֛י שֵׁ֥ם יְהוָ֖ה נִקְרָ֣א עָלֶ֑י/ךָ וְ/יָֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: vi
  text: Bấy giờ, mọi dân tộc trên đất sẽ thấy rằng anh em mang danh Yahweh[a], và họ sẽ sợ anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “danh Yahweh được gọi trên anh em” hoặc “anh em được gọi bằng danh Yahweh.” Thành ngữ Hê-bơ-rơ nói theo nghĩa đen rằng danh Yahweh “được gọi trên” anh em, diễn tả việc anh em được nhận diện là dân thuộc về Ngài trong giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: Bấy giờ ... sẽ thấy
  rationale: Dạng hoàn thành Qal có liên từ trong chuỗi lời chúc phước diễn tả hệ quả tương lai; “Bấy giờ” truyền đạt tự nhiên mạch kết quả.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: mọi dân tộc trên đất
  rationale: עַמִּים chỉ nhiều dân tộc; trong bối cảnh các dân bên ngoài nhận biết Israel, הָאָרֶץ có phạm vi rộng là “đất/thế gian,” và “trên đất” giữ được cách diễn đạt tự nhiên.
- source_word: כִּי
  choice: rằng
  rationale: Liên từ dẫn vào nội dung mà các dân sẽ nhận thấy.
- source_word: שֵׁם יְהוָה
  choice: danh Yahweh
  rationale: “Danh” phù hợp văn phong Kinh Thánh trang trọng và giữ cấu trúc sở hữu của tiếng Hê-bơ-rơ; danh riêng giao ước יְהוָה được phiên là Yahweh.
- source_word: נִקְרָא עָלֶיךָ
  choice: được xưng trên anh em
  rationale: Giữ hình ảnh thụ động và giới từ עַל (“trên”) của thành ngữ Hê-bơ-rơ, đồng thời để chú thích giải thích ý nghĩa thuộc về và được nhận diện.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: và họ sẽ sợ anh em
  rationale: ירא ở đây chỉ nỗi sợ trước sự ưu ái và quyền năng của Yahweh biểu lộ nơi Israel; “sợ” giữ được độ rộng nghĩa mà không giới hạn thành kinh hãi hay kính畏.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng, không thay bằng tước hiệu.
- issue: Ý nghĩa thành ngữ נִקְרָא עָלֶיךָ
  choice: danh Yahweh được xưng trên anh em
  alternative: anh em được gọi bằng danh Yahweh; danh Yahweh được công bố trên anh em
  rationale: Cách dịch chính giữ hình ảnh nguyên ngữ và sự mơ hồ chân thực của thành ngữ; chú thích nêu ý nghĩa nhận diện giao ước và thuộc về Yahweh mà không đưa phần giải nghĩa vào thẳng câu.
- issue: Sắc thái của ירא
  choice: sợ anh em
  alternative: khiếp sợ anh em; kính畏 anh em
  rationale: Ngữ cảnh nói phản ứng của các dân trước Israel được Yahweh ban phước. “Sợ” bao quát hơn, không áp đặt sắc thái thờ phượng hoặc chỉ thuần kinh hãi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” tiếp nối lời Môi-se nói với Israel như một cộng đồng; tiếng Hê-bơ-rơ dùng dạng số ít tập thể. Giữ thành ngữ “được xưng trên” trong chính văn và giải thích bằng chú thích để bảo tồn hình ảnh nguyên ngữ.
