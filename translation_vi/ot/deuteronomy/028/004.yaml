base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: vi
  text: Con cái do ngươi sinh ra, hoa lợi của đất ngươi và sản vật của gia súc ngươi sẽ được phước—tức là con đẻ của đàn bò và con non của bầy chiên dê ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch hai cụm cuối là “sự gia tăng của đàn bò và con cái của bầy chiên dê.” Các cách nói Hê-bơ-rơ שְׁגַר אֲלָפֶיךָ và עַשְׁתְּרֹת צֹאנֶךָ là những thuật ngữ chăn nuôi truyền thống chỉ sự sinh sản và gia tăng của đàn vật nuôi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Phước cho
  rationale: Tính từ vị ngữ trong công thức chúc phước. Cách dịch này tự nhiên, trang trọng trong tiếng Việt và để văn cảnh giao ước cho thấy ý nghĩa kết quả/tương lai mà không thêm một thì không được biểu thị rõ trong tiếng Hê-bơ-rơ.
- source_word: פְּרִי
  choice: con cái / hoa lợi / sản vật
  rationale: Danh từ được lặp ba lần để liên kết ba lĩnh vực sinh sản, đất đai và vật nuôi. Tiếng Việt không thể dùng tự nhiên một từ tương đương với “trái” cho cả ba, nên dùng ba từ theo từng ngữ cảnh nhưng giữ cấu trúc song song.
- source_word: בִטְנְךָ
  choice: lòng dạ anh em
  rationale: Trong ngữ cảnh này, בטן chỉ nơi con cái được cưu mang. “Lòng dạ” giữ hình ảnh cụ thể mà vẫn tự nhiên hơn cách nói thuần sinh học; cụm “do ... sinh ra” làm rõ ý chỉ con cái.
- source_word: אַדְמָתְךָ
  choice: đất đai anh em
  rationale: Chỉ đất canh tác sinh hoa lợi, không nhất thiết mang nghĩa lãnh thổ rộng hơn.
- source_word: בְהֶמְתֶּךָ
  choice: gia súc anh em
  rationale: Từ khái quát chỉ các loài vật nuôi; phần tiếp theo nêu cụ thể đàn bò và bầy chiên dê.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: con sinh ra từ đàn bò
  rationale: Cụm từ truyền thống chỉ sản lượng sinh sản của bò. Cách dịch này truyền đạt rõ nghĩa sinh sản mà không thu hẹp thành một loại hay giới tính cụ thể.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: con non trong bầy chiên dê của anh em
  rationale: Cụm từ chăn nuôi chỉ con non hoặc sự gia tăng của đàn vật nuôi nhỏ; צאן có thể bao gồm cả chiên lẫn dê.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi hai số ít mang tính đại diện, vì lời giao ước hướng đến từng thành viên trong cộng đồng Israel; các tính từ sở hữu được lặp để phản ánh nhịp song song của nguyên văn.
