  rationale: Bản sửa tránh thêm ý ‘phán’ vào ‘tiếng’, làm rõ lượng từ ‘tất cả những’, và dùng “đuổi kịp” để giữ hình ảnh các phước lành theo đuổi rồi bắt kịp người nhận. Cách xưng hô tập thể “anh em” vẫn phù hợp với lời nói hướng đến Israel, dù hậu tố Hê-bơ-rơ ở số ít.
