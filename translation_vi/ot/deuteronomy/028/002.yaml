  text: וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/בְּרָכ֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֻ֑/ךָ כִּ֣י תִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: vi
  text: Tất cả những phước lành này sẽ đến trên anh em và đuổi kịp anh em, nếu anh em nghe theo tiếng của Yahweh, Đức Chúa Trời của anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ được dịch là “nghe theo tiếng của” theo nghĩa đen gần với “nghe tiếng của” và thường hàm ý sự đáp ứng bằng vâng phục. Từ được dịch là “nếu” cũng có thể được hiểu là “vì” hoặc “khi,” tùy cách phân tích ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: sẽ đến trên anh em
  rationale: Dạng động từ trong ngữ cảnh lời chúc phước diễn tả hệ quả tương lai; עַל được giữ bằng “trên,” bảo tồn hình ảnh các phước lành đến trên người nghe.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: mọi phước lành này
  rationale: Cách diễn đạt tự nhiên, trực tiếp cho toàn bộ cụm danh từ, đồng thời giữ sắc thái giao ước của “phước lành.”
- source_word: וְהִשִּׂיגֻךָ
  choice: và bắt kịp anh em
  rationale: Động từ Hiphil của נשׂג gợi hình ảnh đuổi theo rồi tới được đối tượng. “Bắt kịp” giữ hình ảnh sinh động ấy mà không hàm ý tiêu cực như “ập xuống.”
- source_word: כִּי
  choice: nếu
  rationale: Trong mạch điều kiện của các lời chúc phước, “nếu” diễn đạt hợp lý quan hệ giữa việc nghe theo và phước lành, dù כִּי cũng có thể mang nghĩa “vì” hoặc “khi” tùy cách hiểu cú pháp.
- source_word: תִשְׁמַע בְּקוֹל
  choice: nghe theo tiếng phán của
  rationale: Thành ngữ Hê-bơ-rơ nói đến việc lắng nghe dẫn đến đáp ứng vâng phục. “Nghe theo” vừa tự nhiên trong tiếng Việt, vừa giữ được yếu tố nghe và ý nghĩa vâng lời; “tiếng phán” phù hợp khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng trong bản Hê-bơ-rơ thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở hữu giao ước. Đại từ số ít giống đực trong nguyên văn được diễn đạt bằng “anh em,” cách xưng hô tập thể tự nhiên và trang trọng với dân Israel trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn đây là danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của שׁמע בְּקוֹל trong bối cảnh giao ước
  choice: nghe theo tiếng phán của
  alternative: vâng lời; nghe tiếng của
  rationale: “Nghe theo” truyền đạt sự lắng nghe có đáp ứng vâng phục, nhưng không xóa hình ảnh “nghe tiếng” trong nguyên văn.
- issue: Quan hệ do כִּי biểu thị
  choice: nếu
  alternative: vì; khi
  rationale: Ngữ cảnh lời chúc phước có điều kiện hỗ trợ “nếu.” Tuy nhiên, tính đa nghĩa của tiểu từ được ghi nhận trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” diễn đạt lời nói với Israel như một cộng đồng dù các hậu tố Hê-bơ-rơ ở số ít. Hình ảnh phước lành “bắt kịp” được giữ để phản ánh phép nhân hóa sinh động của nguyên văn.
