  text: Blessed shall be your basket and your kneading bowl[a].
translation:
  language: vi
  text: Giỏ và chậu nhồi bột của anh em sẽ được phước.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “máng nhồi bột.” Từ Hê-bơ-rơ này chỉ một vật đựng dùng khi chuẩn bị bột nhào.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Phước cho
  rationale: Phân từ bị động của ברך được dùng làm vị ngữ trong công thức chúc phước. Trong chuỗi phước lành giao ước, “Phước cho” diễn đạt tự nhiên sắc thái tuyên bố mà không biến câu thành lời cầu chúc.
- source_word: טַנְאֲךָ
  choice: giỏ của anh em
  rationale: טֶנֶא chỉ một chiếc giỏ, thường dùng để đựng hoặc chuyên chở nông sản. “Giỏ” vừa tự nhiên vừa không thêm mức độ chuyên biệt mà nguyên văn không nói rõ.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: và thố nhồi bột của anh em
  rationale: מִשְׁאֶרֶת là vật đựng dùng trong việc chuẩn bị và nhồi bột. “Thố nhồi bột” rõ nghĩa trong tiếng Việt hiện đại và giữ được hình ảnh vật dụng gia đình.
