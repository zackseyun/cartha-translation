  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: vi
  text: 'Yahweh sẽ khiến anh em được dư dật về phúc lành[a]: con cái anh em[b], con cái của gia súc anh em, và hoa lợi của đất đai anh em[c], trên miền đất mà Yahweh đã thề với tổ phụ anh em là sẽ ban cho anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “để được điều tốt lành” hoặc “trong sự thịnh vượng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “hoa trái của dạ con anh em,” một thành ngữ chỉ con cái hoặc dòng dõi.'
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “sản vật của đất anh em” hoặc “hoa màu từ ruộng đất anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: sẽ làm cho anh em được dư dật
  rationale: 'Dạng Hiphil của יתר mang ý gây khiến: Yahweh khiến dân có sự dư dật hay hơn mức đủ. Cách dịch này giữ được cả sắc thái gây khiến lẫn ý phong phú.'
- source_word: לְטוֹבָה
  choice: về mọi điều tốt lành
  rationale: Cụm này có nghĩa sát là “cho điều tốt/lành”; trong ngữ cảnh lời chúc phước, nó chỉ sự dư dật đem lại phúc lợi. Cách dịch không thu hẹp nghĩa vào riêng sự thịnh vượng vật chất.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước thay vì thay thế bằng một tước hiệu.
- source_word: בִּפְרִי בִטְנְךָ
  choice: hoa trái của lòng anh em
  rationale: Giữ hình ảnh “hoa trái” và sự lặp lại có chủ ý, đồng thời “lòng” là cách diễn đạt tiếng Việt tự nhiên cho בטן trong thành ngữ chỉ con cái do mình sinh ra.
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: con cái của gia súc anh em
  rationale: Ở đây “hoa trái” của gia súc có nghĩa là đàn con sinh ra. Dịch theo nghĩa giúp câu tiếng Việt tự nhiên, trong khi hai vế kia vẫn giữ hình ảnh nông nghiệp.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: hoa lợi của đất đai anh em
  rationale: אֲדָמָה chỉ đất canh tác hay thổ nhưỡng; “hoa lợi của đất đai” truyền đạt tự nhiên sản vật thu được từ đất.
- source_word: עַל הָאֲדָמָה
  choice: trên miền đất
  rationale: Trong cụm này אֲדָמָה chỉ miền đất hứa, là nơi các phước lành diễn ra; “trên miền đất” giữ gần giới từ עַל.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: mà Yahweh đã thề với tổ phụ anh em rằng Ngài sẽ ban cho anh em
  rationale: 'Giữ sự phân biệt trong cú pháp Hê-bơ-rơ: lời thề được lập với tổ phụ, còn miền đất được ban cho thế hệ đang được nói đến.'
theological_decisions:
- issue: Cách chuyển dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh riêng; phiên âm “Yahweh” bảo tồn chức năng của danh ấy mà không thay bằng tước hiệu.
- issue: Có nên giải nghĩa בִּפְרִי בִטְנְךָ thành “con cái” ngay trong chính văn hay không
  choice: Giữ thành ngữ “hoa trái của lòng anh em” và chú thích nghĩa
  alternative: con cái / dòng dõi của anh em
  rationale: Cách chọn giữ hình ảnh và mối liên kết giữa khả năng sinh sản của người, vật nuôi và đất đai, nhưng chú thích giúp độc giả hiện đại hiểu rõ.
- issue: Phạm vi nghĩa của לְטוֹבָה
  choice: về mọi điều tốt lành
  alternative: trong sự thịnh vượng / cho phúc lợi
  rationale: Cụm Hê-bơ-rơ có độ rộng nghĩa “cho điều tốt, cho phúc lợi”; không nên mặc nhiên giới hạn nó vào sự giàu có vật chất.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ số ít giống đực trong tiếng Hê-bơ-rơ đại diện cho toàn dân giao ước được chuyển thành “anh em” theo lối xưng hô cộng đồng tự nhiên trong tiếng Việt; “Ngài” được thêm ở mệnh đề cuối để làm rõ chủ ngữ mà không đổi nghĩa.
