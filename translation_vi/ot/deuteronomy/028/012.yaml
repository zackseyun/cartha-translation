revisions:
- from: Đức Giê-hô-va sẽ mở cho anh em kho báu tốt lành của Ngài[a], tức là trời, để ban mưa xuống đất của anh em đúng mùa và ban phước cho mọi công việc tay anh em làm. Anh em sẽ cho nhiều dân tộc vay, còn anh em sẽ không phải vay.
  to: Yahweh sẽ mở cho anh em kho chứa tốt lành của Ngài[a], tức là bầu trời, để ban mưa cho đất anh em đúng mùa và ban phước cho mọi việc tay anh em làm. Anh em sẽ cho nhiều dân tộc vay, còn anh em sẽ không vay.
  rationale: Đổi cách chuyển יהוה thành «Yahweh» theo audit trail và bỏ tước hiệu không có trong nguồn. Đổi «kho báu» thành «kho chứa» để phản ánh sát hơn ẩn dụ bầu trời là nơi chứa mưa, đồng thời giữ phương án «kho báu» trong chú thích. Điều chỉnh nhẹ cụm mưa và lao động để tiếng Việt hiện đại tự nhiên, không thay đổi ý nghĩa hay tính mơ hồ của bản nguồn.
  reviewer_model: gpt-5.6-terra
