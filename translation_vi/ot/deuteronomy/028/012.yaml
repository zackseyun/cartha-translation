  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: vi
  text: Yahweh sẽ mở cho anh em kho chứa tốt lành của Ngài[a], tức là bầu trời, để ban mưa cho đất anh em đúng mùa và ban phước cho mọi việc tay anh em làm. Anh em sẽ cho nhiều dân tộc vay, còn anh em sẽ không vay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kho báu tốt lành của Ngài”. Từ Hê-bơ-rơ có thể chỉ kho chứa hoặc kho báu; trong văn cảnh mưa và mùa màng, hình ảnh kho chứa phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh giao ước quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: יִפְתַּח
  choice: sẽ mở
  rationale: Thể Qal chưa hoàn thành mang nghĩa tương lai trong văn cảnh lời chúc phước; giữ nguyên hình ảnh cụ thể của động từ.
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: kho báu tốt lành của Ngài
  rationale: אוֹצָר có thể chỉ kho chứa hoặc kho báu; cách dịch này giữ cả ý nơi tích trữ lẫn sắc thái quý giá, đồng thời chuyển הַטּוֹב tự nhiên là 'tốt lành'.
- source_word: הַשָּׁמַיִם
  choice: tức là trời
  rationale: Cụm đồng vị xác định kho của Đức Giê-hô-va là trời; số nhiều hình thái của tiếng Hê-bơ-rơ không nhất thiết phải thể hiện bằng 'các tầng trời' trong tiếng Việt.
- source_word: לָתֵת מְטַר אַרְצְךָ
  choice: để ban mưa xuống đất của anh em
  rationale: Giữ quan hệ mục đích của לָתֵת, nhưng diễn đạt quan hệ giữa mưa và đất theo tiếng Việt tự nhiên.
- source_word: בְּעִתּוֹ
  choice: đúng mùa
  rationale: Hậu tố nhiều khả năng quy chiếu đến mưa; 'đúng mùa' diễn đạt rõ thời điểm thích hợp trong chu kỳ nông nghiệp.
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: mọi công việc tay anh em làm
  rationale: Giữ hình ảnh 'tay' của nguyên văn trong một cấu trúc tự nhiên, dễ hiểu hơn cách dịch sát cứng 'mọi công việc của tay anh em'.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: anh em sẽ cho nhiều dân tộc vay
  rationale: Dạng Hiphil của לוה ở đây có nghĩa là cho vay; גּוֹיִם được dịch là 'dân tộc' trong bối cảnh quốc gia giao ước.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: còn anh em sẽ không phải vay
  rationale: Dạng Qal mang nghĩa vay; 'còn' nêu bật sự tương phản, và 'không phải vay' tự nhiên trong tiếng Việt mà không biến câu thành mệnh lệnh.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; ĐỨC CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng giao ước. Bản dịch giữ một dạng danh riêng đã quen thuộc trong tiếng Việt, không thay bằng tước hiệu; không thêm diễn giải hệ phái.
- issue: Đối tượng số ít tập thể trong các hậu tố ngôi hai
  choice: anh em
  alternative: ngươi
  rationale: Nguyên văn dùng số ít để nói với Israel như một cộng đồng. 'Anh em' truyền đạt đối tượng tập thể bằng tiếng Việt hiện đại và trang trọng vừa phải, dù không biểu thị trực tiếp số ít ngữ pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ ẩn dụ Đức Giê-hô-va mở kho trên trời, đồng thời tránh lối diễn đạt quá cổ như 'ngươi' hoặc quá sát chữ gây gượng. Đại từ 'anh em' hiểu Israel như một cộng đồng.
