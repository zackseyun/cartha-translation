base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/006.yaml
  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: vi
  text: Ngươi sẽ được ban phước khi đi vào[a], và ngươi sẽ được ban phước khi đi ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dùng đại từ ngôi thứ hai số ít để ngỏ lời với Israel như một dân. Cũng có thể dịch sát hơn: “trong lúc ngươi đi vào … trong lúc ngươi đi ra”; cặp diễn đạt này có lẽ bao quát toàn bộ đời sống và hoạt động.'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: sẽ được ban phước
  rationale: Phân từ bị động của ברך được dùng làm vị ngữ trong lời chúc phước giao ước. Từ “sẽ” phù hợp với ngữ cảnh công bố những hệ quả sắp đến, còn “được ban phước” truyền đạt rõ thể bị động bằng tiếng Việt hiện đại.
- source_word: אַתָּה
  choice: bạn
  rationale: Đại từ ngôi hai giống đực số ít, dùng để gọi Israel như một cộng đồng giao ước bằng hình thức số ít. “Bạn” giữ được số ít và là cách diễn đạt tự nhiên, dễ hiểu.
- source_word: בְּבֹאֶךָ
  choice: khi đi vào
  rationale: Giới từ בְּ đi với động từ nguyên mẫu cấu trúc của בוא và hậu tố ngôi hai số ít, chỉ hoàn cảnh lúc đi vào. Cách dịch này giữ hình ảnh chuyển động cụ thể và kết cấu song song.
- source_word: וּבָרוּךְ
  choice: và bạn sẽ được ban phước
  rationale: Liên từ đi cùng công thức chúc phước được lặp lại. Dịch trọn mệnh đề lần nữa bảo toàn nhịp điệu và cấu trúc song song của tiếng Hê-bơ-rơ.
- source_word: בְּצֵאתֶךָ
  choice: khi đi ra
  rationale: Giới từ בְּ đi với động từ nguyên mẫu cấu trúc của יצא và hậu tố ngôi hai số ít. Cặp “đi vào/đi ra” vừa giữ nghĩa đen vừa có thể bao quát toàn bộ sinh hoạt và hoạt động thường ngày.
theological_decisions:
- issue: Israel được gọi bằng đại từ số ít mang tính đại diện
  choice: Giữ đại từ số ít “bạn”, không chuyển thành số nhiều hay diễn giải thành “Israel”.
  alternative: “Anh em sẽ được ban phước...” hoặc “Israel sẽ được ban phước...”
  rationale: Bản Hê-bơ-rơ dùng ngôi hai giống đực số ít theo lối giao ước để nói với Israel như một dân thống nhất. Giữ số ít bảo toàn hình thức nguồn mà không thêm phần diễn giải vào chính văn.
- issue: Phạm vi của cặp “đi vào/đi ra”
  choice: Giữ hình ảnh cụ thể trong chính văn và nêu khả năng đây là lối nói bao quát trong chú thích.
  alternative: Diễn giải trong chính văn thành “trong mọi sinh hoạt của bạn”.
  rationale: Cặp từ có thể là phép phân đôi chỉ toàn bộ đời sống và hoạt động, nhưng nghĩa chuyển động cụ thể vẫn hiện diện. Chú thích bảo tồn cả hai tầng nghĩa thay vì âm thầm quyết định một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Kết cấu lặp “bạn sẽ được ban phước” giữ nhịp song song của lời chúc phước; “đi vào/đi ra” gần với nguyên văn hơn “đến/đi” và tránh diễn giải quá mức.
