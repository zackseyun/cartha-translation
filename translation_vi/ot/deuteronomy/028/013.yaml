  terminology: “Đức Giê-hô-va,” “Đức Chúa Trời,” “điều răn,” “tuân giữ,” và “thực hành” nhất quán, quen thuộc và thích hợp trong văn cảnh giao ước. Các ẩn dụ “đầu/đuôi” và “trên/dưới” được giữ nguyên, không diễn giải quá mức.
