source:
  edition: WLC
  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: vi
  text: Đức Giê-hô-va sẽ đặt anh em làm đầu chứ không làm đuôi; anh em sẽ chỉ ở trên chứ không ở dưới, nếu anh em nghe theo các điều răn của Đức Giê-hô-va, Đức Chúa Trời của anh em, mà hôm nay tôi truyền cho anh em phải tuân giữ và thực hành.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: Đức Giê-hô-va sẽ đặt anh em làm
  rationale: Động từ נתן có nghĩa cơ bản là “ban, đặt,” nhưng với bổ ngữ vị ngữ “đầu... đuôi,” câu này diễn tả việc Đức Giê-hô-va đặt dân Y-sơ-ra-ên vào một địa vị. “Đặt... làm” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái gây khiến.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: làm đầu chứ không làm đuôi
  rationale: Giữ nguyên cặp ẩn dụ đối lập “đầu/đuôi,” biểu thị địa vị dẫn đầu thay vì thấp kém hoặc đi sau.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: anh em sẽ chỉ ở trên chứ không ở dưới
  rationale: “Chỉ” chuyển tải tính độc quyền của רַק; “ở trên/ở dưới” bảo tồn hình ảnh không gian dùng để nói về địa vị.
- source_word: כִּי תִשְׁמַע אֶל
  choice: nếu anh em nghe theo
  rationale: כִּי mở đầu điều kiện trong văn cảnh các phước lành giao ước. “Nghe theo” giữ được hình ảnh nghe của שׁמע, đồng thời diễn đạt hàm ý vâng phục tự nhiên trong tiếng Việt.
- source_word: מִצְוֺת
  choice: các điều răn
  rationale: מִצְוֺת chỉ những mệnh lệnh thuộc giao ước; “các điều răn” là cách dịch rõ ràng, trang trọng và quen thuộc.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho danh יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt trực tiếp danh xưng giao ước “Đức Chúa Trời của ngươi”; “anh em” được dùng theo nghĩa tập thể vì người nghe là dân Y-sơ-ra-ên.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Giữ tính tức thời của lời Môi-se đang truyền và bảo tồn từ “hôm nay,” một yếu tố nổi bật trong Phục Truyền Luật Lệ Ký.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: phải tuân giữ và thực hành
  rationale: 'Giữ riêng cả hai động từ: שׁמר nhấn mạnh việc cẩn thận tuân giữ, còn עשׂה nhấn mạnh việc thực hiện. “Phải” diễn đạt quan hệ mục đích/nghĩa vụ tự nhiên trong câu tiếng Việt.'
theological_decisions:
- issue: Ý nghĩa của כִּי trong mạch văn phước lành giao ước
  choice: nếu anh em nghe theo
  alternative: vì anh em nghe theo
  rationale: Trong văn cảnh này, כִּי nêu điều kiện gắn với lời hứa được tôn cao. “Nếu” thể hiện rõ logic giao ước mà không thêm ý rằng sự vâng phục tự nó tạo công trạng.
- issue: Sắc thái của שׁמע אֶל
  choice: nghe theo
  alternative: vâng giữ
  rationale: “Nghe theo” bảo tồn yếu tố “nghe” trong nguyên ngữ đồng thời truyền đạt sự nghe dẫn đến vâng phục; các động từ “tuân giữ và thực hành” sau đó làm rõ thêm sắc thái này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số ít giống đực trong tiếng Hê-bơ-rơ đại diện cho toàn thể Y-sơ-ra-ên được chuyển thành “anh em” để tự nhiên trong diễn ngôn tiếng Việt. Cấu trúc song song “đầu/đuôi” và “trên/dưới” được giữ nguyên.
