base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: vi
  text: Yahweh sẽ khiến những kẻ thù nổi lên chống lại ngươi bị đánh bại trước mặt ngươi.[a] Chúng sẽ tiến ra chống lại ngươi theo một đường, và chạy trốn trước mặt ngươi theo bảy đường.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Yahweh sẽ phó những kẻ thù nổi lên chống lại ngươi cho ngươi, trong tình trạng bị đánh bại trước mặt ngươi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn đối chiếu “theo một đường” với “theo bảy đường”: quân thù tiến đến tập trung nhưng tháo chạy tán loạn theo nhiều hướng.'
    reason: cultural_note
lexical_decisions:
- source_word: יִתֵּן
  choice: sẽ khiến ... bị đánh bại
  rationale: Động từ נתן có nghĩa cơ bản là “ban, trao, phó”; trong ngữ cảnh quân sự, kết hợp với נִגָּפִים, câu nói rằng Đức Giê-hô-va làm cho kẻ thù rơi vào tình trạng thất bại. Cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ quan hệ nguyên nhân-kết quả của nguyên văn.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế danh ấy bằng một tước hiệu.
- source_word: אֹיְבֶיךָ
  choice: những kẻ thù ... anh em
  rationale: Danh từ số nhiều với hậu tố ngôi thứ hai số ít; “kẻ thù” là tương đương trực tiếp, còn “anh em” diễn đạt người nghe tập thể được xưng hô bằng hình thức số ít.
- source_word: הַקָּמִים עָלֶיךָ
  choice: nổi lên chống lại anh em
  rationale: Giữ hình ảnh và sắc thái thù địch của קום với על, không thu hẹp nghĩa thành một hành động quân sự cụ thể.
- source_word: נִגָּפִים לְפָנֶיךָ
  choice: bị đánh bại trước mặt anh em
  rationale: Phân từ Niphal diễn tả kẻ thù bị đánh tan hoặc thất bại; “bị đánh bại” rõ nghĩa và phù hợp ngữ cảnh quân sự. “Trước mặt” bảo lưu thành ngữ לְפָנֶיךָ.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: theo một đường
  rationale: Giữ danh từ “đường” và thế đối xứng với “bảy đường”, đồng thời gợi hình ảnh quân địch tiến đến một cách tập trung.
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: tiến ra chống lại anh em
  rationale: יצא với אל trong ngữ cảnh chiến trận có nghĩa đi hoặc tiến ra đối đầu; “chống lại” làm rõ hướng thù địch vốn có trong ngữ cảnh.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: nhưng ... theo bảy đường
  rationale: “Nhưng” thể hiện sự tương phản mạnh giữa lúc tiến công và lúc tháo chạy. Giữ con số bảy và hình ảnh nhiều đường thay vì giải nghĩa ngay trong câu.
- source_word: יָנוּסוּ לְפָנֶיךָ
  choice: chạy trốn khỏi anh em
  rationale: נוס là động từ thông dụng chỉ sự chạy trốn. Trong vế này, לְפָנֶיךָ diễn tả việc tháo chạy trước sức của Israel; “khỏi anh em” tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc và trang trọng.
- issue: Chủ thể gây nên chiến thắng
  choice: Đức Giê-hô-va sẽ khiến ... bị đánh bại
  alternative: Đức Giê-hô-va sẽ phó ... đã bị đánh bại vào tay anh em
  rationale: Giữ Đức Giê-hô-va là tác nhân ban chiến thắng, nhưng không thêm cụm “vào tay” vốn không có trong câu Hebrew; cách dịch cũng không quy định phương thức cụ thể của sự đánh bại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “anh em” được dùng cho ngôi thứ hai số ít mang nghĩa tập thể, chỉ Israel. Cấu trúc “một đường/bảy đường” được giữ trong chính văn để bảo tồn hình ảnh và phép đối xứng của tiếng Hebrew; chú thích giải thích hàm ý mà không thay thế hình ảnh.
