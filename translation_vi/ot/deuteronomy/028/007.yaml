revisions:
- from: Đức Giê-hô-va sẽ khiến những kẻ thù nổi lên chống lại anh em bị đánh bại trước mặt anh em.[a] Chúng sẽ theo một đường tiến ra chống lại anh em, nhưng sẽ theo bảy đường chạy trốn khỏi anh em.[b]
  to: Yahweh sẽ khiến những kẻ thù nổi lên chống lại ngươi bị đánh bại trước mặt ngươi.[a] Chúng sẽ tiến ra chống lại ngươi theo một đường, và chạy trốn trước mặt ngươi theo bảy đường.[b]
  rationale: Sửa danh riêng thần linh theo quyết định của nguồn; khôi phục nhất quán ngôi thứ hai số ít và sự lặp lại «trước mặt ngươi»; đồng thời giữ hình ảnh quân sự, con số, và cấu trúc song hành của tiếng Hebrew. Chú thích a được điều chỉnh đồng bộ với danh «Yahweh» và đại từ «ngươi».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:11:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý chính về việc Yahweh khiến quân thù thất bại và về thế đối xứng «một đường/bảy đường». Tuy nhiên, danh יהוה nên được nhất quán phiên âm là «Yahweh» theo quyết định nguồn. Đại từ «anh em» làm chuyển ngôi thứ hai số ít của bản Hebrew thành số nhiều; «ngươi» giữ được ngôi xưng hô tập thể số ít của diễn từ Phục truyền. «Trước mặt ngươi» cũng nên được giữ ở cả hai lần để phản ánh sự lặp lại שלפניך trong nguyên văn.
  naturalness: Bản sửa dùng văn phong Kinh Thánh trang trọng nhưng vẫn rõ ràng trong tiếng Việt hiện đại. «Tiến ra ... theo một đường» và «chạy trốn trước mặt ngươi theo bảy đường» bảo tồn nhịp song hành Hebrew; «và» không áp đặt quan hệ đối nghịch mạnh hơn liên từ וְ.
  terminology: Đổi «Đức Giê-hô-va» thành «Yahweh» để phù hợp chính sách phiên âm danh riêng trong hồ sơ nguồn. «Bị đánh bại» là cách diễn đạt tự nhiên cho נִגָּפִים. Không cần thêm «vào tay» vì cụm này không có trong câu.
  issues:
  - severity: medium
    issue: Danh יהוה được dịch là «Đức Giê-hô-va» thay vì «Yahweh».
    rationale: Hồ sơ nguồn quy định dùng «Yahweh» cho Tetragrammaton, không thay bằng dạng phiên âm/truyền thống khác hay tước hiệu.
  - severity: medium
    issue: «Anh em» không giữ ngôi thứ hai số ít của hậu tố Hebrew.
    rationale: Câu Hebrew nhất quán dùng hậu tố 2ms. Trong diễn từ giao ước hướng đến Israel như một tập thể, «ngươi» phản ánh chính xác hình thức này mà không làm thay đổi đối tượng quy chiếu.
  - severity: low
    issue: Lần cuối לְפָנֶיךָ được dịch «khỏi anh em».
    rationale: Cách này tự nhiên nhưng làm mất sự lặp lại có chủ ý của «trước mặt ngươi» trong nguyên văn; nên bảo tồn phép lặp.
  revised_text: Yahweh sẽ khiến những kẻ thù nổi lên chống lại ngươi bị đánh bại trước mặt ngươi.[a] Chúng sẽ tiến ra chống lại ngươi theo một đường, và chạy trốn trước mặt ngươi theo bảy đường.[b]
