base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: vi
  text: Yahweh sẽ truyền phước lành đến với anh em trong các kho chứa[a] và trong mọi việc tay anh em làm[b]. Ngài sẽ ban phước cho anh em trong xứ mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các kho lương” hoặc “các vựa”.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ sát nghĩa là “trong mọi sự đưa tay anh em ra”, một thành ngữ chỉ mọi công việc hoặc việc anh em tiến hành.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “ban cho anh em” hoặc “sẽ ban cho anh em”. Phân từ Hê-bơ-rơ ở đây có thể được hiểu theo nhiều cách về thời gian.
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו
  choice: sẽ truyền
  rationale: Dạng Piel của צוה thường có nghĩa là “truyền lệnh”. Trong ngữ cảnh này, Yahweh truyền cho phước lành đến với dân; “sẽ truyền” giữ được hình ảnh mạnh của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: אִתְּךָ אֶת־הַבְּרָכָה
  choice: phước lành đến với anh em
  rationale: Cụm từ diễn tả phước lành được truyền đến và ở trên người nhận. Cách diễn đạt này tự nhiên trong tiếng Việt và không làm yếu đi ý niệm chính Đức Chúa Trời ra lệnh cho phước lành.
- source_word: בַּאֲסָמֶיךָ
  choice: trong các kho chứa
  rationale: אָסָם chỉ nơi cất trữ, đặc biệt là kho lương hoặc vựa. “Kho chứa” đủ rộng để phản ánh nghĩa từ vựng mà không thu hẹp quá mức.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: trong mọi công việc tay anh em làm
  rationale: Nguyên văn nói đến mọi sự “đưa tay ra” làm, một thành ngữ chỉ công việc hoặc việc tiến hành. Bản dịch giữ hình ảnh bàn tay nhưng vẫn dễ hiểu.
- source_word: וּבֵרַכְךָ
  choice: Ngài sẽ ban phước cho anh em
  rationale: Động từ hoàn thành nối bằng waw tiếp tục ý tương lai của động từ trước. Đại từ “Ngài” làm rõ Yahweh vẫn là chủ thể.
- source_word: בָּאָרֶץ
  choice: trong miền đất
  rationale: “Miền đất” giữ âm hưởng giao ước của הָאָרֶץ trong Phục Truyền Luật Lệ Ký và tránh sắc thái chính trị hiện đại của “quốc gia”.
- source_word: נֹתֵן לָךְ
  choice: đang ban cho anh em
  rationale: Phân từ נֹתֵן có thể diễn tả hành động đang diễn ra hoặc sắp thành hiện thực. “Đang ban” bảo tồn sắc thái tiến triển và tính cận kề của món quà.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng danh riêng giúp người đọc nhận ra chính Đức Chúa Trời của giao ước là chủ thể, không thay danh ấy bằng một tước hiệu.
- issue: Sắc thái giao ước của הָאָרֶץ
  choice: miền đất
  alternative: đất nước; xứ
  rationale: “Miền đất” giữ được ý về đất Yahweh ban cho Israel mà không thêm từ “hứa” vốn không xuất hiện trong câu.
- issue: Số ít tập thể của đại từ ngôi thứ hai
  choice: anh em
  alternative: ngươi; bạn
  rationale: Tiếng Hê-bơ-rơ dùng số ít để nói với Israel như một cộng đồng giao ước. “Anh em” là lối xưng hô tập thể tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại; tránh “ngươi” đã cổ và dễ mang sắc thái miệt thị.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để nói với Israel như một cộng đồng, giữ hình ảnh “tay” của nguyên văn, và dùng “ban phước” theo cách diễn đạt Kinh Thánh quen thuộc mà không thêm diễn giải giáo phái.
