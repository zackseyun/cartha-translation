    rationale: Cấu trúc Hê-bơ-rơ nhấn mạnh việc lắng nghe-vâng phục, không chỉ xác nhận rằng hành động nghe là có thật. “Hết lòng vâng theo tiếng” chuyển tải tự nhiên hơn chức năng thành ngữ mà vẫn giữ “tiếng.”
  - severity: medium
