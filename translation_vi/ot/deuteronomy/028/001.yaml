revisions:
- from: Nếu anh em thật sự nghe theo tiếng Giê-hô-va Đức Chúa Trời của anh em[a], cẩn thận làm theo mọi điều răn của Ngài mà hôm nay tôi truyền cho anh em, thì Giê-hô-va Đức Chúa Trời của anh em sẽ đặt anh em lên cao hơn mọi dân tộc trên đất.
  to: Nếu anh em hết lòng vâng theo tiếng Yahweh, Đức Chúa Trời của anh em[a], cẩn thận tuân giữ và làm theo mọi điều răn của Ngài mà hôm nay tôi truyền cho anh em, thì Yahweh, Đức Chúa Trời của anh em, sẽ đặt anh em ở địa vị cao hơn mọi dân tộc trên đất.
  rationale: Bản sửa bảo toàn quan hệ điều kiện–hệ quả, ý “tiếng” của nguyên văn, mọi điều răn, thời điểm “hôm nay,” và địa vị cao hơn các dân tộc. Các điều chỉnh chỉ làm rõ hai cặp động từ Hê-bơ-rơ và thống nhất cách viết danh YHWH với audit trail.
