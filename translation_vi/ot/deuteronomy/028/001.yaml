language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: vi
  text: Nếu anh em hết lòng vâng theo tiếng Yahweh, Đức Chúa Trời của anh em[a], cẩn thận tuân giữ và làm theo mọi điều răn của Ngài mà hôm nay tôi truyền cho anh em, thì Yahweh, Đức Chúa Trời của anh em, sẽ đặt anh em ở địa vị cao hơn mọi dân tộc trên đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ nói sát nghĩa: “nếu nghe, anh em sẽ nghe theo tiếng Yahweh”; cách lặp động từ nhấn mạnh sự chăm chú lắng nghe và vâng phục.'
    reason: Giải thích cấu trúc nguyên thể tuyệt đối kèm động từ hữu hạn và thành ngữ “nghe tiếng” mang hàm ý vâng phục.
lexical_decisions:
- source_word: וְהָיָה
  choice: Nếu ... thì
  rationale: Trong tiếng Hê-bơ-rơ, cụm này mở đầu một mệnh đề điều kiện và hướng đến kết quả. Cấu trúc “Nếu ... thì” là cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ rõ quan hệ giao ước giữa điều kiện và hệ quả.
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: Nếu anh em thật sự nghe theo tiếng
  rationale: Động từ nguyên thể tuyệt đối đi với động từ hữu hạn tạo sắc thái nhấn mạnh. “Thật sự nghe theo” vừa giữ hình ảnh nghe tiếng vừa diễn đạt hàm ý vâng phục.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc và dễ nhận biết trong tiếng Việt để chuyển dịch trực tiếp danh giao ước YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở hữu mang tính giao ước. Đại từ Hê-bơ-rơ ở số ít tập thể, nhưng “anh em” tự nhiên trong lời Môi-se nói với toàn dân.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: cẩn thận làm theo
  rationale: Diễn đạt cả ý gìn giữ, chuyên tâm tuân thủ và thực hành; tránh tách thành hai hành động không tự nhiên trong tiếng Việt.
- source_word: כָּל מִצְוֺתָיו
  choice: mọi điều răn của Ngài
  rationale: “Điều răn” giữ sắc thái pháp lý-giao ước; “mọi” chuyển tải đầy đủ כָּל.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Giữ tính tức thời của lời Môi-se đang công bố và trật tự câu tự nhiên trong tiếng Việt.
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: thì ... sẽ đặt anh em lên cao
  rationale: Trong cấu trúc này, נתן mang nghĩa đặt vào một địa vị; “lên cao” thể hiện địa vị được tôn cao, không biến עֶלְיוֹן thành một danh hiệu thần linh.
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: hơn mọi dân tộc trên đất
  rationale: “Hơn” làm rõ ý so sánh của địa vị cao; “trên đất” phù hợp với phạm vi các dân tộc nói chung.
theological_decisions:
- issue: Cách chuyển dịch danh YHWH
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Giữ một tên riêng thay vì tước hiệu; “Giê-hô-va” là dạng đã được Việt hóa và quen thuộc với độc giả phổ thông.
- issue: Thành ngữ giao ước שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: thật sự nghe theo tiếng
  alternative: hết lòng vâng lời; chăm chú nghe tiếng
  rationale: Cách chọn này giữ đồng thời hình ảnh “nghe tiếng” và nội hàm vâng phục, không thu hẹp câu thành việc nghe bằng tai cũng không xóa hẳn thành ngữ nguồn.
- issue: Đại từ số ít chỉ tập thể Y-sơ-ra-ên
  choice: anh em
  alternative: ngươi; các ngươi
  rationale: Hình thái Hê-bơ-rơ là số ít nhưng người được nói với là toàn thể dân giao ước. “Anh em” thể hiện đối tượng tập thể bằng lối nói hiện đại, trang trọng vừa phải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho đại từ số ít mang nghĩa tập thể trong lời Môi-se nói với dân Y-sơ-ra-ên; dùng “Ngài” khi quy chiếu về Đức Chúa Trời. Câu giữ hình ảnh “tiếng” của nguyên văn nhưng giải thích thành ngữ trong chú thích.
