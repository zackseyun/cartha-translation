base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: vi
  text: Ngươi sẽ được ban phước trong thành, và ngươi sẽ được ban phước ngoài đồng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngươi được ban phước trong thành, và ngươi được ban phước ngoài đồng.”'
    reason: Nguyên văn Hê-bơ-rơ không có động từ hữu hạn. Trong bối cảnh các lời chúc phước giao ước, bản dịch chính dùng «sẽ» để diễn đạt sắc thái hứa hẹn; cách dịch thay thế giữ hình thức tuyên bố trực tiếp.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: được ban phước
  rationale: Phân từ bị động của ברך trong bối cảnh phước lành giao ước; cách dịch này giữ ý nghĩa phước lành được ban, thay vì chỉ nói đến may mắn hay thuận lợi.
- source_word: אַתָּה
  choice: bạn
  rationale: Đại từ ngôi hai số ít giống đực, nói với Israel như một chủ thể giao ước tập thể. “Bạn” truyền đạt rõ lối xưng hô trực tiếp và số ít trong tiếng Việt hiện đại.
- source_word: בָּעִיר
  choice: trong thành
  rationale: Giới từ בְּ chỉ vị trí; “trong thành” là cách diễn đạt tự nhiên, trang trọng vừa phải và giữ sự đối lập với đồng ruộng.
- source_word: וּבָרוּךְ
  choice: và ... được ban phước
  rationale: Giữ liên từ cùng sự lặp lại của vị ngữ để bảo toàn cấu trúc cân xứng có chủ ý trong tiếng Hê-bơ-rơ.
- source_word: בַּשָּׂדֶה
  choice: ngoài đồng
  rationale: שׂדה có thể chỉ cánh đồng, đất canh tác hoặc vùng đất trống bên ngoài khu dân cư. “Ngoài đồng” tự nhiên trong tiếng Việt và giữ nét tương phản thành thị–nông nghiệp.
theological_decisions:
- issue: Cách diễn đạt công thức phước lành không có động từ
  choice: Bạn sẽ được ban phước ... và bạn sẽ được ban phước ...
  alternative: Bạn được ban phước ... và bạn được ban phước ...
  rationale: Nguyên văn là hai mệnh đề không có động từ hữu hạn, nên có thể hiểu theo sắc thái tuyên bố hiện tại hoặc lời hứa. Trong chuỗi phước lành có điều kiện ở Phục Truyền Luật Lệ Ký 28, “sẽ” truyền đạt hợp lý lực hứa hẹn, còn chú thích bảo tồn cách hiểu tuyên bố trực tiếp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm. Giữ phép song hành cùng sự lặp lại của nguyên văn; dùng “trong thành” và “ngoài đồng” để thể hiện hai phạm vi đời sống đối lập.
