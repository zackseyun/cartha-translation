  to: Đức Giê-hô-va sẽ lập anh em thành một dân thánh cho chính Ngài, như Ngài đã thề với anh em, nếu[a] anh em tuân giữ các điều răn của Giê-hô-va, Đức Chúa Trời của anh em, và bước đi trong đường lối Ngài.
  rationale: Chỉnh nhẹ để tăng độ tự nhiên của tiếng Việt và sửa neo chú thích cho đúng vị trí của liên từ đa nghĩa. Không thay đổi nghĩa, sức nặng điều kiện, thuật ngữ giao ước, hay cách chuyển dịch danh יהוה.
