  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: vi
  text: Đức Giê-hô-va sẽ lập anh em thành một dân thánh cho chính Ngài, như Ngài đã thề với anh em, nếu[a] anh em tuân giữ các điều răn của Giê-hô-va, Đức Chúa Trời của anh em, và bước đi trong đường lối Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vì anh em tuân giữ các điều răn của Giê-hô-va, Đức Chúa Trời của anh em.” Liên từ Hê-bơ-rơ cũng có thể mang nghĩa nguyên nhân, dù văn cảnh ở đây nghiêng về nghĩa “nếu”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: sẽ lập anh em
  rationale: Dạng Hiphil của קום ở đây nói đến việc khiến dân đứng vững trong một địa vị giao ước, nên “lập” tự nhiên hơn cách hiểu theo nghĩa thể chất như “nâng dậy”.
- source_word: לּוֹ
  choice: cho chính Ngài
  rationale: 'Giữ sắc thái quy thuộc: Đức Giê-hô-va lập dân này riêng cho Ngài.'
- source_word: לְעַם קָדוֹשׁ
  choice: làm một dân thánh
  rationale: Diễn tả địa vị kết quả, đồng thời giữ ngôn ngữ căn tính giao ước và ý niệm được biệt riêng.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: như Ngài đã thề với anh em
  rationale: Giữ quan hệ tương ứng giữa lời hứa hiện tại và lời thề trước đó.
- source_word: כִּי
  choice: nếu
  rationale: Trong khung cảnh các phước lành giao ước, liên từ này hợp lý nhất khi dẫn vào điều kiện; cách hiểu nguyên nhân vẫn được ghi nhận trong chú thích.
- source_word: תִשְׁמֹר אֶת מִצְוֺת
  choice: tuân giữ các điều răn
  rationale: שׁמר đi với các điều răn mang nghĩa tuân thủ/cẩn thận làm theo; “tuân giữ” rõ nghĩa trong tiếng Việt hiện đại và vẫn giữ sắc thái giao ước.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng tên riêng truyền thống và dễ nhận biết trong tiếng Việt cho danh יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ công thức quan hệ giao ước và lối xưng hô tôn kính tự nhiên trong tiếng Việt.
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: và bước đi trong đường lối Ngài
  rationale: Giữ nguyên ẩn dụ Hê-bơ-rơ về nếp sống thuận theo ý muốn Đức Chúa Trời; cách nói này vẫn rõ và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Sức nặng điều kiện của mệnh đề כִּי
  choice: Dịch là “nếu”, trình bày việc Đức Giê-hô-va lập Israel làm dân thánh trong mối liên hệ có điều kiện với sự vâng lời giao ước.
  alternative: Có thể hiểu là “vì/bởi vì”, khiến mệnh đề mang tính giải thích nguyên nhân hơn là nêu điều kiện.
  rationale: Cú pháp và toàn cảnh phước lành–nguyền rủa trong Phục Truyền Luật Lệ Ký nghiêng về nghĩa điều kiện, nhưng tính đa nghĩa thật sự của liên từ được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít mang tính tập thể, hướng đến Israel với tư cách một dân. Giữ ẩn dụ “bước đi trong đường lối” và dùng “Đức Giê-hô-va” nhất quán cho danh יהוה. Dấu chú thích [a] được đặt cuối câu để không làm gián đoạn mệnh đề điều kiện.
