source:
  edition: WLC
  text: לֹֽא תִטַּ֥ע לְ/ךָ֛ אֲשֵׁרָ֖ה כָּל עֵ֑ץ אֵ֗צֶל מִזְבַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה לָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: vi
  text: Ngươi không được trồng bất cứ cây nào làm A-sê-ra cho mình bên cạnh bàn thờ của Yahweh, Đức Chúa Trời của ngươi, là bàn thờ mà ngươi làm cho mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cột A-sê-ra.” Từ Hê-bơ-rơ אֲשֵׁרָה có thể chỉ một vật thờ tự gắn với nữ thần A-sê-ra, chứ không chỉ chính nữ thần.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  choice: trồng
  rationale: Động từ נטע thông thường có nghĩa là “trồng”. Giữ hình ảnh cụ thể của nguyên văn thay vì đổi thành “dựng”, dù đối tượng trong câu mang tính thờ tự.
- source_word: אֲשֵׁרָה
  choice: A-sê-ra
  rationale: Phiên âm thuật ngữ Hê-bơ-rơ để không quyết đoán rằng từ này chỉ nữ thần, cây thờ hay cột thờ gắn với nữ thần ấy.
- source_word: כָּל עֵץ
  choice: thuộc bất cứ loại cây nào
  rationale: Diễn đạt nghĩa đen “bất cứ cây nào” theo cách tự nhiên trong quan hệ với A-sê-ra, đồng thời không giới hạn vào một loài cây cụ thể.
- source_word: אֵצֶל
  choice: bên cạnh
  rationale: Diễn đạt rõ sự gần kề về không gian trong điều luật cấm.
- source_word: מִזְבַּח
  choice: bàn thờ
  rationale: Từ tương đương thông dụng và chính xác trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng lối phiên âm thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Giữ đại từ sở hữu ngôi thứ hai số ít và sắc thái giao ước của lời phán trực tiếp.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: bàn thờ mà ngươi làm cho mình
  rationale: Giữ nghĩa rộng của עשה là “làm” và thành tố phản thân לָּךְ là “cho mình”; lặp lại “bàn thờ” để quan hệ bổ nghĩa rõ ràng trong tiếng Việt.
theological_decisions:
- issue: אֲשֵׁרָה chỉ nữ thần A-sê-ra hay một vật thờ tự gắn với nữ thần
  choice: Giữ dạng phiên âm “A-sê-ra” trong chính văn.
  alternative: “cột A-sê-ra” hoặc “hình tượng bằng gỗ của A-sê-ra”
  rationale: Ngữ nghĩa của thuật ngữ trong văn cảnh này không hoàn toàn chắc chắn. Phiên âm bảo tồn khả năng từ này chỉ nữ thần, biểu tượng của nữ thần, cây thờ hoặc cột thờ, thay vì âm thầm loại bỏ sự căng thẳng diễn giải.
translation_notes:
  register: Dùng văn phong luật lệ trang trọng nhưng dễ hiểu. Đại từ “ngươi” giữ lời phán trực tiếp ở ngôi thứ hai số ít; dấu gạch ngang giúp xác định rõ mệnh đề cuối bổ nghĩa cho “bàn thờ”.
