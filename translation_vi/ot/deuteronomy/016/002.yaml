base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: vi
  text: Ngươi phải dâng tế lễ Vượt Qua[a] cho Yahweh, Đức Chúa Trời của ngươi, từ đàn chiên dê và đàn bò, tại nơi Yahweh sẽ chọn để danh Ngài ngự tại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ở đây, “tế lễ Vượt Qua” được nói cùng với con vật từ “đàn chiên dê và đàn bò”. Có người hiểu cụm này không chỉ nói đến chính sinh tế Vượt Qua mà còn bao gồm các sinh tế kỳ lễ gắn với lễ Vượt Qua và lễ Bánh Không Men.
    reason: Giữ lại phạm vi rộng và điểm khó giải thích của nguyên văn, đồng thời nêu cách hiểu thay thế mà không áp đặt vào chính văn.
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Ngươi phải dâng
  rationale: Động từ זבח chỉ việc giết và dâng con vật làm sinh tế; “dâng” diễn đạt tự nhiên hành động tế lễ trong tiếng Việt, còn “phải” giữ sức mạnh chỉ thị của ngữ cảnh luật pháp.
- source_word: פֶּסַח
  choice: lễ Vượt Qua
  rationale: פֶּסַח có thể chỉ lễ, nghi thức hoặc sinh tế Vượt Qua. Cách dịch ngắn gọn này giữ được độ hàm súc và phần nào sự đa nghĩa của tiếng Hê-bơ-rơ, trong khi động từ “dâng” làm rõ bối cảnh tế lễ.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: cho Yahweh, Đức Chúa Trời của ngươi
  rationale: Giới từ ל chỉ đối tượng được dâng lễ. “Cho” tự nhiên trong tiếng Việt; tên giao ước יהוה được phiên âm là “Yahweh” thay vì thay bằng một tước hiệu.
- source_word: צֹאן וּבָקָר
  choice: bằng súc vật từ đàn chiên dê và đàn bò
  rationale: Hai danh từ tập hợp phân biệt gia súc nhỏ (צֹאן, gồm chiên và dê) với gia súc lớn (בקר, đàn bò). Thêm “bằng súc vật từ” làm rõ quan hệ nguồn/phương tiện vốn được hàm ý trong câu Hê-bơ-rơ mà không giới hạn vào một loài cụ thể.
- source_word: בַּמָּקוֹם
  choice: tại nơi
  rationale: Cụm từ nói đến địa điểm thờ phượng được chỉ định; “tại nơi” trang trọng và tự nhiên.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: Yahweh sẽ chọn
  rationale: Thể chưa hoàn thành ở đây hướng đến sự lựa chọn trong tương lai xét từ lời Môi-se đang nói.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để danh Ngài ngự ở đó
  rationale: Dạng Hiphil của שכן mang sắc thái khiến/cho ở. “Để danh Ngài ngự ở đó” giữ nguyên thành ngữ thần học về danh và sự hiện diện của Đức Chúa Trời, đồng thời tự nhiên hơn cách dịch máy móc “khiến danh Ngài cư ngụ”.
theological_decisions:
- issue: Cách dịch danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản văn trực tiếp dùng Tetragrammaton; phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay bằng tước hiệu.
- issue: Phạm vi của “lễ Vượt Qua” khi đi cùng “đàn chiên dê và đàn bò”
  choice: Giữ cách diễn đạt rộng của nguyên văn và giải thích bằng chú thích
  alternative: Diễn giải trong chính văn thành “sinh tế Vượt Qua cùng các lễ vật của kỳ lễ”
  rationale: Bò rộng hơn con vật thường được quy định cho chính sinh tế Vượt Qua. Nguyên văn có thể bao gồm cả các sinh tế kỳ lễ liên hệ, nhưng không nói rõ; vì vậy không nên âm thầm giải quyết điểm căng này trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ngươi” để duy trì sắc thái lời luật giao trực tiếp cho từng người Ít-ra-ên; viết hoa “Ngài” theo quy ước tiếng Việt dành cho Đức Chúa Trời. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
