base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: vi
  text: Trong bảy ngày, anh em phải cử hành lễ kính Yahweh, Đức Chúa Trời của anh em, tại nơi Yahweh sẽ chọn, vì Yahweh, Đức Chúa Trời của anh em, sẽ ban phước cho anh em trong mọi sản vật của anh em và mọi công việc do tay anh em làm; anh em sẽ tràn đầy vui mừng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh em sẽ chỉ vui mừng” hoặc “anh em chắc chắn sẽ vui mừng.” Cách nói Hê-bơ-rơ nhấn mạnh niềm vui trọn vẹn, không pha lẫn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּחֹג
  choice: phải cử hành lễ
  rationale: Động từ חָגַג chỉ việc giữ hoặc cử hành một lễ hành hương, nên “cử hành lễ” truyền đạt rõ hành động lễ hội chứ không chỉ niềm vui nói chung.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giới từ ל diễn tả lễ được hướng đến và dâng cho Yahweh; “cho Yahweh” tự nhiên trong tiếng Việt và giữ được ý hướng ấy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: tại nơi Yahweh sẽ chọn
  rationale: “Tại nơi” diễn đạt tự nhiên địa điểm thờ phượng do Yahweh lựa chọn và phản ánh sát cấu trúc tiếng Hê-bơ-rơ.
- source_word: כִּי
  choice: vì
  rationale: כִּי nêu lý do cho mệnh lệnh cử hành lễ và vui mừng; “vì” giữ rõ quan hệ nhân quả.
- source_word: יְבָרֶכְךָ
  choice: sẽ ban phước cho anh em
  rationale: Giữ ngôn ngữ giao ước quen thuộc của ברך và không thu hẹp phước lành thành sự thịnh vượng vật chất.
- source_word: תְּבוּאָתְךָ
  choice: mọi sản vật
  rationale: תְּבוּאָה chỉ sản lượng hoặc nông sản nói chung; “sản vật” đủ rộng để không giới hạn vào ngũ cốc hay riêng mùa gặt.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: mọi công việc tay anh em làm
  rationale: Cách diễn đạt này giữ hình ảnh “tay” của thành ngữ Hê-bơ-rơ nhưng tự nhiên và rõ nghĩa đối với độc giả Việt hiện đại.
- source_word: וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: anh em sẽ tràn đầy vui mừng
  rationale: Diễn đạt trạng thái vui mừng trọn vẹn được אַךְ nhấn mạnh, đồng thời tránh khiến “chỉ vui mừng” bị hiểu cứng nhắc là loại trừ mọi cảm xúc khác.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước YHWH; “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: anh em sẽ tràn đầy vui mừng
  alternative: anh em sẽ chỉ vui mừng; anh em chắc chắn sẽ vui mừng
  rationale: אַךְ có thể mang sắc thái hạn định hoặc nhấn mạnh. Trong mạch văn về phước lành và lễ hội, bản dịch chính thể hiện niềm vui trọn vẹn nhưng ghi chú vẫn bảo tồn các khả năng khác.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ số nhiều “anh em” thể hiện cách lời luật truyền đạt cho toàn dân dù các dạng Hê-bơ-rơ ở đây là số ít mang tính tập thể. Dùng “Đức Chúa Trời” cho אֱלֹהִים và giữ “Yahweh” như danh riêng.
