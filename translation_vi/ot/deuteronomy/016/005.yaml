base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: vi
  text: Anh em không được dâng sinh tế Vượt Qua[a] trong bất cứ thành nào[b] mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ Vượt Qua” hoặc “con vật hiến tế dịp Vượt Qua.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “cửa thành”, một cách hoán dụ thường dùng để chỉ thành hoặc khu dân cư.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Anh em không được
  rationale: Cấu trúc יכל với động từ nguyên mẫu trong văn bản luật pháp diễn đạt sự cấm đoán hơn là chỉ nói đến tình trạng không có khả năng. “Không được” truyền đạt tự nhiên hiệu lực pháp lý ấy; “anh em” là cách xưng hô cộng đồng trang trọng, dễ hiểu trong tiếng Việt.
- source_word: לִזְבֹּחַ
  choice: dâng sinh tế
  rationale: זבח trong ngữ cảnh thờ phượng chỉ việc giết và dâng lễ vật hiến tế. “Dâng sinh tế” diễn đạt rõ ý nghĩa tế lễ, thay vì chỉ nói đến hành động giết.
- source_word: הַפָּסַח
  choice: sinh tế Vượt Qua
  rationale: פֶּסַח có thể chỉ lễ Vượt Qua, con vật hiến tế hoặc chính sinh tế Vượt Qua. Trong cấu trúc với זבח, nghĩa sinh tế nổi bật; cách dịch này rõ ràng nhưng vẫn giữ tên gọi truyền thống “Vượt Qua”. Chú thích bảo lưu phạm vi nghĩa rộng hơn.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: trong bất cứ thành nào
  rationale: Trong Phục Truyền Luật Lệ Ký, “cổng/cửa thành” thường được dùng hoán dụ để chỉ thành hoặc khu dân cư thuộc địa phương. Dịch “bất cứ thành nào” truyền đạt tự nhiên phạm vi của lệnh cấm; hình ảnh nguyên văn được ghi trong chú thích.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em
  rationale: Phân từ נֹתֵן diễn tả hành động đang diễn tiến hoặc đặc trưng; “đang ban” phù hợp với công thức về đất được Đức Chúa Trời ban trong sách. Danh יהוה được phiên là “Yahweh” để thể hiện danh riêng trong nguyên văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” phân biệt danh riêng này với tước hiệu “Chúa” và không áp đặt cách thay thế danh bằng một tước hiệu.
- issue: Đối tượng của động từ “dâng sinh tế”
  choice: sinh tế Vượt Qua
  alternative: lễ Vượt Qua; chiên Vượt Qua
  rationale: Danh từ הַפָּסַח có thể chỉ lễ, con vật hoặc sinh tế. Vì đi với זבח, bản dịch chính nêu nghĩa sinh tế, nhưng không thu hẹp thành “chiên” vì câu không nói rõ loài vật; chú thích bảo lưu sự đa nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Anh em” thể hiện lời xưng hô số ít mang tính đại diện của tiếng Hê-bơ-rơ theo cách tự nhiên trong tiếng Việt. Bản chính ưu tiên nghĩa giao tiếp của phép hoán dụ “cửa thành”, đồng thời giữ hình ảnh nguyên văn trong chú thích.
