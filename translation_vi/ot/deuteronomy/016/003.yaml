revisions:
- from: Ngươi không được ăn bánh có men cùng với lễ vật ấy. Trong bảy ngày, ngươi phải ăn bánh không men cùng với lễ vật ấy, là bánh của cảnh khốn khổ[a], vì ngươi đã vội vã ra khỏi đất Ai Cập. Như vậy, ngươi sẽ ghi nhớ ngày mình ra khỏi đất Ai Cập suốt đời.
  to: Ngươi không được ăn bánh có men cùng với lễ vật ấy. Trong bảy ngày, ngươi phải ăn bánh không men cùng với lễ vật ấy, là bánh của nỗi khốn khổ[a], vì ngươi đã vội vã ra đi khỏi đất Ai Cập, để ngươi ghi nhớ ngày mình ra khỏi đất Ai Cập suốt đời.
