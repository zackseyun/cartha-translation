source:
  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: vi
  text: Ngươi không được ăn bánh có men cùng với lễ vật ấy. Trong bảy ngày, ngươi phải ăn bánh không men cùng với lễ vật ấy, là bánh của nỗi khốn khổ[a], vì ngươi đã vội vã ra đi khỏi đất Ai Cập, để ngươi ghi nhớ ngày mình ra khỏi đất Ai Cập suốt đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bánh của sự nghèo khó” hoặc “bánh của cảnh cơ cực.” Cụm từ Hê-bơ-rơ có thể nhấn mạnh nỗi khổ, sự thiếu thốn hoặc cảnh khốn cùng gắn với cuộc xuất hành.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: cùng với lễ vật ấy
  rationale: Giới từ עַל trong ngữ cảnh bữa ăn Vượt Qua chỉ sự ăn kèm với sinh tế. Thêm “lễ vật” làm rõ vật quy chiếu trong tiếng Việt mà không thay đổi ý.
- source_word: חָמֵץ
  choice: bánh có men
  rationale: Trong ngữ cảnh bữa lễ, từ này chỉ thức ăn có men, cụ thể là bánh; cách dịch này rõ ràng hơn “men” vốn có thể bị hiểu là nguyên liệu.
- source_word: מַצּוֹת
  choice: bánh không men
  rationale: Đây là cách gọi tự nhiên, quen thuộc và chính xác đối với bánh dùng trong lễ.
- source_word: לֶחֶם עֹנִי
  choice: bánh của cảnh khốn khổ
  rationale: Giữ được sức nặng của עֹנִי và mối liên hệ với gian khổ, thiếu thốn trong biến cố xuất hành, nhưng không thu hẹp nghĩa chỉ còn nghèo đói.
- source_word: בְחִפָּזוֹן
  choice: vội vã
  rationale: Diễn đạt tự nhiên trạng thái khẩn trương của cuộc ra đi mà không thêm ý hoảng sợ hay chạy trốn.
- source_word: לְמַעַן תִּזְכֹּר
  choice: Như vậy, ngươi sẽ ghi nhớ
  rationale: Diễn đạt lực mục đích hoặc kết quả của לְמַעַן với động từ chưa hoàn thành bằng tiếng Việt tự nhiên.
- source_word: יֹום צֵאתְךָ
  choice: ngày mình ra khỏi
  rationale: Giữ nội dung của cấu trúc danh từ–động từ nguyên mẫu, đồng thời tránh lặp đại từ “ngươi” thiếu tự nhiên trong cùng câu.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: suốt đời
  rationale: Thành ngữ tiếng Việt tự nhiên, chuyển tải đầy đủ ý liên tục trong mọi ngày của đời sống.
theological_decisions:
- issue: Ý nghĩa của לֶחֶם עֹנִי trong việc tưởng niệm cuộc xuất hành
  choice: bánh của cảnh khốn khổ
  alternative: bánh của sự nghèo khó; bánh của cảnh cơ cực
  rationale: Cách dịch duy trì mối liên hệ nghi lễ với gian khổ và sự giải cứu mà không quyết định rằng עֹנִי chỉ nói đến nghèo túng kinh tế.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phù hợp lời luật truyền trực tiếp cho dân giao ước; “lễ vật ấy” làm rõ đại từ quy chiếu về sinh tế Vượt Qua trong câu trước. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
