  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: vi
  text: Trong suốt bảy ngày, không được thấy men trong khắp lãnh thổ của anh em; cũng không được để lại qua đêm đến sáng bất cứ phần thịt[a] nào mà anh em dâng làm sinh tế vào buổi chiều ngày thứ nhất[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không được để lại chút thịt nào.” Từ Hê-bơ-rơ có nghĩa đen là “thịt” và thường được dùng cho thịt của sinh tế.'
    reason: lexical_alternative
  - marker: b
    text: “Ngày thứ nhất” có thể chỉ riêng sinh tế Vượt Qua vào lúc mở đầu kỳ lễ, nhưng ở đây nguyên văn Hê-bơ-rơ không nói rõ “chiên con Vượt Qua”.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: không được thấy
  rationale: Dạng Niphal mang nghĩa bị động; cách diễn đạt này giữ nguyên sức mạnh của lệnh cấm và tự nhiên trong tiếng Việt.
- source_word: שְׂאֹר
  choice: men
  rationale: “Men” là từ thông dụng, phù hợp với chất gây lên men trong luật về bánh không men; không thu hẹp nghĩa vào một loại men hiện đại cụ thể.
- source_word: בְּכָל גְּבֻלְךָ
  choice: trong khắp lãnh thổ của anh em
  rationale: גְּבוּל có thể chỉ ranh giới hoặc lãnh thổ; ở đây nghĩa phạm vi lãnh thổ phù hợp hơn. “Anh em” diễn đạt đối tượng tập thể mà đại từ số ít Hê-bơ-rơ đại diện.
- source_word: שִׁבְעַת יָמִים
  choice: trong suốt bảy ngày
  rationale: Diễn đạt rõ khoảng thời gian liên tục bằng tiếng Việt tự nhiên.
- source_word: יָלִין
  choice: được để lại qua đêm
  rationale: Động từ לין ở đây nói đến việc phần thịt còn lại qua đêm; cách dịch này rõ nghĩa hơn lối dịch sát chữ như “trú lại”.
- source_word: מִן הַבָּשָׂר
  choice: không phần nào của thịt
  rationale: Giữ cấu trúc phân lượng của מִן và nghĩa tế lễ của בָּשָׂר, đồng thời dùng cách nói dễ hiểu trong tiếng Việt.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: mà anh em dâng làm sinh tế
  rationale: זבח trong ngữ cảnh nghi lễ chỉ việc giết và dâng con vật làm sinh tế; cách dịch này nêu rõ tính chất tế lễ mà không thêm loại sinh tế cụ thể.
- source_word: בָּעֶרֶב
  choice: vào buổi chiều
  rationale: Cách diễn đạt thời gian trực tiếp và tự nhiên.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: ngày thứ nhất
  rationale: Giữ đúng sự không xác định của nguyên văn, không tự ý thêm “của kỳ lễ”.
- source_word: לַבֹּקֶר
  choice: đến sáng
  rationale: Giới từ לְ trong ngữ cảnh này đánh dấu giới hạn thời gian; “đến sáng” là cách diễn đạt tự nhiên.
theological_decisions:
- issue: Phần thịt được dâng vào “ngày thứ nhất” chỉ sinh tế nào
  choice: Dịch chung là “thịt mà anh em dâng làm sinh tế”, không xác định đó là chiên con Vượt Qua.
  alternative: Hiểu cụ thể là thịt của sinh tế Vượt Qua, hoặc hiểu rộng hơn là thịt của các sinh tế trong ngày mở đầu kỳ lễ.
  rationale: Nguyên văn chỉ nói đến “thịt” được dâng vào buổi chiều ngày thứ nhất, không nêu rõ “chiên con Vượt Qua”. Bản dịch giữ sự mơ hồ có thật này thay vì giải quyết trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo nghĩa tập thể để chuyển đại từ số ít chỉ toàn dân trong tiếng Hê-bơ-rơ; giữ thuật ngữ tế lễ “sinh tế” nhằm phân biệt hành động nghi lễ với việc giết mổ thông thường.
