base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/007.yaml
  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: vi
  text: Anh em phải nấu và ăn lễ vật ấy tại nơi mà Đức Giê-hô-va, Đức Chúa Trời của anh em, sẽ chọn[a]; sáng hôm sau, anh em hãy quay về lều trại của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ dịch sát là “sẽ chọn trong đó/tại đó”. Đại từ này thường được hiểu là chỉ nơi được chọn; cũng có cách hiểu liên hệ với lễ vật trong ngữ cảnh.
    reason: Bảo lưu tính mơ hồ của quy chiếu בּוֹ mà không áp đặt một cách giải thích trong bản văn chính.
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: phải nấu
  rationale: Động từ בשל ở đây chỉ việc làm chín thức ăn; “nấu” tự nhiên và đủ rộng, không thu hẹp thành một phương thức như luộc hay quay.
- source_word: וְאָכַלְתָּ
  choice: và ăn
  rationale: Giữ trình tự hành động rõ ràng của nguyên văn.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: tại nơi Đức Giê-hô-va, Đức Chúa Trời của anh em, sẽ chọn cho lễ vật ấy
  rationale: Giữ cách hiểu của lớp tham khảo đã được thẩm định rằng בּוֹ quy chiếu đến lễ vật Vượt Qua, đồng thời diễn đạt tự nhiên bằng “cho lễ vật ấy”.
- source_word: וּפָנִיתָ בַבֹּקֶר
  choice: đến sáng, anh em hãy quay về
  rationale: פנה trong ngữ cảnh này mang nghĩa quay đi/rời nơi ấy; “đến sáng” diễn đạt mốc thời gian tự nhiên.
- source_word: לְאֹהָלֶיךָ
  choice: về lều mình
  rationale: Giữ hình ảnh số nhiều tập hợp “các lều của anh em” theo cách nói tiếng Việt tự nhiên; “lều mình” có thể chỉ nơi ở của từng người.
theological_decisions:
- issue: Chủ thể số ít đại diện trong lời truyền cho toàn dân
  choice: anh em
  alternative: ngươi
  rationale: Tiếng Hê-bơ-rơ dùng đại từ số ít, nhưng đây là lời chỉ dẫn cho cộng đồng; “anh em” vừa tự nhiên trong tiếng Việt hiện đại vừa bảo toàn sắc thái tập thể.
- issue: Danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA / Yahweh
  rationale: Dùng hình thức quen thuộc, trang trọng trong truyền thống Kinh Thánh tiếng Việt, không thêm diễn giải giáo phái.
- issue: Quy chiếu của בּוֹ
  choice: cho lễ vật ấy
  alternative: tại đó / nơi ấy
  rationale: Bản phụ âm và hình thái đại từ cho phép bàn về quy chiếu; theo văn cảnh gần và lớp tham khảo đã thẩm định, bản dịch chính hiểu là lễ vật, nhưng ghi chú phương án địa điểm để không che khuất tính mơ hồ.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Tuy nhiên, vì có chú thích [a], bản văn chính cần gắn dấu chú thích ngay sau cụm liên quan; bản văn xuất bản hoàn chỉnh nên là: “Anh em phải nấu và ăn lễ vật ấy tại nơi Đức Giê-hô-va, Đức Chúa Trời của anh em, sẽ chọn cho lễ vật ấy[a]; đến sáng, anh em hãy quay về lều mình.”'
