revisions:
- from: Hãy tuân giữ tháng A-víp[a] và cử hành lễ Vượt Qua dâng lên Đức Giê-hô-va, Đức Chúa Trời của anh em, vì vào tháng A-víp, Đức Giê-hô-va, Đức Chúa Trời của anh em, đã đưa anh em ra khỏi Ai Cập trong đêm.
  to: Hãy tuân giữ tháng A-víp[a] và cử hành Lễ Vượt Qua cho Yahweh, Đức Chúa Trời của anh em, vì vào tháng A-víp, Yahweh, Đức Chúa Trời của anh em, đã đưa anh em ra khỏi Ai Cập trong đêm.
  rationale: Bản sửa thay cách chuyển tự danh YHWH bằng “Yahweh” để nhất quán với chính sách POB và thay “dâng lên” bằng “cho” để phản ánh chính xác hơn giới từ ל trong ngữ cảnh cử hành lễ. Các yếu tố còn lại giữ nguyên vì trung thành với tiếng Hê-bơ-rơ và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
