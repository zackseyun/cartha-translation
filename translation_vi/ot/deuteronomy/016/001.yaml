  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: vi
  text: Hãy tuân giữ tháng A-víp[a] và cử hành Lễ Vượt Qua cho Yahweh, Đức Chúa Trời của anh em, vì vào tháng A-víp, Yahweh, Đức Chúa Trời của anh em, đã đưa anh em ra khỏi Ai Cập trong đêm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-víp là tên tháng gắn với lúa ở giai đoạn chín sớm; cũng có thể dịch là “tháng mùa xuân”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Hãy tuân giữ
  rationale: Mệnh lệnh này đòi hỏi sự tuân thủ cẩn thận một quy định theo lịch lễ, chứ không chỉ ghi nhớ; “tuân giữ” tự nhiên trong văn phong luật lệ và giữ được sức nặng của mệnh lệnh.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: tháng A-víp
  rationale: Cụm từ chỉ tháng gắn với lúa ở giai đoạn chín sớm và mùa xuân. Trong ngữ cảnh lịch phụng lễ, giữ tên tháng thể hiện tính xác định rõ hơn cách dịch khái quát là “tháng mùa xuân”.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: và cử hành lễ Vượt Qua
  rationale: Nghĩa sát là “làm lễ Vượt Qua”; “cử hành” diễn đạt tự nhiên việc thực hiện nghi lễ mà không nhấn quá mức sắc thái vui hội.
- source_word: לַיהוָה
  choice: dâng lên Đức Giê-hô-va
  rationale: Giới từ ל biểu thị sự quy hướng hoặc dâng dành việc cử hành cho YHWH; “dâng lên” truyền đạt tự nhiên hướng quy thuộc ấy.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng hình thức tên riêng quen thuộc, trang trọng trong tiếng Việt thay vì thay thế bằng một tước hiệu, qua đó bảo tồn việc nguyên văn trực tiếp dùng danh YHWH.
- source_word: הוֹצִיאֲךָ
  choice: đã đưa anh em ra
  rationale: Đây là cách diễn đạt rõ ràng, tự nhiên cho thể Hiphil của יצא trong công thức nói về cuộc xuất hành.
- source_word: מִמִּצְרַיִם
  choice: khỏi Ai Cập
  rationale: Đi với “đưa ... ra”, từ “khỏi” tạo thành cấu trúc tiếng Việt trôi chảy và vẫn nêu rõ điểm xuất phát.
- source_word: לָיְלָה
  choice: trong đêm
  rationale: Danh từ được dùng trạng ngữ để chỉ thời điểm hoặc hoàn cảnh của cuộc xuất hành; “trong đêm” giữ được nét nhấn mạnh thời gian mà không suy diễn thời điểm chính xác.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng YHWH. Bản dịch giữ một dạng danh riêng đã quen thuộc và trang trọng trong tiếng Việt, không thay bằng tước hiệu; lựa chọn này không nhằm quyết định chắc chắn cách phát âm cổ.
- issue: Hiểu אָבִיב là tên tháng hay mùa
  choice: A-víp như một tên gọi theo lịch
  alternative: tháng mùa xuân
  rationale: Trong luật về lễ Vượt Qua, cụm này xác định tháng phụng lễ gắn với cuộc xuất hành. Giữ tên tháng bảo tồn tính cụ thể theo lịch, còn chú thích nêu nghĩa từ nguyên và cách dịch khác.
- issue: Phạm vi của לָיְלָה
  choice: gắn “trong đêm” với việc được đưa ra khỏi Ai Cập
  alternative: hiểu rộng về cuộc xuất hành diễn ra ban đêm
  rationale: Trật tự cú pháp gắn trạng ngữ với động từ “đưa ra”. Bản dịch giữ cách nói cô đọng của nguyên văn, không giải quyết thêm những câu hỏi về các giai đoạn của cuộc xuất hành.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Đại từ “anh em” diễn đạt ngôi thứ hai số ít mang tính tập thể, hướng đến dân Israel, đồng thời tránh lối nói quá cổ. Danh YHWH được thể hiện nhất quán bằng “Đức Giê-hô-va” như một tên riêng quen thuộc trong tiếng Việt.
