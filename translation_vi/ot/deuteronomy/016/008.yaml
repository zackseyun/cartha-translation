  text: שֵׁ֥שֶׁת יָמִ֖ים תֹּאכַ֣ל מַצּ֑וֹת וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י עֲצֶ֨רֶת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תַעֲשֶׂ֖ה מְלָאכָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: vi
  text: Trong sáu ngày, anh em phải ăn bánh không men; ngày thứ bảy là ngày nhóm họp trọng thể[a] dành cho Yahweh, Đức Chúa Trời của anh em; anh em không được làm công việc nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một cuộc nhóm họp thánh” hoặc “một cuộc nhóm họp bế mạc.” Từ Hê-bơ-rơ chỉ một cuộc hội họp chính thức trong kỳ lễ, có lẽ mang sắc thái của cuộc nhóm họp kết thúc kỳ lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Trong sáu ngày
  rationale: Cụm từ chỉ khoảng thời gian; cách dịch này tự nhiên trong tiếng Việt và giữ rõ ý kéo dài suốt sáu ngày.
- source_word: תֹּאכַל
  choice: anh em phải ăn
  rationale: Dạng vị hoàn thành trong văn luật pháp mang chức năng truyền lệnh. “Phải ăn” diễn đạt rõ tính quy định; đại từ “anh em” hướng đến cộng đồng giao ước dù nguyên văn dùng ngôi thứ hai số ít đại diện.
- source_word: מַצּוֹת
  choice: bánh không men
  rationale: Đây là nghĩa thông dụng trong bối cảnh Lễ Vượt Qua và là cách nói rõ ràng, quen thuộc trong tiếng Việt.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: đến ngày thứ bảy
  rationale: Liên từ וּ cơ bản có tính nối tiếp. “Đến ngày thứ bảy” diễn đạt tự nhiên sự chuyển sang ngày cuối mà không thêm sắc thái đối lập không bắt buộc.
- source_word: עֲצֶרֶת
  choice: một cuộc nhóm họp trọng thể
  rationale: Danh từ chỉ một cuộc hội họp lễ nghi đặc biệt, có thể mang sắc thái khép lại kỳ lễ. Cách dịch này giữ tính trang trọng mà không quyết đoán rằng ý chính nhất thiết là “bế mạc”.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ ל biểu thị sự quy hướng hoặc dâng dành. “Dành cho” tự nhiên trong tiếng Việt; danh riêng giao ước יהוה được phiên là “Yahweh”.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ công thức giao ước “Yahweh, Đức Chúa Trời của anh em” bằng lối diễn đạt trang trọng, dễ hiểu.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: Anh em không được làm bất cứ công việc nào
  rationale: Diễn đạt rõ lệnh cấm lao động trong ngày ấy; “bất cứ… nào” làm sáng tỏ phạm vi phủ định của câu Hê-bơ-rơ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tư cách danh riêng và không thay bằng một tước hiệu.
- issue: Sắc thái của עֲצֶרֶת
  choice: cuộc nhóm họp trọng thể
  alternative: cuộc nhóm họp thánh hoặc cuộc nhóm họp bế mạc
  rationale: Từ này có thể nhấn mạnh một kỳ hội họp lễ nghi đặc biệt và trong ngữ cảnh cũng có thể gợi ý ngày kết thúc kỳ lễ. Bản chính không thu hẹp nghĩa vào riêng sắc thái “bế mạc”; chú thích bảo tồn các khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và mang tính luật lệ. Dùng “anh em” theo nghĩa cộng đồng để chuyển ngôi thứ hai số ít đại diện của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ עֲצֶרֶת mà chú thích giải thích.
