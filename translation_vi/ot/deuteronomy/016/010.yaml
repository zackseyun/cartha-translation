  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: vi
  text: Rồi anh em phải cử hành Lễ Các Tuần cho Yahweh, Đức Chúa Trời của anh em, với phần lễ vật tự nguyện do tay anh em dâng[a], tùy theo Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em thế nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo lượng lễ vật tự nguyện do tay anh em dâng.” Cụm Hê-bơ-rơ nhấn mạnh phần lễ vật tự nguyện và tính tương xứng với điều Đức Chúa Trời đã ban.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Rồi anh em phải cử hành
  rationale: Động từ עשה đi với חַג mang nghĩa cử hành lễ; liên từ וְ nối tiếp chỉ thị trước. Đại từ số ít đại diện cho toàn dân được diễn đạt bằng “anh em” theo lối chỉ dẫn cộng đồng tự nhiên trong tiếng Việt.
- source_word: חַג שָׁבֻעוֹת
  choice: Lễ Các Tuần
  rationale: Giữ tên gọi của lễ hội dựa trên việc đếm các tuần trong ngữ cảnh, đồng thời dùng cách gọi rõ ràng, trang trọng.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: cho Yahweh, Đức Chúa Trời của anh em
  rationale: Giới từ ל biểu thị lễ được dành cho Yahweh; danh riêng giao ước được phiên âm trực tiếp, còn אֱלֹהֶיךָ được dịch tự nhiên.
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: bằng lễ vật tự nguyện do chính tay mình dâng[a]
  rationale: Cụm khó và hiếm nhấn mạnh lễ vật tự nguyện do người thờ phượng đích thân dâng; ý về mức lượng hay phần đóng góp được làm rõ trong chú thích và mệnh đề tỷ lệ theo sau.
- source_word: אֲשֶׁר תִּתֵּן
  choice: dâng
  rationale: Mệnh đề quan hệ được gộp tự nhiên vào cụm danh từ tiếng Việt mà vẫn giữ hành động người thờ phượng trao lễ vật.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: tùy theo mức ... ban phước cho anh em
  rationale: 'Diễn đạt quan hệ tỷ lệ: lượng lễ vật tương ứng với phước lành nhận được, không ấn định một mức cố định.'
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Dùng tên riêng Yahweh để phản ánh trực tiếp danh giao ước trong nguyên văn, không thay bằng một tước hiệu.
- issue: Tính tự nguyện và tính tương xứng của lễ vật
  choice: Giữ cả “tự nguyện” và “tùy theo mức ... ban phước”
  alternative: Hiểu đây là một khoản cống nạp cố định
  rationale: נִדְבָה xác định lễ vật là tự nguyện, còn כַּאֲשֶׁר nối số lượng dâng với mức phước lành; bản dịch không biến chỉ thị thành thuế suất cố định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cử hành” phù hợp ngữ cảnh lễ hội; “do chính tay mình dâng” bảo tồn hình ảnh Hê-bơ-rơ mà không quá sát chữ. Dùng “anh em” cho số ít tập thể hướng đến dân Israel.
