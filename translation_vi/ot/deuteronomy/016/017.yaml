base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: vi
  text: Mỗi người hãy dâng tùy theo những gì mình có[a], tùy theo phước lành mà Yahweh, Đức Chúa Trời của anh em, đã ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “theo quà tặng của tay mình,” một thành ngữ chỉ những gì một người có sẵn để dâng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Mỗi người
  rationale: Danh từ số ít được dùng theo nghĩa phân phối. Trong tiếng Việt, “mỗi người” tự nhiên và bao hàm ý từng người nam trong bối cảnh mà không cần lặp giới tính vốn đã rõ từ đoạn văn.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: tùy theo khả năng của mình
  rationale: Cụm nghĩa đen “theo quà tặng của tay mình” là một thành ngữ chỉ phần một người có trong tay và có thể dâng. Dịch theo nghĩa thành ngữ giúp câu tiếng Việt rõ ràng; chú thích giữ lại hình ảnh nguyên ngữ.
- source_word: כְּבִרְכַּת
  choice: tương xứng với phước lành
  rationale: Tiền tố כְּ diễn tả mức độ hay tỷ lệ. “Tương xứng với” làm rõ rằng lễ vật phải theo mức phước lành đã nhận.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên ngữ thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Đại từ Hê-bơ-rơ ở ngôi hai số ít, nhưng Môi-se đang nói với toàn dân như một cộng đồng. “Anh em” là cách xưng hô tự nhiên, trang trọng trong tiếng Việt và phù hợp với văn mạch.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: mà ... đã ban cho anh em
  rationale: Mệnh đề quan hệ bổ nghĩa cho “phước lành”; thể hoàn thành được diễn đạt tự nhiên bằng “đã ban”.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יְהוָה. “Yahweh” bảo tồn đặc tính danh riêng và tránh thay thế bằng tước hiệu.
- issue: Phước lành và mức lễ vật
  choice: tương xứng với phước lành
  alternative: theo phước lành
  rationale: Cách dịch này giữ mối liên hệ tỷ lệ do כְּ biểu thị mà không xác định cứng nhắc một tỷ lệ hay quy tắc dâng hiến không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dâng” theo ngữ cảnh lễ vật; dùng “anh em” cho đại từ cộng đồng số ít của tiếng Hê-bơ-rơ. Dấu ngắt đoạn ס không cần thể hiện trong nội dung câu.
