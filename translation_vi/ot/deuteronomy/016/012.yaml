  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: vi
  text: Hãy nhớ rằng ngươi đã là nô lệ ở Ai Cập, và hãy tuân giữ và thực hành các luật lệ này.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Hãy nhớ
  rationale: Dạng hoàn thành Qal có liên từ trong ngữ cảnh chỉ thị mang lực mệnh lệnh; “Hãy nhớ” tự nhiên và truyền đạt đúng lực câu.
- source_word: כִּי
  choice: rằng
  rationale: Liên từ giới thiệu nội dung cần ghi nhớ, nên “rằng” phù hợp hơn sắc thái nguyên nhân.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Trong ký ức về Ai Cập, từ này chỉ tình trạng lao dịch cưỡng bức; “nô lệ” phản ánh rõ hơn thực trạng ấy, dù từ Hê-bơ-rơ cũng có thể mang nghĩa “đầy tớ”.
- source_word: הָיִיתָ
  choice: đã từng làm
  rationale: Diễn đạt tự nhiên tình trạng trong quá khứ; kết hợp với “nô lệ” thành cụm tiếng Việt thông dụng.
- source_word: בְּמִצְרָיִם
  choice: tại Ai Cập
  rationale: Chuyển đạt trực tiếp địa điểm, không thêm từ “đất” vốn không có trong câu nguồn.
- source_word: וְשָׁמַרְתָּ
  choice: hãy tuân giữ
  rationale: Trong văn cảnh luật pháp giao ước, שׁמר chỉ việc cẩn trọng tuân theo các điều đã truyền.
- source_word: וְעָשִׂיתָ
  choice: thi hành
  rationale: Nhấn mạnh việc thực sự thực hiện các luật lệ; đi đôi tự nhiên với “tuân giữ” mà vẫn bảo tồn hai động từ của nguyên văn.
- source_word: הַחֻקִּים
  choice: các luật lệ
  rationale: Chỉ những quy định được ấn định; “luật lệ” chính xác, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: הָאֵלֶּה
  choice: này
  rationale: Đại từ chỉ định trực tiếp bổ nghĩa cho “các luật lệ”.
theological_decisions:
- issue: Cách dịch עֶבֶד khi nói về thân phận của Israel tại Ai Cập
  choice: nô lệ
  alternative: đầy tớ
  rationale: Văn cảnh nhắc đến sự áp bức và lao dịch cưỡng bức tại Ai Cập, nên “nô lệ” diễn tả đúng thực trạng nổi bật hơn. Không cần chú thích vì “đầy tớ” ở đây có thể làm nhẹ đi thân phận bị cưỡng bức.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số ít tập thể hướng đến Israel, giữ sắc thái cộng đồng của diễn từ. Cặp “tuân giữ, thi hành” bảo tồn hai hành động gần nghĩa nhưng phân biệt trong nguyên văn.
