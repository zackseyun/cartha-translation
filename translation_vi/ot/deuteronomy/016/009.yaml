  yaml_path: translation/ot/deuteronomy/016/009.yaml
  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: vi
  text: Anh em phải tự đếm bảy tuần[a]. Từ khi anh em bắt đầu đưa lưỡi liềm vào lúa đang đứng, anh em phải bắt đầu đếm bảy tuần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ “tuần” trong tiếng Hê-bơ-rơ có liên hệ với từ “bảy”; vì thế cụm này cũng có thể được diễn đạt là “bảy lần bảy.” Trong ngữ cảnh lịch lễ ở đây, nó chỉ bảy tuần.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת / שִׁבְעָה שָׁבֻעוֹת
  choice: bảy tuần
  rationale: שָׁבֻעֹת là từ Hê-bơ-rơ thông thường chỉ các tuần lễ. Trong ngữ cảnh tính lịch này, “bảy tuần” truyền đạt rõ nghĩa thành ngữ, đồng thời giữ nguyên con số và sự lặp lại của nguyên văn.
- source_word: תִּסְפָּר לָךְ
  choice: anh em phải đếm cho mình
  rationale: Động từ diễn đạt mệnh lệnh, còn לָךְ là đại từ số ít chỉ cộng đồng đang được ngỏ lời. “Anh em” là cách xưng hô tập thể tự nhiên trong tiếng Việt hiện đại; “cho mình” giữ lại nét quy chiếu đích thân của nguyên văn.
- source_word: מֵהָחֵל
  choice: kể từ khi bắt đầu
  rationale: Giới từ מִן đi với động từ nguyên mẫu xác định mốc khởi đầu; “kể từ khi bắt đầu” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: חֶרְמֵשׁ
  choice: lưỡi liềm
  rationale: חֶרְמֵשׁ chỉ dụng cụ gặt; “lưỡi liềm” là từ thông dụng và phù hợp với hành động bắt đầu thu hoạch.
- source_word: בַּקָּמָה
  choice: vào lúa đang đứng
  rationale: קָמָה chỉ lúa hoặc hoa màu còn đứng trên đồng. Cụm này giữ hình ảnh cụ thể của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: תָּחֵל לִסְפֹּר
  choice: phải bắt đầu đếm
  rationale: Cấu trúc động từ Hiphil của חלל đi với động từ nguyên mẫu ספר diễn tả sự khởi đầu của việc đếm; cách dịch giữ rõ mệnh lệnh và sự lặp lại có chủ ý.
