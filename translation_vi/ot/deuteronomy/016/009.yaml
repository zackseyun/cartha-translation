translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện lời ngỏ với toàn thể cộng đồng Israel, dù hình thái Hê-bơ-rơ là số ít; tránh đại từ “ngươi” vì mang sắc thái cổ. Cấu trúc lặp “bắt đầu đếm bảy tuần” được giữ để phản ánh nhịp và trọng tâm của nguyên văn.
