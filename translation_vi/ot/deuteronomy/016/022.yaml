source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֥ים לְ/ךָ֖ מַצֵּבָ֑ה אֲשֶׁ֥ר שָׂנֵ֖א יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: vi
  text: Ngươi không được dựng cho mình một trụ đá[a]—vật mà Yahweh, Đức Chúa Trời của ngươi, ghét.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đá dựng đứng” hoặc “trụ dùng trong việc thờ phượng”. Từ Hê-bơ-rơ chỉ một tảng đá được dựng lên, thường gắn với việc thờ phượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִים
  choice: dựng
  rationale: Dạng Hiphil của קום ở đây có nghĩa làm cho một vật đứng lên; “dựng” tự nhiên và chính xác đối với trụ đá.
- source_word: לְךָ
  choice: cho mình
  rationale: Diễn đạt sắc thái quy về chính người được truyền lệnh của đại từ số ít ngôi thứ hai.
- source_word: מַצֵּבָה
  choice: trụ đá
  rationale: Chỉ một tảng đá được dựng đứng, trong ngữ cảnh này gắn với việc thờ phượng. “Trụ đá” tránh khiến người đọc hiểu là cột kiến trúc, đồng thời không đưa sắc thái “thiêng” vào chính câu.
- source_word: אֲשֶׁר
  choice: là điều
  rationale: Liên kết mệnh đề quan hệ với toàn bộ việc dựng trụ đá; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được khả năng câu nói đến vật ấy hoặc hành vi ấy.
- source_word: שָׂנֵא
  choice: ghét
  rationale: Giữ nguyên sức mạnh trực tiếp của động từ Hê-bơ-rơ, không làm nhẹ thành “không ưa” hay chuyển sang “ghê tởm”.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc và trang trọng trong tiếng Việt để biểu đạt Tên Giao Ước יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Giữ đại từ sở hữu số ít và sắc thái quan hệ giao ước của cụm từ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản dịch giữ đây là danh riêng của Đức Chúa Trời. “Giê-hô-va” là dạng đã định hình và dễ nhận biết trong tiếng Việt; các dạng phiên âm khác vẫn có thể được cân nhắc theo quy chuẩn danh xưng chung của toàn bộ bản dịch.
- issue: Sắc thái thờ phượng của מַצֵּבָה
  choice: trụ đá, kèm chú thích về công dụng thờ phượng
  alternative: trụ đá thờ; trụ thiêng
  rationale: Nguyên ngữ gọi tên vật được dựng đứng nhưng không có một tính từ tương ứng trực tiếp với “thiêng”. Đưa bối cảnh thờ phượng vào chú thích vừa giúp người đọc hiểu vừa tránh giải quyết quá mức ngay trong câu.
- issue: Phạm vi của mệnh đề אֲשֶׁר שָׂנֵא
  choice: “là điều” giữ khả năng nói đến vật hoặc hành vi dựng vật ấy
  alternative: “mà ... ghét”, quy trực tiếp hơn về trụ đá
  rationale: Đại từ quan hệ giống đực אֲשֶׁר không đánh dấu rõ phạm vi quy chiếu; tiếng Việt nên tránh buộc câu chỉ nói đến bản thân vật hay chỉ nói đến hành vi.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng, trực tiếp. Dùng “ngươi” nhất quán với lời nói ở ngôi thứ hai số ít trong nguyên văn. Câu ngắn, dễ hiểu; chú thích làm rõ bối cảnh nghi lễ mà không thêm “thiêng” vào chính câu.
