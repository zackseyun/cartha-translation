  timestamp: '2026-07-19T21:08:36Z'
review_pass:
  verdict: revise
  source_fidelity: Cần bổ sung trạng ngữ "tại đó" trong mệnh đề về Danh Ngài để phản ánh שָׁם, và dùng dạng danh riêng phù hợp với quyết định Yahweh trong vệt kiểm chứng tiếng Anh, thay vì dạng Giê-hô-va/Jehovah.
  naturalness: Bản sửa vẫn giữ văn phong trang trọng, hiện đại. Dấu gạch ngang nối tự nhiên mệnh đề chỉ nơi chốn với mệnh lệnh tiếp theo; "vào thời điểm đã định" diễn đạt rõ מוֹעֵד.
  terminology: '"Yahweh" nhất quán với quyết định dự án về יהוה. "Đức Chúa Trời", "sinh tế Vượt Qua", và "Ai Cập" phù hợp ngữ vực Kinh Thánh tiếng Việt. Không nên thu hẹp הַפֶּסַח thành "chiên con".'
  issues:
  - severity: medium
    issue: Danh riêng יהוה được dịch là "Giê-hô-va".
    rationale: Vệt kiểm chứng tiếng Anh của dự án đã chọn Yahweh và nêu rõ không dùng Jehovah. "Giê-hô-va" là dạng tương ứng với Jehovah, nên không nhất quán với quyết định từ nguyên và dự án.
  - severity: medium
    issue: Bản chính thiếu "tại đó" trong cụm "để danh Ngài ngự".
    rationale: Cụm לְשַׁכֵּן שְׁמוֹ שָׁם có trạng ngữ שָׁם ("tại đó"). Chú thích đã nêu yếu tố này, nhưng bản chính cần giữ lại để đầy đủ và rõ nghĩa.
  revised_text: nhưng chỉ tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn để danh Ngài ngự tại đó[a]—tại đó, anh em phải dâng sinh tế Vượt Qua[b] vào buổi chiều, lúc mặt trời lặn, vào thời điểm đã định khi anh em ra khỏi Ai Cập[c].
