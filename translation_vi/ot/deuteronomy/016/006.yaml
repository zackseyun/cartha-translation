revisions:
- from: nhưng chỉ tại nơi Giê-hô-va, Đức Chúa Trời của anh em, sẽ chọn để danh Ngài ngự[a]. Tại đó, anh em phải dâng sinh tế Vượt Qua[b] vào buổi chiều, lúc mặt trời lặn, đúng thời điểm anh em ra khỏi Ai Cập[c].
  to: nhưng chỉ tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn để danh Ngài ngự tại đó[a]—tại đó, anh em phải dâng sinh tế Vượt Qua[b] vào buổi chiều, lúc mặt trời lặn, vào thời điểm đã định khi anh em ra khỏi Ai Cập[c].
  rationale: Bản sửa bổ sung "tại đó" cho שָׁם, thay Giê-hô-va bằng Yahweh để nhất quán với quyết định danh thánh trong audit trail, và diễn đạt מוֹעֵד bằng "thời điểm đã định" mà không áp đặt cách giải thích giáo phái. Các neo chú thích được giữ đúng thành phần tương ứng.
