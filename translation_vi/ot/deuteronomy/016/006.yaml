id: DEU.16.6
reference: Deuteronomy 16:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שַׁכֵּ֣ן שְׁמ֔/וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת הַ/פֶּ֖סַח בָּ/עָ֑רֶב כְּ/ב֣וֹא הַ/שֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְ/ךָ֥ מִ/מִּצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: vi
  text: nhưng chỉ tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn để danh Ngài ngự tại đó[a]—tại đó, anh em phải dâng sinh tế Vượt Qua[b] vào buổi chiều, lúc mặt trời lặn, vào thời điểm đã định khi anh em ra khỏi Ai Cập[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để Ngài khiến danh mình ngự tại đó” hoặc “để Ngài đặt danh mình tại đó.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “giết lễ vật Vượt Qua.”'
    reason: lexical_alternative
  - marker: c
    text: 'Dịch sát: “vào thời điểm anh em ra khỏi Ai Cập.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: nhưng chỉ tại
  rationale: Diễn đạt sức hạn định mạnh, đối lập với lệnh cấm dâng lễ tại bất cứ địa điểm nào ở câu trước.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để danh Ngài ngự
  rationale: Giữ hình ảnh thần học về danh Đức Chúa Trời ngự tại nơi được chọn, nhưng không khẳng định rằng bản thể Ngài bị giới hạn tại đó.
- source_word: תִּזְבַּח אֶת הַפֶּסַח
  choice: dâng sinh tế Vượt Qua
  rationale: Động từ זבח chỉ hành động giết và dâng lễ vật trong bối cảnh thờ phượng; cách dịch này làm rõ sắc thái tế lễ mà không giới hạn lễ vật thành 'chiên con'.
- source_word: בָּעָרֶב כְּבֹא הַשֶּׁמֶשׁ
  choice: vào buổi chiều, lúc mặt trời lặn
  rationale: Phản ánh cả hai cụm thời gian riêng biệt trong tiếng Hê-bơ-rơ và dùng lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: מוֹעֵד צֵאתְךָ מִמִּצְרָיִם
  choice: đúng thời điểm anh em ra khỏi Ai Cập
  rationale: Giữ mối liên hệ trực tiếp giữa thời điểm cử hành lễ và biến cố dân Y-sơ-ra-ên ra khỏi Ai Cập.
theological_decisions:
- issue: Công thức về danh Đức Chúa Trời tại nơi thờ phượng được chọn
  choice: để danh Ngài ngự
  alternative: để Ngài đặt danh mình tại đó; để Ngài khiến danh mình ngự tại đó
  rationale: Cách dịch giữ nguyên sự căng thẳng thần học giữa tính siêu việt của Đức Chúa Trời và sự hiện diện giao ước của Ngài, không diễn giải thành việc chính Đức Chúa Trời bị định vị tại đền thánh.
- issue: Đối tượng của động từ זבח
  choice: dâng sinh tế Vượt Qua
  alternative: giết lễ vật Vượt Qua; dâng lễ Vượt Qua
  rationale: Nguyên văn có thể nhấn mạnh hành động giết lễ vật hoặc toàn bộ hành động tế lễ. Bản chính chọn cách diễn đạt bao quát sắc thái nghi lễ, đồng thời ghi nhận phương án sát nghĩa hơn trong chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” cho đại từ số ít tập thể hướng đến toàn dân Y-sơ-ra-ên; viết hoa đại từ chỉ Đức Chúa Trời theo thông lệ tiếng Việt. Các dấu chú thích được đặt ngay sau thành phần tương ứng.
