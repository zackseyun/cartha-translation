base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: vi
  text: Hãy vui mừng trong kỳ lễ của anh em—anh em cùng con trai, con gái, nô lệ nam, nô lệ nữ của anh em, người Lê-vi, ngoại kiều[a], trẻ mồ côi[b] và góa phụ—những người đang sống trong các thành của anh em[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngoại kiều” ở đây là người không phải dân bản địa nhưng cư trú giữa dân Y-sơ-ra-ên; cũng có thể dịch là “kiều dân” hoặc “người ngoại quốc cư trú.”
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ có thể hiểu sát là “người không cha,” nhấn mạnh tình trạng thiếu sự bảo hộ trong xã hội; cũng có thể dịch là “trẻ không cha.”
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “ở trong các cổng của anh em,” một thành ngữ chỉ những người sống trong các thành hoặc cộng đồng của anh em.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Hãy vui mừng
  rationale: Dạng động từ trong ngữ cảnh luật lệ mang sắc thái mệnh lệnh; “hãy” diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: בְּחַגֶּךָ
  choice: trong kỳ lễ của anh em
  rationale: חַג chỉ kỳ lễ hành hương hay cuộc cử hành lễ hội; cách dịch này giữ cả ý thời gian lẫn sự tham dự.
- source_word: אַתָּה
  choice: anh em
  rationale: Đại từ độc lập nhấn mạnh chính người được truyền lệnh; vị trí đầu danh sách thể hiện sự nhấn mạnh mà không cần thêm từ nặng nề.
- source_word: וּבִנְךָ וּבִתֶּךָ
  choice: con trai, con gái của anh em
  rationale: Các danh từ số ít được dùng theo nghĩa phân phối trong lời luật dành cho từng người.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: tôi trai, tớ gái của anh em
  rationale: Hai từ chỉ nam và nữ ở địa vị lệ thuộc trong gia hộ. “Tôi trai, tớ gái” giữ sự phân biệt giới tính và thân phận bị ràng buộc, tránh làm nhẹ thành người phục vụ nói chung.
- source_word: וְהַלֵּוִי
  choice: người Lê-vi
  rationale: Cách gọi thông dụng trong tiếng Việt đối với thành viên chi phái Lê-vi.
- source_word: וְהַגֵּר
  choice: ngoại kiều
  rationale: גֵּר là người không thuộc bản địa nhưng cư trú lâu dài giữa cộng đồng; “ngoại kiều” gọn và thể hiện địa vị cư trú, có chú thích để tránh đồng nhất với phạm trù pháp lý hiện đại.
- source_word: וְהַיָּתוֹם
  choice: trẻ mồ côi
  rationale: Cách nói tự nhiên trong tiếng Việt cho nhóm trẻ mất sự bảo hộ của cha hoặc cha mẹ; chú thích bảo lưu sắc thái “không cha” của tiếng Hê-bơ-rơ.
- source_word: וְהָאַלְמָנָה
  choice: góa phụ
  rationale: Cách dịch chuẩn xác và tự nhiên cho người phụ nữ góa chồng.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: ở trong các thành của anh em
  rationale: “Trong các cổng” là lối hoán dụ Hê-bơ-rơ chỉ các thành hay cộng đồng thuộc phạm vi cư trú; dịch nghĩa giúp độc giả hiện đại hiểu ngay, đồng thời chú thích thành ngữ gốc.
theological_decisions:
- issue: Cách dịch עֶבֶד / אָמָה trong danh sách gia hộ
  choice: tôi trai / tớ gái
  alternative: đầy tớ nam / đầy tớ nữ; nô lệ nam / nô lệ nữ
  rationale: Bản dịch không che mờ địa vị lệ thuộc, nhưng dùng cặp từ Việt ngữ quen thuộc trong văn cảnh Kinh Thánh để vừa phân biệt giới tính vừa tránh áp đặt riêng một mô hình nô lệ hiện đại lên thuật ngữ cổ.
- issue: Cách dịch גֵּר
  choice: ngoại kiều
  alternative: kiều dân; người ngoại quốc cư trú; khách ngụ cư
  rationale: Thuật ngữ nói đến người không phải dân bản địa nhưng sống giữa Y-sơ-ra-ên và được kể vào những người cùng vui lễ; chú thích bảo tồn đặc điểm pháp lý-xã hội mà không đồng nhất với luật di trú hiện đại.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu. Dùng “anh em” số ít theo lối xưng hô cộng đồng của Phục Truyền Luật Lệ Ký; các sở hữu ngữ được gom tự nhiên trong tiếng Việt. Dấu gạch ngang làm rõ rằng mọi người được liệt kê đều cùng tham dự niềm vui của kỳ lễ.
