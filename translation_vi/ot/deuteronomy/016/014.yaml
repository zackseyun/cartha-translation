revisions:
- from: Hãy vui mừng trong kỳ lễ của anh em—anh em, con trai, con gái, tôi trai, tớ gái của anh em, người Lê-vi, ngoại kiều[a], trẻ mồ côi[b] và góa phụ ở trong các thành của anh em[c].
  to: Hãy vui mừng trong kỳ lễ của anh em—anh em cùng con trai, con gái, nô lệ nam, nô lệ nữ của anh em, người Lê-vi, ngoại kiều[a], trẻ mồ côi[b] và góa phụ—những người đang sống trong các thành của anh em[c].
  rationale: Sửa cặp từ chỉ người lệ thuộc thành “nô lệ nam, nô lệ nữ” để phản ánh trực tiếp hơn עֶבֶד / אָמָה và dùng tiếng Việt chuẩn hiện đại. Sắp xếp lại mệnh đề cuối để tránh giới hạn không cần thiết phạm vi của “ở trong các thành của anh em”, đồng thời vẫn giữ chú thích về thành ngữ “trong các cổng”. Không thay đổi nội dung hay các điểm mơ hồ của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:08:41Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh vui mừng trong kỳ lễ và danh sách những người được bao gồm. Tuy nhiên, “tôi trai, tớ gái” vừa cổ vừa không nhất quán về sắc thái, và có thể làm nhẹ địa vị lệ thuộc của עֶבֶד / אָמָה. Cần dùng một cặp thuật ngữ rõ ràng hơn là “nô lệ nam, nô lệ nữ”. Cấu trúc hiện tại cũng có thể khiến cụm “ở trong các thành của anh em” chỉ bổ nghĩa cho “góa phụ”, trong khi nguyên văn đặt mệnh đề quan hệ sau toàn bộ danh sách; cách đặt lại giúp giữ phạm vi mở của nguyên văn.
  naturalness: “Hãy vui mừng” và “kỳ lễ” tự nhiên, phù hợp văn phong mệnh lệnh trang trọng hiện đại. “Nô lệ nam, nô lệ nữ” rõ nghĩa và tự nhiên hơn “tôi trai, tớ gái”. Dùng dấu gạch ngang trước “những người...” làm mệnh đề cuối dễ đọc mà không buộc một phân tích cú pháp hẹp.
  terminology: Giữ “người Lê-vi”, “ngoại kiều”, “trẻ mồ côi”, và “góa phụ” là phù hợp. “Ngoại kiều” cần chú thích như bản thảo để xác định đây là người ngoại quốc cư trú, không phải một phân loại luật di trú hiện đại. “Nô lệ nam, nô lệ nữ” phản ánh rõ địa vị xã hội được nêu trong tiếng Hê-bơ-rơ.
  issues:
  - severity: medium
    issue: “Tôi trai, tớ gái” là cặp từ cổ và không đều về cách dùng.
    rationale: Cặp này kém tự nhiên trong tiếng Việt chuẩn hiện đại, đồng thời không diễn đạt minh bạch địa vị lệ thuộc của עֶבֶד và אָמָה trong danh sách gia hộ.
  - severity: low
    issue: Phạm vi của cụm cuối “ở trong các thành của anh em” chưa rõ.
    rationale: Khi đặt ngay sau “góa phụ”, tiếng Việt dễ hiểu cụm này chỉ áp dụng cho góa phụ. Đưa cụm ấy vào một mệnh đề tách bằng gạch ngang bảo lưu tốt hơn liên hệ với danh sách trong nguyên văn.
  revised_text: Hãy vui mừng trong kỳ lễ của anh em—anh em cùng con trai, con gái, nô lệ nam, nô lệ nữ của anh em, người Lê-vi, ngoại kiều[a], trẻ mồ côi[b] và góa phụ—những người đang sống trong các thành của anh em[c].
