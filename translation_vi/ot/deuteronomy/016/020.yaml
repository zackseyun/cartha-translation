source:
  edition: WLC
  text: צֶ֥דֶק צֶ֖דֶק תִּרְדֹּ֑ף לְמַ֤עַן תִּֽחְיֶה֙ וְ/יָרַשְׁתָּ֣ אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: vi
  text: Công lý, công lý[a], anh em phải theo đuổi, để anh em được sống và chiếm hữu[b] miền đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sự công chính, sự công chính.” Từ Hê-bơ-rơ צֶדֶק có thể chỉ cả công lý lẫn sự công chính; ở đây văn cảnh pháp lý thiên về nghĩa “công lý”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thừa hưởng”. Động từ Hê-bơ-rơ có thể mang nghĩa thừa hưởng cũng như chiếm hữu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: Công lý, công lý
  rationale: Danh từ được lặp lại để nhấn mạnh. Trong văn cảnh nói về thẩm phán, sự thiên vị và hối lộ, “công lý” diễn đạt rõ nhất sắc thái pháp lý-công cộng; giữ nguyên sự lặp lại thay vì làm nhẹ đi.
- source_word: תִּרְדֹּף
  choice: phải theo đuổi
  rationale: Động từ רדף có nghĩa đen là đuổi theo, theo đuổi. Cách dịch này giữ được hình ảnh chủ động và sức mạnh mệnh lệnh của lời chỉ dẫn.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả giữa việc theo đuổi công lý với sự sống và việc sở hữu đất.
- source_word: תִּחְיֶה
  choice: được sống
  rationale: Giữ nghĩa trực tiếp và rộng của חיה, không thêm ý thịnh vượng vốn chỉ có thể được hàm ý trong bối cảnh giao ước.
- source_word: וְיָרַשְׁתָּ
  choice: và chiếm hữu
  rationale: ירשׁ có thể chỉ việc nhận lấy, chiếm hữu hoặc thừa hưởng đất. “Chiếm hữu” phù hợp với việc dân Israel nhận và nắm giữ miền đất; khả năng dịch là “thừa hưởng” được ghi ở chú thích.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Giữ sắc thái của thuật ngữ giao ước quen thuộc trong Phục Truyền Luật Lệ Ký, chỉ miền đất được hứa ban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt quan hệ giao ước trong đại từ sở hữu. “Anh em” là cách xưng hô hiện đại, tự nhiên với cộng đồng Israel, dù tiếng Hê-bơ-rơ dùng ngôi thứ hai số ít mang tính tập thể.
- source_word: נֹתֵן לָךְ
  choice: đang ban cho anh em
  rationale: Phân từ נֹתֵן trình bày hành động ban đất như đang diễn ra hoặc sắp được thực hiện; “đang ban” giữ được tính sống động ấy.
theological_decisions:
- issue: Nghĩa của צֶדֶק trong văn cảnh xét xử
  choice: công lý
  alternative: sự công chính; điều đúng đắn
  rationale: Văn cảnh trực tiếp nói về thẩm phán, sự thiên vị và hối lộ, nên nghĩa pháp lý của từ này nổi bật. Chú thích vẫn bảo lưu sắc thái rộng hơn là “sự công chính”.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản văn dùng danh riêng giao ước יְהוָה. “Yahweh” giữ danh riêng ấy, không thay bằng tước hiệu.
- issue: Đại từ ngôi thứ hai số ít chỉ tập thể Israel
  choice: anh em
  alternative: ngươi
  rationale: “Anh em” tự nhiên và dễ hiểu trong tiếng Việt hiện đại khi Môi-se nói với cộng đồng Israel; không biến đối tượng thành một cá nhân riêng lẻ, dù hình thái Hê-bơ-rơ là số ít.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ nguyên phép lặp nhấn mạnh của nguyên văn. Dùng “anh em” để chuyển lời xưng hô tập thể với Israel; dùng “Yahweh” cho danh riêng יְהוָה.
