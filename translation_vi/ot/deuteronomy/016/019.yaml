source:
  edition: WLC
  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: vi
  text: Ngươi không được bẻ cong công lý, không được thiên vị[a], cũng không được nhận hối lộ, vì của hối lộ làm mù mắt người khôn ngoan và xuyên tạc lời của người công chính[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “nhận biết khuôn mặt,” một thành ngữ có nghĩa là ưu ái hoặc thiên vị.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “xuyên tạc vụ việc của người công chính.” Từ Hê-bơ-rơ có thể chỉ lời nói hoặc, trong bối cảnh pháp lý, sự việc hay vụ kiện của họ.
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: bẻ cong công lý
  rationale: Động từ Hiphil của נטה cùng với מִשְׁפָּט diễn tả việc làm cho phán quyết chệch khỏi điều đúng. “Bẻ cong công lý” vừa giữ hình ảnh của nguyên văn vừa rõ nghĩa trong bối cảnh xét xử.
- source_word: תַכִּיר פָּנִים
  choice: thiên vị
  rationale: Cụm này theo nghĩa đen là “nhận biết khuôn mặt,” một thành ngữ Hê-bơ-rơ chỉ việc ưu ái một bên khi xét xử. “Thiên vị” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: שֹׁחַד
  choice: của hối lộ
  rationale: Trong bối cảnh pháp lý, từ này chỉ vật hoặc khoản lợi dùng để mua chuộc người xét xử. “Của hối lộ” phù hợp cả với hành động “nhận” và với chủ thể gây mù quáng trong mệnh đề sau.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: làm mù mắt người khôn ngoan
  rationale: 'Cách dịch giữ nguyên hình ảnh mạnh và rõ của tiếng Hê-bơ-rơ: hối lộ làm hỏng khả năng nhận định ngay cả của người có sự khôn ngoan.'
- source_word: חֲכָמִים
  choice: người khôn ngoan
  rationale: Danh từ số nhiều giống đực được hiểu theo nghĩa khái quát, chỉ những người khôn ngoan chứ không nhất thiết chỉ nam giới.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: xuyên tạc lời của người công chính
  rationale: סלף có nghĩa là làm méo mó hoặc xuyên tạc; דִּבְרֵי trước hết có thể là “lời,” nhưng trong bối cảnh pháp lý cũng có thể chỉ sự việc hay vụ kiện. Bản chính giữ nghĩa gần mặt chữ và chú thích nêu khả năng pháp lý.
- source_word: צַדִּיקִם
  choice: người công chính
  rationale: Trong ngữ cảnh này, từ chỉ những người ngay thẳng hoặc thuộc về phía có lẽ phải. “Người công chính” giữ được phạm vi đạo đức và pháp lý, không thu hẹp thành “người vô tội”.
theological_decisions:
- issue: Đối tượng của các mệnh lệnh ở ngôi thứ hai số ít
  choice: Anh em
  alternative: Ngươi
  rationale: Tiếng Hê-bơ-rơ dùng ngôi thứ hai số ít để nói với dân Y-sơ-ra-ên như một cộng đồng. “Anh em” truyền đạt lời kêu gọi cộng đồng bằng tiếng Việt hiện đại, tự nhiên hơn “ngươi,” mà không biến lời này thành chỉ dẫn cho một cá nhân riêng lẻ.
- issue: Phạm vi nghĩa của צַדִּיקִים trong bối cảnh xét xử
  choice: người công chính
  alternative: người vô tội / người có lẽ phải
  rationale: Nguyên văn có thể nhấn mạnh tư cách đạo đức hoặc vị thế đúng đắn về pháp lý. “Người công chính” không khóa câu vào riêng một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Câu giữ nhịp ba mệnh lệnh phủ định của nguyên văn, đồng thời bảo tồn các hình ảnh “bẻ cong” và “làm mù mắt.” Tất cả ký hiệu chú thích [a], [b] đều xuất hiện đúng tại cụm từ liên quan trong bản chính.
