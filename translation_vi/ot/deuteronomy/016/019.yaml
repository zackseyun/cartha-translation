  source_fidelity: Bản dịch truyền đạt đúng ba mệnh lệnh pháp lý, nghĩa của “hối lộ,” cùng hai hình ảnh nguyên ngữ là làm mù mắt và làm sai lệch lời/vụ việc của người công chính. Tuy nhiên, các động từ Hê-bơ-rơ đều ở ngôi thứ hai số ít; “Anh em” chuyển rõ thành số nhiều, trong khi tiếng Việt vẫn có thể giữ ngôi xưng này trong văn phong Kinh Thánh trang trọng.
  naturalness: “Bẻ cong công lý,” “thiên vị,” “nhận hối lộ,” và “làm mù mắt người khôn ngoan” đều tự nhiên, rõ ràng trong tiếng Việt hiện đại. “Ngươi không được” giữ được sắc thái trang trọng của thể luật pháp/Kinh Thánh mà không làm câu khó hiểu.
