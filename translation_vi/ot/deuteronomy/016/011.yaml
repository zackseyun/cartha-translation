  terminology: “Yahweh”, “Đức Chúa Trời”, “nô lệ nam/nữ”, “người Lê-vi”, và “người mồ côi” đều phù hợp. “Danh Ngài ngự tại đó” là công thức tiếng Việt tự nhiên cho công thức Đệ Nhị Luật, còn chú thích cần nêu rõ sắc thái gây khiến của động từ Hê-bơ-rơ.
