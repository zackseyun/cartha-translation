base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: vi
  text: Anh em phải vui mừng trước mặt Yahweh, Đức Chúa Trời của anh em—chính anh em, con trai và con gái của anh em, nô lệ nam và nô lệ nữ của anh em, người Lê-vi sống trong các thành của anh em, cùng người ngoại kiều, người mồ côi và góa phụ đang ở giữa anh em—tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn để danh Ngài ngự tại đó[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Theo sát cấu trúc Hê-bơ-rơ: “để làm cho danh Ngài ngự tại đó.”'
    reason: source_form
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: phải vui mừng
  rationale: Diễn đạt lực mệnh lệnh của thể vị hoàn trong ngữ cảnh luật lệ, đồng thời giữ sắc thái hân hoan trong lễ thờ phượng.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Giữ thành ngữ Hê-bơ-rơ và ý niệm vui mừng trong sự hiện diện của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אַתָּה
  choice: chính anh em
  rationale: Đại từ được nêu rõ để nhấn mạnh trong nguyên văn; “chính” giữ trọng âm ấy, còn “anh em” là cách xưng hô cộng đồng tự nhiên trong tiếng Việt hiện đại.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: nô lệ nam, nô lệ nữ của anh em
  rationale: Giữ rõ địa vị lệ thuộc và sự phân biệt giới tính của hai danh từ, không làm nhẹ thành nghĩa phục vụ nói chung.
- source_word: בִּשְׁעָרֶיךָ
  choice: ở trong các thành của anh em
  rationale: “Trong các cổng của anh em” là thành ngữ chỉ các thành hoặc cộng đồng địa phương; bản dịch chuyển tải nghĩa trong tiếng Việt tự nhiên.
- source_word: וְהַגֵּר
  choice: ngoại kiều cư ngụ
  rationale: Chỉ người không thuộc bản địa nhưng sống lâu dài giữa cộng đồng Israel và ở dưới trật tự xã hội của họ.
- source_word: וְהַיָּתוֹם
  choice: người mồ côi
  rationale: Cách nói tự nhiên và trang trọng trong tiếng Việt; chú thích giữ nghĩa hẹp hơn có thể có là người không cha.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để danh Ngài ngự tại đó
  rationale: Giữ công thức thần học đặc trưng của Phục Truyền Luật Lệ Ký trong tiếng Việt tự nhiên; chú thích nêu rõ hình thái gây khiến của động từ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh giao ước, vì vậy bản dịch giữ danh riêng thay vì thay bằng tước hiệu.
- issue: Địa vị của עבד và אמה
  choice: nô lệ nam / nô lệ nữ
  alternative: đầy tớ nam / đầy tớ nữ
  rationale: Trong danh sách hộ gia đình thuộc bối cảnh luật pháp-xã hội, địa vị lệ thuộc là thành tố có ý nghĩa và không nên bị làm nhẹ.
- issue: Công thức nơi thánh לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để danh Ngài ngự tại đó
  alternative: để khiến danh Ngài ngự tại đó
  rationale: Bản chính giữ cách nói tự nhiên và sự căng thẳng thần học giữa sự siêu việt của Đức Chúa Trời với sự hiện diện giao ước qua danh Ngài; chú thích bảo toàn sắc thái gây khiến của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo nghĩa tập thể để chuyển đại từ số ít đại diện trong lời luật pháp; dùng dấu gạch ngang để làm rõ danh sách những người cùng dự lễ.
