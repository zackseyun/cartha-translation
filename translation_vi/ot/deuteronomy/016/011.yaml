- from: Anh em phải vui mừng trước mặt Yahweh, Đức Chúa Trời của anh em—chính anh em, con trai, con gái, nô lệ nam, nô lệ nữ của anh em, người Lê-vi ở trong các thành của anh em, ngoại kiều cư ngụ[a], người mồ côi[b] và góa phụ ở giữa anh em—tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn để danh Ngài ngự tại đó[c].
  to: Anh em phải vui mừng trước mặt Yahweh, Đức Chúa Trời của anh em—chính anh em, con trai và con gái của anh em, nô lệ nam và nô lệ nữ của anh em, người Lê-vi sống trong các thành của anh em, cùng người ngoại kiều, người mồ côi và góa phụ đang ở giữa anh em—tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn để danh Ngài ngự tại đó[c].
