base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: vi
  text: Ngươi phải giữ Lễ Lều Tạm trong bảy ngày[a], khi ngươi thu hoạch từ sân đập lúa và từ nơi ép nho của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Lễ Các Lều”; tiếng Hê-bơ-rơ nói đến những chiếc lều hay nơi trú tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: Lễ Lều Tạm
  rationale: חַג chỉ một kỳ lễ hành hương, còn סֻכּוֹת là các lều hoặc nơi trú tạm. “Lễ Lều Tạm” vừa tự nhiên trong tiếng Việt, vừa giữ hình ảnh cụ thể của tên lễ.
- source_word: תַּעֲשֶׂה לְךָ
  choice: ngươi phải giữ
  rationale: Động từ עשה có nghĩa cơ bản là “làm”, nhưng khi đi với tên kỳ lễ thì mang nghĩa tuân giữ hoặc cử hành lễ. “Phải giữ” truyền đạt nghĩa vụ pháp lệnh mà không dịch máy móc.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài bảy ngày.
- source_word: בְּאָסְפְּךָ
  choice: khi thu hoa lợi
  rationale: בְּ với động từ nguyên mẫu אסף tạo mệnh đề thời gian, không nhất thiết xác định là sau khi đã thu xong. “Khi thu” giữ được độ mở ấy; “hoa lợi” làm rõ đối tượng được gom về từ hai nơi được nêu tiếp theo.
- source_word: מִגָּרְנְךָ
  choice: từ sân đập lúa
  rationale: גֹּרֶן là nơi đập và sàng lúa; giữ hình ảnh nông nghiệp cụ thể thay vì khái quát thành “mùa màng”.
- source_word: וּמִיִּקְבֶךָ
  choice: và từ bàn ép nho
  rationale: יֶקֶב chỉ nơi ép nho hoặc bể hứng liên quan. “Bàn ép nho” là cách gọi rõ nghĩa, dễ hiểu trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “ngươi” số ít để phản ánh các hậu tố và động từ ngôi thứ hai số ít trong tiếng Hê-bơ-rơ, đồng thời phù hợp lối xưng hô trang trọng của Ngũ Kinh. Duy trì hình ảnh sân đập lúa và nơi ép nho thay vì khái quát hóa toàn bộ thành mùa thu hoạch.
