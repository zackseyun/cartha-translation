revisions:
- from: Ngươi phải giữ Lễ Lều Tạm trong bảy ngày[a], khi thu hoa lợi từ sân đập lúa và từ bàn ép nho của ngươi.
  to: Ngươi phải giữ Lễ Lều Tạm trong bảy ngày[a], khi ngươi thu hoạch từ sân đập lúa và từ nơi ép nho của ngươi.
  rationale: Chỉ thay hai cách diễn đạt nông nghiệp để tránh gán cho יֶקֶב nghĩa “bàn ép” và để giữ sát hơn động từ “thu gom/thu hoạch” của bản gốc. Tên lễ, sắc thái mệnh lệnh, thời hạn bảy ngày và chú thích từ vựng được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:08:36Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh cử hành lễ trong bảy ngày và bối cảnh thu gom nông sản từ sân đập lúa cùng nơi ép nho. Tuy nhiên, “bàn ép nho” thu hẹp và cụ thể hóa יֶקֶב theo một kiểu dụng cụ không được bản Hê-bơ-rơ xác định; từ này chỉ nơi/thiết bị ép nho, thường là bồn hay nơi ép nho.
  naturalness: “Ngươi phải giữ” phù hợp văn phong luật pháp trang trọng và nhất quán với ngôi số ít. “Khi ngươi thu hoạch” tự nhiên hơn “khi thu hoa lợi”, đồng thời tránh thêm khái niệm khái quát “hoa lợi” vào động từ “thu gom”.
  terminology: “Lễ Lều Tạm” là tên gọi dễ nhận biết và chấp nhận được trong tiếng Việt hiện đại; chú thích giải thích đúng nghĩa đen của סֻכּוֹת. “Sân đập lúa” phù hợp với גֹּרֶן. “Nơi ép nho” là tương đương trung tính, chính xác hơn “bàn ép nho” đối với יֶקֶב.
  issues:
  - severity: medium
    issue: “bàn ép nho” quá đặc thù cho יֶקֶב.
    rationale: יֶקֶב không xác định một “bàn” ép; nó có thể chỉ nơi ép, bồn ép, hay cơ sở ép nho. “Nơi ép nho” giữ được nghĩa cụ thể mà không áp đặt hình dạng của thiết bị.
  - severity: low
    issue: “thu hoa lợi” diễn giải rộng hơn động từ בְּאָסְפְּךָ.
    rationale: Bản gốc nói “khi ngươi thu gom/thu hoạch”, rồi nêu rõ hai nguồn là sân đập lúa và nơi ép nho. Dùng “khi ngươi thu hoạch” giữ cách diễn đạt gọn và gần bản gốc hơn.
  revised_text: Ngươi phải giữ Lễ Lều Tạm trong bảy ngày[a], khi ngươi thu hoạch từ sân đập lúa và từ nơi ép nho của ngươi.
  revised_footnotes:
