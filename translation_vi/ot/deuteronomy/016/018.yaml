source:
  edition: WLC
  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: vi
  text: Anh em phải lập các thẩm phán và viên chức cho mình tại tất cả các cổng thành mà Yahweh, Đức Chúa Trời của anh em, ban cho anh em[a], theo từng bộ tộc. Họ phải xét xử dân chúng cách công minh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong mọi thành của anh em”; nguyên văn là “tại tất cả các cổng của anh em”. Khu vực cổng thành là trung tâm hành chính và xét xử.'
    reason: cultural_note
  - marker: b
    text: 'Hoặc: “bằng phán quyết công chính”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: các thẩm phán
  rationale: Danh từ chỉ những người đưa ra phán quyết pháp lý; “thẩm phán” là cách diễn đạt rõ ràng và phù hợp với bối cảnh tư pháp.
- source_word: שֹׁטְרִים
  choice: quan chức
  rationale: Từ này chỉ những người thi hành nhiệm vụ hành chính gắn với việc quản trị và xét xử. “Quan chức” giữ được nghĩa thể chế mà không xác định quá mức chức năng cụ thể.
- source_word: תִּתֶּן
  choice: phải lập
  rationale: Nghĩa đen là “đặt/ban”, nhưng trong ngữ cảnh là thiết lập người vào chức vụ; “lập” tự nhiên trong tiếng Việt và truyền đạt đúng chức năng của động từ.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: tại tất cả các cổng thành
  rationale: Giữ hình ảnh nguyên văn “các cổng” đồng thời thêm “thành” để độc giả Việt hiểu đây là cổng đô thị, nơi diễn ra các hoạt động hành chính và tư pháp.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản nguồn, thay vì thay thế bằng một tước hiệu.
- source_word: לִשְׁבָטֶיךָ
  choice: theo từng bộ tộc
  rationale: Cụm từ biểu thị việc tổ chức hoặc phân bổ theo cơ cấu bộ tộc; “theo từng bộ tộc” diễn đạt tự nhiên ý này.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: Họ phải xét xử dân chúng
  rationale: Động từ mang nghĩa tư pháp trong ngữ cảnh này; đại từ “họ” quy chiếu rõ đến các thẩm phán và quan chức vừa được nêu.
- source_word: מִשְׁפַּט צֶדֶק
  choice: bằng sự phán xét công chính
  rationale: Cụm danh từ kết hợp quyết định pháp lý với phẩm chất ngay thẳng; cách dịch này giữ cả chiều kích tư pháp lẫn đạo đức.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh יהוה; phiên âm “Yahweh” bảo tồn đây là danh riêng giao ước thay vì thay bằng một tước hiệu.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh em” thể hiện ngôi thứ hai số ít mang nghĩa tập thể, hướng đến toàn dân Israel. Giữ hình ảnh “cổng thành” của bản nguồn và giải thích chức năng văn hóa trong chú thích.
