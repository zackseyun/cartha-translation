revisions:
- from: Anh em phải lập các thẩm phán và quan chức cho mình tại tất cả các cổng thành mà Yahweh, Đức Chúa Trời của anh em, ban cho anh em[a], theo từng bộ tộc. Họ phải xét xử dân chúng bằng sự phán xét công chính[b].
  to: Anh em phải lập các thẩm phán và viên chức cho mình tại tất cả các cổng thành mà Yahweh, Đức Chúa Trời của anh em, ban cho anh em[a], theo từng bộ tộc. Họ phải xét xử dân chúng cách công minh[b].
  rationale: Bản sửa chỉ cải thiện độ tự nhiên và sự nhất quán thuật ngữ, không thay đổi nghĩa. “Cách công minh” là cách diễn đạt Việt ngữ tự nhiên cho yêu cầu xét xử công chính; chú thích giữ phương án sát hơn với cấu trúc nguyên ngữ. “Viên chức” phản ánh chức năng hành chính của שֹׁטְרִים mà không xác định quá mức vai trò của họ.
  reviewer_model: gpt-5.6-terra
