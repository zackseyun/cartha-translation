    rationale: Cụm này là bản dịch quá sát cấu trúc danh từ và dễ gây cảm giác nặng nề. “Xét xử dân chúng cách công minh” diễn đạt rõ hành vi tư pháp và phẩm chất công chính mà không thêm nghĩa.
  - severity: low
    issue: “quan chức” có thể gợi cách gọi chức sắc hành chính hiện đại.
    rationale: שֹׁטְרִים chỉ các nhân viên/chức viên hành chính có liên hệ đến hoạt động pháp lý. “Viên chức” giữ tính khái quát thể chế và hợp văn cảnh hơn.
