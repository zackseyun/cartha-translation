- from: 'Mỗi năm ba lần, mọi người nam trong anh em phải đến trình diện trước mặt Yahweh, Đức Chúa Trời của anh em, tại nơi Ngài sẽ chọn: vào Lễ Bánh Không Men, Lễ Các Tuần và Lễ Lều Tạm[a]. Không ai được đến trình diện trước mặt Yahweh với hai tay không[b].'
