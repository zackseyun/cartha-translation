  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: vi
  text: 'Mỗi năm ba lần, mọi người nam trong anh em phải đến trình diện trước mặt Yahweh, Đức Chúa Trời của anh em, tại nơi Ngài sẽ chọn: vào Lễ Bánh Không Men, Lễ Các Tuần và Lễ Lều Tạm[a]. Không ai được đến trình diện trước mặt Yahweh với hai tay không[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lễ Lều Tạm” là tên gọi truyền thống; từ Hê-bơ-rơ sukkot nghĩa là “các lều/chòi.”
    reason: alternative_reading
  - marker: b
    text: “Với hai tay không” nghĩa là đến mà không mang lễ vật phải dâng.
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: đến trình diện
  rationale: Dạng Niphal của ראה có thể hiểu sát là “được thấy”, nhưng trong ngữ cảnh hành hương mang nghĩa thành ngữ là đến trình diện trước Đức Chúa Trời. “Đến trình diện” tự nhiên và rõ trong tiếng Việt.
- source_word: כָל זְכוּרְךָ
  choice: mọi người nam trong anh em
  rationale: Giữ đúng phạm vi pháp lý chỉ những người nam của cộng đồng, đồng thời diễn đạt tự nhiên hơn cách nói “mọi giống đực của anh em”.
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: trước mặt Yahweh, Đức Chúa Trời của anh em
  rationale: “Trước mặt” giữ hình ảnh פני và truyền đạt thành ngữ chỉ sự hiện diện; Yahweh được giữ như danh riêng giao ước.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: tại nơi Ngài sẽ chọn
  rationale: Giữ lực hướng tới tương lai của động từ chưa hoàn thành và chủ đề địa điểm thờ phượng do chính Đức Chúa Trời chọn.
- source_word: חַג הַמַּצּוֹת
  choice: Lễ Bánh Không Men
  rationale: Tên gọi minh bạch, quen thuộc và phản ánh trực tiếp מַצּוֹת.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: Lễ Các Tuần
  rationale: Dịch trực tiếp tên lễ trong tiếng Hê-bơ-rơ, không đưa tên gọi Hy Lạp về sau là Lễ Ngũ Tuần vào văn cảnh.
- source_word: חַג הַסֻּכּוֹת
  choice: Lễ Lều Tạm
  rationale: Phản ánh các lều tạm סֻכּוֹת và dùng tên lễ dễ hiểu trong tiếng Việt hiện đại.
- source_word: רֵיקָם
  choice: với hai tay không
  rationale: Thành ngữ tiếng Việt tự nhiên, diễn tả việc đến mà không mang lễ vật theo yêu cầu của văn cảnh.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Giữ danh riêng được văn bản Hê-bơ-rơ dùng trực tiếp, thay vì thay bằng một tước hiệu.
- issue: Phạm vi giới tính của nghĩa vụ hành hương
  choice: mọi người nam trong anh em
  alternative: mọi người trong anh em
  rationale: Nguồn văn chỉ rõ người nam; bản dịch không trung hòa giới tính và không mở rộng nghĩa vụ pháp lý cho toàn thể dân chúng.
- issue: Sắc thái của יֵרָאֶה
  choice: đến trình diện
  alternative: được thấy
  rationale: Giữ chức năng thành ngữ trong luật về các lễ hành hương, trong khi chú thích ghi nhận hình thức sát chữ để bảo tồn sự mơ hồ ngữ pháp.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp lời luật giao ước. Đại từ số nhiều “anh em” phản ánh hậu tố ngôi thứ hai số ít mang nghĩa tập thể trong lời truyền cho Israel. Dùng “Ngài” cho chủ thể thần linh và giữ nguyên danh Yahweh.
