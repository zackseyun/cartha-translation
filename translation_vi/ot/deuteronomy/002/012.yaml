  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: vi
  text: Trước kia, người Hô-rít sống tại Sê-i-rơ; nhưng con cháu Ê-sau đã tước đất của họ[a], tiêu diệt họ khỏi trước mặt mình[b], rồi định cư ở chỗ họ, cũng như Y-sơ-ra-ên đã làm đối với đất cơ nghiệp của mình[c], là đất Yahweh đã ban cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã đuổi họ đi.” Động từ Hê-bơ-rơ có thể chỉ việc chiếm quyền sở hữu bằng cách tước đất của cư dân trước.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “khỏi trước mặt họ,” một thành ngữ nói đến việc loại bỏ ai khỏi sự hiện diện của mình.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đất làm cơ nghiệp của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: người Hô-rít
  rationale: Dùng tên gọi dân tộc quen thuộc trong tiếng Việt, thay vì phiên âm sát hình thái Hô-rim.
- source_word: לְפָנִים
  choice: trước kia
  rationale: Diễn đạt đúng nghĩa thời gian trong ngữ cảnh bằng tiếng Việt tự nhiên.
- source_word: יִירָשׁוּם
  choice: đã chiếm đất của họ
  rationale: Trong bối cảnh chinh phục, ירשׁ chỉ việc chiếm quyền sở hữu bằng cách tước đất của cư dân trước; cách dịch này rõ nghĩa và tự nhiên hơn một thuật ngữ pháp lý nặng nề.
- source_word: וַיַּשְׁמִידוּם
  choice: tiêu diệt họ
  rationale: Giữ sắc thái mạnh của שׁמד nhưng không tự ý xác định mức độ tuyệt diệt vượt quá câu chữ.
- source_word: מִפְּנֵיהֶם
  choice: khỏi nơi ấy
  rationale: Chuyển thành ngữ Hê-bơ-rơ chỉ việc loại họ khỏi sự hiện diện và địa bàn của bên chiến thắng sang tiếng Việt tự nhiên; chú thích bảo lưu hình ảnh nguyên văn.
- source_word: תַּחְתָּם
  choice: thay chỗ họ
  rationale: Thể hiện việc cư dân mới thay thế cư dân cũ tại cùng địa bàn.
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: cũng như Y-sơ-ra-ên đã làm
  rationale: Giữ nguyên phép so sánh lịch sử của bản Hê-bơ-rơ.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: đối với vùng đất thuộc quyền sở hữu của mình
  rationale: יְרֻשָּׁה bao hàm đất được nhận làm cơ nghiệp và nắm giữ; cách dịch này giữ đại từ số ít quy chiếu về Y-sơ-ra-ên như một tập thể.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh xưng riêng quen thuộc, trang trọng trong truyền thống Kinh Thánh tiếng Việt để biểu thị Tứ Tự Danh.
- source_word: לָהֶם
  choice: cho họ
  rationale: Giữ sự chuyển đổi của nguyên văn từ Y-sơ-ra-ên ở số ít tập thể sang đại từ số nhiều chỉ dân chúng.
theological_decisions:
- issue: Mốc thời gian của lời so sánh với điều Y-sơ-ra-ên đã làm
  choice: Giữ lời so sánh như một phát biểu lịch sử, không giải quyết tranh luận về niên đại hay biên tập.
  alternative: Diễn đạt né tránh hàm ý rằng Y-sơ-ra-ên đã chiếm vùng đất ấy, hoặc xem mệnh đề là lời chú giải muộn.
  rationale: Bản Hê-bơ-rơ hiện có trực tiếp so sánh việc con cháu Ê-sau thay thế người Hô-rít với điều Y-sơ-ra-ên đã làm; bản dịch không nên áp đặt một giải pháp phê bình hay hòa giải.
- issue: Cách chuyển יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Trời
  rationale: Giữ đây là danh riêng thay vì thay bằng một tước hiệu chung, đồng thời dùng hình thức quen thuộc và trang trọng với độc giả Kinh Thánh tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể chuyện của nguyên văn, bảo lưu sự chuyển từ Y-sơ-ra-ên số ít tập thể (“mình”) sang dân Y-sơ-ra-ên số nhiều (“họ”). Các địa danh và dân danh dùng lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
