    rationale: Audit trail và chính sách dự án quy định dùng “Yahweh” cho Tứ Tự Danh. “Giê-hô-va” là một dạng truyền thống khác, nên không nhất quán với bản dịch đích đã được chỉ định.
  - severity: low
    issue: “Vùng đất thuộc quyền sở hữu của mình” chưa thể hiện rõ sắc thái cơ nghiệp/thừa hưởng của יְרֻשָּׁה.
    rationale: Cụm này không sai về sở hữu, nhưng “đất cơ nghiệp của mình” bảo lưu tốt hơn trường nghĩa possession/inheritance của nguyên ngữ và phù hợp văn phong tiếng Việt Kinh Thánh.
