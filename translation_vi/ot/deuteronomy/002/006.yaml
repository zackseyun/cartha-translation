revisions:
- from: Các anh phải dùng bạc mua thức ăn của họ để ăn; cũng phải dùng bạc mua nước của họ để uống.
  to: Anh em phải mua thức ăn của họ bằng bạc để ăn; cũng phải mua nước của họ bằng bạc để uống.
  rationale: Chỉ điều chỉnh cách xưng hô để không giới hạn người nghe vào nam giới và chỉnh nhẹ trật tự từ cho tự nhiên hơn. Nghĩa mua từ họ bằng bạc và sắc thái mục đích/kết quả của “để ăn/để uống” được giữ nguyên.
