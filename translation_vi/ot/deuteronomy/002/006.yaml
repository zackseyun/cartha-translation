base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: vi
  text: Anh em phải mua thức ăn của họ bằng bạc để ăn; cũng phải mua nước của họ bằng bạc để uống.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹכֶל
  choice: thức ăn
  rationale: Danh từ chỉ chung đồ ăn hoặc lương thực, không nhất thiết chỉ ngũ cốc.
- source_word: תִּשְׁבְּרוּ
  choice: mua
  rationale: Trong ngữ cảnh giao dịch thức ăn bằng bạc, động từ mang nghĩa mua, không phải chiếm lấy.
- source_word: מֵאִתָּם
  choice: của họ
  rationale: Tiếng Hebrew chỉ nguồn cung; tiếng Việt tự nhiên dùng “mua ... của họ”.
- source_word: בַּכֶּסֶף
  choice: dùng bạc
  rationale: Giữ hình ảnh cụ thể của כֶּסֶף là bạc dùng làm phương tiện thanh toán, thay vì diễn giải khái quát thành tiền.
- source_word: וַאֲכַלְתֶּם
  choice: để ăn
  rationale: Trong chuỗi chỉ thị này, động từ phối hợp diễn tả kết quả hoặc mục đích dự kiến của việc mua; “để ăn” tự nhiên và không khẳng định quá mức sắc thái cú pháp.
- source_word: וְגַם
  choice: cũng
  rationale: Thể hiện quan hệ bổ sung của mệnh lệnh song song về nước.
- source_word: מַיִם
  choice: nước
  rationale: Tương đương trực tiếp và tự nhiên.
- source_word: תִּכְרוּ
  choice: mua
  rationale: Dù כרה ở nơi khác có thể mang nghĩa “đào”, cấu trúc song song với việc mua thức ăn và cụm “của họ, bằng bạc” xác định nghĩa mua nước.
- source_word: וּשְׁתִיתֶם
  choice: để uống
  rationale: Diễn đạt tự nhiên kết quả hoặc mục đích dự kiến của việc mua nước, tương ứng với vế trước.
theological_decisions:
- issue: Sức nặng đạo đức-pháp lý của mệnh lệnh đối với tài nguyên của Ê-đôm
  choice: Dân Israel phải trả bạc để mua thức ăn và nước, thay vì tự ý lấy.
  alternative: Dịch sát hình thức hơn là “rồi các anh sẽ ăn ... rồi các anh sẽ uống”, để quan hệ mục đích hoặc kết quả ít rõ hơn.
  rationale: Ngữ cảnh ra lệnh phải mua các nhu yếu phẩm của cư dân địa phương. Cách dịch duy trì yêu cầu đền bù hợp pháp mà không thêm một khẳng định giáo lý ngoài văn bản.
- issue: Quan hệ cú pháp của וַאֲכַלְתֶּם và וּשְׁתִיתֶם
  choice: Dịch là “để ăn ... để uống”, biểu thị mục đích hoặc kết quả dự kiến.
  alternative: “và ăn ... và uống” hoặc “rồi sẽ ăn ... rồi sẽ uống”.
  rationale: Waw cộng thể hoàn thành có thể được giữ bằng phép phối hợp hình thức, nhưng trong lời chỉ dẫn này tiếng Việt tự nhiên diễn tả quan hệ hướng đích bằng “để”; lựa chọn này vẫn thừa nhận sắc thái có thể là kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và trực tiếp. Dùng “các anh” vì lời nói hướng đến cộng đồng Israel, đồng thời tránh lối cổ “các ngươi”. Không đặt chú thích vì bản dịch chính đã diễn đạt tự nhiên và không có dị bản văn bản cần nêu.
