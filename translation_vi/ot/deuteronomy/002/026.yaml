source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח מַלְאָכִים֙ מִ/מִּדְבַּ֣ר קְדֵמ֔וֹת אֶל סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: vi
  text: 'Tôi bèn sai các sứ giả từ hoang mạc Kê-đê-mốt đến Si-hôn, vua Hết-bôn, với những lời hòa bình[a], rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với những đề nghị hòa bình.” Nguyên văn Hê-bơ-rơ là “những lời hòa bình,” một cách nói chỉ lời mở đầu ngoại giao mang thiện chí hòa bình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Vậy, ... tôi sai
  rationale: Động từ với waw liên tiếp đưa trình thuật tiến tới và giữ ngôi thứ nhất số ít; “Vậy” diễn đạt tự nhiên quan hệ tiếp nối trong văn cảnh.
- source_word: מַלְאָכִים
  choice: các sứ giả
  rationale: Trong bối cảnh ngoại giao giữa người với người, từ này chỉ những người được sai đi, không phải thiên sứ.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: từ hoang mạc Kê-đê-mốt
  rationale: “Hoang mạc” diễn đạt địa hình מִדְבָּר tự nhiên trong tiếng Việt; Kê-đê-mốt được phiên âm như địa danh.
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: đến gặp Si-hôn, vua Hết-bôn
  rationale: “Đến gặp” làm rõ đích đến mang tính nhân vị của phái đoàn mà không thêm ý ngoài ngữ cảnh; tước hiệu đồng vị được giữ gọn.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: với những lời hòa bình
  rationale: Giữ gần hình thức Hê-bơ-rơ “những lời của sự bình an/hòa bình,” đồng thời chú thích nghĩa ngoại giao có thể có.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức dẫn lời được chuyển thành “rằng:” tự nhiên trong tiếng Việt và báo hiệu lời nói trực tiếp tiếp tục ở câu sau.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự “từ hoang mạc Kê-đê-mốt” được đưa lên đầu để câu tiếng Việt trôi chảy; các tên riêng được phiên âm theo lối quen dùng trong bản văn Kinh Thánh tiếng Việt.
