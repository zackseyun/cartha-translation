source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י רְאֵ֗ה הַֽחִלֹּ֨תִי֙ תֵּ֣ת לְ/פָנֶ֔י/ךָ אֶת סִיחֹ֖ן וְ/אֶת אַרְצ֑/וֹ הָחֵ֣ל רָ֔שׁ לָ/רֶ֖שֶׁת אֶת אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: vi
  text: 'Yahweh phán với tôi: “Hãy xem, Ta đã bắt đầu trao Si-hôn và xứ của người ấy vào tay ngươi.[a] Hãy bắt đầu chiếm lấy xứ ấy làm sản nghiệp.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “trước mặt ngươi”; ở đây hàm ý Yahweh đặt Si-hôn và xứ của người ấy dưới quyền ngươi.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ dùng liên tiếp hai hình thức của cùng một động từ, có thể dịch sát hơn: “Hãy bắt đầu chiếm lấy, để chiếm hữu xứ ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ đúng việc bản Hê-bơ-rơ trực tiếp dùng danh YHWH thay vì thay bằng một tước hiệu.
- source_word: רְאֵה
  choice: Hãy xem
  rationale: Mệnh lệnh dùng để thu hút sự chú ý; cách dịch này trực tiếp, tự nhiên và không cổ kính quá mức.
- source_word: הַחִלֹּתִי תֵּת
  choice: Ta đã bắt đầu trao
  rationale: Giữ ý hành động đã khởi sự và đang tiến triển; “trao” phù hợp với bối cảnh đặt đối phương dưới quyền Israel.
- source_word: לְפָנֶיךָ
  choice: vào tay ngươi
  rationale: Nghĩa đen là “trước mặt ngươi”, nhưng trong bối cảnh quân sự thành ngữ này chỉ việc đặt vào quyền lực hay sự định đoạt của người nhận.
- source_word: הָחֵל
  choice: Hãy bắt đầu
  rationale: 'Giữ sự song hành có chủ ý: Yahweh đã bắt đầu trao, còn Israel phải bắt đầu hành động.'
- source_word: רָשׁ לָרֶשֶׁת
  choice: chiếm lấy ... làm sản nghiệp
  rationale: Hai hình thức cùng gốc ירש được kết hợp để diễn đạt cả hành động chiếm hữu và kết quả sở hữu xứ; cách dịch tránh lặp gượng nhưng vẫn giữ sắc thái nhấn mạnh.
- source_word: אַרְצוֹ
  choice: xứ của vua ấy / xứ ấy
  rationale: אֶרֶץ ở đây là lãnh thổ thuộc quyền Si-hôn; “xứ” phù hợp với văn cảnh Phục Truyền Luật Lệ Ký.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của ירש trong việc Israel nhận đất
  choice: chiếm lấy ... làm sản nghiệp
  alternative: chiếm hữu / truất quyền cư dân để lấy xứ
  rationale: Lối dịch giữ đồng thời sắc thái chiếm lấy trong bối cảnh chinh phục và nhận xứ làm phần sở hữu, nhưng không bổ sung chi tiết vượt quá câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—ngươi” phù hợp với lời phán trực tiếp của Đức Chúa Trời trong văn mạch Kinh Thánh. Tên סִיחֹן được phiên âm là “Si-hôn”. Các dấu chú thích [a], [b] đều được đặt ngay trong chính văn.
