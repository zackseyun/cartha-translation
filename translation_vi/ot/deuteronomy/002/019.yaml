  to: Khi ngươi đến đối diện với dân Am-môn[a], đừng quấy nhiễu họ[b] hoặc gây hấn với họ, vì Ta sẽ không ban cho ngươi phần đất nào của dân Am-môn làm sản nghiệp[c], bởi Ta đã ban đất ấy làm sản nghiệp cho con cháu Lót.
