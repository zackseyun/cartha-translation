source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: vi
  text: Khi ngươi đến đối diện với dân Am-môn[a], đừng quấy nhiễu họ[b] hoặc gây hấn với họ, vì Ta sẽ không ban cho ngươi phần đất nào của dân Am-môn làm sản nghiệp[c], bởi Ta đã ban đất ấy làm sản nghiệp cho con cháu Lót.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “con cái Am-môn”; cũng có thể dịch là “người Am-môn”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đừng tấn công họ”. Từ Hê-bơ-rơ có thể cấm hành động thù địch nói chung, chứ không chỉ việc vây hãm.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “làm cơ nghiệp” hoặc “làm phần sở hữu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: Khi ngươi đến đối diện với
  rationale: Diễn đạt tự nhiên mệnh đề chỉ thời gian, đồng thời giữ sắc thái không gian “đối diện với” của מוּל thay vì hiểu quá mức là đã đi vào lãnh thổ.
- source_word: בְּנֵי עַמּוֹן
  choice: dân Am-môn
  rationale: Trong tiếng Việt hiện đại, đây là cách gọi một cộng đồng dân tộc tự nhiên và rõ ràng hơn lối dịch sát chữ “con cái Am-môn”; chú thích bảo lưu cấu trúc thân tộc của tiếng Hê-bơ-rơ.
- source_word: אַל תְּצֻרֵם
  choice: đừng quấy nhiễu họ
  rationale: Động từ trong ngữ cảnh cấm hành động thù địch nói chung; “quấy nhiễu” không thu hẹp nghĩa thành việc vây một thành cụ thể.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: hoặc gây xung đột với họ
  rationale: Giữ ý khơi lên hay dấn vào sự đối địch, nhưng không thêm danh từ “chiến tranh” vốn không được nêu minh nhiên trong nguyên văn.
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: phần đất nào của dân Am-môn
  rationale: '“Phần đất nào” thể hiện tự nhiên sức mạnh phân lượng của מִן trong câu phủ định: không một phần nào của đất ấy được ban cho Israel.'
- source_word: יְרֻשָּׁה
  choice: làm sản nghiệp
  rationale: “Sản nghiệp” bao hàm một phần đất được ban để nắm giữ lâu dài, phù hợp ngữ cảnh phân chia lãnh thổ và vẫn giữ sắc thái thừa hưởng.
- source_word: לִבְנֵי לוֹט
  choice: cho con cháu Lót
  rationale: Ở đây בְּנֵי chỉ cộng đồng hậu duệ của Lót; “con cháu” chuyển đúng quan hệ dòng dõi sang tiếng Việt tự nhiên.
- source_word: נְתַתִּיהָ
  choice: Ta đã ban đất ấy
  rationale: Thể hoàn thành chỉ việc ban đất đã được xác lập và còn hiệu lực; thêm “đất” làm rõ đại từ giống cái quy chiếu về אֶרֶץ.
theological_decisions:
- issue: Cách thể hiện ngôn ngữ thân tộc בְּנֵי trong các tên gọi dân tộc
  choice: dân Am-môn / con cháu Lót
  alternative: con cái Am-môn / các con trai của Lót
  rationale: Nguyên văn nhấn mạnh nguồn gốc thân tộc và quyền lãnh thổ do Đức Chúa Trời phân định. Bản dịch dùng cách nói tự nhiên theo từng ngữ cảnh nhưng không biến “con cháu Lót” thành một tên dân tộc hẹp hơn nguyên văn.
- issue: Sắc thái của יְרֻשָּׁה
  choice: sản nghiệp
  alternative: cơ nghiệp; phần sở hữu
  rationale: “Sản nghiệp” giữ được cả ý sở hữu được ban và sắc thái thừa hưởng, không quyết định quá mức giữa hai nét nghĩa vốn cùng hiện diện trong thuật ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; dùng đại từ số ít “ngươi” vì lời phán xem Israel như một chủ thể tập thể, và viết hoa “Ta” để nhận diện Đấng phán trong ngữ cảnh. Các tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
