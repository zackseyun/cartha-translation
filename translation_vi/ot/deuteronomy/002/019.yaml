  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh không thù địch với Am-môn, lời xác nhận rằng không phần đất nào của họ sẽ được ban cho Israel, và việc đất ấy đã được ban cho hậu duệ Lót. Tuy nhiên, “gây xung đột với họ” hơi nghiêng về kết quả của hành động; động từ Hê-bơ-rơ וְאַל־תִּתְגָּר בָּם trực tiếp hơn về việc gây hấn/khơi sự đối địch với họ. “Đừng gây hấn với họ” giữ sắc thái này mà không thêm “chiến tranh.”
  naturalness: Văn phong trang trọng, hiện đại và dễ hiểu. “Khi ngươi đến đối diện với dân Am-môn” có thể chấp nhận trong văn cảnh hành trình; đại từ “ngươi” nhất quán với lối Đức Chúa Trời ngỏ lời cùng Israel như một tập thể.
  terminology: “Dân Am-môn,” “sản nghiệp,” và “con cháu Lót” đều tự nhiên trong tiếng Việt hiện đại và phù hợp ngữ cảnh phân định đất đai. Chú thích về cách dịch “con cái Am-môn” và các lựa chọn của יְרֻשָּׁה hữu ích, không áp đặt diễn giải giáo phái.
