  text: אֶֽרֶץ רְפָאִ֥ים תֵּחָשֵׁ֖ב אַף הִ֑וא רְפָאִ֤ים יָֽשְׁבוּ בָ/הּ֙ לְ/פָנִ֔ים וְ/הָֽ/עַמֹּנִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם זַמְזֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: vi
  text: Vùng đất ấy cũng được xem là đất của người Rê-pha-im[a]. Trước kia, người Rê-pha-im[b] cư ngụ tại đó, còn người Am-môn gọi họ là Xam-xum-mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xứ của người Rê-pha-im.”'
    reason: lexical_alternative
  - marker: b
    text: “Rê-pha-im” có thể chỉ một dân tộc cổ, theo truyền thống được liên hệ với vóc người cao lớn; một số bản dịch dùng “người khổng lồ” tại đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: đất của người Rê-pha-im
  rationale: Giữ רְפָאִים như tên một dân tộc và diễn đạt quan hệ sở thuộc bằng tiếng Việt tự nhiên; không chuyển thành “người khổng lồ,” vì đó là cách giải thích hơn là sự chuyển trực tiếp tên gọi.
- source_word: תֵּחָשֵׁב
  choice: được kể là
  rationale: Phản ánh thể bị động của động từ חשׁב với nghĩa được xem hoặc được tính là; cách nói trang trọng nhưng vẫn dễ hiểu.
- source_word: אַף הִוא
  choice: Xứ ấy cũng
  rationale: Liên kết vùng đất vừa nói đến với phần trình bày trước và giữ sắc thái bổ sung của אַף.
- source_word: רְפָאִים
  choice: người Rê-pha-im
  rationale: Phiên âm tên dân tộc thay vì dịch theo truyền thống là “người khổng lồ,” qua đó giữ tính đặc thù và sự mơ hồ của nguyên văn.
- source_word: יָשְׁבוּ בָהּ
  choice: cư ngụ tại đó
  rationale: Diễn đạt tự nhiên nghĩa sống hoặc ở trong vùng đất ấy, với văn phong trang trọng vừa phải.
- source_word: לְפָנִים
  choice: Trước kia
  rationale: Truyền đạt rõ ý chỉ một thời kỳ trước đây.
- source_word: וְהָעַמֹּנִים
  choice: còn người Am-môn
  rationale: Dùng “còn” để đánh dấu sự chuyển từ tên gọi của lời trần thuật sang tên gọi của người Am-môn mà không tạo sự đối lập quá mạnh.
- source_word: יִקְרְאוּ לָהֶם
  choice: gọi họ là
  rationale: Hiện tại mang ý nghĩa tên gọi quen dùng, phù hợp giá trị chưa hoàn thành hoặc tập quán của động từ Hebrew.
- source_word: זַמְזֻמִּים
  choice: người Xam-xum-mim
  rationale: Phiên âm tên dân tộc, đồng thời thêm “người” để câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Bản chất của người Rê-pha-im
  choice: Giữ nguyên tên dân tộc “Rê-pha-im” trong chính văn.
  alternative: Dịch là “người khổng lồ.”
  rationale: Ngữ cảnh dùng רְפָאִים như tên một nhóm người và đối chiếu với tên gọi Xam-xum-mim; dịch là “người khổng lồ” sẽ xác quyết một cách hiểu mà nguyên văn không nói rõ tại đây.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Các tên dân tộc được phiên âm nhất quán; cấu trúc câu giữ mạch giải thích của nguyên văn và không giải quyết dứt khoát căn tính của người Rê-pha-im.
