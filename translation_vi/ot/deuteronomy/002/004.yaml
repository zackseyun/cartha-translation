source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: vi
  text: 'Hãy truyền lệnh cho dân rằng: ‘Anh em sắp đi qua lãnh thổ[a] của anh em của anh em, tức là con cháu Ê-sau, đang cư ngụ tại Sê-i-rơ. Họ sẽ sợ anh em. Vì vậy, anh em phải hết sức cẩn thận.[b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lãnh thổ” cũng có thể dịch là “ranh giới”; từ Hê-bơ-rơ có thể chỉ đường ranh hoặc vùng đất nằm trong đường ranh ấy.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Vậy anh em hãy hết sức giữ mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: truyền lệnh
  rationale: Động từ mệnh lệnh của צוה diễn tả một chỉ thị có thẩm quyền; “truyền lệnh” giữ được sắc thái mạnh và tự nhiên trong tiếng Việt.
- source_word: הָעָם
  choice: dân chúng
  rationale: עם chỉ tập thể dân Y-sơ-ra-ên; “dân chúng” là cách diễn đạt rõ ràng, tự nhiên trong ngữ cảnh.
- source_word: אַתֶּם עֹבְרִים
  choice: anh em sắp đi qua
  rationale: Phân từ đi với đại từ độc lập có thể chỉ hành động đang cận kề trong ngữ cảnh; “sắp đi qua” thể hiện lực thời gian ấy mà không biến nó thành một tương lai xa.
- source_word: בִּגְבוּל
  choice: qua lãnh thổ
  rationale: גְּבוּל có thể là ranh giới hoặc vùng đất nằm trong ranh giới. Ngữ cảnh hành trình thiên về “lãnh thổ”; sự đa nghĩa được ghi ở chú thích.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: anh em mình là con cháu Ê-sau
  rationale: Giữ nguyên ngôn ngữ thân tộc “anh em” giữa Y-sơ-ra-ên và Ê-đôm, đồng thời “con cháu Ê-sau” diễn đạt tự nhiên ý nghĩa hậu duệ tập thể của בְּנֵי עֵשָׂו.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: những người đang sống tại Sê-i-rơ
  rationale: ישב ở đây chỉ nơi cư trú ổn định; “sống tại” là tiếng Việt hiện đại, rõ nghĩa.
- source_word: וְיִירְאוּ מִכֶּם
  choice: Họ sẽ sợ anh em
  rationale: ירא với מן diễn tả sự sợ hãi đối với hoặc vì Y-sơ-ra-ên; cách dịch này ngắn gọn và giữ sắc thái dự báo.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: Vì vậy, anh em phải hết sức cẩn thận
  rationale: 'Dạng Niphal của שמר có lực phản thân: giữ mình, đề phòng. “Hết sức” truyền đạt mức nhấn mạnh của מְאֹד; quan hệ suy luận với mệnh đề trước được diễn đạt bằng “Vì vậy”.'
theological_decisions:
- issue: Ngôn ngữ thân tộc dành cho Ê-đôm
  choice: anh em mình là con cháu Ê-sau
  alternative: họ hàng của anh em là hậu duệ Ê-sau
  rationale: Bản dịch giữ từ “anh em” để bảo tồn mối liên hệ gia tộc mà câu Hebrew chủ ý nêu làm nền cho cách Y-sơ-ra-ên phải cư xử với Ê-đôm, không làm nhẹ thành một quan hệ dân tộc chung chung.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” số nhiều để vừa phản ánh cách xưng hô với cộng đồng Y-sơ-ra-ên vừa lặp lại có chủ ý từ ngữ thân tộc trong câu; “con cháu” tự nhiên hơn “các con trai” khi nói về một dân tộc hậu duệ.
