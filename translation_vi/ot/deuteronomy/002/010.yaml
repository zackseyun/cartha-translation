  text: הָ/אֵמִ֥ים לְ/פָנִ֖ים יָ֣שְׁבוּ בָ֑/הּ עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: vi
  text: Người Ê-mim trước kia[a] sống tại đó; họ là một dân tộc lớn, đông đảo và cao lớn như người A-na-kim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vào thời xưa.”'
    reason: Bảo lưu phương án dịch thời gian cho לְפָנִים, tương ứng với chú thích trong hồ sơ đối chiếu tiếng Anh.
lexical_decisions:
- source_word: הָאֵמִים
  choice: người Ê-mim
  rationale: Chuyển âm tộc danh Hê-bơ-rơ theo cách tự nhiên trong tiếng Việt, không dịch theo nghĩa suy đoán của tên gọi.
- source_word: לְפָנִים
  choice: trước kia
  rationale: Cụm từ được dùng theo nghĩa thời gian, chỉ thời trước; cách diễn đạt này tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: יָשְׁבוּ בָהּ
  choice: sống tại đó
  rationale: Động từ ישׁב đi với ב chỉ việc cư trú; đại từ giống cái số ít quy chiếu về vùng đất đã được nhắc đến.
- source_word: עַם
  choice: một dân tộc
  rationale: Ở đây עם chỉ một cộng đồng sắc tộc, nên “một dân tộc” rõ nghĩa hơn “một dân” trong tiếng Việt hiện đại.
- source_word: גָּדוֹל
  choice: hùng mạnh
  rationale: Trong chuỗi mô tả một dân tộc đáng gờm, גָּדוֹל có thể chỉ sự lớn lao hoặc mạnh thế; “hùng mạnh” diễn đạt tự nhiên mà không trùng ý với số lượng và chiều cao.
- source_word: וְרַב
  choice: đông đảo
  rationale: רַב mô tả dân số đông; “đông đảo” phù hợp với danh từ tập thể “dân tộc”.
- source_word: וָרָם
  choice: cao lớn
  rationale: Trong phép so sánh với người A-na-kim, רָם nói đến tầm vóc thể chất; “cao lớn” là cách nói tự nhiên trong tiếng Việt.
- source_word: כָּעֲנָקִים
  choice: như người A-na-kim
  rationale: כְּ biểu thị sự so sánh; tộc danh עֲנָקִים được chuyển âm, đồng thời thêm “người” để câu tiếng Việt tự nhiên.
theological_decisions: []
