id: DEU.2.18
reference: Deuteronomy 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַתָּ֨ה עֹבֵ֥ר הַ/יּ֛וֹם אֶת גְּב֥וּל מוֹאָ֖ב אֶת עָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: vi
  text: Hôm nay, ngươi sẽ đi qua biên giới Mô-áp tại A-rơ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “biên giới Mô-áp, tức là A-rơ.” Tiếng Hê-bơ-rơ lặp lại dấu hiệu tân ngữ trước “A-rơ,” nên tên này có thể được dùng đồng vị để xác định vùng biên giới hoặc thành của Mô-áp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: ngươi
  rationale: Đại từ ngôi hai số ít giống đực, ở đây nói với Ít-ra-ên như một cộng đồng thống nhất. “Ngươi” giữ được số ít và phù hợp với lời phán trang trọng trong Ngũ Kinh.
- source_word: עֹבֵר
  choice: sẽ đi qua
  rationale: Phân từ Qal dùng làm vị ngữ diễn tả hành động đang cận kề trong bối cảnh hành trình. Tiếng Việt tự nhiên dùng “sẽ đi qua” vì câu nói về việc diễn ra trong ngày hôm ấy, thay vì buộc phải diễn đạt thể tiếp diễn.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Trạng từ thời gian thông dụng, giữ nguyên sự nhấn mạnh vào ngày hiện tại.
- source_word: גְּבוּל
  choice: biên giới
  rationale: Chỉ ranh giới lãnh thổ của Mô-áp; “biên giới” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: מוֹאָב
  choice: Mô-áp
  rationale: Phiên âm địa danh theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: עָר
  choice: A-rơ
  rationale: Tên riêng địa danh được phiên âm, không dịch nghĩa.
- source_word: אֶת ... אֶת
  choice: biên giới Mô-áp tại A-rơ
  rationale: Việc lặp lại dấu hiệu tân ngữ trước “A-rơ” cho phép hiểu tên này như thành phần đồng vị hoặc như điểm địa lý xác định đoạn biên giới. “Tại A-rơ” tự nhiên trong tiếng Việt, còn khả năng đồng vị được giữ trong chú thích.
theological_decisions:
- issue: Lời xưng hô số ít dành cho Ít-ra-ên
  choice: Giữ đại từ số ít “ngươi” mà không thêm “Ít-ra-ên” vào chính văn
  alternative: “Các ngươi” hoặc “Ngươi, tức Ít-ra-ên”
  rationale: Nguyên văn dùng số ít để nói với Ít-ra-ên như một cộng đồng. Giữ số ít bảo tồn thủ pháp tu từ và tránh thêm lời giải thích vào chính văn.
- issue: Quan hệ giữa biên giới Mô-áp và A-rơ
  choice: “tại A-rơ” trong chính văn, kèm chú thích về cách hiểu đồng vị
  alternative: “biên giới Mô-áp, tức là A-rơ”
  rationale: Cú pháp Hê-bơ-rơ với hai dấu hiệu tân ngữ có độ mơ hồ thật sự. Bản dịch chính diễn đạt quan hệ địa lý tự nhiên, còn chú thích bảo tồn cách hiểu A-rơ đồng vị với vùng hoặc thành ở biên giới Mô-áp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và gọn. Dùng “ngươi” để thể hiện rõ đại từ số ít mang tính cộng đồng; các địa danh được phiên âm theo lối quen thuộc trong tiếng Việt. Dấu chú thích [a] xuất hiện ngay sau “A-rơ” trong chính văn.
