translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ ở dạng mệnh đề chưa hoàn tất với dấu phẩy vì nội dung tiếp tục sang câu 17. Cụm “đã chết hết” truyền đạt tự nhiên sắc thái hoàn tất của nguyên văn mà không làm nhẹ đi tính tập thể của sự kiện.
