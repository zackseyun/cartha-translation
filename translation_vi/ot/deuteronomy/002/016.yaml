translation:
  language: vi
  text: Và khi tất cả những người nam ra trận[a] đã chết hết khỏi giữa dân chúng,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người chiến đấu.” Tiếng Hê-bơ-rơ nghĩa đen là “những người nam của chiến trận.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Và khi
  rationale: Kết hợp công thức mở đầu trần thuật וַיְהִי với liên từ thời gian כַאֲשֶׁר thành một mệnh đề thời gian tự nhiên trong tiếng Việt, đồng thời giữ liên kết “Và” với mạch kể trước đó.
- source_word: תַּמּוּ ... לָמוּת
  choice: đã chết hết
  rationale: Cấu trúc תמם với động từ nguyên mẫu “chết” diễn tả tiến trình chết đã hoàn tất. “Đã chết hết” vừa tự nhiên trong tiếng Việt vừa giữ rõ ý toàn bộ nhóm này không còn ai sống.
- source_word: כָּל
  choice: tất cả
  rationale: Giữ nguyên phạm vi bao quát của lượng từ Hê-bơ-rơ.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: những người nam ra trận
  rationale: Giữ yếu tố nam giới của אַנְשֵׁי và ý nghĩa quân sự của הַמִּלְחָמָה, nhưng diễn đạt bằng lối nói tiếng Việt hiện đại, dễ hiểu.
- source_word: מִקֶּרֶב הָעָם
  choice: khỏi dân chúng
  rationale: מִקֶּרֶב chỉ sự bị loại khỏi hay không còn ở giữa cộng đồng; “khỏi dân chúng” diễn đạt ngắn gọn sự biến mất do chết mà không biến הָעָם thành một thuật ngữ chính trị như “quốc gia”.
