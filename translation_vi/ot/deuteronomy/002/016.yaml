    rationale: Giới từ này nghĩa là ‘khỏi giữa/từ trong số’ một tập thể. ‘Khỏi giữa dân chúng’ bảo toàn sắc thái ấy.
  - severity: low
    issue: Cách nói ‘Tiếng Hê-bơ-rơ sát nghĩa là’ trong chú thích chưa thật chuẩn xác về mặt mô tả từ vựng.
    rationale: Chú thích đang nêu cách diễn đạt theo chữ; ‘nghĩa đen là’ rõ ràng và tự nhiên hơn.
