  terminology: “Yahweh” nhất quán với quyết định thuật ngữ; “hoang mạc,” “Biển Đỏ,” và “núi Sê-i-rơ” đều phù hợp. Chú thích giữ được lựa chọn từ vựng thay thế cho Yam Suph mà không áp đặt một nhận diện địa lý cụ thể.
  issues:
