language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/נֵּ֜פֶן וַ/נִּסַּ֤ע הַ/מִּדְבָּ֨רָ/ה֙ דֶּ֣רֶךְ יַם ס֔וּף כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/נָּ֥סָב אֶת הַר שֵׂעִ֖יר יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: vi
  text: Sau đó, chúng tôi đổi hướng và lên đường vào hoang mạc theo đường Biển Đỏ[a], đúng như Yahweh đã phán với tôi; chúng tôi đi vòng quanh núi Sê-i-rơ nhiều ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Biển Sậy”; tên Hê-bơ-rơ Yam Suf có thể được hiểu sát chữ như vậy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Sau đó, chúng tôi quay lại
  rationale: Động từ פנה ở thể Qal diễn tả việc đổi hướng; trong mạch văn, “quay lại” tự nhiên và phù hợp với hướng đi trở về hoang mạc, nhưng không thêm ý nghĩa vượt quá ngữ cảnh.
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  choice: lên đường đi vào hoang mạc
  rationale: נסע trong ngữ cảnh hành trình thường chỉ việc nhổ trại lên đường; hậu tố chỉ hướng -ה trên מִדְבָּר được thể hiện bằng “đi vào”.
- source_word: דֶּרֶךְ יַם סוּף
  choice: theo đường Biển Đỏ[a]
  rationale: דֶּרֶךְ chỉ con đường hoặc tuyến đường. “Biển Đỏ” là tên địa lý quen thuộc trong tiếng Việt, còn nghĩa sát chữ của יַם־סוּף được giữ trong chú thích.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלַי
  choice: đúng như Yahweh đã phán với tôi
  rationale: כַּאֲשֶׁר mang nghĩa so sánh “đúng như”; dạng hoàn thành דִּבֶּר chỉ lời đã được phán trước thời điểm thuật chuyện. “Phán” giữ sắc thái trang trọng tự nhiên khi nói về lời Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự phổ biến, thay vì thay thế bằng một tước hiệu.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: Chúng tôi đi vòng quanh núi Sê-i-rơ
  rationale: סבב ở đây diễn tả việc di chuyển vòng quanh; הַר שֵׂעִיר được dịch là “núi Sê-i-rơ”, một địa danh quen dùng.
- source_word: יָמִים רַבִּים
  choice: nhiều ngày
  rationale: Giữ cách diễn đạt cụ thể về khoảng thời gian của nguyên văn, không diễn giải thành “một thời gian dài”.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Dạng “Yahweh” bảo tồn chức năng của danh giao ước mà không thay bằng tước hiệu.
- issue: Chủ thể số nhiều trong וַנָּסָב
  choice: Chúng tôi đi vòng quanh
  alternative: Tôi đi vòng quanh
  rationale: Dù hình thức không có dấu phụ của ונסב có thể gây nhập nhằng, cách đọc Masoretic וַנָּסָב và chuỗi động từ ngôi thứ nhất số nhiều trước đó xác nhận chủ thể tập thể “chúng tôi”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hoang mạc” cho מִדְבָּר, “lên đường” cho sắc thái nhổ trại của נסע, và giữ danh Yahweh cùng địa danh Sê-i-rơ theo lối phiên âm tiếng Việt.
