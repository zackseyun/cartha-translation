source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: vi
  text: Hãy đứng dậy, lên đường và vượt qua thung lũng Ạt-nôn.[a] Kìa, Ta đã trao vào tay ngươi Si-hôn, vua Hết-bôn, người A-mô-rít, cùng đất đai của ông ta. Hãy bắt đầu chiếm hữu đất ấy,[b] và giao chiến với ông ta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khe Ạt-nôn”, “lòng suối Ạt-nôn” hoặc “suối Ạt-nôn”; từ Hê-bơ-rơ נחל có thể chỉ một thung lũng có dòng nước, lòng suối hoặc khe suối.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “hãy bắt đầu sở hữu đất ấy”. Động từ này cũng có thể mang nghĩa “tước đất của người khác”, nhưng túc từ trực tiếp ngay trước đó là đất của Si-hôn.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “hãy giao tranh với ông ta” hoặc “hãy gây chiến với ông ta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ סְּע֗וּ
  choice: Hãy đứng dậy, lên đường
  rationale: Hai mệnh lệnh số nhiều diễn tả việc đứng lên và bắt đầu hành trình; cách dịch này tự nhiên, rõ ràng và vẫn giữ nhịp dồn dập của nguyên văn.
- source_word: וְ/עִבְרוּ֮
  choice: và vượt qua
  rationale: Động từ עבר với một địa hình làm túc từ thường chỉ hành động đi qua hoặc vượt qua địa giới ấy.
- source_word: נַ֣חַל אַרְנֹן
  choice: thung lũng Ạt-nôn
  rationale: נחל có thể chỉ thung lũng có dòng nước, lòng suối hoặc khe suối. 'Thung lũng' dễ hiểu trong tiếng Việt và tránh khiến độc giả hình dung đây chỉ là một con suối nhỏ.
- source_word: רְאֵ֣ה
  choice: Kìa
  rationale: Mệnh lệnh số ít này hướng sự chú ý của Môi-se đến lời tuyên bố của Đức Chúa Trời. 'Kìa' giữ sắc thái nhấn mạnh trang trọng mà vẫn quen thuộc.
- source_word: נָתַ֣תִּי בְ֠/יָדְ/ךָ
  choice: Ta đã trao vào tay ngươi
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về việc trao quyền kiểm soát; thì hoàn thành được thể hiện bằng 'đã trao'.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י
  choice: Si-hôn, vua Hết-bôn, người A-mô-rít
  rationale: Giữ gần thứ tự đồng vị của nguyên văn, xác định Si-hôn bằng vương vị và dân tộc.
- source_word: וְ/אֶת אַרְצ֖/וֹ
  choice: cùng đất đai của ông ta
  rationale: אֶרֶץ ở đây chỉ lãnh thổ thuộc quyền vua Si-hôn; 'đất đai' tự nhiên và phân biệt rõ với chính nhà vua.
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: Hãy bắt đầu chiếm hữu đất ấy
  rationale: הָחֵל là mệnh lệnh 'hãy bắt đầu'; ירש có thể là chiếm hữu, sở hữu hoặc truất hữu. Vì 'đất đai' là túc từ ngay trước đó, 'chiếm hữu đất ấy' phản ánh mạch cú pháp mà không loại bỏ các sắc thái khác.
- source_word: וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה
  choice: và giao chiến với ông ta
  rationale: Cụm từ diễn tả việc bước vào tình trạng chiến tranh hay đối đầu bằng chiến trận. 'Giao chiến' rõ ràng, tự nhiên và không thu hẹp nghĩa thành chỉ khiêu khích.
theological_decisions:
- issue: Ân ban của Đức Chúa Trời và hành động của dân Y-sơ-ra-ên trong cuộc chinh phục
  choice: Giữ cả lời tuyên bố hoàn tất 'Ta đã trao' lẫn mệnh lệnh 'hãy bắt đầu chiếm hữu... và giao chiến'.
  alternative: Dịch lời tuyên bố thành lời hứa tương lai 'Ta sẽ trao', hoặc nhấn mạnh riêng việc truất hữu trong câu chính.
  rationale: Nguyên văn đặt việc Đức Chúa Trời đã trao cạnh trách nhiệm hành động của Y-sơ-ra-ên. Bản dịch giữ nguyên sự căng thẳng này, không làm nhẹ hay giải quyết thay cho văn bản.
translation_notes:
  register: 'Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ ''Ta/ngươi'' duy trì giọng phán truyền thống và thể hiện đúng sự chuyển đổi trong nguyên văn: các mệnh lệnh đầu ở số nhiều hướng đến dân chúng, còn ''Kìa... tay ngươi'' ở số ít hướng đến Y-sơ-ra-ên như một tập thể. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.'
