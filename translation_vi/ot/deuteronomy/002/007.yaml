id: DEU.2.7
reference: Deuteronomy 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בֵּֽרַכְ/ךָ֗ בְּ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔/ךָ יָדַ֣ע לֶכְתְּ/ךָ֔ אֶת הַ/מִּדְבָּ֥ר הַ/גָּדֹ֖ל הַ/זֶּ֑ה זֶ֣ה אַרְבָּעִ֣ים שָׁנָ֗ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ לֹ֥א חָסַ֖רְתָּ דָּבָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: vi
  text: Vì Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em trong mọi công việc do tay anh em làm. Ngài biết hành trình của anh em qua hoang mạc rộng lớn này.[a] Suốt bốn mươi năm qua, Yahweh, Đức Chúa Trời của anh em, đã ở cùng anh em; anh em chẳng thiếu thốn gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đã chăm nom hành trình của anh em qua hoang mạc rộng lớn này.” Động từ Hê-bơ-rơ theo nghĩa đen là “biết”; trong ngữ cảnh, từ này có thể hàm ý sự lưu tâm chăm sóc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: בֵּרַכְךָ
  choice: đã ban phước cho anh em
  rationale: Giữ nghĩa tôn giáo và giao ước của động từ ברך; thể hoàn thành được diễn đạt tự nhiên bằng “đã”.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: trong mọi công việc tay anh em làm
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ theo nghĩa mọi lao động và việc làm, đồng thời giữ hình ảnh “tay”.
- source_word: יָדַע
  choice: biết
  rationale: Giữ nghĩa cơ bản và sự mơ hồ chân thực của ידע; trong ngữ cảnh, từ này cũng có thể hàm ý sự lưu tâm và chăm nom.
- source_word: לֶכְתְּךָ
  choice: hành trình của anh em
  rationale: Danh hóa tự nhiên động tác đi lại của Israel trong hoang mạc, tránh cách dịch quá cứng là “sự đi của anh em”.
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: qua hoang mạc rộng lớn này
  rationale: “Qua” làm rõ tuyến đường được trải qua; “rộng lớn” diễn đạt tự nhiên tính từ גָּדֹל trong ngữ cảnh địa hình.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: suốt bốn mươi năm qua
  rationale: Cách nói tiếng Việt tự nhiên cho khoảng thời gian kéo dài đến thời điểm phát biểu.
- source_word: עִמָּךְ
  choice: đã ở cùng anh em
  rationale: Bổ sung động từ cần thiết trong tiếng Việt để diễn đạt sự hiện diện liên tục của Đức Chúa Trời.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: anh em chẳng thiếu thốn gì
  rationale: Thành ngữ tiếng Việt tự nhiên, truyền đạt sự đầy đủ trọn vẹn.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tetragrammaton; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của יָדַע đối với hành trình trong hoang mạc
  choice: biết
  alternative: chăm nom; dõi theo
  rationale: “Biết” giữ nghĩa từ vựng trực tiếp và không quyết định thay người đọc rằng động từ nhất thiết phải mang nghĩa chăm sóc, trong khi chú thích nêu rõ hàm ý có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi hai số ít mang nghĩa tập thể, vì Môi-se đang nói với Israel như một cộng đồng. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
