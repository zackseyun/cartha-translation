  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: vi
  text: Chỉ có gia súc là chúng ta lấy làm chiến lợi phẩm cho mình, cùng với chiến lợi phẩm từ các thành mà chúng ta đã chiếm được.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Chỉ có
  rationale: Diễn tả sự giới hạn tương phản với việc tiêu diệt toàn bộ dân cư được nói ở câu trước.
- source_word: הַבְּהֵמָה
  choice: gia súc
  rationale: Trong bối cảnh chiến trận, từ này chỉ các vật nuôi bị thu giữ, không phải động vật nói chung.
- source_word: בָּזַזְנוּ לָנוּ
  choice: chúng ta lấy làm chiến lợi phẩm cho mình
  rationale: Giữ được nghĩa cướp lấy trong chiến tranh của động từ בזז và sắc thái thụ hưởng/phản thân của לָנוּ.
- source_word: וּשְׁלַל
  choice: cùng với của cải cướp được
  rationale: שָׁלָל chỉ chiến lợi phẩm; cách diễn đạt này tự nhiên trong tiếng Việt và tránh lặp sát cụm “làm chiến lợi phẩm” ngay trước đó.
- source_word: הֶעָרִים
  choice: các thành
  rationale: עִיר có thể là thành hoặc thị trấn; “các thành” phù hợp với văn cảnh chinh phục và lối văn Kinh Thánh tiếng Việt.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: chúng ta đã chiếm
  rationale: Trong ngữ cảnh quân sự, לכד mang nghĩa chiếm hoặc đánh chiếm một thành.
