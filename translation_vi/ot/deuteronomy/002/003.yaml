base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: vi
  text: Các ngươi đã đi vòng quanh miền núi này đủ lâu rồi[a]; hãy chuyển hướng về phía bắc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngọn núi này.” Từ הַר trong tiếng Hê-bơ-rơ có thể chỉ một ngọn núi hoặc một vùng núi; ở đây, bối cảnh hành trình nghiêng về nghĩa “miền núi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  choice: đủ lâu rồi
  rationale: Thành ngữ diễn tả mức độ đã đủ hoặc quá lâu; kết hợp với hành động đi vòng quanh để truyền đạt tự nhiên ý nghĩa trong ngữ cảnh.
- source_word: סֹב
  choice: đã đi vòng quanh
  rationale: Dạng từ gốc סבב chỉ việc di chuyển vòng quanh; cách dịch này phù hợp với lời nhìn lại quãng hành trình đã kéo dài.
- source_word: הָהָר הַזֶּה
  choice: miền núi này
  rationale: הַר có thể chỉ một ngọn núi hoặc một vùng núi. Trong bối cảnh hành trình, 'miền núi' diễn đạt tự nhiên phạm vi địa lý rộng hơn, đồng thời ghi chú bảo lưu nghĩa hẹp.
- source_word: פְּנוּ
  choice: hãy quay
  rationale: Mệnh lệnh của פנה trong ngữ cảnh di chuyển, yêu cầu đổi hướng; 'hãy quay' trực tiếp và tự nhiên trong tiếng Việt.
- source_word: לָכֶם
  choice: không dịch riêng
  rationale: Đại từ giới từ đi sau mệnh lệnh mang sắc thái hướng đến chính những người nghe, nhưng dịch thành 'cho mình/các ngươi' sẽ gượng và không thêm ý nghĩa cần thiết trong tiếng Việt.
- source_word: צָפֹנָה
  choice: về hướng bắc
  rationale: Hậu tố chỉ hướng biểu thị chuyển động về phía bắc; 'về hướng bắc' giữ rõ lực chỉ hướng.
