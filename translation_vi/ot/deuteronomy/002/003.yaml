translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời phán trực tiếp với cộng đồng Ít-ra-ên; giữ mệnh lệnh ngắn gọn và sắc thái đã kéo dài đủ lâu.
