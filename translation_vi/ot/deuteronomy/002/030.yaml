    rationale: Động từ אמץ nghĩa cơ bản là làm mạnh/củng cố. Dù ngữ cảnh khiến nghĩa “ngoan cố” là phù hợp, “chai cứng” lặp lại quá sát ý “làm cho tâm thần ông cứng cỏi” của הִקְשָׁה và làm mất sự phân biệt từ vựng trong nguyên văn.
