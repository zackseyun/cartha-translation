  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: vi
  text: Nhưng Si-hôn, vua Hết-bôn, không muốn cho chúng ta đi qua lãnh thổ của ông, vì Yahweh, Đức Chúa Trời của anh em, đã làm cho tâm thần ông cứng cỏi và khiến lòng ông trở nên ngoan cố[a], nhằm trao ông vào tay anh em, như hiện nay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và làm cho lòng ông mạnh mẽ.” Động từ Hê-bơ-rơ có thể mang nghĩa “làm cho mạnh,” nhưng trong ngữ cảnh này có ý chỉ sự ngoan cố.'
    reason: Nêu phương án từ vựng của וְאִמֵּץ אֶת־לְבָבוֹ, đồng thời giải thích cách hiểu theo văn cảnh mà vẫn phân biệt với động từ “làm cứng” ở vế trước.
lexical_decisions:
- source_word: אָבָה
  choice: không muốn
  rationale: Diễn đạt sự không bằng lòng hay không sẵn lòng từ bên trong, thay vì chỉ mô tả hành động từ chối bên ngoài.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: cho chúng ta đi qua lãnh thổ của ông
  rationale: Thể Hiphil của עבר mang nghĩa cho phép hoặc khiến đi qua; trong ngữ cảnh, đại từ בּוֹ chỉ địa phận do Si-hôn cai trị, nên “lãnh thổ của ông” diễn đạt rõ ý hàm ẩn mà vẫn tự nhiên trong tiếng Việt.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: đã làm cho tâm thần ông cứng cỏi
  rationale: Giữ lại danh từ רוּחַ (“tâm thần/thần trí”) và ý gây nên sự cứng cỏi của động từ Hiphil, không giản lược thành một mô tả chung về sự ngoan cố.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: và khiến lòng ông chai cứng
  rationale: אמץ cơ bản có thể chỉ việc làm cho mạnh, nhưng trong ngữ cảnh này diễn tả sự cứng lòng, ngoan cố. Cách dịch này truyền đạt lực nghĩa theo văn cảnh đồng thời phân biệt phần nào với “tâm thần ông cứng cỏi” ở vế trước.
- source_word: לְמַעַן
  choice: nhằm
  rationale: Nêu rõ quan hệ mục đích một cách gọn và tự nhiên.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: trao ông vào tay anh em
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về việc đặt một người dưới quyền lực của người khác; “vào tay” vẫn rõ nghĩa trong tiếng Việt Kinh Thánh hiện đại.
- source_word: כַּיּוֹם הַזֶּה
  choice: như hiện nay
  rationale: Diễn đạt tình trạng đã trở nên hiển nhiên ở thời điểm người nói, tránh lối dịch quá cổ “như ngày nay”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Việc Đức Chúa Trời làm cứng lòng và sự không sẵn lòng của Si-hôn
  choice: Giữ nguyên cả việc Si-hôn không muốn cho dân đi qua lẫn việc Yahweh làm cho tâm thần và lòng ông cứng lại.
  alternative: Chỉ nhấn mạnh Si-hôn tự làm mình cứng lòng, hoặc diễn giải rằng Đức Chúa Trời chỉ thụ động cho phép điều đó.
  rationale: Bản Hê-bơ-rơ trực tiếp khẳng định cả trách nhiệm ý chí của Si-hôn lẫn hành động của Yahweh. Bản dịch không làm nhẹ hay tự ý giải quyết sức căng thần học giữa hai điều này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để biểu đạt đại từ số ít mang tính tập thể khi Môi-se nói với dân Y-sơ-ra-ên; dùng “lãnh thổ” để làm rõ đối tượng địa lý hàm ẩn của בּוֹ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
