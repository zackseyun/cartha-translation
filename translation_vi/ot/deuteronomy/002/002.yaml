  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/002.yaml
  text: Then Yahweh said to me[a], saying,
translation:
  language: vi
  text: Rồi Yahweh phán với tôi rằng:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “Rồi Yahweh phán với tôi, nói rằng.” Từ cuối câu giới thiệu lời phán tiếp theo ở câu 3.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi … phán
  rationale: Dạng waw liên tiếp đưa trình thuật tiến sang sự việc kế tiếp, nên “Rồi” diễn đạt tự nhiên trình tự ấy. “Phán” là động từ tiếng Việt trang trọng và thông dụng khi Đức Chúa Trời nói.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu; dạng “Yahweh” giúp nhận diện rõ danh YHWH.
- source_word: אֵלַי
  choice: với tôi
  rationale: Giới từ אֶל cùng hậu tố ngôi thứ nhất số ít chỉ người tiếp nhận lời nói; “với tôi” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Động từ nguyên mẫu này giới thiệu lời nói trực tiếp ở câu tiếp theo. Trong tiếng Việt, “rằng” cùng dấu hai chấm truyền đạt chức năng ấy tự nhiên hơn cách lặp “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn sự phân biệt giữa danh riêng này với các tước hiệu, mà không thêm một cách giải nghĩa thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” phù hợp với lời Đức Chúa Trời; dùng “rằng:” để nối tự nhiên sang nội dung lời phán ở câu kế tiếp.
