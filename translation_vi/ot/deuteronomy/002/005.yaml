revisions:
- from: Đừng gây hấn với họ, vì Ta sẽ không ban cho các con bất cứ phần đất nào của họ, dù chỉ đủ cho một bàn chân đặt lên[a], bởi Ta đã ban núi Sê-i-rơ cho Ê-sau làm sản nghiệp[b][c].
  to: Đừng gây hấn với họ, vì Ta sẽ không ban cho các con bất cứ phần đất nào của họ, dù chỉ một chỗ đặt bàn chân[a], bởi Ta đã ban núi Sê-i-rơ[c] cho Ê-sau làm sản nghiệp[b].
  rationale: Chỉnh nhẹ thành ngữ về bàn chân để phản ánh tự nhiên hình ảnh một phần đất nhỏ đến mức chỉ là chỗ đặt bàn chân, đồng thời chuyển các ký hiệu chú thích đến ngay sau cụm từ liên quan. Các thành phần ngữ nghĩa và sắc thái thần học của nguyên văn được giữ nguyên.
