language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: vi
  text: Đừng gây hấn với họ, vì Ta sẽ không ban cho các con bất cứ phần đất nào của họ, dù chỉ một chỗ đặt bàn chân[a], bởi Ta đã ban núi Sê-i-rơ[c] cho Ê-sau làm sản nghiệp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dù chỉ bằng một bước chân” hoặc “dù chỉ một chỗ cho lòng bàn chân.”'
    reason: lexical_alternative
  - marker: b
    text: “Sản nghiệp” cũng có thể dịch là “phần sở hữu” hoặc “cơ nghiệp.”
    reason: lexical_alternative
  - marker: c
    text: “Núi Sê-i-rơ” cũng có thể chỉ vùng núi hay miền đồi núi Sê-i-rơ.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: Đừng gây hấn với họ
  rationale: Dạng hitpael của גרה đi với ב diễn tả việc khơi mào sự đối đầu thù địch. “Gây hấn” tự nhiên trong tiếng Việt hiện đại, phù hợp bối cảnh cấm hành động thù địch mà không thu hẹp nghĩa thành một trận chiến chính thức.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: Ta sẽ không ban cho các con bất cứ phần đất nào của họ
  rationale: 'Giới từ מן có nghĩa phân chia: Đức Chúa Trời sẽ không ban cho Israel một phần nào từ lãnh thổ của Ê-đôm. Cách dịch này rõ ràng và tự nhiên.'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: dù chỉ đủ cho một bàn chân đặt lên
  rationale: Thành ngữ chỉ một khoảnh đất nhỏ nhất, theo nghĩa đen là chỗ cho lòng bàn chân giẫm lên. Bản dịch giữ hình ảnh cụ thể nhưng diễn đạt gọn và dễ hiểu.
- source_word: יְרֻשָּׁה
  choice: làm sản nghiệp
  rationale: Danh từ có thể chỉ tài sản thuộc quyền sở hữu hoặc phần thừa hưởng. “Sản nghiệp” giữ được sắc thái một phần đất do Đức Chúa Trời trao ban, đồng thời không buộc nghĩa vào cơ chế thừa kế gia đình.
- source_word: לְעֵשָׂו
  choice: cho Ê-sau
  rationale: Giữ tên riêng theo lối phiên âm tiếng Việt quen dùng; giới từ לְ đánh dấu người nhận sự ban cho.
- source_word: הַר שֵׂעִיר
  choice: núi Sê-i-rơ
  rationale: Cụm từ có thể chỉ núi hoặc miền núi Sê-i-rơ. “Núi Sê-i-rơ” là cách gọi ngắn gọn, quen thuộc, còn phạm vi địa lý rộng hơn được ghi chú.
theological_decisions:
- issue: Việc Đức Chúa Trời ban lãnh thổ Ê-đôm
  choice: 'Giữ rõ hai lý do cho mệnh lệnh: Đức Chúa Trời sẽ không ban đất Ê-đôm cho Israel, vì Ngài đã ban Sê-i-rơ cho Ê-sau.'
  alternative: Hiểu đây chỉ là một lệnh cấm mang tính chính trị, không nhấn mạnh việc Đức Chúa Trời phân chia đất đai.
  rationale: Hai mệnh đề כִּי đặt lệnh cấm trong khuôn khổ quyền ban đất của Đức Chúa Trời. Bản dịch bảo tồn lý do thần học ấy mà không diễn giải vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/các con” thể hiện lời Đức Chúa Trời phán với Israel trong ngữ cảnh. Dùng “gây hấn” để giữ sắc thái chủ động khơi mào xung đột; giữ hình ảnh bàn chân của nguyên văn. Các dấu chú thích đều xuất hiện trong câu chính.
