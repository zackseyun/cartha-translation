  text: כַּ/אֲשֶׁ֨ר עָֽשׂוּ לִ֜/י בְּנֵ֣י עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר וְ/הַ/מּ֣וֹאָבִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/עָ֑ר עַ֤ד אֲשֶֽׁר אֶֽעֱבֹר֙ אֶת הַ/יַּרְדֵּ֔ן אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: vi
  text: đúng như con cháu Ê-sau sống tại Sê-i-rơ và người Mô-áp sống tại A-rơ đã đối đãi với tôi[a], cho đến khi tôi vượt qua sông Giô-đanh vào miền đất mà Yahweh, Đức Chúa Trời của chúng ta, đang ban cho chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã làm cho tôi.” Nguyên văn Hê-bơ-rơ dùng cụm “đã làm cho tôi”; trong ngữ cảnh, cụm này có thể nói đến việc cho đi qua và cung cấp lương thực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Giữ rõ sắc thái so sánh với cách cư dân Ê-đôm và Mô-áp đã đối xử trước đó.
- source_word: עָשׂוּ לִי
  choice: đã làm cho tôi
  rationale: Bám sát cấu trúc Hê-bơ-rơ mà không diễn giải quá mức; ngữ cảnh nói đến việc cho đi qua và cung cấp lương thực.
- source_word: בְּנֵי עֵשָׂו
  choice: con cháu Ê-sau
  rationale: Trong ngữ cảnh dân tộc tập thể, cụm này tự nhiên chỉ hậu duệ của Ê-sau, đồng thời vẫn giữ hình ảnh gia tộc của nguyên văn.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: sống tại Sê-i-rơ
  rationale: Diễn đạt tự nhiên ý cư trú ổn định của phân từ יֹשְׁבִים.
- source_word: וְהַמּוֹאָבִים
  choice: và người Mô-áp
  rationale: Cách gọi dân tộc tự nhiên và thông dụng trong tiếng Việt.
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: sống tại A-rơ
  rationale: Giữ cấu trúc song song với mệnh đề nói về Sê-i-rơ và phiên âm A-rơ như địa danh.
- source_word: עַד אֲשֶׁר אֶעֱבֹר
  choice: cho đến khi tôi vượt qua
  rationale: Thể hiện mốc thời gian và hành động đi qua một ranh giới địa lý.
- source_word: אֶת הַיַּרְדֵּן
  choice: sông Giô-đanh
  rationale: Bổ sung danh từ loại 'sông' để địa danh rõ và tự nhiên đối với độc giả Việt.
- source_word: אֶל הָאָרֶץ
  choice: để vào miền đất
  rationale: Diễn tả hướng chuyển động vào bên trong miền đất sau khi vượt sông.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Chuyển đạt trực tiếp danh xưng giao ước, đi cùng danh Yahweh.
- source_word: נֹתֵן לָנוּ
  choice: đang ban cho chúng ta
  rationale: Giữ sắc thái hiện thời và chắc chắn của phân từ נֹתֵן; 'ban' phù hợp với văn phong trang trọng khi nói về ân ban của Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH; giữ dạng Yahweh giúp bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Phạm vi ý nghĩa của עָשׂוּ לִי
  choice: đã làm cho tôi
  alternative: đã đối đãi với tôi / đã cho tôi đi qua và cung cấp lương thực
  rationale: Bản văn diễn đạt khái quát; không đưa chi tiết ngữ cảnh vào chính văn để tránh giải quyết quá mức điều nguyên văn chỉ hàm ý.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'con cháu Ê-sau' thay cho cách dịch máy móc 'các con trai Ê-sau'; giữ Yahweh là danh riêng. Dấu chân chú thích [a] được đặt ngay sau cụm từ liên quan.
