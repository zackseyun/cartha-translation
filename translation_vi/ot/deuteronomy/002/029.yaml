- from: đúng như con cháu Ê-sau sống tại Sê-i-rơ và người Mô-áp sống tại A-rơ đã làm cho tôi[a], cho đến khi tôi vượt qua sông Giô-đanh để vào miền đất mà Yahweh, Đức Chúa Trời của chúng ta, đang ban cho chúng ta.
  to: đúng như con cháu Ê-sau sống tại Sê-i-rơ và người Mô-áp sống tại A-rơ đã đối đãi với tôi[a], cho đến khi tôi vượt qua sông Giô-đanh vào miền đất mà Yahweh, Đức Chúa Trời của chúng ta, đang ban cho chúng ta.
  rationale: Sửa cách diễn đạt sát chữ nhưng không tự nhiên “đã làm cho tôi” thành “đã đối đãi với tôi”, đồng thời đưa cách dịch sát chữ vào chú thích. Điều này bảo toàn tính khái quát của nguyên văn và không biến hàm ý ngữ cảnh thành nội dung chính văn. Bỏ “để” để phản ánh trực tiếp đích đến được nêu trong tiếng Hê-bơ-rơ.
