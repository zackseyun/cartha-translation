source:
  edition: WLC
  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: vi
  text: Vậy, chúng tôi đi qua khỏi anh em mình, là con cháu Ê-sau đang sống tại Sê-i-rơ, rời con đường A-ra-ba, từ Ê-lát và Ê-xi-ôn Ghê-be; rồi chúng tôi đổi hướng và đi theo con đường qua hoang mạc Mô-áp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: đi qua khỏi
  rationale: Động từ עבר cùng מֵאֵת diễn tả việc tiếp tục hành trình, đi qua rồi rời khỏi những người được nhắc đến; cách dịch này vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: anh em mình, là con cháu Ê-sau
  rationale: Giữ nguyên ngôn ngữ thân tộc 'anh em' của tiếng Hê-bơ-rơ và diễn đạt בְנֵי theo nghĩa dòng dõi tự nhiên trong tiếng Việt.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: đang sống tại Sê-i-rơ
  rationale: ישב ở dạng phân từ chỉ nơi cư trú ổn định; 'đang sống tại' là cách nói hiện đại, rõ nghĩa.
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: rời con đường A-ra-ba
  rationale: מִן chỉ sự rời khỏi, דֶּרֶךְ là đường hay tuyến đường, còn A-ra-ba được giữ như địa danh để tránh thu hẹp nghĩa thành một đồng bằng hay sa mạc chung chung.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: từ Ê-lát và Ê-xi-ôn Ghê-be
  rationale: Giữ cấu trúc chỉ điểm xuất phát của nguyên văn và dùng dạng phiên âm địa danh quen thuộc trong tiếng Việt.
- source_word: וַנֵּפֶן
  choice: rồi chúng tôi đổi hướng
  rationale: פנה ở đây biểu thị sự thay đổi hướng đi; 'đổi hướng' rõ hơn 'quay lại', vốn có thể hàm ý trở về nơi cũ.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: và đi theo con đường dẫn đến hoang mạc Mô-áp
  rationale: דֶּרֶךְ có thể chỉ đường hoặc lối đi. Cách dịch này diễn đạt tự nhiên hành trình theo hướng hoang mạc Mô-áp mà không thêm ý họ băng xuyên qua hoang mạc.
theological_decisions:
- issue: Ngôn ngữ thân tộc dành cho dân Ê-đôm
  choice: anh em mình, là con cháu Ê-sau
  alternative: bà con mình, là hậu duệ Ê-sau
  rationale: Nguyên văn gọi họ là 'anh em chúng ta', nhấn mạnh quan hệ thân tộc giữa Y-sơ-ra-ên và Ê-đôm. Giữ 'anh em' bảo toàn sắc thái thần học-lịch sử ấy, còn 'con cháu' truyền đạt tự nhiên thành ngữ 'các con trai của Ê-sau'.
translation_notes:
  register: Văn phong trần thuật trang trọng nhưng hiện đại. Dùng 'chúng tôi' theo lời thuật của Môi-se, giữ cách gọi thân tộc 'anh em mình', và phiên âm nhất quán các địa danh. Dấu chú thích [a] xuất hiện trong chính văn.
