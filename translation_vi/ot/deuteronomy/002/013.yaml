base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: vi
  text: Bây giờ, hãy đứng dậy và vượt qua suối Xê-rết[a]. Vậy chúng tôi đã vượt qua suối Xê-rết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khe Xê-rết,” “lòng suối Xê-rết” hoặc “thung lũng Xê-rết.” Từ Hê-bơ-rơ נחל có thể chỉ một khe núi, lòng dòng nước theo mùa hoặc một con suối, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Bây giờ
  rationale: Giữ chức năng của trạng từ thời gian mở đầu mệnh lệnh mới và sắc thái tức thời của câu Hê-bơ-rơ.
- source_word: קֻמוּ
  choice: hãy đứng dậy
  rationale: Chuyển tải mệnh lệnh số nhiều của קום bằng cách diễn đạt tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: וְעִבְרוּ
  choice: và vượt qua
  rationale: Trong ngữ cảnh hành trình, עבר chỉ việc đi từ bên này sang bên kia; “vượt qua” giữ được sắc thái định hướng và sự lặp lại với động từ ở vế sau.
- source_word: לָכֶם
  choice: không dịch riêng
  rationale: Đây là thành phần bổ sung sắc thái thúc giục cho mệnh lệnh; dịch sát thành “cho các ngươi” sẽ thiếu tự nhiên và dễ tạo thêm ý nghĩa không có trong ngữ cảnh.
- source_word: נַחַל
  choice: khe
  rationale: נחל có thể chỉ khe núi, lòng suối hoặc dòng nước theo mùa. “Khe” dễ hiểu trong tiếng Việt và phù hợp bối cảnh địa hình hoang mạc mà không mặc nhiên khẳng định có dòng nước thường xuyên.
- source_word: זָרֶד
  choice: Xê-rết
  rationale: Phiên âm địa danh Hê-bơ-rơ theo lối dễ đọc đối với độc giả tiếng Việt.
- source_word: וַנַּעֲבֹר
  choice: Thế là chúng tôi vượt qua
  rationale: Dạng wayyiqtol ngôi thứ nhất số nhiều thuật lại việc thi hành mệnh lệnh; “Thế là” diễn đạt tự nhiên trình tự và kết quả trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Giữ hai mệnh đề mệnh lệnh–thi hành của nguyên văn; dùng “khe” trong chính văn và chú thích các khả năng địa hình khác để bảo toàn độ rộng nghĩa của נחל.
