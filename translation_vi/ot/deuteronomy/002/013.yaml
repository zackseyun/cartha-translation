  - severity: low
    issue: “Thế là” có sắc thái khẩu ngữ nhẹ.
    rationale: Dạng thuật sự của nguyên văn thích hợp hơn với “Vậy chúng tôi đã vượt qua,” vừa trang trọng vừa không thêm ý nghĩa.
