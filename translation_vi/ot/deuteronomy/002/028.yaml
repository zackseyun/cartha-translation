base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: vi
  text: Xin hãy bán cho tôi thức ăn lấy bạc để tôi ăn, và cho tôi nước lấy bạc để tôi uống; chỉ xin cho tôi đi qua đi bộ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “bằng/trên chân tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: thức ăn
  rationale: Danh từ chỉ thức ăn nói chung; không thu hẹp nghĩa thành bánh, ngũ cốc hay lương thực.
- source_word: בַּכֶּסֶף
  choice: lấy bạc
  rationale: Giữ hình ảnh cụ thể của כֶּסֶף là bạc dùng làm phương tiện thanh toán, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: תַּשְׁבִּרֵנִי
  choice: bán thức ăn cho tôi
  rationale: Dạng Hiphil của שׁבר trong ngữ cảnh này chỉ việc bán hoặc cấp lương thực có trả tiền; bổ sung tân ngữ 'thức ăn' từ đầu câu để câu tiếng Việt rõ nghĩa.
- source_word: וְאָכַלְתִּי
  choice: để tôi ăn
  rationale: Diễn đạt kết quả hoặc mục đích được nhắm đến trong lời thỉnh cầu, thay vì hiểu đơn thuần như một lời dự báo tương lai.
- source_word: תִּתֶּן לִי
  choice: cho tôi
  rationale: Tương đương trực tiếp và tự nhiên của נתן kết hợp với לִי.
- source_word: וְשָׁתִיתִי
  choice: để tôi uống
  rationale: Giữ sắc thái mục đích hoặc kết quả song song với וְאָכַלְתִּי.
- source_word: רַק
  choice: chỉ
  rationale: Đánh dấu giới hạn của lời thỉnh cầu một cách ngắn gọn.
- source_word: אֶעְבְּרָה
  choice: xin cho tôi đi qua
  rationale: Phản ánh sắc thái khẩn cầu hoặc xin phép của dạng cohortative trong ngữ cảnh.
- source_word: בְרַגְלָי
  choice: bằng đôi chân mình
  rationale: Giữ cách nói cụ thể, sát nghĩa đen 'bằng/trên chân tôi', thay vì chỉ dùng thành ngữ khái quát 'đi bộ'.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “xin ông” để thể hiện lời thỉnh cầu hướng đến người cai trị được nói với ở ngôi thứ hai số ít; giữ cấu trúc song song “để tôi ăn… để tôi uống” và dấu gạch cuối câu vì lời nói tiếp tục sang câu sau.
