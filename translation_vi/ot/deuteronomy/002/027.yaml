  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֔/ךָ בַּ/דֶּ֥רֶךְ בַּ/דֶּ֖רֶךְ אֵלֵ֑ךְ לֹ֥א אָס֖וּר יָמִ֥ין וּ/שְׂמֹֽאול׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: vi
  text: Xin cho tôi đi qua đất của vua. Tôi sẽ chỉ đi theo con đường[a], không rẽ sang phải hay sang trái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn lặp lại “theo con đường, theo con đường” để nhấn mạnh rằng dân Y-sơ-ra-ên sẽ tuyệt đối không rời tuyến đường.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Xin cho tôi đi qua
  rationale: Dạng cohortative ngôi thứ nhất số ít diễn đạt lời thỉnh cầu trong bối cảnh ngoại giao; “Xin cho tôi đi qua” tự nhiên và lịch sự trong tiếng Việt.
- source_word: בְאַרְצֶךָ
  choice: đất của vua
  rationale: Sau động từ עבר, giới từ ב chỉ việc đi xuyên qua lãnh thổ. Đại từ ngôi hai số ít hướng đến một vị vua; “đất của vua” vừa rõ nghĩa vừa phù hợp lời thỉnh cầu trang trọng.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: chỉ đi theo con đường
  rationale: Sự lặp lại trong tiếng Hê-bơ-rơ có tác dụng nhấn mạnh việc tuyệt đối không rời tuyến đường; từ “chỉ” chuyển tải sức nhấn ấy một cách tự nhiên.
- source_word: אֵלֵךְ
  choice: tôi sẽ đi
  rationale: הלך trong ngữ cảnh hành trình mang nghĩa thông thường là đi hoặc tiến bước; “tôi sẽ đi” rõ ràng và hiện đại.
- source_word: לֹא אָסוּר
  choice: không rẽ
  rationale: סור chỉ việc quay hoặc lệch khỏi đường. “Không rẽ” tự nhiên trong tiếng Việt và kết hợp trực tiếp với hai hướng theo sau.
- source_word: יָמִין וּשְׂמֹאול
  choice: sang phải hay sang trái
  rationale: Giữ nguyên hình ảnh định hướng cố định của nguyên văn, diễn tả việc không đi chệch về bất cứ phía nào.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” làm đại từ xưng hô theo bối cảnh Sihôn là vua, tránh “ngươi” vốn dễ tạo sắc thái bề trên không phù hợp với lời thỉnh cầu ngoại giao. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
