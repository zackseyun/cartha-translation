  text: וַֽ/יִּתְּנֵ֛/הוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵ֑י/נוּ וַ/נַּ֥ךְ אֹת֛/וֹ וְ/אֶת בנ/ו וְ/אֶת כָּל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: vi
  text: Yahweh, Đức Chúa Trời chúng ta, đã trao nộp người ấy cho chúng ta[a]; chúng ta đánh hạ người ấy cùng các con trai người ấy[b] và toàn thể dân người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “trước mặt chúng ta”; trong ngữ cảnh này, cụm từ có nghĩa là Yahweh trao người ấy vào quyền của Israel.
    reason: lexical_alternative
  - marker: b
    text: Văn bản phụ âm Hê-bơ-rơ ghi “con trai người ấy”; nhiều người hiểu theo nghĩa tập thể là “các con trai người ấy” trong ngữ cảnh này.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: đã trao nộp ông ta cho chúng ta
  rationale: Trong bối cảnh chiến trận, נתן kết hợp với לְפָנֵינוּ diễn tả việc đặt kẻ thù dưới quyền đối phương. “Trao nộp” truyền đạt ý này tự nhiên hơn cách dịch sát từng chữ là “đặt trước mặt chúng ta”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Danh từ với hậu tố ngôi thứ nhất số nhiều có nghĩa trực tiếp là “Đức Chúa Trời của chúng ta”.
- source_word: וַנַּךְ אֹתוֹ
  choice: chúng ta đánh hạ ông ta
  rationale: נכה trong trình thuật quân sự chỉ việc giáng đánh mang tính quyết định, thường dẫn đến thất bại hoặc tử trận. “Đánh hạ” giữ được sức nặng ấy mà không diễn giải quá mức.
- source_word: בנו
  choice: các con trai ông
  rationale: Văn bản phụ âm có hình thức có thể được đọc là số ít, còn truyền thống đọc Masoret và ngữ cảnh hiểu là số nhiều. Bản dịch chính dùng số nhiều nhưng ghi chú biến thể.
- source_word: כָּל עַמּוֹ
  choice: toàn thể dân ông
  rationale: עַם có nghĩa thông thường là “dân”; cách dịch này giữ nguyên phạm vi bao quát của כָּל và không thu hẹp thành riêng quân đội.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay thế bằng tước hiệu.
- issue: Phạm vi của בנו
  choice: các con trai ông
  alternative: con trai ông
  rationale: Giữ cách đọc số nhiều của truyền thống Masoret và ý nghĩa phù hợp với bản tường thuật chiến trận, đồng thời chú thích rằng văn bản phụ âm có thể được đọc ở số ít để không che khuất sự không chắc chắn của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trao nộp” và “đánh hạ” để giữ sắc thái quân sự; dấu chấm phẩy giúp thể hiện hai hành động liên tiếp. Đại từ “ông ta” chỉ Si-hôn, tránh sắc thái khinh miệt.
