    issue: Đại từ “ông ta”
    rationale: Trong tiếng Việt hiện đại, “ông ta” đôi khi có sắc thái xa cách hoặc bất kính; “người ấy” trung tính hơn khi chỉ Si-hôn.
  - severity: medium
    issue: Diễn đạt chú thích b về truyền thống Masoret
    rationale: 'Chú thích nên giới hạn ở điều có thể xác định từ dữ liệu được cung cấp: văn bản phụ âm ghi dạng số ít, trong khi nhiều người hiểu theo nghĩa tập thể/số nhiều theo ngữ cảnh. Việc gán thẳng cách đọc số nhiều cho “truyền thống đọc Masoret” có thể làm quá chắc một vấn đề văn bản đang được đánh dấu là cần chú thích.'
