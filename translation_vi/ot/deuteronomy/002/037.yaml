source:
  edition: WLC
  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: vi
  text: 'Chỉ có đất của con cháu Am-môn[a] là anh em không đến gần: toàn vùng dọc theo khe Gia-bốc[b], các thành ở miền đồi núi, và mọi điều Yahweh, Đức Chúa Trời của chúng ta, đã truyền[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “đất của người Am-môn”. Nguyên văn: “đất của các con trai Am-môn”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “toàn bộ tay của khe Gia-bốc”; đây là một thành ngữ chỉ phía, bờ hoặc vùng đất dọc theo khe.'
    reason: cultural_note
  - marker: c
    text: 'Nguyên văn tỉnh lược: “và mọi điều Yahweh, Đức Chúa Trời của chúng ta, đã truyền.” Văn mạch liên hệ mệnh đề này với các nơi dân Y-sơ-ra-ên không được đến gần, nhưng bổ ngữ của “đã truyền” không được nêu rõ trong tiếng Hê-bơ-rơ.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: רַק
  choice: Chỉ có
  rationale: Đánh dấu ngoại lệ đối với phần tóm lược trước đó; cách diễn đạt này tự nhiên trong tiếng Việt và nối trực tiếp với “đất của con cháu Am-môn”.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: đất của con cháu Am-môn
  rationale: Giữ tương đối sát cấu trúc Hê-bơ-rơ “đất của các con trai Am-môn”, nhưng dùng “con cháu” để diễn đạt tự nhiên ý nghĩa dân tộc trong tiếng Việt.
- source_word: לֹא קָרַבְתָּ
  choice: anh em không đến gần
  rationale: Giữ nghĩa không gian cơ bản của động từ קרב và không tự động diễn giải thành “tấn công”. Đại từ số nhiều “anh em” phù hợp cách Môi-se nói với dân Y-sơ-ra-ên trong văn mạch, dù hình thái Hê-bơ-rơ là ngôi hai số ít mang tính tập thể.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: toàn vùng dọc theo khe Gia-bốc
  rationale: “Tay của khe” là thành ngữ chỉ phía, bờ hoặc khu vực dọc theo dòng nước. “Toàn vùng dọc theo” truyền đạt phạm vi mà không buộc người đọc hiểu là chỉ một bờ hẹp.
- source_word: וְעָרֵי הָהָר
  choice: các thành miền đồi núi
  rationale: הָהָר tại đây chỉ vùng địa hình cao, không nhất thiết là một ngọn núi đơn lẻ; “miền đồi núi” là cách nói rõ và tự nhiên.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: cùng tất cả những nơi mà ... đã truyền không được đến gần
  rationale: Câu Hê-bơ-rơ tỉnh lược bổ ngữ sau “đã truyền”. Bản dịch làm rõ theo danh sách địa điểm và mệnh lệnh trong văn mạch, đồng thời ghi chú cách dịch sát chữ để bảo tồn sự tỉnh lược và độ mở của nguyên văn.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc, trang trọng trong tiếng Việt để biểu thị trực tiếp danh giao ước יהוה, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵינוּ
  choice: Đức Chúa Trời của chúng ta
  rationale: Cách dịch chuẩn, trang trọng và rõ nghĩa cho danh xưng giao ước có đại từ sở hữu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. “Đức Giê-hô-va” bảo tồn chức năng tên riêng trong lối văn Việt trang trọng, thay vì thay thế bằng tước hiệu; “Yahweh” là một dạng phiên âm học thuật khác có thể dùng.
- issue: Bổ sung nội dung hàm ẩn sau צִוָּה
  choice: đã truyền không được đến gần
  alternative: đã truyền; mọi điều Đức Giê-hô-va ... đã truyền
  rationale: Văn mạch nói về những địa điểm Y-sơ-ra-ên không được xâm phạm, nhưng tiếng Hê-bơ-rơ để bổ ngữ của “truyền” ở dạng hàm ẩn. Bản chính làm rõ ý theo văn mạch, còn chú thích nêu cách dịch sát chữ để không che khuất sự tỉnh lược.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện ngôi hai số ít tập thể của tiếng Hê-bơ-rơ bằng cách xưng hô tự nhiên với toàn dân; địa danh được phiên âm theo truyền thống Kinh Thánh tiếng Việt.
