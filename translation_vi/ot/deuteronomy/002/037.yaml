- from: 'Chỉ có đất của con cháu Am-môn[a] là anh em không đến gần: toàn vùng dọc theo khe Gia-bốc[b], các thành miền đồi núi, cùng tất cả những nơi mà Đức Giê-hô-va, Đức Chúa Trời của chúng ta, đã truyền không được đến gần.[c]'
