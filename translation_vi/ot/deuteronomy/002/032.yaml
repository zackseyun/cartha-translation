  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: vi
  text: Bấy giờ, Si-hôn cùng toàn dân mình kéo ra đón chúng tôi để giao chiến tại Gia-hát.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: kéo ra
  rationale: Động từ יצא kể một hành động trong quá khứ là “đi/ra”. Trong văn cảnh quân sự, “kéo ra” là cách diễn đạt tự nhiên, cho thấy Si-hôn cùng dân mình tiến ra mà không thêm ý ngoài câu gốc.
- source_word: סִיחֹן
  choice: Si-hôn
  rationale: Phiên âm tên riêng theo lối quen thuộc và dễ đọc trong tiếng Việt.
- source_word: לִקְרָאתֵנוּ
  choice: đón chúng tôi
  rationale: Cụm từ có nghĩa cơ bản là “đi ra gặp/đón”. Ý đối địch đã được làm rõ bởi cụm “để giao chiến”, nên bản dịch giữ sắc thái trực tiếp của nguyên ngữ thay vì chuyển thành “chống lại chúng tôi”.
- source_word: הוּא וְכָל עַמּוֹ
  choice: cùng toàn dân mình
  rationale: Đại từ הוּא nêu lại Si-hôn rồi gắn ông với toàn dân của ông. Tiếng Việt diễn đạt tự nhiên bằng “Si-hôn cùng toàn dân mình”; עם được giữ là “dân”, không thu hẹp thành “quân đội”.
- source_word: לַמִּלְחָמָה
  choice: để giao chiến
  rationale: Giới từ ל biểu thị mục đích; “để giao chiến” tự nhiên trong tiếng Việt và thể hiện rõ mục đích quân sự.
- source_word: יָהְצָה
  choice: tại Gia-ha
  rationale: Dạng יָהְצָה gồm địa danh Gia-ha với hậu tố chỉ hướng; trong văn cảnh này tiếng Việt tự nhiên dùng “tại Gia-ha” để chỉ địa điểm cuộc giao chiến.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. Câu giữ sát trình tự sự kiện của tiếng Hê-bơ-rơ nhưng điều chỉnh cấu trúc cho tự nhiên trong tiếng Việt; không cần chú thích vì các sắc thái quan trọng được bảo toàn ngay trong chính văn.
