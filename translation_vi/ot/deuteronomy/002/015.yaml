source:
  edition: WLC
  text: וְ/גַ֤ם יַד יְהוָה֙ הָ֣יְתָה בָּ֔/ם לְ/הֻמָּ֖/ם מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֑ה עַ֖ד תֻּמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: vi
  text: Hơn nữa, tay Yahweh cũng chống lại họ, làm họ hoảng loạn[a] và tan tác khỏi giữa trại quân, cho đến khi họ không còn nữa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm họ rối loạn” hoặc “làm họ tan tác”; động từ Hê-bơ-rơ có thể chỉ việc gây kinh hoàng hoặc hỗn loạn như một hành động phán xét.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “cho đến khi họ chết hết” hoặc “cho đến khi họ bị diệt hết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Hơn nữa
  rationale: Diễn đạt cả ý nối tiếp lẫn nhấn mạnh của cụm từ trong mối liên hệ với câu trước.
- source_word: יַד יְהוָה
  choice: tay Yahweh
  rationale: Giữ hình ảnh Hê-bơ-rơ chỉ quyền năng và hành động trực tiếp của Đức Chúa Trời, đồng thời phiên âm danh giao ước.
- source_word: בָם
  choice: nghịch cùng họ
  rationale: Trong kết cấu với 'tay Yahweh', giới từ diễn tả hành động đối nghịch nhắm vào họ.
- source_word: לְהֻמָּם
  choice: khiến họ hoảng loạn
  rationale: Động từ המם có thể chỉ việc gây kinh hoàng, rối loạn hoặc tan tác; 'hoảng loạn' tự nhiên trong tiếng Việt và không đồng nhất hành động này với kết quả chết mất.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: bị loại khỏi giữa trại quân
  rationale: Giữ ý rời khỏi phần giữa của trại; bổ sung 'bị loại' để câu tiếng Việt thể hiện tự nhiên hướng tác động của מִן trong ngữ cảnh.
- source_word: עַד תֻּמָּם
  choice: cho đến khi họ không còn nữa
  rationale: Diễn đạt sự chấm dứt hoàn toàn của cả nhóm mà không xác định quá mức sắc thái là bị giết, tiêu diệt hay tự nhiên qua đời.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước YHWH; giữ 'Yahweh' để phân biệt danh riêng này với tước hiệu.
- issue: Tác nhân của sự phán xét
  choice: Giữ hình ảnh 'tay Yahweh nghịch cùng họ'
  alternative: Yahweh trừng phạt họ
  rationale: 'Giữ nguyên ẩn dụ và mối căng thẳng thần học của câu: chính hành động quyền năng của Yahweh hướng nghịch cùng thế hệ ấy, thay vì diễn giải khái quát thành một thuật ngữ thần học.'
- issue: Ý nghĩa kết cuộc của עַד תֻּמָּם
  choice: họ không còn nữa
  alternative: họ bị tiêu diệt / họ chết hết
  rationale: Cách chọn giữ phạm vi nghĩa rộng của động từ תמם trong ngữ cảnh; câu trước cho biết thế hệ chiến binh đã chết hết, nhưng riêng cụm này nhấn mạnh sự kết thúc hoàn toàn mà không nêu rõ phương thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ cụ thể 'tay Yahweh' nhưng dùng 'nghịch cùng' để biểu đạt rõ sắc thái đối địch. Các chú thích bảo tồn những khả năng từ vựng thật sự của לְהֻמָּם và עַד תֻּמָּם.
