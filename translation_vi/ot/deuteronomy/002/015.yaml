    rationale: Nguyên ngữ dùng một động từ chỉ việc gây hoảng loạn/rối loạn hoặc đánh tan; cụm “khỏi giữa trại quân” xác định phạm vi/điểm xuất phát của việc họ bị đánh tan. Câu sửa diễn đạt sự liên hệ này rõ hơn mà không thêm một hành động độc lập.
