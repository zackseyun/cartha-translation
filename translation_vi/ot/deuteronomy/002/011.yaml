  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: vi
  text: Họ cũng được xem là người Rê-pha-im[a], giống như người A-na-kim; nhưng người Mô-áp gọi họ là Ê-mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người khổng lồ”; tuy nhiên, tiếng Hê-bơ-rơ ở đây tự nhiên hơn khi được hiểu là tên của một nhóm dân cổ.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: người Rê-pha-im
  rationale: Giữ nguyên tên của một nhóm dân cổ thay vì diễn giải là “người khổng lồ”; thêm “người” để câu tiếng Việt tự nhiên và làm rõ đây là tên một dân tộc.
- source_word: יֵחָשְׁבוּ
  choice: được xem là
  rationale: Diễn đạt tự nhiên thể bị động của động từ, với nghĩa được coi hoặc xếp vào một nhóm.
- source_word: אַף הֵם
  choice: họ cũng
  rationale: Giữ ý bao gồm và nhấn mạnh rằng nhóm này cũng thuộc cách phân loại vừa nêu.
- source_word: כָּעֲנָקִים
  choice: giống như người A-na-kim
  rationale: Tiền tố כ biểu thị sự so sánh; phiên âm A-na-kim như tên của một nhóm dân.
- source_word: וְהַמֹּאָבִים
  choice: nhưng người Mô-áp
  rationale: Dịch liên từ theo chức năng diễn ngôn, đánh dấu sự chuyển từ cách phân loại chung sang tên gọi riêng của người Mô-áp.
- source_word: יִקְרְאוּ לָהֶם
  choice: gọi họ là
  rationale: Thành ngữ קרא ל mang nghĩa gọi hoặc đặt tên; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: אֵמִים
  choice: Ê-mim
  rationale: Phiên âm tên mà người Mô-áp dùng cho nhóm dân này, không thêm ý diễn giải ngoài nguyên văn.
theological_decisions: []
