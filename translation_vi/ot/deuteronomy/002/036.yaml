  text: מֵֽ/עֲרֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנֹ֜ן וְ/הָ/עִ֨יר אֲשֶׁ֤ר בַּ/נַּ֨חַל֙ וְ/עַד הַ/גִּלְעָ֔ד לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר שָׂגְבָ֖ה מִמֶּ֑/נּוּ אֶת הַ/כֹּ֕ל נָתַ֛ן יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: vi
  text: Từ A-rô-e, là nơi ở mép khe Ác-nôn, và thành ở trong khe ấy, cho đến Ga-la-át, không có thành nào cao quá sức chúng ta[a]; Yahweh, Đức Chúa Trời chúng ta, đã trao tất cả vào tay chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không có thành nào quá vững mạnh đối với chúng ta” hoặc “không có thành nào chúng ta không thể tiếp cận.” Tiếng Hê-bơ-rơ nói sát nghĩa rằng không thành nào “cao quá sức chúng ta,” dùng độ cao làm hình ảnh chỉ sức phòng thủ hoặc tình trạng khó tiếp cận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: Từ A-rô-e
  rationale: Tiền tố מ־ đánh dấu điểm khởi đầu của phạm vi địa lý; “Từ” diễn đạt tự nhiên và chính xác chức năng này.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: bên bờ thung lũng Ác-nôn
  rationale: שָׂפָה có nghĩa đen là “mép/bờ”; נַחַל ở đây chỉ thung lũng hoặc khe có dòng nước. Cách dịch này rõ ràng trong tiếng Việt hiện đại mà không quá kỹ thuật.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: và thành ở trong thung lũng ấy
  rationale: Giữ liên từ đơn וְ và chi tiết địa lý của nguyên văn, không tự ý thêm một giới từ “từ” thứ hai hay xác định danh tính của thành.
- source_word: וְעַד הַגִּלְעָד
  choice: cho đến Ga-la-át
  rationale: עַד đánh dấu điểm cuối của phạm vi lãnh thổ.
- source_word: קִרְיָה
  choice: thành
  rationale: קִרְיָה chỉ một thành hoặc thị trấn; “thành” phù hợp với bối cảnh các khu định cư có phòng thủ và có sắc thái trang trọng tự nhiên.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: quá cao đối với chúng ta
  rationale: Giữ hình ảnh “cao” của tiếng Hê-bơ-rơ, vốn có thể hàm ý thành được phòng thủ vững chắc hoặc khó tiếp cận, thay vì chỉ chọn một nghĩa diễn giải.
- source_word: אֶת־הַכֹּל
  choice: tất cả
  rationale: Cụm tân ngữ chỉ toàn thể những gì vừa được nhắc đến; “tất cả” giữ được tính tập hợp mà không ép thành số ít hay số nhiều.
- source_word: לְפָנֵינוּ
  choice: vào tay chúng ta
  rationale: Trong bối cảnh chinh phục, thành ngữ “đặt/trao trước mặt” biểu thị giao vào quyền kiểm soát. “Trao vào tay” là thành ngữ tiếng Việt tự nhiên, làm rõ ý nghĩa ngữ cảnh.
theological_decisions:
- issue: Cách chuyển dịch danh thần יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Tác nhân thần linh trong cuộc chinh phục
  choice: Yahweh, Đức Chúa Trời của chúng ta, đã trao tất cả vào tay chúng ta
  alternative: Yahweh, Đức Chúa Trời của chúng ta, đã đặt tất cả trước mặt chúng ta
  rationale: Giữ rõ lời tuyên bố rằng chiến thắng đến từ hành động của Yahweh, đồng thời dùng một thành ngữ tiếng Việt phù hợp với ngữ cảnh quân sự; không thêm lời giải thích hay đánh giá thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Các địa danh được phiên âm theo lối quen thuộc trong tiếng Việt. Bản dịch giữ hình ảnh “quá cao” của nguyên văn và dùng chú thích để trình bày các nghĩa hàm ẩn có thể có.
