revisions:
- from: Từ A-rô-e, là nơi ở bên bờ thung lũng Ác-nôn, và thành ở trong thung lũng ấy, cho đến Ga-la-át, không có thành nào quá cao đối với chúng ta[a]; Yahweh, Đức Chúa Trời của chúng ta, đã trao tất cả vào tay chúng ta.
  to: Từ A-rô-e, là nơi ở mép khe Ác-nôn, và thành ở trong khe ấy, cho đến Ga-la-át, không có thành nào cao quá sức chúng ta[a]; Yahweh, Đức Chúa Trời chúng ta, đã trao tất cả vào tay chúng ta.
  rationale: Sửa thuật ngữ địa hình để phản ánh sát hơn שְׂפַת נַחַל אַרְנֹן, và thay cách nói kém tự nhiên bằng một cách diễn đạt tiếng Việt vẫn bảo toàn phép ẩn dụ «cao» của שָׂגְבָה. Không thêm giới từ «từ» trước «thành», không xác định danh tính thành, và không thay đổi ý toàn thể của אֶת־הַכֹּל hay thành ngữ chinh phục của לְפָנֵינוּ.
