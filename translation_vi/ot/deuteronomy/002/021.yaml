source:
  edition: WLC
  text: עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִ֑ים וַ/יַּשְׁמִידֵ֤/ם יְהוָה֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּירָשֻׁ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: vi
  text: một dân tộc lớn, đông đảo và cao lớn như người A-na-kim[a]. Yahweh đã tiêu diệt dân ấy khỏi trước mặt con cháu Ê-sau; họ chiếm lấy đất của dân ấy và ở thay chỗ dân ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “như con cháu A-nác.”'
    reason: Ghi cách diễn đạt khác của tên dân עֲנָקִים, vừa có thể phiên âm là A-na-kim vừa có thể hiểu là con cháu A-nác.
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב
  choice: một dân lớn mạnh, đông đảo
  rationale: 'Giữ danh từ tập hợp số ít עַם và phân biệt hai nét nghĩa: גָּדוֹל chỉ tầm vóc/sức mạnh của dân tộc, còn רַב chỉ số dân đông.'
- source_word: רָם
  choice: cao lớn
  rationale: Trong phép so sánh với người A-na-kim, từ này nói đến vóc người; “cao lớn” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: כָּעֲנָקִים
  choice: như người A-na-kim
  rationale: Tiền tố כ giữ ý so sánh; tên dân được phiên âm, còn cách diễn đạt theo dòng dõi được ghi ở chú thích như một khả năng dịch.
- source_word: וַיַּשְׁמִידֵם
  choice: đã tiêu diệt dân ấy
  rationale: Thể Hiphil của שׁמד diễn tả việc hủy diệt hoặc loại bỏ; “tiêu diệt” đủ mạnh nhưng không tự ý nhấn thành tuyệt diệt tuyệt đối.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước của Đức Chúa Trời bằng lối phiên âm, thay vì thay bằng một tước hiệu.
- source_word: מִפְּנֵיהֶם
  choice: khỏi trước mặt con cháu Ê-sau
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về việc dẹp bỏ một dân khỏi trước mặt dân khác; nêu rõ tiền ngữ từ văn cảnh để tiếng Việt không tối nghĩa.
- source_word: וַיִּירָשֻׁם
  choice: họ tước đất của dân ấy
  rationale: Trong văn cảnh chiếm lãnh, ירשׁ bao hàm việc truất quyền sở hữu của cư dân trước; cách dịch này tự nhiên hơn lối dịch sát chữ “chiếm hữu họ”.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: và cư ngụ thay chỗ họ
  rationale: Diễn đạt rõ việc một dân đến ở thay cho dân trước đó, đồng thời giữ sắc thái trang trọng của יָשַׁב.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu hay một dạng phiên âm truyền thống khác.
- issue: Chủ thể hưởng đất sau khi Yahweh tiêu diệt dân trước
  choice: con cháu Ê-sau, được nêu rõ từ văn cảnh trước
  alternative: giữ đại từ “họ” hoàn toàn như nguyên văn
  rationale: Các hậu tố số nhiều trong câu quy chiếu về con cháu Ê-sau ở câu trước. Nêu rõ một lần giúp câu tiếng Việt dễ hiểu mà không thêm một chủ thể thần học mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “cư ngụ” để giữ sắc thái Kinh Thánh vừa phải; tránh các cách nói quá khẩu ngữ như “quét sạch”. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
