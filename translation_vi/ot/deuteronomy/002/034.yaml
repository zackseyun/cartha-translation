  to: Lúc ấy, chúng tôi chiếm tất cả các thành của vua ấy và biệt hiến để hủy diệt[a] mọi thành cùng với đàn ông, phụ nữ và trẻ nhỏ. Chúng tôi không để một ai sống sót.
