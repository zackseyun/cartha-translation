source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: vi
  text: Lúc ấy, chúng tôi chiếm tất cả các thành của vua ấy và biệt hiến để hủy diệt[a] mọi thành cùng với đàn ông, phụ nữ và trẻ nhỏ. Chúng tôi không để một ai sống sót.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch theo lối trang trọng hơn: “đặt mọi thành dưới ḥerem.” Động từ Hê-bơ-rơ chỉ việc biệt hiến một người hay vật cho sự hủy diệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: chúng tôi chiếm
  rationale: Động từ לכד thường chỉ việc chiếm được một thành trong chiến trận; “chiếm” tự nhiên và giữ rõ bối cảnh quân sự.
- source_word: כָּל עָרָיו
  choice: tất cả các thành của vua ấy
  rationale: עִיר có thể là thành hoặc thị trấn. “Các thành” phù hợp với bối cảnh chinh phạt; thêm “vua ấy” làm rõ đại từ sở hữu giống đực theo ngữ cảnh gần mà không thay đổi đối tượng quy chiếu.
- source_word: בָּעֵת הַהִוא
  choice: Lúc ấy
  rationale: Cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt hiện đại và truyền đạt chính xác mốc thời gian.
- source_word: וַנַּחֲרֵם
  choice: biệt hiến để hủy diệt
  rationale: Dạng Hiphil của חרם diễn tả việc đặt người hay vật dưới ḥerem, tức dành riêng cho sự hủy diệt. Cụm này giữ được cả sắc thái biệt hiến và kết quả hủy diệt, thay vì chỉ nói chung là “tiêu diệt hoàn toàn”.
- source_word: כָּל עִיר מְתִם
  choice: mọi thành, gồm đàn ông
  rationale: Cấu trúc Hê-bơ-rơ cô đọng; מְתִם chỉ những người nam. Cách dịch theo lối liệt kê giữ nét phân biệt giữa đàn ông, phụ nữ và trẻ nhỏ, đồng thời tự nhiên hơn lối dịch sát chữ “thành của đàn ông”.
- source_word: וְהַנָּשִׁים וְהַטָּף
  choice: phụ nữ và trẻ nhỏ
  rationale: “Phụ nữ” dịch trực tiếp הַנָּשִׁים; “trẻ nhỏ” phản ánh טַף, thường chỉ trẻ em còn nhỏ hoặc người phụ thuộc nhỏ tuổi.
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: Chúng tôi không để một ai sống sót
  rationale: שָׂרִיד là người sống sót hay phần còn lại. Trong bối cảnh chiến trận, cách diễn đạt này rõ nghĩa và tự nhiên.
theological_decisions:
- issue: Cách dịch thuật ngữ חרם trong trình thuật chinh phạt
  choice: biệt hiến để hủy diệt
  alternative: tiêu diệt hoàn toàn; đặt dưới lệnh tận diệt
  rationale: Bản dịch giữ sắc thái kỹ thuật và thiêng lễ của חרם mà không làm nhẹ hành động bạo lực được thuật lại hoặc thêm lời giải thích thần học ngoài văn bản.
- issue: Tính đặc chỉ giới tính của מְתִם trong danh sách những người bị hủy diệt
  choice: đàn ông, phụ nữ và trẻ nhỏ
  alternative: mọi người, kể cả phụ nữ và trẻ em
  rationale: Nguyên văn phân biệt đàn ông với phụ nữ và trẻ nhỏ; giữ nguyên sự phân biệt này chính xác hơn việc trung hòa thành “mọi người”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Vua ấy” làm rõ đại từ “của ông ấy” trong ngữ cảnh nói về vua Si-hôn; câu không né tránh hay giảm nhẹ nội dung bạo lực của nguyên văn. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
