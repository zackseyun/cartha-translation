  yaml_path: translation/ot/deuteronomy/002/017.yaml
  text: Then Yahweh spoke to me[a], saying,
translation:
  language: vi
  text: 'Bấy giờ, Yahweh[a] phán với tôi rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “ĐỨC CHÚA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ, ... phán
  rationale: Dạng waw-consecutive đưa trình thuật tiến sang sự việc kế tiếp; “bấy giờ” diễn đạt tự nhiên quan hệ tuần tự. Trong ngữ cảnh Đức Chúa Trời trực tiếp truyền lời, “phán” là cách diễn đạt tiếng Việt trang trọng và quen thuộc cho דִּבֵּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng phiên âm phổ biến của יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: אֵלַי
  choice: với tôi
  rationale: אֶל kèm hậu tố ngôi thứ nhất số ít chỉ hướng lời nói đến người kể. Trong tiếng Việt, kết cấu tự nhiên với động từ “phán” là “phán với tôi”; ý nghĩa trực tiếp hướng đến người nói vẫn được giữ.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Phân từ nguyên mẫu לֵאמֹר mở đầu lời nói trực tiếp. Trong tiếng Việt hiện đại, dấu hai chấm thực hiện chức năng này tự nhiên hơn cách dịch máy móc “rằng”; câu tiếp theo cung cấp nội dung lời phán.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu, đồng thời chú thích cách dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và tự nhiên. “Bấy giờ” nối tiếp diễn tiến của trình thuật; “phán với tôi” phù hợp ngữ dụng tiếng Việt. Dấu hai chấm thay cho công thức dịch sát “mà rằng/rằng rằng”, tránh lối văn cổ nhưng vẫn bảo toàn chức năng dẫn lời.
