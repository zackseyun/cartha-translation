source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: vi
  text: Thời gian chúng ta đi từ Ca-đe Ba-nê-a cho đến khi vượt qua khe Xê-rết là ba mươi tám năm[a], cho đến khi cả thế hệ những người nam ra trận không còn ở giữa trại quân, đúng như Đức Giê-hô-va đã thề với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Khe Xê-rết” cũng có thể dịch là “suối Xê-rết” hoặc “lòng suối Xê-rết”. Từ Hê-bơ-rơ có thể chỉ một khe hay lòng suối theo mùa, cũng như dòng suối chảy trong đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: Thời gian
  rationale: Danh từ số nhiều theo nghĩa đen là “những ngày”, nhưng trong câu này toàn cụm nói về khoảng thời gian của hành trình; “thời gian” tự nhiên trong tiếng Việt và giữ đúng chức năng thời lượng.
- source_word: הָלַכְנוּ
  choice: chúng ta đi
  rationale: Trong văn cảnh hành trình, הלך chỉ việc di chuyển; “đi” ngắn gọn, tự nhiên và không thu hẹp phương thức di chuyển.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: từ Ca-đe Ba-nê-a
  rationale: Phiên âm địa danh theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: cho đến khi vượt qua
  rationale: עבר đi với một dòng nước hay lòng suối mang nghĩa tự nhiên là vượt qua hoặc sang bên kia.
- source_word: נַחַל זֶרֶד
  choice: khe Xê-rết
  rationale: נחל có thể chỉ khe, lòng suối theo mùa hoặc dòng suối; “khe” phù hợp địa hình vùng này mà không hàm ý luôn có nước.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: ba mươi tám năm
  rationale: Cách diễn đạt số đếm chuẩn trong tiếng Việt.
- source_word: עַד תֹּם
  choice: cho đến khi ... đã biến mất
  rationale: תֹּם diễn tả sự chấm dứt hoàn toàn; trong văn cảnh con người bị loại khỏi cộng đồng vì chết, “biến mất khỏi” truyền đạt tự nhiên kết quả ấy mà không thêm chi tiết vào chính văn.
- source_word: כָּל הַדּוֹר
  choice: cả thế hệ
  rationale: Cách diễn đạt tự nhiên cho toàn bộ một thế hệ.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: những người tham chiến
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “những người nam của chiến trận”, chỉ những nam giới thuộc lực lượng chiến đấu; “những người tham chiến” rõ nghĩa trong tiếng Việt, còn giới tính được ghi nhận ở chú thích.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: khỏi trại quân
  rationale: מִקֶּרֶב mang nghĩa ra khỏi giữa hoặc khỏi trong số; tiếng Việt tự nhiên có thể nói gọn “khỏi trại quân” mà vẫn giữ ý họ không còn ở giữa cộng đồng đóng trại.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: đúng như Đức Giê-hô-va đã thề với họ
  rationale: Giữ rõ ngôn ngữ thề nguyện và dùng một dạng phiên âm quen thuộc của danh riêng יהוה trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Đức Giê-hô-va” giữ đây là danh riêng, phù hợp cách xưng hô trang trọng và quen thuộc với nhiều độc giả Việt, thay vì thay thế bằng một tước hiệu.
- issue: Phạm vi giới tính của אַנְשֵׁי הַמִּלְחָמָה
  choice: những người tham chiến
  alternative: những người nam tham chiến; các chiến binh
  rationale: Cụm Hê-bơ-rơ có thành tố אִישׁ ở dạng số nhiều giống đực và trong văn cảnh chỉ các nam giới thuộc thế hệ chiến đấu. Chính văn chọn cách nói Việt ngữ tự nhiên; chú thích bảo toàn nét giới tính cụ thể.
- issue: Ý nghĩa của עַד תֹּם đối với thế hệ bị xét đoán
  choice: đã biến mất khỏi trại quân
  alternative: đã chết hết; đã bị tiêu diệt hết
  rationale: Nguyên văn nói đến sự chấm dứt hoặc không còn của toàn thế hệ, nhưng không dùng trực tiếp động từ “chết” trong câu này. Bản dịch tránh diễn giải mạnh hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp “cho đến khi” được giữ để phản ánh hai mốc giới hạn trong câu Hê-bơ-rơ. Địa danh được phiên âm theo âm tiết tiếng Việt; câu duy trì giọng kể ngôi thứ nhất số nhiều.
