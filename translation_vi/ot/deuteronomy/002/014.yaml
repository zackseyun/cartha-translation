revisions:
- from: Thời gian chúng ta đi từ Ca-đe Ba-nê-a cho đến khi vượt qua khe Xê-rết là ba mươi tám năm[a], cho đến khi cả thế hệ những người tham chiến đã biến mất khỏi trại quân, đúng như Đức Giê-hô-va đã thề với họ.
  to: Thời gian chúng ta đi từ Ca-đe Ba-nê-a cho đến khi vượt qua khe Xê-rết là ba mươi tám năm[a], cho đến khi cả thế hệ những người nam ra trận không còn ở giữa trại quân, đúng như Đức Giê-hô-va đã thề với họ.
  rationale: Bản sửa chỉ làm rõ thành tố giống đực của “những người nam chiến trận” và điều chỉnh cách diễn đạt sự chấm dứt của thế hệ ấy để phản ánh sát hơn “khỏi giữa trại quân.” Các yếu tố thời lượng, địa danh, danh riêng Đức Giê-hô-va và tính không xác định của נחל đều được giữ nguyên.
