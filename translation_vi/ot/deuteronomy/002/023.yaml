  text: וְ/הָֽ/עַוִּ֛ים הַ/יֹּשְׁבִ֥ים בַּ/חֲצֵרִ֖ים עַד עַזָּ֑ה כַּפְתֹּרִים֙ הַ/יֹּצְאִ֣ים מִ/כַּפְתּ֔וֹר הִשְׁמִידֻ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: vi
  text: Còn người Avvim sống trong các làng mạc cho đến Gaza thì người Caphtorim, từ Caphtor đi ra, đã tiêu diệt họ và định cư tại chỗ của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעַוִּים
  choice: người Avvim
  rationale: Tên một nhóm dân được phiên âm, không dịch nghĩa; dạng số nhiều Hê-bơ-rơ được giữ trong tên riêng.
- source_word: הַיֹּשְׁבִים
  choice: là những người sống
  rationale: Diễn đạt tự nhiên ý cư trú của động từ ישב và làm rõ mệnh đề quan hệ.
- source_word: בַּחֲצֵרִים
  choice: trong các làng mạc
  rationale: חֲצֵרִים chỉ những điểm cư trú, thường là làng không có tường thành; “làng mạc” tự nhiên nhưng không khẳng định quá mức tính chất cụ thể.
- source_word: עַד עַזָּה
  choice: cho đến tận Gaza
  rationale: Giữ ý giới hạn địa lý của עַד và diễn đạt tự nhiên trong tiếng Việt.
- source_word: כַּפְתֹּרִים
  choice: người Caphtorim
  rationale: Tên một nhóm dân được phiên âm theo hình thức của nguyên ngữ.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: từ Caphtor đi ra
  rationale: Giữ hình ảnh chuyển động cụ thể của יצא, thay vì giản lược thành “đến từ Caphtor”.
- source_word: הִשְׁמִידֻם
  choice: đã tiêu diệt họ
  rationale: Thể Hiphil của שׁמד mang nghĩa hủy diệt; “tiêu diệt” đủ mạnh mà không thêm sắc thái ngoài văn bản.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: và định cư vào chỗ của họ
  rationale: Truyền đạt cả việc cư trú lẫn sự thay thế những cư dân trước tại địa bàn ấy.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện lịch sử, trang trọng nhưng hiện đại. Dùng “còn… thì…” để thể hiện sự chuyển đề của וְהָעַוִּים; giữ nguyên các địa danh và tên dân tộc theo lối phiên âm. Không thêm chú thích cho Caphtor vì nguồn Hê-bơ-rơ không có điểm mơ hồ từ vựng tại tên địa danh này; chú thích b trong lớp tham khảo tiếng Anh dường như mô tả חֲצֵרִים nhưng lại gắn sau Caphtor.
