  to: Cũng như Ngài đã làm cho con cháu Ê-sau, là những người sống ở Sê-i-rơ[a], khi Ngài tiêu diệt dân Hô-rít khỏi trước mặt họ[b], rồi họ chiếm lấy đất của dân ấy[c] và cư ngụ tại chỗ của họ cho đến ngày nay.
  rationale: Bản sửa giữ nguyên ý nghĩa, chủ thể và trình tự hành động của nguyên ngữ, đồng thời làm mạch câu tiếng Việt tự nhiên hơn. “Chiếm lấy đất của dân ấy” diễn đạt rõ nghĩa ngữ cảnh của động từ יָרַשׁ; chú thích c bảo lưu hình thức đối tượng trực tiếp là cư dân trước đó và giải thích quan hệ với đất đai.
