base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: vi
  text: Cũng như Ngài đã làm cho con cháu Ê-sau, là những người sống ở Sê-i-rơ[a], khi Ngài tiêu diệt dân Hô-rít khỏi trước mặt họ[b], rồi họ chiếm lấy đất của dân ấy[c] và cư ngụ tại chỗ của họ cho đến ngày nay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là những người cư ngụ ở Sê-i-rơ.”'
    reason: lexical_alternative
  - marker: b
    text: “Khỏi trước mặt họ” là một thành ngữ Hê-bơ-rơ, có nghĩa là loại dân Hô-rít khỏi sự hiện diện hoặc lãnh thổ của con cháu Ê-sau.
    reason: lexical_alternative
  - marker: c
    text: 'Động từ Hê-bơ-rơ có đối tượng trực tiếp là dân Hô-rít; trong ngữ cảnh này, nghĩa là truất hữu họ, tức chiếm lấy đất của họ. Cũng có thể dịch: “họ truất hữu dân ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: Cũng như Ngài đã làm
  rationale: Giữ lực so sánh của כַּאֲשֶׁר và tính khái quát của עָשָׂה; “Ngài” làm rõ chủ thể được tiếp nối từ văn cảnh là Đức Giê-hô-va mà không đặc tả thêm hành động.
- source_word: לִבְנֵי עֵשָׂו
  choice: cho con cháu Ê-sau
  rationale: Trong ngữ cảnh dân tộc, בְּנֵי chỉ hậu duệ của Ê-sau; “con cháu” tự nhiên và chính xác hơn cách hiểu hẹp là các con trai trực tiếp.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: là những người sống tại Sê-i-rơ
  rationale: Diễn đạt phân từ chỉ tình trạng cư trú bằng tiếng Việt hiện đại, rõ nghĩa; “tại” phù hợp với địa danh.
- source_word: הִשְׁמִיד
  choice: đã tiêu diệt
  rationale: Phản ánh động từ thể khiến mang nghĩa hủy diệt mạnh, nhưng không tăng cường thành “tận diệt” hay “xóa sổ”.
- source_word: הַחֹרִי
  choice: dân Hô-rít
  rationale: Dùng dạng phiên âm tên tộc người và thêm “dân” để người đọc tiếng Việt nhận ra đây là một cộng đồng.
- source_word: מִפְּנֵיהֶם
  choice: khỏi trước mặt họ
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ về việc loại một dân khỏi sự hiện diện hoặc lãnh thổ của dân khác; chú thích giải nghĩa để tránh tối nghĩa.
- source_word: וַיִּירָשֻׁם
  choice: rồi họ tước đất của dân ấy
  rationale: Trong bối cảnh chinh phục, ירשׁ nói đến việc chiếm quyền sở hữu bằng cách truất hữu cư dân trước. Cách dịch nêu rõ đối tượng thực tế là đất của họ, tránh cụm khó hiểu “chiếm hữu họ”.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: và cư ngụ tại chỗ của họ
  rationale: Thể hiện việc hậu duệ Ê-sau sống tại nơi trước kia dân Hô-rít cư trú; “cư ngụ” trang trọng vừa phải và dễ hiểu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: cho đến ngày nay
  rationale: Cách diễn đạt tự nhiên, quen thuộc của thành ngữ thời gian Hê-bơ-rơ.
theological_decisions:
- issue: Chủ thể ngầm của עָשָׂה và הִשְׁמִיד
  choice: 'Dùng “Ngài” để chỉ Đức Giê-hô-va: “Ngài đã làm… Ngài đã tiêu diệt.”'
  alternative: Giữ chủ thể ít minh nhiên hơn, chẳng hạn “đã xảy ra cho… khi dân Hô-rít bị tiêu diệt.”
  rationale: Các động từ số ít giống đực và văn cảnh liền trước quy chiếu hành động này cho Đức Giê-hô-va. Việc dùng “Ngài” làm rõ mạch cú pháp nhưng không thêm một khẳng định thần học ngoài văn cảnh.
- issue: Quan hệ giữa hành động của Đức Chúa Trời và hành động của con cháu Ê-sau
  choice: 'Phân biệt rõ: Ngài tiêu diệt dân Hô-rít; con cháu Ê-sau tước đất và cư ngụ tại chỗ họ.'
  alternative: Gộp mọi hành động dưới cùng một chủ thể hoặc diễn giải rằng Đức Chúa Trời trực tiếp thực hiện từng hành động.
  rationale: Sự chuyển từ động từ số ít הִשְׁמִיד sang các động từ số nhiều וַיִּירָשֻׁם và וַיֵּשְׁבוּ cho thấy sự thay đổi chủ thể; bản dịch bảo toàn sự phân biệt đó.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm vừa phải và dễ hiểu. Dùng “con cháu” theo nghĩa dân tộc, “sống” cho lối nói tự nhiên, và “cư ngụ” ở vế sau để diễn tả việc định cư lâu dài mà không tạo sắc thái cổ quá mức. Dấu hai chấm và dấu chấm phẩy làm rõ quan hệ giữa lời so sánh, hành động của Đức Chúa Trời và hành động tiếp theo của con cháu Ê-sau.
