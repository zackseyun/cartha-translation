  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: vi
  text: 'Yahweh phán với tôi: “Đừng quấy nhiễu Mô-áp, cũng đừng gây chiến với họ, vì Ta sẽ không ban cho con bất cứ phần đất nào của Mô-áp làm sản nghiệp[a], bởi Ta đã ban A-rơ cho con cháu Lót làm sản nghiệp.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làm phần sở hữu”; áp dụng cho cả hai lần xuất hiện trong câu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: Đừng quấy nhiễu Mô-áp
  rationale: צרר trong lời cấm này chỉ hành động gây áp lực hoặc thù nghịch; “quấy nhiễu” tự nhiên trong tiếng Việt và không đồng nhất hành động ấy với chiến tranh toàn diện.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: cũng đừng khiêu chiến với họ
  rationale: Cụm từ diễn tả việc khơi lên hoặc bước vào xung đột quân sự; “khiêu chiến” giữ được sắc thái chủ động gây chiến và tránh diễn đạt dài dòng.
- source_word: מֵאַרְצוֹ
  choice: phần đất nào của họ
  rationale: 'מִן có sắc thái bộ phận trong ngữ cảnh: Đức Chúa Trời sẽ không ban dù chỉ một phần lãnh thổ Mô-áp. Đại từ “họ” chỉ dân Mô-áp như một cộng đồng.'
- source_word: יְרֻשָּׁה
  choice: làm sản nghiệp
  rationale: “Sản nghiệp” diễn đạt phần đất được ban để sở hữu lâu dài, đồng thời giữ sắc thái thừa hưởng/phân chia của từ Hê-bơ-rơ.
- source_word: לִבְנֵי לוֹט
  choice: cho con cháu Lót
  rationale: Trong ngữ cảnh phả hệ, בְּנֵי chỉ các hậu duệ chứ không nhất thiết là các con trai trực tiếp; “con cháu” rõ nghĩa và tự nhiên hơn trong tiếng Việt.
- source_word: עָר
  choice: A-rơ
  rationale: Phiên âm địa danh theo lối viết dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu “CHÚA”. “Đức Giê-hô-va” là dạng danh xưng trang trọng, quen thuộc với độc giả Kinh Thánh tiếng Việt.
- issue: Sắc thái của יְרֻשָּׁה
  choice: sản nghiệp
  alternative: cơ nghiệp; phần sở hữu
  rationale: “Sản nghiệp” vừa biểu thị quyền sở hữu vừa giữ liên hệ với phần đất được ban truyền cho một dân, nhưng không xác định thêm cơ chế pháp lý hay thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” trong lời Đức Chúa Trời phán với Môi-se; dùng “họ” cho Mô-áp như một dân. Giữ hai mệnh lệnh riêng biệt và nhịp lập luận “vì… bởi…” của nguyên văn.
