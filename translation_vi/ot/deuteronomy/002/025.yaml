  text: הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ תֵּ֤ת פַּחְדְּ/ךָ֙ וְ/יִרְאָ֣תְ/ךָ֔ עַל פְּנֵי֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָ֑יִם אֲשֶׁ֤ר יִשְׁמְעוּ/ן֙ שִׁמְעֲ/ךָ֔ וְ/רָגְז֥וּ וְ/חָל֖וּ מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: vi
  text: Hôm nay, Ta sẽ bắt đầu khiến mọi dân tộc dưới khắp bầu trời kinh hãi và khiếp sợ con. Khi nghe tin về con[a], họ sẽ run rẩy và quằn quại[b] vì con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nghe danh tiếng của con” hoặc “nghe tin tức về con”. Cách nói Híp-ri có thể chỉ một tin tức tạo nên danh tiếng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chịu đau đớn dữ dội” hoặc “quằn quại như người phụ nữ chuyển dạ”. Động từ Híp-ri gợi sự đau đớn dữ dội biểu hiện nơi thân thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחֵל תֵּת
  choice: Ta sẽ bắt đầu gieo
  rationale: Cụm Híp-ri mang nghĩa “bắt đầu đặt/ban”. “Gieo” kết hợp tự nhiên với “nỗi kinh hãi và khiếp sợ” trong tiếng Việt, đồng thời diễn đạt rõ hành động khiến cảm xúc ấy bao trùm các dân.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: nỗi kinh hãi và khiếp sợ về con
  rationale: Giữ hai từ gần nghĩa của nguyên văn và làm rõ đây là sự sợ hãi do Y-sơ-ra-ên gây ra, chứ không phải nỗi sợ của chính Y-sơ-ra-ên.
- source_word: עַל פְּנֵי הָעַמִּים
  choice: trên mọi dân tộc
  rationale: Thành ngữ theo nghĩa đen là “trên mặt các dân”; tiếng Việt tự nhiên dùng “trên mọi dân tộc”, vẫn giữ ý nỗi sợ được đặt trên họ.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: dưới khắp trời
  rationale: Cách nói trang trọng, tự nhiên trong tiếng Việt, diễn đạt thành ngữ Híp-ri chỉ phạm vi rộng khắp dưới trời.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: Khi nghe tin về con
  rationale: שִׁמְעַ có thể chỉ tin tức, lời đồn hoặc danh tiếng. “Tin về con” giữ được độ rộng nghĩa và phù hợp văn cảnh.
- source_word: וְרָגְזוּ
  choice: họ sẽ run rẩy
  rationale: Diễn đạt tự nhiên động từ chỉ sự rung chuyển, run lên hoặc xao động vì sợ.
- source_word: וְחָלוּ
  choice: và quằn quại
  rationale: Giữ hình ảnh thể lý mạnh của động từ, vốn có thể gợi cơn đau dữ dội như đau chuyển dạ.
- source_word: מִפָּנֶיךָ
  choice: vì con
  rationale: Cụm từ theo nghĩa đen là “từ trước mặt con”; trong ngữ cảnh, nó nêu nguyên nhân khiến các dân run rẩy và quằn quại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con” phản ánh lời Đức Chúa Trời phán trực tiếp với Môi-se, trong đó “con” đại diện cho Y-sơ-ra-ên. Câu được tách làm hai để tránh cấu trúc quan hệ nặng nề trong tiếng Việt; các dấu chú thích đều đặt ngay sau từ ngữ liên quan.
