language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/יָסְפ֣וּ הַ/שֹּׁטְרִים֮ לְ/דַבֵּ֣ר אֶל הָ/עָם֒ וְ/אָמְר֗וּ מִי הָ/אִ֤ישׁ הַ/יָּרֵא֙ וְ/רַ֣ךְ הַ/לֵּבָ֔ב יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ וְ/לֹ֥א יִמַּ֛ס אֶת לְבַ֥ב אֶחָ֖י/ו כִּ/לְבָבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: vi
  text: 'Rồi các quan chức sẽ tiếp tục nói với dân chúng rằng: “Ai là người sợ hãi và nhát lòng? Người ấy hãy trở về nhà mình, kẻo làm cho lòng anh em mình tan chảy như lòng mình.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây chỉ những người Y-sơ-ra-ên cùng đi chiến đấu, tức các chiến hữu của người ấy; “lòng tan chảy” có nghĩa là mất hết can đảm.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: sẽ tiếp tục
  rationale: Thành ngữ dùng יסף với động từ nguyên mẫu có nghĩa là tiếp tục hoặc nói thêm; “sẽ tiếp tục” vừa tự nhiên vừa giữ được trình tự của lời chỉ dẫn.
- source_word: הַשֹּׁטְרִים
  choice: các quan chức
  rationale: Trong bối cảnh hành chính và quân sự của Phục Truyền Luật Lệ Ký, từ này chỉ những người được bổ nhiệm thi hành công vụ, không phải cảnh sát theo nghĩa hiện đại.
- source_word: מִי הָאִישׁ
  choice: Ai là người
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt; trong ngữ cảnh, “người” chỉ một người nam đang tham gia quân đội.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: sợ hãi và nhát lòng
  rationale: “Sợ hãi” diễn đạt הַיָּרֵא; “nhát lòng” truyền đạt hình ảnh nguyên văn “mềm/yếu lòng” và sự thiếu can đảm trước chiến trận.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Người ấy hãy trở về nhà mình
  rationale: Hai động từ tạo thành lời chỉ thị cho người ấy rời hàng ngũ và trở về; tiếng Việt tự nhiên không cần lặp cả “đi” lẫn “trở về”.
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו
  choice: kẻo làm cho lòng anh em mình tan chảy
  rationale: Giữ hình ảnh “lòng tan chảy” của tiếng Hê-bơ-rơ, một ẩn dụ chỉ mất hết can đảm; “làm cho” thể hiện ý nghĩa tác động lên lòng những người khác.
- source_word: כִּלְבָבוֹ
  choice: như lòng mình
  rationale: Giữ sự lặp lại có chủ ý của לֵבָב và phép so sánh trực tiếp với lòng của người đang sợ hãi.
theological_decisions:
- issue: Ngôn ngữ nam giới trong bối cảnh quân sự
  choice: Dùng “người” trong câu hỏi và “anh em” trong hình ảnh tập thể
  alternative: “người đàn ông” và “đồng đội”
  rationale: “Người” là cách hỏi tự nhiên trong tiếng Việt mà không phủ nhận bối cảnh quân đội nam giới; “anh em” giữ được ngôn ngữ thân tộc của אֶחָיו và sắc thái cộng đồng giao ước, trong khi chú thích làm rõ ý nghĩa theo ngữ cảnh.
- issue: Ẩn dụ về sự mất can đảm
  choice: Giữ “lòng ... tan chảy”
  alternative: “làm anh em mình mất can đảm”
  rationale: Nguyên văn dùng hình ảnh mạnh và lặp từ “lòng”; bản dịch giữ ẩn dụ thay vì giải nghĩa ngay trong chính văn.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. “Quan chức” tránh liên tưởng sai đến cảnh sát hiện đại; “nhát lòng” và “lòng tan chảy” duy trì hình ảnh Hê-bơ-rơ nhưng vẫn dễ hiểu trong tiếng Việt. Dấu chú thích [a] được đặt sau toàn bộ câu vì giải thích hai biểu thức trong mệnh đề cuối.
