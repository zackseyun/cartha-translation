  source_fidelity: 'Bản dịch phản ánh chính xác cấu trúc và ý nghĩa của tiếng Hê-bơ-rơ: các quan chức tiếp tục nói với dân; người sợ hãi và nhát lòng được bảo trở về nhà; mục đích là để không làm lòng anh em mình tan chảy như lòng mình. “Kẻo” diễn đạt phù hợp sắc thái ngăn ngừa của וְלֹא, và “làm cho” giúp biểu đạt tự nhiên tác động hàm ý trong cách dùng Niphal của מסס.'
