source:
  edition: WLC
  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: vi
  text: để họ không dạy anh em làm theo mọi điều ghê tởm của họ mà họ đã làm cho các thần của họ[a], khiến anh em phạm tội nghịch Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “mà họ đã làm đối với các thần của họ”; trong ngữ cảnh này cũng có thể hiểu là “mà họ đã làm để thờ các thần của họ.”'
    reason: Giới từ ל trong לֵאלֹהֵיהֶם có thể chỉ quan hệ hướng đến, đối với, hoặc vì các thần của họ. Bản chính tránh thêm động từ “thờ” không được nêu rõ, còn chú thích bảo tồn cách hiểu phù hợp ngữ cảnh nghi lễ.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר לֹא
  choice: để ... không
  rationale: Diễn đạt tự nhiên ý mục đích ngăn ngừa của cấu trúc Hê-bơ-rơ.
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: họ ... dạy anh em làm
  rationale: Giữ trực tiếp động từ 'dạy' và bổ ngữ nguyên mẫu 'làm'; 'anh em' biểu đạt ngôi thứ hai số nhiều trong văn phong trang trọng, dễ hiểu.
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: làm theo mọi điều ghê tởm
  rationale: '''Làm theo'' truyền đạt ý noi theo/khuôn theo của כְּ; ''mọi điều ghê tởm'' giữ sức nặng đạo đức và tôn giáo của תּוֹעֵבָה mà vẫn tự nhiên trong tiếng Việt.'
- source_word: אֲשֶׁר עָשׂוּ
  choice: mà họ đã làm
  rationale: Dịch sát mệnh đề quan hệ và hành động đã hoàn tất.
- source_word: לֵאלֹהֵיהֶם
  choice: để thờ các thần của họ
  rationale: Trong ngữ cảnh các tập tục tôn giáo, giới từ ל chỉ đối tượng hay mục đích quy hướng; thêm 'thờ' để diễn đạt quan hệ thờ phượng tự nhiên trong tiếng Việt, đồng thời ghi chú phương án sát hình thức hơn.
- source_word: וַחֲטָאתֶם
  choice: khiến anh em phạm tội
  rationale: Diễn đạt hệ quả của việc bị dạy noi theo các tập tục ấy; tránh cách nối câu gượng gạo nhưng không biến hệ quả thành một mệnh lệnh riêng.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: với Yahweh, Đức Chúa Trời của anh em
  rationale: Với động từ 'phạm tội', tiếng Việt tự nhiên dùng 'phạm tội với'; giữ danh riêng giao ước Yahweh và quan hệ đồng vị của 'Đức Chúa Trời của anh em'.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguồn Hê-bơ-rơ dùng trực tiếp danh giao ước; phiên âm 'Yahweh' phân biệt danh riêng này với tước hiệu và phù hợp lớp tham khảo POB.
- issue: Quan hệ của các việc ghê tởm với אֱלֹהֵיהֶם
  choice: những việc được làm để thờ các thần của họ
  alternative: những việc được làm cho/các thần của họ
  rationale: Ngữ cảnh nói đến tập tục thờ phượng, nhưng giới từ ל tự nó có thể được hiểu là 'cho' hoặc 'đối với'; bản dịch chính làm rõ ý tự nhiên và chú thích bảo tồn phương án từ vựng.
- issue: Quan hệ logic của וַחֲטָאתֶם
  choice: 'hệ quả: ''khiến anh em phạm tội'''
  alternative: và anh em sẽ phạm tội
  rationale: Waw + qatal nối với mệnh đề mục đích/ngăn ngừa và nêu hậu quả; cách dịch không khẳng định một sắc thái tất định vượt quá văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều và “Yahweh” cho danh יהוה. Cấu trúc câu giữ quan hệ mục đích–hệ quả của nguyên văn, đồng thời tránh lối diễn đạt quá sát chữ gây tối nghĩa.
