  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: vi
  text: Chỉ những cây mà anh em biết không phải là cây cho thức ăn thì các cây ấy anh em có thể phá hủy và đốn xuống, rồi xây công sự vây hãm[a] chống lại thành đang giao chiến với anh em, cho đến khi thành ấy thất thủ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đắp một dốc vây thành” hoặc “xây các công trình vây hãm.” Từ Hê-bơ-rơ מָצוֹר có thể chỉ chung những công trình dùng để vây thành, chứ không nhất thiết chỉ một loại công trình cụ thể.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “cho đến khi thành ấy bị hạ.” Cụm tiếng Hê-bơ-rơ theo sát chữ là “cho đến khi nó đi xuống,” một cách nói về việc thành sụp đổ hoặc thất thủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Chỉ
  rationale: Giữ sắc thái giới hạn, nêu ngoại lệ đối với lệnh cấm chặt cây cho thức ăn ở câu trước.
- source_word: עֵץ אֲשֶׁר תֵּדַע כִּי לֹא עֵץ מַאֲכָל הוּא
  choice: những cây mà anh em biết không phải là cây cho thức ăn
  rationale: Giữ ý người Israel phải xác định cây không cung cấp thức ăn; không thu hẹp quá mức thành một loại cây cụ thể.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: anh em được phá và đốn xuống
  rationale: Dạng số ít trong tiếng Hê-bơ-rơ được hiểu theo nghĩa phân phối. “Được” diễn đạt sự cho phép trong điều luật, còn “đốn xuống” là cách nói tự nhiên về việc chặt hạ cây.
- source_word: וּבָנִיתָ מָצוֹר
  choice: rồi xây công sự vây hãm
  rationale: מָצוֹר có thể chỉ chung các công trình phục vụ việc vây thành; cách dịch này tránh xác định đó chỉ là một con dốc hay một loại công trình riêng.
- source_word: עַל הָעִיר
  choice: chống lại thành
  rationale: Diễn đạt hướng thù địch của công sự trong bối cảnh chiến tranh, thay vì chỉ nêu vị trí không gian.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: thành đang giao chiến với anh em
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “làm chiến tranh với” và giữ sắc thái đang tiếp diễn của phân từ.
- source_word: עַד רִדְתָּהּ
  choice: cho đến khi anh em hạ được thành ấy
  rationale: Giữ tác nhân ngôi thứ hai của động từ và truyền đạt việc khiến thành thất thủ, đồng thời tránh cách nói quá sát chữ nhưng khó hiểu như “làm cho thành đi xuống”.
