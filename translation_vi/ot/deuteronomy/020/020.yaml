translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện lời phán với cộng đồng Israel qua đại từ số ít mang nghĩa tập thể. Các dấu chú thích được đặt ngay sau những cụm từ mà chú thích giải nghĩa.
