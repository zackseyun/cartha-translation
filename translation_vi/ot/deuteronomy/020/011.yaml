    issue: Cụm “một cách hòa bình” chưa phản ánh sát chức năng của שָׁלוֹם.
    rationale: Nguyên văn nói thành “đáp lại ngươi bằng/hướng đến hòa bình,” tức là đáp ứng đề nghị hòa bình. Cụm hiện tại có thể được hiểu đơn thuần là cách thức trả lời một cách ôn hòa. “Bằng hòa bình” giữ danh từ và quan hệ ngữ nghĩa gần hơn.
  - severity: medium
    issue: Chú thích b nói “nộp cống và lao dịch” như hai nghĩa vụ được kết hợp.
    rationale: מַס có trường nghĩa gồm cống/thuế, nghĩa vụ lao dịch, hoặc lao dịch cưỡng bức tùy ngữ cảnh. Chú thích cần trình bày đây là các khả năng thay thế, không khẳng định nguyên văn đòi cả nộp cống lẫn lao dịch.
