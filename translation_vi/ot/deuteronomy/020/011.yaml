  text: וְ/הָיָה֙ אִם שָׁל֣וֹם תַּֽעַנְ/ךָ֔ וּ/פָתְחָ֖ה לָ֑/ךְ וְ/הָיָ֞ה כָּל הָ/עָ֣ם הַ/נִּמְצָא בָ֗/הּ יִהְי֥וּ לְ/ךָ֛ לָ/מַ֖ס וַ/עֲבָדֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: vi
  text: Nếu thành ấy đáp lại anh em bằng hòa bình[a] và mở cửa cho anh em, thì toàn thể dân chúng ở trong thành sẽ phải lao dịch cho anh em[b] và phục vụ anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đáp lại anh em bằng những điều kiện hòa bình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “sẽ phải chịu nghĩa vụ cống nạp/lao dịch cho anh em.” Từ Hê-bơ-rơ מַס có thể chỉ sưu thuế, cống nạp hoặc lao dịch bắt buộc; trong ngữ cảnh này, nghĩa lao dịch cưỡng bức là phù hợp hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: một cách hòa bình
  rationale: Danh từ có nghĩa là “hòa bình, bình an”; trong bối cảnh thành đáp lại đề nghị hòa bình ở câu trước, cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ ý chính của từ Hê-bơ-rơ.
- source_word: תַּעַנְךָ
  choice: đáp lại anh em
  rationale: Động từ ענה có nghĩa là “đáp, trả lời”. Chủ thể được diễn đạt là “thành ấy”, phản ánh hình thức giống cái số ít chỉ thành trong nguyên văn.
- source_word: וּפָתְחָה לָךְ
  choice: mở cửa cho anh em
  rationale: Nguyên văn chỉ nói “mở cho”, không nêu danh từ “cổng”; tuy nhiên, tiếng Việt cần bổ sung “cửa” để diễn đạt tự nhiên hành động một thành mở lối tiếp nhận quân bên ngoài, mà không nhất thiết xác định đó là cổng thành.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: toàn thể dân chúng ở trong thành
  rationale: Diễn đạt tự nhiên ý “tất cả dân được tìm thấy trong đó”; “ở trong thành” tránh lối dịch cứng “được tìm thấy” nhưng không thay đổi phạm vi chỉ mọi người hiện diện trong thành.
- source_word: לָמַס
  choice: phải lao dịch cho anh em
  rationale: מַס có thể chỉ sưu thuế, cống nạp hoặc lao dịch cưỡng bức. Mệnh đề tiếp theo “phục vụ anh em” cùng bối cảnh quy phục cho thấy nghĩa lao dịch bị áp đặt là phù hợp, đồng thời từ “phải” thể hiện tính cưỡng chế.
- source_word: וַעֲבָדוּךָ
  choice: và phục vụ anh em
  rationale: עבד có nghĩa là “phục vụ, làm việc”. “Phục vụ” giữ quan hệ lệ thuộc được nói đến mà không xác định một thể chế cụ thể hơn nguyên văn.
theological_decisions:
- issue: Ngôn ngữ chỉ sự lệ thuộc trong luật chiến tranh
  choice: 'Giữ rõ tính cưỡng chế: “sẽ phải lao dịch cho anh em và phục vụ anh em.”'
  alternative: “sẽ nộp cống cho anh em và phục vụ anh em”
  rationale: Cách dịch không làm nhẹ đi sự cưỡng chế của מַס, nhưng chú thích vẫn bảo tồn khả năng từ này chỉ nghĩa vụ cống nạp hoặc lao dịch.
- issue: Đại từ số ít tập thể chỉ Israel
  choice: Dùng “anh em” trong lời Moses nói với cộng đồng Israel.
  alternative: Dùng “ngươi” để phản ánh trực tiếp hình thức số ít trong tiếng Hê-bơ-rơ.
  rationale: Các hậu tố trong câu đều ở số ít nhưng chỉ Israel như một tập thể. “Anh em” tự nhiên, trang trọng vừa phải và dễ hiểu hơn trong tiếng Việt hiện đại; không làm thay đổi đối tượng được nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thành ấy” làm rõ chủ thể được nhân cách hóa trong nguyên văn; “mở cửa” là cách nói tự nhiên hơn “mở cho”. Đại từ “anh em” chỉ Israel như một cộng đồng, dù nguyên văn dùng hình thức số ít tập thể.
