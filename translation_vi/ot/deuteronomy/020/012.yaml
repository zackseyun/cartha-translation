  to: Nhưng nếu thành ấy không làm hòa với anh em[a] mà tiến hành chiến tranh với anh em[b], thì anh em phải vây hãm thành ấy.
  rationale: 'Sửa hai động từ quân sự để phản ánh sát hơn các thành ngữ Hê-bơ-rơ: עשה מלחמה là tiến hành/làm chiến tranh, còn צור על là vây hãm một thành. Cấu trúc điều kiện, sắc thái chỉ thị của "phải", và cách xưng hô tập thể "anh em" đều được giữ nguyên. Các chú thích được đặt tại đúng hai cụm từ có phương án dịch khác và không thêm diễn giải lịch sử hay thần học.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:39Z'
