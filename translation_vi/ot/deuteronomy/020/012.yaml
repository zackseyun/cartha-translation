  text: וְ/אִם לֹ֤א תַשְׁלִים֙ עִמָּ֔/ךְ וְ/עָשְׂתָ֥ה עִמְּ/ךָ֖ מִלְחָמָ֑ה וְ/צַרְתָּ֖ עָלֶֽי/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: vi
  text: Nhưng nếu thành ấy không làm hòa với anh em[a] mà tiến hành chiến tranh với anh em[b], thì anh em phải vây hãm thành ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không lập hòa bình với anh em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn là “làm chiến tranh với anh em”; cũng có thể dịch: “giao chiến với anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Nhưng nếu ... không
  rationale: Liên từ mở đầu diễn tả tình huống tương phản với kết quả hòa bình ở câu trước; “Nhưng nếu” vừa rõ quan hệ vừa tự nhiên trong tiếng Việt.
- source_word: תַשְׁלִים עִמָּךְ
  choice: làm hòa với anh em
  rationale: Dạng Hiphil của שׁלם ở đây chỉ việc thiết lập quan hệ hòa bình. “Làm hòa” giữ sắc thái chủ động mà không thêm ý cụ thể như xin hòa hay ký hòa ước. “Anh em” diễn đạt tự nhiên đối tượng tập thể là Israel, dù tiếng Hê-bơ-rơ dùng đại từ số ít.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: mà giao chiến với anh em
  rationale: Thành ngữ עשה מלחמה có nghĩa là tiến hành/giao chiến. “Giao chiến với” tự nhiên và tránh ngụ ý chắc chắn rằng thành ấy là bên khởi chiến, điều mà “gây chiến” có thể gợi ra.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: thì anh em phải bao vây thành ấy
  rationale: צור với עַל trong ngữ cảnh này có nghĩa bao vây một thành. “Phải” truyền đạt lực chỉ thị của cấu trúc pháp luật; “thành ấy” nêu rõ đối tượng vốn được biểu thị bằng đại từ giống cái số ít trong tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để nói với Israel như một cộng đồng, tránh “ngươi” mang sắc thái cổ; lặp lại “anh em” và “thành ấy” để quan hệ giữa các bên luôn rõ ràng.
