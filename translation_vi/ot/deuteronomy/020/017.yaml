  text: כִּֽי הַחֲרֵ֣ם תַּחֲרִימֵ֗/ם הַ/חִתִּ֤י וְ/הָ/אֱמֹרִי֙ הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: vi
  text: 'Nhưng các ngươi phải tận diệt chúng[a]—người Hê-tít, người A-mô-rít, người Ca-na-an, người Phê-rê-xít, người Hê-vít và người Giê-bu-sít—như Yahweh, Đức Chúa Trời của các ngươi, đã truyền cho các ngươi.


    [a] Nguyên văn Hê-bơ-rơ: “các ngươi phải dứt khoát biệt hiến họ cho sự hủy diệt”; động từ này chỉ việc hoàn toàn dành họ cho sự hủy diệt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các ngươi phải dứt khoát biệt hiến họ cho sự hủy diệt”; động từ này chỉ việc hoàn toàn dành họ cho sự hủy diệt.'
    reason: Giữ sắc thái từ vựng và tôn giáo-pháp lý của חרם mà “tận diệt” trong chính văn không diễn đạt hết.
lexical_decisions:
- source_word: כִּי
  choice: Nhưng
  rationale: Trong ngữ cảnh, liên từ này đối lập mệnh lệnh ở đây với việc tha mạng cho các thành ở xa trong câu trước; “Nhưng” diễn đạt tự nhiên sức đối lập ấy.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: các ngươi phải tận diệt chúng
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính dứt khoát của mệnh lệnh. “Tận diệt” truyền đạt ngắn gọn ý hủy diệt hoàn toàn, còn chú thích giữ lại sắc thái đặt dưới lệnh biệt hiến của חרם.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: người Hê-tít, người A-mô-rít, người Ca-na-an, người Phê-rê-xít, người Hê-vít và người Giê-bu-sít
  rationale: Dùng các dạng phiên âm quen thuộc trong tiếng Việt và hiểu các danh từ số ít có mạo từ theo nghĩa tập thể, chỉ từng dân tộc.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: như ... đã truyền cho các ngươi
  rationale: “Như” giữ quan hệ so sánh/cách thức; “đã truyền” diễn đạt mệnh lệnh đã được ban trước đó và vẫn có hiệu lực.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của các ngươi
  rationale: Giữ danh riêng giao ước Yahweh và chuyển thành ngữ sở hữu sang tiếng Việt tự nhiên. Đại từ Hê-bơ-rơ ở số ít tập thể được dịch số nhiều cho phù hợp lối xưng hô của toàn câu.
theological_decisions:
- issue: Cách dịch חרם trong mệnh lệnh chiến tranh
  choice: tận diệt, kèm chú thích về lệnh biệt hiến
  alternative: hoàn toàn biệt hiến chúng cho sự hủy diệt; đặt chúng dưới lệnh cấm tuyệt đối
  rationale: Bản văn nói đến sự hủy diệt hoàn toàn theo một lệnh biệt hiến của Đức Chúa Trời, chứ không chỉ hành động giết thông thường. Cách dịch chính rõ ràng, tự nhiên; chú thích bảo tồn sắc thái tôn giáo-pháp lý của thuật ngữ.
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Phiên âm danh riêng giúp phân biệt danh giao ước với tước hiệu, không thay thế nó bằng một danh xưng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, trực tiếp. Dùng “các ngươi” để phản ánh lời Môi-se nói với dân Y-sơ-ra-ên như một cộng đồng; tránh từ cổ khó hiểu trong chính văn. Dấu gạch ngang làm rõ danh sách các dân tộc.
