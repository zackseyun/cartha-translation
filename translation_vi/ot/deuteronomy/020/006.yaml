  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר נָטַ֥ע כֶּ֨רֶם֙ וְ/לֹ֣א חִלְּל֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: vi
  text: Còn ai đã trồng một vườn nho mà chưa đưa vườn ấy vào sử dụng[a]? Người ấy hãy đi về nhà mình, kẻo chết trong trận chiến và người khác lại đưa vườn ấy vào sử dụng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “mà chưa khánh thành vườn ấy” hoặc “mà chưa bắt đầu sử dụng vườn ấy.” Động từ Hê-bơ-rơ ở đây chỉ việc lần đầu đưa vườn nho vào sử dụng thông thường, có lẽ sau những năm đầu bị hạn chế (so sánh Lê-vi Ký 19:23–25).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Còn ai là người
  rationale: Giữ công thức nghi vấn mở đầu một trường hợp được miễn trong chỉ thị quân sự; “người” ở đây chỉ nam giới thuộc diện chiến đấu theo văn cảnh.
- source_word: נָטַע כֶּרֶם
  choice: đã trồng một vườn nho
  rationale: Diễn đạt trực tiếp hành động đã hoàn tất và vẫn có liên hệ với hoàn cảnh hiện tại.
- source_word: וְלֹא חִלְּלוֹ
  choice: mà chưa được hưởng hoa lợi từ đó
  rationale: Trong văn cảnh này, חלל nói đến việc bắt đầu sử dụng vườn nho theo cách thông thường, có lẽ là hưởng sản vật sau những năm đầu bị hạn chế; “hưởng hoa lợi” truyền đạt lợi ích thực tế mà không mang nghĩa nghi lễ sai lệch.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Người ấy hãy đi, trở về nhà mình
  rationale: Thể hiện sắc thái mệnh lệnh/cho phép của chuỗi động từ trong quy định pháp lý, đồng thời giữ hai động tác của nguyên văn.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: kẻo chết trận
  rationale: “Kẻo” phản ánh đúng sắc thái cảnh báo, phòng ngừa của פֶּן; “chết trận” là cách nói tự nhiên cho việc chết trong cuộc giao chiến sắp tới.
- source_word: וְאִישׁ אַחֵר
  choice: một người khác
  rationale: Giữ danh từ chỉ người và ý tương phản rõ ràng của nguyên văn.
- source_word: יְחַלְּלֶנּוּ
  choice: hưởng hoa lợi từ vườn ấy
  rationale: Dùng cùng nghĩa theo văn cảnh như lần xuất hiện trước của חלל; lặp rõ “vườn ấy” giúp câu tiếng Việt tự nhiên và tránh đại từ mơ hồ.
theological_decisions:
- issue: Ý nghĩa của חלל khi nói về vườn nho
  choice: hưởng hoa lợi từ vườn
  alternative: khánh thành vườn; bắt đầu sử dụng vườn
  rationale: Không hiểu động từ theo nghĩa thông thường “làm ô uế/xúc phạm điều thánh”, vì ngữ cảnh chỉ việc lần đầu đưa vườn vào sử dụng thông thường. Bản dịch chính nêu lợi ích thực tế, còn chú thích bảo tồn các cách dịch sát hình thức hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hưởng hoa lợi” tự nhiên trong văn cảnh tài sản canh tác, đồng thời tránh thêm riêng danh từ “trái” vào câu chính. Dấu chú thích [a] được đặt ngay sau mệnh đề trở về nhà theo dữ liệu tham chiếu, dù nội dung chú thích giải thích cụm từ trước đó.
