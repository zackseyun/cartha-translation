revisions:
- from: Còn ai là người đã trồng một vườn nho mà chưa được hưởng hoa lợi từ đó? Người ấy hãy đi, trở về nhà mình[a], kẻo chết trận rồi một người khác lại hưởng hoa lợi từ vườn ấy.
  to: Còn ai đã trồng một vườn nho mà chưa đưa vườn ấy vào sử dụng[a]? Người ấy hãy đi về nhà mình, kẻo chết trong trận chiến và người khác lại đưa vườn ấy vào sử dụng.
  rationale: Sửa bản văn chính để phản ánh trực tiếp hơn động từ חלל trong ngữ cảnh, không thêm riêng ý “hoa lợi,” đồng thời dùng cùng một cách dịch ở hai lần xuất hiện. Chuyển ký hiệu chú thích đến đúng cụm từ được giải thích và điều chỉnh chú thích cho phù hợp với cách dịch chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:36Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc miễn nghĩa vụ quân sự và ý cảnh báo của câu. Tuy nhiên, “hưởng hoa lợi” diễn giải cụ thể lợi ích/sản vật mà động từ חלל với tân ngữ là “vườn nho” không nêu trực tiếp; cách “đưa ... vào sử dụng” giữ được nghĩa ngữ cảnh và độ khái quát của nguyên ngữ tốt hơn.
  naturalness: Câu sửa dùng tiếng Việt hiện đại, rõ ràng và trang trọng. “Ai đã trồng...” là công thức tự nhiên trong lời công bố các trường hợp miễn trừ; “hãy đi về nhà mình” diễn đạt gọn chuỗi “đi và trở về nhà” theo chức năng chỉ thị.
  terminology: “Đưa vườn ấy vào sử dụng” nhất quán cho cả hai lần חלל, tránh nghĩa sai “làm ô uế” và không áp đặt rằng hành vi chỉ là hưởng hoa lợi. Chú thích duy trì các khả năng dịch sát và liên hệ Lê-vi Ký 19:23–25.
  issues:
  - severity: medium
    issue: Cụm “hưởng hoa lợi” thêm một cách diễn giải cụ thể vào nghĩa của חלל.
    rationale: Trong ngữ cảnh, חלל chỉ việc bắt đầu sử dụng/đưa vườn vào sử dụng thông thường. Sản vật là hàm ý hợp lý, nhưng không được nêu trong câu Hê-bơ-rơ; bản văn chính nên giữ khái quát này.
  - severity: medium
    issue: Ký hiệu chú thích [a] đang đặt sau “nhà mình” nhưng chú thích lại giải thích động từ ở mệnh đề “chưa ...”.
    rationale: Neo chú thích cần đặt ngay sau cụm được giải thích để người đọc không hiểu nhầm chú thích liên quan đến việc trở về nhà.
