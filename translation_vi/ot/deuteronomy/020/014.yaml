    rationale: Trong câu này רַק mở đầu ngoại lệ đối với mệnh lệnh trước đó. “Chỉ” biểu đạt trực tiếp tính hạn định ấy, không chỉ dựa vào ngữ cảnh liệt kê.
  - severity: medium
    issue: “Hưởng dùng” thay cho אָכַל làm mờ động từ nguyên ngữ trong phần văn bản chính.
    rationale: אָכַל nghĩa cơ bản là “ăn”. Dù có thể hàm ý sử dụng/tiêu dùng chiến lợi phẩm, nên giữ “ăn” trong bản dịch và giải thích sắc thái mở rộng bằng chú thích.
  - severity: low
    issue: Dấu neo chú thích hiện đặt ở cuối câu thay vì gắn trực tiếp với từ được chú thích.
    rationale: Chú thích từ vựng về אָכַל nên được đặt ngay sau “ăn” để phạm vi tham chiếu rõ ràng.
