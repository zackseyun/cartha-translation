  text: רַ֣ק הַ֠/נָּשִׁים וְ/הַ/טַּ֨ף וְ/הַ/בְּהֵמָ֜ה וְ/כֹל֩ אֲשֶׁ֨ר יִהְיֶ֥ה בָ/עִ֛יר כָּל שְׁלָלָ֖/הּ תָּבֹ֣ז לָ֑/ךְ וְ/אָֽכַלְתָּ֙ אֶת שְׁלַ֣ל אֹיְבֶ֔י/ךָ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: vi
  text: Chỉ phụ nữ, trẻ nhỏ, gia súc và mọi thứ trong thành—tức là toàn bộ chiến lợi phẩm của thành—thì anh em được phép lấy làm chiến lợi phẩm cho mình; và anh em sẽ ăn[a] chiến lợi phẩm của kẻ thù mà Yahweh, Đức Chúa Trời của anh em, đã ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “ăn chiến lợi phẩm của kẻ thù”. Động từ Hê-bơ-rơ “ăn” có thể bao hàm việc sử dụng hoặc tiêu dùng những gì đã thu được.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nhưng
  rationale: Trong mạch văn, từ này đánh dấu ngoại lệ đối với lệnh ở câu trước; “Nhưng” tự nhiên trong tiếng Việt, còn phạm vi hạn định được thể hiện qua việc liệt kê những đối tượng được chừa lại.
- source_word: הַנָּשִׁים
  choice: phụ nữ
  rationale: Danh từ số nhiều xác định, chỉ riêng phụ nữ.
- source_word: הַטַּף
  choice: trẻ nhỏ
  rationale: טַף thường chỉ trẻ em còn nhỏ hoặc những người nhỏ tuổi lệ thuộc; “trẻ nhỏ” giữ được nét nghĩa tuổi còn non.
- source_word: הַבְּהֵמָה
  choice: gia súc
  rationale: Trong bối cảnh chiến lợi phẩm, từ này chỉ các loài vật nuôi; “gia súc” chính xác hơn “súc vật” chung chung.
- source_word: כָּל שְׁלָלָהּ
  choice: tất cả chiến lợi phẩm của thành
  rationale: שָׁלָל là tài vật thu được trong chiến tranh; hậu tố giống cái số ít quy chiếu về thành.
- source_word: תָּבֹז לָךְ
  choice: anh em có thể lấy làm của mình
  rationale: בזז mang nghĩa cướp lấy hoặc thu làm chiến lợi phẩm; trong quy định pháp lý này, “có thể” diễn đạt sự cho phép, còn “lấy làm của mình” chuyển tải לָךְ tự nhiên.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: anh em có thể hưởng dùng chiến lợi phẩm của quân thù
  rationale: אָכַל nghĩa đen là “ăn” nhưng ở đây có thể mở rộng đến việc tiêu dùng hoặc hưởng dụng tài vật; “hưởng dùng” tránh giới hạn chiến lợi phẩm vào thức ăn mà vẫn giữ ý thụ hưởng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cách diễn đạt trang trọng, tự nhiên cho công thức giao ước; đại từ số nhiều tiếng Việt chuyển tải lời nói với cộng đồng Israel dù tiếng Hê-bơ-rơ dùng số ít tập thể.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Bản văn ghi trực tiếp danh giao ước; dùng “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của các động từ ngôi thứ hai trong luật lệ
  choice: anh em có thể
  alternative: anh em sẽ / anh em phải
  rationale: Trong ngữ cảnh này, các hình thái động từ cho phép Israel lấy và sử dụng chiến lợi phẩm hơn là bắt buộc họ phải làm vậy.
- issue: Nghĩa của אָכַל khi đối tượng là chiến lợi phẩm
  choice: hưởng dùng
  alternative: ăn
  rationale: Giữ khả năng nghĩa mở rộng là sử dụng hoặc thụ hưởng tài vật, đồng thời chú thích nghĩa đen để không che khuất hình ảnh nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để diễn đạt ngôi thứ hai số ít tập thể hướng đến Israel. Dấu gạch ngang làm rõ cụm đồng vị “tất cả chiến lợi phẩm của thành”.
