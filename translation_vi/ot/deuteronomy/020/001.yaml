base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: vi
  text: Khi anh em ra trận chống lại kẻ thù và thấy ngựa, chiến xa cùng một dân đông hơn anh em[b], thì đừng sợ chúng, vì Yahweh, Đức Chúa Trời của anh em, ở cùng anh em—Đấng đã đưa anh em lên khỏi đất Ai Cập.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Cũng có thể dịch: “một dân đông hơn anh em.” Cụm từ nhấn mạnh quân số của đối phương lớn hơn.'
    reason: lexical_alternative
  - marker: c
    text: Cụm “đã đưa anh em lên khỏi đất Ai Cập” nhắc lại cuộc xuất hành, là cơ sở để Israel tin cậy rằng Yahweh ở cùng họ.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: Khi anh em ra trận
  rationale: כִּי mở đầu một tình huống dự kiến, còn thành ngữ יצא למלחמה chỉ việc ra đi để giao chiến. “Khi anh em ra trận” tự nhiên, gọn và giữ sắc thái quân sự.
- source_word: עַל אֹיְבֶיךָ
  choice: chống lại kẻ thù
  rationale: עַל trong ngữ cảnh hành động thù địch mang nghĩa “chống lại”; danh từ số nhiều được diễn đạt tự nhiên bằng danh từ tập hợp “kẻ thù” trong tiếng Việt.
- source_word: סוּס וָרֶכֶב
  choice: ngựa, chiến xa
  rationale: Hai danh từ số ít trong tiếng Hê-bơ-rơ có thể mang nghĩa tập hợp, chỉ lực lượng ngựa chiến và chiến xa; tiếng Việt không bắt buộc đánh dấu số nhiều.
- source_word: עַם רַב מִמְּךָ
  choice: một đạo quân đông hơn mình
  rationale: עַם theo nghĩa đen là “dân”, nhưng trong cảnh ra trận chỉ lực lượng đối phương; רַב với מִן nhấn mạnh ưu thế về quân số. “Đạo quân” làm rõ ngữ cảnh mà không chuyển thành ý mạnh hơn về năng lực.
- source_word: לֹא תִירָא מֵהֶם
  choice: thì đừng sợ chúng
  rationale: Thể vị hoàn thành trong diễn ngôn chỉ thị có chức năng cấm đoán; “đừng sợ” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được ghi trực tiếp trong bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: Đức Chúa Trời của anh em, ở cùng anh em
  rationale: Diễn đạt trực tiếp sự hiện diện của Đức Chúa Trời với dân giao ước; đại từ số nhiều “anh em” phù hợp cách tiếng Việt thường nói với toàn thể cộng đồng, dù tiếng Hê-bơ-rơ dùng hình thức số ít tập thể.
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם
  choice: Đấng đã đưa anh em lên khỏi đất Ai Cập
  rationale: Phân từ có mạo từ xác định Yahweh là Đấng thực hiện cuộc xuất hành. “Đưa lên khỏi” giữ hình ảnh hướng lên của עלה và điểm xuất phát khỏi Ai Cập.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” bảo tồn sự phân biệt giữa danh riêng này và các tước hiệu thần linh.
- issue: Mối liên hệ giữa sự hiện diện của Đức Chúa Trời và cuộc xuất hành
  choice: Giữ cả hai vế nối tiếp, với “Đấng đã đưa…” đồng vị với Yahweh
  alternative: Diễn giải thành “vì Đấng đã đưa… sẽ ở cùng anh em”
  rationale: Cấu trúc Hê-bơ-rơ trước hết khẳng định Yahweh ở cùng dân, rồi nhận diện Ngài là Đấng đã đưa họ lên khỏi Ai Cập. Bản dịch không giải thích thêm bản chất hay cơ chế của sự bảo đảm này.
- issue: Số ít tập thể của đại từ ngôi hai
  choice: Dùng “anh em” để chỉ cộng đồng Israel
  alternative: Dùng “ngươi” theo sát số ít ngữ pháp
  rationale: Tiếng Hê-bơ-rơ nói với Israel như một tập thể bằng ngôi hai số ít. “Anh em” tự nhiên và trang trọng trong tiếng Việt hiện đại, đồng thời vẫn chỉ toàn dân; không cá nhân hóa mệnh lệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi hai số ít tập thể hướng đến Israel; dùng “chúng” cho quân thù. Dấu gạch ngang trước cụm đồng vị giúp câu dài sáng rõ mà không thay đổi quan hệ cú pháp.
