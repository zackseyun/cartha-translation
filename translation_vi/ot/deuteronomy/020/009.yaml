  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: vi
  text: Khi các quan chức đã nói xong với dân chúng, họ sẽ bổ nhiệm các chỉ huy quân đội đứng đầu dân chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ sẽ tập hợp hoặc kiểm điểm các chỉ huy quân đội để đặt họ đứng đầu dân chúng.” Động từ Hê-bơ-rơ có thể mang nghĩa bổ nhiệm, tập hợp/kiểm điểm, hoặc đặt ai đó phụ trách, tùy văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: Khi ... đã ... xong
  rationale: Công thức וְהָיָה đi với כְּ và động từ nguyên mẫu diễn tả thời điểm một hành động hoàn tất trước hành động kế tiếp; cách nói này tự nhiên trong tiếng Việt hiện đại.
- source_word: הַשֹּׁטְרִים
  choice: các quan chức
  rationale: Trong Phục Truyền Luật Lệ Ký, từ này chỉ những người giữ chức vụ hành chính và tổ chức dân chúng; “quan chức” rõ nghĩa hơn “thư ký” và không mặc nhiên biến họ thành sĩ quan quân đội.
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: nói ... với dân chúng
  rationale: Giữ sát nghĩa עָם là dân chúng, không thu hẹp thành “binh lính” dù văn cảnh mang tính quân sự.
- source_word: וּפָקְדוּ
  choice: họ phải bổ nhiệm
  rationale: פקד có thể mang nghĩa bổ nhiệm, tập hợp/kiểm quân hoặc đặt phụ trách. Với đối tượng là các người chỉ huy và cụm chỉ vị trí lãnh đạo theo sau, “bổ nhiệm” phù hợp nhất, nhưng tính đa nghĩa được ghi ở chú thích.
- source_word: שָׂרֵי צְבָאוֹת
  choice: những người chỉ huy quân đội
  rationale: שָׂרֵי chỉ những người lãnh đạo/chỉ huy, còn צְבָאוֹת chỉ các lực lượng quân sự; cách dịch này trang trọng, rõ ràng và tự nhiên.
- source_word: בְּרֹאשׁ הָעָם
  choice: đứng đầu dân chúng
  rationale: Giữ hình ảnh Hê-bơ-rơ “ở đầu dân chúng” đồng thời diễn đạt rõ vị trí lãnh đạo, không nhất thiết chỉ vị trí không gian ở phía trước.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “dân chúng” để giữ phạm vi của עָם; tránh diễn giải thành “binh lính.” Dấu chú thích [a] được đặt sau toàn mệnh đề có điểm đa nghĩa để không làm gián đoạn câu.
