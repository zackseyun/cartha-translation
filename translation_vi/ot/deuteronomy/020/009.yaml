    rationale: וּפָקְדוּ sau mệnh đề thời gian trong văn cảnh quy định có thể được dịch “sẽ bổ nhiệm”; cách này truyền đạt kết quả/quy trình được quy định mà không thêm nhấn mạnh bắt buộc.
  - severity: low
