  text: כִּֽי תָצ֣וּר אֶל עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽ/הִלָּחֵ֧ם עָלֶ֣י/הָ לְ/תָפְשָׂ֗/הּ לֹֽא תַשְׁחִ֤ית אֶת עֵצָ/הּ֙ לִ/נְדֹּ֤חַ עָלָי/ו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣/נּוּ תֹאכֵ֔ל וְ/אֹת֖/וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽ/אָדָם֙ עֵ֣ץ הַ/שָּׂדֶ֔ה לָ/בֹ֥א מִ/פָּנֶ֖י/ךָ בַּ/מָּצֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: vi
  text: Khi anh em vây hãm một thành trong nhiều ngày, giao chiến với thành ấy để chiếm lấy, thì không được phá hủy cây cối của thành ấy bằng cách vung rìu chặt chúng, vì anh em có thể ăn trái của chúng; và không được đốn chúng. Vì cây ngoài đồng há là con người để ra đối đầu với anh em trong cuộc vây hãm sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì con người là cây ngoài đồng,” hoặc “vì cây ngoài đồng là thức ăn của con người.” Mệnh đề cuối trong tiếng Hê-bơ-rơ khó hiểu; bản văn chính hiểu đây là câu hỏi tu từ, tương phản cây với kẻ địch là con người.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר
  choice: vây hãm
  rationale: Diễn đạt trực tiếp hành động quân sự bao vây một thành để chiếm lấy.
- source_word: יָמִים רַבִּים
  choice: trong nhiều ngày
  rationale: Giữ sát biểu thức thời gian của tiếng Hê-bơ-rơ và vẫn tự nhiên trong tiếng Việt.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: giao chiến với thành ấy
  rationale: Bảo toàn ý nghĩa hành động thù địch trong bối cảnh vây thành.
- source_word: לְתָפְשָׂהּ
  choice: để chiếm lấy
  rationale: Phù hợp với việc chiếm một thành bằng hoạt động quân sự.
- source_word: לֹא תַשְׁחִית אֶת עֵצָהּ
  choice: không được phá hủy cây cối của thành
  rationale: שׁחת ở thể Hiphil mang nghĩa làm hư hoại hoặc phá hủy; cách dịch này rõ và đủ mạnh.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: bằng cách vung rìu chặt chúng
  rationale: Chuyển thành lối nói tự nhiên trong tiếng Việt về việc dùng rìu tác động lên cây, không cố giữ thành ngữ Hê-bơ-rơ một cách khó hiểu.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: vì anh em có thể ăn trái của chúng
  rationale: Trong ngữ cảnh cây ăn quả, thêm 'trái' làm rõ thứ được ăn mà không thay đổi lý do phải giữ cây; 'có thể' thể hiện giá trị sử dụng trong bối cảnh.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: không được đốn chúng
  rationale: כרת là động từ thông dụng chỉ việc đốn cây; số nhiều tự nhiên trong tiếng Việt khi quy chiếu về 'cây cối'.
- source_word: הָאָדָם
  choice: con người
  rationale: Ở đây từ này chỉ một đối thủ thuộc loài người nói chung, tương phản với cây, chứ không nhấn mạnh giới tính.
- source_word: עֵץ הַשָּׂדֶה
  choice: cây ngoài đồng
  rationale: Cách diễn đạt tự nhiên, sát nghĩa cấu trúc Hê-bơ-rơ và giữ được hình ảnh cây ở nơi đồng ruộng.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: mà phải đối đầu với anh em trong cuộc vây hãm
  rationale: Diễn đạt câu hỏi tu từ theo hướng cây không phải kẻ địch có thể ra đối diện trong chiến trận, đồng thời không thêm một hành động cụ thể ngoài văn bản.
theological_decisions:
- issue: Cách hiểu mệnh đề khó כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: Dịch thành câu hỏi tu từ tương phản cây ngoài đồng với đối thủ là con người.
  alternative: 'Có thể hiểu theo lối trần thuật: “vì con người là cây ngoài đồng,” hoặc theo ý công dụng: “vì cây ngoài đồng là thức ăn của con người.”'
  rationale: Cú pháp Hê-bơ-rơ thực sự khó và cho phép nhiều cách hiểu. Câu hỏi tu từ phù hợp với mạch văn cấm hủy hoại cây ăn quả vì cây không phải chiến binh thù địch; các cách hiểu khác được giữ trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số ít mang tính đại diện, phù hợp diễn ngôn giao ước hướng đến toàn dân; các đại từ quy chiếu được chuyển sang số nhiều tự nhiên theo danh từ tập hợp “cây cối”.
