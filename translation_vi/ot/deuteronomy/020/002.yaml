    rationale: “Phải” diễn đạt nghĩa bắt buộc không được nêu trực tiếp bởi động từ Hebrew; “bước ra” cũng thiên về bước ra từ một vị trí nào đó, trong khi נגשׁ nhấn mạnh việc tiến đến/đến gần. “Sẽ tiến đến” bảo toàn tốt hơn sắc thái tương lai và chuyển động của nguyên văn.
  - severity: low
    issue: “dân chúng” cho הָעָם
    rationale: Không sai, nhưng “dân” là tương đương trực tiếp, gọn và tự nhiên hơn cho danh từ xác định số ít tập thể trong nguyên văn; chú thích vẫn giải thích đúng quy chiếu quân sự theo ngữ cảnh.
  revised_text: Khi anh em tiến gần trận chiến[a], thầy tế lễ sẽ tiến đến và nói với dân[b],
