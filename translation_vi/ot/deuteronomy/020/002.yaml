base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: vi
  text: Khi anh em tiến gần trận chiến[a], thầy tế lễ sẽ tiến đến và nói với dân[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cuộc chiến”. Từ Hê-bơ-rơ מִלְחָמָה có thể chỉ chiến tranh nói chung hoặc một trận đánh cụ thể; ở đây, việc sắp giao chiến khiến cách dịch “trận chiến” phù hợp hơn.
    reason: lexical_alternative
  - marker: b
    text: “Dân” ở đây chỉ lực lượng Israel đã tập hợp, nhưng nguyên văn Hê-bơ-rơ vẫn dùng từ rộng nghĩa là “dân”, chứ không dùng một từ hẹp nghĩa hơn như “binh sĩ”.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  choice: Khi anh em đến gần
  rationale: Cấu trúc וְהָיָה kèm mệnh đề thời gian giới thiệu một hoàn cảnh tương lai; tiếng Việt diễn đạt tự nhiên bằng “Khi”. Đại từ số nhiều được thể hiện bằng “anh em”, phù hợp với lời chỉ dẫn dành cho cộng đồng Israel.
- source_word: אֶל הַמִּלְחָמָה
  choice: trận chiến
  rationale: מִלְחָמָה có thể chỉ chiến tranh nói chung hoặc một trận đánh cụ thể; ngữ cảnh tiến đến giao chiến trực tiếp nghiêng về “trận chiến”.
- source_word: וְנִגַּשׁ
  choice: phải bước ra
  rationale: Động từ נגשׁ chỉ việc đến gần hoặc tiến lên. Trong bối cảnh thầy tế lễ đứng ra nói với đoàn quân, “bước ra” truyền đạt tự nhiên chuyển động tiến lên phía trước; “phải” diễn tả giá trị chỉ thị tương lai trong luật lệ.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Danh từ xác định số ít כֹּהֵן được dịch theo cách gọi phổ thông, trang trọng trong tiếng Việt.
- source_word: וְדִבֶּר אֶל
  choice: và nói với
  rationale: Piel của דבר ở đây mang nghĩa thông thường là nói; cách dịch này bám sát nguyên văn hơn “hiệu triệu” hay “ngỏ lời”.
- source_word: הָעָם
  choice: dân chúng
  rationale: עָם là từ rộng nghĩa “dân/dân chúng”. Dù trong ngữ cảnh này chỉ lực lượng Israel đang tập hợp để chiến đấu, bản dịch không thu hẹp thành “binh sĩ”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” giữ sắc thái lời chỉ dẫn cho toàn thể cộng đồng; “dân chúng” bảo toàn phạm vi rộng của הָעָם. Dấu phẩy cuối câu được giữ vì câu tiếp tục sang câu kế.
