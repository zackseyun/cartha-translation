  to: Khi anh em tiến gần trận chiến[a], thầy tế lễ sẽ tiến đến và nói với dân[b],
  rationale: 'Sửa “phải bước ra” thành “sẽ tiến đến” để phản ánh chính xác hơn וְנִגַּשׁ: hành động tiến lại gần trong khung cảnh tương lai, không thêm sắc thái mệnh lệnh bắt buộc. Sửa “dân chúng” thành “dân” để bám sát הָעָם hơn, đồng thời duy trì chú thích làm rõ người được nói đến trong ngữ cảnh.'
