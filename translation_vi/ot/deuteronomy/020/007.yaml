base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: vi
  text: Còn người nào đã đính hôn với một phụ nữ nhưng chưa cưới nàng thì hãy đi, trở về nhà mình, kẻo người ấy chết trận và một người đàn ông khác cưới nàng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Còn người nào
  rationale: Mở đầu hạng người tiếp theo được miễn ra trận; “còn” nối tự nhiên với các lời công bố trước, còn “người nào” giữ sắc thái câu hỏi tu từ.
- source_word: אֵרַשׂ אִשָּׁה
  choice: đã đính hôn với một phụ nữ
  rationale: אֵרַשׂ chỉ việc đính ước chính thức trước khi hoàn tất hôn nhân; “đính hôn” là cách nói hiện đại, rõ nghĩa và tự nhiên.
- source_word: וְלֹא לְקָחָהּ
  choice: nhưng chưa cưới nàng
  rationale: לקח một phụ nữ trong ngữ cảnh này là nhận nàng làm vợ, tức hoàn tất hôn nhân. Dịch theo nghĩa ngữ cảnh tránh lối nói “chưa lấy nàng” dễ gây mơ hồ trong tiếng Việt hiện đại.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: thì hãy đi, trở về nhà mình
  rationale: Giữ cả hai động từ của tiếng Hê-bơ-rơ và truyền đạt lực chỉ thị của mệnh đề trong bối cảnh miễn quân dịch.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: kẻo người ấy chết trận
  rationale: “Kẻo” diễn đạt tự nhiên ý cảnh báo tiêu cực của פֶּן; “chết trận” cô đọng và đúng nghĩa chết trong cuộc chiến đang nói đến.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: và một người đàn ông khác cưới nàng
  rationale: Trong mệnh đề song song, יִקָּחֶנָּה mang nghĩa hôn nhân; “cưới nàng” làm rõ nghĩa mà vẫn giữ sự tương ứng với “chưa cưới nàng” ở vế trước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nàng” để chỉ người phụ nữ đã đính hôn, vừa tránh lặp danh từ vừa giữ sắc thái tôn trọng; không cần chú thích vì nghĩa hôn nhân của לקח được thể hiện trực tiếp trong bản dịch.
