  yaml_path: translation/ot/deuteronomy/020/010.yaml
  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: vi
  text: Khi anh em đến gần một thành để giao chiến với thành ấy, hãy ngỏ lời hòa bình với thành ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hãy công bố hòa bình cho thành ấy”; cũng có thể hiểu là “hãy đưa ra các điều kiện hòa bình cho thành ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong quy định này, כִּי mở đầu một hoàn cảnh dự liệu, nên “Khi” tự nhiên và phù hợp hơn cách hiểu nguyên nhân “vì”.
- source_word: תִקְרַב
  choice: đến gần
  rationale: Giữ nghĩa cụ thể của động từ קרב là tiến đến hoặc đến gần.
- source_word: עִיר
  choice: một thành
  rationale: Diễn đạt danh từ số ít không xác định trong văn cảnh luật lệ; “thành” có sắc thái trang trọng, phù hợp bối cảnh cổ đại.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: để giao chiến với thành ấy
  rationale: Động từ לחם chỉ việc tham chiến; “giao chiến với” là cách nói tự nhiên trong tiếng Việt và truyền đạt quan hệ đối địch của עַל.
- source_word: וְקָרָאתָ אֵלֶיהָ לְשָׁלוֹם
  choice: hãy đề nghị hòa bình với thành ấy
  rationale: קרא ... לְשָׁלוֹם theo văn cảnh là lên tiếng hướng tới hòa bình. Cách dịch này diễn đạt tự nhiên hành động đưa ra lời đề nghị, trong khi chú thích bảo lưu cách hiểu sát mặt chữ hơn.
theological_decisions: []
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện ngôi thứ hai số ít trong tiếng Hê-bơ-rơ được dùng để nói với cộng đồng Israel; lặp lại “thành ấy” để tránh đại từ chỉ vật thiếu tự nhiên và giữ rõ đối tượng.
