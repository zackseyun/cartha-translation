language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם הַ/הֹלֵ֖ךְ עִמָּ/כֶ֑ם לְ/הִלָּחֵ֥ם לָ/כֶ֛ם עִם אֹיְבֵי/כֶ֖ם לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: vi
  text: Vì Yahweh, Đức Chúa Trời của anh em, là Đấng đi cùng anh em để chiến đấu vì anh em, chống lại kẻ thù của anh em và giải cứu anh em[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cứu anh em” hoặc “ban chiến thắng cho anh em”. Động từ Hê-bơ-rơ chỉ sự cứu thoát; trong bối cảnh chiến trận ở đây, từ này cũng có thể bao hàm việc ban chiến thắng.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng nêu lý do cho lời khích lệ ở câu trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, không thay bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Thể hiện dạng sở hữu ngôi thứ hai số nhiều trong lời nói với cộng đồng Israel.
- source_word: הַהֹלֵךְ
  choice: là Đấng đi
  rationale: Phân từ mô tả đặc tính hay hành động đang tiếp diễn; cách dịch này giữ sắc thái mô tả mà vẫn trang trọng, tự nhiên.
- source_word: עִמָּכֶם
  choice: cùng anh em
  rationale: Diễn đạt trực tiếp sự đồng hành của Đức Chúa Trời với dân Ngài.
- source_word: לְהִלָּחֵם
  choice: để chiến đấu
  rationale: Phù hợp với ngữ cảnh chiến trận và giữ rõ mục đích của việc Ngài đi cùng họ.
- source_word: לָכֶם
  choice: thay cho anh em
  rationale: 'Diễn đạt thể tặng cách chỉ lợi ích: Đức Chúa Trời chiến đấu vì lợi ích và trên danh nghĩa của Israel.'
- source_word: עִם אֹיְבֵיכֶם
  choice: chống lại kẻ thù của anh em
  rationale: Trong ngữ cảnh giao chiến, עִם biểu thị bên đối địch; 'chống lại' truyền đạt rõ quan hệ này.
- source_word: לְהוֹשִׁיעַ
  choice: giải cứu
  rationale: Động từ Hiphil của ישׁע chỉ hành động cứu thoát; trong bối cảnh quân sự cũng có thể hàm ý ban chiến thắng.
- source_word: אֶתְכֶם
  choice: anh em
  rationale: Đại từ ngôi thứ hai số nhiều, phù hợp với lời kêu gọi tập thể dành cho Israel.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước; giữ dạng phiên âm 'Yahweh' giúp phân biệt danh riêng với tước hiệu.
- issue: Phạm vi nghĩa của לְהוֹשִׁיעַ trong bối cảnh chiến trận
  choice: giải cứu anh em
  alternative: cứu anh em; ban chiến thắng cho anh em
  rationale: '''Giải cứu'' giữ ý cứu thoát rộng của động từ mà không thu hẹp hoàn toàn thành thắng lợi quân sự; chú thích nêu rõ sắc thái chiến thắng có thể có trong ngữ cảnh.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng Israel; dùng “Đấng” để diễn đạt tự nhiên cấu trúc phân từ xác định. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
