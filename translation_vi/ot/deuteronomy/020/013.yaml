  naturalness: Câu văn hiện đại, trang trọng và rõ nghĩa. Cách xưng hô số nhiều “anh em” phù hợp với ngữ cảnh mệnh lệnh hướng đến cộng đồng trong tiếng Việt, dù hình thức Hê-bơ-rơ là số ít. Dấu chấm phẩy và “rồi” biểu đạt trình tự tự nhiên mà không làm thay đổi ý nghĩa.
