source:
  edition: WLC
  text: וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וְ/הִכִּיתָ֥ אֶת כָּל זְכוּרָ֖/הּ לְ/פִי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: vi
  text: Yahweh, Đức Chúa Trời của anh em, sẽ trao thành ấy vào tay anh em; rồi anh em phải dùng lưỡi gươm đánh chết tất cả người nam trong thành[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “tất cả giống đực của nó”; từ ngữ xác định người nam, chứ không dùng một từ chung chỉ toàn thể dân cư.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: sẽ trao thành ấy
  rationale: Động từ נתן kèm hậu tố tân ngữ giống cái số ít chỉ về thành; nêu rõ “thành ấy” tự nhiên và tránh đại từ mơ hồ trong tiếng Việt. Liên từ וּ được thể hiện qua trình tự của câu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự quen dùng, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Phản ánh thành ngữ giao ước với hậu tố ngôi thứ hai. “Anh em” là cách xưng hô tập thể tự nhiên trong tiếng Việt dù tiếng Hê-bơ-rơ dùng hình thức số ít.
- source_word: בְּיָדֶךָ
  choice: vào tay anh em
  rationale: Giữ hình ảnh Hê-bơ-rơ về việc trao thành vào quyền kiểm soát của người nghe, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: וְהִכִּיתָ
  choice: rồi anh em phải ... đánh chết
  rationale: Trong bối cảnh quân sự, thể Hifil của נכה chỉ hành động hạ sát. “Đánh chết” diễn đạt trực tiếp sức nặng gây chết người; “rồi” thể hiện trình tự, còn “phải” truyền đạt giá trị chỉ thị.
- source_word: כָּל זְכוּרָהּ
  choice: tất cả người nam trong thành
  rationale: Giữ trọn lực bao quát của כָּל và nét nghĩa chỉ giới tính của זְכוּר, không thu hẹp thành người trưởng thành hay làm rộng thành toàn thể cư dân.
- source_word: לְפִי חָרֶב
  choice: dùng lưỡi gươm
  rationale: Thành ngữ có nghĩa đen là “bằng miệng gươm”; “lưỡi gươm” bảo tồn hình ảnh và diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Diễn đạt mệnh lệnh chiến tranh được quy cho hành động trao thành của Đức Chúa Trời
  choice: Dịch thẳng rằng Yahweh trao thành và dân phải đánh chết tất cả người nam trong thành.
  alternative: Làm nhẹ thành “đánh bại”, bỏ đối tượng người nam, hoặc thêm lời giải thích về sự phán xét hay chiến tranh thánh.
  rationale: Nguyên văn vừa quy việc trao thành cho Yahweh vừa đưa ra chỉ thị gây chết người đối với toàn bộ người nam. Bản dịch giữ nguyên sức nặng và căng thẳng thần học của câu, không uyển ngữ cũng không thêm lời biện giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh em” theo lối xưng hô tập thể tự nhiên trong tiếng Việt; dấu chấm được đặt sau ký hiệu chú thích để ký hiệu gắn rõ với cụm “người nam trong thành”.
