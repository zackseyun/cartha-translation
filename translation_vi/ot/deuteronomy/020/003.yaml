    issue: “quân thù của mình” không giữ rõ ngôi thứ hai số nhiều.
    rationale: Hậu tố -כֶם trong אֹיְבֵיכֶם nghĩa là “của anh em/các anh em.” “Mình” có thể được hiểu hồi chỉ chủ ngữ hoặc mang sắc thái khái quát, nên kém chính xác hơn trong lời xưng hô trực tiếp.
