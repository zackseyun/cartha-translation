source:
  edition: WLC
  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: vi
  text: 'và nói với họ: “Hỡi Israel, hãy nghe! Hôm nay anh em đang tiến đến trận chiến chống lại quân thù của anh em. Lòng anh em đừng nao núng.[a] Đừng sợ, đừng hoảng loạn[b] và đừng kinh hãi trước mặt chúng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng nản lòng.” Thành ngữ Hê-bơ-rơ sát nghĩa là “lòng anh em đừng trở nên mềm yếu,” chỉ sự suy sụp lòng can đảm.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ cũng có thể diễn tả việc bị cuống quýt hoặc rối loạn vì sợ. Ba mệnh lệnh liên tiếp nhấn mạnh rằng họ không được khuất phục trước nỗi sợ trong chiến trận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: và nói
  rationale: Dạng hoàn thành có waw trong mạch chỉ dẫn diễn tả hành động kế tiếp; “và nói” nối tự nhiên với thủ tục ở câu trước mà không biến nó thành một hành động quá khứ.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Hỡi Israel, hãy nghe!
  rationale: Giữ lời triệu gọi giao ước quen thuộc trong Phục Truyền Luật Lệ Ký; “hãy nghe” bao hàm cả nghe và chú tâm làm theo.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: hôm nay anh em đang tiến đến trận chiến
  rationale: Phân từ קְרֵבִים diễn tả việc đến gần đang diễn ra và cuộc giao chiến sắp xảy ra; cách dịch này giữ hình ảnh chuyển động tới gần.
- source_word: עַל אֹיְבֵיכֶם
  choice: chống lại quân thù của mình
  rationale: Trong ngữ cảnh chiến trận, עַל mang nghĩa đối địch; “quân thù” tự nhiên hơn khi nói đến lực lượng đối phương.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: Lòng anh em đừng nao núng
  rationale: Giữ hình ảnh “lòng” của tiếng Hê-bơ-rơ đồng thời diễn đạt tự nhiên sự suy sụp về can đảm; chú thích nêu cách dịch thay thế và nghĩa sát chữ.
- source_word: אַל תִּירְאוּ
  choice: Đừng sợ
  rationale: Cách dịch trực tiếp, rõ ràng của động từ ירא và mở đầu chuỗi ba mệnh lệnh cấm sợ hãi.
- source_word: וְאַל תַּחְפְּזוּ
  choice: đừng hoảng loạn
  rationale: Trong lời khích lệ trước chiến trận, động từ chỉ phản ứng bấn loạn vì kinh hãi hơn là sự vội vàng đơn thuần.
- source_word: וְאַל תַּעַרְצוּ
  choice: đừng kinh hãi
  rationale: Diễn đạt trạng thái bị đối phương làm cho khiếp đảm, đồng thời giữ sức nặng tăng dần của chuỗi mệnh lệnh.
- source_word: מִפְּנֵיהֶם
  choice: trước mặt chúng
  rationale: Giữ gần hình ảnh không gian “từ trước mặt chúng” của nguyên văn, đồng thời vẫn tự nhiên trong tiếng Việt và không thu hẹp quan hệ này chỉ còn nghĩa nguyên nhân.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh em” thể hiện ngôi thứ hai số nhiều trong lời vị tế lễ nói với cộng đồng Israel, tránh sắc thái cổ hoặc xa cách của “các ngươi.” Tên Israel được giữ theo dạng thông dụng hiện đại.
