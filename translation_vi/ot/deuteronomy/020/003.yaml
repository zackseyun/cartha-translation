  to: 'và nói với họ: “Hỡi Israel, hãy nghe! Hôm nay anh em đang tiến đến trận chiến chống lại quân thù của anh em. Lòng anh em đừng nao núng.[a] Đừng sợ, đừng hoảng loạn[b] và đừng kinh hãi trước mặt chúng.”'
