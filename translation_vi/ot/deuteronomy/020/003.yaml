  terminology: “Israel,” “anh em,” “trận chiến,” “nao núng,” “hoảng loạn,” và “kinh hãi” được dùng nhất quán và không áp đặt diễn giải thần học. Sửa đại từ sở hữu để duy trì chính xác người được trực tiếp xưng hô.
  issues:
