  source_fidelity: 'Bản dịch phản ánh đúng mạch mệnh lệnh của câu: lời vị tế tiếp nối thủ tục trước đó, lời triệu gọi Israel, việc đến gần chiến trận, và bốn phủ định liên quan đến sự nhụt chí/sợ hãi. “Trước mặt chúng” giữ được sắc thái không gian của מִפְּנֵיהֶם tốt hơn cách thuần nhân quả. Tuy nhiên, “quân thù của mình” làm mờ sở hữu ngôi thứ hai số nhiều của אֹיְבֵיכֶם; cần là “quân thù của anh em.”'
