  text: וְ/דִבְּר֣וּ הַ/שֹּֽׁטְרִים֮ אֶל הָ/עָ֣ם לֵ/אמֹר֒ מִֽי הָ/אִ֞ישׁ אֲשֶׁ֨ר בָּנָ֤ה בַֽיִת חָדָשׁ֙ וְ/לֹ֣א חֲנָכ֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יַחְנְכֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: vi
  text: 'Rồi các viên chức sẽ nói với dân chúng rằng: “Có người đàn ông nào đã xây một ngôi nhà mới mà chưa khánh thành[a] không? Người ấy hãy đi và trở về nhà mình, kẻo chết trong chiến trận và một người đàn ông khác sẽ khánh thành ngôi nhà đó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làm lễ dâng hiến.” Động từ Hê-bơ-rơ chỉ việc chính thức bắt đầu sử dụng ngôi nhà mới, thường có sắc thái dâng hiến.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: các viên chức
  rationale: Chỉ những người được giao chức trách hành chính trong cộng đồng và, ở đây, trong việc tổ chức quân đội. “Các viên chức” tự nhiên hơn “các ký lục” và không thu hẹp quá mức thành một cấp bậc quân sự cụ thể.
- source_word: הָעָם
  choice: dân chúng
  rationale: Giữ nghĩa trực tiếp là cộng đồng dân sự đang được triệu tập, thay vì diễn giải cụ thể thành “quân lính”.
- source_word: מִי הָאִישׁ
  choice: Có người đàn ông nào… không?
  rationale: Diễn đạt tự nhiên cấu trúc câu hỏi tiếng Hê-bơ-rơ, đồng thời giữ số ít và giới tính nam phù hợp với bối cảnh những người có nghĩa vụ ra trận.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: đã xây một ngôi nhà mới
  rationale: Dịch trực tiếp בַּיִת là “ngôi nhà”, không mở rộng thành khái niệm “mái ấm”.
- source_word: וְלֹא חֲנָכוֹ
  choice: mà chưa khánh thành ngôi nhà đó
  rationale: Trong ngữ cảnh một ngôi nhà mới, חנך nói đến việc chính thức bắt đầu đưa nhà vào sử dụng, có thể kèm ý nghĩa dâng hiến. “Khánh thành” diễn đạt tự nhiên mà không khẳng định một nghi lễ cụ thể.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Người ấy hãy đi và trở về nhà mình
  rationale: Các động từ ở đây mang lực mệnh lệnh trong thủ tục pháp lý; “hãy” chuyển tải lực ấy rõ ràng và tự nhiên.
- source_word: פֶּן
  choice: kẻo
  rationale: Diễn đạt ngắn gọn sắc thái phòng ngừa hoặc hậu quả đáng tránh của פֶּן.
- source_word: יָמוּת בַּמִּלְחָמָה
  choice: phải chết trong chiến trận
  rationale: “Chiến trận” phản ánh bối cảnh giao chiến cụ thể; “phải chết” ở đây diễn đạt khả năng đáng lo chứ không hàm ý tất định.
- source_word: וְאִישׁ אַחֵר
  choice: một người đàn ông khác
  rationale: Giữ nguyên cách nói số ít, giống đực của nguyên văn thay vì khái quát thành “người khác”.
- source_word: יַחְנְכֶנּוּ
  choice: sẽ khánh thành ngôi nhà đó
  rationale: Lặp lại “khánh thành” để bảo toàn sự lặp từ חנך trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “viên chức” cho chức năng hành chính-quân sự mà không gán một cấp bậc hiện đại; dùng “khánh thành” nhất quán cho hai lần xuất hiện của cùng một động từ Hê-bơ-rơ.
