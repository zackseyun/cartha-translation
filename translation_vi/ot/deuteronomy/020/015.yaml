revisions:
- from: Ngươi phải làm như vậy với tất cả các thành ở rất xa ngươi, tức là những thành không thuộc các dân tộc này.[a]
  to: Ngươi phải làm như vậy với mọi thành cách ngươi rất xa, là những thành không thuộc về các dân tộc này.[a]
  rationale: Chỉnh nhẹ để mệnh đề quan hệ phản ánh sát hơn cấu trúc אֲשֶׁר לֹא מֵעָרֵי, đồng thời cải thiện tính tự nhiên của cụm chỉ khoảng cách. Ý nghĩa pháp lý và sự phân biệt phạm vi trong nguyên văn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
