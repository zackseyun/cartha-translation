  text: כֵּ֤ן תַּעֲשֶׂה֙ לְ/כָל הֶ֣/עָרִ֔ים הָ/רְחֹקֹ֥ת מִמְּ/ךָ֖ מְאֹ֑ד אֲשֶׁ֛ר לֹא מֵ/עָרֵ֥י הַ/גּֽוֹיִם הָ/אֵ֖לֶּה הֵֽנָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: vi
  text: Ngươi phải làm như vậy với mọi thành cách ngươi rất xa, là những thành không thuộc về các dân tộc này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hê-bơ-rơ: “là những thành không ở trong số các thành của các dân tộc này”; ý nói các thành ấy không thuộc về những dân tộc vừa được nhắc đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: như vậy
  rationale: Chỉ cách thức vừa được mô tả trong văn cảnh trước; cách diễn đạt tự nhiên và vẫn giữ sắc thái chỉ thị của nguyên ngữ.
- source_word: תַּעֲשֶׂה
  choice: ngươi phải làm
  rationale: Động từ Qal chưa hoàn thành ngôi hai số ít có lực mệnh lệnh trong văn bản luật pháp; “phải làm” truyền đạt rõ tính bắt buộc.
- source_word: לְכָל הֶעָרִים
  choice: với tất cả các thành
  rationale: Giới từ לְ đánh dấu đối tượng chịu tác động; “với” tự nhiên trong tiếng Việt khi đi với cụm “làm như vậy”.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: ở rất xa ngươi
  rationale: Giữ nguyên ý nghĩa không gian của רחק, quan hệ so với người nghe của מִמְּךָ và mức độ nhấn mạnh của מְאֹד.
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: tức là những thành không thuộc
  rationale: מִן mang nghĩa phân loại/thuộc về trong ngữ cảnh này. “Tức là” nối mệnh đề quan hệ một cách rõ ràng mà không mở rộng nội dung.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: các dân tộc này
  rationale: גּוֹיִם chỉ các dân tộc được nhắc đến trong bối cảnh địa-chính trị; tránh hàm ý chuyên biệt có thể đi kèm từ “dân ngoại”.
- source_word: הֵנָּה
  choice: được thể hiện trong “này”
  rationale: Đại từ giống cái số nhiều nhấn mạnh các dân tộc đang được chỉ đến; tiếng Việt thể hiện tự nhiên bằng từ chỉ định “này” mà không cần lặp thêm.
theological_decisions:
- issue: Ranh giới phạm vi giữa các thành ở xa và các thành thuộc những dân tộc được nói đến trong văn cảnh
  choice: Trình bày câu như một sự phân biệt pháp lý rõ ràng, không làm nhẹ hoặc giải thích thêm tính chất quân sự-phán xét.
  alternative: Diễn giải các điều khoản vây thành ở câu trước ngay trong câu này, hoặc làm nhẹ thành một nhận xét chung về các thành ngoại quốc.
  rationale: Câu này xác định rằng chỉ dẫn trước đó áp dụng cho các thành ở rất xa, chứ không áp dụng cho các thành thuộc những dân tộc đang được nhắc đến. Bản dịch giữ nguyên ranh giới ấy mà không đưa nội dung từ các câu lân cận vào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phản ánh lời chỉ thị ngôi hai số ít hướng đến Y-sơ-ra-ên như một chủ thể tập thể; giữ “thành” thay vì “thành phố” để phù hợp bối cảnh cổ đại và văn phong Kinh Thánh.
