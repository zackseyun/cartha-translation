language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: vi
  text: 'Nhưng đối với các thành của những dân tộc này mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em làm cơ nghiệp, anh em không được để bất cứ sinh vật nào sống sót.[a]


    [a] Theo sát tiếng Hê-bơ-rơ: “bất cứ vật nào có hơi thở.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hê-bơ-rơ: “bất cứ vật nào có hơi thở.”'
    reason: Ghi nhận cách diễn đạt sát hình ảnh của כָּל נְשָׁמָה (“mọi/bất cứ vật có hơi thở”), trong khi chính văn dùng “sinh vật nào” cho tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: רַק
  choice: Nhưng
  rationale: Ở đây từ này đánh dấu sự tương phản và ngoại lệ so với chỉ thị về các thành ở xa trong những câu trước; “Nhưng” diễn đạt tự nhiên chức năng liên kết ấy.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: trong các thành của những dân tộc này
  rationale: Cách diễn đạt này nêu phạm vi được tách riêng khỏi quy tắc trước đó; “những dân tộc” phản ánh עַמִּים mà không gợi khái niệm quốc gia-dân tộc hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ cách xưng hô số ít hướng đến Israel như một cộng đồng giao ước; “anh em” là cách diễn đạt tiếng Việt trang trọng, quen thuộc và dễ hiểu trong ngữ cảnh này.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: đang ban cho anh em làm cơ nghiệp
  rationale: “Đang ban” phản ánh sắc thái tiếp diễn của phân từ נֹתֵן; “cơ nghiệp” bảo lưu ý nghĩa phần đất được ban theo giao ước của נַחֲלָה.
- source_word: לֹא תְחַיֶּה
  choice: không được để ... sống sót
  rationale: Dạng Piel của חיה ở đây có nghĩa khiến hoặc cho sống; “không được để ... sống sót” truyền đạt trực tiếp lực cấm đoán trong bối cảnh chiến tranh.
- source_word: כָּל נְשָׁמָה
  choice: bất cứ vật gì có hơi thở
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “mọi hơi thở/vật có hơi thở”; lựa chọn này giữ hình ảnh cụ thể và không thu hẹp ngầm thành riêng con người.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa giao ước của נַחֲלָה
  choice: cơ nghiệp
  alternative: sản nghiệp hoặc phần sở hữu
  rationale: “Cơ nghiệp” giữ được sắc thái phần đất do Đức Chúa Trời ban trong giao ước, thay vì giản lược thành quyền sở hữu thông thường.
- issue: Phạm vi của כָּל נְשָׁמָה
  choice: bất cứ vật gì có hơi thở
  alternative: một sinh vật nào
  rationale: Nguyên văn không nói rõ riêng con người hay mọi sinh vật có hơi thở; bản dịch chính giữ cách diễn đạt rộng và cụ thể của tiếng Hê-bơ-rơ, còn chú thích ghi cách nói tự nhiên hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh em” để nói với Israel như một cộng đồng, “ban” cho hành động của Đức Chúa Trời, và “cơ nghiệp” để giữ thuật ngữ đất giao ước. Cấu trúc câu được làm rõ bằng “là các thành mà” nhưng không bổ sung nội dung diễn giải.
