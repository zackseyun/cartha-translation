  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: vi
  text: Nhưng nhà tiên tri nào cả gan[a] nhân danh ta nói điều ta không truyền cho người ấy nói, hoặc nói nhân danh các thần khác, thì nhà tiên tri ấy phải chết.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự tiện” hoặc “ngạo mạn”. Động từ Hê-bơ-rơ diễn tả việc cố ý vượt quá thẩm quyền.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ chết” hoặc “phải bị xử tử”. Nguyên văn nêu án tử hình bằng một công thức ngắn gọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Nhưng
  rationale: Diễn đạt tự nhiên sức tương phản mạnh với nhà tiên tri chân chính được nói đến ngay trước đó.
- source_word: הַנָּבִיא
  choice: nhà tiên tri
  rationale: Cách dịch chuẩn, trang trọng và dễ hiểu của נָבִיא trong tiếng Việt hiện đại.
- source_word: יָזִיד
  choice: cả gan
  rationale: Truyền đạt hành vi cố ý vượt quyền, hỗn xược và tự tiện; tự nhiên hơn lối dịch nặng tính thuật ngữ như “hành động cách presumptuous”.
- source_word: לְדַבֵּר דָּבָר
  choice: nói điều
  rationale: Giữ ý của cấu trúc động từ–danh từ Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt; “điều” ở đây chỉ lời hoặc thông điệp được nói ra.
- source_word: בִּשְׁמִי
  choice: nhân danh ta
  rationale: Thành ngữ tiếng Việt rõ nghĩa về việc tự nhận thẩm quyền và sự ủy nhiệm của Đức Chúa Trời.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: điều ta không truyền cho người ấy nói
  rationale: Giữ nguyên mệnh đề quan hệ và ngôn ngữ mệnh lệnh của nguyên văn, đồng thời làm rõ đối tượng của động từ bằng “người ấy”.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: hoặc ... mà nói
  rationale: Trong ngữ cảnh pháp lý, liên từ giới thiệu hành vi phạm tội thứ hai như một trường hợp thay thế.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: nhân danh các thần khác
  rationale: Bám sát nguyên văn và thể hiện việc viện đến thẩm quyền của những thần khác.
- source_word: וּמֵת
  choice: phải chết
  rationale: Diễn đạt gọn công thức án tử hình trong tiếng Việt hiện đại mà không thêm rõ cơ chế thi hành vốn không được nêu trực tiếp trong hình thái Hê-bơ-rơ.
- source_word: הַנָּבִיא הַהוּא
  choice: nhà tiên tri ấy
  rationale: Giữ sự xác định và nhấn mạnh của danh từ kèm đại từ chỉ định.
theological_decisions:
- issue: Cách nhắc đến danh Đức Chúa Trời trong lời phán ngôi thứ nhất
  choice: Giữ “nhân danh ta”
  alternative: Mở rộng thành “nhân danh Đức Giê-hô-va” hoặc “nhân danh Chúa”
  rationale: Nguyên văn là lời phán trực tiếp ở ngôi thứ nhất. Giữ đại từ “ta” tránh đưa vào câu một danh xưng không xuất hiện tại đây.
- issue: Công thức hình phạt
  choice: Dịch וּמֵת là “phải chết”
  alternative: “sẽ chết” hoặc “phải bị xử tử”
  rationale: “Phải chết” bảo toàn sắc thái phán quyết pháp lý ngắn gọn. “Sẽ chết” có thể bị hiểu như dự báo đơn thuần, còn “phải bị xử tử” làm rõ tác nhân và cách thi hành hơn điều hình thái Hê-bơ-rơ trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cả gan” thể hiện sắc thái cố ý, ngang nhiên vượt quyền nhưng không quá cổ; “nhân danh” giữ thành ngữ thần học–pháp lý quen thuộc. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn và được đặt sát nội dung liên quan.
