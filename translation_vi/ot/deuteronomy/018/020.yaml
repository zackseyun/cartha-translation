    issue: Chú thích [a] đang đặt sau “nói”, dù chú thích này giải thích từ “cả gan”.
    rationale: Neo chú thích cần đặt sát từ/cụm từ mà nó chú giải, để không gợi rằng chú thích giải thích riêng động từ “nói” hay toàn bộ mệnh đề.
  - severity: low
