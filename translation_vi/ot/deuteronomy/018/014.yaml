source:
  edition: WLC
  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: vi
  text: Vì các dân tộc này, là những dân mà anh em sắp chiếm lấy đất đai của họ[a], nghe theo những kẻ xem điềm[b] và những thầy bói; còn anh em thì Yahweh, Đức Chúa Trời của anh em, không ban cho anh em điều như thế[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mà anh em sắp đuổi đi” hoặc “mà anh em sắp chiếm hữu”; động từ Hê-bơ-rơ có thể bao hàm cả việc chiếm hữu và việc tước quyền sở hữu của các cư dân trước.'
    reason: lexical_alternative
  - marker: b
    text: “Những kẻ xem điềm” là những người tìm sự chỉ dẫn qua điềm triệu hoặc các dấu hiệu được xem là báo trước.
    reason: cultural_note
  - marker: c
    text: 'Tiếng Hê-bơ-rơ dịch sát là: “còn anh em, không như thế, Yahweh, Đức Chúa Trời của anh em, đã ban cho anh em”; điều được ban không được nói rõ. Bản dịch hiểu đó là những cách tìm sự chỉ dẫn vừa nêu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Diễn tả quan hệ giải thích/nguyên nhân với phần cấm đoán ngay trước đó.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: các dân tộc
  rationale: Chỉ các dân không phải Israel trong vùng đất; cách dịch tự nhiên và phù hợp ngữ cảnh.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אוֹתָם
  choice: mà anh em sắp chiếm đất của họ
  rationale: ירשׁ ở đây bao hàm việc Israel chiếm hữu đất, kéo theo việc các cư dân trước bị mất quyền sở hữu; cách diễn đạt tiếng Việt giữ được hai phía của ý nghĩa mà không quá nặng tính diễn giải.
- source_word: אֶל מְעֹנְנִים
  choice: những kẻ xem điềm
  rationale: מְעֹנְנִים chỉ những người tìm chỉ dẫn qua điềm triệu; 'xem điềm' dễ hiểu và không khóa nghĩa vào một kỹ thuật cụ thể.
- source_word: וְאֶל קֹסְמִים
  choice: và những thầy bói
  rationale: קֹסְמִים là những người thực hành bói toán; 'thầy bói' là cách gọi hiện đại, phổ thông.
- source_word: יִשְׁמָעוּ
  choice: vẫn nghe theo
  rationale: Giữ nghĩa cốt lõi 'nghe' đồng thời thể hiện sắc thái tiếp nhận và làm theo trong ngữ cảnh.
- source_word: וְאַתָּה לֹא כֵן
  choice: còn anh em thì ... không ... điều như thế
  rationale: Giữ cấu trúc tương phản và tính tỉnh lược của tiếng Hê-bơ-rơ, nhưng sắp xếp lại cho tự nhiên trong tiếng Việt.
- source_word: נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em, không ban cho anh em
  rationale: Dịch נתן theo nghĩa trực tiếp là 'ban/cho', thay vì chuyển hẳn thành 'cho phép'; dùng Yahweh cho danh riêng יְהוָה.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va / CHÚA
  rationale: Giữ danh giao ước xuất hiện trực tiếp trong bản Hê-bơ-rơ và tránh thay bằng một tước hiệu.
- issue: Tân ngữ bị lược sau נָתַן לְךָ
  choice: không ban cho anh em điều như thế
  alternative: không cho phép anh em làm như vậy
  rationale: Giữ động từ 'ban/cho' của nguyên văn và bổ sung tân ngữ tối thiểu từ ngữ cảnh, không biến câu thành một công thức cấm đoán mạnh hơn nguyên văn.
- issue: Số của đại từ ngôi thứ hai
  choice: anh em
  alternative: ngươi
  rationale: Nguyên văn dùng số ít tập thể để nói với Israel; 'anh em' truyền đạt tự nhiên lời nói hướng đến toàn dân mà không làm câu mang sắc thái cổ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít tập thể nói với Israel; phân biệt “xem điềm” với “bói” để phản ánh hai thuật ngữ khác nhau trong nguyên văn.
