revisions:
- from: Vì các dân tộc mà anh em sắp chiếm đất của họ[a] vẫn nghe theo những kẻ xem điềm[b] và những thầy bói; còn anh em thì Yahweh, Đức Chúa Trời của anh em, không ban cho anh em điều như thế[c].
  to: Vì các dân tộc này, là những dân mà anh em sắp chiếm lấy đất đai của họ[a], nghe theo những kẻ xem điềm[b] và những thầy bói; còn anh em thì Yahweh, Đức Chúa Trời của anh em, không ban cho anh em điều như thế[c].
  rationale: Bản sửa loại bỏ sắc thái “vẫn” không có trong tiếng Hê-bơ-rơ, phục hồi “các dân tộc này”, và diễn đạt ירשׁ bằng cách nêu việc chiếm lấy đất đai của những dân ấy, đồng thời chú thích giữ các khả năng “đuổi đi/chiếm hữu”. Không thay “ban” bằng “cho phép”, nhờ đó vẫn bảo toàn tính tỉnh lược của tân ngữ trong nguyên văn. Các điểm neo chú thích được đặt lại theo các từ hoặc mệnh đề mà chúng giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:17Z'
