base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/013.yaml
  text: You shall be blameless with Yahweh your God[a].
translation:
  language: vi
  text: Ngươi phải sống trọn vẹn với Yahweh, Đức Chúa Trời của ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sống toàn vẹn” hoặc “sống không chỗ trách được” với Yahweh, Đức Chúa Trời của ngươi.'
    reason: Các cách dịch khả dĩ của תָּמִים, có thể nhấn mạnh sự nguyên vẹn, chính trực hoặc không chỗ trách được.
lexical_decisions:
- source_word: תָּמִים
  choice: sống trọn vẹn
  rationale: Từ này diễn tả sự nguyên vẹn, chính trực và lòng trung thành không phân chia. Trong ngữ cảnh đối lập với bói toán và các tập tục bị cấm, “sống trọn vẹn” truyền đạt sự toàn tâm trung tín với Đức Chúa Trời mà không hàm ý con người đạt đến tình trạng tuyệt đối vô tội.
- source_word: תִּהְיֶה
  choice: phải sống
  rationale: Động từ Qal chưa hoàn thành ngôi hai số ít mang lực khuyên truyền hoặc mệnh lệnh. “Phải sống” tự nhiên trong tiếng Việt khi kết hợp với “trọn vẹn,” đồng thời giữ sắc thái đòi hỏi của giao ước.
- source_word: עִם
  choice: với
  rationale: Giữ nghĩa thông thường và trực tiếp của giới từ, diễn tả mối quan hệ với Yahweh; không đổi thành “trước mặt,” vốn sẽ giải thích thêm sắc thái không được nói rõ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp với chứng cứ nguồn và lớp tham khảo đã được kiểm định.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Trong cấu trúc giao ước chỉ Yahweh, danh từ mang nghĩa số ít; hậu tố ngôi hai số ít được thể hiện bằng “của ngươi.”
theological_decisions:
- issue: Ý nghĩa của תָּמִים trong lời kêu gọi trung thành với giao ước
  choice: sống trọn vẹn với Yahweh, theo nghĩa chính trực và không phân lòng
  alternative: không chỗ trách được với Yahweh; toàn tâm với Yahweh
  rationale: Ngữ cảnh Phục Truyền Luật Lệ Ký 18:9–14 kêu gọi Israel không chạy theo bói toán và tà thuật. Bản dịch giữ trường nghĩa về sự toàn vẹn và lòng trung thành, nhưng không biến câu này thành lời khẳng định về sự hoàn hảo tuyệt đối hoặc vô tội.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và dễ hiểu. “Ngươi” giữ ngôi hai số ít của tiếng Hê-bơ-rơ và cách nói trực tiếp mang tính giao ước; “sống trọn vẹn” tự nhiên hơn “là trọn vẹn” trong tiếng Việt hiện đại. Dấu chú thích [a] được đặt ngay sau câu chính.
