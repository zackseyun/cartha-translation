base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: vi
  text: Vì Yahweh, Đức Chúa Trời của anh em, đã chọn người ấy từ tất cả các chi phái của anh em để đứng phụng sự nhân danh Yahweh—người ấy và các con trai mình—mãi mãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là «tất cả các ngày»; đây là thành ngữ chỉ sự tiếp diễn bền lâu của việc phụng sự tư tế.
    reason: Giải thích thành ngữ thời gian, đồng thời bảo lưu cách diễn đạt sát chữ của tiếng Hê-bơ-rơ mà không áp đặt phạm vi thần học vượt quá văn cảnh.
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do cho quy định ở câu trước.
- source_word: בּוֹ בָּחַר
  choice: đã chọn người ấy
  rationale: Với động từ בחר, giới từ ב đánh dấu đối tượng được chọn; cách diễn đạt này tự nhiên trong tiếng Việt và duy trì liên hệ với người Lê-vi ở ngữ cảnh trước.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ nguyên danh giao ước Yahweh; đại từ số ít tiếng Hê-bơ-rơ hướng đến Israel như một cộng đồng, nên dùng “anh em” theo lối xưng hô tập thể tự nhiên trong tiếng Việt.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: từ tất cả các chi phái của anh em
  rationale: Diễn đạt việc lựa chọn từ giữa toàn thể các chi phái Israel.
- source_word: לַעֲמֹד לְשָׁרֵת
  choice: đứng phụng sự
  rationale: Giữ hình ảnh cụ thể “đứng” gắn với việc thi hành chức vụ thánh, đồng thời dùng “phụng sự” để thể hiện bối cảnh tư tế.
- source_word: בְּשֵׁם יְהוָה
  choice: nhân danh Yahweh
  rationale: “Nhân danh” diễn đạt tự nhiên việc phụng sự dưới danh và thẩm quyền của Yahweh.
- source_word: הוּא וּבָנָיו
  choice: người ấy và các con trai mình
  rationale: Giữ rõ giống đực của בָּנָיו và ý niệm kế tục chức vụ tư tế qua các con trai.
- source_word: כָּל הַיָּמִים
  choice: mọi ngày
  rationale: Bám sát hình thức tiếng Hê-bơ-rơ, đồng thời để chú thích nêu sắc thái thời gian kéo dài, liên tục.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng giao ước; giữ “Yahweh” tránh thay danh ấy bằng một tước hiệu.
- issue: Ngôn ngữ về sự kế tục chức tư tế
  choice: các con trai mình
  alternative: con cái mình
  rationale: Nguyên văn dùng danh từ giống đực số nhiều và ngữ cảnh nói đến sự kế tục chức vụ tư tế; không trung tính hóa chi tiết này.
- issue: Phạm vi thời gian của כָּל הַיָּמִים
  choice: mọi ngày
  alternative: mãi mãi / liên tục
  rationale: Giữ cách nói cụ thể của nguyên văn mà không quyết định quá mức liệu trọng tâm là tính vĩnh viễn hay sự phục vụ thường xuyên, lâu dài.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh em” được dùng như đại từ tập thể chỉ Israel; cấu trúc câu được điều chỉnh nhẹ để “người ấy và các con trai mình” gắn rõ với cả hai hành động “đứng” và “phụng sự”.
