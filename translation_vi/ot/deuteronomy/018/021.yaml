  text: וְ/כִ֥י תֹאמַ֖ר בִּ/לְבָבֶ֑/ךָ אֵיכָה֙ נֵדַ֣ע אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: vi
  text: 'Và nếu anh em tự hỏi: “Làm sao chúng ta biết được lời mà Yahweh không phán?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמַר
  choice: Và nếu anh em tự hỏi
  rationale: וְכִי mở đầu một tình huống giả định nối tiếp văn mạch; תֹאמַר là ngôi hai số ít đại diện cho dân Israel. Trong tiếng Việt, “anh em” phù hợp với lời trực tiếp dành cho cộng đồng, còn “tự hỏi” diễn đạt tự nhiên thành ngữ nói trong lòng.
- source_word: בִּלְבָבֶךָ
  choice: tự hỏi
  rationale: Cụm này theo nghĩa đen là “nói trong lòng anh em”, chỉ suy nghĩ hoặc tự nói với mình. Dịch “tự hỏi” giữ đúng chức năng của thành ngữ trong câu hỏi này và tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: אֵיכָה נֵדַע
  choice: Làm sao chúng ta biết được
  rationale: אֵיכָה hỏi về cách thức hoặc phương tiện; נֵדַע là “chúng ta biết”. “Biết được” truyền đạt sắc thái nhận ra hoặc xác định mà không diễn giải quá mức.
- source_word: הַדָּבָר
  choice: lời
  rationale: דָּבָר có thể là lời, sứ điệp, sự việc hoặc điều. Trong ngữ cảnh phân định lời tiên tri, “lời” là lựa chọn ngắn gọn và thích hợp nhất.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: nào ... không phán
  rationale: Mệnh đề quan hệ xác định lời không do Đức Giê-hô-va phán. Cấu trúc “lời nào ... không phán” tự nhiên trong câu hỏi tiếng Việt và không áp đặt sắc thái thời quá khứ không có trong ngữ cảnh.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ đây là danh riêng của Đức Chúa Trời. “Đức Giê-hô-va” là dạng trang trọng, dễ nhận biết đối với độc giả Kinh Thánh tiếng Việt; không thay danh bằng tước hiệu “CHÚA”.
- issue: Người nói trong câu hỏi
  choice: anh em ... chúng ta
  alternative: ngươi ... chúng ta; bạn ... chúng ta
  rationale: Tiếng Hê-bơ-rơ dùng ngôi hai số ít để nói với Israel như một tập thể, rồi dùng ngôi một số nhiều trong câu hỏi. “Anh em” giữ lời trực tiếp hướng đến cộng đồng mà vẫn tự nhiên, trang trọng trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm. Dùng “tự hỏi” thay cho lối dịch sát “nói trong lòng” vì đây là thành ngữ chỉ suy nghĩ nội tâm; câu vẫn giữ nguyên câu hỏi về cách nhận biết lời không đến từ Đức Giê-hô-va.
