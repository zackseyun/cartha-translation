    rationale: הַדָּבָר là danh từ có mạo từ xác định, được mệnh đề quan hệ אֲשֶׁר לֹא דִבְּרוֹ יְהוָה bổ nghĩa. Tiếng Việt “lời mà Yahweh không phán” phản ánh quan hệ này trực tiếp hơn.
