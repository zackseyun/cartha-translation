language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: vi
  text: Khi nhà tiên tri nhân danh Yahweh nói mà điều ấy không xảy ra hoặc không thành, thì đó là điều Yahweh không phán. Nhà tiên tri đã nói điều ấy một cách ngạo mạn[a]; anh em không được sợ người đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Một cách ngạo mạn” chỉ việc cả gan, cố ý nói mà không được Yahweh trao thẩm quyền.
    reason: cultural_note
lexical_decisions:
- source_word: יְדַבֵּר
  choice: nói
  rationale: Thì chưa hoàn thành trong điều khoản nêu trường hợp pháp lý được diễn đạt tự nhiên bằng “mà nói”; cách này cũng giữ liên hệ với דִבְּרוֹ ở vế sau.
- source_word: הַנָּבִיא
  choice: vị tiên tri
  rationale: Giữ sắc thái xác định của mạo từ Hê-bơ-rơ trong một trường hợp mang tính đại diện; “vị” tạo văn phong trang trọng, tự nhiên.
- source_word: בְּשֵׁם יְהוָה
  choice: nhân danh Yahweh
  rationale: “Nhân danh” diễn đạt tự nhiên việc tuyên bố dưới thẩm quyền được cho là của Đức Chúa Trời; tên riêng יהוה được phiên âm là Yahweh.
- source_word: הַדָּבָר
  choice: lời ấy / lời
  rationale: דָּבָר ở đây vừa là lời tiên báo vừa là nội dung được trông đợi sẽ thành sự thật. Tiếng Việt dùng “lời” tự nhiên hơn “sự việc” và vẫn duy trì mạch liên kết giữa lời nói với sự ứng nghiệm.
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: không xảy ra, cũng không ứng nghiệm
  rationale: 'Giữ hai động từ song đôi: יִהְיֶה nói đến việc xảy ra, còn יָבֹא trong ngữ cảnh lời tiên báo được diễn đạt rõ bằng “ứng nghiệm”.'
- source_word: בְּזָדוֹן
  choice: tự phụ
  rationale: Diễn đạt sự ngạo mạn, cố ý vượt quyền khi nói mà không được Yahweh sai phán, chứ không chỉ là nhầm lẫn vô ý.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: anh em không được sợ người đó
  rationale: Giữ lực cấm đoán của לֹא với động từ diễn tả sợ hãi hoặc bị người ấy uy hiếp; “người đó” rõ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va / CHÚA
  rationale: Giữ danh riêng trong nguyên văn thay vì thay bằng một tước hiệu.
- issue: Phép thử lời tiên tri
  choice: 'Chỉ nêu phép thử cụ thể trong câu: lời được nhân danh Yahweh nhưng không xảy ra hay ứng nghiệm thì không do Yahweh phán'
  alternative: Mở rộng thành một học thuyết bao quát mọi dạng tiên tri
  rationale: Bản dịch giữ đúng phạm vi pháp lý và nội dung trực tiếp của câu, không thêm những khẳng định thần học ngoài nguyên văn.
- issue: Sắc thái của בְּזָדוֹן
  choice: tự phụ mà nói
  alternative: nói cách ngạo mạn / nói càn
  rationale: “Tự phụ” giữ ý cố ý vượt thẩm quyền mà không biến câu thành lời miệt thị hoặc thu hẹp nó vào thái độ bề ngoài.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ cấu trúc điều kiện và sự lặp lại của דָּבָר ở mức tự nhiên; dùng “lời” vì trong ngữ cảnh này thuật ngữ vừa chỉ sứ điệp được nói ra vừa chỉ nội dung phải ứng nghiệm.
