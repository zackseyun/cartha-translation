  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י הֵיטִ֖יבוּ אֲשֶׁ֥ר דִּבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: vi
  text: 'Yahweh phán với tôi: “Họ đã nói phải.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn, sát chữ: “Họ đã làm tốt điều họ đã nói.”'
    reason: Bảo lưu cấu trúc của הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ; trong chính văn, thành ngữ được diễn đạt tự nhiên là “Họ đã nói phải.”
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ אמר trong mạch kể chuyện giới thiệu lời trực tiếp của Đức Chúa Trời. “Phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi chủ thể là Yahweh; quan hệ tiếp nối của וַ־ được thể hiện đủ qua trình tự câu, không nhất thiết phải thêm “và”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng danh bốn phụ âm יהוה, thay vì thay bằng một tước hiệu.
- source_word: אֵלָי
  choice: với tôi
  rationale: Giới từ אֶל kèm hậu tố ngôi thứ nhất số ít có nghĩa là “với tôi/đến tôi”; trong kết cấu “phán với tôi”, “với tôi” là tiếng Việt tự nhiên.
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: Điều họ nói thật phải lắm
  rationale: הֵיטִיבוּ đánh giá tích cực điều họ đã nói, còn אֲשֶׁר דִּבֵּרוּ nêu chính nội dung được đánh giá. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ ý Yahweh xác nhận lời họ là đúng/thích đáng; chú thích bảo lưu cấu trúc sát chữ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” bảo tồn tư cách danh riêng và không thay nó bằng một tước hiệu.
- issue: Mức độ tán thành trong הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: Điều họ nói thật phải lắm
  alternative: Họ đã làm tốt điều họ nói
  rationale: Cấu trúc Híp-ri có thể được giữ sát chữ là “làm tốt điều đã nói”, nhưng trong ngữ cảnh nó đánh giá lời nói của dân. “Nói phải lắm” truyền đạt sự tán thành mà không diễn giải thêm nội dung thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời của Yahweh; tránh lối dịch cổ như “bèn phán” hoặc cấu trúc sát chữ thiếu tự nhiên.
