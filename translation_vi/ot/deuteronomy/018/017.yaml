    rationale: הֵיטִיבוּ đánh giá điều họ nói là tốt/phải đáng, nhưng không có yếu tố từ vựng tương đương trực tiếp với “thật” hoặc “lắm”. Bỏ các yếu tố này giúp giữ độ mở và mức độ của nguyên văn.
  - severity: low
    issue: Chính văn danh từ hóa chủ ngữ thành “Điều họ nói”.
    rationale: Không sai nghĩa, nhưng nguyên văn nói trực tiếp về “họ” (số nhiều) và hành động nói của họ. “Họ đã nói phải” gần cấu trúc và ngắn gọn tự nhiên hơn.
  revised_text: 'Yahweh phán với tôi: “Họ đã nói phải.”[a]'
