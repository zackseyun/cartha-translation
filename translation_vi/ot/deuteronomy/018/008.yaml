base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/008.yaml
  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: vi
  text: Họ sẽ ăn những phần bằng nhau, ngoài khoản thu từ việc bán gia sản tổ tiên của người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm cuối trong tiếng Hê-bơ-rơ khó hiểu; cũng có thể dịch: “ngoài những gì người ấy nhận được do bán tài sản gia đình”, hoặc hiểu rộng hơn là khoản thu nhập gắn với nhà tổ tiên của người ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: những phần bằng nhau
  rationale: Thành ngữ lặp “phần như phần” diễn tả sự ngang bằng trong việc phân chia; cách dịch này tự nhiên trong tiếng Việt và giữ rõ ý phân phối đồng đều.
- source_word: יֹאכֵלוּ
  choice: sẽ được ăn
  rationale: Giữ hình ảnh cụ thể của động từ “ăn”, đồng thời từ “được” diễn đạt tự nhiên quyền hưởng các phần dành cho người phục vụ tại nơi thánh.
- source_word: לְבַד
  choice: ngoài
  rationale: Diễn tả khoản riêng biệt hoặc bổ sung bên cạnh phần được chia đều.
- source_word: מִמְכָּרָיו
  choice: khoản thu từ việc bán
  rationale: Danh từ có thể chỉ việc bán hoặc thứ thu được từ việc bán; “khoản thu từ việc bán” phù hợp với ngữ cảnh tài sản riêng nhưng không khẳng định quá mức bản chất chính xác của khoản này.
- source_word: עַל הָאָבוֹת
  choice: gia sản tổ tiên của người ấy
  rationale: Cụm Hê-bơ-rơ cô đọng, nghĩa đen liên hệ đến “các tổ phụ”; trong ngữ cảnh, nhiều khả năng chỉ tài sản hoặc quyền lợi gắn với dòng họ. Bản dịch nêu nghĩa khả dĩ nhất, còn chú thích bảo lưu sự không chắc chắn.
theological_decisions:
- issue: Cách hiểu cụm מִמְכָּרָיו עַל הָאָבוֹת
  choice: Chỉ khoản thu riêng từ việc bán gia sản gắn với tổ tiên hoặc dòng họ, ngoài phần được chia đều.
  alternative: Có thể chỉ những gì người ấy nhận được do bán tài sản gia đình, hoặc rộng hơn là thu nhập/quyền lợi liên quan đến nhà tổ tiên.
  rationale: Cú pháp Hê-bơ-rơ rất cô đọng và khó xác định. Cách dịch chính phù hợp với mạch văn về phần cấp dưỡng dành cho người Lê-vi, nhưng chú thích giữ lại các khả năng khác thay vì giải quyết dứt khoát sự mơ hồ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ động từ cụ thể “ăn”, dùng “những phần bằng nhau” để truyền đạt thành ngữ phân phối, và đặt chú thích ngay sau mệnh đề khó nhằm bảo lưu sự mơ hồ của nguyên văn.
