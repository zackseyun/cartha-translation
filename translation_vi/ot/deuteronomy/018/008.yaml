  source_fidelity: Bản dịch phản ánh đúng thành ngữ חֵלֶק כְּחֵלֶק là các phần bằng nhau và giữ được ý bổ sung của לְבַד. Mệnh đề cuối khó hiểu đã được diễn đạt theo cách hiểu khả dĩ về thu nhập từ sản nghiệp tổ tiên và được bảo lưu bằng chú thích. Tuy nhiên, “sẽ được ăn” thêm sắc thái bị động/quyền được cấp mà động từ יֹאכֵלוּ không nêu trực tiếp; dạng chủ động sẽ sát nguyên ngữ hơn.
