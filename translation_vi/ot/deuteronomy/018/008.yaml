  terminology: “Những phần bằng nhau” truyền đạt tốt ý chia phần đồng đều. “Gia sản tổ tiên” là một cách hiểu hợp lý nhưng không chắc chắn của cụm cuối; chú thích hiện có thích đáng để không biến cách hiểu này thành khẳng định tuyệt đối.
