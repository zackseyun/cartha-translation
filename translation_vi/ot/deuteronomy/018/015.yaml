base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: vi
  text: Giê-hô-va, Đức Chúa Trời của anh em, sẽ dấy lên cho anh em một nhà tiên tri từ giữa anh em, từ giữa đồng bào của anh em, như tôi[a]. Anh em phải nghe người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ giữa ngươi, từ các anh em của ngươi, như tôi”. Từ được dịch là “anh em” là một từ thân tộc giống đực; trong văn cảnh này, nó chỉ những người cùng dân Israel nói chung. Phần đầu câu dùng đại từ số ít khi nói với Israel như một tập thể, còn mệnh lệnh “phải nghe” ở số nhiều. Trong Tân Ước, câu này được áp dụng cho Đấng Mê-si (Công Vụ 3:22; 7:37); tuy nhiên, tiếng Hê-bơ-rơ tại đây chỉ nói “một nhà tiên tri ... như tôi”.'
    reason: lexical_and_grammatical_clarification_and_cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: một nhà tiên tri
  rationale: Danh từ số ít không có mạo từ được diễn đạt tự nhiên bằng “một nhà tiên tri”, giữ nguyên tính chưa xác định của tiếng Hê-bơ-rơ.
- source_word: מִקִּרְבְּךָ
  choice: từ giữa anh em
  rationale: Phản ánh sát nghĩa “từ giữa/ngay trong ngươi”, cho thấy nhà tiên tri xuất thân từ chính cộng đồng Israel.
- source_word: מֵאַחֶיךָ
  choice: từ trong anh em đồng bào
  rationale: אָח ở số nhiều giống đực có nghĩa đen là “anh em”, nhưng trong văn cảnh Phục Truyền chỉ những người cùng dân Israel. “Anh em đồng bào” vừa giữ hình ảnh thân tộc vừa truyền đạt rõ phạm vi cộng đồng.
- source_word: כָּמֹנִי
  choice: giống như tôi
  rationale: Giữ nguyên phép so sánh trực tiếp với Môi-se, không thêm nội dung về căn tính của nhà tiên tri.
- source_word: יָקִים לְךָ
  choice: sẽ dấy lên cho anh em
  rationale: Động từ Hiphil của קום có nghĩa dấy lên hoặc thiết lập; “dấy lên” giữ được hình ảnh của nguyên ngữ và “cho anh em” thể hiện sắc thái thụ hưởng của לְךָ.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Giê-hô-va, Đức Chúa Trời của anh em
  rationale: Dùng danh xưng riêng quen thuộc trong tiếng Việt cho יהוה và diễn đạt quan hệ giao ước trong cụm “Đức Chúa Trời của anh em”.
- source_word: אֵלָיו תִּשְׁמָעוּן
  choice: Anh em phải nghe lời người ấy
  rationale: שׁמע ở đây mang lực mệnh lệnh là chú ý và thuận theo lời nhà tiên tri. “Nghe lời” tự nhiên hơn “nghe người ấy” trong tiếng Việt nhưng không diễn giải quá mức thành một thuật ngữ thần học riêng.
theological_decisions:
- issue: Tính xác định và ý nghĩa về Đấng Mê-si của “một nhà tiên tri giống như tôi”
  choice: Giữ cách nói không xác định “một nhà tiên tri giống như tôi” trong chính văn.
  alternative: Dịch xác định là “Đấng Tiên Tri” hoặc diễn giải trực tiếp là Đấng Mê-si.
  rationale: Bản Hê-bơ-rơ chỉ nói נָבִיא כָּמֹנִי, không có mạo từ và không nêu đích danh Đấng Mê-si. Tân Ước về sau áp dụng câu này cho Đấng Christ, nhưng không nên đưa sự nhận diện đó vào chính văn Cựu Ước.
- issue: Phạm vi của מֵאַחֶיךָ (“từ anh em của ngươi”)
  choice: Dịch “từ trong anh em đồng bào” và chú thích nghĩa đen.
  alternative: Giữ hoàn toàn theo hình thức là “từ các anh em của anh em” hoặc mở rộng thành “từ anh chị em”.
  rationale: Trong văn cảnh này, danh từ thân tộc giống đực chỉ người cùng dân Israel nói chung. Cách dịch đã chọn truyền đạt nghĩa cộng đồng mà không đưa một công thức bao hàm giới tính vốn không hiện diện trong nguyên ngữ.
- issue: Sự chuyển đổi số của đại từ xưng hô
  choice: Dùng “anh em” tự nhiên trong chính văn và ghi chú sự chuyển từ số ít sang số nhiều trong nguyên ngữ.
  alternative: Dùng “ngươi” ở phần đầu rồi chuyển sang “các ngươi” ở mệnh lệnh cuối.
  rationale: Tiếng Hê-bơ-rơ nói với Israel như một tập thể ở số ít trong phần lớn câu, rồi dùng số nhiều ở תִּשְׁמָעוּן. “Anh em” là cách xưng hô hiện đại, trang trọng và có thể chỉ cả cộng đồng; chú thích bảo tồn nét ngữ pháp đáng chú ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nhà tiên tri”, “dấy lên” và “nghe lời” là các cách diễn đạt quen thuộc nhưng không quá cổ. Đại từ “anh em” tránh sắc thái cổ của “ngươi/các ngươi”; chú thích nêu rõ sự phân biệt số ít–số nhiều trong nguyên ngữ.
