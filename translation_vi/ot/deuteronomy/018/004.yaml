  text: רֵאשִׁ֨ית דְּגָֽנְ/ךָ֜ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ וְ/רֵאשִׁ֛ית גֵּ֥ז צֹאנְ/ךָ֖ תִּתֶּן לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: vi
  text: Anh em phải trao cho người ấy phần đầu mùa của ngũ cốc, rượu mới[b] và dầu của anh em[a], cùng phần lông xén đầu tiên của đàn chiên dê[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phần đầu tiên của ngũ cốc, rượu và dầu của anh em.”'
    reason: lexical_alternative
  - marker: b
    text: “Rượu mới” dịch một từ Hê-bơ-rơ thường dùng cho rượu mới sản xuất.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “phần đầu tiên của lần xén lông đàn chiên dê.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: phần đầu mùa / phần đầu tiên
  rationale: Từ này chỉ phần có trước hoặc phần mở đầu. Với nông sản, “phần đầu mùa” diễn đạt tự nhiên ý phần lấy từ sản vật đầu tiên; với lông xén, “phần đầu tiên” phù hợp hơn trong tiếng Việt và vẫn giữ sự lặp ý của tiếng Hê-bơ-rơ.
- source_word: דָּגָן
  choice: ngũ cốc
  rationale: Chỉ chung các loại hạt lương thực, nên “ngũ cốc” chính xác và tự nhiên hơn một tên cây lương thực riêng lẻ.
- source_word: תִּירוֹשׁ
  choice: rượu mới
  rationale: Thường chỉ rượu mới sản xuất hoặc nước nho đang ở giai đoạn đầu, vì vậy “rượu mới” giữ được nét nghĩa riêng mà không xác định quá mức quá trình lên men.
- source_word: יִצְהָר
  choice: dầu
  rationale: Từ này thường nói đến dầu mới, trong bối cảnh Y-sơ-ra-ên thường là dầu ô-liu. Bản văn chỉ nói “dầu”, nên không thêm “ô-liu” vào chính văn.
- source_word: גֵּז
  choice: lông xén
  rationale: Có thể chỉ lông đã xén hoặc sản phẩm của việc xén. “Lông xén” nêu rõ vật được đem trao mà vẫn để chú thích ghi nhận cách hiểu theo hành động xén lông.
- source_word: צֹאן
  choice: đàn chiên dê
  rationale: Đây là danh từ tập hợp chỉ gia súc nhỏ, nhất là chiên và dê. “Đàn chiên dê” giữ phạm vi nghĩa rộng hơn “bầy chiên”.
- source_word: תִּתֶּן לוֹ
  choice: Anh em phải trao cho người ấy
  rationale: Dạng động từ mang lực quy định pháp lý. “Phải trao” tự nhiên trong tiếng Việt hiện đại; “người ấy” giữ đại từ chỉ người nhận mà không xác định thêm ngoài văn cảnh.
theological_decisions:
- issue: Đối tượng của đại từ לוֹ (“cho người ấy”)
  choice: Giữ cách nói “người ấy”, để văn cảnh xác định đó là thầy tế lễ/người Lê-vi nhận lễ vật.
  alternative: Nói rõ “cho thầy tế lễ” hoặc hiểu số ít là đại diện cho toàn thể hàng tư tế.
  rationale: Tiếng Hê-bơ-rơ dùng đại từ số ít, còn văn cảnh trước đó xác định người nhận. Giữ đại từ tránh diễn giải quá mức nhưng vẫn rõ khi đọc trong đoạn văn.
- issue: Tính chất của רֵאשִׁית trong các sản vật
  choice: Dịch là “phần đầu mùa”, nhấn mạnh thứ tự ưu tiên mà không mặc nhiên đồng nhất với một thuật ngữ nghi lễ chuyên biệt hơn.
  alternative: Dịch là “hoa lợi đầu mùa”, “phần tốt nhất” hoặc “phần đầu tiên”.
  rationale: Từ nguồn có thể chỉ phần đầu, phần mở đầu hay phần ưu tiên; bản văn không trực tiếp dùng một từ mang nghĩa “tốt nhất”. Cách dịch được chọn bảo toàn nét nghĩa thời điểm/thứ tự và sự căng giữa phần đầu với phần dâng hiến.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. “Anh em” được dùng theo nghĩa tập thể để nói với dân Y-sơ-ra-ên, tránh sắc thái cổ của “ngươi”; các sở hữu ngữ được sắp xếp lại cho tự nhiên trong tiếng Việt. Mọi dấu chú thích [a], [b], [c] đều đặt ngay tại cụm từ liên quan.
