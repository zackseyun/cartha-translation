    rationale: Tiếng Hê-bơ-rơ đặt רֵאשִׁית trước “ngũ cốc, rượu mới và dầu,” nên cách tiếng Việt nên cho thấy rõ phần đầu áp dụng cho cả ba sản vật.
  - severity: medium
    issue: Cụm “phần đầu tiên trong số lông xén” không tự nhiên
    rationale: Cụm này khó hiểu trong tiếng Việt và không diễn đạt gọn ý גֵּז צֹאנְךָ là lông xén/fleece từ đàn gia súc nhỏ của người nghe.
