  terminology: “Giê-hô-va, Đức Chúa Trời” nhất quán cho יהוה אֱלֹהִים và bảo toàn sự lặp lại danh riêng trong nguyên văn. “Kẻo tôi chết” diễn đạt thích đáng mệnh đề kết quả/mục đích trong ngữ cảnh.
  issues:
