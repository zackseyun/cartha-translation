  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của câu: sự kiện xin tại Hô-rếp trong ngày hội họp, tiếng của Giê-hô-va/Đức Chúa Trời, lửa lớn, và nỗi sợ chết. Tuy nhiên, động từ שָׁאַלְתָּ và hậu tố của אֱלֹהֶיךָ đều là số ít; chuyển thành “anh em” làm mất số ít tập thể của nguyên văn.'
