  text: כְּ/כֹ֨ל אֲשֶׁר שָׁאַ֜לְתָּ מֵ/עִ֨ם יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/חֹרֵ֔ב בְּ/י֥וֹם הַ/קָּהָ֖ל לֵ/אמֹ֑ר לֹ֣א אֹסֵ֗ף לִ/שְׁמֹ֨עַ֙ אֶת קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י וְ/אֶת הָ/אֵ֨שׁ הַ/גְּדֹלָ֥ה הַ/זֹּ֛את לֹֽא אֶרְאֶ֥ה ע֖וֹד וְ/לֹ֥א אָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: vi
  text: 'đúng như điều ngươi đã cầu xin Giê-hô-va, Đức Chúa Trời của ngươi, tại Hô-rếp trong ngày hội họp, rằng: “Xin đừng để tôi tiếp tục nghe tiếng Giê-hô-va, Đức Chúa Trời của tôi, và cũng đừng để tôi thấy ngọn lửa lớn này nữa, kẻo tôi chết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ מֵעִם
  choice: đúng như điều anh em đã cầu xin ...
  rationale: Diễn đạt tự nhiên cấu trúc so sánh và động từ שׁאל với מֵעִם; trong ngữ cảnh, chủ thể số ít đại diện cho toàn dân nên dùng “anh em” theo lối xưng hô cộng đồng.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Chuyển âm danh riêng của Đức Chúa Trời, phân biệt với tước hiệu אֱלֹהִים và giữ sự lặp lại có chủ ý trong câu.
- source_word: בְּיוֹם הַקָּהָל
  choice: trong ngày hội họp
  rationale: הַקָּהָל chỉ cuộc tập hợp của cộng đồng; cách dịch này giữ nghĩa sự kiện mà không áp đặt một thuật ngữ giáo hội.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: Xin đừng để tôi tiếp tục nghe
  rationale: אֹסֵף với động từ nguyên mẫu mang nghĩa tiếp tục/lại làm; lời cầu xin phủ định được diễn đạt tự nhiên trong tiếng Việt.
- source_word: וְלֹא אָמוּת
  choice: kẻo tôi chết
  rationale: Trong mạch lời nói, liên từ וְ sau hai mệnh đề phủ định diễn tả hậu quả người nói muốn tránh; “kẻo” truyền đạt đúng quan hệ ngữ dụng.
theological_decisions:
- issue: Cách thể hiện danh thánh יהוה
  choice: Giê-hô-va
  alternative: CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה hai lần bên cạnh אֱלֹהִים; chuyển âm bảo toàn sự phân biệt từ vựng và không đưa thêm lập trường hệ phái.
- issue: Số của đại từ chỉ dân chúng
  choice: anh em ... tôi
  alternative: ngươi ... tôi
  rationale: שָׁאַלְתָּ và hậu tố “của anh em” ở số ít tập thể, còn lời trích dùng ngôi thứ nhất số ít như tiếng nói đại diện của dân. “Anh em” tự nhiên hơn trong tiếng Việt hiện đại mà vẫn giữ sự chuyển ngôi.
- issue: Quan hệ của mệnh đề cuối וְלֹא אָמוּת
  choice: kẻo tôi chết
  alternative: và tôi sẽ không chết
  rationale: Giữ cách hiểu theo mục đích/hậu quả phù hợp ngữ cảnh nỗi sợ chết trước thần hiện, nhưng không mở rộng nội dung vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ địa danh Hô-rếp, lời nói trực tiếp, sự lặp lại danh Đức Chúa Trời và cường độ của “ngọn lửa lớn này”.
