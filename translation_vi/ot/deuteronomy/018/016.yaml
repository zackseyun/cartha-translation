revisions:
- from: 'đúng như điều anh em đã cầu xin Giê-hô-va, Đức Chúa Trời của anh em, tại Hô-rếp trong ngày hội họp, rằng: “Xin đừng để tôi tiếp tục nghe tiếng Giê-hô-va, Đức Chúa Trời của tôi, và cũng đừng để tôi thấy ngọn lửa lớn này nữa, kẻo tôi chết.”'
  to: 'đúng như điều ngươi đã cầu xin Giê-hô-va, Đức Chúa Trời của ngươi, tại Hô-rếp trong ngày hội họp, rằng: “Xin đừng để tôi tiếp tục nghe tiếng Giê-hô-va, Đức Chúa Trời của tôi, và cũng đừng để tôi thấy ngọn lửa lớn này nữa, kẻo tôi chết.”'
  rationale: Chỉ thay “anh em” bằng “ngươi” ở cả hai vị trí để phản ánh số ít tập thể của tiếng Hê-bơ-rơ. Các lựa chọn còn lại có thể giữ nguyên vì trung thành với nguồn và tự nhiên trong tiếng Việt hiện đại trang trọng.
