revisions:
- from: Giữa anh em không được có ai làm cho con trai hay con gái mình đi qua lửa[a], xem bói, đoán vận[b], giải điềm[c], hoặc làm phép thuật[d].
  to: Không được có ai giữa anh em làm cho con trai hay con gái mình đi qua lửa[a], xem bói, đoán vận mệnh[b], giải điềm[c], hoặc làm phù phép[d].
  rationale: Bản sửa chỉ thay những cách diễn đạt dễ gây lệch nghĩa hoặc kém tự nhiên. Thành ngữ trung tâm về việc “đi qua lửa” được giữ nguyên trong chính văn; các khả năng diễn giải cụ thể tiếp tục được đặt trong chú thích. “Làm phù phép” phân biệt rõ hơn với ảo thuật/phép thuật hư cấu và phù hợp với ngữ cảnh liệt kê các thực hành bói thuật.
  reviewer_model: gpt-5.6-terra
