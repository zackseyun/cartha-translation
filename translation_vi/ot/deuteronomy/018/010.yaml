source:
  edition: WLC
  text: לֹֽא יִמָּצֵ֣א בְ/ךָ֔ מַעֲבִ֥יר בְּנֽ/וֹ וּ/בִתּ֖/וֹ בָּ/אֵ֑שׁ קֹסֵ֣ם קְסָמִ֔ים מְעוֹנֵ֥ן וּ/מְנַחֵ֖שׁ וּ/מְכַשֵּֽׁף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: vi
  text: Không được có ai giữa anh em làm cho con trai hay con gái mình đi qua lửa[a], xem bói, đoán vận mệnh[b], giải điềm[c], hoặc làm phù phép[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thiêu con trai hay con gái mình trong lửa” hoặc “dâng con trai hay con gái mình trong lửa”. Tiếng Hê-bơ-rơ nói sát nghĩa là “làm cho con trai hay con gái mình đi qua lửa”.
    reason: alternative_reading
  - marker: b
    text: Từ Hê-bơ-rơ này khó xác định chính xác; cũng có thể dịch là “thầy chiêm đoán” hoặc “người xem thời vận”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “đoán qua điềm báo”.
    reason: lexical_alternative
  - marker: d
    text: Cũng có thể dịch là “thực hành tà thuật”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: Giữa anh em không được có
  rationale: Thể Niphal với phủ định diễn đạt lệnh cấm trong cộng đồng giao ước. “Giữa anh em” chuyển tải tự nhiên giới từ בְךָ với đại từ số ít mang nghĩa tập thể.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: ai làm cho con trai hay con gái mình đi qua lửa
  rationale: Giữ sát cấu trúc Hiphil “làm cho đi qua” và thành ngữ Hê-bơ-rơ, không xác định quá mức nghi thức liên quan đến trẻ em và lửa.
- source_word: קֹסֵם קְסָמִים
  choice: xem bói
  rationale: Phân từ cùng túc từ đồng căn chỉ việc thực hành bói toán; “xem bói” là cách nói hiện đại, rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: מְעוֹנֵן
  choice: đoán vận
  rationale: Đây là từ khó, có nhiều cách hiểu. “Đoán vận” diễn đạt một hoạt động huyền thuật dự đoán thời vận nhưng vẫn phân biệt tương đối với bói toán nói chung và giải điềm.
- source_word: מְנַחֵשׁ
  choice: giải điềm
  rationale: Động từ liên quan đến việc suy đoán qua dấu hiệu hoặc điềm báo; “giải điềm” ngắn gọn, dễ hiểu và phân biệt với קֹסֵם קְסָמִים.
- source_word: מְכַשֵּׁף
  choice: làm phép thuật
  rationale: Phân từ Piel chỉ người thực hành ma thuật. Cách dịch này tự nhiên trong chuỗi hành động và tránh những liên tưởng văn hóa quá hẹp của một số thuật ngữ khác.
theological_decisions:
- issue: Bản chất của lệnh cấm liên quan đến con cái và lửa
  choice: Giữ thành ngữ “làm cho con trai hay con gái mình đi qua lửa” trong chính văn.
  alternative: “thiêu con trai hay con gái mình trong lửa” hoặc “dâng con trai hay con gái mình trong lửa”
  rationale: Ngữ cảnh lên án một nghi thức ngoại giáo liên quan đến trẻ em và lửa, nhưng câu Hê-bơ-rơ chỉ nói theo thành ngữ “làm cho đi qua lửa”. Giữ nguyên độ mở này tránh khẳng định chi tiết mà riêng câu này không nói rõ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng các động từ quen thuộc với độc giả phổ thông. Đại từ “anh em” phản ánh lời Môi-se nói với cộng đồng Y-sơ-ra-ên; “mình” không xác định giới tính quá mức dù danh từ chỉ con cái trong nguyên văn đi với ngôi nam số ít.
