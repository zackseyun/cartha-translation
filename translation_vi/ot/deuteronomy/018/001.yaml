    rationale: “Ngài” trong tiếng Việt quy chiếu dứt khoát về Yahweh, trong khi hậu tố số ít tiếng Hê-bơ-rơ còn có thể chỉ Lê-vi như một tập thể; câu 18:2 đặc biệt hỗ trợ việc không đóng khung quy chiếu này. Chú thích hiện có ghi nhận khả năng thay thế nhưng chính văn vẫn áp đặt một cách hiểu tranh luận.
