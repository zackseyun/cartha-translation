source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: vi
  text: Các thầy tế lễ người Lê-vi—tức toàn thể chi tộc Lê-vi—sẽ không có phần hay cơ nghiệp chung với Y-sơ-ra-ên. Họ sẽ ăn các lễ vật dâng bằng lửa cho Yahweh[a], tức là cơ nghiệp của người ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các hỏa lễ dâng cho Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Hậu tố số ít trong tiếng Hê-bơ-rơ có thể chỉ Yahweh, hoặc chỉ Lê-vi được hiểu như một tập thể. So sánh câu 2, nơi Yahweh được gọi là cơ nghiệp của họ.
    reason: textual_ambiguity
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: các thầy tế lễ thuộc dòng Lê-vi
  rationale: Cách diễn đạt này giữ quan hệ đồng vị giữa “các thầy tế lễ” và “người Lê-vi”, đồng thời tự nhiên trong tiếng Việt và không biến họ thành hai nhóm tách biệt.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: tức toàn thể chi tộc Lê-vi
  rationale: “Toàn thể” bảo toàn phạm vi nhấn mạnh của כָּל; “tức” thể hiện lực đồng vị của cụm từ, còn dấu gạch ngang giúp câu luật định rõ ràng.
- source_word: חֵלֶק וְנַחֲלָה
  choice: phần hay cơ nghiệp
  rationale: Hai danh từ gần nghĩa chỉ phần được phân chia và quyền thừa hưởng đất đai. “Hay” truyền đạt sự phủ định bao quát trong tiếng Việt tự nhiên mà không làm mất cặp thuật ngữ.
- source_word: עִם יִשְׂרָאֵל
  choice: chung với Y-sơ-ra-ên
  rationale: “Chung với” nêu rõ việc người Lê-vi không nhận phần đất cùng các chi tộc còn lại, phù hợp ý nghĩa của עִם trong ngữ cảnh.
- source_word: אִשֵּׁי יְהוָה
  choice: các lễ vật dâng bằng lửa cho Yahweh
  rationale: אִשִּׁים thuộc ngôn ngữ tế lễ và chỉ các lễ vật được dâng bằng lửa. Bản dịch giữ hình ảnh lửa của từ Hê-bơ-rơ thay vì khái quát hóa thành “lương thực”, đồng thời dùng danh riêng Yahweh cho יהוה.
- source_word: וְנַחֲלָתוֹ
  choice: và cơ nghiệp của Ngài
  rationale: Giữ nguyên liên từ וְ (“và”) và hậu tố ngôi ba số ít. Trong cú pháp trực tiếp, “Ngài” tự nhiên quy chiếu về Yahweh, nhưng chú thích bảo lưu khả năng hiểu hậu tố là chỉ Lê-vi theo nghĩa tập thể.
- source_word: יֹאכֵלוּן
  choice: họ sẽ ăn
  rationale: Thể chưa hoàn thành trong văn cảnh luật định diễn tả sự cung ứng thường xuyên hoặc có tính quy định; “sẽ ăn” vừa sát cấu trúc vừa rõ nghĩa.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Văn bản dùng trực tiếp danh giao ước יהוה; “Yahweh” chuyển âm danh riêng và tránh thay thế bằng một tước hiệu.
- issue: Mối quan hệ giữa אִשֵּׁי יְהוָה và וְנַחֲלָתוֹ
  choice: hai thành phần nối bằng “và”
  alternative: 'hiểu thành phần sau như lời giải thích: “tức là cơ nghiệp của Ngài”'
  rationale: Bản Hê-bơ-rơ có liên từ וְ và không có dấu hiệu rõ buộc phải coi vế sau là đồng vị giải thích. Giữ “và” bảo toàn sự căng thẳng và khả năng diễn giải của nguyên văn.
- issue: Chủ thể được hậu tố số ít trong נַחֲלָתוֹ quy chiếu đến
  choice: Yahweh trong chính văn
  alternative: Lê-vi được hiểu như một tập thể số ít
  rationale: Danh từ giống đực số ít gần nhất là יהוה, nên “của Ngài” là cách đọc cú pháp trực tiếp. Tuy nhiên, Lê-vi có thể được nhân cách hóa như một tập thể, và câu 2 gọi Yahweh là cơ nghiệp của họ; vì vậy phương án này được ghi nhận trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong luật định, trang trọng nhưng hiện đại. Dùng “thầy tế lễ”, “chi tộc”, “cơ nghiệp” vì đây là các thuật ngữ Kinh Thánh quen thuộc và vẫn dễ hiểu. Dấu gạch ngang làm sáng tỏ cụm đồng vị dài. Mọi dấu chú thích [a], [b] đều xuất hiện ngay tại nội dung liên quan.
