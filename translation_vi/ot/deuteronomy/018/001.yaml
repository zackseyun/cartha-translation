revisions:
- from: Các thầy tế lễ thuộc dòng Lê-vi—tức toàn thể chi tộc Lê-vi—sẽ không có phần hay cơ nghiệp chung với Y-sơ-ra-ên. Họ sẽ ăn các lễ vật dâng bằng lửa cho Yahweh[a] và cơ nghiệp của Ngài.[b]
  to: Các thầy tế lễ người Lê-vi—tức toàn thể chi tộc Lê-vi—sẽ không có phần hay cơ nghiệp chung với Y-sơ-ra-ên. Họ sẽ ăn các lễ vật dâng bằng lửa cho Yahweh[a], tức là cơ nghiệp của người ấy[b].
  rationale: Bản sửa không xác định trước chủ thể của hậu tố trong “cơ nghiệp của người ấy”, đồng thời dùng “tức là” để phản ánh cách hiểu bổ sung/giải thích được tiếng Anh POB ghi nhận. Chú thích bảo lưu cả hai cách quy chiếu khả dĩ, thay vì để đại từ kính ngữ “Ngài” quyết định nghĩa trong chính văn.
  reviewer_model: gpt-5.6-terra
