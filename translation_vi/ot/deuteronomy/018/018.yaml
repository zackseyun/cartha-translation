source:
  edition: WLC
  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: vi
  text: Ta sẽ dấy lên cho họ một nhà tiên tri giống như con, từ giữa anh em của họ[a]. Ta sẽ đặt lời Ta trong miệng người ấy, và người ấy sẽ nói với họ mọi điều Ta truyền cho người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ giữa bà con của họ” hoặc “từ giữa những người Israel cùng dân với họ”; tiếng Hê-bơ-rơ dịch sát là “từ giữa anh em của họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: một nhà tiên tri
  rationale: Cách gọi thông dụng trong tiếng Việt đối với người nói thay mặt Đức Chúa Trời; “một” phù hợp với danh từ số ít không có mạo từ trong lời hứa này.
- source_word: אָקִים
  choice: Ta sẽ dấy lên
  rationale: Giữ sắc thái Đức Chúa Trời làm cho một nhà tiên tri xuất hiện và bổ nhiệm người ấy, đồng thời là lối diễn đạt trang trọng, quen thuộc trong văn cảnh Kinh Thánh.
- source_word: לָהֶם
  choice: cho họ
  rationale: Diễn đạt ý Đức Chúa Trời cung ứng một nhà tiên tri vì lợi ích của dân chúng.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: từ giữa anh em của họ
  rationale: Bám sát cả ý “từ giữa” lẫn danh từ thân tộc giống đực “anh em”; chú thích làm rõ nghĩa cộng đồng giao ước mà không làm phẳng cách nói của nguyên văn.
- source_word: כָּמוֹךָ
  choice: giống như con
  rationale: Giữ nguyên sự so sánh trực tiếp với Môi-se; “con” phù hợp với lời Đức Chúa Trời phán trực tiếp với ông trong tiếng Việt.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: Ta sẽ đặt lời Ta trong miệng người ấy
  rationale: Bảo tồn hình ảnh cụ thể của công thức ủy nhiệm tiên tri, thay vì diễn giải thành việc ban sứ điệp hay soi dẫn.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: người ấy sẽ nói với họ
  rationale: Diễn đạt tự nhiên chuỗi hành động tương lai và giữ hướng của lời nói tới dân chúng.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: mọi điều Ta truyền cho người ấy
  rationale: “Mọi điều” thể hiện tính toàn diện của כָּל אֲשֶׁר; thì hiện tại trong mệnh đề tiếng Việt nằm tự nhiên trong khung tương lai mà không buộc nguyên văn vào một sắc thái thời gian quá hẹp.
theological_decisions:
- issue: Nhà tiên tri được hứa có phải được xác định riêng là Đấng Mê-si hay không
  choice: Giữ nguyên lời hứa về “một nhà tiên tri giống như con” mà không xác định danh tính người ấy trong chính câu dịch.
  alternative: Hiểu là một dòng các nhà tiên tri, hoặc là một nhà tiên tri cánh chung duy nhất được ứng nghiệm nơi Đấng Mê-si.
  rationale: Bản thân câu Hê-bơ-rơ không nêu đích danh nhân vật. Cách dịch giữ được tính số ít và sự tương đồng với Môi-se nhưng không đưa một kết luận thần học từ cách đọc kinh điển vào chính văn.
- issue: Phạm vi nghĩa của אֲחֵיהֶם
  choice: Dịch sát là “anh em của họ”, kèm chú thích về nghĩa thân tộc/cộng đồng.
  alternative: “Bà con của họ”, “đồng bào của họ” hoặc “những người Israel cùng dân tộc với họ”.
  rationale: “Anh em” bảo tồn hình thức giống đực và ẩn dụ thân tộc của nguyên văn; chú thích ngăn người đọc hiện đại hiểu từ này chỉ theo nghĩa anh em ruột.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Trời và “con” khi Ngài nói trực tiếp với Môi-se. Đại từ “người ấy” tránh sự mơ hồ của “ông” và giữ giọng văn trang nghiêm. Chính văn duy trì hình ảnh “đặt lời trong miệng” thay vì diễn giải thần học.
