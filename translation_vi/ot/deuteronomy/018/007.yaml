base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: vi
  text: thì người ấy có thể phụng sự[a] nhân danh Yahweh, Đức Chúa Trời của mình,[b] như tất cả anh em mình, tức là những người Lê-vi,[c] đứng ở đó trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và người ấy sẽ phụng sự.” Thể chưa hoàn thành trong tiếng Híp-ri có thể diễn đạt sự cho phép hoặc sắc thái tương lai trực tiếp hơn, tùy cách diễn đạt văn cảnh luật lệ.'
    reason: lexical_alternative
  - marker: b
    text: 'Híp-ri: YHWH; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
  - marker: c
    text: Nguyên văn là “anh em mình”, tức những người Lê-vi cùng hàng ngũ với người ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: thì người ấy được phụng sự
  rationale: Động từ Piel שׁרת chỉ việc phục vụ trong chức vụ thánh. Trong mạch luật lệ tiếp nối câu trước, “được phụng sự” diễn đạt tự nhiên sắc thái cho phép/quyền được tham gia của thể vị hoàn, còn “thì” thể hiện quan hệ hệ quả của liên từ וְ.
- source_word: בְּשֵׁם
  choice: nhân danh
  rationale: Thành ngữ này nói đến việc hành động dưới thẩm quyền hoặc sự cầu khẩn danh của một người; “nhân danh” là cách diễn đạt tiếng Việt tự nhiên và chính xác.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự quen dùng, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהָיו
  choice: Đức Chúa Trời của mình
  rationale: Diễn đạt quan hệ sở hữu quy chiếu về chính người Lê-vi đang được nói đến; “của mình” tránh khả năng hiểu nhầm đại từ trong tiếng Việt.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: như mọi anh em mình là người Lê-vi
  rationale: Giữ phép so sánh, từ thân tộc giống đực “anh em” và thành phần đồng vị “người Lê-vi”, qua đó vừa sát nguyên văn vừa làm rõ đối tượng.
- source_word: הָעֹמְדִים שָׁם
  choice: những người đứng tại đó
  rationale: Giữ nghĩa cụ thể của עמד là “đứng”; “tại đó” quy chiếu về nơi thánh trung tâm trong văn cảnh.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Đây là cách tương đương trực tiếp và tự nhiên của thành ngữ chỉ việc hiện diện trước Đức Chúa Trời, đặc biệt trong bối cảnh phụng sự.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; giữ “Yahweh” bảo tồn tư cách danh giao ước thay vì thay thế bằng tước hiệu.
- issue: Sắc thái pháp lý của וְשֵׁרֵת
  choice: được phụng sự
  alternative: sẽ phụng sự
  rationale: Văn cảnh trao cho người Lê-vi quyền đến và phục vụ, nên cách dịch cho phép phù hợp; tuy nhiên, thể vị hoàn Híp-ri cũng có thể được hiểu với lực tương lai hoặc mệnh lệnh trực tiếp hơn, vì vậy phương án ấy được ghi ở chú thích.
- issue: Từ thân tộc אֶחָיו
  choice: anh em mình
  alternative: những người Lê-vi đồng tộc với mình
  rationale: Giữ hình ảnh thân tộc giống đực của nguyên văn; cụm đồng vị kế tiếp xác định rõ họ là những người Lê-vi khác.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “phụng sự” cho hoạt động thánh chức và “nhân danh” cho thành ngữ thẩm quyền. Đại từ “người ấy” cùng “của mình/anh em mình” bảo đảm quy chiếu rõ ràng trong tiếng Việt. Cấu trúc câu bám sát trật tự và độ căng nghĩa của tiếng Híp-ri mà vẫn tự nhiên.
