review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc pháp lý cho phép của động từ chưa hoàn thành וְשֵׁרֵת, thành ngữ “nhân danh,” danh Yahweh, và hình ảnh người Lê-vi đứng trước Yahweh. Tuy nhiên, “được phụng sự” là bị động trong tiếng Việt (“được người khác phụng sự”), trong khi động từ Híp-ri có chủ thể là chính người Lê-vi thực hiện việc phụng sự. Cần đổi sang cấu trúc chủ động có sắc thái cho phép.
  naturalness: Câu sửa dùng “có thể phụng sự” để diễn đạt rõ quyền được phục vụ; “tức là những người Lê-vi” làm sáng tỏ cụm đồng vị mà vẫn giữ “anh em mình.” Các chú thích cũng được neo ngay tại từ/cụm từ liên quan và dùng thuật ngữ ngữ pháp tiếng Việt chuẩn là “thể chưa hoàn thành.”
  terminology: Giữ “Yahweh” cho יהוה, “Đức Chúa Trời của mình” cho אֱלֹהָיו, “phụng sự” cho שירות trong bối cảnh thánh chức, và “anh em mình” cho אֶחָיו. Không thêm diễn giải giáo phái.
  issues:
  - severity: high
    issue: “được phụng sự” dịch sai hướng chủ động/bị động của וְשֵׁרֵת.
    rationale: Cụm này trong tiếng Việt có nghĩa người Lê-vi là đối tượng nhận sự phụng sự. Nguyên văn nói người ấy sẽ/có thể tự thực hiện việc phụng sự.
  - severity: low
    issue: Chú thích a gọi imperfect là “thể vị hoàn.”
    rationale: Cách gọi chuẩn, rõ ràng hơn trong tiếng Việt hiện đại là “thể chưa hoàn thành”; “vị hoàn” không phù hợp ở đây.
