id: DEU.18.6
reference: Deuteronomy 18:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: vi
  text: Nếu một người Lê-vi đang cư ngụ tại một trong các thành của anh em, bất cứ nơi nào trong toàn cõi Israel, và người ấy đến nơi Yahweh sẽ chọn với tất cả niềm khao khát của lòng mình,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với tất cả ước muốn của tâm hồn mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một trường hợp điều kiện nối tiếp luật lệ trước đó; tiếng Việt không cần dịch riêng liên từ וְ để câu tự nhiên.
- source_word: הַלֵּוִי
  choice: một người Lê-vi
  rationale: Mạo từ Hebrew dùng theo nghĩa đại diện trong văn luật; tiếng Việt tự nhiên dùng “một người Lê-vi” cho trường hợp bất định.
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: từ một trong các thành của anh em
  rationale: Nghĩa đen là “từ một trong các cổng của anh em”, nhưng “cổng” ở đây hoán dụ cho thành hoặc khu dân cư; dịch theo nghĩa giúp độc giả hiện đại hiểu đúng.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: tại bất cứ nơi nào trong toàn cõi Israel
  rationale: 'Diễn đạt ý phân bố: người Lê-vi có thể xuất thân từ bất cứ địa điểm nào trên khắp Israel.'
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: mà người ấy đang cư ngụ
  rationale: Giữ sắc thái cư trú của גור mà không áp đặt khái niệm pháp lý “ngoại kiều” trong bối cảnh nội bộ Israel.
- source_word: וּבָא
  choice: đến
  rationale: Động từ lặp lại trong Hebrew dẫn đến đích đến; trong tiếng Việt có thể gộp cấu trúc để tránh lặp vụng về mà vẫn giữ đầy đủ chuyển động từ nơi cư trú đến nơi được chọn.
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: với tất cả niềm khao khát của lòng mình
  rationale: Diễn đạt trọn vẹn cường độ của כָל, ý khao khát trong אַוָּה và con người nội tâm trong נֶפֶשׁ bằng lối nói tự nhiên, trang trọng.
- source_word: אֶל הַמָּקוֹם
  choice: đến nơi
  rationale: Không thêm “thờ phượng” hay “đền thánh”, vì nguyên văn chỉ nói “nơi” và để bối cảnh xác định sở chỉ.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: Đức Giê-hô-va sẽ chọn
  rationale: Thể chưa hoàn thành phù hợp với ý tương lai trong công thức lặp lại của Phục Truyền; danh thần YHWH được chuyển tự theo dạng quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh riêng יְהוָה (YHWH)
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; “Đức Giê-hô-va” giữ đây là danh riêng, có sắc thái tôn kính và dễ nhận biết đối với độc giả Việt, thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của “nơi” được Đức Giê-hô-va chọn
  choice: Giữ nguyên là “nơi”
  alternative: nơi thờ phượng; đền thánh
  rationale: Bối cảnh hướng đến địa điểm thờ phượng trung tâm, nhưng câu Hebrew không nói rõ hơn; bản dịch không nên giải quyết điều văn bản để hàm ẩn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng được ngỏ lời; “các thành” truyền đạt phép hoán dụ “các cổng”. Đặt chú thích [a] ngay sau cụm từ được chú giải.
