  yaml_path: translation/ot/deuteronomy/018/011.yaml
  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: vi
  text: hay kẻ dùng lời chú thuật[a], kẻ cầu vấn một người đồng cốt[b] hoặc người hành nghề huyền thuật[c], hay kẻ cầu hỏi người chết[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kẻ niệm chú”. Thành ngữ Hê-bơ-rơ theo nghĩa đen là “kẻ kết một sự kết buộc”, chỉ việc dùng lời chú thuật.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ cũng có thể được hiểu là “kẻ cầu hỏi hồn ma”; từ này có thể chỉ hồn người chết hoặc người làm trung gian để cầu hỏi hồn ấy.
    reason: lexical_ambiguity
  - marker: c
    text: Từ Hê-bơ-rơ chỉ một người hành nghề huyền thuật, thường được nhắc cùng với người đồng cốt; cũng có thể dịch là “thầy pháp”.
    reason: lexical_alternative
  - marker: d
    text: Cũng có thể dịch là “kẻ tìm đến người chết để cầu vấn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: kẻ kết bùa chú
  rationale: Cụm từ Hê-bơ-rơ lặp cùng một gốc từ, theo nghĩa đen là “kết một sự kết buộc”, chỉ việc dùng lời chú thuật. “Kết bùa chú” giữ được hình ảnh kết buộc của nguyên ngữ mà vẫn cho người đọc hiện đại nhận ra đây là một hoạt động ma thuật.
- source_word: שֹׁאֵל אוֹב
  choice: kẻ cầu hỏi đồng cốt
  rationale: אוֹב có thể chỉ hồn người chết hoặc người làm trung gian để cầu hỏi hồn ấy. “Cầu hỏi đồng cốt” diễn đạt tự nhiên hành vi bị cấm, đồng thời chú thích bảo lưu nghĩa từ vựng khác.
- source_word: יִדְּעֹנִי
  choice: thuật sĩ
  rationale: Từ này chỉ người hành nghề huyền thuật, thường đi đôi với אוֹב. “Thuật sĩ” trang trọng và dễ hiểu hơn các từ dễ gợi liên tưởng đến nhân vật kỳ ảo, nhưng vẫn không xác định quá mức loại hình thực hành.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: kẻ cầu hỏi người chết
  rationale: Động từ דָּרַשׁ trong ngữ cảnh này mang nghĩa tìm đến để tra hỏi hoặc cầu vấn. “Cầu hỏi người chết” nêu rõ việc chiêu hồn mà không thêm hệ thống tín ngưỡng về tình trạng của người chết.
- source_word: וְ
  choice: hay / hoặc
  rationale: Trong chuỗi điều cấm của luật pháp, liên từ nối các hạng người và hành vi bị cấm; tiếng Việt dùng “hay” và “hoặc” để trình bày danh sách tự nhiên, không hàm ý chỉ được chọn một mục.
theological_decisions:
- issue: Diễn đạt các thuật ngữ về huyền thuật mà không đưa vào quan niệm dân gian hoặc hệ thống huyền bí về sau
  choice: Dùng các từ hiện đại “bùa chú”, “đồng cốt”, “thuật sĩ” và “cầu hỏi người chết”, kèm chú thích về những điểm mơ hồ trong nguyên ngữ.
  alternative: Dùng những danh xưng truyền thống hoặc dịch hoàn toàn theo nghĩa đen như “kẻ kết một sự kết buộc”, “kẻ cầu hỏi hồn ma”.
  rationale: Câu này liệt kê những cách bói toán và cầu hồn bị cấm. Bản dịch cần rõ nghĩa nhưng không khẳng định quá mức rằng אוֹב luôn chỉ người trung gian hay luôn chỉ một hồn ma, cũng không gán cho יִדְּעֹנִי hình tượng kỳ ảo về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; câu là phần tiếp nối danh sách từ câu trước nên mở đầu bằng “hay”. Các thuật ngữ được chọn tránh sắc thái truyện kỳ ảo, đồng thời các chú thích bảo lưu tính mơ hồ thực sự của אוֹב và sắc thái thành ngữ của חֹבֵר חָבֶר.
