  text: וְ/נַחֲלָ֥ה לֹא יִֽהְיֶה לּ֖/וֹ בְּ/קֶ֣רֶב אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: vi
  text: Người ấy sẽ không có cơ nghiệp giữa anh em mình[a]; chính Yahweh là cơ nghiệp của người, như Ngài đã phán với người[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữa những người cùng dân tộc mình.” Tiếng Hê-bơ-rơ nói “anh em mình”, chỉ những người Israel đồng bào, cụ thể là các chi phái khác.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “như Ngài đã nói với người.” Động từ Hê-bơ-rơ là từ thông thường có nghĩa “nói”; dịch là “hứa” tuy có thể phù hợp theo hàm ý, nhưng mang tính diễn giải hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: cơ nghiệp
  rationale: Trong bối cảnh chia đất của Phục Truyền Luật Lệ Ký, từ này chỉ phần được cấp làm sản nghiệp. “Cơ nghiệp” giữ được cả nghĩa pháp lý về phần đất ở vế đầu lẫn nghĩa giao ước mang tính ẩn dụ ở vế sau, đồng thời phản ánh việc tiếng Hê-bơ-rơ lặp lại cùng một từ.
- source_word: בְּקֶרֶב
  choice: giữa
  rationale: Cụm בְּקֶרֶב אֶחָיו có nghĩa tự nhiên là “giữa anh em mình”; cách dịch này gọn, hiện đại và giữ nguyên bối cảnh quan hệ.
- source_word: אֶחָיו
  choice: anh em mình
  rationale: Danh từ Hê-bơ-rơ ở số nhiều giống đực, nghĩa đen là “anh em của người ấy”. Trong ngữ cảnh, cụm này chỉ những người cùng dân Israel, đặc biệt là các chi phái khác; bản dịch giữ cách nói của nguyên văn và giải thích phạm vi trong chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng phiên âm “Yahweh”, thay vì thay thế bằng một tước hiệu.
- source_word: הוּא
  choice: chính ... là
  rationale: Đại từ độc lập הוּא tạo sắc thái nhấn mạnh. Tiếng Việt diễn đạt tự nhiên sắc thái ấy bằng cấu trúc “chính Yahweh là”.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: như Ngài đã phán với người
  rationale: דִּבֶּר là động từ thông thường chỉ việc nói. “Phán” phù hợp với chủ thể thần linh và văn phong Kinh Thánh trang trọng, nhưng không thêm ý “hứa” vốn không được mã hóa rõ trong chính động từ.
theological_decisions:
- issue: Sở chỉ của các đại từ số ít (“người ấy”, “mình”, “người”)
  choice: Giữ số ít, hiểu là người Lê-vi hoặc thầy tế lễ Lê-vi mang tính đại diện/tập thể.
  alternative: Các đại từ có thể chỉ riêng tổ phụ Lê-vi, hoặc chỉ từng thầy tế lễ theo nghĩa phân phối.
  rationale: Ngữ cảnh liền trước nói về các thầy tế lễ Lê-vi và chi phái Lê-vi; tiếng Hê-bơ-rơ Kinh Thánh thường dùng số ít theo nghĩa tập thể hoặc đại diện. Giữ số ít tránh thu hẹp sở chỉ quá mức.
- issue: Ý nghĩa của mệnh đề “Yahweh là cơ nghiệp của người”
  choice: Giữ nguyên phát biểu giao ước mang tính ẩn dụ, không khai triển.
  alternative: Diễn giải thành “Yahweh là phần được ban cho người thay cho đất đai”.
  rationale: Nguyên văn tuyên bố ngắn gọn rằng chính Yahweh là cơ nghiệp. Bản dịch giữ nguyên chiều sâu và sự căng thẳng thần học này, thay vì giải thích thêm.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “cơ nghiệp” nhất quán ở cả hai vế để phản ánh phép lặp của nguyên văn; dùng “chính” để thể hiện sự nhấn mạnh của הוּא; giữ danh Yahweh.
