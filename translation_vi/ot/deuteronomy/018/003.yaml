source:
  edition: WLC
  text: וְ/זֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת הָ/עָ֗ם מֵ/אֵ֛ת זֹבְחֵ֥י הַ/זֶּ֖בַח אִם שׁ֣וֹר אִם שֶׂ֑ה וְ/נָתַן֙ לַ/כֹּהֵ֔ן הַ/זְּרֹ֥עַ וְ/הַ/לְּחָיַ֖יִם וְ/הַ/קֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: vi
  text: 'Đây là phần mà các thầy tế lễ có quyền nhận từ dân chúng, tức là từ những người dâng lễ tế, dù là bò hay chiên: người dâng phải trao cho thầy tế lễ phần vai[a], hai má[b] và dạ dày[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên nghĩa là “cánh tay”; khi nói về con vật, từ này chỉ chân trước hoặc phần vai.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “hai hàm.” Trong tiếng Hê-bơ-rơ, từ này ở dạng số đôi.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “bao tử.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: phần ... được quyền nhận
  rationale: Trong ngữ cảnh luật lệ về tế lễ, từ này chỉ phần được quy định và thuộc quyền các thầy tế lễ, chứ không mang nghĩa trừu tượng là “sự phán xét”.
- source_word: הַכֹּהֲנִים
  choice: các thầy tế lễ
  rationale: Dùng cách gọi tự nhiên, trang trọng và quen thuộc trong tiếng Việt hiện đại cho giới tư tế được nói đến ở đây.
- source_word: מֵאֵת הָעָם
  choice: từ dân chúng
  rationale: Phản ánh trực tiếp nghĩa “từ dân,” không tự ý thu hẹp thành một danh xưng dân tộc không có trong cụm từ này.
- source_word: מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: tức từ những người dâng sinh tế
  rationale: Cụm từ xác định rõ nhóm người trong dân có trách nhiệm trao phần này. Tiếng Việt không lặp cùng căn từ như tiếng Hê-bơ-rơ vì sẽ nặng nề; “dâng sinh tế” giữ được ý tế sát trong ngữ cảnh.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: dù là bò hay chiên
  rationale: Cách diễn đạt tự nhiên cho cấu trúc lựa chọn của nguyên văn; שֶׂה ở đây được dịch là “chiên” theo ngữ cảnh tế lễ, dù từ này có thể rộng hơn, chỉ con vật nhỏ trong bầy.
- source_word: וְנָתַן
  choice: người dâng phải trao
  rationale: Động từ số ít mang tính phân phối, chỉ từng người dâng lễ. Nêu rõ chủ thể trong tiếng Việt giúp tránh hiểu rằng con vật là chủ thể; “phải” thể hiện sắc thái quy định pháp lý.
- source_word: לַכֹּהֵן
  choice: cho thầy tế lễ
  rationale: Chỉ vị thầy tế lễ nhận phần được quy định trong từng trường hợp; tiếng Việt không cần lặp dấu hiệu xác định như tiếng Hê-bơ-rơ.
- source_word: הַזְּרֹעַ
  choice: cái chân trước
  rationale: Nghĩa đen là “cánh tay,” nhưng khi nói về thân thể con vật thì chỉ chân trước hoặc phần vai; “chân trước” rõ ràng và chính xác về giải phẫu trong ngữ cảnh này.
- source_word: הַלְּחָיַיִם
  choice: hai má
  rationale: Giữ rõ hình thái số đôi của tiếng Hê-bơ-rơ. Từ này cũng có thể được hiểu là hai hàm.
- source_word: הַקֵּבָה
  choice: dạ dày
  rationale: Từ hiện đại, rõ nghĩa, chỉ bộ phận tiêu hóa của con vật; tránh từ cổ hoặc cách xác định quá chuyên biệt như “dạ múi khế” khi bằng chứng từ vựng không đòi hỏi.
