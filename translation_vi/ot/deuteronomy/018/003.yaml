translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “sinh tế” để phân biệt lễ vật là con vật bị giết tế; dùng “thầy tế lễ” theo cách gọi Kinh Thánh phổ thông trong tiếng Việt. Các chú thích ghi nhận những khả năng giải phẫu và từ vựng thật sự của nguyên văn mà không áp đặt cách hiểu giáo phái.
