  text: כִּֽי תוֹעֲבַ֥ת יְהוָ֖ה כָּל עֹ֣שֵׂה אֵ֑לֶּה וּ/בִ/גְלַל֙ הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔לֶּה יְהוָ֣ה אֱלֹהֶ֔י/ךָ מוֹרִ֥ישׁ אוֹתָ֖/ם מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: vi
  text: Vì bất cứ ai làm những điều ấy đều là điều ghê tởm trước mặt Yahweh; và vì những điều ghê tởm ấy, Yahweh, Đức Chúa Trời của anh em, đang đuổi họ khỏi trước mặt anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đang tước quyền chiếm hữu của họ”; động từ Hê-bơ-rơ có thể nhấn mạnh việc khiến các dân mất quyền chiếm hữu, cũng như việc đuổi họ đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giới từ này nêu lý do cho lệnh cấm ở phần trước; “Vì” diễn đạt tự nhiên quan hệ giải thích-nguyên nhân.
- source_word: תוֹעֲבַת יְהוָה
  choice: điều ghê tởm đối với Yahweh
  rationale: Giữ sắc thái đạo đức và giao ước mạnh của תּוֹעֵבָה, đồng thời diễn đạt tự nhiên rằng người thực hành là điều đáng ghê tởm trước mặt Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước được ghi trực tiếp trong bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: bất cứ ai làm những điều ấy
  rationale: 'כָּל kết hợp với phân từ chỉ phạm vi phổ quát không xác định: bất kỳ người nào thực hành các việc vừa nêu.'
- source_word: וּבִגְלַל
  choice: và chính vì
  rationale: Diễn đạt quan hệ nguyên nhân; “chính” làm rõ sự nhấn mạnh rằng các hành vi ghê tởm ấy là căn cứ của sự phán xét.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: những điều ghê tởm ấy
  rationale: Duy trì liên hệ từ vựng với תוֹעֲבַת ở vế trước và quy chiếu về các thực hành bị cấm trong những câu trước.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ đại từ ngôi hai số ít mang tính tập thể, hướng đến toàn thể Israel; “anh em” là cách xưng hô tự nhiên và trang trọng trong diễn ngôn giao ước tiếng Việt.
- source_word: מוֹרִישׁ אוֹתָם
  choice: đang đuổi các dân đó
  rationale: Dạng Hiphil của ירש có thể chỉ việc khiến các dân mất quyền sở hữu đất hoặc đuổi họ đi; bản chính chọn cách nói tự nhiên theo bối cảnh chinh phục, còn chú thích bảo lưu sắc thái “truất quyền chiếm hữu”.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt anh em
  rationale: Giữ gần thành ngữ Hê-bơ-rơ “khỏi trước mặt/ngay trước sự hiện diện của anh em” trong bối cảnh các dân bị loại khỏi đất khi Israel tiến vào.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn sự phân biệt giữa danh riêng và tước hiệu.
- issue: Đối tượng được gọi là תוֹעֲבַת יְהוָה
  choice: người làm những điều ấy đều là điều ghê tởm đối với Yahweh
  alternative: những việc người ấy làm là điều ghê tởm đối với Yahweh
  rationale: Cú pháp כָּל עֹשֵׂה אֵלֶּה làm chủ thể của mệnh đề danh từ, nên lời phán trực tiếp nói về “bất cứ ai làm” các việc ấy; không làm nhẹ thành chỉ các hành vi.
- issue: Sắc thái của מוֹרִישׁ
  choice: đang đuổi các dân đó
  alternative: đang truất quyền chiếm hữu đất của các dân đó
  rationale: Động từ Hiphil có thể nhấn mạnh cả việc trục xuất lẫn làm mất quyền sở hữu. Bản chính chọn cách diễn đạt trôi chảy theo bối cảnh, còn chú thích ghi nhận nghĩa pháp lý-lãnh thổ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi hai số ít tập thể chỉ Israel; dùng “các dân đó” để làm rõ đối tượng số nhiều của đại từ Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau mệnh đề có động từ cần giải thích.
