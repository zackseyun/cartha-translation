  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và ý chính của nguyên văn: mọi người thực hành các việc ấy là điều ghê tởm đối với Yahweh, và chính các điều ghê tởm ấy là lý do Yahweh loại các dân khỏi trước mặt Israel. Tuy nhiên, “chính vì” thêm sắc thái nhấn mạnh không được biểu thị rõ trong וּבִגְלַל. Đại từ “họ” bảo lưu sát hơn đối tượng אֹתָם, vốn chỉ các dân trong ngữ cảnh trước đó.'
  naturalness: “Đuổi họ khỏi trước mặt anh em” là thành ngữ Kinh Thánh tự nhiên và rõ nghĩa hơn khi không lặp lại “các dân đó” trong cùng mệnh đề. “Là điều ghê tởm trước mặt Yahweh” cũng là lối nói tiếng Việt trang trọng, tự nhiên trong ngữ cảnh này.
  terminology: Giữ “Yahweh” cho יהוה và “Đức Chúa Trời của anh em” cho אֱלֹהֶיךָ. Giữ liên kết từ vựng giữa số ít “điều ghê tởm” và số nhiều “những điều ghê tởm”. Chú thích diễn đạt lựa chọn nghĩa của Hiphil ירש cách gọn và chính xác hơn.
