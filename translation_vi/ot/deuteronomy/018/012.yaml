revisions:
- from: Vì bất cứ ai làm những điều ấy đều là điều ghê tởm đối với Yahweh; và chính vì những điều ghê tởm ấy mà Yahweh, Đức Chúa Trời của anh em, đang đuổi các dân đó khỏi trước mặt anh em.[a]
  to: Vì bất cứ ai làm những điều ấy đều là điều ghê tởm trước mặt Yahweh; và vì những điều ghê tởm ấy, Yahweh, Đức Chúa Trời của anh em, đang đuổi họ khỏi trước mặt anh em.[a]
  rationale: Bản sửa loại bỏ sự nhấn mạnh không cần thiết, dùng đại từ tương ứng với nguyên văn, và làm chú thích về sắc thái “tước quyền chiếm hữu” ngắn gọn, tự nhiên hơn. Ý nghĩa lịch sử và tính mơ hồ từ vựng của động từ được bảo lưu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:09Z'
