  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: vi
  text: Và người nào không lắng nghe những lời của ta mà vị tiên tri ấy nhân danh ta nói, thì chính ta sẽ đòi người ấy chịu trách nhiệm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chính ta sẽ hạch hỏi người ấy.” Nguyên văn Hê-bơ-rơ nói theo nghĩa đen: “ta sẽ đòi nơi người ấy”; đối tượng được hiểu theo ngữ cảnh. Cách nói này diễn tả việc Đức Chúa Trời sẽ truy cứu người từ chối lời của vị tiên tri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Và nếu có người… thì
  rationale: Trong ngữ cảnh, cụm này mở đầu hệ quả đối với trường hợp được nêu. Cấu trúc “nếu… thì” diễn đạt tự nhiên bằng tiếng Việt mà vẫn giữ lực hướng tới tương lai của lời cảnh báo.
- source_word: הָאִישׁ
  choice: có người
  rationale: Danh từ giống đực số ít ở đây có ý nghĩa đại diện cho bất cứ cá nhân nào rơi vào trường hợp này. “Có người” tự nhiên hơn “người đàn ông” trong tiếng Việt và không làm thay đổi phạm vi quy định.
- source_word: לֹא יִשְׁמַע אֶל
  choice: không lắng nghe
  rationale: Động từ שׁמע với אֶל vừa có nghĩa nghe, vừa hàm ý chú ý và làm theo. “Không lắng nghe” giữ được cả sắc thái tiếp nhận lẫn đáp ứng mà không diễn giải hoàn toàn thành “không vâng lời”.
- source_word: דְּבָרַי
  choice: những lời của ta
  rationale: Giữ nguyên dạng số nhiều và lời phán trực tiếp của Đức Chúa Trời.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: mà vị tiên tri ấy… nói
  rationale: Chủ thể của động từ là vị tiên tri đã được nói đến ở câu trước. Nêu lại “vị tiên tri ấy” giúp tiếng Việt tránh hiểu nhầm rằng người từ chối nghe cũng là người nói, nhưng không thêm một nhân vật mới.
- source_word: בִּשְׁמִי
  choice: nhân danh ta
  rationale: Đây là cách diễn đạt tự nhiên và trang trọng cho thành ngữ chỉ việc nói với danh nghĩa và thẩm quyền của Đức Chúa Trời.
- source_word: אָנֹכִי
  choice: chính ta
  rationale: Đại từ độc lập mang tính nhấn mạnh; “chính ta” thể hiện rõ việc Đức Chúa Trời đích thân quy trách nhiệm.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: sẽ đòi người đó chịu trách nhiệm
  rationale: Trong ngữ cảnh này, דרשׁ với מֵעִם diễn tả việc truy cứu và bắt chịu trách nhiệm. Cách dịch này trang trọng, dễ hiểu, đồng thời không xác định hình thức trừng phạt.
theological_decisions:
- issue: Bản chất sự đáp trả của Đức Chúa Trời đối với người từ chối lời vị tiên tri
  choice: chính ta sẽ đòi người đó chịu trách nhiệm
  alternative: chính ta sẽ hạch hỏi người đó; chính ta sẽ đòi điều ấy nơi người đó
  rationale: Bản Hê-bơ-rơ khẳng định sự quy trách nhiệm và phán xét của Đức Chúa Trời nhưng không nói rõ hình thức hay mức độ hình phạt. Bản dịch giữ nguyên sự nghiêm trọng và tính chưa xác định ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta” giữ giọng phán trực tiếp đầy thẩm quyền của Đức Chúa Trời; “vị tiên tri ấy” nối rõ với ngữ cảnh trước và tránh nhập nhằng chủ thể trong tiếng Việt.
