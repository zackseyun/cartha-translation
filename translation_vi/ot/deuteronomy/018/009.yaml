revisions:
- from: Khi anh em vào miền đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em, anh em không được học làm theo những điều ghê tởm của các dân tộc ấy.[a]
  to: Khi anh em vào đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em, anh em không được học làm theo các điều ghê tởm của các dân tộc ấy.[a]
  rationale: Chỉnh nhẹ “miền đất” thành “đất” và làm rõ cụm mệnh lệnh để tiếng Việt tự nhiên hơn, đồng thời sửa chú thích nhằm bảo toàn cách hiểu so sánh hoặc làm theo của giới từ כְ. Không thay đổi nội dung hay mức độ lên án của nguyên văn.
