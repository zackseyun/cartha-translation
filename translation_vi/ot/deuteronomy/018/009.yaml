  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: vi
  text: Khi anh em vào đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em, anh em không được học làm theo các điều ghê tởm của các dân tộc ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “anh em không được học làm những điều ghê tởm như các dân tộc ấy làm”; giới từ Hê-bơ-rơ có thể diễn tả sự so sánh hoặc sự làm theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong ngữ cảnh này, כִּי mở đầu hoàn cảnh thời gian cho lệnh cấm tiếp theo; “Khi” diễn đạt tự nhiên thời điểm dân Israel vào đất.
- source_word: בָּא אֶל הָאָרֶץ
  choice: vào miền đất
  rationale: Cụm này chỉ việc tiến vào vùng đất được hứa ban. “Vào miền đất” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái địa lý-giao ước của הָאָרֶץ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tetragrammaton, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Dịch cấu trúc sở hữu ngôi hai số ít. “Anh em” được dùng theo nghĩa tập thể, phù hợp lời Môi-se nói với dân Israel.
- source_word: נֹתֵן לָךְ
  choice: đang ban cho anh em
  rationale: Phân từ diễn tả hành động đang được thực hiện hoặc sắp thành hiện thực từ góc nhìn của diễn từ; “đang ban” giữ được sắc thái ấy.
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: không được học làm
  rationale: Phủ định với động từ chưa hoàn thành mang lực cấm đoán. “Không được” là lối diễn đạt luật lệnh tự nhiên trong tiếng Việt hiện đại; “học làm” giữ quan hệ trực tiếp giữa hai động từ.
- source_word: כְּתוֹעֲבֹת
  choice: làm theo những điều ghê tởm
  rationale: Giới từ כְּ có thể diễn tả sự noi theo hoặc so sánh. Bản chính dùng “làm theo” để truyền đạt ý conform theo các hành vi bị lên án, còn chú thích giữ khả năng so sánh. “Những điều ghê tởm” bảo toàn sức nặng đạo đức-tôn giáo của תּוֹעֵבָה mà không giới hạn trước nội dung các câu sau.
- source_word: הַגּוֹיִם הָהֵם
  choice: các dân tộc ấy
  rationale: גּוֹיִם ở đây chỉ các dân tộc trong miền đất, còn הָהֵם là đại từ chỉ định xa; “các dân tộc ấy” phản ánh cả hai yếu tố.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước YHWH; phiên âm “Yahweh” giữ đây là tên riêng thay vì thay bằng tước hiệu.
- issue: Sức nặng của תּוֹעֵבָה
  choice: những điều ghê tởm
  alternative: những tập tục đáng ghét
  rationale: “Những điều ghê tởm” giữ lời lên án mạnh về đạo đức và tôn giáo, đồng thời không thu hẹp từ này chỉ còn các tập tục trước khi những câu kế tiếp liệt kê cụ thể.
- issue: Tính tập thể của đại từ ngôi hai số ít
  choice: anh em
  alternative: ngươi
  rationale: Tiếng Hê-bơ-rơ dùng ngôi hai số ít để nói với Israel như một cộng đồng. “Anh em” truyền đạt đối tượng tập thể bằng tiếng Việt hiện đại, trang trọng mà không cổ hóa.
translation_notes:
  register: Văn phong luật lệnh trang trọng nhưng hiện đại. Dùng “anh em” cho ngôi hai số ít mang nghĩa tập thể trong diễn từ Phục Truyền Luật Lệ Ký; tránh “ngươi” vì sắc thái cổ. Cấu trúc câu giữ gần nguyên văn nhưng được sắp xếp tự nhiên cho độc giả tiếng Việt.
