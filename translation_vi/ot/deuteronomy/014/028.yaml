  terminology: “Phần mười,” “hoa lợi,” và “các thành” phù hợp ngữ cảnh. “Các thành” là cách chuyển nghĩa thành ngữ của בִּשְׁעָרֶיךָ; chú thích giữ được hình ảnh “cổng” và giải thích nghĩa địa phương. Không cần áp đặt diễn giải tôn giáo nào.
  issues:
