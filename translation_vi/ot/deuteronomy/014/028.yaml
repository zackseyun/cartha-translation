revisions:
- from: Cuối mỗi ba năm[a], anh em phải đem ra toàn bộ phần mười hoa lợi của mình trong năm ấy và để lại trong các thành của mình.[b]
  to: Vào cuối mỗi chu kỳ ba năm[a], anh em phải đem ra toàn bộ phần mười hoa lợi của anh em trong năm ấy và để lại trong các thành của anh em.[b]
  rationale: Bản sửa chỉ cải thiện độ tự nhiên và tính nhất quán của tiếng Việt. “Vào cuối mỗi chu kỳ ba năm” bảo toàn mốc thời gian “vào cuối ... ba năm” và tính lặp lại theo ngữ cảnh. Chú thích a tiếp tục nêu phương án “mỗi năm thứ ba”; chú thích b vẫn được neo đúng vào “các thành.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:08:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: thời điểm theo chu kỳ ba năm, việc đem ra toàn bộ phần mười của hoa lợi năm đó, và đặt/lưu lại tại địa phương. Tuy nhiên, “Cuối mỗi ba năm” chưa tự nhiên và có thể khiến cấu trúc thời gian bị khó hiểu; “vào cuối mỗi chu kỳ ba năm” diễn đạt rõ hơn mà vẫn giữ ý מִקְצֵה שָׁלֹשׁ שָׁנִים.'
