base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: vi
  text: Vào cuối mỗi chu kỳ ba năm[a], anh em phải đem ra toàn bộ phần mười hoa lợi của anh em trong năm ấy và để lại trong các thành của anh em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào cuối mỗi năm thứ ba.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong các cổng của anh em”; cách nói này chỉ các thành hoặc khu định cư tại địa phương.'
    reason: cultural_note
lexical_decisions:
- source_word: מִקְצֵה
  choice: Cuối
  rationale: Diễn đạt tự nhiên điểm cuối của khoảng thời gian, đồng thời giữ sát ý thời gian của cụm Hê-bơ-rơ.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: mỗi ba năm
  rationale: Ngữ cảnh cho thấy đây là quy định lặp lại theo chu kỳ ba năm; cách dịch này tự nhiên trong tiếng Việt. Khả năng hiểu là “mỗi năm thứ ba” được ghi ở chú thích.
- source_word: תּוֹצִיא
  choice: phải đem ra
  rationale: 'Giữ nghĩa tác động của thể Hiphil: làm cho đi ra, tức lấy hoặc đem phần mười ra khỏi nơi đang giữ để dùng theo quy định.'
- source_word: כָּל מַעְשַׂר
  choice: toàn bộ phần mười
  rationale: “Toàn bộ” thể hiện tính trọn vẹn do כָּל nhấn mạnh; “phần mười” là cách gọi rõ ràng, phổ thông cho khoản một phần mười.
- source_word: תְּבוּאָתְךָ
  choice: hoa lợi của mình
  rationale: “Hoa lợi” bao quát sản vật hay lợi tức nông nghiệp của đất, không thu hẹp vào riêng ngũ cốc.
- source_word: בַּשָּׁנָה הַהִוא
  choice: trong năm ấy
  rationale: Giữ nguyên sự quy chiếu đến năm đang được nói tới và quan hệ của phần mười với hoa lợi năm đó.
- source_word: וְהִנַּחְתָּ
  choice: và để lại
  rationale: Trong ngữ cảnh này, động từ chỉ việc đặt hoặc lưu phần mười tại địa phương; “để lại” tự nhiên hơn “đặt xuống” mà không thêm ý niệm kho chứa vốn không được nói rõ.
- source_word: בִּשְׁעָרֶיךָ
  choice: trong các thành của mình
  rationale: Nghĩa đen liên quan đến “cổng”, nhưng thành ngữ Hê-bơ-rơ ở đây chỉ các thành hoặc khu định cư thuộc địa phương của người nghe. Dịch theo nghĩa giao tiếp giúp độc giả Việt hiểu đúng; hình ảnh nguyên ngữ được ghi chú.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp lời Môi-se nói với cộng đồng Ít-ra-ên; “mình” tránh lặp nặng nề nhưng vẫn giữ ngôi thứ hai. Bản dịch ưu tiên nghĩa thành ngữ ở בִּשְׁעָרֶיךָ, đồng thời bảo tồn hình ảnh nguyên văn trong chú thích.
