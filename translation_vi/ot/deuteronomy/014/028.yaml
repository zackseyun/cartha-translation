    issue: Cụm “Cuối mỗi ba năm” thiếu tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này dễ gây vấp về cú pháp. “Vào cuối mỗi chu kỳ ba năm” làm rõ đây là thời điểm kết thúc của một khoảng ba năm lặp lại, phù hợp với nguyên ngữ.
  - severity: low
    issue: Đại từ “của mình” không nhất quán với lời gọi số nhiều “anh em.”
    rationale: Đổi thành “của anh em” giữ nhất quán ngôi xưng và không thay đổi nghĩa.
