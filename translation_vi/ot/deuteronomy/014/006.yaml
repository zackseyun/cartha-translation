  text: וְ/כָל בְּהֵמָ֞ה מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ שְׁתֵּ֣י פְרָס֔וֹת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/006.yaml
  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: vi
  text: Trong các loài vật, bất cứ con nào có móng chẻ, móng tách hẳn thành hai, và nhai lại thì anh em được phép ăn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל בְּהֵמָה
  choice: Trong các loài vật, bất cứ con nào
  rationale: Diễn đạt tự nhiên ý phân phối của וְכָל, đồng thời dùng “loài vật/con” cho בְּהֵמָה trong phạm vi các động vật trên cạn đang được phân loại.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: có móng chẻ
  rationale: Cách nói ngắn gọn, tự nhiên trong tiếng Việt, giữ tiêu chí cụ thể về cấu tạo móng.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: móng tách hẳn thành hai
  rationale: Giữ sự nhấn mạnh của tiếng Hê-bơ-rơ rằng khe chẻ phân móng thành hai phần rõ rệt, tránh lặp từ nặng nề.
- source_word: מַעֲלַת גֵּרָה
  choice: nhai lại
  rationale: Thuật ngữ tiếng Việt thông dụng và chính xác cho hiện tượng động vật ợ thức ăn lên để nhai lại.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: thì anh em được phép ăn
  rationale: Trong luật về thức ăn, động từ biểu thị sự cho phép hơn là mệnh lệnh phải ăn; “anh em” thể hiện ngôi thứ hai số nhiều được hàm chứa trong động từ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc điều kiện–cho phép làm rõ chức năng pháp lý của câu; giữ cả hai tiêu chí về móng và tiêu chí nhai lại.
