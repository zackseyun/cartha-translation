  terminology: «Loài vật/con», «móng chẻ», và «nhai lại» đều phù hợp văn phong hiện đại và ngữ cảnh luật thực phẩm. «Anh em» là cách xưng hô số nhiều trang trọng, phù hợp với đối tượng được nói đến trong diễn văn Phục Truyền Luật Lệ Ký.
