  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: vi
  text: thì ngươi hãy đổi nó lấy bạc[a], gói bạc ấy lại và cầm trong tay[b], rồi đi đến nơi mà Yahweh, Đức Chúa Trời của ngươi, sẽ chọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đổi nó thành tiền.” Nguyên văn nói “bạc”, là thứ được dùng làm tiền trong bối cảnh này.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn có thể hiểu là “buộc bạc ấy trong tay”, tức gói và giữ bạc an toàn để mang theo trong hành trình.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: hãy đổi nó lấy bạc
  rationale: Cụm נָתַן với בְּ và כֶּסֶף trong ngữ cảnh này chỉ việc đổi sản vật thành bạc dùng làm tiền. Cách dịch này giữ nghĩa giao dịch và vẫn bảo lưu danh từ cụ thể “bạc” của nguyên văn.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: gói bạc ấy lại và cầm trong tay
  rationale: צָרַר mang nghĩa buộc hoặc gói lại; cách diễn đạt tiếng Việt này tái hiện hành động giữ bạc an toàn để mang đi, đồng thời tránh lối nói gượng “buộc bạc trong tay”.
- source_word: בְּיָדְךָ
  choice: cầm trong tay
  rationale: Giữ hình ảnh cụ thể “trong tay” của tiếng Hê-bơ-rơ, nhưng diễn đạt tự nhiên trong tiếng Việt.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: rồi đi đến nơi
  rationale: הלך là động từ thông dụng chỉ việc đi; “đi đến nơi” tự nhiên, trực tiếp và phù hợp văn luật pháp.
- source_word: אֲשֶׁר יִבְחַר
  choice: sẽ chọn
  rationale: Thể chưa hoàn thành trong lời chỉ dẫn này tự nhiên mang ý tương lai.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cách gọi giao ước trang trọng và quen thuộc trong tiếng Việt; đại từ số ít tập thể được diễn đạt là “anh em” để chỉ từng người trong cộng đồng được truyền dạy.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số ít mang tính đại diện trong lời truyền cho dân Israel; giữ danh Yahweh và hình ảnh cụ thể về bạc, tay.
