  text: chim đà điểu[a], chim diều hâu, chim mòng biển và chim cắt[b] theo từng loại,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ có nghĩa đen là “con gái của đà điểu”, một cách gọi theo thành ngữ để chỉ loài đà điểu.
    reason: cultural_note
  - marker: b
    text: Việc xác định một số loài chim trong câu này không chắc chắn. Từ được dịch là “chim diều hâu” cũng có thể chỉ chim cú hoặc một loài chim khác; “chim mòng biển” từng được dịch là chim cu cu; và “chim cắt” cũng có thể được dịch là chim ưng.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: chim đà điểu
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “con gái của ya'anah”, nhưng trong danh sách động vật đây là tên gọi theo thành ngữ của một loài chim, nhiều khả năng là đà điểu. Cách dịch này tự nhiên trong tiếng Việt và tránh hiểu sai nghĩa đen.
- source_word: הַתַּחְמָס
  choice: chim diều hâu
  rationale: Việc xác định chính xác loài chim này vẫn chưa chắc chắn. “Chim diều hâu” diễn đạt hợp lý một loài chim săn mồi, đồng thời sự bất định được giữ lại trong chú thích.
- source_word: הַשָּׁחַף
  choice: chim hải âu
  rationale: Từ này khó xác định, nhưng các từ điển hiện đại thường liên hệ nó với hải âu hoặc một loài chim biển tương tự. “Chim hải âu” là tên gọi hiện đại, dễ hiểu trong tiếng Việt.
- source_word: הַנֵּץ
  choice: chim cắt
  rationale: Từ này chỉ một loài chim săn mồi, thường được hiểu là chim ưng hoặc chim cắt. Chọn “chim cắt” để phân biệt với תַּחְמָס trong cùng câu mà không thu hẹp quá mức ngoài khả năng của ngữ cảnh.
- source_word: לְמִינֵהוּ
  choice: theo từng loại
  rationale: Đây là công thức phân loại Hê-bơ-rơ, chỉ loài được nêu cùng các dạng hoặc giống thuộc loài ấy. Cách diễn đạt này gọn, tự nhiên và sát nghĩa.
