id: DEU.14.1
reference: Deuteronomy 14:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בָּנִ֣ים אַתֶּ֔ם לַֽ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם לֹ֣א תִתְגֹּֽדְד֗וּ וְ/לֹֽא תָשִׂ֧ימוּ קָרְחָ֛ה בֵּ֥ין עֵינֵי/כֶ֖ם לָ/מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: vi
  text: Anh em là con trai của Yahweh, Đức Chúa Trời của anh em.[a] Anh em không được rạch mình, cũng không được cạo một mảng hói giữa hai mắt vì người chết.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh em là con cái của Yahweh, Đức Chúa Trời của anh em.” Từ Hê-bơ-rơ ở giống đực số nhiều, nghĩa đen là “các con trai”.'
    reason: lexical_alternative
  - marker: b
    text: “Giữa hai mắt” là cách nói chỉ vùng trán.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: con trai
  rationale: Danh từ Hê-bơ-rơ ở dạng giống đực số nhiều, nghĩa đen là “các con trai”. Giữ hình thức này trong câu chính để phản ánh chính xác cách diễn đạt về căn tính giao ước; chú thích nêu cách hiểu bao quát “con cái”.
- source_word: לַיהוָה
  choice: của Yahweh
  rationale: Giới từ ל ở đây biểu thị quan hệ hay sự thuộc về trong câu “là con trai của Yahweh”, chứ không chỉ hướng đến.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Cụm danh từ kèm hậu tố ngôi thứ hai giống đực số nhiều, giữ nguyên công thức giao ước và cách xưng hô số nhiều.
- source_word: תִתְגֹּדְדוּ
  choice: rạch mình
  rationale: Dạng phản thân chỉ hành vi tự rạch thân thể, đặc biệt trong nghi thức tang chế; “rạch mình” tự nhiên, rõ nghĩa và trang trọng trong tiếng Việt.
- source_word: תָשִׂימוּ קָרְחָה
  choice: cạo một mảng hói
  rationale: Trong ngữ cảnh tang chế, cụm từ nói đến việc cố ý tạo ra một mảng trọc bằng cách cạo; cách dịch này diễn đạt hành động cụ thể tự nhiên hơn lối dịch sát từng từ “đặt sự hói”.
- source_word: בֵּין עֵינֵיכֶם
  choice: giữa hai mắt
  rationale: Giữ nguyên thành ngữ Hê-bơ-rơ theo nghĩa đen; chú thích giải thích rằng vị trí được chỉ đến là vùng trán.
- source_word: לָמֵת
  choice: vì người chết
  rationale: Giới từ ל biểu thị nguyên do hay đối tượng của nghi thức để tang; “vì người chết” ngắn gọn và bảo toàn mối liên hệ với tang chế.
theological_decisions:
- issue: Danh xưng căn tính giao ước có giống ngữ pháp
  choice: con trai
  alternative: con cái
  rationale: Bản Hê-bơ-rơ dùng danh từ giống đực số nhiều. Bản chính giữ đặc điểm nguồn văn, còn chú thích cho biết “con cái” là cách diễn đạt bao quát có thể dùng trong tiếng Việt, tránh khẳng định rằng cộng đồng giao ước chỉ gồm nam giới.
- issue: Cách chuyển dịch danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Dùng “Yahweh” để thể hiện đây là danh riêng giao ước trong nguyên văn, thay vì thay thế bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chuyển đại từ ngôi thứ hai giống đực số nhiều hướng đến cộng đồng; giữ “Yahweh” như danh riêng. Các lệnh cấm dùng cấu trúc “không được” rõ ràng, tự nhiên.
