  text: the glede[a], and the falcon, and the kite according to its kind,
translation:
  language: vi
  text: chim diều đỏ[a], chim cắt và chim diều, tùy theo loài;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chắc chắn chính xác các loài chim này. Các bản dịch truyền thống và hiện đại dùng những tên khác nhau, như “diều đỏ”, “diều”, hoặc “chim cắt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: chim diều đỏ
  rationale: Tên loài chim này không chắc chắn; nhiều từ điển hiện đại hiểu đây là một loại diều, có thể cụ thể là diều đỏ. Cách dịch này dùng tên chim hiện đại nhưng ghi nhận sự bất định trong chú thích.
- source_word: הָאַיָּה
  choice: chim cắt
  rationale: Đây là tên một loài chim săn mồi, thường được hiểu là chim cắt; cách dịch này cũng phân biệt nó với các từ chỉ chim diều ở hai bên.
- source_word: הַדַּיָּה
  choice: chim diều
  rationale: Từ này thường được hiểu là một loại chim diều, dù việc xác định chính xác về mặt động vật học vẫn còn tranh luận.
- source_word: לְמִינָהּ
  choice: tùy theo loài
  rationale: Cụm công thức này phân loại sinh vật theo loài hoặc nhóm; “tùy theo loài” tự nhiên trong tiếng Việt và giữ được ý nghĩa của nguyên ngữ.
- source_word: וְאֶת
  choice: và
  rationale: Liên từ nối các mục trong danh sách; dấu chỉ tân ngữ không cần được dịch riêng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc của một mục trong danh sách thực phẩm bị cấm; dùng dấu chấm phẩy vì câu còn tiếp nối theo văn mạch. Dấu chú thích [a] được đặt ngay sau tên chim đầu tiên, nơi sự bất định từ vựng nổi bật nhất.
