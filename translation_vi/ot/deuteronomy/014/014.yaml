  text: and every raven according to its kind,[a]
translation:
  language: vi
  text: và mọi loài quạ, tùy theo giống của chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có thể chỉ chung các loài thuộc họ quạ, gồm cả quạ đen; ở đây dịch là “quạ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: và
  rationale: וְ nối mục này với danh sách các loài chim bị cấm ở trước; אֵת là dấu hiệu chỉ trực tiếp đối tượng nên không cần dịch riêng trong cấu trúc liệt kê này.
- source_word: כָּל
  choice: mọi loài
  rationale: כָּל đi với danh từ số ít nhưng bao quát toàn bộ nhóm; “mọi loài” tự nhiên trong tiếng Việt và phù hợp với cách phân loại động vật ở đây.
- source_word: עֹרֵב
  choice: quạ
  rationale: עֹרֵב có thể chỉ rộng nhóm quạ, gồm cả raven và crow; “quạ” là từ bao quát, thông dụng và tự nhiên nhất trong tiếng Việt.
- source_word: לְמִינוֹ
  choice: tùy theo giống của chúng
  rationale: Cụm này phân loại theo từng giống hoặc loại. Đại từ số nhiều “chúng” thuận theo cách diễn đạt tiếng Việt vì “mọi loài quạ” chỉ cả một nhóm, dù hậu tố Hê-bơ-rơ ở dạng số ít.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “mọi loài quạ” để diễn đạt tự nhiên một hạng mục trong danh sách phân loại động vật, đồng thời giữ cụm “tùy theo giống” nhằm phản ánh cấu trúc Hê-bơ-rơ.
