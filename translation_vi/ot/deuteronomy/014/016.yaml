source:
  edition: WLC
  text: אֶת הַ/כּ֥וֹס וְ/אֶת הַ/יַּנְשׁ֖וּף וְ/הַ/תִּנְשָֽׁמֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/016.yaml
  text: the little owl[a], the great owl, and the white owl;
translation:
  language: vi
  text: chim cú nhỏ[a], chim cú lớn và chim cú trắng;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chính xác các tên chim này. Các bản dịch truyền thống và hiện đại có cách dịch khác nhau, thường coi chúng là những loại cú khác nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: chim cú nhỏ
  rationale: Từ này chỉ một loài chim, thường được hiểu là một loại cú trong danh sách các loài không được ăn. Cách dịch này phân biệt nó với hai tên chim kế tiếp nhưng không khẳng định chắc chắn về loài cụ thể.
- source_word: יַנְשׁוּף
  choice: chim cú lớn
  rationale: Tên gọi Hê-bơ-rơ này thường được hiểu là một loài chim hoạt động về đêm, có lẽ thuộc nhóm cú. “Chim cú lớn” giữ được sự phân biệt giữa ba tên trong danh sách.
- source_word: תִּנְשָׁמֶת
  choice: chim cú trắng
  rationale: Trong ngữ cảnh danh sách các loài chim, từ này có lẽ chỉ một loại cú, dù việc xác định chính xác vẫn chưa chắc chắn. “Chim cú trắng” là cách gọi truyền thống giúp phân biệt nó với hai loài trước.
- source_word: אֶת
  choice: không dịch riêng
  rationale: Đây là dấu hiệu chỉ định ngữ trực tiếp trong tiếng Hê-bơ-rơ, không có từ tương đương cần thể hiện riêng trong tiếng Việt.
- source_word: וְ
  choice: và
  rationale: Liên từ nối các mục trong danh sách; tiếng Việt tự nhiên chỉ cần dùng “và” trước mục cuối.
- source_word: הַ
  choice: không dịch riêng
  rationale: Mạo từ xác định của tiếng Hê-bơ-rơ được hiểu theo chức năng liệt kê các loài; tiếng Việt không cần lặp một từ tương đương trước từng tên chim.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chim cú” để tên loài rõ ràng trong một danh sách đứng riêng; giữ dấu chấm phẩy vì câu còn tiếp nối. Chú thích duy trì sự dè dặt cần thiết trước tính bất định về mặt động vật học.
