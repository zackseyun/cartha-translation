  terminology: “Đáng ghê tởm” truyền đạt sức nặng của תּוֹעֵבָה mà không áp đặt thuật ngữ “ô uế.” Chú thích nên nêu một phương án từ vựng thực sự khác biệt, thay vì chỉ lược bỏ từ “đáng.”
