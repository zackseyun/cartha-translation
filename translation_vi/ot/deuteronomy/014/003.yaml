  text: לֹ֥א תֹאכַ֖ל כָּל תּוֹעֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/003.yaml
  text: You shall not eat any detestable thing[a].
translation:
  language: vi
  text: Ngươi không được ăn bất cứ thứ gì đáng ghê tởm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bất cứ điều ghê tởm nào.” Từ Hê-bơ-rơ chỉ điều bị xem là ghê tởm hoặc đáng loại bỏ; tại đây, từ này mở đầu danh sách các thức ăn bị cấm ở phần tiếp theo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכַל
  choice: không được ăn
  rationale: Trong văn luật pháp, לֹא đi với động từ chưa hoàn thành ngôi hai số ít diễn đạt lệnh cấm trực tiếp. “Không được ăn” tự nhiên trong tiếng Việt hiện đại và giữ nguyên sức nặng pháp lý.
- source_word: כָּל
  choice: bất cứ
  rationale: Dưới cấu trúc phủ định và đi với danh từ số ít, “bất cứ” truyền đạt phạm vi bao quát của lệnh cấm một cách tự nhiên.
- source_word: תּוֹעֵבָה
  choice: vật gì đáng ghê tởm
  rationale: Danh từ chỉ một vật bị xem là ghê tởm, đáng kinh tởm hoặc đáng loại bỏ. Trong ngữ cảnh này, nó mở đầu danh sách các thức ăn bị cấm, nhưng bản dịch không thu hẹp nghĩa thành một thuật ngữ nghi lễ cụ thể.
theological_decisions:
- issue: Sức bắt buộc của câu trong luật giao ước
  choice: 'Dịch như một lệnh cấm trực tiếp: “Ngươi không được ăn…”'
  alternative: 'Dịch như một lời mô tả chung: “Ngươi không ăn…”'
  rationale: Cấu trúc לֹא + động từ chưa hoàn thành trong văn cảnh luật pháp mang sức cấm đoán, chứ không đơn thuần dự báo hay mô tả hành vi.
- issue: Phạm vi nghĩa của תּוֹעֵבָה trong văn cảnh thức ăn
  choice: Giữ cách nói rộng “vật gì đáng ghê tởm”
  alternative: Diễn giải cụ thể là “thức ăn ô uế”
  rationale: Câu kế tiếp sẽ xác định các loài vật liên quan; bản thân câu này dùng thuật ngữ rộng. Không nên đưa khái niệm “ô uế” vào chính văn khi từ đó không xuất hiện tại đây.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Đại từ “ngươi” giữ sắc thái lời luật giao ước hướng đến người nghe số ít, nhưng không dùng cấu trúc cổ khó hiểu.
