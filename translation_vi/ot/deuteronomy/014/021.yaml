  terminology: “Người ngoại kiều” và “người nước ngoài” phân biệt hợp lý hai thuật ngữ pháp lý-xã hội. “Dân thánh,” “Yahweh,” và “Đức Chúa Trời” phù hợp với đăng ký bản dịch. “Luộc dê con trong sữa mẹ nó” bảo toàn hình ảnh cụ thể của tiếng Hê-bơ-rơ.
