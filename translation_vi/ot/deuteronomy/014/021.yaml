  verdict: revise
  source_fidelity: 'Cần sửa hai điểm để sát nguyên văn hơn: נְבֵלָה không chỉ giới hạn vào con vật “chết tự nhiên” mà là xác súc vật không được giết mổ theo cách được phép; và תְבַשֵּׁל cụ thể là “luộc,” không chỉ là “nấu.” Bản sửa vẫn giữ sắc thái cho phép của các động từ cho/bán và phân biệt גֵּר với נָכְרִי.'
