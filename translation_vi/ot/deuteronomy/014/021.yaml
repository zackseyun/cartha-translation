base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: vi
  text: Anh em không được ăn bất cứ xác con vật nào.[a] Anh em có thể cho người ngoại kiều đang sống trong các thành của anh em, để người ấy ăn; hoặc bán nó cho người nước ngoài.[b] Vì anh em là một dân thánh thuộc về Yahweh, Đức Chúa Trời của anh em. Anh em không được luộc dê con trong sữa mẹ nó.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bất cứ con vật chết nào.” Từ Hê-bơ-rơ chỉ xác một con vật không được giết mổ theo cách được phép dùng làm thức ăn; điều này có thể bao gồm con vật chết tự nhiên.'
    reason: lexical_alternative
  - marker: b
    text: “Người ngoại kiều” chỉ người thuộc dân khác nhưng cư trú giữa Israel; khác với “người nước ngoài” ở vế kế tiếp. Nguyên văn nói “ở trong các cổng của anh em,” một thành ngữ chỉ người sống trong các thành hoặc cộng đồng của Israel.
    reason: lexical_and_cultural_note
  - marker: c
    text: “Dê con” cũng có thể dịch là “dê non.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: xác con vật nào chết tự nhiên
  rationale: Chỉ xác súc vật chết mà không được giết theo cách hợp lệ; cách dịch này làm rõ nguyên nhân khiến nó không được dùng làm thức ăn, đồng thời tránh nghĩa quá rộng của từ “xác” đứng riêng.
- source_word: גֵּר
  choice: người ngoại kiều đang sống trong các thành của mình
  rationale: Chỉ người không phải dân bản xứ nhưng cư trú giữa Israel và có địa vị xã hội được thừa nhận; “ngoại kiều” giữ được sự phân biệt với נָכְרִי ở vế sau.
- source_word: בִּשְׁעָרֶיךָ
  choice: trong các thành của mình
  rationale: Nghĩa đen là “trong các cổng của anh em,” một thành ngữ chỉ các thành hoặc cộng đồng thuộc quyền quản trị của Israel; dịch theo nghĩa thành ngữ tự nhiên trong tiếng Việt.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: có thể cho ... để người ấy ăn
  rationale: Trong văn phong luật pháp, các động từ cho phép việc xử lý xác con vật theo cách này, chứ không nhất thiết bắt buộc phải cho; “có thể” truyền đạt chức năng cho phép tự nhiên hơn.
- source_word: נָכְרִי
  choice: người nước ngoài
  rationale: Chỉ người thuộc dân khác, không mang địa vị cư trú như גֵּר; cách dịch này giữ sự phân biệt giữa hai nhóm.
- source_word: עַם קָדוֹשׁ
  choice: một dân thánh
  rationale: Giữ nguyên ngôn ngữ giao ước về một dân được biệt riêng cho Đức Chúa Trời, không làm nhẹ sắc thái thần học.
- source_word: לַיהוָה
  choice: thuộc về Yahweh
  rationale: Giới từ לְ diễn tả sự quy thuộc hoặc được biệt riêng cho Yahweh; thêm “thuộc về” làm rõ quan hệ ấy trong tiếng Việt.
- source_word: גְּדִי
  choice: dê con
  rationale: Tự nhiên, rõ nghĩa với độc giả hiện đại và chính xác hơn một từ có thể gây mơ hồ.
- source_word: תְבַשֵּׁל
  choice: nấu
  rationale: Động từ có thể chỉ nấu chín, thường là luộc hoặc nấu trong chất lỏng; “nấu” tự nhiên trong tiếng Việt và không thu hẹp quá mức phương thức chế biến.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: trong sữa mẹ nó
  rationale: Bám sát hình ảnh cụ thể và quan hệ sở hữu của nguyên văn.
theological_decisions:
- issue: Cách dịch danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Sắc thái pháp lý của các động từ cho và bán
  choice: 'cách diễn đạt cho phép: “có thể cho ... hoặc có thể bán”'
  alternative: 'cách diễn đạt mệnh lệnh: “hãy cho ... hoặc hãy bán”'
  rationale: Mạch luật trước hết cấm Israel ăn xác con vật và sau đó nêu những cách được phép xử lý; cách dịch cho phép không biến các lựa chọn ấy thành nghĩa vụ bắt buộc.
- issue: Ý nghĩa của “dân thánh”
  choice: giữ nguyên “một dân thánh thuộc về Yahweh”
  alternative: “một dân được biệt riêng cho Yahweh”
  rationale: “Thánh” bảo tồn thuật ngữ giao ước và sức nặng thần học, còn “thuộc về” làm rõ chiều hướng của giới từ mà không giải thích quá mức.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại; dùng “anh em” theo số nhiều để phản ánh đối tượng tập thể của các động từ Hê-bơ-rơ. Tránh lối cổ khó hiểu, đồng thời giữ các thuật ngữ giao ước “dân thánh” và danh riêng “Yahweh.”
