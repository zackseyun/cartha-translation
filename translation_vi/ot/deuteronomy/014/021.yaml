revisions:
- from: Anh em không được ăn bất cứ xác con vật nào chết tự nhiên.[a] Anh em có thể cho người ngoại kiều đang sống trong các thành của mình,[b] để người ấy ăn; hoặc có thể bán cho người nước ngoài. Vì anh em là một dân thánh thuộc về Yahweh, Đức Chúa Trời của anh em. Anh em không được nấu dê con trong sữa mẹ nó.[c]
  to: Anh em không được ăn bất cứ xác con vật nào.[a] Anh em có thể cho người ngoại kiều đang sống trong các thành của anh em, để người ấy ăn; hoặc bán nó cho người nước ngoài.[b] Vì anh em là một dân thánh thuộc về Yahweh, Đức Chúa Trời của anh em. Anh em không được luộc dê con trong sữa mẹ nó.[c]
  rationale: Thay “chết tự nhiên” bằng cách dịch bao quát hơn trong bản văn chính, rồi giải thích phạm vi pháp lý của từ trong chú thích. Thay “nấu” bằng “luộc” để phản ánh chính xác động từ Hê-bơ-rơ. Các sửa đổi còn lại chỉ làm rõ đại từ và đối tượng của hành động bán, không thay đổi nghĩa.
