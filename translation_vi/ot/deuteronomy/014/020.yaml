  text: כָּל ע֥וֹף טָה֖וֹר תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/020.yaml
  text: You may eat any clean bird[a].
translation:
  language: vi
  text: Anh em được phép ăn mọi loài chim thanh sạch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: mọi
  rationale: Từ chỉ lượng này bao quát toàn bộ các loài thuộc phạm vi được nêu; “mọi” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: עוֹף
  choice: loài chim
  rationale: Dù từ Hê-bơ-rơ có thể chỉ sinh vật bay nói chung, ngữ cảnh luật thực phẩm ở các câu liền trước đang nói cụ thể về chim; “loài chim” rõ nghĩa và tự nhiên.
- source_word: טָהוֹר
  choice: thanh sạch
  rationale: Trong luật về thực phẩm, đây là phạm trù nghi lễ đối lập với “ô uế”; “thanh sạch” giữ được sắc thái chuyên biệt ấy hơn nghĩa thuần túy vệ sinh.
- source_word: תֹּאכֵלוּ
  choice: anh em được phép ăn
  rationale: Thể vị hoàn thành chưa trọn 2 số nhiều trong ngữ cảnh luật pháp diễn đạt điều được cho phép, tương phản với những điều bị cấm ở các câu trước; cách dịch này truyền đạt rõ lực ngôn trung mà không biến thành mệnh lệnh phải ăn.
theological_decisions:
- issue: Lực của động từ trong luật thực phẩm
  choice: được phép ăn
  alternative: sẽ ăn / phải ăn
  rationale: Ngữ cảnh phân biệt thức ăn được phép với thức ăn bị cấm, nên câu này trao quyền cho phép chứ không truyền lệnh phải ăn mọi loài chim thanh sạch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để biểu đạt ngôi thứ hai số nhiều hướng đến cộng đồng giao ước; không thêm chú thích vì trật tự câu tiếng Việt đã tự nhiên mà vẫn bảo toàn đầy đủ ý nghĩa nguồn.
