id: DEU.14.8
reference: Deuteronomy 14:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: vi
  text: Còn loài heo, vì có móng chẻ nhưng không nhai lại, nên là ô uế đối với anh em. Anh em không được ăn thịt của chúng, cũng không được chạm vào xác chết của chúng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  choice: loài heo
  rationale: “Heo” là cách gọi hiện đại, phổ thông trong tiếng Việt; thêm “loài” giúp câu chuyển tự nhiên từ một danh từ số ít chỉ cả giống loài sang các đại từ số nhiều ở vế sau.
- source_word: מַפְרִיס פַּרְסָה
  choice: có móng chẻ
  rationale: Diễn đạt tự nhiên tiêu chuẩn phân loại động vật theo móng, đồng thời giữ sát hình ảnh của nguyên văn.
- source_word: וְלֹא גֵרָה
  choice: nhưng không nhai lại
  rationale: “Nhai lại” là thuật ngữ tiếng Việt thông dụng và chính xác cho hiện tượng được nói đến; liên từ “nhưng” thể hiện sự tương phản giữa hai tiêu chuẩn.
- source_word: טָמֵא
  choice: ô uế
  rationale: Giữ phạm trù thanh sạch theo luật Torah mà không biến nó thành lời phán xét về sự xấu xa đạo đức.
- source_word: מִבְּשָׂרָם
  choice: thịt của chúng
  rationale: “Thịt” tự nhiên trong lệnh cấm ăn; “của chúng” bảo toàn hậu tố số nhiều của tiếng Hê-bơ-rơ, hiểu về các cá thể thuộc loài vừa nêu.
- source_word: נִבְלָתָם
  choice: xác chết của chúng
  rationale: Chỉ xác động vật đã chết và giữ hậu tố số nhiều của nguyên văn; cách nói này rõ nghĩa hơn chỉ dùng “xác”.
- source_word: תִגָּעוּ
  choice: chạm vào
  rationale: Truyền đạt trực tiếp động từ “chạm”, không mở rộng thành “đến gần” hay thu hẹp thành “cầm, xử lý”.
theological_decisions:
- issue: Bản chất của tình trạng ô uế trong luật ăn uống Torah
  choice: Dịch טָמֵא là “ô uế” mà không thêm lời giải thích thần học về đạo đức.
  alternative: “không thanh sạch” hoặc “bị ô nhiễm”
  rationale: Nguyên văn xác định địa vị theo luật giao ước; bản dịch không nên đồng nhất điều này với bản chất xấu xa về đạo đức.
- issue: Hiệu lực của lệnh cấm chạm vào xác chết
  choice: 'Giữ mệnh lệnh trực tiếp: “không được chạm vào”.'
  alternative: “không được đụng đến” hoặc “không được đến gần”
  rationale: Động từ נגע có nghĩa trực tiếp là “chạm”; cách dịch này không làm nhẹ hoặc mở rộng phạm vi lệnh cấm.
- issue: Hậu tố số nhiều sau danh từ chỉ loài ở số ít
  choice: Giữ “thịt của chúng” và “xác chết của chúng”.
  alternative: “thịt của nó” và “xác chết của nó”
  rationale: Hai hậu tố tiếng Hê-bơ-rơ đều ở số nhiều, có thể quy chiếu đến các cá thể thuộc loài heo được nêu theo nghĩa tập hợp. Bản dịch giữ đặc điểm hình thái này thay vì âm thầm đồng nhất hóa sang số ít.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “anh em” để chỉ cộng đồng giao ước theo lối xưng hô số nhiều; dùng “heo” là từ hiện đại phổ thông, không dùng từ cổ hoặc quá chuyên biệt.
