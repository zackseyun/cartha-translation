  naturalness: Câu tiếng Việt hiện đại, rõ ràng và phù hợp văn phong luật lệ. “Heo,” “móng chẻ,” “nhai lại,” và “chạm vào” đều tự nhiên. Cách xưng hô “anh em” giữ được sắc thái mệnh lệnh gửi cộng đồng trong văn cảnh Kinh Thánh.
  terminology: '“Ô uế” là thuật ngữ thích hợp cho טָמֵא trong luật Torah và không áp đặt ý nghĩa đạo đức. “Xác chết” truyền đạt đúng נִבְלָה là xác động vật chết/carcass. Không cần giữ các chú thích tiếng Anh: chú thích a chỉ là phương án từ vựng Anh ngữ, còn chú thích b vừa không cần thiết trong tiếng Việt vừa được gắn neo không phù hợp trong bản tiếng Anh.'
