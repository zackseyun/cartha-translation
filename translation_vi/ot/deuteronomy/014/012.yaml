  text: וְ/זֶ֕ה אֲשֶׁ֥ר לֹֽא תֹאכְל֖וּ מֵ/הֶ֑ם הַ/נֶּ֥שֶׁר וְ/הַ/פֶּ֖רֶס וְ/הָֽ/עָזְנִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: vi
  text: 'Còn đây là những loài anh em không được ăn trong số đó: đại bàng[a], kền kền râu và kền kền đen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Việc xác định chính xác các tên chim Hê-bơ-rơ trong câu này chưa chắc chắn. “Đại bàng” cũng có thể chỉ một loài kền kền lớn; “kền kền râu” theo cách gọi truyền thống là “chim đập xương”; còn “kền kền đen” được một số bản dịch gọi là “chim ưng cá” hoặc “đại bàng biển”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Còn đây là những loài
  rationale: Dạng Hê-bơ-rơ là số ít, sát nghĩa là “và đây là”, nhưng cụm này mở đầu một danh sách nhiều loài; cách diễn đạt tiếng Việt dùng “những loài” để tự nhiên và làm rõ chức năng giới thiệu danh sách.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: trong số chúng mà anh em không được ăn
  rationale: Giữ nghĩa phân cách của מִן là “trong số chúng” và diễn đạt lệnh cấm trực tiếp. Đại từ ngôi hai số nhiều được chuyển là “anh em”, phù hợp lời Môi-se nói với cộng đồng Y-sơ-ra-ên.
- source_word: הַנֶּשֶׁר
  choice: đại bàng
  rationale: Đây là cách gọi truyền thống, quen thuộc và khả dĩ; tuy nhiên, từ Hê-bơ-rơ có thể chỉ một loài chim ăn thịt lớn, kể cả một loài kền kền, nên sự bất định được ghi ở chú thích.
- source_word: הַפֶּרֶס
  choice: kền kền râu
  rationale: Chọn tên hiện đại của loài thường được đề xuất cho từ này; cách gọi cổ truyền tương đương “chim đập xương” ít tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: הָעָזְנִיָּה
  choice: kền kền đen
  rationale: Đây là một nhận dạng hiện đại thường gặp, nhưng tên loài chính xác vẫn chưa chắc chắn; các phương án khác được bảo lưu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến toàn cộng đồng; giữ danh sách tên chim ngắn gọn, đồng thời đặt dấu chú thích [a] ngay sau mục đầu để áp dụng cho cả ba nhận dạng còn bất định.
