base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/005.yaml
  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: vi
  text: nai[a], linh dương gazen, hoẵng, dê rừng, dê núi ibex, linh dương và cừu núi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên của một số loài vật trong câu này chưa được xác định chắc chắn. “Hoẵng” cũng có thể là hươu Dama hoặc hươu đỏ; “dê rừng” có thể là dê núi ibex; “dê núi ibex” cũng có thể là linh dương addax; “linh dương” có thể là bò rừng hoặc bò rừng cổ đại; “cừu núi” có thể là sơn dương chamois hoặc dê núi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: nai
  rationale: Chỉ loài hươu/nai nói chung; “nai” là từ hiện đại, tự nhiên và không thu hẹp nghĩa vào con đực.
- source_word: צְבִי
  choice: linh dương gazen
  rationale: Thường được nhận diện là gazelle; cách gọi này rõ hơn “linh dương” đơn thuần và giúp phân biệt với תְּאוֹ ở cuối danh sách.
- source_word: יַחְמוּר
  choice: hoẵng
  rationale: Tên loài chính xác chưa chắc chắn; “hoẵng” diễn đạt tự nhiên một loài thuộc họ hươu, còn các khả năng khác được ghi trong chú thích.
- source_word: אַקּוֹ
  choice: dê rừng
  rationale: Có lẽ là một loài dê hoang, thường được đồng nhất với ibex; “dê rừng” dễ hiểu hơn đối với độc giả phổ thông.
- source_word: דִישֹׁן
  choice: dê ibex
  rationale: Việc nhận diện còn gây tranh luận; giữ tên loài ibex giúp phân biệt mục này với “dê rừng” ngay trước đó mà không che giấu tính kỹ thuật của cách nhận diện.
- source_word: תְּאוֹ
  choice: linh dương
  rationale: Có thể chỉ một loài linh dương, dù một số cách hiểu cho rằng đây là bò rừng; lựa chọn chính phù hợp với chuỗi thú nhai lại hoang dã và các phương án khác được bảo lưu trong chú thích.
- source_word: זָמֶר
  choice: cừu núi
  rationale: Tên loài không chắc chắn; “cừu núi” dễ hiểu và diễn đạt loại thú được đề xuất, trong khi sơn dương chamois hoặc dê núi vẫn được nêu như các khả năng khác.
theological_decisions: []
translation_notes:
  register: Dùng văn phong liệt kê ngắn gọn, trang trọng nhưng hiện đại. Các tên thông dụng bằng tiếng Việt được ưu tiên; những tên vay mượn kỹ thuật như gazen, ibex, addax và chamois chỉ được dùng khi cần phân biệt các loài hoặc bảo lưu sự bất định của từ Hê-bơ-rơ.
