  rationale: Điều chỉnh trật tự từ để làm rõ rằng “có cánh” xác định phạm trù loài bay trong cụm Hê-bơ-rơ, không phải chỉ là một đặc điểm phụ của “loài vật lúc nhúc”. Giữ “ô uế”, “đối với anh em”, và “không được ăn chúng” vì chúng truyền đạt đúng sắc thái luật lệ và quy chiếu số nhiều của nguyên văn.
