base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: vi
  text: Mọi sinh vật có cánh lúc nhúc[a] đều ô uế đối với anh em; không được ăn chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi sinh vật lúc nhúc biết bay” hoặc “mọi sinh vật lúc nhúc có cánh.” Cụm từ Hê-bơ-rơ ghép “sinh vật lúc nhúc” với “loài bay/sinh vật có cánh”; trong ngữ cảnh này, cụm từ có lẽ chủ yếu chỉ các loài côn trùng bay, chứ không phải chim theo nghĩa thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Mọi
  rationale: כֹל diễn tả phạm vi bao quát; trong tiếng Việt, “mọi” tự nhiên và đủ sức nối tiếp mạch luật lệ mà không nhất thiết phải dịch riêng וְ bằng “và” ở đầu câu.
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: loài vật lúc nhúc có cánh
  rationale: Cụm Hê-bơ-rơ kết hợp שֶׁרֶץ, sinh vật nhỏ chuyển động thành đàn hoặc lúc nhúc, với עוֹף, loài bay hay sinh vật có cánh. Cách dịch này giữ được hình ảnh gốc và không đồng nhất hoàn toàn đối tượng với chim; chú thích nêu cách hiểu có khả năng nhất là côn trùng bay.
- source_word: טָמֵא
  choice: ô uế
  rationale: “Ô uế” là thuật ngữ tự nhiên trong văn cảnh thanh sạch nghi lễ và luật ăn uống, tránh biến phạm trù giao ước thành nhận xét chung về sự bẩn thỉu.
- source_word: הוּא לָ/כֶם
  choice: đều ô uế đối với anh em
  rationale: “Đối với anh em” giữ hướng quy chiếu của לָכֶם tới cộng đồng Y-sơ-ra-ên; “đều” chuyển tải tự nhiên tính bao quát của chủ ngữ phân phối cùng lời khẳng định הוּא.
- source_word: לֹא יֵאָכֵלוּ
  choice: không được ăn chúng
  rationale: Thể bị động số nhiều trong tiếng Hê-bơ-rơ được diễn đạt bằng lối cấm đoán vô nhân xưng tự nhiên của tiếng Việt; “chúng” bảo toàn quy chiếu số nhiều thay vì đổi thành một đối tượng số ít.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. “Anh em” dùng cho đại từ số nhiều hướng đến toàn thể cộng đồng. Cụm “loài vật lúc nhúc có cánh” cố ý giữ độ rộng và phần nào sự lạ của cách phân loại Hê-bơ-rơ; chú thích giải thích cách hiểu thông dụng hơn.
