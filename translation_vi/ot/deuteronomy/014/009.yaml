  - severity: low
    issue: “những loài sau đây”
    rationale: Câu nguồn dùng đại từ chỉ định tập hợp (“đây/những loài này”), không nhất thiết báo trước một danh sách. Có thể giữ ý này mà không thêm sắc thái liệt kê.
  revised_text: 'Trong mọi loài sống trong nước, đây là những loài các ngươi được ăn: mọi loài có vây và vảy thì các ngươi được ăn.'
