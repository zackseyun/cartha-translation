  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: vi
  text: 'Trong mọi loài sống trong nước, đây là những loài các ngươi được ăn: mọi loài có vây và vảy thì các ngươi được ăn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: các ngươi được ăn những loài sau đây
  rationale: Diễn đạt tự nhiên cấu trúc mở đầu “đây là những gì các ngươi được ăn”, đồng thời giữ sắc thái cho phép trong quy định về thức ăn.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: trong mọi loài ở dưới nước
  rationale: Trong ngữ cảnh phân loại sinh vật làm thức ăn, אֲשֶׁר chỉ các loài/sinh vật; “ở dưới nước” là cách nói tiếng Việt tự nhiên.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: vây và vảy
  rationale: Các thuật ngữ thông dụng, chính xác để chỉ hai đặc điểm của loài vật sống dưới nước.
- source_word: תֹּאכֵלוּן
  choice: các ngươi được ăn
  rationale: Hình thái yiqtol trong văn mạch luật lệ mang ý nghĩa cho phép; lặp lại động từ theo nguyên văn để nhấn mạnh tiêu chuẩn.
