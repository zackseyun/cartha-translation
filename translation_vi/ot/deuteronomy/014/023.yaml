  to: 'Anh em phải ăn trước mặt Yahweh, Đức Chúa Trời của anh em, tại nơi Ngài sẽ chọn để danh Ngài ngự tại đó[a]: phần mười ngũ cốc, rượu mới và dầu của anh em, cùng các con đầu lòng của đàn bò và đàn chiên dê của anh em, để anh em học kính sợ Yahweh, Đức Chúa Trời của anh em, suốt đời.'
