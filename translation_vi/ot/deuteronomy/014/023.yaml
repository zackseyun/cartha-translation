  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: vi
  text: 'Anh em phải ăn trước mặt Yahweh, Đức Chúa Trời của anh em, tại nơi Ngài sẽ chọn để danh Ngài ngự tại đó[a]: phần mười ngũ cốc, rượu mới và dầu của anh em, cùng các con đầu lòng của đàn bò và đàn chiên dê của anh em, để anh em học kính sợ Yahweh, Đức Chúa Trời của anh em, suốt đời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để Ngài làm cho danh Ngài ngự tại đó” hoặc “để Ngài đặt danh Ngài tại đó.” Tiếng Hê-bơ-rơ giữ thành ngữ về việc Yahweh đặt danh Ngài tại nơi thánh được chọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Anh em phải ăn
  rationale: Dạng động từ trong mạch luật lệ mang sắc thái chỉ thị. “Phải ăn” diễn đạt rõ sức nặng của mệnh lệnh; “anh em” tự nhiên trong tiếng Việt và chỉ cộng đồng Israel được ngỏ lời như một tập thể.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: trước mặt Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ hình ảnh trực tiếp của לִפְנֵי, nghĩa là “trước mặt/trong sự hiện diện của”, đồng thời dùng danh riêng Yahweh cho יהוה.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: tại nơi Ngài sẽ chọn
  rationale: Giữ ý hướng tới việc Yahweh chọn nơi thờ phượng; “tại nơi” tự nhiên với hành động ăn và hiện diện.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để danh Ngài ngự ở đó
  rationale: Bảo tồn thành ngữ thần học về danh Yahweh ngự tại nơi được chọn, nhưng chú thích các cách hiểu mang sắc thái khiến cho ngự hoặc đặt danh.
- source_word: מַעְשַׂר דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: phần mười ngũ cốc, rượu mới và dầu của anh em
  rationale: “Phần mười” dễ hiểu hơn thuật ngữ Hán-Việt chuyên biệt; “rượu mới” giữ nét nghĩa của תִּירוֹשׁ, còn “dầu” bảo tồn công thức nông sản quen thuộc mà không diễn giải quá mức.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: cùng các con đầu lòng trong đàn bò và đàn chiên dê của anh em
  rationale: Nêu rõ đây là con vật đầu lòng; “đàn chiên dê” phản ánh צֹאן là gia súc nhỏ gồm cả chiên lẫn dê.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: Như vậy, anh em sẽ học biết kính sợ
  rationale: Diễn đạt tự nhiên quan hệ mục đích của לְמַעַן và giữ “kính sợ” để bảo tồn chiều kích vừa tôn kính vừa vâng phục.
- source_word: כָּל הַיָּמִים
  choice: suốt đời
  rationale: Cách nói tự nhiên trong tiếng Việt cho ý liên tục “mọi ngày”, trong toàn bộ đời sống.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng dạng phiên âm của danh riêng trong tiếng Hê-bơ-rơ, tránh thay danh ấy bằng một tước hiệu và không áp đặt truyền thống hệ phái.
- issue: Công thức nơi thánh לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để danh Ngài ngự ở đó
  alternative: để Ngài làm cho danh Ngài ngự ở đó; để đặt danh Ngài ở đó
  rationale: Giữ nguyên hình ảnh “danh” của Đức Chúa Trời ngự tại nơi được chọn, không đồng nhất cách đơn giản danh Ngài với việc bản thể Ngài bị giới hạn trong nơi thánh; chú thích bảo tồn tính đa nghĩa của dạng Hiphil.
- issue: Ý nghĩa của לְיִרְאָה
  choice: kính sợ
  alternative: kính kính; tôn kính
  rationale: “Kính sợ” giữ được sự căng thẳng giữa lòng tôn kính, ý thức về uy quyền và sự vâng phục, thay vì làm nhẹ thành thái độ kính trọng đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng để diễn đạt đại từ số ít mang tính tập thể, chỉ Israel; cách này tự nhiên hơn “ngươi” trong tiếng Việt hiện đại. Câu được chia làm hai để tránh chuỗi thành phần quá dài nhưng vẫn giữ trật tự tư tưởng và quan hệ mục đích của nguyên văn.
