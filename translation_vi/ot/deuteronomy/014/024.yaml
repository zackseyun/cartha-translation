  text: וְ/כִֽי יִרְבֶּ֨ה מִמְּ/ךָ֜ הַ/דֶּ֗רֶךְ כִּ֣י לֹ֣א תוּכַ֘ל שְׂאֵת/וֹ֒ כִּֽי יִרְחַ֤ק מִמְּ/ךָ֙ הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לָ/שׂ֥וּם שְׁמ֖/וֹ שָׁ֑ם כִּ֥י יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: vi
  text: Và nếu đường đi quá xa đối với anh em, đến nỗi anh em không thể mang phần mười ấy đi, vì nơi mà Gia-vê, Đức Chúa Trời của anh em, sẽ chọn để đặt danh Ngài tại đó quá xa đối với anh em, khi Gia-vê, Đức Chúa Trời của anh em, ban phước cho anh em,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì Gia-vê, Đức Chúa Trời của anh em, ban phước cho anh em.” Liên từ Hê-bơ-rơ כִּי ở đây có thể chỉ nguyên nhân cũng như hoàn cảnh thời gian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nhưng nếu
  rationale: Mở đầu trường hợp ngoại lệ nối tiếp luật lệ trước đó; “nhưng nếu” diễn đạt tự nhiên cả liên từ וְ lẫn sắc thái điều kiện của כִּי.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: đường đi quá xa đối với anh em
  rationale: Thành ngữ nói con đường vượt quá khả năng thực tế của người mang lễ vật; cách dịch này tự nhiên trong tiếng Việt và phù hợp với mệnh đề nói nơi ấy ở xa.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: anh em không thể mang phần mười ấy đi
  rationale: נשא chỉ hành động mang theo bằng sức lực; bổ sung “phần mười ấy” làm rõ đại từ chỉ vật dựa trên ngữ cảnh trực tiếp mà không thay đổi nghĩa.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: nơi ... quá xa anh em
  rationale: Giữ nghĩa không gian của רחק và thuật ngữ quan trọng “nơi” trong Phục truyền luật lệ ký.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: Giê-hô-va, Đức Chúa Trời của anh em, sẽ chọn
  rationale: Dịch yiqtol theo nghĩa tương lai trong bối cảnh luật pháp nói về địa điểm thờ phượng sẽ được chỉ định.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc và trang trọng trong tiếng Việt để biểu đạt trực tiếp Danh giao ước.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: để đặt danh Ngài tại đó
  rationale: Bảo toàn công thức giao ước đặc trưng của Phục truyền luật lệ ký mà không diễn giải thành một hệ thống thần học cụ thể.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: khi Giê-hô-va, Đức Chúa Trời của anh em, ban phước cho anh em
  rationale: “Khi” thể hiện hoàn cảnh sự dư dật do phước lành làm phát sinh khó khăn vận chuyển, đồng thời ghi chú cách hiểu nhân quả cũng có thể có.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ ghi trực tiếp Danh giao ước; bản dịch giữ một danh riêng thay vì thay bằng tước hiệu “CHÚA”. “Giê-hô-va” là dạng dễ nhận biết trong tiếng Việt hiện đại.
- issue: Quan hệ của mệnh đề כִּי יְבָרֶכְךָ
  choice: khi ... ban phước
  alternative: vì ... ban phước
  rationale: כִּי có thể mang nghĩa thời gian/hoàn cảnh hoặc nguyên nhân. Chính văn chọn cách đọc phù hợp với dòng luật lệ, còn chú thích bảo tồn cách đọc nhân quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít tập thể hướng đến từng người trong cộng đồng giao ước. Câu được để mở bằng dấu phẩy vì nội dung cú pháp tiếp tục sang câu 25.
