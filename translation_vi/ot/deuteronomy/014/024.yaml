  - marker: a
    text: 'Cũng có thể dịch: “vì Gia-vê, Đức Chúa Trời của anh em, ban phước cho anh em.” Liên từ Hê-bơ-rơ כִּי ở đây có thể chỉ nguyên nhân cũng như hoàn cảnh thời gian.'
    reason: lexical_alternative
