  text: the pelican[a], the carrion vulture, and the cormorant[c][b],
translation:
  language: vi
  text: chim bồ nông[a], kền kền[b] và chim cốc[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chắc chắn các tên chim Hê-bơ-rơ trong câu này. Từ này cũng có thể được dịch là “cú sa mạc” hoặc đơn giản là “chim cú.”
    reason: lexical_alternative
  - marker: b
    text: Hoặc “chim kền kền”; các bản dịch tiếng Anh cũ dùng “đại bàng gier.” Từ Hê-bơ-rơ có lẽ chỉ một loài chim ăn xác.
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ này cũng có thể chỉ một loài chim nước khác, chẳng hạn chim bồ nông hoặc một loài cú bắt cá.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּאָת
  choice: chim bồ nông
  rationale: Danh tính loài chim này không chắc chắn. “Chim bồ nông” là cách hiểu truyền thống, khá dễ nhận biết và phù hợp với ngữ cảnh liệt kê các loài chim; các khả năng khác được ghi ở chú thích.
- source_word: הָרָחָמָה
  choice: kền kền ăn xác
  rationale: Từ Hê-bơ-rơ có lẽ chỉ một loài chim săn mồi hoặc ăn xác. Cách dịch này dùng tiếng Việt hiện đại và diễn đạt rõ đặc tính kiếm ăn có khả năng được hàm ý.
- source_word: הַשָּׁלָךְ
  choice: chim cốc
  rationale: Danh tính chính xác còn được tranh luận, nhưng từ này có lẽ chỉ một loài chim nước bắt cá; “chim cốc” là cách gọi tự nhiên và phù hợp trong tiếng Việt, còn các khả năng khác được bảo lưu ở chú thích.
- source_word: וְ / וְאֶת
  choice: và / không dịch riêng dấu hiệu tân ngữ
  rationale: Liên từ וְ được dịch là “và”; אֵת là dấu hiệu tân ngữ xác định trong tiếng Hê-bơ-rơ nên không có từ tương đương cần dịch riêng trong tiếng Việt.
