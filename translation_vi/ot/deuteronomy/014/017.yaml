review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng ba danh từ chim có mạo từ xác định trong tiếng Hê-bơ-rơ và liên từ nối cuối danh sách. Các định danh loài đều bất định; việc dùng chú thích cho các khả năng khác là phù hợp. Tuy nhiên, “kền kền ăn xác” không phải là tên gọi loài tự nhiên trong tiếng Việt và chú thích “cũng có thể dịch là kền kền” trở nên gần như trùng với bản văn chính.
  naturalness: “Chim bồ nông … và chim cốc” tự nhiên trong tiếng Việt chuẩn. Nên dùng “kền kền” thay cho cụm mô tả thừa “kền kền ăn xác”; đặc tính ăn xác có thể được nêu trong chú thích như một cơ sở nhận diện, không cần biến thành bộ phận của tên chim.
  terminology: Các tên “chim bồ nông,” “kền kền,” và “chim cốc” là các cách gọi hiện đại, dễ hiểu. Chú thích a cần nói về “tên chim Hê-bơ-rơ,” thay vì cách nói dễ gây hiểu là các loài chim “mang tên Hê-bơ-rơ.”
  issues:
