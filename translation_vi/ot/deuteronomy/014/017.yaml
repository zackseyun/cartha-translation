translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Tên loài chim được chọn theo tương đương tối ưu; sự bất định thực sự trong việc nhận diện các loài được giữ lại bằng chú thích. Dấu phẩy cuối câu được giữ vì đây là một mục trong danh sách tiếp nối từ ngữ cảnh.
