  text: You may eat any clean bird[a].
translation:
  language: vi
  text: Anh em được phép ăn mọi loài chim thanh sạch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: mọi loài
  rationale: Từ chỉ lượng này bao quát toàn bộ phạm vi được nói đến. Trong tiếng Việt, “mọi loài” đi với danh từ “chim” diễn đạt tự nhiên sự cho phép đối với tất cả các loài thuộc nhóm thanh sạch.
- source_word: צִפּוֹר
  choice: chim
  rationale: Danh từ này thông thường chỉ chim; “chim” là cách dịch rõ ràng, tự nhiên và phù hợp với ngữ cảnh luật về thức ăn.
- source_word: טְהֹרָה
  choice: thanh sạch
  rationale: Trong ngữ cảnh luật nghi lễ và thức ăn, từ này chỉ hạng mục được luật định là thanh sạch, chứ không chủ yếu nói đến sự tinh khiết về đạo đức. “Thanh sạch” giữ được sắc thái nghi lễ và phân biệt với nghĩa vệ sinh thông thường.
- source_word: תֹּאכֵלוּ
  choice: anh em được phép ăn
  rationale: Động từ ở ngôi thứ hai số nhiều trong điều luật này biểu thị sự cho phép. “Được phép ăn” truyền đạt chức năng pháp lý ấy rõ hơn cách hiểu như một mệnh lệnh bắt buộc phải ăn; “anh em” thể hiện đối tượng số nhiều bằng tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự câu được điều chỉnh tự nhiên cho tiếng Việt, đồng thời giữ rõ phạm trù nghi lễ “thanh sạch” và sắc thái cho phép của điều luật.
