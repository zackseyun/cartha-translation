  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của tiếng Hê-bơ-rơ: כָּל diễn tả phạm vi bao quát («mọi loài»), צִפּוֹר là «chim», טְהֹרָה là phạm trù nghi lễ «thanh sạch», và תֹּאכֵלוּ trong ngữ cảnh luật lệ được diễn đạt phù hợp là «được phép ăn».'
  naturalness: «Anh em được phép ăn mọi loài chim thanh sạch» là câu tiếng Việt hiện đại, rõ ràng và có giọng văn phù hợp với văn bản luật lệ. Cụm «mọi loài chim» diễn đạt tự nhiên ý về mọi chim thuộc hạng được phép ăn.
  terminology: «Thanh sạch» duy trì đúng thuật ngữ nghi lễ trong luật thực phẩm, tránh thu hẹp nghĩa thành vệ sinh hay đạo đức. «Anh em» là cách xưng hô số nhiều quen thuộc, phù hợp với đối tượng được luật truyền dạy trong văn cảnh.
