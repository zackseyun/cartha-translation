  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: vi
  text: Người Lê-vi sẽ đến, vì người ấy không có phần hay cơ nghiệp giữa anh em; ngoại kiều[a], người mồ côi và người góa phụ ở trong các thành của anh em[b] cũng sẽ đến. Họ sẽ ăn và được no đủ, để Yahweh, Đức Chúa Trời của anh em, ban phước cho anh em trong mọi công việc do tay anh em làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người ngoại quốc cư trú.” Từ Hê-bơ-rơ chỉ một người không phải dân Israel nhưng sống giữa cộng đồng Israel.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “ở trong các cổng thành của anh em,” một thành ngữ chỉ những người sống trong các thành hoặc cộng đồng địa phương của anh em.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: sẽ đến
  rationale: Thể hoàn thành Qal có liên từ trong mạch luật lệ mang sắc thái tương lai/chỉ dẫn; “sẽ đến” diễn đạt tự nhiên hành động được dự liệu.
- source_word: הַלֵּוִי
  choice: người Lê-vi
  rationale: Chỉ thành viên thuộc chi phái/tầng lớp Lê-vi, không nhất thiết là thầy tế lễ; vì vậy không thêm chức danh tư tế.
- source_word: חֵלֶק וְנַחֲלָה
  choice: phần hay cơ nghiệp
  rationale: Giữ hai khái niệm song đôi về phần được chia và sản nghiệp thừa kế, đồng thời phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: עִמָּךְ
  choice: cùng anh em
  rationale: Nguyên văn nói “với ngươi” ở số ít tập thể, chỉ dân Israel. “Anh em” truyền đạt tự nhiên lời خطاب cộng đồng mà không biến đối tượng thành một cá nhân đơn lẻ.
- source_word: הַגֵּר
  choice: ngoại kiều
  rationale: Chỉ người không phải dân bản địa nhưng cư trú lâu dài trong cộng đồng Israel; chú thích làm rõ địa vị này.
- source_word: הַיָּתוֹם
  choice: trẻ mồ côi
  rationale: Cách gọi hiện đại, rõ ràng cho nhóm yếu thế được từ Hê-bơ-rơ chỉ đến; trong bối cảnh xã hội cổ, từ này thường đặc biệt hàm ý người mất cha.
- source_word: הָאַלְמָנָה
  choice: người góa bụa
  rationale: Cách dịch trực tiếp, trang trọng và dễ hiểu cho nhóm xã hội được nêu.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: ở trong các thành của anh em
  rationale: “Trong các cổng của ngươi” là thành ngữ hoán dụ chỉ những người sống trong các thành hay cộng đồng địa phương; bản dịch chuyển tải nghĩa, còn chú thích bảo tồn hình ảnh nguyên văn.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: Họ sẽ ăn no nê
  rationale: 'Diễn đạt kết quả dự kiến của việc cung cấp phần mười: họ được ăn đến mức thỏa đủ. Câu riêng giúp quy chiếu số nhiều của chuỗi các nhóm người rõ ràng.'
- source_word: לְמַעַן
  choice: để
  rationale: Giữ quan hệ mục đích/kết quả giữa việc chu cấp cho người yếu thế và phước lành của Đức Chúa Trời.
- source_word: יְבָרֶכְךָ
  choice: ban phước cho anh em
  rationale: Sau לְמַעַן, động từ biểu thị kết quả được hướng đến chứ không nhất thiết là lời dự báo vô điều kiện.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: trong mọi công việc tay anh em làm
  rationale: Giữ hình ảnh “tay” của nguyên văn để chỉ lao động và thành quả, trong một cấu trúc tiếng Việt trang trọng nhưng dễ hiểu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu hoặc một dạng phiên âm truyền thống khác.
- issue: Quan hệ giữa việc chu cấp và phước lành
  choice: “để ... ban phước”
  alternative: “thì ... sẽ ban phước”
  rationale: לְמַעַן cùng thể vị hoàn thành sau đó biểu thị mục đích hoặc kết quả được hướng đến, không khẳng định một cơ chế thưởng công tự động hay lời hứa vô điều kiện.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít tập thể hướng đến Israel; giữ “cơ nghiệp,” “ban phước” và hình ảnh “tay” vì các từ này vẫn quen thuộc trong văn phong Kinh Thánh. Các dấu chú thích được đặt ngay sau đúng thuật ngữ hoặc thành ngữ mà chú thích giải thích, thay vì theo vị trí bị lệch trong lớp tham khảo tiếng Anh.
