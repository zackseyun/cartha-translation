revisions:
- from: Người Lê-vi sẽ đến, vì người ấy không có phần hay cơ nghiệp cùng anh em; ngoại kiều[a], trẻ mồ côi và người góa bụa ở trong các thành của anh em[b] cũng sẽ đến. Họ sẽ ăn no nê, để Yahweh, Đức Chúa Trời của anh em, ban phước cho anh em trong mọi công việc tay anh em làm.
  to: Người Lê-vi sẽ đến, vì người ấy không có phần hay cơ nghiệp giữa anh em; ngoại kiều[a], người mồ côi và người góa phụ ở trong các thành của anh em[b] cũng sẽ đến. Họ sẽ ăn và được no đủ, để Yahweh, Đức Chúa Trời của anh em, ban phước cho anh em trong mọi công việc do tay anh em làm.
  rationale: Bản sửa chỉ điều chỉnh những chỗ cần thiết về độ chính xác từ vựng và tính tự nhiên của tiếng Việt. Cấu trúc giữ riêng người Lê-vi, với lý do người ấy không có phần hay cơ nghiệp, rồi nêu các nhóm dễ tổn thương khác trong cộng đồng; tất cả đều là những người sẽ ăn và được no đủ. “Để” bảo tồn quan hệ mục đích/kết quả của לְמַעַן mà không biến câu thành một bảo đảm máy móc.
