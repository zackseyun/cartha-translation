reference: Deuteronomy 14:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: vi
  text: 'Tuy nhiên, trong số những loài nhai lại hoặc có móng chẻ, anh em không được ăn những loài sau: lạc đà, thỏ rừng[a] và đa man[b]. Vì chúng nhai lại nhưng không có móng chẻ. Chúng là ô uế đối với anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thỏ”; từ Hê-bơ-rơ có lẽ chỉ thỏ rừng, nhưng việc xác định chính xác loài vật này vẫn còn được bàn luận.
    reason: lexical_alternative
  - marker: b
    text: Tức loài hyrax, một loài thú nhỏ sống ở vùng đá; đôi khi còn được gọi là “chuột đá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Diễn tả sự hạn chế, ngoại lệ đối với quy tắc ở câu trước bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: trong số những loài nhai lại
  rationale: “Nhai lại” là cách diễn đạt thông dụng và rõ nghĩa cho thành ngữ Hê-bơ-rơ nói về việc đưa thức ăn lên nhai lại.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: trong số những loài ... có móng chẻ
  rationale: “Móng chẻ” diễn đạt ngắn gọn, tự nhiên đặc điểm chiếc móng bị chia làm hai; cấu trúc “hoặc” giữ hai nhóm được nêu trong câu nguồn.
- source_word: הַגָּמָל
  choice: lạc đà
  rationale: Tên gọi trực tiếp và thông dụng của loài vật này.
- source_word: הָאַרְנֶבֶת
  choice: thỏ rừng
  rationale: Đây là cách nhận diện truyền thống và có khả năng nhất; vì việc xác định chính xác loài vật vẫn còn được bàn luận, phương án khác được ghi ở chú thích.
- source_word: הַשָּׁפָן
  choice: đa man
  rationale: Tên tiếng Việt của hyrax, loài thú nhỏ sống ở vùng đá; tránh dùng những tên có thể khiến độc giả nhầm với lửng hoặc thỏ.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: Vì chúng nhai lại
  rationale: Giữ quan hệ nguyên nhân và lặp lại cùng cách diễn đạt với vế trước.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: nhưng không có móng chẻ
  rationale: Diễn đạt một đặc tính chung, tự nhiên trong tiếng Việt, đồng thời nhất quán với “có móng chẻ” ở vế trước.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: chúng là ô uế đối với anh em
  rationale: “Ô uế” bảo toàn thuật ngữ rộng của luật về thức ăn; “đối với anh em” giữ hướng quy chiếu pháp lý-giao ước của nguyên văn.
theological_decisions:
- issue: Tính chất của sự ô uế trong luật về thức ăn
  choice: ô uế
  alternative: ô uế về nghi lễ
  rationale: Nguyên văn dùng thuật ngữ טָמֵא mà không thêm từ hạn định. Bản dịch giữ cách nói rộng, không thu hẹp ý nghĩa bằng một lời giải thích thần học ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với cộng đồng Ít-ra-ên; dùng “móng chẻ” và “nhai lại” là các cách nói thông dụng. Các dấu chú thích [a], [b] được đặt ngay sau tên loài vật tương ứng để tránh sự lệch dấu trong lớp tham khảo tiếng Anh.
