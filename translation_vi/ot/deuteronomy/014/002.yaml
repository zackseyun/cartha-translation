  terminology: “Dân thánh,” “Đức Chúa Trời,” “Đức Giê-hô-va,” và “thuộc riêng về Ngài” nhất quán với sắc thái giao ước của nguyên văn. “Dân quý báu” là cách diễn đạt tự nhiên cho לְעַם סְגֻלָּה; chú thích đã cung cấp phương án nhấn mạnh nghĩa “tài sản/thuộc quyền sở hữu được đặc biệt coi trọng.”
