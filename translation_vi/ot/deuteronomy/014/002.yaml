  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וּ/בְ/ךָ֞ בָּחַ֣ר יְהוָ֗ה לִֽ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: vi
  text: Vì anh em là một dân thánh thuộc về Đức Giê-hô-va, Đức Chúa Trời của anh em; Đức Giê-hô-va đã chọn anh em từ giữa mọi dân tộc trên mặt đất để làm một dân quý báu thuộc riêng về Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để làm dân thuộc quyền sở hữu quý báu của Ngài.” Từ Hê-bơ-rơ סְגֻלָּה chỉ một tài sản được đặc biệt coi trọng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu lý do cho điều cấm ở câu trước.
- source_word: עַם קָדוֹשׁ
  choice: một dân thánh
  rationale: Diễn đạt tự nhiên địa vị được biệt riêng cho Đức Chúa Trời, đồng thời giữ nguyên thuật ngữ thần học 'thánh'.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: thuộc về Đức Giê-hô-va, Đức Chúa Trời của anh em
  rationale: ל ở đây biểu thị quan hệ thuộc về; cách dịch này rõ nghĩa hơn lối dịch sát chữ 'cho Đức Giê-hô-va'.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: Đức Giê-hô-va đã chọn anh em
  rationale: ב với בחר là cấu trúc Hê-bơ-rơ chỉ đối tượng được chọn; tiếng Việt diễn đạt trực tiếp bằng tân ngữ.
- source_word: לִהְיוֹת לוֹ
  choice: để làm ... thuộc riêng về Ngài
  rationale: Giữ ý mục đích của động từ nguyên mẫu và mối quan hệ sở hữu hàm chứa trong לוֹ.
- source_word: לְעַם סְגֻלָּה
  choice: một dân quý báu
  rationale: Giữ danh từ עַם và truyền đạt סְגֻלָּה là tài sản được đặc biệt coi trọng, không làm mất hình ảnh 'dân' được lặp lại.
- source_word: מִכֹּל הָעַמִּים
  choice: từ giữa mọi dân tộc
  rationale: מן đánh dấu sự tuyển chọn từ trong một tập hợp, không nhất thiết mang nghĩa hơn hẳn hay cao hơn.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: trên mặt đất
  rationale: Cụm thành ngữ chỉ toàn thể các dân đang sống trên thế giới; 'mặt đất' tự nhiên và giữ hình ảnh nguyên văn.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc, trang trọng trong tiếng Việt để thể hiện danh riêng giao ước יהוה.
theological_decisions:
- issue: Bản chất ngôn ngữ tuyển chọn dành cho Israel
  choice: Diễn tả sự tuyển chọn từ giữa các dân để Israel thuộc riêng về Đức Giê-hô-va và được Ngài quý trọng.
  alternative: Dịch מִכֹּל là 'cao hơn mọi dân tộc' hoặc diễn giải theo một hệ thống giáo lý về sự tuyển chọn.
  rationale: Nguyên văn khẳng định hành động lựa chọn và địa vị giao ước, nhưng không trực tiếp nói Israel ưu việt về bản chất; bản dịch không thêm kết luận ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ số nhiều “anh em” vì lời nói hướng đến cộng đồng Israel; dùng “Ngài” khi quy chiếu về Đức Giê-hô-va. Dấu chấm câu làm rõ hai mệnh đề giải thích và tuyển chọn.
