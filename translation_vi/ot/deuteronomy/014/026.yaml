source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: vi
  text: 'Anh em hãy dùng số bạc ấy để mua bất cứ thứ gì lòng anh em mong muốn: bò, chiên hoặc dê[a], rượu nho, thức uống gây say[b], hoặc bất cứ thứ gì lòng anh em ao ước. Anh em sẽ ăn tại đó trước mặt Yahweh, Đức Chúa Trời của anh em, và vui mừng, anh em cùng cả nhà anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ chung các con vật trong đàn, gồm cả chiên và dê.
    reason: lexical_alternative
  - marker: b
    text: Chỉ một thức uống gây say khác với rượu nho; nguyên văn không xác định chính xác đó là loại nào.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: hãy dùng số bạc ấy để mua
  rationale: Động từ “trao/đưa” cùng “bạc” trong ngữ cảnh mua lương thực mang nghĩa dùng tiền để mua; cách diễn đạt này vừa giữ hình ảnh “bạc” vừa tự nhiên trong tiếng Việt.
- source_word: תְּאַוֶּה נַפְשְׁךָ
  choice: mình thèm muốn
  rationale: נֶפֶשׁ ở đây chỉ chính con người với sự ham muốn, đặc biệt trong ngữ cảnh đồ ăn thức uống; “thèm muốn” tự nhiên hơn cách dịch máy móc là “linh hồn.”
- source_word: בַּבָּקָר
  choice: bò
  rationale: בקר là danh từ tập hợp chỉ đại gia súc thuộc loài bò.
- source_word: וּבַצֹּאן
  choice: chiên dê
  rationale: צאן có thể bao gồm cả chiên lẫn dê; “chiên dê” bảo toàn phạm vi nghĩa tốt hơn chỉ dịch là “chiên.”
- source_word: וּבַיַּיִן
  choice: rượu nho
  rationale: יין là rượu làm từ nho; nêu rõ “nho” giúp phân biệt với thức uống có men kế tiếp.
- source_word: וּבַשֵּׁכָר
  choice: thức uống có men
  rationale: שֵׁכָר chỉ đồ uống gây say khác với rượu nho, nhưng không xác định duy nhất là bia hay một loại cụ thể.
- source_word: וּבְכֹל אֲשֶׁר תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: hoặc bất cứ thứ gì lòng mình ao ước
  rationale: Giữ sắc thái mong muốn của נֶפֶשׁ và diễn đạt thành ngữ tự nhiên trong tiếng Việt; “lòng” ở đây chỉ ước muốn của toàn thể con người.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: trước mặt Yahweh, Đức Chúa Trời của mình
  rationale: “Trước mặt” diễn đạt sự hiện diện trong bối cảnh thờ phượng; tên giao ước יהוה được phiên là Yahweh.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: và vui mừng cùng cả nhà mình
  rationale: “Cả nhà” chỉ gia đình/hộ gia đình và giữ tính chất chung vui của bữa tiệc thờ phượng.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo toàn danh riêng thay vì thay bằng một tước hiệu.
- issue: Có nên làm nhẹ đi việc nhắc đến đồ uống có cồn hay không
  choice: rượu nho, thức uống có men
  alternative: nước nho, thức uống
  rationale: Nguyên văn nêu יין và שֵׁכָר, đều là đồ uống có khả năng gây say; bản dịch không che mờ chi tiết này, đồng thời không xác định quá mức loại thức uống thứ hai.
- issue: Ý nghĩa của נֶפֶשׁ trong hai mệnh đề chỉ ham muốn
  choice: mình thèm muốn / lòng mình ao ước
  alternative: linh hồn mình ham muốn / đòi hỏi
  rationale: Trong ngữ cảnh chọn đồ ăn thức uống, từ này chỉ bản thân con người xét theo ước muốn, không nhất thiết nói về một thành phần phi vật chất.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ số nhiều “anh em” thể hiện lời Môi-se nói với cộng đồng Y-sơ-ra-ên, dù hình thức Hê-bơ-rơ trong câu này là số ít mang nghĩa tập thể. Dùng “mình” để tránh lặp nặng “của anh em” và giữ giọng trực tiếp tự nhiên.
