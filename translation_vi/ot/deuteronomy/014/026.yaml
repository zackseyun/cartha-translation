- from: 'Anh em hãy dùng số bạc ấy để mua bất cứ thứ gì mình thèm muốn: bò, chiên dê[a], rượu nho, thức uống có men[b], hoặc bất cứ thứ gì lòng mình ao ước. Anh em sẽ ăn tại đó trước mặt Yahweh, Đức Chúa Trời của mình, và vui mừng cùng cả nhà mình.'
