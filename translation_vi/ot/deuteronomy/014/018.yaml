  yaml_path: translation/ot/deuteronomy/014/018.yaml
  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: vi
  text: cò[a], diệc theo từng loài[b], chim đầu rìu[c], và dơi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể là “diệc”; việc định danh chính xác một số loài chim trong câu này chưa chắc chắn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể là “cò quăm” hoặc “choi choi”; việc xác định chính xác loài chim này chưa chắc chắn.
    reason: lexical_alternative
  - marker: c
    text: Các bản dịch truyền thống thường dịch là “chim choi choi”; từ Hê-bơ-rơ có nhiều khả năng chỉ chim đầu rìu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: cò trắng
  rationale: Tên chim này thường được xác định là stork; “cò trắng” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt, nhưng việc định danh chính xác vẫn chưa chắc chắn.
- source_word: הָאֲנָפָה
  choice: diệc
  rationale: “Diệc” là cách dịch quy ước phù hợp với một nhóm chim lội nước; cụm theo sau cho thấy phạm vi gồm các loài cùng loại.
- source_word: לְמִינָהּ
  choice: theo từng loài
  rationale: Công thức này chỉ các loài hoặc nhóm cùng loại; cách diễn đạt giữ sát ý Hê-bơ-rơ và tự nhiên trong tiếng Việt.
- source_word: הַדּוּכִיפַת
  choice: chim đầu rìu
  rationale: Nghiên cứu hiện đại thường xác định từ hiếm này là hoopoe; “chim đầu rìu” là tên Việt hiện hành của loài ấy.
- source_word: הָעֲטַלֵּף
  choice: dơi
  rationale: Từ Hê-bơ-rơ chỉ rõ con dơi. Dù phân loại học hiện đại không xem dơi là chim, bản văn xếp nó trong danh sách các sinh vật bay nên giữ tên gọi trực tiếp.
theological_decisions: []
