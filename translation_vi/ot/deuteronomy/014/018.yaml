  register: Văn phong hiện đại, trang trọng và cô đọng, phù hợp cấu trúc một danh sách luật lệ. Dùng tên chim quen thuộc trong tiếng Việt và ghi chú nơi việc định danh từ Hê-bơ-rơ còn bất định.
