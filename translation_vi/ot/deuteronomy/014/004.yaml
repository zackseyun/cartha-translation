translation:
  language: vi
  text: 'Đây là những loài vật anh em được phép ăn: bò, cừu và dê.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng dạng số ít: “Đây là loài vật anh em được ăn,” trong đó danh từ số ít mang nghĩa tập hợp để mở đầu danh sách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: Đây là những loài vật
  rationale: Cụm Hê-bơ-rơ ở dạng số ít nhưng được dùng theo nghĩa tập hợp để mở đầu danh sách. Cách dịch số nhiều tự nhiên trong tiếng Việt và phù hợp với các loài được liệt kê sau đó.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: anh em được phép ăn
  rationale: Mệnh đề này xác định các loài được phép dùng làm thức ăn; “được phép ăn” truyền đạt rõ ý cho phép mà không khiến câu nghe như một mệnh lệnh buộc phải ăn.
- source_word: שׁוֹר
  choice: bò
  rationale: Từ này chỉ động vật thuộc loài bò; “bò” là tên loại tự nhiên và không giới hạn giới tính như “bò đực”.
- source_word: שֵׂה כְשָׂבִים
  choice: cừu
  rationale: שֵׂה chỉ một con thuộc đàn gia súc nhỏ và được כְשָׂבִים xác định là thuộc loài cừu. “Cừu” giữ đúng phạm trù loài, không giới hạn độ tuổi như “chiên con”.
- source_word: וְשֵׂה עִזִּים
  choice: và dê
  rationale: Cấu trúc song song xác định một con thuộc loài dê. “Dê” là cách gọi phạm trù tự nhiên, không thu hẹp thành dê con.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với cộng đồng Y-sơ-ra-ên; dùng tên loài không kèm mạo từ vì đó là cách liệt kê tự nhiên trong tiếng Việt. Dấu chú thích được đặt sau toàn bộ danh sách vì chú thích giải thích cấu trúc số ít mang nghĩa tập hợp của phần mở đầu.
