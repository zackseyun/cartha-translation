  text: וְ/הַ/לֵּוִ֥י אֲשֶׁר בִּ/שְׁעָרֶ֖י/ךָ לֹ֣א תַֽעַזְבֶ֑/נּוּ כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: vi
  text: Còn người Lê-vi ở trong các thành của anh em[a], anh em không được bỏ mặc người ấy[b], vì người ấy không có phần và sản nghiệp cùng với anh em[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ở trong các cổng của anh em,” một thành ngữ Hê-bơ-rơ chỉ các thành hoặc cộng đồng địa phương.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “không được bỏ rơi người ấy” hoặc “không được lìa bỏ người ấy.”'
    reason: lexical_alternative
  - marker: c
    text: Nghĩa là người Lê-vi không có phần đất bộ tộc thông thường giữa dân Y-sơ-ra-ên.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: Còn người Lê-vi
  rationale: Danh từ số ít xác định đại diện cho một thành viên thuộc chi phái Lê-vi. “Người Lê-vi” chính xác hơn “thầy tế lễ,” vì không phải mọi người Lê-vi đều là thầy tế lễ; “còn” nối mệnh lệnh này với ngữ cảnh trước một cách tự nhiên.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: ở trong các thành của anh em
  rationale: Cụm Hê-bơ-rơ nguyên nghĩa là “ở trong các cổng của ngươi,” một thành ngữ chỉ các thành hoặc cộng đồng địa phương. Chuyển nghĩa thành “trong các thành” giúp độc giả hiện đại hiểu đúng mà không làm mất phạm vi địa phương.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: anh em không được bỏ mặc họ
  rationale: Động từ עזב có thể mang nghĩa rời bỏ, bỏ rơi hoặc bỏ mặc. Trong bối cảnh trách nhiệm chu cấp, “bỏ mặc” diễn đạt việc không quan tâm hay không chăm lo, đồng thời giữ được sức nặng của lệnh cấm.
- source_word: כִּי
  choice: vì
  rationale: Dẫn vào lý do của mệnh lệnh, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: אֵין לוֹ
  choice: họ không có
  rationale: Cách diễn đạt tiếng Việt tự nhiên của cấu trúc tồn tại Hê-bơ-rơ; đại từ “họ” dùng theo lối xưng hô tôn trọng, quy chiếu về “người Lê-vi” mang nghĩa đại diện.
- source_word: חֵלֶק וְנַחֲלָה
  choice: phần hay sản nghiệp
  rationale: Hai danh từ chỉ phần được hưởng và cơ nghiệp được phân, đặc biệt là đất đai. “Phần hay sản nghiệp” duy trì hai khái niệm gần nghĩa và diễn đạt tự nhiên sự thiếu vắng cả hai trong tiếng Việt.
- source_word: עִמָּךְ
  choice: cùng với anh em
  rationale: Giữ ý rằng người Lê-vi không có phần sở hữu bên cạnh cộng đồng Y-sơ-ra-ên. “Anh em” phù hợp với lời Môi-se nói với toàn dân và tránh lối gọi số ít thiếu tự nhiên trong câu này.
theological_decisions:
- issue: Bản chất phần mà người Lê-vi không có
  choice: Câu này nói đến việc người Lê-vi không nhận phần đất bộ tộc thông thường giữa Y-sơ-ra-ên, vì thế cộng đồng phải tiếp tục chăm lo cho họ.
  alternative: Câu này chỉ nói chung về tình trạng bị gạt ra ngoài xã hội, không đặc biệt liên quan đến quyền hưởng đất.
  rationale: Trong văn mạch Phục Truyền Luật Lệ Ký, cặp từ חֵלֶק וְנַחֲלָה chỉ phần và sản nghiệp, gắn với việc phân chia đất cho các bộ tộc. Bản dịch giữ cách diễn đạt của nguyên văn, còn chú thích làm rõ nền tảng đất đai mà không đưa phần giải thích vào chính câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “người Lê-vi” thay vì “thầy tế lễ” để không đồng nhất toàn thể người Lê-vi với chức tế lễ. Dùng “anh em” cho đối tượng số nhiều là cộng đồng giao ước; dùng “họ” như đại từ tôn trọng cho danh từ số ít mang tính đại diện. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn và đặt sát nội dung được giải thích.
