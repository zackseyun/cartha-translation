  yaml_path: translation/ot/deuteronomy/014/022.yaml
  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: vi
  text: Ngươi nhất định phải trích một phần mười từ toàn bộ hoa lợi do hạt giống ngươi gieo sinh ra ngoài đồng, năm này qua năm khác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch tự nhiên hơn: “Mỗi năm, ngươi phải trích một phần mười từ mọi hoa lợi của đồng ruộng ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: phải trích một phần mười
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi trước động từ hữu hạn nhấn mạnh mệnh lệnh. “Phải” truyền đạt rõ sức nhấn bắt buộc; “trích một phần mười” diễn đạt tự nhiên hành động dâng phần mười trong tiếng Việt hiện đại.
- source_word: תְּבוּאַת
  choice: sản vật
  rationale: Danh từ chỉ chung hoa lợi hoặc sản lượng nông nghiệp. “Sản vật” đủ rộng, không giới hạn vào một loại cây trồng hay chỉ riêng thời điểm thu hoạch.
- source_word: זַרְעֶךָ
  choice: từ hạt giống ngươi gieo
  rationale: Nghĩa đen là “hạt giống của ngươi”, nhưng trong ngữ cảnh chỉ sản phẩm phát sinh từ việc gieo trồng. Thêm “gieo” làm rõ quan hệ tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh hạt giống của nguyên văn.
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: mà đồng ruộng sinh ra
  rationale: Cụm phân từ diễn tả sản vật “đi ra từ đồng ruộng”. Cách nói “đồng ruộng sinh ra” tự nhiên, rõ nghĩa và giữ được ý sản vật phát xuất từ ruộng.
- source_word: שָׁנָה שָׁנָה
  choice: năm này qua năm khác
  rationale: Sự lặp lại của “năm” biểu thị chu kỳ hằng năm đều đặn. Cách diễn đạt này vừa tự nhiên vừa giữ sắc thái tái diễn của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phù hợp lời luật truyền trực tiếp cho từng người trong văn mạch Phục Truyền Luật Lệ Ký. Bản dịch ưu tiên tương đương tối ưu, giữ hình ảnh nông nghiệp nhưng tránh cấu trúc quá sát tiếng Hê-bơ-rơ đến mức thiếu tự nhiên.
