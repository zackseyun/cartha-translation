  rationale: 'Bản sửa giữ đầy đủ các yếu tố của tiếng Hê-bơ-rơ: mệnh lệnh được nhấn mạnh, toàn bộ sản lượng/hoa lợi từ hạt giống, nguồn gốc ngoài đồng, và sự lặp lại hằng năm. Câu được sắp xếp lại để tiếng Việt hiện đại rõ và tự nhiên hơn, không thay đổi nghĩa hay thêm diễn giải thần học.'
