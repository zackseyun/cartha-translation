source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: vi
  text: Nhưng bất cứ loài nào không có vây và vảy thì anh em không được ăn; đối với anh em, đó là loài ô uế.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Nhưng bất cứ loài nào
  rationale: כֹל mang nghĩa bao quát là “mọi/bất cứ”; וְ ở đây nối với ý tương phản so với điều được phép ăn ở câu trước, nên dịch tự nhiên là “Nhưng”. Thêm “loài” để phù hợp ngữ cảnh phân loại sinh vật dưới nước.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: không có
  rationale: Cấu trúc אֵין kèm hậu tố chỉ sự không sở hữu; “không có” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: סְנַפִּיר וְ/קַשְׂקֶשֶׂת
  choice: vây và vảy
  rationale: Hai danh từ chỉ đặc điểm của sinh vật dưới nước. Tiếng Việt dùng tự nhiên các danh từ loại “vây” và “vảy” mà không cần thể hiện số ít hay số nhiều.
- source_word: לֹא תֹאכֵלוּ
  choice: anh em không được ăn
  rationale: Động từ ngôi thứ hai số nhiều với phủ định trong văn luật pháp diễn đạt điều cấm. “Anh em không được ăn” vừa rõ chủ thể số nhiều vừa trang trọng, tự nhiên.
- source_word: טָמֵא
  choice: ô uế
  rationale: טָמֵא tại đây là thuật ngữ về tình trạng không thanh sạch theo luật nghi lễ; “ô uế” bảo toàn sắc thái chuyên biệt hơn “bẩn” trong tiếng Việt.
- source_word: הוּא לָכֶם
  choice: đối với anh em, đó là loài ô uế
  rationale: לָכֶם xác định tình trạng của loài vật trong quan hệ với cộng đồng Israel. Cách diễn đạt này giữ rõ lực quan hệ của giới từ và phù hợp cú pháp tiếng Việt.
theological_decisions:
- issue: Phạm vi của “ô uế”
  choice: Dùng thuật ngữ “ô uế” mà không giải thích thành sự bẩn thỉu về thể chất hay tội lỗi đạo đức.
  alternative: “không thanh sạch” hoặc diễn giải là “bị cấm về mặt nghi lễ”
  rationale: Nguyên văn nêu tình trạng טָמֵא trong hệ thống luật ăn uống nhưng không trực tiếp đồng nhất tình trạng ấy với vệ sinh hay phẩm chất đạo đức; bản dịch giữ nguyên phạm trù thần học-pháp lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện lời phán với cộng đồng số nhiều; dấu chấm phẩy giữ mối liên hệ chặt giữa lệnh cấm và lý do phân loại.
