  terminology: “Ô uế” là thuật ngữ phù hợp cho טָמֵא trong ngữ cảnh luật thanh sạch/nghi lễ và không tự ý diễn giải thành bẩn về vệ sinh hoặc xấu xa đạo đức. “Đối với anh em” thể hiện được quan hệ trong לָכֶם. Không có tên riêng, thuật ngữ thần học gây tranh luận, hay chú thích cần xử lý.
