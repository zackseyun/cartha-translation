  revision_rationale: Bản sửa thay “hoặc” bằng “và”, phục hồi mệnh lệnh chủ động của תַּקְדִּישׁ, và dùng ngôi thứ hai số ít nhất quán với tiếng Hê-bơ-rơ. Các thuật ngữ nghi lễ và phạm vi từ vựng về gia súc được giữ nguyên theo bản nguồn.
