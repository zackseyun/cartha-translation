revisions:
- from: Mọi con đực đầu lòng sinh ra trong đàn bò hoặc đàn chiên dê của anh em đều phải được biệt riêng ra thánh cho Yahweh, Đức Chúa Trời của anh em.[a] Anh em không được dùng con bò đầu lòng làm việc, cũng không được xén lông con đầu lòng trong đàn chiên dê.
  to: Mọi con đực đầu lòng sinh ra trong đàn gia súc và đàn chiên dê của ngươi, ngươi phải thánh hiến cho Yahweh, Đức Chúa Trời của ngươi.[a] Ngươi không được bắt con bò đầu lòng của ngươi làm việc, cũng không được xén lông con đầu lòng trong đàn chiên dê của ngươi.
  rationale: Bản sửa thay “hoặc” bằng “và”, phục hồi mệnh lệnh chủ động của תַּקְדִּישׁ, và dùng ngôi thứ hai số ít nhất quán với tiếng Hê-bơ-rơ. Các thuật ngữ nghi lễ và phạm vi từ vựng về gia súc được giữ nguyên theo bản nguồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:08:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng các yếu tố chính: con đầu lòng là con đực, hai nhóm gia súc, việc thánh hiến cho Yahweh, và hai điều cấm. Tuy nhiên, “hoặc” không phản ánh liên từ וְ (‘và’) giữa đàn gia súc và đàn chiên dê; và cấu trúc bị động “đều phải được biệt riêng” làm mờ mệnh lệnh trực tiếp cho người được nói đến trong tiếng Hê-bơ-rơ.'
  naturalness: “Mọi con đực đầu lòng” và “thánh hiến” là cách nói hiện đại, tự nhiên và trang trọng. Dùng đại từ số ít “ngươi” nhất quán với các hậu tố sở hữu số ít của bản gốc; “bắt ... làm việc” diễn đạt rõ việc dùng con vật vào lao động.
  terminology: “Thánh hiến” giữ lực nghi lễ của הִקְדִּישׁ mà không diễn giải quá mức. “Đàn gia súc” và “đàn chiên dê” phân biệt בקר và צאן mà không thu hẹp צאן chỉ thành chiên. “Yahweh, Đức Chúa Trời của ngươi” bảo tồn danh riêng và quan hệ giao ước.
  issues:
  - severity: medium
    issue: “hoặc” thay cho liên từ “và”
    rationale: 'Bản Hê-bơ-rơ có וּ/ (‘và’): בִּבְקָרְךָ וּבְצֹאנְךָ. “Hoặc” có thể tạo sắc thái lựa chọn/loại trừ không có trong nguồn.'
  - severity: medium
    issue: Mệnh lệnh chủ động bị chuyển thành bị động
    rationale: 'תַּקְדִּישׁ là Hiphil ngôi thứ hai số ít: “ngươi phải/hãy thánh hiến”. “Đều phải được biệt riêng ra thánh” không nêu rõ chủ thể có trách nhiệm thực hiện hành động.'
  - severity: low
    issue: Đại từ “anh em” không nhất quán với số ít của nguyên ngữ
    rationale: Các hậu tố -ךָ và động từ ngôi thứ hai số ít hướng đến “ngươi”. Dùng số ít xuyên suốt giúp giữ hình thức và mối liên hệ sở hữu của bản nguồn.
  revised_text: Mọi con đực đầu lòng sinh ra trong đàn gia súc và đàn chiên dê của ngươi, ngươi phải thánh hiến cho Yahweh, Đức Chúa Trời của ngươi.[a] Ngươi không được bắt con bò đầu lòng của ngươi làm việc, cũng không được xén lông con đầu lòng trong đàn chiên dê của ngươi.
