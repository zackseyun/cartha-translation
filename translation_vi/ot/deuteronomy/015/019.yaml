  text: כָּֽל הַ/בְּכ֡וֹר אֲשֶׁר֩ יִוָּלֵ֨ד בִּ/בְקָרְ/ךָ֤ וּ/בְ/צֹֽאנְ/ךָ֙ הַ/זָּכָ֔ר תַּקְדִּ֖ישׁ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֤א תַעֲבֹד֙ בִּ/בְכֹ֣ר שׁוֹרֶ֔/ךָ וְ/לֹ֥א תָגֹ֖ז בְּכ֥וֹר צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: vi
  text: Mọi con đực đầu lòng sinh ra trong đàn gia súc và đàn chiên dê của ngươi, ngươi phải thánh hiến cho Yahweh, Đức Chúa Trời của ngươi.[a] Ngươi không được bắt con bò đầu lòng của ngươi làm việc, cũng không được xén lông con đầu lòng trong đàn chiên dê của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tất cả các con đầu lòng là con đực sinh ra trong đàn gia súc và đàn chiên dê của ngươi.”'
    reason: Cấu trúc כָּל הַבְּכוֹר số ít có thể được diễn đạt theo sắc thái phân phối (“mọi”) hoặc tập hợp (“tất cả”).
lexical_decisions:
- source_word: כָּל הַבְּכוֹר ... הַזָּכָר
  choice: Mọi con đực đầu lòng
  rationale: כָּל đi với danh từ số ít mang nghĩa phân phối; הַזָּכָר xác định đối tượng là con đực. Cách diễn đạt này tự nhiên và rõ trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר יִוָּלֵד
  choice: sinh ra
  rationale: Thể Niphal của ילד ở đây diễn tả con vật được sinh ra; tiếng Việt không cần biểu đạt hình thái bị động.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: trong đàn bò hoặc đàn chiên dê của anh em
  rationale: בקר là đại gia súc, trong ngữ cảnh này là đàn bò; צאן là tiểu gia súc gồm chiên và dê. 'Hoặc' thể hiện tính phân phối trên hai loại đàn mà không loại trừ loại nào.
- source_word: תַּקְדִּישׁ
  choice: phải được biệt riêng ra thánh
  rationale: Hiphil của קדש có nghĩa làm cho hoặc tuyên bố một vật được dành riêng thuộc về phạm vi thánh. Cụm từ này giữ sắc thái nghi lễ rõ hơn 'dâng' đơn thuần.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: cho Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ danh riêng giao ước יהוה dưới dạng Yahweh và chuyển quan hệ dâng hiến bằng 'cho' tự nhiên trong tiếng Việt.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: không được dùng con bò đầu lòng làm việc
  rationale: עבד với giới từ ב diễn tả việc sử dụng con vật vào lao động; cách dịch này tránh lối nói gượng 'làm việc với con bò'.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: cũng không được xén lông con đầu lòng trong đàn chiên dê
  rationale: גזז là xén lông. Giữ צאן ở nghĩa rộng 'đàn chiên dê', dù hành động xén lông chủ yếu gợi đến chiên, để không thu hẹp từ nguồn.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng Danh Thánh; phiên âm 'Yahweh' bảo tồn chức năng danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa nghi lễ của תַּקְדִּישׁ
  choice: biệt riêng ra thánh cho Yahweh
  alternative: dâng cho Yahweh
  rationale: Cách chọn giữ ý niệm thuộc về phạm vi thánh mà không diễn giải thêm chính xác nghi thức hoặc cách xử lý con vật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng 'anh em' làm đại từ số ít mang tính đại diện cho người thuộc cộng đồng giao ước; lặp lại cụm này để tránh đại từ sở hữu cổ hoặc thiếu tự nhiên. 'Đàn chiên dê' giữ phạm vi nghĩa của צאן.
