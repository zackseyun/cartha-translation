source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: vi
  text: Nếu giữa anh em có một người nghèo, một người anh em của anh em, tại một trong các cổng thành của anh em trong xứ mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em, thì anh em không được cứng lòng hay khép tay mình lại đối với người anh em nghèo khó ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một trong các thành của anh em”; nguyên văn là “tại một trong các cổng của anh em”. Các từ “anh em” và “người anh em” ở đây là ngôn ngữ thân tộc chỉ những người cùng thuộc cộng đồng giao ước.'
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Nếu ... có
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện trong luật lệ, đồng thời giữ tính khái quát của thể yiqtol.
- source_word: אֶבְיוֹן
  choice: một người nghèo / nghèo khó
  rationale: Truyền đạt tình trạng nghèo túng, thiếu thốn; tiếng Việt không cần thêm từ chỉ giới tính vì danh từ Hê-bơ-rơ ở đây có thể đại diện cho một thành viên trong cộng đồng.
- source_word: מֵאַחַד אַחֶיךָ
  choice: một người trong số anh em mình
  rationale: Giữ ngôn ngữ thân tộc của nguyên văn nhưng diễn đạt tự nhiên, cho thấy người nghèo thuộc cùng cộng đồng giao ước.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: tại một trong các cổng thành
  rationale: Giữ hình ảnh 'cổng' trong tiếng Hê-bơ-rơ, đồng thời thêm 'thành' để người đọc tiếng Việt hiểu đây là cổng của một đô thị, cũng có thể hoán dụ cho chính thành ấy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: נֹתֵן לָךְ
  choice: đang ban cho anh em
  rationale: Phản ánh phân từ diễn tả hành động ban đất trong tiến trình và khung giao ước.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: không được cứng lòng
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ nguyên hình ảnh đạo đức về tấm lòng chai cứng, không chịu thương xót.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: hay khép tay lại
  rationale: Giữ hình ảnh cụ thể của bàn tay đóng lại, từ chối giúp đỡ.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: trước người anh em nghèo khó ấy
  rationale: Diễn đạt hướng của hành vi từ chối đối với người nghèo, đồng thời bảo tồn ngôn ngữ thân tộc.
theological_decisions:
- issue: Ngôn ngữ thân tộc אַחֶיךָ / אָחִיךָ
  choice: anh em / người anh em
  alternative: người đồng bào; người cùng dân tộc Israel
  rationale: Giữ hình ảnh gia đình vốn đặt nghĩa vụ kinh tế trong quan hệ cộng đồng giao ước; chú thích làm rõ phạm vi nghĩa mà không làm phẳng ẩn dụ.
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Giữ danh riêng trong nguyên văn và phân biệt danh ấy với tước hiệu אֱלֹהִים, được dịch là 'Đức Chúa Trời'.
- issue: Số ít của đại từ ngôi thứ hai trong lời luật
  choice: anh em
  alternative: ngươi
  rationale: Nguyên văn dùng số ít để nói với Israel như một cộng đồng. 'Anh em' tự nhiên và trang trọng hơn trong tiếng Việt hiện đại, dù hình thức ngữ pháp chuyển sang số nhiều; sắc thái cộng đồng vẫn được giữ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để nói với cộng đồng Israel, giữ hình ảnh “cứng lòng” và “khép tay”, đồng thời dùng “cổng thành” để hình ảnh Hê-bơ-rơ rõ nghĩa trong tiếng Việt.
