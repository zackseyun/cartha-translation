base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: vi
  text: Hãy nhớ rằng anh em đã từng là nô lệ tại đất Ai Cập, và Giê-hô-va, Đức Chúa Trời của anh em, đã chuộc anh em[a]. Vì thế, hôm nay tôi truyền cho anh em điều này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã cứu chuộc anh em” hoặc “đã chuộc anh em khỏi cảnh nô lệ.” Động từ Hê-bơ-rơ mang ý chuộc để giải phóng khỏi sự lệ thuộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Hãy nhớ
  rationale: Trong ngữ cảnh luật pháp và khuyên dạy giao ước, dạng động từ này mang lực mệnh lệnh; “Hãy nhớ” tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Trong bối cảnh Ai Cập, từ này nhấn mạnh tình trạng bị áp bức và lệ thuộc, nên “nô lệ” chính xác hơn “đầy tớ”.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: tại đất Ai Cập
  rationale: Giữ hình ảnh cụ thể của nguyên văn “trong đất Ai Cập” nhưng dùng giới từ tự nhiên hơn trong tiếng Việt.
- source_word: וַיִּפְדְּךָ
  choice: đã chuộc anh em
  rationale: פדה chỉ hành động chuộc khỏi cảnh nô lệ; “chuộc” giữ được ý nghĩa giải thoát bằng sự cứu chuộc mà không diễn giải quá mức.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Chuyển trực tiếp cấu trúc sở hữu ngôi thứ hai số ít tập thể sang lối xưng hô tự nhiên với cộng đồng trong tiếng Việt.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn đạt rõ quan hệ suy luận giữa việc được chuộc khỏi Ai Cập và mệnh lệnh hiện tại.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: tôi truyền cho anh em
  rationale: Đại từ được nêu rõ cùng phân từ biểu thị hành động truyền lệnh hiện tại; câu tiếng Việt giữ chủ thể nhấn mạnh mà vẫn tự nhiên.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: điều này
  rationale: דבר có nghĩa rộng là sự việc, lời hoặc điều; trong ngữ cảnh, “điều này” tự nhiên và chỉ về chỉ thị đang được ban ra mà không thu hẹp thành một thuật ngữ chuyên biệt.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Tương đương trực tiếp, tự nhiên, giữ tính tức thời của lời khuyên dạy giao ước.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Giê-hô-va
  alternative: Yahweh; ĐỨC GIÊ-HÔ-VA
  rationale: Nguyên văn dùng danh giao ước YHWH, nên giữ như một danh riêng thay vì thay bằng tước hiệu “Chúa”. “Giê-hô-va” là dạng tiếng Việt quen thuộc và dễ đọc.
- issue: Địa vị xã hội được chỉ bởi עֶבֶד
  choice: nô lệ
  alternative: đầy tớ
  rationale: Ký ức về sự áp bức tại Ai Cập là nền tảng đạo đức của mệnh lệnh; “nô lệ” giữ trọn sức nặng lịch sử và thần học của câu.
- issue: Sắc thái của פדה
  choice: chuộc
  alternative: cứu chuộc; giải thoát
  rationale: “Chuộc” giữ hình ảnh giải phóng khỏi cảnh lệ thuộc có trong động từ Hê-bơ-rơ, trong khi “giải thoát” có thể làm mất sắc thái chuộc và “cứu chuộc” có thể mang sắc thái thuật ngữ thần học mạnh hơn cần thiết.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh em” để chỉ cộng đồng Ít-ra-ên được xưng hô bằng ngôi thứ hai số ít tập thể trong tiếng Hê-bơ-rơ. Cấu trúc được điều chỉnh thành hai câu cho tự nhiên. Danh YHWH được phiên âm là “Giê-hô-va”; không thêm dấu ngoặc hay tước hiệu không có trong nguyên văn.
