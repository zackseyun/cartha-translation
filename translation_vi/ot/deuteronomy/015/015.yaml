  source_fidelity: 'Bản dịch phản ánh sát nguyên văn: mệnh lệnh “Hãy nhớ”, thân phận “nô lệ” tại Ai Cập, hành động פדה là “chuộc”, danh riêng YHWH được giữ dưới dạng Giê-hô-va, quan hệ suy luận “Vì thế”, và mệnh lệnh hiện tại “hôm nay tôi truyền ... điều này”. “Anh em” là cách xưng hô cộng đồng tự nhiên trong văn phong Kinh Thánh tiếng Việt, dù tiếng Hê-bơ-rơ mang hình thức số ít.'
