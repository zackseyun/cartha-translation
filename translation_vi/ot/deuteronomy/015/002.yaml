  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: vi
  text: 'Đây là quy định về việc xóa nợ: mọi chủ nợ phải xóa khoản nợ mà mình đã cho người lân cận vay[a]. Người ấy không được đòi nợ người lân cận hay anh em mình[b], vì người ta đã công bố việc xóa nợ cho Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “miễn nợ” hoặc “tha nợ”. Từ Hê-bơ-rơ shemittah nói đến việc chính thức từ bỏ quyền đòi nợ trong năm sa-bát.
    reason: lexical_alternative
  - marker: b
    text: “Anh em” ở đây chỉ một người cùng thuộc cộng đồng giao ước; cũng có thể diễn ý là “người đồng bào Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: quy định về việc xóa nợ
  rationale: Trong văn cảnh pháp luật, דְּבַר chỉ nội dung hay quy định được trình bày; שְׁמִטָּה là sự buông bỏ quyền đòi nợ trong năm sa-bát. Cách dịch này tự nhiên và rõ nghĩa hơn lối dịch sát từng chữ.
- source_word: שָׁמוֹט
  choice: phải xóa
  rationale: Dạng nguyên mẫu tuyệt đối nhấn mạnh mệnh lệnh buông bỏ khoản nợ; “phải xóa” truyền đạt lực pháp lý ấy bằng tiếng Việt hiện đại.
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: mọi chủ nợ
  rationale: Thành ngữ Hê-bơ-rơ chỉ người nắm quyền đòi một khoản cho vay; “chủ nợ” diễn đạt đúng vai trò pháp lý và kinh tế.
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: khoản đã cho người lân cận mình vay
  rationale: Động từ Hifil diễn tả việc cho vay hay khiến người kia thành con nợ; cách diễn đạt bằng danh từ “khoản” phù hợp tự nhiên với “xóa” trong tiếng Việt.
- source_word: לֹא יִגֹּשׂ
  choice: không được đòi nợ
  rationale: Động từ có nghĩa thúc ép hoặc đòi thanh toán. “Đòi nợ” nêu rõ ý nghĩa trong văn cảnh mà không thêm cách thức cưỡng ép.
- source_word: רֵעֵהוּ
  choice: người lân cận mình
  rationale: Giữ nghĩa xã hội và giao ước của רֵעַ, đồng thời dùng cách nói trang trọng, dễ hiểu.
- source_word: אָחִיו
  choice: anh em mình
  rationale: Giữ hình ảnh thân tộc của nguyên văn và sắc thái chỉ người cùng cộng đồng giao ước.
- source_word: כִּי קָרָא
  choice: vì ... đã được công bố
  rationale: Thể hoàn thành dùng vô nhân xưng nói đến một tình trạng đã được tuyên bố; thể bị động tiếng Việt truyền đạt tự nhiên.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ לְ biểu thị mối liên hệ hoặc sự biệt riêng cho Yahweh; “dành cho” tự nhiên hơn “cho Yahweh” trong cụm danh từ này mà không xác định quá mức quan hệ.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh giao ước YHWH; giữ “Yahweh” phù hợp bằng chứng nguồn và không thay danh riêng bằng một tước hiệu.
- issue: Phạm vi của אָחִיו trong luật giao ước
  choice: anh em mình
  alternative: người đồng bào Israel
  rationale: Nguyên văn dùng danh từ thân tộc giống đực số ít; bản chính giữ hình ảnh ấy, còn chú thích giải thích nghĩa rộng trong cộng đồng giao ước.
- issue: Bản chất của שְׁמִטָּה
  choice: xóa nợ
  alternative: tạm ngưng đòi nợ
  rationale: Động từ “buông bỏ” và lệnh không được đòi nợ hỗ trợ cách hiểu là từ bỏ quyền đòi khoản nợ trong chế định năm sa-bát; chú thích nêu các cách gọi gần nghĩa mà không mở rộng sang cơ chế không có trong câu.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. Dùng “xóa nợ” và “đòi nợ” để người đọc phổ thông hiểu ngay nội dung kinh tế-pháp lý; giữ “người lân cận” và “anh em” nhằm bảo tồn sắc thái quan hệ trong nguyên văn.
