base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: vi
  text: Khi anh em cho người ấy ra đi tự do khỏi anh em[a], thì đừng cho người ấy ra đi tay không.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu anh em cho người ấy ra đi tự do khỏi anh em.” Liên từ Hê-bơ-rơ có thể được hiểu theo nghĩa điều kiện (“nếu”) hoặc thời gian (“khi”).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Khi
  rationale: Cụm liên từ có thể mang nghĩa thời gian (“khi”) hoặc điều kiện (“nếu”). Trong luật lệ đang nói đến việc trả tự do vào thời điểm đã định, “khi” tự nhiên và phù hợp với tính dự liệu của điều khoản; cách hiểu điều kiện được ghi ở chú thích.
- source_word: תְשַׁלְּחֶנּוּ
  choice: cho người ấy rời khỏi / để người ấy ra đi
  rationale: Động từ Piel của שׁלח với hậu tố ngôi ba số ít giống đực có nghĩa là sai đi, cho đi hoặc tiễn đi. Hai cách diễn đạt gần nghĩa giúp câu tiếng Việt tự nhiên, trong khi vẫn giữ sự lặp lại ý niệm “cho đi” ở cả hai vế.
- source_word: חָפְשִׁי
  choice: trả tự do
  rationale: Tính từ חָפְשִׁי chỉ tình trạng tự do đối lập với cảnh phục dịch. Tiếng Việt tự nhiên diễn đạt kết cấu này bằng động từ “trả tự do” kết hợp với “cho ... rời khỏi”.
- source_word: מֵעִמָּךְ
  choice: rời khỏi mình
  rationale: Cụm từ có nghĩa sát là “khỏi nơi ở cùng anh em.” “Rời khỏi mình” giữ được quan hệ trực tiếp trong nguyên văn mà không thêm các ý diễn giải như “khỏi nhà” hay “khỏi sự phục dịch”.
- source_word: לֹא
  choice: đừng
  rationale: Phủ định לֹא với động từ chưa hoàn thành biểu thị lệnh cấm. “Đừng” truyền đạt rõ lực pháp lệnh bằng tiếng Việt hiện đại.
- source_word: רֵיקָם
  choice: tay không
  rationale: Trạng từ này có nghĩa là trống không, không mang theo gì. Thành ngữ “ra đi tay không” tự nhiên trong tiếng Việt và phù hợp với bối cảnh phải cấp vật dụng cho người vừa được trả tự do.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số ít giống đực trong diễn ngôn giao ước, và “người ấy” để chỉ người phục dịch được nhắc đến trong ngữ cảnh, tránh lối gọi mang sắc thái miệt thị hoặc quá cổ.
