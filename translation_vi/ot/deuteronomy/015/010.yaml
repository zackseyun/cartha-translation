  text: נָת֤וֹן תִּתֵּן֙ ל֔/וֹ וְ/לֹא יֵרַ֥ע לְבָבְ/ךָ֖ בְּ/תִתְּ/ךָ֣ ל֑/וֹ כִּ֞י בִּ/גְלַ֣ל הַ/דָּבָ֣ר הַ/זֶּ֗ה יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָֽל מַעֲשֶׂ֔/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: vi
  text: Anh em nhất định phải cho người ấy, và đừng để lòng mình tiếc khi cho người ấy; vì cớ việc này, Yahweh Đức Chúa Trời của anh em sẽ ban phước cho anh em trong mọi công việc và mọi việc tay anh em làm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: phải rộng tay cho
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ cùng gốc nhấn mạnh mệnh lệnh phải cho. Trong tiếng Việt, “phải rộng tay cho” truyền đạt tự nhiên cả sức nhấn lẫn ý cho cách sẵn lòng trong văn cảnh, mà không biến câu thành một diễn giải dài.
- source_word: לּוֹ
  choice: người ấy
  rationale: Hậu tố đại từ giống đực số ít chỉ người túng thiếu đã được nhắc đến trong văn cảnh. “Người ấy” giữ số ít mà tự nhiên trong tiếng Việt.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: lòng anh em đừng tiếc xót
  rationale: Thành ngữ mô tả phản ứng tiêu cực trong lòng khi phải cho. “Tiếc xót” thể hiện sự không nỡ rời của cải hoặc cho cách miễn cưỡng, phù hợp ngữ cảnh hơn “buồn phiền” chung chung.
- source_word: בְּתִתְּךָ לוֹ
  choice: khi cho người ấy
  rationale: Giới từ בְּ với nguyên mẫu cấu tạo có nghĩa thời gian hoặc hoàn cảnh; “khi cho” là cách diễn đạt tiếng Việt tự nhiên.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: vì nhờ việc này
  rationale: בגלל nêu nguyên nhân, còn הדבר הזה chỉ hành động vừa được truyền dạy. “Nhờ việc này” vừa giữ quan hệ nhân quả vừa tự nhiên hơn cách dịch sát chữ “vì cớ sự việc này”.
- source_word: יְבָרֶכְךָ
  choice: sẽ ban phước cho anh em
  rationale: ברך là động từ thông dụng mang nghĩa ban phước; thì chưa hoàn thành trong mệnh đề này diễn tả điều Yahweh sẽ làm.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cách gọi giao ước đi cùng danh Yahweh. Đại từ số ít tiếng Hê-bơ-rơ chỉ tập thể dân giao ước; “anh em” là lối xưng hô tự nhiên với cộng đồng trong tiếng Việt.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: trong mọi công việc
  rationale: מַעֲשֶׂה chỉ rộng những gì một người làm; “công việc” phù hợp bối cảnh kinh tế và rõ nghĩa.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: và mọi điều tay anh em làm
  rationale: Thành ngữ theo nghĩa đen nói đến mọi sự đưa tay ra thực hiện. Cách dịch này giữ hình ảnh “tay” nhưng vẫn rõ ràng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: CHÚA hoặc Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Phiên âm “Yahweh” bảo tồn tính chất tên riêng và không thay bằng tước hiệu.
- issue: Số và giới của người nhận
  choice: người ấy
  alternative: người đó hoặc họ
  rationale: Hậu tố Hê-bơ-rơ là giống đực số ít và quy chiếu về người anh em túng thiếu trong ngữ cảnh. Tiếng Việt không bắt buộc đánh dấu giới ở đại từ này, nhưng “người ấy” vẫn giữ nguyên số ít.
- issue: Phước lành liên hệ với hành động ban cho
  choice: vì nhờ việc này ... sẽ ban phước
  alternative: vì lý do này ... sẽ ban phước
  rationale: Giữ nguyên quan hệ nhân quả được câu văn nêu ra mà không mở rộng thành một học thuyết về công đức hay cơ chế nhận phước.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” được dùng cho đại từ ngôi hai số ít có ý nghĩa tập thể trong lời Môi-se nói với dân; cấu trúc được lặp đủ để tránh mơ hồ. Không cần chú thích vì các thành ngữ đã được chuyển đạt rõ trong chính văn.
