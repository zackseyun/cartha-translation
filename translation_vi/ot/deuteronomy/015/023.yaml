  text: רַ֥ק אֶת דָּמ֖/וֹ לֹ֣א תֹאכֵ֑ל עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/023.yaml
  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: vi
  text: Chỉ có điều, con không được ăn huyết của nó; con phải đổ huyết ấy xuống đất như đổ nước.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Chỉ có điều
  rationale: Diễn đạt tự nhiên sức hạn định/ngoại lệ đối với sự cho phép ở câu trước.
- source_word: אֶת דָּמוֹ
  choice: huyết của nó
  rationale: Đại từ sở hữu chỉ về con vật; “huyết” phù hợp văn phong luật lệ Kinh Thánh và không thêm ý “sinh huyết” vốn không được nói rõ tại đây.
- source_word: לֹא תֹאכֵל
  choice: con không được ăn
  rationale: Thể hiện rõ lệnh cấm pháp lý, đồng thời giữ cách xưng hô số ít của nguyên văn.
- source_word: עַל הָאָרֶץ
  choice: xuống đất
  rationale: Trong ngữ cảnh đổ huyết, đây là cách diễn đạt tiếng Việt tự nhiên cho việc đổ lên mặt đất.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: con phải đổ huyết ấy
  rationale: Truyền đạt mệnh lệnh tích cực về cách xử lý huyết và dùng “huyết ấy” để tránh đại từ mơ hồ trong tiếng Việt.
- source_word: כַּמָּיִם
  choice: như đổ nước
  rationale: Giữ nguyên phép so sánh, đồng thời bổ sung động từ đã có sẵn theo ngữ cảnh để câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách xử lý huyết trong luật ăn uống
  choice: Dịch thẳng lệnh cấm ăn huyết và lệnh đổ huyết xuống đất.
  alternative: Dùng từ mang tính diễn giải như “sinh huyết” để nhấn mạnh mối liên hệ giữa huyết và sự sống.
  rationale: Câu này chỉ nêu mệnh lệnh cụ thể, không trực tiếp trình bày lý do thần học; vì vậy bản dịch không thêm lời giải thích giáo lý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “con” để phản ánh ngôi thứ hai số ít trong lời luật giao ước; cấu trúc cân đối giữ sắc thái mệnh lệnh.
