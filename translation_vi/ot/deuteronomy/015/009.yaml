source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: vi
  text: 'Hãy coi chừng, kẻo trong lòng anh nảy sinh một ý nghĩ xấu xa rằng: “Năm thứ bảy, năm xóa nợ[a], đã gần đến,” rồi anh tỏ ra keo kiệt đối với người anh em[b] nghèo khó của mình và không cho người ấy gì cả. Người ấy sẽ kêu lên cùng Yahweh chống lại anh, và anh sẽ mắc tội.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “năm miễn nợ” hoặc “năm giải nợ”.
    reason: lexical_alternative
  - marker: b
    text: “Người anh em” ở đây chỉ một thành viên cùng cộng đồng giao ước, không nhất thiết là anh em ruột.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy giữ mình
  rationale: Cụm mệnh lệnh Nifal kèm đại từ chỉ lời cảnh báo phải tự đề phòng; cách dịch này vừa sát hình thức vừa tự nhiên trong văn phong luật pháp tiếng Việt.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: trong lòng anh nảy ra ý nghĩ xấu xa
  rationale: דָבָר trong ngữ cảnh nội tâm và trước לֵאמֹר chỉ một ý nghĩ hay ý định; בְלִיַּעַל mang nghĩa phẩm chất là xấu xa, không được hiểu như tên riêng.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: năm xóa nợ
  rationale: Trong Phục Truyền Luật Lệ Ký 15, שְׁמִטָּה chỉ việc miễn hoặc xóa khoản nợ vào năm thứ bảy; “năm xóa nợ” diễn đạt rõ chức năng ấy bằng tiếng Việt phổ thông.
- source_word: וְרָעָה עֵינְךָ
  choice: anh nhìn ... với con mắt ác
  rationale: Giữ lại hình ảnh thành ngữ Hê-bơ-rơ về “con mắt ác”, đồng thời cấu trúc tiếng Việt cho thấy đây là thái độ đối với người nghèo; chú thích giải nghĩa là keo kiệt, miễn cưỡng.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: người anh em nghèo khó của mình
  rationale: “Người anh em” bảo tồn ngôn ngữ thân tộc giao ước của אָח, còn אֶבְיוֹן được dịch là “nghèo khó” để chỉ người thiếu thốn.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: mà không cho người ấy gì cả
  rationale: 'Diễn đạt kết quả thực tế của động từ phủ định trong mạch cảnh: không cấp cho người nghèo điều họ cần.'
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: người ấy sẽ kêu cầu Yahweh, tố cáo anh
  rationale: Động từ “kêu cầu” giữ sắc thái khẩn thiết, còn עָלֶיךָ được diễn đạt là “tố cáo anh” để làm rõ lời kêu cầu mang tính khiếu kiện chống lại người từ chối giúp đỡ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh giao ước được viết trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: anh sẽ mang tội
  rationale: Cách nói tiếng Việt tự nhiên này giữ ý rằng tội lỗi hoặc trách nhiệm phạm tội sẽ thuộc về người đã từ chối giúp đỡ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA hoặc Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; “Yahweh” bảo tồn sự phân biệt giữa danh riêng này với các tước hiệu thần linh.
- issue: Giữ hay giải nghĩa thành ngữ “con mắt ác”
  choice: Giữ hình ảnh “với con mắt ác” trong chính văn và giải thích bằng chú thích
  alternative: nhìn một cách keo kiệt hoặc miễn cưỡng
  rationale: Giữ hình ảnh văn chương và sắc thái đạo đức của nguyên văn mà không buộc độc giả hiện đại phải tự đoán nghĩa thành ngữ.
- issue: Phạm vi của אָחִיךָ
  choice: người anh em của mình
  alternative: người đồng bào hoặc người cùng cộng đồng giao ước
  rationale: Giữ ngôn ngữ thân tộc ở chính văn, đồng thời chú thích rằng từ này trong luật giao ước không nhất thiết chỉ anh em ruột.
- issue: Mức độ chắc chắn của lời kêu cầu
  choice: sẽ kêu cầu
  alternative: có thể kêu cầu
  rationale: Chuỗi động từ Hê-bơ-rơ trình bày hậu quả dự kiến của việc từ chối, không có yếu tố tình thái rõ ràng để hạ xuống thành khả năng đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp, dùng đại từ số ít “anh” phù hợp lời luật nói với từng thành viên trong cộng đồng. Giữ cấu trúc cảnh báo và hình ảnh Hê-bơ-rơ nổi bật, nhưng dùng chú thích để bảo đảm người đọc phổ thông hiểu đúng.
