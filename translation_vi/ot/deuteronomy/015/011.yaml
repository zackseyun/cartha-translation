  to: 'Vì người nghèo sẽ không bao giờ hết trong xứ, nên tôi truyền cho anh em rằng: “Anh em phải rộng tay giúp đỡ người anh em mình[a], người khốn khó[b] và người túng thiếu trong xứ mình.”'
  rationale: Chỉ sửa cụm giới từ không tự nhiên ‘khỏi giữa xứ’ thành ‘trong xứ’. Bản sửa vẫn giữ ‘xứ’ cho bối cảnh đất giao ước, tránh biến câu thành nhận định về toàn thế giới, và không thay đổi các lựa chọn từ vựng hay cấu trúc lập luận khác.
