id: DEU.15.11
reference: Deuteronomy 15:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֛י לֹא יֶחְדַּ֥ל אֶבְי֖וֹן מִ/קֶּ֣רֶב הָ/אָ֑רֶץ עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לֵ/אמֹ֔ר פָּ֠תֹחַ תִּפְתַּ֨ח אֶת יָדְ/ךָ֜ לְ/אָחִ֧י/ךָ לַ/עֲנִיֶּ֛/ךָ וּ/לְ/אֶבְיֹנְ/ךָ֖ בְּ/אַרְצֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: vi
  text: 'Vì người nghèo sẽ không bao giờ hết trong xứ, nên tôi truyền cho anh em rằng: “Anh em phải rộng tay giúp đỡ người anh em mình[a], người khốn khó[b] và người túng thiếu trong xứ mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người anh em” là ngôn ngữ thân tộc giao ước; trong văn cảnh này cũng có thể hiểu là “người đồng bào Y-sơ-ra-ên.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “người khốn khó” có thể chỉ người nghèo, thấp hèn hoặc chịu cảnh khốn khó; cũng có thể dịch là “người nghèo” hoặc “người túng thiếu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu lý do cho mệnh lệnh ở phần sau và nối với văn cảnh trước.
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: người nghèo sẽ không bao giờ hết
  rationale: Dạng số ít mang nghĩa tập thể; cách diễn đạt này chuyển tải thực tại tiếp diễn trong tương lai mà không biến câu thành một khẳng định trừu tượng về toàn thế giới.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: khỏi giữa xứ
  rationale: Giữ sắc thái 'ở giữa, từ giữa' của קֶרֶב và dùng 'xứ' cho bối cảnh đất giao ước trong Phục Truyền Luật Lệ Ký.
- source_word: עַל כֵּן
  choice: nên
  rationale: 'Diễn đạt tự nhiên quan hệ suy luận: vì nghèo khó vẫn tồn tại, dân phải rộng lòng giúp đỡ.'
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: tôi truyền cho anh em rằng
  rationale: Giữ lời truyền trực tiếp và chức năng dẫn lời của לֵאמֹר; 'anh em' là đại từ số nhiều tự nhiên trong tiếng Việt cho đối tượng cộng đồng được đại diện bằng số ít trong tiếng Hê-bơ-rơ.
- source_word: פָּתֹחַ תִּפְתַּח אֶת יָדְךָ
  choice: phải rộng tay giúp đỡ
  rationale: Cấu trúc nguyên mẫu tuyệt đối cộng động từ hữu hạn nhấn mạnh mệnh lệnh. 'Rộng tay' giữ hình ảnh bàn tay mở, còn 'giúp đỡ' làm rõ ý nghĩa thành ngữ trong tiếng Việt tự nhiên.
- source_word: לְאָחִיךָ
  choice: người anh em mình
  rationale: Giữ ngôn ngữ thân tộc giao ước thay vì làm phẳng thành 'đồng bào'; chú thích nêu rõ nghĩa đại diện trong bối cảnh.
- source_word: לַעֲנִיֶּךָ
  choice: người khốn khó
  rationale: עָנִי có thể chỉ người nghèo, thấp hèn hoặc chịu cảnh khốn khó. 'Khốn khó' giữ được sắc thái bị áp bức/hoạn nạn và phân biệt với אֶבְיוֹן.
- source_word: וּלְאֶבְיֹנְךָ
  choice: và người túng thiếu
  rationale: Diễn đạt nhu cầu vật chất rõ ràng, đồng thời tránh lặp hoàn toàn với עָנִי trong cặp từ Hê-bơ-rơ.
- source_word: בְּאַרְצֶךָ
  choice: trong xứ mình
  rationale: '''Xứ'' phù hợp với bối cảnh đất giao ước; ''mình'' liên kết tự nhiên với người được truyền lệnh.'
theological_decisions:
- issue: Ngôn ngữ thân tộc mang tính đại diện
  choice: người anh em mình
  alternative: đồng bào mình; người cùng dân tộc mình
  rationale: Giữ hình ảnh thân tộc của אָח và sắc thái cộng đồng giao ước, trong khi chú thích giải thích rằng từ này có thể chỉ người đồng bào Y-sơ-ra-ên.
- issue: Phạm vi của הָאָרֶץ và אַרְצֶךָ
  choice: xứ / xứ mình
  alternative: đất; đất nước; thế gian
  rationale: Trong văn cảnh Phục Truyền Luật Lệ Ký, đối tượng trực tiếp là xứ giao ước. Cách dịch này không biến câu thành một tuyên bố địa lý phổ quát vượt quá văn cảnh.
- issue: Quan hệ giữa nghèo khó thường trực và mệnh lệnh rộng tay
  choice: giữ nguyên quan hệ lý do–hệ quả bằng “Vì… nên…”
  alternative: diễn giải rằng nghèo đói là điều được chấp thuận hoặc không thể giảm bớt
  rationale: Bản văn dùng sự tiếp diễn của nghèo khó làm lý do để truyền lòng rộng rãi, chứ không giải thích nguyên nhân thần học của nghèo đói hoặc phủ nhận trách nhiệm làm giảm cảnh khốn cùng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” làm đại từ cộng đồng tự nhiên, nhưng giữ “người anh em” trong cụm danh từ để bảo tồn hình ảnh thân tộc giao ước. Cụm “rộng tay giúp đỡ” vừa giữ ẩn dụ bàn tay mở vừa truyền đạt rõ nghĩa hào phóng trong tiếng Việt.
