review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển đạt đúng quan hệ tương phản của כִּי trong văn mạch, hai mệnh lệnh được nhấn mạnh, hành động cho vay, và mức đủ cho sự thiếu thốn của người ấy. Tuy nhiên, thành ngữ “rộng tay với” làm mờ động từ cụ thể “mở ... tay” trong nguyên văn; “mở rộng tay cho” vừa sát hình ảnh hơn vừa tự nhiên trong tiếng Việt.
  naturalness: Câu nhìn chung rõ ràng và có văn phong hiện đại, trang trọng. “Mở rộng tay cho người ấy” tự nhiên hơn “rộng tay với người ấy” trong ngữ cảnh một lời truyền dạy về cứu giúp/cho vay. Cụm “điều người ấy thiếu” gọn và tự nhiên; không cần từ “còn”.
  terminology: “Anh em” phù hợp với lối xưng hô cộng đồng trong văn mạch và “người ấy” giữ được đối tượng số ít của nguyên văn. “Cho vay” là cách dịch đúng của עבט ở đây. Chú thích nên trình bày lối lặp động từ bằng tiếng Việt rõ và nhất quán với tính chất trích dẫn minh họa.
  issues:
  - severity: low
    issue: “rộng tay với người ấy” không giữ rõ hình ảnh “mở tay ... cho người ấy”.
    rationale: פָתֹחַ תִּפְתַּח אֶת־יָדְךָ לוֹ nói đích danh việc mở tay cho người ấy. “Mở rộng tay cho” duy trì hình ảnh này mà vẫn là tiếng Việt tự nhiên.
  - severity: low
    issue: Cách trích dẫn trong chú thích “mở, anh em phải mở” hơi gượng và không phản ánh rõ dạng lặp dùng để nhấn mạnh.
    rationale: Có thể diễn đạt minh họa tự nhiên hơn là “mở, ngươi phải mở ... cho vay, ngươi phải cho vay,” đồng thời nêu rõ đây là hai kết cấu lặp động từ.
  revised_text: Nhưng[a] anh em phải mở rộng tay cho người ấy và nhất định phải cho người ấy vay đủ để đáp ứng điều người ấy thiếu.
