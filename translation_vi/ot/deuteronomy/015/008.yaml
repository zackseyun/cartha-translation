  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: vi
  text: Nhưng[a] anh em phải mở rộng tay cho người ấy và nhất định phải cho người ấy vay đủ để đáp ứng điều người ấy thiếu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dùng hai kết cấu động từ lặp để nhấn mạnh: “mở, ngươi phải mở ... cho vay, ngươi phải cho vay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nhưng
  rationale: Trong văn mạch, từ này đánh dấu sự tương phản với việc cứng lòng và khép tay ở câu trước. “Nhưng” diễn đạt tự nhiên quan hệ đối lập mà không biến nó thành quan hệ nguyên nhân.
- source_word: פָתֹחַ תִּפְתַּח
  choice: phải rộng tay
  rationale: Kết cấu nguyên mẫu tuyệt đối đi với động từ chia nhấn mạnh mệnh lệnh. “Rộng tay” giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ về lòng hào phóng, đồng thời “phải” thể hiện tính bắt buộc.
- source_word: יָדְךָ
  choice: tay
  rationale: Giữ nguyên hình ảnh “tay” trong thành ngữ; tiếng Việt hiện đại hiểu “rộng tay” là sẵn lòng giúp đỡ hoặc ban cho.
- source_word: לוֹ
  choice: với người ấy
  rationale: Chỉ người nghèo khó được nói đến trong văn mạch là đối tượng của hành động rộng tay.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: và nhất định phải cho người ấy vay
  rationale: Kết cấu nhấn mạnh thứ hai diễn tả sự chắc chắn và bắt buộc của việc cho vay. “Nhất định phải” truyền đạt cường độ ấy mà không suy diễn thành cách thức “cho vay rộng rãi”.
- source_word: דֵּי
  choice: đủ
  rationale: Diễn đạt ý mức đầy đủ để đáp ứng nhu cầu.
- source_word: מַחְסֹרוֹ
  choice: để đáp ứng điều người ấy còn thiếu
  rationale: Danh từ chỉ sự thiếu thốn hoặc nhu cầu; cách diễn đạt này tự nhiên trong tiếng Việt và liên kết rõ với mệnh đề quan hệ theo sau.
- source_word: אֲשֶׁר יֶחְסַר לוֹ
  choice: điều người ấy còn thiếu
  rationale: Giữ phạm vi mở của nhu cầu được nêu trong nguyên văn, không giới hạn loại thiếu thốn.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp lời Môi-se nói với cộng đồng giao ước; “người ấy” nối với người nghèo khó ở câu trước. Thành ngữ “rộng tay” bảo tồn hình ảnh Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
