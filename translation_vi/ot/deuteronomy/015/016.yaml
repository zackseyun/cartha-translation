  text: וְ/הָיָה֙ כִּֽי יֹאמַ֣ר אֵלֶ֔י/ךָ לֹ֥א אֵצֵ֖א מֵ/עִמָּ֑/ךְ כִּ֤י אֲהֵֽבְ/ךָ֙ וְ/אֶת בֵּיתֶ֔/ךָ כִּי ט֥וֹב ל֖/וֹ עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: vi
  text: 'Nếu người ấy nói với anh: “Tôi sẽ không rời anh,”[a] vì người ấy yêu mến anh và gia đình anh,[b] vì người ấy sống tốt khi ở với anh,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ có nghĩa đen là “đi ra”; cả cụm sát nghĩa là “Tôi sẽ không đi ra khỏi việc ở cùng anh.” Trong ngữ cảnh này, cũng có thể hiểu là “Tôi sẽ không ra đi tự do.”
    reason: lexical_alternative
  - marker: b
    text: “Gia đình” dịch từ từ Hê-bơ-rơ có nghĩa đen là “nhà”; tại đây từ này chỉ hộ gia đình và phạm vi sinh hoạt dưới quyền người chủ, chứ không chỉ tòa nhà.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Nhưng nếu
  rationale: Đây là công thức chuyển sang một trường hợp có điều kiện trong luật. “Nhưng nếu” diễn đạt tự nhiên và nối trường hợp này với quy định trước đó.
- source_word: יֹאמַר אֵלֶיךָ
  choice: người ấy nói với anh
  rationale: Thể vị hoàn trong văn luật nêu một trường hợp có thể xảy ra; hiện tại tiếng Việt phù hợp với lối trình bày luật theo tình huống.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: Tôi không muốn rời khỏi anh
  rationale: יָצָא có nghĩa cơ bản là “đi ra”, còn מֵעִמָּךְ diễn tả sự lìa khỏi tình trạng ở cùng người kia. Trong ngữ cảnh được phóng thích, “không muốn rời khỏi anh” tự nhiên hơn nhưng vẫn giữ sắc thái quan hệ, không diễn giải hoàn toàn thành “không muốn được tự do”.
- source_word: כִּי אֲהֵבְךָ
  choice: vì người ấy yêu mến anh
  rationale: כִּי nêu lý do, còn “yêu mến” chuyển tải tình cảm gắn bó mà không nhất thiết mang nghĩa lãng mạn.
- source_word: וְאֶת בֵּיתֶךָ
  choice: và cả nhà anh
  rationale: בַּיִת ở đây chỉ những người và sinh hoạt thuộc hộ gia đình, không chỉ căn nhà. “Cả nhà” là cách nói tự nhiên trong tiếng Việt và giữ được hình ảnh của nguyên ngữ.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: vì người ấy được sống tốt khi ở với anh
  rationale: Cụm này nói hoàn cảnh của người ấy là tốt khi sống cùng chủ. Cách dịch tránh lối nói cứng “điều đó tốt cho người ấy với anh” mà không thêm ý giàu có hay được đối xử theo một tiêu chuẩn cụ thể.
theological_decisions: []
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng vừa phải. “Anh” duy trì cách xưng hô trực tiếp với cộng đồng giao ước mà không dùng đại từ cổ “ngươi”; trong lời nói trực tiếp, giữ cùng đại từ để phản ánh việc nguyên ngữ dùng cùng ngôi thứ hai số ít. Câu kết bằng dấu phẩy vì câu 16 tiếp tục sang quy định ở câu sau.
