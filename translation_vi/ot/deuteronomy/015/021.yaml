  terminology: “Dâng ... làm sinh tế,” “Yahweh,” và “Đức Chúa Trời” phù hợp ngữ cảnh tế lễ và cách dùng thuật ngữ của bản dịch. “Khuyết tật” là cách gọi rõ ràng hơn “tật” trong ngữ cảnh này.
