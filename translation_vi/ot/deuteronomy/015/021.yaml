source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֨ה ב֜/וֹ מ֗וּם פִּסֵּ֨חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔/נּוּ לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: vi
  text: Nhưng nếu con vật ấy có khuyết tật—què, mù, hoặc bất cứ khuyết tật nghiêm trọng nào[a]—thì anh em không được dâng nó làm sinh tế cho Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “bất cứ tật xấu/ác nào.” Trong ngữ cảnh này, cụm từ chỉ một khuyết tật thể chất xấu, nghiêm trọng hoặc không thể chấp nhận được đối với con vật làm sinh tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện đồng thời giữ quan hệ tương phản với mệnh lệnh ở câu trước.
- source_word: יִהְיֶה בּוֹ מוּם
  choice: con vật ấy có tật
  rationale: Cách nói tự nhiên trong tiếng Việt; מוּם chỉ khuyết tật thể chất khiến con vật không đủ điều kiện làm sinh tế.
- source_word: פִּסֵּחַ
  choice: què
  rationale: Từ thông dụng, chính xác cho tình trạng vận động bị khiếm khuyết ở con vật.
- source_word: עִוֵּר
  choice: mù
  rationale: Tương đương trực tiếp và tự nhiên của từ Hê-bơ-rơ.
- source_word: כֹּל מוּם רָע
  choice: bất cứ tật xấu nào
  rationale: Giữ sắc thái trực tiếp của רָע là “xấu”, thay vì âm thầm thu hẹp thành “nghiêm trọng”; chú thích làm rõ ý nghĩa trong luật tế lễ.
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: không được dâng nó làm sinh tế
  rationale: Diễn đạt rõ lệnh cấm và tính chất tế lễ của động từ זבח, không chỉ nói đến việc giết con vật.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: cho Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ danh riêng giao ước Yahweh và cách xưng hô hướng đến cộng đồng giao ước; “anh em” là lối nói tự nhiên với tập thể trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Chuyển âm danh riêng trong nguyên văn, không thay bằng một tước hiệu và không gắn với cách đọc riêng của một hệ phái.
- issue: Số ít ngữ pháp trong אֱלֹהֶיךָ và תִזְבָּחֶנּוּ
  choice: anh em
  alternative: ngươi; bạn
  rationale: Nguyên văn dùng số ít để nói với Israel như một cộng đồng thống nhất. “Anh em” giữ hướng nói với cộng đồng và có sắc thái trang trọng, tự nhiên hơn “ngươi”, dù không tái hiện hình thái số ít.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “con vật ấy” để làm rõ đại từ chỉ con vật đầu lòng trong ngữ cảnh; dùng “dâng ... làm sinh tế” để thể hiện nội dung tế lễ của זבח.
