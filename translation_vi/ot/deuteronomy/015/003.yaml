  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: vi
  text: Ngươi có thể đòi người ngoại quốc trả nợ[a]; nhưng đối với bất cứ điều gì của ngươi ở chỗ người anh em ngươi[b], ngươi phải buông tay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngươi có thể thúc ép người ngoại quốc thanh toán.” Động từ Hê-bơ-rơ nói đến việc đòi hoặc thúc ép trả nợ.'
    reason: lexical_alternative
  - marker: b
    text: “Người anh em” ở đây chỉ một thành viên cùng thuộc cộng đồng giao ước Y-sơ-ra-ên.
    reason: cultural_note
  - marker: c
    text: 'Nguyên văn: “tay ngươi phải buông.” Đây là thành ngữ chỉ việc từ bỏ quyền đòi nợ trong năm tha nợ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: người ngoại quốc
  rationale: Danh từ נָכְרִי chỉ người thuộc bên ngoài cộng đồng giao ước trong bối cảnh luật pháp này. “Người ngoại quốc” giữ được sự phân biệt xã hội-pháp lý với “người anh em” mà không đồng nhất với גֵּר, người ngoại kiều cư trú.
- source_word: תִּגֹּשׂ
  choice: có thể đòi ... trả nợ
  rationale: Trong ngữ cảnh nợ nần, נגשׂ có nghĩa thúc ép hoặc đòi con nợ thanh toán. Cách dịch này tự nhiên trong tiếng Việt và thể hiện đây là điều được luật cho phép, chứ không nhất thiết là một mệnh lệnh phải thi hành.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: bất cứ khoản nào của ngươi đang ở
  rationale: Giữ tính khái quát của mệnh đề Hê-bơ-rơ, đồng thời dùng “khoản” để người đọc nhận ra ngữ cảnh là nghĩa vụ tài chính mà không thu hẹp quá mức thành một loại nợ cụ thể.
- source_word: אָחִיךָ
  choice: người anh em ngươi
  rationale: Giữ nguyên hình ảnh thân tộc của nguyên văn. Trong luật Phục Truyền, từ này chỉ một thành viên cùng cộng đồng giao ước Y-sơ-ra-ên; ý nghĩa xã hội ấy được giải thích trong chú thích.
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: ngươi phải buông quyền đòi lại
  rationale: שׁמט diễn tả việc buông hoặc miễn, còn “tay” tượng trưng cho quyền nắm giữ và đòi món nợ. Cách dịch này giữ động từ cụ thể “buông” nhưng làm rõ hiệu lực pháp lý của thành ngữ trong năm tha nợ.
theological_decisions:
- issue: Phạm vi của “người anh em” trong luật Phục Truyền
  choice: Giữ “người anh em ngươi” trong chính văn và giải thích phạm vi cộng đồng giao ước trong chú thích.
  alternative: người đồng bào Y-sơ-ra-ên của ngươi
  rationale: Nguyên văn đặt “người ngoại quốc” đối lập với “người anh em.” Giữ cách gọi thân tộc bảo toàn hình ảnh giao ước và không thay lời văn bằng một diễn giải hoàn toàn.
- issue: Sắc thái pháp lý của תִּגֹּשׂ
  choice: 'Dịch là sự cho phép: “có thể đòi.”'
  alternative: 'Mệnh lệnh: “hãy đòi” hoặc “ngươi phải đòi.”'
  rationale: Trong cấu trúc đối lập của luật tha nợ, động từ cho biết chủ nợ được phép tiếp tục đòi người ngoại quốc, không buộc họ phải làm như vậy.
translation_notes:
  register: Dùng văn phong luật pháp trang trọng nhưng dễ hiểu. Đại từ “ngươi” phù hợp giọng diễn từ giao ước của Phục Truyền Luật Lệ Ký; câu văn giữ sự đối lập giữa người ngoại quốc và người anh em, đồng thời diễn đạt thành ngữ về “tay” theo lối tiếng Việt tự nhiên.
