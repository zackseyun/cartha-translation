  to: Ngươi có thể đòi người ngoại quốc trả nợ[a]; nhưng đối với bất cứ điều gì của ngươi ở chỗ người anh em ngươi[b], ngươi phải buông tay[c].
  rationale: 'Sửa hai chỗ diễn đạt để tiếng Việt tự nhiên và sát nghĩa hơn: thay “đang ở nơi” bằng “ở chỗ”, và bỏ từ “lại” không có trong nguyên văn. Câu vẫn giữ cách gọi “người anh em”, sắc thái cho phép của “có thể đòi”, và hình ảnh ‘buông tay’ của tiếng Hê-bơ-rơ; các chú thích giữ đúng vị trí neo và nội dung cần thiết.'
  reviewer_model: gpt-5.6-terra
