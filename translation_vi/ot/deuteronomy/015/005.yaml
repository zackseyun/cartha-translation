  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: רַ֚ק אִם שָׁמ֣וֹעַ תִּשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֶ֑י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/005.yaml
  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: vi
  text: miễn là anh em thật sự nghe theo tiếng Giê-hô-va, Đức Chúa Trời của anh em, và cẩn thận làm theo toàn bộ điều răn này mà hôm nay tôi truyền cho anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: miễn là
  rationale: Diễn đạt điều kiện nhấn mạnh trong mạch văn; tự nhiên hơn cách dịch sát từng chữ nhưng vẫn giữ lực điều kiện.
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: thật sự nghe theo
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn tạo sắc thái nhấn mạnh; trong ngữ cảnh giao ước, 'nghe' bao hàm vâng theo.
- source_word: בְּקוֹל
  choice: tiếng
  rationale: Giữ hình ảnh trực tiếp 'nghe theo tiếng' của nguyên văn Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt để phản ánh danh riêng YHWH, thay vì đồng nhất với tước hiệu chung 'Chúa'.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: cẩn thận làm theo
  rationale: Kết hợp ý 'giữ/canh giữ' với 'làm', thể hiện sự chuyên tâm tuân hành mà không tạo câu nặng nề.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: toàn bộ điều răn này
  rationale: Giữ danh từ số ít tập hợp và từ chỉ định của nguyên văn.
- source_word: אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Giữ thời điểm 'hôm nay' và hành động truyền lệnh đang được phát biểu; 'anh em' phù hợp lời nói với toàn dân trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh Đức Chúa Trời יהוה
  choice: Giê-hô-va
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng danh riêng YHWH; bản dịch dùng một dạng phiên âm tiếng Việt quen thuộc, không thay bằng tước hiệu và không thêm từ ngoài nguyên văn.
- issue: Quan hệ giữa nghe và vâng phục
  choice: nghe theo
  alternative: lắng nghe
  rationale: Động từ שׁמע trong lời kêu gọi giao ước thường bao hàm sự đáp ứng bằng vâng phục; 'nghe theo' giữ cả hành vi nghe lẫn ý tuân phục mà không diễn giải thành một học thuyết riêng.
- issue: Số ít của 'điều răn'
  choice: toàn bộ điều răn này
  alternative: mọi điều răn này
  rationale: Giữ số ít tập hợp của הַמִּצְוָה và tránh tự ý chuyển thành số nhiều.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' như đại từ tập thể cho hậu tố số ít hướng đến Israel với tư cách cộng đồng; câu giữ tính điều kiện và sắc thái nhấn mạnh của nguyên văn.
