  edition: WLC
  text: בִּ/שְׁעָרֶ֖י/ךָ תֹּאכֲלֶ֑/נּוּ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יַחְדָּ֔ו כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: vi
  text: Anh em được ăn nó trong các thành của anh em[a]; người ô uế và người thanh sạch đều có thể ăn nó[b], như người ta ăn thịt linh dương và nai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong các cổng của anh em”, một thành ngữ chỉ các thành hoặc cộng đồng địa phương nơi anh em cư trú.'
    reason: cultural_note
  - marker: b
    text: Tức là cả người ô uế về nghi lễ lẫn người thanh sạch về nghi lễ đều có thể ăn nó.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: trong các thành của mình
  rationale: Cụm từ có nghĩa đen là “trong các cổng của anh em”, nhưng đây là thành ngữ chỉ các thành hay cộng đồng địa phương thuộc nơi cư trú. Cách dịch này truyền đạt tự nhiên ý nghĩa của thành ngữ trong tiếng Việt hiện đại; chú thích lưu lại hình ảnh nguyên văn.
- source_word: תֹּאכֲלֶנּוּ
  choice: Anh em được ăn nó
  rationale: Động từ ngôi hai số ít kèm đại từ tân ngữ giống đực số ít, quy chiếu về con vật ở văn cảnh trước. “Được ăn” thể hiện sắc thái cho phép trong văn cảnh.
- source_word: הַטָּמֵא
  choice: người ô uế
  rationale: Tính từ có mạo từ được dùng như danh từ, chỉ người ở tình trạng ô uế về nghi lễ, không hàm ý xấu xa về đạo đức.
- source_word: וְהַטָּהוֹר
  choice: người thanh sạch
  rationale: Tính từ có mạo từ được dùng như danh từ và đối xứng với “người ô uế”, chỉ tình trạng thanh sạch về nghi lễ.
- source_word: יַחְדָּו
  choice: đều được ăn
  rationale: Trong cấu trúc này, từ diễn tả hai nhóm cùng được phép dự phần, không nhất thiết nói họ ăn đồng thời. “Đều” tự nhiên và giữ đúng lực phân phối của câu.
- source_word: כַּצְּבִי
  choice: như ăn thịt linh dương
  rationale: צְבִי thường chỉ linh dương. Việc thêm “ăn thịt” làm rõ rằng phép so sánh liên hệ với cách được ăn các loài thú săn, thay vì đồng nhất người ăn với con vật.
- source_word: וְכָאַיָּל
  choice: và nai
  rationale: אַיָּל chỉ loài nai, đôi khi đặc biệt là nai đực. “Nai” là cách gọi phổ thông, rõ nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của cặp “người ô uế và người thanh sạch”
  choice: Hiểu là tình trạng ô uế hay thanh sạch về nghi lễ
  alternative: Hiểu là phẩm chất đạo đức xấu hay tốt
  rationale: Trong văn cảnh luật ăn uống và sát sinh, các thuật ngữ này nói đến tình trạng nghi lễ; câu cho phép cả hai nhóm ăn loại thịt này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi hai giống đực số ít mang tính tập thể, phù hợp lời Môi-se nói với dân Israel. “Trong các thành” ưu tiên nghĩa thành ngữ, còn chú thích bảo tồn hình ảnh “cổng” của tiếng Hê-bơ-rơ.
