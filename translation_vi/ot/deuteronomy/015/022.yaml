revisions:
- from: Anh em được ăn nó trong các thành của mình[a]; người ô uế và người thanh sạch đều được ăn[b], như ăn thịt linh dương và nai.
  to: Anh em được ăn nó trong các thành của anh em[a]; người ô uế và người thanh sạch đều có thể ăn nó[b], như người ta ăn thịt linh dương và nai.
  rationale: Sửa mệnh đề chính và chú thích b để người ô uế và người thanh sạch được hiểu đúng là các chủ thể được phép ăn. Điều chỉnh “của mình” thành “của anh em” để nhất quán với đại từ xưng hô, và làm rõ phép so sánh cuối câu bằng động từ được lược trong nguyên ngữ. Không thay đổi nghĩa hay thêm diễn giải giáo phái.
