base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: vi
  text: Khi anh em cho người ấy ra đi tự do khỏi anh em, đừng xem đó là điều nặng nề[a], vì người ấy đã phục vụ anh em sáu năm, và công phục vụ ấy đáng giá gấp đôi tiền công của một người làm thuê. Yahweh, Đức Chúa Trời của anh em, sẽ ban phước cho anh em trong mọi việc anh em làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng lấy làm khó chịu” hoặc “đừng xem là điều khó.” Cụm từ Hê-bơ-rơ nói theo nghĩa đen về một điều “khó trong mắt anh em,” tức là điều bị xem là nặng nề, khó chịu hoặc đáng tiếc.'
    reason: Giải thích thành ngữ nguồn và bảo tồn sắc thái đánh giá của thành ngữ.
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: đừng xem đó là điều nặng nề
  rationale: Thành ngữ Hê-bơ-rơ diễn tả việc một điều bị coi là khó chịu, thiệt thòi hoặc gây nặng lòng. Cách dịch này tự nhiên trong tiếng Việt và giữ góc nhìn đánh giá của người chủ.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: khi anh em trả tự do cho người ấy và để người ấy rời khỏi mình
  rationale: חָפְשִׁי chỉ tình trạng tự do về mặt pháp lý, còn מֵעִמָּךְ được giữ theo nghĩa quan hệ trực tiếp là rời khỏi người chủ, không thêm ý 'gia đình' hay 'sự phục dịch' vốn không được nói rõ.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: với giá trị gấp đôi tiền công của một người làm thuê
  rationale: Cụm từ so sánh giá trị sáu năm phục vụ với tiền công lao động thuê. Thêm 'với giá trị' giúp tiếng Việt rõ nghĩa mà không khẳng định rằng người ấy thực sự đã nhận tiền công.
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: trong sáu năm, người ấy đã phục vụ anh em
  rationale: Hình thái này mang chức năng động từ, nhấn mạnh sự phục vụ đã thực hiện. Bối cảnh luật pháp ở các câu trước đã xác định thân phận lệ thuộc nên không cần chèn danh từ 'nô lệ' vào chính mệnh đề này.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Rồi Yahweh, Đức Chúa Trời của anh em, sẽ ban phước cho anh em
  rationale: Liên từ mở đầu được diễn đạt là 'Rồi' để thể hiện hệ quả/lời hứa trong ngữ cảnh. Danh riêng יהוה được phiên là Yahweh.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: trong mọi việc anh em làm
  rationale: Cách diễn đạt rộng, tự nhiên, tương ứng trực tiếp với toàn bộ những gì người nghe thực hiện.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; dùng 'Yahweh' giữ đây là danh riêng và không thay bằng một tước hiệu.
- issue: Có nêu rõ thân phận nô lệ trong עֲבָדְךָ hay không
  choice: người ấy đã phục vụ anh em
  alternative: nô lệ của anh em đã phục vụ anh em
  rationale: Hình thức trong câu là động từ 'đã phục vụ anh em', còn thân phận lệ thuộc đã rõ trong luật phóng thích liền trước. Cách chọn này không làm nhẹ bối cảnh nhưng tránh biến động từ thành danh từ.
- issue: Quan hệ giữa sáu năm phục vụ và tiền công người làm thuê
  choice: với giá trị gấp đôi tiền công của một người làm thuê
  alternative: đã phục vụ anh em gấp đôi thời gian của người làm thuê
  rationale: מִשְׁנֶה có thể gợi lượng gấp đôi, nhưng cụm שְׂכַר שָׂכִיר nêu tiền công hơn là thời gian. Bản dịch chính giữ cách hiểu về giá trị lao động, đồng thời ghi chú phương án dịch sát cấu trúc hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ 'anh em' biểu đạt ngôi thứ hai số ít mang tính đại diện trong diễn ngôn giao ước; 'người ấy' tránh cách gọi thiếu tôn trọng. Câu được tái cấu trúc nhẹ để tiếng Việt tự nhiên nhưng vẫn giữ trình tự lý do rồi đến lời hứa ban phước.
