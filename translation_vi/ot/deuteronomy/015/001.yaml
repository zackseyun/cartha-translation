base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/001.yaml
  text: At the end of every seven years you shall make a release[a].
translation:
  language: vi
  text: Vào cuối mỗi chu kỳ bảy năm, anh em phải thực hiện việc miễn nợ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xóa nợ” hoặc “tha nợ”. Từ Hê-bơ-rơ שְׁמִטָּה chỉ sự buông bỏ hoặc miễn nợ theo luật về nợ vào năm thứ bảy.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: Cứ cuối
  rationale: Cụm מִקֵּץ mang nghĩa thời gian “vào/cuối kỳ”. “Cứ cuối” kết hợp tự nhiên với chu kỳ lặp lại, đồng thời không ấn định quá mức một thời điểm nằm ngoài ý của câu.
- source_word: שֶׁבַע שָׁנִים
  choice: mỗi bảy năm
  rationale: Nguyên văn là “bảy năm”; trong luật này, cách nói chỉ chu kỳ tái diễn. “Mỗi bảy năm” diễn đạt rõ và tự nhiên trong tiếng Việt.
- source_word: תַּעֲשֶׂה
  choice: anh em phải thực hiện
  rationale: Động từ עשה có nghĩa rộng là “làm/thực hiện”. Dạng ngôi thứ hai số ít mang lực quy định pháp luật; “phải thực hiện” vừa tự nhiên vừa giữ được tính bắt buộc. “Anh em” là cách xưng hô tập thể phù hợp với lời Môi-se nói cùng dân Israel.
- source_word: שְׁמִטָּה
  choice: việc miễn nợ
  rationale: שְׁמִטָּה chỉ sự buông bỏ hoặc miễn trừ; văn cảnh kế tiếp xác định đây là việc chủ nợ không đòi khoản nợ trong luật năm thứ bảy. “Miễn nợ” dễ hiểu và gọn trong tiếng Việt, còn chú thích bảo lưu các sắc thái “xóa nợ” và “tha nợ”.
theological_decisions:
- issue: Việc שְׁמִטָּה là xóa hẳn khoản nợ hay chỉ đình chỉ/miễn đòi nợ
  choice: Dùng “miễn nợ” trong chính văn, không xác quyết chi tiết cơ chế pháp lý chỉ từ câu này
  alternative: “xóa nợ” hoặc “tha nợ”
  rationale: Danh từ Hê-bơ-rơ có nghĩa rộng là sự buông bỏ/miễn trừ, còn các câu tiếp theo giải thích cách áp dụng. Cách dịch này giữ lại độ mở của thuật ngữ thay vì giải quyết trước một vấn đề còn được tranh luận.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dễ hiểu. Dùng “anh em” cho ngôi thứ hai số ít mang nghĩa tập thể, và đặt “Cứ” để biểu thị chu kỳ tái diễn. Dấu chú thích [a] xuất hiện ngay sau thuật ngữ cần giải thích.
