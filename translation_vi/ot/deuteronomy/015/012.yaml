revisions:
- from: Nếu một người anh em của anh em, dù là đàn ông Hê-bơ-rơ hay phụ nữ Hê-bơ-rơ, bị bán cho anh em và phục vụ anh em sáu năm, thì đến năm thứ bảy, anh em phải để người ấy[a] ra đi tự do khỏi anh em.
  to: Nếu một người anh em của anh em—một người nam Hê-bơ-rơ hay một người nữ Hê-bơ-rơ—bị bán cho anh em và phục vụ anh em sáu năm, thì đến năm thứ bảy, anh em phải trả tự do cho người ấy[a] khỏi sự phục dịch cho anh em.
  rationale: Sửa cách diễn đạt để tiếng Việt hiện đại rõ nghĩa hơn trong bối cảnh pháp luật, đặc biệt là quan hệ giải phóng khỏi sự phục dịch. Giữ nguyên tính bị động của “bị bán”, ngôn ngữ thân tộc, sự nêu rõ cả hai giới, số ít của đối tượng được phóng thích, và thông tin về hình thức giống đực số ít trong tiếng Hê-bơ-rơ. Chú thích được chỉnh để mô tả đúng ngữ pháp nguồn mà không áp đặt cách hiểu giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:08:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của tiếng Hê-bơ-rơ: động từ bị động “bị bán”, cách gọi thân tộc “người anh em”, việc nêu cả người nam lẫn người nữ Hê-bơ-rơ, thời hạn sáu năm, và lệnh phóng thích vào năm thứ bảy. Tuy nhiên, “khỏi anh em” là cách chuyển dịch quá sát của מֵעִמָּךְ, không tự nhiên trong tiếng Việt và chưa diễn đạt rõ quan hệ phục dịch mà câu vừa nêu.'
  naturalness: Cấu trúc “một người anh em của anh em” có thể hiểu được nhưng nặng nề. Dùng gạch ngang để đặt phần xác định “người nam... hay người nữ...” thành đồng vị ngữ giúp câu pháp luật rõ và tự nhiên hơn. “Trả tự do” là cách nói hiện hành, trang trọng và rõ nghĩa trong ngữ cảnh này.
  terminology: Giữ “anh em” cho אָחִיךָ và “Hê-bơ-rơ” cho הָעִבְרִי/הָעִבְרִיָּה là phù hợp. “Trả tự do” chuyển đạt đầy đủ ý của “gửi/cho đi như người tự do” trong bối cảnh luật pháp. Chú thích cần mô tả chính xác hậu tố giống đực số ít của động từ “ngươi sẽ cho đi”, thay vì gọi đó là nghĩa đen “cho người nam ấy ra đi”.
  issues:
  - severity: medium
    issue: Cụm “khỏi anh em” không tự nhiên và mơ hồ trong tiếng Việt hiện đại.
    rationale: Cụm מֵעִמָּךְ chỉ sự rời khỏi người chủ/quan hệ phục dịch. Trong tiếng Việt, “khỏi anh em” có thể gợi sự tách khỏi anh em ruột hơn là được giải phóng khỏi việc phục dịch. “Khỏi sự phục dịch cho anh em” làm rõ quan hệ đã được nêu trong câu mà không thay đổi ý luật.
  - severity: low
    issue: Chú thích diễn giải không chính xác hình thức tiếng Hê-bơ-rơ là “cho người nam ấy ra đi”.
    rationale: תְּשַׁלְּחֶנּוּ là “ngươi sẽ cho/gửi người ấy đi”, với hậu tố đối tượng giống đực số ít. Hậu tố này không tự nó có nghĩa là “người nam ấy”; cách trình bày cần phân biệt giống ngữ pháp với ý chỉ riêng một nam giới.
