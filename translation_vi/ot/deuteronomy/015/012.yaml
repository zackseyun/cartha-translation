source:
  edition: WLC
  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: vi
  text: Nếu một người anh em của anh em—một người nam Hê-bơ-rơ hay một người nữ Hê-bơ-rơ—bị bán cho anh em và phục vụ anh em sáu năm, thì đến năm thứ bảy, anh em phải trả tự do cho người ấy[a] khỏi sự phục dịch cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sau khi nêu “một người nam Hê-bơ-rơ hay một người nữ Hê-bơ-rơ”, tiếng Hê-bơ-rơ dùng hậu tố giống đực số ít trong cụm nghĩa đen là “ngươi sẽ cho người ấy đi”. Đây là cách dùng giống đực có tính khái quát; điều luật áp dụng cho cả người nam lẫn người nữ Hê-bơ-rơ.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּכֵר
  choice: bị bán
  rationale: Phản ánh thể Nifal mang nghĩa bị động mà không xác định người ấy tự bán mình hay bị người khác bán.
- source_word: אָחִיךָ
  choice: một người anh em của anh em
  rationale: Giữ nguyên ngôn ngữ thân tộc và giao ước của bản Hê-bơ-rơ, thay vì thu hẹp thành “đồng bào” hay “người cùng dân tộc”.
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: đàn ông Hê-bơ-rơ hay phụ nữ Hê-bơ-rơ
  rationale: Hai từ chỉ người Hê-bơ-rơ ở dạng giống đực và giống cái; bản dịch nêu rõ nam và nữ mà không tự thêm danh từ “nô lệ”.
- source_word: וַעֲבָדְךָ
  choice: phục vụ anh em
  rationale: Diễn đạt trực tiếp động từ עבד trong bối cảnh lao dịch, không thu hẹp thành một loại công việc cụ thể.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: thì đến năm thứ bảy
  rationale: Thể hiện trình tự thời gian của điều luật một cách tự nhiên trong tiếng Việt.
- source_word: תְּשַׁלְּחֶנּוּ
  choice: anh em phải để người ấy ra đi
  rationale: Giữ hình ảnh “sai/cho đi” của שלח nhưng dùng cách diễn đạt tự nhiên trong ngữ cảnh phóng thích.
- source_word: חָפְשִׁי
  choice: tự do
  rationale: Chỉ tình trạng của người được phóng thích, phù hợp với cách dùng trong luật về người phục dịch.
- source_word: מֵעִמָּךְ
  choice: khỏi anh em
  rationale: Phản ánh sát cụm từ có nghĩa đen là “khỏi nơi ở cùng anh em”, không tự thêm “nhà” hay “sự phục dịch” vào bản văn.
theological_decisions:
- issue: Đại từ giống đực số ít sau khi bản văn đã nói đến cả đàn ông lẫn phụ nữ Hê-bơ-rơ
  choice: Dùng “người ấy” trong chính văn và chú thích hình thức ngữ pháp của tiếng Hê-bơ-rơ.
  alternative: Dùng “người nam ấy” hoặc “người đó, dù nam hay nữ”.
  rationale: Tiếng Việt không có đại từ tự nhiên vừa mang giống đực số ít như hậu tố Hê-bơ-rơ vừa có thể dùng khái quát ở đây. “Người ấy” giữ số ít, áp dụng tự nhiên cho cả hai giới, còn chú thích bảo tồn chi tiết hình thái và sự căng thẳng của nguyên văn.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng dễ hiểu. “Anh em” được dùng cho ngôi thứ hai số ít để giữ cách xưng hô cộng đồng quen thuộc trong văn Kinh Thánh tiếng Việt; “khỏi anh em” hơi mang sắc thái nguồn nhưng bảo tồn cụm מֵעִמָּךְ mà không diễn giải quá mức.
