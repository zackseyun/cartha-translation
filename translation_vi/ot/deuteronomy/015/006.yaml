  text: כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בֵּֽרַכְ/ךָ֔ כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/הַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְ/אַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּ/מָֽשַׁלְתָּ֙ בְּ/גוֹיִ֣ם רַבִּ֔ים וּ/בְ/ךָ֖ לֹ֥א יִמְשֹֽׁלוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: vi
  text: Vì Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em đúng như Ngài đã phán với anh em[a], nên anh em sẽ cho nhiều dân tộc vay, còn anh em sẽ không vay; anh em sẽ cai trị nhiều dân tộc, nhưng họ sẽ không cai trị anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đúng như Ngài đã hứa với anh em.” Tiếng Hê-bơ-rơ nói sát nghĩa là “đã phán,” nhưng trong bối cảnh giao ước, lời phán này mang ý nghĩa một lời hứa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước của Đức Chúa Trời bằng dạng chuyển tự quen dùng, thay vì thay thế bằng một tước hiệu.
- source_word: בֵּרַכְךָ
  choice: đã ban phước cho anh em
  rationale: Dạng hoàn thành của động từ được thể hiện bằng “đã”; sự ban phước đã được xác quyết và làm nền tảng cho những kết quả tiếp theo. Đại từ số ít trong tiếng Hê-bơ-rơ chỉ toàn thể dân giao ước nên được diễn đạt tự nhiên là “anh em” trong tiếng Việt.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: đúng như Ngài đã phán với anh em
  rationale: “Phán” bám sát nghĩa trực tiếp của דִּבֶּר, còn “đúng như” truyền đạt sắc thái đối chiếu của כַּאֲשֶׁר. Nghĩa “hứa” phù hợp với bối cảnh giao ước nhưng được giữ làm phương án trong chú thích để không xóa đi tính đa nghĩa.
- source_word: וְהַעֲבַטְתָּ
  choice: anh em sẽ cho ... vay
  rationale: Thể Hiphil của עבט ở đây có nghĩa là cho vay hoặc cấp tín dụng; cách nói “cho ... vay” rõ ràng và tự nhiên.
- source_word: גּוֹיִם רַבִּים
  choice: nhiều dân tộc
  rationale: Trong ngữ cảnh kinh tế và chính trị này, גּוֹיִם nói đến các dân tộc hay quốc gia; “dân tộc” là cách diễn đạt tự nhiên và không mang hàm ý tôn giáo không cần thiết.
- source_word: לֹא תַעֲבֹט
  choice: chính anh em sẽ không phải vay
  rationale: Thể Qal của עבט đối lập với động từ Hiphil đứng trước và có nghĩa là vay. “Chính anh em” làm rõ sự tương phản, còn “không phải vay” diễn đạt tự nhiên tình trạng không cần vay mượn.
- source_word: וּמָשַׁלְתָּ
  choice: anh em sẽ cai trị
  rationale: מָשַׁל diễn tả việc cai trị hoặc nắm quyền trên người khác; “cai trị” trực tiếp và phù hợp với quan hệ giữa các dân tộc.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: họ sẽ không cai trị anh em
  rationale: “Họ” quy chiếu tự nhiên về “nhiều dân tộc” và giữ nguyên sự đối xứng của hai mệnh đề.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Dạng “Yahweh” bảo tồn danh riêng được mặc khải cho Israel, thay vì thay bằng một tước hiệu.
- issue: Sắc thái của דִּבֶּר trong bối cảnh giao ước
  choice: đã phán
  alternative: đã hứa
  rationale: Nghĩa từ vựng trực tiếp là “đã phán”, trong khi bối cảnh cho phép hiểu lời phán ấy là một lời hứa. Bản dịch chính giữ cách nói gần nguyên văn và chú thích nêu rõ cách hiểu theo bối cảnh, không buộc người đọc chỉ theo một sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ tập thể Israel được xưng hô bằng đại từ số ít trong nguyên văn; giữ cấu trúc đối xứng giữa cho vay/vay và cai trị/bị cai trị.
