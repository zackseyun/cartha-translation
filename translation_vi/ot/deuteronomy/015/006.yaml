- from: Vì Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em đúng như Ngài đã phán với anh em[a], nên anh em sẽ cho nhiều dân tộc vay, còn chính anh em sẽ không phải vay; anh em sẽ cai trị nhiều dân tộc, nhưng họ sẽ không cai trị anh em.
  to: Vì Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em đúng như Ngài đã phán với anh em[a], nên anh em sẽ cho nhiều dân tộc vay, còn anh em sẽ không vay; anh em sẽ cai trị nhiều dân tộc, nhưng họ sẽ không cai trị anh em.
  rationale: Chỉ sửa “sẽ không phải vay” thành “sẽ không vay” để phản ánh trực tiếp động từ Qal phủ định của עבט và duy trì đối ứng chính xác với “sẽ cho ... vay.” Các phần khác giữ nguyên vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
