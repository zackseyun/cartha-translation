id: DEU.15.4
reference: Deuteronomy 15:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: vi
  text: Tuy nhiên[a], giữa anh em sẽ không có người nghèo, vì Yahweh chắc chắn sẽ ban phước cho anh em trong xứ mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em làm phần thừa kế để anh em chiếm hữu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Dẫu vậy”, “Ngoại trừ điều này” hoặc “Chỉ có điều”; từ Hê-bơ-rơ אֶפֶס mở đầu một sự hạn định đối với chỉ thị ở phần trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: Tuy nhiên
  rationale: Đánh dấu sự hạn định đối với chỉ thị xóa nợ ở phần trước; cách dịch này tự nhiên và không làm sắc thái tương phản mạnh quá mức.
- source_word: אֶבְיוֹן
  choice: người nghèo
  rationale: Chỉ người nghèo túng hoặc thiếu thốn về kinh tế; “người nghèo” là cách nói rộng và tự nhiên trong tiếng Việt hiện đại.
- source_word: כִּי
  choice: vì
  rationale: Từ כִּי thứ hai giới thiệu lý do cho mệnh đề trước, tức là phước lành của Yahweh.
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: chắc chắn sẽ ban phước cho anh em
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động; “chắc chắn sẽ” giữ được lực nhấn mà không thêm ý nghĩa không có trong nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: נֹתֵן
  choice: đang ban
  rationale: Phân từ diễn tả hành động đang được thực hiện hoặc sắp được thực hiện trong bối cảnh lời hứa ban đất.
- source_word: נַחֲלָה
  choice: phần thừa kế
  rationale: Giữ sắc thái pháp lý và giao ước của phần đất được phân chia; thêm “phần” giúp câu tiếng Việt tự nhiên.
- source_word: לְרִשְׁתָּהּ
  choice: để anh em chiếm hữu
  rationale: Động từ ירשׁ nói đến việc nhận và nắm quyền sở hữu đất; cách dịch này phân biệt hành động chiếm hữu với danh từ “phần thừa kế” ngay trước đó.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng Tetragrammaton; giữ “Yahweh” bảo tồn danh riêng trong bản dịch mà không thay bằng tước hiệu.
- issue: Tính chất của lời tuyên bố “sẽ không có người nghèo”
  choice: giữ lời tuyên bố trực tiếp, không thêm điều kiện vào câu này
  alternative: diễn giải thành một lý tưởng hoặc lời hứa có điều kiện ngay trong câu
  rationale: Câu Hê-bơ-rơ nêu trực tiếp rằng sẽ không có người nghèo và đặt cơ sở nơi phước lành của Yahweh; mối liên hệ với điều kiện vâng lời xuất hiện trong câu kế tiếp, nên không được đưa trước vào câu 4.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ số nhiều “anh em” phù hợp với lời Môi-se nói cùng cộng đồng Israel và được lặp lại khi cần để câu rõ nghĩa. Dùng “xứ” cho ארץ trong ngữ cảnh đất giao ước; giữ dấu phẩy quanh cụm đồng vị “Đức Chúa Trời của anh em”.
