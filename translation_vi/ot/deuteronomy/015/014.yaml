  text: הַעֲנֵ֤יק תַּעֲנִיק֙ ל֔/וֹ מִ/צֹּ֣אנְ/ךָ֔ וּ/מִֽ/גָּרְנְ/ךָ֖ וּ/מִ/יִּקְבֶ֑/ךָ אֲשֶׁ֧ר בֵּרַכְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ תִּתֶּן לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: vi
  text: Anh em phải rộng rãi chu cấp cho người ấy từ đàn chiên dê, sân đập lúa và bồn ép nho của mình; phải cho người ấy từ những gì Yahweh, Đức Chúa Trời của anh em, đã ban cho anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: nhất định phải cấp
  rationale: Động từ nguyên mẫu tuyệt đối đi cùng động từ hữu hạn nhấn mạnh mệnh lệnh. “Nhất định phải” truyền đạt sức nhấn, còn “cấp” diễn tả việc trang bị vật chất cho người được phóng thích mà không tự ý ấn định số lượng.
- source_word: לּוֹ
  choice: cho người ấy
  rationale: Đại từ giống đực số ít chỉ người đầy tớ đang được cho ra đi; “người ấy” tự nhiên trong tiếng Việt và không lặp lại danh từ ngoài câu này.
- source_word: מִצֹּאנְךָ
  choice: từ đàn chiên dê của mình
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, chủ yếu gồm chiên và dê. “Đàn chiên dê” rõ nghĩa hơn “bầy” và giữ nguyên bối cảnh nông nghiệp.
- source_word: וּמִגָּרְנְךָ
  choice: từ sân đập lúa của mình
  rationale: גֹּרֶן theo nghĩa đen là sân đập lúa và có thể hoán dụ cho sản vật ngũ cốc. Giữ hình ảnh cụ thể của nguyên văn.
- source_word: וּמִיִּקְבֶךָ
  choice: từ bồn ép nho của mình
  rationale: יֶקֶב chỉ bồn hoặc nơi ép nho. “Bồn ép nho” dễ hiểu và duy trì bộ ba hình ảnh nông nghiệp.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: từ những gì Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em
  rationale: Cách diễn đạt này giữ ý rằng của cấp cho người ấy phải đến từ chính phước lành Đức Chúa Trời đã ban, đồng thời không quyết định quá mức liệu mệnh đề có hàm ý tỷ lệ hay không.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: תִּתֶּן לוֹ
  choice: anh em phải cho người ấy
  rationale: Giữ mệnh lệnh kết thúc câu và lực của giới từ לְ theo lối tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tên Thánh; chuyển tự “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng tước hiệu.
- issue: Mức độ dồi dào của vật cấp khi phóng thích
  choice: Giữ sức nhấn bằng “nhất định phải cấp”, đồng thời chú thích sắc thái có thể là cấp dồi dào
  alternative: “phải cấp thật dồi dào” ngay trong chính văn
  rationale: Cấu trúc nguyên mẫu tuyệt đối chắc chắn nhấn mạnh mệnh lệnh, còn chính động từ có thể hàm ý chu cấp rộng rãi. Chú thích bảo tồn sắc thái từ vựng mà không biến nó thành một định lượng rõ ràng hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai số ít trong lời giao ước nhằm giữ lối xưng hô quen thuộc của diễn từ Phục Truyền Luật Lệ Ký; “người ấy” nối với đối tượng ở ngữ cảnh trước. Các hình ảnh nông nghiệp cụ thể của tiếng Hê-bơ-rơ được giữ lại.
