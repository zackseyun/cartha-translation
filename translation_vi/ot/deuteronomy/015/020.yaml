source:
  edition: WLC
  text: לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֤י/ךָ תֹאכֲלֶ֨/נּוּ֙ שָׁנָ֣ה בְ/שָׁנָ֔ה בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה אַתָּ֖ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: vi
  text: Hằng năm, anh em và những người trong nhà anh em phải ăn nó trước mặt Giê-vê, Đức Chúa Trời của anh em, tại nơi Giê-vê sẽ chọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong sự hiện diện của Giê-vê, Đức Chúa Trời của anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Cụm giới từ này có nghĩa thành ngữ là “trước mặt” hoặc “trong sự hiện diện của”; “trước mặt” tự nhiên, trang trọng và giữ được ý nghĩa thờ phượng.
- source_word: יְהוָה
  choice: Giê-vê
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Dạng sở hữu ngôi thứ hai số ít chỉ Đức Chúa Trời của người được Môi-se trực tiếp truyền dạy; “anh em” phù hợp lối xưng hô trang trọng với cá nhân đại diện trong cộng đồng.
- source_word: תֹאכֲלֶנּוּ
  choice: phải ăn nó
  rationale: Động từ chưa hoàn thành trong văn cảnh luật lệ diễn đạt chỉ thị; “phải” thể hiện nghĩa vụ mà không biến câu thành mệnh lệnh cụt.
- source_word: שָׁנָה בְּשָׁנָה
  choice: mỗi năm
  rationale: Diễn đạt tự nhiên trong tiếng Việt cho thành ngữ phân phối chỉ việc lặp lại hằng năm.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: tại nơi Giê-vê sẽ chọn
  rationale: Giữ công thức đặc trưng của Phục Truyền Luật Lệ Ký và sắc thái hướng về việc lựa chọn địa điểm của Đức Chúa Trời.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: anh em và cả nhà mình
  rationale: “Cả nhà” chỉ những người thuộc đơn vị gia đình, không phải căn nhà vật chất; “mình” giúp câu tiếng Việt tự nhiên và liên kết rõ với người nghe.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Giê-vê
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng bằng hình thức phiên âm quen thuộc trong tiếng Việt, không thay bằng tước hiệu.
- issue: Ý nghĩa của לִפְנֵי trong bối cảnh thờ phượng
  choice: trước mặt
  alternative: trong sự hiện diện của
  rationale: Cả hai đều khả hữu. “Trước mặt” giữ hình ảnh của nguyên văn và không giải thích quá mức bản chất sự hiện diện của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “anh em” cho ngôi thứ hai số ít giống đực trong lời luật giao ước, và “cả nhà mình” cho đơn vị gia đình. Đặt chủ ngữ kép gần động từ để câu tiếng Việt rõ nghĩa, dù nguyên văn mở đầu bằng cụm “trước mặt”.
