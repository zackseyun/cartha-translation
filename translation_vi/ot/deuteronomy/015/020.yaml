revisions:
- from: Trước mặt Giê-vê Đức Chúa Trời của anh em, anh em và cả nhà mình phải ăn nó mỗi năm tại nơi Giê-vê sẽ chọn.[a]
  to: Hằng năm, anh em và những người trong nhà anh em phải ăn nó trước mặt Giê-vê, Đức Chúa Trời của anh em, tại nơi Giê-vê sẽ chọn.[a]
  rationale: Sửa tối thiểu để câu tự nhiên và nhất quán hơn trong tiếng Việt, làm rõ “nhà” là gia hộ, và chỉnh dấu câu ở cấu trúc đồng vị. Không thay đổi ý nghĩa, trật tự logic, tính hằng năm, hay tính mở của công thức địa điểm được Giê-vê chọn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:08:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: việc ăn con vật được nói đến trong ngữ cảnh, trước mặt Giê-vê, theo định kỳ hằng năm, tại nơi Ngài sẽ chọn, và cùng hộ gia đình. Tuy nhiên, cụm “anh em và cả nhà mình” pha trộn cách gọi số nhiều “anh em” với phản thân “mình” và làm ý “hộ gia đình” kém rõ. Bản sửa giữ sắc thái chỉ thị của động từ chưa hoàn thành trong văn luật lệ bằng “phải ăn.”'
  naturalness: Câu sửa sắp xếp các trạng ngữ và chủ ngữ theo trật tự tiếng Việt hiện đại, đồng thời dùng “những người trong nhà anh em” để diễn đạt tự nhiên, rõ ràng ý בית là những thành viên trong đơn vị gia hộ. Dấu phẩy sau “Giê-vê” làm rõ cấu trúc đồng vị “Giê-vê, Đức Chúa Trời của anh em.”
  terminology: Giữ “Giê-vê” cho יהוה theo lựa chọn danh riêng của dự án và “Đức Chúa Trời” cho אֱלֹהֶיךָ. “Trước mặt” là tương đương sát và tự nhiên của לִפְנֵי; chú thích bảo lưu cách diễn đạt thay thế “trong sự hiện diện của.”
  issues:
  - severity: low
    issue: Cụm “anh em và cả nhà mình” chưa nhất quán về quy chiếu và chưa diễn đạt rõ ý ‘hộ gia đình’.
    rationale: “Anh em” quy chiếu người nghe theo số nhiều trong tiếng Việt, trong khi “mình” dễ gợi một chủ thể số ít hoặc giọng thân mật. “Anh em và những người trong nhà anh em” rõ nghĩa hơn mà không thu hẹp בית chỉ còn tòa nhà.
  - severity: low
    issue: Thiếu dấu phẩy trong cụm đồng vị “Giê-vê Đức Chúa Trời”.
    rationale: Dấu phẩy trong “Giê-vê, Đức Chúa Trời của anh em” giúp người đọc nhận rõ danh riêng và danh xưng đồng vị, phù hợp văn phong tiếng Việt hiện đại.
  revised_text: Hằng năm, anh em và những người trong nhà anh em phải ăn nó trước mặt Giê-vê, Đức Chúa Trời của anh em, tại nơi Giê-vê sẽ chọn.[a]
