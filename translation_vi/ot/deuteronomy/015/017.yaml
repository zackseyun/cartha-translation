  terminology: “Cái dùi”, “nô lệ”, “nữ nô lệ”, và “suốt đời” đều phù hợp. Chú thích giữ phương án “vĩnh viễn” như một khả năng từ vựng, đồng thời giải thích giới hạn ngữ cảnh pháp lý, nên không áp đặt nghĩa tuyệt đối.
  issues:
  - severity: medium
    issue: Cách diễn đạt hành động nghi thức chưa tự nhiên
    rationale: “Xỏ qua tai người ấy và vào cánh cửa” có cấu trúc gượng trong tiếng Việt. Động từ “xuyên” với dụng cụ được nêu rõ diễn đạt tốt hơn hành động đặt/đâm chiếc dùi qua tai vào cánh cửa của nguyên văn.
  - severity: low
