  text: וְ/לָקַחְתָּ֣ אֶת הַ/מַּרְצֵ֗עַ וְ/נָתַתָּ֤ה בְ/אָזְנ/וֹ֙ וּ/בַ/דֶּ֔לֶת וְ/הָיָ֥ה לְ/ךָ֖ עֶ֣בֶד עוֹלָ֑ם וְ/אַ֥ף לַ/אֲמָתְ/ךָ֖ תַּעֲשֶׂה כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: vi
  text: thì hãy lấy cái dùi, dùng nó xuyên tai người ấy vào cánh cửa; người ấy sẽ là nô lệ của anh em suốt đời.[a] Anh em cũng phải làm như vậy đối với nữ nô lệ của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vĩnh viễn”; trong bối cảnh pháp lý này, từ Hê-bơ-rơ có thể mang nghĩa “suốt đời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: cái dùi
  rationale: Danh từ này chỉ một dụng cụ nhọn dùng để đục hoặc xỏ lỗ; “cái dùi” là cách gọi chính xác, tự nhiên trong tiếng Việt.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: xỏ qua tai người ấy và vào cánh cửa
  rationale: Bản dịch giữ cả hai giới từ và liên từ của tiếng Hê-bơ-rơ, đồng thời làm rõ hành động dùng dùi xuyên tai vào cửa trong nghi thức pháp lý.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Trong luật này, từ ngữ nhấn mạnh địa vị lệ thuộc chính thức, nên “nô lệ” truyền đạt rõ hơn “đầy tớ” hay “tôi tớ”.
- source_word: עוֹלָם
  choice: suốt đời
  rationale: Trong bối cảnh pháp lý-xã hội này, từ chỉ một địa vị kéo dài trọn đời người, không nhất thiết là sự vĩnh cửu theo nghĩa tuyệt đối.
- source_word: אֲמָתְךָ
  choice: nữ nô lệ của mình
  rationale: Từ này chỉ một phụ nữ ở địa vị nô lệ; cách dịch này nhất quán với עֶבֶד và giữ rõ tính chất lệ thuộc.
- source_word: וְאַף
  choice: cũng
  rationale: Tiểu từ mở rộng quy định trước đó sang nữ nô lệ; “cũng” diễn đạt tự nhiên sắc thái bổ sung ấy.
- source_word: תַּעֲשֶׂה כֵּן
  choice: phải làm như vậy
  rationale: Đây là thành ngữ chỉ việc thực hiện cùng một cách thức; “phải làm như vậy” vừa tự nhiên vừa giữ lực quy định của câu.
theological_decisions:
- issue: Cách dịch thuật ngữ chỉ địa vị lệ thuộc trong luật về nô lệ của Y-sơ-ra-ên
  choice: Dùng “nô lệ” và “nữ nô lệ”
  alternative: “đầy tớ”, “tôi tớ”, hoặc “tớ gái”
  rationale: Câu này nói đến một địa vị lệ thuộc chính thức, lâu dài, được xác nhận bằng nghi thức pháp lý. “Nô lệ” giữ được sức nặng xã hội-pháp lý của nguyên văn mà không thêm một cách giải thích giáo phái.
- issue: Phạm vi thời gian của עוֹלָם
  choice: Dịch “suốt đời” và ghi chú phương án “vĩnh viễn”
  alternative: “vĩnh viễn” hoặc “mãi mãi”
  rationale: Nguyên ngữ có thể diễn tả thời gian lâu dài hoặc không xác định. Trong quy định pháp lý này, “suốt đời” là cách hiểu theo bối cảnh, nhưng chú thích bảo tồn cách dịch sát hình thức hơn và sự mơ hồ thực sự.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng đại từ “anh em” theo cách xưng hô cộng đồng quen thuộc trong Phục Truyền Luật Lệ Ký; dùng “người ấy” để tránh khẩu ngữ và giữ rõ đối tượng. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
