  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: chiếc dùi, hành động xuyên tai gắn với cánh cửa, địa vị nô lệ, thời hạn עוֹלָם trong ngữ cảnh pháp lý, và việc áp dụng tương tự cho nữ nô lệ. Tuy nhiên, “xỏ qua tai người ấy và vào cánh cửa” chưa tự nhiên và có thể làm mờ hành động đâm xuyên bằng chiếc dùi. “Sẽ làm nô lệ” cũng kém sát hơn “sẽ là nô lệ”, vì nguyên văn nói về địa vị kéo dài.'
