base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: vi
  text: Vì Ngài yêu thương các tổ phụ của anh em và chọn dòng dõi họ sau này[a], nên Ngài đã đưa anh em ra khỏi Ai Cập bằng sự hiện diện của Ngài[b] và quyền năng lớn lao của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo các hậu tố số ít trong tiếng Hê-bơ-rơ là: “dòng dõi của người ấy sau người ấy.” Có lẽ nguyên văn xem “các tổ phụ” như một tập thể.'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “bằng/với mặt Ngài”; cũng có thể hiểu là “trước mặt Ngài.” Trong ngữ cảnh này, cụm từ diễn tả chính sự hiện diện của Đức Chúa Trời khi Ngài đưa Israel ra khỏi Ai Cập.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: Và bởi vì
  rationale: Cụm từ này nêu nguyên do cho điều vừa nói trước đó; cách dịch này tự nhiên và giữ rõ quan hệ nhân quả.
- source_word: אָהַב
  choice: yêu thương
  rationale: Diễn đạt trực tiếp động từ chỉ tình yêu, với sắc thái trang trọng và tự nhiên trong tiếng Việt.
- source_word: אֲבֹתֶיךָ
  choice: tổ phụ của anh em
  rationale: Giữ ý chỉ các người cha thuộc giao ước, đồng thời dùng cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt. Đại từ Hê-bơ-rơ ở số ít nhưng hướng đến toàn thể Israel, nên tiếng Việt dùng “anh em” tự nhiên hơn.
- source_word: וַיִּבְחַר
  choice: chọn
  rationale: Tương ứng trực tiếp với động từ Hê-bơ-rơ, không đưa thêm thuật ngữ thần học kỹ thuật.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: dòng dõi của họ sau họ
  rationale: Danh từ זרע mang nghĩa tập thể là “dòng dõi.” Các hậu tố trong nguyên văn ở số ít, nhưng nhiều khả năng quy chiếu tập thể đến “tổ phụ”; bản chính dùng số nhiều theo nghĩa ngữ cảnh và ghi chú dạng nguyên văn.
- source_word: וַיּוֹצִאֲךָ
  choice: đưa anh em ra
  rationale: Thể khiến của יצא có nghĩa làm cho đi ra; “đưa ra” là cách diễn đạt tự nhiên cho cuộc xuất hành.
- source_word: בְּפָנָיו
  choice: dùng sự hiện diện của mình
  rationale: Nghĩa đen liên quan đến “mặt” của Đức Chúa Trời; trong ngữ cảnh, cụm này diễn tả chính sự hiện diện trực tiếp của Ngài. Chú thích bảo lưu nghĩa đen và khả năng diễn đạt khác.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: quyền năng lớn lao của mình
  rationale: Giữ nghĩa công cụ của giới từ và diễn đạt rõ sức mạnh lớn lao thuộc về Đức Chúa Trời.
- source_word: מִמִּצְרָיִם
  choice: ra khỏi Ai Cập
  rationale: Phù hợp với động từ xuất hành và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Các hậu tố số ít trong cụm “dòng dõi của người sau người”
  choice: dòng dõi của họ sau họ
  alternative: dòng dõi của người sau người
  rationale: Nguyên văn dùng hậu tố số ít sau danh từ số nhiều “tổ phụ,” có thể xem nhóm tổ phụ như một tập thể. Bản chính diễn đạt số nhiều cho rõ nghĩa tiếng Việt, còn chú thích bảo lưu hình thức số ít thực sự của tiếng Hê-bơ-rơ.
- issue: Ý nghĩa của בְּפָנָיו
  choice: dùng sự hiện diện của mình
  alternative: trước mặt Ngài
  rationale: Cụm từ có nghĩa đen gắn với “mặt Ngài,” nhưng tại đây nhiều khả năng nhấn mạnh chính sự hiện diện của Đức Chúa Trời trong việc đưa Israel ra khỏi Ai Cập. Chú thích giữ lại tính đa nghĩa thay vì xóa bỏ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Đức Chúa Trời và “anh em” cho đại từ số ít mang tính tập thể hướng đến Israel. Cấu trúc “chính Ngài” làm rõ chủ thể trực tiếp mà không thêm một tác nhân ngoài nguyên văn; các điểm mơ hồ của hậu tố số ít và בְּפָנָיו được bảo lưu trong chú thích.
