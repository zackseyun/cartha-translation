revisions:
- from: Và bởi vì Ngài yêu thương tổ phụ của anh em và chọn dòng dõi của họ sau họ[a], nên chính Ngài đã dùng sự hiện diện của mình[b] và quyền năng lớn lao của mình mà đưa anh em ra khỏi Ai Cập.
  to: Vì Ngài yêu thương các tổ phụ của anh em và chọn dòng dõi họ sau này[a], nên Ngài đã đưa anh em ra khỏi Ai Cập bằng sự hiện diện của Ngài[b] và quyền năng lớn lao của Ngài.
  rationale: Bản sửa làm câu văn Việt tự nhiên và rõ hơn, đồng thời giữ đầy đủ các thành tố của nguyên văn. Cách dùng số nhiều trong bản chính cho “dòng dõi họ” phản ánh quy chiếu tập thể của “các tổ phụ”; chú thích giữ lại tính đáng lưu ý của các hậu tố số ít. Chú thích về בְּפָנָיו tiếp tục bảo lưu các khả năng sát chữ, trong khi bản chính dùng cách hiểu phù hợp ngữ cảnh.
