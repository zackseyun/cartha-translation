source:
  edition: WLC
  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: vi
  text: Hôm nay, tôi kêu gọi trời và đất làm chứng chống lại anh em[a] rằng anh em chắc chắn sẽ sớm bị diệt vong khỏi đất mà anh em đang vượt sông Giô-đanh để sang đó chiếm hữu. Anh em sẽ không được sống lâu trên đất ấy,[b] vì anh em chắc chắn sẽ bị hủy diệt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hôm nay, tôi lấy trời và đất làm chứng chống lại anh em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “Anh em sẽ không kéo dài ngày tháng trên đất ấy.”'
    reason: literal_rendering
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: tôi kêu gọi ... làm chứng chống lại anh em
  rationale: 'Thể Hiphil của עוּד cùng giới từ בָכֶם mang sắc thái pháp lý: viện dẫn nhân chứng chống lại người nghe. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được hình ảnh vụ kiện giao ước.'
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: trời và đất
  rationale: Đây là công thức nhân chứng giao ước; “trời và đất” là cách nói quen thuộc, tự nhiên trong tiếng Việt.
- source_word: אָבֹד תֹּאבֵדוּן מַהֵר
  choice: chắc chắn sẽ sớm bị diệt
  rationale: Động từ nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn; מַהֵר được diễn đạt là “sớm”, phù hợp với lời cảnh báo về việc nhanh chóng mất đất.
- source_word: מֵעַל הָאָרֶץ
  choice: khỏi vùng đất
  rationale: Giữ ý bị loại bỏ khỏi đất; “vùng đất” giúp phân biệt miền đất được chiếm hữu với “đất” trong công thức “trời và đất”.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: mà anh em đang vượt sông Giô-đanh để chiếm hữu
  rationale: Diễn đạt tự nhiên đích đến của việc vượt sông và giữ nghĩa giao ước của ירשׁ là nhận lấy, nắm quyền sở hữu miền đất.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: Anh em sẽ không được sống lâu trên đất ấy
  rationale: Thành ngữ sát chữ là “không kéo dài ngày tháng”; “không được sống lâu” truyền đạt rõ nghĩa trong tiếng Việt hiện đại, còn “trên đất ấy” giữ sắc thái của עָלֶיהָ.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: chắc chắn sẽ bị hủy diệt
  rationale: Cấu trúc nguyên thể tuyệt đối với động từ hữu hạn được giữ bằng “chắc chắn”, không đẩy nghĩa đến mức “tuyệt diệt” hay “tiêu diệt hoàn toàn” quá mức văn bản.
theological_decisions:
- issue: Công thức giao ước gọi trời và đất làm chứng
  choice: Diễn đạt như việc triệu gọi tạo vật làm chứng chống lại Y-sơ-ra-ên
  alternative: “Hôm nay tôi lấy trời và đất làm chứng chống lại anh em” hoặc diễn ý thành “tôi cảnh cáo anh em trước trời đất”
  rationale: Nguyên văn mang sắc thái pháp lý của một vụ kiện giao ước. Bản dịch giữ lực pháp lý ấy mà không thêm một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với dân chúng; dùng “Giô-đanh” theo dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt. Hai cấu trúc nhấn mạnh của tiếng Hê-bơ-rơ đều được thể hiện bằng “chắc chắn”.
