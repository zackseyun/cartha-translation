  text: לְ/הוֹרִ֗ישׁ גּוֹיִ֛ם גְּדֹלִ֧ים וַ/עֲצֻמִ֛ים מִמְּ/ךָ֖ מִ/פָּנֶ֑י/ךָ לַ/הֲבִֽיאֲ/ךָ֗ לָֽ/תֶת לְ/ךָ֧ אֶת אַרְצָ֛/ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: vi
  text: để đuổi các dân tộc lớn hơn và hùng mạnh hơn anh em[a] khỏi trước mặt anh em, để đưa anh em vào, ban đất của họ cho anh em làm cơ nghiệp, như ngày nay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tước quyền chiếm hữu đất của.” Động từ Hê-bơ-rơ hàm ý loại các cư dân trước đi để một dân khác nhận đất.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “như ngày này,” một thành ngữ chỉ thực trạng đang hiển nhiên ở thời điểm ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: đuổi khỏi
  rationale: Ở thể Hiphil, động từ ירשׁ tại đây diễn tả việc loại những cư dân trước khỏi đất; vì tân ngữ là “các dân tộc,” “đuổi khỏi” vừa tự nhiên vừa giữ được ý cưỡng xuất để dân khác nhận đất.
- source_word: גּוֹיִם
  choice: những dân tộc
  rationale: גּוֹיִם chỉ các dân tộc hoặc quốc gia; “những dân tộc” phù hợp với ngữ cảnh các cộng đồng cư trú trong xứ.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: lớn hơn và hùng mạnh hơn anh em
  rationale: מִמְּךָ đánh dấu phép so sánh; cặp tính từ nói đến quy mô và sức mạnh vượt hơn Israel.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt anh em
  rationale: Giữ hình ảnh không gian của thành ngữ Hê-bơ-rơ, diễn tả việc các dân bị loại khỏi phía trước và sự hiện diện của Israel.
- source_word: לַהֲבִיאֲךָ
  choice: đưa anh em vào
  rationale: Thể Hiphil của בוא mang nghĩa đưa vào; đích đến là xứ được nêu rõ trong mệnh đề kế tiếp.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: ban đất của họ cho anh em
  rationale: “Ban” thể hiện đây là hành động trao tặng của Đức Chúa Trời, đồng thời giữ rõ người nhận và vật được trao.
- source_word: נַחֲלָה
  choice: làm cơ nghiệp
  rationale: “Cơ nghiệp” diễn đạt tài sản được trao để sở hữu lâu dài và giữ sắc thái giao ước của đất trong Phục Truyền Luật Lệ Ký.
- source_word: כַּיּוֹם הַזֶּה
  choice: như ngày nay
  rationale: Cụm từ Phục Truyền này hướng đến tình trạng hiện thời có thể thấy rõ; bản dịch ngắn gọn giữ nguyên hình thức thành ngữ và được chú thích.
theological_decisions:
- issue: Thuật ngữ đất giao ước נַחֲלָה
  choice: làm cơ nghiệp
  alternative: làm sản nghiệp
  rationale: “Cơ nghiệp” giữ được ý đất do Đức Chúa Trời ban để dân nhận và nắm giữ, thay vì làm phẳng thành ý sở hữu thông thường.
- issue: Chủ thể ngầm của các động từ nguyên mẫu
  choice: không thêm danh xưng chỉ Đức Chúa Trời
  alternative: để Ngài đuổi... đưa... ban
  rationale: Câu Hê-bơ-rơ tiếp nối câu trước và không lặp chủ thể; giữ cấu trúc nguyên mẫu tránh bổ sung quá mức, dù chủ thể theo văn mạch là Đức Chúa Trời.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” cho đại từ số ít tập thể hướng đến Israel, phù hợp lối diễn đạt diễn từ trong Phục Truyền Luật Lệ Ký; giữ nhịp ba mệnh đề mục đích của nguyên văn.
