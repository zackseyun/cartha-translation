  terminology: “Dân tộc,” “hùng mạnh,” và “cơ nghiệp” đều phù hợp. “Cơ nghiệp” bảo toàn sắc thái נחלה là sản nghiệp/thừa hưởng được ban. Không cần thêm chủ thể “Đức Chúa Trời,” vì chủ thể đã do văn mạch câu trước cung cấp.
