  source_fidelity: 'Bản dịch phản ánh đúng chuỗi ba động từ nguyên mẫu và các ý chính: loại bỏ các dân mạnh hơn khỏi trước mặt Israel, đưa Israel vào, và ban đất họ làm cơ nghiệp. Tuy nhiên, trật tự từ trong “đuổi khỏi trước mặt anh em những dân tộc” không tự nhiên trong tiếng Việt; đặt tân ngữ ngay sau động từ sẽ rõ và sát cấu trúc hơn. Chú thích a hiện dùng “tước đất của,” dễ bị hiểu là tước chính mảnh đất như một vật sở hữu và chưa diễn đạt rõ sắc thái tước quyền chiếm hữu/đuổi các cư dân đi.'
