  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: vi
  text: Hãy cẩn thận, kẻo anh em ngước mắt lên trời, thấy mặt trời, mặt trăng, các vì sao—tức toàn thể các thiên thể trên trời[a]—rồi bị lôi kéo mà cúi lạy chúng và phụng sự chúng, là những thiên thể mà Yahweh, Đức Chúa Trời của anh em, đã phân cho mọi dân tộc dưới khắp bầu trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm này dịch sát là “toàn thể đạo binh trên trời”; trong văn cảnh, nó chỉ toàn bộ các thiên thể—mặt trời, mặt trăng và các vì sao—chứ không nhất thiết chỉ các thiên sứ.
    reason: lexical_clarification
  - marker: b
    text: Cũng có thể dịch là “đã phân chia” hoặc “đã phân bổ”. Nguyên văn nói Đức Chúa Trời đã phân các thiên thể này cho mọi dân tộc; tự cách diễn đạt này không nói rằng Ngài chuẩn thuận việc họ thờ chúng. “Dưới khắp bầu trời” dịch thành ngữ nguyên văn “dưới tất cả các tầng trời”, chỉ phạm vi toàn thế giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: Hãy cẩn thận, kẻo
  rationale: Diễn đạt rõ sức cảnh báo của פן trong tiếng Việt tự nhiên, đồng thời nối tiếp mạch khuyên răn của văn cảnh.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: ngước mắt lên trời
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ nhưng dùng cách nói tự nhiên trong tiếng Việt.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: toàn thể thiên binh
  rationale: Giữ nghĩa tập hợp có tổ chức của צָבָא; trong văn cảnh, cụm này chỉ toàn bộ các thiên thể vừa được kể, không nhất thiết chỉ các hữu thể thiên sứ.
- source_word: וְנִדַּחְתָּ
  choice: bị lôi cuốn
  rationale: Phản ánh thể bị động của động từ và ý bị dẫn lệch vào việc thờ hình tượng, không nhấn quá mức sự cưỡng ép.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: sấp mình trước chúng
  rationale: Bảo tồn hành động phủ phục cụ thể; kết hợp với 'phụng sự' để truyền đạt đầy đủ ý thờ phượng.
- source_word: וַעֲבַדְתָּם
  choice: phụng sự chúng
  rationale: Trong ngữ cảnh tôn giáo, עבד mang nghĩa phục vụ hay thờ phượng; 'phụng sự' giữ được nét nghĩa phục vụ mang tính sùng bái.
- source_word: אֲשֶׁר חָלַק
  choice: là những vật ... đã phân định
  rationale: חלק có thể là chia phần, phân bổ hay phân định. Lựa chọn này giữ ý phân chia theo sự sắp đặt nhưng không tự thêm rằng Đức Chúa Trời chuẩn thuận việc thờ các thiên thể.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc, trang trọng trong tiếng Việt để biểu đạt Danh Thánh, thay vì thay thế bằng một tước hiệu.
- source_word: לְכֹל הָעַמִּים
  choice: cho mọi dân tộc
  rationale: עַמִּים ở số nhiều chỉ các cộng đồng dân tộc; cách dịch này tự nhiên và không mang hàm ý quốc gia-dân tộc hiện đại.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: dưới khắp các tầng trời
  rationale: Theo sát số nhiều hình thái của שָׁמַיִם và phạm vi bao quát của כָּל, đồng thời vẫn dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của mệnh đề Đức Chúa Trời 'phân định' các thiên thể cho mọi dân tộc
  choice: Giữ nguyên ý phân định/phân bổ mà không nói rằng Đức Chúa Trời chuẩn thuận việc thờ chúng.
  alternative: Có thể hiểu là Ngài ban các thiên thể cho mọi dân sử dụng, hoặc phó các dân cho việc thờ các thiên thể như một sự phán xét.
  rationale: Động từ חלק cho phép ý chia phần hay phân bổ, nhưng chính câu này không xác định đầy đủ mục đích của việc ấy. Văn bản dịch vì thế bảo tồn sự căng thẳng thần học và không thêm một cách giải thích vượt quá nguyên văn.
- issue: Đối tượng của 'toàn thể thiên binh'
  choice: Hiểu theo văn cảnh là toàn bộ đoàn thể thiên thể, gồm mặt trời, mặt trăng và các ngôi sao.
  alternative: Hiểu 'thiên binh' chủ yếu là các hữu thể thiên sứ.
  rationale: Các danh từ đứng ngay trước cụm này liệt kê rõ các thiên thể; vì vậy cụm đồng vị tổng kết danh sách ấy, dù từ צָבָא ở nơi khác có thể mang phạm vi nghĩa rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ số nhiều 'anh em' phản ánh lời Môi-se nói với cộng đồng Y-sơ-ra-ên. Các động từ 'sấp mình' và 'phụng sự' giữ nét cụ thể lẫn sắc thái thờ phượng của cặp động từ Hê-bơ-rơ.
