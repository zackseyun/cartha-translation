  rationale: Chỉnh cú pháp để mệnh đề phủ định bổ nghĩa trực tiếp cho «những vật», tương ứng với mệnh đề quan hệ אֲשֶׁר trong nguyên văn. Bỏ chú thích không cần thiết; không thay đổi nghĩa, sắc thái tương lai, hay thuật ngữ thần học của câu.
