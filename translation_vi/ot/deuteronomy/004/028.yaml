  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: vi
  text: Tại đó, anh em sẽ phụng thờ các thần—những vật do tay người làm ra bằng gỗ và đá, không thấy, không nghe, không ăn và không ngửi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: anh em sẽ phụng thờ
  rationale: Động từ עבד ở đây mang nghĩa phục vụ hoặc thờ phượng. Trong lời cảnh báo tiên báo của Môi-se, “sẽ phụng thờ” vừa diễn đạt sắc thái tương lai vừa hợp ngữ cảnh tôn giáo.
- source_word: שָׁם
  choice: tại đó
  rationale: Trạng từ chỉ nơi chốn, quy chiếu đến các xứ giữa những dân tộc được nói đến trong ngữ cảnh trước.
- source_word: אֱלֹהִים
  choice: các thần
  rationale: Giữ nghĩa từ vựng trực tiếp của dạng số nhiều; không chuyển thành “thần tượng”, vì vế kế tiếp đã cho biết đó là những vật do con người chế tác.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: những vật do tay người làm ra
  rationale: Diễn đạt tự nhiên chuỗi liên kết Hê-bơ-rơ, đồng thời giữ hình ảnh “tay người” và ý nghĩa con người chế tạo.
- source_word: עֵץ וָאֶבֶן
  choice: bằng gỗ và đá
  rationale: Trong ngữ cảnh này, עֵץ chỉ vật liệu gỗ chứ không phải cây đang sống; cụm từ nêu chất liệu của các thần được chế tác.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: là những thứ không thấy, không nghe, không ăn và không ngửi
  rationale: Giữ trực tiếp bốn phủ định song song của bản Hê-bơ-rơ, thay vì diễn giải thành “không thể”; cách gọi “những thứ” phù hợp với các vật bằng gỗ và đá.
- source_word: יְרִיחֻן
  choice: ngửi
  rationale: Động từ chỉ hành vi cảm nhận mùi; “ngửi” là cách nói ngắn gọn, tự nhiên và phù hợp với chuỗi giác quan.
theological_decisions:
- issue: Cách dịch אֱלֹהִים khi chỉ các đối tượng thờ phượng giả
  choice: các thần
  alternative: các thần tượng
  rationale: “Các thần” bảo tồn cách gọi của nguyên văn và sự căng thẳng thần học trong lời cảnh báo; phần đồng vị ngay sau đó phơi bày rằng chúng chỉ là sản phẩm do tay người làm ra.
- issue: Phủ định hành vi hay diễn giải sự bất lực của các thần
  choice: không thấy, không nghe, không ăn và không ngửi
  alternative: không thể thấy, nghe, ăn hay ngửi
  rationale: Nguyên văn lặp לֹא, diễn đạt rằng chúng không thực hiện các hành vi ấy. Bản dịch giữ cấu trúc phủ định, không âm thầm đổi thành một lời giải thích về khả năng, dù sự bất lực được hàm ý rõ trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng giao ước; dùng “phụng thờ” để bao quát sắc thái phục vụ và thờ phượng. Các dấu gạch ngang làm rõ phần đồng vị mà không thay đổi quan hệ cú pháp.
