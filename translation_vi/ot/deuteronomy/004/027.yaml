revisions:
- from: Yahweh sẽ phân tán anh em giữa các dân, và anh em sẽ chỉ còn lại ít người giữa các nước mà Yahweh sẽ xua anh em đến.[a]
  to: Yahweh sẽ phân tán anh em giữa các dân, và anh em sẽ chỉ còn ít người giữa các nước, nơi Yahweh sẽ xua anh em đến.[a]
  rationale: Chỉ điều chỉnh cú pháp mệnh đề chỉ nơi chốn để câu tiếng Việt tự nhiên và minh bạch hơn. Không thay đổi nghĩa, mức độ cưỡng bức hàm ý trong lựa chọn «xua», hay nội dung chú thích về phương án «dẫn».
