  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: vi
  text: Yahweh sẽ phân tán anh em giữa các dân, và anh em sẽ chỉ còn ít người giữa các nước, nơi Yahweh sẽ xua anh em đến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dẫn anh em đến.” Động từ Hê-bơ-rơ có thể mang nghĩa “dẫn” hoặc “xua”; ở đây chọn “xua” vì ngữ cảnh là sự phán xét và lưu đày.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: sẽ phân tán
  rationale: Thể Hifil của פוץ diễn tả hành động khiến một cộng đồng bị phân tán; “phân tán” tự nhiên và phù hợp với bối cảnh phán xét giao ước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tetragrammaton, thay vì thay bằng một tước hiệu.
- source_word: בָּעַמִּים
  choice: giữa các dân
  rationale: עַמִּים chỉ các cộng đồng dân tộc; “các dân” cũng giữ được sự phân biệt với גּוֹיִם ở vế sau.
- source_word: וְנִשְׁאַרְתֶּם מְתֵי מִסְפָּר
  choice: anh em sẽ chỉ còn lại ít người
  rationale: Diễn đạt tự nhiên ý bị giảm xuống thành một số người rất ít, đồng thời thể hiện sắc thái kết quả của thể Nifal.
- source_word: בַּגּוֹיִם
  choice: giữa các nước
  rationale: Trong ngữ cảnh này, גּוֹיִם nói đến những quốc gia ngoại bang; “các nước” tránh đưa vào sắc thái tôn giáo về sau của từ “dân ngoại”.
- source_word: אֲשֶׁר יְנַהֵג יְהוָה אֶתְכֶם שָׁמָּה
  choice: mà Yahweh sẽ xua anh em đến
  rationale: נהג có thể là “dẫn” hoặc “xua”; “xua” phù hợp hơn với bối cảnh cưỡng bức lưu đày, còn שָׁמָּה được thể hiện tự nhiên qua “đến” trong mệnh đề quan hệ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” giữ đây là tên riêng, không thay bằng tước hiệu.
- issue: Sắc thái của động từ נהג trong lời phán xét
  choice: xua
  alternative: dẫn
  rationale: Ngữ cảnh nói về sự phân tán và lưu đày do phán xét nên “xua” thể hiện sự cưỡng bức, nhưng nghĩa “dẫn” vẫn thực sự có thể có và được giữ trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai số nhiều hướng đến cộng đồng giao ước; giữ sự phân biệt giữa “các dân” và “các nước” trong hai vế.
