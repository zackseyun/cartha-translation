source:
  edition: WLC
  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: vi
  text: Hãy cẩn thận, kẻo anh em quên giao ước mà Yahweh, Đức Chúa Trời của anh em, đã lập với anh em, rồi làm cho mình một tượng chạm khắc theo hình dạng của bất cứ vật gì mà Yahweh, Đức Chúa Trời của anh em, đã truyền rằng anh em không được làm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “mà Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em.” Ý phủ định “không được làm” được hàm ý theo ngữ cảnh; xem Phục Truyền Luật Lệ Ký 4:16.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Hãy cẩn thận giữ mình
  rationale: Cụm mệnh lệnh Nifal với לָכֶם là lời cảnh báo mang nghĩa tự canh giữ, đề phòng. Cách dịch này tự nhiên trong tiếng Việt, đồng thời giữ được cả sắc thái thận trọng lẫn ý phản thân.
- source_word: פֶּן תִּשְׁכְּחוּ
  choice: kẻo anh em quên
  rationale: פֶּן mở đầu điều tiêu cực cần đề phòng; “kẻo” diễn đạt cô đọng và trang trọng quan hệ cảnh báo ấy.
- source_word: בְּרִית
  choice: giao ước
  rationale: “Giao ước” là thuật ngữ tiếng Việt quen thuộc, giữ được ý nghĩa về mối ràng buộc long trọng trong quan hệ giữa Đức Chúa Trời và dân Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm tên riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: mà ... đã lập với anh em
  rationale: כרת ברית là thành ngữ chỉ việc lập giao ước; dịch từng chữ là “cắt” sẽ khó hiểu trong tiếng Việt hiện đại.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: rồi làm cho mình
  rationale: Giữ sắc thái phản thân-hưởng lợi của לָכֶם và dùng “rồi” để thể hiện hành động tiếp theo nằm trong điều được cảnh báo.
- source_word: פֶּסֶל
  choice: một tượng chạm
  rationale: פֶּסֶל chỉ một hình tượng được tạo tác, đặc biệt bằng cách chạm khắc. “Tượng chạm” cụ thể hơn “thần tượng” và không cổ kính như một số cách nói truyền thống.
- source_word: תְּמוּנַת כֹּל
  choice: theo hình dạng của bất cứ vật gì
  rationale: Diễn đạt ý về hình thể hoặc sự mô phỏng của bất kỳ sự vật nào, đồng thời kết hợp tự nhiên với “tượng chạm”.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: mà Yahweh, Đức Chúa Trời của anh em, đã truyền rằng anh em không được tạc
  rationale: Bản Hê-bơ-rơ không ghi từ phủ định trong mệnh đề này, nhưng ngữ cảnh trực tiếp, nhất là câu 16, cho thấy mệnh lệnh được nhắc đến là lệnh cấm làm hình tượng. Bổ sung ý phủ định giúp câu tiếng Việt không tạo ấn tượng ngược với lập luận của đoạn văn; chú thích ghi rõ hiện tượng nguyên văn.
theological_decisions:
- issue: Ý phủ định hàm ẩn trong mệnh đề quan hệ cuối câu
  choice: Diễn đạt rõ là “đã truyền rằng anh em không được tạc”.
  alternative: 'Dịch sát hình thức: “mà Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em”, để ý cấm đoán hoàn toàn tùy thuộc vào ngữ cảnh.'
  rationale: Cả lời cảnh báo trong câu này và lệnh cấm rõ ràng ở Phục Truyền Luật Lệ Ký 4:16 xác định đây là điều không được làm. Tuy vậy, vì từ “không” không hiện diện trong văn bản Hê-bơ-rơ còn truyền lại, việc bổ sung được công khai trong chú thích thay vì che giấu độ tỉnh lược của nguyên văn.
- issue: Sự chuyển từ đại từ số nhiều sang số ít trong tiếng Hê-bơ-rơ
  choice: Dùng “anh em” xuyên suốt, hiểu là cộng đồng Israel.
  alternative: Ở mệnh đề cuối chuyển sang cách xưng hô số ít như “ngươi”.
  rationale: Tiếng Hê-bơ-rơ chuyển từ hậu tố số nhiều sang số ít ở cuối câu, một cách chuyển đổi thường gặp khi nói với Israel vừa như cộng đồng vừa như một đơn vị. Tiếng Việt hiện đại không thể hiện chuyển đổi này tự nhiên nếu dùng “ngươi”, và làm vậy sẽ gây cảm giác cổ hoặc như đổi đối tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng như đại từ tập thể chỉ dân Israel; “kẻo” giữ sắc thái cảnh báo long trọng. Dấu chú thích được đặt ngay sau phần bổ sung ý phủ định để người đọc nhận biết chính xác vấn đề văn bản.
