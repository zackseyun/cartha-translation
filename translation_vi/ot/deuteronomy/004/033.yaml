source:
  edition: WLC
  text: הֲ/שָׁ֣מַֽע עָם֩ ק֨וֹל אֱלֹהִ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כַּ/אֲשֶׁר שָׁמַ֥עְתָּ אַתָּ֖ה וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: vi
  text: Có dân tộc nào từng nghe tiếng Đức Chúa Trời phán từ trong lửa, như chính anh em đã nghe, và còn sống không?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và sống sót.” Động từ Hê-bơ-rơ theo nghĩa đen là “sống”; trong văn mạch, điều này hàm ý dân chúng còn sống sau khi nghe Đức Chúa Trời phán từ trong lửa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: Có ... nào đã nghe ... không?
  rationale: Tiểu từ nghi vấn đi với động từ hoàn thành tạo câu hỏi tu từ. Cấu trúc “Có ... nào đã ... không?” tự nhiên trong tiếng Việt và giữ sắc thái hỏi về một kinh nghiệm chưa từng có.
- source_word: עָם
  choice: dân tộc
  rationale: Danh từ chỉ một cộng đồng hay một dân; “dân tộc” diễn đạt rõ một tập thể được đem so sánh với Israel trong ngữ cảnh này.
- source_word: קוֹל אֱלֹהִים
  choice: tiếng Đức Chúa Trời
  rationale: Khi đi với động từ “phán”, קוֹל chỉ tiếng nói có nội dung, không chỉ một âm thanh. Danh xưng số ít phù hợp với phân từ số ít và ngữ cảnh.
- source_word: מְדַבֵּר
  choice: phán
  rationale: “Phán” là cách nói trang trọng nhưng thông dụng khi Đức Chúa Trời nói, phù hợp văn mạch thần hiện; không thêm nội dung ngoài hành động nói.
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: từ giữa lửa
  rationale: Giữ hình ảnh không gian cụ thể của מִתּוֹךְ, đồng thời tự nhiên và gọn trong tiếng Việt.
- source_word: כַּ/אֲשֶׁר שָׁמַעְתָּ אַתָּה
  choice: như chính anh em đã nghe
  rationale: “Như” giữ phép so sánh; “chính” chuyển tải sự nhấn mạnh của đại từ độc lập אַתָּה. “Anh em” dùng đại từ số nhiều theo đối tượng tập thể Israel được Môi-se nói với.
- source_word: וַ/יֶּחִי
  choice: mà vẫn sống
  rationale: Nghĩa từ vựng cốt lõi là “sống”. “Mà vẫn” diễn đạt tự nhiên quan hệ bất ngờ hàm chứa trong câu hỏi tiếng Việt mà không chuyển hẳn sang nghĩa diễn giải “sống sót”.
theological_decisions:
- issue: Cách dịch אֱלֹהִים trong bối cảnh Đức Chúa Trời trực tiếp tự bày tỏ
  choice: Đức Chúa Trời
  alternative: một thần; các thần
  rationale: Phân từ מְדַבֵּר ở số ít và bối cảnh giao ước tại Hô-rếp xác định một chủ thể duy nhất là Đức Chúa Trời của Israel; không cần thêm diễn giải giáo lý.
- issue: Có nên nói rõ rằng nghe Đức Chúa Trời mà không chết là một sự sống sót phi thường hay không
  choice: mà vẫn sống
  alternative: và sống; mà sống sót
  rationale: Động từ Hê-bơ-rơ chỉ nói “sống”. Bản dịch chính giữ từ “sống”, còn “vẫn” giúp câu hỏi tu từ tự nhiên và biểu đạt sự tương phản do ngữ cảnh gợi ra, không thay động từ bằng cách diễn giải mạnh hơn là “sống sót”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời và “anh em” để nói với Israel như một cộng đồng. Dấu chú thích [a] được đặt sau toàn bộ câu vì chú thích giải thích cụm kết thúc “mà vẫn sống”.
