  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם וַ/הֲשֵׁבֹתָ֮ אֶל לְבָבֶ/ךָ֒ כִּ֤י יְהוָה֙ ה֣וּא הָֽ/אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת אֵ֖ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: vi
  text: 'Vậy hôm nay, hãy nhận biết và ghi lòng[a] điều này: Yahweh, chính Ngài là Đức Chúa Trời trên trời cao và dưới đất thấp; không có ai khác.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát chữ: “hãy đưa điều ấy trở lại lòng mình” hoặc “hãy đặt vào lòng.” Đây là thành ngữ chỉ việc thừa nhận và đón nhận một điều là thật trong lòng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: hôm nay hãy nhận biết
  rationale: Dạng hoàn thành Qal ngôi hai số ít mang sắc thái khuyên truyền/mệnh lệnh trong văn cảnh. “Hãy nhận biết” diễn đạt cả sự hiểu biết lẫn thừa nhận, còn “hôm nay” giữ tính cấp thời của lời kêu gọi.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: và ghi lòng
  rationale: Cụm Híp-in của שוב với “lòng” là thành ngữ chỉ việc đưa một chân lý vào nội tâm để suy xét và xác tín. “Ghi lòng” tự nhiên trong tiếng Việt, giữ hình ảnh về lòng mà không dịch cứng từng chữ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tetragrammaton, thay vì thay thế bằng một tước hiệu.
- source_word: הוּא הָאֱלֹהִים
  choice: chính Ngài là Đức Chúa Trời
  rationale: “Chính Ngài” bảo toàn tác dụng nhấn mạnh của đại từ הוּא; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc và xác định trong tiếng Việt.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: trên trời cao và dưới đất thấp
  rationale: Giữ cặp đối xứng bao quát toàn thể vũ trụ—trời phía trên và đất phía dưới—bằng lối diễn đạt gọn, tự nhiên.
- source_word: אֵין עוֹד
  choice: không có thần nào khác
  rationale: Trong mạch xác nhận Yahweh là Đức Chúa Trời, từ “thần” được bổ sung theo hàm ý để câu tiếng Việt nêu rõ đối tượng của sự phủ định; chú thích bảo lưu khả năng dịch sát hơn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm “Yahweh” bảo toàn sự phân biệt giữa tên riêng và tước hiệu.
- issue: Lời khẳng định độc tôn אֵין עוֹד
  choice: không có thần nào khác
  alternative: không còn ai/đấng nào khác
  rationale: Văn cảnh trực tiếp xác định Yahweh là Đức Chúa Trời trên toàn cõi trời đất. Bản dịch nêu rõ ý độc tôn thần linh nhưng không khai triển thành một công thức thần học vượt quá câu Hebrew.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Ghi lòng” chuyển tải thành ngữ Hebrew về việc nội tâm hóa chân lý; “chính Ngài” giữ điểm nhấn của đại từ. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
