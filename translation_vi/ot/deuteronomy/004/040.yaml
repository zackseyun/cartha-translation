  text: וְ/שָׁמַרְתָּ֞ אֶת חֻקָּ֣י/ו וְ/אֶת מִצְוֺתָ֗י/ו אֲשֶׁ֨ר אָנֹכִ֤י מְצַוְּ/ךָ֙ הַ/יּ֔וֹם אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וּ/לְ/בָנֶ֖י/ךָ אַחֲרֶ֑י/ךָ וּ/לְמַ֨עַן תַּאֲרִ֤יךְ יָמִים֙ עַל הַ֣/אֲדָמָ֔ה אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: vi
  text: Vậy, anh em hãy tuân giữ các luật lệ và điều răn của Ngài mà hôm nay tôi truyền cho anh em, để mọi sự được tốt lành cho anh em và con cháu anh em về sau, và để anh em được sống lâu trên đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em suốt đời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Vậy, anh em phải tuân giữ
  rationale: Động từ שׁמר trong bối cảnh giao ước mang nghĩa tuân giữ, thực hành. “Vậy” nối câu này với lập luận trước, còn “phải” thể hiện lực mệnh lệnh trong ngữ cảnh. Đại từ Hê-bơ-rơ ở số ít nhưng chỉ toàn thể dân Israel; “anh em” tự nhiên hơn trong lời kêu gọi cộng đồng bằng tiếng Việt.
- source_word: חֻקָּיו וְאֶת מִצְוֺתָיו
  choice: các luật lệ và điều răn của Ngài
  rationale: “Luật lệ” diễn đạt các quy định được ấn định, còn “điều răn” giữ sắc thái mệnh lệnh giao ước và phân biệt hai danh từ.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Giữ tình huống phát ngôn hiện tại và cấu trúc quan hệ của nguyên văn; “truyền” có sắc thái trang trọng nhưng vẫn dễ hiểu.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: để anh em ... được phúc
  rationale: Thành ngữ ייטב לְ nói đến tình trạng tốt lành, thuận lợi và phúc lợi. “Được phúc” tự nhiên, cô đọng trong tiếng Việt và không giới hạn ý nghĩa vào thịnh vượng vật chất.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: và con cháu sau này
  rationale: בָּנִים có thể là con trai, con cái hoặc hậu duệ. Trong ngữ cảnh qua các thế hệ, “con cháu” chuyển tải phạm vi rộng mà không giới hạn ở nam giới.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: và để anh em được sống lâu
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ Hê-bơ-rơ theo nghĩa đen là “kéo dài ngày tháng”; vẫn giữ ý tuổi thọ lâu dài.
- source_word: עַל הָאֲדָמָה
  choice: trên đất
  rationale: אֲדָמָה ở đây là vùng đất Đức Chúa Trời ban, còn עַל theo nghĩa sát là “trên”. Cụm này vừa gần nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó giữ cách gọi trực tiếp trong nguyên văn.
- source_word: נֹתֵן לְךָ
  choice: ban cho anh em
  rationale: “Ban” phù hợp với hành động Đức Chúa Trời trao đất và giữ văn phong trang trọng; hiện tại tính của phân từ được thể hiện bằng câu trần thuật hiện tại.
- source_word: כָּל הַיָּמִים
  choice: mãi mãi
  rationale: Trong lời hứa về việc ở trên đất, cụm này chỉ thời gian liên tục, lâu dài. “Mãi mãi” là cách nói tiếng Việt tự nhiên, dù nguyên văn theo sát là “mọi ngày”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước יהוה. Giữ “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu.
- issue: Quan hệ giữa sự vâng phục và điều tốt lành
  choice: để anh em và con cháu sau này được phúc
  alternative: hầu mọi việc được tốt đẹp cho anh em và con cháu
  rationale: Giữ quan hệ mục đích/kết quả của câu mà không xác định điều tốt lành chỉ là vật chất, chính trị hay thuộc linh.
- issue: Phạm vi của בָּנִים
  choice: con cháu
  alternative: các con trai / con cái
  rationale: Ngữ cảnh nhấn mạnh các thế hệ sau, nên “con cháu” bao quát hơn mà không thêm một giáo thuyết riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho đại từ số ít tập thể hướng đến Israel, “Ngài” để hồi chỉ Đức Chúa Trời, và giữ danh Yahweh. Không cần chú thích vì các nét nghĩa chính có thể chuyển tải tự nhiên trong câu.
