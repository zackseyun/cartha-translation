source:
  edition: WLC
  text: לָ/נֻ֨ס שָׁ֜מָּ/ה רוֹצֵ֗חַ אֲשֶׁ֨ר יִרְצַ֤ח אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמ֣וֹל שִׁלְשׁ֑וֹם וְ/נָ֗ס אֶל אַחַ֛ת מִן הֶ/עָרִ֥ים הָ/אֵ֖ל וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: vi
  text: để người nào vô ý[a] giết người lân cận của mình mà trước đó[b] không hề thù ghét người ấy có thể chạy trốn đến một trong các thành này và sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen là “không biết”; trong bối cảnh pháp luật này, chỉ việc giết người không chủ ý.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen, “từ hôm qua hoặc hôm kia”; đây là một thành ngữ nghĩa là “trước đây” hoặc “trước đó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: có thể chạy trốn đến
  rationale: Động từ nguyên mẫu với ל diễn tả mục đích, nối với việc biệt riêng các thành ở câu trước; cấu trúc tiếng Việt dùng “để ... có thể” truyền đạt tự nhiên quan hệ này. “Đến” diễn đạt שָׁמָּה trong ngữ cảnh đích đến.
- source_word: רוֹצֵחַ אֲשֶׁר יִרְצַח
  choice: người nào ... giết
  rationale: Trong luật về thành trú ẩn, danh từ này chỉ người gây ra cái chết chứ không mặc nhiên quy kết tội sát nhân; cách dịch trung tính tránh áp đặt mức độ culpability mà chính các mệnh đề sau đang xác định.
- source_word: רֵעֵהוּ
  choice: người lân cận mình
  rationale: “Người lân cận” là cách diễn đạt trang trọng, dễ hiểu cho רֵעַ trong ngữ cảnh pháp lý và quan hệ cộng đồng.
- source_word: בִּבְלִי דַעַת
  choice: vô ý
  rationale: Nghĩa đen là “không có sự hiểu biết/không biết”; trong luật về ngộ sát, cụm này chỉ hành động không biết trước, không chủ ý. “Vô ý” là thuật ngữ tiếng Việt tự nhiên và chính xác trong ngữ cảnh.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: mà ... không hề thù ghét người ấy
  rationale: Phân từ שֹׂנֵא mô tả một thái độ kéo dài. “Không hề thù ghét” giữ được ý không có tình trạng thù ghét, còn “mà” liên kết tự nhiên với điều kiện vô ý.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: trước đó
  rationale: Đây là thành ngữ chỉ thời gian trước đây, theo nghĩa đen là “từ hôm qua, hôm kia”; “trước đó” truyền đạt đúng nghĩa thành ngữ trong tiếng Việt hiện đại.
- source_word: אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: đến một trong các thành này
  rationale: Giữ số lượng “một trong” và chỉ từ gần “này”, quy chiếu trực tiếp về ba thành vừa nêu.
- source_word: וָחָי
  choice: và được sống
  rationale: 'Diễn tả kết quả pháp lý của việc chạy đến thành trú ẩn: mạng sống của người ấy được bảo toàn. “Được sống” tự nhiên hơn “và sống” trong mạch tiếng Việt này.'
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. Tránh dùng “kẻ sát nhân” vì dễ hàm ý giết người có chủ ý. Gộp sắc thái của בִּבְלִי דַעַת vào “vô ý” để tránh lặp ý không tự nhiên, đồng thời giữ nghĩa đen trong chú thích.
