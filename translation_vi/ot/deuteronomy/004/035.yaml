language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: vi
  text: Ngươi đã được cho thấy những điều ấy[a] để ngươi biết rằng Yahweh, chính Ngài là Đức Chúa Trời[b]; ngoài Ngài ra không có thần nào khác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dùng đại từ số ít để nói với Israel như một cộng đồng; động từ mang nghĩa bị động: Israel đã được khiến cho thấy những điều ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “Yahweh, Ngài là Đức Chúa Trời”; đại từ “Ngài” có tác dụng nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: anh em đã được cho thấy
  rationale: 'Dạng Hoph‘al của ראה mang nghĩa bị động-nguyên nhân: dân Israel được khiến cho thấy, chứ không chỉ tự mình nhìn thấy. “Anh em” diễn đạt tự nhiên đối tượng tập thể là Israel, dù tiếng Hê-bơ-rơ dùng số ít.'
- source_word: לָדַעַת
  choice: để biết
  rationale: Động từ nguyên mẫu với ל־ diễn tả mục đích hoặc kết quả; “để biết” giữ được lực mục đích một cách tự nhiên trong tiếng Việt.
- source_word: כִּי
  choice: rằng
  rationale: Ở đây כִּי dẫn vào nội dung điều Israel cần biết, không phải một mệnh đề chỉ nguyên nhân.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời theo danh hiệu bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: הוּא
  choice: chính Ngài
  rationale: Đại từ độc lập tạo sắc thái nhấn mạnh. “Chính Ngài” bảo toàn sự nhấn mạnh mà không thêm ý “một mình,” vốn được diễn đạt ở vế sau.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có mạo từ xác định đồng nhất Yahweh là Đức Chúa Trời; cách gọi này trang trọng và tự nhiên trong tiếng Việt.
- source_word: אֵין עוֹד מִלְבַדּוֹ
  choice: ngoài Ngài ra không có thần nào khác
  rationale: Diễn đạt rõ thành ngữ phủ nhận mọi thần khác ngoài Yahweh, đồng thời tránh mở rộng câu thành một khẳng định triết học vượt quá văn cảnh.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay bằng tước hiệu.
- issue: Mức độ của lời khẳng định độc tôn
  choice: ngoài Ngài ra không có thần nào khác
  alternative: ngoài Ngài ra không có ai khác
  rationale: “Thần nào khác” làm rõ phạm vi thần học của אֵין עוֹד trong văn cảnh, tránh để câu tiếng Việt bị hiểu là phủ nhận sự tồn tại của mọi hữu thể khác.
- issue: Sắc thái nhấn mạnh của הוּא
  choice: chính Ngài là Đức Chúa Trời
  alternative: Ngài là Đức Chúa Trời
  rationale: Giữ đại từ nhấn mạnh trong tiếng Hê-bơ-rơ nhưng không diễn giải quá mức thành “chỉ một mình Ngài,” vì vế cuối đã nêu tính độc tôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói tự nhiên với toàn thể Israel, đồng thời chú thích rằng nguyên văn dùng số ít tập thể. Cấu trúc “Yahweh, chính Ngài…” giữ nét nhấn mạnh của tiếng Hê-bơ-rơ.
