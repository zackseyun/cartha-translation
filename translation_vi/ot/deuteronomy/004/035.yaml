  source_fidelity: 'Cần sửa đại từ xưng hô chính văn: הָרְאֵתָ và các hình thức ngầm định đi kèm là số ít, dù được ngỏ với Israel theo tư cách cộng đồng. Bản dịch “Anh em” chuyển thành số nhiều và không còn phản ánh trực tiếp hình thức nguồn. Nghĩa bị động của Hoph‘al (“đã được cho thấy”) và sắc thái mục đích của לָדַעַת được chuyển đạt đúng. Vế cuối “không có thần nào khác” diễn đạt tự nhiên lời phủ định về bất cứ thần nào khác ngoài Yahweh trong ngữ cảnh này.'
  naturalness: Bản sửa dùng “ngươi” để giữ số ít cộng đồng của nguyên văn trong văn phong Kinh Thánh trang trọng. Câu vẫn rõ ràng, hiện đại và mạch lạc; việc lặp “ngươi” sau “để” làm rõ chủ thể của sự biết mà không làm nặng câu.
