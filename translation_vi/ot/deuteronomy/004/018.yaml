source:
  edition: WLC
  text: תַּבְנִ֕ית כָּל רֹמֵ֖שׂ בָּ/אֲדָמָ֑ה תַּבְנִ֛ית כָּל דָּגָ֥ה אֲשֶׁר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/018.yaml
  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: vi
  text: hình dạng của bất cứ sinh vật nào bò trên mặt đất, hình dạng của bất cứ loài cá nào ở trong nước dưới đất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nước dưới đất” phản ánh cách nói quen thuộc trong Kinh Thánh về nước ở phía dưới đất; so sánh lời cấm làm hình tượng trong Xuất Ai Cập 20:4.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: hình dạng
  rationale: Trong ngữ cảnh cấm tạo hình tượng, từ này chỉ hình thể hay dạng thức có thể được dùng làm mẫu để tái hiện. “Hình dạng” giữ được nghĩa rộng, không thu hẹp thành một loại tượng cụ thể.
- source_word: כָּל
  choice: bất cứ
  rationale: Với các danh từ chỉ loài ở số ít, “bất cứ” diễn đạt tự nhiên sắc thái bao quát và phân phối của tiếng Hê-bơ-rơ.
- source_word: רֹמֵשׂ
  choice: loài vật nào bò
  rationale: Phân từ của רמשׂ chỉ những sinh vật di chuyển sát mặt đất; cách diễn đạt này tự nhiên hơn “vật bò trườn” mà vẫn giữ phạm vi tương đối rộng.
- source_word: בָּאֲדָמָה
  choice: trên mặt đất
  rationale: Ở đây אֲדָמָה là bề mặt đất nơi các sinh vật bò; “trên mặt đất” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: דָּגָה
  choice: loài cá
  rationale: Danh từ có nghĩa tập hợp; “loài cá” phù hợp với cách phân loại sinh vật trong mạch văn.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: nào ở trong vùng nước
  rationale: Giữ lại mệnh đề quan hệ của nguyên văn; “vùng nước” diễn đạt tự nhiên danh từ hình thái số nhiều מַיִם mà không tạo cảm giác gượng ép.
- source_word: מִתַּחַת לָאָרֶץ
  choice: dưới đất
  rationale: Giữ cách nói vũ trụ quan quen thuộc trong Kinh Thánh về nước ở phía dưới đất và tiếng vọng với Xuất Ai Cập 20:4, không diễn giải thêm.
theological_decisions:
- issue: Cách diễn đạt đối tượng được tái hiện trong ngữ cảnh chống thờ hình tượng
  choice: hình dạng của bất cứ…
  alternative: hình tượng của bất cứ…; hình ảnh giống như bất cứ…
  rationale: “Hình dạng” phản ánh תַּבְנִית mà không thu hẹp nghĩa thành tượng thờ hay một phương tiện tạo hình cụ thể. Sức nặng chống thờ hình tượng đến từ mạch văn, không phải từ việc thêm khái niệm vào câu.
- issue: Cụm từ chỉ nước ở phía dưới đất
  choice: vùng nước dưới đất
  alternative: nước bên dưới mặt đất; nước phía dưới đất
  rationale: Giữ nguyên sức căng của cách nói cổ và sự tương ứng với công thức cấm tạo hình tượng, thay vì hiện đại hóa thành một mô tả khoa học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc lặp “hình dạng của bất cứ…” để phản ánh phép song hành của nguyên văn. Không thêm chú thích từ vựng cho תַּבְנִית vì “hình dạng” đã truyền đạt đủ nghĩa trong tiếng Việt; dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
