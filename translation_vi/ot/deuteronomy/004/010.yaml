  source_fidelity: 'Bản dịch nhìn chung bám sát tiếng Hê-bơ-rơ: cấu trúc hồi tưởng “là ngày…”, việc đứng trước Yahweh tại Hô-rếp, mục đích nghe lời Ngài để học kính sợ Ngài suốt đời, và việc dạy con cái đều được giữ lại. Tuy nhiên, “trước mặt Ta” trong mệnh lệnh tập hợp diễn giải cụ thể hơn giới từ לִי (“đến với Ta/cho Ta”); nên giữ hướng quy tụ về Yahweh mà không thêm khái niệm ‘trước mặt’.'
