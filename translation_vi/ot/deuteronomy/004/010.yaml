  terminology: “Yahweh” nhất quán với việc phiên âm danh יהוה; “Đức Chúa Trời”, “Hô-rếp”, và “kính sợ” phù hợp. Chú thích cho אֲדָמָה bảo tồn đúng khả năng “đất/mặt đất” hoặc “xứ”.
