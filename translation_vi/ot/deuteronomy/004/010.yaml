  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: vi
  text: 'là ngày anh em đứng trước mặt Yahweh, Đức Chúa Trời của anh em, tại Hô-rếp, khi Yahweh phán với tôi: “Hãy tập hợp dân chúng lại đến với Ta, để Ta cho họ nghe những lời của Ta, hầu cho họ học biết kính sợ Ta suốt những ngày họ sống trên đất[a], và dạy điều ấy cho con cái mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong xứ”. Từ Hê-bơ-rơ אֲדָמָה có thể chỉ đất hay mặt đất nói chung, hoặc một miền đất cụ thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: là ngày
  rationale: Giữ hình thức nhắc lại một ngày cụ thể trong mạch câu đang tiếp diễn từ văn cảnh trước.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: anh em đứng trước mặt
  rationale: Diễn đạt trực tiếp tư thế đứng trong sự hiện diện của Đức Chúa Trời; đại từ số ít tập thể được chuyển thành “anh em” tự nhiên trong lời Môi-se nói với dân.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, không thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở hữu mang sắc thái giao ước và dùng cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: בְּחֹרֵב
  choice: tại Hô-rếp
  rationale: “Tại” diễn đạt địa điểm tự nhiên; Hô-rếp là dạng tên riêng quen dùng trong tiếng Việt.
- source_word: הַקְהֶל לִי אֶת הָעָם
  choice: Hãy tập hợp dân chúng lại trước mặt Ta
  rationale: Giữ sắc thái truyền khiến của động từ Hiphil và ý hướng dân chúng đến với Đức Chúa Trời; “trước mặt Ta” tự nhiên hơn “cho Ta” trong tiếng Việt.
- source_word: וְאַשְׁמִעֵם
  choice: để Ta cho họ nghe
  rationale: Giữ nghĩa gây khiến của dạng Hiphil, đồng thời nối tự nhiên với mục đích của việc tập hợp.
- source_word: דְּבָרָי
  choice: những lời của Ta
  rationale: Giữ dạng số nhiều và tính cụ thể của lời Đức Chúa Trời phán.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: hầu cho họ học biết kính sợ Ta
  rationale: “Hầu cho” biểu thị mục đích; “kính sợ” giữ cả ý sợ hãi, tôn kính và đáp ứng giao ước mà không làm nhẹ thành chỉ “tôn kính”.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: suốt những ngày họ sống
  rationale: Giữ thành ngữ Hê-bơ-rơ về toàn bộ thời gian sống bằng cách diễn đạt rõ ràng, tự nhiên.
- source_word: עַל הָאֲדָמָה
  choice: trên đất
  rationale: “Đất” giữ được độ rộng nghĩa giữa mặt đất/địa cầu và miền đất cụ thể; chú thích nêu khả năng hiểu là xứ.
- source_word: וְאֶת בְּנֵיהֶם יְלַמֵּדוּן
  choice: và dạy điều ấy cho con cái mình
  rationale: “Con cái” diễn đạt hậu duệ nói chung; thêm “điều ấy” làm rõ bổ ngữ được hiểu ngầm của động từ “dạy” mà không xác định hẹp nội dung.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của ירא trong bối cảnh giao ước
  choice: kính sợ Ta
  alternative: tôn kính Ta
  rationale: “Kính sợ” duy trì sức nặng và sự căng thẳng của ý niệm vừa sợ, vừa kính, vừa vâng phục; “tôn kính” riêng lẻ dễ làm nhẹ nghĩa.
- issue: Phạm vi của בנים
  choice: con cái
  alternative: các con trai
  rationale: Trong mệnh lệnh truyền dạy qua các thế hệ, danh từ số nhiều giống đực có chức năng chỉ con cháu nói chung, không nhất thiết chỉ nam giới.
- issue: Bổ ngữ ngầm của יְלַמֵּדוּן
  choice: dạy điều ấy
  alternative: dạy chúng kính sợ Ta
  rationale: Nguyên văn không lặp lại bổ ngữ; “điều ấy” giữ sự khái quát và tránh quyết định rằng nội dung duy nhất là sự kính sợ, dù đó là trọng tâm gần nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho đại từ số ít tập thể hướng đến toàn dân; trong lời phán, viết hoa “Ta” theo quy ước tiếng Việt khi Đức Chúa Trời tự xưng. Câu mở đầu “là ngày” chủ ý phản ánh việc câu này tiếp nối mệnh lệnh nhớ lại ở câu trước.
