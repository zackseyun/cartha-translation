  text: בַּ/צַּ֣ר לְ/ךָ֔ וּ/מְצָא֕וּ/ךָ כֹּ֖ל הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה בְּ/אַחֲרִית֙ הַ/יָּמִ֔ים וְ/שַׁבְתָּ֙ עַד יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׁמַעְתָּ֖ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: vi
  text: Khi ngươi gặp cảnh khốn khó và tất cả những điều này xảy đến với ngươi, vào thời sau này[a], ngươi sẽ trở về với Yahweh, Đức Chúa Trời của ngươi, và lắng nghe tiếng Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vào thời kỳ sau này”. Cụm từ Hê-bơ-rơ này có thể nói chung về một thời điểm trong tương lai, không nhất thiết chỉ một thời kỳ tận thế cụ thể.
    reason: alternative_reading
  - marker: b
    text: “Lắng nghe tiếng Ngài” cũng có thể dịch là “vâng theo tiếng Ngài”, vì cách nói Hê-bơ-rơ này thường bao hàm ý nghe và làm theo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר
  choice: khi anh em lâm cảnh ngặt nghèo
  rationale: Cụm giới từ diễn tả hoàn cảnh khốn khó. Thêm “khi” chuyển tải tự nhiên sắc thái thời gian của mệnh đề mở đầu không có động từ trong tiếng Hê-bơ-rơ.
- source_word: וּמְצָאוּךָ
  choice: xảy đến với anh em
  rationale: Động từ מצא có nghĩa đen là “tìm thấy”, nhưng khi chủ thể là các biến cố hoặc tai họa, “xảy đến với” là cách diễn đạt tự nhiên, vẫn giữ ý chúng chạm tới người được nói với.
- source_word: כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: mọi điều này
  rationale: דְּבָרִים có thể là lời, sự việc hoặc điều; trong ngữ cảnh, cụm này chỉ các biến cố và hình phạt đã được cảnh báo.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: vào những ngày về sau
  rationale: Cách dịch này giữ thành ngữ chỉ thời gian tương lai nhưng không tự giới hạn cụm từ vào một hệ thống thời kỳ tận thế cụ thể.
- source_word: וְשַׁבְתָּ עַד
  choice: anh em sẽ trở về với
  rationale: שׁוּב đi với עַד diễn tả quay lại hoặc trở về với một người. “Trở về với” giữ được sắc thái quan hệ và giao ước mà không thêm trực tiếp thuật ngữ thần học “ăn năn”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng chuyển tự của danh riêng יהוה thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở hữu và sắc thái giao ước của hậu tố ngôi thứ hai số ít; “anh em” phù hợp với lời Môi-se nói với dân Y-sơ-ra-ên như một cộng đồng.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: và lắng nghe tiếng Ngài
  rationale: Giữ hình ảnh thính giác của nguyên văn; trong thành ngữ Hê-bơ-rơ, việc nghe cũng hàm ý chú ý và làm theo.
theological_decisions:
- issue: Cụm thời gian בְּאַחֲרִית הַיָּמִים có thể bị hiểu quá hẹp theo nghĩa tận thế
  choice: vào những ngày về sau
  alternative: vào thời kỳ sau rốt
  rationale: Nguyên ngữ có thể chỉ một thời điểm tương lai nói chung, không nhất thiết xác định một sơ đồ tận thế. Bản dịch giữ độ mở này.
- issue: Ý nghĩa giao ước của וְשַׁבְתָּ עַד יְהוָה
  choice: anh em sẽ trở về với Yahweh
  alternative: anh em sẽ ăn năn và quay về với Yahweh
  rationale: “Trở về” truyền đạt hành động quay lại với Đức Chúa Trời trong quan hệ giao ước, nhưng không đưa thêm một công thức giáo lý mà động từ đứng riêng không minh nhiên nêu ra.
- issue: Sắc thái vâng phục trong וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: lắng nghe tiếng Ngài
  alternative: vâng theo tiếng Ngài
  rationale: Bản chính giữ hình ảnh “nghe tiếng”, còn chú thích nêu rõ sắc thái vâng phục vốn thường có trong thành ngữ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai giống đực số ít mang tính tập thể, vì Môi-se đang nói với Y-sơ-ra-ên như một cộng đồng; tránh “ngươi” vì quá cổ trong tiếng Việt hiện đại.
