source:
  edition: WLC
  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: vi
  text: Vì có dân tộc lớn nào có các thần ở gần dân ấy như Yahweh, Đức Chúa Trời của chúng ta, ở gần chúng ta mỗi khi chúng ta kêu cầu Ngài?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng từ số nhiều “các thần”; câu hỏi tu từ so sánh các thần của các dân tộc khác với Yahweh, Đức Chúa Trời của Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mỗi khi chúng ta kêu đến Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu lý do cho lời khuyên ở phần trước.
- source_word: מִי גוֹי גָּדוֹל
  choice: có dân tộc lớn nào
  rationale: Diễn đạt tự nhiên câu hỏi tu từ của tiếng Hê-bơ-rơ mà vẫn giữ danh từ số ít 'dân tộc'.
- source_word: אֲשֶׁר לוֹ אֱלֹהִים קְרֹבִים אֵלָיו
  choice: được các thần ở gần mình
  rationale: Tính từ số nhiều קְרֹבִים ủng hộ cách hiểu אֱלֹהִים là số nhiều, chỉ các thần của những dân khác; 'mình' quy chiếu tự nhiên về dân tộc ấy.
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: như Giê-hô-va, Đức Chúa Trời của chúng ta
  rationale: כְּ được dịch bằng 'như'; danh riêng giao ước יהוה được phiên âm theo lối Việt quen dùng là 'Giê-hô-va', còn אֱלֹהֵינוּ mang nghĩa số ít 'Đức Chúa Trời của chúng ta'.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: mỗi khi chúng ta kêu cầu Ngài
  rationale: Cấu trúc בְּכָל với động từ nguyên mẫu diễn tả mọi dịp xảy ra hành động; 'kêu cầu' phù hợp ngữ cảnh cầu nguyện, còn giới từ אֶל vẫn có thể được hiểu sát là 'kêu đến'.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Giê-hô-va
  alternative: Yahweh / Đức Giê-hô-va / CHÚA
  rationale: Giữ đây là danh riêng thay vì thay bằng một tước hiệu; 'Giê-hô-va' là dạng phiên âm đã quen thuộc và dễ hiểu trong tiếng Việt hiện đại. Dạng 'Yahweh' gần với cách phục nguyên học thuật hơn nhưng còn ít tự nhiên hơn đối với đa số độc giả Việt.
- issue: Nghĩa của אֱלֹהִים ở mệnh đề đầu
  choice: các thần
  alternative: Đức Chúa Trời / các hữu thể thần linh
  rationale: Sự hòa hợp với tính từ số nhiều קְרֹבִים và phép so sánh với Giê-hô-va, Đức Chúa Trời của Israel, cho thấy từ này chỉ các thần của những dân khác; bản dịch không xác nhận thực tại hay quyền năng của họ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; giữ cấu trúc câu hỏi tu từ và phép đối chiếu thần học của nguyên văn. Dùng 'kêu cầu' là cách nói tự nhiên trong ngữ cảnh cầu nguyện, đồng thời chú thích cách dịch sát giới từ.
