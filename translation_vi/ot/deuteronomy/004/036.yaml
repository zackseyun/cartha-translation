    issue: Thiếu chú thích cho cụm “từ giữa ngọn lửa”.
    rationale: Bản audit tiếng Anh nêu biến thể dịch hợp lệ cho מִתּוֹךְ הָאֵשׁ (“from within the fire”). Cần có chú thích tương ứng và đặt mốc ngay sau cụm mà chú thích giải thích, không đặt sau “ngọn lửa lớn.”
