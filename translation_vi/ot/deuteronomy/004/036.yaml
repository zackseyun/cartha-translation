  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: vi
  text: Từ trời, Ngài cho anh em nghe tiếng Ngài để rèn dạy anh em[a]; còn trên đất, Ngài cho anh em thấy ngọn lửa lớn của Ngài, và anh em đã nghe những lời Ngài phán từ giữa ngọn lửa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để dạy bảo anh em” hoặc “để sửa trị anh em”; động từ Hê-bơ-rơ có thể bao hàm cả việc uốn nắn bằng sửa trị lẫn giáo huấn.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “từ trong ngọn lửa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: Từ trời
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sự tương phản không gian với “trên đất” ở vế kế tiếp.
- source_word: הִשְׁמִיעֲךָ
  choice: Ngài cho anh em nghe
  rationale: Giữ sắc thái gây khiến của thể Hiphil mà vẫn tự nhiên trong tiếng Việt.
- source_word: קֹלוֹ
  choice: tiếng Ngài
  rationale: Trong ngữ cảnh Đức Chúa Trời phán, קוֹל chỉ tiếng nói có thể nghe được; “tiếng Ngài” trang trọng và tự nhiên hơn “giọng Ngài” ở đây.
- source_word: לְיַסְּרֶךָּ
  choice: để rèn dạy anh em
  rationale: “Rèn dạy” bao hàm cả sự sửa trị lẫn giáo huấn mang tính uốn nắn, tránh thu hẹp động từ vào hình phạt hoặc việc truyền đạt kiến thức đơn thuần.
- source_word: וְעַל הָאָרֶץ
  choice: còn trên đất
  rationale: Giữ sự tương phản với “từ trời”; “còn” làm rõ thế đối ứng giữa hai vế mà không thêm nội dung mới.
- source_word: הֶרְאֲךָ
  choice: Ngài cho anh em thấy
  rationale: Diễn đạt tự nhiên sắc thái gây khiến của thể Hiphil.
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: ngọn lửa lớn của Ngài
  rationale: Giữ hình ảnh cụ thể và sở hữu từ của nguyên văn; “ngọn lửa lớn” tự nhiên trong tiếng Việt.
- source_word: וּדְבָרָיו
  choice: những lời Ngài phán
  rationale: Giữ số nhiều của דְּבָרָיו; thêm “phán” theo nghĩa hiển nhiên của lời Đức Chúa Trời để câu tiếng Việt rõ và tự nhiên.
- source_word: שָׁמַעְתָּ
  choice: anh em đã nghe
  rationale: Thể hoàn thành được chuyển bằng “đã nghe”, chỉ sự kiện nghe thực sự.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: từ giữa ngọn lửa
  rationale: Giữ nghĩa không gian “từ giữa/từ bên trong” và hình ảnh trang nghiêm của nguyên văn.
theological_decisions:
- issue: Mục đích sư phạm của Đức Chúa Trời trong לְיַסְּרֶךָּ
  choice: để rèn dạy anh em
  alternative: để dạy bảo anh em; để sửa trị anh em
  rationale: “Rèn dạy” giữ được sức căng giữa giáo huấn mang tính hình thành và sửa trị, không giới hạn ý nghĩa vào một phía.
- issue: Ngôn ngữ cụ thể về sự tự bày tỏ của Đức Chúa Trời
  choice: tiếng Ngài ... ngọn lửa lớn của Ngài ... những lời Ngài phán
  alternative: Diễn giải bằng các khái niệm trừu tượng về mặc khải
  rationale: Bảo tồn những hình ảnh và cách nói cụ thể của tiếng Hê-bơ-rơ, không làm nhẹ hoặc hệ thống hóa thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “anh em” thể hiện đối tượng tập thể Israel của hậu tố ngôi hai số ít trong tiếng Hê-bơ-rơ, phù hợp lối diễn đạt tiếng Việt trong diễn từ giao ước.
