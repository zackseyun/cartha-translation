  to: Từ trời, Ngài cho anh em nghe tiếng Ngài để rèn dạy anh em[a]; còn trên đất, Ngài cho anh em thấy ngọn lửa lớn của Ngài, và anh em đã nghe những lời Ngài phán từ giữa ngọn lửa[b].
