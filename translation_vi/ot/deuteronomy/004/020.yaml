  text: וְ/אֶתְ/כֶם֙ לָקַ֣ח יְהוָ֔ה וַ/יּוֹצִ֥א אֶתְ/כֶ֛ם מִ/כּ֥וּר הַ/בַּרְזֶ֖ל מִ/מִּצְרָ֑יִם לִ/הְי֥וֹת ל֛/וֹ לְ/עַ֥ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: vi
  text: Nhưng Đức Giê-hô-va đã lấy anh em và đưa anh em ra khỏi lò luyện sắt[a], ra khỏi Ai Cập, để anh em trở thành một dân làm cơ nghiệp của Ngài, như ngày nay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lò luyện sắt” là hình ảnh chỉ nơi chịu cảnh áp bức khắc nghiệt; ở đây là Ai Cập.
    reason: metaphor_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh giao ước quen thuộc trong tiếng Việt, phân biệt danh riêng này với tước hiệu “Chúa”.
- source_word: לָקַח
  choice: chọn lấy
  rationale: Nghĩa cơ bản là “lấy”; trong ngữ cảnh Đức Chúa Trời nhận Israel làm dân riêng, “chọn lấy” diễn đạt tự nhiên hàm ý tuyển chọn mà không mở rộng quá mức.
- source_word: וַיּוֹצִא
  choice: đưa ... ra
  rationale: Giữ sắc thái khiến/đưa ra của dạng Hiphil và phù hợp ngữ cảnh xuất hành.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: ra khỏi lò luyện sắt
  rationale: Giữ nguyên hình ảnh ẩn dụ về Ai Cập như nơi áp bức khắc nghiệt; “lò luyện sắt” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: מִמִּצְרָיִם
  choice: ra khỏi Ai Cập
  rationale: Lặp lại “ra khỏi” theo cấu trúc Hê-bơ-rơ, đồng thời xác định “lò luyện sắt” là Ai Cập.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: để anh em trở thành một dân thuộc về Ngài làm cơ nghiệp
  rationale: Thể hiện cả לוֹ (“thuộc về Ngài”) và נַחֲלָה (“cơ nghiệp”), bảo tồn ngôn ngữ giao ước về quyền sở hữu mà vẫn dễ hiểu.
- source_word: כַּיּוֹם הַזֶּה
  choice: như ngày nay
  rationale: Cách diễn đạt gọn, tự nhiên cho thành ngữ chỉ thực trạng đang hiện hữu vào thời điểm lời nói được phát ra.
theological_decisions:
- issue: Ngôn ngữ về quyền sở hữu giao ước trong לְעַם נַחֲלָה
  choice: một dân thuộc về Ngài làm cơ nghiệp
  alternative: dân riêng của Ngài; một dân làm sản nghiệp của Ngài
  rationale: Bản dịch giữ đồng thời ý dân này thuộc về Đức Giê-hô-va và được gọi là “cơ nghiệp”, thay vì làm phẳng cụm từ thành “dân riêng”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho đại từ số nhiều כֶם vì Môi-se đang nói với toàn dân; viết hoa “Ngài” theo thông lệ tôn kính trong tiếng Việt.
