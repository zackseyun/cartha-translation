  source_fidelity: 'Bản dịch bám sát nguyên văn Hê-bơ-rơ: הִתְאַנֶּף בִּי được chuyển tự nhiên là “nổi giận với tôi”; עַל דִּבְרֵיכֶם giữ được yếu tố “lời”; hai mệnh đề lְבִלְתִּי được thể hiện song song; và נַחֲלָה được dịch phù hợp là “cơ nghiệp”. “Sẽ không được” diễn đạt đúng hiệu lực ngăn cấm của lời thề mà không vượt quá nội dung câu.'
  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. “Anh em” là cách xưng hô thích hợp với cộng đồng Y-sơ-ra-ên trong văn cảnh diễn từ. Cấu trúc “cũng không được” làm rõ tính song hành của hai điều Môi-se không thể thực hiện.
  terminology: “Đức Giê-hô-va,” “Đức Chúa Trời,” “sông Giô-đanh,” và “cơ nghiệp” nhất quán với register Kinh Thánh tiếng Việt. “Miền đất tốt đẹp” truyền đạt đầy đủ הָאָרֶץ הַטּוֹבָה mà không diễn giải hẹp.
