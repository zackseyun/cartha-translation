  text: וַֽ/יהוָ֥ה הִתְאַנֶּף בִּ֖/י עַל דִּבְרֵי/כֶ֑ם וַ/יִּשָּׁבַ֗ע לְ/בִלְתִּ֤י עָבְרִ/י֙ אֶת הַ/יַּרְדֵּ֔ן וּ/לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: vi
  text: Đức Giê-hô-va nổi giận với tôi vì những lời của anh em[a], và Ngài thề rằng tôi sẽ không được vượt qua sông Giô-đanh, cũng không được vào miền đất tốt đẹp mà Đức Giê-hô-va, Đức Chúa Trời của anh em, đang ban cho anh em làm cơ nghiệp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vì anh em” hoặc “vì chuyện của anh em.” Tiếng Hê-bơ-rơ theo nghĩa sát chữ là “vì những lời của anh em.”'
    reason: Giữ sự đa nghĩa của דִּבְרֵיכֶם giữa ‘lời nói’, ‘sự việc’ và cách diễn đạt theo ngữ cảnh là ‘vì anh em’.
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu chung.
- source_word: הִתְאַנֶּף בִּי
  choice: nổi giận với tôi
  rationale: Diễn đạt tự nhiên động từ chỉ cơn giận cùng giới từ chỉ đối tượng của cơn giận, không tăng mức độ thành ‘thịnh nộ’.
- source_word: עַל דִּבְרֵיכֶם
  choice: vì những lời của anh em
  rationale: Giữ thành tố דִּבְרֵי (‘lời, sự việc’) hiện diện trong nguyên văn; chú thích ghi nhận cách hiểu rộng hơn theo ngữ cảnh.
- source_word: וַיִּשָּׁבַע
  choice: Ngài thề
  rationale: Cách diễn đạt ngắn gọn, trực tiếp cho hành động lập lời thề.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: tôi sẽ không được vượt qua sông Giô-đanh
  rationale: 'Thể hiện nội dung và hiệu lực của lời thề: Môi-se bị ngăn không cho vượt sông.'
- source_word: וּלְבִלְתִּי בֹא
  choice: cũng không được vào
  rationale: Giữ cấu trúc song song với mệnh đề trước và diễn đạt tự nhiên ý không được phép tiến vào đất.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: miền đất tốt đẹp
  rationale: Truyền đạt trực tiếp phẩm chất טוֹבָה mà không thu hẹp thành màu mỡ hay dễ chịu.
- source_word: נֹתֵן לְךָ
  choice: đang ban cho anh em
  rationale: Giữ sắc thái tiến hành hoặc sắp được thực hiện của phân từ נֹתֵן; đại từ số ít Hê-bơ-rơ chỉ tập thể Y-sơ-ra-ên được diễn đạt tự nhiên bằng ‘anh em’.
- source_word: נַחֲלָה
  choice: làm cơ nghiệp
  rationale: ‘Cơ nghiệp’ diễn đạt phần đất được ban và sở hữu lâu dài trong bối cảnh giao ước.
theological_decisions:
- issue: Mối liên hệ giữa việc Môi-se bị cấm vào đất và lời nói hay hành vi của dân Y-sơ-ra-ên
  choice: vì những lời của anh em
  alternative: vì anh em; vì chuyện của anh em
  rationale: Nguyên văn nêu rõ דִּבְרֵיכֶם, theo nghĩa đen là ‘những lời của anh em’, nhưng danh từ này cũng có thể chỉ sự việc hay vấn đề. Bản dịch chính giữ hình thức cụ thể của nguyên văn và chú thích bảo tồn cách hiểu rộng hơn, không giải quyết thay cho người đọc vấn đề quy trách nhiệm.
- issue: Tính chủ động trong việc Môi-se không được vượt sông và vào đất
  choice: sẽ không được vượt qua… cũng không được vào
  alternative: sẽ không vượt qua… cũng sẽ không vào
  rationale: Cách dịch được chọn làm rõ rằng lời thề của Đức Giê-hô-va đặt ra sự ngăn cấm, nhưng không thêm lời giải thích thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘anh em’ cho đại từ số ít mang nghĩa tập thể chỉ dân Y-sơ-ra-ên; dùng ‘Ngài’ để tránh lặp danh xưng trong cùng câu. Cấu trúc song song của hai điều bị cấm được giữ rõ ràng.
