id: DEU.4.25
reference: Deuteronomy 4:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: vi
  text: Khi anh em sinh con cái và có cháu[a], đã ở lâu trên đất ấy[b], rồi hành động bại hoại, làm một tượng chạm khắc theo hình dạng của bất cứ vật gì[c], và làm điều ác trước mắt Yahweh, Đức Chúa Trời của anh em, khiến Ngài nổi giận—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “con trai và con trai của các con trai”; cụm từ này chỉ con cháu qua các thế hệ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã già đi trên đất ấy” hoặc “đã định cư lâu ngày trên đất ấy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “theo hình tượng của bất cứ vật gì” hoặc “bất cứ hình thể nào.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong lời cảnh báo hướng đến tương lai, từ này mở đầu mệnh đề thời gian/điều kiện dẫn sang hệ quả ở câu kế tiếp; “Khi” giữ được dòng ý tự nhiên.
- source_word: תוֹלִיד
  choice: sinh
  rationale: Dạng Hiphil của ילד có nghĩa gây sinh ra/sinh con. Trong tiếng Việt, “sinh con cái” tự nhiên và không buộc phải diễn đạt chủ thể nam như động từ “father” trong tiếng Anh.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: con cái và có cháu chắt
  rationale: Các danh từ giống đực chỉ những thế hệ hậu duệ; cách diễn đạt này truyền đạt tự nhiên phạm vi qua nhiều thế hệ, đồng thời chú thích nghĩa sát chữ.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: đã sống lâu năm trên đất ấy
  rationale: Động từ có thể chỉ trở nên già hoặc ở lâu, định cư lâu. “Sống lâu năm” rõ nghĩa trong tiếng Việt mà vẫn giữ chú thích về sắc thái “già đi”.
- source_word: וְהִשְׁחַתֶּם
  choice: làm điều bại hoại
  rationale: Diễn tả hành vi trở nên hư hỏng, bại hoại trong bối cảnh vi phạm giao ước; không thêm ý phản thân vốn không được nói rõ.
- source_word: פֶּסֶל
  choice: tạc tượng
  rationale: Danh từ chỉ tượng được tạo ra bằng cách chạm khắc; kết cấu động từ “tạc tượng” tự nhiên, cụ thể và ít diễn giải hơn “làm thần tượng”.
- source_word: תְּמוּנַת כֹּל
  choice: mang hình dạng của bất cứ vật gì
  rationale: Giữ ý tượng mô phỏng bất kỳ hình dạng nào và phạm vi bao quát của כֹּל.
- source_word: הָרַע בְּעֵינֵי
  choice: điều ác dưới mắt
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về sự đánh giá, đồng thời vẫn dễ hiểu trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước thay vì thay bằng một tước hiệu.
- source_word: לְהַכְעִיסוֹ
  choice: khiến Ngài nổi giận
  rationale: Giữ sắc thái gây khiến của động từ và mối liên hệ mục đích/kết quả với hành động làm điều ác.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Phạm vi giới tính của בָּנִים וּבְנֵי בָנִים
  choice: con cái và cháu chắt
  alternative: con trai và cháu trai
  rationale: Hình thái Hê-bơ-rơ là giống đực, nhưng trong lời cảnh báo giao ước này cụm từ chỉ các thế hệ hậu duệ nói chung; chú thích bảo tồn cách hiểu sát chữ.
- issue: Quan hệ cú pháp của chuỗi mệnh đề
  choice: Giữ câu mở và dấu gạch ngang để dẫn sang hệ quả ở câu 26
  alternative: Kết thúc thành một câu độc lập
  rationale: Câu 25 là phần điều kiện/thời gian, còn lời tuyên bố hệ quả tiếp tục ở câu sau; dấu gạch ngang giữ cấu trúc và sức căng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho ngôi thứ hai tập thể của dân Israel, dù động từ đầu câu ở số ít rồi chuyển sang số nhiều như trong nguyên văn. Giữ “đất ấy” thay vì tự xác định là “xứ” để không thu hẹp sắc thái אֶרֶץ. Dấu gạch ngang cuối câu cho thấy cú pháp còn tiếp tục sang Phục Truyền Luật Lệ Ký 4:26.
