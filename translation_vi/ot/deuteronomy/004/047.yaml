base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: vi
  text: Họ chiếm lấy đất của vua ấy và đất của Óc, vua Ba-san—hai vua A-mô-rít ở bên kia sông Giô-đanh[a], về phía mặt trời mọc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phía bên kia sông Giô-đanh.” Đây là một thành ngữ địa lý Hê-bơ-rơ; cách hiểu chính xác tùy thuộc vào điểm nhìn trong lời kể.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là về phía đông.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: họ chiếm lấy
  rationale: Trong bối cảnh chinh phục lãnh thổ, ירשׁ chỉ việc chiếm và nắm quyền sở hữu; “chiếm lấy” tự nhiên trong tiếng Việt và giữ được sắc thái chinh phục.
- source_word: אַרְצוֹ
  choice: đất của vua ấy
  rationale: Hậu tố ngôi ba số ít giống đực quy chiếu về vua Si-hôn trong văn cảnh trước; cách diễn đạt này làm rõ quy chiếu mà không phải lặp tên ngoài câu nguồn.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: đất của Óc, vua Ba-san
  rationale: Giữ cấu trúc sở hữu của tiếng Hê-bơ-rơ và dùng “đất” nhất quán với vế trước.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: hai vua A-mô-rít
  rationale: Cách diễn đạt gọn, tự nhiên, đồng thời xác định Si-hôn và Óc là hai vua thuộc dân A-mô-rít.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ở bên kia sông Giô-đanh
  rationale: Giữ thành ngữ địa lý và không tự ý cố định điểm nhìn của người kể; chú thích nêu rõ khả năng diễn đạt theo góc nhìn.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: về phía mặt trời mọc
  rationale: Giữ hình ảnh cụ thể của nguyên văn, đồng thời người đọc hiện đại dễ hiểu là hướng đông.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên riêng theo lối phiên âm tiếng Việt quen thuộc; giữ hình ảnh “mặt trời mọc” của nguyên văn và bảo lưu tính tương đối về điểm nhìn trong cụm “bên kia sông Giô-đanh” qua chú thích.
