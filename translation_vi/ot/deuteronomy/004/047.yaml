  verdict: revise
  source_fidelity: 'Cần sửa một lỗi cú pháp-ngữ nghĩa: cụm “hai vua A-mô-rít” trong tiếng Hê-bơ-rơ là phần đồng vị chỉ Si-hôn và Óc, không phải là chủ sở hữu của mảnh đất được nêu ngay trước đó. Bản sửa giữ nguyên tính tương đối về điểm nhìn của cụm “bên kia sông Giô-đanh” và giữ hình ảnh “phía mặt trời mọc.”'
  naturalness: 'Bản sửa dùng câu hiện đại, trang trọng và rõ quan hệ đồng vị: Si-hôn (được nhắc ở câu trước qua “vua ấy”) và Óc là hai vua A-mô-rít.'
  terminology: 'Giữ các tên quen dùng trong tiếng Việt Kinh Thánh: Óc, Ba-san, A-mô-rít, Giô-đanh. “Chiếm lấy” phù hợp với ירשׁ trong ngữ cảnh chiếm hữu lãnh thổ.'
