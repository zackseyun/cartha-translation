revisions:
- from: Họ chiếm lấy đất của vua ấy và đất của Óc, vua Ba-san—đó là đất của hai vua A-mô-rít ở bên kia sông Giô-đanh[a], về phía mặt trời mọc[b].
  to: Họ chiếm lấy đất của vua ấy và đất của Óc, vua Ba-san—hai vua A-mô-rít ở bên kia sông Giô-đanh[a], về phía mặt trời mọc[b].
  rationale: 'Loại bỏ “đó là đất của” để khôi phục cấu trúc đồng vị của nguyên văn: Si-hôn và Óc là “hai vua A-mô-rít.” Các chú thích được giữ tại đúng các cụm từ mà chúng giải thích.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:26:52Z'
