base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: vi
  text: Hay đã từng có thần nào dám đến để lấy cho mình một dân tộc từ giữa một dân tộc khác, bằng những thử thách, dấu lạ và phép lạ, bằng chiến tranh, bằng bàn tay mạnh mẽ, cánh tay giơ ra, và những việc lớn lao đáng kinh sợ[a], giống như mọi điều Yahweh, Đức Chúa Trời của anh em, đã làm cho anh em tại Ai Cập trước mắt anh em chăng?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những nỗi kinh hoàng lớn lao” hoặc “những việc lớn lao gây kính sợ.” Cụm từ Hê-bơ-rơ chỉ những việc khiến người ta vừa sợ hãi vừa kinh ngạc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: đã từng ... dám
  rationale: Động từ נסה ở đây mang nghĩa thử làm hoặc dám thực hiện. Trong câu hỏi tu từ, “đã từng... dám” diễn đạt việc chưa từng có mà không gợi ý vị thần ấy có thể thất bại.
- source_word: אֱלֹהִים
  choice: thần nào
  rationale: Danh từ được dùng theo nghĩa chung trong phép so sánh tu từ với công việc của YHWH; “thần nào” giữ sắc thái bất định và tính luận chiến.
- source_word: לָבוֹא לָקַחַת
  choice: đến chọn lấy
  rationale: Chuỗi nguyên mẫu diễn tả chuyển động có mục đích rồi lấy một dân làm của mình. “Đến chọn lấy” tự nhiên trong tiếng Việt và phù hợp với đối tượng gián tiếp לֹו, “cho mình”.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: một dân tộc từ giữa một dân tộc khác
  rationale: Giữ hình ảnh nổi bật về việc đưa một dân ra khỏi lòng một dân khác, đồng thời làm rõ sự phân biệt trong tiếng Việt.
- source_word: בְּמַסֹּת
  choice: bằng những thử thách
  rationale: Chỉ các biến cố thử luyện hoặc xét đoán gắn với cuộc xuất hành; “thử thách” đủ rộng và không gây liên tưởng sai đến cám dỗ.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: dấu lạ, phép mầu
  rationale: 'Phân biệt hai thành tố của cụm Hê-bơ-rơ: אותות là các dấu hiệu, còn מופתים là những việc phi thường gây kinh ngạc.'
- source_word: וּבְמִלְחָמָה
  choice: chiến tranh
  rationale: Giữ danh từ số ít và phương diện giao chiến trong việc giải cứu khỏi Ai Cập.
- source_word: וּבְיָד חֲזָקָה
  choice: bàn tay quyền năng
  rationale: Diễn đạt thành ngữ Xuất Hành chỉ quyền lực mạnh mẽ của Đức Chúa Trời bằng tiếng Việt tự nhiên, trang trọng.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: cánh tay giơ thẳng
  rationale: Giữ hình ảnh cụ thể của cánh tay được vươn ra để hành động, thay vì làm mờ thành một khái niệm trừu tượng.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: những việc lớn lao đáng kinh sợ
  rationale: Danh từ chỉ những điều hoặc hành động gây sợ hãi và kính phục. Cách dịch này tránh để “nỗi kinh hoàng” bị hiểu chỉ là cảm xúc.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: như mọi điều ... đã làm
  rationale: Giữ cả ý so sánh và tính bao quát của כֹל bằng cấu trúc tiếng Việt gọn, tự nhiên.
- source_word: לְעֵינֶיךָ
  choice: ngay trước mắt anh em
  rationale: Thành ngữ chỉ điều chính người nghe đã tận mắt chứng kiến; “ngay” làm rõ tính trực tiếp mà không thêm nội dung mới.
theological_decisions:
- issue: Đối tượng אֱלֹהִים trong câu hỏi tu từ
  choice: thần nào
  alternative: Đức Chúa Trời
  rationale: Ngữ cảnh so sánh công việc độc nhất của YHWH với mọi thần khác; cách viết thường và từ nghi vấn giữ lực luận chiến mà không đồng nhất chủ thể đầu câu với Đức Chúa Trời chân thật.
- issue: Cách thể hiện danh riêng יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh
  rationale: “Giê-hô-va” là dạng danh xưng riêng quen thuộc, dễ nhận biết trong tiếng Việt hiện đại; nó không thay danh riêng bằng tước hiệu “CHÚA” và vẫn phân biệt YHWH với אֱלֹהִים.
- issue: Số của các đại từ ngôi thứ hai
  choice: anh em
  alternative: ngươi
  rationale: Hình thái Hê-bơ-rơ chuyển từ số nhiều לָכֶם sang số ít tập thể לְעֵינֶיךָ. “Anh em” giữ lời nói hướng đến cộng đồng Israel và tránh sự đổi số gượng gạo trong tiếng Việt, dù sắc thái tập thể của số ít cuối câu không thể hiện đầy đủ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ cấu trúc câu hỏi tu từ cùng chuỗi phương tiện được nhấn mạnh trong nguyên văn. Dùng “anh em” để nói với cộng đồng giao ước, tránh đại từ cổ “các ngươi”.
