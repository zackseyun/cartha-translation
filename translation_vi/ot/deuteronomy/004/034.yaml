revisions:
- from: Hay đã từng có thần nào dám đến chọn lấy cho mình một dân tộc từ giữa một dân tộc khác, bằng những thử thách, dấu lạ, phép mầu, chiến tranh, bàn tay quyền năng, cánh tay giơ thẳng và những việc lớn lao đáng kinh sợ[a], như mọi điều Giê-hô-va, Đức Chúa Trời của anh em, đã làm cho anh em tại Ai Cập ngay trước mắt anh em không?
  to: Hay đã từng có thần nào dám đến để lấy cho mình một dân tộc từ giữa một dân tộc khác, bằng những thử thách, dấu lạ và phép lạ, bằng chiến tranh, bằng bàn tay mạnh mẽ, cánh tay giơ ra, và những việc lớn lao đáng kinh sợ[a], giống như mọi điều Yahweh, Đức Chúa Trời của anh em, đã làm cho anh em tại Ai Cập trước mắt anh em chăng?
  rationale: Sửa các chỗ cần thiết để phản ánh chính xác hơn động từ “lấy”, thành ngữ “cánh tay giơ ra”, và danh riêng Yahweh; đồng thời giữ nguyên tính tu từ, trật tự liệt kê, và tính bao quát của câu gốc. Chú thích được giữ ở cụm מוֹרָאִים גְּדֹלִים vì phạm vi nghĩa giữa các hành vi đáng sợ/kính sợ và các nỗi kinh hoàng vẫn cần được bảo lưu.
