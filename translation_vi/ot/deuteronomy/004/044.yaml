base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: vi
  text: Đây là luật pháp mà Môi-se đã đặt trước mặt con cái Y-sơ-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Y-sơ-ra-ên”, “người Y-sơ-ra-ên”, hoặc sát chữ hơn là “các con trai Y-sơ-ra-ên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Đây là
  rationale: Cụm liên từ và đại từ chỉ thị mở đầu một phần mới. Tiếng Việt tự nhiên không cần dịch riêng וְ là “và” trong tiêu đề chuyển đoạn này; “Đây là” vẫn giữ rõ sắc thái giới thiệu.
- source_word: הַתּוֹרָה
  choice: luật pháp
  rationale: תּוֹרָה có thể chỉ sự dạy dỗ hoặc chỉ dẫn, nhưng tại đây là luật lệ giao ước do Môi-se công bố. “Luật pháp” là cách diễn đạt quen thuộc, trang trọng và phù hợp ngữ cảnh.
- source_word: אֲשֶׁר
  choice: mà
  rationale: “Mà” nối mệnh đề quan hệ một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: שָׂם ... לִפְנֵי
  choice: đã đặt trước mặt
  rationale: שׂוּם mang nghĩa đặt, để hoặc thiết lập; kết hợp với לִפְנֵי, cụm “đặt trước mặt” giữ được hình ảnh nguồn và diễn tả việc công bố luật cho dân.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai/con cái của Y-sơ-ra-ên” nhưng được dùng như danh xưng tập thể của dân tộc. “Con cái Y-sơ-ra-ên” bảo tồn hình thức nguồn và vẫn dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Danh xưng dân giao ước בְּנֵי יִשְׂרָאֵל có hình thức giống đực nhưng chức năng tập thể
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên; các con trai Y-sơ-ra-ên
  rationale: Bản dịch giữ quan hệ dòng dõi trong thành ngữ Hê-bơ-rơ mà không thu hẹp đối tượng chỉ còn nam giới, vì trong ngữ cảnh đây là danh xưng của toàn dân. Chú thích nêu các cách dịch khả dĩ khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Luật pháp”, “đặt trước mặt” và các dạng tên Môi-se, Y-sơ-ra-ên duy trì sắc thái Kinh Thánh quen thuộc; dấu chú thích [a] xuất hiện ngay sau câu.
