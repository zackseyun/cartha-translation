source:
  edition: WLC
  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: vi
  text: Chỉ hãy thận trọng giữ mình, và hết sức giữ gìn bản thân, kẻo anh em quên những điều mắt anh em đã thấy, và kẻo chúng lìa khỏi lòng anh em suốt những ngày đời anh em. Hãy cho con cái và các cháu[a] của anh em biết những điều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “các con trai của anh em và các con trai của con trai anh em.” Trong ngữ cảnh này, các từ giống đực số nhiều trong tiếng Hê-bơ-rơ có thể chỉ con cái hoặc hậu duệ nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Chỉ hãy
  rationale: Giữ sức nhấn mạnh và giới hạn của רַק trong lời cảnh báo, đồng thời phù hợp với câu mệnh lệnh tiếng Việt.
- source_word: הִשָּׁמֶר לְךָ וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: hãy hết sức giữ mình và cẩn thận gìn giữ chính mình
  rationale: Hai mệnh lệnh cùng gốc שׁמר tạo sự lặp lại có chủ ý và tăng cường mức cảnh giác. נֶפֶשׁ ở đây chỉ toàn thể bản thân, không nhất thiết là một phần phi vật chất riêng biệt.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: những điều mắt mình đã thấy
  rationale: דְּבָרִים mang nghĩa những điều hoặc sự việc; mệnh đề nói mắt đã thấy nhấn mạnh kinh nghiệm trực tiếp.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: và kẻo chúng lìa khỏi lòng anh em
  rationale: Giữ hình ảnh của động từ סור và danh từ לֵבָב, thay vì thu hẹp ý nghĩa thành chỉ trí nhớ hay tâm trí.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: suốt những ngày đời mình
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ toàn bộ quãng đời.
- source_word: וְהוֹדַעְתָּם
  choice: Hãy cho ... biết những điều ấy
  rationale: Phản ánh thể khiến của ידע, chính xác hơn việc mặc nhiên chuyển thành 'dạy dỗ'.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: con cái và cháu chắt của anh em
  rationale: Truyền đạt việc lưu truyền qua các thế hệ bằng tiếng Việt tự nhiên; footnote bảo lưu hình thức sát chữ của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Ý nghĩa nhân học của נֶפֶשׁ
  choice: chính mình
  alternative: linh hồn mình
  rationale: Trong ngữ cảnh này, נֶפֶשׁ chỉ con người/bản thân nói chung. 'Linh hồn' có thể đưa vào một sự phân chia thân thể–linh hồn hẹp hơn điều câu Hê-bơ-rơ khẳng định.
- issue: Phạm vi giới tính của בָנֶיךָ
  choice: con cái
  alternative: các con trai
  rationale: Danh từ giống đực số nhiều có thể chỉ con cháu nói chung trong bối cảnh truyền lại ký ức giao ước qua nhiều thế hệ; bản dịch không giới hạn mệnh lệnh vào con trai.
- issue: Hình ảnh 'lòng' trong לְבָבְךָ
  choice: giữ nguyên 'lòng'
  alternative: tâm trí hoặc ký ức
  rationale: Trong cách diễn đạt Hê-bơ-rơ, lòng bao gồm đời sống nội tâm, trí nhớ, sự hiểu biết và ý chí. Giữ hình ảnh này tránh thu hẹp nghĩa thần học và nhân học.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh em” để diễn đạt đại từ ngôi hai số ít mang tính tập thể, hướng đến toàn dân Israel; các đại từ phản thân “mình” duy trì cách xưng hô tự nhiên. Dấu phẩy cuối câu trong lớp tham khảo tiếng Anh không được giữ lại vì câu 9 có thể đứng trọn về cú pháp; mạch nối với câu kế tiếp vẫn được bảo toàn về ý.
