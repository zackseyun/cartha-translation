  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: vi
  text: Đây là những lời chứng, luật lệ và phán quyết mà Môi-se đã nói với dân Y-sơ-ra-ên khi họ ra khỏi Ai Cập.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ định số nhiều mở đầu các loại luật; tiếng Việt dùng tự nhiên cấu trúc “Đây là”.
- source_word: הָעֵדֹת
  choice: các chứng lệnh
  rationale: Giữ sắc thái về lời/chứng cứ có tính ràng buộc trong giao ước, đồng thời phân biệt với חֻקִּים và מִשְׁפָּטִים.
- source_word: הַחֻקִּים
  choice: luật lệ
  rationale: Cách diễn đạt thông dụng, trang trọng vừa phải cho những điều được ấn định.
- source_word: הַמִּשְׁפָּטִים
  choice: phán quyết
  rationale: Giữ sắc thái pháp lý và tư pháp của từ Hê-bơ-rơ, đồng thời phân biệt với “luật lệ”.
- source_word: אֲשֶׁר דִּבֶּר
  choice: mà Môi-se đã truyền
  rationale: Trong ngữ cảnh ban bố luật cho dân, “truyền” diễn đạt tự nhiên hành động nói có thẩm quyền mà không thêm ý niệm thần học riêng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Thành ngữ chỉ toàn thể cộng đồng Israel; dịch sát từng chữ là “các con trai của Israel” dễ bị hiểu là chỉ nam giới trong tiếng Việt hiện đại.
- source_word: בְּצֵאתָם
  choice: khi họ ra khỏi
  rationale: Cấu trúc giới từ với động từ nguyên mẫu mang ý nghĩa thời gian; “khi họ ra khỏi” rõ ràng và tự nhiên.
- source_word: מִמִּצְרָיִם
  choice: Ai Cập
  rationale: Tên địa danh tiêu chuẩn; kết hợp với “ra khỏi” để thể hiện giới từ chỉ xuất phát điểm.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Ba thuật ngữ pháp lý được tách biệt thành “chứng lệnh, luật lệ và phán quyết”; dùng “dân Y-sơ-ra-ên” theo nghĩa tập thể, không giới hạn giới tính.
