  terminology: “Đức Giê-hô-va” giữ danh riêng יהוה bằng dạng phiên âm quen thuộc trong tiếng Việt. Cặp “các luật lệ và phán quyết” duy trì sự phân biệt tương đối giữa חֻקִּים và מִשְׁפָּטִים mà không thêm diễn giải giáo phái. Các chú thích được neo đúng vào cụm từ liên hệ.
