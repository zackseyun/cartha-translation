id: DEU.4.14
reference: Deuteronomy 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: vi
  text: Vào lúc ấy, Đức Giê-hô-va truyền cho tôi dạy anh em các luật lệ và phán quyết[a], để anh em thi hành chúng trong xứ mà anh em sắp vượt qua để chiếm hữu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các quy định và luật lệ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để nhận xứ ấy làm cơ nghiệp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתִי
  choice: truyền cho tôi
  rationale: Đại từ tân ngữ được đưa lên trước trong tiếng Hê-bơ-rơ để tạo sự nhấn nhẹ; tiếng Việt diễn đạt tự nhiên bằng cách đặt cụm này sau chủ ngữ và động từ.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: צִוָּה
  choice: truyền
  rationale: Diễn tả mệnh lệnh có thẩm quyền trong bối cảnh giao ước và luật pháp.
- source_word: לְלַמֵּד
  choice: dạy
  rationale: Phản ánh trực tiếp nhiệm vụ của Môi-se là truyền đạt nội dung cho dân Y-sơ-ra-ên, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: các luật lệ và phán quyết
  rationale: 'Giữ sự phân biệt giữa hai thuật ngữ pháp lý Hê-bơ-rơ: những điều được quy định và những quyết định hoặc quy tắc pháp lý.'
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: để anh em thi hành chúng
  rationale: Giữ quan hệ mục đích của cấu trúc nguyên ngữ; “thi hành” diễn đạt tự nhiên việc làm theo các quy định pháp luật.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: “Xứ” phù hợp với bối cảnh địa lý-giao ước của Phục Truyền Luật Lệ Ký và có sắc thái Kinh Thánh trang trọng nhưng dễ hiểu.
- source_word: עֹבְרִים שָׁמָּה
  choice: sắp vượt qua
  rationale: Phân từ chỉ hành động sắp diễn ra khi dân vượt qua để vào xứ; ngữ cảnh cho thấy việc vượt qua sông Giô-đanh dù câu không nêu đích danh con sông.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: Động từ có thể mang nghĩa chiếm hữu hoặc nhận làm cơ nghiệp; lựa chọn này giữ trọng tâm vào việc tiến vào và sở hữu xứ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ danh riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng phiên âm quen thuộc trong tiếng Việt và phù hợp văn phong trang trọng.
- issue: Sắc thái của לְרִשְׁתָּהּ
  choice: để chiếm hữu
  alternative: để nhận làm cơ nghiệp
  rationale: Nguyên ngữ cho phép cả ý sở hữu và thừa hưởng. Bản chính không ép câu theo riêng mô-típ chinh phục hay ân ban; phương án còn lại được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để chỉ cộng đồng Y-sơ-ra-ên được Môi-se trực tiếp nói với; dùng “xứ” để giữ sắc thái địa lý-giao ước. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
