source:
  edition: WLC
  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: vi
  text: Ngài công bố cho anh em giao ước của Ngài, là điều Ngài truyền cho anh em phải thực hành, tức Mười Lời[a]; rồi Ngài viết những lời ấy trên hai bảng đá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “Mười Lời”; theo cách gọi truyền thống: “Mười Điều Răn.”'
    reason: Ghi lại cách gọi truyền thống quen thuộc trong khi bản chính giữ danh xưng sát nguyên văn.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: công bố
  rationale: Động từ נגד ở thể Hifil mang nghĩa làm cho biết hoặc tuyên bố. “Công bố” giữ được sắc thái trang trọng của bối cảnh giao ước mà vẫn tự nhiên trong tiếng Việt.
- source_word: בְּרִיתוֹ
  choice: giao ước của Ngài
  rationale: בְּרִית là thuật ngữ tiêu chuẩn chỉ một cam kết có tính ràng buộc và quan hệ. “Giao ước” là cách dịch chính xác, quen thuộc trong văn phong Kinh Thánh; “của Ngài” làm rõ hậu tố sở hữu và dùng đại từ tôn kính.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: là điều Ngài truyền cho anh em phải thực hành
  rationale: לַעֲשׂוֹת có nghĩa trực tiếp là “làm”. Trong tiếng Việt, “phải thực hành” diễn đạt tự nhiên mệnh lệnh phải đem giao ước vào hành động, không thu hẹp nghĩa thành chỉ “tuân giữ” theo nghi thức.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: Mười Lời
  rationale: Cụm Hê-bơ-rơ có nghĩa sát là “mười lời”, không phải dùng danh từ “điều răn”. Viết hoa “Mười Lời” cho thấy đây là danh xưng của toàn bộ mười lời giao ước, đồng thời giữ cách gọi của nguyên văn.
- source_word: וַיִּכְתְּבֵם
  choice: rồi Ngài viết những lời ấy
  rationale: כתב là động từ thông thường “viết”. “Những lời ấy” diễn đạt rõ đối tượng số nhiều của hậu tố -ם trong tiếng Việt và tránh đại từ “chúng” kém trang trọng.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: hai bảng đá
  rationale: Cụm cấu tạo này chỉ hai bảng làm bằng đá. “Hai bảng đá” ngắn gọn, tự nhiên và chính xác trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch עֲשֶׂרֶת הַדְּבָרִים
  choice: Mười Lời
  alternative: Mười Điều Răn
  rationale: Nguyên văn tự gọi các điều khoản giao ước là “Mười Lời”. Bản chính giữ danh xưng ấy thay vì thay bằng cách gọi truyền thống có tính diễn giải; cách gọi quen thuộc “Mười Điều Răn” được ghi ở chú thích.
- issue: Quan hệ giữa “giao ước” và “Mười Lời”
  choice: dùng “tức” để thể hiện quan hệ đồng vị
  alternative: hiểu “Mười Lời” chỉ là nội dung tách biệt với giao ước
  rationale: Cú pháp Hê-bơ-rơ đặt עֲשֶׂרֶת הַדְּבָרִים sau mệnh đề về điều Đức Chúa Trời truyền phải làm, theo lối đồng vị. “Tức” làm sáng rõ cấu trúc này mà không bổ sung một lập luận thần học ngoài câu.
translation_notes:
  register: 'Văn phong trang trọng, sáng rõ và hiện đại. Dùng “Ngài” cho chủ thể thần linh và “anh em” cho đại từ số nhiều לָכֶם/אֶתְכֶם, phù hợp lời Môi-se nói với cộng đồng Israel. Dấu chấm phẩy phản ánh hai hành động nối tiếp nhưng phân biệt: công bố giao ước và viết các lời trên bảng đá.'
