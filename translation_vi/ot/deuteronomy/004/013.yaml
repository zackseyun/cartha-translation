  terminology: “Giao ước” là tương đương chuẩn của בְּרִית. “Mười Lời” giữ sát danh xưng Hê-bơ-rơ, còn chú thích nêu “Mười Điều Răn” như cách gọi truyền thống mà không thay thế nguyên văn. “Bảng đá” truyền đạt đúng ý hai tấm/bảng làm bằng đá.
