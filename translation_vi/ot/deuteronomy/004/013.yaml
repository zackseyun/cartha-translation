  source_fidelity: 'Bản dịch phản ánh đúng các thành tố của nguyên văn: Đức Chúa Trời công bố giao ước của Ngài cho dân, truyền họ phải thực hành giao ước ấy—tức “Mười Lời”—và viết chúng trên hai bảng đá. “Tức” diễn đạt hợp lý quan hệ đồng vị của עֲשֶׂרֶת הַדְּבָרִים, không biến danh xưng này thành một diễn giải giáo lý.'
