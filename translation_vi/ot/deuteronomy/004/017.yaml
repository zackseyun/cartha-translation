  text: תַּבְנִ֕ית כָּל בְּהֵמָ֖ה אֲשֶׁ֣ר בָּ/אָ֑רֶץ תַּבְנִית֙ כָּל צִפּ֣וֹר כָּנָ֔ף אֲשֶׁ֥ר תָּע֖וּף בַּ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/017.yaml
  text: the form of any animal that is on the earth[a], the form of any winged bird that flies in the heavens[b],
translation:
  language: vi
  text: hình tượng[a] của bất cứ loài thú nào ở trên đất, hình tượng của bất cứ loài chim có cánh nào bay trên trời[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hình dạng”, “hình ảnh” hoặc “mẫu”; từ Hê-bơ-rơ תַּבְנִית ở đây nói đến một hình được làm ra để thờ phượng.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “trong các tầng trời”; dạng số nhiều trong tiếng Hê-bơ-rơ cũng có thể chỉ bầu trời nhìn thấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: hình tượng
  rationale: Trong ngữ cảnh cấm tạo ảnh để thờ phượng, từ này chỉ hình dạng được thể hiện thành một vật tượng trưng. “Hình tượng” tự nhiên và rõ hơn “hình dạng”, đồng thời vẫn giữ được ý về sự mô phỏng hữu hình.
- source_word: כָּל
  choice: bất cứ ... nào
  rationale: Khi đi với danh từ số ít trong danh sách cấm đoán này, cấu trúc “bất cứ ... nào” diễn đạt tự nhiên ý chỉ mọi thành viên thuộc loại được nêu.
- source_word: בְּהֵמָה
  choice: loài thú
  rationale: Ở đây từ này chỉ chung các động vật sống trên đất, không chỉ riêng gia súc; “loài thú” phù hợp với cách phân loại các sinh vật theo môi trường sống trong đoạn văn.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: ở trên đất
  rationale: Giữ sự tương phản không gian giữa các loài trên đất, chim trên trời và các sinh vật dưới nước trong những câu liền kề.
- source_word: צִפּוֹר כָּנָף
  choice: loài chim có cánh
  rationale: Diễn đạt đầy đủ danh từ “chim” và yếu tố mô tả “có cánh”, theo lối nói tự nhiên trong tiếng Việt.
- source_word: תָּעוּף
  choice: bay
  rationale: Động từ ở mệnh đề quan hệ mô tả đặc tính chung của loài chim; “bay” là cách diễn đạt ngắn gọn và tự nhiên.
- source_word: בַּשָּׁמַיִם
  choice: trên trời
  rationale: Trong ngữ cảnh chim bay, từ Hê-bơ-rơ số nhiều chỉ bầu trời nhìn thấy; “trên trời” là cách nói tự nhiên trong tiếng Việt hiện đại.
