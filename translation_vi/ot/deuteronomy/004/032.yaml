  naturalness: “Những ngày xa xưa đã có trước anh em” và “hãy hỏi từ đầu trời này đến đầu trời kia” hơi gượng trong tiếng Việt hiện đại. “Những thời xa xưa, trước thời anh em” và “hãy hỏi khắp từ đầu trời này đến đầu trời kia” tự nhiên hơn, vẫn giữ sắc thái trang trọng.
