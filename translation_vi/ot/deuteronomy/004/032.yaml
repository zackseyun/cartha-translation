revisions:
- from: 'Vậy, hãy hỏi về những ngày xa xưa đã có trước anh em, kể từ ngày Đức Chúa Trời dựng nên loài người[a] trên đất; hãy hỏi từ đầu trời này đến đầu trời kia: Đã từng xảy ra việc trọng đại nào như việc này, hay đã từng nghe nói đến việc nào giống như vậy chưa?'
  to: 'Vậy, hãy hỏi về những thời xa xưa, trước thời anh em, kể từ ngày Đức Chúa Trời dựng nên loài người[a] trên đất; hãy hỏi khắp từ đầu trời này đến đầu trời kia: Đã từng xảy ra việc trọng đại nào như việc này, hay đã từng nghe nói đến việc nào giống như vậy chưa?'
  rationale: Bản sửa chỉ làm mượt cú pháp tiếng Việt và làm rõ phạm vi tu từ của lời “hãy hỏi”, không thay đổi ý nghĩa, mức độ nhấn mạnh, hay tính mơ hồ hợp lý của אָדָם trong nguyên ngữ.
