source:
  edition: WLC
  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: vi
  text: 'Vậy, hãy hỏi về những thời xa xưa, trước thời anh em, kể từ ngày Đức Chúa Trời dựng nên loài người[a] trên đất; hãy hỏi khắp từ đầu trời này đến đầu trời kia: Đã từng xảy ra việc trọng đại nào như việc này, hay đã từng nghe nói đến việc nào giống như vậy chưa?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “con người”; từ Hê-bơ-rơ אָדָם trong ngữ cảnh sáng tạo có thể chỉ loài người nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: hãy hỏi
  rationale: Mệnh lệnh kèm נָא mang sức thúc giục; “hãy hỏi” tự nhiên, trang trọng và giữ được lời kêu gọi khảo xét.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: về những ngày xa xưa
  rationale: Chỉ thời cổ xưa; cách diễn đạt này rõ nghĩa và có sắc thái trang trọng vừa phải.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: đã có trước anh em
  rationale: Giữ nghĩa thời gian của những gì có trước thế hệ người nghe. “Anh em” phù hợp với lời Môi-se nói cùng toàn dân.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: kể từ ngày ... dựng nên
  rationale: Diễn đạt rõ điểm khởi đầu của toàn khoảng lịch sử được yêu cầu khảo xét.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi tiêu chuẩn, trang trọng trong tiếng Việt đối với Đấng Tạo Hóa duy nhất trong ngữ cảnh này.
- source_word: אָדָם
  choice: loài người
  rationale: Trong ngữ cảnh sáng tạo, danh từ số ít אָדָם có thể đại diện cho toàn thể nhân loại; “loài người” chuyển tải nghĩa tập thể tự nhiên hơn trong tiếng Việt mà không buộc người đọc hiểu là tên riêng A-đam.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Cách chuyển ngữ trực tiếp, tự nhiên cho ý nghĩa vị trí.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: từ đầu trời này đến đầu trời kia
  rationale: Giữ hình ảnh hai đầu của bầu trời và truyền đạt lối nói bao quát toàn cõi; lặp “hãy hỏi” trong tiếng Việt làm rõ phạm vi của mệnh lệnh.
- source_word: הֲנִהְיָה
  choice: đã từng xảy ra
  rationale: Câu hỏi tu từ hỏi liệu một sự kiện như thế đã bao giờ xảy đến; “đã từng” thể hiện chiều kích lịch sử.
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: việc trọng đại nào như việc này
  rationale: דבר ở đây là sự việc hay biến cố; “việc trọng đại” tự nhiên hơn “điều lớn” và vẫn giữ sức nhấn mạnh.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: hay đã từng nghe nói đến việc nào giống như vậy chưa?
  rationale: Thể bị động của שׁמע mang nghĩa một việc được nghe biết hoặc được thuật lại; cách dịch này giữ nguyên sức mạnh của câu hỏi tu từ.
theological_decisions:
- issue: Ý nghĩa của אָדָם trong ngữ cảnh sáng tạo
  choice: loài người
  alternative: con người; A-đam
  rationale: Câu này nhìn lại lịch sử từ lúc nhân loại được tạo dựng. אָדָם ở số ít nhưng có thể mang nghĩa đại diện hoặc tập thể. Bản dịch chính dùng “loài người” để diễn đạt nghĩa ấy tự nhiên trong tiếng Việt; chú thích giữ lại khả năng dịch sát hình thức số ít là “con người”, trong khi không chọn tên riêng “A-đam” vì trọng tâm là khởi điểm lịch sử nhân loại.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” ở số nhiều để phản ánh cộng đồng giao ước đang được Môi-se ngỏ lời; giữ hình ảnh “đầu trời này đến đầu trời kia” thay vì giải thích thành một khái niệm trừu tượng.
