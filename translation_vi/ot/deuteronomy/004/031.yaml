  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: vi
  text: Vì Yahweh, Đức Chúa Trời của anh em, là Đức Chúa Trời giàu lòng thương xót[a]. Ngài sẽ không bỏ mặc anh em[b], không hủy diệt anh em, cũng không quên giao ước của các tổ phụ của anh em[c] mà Ngài đã thề với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời đầy lòng trắc ẩn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không bỏ rơi anh em” hoặc “không buông anh em ra.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “giao ước của tổ tiên anh em.” Tiếng Hê-bơ-rơ nói “các cha của anh em,” chỉ các tổ phụ của Israel trong giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng nêu lý do cho lời khuyên và cảnh báo ở phần trước.
- source_word: אֵל רַחוּם
  choice: Đức Chúa Trời giàu lòng thương xót
  rationale: רַחוּם diễn tả lòng thương xót và trắc ẩn; cách nói này tự nhiên, trang trọng và làm rõ đây là phẩm tính của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó giữ nét riêng của danh giao ước trong nguyên văn.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ giao ước trong đại từ sở hữu ngôi thứ hai; “anh em” diễn đạt tự nhiên việc Môi-se nói với Israel như một cộng đồng.
- source_word: לֹא יַרְפְּךָ
  choice: sẽ không bỏ mặc anh em
  rationale: Dạng Hiphil của רפה tại đây mang ý không buông bỏ hay không bỏ rơi; “bỏ mặc” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: không hủy diệt anh em
  rationale: שׁחת ở dạng Hiphil thường có nghĩa là hủy diệt hoặc làm cho tiêu vong; “hủy diệt” phù hợp với bối cảnh cảnh báo giao ước.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: cũng không quên giao ước
  rationale: Giữ nguyên hình ảnh thần học quan trọng của động từ “quên”, không làm nhẹ thành “xao lãng” hay “bỏ qua”.
- source_word: אֲבֹתֶיךָ
  choice: các tổ phụ của anh em
  rationale: “Tổ phụ” vừa giữ sắc thái giống đực của nguyên văn, vừa chỉ rõ các bậc cha ông gắn với lịch sử giao ước của Israel.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: mà Ngài đã thề với họ
  rationale: Giữ ngôn ngữ tuyên thệ trang trọng của נשבע và đối tượng tiếp nhận lời thề.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu. “Đức Giê-hô-va” là một dạng truyền thống khác trong tiếng Việt.
- issue: Phạm vi của đại từ ngôi thứ hai số ít
  choice: anh em
  alternative: ngươi; bạn
  rationale: Tiếng Hê-bơ-rơ dùng số ít để nói với Israel như một cộng đồng. “Anh em” tự nhiên và có tính cộng đồng trong tiếng Việt hiện đại, dù hình thức ngữ pháp là số nhiều; “ngươi” sát số ít hơn nhưng dễ tạo sắc thái cổ hoặc khinh miệt.
- issue: Đối tượng được gọi là אֲבֹתֶיךָ
  choice: các tổ phụ của anh em
  alternative: tổ tiên của anh em
  rationale: “Các tổ phụ” giữ tính nam và nét đặc thù lịch sử giao ước; “tổ tiên” rộng và trung tính hơn, nên được ghi nhận như một cách dịch khả dĩ.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Đức Chúa Trời và “anh em” cho Israel được Môi-se trực tiếp nói với như một cộng đồng. Cấu trúc ba lần phủ định được giữ để bảo tồn nhịp điệu và sức nhấn của nguyên văn.
