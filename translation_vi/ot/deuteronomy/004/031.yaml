  terminology: “Đức Chúa Trời giàu lòng thương xót,” “hủy diệt,” “các tổ phụ,” và “đã thề” phù hợp. Cần đổi “giao ước với” thành “giao ước của” để phản ánh chính xác cấu trúc nguyên ngữ; chú thích phương án “tổ tiên” cũng cần giữ quan hệ này.
