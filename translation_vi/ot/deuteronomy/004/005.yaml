source:
  edition: WLC
  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: vi
  text: 'Hãy xem: tôi đã dạy anh em các luật lệ và phán quyết[a], đúng như Yahweh, Đức Chúa Trời của tôi, đã truyền cho tôi, để anh em thực hành như vậy ngay trong xứ mà anh em đang tiến vào để chiếm hữu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các quy định và điều luật”.
    reason: lexical_alternative
  - marker: b
    text: “Chiếm hữu” cũng có thể được hiểu là “nhận làm cơ nghiệp”.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: רְאֵה
  choice: Anh em hãy xem
  rationale: Mệnh lệnh số ít có chức năng thu hút sự chú ý của toàn dân. Cách dịch này giữ sắc thái trực tiếp mà vẫn tự nhiên trong tiếng Việt; đại từ tập thể “anh em” phù hợp với đối tượng được Môi-se nói với.
- source_word: לִמַּדְתִּי
  choice: tôi đã dạy
  rationale: Thể hoàn thành ngôi thứ nhất số ít diễn tả việc Môi-se đã truyền dạy, với hiệu lực còn liên quan trực tiếp đến lời khuyên hiện tại.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: các luật lệ và phán quyết
  rationale: 'Giữ hai thuật ngữ pháp lý riêng biệt: חֻקִּים là những quy định được thiết lập, còn מִשְׁפָּטִים có sắc thái phán quyết hoặc quy phạm tư pháp.'
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn đạt sự tương ứng chính xác giữa điều Môi-se dạy và mệnh lệnh của Đức Chúa Trời.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, Đức Chúa Trời của tôi
  rationale: Giữ nguyên danh giao ước יהוה dưới dạng “Yahweh” và diễn đạt hậu tố sở hữu của אֱלֹהָי rõ ràng, tự nhiên trong tiếng Việt.
- source_word: לַעֲשׂוֹת כֵּן
  choice: để anh em làm theo
  rationale: Động từ nguyên mẫu với כֵּן nêu mục đích thực hành điều vừa được dạy. “Làm theo” tự nhiên hơn lối dịch sát chữ “làm như vậy” mà vẫn giữ quan hệ quy chiếu.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: tại xứ
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “giữa/trong lòng xứ”, nhưng trong ngữ cảnh này chỉ việc thực hành các luật lệ ở trong xứ; “tại xứ” truyền đạt tự nhiên mà không thêm ý.
- source_word: בָּאִים שָׁמָּה
  choice: đang tiến vào
  rationale: Phân từ diễn tả hành động sắp xảy ra hoặc đang hướng tới; động từ “tiến vào” đã hàm ý hướng đến nơi ấy, nên không cần thêm “đó” một cách gượng gạo.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: ירשׁ trong ngữ cảnh đất hứa có thể chỉ việc nhận, chiếm lấy hoặc sở hữu xứ. “Chiếm hữu” giữ được nghĩa rộng và sắc thái chủ động của câu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” phân biệt danh riêng này với tước hiệu אֲדֹנָי và không áp đặt một truyền thống giáo phái riêng.
- issue: Sắc thái của ירשׁ trong lời hứa về đất
  choice: chiếm hữu
  alternative: thừa hưởng
  rationale: Động từ có thể mang sắc thái chiếm lấy, sở hữu hoặc thừa hưởng. Trong câu này, “chiếm hữu” phù hợp với việc dân tiến vào xứ, còn khả năng dịch “thừa hưởng” được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho lời Môi-se nói với cộng đồng giao ước; giữ cặp thuật ngữ pháp lý và danh riêng Yahweh, đồng thời tránh lối diễn đạt quá sát chữ gây gượng trong tiếng Việt.
