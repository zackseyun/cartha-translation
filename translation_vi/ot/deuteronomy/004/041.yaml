lexical_decisions:
- source_word: אָז
  choice: Bấy giờ
  rationale: Trạng từ chỉ thời gian mở đầu hành động tiếp theo trong mạch kể; “Bấy giờ” tự nhiên, trang trọng và sát nghĩa.
- source_word: יַבְדִּיל
  choice: biệt riêng
  rationale: Dạng Hiphil của בדל diễn tả việc tách riêng vì một mục đích; “biệt riêng” giữ được ý phân tách và dành riêng mà chưa nói rõ hơn điều câu này trực tiếp nêu.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: שָׁלֹשׁ עָרִים
  choice: ba thành
  rationale: Chuyển trực tiếp cấu trúc số từ và danh từ; “thành” phù hợp ngữ cảnh các đô thị cổ.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ở bên kia sông Giô-đanh
  rationale: Thành ngữ địa lý chỉ vùng ở phía bên kia sông Giô-đanh theo điểm nhìn của lời kể; cách diễn đạt này tự nhiên nhưng vẫn bảo toàn tính tương đối của phương hướng.
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: về phía mặt trời mọc
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ, nghĩa là hướng đông, đồng thời vẫn rõ ràng trong tiếng Việt hiện đại.
