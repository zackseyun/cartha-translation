    text: 'Cũng có thể dịch: “qua bên kia sông Giô-đanh” hoặc “ở phía đối diện sông Giô-đanh.” Cụm từ Hê-bơ-rơ là một thành ngữ địa lý; cách diễn đạt tùy thuộc vào điểm nhìn của lời kể.'
