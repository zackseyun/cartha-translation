source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹׁתֵי/כֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כָּל תְּמוּנָ֔ה בְּ/י֗וֹם דִּבֶּ֨ר יְהוָ֧ה אֲלֵי/כֶ֛ם בְּ/חֹרֵ֖ב מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: vi
  text: Vậy, anh em phải hết sức thận trọng giữ mình[a], vì vào ngày Đức Gia-vê phán với anh em tại Hô-rếp từ giữa ngọn lửa, anh em không thấy hình dạng nào[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “hãy hết sức gìn giữ chính mình,” hoặc “hãy hết sức gìn giữ mạng sống mình”; đây là một thành ngữ kêu gọi phải cực kỳ cẩn trọng.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bất cứ hình tượng nào” hoặc “bất cứ hình ảnh nào.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: anh em phải hết sức cẩn thận giữ mình
  rationale: Cụm Hê-bơ-rơ, sát chữ là “hãy hết sức gìn giữ chính mạng sống/con người mình,” là một thành ngữ phản thân nhấn mạnh sự cảnh giác cao độ. “Hết sức cẩn thận giữ mình” vừa tự nhiên trong tiếng Việt, vừa giữ được sức nặng của lời cảnh báo.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do cho lời cảnh báo; “vì” diễn đạt rõ quan hệ nguyên nhân trong tiếng Việt.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: anh em không thấy bất cứ hình dạng nào
  rationale: תְּמוּנָה có thể chỉ hình dạng, hình thể, hình tượng hoặc hình ảnh tương tự. “Hình dạng” phù hợp với trọng tâm rằng dân chúng không thấy một biểu hiện hữu hình nào của Đức Giê-hô-va, nhưng không thu hẹp từ này thành tượng do con người chế tạo.
- source_word: בְּיוֹם
  choice: trong ngày
  rationale: Giữ nét diễn đạt thời gian của nguyên văn; trong tiếng Việt, “trong ngày ... phán” tự nhiên hơn “vào ngày” khi mệnh đề được mở rộng.
- source_word: דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: Đức Giê-hô-va phán với anh em
  rationale: “Phán” là cách diễn đạt trang trọng, dễ hiểu khi chủ thể là Đức Chúa Trời; אֶל biểu thị lời nói hướng đến dân chúng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế danh ấy bằng một tước hiệu.
- source_word: בְּחֹרֵב
  choice: tại Hô-rếp
  rationale: “Tại” diễn đạt tự nhiên địa điểm xảy ra sự kiện; “Hô-rếp” là dạng phiên âm tiếng Việt dễ nhận biết.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: từ giữa ngọn lửa
  rationale: Giữ ý cụ thể của מִתּוֹךְ là “từ giữa/bên trong,” đồng thời “ngọn lửa” tạo câu tiếng Việt tự nhiên và sinh động.
theological_decisions:
- issue: Sắc thái nhân học của נֶפֶשׁ trong לְנַפְשֹׁתֵיכֶם
  choice: 'hiểu theo thành ngữ phản thân: “giữ mình”'
  alternative: “gìn giữ linh hồn mình” hoặc “gìn giữ mạng sống mình”
  rationale: Trong cấu trúc này, נֶפֶשׁ không nhất thiết nêu một bộ phận tách biệt của con người, nhưng tăng sức cho lời kêu gọi tự cảnh giác. Cách dịch phản thân tránh đưa vào câu một quan niệm nhân học mà văn bản không chủ ý khẳng định.
- issue: Ý nghĩa của תְּמוּנָה trong bối cảnh sự hiện diện của Đức Chúa Trời tại Hô-rếp
  choice: “hình dạng”
  alternative: “hình tượng” hoặc “hình ảnh”
  rationale: Câu này nhấn mạnh rằng dân Y-sơ-ra-ên không thấy hình thể hữu hình nào khi Đức Giê-hô-va phán. “Hình dạng” giữ được nền tảng cho lệnh cấm tạo tượng ở các câu kế tiếp mà không đồng nhất ngay từ này với một tượng thần nhân tạo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng Y-sơ-ra-ên được Môi-se trực tiếp nói với; giữ danh riêng “Đức Giê-hô-va” và địa danh “Hô-rếp.”
