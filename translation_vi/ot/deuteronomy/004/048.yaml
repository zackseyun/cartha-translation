  terminology: Các địa danh được phiên âm nhất quán theo lối Việt hóa của bản dịch. “Khe” là lựa chọn chấp nhận được cho נַחַל trong ngữ cảnh này, và chú thích giải thích thỏa đáng rằng từ này không nhất thiết chỉ một dòng sông thường trực. Chú thích về Si-ôn phân biệt đúng địa danh trong câu với Zion quen thuộc và nêu chính xác đối chiếu tại Phục Truyền Luật Lệ Ký 3:9.
