  source_fidelity: 'Bản dịch truyền đạt đúng công thức địa giới של מֵ... וְעַד: “từ A-rô-e ... cho đến núi Si-ôn.” Mệnh đề quan hệ xác định A-rô-e ở bên bờ/khe Ác-nôn được giữ, và “tức là Hẹt-môn” phản ánh đúng chức năng đồng nhất hóa của הוּא חֶרְמוֹן. Câu vẫn là một mảnh cú pháp, phù hợp với việc tiếp nối câu trước.'
