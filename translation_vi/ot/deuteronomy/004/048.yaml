id: DEU.4.48
reference: Deuteronomy 4:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מֵ/עֲרֹעֵ֞ר אֲשֶׁ֨ר עַל שְׂפַת נַ֧חַל אַרְנֹ֛ן וְ/עַד הַ֥ר שִׂיאֹ֖ן ה֥וּא חֶרְמֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: vi
  text: từ A-rô-e[a], nằm bên bờ khe Ác-nôn, cho đến núi Si-ôn (tức là Hẹt-môn)[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-rô-e là địa danh ở rìa khe Ác-nôn. Từ Hê-bơ-rơ נַחַל có thể chỉ khe, lòng suối hoặc thung lũng có dòng nước theo mùa, không nhất thiết là sông có nước quanh năm.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “Si-ôn”; đây không phải Si-ôn (Zion) tại Giê-ru-sa-lem. Chính câu này xác định núi Si-ôn ở đây là Hẹt-môn; xem thêm Phục Truyền Luật Lệ Ký 3:9, nơi người Si-đôn gọi núi ấy là Si-ri-ôn.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: từ A-rô-e
  rationale: Tiền tố מִן chỉ điểm khởi đầu của địa giới; địa danh được phiên âm theo cách quen dùng trong tiếng Việt.
- source_word: אֲשֶׁר
  choice: nằm
  rationale: Trong mệnh đề quan hệ chỉ vị trí, “nằm” diễn đạt tự nhiên ý của אֲשֶׁר kết hợp với cụm địa điểm theo sau.
- source_word: עַל שְׂפַת
  choice: bên bờ
  rationale: שָׂפָה nghĩa đen là “mép/môi”; trong ngữ cảnh địa lý, “bên bờ” là cách diễn đạt tự nhiên.
- source_word: נַחַל אַרְנֹן
  choice: khe Ác-nôn
  rationale: נַחַל có thể chỉ khe, lòng suối hay thung lũng có dòng nước theo mùa, không nhất thiết là một con sông thường xuyên; “khe” ngắn gọn và giữ được đặc điểm địa hình.
- source_word: וְ/עַד
  choice: cho đến
  rationale: Đánh dấu điểm cuối của phạm vi địa giới.
- source_word: הַר שִׂיאֹן
  choice: núi Si-ôn
  rationale: הַר được dịch là “núi”; שִׂיאֹן được phiên âm là “Si-ôn”, nhưng cần chú thích để tránh nhầm với Si-ôn/Zion quen thuộc.
- source_word: הוּא חֶרְמוֹן
  choice: tức là Hẹt-môn
  rationale: Đại từ הוּא ở đây có chức năng đồng vị, giải thích rằng núi Si-ôn chính là Hẹt-môn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc mảnh câu vì câu 48 tiếp nối cú pháp của câu trước. Dùng “khe” để phản ánh sắc thái địa hình của נַחַל, đồng thời chú thích các khả năng nghĩa khác. Các địa danh được phiên âm theo lối Việt hóa thông dụng.
