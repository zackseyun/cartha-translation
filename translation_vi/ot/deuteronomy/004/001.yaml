id: DEU.4.1
reference: Deuteronomy 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: vi
  text: Và giờ đây, hỡi Israel, hãy lắng nghe các luật lệ và phán quyết[a] mà tôi đang dạy anh em thi hành, để anh em được sống, tiến vào và chiếm hữu[b] vùng đất mà Yahweh[c], Đức Chúa Trời của tổ phụ anh em, đang ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các sắc lệnh và quy định.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sở hữu” hoặc “thừa hưởng.”'
    reason: lexical_alternative
  - marker: c
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Và giờ đây
  rationale: Giữ rõ từ nối chuyển ý với phần trước, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: שְׁמַע אֶל
  choice: hãy lắng nghe
  rationale: Diễn tả việc chăm chú nghe theo mà không thu hẹp nghĩa thành “vâng lời”; ý thi hành đã được nói rõ ở phần sau.
- source_word: הַחֻקִּים
  choice: các luật lệ
  rationale: Là cách gọi dễ hiểu cho những quy định được ấn định, đồng thời vẫn phân biệt với מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: phán quyết
  rationale: Giữ sắc thái pháp lý và tư pháp của từ Hê-bơ-rơ, phân biệt với “luật lệ”.
- source_word: מְלַמֵּד אֶתְכֶם לַעֲשׂוֹת
  choice: đang dạy anh em thi hành
  rationale: “Đang dạy” phản ánh hành động hiện thời của phân từ; “thi hành” chuyển tải tự nhiên ý làm theo các luật lệ và phán quyết.
- source_word: לְמַעַן תִּחְיוּ
  choice: để anh em được sống
  rationale: Giữ quan hệ mục đích/hệ quả giao ước mà không giải thích thêm bản chất của sự sống.
- source_word: וּבָאתֶם
  choice: tiến vào
  rationale: Diễn đạt hướng đi vào vùng đất và nối tự nhiên với hành động chiếm hữu tiếp theo.
- source_word: וִירִשְׁתֶּם
  choice: chiếm hữu
  rationale: Phản ánh nghĩa cụ thể là tiếp nhận và nắm quyền sở hữu vùng đất; nghĩa “thừa hưởng” vẫn được ghi nhận trong chú thích.
- source_word: הָאָרֶץ
  choice: vùng đất
  rationale: Giữ thuật ngữ chỉ miền đất được hứa ban, đồng thời tự nhiên hơn “đất” khi đứng trong câu này.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước YHWH thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Đức Chúa Trời của tổ phụ anh em
  rationale: Giữ công thức giao ước chỉ Đức Chúa Trời của các bậc cha ông Israel; “tổ phụ” tự nhiên và trang trọng trong ngữ cảnh Kinh Thánh.
theological_decisions:
- issue: Cách chuyển dịch danh YHWH
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì âm thầm thay bằng tước hiệu.
- issue: Quan hệ giữa việc nghe, thi hành và được sống
  choice: Giữ cấu trúc “lắng nghe… thi hành, để… được sống”
  alternative: Diễn giải thành một mệnh đề giáo lý xác định chính xác bản chất hoặc điều kiện của sự sống
  rationale: Cấu trúc Hê-bơ-rơ nêu mục đích/hệ quả nhưng không giải thích đầy đủ tại đây; bản dịch bảo tồn sức căng giao ước mà không thêm một hệ thống thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “hỡi Israel” để giữ lời kêu gọi trực tiếp; dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng Israel. Cấu trúc câu giữ chuỗi hành động của nguyên văn nhưng được điều chỉnh vừa đủ để đọc tự nhiên.
