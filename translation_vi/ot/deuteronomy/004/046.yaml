  text: בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בַּ/גַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּ/אֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּ/בְנֵֽי יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: vi
  text: Ở bên kia sông Giô-đanh, trong thung lũng đối diện Bết Phê-ô, trong xứ của Si-hôn, vua của dân A-mô-rít, người cư ngụ tại Hết-bôn, người đã bị Môi-se cùng các con trai Y-sơ-ra-ên[a] đánh hạ khi họ ra khỏi Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Y-sơ-ra-ên.” Tiếng Hê-bơ-rơ chép “các con trai Y-sơ-ra-ên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ở bên kia sông Giô-đanh
  rationale: Cụm từ chỉ miền ở phía bên kia một ranh giới; cách dịch này tự nhiên trong tiếng Việt và giữ nguyên góc nhìn địa lý của lời kể.
- source_word: בַּגַּיְא
  choice: trong thung lũng
  rationale: גַּיְא có thể chỉ thung lũng hoặc khe núi; “thung lũng” phù hợp với mô tả địa hình và dễ hiểu hơn trong ngữ cảnh này.
- source_word: מוּל
  choice: đối diện
  rationale: Từ này diễn tả vị trí ở phía đối diện hoặc hướng mặt về một địa điểm.
- source_word: בֵּית פְּעוֹר
  choice: Bết Phê-ô
  rationale: Đây là địa danh; dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: thuộc đất của Si-hôn
  rationale: אֶרֶץ ở đây chỉ vùng đất hoặc lãnh thổ do Si-hôn cai trị; “thuộc đất của” làm rõ quan hệ địa lý mà không diễn giải quá mức.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: vua dân A-mô-rít
  rationale: Giữ cấu trúc xác định Si-hôn là vua của dân A-mô-rít.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: là người cư ngụ tại Hết-bôn
  rationale: Phân từ יוֹשֵׁב diễn tả nơi cư trú; “cư ngụ” trang trọng vừa phải và tự nhiên trong văn thuật chuyện.
- source_word: אֲשֶׁר הִכָּה
  choice: đã bị ... đánh hạ
  rationale: נכה trong bối cảnh chiến trận mang nghĩa đánh hoặc hạ gục; thể bị động giúp câu tiếng Việt rõ đối tượng mà vẫn giữ lực nghĩa quân sự.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: cùng các con trai Y-sơ-ra-ên
  rationale: Giữ hình thức giống đực số nhiều của nguyên ngữ, đồng thời chú thích cách hiểu tập thể tự nhiên hơn.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: khi họ ra khỏi Ai Cập
  rationale: Giới từ בְּ trước động từ nguyên mẫu tạo mệnh đề thời gian; cách dịch này tự nhiên và giữ liên hệ trực tiếp với cuộc xuất hành.
theological_decisions:
- issue: Danh xưng giao ước có giống trong וּבְנֵי יִשְׂרָאֵל
  choice: các con trai Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: Nguyên ngữ dùng danh từ giống đực số nhiều “các con trai” nhưng cả cụm cũng hoạt động như một danh xưng tập thể. Bản chính giữ hình thức cụ thể của tiếng Hê-bơ-rơ, còn chú thích bảo tồn cách hiểu tập thể tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Câu được giữ như phần tiếp nối cú pháp của câu trước, phù hợp với cấu trúc của Phục truyền luật lệ ký 4:45–46. Các địa danh và tên riêng dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
