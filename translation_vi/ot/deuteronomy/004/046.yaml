  to: Ở bên kia sông Giô-đanh, trong thung lũng đối diện Bết Phê-ô, trong xứ của Si-hôn, vua của dân A-mô-rít, người cư ngụ tại Hết-bôn, người đã bị Môi-se cùng các con trai Y-sơ-ra-ên[a] đánh hạ khi họ ra khỏi Ai Cập.
