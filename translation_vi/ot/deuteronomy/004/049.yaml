base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: vi
  text: và toàn vùng A-ra-ba bên kia sông Giô-đanh về phía đông, cho đến Biển A-ra-ba[a], ở dưới các sườn núi Phít-ga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là biển thường được gọi là Biển Chết.
    reason: cross_reference
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: vùng A-ra-ba
  rationale: Dùng địa danh A-ra-ba vì ở đây từ này chỉ một vùng địa lý thuộc thung lũng đứt gãy sông Giô-đanh; thêm “vùng” để câu tiếng Việt rõ và tự nhiên.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: bên kia sông Giô-đanh
  rationale: Giữ ý nghĩa tương quan của thành ngữ địa lý, tức vùng ở phía bên kia sông so với điểm nhìn của người nói.
- source_word: מִזְרָחָה
  choice: về phía đông
  rationale: Diễn đạt tự nhiên trạng từ chỉ hướng/phía đông mà không đưa thêm cách hiểu ngoài văn bản.
- source_word: יָם הָעֲרָבָה
  choice: Biển A-ra-ba
  rationale: Dịch sát tên gọi trong tiếng Hê-bơ-rơ thay vì thay bằng tên gọi thông dụng về sau; danh tính thường được công nhận của biển này được ghi ở chú thích.
- source_word: תַּחַת
  choice: ở dưới
  rationale: Trong ngữ cảnh địa hình, cụm này diễn tả vị trí thấp hơn các sườn núi.
- source_word: אַשְׁדֹּת
  choice: các sườn núi
  rationale: Trong cách dùng địa lý, danh từ này chỉ các triền dốc hoặc sườn núi; cách dịch này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: הַפִּסְגָּה
  choice: Phít-ga
  rationale: Phiên âm địa danh theo cách đọc quen thuộc, không chuyển thành một danh từ chung.
- source_word: וְכָל
  choice: và toàn
  rationale: Giữ liên từ nối với phần trước và phạm vi bao quát của lãnh thổ được kể đến.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp tiếng Việt hiện đại. Giữ các địa danh theo nguyên ngữ, đồng thời dùng danh từ loại cần thiết như “vùng”, “sông” và “Biển” để người đọc phổ thông dễ hiểu.
