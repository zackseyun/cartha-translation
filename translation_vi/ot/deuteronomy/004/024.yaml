base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: vi
  text: Vì Yahweh, Đức Chúa Trời của anh em, là lửa thiêu nuốt, là Đức Chúa Trời ghen tương[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời nhiệt thành.” Từ Hê-bơ-rơ nhấn mạnh quyền đòi hỏi sự trung thành độc hữu của Yahweh nơi dân giao ước của Ngài, đặc biệt trong bối cảnh thờ hình tượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Dẫn vào lý do cho lời cảnh báo ngay trước đó; “Vì” giữ tự nhiên chức năng giải thích của liên từ.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong tiếng Việt để biểu thị Danh Giao Ước, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Nguyên văn là đại từ ngôi hai số ít, nói với Israel như một cộng đồng thống nhất. Tiếng Việt dùng “anh em” để diễn đạt tự nhiên lời trực tiếp dành cho toàn dân.
- source_word: אֵשׁ אֹכְלָה
  choice: ngọn lửa thiêu nuốt
  rationale: Giữ nguyên hình ảnh vị ngữ mạnh của tiếng Hê-bơ-rơ về sự thánh khiết và phán xét của Đức Chúa Trời.
- source_word: הוּא
  choice: là
  rationale: Đại từ độc lập tạo sắc thái nhấn mạnh trong tiếng Hê-bơ-rơ; trong tiếng Việt, cấu trúc vị ngữ với “là” truyền đạt ý nghĩa tự nhiên mà không cần lặp chủ ngữ.
- source_word: אֵל
  choice: Đức Chúa Trời
  rationale: Ở đây là danh xưng thần linh đặt song song với mệnh đề trước; cách dịch này trang trọng, tự nhiên và phù hợp văn cảnh.
- source_word: קַנָּא
  choice: ghen
  rationale: Từ này nói đến quyền đòi hỏi giao ước độc hữu của Đức Chúa Trời và việc Ngài không dung thứ sự thờ phượng đối thủ; “ghen” giữ được sức căng quan hệ của nguyên văn.
theological_decisions:
- issue: Cách diễn đạt sự ghen của Đức Chúa Trời
  choice: một Đức Chúa Trời ghen
  alternative: một Đức Chúa Trời sốt sắng
  rationale: Văn cảnh cảnh báo về thờ hình tượng nhấn mạnh quyền đòi hỏi lòng trung thành độc hữu trong giao ước. “Ghen” bảo tồn sức căng thần học và quan hệ của từ Hê-bơ-rơ, thay vì làm nhẹ thành lòng nhiệt thành nói chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” diễn đạt lời xưng hô tập thể với Israel dù hậu tố Hê-bơ-rơ ở số ít; “ngọn lửa thiêu nuốt” giữ hình ảnh mạnh và nhịp câu cô đọng của nguyên văn.
