source:
  edition: WLC
  text: וַ/תִּקְרְב֥וּ/ן וַ/תַּֽעַמְד֖וּ/ן תַּ֣חַת הָ/הָ֑ר וְ/הָ/הָ֞ר בֹּעֵ֤ר בָּ/אֵשׁ֙ עַד לֵ֣ב הַ/שָּׁמַ֔יִם חֹ֖שֶׁךְ עָנָ֥ן וַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: vi
  text: Anh em đã đến gần và đứng dưới chân núi; núi đang cháy rực trong lửa tới tận lòng trời[a]—bóng tối, mây và bóng tối mịt mù.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “tới lòng các tầng trời”; đây là thành ngữ có thể chỉ giữa trời hoặc tới tận trời cao.'
    reason: lexical_alternative
  - marker: b
    text: “Bóng tối mịt mù” cũng có thể dịch là “bóng tối dày đặc”, “tối tăm mịt mù” hoặc “u ám dày đặc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: anh em đã đến gần
  rationale: Động từ קרב ở ngôi thứ hai số nhiều chỉ việc tiến lại gần; “đến gần” tự nhiên và giữ nguyên chuyển động hướng về núi.
- source_word: וַתַּעַמְדוּן
  choice: đứng
  rationale: Động từ עמד có nghĩa cơ bản là đứng; cách dịch ngắn gọn phù hợp với chuỗi sự việc trong lời thuật.
- source_word: תַּחַת הָהָר
  choice: dưới chân núi
  rationale: תַּחַת theo nghĩa đen là “ở dưới”, nhưng trong địa hình này chỉ vị trí dưới chân hoặc sát nền núi.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: cháy rực trong lửa
  rationale: Phân từ בֹּעֵר diễn tả trạng thái đang tiếp diễn; bản dịch giữ cả ý cháy lẫn danh từ “lửa” của nguyên văn.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: ngọn lửa vươn tận giữa các tầng trời
  rationale: לֵב theo nghĩa đen là “lòng/trái tim” nhưng ở đây chỉ phần giữa hoặc nơi cao sâu trong trời. Bổ sung chủ thể “ngọn lửa” theo ngữ cảnh giúp câu tiếng Việt rõ ràng mà không đổi hình ảnh ngọn núi cháy tới trời.
- source_word: חֹשֶׁךְ
  choice: tối tăm
  rationale: Giữ nghĩa cơ bản của từ và là yếu tố thứ nhất trong bộ ba mô tả quang cảnh thần hiện.
- source_word: עָנָן
  choice: mây
  rationale: Danh từ số ít mang nghĩa tập hợp; “mây” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: וַעֲרָפֶל
  choice: bóng tối dày đặc
  rationale: עֲרָפֶל chỉ sự tối tăm đậm đặc, che phủ; cách dịch này phân biệt phần nào với חֹשֶׁךְ đứng trước và giữ sắc thái đáng sợ, huyền nhiệm.
theological_decisions:
- issue: Hình ảnh cuộc thần hiện tại núi Sinai
  choice: 'Giữ nguyên các hình ảnh cụ thể và đầy uy nghi: lửa, tối tăm, mây và bóng tối dày đặc.'
  alternative: Diễn đạt các yếu tố cuối câu như những hiện tượng thời tiết thông thường.
  rationale: Nguyên văn trình bày một cuộc thần hiện bằng nhiều lớp hình ảnh gây kính sợ. Bản dịch không giản lược chúng thành mô tả khí tượng, cũng không thêm lời giải thích giáo lý.
- issue: Thành ngữ לֵב הַשָּׁמַיִם
  choice: giữa các tầng trời
  alternative: lòng các tầng trời; tận trời cao
  rationale: “Giữa các tầng trời” giữ ý thành ngữ về phần giữa hoặc độ cao của trời mà vẫn tự nhiên; chú thích bảo tồn hình ảnh “lòng” theo nghĩa đen và sự mơ hồ giữa “giữa” với “độ cao”.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh em” thể hiện ngôi thứ hai số nhiều trong lời Môi-se nói với dân Israel. Hai câu tiếng Việt làm rõ nhịp thuật sự; dấu gạch ngang duy trì bộ ba hình ảnh ở cuối câu. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
