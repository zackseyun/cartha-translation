source:
  edition: WLC
  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: vi
  text: Chính mắt anh em đã thấy điều Yahweh đã làm tại Ba-anh Phê-ô, vì Yahweh, Đức Chúa Trời của anh em, đã tiêu diệt khỏi giữa anh em mọi người đi theo Ba-anh Phê-ô.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: Chính mắt anh em đã thấy
  rationale: Giữ lực nhấn mạnh của cấu trúc Hê-bơ-rơ đặt “mắt anh em” lên trước, đồng thời dùng thành ngữ Việt tự nhiên để diễn tả việc tận mắt chứng kiến.
- source_word: עָשָׂה
  choice: làm
  rationale: Trong ngữ cảnh này, động từ chỉ điều Yahweh đã thực hiện khi phán xét tại Ba-anh Phê-ô; “làm” là cách diễn đạt rộng và sát nguồn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּבַעַל פְּעוֹר
  choice: tại Ba-anh Phê-ô
  rationale: Giới từ בְּ ở đây chỉ địa điểm hoặc biến cố gắn với Ba-anh Phê-ô; “tại” ngắn gọn và tự nhiên.
- source_word: כִּי
  choice: ':'
  rationale: Mệnh đề sau giải thích cụ thể điều Yahweh đã làm. Dấu hai chấm truyền đạt quan hệ giải thích tự nhiên hơn “vì” trong câu tiếng Việt này.
- source_word: כָּל הָאִישׁ
  choice: bất cứ người nào
  rationale: Cụm danh từ số ít mang nghĩa phân phối. Tiếng Việt không đánh dấu giống ngữ pháp như tiếng Hê-bơ-rơ, nên cách này diễn đạt chính xác từng cá nhân mà không thêm giới tính không được biểu hiện tự nhiên trong ngôn ngữ đích.
- source_word: הָלַךְ אַחֲרֵי
  choice: đi theo
  rationale: Giữ hình ảnh “đi theo” của nguyên ngữ và hàm ý theo về lòng trung thành, ở đây là theo thần tượng.
- source_word: הִשְׁמִידוֹ
  choice: đều bị ... tiêu diệt
  rationale: Dạng Hiphil diễn tả sự hủy diệt. Cấu trúc bị động tiếng Việt nối rõ chủ thể phân phối với tác nhân Yahweh, đồng thời thể hiện đối tượng số ít được gắn trong động từ Hê-bơ-rơ.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tước hiệu giao ước đi kèm danh Yahweh; đại từ số ít trong diễn từ tập thể được chuyển tự nhiên sang “anh em” theo ngữ cảnh Môi-se nói với dân chúng.
- source_word: מִקִּרְבֶּךָ
  choice: khỏi giữa anh em
  rationale: Giữ ý bị loại khỏi chính cộng đồng giao ước và gần với hình ảnh không gian của nguyên ngữ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản văn trực tiếp dùng danh giao ước יהוה; giữ danh riêng giúp phân biệt với tước hiệu và không che khuất hình thức của nguyên ngữ.
- issue: Cụm phân phối giống đực số ít כָּל הָאִישׁ
  choice: bất cứ người nào
  alternative: mọi người đàn ông
  rationale: Ở đây הָאִישׁ được dùng theo nghĩa phân phối từng cá nhân. Vì tiếng Việt không có giống ngữ pháp tương ứng và ngữ cảnh nói đến những người theo Ba-anh Phê-ô, “bất cứ người nào” bảo toàn phạm vi mà không áp đặt một giới hạn giới tính không chắc chắn.
- issue: Quan hệ giữa hai mệnh đề
  choice: dùng dấu hai chấm để biểu thị lời giải thích
  alternative: vì
  rationale: כִּי có thể dẫn vào căn cứ hoặc phần giải thích. Dấu hai chấm giữ quan hệ giải thích mà không buộc câu theo sắc thái nhân quả mạnh hơn nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “anh em” cho đối tượng tập thể là dân Israel; phiên âm địa danh/thần danh בַּעַל פְּעוֹר là “Ba-anh Phê-ô” theo lối quen thuộc trong tiếng Việt. Không cần chú thích vì “đi theo” vừa sát hình ảnh nguyên ngữ vừa rõ nghĩa trong văn cảnh.
