  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֲלֵי/כֶ֖ם מִ/תּ֣וֹךְ הָ/אֵ֑שׁ ק֤וֹל דְּבָרִים֙ אַתֶּ֣ם שֹׁמְעִ֔ים וּ/תְמוּנָ֛ה אֵינְ/כֶ֥ם רֹאִ֖ים זוּלָתִ֥י קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: vi
  text: Bấy giờ, Yahweh phán với anh em từ giữa ngọn lửa[a]. Anh em nghe âm thanh của những lời nói[b], nhưng không thấy hình dạng nào[c]—chỉ có tiếng nói mà thôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ trong ngọn lửa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “âm thanh của những lời”; cũng có thể hiểu là “âm thanh của lời nói.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hình thể,” “hình ảnh” hoặc “dáng vẻ.” Từ Hê-bơ-rơ nhấn mạnh rằng họ không nhìn thấy bất cứ hình thể nào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh giao ước được biểu thị bằng bốn phụ âm YHWH, phù hợp với chứng cứ nguồn và tránh thay bằng một tước hiệu.
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר có nghĩa là nói; “phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi chủ thể là Đức Chúa Trời.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: từ giữa ngọn lửa
  rationale: Diễn đạt rõ ý lời phán phát ra từ bên trong lửa, thay vì chỉ nói chung chung là “từ ngọn lửa”.
- source_word: קוֹל דְּבָרִים
  choice: tiếng của lời phán
  rationale: Giữ sự kết hợp giữa קוֹל, “tiếng/âm thanh,” và דְּבָרִים, “lời/lời nói,” đồng thời dùng “lời phán” cho phù hợp ngữ cảnh lời Đức Chúa Trời truyền đạt.
- source_word: שֹׁמְעִים
  choice: nghe
  rationale: Phân từ tiếng Hê-bơ-rơ mang chức năng mô tả hành động trong quá khứ ở văn cảnh này; tiếng Việt không cần đánh dấu thì bằng biến tố.
- source_word: תְמוּנָה
  choice: hình dạng
  rationale: Chỉ hình thể hay hình ảnh có thể nhìn thấy; “hình dạng” giữ trọng tâm thị giác mà không thêm một cách giải thích thần học.
- source_word: אֵינְכֶם רֹאִים
  choice: không thấy một ... nào
  rationale: Cấu trúc phủ định tiếng Việt diễn đạt tự nhiên việc hoàn toàn không nhìn thấy hình dạng.
- source_word: זוּלָתִי קוֹל
  choice: chỉ có tiếng nói mà thôi
  rationale: 'זוּלָתִי nêu ngoại lệ: không có hình dạng được nhìn thấy, chỉ có tiếng được nghe. Cách dịch này rõ nghĩa và vẫn giữ sự đối lập giữa nghe và thấy.'
theological_decisions:
- issue: Ngôn ngữ về sự biểu hiện hữu hình của Đức Chúa Trời
  choice: Giữ nguyên sự tương phản giữa việc nghe lời mặc khải và không thấy hình dạng nào.
  alternative: “Anh em nghe tiếng Ngài nhưng không thấy hình ảnh hữu hình nào của Ngài.”
  rationale: Câu Hê-bơ-rơ khẳng định lời phán thật sự được nghe trong khi không có תְמוּנָה nào được nhìn thấy. Bản dịch không mở rộng điều này thành một tuyên bố giáo lý vượt quá nội dung câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều chỉ cộng đồng Israel; dùng “phán” cho lời nói của Đức Chúa Trời. Dấu gạch ngang làm nổi bật vế ngoại lệ cuối câu mà không giải thích thêm.
