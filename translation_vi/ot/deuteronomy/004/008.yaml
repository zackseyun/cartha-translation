  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: vi
  text: Và có dân tộc vĩ đại nào có những luật lệ và phán quyết công chính như toàn bộ luật pháp này mà hôm nay tôi đặt trước mặt anh em không?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “luật pháp” là “sự giáo huấn” (từ Hê-bơ-rơ là torah), dù ở đây văn cảnh mang tính pháp lý rõ rệt với “luật lệ và phán quyết”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: Và có ... nào ... không?
  rationale: Chuyển câu hỏi tu từ Hê-bơ-rơ sang cấu trúc nghi vấn tự nhiên trong tiếng Việt, đồng thời giữ liên từ nối với câu trước.
- source_word: גּוֹי גָּדוֹל
  choice: dân tộc vĩ đại
  rationale: “Dân tộc” diễn đạt một cộng đồng dân tộc có tư cách tập thể; “vĩ đại” giữ ý so sánh về tầm vóc và địa vị.
- source_word: חֻקִּים
  choice: luật lệ
  rationale: Diễn đạt những quy định được ban hành trong bối cảnh pháp lý bằng từ ngữ phổ thông nhưng trang trọng.
- source_word: וּמִשְׁפָּטִים
  choice: và phán quyết
  rationale: Giữ sắc thái tư pháp của từ Hê-bơ-rơ và phân biệt nó với חֻקִּים.
- source_word: צַדִּיקִם
  choice: công chính
  rationale: Bao hàm cả chiều kích đạo đức lẫn pháp lý của điều phù hợp với lẽ phải, thay vì chỉ nhấn mạnh tính công bằng thủ tục.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: như toàn bộ luật pháp này
  rationale: Giữ cấu trúc so sánh và tính toàn thể; “luật pháp” phù hợp với văn cảnh trực tiếp nói đến luật lệ và phán quyết.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: đặt trước anh em
  rationale: Phản ánh thành ngữ Hê-bơ-rơ chỉ việc trình bày điều luật trước cộng đồng; “anh em” thể hiện lời Môi-se nói với tập thể Y-sơ-ra-ên.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Cách diễn đạt hiện đại, tự nhiên và giữ nguyên điểm nhấn thời gian.
theological_decisions:
- issue: Cách dịch תּוֹרָה
  choice: luật pháp
  alternative: sự giáo huấn
  rationale: Trong câu này, các từ “luật lệ” và “phán quyết” xác định một văn cảnh pháp lý rõ rệt, nên “luật pháp” là cách dịch chính phù hợp nhất. Tuy vậy, nghĩa rộng hơn là “sự giáo huấn” được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ được diễn đạt tự nhiên; các thuật ngữ pháp lý vẫn được phân biệt, và sắc thái rộng hơn của תּוֹרָה được giữ trong chú thích.
