source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: vi
  text: 'Vậy, anh em phải tuân giữ và thực hành các điều ấy, vì đó chính là sự khôn ngoan và thông sáng của anh em trước mắt các dân. Khi nghe tất cả những luật lệ này[a], họ sẽ nói: “Quả thật[b], dân tộc vĩ đại này là một dân khôn ngoan và thông sáng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Luật lệ” dịch từ חֻקִּים, một thuật ngữ pháp lý cũng có thể dịch là “sắc lệnh” hoặc “quy định”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Chỉ có dân tộc vĩ đại này mới là một dân khôn ngoan và thông sáng.” Từ רַק trong tiếng Hê-bơ-rơ thường có nghĩa là “chỉ”, nhưng ở đây có lẽ được dùng như một lời nhấn mạnh: “Quả thật.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: tuân giữ
  rationale: Trong ngữ cảnh giao ước và luật pháp, שׁמר chỉ việc cẩn thận vâng theo. “Tuân giữ” tự nhiên, trang trọng và giữ được sắc thái trung thành thực hiện.
- source_word: וַעֲשִׂיתֶם
  choice: thực hành
  rationale: עשה bổ sung cho “tuân giữ” bằng cách nhấn mạnh việc đem các điều luật ra thực hiện; “thực hành” giữ rõ ý này trong tiếng Việt hiện đại.
- source_word: כִּי הִוא
  choice: vì đó chính là
  rationale: Đại từ giống cái số ít quy chiếu tổng hợp đến việc tuân giữ và thực hành các điều đã truyền. “Đó chính là” diễn đạt tự nhiên mà không xác định hẹp hơn điều nguyên văn cho phép.
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: sự khôn ngoan và thông sáng của anh em
  rationale: Hai từ חכמה và בינה gần nghĩa nhưng không đồng nhất. Cặp “khôn ngoan và thông sáng” duy trì sự phân biệt cũng như sự liên kết với חכם וְנבון ở cuối câu.
- source_word: לְעֵינֵי הָעַמִּים
  choice: trước mắt các dân
  rationale: Cách dịch này gần với hình ảnh Hê-bơ-rơ “trong mắt các dân” và nhấn mạnh tính công khai, có thể quan sát được.
- source_word: הָעַמִּים
  choice: các dân
  rationale: Dùng “các dân” để phân biệt עמים với גוי ở phần sau, nơi “dân tộc” phù hợp hơn.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: tất cả những luật lệ này
  rationale: חֻקִּים là thuật ngữ pháp lý chỉ những điều được quy định. “Luật lệ” rõ nghĩa đối với độc giả hiện đại và vẫn giữ sắc thái pháp luật.
- source_word: רַק
  choice: Quả thật
  rationale: Dù רַק thường có nghĩa đen là “chỉ”, trong lời cảm thán này từ ấy có khả năng mang chức năng nhấn mạnh. “Quả thật” diễn đạt tự nhiên, còn nghĩa đen được bảo lưu trong chú thích.
- source_word: עַם חָכָם וְנָבוֹן
  choice: một dân khôn ngoan và thông sáng
  rationale: Cách dịch này phản ánh hai phẩm chất tương ứng với “sự khôn ngoan và thông sáng” trước đó, đồng thời giữ danh từ tập thể “dân”.
- source_word: הַגּוֹי הַגָּדוֹל הַזֶּה
  choice: dân tộc vĩ đại này
  rationale: “Dân tộc” diễn đạt גוי tự nhiên và phân biệt nó với עמים; “vĩ đại” bao quát ý về tầm vóc và địa vị mà không tự ý thu hẹp thành đông dân hay hùng mạnh.
theological_decisions:
- issue: Mối liên hệ giữa sự vâng phục và sự khôn ngoan
  choice: Cụm “đó chính là sự khôn ngoan và thông sáng của anh em” quy chiếu tự nhiên đến việc tuân giữ và thực hành các luật lệ, qua đó sự khôn ngoan được bày tỏ công khai trước các dân.
  alternative: Có thể hiểu chính các luật lệ, tách khỏi hành động vâng theo, là sự khôn ngoan và thông sáng của Israel.
  rationale: Mạch cú pháp nối mệnh lệnh “tuân giữ và thực hành” trực tiếp với כִּי הִוא. Bản dịch dùng đại từ “đó” để giữ phạm vi quy chiếu tổng hợp, không thêm quan niệm về công trạng hay ưu thế dân tộc.
- issue: Sắc thái của רַק trong lời nhận xét của các dân
  choice: 'Hiểu là lời nhấn mạnh: “Quả thật”.'
  alternative: 'Hiểu theo nghĩa hạn định: “Chỉ có dân tộc vĩ đại này mới là một dân khôn ngoan và thông sáng.”'
  rationale: Ngữ cảnh lời cảm thán ủng hộ chức năng nhấn mạnh, nhưng nghĩa hạn định vốn có của רַק vẫn là khả năng thật sự nên được ghi trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Anh em” thể hiện ngôi thứ hai số nhiều hướng đến cộng đồng Israel. Bản dịch giữ sự phân biệt giữa “các dân” (עמים) và “dân tộc” (גוי), đồng thời dùng cặp từ nhất quán “khôn ngoan và thông sáng” xuyên suốt câu.
