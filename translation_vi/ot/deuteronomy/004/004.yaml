base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/004.yaml
  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: vi
  text: Còn anh em, là những người gắn bó với Yahweh, Đức Chúa Trời của anh em, thì hôm nay tất cả đều còn sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bám chặt vào” hoặc “gắn chặt với”; cách nói trong tiếng Hebrew chỉ sự gắn bó mật thiết và trung thành với Yahweh trong giao ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Còn anh em
  rationale: Liên từ cùng đại từ độc lập tạo thế tương phản với những người đã chết vì Ba-anh Phê-ô ở câu trước; “Còn anh em” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: הַ/דְּבֵקִים
  choice: là những người gắn bó với
  rationale: Phân từ của דבק được dùng như danh từ, chỉ những người bám chặt, gắn bó và trung thành. “Gắn bó với” tự nhiên trong tiếng Việt, đồng thời giữ được ý về sự gắn kết giao ước mà không biến phân từ thành một hành động chỉ thuộc quá khứ.
- source_word: בַּ/יהוָה
  choice: với Yahweh
  rationale: Giới từ ב đi với động từ דבק biểu thị đối tượng mà dân Israel gắn bó; danh riêng giao ước יהוה được phiên là “Yahweh”.
- source_word: אֱלֹהֵי/כֶם
  choice: Đức Chúa Trời của anh em
  rationale: Cụm danh từ ở dạng liên kết với hậu tố ngôi thứ hai số nhiều xác định Yahweh là Đức Chúa Trời của chính những người đang được nói với.
- source_word: חַיִּים
  choice: đều còn sống
  rationale: Tính từ vị ngữ mô tả tình trạng hiện tại của họ. “Còn sống” làm rõ sự tương phản với những người đã bị tiêu diệt trong câu trước.
- source_word: כֻּלְּ/כֶם
  choice: tất cả
  rationale: Giữ nguyên sự nhấn mạnh rằng toàn thể nhóm người gắn bó với Yahweh đều sống sót.
- source_word: הַ/יּוֹם
  choice: hôm nay
  rationale: Cách diễn đạt hiện đại, rõ ràng, giữ nguyên mốc thời gian trực chỉ của nguyên văn.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” giúp phân biệt danh riêng này với tước hiệu và không che khuất cách gọi trong tiếng Hebrew.
- issue: Sắc thái của דבק trong quan hệ với Đức Chúa Trời
  choice: gắn bó với
  alternative: bám chặt lấy / trung thành với
  rationale: “Gắn bó với” giữ cả hình ảnh kết hợp chặt chẽ lẫn hàm ý trung thành giao ước, nhưng không thu hẹp từ này chỉ còn một ý niệm trừu tượng về lòng trung thành.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh em” phù hợp với lời Môi-se nói với cộng đồng Israel; cấu trúc “Còn anh em ... thì” làm nổi bật sự tương phản với câu trước. Danh riêng “Yahweh” được giữ theo dạng phiên âm.
