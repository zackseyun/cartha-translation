  to: Vì tôi sắp chết tại vùng đất này[a]; tôi sẽ không vượt qua sông Giô-đanh, còn anh em sẽ vượt qua và chiếm hữu[b] vùng đất tốt đẹp này.
  rationale: Chỉ sửa vị trí neo [b] để nó gắn trực tiếp với động từ “chiếm hữu”, là từ được chú thích giải nghĩa. Chú thích [a] được chỉnh nhẹ cho tự nhiên hơn trong tiếng Việt, vẫn bảo lưu khả năng diễn đạt của phân từ Hê-bơ-rơ. Nội dung và các sắc thái nghĩa chính của bản dịch không thay đổi.
