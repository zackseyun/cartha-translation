    rationale: Có thể diễn đạt trực tiếp là “tôi đang chết”, rồi giải thích rằng phân từ Hê-bơ-rơ cũng có thể chỉ hành động sắp xảy ra; điều này bảo lưu sắc thái ngữ pháp mà không dùng một thành ngữ gượng.
