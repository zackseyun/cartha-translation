language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י אָנֹכִ֥י מֵת֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את אֵינֶ֥/נִּי עֹבֵ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֙ עֹֽבְרִ֔ים וִֽ/ירִשְׁתֶּ֕ם אֶת הָ/אָ֥רֶץ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: vi
  text: Vì tôi sắp chết tại vùng đất này[a]; tôi sẽ không vượt qua sông Giô-đanh, còn anh em sẽ vượt qua và chiếm hữu[b] vùng đất tốt đẹp này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi đang chết tại vùng đất này.” Phân từ Hê-bơ-rơ có thể diễn tả một hành động sắp xảy ra.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thừa hưởng” hoặc “nhận làm cơ nghiệp.” Động từ Hê-bơ-rơ có thể chỉ việc nhận và sở hữu đất như một cơ nghiệp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do cho lời cảnh báo và khuyên nhủ ở trước.
- source_word: אָנֹכִי
  choice: tôi
  rationale: Đại từ độc lập có sắc thái nhấn mạnh; trong tiếng Việt, sự đối lập với “anh em” ở vế sau đã truyền đạt trọng tâm này một cách tự nhiên.
- source_word: מֵת
  choice: sắp chết
  rationale: Phân từ ở đây chỉ cái chết cận kề của Môi-se. “Sắp chết” tự nhiên và chính xác hơn “đang chết” trong tiếng Việt hiện đại, đồng thời tránh biến câu thành một dự đoán tương lai chung chung.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: tại vùng đất này
  rationale: אֶרֶץ chỉ vùng lãnh thổ nơi Môi-se đang ở, phía đông sông Giô-đanh. “Vùng đất” rõ nghĩa và vẫn giữ mạch văn về đất đai.
- source_word: אֵינֶנִּי עֹבֵר
  choice: tôi sẽ không vượt qua
  rationale: Cấu trúc phủ định cùng phân từ diễn tả việc sắp tới nhưng sẽ không xảy ra. Tiếng Việt tự nhiên dùng “sẽ không” trong bối cảnh này.
- source_word: אֶת הַיַּרְדֵּן
  choice: sông Giô-đanh
  rationale: Thêm danh từ loại “sông” để địa danh rõ ràng, tự nhiên đối với độc giả Việt.
- source_word: וְאַתֶּם עֹבְרִים
  choice: còn anh em sẽ vượt qua
  rationale: וְ về hình thức là “và”, nhưng ở đây tạo thế đối lập giữa Môi-se và dân chúng; “còn” diễn đạt sự tương phản ấy tự nhiên mà không làm quá mạnh.
- source_word: וִירִשְׁתֶּם
  choice: và chiếm hữu
  rationale: ירשׁ trong bối cảnh lời hứa ban đất chỉ việc tiến vào và nắm quyền sở hữu. “Chiếm hữu” giữ được sắc thái chủ động, còn khả năng hiểu là nhận đất làm cơ nghiệp được ghi ở chú thích.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: vùng đất tốt đẹp này
  rationale: Giữ cả đại từ chỉ định lẫn lời đánh giá “tốt”, dùng cách diễn đạt trang trọng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của ירשׁ trong lời hứa ban đất
  choice: chiếm hữu
  alternative: thừa hưởng / nhận làm cơ nghiệp
  rationale: Động từ có thể nhấn mạnh việc nắm quyền sở hữu hoặc việc nhận đất như cơ nghiệp. Bản chính dùng nghĩa hành động phù hợp với việc dân sắp vượt sông, nhưng chú thích bảo lưu sắc thái cơ nghiệp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để xưng hô với cộng đồng Y-sơ-ra-ên; dùng “còn” nhằm thể hiện sự đối lập giữa số phận của Môi-se và điều dân chúng sắp làm. Chú thích [b] được đặt sau “chiếm hữu… này”, đúng với từ Hê-bơ-rơ mà chú thích giải nghĩa.
