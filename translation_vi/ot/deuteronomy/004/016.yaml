id: DEU.4.16
reference: Deuteronomy 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: vi
  text: kẻo anh em cư xử bại hoại và làm cho mình một tượng chạm[a], mang hình dạng của bất cứ hình tượng nào, theo dáng nam hoặc nữ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “kẻo anh em tự làm mình bại hoại và làm cho mình một tượng chạm, một hình dạng của bất cứ hình tượng nào, một dáng nam hoặc nữ.”'
    reason: Phương án này phản ánh cách có thể hiểu động từ תשחיתון theo sắc thái phản thân, đồng thời bảo lưu cấu trúc apposition dày đặc của chuỗi danh từ Hê-bơ-rơ.
lexical_decisions:
- source_word: פֶּן
  choice: kẻo
  rationale: Diễn đạt tự nhiên lời cảnh báo về một hậu quả hoặc hành động không mong muốn, đồng thời nối tiếp cú pháp của các câu trước.
- source_word: תַּשְׁחִתוּן
  choice: hành động bại hoại
  rationale: Dạng Hiphil của שׁחת ở đây nói đến hành vi sai trái, gây hủy hoại trong sự bất tuân giao ước; cách dịch này giữ sắc thái chủ động mà không buộc động từ thành phản thân.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: làm cho mình
  rationale: 'Giữ sắc thái thụ hưởng/phản thân của לָכֶם: chính họ tự làm vật ấy cho mình.'
- source_word: פֶּסֶל
  choice: một tượng chạm
  rationale: Chỉ hình tượng được tạo tác, đặc biệt bằng việc chạm khắc; cụm này cụ thể hơn từ khái quát “thần tượng” và tự nhiên hơn lối nói cổ.
- source_word: תְּמוּנַת
  choice: mang hình dạng của
  rationale: Diễn đạt danh từ chỉ hình dạng trong cấu trúc liên kết, đồng thời phân biệt với תַּבְנִית ở phần sau.
- source_word: כָּל סָמֶל
  choice: bất cứ hình thể nào
  rationale: סמל có thể chỉ hình tượng hay hình thể đại diện. “Hình thể” giữ phạm vi rộng và tránh thu hẹp ngay thành vật thờ, trong khi ngữ cảnh đã làm rõ tính chất bị cấm.
- source_word: תַּבְנִית
  choice: giống như
  rationale: Trong ngữ cảnh này, từ chỉ kiểu mẫu hoặc hình dáng tương tự; “giống như” nối tự nhiên với hai loại “nam hay nữ” và tránh lặp “hình dạng”.
- source_word: זָכָר אֹו נְקֵבָה
  choice: nam hay nữ
  rationale: Giữ các thuật ngữ chỉ giới tính sinh học, không thu hẹp thành người đàn ông hay người đàn bà trưởng thành.
theological_decisions:
- issue: Cách dịch chuỗi thuật ngữ chống việc tạo hình tượng
  choice: Dùng “tượng chạm”, “hình dạng”, “hình thể” và “giống như” để giữ các lớp từ ngữ khác nhau
  alternative: Dịch סָמֶל là “thần tượng” và gom các thuật ngữ còn lại thành “hình ảnh”
  rationale: Nguyên văn chồng nhiều thuật ngữ gần nghĩa nhằm nhấn mạnh mọi dạng hình tượng bị cấm. Cách dịch được chọn giữ hình thức tạo tác cụ thể của פֶּסֶל và độ rộng của סָמֶל, không đưa hàm ý thờ phượng vào chính danh từ khi ngữ cảnh đã cung cấp hàm ý ấy.
- issue: Chủ thể chịu sự bại hoại trong תַּשְׁחִתוּן
  choice: “hành động bại hoại”
  alternative: “tự làm mình bại hoại”
  rationale: Dạng động từ có thể được hiểu theo sắc thái hành động cách bại hoại hoặc tự chuốc sự bại hoại. Bản chính giữ nghĩa chủ động về đạo đức mà không quyết định dứt khoát theo hướng phản thân.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” để xưng hô với cộng đồng Y-sơ-ra-ên theo số nhiều. Dấu gạch ngang cuối câu cho thấy ý còn tiếp sang câu kế tiếp.
