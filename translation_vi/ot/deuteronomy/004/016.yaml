revisions:
- from: kẻo anh em hành động bại hoại, làm cho mình một tượng chạm—mang hình dạng của bất cứ hình thể nào, giống như nam hay nữ—
  to: kẻo anh em cư xử bại hoại và làm cho mình một tượng chạm[a], mang hình dạng của bất cứ hình tượng nào, theo dáng nam hoặc nữ—
  rationale: Bản sửa làm câu tự nhiên hơn trong tiếng Việt hiện đại, đồng thời giữ lời cảnh báo, ý “cho mình”, và sự tích lũy có chủ ý của các danh từ chỉ tượng/hình/dáng trong nguyên văn. Ghi chú được thêm tại “tượng chạm” để phản ánh phương án từ vựng có trong dấu vết kiểm tra tiếng Anh và neo ghi chú rõ ràng vào câu.
