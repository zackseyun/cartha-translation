base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: vi
  text: Bết-xe trong hoang mạc, ở vùng cao nguyên[a], dành cho người Ru-bên; Ra-mốt tại Ga-la-át, dành cho người Gát; và Gô-lan tại Ba-san, dành cho người Ma-na-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vùng đồng bằng”. Từ Hê-bơ-rơ chỉ miền đất bằng hoặc cao nguyên tương đối bằng phẳng; ở đây nói đến vùng cao phía đông sông Giô-đanh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Bết-xe
  rationale: Địa danh được phiên âm theo cách viết tên riêng quen thuộc và dễ đọc trong tiếng Việt.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu hoặc thảo nguyên khô; “hoang mạc” tự nhiên, trang trọng và không nhất thiết hàm nghĩa sa mạc cát.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: thuộc vùng cao nguyên
  rationale: מִישֹׁר là miền đất bằng hoặc bình nguyên, tại đây chỉ vùng đất cao tương đối bằng phẳng phía đông sông Giô-đanh; “cao nguyên” diễn đạt địa hình rõ hơn “đồng bằng”.
- source_word: לָרֻאוּבֵנִי
  choice: dành cho người Ru-bên
  rationale: Danh từ chỉ thành viên bộ tộc ở số ít mang nghĩa đại diện; cách dịch này giữ hình thức số ít và chỉ rõ mối liên hệ bộ tộc.
- source_word: רָאמֹת
  choice: Ra-mốt
  rationale: Phiên âm địa danh sang tiếng Việt.
- source_word: בַּגִּלְעָד
  choice: tại Ga-la-át
  rationale: Ga-la-át là tên vùng; “tại” diễn đạt tự nhiên vị trí của thành.
- source_word: לַגָּדִי
  choice: dành cho người Gát
  rationale: Giữ cấu trúc song song và nghĩa đại diện của danh từ bộ tộc số ít.
- source_word: גּוֹלָן
  choice: Gô-lan
  rationale: Phiên âm địa danh sang tiếng Việt.
- source_word: בַּבָּשָׁן
  choice: tại Ba-san
  rationale: Ba-san là tên vùng; giới từ được diễn đạt tự nhiên bằng “tại”.
- source_word: לַמְנַשִּׁי
  choice: dành cho người Ma-na-se
  rationale: Giữ nghĩa đại diện của hình thức số ít trong tiếng Hê-bơ-rơ và sự cân đối của ba vế.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: không dịch riêng; thể hiện qua phép liệt kê và liên từ “và”
  rationale: Dấu hiệu tân ngữ xác định không có từ tương đương trực tiếp trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên bộ tộc ở dạng “người + tên tổ phụ” để phản ánh danh từ chỉ thành viên bộ tộc ở số ít trong nguyên văn, đồng thời giữ nhịp song song của ba địa danh.
