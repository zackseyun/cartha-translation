base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: vi
  text: Nhưng từ đó, anh em sẽ tìm kiếm Yahweh, Đức Chúa Trời của anh em, và sẽ tìm thấy Ngài, nếu anh em tìm kiếm Ngài với tất cả tấm lòng và toàn thể con người mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Toàn thể con người mình” dịch từ Hê-bơ-rơ nephesh, cũng có thể được dịch là “mạng sống mình” hoặc “linh hồn mình”; ở đây từ này nói đến toàn thể bản thân đang sống.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם מִשָּׁם
  choice: Nhưng từ đó, anh em sẽ tìm kiếm
  rationale: מִשָּׁם được giữ theo nghĩa chỉ nơi chốn là “từ đó”, tức từ giữa các dân nơi Israel bị phân tán trong văn cảnh. Liên từ וּ được dịch là “nhưng” để thể hiện bước chuyển tương phản từ lời cảnh báo trước đó sang khả năng quay về tìm kiếm Đức Chúa Trời.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Danh riêng giao ước יְהוָה được phiên là “Yahweh”. Cụm אֱלֹהֶיךָ được diễn đạt tự nhiên bằng tiếng Việt; “anh em” chỉ cộng đồng Israel được nói đến như một tập thể.
- source_word: וּמָצָאתָ
  choice: rồi anh em sẽ gặp được Ngài
  rationale: Động từ מצא theo nghĩa đen là “tìm thấy”. Với đối tượng ngầm là Đức Chúa Trời, “gặp được Ngài” tự nhiên trong tiếng Việt và vẫn diễn tả kết quả thành công của việc tìm kiếm; đại từ “Ngài” được bổ sung từ đối tượng ở mệnh đề trước.
- source_word: כִּי
  choice: nếu
  rationale: Trong ngữ cảnh này, כִּי nêu điều kiện để gặp được Đức Chúa Trời. “Nếu” giữ rõ tính điều kiện, không biến lời này thành một sự hoàn tất tự động.
- source_word: תִדְרְשֶׁנּוּ
  choice: anh em tìm cầu Ngài
  rationale: דרש trong bối cảnh giao ước nói đến việc tha thiết hướng về và tìm kiếm Đức Chúa Trời. “Tìm cầu” giữ được sắc thái tôn giáo và quan hệ, đồng thời diễn đạt rõ hậu tố chỉ Ngài.
- source_word: בְּכָל לְבָבְךָ
  choice: hết lòng
  rationale: לֵבָב bao hàm ý chí, suy nghĩ và tình cảm của con người. Thành ngữ “hết lòng” ngắn gọn, tự nhiên và chính xác trong tiếng Việt.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: hết cả con người mình
  rationale: נֶפֶשׁ ở đây chỉ sự sống hay toàn thể bản thân, không nhất thiết là một phần phi vật chất tách biệt. “Hết cả con người mình” truyền đạt sự tận hiến toàn diện; phạm vi nghĩa khác được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” giữ danh riêng mà không thay bằng một tước hiệu.
- issue: Phạm vi nghĩa của נֶפֶשׁ trong công thức tận hiến giao ước
  choice: hết cả con người mình
  alternative: hết linh hồn mình; hết mạng sống mình
  rationale: Trong công thức đi cùng “hết lòng”, נֶפֶשׁ nhấn mạnh toàn bộ sự sống và bản thân. Cách dịch được chọn tránh thu hẹp từ này vào một quan niệm nhị nguyên, trong khi chú thích vẫn bảo tồn các cách hiểu truyền thống và từ vựng khác.
- issue: Sự chuyển đổi từ số nhiều sang số ít trong lời nói với Israel
  choice: dùng “anh em” xuyên suốt
  alternative: các anh em ... ngươi
  rationale: Bản Hê-bơ-rơ mở đầu bằng động từ ngôi thứ hai số nhiều rồi chuyển sang số ít, nói với Israel vừa như cộng đồng vừa như một đơn vị. Tiếng Việt dùng “anh em” theo nghĩa tập thể để tránh sự chuyển đại từ gượng gạo, nhưng không biến điều này thành một tuyên bố thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng như đại từ tập thể chỉ Israel. Dấu chấm phẩy làm rõ hai bước “tìm kiếm” và “gặp được”, còn “tìm cầu” giữ sắc thái tha thiết của hành động hướng về Đức Chúa Trời.
