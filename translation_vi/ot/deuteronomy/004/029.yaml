    rationale: Hai cụm בְּכָל (“với tất cả”) cùng bổ nghĩa cho hành động tìm kiếm. Bản sửa biểu đạt song song rõ ràng hơn, đồng thời duy trì phạm vi toàn diện của לֵבָב và נֶפֶשׁ.
