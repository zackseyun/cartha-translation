id: DEU.4.2
reference: Deuteronomy 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: vi
  text: Anh em không được thêm vào lời tôi truyền cho anh em, cũng không được bớt khỏi lời ấy, để anh em tuân giữ các điều răn của Yahweh[a], Đức Chúa Trời của anh em, mà tôi truyền cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là YHWH, thường được dịch theo truyền thống là “CHÚA”; tại đây phiên âm là “Yahweh”.
    reason: Giải thích danh riêng của Đức Chúa Trời và ghi nhận cách dịch truyền thống.
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: thêm vào
  rationale: Động từ Hifil của יסף đi với עַל mang nghĩa thêm một điều gì vào nội dung đã có; “thêm vào” tự nhiên và chính xác trong tiếng Việt.
- source_word: הַדָּבָר
  choice: lời
  rationale: דָּבָר có thể là “lời”, “việc” hoặc “điều”; ở đây chỉ toàn bộ nội dung Môi-se đang truyền dạy. “Lời” giữ được dạng số ít và sắc thái lời được công bố.
- source_word: מְצַוֶּה
  choice: truyền cho
  rationale: Phân từ diễn tả hành động truyền lệnh đang diễn ra trong lời nói của Môi-se. “Truyền cho” trang trọng, tự nhiên và phù hợp ngữ cảnh luật pháp giao ước.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: bớt khỏi lời ấy
  rationale: גָּרַע có nghĩa làm giảm hoặc lấy bớt. Cách dịch này tạo thế đối xứng rõ với “thêm vào” và làm sáng tỏ đại từ số ít מִמֶּנּוּ.
- source_word: לִשְׁמֹר
  choice: để ... tuân giữ
  rationale: לְ với động từ nguyên mẫu ở đây biểu thị mục đích hoặc kết quả. “Để ... tuân giữ” tự nhiên trong tiếng Việt và vẫn để ngỏ sắc thái mục đích–kết quả của cấu trúc.
- source_word: מִצְוֺת
  choice: các điều răn
  rationale: Đây là dạng số nhiều trong ngữ cảnh luật pháp giao ước; “các điều răn” là cách diễn đạt rõ ràng, trang trọng và quen thuộc.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu; chú thích cung cấp cách trình bày truyền thống.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Trong công thức giao ước đi với YHWH, אֱלֹהִים chỉ một Đức Chúa Trời; cách dịch này cũng thể hiện hậu tố sở hữu số nhiều “của anh em”.
theological_decisions:
- issue: Cách trình bày danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước YHWH. Bản chính giữ danh riêng “Yahweh”, còn chú thích nêu cách dịch thay thế truyền thống bằng tước hiệu.
- issue: Quan hệ ý nghĩa của לִשְׁמֹר
  choice: để anh em tuân giữ
  alternative: và anh em phải tuân giữ
  rationale: Cấu trúc לְ + động từ nguyên mẫu nghiêng về mục đích hoặc kết quả; không nên biến nó thành một mệnh lệnh độc lập và làm mất quan hệ cú pháp với lệnh cấm thêm bớt.
translation_notes:
  register: Dùng tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Anh em” biểu thị cộng đồng dân Israel ở ngôi thứ hai số nhiều; giữ sự lặp lại “tôi truyền cho anh em” của nguyên văn để bảo toàn nhịp điệu và trọng tâm của lời Môi-se.
