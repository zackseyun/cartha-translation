base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: vi
  text: 'Rồi họ phải nói với các trưởng lão của thành người ấy: “Con trai này của chúng tôi ngoan cố và phản nghịch, không nghe lời chúng tôi[a]; nó tham ăn và ham rượu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “không nghe tiếng chúng tôi.” Trong thành ngữ Hê-bơ-rơ này, “nghe” cũng hàm ý lưu tâm và vâng theo; cũng có thể dịch: “không vâng lời chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Rồi họ phải nói
  rationale: Liên từ cùng động từ trong trình tự luật lệ tiếp nối thủ tục ở câu trước; “rồi” diễn đạt tự nhiên tính kế tiếp, còn “phải” giữ sắc thái quy định.
- source_word: זִקְנֵי עִירוֹ
  choice: các trưởng lão trong thành của người con ấy
  rationale: זִקְנֵי chỉ tập thể lãnh đạo địa phương; “các trưởng lão” là cách gọi chính xác và quen thuộc. Cụm sở hữu được diễn đạt rõ để tránh hiểu nhầm là thành của cha mẹ.
- source_word: בְּנֵנוּ זֶה
  choice: Đứa con này của chúng tôi
  rationale: Giữ sự chỉ định nhấn mạnh của זֶה và quan hệ sở hữu trong בְּנֵנוּ bằng tiếng Việt tự nhiên.
- source_word: סוֹרֵר וּמֹרֶה
  choice: ngoan cố và phản nghịch
  rationale: “Ngoan cố” diễn tả thái độ khăng khăng chống lại sự sửa dạy; “phản nghịch” giữ mức độ chống đối chủ động của từ thứ hai.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: không nghe lời chúng tôi
  rationale: Thành ngữ Hê-bơ-rơ nghĩa đen là “không nghe tiếng chúng tôi,” nhưng động từ nghe ở đây bao hàm việc chú ý và vâng theo. “Nghe lời” vừa tự nhiên vừa giữ được hình ảnh nghe và hàm ý phục tùng.
- source_word: זוֹלֵל
  choice: tham ăn
  rationale: Trong cặp với סֹבֵא, từ này chỉ thói ăn uống vô độ; “tham ăn” rõ nghĩa, hiện đại và có sắc thái thường xuyên.
- source_word: וְסֹבֵא
  choice: và say sưa
  rationale: Từ này mô tả người thường xuyên uống rượu quá độ. “Say sưa” phối hợp tự nhiên với “tham ăn” và giữ đặc tính thói quen mà không thêm danh từ không có trong cấu trúc tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “trưởng lão” để giữ thuật ngữ hành chính-xã hội của Phục Truyền Luật Lệ Ký; tránh lối diễn đạt cổ như “chẳng nghe tiếng chúng tôi.”
