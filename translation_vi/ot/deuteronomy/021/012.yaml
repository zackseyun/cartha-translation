  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: vi
  text: rồi anh phải đưa nàng vào nhà mình; nàng phải cạo đầu và cắt móng tay mình[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để móng tay mình mọc dài.” Tiếng Hê-bơ-rơ dịch sát là “làm móng của mình”; đây là một thành ngữ có nghĩa còn được tranh luận.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: rồi anh phải đưa nàng
  rationale: Dạng Hiphil cùng waw tiếp nối diễn tả hành động bắt buộc kế tiếp trong quy định pháp luật. “Rồi” thể hiện trình tự, còn “phải đưa” truyền đạt lực quy định.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: vào nhà mình
  rationale: Cụm từ chỉ việc đưa vào bên trong nhà. Tiếng Việt tự nhiên dùng “vào nhà mình”; dịch cứng là “vào giữa nhà” dễ gây hiểu sai về vị trí ở chính giữa căn nhà.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: nàng sẽ cạo đầu
  rationale: גלח nghĩa là cạo; với “đầu” làm bổ ngữ, “cạo đầu” là cách diễn đạt trực tiếp, tự nhiên và không thêm ý rằng phải cạo sạch hoàn toàn.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: cắt móng tay mình
  rationale: Nguyên văn là “làm/xử lý móng của nàng”, một thành ngữ có nghĩa còn tranh luận. “Cắt móng tay” là cách hiểu tự nhiên phù hợp cho chính văn; cách hiểu “để móng tay mọc dài” được giữ trong chú thích.
theological_decisions:
- issue: Sự mơ hồ của וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: Nàng cắt móng tay.
  alternative: Nàng để móng tay mọc dài.
  rationale: Động từ עשה (“làm”) đi với “móng” không xác định rõ hành động cụ thể. Chính văn dùng cách hiểu truyền thống, dễ hiểu, nhưng chú thích bảo tồn cách hiểu chính đáng khác thay vì xóa bỏ sự mơ hồ của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh” theo ngôi nam số ít của mạch văn và “nàng” để chỉ người nữ bị bắt làm tù binh. “Mình” làm đại từ sở hữu phản thân, tránh lặp nặng nề; dấu chấm phẩy phân tách hành động của người nam với các hành động của người nữ.
