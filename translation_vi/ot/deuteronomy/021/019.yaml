  yaml_path: translation/ot/deuteronomy/021/019.yaml
  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: vi
  text: thì cha và mẹ người con ấy phải nắm lấy người ấy, đưa người ấy ra trước các trưởng lão của thành người ấy, đến cổng nơi người ấy ở[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cổng thành là nơi công cộng mà các trưởng lão địa phương xét xử những vụ việc pháp lý.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “cổng thành của mình”. Tiếng Hê-bơ-rơ theo nghĩa đen là “cổng nơi mình ở”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: phải bắt giữ người con ấy
  rationale: Động từ תפשׂ đi với ב diễn tả việc nắm giữ về thể chất. “Bắt giữ” truyền đạt tính kiên quyết của hành động trong bối cảnh pháp lý, còn “người con ấy” làm rõ đại từ chỉ người theo ngữ cảnh.
- source_word: אָבִיו וְאִמּוֹ
  choice: cha và mẹ người con ấy
  rationale: Tiếng Hê-bơ-rơ nêu riêng cả cha lẫn mẹ, mỗi danh từ đều có hậu tố sở hữu. Cách dịch này giữ sự nhấn mạnh rằng cả hai cùng hành động.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: dẫn ra
  rationale: Dạng Hiphil của יצא có nghĩa khiến một người đi ra, đưa hoặc dẫn ra. “Dẫn ra” tự nhiên trong tiếng Việt và phù hợp với việc đưa người con từ phạm vi gia đình đến nơi xét xử công khai.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: gặp các trưởng lão của thành mình
  rationale: Cụm từ chỉ các vị lãnh đạo hoặc người xét xử của cộng đồng địa phương. “Các trưởng lão” giữ thuật ngữ xã hội-pháp lý của nguyên văn; “thành mình” bảo toàn quan hệ sở hữu.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: và đến cổng nơi mình ở
  rationale: שׁער là cổng thành, nơi công khai giải quyết các vụ việc pháp lý; מקום theo nghĩa đen là “nơi/chỗ”. Bản dịch giữ cách nói rộng của nguyên văn thay vì tự động đồng nhất מקום với “thành”, đồng thời chú thích ý nghĩa văn hóa và cách dịch thay thế.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng dùng tiếng Việt hiện đại. Cấu trúc “cha và mẹ” giữ sự nhấn mạnh của nguyên văn; “người con ấy” tránh đại từ có thể mang sắc thái khinh miệt. Hai chú thích được đánh dấu đầy đủ trong câu chính.
