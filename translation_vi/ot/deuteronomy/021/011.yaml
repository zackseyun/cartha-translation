source:
  edition: WLC
  text: וְ/רָאִיתָ֙ בַּ/שִּׁבְיָ֔ה אֵ֖שֶׁת יְפַת תֹּ֑אַר וְ/חָשַׁקְתָּ֣ בָ֔/הּ וְ/לָקַחְתָּ֥ לְ/ךָ֖ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: vi
  text: và giữa những người bị bắt, anh thấy một người phụ nữ có vẻ ngoài xinh đẹp[a], rồi anh khao khát nàng và lấy nàng làm vợ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một người phụ nữ có diện mạo xinh đẹp.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát tiếng Hê-bơ-rơ: “lấy nàng cho mình làm vợ,” một thành ngữ chỉ việc cưới nàng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָ בַּשִּׁבְיָה
  choice: và giữa những người bị bắt, anh thấy
  rationale: Giữ mạch nối của luật tình huống từ ngữ cảnh trước; בַּשִּׁבְיָה chỉ tập thể những người bị bắt trong chiến tranh, nên dịch tự nhiên là “giữa những người bị bắt” mà không diễn giải thêm thành thuật ngữ pháp lý hiện đại.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: một người phụ nữ có vóc dáng xinh đẹp
  rationale: Cụm Hê-bơ-rơ nhấn mạnh hình thể hoặc diện mạo bên ngoài. “Có vóc dáng xinh đẹp” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái cụ thể hơn cách dịch chung chung “một phụ nữ đẹp”.
- source_word: תֹּאַר
  choice: vóc dáng
  rationale: Từ này có thể chỉ hình thể hoặc diện mạo. Trong cụm hiện tại, “vóc dáng” phản ánh sát nghĩa “form,” còn khả năng “diện mạo” được giữ trong chú thích.
- source_word: וְחָשַׁקְתָּ בָהּ
  choice: rồi anh khao khát nàng
  rationale: Động từ diễn tả ham muốn hoặc gắn lòng mạnh mẽ; “khao khát” giữ sức nặng của từ, không làm nhẹ thành “cảm thấy bị thu hút”.
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  choice: và lấy nàng làm vợ
  rationale: Đây là thành ngữ Hê-bơ-rơ về việc kết hôn, theo nghĩa đen là “lấy nàng cho mình làm vợ.” Cách dịch chính tự nhiên trong tiếng Việt, còn hình thức sát chữ được nêu ở chú thích.
theological_decisions:
- issue: Diễn đạt một điều luật khó về đạo đức mà không giảm nhẹ hoặc thêm phán xét ngoài văn bản
  choice: Giữ nguyên lời mô tả trực tiếp về việc người đàn ông khao khát và lấy người nữ làm vợ
  alternative: Làm nhẹ thành “muốn chọn nàng làm vợ,” hoặc thêm lời xác định sự cưỡng ép hay sự tán thành
  rationale: Câu này trình bày thẳng một tình huống thời chiến. Bản dịch không che nhẹ hành động, cũng không thêm đánh giá mà chính câu không nói rõ, nhờ đó giữ nguyên sức căng đạo đức của văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh” theo lời luật hướng trực tiếp đến một người nam số ít, và “nàng” để tránh lặp từ trong câu; không thêm thuật ngữ phán xét hay làm dịu tình huống chiến tranh.
