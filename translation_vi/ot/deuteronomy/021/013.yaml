  to: Nàng phải cởi bỏ quần áo của thời bị bắt[a], ở lại trong nhà anh, và khóc thương cha mẹ mình trọn một tháng. Sau đó, anh có thể ăn ở với nàng và làm chồng nàng; nàng sẽ là vợ anh.
