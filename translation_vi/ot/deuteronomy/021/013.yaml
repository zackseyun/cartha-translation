  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: vi
  text: Nàng phải cởi bỏ quần áo của thời bị bắt[a], ở lại trong nhà anh, và khóc thương cha mẹ mình trọn một tháng. Sau đó, anh có thể ăn ở với nàng và làm chồng nàng; nàng sẽ là vợ anh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quần áo của cảnh tù binh” hoặc “quần áo nàng mặc khi bị bắt.”'
    reason: Cụm שִׂמְלַת שִׁבְיָהּ có thể chỉ quần áo gắn với thân phận hoặc thời kỳ bị bắt, hoặc chính quần áo nàng đang mặc khi bị bắt.
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: Nàng phải cởi bỏ
  rationale: Dạng Hiphil của סור diễn tả việc loại bỏ; “cởi bỏ” tự nhiên khi đối tượng là quần áo và giữ sắc thái quy định của văn bản luật.
- source_word: שִׂמְלַת שִׁבְיָהּ
  choice: bộ quần áo khi bị bắt
  rationale: Cụm từ theo sát nghĩa đen là “quần áo của tình trạng bị bắt”; cách dịch này giữ khả năng đó là quần áo nàng mặc lúc bị bắt mà không khẳng định đây là một loại trang phục tù binh riêng biệt.
- source_word: מֵעָלֶיהָ
  choice: cởi bỏ
  rationale: Nghĩa đen là “khỏi trên mình nàng”; ý này đã được diễn đạt tự nhiên trong động từ tiếng Việt “cởi bỏ”, tránh lặp vụng về.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: ở lại trong nhà anh
  rationale: ישב có thể là ngồi, cư trú hoặc ở lại; trong ngữ cảnh này, “ở lại” diễn đạt việc lưu trú liên tục một cách tự nhiên.
- source_word: וּבָכְתָה אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: khóc thương cha mẹ mình
  rationale: בכה cơ bản là khóc; với cha mẹ làm đối tượng, “khóc thương” vừa giữ hành động khóc vừa thể hiện bối cảnh tang chế hoặc chia lìa. “Cha mẹ mình” là cách nói Việt tự nhiên cho cặp “cha nàng và mẹ nàng”.
- source_word: יֶרַח יָמִים
  choice: trọn một tháng
  rationale: Thành ngữ theo nghĩa đen là “một tháng ngày”, nhấn mạnh một tháng đầy đủ; “trọn một tháng” tự nhiên và bảo toàn điểm nhấn ấy.
- source_word: וְאַחַר כֵּן
  choice: Sau đó
  rationale: Chuyển tải trực tiếp trình tự thời gian.
- source_word: תָּבֹא אֵלֶיהָ
  choice: anh có thể ăn ở với nàng
  rationale: “Đi vào với nàng” là thành ngữ chỉ quan hệ tình dục. “Ăn ở với” là lối nói tiếng Việt trang trọng vừa phải, phù hợp bối cảnh hôn nhân và không làm mất nội dung tính dục.
- source_word: וּבְעַלְתָּהּ
  choice: và làm chồng nàng
  rationale: Động từ בעל trong ngữ cảnh này chỉ việc đảm nhận quan hệ người chồng. “Làm chồng nàng” giữ sự phân biệt với mệnh đề chỉ quan hệ tình dục trước đó và tránh sắc thái sở hữu không cần thiết.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: nàng sẽ là vợ anh
  rationale: Đây là công thức chỉ địa vị hôn nhân; bản dịch trực tiếp, tự nhiên và trang trọng.
theological_decisions:
- issue: Thành ngữ tình dục và địa vị hôn nhân trong luật về người nữ bị bắt
  choice: 'Giữ riêng hai ý: “ăn ở với nàng” và “làm chồng nàng”; sau đó nêu rõ nàng trở thành vợ.'
  alternative: Gộp thành “cưới nàng”, hoặc dịch thẳng hơn là “quan hệ tình dục với nàng”.
  rationale: Tiếng Hê-bơ-rơ phân biệt hành vi đến với nàng về tình dục, vai trò người chồng, và địa vị người vợ. Giữ cả ba yếu tố bảo toàn cấu trúc pháp lý cùng sự căng thẳng đạo đức của đoạn văn, không lãng mạn hóa cũng không nói mạnh hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “anh/nàng” để phản ánh lời luật nói trực tiếp với người nam và nhắc đến người nữ, đồng thời tránh cách xưng hô quá cổ. Cụm “ăn ở với” được dùng theo nghĩa hôn nhân-tính dục, không làm nhẹ hay làm gay gắt hơn nguyên văn.
