base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: vi
  text: Nhưng nếu anh không ưa thích nàng, thì anh phải để nàng ra đi tự do[a]. Tuyệt đối không được bán nàng lấy tiền; cũng không được đối xử với nàng như một món hàng[b], vì anh đã làm nhục nàng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “sai nàng đi cho nàng,” tức là để nàng được tự do theo ý mình.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không được bóc lột nàng để trục lợi.” Động từ Hê-bơ-rơ hiếm gặp, có thể mang nghĩa đối xử với nàng như một đối tượng để sử dụng hoặc thu lợi về kinh tế.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “vì anh đã xâm phạm nàng.” Từ Hê-bơ-rơ có thể chỉ việc gây khổ, hạ nhục hoặc xâm phạm tình dục, tùy ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Nhưng nếu
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện nối tiếp và có sắc thái tương phản với luật lệ ngay trước đó; không cần chuyển máy móc thành “và sẽ xảy ra nếu”.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: anh không còn ưa thích nàng
  rationale: חפץ chỉ sự ưa thích, ham muốn hay vui thích nơi một người. Trong diễn tiến của điều luật, “không còn” diễn đạt tự nhiên sự thay đổi tình cảm, dù ý thời gian này được suy ra từ ngữ cảnh hơn là được nói rõ trong từ Hê-bơ-rơ.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: anh phải để nàng ra đi tự do
  rationale: Cụm từ có nghĩa đen là “sai nàng đi cho chính mình,” tức trả nàng về quyền tự do định đoạt, chứ không chỉ đuổi đi.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: Tuyệt đối không được bán nàng lấy tiền
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh lệnh cấm; “tuyệt đối không được” bảo toàn sức nhấn mạnh ấy. כֶּסֶף ở đây tự nhiên nhất là “tiền”.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: không được đối xử với nàng như một món hàng
  rationale: Động từ hiếm này trong ngữ cảnh song song với lệnh cấm bán có sắc thái chiếm dụng, bóc lột hoặc biến người phụ nữ thành đối tượng kinh tế. Cách dịch giữ hình ảnh thương mại mà không thu hẹp thành một hình thức bóc lột duy nhất.
- source_word: תַּחַת אֲשֶׁר
  choice: vì
  rationale: Diễn đạt quan hệ nguyên nhân làm cơ sở cho hai lệnh cấm.
- source_word: עִנִּיתָהּ
  choice: anh đã làm nhục nàng
  rationale: ענה ở thể piel có thể chỉ gây khổ, hạ nhục hoặc xâm phạm tình dục. “Làm nhục” giữ được tổn thương và sự hạ thấp trong bối cảnh này mà không loại bỏ nghĩa mạnh hơn, được ghi ở chú thích.
theological_decisions:
- issue: Sức nặng đạo đức của luật về người nữ tù binh
  choice: 'Trình bày câu này như sự hạn chế quyền lực của người đàn ông: phải trả tự do cho người phụ nữ và không được bán hay trục lợi từ nàng sau khi đã làm nhục nàng.'
  alternative: Diễn đạt như một cuộc ly hôn hoàn toàn đồng thuận, hoặc xác định rõ hành vi trước đó là hiếp dâm ngay trong chính văn.
  rationale: Bản văn thừa nhận bối cảnh cưỡng chế và đặt lý do của lệnh cấm nơi điều người đàn ông đã làm với nàng. Tuy nhiên, từ ענה có phạm vi nghĩa rộng, nên chính văn không nên thu hẹp hơn chứng cứ Hê-bơ-rơ; nghĩa “xâm phạm” được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “anh… nàng” để phản ánh lời luật nói trực tiếp với người nam mà vẫn giữ sắc thái dignified; “tuyệt đối không được” thể hiện cấu trúc nhấn mạnh của nguyên văn. Các chú thích bảo tồn những điểm mơ hồ thật sự của thành ngữ לְנַפְשָׁהּ, động từ hiếm תתעמר và động từ ענה.
