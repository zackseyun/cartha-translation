  source_fidelity: 'Bản dịch phản ánh đúng các mệnh lệnh chính: phải cho người phụ nữ ra đi tự do, nghiêm cấm bán lấy tiền, nghiêm cấm biến nàng thành đối tượng kinh tế, và nêu lý do là người nam đã làm nhục nàng. Tuy nhiên, “không còn ưa thích” thêm ý thời gian “không còn,” vốn không có trong לֹא חָפַצְתָּ בָּהּ. Nên giữ cách nói không đánh dấu thời gian.'
  naturalness: Văn phong hiện đại, rõ ràng và giữ được sắc thái nghiêm trang. “Anh... nàng” tự nhiên trong lối trực tiếp của điều luật. Chỉnh “không còn ưa thích” thành “không ưa thích” giúp câu vừa sát nghĩa vừa tự nhiên. Chú thích nghĩa đen nên dùng “cho nàng” thay vì “cho chính mình” để tránh hiểu sai đại từ thành chủ thể nam.
  terminology: “Làm nhục” là lựa chọn chính văn thận trọng và phù hợp cho עִנִּיתָהּ; chú thích bảo lưu khả năng nghĩa mạnh hơn về xâm phạm tình dục. “Đối xử với nàng như một món hàng” truyền đạt hợp lý sắc thái khai thác/đối tượng hóa trong ngữ cảnh lệnh cấm bán, mà không áp đặt một cách giải thích hẹp.
