source:
  edition: WLC
  text: וְ/הוֹרִ֡דוּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֤וא אֶת הָֽ/עֶגְלָה֙ אֶל נַ֣חַל אֵיתָ֔ן אֲשֶׁ֛ר לֹא יֵעָבֵ֥ד בּ֖/וֹ וְ/לֹ֣א יִזָּרֵ֑עַ וְ/עָֽרְפוּ שָׁ֥ם אֶת הָ/עֶגְלָ֖ה בַּ/נָּֽחַל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: vi
  text: Bấy giờ, các trưởng lão của thành ấy phải dẫn con bò cái tơ xuống một khe suối có dòng nước chảy quanh năm[a], là nơi không hề được canh tác hoặc gieo trồng; tại đó, trong khe suối, họ phải bẻ gãy cổ con bò cái tơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một khe suối có dòng nước chảy thường xuyên.” Cụm từ Hê-bơ-rơ נַחַל אֵיתָן có thể chỉ một khe hoặc lòng suối có dòng nước bền vững; một số người hiểu là một khe núi hoặc thung lũng hiểm trở.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: phải dẫn ... xuống
  rationale: Thể Hiphil của ירד mang nghĩa khiến đi xuống; “dẫn ... xuống” tự nhiên trong tiếng Việt và phù hợp với việc đưa một con vật xuống khe suối.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: các trưởng lão của thành ấy
  rationale: Giữ cấu trúc sở hữu và thuật ngữ pháp lý-xã hội quen thuộc của Kinh Thánh; “thành ấy” liên kết với thành đã được xác định trong ngữ cảnh.
- source_word: הָעֶגְלָה
  choice: con bò cái tơ
  rationale: עגלה chỉ bò cái còn non; cách dịch này chính xác và dễ hiểu hơn từ chuyên môn hiếm dùng.
- source_word: אֶל נַחַל אֵיתָן
  choice: xuống một khe suối có nước chảy quanh năm
  rationale: נחל có thể chỉ khe, thung lũng có dòng suối hoặc lòng suối; איתן ở đây nhiều khả năng diễn tả tính bền vững, thường xuyên. Cách dịch truyền đạt địa hình và cách hiểu về dòng nước nhưng vẫn ghi nhận phương án khác trong chú thích.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: là nơi không được cày cấy hay gieo giống
  rationale: Hai động từ bị động nói đến việc canh tác và gieo hạt. “Cày cấy” diễn đạt tự nhiên phạm vi canh tác, còn “gieo giống” giữ nét nghĩa cụ thể của זרע.
- source_word: וְעָרְפוּ
  choice: họ phải bẻ gãy cổ
  rationale: ערף trong nghi thức này chỉ hành động bẻ cổ, có liên hệ đến phần gáy, chứ không phải từ thông thường chỉ giết hoặc dâng sinh tế.
- source_word: שָׁם ... בַּנָּחַל
  choice: tại đó, trong khe suối
  rationale: Giữ cả trạng từ chỉ nơi chốn và sự lặp lại của נחל như nguyên văn, đồng thời diễn đạt rõ địa điểm thực hiện nghi thức.
theological_decisions:
- issue: Tính chất của נַחַל אֵיתָן
  choice: khe suối có nước chảy quanh năm
  alternative: thung lũng/khe đất hoang sơ hoặc hiểm trở
  rationale: 'Cụm từ có tranh luận từ vựng: איתן có thể được hiểu là bền vững, thường xuyên, từ đó chỉ dòng nước quanh năm; một số truyền thống hiểu về địa hình chưa khai phá hoặc gồ ghề. Bản chính chọn nghĩa thủy văn có xác suất cao trong ngữ cảnh, còn chú thích bảo tồn phương án khác.'
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “phải” để biểu đạt sắc thái mệnh lệnh của quy định; “bò cái tơ” là từ phổ thông, chính xác; “khe suối” phù hợp địa hình hơn việc vay mượn thuật ngữ “wadi”.
