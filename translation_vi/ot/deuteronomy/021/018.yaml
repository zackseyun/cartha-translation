language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֣ה לְ/אִ֗ישׁ בֵּ֚ן סוֹרֵ֣ר וּ/מוֹרֶ֔ה אֵינֶ֣/נּוּ שֹׁמֵ֔עַ בְּ/ק֥וֹל אָבִ֖י/ו וּ/בְ/ק֣וֹל אִמּ֑/וֹ וְ/יסְּר֣וּ אֹת֔/וֹ וְ/לֹ֥א יִשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: vi
  text: Nếu một người có đứa con trai ngang bướng và nổi loạn, không nghe lời cha hoặc lời mẹ,[a] và dù cha mẹ sửa dạy nó, nó vẫn không nghe lời họ,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi một người có…” Công thức luật pháp trong tiếng Hê-bơ-rơ có thể được hiểu là “nếu” hoặc “khi”.'
    reason: alternative_reading
  - marker: b
    text: 'Theo sát liên từ tiếng Hê-bơ-rơ: “và cha mẹ sửa dạy nó, và nó không nghe lời họ.” Cách dịch “dù ... vẫn” diễn đạt sắc thái nhượng bộ mà văn mạch cho phép. Từ “nghe” ở đây mang ý nghe theo hoặc vâng lời.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu một trường hợp trong luật theo lối điều kiện; “nếu” tự nhiên trong tiếng Việt, dù cũng có thể hiểu là “khi”.
- source_word: יִהְיֶה לְאִישׁ
  choice: một người có
  rationale: Chuyển cấu trúc sở hữu Hê-bơ-rơ theo cách nói tự nhiên của tiếng Việt.
- source_word: בֵּן
  choice: đứa con trai
  rationale: Danh từ chỉ rõ con trai, không phải từ trung tính chỉ con cái.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: ngang bướng và nổi loạn
  rationale: 'Giữ hai nét nghĩa song song: cố chấp không thuận phục và chủ động chống lại thẩm quyền.'
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: không nghe lời
  rationale: “Nghe lời” vừa giữ hình ảnh nghe, vừa truyền đạt hàm ý vâng theo trong ngữ cảnh.
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: lời cha hoặc lời mẹ
  rationale: “Tiếng/giọng của” là thành ngữ chỉ lời dạy hay mệnh lệnh có thẩm quyền; dưới phủ định, “hoặc” diễn đạt tự nhiên phạm vi bao quát trong tiếng Việt.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: và dù cha mẹ sửa dạy nó
  rationale: יסר chỉ việc uốn nắn, kỷ luật nhằm sửa đổi; “dù” làm rõ quan hệ nhượng bộ hợp ngữ cảnh, còn chủ ngữ “cha mẹ” tránh đại từ mơ hồ.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: nó vẫn không nghe lời họ
  rationale: Lặp lại “nghe lời” để giữ phép lặp của שמע; “vẫn” thể hiện sự tiếp diễn bất chấp việc sửa dạy.
theological_decisions:
- issue: Quan hệ giữa việc sửa dạy và sự không nghe lời sau đó
  choice: dù cha mẹ sửa dạy nó
  alternative: và cha mẹ sửa dạy nó
  rationale: Liên từ Hê-bơ-rơ có thể được giữ đơn thuần là “và”, nhưng mạch văn cũng cho phép sắc thái nhượng bộ; ghi chú bảo tồn khả năng kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nghe lời” thay cho cách dịch sát chữ “nghe tiếng” để truyền đạt thành ngữ Hê-bơ-rơ tự nhiên; giữ nhịp câu luật theo điều kiện và không làm nhẹ hai từ mô tả sự chống nghịch.
