  text: וְ/הָיָ֣ה הָ/עִ֔יר הַ/קְּרֹבָ֖ה אֶל הֶ/חָלָ֑ל וְ/לָֽקְח֡וּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֜וא עֶגְלַ֣ת בָּקָ֗ר אֲשֶׁ֤ר לֹֽא עֻבַּד֙ בָּ֔/הּ אֲשֶׁ֥ר לֹא מָשְׁכָ֖ה בְּ/עֹֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: vi
  text: Bấy giờ, thành nào gần người bị giết[a] nhất thì các trưởng lão của thành ấy phải lấy một con bò cái tơ trong đàn[b], là con chưa từng được dùng để làm việc và chưa từng kéo dưới ách[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người bị sát hại” hoặc “thi thể”. Từ Hê-bơ-rơ chỉ một người đã bị giết.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch gọn là “một con bò cái tơ”. Cụm từ Hê-bơ-rơ xác định đây là một con bò cái còn non thuộc đàn bò.
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “chưa từng kéo trong ách”, tức là chưa từng được dùng làm sức kéo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên công thức chuyển sang bước kế tiếp trong một quy định pháp luật, đồng thời giữ sự liên kết với câu trước.
- source_word: הָעִיר הַקְּרֹבָה
  choice: thành nào ... gần ... nhất
  rationale: Ngữ cảnh so sánh khoảng cách khiến tính từ קָרוֹב mang nghĩa thành gần nhất; cấu trúc “thành nào... thì” tự nhiên trong tiếng Việt và phù hợp với mệnh lệnh tiếp theo.
- source_word: אֶל הֶחָלָל
  choice: gần người bị giết
  rationale: חָלָל chỉ người đã bị giết, không chỉ đơn thuần là một thi thể; cách dịch này giữ trọng tâm về nạn nhân trong vụ án chưa tìm ra thủ phạm.
- source_word: וְלָקְחוּ זִקְנֵי הָעִיר הַהִוא
  choice: các trưởng lão của thành ấy phải bắt
  rationale: “Trưởng lão” giữ danh xưng dành cho các lãnh đạo cộng đồng; “phải” thể hiện hiệu lực bắt buộc của quy định pháp luật. “Bắt” phù hợp với việc chọn và đem một con vật từ đàn.
- source_word: עֶגְלַת בָּקָר
  choice: một con bò cái tơ trong đàn
  rationale: עֶגְלָה là bò cái còn non, còn בָּקָר xác định nó thuộc đàn gia súc lớn; “bò cái tơ” là cách gọi gọn, dễ hiểu trong tiếng Việt.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: chưa từng được dùng để làm việc
  rationale: Dạng bị động cùng giới từ בָּהּ nói đến công việc được thực hiện bằng cách sử dụng con vật; bản dịch làm rõ nghĩa công cụ mà không thêm loại lao động cụ thể.
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: chưa từng kéo ách
  rationale: מָשַׁךְ có nghĩa là kéo; cụm này xác định con vật chưa được dùng làm sức kéo dưới ách. Cách diễn đạt ngắn gọn và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. Cấu trúc “thành nào... thì...” giúp câu dài của tiếng Hê-bơ-rơ trở nên rõ ràng trong tiếng Việt; các thuật ngữ “trưởng lão”, “bò cái tơ” và “ách” giữ sắc thái bối cảnh cổ đại mà vẫn dễ hiểu.
