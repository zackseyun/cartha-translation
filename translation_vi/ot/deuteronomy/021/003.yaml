revisions:
- from: Bấy giờ, thành nào gần người bị giết[a] nhất thì các trưởng lão của thành ấy phải bắt một con bò cái tơ trong đàn[b], là con chưa từng được dùng để làm việc và chưa từng kéo ách[c].
  to: Bấy giờ, thành nào gần người bị giết[a] nhất thì các trưởng lão của thành ấy phải lấy một con bò cái tơ trong đàn[b], là con chưa từng được dùng để làm việc và chưa từng kéo dưới ách[c].
  rationale: Sửa “bắt” thành “lấy” để phản ánh chính xác động từ “lấy/chọn” trong nguyên ngữ, và điều chỉnh “kéo ách” thành “kéo dưới ách” để tiếng Việt rõ nghĩa hơn mà không thêm thông tin.
  reviewer_model: gpt-5.6-terra
