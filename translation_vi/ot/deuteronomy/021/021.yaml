  text: וּ֠/רְגָמֻ/הוּ כָּל אַנְשֵׁ֨י עִיר֤/וֹ בָֽ/אֲבָנִים֙ וָ/מֵ֔ת וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּ֑/ךָ וְ/כָל יִשְׂרָאֵ֖ל יִשְׁמְע֥וּ וְ/יִרָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: vi
  text: Vậy, tất cả đàn ông trong thành của người ấy phải ném đá người ấy cho đến chết.[a] Anh em phải trừ bỏ điều ác khỏi giữa anh em. Toàn thể Y-sơ-ra-ên sẽ nghe và sợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả dân trong thành của người ấy”; tiếng Hê-bơ-rơ theo nghĩa đen là “tất cả đàn ông trong thành của người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְגָמֻהוּ ... בָאֲבָנִים
  choice: phải lấy đá ném người ấy
  rationale: Trong ngữ cảnh luật pháp, רגם chỉ việc hành hình bằng cách ném đá. Cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ hình ảnh cụ thể của בָאֲבָנִים.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: tất cả đàn ông trong thành của người ấy
  rationale: אַנְשֵׁי mang nghĩa nam giới rõ ràng; giữ yếu tố giống đực của nguyên văn thay vì khái quát hóa thành toàn dân.
- source_word: וָמֵת
  choice: cho chết
  rationale: Diễn đạt kết quả trực tiếp của việc ném đá trong tiếng Việt tự nhiên, không xác định quá mức đây là mục đích hay chỉ là trình tự.
- source_word: וּבִעַרְתָּ הָרָע
  choice: phải trừ bỏ điều ác
  rationale: בער trong công thức pháp lý của Phục Truyền Luật Lệ Ký mang nghĩa loại trừ, thanh trừ; “trừ bỏ” giữ được sắc thái nghiêm trang mà không gợi việc thiêu đốt theo nghĩa đen.
- source_word: מִקִּרְבֶּךָ
  choice: khỏi giữa mình
  rationale: Giữ hình ảnh cộng đồng của thành ngữ Hê-bơ-rơ, đồng thời phù hợp với đại từ số nhiều được hàm ý trong lời phán cho dân chúng.
- source_word: יִשְׁמְעוּ
  choice: sẽ nghe biết
  rationale: Trong tiếng Việt, “nghe biết” truyền đạt tự nhiên ý nghe tin về sự việc mà không bổ sung nội dung không có trong nguyên văn.
- source_word: וְיִרָאוּ
  choice: và sợ
  rationale: Giữ sự rộng nghĩa của ירא, bao gồm nỗi sợ và tác dụng răn đe, thay vì thu hẹp thành hoảng sợ.
theological_decisions:
- issue: Thuật ngữ công dân mang giới tính trong bối cảnh pháp lý
  choice: tất cả đàn ông trong thành của người ấy
  alternative: tất cả dân trong thành của người ấy
  rationale: Nguyên văn dùng danh từ chỉ nam giới. Bản dịch giữ nét này mà không suy diễn thành một khẳng định giáo lý rộng hơn về vai trò giới.
- issue: Công thức trừ bỏ điều ác trong Phục Truyền Luật Lệ Ký
  choice: trừ bỏ điều ác khỏi giữa mình
  alternative: loại bỏ điều ác khỏi anh em
  rationale: “Trừ bỏ” duy trì sắc thái pháp lý–giao ước và tính công thức, còn “điều ác” giữ phạm trù đạo đức ở dạng khái quát của nguyên văn.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “anh em” theo nghĩa tập thể để thể hiện ngôi thứ hai số nhiều được chỉ đến trong mạch văn; “Y-sơ-ra-ên” theo chính tả Kinh Thánh quen thuộc. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
