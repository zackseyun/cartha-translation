  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: toàn thể các trưởng lão, thành gần nhất với người/thi thể bị giết, mệnh lệnh rửa tay, bò cái tơ bị bẻ cổ, và địa điểm là נחל. Tuy nhiên, cụm “các trưởng lão của thành ấy, là những người ở gần người bị giết nhất” dễ khiến người đọc hiểu rằng từng trưởng lão là người ở gần nạn nhân nhất. Trong ngữ cảnh và cấu trúc câu, ý là các trưởng lão thuộc thành gần nạn nhân nhất.'
