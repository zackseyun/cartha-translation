base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: vi
  text: Tất cả các trưởng lão của thành gần người bị giết nhất phải rửa tay mình trên con bò cái tơ đã bị bẻ cổ trong khe suối[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong thung lũng” hoặc “trong lòng suối.” Từ Hê-bơ-rơ chỉ một khe hay thung lũng gắn với dòng nước, có thể là dòng nước theo mùa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Tất cả
  rationale: Liên từ וְ tiếp nối trình tự thủ tục; trong tiếng Việt không nhất thiết phải dịch thành “và” ở đầu câu. כֹל bao gồm toàn thể nhóm trưởng lão được nói đến.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: các trưởng lão của thành ấy
  rationale: זִקְנֵי chỉ các bậc trưởng lão/lãnh đạo cộng đồng; “thành ấy” giữ được tính xác định của đại từ chỉ định.
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: là những người ở gần người bị giết nhất
  rationale: Cụm này xác định các trưởng lão của thành gần nạn nhân nhất. חָלָל có thể chỉ người bị giết hoặc thi thể của người ấy; bản dịch chính giữ rõ bối cảnh án mạng.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: phải rửa tay mình
  rationale: Thể chưa hoàn thành mang lực quy định trong văn bản luật; “phải” diễn đạt tự nhiên và rõ nghĩa bắt buộc trong tiếng Việt hiện đại.
- source_word: עַל
  choice: trên
  rationale: Giữ ý vị trí nghi lễ ở phía trên con vật khi rửa tay, thay vì diễn giải thành quan hệ nguyên nhân hay phương tiện.
- source_word: הָעֶגְלָה
  choice: con bò cái tơ
  rationale: עֶגְלָה là bò cái còn non; “bò cái tơ” chính xác, tự nhiên và dễ hiểu hơn một thuật ngữ chuyên biệt.
- source_word: הָעֲרוּפָה
  choice: đã bị bẻ cổ
  rationale: Động từ ערף trong nghi thức này nói đến việc bẻ cổ con vật, không phải cách giết mổ thông thường; cách dịch tránh hàm ý chém đầu bằng vũ khí.
- source_word: בַנָּחַל
  choice: trong khe suối
  rationale: נַחַל có thể chỉ khe, thung lũng hoặc lòng suối gắn với dòng nước, thường là dòng nước theo mùa. “Khe suối” giữ cả nét địa hình lẫn sự liên hệ với dòng nước.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “phải” để thể hiện tính quy định, “trưởng lão” theo cách dùng Kinh Thánh quen thuộc, và “bò cái tơ” để người đọc phổ thông dễ hiểu. Không thêm chú thích riêng cho חָלָל vì “người bị giết” tự nhiên và giữ rõ bối cảnh, còn khả năng chỉ thi thể không làm thay đổi nội dung câu.
