  naturalness: Cụm “người bị treo ở dưới sự nguyền rủa của Đức Chúa Trời” không tự nhiên trong tiếng Việt hiện đại. “Mang sự nguyền rủa của Đức Chúa Trời” tự nhiên hơn, đồng thời vẫn tránh diễn giải dứt khoát cấu trúc Hê-bơ-rơ đang tranh luận.
