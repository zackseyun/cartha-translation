source:
  edition: WLC
  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: vi
  text: Thi thể người ấy không được để qua đêm trên cây[a], nhưng ngươi phải chôn người ấy trong chính ngày đó, vì người bị treo mang sự nguyền rủa của Đức Chúa Trời; ngươi không được làm ô uế đất mà Yahweh, Đức Chúa Trời của ngươi, ban cho ngươi làm cơ nghiệp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vì người bị treo là kẻ bị Đức Chúa Trời nguyền rủa”; cũng có thể hiểu: “vì việc treo người là một sự xúc phạm đến Đức Chúa Trời.” Cụm từ Hê-bơ-rơ rất cô đọng và có thể được hiểu theo nhiều cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: để qua đêm
  rationale: Động từ לון ở đây chỉ việc lưu lại suốt đêm; cách diễn đạt này tự nhiên và giữ rõ giới hạn thời gian của lệnh cấm.
- source_word: נִבְלָתוֹ
  choice: thi thể người ấy
  rationale: נְבֵלָה chỉ xác chết; “thi thể” chính xác, trang trọng và tự nhiên trong văn luật pháp.
- source_word: עַל הָעֵץ
  choice: trên cây
  rationale: עֵץ có nghĩa là cây hoặc gỗ; “trên cây” giữ hình ảnh trực tiếp của tiếng Hê-bơ-rơ và âm hưởng Kinh Thánh về sau.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: phải chôn người ấy
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh mệnh lệnh; “phải” truyền đạt sức bắt buộc tự nhiên trong tiếng Việt.
- source_word: בַּיּוֹם הַהוּא
  choice: ngay trong ngày hôm đó
  rationale: Diễn đạt yêu cầu phải mai táng chính ngày ấy, trước khi qua đêm.
- source_word: קִלְלַת אֱלֹהִים
  choice: sự nguyền rủa của Đức Chúa Trời
  rationale: Giữ sát kết cấu sở hữu cô đọng trong nguyên văn mà không biến nó thành một mệnh đề chủ động quá xác định.
- source_word: תָּלוּי
  choice: người bị treo
  rationale: Phân từ bị động mang nghĩa người đã bị treo; cách dịch này không mặc nhiên đồng nhất hành động ấy với một phương thức hành quyết cụ thể.
- source_word: תְטַמֵּא
  choice: làm ô uế
  rationale: Giữ cả sắc thái ô uế nghi lễ lẫn sự làm nhiễm bẩn về đạo đức gắn với đất.
- source_word: אַדְמָתְךָ
  choice: đất
  rationale: Trong bối cảnh phần đất được ban làm cơ nghiệp, “đất” tự nhiên và phù hợp hơn “đất đai” hay “đất nền”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng יהוה thay vì thay thế bằng một tước hiệu.
- source_word: נַחֲלָה
  choice: làm cơ nghiệp
  rationale: נַחֲלָה là phần sở hữu được thừa hưởng; “cơ nghiệp” giữ sắc thái giao ước và phù hợp văn phong trang trọng.
theological_decisions:
- issue: Ý nghĩa của כִּי קִלְלַת אֱלֹהִים תָּלוּי
  choice: người bị treo ở dưới sự nguyền rủa của Đức Chúa Trời
  alternative: người bị treo là kẻ bị Đức Chúa Trời nguyền rủa; hoặc việc treo người là một sự xúc phạm đến Đức Chúa Trời
  rationale: Cụm tiếng Hê-bơ-rơ rất cô đọng và có thể được phân tích theo nhiều cách. Bản chính truyền đạt cách hiểu người bị treo mang dấu hiệu của sự nguyền rủa từ Đức Chúa Trời, nhưng chú thích bảo lưu các cách hiểu khác thay vì giải quyết dứt khoát sự mơ hồ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ngươi” nhất quán với lời luật pháp ở ngôi thứ hai số ít; dùng “thi thể” thay cho từ quá khẩu ngữ. Giữ danh Yahweh và thuật ngữ “cơ nghiệp” để phản ánh bối cảnh giao ước.
