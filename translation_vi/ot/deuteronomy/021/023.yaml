revisions:
- from: Thi thể người ấy không được để qua đêm trên cây[a], nhưng ngươi phải chôn người ấy ngay trong ngày hôm đó, vì người bị treo ở dưới sự nguyền rủa của Đức Chúa Trời; ngươi không được làm ô uế đất mà Yahweh, Đức Chúa Trời của ngươi, ban cho ngươi làm cơ nghiệp.
  to: Thi thể người ấy không được để qua đêm trên cây[a], nhưng ngươi phải chôn người ấy trong chính ngày đó, vì người bị treo mang sự nguyền rủa của Đức Chúa Trời; ngươi không được làm ô uế đất mà Yahweh, Đức Chúa Trời của ngươi, ban cho ngươi làm cơ nghiệp.
  rationale: Thay “ở dưới sự nguyền rủa” bằng “mang sự nguyền rủa” để tiếng Việt tự nhiên hơn, và thay “ngay trong ngày hôm đó” bằng “trong chính ngày đó” để phản ánh trực tiếp בַּיּוֹם הַהוּא. Chú thích được giữ để bảo lưu các cách hiểu khả dĩ của cụm Hê-bơ-rơ cô đọng.
