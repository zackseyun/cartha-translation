id: DEU.21.1
reference: Deuteronomy 21:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: vi
  text: Nếu trong miền đất mà Yahweh, Đức Chúa Trời của anh em, ban cho anh em để chiếm hữu, có tìm thấy một người bị giết[a] nằm trên cánh đồng, và không biết ai đã đánh người ấy,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng dạng giống đực số ít, có thể dịch sát là “một người nam bị giết”; tuy nhiên, nguyên tắc của điều luật nói chung liên quan đến một vụ giết người chưa xác định thủ phạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu điều luật theo tình huống giả định; “nếu” tự nhiên và chính xác trong văn phong pháp luật tiếng Việt.
- source_word: יִמָּצֵא
  choice: người ta tìm thấy
  rationale: Diễn đạt tự nhiên thể bị động của động từ מצא trong tiếng Việt mà không xác định chủ thể tìm thấy.
- source_word: חָלָל
  choice: một người bị giết
  rationale: Chỉ nạn nhân chết do bạo lực, không đơn thuần là thi thể; tiếng Việt không cần mã hóa giống ngữ pháp như danh từ giống đực số ít trong tiếng Hê-bơ-rơ.
- source_word: בָּאֲדָמָה
  choice: trong miền đất
  rationale: Ở đây אֲדָמָה là lãnh thổ được ban để chiếm hữu, không phải đất hay thổ nhưỡng.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: mà Yahweh, Đức Chúa Trời của anh em, ban cho anh em để chiếm hữu
  rationale: Giữ danh riêng giao ước Yahweh và ý nghĩa đất được ban để Israel chiếm hữu; “anh em” phù hợp lối xưng hô cộng đồng trong tiếng Việt.
- source_word: נֹפֵל
  choice: nằm
  rationale: Diễn tả trạng thái của nạn nhân tại hiện trường tự nhiên hơn “ngã” hay “đã ngã”, nhưng không làm thay đổi nội dung.
- source_word: בַּשָּׂדֶה
  choice: ngoài đồng
  rationale: Cách nói tự nhiên trong tiếng Việt về khu vực đồng trống bên ngoài nơi cư trú.
- source_word: לֹא נוֹדַע
  choice: không biết
  rationale: Bảo toàn cấu trúc vô nhân xưng và diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: מִי הִכָּהוּ
  choice: ai đã đánh người ấy
  rationale: Giữ nghĩa cơ bản của נכה là “đánh”; việc nạn nhân đã chết được biểu đạt riêng bởi חָלָל, nên không đồng nhất động từ này với “giết”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Văn bản ghi trực tiếp danh giao ước יהוה; dùng “Yahweh” bảo toàn chức năng danh riêng thay vì thay bằng tước hiệu.
- issue: Giới tính trong חָלָל
  choice: một người bị giết
  alternative: một người nam bị giết
  rationale: Danh từ Hê-bơ-rơ ở giống đực số ít, nhưng trong ngữ cảnh điều luật, tiếng Việt “một người bị giết” vừa tự nhiên vừa không khẳng định thêm rằng nguyên tắc chỉ áp dụng cho nam giới; chú thích ghi nhận hình thức ngữ pháp của nguyên văn.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại; dùng “anh em” cho đại từ số ít đại diện hướng đến cộng đồng Israel, tránh lối cổ khó hiểu. Câu được để mở bằng dấu phẩy vì nội dung điều kiện tiếp tục ở câu kế tiếp.
