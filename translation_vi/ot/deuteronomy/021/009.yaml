source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּבַעֵ֛ר הַ/דָּ֥ם הַ/נָּקִ֖י מִ/קִּרְבֶּ֑/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: vi
  text: Vậy, anh em phải tẩy sạch máu vô tội khỏi giữa anh em[a], vì anh em sẽ làm điều ngay thẳng trước mắt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “loại bỏ máu vô tội khỏi giữa anh em.” Thành ngữ Hê-bơ-rơ “máu vô tội” có thể hàm ý trách nhiệm của cộng đồng về việc đổ máu chưa được giải quyết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Vậy, anh em
  rationale: Liên từ cùng đại từ độc lập tạo một kết luận có nhấn mạnh. Đại từ Hê-bơ-rơ ở số ít nhưng chỉ toàn thể Israel; “anh em” truyền đạt tự nhiên cách xưng hô cộng đồng trong tiếng Việt.
- source_word: תְּבַעֵר
  choice: phải tẩy sạch
  rationale: Dạng Piel của בער trong luật Phục Truyền mang nghĩa loại bỏ hoặc thanh tẩy điều gây ô uế và trách nhiệm pháp lý khỏi cộng đồng; “phải” giữ lực mệnh lệnh.
- source_word: הַדָּם הַנָּקִי
  choice: món nợ máu vô tội
  rationale: Cụm từ có nghĩa đen là “máu vô tội”, nhưng trong ngữ cảnh nói đến trách nhiệm của cộng đồng về máu người vô tội đã đổ mà chưa được giải quyết. “Món nợ máu” làm rõ hàm ý pháp lý, còn chú thích giữ cách dịch sát chữ.
- source_word: מִקִּרְבֶּךָ
  choice: khỏi giữa mình
  rationale: Giữ hình ảnh cộng đồng của thành ngữ giao ước, đồng thời dùng cách diễn đạt gọn và hiểu được trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Giữ quan hệ nguyên nhân/căn cứ với mệnh đề trước mà không giải quyết quá mức sắc thái có thể gần với kết quả của việc vâng lời.
- source_word: תַעֲשֶׂה הַיָּשָׁר
  choice: anh em sẽ làm điều ngay thẳng
  rationale: Dạng chưa hoàn thành có thể mang sắc thái tương lai hoặc quy phạm. “Sẽ làm” bảo tồn hình thức của nguồn và diễn tả kết quả/hành vi được đòi hỏi; “điều ngay thẳng” chuyển tải tính đúng đắn về đạo đức.
- source_word: בְּעֵינֵי יְהוָה
  choice: trước mắt Yahweh
  rationale: Giữ nguyên ẩn dụ Hê-bơ-rơ về sự đánh giá của Đức Chúa Trời và phiên âm trực tiếp danh giao ước יְהוָה.
theological_decisions:
- issue: Danh thần יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguồn Hê-bơ-rơ dùng trực tiếp danh giao ước; “Yahweh” bảo tồn danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của “máu vô tội”
  choice: món nợ máu vô tội
  alternative: máu vô tội
  rationale: Ngữ cảnh nghi thức-pháp lý của 21:1–9 cho thấy cộng đồng cần được giải khỏi trách nhiệm do máu người vô tội đã đổ. Chú thích bảo tồn nghĩa đen và tránh coi cách diễn giải pháp lý là nghĩa duy nhất của cụm từ.
- issue: Lực của כִּי תַעֲשֶׂה
  choice: vì anh em sẽ làm
  alternative: khi anh em làm / bởi anh em phải làm
  rationale: Bản dịch giữ quan hệ nhân quả và hình thức chưa hoàn thành của động từ, đồng thời thừa nhận cụm này cũng có thể được hiểu theo sắc thái thời gian hoặc quy phạm.
translation_notes:
  register: Văn phong pháp luật-giao ước, trang trọng nhưng hiện đại. “Anh em” biểu đạt đại từ số ít mang tính tập thể chỉ Israel; “mình” tiếp tục quy chiếu cộng đồng. Dùng “Yahweh” nhất quán cho danh יְהוָה.
