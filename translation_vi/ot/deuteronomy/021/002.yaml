  terminology: “Trưởng lão,” “thẩm phán,” và “người bị giết” là các lựa chọn chính xác, nhất quán với bối cảnh pháp lý, và không mang diễn giải giáo phái. Chú thích đánh dấu đúng vị trí và nêu phương án sát cấu trúc tiếng Hê-bơ-rơ hơn.
