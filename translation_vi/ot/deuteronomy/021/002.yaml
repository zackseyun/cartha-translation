  source_fidelity: Bản dịch giữ đúng trình tự thủ tục của waw nối tiếp, các chức danh số nhiều với hậu tố ngôi thứ hai, và hành động đo đến những thành chung quanh người bị giết. Cụm “đo khoảng cách từ người bị giết đến” diễn đạt rõ bằng tiếng Việt điều được ngữ cảnh của động từ “đo” hàm ý, không quy thêm nguyên nhân hay tính chất pháp lý của cái chết.
