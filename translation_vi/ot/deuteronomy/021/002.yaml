  text: then your elders and your judges shall go out and measure to the cities that are around the slain man[a].
translation:
  language: vi
  text: thì các trưởng lão và các thẩm phán của anh em phải đi ra và đo khoảng cách từ người bị giết đến các thành ở chung quanh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “đo đến các thành ở chung quanh người bị giết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: thì ... phải đi ra
  rationale: Waw + qatal tiếp nối trình tự pháp lý; “thì” diễn đạt tự nhiên bước kế tiếp, còn “phải” thể hiện tính quy định trong văn bản luật.
- source_word: זְקֵנֶיךָ
  choice: các trưởng lão của anh em
  rationale: Giữ chức danh lãnh đạo cộng đồng và đại từ sở hữu ngôi thứ hai; tiếng Việt dùng “anh em” để diễn đạt tự nhiên lời nói với toàn thể Israel.
- source_word: וְשֹׁפְטֶיךָ
  choice: và các thẩm phán của anh em
  rationale: Chỉ những người thi hành thẩm quyền xét xử; “thẩm phán” trực tiếp và thích hợp với bối cảnh pháp lý.
- source_word: וּמָדְדוּ
  choice: đo khoảng cách
  rationale: Động từ có nghĩa là “đo”; bổ sung “khoảng cách” làm rõ đối tượng được đo một cách tự nhiên trong tiếng Việt mà không thay đổi nội dung.
- source_word: אֶל הֶעָרִים
  choice: đến các thành
  rationale: Giới từ אֶל chỉ các thành là điểm cuối của phép đo.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: ở chung quanh
  rationale: Diễn đạt ngắn gọn, tự nhiên vị trí của các thành bao quanh nơi có người chết.
- source_word: הֶחָלָל
  choice: người bị giết
  rationale: חָלָל chỉ người đã bị giết. Cách dịch này giữ nghĩa hơn “thi thể” và không suy diễn thêm chi tiết về thủ phạm hay tính chất pháp lý của cái chết.
theological_decisions: []
