  register: Văn phong luật pháp trang trọng nhưng hiện đại và dễ hiểu. Dùng “anh em” cho hậu tố ngôi thứ hai số ít mang tính tập thể, phù hợp cách xưng hô với Israel; tránh lối diễn đạt cổ.
