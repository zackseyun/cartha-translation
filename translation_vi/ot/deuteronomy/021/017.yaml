    rationale: Trong câu có nhiều nhân vật nam, “mình” có thể gây ngập ngừng, dù ngữ cảnh nghiêng về người cha. “Trong tất cả tài sản ông có” rõ và tự nhiên hơn trong ngữ cảnh di sản.
  - severity: low
    issue: Cấu trúc “người con đầu lòng, là con trai của...” hơi nặng.
    rationale: “Người con trai đầu lòng, con của...” vừa xác định giới tính theo nguyên văn vừa trôi chảy hơn.
