  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: vi
  text: Nhưng người cha phải công nhận người con trai đầu lòng[a], con của người vợ không được yêu, bằng cách cho người ấy một phần gấp đôi[b] trong tất cả tài sản ông có; vì người ấy là kết quả đầu tiên của sinh lực ông[c]. Quyền trưởng nam thuộc về người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người con trai đầu lòng” ở đây là con trai có địa vị pháp lý của trưởng nam. Cụm tiếp theo cũng có thể dịch sát hơn là “con trai của người vợ bị ghét” hoặc, theo nghĩa so sánh, là “con trai của người vợ ít được yêu hơn”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “miệng của hai”, một thành ngữ chỉ hai phần, tức phần thừa kế gấp đôi.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “người ấy là đầu tiên của sức mạnh ông.” Cụm từ nói đến người con đầu tiên như biểu hiện đầu tiên của sức sinh sản của người cha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: phải công nhận
  rationale: Dạng Hiphil của נכר ở đây chỉ việc chính thức thừa nhận địa vị pháp lý của người con đầu lòng; “phải công nhận” vừa tự nhiên vừa thể hiện tính bắt buộc của luật.
- source_word: הַבְּכֹר
  choice: người con đầu lòng
  rationale: Chỉ người con trai có địa vị trưởng nam trong luật thừa kế; cách dịch này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: con trai của người vợ không được yêu
  rationale: שְׂנוּאָה có thể mang nghĩa đen là “bị ghét”, nhưng trong thế đối lập hôn nhân tại đây có thể chỉ người vợ ít được yêu hơn hoặc không được yêu; bản dịch giữ được sắc thái quan hệ mà không cường điệu sự thù ghét.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: cho người ấy một phần gấp đôi
  rationale: Thành ngữ “miệng của hai” chỉ hai phần thừa kế, tức phần gấp đôi so với mỗi người con khác.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: trong mọi tài sản thuộc về mình
  rationale: Diễn đạt tự nhiên ý những gì được thấy là thuộc quyền sở hữu của người cha, tức toàn bộ di sản của ông.
- source_word: רֵאשִׁית אֹנוֹ
  choice: khởi đầu sức lực của ông
  rationale: Giữ tương đối sát ẩn dụ Hê-bơ-rơ về người con đầu tiên như biểu hiện ban đầu của sức sinh sản của người cha, đồng thời tránh giải thích quá mức ngay trong chính văn.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: quyền trưởng nam
  rationale: Chỉ quyền lợi pháp lý gắn với địa vị con trai đầu lòng; đây là cách diễn đạt ngắn gọn, quen thuộc trong văn cảnh thừa kế.
- source_word: כִּי ... כִּי
  choice: Nhưng ... vì
  rationale: כִּי thứ nhất mang sắc thái đối lập với lệnh cấm thiên vị ở câu trước; từ thứ hai nêu căn cứ cho quy định.
theological_decisions:
- issue: Sắc thái của שְׂנוּאָה trong bối cảnh luật hôn nhân và thừa kế
  choice: người vợ không được yêu
  alternative: người vợ bị ghét; người vợ ít được yêu hơn
  rationale: Tiếng Hê-bơ-rơ cho phép nghĩa mạnh “bị ghét”, nhưng trong sự đối lập với người vợ được yêu, từ này cũng có thể diễn tả địa vị kém được yêu chuộng hơn. Chính văn dùng cách nói tự nhiên, còn chú thích bảo tồn nghĩa đen và tính mơ hồ.
- issue: Ý nghĩa của רֵאשִׁית אֹנוֹ
  choice: khởi đầu sức lực của ông
  alternative: hoa trái đầu tiên của sinh lực ông; khởi đầu khả năng sinh sản của ông
  rationale: Cách dịch giữ hình ảnh và sự dè dặt của nguyên văn, không biến câu luật thành một khẳng định giáo lý về bản chất của quyền trưởng nam.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “người cha” để làm rõ chủ thể theo ngữ cảnh gần, “người ấy” để tránh lặp nặng nề, và “quyền trưởng nam” như thuật ngữ thừa kế súc tích. Mọi dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
