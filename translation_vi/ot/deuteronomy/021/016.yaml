source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: vi
  text: Vào ngày người ấy cho các con thừa hưởng những gì mình có, người ấy không được coi con trai của người vợ được yêu là con trưởng, ưu tiên hơn con trai của người vợ bị ghét[a], là con trưởng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người vợ không được yêu” hoặc “người vợ được yêu ít hơn.” Tiếng Hê-bơ-rơ theo nghĩa đen đối chiếu “được yêu” với “bị ghét,” nhưng trong bối cảnh luật gia đình, từ sau có thể chỉ người tương đối ít được yêu quý hơn chứ không nhất thiết là người bị căm ghét.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Vào ngày
  rationale: Mở đầu trường hợp luật định và giữ khung thời gian trang trọng của nguyên văn, đồng thời tự nhiên trong tiếng Việt.
- source_word: הַנְחִילוֹ אֶת בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: người ấy phân chia cho các con mình làm gia nghiệp những gì thuộc về mình
  rationale: Diễn đạt thể Hiphil của נחל theo nghĩa khiến các con được hưởng gia nghiệp, đồng thời giữ riêng đối tượng אֵת אֲשֶׁר יִהְיֶה לוֹ là toàn bộ những gì thuộc về người cha.
- source_word: לֹא יוּכַל
  choice: không được
  rationale: Trong văn cảnh luật pháp, cụm này nói đến điều không được phép làm, chứ không đơn thuần là thiếu khả năng.
- source_word: לְבַכֵּר
  choice: lập ... làm con trưởng
  rationale: Động từ Piel chỉ việc dành địa vị hoặc quyền trưởng nam cho một người; cách nói này gọn, tự nhiên và giữ sắc thái pháp lý.
- source_word: בֶּן הָאֲהוּבָה
  choice: con trai của người vợ được yêu
  rationale: Giữ nghĩa trực tiếp của phân từ bị động 'được yêu'; thêm 'vợ' theo văn cảnh luật về hai người vợ.
- source_word: עַל פְּנֵי
  choice: thay cho
  rationale: Trong sự đối chiếu pháp lý này, cụm từ biểu thị việc ưu tiên người này mà gạt quyền của người kia; 'thay cho' làm rõ quan hệ ấy trong tiếng Việt.
- source_word: בֶן הַשְּׂנוּאָה
  choice: con trai của người vợ bị ghét
  rationale: Giữ đối cực mạnh 'được yêu/bị ghét' của tiếng Hê-bơ-rơ trong chính văn, không tự ý làm nhẹ nghĩa.
- source_word: הַבְּכֹר
  choice: là người con trưởng
  rationale: Cụm cuối xác định con trai của người vợ bị ghét mới là con trưởng thực sự.
theological_decisions:
- issue: Cách thể hiện sự tương phản tình cảm giữa hai người vợ
  choice: Giữ 'người vợ được yêu' và 'người vợ bị ghét' trong chính văn
  alternative: '''người vợ được yêu ít hơn'' hoặc ''người vợ không được yêu'''
  rationale: Nguyên văn dùng cặp từ đối nghịch mạnh. Bản dịch giữ sự căng thẳng ấy, còn chú thích nêu khả năng đây là cách nói về mức độ được ưu ái tương đối trong bối cảnh gia đình.
- issue: Bản chất của hành vi bị cấm
  choice: Dịch theo nghĩa không được phép lập người con kia làm con trưởng
  alternative: 'Dịch như sự bất lực: ''không thể'''
  rationale: Văn cảnh là quy định về quyền thừa kế, nên đây là sự cấm đoán hay thiếu thẩm quyền pháp lý, không phải bất lực thực tế.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng 'người ấy' để tránh khẩu ngữ. Cấu trúc giữ riêng hành động cho hưởng gia nghiệp và đối tượng 'những gì thuộc về mình', đồng thời bảo tồn sự tương phản mạnh của nguyên văn.
