revisions:
- from: Vào ngày người ấy phân chia cho các con mình làm gia nghiệp những gì thuộc về mình, người ấy không được lập con trai của người vợ được yêu làm con trưởng thay cho con trai của người vợ bị ghét[a], là người con trưởng.
  to: Vào ngày người ấy cho các con thừa hưởng những gì mình có, người ấy không được coi con trai của người vợ được yêu là con trưởng, ưu tiên hơn con trai của người vợ bị ghét[a], là con trưởng.
  rationale: 'Chỉnh câu để tiếng Việt tự nhiên hơn, đồng thời giữ rõ hai yếu tố của nguyên văn: các con được thừa hưởng toàn bộ những gì người cha có, và người cha không được dành địa vị con trưởng cho con của người vợ được yêu trước con trai là con trưởng thật. Giữ nguyên cách dịch mạnh của cặp đối lập “được yêu/bị ghét” và chú thích bảo lưu khả năng sắc thái so sánh.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:50Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng tình huống luật pháp, đối tượng là toàn bộ tài sản của người cha, tính cấm đoán của לֹא יוּכַל, và việc người con của người vợ bị ghét mới là con trưởng. Tuy nhiên, “phân chia cho các con mình làm gia nghiệp những gì thuộc về mình” là cấu trúc tiếng Việt chưa tự nhiên và “lập ... làm con trưởng” có thể bị hiểu là thay đổi thứ tự sinh, thay vì trao địa vị/quyền trưởng nam.
  naturalness: Cần chỉnh nhẹ để câu văn luật pháp hiện đại, rõ ràng và trôi chảy hơn. “Cho các con thừa hưởng những gì mình có” diễn đạt tự nhiên thể khiến hưởng gia nghiệp mà không hàm ý phải chia đều. “Coi ... là con trưởng, ưu tiên hơn ...” làm rõ việc dành ưu tiên pháp lý mà vẫn không thêm chi tiết về phần thừa kế.
  terminology: Giữ “con trưởng” cho הַבְּכֹר và giữ cặp “người vợ được yêu / người vợ bị ghét” theo đối cực nguyên văn. Chú thích về khả năng nghĩa so sánh của “bị ghét” là phù hợp và được giữ nguyên về nội dung.
  issues:
  - severity: medium
    issue: Cụm “phân chia cho các con mình làm gia nghiệp những gì thuộc về mình” thiếu tự nhiên.
    rationale: Trật tự và kết hợp từ “phân chia ... làm gia nghiệp” gượng trong tiếng Việt hiện đại. Hơn nữa, “phân chia” có thể gợi một sự phân bổ xác định, trong khi nguyên văn nói khái quát về lúc người cha khiến các con thừa hưởng tài sản mình có.
  - severity: low
    issue: “Lập ... làm con trưởng thay cho” có thể gợi việc đổi thứ tự sinh.
    rationale: Ngữ cảnh nói đến việc không được dành địa vị hoặc quyền của con trưởng cho người con được ưu ái. “Coi ... là con trưởng, ưu tiên hơn ...” diễn đạt trực tiếp hơn quan hệ ưu tiên của עַל־פְּנֵי.
  revised_text: Vào ngày người ấy cho các con thừa hưởng những gì mình có, người ấy không được coi con trai của người vợ được yêu là con trưởng, ưu tiên hơn con trai của người vợ bị ghét[a], là con trưởng.
