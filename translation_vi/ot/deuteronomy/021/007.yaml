base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: vi
  text: 'Rồi họ phải đáp và nói: “Tay chúng tôi không làm đổ máu này[a], và mắt chúng tôi không thấy việc ấy[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “máu này”; đây là cách nói pháp lý nhằm phủ nhận trách nhiệm về cái chết ấy.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “không chứng kiến việc ấy.” Cách nói “mắt chúng tôi không thấy” phủ nhận rằng họ có hiểu biết với tư cách nhân chứng trực tiếp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: Rồi họ phải đáp và nói
  rationale: Giữ cả hai động từ trong công thức tuyên bố pháp lý. “Rồi” thể hiện diễn tiến của nghi thức, còn “phải” chuyển tải sắc thái quy định của mệnh đề.
- source_word: יָדֵינוּ
  choice: Tay chúng tôi
  rationale: Giữ hình ảnh bộ phận cơ thể của nguyên văn; “tay” biểu thị vai trò trực tiếp và trách nhiệm trong việc gây đổ máu.
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: không làm đổ máu này
  rationale: Cụm שפך דם là thành ngữ thông dụng chỉ việc làm đổ máu hay giết người. Bản dịch vẫn giữ cách diễn đạt cụ thể “máu này” thay vì giải nghĩa thành “vụ giết người này”.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: và mắt chúng tôi không thấy việc ấy
  rationale: Giữ hình ảnh cụ thể “mắt chúng tôi”; thêm “việc ấy” để câu tiếng Việt trọn nghĩa, chỉ sự việc vừa được phủ nhận mà không thu hẹp nghĩa thành một cách giải thích duy nhất.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp với lời tuyên bố trong một thủ tục pháp lý. Giữ hình ảnh “tay” và “mắt” của nguyên văn, đồng thời dùng cú pháp tự nhiên đối với độc giả Việt Nam hiện đại.
