  text: כִּֽי תֵצֵ֥א לַ/מִּלְחָמָ֖ה עַל אֹיְבֶ֑י/ךָ וּ/נְתָנ֞/וֹ יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/יָדֶ֖/ךָ וְ/שָׁבִ֥יתָ שִׁבְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: vi
  text: Khi ngươi ra trận chống lại các kẻ thù của ngươi, và Yahweh, Đức Chúa Trời của ngươi, trao chúng vào tay ngươi[a], rồi ngươi bắt các tù binh của chúng[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hebrew dùng hậu tố số ít: “trao người ấy/nó vào tay ngươi.” Hậu tố này có lẽ chỉ chung lực lượng kẻ thù, nên bản dịch dùng “chúng”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “rồi ngươi bắt tù binh từ chúng.” Hebrew dùng một động từ và một danh từ cùng gốc để diễn tả việc bắt tù binh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong điều luật theo tình huống này, כִּי mở đầu hoàn cảnh giả định có thể xảy ra; “khi” tự nhiên hơn “nếu” mà vẫn giữ sắc thái pháp luật của câu.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: anh em ra trận
  rationale: Cụm này nói theo nghĩa đen là “đi ra để chiến tranh”; “ra trận” là cách diễn đạt tự nhiên, gọn và đúng ngữ cảnh quân sự trong tiếng Việt hiện đại.
- source_word: עַל אֹיְבֶיךָ
  choice: chống lại các kẻ thù mình
  rationale: עַל đi với hành động thù địch mang nghĩa “chống lại”; dạng số nhiều אֹיְבֶיךָ chỉ các kẻ thù của người được nói tới.
- source_word: וּנְתָנוֹ
  choice: trao chúng
  rationale: Động từ נתן có nghĩa cơ bản là “trao, giao”. Hậu tố Hebrew ở số ít nhưng nhiều khả năng quy chiếu tập thể về lực lượng kẻ thù số nhiều, nên tiếng Việt dùng “chúng” cho tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Chuyển tải trực tiếp danh từ אֱלֹהִים cùng hậu tố ngôi hai số ít trong công thức giao ước.
- source_word: בְּיָדֶךָ
  choice: vào tay anh em
  rationale: Giữ hình ảnh Hebrew chỉ việc đặt đối phương dưới quyền kiểm soát của người được nói tới; thành ngữ này vẫn dễ hiểu trong tiếng Việt.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: rồi anh em bắt tù binh của chúng
  rationale: Giữ được ý bắt người của phía bại trận làm tù binh và phần nào phản ánh kết cấu động từ–danh từ cùng gốc trong Hebrew, đồng thời vẫn đọc tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tư cách tên riêng, không thay nó bằng tước hiệu và cũng không khẳng định quá mức cách phát âm truyền thống “Giê-hô-va”.
- issue: Chủ thể trao kẻ thù vào tay Israel
  choice: Yahweh, Đức Chúa Trời của anh em, trao chúng vào tay anh em
  alternative: Yahweh cho anh em chiến thắng chúng
  rationale: Giữ nguyên hình ảnh thần học và thành ngữ “trao vào tay” của bản Hebrew, thay vì diễn giải rõ thành “cho chiến thắng”.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Anh em” được dùng làm đại từ ngôi hai trong lời luật truyền cho từng người thuộc cộng đồng Israel, tránh sắc thái cổ của “ngươi”. Câu giữ dấu phẩy cuối vì đây là mệnh đề mở đầu, tiếp nối sang câu sau.
