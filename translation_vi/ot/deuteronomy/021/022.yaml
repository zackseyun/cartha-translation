source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֣ה בְ/אִ֗ישׁ חֵ֛טְא מִשְׁפַּט מָ֖וֶת וְ/הוּמָ֑ת וְ/תָלִ֥יתָ אֹת֖/וֹ עַל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: vi
  text: Nếu một người phạm tội phải chịu án tử hình[a], và người ấy bị xử tử, thì phải treo người ấy trên cây[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phạm tội đáng chết,” “phạm tội đáng bị xử tử,” hoặc “phạm tội chịu án tử hình.” Theo sát chữ, cụm Hê-bơ-rơ là “một tội [có] phán quyết sự chết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trên cọc.” Tiếng Hê-bơ-rơ theo sát chữ là “trên cây.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Nếu
  rationale: Mở đầu một trường hợp luật định có điều kiện; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ.
- source_word: יִהְיֶה בְ/אִישׁ חֵטְא
  choice: một người mắc tội
  rationale: Diễn đạt tự nhiên thành ngữ tồn tại của tiếng Hê-bơ-rơ, đồng thời giữ chủ thể số ít và ý nghĩa đạo đức-pháp lý của חֵטְא.
- source_word: מִשְׁפַּט מָוֶת
  choice: đáng chết
  rationale: Truyền đạt cô đọng rằng tội ấy chịu án tử hình, nhưng chú thích bảo lưu nghĩa sát chữ và khả năng hiểu theo phán quyết.
- source_word: וְ/הוּמָת
  choice: và người ấy bị xử tử
  rationale: Thể bị động của מות nằm trong bối cảnh tư pháp; “bị xử tử” rõ và tự nhiên hơn “bị làm cho chết”.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: rồi anh em treo người ấy
  rationale: תלה là treo; “rồi” thể hiện bước tiếp theo sau khi người ấy đã bị xử tử. “Anh em” là cách xưng hô cộng đồng quen thuộc trong Phục Truyền Luật Lệ Ký.
- source_word: עַל עֵץ
  choice: trên cây
  rationale: Giữ nghĩa trực tiếp của עֵץ và tiếng vọng liên văn bản, không thu hẹp thành một dụng cụ cụ thể.
theological_decisions:
- issue: Chủ thể pháp lý mang giới tính
  choice: một người
  alternative: một người đàn ông
  rationale: Trong văn phong luật Hê-bơ-rơ, אִישׁ có thể chỉ một cá nhân thuộc cộng đồng; “một người” là tiếng Việt tự nhiên và không phủ nhận rằng hình thức nguồn là giống đực.
- issue: Ý nghĩa của מִשְׁפַּט מָוֶת
  choice: đáng chết
  alternative: chịu án tử hình
  rationale: Cụm nguồn có thể nhấn vào tính đáng chịu chết hoặc phán quyết tử hình; bản văn chính chọn cách tự nhiên, còn chú thích bảo lưu độ rộng nghĩa.
- issue: Cách hiểu עַל עֵץ
  choice: trên cây
  alternative: trên cọc
  rationale: Giữ cách nói của nguyên văn và ý nghĩa liên văn bản mà không quyết định hình dạng cụ thể của vật dùng để treo.
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại. Câu được để mở bằng dấu phẩy vì đây là phần đầu của quy định tiếp tục ở câu 23. Dùng “anh em” cho ngôi thứ hai số ít mang tính đại diện trong lời Môi-se nói với cộng đồng Y-sơ-ra-ên.
