revisions:
- from: Nếu một người mắc tội đáng chết[a], và người ấy bị xử tử, rồi anh em treo người ấy trên cây[b],
  to: Nếu một người phạm tội phải chịu án tử hình[a], và người ấy bị xử tử, thì phải treo người ấy trên cây[b],
  rationale: Sửa cách xưng hô “anh em” thành lối mệnh lệnh pháp quy vô nhân xưng để không thêm chủ thể số nhiều vào nguyên văn. Đồng thời làm rõ ý tội có án phạt tử hình và chỉnh chú thích a cho tự nhiên, chính xác hơn, trong khi vẫn bảo lưu các khả năng từ vựng và giữ “trên cây.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:56Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch diễn đạt đúng điều kiện pháp lý, việc người phạm tội bị xử tử, và việc treo người ấy trên cây. Tuy nhiên, “anh em” thêm một chủ thể số nhiều/cách xưng hô cộng đồng không có trong động từ Hê-bơ-rơ ngôi hai số ít; nên chuyển sang lối mệnh lệnh pháp quy vô nhân xưng trong tiếng Việt. Cụm “phạm tội phải chịu án tử hình” diễn đạt rõ hơn quan hệ giữa tội và án phạt trong מִשְׁפַּט מָוֶת.
  naturalness: Câu sửa giữ văn phong luật định hiện đại, tự nhiên, và vẫn để ngỏ bằng dấu phẩy vì quy định tiếp tục sang câu 23. “Phải treo” là cách Việt ngữ pháp quy tự nhiên hơn “anh em treo.”
  terminology: “Án tử hình,” “bị xử tử,” và “trên cây” phù hợp ngữ cảnh pháp lý và từ vựng nguồn. Giữ “trên cây,” không xác định quá mức là một loại dụng cụ hành hình. Chú thích a được chỉnh để giải thích cấu trúc Hê-bơ-rơ bằng tiếng Việt rõ ràng hơn.
  issues:
  - severity: medium
    issue: “anh em” cho động từ וְתָלִיתָ
    rationale: Nguyên văn dùng ngôi thứ hai giống đực số ít trong công thức luật, không nêu “anh em” hay một chủ thể số nhiều. Lối vô nhân xưng “phải treo” truyền đạt chức năng mệnh lệnh pháp quy mà không thêm cách xưng hô.
  - severity: low
    issue: 'Chú thích a: “một tội/phán quyết của sự chết”'
    rationale: Cách diễn đạt này khó hiểu trong tiếng Việt và có thể làm mờ quan hệ construct giữa “tội” và “phán quyết/sự chết.” Cần chú thích sát chữ nhưng sáng rõ hơn.
