  terminology: “Yahweh,” “Đức Chúa Trời,” “thầy tế lễ,” “phụng sự,” và “chúc phước nhân danh” nhất quán với sắc thái Kinh Thánh và với danh riêng trong nguyên văn. Cần chỉnh chú thích vì cụm đối chiếu với “hành hung” không phục vụ bản dịch đang dùng “thương tích” và có thể gây nhầm rằng từ gốc tự nó chỉ hành vi hành hung.
