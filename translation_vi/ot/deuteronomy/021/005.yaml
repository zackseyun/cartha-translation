  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: vi
  text: Các thầy tế lễ, là con cháu Lê-vi, phải tiến đến, vì Yahweh, Đức Chúa Trời của anh em, đã chọn họ để phụng sự Ngài và chúc phước nhân danh Yahweh. Theo lời họ, mọi vụ tranh chấp và mọi trường hợp thương tích[a] sẽ được phân xử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tổn hại”, “vết đánh” hoặc “tai họa”. Từ Hê-bơ-rơ có nghĩa rộng; trong bối cảnh pháp lý này, có lẽ nói đến những trường hợp liên quan đến tổn thương thân thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: phải tiến đến
  rationale: Diễn tả việc các thầy tế lễ bước ra để chính thức tham gia nghi thức pháp lý; tự nhiên hơn cách dịch sát là “đến gần”.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: các thầy tế lễ, là con cháu Lê-vi
  rationale: Giữ quan hệ đồng vị của nguyên văn, đồng thời dùng cách nói tiếng Việt rõ ràng, tự nhiên.
- source_word: כִּי בָם בָּחַר
  choice: vì ... đã chọn họ
  rationale: כִּי nêu lý do cho vai trò của các thầy tế lễ; thì hoàn thành chỉ hành động lựa chọn đã xảy ra và vẫn có hiệu lực.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ danh giao ước Yahweh và chuyển đại từ số ít tập thể sang “anh em”, cách xưng hô tự nhiên trong mạch luật pháp dành cho dân Israel.
- source_word: לְשָׁרְתוֹ
  choice: để phụng sự Ngài
  rationale: Trong bối cảnh tế lễ, שׁרת nói đến sự phục vụ thánh; “phụng sự” giữ được sắc thái trang trọng này.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: và chúc phước nhân danh Yahweh
  rationale: Diễn đạt trực tiếp việc ban lời chúc phước dưới thẩm quyền của danh Yahweh.
- source_word: וְעַל פִּיהֶם
  choice: theo lời họ
  rationale: Giữ hình ảnh phát ngôn trong thành ngữ Hê-bơ-rơ “theo miệng họ” mà không diễn giải quá mức thành một cơ cấu xét xử cụ thể.
- source_word: יִהְיֶה
  choice: sẽ được phân xử
  rationale: Động từ “sẽ là” mang tính tỉnh lược trong nguyên văn; “sẽ được phân xử” làm rõ chức năng pháp lý mà ngữ cảnh đòi hỏi.
- source_word: כָּל רִיב
  choice: mọi vụ tranh chấp
  rationale: רִיב thường chỉ tranh chấp hay vụ kiện; “vụ tranh chấp” phù hợp bối cảnh pháp lý.
- source_word: וְכָל נָגַע
  choice: mọi trường hợp thương tích
  rationale: נֶגַע có nghĩa rộng như vết đánh, tổn thương hoặc tai họa; trong ngữ cảnh pháp lý này, “trường hợp thương tích” phù hợp nhưng không thu hẹp thành hành vi cố ý như “hành hung”.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi thẩm quyền của các thầy tế lễ trong mệnh đề cuối
  choice: theo lời họ ... sẽ được phân xử
  alternative: do họ toàn quyền quyết định
  rationale: Bản dịch thể hiện vai trò phán quyết theo câu chữ nhưng không suy diễn rằng họ có thẩm quyền tuyệt đối ngoài thủ tục được nêu trong văn mạch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc; dùng “anh em” cho đại từ số ít tập thể hướng đến dân Israel. Dấu chú thích [a] được đặt ngay sau từ ngữ mà chú thích giải thích.
