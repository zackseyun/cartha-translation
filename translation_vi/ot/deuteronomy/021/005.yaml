  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: các thầy tế lễ thuộc Lê-vi đến tham gia, Yahweh đã chọn họ để phụng sự Ngài và chúc phước nhân danh Ngài, và các tranh chấp cùng trường hợp thương tích được phân xử theo lời họ. “Theo lời họ” phản ánh sát thành ngữ עַל־פִּיהֶם mà không diễn giải quá mức. “Mọi trường hợp thương tích” là lựa chọn thận trọng cho נָגַע trong văn cảnh pháp lý.'
