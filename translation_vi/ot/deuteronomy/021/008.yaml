  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: vi
  text: “Lạy Yahweh, xin chuộc tội cho dân Ngài là Israel, dân mà Ngài đã cứu chuộc. Xin đừng để tội đổ máu người vô tội còn ở giữa dân Ngài là Israel.” Như vậy, tội đổ máu ấy sẽ được chuộc cho họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “máu ấy sẽ được chuộc cho họ.” Trong tiếng Hê-bơ-rơ, “máu” ở đây là cách nói pháp lý về trách nhiệm do việc làm đổ máu gây ra.'
    reason: Bảo lưu cách diễn đạt sát chữ của הַדָּם và giải thích nghĩa pháp lý mà bản chính diễn đạt là “tội đổ máu”.
lexical_decisions:
- source_word: כַּפֵּר
  choice: xin chuộc tội cho
  rationale: Giữ ý nghĩa tế tự–pháp lý của כפר, đồng thời dùng cách diễn đạt quen thuộc và trang trọng trong tiếng Việt. “Tha tội” sẽ thu hẹp nghĩa sang sự tha thứ đơn thuần.
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: cho dân Ngài là Israel
  rationale: לְ đánh dấu đối tượng được hưởng sự chuộc tội; cấu trúc “dân Ngài là Israel” làm rõ Israel đồng vị với “dân Ngài” và tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: dân mà Ngài đã cứu chuộc
  rationale: פדה mang ý nghĩa giải cứu bằng cách chuộc; “cứu chuộc” bảo toàn cả phương diện giải thoát lẫn ngôn ngữ giao ước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu. Hô cách được thể hiện tự nhiên bằng “Lạy Yahweh”.
- source_word: וְאַל תִּתֵּן דָּם נָקִי
  choice: Xin đừng để tội làm đổ máu người vô tội còn
  rationale: Trong ngữ cảnh pháp lý về một vụ giết người chưa tìm ra thủ phạm, “máu vô tội” chỉ trách nhiệm phát sinh do làm đổ máu người vô tội. Cách dịch này diễn đạt rõ ý nghĩa pháp lý của thành ngữ mà không hiểu là chính chất máu được đặt ở đâu đó.
- source_word: בְּקֶרֶב עַמְּךָ יִשְׂרָאֵל
  choice: ở giữa dân Ngài là Israel
  rationale: Giữ hình ảnh không gian–cộng đồng của בְּקֶרֶב, đồng thời phù hợp với văn phong cầu nguyện trang trọng.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: Như vậy, tội đổ máu ấy sẽ được chuộc cho họ
  rationale: Dạng Niphal được thể hiện bằng cấu trúc bị động “sẽ được chuộc”; “như vậy” nêu quan hệ kết quả. “Tội đổ máu” chuyển tải nghĩa pháp lý của הַדָּם, còn cách nói sát chữ được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản nguồn dùng danh riêng YHWH. “Yahweh” bảo toàn chức năng danh riêng và tránh thay nó bằng tước hiệu hay dùng lối phiên âm dựa trên cách đọc ghép về sau.
- issue: Ý nghĩa của הַדָּם trong mệnh đề cuối
  choice: tội đổ máu ấy
  alternative: máu ấy
  rationale: Ngữ cảnh nói về trách nhiệm cộng đồng đối với một vụ đổ máu chưa được giải quyết. Bản chính làm rõ nghĩa pháp lý, còn chú thích bảo lưu cách diễn đạt sát mặt chữ và sự căng nghĩa của nguyên văn.
- issue: Tác dụng của כּפר
  choice: chuộc tội
  alternative: tha tội / thanh tẩy
  rationale: “Chuộc tội” giữ được sự giao thoa giữa nghi thức và trách nhiệm pháp lý trong phân đoạn, không giản lược hành động thành sự tha thứ nội tâm hay thanh tẩy nghi lễ בלבד.
translation_notes:
  register: Văn phong cầu nguyện trang trọng nhưng hiện đại; dùng “Ngài” để xưng hô trực tiếp với Yahweh. Chia lời cầu nguyện và lời kết quả thành các câu riêng để người đọc phổ thông dễ theo dõi. Thuật ngữ “chuộc tội” được giữ nhất quán nhằm bảo toàn sắc thái tế tự–pháp lý.
