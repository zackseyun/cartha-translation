revisions:
- from: Nếu một người đàn ông có hai vợ, một người được yêu, còn người kia bị ghét[a], và cả người được yêu lẫn người bị ghét đều sinh con trai cho ông, nhưng con trai đầu lòng lại là con của người vợ bị ghét,
  to: Nếu một người đàn ông có hai vợ, một người vợ được yêu, người kia bị ghét[a], và cả người vợ được yêu lẫn người vợ bị ghét đều sinh cho ông những con trai, và con trai đầu lòng là con của người vợ bị ghét,
  rationale: Loại bỏ các từ nối mang tính diễn giải («nhưng», «lại»), làm rõ danh từ «người vợ», và giữ nguyên thuật ngữ chính cùng chú thích từ vựng. Dấu phẩy cuối câu được giữ vì đây là phần mở đầu của câu luật tiếp diễn sang câu sau.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng tình huống pháp luật: một người đàn ông có hai vợ, cả hai sinh các con trai, và con trai đầu lòng là con của người vợ bị ghét/không được yêu. Tuy nhiên, «nhưng» và «lại» thêm sắc thái đối lập mà liên từ וְ trong câu này không nhất thiết biểu thị.'
  naturalness: Cần nêu rõ «người vợ» ở vế đầu để câu tiếng Việt tự nhiên và nhất quán. «sinh cho ông những con trai» tự nhiên hơn «sinh con trai cho ông» trong cấu trúc có cả hai người vợ.
  terminology: «Bị ghét» là cách dịch sát nghĩa cơ bản của שְׂנוּאָה; chú thích giữ lựa chọn «không được yêu»/«ít được yêu hơn» để phản ánh sắc thái quan hệ tương đối có thể có trong ngữ cảnh này, không áp đặt một cách hiểu duy nhất.
  issues:
  - severity: medium
    issue: «nhưng ... lại»
    rationale: Nguyên văn nối các mệnh đề bằng וְ (“và”) trong việc trình bày điều kiện pháp lý. «Nhưng» và «lại» diễn giải một sự tương phản tu từ không được đánh dấu rõ trong tiếng Hê-bơ-rơ.
  - severity: low
    issue: Cụm «một người được yêu, còn người kia bị ghét»
    rationale: Dù có thể hiểu được từ «hai vợ», việc lặp «người vợ» giúp câu rõ và tự nhiên hơn trong tiếng Việt hiện đại.
  revised_text: Nếu một người đàn ông có hai vợ, một người vợ được yêu, người kia bị ghét[a], và cả người vợ được yêu lẫn người vợ bị ghét đều sinh cho ông những con trai, và con trai đầu lòng là con của người vợ bị ghét,
