id: DEU.21.15
reference: Deuteronomy 21:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: vi
  text: Nếu một người đàn ông có hai vợ, một người vợ được yêu, người kia bị ghét[a], và cả người vợ được yêu lẫn người vợ bị ghét đều sinh cho ông những con trai, và con trai đầu lòng là con của người vợ bị ghét,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không được yêu” hoặc “ít được yêu hơn”; từ Hê-bơ-rơ có thể mang nghĩa mạnh là “bị ghét”, nhưng trong bối cảnh này cũng có thể chỉ người vợ không được ưu ái so với người vợ được yêu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu một trường hợp luật theo thể điều kiện; “nếu” tự nhiên và phù hợp với văn phong luật pháp tiếng Việt.
- source_word: תִהְיֶיןָ לְאִישׁ
  choice: một người đàn ông có
  rationale: Chuyển cấu trúc tồn tại–sở hữu của tiếng Hê-bơ-rơ sang cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: שְׁתֵּי נָשִׁים
  choice: hai vợ
  rationale: Trong bối cảnh hôn nhân và quyền thừa kế, נָשִׁים chỉ những người vợ chứ không đơn thuần là hai phụ nữ.
- source_word: הָאַחַת אֲהוּבָה
  choice: một người được yêu
  rationale: Giữ trực tiếp nghĩa của phân từ bị động אֲהוּבָה, không diễn giải thành “được ưu ái”.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: còn người kia bị ghét
  rationale: Giữ nghĩa từ vựng mạnh và sự đối xứng yêu–ghét trong nguyên văn; chú thích nêu khả năng từ này chỉ người không được yêu hoặc không được ưu ái.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: đều sinh con trai cho ông
  rationale: בָנִים ở đây là các con trai, phù hợp với luật về con trai đầu lòng; “đều” làm rõ rằng cả hai người vợ đều sinh con.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר
  choice: nhưng con trai đầu lòng lại là
  rationale: “Nhưng… lại” diễn đạt tự nhiên tình huống tương phản dẫn đến vấn đề pháp lý, dù liên từ Hê-bơ-rơ theo nghĩa đen là “và”.
- source_word: לַשְּׂנִיאָה
  choice: con của người vợ bị ghét
  rationale: Diễn đạt quan hệ mẫu tử do giới từ לְ biểu thị theo cách rõ ràng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch שְׂנוּאָה trong bối cảnh luật gia đình
  choice: bị ghét
  alternative: không được yêu; ít được yêu hơn; không được ưu ái
  rationale: Từ Hê-bơ-rơ có nghĩa cơ bản mạnh là “bị ghét”. Bối cảnh có thể nói đến địa vị tương đối kém được yêu hoặc ưu ái, nhưng bản dịch chính giữ nguyên sức căng của cặp đối lập אֲהוּבָה–שְׂנוּאָה và ghi khả năng nhẹ hơn trong chú thích.
translation_notes:
  register: Văn phong luật pháp hiện đại, trang trọng nhưng dễ hiểu. Giữ câu chưa kết thúc bằng dấu phẩy vì câu luật tiếp tục ở câu kế tiếp. Dùng “bị ghét” trong bản văn để phản ánh sát đối lập từ vựng của nguyên ngữ, đồng thời bảo tồn sắc thái nhẹ hơn bằng chú thích.
