    rationale: Giới từ “về” trong tiếng Việt thường chỉ nội dung hay đề tài, trong khi cấu trúc Hê-bơ-rơ là “các tượng chạm của các thần của họ”. Sửa thành “những tượng chạm của các thần của họ” khôi phục quan hệ ngữ pháp và tự nhiên hơn.
