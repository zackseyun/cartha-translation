  to: Anh em phải phá đổ các bàn thờ của họ, đập tan các trụ đá thờ, dùng lửa thiêu các cột A-sê-ra[a] của họ, chặt đổ những tượng chạm của các thần của họ[b], và xóa sạch tên của chúng khỏi nơi ấy[c].
  rationale: Chỉ sửa cụm “tượng chạm về các thần của họ” thành “tượng chạm của các thần của họ” để diễn đạt chính xác quan hệ sở hữu trong nguyên văn và dùng tiếng Việt tự nhiên. Các phần khác, gồm sự hàm súc của “xóa sạch tên của chúng”, được giữ nguyên.
