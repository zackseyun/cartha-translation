base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: vi
  text: Anh em phải phá đổ các bàn thờ của họ, đập tan các trụ đá thờ, dùng lửa thiêu các cột A-sê-ra[a] của họ, chặt đổ những tượng chạm của các thần của họ[b], và xóa sạch tên của chúng khỏi nơi ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các A-sê-ra” hoặc “các cột thờ”. Từ Hê-bơ-rơ chỉ những vật thể tế tự gắn với A-sê-ra.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các thần tượng của họ”. Cụm từ Hê-bơ-rơ nhấn mạnh rằng đây là những hình tượng được chạm khắc, chế tác.
    reason: lexical_alternative
  - marker: c
    text: “Xóa sạch tên của chúng” có nghĩa là loại bỏ sự hiện diện được tưởng niệm và ký ức về các thần ấy khỏi nơi thờ tự đó.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם
  choice: phá đổ
  rationale: Diễn đạt tự nhiên hành động triệt hạ các công trình thờ tự, đồng thời giữ sức mạnh của động từ Hê-bơ-rơ.
- source_word: מִזְבּחֹתָם
  choice: các bàn thờ của họ
  rationale: Cách gọi thông dụng, rõ nghĩa của מִזְבֵּחַ; hậu tố số nhiều được thể hiện bằng “của họ”.
- source_word: שִׁבַּרְתֶּם
  choice: đập tan
  rationale: Thể hiện hành động đập vỡ mạnh và triệt để, phù hợp thể tăng cường của động từ.
- source_word: מַצֵּבֹתָם
  choice: các trụ đá thờ
  rationale: מַצֵּבָה chỉ những đá hoặc trụ dựng đứng có chức năng tế tự; “trụ đá thờ” vừa cụ thể vừa dễ hiểu.
- source_word: אֲשֵׁרֵיהֶם
  choice: các cột A-sê-ra của họ
  rationale: Giữ tên riêng A-sê-ra và cho biết đây là vật thể tế tự dạng cột, nhưng chú thích vẫn bảo lưu phạm vi nghĩa rộng hơn của thuật ngữ.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: dùng lửa thiêu
  rationale: Giữ yếu tố “bằng lửa” được nêu rõ trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: những tượng chạm về các thần của họ
  rationale: Bảo lưu đặc điểm được chế tác bằng cách chạm khắc thay vì khái quát hóa thành “thần tượng”; “về các thần” biểu đạt quan hệ giữa hình tượng và các thần.
- source_word: תְּגַדֵּעוּן
  choice: chặt đổ
  rationale: Động từ גדע diễn tả việc chặt cho đổ xuống; cách dịch này phù hợp với các vật thể tế tự có thể bị đốn hoặc chặt.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: xóa sạch tên của chúng
  rationale: Giữ hình ảnh nguyên văn về việc làm cho “tên” biến mất, đồng thời diễn đạt tự nhiên ý xóa bỏ sự hiện diện và ký ức tế tự.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: khỏi nơi ấy
  rationale: Cách diễn đạt ngắn gọn, tự nhiên và sát nghĩa của cụm giới từ chỉ sự loại bỏ khỏi địa điểm đang nói đến.
theological_decisions:
- issue: Cách dịch אֲשֵׁרֵיהֶם trong bối cảnh thờ phượng Ca-na-an
  choice: các cột A-sê-ra
  alternative: các A-sê-ra; các cột thờ
  rationale: Cách dịch này giữ nét đặc thù lịch sử-tôn giáo của tên A-sê-ra mà không đồng nhất dứt khoát vật thể với chính nữ thần; chú thích bảo lưu sự không chắc chắn về dạng chính xác của vật tế tự.
- issue: Cách dịch פְסִילֵי אֱלֹהֵיהֶם
  choice: những tượng chạm về các thần của họ
  alternative: các thần tượng của họ; những tượng chạm của các thần họ
  rationale: Nguyên văn nhấn mạnh tính chất được chế tác của các hình tượng. “Tượng chạm” giữ nét cụ thể ấy và tránh thay bằng một nhãn thần học khái quát hơn.
- issue: Ý nghĩa của thành ngữ “xóa sạch tên của chúng”
  choice: giữ thành ngữ trong chính văn và giải thích là xóa bỏ sự hiện diện cùng ký ức tế tự tại địa điểm ấy
  alternative: phá hủy danh tiếng của các thần; chỉ xóa tên được viết ra
  rationale: Trong ngữ cảnh, “tên” có thể đại diện cho sự hiện diện được tưởng niệm, việc cầu khấn và ký ức thờ tự. Giữ thành ngữ giúp bảo toàn tính hàm súc và sức căng của nguyên văn.
- issue: Đại từ trong “tên của chúng”
  choice: dùng “chúng” để hướng về các thần và các vật thờ vừa nêu
  alternative: dùng “họ”, có thể bị hiểu là các dân tộc sở hữu những nơi thờ tự
  rationale: Nguyên văn dùng hậu tố số nhiều có thể dựa vào ngữ cảnh để xác định đối tượng. Sự chuyển sang “chúng” giúp người đọc nhận ra trọng tâm là xóa bỏ tên của các thần ngoại giáo khỏi nơi thờ tự, nhưng chú thích vẫn giải thích ý niệm thay vì mở rộng chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Anh em phải” thể hiện mệnh lệnh dành cho cộng đồng Y-sơ-ra-ên số nhiều; chuỗi động từ mạnh giữ nhịp dồn dập của nguyên văn. Tên A-sê-ra được phiên âm theo cách quen thuộc trong tiếng Việt và được giải thích bằng chú thích.
