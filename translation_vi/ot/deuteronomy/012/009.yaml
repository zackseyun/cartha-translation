source:
  edition: WLC
  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: vi
  text: Vì anh em cho đến nay vẫn chưa đến nơi an nghỉ[a] và cơ nghiệp mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự an nghỉ.” Từ Hê-bơ-rơ מְנוּחָה có thể chỉ trạng thái an nghỉ hoặc một nơi để an nghỉ; trong bối cảnh về đất đai, nghĩa “nơi an nghỉ” được ưu tiên hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Liên từ này nêu lý do cho mệnh lệnh ở câu trước; “Vì” giữ rõ quan hệ nguyên nhân trong mạch văn.
- source_word: לֹא בָּאתֶם עַד עָתָּה
  choice: cho đến nay, anh em vẫn chưa đến
  rationale: Cách diễn đạt này chuyển tải tự nhiên ý phủ định kéo dài đến thời điểm hiện tại của לֹא ... עַד עָתָּה, đồng thời giữ nghĩa thông dụng “đến” của בוא.
- source_word: הַמְּנוּחָה
  choice: nơi an nghỉ
  rationale: Danh từ có thể chỉ trạng thái “sự an nghỉ” hoặc nơi chốn “nơi an nghỉ.” Trong bối cảnh dân Israel sắp vào đất, nghĩa nơi chốn phù hợp hơn, nhưng phương án trừu tượng được giữ trong chú thích.
- source_word: הַנַּחֲלָה
  choice: cơ nghiệp
  rationale: “Cơ nghiệp” diễn đạt một sản nghiệp được ban và thừa hưởng, thích hợp với miền đất Đức Chúa Trời cấp cho Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng tên riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: נֹתֵן
  choice: đang ban
  rationale: Thể phân từ trình bày việc ban cho như đang diễn tiến hoặc chắc chắn được thực hiện; “đang ban” giữ sắc thái này mà không biến nó thành thì tương lai đơn thuần.
- source_word: אֱלֹהֶיךָ ... לָךְ
  choice: Đức Chúa Trời của anh em ... cho anh em
  rationale: Các đại từ Hê-bơ-rơ ở số ít hướng đến Israel như một cộng đồng. Tiếng Việt dùng “anh em” để xưng hô tự nhiên với toàn dân trong ngữ cảnh này.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Bản văn dùng trực tiếp Tứ Tự Danh. Giữ “Yahweh” như một tên riêng giúp phân biệt danh giao ước này với tước hiệu אֱלֹהִים (“Đức Chúa Trời”) xuất hiện ngay sau đó.
- issue: Ý nghĩa của הַמְּנוּחָה
  choice: nơi an nghỉ
  alternative: sự an nghỉ
  rationale: Bối cảnh vào đất và cấu trúc song song với “cơ nghiệp” thiên về một đích đến cụ thể, nhưng từ Hê-bơ-rơ vẫn có thể mang nghĩa trạng thái an nghỉ; vì vậy không loại bỏ nghĩa ấy mà ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít mang nghĩa tập thể chỉ Israel; đặt cụm đồng vị “Đức Chúa Trời của anh em” giữa dấu phẩy để câu rõ nghĩa.
