    rationale: Vế “mỗi người...” mô tả thực trạng đang bị đối chiếu, nhưng nguyên văn không có từ tương đương “nghĩa là”. Dấu hai chấm hoặc sự nối tiếp trực tiếp giữ quan hệ mở hơn.
