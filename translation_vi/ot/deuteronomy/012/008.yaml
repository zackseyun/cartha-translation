  text: לֹ֣א תַעֲשׂ֔וּ/ן כְּ֠/כֹל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַ/יּ֑וֹם אִ֖ישׁ כָּל הַ/יָּשָׁ֥ר בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: vi
  text: 'Anh em không được làm theo tất cả những gì chúng ta đang làm tại đây hôm nay: mỗi người làm theo điều mình cho là đúng.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn có cấu trúc: “mỗi người, mọi điều đúng trong mắt mình.” Đây là lối nói phân phối: mỗi cá nhân hành động theo điều mình tự xét là đúng; “trong mắt mình” là thành ngữ chỉ sự phán đoán riêng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: Anh em không được làm
  rationale: Thể vị hoàn thành chưa trọn 2 số nhiều dưới phủ định mang lực cấm đoán/chỉ thị. “Không được làm” tự nhiên trong tiếng Việt và giữ sắc thái luật định.
- source_word: כְּכֹל אֲשֶׁר
  choice: như mọi điều
  rationale: Cụm so sánh chỉ cách thức và có כֹל; cách dịch này giữ được cả ý “như” lẫn phạm vi “mọi điều” mà vẫn tự nhiên.
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: chúng ta đang làm tại đây hôm nay
  rationale: Phân từ diễn tả hoạt động đang diễn ra; các trạng từ nơi chốn và thời gian được giữ rõ.
- source_word: אִישׁ
  choice: mỗi người
  rationale: Danh từ số ít giống đực được dùng theo nghĩa phân phối. Trong tiếng Việt, “mỗi người” truyền đạt chính xác chức năng đại diện mà không hàm ý chỉ nam giới.
- source_word: כָּל הַיָּשָׁר
  choice: bất cứ điều gì ... cho là đúng
  rationale: Cụm từ chỉ điều được đánh giá là ngay thẳng hoặc đúng. Kết hợp với thành ngữ “trong mắt mình”, tiếng Việt tự nhiên cần diễn đạt sự đánh giá chủ quan bằng “cho là đúng”.
- source_word: בְּעֵינָיו
  choice: mình cho là
  rationale: Nghĩa đen là “trong mắt người ấy”, một thành ngữ Hê-bơ-rơ chỉ sự phán đoán cá nhân. Cách diễn đạt này chuyển đúng nghĩa thành ngữ sang tiếng Việt hiện đại.
theological_decisions:
- issue: Cụm phân phối giống đực אִישׁ ... בְּעֵינָיו
  choice: mỗi người ... mình cho là đúng
  alternative: mỗi người nam ... đúng trong mắt mình
  rationale: Giống đực số ít ở đây có chức năng phân phối và đại diện cho từng cá nhân trong cộng đồng, không nhất thiết giới hạn mệnh lệnh vào nam giới. “Mỗi người” giữ phạm vi ấy trong tiếng Việt; chú thích nêu rõ hình thức nguyên văn.
- issue: Sắc thái của הַיָּשָׁר בְּעֵינָיו
  choice: điều gì mình cho là đúng
  alternative: điều gì đúng trong mắt mình
  rationale: Nguyên văn giữ căng thẳng giữa “đúng/ngay thẳng” và tiêu chuẩn đánh giá cá nhân. “Cho là đúng” làm rõ thành ngữ nhưng không khẳng định rằng hành động ấy thực sự đúng theo tiêu chuẩn của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều chỉ cộng đồng Israel; “chúng ta” giữ sự bao gồm của người nói trong אֲנַחְנוּ. Cụm “nghĩa là” làm rõ quan hệ giải thích/phân phối của vế cuối mà không thay đổi nội dung.
