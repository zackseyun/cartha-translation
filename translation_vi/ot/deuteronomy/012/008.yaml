revisions:
- from: Anh em không được làm như mọi điều chúng ta đang làm tại đây hôm nay, nghĩa là mỗi người làm bất cứ điều gì mình cho là đúng.[a]
  to: 'Anh em không được làm theo tất cả những gì chúng ta đang làm tại đây hôm nay: mỗi người làm theo điều mình cho là đúng.[a]'
  rationale: Bản sửa thay cách so sánh gượng bằng “làm theo tất cả những gì”, bỏ “nghĩa là” vì đó là sự giải thích thêm, và giữ vế cuối như mô tả phân phối về cách hành xử hiện tại. “Cho là đúng” chuyển thành ngữ בְּעֵינָיו một cách tự nhiên, đồng thời bảo toàn sắc thái rằng đây là đánh giá của từng người.
