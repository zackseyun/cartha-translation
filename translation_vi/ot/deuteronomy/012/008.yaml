review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý cấm đoán, hoạt động hiện tại tại đây hôm nay, và tiêu chuẩn phán đoán cá nhân. Tuy nhiên, “như mọi điều” không diễn đạt tự nhiên cấu trúc so sánh כְּכֹל אֲשֶׁר; “nghĩa là” thêm một quan hệ giải thích không được đánh dấu riêng trong nguyên văn. Cụm cuối nên được nối như sự mô tả cách hành xử hiện thời.
  naturalness: “Anh em không được làm như mọi điều...” gượng trong tiếng Việt hiện đại. “làm theo tất cả những gì...” tự nhiên hơn; “mỗi người làm theo điều mình cho là đúng” chuyển thành ngữ Hê-bơ-rơ sang tiếng Việt rõ ràng mà vẫn giữ sắc thái chủ quan.
  terminology: “Anh em” phù hợp với lời nói hướng đến cộng đồng Israel trong văn cảnh. “Mỗi người” phản ánh công dụng phân phối, đại diện của אִישׁ mà không áp đặt giới tính trong tiếng Việt. “Cho là đúng” phản ánh thành ngữ “đúng trong mắt mình” và không khẳng định hành vi thật sự đúng.
  issues:
