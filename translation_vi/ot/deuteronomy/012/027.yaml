  text: וְ/עָשִׂ֤יתָ עֹלֹתֶ֨י/ךָ֙ הַ/בָּשָׂ֣ר וְ/הַ/דָּ֔ם עַל מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/דַם זְבָחֶ֗י/ךָ יִשָּׁפֵךְ֙ עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הַ/בָּשָׂ֖ר תֹּאכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: vi
  text: Ngươi phải dâng các lễ toàn thiêu của ngươi—cả thịt lẫn huyết—trên bàn thờ của Yahweh, Đức Chúa Trời của ngươi. Huyết các tế lễ của ngươi phải được đổ trên bàn thờ của Yahweh, Đức Chúa Trời của ngươi, và ngươi sẽ ăn thịt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: anh phải dâng
  rationale: Động từ có nghĩa cơ bản là “làm”, nhưng khi đi với עֹלָה trong ngữ cảnh tế lễ thì chỉ việc thực hiện hay dâng lễ; “dâng” tự nhiên và chính xác trong tiếng Việt.
- source_word: עֹלֹתֶיךָ
  choice: các lễ toàn thiêu của mình
  rationale: עֹלָה là lễ vật được thiêu trọn trên bàn thờ. “Lễ toàn thiêu” là thuật ngữ rõ nghĩa, đồng thời phân biệt với những lễ chỉ thiêu một phần.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: cả thịt lẫn huyết
  rationale: Cụm này nêu hai thành phần của lễ toàn thiêu. “Huyết” giữ sắc thái trang trọng của luật tế lễ, còn cấu trúc “cả… lẫn…” diễn đạt tự nhiên việc cả hai đều được đặt trên bàn thờ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự phổ biến của יהוה, thay vì thay bằng một tước hiệu.
- source_word: וְדַם זְבָחֶיךָ
  choice: huyết của các sinh tế anh
  rationale: זֶבַח chỉ những con vật hay lễ vật được giết để hiến tế, thường có phần thịt người dâng được ăn. “Sinh tế” vừa gọn vừa giữ được ngữ cảnh nghi lễ.
- source_word: יִשָּׁפֵךְ
  choice: phải được đổ
  rationale: Dạng bị động mô tả cách xử lý huyết theo nghi thức. “Phải được đổ” thể hiện đúng tính quy định của luật.
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: còn thịt thì anh được ăn
  rationale: Trong ngữ cảnh đối lập cách xử lý huyết với thịt, câu này tự nhiên mang ý cho phép ăn thịt. “Còn… thì…” làm rõ sự tương phản mà không thay đổi nội dung.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo tồn tính chất danh riêng và không biến danh ấy thành một tước hiệu.
- issue: Sắc thái của וְהַבָּשָׂר תֹּאכֵל
  choice: còn thịt thì anh được ăn
  alternative: và anh sẽ ăn thịt; còn thịt thì anh phải ăn
  rationale: Hình thức Hê-bơ-rơ có thể được đọc như một lời chỉ dẫn trực tiếp, nhưng trong mạch luật này nó chủ yếu cho phép ăn thịt, trái với huyết phải đổ trên bàn thờ. Bản dịch chính giữ ý cho phép; chú thích bảo tồn cách dịch sát hình thức hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ “anh” để phản ánh lời nói ở ngôi thứ hai số ít trong bản Hê-bơ-rơ; dấu gạch ngang và dấu chấm phẩy giúp làm rõ cấu trúc nghi lễ mà không thêm nội dung.
