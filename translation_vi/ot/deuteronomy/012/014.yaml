source:
  edition: WLC
  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: vi
  text: Nhưng chỉ[a] tại nơi Yahweh sẽ chọn trong một bộ tộc của anh em[b], tại đó anh em phải dâng các của lễ thiêu của mình, và tại đó anh em phải làm mọi điều tôi truyền cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngoại trừ tại nơi Yahweh sẽ chọn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nguyên văn: “trong một bộ tộc của anh em”, nghĩa là trong phần lãnh thổ của một trong các bộ tộc Israel.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: nhưng chỉ
  rationale: Trong mạch văn tiếp nối lệnh cấm ở câu 13, thành ngữ này vừa nêu sự tương phản vừa giới hạn hành động vào một ngoại lệ duy nhất. “Nhưng chỉ” tự nhiên trong tiếng Việt và giữ được cả hai sắc thái.
- source_word: בַּמָּקוֹם
  choice: tại nơi
  rationale: Cụm từ chỉ địa điểm thờ phượng xác định do Đức Chúa Trời lựa chọn; “tại nơi” phù hợp với văn cảnh chỉ địa điểm.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: Yahweh sẽ chọn
  rationale: Dạng yiqtol có ý hướng tới việc lựa chọn trong tương lai. “Sẽ chọn” diễn đạt rõ nét nghĩa này, còn danh riêng יהוה được phiên âm là “Yahweh”.
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: trong một bộ tộc của anh em
  rationale: Bản dịch giữ cách diễn đạt gần nguyên văn “trong một bộ tộc của ngươi”, đồng thời dùng “anh em” để nói tự nhiên với cộng đồng Israel. Chú thích làm rõ rằng địa điểm nằm trong phần lãnh thổ của một bộ tộc.
- source_word: שָׁם
  choice: tại đó
  rationale: Giữ cả hai lần lặp lại của trạng từ nhằm nhấn mạnh địa điểm thờ phượng duy nhất được phép.
- source_word: תַּעֲלֶה
  choice: phải dâng
  rationale: Hiphil của עלה khi đi với עֹלָה là cách nói chuyên biệt về việc dâng sinh tế. “Phải dâng” vừa tự nhiên vừa thể hiện lực mệnh lệnh trong ngữ cảnh.
- source_word: עֹלֹתֶיךָ
  choice: các lễ thiêu của mình
  rationale: עֹלָה là thuật ngữ chỉ sinh tế được thiêu trọn. “Lễ thiêu” là cách gọi ngắn gọn, rõ nghĩa trong tiếng Việt; “của mình” phản ánh hậu tố sở hữu ngôi thứ hai.
- source_word: תַּעֲשֶׂה
  choice: phải làm
  rationale: עשה có nghĩa rộng là “làm, thực hiện”; “phải làm” giữ nghĩa cơ bản và biểu đạt lực truyền lệnh.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: mọi điều tôi truyền cho anh em
  rationale: Cách dịch này truyền đạt đầy đủ phạm vi “mọi điều” và công thức truyền lệnh đang được Môi-se công bố, nhưng tránh lối diễn đạt tiếp diễn gượng gạo trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” phân biệt danh riêng này với tước hiệu “Chúa” và không thêm một cách giải thích thần học vào câu.
- issue: Ý nghĩa của בְּאַחַד שְׁבָטֶיךָ
  choice: Giữ “trong một bộ tộc của anh em” trong chính văn và giải thích yếu tố lãnh thổ ở chú thích
  alternative: Dịch diễn giải là “trong lãnh thổ của một bộ tộc của anh em”
  rationale: “Bộ tộc” là hình thức trực tiếp của שֵׁבֶט, nhưng trong ngữ cảnh địa lý, cụm này có thể chỉ vùng đất thuộc bộ tộc ấy. Giữ nguyên cách nói trong chính văn bảo toàn sắc thái xã hội-giao ước, còn chú thích giúp người đọc hiểu ý địa lý mà không khóa chặt chính văn vào một cách diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng như cách xưng hô tập thể với Israel, dù các hình thức ngôi thứ hai trong tiếng Hê-bơ-rơ ở câu này là số ít. Cấu trúc lặp “tại đó … và tại đó …” được giữ để bảo toàn điểm nhấn của nguyên văn.
