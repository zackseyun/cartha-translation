source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: vi
  text: 'Bấy giờ, tại nơi mà Yahweh, Đức Chúa Trời của anh em, sẽ chọn để danh Ngài ngự tại đó[a], anh em phải đem đến mọi điều tôi đang truyền cho anh em: các lễ vật thiêu, các sinh tế, các phần mười, lễ vật do tay anh em dâng lên, cùng mọi lời khấn tốt nhất của anh em mà anh em khấn với Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “để Ngài làm cho danh Ngài ngự tại đó.”'
    reason: Bảo tồn sắc thái tác khiến của động từ Hiphil לְשַׁכֵּן.
lexical_decisions:
- source_word: וְהָיָה
  choice: Bấy giờ
  rationale: Diễn tả tự nhiên sự chuyển tiếp đến hoàn cảnh tương lai phát sinh từ các chỉ dẫn trước đó.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: nơi mà ... sẽ chọn
  rationale: Giữ trọng tâm về một địa điểm cụ thể và tính hướng tới tương lai của động từ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để danh Ngài ngự tại đó
  rationale: Giữ hình ảnh 'danh' ngự tại nơi được chọn, đồng thời diễn đạt tự nhiên bằng tiếng Việt; sắc thái tác khiến được ghi ở chú thích.
- source_word: שָׁמָּה תָבִיאוּ
  choice: chính nơi ấy, anh em phải đem đến
  rationale: Giữ lực chỉ hướng của שָׁמָּה và tính mệnh lệnh của תָבִיאוּ.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: mọi thứ tôi đang truyền cho anh em
  rationale: Phản ánh sắc thái đang diễn ra của phân từ מְצַוֶּה và giữ lời nói trực tiếp của Môi-se.
- source_word: עוֹלֹתֵיכֶם
  choice: các lễ vật thiêu
  rationale: Thuật ngữ chỉ những lễ vật được thiêu trọn; cách gọi rõ nghĩa và trang trọng.
- source_word: זִבְחֵיכֶם
  choice: các sinh tế
  rationale: Giữ nghĩa rộng của danh từ chỉ các tế lễ, không thu hẹp thành một loại sinh tế cụ thể.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: các phần mười
  rationale: Diễn đạt trực tiếp các khoản dâng bằng một phần mười.
- source_word: תְרֻמַת יֶדְכֶם
  choice: lễ vật do tay anh em dâng lên
  rationale: Giữ thành tố cụ thể 'tay anh em' và ý nghĩa một phần đóng góp được dâng lên.
- source_word: כֹל מִבְחַר נִדְרֵיכֶם
  choice: mọi lễ vật tốt nhất trong những điều anh em khấn nguyện dâng
  rationale: מִבְחַר chỉ phần tuyển chọn hoặc tốt nhất; trong ngữ cảnh danh sách lễ vật, bản dịch làm rõ rằng những điều khấn nguyện được mang đến dâng nhưng không giới hạn chúng thành một loại tế lễ riêng.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng; phiên âm Yahweh bảo tồn điều đó mà không thay bằng tước hiệu.
- issue: Thần học về 'danh' trong לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: để danh Ngài ngự tại đó
  alternative: để Ngài khiến danh mình ngự tại đó / để đặt danh Ngài tại đó
  rationale: Bản chính giữ hình ảnh danh Ngài 'ngự' và không đồng nhất sự hiện diện toàn thể của Đức Chúa Trời với một địa điểm; chú thích bảo tồn sắc thái tác khiến của dạng Hiphil.
- issue: Ý nghĩa của נִדְרֵיכֶם trong danh sách lễ vật
  choice: những điều anh em khấn nguyện dâng
  alternative: các lời khấn nguyện của anh em
  rationale: Cách dịch chính phù hợp với hành động 'đem đến' trong ngữ cảnh mà vẫn giữ mối liên hệ trực tiếp với lời khấn, không xác định một loại tế lễ giáo phái riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều được nói trực tiếp; dùng “Ngài” để quy chiếu về Yahweh. Thuật ngữ tế lễ được chọn theo hướng rõ nghĩa nhưng không quá cổ hoặc quá chuyên biệt.
