source:
  edition: WLC
  text: לֹ֖א תֹּאכְלֶ֑/נּוּ עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/024.yaml
  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: vi
  text: Không được ăn nó[a]; phải đổ nó xuống đất như nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nó” tức là huyết của con vật được nói đến trong văn cảnh xung quanh.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Diễn đạt tự nhiên một lệnh cấm trong tiếng Việt hiện đại, phù hợp văn phong luật lệ.
- source_word: תֹּאכְלֶנּוּ
  choice: ăn nó
  rationale: Động từ Qal chưa hoàn thành ngôi hai số ít kèm hậu tố tân ngữ ngôi ba giống đực số ít; trong ngữ cảnh này mang chức năng cấm đoán. Giữ đại từ “nó” thay vì lặp lại “huyết” để phản ánh cấu trúc Hê-bơ-rơ.
- source_word: עַל הָאָרֶץ
  choice: xuống đất
  rationale: Trong chỉ dẫn cụ thể này, הָאָרֶץ chỉ mặt đất. Với động từ “đổ”, “xuống đất” là cách nói tự nhiên trong tiếng Việt.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: phải đổ nó
  rationale: Động từ Qal chưa hoàn thành ngôi hai số ít kèm hậu tố tân ngữ, ở đây nêu hành động bắt buộc để xử lý huyết. “Phải đổ” giữ sắc thái mệnh lệnh pháp lý.
- source_word: כַּמָּיִם
  choice: như nước
  rationale: Giữ nguyên phép so sánh về cách đổ huyết, đồng thời tự nhiên và rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được các hậu tố đại từ chỉ đến
  choice: Giữ đại từ “nó” trong chính văn; chú thích xác định đó là huyết được nói đến trong văn cảnh.
  alternative: Nói rõ “huyết ấy” ngay trong chính văn.
  rationale: Bản Hê-bơ-rơ dùng hậu tố đại từ chứ không lặp lại danh từ “huyết”. Cách dịch này giữ cấu trúc nguồn và tránh đưa phần giải thích theo văn cảnh vào chính văn.
translation_notes:
  register: Văn phong luật lệ, trang trọng nhưng hiện đại. Lược chủ ngữ như trong mệnh lệnh tiếng Việt để tránh dùng “ngươi” cổ kính hoặc thêm một đại từ số nhiều không có trong hình thái Hê-bơ-rơ.
