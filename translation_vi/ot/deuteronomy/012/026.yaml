id: DEU.12.26
reference: Deuteronomy 12:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: vi
  text: Nhưng riêng những vật thánh thuộc về anh em và những gì anh em đã khấn nguyện[a], anh em phải mang theo và đến nơi Yahweh sẽ chọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “những lời khấn nguyện của anh em”; trong bối cảnh dâng tế lễ, cụm từ này cũng có thể chỉ những lễ vật được đem dâng để thực hiện các lời khấn ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nhưng riêng
  rationale: Vừa giữ sắc thái đối lập với quyền được giết và ăn thịt tại địa phương trong các câu trước, vừa diễn đạt sự giới hạn hay ngoại lệ.
- source_word: קָדָשֶׁיךָ אֲשֶׁר יִהְיוּ לְךָ
  choice: những vật thánh thuộc về anh em
  rationale: “Vật thánh” giữ phạm vi rộng của danh từ chỉ những gì được biệt riêng làm thánh, không thu hẹp thành một loại tế lễ cụ thể; “thuộc về anh em” chuyển đạt quan hệ sở hữu hoặc trách nhiệm trong mệnh đề Hebrew.
- source_word: וּנְדָרֶיךָ
  choice: và những gì anh em đã khấn nguyện[a]
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt và vẫn để ngỏ việc từ Hebrew chỉ chính lời khấn hay những lễ vật phải dâng để thực hiện lời khấn; chú thích ghi rõ khả năng từ vựng.
- source_word: תִּשָּׂא וּבָאתָ
  choice: anh em phải mang theo và đến
  rationale: 'Giữ hai hành động nối tiếp trong Hebrew: mang các vật thánh và đến địa điểm được chỉ định, thay vì gộp cả hai thành một động từ “đem đến”.'
- source_word: הַמָּקוֹם
  choice: nơi
  rationale: Diễn đạt tự nhiên công thức đặc trưng của Phục Truyền Luật Lệ Ký về địa điểm thờ phượng trung tâm mà Yahweh sẽ chọn.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: Yahweh sẽ chọn
  rationale: Thể chưa hoàn thành có ý hướng về tương lai trong công thức này; danh riêng giao ước יְהוָה được phiên là “Yahweh”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hebrew dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Nghĩa của וּנְדָרֶיךָ trong bối cảnh tế tự
  choice: những gì anh em đã khấn nguyện
  alternative: những lời khấn nguyện của anh em; những lễ vật đã khấn dâng của anh em
  rationale: Bản dịch chính tránh quyết định dứt khoát rằng từ này chỉ lời khấn hay lễ vật thực hiện lời khấn, nhờ đó bảo tồn độ mở của Hebrew trong bối cảnh dâng lễ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “anh em” chuyển số ít giống đực trong Hebrew theo chức năng đại diện cho cộng đồng giao ước, phù hợp cách xưng hô tự nhiên trong văn mệnh lệnh tiếng Việt. Cấu trúc “mang theo và đến” hơi sát nguyên văn nhưng vẫn rõ nghĩa, đồng thời bảo tồn chuỗi hai động từ.
