  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: vi
  text: Tại đó, anh em sẽ ăn trước mặt Yahweh, Đức Chúa Trời của anh em; anh em và gia đình anh em sẽ vui mừng về mọi việc anh em làm[a], là những việc mà Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “mọi sự đưa tay ra.” Đây là một thành ngữ có thể chỉ mọi việc anh em đảm nhận, mọi công việc, hoặc mọi điều tay anh em làm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם שָׁם
  choice: Tại đó, anh em sẽ ăn
  rationale: Giữ chỉ điểm שָׁם và diễn đạt thể hoàn thành có waw với ý hướng tương lai trong ngữ cảnh chỉ dẫn; “anh em” tự nhiên và trang trọng cho đối tượng số nhiều.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: trước mặt Yahweh, Đức Chúa Trời của anh em
  rationale: “Trước mặt” bảo lưu hình ảnh hiện diện trong לִפְנֵי; danh riêng giao ước יְהוָה được phiên âm là “Yahweh” thay vì thay bằng một tước hiệu.
- source_word: וּשְׂמַחְתֶּם
  choice: anh em ... sẽ vui mừng
  rationale: Giữ lực hướng tới hành động được truyền dạy, song song với “sẽ ăn”, bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: בְּכֹל מִשְׁלַח יֶדְכֶם
  choice: về mọi công việc tay mình làm
  rationale: Diễn đạt thành ngữ theo nghĩa dễ hiểu nhưng vẫn giữ hình ảnh “tay”; giới từ “về” nêu đối tượng hoặc căn nguyên của niềm vui mà không khẳng định quá mức một sắc thái duy nhất.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: anh em cùng cả nhà mình
  rationale: בָּתִּים ở đây chỉ các gia đình/hộ gia đình chứ không phải nhà cửa; “cả nhà mình” tự nhiên trong tiếng Việt và giữ sắc thái cộng đồng.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: là những điều Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em
  rationale: Liên kết mệnh đề quan hệ với các công việc/việc tay làm đã được Đức Chúa Trời ban phước; tiếng Việt không biểu thị rõ chuyển đổi số nhiều sang số ít ở đại từ ngôi hai, nên không thể tái hiện trọn vẹn sự chuyển số của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bảo tồn danh riêng trong nguyên văn và tránh thay nó bằng một tước hiệu.
- issue: Mối liên hệ của mệnh đề אֲשֶׁר בֵּרַכְךָ
  choice: hiểu là liên hệ với những công việc/điều tay họ làm mà Yahweh đã ban phước
  alternative: 'hiểu theo nguyên nhân: “vì Yahweh ... đã ban phước cho anh em”'
  rationale: Cú pháp cho phép một mức độ mơ hồ; bản chính giữ quan hệ tương đối gần nguyên văn, còn khả năng nguyên nhân được ghi nhận thay vì bị loại bỏ.
- issue: Sự chuyển đổi giữa ngôi hai số nhiều và số ít tập thể
  choice: dùng “anh em” xuyên suốt theo lối tiếng Việt tự nhiên
  alternative: cố đánh dấu số ít cuối câu bằng “ngươi”
  rationale: Nguyên văn chuyển từ hậu tố số nhiều sang số ít tập thể. Đổi đột ngột sang “ngươi” trong tiếng Việt sẽ gây hiểu lầm là thay đối tượng; ghi nhận hiện tượng này trong quyết định dịch phù hợp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho cộng đồng Ít-ra-ên; “cả nhà mình” biểu đạt hộ gia đình. Giữ danh Yahweh và hình ảnh “tay” của thành ngữ Hê-bơ-rơ.
