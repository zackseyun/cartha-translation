revisions:
- from: Tại đó, anh em sẽ ăn trước mặt Yahweh, Đức Chúa Trời của anh em, và anh em cùng cả nhà mình sẽ vui mừng về mọi công việc tay mình làm[a], là những điều Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em.
  to: Tại đó, anh em sẽ ăn trước mặt Yahweh, Đức Chúa Trời của anh em; anh em và gia đình anh em sẽ vui mừng về mọi việc anh em làm[a], là những việc mà Yahweh, Đức Chúa Trời của anh em, đã ban phước cho anh em.
  rationale: Bản sửa giữ lực hướng tới tương lai của hai động từ, giữ “trước mặt Yahweh,” bảo lưu phạm vi “mọi,” và không quyết định quá mức quan hệ mơ hồ của mệnh đề cuối thành nghĩa nguyên nhân. “Mọi việc anh em làm” là cách diễn đạt hiện đại, tự nhiên; chú thích duy trì hình ảnh “đưa tay ra” và các khả năng nghĩa của thành ngữ.
  reviewer_model: gpt-5.6-terra
