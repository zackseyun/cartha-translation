source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: vi
  text: Nhưng anh em phải tìm kiếm nơi mà Yahweh, Đức Chúa Trời của anh em, sẽ chọn từ giữa tất cả các chi phái của anh em để đặt danh Ngài tại đó[a], làm chỗ ngự của Ngài; rồi anh em phải đến đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để đặt danh Ngài tại đó làm chỗ Ngài ngự.” Câu Hê-bơ-rơ ở đây rất cô đọng; có thể hiểu trọng tâm là Đức Chúa Trời ngự tại đó, nơi ấy là chỗ Ngài ngự, hoặc bao gồm cả hai ý.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Nhưng
  rationale: Trong ngữ cảnh đối lập với lệnh cấm thờ phượng tại mọi nơi ở câu trước, thành ngữ này chuyển sang phương án tích cực; “Nhưng” tự nhiên và súc tích.
- source_word: הַמָּקוֹם
  choice: nơi
  rationale: Giữ nghĩa cụ thể nhưng chưa xác định của địa điểm do Đức Chúa Trời lựa chọn.
- source_word: יִבְחַר
  choice: sẽ chọn
  rationale: Thể vị hoàn ở đây hướng đến việc lựa chọn địa điểm thờ phượng trong tương lai.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu số nhiều và danh xưng giao ước đi cùng Yahweh.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: giữa tất cả các bộ tộc của anh em
  rationale: Diễn tả sự lựa chọn một địa điểm thuộc phạm vi các bộ tộc Israel; “giữa” tự nhiên hơn “từ” trong tiếng Việt.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: để đặt danh Ngài tại đó
  rationale: Giữ sát thành ngữ Hê-bơ-rơ về danh Đức Chúa Trời gắn với sự hiện diện và việc thờ phượng được Ngài chuẩn nhận, nhưng không diễn giải quá mức.
- source_word: לְשִׁכְנוֹ
  choice: làm nơi Ngài ngự
  rationale: Cách diễn đạt tự nhiên, phản ánh ý niệm nơi cư ngụ mà không khẳng định quá cụ thể quan hệ cú pháp vốn cô đọng trong nguyên văn.
- source_word: תִדְרְשׁוּ
  choice: phải tìm đến
  rationale: Trong ngữ cảnh này, động từ chỉ việc tìm kiếm đúng nơi thờ phượng; “tìm đến” vừa chuyển tải hành động tìm kiếm vừa phù hợp đích đến cụ thể.
- source_word: וּבָאתָ שָׁמָּה
  choice: và các anh em phải đến đó
  rationale: בוא được dịch tự nhiên là “đến”; “đó” phản ánh שָׁמָּה. Số ít tập thể trong nguyên văn được diễn đạt bằng đại từ số nhiều theo đối tượng được nói với trong tiếng Việt.
theological_decisions:
- issue: Danh Đức Chúa Trời và ngôn ngữ về nơi thánh trung tâm
  choice: Yahweh ... đặt danh Ngài tại đó, làm nơi Ngài ngự
  alternative: Yahweh ... đặt danh Ngài tại đó để Ngài ngự
  rationale: Bản dịch giữ cả hai mô-típ “danh” và “ngự” nhưng không đưa vào những khẳng định thần học về đền thờ vượt quá câu văn. Cấu trúc Hê-bơ-rơ cô đọng nên ghi chú bảo tồn khả năng liên kết khác nhau giữa hai cụm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các anh em” để phản ánh đối tượng số nhiều là cộng đồng Israel; giữ danh riêng “Yahweh”. Dấu chấm phẩy giúp làm rõ hai mệnh đề mệnh lệnh.
