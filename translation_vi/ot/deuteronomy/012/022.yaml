source:
  edition: WLC
  text: אַ֗ךְ כַּ/אֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת הַ/צְּבִי֙ וְ/אֶת הָ֣/אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑/נּוּ הַ/טָּמֵא֙ וְ/הַ/טָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: vi
  text: Nhưng anh em được ăn thịt ấy như người ta ăn thịt linh dương và nai[a]; người ô uế và người thanh sạch đều được ăn thịt ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hoẵng và hươu đực.”'
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là cả người đang ô uế theo nghi lễ lẫn người đang thanh sạch theo nghi lễ đều được phép ăn thịt ấy.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Nhưng
  rationale: Trong mạch luật lệ này, từ này mở đầu một điều bổ sung có tính giới hạn đối với chỉ dẫn trước đó; “Nhưng” diễn đạt tự nhiên mà không nhấn quá mức như “Chỉ” hay “Chắc chắn”.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: như ...
  rationale: Cấu trúc tương liên nêu sự so sánh giữa cách ăn thịt thú rừng và cách ăn loại thịt đang được nói đến. Câu tiếng Việt dùng “như” để chuyển tải quan hệ ấy một cách tự nhiên, không cần lặp “thì cũng”.
- source_word: יֵאָכֵל
  choice: ăn thịt
  rationale: Động từ Niphal có nghĩa bị động theo nghĩa khái quát (“được ăn”). Trong tiếng Việt, cách nói chủ động “như ăn thịt...” tự nhiên hơn mà vẫn giữ nguyên nội dung so sánh.
- source_word: הַצְּבִי
  choice: linh dương
  rationale: צְבִי thường chỉ một loài thú hoang thuộc nhóm gazelle; “linh dương” là từ hiện đại, dễ hiểu, còn khả năng “hoẵng” được ghi ở chú thích.
- source_word: הָאַיָּל
  choice: nai
  rationale: אַיָּל chỉ loài nai, đôi khi nhấn mạnh con đực. “Nai” vừa tự nhiên vừa không xác định giới tính quá mức; khả năng “hươu đực” được ghi ở chú thích.
- source_word: תֹּאכְלֶנּוּ
  choice: các ngươi có thể ăn thịt ấy
  rationale: Trong chỉ dẫn pháp luật này, thể chưa hoàn thành biểu thị sự cho phép. “Có thể ăn” truyền đạt đúng sắc thái ấy; “thịt ấy” làm rõ đại từ giống đực số ít đang chỉ con vật/thịt đã được nhắc đến.
- source_word: הַטָּמֵא
  choice: người ô uế
  rationale: Ở đây từ này chỉ người có tình trạng ô uế theo nghi lễ, không phải phẩm chất đạo đức. “Ô uế” duy trì thuật ngữ đối lập truyền thống, còn chú thích làm rõ phạm vi nghi lễ.
- source_word: הַטָּהוֹר
  choice: người thanh sạch
  rationale: Đây là vế đối của טָמֵא và chỉ tình trạng thanh sạch theo nghi lễ. “Thanh sạch” bảo tồn sự đối lập thuật ngữ mà vẫn dễ hiểu.
- source_word: יַחְדָּו
  choice: cũng như ... đều
  rationale: Trong ngữ cảnh này, từ này cho biết cả hai hạng người đều được phép ăn như nhau, không nhất thiết là họ ăn cùng lúc. Cấu trúc “cũng như ... đều” diễn đạt đúng sự bình đẳng về quyền ăn.
- source_word: יֹאכְלֶנּוּ
  choice: đều có thể ăn thịt ấy
  rationale: Động từ tiếp tục mang sắc thái cho phép trong luật lệ. “Đều có thể ăn” gắn rõ sự cho phép với cả hai hạng người.
theological_decisions:
- issue: Thuật ngữ chỉ tình trạng nghi lễ
  choice: người ô uế ... người thanh sạch
  alternative: người không thanh sạch về nghi lễ ... người thanh sạch về nghi lễ
  rationale: Cặp từ Hê-bơ-rơ nói đến tình trạng nghi lễ chứ không phán xét tư cách đạo đức. Bản văn chính giữ cặp thuật ngữ ngắn gọn và quen thuộc; chú thích xác định rõ ý nghĩa nghi lễ để tránh hiểu lầm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “các ngươi” giữ lời truyền dạy trực tiếp cho dân Y-sơ-ra-ên; “thịt ấy” tránh sự mơ hồ của đại từ vô sinh trong tiếng Việt. Câu được điều chỉnh sang lối diễn đạt chủ động tự nhiên nhưng vẫn bảo toàn phép so sánh, sắc thái cho phép và sự đối lập nghi lễ của nguyên văn.
