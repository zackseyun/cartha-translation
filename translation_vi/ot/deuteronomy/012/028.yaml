source:
  edition: WLC
  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: vi
  text: Hãy cẩn thận tuân giữ và lắng nghe tất cả những lời này mà tôi đang truyền cho anh em[a], để anh em và con cháu anh em về sau được mọi điều tốt lành mãi mãi[b], vì anh em sẽ làm điều tốt lành và ngay thẳng trước mắt Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát: “Hãy gìn giữ và nghe tất cả những lời này.” Tiếng Hê-bơ-rơ kết hợp một động từ chỉ việc cẩn thận tuân giữ với một động từ chỉ việc chăm chú nghe; văn cảnh hàm ý sự vâng theo.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “các con trai”; trong văn cảnh này, từ ấy có thể chỉ con cái hoặc hậu duệ nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: Hãy cẩn thận lắng nghe
  rationale: Cụm này diễn đạt tự nhiên sức khuyên nhủ của שׁמר và ý chăm chú nghe của שׁמע; sự vâng theo được hàm ý trong ngữ cảnh, nhưng không bị diễn giải quá mức ngay trong chính văn.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: mọi lời
  rationale: דברים ở đây chỉ những lời truyền dạy của Môi-se; “mọi lời” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: מְצַוֶּךָּ
  choice: tôi đang truyền cho anh em
  rationale: Dạng phân từ diễn tả hành động truyền lệnh đang diễn ra. “Truyền” phù hợp văn cảnh luật pháp và trang trọng hơn “ra lệnh”.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: để anh em ... được mọi sự tốt lành
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ về tình trạng được tốt đẹp, thịnh vượng; cách nói này tự nhiên trong tiếng Việt mà không thu hẹp ý vào vật chất.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: và con cháu anh em về sau
  rationale: בנים có hình thức là “các con trai” nhưng trong lời hứa giao ước ở đây chỉ hậu duệ nói chung. “Con cháu” truyền đạt rõ chiều kích nhiều thế hệ.
- source_word: עַד עוֹלָם
  choice: đến muôn đời
  rationale: Giữ sắc thái lâu dài, vô hạn của עוֹלָם bằng một cách nói trang trọng nhưng quen thuộc trong tiếng Việt.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: điều tốt lành và ngay thẳng
  rationale: Hai tính từ được dùng như danh từ; bản dịch giữ nguyên cặp phẩm chất đạo đức mà vẫn tự nhiên.
- source_word: בְּעֵינֵי יְהוָה
  choice: trước mắt Yahweh
  rationale: “Trước mắt” bảo tồn hình ảnh Hê-bơ-rơ về sự đánh giá của Đức Chúa Trời và là cách nói tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Phạm vi của בָנֶיךָ
  choice: con cháu
  alternative: các con trai; con cái
  rationale: Trong ngôn ngữ giao ước, từ giống đực số nhiều này có thể đại diện cho hậu duệ nói chung; “con cháu” thể hiện rõ ý hậu thế mà không giới hạn vào nam giới.
- issue: Quan hệ do כִּי biểu thị
  choice: vì anh em sẽ làm
  alternative: khi anh em làm; nếu anh em làm
  rationale: Chọn quan hệ giải thích/nguyên nhân phù hợp mạch câu, đồng thời ghi nhận rằng כִּי có thể được hiểu theo thời gian hoặc điều kiện trong văn cảnh này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với cộng đồng giao ước, dù đại từ và hậu tố Hê-bơ-rơ ở dạng số ít đại diện; tránh “ngươi” vì sắc thái cổ và dễ tạo cảm giác gay gắt. Giữ danh riêng “Yahweh” và hình ảnh “trước mắt” của nguyên văn.
