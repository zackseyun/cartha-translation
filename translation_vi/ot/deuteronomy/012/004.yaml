base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/004.yaml
  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: vi
  text: Anh em không được làm như thế đối với Yahweh, Đức Chúa Trời của anh em.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Như thế” chỉ về những điều vừa được truyền liên quan đến việc phá hủy các nơi thờ phượng của các dân tộc; người Israel không được đối xử với Yahweh theo cách ấy.
    reason: cross_reference
  - marker: b
    text: 'Hê-bơ-rơ: YHWH, được phiên âm là “Yahweh”; theo truyền thống thường được dịch là “CHÚA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: anh em không được làm
  rationale: לֹא với động từ vị hoàn thành ngôi hai số nhiều mang lực cấm đoán trong văn luật pháp. “Không được làm” tự nhiên, rõ ràng và vẫn giữ giọng mệnh lệnh giao ước.
- source_word: כֵּן
  choice: như vậy
  rationale: Từ này hồi chỉ cách hành xử vừa nêu ở câu trước. “Như vậy” giữ nguyên tính cô đọng và không đưa phần giải thích ngữ cảnh vào chính văn.
- source_word: לַיהוָה
  choice: đối với Giê-hô-va
  rationale: לְ biểu thị đối tượng mà hành động hướng đến hoặc cách đối xử dành cho đối tượng ấy. “Đối với” phù hợp với ý không được đối xử với YHWH theo cách vừa nói. “Giê-hô-va” là cách gọi danh riêng YHWH quen thuộc và trang trọng trong tiếng Việt.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: 'Dạng liên kết kèm hậu tố ngôi hai số nhiều diễn đạt quan hệ giao ước: “Đức Chúa Trời của anh em.” “Anh em” cho thấy đối tượng được nói với là số nhiều.'
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản văn dùng trực tiếp danh giao ước YHWH. “Giê-hô-va” là hình thức danh riêng đã quen thuộc trong tiếng Việt; chú thích nêu dạng ký âm “Yahweh” và lối dịch truyền thống để người đọc nhận biết chứng cứ nguyên ngữ.
- issue: Phạm vi của lời cấm
  choice: 'Giữ câu hồi chỉ ngắn gọn: “không được làm như vậy đối với Giê-hô-va”'
  alternative: Diễn giải ngay trong chính văn rằng không được phá hủy nơi hoặc vật thờ phượng của Giê-hô-va như của các dân tộc
  rationale: 'Câu Hê-bơ-rơ cô đọng và phụ thuộc vào ngữ cảnh trước đó. Giữ “như vậy” bảo toàn độ mở của câu: lời cấm ít nhất đối chiếu cách Israel phải đối xử với YHWH với cách họ vừa được truyền phải đối xử với các nơi thờ thần ngoại bang, nhưng chính câu không triển khai cụ thể hơn.'
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để thể hiện ngôi hai số nhiều; giữ cấu trúc hồi chỉ ngắn gọn của nguyên văn. Các dấu chú thích [a][b] đều xuất hiện trong chính văn.
