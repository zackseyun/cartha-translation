source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: vi
  text: Đây là những luật lệ và phán quyết mà anh em phải cẩn thận thi hành trong xứ mà Yahweh[a], Đức Chúa Trời của tổ phụ ngươi, đã ban cho ngươi để chiếm hữu[b], suốt những ngày anh em sống trên đất[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là danh riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ.
    reason: divine_name
  - marker: b
    text: 'Cũng có thể dịch: “để thừa hưởng” hoặc “để nhận lấy làm sản nghiệp”.'
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ ở đây có thể chỉ “mặt đất” nói chung hoặc “miền đất” cụ thể.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הַחֻקִּים
  choice: những luật lệ
  rationale: Diễn đạt tự nhiên loại quy định được ấn định, đồng thời giữ sự phân biệt với מִשְׁפָּטִים.
- source_word: וְהַמִּשְׁפָּטִים
  choice: và phán quyết
  rationale: Giữ sắc thái pháp lý của các quyết định hoặc quy định công chính; “quy định” cũng có thể dùng nhưng dễ làm mờ sự phân biệt với חֻקִּים.
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: mà anh em phải cẩn thận thi hành
  rationale: Cấu trúc שׁמר + động từ nguyên mẫu nhấn mạnh việc chú tâm tuân giữ bằng hành động, không chỉ ghi nhớ hay bảo quản.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: Trong văn mạch Phục Truyền Luật Lệ Ký, từ này chỉ miền đất được ban cho Israel; “xứ” truyền đạt rõ nghĩa lãnh thổ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Đức Chúa Trời của tổ phụ ngươi
  rationale: Giữ công thức giao ước và ngôi số ít của hậu tố Hê-bơ-rơ; “tổ phụ” phù hợp với văn phong Kinh Thánh trang trọng.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: Trong văn mạch về đất đai, ירשׁ nói đến việc nhận lấy và nắm quyền sở hữu; cách dịch này không khiến hành động mang sắc thái hoàn toàn thụ động.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: suốt những ngày anh em sống
  rationale: Truyền đạt tự nhiên lực bao quát và ý nghĩa tiếp diễn của cụm từ Hê-bơ-rơ.
- source_word: עַל הָאֲדָמָה
  choice: trên đất
  rationale: Giữ được độ mở nghĩa giữa mặt đất nói chung và miền đất cụ thể, tránh quyết định quá mức điều nguyên văn có thể để ngỏ.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời. “Yahweh” thể hiện danh ấy trực tiếp, không thay bằng tước hiệu, đồng thời gần với cách phục nguyên phát âm được chấp nhận rộng rãi.
- issue: Sự chuyển đổi giữa ngôi số ít và số nhiều
  choice: giữ “ngươi” ở các hậu tố số ít và “anh em” ở các động từ số nhiều
  alternative: đồng nhất toàn câu thành “anh em” hoặc “các ngươi”
  rationale: Nguyên văn chuyển từ số nhiều ở mệnh lệnh sang số ít trong “tổ phụ ngươi… ban cho ngươi”, rồi trở lại số nhiều. Giữ sự chuyển đổi này bảo toàn đặc điểm tu từ và cách Israel vừa được nói đến như một cộng đồng vừa như một đơn vị giao ước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho ngôi thứ hai số nhiều và “ngươi” cho các hậu tố số ít nhằm giữ sự chuyển đổi số ngữ pháp trong nguyên văn. “Xứ” phân biệt miền đất được ban ở đầu câu với “đất” có nghĩa rộng hơn ở cuối câu.
