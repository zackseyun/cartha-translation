  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: vi
  text: Nhưng khi anh em vượt qua sông Giô-đanh và cư ngụ trong miền đất mà Yahweh, Đức Chúa Trời của anh em, ban cho anh em làm cơ nghiệp, và Ngài cho anh em được yên nghỉ khỏi mọi kẻ thù chung quanh, thì anh em sẽ sống yên ổn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cư ngụ yên ổn.”'
    reason: Ghi nhận cách dịch sát cấu trúc hơn của וִישַׁבְתֶּם בֶּטַח; cụm này có thể được diễn đạt là “sống yên ổn” hoặc “cư ngụ yên ổn.”
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: khi anh em vượt qua
  rationale: Dạng động từ có tiền tố waw nằm trong chuỗi hướng tới tương lai; cách dịch bằng mệnh đề thời gian phù hợp với quan hệ cú pháp của văn mạch và tự nhiên trong tiếng Việt.
- source_word: הַיַּרְדֵּן
  choice: sông Giô-đanh
  rationale: Dùng tên gọi quen thuộc trong tiếng Việt và nói rõ đây là một con sông, điều vốn hàm chứa trong địa danh.
- source_word: וִישַׁבְתֶּם
  choice: cư ngụ
  rationale: ישׁב chỉ việc ở, định cư hoặc cư trú; “cư ngụ” trang trọng vừa phải và thích hợp với bối cảnh dân Israel sống ổn định trong đất.
- source_word: בָּאָרֶץ
  choice: trong miền đất
  rationale: Giữ ý nghĩa địa lý và giao ước của אֶרֶץ, đồng thời “miền đất” tự nhiên hơn trong câu tiếng Việt này.
- source_word: מַנְחִיל אֶתְכֶם
  choice: ban cho anh em làm cơ nghiệp
  rationale: Dạng Hiphil của נחל diễn tả việc khiến ai nhận phần thừa hưởng; cách dịch này giữ cả tác nhân thần linh lẫn sắc thái cơ nghiệp.
- source_word: וְהֵנִיחַ לָכֶם
  choice: khi Ngài cho anh em được yên nghỉ
  rationale: Dạng Hiphil của נוח mang nghĩa ban sự nghỉ ngơi, yên ổn hoặc giải thoát khỏi xung đột; “cho ... được yên nghỉ” bảo tồn mô-típ thần học về sự yên nghỉ trong đất.
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: khỏi mọi kẻ thù chung quanh
  rationale: Chuyển tải cả tính toàn diện của כָּל lẫn ý nghĩa không gian của מִסָּבִיב.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: anh em sẽ sống an toàn
  rationale: בֶּטַח diễn tả tình trạng an ninh, không bị đe dọa; cách nói này rõ ràng và tự nhiên trong tiếng Việt hiện đại, còn phương án sát cấu trúc hơn được ghi ở chú thích.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” giúp phân biệt danh riêng này với tước hiệu “Chúa” mà không áp đặt cách đọc mang tính hệ phái.
- issue: Sắc thái của sự yên nghỉ trong đất
  choice: cho anh em được yên nghỉ khỏi mọi kẻ thù
  alternative: cho anh em được thanh bình, không còn bị mọi kẻ thù quấy nhiễu
  rationale: Giữ hình ảnh “yên nghỉ” của נוח và không thu hẹp ý nghĩa thành cảm giác nội tâm hay chỉ thành tình trạng chính trị.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ số nhiều “anh em” giữ lời Moses trực tiếp nói với cộng đồng Israel; “Ngài” dùng để quy chiếu Yahweh. Dấu chú thích được đặt ngay sau cụm mà chú thích giải thích.
