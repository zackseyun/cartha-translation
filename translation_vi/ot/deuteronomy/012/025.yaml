id: DEU.12.25
reference: Deuteronomy 12:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: vi
  text: Con không được ăn huyết ấy, để con và con cháu của con được phúc, vì con làm điều ngay thẳng trước mắt Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các con trai của con”; cũng có thể hiểu rộng là “hậu duệ của con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: ăn huyết ấy
  rationale: Động từ אָכַל với hậu tố ngôi ba số ít chỉ về huyết trong ngữ cảnh ngay trước đó (cc. 23–24). Tiếng Việt cần nêu lại đối tượng để câu rõ và tự nhiên.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt quan hệ mục đích–kết quả một cách ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: יִיטַב לְךָ
  choice: con ... được phúc
  rationale: Thành ngữ Hê-bơ-rơ nói đến tình trạng tốt lành nói chung trong giao ước; “được phúc” tự nhiên và không thu hẹp ý nghĩa vào sự thịnh vượng vật chất.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: và con cháu sau này
  rationale: בָּנִים có thể chỉ các con trai, con cái, hoặc rộng hơn là hậu duệ. “Con cháu” giữ được sắc thái gia đình và phạm vi nhiều thế hệ trong ngữ cảnh.
- source_word: כִּי
  choice: vì
  rationale: Ở đây כִּי nêu căn cứ cho kết quả tốt lành gắn với sự vâng phục.
- source_word: תַעֲשֶׂה
  choice: con làm
  rationale: Dạng chưa hoàn thành có thể diễn tả hành động được mong đợi trong khuôn khổ mệnh lệnh; hiện tại tổng quát “làm” tự nhiên hơn “sẽ làm” trong tiếng Việt và không áp đặt quá mức sắc thái thời gian.
- source_word: הַיָּשָׁר
  choice: điều ngay thẳng
  rationale: Giữ sắc thái đạo đức của יָשָׁר là ngay thẳng, đúng đắn.
- source_word: בְּעֵינֵי יְהוָה
  choice: trước mắt Yahweh
  rationale: Bảo tồn hình ảnh Hê-bơ-rơ về sự đánh giá của Đức Chúa Trời, đồng thời là cách nói quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng danh giao ước יהוה; “Yahweh” bảo tồn danh riêng mà không thay bằng tước hiệu.
- issue: Phạm vi của בָנֶיךָ
  choice: con cháu
  alternative: các con trai của con; con cái của con; hậu duệ của con
  rationale: Trong lời hứa giao ước, từ giống đực số nhiều có thể bao quát dòng dõi. “Con cháu” không giới hạn vào nam giới và giữ sắc thái thân thuộc qua các thế hệ.
- issue: Quan hệ giữa sự vâng phục và điều tốt lành
  choice: vì con làm điều ngay thẳng
  alternative: khi con làm điều ngay thẳng
  rationale: כִּי có thể được hiểu theo sắc thái nguyên nhân hoặc hoàn cảnh. Chọn “vì” theo cấu trúc trực tiếp của câu, nhưng không diễn giải thêm bản chất thần học của mối liên hệ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ số ít “con” vì toàn câu Hê-bơ-rơ ở ngôi thứ hai giống đực số ít, phù hợp lối diễn đạt Môi-se nói với từng người trong cộng đồng. Không cần chú thích vì “con cháu” truyền đạt tự nhiên độ rộng nghĩa của בָנִים trong ngữ cảnh.
