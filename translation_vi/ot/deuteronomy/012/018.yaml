revisions:
- from: Nhưng anh em chỉ được ăn các lễ vật ấy trước mặt Yahweh, Đức Chúa Trời của anh em, tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn—anh em, con trai, con gái, tôi trai, tớ gái của anh em, cùng người Lê-vi sống trong các thành của anh em[a]. Anh em phải vui mừng trước mặt Yahweh, Đức Chúa Trời của anh em, về mọi công việc tay mình làm[b].
  to: Nhưng anh em chỉ được ăn các lễ vật ấy trước mặt Yahweh, Đức Chúa Trời của anh em, tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn—anh em, con trai và con gái của anh em, đầy tớ nam và đầy tớ nữ của anh em, cùng người Lê-vi sống trong các thành của anh em[a]—và anh em phải vui mừng trước mặt Yahweh, Đức Chúa Trời của anh em, trong mọi việc anh em đảm nhận[b].
  rationale: Bản sửa chỉ chuẩn hóa cặp từ chỉ đầy tớ và điều chỉnh thành ngữ cuối theo nghĩa rộng của tiếng Hê-bơ-rơ. Danh Yahweh, sắc thái chỉ thị, danh sách hộ gia đình, thành ngữ “trong các cổng,” và hai vị trí chú thích đều được giữ nguyên về nghĩa và chức năng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:26Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc đối lập hạn định của כִּי אִם, địa điểm được Yahweh chọn, danh sách các thành viên trong hộ gia đình và người Lê-vi địa phương, cùng mệnh lệnh vui mừng. Tuy nhiên, cụm cuối nên diễn đạt “trong mọi việc ... đảm nhận” để phản ánh phạm vi thành ngữ מִשְׁלַח יָדֶךָ (mọi việc làm/đảm nhận), thay vì chỉ “công việc tay mình làm,” vốn dễ nghiêng về công việc đã thực hiện hay thành quả lao động.
  naturalness: Câu nhìn chung tự nhiên và trang trọng. “Tôi trai, tớ gái” không cân xứng về cách gọi và hơi cổ trong tiếng Việt hiện đại; “đầy tớ nam và đầy tớ nữ” rõ ràng, nhất quán, và vẫn giữ phân biệt giới tính của nguyên ngữ. Tái cấu trúc danh sách cũng làm rõ sở hữu ngữ “của anh em.”
  terminology: “Yahweh, Đức Chúa Trời của anh em” phản ánh đầy đủ YHWH ʾĕlōheḵā và nhất quán với quyết định thuật ngữ. “Người Lê-vi” là cách gọi chuẩn. Giữ “các lễ vật ấy” là cách quy chiếu ngữ cảnh chấp nhận được đối với hậu tố đối tượng số ít, vốn hướng về các phần thánh/lễ vật đã nêu ở câu trước.
  issues:
  - severity: low
    issue: Cụm “về mọi công việc tay mình làm” thu hẹp và diễn giải chưa đều thành ngữ מִשְׁלַח יָדֶךָ.
    rationale: Thành ngữ này chỉ mọi điều một người bắt tay vào, công việc hay nỗ lực của họ. “Trong mọi việc anh em đảm nhận” tự nhiên hơn và giữ phạm vi rộng; chú thích có thể bảo lưu hình ảnh nguyên văn về “sự sai phái của tay.”
  - severity: low
    issue: “Tôi trai, tớ gái” dùng hai cách gọi không song song.
    rationale: Cặp “đầy tớ nam và đầy tớ nữ” là cách gọi nhất quán, dễ hiểu trong tiếng Việt hiện đại, và vẫn không áp đặt cách hiểu xã hội vượt quá các từ Hê-bơ-rơ.
  revised_text: Nhưng anh em chỉ được ăn các lễ vật ấy trước mặt Yahweh, Đức Chúa Trời của anh em, tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn—anh em, con trai và con gái của anh em, đầy tớ nam và đầy tớ nữ của anh em, cùng người Lê-vi sống trong các thành của anh em[a]—và anh em phải vui mừng trước mặt Yahweh, Đức Chúa Trời của anh em, trong mọi việc anh em đảm nhận[b].
