  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: vi
  text: Nhưng anh em chỉ được ăn các lễ vật ấy trước mặt Yahweh, Đức Chúa Trời của anh em, tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn—anh em, con trai và con gái của anh em, đầy tớ nam và đầy tớ nữ của anh em, cùng người Lê-vi sống trong các thành của anh em[a]—và anh em phải vui mừng trước mặt Yahweh, Đức Chúa Trời của anh em, trong mọi việc anh em đảm nhận[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ở trong các cổng của anh em,” một thành ngữ Hê-bơ-rơ chỉ những người sống trong các thành hoặc cộng đồng địa phương của anh em.'
    reason: cultural_note
  - marker: b
    text: 'Nguyên văn: “trong mọi sự sai phái của tay anh em,” nghĩa là trong mọi việc anh em làm hoặc đảm nhận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Nhưng ... chỉ
  rationale: Trong mạch đối lập với điều bị cấm ở câu trước, cụm từ giới hạn việc ăn các lễ vật vào một nơi duy nhất; cách diễn đạt này tự nhiên và giữ rõ sắc thái hạn định.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: trước mặt Yahweh, Đức Chúa Trời của anh em
  rationale: “Trước mặt” giữ nghĩa trực tiếp là ở trong sự hiện diện của Đức Chúa Trời; danh YHWH được phiên âm là “Yahweh”.
- source_word: תֹּאכְלֶנּוּ
  choice: ăn các lễ vật ấy
  rationale: Động từ mang lực chỉ thị. Đại từ số ít tiếng Hê-bơ-rơ quy chiếu chung đến phần lễ vật đã nêu ở câu trước; tiếng Việt dùng số nhiều theo ngữ cảnh để tránh đại từ mơ hồ.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: tại nơi Yahweh, Đức Chúa Trời của anh em, sẽ chọn
  rationale: Giữ công thức đặc trưng của Phục truyền Luật lệ ký về nơi thờ phượng được Yahweh lựa chọn; hậu tố בּוֹ được hấp thụ tự nhiên vào cấu trúc tiếng Việt.
- source_word: אַתָּה וּבִנְךָ וּבִתֶּךָ
  choice: anh em, con trai, con gái ... của anh em
  rationale: Giữ đầy đủ danh sách thành viên gia đình. “Anh em” là đại từ cộng đồng quen thuộc trong tiếng Việt Kinh Thánh, dù tiếng Hê-bơ-rơ dùng ngôi hai số ít đại diện.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: tôi trai, tớ gái của anh em
  rationale: Giữ sự phân biệt nam và nữ trong hai danh từ Hê-bơ-rơ, với lối nói ngắn gọn, trang trọng và dễ nhận biết.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: người Lê-vi sống trong các thành của anh em
  rationale: “Trong các cổng của anh em” là thành ngữ chỉ những người sống trong phạm vi các thành địa phương; chuyển nghĩa để người đọc hiện đại hiểu ngay.
- source_word: וְשָׂמַחְתָּ
  choice: Anh em phải vui mừng
  rationale: Thể hiện lực chỉ thị và niềm vui chủ động trong bối cảnh thờ phượng giao ước.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: về mọi công việc tay mình làm
  rationale: Giữ hình ảnh “tay” của thành ngữ Hê-bơ-rơ nhưng diễn đạt tự nhiên; giới từ được hiểu là niềm vui về hoặc trong thành quả của mọi việc mình làm.
theological_decisions:
- issue: Cách dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản văn dùng trực tiếp Tứ tự danh; phiên âm “Yahweh” bảo tồn tính chất danh riêng của Đức Chúa Trời mà không thay bằng một tước hiệu.
- issue: Phạm vi của mệnh lệnh vui mừng
  choice: vui mừng ... về mọi công việc tay mình làm
  alternative: vui mừng ... trong mọi việc anh em đảm nhận
  rationale: Cụm Hê-bơ-rơ có tính thành ngữ và có thể chỉ mọi công việc, nỗ lực hoặc thành quả. Bản dịch giữ hình ảnh bàn tay mà không thu hẹp niềm vui thành một giáo lý riêng về sự thịnh vượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho lời xưng hô cộng đồng ở ngôi hai số ít đại diện; dùng “Yahweh” nhất quán cho Tứ tự danh. Dấu gạch ngang duy trì nhịp liệt kê của câu Hê-bơ-rơ, còn hai câu tiếng Việt giúp tránh một câu quá dài.
