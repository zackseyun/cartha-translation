  to: Anh em không được ăn trong các thành của anh em[a] phần mười từ ngũ cốc, rượu mới và dầu của anh em; cũng không được ăn các con đầu lòng của đàn bò và đàn chiên dê của anh em, bất cứ lễ vật khấn nguyện nào[b], các lễ vật tự nguyện, hoặc phần đóng góp do tay anh em dâng[c].
  rationale: Sửa liên từ để giữ phép liệt kê của nguyên văn, làm rõ sở hữu ngữ áp dụng cho toàn bộ các sản vật và vật nuôi, đồng thời điều chỉnh thuật ngữ cuối theo nghĩa cơ bản của תְּרוּמָה. Chú thích về נְדָרֶיךָ được giữ ở dạng dè dặt (“có thể”) để không giải quyết dứt khoát điểm có thể được hiểu khác nhau.
