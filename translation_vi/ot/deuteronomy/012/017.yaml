base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: vi
  text: Anh em không được ăn trong các thành của anh em[a] phần mười từ ngũ cốc, rượu mới và dầu của anh em; cũng không được ăn các con đầu lòng của đàn bò và đàn chiên dê của anh em, bất cứ lễ vật khấn nguyện nào[b], các lễ vật tự nguyện, hoặc phần đóng góp do tay anh em dâng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong các cổng của anh em,” một thành ngữ chỉ các thành hoặc khu dân cư địa phương.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn có thể dịch: “mọi lời khấn mà anh em khấn.” Trong ngữ cảnh nói về những thứ được ăn, cụm này có thể chỉ các lễ vật được dâng theo lời khấn.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “phần đóng góp từ tay anh em”; theo cách dịch truyền thống: “lễ vật đưa lên của tay anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: Anh em không được ăn
  rationale: Cấu trúc יכל với động từ nguyên mẫu trong văn luật pháp diễn tả sự cấm đoán hơn là không có khả năng. “Không được ăn” truyền đạt tự nhiên lực quy định này.
- source_word: בִּשְׁעָרֶיךָ
  choice: trong các thành của mình
  rationale: Nghĩa đen là “trong các cổng của anh em,” nhưng đây là thành ngữ chỉ các thành hoặc khu dân cư địa phương. Bản văn chính dùng cách nói rõ nghĩa và ghi hình ảnh nguyên văn trong chú thích.
- source_word: מַעְשַׂר דְּגָנְךָ
  choice: một phần mười ngũ cốc ... của mình
  rationale: מַעְשַׂר là phần mười dành riêng, còn דָּגָן chỉ ngũ cốc. Cách dịch này dễ hiểu đối với độc giả phổ thông và vẫn giữ đúng nội dung luật tế tự.
- source_word: תִירֹשְׁךָ
  choice: rượu mới ... của mình
  rationale: תִּירוֹשׁ thường chỉ rượu mới hoặc sản phẩm rượu mới, phân biệt với những từ Hê-bơ-rơ rộng hơn chỉ rượu.
- source_word: יִצְהָרֶךָ
  choice: dầu của mình
  rationale: Từ này thường nói đến dầu mới, nhất là dầu ô-liu, nhưng bản văn không nêu rõ loại cây; “dầu” tránh diễn giải quá mức.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: con đầu lòng của đàn bò hay đàn chiên dê
  rationale: בְּכוֹרֹת là những con đầu lòng; בָּקָר chỉ đại gia súc, còn צֹאן bao gồm chiên và dê. Cách dịch này làm rõ phạm vi của hai danh từ tập hợp.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: bất cứ lễ vật nào đã khấn nguyện
  rationale: Nghĩa từ vựng bề mặt là “mọi điều anh em khấn mà anh em khấn,” nhưng trong danh sách những thứ có thể ăn, cụm này chỉ các lễ vật gắn với lời khấn. Chú thích giữ lại cách hiểu sát mặt chữ.
- source_word: נִדְבֹתֶיךָ
  choice: các lễ vật tự nguyện
  rationale: Đây là thuật ngữ tế tự chỉ lễ vật được tự nguyện dâng, đối lập với lễ vật phát sinh từ lời khấn hoặc nghĩa vụ.
- source_word: תְּרוּמַת יָדֶךָ
  choice: lễ vật do tay mình dâng lên
  rationale: תְּרוּמָה là phần đóng góp hoặc lễ vật được dành riêng/dâng lên; cụm “tay mình” được giữ để phản ánh hình ảnh Hê-bơ-rơ mà không dùng thuật ngữ cổ khó hiểu.
theological_decisions:
- issue: Ý nghĩa của נְדָרֶיךָ trong danh sách đồ ăn thánh
  choice: Dịch là “lễ vật nào đã khấn nguyện” trong bản văn chính.
  alternative: “mọi lời khấn mà anh em khấn” hoặc “mọi điều anh em đã khấn.”
  rationale: Xét cú pháp riêng, danh từ có thể chỉ chính lời khấn; nhưng vì động từ “ăn” chi phối toàn bộ danh sách, ngữ cảnh nhiều khả năng nói đến lễ vật được dâng theo lời khấn. Chú thích bảo tồn cách đọc sát mặt chữ thay vì xóa bỏ độ căng giữa từ ngữ và ngữ cảnh.
- issue: Các loại lễ vật trong luật tế tự
  choice: Phân biệt lễ vật đã khấn nguyện, lễ vật tự nguyện và lễ vật do tay dâng lên.
  alternative: Gộp tất cả thành “các lễ vật” hoặc “các món quà.”
  rationale: Bản Hê-bơ-rơ dùng những thuật ngữ riêng, nên việc giữ các loại này bảo toàn cấu trúc pháp lý và tế tự mà không gắn chúng với giáo lý hệ phái.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” để diễn đạt đại từ số ít giống đực mang nghĩa tập thể đang nói với toàn dân; dùng “của mình” để tránh lặp nặng nề. Các thuật ngữ tế tự được trình bày bằng tiếng Việt phổ thông, còn những cách dịch sát hình ảnh Hê-bơ-rơ được bảo tồn trong chú thích.
