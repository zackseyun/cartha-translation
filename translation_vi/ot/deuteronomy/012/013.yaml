review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời cảnh báo và nghĩa tế tự của câu. Tuy nhiên, nguyên văn dùng ngôi thứ hai số ít nhất quán và danh từ “lễ thiêu” ở số nhiều; “anh em” làm chuyển sang số nhiều, còn “lễ thiêu” số ít không phản ánh đầy đủ hình thức nguyên văn.
  naturalness: “Hãy cẩn thận, đừng…” là tự nhiên, rõ ràng và phù hợp văn phong hiện đại trang trọng. “Tại bất cứ nơi nào” diễn đạt tốt ý cấm dâng lễ ở một địa điểm tùy ý.
  terminology: “Lễ thiêu” là thuật ngữ phù hợp cho עֹלָה. Dùng “các lễ thiêu” bảo toàn số nhiều của עֹלֹתֶיךָ. “Ngươi” giữ ngôi số ít của văn bản và phù hợp với lối xưng hô Kinh Thánh trang trọng.
  issues:
  - severity: medium
    issue: Đại từ “anh em” chuyển ngôi thứ hai số ít của nguyên văn thành số nhiều.
    rationale: Cả hậu tố sở hữu trong עֹלֹתֶיךָ lẫn động từ תִּרְאֶה đều là ngôi thứ hai số ít. Không nên giải thích “anh em” như một cách giữ số ít, vì trong tiếng Việt hiện đại nó thông thường là số nhiều.
  - severity: low
    issue: “lễ thiêu” không thể hiện số nhiều của עֹלֹתֶיךָ.
    rationale: Dù số ít đôi khi có thể mang nghĩa loại từ trong tiếng Việt, thêm “các” là cách an toàn, rõ ràng để giữ số nhiều mà vẫn tự nhiên.
  revised_text: Hãy cẩn thận, đừng dâng các lễ thiêu của ngươi tại bất cứ nơi nào ngươi thấy;[a]
