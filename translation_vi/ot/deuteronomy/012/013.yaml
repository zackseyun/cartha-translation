base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: vi
  text: Hãy cẩn thận, đừng dâng các lễ thiêu của ngươi tại bất cứ nơi nào ngươi thấy;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy cẩn thận, đừng dâng các lễ thiêu của ngươi tại mọi nơi ngươi thấy.”'
    reason: Phản ánh khả năng hiểu בְּכָל מָקוֹם sát từng chữ là “tại mọi nơi,” bên cạnh nghĩa “tại bất cứ nơi nào” trong phạm vi lời cấm.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy cẩn thận
  rationale: Thể mệnh lệnh Niphal của שׁמר đi với đại từ chỉ người nhận tạo thành công thức cảnh báo “hãy coi chừng/hãy cẩn thận.” Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ nguyên lực mệnh lệnh.
- source_word: פֶּן
  choice: đừng
  rationale: פֶּן mở đầu mệnh đề cảnh báo phủ định. Trong cấu trúc tiếng Việt, “Hãy cẩn thận, đừng…” truyền đạt tự nhiên ý ngăn ngừa mà không cần dùng lối diễn đạt cổ.
- source_word: תַּעֲלֶה
  choice: dâng
  rationale: Hiphil của עלה theo nghĩa đen là “làm cho đi lên,” nhưng trong ngữ cảnh tế lễ có nghĩa dâng lễ vật trên bàn thờ. “Dâng” là thuật ngữ tế tự tự nhiên và chính xác trong tiếng Việt.
- source_word: עֹלֹתֶיךָ
  choice: lễ thiêu của anh em
  rationale: עֹלָה là lễ vật được thiêu trọn trên bàn thờ. “Lễ thiêu” là cách gọi ngắn gọn, rõ nghĩa; cụm sở hữu giữ ngôi số ít của nguyên văn, được diễn đạt bằng “anh em” theo lối xưng hô trang trọng, phổ thông.
- source_word: בְּכָל מָקוֹם
  choice: tại bất cứ nơi nào
  rationale: Trong phạm vi của lời cấm, כָל có thể mang nghĩa phiếm chỉ “bất cứ.” Cách dịch này diễn đạt việc không được tùy ý chọn địa điểm dâng lễ, đồng thời tự nhiên hơn “tại mọi nơi” trong tiếng Việt.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: anh em thấy
  rationale: Dịch trực tiếp động từ ראה là “thấy,” giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ và không thêm ý “chọn” dù ngữ cảnh có thể hàm ý nơi do người ta tự chọn.
theological_decisions:
- issue: Ngôn ngữ về việc tập trung tế tự
  choice: Dịch câu này như lời cấm dâng lễ thiêu tại những địa điểm tùy ý.
  alternative: Diễn giải rộng thành lệnh cấm mọi hình thức thờ phượng bên ngoài nơi thánh trung tâm.
  rationale: Nội dung trực tiếp của câu chỉ nhắc đến lễ thiêu và địa điểm. Bối cảnh rộng hơn nói đến việc tập trung tế tự, nhưng bản dịch không nên đưa toàn bộ hàm ý ấy vào riêng câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng cho đại từ ngôi hai giống đực số ít trong diễn ngôn giao ước, không biến nó thành số nhiều về mặt ý nghĩa. Dấu chấm phẩy trước chú thích giữ nhịp pháp lý của câu.
