- from: Hãy cẩn thận, đừng dâng lễ thiêu của anh em tại bất cứ nơi nào anh em thấy;[a]
  to: Hãy cẩn thận, đừng dâng các lễ thiêu của ngươi tại bất cứ nơi nào ngươi thấy;[a]
  rationale: Giữ nguyên cấu trúc cảnh báo, thuật ngữ tế tự, và tính không xác định của “bất cứ nơi nào”; chỉ sửa đại từ và số của danh từ để phản ánh chính xác hơn ngôi số ít và số nhiều trong tiếng Hê-bơ-rơ. Chú thích được điều chỉnh tương ứng với bản văn sửa đổi.
