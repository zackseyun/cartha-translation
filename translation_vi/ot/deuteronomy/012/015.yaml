  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: vi
  text: Nhưng bất cứ khi nào bạn muốn[a], bạn có thể giết súc vật và ăn thịt, tùy theo phước lành mà Yahweh, Đức Chúa Trời của bạn, đã ban cho bạn, trong mọi thành của bạn[b]. Cả người ô uế lẫn người thanh sạch đều có thể ăn thịt ấy, như người ta ăn thịt linh dương hay nai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “trong mọi sự ao ước của lòng bạn”, nghĩa là bất cứ khi nào bạn muốn.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “trong mọi cổng của bạn”; đây là cách nói chỉ các thành hoặc khu định cư.'
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: Tuy nhiên
  rationale: Diễn tả sự giới hạn hoặc điều chỉnh đối với mệnh lệnh ngay trước đó, đồng thời tự nhiên trong tiếng Việt.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: bất cứ khi nào lòng bạn ao ước
  rationale: Chuyển ngữ tự nhiên thành ngữ Hê-bơ-rơ, nghĩa đen là “theo mọi điều nephesh của bạn ao ước”; “lòng” ở đây diễn đạt ham muốn của con người mà không gợi một học thuyết riêng về linh hồn.
- source_word: תִּזְבַּח
  choice: bạn có thể giết súc vật
  rationale: Ngữ cảnh ban phép giết con vật để lấy thịt, không phải truyền lệnh phải dâng sinh tế; thêm “súc vật” để làm rõ đối tượng hàm ẩn.
- source_word: וְאָכַלְתָּ בָשָׂר
  choice: và ăn thịt
  rationale: בָשָׂר trong ngữ cảnh này là thịt động vật dùng làm thức ăn.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: tùy theo phước lành mà Yahweh, Đức Chúa Trời của bạn, đã ban cho bạn
  rationale: Giữ danh từ “phước lành” và sắc thái tương xứng của tiền tố כְּ, tức việc ăn tùy theo nguồn cung ứng Đức Chúa Trời ban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh giao ước được viết trong bản Hê-bơ-rơ.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: tại bất cứ thành nào của bạn
  rationale: “Trong mọi cổng của bạn” là thành ngữ chỉ các thành hoặc khu định cư; chuyển nghĩa giúp độc giả Việt hiểu đúng địa điểm được nói đến.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: Cả người ô uế lẫn người thanh sạch
  rationale: Chỉ tình trạng thanh sạch theo nghi lễ, không phải phẩm chất đạo đức; cấu trúc “cả... lẫn...” cho thấy hai nhóm đều được phép ăn.
- source_word: יֹאכְלֶנּוּ
  choice: đều có thể ăn thịt ấy
  rationale: Ngữ cảnh mang ý cho phép; đại từ hậu tố chỉ về thịt vừa được nói đến.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: như ăn thịt linh dương hay nai
  rationale: Nêu sự so sánh với thú săn không được dùng làm sinh tế; thêm “ăn thịt” để quan hệ so sánh rõ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Bản nguồn viết trực tiếp danh יהוה; “Yahweh” giữ đây là danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của “ô uế” và “thanh sạch”
  choice: Giữ các thuật ngữ chỉ tình trạng nghi lễ, không thêm chữ “theo nghi lễ” vào chính văn
  alternative: người ô uế về nghi lễ và người thanh sạch
  rationale: Ngữ cảnh luật pháp xác định phương diện nghi lễ; cách dịch ngắn gọn giữ nguyên thuật ngữ và tránh khiến câu nặng nề.
- issue: Giết súc vật tại địa phương có phải là dâng sinh tế hay không
  choice: Diễn đạt như sự cho phép giết để ăn
  alternative: bạn có thể làm lễ hiến tế và ăn thịt
  rationale: Trong mạch văn, câu này phân biệt việc giết lấy thịt thông thường với sinh tế phải đem đến nơi Yahweh chọn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ số ít “bạn” nhất quán với các hậu tố ngôi thứ hai số ít trong tiếng Hê-bơ-rơ. Giữ “Yahweh” như danh riêng; chọn “tại bất cứ thành nào” thay cho lối dịch sát “trong mọi cổng” và giải thích thành ngữ trong chú thích.
