- from: Tuy nhiên, bất cứ khi nào lòng bạn ao ước[a], bạn có thể giết súc vật và ăn thịt, tùy theo phước lành mà Yahweh, Đức Chúa Trời của bạn, đã ban cho bạn, tại bất cứ thành nào của bạn[b]. Cả người ô uế lẫn người thanh sạch đều có thể ăn thịt ấy, như ăn thịt linh dương hay nai.
  to: Nhưng bất cứ khi nào bạn muốn[a], bạn có thể giết súc vật và ăn thịt, tùy theo phước lành mà Yahweh, Đức Chúa Trời của bạn, đã ban cho bạn, trong mọi thành của bạn[b]. Cả người ô uế lẫn người thanh sạch đều có thể ăn thịt ấy, như người ta ăn thịt linh dương hay nai.
  rationale: Bản sửa làm mượt thành ngữ Hê-bơ-rơ trong tiếng Việt hiện đại nhưng giữ chú thích nêu cách diễn đạt gần nghĩa đen. “Trong mọi thành của bạn” phản ánh tốt hơn phạm vi của thành ngữ “trong mọi cổng của bạn”, và mệnh đề cuối được làm rõ để người đọc hiểu sự so sánh là về cách ăn thịt thú săn.
