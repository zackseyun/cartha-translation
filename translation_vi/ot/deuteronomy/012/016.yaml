source:
  edition: WLC
  text: רַ֥ק הַ/דָּ֖ם לֹ֣א תֹאכֵ֑לוּ עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/016.yaml
  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: vi
  text: Chỉ có điều, anh em không được ăn huyết; phải đổ huyết ấy xuống đất như nước.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Chỉ có điều
  rationale: Diễn đạt tự nhiên sức hạn định/ngoại lệ nối với sự cho phép ở phần trước, đồng thời giữ sắc thái chuyển ý của câu luật.
- source_word: הַדָּם
  choice: huyết
  rationale: “Huyết” là từ trang trọng, quen thuộc trong ngữ cảnh luật lệ Kinh Thánh; lần nhắc lại bằng “huyết ấy” thể hiện đối tượng xác định của mạo từ và đại từ hậu tố.
- source_word: לֹא תֹאכֵלוּ
  choice: anh em không được ăn
  rationale: Thể hiện trực tiếp lệnh cấm dành cho ngôi thứ hai số nhiều, với giọng luật lệ tự nhiên trong tiếng Việt hiện đại.
- source_word: עַל הָאָרֶץ
  choice: xuống đất
  rationale: Trong hành động cụ thể này, אֶרֶץ chỉ mặt đất; “xuống đất” là cách nói tự nhiên khi đi với động từ đổ.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: phải đổ huyết ấy
  rationale: Giữ tính bắt buộc của chỉ thị và làm rõ đại từ hậu tố giống đực số ít quay lại “huyết”, tránh đại từ tiếng Việt có thể thiếu rõ ràng.
- source_word: כַּמָּיִם
  choice: như nước
  rationale: Bảo toàn phép so sánh đơn giản và trực tiếp của nguyên văn.
theological_decisions:
- issue: Cách xử lý huyết trong luật ăn uống
  choice: Chuyển dịch thẳng như lệnh cấm ăn huyết và lệnh phải đổ huyết xuống đất.
  alternative: Giải thích huyết theo một ý nghĩa biểu tượng hoặc thần học về sau.
  rationale: Câu này nêu một chỉ thị pháp lý cụ thể; bản dịch không thêm cách diễn giải biểu tượng hay đặc thù hệ phái ngoài điều nguyên văn nói.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Dùng “anh em” để biểu đạt ngôi thứ hai số nhiều; dùng “huyết” thay cho “máu” nhằm phù hợp ngữ vực luật lệ Kinh Thánh mà vẫn thông dụng. Dấu chấm phẩy giữ quan hệ chặt giữa lệnh cấm và cách xử lý huyết.
