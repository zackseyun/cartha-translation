  text: וַ/הֲבֵאתֶ֣ם שָׁ֗מָּ/ה עֹלֹֽתֵי/כֶם֙ וְ/זִבְחֵי/כֶ֔ם וְ/אֵת֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם וְ/אֵ֖ת תְּרוּמַ֣ת יֶדְ/כֶ֑ם וְ/נִדְרֵי/כֶם֙ וְ/נִדְבֹ֣תֵי/כֶ֔ם וּ/בְכֹרֹ֥ת בְּקַרְ/כֶ֖ם וְ/צֹאנְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: vi
  text: Tại đó, anh em phải đem đến các lễ vật toàn thiêu, các sinh tế, các phần mười, phần lễ do tay anh em dâng[a], các lễ vật hoàn nguyện[b], các lễ vật tự nguyện, cùng những con đầu lòng trong đàn bò và đàn chiên dê của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “phần đóng góp của tay anh em” hoặc “phần lễ từ tay anh em”. Cụm từ Hê-bơ-rơ có chữ “tay”, nhấn mạnh phần lễ chính người dâng đem trình.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những lời khấn nguyện của anh em”. Trong danh sách này, từ ấy có lẽ chỉ các lễ vật được dâng để thực hiện lời khấn nguyện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: anh em phải đem đến
  rationale: Dạng Hiphil của בוא trong chỉ thị luật pháp yêu cầu cộng đồng đem các lễ vật đến địa điểm đã nói trước; “phải” diễn đạt lực quy định tự nhiên trong tiếng Việt.
- source_word: שָׁמָּה
  choice: tại đó
  rationale: Trạng từ chỉ về địa điểm thờ phượng đã được nêu ở câu trước, không bổ sung chi tiết ngoài nguyên văn.
- source_word: עֹלֹתֵיכֶם
  choice: các lễ vật toàn thiêu
  rationale: עוֹלָה là lễ vật được thiêu trọn vẹn trên bàn thờ; “lễ vật toàn thiêu” vừa chính xác vừa phân biệt với các sinh tế khác.
- source_word: זִבְחֵיכֶם
  choice: các sinh tế
  rationale: זֶבַח chỉ các con vật bị giết để hiến tế, là một phạm trù rộng và ở đây được phân biệt với lễ vật toàn thiêu.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: các phần mười
  rationale: Danh từ chỉ những phần bằng một phần mười được biệt riêng để dâng; cách dịch này rõ nghĩa hơn thuật ngữ Hán-Việt ít thông dụng.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: phần lễ do tay anh em dâng
  rationale: תְּרוּמָה là phần đóng góp hay lễ vật được biệt riêng; giữ hình ảnh “tay” của tiếng Hê-bơ-rơ nhưng diễn đạt tự nhiên trong tiếng Việt.
- source_word: נִדְרֵיכֶם
  choice: các lễ vật hoàn nguyện
  rationale: Nghĩa từ vựng trực tiếp là “những lời khấn nguyện”, nhưng trong danh sách những thứ phải đem đến, từ này nhiều khả năng chỉ các lễ vật được dâng để thực hiện lời nguyện; chú thích bảo lưu nghĩa sát chữ.
- source_word: נִדְבֹתֵיכֶם
  choice: các lễ vật tự nguyện
  rationale: Danh từ chỉ lễ vật được dâng tự nguyện, không phải do một lời khấn nguyện ràng buộc.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: những con đầu lòng trong đàn bò và đàn chiên dê của anh em
  rationale: בְּקָר chỉ gia súc lớn, đặc biệt là bò; צֹאן bao gồm gia súc nhỏ như chiên và dê. Cách dịch nói rõ hai nhóm vật nuôi mà vẫn giữ cấu trúc cặp đôi.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “anh em” thể hiện ngôi thứ hai số nhiều của nguyên văn. Các thuật ngữ tế lễ được phân biệt rõ, còn hình ảnh “tay” và khả năng hiểu נִדְרֵיכֶם theo nghĩa sát chữ được bảo lưu bằng chú thích.
