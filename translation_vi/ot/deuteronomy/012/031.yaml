revisions:
- from: Anh em không được làm như thế đối với Yahweh, Đức Chúa Trời của anh em, vì mọi điều ghê tởm đối với Yahweh mà Ngài căm ghét, chúng đều đã làm để thờ các thần của chúng; thậm chí chúng còn thiêu con trai và con gái mình trong lửa để dâng cho các thần của chúng.
  to: Anh em không được làm như thế đối với Yahweh, Đức Chúa Trời của anh em, vì chúng đã làm cho các thần của chúng mọi điều ghê tởm mà Yahweh căm ghét; thậm chí chúng còn thiêu con trai và con gái của chúng trong lửa cho các thần của chúng.
  rationale: 'Chỉnh trật tự mệnh đề để tiếng Việt sáng rõ và thay các cụm mục đích diễn giải bằng “cho các thần của chúng,” phản ánh sát hơn quan hệ tế tự do ל biểu thị. Không cần chú thích: cách diễn đạt “mọi điều ghê tởm mà Yahweh căm ghét” truyền đạt tự nhiên ý nghĩa quan hệ của cụm Hê-bơ-rơ mà không loại trừ một vấn đề văn bản đáng chú thích.'
