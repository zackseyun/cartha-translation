source:
  edition: WLC
  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: vi
  text: Anh em không được làm như thế đối với Yahweh, Đức Chúa Trời của anh em, vì chúng đã làm cho các thần của chúng mọi điều ghê tởm mà Yahweh căm ghét; thậm chí chúng còn thiêu con trai và con gái của chúng trong lửa cho các thần của chúng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן
  choice: Anh em không được làm như thế
  rationale: Giữ nguyên lời cấm và sự hồi chỉ về cách thờ phượng của các dân trong văn cảnh trước. Đại từ số nhiều tự nhiên trong tiếng Việt diễn đạt lời nói với cộng đồng Israel, dù tiếng Hê-bơ-rơ dùng số ít đại diện.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: đối với Yahweh, Đức Chúa Trời của anh em
  rationale: “Đối với” giữ quan hệ do ל biểu thị; “Yahweh” phiên âm danh giao ước, còn cụm “Đức Chúa Trời của anh em” bảo toàn công thức giao ước.
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: mọi điều ghê tởm đối với Yahweh mà Ngài căm ghét
  rationale: Hiểu cấu trúc là những điều đáng ghê tởm đối với Yahweh, rồi giữ nguyên mệnh đề quan hệ nhấn mạnh sự căm ghét của Ngài. Cách dịch này tự nhiên hơn trong tiếng Việt mà không làm nhẹ sức nặng đạo đức và tôn giáo.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: chúng đều đã làm để thờ các thần của chúng
  rationale: “Để thờ” diễn đạt hướng quy chiếu nghi lễ của ל trong tiếng Việt tự nhiên, tránh cách nói mơ hồ “làm cho các thần”.
- source_word: כִּי גַם
  choice: thậm chí ... còn
  rationale: Truyền đạt sức nhấn mạnh tăng tiến của גַם và đưa ra trường hợp gây kinh hãi nhất.
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: con trai và con gái mình
  rationale: Giữ sự nêu rõ cả con trai lẫn con gái; “mình” quy chiếu tự nhiên về chủ thể số nhiều trong tiếng Việt.
- source_word: יִשְׂרְפוּ בָאֵשׁ לֵאלֹהֵיהֶם
  choice: thiêu ... trong lửa để dâng cho các thần của chúng
  rationale: “Thiêu ... trong lửa” giữ nghĩa cụ thể của hành động; “để dâng cho” làm rõ hướng hiến tế của ל mà không thêm một hệ thống nghi lễ ngoài văn bản.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ danh riêng giao ước xuất hiện trực tiếp trong nguyên văn, phù hợp với lớp tham khảo đã được thẩm định.
- issue: Quan hệ cú pháp trong תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: mọi điều ghê tởm đối với Yahweh mà Ngài căm ghét
  alternative: mọi điều ghê tởm của Yahweh mà Ngài căm ghét
  rationale: 'Cụm sở thuộc có thể mang nghĩa quan hệ: điều Yahweh xem là ghê tởm. “Đối với Yahweh” tránh hàm ý sai rằng các điều ghê tởm thuộc về Ngài, đồng thời mệnh đề “mà Ngài căm ghét” được giữ riêng như nguyên văn.'
- issue: Mức độ mạnh của תּוֹעֵבָה và שָׂנֵא
  choice: điều ghê tởm; căm ghét
  alternative: điều đáng ghét; không ưa
  rationale: Giữ nguyên sức nặng trong sự đánh giá của Đức Chúa Trời, không uyển ngữ hóa hành vi hiến tế trẻ em.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” để diễn đạt lời giao ước hướng đến toàn dân Israel; dùng “chúng” cho các dân ngoại để phân biệt rõ hai nhóm. Không cần chú thích vì phương án quan hệ “đối với Yahweh” đã thể hiện tự nhiên nét nghĩa mà bản tiếng Anh ghi ở chú thích.
