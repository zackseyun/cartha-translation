  text: וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵי֮ יְהוָ֣ה אֱלֹֽהֵי/כֶם֒ אַתֶּ֗ם וּ/בְנֵי/כֶם֙ וּ/בְנֹ֣תֵי/כֶ֔ם וְ/עַבְדֵי/כֶ֖ם וְ/אַמְהֹתֵי/כֶ֑ם וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בְּ/שַֽׁעֲרֵי/כֶ֔ם כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: vi
  text: 'Anh em phải vui mừng trước mặt Yahweh, Đức Chúa Trời của anh em: anh em, con trai, con gái, các nô lệ nam và nô lệ nữ của anh em, cùng người Lê-vi đang ở trong các thành của anh em[a], vì người ấy không có phần hay sản nghiệp cùng với anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “ở trong các cổng của anh em”; thành ngữ này có thể chỉ các thành hoặc cộng đồng của anh em.'
    reason: Giải thích nghĩa hoán dụ của שְׁעָרִים và bảo lưu hình ảnh nguyên ngữ.
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: Anh em phải vui mừng
  rationale: Động từ số nhiều trong mạch luật lệ mang sắc thái mệnh lệnh; “phải vui mừng” tự nhiên và giữ được ý vui mừng trong sự thờ phượng.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: trước mặt Yahweh, Đức Chúa Trời của anh em
  rationale: “Trước mặt” diễn đạt thành ngữ chỉ sự hiện diện; “Yahweh” giữ danh riêng của Đức Chúa Trời trong nguyên văn.
- source_word: אַתֶּם וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: anh em cùng con trai, con gái
  rationale: Đại từ số nhiều được thể hiện bằng “anh em”; giữ nguyên cặp con trai và con gái được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: tôi trai, tớ gái của anh em
  rationale: Cặp từ chỉ những người nam và nữ ở địa vị lệ thuộc trong gia hộ. “Tôi trai, tớ gái” giữ phân biệt giới và địa vị xã hội, đồng thời phù hợp văn phong Kinh Thánh trang trọng hơn cách nói hiện đại dễ gây liên tưởng ngoài ngữ cảnh là “nô lệ nam, nô lệ nữ”.
- source_word: וְהַלֵּוִי
  choice: người Lê-vi
  rationale: Cách gọi tự nhiên trong tiếng Việt dành cho một thành viên thuộc chi phái Lê-vi.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: ở trong các thành của anh em
  rationale: “Các cổng” là hoán dụ Hê-bơ-rơ thường chỉ thành hoặc cộng đồng cư trú; dịch “các thành” truyền đạt nghĩa trong tiếng Việt, còn nghĩa đen được ghi chú.
- source_word: כִּי אֵין לוֹ חֵלֶק וְנַחֲלָה אִתְּכֶם
  choice: vì người ấy không có phần hay cơ nghiệp chung với anh em
  rationale: “Vì” giữ quan hệ nguyên nhân; “phần hay cơ nghiệp” bảo toàn hai danh từ gần nghĩa nhưng không đồng nhất, còn “chung với” làm rõ quan hệ phân chia đất với dân Israel.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” phân biệt danh riêng với tước hiệu mà không áp đặt một cách đọc hệ phái.
- issue: Địa vị của עֶבֶד và אָמָה trong gia hộ
  choice: tôi trai, tớ gái
  alternative: đầy tớ nam, đầy tớ nữ / nô lệ nam, nô lệ nữ
  rationale: Bản dịch không xóa địa vị lệ thuộc của họ, đồng thời dùng cặp từ trang trọng, dễ đọc trong tiếng Việt và giữ sự phân biệt nam-nữ của nguyên văn.
- issue: Phần và cơ nghiệp của người Lê-vi
  choice: không có phần hay cơ nghiệp chung với anh em
  alternative: không có phần và cơ nghiệp giữa anh em
  rationale: Giữ nguyên sức căng của cặp חֵלֶק וְנַחֲלָה mà không giải thích thêm rằng đây chỉ là đất đai, dù bối cảnh hướng mạnh đến phần đất được phân chia.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời luật giao ước; dùng dấu gạch ngang để mở danh sách bao gồm toàn thể gia hộ và người Lê-vi.
