  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: vi
  text: Nếu nơi mà Yahweh, Đức Chúa Trời của anh em, chọn để đặt danh Ngài tại đó quá xa anh em, thì anh em có thể giết thịt từ đàn bò và đàn chiên dê của anh em mà Yahweh đã ban cho anh em, theo như tôi đã truyền cho anh em, và ăn trong các thành của anh em[a], tùy lòng anh em ao ước[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong các cổng của anh em”, một cách nói chỉ các thành hoặc khu dân cư.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “theo mọi điều tâm hồn anh em ao ước” hoặc “tùy theo khẩu vị của anh em”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: Nếu ... quá xa anh em
  rationale: כִּי cùng động từ chưa hoàn thành mở ra hoàn cảnh có điều kiện trong điều luật. “Quá xa” diễn đạt tự nhiên ý nghĩa thực tiễn của רחק trong ngữ cảnh này.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: nơi ... chọn
  rationale: Tiếng Việt không buộc phải đánh dấu thì; “chọn” giữ được độ mở giữa ý hiện tại khái quát và tương lai của יִבְחַר trong diễn ngôn luật pháp.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: để đặt danh Ngài tại đó
  rationale: Theo sát động từ שׂים, “đặt”, và giữ nguyên công thức về nơi thánh trong Phục Truyền Luật Lệ Ký mà không diễn giải thành “khiến danh Ngài ngự”.
- source_word: וְזָבַחְתָּ
  choice: thì anh em có thể giết thịt
  rationale: Trong mạch văn, đây là sự cho phép giết súc vật tại địa phương để ăn, không phải thiết lập một nghi lễ hiến tế. “Có thể” thể hiện lực cho phép; “giết thịt” tự nhiên và tránh hàm ý dâng tế lễ.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: bò hoặc chiên dê thuộc các đàn
  rationale: בקר chỉ đàn gia súc lớn, còn צאן là thuật ngữ tập hợp cho đàn gia súc nhỏ gồm chiên và dê. Cách dịch này rõ nghĩa đối với độc giả hiện đại.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: theo như tôi đã truyền cho anh em
  rationale: Giữ nguyên ngôi thứ nhất của Môi-se và mối liên hệ với mệnh lệnh đã được ban trước đó, không suy đoán nội dung cụ thể của mệnh lệnh.
- source_word: בִּשְׁעָרֶיךָ
  choice: tại các thành của mình
  rationale: “Các cổng của anh em” là phép hoán dụ Hê-bơ-rơ chỉ các thành hoặc khu dân cư. Dịch ý trong chính văn để tránh cách nói khó hiểu, đồng thời ghi nghĩa đen ở chú thích.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: thỏa mọi điều lòng mình ao ước
  rationale: Diễn đạt tự nhiên ý ham muốn hoặc khẩu vị của נֶפֶשׁ trong ngữ cảnh ăn uống, nhưng vẫn giữ sắc thái ước muốn nội tâm thay vì thu hẹp hoàn toàn thành “khẩu vị”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh. Giữ “Yahweh” bảo tồn tư cách danh riêng giao ước mà không thay bằng tước hiệu.
- issue: Tính chất của hành động זבח tại địa phương
  choice: giết thịt, với lực cho phép
  alternative: dâng tế lễ / phải giết
  rationale: Ngữ cảnh cho phép giết súc vật để dùng làm thức ăn khi nơi được chọn ở xa. Dịch là “dâng tế lễ” có thể gây hiểu lầm rằng việc tế lễ tại địa phương được cho phép; còn “phải giết” làm mất lực cho phép của điều khoản.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để thể hiện lời luật pháp hướng đến cộng đồng Ít-ra-ên, dù các hình thái Hê-bơ-rơ ở số ít. Viết “Ngài” khi quy chiếu đến Yahweh. Hai câu tiếng Việt được dùng để tránh một câu quá dài, trong khi vẫn giữ trình tự điều kiện, cho phép giết thịt và cho phép ăn.
