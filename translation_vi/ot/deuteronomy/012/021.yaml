revisions:
- from: Nếu nơi Yahweh, Đức Chúa Trời của anh em, chọn để đặt danh Ngài tại đó quá xa anh em, thì anh em có thể giết thịt bò hoặc chiên dê thuộc các đàn mà Yahweh đã ban cho anh em, theo như tôi đã truyền cho anh em. Anh em có thể ăn tại các thành của mình[a], thỏa mọi điều lòng mình ao ước[b].
  to: Nếu nơi mà Yahweh, Đức Chúa Trời của anh em, chọn để đặt danh Ngài tại đó quá xa anh em, thì anh em có thể giết thịt từ đàn bò và đàn chiên dê của anh em mà Yahweh đã ban cho anh em, theo như tôi đã truyền cho anh em, và ăn trong các thành của anh em[a], tùy lòng anh em ao ước[b].
  rationale: Sửa liên từ “hoặc” thành “và” để phản ánh chính xác hai nhóm vật nuôi trong nguyên văn. Đồng thời nhất quán đại từ xưng hô ở cụm chỉ địa điểm, giữ nghĩa hoán dụ trong chú thích, và bảo tồn lực cho phép của điều luật cũng như sắc thái mở của cụm chỉ ước muốn.
