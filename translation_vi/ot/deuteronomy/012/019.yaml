source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲזֹ֖ב אֶת הַ/לֵּוִ֑י כָּל יָמֶ֖י/ךָ עַל אַדְמָתֶֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: vi
  text: Hãy cẩn thận, đừng bỏ mặc người Lê-vi suốt những ngày anh em sống trên đất mình.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người Lê-vi”; tiếng Hê-bơ-rơ dùng số ít “người Lê-vi”, có lẽ để đại diện cho cả tầng lớp Lê-vi.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “trong đất mình”. Tiếng Hê-bơ-rơ theo nghĩa sát chữ là “trên đất mình”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy cẩn thận
  rationale: Cấu trúc mệnh lệnh Nifal với לְךָ là lời cảnh báo mang nghĩa tự giữ mình, thận trọng; cách dịch này tự nhiên và giữ được sắc thái khuyên răn.
- source_word: פֶּן
  choice: đừng
  rationale: פֶּן mở đầu mệnh đề cảnh báo phủ định; “đừng” diễn đạt trực tiếp và tự nhiên trong tiếng Việt hiện đại.
- source_word: תַּעֲזֹב
  choice: bỏ mặc
  rationale: עזב có thể là lìa bỏ, bỏ rơi hoặc bỏ mặc. Trong bối cảnh trách nhiệm xã hội đối với người Lê-vi, “bỏ mặc” vừa tự nhiên vừa giữ sức nặng đạo đức, không thu hẹp thành chỉ ‘xao nhãng’.
- source_word: אֶת הַלֵּוִי
  choice: người Lê-vi
  rationale: Nguyên văn dùng danh từ số ít có mạo từ, có lẽ là số ít đại diện cho cả tầng lớp Lê-vi. Giữ số ít phản ánh hình thức Hê-bơ-rơ.
- source_word: כָּל יָמֶיךָ
  choice: suốt những ngày anh em sống
  rationale: Diễn đạt thành ngữ “mọi ngày của anh em” bằng tiếng Việt tự nhiên, với ý nghĩa xuyên suốt đời sống, đồng thời không nhập cụm địa điểm vào mệnh đề thời gian.
- source_word: עַל אַדְמָתֶךָ
  choice: trên đất mình
  rationale: “Đất” phù hợp với אַדְמָה trong bối cảnh giao ước; “trên” phản ánh trực tiếp עַל, còn “mình” quy chiếu tự nhiên về người được truyền lệnh.
theological_decisions:
- issue: Số ít đại diện khi nói đến người Lê-vi
  choice: người Lê-vi
  alternative: những người Lê-vi
  rationale: Bản Hê-bơ-rơ dùng số ít có mạo từ, nhiều khả năng chỉ một thành viên đại diện cho cả tầng lớp. Giữ số ít bảo tồn hình thức và độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít giống đực hướng đến thành viên cộng đồng giao ước; dùng “người Lê-vi” thay vì dạng phiên âm cổ hơn. Các dấu chú thích đều được đặt trong chính văn.
