  source_fidelity: Bản dịch phản ánh đúng lời cảnh báo הִשָּׁמֶר לְךָ và mệnh đề phủ định với פֶּן. “Đừng bỏ mặc” truyền đạt phù hợp ý nghĩa עזב trong bối cảnh trách nhiệm đối với người Lê-vi. “Người Lê-vi” giữ đúng số ít có tính đại diện của הַלֵּוִי. Cụm “suốt những ngày anh em sống trên đất mình” diễn đạt đầy đủ phạm vi thời gian và địa điểm của כָּל־יָמֶיךָ עַל־אַדְמָתֶךָ, không thêm nội dung thần học.
  naturalness: Câu tiếng Việt hiện đại, rõ nghĩa, có sắc thái khuyến cáo trang trọng phù hợp văn mạch Phục truyền. “Anh em” là cách xưng hô Kinh Thánh tự nhiên khi hướng đến cộng đồng giao ước; “mình” quy chiếu sở hữu trong cách dùng này không gây mơ hồ đáng kể.
  terminology: “Lê-vi” là cách viết tên riêng nhất quán và phổ biến. “Bỏ mặc” giữ được trọng lượng đạo đức-xã hội mà không diễn giải quá mức. Hai chú thích phản ánh chính xác các lựa chọn từ vựng và vị trí neo chú thích phù hợp với các cụm liên quan.
