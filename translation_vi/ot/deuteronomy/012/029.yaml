revisions:
- from: Khi Giê-hô-va, Đức Chúa Trời của anh em, diệt trừ khỏi trước mặt anh em các dân tộc mà anh em sắp vào xứ để chiếm lấy, và khi anh em đã chiếm được đất của họ rồi cư ngụ tại đó,
  to: Khi Yahweh, Đức Chúa Trời của ngươi, diệt trừ trước mặt ngươi các dân tộc mà ngươi đi vào đó để truất quyền sở hữu của họ, và ngươi truất quyền sở hữu của họ rồi cư ngụ trong đất của họ,
  rationale: Bản sửa giữ câu phụ thuộc mở đầu bằng “Khi” và dấu phẩy kết câu; phục hồi nhất quán ngôi thứ hai số ít; bỏ “sắp” và “xứ” được thêm vào; giữ các dân tộc là đối tượng của cả hai lần ירש; và thống nhất việc chuyển tự danh thánh với hồ sơ POB.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:07:47Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp diễn đạt đúng cấu trúc thời gian của כִּי và chuỗi hành động chính, nhưng đổi ngôi thứ hai số ít của tiếng Hê-bơ-rơ thành “anh em”, thêm sắc thái “sắp”, và chuyển trực tiếp đối tượng “các dân tộc/họ” của ירש thành “đất của họ”. Những điều này làm giảm độ sát của bản dịch.
  naturalness: Câu văn nhìn chung trang trọng, dễ đọc và việc để dấu phẩy cuối câu là đúng vì câu 29 dẫn sang câu 30. Tuy nhiên, “sắp vào xứ” vừa thêm nghĩa vừa không cần thiết. “Ngươi” phù hợp với ngôi số ít đại diện của nguyên văn và vẫn tự nhiên trong văn phong Kinh Thánh hiện đại.
  terminology: Dùng “Yahweh” để nhất quán với quyết định danh thánh trong hồ sơ POB. “Truất quyền sở hữu” diễn đạt ירש khi đối tượng trực tiếp là các dân tộc, tránh biến đối tượng ngữ pháp thành “đất” và không áp đặt phương thức cụ thể như “đánh đuổi”.
  issues:
  - severity: medium
    issue: Ngôi xưng hô số ít bị đổi thành số nhiều.
    rationale: 'Các hậu tố và động từ ngôi hai trong câu đều là số ít: אֱלֹהֶיךָ, אַתָּה, מִפָּנֶיךָ, וְיָרַשְׁתָּ, וְיָשַׁבְתָּ. Dù hướng đến Israel tập thể, bản dịch nên giữ “ngươi” để phản ánh hình thức nguyên văn.'
  - severity: medium
    issue: “Sắp vào xứ” thêm sắc thái chưa có trong nguyên văn.
    rationale: בָּא שָׁמָּה có nghĩa “đi/vào đó”; không có yếu tố từ vựng tương ứng với “sắp”, và “xứ” không được nêu ở cụm này.
  - severity: medium
    issue: Hai lần ירש có đối tượng là các dân tộc nhưng bản nháp lần thứ hai chuyển thành “chiếm được đất của họ”.
    rationale: Trong ngữ cảnh, động từ hàm ý thay thế cư dân để chiếm hữu đất, nhưng nguyên văn vẫn đặt các dân tộc làm đối tượng trực tiếp. Cần giữ rõ đối tượng này mà không thêm chi tiết về phương thức.
  - severity: low
    issue: Tên riêng thần linh chưa nhất quán với hồ sơ POB tiếng Anh.
    rationale: Hồ sơ quyết định dịch יְהוָה là “Yahweh”. Dùng cùng dạng này trong bản tiếng Việt bảo đảm tính nhất quán của dự án; có thể giải thích cách đọc bằng chú thích.
  revised_text: Khi Yahweh, Đức Chúa Trời của ngươi, diệt trừ trước mặt ngươi các dân tộc mà ngươi đi vào đó để truất quyền sở hữu của họ, và ngươi truất quyền sở hữu của họ rồi cư ngụ trong đất của họ,
  revised_footnotes:
  - marker: a
    text: “Truất quyền sở hữu của họ” dịch động từ Hê-bơ-rơ yarash. Trong ngữ cảnh này, các dân tộc là đối tượng trực tiếp; cách diễn đạt chỉ việc họ bị mất quyền chiếm hữu khi Israel tiếp nhận đất, nhưng không xác định riêng phương thức xảy ra.
    reason: Làm rõ cách diễn đạt tiếng Việt cần dùng cụm sở hữu để chuyển tải động từ có đối tượng là các dân tộc, đồng thời không thêm ý về phương thức.
  - marker: b
    text: Yahweh là cách chuyển tự danh riêng của Đức Chúa Trời trong tiếng Hê-bơ-rơ.
    reason: Giải thích dạng tên riêng được dùng theo quy ước POB.
  revision_rationale: Bản sửa giữ câu phụ thuộc mở đầu bằng “Khi” và dấu phẩy kết câu; phục hồi nhất quán ngôi thứ hai số ít; bỏ “sắp” và “xứ” được thêm vào; giữ các dân tộc là đối tượng của cả hai lần ירש; và thống nhất việc chuyển tự danh thánh với hồ sơ POB.
