language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: vi
  text: Khi Yahweh, Đức Chúa Trời của ngươi, diệt trừ trước mặt ngươi các dân tộc mà ngươi đi vào đó để truất quyền sở hữu của họ, và ngươi truất quyền sở hữu của họ rồi cư ngụ trong đất của họ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Ở đây từ này mở đầu hoàn cảnh tương lai làm nền cho lời cảnh báo tiếp theo, nên nghĩa thời gian “Khi” phù hợp hơn nghĩa nguyên nhân.
- source_word: יַכְרִית
  choice: diệt trừ
  rationale: Thể Hiphil của כרת chỉ việc loại bỏ các dân tộc khỏi trước mặt Israel; “diệt trừ” diễn đạt mạnh nhưng không nhất thiết áp đặt ý tuyệt diệt vượt quá câu chữ.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng đã quen thuộc và dễ nhận biết trong tiếng Việt cho Danh Thánh, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Phản ánh cấu trúc sở hữu ngôi hai số ít giống đực; trong tiếng Việt, “anh em” phù hợp lối diễn đạt cộng đồng khi một dân được xưng hô như một tập thể.
- source_word: הַגּוֹיִם
  choice: các dân tộc
  rationale: Đây là cách dịch trực tiếp, tự nhiên, chỉ các cộng đồng đang cư trú trong đất.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: mà anh em sắp vào xứ để chiếm lấy
  rationale: Tiếng Hê-bơ-rơ nói sát là “mà anh em đi vào đó để chiếm hữu họ”; tiếng Việt tự nhiên cần nêu “xứ” làm nơi đi vào, còn “chiếm lấy” giữ độ rộng nghĩa của ירש.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt anh em
  rationale: Giữ hình ảnh không gian của thành ngữ Hê-bơ-rơ, chỉ việc các dân bị loại khỏi đường đi hoặc sự hiện diện của Israel.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: anh em đã chiếm được đất của họ
  rationale: Đối tượng ngữ pháp là các dân tộc, nhưng trong ngữ cảnh ירש gắn với việc thay họ làm chủ đất; cách diễn đạt này tự nhiên trong tiếng Việt và tránh câu khó hiểu “chiếm lấy họ”.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: cư ngụ tại đó
  rationale: ישב mang nghĩa ở, định cư hoặc cư ngụ. “Cư ngụ” giữ giọng trang trọng vừa phải; “tại đó” quy chiếu tự nhiên về đất của họ.
theological_decisions:
- issue: Cách thể hiện Danh Thánh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh (Gia-vê) hoặc CHÚA
  rationale: Giữ đây là tên riêng thay vì đổi thành tước hiệu; “Giê-hô-va” là dạng tiếng Việt phổ biến, dễ hiểu đối với độc giả phổ thông, dù cách phục nguyên học thuật thường dùng “Yahweh”.
- issue: Phạm vi nghĩa của ירש khi đối tượng là các dân tộc
  choice: chiếm lấy / chiếm được đất của họ
  alternative: truất hữu họ hoặc đánh đuổi họ
  rationale: ירש có thể nhấn mạnh chiếm hữu hoặc khiến cư dân mất quyền sở hữu. Bản dịch giữ sự căng nghĩa bằng cách dùng “chiếm lấy” trước, rồi làm rõ kết quả là chiếm đất, không tự ý thêm phương thức cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ câu phụ thuộc kết thúc bằng dấu phẩy vì câu 29 dẫn trực tiếp sang lời cảnh báo ở câu 30. Đại từ “anh em” được dùng cho ngôi hai số ít tập thể, phù hợp cách xưng hô cộng đồng trong Phục Truyền Luật Lệ Ký.
