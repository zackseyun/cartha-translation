base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: vi
  text: 'Khi Giê-hô-va, Đức Chúa Trời của anh em, mở rộng lãnh thổ của anh em như Ngài đã phán với anh em, và anh em nói: “Tôi muốn ăn thịt,” vì lòng anh em thèm ăn thịt, thì anh em có thể ăn thịt thỏa lòng mình.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt để thể hiện danh riêng của Đức Chúa Trời trong nguyên văn.
- source_word: יַרְחִיב ... אֶת גְּבוּלְךָ
  choice: mở rộng lãnh thổ của anh em
  rationale: Diễn đạt tự nhiên ý mở rộng ranh giới địa lý mà vẫn giữ sát hình ảnh của nguyên văn.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: 'và anh em nói: “Tôi muốn ăn thịt”'
  rationale: Dạng cohortative אֹכְלָה trong ngữ cảnh biểu thị ý muốn, nên dịch là “muốn ăn” thay vì lời tuyên bố đơn thuần “sẽ ăn”.
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: lòng anh em thèm
  rationale: נפשׁ ở đây chỉ bản thân hay lòng ham muốn; “lòng... thèm” tự nhiên trong tiếng Việt và tránh khiến “linh hồn” mang nghĩa phân đôi bản thể không có trong câu.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: thỏa lòng mình
  rationale: Chuyển thành ngữ Hê-bơ-rơ sang cách nói Việt tự nhiên, diễn đạt sự cho phép ăn theo trọn điều mình ao ước.
theological_decisions:
- issue: Cách thể hiện danh Đức Chúa Trời יהוה
  choice: Giê-hô-va
  alternative: CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה; phiên âm giúp phân biệt với tước hiệu אֲדֹנָי mà không thêm một lập trường giáo phái vào nội dung câu.
- issue: Phạm vi của sự cho phép ăn thịt
  choice: thì anh em có thể ăn thịt thỏa lòng mình
  alternative: anh em được ăn bất cứ thứ thịt nào mình muốn
  rationale: Giữ sự cho phép rộng trong câu nhưng không diễn giải thành việc cho phép mọi loại thịt, vì các giới hạn về con vật thanh sạch và huyết nằm trong văn cảnh tiếp theo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số ít trong tiếng Hê-bơ-rơ được chuyển thành “anh em” theo lối diễn đạt cộng đồng quen thuộc của Phục truyền luật lệ ký; “Ngài” quy chiếu rõ về Giê-hô-va.
