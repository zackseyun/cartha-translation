  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּנָּקֵשׁ֙ אַחֲרֵי/הֶ֔ם אַחֲרֵ֖י הִשָּׁמְדָ֣/ם מִ/פָּנֶ֑י/ךָ וּ/פֶן תִּדְרֹ֨שׁ לֵֽ/אלֹהֵי/הֶ֜ם לֵ/אמֹ֨ר אֵיכָ֨ה יַעַבְד֜וּ הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֶת אֱלֹ֣הֵי/הֶ֔ם וְ/אֶעֱשֶׂה כֵּ֖ן גַּם אָֽנִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: vi
  text: 'Hãy cẩn thận giữ mình, kẻo ngươi sa bẫy mà theo chúng sau khi chúng đã bị tiêu diệt khỏi trước mặt ngươi; cũng kẻo ngươi hỏi về các thần của chúng mà nói: “Các dân tộc này thờ các thần của họ thế nào, để ta cũng làm như vậy?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy cẩn thận giữ mình
  rationale: Giữ sắc thái mệnh lệnh phản thân của לְךָ, đồng thời diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: פֶּן תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: kẻo anh em mắc bẫy mà đi theo chúng
  rationale: תִּנָּקֵשׁ là hình ảnh bị mắc bẫy; אַחֲרֵיהֶם có nghĩa đen là “theo sau chúng”, ở đây hàm ý bị lôi cuốn theo đường lối của chúng.
- source_word: הִשָּׁמְדָם מִפָּנֶיךָ
  choice: chúng đã bị tiêu diệt khỏi trước mặt anh em
  rationale: Phản ánh thể bị động của động từ và thành ngữ מִפָּנֶיךָ, không thêm tác nhân không được nêu trong câu.
- source_word: תִדְרֹשׁ לֵאלֹהֵיהֶם
  choice: tìm hiểu về các thần của chúng
  rationale: Trong ngữ cảnh, דָּרַשׁ chỉ việc dò hỏi, tìm hiểu cách thờ các thần ngoại bang, không nhất thiết mang nghĩa cầu vấn để xin lời sấm.
- source_word: יַעַבְדוּ
  choice: đã thờ
  rationale: Động từ עבד với đối tượng là thần linh mang nghĩa phụng sự hay thờ phượng; “thờ” tự nhiên và rõ ràng trong tiếng Việt.
- source_word: וְאֶעֱשֶׂה כֵּן גַּם־אָנִי
  choice: để tôi cũng làm như vậy
  rationale: Giữ quan hệ mục đích/hệ quả trong lời tự nhủ và nhấn mạnh גַּם־אָנִי là “tôi cũng”.
theological_decisions:
- issue: Phạm vi của lời cảnh báo về việc tìm hiểu các thần ngoại bang
  choice: Dịch trực tiếp là “đừng tìm hiểu về các thần của chúng” trong mạch ý nhằm bắt chước cách thờ phượng ấy
  alternative: Diễn giải thành lệnh cấm mọi sự nghiên cứu về tôn giáo ngoại bang
  rationale: Câu Hê-bơ-rơ gắn việc tìm hiểu với lời nói “để tôi cũng làm như vậy”; bản dịch không mở rộng lệnh cấm vượt quá điều văn bản nêu.
- issue: Tác nhân tiêu diệt các dân tộc
  choice: Dùng cấu trúc bị động, không nêu tác nhân
  alternative: Thêm “Đức Chúa Trời đã tiêu diệt chúng”
  rationale: Dù văn mạch có thể cho thấy tác nhân, câu này dùng dạng bị động; giữ nguyên giúp tránh bổ sung điều không được phát biểu trực tiếp.
translation_notes:
  register: Văn phong trang trọng, dễ hiểu. Đại từ số nhiều “anh em” diễn đạt người nghe tập thể dù các hình thức Hê-bơ-rơ trong câu là số ít, phù hợp cách xưng hô cộng đồng trong tiếng Việt; “chúng” chỉ các dân tộc sắp bị trục xuất.
