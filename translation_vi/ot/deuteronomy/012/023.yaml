source:
  edition: WLC
  text: רַ֣ק חֲזַ֗ק לְ/בִלְתִּי֙ אֲכֹ֣ל הַ/דָּ֔ם כִּ֥י הַ/דָּ֖ם ה֣וּא הַ/נָּ֑פֶשׁ וְ/לֹא תֹאכַ֥ל הַ/נֶּ֖פֶשׁ עִם הַ/בָּשָֽׂר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: vi
  text: Nhưng con phải hết sức cẩn thận, không được ăn huyết[a], vì huyết là sự sống; con không được ăn sự sống cùng với thịt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “linh hồn” cho từ “sự sống” ở cả hai chỗ. Từ Hê-bơ-rơ này ở đây chỉ sự sống làm cho con vật sống, nên nhiều bản dịch dịch là “sự sống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Chỉ
  rationale: Đánh dấu sự hạn chế mạnh đối với quyền được ăn thịt đã nêu trước đó; “Chỉ” là cách diễn đạt gọn và tự nhiên.
- source_word: חֲזַק
  choice: phải quyết tâm
  rationale: Nghĩa đen là “hãy mạnh mẽ”, nhưng khi đi với לְבִלְתִּי, đây là lời thúc giục kiên quyết tránh làm điều gì; “phải quyết tâm” giữ được sức nặng của mệnh lệnh.
- source_word: לְבִלְתִּי אֲכֹל
  choice: không ăn
  rationale: Diễn đạt nội dung cấm đoán gắn với lời thúc giục phải kiên quyết.
- source_word: הַדָּם
  choice: huyết
  rationale: “Huyết” là từ trang trọng, quen thuộc trong văn phong Kinh Thánh và phù hợp với quy định nghi lễ; được dùng nhất quán ở cả hai lần.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho lệnh cấm một cách tự nhiên trong tiếng Việt.
- source_word: הַנָּפֶשׁ
  choice: sự sống
  rationale: Trong ngữ cảnh này, נֶפֶשׁ chỉ sinh lực hay sự sống của sinh vật, không nhất thiết là một linh hồn phi vật chất.
- source_word: וְלֹא תֹאכַל
  choice: con không được ăn
  rationale: Thể chưa hoàn thành trong lời luật mang lực cấm đoán; “không được” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: sự sống cùng với thịt
  rationale: 'Giữ hình ảnh cụ thể và mối liên kết từ vựng với mệnh đề trước: huyết là sự sống, nên không được ăn sự sống cùng với phần thịt.'
theological_decisions:
- issue: Ý nghĩa của נֶפֶשׁ trong luật ăn uống
  choice: sự sống
  alternative: linh hồn
  rationale: “Sự sống” phù hợp với lập luận của câu rằng huyết chính là sự sống của sinh vật, đồng thời tránh áp đặt quan niệm nhị nguyên thân xác–linh hồn mà từ Hê-bơ-rơ ở đây không đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp với lời Môi-se trực tiếp truyền dạy dân Y-sơ-ra-ên theo lối số ít tập thể. Dấu chấm phẩy làm rõ quan hệ giữa lý do và lệnh cấm được nhắc lại.
