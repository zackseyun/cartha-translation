source:
  edition: WLC
  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: vi
  text: Anh em phải triệt phá tất cả những nơi mà các dân tộc anh em sắp tước đất đã phụng thờ các thần của họ[a]—trên những núi cao, trên các đồi và dưới mọi cây xanh tốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã phục vụ các thần của họ tại đó.” Động từ Hê-bơ-rơ có nghĩa cơ bản là “phục vụ” và trong ngữ cảnh tôn giáo có thể mang nghĩa “phụng thờ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: phải triệt phá
  rationale: Kết cấu nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh mệnh lệnh. “Phải triệt phá” diễn đạt sức mạnh bắt buộc và sự phá bỏ dứt khoát bằng tiếng Việt hiện đại, tự nhiên.
- source_word: הַמְּקֹמוֹת
  choice: tất cả những nơi
  rationale: Từ này chỉ các địa điểm cụ thể dùng cho việc thờ cúng. “Những nơi” giữ cách nói trực tiếp của tiếng Hê-bơ-rơ, không diễn giải quá mức thành “nơi thờ tự”.
- source_word: עָבְדוּ שָׁם ... אֶת אֱלֹהֵיהֶם
  choice: đã phụng thờ các thần của họ tại đó
  rationale: Khi có các thần làm đối tượng, עבד mang nghĩa phục vụ theo nghĩa tôn giáo, tức phụng thờ. Cách đặt “tại đó” được thể hiện tự nhiên qua mệnh đề “những nơi mà ... đã phụng thờ”, còn chú thích bảo lưu cách dịch sát hơn là “phục vụ”.
- source_word: הַגּוֹיִם
  choice: các dân tộc
  rationale: Chỉ các dân cư ngoài Y-sơ-ra-ên trong xứ. “Các dân tộc” phù hợp bối cảnh và không đưa vào sắc thái của thuật ngữ tôn giáo thời kỳ muộn hơn.
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: anh em sắp tước đất
  rationale: Trong bối cảnh chinh phục, ירשׁ diễn tả việc chiếm hữu bằng cách làm cho cư dân trước mất quyền sở hữu. “Tước đất” nêu được tác động đối với các dân tộc; “sắp” phù hợp với hành động đang ở trước mắt người nghe.
- source_word: אֱלֹהֵיהֶם
  choice: các thần của họ
  rationale: Giữ nguyên nghĩa số nhiều và sở hữu của tiếng Hê-bơ-rơ.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: trên những núi cao
  rationale: Cách dịch trực tiếp danh từ và tính từ, giữ hình ảnh các địa điểm thờ cúng ở nơi cao.
- source_word: הַגְּבָעוֹת
  choice: các đồi
  rationale: Tương ứng trực tiếp với nghĩa của גבעות, không diễn giải thành riêng phần đỉnh đồi.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: dưới mọi cây xanh tốt
  rationale: רַעֲנָן gợi cây tươi xanh, sum suê. “Xanh tốt” tự nhiên trong tiếng Việt và giữ sắc thái sinh trưởng dồi dào hơn chỉ “cây xanh”.
theological_decisions:
- issue: Đối tượng của mệnh lệnh phá hủy
  choice: Mệnh lệnh trực tiếp nhắm vào các địa điểm gắn với việc phụng thờ các thần của những dân tộc bị tước đất.
  alternative: Diễn rộng thành việc xóa bỏ toàn bộ các tập tục thờ thần ngoại giáo.
  rationale: Tân ngữ rõ ràng trong tiếng Hê-bơ-rơ là “tất cả những nơi”. Bản dịch giữ trọng tâm cụ thể ấy, không biến hệ quả rộng hơn thành nội dung trực tiếp của câu.
- issue: Nghĩa tôn giáo của עבד
  choice: phụng thờ
  alternative: phục vụ
  rationale: Động từ cơ bản có nghĩa “phục vụ”, nhưng khi các thần là đối tượng thì nó thường chỉ sự thờ phượng. Chú thích bảo lưu phạm vi từ vựng thay vì xóa bỏ sự liên hệ giữa phục vụ và thờ phượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều nhằm nói với cộng đồng Y-sơ-ra-ên; tránh lối cổ “các ngươi”. Dấu gạch ngang giúp chuỗi địa điểm cuối câu gắn rõ với “tất cả những nơi”.
