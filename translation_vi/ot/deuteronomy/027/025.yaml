  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: vi
  text: '“Đáng nguyền rủa là kẻ nhận hối lộ để giết một người vô tội[a].” Và toàn dân phải nói: “A-men!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “để đánh hạ một sinh mạng, máu vô tội.” Đây là một thành ngữ Hê-bơ-rơ chỉ việc giết một người vô tội.
    reason: Giữ hình ảnh “máu vô tội” của nguyên ngữ và giải thích thành ngữ trong khi chính văn dùng cách diễn đạt tự nhiên.
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Diễn đạt tự nhiên công thức nguyền rủa giao ước ở đầu câu, đồng thời giữ sắc thái trang trọng và phán quyết.
- source_word: לֹקֵחַ
  choice: kẻ nhận
  rationale: Phân từ Qal được dùng như danh từ, chỉ một người bất kỳ thực hiện hành vi; “kẻ nhận” ngắn gọn và phù hợp sắc thái lên án.
- source_word: שֹׁחַד
  choice: hối lộ
  rationale: Thuật ngữ pháp lý thông dụng chỉ lợi ích bất chính được nhận nhằm làm sai lệch công lý hoặc thúc đẩy tội ác.
- source_word: לְהַכּוֹת
  choice: để giết
  rationale: Trong ngữ cảnh đi với “máu vô tội,” động từ נכה chỉ hành vi đánh hạ dẫn đến chết; “giết” truyền đạt rõ kết quả gây chết người trong tiếng Việt.
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: người vô tội
  rationale: Cụm Hê-bơ-rơ khó và cô đọng, theo nghĩa đen liên hệ “sinh mạng/máu vô tội”; trong ngữ cảnh pháp lý, nó chỉ một người không đáng chịu chết. Cách nói tự nhiên được dùng trong chính văn, còn hình ảnh nguyên văn được giữ ở chú thích.
- source_word: וְאָמַר כָּל הָעָם
  choice: Toàn dân phải nói
  rationale: Dạng động từ trong bối cảnh nghi lễ mang tính chỉ định về lời đáp của cộng đồng; “phải nói” thể hiện rõ lực quy định mà vẫn tự nhiên.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời xác nhận phụng vụ quen thuộc, được phiên âm theo cách dùng phổ biến trong tiếng Việt.
theological_decisions:
- issue: Công thức nguyền rủa trong bối cảnh giao ước
  choice: Đáng nguyền rủa thay kẻ nhận hối lộ để giết người vô tội
  alternative: Nguyền rủa kẻ nhận hối lộ để đánh đổ máu vô tội
  rationale: Bản dịch giữ tính chất phán quyết của lời nguyền và trách nhiệm cá nhân, nhưng tránh lối diễn đạt tối nghĩa trong tiếng Việt. Không bổ sung động cơ tư pháp hay giáo lý ngoài điều bản văn nói.
- issue: Hình ảnh “máu vô tội”
  choice: người vô tội trong chính văn, kèm chú thích nghĩa đen
  alternative: máu vô tội trong chính văn
  rationale: “Máu vô tội” bảo tồn hình ảnh Hê-bơ-rơ nhưng kết hợp trực tiếp với “giết/đánh” dễ thiếu tự nhiên hoặc mơ hồ trong tiếng Việt. Chú thích giữ lại hình ảnh về sinh mạng và tội đổ máu mà không làm chính văn khó hiểu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đáng nguyền rủa thay” cho công thức giao ước, “toàn dân” cho tập thể Ít-ra-ên, và “A-men” làm lời đáp nghi lễ. Dấu chú thích [a] xuất hiện ngay sau cụm từ được giải thích.
