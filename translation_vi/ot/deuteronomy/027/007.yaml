source:
  edition: WLC
  text: וְ/זָבַחְתָּ֥ שְׁלָמִ֖ים וְ/אָכַ֣לְתָּ שָּׁ֑ם וְ/שָׂ֣מַחְתָּ֔ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: vi
  text: Ngươi phải dâng sinh tế bình an[a], ăn tại đó và vui mừng trước mặt Yahweh, Đức Chúa Trời của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sinh tế thông công” hoặc “sinh tế cầu phúc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Ngươi phải dâng
  rationale: Trong ngữ cảnh tế lễ, זבח chỉ việc thực hiện một sinh tế. “Dâng” tự nhiên trong tiếng Việt và khi đi với “sinh tế” vẫn giữ rõ ý nghĩa tế lễ.
- source_word: שְׁלָמִים
  choice: sinh tế bình an
  rationale: שְׁלָמִים là một loại sinh tế gắn với sự bình an, phúc lành và bữa ăn thông công. “Sinh tế bình an” là cách gọi trang trọng, dễ nhận biết; các sắc thái khác được ghi ở chú thích.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: ăn tại đó
  rationale: Giữ nguyên hành động “ăn” và địa điểm “tại đó”; tiếng Việt không cần lặp lại “ngươi phải” sau liên từ để vẫn truyền đạt chuỗi chỉ thị.
- source_word: וְשָׂמַחְתָּ
  choice: vui mừng
  rationale: שׂמח diễn tả niềm vui trong bối cảnh thờ phượng và giao ước; “vui mừng” vừa tự nhiên vừa giữ sắc thái lễ hội.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: “Trước mặt” là cách diễn đạt tự nhiên cho לִפְנֵי, truyền đạt việc ở trong sự hiện diện của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng được biểu thị bởi Tứ Tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Giữ hậu tố ngôi thứ hai số ít, phù hợp với lời giao ước đang trực tiếp nói với Israel như một toàn thể.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. “Yahweh” bảo tồn danh riêng mà không thay bằng tước hiệu.
- issue: Cách dịch שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công; sinh tế cầu phúc
  rationale: Từ này gọi tên một loại sinh tế và có thể nhấn mạnh sự bình an, phúc lành hoặc sự thông công qua bữa ăn tế lễ. Bản chính dùng cách gọi quen thuộc, còn chú thích giữ các khả năng từ vựng chân thực.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để duy trì lối xưng hô ngôi thứ hai số ít của diễn ngôn giao ước; cấu trúc câu được làm gọn tự nhiên trong tiếng Việt mà vẫn giữ đủ ba hành động: dâng, ăn và vui mừng.'
