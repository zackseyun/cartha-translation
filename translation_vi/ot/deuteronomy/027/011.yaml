  text: 'Vào ngày ấy, Môi-se truyền lệnh cho dân chúng rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Động từ צוה diễn tả việc ban một mệnh lệnh có thẩm quyền. “Truyền lệnh” giữ được sắc thái ấy và phù hợp với văn phong tường thuật trang trọng.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֶת הָעָם
  choice: dân chúng
  rationale: עָם chỉ tập thể dân Y-sơ-ra-ên trong ngữ cảnh này. “Dân chúng” tự nhiên trong tiếng Việt và không cần thêm tên dân vốn không được nêu trực tiếp trong câu.
- source_word: בַּיּוֹם הַהוּא
  choice: Trong ngày ấy
  rationale: Cụm giới từ בְּ với יוֹם đánh dấu thời gian. “Trong ngày ấy” giữ rõ chỉ dấu thời gian và có sắc thái tường thuật tự nhiên.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Dạng nguyên mẫu này dẫn vào nội dung mệnh lệnh ở câu kế tiếp. Dấu hai chấm cùng “rằng” truyền đạt chức năng dẫn lời tự nhiên hơn trong tiếng Việt hiện đại.
