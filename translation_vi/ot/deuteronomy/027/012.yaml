source:
  edition: WLC
  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: vi
  text: 'Các chi tộc sau đây sẽ đứng trên núi Ga-ri-xim để chúc phước cho dân khi anh em vượt qua sông Giô-đanh: Si-mê-ôn, Lê-vi, Giu-đa, Y-sa-ca, Giô-sép[a] và Bên-gia-min.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong danh sách chi tộc ở đây, Giô-sép đại diện cho hai chi tộc Ép-ra-im và Ma-na-se.
    reason: Đối chiếu cách phân chia các chi tộc cho thấy tên Giô-sép được dùng theo nghĩa đại diện; ghi chú làm rõ mà không mở rộng chính văn.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là những chi tộc
  rationale: Đại từ chỉ định số nhiều mở đầu danh sách. Thêm “chi tộc” làm rõ đối tượng được liệt kê trong ngữ cảnh mà không thay đổi nội dung.
- source_word: יַעַמְדוּ
  choice: sẽ đứng
  rationale: Dạng vị hoàn thành Qal số nhiều trong lời chỉ dẫn về nghi lễ tương lai; “sẽ đứng” tự nhiên trong tiếng Việt và vẫn giữ lực chỉ thị theo ngữ cảnh.
- source_word: לְבָרֵךְ
  choice: để chúc phước
  rationale: Động từ nguyên mẫu có לְ diễn tả mục đích. “Chúc phước” phù hợp với hành động công bố phước lành trên dân chúng.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ cộng đồng Ít-ra-ên nói chung; cách diễn đạt tự nhiên, dễ hiểu và không thêm sắc thái quốc gia ngoài nguyên văn.
- source_word: עַל הַר גְּרִזִים
  choice: trên núi Ga-ri-xim
  rationale: Dịch trực tiếp vị trí trên núi và phiên âm địa danh theo lối quen thuộc trong tiếng Việt.
- source_word: בְּעָבְרְכֶם
  choice: khi anh em vượt qua
  rationale: בְּ với nguyên mẫu và hậu tố ngôi hai số nhiều mang nghĩa thời gian. “Khi anh em vượt qua” giữ được đối tượng số nhiều và diễn đạt tự nhiên.
- source_word: אֶת הַיַּרְדֵּן
  choice: sông Giô-đanh
  rationale: Nguyên văn dùng tên Giô-đanh; thêm danh từ loại “sông” giúp độc giả tiếng Việt nhận biết rõ địa danh mà không đổi nghĩa.
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: Si-mê-ôn, Lê-vi, Giu-đa, Y-sa-ca, Giô-sép và Bên-gia-min
  rationale: Dùng các dạng phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt; giữ nguyên Giô-sép như bản Hê-bơ-rơ thay vì diễn giải thành Ép-ra-im và Ma-na-se.
theological_decisions:
- issue: Lực của lời chỉ dẫn về vị trí và vai trò của các chi tộc
  choice: “sẽ đứng ... để chúc phước” trong một mệnh lệnh nghi lễ theo ngữ cảnh
  alternative: “phải đứng ... để chúc phước”
  rationale: Dạng vị hoàn thành có thể mô tả việc tương lai, còn toàn ngữ cảnh khiến câu mang tính chỉ thị. “Sẽ đứng” giữ hình thức tương lai tự nhiên và không nhấn quá mức sắc thái mệnh lệnh.
- issue: Ý nghĩa của Giô-sép trong danh sách chi tộc
  choice: Giữ “Giô-sép” trong chính văn
  alternative: “các chi tộc của Giô-sép” hoặc “Ép-ra-im và Ma-na-se”
  rationale: Bản Hê-bơ-rơ nêu đích danh Giô-sép. Việc thay bằng tên hai chi tộc hậu duệ sẽ giải thích vượt quá chính văn, nên chỉ ghi chú ý nghĩa đại diện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho hậu tố ngôi hai số nhiều, giữ sắc thái lời Môi-se nói với toàn dân. Các tên riêng được phiên âm theo lối phổ biến trong Kinh Thánh tiếng Việt.
