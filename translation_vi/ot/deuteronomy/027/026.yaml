source:
  edition: WLC
  text: אָר֗וּר אֲשֶׁ֧ר לֹא יָקִ֛ים אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את לַ/עֲשׂ֣וֹת אוֹתָ֑/ם וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: vi
  text: '“Người nào không giữ vững[a] những lời của luật pháp này bằng cách thi hành chúng thì bị nguyền rủa.” Và toàn dân phải nói: “A-men.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “không xác nhận” hoặc “không làm cho những lời của luật pháp này có hiệu lực.” Động từ Hê-bơ-rơ có thể mang nghĩa duy trì hay xác nhận hiệu lực của luật pháp; tại đây, động từ ấy gắn với sự vâng phục thực tế: “bằng cách thi hành chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: bị nguyền rủa
  rationale: Diễn đạt công thức nguyền rủa trong giao ước bằng tiếng Việt hiện đại, rõ ràng và trang trọng.
- source_word: אֲשֶׁר
  choice: người nào
  rationale: Giữ ý nghĩa khái quát của mệnh đề quan hệ số ít mà không quy định giới tính quá mức.
- source_word: לֹא יָקִים
  choice: không giữ vững
  rationale: Động từ Hiphil của קום ở đây có thể mang nghĩa duy trì, xác nhận hoặc làm cho có hiệu lực. “Giữ vững” bảo toàn sắc thái duy trì hiệu lực của luật pháp và không đồng nhất hoàn toàn với hành động thi hành được nêu ngay sau đó.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: những lời của luật pháp này
  rationale: “Những lời” phản ánh דִּבְרֵי, còn “luật pháp” phù hợp với bối cảnh giao ước và lời nguyền trong Phục Truyền Luật Lệ Ký.
- source_word: לַעֲשׂוֹת אֹתָם
  choice: bằng cách thi hành chúng
  rationale: Diễn tả phương cách thực tế để giữ vững luật pháp, đồng thời bảo tồn mối liên hệ trực tiếp giữa việc công nhận hiệu lực và vâng theo các lời ấy.
- source_word: וְאָמַר כָּל הָעָם
  choice: Và toàn dân phải nói
  rationale: Trong trình tự nghi lễ–pháp lý này, hình thức động từ có giá trị chỉ thị; “phải nói” thể hiện lời đáp được quy định, thay vì một hành động đơn thuần trong quá khứ.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời khẳng định phụng vụ quen thuộc, thay vì diễn giải thành “Thật vậy” hay “Nguyện được như thế”.
theological_decisions:
- issue: Ý nghĩa của nghĩa vụ giao ước trong יָקִים ... לַעֲשׂוֹת אֹתָם
  choice: Câu này tuyên bố lời nguyền giao ước trên người không giữ vững luật pháp bằng sự vâng phục thực tế.
  alternative: Câu này chỉ nói đến việc công khai xác nhận hoặc phê chuẩn luật pháp; hoặc chỉ nói chung đến việc tuân giữ luật pháp.
  rationale: Bản Hê-bơ-rơ kết hợp ý “giữ vững/xác nhận” với “bằng cách thi hành chúng”, vì vậy bản dịch giữ cả hai thành tố mà không quy câu này về một hành vi xác nhận bằng lời nói בלבד hoặc nhập chúng thành một ý duy nhất.
- issue: Phạm vi khái quát của אֲשֶׁר
  choice: người nào
  alternative: kẻ nào; người ấy là người
  rationale: Cách dịch này truyền đạt phạm vi đại diện, khái quát của dạng số ít trong nguyên văn, không thêm sự phân biệt giới tính.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc điều kiện “Người nào… thì…” chuyển tải tự nhiên công thức nguyền rủa của tiếng Hê-bơ-rơ; “toàn dân phải nói” giữ tính chất đáp lời theo nghi thức.
