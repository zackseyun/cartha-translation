  text: וְ/הָיָ֗ה בַּ/יּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֒ אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ וַ/הֲקֵמֹתָ֤ לְ/ךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְ/שַׂדְתָּ֥ אֹתָ֖/ם בַּ/שִּֽׂיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: vi
  text: Vào ngày anh em vượt sông Giô-đanh để vào miền đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em, anh em phải dựng cho mình những tảng đá lớn và trát vôi[a] lên chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trát chúng bằng vữa”; danh từ Hê-bơ-rơ chỉ vôi hoặc vữa dùng làm lớp trát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם
  choice: Vào ngày
  rationale: Cụm Hê-bơ-rơ mở đầu một hoàn cảnh trong tương lai. “Vào ngày” diễn đạt tự nhiên giá trị thời gian mà không dùng lối nói cổ hoặc quá sát chữ.
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: anh em vượt sông Giô-đanh
  rationale: Động từ עבר trong ngữ cảnh này chỉ việc đi từ bờ này sang bờ kia. “Vượt sông” tự nhiên trong tiếng Việt; thêm “sông” giúp tên địa lý rõ ràng đối với độc giả phổ thông.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: אֶרֶץ tại đây là vùng đất Israel sắp nhận. “Miền đất” giữ sắc thái địa lý và giao ước, thay vì biến nó thành một quốc gia theo nghĩa chính trị hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: נֹתֵן
  choice: đang ban
  rationale: Phân từ Hê-bơ-rơ trình bày việc ban đất như một hành động hiện thực và chắc chắn từ góc nhìn của người nói; “đang ban” giữ được sắc thái ấy.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: anh em phải dựng cho mình
  rationale: Hiphil của קום có nghĩa là dựng hoặc thiết lập. “Phải dựng” diễn đạt sức mạnh mệnh lệnh trong ngữ cảnh; “cho mình” giữ sắc thái hồi quy của לְךָ mà không làm câu tiếng Việt nặng nề.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: những tảng đá lớn
  rationale: “Tảng đá lớn” là cách gọi tự nhiên, rõ nghĩa đối với các khối đá được dựng lên.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: và trát vôi lên chúng
  rationale: Động từ chỉ việc phủ vật liệu lên đá, còn שִׂיד chỉ vôi hoặc vật liệu trát. “Trát vôi” ngắn gọn, tự nhiên và tránh cách diễn đạt lặp như “trát bằng chất trát”.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Giữ “Yahweh” phân biệt danh riêng này với các tước hiệu và không áp đặt truyền thống thay thế danh bằng “CHÚA”.
- issue: Sự chuyển đổi số của đại từ ngôi thứ hai
  choice: Dùng “anh em” như cách xưng hô tập thể và “cho mình” ở mệnh lệnh
  alternative: Chuyển đột ngột từ “anh em” sang “ngươi” để phản ánh hình thái số nhiều rồi số ít
  rationale: Nguyên văn chuyển từ động từ số nhiều תַּעַבְרוּ sang các hình thức số ít וַהֲקֵמֹתָ và לְךָ, khi Môi-se nói với Israel như một cộng đồng. Tiếng Việt không thể tái hiện sự chuyển đổi này mà không tạo cảm giác đổi đối tượng bất ngờ; “anh em” giữ đối tượng tập thể, còn “cho mình” vẫn phản ánh sắc thái quy chiếu lại chủ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để nói với cộng đồng Israel, “Đức Chúa Trời” cho אֱלֹהִים, danh riêng “Yahweh”, và địa danh quen thuộc “sông Giô-đanh”. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
