revisions:
- from: '“Đáng nguyền rủa thay kẻ[a] nằm với bất cứ loài vật nào!” Toàn dân sẽ nói: “A-men!”'
  to: '“Kẻ[a] nằm với bất cứ con vật nào đáng bị nguyền rủa!” Toàn dân sẽ nói: “A-men!”'
  rationale: 'Điều chỉnh tối thiểu để tiếng Việt hiện đại tự nhiên hơn: thay “loài vật” bằng “con vật” và dùng trật tự câu thông dụng hơn. Nghĩa, mức độ uyển ngữ, sắc thái pháp lý-nghi thức, và chú thích về dạng giống đực số ít đều được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:11:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng công thức nguyền rủa, cách nói giảm chỉ quan hệ tình dục, phạm vi bao quát của “bất cứ,” và lời đáp nghi thức của toàn dân. “Kẻ” có thể diễn đạt phân từ giống đực số ít theo lối khái quát của tiếng Việt mà không thêm từ “người nam” vào thân câu; chú thích nêu rõ hình thái tiếng Hê-bơ-rơ.
  naturalness: “Bất cứ con vật nào” tự nhiên hơn “bất cứ loài vật nào” trong tiếng Việt hiện đại khi nói về một cá thể bất kỳ. Cấu trúc “Kẻ ... đáng bị nguyền rủa” cũng rõ và tự nhiên hơn lối đảo “Đáng nguyền rủa thay kẻ ...,” vốn có sắc thái cổ hơn mức cần thiết.
  terminology: Giữ “nằm với” để bảo lưu lối nói uyển ngữ của nguyên văn trong ngữ cảnh pháp luật. Giữ “A-men” như cách phiên âm phụng vụ quen thuộc trong tiếng Việt. “Toàn dân” phù hợp với כָּל־הָעָם và không thêm thông tin theo ngữ cảnh.
  issues:
  - severity: low
    issue: Cụm “bất cứ loài vật nào” chưa tự nhiên bằng “bất cứ con vật nào.”
    rationale: Danh từ chỉ loại “loài vật” thường dùng để nói về một nhóm/phân loại; trong cấu trúc “bất cứ ... nào,” “con vật” diễn đạt tự nhiên hơn ý một con vật bất kỳ của tiếng Hê-bơ-rơ.
  - severity: low
    issue: Cấu trúc “Đáng nguyền rủa thay kẻ...” có sắc thái cổ.
    rationale: Đây không phải lỗi nghĩa, nhưng có thể đổi sang trật tự câu hiện đại hơn mà vẫn giữ nguyên lực tuyên bố của công thức nguyền rủa.
