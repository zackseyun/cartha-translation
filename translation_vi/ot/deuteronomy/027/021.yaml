base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: vi
  text: '“Kẻ[a] nằm với bất cứ con vật nào đáng bị nguyền rủa!” Toàn dân sẽ nói: “A-men!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người nam nào nằm với bất cứ con vật nào.” Tiếng Hê-bơ-rơ dùng dạng giống đực số ít.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Diễn đạt công thức nguyền rủa giao ước với sắc thái trang trọng và lực tuyên bố rõ ràng trong tiếng Việt hiện đại.
- source_word: שֹׁכֵב
  choice: nằm với
  rationale: Động từ ở đây là cách nói giảm chỉ quan hệ tình dục; “nằm với” giữ được lối nói kín đáo của nguyên văn mà vẫn dễ hiểu trong ngữ cảnh luật pháp.
- source_word: עִם
  choice: với
  rationale: Giữ trực tiếp giới từ trong thành ngữ “nằm với”.
- source_word: כָּל
  choice: bất cứ ... nào
  rationale: Truyền đạt tự nhiên ý nghĩa phân bố, không loại trừ trường hợp nào, của כָּל đi với danh từ số ít.
- source_word: בְּהֵמָה
  choice: loài vật
  rationale: Chỉ phạm vi động vật nói chung trong điều luật; “thú vật” có thể mang sắc thái cũ hoặc miệt thị, còn “gia súc” quá hẹp.
- source_word: וְאָמַר
  choice: sẽ nói
  rationale: Diễn đạt lời đáp theo nghi thức trong chuỗi mệnh lệnh giao ước, đồng thời giữ động từ “nói” sát nguyên văn.
- source_word: כָּל הָעָם
  choice: toàn dân
  rationale: Cách nói tự nhiên, gọn và trang trọng cho “tất cả dân chúng,” không thêm “Israel” vốn không có trong câu.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời xác nhận phụng vụ quen thuộc, theo cách phiên âm dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Phân từ danh từ hóa giống đực số ít trong công thức nguyền rủa
  choice: kẻ
  alternative: người nam nào
  rationale: “Kẻ” tạo công thức luật pháp tự nhiên và không thêm danh từ “người nam” vốn không được viết tường minh; chú thích vẫn nêu rõ hình thái giống đực số ít của tiếng Hê-bơ-rơ để không che khuất khả năng hiểu chủ thể là nam giới.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp với lời xướng–đáp giao ước. Dấu chấm than thể hiện lực của lời nguyền và lời xác nhận; “nằm với” chủ ý giữ cách nói giảm của nguyên văn.
