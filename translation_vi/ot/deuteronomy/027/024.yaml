base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: vi
  text: '“Đáng nguyền rủa thay kẻ lén lút đánh gục người lân cận mình[a].” Toàn dân phải đáp: “A-men!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đánh” hoặc “giết”; động từ Hê-bơ-rơ có thể chỉ nhiều mức độ bạo lực, từ đánh cho đến đánh chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Diễn đạt công thức tuyên án giao ước bằng một câu trang trọng, tự nhiên trong tiếng Việt, đồng thời giữ sắc thái bị đặt dưới lời nguyền.
- source_word: מַכֵּה
  choice: đánh gục
  rationale: Động từ נכה có thể chỉ hành động đánh gây thương tích nặng hoặc gây chết người. “Đánh gục” giữ được mức độ nghiêm trọng mà không thu hẹp nghĩa thành chắc chắn giết chết.
- source_word: רֵעֵהוּ
  choice: người lân cận mình
  rationale: רֵעַ chỉ người đồng loại, người cùng cộng đồng hoặc người có quan hệ gần gũi; “người lân cận” vừa rõ nghĩa vừa phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: בַּסָּתֶר
  choice: lén lút
  rationale: Cụm từ chỉ hành vi được thực hiện kín đáo, tránh khỏi sự nhìn thấy của người khác. “Lén lút” truyền đạt tự nhiên cả tính bí mật lẫn dụng ý che giấu.
- source_word: וְאָמַר
  choice: phải đáp
  rationale: Trong trình tự nghi lễ, động từ này giới thiệu lời đáp bắt buộc của cộng đồng. “Đáp” làm rõ đây là phản ứng của dân chúng trước lời tuyên án.
- source_word: כָּל הָעָם
  choice: toàn dân
  rationale: Chuyển tải đầy đủ nghĩa “tất cả dân chúng” một cách gọn và tự nhiên, không thêm “Y-sơ-ra-ên” vốn không xuất hiện trực tiếp trong câu.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời đáp phụng vụ quen thuộc bằng dạng phiên âm phổ biến trong tiếng Việt, mang ý xác nhận và thuận nhận lời đã tuyên bố.
theological_decisions:
- issue: Mức độ bạo lực của מַכֵּה
  choice: đánh gục
  alternative: đánh; giết
  rationale: Nguyên ngữ có phạm vi nghĩa từ đánh đến đánh chết. Bối cảnh lời nguyền cho thấy đây là bạo lực nghiêm trọng, nhưng câu không buộc phải được hiểu riêng là giết người; vì vậy “đánh gục” giữ được sức nặng và sự mơ hồ thực sự của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp điệu của lời tuyên án cùng lời đáp cộng đồng. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
