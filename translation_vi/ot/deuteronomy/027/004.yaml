  terminology: 'Tên riêng được phiên âm nhất quán: Giô-đanh, Ê-banh, Ga-ri-xim. “Trát vôi” phân biệt thích đáng động tác שׂוד với vật liệu שׂיד. Chú thích bảo tồn đúng biến thể Ga-ri-xim của truyền thống Sa-ma-ri, trong khi văn bản chính theo MT/WLC đọc Ê-banh.'
