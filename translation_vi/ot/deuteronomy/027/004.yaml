  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: vi
  text: Khi anh em vượt qua sông Giô-đanh, hãy dựng những tảng đá này—những tảng đá mà hôm nay tôi truyền cho anh em dựng—trên núi Ê-banh[a], rồi trát vôi lên chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số truyền thống văn bản, đáng chú ý là Ngũ Kinh Sa-ma-ri, ghi “núi Ga-ri-xim” thay cho “núi Ê-banh”.
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: Khi anh em vượt qua
  rationale: Cấu trúc וְהָיָה theo sau bởi בְּ với động từ nguyên mẫu diễn tả hoàn cảnh thời gian trong tương lai; “Khi anh em vượt qua” tự nhiên trong tiếng Việt và giữ đúng ý thời gian.
- source_word: הַיַּרְדֵּן
  choice: sông Giô-đanh
  rationale: Địa danh chỉ sông Jordan; thêm “sông” giúp độc giả Việt nhận biết rõ loại địa danh.
- source_word: תָּקִימוּ
  choice: hãy dựng
  rationale: Thể Hiphil của קום ở đây có nghĩa dựng hoặc thiết lập các tảng đá; “hãy dựng” rõ nghĩa và phù hợp với lời truyền dạy.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: những tảng đá này
  rationale: Dịch trực tiếp cụm danh từ chỉ định, không diễn giải các tảng đá thành bia hay đài tưởng niệm.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: những tảng đá mà hôm nay tôi truyền cho anh em dựng
  rationale: Trong nguyên văn, bổ ngữ của “truyền” được hàm ý từ mệnh lệnh dựng đá; bổ sung “dựng” trong tiếng Việt làm câu rõ và tự nhiên mà không thêm một hành động mới.
- source_word: בְּהַר עֵיבָל
  choice: trên núi Ê-banh
  rationale: Giới từ בְּ đi với tên núi phù hợp với “trên”; tên riêng được phiên âm theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: וְשַׂדְתָּ אוֹתָם בַּשִּׂיד
  choice: rồi trát vôi lên chúng
  rationale: שׂוד chỉ việc trát hoặc phủ, còn שׂיד là vôi/vật liệu vôi; cách dịch này phân biệt hành động với vật liệu và tránh lặp từ vụng về.
theological_decisions:
- issue: Tên địa điểm trong truyền thống văn bản Phục truyền luật lệ ký 27:4
  choice: núi Ê-banh
  alternative: núi Ga-ri-xim
  rationale: Bản WLC thuộc truyền thống Masoret được cung cấp đọc là “Ê-banh”. Ngũ Kinh Sa-ma-ri và một số chứng cứ văn bản khác đọc “Ga-ri-xim”; phương án này được giữ trong chú thích thay vì thay thế bản nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng Israel; dùng câu mệnh lệnh “hãy” để chuyển tải lực của lời truyền dạy. Dấu gạch ngang làm rõ mệnh đề quan hệ mà không làm thay đổi nội dung.
