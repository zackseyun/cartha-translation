  source_fidelity: 'Bản dịch theo sát văn bản WLC: mệnh đề thời gian khi vượt sông Giô-đanh, mệnh lệnh dựng các đá, địa điểm núi Ê-banh, và hành động trát bằng vôi đều được chuyển đạt đúng. Việc lặp lại động từ “dựng” trong mệnh đề quan hệ (“mà hôm nay tôi truyền cho anh em dựng”) là cách tiếng Việt làm rõ phần được hàm ý trong cấu trúc Hê-bơ-rơ, không thêm hành động hay thay đổi ý nghĩa.'
