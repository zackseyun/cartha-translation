revisions:
- from: Anh em phải viết trên các tảng đá ấy mọi lời của luật pháp này[a] khi vượt qua sông, để anh em được vào vùng đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em—một vùng đất tràn trề sữa và mật—đúng như Yahweh, Đức Chúa Trời của tổ phụ anh em[b], đã phán với anh em.
  to: Anh em phải viết trên các tảng đá ấy mọi lời của luật pháp này[a] khi anh em vượt qua, để anh em có thể vào vùng đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em—một vùng đất tuôn tràn sữa và mật—đúng như Yahweh, Đức Chúa Trời của tổ phụ anh em[b], đã phán với anh em.
  rationale: Loại bỏ chi tiết “sông” được suy ra từ văn cảnh nhưng không hiện diện trong câu gốc; điều chỉnh mệnh đề mục đích và thành ngữ về sự phong phú để sát tiếng Hê-bơ-rơ hơn mà vẫn tự nhiên trong tiếng Việt. Các chú thích giữ nguyên vì đã đúng nội dung và neo chú thích.
