source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: vi
  text: Anh em phải viết trên các tảng đá ấy mọi lời của luật pháp này[a] khi anh em vượt qua, để anh em có thể vào vùng đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em—một vùng đất tuôn tràn sữa và mật—đúng như Yahweh, Đức Chúa Trời của tổ phụ anh em[b], đã phán với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi lời của sự giáo huấn này”. Từ Hê-bơ-rơ torah có thể có nghĩa là “sự giáo huấn” cũng như “luật pháp”; ở đây “luật pháp” phù hợp với văn cảnh giao ước.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Đức Chúa Trời của tổ tiên anh em”. Nguyên văn là “các cha của anh em”, thuộc công thức giao ước thường gặp trong sách Phục Truyền Luật Lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Anh em phải viết
  rationale: Dạng hoàn thành Qal có liên từ mang chức năng mệnh lệnh trong văn cảnh chỉ thị. “Phải viết” truyền đạt rõ sắc thái bắt buộc bằng tiếng Việt hiện đại.
- source_word: עֲלֵיהֶן
  choice: trên các tảng đá ấy
  rationale: Đại từ chỉ lại các tảng đá ở câu trước; đưa danh từ vào bản dịch giúp tiếng Việt rõ nghĩa mà không thêm nội dung mới.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: mọi lời của luật pháp này
  rationale: Giữ nghĩa cụ thể của דִּבְרֵי là “các lời”; “luật pháp” phù hợp văn cảnh giao ước, trong khi chú thích bảo lưu nghĩa khả dĩ “sự giáo huấn” của תּוֹרָה.
- source_word: בְּעָבְרֶךָ
  choice: khi vượt qua sông
  rationale: Cấu trúc giới từ với động từ nguyên thể có nghĩa thời gian. “Sông” được làm rõ từ văn cảnh trực tiếp về việc vượt sông Giô-đanh, giúp câu tiếng Việt tự nhiên.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: để anh em được vào
  rationale: Bảo lưu quan hệ mục đích hoặc kết quả mà không giải thích sâu hơn mối liên hệ giữa việc viết và việc vào đất.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Phiên âm danh giao ước יְהוָה là “Yahweh” và diễn đạt cụm đồng vị tự nhiên trong tiếng Việt.
- source_word: נֹתֵן לְךָ
  choice: đang ban cho anh em
  rationale: Thể phân từ trình bày sự ban cho như điều đang diễn ra hoặc chắc chắn cận kề; “đang ban” bảo lưu sắc thái ấy.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: một vùng đất tràn trề sữa và mật
  rationale: “Tràn trề” truyền đạt thành ngữ chỉ sự phong phú bằng tiếng Việt tự nhiên, đồng thời giữ hình ảnh sữa và mật.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: đúng như ... đã phán
  rationale: Dịch động từ theo nghĩa “phán/nói”, không thay bằng “hứa” dù lời hứa được hàm ý trong văn cảnh.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Đức Chúa Trời của tổ phụ anh em
  rationale: “Tổ phụ” giữ sắc thái nam tính và công thức giao ước của nguyên văn, đồng thời tự nhiên hơn “các cha” trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng Danh Thánh; “Yahweh” bảo tồn đây là danh giao ước thay vì thay bằng một tước hiệu.
- issue: Đại từ số ít chỉ Israel trong אֱלֹהֶיךָ và các hình thức ngôi hai số ít
  choice: anh em
  alternative: ngươi
  rationale: Tiếng Hê-bơ-rơ gọi Israel như một chủ thể tập thể ở ngôi hai số ít. “Anh em” tự nhiên, trang trọng và dễ hiểu trong lời Môi-se nói với cộng đồng, dù không biểu thị hình thái số ít như “ngươi”.
- issue: Cách dịch אֲבֹתֶיךָ
  choice: tổ phụ anh em
  alternative: tổ tiên anh em
  rationale: “Tổ phụ” bảo lưu yếu tố nam tính và công thức về các cha trong giao ước; “tổ tiên” rộng và trung tính hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho lời Môi-se nói với Israel như một cộng đồng; dùng “tổ phụ” để giữ công thức giao ước. Dấu gạch ngang làm nổi bật cụm mô tả vùng đất mà không thay đổi quan hệ cú pháp.
