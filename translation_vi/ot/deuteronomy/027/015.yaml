source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: vi
  text: '“Đáng nguyền rủa thay người nào làm một tượng khắc hoặc tượng đúc—là điều Yahweh ghê tởm, là tác phẩm do tay người thợ làm ra—rồi đặt nó nơi kín đáo.” Toàn dân phải đáp lại và nói: “A-men.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Giữ sắc thái trang trọng và hiệu lực pháp lý-giao ước của công thức tuyên bố lời nguyền.
- source_word: הָאִישׁ אֲשֶׁר
  choice: người nào
  rationale: Diễn đạt tự nhiên trong tiếng Việt một công thức pháp lý chỉ bất cứ người nào thực hiện hành vi; tiếng Việt không buộc phải đánh dấu giống đực như tiếng Hê-bơ-rơ.
- source_word: פֶסֶל
  choice: một tượng chạm
  rationale: Nêu rõ hình tượng được tạo ra bằng cách chạm/khắc, thay vì dùng từ rộng hơn là “thần tượng”.
- source_word: מַסֵּכָה
  choice: tượng đúc
  rationale: Chỉ hình tượng được làm bằng phương pháp đúc; không thêm “kim loại” vào chính văn vì nguồn không nói rõ, dù từ này thường ám chỉ vật đúc bằng kim loại.
- source_word: תּוֹעֲבַת יְהוָה
  choice: một vật ghê tởm đối với Yahweh
  rationale: Giữ cường độ mạnh của תּוֹעֵבָה và thể hiện rằng vật ấy là điều Yahweh ghê tởm.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước của Đức Chúa Trời, không thay bằng một tước hiệu.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: sản phẩm do tay thợ thủ công làm ra
  rationale: Giữ sự nhấn mạnh rằng hình tượng chỉ là sản phẩm do bàn tay con người chế tạo, đồng thời dùng cách nói rõ ràng, tự nhiên.
- source_word: וְשָׂם בַּסָּתֶר
  choice: rồi đặt nó ở nơi kín giấu
  rationale: Diễn đạt hành động đặt hình tượng trong chỗ bị che giấu; tránh ngầm xác định rằng động từ có nghĩa dựng đứng hoặc thiết lập để thờ.
- source_word: וְעָנוּ כָל־הָעָם וְאָמְרוּ
  choice: Toàn dân phải đáp lại rằng
  rationale: Tái hiện lời đáp đồng thanh có tính nghi lễ; gộp hai động từ gần nghĩa theo lối Việt tự nhiên mà không làm mất chức năng đáp lời.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời đáp phụng vụ quen thuộc dưới dạng chuyển tự tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH; “Yahweh” bảo tồn tính chất danh riêng mà không thay nó bằng tước hiệu.
- issue: Giống đực số ít trong công thức lời nguyền
  choice: người nào
  alternative: người đàn ông nào
  rationale: הָאִישׁ ở đây có chức năng đại diện/phổ quát trong công thức pháp lý. Tiếng Việt “người nào” truyền đạt đúng phạm vi ấy mà không thêm ý chỉ riêng nam giới vốn không nhất thiết có trong ngữ cảnh.
- issue: Bản chất của מַסֵּכָה
  choice: tượng đúc trong chính văn, kèm chú thích rằng thường được đúc bằng kim loại
  alternative: tượng đúc bằng kim loại
  rationale: Nguồn nêu phương pháp tạo tác nhưng không nói thẳng chất liệu. Cách dịch này giữ độ chính xác và không thu hẹp quá mức.
translation_notes:
  register: Văn phong trang trọng, rõ ràng, phù hợp lời công bố giao ước trước cộng đồng. Dùng “đáng nguyền rủa thay” để giữ công thức lời nguyền; dấu gạch ngang giúp bảo tồn các cụm đồng vị của nguyên văn mà câu tiếng Việt vẫn dễ theo dõi.
