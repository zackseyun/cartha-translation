revisions:
- from: '“Đáng nguyền rủa thay kẻ bẻ cong công lý đối với ngoại kiều[a], trẻ mồ côi[b] và người góa bụa!” Toàn dân phải đáp: “A-men!”'
  to: '“Đáng nguyền rủa thay kẻ bẻ cong công lý dành cho ngoại kiều[a], trẻ mồ côi[b] và góa phụ!” Toàn dân phải đáp: “A-men!”'
  rationale: Bản sửa chỉ điều chỉnh «người góa bụa» thành «góa phụ» để phản ánh danh từ giống cái trong tiếng Hê-bơ-rơ, và thay «công lý đối với» bằng «công lý dành cho» để diễn đạt rõ hơn quyền công lý bị tước sai. Các yếu tố còn lại giữ nguyên vì trung thành với nguồn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:11:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng công thức nguyền rủa, hành vi làm sai lệch משפט, và ba nhóm xã hội dễ bị tổn thương. Tuy nhiên, אַלְמָנָה là danh từ giống cái, cụ thể là «góa phụ», trong khi «người góa bụa» có thể bao gồm cả nam giới. Cụm «công lý đối với» cũng kém chính xác hơn «công lý dành cho», vì bản gốc nói đến quyền/lẽ công bình thuộc về các đối tượng này.
  naturalness: Câu văn nhìn chung trang trọng, tự nhiên và phù hợp bối cảnh tuyên đọc. «Đáng nguyền rủa thay» và «Toàn dân phải đáp» diễn đạt tốt công thức nghi lễ. Việc đổi thành «công lý dành cho» làm rõ quan hệ pháp lý mà vẫn gọn và hiện đại.
  terminology: «Ngoại kiều» có thể dùng được khi kèm chú thích về ger. «Trẻ mồ côi» là cách nói tự nhiên cho יָתוֹם, với chú thích bảo lưu nghĩa sát là «trẻ không cha». «Góa phụ» cần được dùng để phản ánh chính xác אַלְמָנָה.
  issues:
  - severity: medium
    issue: «Người góa bụa» không phản ánh giới tính của אַלְמָנָה.
    rationale: Từ Hê-bơ-rơ chỉ một người vợ góa, không phải thuật ngữ bao quát cả góa vợ lẫn góa chồng. «Góa phụ» là tương đương chính xác và vẫn tự nhiên trong văn cảnh pháp lý-trang trọng.
  - severity: low
    issue: «Công lý đối với» chưa làm rõ rằng משפט là công lý/quyền xét xử phải được dành cho các nhóm ấy.
    rationale: Cấu trúc Hê-bơ-rơ nói «công lý của» họ; «công lý dành cho» diễn đạt rõ hơn quyền lợi pháp lý bị làm sai lệch mà không thêm ý.
  revised_text: '“Đáng nguyền rủa thay kẻ bẻ cong công lý dành cho ngoại kiều[a], trẻ mồ côi[b] và góa phụ!” Toàn dân phải đáp: “A-men!”'
