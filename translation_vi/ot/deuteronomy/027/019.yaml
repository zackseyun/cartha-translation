language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: vi
  text: '“Đáng nguyền rủa thay kẻ bẻ cong công lý dành cho ngoại kiều[a], trẻ mồ côi[b] và góa phụ!” Toàn dân phải đáp: “A-men!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngoại kiều” dịch từ từ Hê-bơ-rơ ger, chỉ người không phải dân bản địa nhưng cư trú giữa dân Y-sơ-ra-ên.
    reason: cultural_note
  - marker: b
    text: Từ Hê-bơ-rơ yatom cũng có thể được dịch là “trẻ không cha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Giữ sức nặng của công thức nguyền rủa trong giao ước, đồng thời diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: מַטֶּה
  choice: bẻ cong
  rationale: Phân từ Hifil của נטה diễn tả hành vi làm lệch lạc hoặc xuyên tạc công lý; “bẻ cong” vừa gần hình ảnh Hê-bơ-rơ vừa rõ nghĩa pháp lý.
- source_word: מִשְׁפַּט
  choice: công lý đối với
  rationale: Trong ngữ cảnh này, từ chỉ quyền được xét xử công bằng của những người dễ bị tổn thương; cách dịch này tự nhiên hơn việc thêm một cụm giải thích dài vào chính văn.
- source_word: גֵּר
  choice: ngoại kiều
  rationale: Chỉ người không phải dân bản địa nhưng cư trú giữa dân Y-sơ-ra-ên; “ngoại kiều” tương đối gọn và giữ được địa vị cư trú-pháp lý, với chú thích để tránh cách hiểu hiện đại quá hẹp.
- source_word: יָתוֹם
  choice: trẻ mồ côi
  rationale: Diễn đạt tự nhiên trong tiếng Việt về nhóm trẻ thiếu cha hoặc không còn sự bảo trợ của gia đình; chú thích bảo lưu sắc thái có thể là “trẻ không cha”.
- source_word: אַלְמָנָה
  choice: người góa bụa
  rationale: Cách gọi trang trọng, dễ hiểu về nhóm xã hội dễ bị tổn thương trong công thức pháp lý.
- source_word: וְאָמַר כָּל הָעָם
  choice: Toàn dân phải đáp
  rationale: Trong trình tự nghi lễ, động từ mang chức năng chỉ thị; “phải đáp” thể hiện đây là lời hưởng ứng tập thể, không chỉ là một lời nói thông thường.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời đáp nghi lễ quen thuộc bằng phiên âm tiếng Việt, bảo toàn sắc thái xác nhận long trọng.
theological_decisions:
- issue: Diễn đạt bộ ba nhóm xã hội dễ bị tổn thương mà không áp đặt phạm trù chính trị hiện đại
  choice: ngoại kiều, trẻ mồ côi và người góa bụa
  alternative: người ngoại quốc cư trú, trẻ không cha và góa phụ
  rationale: Cách chọn giữ bối cảnh pháp lý-xã hội của giao ước và nhấn mạnh nghĩa vụ xét xử công bằng, nhưng không đồng nhất trực tiếp các nhóm cổ đại với một phân loại chính sách hiện đại.
- issue: Sắc thái của מַטֶּה מִשְׁפַּט
  choice: bẻ cong công lý đối với
  alternative: làm sai lệch quyền được xét xử của
  rationale: “Bẻ cong” bảo lưu hình ảnh của động từ Hê-bơ-rơ và hàm ý làm lệch cán cân pháp lý, nhưng không thu hẹp hành vi chỉ vào một thủ tục xét xử cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và phù hợp lời tuyên đọc trong nghi lễ. Dùng câu cảm thán cho công thức nguyền rủa và “phải đáp” cho lời hưởng ứng bắt buộc của toàn dân.
