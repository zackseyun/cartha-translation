base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: vi
  text: '“Đáng nguyền rủa thay kẻ nằm với mẹ vợ mình[a]!” Toàn dân phải đáp: “A-men!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói rõ hơn: “quan hệ tình dục với mẹ vợ mình.” Tiếng Hê-bơ-rơ dùng thành ngữ “nằm với.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Diễn đạt tự nhiên công thức nguyền rủa giao ước ở dạng vị ngữ, đồng thời giữ sắc thái tuyên cáo trang trọng của tiếng Hê-bơ-rơ.
- source_word: שֹׁכֵב עִם
  choice: nằm với
  rationale: Giữ lối nói giảm quen thuộc của nguyên văn về quan hệ tình dục; cách nói này ngắn gọn và vẫn dễ hiểu trong ngữ cảnh luật pháp.
- source_word: חֹתַנְתּוֹ
  choice: mẹ vợ mình
  rationale: Danh từ chỉ mẹ vợ/mẹ chồng; ở đây chủ thể mang dạng giống đực số ít nên “mẹ vợ mình” truyền đạt chính xác quan hệ được nói đến.
- source_word: וְאָמַר כָּל הָעָם
  choice: Toàn dân phải đáp
  rationale: Động từ hoàn thành trong chuỗi chỉ dẫn nghi lễ mang lực quy định; “phải đáp” tự nhiên hơn lối dịch máy móc “sẽ nói” và thể hiện đây là lời cộng đồng hưởng ứng.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời đáp nghi lễ bằng hình thức phiên âm thông dụng trong tiếng Việt.
theological_decisions:
- issue: Lối nói giảm về hành vi tình dục trong điều luật
  choice: nằm với
  alternative: quan hệ tình dục với
  rationale: Giữ hình ảnh và mức độ kín đáo của thành ngữ Hê-bơ-rơ, còn chú thích làm rõ nghĩa để tránh mơ hồ.
- issue: Chủ thể giống đực số ít
  choice: kẻ ... mẹ vợ mình
  alternative: người ... mẹ chồng hoặc mẹ vợ mình
  rationale: Dạng phân từ giống đực số ít cùng quan hệ thân thuộc trong nguyên văn hướng đến một người đàn ông và mẹ của vợ ông; bản dịch không trung tính hóa hình thức này.
- issue: Lực nghi lễ của וְאָמַר
  choice: phải đáp
  alternative: sẽ nói
  rationale: Trong chuỗi lời nguyền, đây là đáp từ được quy định cho toàn dân; “phải đáp” bảo toàn lực truyền khiến mà không biến nó thành dự đoán đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có tính nghi lễ. “Đáng nguyền rủa thay” tái hiện công thức tuyên cáo; “toàn dân” gọn và tự nhiên; dấu chấm than làm rõ hai lời xướng–đáp.
