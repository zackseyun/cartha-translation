source:
  edition: WLC
  text: וּ/בָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא תָנִ֥יף עֲלֵי/הֶ֖ם בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: vi
  text: Tại đó, anh em phải xây một bàn thờ cho Yahweh[a], Đức Chúa Trời của anh em—một bàn thờ bằng đá. Anh em không được dùng dụng cụ bằng sắt trên các viên đá ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: YHWH (יהוה), danh riêng của Đức Chúa Trời, được phiên âm là “Yahweh”.'
    reason: divine_name
  - marker: b
    text: 'Sát nghĩa: “không được đưa sắt lên trên chúng.” Trong ngữ cảnh này, câu này cấm dùng dụng cụ bằng sắt trên các viên đá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ שָּׁם
  choice: Tại đó, anh em phải xây
  rationale: Động từ Qal hoàn thành có liên từ, trong mạch chỉ thị, mang lực mệnh lệnh hoặc tương lai bắt buộc. “Phải xây” diễn đạt tự nhiên sắc thái chỉ thị; “tại đó” giữ nguyên trạng từ chỉ nơi chốn.
- source_word: מִזְבֵּחַ
  choice: một bàn thờ
  rationale: Cách dịch thông dụng và chính xác cho bàn thờ dùng trong việc dâng tế lễ.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: cho Yahweh, Đức Chúa Trời của anh em
  rationale: 'Giới từ ל chỉ sự quy hướng hoặc dâng riêng bàn thờ cho Đức Chúa Trời. Danh יהוה được phiên âm là “Yahweh”; אֱלֹהֶיךָ xác định mối quan hệ giao ước: “Đức Chúa Trời của anh em”.'
- source_word: מִזְבַּח אֲבָנִים
  choice: một bàn thờ bằng đá
  rationale: Cụm kết cấu có nghĩa đen là “bàn thờ bằng/của những viên đá”. Cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ rõ vật liệu được quy định.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: Anh em không được dùng đồ sắt trên những viên đá ấy
  rationale: Hiphil của נוף về nghĩa cơ bản liên quan đến nâng hoặc đưa qua; trong ngữ cảnh này, cụm từ cấm tác động sắt lên các viên đá, có lẽ là dùng dụng cụ bằng sắt. “Đồ sắt” giữ gần danh từ בַּרְזֶל mà vẫn dễ hiểu; chú thích bảo tồn cách đọc sát mặt chữ và sự hàm ẩn về dụng cụ.
theological_decisions:
- issue: Cách thể hiện danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh יהוה. Phiên âm “Yahweh” giữ đây là danh riêng giao ước, không thay bằng một tước hiệu; chú thích giải thích dạng chữ Hê-bơ-rơ.
- issue: Số ít của người được truyền lệnh
  choice: anh em
  alternative: ngươi
  rationale: Các động từ và hậu tố Hê-bơ-rơ ở ngôi thứ hai giống đực số ít, nhưng lời truyền hướng đến Israel như một cộng đồng. “Anh em” là lối xưng hô tập thể tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại; “ngươi” tuy phản ánh số ít rõ hơn nhưng dễ mang sắc thái cổ hoặc miệt thị ngoài văn cảnh Kinh Thánh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để nói với Israel theo nghĩa tập thể, tránh “ngươi” mang sắc thái cổ; giữ “Yahweh” như danh riêng. Dấu gạch ngang làm rõ cụm đồng vị “một bàn thờ bằng đá”. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
