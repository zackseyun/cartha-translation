- from: '“Đáng nguyền rủa kẻ dời mốc ranh giới của người lân cận mình.” Toàn dân phải đáp: “A-men!”'
  to: '“Đáng nguyền rủa kẻ dời mốc ranh giới của người lân cận mình.” Toàn dân sẽ nói: “A-men!”'
  rationale: 'Đổi "phải đáp" thành "sẽ nói" để bám sát động từ Hê-bơ-rơ mà không thêm sắc thái quy định hay đối đáp. Giữ nguyên các lựa chọn từ vựng chính vì chúng chính xác và tự nhiên. Dấu ngoặc kép được chuẩn hóa theo lối trích dẫn tiếng Việt: lời nguyền được trích dẫn, rồi phần tự sự giới thiệu lời toàn dân nói, tiếp theo là lời "A-men" được trích dẫn.'
  reviewer_model: gpt-5.6-terra
