    rationale: Trong tiếng Hê-bơ-rơ, toàn bộ công thức gồm lời nguyền và lời dân nói thuộc một đơn vị trích dẫn; đóng ngoặc sau lời nguyền rồi lại mở ngoặc cho "A-men" làm cấu trúc trích dẫn tiếng Việt kém nhất quán.
