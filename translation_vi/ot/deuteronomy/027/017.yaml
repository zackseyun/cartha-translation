base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: vi
  text: '“Đáng nguyền rủa kẻ dời mốc ranh giới của người lân cận mình.” Toàn dân sẽ nói: “A-men!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa
  rationale: Diễn đạt tự nhiên công thức nguyền rủa giao ước, đồng thời giữ sức nặng pháp lý và tôn giáo của tính từ vị ngữ Hê-bơ-rơ.
- source_word: מַסִּיג
  choice: kẻ dời
  rationale: Phân từ chỉ người thực hiện hành vi; “dời” thể hiện việc dịch chuyển để lấn ranh, không thu hẹp nghĩa thành chỉ nhổ bỏ.
- source_word: גְּבוּל
  choice: mốc ranh giới
  rationale: Trong bối cảnh luật đất đai, từ này nói đến ranh giới tài sản và có thể chỉ cụ thể vật đánh dấu ranh; cách dịch này làm rõ hành vi gian lận.
- source_word: רֵעֵהוּ
  choice: của người lân cận mình
  rationale: Chỉ người cùng cộng đồng trong quan hệ xã hội và pháp lý; “người lân cận” trang trọng, rõ nghĩa, còn “mình” phản ánh hậu tố sở hữu ngôi thứ ba số ít.
- source_word: וְאָמַר
  choice: phải đáp
  rationale: Trong công thức phụng vụ-pháp lý, động từ diễn tả lời đáp bắt buộc của cộng đồng; “đáp” tự nhiên hơn “nói” vì lời “A-men” hưởng ứng lời tuyên bố trước đó.
- source_word: כָּל הָעָם
  choice: toàn dân
  rationale: Chuyển đạt chính xác toàn thể dân chúng mà không thêm “Ít-ra-ên,” vốn không xuất hiện trực tiếp trong câu.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên thuật ngữ phụng vụ quen thuộc, biểu thị sự xác nhận và chấp thuận của cộng đồng đối với lời nguyền.
theological_decisions:
- issue: Công thức nguyền rủa trong bối cảnh luật giao ước
  choice: Đáng nguyền rủa kẻ dời mốc ranh giới của người lân cận mình
  alternative: Kẻ xê dịch ranh giới của người lân cận mình bị nguyền rủa
  rationale: Bản chọn giữ công thức tuyên cáo đứng đầu câu và sức nặng của lời nguyền, đồng thời nêu rõ hành vi lấn chiếm đất bằng cách dời mốc.
- issue: Giống ngữ pháp của phân từ đại diện
  choice: kẻ dời ... của người lân cận mình
  alternative: người nào dời ... của người lân cận mình
  rationale: Tiếng Việt không buộc phải đánh dấu giống. “Kẻ” giữ trường hợp pháp lý số ít và sắc thái lên án mà không đưa thêm một khẳng định giới tính không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “mốc ranh giới” để nêu rõ bối cảnh đất đai; không cần chú thích vì cách dịch đã chuyển tải trực tiếp nét nghĩa cụ thể. “Toàn dân phải đáp” thể hiện lời hưởng ứng mang tính cộng đồng và giao ước.
