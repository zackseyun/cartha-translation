  source_fidelity: 'Bản dịch phản ánh chính xác câu Hê-bơ-rơ: Môi-se và các trưởng lão Y-sơ-ra-ên là đồng chủ ngữ; đối tượng là dân; mệnh lệnh là tuân giữ toàn thể điều răn mà Môi-se đang truyền trong ngày hôm nay. “Toàn bộ điều răn” bảo tồn số ít tập hợp của כָּל הַמִּצְוָה.'
