  text: וַ/יְצַ֤ו מֹשֶׁה֙ וְ/זִקְנֵ֣י יִשְׂרָאֵ֔ל אֶת הָ/עָ֖ם לֵ/אמֹ֑ר שָׁמֹר֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: vi
  text: 'Môi-se và các trưởng lão Y-sơ-ra-ên truyền lệnh cho dân chúng rằng: “Hãy tuân giữ toàn bộ điều răn[a] mà hôm nay tôi truyền cho anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cả điều răn”; từ Hê-bơ-rơ ở số ít nhưng được dùng với nghĩa tập hợp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Động từ צוה diễn tả việc ban lệnh có thẩm quyền; “truyền lệnh” tự nhiên và trang trọng trong tiếng Việt.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: và các trưởng lão Y-sơ-ra-ên
  rationale: Giữ phép phối hợp trong tiếng Hê-bơ-rơ, theo đó Môi-se và các trưởng lão cùng làm chủ ngữ của động từ.
- source_word: הָעָם
  choice: dân chúng
  rationale: עָם ở đây chỉ cộng đồng dân Y-sơ-ra-ên; “dân chúng” rõ nghĩa và tự nhiên trong ngữ cảnh.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Chuyển công thức dẫn lời sang cấu trúc tiếng Việt hiện đại, tự nhiên.
- source_word: שָׁמֹר
  choice: Hãy tuân giữ
  rationale: Trong ngữ cảnh điều răn, שׁמר bao hàm cẩn thận gìn giữ và vâng theo; “tuân giữ” thể hiện được cả hai sắc thái.
- source_word: כָּל הַמִּצְוָה
  choice: toàn bộ điều răn
  rationale: Giữ danh từ số ít mang nghĩa tập hợp trong nguyên ngữ; “toàn bộ” phù hợp tự nhiên hơn “tất cả điều răn” khi đi với danh từ số ít.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: mà ... tôi truyền cho anh em
  rationale: Thể hiện mệnh đề quan hệ và sắc thái hiện tại của phân từ מְצַוֶּה bằng cách diễn đạt tiếng Việt tự nhiên; “anh em” là đại từ số nhiều hướng đến cộng đồng.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Cách tương đương trực tiếp, hiện đại, giữ được điểm nhấn thời gian.
theological_decisions:
- issue: Số của מִצְוָה trong lời chỉ dạy giao ước
  choice: 'Giữ số ít mang nghĩa tập hợp: “điều răn”'
  alternative: 'Chuyển thành số nhiều: “các điều răn”'
  rationale: Danh từ Hê-bơ-rơ ở số ít và trong Phục Truyền Luật Lệ Ký có thể chỉ toàn thể mệnh lệnh giao ước như một chỉnh thể. Giữ số ít bảo tồn sắc thái ấy mà không áp đặt cách giải thích riêng.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Môi-se”, “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; giữ quan hệ đồng chủ thể giữa Môi-se và các trưởng lão, đồng thời bảo tồn số ít tập hợp của “điều răn”.
