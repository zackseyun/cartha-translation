  terminology: Tên riêng “Môi-se”, “Y-sơ-ra-ên” nhất quán với lối phiên âm Kinh Thánh Việt ngữ. “Trưởng lão”, “điều răn”, và “tuân giữ” đều là các thuật ngữ chuẩn xác, không áp đặt diễn giải giáo phái.
