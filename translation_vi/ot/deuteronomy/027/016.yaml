  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: vi
  text: '“Đáng nguyền rủa thay kẻ khinh thường cha hoặc mẹ mình!”[a] Toàn dân phải nói: “A-men!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “coi nhẹ”, “làm nhục” hoặc “tỏ lòng khinh miệt đối với”. Động từ Hê-bơ-rơ diễn tả việc coi một người là không đáng kể hoặc đáng khinh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Phân từ bị động mở đầu công thức nguyền rủa trong giao ước; cách diễn đạt này tự nhiên, trang trọng và giữ sắc thái tuyên cáo.
- source_word: מַקְלֶה
  choice: khinh thường
  rationale: Động từ קלה ở dạng Hiphil diễn tả việc coi ai là nhẹ, không đáng trọng, từ đó làm nhục hoặc tỏ thái độ khinh miệt. “Khinh thường” giữ được chiều rộng của hành vi và thái độ mà không giới hạn vào lời nói.
- source_word: אָבִיו וְאִמּוֹ
  choice: cha hoặc mẹ mình
  rationale: 'Liên từ Hê-bơ-rơ có nghĩa hình thức là “và”, nhưng trong công thức pháp lý này có lực phân phối: lời nguyền áp dụng khi khinh thường cha, mẹ, hoặc cả hai. “Hoặc” diễn đạt rõ ý ấy trong tiếng Việt.'
- source_word: וְאָמַר כָּל הָעָם
  choice: Toàn dân phải nói
  rationale: Giữ chủ thể đúng như nguyên văn, không thêm “Y-sơ-ra-ên”; “phải nói” phù hợp với lời đáp bắt buộc trong nghi thức giao ước.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ từ đáp phụng vụ quen thuộc bằng lối phiên âm tiếng Việt, bảo toàn tính long trọng và ý xác nhận lời giao ước.
theological_decisions:
- issue: Bản chất của hành vi đối với cha mẹ
  choice: khinh thường cha hoặc mẹ mình
  alternative: làm nhục / coi nhẹ cha và mẹ mình
  rationale: Nguyên ngữ nói đến việc coi cha mẹ là nhẹ, không đáng trọng, bao gồm thái độ khinh miệt và cách đối xử làm mất danh dự. “Khinh thường” không thu hẹp hành vi thành cảm xúc bên trong hay chỉ thành lời nguyền rủa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng công thức “Đáng nguyền rủa thay” để phản ánh sắc thái pháp lý–nghi lễ; đặt dấu chân chú thích ngay sau mệnh đề có từ cần giải thích.
