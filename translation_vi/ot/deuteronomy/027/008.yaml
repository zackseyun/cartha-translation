  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: vi
  text: Hãy viết trên các phiến đá mọi lời của luật pháp này thật rõ ràng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “minh bạch” hoặc “sao cho dễ hiểu.” Cụm từ Hê-bơ-rơ kết hợp một động từ có nghĩa “làm rõ, giải bày” với một từ tăng cường.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Hãy viết
  rationale: Dạng Qal hoàn thành ngôi hai số ít có liên từ, trong chuỗi chỉ thị, mang lực mệnh lệnh; “Hãy viết” diễn đạt tự nhiên trong tiếng Việt và giữ lời truyền trực tiếp cho một người đại diện.
- source_word: עַל הָאֲבָנִים
  choice: trên các phiến đá
  rationale: עַל có nghĩa thông thường là “trên”; danh từ có mạo từ chỉ những phiến đá đã được nhắc đến. “Các phiến đá” tự nhiên và cụ thể trong ngữ cảnh khắc chữ.
- source_word: אֵת כָּל דִּבְרֵי
  choice: mọi lời
  rationale: Giữ sắc thái hình thức của כָּל דִּבְרֵי là toàn thể các lời được truyền, thay vì diễn giải thành “mọi điều khoản”.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: của luật pháp này
  rationale: Trong bối cảnh giao ước và pháp quy của Phục Truyền Luật Lệ Ký, תּוֹרָה được dịch tự nhiên là “luật pháp”; “này” giữ nguyên đại từ chỉ định.
- source_word: בַּאֵר הֵיטֵב
  choice: thật rõ ràng
  rationale: באר mang ý làm cho rõ hoặc giải bày, còn הֵיטֵב tăng cường ý ấy. Trong ngữ cảnh viết trên đá, cụm trạng ngữ “thật rõ ràng” giữ được cả cách hiểu chữ viết phải rõ lẫn nội dung phải được trình bày sao cho sáng tỏ.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại, dễ hiểu. Dùng “phiến đá” để hợp với bề mặt dùng ghi khắc; giữ “luật pháp” theo ngữ cảnh giao ước. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
