base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: vi
  text: Vậy, anh em phải lắng nghe tiếng phán của Yahweh, Đức Chúa Trời của anh em, và thực hành các điều răn cùng các luật lệ của Ngài mà hôm nay tôi truyền cho anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vâng lời Yahweh, Đức Chúa Trời của anh em.” Thành ngữ Hê-bơ-rơ “lắng nghe tiếng phán” thường bao hàm ý làm theo, vâng phục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: Vậy, anh em phải lắng nghe tiếng
  rationale: Cụm שׁמע בקול mang nghĩa nghe và chú tâm làm theo. “Lắng nghe tiếng” giữ được hình ảnh nguyên ngữ, trong khi ý vâng phục được hàm ý và được làm rõ bởi mệnh đề “thực hành” tiếp theo. Liên từ וְ được diễn đạt là “Vậy” để nối với lời xác nhận giao ước ở câu trước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu số ít tập thể; “anh em” chỉ toàn thể dân Israel đang được Môi-se ngỏ lời.
- source_word: וְעָשִׂיתָ
  choice: và thực hành
  rationale: Động từ עשה ở đây chỉ việc làm, thi hành hay đem các mệnh lệnh vào thực tế. “Thực hành” tự nhiên hơn “làm các điều răn” trong tiếng Việt.
- source_word: מִצְוֺתָיו
  choice: các điều răn của Ngài
  rationale: “Điều răn” giữ sắc thái mệnh lệnh giao ước của מִצְוָה.
- source_word: חֻקָּיו
  choice: các luật lệ của Ngài
  rationale: “Luật lệ” là cách diễn đạt rõ ràng, trang trọng cho חֻקִּים và vẫn phân biệt với “điều răn”.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Giữ tính trực tiếp của lời Môi-se đang ban truyền và nhấn mạnh “hôm nay” theo nguyên văn.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; giữ “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Phạm vi ý nghĩa của שׁמע בקול
  choice: lắng nghe tiếng
  alternative: vâng lời
  rationale: Cách chọn này bảo tồn hình ảnh và độ rộng của thành ngữ Hê-bơ-rơ, không đồng nhất hoàn toàn việc nghe với vâng phục; chú thích nêu rõ sắc thái vâng theo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “anh em” diễn đạt đối tượng số ít tập thể trong nguyên ngữ là toàn dân Israel; “Ngài” dùng để quy chiếu kính trọng đến Yahweh.
