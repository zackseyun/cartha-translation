  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ וְ/הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֔ם אֶ֥ל כָּל יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַסְכֵּ֤ת וּ/שְׁמַע֙ יִשְׂרָאֵ֔ל הַ/יּ֤וֹם הַ/זֶּה֙ נִהְיֵ֣יתָֽ לְ/עָ֔ם לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: vi
  text: 'Rồi Môi-se và các thầy tế lễ Lê-vi nói với toàn thể Y-sơ-ra-ên: “Hỡi Y-sơ-ra-ên, hãy im lặng và lắng nghe![a] Hôm nay, anh em đã trở thành một dân thuộc về Yahweh, Đức Chúa Trời của anh em.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy chú tâm và lắng nghe.” Mệnh lệnh Hê-bơ-rơ có thể nhấn mạnh sự im lặng hoặc sự tập trung chú ý.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng động từ và hậu tố ngôi hai số ít để nói với Y-sơ-ra-ên như một tập thể. “Anh em” là cách xưng hô tự nhiên với cộng đồng trong tiếng Việt. Cũng có thể dịch: “một dân của Yahweh, Đức Chúa Trời của anh em.”'
    reason: linguistic_and_lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến lời thuật; “Rồi ... nói” tự nhiên trong tiếng Việt và giữ rõ hành động phát ngôn.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: các thầy tế lễ người Lê-vi
  rationale: Cụm đồng vị xác định các thầy tế lễ là người Lê-vi; cách diễn đạt này tự nhiên và không xóa quan hệ giữa hai danh từ.
- source_word: כָּל יִשְׂרָאֵל
  choice: toàn thể Y-sơ-ra-ên
  rationale: Giữ nghĩa tập thể của toàn dân Y-sơ-ra-ên bằng cách diễn đạt trang trọng, dễ hiểu.
- source_word: הַסְכֵּת
  choice: hãy im lặng
  rationale: Mệnh lệnh này có thể chỉ sự yên lặng hoặc sự chú tâm; bản chính giữ sắc thái cụ thể là im lặng, còn chú thích bảo lưu khả năng kia.
- source_word: וּשְׁמַע
  choice: và lắng nghe
  rationale: “Lắng nghe” diễn đạt rõ mệnh lệnh tiếp nhận cách chăm chú hơn “nghe” trong tiếng Việt hiện đại.
- source_word: הַיּוֹם הַזֶּה
  choice: Hôm nay
  rationale: Tương đương tự nhiên của cụm chỉ thời gian “ngày này” trong tiếng Việt hiện đại.
- source_word: נִהְיֵיתָ לְעָם
  choice: anh em đã trở thành một dân
  rationale: Giữ danh từ không xác định “một dân”; đại từ “anh em” là cách xưng hô tự nhiên với cộng đồng trong tiếng Việt, dù tiếng Hê-bơ-rơ dùng ngôi hai số ít để gọi Y-sơ-ra-ên như một tập thể.
- source_word: לַיהוָה
  choice: thuộc về Yahweh
  rationale: Trong kết cấu היה + ל, giới từ biểu thị mối liên hệ quy thuộc giao ước; “thuộc về” làm rõ sắc thái này, đồng thời dùng trực tiếp danh giao ước Yahweh.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Cách dịch trang trọng, quen thuộc; diễn đạt sở hữu tương ứng với hậu tố ngôi hai, vốn chỉ Y-sơ-ra-ên như một tập thể.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; “Yahweh” bảo tồn danh giao ước mà không thay bằng một tước hiệu.
- issue: Lời xưng hô số ít mang nghĩa tập thể với Y-sơ-ra-ên
  choice: anh em đã trở thành một dân
  alternative: ngươi đã trở thành một dân
  rationale: Tiếng Hê-bơ-rơ dùng ngôi hai số ít để xưng hô với Y-sơ-ra-ên như một thực thể tập thể. “Anh em” tự nhiên hơn trong tiếng Việt hiện đại; chú thích nêu rõ hình thức số ít để không làm mất nét tu từ giao ước.
- issue: Sắc thái của ל trong נִהְיֵיתָ לְעָם לַיהוָה
  choice: một dân thuộc về Yahweh
  alternative: một dân cho Yahweh
  rationale: “Thuộc về” thể hiện tự nhiên ý quy thuộc giao ước của היה + ל, nhưng chú thích bảo lưu cách dịch sát cấu trúc hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “thầy tế lễ” và các dạng tên riêng quen thuộc trong tiếng Việt; giữ “Yahweh” theo trực tiếp danh יהוה. Dấu gọi sau “Hỡi Y-sơ-ra-ên” giúp câu mệnh lệnh tự nhiên. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
