id: DEU.27.6
reference: Deuteronomy 27:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: vi
  text: Hãy xây bàn thờ của Yahweh, Đức Chúa Trời của anh em, bằng những viên đá nguyên vẹn[a], rồi hãy dâng trên đó các lễ vật thiêu cho Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “những viên đá chưa đẽo”. Tiếng Hê-bơ-rơ nói “những viên đá nguyên vẹn/hoàn chỉnh”; cách hiểu “chưa đẽo” dựa vào chỉ thị ở câu 5 rằng không được dùng dụng cụ bằng sắt trên đá.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: những viên đá nguyên vẹn
  rationale: שְׁלֵמוֹת trực tiếp chỉ sự nguyên vẹn, hoàn chỉnh. Cách dịch này giữ nghĩa từ vựng của tiếng Hê-bơ-rơ; cách hiểu “đá chưa đẽo” được ghi ở chú thích vì dựa thêm vào lệnh cấm dùng dụng cụ bằng sắt ở câu 5.
- source_word: תִּבְנֶה
  choice: hãy ... xây
  rationale: Thể vị hoàn thành trong ngữ cảnh chỉ thị mang lực mệnh lệnh; “hãy xây” tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: מִזְבַּח
  choice: bàn thờ
  rationale: Thuật ngữ tiếng Việt chuẩn cho công trình dùng để dâng tế lễ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt quan hệ sở hữu/giao ước của hậu tố ngôi hai số ít; trong văn mạch Phục Truyền Luật Lệ Ký, tiếng Việt dùng “anh em” để chỉ cộng đồng Israel được ngỏ lời như một tập thể.
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: rồi trên đó hãy dâng
  rationale: Hiphil của עלה với tế vật mang nghĩa chuyên biệt là dâng tế lễ; trật tự này rõ ràng, tự nhiên trong tiếng Việt.
- source_word: עוֹלֹת
  choice: các lễ vật thiêu
  rationale: Thuật ngữ chỉ tế vật được thiêu trọn trên bàn thờ; “lễ vật thiêu” vừa rõ nghĩa vừa giữ tính chất nghi lễ.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Trong cấu trúc “dâng ... lên”, giới từ “lên” diễn đạt tự nhiên hướng và sự quy dâng của ל trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo toàn tư cách danh riêng giao ước, không thay bằng tước hiệu.
- issue: Có nên giải thích שְׁלֵמוֹת là “chưa đẽo” ngay trong chính văn hay không
  choice: đá nguyên vẹn
  alternative: đá chưa đẽo; đá nguyên khối
  rationale: Tính từ Hê-bơ-rơ tự nó có nghĩa “nguyên vẹn/hoàn chỉnh”. Ý “chưa đẽo” phù hợp với câu 5 nhưng là kết luận từ văn cảnh, nên được giữ trong chú thích thay vì đưa thẳng vào chính văn.
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “anh em” cho đại từ ngôi hai giống đực số ít mang nghĩa tập thể trong lời Môi-se nói với Israel; lặp lại đầy đủ “Yahweh, Đức Chúa Trời của anh em” để bảo toàn nhịp và sự nhấn mạnh của nguyên văn.
