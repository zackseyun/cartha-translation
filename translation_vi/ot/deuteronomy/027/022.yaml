source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: vi
  text: '“Đáng nguyền rủa thay kẻ nằm với chị em gái mình, dù là con gái của cha mình hay con gái của mẹ mình.” Toàn dân phải đáp: “A-men!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Diễn đạt tính từ vị ngữ trong công thức nguyền rủa giao ước, giữ sắc thái trang nghiêm và tự nhiên trong tiếng Việt.
- source_word: שֹׁכֵב עִם
  choice: nằm với
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ việc giao hợp; trong văn cảnh luật pháp, nghĩa tình dục rõ ràng mà không cần diễn giải lâm sàng.
- source_word: אֲחֹתוֹ
  choice: chị em gái mình
  rationale: Tiếng Việt cần dùng cụm bao quát vì từ Hê-bơ-rơ không phân biệt chị hay em gái; “mình” quy chiếu tự nhiên về chủ thể.
- source_word: בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: dù là con gái của cha mình hay con gái của mẹ mình
  rationale: Bảo toàn hai vế xác định quan hệ huyết thống theo cha hoặc theo mẹ và nhịp điệu pháp lý của nguyên văn.
- source_word: וְאָמַר כָּל הָעָם
  choice: Toàn dân phải đáp
  rationale: Trong chuỗi nghi lễ, động từ biểu thị lời đáp được quy định cho cộng đồng; “đáp” tự nhiên hơn “nói” trong ngữ cảnh xướng đáp.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời xác nhận phụng vụ quen thuộc bằng hình thức phiên âm phổ biến trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của quan hệ loạn luân bị nguyền rủa
  choice: Giữ nguyên cách xác định chị em gái là con gái cùng cha hoặc cùng mẹ, không thu hẹp chỉ còn chị em cùng cha khác mẹ hay cùng mẹ khác cha.
  alternative: Diễn giải các vế chỉ về chị em cùng cha khác mẹ hoặc cùng mẹ khác cha.
  rationale: Nguyên văn nêu quan hệ theo cha hoặc theo mẹ nhưng không loại trừ chị em cùng cả cha lẫn mẹ; bản dịch không nên tự ý thu hẹp phạm vi.
- issue: Chủ thể giống đực trong công thức luật pháp
  choice: Dùng “kẻ ... mình” và để quan hệ “chị em gái” bảo toàn cấu trúc của nguyên văn.
  alternative: Nói rõ “người đàn ông” hoặc chuyển thành công thức hoàn toàn trung tính về giới.
  rationale: Phân từ và các hậu tố trong nguyên văn là giống đực số ít; “kẻ” giữ được chủ thể pháp lý khái quát mà không thêm từ “đàn ông” vốn không xuất hiện riêng trong câu.
translation_notes:
  register: Văn phong trang nghiêm, trực tiếp và dễ hiểu. “Đáng nguyền rủa thay” tái hiện công thức tuyên cáo; “nằm với” giữ lối nói uyển chuyển của nguyên văn. Không cần chú thích vì cụm “chị em gái” cùng hai vế theo cha/theo mẹ đã truyền đạt đầy đủ nét nghĩa tiếng Hê-bơ-rơ.
