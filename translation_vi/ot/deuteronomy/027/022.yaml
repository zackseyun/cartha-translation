  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng công thức nguyền rủa của tiếng Hê-bơ-rơ: người có quan hệ tình dục với chị/em gái mình, được xác định là con gái của cha hoặc của mẹ mình. “Nằm với” giữ được lối nói uyển ngữ của nguyên văn trong văn cảnh luật pháp; “Toàn dân phải đáp” phản ánh phù hợp lời đáp cộng đồng được quy định trong chuỗi công thức này.'
  naturalness: Tiếng Việt hiện đại, trang nghiêm và rõ nghĩa. “Đáng nguyền rủa thay” có nhịp điệu tuyên cáo phù hợp; “chị em gái mình” diễn đạt tự nhiên việc tiếng Hê-bơ-rơ không phân biệt chị với em gái. Cấu trúc “dù là ... hay ...” chuyển tải hai khả năng theo cha hoặc theo mẹ một cách thông suốt.
  terminology: 'Các thuật ngữ và cách phiên âm nhất quán với văn phong Kinh Thánh tiếng Việt: “nguyền rủa,” “toàn dân,” và “A-men.” Không thêm diễn giải giáo phái hoặc thu hẹp phạm vi quan hệ được nêu trong nguồn.'
