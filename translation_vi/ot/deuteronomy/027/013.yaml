base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: vi
  text: 'Còn các chi tộc này sẽ đứng trên núi Ê-banh, về phía lời nguyền rủa[a]: Ru-bên, Gát, A-se, Sa-bu-lôn, Đan và Nép-ta-li.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “để nguyền rủa” hoặc “phụ trách phần lời nguyền rủa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Còn những chi tộc sau
  rationale: Liên từ và đại từ chỉ định giới thiệu nhóm đối ứng với nhóm ở câu trước. Thêm “chi tộc” theo danh sách kế tiếp để câu tiếng Việt rõ và tự nhiên.
- source_word: יַעַמְדוּ
  choice: sẽ đứng
  rationale: Thể vị hoàn thành chưa hoàn tất ở đây diễn tả chỉ thị cho nghi thức sắp diễn ra; “sẽ đứng” giữ được sắc thái tương lai mà không quá cổ.
- source_word: עַל הַקְּלָלָה
  choice: để công bố lời nguyền rủa
  rationale: עַל trong bối cảnh nghi lễ chỉ sự phân công hoặc liên hệ với phần nguyền rủa. Cách dịch này làm rõ hành động được ngữ cảnh hàm ý, còn chú thích lưu lại các cách hiểu ngắn gọn hơn của tiếng Hê-bơ-rơ.
- source_word: בְּהַר עֵיבָל
  choice: trên núi Ê-banh
  rationale: בְּ chỉ địa điểm; “trên núi” là cách nói tự nhiên trong tiếng Việt. Tên địa danh được phiên âm theo lối dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: רְאוּבֵן גָּד אָשֵׁר זְבוּלֻן דָּן נַפְתָּלִי
  choice: Ru-bên, Gát, A-se, Sa-bu-lôn, Đan và Nép-ta-li
  rationale: Các tên chi tộc được phiên âm theo dạng tiếng Việt rõ ràng và quen thuộc.
theological_decisions:
- issue: Vai trò nghi lễ của các chi tộc đối với lời nguyền rủa
  choice: để công bố lời nguyền rủa
  alternative: để nguyền rủa; phụ trách phần lời nguyền rủa
  rationale: Tiếng Hê-bơ-rơ không nêu lại động từ “công bố”, nhưng cấu trúc song song giữa lời chúc phước và lời nguyền rủa trong các câu 12–13 hàm ý sự tham gia vào nghi thức tuyên đọc. Chú thích giữ lại độ hàm súc và tính đa nghĩa của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu giữ cấu trúc chỉ thị nghi lễ; tên riêng dùng dạng phiên âm tiếng Việt thông dụng.
