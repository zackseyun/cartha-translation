- from: 'Các người Lê-vi sẽ cất tiếng nói với toàn thể người Y-sơ-ra-ên rằng:'
  to: Những người Lê-vi sẽ lớn tiếng đáp và nói với mọi người Y-sơ-ra-ên rằng:[a]
  rationale: Bản sửa bổ sung rõ ràng sắc thái công bố “lớn tiếng” của קוֹל רָם, bảo lưu cả hai động từ “đáp và nói”, và dùng cách xưng gọi tự nhiên trong tiếng Việt hiện đại. Chú thích ghi nhận hình thức giống đực số ít của nguyên văn mà vẫn giữ bản dịch chính theo lực tập thể của cụm từ.
