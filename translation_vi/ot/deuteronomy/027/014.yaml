  yaml_path: translation/ot/deuteronomy/027/014.yaml
  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: vi
  text: Những người Lê-vi sẽ lớn tiếng đáp và nói với mọi người Y-sơ-ra-ên rằng:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “với mỗi người nam của Y-sơ-ra-ên.” Nguyên văn Hê-bơ-rơ dùng cụm số ít giống đực, theo nghĩa đại diện/tập thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ
  choice: sẽ cất tiếng
  rationale: Trong công thức này, ענה mở đầu một lời đáp hay lời tuyên bố chính thức. Tiếng Việt không cần dịch máy móc là “đáp” khi chưa có câu hỏi trực tiếp; “cất tiếng” giữ chức năng dẫn nhập lời công bố và kết hợp tự nhiên với וְאָמְרוּ.
- source_word: הַלְוִיִּם
  choice: các người Lê-vi
  rationale: Nguyên văn nói rõ “người Lê-vi”, không phải “các thầy tế lễ”; cách dịch này giữ đúng sự phân biệt với các thầy tế lễ ở câu trước.
- source_word: וְאָמְרוּ
  choice: nói ... rằng
  rationale: אמר là động từ thông dụng chỉ hành vi nói. Cấu trúc “cất tiếng nói ... rằng” tự nhiên trong tiếng Việt và dẫn thẳng vào nội dung được công bố ở các câu sau.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: với toàn thể người Y-sơ-ra-ên
  rationale: אִישׁ ở số ít giống đực nhưng có lực đại diện/tập thể trong cụm này. “Toàn thể người Y-sơ-ra-ên” truyền đạt đối tượng là cả cộng đồng giao ước mà không gây hiểu lầm rằng chỉ một cá nhân hay chỉ nam giới được nói đến.
- source_word: קוֹל רָם
  choice: cất tiếng
  rationale: Cụm Hê-bơ-rơ chỉ việc công bố bằng giọng lớn để mọi người nghe. Trong tiếng Việt, “cất tiếng nói” ở đây diễn đạt tự nhiên việc nói lớn trước công chúng; sắc thái âm lượng cũng được làm rõ trong văn cảnh công bố tập thể.
theological_decisions:
- issue: Ngôn ngữ đại diện giống đực trong אִישׁ
  choice: toàn thể người Y-sơ-ra-ên
  alternative: mọi người nam của Y-sơ-ra-ên
  rationale: Danh từ số ít giống đực được dùng với lực tập thể, hướng đến cộng đồng Y-sơ-ra-ên. Dịch là “mọi người nam” sẽ thu hẹp đối tượng quá mức; “toàn thể người Y-sơ-ra-ên” giữ được phạm vi đại diện mà không áp đặt một kết luận giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Y-sơ-ra-ên” và “người Lê-vi” theo lối gọi Kinh Thánh quen thuộc; tránh cách dịch quá sát mặt chữ nhưng thiếu tự nhiên như “đáp và nói với mỗi người nam”.
