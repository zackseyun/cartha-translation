source:
  edition: WLC
  text: אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּ/דָּ֑רֶךְ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: vi
  text: '“Đáng nguyền rủa thay kẻ làm cho người mù lạc đường.” Toàn dân phải nói: “A-men!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Giữ sắc thái của công thức tuyên bố lời nguyền trong giao ước, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: מַשְׁגֶּה
  choice: kẻ làm cho ... lạc đường
  rationale: 'Phân từ Hiphil diễn tả ý gây khiến: khiến một người đi sai đường hoặc lạc hướng. Cách dịch này giữ rõ nghĩa gây khiến trong ngữ cảnh cụ thể.'
- source_word: עִוֵּר
  choice: người mù
  rationale: Tính từ số ít được dùng như danh từ, chỉ một cá nhân bị mù. Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp, nên “người mù” vừa chính xác vừa tự nhiên.
- source_word: בַּדָּרֶךְ
  choice: lạc đường
  rationale: Cụm từ mang nghĩa không gian cụ thể; kết hợp với động từ gây khiến thành cách nói tiếng Việt tự nhiên “làm cho ... lạc đường,” không chuyển thành nghĩa bóng.
- source_word: וְאָמַר
  choice: phải nói
  rationale: Trong chuỗi chỉ dẫn nghi lễ-pháp lý này, waw + qatal có giá trị quy định. “Phải nói” truyền đạt rõ đáp lời được yêu cầu, thay vì kể lại một hành động trong quá khứ.
- source_word: כָּל הָעָם
  choice: toàn dân
  rationale: Diễn đạt gọn và tự nhiên đúng với “tất cả dân chúng,” không thêm “Israel” vốn không có trực tiếp trong câu.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời đáp phụng vụ và giao ước quen thuộc bằng dạng phiên âm phổ biến trong tiếng Việt.
theological_decisions:
- issue: Công thức lời nguyền
  choice: Đáng nguyền rủa thay kẻ...
  alternative: Nguyện kẻ... bị nguyền rủa
  rationale: Bản Hê-bơ-rơ là một lời tuyên bố về tình trạng bị nguyền rủa, không đơn thuần là lời cầu mong; cách dịch đã chọn giữ tính chất pháp lý và giao ước ấy.
- issue: Cách thể hiện עִוֵּר ở giống đực số ít
  choice: người mù
  alternative: người đàn ông mù
  rationale: Tiếng Hê-bơ-rơ dùng dạng giống đực số ít để nêu một trường hợp cá nhân, nhưng tiếng Việt không có sự tương ứng bắt buộc về giống ngữ pháp. “Người mù” giữ số ít theo nghĩa mà không thêm sự nhấn mạnh giới tính không tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kẻ” trong công thức kết án để giữ lực pháp lý; “toàn dân phải nói” thể hiện lời đáp cộng đồng mang tính quy định.
