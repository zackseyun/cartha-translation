revisions:
- from: '“Đáng nguyền rủa thay kẻ ăn nằm với vợ của cha mình[a], vì kẻ ấy đã lật vạt áo của cha mình lên[b]!” Toàn dân phải nói: “A-men!”'
  to: '“Đáng nguyền rủa thay kẻ ăn nằm với vợ của cha mình[a], vì kẻ ấy đã vén vạt áo của cha mình[b]!” Toàn dân phải nói: “A-men!”'
  rationale: Chỉ thay “lật vạt áo ... lên” bằng “vén vạt áo” để tiếng Việt tự nhiên hơn. Bản dịch vẫn bảo tồn phép uyển ngữ của tiếng Hê-bơ-rơ, không áp đặt cách diễn giải “mẹ kế” hay “giường hôn nhân”, và giữ đúng các điểm neo chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:11:17Z'
