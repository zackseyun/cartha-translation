  text: אָר֗וּר שֹׁכֵב֙ עִם אֵ֣שֶׁת אָבִ֔י/ו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑י/ו וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: vi
  text: '“Đáng nguyền rủa thay kẻ ăn nằm với vợ của cha mình[a], vì kẻ ấy đã vén vạt áo của cha mình[b]!” Toàn dân phải nói: “A-men!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Người vợ này trong văn cảnh có thể là mẹ kế của kẻ ấy, nhưng nguyên văn chỉ nói “vợ của cha mình”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn nói “vén vạt áo của cha mình”, một lối nói uyển chuyển mang hàm ý tình dục; cũng có thể hiểu là “phơi bày sự trần truồng của cha mình”. So sánh Lê-vi Ký 18:8; 20:11.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Diễn đạt công thức tuyên bố lời nguyền trong giao ước bằng văn phong trang trọng, rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: שֹׁכֵב עִם
  choice: ăn nằm với
  rationale: Thành ngữ tiếng Việt chỉ quan hệ tình dục, tương ứng với lối nói uyển chuyển của tiếng Hê-bơ-rơ và phù hợp văn cảnh luật pháp.
- source_word: אֵשֶׁת אָבִיו
  choice: vợ của cha mình
  rationale: Giữ nguyên phạm vi nghĩa của nguyên văn, không thu hẹp thành “mẹ kế”, dù trong văn cảnh người phụ nữ có thể là mẹ kế.
- source_word: כִּי
  choice: vì
  rationale: 'Thể hiện trực tiếp quan hệ nguyên nhân: hành vi tiếp theo là căn cứ của lời nguyền.'
- source_word: גִלָּה כְּנַף אָבִיו
  choice: đã lật vạt áo của cha mình lên
  rationale: Giữ hình ảnh uyển ngữ của nguyên văn; כָּנָף có nghĩa cơ bản là cánh, mép hoặc vạt áo, và ở đây mang hàm ý tình dục gắn với quyền hôn nhân và danh dự của người cha.
- source_word: וְאָמַר כָּל הָעָם
  choice: Toàn dân phải nói
  rationale: Diễn đạt công thức đáp lời mang tính nghi lễ và bắt buộc trong bối cảnh giao ước.
- source_word: אָמֵן
  choice: A-men
  rationale: Giữ nguyên lời đáp phụng vụ quen thuộc bằng cách phiên âm theo cách dùng phổ biến trong tiếng Việt.
theological_decisions:
- issue: Cách dịch uyển ngữ tình dục כְּנַף אָבִיו trong lời nguyền pháp lý
  choice: Giữ hình ảnh “lật vạt áo của cha mình lên”
  alternative: “phơi bày sự trần truồng của cha mình” hoặc diễn giải là “xâm phạm giường hôn nhân của cha mình”
  rationale: Nguyên văn dùng כָּנָף, nghĩa đen là cánh, mép hay vạt áo, chứ không trực tiếp dùng danh từ “sự trần truồng”. Giữ ẩn dụ bảo toàn mối liên hệ với ngôn ngữ luật pháp tình dục của Ngũ Kinh và không quyết định dứt khoát một sắc thái còn có thể được hiểu theo nhiều cách.
- issue: Quan hệ của אֵשֶׁת אָבִיו với người phạm tội
  choice: “vợ của cha mình”
  alternative: “mẹ kế của mình”
  rationale: Người phụ nữ rất có thể là mẹ kế, nhưng tiếng Hê-bơ-rơ chỉ nói “vợ của cha người ấy”; bản dịch không nên bổ sung một quan hệ mà câu này không nói rõ.
translation_notes:
  register: Văn phong pháp lý–nghi lễ, trang trọng nhưng dễ hiểu. “Ăn nằm với” giữ tính uyển ngữ mà vẫn rõ nghĩa; “vạt áo” bảo toàn hình ảnh cụ thể của tiếng Hê-bơ-rơ. Dùng “kẻ ấy” để tránh lặp đại từ thiếu tự nhiên, và “phải nói” để thể hiện lời đáp bắt buộc của toàn dân.
