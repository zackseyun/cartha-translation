  naturalness: “Lật vạt áo ... lên” hơi gượng trong tiếng Việt hiện đại và gợi một thao tác vật lý thô, trong khi “vén vạt áo” là cách nói tự nhiên hơn, vẫn giữ được hình ảnh uyển ngữ và sắc thái pháp lý–nghi lễ.
  terminology: “Đáng nguyền rủa thay”, “ăn nằm với”, “vợ của cha mình”, và “A-men” phù hợp văn phong trang trọng. Không nên đổi “vợ của cha mình” thành “mẹ kế”, vì nguyên văn không nêu rõ quan hệ ấy.
