  yaml_path: translation/ot/deuteronomy/022/011.yaml
  text: You shall not wear cloth made of wool and linen together[a].
translation:
  language: vi
  text: Anh em không được mặc vải dệt bằng len và vải lanh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “sha-at-nết, len và vải lanh cùng nhau.” Từ hiếm “sha-at-nết” chỉ loại vải pha trộn từ hai chất liệu này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: không được mặc
  rationale: Cấu trúc phủ định với động từ ở ngôi thứ hai số ít diễn đạt điều cấm; tiếng Việt dùng “không được mặc” tự nhiên và rõ nghĩa trong văn luật.
- source_word: שַׁעַטְנֵז
  choice: vải pha
  rationale: Từ hiếm này chỉ loại vật liệu pha trộn bị cấm; cụm đồng vị theo sau xác định đó là len và vải lanh. “Vải pha” giữ ý chính mà không buộc người đọc phải hiểu một từ phiên âm xa lạ.
- source_word: צֶמֶר
  choice: len
  rationale: Nghĩa thông dụng của danh từ trong ngữ cảnh vật liệu dệt.
- source_word: וּפִשְׁתִּים
  choice: và vải lanh
  rationale: Danh từ có thể chỉ cây lanh hoặc sản phẩm từ lanh; trong ngữ cảnh mặc quần áo, “vải lanh” truyền đạt đúng chất liệu dệt.
- source_word: יַחְדָּו
  choice: chung với nhau
  rationale: Trạng từ cho biết hai chất liệu được kết hợp trong cùng một loại vải hoặc y phục.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp rõ ràng, trang trọng nhưng hiện đại. Dùng “anh em” để diễn đạt đại từ ngôi thứ hai số ít mang tính tập thể trong lời truyền cho dân Y-sơ-ra-ên; cách gọi này phù hợp văn mạch Phục truyền luật lệ ký.
