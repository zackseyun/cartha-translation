base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: vi
  text: Anh cũng phải làm như vậy đối với con lừa của người anh em của anh; anh cũng phải làm như vậy đối với áo choàng của người ấy; và anh cũng phải làm như vậy đối với bất cứ vật gì của người anh em của anh đã bị thất lạc khỏi người ấy mà anh tìm thấy. Anh không được làm ngơ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Anh không được ẩn mình” hoặc “Anh không được giả vờ không thấy.”'
    reason: Bảo tồn hình ảnh phản thân của לְהִתְעַלֵּם, vốn có thể gợi việc tự che giấu hay cố tình tránh nhìn nhận sự việc.
lexical_decisions:
- source_word: וְכֵן
  choice: cũng phải làm như vậy
  rationale: Giữ ý tiếp nối với câu trước và lối lặp lại có chủ ý của văn luật; “cũng” diễn đạt וְ, còn “như vậy” diễn đạt כֵּן.
- source_word: תַּעֲשֶׂה
  choice: anh ... phải làm
  rationale: Thể chưa hoàn thành trong ngữ cảnh luật pháp mang lực mệnh lệnh. “Phải” rõ nghĩa bắt buộc mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: לַחֲמֹרוֹ
  choice: đối với con lừa của người anh em mình
  rationale: “Đối với” diễn đạt cách xử lý vật bị thất lạc; “con lừa” là nghĩa trực tiếp của חֲמוֹר. Chủ sở hữu được nói rõ theo mạch văn và אָחִיךָ ở phần sau của câu.
- source_word: לְשִׂמְלָתוֹ
  choice: đối với áo choàng của người ấy
  rationale: שִׂמְלָה thường chỉ áo khoác ngoài; “áo choàng” cụ thể, trang trọng và dễ hiểu. “Người ấy” nối lại chủ sở hữu đã nêu mà không lặp nặng nề.
- source_word: לְכָל אֲבֵדַת
  choice: đối với bất cứ vật gì ... bị thất lạc
  rationale: Cụm từ mở rộng luật từ những vật được kể tên sang mọi vật thất lạc. Cách diễn đạt này tự nhiên hơn “mọi sự mất” nhưng không thu hẹp nghĩa vào một loại tài sản.
- source_word: אָחִיךָ
  choice: người anh em mình
  rationale: Giữ hình ảnh quan hệ thân tộc và sắc thái cộng đồng giao ước của danh từ giống đực số ít. “Mình” tự nhiên trong tiếng Việt khi quy chiếu về người đang được trực tiếp căn dặn.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: bị thất lạc
  rationale: Giữ sắc thái bất cập vật/chịu sự thất lạc của động từ thay vì chuyển thành chủ động “người ấy đánh mất,” qua đó không xác định thêm tác nhân hay nguyên nhân.
- source_word: וּמְצָאתָהּ
  choice: mà anh tìm thấy
  rationale: Diễn đạt trực tiếp hành động tiếp theo của người được căn dặn khi gặp được vật thất lạc.
- source_word: לֹא תוּכַל
  choice: anh không được
  rationale: Trong văn luật, cấu trúc này diễn đạt điều bị cấm chứ không đơn thuần nói về sự bất lực; “không được” truyền đạt lực cấm rõ ràng.
- source_word: לְהִתְעַלֵּם
  choice: làm ngơ
  rationale: Diễn đạt tự nhiên hành vi cố ý không can dự hoặc coi như không thấy; hình ảnh sát chữ hơn được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch אָחִיךָ trong bối cảnh luật giao ước
  choice: người anh em mình
  alternative: người đồng bào của anh; người bà con của anh
  rationale: Bản dịch giữ từ chỉ quan hệ thân tộc giống đực số ít của tiếng Hê-bơ-rơ, không tự ý khái quát hóa thành một thuật ngữ xã hội rộng hơn, dù trong Phục Truyền Luật Lệ Ký từ này thường có phạm vi cộng đồng giao ước.
- issue: Lực nghĩa của לֹא תוּכַל לְהִתְעַלֵּם
  choice: Anh không được làm ngơ
  alternative: Anh không thể ẩn mình; anh không được giả vờ không thấy
  rationale: Trong ngữ cảnh luật pháp, thành ngữ này cấm việc trốn tránh trách nhiệm. Bản chính dùng cách nói tiếng Việt tự nhiên, còn chú thích bảo tồn hình ảnh nguyên ngữ và khả năng hiểu là cố tình không nhận biết.
translation_notes:
  register: Văn phong luật pháp hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh” giữ lối xưng hô giống đực số ít của nguyên văn; sự lặp lại “anh cũng phải làm như vậy” được duy trì để phản ánh nhịp điệu pháp lý có chủ ý. Dấu chấm phẩy giúp câu dài rõ từng vế mà không xóa cấu trúc lặp.
