source:
  edition: WLC
  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: vi
  text: Nếu có một thiếu nữ còn trinh đã được hứa gả cho một người đàn ông, và một người đàn ông khác gặp nàng trong thành rồi nằm với nàng,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Nếu có
  rationale: Mở đầu một trường hợp luật giả định; “Nếu có” tự nhiên trong văn phong pháp luật tiếng Việt và giữ rõ tính điều kiện.
- source_word: נַעֲרָ בְתוּלָה
  choice: một thiếu nữ còn trinh
  rationale: “Thiếu nữ” chỉ người nữ trẻ ở tuổi kết hôn; “còn trinh” truyền đạt trực tiếp ý nghĩa pháp lý và xã hội của בְתוּלָה bằng tiếng Việt hiện đại.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: đã được hứa gả cho một người đàn ông
  rationale: Cụm từ chỉ sự đính ước chính thức, có tính ràng buộc pháp lý; “hứa gả” dễ hiểu hơn “đính hôn” trong bối cảnh cổ đại và mạnh hơn cách hiểu về một sự cam kết hiện đại không chính thức.
- source_word: וּמְצָאָהּ אִישׁ
  choice: và một người đàn ông khác gặp nàng
  rationale: Nguyên văn chỉ nói “một người đàn ông”; thêm “khác” làm rõ đây không phải người đã được nhắc đến trước đó mà không thay đổi ý nghĩa theo ngữ cảnh. “Gặp” giữ được sắc thái tương đối trung tính của מצא.
- source_word: בָּעִיר
  choice: trong thành
  rationale: “Trong thành” phù hợp văn cảnh xã hội cổ đại và giữ chi tiết địa điểm vốn quan trọng đối với trường hợp luật ở câu kế tiếp.
- source_word: וְשָׁכַב עִמָּהּ
  choice: rồi nằm với nàng
  rationale: Giữ lối nói giảm nói tránh của nguyên văn về quan hệ tình dục, đồng thời không đưa thêm ý cưỡng ép mà động từ trong câu này không tự nó xác định.
theological_decisions:
- issue: Có nên nói rõ hành vi tình dục trong câu này là cưỡng ép hay không
  choice: Dịch trung tính là “nằm với nàng”, không thêm “cưỡng hiếp” hay “ép buộc”
  alternative: “cưỡng hiếp nàng” hoặc “ép nàng nằm với mình”
  rationale: Riêng từ ngữ của câu này không xác định rõ sự cưỡng ép. Việc không nói rõ bảo tồn tính căng thẳng và sự phân biệt pháp lý được triển khai trong văn cảnh kế tiếp, thay vì áp đặt một kết luận vào câu.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “thiếu nữ”, “hứa gả”, “trong thành” và “nàng” để phản ánh bối cảnh luật pháp cổ đại mà vẫn dễ hiểu. Không đặt chú thích vì không có phương án từ vựng thiết yếu nào cần nêu riêng; chú thích [a] trong lớp tham khảo tiếng Anh dường như gắn sai vị trí, còn nội dung của nó đã được thể hiện trực tiếp bằng “được hứa gả”.
