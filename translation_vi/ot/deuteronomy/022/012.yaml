review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đạt đúng mệnh lệnh, các tua dây, bốn góc và chức năng che thân. Tuy nhiên, לְךָ (“cho mình/cho anh em”) không được thể hiện; không nên coi sắc thái này đã tự động hàm ý trong mệnh lệnh. “Tấm áo choàng” cũng cụ thể hóa כְּסוּתְךָ hơn mức văn bản đòi hỏi.
  naturalness: Câu sửa vẫn giữ văn phong luật lệ trang trọng, hiện đại và tự nhiên. Lặp lại “anh em” trong mệnh đề quan hệ giúp quy chiếu rõ ràng hơn “mình” sau cách xưng hô cộng đồng.
  terminology: “Các tua dây” là lựa chọn phù hợp cho גְּדִלִים, đồng thời chú thích giữ các khả năng “dây bện” và “tua viền”. “Tấm áo” tránh ấn định vật che phủ này là áo choàng, trong khi chú thích duy trì các cách hiểu rộng hơn.
