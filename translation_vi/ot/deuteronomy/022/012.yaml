- from: Anh em phải làm các tua dây[a] ở bốn góc tấm áo choàng[b] mà mình dùng để che thân.
  to: Anh em phải làm cho mình các tua dây[a] trên bốn góc tấm áo[b] mà anh em dùng để che thân.
  rationale: Bổ sung “cho mình” để phản ánh לְךָ. Đổi “tấm áo choàng” thành “tấm áo” nhằm không thu hẹp nghĩa của כְּסוּתְךָ, nhưng vẫn giữ câu tiếng Việt tự nhiên. Các chú thích từ vựng được giữ nguyên vì tiếp tục phản ánh những khả năng chính đáng của nguyên ngữ.
