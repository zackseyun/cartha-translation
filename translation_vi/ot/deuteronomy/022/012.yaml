base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/012.yaml
  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: vi
  text: Anh em phải làm cho mình các tua dây[a] trên bốn góc tấm áo[b] mà anh em dùng để che thân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dây bện” hoặc “các tua viền”.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ là “vật che phủ của anh em”; cũng có thể hiểu là “áo” hoặc “tấm choàng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: các tua dây
  rationale: Danh từ chỉ những dây kết hoặc tua gắn vào áo. “Tua dây” vừa tự nhiên trong tiếng Việt hiện đại, vừa giữ được ý dây bện tốt hơn chỉ “tua”.
- source_word: תַּעֲשֶׂה לָּךְ
  choice: anh em phải làm
  rationale: Dạng chưa hoàn thành trong văn luật mang lực mệnh lệnh. Đại từ số ít giống đực chỉ thành viên trong cộng đồng; “anh em” là cách xưng hô trang trọng, tự nhiên trong văn Kinh Thánh tiếng Việt. Ý hướng lợi ích của לָּךְ đã hàm trong mệnh lệnh áp dụng cho chính người nghe, nên không thêm “cho mình” để tránh câu nặng.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: ở bốn góc
  rationale: Trong ngữ cảnh tấm áo, כָּנָף chỉ góc hoặc phần ngoài cùng của vải; “bốn góc” rõ nghĩa và sát ngữ cảnh.
- source_word: כְּסוּתְךָ
  choice: tấm áo choàng
  rationale: Danh từ chỉ vật dùng để che phủ, thường là áo ngoài hay tấm choàng. “Tấm áo choàng” diễn đạt tự nhiên chức năng của vật mà không xác định quá hẹp kiểu dáng.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: mà mình dùng để che thân
  rationale: Giữ ý chức năng che phủ của động từ כסה và thể hiện đối tượng phản thân theo cách Việt tự nhiên. “Che thân” phù hợp hơn lối dịch cứng “che mình bằng nó”.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “anh em” cho ngôi thứ hai số ít giống đực có tính đại diện trong lời truyền cho cộng đồng; dùng “mình” trong mệnh đề sau để tránh lặp và tạo câu tự nhiên. Các chú thích bảo tồn độ rộng nghĩa của גְּדִלִים và כְּסוּת.
