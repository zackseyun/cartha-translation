    rationale: Danh từ Hê-bơ-rơ nghĩa là vật dùng để che phủ; có thể là áo hoặc tấm choàng, nhưng nguyên văn không bắt buộc là “áo choàng”.
  revised_text: Anh em phải làm cho mình các tua dây[a] trên bốn góc tấm áo[b] mà anh em dùng để che thân.
