revisions:
- from: Người đàn ông đã nằm với nàng phải trao cho cha của người thiếu nữ năm mươi siếc-lơ bạc, và nàng sẽ trở thành vợ người ấy, vì người ấy đã xâm phạm nàng.[a] Suốt đời mình, người ấy không được bỏ nàng.[b]
  to: Người đàn ông đã ăn nằm với nàng phải trao cho cha người thiếu nữ năm mươi siếc-lơ bạc, và nàng sẽ trở thành vợ người đàn ông ấy, vì ông ta đã xâm phạm nàng.[a] Suốt đời mình, ông ta không được bỏ nàng.[b]
  rationale: Bản sửa làm rõ nghĩa tình dục của động từ chỉ việc “nằm với” trong nguyên văn và loại bỏ mơ hồ về đại từ, đồng thời giữ nguyên sắc thái thận trọng của “xâm phạm” đối với עִנָּהּ. Các dấu chú thích vẫn được neo đúng vào từ/cụm từ mà chúng giải thích.
  reviewer_model: gpt-5.6-terra
