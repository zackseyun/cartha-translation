base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: vi
  text: Người đàn ông đã ăn nằm với nàng phải trao cho cha người thiếu nữ năm mươi siếc-lơ bạc, và nàng sẽ trở thành vợ người đàn ông ấy, vì ông ta đã xâm phạm nàng.[a] Suốt đời mình, ông ta không được bỏ nàng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát hơn là “đã làm nhục” hoặc “đã hạ nhục nàng”. Trong ngữ cảnh này, động từ Hê-bơ-rơ nói đến sự xâm phạm mang tính tình dục.
    reason: lexical_alternative
  - marker: b
    text: “Bỏ nàng” ở đây chỉ việc ruồng bỏ hoặc ly dị nàng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: phải trao
  rationale: Trong quy định pháp luật này, động từ diễn tả nghĩa vụ tiếp theo; “phải trao” thể hiện rõ tính bắt buộc và tự nhiên trong tiếng Việt.
- source_word: הָאִישׁ הַשֹּׁכֵב עִמָּהּ
  choice: người đàn ông đã nằm với nàng
  rationale: Giữ cách nói kín đáo của tiếng Hê-bơ-rơ về quan hệ tình dục, đồng thời diễn đạt cấu trúc phân từ như một hành động đã xác định người đàn ông ấy.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: cho cha của người thiếu nữ
  rationale: נַעֲרָה chỉ một thiếu nữ hoặc phụ nữ trẻ ở độ tuổi kết hôn; “người thiếu nữ” trang trọng, rõ nghĩa và không khiến người đọc mặc nhiên hiểu là trẻ nhỏ.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: năm mươi siếc-lơ bạc
  rationale: Nguyên văn là “năm mươi bạc”; trong bối cảnh pháp lý và kinh tế, đây là trọng lượng bạc tính theo siếc-lơ. Bổ sung đơn vị giúp độc giả hiện đại hiểu đúng giá trị được nói đến.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: nàng sẽ trở thành vợ người ấy
  rationale: Diễn đạt kết quả về địa vị hôn nhân mà không dùng ngôn ngữ hàm ý sở hữu.
- source_word: תַּחַת אֲשֶׁר
  choice: vì
  rationale: Cụm này nêu căn cứ cho phán quyết; “vì” là cách diễn đạt ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: עִנָּהּ
  choice: đã xâm phạm nàng
  rationale: Trong ngữ cảnh tình dục, động từ piel này chỉ hành vi hạ nhục hoặc xâm phạm nghiêm trọng. “Xâm phạm” truyền đạt tính chất vi phạm mà không xác định chi tiết hơn mức từ ngữ của mệnh đề này.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: không được bỏ nàng
  rationale: Nghĩa đen là không thể hoặc không được “đuổi/gửi nàng đi”; trong quan hệ hôn nhân, cụm này nói đến việc ruồng bỏ hoặc ly dị. “Không được bỏ nàng” vừa tự nhiên vừa giữ phần nào hình ảnh của nguyên văn.
- source_word: כָּל יָמָיו
  choice: suốt đời mình
  rationale: Chuyển thành ngữ Hê-bơ-rơ “mọi ngày của người ấy” sang cách nói tiếng Việt tự nhiên, với cùng ý nghĩa trọn đời.
theological_decisions:
- issue: Cách dịch עִנָּהּ sao cho không giảm nhẹ hành vi nhưng cũng không xác định quá mức điều mệnh đề này nói
  choice: đã xâm phạm nàng
  alternative: đã làm nhục nàng; đã cưỡng hiếp nàng
  rationale: “Xâm phạm” cho thấy đây là hành vi tình dục sai trái và nghiêm trọng. “Làm nhục” gần sắc thái hạ thấp hơn nhưng có thể quá mơ hồ trong tiếng Việt hiện đại; “cưỡng hiếp” có thể phù hợp với cách hiểu toàn phân đoạn, song cụ thể hơn chính động từ được dùng tại đây. Chú thích bảo tồn sắc thái từ vựng thay thế.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. Đại từ “nàng/người ấy” tránh sự suồng sã, vẫn dễ hiểu; “siếc-lơ” giữ đơn vị trọng lượng cổ quen dùng trong văn cảnh Kinh Thánh. Các cách diễn đạt không làm nhẹ mức độ nghiêm trọng của hành vi và cũng không áp đặt một mức độ cụ thể vượt quá từ ngữ Hê-bơ-rơ của câu.
