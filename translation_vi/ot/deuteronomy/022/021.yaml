base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: vi
  text: Họ phải đưa thiếu nữ ấy ra lối vào nhà cha nàng[a]. Những người đàn ông trong thành của nàng phải ném đá nàng cho đến chết, vì nàng đã làm một việc ô nhục trong Ít-ra-ên khi có quan hệ tình dục trái phép trong nhà cha mình[b][c]. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cô gái ấy.” Từ Hê-bơ-rơ נַעַר ở đây chỉ một người nữ còn trẻ; sắc thái cụ thể do ngữ cảnh quyết định.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “một việc đồi bại” hoặc “một hành vi đáng hổ thẹn.” Từ Hê-bơ-rơ נְבָלָה chỉ một hành vi gây phẫn nộ và ô nhục về luân lý.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “khi sống như gái điếm.” Động từ Hê-bơ-rơ זנה gợi hình ảnh mại dâm nhưng cũng thường chỉ hành vi tình dục trái phép nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: thiếu nữ ấy
  rationale: Trong ngữ cảnh luật pháp này, từ Hê-bơ-rơ chỉ một người nữ còn trẻ; “thiếu nữ” tự nhiên, trang trọng và phù hợp với ngữ cảnh hơn “cô gái”.
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: cửa nhà cha nàng
  rationale: פֶּתַח là lối mở hoặc cửa vào. Cách dịch này giữ hình ảnh cụ thể và sát cấu trúc “nhà cha nàng” của nguyên văn.
- source_word: אַנְשֵׁי עִירָהּ
  choice: những người đàn ông trong thành của nàng
  rationale: Giữ rõ danh từ giống đực số nhiều אַנְשֵׁי thay vì trung hòa thành “dân trong thành”; “thành của nàng” phản ánh quan hệ sở hữu trong nguyên văn.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים וָמֵתָה
  choice: phải ném đá nàng cho chết
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ phương thức hành hình bằng đá và kết quả “nàng chết” trong nguyên văn.
- source_word: נְבָלָה
  choice: một việc ô nhục
  rationale: Từ này chỉ hành vi đáng hổ thẹn, gây phẫn nộ về luân lý trong cộng đồng; “việc ô nhục” giữ sắc thái nghiêm trọng mà không biến thành khái niệm giáo lý về sau.
- source_word: לִזְנוֹת
  choice: khi hành dâm
  rationale: זנה gợi hành vi mại dâm hoặc đĩ điếm nhưng trong ngữ cảnh có thể chỉ rộng hơn đến quan hệ tình dục trái phép. “Hành dâm” giữ sức nặng luân lý và tránh khẳng định quá mức rằng có trao đổi tiền bạc.
- source_word: בֵּית אָבִיהָ
  choice: ngay trong nhà cha mình
  rationale: Giữ nghĩa địa điểm của cụm từ và dùng “ngay” để chuyển tải sắc thái đáng chú ý của việc hành vi xảy ra trong nhà cha, nhưng không diễn giải thành “dưới quyền cha”.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình
  rationale: Đây là công thức pháp lý lặp lại trong Phục Truyền Luật Lệ Ký. “Trừ bỏ điều ác” truyền đạt lực tư pháp của בער; đại từ số ít tập thể được diễn đạt tự nhiên là “anh em” trong lời nói với cộng đồng.
theological_decisions:
- issue: Thuật ngữ pháp lý và tình dục
  choice: “việc ô nhục” và “hành dâm”
  alternative: “việc đồi bại” và “làm gái điếm” hoặc cách rộng hơn là “gian dâm”
  rationale: Bản dịch cần giữ mức độ nghiêm trọng của lời cáo buộc nhưng không xác định quá mức rằng hành vi nhất thiết là mại dâm theo nghĩa thương mại, cũng không nhập một phạm trù thần học rộng hơn vào động từ זנה.
- issue: Chủ thể thi hành án có chỉ giới tính
  choice: “những người đàn ông trong thành của nàng”
  alternative: “dân trong thành của nàng”
  rationale: Nguyên văn dùng biểu thức giống đực “những người đàn ông của thành nàng”; giữ giới tính thể hiện chính xác hình thức pháp lý của câu.
- issue: Công thức loại trừ điều ác khỏi cộng đồng
  choice: “trừ bỏ điều ác khỏi giữa mình”
  alternative: “thanh tẩy sự gian ác khỏi anh em”
  rationale: “Trừ bỏ” phản ánh hành động loại bỏ trong công thức pháp lý mà không thêm ý niệm thanh tẩy nghi lễ vốn không được nói rõ tại đây.
translation_notes:
  register: Văn phong pháp lý, nghiêm trang nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “nàng” cho nhân vật nữ để tránh lặp và duy trì sắc thái trang trọng; dùng “anh em” cho đại từ số ít mang nghĩa cộng đồng ở cuối câu. Các từ ngữ mạnh của nguyên văn được giữ lại nhưng không cường điệu hay làm nhẹ đi.
