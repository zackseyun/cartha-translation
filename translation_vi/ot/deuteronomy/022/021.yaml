revisions:
- from: Bấy giờ, người ta phải đem thiếu nữ ấy ra cửa nhà cha nàng[a]. Những người đàn ông trong thành của nàng phải ném đá nàng cho chết, vì nàng đã làm một việc ô nhục trong Ít-ra-ên khi hành dâm ngay trong nhà cha mình[b][c]. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.
  to: Họ phải đưa thiếu nữ ấy ra lối vào nhà cha nàng[a]. Những người đàn ông trong thành của nàng phải ném đá nàng cho đến chết, vì nàng đã làm một việc ô nhục trong Ít-ra-ên khi có quan hệ tình dục trái phép trong nhà cha mình[b][c]. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.
  rationale: Bản sửa bỏ phần nhấn mạnh không có trong nguồn, dùng “lối vào” cho פֶּתַח, và làm rõ kết quả của việc ném đá. Cách dịch “có quan hệ tình dục trái phép” giữ tính bao quát có chủ ý của זנה mà không khẳng định việc trao đổi mại dâm; chú thích vẫn bảo tồn sắc thái từ nguyên liên hệ đến mại dâm.
