revisions:
- from: Nhưng nếu ở ngoài đồng, người đàn ông gặp người thiếu nữ đã đính hôn, rồi cưỡng giữ nàng[a] và nằm với nàng, thì chỉ người đàn ông đã nằm với nàng phải chết.
  to: Nhưng nếu ở ngoài đồng, người đàn ông gặp người thiếu nữ đã đính hôn, rồi người đàn ông khống chế nàng[a] và nằm với nàng, thì chỉ người đàn ông đã nằm với nàng phải chết.
  rationale: Sửa một cụm từ không tự nhiên thành “khống chế nàng”, vừa sát hơn với sắc thái dùng sức áp đảo của động từ Hê-bơ-rơ vừa rõ ràng trong tiếng Việt hiện đại. Chú thích được chỉnh để bảo toàn tính minh bạch từ vựng và nêu cách hiểu mạnh hơn do văn cảnh pháp lý xác nhận, mà không áp đặt cách diễn giải đó lên chính văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:16Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng cấu trúc điều kiện đối lập, bối cảnh ngoài đồng, tình trạng đã đính hôn, tính cưỡng ép của hành động, quan hệ tình dục và việc chỉ người đàn ông chịu án chết. Tuy nhiên, “cưỡng giữ nàng” không phải cách kết hợp tự nhiên trong tiếng Việt hiện đại và có thể gợi việc giam/giữ hơn là hành động áp chế được diễn tả bởi הֶחֱזִיק בָּהּ.
  naturalness: Cần thay “cưỡng giữ nàng” bằng “khống chế nàng”, là cách diễn đạt tự nhiên, trang trọng và phản ánh tốt ý nắm giữ bằng sức mạnh/áp đảo. Các phần còn lại, gồm “ở ngoài đồng”, “người thiếu nữ đã đính hôn”, và “phải chết”, phù hợp với văn phong pháp lý hiện đại.
  terminology: “Người thiếu nữ đã đính hôn” giữ được tình trạng hứa hôn của nguyên ngữ; “nằm với nàng” duy trì lối nói Kinh Thánh trang trọng cho quan hệ tình dục. Chú thích nên không lặp lại cách dịch chính và nên phân biệt rõ giữa động từ Hê-bơ-rơ với cách hiểu đầy đủ của hành vi theo văn cảnh.
  issues:
  - severity: medium
    issue: “cưỡng giữ nàng” là cách diễn đạt gượng và dễ lệch nghĩa.
    rationale: Cụm này trong tiếng Việt thường hướng về việc cưỡng ép giữ lại hoặc giam giữ. Trong ngữ cảnh này, “khống chế nàng” diễn tả tự nhiên hơn hành động dùng sức áp đảo, đồng thời không đưa thẳng cách diễn giải “hiếp dâm” vào chính văn.
  - severity: low
    issue: Chú thích hiện nêu “khống chế nàng” như phương án thay thế cho một cụm từ không tự nhiên trong chính văn.
    rationale: Sau khi dùng “khống chế nàng” trong chính văn, chú thích cần nêu các cách hiểu mạnh hơn theo văn cảnh mà không lặp lại cách dịch chính.
  revised_text: Nhưng nếu ở ngoài đồng, người đàn ông gặp người thiếu nữ đã đính hôn, rồi người đàn ông khống chế nàng[a] và nằm với nàng, thì chỉ người đàn ông đã nằm với nàng phải chết.
