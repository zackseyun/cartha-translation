language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְֽ/אִם בַּ/שָּׂדֶ֞ה יִמְצָ֣א הָ/אִ֗ישׁ אֶת ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/הֶחֱזִֽיק בָּ֥/הּ הָ/אִ֖ישׁ וְ/שָׁכַ֣ב עִמָּ֑/הּ וּ/מֵ֗ת הָ/אִ֛ישׁ אֲשֶׁר שָׁכַ֥ב עִמָּ֖/הּ לְ/בַדּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: vi
  text: Nhưng nếu ở ngoài đồng, người đàn ông gặp người thiếu nữ đã đính hôn, rồi người đàn ông khống chế nàng[a] và nằm với nàng, thì chỉ người đàn ông đã nằm với nàng phải chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “cưỡng bức nàng” hoặc “hiếp dâm nàng”. Tiếng Hê-bơ-rơ dùng một động từ nghĩa là “nắm giữ” hoặc “khống chế”; luật lệ trong văn cảnh cho thấy rõ hành vi này không có sự đồng thuận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu trường hợp có điều kiện tương phản với tình huống trước đó.
- source_word: בַּשָּׂדֶה
  choice: ở ngoài đồng
  rationale: Diễn đạt tự nhiên ý 'trong đồng ruộng', đồng thời cho thấy đây là nơi trống trải, biệt lập, có ý nghĩa trong văn cảnh luật pháp.
- source_word: יִמְצָא
  choice: gặp
  rationale: Trong ngữ cảnh tình huống pháp lý này, 'gặp' tự nhiên hơn 'tìm thấy' mà vẫn chuyển tải động từ מצא.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: người thiếu nữ đã đính hôn
  rationale: '''Thiếu nữ'' là cách gọi trang trọng, dễ hiểu; ''đã đính hôn'' diễn đạt tình trạng được hứa gả có hiệu lực pháp lý trong bối cảnh cổ đại.'
- source_word: וְהֶחֱזִיק בָּהּ
  choice: cưỡng giữ nàng
  rationale: Kết hợp ý nắm giữ của חזק với sắc thái dùng sức, nhưng không thay trực tiếp bằng một động từ chuyên biệt có nghĩa 'hiếp dâm'.
- source_word: וְשָׁכַב עִמָּהּ
  choice: nằm với nàng
  rationale: Giữ thành ngữ chỉ quan hệ tình dục của tiếng Hê-bơ-rơ bằng lối nói trang trọng, sát nguyên văn.
- source_word: וּמֵת
  choice: phải chết
  rationale: Trong văn cảnh luật pháp, hình thức này nêu hậu quả mang tính bắt buộc.
- source_word: לְבַדּוֹ
  choice: chỉ ... người đàn ông
  rationale: 'Nêu rõ tính loại trừ: án tử hình chỉ áp dụng cho người đàn ông, không áp dụng cho người nữ.'
theological_decisions:
- issue: Có nên nói rõ hành vi bạo lực tình dục trong chính văn vượt quá nội dung từ vựng của חזק hay không
  choice: Dùng 'cưỡng giữ nàng' trong chính văn, để bối cảnh luật pháp xác nhận hành vi không có sự đồng thuận.
  alternative: hiếp dâm nàng; dùng sức ép nàng
  rationale: Toàn bộ văn cảnh cho thấy rõ đây là hành vi cưỡng bức, nhưng חזק về mặt từ vựng có nghĩa là nắm, giữ chặt hoặc khống chế chứ không phải một động từ chuyên biệt mang nghĩa 'hiếp dâm'. Cách dịch này vừa thể hiện sự cưỡng ép vừa giữ tính minh bạch với nguyên ngữ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dễ hiểu. Dùng 'nàng' để tránh lặp nặng nề và duy trì sắc thái trang nghiêm; giữ thành ngữ 'nằm với' vì sát nguyên văn và phù hợp văn phong Kinh Thánh tiếng Việt.
