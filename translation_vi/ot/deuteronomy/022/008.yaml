review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng tình huống luật lệ, yêu cầu dựng hàng rào bảo vệ trên mái, và hệ quả trách nhiệm khi một người ngã. Tuy nhiên, “anh em” chuyển ngôi số ít Hê-bơ-rơ sang số nhiều, còn “gây tội đổ máu cho nhà mình” chưa tự nhiên và có thể làm mờ ý thành ngữ về việc gánh trách nhiệm máu đổ liên quan đến ngôi nhà.
  naturalness: “Lan can quanh mái nhà” là cách nói hiện đại, dễ hiểu; chú thích giải thích đúng bối cảnh mái bằng. Cần dùng chủ ngữ số ít nhất quán và diễn đạt thành ngữ “đặt máu trên nhà” bằng tiếng Việt tự nhiên hơn.
  terminology: “Tội đổ máu” bảo toàn sắc thái pháp lý-đạo đức của דָּמִים và không áp đặt diễn giải giáo phái. “Lan can” là lựa chọn phù hợp cho מַעֲקֶה khi có chú thích xác định đây là rào chắn bảo vệ quanh mép mái.
  issues:
  - severity: medium
    issue: “Anh em” không tương ứng nhất quán với ngôi thứ hai số ít của tiếng Hê-bơ-rơ.
    rationale: Động từ và hậu tố sở hữu trong câu nguồn đều là số ít. Dùng “bạn” giữ hình thức trực tiếp của điều luật và tránh chuyển không cần thiết sang số nhiều.
  - severity: medium
    issue: Cụm “gây tội đổ máu cho nhà mình” chưa tự nhiên và chưa diễn đạt rõ trách nhiệm mà chủ nhà phải gánh.
    rationale: Đây là thành ngữ pháp lý chỉ việc chuốc/mang huyết tội do không phòng ngừa nguy hiểm. “Không chuốc lấy tội đổ máu vì nhà mình” diễn đạt rõ hơn quan hệ trách nhiệm mà vẫn giữ liên hệ của tội với ngôi nhà.
  revised_text: Khi bạn xây một ngôi nhà mới, bạn phải làm một lan can quanh mái nhà[a], để không chuốc lấy tội đổ máu vì nhà mình, nếu có người ngã từ đó xuống.
