- from: Khi xây một ngôi nhà mới, anh em phải làm lan can quanh mái nhà[a], để khỏi gây tội đổ máu cho nhà mình nếu có người ngã từ đó xuống.
  to: Khi bạn xây một ngôi nhà mới, bạn phải làm một lan can quanh mái nhà[a], để không chuốc lấy tội đổ máu vì nhà mình, nếu có người ngã từ đó xuống.
  rationale: Bản sửa giữ cấu trúc điều kiện và tính mệnh lệnh của luật lệ, phục hồi ngôi thứ hai số ít, đồng thời thay cụm diễn đạt huyết tội bằng cách nói tiếng Việt rõ và tự nhiên hơn. Chú thích được giữ nguyên vì giải thích chính xác chức năng của lan can trong bối cảnh nhà có mái bằng.
