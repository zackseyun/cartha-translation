source:
  edition: WLC
  text: כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְ/עָשִׂ֥יתָ מַעֲקֶ֖ה לְ/גַגֶּ֑/ךָ וְ/לֹֽא תָשִׂ֤ים דָּמִים֙ בְּ/בֵיתֶ֔/ךָ כִּֽי יִפֹּ֥ל הַ/נֹּפֵ֖ל מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: vi
  text: Khi bạn xây một ngôi nhà mới, bạn phải làm một lan can quanh mái nhà[a], để không chuốc lấy tội đổ máu vì nhà mình, nếu có người ngã từ đó xuống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là rào chắn bảo vệ được xây quanh mép mái bằng.
    reason: Giải thích bối cảnh kiến trúc và nghĩa cụ thể của מַעֲקֶה cho độc giả hiện đại.
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Từ này mở đầu một trường hợp luật định, nên “Khi” tự nhiên và phù hợp hơn cách dịch chỉ nguyên nhân.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: xây một ngôi nhà mới
  rationale: Diễn đạt trực tiếp, tự nhiên, giữ nguyên bối cảnh cụ thể của điều luật.
- source_word: וְעָשִׂיתָ
  choice: phải làm
  rationale: Trong văn luật, dạng động từ này mang lực mệnh lệnh; “phải” truyền đạt rõ nghĩa vụ mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: מַעֲקֶה
  choice: lan can
  rationale: Chỉ rào chắn bảo vệ quanh mép mái bằng; “lan can” thông dụng và dễ hiểu đối với độc giả Việt.
- source_word: לְגַגֶּךָ
  choice: quanh mái nhà
  rationale: Giới từ gắn rào chắn với mái cần được bảo vệ; “quanh” làm rõ vị trí thực tế của lan can mà không thay đổi nội dung.
- source_word: וְלֹא תָשִׂים דָּמִים
  choice: để khỏi gây tội đổ máu
  rationale: Thành ngữ Hê-bơ-rơ nói đến việc làm phát sinh trách nhiệm pháp lý và đạo đức về cái chết có thể phòng tránh; cách dịch này giữ cả ý về máu và tội trách nhiệm.
- source_word: בְּבֵיתֶךָ
  choice: cho nhà mình
  rationale: Diễn tả tội trách nhiệm bị quy cho ngôi nhà, tức tài sản thuộc trách nhiệm của người xây; cách nói này tự nhiên hơn lối dịch sát chữ “đặt máu trong nhà”.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: nếu có người ngã
  rationale: Cụm phân từ Hê-bơ-rơ chỉ một người bất định trong tình huống có thể xảy ra; “nếu có người” giữ rõ tính điều kiện.
- source_word: מִמֶּנּוּ
  choice: từ đó xuống
  rationale: Đại từ nhiều khả năng quy về mái nhà hoặc cấu trúc vừa nói đến; “từ đó” giữ tham chiếu gọn và không xác định quá mức.
theological_decisions:
- issue: Ý nghĩa của דָּמִים trong bối cảnh pháp luật
  choice: tội đổ máu
  alternative: nợ máu; trách nhiệm về máu
  rationale: Câu này nói đến trách nhiệm pháp lý và đạo đức đối với một cái chết có thể phòng tránh, không chỉ nói đến máu theo nghĩa vật chất. “Tội đổ máu” giữ sức nặng giao ước-pháp lý nhưng không đưa thêm kết luận giáo lý.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” làm đại từ số ít có tính đại diện trong lời luật truyền cho dân giao ước; “phải” thể hiện lực mệnh lệnh rõ ràng. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
