  text: וְ/שָׂ֥ם לָ/הּ֙ עֲלִילֹ֣ת דְּבָרִ֔ים וְ/הוֹצִ֥יא עָלֶ֖י/הָ שֵׁ֣ם רָ֑ע וְ/אָמַ֗ר אֶת הָ/אִשָּׁ֤ה הַ/זֹּאת֙ לָקַ֔חְתִּי וָ/אֶקְרַ֣ב אֵלֶ֔י/הָ וְ/לֹא מָצָ֥אתִי לָ֖/הּ בְּתוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: vi
  text: 'rồi buộc tội nàng về những điều đáng xấu hổ và làm nàng mang tiếng xấu[a], rằng: “Tôi đã lấy người phụ nữ này làm vợ, nhưng khi gần gũi với nàng[b], tôi không tìm thấy ở nàng bằng chứng về sự trinh tiết[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đưa một danh xấu ra trên nàng”; đây là thành ngữ có nghĩa là bôi nhọ hoặc làm tổn hại danh dự của nàng.'
    reason: lexical_alternative
  - marker: b
    text: “Gần gũi với nàng” là cách nói giảm nói tránh trong tiếng Hê-bơ-rơ về quan hệ tình dục.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “không tìm thấy sự trinh tiết cho nàng.” Trong văn cảnh, câu này nói đến dấu hiệu hoặc bằng chứng về sự trinh tiết, như các câu tiếp theo giải thích.'
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: vu cho nàng những điều đáng xấu hổ
  rationale: Cụm từ mang tính thành ngữ chỉ việc gán cho người nữ những cáo buộc gây nhục. “Vu cho” truyền đạt rõ hành vi cáo buộc, nhưng không thêm từ “giả dối” vào nội dung của danh ngữ khi điều đó chủ yếu được xác định bởi văn cảnh.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: làm nàng mang tiếng xấu
  rationale: Giữ hình ảnh cụ thể về “tiếng/danh xấu” của thành ngữ Hê-bơ-rơ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: אֶת הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: Tôi đã lấy người phụ nữ này làm vợ
  rationale: Trong văn cảnh hôn nhân, לָקַחְתִּי có nghĩa là lấy làm vợ. Cách dịch này làm rõ nghĩa mà vẫn giữ sắc thái xa cách của “người phụ nữ này”.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: khi gần gũi nàng
  rationale: Giữ cách nói giảm nói tránh của nguyên văn về quan hệ vợ chồng và tự nhiên trong tiếng Việt.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: tôi không tìm thấy nơi nàng bằng chứng về sự trinh tiết
  rationale: Dạng số nhiều בְּתוּלִים trong bối cảnh pháp lý chỉ dấu hiệu hay bằng chứng về sự trinh tiết, như các câu tiếp theo cho thấy; “nơi nàng” phản ánh cấu trúc Hê-bơ-rơ mà vẫn dễ hiểu.
theological_decisions:
- issue: Tính chân thật của lời cáo buộc
  choice: Không trực tiếp thêm “giả dối” vào lời văn chính
  alternative: vu cáo nàng / cáo buộc nàng một cách giả dối
  rationale: Trong toàn bộ vụ việc, lời tố cáo có thể bị chứng minh là bịa đặt, nhưng bản thân cụm עֲלִילֹת דְּבָרִים không minh nhiên chứa từ “giả dối”. Bản dịch giữ sự phân biệt giữa lời tố cáo được thuật lại và phán quyết pháp lý ở các câu sau.
translation_notes:
  register: Văn phong pháp lý-tường thuật trang trọng nhưng dễ hiểu. Dùng “nàng” để phù hợp văn cảnh cổ và tránh lối nói quá thô; lời người chồng vẫn giữ sắc thái xa cách qua cụm “người phụ nữ này”. Các thành ngữ tình dục và danh dự được chuyển sang cách nói tự nhiên, kín đáo trong tiếng Việt hiện đại.
