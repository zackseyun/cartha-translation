  rationale: Thay “vu cho” bằng “buộc tội ... về” để không thêm phán đoán rằng các lời cáo buộc là sai, đồng thời giữ sắc thái nhục mạ của thành ngữ. Điều chỉnh nhỏ về giới từ và chú thích giúp tiếng Việt tự nhiên, chính xác hơn với uyển ngữ nguyên văn.
