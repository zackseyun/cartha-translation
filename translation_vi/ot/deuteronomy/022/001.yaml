source:
  edition: WLC
  text: לֹֽא תִרְאֶה֩ אֶת שׁ֨וֹר אָחִ֜י/ךָ א֤וֹ אֶת שֵׂי/וֹ֙ נִדָּחִ֔ים וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖/ם לְ/אָחִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: vi
  text: Anh em không được thấy bò hay chiên của người anh em mình đi lạc mà làm ngơ; phải nhất định đem chúng về cho người anh em mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: người anh em mình
  rationale: Giữ cách gọi mang tính cộng đồng giao ước của tiếng Hê-bơ-rơ; trong ngữ cảnh này không nhất thiết chỉ anh em ruột hoặc người nam.
- source_word: שֵׂיוֹ
  choice: chiên của người anh em mình
  rationale: שֶׂה chỉ một con thuộc đàn chiên hoặc dê; “chiên” tự nhiên, gọn và phù hợp cặp gia súc điển hình với “bò”.
- source_word: נִדָּחִים
  choice: đi lạc
  rationale: Dạng bị động có thể gợi ý bị xua đi hoặc lạc khỏi nơi thuộc về; trong luật về súc vật thất lạc, “đi lạc” truyền đạt đúng tình trạng mà không khẳng định tác nhân không được nêu.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: mà làm ngơ
  rationale: Diễn đạt tự nhiên hành vi cố ý không để tâm, quay mặt khỏi những con vật đã thấy.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: phải nhất định đem chúng về
  rationale: Kết cấu nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh nghĩa vụ chắc chắn; “đem ... về” thể hiện việc hoàn trả súc vật cho chủ.
theological_decisions:
- issue: Phạm vi của אָחִיךָ
  choice: người anh em mình
  alternative: đồng bào mình
  rationale: Giữ hình ảnh quan hệ thân thuộc trong nguyên văn và không thu hẹp vào anh em ruột; “đồng bào” rõ phạm vi xã hội hơn nhưng làm mất ẩn dụ gia đình của giao ước.
- issue: Sắc thái của נִדָּחִים
  choice: đi lạc
  alternative: bị xua đi
  rationale: Nguyên văn dùng dạng bị động có độ mở về nguyên nhân. Trong ngữ cảnh tìm lại gia súc thất lạc, “đi lạc” là tiếng Việt tự nhiên hơn, đồng thời không áp đặt rằng có người cố ý xua chúng.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “anh em” để trực tiếp hướng đến cộng đồng người nghe, và “người anh em mình” để giữ lối gọi quan hệ của nguyên văn.
