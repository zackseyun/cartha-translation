base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: vi
  text: Rồi họ phải phạt người ấy một trăm siếc-lơ bạc và trao số bạc đó cho cha của người thiếu nữ, vì người ấy đã làm cho một trinh nữ Y-sơ-ra-ên mang tiếng xấu. Nàng sẽ là vợ của người ấy; suốt đời mình, người ấy không được đuổi nàng đi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ly dị nàng”; tiếng Hê-bơ-rơ nói sát nghĩa là “đuổi nàng đi”, một cách diễn đạt thường dùng cho việc chấm dứt hôn nhân trong ngữ cảnh luật pháp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: họ phải phạt
  rationale: Trong ngữ cảnh luật pháp này, động từ chỉ việc áp một khoản phạt bằng tiền; “phạt” kết hợp với số tiền ngay sau đó truyền đạt tự nhiên ý nghĩa pháp lý.
- source_word: מֵאָה כֶסֶף
  choice: một trăm siếc-lơ bạc
  rationale: Nguyên văn viết gọn là “một trăm bạc”, chỉ một trọng lượng bạc trong giao dịch pháp lý. Bổ sung đơn vị “siếc-lơ” làm rõ số lượng được nói đến.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: cho cha của người thiếu nữ
  rationale: נַעֲרָה chỉ một phụ nữ trẻ ở độ tuổi kết hôn; “người thiếu nữ” vừa rõ nghĩa vừa phù hợp văn phong trang trọng hiện đại.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: vì người ấy đã làm cho ... mang tiếng xấu
  rationale: Cách diễn đạt này giữ hình ảnh của thành ngữ Hê-bơ-rơ “đưa ra một danh xấu” mà vẫn tự nhiên trong tiếng Việt, thay vì diễn giải hẹp thành “vu khống”.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: một trinh nữ Y-sơ-ra-ên
  rationale: בְּתוּלָה trong bối cảnh lời cáo buộc này có nghĩa là “trinh nữ”; “Y-sơ-ra-ên” giữ cách định danh theo cộng đồng giao ước của nguyên văn.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Nàng vẫn phải là vợ người ấy
  rationale: Tiểu từ sở hữu và cấu trúc pháp lý quy định tình trạng hôn nhân tiếp diễn. “Vẫn phải là” diễn đạt tự nhiên hệ quả pháp lý trong mạch văn.
- source_word: לֹא יוּכַל
  choice: không được
  rationale: Trong văn luật, cấu trúc này biểu thị sự cấm đoán hoặc mất quyền pháp lý, chứ không phải bất lực thể chất.
- source_word: לְשַׁלְּחָהּ
  choice: đuổi nàng đi
  rationale: Động từ có nghĩa đen là “sai/cho đi”; trong luật hôn nhân nó có thể là thành ngữ chỉ ly dị. Cách dịch chính giữ hình ảnh của nguyên văn, còn nghĩa pháp lý rõ hơn được ghi ở chú thích.
- source_word: כָּל יָמָיו
  choice: suốt đời mình
  rationale: Thành ngữ nghĩa đen “mọi ngày của người ấy” chỉ toàn bộ quãng đời còn lại; “suốt đời mình” tự nhiên và rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Thành ngữ pháp lý về việc chấm dứt hôn nhân
  choice: đuổi nàng đi
  alternative: ly dị nàng
  rationale: Nguyên văn dùng động từ nghĩa đen là “sai/cho đi”, nhưng trong ngữ cảnh luật hôn nhân có thể chỉ việc ly dị. Bản văn chính giữ lối nói cụ thể của tiếng Hê-bơ-rơ, đồng thời chú thích nêu cách hiểu pháp lý để không xóa bỏ sắc thái nhập nhằng.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng đại từ “người ấy/nàng” để theo dõi các nhân vật rõ ràng. Giữ thuật ngữ văn hóa “siếc-lơ” và giải đạt thành ngữ Hê-bơ-rơ tự nhiên trong tiếng Việt.
