revisions:
- from: Rồi họ phải phạt người ấy một trăm siếc-lơ bạc và trao số bạc đó cho cha của người thiếu nữ, vì người ấy đã làm cho một trinh nữ Y-sơ-ra-ên mang tiếng xấu. Nàng vẫn phải là vợ người ấy; suốt đời mình, người ấy không được đuổi nàng đi.[a]
  to: Rồi họ phải phạt người ấy một trăm siếc-lơ bạc và trao số bạc đó cho cha của người thiếu nữ, vì người ấy đã làm cho một trinh nữ Y-sơ-ra-ên mang tiếng xấu. Nàng sẽ là vợ của người ấy; suốt đời mình, người ấy không được đuổi nàng đi.[a]
  rationale: Chỉ điều chỉnh mệnh đề về tình trạng hôn nhân từ “vẫn phải là” thành “sẽ là” để bám sát cấu trúc và sắc thái của tiếng Hê-bơ-rơ, không thêm ý tiếp diễn hay cưỡng chế vào mệnh đề này. Giữ nguyên chú thích để bảo tồn khả năng hiểu thành ngữ “đuổi đi” là “ly dị.”
  reviewer_model: gpt-5.6-terra
