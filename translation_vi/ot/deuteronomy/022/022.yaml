  text: כִּֽי יִמָּצֵ֨א אִ֜ישׁ שֹׁכֵ֣ב עִם אִשָּׁ֣ה בְעֻֽלַת בַּ֗עַל וּ/מֵ֨תוּ֙ גַּם שְׁנֵי/הֶ֔ם הָ/אִ֛ישׁ הַ/שֹּׁכֵ֥ב עִם הָ/אִשָּׁ֖ה וְ/הָ/אִשָּׁ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: vi
  text: Nếu phát hiện một người đàn ông nằm với một phụ nữ có chồng[a], thì cả hai đều phải chết[b]—người đàn ông đã nằm với người phụ nữ ấy, và người phụ nữ ấy. Như vậy, ngươi phải trừ bỏ điều ác khỏi Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một phụ nữ đã có chồng.” Nguyên văn sát chữ là “một phụ nữ thuộc về một người chồng,” nhấn mạnh ràng buộc hôn nhân.'
    reason: lexical_alternative
  - marker: b
    text: “Phải chết” ở đây quy định án tử hình; cũng có thể dịch rõ nghĩa pháp lý là “phải bị xử tử.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: người ta phát hiện
  rationale: Dạng Niphal diễn tả việc sự việc bị phát hiện; cách diễn đạt này tự nhiên trong văn luật pháp và không nhất thiết hàm ý bị bắt quả tang.
- source_word: שֹׁכֵב עִם
  choice: ăn nằm với
  rationale: Thành ngữ Hê-bơ-rơ chỉ quan hệ tình dục. “Ăn nằm với” giữ được hình ảnh của nguyên ngữ, có sắc thái trang trọng hơn cách nói khẩu ngữ.
- source_word: בְעֻלַת בַּעַל
  choice: một phụ nữ đã có chồng
  rationale: Cách dịch tự nhiên trong tiếng Việt, diễn đạt rõ tình trạng hôn nhân và mối ràng buộc với chồng mà không đưa sắc thái sở hữu dễ gây hiểu sai vào chính văn.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: thì cả hai đều phải chết
  rationale: Trong ngữ cảnh luật pháp, mệnh đề quy định án tử hình. “Phải chết” gần với lời nguyên ngữ hơn “phải bị xử tử,” trong khi vẫn thể hiện tính bắt buộc của hình phạt.
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה וְהָאִשָּׁה
  choice: người đàn ông đã ăn nằm với người phụ nữ ấy và người phụ nữ đó
  rationale: Giữ sự lặp lại có chủ ý của nguyên ngữ nhằm xác định rõ cả hai người cùng chịu hình phạt.
- source_word: וּבִעַרְתָּ הָרָע
  choice: Như vậy, anh em phải trừ bỏ điều ác
  rationale: בער trong công thức luật pháp Phục Truyền có nghĩa loại trừ hoặc thanh trừ. “Trừ bỏ điều ác” tự nhiên, trang nghiêm và giữ được sức nặng pháp lý-đạo đức của công thức.
- source_word: מִיִּשְׂרָאֵל
  choice: khỏi Israel
  rationale: Giới từ chỉ việc loại điều ác ra khỏi cộng đồng Israel; cách dịch ngắn gọn và sát nghĩa.
theological_decisions:
- issue: Cách diễn đạt בְעֻלַת בַּעַל về tình trạng hôn nhân
  choice: một phụ nữ đã có chồng
  alternative: một phụ nữ gắn với một người chồng
  rationale: Nguyên ngữ nhấn mạnh người phụ nữ đang ở trong ràng buộc hôn nhân. Chính văn dùng cách nói tự nhiên, còn chú thích bảo lưu nét diễn đạt sát chữ.
- issue: Có nói rõ đây là hành quyết tư pháp hay không
  choice: cả hai đều phải chết
  alternative: cả hai đều phải bị xử tử
  rationale: Bối cảnh luật pháp cho thấy đây là án tử hình, nhưng câu Hê-bơ-rơ trực tiếp nói “phải chết.” Bản dịch giữ cách nói ấy và dùng chú thích để làm rõ hàm ý tư pháp mà không thêm sắc thái bị động vào chính văn.
- issue: Ngôi xưng hô của וּבִעַרְתָּ ở số ít
  choice: anh em phải trừ bỏ
  alternative: ngươi phải trừ bỏ
  rationale: Động từ số ít hướng đến Israel như một cộng đồng thống nhất. “Anh em” truyền đạt lời kêu gọi toàn dân bằng tiếng Việt hiện đại, tránh đại từ “ngươi” dễ mang sắc thái cổ hoặc khinh miệt, dù không thể hiện trực tiếp số ít ngữ pháp.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm và dễ hiểu. “Ăn nằm với” giữ thành ngữ chỉ quan hệ tình dục mà không quá khẩu ngữ. “Anh em” được dùng để chỉ Israel với tư cách cộng đồng được Môi-se trực tiếp truyền dạy.
