review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc luật lệ và nội dung chính: việc bị phát hiện, quan hệ tình dục với người phụ nữ đang có chồng, án chết cho cả hai, và công thức loại trừ điều ác khỏi Israel. Tuy nhiên, “anh em phải” chuyển động từ ngôi thứ hai số ít trong tiếng Hê-bơ-rơ sang số nhiều, và chú thích a diễn đạt chưa sát cụm בְּעוּלַת בַּעַל.'
  naturalness: “Người ta phát hiện” có thể hiểu như một chủ thể không xác định đang thực hiện hành động; “Nếu phát hiện một người đàn ông” tự nhiên và gần hơn với lối điều kiện pháp lý bị động của nguyên ngữ. “Ăn nằm với” có thể giữ, nhưng “nằm với” là thành ngữ Kinh Thánh trang trọng, trực tiếp, và tránh sắc thái chung sống mà “ăn nằm” đôi khi có trong tiếng Việt hiện đại.
  terminology: “Phụ nữ đã có chồng” và “phải chết” là những lựa chọn phù hợp. Nên dùng “ngươi phải” trong công thức trực tiếp hướng đến Israel như một thực thể số ít, vừa sát ngữ pháp vừa giữ văn phong luật lệ. Chú thích nên nói “một người phụ nữ thuộc về/chung sống với một người chồng” chỉ như diễn đạt sát chữ có chú giải, không để hàm ý sở hữu chi phối chính văn.
  issues:
  - severity: medium
    issue: Ngôi của mệnh lệnh cuối câu bị đổi từ số ít sang số nhiều.
    rationale: וּבִעַרְתָּ là động từ ngôi thứ hai giống đực số ít. Dù Israel được hiểu tập thể, “anh em phải” là số nhiều và không phản ánh trực tiếp hình thức của bản nguồn.
  - severity: low
    issue: Chú thích a dùng “gắn với một người chồng.”
    rationale: Cách nói này không phải cách diễn đạt sát nghĩa rõ ràng của בְּעוּלַת בַּעַל và nghe không tự nhiên trong tiếng Việt. Cần bảo lưu ý nghĩa người phụ nữ đang trong quan hệ hôn nhân mà không diễn giải quá mức.
  - severity: low
    issue: “Người ta phát hiện” thêm một tác nhân bất định vào mệnh đề điều kiện.
    rationale: יִמָּצֵא là thể bị động, “được phát hiện” hoặc lối vô chủ ngữ “nếu phát hiện” phản ánh trực tiếp hơn việc người đàn ông bị phát hiện.
