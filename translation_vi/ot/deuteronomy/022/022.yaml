revisions:
- from: Nếu người ta phát hiện một người đàn ông đang ăn nằm với một phụ nữ đã có chồng[a], thì cả hai đều phải chết[b]—người đàn ông đã ăn nằm với người phụ nữ ấy và người phụ nữ đó. Như vậy, anh em phải trừ bỏ điều ác khỏi Israel.
  to: Nếu phát hiện một người đàn ông nằm với một phụ nữ có chồng[a], thì cả hai đều phải chết[b]—người đàn ông đã nằm với người phụ nữ ấy, và người phụ nữ ấy. Như vậy, ngươi phải trừ bỏ điều ác khỏi Israel.
  rationale: Sửa lối diễn đạt điều kiện cho sát thể bị động tiếng Hê-bơ-rơ và tự nhiên hơn trong tiếng Việt; thay “ăn nằm” bằng “nằm với” để giữ thành ngữ nguồn trong văn phong Kinh Thánh; khôi phục ngôi số ít của mệnh lệnh cuối câu; và chỉnh chú thích a để vừa sát ngữ nghĩa vừa không gán sắc thái sở hữu vào chính văn.
  reviewer_model: gpt-5.6-terra
