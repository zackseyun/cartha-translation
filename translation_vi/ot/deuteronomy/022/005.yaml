revisions:
- from: Phụ nữ không được mang vật dụng của đàn ông[a], và đàn ông không được mặc y phục của phụ nữ, vì bất cứ ai làm những điều ấy đều là điều ghê tởm đối với Đức Giê-hô-va, Đức Chúa Trời của anh em.
  to: Phụ nữ không được mang vật dụng của đàn ông[a], và đàn ông không được mặc y phục của phụ nữ, vì bất cứ ai làm những điều ấy đều là một sự ghê tởm đối với Đức Giê-hô-va, Đức Chúa Trời của ngươi.
  rationale: Sửa đại từ sở hữu để phản ánh ngôi thứ hai số ít của tiếng Hê-bơ-rơ. Điều chỉnh nhẹ vị ngữ cuối cho tự nhiên hơn trong tiếng Việt, đồng thời giữ việc nguyên văn gọi chính người thực hiện là “sự ghê tởm” đối với Đức Giê-hô-va. Chú thích về phạm vi rộng của כְלִי được giữ nguyên.
