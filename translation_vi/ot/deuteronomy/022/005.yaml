  text: לֹא יִהְיֶ֤ה כְלִי גֶ֨בֶר֙ עַל אִשָּׁ֔ה וְ/לֹא יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֥שֵׂה אֵֽלֶּה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: vi
  text: Phụ nữ không được mang vật dụng của đàn ông[a], và đàn ông không được mặc y phục của phụ nữ, vì bất cứ ai làm những điều ấy đều là một sự ghê tởm đối với Đức Giê-hô-va, Đức Chúa Trời của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “y phục của đàn ông”. Từ Hê-bơ-rơ ở vế đầu có nghĩa rộng hơn từ cụ thể chỉ “y phục” ở vế sau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: vật dụng của đàn ông
  rationale: כְלִי có nghĩa rộng hơn y phục, có thể chỉ đồ vật, dụng cụ hoặc trang bị. “Vật dụng” giữ được độ rộng ấy và không đồng nhất hóa với שִׂמְלָה ở vế sau.
- source_word: עַל אִשָּׁה
  choice: phụ nữ ... mang
  rationale: Cấu trúc “ở trên” trong ngữ cảnh đồ dùng hoặc trang bị diễn tả việc mang trên người. “Mang” tự nhiên trong tiếng Việt và không giới hạn đối tượng vào quần áo.
- source_word: יִלְבַּשׁ
  choice: mặc
  rationale: Động từ chỉ hành động khoác hoặc mặc y phục; “mặc” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: שִׂמְלַת אִשָּׁה
  choice: y phục của phụ nữ
  rationale: שִׂמְלָה chỉ quần áo hoặc một thứ áo mặc; “y phục” giữ sắc thái trang trọng và cụ thể hơn “vật dụng” ở vế đầu mà không thu hẹp thành một loại áo nhất định.
- source_word: גֶּבֶר / אִשָּׁה
  choice: đàn ông / phụ nữ
  rationale: Nguyên văn tạo sự đối chiếu rõ ràng giữa nam và nữ; các từ này tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: תוֹעֲבַת יְהוָה
  choice: điều ghê tởm đối với Đức Giê-hô-va
  rationale: תוֹעֵבָה là từ mạnh, chỉ điều đáng ghê tởm trước mặt Đức Chúa Trời. “Điều ghê tởm” truyền đạt sức nặng của từ mà vẫn tự nhiên; danh Đức Chúa Trời được thể hiện là “Đức Giê-hô-va”.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: bất cứ ai làm những điều ấy
  rationale: Cách dịch này giữ ý khái quát và phân phối của כָּל cùng dạng phân từ, đồng thời phù hợp văn phong tiếng Việt hiện đại.
theological_decisions:
- issue: Phạm vi của lệnh cấm thứ nhất (כְלִי גֶבֶר)
  choice: Dịch rộng là “vật dụng của đàn ông”.
  alternative: “y phục của đàn ông” hoặc “vũ khí/trang bị của đàn ông”
  rationale: Danh từ כְלִי rộng hơn từ chuyên chỉ y phục ở vế thứ hai. Bản dịch giữ sự khác biệt từ vựng và không quyết định thay nguyên văn rằng câu này chỉ nói đến quần áo hay đặc biệt nói đến vũ khí, trang bị.
- issue: Ngôn ngữ chỉ giới tính
  choice: Giữ cặp “phụ nữ” và “đàn ông”.
  alternative: Dùng các từ trung tính như “người” hoặc “ai”.
  rationale: Nguyên văn chủ ý đối chiếu hai từ chỉ nữ và nam, nên bản dịch bảo toàn sự đối chiếu này.
- issue: Chủ thể của תוֹעֵבַת יְהוָה
  choice: “bất cứ ai làm những điều ấy đều là điều ghê tởm”
  alternative: “việc làm ấy là điều ghê tởm” hoặc “điều ấy đáng ghê tởm”
  rationale: Cú pháp Hê-bơ-rơ gắn כָּל עֹשֵׂה, “mọi người làm”, trực tiếp với תוֹעֲבַת יְהוָה. Bản dịch không chuyển trọng tâm từ người thực hiện sang hành vi.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Vật dụng” cùng chú thích bảo toàn độ rộng của כְלִי; “y phục” phân biệt rõ từ chỉ quần áo ở vế sau. Cụm “đối với Đức Giê-hô-va” phản ánh quan hệ trong nguyên văn mà không diễn giải thêm.
