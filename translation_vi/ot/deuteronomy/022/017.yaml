base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: vi
  text: '“Này, người ấy đã dựng lên những lời cáo buộc, rằng: ‘Tôi không thấy con gái ông còn trinh.’[a] Nhưng đây là bằng chứng về sự trinh tiết của con gái tôi.” Rồi cha mẹ cô gái sẽ trải tấm áo[b] ra trước mặt các trưởng lão của thành.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng cùng một từ số nhiều trong cả lời cáo buộc và lời đáp; theo ngữ cảnh, từ này có thể chỉ “những dấu hiệu” hoặc “bằng chứng” về sự trinh tiết.
    reason: lexical_alternative
  - marker: b
    text: “Tấm áo” là vật được trải ra để trình làm bằng chứng trong vụ việc này; bản văn không nói rõ bản chất cụ thể của bằng chứng ấy.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của tiểu từ diễn ngôn Hê-bơ-rơ, đồng thời tự nhiên trong lời trình bày trang trọng.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: đã vu cho con gái tôi
  rationale: Diễn đạt thành ngữ chỉ việc đặt ra lời cáo buộc có tính vu khống; bổ sung đối tượng từ ngữ cảnh để câu tiếng Việt rõ nghĩa.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: Tôi không thấy con gái ông còn trinh
  rationale: Chuyển thành ngữ nguyên văn ‘không tìm thấy những dấu hiệu trinh tiết cho con gái ông’ sang cách nói tự nhiên, nhưng không khẳng định tính đúng đắn của lời cáo buộc.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: Nhưng đây là bằng chứng về sự trinh tiết của con gái tôi
  rationale: Dạng số nhiều בְּתוּלִים trong bối cảnh pháp lý chỉ dấu hiệu hoặc bằng chứng được đưa ra để xác nhận sự trinh tiết; ‘Nhưng’ thể hiện sự tương phản theo ngữ cảnh.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: Rồi cha mẹ cô gái sẽ trải tấm vải ra
  rationale: Chủ thể số nhiều được hiểu theo ngữ cảnh câu trước là cha mẹ cô gái. ‘Tấm vải’ tránh xác định quá mức loại y phục hoặc vật liệu.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: trước mặt các trưởng lão trong thành
  rationale: Giữ cách diễn đạt tư pháp chỉ việc trình bằng chứng trước các vị lãnh đạo cộng đồng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ tính chất pháp lý của lời trình bày, không xác định cụ thể hơn điều văn bản nói về bản chất của dấu hiệu trên tấm vải.
