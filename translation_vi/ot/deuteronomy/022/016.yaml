  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: vi
  text: 'Người cha của cô gái sẽ nói với các trưởng lão: “Tôi đã gả con gái tôi cho người đàn ông này làm vợ, nhưng người ấy lại ghét con gái tôi.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ấy đã sinh lòng ghét con gái tôi.” Động từ Hê-bơ-rơ chỉ đơn giản có nghĩa là “ghét”; trong ngữ cảnh, nó có thể diễn tả tình trạng hiện tại hoặc một thái độ đã nảy sinh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: sẽ nói
  rationale: Trong ngữ cảnh luật tình huống, dạng động từ này trình bày bước tiếp theo của thủ tục pháp lý; “sẽ nói” tự nhiên và giữ sắc thái quy định.
- source_word: אֲבִי הַנַּעַר
  choice: người cha của cô gái
  rationale: Chỉ cha của người nữ trẻ đã đến tuổi kết hôn; “cô gái” là cách nói hiện đại, tự nhiên trong ngữ cảnh này.
- source_word: הַזְּקֵנִים
  choice: các trưởng lão
  rationale: Trong bối cảnh pháp lý, từ này chỉ những người lãnh đạo cộng đồng có thẩm quyền xét xử, không chỉ những người đàn ông cao tuổi.
- source_word: נָתַתִּי ... לְאִשָּׁה
  choice: tôi đã gả ... làm vợ
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “tôi đã trao ... làm vợ”; tiếng Việt dùng “gả” để diễn đạt tự nhiên và chính xác hành động của người cha trong việc hôn nhân.
- source_word: לָאִישׁ הַזֶּה
  choice: cho người đàn ông này
  rationale: Giữ nghĩa trực tiếp của אִישׁ là “người đàn ông”; quan hệ hôn nhân đã được nêu rõ qua “làm vợ”.
- source_word: וַיִּשְׂנָאֶהָ
  choice: nhưng anh ta lại ghét nó
  rationale: שׂנא có nghĩa trực tiếp là “ghét”. “Nhưng ... lại” diễn đạt tự nhiên sự tương phản trong lời tố cáo; “nó” là đại từ khẩu ngữ phù hợp khi người cha nói về con gái mình trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý nhưng dễ hiểu, trang trọng vừa phải. Dùng “trưởng lão” theo nghĩa chức vị cộng đồng; lời trực tiếp được diễn đạt tự nhiên trong tiếng Việt hiện đại. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
