  text: ו/ל/נער לֹא תַעֲשֶׂ֣ה דָבָ֔ר אֵ֥ין ל/נער חֵ֣טְא מָ֑וֶת כִּ֡י כַּ/אֲשֶׁר֩ יָק֨וּם אִ֤ישׁ עַל רֵעֵ֨/הוּ֙ וּ/רְצָח֣/וֹ נֶ֔פֶשׁ כֵּ֖ן הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: vi
  text: Nhưng ngươi không được làm gì đối với người thiếu nữ ấy; người thiếu nữ ấy không phạm tội đáng chết. Vì trường hợp này cũng như khi một người đứng lên chống lại người lân cận mình và sát hại người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: Nhưng ... người thiếu nữ ấy
  rationale: Liên từ וְ được dịch là “Nhưng” để nêu sự tương phản với hình phạt dành cho người đàn ông ở câu trước; הַנַּעַר trong ngữ cảnh luật pháp chỉ người thiếu nữ đã nói đến.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: anh em không được làm gì ... ấy
  rationale: Diễn đạt tự nhiên mệnh lệnh pháp lý ở ngôi thứ hai số ít trong tiếng Hê-bơ-rơ; “anh em” là lối xưng hô tập thể quen thuộc trong tiếng Việt, còn ý nghĩa tuyệt đối là không được áp dụng hình phạt nào đối với nàng.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: người thiếu nữ ấy không phạm tội đáng chết
  rationale: Giữ sát thành ngữ pháp lý, theo nghĩa nàng không mang tội trạng đáng bị án tử hình, mà không mở rộng thành một tuyên bố về mọi phương diện đạo đức.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: như khi một người xông vào người đồng loại
  rationale: “Xông vào” truyền đạt hành động đứng dậy chống lại hay tấn công; “người đồng loại” diễn đạt רֵעַ tự nhiên trong phép so sánh pháp lý này.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: và sát hại người ấy
  rationale: רצח chỉ sự giết người trái phép; “sát hại” phù hợp hơn từ trung tính “giết”. Đại từ chỉ nạn nhân được nói rõ là “người ấy”.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: việc này cũng giống như
  rationale: Diễn đạt tự nhiên kết luận của phép so sánh, trong khi vẫn giữ דָּבָר theo nghĩa “việc/trường hợp”.
theological_decisions:
- issue: Phạm vi sự vô tội của người thiếu nữ trong phép so sánh pháp lý
  choice: Câu này khẳng định người thiếu nữ không mang tội trạng đáng bị xử tử trong trường hợp ấy.
  alternative: Hiểu câu này như lời khẳng định về sự vô tội hoàn toàn trên mọi phương diện đạo đức.
  rationale: Cụm חֵטְא מָוֶת có sức nặng pháp lý trong bộ luật này. Bản dịch giữ trọng tâm tư pháp của nguyên văn và không suy rộng quá điều văn bản nói.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại và dễ hiểu. Dùng “người thiếu nữ” thay vì “cô gái” để phù hợp bối cảnh hôn ước và tránh giọng quá khẩu ngữ. Dấu chú thích [a] được đặt sau toàn bộ phép so sánh mà nó giải thích.
