revisions:
- from: Nhưng anh em không được làm gì người thiếu nữ ấy; người thiếu nữ ấy không phạm tội đáng chết. Vì việc này cũng giống như khi một người xông vào người đồng loại và sát hại người ấy[a].
  to: Nhưng ngươi không được làm gì đối với người thiếu nữ ấy; người thiếu nữ ấy không phạm tội đáng chết. Vì trường hợp này cũng như khi một người đứng lên chống lại người lân cận mình và sát hại người ấy.
  rationale: Bản sửa giữ nguyên nội dung pháp lý và phép so sánh của tiếng Hê-bơ-rơ, đồng thời phục hồi ngôi số ít, dùng cách diễn đạt hiện đại tự nhiên hơn cho hành vi “đứng lên chống lại”, và làm rõ rằng không được thực hiện điều gì đối với người thiếu nữ. Chú thích hiện có chỉ giải thích một cách diễn đạt mà bản dịch sửa đã nêu rõ; không có biến thể văn bản hay mơ hồ cần chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:15Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng phán quyết rằng người thiếu nữ không có tội đáng chết và phép so sánh với một vụ sát hại. Tuy nhiên, ngôi mệnh lệnh số ít của tiếng Hê-bơ-rơ nên được giữ bằng “ngươi”, và cách diễn đạt “làm gì người thiếu nữ ấy” cần giới từ để rõ đây là điều bị cấm thực hiện đối với nàng.
  naturalness: “Xông vào người đồng loại” không tự nhiên trong tiếng Việt hiện đại và không phản ánh trực tiếp hình ảnh “đứng lên chống lại”. “Đứng lên chống lại người lân cận mình” là tự nhiên, trang trọng, và sát nguyên văn hơn. Cấu trúc kết luận của phép so sánh cũng được làm rõ hơn.
  terminology: “Người thiếu nữ” phù hợp với bối cảnh pháp lý và giữ sắc thái của הַנַּעֲרָה. “Tội đáng chết” chuyển tải chính xác thành ngữ pháp lý חֵטְא מָוֶת mà không mở rộng thành nhận định đạo đức tổng quát. “Sát hại” thích hợp cho רצח. Không cần chú thích vì bản dịch sửa đổi không giữ một điểm mơ hồ đáng chú thích.
  issues:
  - severity: medium
    issue: Ngôi xưng hô “anh em” thay cho mệnh lệnh số ít.
    rationale: Động từ תַעֲשֶׂה là ngôi thứ hai số ít. “Anh em” chuyển lời luật trực tiếp sang số nhiều, dù ý nghĩa pháp lý chung không thay đổi đáng kể.
  - severity: medium
    issue: Cụm “xông vào người đồng loại” thiếu tự nhiên và diễn dịch động từ quá cụ thể.
    rationale: יָקוּם עַל có nghĩa đen là “đứng lên chống lại”; “xông vào” thêm sắc thái hành động không được nói rõ, còn “người đồng loại” không phải cách gọi tự nhiên trong văn phong pháp lý tiếng Việt.
  - severity: low
    issue: “Làm gì người thiếu nữ ấy” thiếu giới từ.
    rationale: Thêm “đối với” làm rõ phạm vi của lệnh cấm và tạo câu văn pháp lý tự nhiên hơn.
  revised_text: Nhưng ngươi không được làm gì đối với người thiếu nữ ấy; người thiếu nữ ấy không phạm tội đáng chết. Vì trường hợp này cũng như khi một người đứng lên chống lại người lân cận mình và sát hại người ấy.
