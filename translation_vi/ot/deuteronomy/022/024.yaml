source:
  edition: WLC
  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: vi
  text: 'thì anh em phải đem cả hai ra cổng thành ấy[a] và ném đá họ bằng đá, và họ sẽ chết: người thiếu nữ[c] vì đã không kêu cứu trong thành, còn người đàn ông vì đã làm nhục[b] vợ của người đồng loại. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cổng thành là nơi công cộng thường dùng để tiến hành việc xét xử và công bố phán quyết trong các thành của Y-sơ-ra-ên thời xưa.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “đã xâm phạm” hoặc “đã hạ nhục”. Động từ Hê-bơ-rơ ở đây có thể chỉ sự xâm phạm tình dục cùng với nỗi nhục gây ra cho nạn nhân.
    reason: lexical_alternative
  - marker: c
    text: Hoặc “cô gái”. Hình thức Hê-bơ-rơ được chép ở đây thiếu chữ cái cuối thường thấy trong cách viết giống cái rõ ràng hơn; tuy nhiên, động từ tiếp theo là giống cái (“đã không kêu cứu”), cho thấy người được nói đến là nữ.
    reason: textual_note
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  choice: anh em phải đem ... ra
  rationale: Dạng Hiphil của יצא mang nghĩa khiến hoặc đưa ra; “đem ... ra” tự nhiên trong tiếng Việt và giữ sắc thái mệnh lệnh pháp lý.
- source_word: שְׁנֵיהֶם
  choice: cả hai
  rationale: Diễn đạt rõ rằng cả hai người liên can đều phải được đưa ra xét xử.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: cổng thành ấy
  rationale: Giữ nguyên địa điểm được nêu trong bản Hê-bơ-rơ; cổng thành cũng là nơi công cộng thường diễn ra việc xét xử.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים וָמֵתוּ
  choice: ném đá họ cho đến chết
  rationale: Truyền đạt tự nhiên hành động và kết quả tử vong của chuỗi mệnh đề Hê-bơ-rơ, không biến kết quả thành một chi tiết phụ.
- source_word: הנער
  choice: người thiếu nữ
  rationale: Hình thức phụ âm được chép thiếu chữ cái cuối của dạng giống cái rõ hơn, nhưng động từ צָעֲקָה xác nhận đối tượng là nữ; “người thiếu nữ” phù hợp ngữ cảnh và trang trọng tự nhiên.
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: vì đã không kêu cứu trong thành
  rationale: עַל דְּבַר nêu căn cứ phán quyết. “Kêu cứu” làm rõ chức năng của tiếng kêu trong tình huống mà không thêm kết luận ngoài câu.
- source_word: עִנָּה
  choice: đã làm nhục
  rationale: Trong ngữ cảnh luật lệ về tình dục, ענה có thể chỉ việc xâm phạm kèm sự hạ nhục. “Làm nhục” giữ độ rộng và sự căng thẳng từ vựng của nguyên văn hơn một thuật ngữ pháp lý hiện đại quá chuyên biệt.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: vợ của người đồng loại
  rationale: “Người đồng loại” diễn đạt רֵעַ như một thành viên khác trong cộng đồng, đồng thời tránh nghĩa hiện đại quá hẹp của “hàng xóm”.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình
  rationale: Giữ công thức pháp lý lặp lại trong Phục Truyền Luật Lệ Ký và sắc thái loại bỏ điều ác khỏi cộng đồng.
theological_decisions:
- issue: Căn cứ pháp lý được nêu đối với người thiếu nữ
  choice: vì đã không kêu cứu trong thành
  alternative: vì nàng đã không la lên trong thành
  rationale: Bản dịch giữ nguyên căn cứ mà câu Hê-bơ-rơ nêu, nhưng không suy diễn thành một kết luận đạo đức hay pháp lý phổ quát vượt quá ngữ cảnh của điều luật.
- issue: Cách dịch עִנָּה trong ngữ cảnh luật lệ về tình dục
  choice: đã làm nhục
  alternative: đã xâm phạm
  rationale: “Làm nhục” phản ánh trường nghĩa chịu khổ nhục/xâm phạm của động từ mà không định đoạt bằng một thuật ngữ hiện đại hẹp hơn những gì từ Hê-bơ-rơ tự nó xác định.
- issue: Quan hệ giữa việc ném đá và cái chết
  choice: ném đá họ cho đến chết
  alternative: ném đá họ, và họ sẽ chết
  rationale: Cách dịch được chọn tự nhiên trong tiếng Việt và trình bày cái chết là kết quả trực tiếp; phương án sát cấu trúc liên từ hơn vẫn có thể được bảo vệ.
translation_notes:
  register: Văn phong pháp lý, trang nghiêm nhưng dùng cú pháp và từ ngữ tiếng Việt hiện đại. Đại từ số nhiều “anh em” thể hiện người nghe tập thể trong nguyên văn; “mình” ở cuối câu giữ cách xưng hô tập thể tự nhiên. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
