revisions:
- from: 'thì anh em phải đem cả hai ra cổng thành ấy[a] và ném đá họ cho đến chết: người thiếu nữ vì đã không kêu cứu trong thành, còn người đàn ông vì đã làm nhục vợ của người đồng loại[b]. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.'
  to: 'thì anh em phải đem cả hai ra cổng thành ấy[a] và ném đá họ bằng đá, và họ sẽ chết: người thiếu nữ[c] vì đã không kêu cứu trong thành, còn người đàn ông vì đã làm nhục[b] vợ của người đồng loại. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình.'
  rationale: Bản sửa giữ nội dung pháp lý và các chỗ mơ hồ của nguyên văn, nhưng tái hiện rõ hơn trình tự “ném đá ... và họ sẽ chết.” Chú thích về עִנָּה được neo vào đúng từ, và chú thích văn bản giải thích căn cứ dịch “người thiếu nữ” mà không biến đặc điểm chính tả thành một khác biệt nghĩa.
