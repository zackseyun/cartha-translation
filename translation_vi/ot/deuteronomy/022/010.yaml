revisions:
- from: Anh em không được dùng bò và lừa chung một ách để cày.[a]
  to: Không được cày bằng bò và lừa cùng nhau.
  rationale: 'Sửa câu chính để dịch trực tiếp תַחֲרֹשׁ בְּשׁוֹר וּבַחֲמֹר יַחְדָּו: “cày bằng bò và lừa cùng nhau”. Bỏ “chung một ách” vì đó là suy diễn ngữ cảnh, và bỏ chú thích vì không còn có sự diễn giải cần bảo lưu. Cấu trúc vô chủ ngữ với “Không được” là một lệnh cấm pháp luật tự nhiên trong tiếng Việt hiện đại.'
