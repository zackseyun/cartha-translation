  text: לֹֽא תַחֲרֹ֥שׁ בְּ/שׁוֹר וּ/בַ/חֲמֹ֖ר יַחְדָּֽו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: vi
  text: Không được cày bằng bò và lừa cùng nhau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Phủ định đi với thể vị hoàn thành chưa trọn ở ngôi thứ hai số ít tạo thành lệnh cấm; “không được” diễn đạt tự nhiên và giữ sắc thái pháp luật trong tiếng Việt hiện đại.
- source_word: תַחֲרֹשׁ
  choice: để cày
  rationale: Động từ Qal ngôi thứ hai số ít chỉ hành động cày. Khi kết hợp với “không được dùng”, cấu trúc tiếng Việt diễn đạt rõ nội dung bị cấm mà không cần lặp đại từ số ít.
- source_word: בְּשׁוֹר
  choice: dùng bò
  rationale: שׁוֹר là từ chung cho gia súc thuộc loài bò, ở đây là con vật kéo cày. “Bò” tự nhiên hơn “bò đực” và không xác định giới tính quá mức văn bản nguồn.
- source_word: וּבַחֲמֹר
  choice: và lừa
  rationale: חֲמוֹר là từ thông dụng chỉ con lừa. Liên từ וּ được giữ bằng “và” trong cặp hai con vật.
- source_word: יַחְדָּו
  choice: chung một ách
  rationale: Nghĩa trực tiếp là “cùng nhau”; trong bối cảnh hai súc vật cày chung, “chung một ách” diễn đạt cụ thể và tự nhiên ý chúng bị ghép thành cùng một đội kéo, nhưng được ghi chú với phương án sát mặt chữ.
theological_decisions:
- issue: Sắc thái của lệnh cấm trong luật giao ước
  choice: 'Dùng công thức trực tiếp mang tính pháp luật: “Anh em không được…”'
  alternative: “Đừng…” hoặc “Ngươi không được…”
  rationale: “Không được” giữ lực của lệnh cấm, còn “anh em” phù hợp diễn ngôn cộng đồng trong tiếng Việt hiện đại và tránh sắc thái cổ của “ngươi”. Câu không thêm lý do thần học mà nguyên văn không nêu.
- issue: Mức độ cụ thể của יַחְדָּו
  choice: Diễn đạt theo ngữ cảnh là “chung một ách”
  alternative: Dịch sát là “cùng nhau”
  rationale: Ngữ cảnh cày bằng hai loài vật cho thấy chúng được ghép cùng đội kéo. Tuy nhiên, vì nguyên văn chỉ nói “cùng nhau”, phương án sát chữ được bảo tồn trong chú thích để không che khuất độ khái quát của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại, dễ hiểu. “Anh em” dùng theo nghĩa tập thể, không giới hạn giới tính; tránh đại từ cổ “ngươi”. Câu chính ưu tiên cách nói nông nghiệp tự nhiên trong tiếng Việt, còn chú thích bảo tồn cấu trúc sát nguyên văn.
