review_pass:
  verdict: revise
  source_fidelity: Bản dự thảo truyền đạt đúng lệnh cấm và hai loài vật. Tuy nhiên, “chung một ách” cụ thể hóa trạng từ יַחְדָּו (“cùng nhau”) thành một chi tiết không được nêu trực tiếp; tuy hợp ngữ cảnh, cách này thu hẹp/diễn giải nội dung hơn bản gốc. “Anh em” cũng chuyển ngôi số ít khái quát của tiếng Hê-bơ-rơ thành ngôi số nhiều và thêm cách xưng hô không cần thiết.
  naturalness: “Không được cày bằng bò và lừa cùng nhau” là tiếng Việt hiện đại, rõ ràng và giữ được sắc thái mệnh lệnh pháp luật mà không cần đại từ.
  terminology: “Bò” phù hợp với שׁוֹר trong ngữ cảnh sức kéo; “lừa” phù hợp với חֲמוֹר; “cùng nhau” phản ánh trực tiếp יַחְדָּו.
  issues:
  - severity: medium
    issue: Cụm “chung một ách” thêm chi tiết diễn giải vào câu chính.
    rationale: יַחְדָּו chỉ có nghĩa là “cùng nhau”; bản văn không nêu rõ “một ách”. Dù việc ghép ách là khả dĩ trong thực hành cày, bản dịch chính nên giữ độ khái quát của nguyên văn.
  - severity: low
    issue: “Anh em” không cần thiết và không phản ánh sát ngôi số ít khái quát của động từ Hê-bơ-rơ.
    rationale: Câu cấm không chủ ngữ trong tiếng Việt vẫn tự nhiên, mang tính pháp luật, và tránh thêm cách xưng hô tập thể vào bản văn.
  revised_text: Không được cày bằng bò và lừa cùng nhau.
