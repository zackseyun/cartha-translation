  - severity: low
    issue: “sửa phạt” không phải lựa chọn tự nhiên nhất trong tiếng Việt hiện đại.
    rationale: “Sửa trị” rõ hơn trong văn phong Kinh Thánh-trang trọng và vẫn bảo toàn phạm vi nghĩa rộng của יסר.
