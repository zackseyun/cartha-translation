  yaml_path: translation/ot/deuteronomy/022/018.yaml
  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: vi
  text: Bấy giờ, các trưởng lão của thành ấy sẽ đem người đàn ông ấy đi và sửa trị ông ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kỷ luật ông ta”, “trừng phạt ông ta”, hoặc có lẽ “đánh đòn ông ta”. Động từ Hê-bơ-rơ có nghĩa rộng, chỉ sự sửa trị bằng kỷ luật; bản thân động từ này không xác định cụ thể hình thức xử phạt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: phải bắt
  rationale: Động từ לקח cơ bản là “lấy/đem”; trong bối cảnh pháp lý, “bắt” diễn đạt tự nhiên việc nhà chức trách đưa người ấy ra xử lý mà không nhấn mạnh quá mức tính bạo lực như “tóm bắt”.
- source_word: זִקְנֵי
  choice: các trưởng lão
  rationale: Trong ngữ cảnh pháp lý-cộng đồng, từ này chỉ những người lãnh đạo được công nhận, không chỉ đơn thuần là những người cao tuổi.
- source_word: הָעִיר הַהִוא
  choice: của thành ấy
  rationale: Giữ sắc thái địa phương tài phán của עִיר và tính xác định của đại từ chỉ định הַהִוא.
- source_word: הָאִישׁ
  choice: người đàn ông đó
  rationale: Giữ nghĩa trực tiếp “người đàn ông” của אִישׁ, đồng thời “đó” giúp người đọc nhận ra đây là người chồng đã được nói đến trong văn cảnh trước.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: và sửa phạt ông ta
  rationale: יסר có phạm vi nghĩa gồm sửa trị, kỷ luật và trừng phạt. “Sửa phạt” giữ được cả mục đích sửa trị lẫn tính chế tài pháp lý, không tự ý xác định đây là đánh đòn.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại và dễ hiểu. “Bấy giờ” nối tự nhiên với diễn tiến của điều luật; “phải” thể hiện lực quy định của hình thái động từ trong ngữ cảnh luật pháp. Đại từ “ông ta” tránh lối gọi thiếu tự nhiên nhưng không biểu thị sự kính trọng đặc biệt.
