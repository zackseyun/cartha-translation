base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/020.yaml
  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: vi
  text: Nhưng nếu điều này là thật, và người ta không tìm thấy bằng chứng về sự trinh tiết của cô gái,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và không tìm thấy sự trinh tiết nơi cô gái.” Từ Hê-bơ-rơ בְּתוּלִים có nghĩa sát là “sự trinh tiết” hoặc, trong phong tục pháp lý cổ đại ở đây, “dấu hiệu/bằng chứng về sự trinh tiết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ kết hợp với tiểu từ điều kiện tạo sự tương phản với trường hợp được nêu trước đó; “Nhưng nếu” tự nhiên trong tiếng Việt.
- source_word: אֱמֶת הָיָה הַדָּבָר הַזֶּה
  choice: điều này là thật
  rationale: Giữ cách diễn đạt rộng của דָּבָר và sắc thái điều kiện pháp lý, không thu hẹp thành “lời cáo buộc” dù ngữ cảnh liên quan đến một cáo buộc.
- source_word: לֹא נִמְצְאוּ
  choice: người ta không tìm thấy
  rationale: Dạng bị động vô nhân xưng trong Hê-bơ-rơ được chuyển thành cấu trúc chủ động vô nhân xưng tự nhiên trong tiếng Việt.
- source_word: בְּתוּלִים
  choice: bằng chứng về sự trinh tiết
  rationale: Trong ngữ cảnh pháp lý cổ đại, danh từ này có thể chỉ sự trinh tiết hoặc dấu hiệu/bằng chứng của sự trinh tiết; cách dịch chính truyền đạt ý nghĩa theo ngữ cảnh mà chú thích vẫn bảo lưu nghĩa sát chữ.
- source_word: לַנַּעֲרָ
  choice: của cô gái
  rationale: נַעֲרָה chỉ một thiếu nữ hoặc phụ nữ trẻ trong độ tuổi kết hôn. “Cô gái” tự nhiên trong tiếng Việt và giới từ được diễn đạt theo quan hệ sở hữu với “bằng chứng”.
