translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu được để mở bằng dấu phẩy vì câu Hê-bơ-rơ tiếp tục sang câu kế tiếp. Dùng “điều này” để giữ độ rộng nghĩa của הַדָּבָר הַזֶּה; dùng “cô gái” cho người nữ trẻ trong bối cảnh hôn nhân.
