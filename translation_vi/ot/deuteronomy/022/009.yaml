  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: vi
  text: Anh em không được gieo hai loại hạt giống trong vườn nho của mình, kẻo toàn bộ hoa lợi—hạt giống anh em gieo và sản vật của vườn nho—bị dành riêng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “trở nên thánh/được thánh hiến”; nghĩa là bị tách khỏi việc sử dụng thông thường, nên người chủ không còn được tùy ý sử dụng hoa lợi ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִזְרַע
  choice: không được gieo
  rationale: Giữ đúng nghĩa gieo hạt của זרע và diễn đạt tự nhiên một điều luật cấm trong tiếng Việt hiện đại.
- source_word: כַּרְמְךָ
  choice: vườn nho của mình
  rationale: כרם chỉ vườn nho; cụm sở hữu này tự nhiên khi chủ thể được dịch là “anh em”.
- source_word: כִּלְאָיִם
  choice: hai loại hạt giống
  rationale: Trong ngữ cảnh gieo trồng, כלאים nói đến sự pha trộn các loại; cách dịch này thể hiện cụ thể điều bị cấm mà không thêm loại cây nào ngoài nguyên văn.
- source_word: פֶּן
  choice: kẻo
  rationale: “Kẻo” diễn đạt gọn và tự nhiên hậu quả tiêu cực cần tránh do פן dẫn vào.
- source_word: תִּקְדַּשׁ
  choice: bị biệt riêng
  rationale: קדש ở đây theo nghĩa trở nên được tách riêng, không còn dùng theo cách thông thường. “Bị biệt riêng” giữ được hình ảnh pháp lý-tôn giáo và sắc thái bất lợi trong ngữ cảnh mà không thu hẹp thành một cách xử lý cụ thể.
- source_word: הַמְלֵאָה
  choice: toàn bộ hoa lợi
  rationale: המלאה chỉ tổng thể sản lượng thu được; “toàn bộ hoa lợi” phù hợp văn cảnh nông nghiệp và bao quát hai thành phần được nêu sau đó.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: giống anh em đã gieo
  rationale: “Giống” trong văn cảnh này chỉ phần cây trồng phát sinh từ hạt giống đã gieo, tránh cách hiểu rằng chính hạt giống ban đầu là hoa lợi bị ảnh hưởng.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: lẫn sản vật của vườn nho
  rationale: תבואה là sản vật hoặc hoa lợi; “lẫn” thể hiện tự nhiên rằng cả hai thành phần đều chịu cùng hậu quả.
theological_decisions:
- issue: Nghĩa của תִּקְדַּשׁ trong luật về sự pha trộn
  choice: bị biệt riêng
  alternative: bị tịch thu; trở nên thánh/được thánh hiến
  rationale: Động từ theo nghĩa đen liên quan đến việc trở nên thánh hoặc được biệt riêng. Trong câu cảnh báo này, hệ quả là hoa lợi không còn dành cho việc sử dụng thông thường. Bản dịch giữ ý “biệt riêng” để bảo tồn độ căng và sự mơ hồ của nguyên ngữ, còn chú thích giải thích hệ quả pháp lý có thể hiểu là bị mất quyền sử dụng.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” cho số ít giống đực mang tính đại diện trong diễn ngôn giao ước; tránh “ngươi” vì cổ và xa lạ. Dấu gạch ngang làm rõ “toàn bộ hoa lợi” gồm cả cây từ giống đã gieo và sản vật của vườn nho.
