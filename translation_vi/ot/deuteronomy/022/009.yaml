revisions:
- from: Anh em không được gieo hai loại hạt giống trong vườn nho của mình, kẻo toàn bộ hoa lợi bị biệt riêng[a]—cả giống anh em đã gieo lẫn sản vật của vườn nho.
  to: Anh em không được gieo hai loại hạt giống trong vườn nho của mình, kẻo toàn bộ hoa lợi—hạt giống anh em gieo và sản vật của vườn nho—bị dành riêng[a].
  rationale: Sửa cách nói “bị biệt riêng” thành “bị dành riêng” để tiếng Việt tự nhiên hơn mà vẫn giữ sự mơ hồ pháp lý–tôn giáo của תִּקְדַּשׁ; chú thích tiếp tục cung cấp cách hiểu sát nghĩa đen. Đổi “giống” thành “hạt giống” để sát với זֶרַע. Chuyển phần liệt kê vào giữa hai gạch ngang để làm rõ rằng “toàn bộ hoa lợi” bao gồm cả hai thành phần được nêu trong nguyên ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:05Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng lệnh cấm gieo כלאים trong vườn nho và nêu đủ hai thành phần của הַמְלֵאָה. Tuy nhiên, “giống anh em đã gieo” dễ chỉ cây giống/cây trồng hơn là זֶרַע, vốn là “hạt giống”; nên giữ “hạt giống”. Cách dịch hệ quả nên bảo tồn tính hàm súc của תִּקְדַּשׁ, không khẳng định cụ thể là tịch thu.
  naturalness: “Bị biệt riêng” không phải kết hợp từ tự nhiên trong tiếng Việt hiện đại, nhất là với “hoa lợi”. “Bị dành riêng” tự nhiên hơn, vẫn giữ ý không còn dùng thông thường; việc đặt cụm giải thích hai thành phần giữa hai gạch ngang cũng làm câu rõ và cân đối hơn.
  terminology: “Vườn nho”, “hai loại hạt giống”, “hoa lợi”, và “sản vật” phù hợp ngữ cảnh luật nông nghiệp. “Anh em” có thể dùng theo lối xưng hô giao ước của cả đoạn văn; không cần đổi chỉ vì động từ Hê-bơ-rơ ở số ít.
  issues:
  - severity: medium
    issue: “bị biệt riêng” thiếu tự nhiên trong tiếng Việt hiện đại
    rationale: Cụm này là lối diễn đạt gượng; “bị dành riêng” diễn đạt rõ hậu quả bị tách khỏi sử dụng thông thường, đồng thời không áp đặt cách hiểu cụ thể như “bị tịch thu”.
  - severity: low
    issue: “giống anh em đã gieo” có thể lệch nghĩa của זֶרַע
    rationale: “Giống” trong tiếng Việt có thể gợi cây giống hoặc giống loài. “Hạt giống anh em gieo” gần với từ gốc hơn và tránh diễn giải thêm.
  revised_text: Anh em không được gieo hai loại hạt giống trong vườn nho của mình, kẻo toàn bộ hoa lợi—hạt giống anh em gieo và sản vật của vườn nho—bị dành riêng[a].
