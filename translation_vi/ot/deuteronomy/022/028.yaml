id: DEU.22.28
reference: Deuteronomy 22:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: vi
  text: Nếu một người đàn ông gặp một thiếu nữ còn đồng trinh, chưa đính hôn[a], rồi bắt lấy cô[b] và nằm với cô, và cả hai bị phát hiện,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chưa được hứa gả.”'
    reason: Bảo lưu sắc thái pháp lý của việc đính ước trong xã hội cổ.
  - marker: b
    text: Động từ Hê-bơ-rơ có thể có nghĩa là “bắt lấy”, “nắm lấy” hoặc “giữ lấy”. Có người hiểu mệnh đề này hàm ý cưỡng hiếp; người khác cho rằng sắc thái pháp lý phải được xác định từ toàn bộ ngữ cảnh chứ không chỉ từ riêng động từ này.
    reason: Bảo lưu phạm vi nghĩa của תפשׂ và sự căng thẳng diễn giải mà không áp đặt kết luận vào chính văn.
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu một trường hợp giả định trong điều luật; “nếu” tự nhiên và phù hợp với văn phong pháp lý tiếng Việt.
- source_word: יִמְצָא
  choice: gặp
  rationale: Động từ có nghĩa cơ bản là “tìm thấy/gặp”. Trong ngữ cảnh một người gặp một người khác, “gặp” tự nhiên hơn “tìm thấy” mà vẫn giữ được ý của nguyên ngữ.
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: Giữ rõ danh từ giống đực số ít của nguyên văn.
- source_word: נער בְתוּלָה
  choice: một thiếu nữ còn đồng trinh
  rationale: “Thiếu nữ” diễn đạt tuổi trẻ, còn “còn đồng trinh” giữ riêng yếu tố בְתוּלָה; cách nói hiện đại, trang trọng và không khiến người đọc mặc nhiên hiểu là một trẻ nhỏ.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: chưa đính hôn
  rationale: Diễn đạt dễ hiểu tình trạng chưa được cam kết hôn nhân; chú thích bảo lưu sắc thái pháp lý cổ là “chưa được hứa gả”.
- source_word: וּתְפָשָׂהּ
  choice: rồi bắt lấy cô
  rationale: תפשׂ chỉ hành động nắm, bắt hoặc giữ lấy. “Bắt lấy” giữ được yếu tố tác động thể chất nhưng không tự ý thay động từ bằng một kết luận pháp lý cụ thể.
- source_word: וְשָׁכַב עִמָּהּ
  choice: và nằm với cô
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ quan hệ tình dục, đủ rõ trong ngữ cảnh mà không diễn giải quá mức.
- source_word: וְנִמְצָאוּ
  choice: và cả hai bị phát hiện
  rationale: Dạng bị động số nhiều quy chiếu đến hai người; “cả hai bị phát hiện” giữ được cả số nhiều lẫn ý sự việc trở nên công khai.
theological_decisions:
- issue: Có nên dịch toàn bộ hành động bằng một thuật ngữ diễn giải rõ là “hiếp dâm” hay không
  choice: 'Giữ cách diễn đạt theo từng động từ: “bắt lấy cô và nằm với cô”.'
  alternative: “cưỡng hiếp cô” hoặc cách nhẹ hơn là “đưa cô đi”.
  rationale: תפשׂ có yếu tố bắt hoặc nắm giữ nhưng tự nó không phải thuật ngữ pháp lý chuyên biệt duy nhất cho hành vi hiếp dâm. Ngữ cảnh và mối liên hệ với các luật lân cận còn được tranh luận. Bản dịch vì thế không làm nhẹ động tác thể chất, nhưng cũng không thu hẹp toàn bộ câu vào một nhãn diễn giải duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thiếu nữ” thay cho từ cổ “trinh nữ” như một danh xưng, đồng thời diễn đạt riêng “còn đồng trinh” để giữ đủ hai thành tố của nguyên văn. Đại từ “cô” tránh lối văn quá cổ như “nàng”. Câu được giữ dang dở bằng dấu phẩy vì đây là mệnh đề điều kiện tiếp nối sang câu 29.
