base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: vi
  text: Nhất định phải thả chim mẹ đi[a], nhưng anh em có thể lấy con non[b] cho mình, để mọi sự được tốt lành cho anh em và anh em sống lâu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “thả, ngươi phải thả [đi].” Tiếng Hê-bơ-rơ lặp dạng động từ để nhấn mạnh mệnh lệnh.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ chép là “các con”; trong ngữ cảnh tổ chim, từ này chỉ con non.
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “kéo dài ngày tháng.” Đây là thành ngữ chỉ việc sống lâu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: nhất định phải thả ... đi
  rationale: Kết cấu nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh mệnh lệnh; cách diễn đạt này giữ được sắc thái bắt buộc mạnh mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: הָאֵם
  choice: chim mẹ
  rationale: Danh từ có nghĩa trực tiếp là “mẹ”; thêm “chim” theo ngữ cảnh tổ chim để câu tiếng Việt rõ nghĩa ngay khi đọc riêng.
- source_word: הַבָּנִים
  choice: con non
  rationale: Nghĩa đen là “các con”, nhưng trong ngữ cảnh tổ chim chỉ con non; “con non” tự nhiên và không giới hạn vào một loài chim cụ thể.
- source_word: תִּקַּח לָךְ
  choice: anh em có thể bắt lấy cho mình
  rationale: Sau mệnh lệnh thả chim mẹ, động từ ở đây diễn đạt điều được phép làm; “cho mình” giữ lại ý của לָךְ.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: để anh em được phúc
  rationale: Diễn đạt tự nhiên công thức chỉ mục đích hoặc kết quả “để được tốt lành”; “được phúc” ngắn gọn, trang trọng và không biến lời này thành một sự bảo đảm máy móc.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: và sống lâu
  rationale: Nghĩa sát chữ là “kéo dài ngày tháng”; “sống lâu” chuyển tải đúng thành ngữ Hê-bơ-rơ bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Tính chất của kết quả được hứa
  choice: 'Giữ đây là phúc lành hoặc kết quả gắn với sự vâng lời: “để anh em được phúc và sống lâu”.'
  alternative: Diễn đạt như một lời bảo đảm tuyệt đối rằng mọi cá nhân vâng lệnh này đều chắc chắn sống lâu.
  rationale: Công thức לְמַעַן nêu mục đích hoặc kết quả và phúc lành theo giao ước, nhưng bản dịch không nên giải thích quá mức thành một cơ chế bảo đảm cho từng trường hợp cá nhân.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh em” thể hiện lời nói với cộng đồng giao ước dù động từ Hê-bơ-rơ ở số ít, đồng thời tránh đại từ “ngươi” mang sắc thái cổ. Cấu trúc “còn ... thì” thể hiện sự đối lập giữa việc buộc phải thả chim mẹ và việc được phép bắt con non.
