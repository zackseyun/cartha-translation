revisions:
- from: Nhất định phải thả chim mẹ đi[a], còn con non[b] thì anh em có thể bắt lấy cho mình, để anh em được phúc và sống lâu[c].
  to: Nhất định phải thả chim mẹ đi[a], nhưng anh em có thể lấy con non[b] cho mình, để mọi sự được tốt lành cho anh em và anh em sống lâu[c].
  rationale: Đổi “bắt lấy” thành “lấy” để không giới hạn đối tượng là con vật sống và để phù hợp với ngữ cảnh có cả trứng. Đổi “được phúc” thành “mọi sự được tốt lành cho anh em” để phản ánh sát công thức Hê-bơ-rơ chỉ điều tốt lành xảy đến cho người vâng lời, không áp đặt cách diễn giải thần học. Chú thích a được chỉnh cho rõ sự nhấn mạnh của cấu trúc động từ; các mốc chú thích vẫn gắn đúng từ/cụm được giải thích.
  reviewer_model: gpt-5.6-terra
