  text: כִּ֥י בַ/שָּׂדֶ֖ה מְצָאָ֑/הּ צָעֲקָ֗ה ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/אֵ֥ין מוֹשִׁ֖יעַ לָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: vi
  text: 'Vì người ấy gặp nàng ngoài đồng[a]; người thiếu nữ đã được hứa gả kêu cứu, nhưng không có ai giải cứu nàng.[b]


    [a] Cũng có thể dịch: “ở vùng đồng trống.” Cụm từ Hê-bơ-rơ chỉ một nơi hẻo lánh ở vùng nông thôn.


    [b] Cũng có thể dịch: “nhưng không ai cứu nàng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở vùng đồng trống.” Cụm từ Hê-bơ-rơ chỉ một nơi hẻo lánh ở vùng nông thôn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhưng không ai cứu nàng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích lý do cho phán quyết pháp lý ở câu trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: בַשָּׂדֶה
  choice: ngoài đồng
  rationale: Diễn đạt trực tiếp bối cảnh đồng quê trống trải, nơi khó có người nghe thấy để đến giúp; chú thích giữ phương án “ở vùng đồng trống.”
- source_word: מְצָאָהּ
  choice: người ấy gặp nàng
  rationale: מצא có nghĩa cơ bản là “tìm thấy/gặp.” Trong ngữ cảnh này, “gặp nàng” tự nhiên hơn và không hàm ý rằng người đàn ông đang đi tìm nàng; “người ấy” quy chiếu về người đàn ông ở câu trước.
- source_word: צָעֲקָה
  choice: kêu cứu
  rationale: Động từ chỉ tiếng kêu trong lúc nguy cấp. “Kêu cứu” truyền đạt rõ chức năng của tiếng kêu trong lập luận pháp lý mà không thu hẹp thành một kiểu âm thanh cụ thể như “thét lên.”
- source_word: הנער
  choice: người thiếu nữ
  rationale: Ngữ cảnh và sự hòa hợp ngữ pháp xác định người được nói đến là nữ. “Người thiếu nữ” trang trọng, rõ giới tính và không mang sắc thái trẻ con.
- source_word: הַמְאֹרָשָׂה
  choice: đã được hứa gả
  rationale: Thể hiện địa vị đã được cam kết hôn nhân theo pháp luật xã hội Y-sơ-ra-ên cổ, chính xác hơn cách hiểu thuần hiện đại của “đính hôn.”
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: nhưng không có ai giải cứu nàng
  rationale: “Nhưng” làm rõ sự tương phản trong tiếng Việt giữa việc nàng kêu cứu và việc không có người đến giúp. “Giải cứu” phù hợp với tình huống nguy cấp và tránh gợi nghĩa thần học không cần thiết.
theological_decisions:
- issue: Địa vị pháp lý-xã hội của הַמְאֹרָשָׂה
  choice: đã được hứa gả
  alternative: đã đính hôn
  rationale: “Đã được hứa gả” bảo toàn tính ràng buộc pháp lý của hôn ước trong bối cảnh Y-sơ-ra-ên cổ mà không du nhập một quan niệm giáo phái hay đồng nhất hoàn toàn với tập tục đính hôn hiện đại.
- issue: Cách thể hiện giới tính của הַנַּעַר theo ngữ cảnh
  choice: người thiếu nữ
  alternative: người trẻ tuổi
  rationale: Dù dạng phụ âm có thể trông không phân biệt giới tính, ngữ cảnh và các dấu hiệu ngữ pháp xác định người này là nữ; bản dịch vì thế diễn đạt giới tính rõ ràng mà không che lấp dữ liệu nguồn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “nàng” để giữ giọng kể Kinh Thánh trang nghiêm mà không cổ hóa quá mức. Dấu chú thích [a] đặt ngay sau “ngoài đồng”; [b] đặt sau mệnh đề “giải cứu nàng,” đúng với từ ngữ mà chú thích giải thích.
