  text: לֹא תִרְאֶה֩ אֶת חֲמ֨וֹר אָחִ֜י/ךָ א֤וֹ שׁוֹר/וֹ֙ נֹפְלִ֣ים בַּ/דֶּ֔רֶךְ וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: vi
  text: Anh em không được thấy con lừa hay con bò của người anh em mình ngã trên đường mà làm ngơ; anh em nhất định phải cùng người ấy[a] đỡ chúng dậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cùng với người ấy”, nhấn mạnh việc cùng người chủ đỡ con vật lên, chứ không bỏ mặc người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: người anh em mình
  rationale: Giữ hình ảnh thân thuộc của từ Hê-bơ-rơ “anh em”; trong luật Phục Truyền, từ này thường chỉ một người cùng thuộc cộng đồng giao ước, nhưng bản dịch không thu hẹp nghĩa thành một cách diễn giải cụ thể.
- source_word: חֲמוֹר
  choice: con lừa
  rationale: Cách gọi thông dụng, tự nhiên trong tiếng Việt hiện đại.
- source_word: שׁוֹרוֹ
  choice: con bò
  rationale: שׁוֹר có thể chỉ bò đực hoặc bò dùng làm gia súc lao động; “con bò” là cách diễn đạt tự nhiên và không xác định giới tính quá mức so với ngữ cảnh.
- source_word: נֹפְלִים
  choice: ngã
  rationale: Diễn tả tình trạng con vật đã ngã xuống trên đường, đồng thời kết hợp tự nhiên với mệnh lệnh “đỡ ... dậy” ở cuối câu.
- source_word: בַּדֶּרֶךְ
  choice: trên đường
  rationale: Cách diễn đạt địa điểm rõ ràng và thông dụng trong tiếng Việt hiện đại.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: mà làm ngơ
  rationale: Động từ hitpael của עלם ở đây mang nghĩa cố tình không để ý hoặc bỏ mặc; “làm ngơ” truyền đạt sắc thái chủ ý ấy một cách tự nhiên.
- source_word: הָקֵם תָּקִים
  choice: nhất định phải ... đỡ ... dậy
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh mệnh lệnh; “nhất định phải” thể hiện lực nhấn mạnh, còn “đỡ ... dậy” phù hợp với con vật bị ngã.
- source_word: עִמּוֹ
  choice: cùng người ấy
  rationale: Dịch trực tiếp ý “cùng với người ấy”, giữ rõ tính chất phối hợp với người chủ thay vì biến câu thành hành động đơn độc.
theological_decisions: []
translation_notes:
  register: Văn phong luật định, trang trọng nhưng dễ hiểu. Dùng “anh em” làm đại từ chỉ cộng đồng được Môi-se ngỏ lời, đồng thời giữ “người anh em mình” cho אָחִיךָ. Đại từ số nhiều “chúng” phản ánh מֵהֶם trong nguyên văn, dù hai loài vật được nêu theo cấu trúc lựa chọn “hay”.
