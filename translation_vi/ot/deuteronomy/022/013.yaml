  source_fidelity: Bản dịch phản ánh đúng cấu trúc điều kiện của כִּי, chủ thể nam số ít, hành động “lấy vợ,” thành ngữ uyển ngữ chỉ quan hệ vợ chồng, và động từ שׂנא (“ghét”). Từ “rồi” diễn tả phù hợp trình tự của chuỗi động từ mà không thêm ý nghĩa đáng kể.
  naturalness: “Nếu một người đàn ông lấy vợ, ăn ở với nàng, rồi ghét nàng,” là câu tiếng Việt rõ ràng, trang trọng và phù hợp văn phong luật lệ Kinh Thánh. “Ăn ở với nàng” là lối nói giảm tự nhiên trong văn cảnh này.
  terminology: “Lấy vợ” truyền đạt đúng ngữ cảnh hôn nhân của יִקַּח ... אִשָּׁה. “Ăn ở với nàng” bảo tồn tính uyển ngữ của וּבָא אֵלֶיהָ; chú thích giải thích đầy đủ nghĩa tình dục của thành ngữ. “Ghét” là tương ứng trực tiếp, không áp đặt cách diễn giải thần học.
