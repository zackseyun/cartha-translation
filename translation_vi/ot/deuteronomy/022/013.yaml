  text: כִּֽי יִקַּ֥ח אִ֖ישׁ אִשָּׁ֑ה וּ/בָ֥א אֵלֶ֖י/הָ וּ/שְׂנֵאָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/013.yaml
  text: If a man takes a wife and goes in to her[a], and then hates her,
translation:
  language: vi
  text: Nếu một người đàn ông lấy vợ, ăn ở với nàng[a], rồi ghét nàng,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “quan hệ tình dục với nàng.” Thành ngữ Hê-bơ-rơ “đi vào với nàng” chỉ việc giao hợp trong hôn nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong điều luật theo tình huống này, כִּי mở đầu mệnh đề điều kiện; “nếu” diễn đạt rõ cấu trúc ấy trong tiếng Việt.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: một người đàn ông lấy vợ
  rationale: Cách dịch này giữ giới tính được nêu rõ trong nguyên văn và chuyển tự nhiên thành ngữ hôn nhân “lấy vợ”.
- source_word: וּבָא אֵלֶיהָ
  choice: ăn ở với nàng
  rationale: Đây là lối nói giảm chỉ việc giao hợp trong hôn nhân. “Ăn ở với” giữ sắc thái kín đáo và hợp văn cảnh, còn chú thích làm rõ nghĩa.
- source_word: וּשְׂנֵאָהּ
  choice: rồi ghét nàng
  rationale: “Ghét” phản ánh trực tiếp động từ שׂנא; “rồi” thể hiện diễn tiến của chuỗi hành động mà không giải thích thêm động cơ.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Nàng” tránh sự thô cứng khi lặp lại “người vợ” và phù hợp văn phong luật lệ có tính tường thuật; “ăn ở với” bảo toàn lối nói giảm của nguyên văn.
