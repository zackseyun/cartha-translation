base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/015.yaml
  text: then the young woman’s father and her mother shall take and bring out the evidence of the young woman’s virginity to the elders of the city at the gate[a].
translation:
  language: vi
  text: thì cha mẹ của người thiếu nữ phải đem bằng chứng về sự trinh tiết của nàng đến trình cho các trưởng lão của thành tại cổng thành.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “những sự trinh tiết của người thiếu nữ”, một thành ngữ chỉ dấu hiệu hoặc vật chứng được trình ra làm bằng chứng về sự trinh tiết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: phải đem
  rationale: Trong chuỗi quy định pháp lý, động từ Qal hoàn thành có liên từ mang lực chỉ thị về thủ tục. Tiếng Việt tự nhiên gộp ý “lấy” với động từ tiếp theo thành “phải đem”.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: cha mẹ của người thiếu nữ
  rationale: Nguyên văn nói “cha của người thiếu nữ và mẹ nàng”; “cha mẹ của người thiếu nữ” diễn đạt tự nhiên, không làm thay đổi việc cả hai cùng thực hiện thủ tục. “Người thiếu nữ” phù hợp với phụ nữ trẻ ở tuổi kết hôn và giữ sắc thái trang trọng hiện đại.
- source_word: וְהוֹצִיאוּ
  choice: đem ... đến trình
  rationale: Dạng Hiphil của יצא ở đây chỉ việc đưa vật chứng ra và trình trước giới hữu trách; “đem ... đến trình” làm rõ hành vi pháp lý mà vẫn giữ hình ảnh cụ thể.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: bằng chứng về sự trinh tiết của nàng
  rationale: Cụm từ theo nghĩa đen là “những sự trinh tiết của người thiếu nữ”, nhưng trong vụ việc này là thành ngữ chỉ dấu hiệu hoặc vật chứng được đưa ra để chứng minh sự trinh tiết.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: cho các trưởng lão của thành
  rationale: אֶל biểu thị hướng đến những người giữ vai trò xét xử; “trình cho” truyền đạt tự nhiên việc đưa bằng chứng đến trước họ.
- source_word: הַשַּׁעְרָה
  choice: tại cổng thành
  rationale: Hậu tố chỉ hướng có thể dịch là “đến cổng”, nhưng trong ngữ cảnh đây là địa điểm các trưởng lão thi hành việc xét xử; “tại cổng thành” diễn đạt chức năng địa điểm rõ ràng.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. Dùng “phải” để thể hiện lực quy định, “người thiếu nữ” thay cho cách gọi có thể quá trẻ hoặc cổ, và “cổng thành” để người đọc nhận ra địa điểm công cộng nơi các trưởng lão xét xử.
