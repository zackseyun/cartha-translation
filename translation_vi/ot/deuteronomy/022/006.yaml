  text: כִּ֣י יִקָּרֵ֣א קַן צִפּ֣וֹר לְ/פָנֶ֡י/ךָ בַּ/דֶּ֜רֶךְ בְּ/כָל עֵ֣ץ א֣וֹ עַל הָ/אָ֗רֶץ אֶפְרֹחִים֙ א֣וֹ בֵיצִ֔ים וְ/הָ/אֵ֤ם רֹבֶ֨צֶת֙ עַל הָֽ/אֶפְרֹחִ֔ים א֖וֹ עַל הַ/בֵּיצִ֑ים לֹא תִקַּ֥ח הָ/אֵ֖ם עַל הַ/בָּנִֽים־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: vi
  text: Nếu dọc đường anh em tình cờ gặp một tổ chim[a] trên bất cứ cây nào hoặc trên mặt đất, trong tổ có chim non hoặc trứng, và chim mẹ đang nằm phủ trên chim non hoặc trên trứng, thì anh em không được bắt chim mẹ cùng với chim non.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu một tổ chim tình cờ xuất hiện trước mặt anh em dọc đường.” Động từ Hê-bơ-rơ hàm ý gặp ngẫu nhiên chứ không phải cố ý đi tìm.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “chim mẹ trên các con.” Trong ngữ cảnh, cụm này có nghĩa là không bắt chim mẹ cùng với đàn con của nó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  choice: Nếu ... tình cờ gặp
  rationale: כִּי mở đầu điều luật theo tình huống, còn thể Niphal của קרא diễn tả một cuộc gặp ngẫu nhiên, không phải chủ ý tìm kiếm.
- source_word: קַן צִפּוֹר
  choice: một tổ chim
  rationale: Cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: dọc đường anh em ... gặp
  rationale: Chuyển cấu trúc 'trước mặt anh em trên đường' sang cách nói tự nhiên, vẫn giữ bối cảnh gặp tổ chim trên hành trình.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: trên bất cứ cây nào hoặc ở dưới đất
  rationale: Trong tiếng Việt, tổ chim ở 'trên cây'; הָאָרֶץ tại đây chỉ mặt đất.
- source_word: אֶפְרֹחִים
  choice: chim non
  rationale: Chỉ rõ con non trong ngữ cảnh loài chim mà không giới hạn vào một loài hay giai đoạn phát triển cụ thể.
- source_word: רֹבֶצֶת
  choice: đang ấp trên
  rationale: Trong ngữ cảnh chim mẹ ở trên con non hoặc trứng, 'ấp trên' tự nhiên hơn 'nằm/ngồi trên', dù từ Hê-bơ-rơ tự thân mô tả tư thế nằm hoặc đậu phủ lên.
- source_word: לֹא תִקַּח
  choice: không được bắt
  rationale: Thể hiện rõ sức nặng của lệnh cấm; 'bắt' phù hợp với việc lấy một con chim sống.
- source_word: הָאֵם עַל הַבָּנִים
  choice: chim mẹ cùng với chim non
  rationale: Trong thành ngữ này, עַל được hiểu theo nghĩa đi kèm; בָּנִים theo ngữ cảnh là con non, không phải 'con cái' theo nghĩa chỉ giới tính.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” làm đại từ số ít mang nghĩa đại diện/cộng đồng, phù hợp lối xưng hô trong Phục Truyền Luật Lệ Ký; dùng “không được” để lệnh cấm rõ ràng, dễ hiểu.
