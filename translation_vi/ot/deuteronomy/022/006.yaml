revisions:
- from: Nếu dọc đường anh em tình cờ gặp một tổ chim[a] trên bất cứ cây nào hoặc ở dưới đất, trong tổ có chim non hoặc trứng, và chim mẹ đang ấp trên chim non hoặc trên trứng, thì anh em không được bắt chim mẹ cùng với chim non.[b]
  to: Nếu dọc đường anh em tình cờ gặp một tổ chim[a] trên bất cứ cây nào hoặc trên mặt đất, trong tổ có chim non hoặc trứng, và chim mẹ đang nằm phủ trên chim non hoặc trên trứng, thì anh em không được bắt chim mẹ cùng với chim non.[b]
  rationale: Đã sửa vị trí của tổ thành “trên mặt đất” để phản ánh chính xác עַל הָאָרֶץ, và thay “đang ấp trên” bằng “đang nằm phủ trên” để giữ nghĩa tư thế của רֹבֶצֶת mà không áp dụng sai hành động ấp cho chim non. Chú thích b được chỉnh nhẹ để diễn đạt trực tiếp chức năng của cụm trong lệnh cấm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:09:58Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc điều kiện-pháp luật, tính chất tình cờ của יִקָּרֵא, các vị trí của tổ, và lệnh cấm không bắt chim mẹ cùng con non. Tuy nhiên, “ở dưới đất” có thể hiểu là ở bên dưới/lòng đất, trong khi עַל הָאָרֶץ là “trên mặt đất”. “Đang ấp trên chim non” cũng không tự nhiên và có thể gợi hành động ấp trứng áp riêng cho chim non; רֹבֶצֶת chỉ tư thế chim mẹ nằm/ngồi phủ trên cả chim non lẫn trứng.
  naturalness: Cần đổi “ở dưới đất” thành “trên mặt đất” và dùng “đang nằm phủ trên” để diễn đạt tự nhiên, bao quát cả hai tân ngữ “chim non hoặc trứng”. Các phần còn lại rõ ràng, hiện đại, và phù hợp văn phong luật lệ.
  terminology: “Tổ chim,” “chim non,” “chim mẹ,” và “không được bắt” phù hợp ngữ cảnh. Đại từ “anh em” có thể giữ theo văn phong Phục Truyền, dù câu điều luật đang áp dụng cho từng người nghe.
  issues:
