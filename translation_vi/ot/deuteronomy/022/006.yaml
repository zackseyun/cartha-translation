    issue: “ở dưới đất” không tương ứng chính xác với עַל הָאָרֶץ.
    rationale: Cụm Hê-bơ-rơ nghĩa là “trên mặt đất/đất”, đối lập với “trên cây”; “ở dưới đất” trong tiếng Việt thường chỉ vị trí bên dưới mặt đất.
  - severity: medium
    issue: “chim mẹ đang ấp trên chim non” không tự nhiên và thu hẹp nghĩa của רֹבֶצֶת.
    rationale: Động từ mô tả chim mẹ nằm/ngồi phủ trên con non hoặc trứng. “Ấp trên chim non” là kết hợp từ không thông dụng và dễ gây hiểu sai.
  revised_text: Nếu dọc đường anh em tình cờ gặp một tổ chim[a] trên bất cứ cây nào hoặc trên mặt đất, trong tổ có chim non hoặc trứng, và chim mẹ đang nằm phủ trên chim non hoặc trên trứng, thì anh em không được bắt chim mẹ cùng với chim non.[b]
