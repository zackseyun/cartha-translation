revisions:
- from: Nhưng nếu người anh em của anh không ở gần anh[a], và anh không biết người ấy[b], thì anh phải đem nó vào nhà mình. Nó phải ở với anh cho đến khi người anh em ấy tìm nó; bấy giờ anh phải hoàn trả nó cho người ấy.[c]
  to: Nhưng nếu người anh em của anh không ở gần anh[a] và anh không biết người ấy[b], thì hãy đem nó vào trong nhà anh; nó sẽ ở với anh cho đến khi người anh em ấy tìm nó. Bấy giờ, hãy trả nó lại cho người ấy.[c]
  rationale: Bản sửa chỉ cải thiện độ tự nhiên của tiếng Việt và làm nhất quán sắc thái mệnh lệnh trong điều luật, không thay đổi nghĩa, phạm vi quy chiếu, hay mức độ mơ hồ của nguyên văn. Các dấu chú thích vẫn được neo đúng tại các từ/cụm từ được giải thích.
