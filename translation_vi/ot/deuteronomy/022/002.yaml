translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “anh” giữ địa chỉ ngôi hai số ít giống đực của điều luật; “người anh em” bảo tồn ngôn ngữ thân tộc của nguyên văn. Câu được tách làm hai để tránh một chuỗi mệnh đề dài, nhưng quan hệ điều kiện và trình tự hành động vẫn được giữ nguyên.
