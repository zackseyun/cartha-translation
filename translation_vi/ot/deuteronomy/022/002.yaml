  text: וְ/אִם לֹ֨א קָר֥וֹב אָחִ֛י/ךָ אֵלֶ֖י/ךָ וְ/לֹ֣א יְדַעְתּ֑/וֹ וַ/אֲסַפְתּ/וֹ֙ אֶל תּ֣וֹךְ בֵּיתֶ֔/ךָ וְ/הָיָ֣ה עִמְּ/ךָ֗ עַ֣ד דְּרֹ֤שׁ אָחִ֨י/ךָ֙ אֹת֔/וֹ וַ/הֲשֵׁבֹת֖/וֹ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: vi
  text: Nhưng nếu người anh em của anh không ở gần anh[a] và anh không biết người ấy[b], thì hãy đem nó vào trong nhà anh; nó sẽ ở với anh cho đến khi người anh em ấy tìm nó. Bấy giờ, hãy trả nó lại cho người ấy.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong luật Phục truyền, “người anh em” thường chỉ rộng hơn đến một người cùng thuộc cộng đồng giao ước, chứ không chỉ anh em ruột.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “anh không biết nó là của ai”; sát nghĩa: “anh không biết người ấy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hãy hoàn trả nó cho người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: người anh em của anh
  rationale: Giữ hình ảnh thân tộc của tiếng Hê-bơ-rơ; trong luật Phục truyền, cụm từ này thường chỉ một thành viên cùng cộng đồng giao ước, không nhất thiết là anh em ruột.
- source_word: קָרוֹב אֵלֶיךָ
  choice: ở gần anh
  rationale: Diễn đạt tự nhiên sự gần gũi về khoảng cách vật lý mà không thu hẹp thành việc cư trú gần nhau.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: anh không biết người ấy
  rationale: Giữ đại từ giống đực số ít của nguyên văn, vốn quy chiếu về người anh em; trong ngữ cảnh, ý là người nhặt không biết chủ sở hữu là ai.
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: anh phải đem nó vào nhà mình
  rationale: Truyền đạt hành động thu nhận vật hoặc con vật bị thất lạc vào nhà để giữ gìn; “nhà mình” là cách nói tiếng Việt tự nhiên khi chủ thể và sở hữu chủ trùng nhau.
- source_word: וְהָיָה עִמְּךָ
  choice: Nó phải ở với anh
  rationale: Giữ sát cấu trúc “ở với anh” và hàm ý tiếp diễn đến thời điểm được nêu trong mệnh đề kế tiếp.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: cho đến khi người anh em ấy tìm nó
  rationale: דרש ở đây mang nghĩa tìm kiếm hoặc hỏi tìm tài sản bị thất lạc; “tìm nó” ngắn gọn và không thêm ý chủ sở hữu đã chính thức đòi lại.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: bấy giờ anh phải hoàn trả nó cho người ấy
  rationale: Dạng Hiphil của שוב diễn tả việc làm cho vật trở về với chủ; “hoàn trả” phù hợp ngữ cảnh luật pháp, còn “trả lại” được ghi nhận như một cách dịch khác.
