  text: צִידֹנִ֛ים יִקְרְא֥וּ לְ/חֶרְמ֖וֹן שִׂרְיֹ֑ן וְ/הָ֣/אֱמֹרִ֔י יִקְרְאוּ ל֖/וֹ שְׂנִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/009.yaml
  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: vi
  text: Người Si-đôn gọi Hẹc-môn[a] là Si-ri-ôn, còn người A-mô-rít[b] gọi nơi ấy là Sê-nia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể diễn đạt là “núi Hẹc-môn”; nguyên văn Hê-bơ-rơ ở đây chỉ ghi “Hẹc-môn”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ dùng hình thức số ít “người A-mô-rít” với nghĩa tập thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידֹנִים
  choice: Người Si-đôn
  rationale: Danh từ chỉ dân tộc ở số nhiều, nói đến dân thành Si-đôn; tiếng Việt dùng “người Si-đôn” tự nhiên và vẫn có nghĩa tập thể.
- source_word: יִקְרְאוּ
  choice: gọi ... là
  rationale: Động từ קרא đi với ל ở đây diễn tả việc đặt hoặc dùng tên; cấu trúc “gọi ... là” rõ ràng, tự nhiên trong tiếng Việt.
- source_word: לְחֶרְמוֹן
  choice: Hẹc-môn
  rationale: Địa danh được phiên âm; nguyên văn câu này chỉ ghi “Hẹc-môn”, không có danh từ “núi”.
- source_word: שִׂרְיֹן
  choice: Si-ri-ôn
  rationale: Tên mà người Si-đôn dùng cho Hẹc-môn, được phiên âm thay vì dịch nghĩa.
- source_word: וְהָאֱמֹרִי
  choice: còn người A-mô-rít
  rationale: Hình thức Hê-bơ-rơ là số ít nhưng mang nghĩa tập thể, song song với “người Si-đôn”; “còn” diễn đạt tự nhiên sự đối chiếu giữa hai cách gọi.
- source_word: יִקְרְאוּ לוֹ
  choice: gọi nơi ấy là
  rationale: Đại từ chỉ lại Hẹc-môn. “Nơi ấy” tránh thêm từ “núi” vốn không có trong nguyên văn, đồng thời tự nhiên hơn cách dịch sát chữ “gọi nó” đối với một địa danh.
- source_word: שְׂנִיר
  choice: Sê-nia
  rationale: Tên mà người A-mô-rít dùng cho Hẹc-môn, được phiên âm theo lối đọc quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên hai tên gọi cổ bằng phiên âm, không thêm “núi” vào chính văn vì từ này không xuất hiện trong câu Hê-bơ-rơ. Dùng “người” theo nghĩa tập thể tự nhiên của tiếng Việt.
