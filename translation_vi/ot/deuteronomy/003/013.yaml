  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: vi
  text: 'Còn phần còn lại của Ga-la-át và toàn xứ Ba-san, tức vương quốc của Óc, tôi đã ban cho nửa chi phái Ma-na-se: toàn vùng Ạt-gốp, tức toàn xứ Ba-san ấy, được gọi là đất của người Rê-pha-im[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch theo cách truyền thống là “đất của người khổng lồ”. “Rê-pha-im” là tên Híp-ri của một dân tộc cổ gắn với vùng này.
    reason: Nêu cách dịch từ vựng truyền thống nhưng không thay thế tên dân tộc trong chính văn.
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: phần còn lại của Ga-la-át
  rationale: Diễn đạt phần lãnh thổ Ga-la-át còn lại sau phần đã được nhắc đến trước đó, đồng thời giữ địa danh theo dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: כָל הַבָּשָׁן
  choice: toàn xứ Ba-san
  rationale: Giữ trọn ý nghĩa bao quát của כָל; “xứ” phù hợp với một vùng địa lý cổ.
- source_word: מַמְלֶכֶת עוֹג
  choice: vương quốc của Óc
  rationale: Phản ánh trực tiếp kết cấu sở hữu và giữ danh xưng chính trị của lãnh thổ.
- source_word: נָתַתִּי
  choice: tôi đã ban cho
  rationale: Giữ ngôi thứ nhất của lời thuật của Môi-se và thể hoàn thành của động từ; “ban cho” tự nhiên trong bối cảnh phân chia lãnh thổ.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: cho nửa chi phái Ma-na-se
  rationale: “Nửa chi phái” là cách diễn đạt rõ ràng, quen thuộc cho đơn vị bộ tộc nhận phần đất phía đông sông Giô-đanh.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: toàn vùng Ạt-gốp
  rationale: חֶבֶל ở đây chỉ một khu vực lãnh thổ chứ không mang nghĩa đen là dây hay thừng.
- source_word: לְכָל הַבָּשָׁן הַהוּא
  choice: tức toàn xứ Ba-san ấy
  rationale: Hiểu cụm từ theo quan hệ đồng vị/giải thích với vùng Ạt-gốp; “ấy” giữ lực chỉ định của הַהוּא mà không làm câu nặng nề.
- source_word: יִקָּרֵא
  choice: được gọi là
  rationale: Dạng bị động tiếng Việt không buộc xác định quá khứ hay hiện tại, nhờ đó giữ được sắc thái danh xưng thông dụng của thể vị hoàn thành Híp-ri.
- source_word: אֶרֶץ רְפָאִים
  choice: đất của người Rê-pha-im
  rationale: Phiên âm רְפָאִים như tên một dân cổ thay vì giải nghĩa trực tiếp là “người khổng lồ”, qua đó tránh đưa cách diễn giải vào chính văn.
theological_decisions:
- issue: Nên phiên âm רְפָאִים như tên một dân tộc hay dịch theo cách hiểu truyền thống là “người khổng lồ”
  choice: đất của người Rê-pha-im
  alternative: đất của người khổng lồ
  rationale: Trong câu này, רְפָאִים hoạt động như tên gọi của một nhóm người gắn với vùng đất. Phiên âm trong chính văn giữ tính minh bạch từ vựng và không khẳng định quá mức đặc điểm thể chất mà câu không nói rõ; cách hiểu truyền thống được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng các địa danh phiên âm quen thuộc trong Kinh Thánh tiếng Việt. Dấu hai chấm làm rõ rằng phần sau xác định phạm vi lãnh thổ vừa được ban; chú thích được đặt ngay sau “Rê-pha-im”, là từ mà chú thích giải thích.
