  text: וָ/אֶתְחַנַּ֖ן אֶל יְהוָ֑ה בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: vi
  text: 'Lúc ấy, tôi đã khẩn cầu Yahweh[a] rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH.” Theo truyền thống thường được dịch là “CHÚA”; cũng có thể phiên âm là “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: tôi đã khẩn cầu
  rationale: Dạng hitpael của חנן diễn tả sự tha thiết cầu xin ân huệ hoặc lòng thương xót. “Khẩn cầu” tự nhiên, trang trọng và giữ được cường độ của động từ Hê-bơ-rơ; “đã” thể hiện hành động quá khứ trong mạch kể.
- source_word: אֶל
  choice: Yahweh (bổ ngữ trực tiếp của “khẩn cầu”)
  rationale: אֶל chỉ hướng lời cầu xin về phía Yahweh. Tiếng Việt tự nhiên dùng “khẩn cầu ai” mà không cần dịch riêng giới từ là “với” hay “đến”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: בָּעֵת הַהִוא
  choice: Lúc ấy
  rationale: Cách diễn đạt gọn và tự nhiên trong tiếng Việt hiện đại, tương ứng chính xác với cụm chỉ thời gian “vào lúc ấy”.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức Hê-bơ-rơ mở đầu lời nói trực tiếp được chuyển thành “rằng:” theo văn phong tiếng Việt tự nhiên, đồng thời nối rõ với lời trích dẫn ở câu kế tiếp.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự YHWH. “Yahweh” bảo tồn tư cách tên riêng và không thay tên ấy bằng một tước hiệu; chú thích ghi nhận cách dịch truyền thống.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đưa cụm thời gian lên đầu câu để mạch kể tự nhiên; dùng “khẩn cầu” để giữ sắc thái tha thiết, và dấu hai chấm để dẫn sang lời nói trực tiếp ở câu sau.
