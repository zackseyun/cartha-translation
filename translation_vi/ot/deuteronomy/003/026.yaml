source:
  edition: WLC
  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: vi
  text: 'Nhưng vì anh em, Yahweh nổi giận với tôi và không nhậm lời tôi.[a] Yahweh phán với tôi: “Đủ rồi![b] Đừng nói với ta thêm nữa về việc này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “vì anh em” cũng có thể dịch là “do anh em”, “vì cớ anh em”, hoặc “vì lợi ích của anh em”.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát tiếng Hê-bơ-rơ: “Đủ cho ngươi”; đây là lời bác bỏ ngắn và dứt khoát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: nổi giận
  rationale: Dạng hitpael của עבר trong thành ngữ này diễn tả Đức Chúa Trời nổi giận với một người; “nổi giận” tự nhiên, rõ nghĩa và không cường điệu sắc thái.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi tên riêng quen thuộc và trang nghiêm trong tiếng Việt cho Danh Giao Ước, thay vì thay thế bằng một tước hiệu.
- source_word: בִּי
  choice: với tôi
  rationale: Đi với “nổi giận”, giới từ này được diễn đạt tự nhiên trong tiếng Việt là “nổi giận với tôi”.
- source_word: לְמַעַנְכֶם
  choice: vì anh em
  rationale: Cụm từ có thể chỉ nguyên nhân hoặc sự quy chiếu đến dân chúng. “Vì anh em” giữ được độ cô đọng và phần nào sự mơ hồ giữa “do anh em” và “vì cớ anh em”.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: không nhậm lời tôi
  rationale: שׁמע אֶל ở đây không chỉ là nghe âm thanh mà là chấp thuận lời cầu xin. “Không nhậm lời” diễn đạt đúng ngữ cảnh thỉnh cầu và có sắc thái trang nghiêm.
- source_word: רַב לָךְ
  choice: Đủ rồi!
  rationale: Thành ngữ ngắn, dứt khoát, dùng để bác lời và chấm dứt vấn đề. Cách dịch này tự nhiên trong tiếng Việt, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: אַל תּוֹסֶף דַּבֵּר ... עוֹד
  choice: Đừng nói với ta thêm nữa
  rationale: Cấu trúc יסף cộng nguyên mẫu cùng עוֹד chỉ sự tiếp tục hoặc lặp lại; “thêm nữa” chuyển tải trọn ý mà vẫn tự nhiên.
- source_word: בַּדָּבָר הַזֶּה
  choice: về việc này
  rationale: דבר ở đây chỉ vấn đề Môi-se đang cầu xin; “việc này” là cách nói hiện đại, rõ và sát ngữ cảnh.
theological_decisions:
- issue: Cách thể hiện Danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh / Đức Giê-hô-va phán với tôi
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Danh Giao Ước. Bản dịch giữ đây là tên riêng, không thay bằng tước hiệu “CHÚA”; hình thức “Đức Giê-hô-va” phù hợp văn phong tiếng Việt trang nghiêm.
- issue: Trách nhiệm được hàm ý trong לְמַעַנְכֶם
  choice: vì anh em
  alternative: do anh em / vì cớ anh em
  rationale: Cách dịch chính không giải quyết quá mức quan hệ thần học giữa tội của dân và việc Môi-se bị từ chối; chú thích nêu các sắc thái nguyên nhân và quy chiếu có thể có.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Đại từ “anh em” hợp với lời Môi-se nói cùng dân Y-sơ-ra-ên; “ta” trong lời Đức Chúa Trời giữ sắc thái uy quyền. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
