source:
  edition: WLC
  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: vi
  text: Anh em đừng sợ chúng[a], vì chính Yahweh, Đức Chúa Trời của anh em, là Đấng chiến đấu cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Anh em đừng khiếp sợ chúng.”'
    reason: Từ ירא có thể được diễn đạt là “sợ” hoặc “khiếp sợ”; cách thứ hai làm rõ sắc thái sợ hãi nhưng mạnh hơn đôi chút trong tiếng Việt.
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: Anh em đừng sợ chúng
  rationale: Động từ ירא với hậu tố ngôi thứ ba số nhiều mang nghĩa “sợ chúng”; kết hợp với לֹא tạo lời cấm. “Anh em” thể hiện ngôi thứ hai số nhiều theo cách tự nhiên trong tiếng Việt hiện đại.
- source_word: כִּי
  choice: vì
  rationale: כִּי giới thiệu lý do cho lời cấm; “vì” diễn đạt rõ quan hệ giải thích này.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: אֱלֹהִים ở đây chỉ Đức Chúa Trời của Israel theo nghĩa số ít; hậu tố là ngôi thứ hai số nhiều.
- source_word: הוּא
  choice: chính ... là Đấng
  rationale: Đại từ độc lập הוּא có tác dụng nhấn mạnh; cấu trúc “chính ... là Đấng” truyền đạt sức nhấn ấy một cách tự nhiên và trang trọng.
- source_word: הַנִּלְחָם
  choice: chiến đấu
  rationale: Phân từ Nifal của לחם mô tả Yahweh là Đấng đang hoặc vốn chiến đấu; cách dịch hiện tại không giới hạn hành động vào một thời điểm duy nhất.
- source_word: לָכֶם
  choice: cho anh em
  rationale: 'Giới từ ל biểu thị lợi ích hoặc sự bênh vực: Yahweh chiến đấu vì lợi ích của dân Ngài.'
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה. Phiên âm “Yahweh” bảo tồn tư cách tên riêng mà không thay bằng tước hiệu.
- issue: Sức nhấn của הוּא
  choice: chính Yahweh ... là Đấng
  alternative: Yahweh ... chiến đấu
  rationale: Giữ sắc thái nhấn mạnh của đại từ độc lập mà không suy diễn thêm về cách thức Đức Chúa Trời chiến đấu.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” biểu thị đối tượng số nhiều, tránh lối xưng hô cổ “các ngươi”; “Đức Chúa Trời” được viết hoa như danh xưng dành cho Đức Chúa Trời của Israel.
