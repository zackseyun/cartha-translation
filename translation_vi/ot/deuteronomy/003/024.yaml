  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: vi
  text: “Lạy Chúa Yahweh,[a] Ngài đã bắt đầu bày tỏ cho tôi tớ Ngài thấy sự vĩ đại của Ngài và bàn tay mạnh mẽ của Ngài. Vì có thần nào trên trời hay trên đất có thể làm những việc như những việc Ngài làm, và những việc quyền năng như những việc Ngài thực hiện?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “Adonai YHWH,” kết hợp tước hiệu “Chúa” với danh riêng Yahweh.'
    reason: Giải thích việc nguyên văn dùng liền nhau một tước hiệu và danh riêng của Đức Chúa Trời.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Lạy Chúa là Yahweh
  rationale: Giữ cả tước hiệu אֲדֹנָי và danh riêng giao ước יהוה, đồng thời dùng cấu trúc tiếng Việt tự nhiên để tránh chuỗi xưng gọi khó hiểu.
- source_word: הַחִלּוֹתָ לְהַרְאוֹת
  choice: Ngài đã bắt đầu cho ... thấy
  rationale: Diễn đạt sát động từ Hiphil 'bắt đầu' cùng động từ nguyên mẫu Hiphil 'cho thấy', và giữ ý hành động đã khởi sự.
- source_word: עַבְדְּךָ
  choice: tôi tớ Ngài
  rationale: Phù hợp với lời cầu nguyện của một người ở địa vị phục vụ và lệ thuộc Đức Chúa Trời; tự nhiên hơn 'nô lệ' trong ngữ cảnh này.
- source_word: גָּדְלְךָ
  choice: sự vĩ đại của Ngài
  rationale: Phản ánh trực tiếp ý nghĩa về sự lớn lao, vĩ đại, không thu hẹp thành riêng uy nghi hay quyền lực.
- source_word: יָדְךָ הַחֲזָקָה
  choice: cánh tay mạnh mẽ của Ngài
  rationale: Giữ hình ảnh nhân hình học về quyền năng hành động của Đức Chúa Trời; tiếng Việt dùng 'cánh tay' tự nhiên hơn 'bàn tay' trong thành ngữ về sức mạnh.
- source_word: מִי אֵל
  choice: có thần nào
  rationale: Giữ hình thức câu hỏi tu từ về bất cứ thần nào có thể sánh được, không diễn giải thêm thành một khẳng định thần học.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: trên trời hay dưới đất
  rationale: Diễn đạt phạm vi toàn thể một cách tự nhiên trong câu hỏi tiếng Việt; 'hay' làm rõ ý không có đối thủ ở bất cứ nơi nào.
- source_word: יַעֲשֶׂה
  choice: có thể làm được
  rationale: Trong câu hỏi so sánh tu từ, thể chưa hoàn thành mang sắc thái khả năng; cách dịch này truyền đạt đúng lực ngữ dụng.
- source_word: כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶךָ
  choice: những công việc như Ngài và những việc quyền năng như Ngài
  rationale: Giữ hai vế song song giữa מַעֲשֶׂה và גְּבוּרָה, đồng thời tránh lặp từ quá nặng nề trong tiếng Việt.
theological_decisions:
- issue: Cách dịch tổ hợp danh xưng אֲדֹנָי יְהוִה
  choice: Lạy Chúa là Yahweh
  alternative: Lạy Chúa Yahweh; Lạy Chúa Hằng Hữu
  rationale: Bản dịch giữ Yahweh như danh riêng và אֲדֹנָי như tước hiệu. Từ 'là' giúp câu xưng hô rõ và tự nhiên trong tiếng Việt mà không đồng nhất hai từ ở cấp độ từ vựng.
- issue: Câu hỏi về אֵל và các thần
  choice: có thần nào ... có thể làm được
  alternative: ai là Đức Chúa Trời ... làm được
  rationale: Giữ nguyên sức căng tu từ của nguyên văn, vốn hỏi về bất cứ אֵל nào có thể sánh với Yahweh, thay vì âm thầm biến câu hỏi thành một mệnh đề tín lý diễn giải.
translation_notes:
  register: Văn phong trang trọng, hiện đại, phù hợp lời cầu nguyện. Dùng đại từ kính trọng “Ngài” và danh xưng “tôi tớ”; giữ cấu trúc song song và câu hỏi tu từ của tiếng Hê-bơ-rơ.
