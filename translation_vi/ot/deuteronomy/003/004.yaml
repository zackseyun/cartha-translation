base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: vi
  text: 'Lúc ấy, chúng ta chiếm tất cả các thành của vua ấy. Không một thành nào mà chúng ta không chiếm được từ tay họ[a]: sáu mươi thành, tức là toàn vùng Ạc-gốp, thuộc vương quốc của Óc ở Ba-san.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ họ”; đại từ số nhiều này có lẽ chỉ dân hoặc quân lực của Óc, chứ không chỉ riêng Óc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: chúng ta chiếm
  rationale: Động từ לכד trong bối cảnh chiến trận chỉ việc chiếm được; “chiếm” tự nhiên và giữ rõ sắc thái quân sự.
- source_word: כָּל עָרָיו
  choice: tất cả các thành của vua ấy
  rationale: עיר có thể là thành hoặc thị trấn; “thành” phù hợp bối cảnh cổ đại. Đại từ số ít chỉ về vua Óc, và “vua ấy” giúp tiếng Việt rõ nghĩa.
- source_word: בָּעֵת הַהִוא
  choice: Lúc ấy
  rationale: Cách diễn đạt thời gian ngắn gọn, tự nhiên, tương ứng trực tiếp với cụm Hê-bơ-rơ.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: Không một thành nào mà chúng ta không lấy khỏi tay họ
  rationale: Giữ cấu trúc phủ định nhấn mạnh và đại từ số nhiều מֵאִתָּם. “Lấy khỏi tay họ” diễn đạt tự nhiên ý chiếm thành từ phía dân hoặc lực lượng của Óc.
- source_word: שִׁשִּׁים עִיר
  choice: sáu mươi thành
  rationale: Chuyển trực tiếp số từ và danh từ, đồng thời nhất quán với cách dịch עיר và קִרְיָה.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: toàn vùng Ạc-gốp
  rationale: חבל ở đây là một địa hạt hoặc vùng; “vùng” rõ ràng, phổ thông và không cổ kính quá mức.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: thuộc vương quốc của Óc ở Ba-san
  rationale: Diễn đạt quan hệ của vùng Ạc-gốp với vương quốc Óc và giữ Ba-san là địa điểm của vương quốc.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ sự chuyển đổi số của nguyên văn: “các thành của vua ấy” nhưng “lấy khỏi tay họ,” trong đó số nhiều có thể chỉ dân hoặc quân lực của vua Óc. Không thêm chú thích vì bản dịch chính đã biểu đạt rõ hình thái số nhiều của nguyên văn.'
