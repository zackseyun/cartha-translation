translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng lối phiên âm tên riêng quen thuộc trong tiếng Việt; bảo toàn sự chuyển đổi từ ngôi thứ nhất số nhiều sang ngôi thứ nhất số ít và ghi chú các khả năng địa lý còn hàm hồ.
