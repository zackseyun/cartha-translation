  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: ngôi «chúng ta» chuyển sang «tôi», việc chiếm hữu lãnh thổ, A-rô-e bên thung lũng Ạt-nôn, một nửa miền đồi núi Ga-la-át cùng các thành, và sự phân cho người Ru-bên và người Gát. Tuy nhiên, «cho đến» thêm một điểm kết thúc/ranh giới không có trong nguyên văn, vốn chỉ nối «từ A-rô-e» với «một nửa miền đồi núi Ga-la-át» bằng liên từ «và».'
  naturalness: Bỏ «cho đến» giúp câu không áp đặt quan hệ «từ... đến...» và vẫn tự nhiên trong văn phong tường thuật trang trọng. «Nơi nằm bên» gọn hơn «là nơi nằm bên».
  terminology: Các tên riêng A-rô-e, Ạt-nôn, Ga-la-át, Ru-bên và Gát được dùng nhất quán. «Miền đồi núi» phản ánh thích hợp הַר trong mô tả lãnh thổ; «thành» và «ban» phù hợp ngữ vực Kinh Thánh hiện đại.
