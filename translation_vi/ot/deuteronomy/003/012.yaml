base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: vi
  text: Lúc ấy, chúng ta đã chiếm hữu vùng đất này, từ A-rô-e, nơi nằm bên thung lũng Ạt-nôn,[a] và một nửa miền đồi núi Ga-la-át cùng các thành của miền ấy.[b] Tôi đã ban vùng đất ấy cho người Ru-bên và người Gát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bên khe Ạt-nôn.” Từ Hê-bơ-rơ נחל có thể chỉ khe suối, thung lũng có dòng chảy theo mùa, hoặc thung lũng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một nửa núi Ga-la-át.” Trong các mô tả lãnh thổ, từ Hê-bơ-rơ הַר thường chỉ một miền đồi núi, không nhất thiết chỉ một ngọn núi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: chúng ta chiếm lấy
  rationale: Trong bối cảnh chinh phục và phân chia lãnh thổ, động từ ירשׁ chỉ việc chủ động chiếm hữu; “chiếm lấy” tự nhiên và rõ nghĩa hơn “thừa hưởng”.
- source_word: הָאָרֶץ הַזֹּאת
  choice: vùng đất này
  rationale: “Vùng đất” diễn đạt tự nhiên một lãnh thổ đã bị chiếm và sắp được phân chia.
- source_word: בָּעֵת הַהִוא
  choice: lúc ấy
  rationale: Cách diễn đạt thời gian gọn, tự nhiên và tương ứng trực tiếp với tiếng Hê-bơ-rơ.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: từ A-rô-e, là nơi nằm bên thung lũng Ạt-nôn
  rationale: Giữ nguyên mệnh đề quan hệ và tên địa danh; “bên” phù hợp với על trong mô tả vị trí, còn נחל được hiểu là thung lũng khe suối.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: cho đến một nửa miền đồi núi Ga-la-át
  rationale: הַר trong mô tả lãnh thổ có thể chỉ cả vùng đồi núi chứ không nhất thiết một ngọn núi; thêm “cho đến” giúp câu tiếng Việt thể hiện tự nhiên phạm vi bắt đầu từ A-rô-e mà không thay đổi địa giới được kể.
- source_word: וְעָרָיו
  choice: cùng các thành của miền ấy
  rationale: Hậu tố sở hữu quy chiếu về vùng Ga-la-át; diễn đạt rõ quy chiếu trong tiếng Việt.
- source_word: נָתַתִּי
  choice: Tôi đã ban vùng đất đó
  rationale: Giữ sự chuyển đổi chủ thể từ “chúng ta” sang “tôi”; “ban” phù hợp hành động Môi-se trao phần đất, còn tân ngữ được nêu rõ để tiếng Việt không mơ hồ.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: cho người Ru-bên và người Gát
  rationale: Các tính từ dân tộc ở dạng số ít mang nghĩa tập thể, chỉ hai cộng đồng bộ tộc; cách nói này tự nhiên trong tiếng Việt Kinh Thánh.
