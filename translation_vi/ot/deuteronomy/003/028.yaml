  text: וְ/צַ֥ו אֶת יְהוֹשֻׁ֖עַ וְ/חַזְּקֵ֣/הוּ וְ/אַמְּצֵ֑/הוּ כִּי ה֣וּא יַעֲבֹ֗ר לִ/פְנֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/הוּא֙ יַנְחִ֣יל אוֹתָ֔/ם אֶת הָ/אָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: vi
  text: Nhưng hãy giao trọng trách cho Giô-suê[a], làm cho ông mạnh mẽ và can đảm[b], vì chính ông sẽ đi qua trước dân này và sẽ làm cho họ được thừa hưởng vùng đất mà ngươi sẽ thấy.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy truyền lệnh cho Giô-suê” hoặc “hãy ủy nhiệm Giô-suê.” Động từ Hê-bơ-rơ ở đây có thể chỉ việc chính thức trao phó trách nhiệm.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “hãy làm cho ông mạnh mẽ và làm cho ông can đảm.” Hai động từ đi đôi với nhau, nhấn mạnh sự vững vàng và lòng can đảm.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “ông sẽ khiến họ thừa hưởng vùng đất.” Động từ Hê-bơ-rơ ở thể sai khiến: Giô-suê sẽ là tác nhân qua đó dân nhận đất làm cơ nghiệp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: hãy giao trọng trách cho Giô-suê
  rationale: Động từ צוה ở thể piel mệnh lệnh trong ngữ cảnh này chỉ việc chính thức trao phó trách nhiệm lãnh đạo, không chỉ đơn thuần ra một mệnh lệnh. Cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái ủy nhiệm.
- source_word: וְחַזְּקֵהוּ וְאַמְּצֵהוּ
  choice: làm cho ông mạnh mẽ và can đảm
  rationale: Hai động từ causative bổ sung cho nhau, diễn tả việc củng cố sức mạnh, sự vững vàng và lòng can đảm của Giô-suê.
- source_word: כִּי הוּא יַעֲבֹר לִפְנֵי הָעָם הַזֶּה
  choice: vì chính ông sẽ đi qua trước dân này
  rationale: יַעֲבֹר phù hợp với bối cảnh vượt qua sông Giô-đanh; לִפְנֵי vừa giữ hình ảnh đi trước vừa hàm ý vai trò lãnh đạo. Đại từ הוּא được nhấn bằng “chính ông”.
- source_word: וְהוּא יַנְחִיל אוֹתָם אֶת־הָאָרֶץ
  choice: và sẽ dẫn họ vào nhận đất ... làm cơ nghiệp
  rationale: 'Thể hiphil của נחל có nghĩa causative: Giô-suê là tác nhân đưa dân đến chỗ nhận và chiếm hữu phần cơ nghiệp. Cách diễn đạt tiếng Việt này rõ nghĩa mà không biến Giô-suê thành nguồn ban đất.'
- source_word: אֲשֶׁר תִּרְאֶה
  choice: mà ngươi sẽ thấy
  rationale: Thể chưa hoàn thành được hiểu theo nghĩa tương lai trong bối cảnh Môi-se sắp được nhìn thấy đất nhưng không được vào đó.
theological_decisions:
- issue: Vai trò của Giô-suê trong việc dân nhận đất
  choice: Giô-suê “dẫn họ vào nhận” đất làm cơ nghiệp
  alternative: Giô-suê “ban đất” cho họ hoặc “khiến họ thừa hưởng” đất
  rationale: Bản dịch duy trì sắc thái causative của יַנְחִיל nhưng tránh hàm ý rằng Giô-suê là nguồn thần học tối hậu ban đất; ông là tác nhân lãnh đạo qua đó dân nhận cơ nghiệp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phù hợp lời Đức Chúa Trời trực tiếp phán với Môi-se trong văn mạch Kinh Thánh; tên riêng theo dạng Việt hóa quen thuộc “Giô-suê”. Các dấu chú thích [a], [b], [c] đều được đặt trong chính văn.
