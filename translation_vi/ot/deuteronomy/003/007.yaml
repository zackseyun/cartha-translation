  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: toàn bộ gia súc, chiến lợi phẩm của các thành, và việc người nói chiếm chúng cho nhóm mình. Tuy nhiên, “đã lấy làm của mình” làm mờ sắc thái động từ בָּזַז, vốn chỉ hành vi cướp/thu chiến lợi phẩm trong chiến tranh. Cần diễn đạt rõ hành vi này trong câu chính.'
