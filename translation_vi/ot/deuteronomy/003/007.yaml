    rationale: בַּזּוֹנוּ (từ בזז) là “chúng ta đã cướp lấy/thu làm chiến lợi phẩm.” Dù danh từ “chiến lợi phẩm” gợi ngữ cảnh quân sự, động từ trong bản nháp vẫn có thể bị hiểu là việc lấy thông thường.
