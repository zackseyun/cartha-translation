base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/007.yaml
  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: vi
  text: Nhưng toàn bộ gia súc và chiến lợi phẩm của các thành, chúng ta đã cướp lấy cho mình[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Còn toàn bộ gia súc và chiến lợi phẩm của các thành, chúng ta đã lấy làm của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Nhưng toàn bộ
  rationale: Liên từ וְ nối với việc tiêu diệt dân cư ở câu trước và trong ngữ cảnh mang sắc thái tương phản nhẹ; “nhưng” diễn đạt sắc thái ấy, còn “toàn bộ” giữ nguyên ý bao quát của כָּל.
- source_word: הַ/בְּהֵמָה
  choice: gia súc
  rationale: בְּהֵמָה ở đây chỉ các loài vật nuôi của cư dân trong các thành; “gia súc” là cách nói hiện đại, tự nhiên và chính xác hơn từ rộng nghĩa “động vật”.
- source_word: וּ/שְׁלַל
  choice: và chiến lợi phẩm
  rationale: שָׁלָל chỉ tài sản lấy được trong chiến tranh; “chiến lợi phẩm” vừa rõ nghĩa vừa phù hợp với văn phong trang trọng hiện đại.
- source_word: הֶ/עָרִים
  choice: của các thành
  rationale: Cách dịch này giữ quan hệ kết cấu trực tiếp trong tiếng Hê-bơ-rơ, chỉ chiến lợi phẩm thuộc về hoặc lấy từ các thành ấy.
- source_word: בַּזּוֹנוּ
  choice: chúng ta đã lấy làm của mình
  rationale: Động từ בזז có nghĩa là cướp lấy hoặc thu chiến lợi phẩm. Trong câu chính, cách diễn đạt này tự nhiên trong tiếng Việt và truyền đạt việc chiếm lấy tài sản, còn sắc thái quân sự đã hiện rõ qua danh từ “chiến lợi phẩm”.
- source_word: לָֽ/נוּ
  choice: làm của mình
  rationale: Giới từ לְ kèm đại từ ngôi thứ nhất số nhiều cho biết phía hưởng lợi; “làm của mình” diễn đạt tự nhiên rằng số tài sản ấy được chiếm để thuộc về dân Y-sơ-ra-ên.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Thành” phù hợp với ngữ cảnh các đô thị cổ; “chiến lợi phẩm” giữ rõ bối cảnh quân sự. Chú thích bảo lưu cách dịch trực tiếp hơn của động từ בזז và khả năng hiểu וְ theo nghĩa nối tiếp “còn” thay vì tương phản rõ là “nhưng”.
