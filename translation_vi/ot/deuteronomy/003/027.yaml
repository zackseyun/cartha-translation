  source_fidelity: 'Bản dịch theo sát mệnh lệnh và trật tự của tiếng Hê-bơ-rơ: lên đỉnh Phích-ga, nhìn theo bốn hướng, rồi nhận biết rằng Môi-se sẽ không vượt qua Giô-đanh. “Về phía tây” truyền đạt đúng יָמָּה trong ngữ cảnh định hướng; “sông Giô-đanh này” giữ được từ chỉ định הַזֶּה.'
  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. Sự lặp lại “mắt” trong “ngước mắt nhìn” và “nhìn bằng chính mắt ngươi” phản ánh sự nhấn mạnh của nguyên văn mà không gây khó hiểu.
  terminology: “Phích-ga,” “Giô-đanh,” và đại từ “ngươi” nhất quán với văn phong Kinh Thánh trang trọng. Cách gọi “sông Giô-đanh” là tự nhiên trong tiếng Việt, đồng thời chú thích nêu rõ rằng danh từ “sông” không hiện diện trong tiếng Hê-bơ-rơ.
