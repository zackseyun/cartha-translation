source:
  edition: WLC
  text: עֲלֵ֣ה רֹ֣אשׁ הַ/פִּסְגָּ֗ה וְ/שָׂ֥א עֵינֶ֛י/ךָ יָ֧מָּ/ה וְ/צָפֹ֛נָ/ה וְ/תֵימָ֥נָ/ה וּ/מִזְרָ֖חָ/ה וּ/רְאֵ֣ה בְ/עֵינֶ֑י/ךָ כִּי לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: vi
  text: Hãy lên đỉnh Phích-ga, ngước mắt nhìn về phía tây[a], phía bắc, phía nam và phía đông; hãy nhìn bằng chính mắt ngươi, vì ngươi sẽ không vượt qua sông Giô-đanh này.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “về phía biển,” cách nói thông thường để chỉ hướng tây.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “Giô-đanh này.” Tiếng Hê-bơ-rơ chỉ nói “Giô-đanh” mà không có từ “sông.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Hãy lên
  rationale: Mệnh lệnh Qal của עלה chỉ hành động đi lên; cách diễn đạt này tự nhiên và giữ rõ hướng chuyển động.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: đỉnh Phích-ga
  rationale: רֹאשׁ có nghĩa là “đầu, đỉnh”; trong ngữ cảnh địa hình, “đỉnh Phích-ga” là cách nói gọn và tự nhiên.
- source_word: וְשָׂא עֵינֶיךָ
  choice: ngước mắt nhìn
  rationale: Thành ngữ Hê-bơ-rơ nói về việc hướng tầm mắt lên và ra xa. “Ngước mắt nhìn” giữ được hình ảnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: יָמָּה
  choice: về phía tây
  rationale: Dạng chỉ hướng bắt nguồn từ יָם, nghĩa đen là “về phía biển,” nhưng theo cách định hướng quen thuộc tại vùng đất ấy thì chỉ hướng tây.
- source_word: וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: phía bắc, phía nam và phía đông
  rationale: Ba dạng chỉ hướng được chuyển thành các phương hướng thông dụng, đồng thời giữ nguyên thứ tự của bản Hê-bơ-rơ.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: hãy nhìn bằng chính mắt ngươi
  rationale: Giữ sự lặp lại từ “mắt” và sắc thái nhấn mạnh rằng Môi-se chỉ được tự mình nhìn thấy miền đất.
- source_word: כִּי לֹא תַעֲבֹר
  choice: vì ngươi sẽ không vượt qua
  rationale: כִּי nêu lý do cho mệnh lệnh trước đó; עבר khi nói đến một con sông được diễn đạt tự nhiên là “vượt qua.”
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: sông Giô-đanh này
  rationale: Thêm danh từ loại “sông” để tên địa lý rõ ràng trong tiếng Việt, còn “này” giữ nguyên sắc thái chỉ định của הַזֶּה.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng rõ ràng, dùng các mệnh lệnh tự nhiên trong tiếng Việt hiện đại. Đại từ “ngươi” giữ lối xưng hô số ít trực tiếp và trang nghiêm trong lời Đức Chúa Trời phán với Môi-se, tránh thêm quan hệ thân tộc mà nguyên văn không nêu. Các dấu chú thích được đặt đúng tại “phía tây” và “sông Giô-đanh này,” tương ứng với nội dung chú thích; vị trí dấu trong lớp tham khảo tiếng Anh có vẻ bị lệch.
