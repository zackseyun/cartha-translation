base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/015.yaml
  text: And to Machir I gave Gilead[a].
translation:
  language: vi
  text: Còn cho Ma-ki, tôi đã ban Ga-la-át.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ, tên Ga-la-át có mạo từ xác định; tiếng Việt thường không dùng mạo từ trước địa danh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: Còn cho Ma-ki
  rationale: וּ nối câu này với lời thuật về việc phân chia đất ở văn cảnh trước; לְ biểu thị người nhận. “Còn cho” tự nhiên trong tiếng Việt và giữ được mối liên kết ấy. Tên riêng מָכִיר được phiên âm là “Ma-ki”.
- source_word: נָתַתִּי
  choice: tôi đã ban
  rationale: Động từ נתן ở thể Qal hoàn thành, ngôi thứ nhất số ít, diễn tả hành động ban đất đã xảy ra. “Đã ban” vừa sát nghĩa vừa phù hợp với ngữ cảnh phân đất; “ban” tự nhiên hơn “cho” khi đối tượng là lãnh thổ.
- source_word: אֶת
  choice: '[dấu chỉ định ngữ trực tiếp, không dịch riêng]'
  rationale: Tiểu từ אֶת đánh dấu tân ngữ xác định và không có từ tương đương độc lập cần biểu đạt trong cú pháp tiếng Việt.
- source_word: הַגִּלְעָד
  choice: Ga-la-át
  rationale: Địa danh גִּלְעָד được phiên âm theo dạng quen thuộc trong tiếng Việt. Mạo từ הַ không cần dịch thành một từ riêng trước địa danh trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc ngắn gọn của nguyên văn; dùng “Còn” để nối với trình thuật phân đất xung quanh và “đã ban” để diễn đạt hồi tưởng của người kể.
