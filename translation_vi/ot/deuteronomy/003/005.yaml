translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên bám sát cấu trúc và hình ảnh của nguyên văn, đặc biệt giữ sắc thái số đôi ở “cửa hai cánh”, nhưng dùng cách diễn đạt tiếng Việt tự nhiên.
