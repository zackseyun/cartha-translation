  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
translation:
  language: vi
  text: Tất cả các thành ấy đều là thành kiên cố, có tường cao, cửa hai cánh và then cài, chưa kể rất nhiều thành không có tường thành.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các làng mạc ở vùng trống” hoặc “các thành ở miền quê”. Tiếng Hê-bơ-rơ đối lập những khu dân cư này với các thành kiên cố vừa được mô tả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻרוֹת
  choice: kiên cố
  rationale: Tính từ này mô tả các thành được củng cố để chống lại sự tấn công; “kiên cố” tự nhiên và chính xác trong ngữ cảnh quân sự.
- source_word: חוֹמָה גְבֹהָה
  choice: có tường cao
  rationale: Giữ hình thức số ít của tiếng Hê-bơ-rơ theo nghĩa mô tả hoặc tập hợp, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: דְּלָתַיִם
  choice: cửa hai cánh
  rationale: Dạng số đôi chỉ một cặp cánh cửa; “cửa hai cánh” giữ được sắc thái hình thái học và phù hợp với hình ảnh then cài ngay sau đó.
- source_word: וּבְרִיחַ
  choice: và then cài
  rationale: Chỉ bộ phận dùng để chặn, khóa cửa thành; số ít tiếng Việt có thể mang nghĩa loại hoặc tập hợp trong chuỗi mô tả.
- source_word: לְבַד
  choice: ngoài ra còn có
  rationale: Trong ngữ cảnh này, từ ngữ đánh dấu phần được thêm vào bên cạnh các thành kiên cố.
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: thị trấn không có tường thành
  rationale: Cụm từ chỉ các khu dân cư ở vùng trống, không được phòng thủ bằng tường thành, đối lập trực tiếp với các thành kiên cố vừa nêu.
- source_word: הַרְבֵּה מְאֹד
  choice: rất nhiều
  rationale: Diễn đạt tự nhiên mức độ phong phú được nhấn mạnh trong nguyên văn.
- source_word: כָּל אֵלֶּה עָרִים
  choice: Tất cả những thành ấy đều là các thành
  rationale: Bổ sung hệ từ theo cú pháp tiếng Việt nhưng vẫn giữ trọng tâm mở đầu “tất cả những thành ấy” của tiếng Hê-bơ-rơ.
