  text: וַ/נֵּ֣שֶׁב בַּ/גָּ֔יְא מ֖וּל בֵּ֥ית פְּעֽוֹר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/029.yaml
  text: So we stayed in the valley opposite Beth-peor[a].
translation:
  language: vi
  text: Vậy chúng tôi ở lại trong thung lũng đối diện Bết Phê-ô[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và chúng tôi cư ngụ trong thung lũng hướng về Bết Phê-ô.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: Vậy chúng tôi ở lại
  rationale: Động từ יָשַׁב ở dạng wayyiqtol ngôi thứ nhất số nhiều kể tiếp một hành động trong quá khứ. “Ở lại” tự nhiên trong tiếng Việt hiện đại và phù hợp với việc lưu trú tại một địa điểm; “Vậy” thể hiện sự tiếp nối và kết quả trong mạch văn.
- source_word: בַּגָּיְא
  choice: trong thung lũng
  rationale: גַּיְא có thể chỉ thung lũng, khe núi hoặc vực. “Thung lũng” là cách dịch rộng, tự nhiên và không xác định địa hình quá mức.
- source_word: מוּל
  choice: đối diện
  rationale: מוּל diễn tả vị trí ở trước mặt hoặc đối diện một địa điểm. “Đối diện” ngắn gọn và tự nhiên khi đi với địa danh.
- source_word: בֵּית פְּעוֹר
  choice: Bết Phê-ô
  rationale: Đây là địa danh nên được phiên âm thay vì dịch nghĩa. “Bết Phê-ô” theo lối phiên âm quen thuộc, dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ câu ngắn của nguyên văn, dùng “ở lại” thay cho cách nói trang trọng hơn là “cư ngụ”; phương án ấy được bảo lưu trong chú thích.
