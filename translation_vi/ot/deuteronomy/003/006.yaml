    issue: Cụm “biệt họ ra để hủy diệt” có trật tự từ gượng.
    rationale: Trong tiếng Việt chuẩn hiện đại, “biệt riêng họ để hủy diệt” tự nhiên hơn và vẫn giữ ý nghĩa kỹ thuật của חרם.
  - severity: low
    issue: Liên kết của mệnh đề “chúng ta hủy diệt hoàn toàn mọi thành—...” chưa thật rõ.
    rationale: Dùng dấu hai chấm sau “mọi thành” làm rõ rằng cụm tiếp theo triển khai các nhóm người trong từng thành, phù hợp cấu trúc liệt kê của tiếng Hê-bơ-rơ.
