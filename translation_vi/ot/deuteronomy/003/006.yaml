  text: וַ/נַּחֲרֵ֣ם אוֹתָ֔/ם כַּ/אֲשֶׁ֣ר עָשִׂ֔ינוּ לְ/סִיחֹ֖ן מֶ֣לֶךְ חֶשְׁבּ֑וֹן הַחֲרֵם֙ כָּל עִ֣יר מְתִ֔ם הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: vi
  text: 'Chúng ta đã biệt riêng họ để hủy diệt[a], như đã làm với Si-hôn, vua Hết-bôn: chúng ta đã hủy diệt hoàn toàn mọi thành, gồm đàn ông, phụ nữ và trẻ nhỏ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đặt họ dưới lệnh tận diệt.” Tiếng Hê-bơ-rơ dùng động từ חרם, một thuật ngữ chỉ việc biệt riêng một người hoặc vật để hủy diệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: chúng ta đã biệt họ ra để hủy diệt
  rationale: Động từ חרם ở thể Hiphil là thuật ngữ chỉ việc đặt người hoặc vật vào tình trạng bị biệt riêng để hủy diệt. Cách dịch này giữ được sắc thái kỹ thuật và không giản lược thành động từ thông thường «tiêu diệt».
- source_word: כַּאֲשֶׁר עָשִׂינוּ
  choice: như đã làm
  rationale: Mệnh đề so sánh hồi chỉ hành động trước đó; tiếng Việt tự nhiên có thể lược chủ ngữ ở mệnh đề phụ mà ý vẫn rõ.
- source_word: לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: với Si-hôn, vua Hết-bôn
  rationale: Giới từ ל sau עשה đánh dấu đối tượng chịu tác động; «làm với» là cách diễn đạt tự nhiên trong cấu trúc tiếng Việt này.
- source_word: הַחֲרֵם
  choice: hủy diệt hoàn toàn
  rationale: Động từ nguyên mẫu tuyệt đối giải thích và nhấn mạnh hành động חרם trước đó; cách dịch này thể hiện tính triệt để mà vẫn tự nhiên.
- source_word: כָּל עִיר
  choice: mọi thành
  rationale: עיר chỉ thành hoặc thành thị; «mọi thành» phù hợp văn cảnh và giữ lực phân phối của כָּל.
- source_word: מְתִם
  choice: đàn ông
  rationale: Danh từ này chỉ những người nam, được liệt kê riêng bên cạnh phụ nữ và trẻ nhỏ; không nên hòa nó vào ý «thành có dân cư».
- source_word: הַנָּשִׁים
  choice: phụ nữ
  rationale: Tương đương trực tiếp, rõ ràng và tự nhiên.
- source_word: וְהַטָּף
  choice: và trẻ nhỏ
  rationale: טף chỉ trẻ em còn nhỏ hoặc những người nhỏ tuổi phụ thuộc; «trẻ nhỏ» chính xác hơn từ rộng nghĩa «trẻ em».
theological_decisions:
- issue: Cách chuyển ngữ חרם trong bối cảnh chiến tranh phán xét
  choice: Dùng «biệt họ ra để hủy diệt» ở mệnh đề chính và «hủy diệt hoàn toàn» ở mệnh đề giải thích.
  alternative: «tiêu diệt hoàn toàn» hoặc «đặt họ dưới lệnh tận diệt»
  rationale: Bản dịch cần giữ cả tính kỹ thuật lẫn mức độ nghiêm khắc của חרם, không làm nhẹ đi cũng không dùng một thành ngữ khó hiểu làm lời chính. Chú thích nêu cách diễn đạt thay thế.
translation_notes:
  register: Văn phong trang nghiêm, hiện đại và dễ hiểu. Dấu gạch ngang giữ cấu trúc liệt kê trực diện của bản Hê-bơ-rơ; tên riêng được phiên âm theo lối quen dùng trong tiếng Việt.
