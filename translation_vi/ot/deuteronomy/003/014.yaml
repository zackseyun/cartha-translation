- from: Giai-rơ, con trai Ma-na-se, chiếm toàn vùng Ạt-gốp[a], cho đến ranh giới của dân Ghê-sua và dân Ma-a-ca. Ông lấy tên mình mà gọi các nơi ấy trong Ba-san là Ha-vốt Giai-rơ[b], và tên đó vẫn còn cho đến ngày nay.
  to: Giai-rơ, con trai Ma-na-se, chiếm toàn vùng Ạt-gốp[a], cho đến ranh giới của dân Ghê-sua và dân Ma-a-ca. Ông lấy tên mình mà gọi các nơi ấy trong Ba-san là Ha-vốt Giai-rơ[b]; tên gọi ấy vẫn còn cho đến ngày nay.
  rationale: Chỉ điều chỉnh nhẹ mệnh đề kết để tiếng Việt liên kết rõ “cho đến ngày nay” với tên gọi Ha-vốt Giai-rơ. Giữ cách hiểu địa điểm “trong Ba-san” trong chính văn vì tự nhiên và phù hợp ngữ cảnh, đồng thời bảo lưu trong chú thích tính cô đọng và khả năng phân tích khác của cú pháp Hê-bơ-rơ.
