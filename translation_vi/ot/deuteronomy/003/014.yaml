    rationale: עַד הַיּוֹם הַזֶּה gắn với tên Ha-vốt Giai-rơ trong lời thuật chuyện. “Tên gọi ấy vẫn còn...” là cách tiếng Việt mạch lạc hơn mà không thêm ý nghĩa.
  - severity: low
    issue: Cú pháp liên hệ giữa “Ba-san” và “Ha-vốt Giai-rơ” cần được bảo lưu là khó trong chú thích.
    rationale: Nguyên văn có đối tượng số nhiều rồi đến cấu trúc “Ba-san, Ha-vốt Giai-rơ”. Chính văn “các nơi ấy trong Ba-san” là một cách hiểu hợp lý, nhưng không nên trình bày nó như cách hiểu duy nhất; chú thích cần giữ phương án sát chữ.
