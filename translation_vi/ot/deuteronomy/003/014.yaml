source:
  edition: WLC
  text: יָאִ֣יר בֶּן מְנַשֶּׁ֗ה לָקַח֙ אֶת כָּל חֶ֣בֶל אַרְגֹּ֔ב עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּֽעֲכָתִ֑י וַ/יִּקְרָא֩ אֹתָ֨/ם עַל שְׁמ֤/וֹ אֶת הַ/בָּשָׁן֙ חַוֺּ֣ת יָאִ֔יר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: vi
  text: Giai-rơ, con trai Ma-na-se, chiếm toàn vùng Ạt-gốp[a], cho đến ranh giới của dân Ghê-sua và dân Ma-a-ca. Ông lấy tên mình mà gọi các nơi ấy trong Ba-san là Ha-vốt Giai-rơ[b]; tên gọi ấy vẫn còn cho đến ngày nay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “toàn địa hạt Ạt-gốp.”
    reason: lexical_alternative
  - marker: b
    text: 'Ha-vốt Giai-rơ có lẽ có nghĩa là “các làng của Giai-rơ” hoặc “các khu lều trại của Giai-rơ.” Cú pháp Hê-bơ-rơ ở đây cô đọng; sát chữ hơn có thể hiểu: “ông gọi chúng theo tên mình, tức Ba-san, là Ha-vốt Giai-rơ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶבֶל
  choice: vùng
  rationale: Trong văn cảnh địa lý, từ này chỉ một khu vực đất đai được xác định; “vùng” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אַרְגֹּב
  choice: Ạt-gốp
  rationale: Tên riêng địa danh, được phiên âm nhất quán sang tiếng Việt.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: cho đến ranh giới của dân Ghê-sua và dân Ma-a-ca
  rationale: גְּבוּל chỉ ranh giới; các dạng chỉ dân tộc được diễn đạt tự nhiên là “dân Ghê-sua” và “dân Ma-a-ca”.
- source_word: וַיִּקְרָא אֹתָם עַל שְׁמוֹ
  choice: Ông lấy tên mình mà gọi các nơi ấy
  rationale: Giữ đối tượng số nhiều của tiếng Hê-bơ-rơ và truyền đạt thành ngữ đặt tên theo chính mình; “các nơi ấy” tránh quy chiếu mơ hồ nhưng không xác định quá mức đó là làng hay trại.
- source_word: אֶת הַבָּשָׁן
  choice: trong Ba-san
  rationale: Cú pháp Hê-bơ-rơ cô đọng và khó; cách hiểu địa điểm tạo câu tiếng Việt tự nhiên, trong khi cách đọc sát chữ hơn được bảo tồn ở chú thích.
- source_word: חַוֹּת יָאִיר
  choice: Ha-vốt Giai-rơ
  rationale: Đây là địa danh; phiên âm trong chính văn, còn nghĩa khả dĩ của thành tố חַוֹּת được nêu trong chú thích.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: và tên đó vẫn còn cho đến ngày nay
  rationale: Diễn đạt tự nhiên ý rằng tên gọi tiếp tục tồn tại đến thời người thuật chuyện.
theological_decisions:
- issue: Quan hệ cú pháp giữa đối tượng số nhiều, Ba-san và tên Ha-vốt Giai-rơ
  choice: Hiểu các đối tượng được đặt tên là những nơi trong Ba-san
  alternative: 'Dịch sát cấu trúc cô đọng: “ông gọi chúng theo tên mình, Ba-san, là Ha-vốt Giai-rơ”'
  rationale: Nguyên văn có đại từ số nhiều nhưng tiếp theo là cấu trúc khó giải thích với “Ba-san”. Chính văn ưu tiên câu tiếng Việt dễ hiểu mà vẫn giữ số nhiều; chú thích bảo tồn cách đọc sát chữ và sự bất định.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “chiếm” cho hành động giành lấy lãnh thổ; phiên âm các địa danh theo lối tiếng Việt. Chính văn làm rõ vừa đủ để đọc tự nhiên, còn chú thích lưu giữ sự mơ hồ cú pháp và các nghĩa từ vựng khả dĩ.
