  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: vi
  text: 'Lúc ấy, tôi truyền lệnh cho anh em rằng: “Yahweh[a], Đức Chúa Trời của anh em, đã ban cho anh em xứ này để chiếm hữu. Mọi người nam có khả năng chiến đấu trong anh em phải vượt qua, được trang bị vũ khí[b], đi trước các anh em mình, tức là con trai Y-sơ-ra-ên[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh” là cách chuyển tự danh riêng יהוה (YHWH).
    reason: Danh riêng
  - marker: b
    text: 'Hoặc: “được trang bị để chiến đấu.”'
    reason: Lựa chọn từ vựng
  - marker: c
    text: 'Nguyên văn: “các anh em của anh em, con trai Y-sơ-ra-ên.” “Mọi người nam có khả năng chiến đấu” chỉ những người đủ sức ra trận, không chỉ người có lòng can đảm.'
    reason: Làm rõ thành ngữ thân tộc và thuật ngữ quân sự
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם בָּעֵת הַהִוא לֵאמֹר
  choice: Lúc ấy, tôi truyền lệnh cho anh em rằng
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ thời điểm, hành động ra lệnh và công thức dẫn lời của tiếng Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng phiên âm danh riêng YHWH đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: נָתַן לָכֶם אֶת הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ
  choice: đã ban cho anh em xứ này để chiếm hữu
  rationale: Thể hoàn thành נָתַן được dịch là “đã ban”; ירשׁ trong bối cảnh phân chia và chinh phục lãnh thổ mang nghĩa chiếm lấy rồi sở hữu.
- source_word: חֲלוּצִים תַּעַבְרוּ לִפְנֵי
  choice: phải mang vũ khí, vượt qua trước mặt
  rationale: חֲלוּצִים chỉ tình trạng được trang bị để chiến đấu; תַּעַבְרוּ trong ngữ cảnh mệnh lệnh được thể hiện bằng “phải ... vượt qua”; לִפְנֵי được giữ theo nghĩa đi ở phía trước.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: anh em mình là con dân Y-sơ-ra-ên
  rationale: Giữ hình ảnh thân tộc của אֲחֵיכֶם, nhưng dùng “con dân Y-sơ-ra-ên” tự nhiên hơn lối dịch máy móc “các con trai Y-sơ-ra-ên” trong tiếng Việt.
- source_word: כָּל בְּנֵי חָיִל
  choice: tất cả anh em là những chiến binh có khả năng chiến đấu
  rationale: Trong văn cảnh quân sự, cụm từ nói đến toàn bộ những người đủ sức và năng lực ra trận, chứ không chỉ phẩm chất can đảm nội tâm.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời. Bản dịch giữ danh riêng bằng dạng phiên âm quen thuộc trong tiếng Việt, không thay bằng tước hiệu; ghi chú nêu dạng phục nguyên thường gặp.
- issue: Phạm vi giới tính và cộng đồng trong אֲחֵיכֶם / בְּנֵי יִשְׂרָאֵל / בְּנֵי חָיִל
  choice: anh em ... con dân Y-sơ-ra-ên ... những chiến binh có khả năng chiến đấu
  alternative: các anh em ... các con trai Y-sơ-ra-ên ... mọi người dũng sĩ
  rationale: Lời truyền trực tiếp nhắm đến các lực lượng nam giới có nghĩa vụ chiến đấu. Cách dịch không mở rộng thành cả nam lẫn nữ, nhưng tránh những cụm từ tiếng Việt cổ hoặc dễ khiến người đọc hiểu “dũng sĩ” chỉ là lòng can đảm.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” trong lời Môi-se nói với cộng đồng nam giới có nghĩa vụ quân sự; dùng “xứ” cho lãnh thổ được ban. Dấu chú thích [a] được đặt cuối câu vì ghi chú giải thích nhiều yếu tố trong toàn lời trích.
