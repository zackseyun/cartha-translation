base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: vi
  text: Sau đó, chúng tôi quay sang và đi lên theo đường Ba-san[a]. Óc, vua Ba-san, cùng toàn dân của ông đi ra gặp chúng tôi để giao chiến tại Ét-rê-i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên đường đến Ba-san.” Thành ngữ Hê-bơ-rơ nói sát nghĩa là “đường của Ba-san.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Sau đó, chúng tôi quay lại
  rationale: Động từ פנה trong chuỗi tường thuật chỉ việc đổi hướng; “Sau đó” thể hiện diễn tiến, còn “quay lại” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh hành trình.
- source_word: וַנַּעַל
  choice: đi lên
  rationale: Giữ sắc thái phương hướng của עלה mà vẫn dùng cách diễn đạt thông dụng.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: theo đường Ba-san
  rationale: Giữ khá sát thành ngữ Hê-bơ-rơ “đường của Ba-san”, đồng thời để chú thích nêu cách hiểu đích đến có thể có.
- source_word: וַיֵּצֵא
  choice: kéo ra
  rationale: Trong bối cảnh giao chiến, “kéo ra” diễn đạt tự nhiên việc vua và toàn dân đi ra nghênh chiến, nhưng không thu hẹp họ thành quân đội.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Óc, vua Ba-san
  rationale: Phiên âm tên riêng theo cách quen thuộc trong tiếng Việt và thể hiện quan hệ đồng vị rõ ràng.
- source_word: לִקְרָאתֵנוּ
  choice: đón chúng tôi
  rationale: לקראתנו có nghĩa cơ bản là đi ra gặp/đón; ý đối địch đã được cụm “để giao chiến” xác định nên không cần thêm “chống lại”.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: cùng toàn dân của vua
  rationale: עם là “dân/dân chúng”, không nhất thiết chỉ quân đội. Cách diễn đạt này giữ độ rộng của từ gốc và tránh đại từ mơ hồ.
- source_word: לַמִּלְחָמָה
  choice: để giao chiến
  rationale: Trong cuộc đối đầu cụ thể này, “giao chiến” tự nhiên và chính xác hơn nghĩa rộng “chiến tranh”.
- source_word: אֶדְרֶעִי
  choice: tại Ét-rê-i
  rationale: Danh từ địa danh đứng cuối câu có chức năng chỉ nơi diễn ra cuộc giao chiến; thêm “tại” là cần thiết để câu tiếng Việt tự nhiên.
theological_decisions: []
