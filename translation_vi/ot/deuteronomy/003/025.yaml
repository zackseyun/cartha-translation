base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: vi
  text: Xin cho con được đi qua để thấy miền đất tốt đẹp bên kia sông Giô-đanh, tức miền đồi núi tốt đẹp này[a] và Li-băng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngọn núi tốt đẹp này”. Từ Hê-bơ-rơ có thể chỉ một ngọn núi cụ thể hoặc miền đồi núi phía tây sông Giô-đanh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: Xin cho con được đi qua
  rationale: Dạng cohortative cùng tiểu từ khẩn cầu diễn tả lời nài xin của Môi-se. “Xin cho con được” giữ sắc thái khẩn khoản; đại từ “con” phù hợp khi ông thưa với Chúa.
- source_word: וְאֶרְאֶה
  choice: để thấy
  rationale: Động từ cohortative nối tiếp diễn tả mục đích của việc đi qua; “để thấy” tự nhiên trong tiếng Việt.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: miền đất tốt đẹp
  rationale: Giữ ý lãnh thổ của אֶרֶץ và lối diễn đạt đặc trưng trong Phục truyền Luật lệ ký.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: bên kia sông Giô-đanh
  rationale: Diễn tả vùng ở phía đối diện sông Giô-đanh, xét từ vị trí của người nói ở phía đông; thêm “sông” để địa danh rõ và tự nhiên với độc giả Việt.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: miền đồi núi tốt đẹp này
  rationale: הָר có thể chỉ một ngọn núi hoặc cả miền núi. Ngữ cảnh mô tả xứ và việc đặt cạnh Li-băng nghiêng về nghĩa khu vực, nhưng chú thích bảo lưu nghĩa số ít.
- source_word: וְהַלְּבָנוֹן
  choice: và Li-băng
  rationale: Phiên âm địa danh theo cách dùng tiếng Việt thông dụng; ở đây có thể chỉ vùng núi Li-băng.
theological_decisions:
- issue: 'Phạm vi địa lý của הָהָר: một ngọn núi hay miền đồi núi'
  choice: miền đồi núi tốt đẹp này
  alternative: ngọn núi tốt đẹp này
  rationale: Danh từ số ít הָר có thể được dùng theo nghĩa tập hợp để nói về miền núi. Trong lời mô tả miền đất và khi đi cùng Li-băng, nghĩa khu vực có vẻ phù hợp hơn; chú thích duy trì sự mơ hồ thực sự của tiếng Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “con” trong lời Môi-se cầu xin Đức Chúa Trời nhằm thể hiện quan hệ người thưa với Đấng bề trên mà không thêm danh xưng không có trong câu Hê-bơ-rơ.
