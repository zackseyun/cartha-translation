  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: vi
  text: tất cả các thành trong miền cao nguyên[a], toàn xứ Ga-la-át và toàn xứ Ba-san, cho đến Sanh-ca và Ét-rê-i, tức các thành thuộc vương quốc của Óc tại Ba-san.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “miền bình nguyên” hoặc “vùng đất bằng”. Từ Hê-bơ-rơ ở đây chỉ vùng đất cao tương đối bằng phẳng ở phía đông sông Giô-đanh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי
  choice: tất cả các thành
  rationale: Diễn đạt đầy đủ lượng từ כֹּל cùng danh từ số nhiều עָרֵי; “thành” phù hợp với văn cảnh lãnh thổ và vương quốc.
- source_word: הַמִּישֹׁר
  choice: miền cao nguyên
  rationale: Trong địa thế phía đông sông Giô-đanh, từ này chỉ vùng đất cao tương đối bằng phẳng; “miền cao nguyên” tránh khiến độc giả hiểu đây chỉ là một đồng bằng thấp.
- source_word: הַגִּלְעָד
  choice: xứ Ga-la-át
  rationale: Giữ địa danh quen thuộc trong tiếng Việt và thêm “xứ” để biểu thị đây là một vùng lãnh thổ.
- source_word: הַבָּשָׁן
  choice: xứ Ba-san
  rationale: Phiên âm địa danh theo cách quen thuộc trong tiếng Việt; “xứ” làm rõ nghĩa vùng đất ở lần xuất hiện đầu.
- source_word: עַד
  choice: cho đến
  rationale: Diễn tả giới hạn địa lý một cách tự nhiên và sát nghĩa.
- source_word: סַלְכָה וְאֶדְרֶעִי
  choice: San-ca và Ét-rê-i
  rationale: Phiên âm hai địa danh sang tiếng Việt, gần với hình thức Hê-bơ-rơ và truyền thống tên riêng Kinh Thánh tiếng Việt.
- source_word: עָרֵי מַמְלֶכֶת
  choice: các thành thuộc vương quốc
  rationale: Thể hiện rõ quan hệ sở thuộc của chuỗi liên kết Hê-bơ-rơ, đồng thời giữ chức năng đồng vị của cụm từ trong câu.
- source_word: עוֹג
  choice: Óc
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: בַּבָּשָׁן
  choice: tại Ba-san
  rationale: Giới từ בְּ ở đây chỉ địa điểm của vương quốc; “tại” tự nhiên và chính xác hơn cách diễn giải thành quan hệ sở hữu.
