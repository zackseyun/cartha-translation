id: DEU.3.2
reference: Deuteronomy 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: vi
  text: 'Yahweh phán với tôi: “Đừng sợ hắn, vì Ta đã trao hắn, toàn dân hắn và xứ hắn vào tay ngươi. Ngươi sẽ đối xử với hắn như ngươi đã làm với Si-hôn, vua của dân A-mô-rít, vốn ở tại Hết-bôn.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu; cách này phản ánh trực tiếp danh xưng có trong bản Hê-bơ-rơ.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Đừng sợ hắn
  rationale: Giữ mệnh lệnh phủ định ngắn gọn và đối tượng giống đực số ít được nêu rõ trong nguyên văn.
- source_word: בְיָדְךָ נָתַתִּי
  choice: Ta đã trao ... vào tay ngươi
  rationale: Giữ hình ảnh Hê-bơ-rơ về việc trao vào tay, tức đặt dưới quyền kiểm soát; thì hoàn thành được diễn đạt bằng “đã trao”, trình bày chiến thắng như điều Yahweh đã thực hiện chắc chắn.
- source_word: כָּל עַמּוֹ
  choice: toàn dân hắn
  rationale: עַם chỉ toàn thể dân của vua Óc, không nên thu hẹp thành quân đội.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: Ngươi sẽ làm cho hắn
  rationale: Giữ nghĩa rộng của động từ עשה và không giải thích thêm hành động; mệnh đề so sánh phía sau cung cấp nội dung cần thiết.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: y như đã làm
  rationale: Diễn đạt tự nhiên quan hệ so sánh chặt chẽ của nguyên văn, đồng thời tránh lặp đại từ không cần thiết trong tiếng Việt.
- source_word: סִיחֹן ... הָאֱמֹרִי ... חֶשְׁבּוֹן
  choice: Si-hôn ... dân A-mô-rít ... Hết-bôn
  rationale: Dùng các dạng phiên âm quen thuộc và dễ đọc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: vốn ở tại Hết-bôn
  rationale: Phân từ ישב mô tả nơi cư trú; “vốn ở tại” tự nhiên trong lời kể quá khứ và nối rõ với vua Si-hôn.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. Giữ “Yahweh” bảo tồn tính chất danh riêng và tránh thay danh bằng tước hiệu.
- issue: Thể hoàn thành נָתַתִּי trước khi trận chiến diễn ra
  choice: Ta đã trao
  alternative: Ta sẽ trao; Ta trao
  rationale: Giữ cách nguyên văn trình bày việc trao nộp như đã hoàn tất từ lời phán của Yahweh, không làm yếu đi thành một lời hứa thuần tương lai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Cặp đại từ “Ta—ngươi” giữ sắc thái lời phán có thẩm quyền, quen thuộc trong văn Kinh Thánh tiếng Việt; “hắn” giúp phân biệt rõ vua Óc với người được phán bảo. Không thêm từ giải thích về bản chất cuộc chiến ngoài điều nguyên văn nói.
