  text: וְ/הָֽ/עֲרָבָ֖ה וְ/הַ/יַּרְדֵּ֣ן וּ/גְבֻ֑ל מִ/כִּנֶּ֗רֶת וְ/עַ֨ד יָ֤ם הָֽ/עֲרָבָה֙ יָ֣ם הַ/מֶּ֔לַח תַּ֛חַת אַשְׁדֹּ֥ת הַ/פִּסְגָּ֖ה מִזְרָֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/017.yaml
  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: vi
  text: cùng miền A-ra-ba[a], với sông Giô-đanh làm ranh giới, từ Kinh-nê-rết[b] đến tận Biển A-ra-ba, tức Biển Muối[c], ở phía dưới các sườn núi Phít-ga về hướng đông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-ra-ba là tên vùng thung lũng thuộc hệ thống đứt gãy chạy dọc sông Giô-đanh.
    reason: geographic_clarification
  - marker: b
    text: Nguyên văn chỉ ghi địa danh Kinh-nê-rết; trong ngữ cảnh này có thể chỉ khu vực hoặc hồ mang tên ấy.
    reason: preserve_ambiguity
  - marker: c
    text: Tức là Biển Chết.
    reason: modern_geographic_name
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: miền A-ra-ba
  rationale: Dùng địa danh A-ra-ba vì trong bản mô tả ranh giới này từ ngữ chỉ vùng địa lý thuộc thung lũng tách giãn, chứ không đơn thuần là một đồng bằng.
- source_word: הַיַּרְדֵּן וּגְבֻל
  choice: với sông Giô-đanh làm ranh giới
  rationale: Câu Hê-bơ-rơ tỉnh lược; cách diễn đạt này làm rõ chức năng của sông Giô-đanh trong đường ranh mà không thêm ý vượt quá ngữ cảnh.
- source_word: מִכִּנֶּרֶת
  choice: từ Kinh-nê-rết
  rationale: Giữ nguyên địa danh theo lối phiên âm tiếng Việt; nguyên văn không nói rõ đây là thành, vùng hay hồ.
- source_word: יָם הָעֲרָבָה
  choice: Biển A-ra-ba
  rationale: Dịch sát danh xưng địa lý trước cụm đồng vị giải thích là “Biển Muối”.
- source_word: יָם הַמֶּלַח
  choice: Biển Muối
  rationale: Phản ánh trực tiếp danh xưng Hê-bơ-rơ, thay vì đưa tên gọi hiện đại “Biển Chết” vào chính văn.
- source_word: תַּחַת אַשְׁדֹּת הַפִּסְגָּה
  choice: ở phía dưới các sườn núi Phít-ga
  rationale: Giữ quan hệ địa hình “ở phía dưới” và hiểu אַשְׁדֹּת là các triền hoặc sườn dốc trong bối cảnh địa lý.
- source_word: מִזְרָחָה
  choice: về hướng đông
  rationale: Giữ sắc thái định hướng của trạng từ mà không xác quyết quá mức nó bổ nghĩa riêng cho địa danh hay toàn bộ đoạn ranh giới.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Các địa danh được phiên âm theo cách quen thuộc trong tiếng Việt; cấu trúc liệt kê của nguyên văn được làm rõ vừa đủ, đồng thời giữ sự không xác định của Kinh-nê-rết và phạm vi bổ nghĩa của “về hướng đông”.
