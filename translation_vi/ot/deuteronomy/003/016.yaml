base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: vi
  text: Còn cho chi tộc Ru-bên và chi tộc Gát, tôi đã ban phần đất từ Ga-la-át đến khe Ác-nôn[a], lấy phần giữa khe làm ranh giới, và đến khe Gia-bốc, là ranh giới của con cháu Am-môn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ נחל trong tiếng Hê-bơ-rơ có thể chỉ dòng suối, khe cạn hoặc thung lũng có dòng nước; ở đây dịch là “khe” vì mệnh đề tiếp theo nói phần giữa khe được dùng làm ranh giới.
    reason: lexical_alternative
  - marker: b
    text: Hay “dân Am-môn”. Nguyên văn Hê-bơ-rơ là “con cháu Am-môn”, một cách gọi theo quan hệ dòng tộc để chỉ dân Am-môn.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: cho người Ru-bên và người Gát
  rationale: Hai dạng chỉ dân tộc/bộ tộc nói đến các thành viên của bộ tộc Ru-bên và Gát, chứ không chỉ hai tổ phụ mang tên ấy.
- source_word: נָתַתִּי
  choice: tôi đã ban
  rationale: Giữ nghĩa cơ bản của נתן là “ban/cho”; “ban” phù hợp với văn cảnh phân chia lãnh thổ mà không thêm ý niệm pháp lý.
- source_word: מִן הַגִּלְעָד
  choice: từ Ga-la-át
  rationale: Cụm này nêu điểm đầu của phạm vi lãnh thổ; Ga-la-át được dùng như địa danh.
- source_word: עַד נַחַל אַרְנֹן
  choice: đến khe Ác-nôn
  rationale: נחל có thể chỉ dòng nước, lòng khe cạn hoặc thung lũng gắn với dòng nước. “Khe” giữ được độ rộng nghĩa và phù hợp với việc lấy phần giữa làm ranh giới.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: lấy giữa khe làm ranh giới
  rationale: 'Diễn đạt tự nhiên quan hệ đồng vị trong tiếng Hê-bơ-rơ: phần giữa của khe là đường ranh, mà không thay đổi nội dung địa giới.'
- source_word: עַד יַבֹּק הַנַּחַל
  choice: đến khe Gia-bốc
  rationale: Dịch נחל nhất quán với lần xuất hiện trước và tránh xác định quá mức đây là một con sông có nước quanh năm.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: ranh giới của con cháu Am-môn
  rationale: Giữ thành ngữ thân tộc בְּנֵי עַמּוֹן của nguyên văn; trong ngữ cảnh, cụm này chỉ dân Am-môn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các địa danh được phiên âm theo lối quen thuộc trong tiếng Việt. Câu được sắp xếp để mô tả rõ phạm vi lãnh thổ, đồng thời giữ cách nói ngôi thứ nhất của Môi-se và thành ngữ thân tộc trong nguyên văn.
