source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: vi
  text: cho đến khi Yahweh ban sự yên nghỉ cho các anh em của anh em, như Ngài đã ban cho anh em[a], và họ cũng chiếm hữu miền đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho họ bên kia sông Giô-đanh[b]. Bấy giờ, mỗi người trong anh em có thể trở về phần sản nghiệp[c] mà tôi đã ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đồng bào Y-sơ-ra-ên của anh em”. Tiếng Hê-bơ-rơ dùng từ “anh em”, một từ thân tộc giống đực, để chỉ những người cùng thuộc dân Y-sơ-ra-ên.
    reason: lexical_alternative
  - marker: b
    text: Hay “phía bên kia sông Giô-đanh”. Cụm từ này được xác định theo vị trí của người nói ở phía đông con sông.
    reason: lexical_alternative
  - marker: c
    text: Hay “phần sở hữu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: ban ... được an nghỉ
  rationale: Dạng Hiphil của נוח diễn tả việc khiến cho được nghỉ ngơi, tức ban sự yên ổn; cách dịch này giữ chủ đề an cư và an toàn trong Phục Truyền Luật Lệ Ký.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước יהוה thay vì thay bằng một tước hiệu.
- source_word: לַאֲחֵיכֶם
  choice: cho anh em của anh em
  rationale: Giữ hình ảnh thân tộc số nhiều giống đực trong tiếng Hê-bơ-rơ; theo ngữ cảnh, cụm này chỉ những người đồng bào Y-sơ-ra-ên.
- source_word: כָכֶם
  choice: như anh em
  rationale: 'Giữ nguyên lối so sánh tỉnh lược của nguyên văn: Yahweh sẽ ban cho họ sự an nghỉ giống như đã ban cho những người đang được nói với.'
- source_word: וְיָרְשׁוּ
  choice: chiếm hữu
  rationale: ירשׁ trong bối cảnh phân chia đất nói đến việc tiếp nhận và nắm quyền sở hữu miền đất, không chỉ thụ động thừa kế.
- source_word: גַם הֵם
  choice: họ cũng
  rationale: Thể hiện nét nhấn mạnh rằng các chi phái phía tây cũng sẽ nhận đất như các chi phái phía đông.
- source_word: נֹתֵן
  choice: đang ban
  rationale: Phân từ trình bày việc ban đất như một hành động chắc chắn và đang tiến triển từ góc nhìn của Môi-se.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: bên kia sông Giô-đanh
  rationale: Cụm từ có tính tương đối theo vị trí người nói ở phía đông sông, tại đây chỉ miền đất phía tây sông Giô-đanh.
- source_word: וְשַׁבְתֶּם
  choice: Bấy giờ ... được trở về
  rationale: Liên từ nối tiếp trình tự sau khi nghĩa vụ chinh phục hoàn tất; 'được trở về' phù hợp với sắc thái cho phép trong ngữ cảnh.
- source_word: אִישׁ
  choice: mỗi người trong anh em
  rationale: Chuyển tải tự nhiên ý nghĩa phân phối của אִישׁ, đồng thời vẫn cho thấy đối tượng được nói với là cộng đồng nam chiến binh.
- source_word: לִירֻשָּׁתוֹ
  choice: phần sản nghiệp
  rationale: Danh từ chỉ phần đất được phân ban làm tài sản thừa hưởng; 'phần sản nghiệp' giữ cả ý sở hữu cụ thể lẫn sắc thái giao ước.
- source_word: נָתַתִּי לָכֶם
  choice: mà tôi đã ban cho anh em
  rationale: Thể hoàn thành chỉ việc Môi-se đã phân giao vùng đất phía đông sông Giô-đanh, với kết quả còn hiệu lực.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước; phiên âm 'Yahweh' bảo toàn tính chất danh riêng thay vì thay thế bằng tước hiệu.
- issue: Ngôn ngữ giống đực trong לַאֲחֵיכֶם và אִישׁ
  choice: Giữ 'anh em' cho אֲחֵיכֶם; dịch אִישׁ theo nghĩa phân phối là 'mỗi người trong anh em'
  alternative: '''đồng bào Y-sơ-ra-ên''; ''mỗi người nam'''
  rationale: Cách dịch giữ hình thức xưng hô giống đực của nguồn nhưng diễn đạt tự nhiên ý nghĩa phân phối, không mở rộng hoặc thu hẹp đối tượng một cách võ đoán.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng 'anh em' làm đại từ số nhiều theo ngữ cảnh lời Môi-se nói với các chiến binh; 'phần sản nghiệp' giữ sắc thái phân đất theo giao ước mà vẫn tự nhiên trong tiếng Việt Kinh Thánh.
