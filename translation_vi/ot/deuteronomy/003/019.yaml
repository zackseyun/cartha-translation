- from: Chỉ có vợ con[a] và súc vật của anh em—tôi biết anh em có rất nhiều súc vật—sẽ ở lại trong các thành[b] mà tôi đã ban cho anh em.
  to: Chỉ có vợ, con nhỏ[a] và súc vật của anh em—tôi biết anh em có rất nhiều súc vật—sẽ ở lại trong các thành[b] mà tôi đã ban cho anh em.
  rationale: Sửa “vợ con” thành “vợ, con nhỏ” để phản ánh trực tiếp hơn טַף mà vẫn giữ văn phong Việt tự nhiên. Chú thích a được điều chỉnh để phương án thay thế thực sự là một cách dịch rộng hơn của từ nguồn, thay vì lặp lại nghĩa chính. Không có thay đổi nào về nghĩa thần học hay cấu trúc câu.
  reviewer_model: gpt-5.6-terra
