base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: vi
  text: Chỉ có vợ, con nhỏ[a] và súc vật của anh em—tôi biết anh em có rất nhiều súc vật—sẽ ở lại trong các thành[b] mà tôi đã ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “con cái”. Từ Hê-bơ-rơ chỉ trẻ nhỏ hoặc những người lệ thuộc.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các thị trấn”. Từ Hê-bơ-rơ có thể chỉ những khu dân cư với quy mô khác nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Chỉ có
  rationale: Giữ sắc thái hạn định, nêu ngoại lệ đối với mệnh lệnh đi qua chiến đấu ở câu trước.
- source_word: נְשֵׁיכֶם
  choice: vợ
  rationale: Trong ngữ cảnh các thành viên gia đình ở lại, từ này chỉ những người vợ, tự nhiên hơn nghĩa rộng là “phụ nữ”.
- source_word: טַפְּכֶם
  choice: con
  rationale: טַף chỉ trẻ nhỏ hoặc những người con lệ thuộc; “con” là cách nói tự nhiên trong cụm “vợ con”, còn sắc thái cụ thể được ghi ở chú thích.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: súc vật / rất nhiều súc vật
  rationale: מִקְנֶה bao quát các gia súc được nuôi, không chỉ bò; lặp lại “súc vật” theo nguyên văn.
- source_word: יָדַעְתִּי כִּי
  choice: tôi biết
  rationale: Giữ nguyên lời xác nhận ở ngôi thứ nhất và chức năng giải thích của mệnh đề chen giữa.
- source_word: יֵשְׁבוּ
  choice: sẽ ở lại
  rationale: Động từ có nghĩa gốc là ngồi/cư ngụ, nhưng ở đây tương phản với những người sẽ vượt qua để chiến đấu, nên “ở lại” diễn đạt đúng chức năng ngữ cảnh.
- source_word: בְּעָרֵיכֶם
  choice: trong các thành
  rationale: עִיר có thể chỉ thành phố hoặc thị trấn; “thành” là thuật ngữ tiếng Việt trang trọng, không nhất thiết xác định quy mô hiện đại.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: mà tôi đã ban cho anh em
  rationale: Thể hoàn thành chỉ việc ban cấp đã xảy ra; “đã ban” giữ sắc thái hoàn tất và phù hợp văn phong Kinh Thánh hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với các chi phái; cấu trúc gạch ngang giữ mệnh đề giải thích chen giữa của nguyên văn.
