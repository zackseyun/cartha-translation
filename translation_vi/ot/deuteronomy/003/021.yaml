base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: vi
  text: 'Lúc ấy, tôi ra lệnh cho Giô-suê rằng: “Chính mắt anh đã thấy mọi điều Đức Giê-hô-va, Đức Chúa Trời của anh em, đã làm đối với hai vua này. Đức Giê-hô-va cũng sẽ làm như vậy đối với mọi vương quốc mà anh sắp vượt qua để tiến vào.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn sát hơn: “mà anh đang vượt qua đến đó.” Cụm này diễn tả việc Giô-suê vượt qua để đi vào các vương quốc ấy.'
    reason: Giữ nét định hướng của אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה, đồng thời giải thích cách diễn đạt tiếng Hê-bơ-rơ không hoàn toàn tự nhiên nếu chuyển từng chữ sang tiếng Việt.
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁוּעַ צִוֵּיתִי בָּעֵת הַהִוא לֵאמֹר
  choice: Bấy giờ, tôi truyền lệnh cho Giô-suê rằng
  rationale: Diễn đạt tự nhiên công thức tường thuật tiếng Hê-bơ-rơ, đồng thời giữ sắc thái thẩm quyền của צִוֵּיתִי và ý thời gian của בָּעֵת הַהִוא.
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: Chính mắt anh đã thấy
  rationale: Giữ tính nhấn mạnh và hình ảnh chứng kiến tận mắt của nguyên văn, nhưng tự nhiên trong tiếng Việt.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Đức Giê-hô-va, Đức Chúa Trời của anh em
  rationale: Dùng danh riêng giao ước cho יהוה; hậu tố trong אֱלֹהֵיכֶם là số nhiều, nên 'của anh em' phản ánh việc Giô-suê thuộc cộng đồng được nói đến.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: cho hai vua này
  rationale: Giữ quan hệ ngữ pháp của לְ mà không thêm rõ sắc thái 'chống lại', vốn đã được ngữ cảnh cho thấy.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: Đức Giê-hô-va cũng sẽ làm như vậy
  rationale: כֵּן nối hành động tương lai với khuôn mẫu đã thấy nơi hai vua; cách dịch này rõ và tự nhiên.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: mà anh sẽ vượt qua để đến đó
  rationale: Giữ ngôi thứ hai số ít khi nói trực tiếp với Giô-suê, động từ 'vượt qua' gợi việc vượt sông Giô-đanh, và 'đến đó' phản ánh שָׁמָּה.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה. 'Đức Giê-hô-va' là dạng danh xưng quen thuộc, trang trọng trong tiếng Việt và không thay danh riêng bằng một tước hiệu.
- issue: Sự chuyển đổi số trong cụm 'Đức Chúa Trời của anh em'
  choice: Giữ hậu tố số nhiều bằng 'của anh em'
  alternative: Đức Chúa Trời của anh
  rationale: אֱלֹהֵיכֶם có hậu tố ngôi thứ hai số nhiều, dù câu đang trực tiếp nói với riêng Giô-suê. Giữ 'anh em' bảo tồn sự chuyển đổi có thật trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'tôi/anh/anh em' để thể hiện lời Môi-se nói trực tiếp với Giô-suê và sự chuyển đổi từ số ít sang số nhiều trong nguyên văn; không san phẳng điểm này.
