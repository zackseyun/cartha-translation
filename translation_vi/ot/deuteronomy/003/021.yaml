revisions:
- from: 'Bấy giờ, tôi truyền lệnh cho Giô-suê rằng: “Chính mắt anh đã thấy mọi điều Đức Giê-hô-va, Đức Chúa Trời của anh em, đã làm cho hai vua này. Đức Giê-hô-va cũng sẽ làm như vậy với mọi vương quốc mà anh sẽ vượt qua để đến đó.[a]”'
  to: 'Lúc ấy, tôi ra lệnh cho Giô-suê rằng: “Chính mắt anh đã thấy mọi điều Đức Giê-hô-va, Đức Chúa Trời của anh em, đã làm đối với hai vua này. Đức Giê-hô-va cũng sẽ làm như vậy đối với mọi vương quốc mà anh sắp vượt qua để tiến vào.[a]”'
  rationale: 'Sửa các chỗ có nguy cơ đổi hàm ý hoặc gây gượng trong tiếng Việt, nhưng vẫn giữ các đặc điểm nguồn quan trọng: lời nói trực tiếp, số ít “anh” đối với Giô-suê, số nhiều “anh em” trong danh ngữ về Đức Chúa Trời, và ý vượt qua để tiến vào ở mệnh đề cuối.'
