source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: vi
  text: Vậy, Giê-hô-va Đức Chúa Trời của chúng ta cũng phó Óc, vua Ba-san, cùng toàn dân của ông vào tay chúng ta. Chúng ta đánh bại ông, cho đến khi ông không còn một người sống sót nào.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “cho đến khi không còn người sống sót nào cho ông.”'
    reason: Nguyên văn dùng một cấu trúc cô đọng; bản dịch chính diễn đạt kết quả rằng không còn người sống sót nào thuộc về Óc.
lexical_decisions:
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho danh Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: וַיִּתֵּן ... בְּיָדֵנוּ
  choice: phó ... vào tay chúng ta
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ về việc trao đối phương vào quyền kiểm soát của Israel, đồng thời diễn đạt tự nhiên trong văn cảnh chiến trận.
- source_word: גַּם
  choice: cũng
  rationale: Thể hiện ý bổ sung, nối chiến thắng này với chiến thắng trước đó đối với Si-hôn.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Óc, vua Ba-san
  rationale: Phiên âm tên riêng và địa danh theo lối quen thuộc trong Kinh Thánh tiếng Việt; dấu phẩy làm rõ 'vua Ba-san' là đồng vị ngữ.
- source_word: כָּל עַמּוֹ
  choice: toàn dân của ông
  rationale: עַם có nghĩa rộng là 'dân', không thu hẹp thành 'quân đội' dù bối cảnh là chiến tranh.
- source_word: וַנַּכֵּהוּ
  choice: Chúng ta đánh họ
  rationale: Động từ נכה mang nghĩa đánh hạ trong chiến trận. Đại từ số nhiều diễn đạt tự nhiên trong tiếng Việt rằng đối tượng gồm Óc và toàn dân vừa nêu, dù tiếng Hê-bơ-rơ dùng hậu tố số ít mang tính đại diện.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: cho đến khi không để lại cho ông một người sống sót nào
  rationale: Bám sát cấu trúc và mức độ triệt để của nguyên văn, nhưng chủ thể ngầm của הִשְׁאִיר có thể gây khó hiểu nên ghi chú một cách hiểu khác.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh; ĐỨC GIÊ-HÔ-VA
  rationale: Giữ đây là tên riêng của Đức Chúa Trời chứ không thay bằng danh xưng 'Chúa'; chọn dạng đã quen thuộc và dễ đọc đối với độc giả tiếng Việt.
- issue: Phạm vi của lời mô tả sự hủy diệt
  choice: không để lại cho ông một người sống sót nào
  alternative: không còn lại cho ông một người sống sót nào
  rationale: Giữ nguyên mức độ toàn diện và nghiêm khắc của lời kể chiến trận, không thêm lời giải thích thần học hay giảm nhẹ ý nghĩa.
- issue: Đối tượng của וַנַּכֵּהוּ
  choice: đánh họ
  alternative: đánh ông
  rationale: Hậu tố Hê-bơ-rơ là số ít và có thể quy chiếu đến Óc theo nghĩa đại diện; tiếng Việt dùng 'họ' để làm rõ rằng hành động bao gồm cả vua lẫn toàn dân vừa được nhắc đến, phù hợp với mệnh đề về người sống sót.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phó ... vào tay” để bảo tồn hình ảnh Hê-bơ-rơ; dùng “toàn dân” thay vì thu hẹp thành “toàn quân”. Mọi dấu chú thích trong bản văn đều có mục chú thích tương ứng.
