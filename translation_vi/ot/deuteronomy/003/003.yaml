- from: Vậy, Giê-hô-va Đức Chúa Trời của chúng ta cũng phó Óc, vua Ba-san, cùng toàn dân của ông vào tay chúng ta. Chúng ta đánh họ cho đến khi không để lại cho ông một người sống sót nào.[a]
  to: Vậy, Giê-hô-va Đức Chúa Trời của chúng ta cũng phó Óc, vua Ba-san, cùng toàn dân của ông vào tay chúng ta. Chúng ta đánh bại ông, cho đến khi ông không còn một người sống sót nào.[a]
