    issue: “đã lấy”
    rationale: Wayyiqtol וַנִּקַּח kể một hành động quá khứ trong mạch tự sự, không đòi hỏi sắc thái hoàn thành trước một mốc quá khứ khác mà “đã” thường gợi ra trong tiếng Việt.
  - severity: low
    issue: “khỏi tay hai vua”
    rationale: Không sai, nhưng “từ tay hai vua” là kết hợp từ tự nhiên hơn trong tiếng Việt và vẫn phản ánh מִיַּד, thành ngữ về quyền sở hữu/kiểm soát.
  - severity: low
    issue: Diễn giải từ נחל trong chú thích
    rationale: Nên tránh gợi ý rằng địa hình này nhất thiết có dòng nước; từ Hê-bơ-rơ có phổ nghĩa gồm wadi/khe, lòng suối và thung lũng.
