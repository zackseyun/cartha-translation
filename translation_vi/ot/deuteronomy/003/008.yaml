base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: vi
  text: Vào thời ấy, chúng ta lấy được vùng đất từ tay hai vua người A-mô-rít ở bên kia sông Giô-đanh, từ khe Ác-nôn[a] cho đến núi Hẹc-môn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thung lũng Ác-nôn” hoặc “suối Ác-nôn”; từ Hê-bơ-rơ נחל có thể chỉ một khe (wadi), lòng suối hoặc thung lũng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: chúng ta đã lấy
  rationale: Động từ לקח ở thể Qal thuật lại việc dân Y-sơ-ra-ên lấy được lãnh thổ. “Đã lấy” giữ nghĩa rộng của nguyên ngữ, không tự ý nhấn mạnh sắc thái quân sự như “đánh chiếm” hay “chiếm đoạt”.
- source_word: בָּעֵת הַהִוא
  choice: vào thời ấy
  rationale: Cách diễn đạt thời gian tự nhiên, trang trọng và giữ nguyên mối liên hệ với phần tường thuật trước.
- source_word: הָאָרֶץ
  choice: vùng đất
  rationale: Ở đây אֶרֶץ chỉ một lãnh thổ xác định, không phải toàn thể trái đất; “vùng đất” diễn đạt rõ phạm vi địa lý.
- source_word: מִיַּד
  choice: khỏi tay
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ “từ tay”, tức là ra khỏi quyền sở hữu hoặc kiểm soát của hai vua, đồng thời vẫn dễ hiểu trong tiếng Việt.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: hai vua người A-mô-rít
  rationale: Phản ánh sát cấu trúc chỉ hai vị vua thuộc dân A-mô-rít và đọc tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: ở bên kia sông Giô-đanh
  rationale: Giữ nguyên cách định vị tương đối của בְּעֵבֶר הַיַּרְדֵּן mà không áp đặt một hướng địa lý không được nói rõ trong câu.
- source_word: מִנַּחַל אַרְנֹן
  choice: từ khe Ác-nôn
  rationale: נחל có thể chỉ khe có dòng nước, lòng suối hoặc thung lũng. “Khe” là cách gọi địa hình gọn và tự nhiên, còn chú thích giữ lại các khả năng từ vựng khác.
- source_word: עַד הַר חֶרְמוֹן
  choice: cho đến núi Hẹc-môn
  rationale: עַד đánh dấu giới hạn của lãnh thổ; “cho đến” thể hiện rõ điểm tận cùng ấy.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu; các địa danh được phiên âm theo lối quen thuộc. Thành ngữ “khỏi tay” được giữ để bảo tồn hình ảnh của nguyên ngữ, còn dấu chú thích [a] được đặt ngay sau “Ác-nôn”, là từ mà chú thích giải thích.
