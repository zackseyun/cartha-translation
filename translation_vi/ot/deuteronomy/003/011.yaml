source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: vi
  text: Vì trong số những người còn sót lại của dân Rê-pha-im, chỉ còn Óc, vua Ba-san. Kìa, giường của ông là một chiếc giường bằng sắt. Chẳng phải nó ở Ráp-ba của dân Am-môn sao? Chiều dài của nó là chín cu-bít và chiều rộng là bốn cu-bít[a], theo cu-bít của một người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nguyên văn: “theo cu-bít của một người”; cũng có thể hiểu là “theo cu-bít thông thường”.'
    reason: Giữ cách dịch sát chữ trong chính văn đối với בְּאַמַּת אִישׁ, đồng thời nêu cách hiểu từ vựng khác mà không quyết định thay cho bản văn.
lexical_decisions:
- source_word: רַק ... נִשְׁאַר מִיֶּתֶר
  choice: trong số những người còn sót lại..., chỉ có... là còn sống
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý loại trừ của רַק cùng ý còn lại/sống sót của נִשְׁאַר מִיֶּתֶר, không hàm ý rằng Óc là người duy nhất từng thuộc dân ấy.
- source_word: הָרְפָאִים
  choice: dân Rê-pha-im
  rationale: Giữ tên gọi của nhóm người trong tiếng Hê-bơ-rơ thay vì diễn giải thành “người khổng lồ”; ngữ cảnh tự cho thấy vóc dáng khác thường.
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của từ Hê-bơ-rơ bằng cách diễn đạt trang trọng nhưng quen thuộc.
- source_word: עַרְשׂוֹ עֶרֶשׂ בַּרְזֶל
  choice: giường của ông là một chiếc giường bằng sắt
  rationale: Giữ sự lặp lại của danh từ và nghĩa trực tiếp “giường”; không tự ý chọn nghĩa chuyên biệt “quan tài” hay “quách”.
- source_word: הֲלֹה הִוא בְּרַבַּת בְּנֵי עַמּוֹן
  choice: Chẳng phải nó vẫn còn ở Ráp-ba của dân Am-môn sao?
  rationale: Tái hiện câu hỏi tu từ hướng người đọc đến một vật được biết đến tại Ráp-ba; “vẫn còn” làm rõ sắc thái tồn tại tại địa điểm ấy trong tiếng Việt.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: chín cu-bít ... bốn cu-bít
  rationale: Giữ đơn vị đo cổ, tránh quy đổi với độ chính xác giả tạo.
- source_word: בְּאַמַּת אִישׁ
  choice: tính theo cu-bít của người thường
  rationale: Truyền đạt nghĩa khả dĩ của thành ngữ là cu-bít thông thường của con người, đồng thời chú thích nghĩa sát chữ.
theological_decisions:
- issue: Nên dịch הָרְפָאִים là tên một nhóm người hay diễn giải là người khổng lồ
  choice: dân Rê-pha-im
  alternative: những người khổng lồ
  rationale: Hình thức Hê-bơ-rơ là tên gọi một nhóm người; dịch là “người khổng lồ” sẽ quyết định thay người đọc một cách hiểu mà bản văn chỉ gợi ý qua kích thước chiếc giường.
- issue: עֶרֶשׂ chỉ giường hay vật dùng trong mai táng
  choice: giường
  alternative: giường nằm; quan tài; quách
  rationale: Nghĩa thông thường “giường” phù hợp với việc nêu kích thước để minh họa vóc dáng của Óc; nghĩa mai táng không do chính ngữ cảnh này đòi hỏi.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng phiên âm quen thuộc trong tiếng Việt: Óc, Ba-san, Rê-pha-im, Ráp-ba, Am-môn; giữ “cu-bít” trong chính văn. Mọi dấu chú thích trong chính văn đều có mục chú thích tương ứng.'
