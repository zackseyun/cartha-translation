  revision_rationale: Bản sửa loại bỏ các bổ sung diễn giải “còn sống” và “vẫn còn”, giữ cách diễn đạt có độ mở đối với “cu-bít của một người”, và rút chú thích về đúng vấn đề văn bản. Các tên riêng, thuật ngữ Rê-pha-im, nghĩa “giường”, đơn vị cu-bít, và cấu trúc câu hỏi tu từ đều được duy trì.
