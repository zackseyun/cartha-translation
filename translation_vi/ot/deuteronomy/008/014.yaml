  edition: WLC
  text: וְ/רָ֖ם לְבָבֶ֑/ךָ וְ/שָֽׁכַחְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: vi
  text: thì lòng anh em tự cao, và anh em quên Yahweh, Đức Chúa Trời của anh em, Đấng đã đưa anh em ra khỏi xứ Ai Cập, khỏi nhà nô lệ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “khỏi cảnh nô lệ.” Cụm tiếng Hê-bơ-rơ theo sát chữ là “khỏi nhà của các nô lệ.”'
    reason: Nêu cách hiểu thành ngữ tự nhiên hơn, đồng thời giải thích cách diễn đạt cụ thể của nguyên văn.
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: lòng anh em tự cao
  rationale: Giữ hình ảnh Hê-bơ-rơ về tấm lòng được nâng cao, đồng thời dùng cách nói tiếng Việt tự nhiên để diễn tả sự kiêu ngạo. “Anh em” chuyển đại từ số ít mang tính tập thể, chỉ dân Israel, sang lối xưng hô hiện đại và dễ hiểu.
- source_word: וְשָׁכַחְתָּ
  choice: anh em quên
  rationale: Dạng động từ nằm trong chuỗi kết quả/cảnh báo của văn cảnh; thì hiện tại tiếng Việt giữ được tính khái quát mà không ép thành quá khứ hay tương lai.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt rõ quan hệ sở hữu/giao ước và phù hợp văn phong trang trọng, phổ thông.
- source_word: הַמּוֹצִיאֲךָ
  choice: Đấng đã đưa anh em ra khỏi
  rationale: Phân từ có mạo từ xác định Yahweh qua hành động giải cứu; mệnh đề quan hệ với “Đấng” tự nhiên và trang trọng trong tiếng Việt.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ra khỏi xứ Ai Cập
  rationale: Giữ đủ danh từ “xứ/đất” và diễn đạt tự nhiên chuyển động ra khỏi Ai Cập.
- source_word: מִבֵּית עֲבָדִים
  choice: khỏi nhà của những người nô lệ
  rationale: Giữ hình ảnh cụ thể “nhà” và danh từ số nhiều “những người nô lệ”, thay vì mặc nhiên trừu tượng hóa thành “cảnh nô lệ”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; “Yahweh” bảo tồn danh giao ước thay vì thay thế bằng tước hiệu.
- issue: Ý nghĩa của מִבֵּית עֲבָדִים
  choice: khỏi nhà của những người nô lệ
  alternative: khỏi cảnh nô lệ
  rationale: Bản chính giữ cách diễn đạt cụ thể và số nhiều của עֲבָדִים, còn chú thích cung cấp cách hiểu thành ngữ tự nhiên hơn mà không xóa bỏ hình ảnh nguyên văn.
- issue: Đại từ số ít mang tính tập thể
  choice: anh em
  alternative: ngươi
  rationale: Moses nói với Israel như một cộng đồng bằng ngôi thứ hai số ít. “Anh em” truyền đạt đối tượng tập thể bằng tiếng Việt hiện đại, tránh sắc thái hạ mình hoặc quá cổ của “ngươi”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; dùng “anh em” cho đại từ số ít tập thể hướng đến toàn dân Israel. Nhịp câu tiếp nối mệnh đề điều kiện của các câu trước nên mở đầu bằng “thì”.
