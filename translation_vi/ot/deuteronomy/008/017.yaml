  terminology: «Sức lực», «sức mạnh của tay ta», và «của cải này» phù hợp ngữ cảnh và không áp đặt diễn giải thần học. Chú thích về חַיִל cân bằng, nêu được lựa chọn «sự thịnh vượng» mà vẫn bảo lưu phạm vi nghĩa rộng của từ.
