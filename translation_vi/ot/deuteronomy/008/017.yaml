  text: וְ/אָמַרְתָּ֖ בִּ/לְבָבֶ֑/ךָ כֹּחִ/י֙ וְ/עֹ֣צֶם יָדִ֔/י עָ֥שָׂה לִ֖/י אֶת הַ/חַ֥יִל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: vi
  text: 'rồi nói trong lòng: “Sức lực của ta và sức mạnh của tay ta đã làm ra của cải này cho ta[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự thịnh vượng này.” Từ חַיִל trong tiếng Hê-bơ-rơ có thể chỉ của cải, nguồn lực, sức mạnh hoặc năng lực, tùy theo ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: rồi nói
  rationale: Dạng Qal hoàn thành ngôi hai số ít với liên từ, trong mạch cảnh báo, diễn tả điều người nghe có thể sẽ nói; “rồi nói” nối tự nhiên với lời cảnh báo trước đó.
- source_word: בִּלְבָבֶךָ
  choice: trong lòng
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ về suy nghĩ hoặc lời tự nhủ bên trong, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: כֹּחִי
  choice: sức lực của ta
  rationale: כֹּחַ chỉ sức mạnh, năng lực hoặc khả năng; “sức lực” phù hợp với lời tự quy thành quả cho khả năng bản thân.
- source_word: וְעֹצֶם יָדִי
  choice: và sức mạnh của tay ta
  rationale: Giữ nguyên hình ảnh “tay” trong tiếng Hê-bơ-rơ, nhấn mạnh năng lực và công sức cá nhân thay vì diễn giải hoàn toàn thành một khái niệm trừu tượng.
- source_word: עָשָׂה לִי
  choice: đã làm ra cho ta
  rationale: Động từ עשה có nghĩa cơ bản là làm hoặc tạo ra; trong ngữ cảnh này, cụm từ diễn tả việc tạo nên hay thu được của cải. Cách dịch này vừa giữ sắc thái nguồn vừa rõ nghĩa trong tiếng Việt.
- source_word: הַחַיִל הַזֶּה
  choice: của cải này
  rationale: Trong ngữ cảnh Phục Truyền Luật Lệ Ký 8 nói về sự dư dật vật chất, חַיִל phù hợp nhất với nghĩa của cải; đại từ chỉ định số ít được thể hiện bằng “này”.
theological_decisions:
- issue: Nghĩa của חַיִל trong lời cảnh báo giao ước
  choice: của cải
  alternative: sự thịnh vượng; sức mạnh; nguồn lực
  rationale: Mạch văn gần nói đến ăn no, nhà cửa, đàn gia súc, bạc vàng và tài sản gia tăng, nên “của cải” làm rõ trọng tâm vật chất mà không giới hạn từ này vào sức mạnh quân sự. Chú thích vẫn bảo lưu phạm vi nghĩa rộng của từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “nói trong lòng” giữ hình ảnh Hê-bơ-rơ; đại từ “ta” phù hợp với lời độc thoại trực tiếp. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải nghĩa.
