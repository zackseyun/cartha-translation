  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của tiếng Hê-bơ-rơ: lời tự nhủ nội tâm, sự quy công cho sức lực cá nhân và «tay» của mình, cùng «của cải này» trong bối cảnh sung túc vật chất. Tuy nhiên, trật tự trong «đã làm ra cho ta của cải này» chưa tự nhiên; đặt tân ngữ ngay sau động từ diễn đạt rõ hơn quan hệ của עָשָׂה לִי với «của cải này».'
