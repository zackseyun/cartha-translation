base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/008.yaml
  text: a land of wheat and barley[a], of vines and fig trees and pomegranates, a land of olive oil and honey,
translation:
  language: vi
  text: một xứ có lúa mì và lúa mạch, có cây nho, cây vả và lựu, một xứ có dầu ô-liu và mật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “si-rô chà là”, vì từ Hê-bơ-rơ דְּבָשׁ có thể chỉ một loại mật ngọt nói chung trong các đoạn mô tả sản vật của xứ.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: một xứ có
  rationale: Trong mạch văn, từ này mở đầu lời mô tả miền đất hứa cùng sản vật của nó. “Một xứ có” tự nhiên trong tiếng Việt và giữ được cấu trúc liệt kê.
- source_word: חִטָּה
  choice: lúa mì
  rationale: Tên gọi thông dụng và chính xác của loại ngũ cốc này.
- source_word: שְׂעֹרָה
  choice: lúa mạch
  rationale: Tên gọi chuẩn trong tiếng Việt, đồng thời kết hợp tự nhiên với “lúa mì”.
- source_word: גֶּפֶן
  choice: cây nho
  rationale: Danh từ số ít mang nghĩa tập hợp, chỉ cây nho như một loại cây trồng; “cây nho” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: תְּאֵנָה
  choice: cây vả
  rationale: Từ Hê-bơ-rơ thường chỉ cây cho quả sung/vả. “Cây vả” phản ánh dạng từ và phù hợp với cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: רִמּוֹן
  choice: lựu
  rationale: Từ có thể chỉ quả hoặc cây lựu; dùng “lựu” trong danh sách sản vật vừa tự nhiên vừa tránh xác định quá mức.
- source_word: אֶרֶץ
  choice: một xứ có
  rationale: Giữ nguyên sự lặp lại có chủ ý trong tiếng Hê-bơ-rơ để nhấn mạnh và mở ra nhóm sản vật thứ hai.
- source_word: זֵית שֶׁמֶן
  choice: dầu ô-liu
  rationale: Cụm ghép theo nghĩa đen liên kết “ô-liu” với “dầu”. “Dầu ô-liu” truyền đạt gọn và tự nhiên sản phẩm được nhắc đến, dù cụm Hê-bơ-rơ cũng có thể gợi đến cây hoặc quả ô-liu dùng làm dầu.
- source_word: דְּבָשׁ
  choice: mật
  rationale: “Mật” giữ nghĩa thông thường và tương đối rộng của từ Hê-bơ-rơ. Trong ngữ cảnh sản vật của đất, từ này cũng có thể chỉ một loại mật ngọt cô đặc, nhất là si-rô chà là; khả năng ấy được giữ trong chú thích.
