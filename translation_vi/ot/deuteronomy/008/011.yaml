source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: vi
  text: Hãy cẩn thận, kẻo ngươi quên Yahweh, Đức Chúa Trời của ngươi, do không tuân giữ các điều răn, các phán quyết và các luật lệ của Ngài[a] mà hôm nay Ta truyền cho ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến nỗi không tuân giữ các điều răn, các phán quyết và các luật lệ của Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy cẩn thận
  rationale: Công thức cảnh báo ở thể mệnh lệnh; cách diễn đạt này tự nhiên, trang trọng và giữ nguyên sức khuyên răn.
- source_word: פֶּן תִּשְׁכַּח
  choice: kẻo anh em quên
  rationale: פֶּן mở đầu nguy cơ tiêu cực cần tránh; “kẻo” truyền đạt cô đọng và đúng sắc thái cảnh báo.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ nguyên danh riêng giao ước יְהוָה dưới dạng Yahweh; אֱלֹהֶיךָ là danh xưng có hậu tố ngôi hai số ít.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: qua việc không tuân giữ
  rationale: Cụm nguyên mẫu phủ định có thể chỉ cách thức hoặc biểu hiện cụ thể của việc quên Yahweh; “qua việc” giữ mối liên hệ này mà không biến nó thành quan hệ nhân quả quá mạnh.
- source_word: מִצְוֺתָיו וּמִשְׁפָּטָיו וְחֻקֹּתָיו
  choice: các điều răn, các phán quyết và các luật lệ của Ngài
  rationale: 'Duy trì ba thuật ngữ pháp lý-giao ước riêng biệt: điều răn, phán quyết và luật lệ.'
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Giữ tính trực tiếp của lời Môi-se và sự cấp thiết của הַיּוֹם; tiếng Việt không cần thể tiếp diễn để diễn đạt phân từ hiện tại.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay bằng một tước hiệu.
- issue: Quan hệ giữa việc quên Yahweh và không tuân giữ luật pháp
  choice: qua việc không tuân giữ
  alternative: đến nỗi không tuân giữ / vì không tuân giữ
  rationale: לְבִלְתִּי שְׁמֹר có thể được hiểu là biểu hiện hoặc cách thức của việc quên, và cũng có thể đọc theo hướng kết quả. Bản chính giữ cách hiểu về cách thức, còn chú thích bảo tồn khả năng kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” diễn đạt ngôi hai giống đực số ít mang tính tập thể, chỉ dân Israel, tự nhiên hơn việc dùng “ngươi” trong tiếng Việt hiện đại.
