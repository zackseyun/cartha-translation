base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: vi
  text: Đấng đã dẫn anh em qua hoang mạc rộng lớn và đáng sợ, nơi có rắn lửa[a], bò cạp và vùng đất khô cằn, không có nước; Đấng đã khiến nước từ tảng đá cứng như đá lửa tuôn ra cho anh em,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “rắn độc”. Cụm từ Hê-bơ-rơ theo truyền thống được dịch là “rắn lửa”, có thể chỉ loài rắn mà vết cắn gây cảm giác bỏng rát.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: Đấng đã dẫn anh em
  rationale: Phân từ Hiphil có mạo từ, kèm hậu tố ngôi hai số ít mang nghĩa tập thể, được diễn đạt như một danh xưng quan hệ chỉ hành động Đức Chúa Trời đã làm; “anh em” tự nhiên hơn trong tiếng Việt hiện đại khi Môi-se nói với toàn thể dân.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: qua hoang mạc mênh mông và đáng sợ
  rationale: “Hoang mạc” chỉ vùng hoang vu, không nhất thiết là sa mạc cát; “qua” thể hiện hành trình được dẫn đi. “Mênh mông” chuyển tải độ rộng lớn, còn “đáng sợ” giữ sức nặng của נוֹרָא bằng ngôn ngữ hiện đại.
- source_word: נָחָשׁ שָׂרָף
  choice: rắn lửa
  rationale: Giữ hình ảnh truyền thống và sắc thái chưa hoàn toàn xác định của cụm Hê-bơ-rơ, có thể ám chỉ cảm giác bỏng rát do vết cắn; chú thích nêu cách hiểu khác mà không áp đặt vào chính văn.
- source_word: וְעַקְרָב
  choice: bò cạp
  rationale: Tương đương từ vựng trực tiếp và thông dụng trong tiếng Việt.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: và vùng đất khô khát, nơi không có nước
  rationale: Danh từ צִמָּאוֹן có thể chỉ sự khát hoặc tình trạng khô hạn. Trong danh sách hiểm nguy địa lý, “vùng đất khô khát” diễn đạt tự nhiên hình ảnh một nơi khô cằn, rồi mệnh đề sau xác định rằng nơi ấy không có nước.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: Đấng đã khiến nước ... tuôn ra cho anh em
  rationale: Thể Hiphil của יצא diễn tả việc làm cho nước đi ra. “Khiến nước… tuôn ra” vừa thể hiện nghĩa sai khiến vừa giữ hình ảnh cụ thể của dòng nước phát xuất từ đá.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: từ vầng đá lửa
  rationale: צוּר là khối/vầng đá; חַלָּמִישׁ là đá lửa, một loại đá rất cứng. Cách dịch giữ hình ảnh nguyên ngữ và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Bản chất của các hiểm nguy trong hoang mạc
  choice: 'Dịch thành những hiểm nguy cụ thể trong hành trình lịch sử: rắn, bò cạp và vùng đất không có nước.'
  alternative: Hiểu các hiểm nguy như những biểu tượng thuộc linh hoặc khái quát hóa thành “nguy hiểm và hạn hán”.
  rationale: Nguyên văn kể lại sự dẫn dắt và chu cấp của Đức Chúa Trời trong hành trình của Israel; không có dấu hiệu văn bản buộc phải hiểu danh sách này theo nghĩa ẩn dụ.
- issue: Ý nghĩa của “rắn lửa”
  choice: Giữ cách gọi giàu hình ảnh “rắn lửa” và giải thích khả năng chỉ loài rắn độc gây cảm giác bỏng rát trong chú thích.
  alternative: Dịch thẳng là “rắn độc” hoặc hiểu là rắn có lửa theo nghĩa đen.
  rationale: Cụm Hê-bơ-rơ cho phép liên hệ với đặc tính “bỏng cháy”, nhưng không xác định rõ đó là tên loài, màu sắc hay tác động của nọc độc; chính văn và chú thích cùng bảo toàn độ mở ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh em” để diễn đạt ngôi hai số ít mang nghĩa tập thể trong lời Môi-se nói với Israel. Hai cấu trúc “Đấng đã…” giữ tính song song của các phân từ có mạo từ trong nguyên văn. Dấu phẩy cuối câu được giữ vì câu 15 nối tiếp cấu trúc cú pháp của phân đoạn lớn hơn.
