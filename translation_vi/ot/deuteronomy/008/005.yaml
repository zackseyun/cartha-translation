    rationale: Hê-bơ-rơ dùng hậu tố ngôi hai giống đực số ít ở “lòng ngươi,” “Đức Chúa Trời của ngươi,” và “sửa dạy ngươi.” Dù số ít có thể hướng đến Israel theo nghĩa tập thể, bản dịch nên giữ số ít khi tiếng Việt có thể diễn đạt được, để không thay đổi hình thức của nguồn.
