  source_fidelity: Bản dịch phản ánh đúng cấu trúc khuyên nhủ/kết luận, thành ngữ nội tâm, phép so sánh, phép lặp của יסר, và danh riêng Yahweh. Tuy nhiên, các hậu tố ngôi hai trong nguyên ngữ đều là số ít; việc chuyển thành “anh em” làm thay đổi số ngữ pháp và không cần thiết để diễn đạt tính tập thể của người được nói đến.
  naturalness: “Sửa dạy” là cách nói tự nhiên, trang trọng và phù hợp ngữ cảnh. Câu được chỉnh để đại từ nhất quán ở số ít mà vẫn giữ văn phong Kinh Thánh hiện đại.
  terminology: “Yahweh,” “Đức Chúa Trời,” và “sửa dạy” đều thích hợp. Chú thích từ vựng trình bày đúng biên độ nghĩa của יסר.
  issues:
