  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֖ עִם לְבָבֶ֑/ךָ כִּ֗י כַּ/אֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת בְּנ֔/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מְיַסְּרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: vi
  text: 'Vậy, hãy nhận biết trong lòng mình rằng: như một người sửa dạy[a] con trai mình, Yahweh, Đức Chúa Trời của ngươi, cũng sửa dạy ngươi vậy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quở phạt” hoặc “uốn nắn”; động từ Hê-bơ-rơ có thể bao gồm cả hình phạt nhằm sửa sai lẫn sự dạy dỗ để rèn luyện.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Vậy, hãy nhận biết
  rationale: Động từ Qal hoàn thành ngôi hai số ít, nối với mạch văn bằng וְ, mang sắc thái kết luận và khuyên nhủ. “Vậy, hãy nhận biết” diễn đạt tự nhiên lực thúc giục này.
- source_word: עִם לְבָבֶךָ
  choice: trong lòng
  rationale: Thành ngữ chỉ sự nhận thức và xác tín nội tâm; “trong lòng” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: כִּי
  choice: rằng
  rationale: Từ này dẫn vào nội dung cần nhận biết, nên “rằng” rõ nghĩa hơn cách dịch theo quan hệ nguyên nhân.
- source_word: כַּאֲשֶׁר
  choice: như
  rationale: Đánh dấu phép so sánh giữa sự sửa dạy của một người đối với con trai mình và sự sửa dạy của Yahweh.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: sửa dạy
  rationale: Gốc יסר có thể bao gồm uốn nắn, rèn luyện và hình phạt nhằm sửa sai. “Sửa dạy” giữ được cả khía cạnh điều chỉnh lẫn giáo huấn; cùng một cách dịch được dùng ở cả hai lần để bảo toàn phép lặp của tiếng Hê-bơ-rơ.
- source_word: אִישׁ
  choice: một người
  rationale: Danh từ có nghĩa trực tiếp là “một người đàn ông/người”, chứ không ghi rõ “người cha”; quan hệ cha-con đã được hàm ý qua “con trai mình”.
- source_word: בְּנוֹ
  choice: con trai mình
  rationale: בֵּן chỉ cụ thể “con trai”, không phải danh từ chung “con cái”; “mình” diễn đạt tự nhiên quan hệ sở hữu đồng chủ thể trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tetragrammaton, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Đây là danh xưng giao ước đi cùng tên Yahweh. Đại từ Hê-bơ-rơ ở số ít, hướng đến Israel như một cộng đồng thống nhất; “anh em” là lối xưng hô tự nhiên, trang trọng với cộng đồng độc giả trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất sự sửa dạy của Đức Chúa Trời
  choice: sửa dạy
  alternative: quở phạt; uốn nắn
  rationale: Câu này ví hành động của Yahweh với việc một người sửa dạy con trai. “Sửa dạy” giữ được cả chiều kích sửa sai và rèn luyện, không thu hẹp ý nghĩa thành trừng phạt đơn thuần hay làm nhẹ thành chỉ dạy bảo.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất tên riêng thay vì thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “như… cũng… vậy” bảo toàn phép so sánh. “Anh em” được dùng để nói với Israel như cộng đồng, dù hình thức Hê-bơ-rơ là ngôi hai số ít mang tính tập thể.
