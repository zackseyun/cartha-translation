  terminology: Đại từ “anh em” nhất quán với lời trực tiếp ngỏ cùng cộng đồng Y-sơ-ra-ên và không áp đặt một diễn giải thần học. Các chú thích nêu đúng những khả năng từ vựng liên quan đến “áo/y phục” và nghĩa có thể là “phồng rộp” của động từ לגבי chân.
