  text: שִׂמְלָ֨תְ/ךָ֜ לֹ֤א בָֽלְתָה֙ מֵֽ/עָלֶ֔י/ךָ וְ/רַגְלְ/ךָ֖ לֹ֣א בָצֵ֑קָה זֶ֖ה אַרְבָּעִ֥ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: vi
  text: Suốt bốn mươi năm qua, áo xống của anh em không sờn rách trên người[a], và chân anh em không sưng lên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chiếc áo của anh em không sờn rách trên người.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chân anh em không bị sưng”; một số người hiểu động từ này cụ thể hơn là chân không bị phồng rộp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: áo xống của anh em
  rationale: שִׂמְלָה chỉ y phục hoặc áo ngoài; “áo xống” tự nhiên, có nghĩa tập hợp và vẫn phản ánh danh từ số ít trong tiếng Hê-bơ-rơ.
- source_word: בָלְתָה
  choice: không sờn rách
  rationale: Động từ בלה diễn tả việc trở nên cũ, mòn hoặc hư do sử dụng; “sờn rách” rõ nghĩa và hợp ngữ cảnh y phục.
- source_word: מֵעָלֶיךָ
  choice: trên người
  rationale: Cụm này sát nghĩa là “từ trên anh em”; trong ngữ cảnh y phục, “trên người” truyền đạt tự nhiên rằng áo xống không bị mòn khi họ mặc.
- source_word: וְרַגְלְךָ
  choice: và chân anh em
  rationale: Giữ danh từ số ít רֶגֶל như nguyên văn; “chân anh em” vẫn tự nhiên trong lời nói với toàn thể dân chúng.
- source_word: בָצֵקָה
  choice: không sưng lên
  rationale: Cách hiểu truyền thống và phù hợp nhất ở đây là chân bị sưng hoặc phồng; bản dịch không thu hẹp nghĩa thành “phồng rộp” vì sắc thái ấy chưa chắc chắn.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: suốt bốn mươi năm qua
  rationale: Thành ngữ thời lượng có זֶה được diễn đạt tự nhiên bằng “suốt ... năm qua”, vừa nêu khoảng thời gian liên tục vừa phản ánh sắc thái nhìn lại của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” biểu thị ngôi thứ hai số ít mang tính tập thể của lời Môi-se nói với dân Y-sơ-ra-ên. Đưa cụm thời gian lên đầu câu để câu tiếng Việt trôi chảy mà không thay đổi quan hệ ý nghĩa.
