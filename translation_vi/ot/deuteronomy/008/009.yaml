base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: vi
  text: một xứ, nơi anh em sẽ không phải ăn bánh trong cảnh túng thiếu[a] và sẽ không thiếu thứ gì; một xứ có đá có sắt, và từ những ngọn đồi của xứ ấy anh em sẽ khai thác đồng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong cảnh nghèo khó” hoặc “trong cảnh thiếu thốn.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ neḥoshet có thể chỉ đồng hoặc đồng thiếc; ở đây chọn “đồng” vì câu nói đến vật liệu được khai thác từ đồi núi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: trong cảnh túng thiếu
  rationale: Danh từ chỉ cảnh nghèo khó, thiếu thốn hay cùng quẫn. Cách diễn đạt này tự nhiên trong tiếng Việt, giữ được ý ăn bánh dưới điều kiện thiếu thốn mà không lặp nguyên cách nói của mệnh đề kế tiếp.
- source_word: לֶחֶם
  choice: bánh
  rationale: Giữ nghĩa cụ thể cơ bản của từ Hê-bơ-rơ; trong ngữ cảnh, bánh cũng có thể đại diện cho lương thực nói chung.
- source_word: תֶחְסַר כֹּל
  choice: sẽ không thiếu thứ gì
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ về sự đầy đủ hoàn toàn và giữ lực tổng quát của כֹּל.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: có đá là sắt
  rationale: 'Giữ lối nói ngắn gọn, giàu hình ảnh của nguyên văn: “đá của nó [là] sắt,” thay vì giải thích rõ thành đá chứa quặng sắt.'
- source_word: תַּחְצֹב
  choice: khai thác
  rationale: Động từ có nghĩa đẽo, đào lấy hoặc khai thác. “Khai thác” rõ ràng và tự nhiên trong tiếng Việt hiện đại đối với việc lấy kim loại từ đồi núi.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ này có thể chỉ đồng hoặc đồng thiếc. Vì ngữ cảnh nói đến vật liệu lấy từ đồi núi, “đồng” là lựa chọn chính xác hơn, bởi đồng thiếc là hợp kim không được đào trực tiếp từ đất.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số ít mang nghĩa tập thể hướng đến dân Y-sơ-ra-ên; giữ hình ảnh cô đọng “đá là sắt” của nguyên văn và dùng “đồng” để phù hợp với bối cảnh tài nguyên tự nhiên.
