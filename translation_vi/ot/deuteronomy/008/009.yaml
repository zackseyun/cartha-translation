  to: một xứ, nơi anh em sẽ không phải ăn bánh trong cảnh túng thiếu[a] và sẽ không thiếu thứ gì; một xứ có đá có sắt, và từ những ngọn đồi của xứ ấy anh em sẽ khai thác đồng[b].
  rationale: Chỉnh các chỗ gượng về cú pháp và diễn đạt hình ảnh “đá ... sắt” theo cách tiếng Việt tự nhiên hơn, không thay đổi ý nghĩa hay làm mất tính cô đọng của nguyên văn. Giữ nguyên các lựa chọn từ vựng và hai chú thích vì chúng phù hợp với nguồn Hê-bơ-rơ và audit trail tiếng Anh.
