  text: lest[a], when you have eaten and are satisfied, and have built good houses and lived in them,
translation:
  language: vi
  text: Kẻo khi anh em ăn no, khi anh em xây những ngôi nhà tốt đẹp và ở trong các nhà ấy,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: kẻo
  rationale: Từ này mở đầu một mệnh đề cảnh báo, phụ thuộc vào câu trước; “kẻo” diễn đạt tự nhiên và súc tích sắc thái đề phòng trong tiếng Việt.
- source_word: תֹּאכַל
  choice: khi anh em ăn
  rationale: Hình thái động từ là ngôi thứ hai số ít, nhưng chỉ toàn thể dân Israel như một cộng đồng. Trong chuỗi cảnh báo hướng đến tương lai, “khi anh em ăn” tự nhiên hơn cách dịch cứng theo hình thái.
- source_word: וְשָׂבָעְתָּ
  choice: 'no'
  rationale: Động từ שׂבע có thể nói đến trạng thái no đầy hoặc được thỏa mãn. Đi với “ăn”, “ăn no” là cách diễn đạt tự nhiên, trực tiếp trong tiếng Việt, còn chú thích giữ lại sắc thái rộng hơn.
- source_word: וּבָתִּים טוֹבִים
  choice: những ngôi nhà tốt đẹp
  rationale: טוֹבִים mô tả nhà cửa có chất lượng tốt trong bối cảnh sung túc. “Tốt đẹp” rõ nghĩa mà không cường điệu thành xa hoa.
- source_word: תִּבְנֶה
  choice: xây
  rationale: Tiếng Việt không cần đánh dấu hoàn thành bằng một hình thức tương ứng; động từ nối tiếp sau “khi” truyền đạt tự nhiên tình huống được hình dung trong lời cảnh báo.
- source_word: וְיָשָׁבְתָּ
  choice: và ở trong đó
  rationale: ישׁב ở đây có nghĩa là cư ngụ. “Trong đó” được bổ sung theo đối tượng “những ngôi nhà” để câu tiếng Việt tự nhiên và rõ ràng.
theological_decisions:
- issue: Đại từ ngôi thứ hai số ít chỉ tập thể Israel
  choice: anh em
  alternative: ngươi
  rationale: “Anh em” giữ cách xưng hô trực tiếp với cộng đồng giao ước bằng tiếng Việt hiện đại và trang trọng vừa phải; “ngươi” phản ánh số ít hình thức rõ hơn nhưng nay dễ tạo sắc thái cổ hoặc miệt thị. Không có khác biệt thần học nào được suy diễn từ lựa chọn ngữ pháp này.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, dễ hiểu nhưng trang trọng. Câu được giữ ở dạng chưa hoàn tất vì đây là phần tiếp nối trực tiếp của lời cảnh báo bắt đầu ở câu trước và kéo dài sang câu sau.
