review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đạt đúng mệnh đề cảnh báo lệ thuộc của פן, chủ thể ngôi hai mang nghĩa tập thể, tình trạng ăn no, việc xây nhà tốt và cư ngụ. Tuy nhiên, chuỗi động từ sau “khi” cần được liên kết rõ hơn để tránh việc “xây” bị đọc như một mệnh lệnh hoặc một mệnh đề rời.
  naturalness: “Kẻo khi anh em ăn no, xây những ngôi nhà tốt đẹp và ở trong đó” hơi gãy trong tiếng Việt hiện đại vì chủ ngữ không được nhắc lại và “ở trong đó” không quy chiếu tự nhiên đến danh từ số nhiều “những ngôi nhà”.
  terminology: “Kẻo,” “ăn no,” và “những ngôi nhà tốt đẹp” phù hợp với ngữ vực trang trọng hiện đại. Chú thích giữ được khả năng nghĩa “no đầy/được thỏa mãn” của שׂבע mà không áp đặt diễn giải thần học.
  issues:
  - severity: medium
    issue: Liên kết của chuỗi động từ sau “khi” chưa rõ.
    rationale: Trong tiếng Việt, “khi anh em ăn no, xây...” có thể bị hiểu là chuyển sang lời sai khiến. Thêm chủ ngữ và liên từ giúp biểu đạt rõ tình huống cảnh báo hướng đến tương lai trong tiếng Hê-bơ-rơ.
  - severity: low
    issue: “Ở trong đó” quy chiếu kém tự nhiên với “những ngôi nhà”.
    rationale: Dùng “ở trong các nhà ấy” làm rõ đối tượng số nhiều vốn được hiểu ngầm từ בָתִּים mà không thêm nội dung.
  revised_text: Kẻo khi anh em ăn no, khi anh em xây những ngôi nhà tốt đẹp và ở trong các nhà ấy,
