revisions:
- from: Đấng đã cho anh em ăn ma-na trong hoang mạc, là thứ tổ phụ anh em chưa từng biết, nhằm hạ anh em xuống và thử luyện anh em, để cuối cùng làm điều tốt lành cho anh em.[a]
  to: Đấng đã cho anh em ăn ma-na trong hoang mạc, thứ mà tổ phụ anh em chưa từng biết đến, để khiến anh em khiêm nhường và để thử anh em, hầu cuối cùng làm điều tốt cho anh em.[a]
  rationale: Bản sửa giữ cấu trúc mục đích ba vế và ý hướng tốt lành ở phần cuối, đồng thời dùng từ trung tính hơn cho “thử” và cách diễn đạt rõ, tự nhiên hơn cho việc làm dân khiêm nhường. Chú thích tiếp tục bảo lưu độ mở ngữ nghĩa của בְּאַחֲרִיתֶךָ mà không áp đặt một cách hiểu thần học cụ thể.
