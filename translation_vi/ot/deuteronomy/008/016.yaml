base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: vi
  text: Đấng đã cho anh em ăn ma-na trong hoang mạc, thứ mà tổ phụ anh em chưa từng biết đến, để khiến anh em khiêm nhường và để thử anh em, hầu cuối cùng làm điều tốt cho anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cuối cùng” cũng có thể dịch là “về sau” hoặc “trong kết cục của anh em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: Đấng đã cho anh em ăn
  rationale: Phân từ Hiphil của אכל mang hậu tố ngôi hai số ít, tiếp nối lời mô tả Đức Chúa Trời ở câu trước. Cách dịch này giữ sắc thái khiến/cho ăn và tạo một mệnh đề tự nhiên trong tiếng Việt.
- source_word: מָן
  choice: ma-na
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho thức ăn nơi hoang mạc.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, khô cằn; “hoang mạc” vừa trang trọng vừa phù hợp bối cảnh cuộc hành trình.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: là thứ tổ phụ anh em chưa từng biết
  rationale: Mệnh đề quan hệ bổ nghĩa cho ma-na và diễn tả rằng các thế hệ trước không hề quen biết thức ăn này.
- source_word: אֲבֹתֶיךָ
  choice: tổ phụ anh em
  rationale: Giữ hình ảnh phụ hệ của danh từ số nhiều “các cha,” đồng thời dùng cách nói tiếng Việt tự nhiên để chỉ các thế hệ cha ông.
- source_word: לְמַעַן
  choice: nhằm / để
  rationale: Hai cách diễn đạt tự nhiên này đánh dấu mục đích, tương ứng với hai lần לְמַעַן và mục đích kết quả ở cuối câu.
- source_word: עַנֹּתְךָ
  choice: hạ anh em xuống
  rationale: Piel của ענה có thể mang nghĩa làm khổ hoặc hạ xuống/khiến khiêm nhường. Cách dịch tương đối cụ thể này giữ được cả sự gian khó lẫn tác dụng làm cho Israel hạ mình, không thu hẹp thành một trạng thái nội tâm đơn thuần.
- source_word: נַסֹּתֶךָ
  choice: thử luyện anh em
  rationale: נסה nghĩa là thử, kiểm nghiệm. “Thử luyện” tự nhiên trong văn phong Kinh Thánh hiện đại và gợi đúng một phép thử có tính rèn luyện mà không phủ nhận mức độ nghiêm khắc.
- source_word: לְהֵיטִבְךָ
  choice: làm điều tốt lành cho anh em
  rationale: Hiphil của יטב có nghĩa làm điều tốt, làm lợi cho một người; cách dịch giữ rõ đối tượng được hưởng điều tốt.
- source_word: בְּאַחֲרִיתֶךָ
  choice: cuối cùng
  rationale: אַחֲרִית kèm hậu tố có thể chỉ kết cục, thời kỳ về sau hoặc hậu vận. “Cuối cùng” tự nhiên trong tiếng Việt và diễn tả kết quả tốt lành về sau; chú thích bảo lưu các khả năng sát hình thức hơn.
theological_decisions:
- issue: Mục đích của gian khó trong hoang mạc
  choice: Việc Đức Chúa Trời nuôi dưỡng, hạ xuống và thử luyện Israel được trình bày là có chủ đích, hướng đến điều tốt lành cuối cùng cho họ.
  alternative: Có thể chỉ hiểu việc hạ xuống và thử luyện như hình phạt.
  rationale: Hai mệnh đề chỉ mục đích dẫn đến לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ. Bản dịch giữ đồng thời sự nghiêm khắc của việc hạ xuống, thử luyện và ý hướng tốt lành, không xóa bỏ sức căng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “anh em” diễn đạt ngôi hai số ít tập thể hướng đến Israel. “Đấng” nối tự nhiên với chủ thể là Đức Chúa Trời trong câu trước. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
