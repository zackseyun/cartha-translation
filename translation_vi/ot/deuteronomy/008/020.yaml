  text: כַּ/גּוֹיִ֗ם אֲשֶׁ֤ר יְהוָה֙ מַאֲבִ֣יד מִ/פְּנֵי/כֶ֔ם כֵּ֖ן תֹאבֵד֑וּ/ן עֵ֚קֶב לֹ֣א תִשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: vi
  text: Như các dân tộc mà Yahweh đang diệt trừ ra khỏi trước mặt anh em, anh em cũng sẽ diệt vong như vậy, vì anh em không lắng nghe tiếng phán của Yahweh, Đức Chúa Trời của anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì anh em không vâng lời Yahweh, Đức Chúa Trời của anh em.” Thành ngữ Hê-bơ-rơ theo nghĩa đen nói đến việc “lắng nghe tiếng [của]” và thường hàm ý vâng lời.'
    reason: Nêu cách dịch động tương đương của thành ngữ שׁמע בְּקוֹל, đồng thời giải thích vì sao bản chính giữ hình ảnh “tiếng phán”.
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: Như các dân tộc
  rationale: כְּ đánh dấu sự so sánh, còn גּוֹיִם trong ngữ cảnh chỉ các dân tộc trong xứ. Cách dịch này tự nhiên và giữ cấu trúc đối ứng “Như… cũng… như vậy” của câu Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bởi Tứ Tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: מַאֲבִיד
  choice: đang diệt trừ
  rationale: Phân từ Hiphil của אבד diễn tả hành động gây cho bị diệt vong, đang diễn ra hoặc cận kề trong bối cảnh. “Diệt trừ” truyền đạt cả sự hủy diệt lẫn việc loại các dân ấy khỏi xứ.
- source_word: מִפְּנֵיכֶם
  choice: khỏi trước mặt anh em
  rationale: Giữ cả giới từ chỉ sự loại bỏ מִן và thành ngữ פָּנִים, diễn tả việc các dân bị dẹp khỏi trước Israel khi họ tiến vào xứ.
- source_word: כֵּן תֹאבֵדוּן
  choice: anh em cũng sẽ diệt vong như vậy
  rationale: כֵּן đáp lại vế so sánh mở đầu, còn Qal vị hoàn thành chưa trọn của אבד báo trước sự diệt vong của Israel. “Diệt vong” giữ liên hệ từ vựng với hành động diệt trừ ở vế trước mà không biến động từ thành thể bị động.
- source_word: עֵקֶב
  choice: vì
  rationale: Trong câu này, עֵקֶב nêu căn nguyên hoặc cơ sở của sự phán xét; “vì” là cách diễn đạt rõ và tự nhiên.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: không nghe theo tiếng
  rationale: Cách dịch giữ hình ảnh “nghe tiếng” của thành ngữ Hê-bơ-rơ đồng thời dùng “nghe theo” để truyền đạt hàm ý vâng lời. Thì hiện tại phù hợp với lời cảnh báo mang tính điều kiện và không ép động từ thành một hành vi hoàn toàn thuộc quá khứ.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của anh em
  rationale: Khi đi với Yahweh và hậu tố ngôi hai số nhiều, אֱלֹהִים chỉ Đức Chúa Trời duy nhất của Israel. “Anh em” thể hiện lời nói với cộng đồng mà vẫn tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH. Phiên âm “Yahweh” bảo tồn việc câu này gọi đích danh Đức Chúa Trời của giao ước, thay vì thay danh ấy bằng một tước hiệu.
- issue: Nên dịch שׁמע בקול là “vâng lời” hay giữ hình ảnh nghe tiếng
  choice: nghe theo tiếng
  alternative: vâng lời
  rationale: Thành ngữ bao hàm sự vâng phục nhưng nguyên văn vẫn nêu “tiếng”. Bản chính giữ cả hình ảnh lẫn hàm ý bằng “nghe theo tiếng”; chú thích nêu cách dịch động tương đương để không âm thầm thu hẹp sắc thái.
- issue: Giá trị thời/thể của לֹא תִשְׁמְעוּן trong lời cảnh báo
  choice: không nghe theo
  alternative: đã không nghe theo hoặc sẽ không nghe theo
  rationale: Động từ chưa hoàn thành có thể được hiểu trong phạm vi lời cảnh báo như hành vi tiếp diễn hoặc dự kiến. Dùng hiện tại tổng quát bảo tồn tính cảnh báo, tránh xác quyết không cần thiết rằng sự bất tuân chỉ thuộc quá khứ hay hoàn toàn ở tương lai.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi hai số nhiều chỉ toàn thể Israel, tránh sắc thái quá cổ của “các ngươi”. Cấu trúc “Như… cũng… như vậy” được giữ để phản ánh nhịp so sánh và lời cảnh báo mạnh của nguyên văn.
