revisions:
- from: Như các dân tộc mà Yahweh đang diệt trừ khỏi trước mặt anh em, anh em cũng sẽ diệt vong như vậy, vì anh em không nghe theo tiếng Yahweh, Đức Chúa Trời của anh em.[a]
  to: Như các dân tộc mà Yahweh đang diệt trừ ra khỏi trước mặt anh em, anh em cũng sẽ diệt vong như vậy, vì anh em không lắng nghe tiếng phán của Yahweh, Đức Chúa Trời của anh em.[a]
  rationale: Chỉnh sửa chỉ nhằm tăng tính tự nhiên của tiếng Việt và làm chính xác lời giải thích chú thích. Bản sửa vẫn giữ quan hệ so sánh, ý nghĩa diệt vong, danh Yahweh, và sự căng giữ nguyên văn giữa lắng nghe với vâng phục; thì của động từ phủ định vẫn được để ở dạng hiện tại tổng quát nhằm không quyết định quá mức một cách đọc đang tranh luận.
