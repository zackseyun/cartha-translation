base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: vi
  text: Anh em sẽ ăn no nê, rồi chúc tụng Yahweh, Đức Chúa Trời của anh em,[a] vì miền đất tốt đẹp mà Ngài đã ban cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chúc tụng” cũng có thể được diễn đạt là “cảm tạ” hoặc “ca ngợi”; nguyên văn Hê-bơ-rơ dùng động từ có nghĩa là “chúc tụng,” một thành ngữ chỉ việc nói tốt về Đức Chúa Trời với lòng biết ơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: Anh em sẽ ăn no nê
  rationale: Hai động từ ở ngôi thứ hai số ít chỉ toàn thể dân Israel; tiếng Việt dùng “anh em” tự nhiên hơn để nói với cộng đồng. “Ăn no nê” diễn đạt gọn và rõ hành động ăn cùng trạng thái được no đủ.
- source_word: וּבֵרַכְתָּ
  choice: rồi chúc tụng
  rationale: “Chúc tụng” giữ được thành ngữ Kinh Thánh về việc ban lời tốt đẹp cho Đức Chúa Trời, đồng thời tự nhiên và trang trọng hơn “ban phước cho” khi đối tượng là Ngài.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt quan hệ sở hữu/giao ước của dạng từ có hậu tố ngôi thứ hai số ít; viết hoa theo quy ước danh xưng chỉ Đức Chúa Trời.
- source_word: עַל
  choice: vì
  rationale: Trong cấu trúc này, giới từ nêu lý do hay cơ sở của việc chúc tụng.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: miền đất tốt đẹp
  rationale: Giữ nghĩa rộng của tính từ “tốt” và mô-típ miền đất giao ước, không thu hẹp thành màu mỡ hay dễ chịu.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: mà Ngài đã ban cho anh em
  rationale: Mệnh đề quan hệ nói về miền đất như ân ban của Đức Chúa Trời; “đã ban” thể hiện hành động hoàn tất và “Ngài” làm rõ chủ thể.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời; giữ “Yahweh” bảo tồn đặc tính danh xưng và không thay bằng tước hiệu.
- issue: Cách dịch ברך khi Đức Chúa Trời là đối tượng
  choice: chúc tụng
  alternative: cảm tạ hoặc ca ngợi
  rationale: “Chúc tụng” giữ thành ngữ Hê-bơ-rơ và phạm vi nghĩa bao gồm cả cảm tạ lẫn ca ngợi, thay vì chỉ chọn một khía cạnh.
- issue: Ngôi thứ hai số ít hướng đến Israel tập thể
  choice: anh em
  alternative: ngươi
  rationale: Dạng số ít Hê-bơ-rơ nói với Israel như một toàn thể. “Anh em” truyền đạt lời nói với cộng đồng bằng tiếng Việt hiện đại mà không dùng đại từ cổ hoặc mang sắc thái hạ mình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chuyển lời xưng hô số ít mang tính tập thể dành cho Israel; dùng “Ngài” cho Đức Chúa Trời. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
