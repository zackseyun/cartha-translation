base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: vi
  text: 'Anh em phải cẩn thận làm theo mọi điều răn[a] mà hôm nay tôi truyền cho anh em, để anh em được sống, sinh sôi đông đúc, tiến vào và chiếm hữu[b] miền đất mà Yahweh đã thề với các tổ phụ[c] của anh em.


    [a] Cũng có thể dịch: “toàn bộ điều răn.” Tiếng Hê-bơ-rơ dùng một danh từ số ít mang nghĩa tập hợp.


    [b] Cũng có thể dịch: “thừa hưởng.” Động từ Hê-bơ-rơ có thể mang nghĩa thừa hưởng hoặc chiếm hữu, tùy theo văn cảnh.


    [c] Nguyên văn Hê-bơ-rơ là “các tổ phụ của anh em,” chỉ các tổ phụ của Y-sơ-ra-ên.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn bộ điều răn.” Tiếng Hê-bơ-rơ dùng một danh từ số ít mang nghĩa tập hợp.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thừa hưởng.” Động từ Hê-bơ-rơ có thể mang nghĩa thừa hưởng hoặc chiếm hữu, tùy theo văn cảnh.'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hê-bơ-rơ là “các tổ phụ của anh em,” chỉ các tổ phụ của Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: mọi điều răn
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt tính toàn thể của cấu trúc số ít mang nghĩa tập hợp; chú thích giữ lại cách hiểu sát mặt chữ “toàn bộ điều răn.”
- source_word: מְצַוְּךָ
  choice: tôi truyền cho anh em
  rationale: “Truyền” phù hợp với hành vi ban mệnh lệnh trong văn cảnh giao ước. Đại từ “anh em” diễn đạt cộng đồng Y-sơ-ra-ên; sự chuyển đổi số ít/số nhiều trong tiếng Hê-bơ-rơ không thể hiện rõ một cách tự nhiên trong tiếng Việt.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: phải cẩn thận làm theo
  rationale: Kết hợp ý chăm chú gìn giữ/tuân thủ của שׁמר với việc thực hành của עשה, tránh lối dịch cứng “giữ để làm.”
- source_word: לְמַעַן
  choice: để
  rationale: Đánh dấu rõ quan hệ mục đích hoặc kết quả bằng cách nói tự nhiên trong tiếng Việt.
- source_word: תִּחְיוּן
  choice: được sống
  rationale: Diễn đạt trực tiếp ý sống hoặc tiếp tục tồn tại trong bối cảnh giao ước.
- source_word: וּרְבִיתֶם
  choice: sinh sôi đông đúc
  rationale: Làm rõ ý trở nên đông đảo, đồng thời giữ sắc thái quen thuộc của ngôn ngữ giao ước trong Ngũ Kinh.
- source_word: וּבָאתֶם
  choice: tiến vào
  rationale: Tự nhiên trong ngữ cảnh dân Y-sơ-ra-ên đi vào miền đất đã hứa.
- source_word: וִירִשְׁתֶּם
  choice: chiếm hữu
  rationale: Diễn đạt việc nhận và nắm quyền sở hữu miền đất; chú thích bảo lưu nghĩa khả dĩ “thừa hưởng.”
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Giữ sắc thái giao ước của miền đất được hứa, tự nhiên hơn “xứ sở” trong câu này.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: נִשְׁבַּע
  choice: đã thề ban
  rationale: “Đã thề” giữ sức nặng của lời thề giao ước; “ban” làm rõ bổ ngữ được tỉnh lược trong tiếng Hê-bơ-rơ và được xác định bởi “miền đất” trong văn cảnh.
- source_word: אֲבֹתֵיכֶם
  choice: tổ phụ anh em
  rationale: Chỉ các bậc cha ông thuộc giao ước của Y-sơ-ra-ên; chú thích nêu nghĩa sát chữ là “cha ông.”
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng giao ước; giữ “Yahweh” bảo toàn chức năng danh riêng thay vì thay bằng tước hiệu.
- issue: Phạm vi của כָּל הַמִּצְוָה
  choice: mọi điều răn
  alternative: toàn bộ điều răn
  rationale: Không quyết định rằng câu chỉ nói đến một mệnh lệnh riêng lẻ; bản dịch chính diễn đạt nghĩa tập hợp tự nhiên, còn chú thích bảo lưu hình thức số ít và cách hiểu thay thế.
- issue: Sắc thái của ירשׁ
  choice: chiếm hữu
  alternative: thừa hưởng
  rationale: Trong ngữ cảnh tiến vào miền đất, “chiếm hữu” diễn đạt kết quả trực tiếp, nhưng chú thích giữ lại sắc thái thừa hưởng để không loại bỏ chiều kích lời hứa giao ước.
- issue: Từ chỉ quan hệ אֲבֹתֵיכֶם
  choice: tổ phụ anh em
  alternative: tổ tiên anh em; cha ông anh em
  rationale: “Tổ phụ” vừa tự nhiên trong văn phong Kinh Thánh vừa chỉ rõ các bậc cha ông của giao ước mà không trung tính hóa từ ngữ nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với cộng đồng Y-sơ-ra-ên, “làm theo” để diễn đạt sự tuân hành thực tế, và giữ danh riêng “Yahweh.”
