  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh phải tuân giữ, mục đích được sống và sinh sôi, rồi tiến vào và chiếm hữu miền đất. Tuy nhiên, “Yahweh đã thề ban cho tổ phụ anh em” làm cho “ban” trở thành nội dung được nói trực tiếp với các tổ phụ; nguyên văn chỉ nói Yahweh “đã thề với các tổ phụ của anh em,” còn miền đất là đối tượng của lời thề được hiểu theo ngữ cảnh. Cần giữ cấu trúc này để tránh thêm quan hệ cú pháp không có trong câu.
  naturalness: Văn phong nhìn chung hiện đại, trang trọng và rõ ràng. “Các tổ phụ của anh em” tự nhiên và chuẩn hơn “tổ phụ anh em”; “đã thề với” cũng trôi chảy hơn trong cấu trúc câu này.
  terminology: “Điều răn,” “sinh sôi đông đúc,” “chiếm hữu,” “miền đất,” và “Yahweh” phù hợp. Chú thích về số ít tập hợp và nghĩa thay thế của ירשׁ được giữ. Chú thích c nên gọi đúng hình thức nguồn là “các tổ phụ của anh em,” thay vì diễn đạt “cha ông anh em” như một trích dẫn nguyên văn.
