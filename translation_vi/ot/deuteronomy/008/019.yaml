id: DEU.8.19
reference: Deuteronomy 8:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: vi
  text: Nếu anh em thật sự quên[a] Yahweh, Đức Chúa Trời của anh em, rồi đi theo các thần khác, phục vụ chúng và sấp mình trước chúng, thì hôm nay tôi làm chứng chống lại anh em rằng anh em chắc chắn sẽ diệt vong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ lặp ý “quên” bằng một cấu trúc nhấn mạnh, có nghĩa là “thật sự quên” hoặc “chắc chắn quên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Nếu
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện cảnh báo trong tiếng Việt; không cần giữ công thức cứng nhắc “và sẽ xảy ra rằng nếu”.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: thật sự quên
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động quên; “thật sự” giữ sắc thái nhấn mạnh mà không diễn giải quá mức thành “hoàn toàn”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh giao ước được văn bản Hê-bơ-rơ dùng, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở hữu và giao ước. “Anh em” là lối xưng hô tập thể tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: rồi đi theo
  rationale: Giữ hình ảnh đi theo và ý nghĩa chuyển sang trung thành với đối tượng khác; “rồi” làm rõ tiến trình của chuỗi hành động.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: Dịch trực tiếp tính từ “khác”; không diễn giải thành “các thần ngoại bang” khi từ ngữ ấy không có trong câu.
- source_word: וַעֲבַדְתָּם
  choice: phục vụ chúng
  rationale: Giữ nghĩa cơ bản “phục vụ” và phân biệt với động từ kế tiếp chỉ hành vi phủ phục, thay vì gộp cả hai thành “thờ phượng”.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: và sấp mình trước chúng
  rationale: Thể hiện hành động phủ phục để tỏ lòng tôn kính hay thờ lạy, đồng thời bảo toàn hình ảnh thân thể của động từ Hê-bơ-rơ.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: hôm nay tôi làm chứng chống lại anh em
  rationale: Giữ sắc thái pháp lý và đối nghịch của lời chứng; “cảnh cáo” sẽ làm yếu ý nghĩa, còn việc thêm trời đất làm chứng sẽ vượt quá nội dung câu.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: rằng anh em chắc chắn sẽ diệt vong
  rationale: Cấu trúc nguyên mẫu tuyệt đối cộng động từ hữu hạn diễn tả tính chắc chắn mạnh mẽ; “diệt vong” giữ khả năng hiểu theo kết quả không nhất thiết nêu tác nhân hủy diệt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời. Giữ “Yahweh” bảo toàn chức năng danh giao ước mà không thay bằng tước hiệu.
- issue: Quan hệ giữa phục vụ và phủ phục trước các thần khác
  choice: 'Giữ thành hai hành động riêng: “phục vụ” và “sấp mình trước”'
  alternative: Gộp hoặc dịch cả hai là “thờ phượng”
  rationale: Nguyên văn dùng hai động từ khác nhau. Cách dịch đã chọn giữ cả sự phục vụ lẫn hành vi phủ phục, không thu hẹp hay mở rộng thần học về sự thờ phượng.
- issue: Sắc thái của hậu quả אָבֹד תֹּאבֵדוּן
  choice: chắc chắn sẽ diệt vong
  alternative: chắc chắn sẽ bị tiêu diệt
  rationale: Dạng Hê-bơ-rơ nhấn mạnh sự chắc chắn của kết cục nhưng không buộc bản dịch phải nêu rõ tác nhân; “diệt vong” bảo toàn độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh em” làm đại từ tập thể dễ hiểu cho cộng đồng được Môi-se nói với; tiếng Việt không thể hiện rõ sự chuyển từ số ít ở phần đầu sang số nhiều ở phần cuối như hình thái Hê-bơ-rơ. Giữ chuỗi động từ cụ thể và sắc thái pháp lý của lời làm chứng.
