revisions:
- from: Ngài đã hạ anh em xuống, để anh em chịu đói, rồi cho anh em ăn ma-na—thứ mà anh em và tổ phụ mình chưa từng biết—nhằm khiến anh em nhận biết rằng con người[b] không chỉ sống nhờ bánh, nhưng con người sống nhờ mọi điều phát ra từ miệng Yahweh.[a]
  to: Ngài đã khiến anh em hạ mình, đã làm cho anh em đói, rồi cho anh em ăn ma-na—thứ mà anh em và tổ phụ anh em chưa từng biết—nhằm khiến anh em nhận biết rằng con người[b] không chỉ sống nhờ bánh, nhưng con người sống nhờ mọi điều phát ra từ miệng Yahweh.[a]
  rationale: Bản sửa làm rõ hai động từ sai khiến trong câu, thay cách nói chưa tự nhiên về sự khiêm hạ, và thống nhất đại từ sở hữu. Các lựa chọn then chốt còn lại, đặc biệt cách dịch rộng của “mọi điều phát ra từ miệng Yahweh,” được giữ nguyên để bảo toàn phạm vi ngữ nghĩa của nguyên văn.
  reviewer_model: gpt-5.6-terra
