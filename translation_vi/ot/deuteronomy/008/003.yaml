base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: vi
  text: Ngài đã khiến anh em hạ mình, đã làm cho anh em đói, rồi cho anh em ăn ma-na—thứ mà anh em và tổ phụ anh em chưa từng biết—nhằm khiến anh em nhận biết rằng con người[b] không chỉ sống nhờ bánh, nhưng con người sống nhờ mọi điều phát ra từ miệng Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi lời ra từ miệng Yahweh.” Cụm từ Hê-bơ-rơ có nghĩa rộng hơn riêng “lời”.'
    reason: lexical_alternative
  - marker: b
    text: “Con người” ở đây chỉ loài người nói chung, không chỉ nam giới.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: Ngài đã hạ anh em xuống
  rationale: Động từ ענה ở thể piel có thể chỉ việc làm cho khốn khó hoặc hạ xuống. Cách dịch này giữ sắc thái sửa dạy, làm cho khiêm hạ trong bối cảnh hoang mạc mà không thu hẹp nghĩa vào đau khổ thể chất.
- source_word: וַיַּרְעִבֶךָ
  choice: để anh em chịu đói
  rationale: Giữ quan hệ nhân quả và tác động của Đức Chúa Trời trong động từ hiphil, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: rồi cho anh em ăn ma-na
  rationale: Diễn đạt tự nhiên ý nghĩa sai khiến của אכל ở thể hiphil; giữ tên gọi quen thuộc của thức ăn trong hoang mạc.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: thứ mà anh em và tổ phụ mình chưa từng biết
  rationale: Ở đây ידע nói đến việc biết qua sự quen thuộc hoặc trải nghiệm. “Chưa từng biết” thể hiện tình trạng ấy trước khi được ban ma-na.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: nhằm khiến anh em nhận biết
  rationale: Giữ trực tiếp sắc thái sai khiến của ידע ở thể hiphil và mục đích giáo huấn của biến cố.
- source_word: הָאָדָם
  choice: con người
  rationale: אָדָם ở đây có nghĩa đại diện, chỉ loài người nói chung. “Con người” là cách diễn đạt hiện đại, chính xác về phạm vi và không giới hạn vào nam giới.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: không chỉ sống nhờ bánh
  rationale: Diễn đạt tự nhiên cấu trúc phủ định “không bởi riêng bánh”, đồng thời giữ sự đối lập với vế sau.
- source_word: כָּל־מוֹצָא פִי יְהוָה
  choice: mọi điều phát ra từ miệng Yahweh
  rationale: מוֹצָא có nghĩa rộng là điều phát ra hoặc đi ra. Cách dịch này tránh thu hẹp từ ngữ Hê-bơ-rơ thành riêng “lời”, đồng thời giữ hình ảnh “miệng Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: con người không chỉ sống ... nhưng con người sống
  rationale: Lặp lại “con người sống” để bảo toàn thế cân xứng và sức nhấn tu từ của nguyên văn.
theological_decisions:
- issue: Phạm vi của הָאָדָם trong lời khẳng định về sự sống
  choice: con người
  alternative: người nam; nhân loại
  rationale: Danh từ ở đây mang nghĩa đại diện cho mọi người, không chỉ nam giới. “Con người” vừa tự nhiên trong tiếng Việt vừa giữ được hình thức số ít khái quát.
- issue: Ý nghĩa của מוֹצָא פִי יְהוָה
  choice: mọi điều phát ra từ miệng Yahweh
  alternative: mọi lời ra từ miệng Yahweh
  rationale: Nguyên ngữ rộng hơn “lời” và có thể bao gồm bất cứ điều gì xuất phát từ miệng Đức Chúa Trời. Giữ cách nói rộng bảo toàn sự mơ hồ chân thực, kể cả mối liên hệ trong văn cảnh giữa mệnh lệnh và sự chu cấp của Ngài.
- issue: Sắc thái của ענה trong việc Đức Chúa Trời đối xử với Israel
  choice: hạ ... xuống
  alternative: làm khổ; khiến phải chịu khổ
  rationale: Bối cảnh nhấn mạnh sự thử luyện và dạy dỗ qua đói khát. “Hạ xuống” giữ cả nét khiêm hạ lẫn gian khó mà không khẳng định đau đớn thể chất là ý duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” thể hiện lời Môi-se nói với cộng đồng Israel; tuy nguyên văn dùng ngôi thứ hai số ít, đối tượng được nói đến có tính tập thể. Dấu gạch ngang giúp phần giải thích về ma-na rõ ràng mà không làm thay đổi quan hệ cú pháp.
