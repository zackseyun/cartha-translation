  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: vi
  text: Hãy nhớ toàn bộ chặng đường mà Yahweh, Đức Chúa Trời của anh em, đã dẫn anh em đi trong hoang mạc bốn mươi năm nay, nhằm hạ thấp anh em, thử thách anh em, để biết trong lòng anh em có gì, xem anh em có vâng giữ các điều răn của Ngài hay không.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “để bày tỏ điều gì ở trong lòng anh em.” Tiếng Hê-bơ-rơ nói sát nghĩa là “để biết điều gì ở trong lòng anh em,” và cách nói ấy được giữ trong chính văn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Hãy nhớ lại
  rationale: Trong diễn ngôn giáo huấn, dạng động từ này mang lực mệnh lệnh; “hãy nhớ lại” tự nhiên và giữ được lời khuyên truyền giao ước.
- source_word: כָּל הַדֶּרֶךְ
  choice: suốt chặng đường
  rationale: Ở đây דֶּרֶךְ chỉ toàn bộ hành trình và kinh nghiệm của Israel, không chỉ một con đường vật lý.
- source_word: הֹלִיכֲךָ
  choice: đã dẫn anh em đi
  rationale: Dạng Hiphil của הלך có nghĩa khiến đi hoặc dẫn đi; cách dịch này tự nhiên và diễn đạt sự dẫn dắt của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, không thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ quan hệ sở hữu mang tính giao ước; đại từ số nhiều phù hợp cách tiếng Việt diễn đạt lời Môi-se nói với cộng đồng Israel.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: suốt bốn mươi năm qua
  rationale: Cách nói tự nhiên trong tiếng Việt, làm rõ khoảng thời gian kéo dài đến hiện tại của diễn ngôn.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר là vùng hoang vu, ít người ở; “hoang mạc” vừa tự nhiên vừa rộng hơn nghĩa thuần túy của “sa mạc”.
- source_word: לְמַעַן
  choice: nhằm
  rationale: Diễn đạt rõ mục đích mà không nặng nề.
- source_word: עַנֹּתְךָ
  choice: hạ anh em xuống
  rationale: ענה có thể là làm khổ hoặc hạ thấp. Cách dịch này giữ sắc thái bị đưa xuống thấp qua gian khó, tránh giới hạn vào đức tính khiêm nhường.
- source_word: לְנַסֹּתְךָ
  choice: thử thách anh em
  rationale: נסה diễn tả việc thử hoặc kiểm nghiệm; “thử thách” là cách nói hiện đại và phù hợp ngữ cảnh.
- source_word: לָדַעַת
  choice: để biết
  rationale: Dịch trực tiếp động từ ידע, giữ nguyên ngôn ngữ nhân hình và sự căng thẳng thần học của nguyên văn.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: điều gì ở trong lòng anh em
  rationale: לֵבָב chỉ con người bên trong, gồm ý chí và tư tưởng; “lòng” là tương đương tự nhiên trong tiếng Việt.
- source_word: הֲתִשְׁמֹר מצותו אִם לֹא
  choice: xem anh em có vâng giữ các điều răn của Ngài hay không
  rationale: Giữ cấu trúc câu hỏi gián tiếp và diễn đạt שׁמר trong ngữ cảnh giao ước bằng “vâng giữ”.
theological_decisions:
- issue: Ngôn ngữ nhân hình trong cụm “để biết điều gì ở trong lòng anh em”
  choice: Giữ nguyên cách nói trực tiếp “để biết” trong chính văn.
  alternative: “để bày tỏ điều gì ở trong lòng anh em” hoặc “để khiến điều trong lòng anh em lộ ra”
  rationale: Nguyên văn dùng ידע, “biết”. Bản dịch không nên âm thầm giải quyết vấn đề liên quan đến sự toàn tri của Đức Chúa Trời, nhưng phải bảo tồn sự căng thẳng thần học của câu.
- issue: Sắc thái của ענה
  choice: hạ anh em xuống
  alternative: “làm cho anh em khiêm nhường” hoặc “làm anh em khổ sở”
  rationale: Động từ có thể bao gồm cả việc làm khổ và hạ thấp. “Hạ xuống” giữ được độ rộng nghĩa và liên hệ giữa gian khó với sự hạ mình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng Israel dù các hậu tố Hê-bơ-rơ ở số ít tập thể. Giữ danh Yahweh và ngôn ngữ giao ước; tránh giải thích giáo phái.
