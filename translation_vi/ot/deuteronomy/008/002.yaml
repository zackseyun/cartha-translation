revisions:
- from: Hãy nhớ lại suốt chặng đường mà Yahweh, Đức Chúa Trời của anh em, đã dẫn anh em đi trong hoang mạc suốt bốn mươi năm qua, nhằm hạ anh em xuống, thử thách anh em, để biết điều gì ở trong lòng anh em, xem anh em có vâng giữ các điều răn của Ngài hay không.[a]
  to: Hãy nhớ toàn bộ chặng đường mà Yahweh, Đức Chúa Trời của anh em, đã dẫn anh em đi trong hoang mạc bốn mươi năm nay, nhằm hạ thấp anh em, thử thách anh em, để biết trong lòng anh em có gì, xem anh em có vâng giữ các điều răn của Ngài hay không.[a]
  rationale: Đổi “hạ ... xuống” thành “hạ thấp” để phản ánh tự nhiên và chính xác hơn sắc thái của ענה trong câu. Chỉnh nhẹ trật tự từ và loại lặp từ để văn bản trôi chảy hơn, không thay đổi nghĩa, số tập thể của cách xưng hô, hay tính mơ hồ thần học của לָדַעַת (“để biết”).
  reviewer_model: gpt-5.6-terra
