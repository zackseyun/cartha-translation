source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: vi
  text: 'Vì Yahweh, Đức Chúa Trời của anh em, đang đưa anh em vào một miền đất tốt đẹp: miền đất có những dòng nước, những mạch suối và các nguồn nước sâu[a] tuôn ra ở thung lũng và miền đồi núi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những nước sâu” hoặc “nước ngầm”. Từ Hê-bơ-rơ có thể chỉ các vùng nước sâu hoặc nước ở dưới mặt đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng liên kết giải thích với lời khuyên bảo ở phần trước.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho Danh Giao Ước, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tự nhiên công thức giao ước; hậu tố ngôi hai số ít giống đực chỉ toàn dân Israel như một tập thể, nên dùng cách xưng hô cộng đồng 'anh em'.
- source_word: מְבִיאֲךָ
  choice: đang đưa anh em vào
  rationale: Phân từ diễn tả hành động đang diễn tiến hoặc sắp xảy ra, đồng thời giới từ chỉ chuyển động vào trong miền đất.
- source_word: אֶרֶץ טוֹבָה
  choice: một miền đất tốt đẹp
  rationale: Dịch trực tiếp phẩm chất của đất mà không thêm ý.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: miền đất có những dòng nước
  rationale: נַחֲלִים có thể chỉ suối, dòng nước theo mùa hoặc khe nước; 'những dòng nước' rõ nghĩa và không thu hẹp quá mức.
- source_word: עֲיָנֹת
  choice: những mạch suối
  rationale: Chỉ các nguồn nước tự nhiên; 'mạch suối' tự nhiên và gợi đúng nước phát nguyên từ lòng đất.
- source_word: וּתְהֹמֹת
  choice: các vực nước sâu
  rationale: Giữ hình ảnh về những vùng nước sâu hoặc nước ngầm, không xác định quá cụ thể cấu tạo thủy văn.
- source_word: יֹצְאִים
  choice: tuôn chảy
  rationale: Trong ngữ cảnh nước phát ra từ nguồn, cách dịch này tự nhiên hơn lối dịch sát chữ 'đi ra'.
- source_word: בַּבִּקְעָה וּבָהָר
  choice: nơi thung lũng lẫn miền đồi núi
  rationale: Hai danh từ địa hình số ít có thể mang nghĩa tập hợp; 'lẫn' diễn đạt nước xuất hiện ở cả hai dạng địa hình.
theological_decisions:
- issue: Cách thể hiện Danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự danh. Bản dịch giữ đây là tên riêng; 'Giê-hô-va' là dạng đã quen thuộc và dễ nhận biết trong tiếng Việt hiện đại.
- issue: Số của đại từ ngôi hai
  choice: anh em
  alternative: ngươi
  rationale: Tiếng Hê-bơ-rơ dùng ngôi hai số ít để nói với Israel như một cộng đồng. 'Anh em' truyền đạt đối tượng tập thể bằng lối nói tự nhiên, trang trọng, không cổ hóa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ hình ảnh thủy văn của nguyên văn, tránh thuật ngữ kỹ thuật; dùng 'miền đất' để diễn tả אֶרֶץ tự nhiên trong ngữ cảnh địa lý.
