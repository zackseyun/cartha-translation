  source_fidelity: Bản dịch phản ánh đúng mệnh lệnh có sắc thái khuyến dụ trong וְזָכַרְתָּ, sự nhấn mạnh của הוּא, và phân từ diễn tả hành động ban năng lực của Đức Chúa Trời. “Năng lực để làm ra của cải” phù hợp ngữ cảnh trực tiếp của câu 17–18. “Nhằm thực hiện giao ước” là cách diễn đạt tiếng Việt chấp nhận được cho לְמַעַן הָקִים אֶת־בְּרִיתוֹ trong ngữ cảnh Đức Chúa Trời làm cho giao ước đã thề được thành hiện thực. “Như được thấy ngày nay” chuyển tải chức năng thành ngữ כַּיּוֹם הַזֶּה mà không gán một cách giải thích giáo phái.
