  text: וְ/זָֽכַרְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ כִּ֣י ה֗וּא הַ/נֹּתֵ֥ן לְ/ךָ֛ כֹּ֖חַ לַ/עֲשׂ֣וֹת חָ֑יִל לְמַ֨עַן הָקִ֧ים אֶת בְּרִית֛/וֹ אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: vi
  text: Nhưng anh em phải nhớ Yahweh, Đức Chúa Trời của anh em, vì chính Ngài là Đấng ban cho anh em năng lực để làm ra của cải[a], nhằm thực hiện giao ước của Ngài mà Ngài đã thề với tổ phụ[b] của anh em, như được thấy ngày nay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tạo ra của cải,” “gây dựng của cải”; theo nghĩa rộng hơn: “đạt được thành công.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “các cha của anh em,” chỉ các bậc tổ phụ gắn với giao ước.
    reason: cultural_note
  - marker: c
    text: Thành ngữ Hê-bơ-rơ theo sát nghĩa là “như ngày hôm nay,” tức “như đang được chứng thực ngày nay” hoặc “như tình trạng hiện nay cho thấy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Nhưng anh em phải nhớ
  rationale: Động từ hoàn thành Qal trong lời giáo huấn mang sắc thái mệnh lệnh mạnh. “Nhưng” diễn đạt sự tương phản với việc tự nhận công ở câu trước; “phải nhớ” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ nguyên danh riêng giao ước Yahweh, đồng thời dịch אֱלֹהֶיךָ theo quan hệ giao ước. “Anh em” diễn đạt đại từ số ít tập thể mà Môi-se dùng để nói với Israel, tránh lối xưng hô “ngươi” đã cổ trong tiếng Việt phổ thông.
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: vì chính Ngài là Đấng ban cho anh em
  rationale: “Vì” giữ quan hệ nguyên nhân; “chính Ngài” phản ánh đại từ nhấn mạnh הוּא; “Đấng ban” thể hiện hành động đặc trưng, liên tục của phân từ.
- source_word: כֹּחַ
  choice: năng lực
  rationale: Từ này chỉ sức mạnh hoặc khả năng. “Năng lực” phù hợp với khả năng tạo lập của cải và không chỉ giới hạn ở sức lực thể chất.
- source_word: לַעֲשׂוֹת חָיִל
  choice: để làm ra của cải
  rationale: Trong ngữ cảnh Phục Truyền 8:17–18, thành ngữ nói đến việc có được hoặc tạo ra của cải. Cách dịch này cụ thể, dễ hiểu, còn nghĩa rộng hơn được ghi ở chú thích.
- source_word: לְמַעַן הָקִים אֶת־בְּרִיתוֹ
  choice: nhằm thực hiện giao ước của Ngài
  rationale: לְמַעַן chỉ mục đích; Hiphil הָקִים khi đi với “giao ước” có thể mang nghĩa làm cho giao ước đứng vững, được xác nhận hoặc đi vào hiệu lực. “Thực hiện” tự nhiên trong tiếng Việt và không hàm ý giao ước trước đó chưa tồn tại.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: mà Ngài đã thề với tổ phụ của anh em
  rationale: “Tổ phụ” giữ được nét quy chiếu cụ thể đến các bậc cha ông trong giao ước, thay vì dùng từ “tổ tiên” quá rộng.
- source_word: כַּיּוֹם הַזֶּה
  choice: như được thấy ngày nay
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ chỉ bằng chứng hoặc tình trạng đang hiện hữu trong ngày hôm ấy, bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Bản nguồn trực tiếp dùng danh riêng giao ước. Giữ “Yahweh” phân biệt danh này với tước hiệu và không thay nó bằng một danh xưng.
- issue: Nghĩa của חָיִל trong ngữ cảnh kinh tế
  choice: của cải
  alternative: thành công; thế lực
  rationale: Câu trước nói trực tiếp đến của cải Israel có được, nên nghĩa kinh tế nổi bật nhất; chú thích vẫn giữ phạm vi nghĩa rộng của thành ngữ.
- issue: Sắc thái của הָקִים khi dùng với giao ước
  choice: thực hiện giao ước
  alternative: thiết lập giao ước; xác nhận giao ước; làm cho giao ước đứng vững
  rationale: Động từ có thể chỉ việc xác lập, xác nhận hoặc làm ứng nghiệm giao ước. “Thực hiện” giữ trọng tâm vào việc Đức Chúa Trời đưa lời giao ước vào hiệu lực trong lịch sử mà không khẳng định quá mức chỉ một sắc thái.
- issue: Đối tượng của אֲבֹתֶיךָ
  choice: tổ phụ của anh em
  alternative: tổ tiên của anh em; các cha của anh em
  rationale: Trong ngữ cảnh giao ước, từ này hướng cụ thể đến các tổ phụ của Israel. “Tổ phụ” vừa tự nhiên vừa giữ được nét thần học-lịch sử đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” để thể hiện cách Môi-se nói với Israel như một cộng đồng dù các hình thức Hê-bơ-rơ ở số ít giống đực; tránh “ngươi” vì sắc thái cổ và xa cách. Danh Yahweh được giữ nguyên dạng chuyển tự.
