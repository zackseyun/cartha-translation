  terminology: '“Yahweh” nhất quán với quyết định dịch danh יהוה. “Đức Chúa Trời,” “giao ước,” “tổ phụ,” và đại từ tôn kính “Ngài” đều phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Các chú thích có đúng điểm neo và hữu ích: (a) nêu phạm vi thành ngữ, (b) làm rõ quy chiếu lịch sử của “các cha,” và (c) giải thích thành ngữ thời gian.'
