id: DEU.8.6
reference: Deuteronomy 8:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שָׁ֣מַרְתָּ֔ אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו וּ/לְ/יִרְאָ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: vi
  text: Vậy[a], anh em phải tuân giữ các điều răn của Yahweh, Đức Chúa Trời của anh em, bằng cách bước đi trong đường lối Ngài và kính sợ Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và anh em phải tuân giữ”; liên từ Hê-bơ-rơ có thể chỉ sự nối tiếp đơn thuần, dù trong mạch văn này nó có thể mang ý suy luận.'
    reason: lexical_alternative
  - marker: b
    text: “Kính sợ Ngài” bao hàm nỗi sợ đầy tôn kính trước Đức Chúa Trời; cũng có thể dịch là “tôn kính Ngài”, nhưng cách đó diễn đạt nhẹ hơn từ Hê-bơ-rơ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Vậy, anh em phải tuân giữ
  rationale: Động từ שׁמר trong bối cảnh giao ước mang nghĩa tuân giữ, làm theo các điều răn. Liên từ וְ được dịch là “Vậy” vì mạch văn trước đó hỗ trợ sắc thái suy luận; chú thích giữ lại khả năng hiểu đơn thuần là “Và”.
- source_word: מִצְוֺת
  choice: các điều răn
  rationale: Danh từ số nhiều chỉ những mệnh lệnh có tính giao ước và pháp lý của Đức Chúa Trời; “các điều răn” vừa chính xác vừa quen thuộc trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Danh Bốn Chữ, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Hậu tố ngôi hai số ít trong tiếng Hê-bơ-rơ hướng đến Israel như một cộng đồng thống nhất. Tiếng Việt dùng “anh em” để diễn đạt tự nhiên lời Môi-se nói với toàn dân.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: bằng cách bước đi trong đường lối Ngài
  rationale: Động từ nguyên mẫu diễn tả cách thức tuân giữ điều răn. “Bước đi trong đường lối” bảo tồn hình ảnh ẩn dụ của הלך và דרך, đồng thời vẫn rõ nghĩa trong văn phong Kinh Thánh tiếng Việt.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: và kính sợ Ngài
  rationale: ירא khi hướng về Đức Chúa Trời bao gồm cả nỗi sợ và lòng tôn kính trong sự trung thành với giao ước. “Kính sợ” giữ được hai phương diện này mà không làm nhẹ thành chỉ “tôn kính”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng, không thay bằng tước hiệu.
- issue: Ý nghĩa của ירא đối với Đức Chúa Trời
  choice: kính sợ Ngài
  alternative: tôn kính Ngài; sợ Ngài
  rationale: “Kính sợ” bảo tồn sức nặng của yếu tố sợ hãi đồng thời truyền đạt sắc thái tôn kính trong bối cảnh giao ước, không giản lược khái niệm vào một phía.
- issue: Ngôi xưng hô số ít hướng đến Israel
  choice: anh em ... của anh em
  alternative: ngươi ... của ngươi
  rationale: Tiếng Hê-bơ-rơ dùng ngôi hai giống đực số ít để nói với Israel theo tính tập thể. “Anh em” diễn đạt đối tượng cộng đồng bằng tiếng Việt hiện đại, tránh sắc thái cổ hoặc gay gắt của “ngươi”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho Israel là cộng đồng được Môi-se trực tiếp संब संब nói đến; giữ hình ảnh “bước đi trong đường lối” và danh riêng “Yahweh”. Dấu chú thích được đặt ngay sau thành phần liên quan.
