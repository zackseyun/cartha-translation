  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: vi
  text: và đàn bò cùng đàn chiên dê của anh em sinh sôi[a], bạc vàng của anh em gia tăng, và mọi thứ thuộc về anh em đều gia tăng—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “gia súc lớn và gia súc nhỏ của anh em gia tăng.” Từ Hê-bơ-rơ בקר chỉ cụ thể gia súc thuộc loài bò, còn צאן chỉ chung chiên và dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: đàn bò của anh em
  rationale: בקר chỉ chung gia súc thuộc loài bò; “đàn bò” vừa tự nhiên trong tiếng Việt vừa phân biệt với đàn gia súc nhỏ ở vế sau.
- source_word: וְצֹאנְךָ
  choice: đàn chiên dê của anh em
  rationale: צאן là danh từ tập hợp chỉ gia súc nhỏ, nhất là chiên và dê; cách dịch này làm rõ phạm vi của từ Hê-bơ-rơ mà không thu hẹp vào riêng chiên.
- source_word: יִרְבְּיוּן
  choice: sinh sôi
  rationale: Động từ רבה ở đây diễn tả sự gia tăng về số lượng; “sinh sôi” tự nhiên khi nói về vật nuôi và phù hợp với chủ ngữ số nhiều.
- source_word: וְכֶסֶף וְזָהָב
  choice: bạc và vàng
  rationale: Nguyên văn không đặt đại từ sở hữu trực tiếp trước hai danh từ; quan hệ với người sở hữu được biểu đạt qua לָךְ ở sau.
- source_word: יִרְבֶּה לָךְ
  choice: gia tăng cho anh em
  rationale: Giữ lại sắc thái hướng đến hoặc thuộc lợi ích của người nghe trong לָךְ, đồng thời diễn đạt bằng tiếng Việt hiện đại.
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: mọi thứ thuộc về anh em
  rationale: Diễn đạt gọn và sát cấu trúc sở hữu của nguyên văn, bao quát toàn bộ tài sản.
- source_word: יִרְבֶּה
  choice: đều gia tăng
  rationale: “Gia tăng” phù hợp với lời tổng kết rộng về tất cả tài sản; “đều” giúp câu tiếng Việt tự nhiên với “mọi thứ” mà không đổi nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” cho hậu tố ngôi thứ hai số ít giống đực theo cách xưng hô tập thể trong diễn từ Phục Truyền Luật Lệ Ký. Giữ nhịp liệt kê và dấu gạch ngang cuối câu vì câu tiếp tục sang câu sau.
