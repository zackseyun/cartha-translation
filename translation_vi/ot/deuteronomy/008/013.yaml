  source_fidelity: Bản dịch phân biệt đúng בקר (gia súc loài bò) với צאן (chiên và dê/gia súc nhỏ), diễn đạt đúng sự gia tăng số lượng của đàn vật nuôi, và giữ được ý tổng kết về toàn bộ tài sản. Tuy nhiên, cụm “bạc và vàng gia tăng cho anh em” tuy cố gắng phản ánh לְךָ nhưng không tự nhiên trong tiếng Việt và có thể gợi ý lợi ích dành cho người nghe hơn là tài sản của họ tăng lên. Cách “bạc vàng của anh em gia tăng” diễn đạt đúng quan hệ sở hữu/hướng đến người nghe mà không làm thay đổi nghĩa.
  naturalness: “Đàn bò và đàn chiên dê của anh em sinh sôi” và “mọi thứ thuộc về anh em đều gia tăng” phù hợp văn phong Kinh Thánh hiện đại. Thay “gia tăng cho anh em” bằng cấu trúc sở hữu trực tiếp giúp vế về bạc vàng tự nhiên, rõ nghĩa và song hành với các vế còn lại.
