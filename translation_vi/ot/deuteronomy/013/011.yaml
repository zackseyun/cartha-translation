  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: vi
  text: Hãy ném đá người ấy cho đến chết, vì người ấy đã tìm cách lôi kéo anh em lìa bỏ Yahweh[a], Đức Chúa Trời của anh em, là Đấng đã đưa anh em ra khỏi đất Ai Cập, khỏi nhà nô lệ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dẫn anh em lạc khỏi Yahweh” hoặc “xui anh em xa lìa Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “nhà nô lệ,” một công thức giao ước nhắc lại việc Israel được giải thoát khỏi ách nô lệ tại Ai Cập.'
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים וָמֵת
  choice: Hãy ném đá người ấy cho đến chết
  rationale: Diễn đạt tự nhiên trong tiếng Việt mệnh lệnh pháp lý và kết quả tử vong được nêu tường minh trong tiếng Hê-bơ-rơ; “ném đá” đã hàm ý dùng đá nên không cần lặp “bằng đá”.
- source_word: כִּי בִקֵּשׁ
  choice: vì người ấy đã tìm cách
  rationale: Giữ quan hệ nguyên nhân của כִּי và sắc thái chủ ý, mưu toan của בִקֵּשׁ mà không khẳng định nỗ lực đã thành công.
- source_word: לְהַדִּיחֲךָ מֵעַל
  choice: lôi kéo anh em lìa bỏ
  rationale: Thể hiện nghĩa gây khiến của động từ Hiphil và sự tách khỏi lòng trung thành giao ước; “lôi kéo” phù hợp ngữ cảnh dụ dỗ kín đáo ở đoạn văn hơn “xua đuổi”.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ danh riêng giao ước יהוה và dịch אֱלֹהֶיךָ bằng cách gọi trang trọng, thông dụng trong tiếng Việt. Đại từ số ít tập thể được chuyển thành “anh em” để nói với cộng đồng mà vẫn tự nhiên.
- source_word: הַמּוֹצִיאֲךָ
  choice: là Đấng đã đưa anh em ra
  rationale: Phân từ có chức năng mô tả Yahweh qua hành động giải cứu trong lịch sử; thì quá khứ phù hợp với việc ra khỏi Ai Cập.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: khỏi đất Ai Cập
  rationale: Cách nói gọn, tự nhiên và sát cụm địa lý trong nguyên văn.
- source_word: מִבֵּית עֲבָדִים
  choice: khỏi nhà nô lệ
  rationale: Giữ hình ảnh “nhà” và tình trạng nô dịch của công thức giao ước, thay vì diễn giải thành một địa danh đơn thuần.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Ngôn ngữ bội giáo trong לְהַדִּיחֲךָ מֵעַל יְהוָה
  choice: lôi kéo anh em lìa bỏ Yahweh
  alternative: dẫn anh em lạc khỏi Yahweh; xui anh em xa lìa Yahweh
  rationale: Cách dịch giữ cả tác động gây khiến lẫn sự đoạn tuyệt lòng trung thành với Yahweh, nhưng không đưa thêm thuật ngữ thần học ngoài bản văn.
- issue: Công thức מִבֵּית עֲבָדִים
  choice: khỏi nhà nô lệ
  alternative: khỏi cảnh nô lệ; khỏi nhà của những người nô lệ
  rationale: Giữ ẩn dụ nguyên văn và âm hưởng giao ước nhắc lại cuộc giải phóng khỏi Ai Cập.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. Dùng “người ấy” thay cho đại từ giới tính vì đối tượng trong ngữ cảnh có thể là nam hoặc nữ; dùng “anh em” cho ngôi thứ hai số ít mang tính tập thể, phù hợp lời nói với cộng đồng Israel. Mọi dấu chú thích đều xuất hiện trong chính văn.
