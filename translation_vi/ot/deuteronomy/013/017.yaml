base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: vi
  text: Hãy thu gom mọi chiến lợi phẩm của thành vào giữa quảng trường của thành, rồi thiêu cả thành ấy lẫn toàn bộ chiến lợi phẩm ấy bằng lửa, để làm một lễ vật thiêu trọn vẹn[a] dâng lên Đức Giê-hô-va, Đức Chúa Trời của anh em. Thành ấy sẽ trở thành một gò đổ nát mãi mãi[b]; sẽ không được xây dựng lại nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thiêu hoàn toàn cho Đức Giê-hô-va.” Từ Hê-bơ-rơ כָּלִיל có thể chỉ mức độ hoàn toàn, hoặc mang sắc thái tế tự về một vật được thiêu trọn để dâng cho Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “một gò mãi mãi,” tức một gò phế tích tồn tại lâu dài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: mọi chiến lợi phẩm của thành
  rationale: שָׁלָל chỉ tài vật thu được trong chiến tranh. “Chiến lợi phẩm” tự nhiên và chính xác hơn “đồ cướp” trong văn cảnh luật chiến tranh; lối diễn đạt “của thành” tránh đại từ sở hữu thiếu tự nhiên trong tiếng Việt.
- source_word: תִּקְבֹּץ
  choice: hãy gom
  rationale: Động từ Qal chưa hoàn thành ngôi 2 số ít mang lực mệnh lệnh trong văn luật. “Hãy gom” diễn đạt hành động tập trung mọi vật về một chỗ.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: vào giữa quảng trường
  rationale: רְחוֹב ở đây là khoảng đất công cộng rộng, thoáng trong thành, nên “quảng trường” phù hợp hơn “đường phố”.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: rồi dùng lửa thiêu
  rationale: Giữ rõ phương tiện בָאֵשׁ và mệnh lệnh thiêu hủy, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: כָּלִיל
  choice: làm lễ vật được thiêu trọn vẹn
  rationale: כָּלִיל có thể mang nghĩa trạng từ “hoàn toàn” hoặc sắc thái tế tự về vật được thiêu trọn để dâng cho Đức Chúa Trời. Bản dịch chính giữ sắc thái hiến dâng mà không đồng nhất thành phố với thuật ngữ kỹ thuật về sinh tế toàn thiêu; chú thích bảo lưu cách hiểu trạng từ.
- source_word: לַיהוָה
  choice: dâng lên Đức Giê-hô-va
  rationale: ל biểu thị sự dành riêng hoặc hiến dâng; “dâng lên” phù hợp với sắc thái tế tự của כָּלִיל. “Đức Giê-hô-va” biểu thị danh riêng יהוה theo hình thức quen thuộc trong tiếng Việt.
- source_word: תֵּל עוֹלָם
  choice: mãi là một gò đổ nát
  rationale: תֵּל là gò hay đống, trong ngữ cảnh này là gò hình thành từ phế tích; עוֹלָם nhấn mạnh tình trạng kéo dài mãi.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: không bao giờ được xây dựng lại
  rationale: Dạng Nifal diễn tả thể bị động “được xây dựng”, còn עוֹד trong câu phủ định cho nghĩa không tái diễn về sau.
theological_decisions:
- issue: Sắc thái tế tự của כָּלִיל trong lệnh thiêu thành
  choice: “làm lễ vật được thiêu trọn vẹn dâng lên Đức Giê-hô-va”
  alternative: “thiêu hoàn toàn cho Đức Giê-hô-va”
  rationale: Cụm từ đi với לַיהוָה gợi ý hành động dành trọn cho Đức Chúa Trời, không chỉ mô tả mức độ hủy diệt. Tuy vậy, vì כָּלִיל cũng có thể được hiểu theo nghĩa trạng từ, cách đọc ấy được ghi trong chú thích thay vì bị loại bỏ.
- issue: Cách thể hiện danh יהוה
  choice: “Đức Giê-hô-va”
  alternative: “CHÚA” hoặc “Yahweh”
  rationale: Dùng một danh riêng quen thuộc với độc giả Việt để phản ánh việc bản Hê-bơ-rơ có danh giao ước יהוה, thay vì âm thầm đổi thành một tước hiệu chung.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng trực tiếp, dùng từ hiện đại và dễ hiểu. “Anh em” thể hiện đại từ ngôi hai số ít giống đực hướng đến dân Y-sơ-ra-ên như một cộng đồng; mệnh lệnh được diễn đạt bằng “hãy.” Các hình ảnh cụ thể “quảng trường” và “gò đổ nát” được giữ lại.
