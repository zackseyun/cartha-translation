revisions:
- from: Hãy gom mọi chiến lợi phẩm của thành vào giữa quảng trường, rồi dùng lửa thiêu thành ấy cùng toàn bộ chiến lợi phẩm, làm lễ vật được thiêu trọn vẹn[a] dâng lên Đức Giê-hô-va, Đức Chúa Trời của anh em. Thành ấy sẽ mãi là một gò đổ nát[b] và không bao giờ được xây dựng lại.
  to: Hãy thu gom mọi chiến lợi phẩm của thành vào giữa quảng trường của thành, rồi thiêu cả thành ấy lẫn toàn bộ chiến lợi phẩm ấy bằng lửa, để làm một lễ vật thiêu trọn vẹn[a] dâng lên Đức Giê-hô-va, Đức Chúa Trời của anh em. Thành ấy sẽ trở thành một gò đổ nát mãi mãi[b]; sẽ không được xây dựng lại nữa.
  rationale: Bản sửa làm rõ rằng việc thiêu thành và chiến lợi phẩm mang sắc thái của một lễ vật được thiêu trọn vẹn dâng cho Đức Giê-hô-va, đồng thời vẫn bảo lưu trong chú thích cách hiểu כָּלִיל theo nghĩa “hoàn toàn”. Các thay đổi khác tăng độ sát với hậu tố sở hữu của “quảng trường của thành” và cải thiện văn phong luật lệ hiện đại.
