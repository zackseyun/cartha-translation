source:
  edition: WLC
  text: כִּֽי יָק֤וּם בְּ/קִרְבְּ/ךָ֙ נָבִ֔יא א֖וֹ חֹלֵ֣ם חֲל֑וֹם וְ/נָתַ֥ן אֵלֶ֛י/ךָ א֖וֹת א֥וֹ מוֹפֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: vi
  text: Nếu giữa anh em xuất hiện một nhà tiên tri hoặc một người nằm mơ, và người ấy đưa ra cho anh em một dấu lạ hoặc một điều kỳ diệu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một dấu hiệu hoặc một điềm báo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong ngữ cảnh luật theo dạng nêu trường hợp, từ này mở đầu một điều kiện còn tiếp diễn sang câu sau; “nếu” diễn đạt tự nhiên chức năng ấy.
- source_word: יָקוּם
  choice: xuất hiện
  rationale: Động từ קום ở đây nói đến việc một người như thế xuất hiện trong cộng đồng; “xuất hiện” tự nhiên trong tiếng Việt hiện đại mà không hàm ý người ấy đã được xác nhận là chân thật.
- source_word: בְּקִרְבְּךָ
  choice: giữa anh em
  rationale: Cụm từ có nghĩa là “ở giữa/ngay trong cộng đồng của anh em”; cách dịch này vừa tự nhiên vừa giữ bối cảnh cộng đồng. Đại từ Hê-bơ-rơ ở số ít nhưng chỉ toàn thể dân được ngỏ lời, nên dùng “anh em” theo nghĩa tập thể.
- source_word: נָבִיא
  choice: một nhà tiên tri
  rationale: Đây là cách gọi thông dụng, rõ nghĩa cho נָבִיא; bản dịch không phán quyết trước người này là tiên tri thật hay giả.
- source_word: אוֹ
  choice: hoặc
  rationale: Liên từ phân cách đơn giản giữa hai loại người hoặc hai hiện tượng được nêu.
- source_word: חֹלֵם חֲלוֹם
  choice: một người nằm mơ
  rationale: Cấu trúc phân từ kèm danh từ đồng gốc có nghĩa là người có chiêm bao. “Người nằm mơ” dễ hiểu, tự nhiên hơn lối dịch sát cứng “người mơ những giấc mơ”, đồng thời vẫn phân biệt người này với nhà tiên tri.
- source_word: וְנָתַן אֵלֶיךָ
  choice: và người ấy đưa ra cho anh em
  rationale: Trong chuỗi điều kiện, dạng động từ này mang ý nghĩa tiếp nối của tình huống giả định. “Đưa ra cho” phù hợp với một dấu hiệu hoặc hiện tượng được trình ra làm bằng chứng hơn là chỉ “cho” theo nghĩa trao vật.
- source_word: אוֹת
  choice: một dấu lạ
  rationale: אוֹת là dấu hiệu có tính chứng thực hoặc báo hiệu. “Dấu lạ” là cách nói Kinh Thánh quen thuộc trong tiếng Việt và phù hợp với cặp từ đi cùng מוֹפֵת.
- source_word: מוֹפֵת
  choice: một việc kỳ diệu
  rationale: מוֹפֵת chỉ một hiện tượng nổi bật gây kinh ngạc, cũng có thể mang sắc thái điềm báo. “Việc kỳ diệu” giữ sự phân biệt tương đối với “dấu lạ” mà không khẳng định nguồn gốc siêu nhiên của hiện tượng.
theological_decisions:
- issue: Bản chất của dấu lạ hoặc việc kỳ diệu do nhà tiên tri hay người nằm mơ đưa ra
  choice: Dịch trực tiếp là “một dấu lạ hoặc một việc kỳ diệu”, không xác định đó là phép lạ thật, sự lừa dối hay chỉ là lời tuyên bố.
  alternative: “một dấu hiệu hoặc một điềm báo”; hoặc “một dấu lạ hay phép mầu”
  rationale: Chính câu này chỉ nói người ấy đưa ra אוֹת hoặc מוֹפֵת, chưa giải thích nguồn gốc hay bản chất của hiện tượng. Không thêm “phép mầu” giúp tránh áp đặt phán đoán thần học mà nguyên văn chưa nêu.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để diễn đạt đối tượng tập thể mà nguyên văn Hê-bơ-rơ xưng hô bằng ngôi thứ hai số ít. Giữ nguyên cấu trúc câu điều kiện đang tiếp diễn sang câu kế tiếp và giữ dấu phẩy cuối mệnh đề theo văn cảnh.
