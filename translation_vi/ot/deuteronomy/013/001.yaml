  text: אֵ֣ת כָּל הַ/דָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם אֹת֥/וֹ תִשְׁמְר֖וּ לַ/עֲשׂ֑וֹת לֹא תֹסֵ֣ף עָלָ֔י/ו וְ/לֹ֥א תִגְרַ֖ע מִמֶּֽ/נּוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: vi
  text: Toàn bộ lời ta đang truyền cho anh em[a], anh em phải cẩn thận làm theo. Anh em không được thêm vào đó[b], cũng không được bớt khỏi đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng danh từ số ít mang nghĩa tập hợp, sát nghĩa là “toàn bộ lời”. Cũng có thể dịch là “mọi lời ta đang truyền cho anh em”.
    reason: lexical_alternative
  - marker: b
    text: Trong một số cách đánh số câu, câu này được ghi là Phục Truyền Luật Lệ Ký 12:32.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: toàn bộ lời
  rationale: Giữ danh từ số ít mang nghĩa tập hợp của tiếng Hê-bơ-rơ, đồng thời diễn đạt tự nhiên hơn trong tiếng Việt hiện đại so với cách dịch sát từng chữ.
- source_word: מְצַוֶּה
  choice: đang truyền cho
  rationale: Phân từ diễn tả hành động đang có hiệu lực; “đang truyền cho” giữ được sắc thái hiện thời và thẩm quyền của lời truyền.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: phải cẩn thận làm theo
  rationale: Diễn đạt thành ngữ chỉ việc chú tâm tuân giữ để thực hành, vừa rõ nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: לֹא תֹסֵף עָלָיו
  choice: không được thêm vào đó
  rationale: Giữ chính xác hình ảnh thêm một điều vào lời đã được truyền và thể hiện rõ lực cấm đoán.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: cũng không được bớt khỏi đó
  rationale: Phản ánh trực tiếp ý giảm bớt hoặc lấy đi khỏi điều đã được truyền, đồng thời giữ cấu trúc song song với mệnh đề trước.
- source_word: אָנֹכִי
  choice: ta
  rationale: Đại từ ngôi thứ nhất độc lập được thể hiện bằng “ta”, phù hợp lời nói có thẩm quyền của Môi-se với cộng đồng mà không cường điệu thêm ý nhấn mạnh.
theological_decisions:
- issue: Cách đánh số câu và mối liên hệ trong mạch văn
  choice: Dịch như một mệnh lệnh trọn vẹn, không đưa nội dung của câu kế tiếp vào bản văn.
  alternative: Một số truyền thống đánh số câu này là Phục Truyền Luật Lệ Ký 12:32 và gắn nó chặt hơn với phần trước.
  rationale: Bản Hê-bơ-rơ chứa một lời răn hoàn chỉnh, vừa kết nối với phần trước vừa chuyển sang luật về tiên tri giả; bản dịch chỉ thể hiện nội dung hiện có của câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; dùng “ta” cho người nói và “anh em” cho cộng đồng Ít-ra-ên, tránh lối xưng hô cổ “các ngươi”. Cấu trúc song song của hai lệnh cấm được giữ rõ.
