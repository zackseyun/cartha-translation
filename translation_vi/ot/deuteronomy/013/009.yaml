  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹא תֹאבֶ֣ה ל֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע אֵלָ֑י/ו וְ/לֹא תָח֤וֹס עֵֽינְ/ךָ֙ עָלָ֔י/ו וְ/לֹֽא תַחְמֹ֥ל וְ/לֹֽא תְכַסֶּ֖ה עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: vi
  text: Anh em không được chiều theo người ấy, cũng không được lắng nghe người ấy; mắt anh em không được thương xót người ấy,[a] không được dung tha và không được bao che người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “mắt anh em không được thương xót người ấy,” một cách nói Hê-bơ-rơ về việc không nhìn người ấy với lòng thương xót.'
    reason: cultural_note
  - marker: b
    text: Hay “che giấu người ấy”; từ Hê-bơ-rơ có thể chỉ việc giấu người ấy hoặc che giấu tội của người ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לוֹ
  choice: chiều theo người ấy
  rationale: Động từ אָבָה diễn tả sự bằng lòng, thuận theo hoặc chịu làm theo. Trong ngữ cảnh bị dụ dỗ thờ thần khác, “chiều theo” truyền đạt tự nhiên việc không chấp thuận lời dụ dỗ mà không thu hẹp nghĩa thành vâng phục hoàn toàn.
- source_word: תִשְׁמַע אֵלָיו
  choice: nghe lời người ấy
  rationale: שׁמע với אֶל có thể chỉ việc lắng nghe hoặc để tâm làm theo. “Nghe lời” phù hợp ngữ cảnh lời dụ dỗ và mạnh hơn việc chỉ nghe thấy, nhưng vẫn không nhất thiết đồng nghĩa với đã vâng phục.
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: mắt anh em không được thương xót người ấy
  rationale: Giữ lại hình ảnh trực tiếp của thành ngữ Hê-bơ-rơ có chữ “mắt”; חוּס mang nghĩa nhìn với lòng thương, thương xót hoặc tha cho.
- source_word: תַחְמֹל
  choice: không được dung tha
  rationale: חמל có thể mang nghĩa thương xót hoặc tha mạng. “Dung tha” phân biệt động từ này với חוּס ở mệnh đề trước và giữ sức nặng pháp lý của chuỗi mệnh lệnh.
- source_word: תְכַסֶּה עָלָיו
  choice: không được bao che người ấy
  rationale: Piel của כסה ở đây có nghĩa che giấu hoặc che chở cho người phạm tội. “Bao che” là cách nói Việt ngữ tự nhiên, bao hàm việc giấu người ấy hoặc che giấu hành vi phạm tội.
theological_decisions:
- issue: Giữ nguyên mức độ nghiêm khắc của ngôn ngữ tư pháp giao ước đối với người dụ dỗ bỏ đạo
  choice: 'Duy trì đầy đủ chuỗi các điều cấm trực tiếp: không chiều theo, không nghe lời, không thương xót, không dung tha và không bao che.'
  alternative: Làm nhẹ câu thành lời khuyên chỉ nên tránh xa hoặc không bảo vệ người ấy.
  rationale: Nguyên văn đặt ra một chuỗi cấm lệnh tăng tiến trong bối cảnh pháp lý. Bản dịch không làm dịu mức độ nghiêm khắc, cũng không đưa thêm cách giải thích giáo phái.
- issue: Đại từ số ít giống đực trong nguyên văn và cách xưng hô tiếng Việt
  choice: Dùng “anh em” cho ngôi thứ hai số ít tập thể và “người ấy” cho đối tượng.
  alternative: Dùng “ngươi” và “hắn”.
  rationale: “Anh em” phù hợp văn phong Kinh Thánh hiện đại, dễ hiểu và ít cổ kính hơn “ngươi”; “người ấy” giữ sắc thái trang trọng, không thêm thái độ miệt thị ngoài nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc lặp lại của năm cấm lệnh và hình ảnh “mắt… thương xót” trong nguyên văn. Dấu chấm phẩy giúp phân chia hai cặp ý mà không làm mất nhịp tích lũy của câu.
