  source_fidelity: 'Bản dịch truyền đạt đúng mệnh lệnh không giữ lại bất cứ vật nào thuộc חֵרֶם, lòng thương xót, sự thương xót, việc làm cho đông đảo, và lời thề với tổ phụ. Tuy nhiên, “Yahweh nguôi cơn thịnh nộ” làm chuyển nét nghĩa của יָשׁוּב מֵחֲרוֹן אַפּוֹ: nguyên văn nói Yahweh quay khỏi/cất cơn giận dữ dội của Ngài, không trực tiếp nói cơn giận tự nguôi. Bản sửa giữ rõ chủ thể và hướng của động từ.'
  naturalness: “Đừng để ... dính vào tay anh em” là tiếng Việt tự nhiên trong văn cảnh cấm giữ lại. “Quay khỏi cơn thịnh nộ dữ dội của Ngài” vừa trang trọng vừa rõ nghĩa hơn, dù vẫn bảo toàn cách nói hình tượng của nguyên văn ở mức tự nhiên.
  terminology: Giữ Yahweh cho יהוה, “biệt riêng để hủy diệt” cho חֵרֶם, và “tổ phụ” cho אֲבֹתֶיךָ là phù hợp. Phép lặp “lòng thương xót, thương xót” phản ánh sự nhấn mạnh gần đồng nghĩa của רַחֲמִים / רִחַם.
