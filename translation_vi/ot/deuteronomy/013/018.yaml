source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: vi
  text: 'Đừng để bất cứ thứ gì trong số những vật đã được biệt riêng để hủy diệt dính vào tay anh em[a], để Yahweh quay khỏi cơn thịnh nộ dữ dội của Ngài, ban cho anh em lòng thương xót, thương xót anh em và làm cho anh em thêm đông đảo, như Ngài đã thề với tổ phụ anh em.


    [a] Cũng có thể dịch theo lối truyền thống: “bất cứ vật gì thuộc lệnh tận diệt.” Từ Hê-bơ-rơ חֵרֶם chỉ điều đã được biệt riêng cách không thể thu hồi cho Đức Chúa Trời, thường là để hủy diệt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo lối truyền thống: “bất cứ vật gì thuộc lệnh tận diệt.” Từ Hê-bơ-rơ חֵרֶם chỉ điều đã được biệt riêng cách không thể thu hồi cho Đức Chúa Trời, thường là để hủy diệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: dính vào tay anh em
  rationale: Giữ hình ảnh cụ thể của động từ דבק và danh từ “tay,” đồng thời hàm ý không được chiếm giữ hay giữ lại vật bị cấm.
- source_word: מְאוּמָה מִן הַחֵרֶם
  choice: bất cứ vật gì trong những thứ đã bị biệt riêng để hủy diệt
  rationale: Trong câu phủ định, מְאוּמָה diễn tả sự cấm đoán tuyệt đối; חֵרֶם là vật được biệt riêng không thể thu hồi, trong ngữ cảnh này là để hủy diệt.
- source_word: יָשׁוּב ... מֵחֲרוֹן אַפּוֹ
  choice: nguôi cơn thịnh nộ
  rationale: Diễn đạt tự nhiên ý Yahweh quay khỏi cơn giận dữ dội, không quá sát theo thành ngữ thân thể “sức nóng của mũi/cơn giận.”
- source_word: וְנָתַן לְךָ רַחֲמִים וְרִחַמְךָ
  choice: ban lòng thương xót cho anh em, thương xót anh em
  rationale: Giữ phép lặp gần nghĩa giữa danh từ רַחֲמִים và động từ רחם thay vì gộp thành một ý duy nhất.
- source_word: וְהִרְבֶּךָ
  choice: làm cho anh em thêm đông đảo
  rationale: Truyền đạt thể khiến của רבה và âm hưởng lời hứa giao ước về việc gia tăng dân số.
- source_word: אֲבֹתֶיךָ
  choice: tổ phụ anh em
  rationale: Chỉ các tổ phụ thuộc dòng giao ước; “tổ phụ” tự nhiên và cụ thể hơn “tổ tiên” trong ngữ cảnh này.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng tên giao ước được biểu thị trực tiếp bởi Tứ Tự Danh, phù hợp lớp tham khảo đã kiểm định và không thay bằng một tước hiệu.
- issue: Ý nghĩa của חֵרֶם
  choice: những thứ đã bị biệt riêng để hủy diệt
  alternative: vật thuộc lệnh tận diệt; vật bị cấm
  rationale: Làm rõ rằng những vật ấy đã được dành riêng cách không thể thu hồi và trong ngữ cảnh này phải bị hủy diệt, nhưng không thêm một hệ thống giáo lý ngoài câu.
- issue: Ngôn ngữ về cơn giận của Đức Chúa Trời
  choice: Yahweh nguôi cơn thịnh nộ
  alternative: Yahweh quay khỏi sức nóng của cơn giận Ngài
  rationale: Bảo toàn tính cá vị và cường độ của cơn giận thần thượng, đồng thời diễn đạt thành ngữ Hê-bơ-rơ bằng tiếng Việt tự nhiên.
- issue: Sự lặp lại của רַחֲמִים và רחם
  choice: ban lòng thương xót ... thương xót
  alternative: rủ lòng thương xót
  rationale: Giữ sự nhấn mạnh gần đồng nghĩa của nguyên văn, dù tiếng Việt có lặp từ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “anh em” diễn đạt hậu tố ngôi hai số ít mang tính tập thể, hướng đến dân Y-sơ-ra-ên. Giữ tên Yahweh và phép lặp về lòng thương xót; dùng “thịnh nộ” để bảo toàn sắc thái mạnh của חֲרוֹן אַף.
