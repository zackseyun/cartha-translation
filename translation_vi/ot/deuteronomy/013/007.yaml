  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: vi
  text: 'Nếu người anh em của anh, tức con trai của mẹ anh, hoặc con trai hay con gái anh, hoặc người vợ anh ôm ấp[a], hoặc người bạn như chính anh[b], ngấm ngầm dụ dỗ anh rằng: “Chúng ta hãy đi phụng sự các thần khác”—những thần mà cả anh lẫn cha ông anh chưa từng biết—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “người vợ của lòng/ngực anh”, một thành ngữ chỉ người vợ trong mối thân mật gần gũi nhất.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người bạn như chính mạng sống/linh hồn anh.” Từ Hê-bơ-rơ נֶפֶשׁ có thể chỉ bản thân, mạng sống hoặc linh hồn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: dụ dỗ anh
  rationale: Động từ סות ở thể Hiphil chỉ việc dụ dỗ, xúi giục hay lôi kéo một người đi theo một đường lối. “Dụ dỗ” diễn đạt tự nhiên hành động lôi kéo vào việc thờ các thần khác.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: người anh em của anh, tức con trai của mẹ anh
  rationale: Giữ lại cấu trúc đồng vị rõ ràng của tiếng Hê-bơ-rơ và sức nhấn mạnh vào mối quan hệ ruột thịt gần gũi.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: người vợ trong vòng tay anh
  rationale: חֵיק có thể chỉ ngực, lòng hoặc nơi ôm ấp. Cách dịch này giữ hình ảnh thân mật nhưng vẫn tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: người bạn thân như chính mạng sống anh
  rationale: נֶפֶשׁ ở đây nhấn mạnh sự gắn bó sâu xa, có thể mang sắc thái mạng sống, bản thân hoặc linh hồn. “Như chính mạng sống anh” giữ được cường độ của thành ngữ mà không làm mờ tính chất quan hệ.
- source_word: בַּסֵּתֶר
  choice: bí mật
  rationale: Cụm từ có nghĩa là “trong chỗ kín/kín đáo”; dùng trạng từ “bí mật” phù hợp cú pháp và văn phong tiếng Việt.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Chúng ta hãy đi phụng sự
  rationale: Hai động từ cohortative diễn tả lời rủ rê. “Hãy đi phụng sự” giữ cả ý chuyển đi và việc phục vụ mang tính tôn giáo; “phụng sự” rộng hơn riêng hành vi thờ phượng.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: אֲחֵרִים đơn giản có nghĩa là “khác”; không diễn giải thành “ngoại bang” khi nguyên văn không dùng từ chỉ tính ngoại lai.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: những thần mà cả anh lẫn tổ phụ anh chưa từng biết
  rationale: יָדַע ở đây nói đến sự biết hay công nhận trong đời sống tôn giáo. “Cả… lẫn…” thể hiện rõ hai chủ thể, còn “chưa từng biết” chuyển đạt tự nhiên ý của thể hoàn thành phủ định.
theological_decisions:
- issue: Chuyển dịch các thành ngữ về quan hệ thân thiết mà không làm giảm sức nặng
  choice: Giữ hình ảnh và cấp độ thân mật qua “con trai của mẹ anh”, “người vợ trong vòng tay anh” và “người bạn thân như chính mạng sống anh”.
  alternative: Làm trơn thành “anh em ruột”, “người vợ yêu dấu” và “bạn thân nhất”.
  rationale: Câu này cố ý liệt kê những quan hệ gần gũi nhất để làm nổi bật mức độ nghiêm trọng của sự cám dỗ. Giữ hình ảnh Hê-bơ-rơ bảo toàn sức tu từ mà không thêm cách giải thích giáo phái.
- issue: Cách dịch עבד khi đối tượng là các thần khác
  choice: phụng sự
  alternative: thờ phượng
  rationale: עבד bao gồm việc thờ phượng nhưng có phạm vi rộng hơn là phục vụ một thần. “Phụng sự” giữ phạm vi từ vựng ấy và vẫn cho thấy bối cảnh tôn giáo.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh” phản ánh ngôi thứ hai số ít giống đực của nguyên văn mà tránh sắc thái cổ của “ngươi”. Dấu gạch ngang cuối câu được giữ vì ý câu còn tiếp sang phần kế tiếp.
