  text: הַכֵּ֣ה תַכֶּ֗ה אֶת יֹֽשְׁבֵ֛י הָ/עִ֥יר ה/הוא לְ/פִי חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧/הּ וְ/אֶת כָּל אֲשֶׁר בָּ֛/הּ וְ/אֶת בְּהֶמְתָּ֖/הּ לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: vi
  text: Ngươi nhất định phải đánh cư dân thành ấy bằng lưỡi gươm; phải tận hiến[a] thành ấy, cùng mọi thứ trong đó và súc vật của nó, để hủy diệt bằng lưỡi gươm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đặt thành ấy dưới lệnh hủy diệt”. Động từ Hê-bơ-rơ chỉ việc dành một cách không thể thu hồi cho sự hủy diệt.'
    reason: lexical_alternative
  - marker: b
    text: Sát nghĩa đen là “theo miệng gươm”, một thành ngữ có nghĩa là “bằng lưỡi gươm”. Cụm này xuất hiện hai lần trong câu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: phải đánh giết
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ cùng gốc nhấn mạnh mệnh lệnh. “Phải” truyền đạt tính bắt buộc và sức nhấn; “đánh giết” giữ ý tấn công gây chết trong ngữ cảnh có gươm.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: cư dân thành ấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại cho những người đang cư ngụ tại thành được nhắc đến.
- source_word: לְפִי חָרֶב
  choice: bằng lưỡi gươm
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ, sát nghĩa đen là “bằng miệng gươm”, đồng thời rõ nghĩa trong tiếng Việt.
- source_word: הַחֲרֵם
  choice: tận hiến ... cho sự hủy diệt
  rationale: 'Bảo toàn sắc thái kỹ thuật-thánh thiêng của חרם: đặt một vật vào tình trạng được dâng cách không thể thu hồi và bị hủy diệt, thay vì chỉ nói chung là “tiêu diệt hoàn toàn”.'
- source_word: אֹתָהּ
  choice: thành ấy
  rationale: Đại từ giống cái số ít chỉ lại הָעִיר (“thành”); lặp danh từ giúp câu tiếng Việt rõ chủ thể chịu tác động.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: cùng mọi vật trong thành
  rationale: Truyền đạt trọn phạm vi của cụm từ, bao gồm tất cả những gì hiện hữu trong thành.
- source_word: בְּהֶמְתָּהּ
  choice: súc vật của nó
  rationale: בְּהֵמָה là danh từ tập hợp chỉ gia súc hay động vật nuôi nói chung; “súc vật” không thu hẹp thành riêng bò.
- source_word: לְפִי חָרֶב
  choice: bằng lưỡi gươm
  rationale: Giữ nguyên sự lặp lại trong bản Hê-bơ-rơ để thể hiện sức nhấn và phạm vi của mệnh lệnh.
theological_decisions:
- issue: Cách dịch חרם trong bối cảnh chiến tranh và phán xét
  choice: tận hiến ... cho sự hủy diệt
  alternative: tiêu diệt hoàn toàn; đặt dưới lệnh cấm tuyệt diệt
  rationale: Cách dịch này giữ được cả sự hủy diệt toàn diện lẫn sắc thái dâng hiến mang tính thánh thiêng của thuật ngữ, mà không biến nó thành biệt ngữ khó hiểu.
- issue: Ngôn ngữ nghiêm khắc của mệnh lệnh phán xét
  choice: giữ nguyên đầy đủ sức nặng của mệnh lệnh
  alternative: làm nhẹ thành “đánh bại” hoặc một cách nói giảm khác
  rationale: Bản Hê-bơ-rơ mô tả rõ một mệnh lệnh gây chết và hủy diệt toàn diện; bản dịch không nên tự ý giảm nhẹ căng thẳng đạo đức và thần học của câu.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “ngươi” để phù hợp lời luật truyền cho cá nhân đại diện trong ngữ cảnh Phục Truyền Luật Lệ Ký. Không làm nhẹ nội dung bạo lực; thuật ngữ חרם được diễn đạt minh bạch nhưng vẫn giữ sắc thái dâng hiến dẫn đến hủy diệt.
