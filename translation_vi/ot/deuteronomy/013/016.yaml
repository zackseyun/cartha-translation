revisions:
- from: Ngươi phải đánh giết cư dân thành ấy bằng lưỡi gươm,[a] tận hiến thành ấy cho sự hủy diệt, cùng mọi vật trong thành và súc vật của nó, bằng lưỡi gươm.
  to: Ngươi nhất định phải đánh cư dân thành ấy bằng lưỡi gươm; phải tận hiến[a] thành ấy, cùng mọi thứ trong đó và súc vật của nó, để hủy diệt bằng lưỡi gươm.[b]
  rationale: Bản sửa giữ nguyên nội dung nghiêm khắc và phạm vi toàn diện của mệnh lệnh, bảo tồn sự nhấn mạnh của cấu trúc “nguyên thể tuyệt đối + động từ” bằng “nhất định phải”, và diễn đạt rõ rằng việc tận hiến để hủy diệt bao gồm thành, mọi thứ trong thành và súc vật. Hệ thống neo chú thích được chỉnh để giải thích riêng thuật ngữ חֵרֶם và thành ngữ lặp lại לְפִי חָרֶב.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:08:00Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng đối tượng, tính toàn diện và sự lặp lại của thành ngữ לְפִי חָרֶב. Tuy nhiên, “đánh giết” diễn giải động từ נכה mạnh hơn chính động từ này, dù ngữ cảnh gươm cho thấy kết quả sát hại; đồng thời cách đặt “tận hiến ... cho sự hủy diệt” cần được liên kết cú pháp rõ hơn với toàn bộ thành, mọi vật trong đó và súc vật của nó. Bản sửa giữ tính nhấn mạnh của nguyên thể tuyệt đối và sắc thái kỹ thuật của חֵרֶם mà không làm nhẹ mệnh lệnh.
  naturalness: '“Ngươi phải” phù hợp văn phong luật lệ trang trọng. Tuy nhiên, câu nháp có chuỗi bổ ngữ dài và chú thích được neo ở lần xuất hiện đầu nhưng lại nói đến cả hai lần. Bản sửa dùng cấu trúc rõ, tự nhiên hơn: “nhất định phải ...; phải ...”, đồng thời giữ lần lặp lại của “bằng lưỡi gươm”.'
  terminology: “Cư dân thành ấy” và “súc vật của nó” là những lựa chọn phù hợp. “Tận hiến ... để hủy diệt” được giữ nhưng được chú thích như một thuật ngữ chỉ việc dành không thể thu hồi cho sự hủy diệt. Chú thích thành ngữ “miệng gươm” được neo tại lần xuất hiện cuối, nơi cụm từ bao quát danh sách được nêu ngay trước đó.
  issues:
  - severity: medium
    issue: Liên kết cú pháp của “tận hiến thành ấy cho sự hủy diệt” chưa làm rõ đầy đủ rằng cụm này bao gồm thành, mọi thứ trong đó và súc vật của thành.
    rationale: 'Trong tiếng Hê-bơ-rơ, động từ הַחֲרֵם được theo sau bởi các tân ngữ nối tiếp: thành, mọi điều ở trong thành, và súc vật của nó. Câu sửa đặt ba thành phần ấy cùng trong phạm vi của mệnh lệnh “tận hiến ... để hủy diệt”.'
  - severity: low
    issue: Chú thích [a] hiện neo tại lần xuất hiện đầu của “bằng lưỡi gươm” nhưng nói rằng cụm từ xuất hiện hai lần; đồng thời không có chú thích cho thuật ngữ חֵרֶם.
    rationale: 'Tách thành hai chú thích giúp neo chú thích minh bạch: một cho “tận hiến” và một cho thành ngữ gươm, đồng thời phản ánh các điểm từ vựng trọng yếu của nguyên ngữ.'
  - severity: low
    issue: “Đánh giết” có thể bị hiểu là đã gộp nghĩa “giết” vào động từ נכה.
    rationale: Nguyên ngữ dùng “đánh” với thành ngữ “bằng lưỡi gươm”; “đánh ... bằng lưỡi gươm” giữ gần hơn kết cấu nguồn và vẫn cho thấy tính sát thương trong ngữ cảnh.
  revised_text: Ngươi nhất định phải đánh cư dân thành ấy bằng lưỡi gươm; phải tận hiến[a] thành ấy, cùng mọi thứ trong đó và súc vật của nó, để hủy diệt bằng lưỡi gươm.[b]
