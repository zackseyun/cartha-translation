  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: vi
  text: Các ngươi phải bước theo Yahweh, Đức Chúa Trời của các ngươi[a], kính sợ Ngài, tuân giữ các điều răn của Ngài, lắng nghe tiếng Ngài[b], phụng sự Ngài và gắn bó với Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nói sát nghĩa là “bước đi sau Yahweh, Đức Chúa Trời của các ngươi”, tức là đi theo Ngài.
    reason: lexical_alternative
  - marker: b
    text: “Lắng nghe tiếng Ngài” cũng có thể mang nghĩa “vâng lời Ngài”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “bám chặt lấy Ngài” hoặc “gắn chặt với Ngài”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה אֱלֹהֵיכֶם תֵּלֵכוּ
  choice: bước theo Yahweh, Đức Chúa Trời của các ngươi
  rationale: Cách dịch này giữ hình ảnh chuyển động của thành ngữ Hê-bơ-rơ ‘đi/bước sau’ nhưng vẫn diễn đạt tự nhiên ý đi theo và trung thành với Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: תִירָאוּ
  choice: kính sợ Ngài
  rationale: ‘Kính sợ’ giữ được cả sắc thái sợ hãi, kính trọng và tôn kính trong ngữ cảnh giao ước, không làm nhẹ nghĩa thành chỉ ‘tôn kính’.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: tuân giữ các điều răn của Ngài
  rationale: ‘Tuân giữ’ diễn đạt tự nhiên việc gìn giữ và thực hành các điều răn, phù hợp văn phong giao ước.
- source_word: וּבְקֹלוֹ תִּשְׁמָעוּ
  choice: lắng nghe tiếng Ngài
  rationale: Giữ hình thức diễn đạt cụ thể của nguyên văn; trong ngữ cảnh, cụm từ cũng hàm ý vâng lời, được nêu trong chú thích.
- source_word: תַעֲבֹדוּ
  choice: phụng sự Ngài
  rationale: Động từ có thể chỉ phục vụ và, khi đối tượng là Đức Chúa Trời, cũng có sắc thái thờ phượng. ‘Phụng sự’ giữ phạm vi nghĩa tương đối rộng và có sắc thái trang trọng thích hợp.
- source_word: תִדְבָּקוּן
  choice: gắn bó với Ngài
  rationale: Diễn đạt sự kết hiệp và trung thành bền chặt trong quan hệ giao ước bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH. Phiên âm ‘Yahweh’ bảo tồn việc đây là danh giao ước, không thay bằng tước hiệu.
- issue: Sắc thái của שׁמע בקול
  choice: lắng nghe tiếng Ngài
  alternative: vâng lời Ngài
  rationale: Cụm từ thường bao hàm sự vâng phục, nhưng nguyên văn trực tiếp nói đến việc nghe tiếng. Bản chính giữ hình ảnh này, còn chú thích nêu sắc thái vâng lời.
- issue: Phạm vi nghĩa của עבד khi hướng về Đức Chúa Trời
  choice: phụng sự Ngài
  alternative: thờ phượng Ngài; phục vụ Ngài
  rationale: Không thu hẹp động từ chỉ còn hoạt động nghi lễ; ‘phụng sự’ có thể bao gồm cả sự phục vụ theo giao ước lẫn thờ phượng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ số nhiều ‘các ngươi’ phản ánh lời truyền trực tiếp cho toàn dân và duy trì sắc thái giao ước. Câu giữ nhịp liệt kê của nguyên văn mà không làm mất tính tự nhiên.
