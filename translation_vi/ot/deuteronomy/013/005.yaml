  source_fidelity: 'Bản dịch truyền đạt đầy đủ chuỗi mệnh lệnh trong nguyên văn Hê-bơ-rơ: bước theo Yahweh, kính sợ Ngài, tuân giữ các điều răn, lắng nghe tiếng Ngài, phụng sự Ngài và gắn bó với Ngài. Các lựa chọn «kính sợ», «tuân giữ», «lắng nghe tiếng», và «phụng sự» bảo toàn tốt phạm vi nghĩa của các động từ gốc. Danh Yahweh được giữ nhất quán. Cần điều chỉnh chú thích c để chú thích chỉ nêu các phương án từ vựng trực tiếp, không thêm diễn giải mở rộng hơn văn bản.'
  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên trong tiếng Việt Kinh Thánh hiện đại. «Các ngươi» phù hợp với lời truyền trực tiếp số nhiều; «bước theo» giữ được hình ảnh của thành ngữ mà vẫn dễ hiểu. Nhịp liệt kê được bảo tồn.
  terminology: «Yahweh» phản ánh יהוה; «Đức Chúa Trời» diễn đạt אֱלֹהֵיכֶם theo cách dùng Việt ngữ phổ biến. «Phụng sự» không thu hẹp עבד chỉ còn nghĩa nghi lễ. «Gắn bó» là cách chuyển đạt tự nhiên cho דבק, và có thể được hỗ trợ bằng phương án sát hình ảnh hơn trong chú thích.
