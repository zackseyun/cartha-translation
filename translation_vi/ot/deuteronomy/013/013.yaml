  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי תִשְׁמַ֞ע בְּ/אַחַ֣ת עָרֶ֗י/ךָ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֥ן לְ/ךָ֛ לָ/שֶׁ֥בֶת שָׁ֖ם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: vi
  text: 'Nếu[a] tại một trong các thành mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em để cư ngụ tại đó[b], anh em nghe nói rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi”; liên từ Hê-bơ-rơ có thể mở đầu mệnh đề điều kiện hoặc mệnh đề thời gian trong văn luật pháp.'
    reason: lexical_alternative
  - marker: b
    text: Hay “để sinh sống tại đó” hoặc “để định cư tại đó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong thể thức luật nêu trường hợp, כִּי mở đầu mệnh đề điều kiện; “nếu” thể hiện tự nhiên chức năng này, dù cũng có thể hiểu theo nghĩa thời gian là “khi”.
- source_word: תִשְׁמַע
  choice: anh em nghe nói
  rationale: Ở đây שׁמע chỉ việc nhận được một tin báo, không phải hành động vâng nghe; “nghe nói” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: בְּאַחַת עָרֶיךָ
  choice: tại một trong các thành của anh em
  rationale: עִיר có thể là thành hoặc thị trấn. “Thành” phù hợp văn cảnh các khu định cư của Israel; בְּ được giữ theo nghĩa địa điểm “tại/trong” thay vì diễn giải thành “về”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước יהוה, không thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Giữ công thức giao ước và lời trực tiếp hướng đến cộng đồng Israel; “anh em” diễn đạt tự nhiên đại từ số ít mang tính tập thể trong tiếng Hê-bơ-rơ.
- source_word: נֹתֵן לְךָ
  choice: đang ban cho anh em
  rationale: Phân từ נֹתֵן trình bày hành động ban cho đang diễn tiến hoặc có tính đặc trưng; “đang ban” giữ sắc thái thể này.
- source_word: לָשֶׁבֶת שָׁם
  choice: để cư ngụ
  rationale: Động từ ישׁב ở cấu trúc chỉ mục đích nói đến việc sống hay định cư tại đó. “Cư ngụ” trang trọng vừa phải và không thu hẹp nghĩa chỉ còn hành động đến lập cư.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: לֵאמֹר dẫn vào nội dung lời báo cáo ở câu kế tiếp. Dấu hai chấm làm rõ chức năng dẫn lời trong tiếng Việt mà không cần lặp “nói rằng”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn danh ấy thay vì thay bằng tước hiệu.
- issue: Số ít tập thể trong lời xưng hô
  choice: anh em
  alternative: ngươi
  rationale: Các hậu tố và động từ Hê-bơ-rơ ở ngôi hai giống đực số ít nhưng hướng đến Israel như một cộng đồng. “Anh em” tự nhiên hơn trong tiếng Việt hiện đại; không nhằm biến đối tượng thành nhiều nhóm hay nhiều cá nhân độc lập.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải. Câu được sắp xếp lại để mệnh đề địa điểm đứng trước động từ “nghe nói”, nhờ đó tránh cấu trúc dẫn lời gượng gạo. “Anh em” diễn đạt số ít tập thể của nguyên văn theo cách dễ hiểu đối với độc giả hiện đại.
