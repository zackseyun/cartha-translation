    rationale: Động từ Qal hoàn thành của יצא nghĩa cơ bản là “đi ra”; trong ngữ cảnh này có thể diễn đạt tự nhiên là “đã xuất hiện từ giữa anh em”. “Nổi lên” dễ gợi một cuộc trỗi dậy hơn là sự xuất hiện/đi ra từ nội bộ.
  - severity: low
    issue: Chú thích a mô tả không chính xác là “Theo nghĩa đen, cụm từ...”.
    rationale: Chú thích đang giải thích sắc thái của וַיַּדִּיחוּ, một động từ Hiphil, chứ không phải nghĩa đen của một “cụm từ”. Cần điều chỉnh để chú thích chính xác và neo trực tiếp vào “đi lạc.”},{
