source:
  edition: WLC
  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: vi
  text: 'Từ giữa anh em đã xuất hiện những kẻ vô lại, và chúng đã lôi kéo cư dân thành của họ đi lạc[a], nói rằng: ‘Chúng ta hãy đi phụng sự các thần khác’—những thần mà anh em chưa từng biết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ có nghĩa là khiến người khác lìa khỏi đường đúng; trong ngữ cảnh này, bị dẫn dụ từ bỏ sự trung thành với Đức Chúa Trời.
    reason: lexical_clarification
lexical_decisions:
- source_word: יָצְאוּ
  choice: nổi lên
  rationale: Động từ Qal hoàn thành của יצא diễn tả những kẻ ấy xuất hiện từ ngay trong cộng đồng; “nổi lên” tự nhiên trong ngữ cảnh một tin báo và không nhất thiết chỉ sự di chuyển vật lý.
- source_word: אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: những kẻ vô lại
  rationale: Cụm thành ngữ theo nghĩa đen là “những con trai của sự vô dụng/xấu xa”, chỉ những người đồi bại, bất pháp; “kẻ vô lại” truyền đạt sắc thái đạo đức mà không biến Bê-li-an thành tên riêng.
- source_word: מִקִּרְבְּךָ
  choice: từ giữa anh em
  rationale: Giữ ý họ phát xuất từ bên trong cộng đồng giao ước. Đại từ Hê-bơ-rơ ở số ít nhưng chỉ cộng đồng; “anh em” phù hợp lối xưng hô cộng đồng trong tiếng Việt.
- source_word: וַיַּדִּיחוּ
  choice: lôi kéo ... đi lạc
  rationale: Thể Hiphil của נדח mang nghĩa khiến người khác lìa khỏi đường đúng, tại đây là dẫn vào sự bội đạo. “Lôi kéo ... đi lạc” giữ cả yếu tố tác động lẫn kết quả sai lạc.
- source_word: יֹשְׁבֵי עִירָם
  choice: cư dân trong thành của chúng
  rationale: Diễn đạt trực tiếp danh từ phân từ “những người cư ngụ trong thành của họ”; “cư dân” gọn và tự nhiên.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Chúng ta hãy đi phụng sự
  rationale: Hai dạng cohortative diễn tả lời rủ rê. “Phụng sự” giữ nghĩa rộng về sự phục vụ mang tính tôn giáo của עבד, không thu hẹp thành một hành vi thờ phượng riêng lẻ.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: Đây là cách chuyển ngữ trực tiếp cụm từ quen thuộc trong Phục Truyền Luật Lệ Ký; không diễn giải hẹp thành “thần ngoại bang”.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: những thần mà anh em chưa từng biết
  rationale: Lặp lại “những thần” giúp quan hệ từ rõ ràng trong tiếng Việt. “Biết” bảo toàn khả năng bao gồm sắc thái nhận biết và quan hệ, thay vì giải nghĩa quá mức.
theological_decisions:
- issue: Cách hiểu בְּנֵי בְלִיַּעַל
  choice: những kẻ vô lại
  alternative: những con trai của Bê-li-an
  rationale: Trong ngữ cảnh Hê-bơ-rơ này, cụm từ là thành ngữ chỉ hạng người đồi bại hoặc bất pháp, không buộc phải hiểu Bê-li-an là tên riêng của một hữu thể tà ác. Bản dịch tránh đưa cách nhân cách hóa về sau vào câu.
- issue: Sắc thái của יָדַע đối với “các thần khác”
  choice: chưa từng biết
  alternative: chưa từng nghe đến
  rationale: “Biết” giữ nguyên độ rộng của động từ nguồn, có thể bao gồm sự nhận biết và mối quan hệ, thay vì thu hẹp vào việc có hay không có thông tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với cộng đồng Israel, “kẻ vô lại” cho thành ngữ mang sắc thái đạo đức, và “phụng sự” để giữ trường nghĩa tôn giáo rộng của עבד.
