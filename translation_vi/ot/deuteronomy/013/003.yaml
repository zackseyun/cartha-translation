source:
  edition: WLC
  text: וּ/בָ֤א הָ/אוֹת֙ וְ/הַ/מּוֹפֵ֔ת אֲשֶׁר דִּבֶּ֥ר אֵלֶ֖י/ךָ לֵ/אמֹ֑ר נֵֽלְכָ֞ה אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים אֲשֶׁ֥ר לֹֽא יְדַעְתָּ֖/ם וְ/נָֽעָבְדֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: vi
  text: 'và dấu lạ hay phép lạ ấy xảy ra[a], như người ấy đã nói với anh em rằng: “Chúng ta hãy đi theo các thần khác mà anh em chưa biết[b], và hãy phụng thờ chúng[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và dấu lạ cùng phép lạ ấy xảy ra”; tiếng Hê-bơ-rơ dùng liên từ “và”, nhưng cặp từ này thường chỉ chung “dấu lạ hay phép lạ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mà anh em không biết”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “và hãy thờ lạy chúng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: và ... xảy ra
  rationale: Động từ בוא theo nghĩa đen là “đến”, nhưng trong ngữ cảnh một dấu lạ đã được báo trước, “xảy ra” diễn đạt tự nhiên việc điều ấy trở thành hiện thực; liên từ וּ được giữ là “và”.
- source_word: הָאוֹת
  choice: dấu lạ
  rationale: אוֹת chỉ một dấu hiệu hoặc sự kiện làm chứng. “Dấu lạ” vừa quen thuộc trong văn phong Kinh Thánh tiếng Việt vừa phù hợp với ngữ cảnh một dấu hiệu phi thường.
- source_word: וְהַמּוֹפֵת
  choice: hay phép lạ
  rationale: מוֹפֵת là việc kỳ diệu hoặc điềm lạ. Trong cặp אוֹת וּמוֹפֵת, tiếng Việt tự nhiên có thể dùng “dấu lạ hay phép lạ” để chỉ hai loại chứng nghiệm có thể được đưa ra, dù liên từ Hê-bơ-rơ theo hình thức là “và”.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: đúng như người đó đã nói với anh em
  rationale: Mệnh đề quan hệ quy chiếu về dấu lạ hoặc phép lạ đã được người ấy nói trước. “Đúng như” làm rõ mối liên hệ dự báo–ứng nghiệm vốn hàm chứa trong cú pháp mà không thêm một phán đoán thần học.
- source_word: לֵאמֹר
  choice: rằng
  rationale: “Rằng” là cách tiếng Việt tự nhiên để dẫn lời trực tiếp, thay cho lối dịch máy móc “nói rằng”.
- source_word: נֵלְכָה אַחֲרֵי
  choice: Chúng ta hãy đi theo
  rationale: Dạng khuyến dụ số nhiều được giữ bằng “chúng ta hãy”; “đi theo” bảo tồn hình ảnh Hê-bơ-rơ và ý nghĩa chuyển lòng trung thành.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: các thần khác
  rationale: Đây là cách dịch trực tiếp và tự nhiên của thành ngữ giao ước quen thuộc trong Phục Truyền Luật Lệ Ký, không mặc nhiên xác nhận địa vị thần linh thật của các đối tượng ấy.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: là những thần anh em chưa từng biết
  rationale: “Biết” giữ được độ rộng nghĩa của ידע, gồm sự quen biết hay thừa nhận, mà không giải thích quá mức. “Những thần” giúp đại từ quy chiếu rõ ràng trong tiếng Việt; “anh em” diễn đạt Israel như đối tượng tập thể dù hình thức Hê-bơ-rơ là số ít.
- source_word: וְנָעָבְדֵם
  choice: và hãy phụng thờ chúng
  rationale: Trong ngữ cảnh tôn giáo, עבד nói đến việc phục vụ một thần linh. “Phụng thờ” giữ được cả sắc thái phục vụ lẫn thờ kính; “thờ lạy” là một cách diễn đạt ngữ cảnh khác có thể chấp nhận.
theological_decisions:
- issue: Cách gọi “các thần khác” và đại từ quy chiếu
  choice: các thần khác, là những thần anh em chưa từng biết
  alternative: các thần khác, là những vị anh em chưa từng biết
  rationale: Bản dịch giữ nguyên lời dụ dỗ thờ thần khác nhưng dùng “những thần/chúng”, không tự gán nhân cách hay tính chính danh thần học vượt quá điều văn bản nói.
- issue: Sắc thái của עבד trong lời dụ dỗ
  choice: phụng thờ
  alternative: thờ lạy
  rationale: “Phụng thờ” duy trì sự căng thẳng giữa nghĩa căn bản “phục vụ” và nghĩa tôn giáo “thờ phượng”, thay vì thu hẹp động từ vào một hành vi nghi lễ riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để nói với cộng đồng Israel theo lối xưng hô tập thể, tránh “ngươi” vốn cổ và nặng sắc thái. Câu giữ liên tục với văn mạch trước bằng từ mở đầu “và”; lời trích dẫn được trình bày tự nhiên, không thêm cách giải thích giáo phái.
