source:
  edition: WLC
  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: vi
  text: nếu ngươi nghe theo tiếng của Yahweh[a], Đức Chúa Trời của ngươi, gìn giữ mọi điều răn của Ngài mà hôm nay tôi truyền cho ngươi, và làm điều ngay thẳng trong mắt Yahweh, Đức Chúa Trời của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là danh riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ.
    reason: Giúp độc giả nhận biết đây là danh riêng, không phải một tước hiệu.
lexical_decisions:
- source_word: כִּי
  choice: nếu
  rationale: Trong mạch văn, từ này mở đầu điều kiện gắn với lời hứa ở câu trước; “nếu” thể hiện rõ quan hệ ấy.
- source_word: תִשְׁמַע בְּקוֹל
  choice: nghe theo tiếng
  rationale: Cách dịch này giữ hình ảnh “tiếng” của nguyên văn, đồng thời chuyển tải sắc thái lắng nghe dẫn đến vâng phục.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Diễn đạt tự nhiên công thức giao ước; “anh em” có thể chỉ cộng đồng được ngỏ lời như một toàn thể.
- source_word: לִשְׁמֹר
  choice: gìn giữ
  rationale: Nhấn mạnh việc cẩn trọng tuân giữ các điều răn, không chỉ biết đến chúng.
- source_word: כָּל מִצְוֺתָיו
  choice: mọi điều răn của Ngài
  rationale: Giữ đầy đủ ý nghĩa pháp lý–giao ước và từ chỉ toàn thể “mọi”.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: mà hôm nay tôi truyền cho anh em
  rationale: Phản ánh hành động truyền lệnh đang diễn ra trong lời nói của Môi-se và giữ trạng ngữ “hôm nay”.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: và làm điều ngay thẳng
  rationale: “Điều ngay thẳng” giữ sắc thái đạo đức của יָשָׁר; liên từ “và” giúp câu tiếng Việt tự nhiên mà không ấn định quá mức quan hệ giữa hai cụm nguyên mẫu.
- source_word: בְּעֵינֵי
  choice: dưới mắt
  rationale: Giữ hình ảnh đánh giá theo “mắt” trong thành ngữ Hê-bơ-rơ và vẫn dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của שׁמע בקול
  choice: nghe theo tiếng
  alternative: vâng lời
  rationale: “Nghe theo tiếng” vừa hàm ý vâng phục vừa không làm mất hình ảnh thính giác và chiều kích đích thân của cách nói Hê-bơ-rơ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh em” để ngỏ lời với cộng đồng Israel như một toàn thể; “tôi” là người đang truyền dạy. Câu được giữ ở dạng mệnh đề điều kiện nối tiếp ý của câu trước.
