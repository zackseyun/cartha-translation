- from: nếu anh em nghe theo tiếng Yahweh[a], Đức Chúa Trời của anh em, gìn giữ mọi điều răn của Ngài mà hôm nay tôi truyền cho anh em, và làm điều ngay thẳng dưới mắt Yahweh, Đức Chúa Trời của anh em.
