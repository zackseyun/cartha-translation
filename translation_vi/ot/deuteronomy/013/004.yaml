  terminology: “Yahweh” bảo tồn danh riêng יהוה; “Đức Chúa Trời” phù hợp cho אֱלֹהִים. “Hết lòng và hết linh hồn” giữ được công thức giao ước cũng như tính liên văn bản của câu. Chú thích về נֶפֶשׁ là phù hợp và không áp đặt cách hiểu thần học hẹp.
