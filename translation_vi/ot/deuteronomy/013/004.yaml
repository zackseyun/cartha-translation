language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: vi
  text: Anh em không được nghe lời của nhà tiên tri ấy hay của kẻ nằm mộng ấy, vì Yahweh, Đức Chúa Trời của anh em, đang thử anh em để biết anh em có yêu Yahweh, Đức Chúa Trời của anh em, hết lòng và hết linh hồn[a] mình hay không.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “linh hồn” cũng có thể chỉ “mạng sống”, “bản thân” hoặc “toàn thể con người”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשװמַע אֶל דִּבְרֵי
  choice: không được nghe lời
  rationale: שׁמע với אֶל trong ngữ cảnh này mang nghĩa nghe theo hoặc làm theo. “Nghe lời” tự nhiên trong tiếng Việt và giữ được cả sắc thái tiếp nhận lẫn vâng theo.
- source_word: הַנָּבִיא הַהוּא
  choice: nhà tiên tri ấy
  rationale: Mạo từ kết hợp với đại từ chỉ định xác định nhân vật đã được nhắc đến; “ấy” diễn đạt rõ mà vẫn trang trọng.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: kẻ nằm mộng ấy
  rationale: Cụm gốc dùng danh từ phân từ kèm danh từ cùng gốc. Tiếng Việt “kẻ nằm mộng” giữ vai trò của người tự nhận nhận được mặc khải qua giấc mộng mà không gượng ép lặp “mộng một giấc mộng”.
- source_word: מְנַסֶּה
  choice: đang thử
  rationale: Dạng Piel phân từ diễn tả hành động thử nghiệm đang diễn ra. “Thử” rõ nghĩa, tự nhiên và không thêm ý trừng phạt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: לָדַעַת
  choice: để biết
  rationale: Giữ sát động từ nguyên ngữ và không giải thích thay biểu thức mang tính nhân hình.
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: anh em có yêu ... hay không
  rationale: Kết cấu nghi vấn với phân từ diễn tả trạng thái hoặc hành động liên tục. Cách nói hiện tại đơn là tự nhiên trong tiếng Việt và vẫn giữ ý khảo nghiệm tình yêu hiện hữu.
- source_word: בְּכָל לְבַבְכֶם
  choice: hết lòng
  rationale: Thành ngữ tiếng Việt tương ứng tự nhiên với “bằng toàn thể tấm lòng”, bao gồm nội tâm, ý chí và tình cảm.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: và hết linh hồn mình
  rationale: Giữ thuật ngữ truyền thống và mối liên văn bản của công thức giao ước, đồng thời chú thích phạm vi nghĩa rộng của נֶפֶשׁ.
theological_decisions:
- issue: Danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH; phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay bằng tước hiệu.
- issue: Cụm mang tính nhân hình “thử ... để biết”
  choice: giữ nguyên “đang thử anh em để biết”
  alternative: “thử anh em để bày tỏ/cho thấy”
  rationale: Nguyên văn nói “để biết”. Đổi thành “để bày tỏ” sẽ giải quyết một căng thẳng thần học mà bản văn không tự giải thích.
- issue: Phạm vi nghĩa của נֶפֶשׁ
  choice: linh hồn
  alternative: mạng sống / toàn thể con người
  rationale: “Linh hồn” duy trì công thức giao ước quen thuộc, nhưng chú thích cho biết từ Hê-bơ-rơ có phạm vi rộng hơn cách hiểu nhị nguyên hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “anh em” phản ánh hậu tố ngôi thứ hai số nhiều trong tiếng Hê-bơ-rơ. Dùng “Đức Chúa Trời” cho אֱלֹהִים và giữ danh riêng “Yahweh”. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
