  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh phủ định, hai hạng người được nhắc đến, lý do Yahweh đang thử dân Ngài, và mục đích “để biết” mà không diễn giải giảm nhẹ tính nhân hình. “Anh em” phản ánh đúng số nhiều của hậu tố ngôi thứ hai. “Nghe lời” diễn đạt được sắc thái nghe/tuân theo của שׁמע אֶל trong ngữ cảnh này.
