revisions:
- from: Toàn thể Israel sẽ nghe và sợ, và họ sẽ không còn làm một điều ác như thế ở giữa ngươi nữa.[a]
  to: Cả Israel sẽ nghe và sợ hãi; họ sẽ không còn làm điều ác như thế giữa anh em nữa.[a]
  rationale: Sửa cách xưng hô cổ “ngươi” thành “anh em” để phù hợp tiếng Việt tiêu chuẩn hiện đại, đồng thời chuyển thông tin về số ít tập thể sang chú thích. Điều chỉnh nhẹ cụm “một điều ác như thế” thành “điều ác như thế” để câu tự nhiên hơn mà không thay đổi nghĩa.
