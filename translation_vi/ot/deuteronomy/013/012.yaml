  text: וְ/כָל יִשְׂרָאֵ֔ל יִשְׁמְע֖וּ וְ/יִֽרָא֑וּ/ן וְ/לֹֽא יוֹסִ֣פוּ לַ/עֲשׂ֗וֹת כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: vi
  text: Cả Israel sẽ nghe và sợ hãi; họ sẽ không còn làm điều ác như thế giữa anh em nữa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói “giữa ngươi,” dùng đại từ số ít để nói với Israel như một toàn thể.
    reason: Làm rõ hậu tố số ít trong nguyên ngữ, trong khi thân văn dùng cách diễn đạt tiếng Việt hiện đại tự nhiên cho cộng đồng được nói đến.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Toàn thể Israel
  rationale: כָּל đi với tên riêng Israel chỉ toàn thể dân giao ước; cách diễn đạt này tự nhiên và giữ ý nghĩa tập thể.
- source_word: יִשְׁמְעוּ
  choice: sẽ nghe
  rationale: Động từ Qal chưa hoàn thành ngôi 3 số nhiều mang sắc thái tương lai hoặc kết quả trong văn cảnh luật pháp.
- source_word: וְיִרָאוּן
  choice: và sợ
  rationale: ירא tại đây diễn tả sự sợ hãi có tác dụng răn đe; “sợ” giữ được nét nghĩa trực tiếp mà không thêm sắc thái thờ phượng vốn không nhất thiết có trong câu.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: và họ sẽ không còn làm ... nữa
  rationale: Cấu trúc יסף Hiphil với động từ nguyên mẫu thường có nghĩa tiếp tục hoặc tái diễn hành động; “không còn ... nữa” diễn đạt tự nhiên ý ngăn việc lặp lại.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: một điều ác như thế
  rationale: דָּבָר trong văn cảnh này chỉ hành vi hoặc sự việc, còn כַּ...הַזֶּה mang ý so sánh với điều vừa được nói đến; cách dịch này tự nhiên hơn “điều ác này” mà vẫn giữ quy chiếu.
- source_word: בְּקִרְבֶּךָ
  choice: ở giữa ngươi
  rationale: Cụm từ có nghĩa đen là “ở giữa ngươi”, với hậu tố giống đực số ít dùng để nói với Israel như một tập thể thống nhất.
theological_decisions:
- issue: Số của hậu tố trong cách xưng hô giao ước
  choice: Giữ đại từ số ít “ngươi”
  alternative: “ở giữa anh em” hoặc “trong vòng dân chúng”
  rationale: Hậu tố Hê-bơ-rơ là giống đực số ít và nói với Israel như một toàn thể. Giữ “ngươi” phản ánh hình thức của nguyên văn; chú thích làm rõ rằng đối tượng là cả dân Israel, tránh hiểu lầm đây chỉ là một cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp câu luật pháp cùng cách xưng hô số ít của nguyên văn; dùng “sợ” thay vì “kính sợ” để không đưa thêm sắc thái thần học không được văn cảnh này buộc phải có.
