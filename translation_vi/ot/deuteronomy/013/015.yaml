source:
  edition: WLC
  text: וְ/דָרַשְׁתָּ֧ וְ/חָקַרְתָּ֧ וְ/שָׁאַלְתָּ֖ הֵיטֵ֑ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/קִרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: vi
  text: thì anh em phải dò hỏi, điều tra và xét hỏi kỹ lưỡng. Và kìa, nếu quả thật đã xác minh được[a] rằng điều ghê tởm này đã xảy ra giữa anh em—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tin báo là thật và sự việc đã được xác lập.”'
    reason: Cụm אֱמֶת נָכוֹן הַדָּבָר là công thức xác nhận pháp lý, có thể dịch sát hơn bằng cách nêu rõ “tin báo/sự việc” là đúng và đã được xác lập.
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: phải dò hỏi
  rationale: Trong ngữ cảnh pháp lý, דרש chỉ việc chủ động tìm hiểu, tra cứu sự việc; “dò hỏi” tự nhiên trong tiếng Việt và mở đầu chuỗi điều tra.
- source_word: וְחָקַרְתָּ
  choice: điều tra
  rationale: חקר nhấn mạnh việc xem xét kỹ để tìm ra sự thật; “điều tra” truyền đạt rõ sắc thái pháp lý và phân biệt với động từ trước.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: hỏi xét thật kỹ
  rationale: שאל là hỏi, còn הֵיטֵב bổ nghĩa theo nghĩa kỹ lưỡng; “hỏi xét thật kỹ” giữ được hành động hỏi và sức nhấn mạnh của trạng từ.
- source_word: וְהִנֵּה
  choice: nếu thấy
  rationale: Trong công thức xác minh này, וְהִנֵּה giới thiệu kết quả phát hiện sau quá trình điều tra. “Nếu thấy” diễn đạt tự nhiên chức năng điều kiện mà ngữ cảnh đòi hỏi, dù từ “nếu” không được nêu tường minh trong tiếng Hê-bơ-rơ.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: sự việc quả là thật và đã được xác minh
  rationale: Cụm từ là công thức pháp lý xác nhận rằng tin báo đúng sự thật và sự việc đã được thiết lập chắc chắn. Bản dịch giữ cả hai ý אמת và נָכוֹן mà vẫn tự nhiên trong tiếng Việt.
- source_word: נֶעֶשְׂתָה
  choice: đã xảy ra
  rationale: Dạng Niphal của עשה cho biết điều ghê tởm đã được thực hiện hoặc đã xảy ra; ở đây “đã xảy ra” tự nhiên và không làm suy giảm tính thực hữu của hành vi.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: điều ghê tởm này
  rationale: “Điều ghê tởm” truyền đạt sức nặng đạo đức và giao ước của תּוֹעֵבָה bằng ngôn ngữ hiện đại, dễ hiểu.
- source_word: בְּקִרְבֶּךָ
  choice: giữa anh em
  rationale: Cụm này nói đến sự việc xảy ra trong cộng đồng giao ước. “Giữa anh em” tự nhiên hơn “trong lòng anh em” và dùng đại từ tập thể để thể hiện đối tượng được xưng hô.
theological_decisions:
- issue: Công thức xác minh tư pháp
  choice: 'Diễn đạt như một tiến trình điều tra dẫn đến kết luận: “Nếu thấy sự việc quả là thật và đã được xác minh”.'
  alternative: “Và kìa, sự việc là thật, chắc chắn”.
  rationale: Nguyên văn không nêu từ điều kiện cách tường minh, nhưng cấu trúc pháp lý nối với mệnh lệnh ở câu kế tiếp có lực điều kiện. Bản dịch giữ tính thận trọng tư pháp, không coi lời tố cáo là đủ nếu chưa xác minh.
- issue: Sắc thái của תּוֹעֵבָה
  choice: điều ghê tởm
  alternative: sự gớm ghiếc
  rationale: Lựa chọn này giữ nguyên sự phán xét đạo đức mạnh mẽ của từ Hê-bơ-rơ nhưng tránh một cách nói quá cổ hoặc khó hiểu; không thu hẹp từ này vào riêng một phạm trù nghi lễ hay giáo phái.
translation_notes:
  register: Văn phong pháp lý trang nghiêm nhưng hiện đại. “Anh em” được dùng theo nghĩa tập thể để chuyển đại từ số ít trong tiếng Hê-bơ-rơ đang đại diện cho cộng đồng. Dấu gạch ngang giữ câu mở, vì mệnh đề điều kiện còn dẫn sang hành động được truyền ở câu kế tiếp.
