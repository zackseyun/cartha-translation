- from: Vì ngươi nhất định phải xử tử người ấy[a]; tay ngươi phải chống lại người ấy trước tiên để giết người ấy, rồi sau đó là tay của toàn dân.
  to: Vì ngươi nhất định phải xử tử người ấy[a]; tay ngươi phải là tay đầu tiên giơ lên chống lại người ấy để xử tử người ấy, rồi sau đó đến tay của toàn dân.
