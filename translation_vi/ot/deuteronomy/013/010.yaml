review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng quan hệ giải thích của כִּי, sắc thái nhấn mạnh của cấu trúc nguyên thể tuyệt đối + động từ hữu hạn, và trình tự người được nói đến trước, toàn dân sau. Tuy nhiên, “tay ngươi phải chống lại người ấy trước tiên” chưa diễn đạt trọn cấu trúc “tay ngươi sẽ là tay đầu tiên chống lại người ấy” và nghe không tự nhiên trong tiếng Việt.
  naturalness: “Tay ngươi phải chống lại người ấy trước tiên” có thể khiến người đọc hiểu rằng chỉ thái độ đối nghịch được yêu cầu, thay vì hành động mở đầu việc thi hành án. Cách “Tay ngươi phải là tay đầu tiên giơ lên chống lại người ấy” giữ hình ảnh ‘tay’ và làm rõ thứ tự hành động trong văn phong luật pháp trang trọng.
  terminology: “Xử tử” phù hợp ngữ cảnh pháp lý của cả הָרֹג תַּהַרְגֶנּוּ và לַהֲמִיתוֹ. Đại từ “ngươi” nhất quán với diễn ngôn luật pháp trực tiếp. Chú thích nên dùng tên ngôn ngữ chuẩn “tiếng Hê-bơ-rơ”.
  issues:
  - severity: medium
    issue: Mệnh đề về ‘tay ngươi’ thiếu cấu trúc ‘là tay đầu tiên’ và chưa nói rõ hành động khởi đầu.
    rationale: תִּהְיֶה ... בָּרִאשׁוֹנָה nêu rằng tay của người được nói đến phải đứng đầu trong hành động chống lại người ấy nhằm giết/xử tử. Bản nháp dùng “phải chống lại ... trước tiên” làm yếu hình ảnh song hành với “tay của toàn dân” và tạo câu tiếng Việt gượng.
  - severity: low
    issue: Tên ngôn ngữ trong chú thích chưa theo chính tả Việt ngữ thông dụng.
    rationale: “Tiếng Hê-bơ-rơ” tự nhiên và chuẩn hơn “Tiếng Hebrew” trong một bản dịch tiếng Việt hiện đại.
  revised_text: Vì ngươi nhất định phải xử tử người ấy[a]; tay ngươi phải là tay đầu tiên giơ lên chống lại người ấy để xử tử người ấy, rồi sau đó đến tay của toàn dân.
