  text: כִּ֤י הָרֹג֙ תַּֽהַרְגֶ֔/נּוּ יָֽדְ/ךָ֛ תִּֽהְיֶה בּ֥/וֹ בָ/רִֽאשׁוֹנָ֖ה לַ/הֲמִית֑/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: vi
  text: Vì ngươi nhất định phải xử tử người ấy[a]; tay ngươi phải là tay đầu tiên giơ lên chống lại người ấy để xử tử người ấy, rồi sau đó đến tay của toàn dân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngươi chắc chắn phải giết người ấy.” Tiếng Hê-bơ-rơ dùng nguyên thể tuyệt đối cùng với một động từ hữu hạn để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Liên từ này nêu cơ sở cho mệnh lệnh ở câu trước; “Vì” giữ rõ mối liên hệ lập luận.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: ngươi nhất định phải xử tử người ấy
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn và bắt buộc. “Nhất định phải xử tử” vừa truyền đạt sức nhấn mạnh vừa phù hợp bối cảnh pháp lý.
- source_word: יָדְךָ
  choice: tay ngươi
  rationale: Giữ hình ảnh cụ thể của nguyên văn và trách nhiệm trực tiếp của người được nói đến, thay vì giản lược thành đại từ.
- source_word: תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: phải chống lại người ấy trước tiên
  rationale: Diễn đạt thứ tự ưu tiên trong việc thi hành bản án, đồng thời giữ sắc thái đối nghịch của giới từ בּוֹ.
- source_word: לַהֲמִיתוֹ
  choice: để giết người ấy
  rationale: Động từ Hiphil của מות chỉ việc làm cho chết. Trong câu này, “giết” diễn đạt trực tiếp hành động mà bàn tay người tố cáo phải khởi đầu, còn mệnh đề trước đã xác lập bối cảnh xử tử theo pháp luật.
- source_word: וְיַד כָּל הָעָם
  choice: rồi sau đó là tay của toàn dân
  rationale: Giữ sự song hành giữa “tay ngươi” và “tay của toàn dân”, qua đó bảo toàn hình ảnh về sự tham gia của cộng đồng.
- source_word: בָּאַחֲרֹנָה
  choice: rồi sau đó
  rationale: Trong thế đối lập với “trước tiên”, cụm này chỉ hành động tiếp theo trong trình tự thi hành án.
theological_decisions:
- issue: Cách chuyển ngữ ngôn ngữ hành quyết theo pháp luật mà không làm nhẹ hoặc cường điệu ý nghĩa
  choice: xử tử người ấy
  alternative: giết người ấy
  rationale: Câu này quy định án tử hình trong khuôn khổ luật giao ước. “Xử tử” thể hiện rõ bối cảnh pháp lý, còn chú thích vẫn ghi nhận cách dịch trực tiếp hơn của động từ Hebrew.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ đại từ “ngươi” phù hợp diễn ngôn luật pháp trực tiếp trong Phục Truyền Luật Lệ Ký; giữ hình ảnh “tay ngươi / tay của toàn dân” và sức nhấn mạnh của nguyên văn.
