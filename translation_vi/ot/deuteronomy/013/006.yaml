source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: vi
  text: Nhưng vị tiên tri ấy hoặc kẻ nằm mộng ấy phải bị xử tử, vì người đã nói lời phản nghịch[a] chống lại Yahweh, Đức Chúa Trời của anh em—Đấng đã đưa anh em ra khỏi đất Ai Cập và chuộc anh em khỏi cảnh nô lệ[b]—nhằm lôi kéo anh em lìa khỏi con đường mà Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em phải bước đi. Như vậy, anh em phải trừ bỏ điều ác khỏi giữa anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời bội đạo.” Từ Hê-bơ-rơ chỉ sự lìa bỏ lòng trung thành với Yahweh trong giao ước.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “nhà của những người nô lệ”; theo truyền thống cũng dịch là “nhà nô lệ.”'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא
  choice: Nhưng nhà tiên tri ấy
  rationale: Liên từ nối lại trường hợp pháp lý ở câu trước và mang sắc thái đối lập; “nhà tiên tri” là cách gọi tự nhiên, trực tiếp của נָבִיא.
- source_word: אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: hoặc kẻ mơ giấc mơ ấy
  rationale: Giữ cả hành động mơ và đại từ chỉ định הַהוּא, đồng thời diễn đạt tự nhiên trong tiếng Việt và liên kết với giấc mơ đã được nêu trong văn cảnh.
- source_word: יוּמָת
  choice: phải bị xử tử
  rationale: Thể Hophal của מות chỉ việc bị làm cho chết trong bối cảnh tư pháp, không chỉ đơn giản là qua đời.
- source_word: כִּי דִבֶּר סָרָה
  choice: vì người đã nói lời phản nghịch
  rationale: סָרָה biểu thị sự phản loạn hoặc lìa bỏ lòng trung thành giao ước. “Nói lời phản nghịch” giữ cấu trúc và sức nặng của nguyên ngữ; chú thích bảo lưu nghĩa gần là “bội đạo”.
- source_word: עַל יְהוָה אֱלֹהֵיכֶם
  choice: chống lại Yahweh, Đức Chúa Trời của anh em
  rationale: Trong ngữ cảnh thù nghịch này, עַל đi với דִבֶּר mang nghĩa chống lại; tên giao ước יְהוָה được phiên là Yahweh.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: Đấng đã đưa anh em ra khỏi đất Ai Cập
  rationale: Giữ công thức Xuất Hành quen thuộc và phân từ xác định mô tả Yahweh là Đấng giải cứu.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: và chuộc anh em khỏi cảnh nô lệ
  rationale: פּדה là chuộc hoặc giải cứu bằng sự cứu chuộc. “Cảnh nô lệ” tự nhiên trong tiếng Việt; hình ảnh nguyên văn “nhà của những người nô lệ” được bảo lưu trong chú thích.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: nhằm lôi kéo anh em lìa khỏi con đường
  rationale: Hiphil của נדח chỉ khiến hoặc xúi người khác rời khỏi hướng đúng. “Lôi kéo… lìa khỏi” vừa tự nhiên vừa giữ lực tác động và ẩn dụ con đường.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: mà Yahweh, Đức Chúa Trời của anh em, đã truyền cho anh em phải bước đi
  rationale: Giữ ẩn dụ giao ước “bước đi” thay vì làm phẳng thành “tuân theo”; cách nói số nhiều nhất quán trong tiếng Việt diễn đạt lời kêu gọi cộng đồng.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Như vậy, anh em phải trừ bỏ điều ác khỏi giữa mình
  rationale: בער trong công thức pháp lý Phục Truyền Luật Lệ Ký có nghĩa loại trừ dứt khoát; “trừ bỏ điều ác” rõ ràng và trang trọng.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יְהוָה; phiên âm “Yahweh” giữ sự phân biệt giữa danh riêng này và tước hiệu אֱלֹהִים.
- issue: Sắc thái của סָרָה
  choice: lời phản nghịch
  alternative: lời bội đạo
  rationale: “Phản nghịch” diễn đạt rõ hành vi chống lại Yahweh mà không thu hẹp từ này vào một thuật ngữ giáo phái; chú thích bảo lưu sắc thái lìa bỏ lòng trung thành giao ước.
- issue: Sự chuyển đổi từ số nhiều sang số ít trong lời xưng hô
  choice: dùng “anh em” nhất quán
  alternative: chuyển từ “anh em” sang “ngươi” theo hình thái Hê-bơ-rơ
  rationale: Nguyên ngữ chuyển từ hậu tố số nhiều sang số ít mang tính đại diện hoặc phân phối. Tiếng Việt dùng “anh em” nhất quán để lời cộng đồng được tự nhiên mà không thay đổi đối tượng thực chất.
translation_notes:
  register: Văn phong pháp lý–giao ước, trang trọng nhưng hiện đại. Dùng “phải bị xử tử” để thể hiện phán quyết tư pháp; giữ các ẩn dụ “con đường” và “bước đi.” “Người” sau chủ ngữ “nhà tiên tri… hoặc kẻ mơ” tránh lặp từ miệt thị, còn “anh em” diễn đạt tự nhiên cộng đồng được xưng hô.
