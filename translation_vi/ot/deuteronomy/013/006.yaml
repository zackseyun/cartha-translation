    issue: «nhà tiên tri ấy»
    rationale: Trong tiếng Việt hiện đại, «nhà tiên tri» chỉ nhà/cơ ngơi của tiên tri chứ không chỉ bản thân tiên tri. הַנָּבִיא là «vị tiên tri» hoặc «tiên tri».
  - severity: low
    issue: «kẻ mơ giấc mơ ấy» hơi gượng
    rationale: Cụm này bám sát hình thức Hê-bơ-rơ nhưng không tự nhiên bằng «kẻ nằm mộng ấy». Bản sửa vẫn giữ ý người nằm mộng được nói đến.
  - severity: low
    issue: «khỏi giữa mình» có thể mơ hồ
    rationale: «Mình» có thể được hiểu phản thân; «khỏi giữa anh em» biểu đạt minh bạch hơn công thức cộng đồng מִקִּרְבֶּךָ.
