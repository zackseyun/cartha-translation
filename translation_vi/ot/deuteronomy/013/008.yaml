base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: vi
  text: từ các thần của các dân tộc xung quanh anh em, dù ở gần bạn hay ở xa bạn, từ đầu này của trái đất đến đầu kia của trái đất[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ đầu này của xứ đến đầu kia của xứ.” Từ Hê-bơ-rơ אֶרֶץ có thể có nghĩa là “trái đất” hoặc “xứ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: trong số các thần của
  rationale: Giới từ מִן mang sắc thái chỉ phạm vi hoặc nguồn trong mạch câu đang tiếp diễn; “trong số các thần của” diễn đạt tự nhiên mối liên hệ giữa các thần và các dân tộc mà vẫn giữ tính chất phân đoạn của câu.
- source_word: הָעַמִּים
  choice: những dân tộc
  rationale: עַמִּים chỉ các cộng đồng dân tộc ở số nhiều; “những dân tộc” giữ rõ sắc thái tập thể và sắc tộc hơn cách dịch thiên về thực thể chính trị.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: ở chung quanh anh em
  rationale: Cụm này bổ nghĩa cho “những dân tộc” và diễn tả vị trí bao quanh. “Anh em” là lối xưng hô tập thể hiện đại, phù hợp với hậu tố số nhiều trong סְבִיבֹתֵיכֶם.
- source_word: הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: dù gần hay xa
  rationale: Hai tính từ tạo thành cặp đối lập về khoảng cách. “Dù gần hay xa” tự nhiên trong tiếng Việt và không làm thay đổi phạm vi bao quát của nguyên văn.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: từ đầu này mặt đất đến đầu kia mặt đất
  rationale: Cách diễn đạt giữ sự lặp lại của הָאָרֶץ và sức nhấn mạnh về toàn bộ phạm vi địa lý. “Mặt đất” thể hiện cách hiểu rộng trong chính văn, còn nghĩa “xứ” được ghi nhận ở chú thích.
theological_decisions:
- issue: Phạm vi nghĩa của הָאָרֶץ trong thành ngữ kết câu
  choice: mặt đất
  alternative: xứ
  rationale: אֶרֶץ có thể chỉ “đất/xứ” hoặc “mặt đất.” Trong công thức “từ đầu này… đến đầu kia,” cách hiểu rộng nhấn mạnh mọi khoảng cách có thể hình dung, nhưng nghĩa hẹp hơn vẫn khả hữu nên được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch dùng “anh em” như đại từ tập thể; cụm “dù gần hay xa” làm gọn cặp đối lập mà không thu hẹp ý nghĩa. Dấu gạch ngang cuối câu cho thấy đây là phần tiếp diễn của một câu dài hơn.
