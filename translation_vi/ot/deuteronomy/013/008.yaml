  naturalness: “Từ đầu này mặt đất đến đầu kia mặt đất” không tự nhiên trong tiếng Việt hiện đại. “Từ đầu này của trái đất đến đầu kia của trái đất” là thành ngữ rõ ràng, trang trọng và vẫn giữ phép lặp nhấn mạnh của tiếng Hê-bơ-rơ.
