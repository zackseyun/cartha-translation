base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/013.yaml
  text: You shall not have in your bag differing weights[a], a large and a small.
translation:
  language: vi
  text: Anh em không được có trong túi hai quả cân khác nhau[a], một lớn và một nhỏ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “một hòn đá và một hòn đá”, chỉ những hòn đá được dùng làm quả cân trong việc mua bán.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Anh em không được có
  rationale: Cấu trúc hiện hữu với לְךָ diễn tả việc sở hữu; cách dịch này tự nhiên trong tiếng Việt và giữ rõ lực cấm đoán của điều luật.
- source_word: בְּכִיסְךָ
  choice: trong túi
  rationale: כִּיס là túi hoặc bao nhỏ dùng để đựng tiền hay quả cân; “túi” là cách gọi hiện đại, rõ nghĩa và không xác định quá mức hình dạng.
- source_word: אֶבֶן וָאָבֶן
  choice: hai quả cân khác nhau
  rationale: Nghĩa đen là “một hòn đá và một hòn đá”, một thành ngữ chỉ các quả cân bằng đá dùng trong giao dịch. Cách dịch này truyền đạt trực tiếp ý nghĩa thương mại và giữ sự đối lập giữa hai quả cân.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: một lớn và một nhỏ
  rationale: Hai tính từ giống cái bổ nghĩa cho cặp quả cân được nói đến; cách diễn đạt ngắn gọn này bám sát sự tương phản trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Hàm ý gian lận của hai quả cân
  choice: Không thêm từ “gian lận” vào chính văn
  alternative: “hai quả cân gian lận” hoặc “hai quả cân không đúng nhau”
  rationale: Ngữ cảnh luật thương mại cho thấy việc dùng quả cân lớn và nhỏ là bất chính, nhưng câu Hê-bơ-rơ chỉ nêu cặp quả cân khác nhau; bản dịch không nên đưa hàm ý thành một từ được nói rõ trong nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “anh em” cho đại từ số ít giống đực ךָ theo lối xưng hô cộng đồng thường gặp trong Phục Truyền Luật Lệ Ký; câu vẫn hướng đến từng thành viên trong dân chúng.
