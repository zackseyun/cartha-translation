  yaml_path: translation/ot/deuteronomy/025/014.yaml
  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: vi
  text: 'Trong nhà anh em không được có hai ê-pha: một lớn, một nhỏ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ê-pha là một đơn vị đo đồ khô của người Hê-bơ-rơ thời xưa.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: anh em không được có
  rationale: Cấu trúc phủ định với động từ היה và giới từ chỉ sở hữu diễn đạt lệnh cấm sở hữu; cách dịch này tự nhiên trong tiếng Việt và giữ rõ sắc thái pháp luật.
- source_word: בְּבֵיתְךָ
  choice: trong nhà anh em
  rationale: בַּיִת ở đây chỉ nơi cất giữ các dụng cụ đong, nên “nhà” sát nghĩa và cụ thể hơn “gia đình” hay “hộ gia đình”.
- source_word: אֵיפָה וְאֵיפָה
  choice: hai đấu ê-pha
  rationale: Danh từ được lặp lại trong tiếng Hê-bơ-rơ để chỉ hai dụng cụ đong cùng danh nghĩa nhưng khác dung tích. “Hai đấu ê-pha” truyền đạt tự nhiên sự đối lập ấy, đồng thời giữ tên đơn vị cổ.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: một đấu lớn và một đấu nhỏ
  rationale: Hai tính từ giống cái bổ nghĩa cho ê-pha, nêu rõ hai đấu có dung tích khác nhau; thêm “một đấu” giúp câu tiếng Việt sáng nghĩa mà vẫn giữ phép đối xứng của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số ít giống đực, phù hợp cách xưng hô giao ước hướng đến từng thành viên trong cộng đồng; giữ “ê-pha” và giải thích bằng chú thích văn hóa.
