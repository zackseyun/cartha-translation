  text: You shall not muzzle an ox while it is threshing[a].
translation:
  language: vi
  text: Đừng bịt mõm con bò khi nó đang đạp ngũ cốc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khi nó đang đập hạt.” Tiếng Hê-bơ-rơ sát nghĩa là “trong việc đập ngũ cốc của nó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַחְסֹם
  choice: Đừng bịt mõm
  rationale: Diễn đạt tự nhiên một lệnh cấm trong tiếng Việt; động từ חָסַם ở đây chỉ việc bịt mõm hoặc khóa miệng con vật để nó không ăn được.
- source_word: שׁוֹר
  choice: con bò
  rationale: שׁוֹר chỉ loài bò dùng trong lao động nông nghiệp. “Con bò” là cách gọi phổ thông, tự nhiên trong tiếng Việt và không xác định giới tính quá mức so với ngữ cảnh.
- source_word: בְּדִישׁוֹ
  choice: khi nó đang đạp lúa
  rationale: Cụm từ có nghĩa đen là “trong lúc nó đập/giẫm lúa”; “đạp lúa” diễn đạt rõ công việc con bò giẫm lên ngũ cốc để tách hạt, đồng thời giữ sắc thái thời gian của giới từ בְּ.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ ngắn gọn, trang trọng nhưng hiện đại. Dùng “Đừng” cho mệnh lệnh cấm trực tiếp; “bịt mõm” và “đạp lúa” dễ hiểu đối với độc giả phổ thông. Đại từ “nó” quy chiếu rõ về con bò.
