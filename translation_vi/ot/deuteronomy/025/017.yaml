review_pass:
  verdict: revise
  source_fidelity: Cần sửa cách chuyển đạt עָשָׂה לְךָ. Cụm “đã làm cho anh em” trong tiếng Việt thường gợi nghĩa làm vì/làm cho lợi ích của họ, trái với hành động thù nghịch mà ngữ cảnh trực tiếp xác định. Bản Hê-bơ-rơ cũng chủ ý chuyển từ số ít לְךָ (“ngươi,” ngỏ với Israel như một đơn vị) sang số nhiều בְּצֵאתְכֶם (“anh em/các ngươi”).
  naturalness: “Hãy nhớ điều A-ma-léc đã đối xử với ngươi” là tự nhiên, trang trọng vừa phải, và diễn tả rõ hành động hướng nghịch lại người được nói đến. “Dọc đường” và “ra khỏi Ai Cập” đều tự nhiên.
  terminology: Giữ “A-ma-léc” và “Ai Cập” theo cách viết tên quen thuộc trong tiếng Việt. Dùng “ngươi” ở vế đầu và “anh em” ở vế sau để phản ánh sự chuyển số của nguyên văn, không áp đặt một diễn giải thần học.
  issues:
  - severity: medium
    issue: “đã làm cho anh em” mơ hồ và dễ mang nghĩa có lợi
    rationale: Với “làm cho,” tiếng Việt thường hiểu Amalek đã làm một điều vì anh em. Trong ngữ cảnh Deuteronomy 25:17–18, hành vi được nhắc đến là sự tấn công; “đối xử với ngươi” truyền đạt đúng hướng tác động của עָשָׂה לְךָ mà không thêm chi tiết từ câu sau.
  - severity: low
    issue: Số ít/số nhiều của đại từ không được giữ lại
    rationale: Nguyên văn có לְךָ số ít rồi בְּצֵאתְכֶם số nhiều. Việc dùng “anh em” ở cả hai vị trí làm mất đặc điểm diễn ngôn này, trong khi “ngươi … anh em” vẫn có thể đọc tự nhiên trong văn phong Kinh Thánh hiện đại.
  revised_text: Hãy nhớ điều A-ma-léc đã đối xử với ngươi dọc đường, khi anh em ra khỏi Ai Cập.
