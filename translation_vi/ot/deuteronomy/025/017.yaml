- from: Hãy nhớ điều A-ma-léc đã làm cho anh em dọc đường, khi anh em ra khỏi Ai Cập.
  to: Hãy nhớ điều A-ma-léc đã đối xử với ngươi dọc đường, khi anh em ra khỏi Ai Cập.
  rationale: Sửa cụm động từ để tránh nghĩa đảo ngược hoặc mơ hồ của “làm cho anh em,” đồng thời giữ sự chuyển đổi số ít sang số nhiều của bản Hê-bơ-rơ. Các thành phần thời gian, hành trình và địa danh được giữ nguyên ý nghĩa.
