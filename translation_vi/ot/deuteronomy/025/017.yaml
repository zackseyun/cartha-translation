  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: vi
  text: Hãy nhớ điều A-ma-léc đã đối xử với ngươi dọc đường, khi anh em ra khỏi Ai Cập.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכוֹר
  choice: Hãy nhớ
  rationale: Mệnh lệnh Qal số ít của זכר; “Hãy nhớ” là cách diễn đạt tự nhiên, trực tiếp và giữ được sức nặng giao ước của lời truyền.
- source_word: אֵת אֲשֶׁר
  choice: điều
  rationale: Dấu hiệu tân ngữ cùng đại từ quan hệ giới thiệu nội dung cần ghi nhớ; “điều” kết hợp tự nhiên với mệnh đề theo sau trong tiếng Việt.
- source_word: עָשָׂה לְךָ
  choice: đã làm cho anh em
  rationale: עשה với ל chỉ hành động hướng đến dân Israel. Trong ngữ cảnh, hành động ấy rõ ràng là thù địch; “làm cho anh em” giữ cấu trúc nguồn mà không cần thêm ý giải thích.
- source_word: עֲמָלֵק
  choice: A-ma-léc
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: בַּדֶּרֶךְ
  choice: dọc đường
  rationale: בדרך chỉ hoàn cảnh trên hành trình; “dọc đường” tự nhiên trong tiếng Việt và phù hợp với ký ức về cuộc xuất hành.
- source_word: בְּצֵאתְכֶם
  choice: khi anh em ra
  rationale: Động từ nguyên mẫu liên kết với ב biểu thị hoàn cảnh thời gian; “khi anh em ra” truyền đạt rõ quan hệ thời gian.
- source_word: מִמִּצְרַיִם
  choice: khỏi Ai Cập
  rationale: מן chỉ nguồn hay điểm xuất phát; sau động từ “ra”, “khỏi Ai Cập” là cách nói tự nhiên, chính xác và không dư từ.
theological_decisions:
- issue: Sự chuyển đổi từ đại từ số ít לְךָ sang hậu tố số nhiều בְּצֵאתְכֶם
  choice: Dùng “anh em” cho cả hai vị trí
  alternative: Dùng “ngươi” ở vế đầu và “anh em” ở vế sau
  rationale: Bản Hê-bơ-rơ chuyển từ số ít sang số nhiều khi nói với Israel như một cộng đồng. Tiếng Việt hiện đại dùng “anh em” xuyên suốt để tránh sự đổi ngôi gượng gạo, đồng thời vẫn chỉ cùng một tập thể được ngỏ lời.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ câu mệnh lệnh trực tiếp; dùng “anh em” làm đại từ cộng đồng, và giữ dấu chấm cuối câu vì câu này đứng độc lập trong bản dịch.
