  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: vi
  text: Và trong Y-sơ-ra-ên, nhà người ấy sẽ được gọi là “Nhà người bị tháo dép.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “Nhà của người có dép bị tháo.” Tiếng Hê-bơ-rơ cô đọng danh hiệu mang ý nghĩa hổ thẹn của nghi lễ này thành một cụm từ ngắn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרָא שְׁמוֹ
  choice: nhà người ấy sẽ được gọi là
  rationale: Công thức bị động về việc đặt tên được diễn đạt tự nhiên trong tiếng Việt; “tên của người ấy” trong ngữ cảnh chỉ danh xưng công khai gắn với nhà người ấy.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Y-sơ-ra-ên
  rationale: Giữ nghĩa phạm vi xã hội nơi danh xưng này được sử dụng.
- source_word: בֵּית
  choice: Nhà
  rationale: Ở đây chỉ gia tộc hay dòng nhà, không đơn thuần là một tòa nhà; “Nhà” cũng giữ được sắc thái của một danh hiệu cố định.
- source_word: חֲלוּץ הַנָּעַל
  choice: người bị tháo dép
  rationale: Cụm Hê-bơ-rơ cô đọng dùng phân từ bị động và “chiếc dép”; cách dịch này làm rõ hành động nghi lễ mà không thêm chủ thể tháo dép.
