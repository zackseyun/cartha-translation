  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: vi
  text: thì nếu kẻ có tội đáng bị đánh đòn, thẩm phán phải bắt người ấy nằm xuống và cho đánh người ấy trước mặt thẩm phán, với số đòn tương xứng với tội của người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “theo tội của người ấy, theo số lượng,” tức là số đòn được đếm và tương xứng với tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: đáng bị đánh đòn
  rationale: Thành ngữ Hê-bơ-rơ, sát nghĩa là “con của sự đánh đập”, chỉ người phải chịu hoặc đáng chịu hình phạt đánh đòn; cách dịch này truyền đạt tự nhiên ý nghĩa pháp lý.
- source_word: הָרָשָׁע
  choice: kẻ có tội
  rationale: Trong bối cảnh xét xử, từ này chỉ bên đã bị xác định là có tội, đồng thời vẫn hàm ý sai trái về mặt đạo đức-pháp lý.
- source_word: וְהִפִּילוֹ
  choice: phải bắt người ấy nằm xuống
  rationale: Dạng Hiphil của נפל ở đây có nghĩa khiến người bị kết án nằm xuống để chịu đánh đòn.
- source_word: הַשֹּׁפֵט
  choice: thẩm phán
  rationale: Cách gọi hiện đại, rõ nghĩa đối với viên chức tư pháp trong câu.
- source_word: וְהִכָּהוּ
  choice: cho đánh
  rationale: Động từ có nghĩa đánh hoặc giáng đòn; “cho đánh” phù hợp với vai trò ra lệnh và giám sát của thẩm phán mà không xác quyết rằng chính thẩm phán thi hành.
- source_word: לְפָנָיו
  choice: ngay trước mặt mình
  rationale: Giữ ý hình phạt diễn ra trước mặt thẩm phán, dưới sự chứng kiến và giám sát của ông.
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: tương xứng với tội của người ấy
  rationale: כְּדֵי diễn đạt mức độ tương xứng, còn רִשְׁעָתוֹ trong văn cảnh pháp lý chỉ tội hoặc hành vi sai trái của người bị kết án.
- source_word: בְּמִסְפָּר
  choice: số đòn
  rationale: Cụm Hê-bơ-rơ ngắn gọn nói đến một số lượng được đếm; danh từ “đòn” được bổ sung theo ngữ cảnh và được câu kế tiếp làm rõ.
