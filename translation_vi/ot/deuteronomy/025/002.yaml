translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. Dùng “kẻ có tội” thay vì “kẻ gian ác” vì đây là bối cảnh phán quyết tại tòa; dùng “đánh đòn” để phân biệt hình phạt thân thể có số đòn được quy định với hành vi đánh đập nói chung.
