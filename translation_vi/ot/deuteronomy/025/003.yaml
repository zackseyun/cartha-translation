  text: אַרְבָּעִ֥ים יַכֶּ֖/נּוּ לֹ֣א יֹסִ֑יף פֶּן יֹסִ֨יף לְ/הַכֹּת֤/וֹ עַל אֵ֨לֶּה֙ מַכָּ֣ה רַבָּ֔ה וְ/נִקְלָ֥ה אָחִ֖י/ךָ לְ/עֵינֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: vi
  text: Có thể đánh người ấy bốn mươi lần,[a] nhưng không được quá số đó, kẻo người ta đánh thêm nhiều đòn quá số này, khiến người anh em của bạn bị hạ nhục trước mắt bạn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bốn mươi đòn”. Tiếng Hê-bơ-rơ nêu con số bốn mươi nhưng tại đây không nói rõ dụng cụ hay hình thức cụ thể của mỗi lần đánh.'
    reason: lexical_alternative
  - marker: b
    text: “Người anh em” ở đây chỉ một người cùng thuộc cộng đồng giao ước. Cụm từ được dịch là “nhiều đòn quá số này” cũng có thể được hiểu là “một trận đòn quá nặng”. Điều luật giới hạn hình phạt để người có tội không bị đối xử như kẻ đáng khinh.
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: Có thể đánh người ấy bốn mươi roi
  rationale: Con số bốn mươi là giới hạn của hình phạt thân thể. “Roi” tự nhiên trong tiếng Việt, nhưng dụng cụ và hình thức cụ thể của mỗi lần đánh không được bản văn nói rõ; vì vậy có chú thích.
- source_word: לֹא יֹסִיף
  choice: nhưng không được quá số đó
  rationale: יסף mang nghĩa thêm hoặc gia tăng; trong ngữ cảnh luật pháp, cách dịch này diễn đạt rõ lệnh cấm vượt quá giới hạn bốn mươi.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: kẻo người ta cứ đánh thêm
  rationale: Giữ sức cảnh báo của פן và ý tiếp tục/gia tăng của יסף đi với động từ nguyên mẫu.
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: nhiều roi hơn số ấy
  rationale: Cụm Hê-bơ-rơ ở dạng số ít nhưng có thể mang nghĩa tập hợp về một trận đòn nặng hoặc quá nhiều đòn; bản dịch diễn đạt sự vượt quá số lượng đã ấn định mà không biến nó thành một con số mới.
- source_word: וְנִקְלָה
  choice: bị hạ nhục
  rationale: Động từ Niphal của קלה nói đến việc bị coi nhẹ, làm nhục hoặc làm mất phẩm giá; “bị hạ nhục” tự nhiên và phù hợp mối quan tâm về phẩm giá trong điều luật.
- source_word: אָחִיךָ
  choice: anh em của anh chị em
  rationale: Giữ hình ảnh thân tộc “anh em” của nguyên văn, đồng thời dùng đại từ ngôi hai số ít theo lối tiếng Việt hiện đại để câu có thể trực tiếp hướng tới người đọc mà không đồng nhất người nghe với riêng nam giới.
- source_word: לְעֵינֶיךָ
  choice: trước mắt anh chị em
  rationale: Bám sát thành ngữ Hê-bơ-rơ và giữ sức nặng đạo đức của việc sự hạ nhục diễn ra công khai ngay trước mắt cộng đồng.
theological_decisions:
- issue: Danh xưng thân tộc trong bối cảnh luật giao ước
  choice: anh em của anh chị em
  alternative: người đồng bào của anh chị em
  rationale: Nguyên văn gọi người chịu phạt là “anh em”, nhấn mạnh rằng dù có tội và bị phạt, người ấy vẫn thuộc cộng đồng và không được đối xử như kẻ đáng khinh. Giữ danh xưng thân tộc bảo toàn sức căng đạo đức này.
- issue: Ý nghĩa của מַכָּה רַבָּה
  choice: nhiều roi hơn số ấy
  alternative: một trận đòn quá nặng
  rationale: Cụm từ có thể nhấn mạnh số đòn nhiều hoặc tính chất nghiêm trọng của trận đòn. Trong mạch văn đặt giới hạn bốn mươi, bản dịch chính nêu ý vượt số lượng; chú thích bảo lưu khả năng hiểu là một trận đòn quá nặng.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. Dùng “có thể… nhưng không được” để thể hiện sự cho phép có giới hạn; giữ “anh em” nhằm bảo toàn ngôn ngữ thân tộc và nền tảng về phẩm giá con người trong nguyên văn.
