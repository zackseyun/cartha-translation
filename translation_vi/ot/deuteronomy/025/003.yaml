revisions:
- from: Có thể đánh người ấy bốn mươi roi[a], nhưng không được quá số đó, kẻo người ta cứ đánh thêm nhiều roi hơn số ấy, khiến anh em của anh chị em bị hạ nhục trước mắt anh chị em.[b]
  to: Có thể đánh người ấy bốn mươi lần,[a] nhưng không được quá số đó, kẻo người ta đánh thêm nhiều đòn quá số này, khiến người anh em của bạn bị hạ nhục trước mắt bạn.[b]
  rationale: 'Bản sửa loại bỏ việc xác định “roi” không có trong nguyên văn, làm câu tiếng Việt gọn và tự nhiên hơn, đồng thời dùng đại từ số ít nhất quán với tiếng Hê-bơ-rơ. Cấu trúc cảnh báo vẫn giữ ý: không được vượt quá bốn mươi, để người chịu phạt không bị làm thành đáng khinh trước mắt người nghe. Chú thích b tiếp tục neo cả thuật ngữ “người anh em” lẫn sắc thái có tranh luận của מַכָּה רַבָּה.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:54Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng giới hạn bốn mươi và mục đích ngăn việc làm nhục người chịu phạt. Tuy nhiên, “roi” trong bản văn chính xác định dụng cụ mà tiếng Hê-bơ-rơ không xác định; và “anh em của anh chị em” không tự nhiên, đồng thời làm mờ số ít của אָחִיךָ.
  naturalness: Câu hiện tại có cấu trúc khá nặng và cách xưng hô “anh chị em” lặp lại không phù hợp văn phong tiếng Việt hiện đại. “bốn mươi lần”, “người anh em của bạn”, và “trước mắt bạn” tự nhiên hơn, vẫn giữ được ý nghĩa nguyên văn.
  terminology: Giữ “người anh em” cho אָחִיךָ để bảo toàn hình ảnh thân tộc và địa vị liên đới trong cộng đồng giao ước, không áp đặt một cách diễn giải giáo phái. Dùng “đòn” thay cho “roi” ở mệnh đề vượt giới hạn để không xác định loại dụng cụ. Chú thích bảo lưu cách hiểu tập thể của מַכָּה רַבָּה là một trận đòn nặng/quá mức.
  issues:
  - severity: medium
    issue: “bốn mươi roi” xác định dụng cụ trong bản văn chính
    rationale: אַרְבָּעִים đếm số lần/đòn; động từ נכה là “đánh”. Bản văn không nêu roi hay dụng cụ cụ thể. Chú thích hiện có thừa nhận điểm này, nhưng bản văn chính nên tránh xác định thêm.
  - severity: medium
    issue: “anh em của anh chị em ... trước mắt anh chị em” không tự nhiên và không giữ rõ số ít
    rationale: אָחִיךָ và לְעֵינֶיךָ đều là hình thức số ít. Cách diễn đạt hiện tại vừa lặp vừa dễ được hiểu là số nhiều. “người anh em của bạn ... trước mắt bạn” hiện đại, rõ ràng, và vẫn giữ thuật ngữ thân tộc.
  - severity: low
    issue: “nhiều roi hơn số ấy” vừa lặp việc xác định roi vừa chưa phản ánh đầy đủ sắc thái của מַכָּה רַבָּה
    rationale: Cụm này có thể chỉ một trận đòn lớn/nặng theo nghĩa tập thể. “nhiều đòn quá số này” phù hợp mạch giới hạn số lượng; chú thích bảo lưu sắc thái thay thế.
