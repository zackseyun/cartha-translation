  naturalness: “Vợ góa của người anh/em ấy” tự nhiên và chính xác hơn trong ngữ cảnh luật hôn nhân nối dõi. Việc lặp “người ấy” ở các đại từ tiếp theo làm rõ các quy chiếu mà vẫn giữ văn phong pháp lý-trần thuật hiện đại. “Rồi đáp rằng” là cách diễn đạt tiếng Việt gọn, phù hợp với công thức Hê-bơ-rơ.
  terminology: Giữ “trưởng lão,” “chiếc dép,” và ẩn dụ “xây dựng nhà” là thích hợp. “Anh/em” bảo toàn việc tiếng Hê-bơ-rơ không xác định người anh hay em; chú thích văn hóa cần khớp với cách gọi này.
