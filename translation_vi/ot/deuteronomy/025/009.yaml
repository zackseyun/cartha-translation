  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: vi
  text: 'thì vợ góa của người anh/em ấy sẽ đến gần người ấy trước mặt các trưởng lão, tháo chiếc dép khỏi chân người ấy, nhổ vào mặt người ấy[a], rồi đáp rằng: “Người nào không xây dựng nhà của anh/em mình[b] thì sẽ bị đối xử như thế này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhổ trước mặt người ấy.” Một số người hiểu tiếng Hê-bơ-rơ là nhổ ở phía trước người ấy chứ không trực tiếp vào mặt.'
    reason: lexical_alternative
  - marker: b
    text: “Xây dựng nhà của anh/em mình” nghĩa là duy trì dòng dõi và gia đình của người anh hoặc em đã chết qua hôn nhân nối dõi.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: chị dâu của người ấy
  rationale: Trong ngữ cảnh luật hôn nhân nối dõi, từ này chỉ người vợ góa của anh hoặc em đã chết. “Chị dâu” là cách gọi tự nhiên trong tiếng Việt; ngữ cảnh trước đó xác định rõ bà là góa phụ.
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: trước mặt các trưởng lão
  rationale: Diễn đạt tự nhiên ý nguyên văn “trước mắt các trưởng lão,” nhấn mạnh hành động được thực hiện công khai với họ làm chứng.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: tháo chiếc dép khỏi chân người
  rationale: Giữ số ít của נַעַל và chuyển tải trực tiếp hành động tháo dép trong nghi thức pháp lý.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: nhổ vào mặt người
  rationale: Đây là nghĩa trực tiếp và tự nhiên nhất của cụm Hê-bơ-rơ; cách hiểu “nhổ trước mặt người” vẫn được ghi nhận trong chú thích để bảo tồn sự khác biệt diễn giải.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: rồi đáp rằng
  rationale: Tiếng Việt không cần lặp “đáp và nói”; “đáp rằng” giữ chức năng của công thức phát ngôn mà vẫn tự nhiên.
- source_word: כָּכָה יֵעָשֶׂה לָאִישׁ
  choice: Người nào … thì sẽ bị đối xử như thế này
  rationale: Dạng bị động phản ánh יֵעָשֶׂה, còn cấu trúc “người nào … thì” tạo câu tuyên bố pháp lý rõ ràng, tự nhiên trong tiếng Việt.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: không xây dựng nhà của anh em mình
  rationale: Giữ hình ảnh “xây dựng nhà” của nguyên văn và không xác định אָחִיו là anh hay em; chú thích giải thích nghĩa văn hóa là duy trì dòng họ và gia đình.
theological_decisions:
- issue: Cách hiểu cụm בְּפָנָיו trong nghi thức làm nhục
  choice: nhổ vào mặt người
  alternative: nhổ trước mặt người
  rationale: Bản dịch chính theo nghĩa trực tiếp của giới từ và danh từ trong ngữ cảnh, nhưng chú thích giữ lại cách hiểu khác có cơ sở mà không âm thầm giải quyết sự mơ hồ.
- issue: Ý nghĩa của “xây dựng nhà của anh em mình”
  choice: giữ nguyên ẩn dụ trong chính văn
  alternative: diễn giải là duy trì dòng dõi của anh em mình
  rationale: Giữ ngôn ngữ giàu hình ảnh và sức nặng pháp lý của nguyên bản; chú thích cung cấp bối cảnh hôn nhân nối dõi mà không biến phần giải thích thành chính văn.
translation_notes:
  register: Văn phong pháp lý-trần thuật trang trọng nhưng hiện đại. Dùng “người” làm đại từ quy chiếu để tránh sắc thái quá khẩu ngữ; giữ “trưởng lão” vì phù hợp thiết chế cộng đồng trong bối cảnh. Cụm “anh em mình” bảo tồn sự không xác định của אָחִיו về anh hay em.
