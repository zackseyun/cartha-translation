  text: וְ/הָיָ֗ה הַ/בְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל שֵׁ֥ם אָחִ֖י/ו הַ/מֵּ֑ת וְ/לֹֽא יִמָּחֶ֥ה שְׁמ֖/וֹ מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: vi
  text: Người con trai đầu lòng mà nàng sinh ra sẽ tiếp nối danh phận của người anh em đã chết[a], để tên người ấy không bị xóa khỏi Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “sẽ đứng lên trên danh của người anh em đã chết”; nghĩa là người con ấy sẽ tiếp nối dòng dõi và địa vị của người đã chết trong Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: người con trai đầu lòng
  rationale: Danh từ ở dạng giống đực chỉ người con đầu lòng là nam trong bối cảnh luật hôn nhân nối dõi; cách dịch này làm rõ giới tính ngữ pháp và giữ sắc thái pháp lý-gia tộc.
- source_word: תֵּלֵד
  choice: mà nàng sinh ra
  rationale: Động từ ngôi thứ ba giống cái số ít quy về người góa phụ; “nàng sinh ra” tự nhiên, trang trọng và giữ rõ chủ thể người mẹ.
- source_word: יָקוּם עַל שֵׁם
  choice: sẽ nối danh
  rationale: Thành ngữ này nói đến việc duy trì danh phận và dòng dõi của người đã chết, không nhất thiết là đặt cho đứa trẻ đúng tên riêng của người ấy. “Nối danh” truyền đạt lực pháp lý-gia tộc mà không diễn giải quá mức.
- source_word: אָחִיו הַמֵּת
  choice: người anh em đã chết
  rationale: Giữ cách gọi quan hệ thân tộc tương đối rộng của אָח và tránh buộc tiếng Việt phải xác định là anh hay em; sở hữu được để theo ngữ cảnh của điều luật.
- source_word: יִמָּחֶה
  choice: bị xóa
  rationale: Dạng Niphal của מחה mang nghĩa bị xóa sạch hoặc xóa bỏ; “bị xóa” phù hợp tự nhiên với “tên” và vẫn giữ hình ảnh của nguyên văn.
- source_word: מִיִּשְׂרָאֵל
  choice: khỏi Israel
  rationale: Giới từ מן biểu thị sự loại khỏi dân hay cộng đồng Israel; “khỏi Israel” ngắn gọn và chính xác.
theological_decisions:
- issue: Ý nghĩa của công thức luật nối dõi יָקוּם עַל שֵׁם
  choice: Đứa con sẽ tiếp nối danh phận và dòng dõi của người anh em đã chết.
  alternative: Đứa con sẽ được đặt đúng tên riêng của người anh em đã chết.
  rationale: Trong bối cảnh luật nối dõi, thành ngữ nhấn mạnh việc bảo tồn dòng dõi, vị thế gia tộc và sự tưởng niệm người chết trong Israel. “Nối danh” giữ ý nghĩa này mà không loại trừ sắc thái của hình ảnh nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” để chỉ người góa phụ theo ngữ cảnh gần, “nối danh” để diễn đạt tự nhiên thành ngữ pháp lý Hê-bơ-rơ, và giữ “Israel” như tên riêng của dân giao ước.
