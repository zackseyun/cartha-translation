  text: וְ/קָֽרְאוּ ל֥/וֹ זִקְנֵי עִיר֖/וֹ וְ/דִבְּר֣וּ אֵלָ֑י/ו וְ/עָמַ֣ד וְ/אָמַ֔ר לֹ֥א חָפַ֖צְתִּי לְ/קַחְתָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: vi
  text: 'Bấy giờ, các trưởng lão của thành người ấy phải gọi người ấy đến và nói với người ấy. Nếu người ấy vẫn khăng khăng[a] và nói: “Tôi không muốn lấy nàng làm vợ[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “và người ấy đứng.” Trong ngữ cảnh, cách nói này có lẽ chỉ việc người ấy vẫn kiên quyết với quyết định của mình.'
    reason: Giữ hình ảnh và mức độ mơ hồ của וְעָמַד, đồng thời giải thích cách hiểu theo ngữ cảnh.
  - marker: b
    text: 'Sát nghĩa: “lấy nàng.” Trong ngữ cảnh luật nối dõi, đây là cách nói chỉ việc lấy nàng làm vợ.'
    reason: Nêu thành ngữ hôn nhân trong tiếng Hê-bơ-rơ và bảo lưu cách diễn đạt sát chữ.
lexical_decisions:
- source_word: וְקָרְאוּ לוֹ
  choice: phải gọi người ấy đến
  rationale: Trong mạch văn luật pháp, động từ mang ý nghĩa thủ tục bắt buộc. “Gọi… đến” tự nhiên trong tiếng Việt và diễn đạt việc các trưởng lão triệu người ấy đến, nhưng không dùng thuật ngữ pháp lý quá hiện đại.
- source_word: זִקְנֵי עִירוֹ
  choice: các trưởng lão trong thành của người ấy
  rationale: זִקְנֵי chỉ những người lãnh đạo được công nhận trong cộng đồng; עִיר có thể là thành hoặc thị trấn. “Các trưởng lão trong thành” vừa gần nguyên văn vừa phù hợp bối cảnh xã hội cổ đại.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: và nói với người ấy
  rationale: Cách dịch trực tiếp, tự nhiên, giữ sắc thái các trưởng lão đích thân nói với người ấy mà không thêm nội dung như khuyên bảo hay thuyết phục.
- source_word: וְעָמַד
  choice: nhưng nếu người ấy vẫn giữ nguyên lập trường
  rationale: Nghĩa đen là “và người ấy đứng”; trong thủ tục này, cách nói diễn tả việc người ấy vẫn kiên quyết sau khi nghe các trưởng lão. Bản dịch chuyển tải ý nghĩa theo ngữ cảnh, còn chú thích giữ hình ảnh nguyên văn.
- source_word: לֹא חָפַצְתִּי
  choice: Tôi không muốn
  rationale: חפץ có thể chỉ mong muốn, ưa thích hoặc sẵn lòng. “Không muốn” là cách nói hiện đại, rõ ràng và không thu hẹp câu nói chỉ còn một tuyên bố pháp lý về sự không sẵn lòng.
- source_word: לְקַחְתָּהּ
  choice: lấy nàng làm vợ
  rationale: לקח với một phụ nữ thường là thành ngữ chỉ việc cưới nàng. “Lấy nàng làm vợ” diễn đạt rõ nghĩa trong tiếng Việt, trong khi chú thích bảo lưu cách nói sát chữ “nhận/lấy nàng”.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “phải” để thể hiện tính quy định của thủ tục; dùng “người ấy” nhằm tránh gán thêm sắc thái kính trọng hay khinh miệt không có trong nguyên văn. “Nàng” phù hợp lối kể trang trọng và giúp phân biệt rõ người phụ nữ được nói đến.
