- from: 'Bấy giờ, các trưởng lão trong thành của người ấy phải gọi người ấy đến và nói với người ấy. Nhưng nếu người ấy vẫn giữ nguyên lập trường[a] và nói: “Tôi không muốn lấy nàng làm vợ[b],”'
  to: 'Bấy giờ, các trưởng lão của thành người ấy phải gọi người ấy đến và nói với người ấy. Nếu người ấy vẫn khăng khăng[a] và nói: “Tôi không muốn lấy nàng làm vợ[b],”'
  rationale: Bản sửa loại bỏ sắc thái đối lập thêm vào bởi “Nhưng”, làm gọn cách chỉ cộng đồng địa phương, và điều chỉnh chú thích về וְעָמַד để bám sát tiếng Hê-bơ-rơ hơn. Ý nghĩa thủ tục, sự kiên quyết của người đàn ông, và thành ngữ hôn nhân đều được giữ nguyên.
