  terminology: “Yahweh” thích hợp cho יהוה. “Điều ghê tởm” giữ được sắc thái mạnh của תוֹעֲבָה; “điều bất công” là cách dịch phù hợp, không thu hẹp quá mức, cho עָוֶל.
