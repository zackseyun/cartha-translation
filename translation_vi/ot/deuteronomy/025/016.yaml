  source_fidelity: Bản dịch phản ánh đúng cấu trúc giải thích của כִּי, sự lặp lại nhấn mạnh của hai cụm כָּל עֹשֵׂה, và ý nghĩa đạo đức của עָוֶל trong ngữ cảnh cân, đấu gian dối. Tuy nhiên, אֱלֹהֶיךָ mang hậu tố ngôi thứ hai số ít; “của anh em” đã chuyển thành số nhiều. Cần dùng “của ngươi” để giữ cách xưng hô số ít của nguyên văn trong văn cảnh Phục Truyền Luật Lệ Ký.
