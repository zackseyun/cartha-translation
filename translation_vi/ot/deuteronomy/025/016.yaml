base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: vi
  text: Vì bất cứ ai làm những điều này, tức là bất cứ ai làm điều bất công[a], đều là điều ghê tởm đối với Yahweh, Đức Chúa Trời của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất cứ ai làm điều sai trái” hoặc “bất cứ ai hành động bất công.” Từ Hê-bơ-rơ עָוֶל có thể chỉ sự sai trái, bất công hoặc bất chính; trong ngữ cảnh này, từ ấy đặc biệt nói đến việc gian dối trong mua bán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích lý do cho lệnh cấm ở câu trước.
- source_word: תוֹעֲבַת
  choice: điều ghê tởm
  rationale: 'Diễn đạt tự nhiên nhưng vẫn giữ sắc thái đạo đức mạnh của danh từ Hê-bơ-rơ: điều đáng ghê tởm trước mặt Đức Chúa Trời.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được ghi trực tiếp trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của anh em
  rationale: Hậu tố ngôi hai số ít giống đực hướng đến Israel như một cộng đồng; “anh em” phù hợp văn phong diễn từ trong Phục Truyền Luật Lệ Ký.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: bất cứ ai làm những điều ấy
  rationale: Giữ ý khái quát của כָּל cùng kết cấu phân từ, đồng thời dùng tiếng Việt hiện đại, rõ nghĩa.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: bất cứ ai làm điều bất công
  rationale: Giữ phép lặp “bất cứ ai làm” của nguyên văn; “điều bất công” thể hiện עָוֶל trong bối cảnh cân và đấu gian dối mà không thu hẹp hoàn toàn phạm vi nghĩa.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng danh riêng יהוה; phiên âm “Yahweh” bảo toàn sự phân biệt giữa danh riêng và tước hiệu.
- issue: Phạm vi của עָוֶל
  choice: điều bất công
  alternative: điều sai trái / hành động gian dối
  rationale: “Bất công” giữ chiều kích đạo đức và xã hội của từ; ngữ cảnh đặc biệt nói đến sự gian dối trong giao dịch, nhưng từ Hê-bơ-rơ có nghĩa rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Phép lặp của hai cụm כָּל עֹשֵׂה được giữ để bảo toàn nhịp điệu và sức nhấn của nguyên văn. Dấu chú thích đặt sau toàn câu vì chú thích giải nghĩa cụm kết thúc câu.
