  text: אֲשֶׁ֨ר קָֽרְ/ךָ֜ בַּ/דֶּ֗רֶךְ וַ/יְזַנֵּ֤ב בְּ/ךָ֙ כָּל הַ/נֶּחֱשָׁלִ֣ים אַֽחַרֶ֔י/ךָ וְ/אַתָּ֖ה עָיֵ֣ף וְ/יָגֵ֑עַ וְ/לֹ֥א יָרֵ֖א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: vi
  text: thể nào hắn đã gặp anh em trên đường, tấn công tất cả những người kiệt sức tụt lại phía sau anh em, trong khi anh em mệt mỏi và rã rời; hắn không kính sợ Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: chặn đánh anh em
  rationale: Trong ngữ cảnh cuộc tấn công của A-ma-léc, động từ mang ý gặp/chạm trán với sắc thái thù địch; “chặn đánh” diễn đạt tự nhiên hành động phục kích trên đường mà không khẳng định quá mức rằng họ đã bị giết.
- source_word: וַיְזַנֵּב
  choice: đánh vào
  rationale: Động từ liên hệ đến phần đuôi/hậu quân, nên chỉ việc tấn công những người ở phía sau; kết hợp với mệnh đề kế tiếp tránh cách diễn đạt gượng như “cắt đuôi”.
- source_word: הַנֶּחֱשָׁלִים
  choice: những người kiệt sức tụt lại
  rationale: Từ này chỉ những người yếu sức hoặc rã rời nên bị tụt lại; bản dịch giữ cả tình trạng suy kiệt lẫn vị trí phía sau.
- source_word: עָיֵף וְיָגֵעַ
  choice: mệt mỏi và rã rời
  rationale: Giữ hai từ gần nghĩa của tiếng Hê-bơ-rơ, với cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: hắn không kính sợ Đức Chúa Trời
  rationale: “Kính sợ” bảo toàn ý niệm vừa sợ uy quyền vừa có lòng tôn kính; chủ thể số ít được giữ theo văn mạch nói về A-ma-léc.
theological_decisions:
- issue: Chủ thể của mệnh đề “không kính sợ Đức Chúa Trời”
  choice: hắn, tức A-ma-léc
  alternative: anh em, tức dân Y-sơ-ra-ên
  rationale: Cú pháp và dòng kể tự nhiên tiếp tục lấy A-ma-léc làm chủ thể của các động từ số ít; cách hiểu thay đổi chủ thể không được biểu thị rõ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi hai số ít tập thể chỉ dân Y-sơ-ra-ên, và “hắn” để phân biệt rõ A-ma-léc là đối tượng thù địch.
