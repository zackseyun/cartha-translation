  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: vi
  text: Khi Gia-vê, Đức Chúa Trời của anh em, cho anh em được yên nghỉ khỏi mọi kẻ thù chung quanh, trong xứ mà Gia-vê, Đức Chúa Trời của anh em, ban cho anh em làm cơ nghiệp để chiếm hữu, thì anh em phải xóa sạch sự tưởng nhớ về A-ma-léc khỏi dưới bầu trời. Đừng quên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: Khi ... cho ... được yên nghỉ
  rationale: Cụm này mở đầu hoàn cảnh tương lai dẫn đến mệnh lệnh; cách diễn đạt giữ sắc thái thời gian và ý khiến được nghỉ của động từ.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc và rõ ràng trong tiếng Việt cho Danh Đức Chúa Trời, thay vì thay bằng một tước hiệu.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: khỏi mọi kẻ thù chung quanh
  rationale: Giữ cả ý toàn thể của כֹּל và phạm vi bao quanh của מִסָּבִיב.
- source_word: נַחֲלָה
  choice: cơ nghiệp
  rationale: Thuật ngữ trang trọng, quen thuộc trong văn cảnh giao ước về đất được ban và giữ được ý thừa hưởng.
- source_word: לְרִשְׁתָּהּ
  choice: để chiếm hữu
  rationale: Diễn đạt hành động nhận lấy và nắm quyền sở hữu xứ; tân ngữ đã rõ từ 'xứ'.
- source_word: תִּמְחֶה
  choice: phải xóa sạch
  rationale: Truyền đạt lực mệnh lệnh và nghĩa xóa bỏ hoàn toàn của מחה bằng tiếng Việt tự nhiên.
- source_word: זֵכֶר
  choice: ký ức
  rationale: Giữ nghĩa trực tiếp là điều được nhớ đến hoặc sự tưởng nhớ, không tự ý thu hẹp thành chỉ tên tuổi hay mở rộng thành toàn bộ dân tộc.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: khỏi dưới trời
  rationale: Bảo tồn hình ảnh và phạm vi của thành ngữ Hê-bơ-rơ thay vì làm phẳng thành 'khỏi mặt đất'.
- source_word: לֹא תִּשְׁכָּח
  choice: Đừng quên
  rationale: Câu cấm ngắn, trực tiếp, giữ nguyên sức nhấn mạnh ở cuối câu.
theological_decisions:
- issue: Cách thể hiện Danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp Danh riêng; bản dịch vì thế giữ một dạng tên riêng thay vì thay bằng tước hiệu. 'Giê-hô-va' là dạng tiếng Việt phổ biến, dễ nhận biết.
- issue: Đối tượng của việc xóa bỏ trong זֵכֶר עֲמָלֵק
  choice: ký ức về A-ma-léc
  alternative: dấu tích của A-ma-léc
  rationale: זֵכֶר trước hết có thể chỉ ký ức hay sự tưởng nhớ; không diễn giải quá mức thành một khái niệm cụ thể hơn dù văn cảnh rộng hơn liên quan đến sự diệt trừ A-ma-léc.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Đại từ 'anh em' biểu thị đối tượng tập thể số ít của nguyên văn theo cách tự nhiên trong tiếng Việt. Giữ câu kết ngắn 'Đừng quên' để bảo toàn nhịp và sức nhấn mạnh.
