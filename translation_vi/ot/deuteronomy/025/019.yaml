revisions:
- from: Khi Giê-hô-va, Đức Chúa Trời của anh em, cho anh em được yên nghỉ khỏi mọi kẻ thù chung quanh, trong xứ mà Giê-hô-va, Đức Chúa Trời của anh em, ban cho anh em làm cơ nghiệp để chiếm hữu, thì anh em phải xóa sạch ký ức về A-ma-léc khỏi dưới trời. Đừng quên.
  to: Khi Gia-vê, Đức Chúa Trời của anh em, cho anh em được yên nghỉ khỏi mọi kẻ thù chung quanh, trong xứ mà Gia-vê, Đức Chúa Trời của anh em, ban cho anh em làm cơ nghiệp để chiếm hữu, thì anh em phải xóa sạch sự tưởng nhớ về A-ma-léc khỏi dưới bầu trời. Đừng quên.
  rationale: Chỉnh tên thần linh cho nhất quán với Yahweh trong nguồn; thay «ký ức» bằng «sự tưởng nhớ» để sát nghĩa và tự nhiên hơn. Các thành phần còn lại được giữ nguyên vì phản ánh đúng nguyên văn, kể cả hình ảnh «khỏi dưới bầu trời» và mệnh lệnh kết «Đừng quên».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:11:01Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc điều kiện–mệnh lệnh, ý «ban cho được yên nghỉ khỏi mọi kẻ thù», đất làm cơ nghiệp để chiếm hữu, và mệnh lệnh xóa bỏ «sự tưởng nhớ» về A-ma-léc. Tuy nhiên, «Giê-hô-va» không nhất quán với quyết định tên riêng trong hồ sơ nguồn, vốn yêu cầu Yahweh. «Ký ức» có thể gợi một hồi ức cá nhân hơn là זֵכֶר, là sự tưởng nhớ/memorial remembrance.
  naturalness: Câu văn nhìn chung trang trọng và dễ hiểu. «Sự tưởng nhớ» tự nhiên và sát ngữ cảnh hơn «ký ức». Cụm «khỏi dưới bầu trời» giữ hình ảnh Hê-bơ-rơ; tuy hơi theo lối Kinh Thánh, vẫn rõ nghĩa trong bản văn trang trọng.
  terminology: Dùng «Gia-vê» để chuyển Yahweh theo cách đọc tiếng Việt hiện đại, thay cho «Giê-hô-va». Giữ «Đức Chúa Trời», «cơ nghiệp», và «chiếm hữu» là phù hợp với văn cảnh giao ước. Phiên âm «A-ma-léc» được giữ nhất quán.
  issues:
  - severity: medium
    issue: Tên riêng יהוה được dịch là «Giê-hô-va».
    rationale: Hồ sơ nguồn và quyết định thần học quy định Yahweh; trong tiếng Việt, «Gia-vê» là dạng phiên âm phù hợp hơn để phản ánh lựa chọn này. «Giê-hô-va» tương ứng với Jehovah, là một phương án khác.
  - severity: low
    issue: «ký ức về A-ma-léc» chưa chuyển tải tối ưu זֵכֶר.
    rationale: זֵכֶר chỉ sự tưởng nhớ, ký ức lưu truyền, hoặc tưởng niệm. «Sự tưởng nhớ về A-ma-léc» tránh sắc thái quá cá nhân của «ký ức» và giữ độ rộng của nguyên văn.
  revised_text: Khi Gia-vê, Đức Chúa Trời của anh em, cho anh em được yên nghỉ khỏi mọi kẻ thù chung quanh, trong xứ mà Gia-vê, Đức Chúa Trời của anh em, ban cho anh em làm cơ nghiệp để chiếm hữu, thì anh em phải xóa sạch sự tưởng nhớ về A-ma-léc khỏi dưới bầu trời. Đừng quên.
  revised_footnotes:
  - marker: a
    text: 'Hoặc: «ký ức về A-ma-léc».'
    reason: Giữ phương án từ vựng cho זֵכֶר («ký ức/sự tưởng nhớ») theo dấu vết kiểm tra tiếng Anh, không thu hẹp nghĩa của từ gốc.
  revision_rationale: Chỉnh tên thần linh cho nhất quán với Yahweh trong nguồn; thay «ký ức» bằng «sự tưởng nhớ» để sát nghĩa và tự nhiên hơn. Các thành phần còn lại được giữ nguyên vì phản ánh đúng nguyên văn, kể cả hình ảnh «khỏi dưới bầu trời» và mệnh lệnh kết «Đừng quên».
