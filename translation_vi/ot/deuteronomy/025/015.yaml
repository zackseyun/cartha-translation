  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: vi
  text: Ngươi phải có quả cân đủ và đúng chuẩn; phải có một ê-pha[a] đủ và đúng chuẩn, để ngươi được sống lâu trên đất mà Yahweh, Đức Chúa Trời của ngươi, đang ban cho ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ê-pha là một đơn vị đo dung tích khô thời cổ, khoảng 22 lít; dung tích chính xác không chắc chắn.
    reason: Giải thích đơn vị đo cổ và bảo tồn sự bất định lịch sử.
lexical_decisions:
- source_word: אֶבֶן
  choice: quả cân
  rationale: Nghĩa đen là “đá”, nhưng trong bối cảnh buôn bán, từ này chỉ hòn đá dùng làm quả cân; “quả cân” truyền đạt đúng chức năng và tự nhiên trong tiếng Việt.
- source_word: שְׁלֵמָה
  choice: đầy đủ
  rationale: Từ này diễn tả sự trọn vẹn, không thiếu hụt; khi đi với đơn vị đo lường, “đầy đủ” cho thấy chuẩn cân đong không bị làm hụt.
- source_word: וָצֶדֶק
  choice: và công bằng
  rationale: Trong bối cảnh thương mại, từ này vừa nói đến chuẩn đúng vừa mang chiều kích đạo đức; “công bằng” giữ được ý ấy mà vẫn tự nhiên.
- source_word: יִהְיֶה לָּךְ
  choice: anh em phải có
  rationale: Cấu trúc nghĩa đen là “sẽ có cho anh em”, nhưng trong văn luật pháp nó có hiệu lực như một yêu cầu; “phải có” diễn đạt rõ sức bắt buộc.
- source_word: אֵיפָה
  choice: ê-pha
  rationale: Đây là tên một đơn vị đo dung tích khô cụ thể thời cổ; phiên âm giữ được tính đặc thù mà không thay bằng một đơn vị hiện đại thiếu tương đương.
- source_word: לְמַעַן
  choice: để
  rationale: Giới từ này dẫn vào mục đích hoặc kết quả; “để” ngắn gọn, tự nhiên và duy trì mối liên hệ giữa sự vâng lời với phước lành giao ước.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: anh em được sống lâu
  rationale: Nghĩa đen là “những ngày của anh em được kéo dài”. Cách dịch này truyền đạt rõ thành ngữ Hê-bơ-rơ trong tiếng Việt hiện đại.
- source_word: עַל הָאֲדָמָה
  choice: trên đất
  rationale: Trong Phục Truyền Luật Lệ Ký, cụm này thường chỉ miền đất giao ước; “trên đất” bám sát giới từ và vẫn tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, phân biệt danh giao ước này với tước hiệu אֱלֹהִים.
- source_word: נֹתֵן לָךְ
  choice: đang ban cho anh em
  rationale: Phân từ diễn tả hành động ban đất như đang diễn tiến hoặc sắp thành hiện thực trong lời kêu gọi giao ước của sách.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tư cách danh riêng và tránh đồng nhất nó với một tước hiệu.
- issue: Mối liên hệ giữa sự công bằng và việc sống lâu
  choice: Giữ cấu trúc mục đích/kết quả “để anh em được sống lâu”
  alternative: Diễn giải thành lời bảo đảm tuyệt đối hoặc nguyên tắc nhân quả phổ quát
  rationale: לְמַעַן có thể mang sắc thái mục đích/kết quả trong bối cảnh phước lành giao ước. Bản dịch không giải quyết quá mức sự căng thẳng thần học bằng cách biến câu này thành công thức máy móc.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số ít tập thể hướng đến dân Israel, phù hợp lối xưng hô phổ biến trong văn Kinh Thánh tiếng Việt. Nhịp lặp “đầy đủ và công bằng” được giữ để phản ánh cấu trúc song song của nguyên văn.
