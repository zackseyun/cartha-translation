revisions:
- from: Anh em phải có quả cân đầy đủ và công bằng, phải có ê-pha[a] đầy đủ và công bằng, để anh em được sống lâu trên đất mà Yahweh, Đức Chúa Trời của anh em, đang ban cho anh em.
  to: Ngươi phải có quả cân đủ và đúng chuẩn; phải có một ê-pha[a] đủ và đúng chuẩn, để ngươi được sống lâu trên đất mà Yahweh, Đức Chúa Trời của ngươi, đang ban cho ngươi.
  rationale: Bản sửa thay đại từ số nhiều bằng ngôi số ít tập thể theo nguyên văn, thêm “một” trước “ê-pha” cho tự nhiên, và thay cách kết hợp từ không tự nhiên bằng “đủ và đúng chuẩn”. Bản dịch vẫn giữ phép lặp, tính quy phạm của mệnh lệnh, danh Yahweh, và sắc thái đang diễn tiến của “đang ban”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:10:58Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc song song, lực mệnh lệnh pháp lý, lời hứa sống lâu trên đất, và phân từ “đang ban”. Tuy nhiên, “anh em” là số nhiều trong khi nguyên văn nhất quán dùng ngôi thứ hai số ít (לְךָ/יָמֶיךָ), và cụm “đầy đủ và công bằng” gắn trực tiếp với “quả cân/ê-pha” không tự nhiên trong tiếng Việt.
  naturalness: Nên dùng “ngươi” trong văn phong luật pháp Kinh Thánh để vừa phản ánh số ít tập thể của nguyên văn vừa giữ sắc thái trang trọng. “Đủ và đúng chuẩn” diễn đạt tự nhiên hơn cho hai chuẩn cân đong, bảo toàn ý không thiếu hụt và phù hợp công lý/chuẩn mực trong giao dịch.
  terminology: Giữ “Yahweh, Đức Chúa Trời” và “ê-pha”. “Ê-pha” cần được giới thiệu với từ chỉ loại/định ngữ “một” để câu tiếng Việt hoàn chỉnh. Chú thích về đơn vị dung tích khô và tính bất định của quy đổi là phù hợp.
  issues:
  - severity: medium
    issue: Đại từ “anh em” không phản ánh ngôi thứ hai số ít của bản Hê-bơ-rơ.
    rationale: Cả hai lần לְךָ và cụm יָמֶיךָ đều là số ít. Trong ngữ cảnh luật pháp hướng đến Israel cách tập thể, “ngươi” là cách xưng hô tiếng Việt trang trọng, sát nguồn hơn mà không làm thay đổi đối tượng tập thể.
  - severity: medium
    issue: “Quả cân đầy đủ và công bằng” và “ê-pha đầy đủ và công bằng” chưa tự nhiên về kết hợp từ.
    rationale: Trong tiếng Việt, “công bằng” thường quy cho người, cách xử sự, hay giao dịch hơn là trực tiếp quy cho một quả cân hoặc đơn vị đo. “Đủ và đúng chuẩn” chuyển tải sự trọn vẹn/không thiếu (שְׁלֵמָה) và chuẩn mực công chính trong thương mại (צֶדֶק) một cách tự nhiên.
  revised_text: Ngươi phải có quả cân đủ và đúng chuẩn; phải có một ê-pha[a] đủ và đúng chuẩn, để ngươi được sống lâu trên đất mà Yahweh, Đức Chúa Trời của ngươi, đang ban cho ngươi.
  revised_footnotes:
