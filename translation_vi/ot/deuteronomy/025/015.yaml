    text: Ê-pha là một đơn vị đo dung tích khô thời cổ, khoảng 22 lít; dung tích chính xác không chắc chắn.
    reason: Giải thích đơn vị đo cổ và bảo tồn sự bất định lịch sử.
  revision_rationale: Bản sửa thay đại từ số nhiều bằng ngôi số ít tập thể theo nguyên văn, thêm “một” trước “ê-pha” cho tự nhiên, và thay cách kết hợp từ không tự nhiên bằng “đủ và đúng chuẩn”. Bản dịch vẫn giữ phép lặp, tính quy phạm của mệnh lệnh, danh Yahweh, và sắc thái đang diễn tiến của “đang ban”.
