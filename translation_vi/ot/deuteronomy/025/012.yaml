  text: you shall cut off her hand[b][a]; your eye shall not pity.
translation:
  language: vi
  text: thì anh em phải chặt bàn tay của người phụ nữ ấy[a]; mắt anh em không được thương xót[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng bàn tay của người phụ nữ ấy.” Từ Hê-bơ-rơ có thể chỉ riêng lòng bàn tay hoặc bàn tay nói chung.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mắt anh em không được dung tha.” Đây là thành ngữ Hê-bơ-rơ dùng hình ảnh con mắt để diễn tả việc không thương xót hoặc không nương tay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: thì anh em phải chặt
  rationale: Động từ קצץ chỉ hành động cắt hoặc chặt đứt. “Phải chặt” giữ nguyên tính trực tiếp và nghiêm khắc của điều luật; từ nối וְ được diễn đạt là “thì” để câu tiếng Việt nối tự nhiên với tình huống ở câu trước.
- source_word: אֶת
  choice: '[dấu chỉ tân ngữ xác định, không dịch]'
  rationale: Dấu chỉ tân ngữ trực tiếp trong tiếng Hê-bơ-rơ không có từ tương đương cần biểu đạt trong tiếng Việt.
- source_word: כַּפָּהּ
  choice: bàn tay của người phụ nữ ấy
  rationale: כַּף có thể chỉ lòng bàn tay hoặc bàn tay. “Bàn tay” là cách diễn đạt tự nhiên trong tiếng Việt khi đi với hành động chặt, đồng thời chú thích bảo lưu nghĩa hẹp hơn là “lòng bàn tay.” Đại từ sở hữu giống cái được nói rõ là người phụ nữ ấy theo ngữ cảnh.
- source_word: לֹא
  choice: không được
  rationale: Trong mệnh lệnh pháp lý phủ định, “không được” truyền đạt tự nhiên lực cấm đoán của לֹא với thể động từ chưa hoàn thành.
- source_word: תָחוֹס
  choice: thương xót
  rationale: חוס có thể mang nghĩa thương xót, dung tha hoặc tiếc. “Thương xót” phù hợp với thành ngữ có chủ thể là mắt và giữ được sắc thái cảm thương.
- source_word: עֵינֶךָ
  choice: mắt anh em
  rationale: Giữ hình ảnh cụ thể “mắt” của nguyên văn thay vì giản lược thành “anh em,” qua đó bảo tồn công thức pháp lý sinh động thường gặp trong Phục Truyền Luật Lệ Ký. Dạng số ít được dịch bằng “anh em” theo lối xưng hô cộng đồng trang trọng.
theological_decisions:
- issue: Mức độ trực tiếp của hình phạt pháp lý
  choice: Giữ mệnh lệnh cụ thể “phải chặt bàn tay” và thành ngữ “mắt anh em không được thương xót.”
  alternative: Diễn ý thành “hãy chặt tay người ấy và đừng dung tha.”
  rationale: Nguyên văn trình bày trực tiếp một hình phạt trong bộ luật Israel và cố ý dùng hình ảnh con mắt. Bản dịch không làm nhẹ mức độ nghiêm khắc, cũng không diễn giải thêm về cách áp dụng hoặc ý nghĩa thần học của điều luật.
- issue: Phạm vi nghĩa của כַּף
  choice: Dùng “bàn tay” trong chính văn và ghi chú khả năng “lòng bàn tay.”
  alternative: Dịch ngay trong chính văn là “lòng bàn tay.”
  rationale: Từ Hê-bơ-rơ cho phép cả hai nghĩa. “Bàn tay” tự nhiên hơn trong tiếng Việt với động từ “chặt,” nhưng ghi chú cần bảo lưu tính không xác định về giải phẫu trong nguyên văn.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “anh em” cho đại từ ngôi thứ hai số ít hướng đến cộng đồng giao ước; gọi rõ “người phụ nữ ấy” để tránh đại từ tiếng Việt mơ hồ. Các dấu chú thích [a], [b] được đặt ngay sau cụm từ tương ứng.
