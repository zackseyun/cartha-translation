    rationale: Nguyên văn chỉ dùng thành ngữ “mắt ngươi không được thương xót/nương tay.” Việc nêu rõ “miễn hình phạt” là một suy diễn về hiệu quả pháp lý, không phải nội dung từ vựng được phát biểu trong câu. Chú thích nên chỉ giải thích thành ngữ mà không thêm cơ chế hay kết quả cụ thể.
