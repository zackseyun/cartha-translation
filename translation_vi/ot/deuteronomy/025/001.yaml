source:
  edition: WLC
  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: vi
  text: Nếu có sự tranh chấp giữa những người đàn ông và họ đến tòa, thì các thẩm phán sẽ xét xử họ, tuyên người vô tội là vô tội và tuyên người có tội là có tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “tuyên người công chính là công chính và tuyên kẻ gian ác là gian ác”; trong ngữ cảnh này, đây là các thuật ngữ pháp đình, nghĩa là tuyên bên có lý là vô tội và tuyên bên có lỗi là có tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Nếu có
  rationale: Mở đầu một điều luật theo dạng tình huống; “nếu có” tự nhiên trong văn phong pháp lý tiếng Việt và giữ được sắc thái điều kiện.
- source_word: רִיב
  choice: sự tranh chấp
  rationale: Trong ngữ cảnh pháp lý, từ này chỉ một vụ tranh chấp hay kiện tụng; “tranh chấp” rõ ràng và không thu hẹp thành cãi vã cá nhân.
- source_word: בֵּין אֲנָשִׁים
  choice: giữa những người đàn ông
  rationale: Danh từ Hê-bơ-rơ là số nhiều giống đực và trong bối cảnh này chỉ các đương sự nam; bản dịch giữ nét giới tính của nguyên văn.
- source_word: אֶל הַמִּשְׁפָּט
  choice: đến tòa để được xét xử
  rationale: Nguyên văn là “đến sự xét xử/phán xét”, tức bước vào thủ tục tư pháp; cách dịch này tự nhiên và làm rõ bối cảnh mà không thay đổi ý nghĩa.
- source_word: וּשְׁפָטוּם
  choice: các thẩm phán phải phân xử cho họ
  rationale: Động từ chủ động số nhiều có hậu tố chỉ các đương sự. Chủ thể được hiểu theo bối cảnh là những người xét xử; “phân xử” diễn đạt việc quyết định vụ tranh chấp.
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: tuyên người có lý là vô tội
  rationale: Trong pháp đình, צדק ở thể Hiphil nghĩa là tuyên hoặc xác nhận một người đúng lẽ, không phải làm cho người ấy trở nên công chính về đạo đức. “Người có lý” phản ánh địa vị đúng trong vụ kiện.
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: tuyên kẻ có lỗi là có tội
  rationale: Trong ngữ cảnh tư pháp, רשע ở thể Hiphil là tuyên có tội. Cách dịch duy trì cặp đối xứng pháp lý với việc tuyên người có lý là vô tội.
theological_decisions:
- issue: Ý nghĩa pháp lý hay đạo đức của צדק/רשע
  choice: 'Đọc theo nghĩa phán quyết tư pháp: tuyên người có lý là vô tội và kẻ có lỗi là có tội'
  alternative: Đọc như sự mô tả tổng quát về người công chính và kẻ gian ác
  rationale: Toàn câu nói về việc đến nơi xét xử và được phân xử, nên các từ này trước hết chỉ vị thế của hai bên trong vụ kiện. Cách dịch tránh nhập vào đây một ý niệm thần học về sự biến đổi đạo đức.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại, với cấu trúc điều kiện rõ ràng. Dùng “thẩm phán” làm chủ thể hàm ẩn theo ngữ cảnh và giữ cặp phán quyết đối xứng của nguyên văn.
