revisions:
- from: Nếu có sự tranh chấp giữa những người đàn ông và họ đến tòa để được xét xử, thì các thẩm phán phải phân xử cho họ, tuyên người có lý là vô tội và tuyên kẻ có lỗi là có tội.[a]
  to: Nếu có sự tranh chấp giữa những người đàn ông và họ đến tòa, thì các thẩm phán sẽ xét xử họ, tuyên người vô tội là vô tội và tuyên người có tội là có tội.[a]
  rationale: Bản sửa loại bỏ sắc thái bắt buộc được thêm vào, dùng trật tự câu sát nguyên văn hơn, và thay cách diễn đạt lặp “kẻ có lỗi là có tội” bằng các thuật ngữ phán quyết pháp lý tự nhiên. Chú thích vẫn giữ cặp từ sát chữ “công chính/gian ác” và giải thích rằng nghĩa ở đây là tư pháp.
