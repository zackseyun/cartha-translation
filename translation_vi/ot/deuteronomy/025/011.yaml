source:
  edition: WLC
  text: כִּֽי יִנָּצ֨וּ אֲנָשִׁ֤ים יַחְדָּו֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/קָֽרְבָה֙ אֵ֣שֶׁת הָֽ/אֶחָ֔ד לְ/הַצִּ֥יל אֶת אִישָׁ֖/הּ מִ/יַּ֣ד מַכֵּ֑ה/וּ וְ/שָׁלְחָ֣ה יָדָ֔/הּ וְ/הֶחֱזִ֖יקָה בִּ/מְבֻשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: vi
  text: Nếu hai người đàn ông, một người và người anh em của người ấy[a], đang đánh nhau, và vợ của một trong hai người đến gần để cứu chồng nàng khỏi tay người đang đánh chồng nàng, rồi nàng đưa tay ra nắm lấy bộ phận sinh dục của người đó[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người anh em” ở đây có thể chỉ một người đồng bào hay người cùng cộng đồng, không nhất thiết là anh em ruột.
    reason: cultural_note
  - marker: b
    text: Nguyên ngữ dùng một cách nói uyển ngữ chỉ bộ phận kín của nam giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu một trường hợp luật định; “nếu” diễn đạt tự nhiên sắc thái điều kiện trong tiếng Việt, dù “khi” cũng có thể hiểu được.
- source_word: יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: hai người đàn ông đánh nhau
  rationale: Động từ chỉ sự ẩu đả, còn אֲנָשִׁים trong ngữ cảnh nói đến nam giới. Tiếng Việt không cần dịch riêng יַחְדָּו vì “đánh nhau” đã biểu đạt hành động tương hỗ.
- source_word: אִישׁ וְאָחִיו
  choice: một người với người anh em mình
  rationale: Giữ hình ảnh sát nguyên văn “một người và anh em của mình,” đồng thời dùng chú thích để tránh giới hạn nghĩa vào anh em ruột.
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: vợ của một người đến gần
  rationale: Theo sát cấu trúc Hê-bơ-rơ nhưng vẫn tự nhiên, và cho thấy đây là vợ của một trong hai người.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: để cứu chồng mình
  rationale: Trong quan hệ hôn nhân, אִישָׁהּ được diễn đạt rõ và tự nhiên là “chồng mình.”
- source_word: מִיַּד מַכֵּהוּ
  choice: khỏi tay người đang đánh chồng
  rationale: Giữ hình ảnh cụ thể “khỏi tay” và làm rõ đại từ chỉ người chồng để câu tiếng Việt không mơ hồ về đối tượng bị đánh.
- source_word: וְשָׁלְחָה יָדָהּ וְהֶחֱזִיקָה
  choice: rồi nàng đưa tay ra nắm lấy
  rationale: Diễn đạt tự nhiên chuỗi hành động đưa tay ra và nắm giữ; “nắm lấy” không cường điệu mức độ lực vượt quá điều văn bản xác quyết.
- source_word: בִּמְבֻשָׁיו
  choice: bộ phận sinh dục của người kia
  rationale: Danh từ số nhiều chỉ vùng kín/bộ phận kín của nam giới. “Bộ phận sinh dục” là cách nói hiện đại, trang trọng và đủ rõ; “người kia” xác định đó là đối thủ của chồng.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ, hiện đại và trang trọng. Bản dịch giữ cấu trúc câu điều kiện chưa hoàn tất vì câu 11 dẫn sang hình phạt ở câu 12. Dùng “nàng” để theo dõi chủ thể nữ rõ ràng mà vẫn giữ sắc thái dignified; tránh lối nói thô tục khi dịch thuật ngữ giải phẫu.
