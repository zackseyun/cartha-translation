revisions:
- from: Nếu hai người đàn ông đánh nhau, một người với người anh em mình[a], và vợ của một người đến gần để cứu chồng mình khỏi tay người đang đánh chồng, rồi nàng đưa tay ra nắm lấy bộ phận sinh dục của người kia[b],
