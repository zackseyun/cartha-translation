base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: vi
  text: Nếu các anh em trai cùng sống với nhau, một người trong số họ chết mà không có con trai[a], thì vợ của người đã chết không được kết hôn với một người đàn ông ngoài gia đình[b]. Người anh hoặc em trai của người chồng đã chết[c] phải đến với nàng[d], lấy nàng làm vợ và thực hiện bổn phận của người anh hoặc em chồng đối với nàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ nói cụ thể là “con trai”; một số cách hiểu pháp lý mở rộng ý này thành “không có con”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn nói sát là “không được ở bên ngoài với một người đàn ông xa lạ”, tức là không được kết hôn với người ngoài phạm vi gia đình có nghĩa vụ này.
    reason: lexical_alternative
  - marker: c
    text: Đây là anh hoặc em trai của người chồng đã chết. Nghĩa vụ này thường được gọi là hôn nhân nối dõi (levirate).
    reason: cultural_note
  - marker: d
    text: “Đến với nàng” là lối nói giảm trong tiếng Hê-bơ-rơ, chỉ sự kết hợp tình dục trong hôn nhân.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים
  choice: anh em
  rationale: Danh từ số nhiều giống đực thông thường chỉ những người anh em trai; ngữ cảnh luật pháp xác định nghĩa vụ thuộc về anh em trai của người chồng đã chết.
- source_word: יַחְדָּו
  choice: sống chung với nhau
  rationale: Diễn đạt tự nhiên ý cùng cư trú hoặc có sự gắn kết trong một hộ gia đình, nhưng không quy định quá cụ thể cách sắp xếp nơi ở.
- source_word: וּבֵן אֵין לוֹ
  choice: không có con trai
  rationale: Giữ đúng từ בֵּן, nghĩa là “con trai”, thay vì mở rộng thành “không có con” và qua đó giải quyết một vấn đề diễn giải.
- source_word: אֵשֶׁת הַמֵּת
  choice: vợ của người đã chết
  rationale: Theo sát cấu trúc Hê-bơ-rơ hơn “góa phụ”, dù về nghĩa nàng quả là góa phụ.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: lấy một người đàn ông bên ngoài gia đình
  rationale: Trong ngữ cảnh, זָר là người ngoài phạm vi quan hệ có nghĩa vụ này, không nhất thiết là người ngoại quốc. Cụm tiếng Việt làm rõ ý pháp lý của “ở bên ngoài” mà không hiểu sai là dân ngoại.
- source_word: יְבָמָהּ
  choice: anh em trai của chồng nàng
  rationale: Chỉ đích danh người anh hoặc em trai của người chồng đã chết; cách nói này tránh sự mơ hồ của từ “anh em rể” hay “anh em bên chồng” trong tiếng Việt.
- source_word: יָבֹא עָלֶיהָ
  choice: đến với nàng
  rationale: Giữ lối nói giảm trang trọng của nguyên văn về sự kết hợp vợ chồng; chú thích giải thích rõ hàm ý tình dục.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: lấy nàng làm vợ
  rationale: Tự nhiên trong tiếng Việt và truyền đạt đầy đủ hành vi cưới nàng làm vợ.
- source_word: וְיִבְּמָהּ
  choice: thực hiện bổn phận của người anh em chồng đối với nàng
  rationale: Truyền đạt động từ chuyên biệt về nghĩa vụ hôn nhân nối dõi mà không đưa thuật ngữ học thuật khó hiểu vào chính văn.
theological_decisions:
- issue: Phạm vi của điều kiện “không có con trai”
  choice: Giữ “không có con trai” trong chính văn.
  alternative: Dịch rộng hơn là “không có con”.
  rationale: Nguyên văn dùng từ cụ thể “con trai”; giữ nguyên sự cụ thể này tránh âm thầm quyết định phạm vi áp dụng của luật.
- issue: Cách diễn đạt nghĩa vụ hôn nhân nối dõi
  choice: Dùng ngôn ngữ quan hệ và bổn phận dễ hiểu trong chính văn.
  alternative: Dùng thuật ngữ chuyên môn “hôn nhân levirate” hoặc “tục nối dây”.
  rationale: Cách chọn này bảo toàn tính chất pháp lý và quan hệ gia đình của điều luật mà không gắn bản dịch với một thuật ngữ địa phương hoặc học thuật có thể gây hiểu lầm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” để tránh lặp từ trong một câu luật pháp dài, đồng thời giữ sắc thái dignified; tránh thuật ngữ vay mượn và cách gọi địa phương. Các chú thích được đặt ngay sau từ hoặc cụm từ liên quan theo thứ tự [a]–[d].
