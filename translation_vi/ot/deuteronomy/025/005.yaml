revisions:
- from: Nếu anh em sống chung với nhau, và một người trong họ qua đời mà không có con trai[a], thì vợ của người đã chết không được lấy một người đàn ông bên ngoài gia đình[b]. Anh em trai của chồng nàng[c] phải đến với nàng[d], lấy nàng làm vợ và thực hiện bổn phận của người anh em chồng đối với nàng.
  to: Nếu các anh em trai cùng sống với nhau, một người trong số họ chết mà không có con trai[a], thì vợ của người đã chết không được kết hôn với một người đàn ông ngoài gia đình[b]. Người anh hoặc em trai của người chồng đã chết[c] phải đến với nàng[d], lấy nàng làm vợ và thực hiện bổn phận của người anh hoặc em chồng đối với nàng.
  rationale: 'Bản sửa chỉ cải thiện độ rõ ràng và tính tự nhiên của tiếng Việt: xác định “anh em” là các anh em trai, thay cụm quan hệ họ hàng chưa tự nhiên bằng cách diễn đạt số ít rõ ràng, và làm cho cụm chỉ bổn phận ở cuối câu tương ứng với chủ ngữ đó. Không thay đổi phạm vi “không có con trai”, sắc thái uyển ngữ của “đến với nàng”, hay sự mơ hồ pháp lý vốn có của nguyên văn.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T21:11:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chủ chốt của tiếng Hê-bơ-rơ: điều kiện các anh em cùng cư trú, việc người chết không có con trai, lệnh cấm người vợ kết hôn với người đàn ông ngoài gia đình, và nghĩa vụ của anh/em trai người chồng. Tuy nhiên, cụm “Anh em trai của chồng nàng” chưa tự nhiên và có thể bị đọc như số nhiều, trong khi יְבָמָהּ chỉ người anh hoặc em trai của người chồng trong vai trò được nêu ở đây.'
  naturalness: Cần làm rõ giới tính và số nhiều ở câu mở đầu bằng “các anh em trai”, bỏ sự lặp trong “sống chung với nhau”, và diễn đạt nhất quán, tự nhiên hơn về người anh hoặc em trai của người chồng.
  terminology: “Con trai”, “đến với nàng”, và “lấy nàng làm vợ” phù hợp với sắc thái nguyên ngữ và văn phong luật pháp. “Hôn nhân nối dõi” chỉ nên được nêu như một nhãn văn hóa trong chú thích, không thay thế cách diễn đạt trung tính trong chính văn.
  issues:
  - severity: medium
    issue: “Anh em trai của chồng nàng” không xác định tự nhiên người thực hiện nghĩa vụ.
    rationale: Cụm này dễ gợi một nhóm các anh em trai, còn tiếng Hê-bơ-rơ יְבָמָהּ là số ít, chỉ người anh hoặc em trai của người chồng. Sửa thành “Người anh hoặc em trai của người chồng đã chết” vừa rõ nghĩa vừa tránh mơ hồ quan hệ.
  - severity: low
    issue: “anh em sống chung với nhau” vừa chưa nêu rõ nam giới vừa lặp nghĩa.
    rationale: אַחִים trong ngữ cảnh này là các anh em trai; “các anh em trai cùng sống với nhau” rõ và tự nhiên hơn, đồng thời không quy định quá mức về mô hình cư trú.
  - severity: low
    issue: Cách gọi bổn phận ở cuối câu cần nhất quán với chủ ngữ số ít đã làm rõ.
    rationale: “Bổn phận của người anh hoặc em chồng” là cách diễn đạt pháp lý dễ hiểu, bảo toàn động từ chuyên biệt וְיִבְּמָהּ mà không cần đưa thuật ngữ kỹ thuật vào chính văn.
