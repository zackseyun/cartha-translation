revisions:
- from: 'Nhưng nếu người đàn ông ấy không muốn lấy chị dâu mình[a], thì chị dâu người ấy phải lên cổng thành, đến gặp các trưởng lão và nói: “Em chồng tôi từ chối duy trì danh của anh mình trong Y-sơ-ra-ên; người ấy không chịu làm bổn phận em chồng đối với tôi[b].”'
  to: 'Nhưng nếu người đàn ông ấy không muốn lấy người vợ góa của anh/em mình[a], thì người vợ góa ấy phải lên cổng thành, đến gặp các trưởng lão và nói: “Anh/em chồng tôi từ chối gây dựng danh cho anh/em mình trong Y-sơ-ra-ên; người ấy không chịu làm trọn bổn phận anh/em chồng đối với tôi[b].”'
