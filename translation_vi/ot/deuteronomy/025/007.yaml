base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: vi
  text: 'Nhưng nếu người đàn ông ấy không muốn lấy người vợ góa của anh/em mình[a], thì người vợ góa ấy phải lên cổng thành, đến gặp các trưởng lão và nói: “Anh/em chồng tôi từ chối gây dựng danh cho anh/em mình trong Y-sơ-ra-ên; người ấy không chịu làm trọn bổn phận anh/em chồng đối với tôi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Người vợ góa của anh/em mình”: tiếng Hê-bơ-rơ là một thuật ngữ thân tộc chỉ góa phụ của anh/em trai người đàn ông trong bối cảnh nghĩa vụ nối dõi. Từ này không xác định người anh/em ấy lớn hay nhỏ tuổi hơn.'
    reason: cultural_note
  - marker: b
    text: Nguyên văn dùng một động từ chuyên biệt, có thể dịch sát là “làm anh/em chồng cho tôi”; từ này chỉ việc thực hiện nghĩa vụ lấy góa phụ của anh/em mình để gây dựng danh cho người đã chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: muốn
  rationale: Động từ חפץ diễn tả ý muốn hoặc sự sẵn lòng; “không muốn” tự nhiên trong tiếng Việt hiện đại và giữ rõ sắc thái chủ ý.
- source_word: לָקַחַת
  choice: lấy
  rationale: לָקַחַת có nghĩa cơ bản là “lấy”; trong ngữ cảnh hôn nhân, tiếng Việt cũng dùng “lấy” theo nghĩa cưới, nên vừa sát nguyên văn vừa tự nhiên.
- source_word: יְבִמְתּוֹ
  choice: chị dâu mình
  rationale: Danh từ chỉ người vợ góa của anh/em trai trong bối cảnh tục nối dõi. Theo mạch câu, người đàn ông là em chồng của góa phụ, nên “chị dâu” diễn đạt tự nhiên quan hệ cụ thể này.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: phải lên cổng thành
  rationale: Giữ động từ “lên” của tiếng Hê-bơ-rơ và làm rõ “cổng” là cổng thành, nơi các trưởng lão xét xử công khai.
- source_word: הַזְּקֵנִים
  choice: các trưởng lão
  rationale: Đây là các vị lãnh đạo và xét xử của cộng đồng; “các trưởng lão” là cách dịch quen thuộc, trang trọng và không thêm chức danh ngoài nguyên văn.
- source_word: מֵאֵין
  choice: từ chối
  rationale: Từ này diễn tả sự khước từ; “từ chối” phù hợp với lời khiếu nại chính thức trước các trưởng lão.
- source_word: לְהָקִים ... שֵׁם
  choice: duy trì danh
  rationale: Thành ngữ nguyên văn gần với “lập/dựng danh”, nhưng trong bối cảnh này nói đến việc giữ cho tên tuổi và dòng dõi người đã chết không bị mất; “duy trì danh” truyền đạt ý nghĩa mà không giải thích quá mức.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Y-sơ-ra-ên
  rationale: Cách dịch trực tiếp, giữ cả phạm vi cộng đồng và sắc thái giao ước của cụm từ.
- source_word: לֹא אָבָה
  choice: không chịu
  rationale: אבה nói đến sự bằng lòng hay sẵn lòng. “Không chịu” tự nhiên trong lời tố cáo và vẫn phân biệt về cách diễn đạt với מֵאֵין ở vế trước.
- source_word: יַבְּמִי
  choice: làm bổn phận em chồng đối với tôi
  rationale: Đây là động từ chuyên biệt chỉ việc người anh/em trai của người chết thực hiện nghĩa vụ nối dõi bằng cách lấy góa phụ. Cách dịch giải nghĩa vừa đủ cho độc giả hiện đại.
theological_decisions:
- issue: Thuật ngữ về nghĩa vụ hôn nhân nối dõi
  choice: 'Dùng ngôn ngữ quan hệ và pháp lý dễ hiểu: “chị dâu”, “em chồng”, “làm bổn phận em chồng”.'
  alternative: Dùng thuật ngữ chuyên môn “hôn nhân levirat” hoặc dịch máy móc là “làm anh/em chồng cho tôi”.
  rationale: Câu này quy định một thiết chế pháp lý-xã hội. Cách dịch được chọn giữ đúng quan hệ thân tộc và nghĩa vụ theo nguyên văn, nhưng không đưa thuật ngữ học thuật khó hiểu hay quan điểm giáo phái vào bản văn.
- issue: Ý nghĩa của thành ngữ לְהָקִים ... שֵׁם
  choice: Dịch “duy trì danh của anh mình”.
  alternative: Dịch sát hình thức “dựng/lập một danh cho anh mình”.
  rationale: Thành ngữ bao hàm việc bảo tồn tên tuổi, dòng dõi và địa vị gia đình của người anh đã chết. “Duy trì danh” giữ được độ rộng ấy, còn chú thích trình bày hình thức sát chữ để không che khuất hình ảnh Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “người ấy” trong lời trình bày pháp lý để tránh khẩu ngữ quá mức; giữ địa danh “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh Việt ngữ. Hai chú thích đều có dấu tương ứng [a], [b] trong chính văn.
