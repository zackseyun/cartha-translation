  source_fidelity: Bản nháp hiểu đúng bối cảnh nghĩa vụ hôn nhân nối dõi, nhưng “chị dâu” và “em chồng” áp đặt quan hệ tuổi tác không có trong tiếng Hê-bơ-rơ. יְבִמְתּוֹ chỉ người vợ góa của anh/em trai người đàn ông; יְבָמִי và יַבְּמִי chỉ quan hệ/nghĩa vụ anh-em chồng, không xác định người ấy là em. Cần giữ tính không xác định này.
  naturalness: Câu sửa dùng các cụm “anh/em” quen thuộc trong tiếng Việt Kinh Thánh và hành chính-pháp lý, đồng thời làm rõ đối tượng là góa phụ mà không dùng thuật ngữ học thuật. “Gây dựng danh” giữ được thành ngữ Hê-bơ-rơ và phù hợp văn phong trang trọng.
