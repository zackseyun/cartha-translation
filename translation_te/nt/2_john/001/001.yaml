source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: te
  text: 'పెద్దవాడైన నేను[a], ఎన్నుకోబడిన అమ్మగారికీ[c] ఆమె పిల్లలకూ: నేను సత్యంలో[b] ప్రేమించేవారు వీరే; నేను మాత్రమే కాదు, సత్యాన్ని తెలిసికొన్న వారందరూ కూడా—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంఘపెద్ద.’ ఈ పదం వయస్సులో పెద్దవాడిని, గౌరవనీయుడిని, లేదా గుర్తింపు పొందిన సంఘ నాయకుడిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిజంగా.’ ఈ పదబంధంలో యోహాను రచనలకు ప్రత్యేకమైన ‘సత్యం’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఎన్నుకోబడిన మహిళకు.’ ‘అమ్మగారు’ ఒక నిర్దిష్ట మహిళను సూచించవచ్చు; కొందరు దీనిని స్థానిక సంఘానికి రూపకంగా అర్థం చేసుకుంటారు. మరికొందరు ‘కురియా’ను వ్యక్తిగత పేరుగా తీసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: పెద్ద
  rationale: లేఖ ప్రారంభంలో ఇది రచయిత తనను తాను గుర్తించుకునే బిరుదులాంటి పదం. ‘పెద్ద’ అనేది వయస్సు, గౌరవస్థానం, సంఘ నాయకత్వం అనే భావాల మధ్య ఉన్న మూలపాఠపు విస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἐκλεκτῇ
  choice: ఏర్పరచబడిన
  rationale: దేవునిచేత ఎంపిక చేయబడినదనే భావాన్ని సహజంగా తెలియజేస్తుంది; సంబోధితురాలు ఒక మహిళనా లేక రూపకాలంకారంగా ఒక సంఘమా అన్నది నిర్ణయించదు.
- source_word: κυρίᾳ
  choice: అమ్మగారికి
  rationale: గౌరవనీయురాలైన స్త్రీని సంబోధించే ఆధునిక తెలుగు రూపం. ‘యజమానురాలు’ ఇక్కడ అసహజంగా, అధికారం-కేంద్రీకృతంగా వినిపిస్తుంది. వ్యక్తిగత పేరుగా తీసుకునే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: ఆమె పిల్లలకు
  rationale: τέκνα లింగభేదం లేకుండా పిల్లలను సూచిస్తుంది. ఈ రూపం నిజమైన కుటుంబానికీ, సంఘ సభ్యులను సూచించే రూపకానికీ సరిపోతుంది.
- source_word: ἀγαπῶ
  choice: ప్రేమిస్తున్నాను
  rationale: మూల క్రియకు నేరమైన, సహజమైన సమానార్థకం; మూలంలో లేని తీవ్రతను చేర్చదు.
- source_word: ἐν ἀληθείᾳ
  choice: సత్యంలో
  rationale: ‘నిజంగా’ అనే క్రియావిశేషణ భావాన్నీ, యోహాను రచనల్లో కనిపించే ‘సత్యం’ అనే ఆధ్యాత్మిక పరిధినీ పూర్తిగా విడిచిపెట్టకుండా ఉంచుతుంది.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: నేను మాత్రమే కాదు, ... వారందరూ
  rationale: రచయిత ఒక్కడే కాక సత్యాన్ని తెలిసిన వారందరూ ప్రేమిస్తున్నారనే గ్రీకు విరుద్ధ నిర్మాణాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: οἱ ἐγνωκότες
  choice: తెలుసుకున్న వారు
  rationale: γινώσκω సంపూర్ణక్రియా రూపంలోని, గతంలో తెలుసుకొని ఇప్పుడు ఆ జ్ఞానస్థితిలో ఉన్నారనే భావాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: τὴν ἀλήθειαν
  choice: సత్యాన్ని
  rationale: సాధారణ అర్థంతో పాటు యోహాను రచనల్లోని ఆధ్యాత్మిక ప్రతిధ్వనిని కూడా నిలుపుతుంది.
theological_decisions:
- issue: ἐκλεκτῇ κυρίᾳ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘ఏర్పరచబడిన అమ్మగారికి’ అని వ్యక్తిగత మహిళకు చేసినట్లుగా కనిపించే సంబోధనను ఉంచి, స్థానిక సంఘాన్ని స్త్రీగా వ్యక్తీకరించి ఉండవచ్చనే అవకాశాన్ని తెరిచి ఉంచాం.
  alternative: ఒక నిర్దిష్ట క్రైస్తవ మహిళ; ఒక స్థానిక సంఘం; లేదా ‘కురియా/కిరియా’ అనే వ్యక్తిగత పేరు.
  rationale: గ్రీకు వాక్యం ఈ అవకాశాల్లో దేనినీ ఖచ్చితంగా తేల్చదు. అందువల్ల ప్రధాన పాఠం సాధారణ నామవాచక భావాన్ని అనుసరిస్తూ, మిగిలిన అవకాశాలను పాదసూచికలో తెలియజేస్తుంది.
- issue: ἐν ἀληθείᾳ భావం
  choice: ‘సత్యంలో’
  alternative: ‘నిజంగా’ లేదా ‘సత్యానుసారంగా’
  rationale: ఈ పదబంధం ప్రేమ యొక్క యథార్థతను సూచించవచ్చు; అదే సమయంలో యోహాను రచనల్లో ‘సత్యం’ అనే ఆధ్యాత్మిక పరిధిని సూచించవచ్చు. ‘సత్యంలో’ ఈ భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే లేఖా శైలి. గ్రీకులో స్పష్టంగా లేని గ్రహీత గుర్తింపును నిర్ణయించకుండా ఉంచాం. తెలుగు వాక్యస్పష్టత కోసం ‘రాస్తున్నది’ మరియు చివరి ‘వారిని ప్రేమిస్తున్నారు’ను పూరించాం.
