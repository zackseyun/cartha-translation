revisions:
- from: 'పెద్ద[a], ఏర్పరచబడిన అమ్మగారికి, ఆమె పిల్లలకు రాస్తున్నది: నేను వారిని సత్యంలో ప్రేమిస్తున్నాను; నేను మాత్రమే కాదు, సత్యాన్ని తెలుసుకున్న వారందరూ వారిని ప్రేమిస్తున్నారు.[b]'
  to: 'పెద్దవాడైన నేను[a], ఎన్నుకోబడిన అమ్మగారికీ[c] ఆమె పిల్లలకూ: నేను సత్యంలో[b] ప్రేమించేవారు వీరే; నేను మాత్రమే కాదు, సత్యాన్ని తెలిసికొన్న వారందరూ కూడా—'
  rationale: The revision removes the unwarranted explicit writing verb, supplies a natural Telugu epistolary self-designation for Ὁ πρεσβύτερος, and renders ἐκλεκτῇ with the more direct ‘ఎన్నుకోబడిన.’ The dash preserves the source sentence’s continuation into verse 2. The wording ‘నేను సత్యంలో ప్రేమించేవారు వీరే’ allows the masculine plural relative pronoun to refer naturally to the children/addressee group without forcing an interpretation of the lady as either an individual or a church. Footnotes are separated and placed at their relevant anchors.
