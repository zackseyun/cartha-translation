id: 2JN.1.12
reference: 2 John 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: te
  text: మీకు రాయవలసిన విషయాలు ఎన్నో ఉన్నప్పటికీ, కాగితం, సిరాతో వాటిని రాయాలని నేను కోరుకోలేదు. అయితే, మీ దగ్గరకు వచ్చి మీతో ముఖాముఖిగా మాట్లాడాలని ఆశిస్తున్నాను; మీ ఆనందం[a] పరిపూర్ణమగునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతులలో “మీ ఆనందం”కు బదులుగా “మన ఆనందం” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: మీకు రాయవలసిన విషయాలు ఎన్నో ఉన్నప్పటికీ
  rationale: గ్రీకు కృదంత నిర్మాణంలోని concessive భావాన్ని సహజమైన తెలుగులో చూపిస్తూ, Πολλά లోని బహువచన భావాన్ని ‘విషయాలు ఎన్నో’గా నిలుపుతుంది.
- source_word: οὐκ ἐβουλήθην
  choice: రాయాలని నేను కోరుకోలేదు
  rationale: βούλομαι తెలిపే సంకల్పం లేదా ఇష్టాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: διὰ χάρτου καὶ μέλανος
  choice: కాగితం, సిరా ఉపయోగించి
  rationale: διάతో సూచించిన సాధనార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘కాగితం మీద సిరాతో’ అని మూలంలోని సముచ్చయ నిర్మాణాన్ని మార్చకుండా ఉంటుంది.
- source_word: ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: మీ దగ్గరకు వచ్చి ... ఆశిస్తున్నాను
  rationale: πρός లోని దిశాభావంతో పాటు, వారి సమక్షానికి రావడం అనే ఈ గ్రీకు ప్రయోగపు సహజ అర్థాన్ని అందిస్తుంది.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: మీతో ముఖాముఖిగా మాట్లాడాలని
  rationale: అక్షరార్థంగా ‘నోటి నుండి నోటికి’ అనడం ఆధునిక తెలుగులో తప్పుదారి పట్టించవచ్చు; ఈ నుడికారం ప్రత్యక్ష వ్యక్తిగత సంభాషణను సూచిస్తుంది.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: తద్వారా మీ ఆనందం పరిపూర్ణం కావాలి
  rationale: ἵνα లోని ఉద్దేశం/ఫలిత భావాన్ని ‘తద్వారా’ తెలియజేస్తుంది; perfect participleతో కూడిన subjunctive నిర్మాణం సూచించే సంపూర్ణ స్థితిని ‘పరిపూర్ణం కావాలి’గా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఎవరి ఆనందం ఉద్దేశించబడిందనే సర్వనామ పాఠభేదం
  choice: మీ ఆనందం
  alternative: మన ఆనందం
  rationale: ఇచ్చిన SBLGNT మూలపాఠంలో ὑμῶν (‘మీ’) ఉంది. కొన్ని ప్రతులలోని ἡμῶν (‘మన’) పాఠం భావవ్యాఖ్యపై ప్రభావం చూపగలదు కాబట్టి దాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వ్యక్తిగత ఉత్తరానికి తగిన గౌరవప్రదమైన సహజ శైలి వాడబడింది. ‘ముఖాముఖిగా’ అనే ప్రస్తుత నుడికారం గ్రీకు idiom అర్థాన్ని స్పష్టంగా అందిస్తుంది.
