id: 2JN.1.9
reference: 2 John 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: te
  text: మెస్సీయ బోధలో[b] నిలిచి ఉండకుండా ముందుకు సాగిపోయే[a] ప్రతి ఒక్కరూ దేవుణ్ణి కలిగి ఉండరు. ఆ బోధలో నిలిచి ఉండే వ్యక్తి తండ్రినీ కుమారునీ ఇద్దరినీ కలిగి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ముందుకు సాగిపోవడం’ అనే మాటకు ‘హద్దు మీరి ముందుకు వెళ్లడం’ లేదా ‘ముందుకు దూసుకుపోవడం’ అనే అర్థాలు కూడా రావచ్చు. కొన్ని ప్రతుల్లో దీనికి బదులుగా ‘అతిక్రమించడం’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: ‘మెస్సీయ బోధ’ అనే పదబంధం ‘మెస్సీయ చేసిన బోధ’ అని గానీ, ‘మెస్సీయను గురించిన బోధ’ అని గానీ అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: ముందుకు సాగిపోయే ప్రతి ఒక్కరు
  rationale: πᾶς తో కూడిన articular participle సాధారణంగా ‘అలా చేసే ప్రతి ఒక్కరు’ అనే భావం ఇస్తుంది. προάγων లోని ముందుకు వెళ్లే రూపకాన్ని నిలుపుతూ, ‘హద్దు మీరడం’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చలేదు.
- source_word: μὴ μένων
  choice: నిలిచి ఉండకుండా
  rationale: యోహాను రచనల్లో μένω కీలకమైన ‘నిలిచి ఉండు/కొనసాగు’ భావాన్ని కలిగిస్తుంది. ఆధునిక తెలుగులో ‘నిలిచి ఉండు’ సహజంగా ఉండి ఆ భావాన్ని కాపాడుతుంది.
- source_word: ἐν τῇ διδαχῇ
  choice: బోధలో
  rationale: διδαχή కు ‘బోధ’ సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన పదం; ‘సిద్ధాంతం’ కంటే మూలంలోని బోధనా భావానికి దగ్గరగా ఉంటుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉంది. అందువల్ల ‘క్రీస్తు’ అని లిప్యంతరీకరించకుండా దాని బిరుదార్థమైన ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: θεὸν οὐκ ἔχει
  choice: దేవుడు లేడు
  rationale: ‘దేవునితో సహవాసం లేదు’ అని విస్తరించి వ్యాఖ్యానించకుండా, ἔχει యొక్క ఉద్దేశపూర్వకంగా పదునైన యోహాను వాక్యరూపాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: ఆ బోధలో నిలిచి ఉండే వ్యక్తి
  rationale: Articular participle ను వ్యక్తిని సూచించే విధంగా అనువదించి, మొదటి భాగంతో ఉన్న సమాంతరతను కాపాడింది.
- source_word: οὗτος
  choice: ఆ ... వ్యక్తికి
  rationale: οὗτος లోని నిర్దిష్ట ఉద్ఘాటనను వ్యక్తపరుస్తూ, తెలుగులో అసహజమైన ‘ఈయనే’ వంటి నిర్మాణాన్ని నివారించింది.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: తండ్రి, కుమారుడు—ఇద్దరూ ఉన్నారు
  rationale: καὶ...καὶ లోని ‘ఇద్దరూ’ అనే సహసంబంధ భావాన్ని స్పష్టంగా తెలుపుతూ, ‘తండ్రి’, ‘కుమారుడు’ అనే వ్యక్తిగత బిరుదులను యథాతథంగా నిలిపింది.
theological_decisions:
- issue: προάγων యొక్క సందర్భార్థం
  choice: ముందుకు సాగిపోయే
  alternative: హద్దు మీరి ముందుకు వెళ్లే; అతిక్రమించే
  rationale: SBLGNT పాఠ్యంలో προάγων ఉంది, παραβαίνων కాదు. కాబట్టి నిజమైన బోధను దాటి వెళ్లడాన్ని సూచించగల రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత స్పష్టమైన ప్రతికూల అర్థాన్నీ పాఠాంతరాన్నీ పాదసూచికలో ఇచ్చింది.
- issue: τοῦ Χριστοῦ అనే genitive యొక్క భావం
  choice: మెస్సీయ బోధ
  alternative: మెస్సీయ చేసిన బోధ; మెస్సీయను గురించిన బోధ
  rationale: గ్రీకు genitive బోధ యొక్క మూలాన్ని గానీ, దాని విషయాన్ని గానీ సూచించవచ్చు. ‘మెస్సీయ బోధ’ ఈ రెండు అవకాశాలను అనవసరంగా పరిష్కరించకుండా నిలుపుతుంది.
- issue: Χριστοῦ అనే క్రీస్తు సంబంధిత బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరుగా కాక బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ ఎంచుకోబడింది.
- issue: θεὸν οὐκ ἔχει అనే సంబంధభాష
  choice: దేవుడు లేడు
  alternative: దేవునితో సంబంధం లేదు; దేవుణ్ణి కలిగిలేడు
  rationale: మూలంలోని కఠినమైన ‘దేవుణ్ణి కలిగి ఉండడు’ భావాన్ని సహజమైన తెలుగులో ఉంచి, దానిని కేవలం సహవాసం లేదా సంబంధంగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి ఉపయోగించబడింది. ‘బోధ’, ‘నిలిచి ఉండు’ వంటి సుపరిచిత పదాలతో యోహాను రచనలోని సమాంతరతను నిలిపింది. లింగాన్ని అనవసరంగా నిర్ధారించకుండా ‘వ్యక్తి’ అనే రూపం వాడబడింది.
