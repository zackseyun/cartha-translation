revisions:
- from: మెస్సీయ బోధలో నిలిచి ఉండకుండా ముందుకు సాగిపోయే ప్రతి ఒక్కరికీ దేవుడు లేడు.[a] ఆ బోధలో నిలిచి ఉండే వ్యక్తికి[b] తండ్రి, కుమారుడు—ఇద్దరూ ఉన్నారు.
  to: మెస్సీయ బోధలో[b] నిలిచి ఉండకుండా ముందుకు సాగిపోయే[a] ప్రతి ఒక్కరూ దేవుణ్ణి కలిగి ఉండరు. ఆ బోధలో నిలిచి ఉండే వ్యక్తి తండ్రినీ కుమారునీ ఇద్దరినీ కలిగి ఉన్నాడు.
  rationale: The revision replaces the existential “దేవుడు లేడు” with “దేవుణ్ణి కలిగి ఉండరు,” preserving the Greek object θεόν and the unexpanded Johannine formulation. It retains the generic plural for πᾶς ὁ προάγων, the metaphorical “ముందుకు సాగిపోయే,” the compact ambiguous genitive “మెస్సీయ బోధ,” and the correlative possession of both Father and Son. Footnote anchors have been moved to the words they explain.
