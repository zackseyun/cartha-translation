id: 2JN.1.2
reference: 2 John 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: te
  text: మనలో నిలిచి ఉండే[a] సత్యం కారణంగా, అది ఎప్పటికీ మనతో ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివసించే.”
    reason: μένουσανకు ‘నిలిచి ఉండే’తో పాటు ‘నివసించే’ అనే సాధ్యమైన పదార్థం ఉంది; ఇది సత్యం మనలో నిరంతరం ఉన్నదనే భావాన్ని వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: διὰ
  choice: బట్టి
  rationale: Accusativeతో వచ్చిన διά ఇక్కడ 1వ వచనంలో చెప్పిన ప్రేమకు కారణం లేదా ఆధారాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సత్యాన్ని బట్టి’ సహజంగా ఉండి ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀλήθειαν
  choice: సత్యం
  rationale: ἀλήθεια అనే పదాన్ని వ్యాఖ్యానాత్మకంగా ‘సువార్త సత్యం’ లేదా ‘నిజమైన బోధ’ అని కుదించకుండా, యోహాను రచనలలోని విస్తృత భావాన్ని నిలుపుతూ సరళంగా ‘సత్యం’ అని అనువదించాం.
- source_word: τὴν μένουσαν
  choice: నిలిచి ఉండే
  rationale: μένω వర్తమాన అసమాపక క్రియ నిరంతర ఉనికిని సూచిస్తుంది. ‘నిలిచి ఉండే’ అనే పదబంధం ఆ కొనసాగింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ἡμῖν
  choice: మనలో
  rationale: ἐν + dativeకు ఇక్కడ నేరుగా ‘మనలో’ అనే అర్థం సరిపోతుంది; ‘మన మధ్య’ అనే సాధ్యమైన సామూహిక భావాన్ని ప్రధాన పాఠంలో పెట్టి అంతర్గత ఉనికి భావాన్ని తొలగించలేదు.
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: అది మనతో ఉంటుంది
  rationale: μετά + genitive ‘తో’ అని, ἔσται భవిష్యత్ ఉనికిని సూచిస్తుంది. తెలుగులో కర్తను స్పష్టంచేయడానికి ‘అది’ చేర్చబడింది; గ్రీకులో లేని ‘నిలిచి’ అనే భావాన్ని మళ్లీ జోడించలేదు.
- source_word: εἰς τὸν αἰῶνα
  choice: ఎప్పటికీ
  rationale: ఈ గ్రీకు నుడికారం శాశ్వత కొనసాగింపును సూచిస్తుంది. ‘ఎప్పటికీ’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
theological_decisions:
- issue: యోహాను రచనలలో ‘సత్యం’ అనే పదం యొక్క వేదాంతపరమైన పరిధి
  choice: ‘సత్యం’ అనే విస్తృత పదాన్నే ఉంచడం
  alternative: ‘సువార్త సత్యం’ లేదా ‘నిజమైన బోధ’ అని ప్రత్యేకంగా నిర్ధారించడం
  rationale: సందర్భంలో ఈ పదానికి సువార్త, క్రీస్తు, లేదా దేవుని ప్రత్యక్షతతో సంబంధమైన సమృద్ధ భావం ఉండవచ్చు; అయితే గ్రీకు నామవాచకం వాటిలో ఏ ఒక్కదానికీ భావాన్ని స్పష్టంగా పరిమితం చేయదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఈ భాగం 1వ వచనంపై ఆధారపడిన కారణవాచక ఖండం కావడంతో ముగింపులో పూర్తి వాక్యంలా చేయకుండా మూల సంబంధాన్ని సూచించే దీర్ఘ విరామ చిహ్నం వాడబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
