id: 2JN.1.11
reference: 2 John 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ⸂λέγων γὰρ⸃ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: te
  text: ఎందుకంటే, అతనికి “వందనాలు”[a] అని చెప్పేవాడు అతని దుష్ట కార్యాల్లో పాలుపంచుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శుభం కలుగుగాక.” గ్రీకు χαίρειν (ఖైరెయిన్) సంప్రదాయ అభివాద పదం. ఈ సందర్భంలో అది కేవలం మర్యాదపూర్వక పలకరింపు మాత్రమే కాక, ఆ వ్యక్తిని స్వాగతించడం లేదా అతనికి ఆమోదం తెలపడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: అని చెప్పేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతం ఇక్కడ నామవాచకంగా, ఈ పని చేసే ఎవరినైనా సాధారణంగా సూచిస్తుంది. ‘చెప్పేవాడు’ ఆ నిర్మాణాన్నీ సాధారణ భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ఇది ముందటి వచనంలోని నిషేధానికి కారణాన్ని తెలియజేస్తుంది. ‘ఎందుకంటే’ దాని వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: ఈ సర్వనామం ముందు వచనంలో చెప్పబడిన వ్యక్తిని తిరిగి సూచిస్తుంది; మూలంలోని సంక్షిప్తతను విస్తరించకుండా నిలుపుతుంది.
- source_word: χαίρειν
  choice: “వందనాలు”
  rationale: λέγων తరువాత వచ్చిన ఈ క్రియారూపం సంప్రదాయ అభివాద సూత్రంగా పనిచేస్తుంది. ‘వందనాలు’ ఆధునిక తెలుగులో ఆ అభివాద భావాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థమైన ‘సంతోషించు’ ఇక్కడ సందర్భోచితం కాదు.
- source_word: κοινωνεῖ
  choice: పాలుపంచుకుంటాడు
  rationale: దత్తివ విభక్తి పదబంధంతో కలిసి ఇది ఒక కార్యంలో భాగస్వామి కావడం లేదా పాలివాడవడం అనే భావాన్ని ఇస్తుంది. ‘పాలుపంచుకుంటాడు’ సహకారం వల్ల కలిగే నైతిక భాగస్వామ్యాన్ని తెలియజేస్తూ, సంఘసంబంధమైన ప్రత్యేక పారిభాషిక భావాన్ని చొప్పించదు.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: అతని దుష్ట కార్యాల్లో
  rationale: ఈ దత్తివ పదబంధం పాలుపంచుకునే వాటిని సూచిస్తుంది; πονηροῖς ఆ కార్యాలను నైతికంగా దుష్టమైనవిగా వర్ణిస్తుంది. ‘కార్యాలు’ ἔργοις‌కు దగ్గరగా ఉండగా, ‘దుష్ట’ πονηροῖς యొక్క నైతిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ అభివాదం కేవలం మర్యాదపూర్వక పలకరింపునా, లేక ఆమోదం మరియు సహకారాన్ని సూచిస్తుందా?
  choice: వచనపు పదాలను విస్తరించకుండా ఉంచి, ముందటి వచన సందర్భంలో అటువంటి బోధకుణ్ణి స్వీకరించి ప్రోత్సహించే అభివాదం అతని దుష్ట కార్యాల్లో భాగస్వామ్యం కలిగిస్తుందని అర్థమయ్యేలా అనువదించబడింది.
  alternative: అన్ని సందర్భాల్లోనూ అలాంటి వ్యక్తితో ఏ మర్యాదపూర్వక పలకరింపైనా పూర్తిగా నిషేధించబడిందని భావించడం.
  rationale: χαίρειν సాధారణ అభివాద సూత్రమే అయినా, κοινωνεῖ అనే పదం మరియు 10వ వచనంలోని ఇంటికి చేర్చుకోవడం, అభివాదం చెప్పడం అనే సమీప సందర్భం మద్దతు లేదా ఆమోదం వల్ల కలిగే భాగస్వామ్యాన్ని సూచిస్తాయి. ప్రధాన పాఠ్యంలో ఈ వ్యాఖ్యానాన్ని అదనపు పదాలతో బలవంతంగా చేర్చకుండా మూలంలోని ఉద్రిక్తత నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. ‘వందనాలు’ సహజమైన అభివాద పదంగా ఎంచుకోబడింది; ‘పాలుపంచుకుంటాడు’ నైతిక సహభాగితను స్పష్టంగా తెలియజేస్తుంది.
