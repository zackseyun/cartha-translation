source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: te
  text: తండ్రియైన దేవుని నుండీ, తండ్రి కుమారుడైన[b] యేసు మెస్సీయ[a] నుండీ కృప, కనికరం, శాంతి సత్యంలోనూ ప్రేమలోనూ మనతో ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యేసు క్రీస్తు.’ Χριστός అనే గ్రీకు బిరుదును ‘క్రీస్తు’ అని లిప్యంతరీకరించవచ్చు; ఇక్కడ దాని బిరుదు భావాన్ని నిలపడానికి ‘మెస్సీయ’ అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: పదక్షరాలా, ‘తండ్రి యొక్క కుమారుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται μεθ’ ἡμῶν
  choice: మనతో ఉంటాయి
  rationale: ἔσται భవిష్యత్ సూచక క్రియ కావడంతో ఆశీర్వాద వాక్యాన్ని కోరికగా కాక నిశ్చయ ప్రకటనగా ఉంచుతుంది. మూడు సంయుక్త కర్తలకు సహజమైన ఆధునిక తెలుగులో బహువచన క్రియ వాడబడింది.
- source_word: χάρις ἔλεος εἰρήνη
  choice: కృప, కనికరం, శాంతి
  rationale: గ్రీకు పదక్రమాన్ని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన తెలుగు సమానార్థకాలు ఎంచుకున్నాం.
- source_word: παρὰ θεοῦ πατρός
  choice: తండ్రియైన దేవుని నుండీ
  rationale: παρά + షష్ఠీ విభక్తి మూలాన్ని సూచిస్తుంది; అందుకే ‘నుండీ’ వాడాం. గ్రీకులో లేని ‘మన’ అనే స్వామ్యపదాన్ని చేర్చలేదు.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ నుండీ
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన బిరుదు. పేరును లిప్యంతరీకరించి, బిరుదును దాని భావాన్ని నిలిపే ‘మెస్సీయ’గా ఇచ్చాం.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: తండ్రి కుమారుడైన
  rationale: ఈ పదబంధం యేసు మెస్సీయను తండ్రి కుమారుడిగా సమీప అన్వయంతో గుర్తిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా విశేషణ రూపంలో ఇచ్చాం.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: సత్యంలోనూ ప్రేమలోనూ
  rationale: ἐν యొక్క ‘లో’ భావాన్ని, రెండు నామాల సమాంతరత్వాన్ని నిలిపాం; గ్రీకులో నిర్దిష్ట ఉపపదాలు లేనందున ‘ఆ సత్యం’ వంటి నిర్దిష్టతను చేర్చలేదు.
theological_decisions:
- issue: Χριστοῦ అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తోంది. దాని బిరుదు భావాన్ని ప్రత్యక్షంగా తెలియజేయడానికి ‘మెస్సీయ’ ఎంచుకుని, సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో ఉంచాం.
- issue: ‘తండ్రి కుమారుడు’ అనే పదబంధానికి యేసుతో సంబంధం
  choice: యేసు మెస్సీయను తండ్రి కుమారుడిగా సమీప అన్వయంలో గుర్తించడం
  alternative: యేసు మెస్సీయ తరువాత వచ్చే కొంత వదులైన వివరణగా చదవడం
  rationale: గ్రీకు షష్ఠీ పదబంధం సహజంగా Ἰησοῦ Χριστοῦతో అన్వయించి ఆయనను గుర్తిస్తుంది; మూలానికి మించిన సిద్ధాంత వివరణను చేర్చకుండా ఆ అన్వయాన్ని స్పష్టంగా ఉంచాం.
- issue: ἐν ἀληθείᾳ καὶ ἀγάπῃ యొక్క అన్వయం
  choice: వాక్యాంతంలో ఉంచి మూలంలోని విస్తృత అన్వయ సాధ్యతను కాపాడడం
  alternative: ఇది కేవలం ‘మనతో ఉంటాయి’ లేదా కేవలం దైవిక మూలంతో మాత్రమే అన్వయిస్తుందని స్పష్టీకరించడం
  rationale: ఈ పదబంధం కృప, కనికరం, శాంతి మనతో ఉండే పరిధి లేదా విధానాన్ని సూచించగలదు. తెలుగు వాక్యాంత స్థానం ఆ భావాన్ని అనవసరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా-ఆశీర్వాద శైలి వాడబడింది. ‘నుండీ … నుండీ’ సమాంతర నిర్మాణం రెండు మూలాలను స్పష్టంగా చూపుతుంది; వాక్యాంతంలోని ‘సత్యంలోనూ ప్రేమలోనూ’ మూలంలోని పదక్రమాన్నీ అన్వయ విస్తృతినీ సాధ్యమైనంతగా నిలుపుతుంది.
