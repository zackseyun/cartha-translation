id: 2JN.1.5
reference: 2 John 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: te
  text: 'ఇప్పుడు నేను నిన్ను అడుగుతున్నాను[a], అమ్మగారూ: నేను నీకు ఒక కొత్త ఆజ్ఞను రాస్తున్నట్టు కాదు; మొదటి నుంచీ మనకు ఉన్న ఆ ఆజ్ఞనే—మనము ఒకరినొకరు ప్రేమించాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంఘమా’; ‘అమ్మగారూ’ అనే సంబోధనను ప్రతీకాత్మకంగా అర్థం చేసుకుంటే ఇది సంఘాన్ని సూచించవచ్చు. మరికొందరు ‘కురియా’ను సొంత పేరుగా భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: అడుగుతున్నాను
  rationale: అడగడం లేదా మనవి చేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘వేడుకుంటున్నాను’ లేదా ‘ప్రోత్సహిస్తున్నాను’ కంటే మూలంలోని బలాన్ని అతిశయింపదు.
- source_word: κυρία
  choice: అమ్మా
  rationale: స్త్రీని గౌరవంగా సంబోధించే κυρία పదానికి సహజమైన తెలుగు సంబోధన. ఇది ఆమెను వ్యక్తిగత స్త్రీగా, సంఘానికి ప్రతీకగా, లేదా పేరుగా తేల్చకుండా ఉంచుతుంది.
- source_word: ἐντολὴν καινὴν
  choice: ఒక కొత్త ఆజ్ఞను
  rationale: యోహాను రచనలలోని ‘కొత్త ఆజ్ఞ’ అనే సాహిత్య ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: γράφων σοι
  choice: నేను నీకు ... రాస్తున్నట్టు
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన పోలిక నిర్మాణంగా వ్యక్తం చేస్తుంది.
- source_word: ἣν εἴχομεν
  choice: మనకు ఉన్న ఆ ఆజ్ఞనే
  rationale: εἴχομεν అనే అసంపూర్ణ భూతకాల రూపం, మొదటి నుంచీ కొనసాగుతున్న స్వాధీనాన్ని సందర్భంలో సూచిస్తుంది; ‘ఉన్న’ అనే రూపం తెలుగులో ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది.
- source_word: ἀπ’ ἀρχῆς
  choice: మొదటి నుంచీ
  rationale: యోహాను రచనల్లో కనిపించే స్థిరమైన భావాన్ని సహజంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: మనం ఒకరినొకరం ప్రేమించుకోవాలి
  rationale: ἵνα తో వచ్చిన వర్తమాన సంభావనార్థక క్రియ ఇక్కడ ఆజ్ఞ యొక్క విషయాన్ని, ప్రోత్సాహక బలాన్ని తెలియజేస్తుంది; ‘ప్రేమించుకోవాలి’ ఆధునిక తెలుగులో రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κυρία పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అమ్మా’ అని గౌరవ సంబోధనగా అనువదించి, నిర్దిష్ట గుర్తింపును తేల్చలేదు.
  alternative: ఇది స్థానిక సంఘానికి ప్రతీకాత్మక సంబోధన కావచ్చు; లేదా ‘కురియా’ అనే సొంత పేరు కావచ్చు.
  rationale: గ్రీకు పదం ఈ వివరణలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠ్యంలో ఒక వివరణను ఖరారు చేయకుండా అసలైన సందిగ్ధతను నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, ఉత్తర శైలికి తగిన భాషను వాడాం. సంబోధిత వ్యక్తి ఏకవచనం కాబట్టి ‘నిన్ను/నీకు’ వాడాం; κυρία యొక్క అర్థసందిగ్ధతను పాదసూచికలో నిలిపాం.
