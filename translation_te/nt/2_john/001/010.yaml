source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: te
  text: ఎవరైనా మీ దగ్గరకు వచ్చి ఈ బోధను తీసుకురాకపోతే,[a] అతన్ని మీ ఇంట్లోకి చేర్చుకోవద్దు; అతన్ని పలకరించవద్దు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భంలో “ఈ బోధ” అనేది చుట్టుపక్కల వచనాల్లో చెప్పబడిన క్రీస్తును గూర్చిన ఒప్పుకోలుకు అనుగుణమైన బోధను సూచిస్తుంది. దానిని తీసుకురాని వ్యక్తి ప్రయాణించే బోధకుడై ఉండవచ్చు.
    reason: cross_reference
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, “అతనికి అభివాదం అని చెప్పవద్దు” అని ఉంది. దీన్ని “అతనికి పలకరింపు చెప్పవద్దు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: ఎవరైనా
  rationale: సాధారణమైన, నిర్దిష్టం కాని షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: మీ దగ్గరకు వచ్చి
  rationale: గ్రహీతల వైపు రావడం అనే నేరుగా ఉన్న భావాన్ని కాపాడుతుంది; సందర్భం చెప్పేదానికంటే ఎక్కువ సంఘపరమైన అర్థాన్ని చేర్చదు.
- source_word: ταύτην τὴν διδαχήν
  choice: ఈ బోధను
  rationale: διδαχήలోని బోధ/ఉపదేశం అనే భావాన్ని సరళంగా తెలియజేస్తూ, సూచనార్థకమైన ‘ఈ’ని నిలుపుతుంది.
- source_word: οὐ φέρει
  choice: తీసుకురాకపోతే
  rationale: బోధను తనతో తీసుకురావడం లేదా ప్రకటించడానికి తీసుకురావడం అనే φέρω యొక్క రూపక ప్రయోగాన్ని తెలుగులో సహజంగా ఉంచుతుంది.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: అతన్ని మీ ఇంట్లోకి చేర్చుకోవద్దు
  rationale: ఇంట్లోకి స్వీకరించడం, ఆతిథ్యం ఇవ్వడం అనే ఆచరణాత్మక భావాన్ని వ్యక్తం చేస్తుంది; ‘మీ’ అనేది బహువచన సంబోధననుంచి సందర్భానుగుణంగా స్పష్టమవుతుంది.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: అతనికి ‘శుభం’ అని కూడా చెప్పవద్దు
  rationale: గ్రీకులోని ‘అతనికి χαίρειν అని చెప్పవద్దు’ అనే నిర్మాణాన్ని, కేవలం ‘పలకరించవద్దు’ అని సాధారణీకరించకుండా, అర్థమయ్యే తెలుగులో దగ్గరగా నిలుపుతుంది. ‘కూడా’ సమన్వయమైన καί యొక్క బలాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: తప్పుడు బోధకునిపట్ల నిషేధం యొక్క పరిధి
  choice: ఈ బోధను తీసుకురాని వ్యక్తిని ఇంట్లోకి చేర్చుకోవడం, అతనికి శుభాకాంక్ష చెప్పడం నిషేధించబడినట్లు వచనంలోని నిర్దిష్ట చర్యలనే అనువదించడం.
  alternative: అతనితో ఎలాంటి సామాజిక సంబంధమూ పెట్టుకోకూడదని విస్తరించడం; లేదా సంఘ బోధకునిగా అధికారికంగా ఆతిథ్యం ఇవ్వడానికే దీనిని పరిమితం చేయడం.
  rationale: సందర్భం ప్రయాణ బోధకులనూ అపొస్తలిక సాక్ష్యానికి విరుద్ధమైన బోధనూ సూచించే అవకాశం ఉన్నప్పటికీ, గ్రీకు వాక్యం నిషేధపు పూర్తి పరిధిని సిద్ధాంతపరంగా నిర్వచించదు. అందువల్ల ప్రధాన పాఠం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: αὐτόν / αὐτῷ యొక్క లింగం
  choice: అతన్ని / అతనికి
  alternative: వారిని / వారికి
  rationale: మూలపాఠంలోని ఏకవచన పుంలింగ సర్వనామాన్ని నిలుపుతూ, సాధారణ సంభావ్య వ్యక్తిని సూచించే షరతు స్వభావాన్ని మార్చదు.
- issue: χαίρειν యొక్క భావం
  choice: ‘శుభం’ అని చెప్పడం
  alternative: పలకరించడం
  rationale: χαίρειν ఒక నిర్దిష్ట శుభాకాంక్షా సూత్రంగా ఉండగలదు. దాన్ని కేవలం సాధారణ సామాజిక పలకరింపుగా నిర్ణయించకుండా, మూలంలోని మాటను చెప్పడం అనే నిర్మాణాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇంట్లోకి చేర్చుకోవద్దు’ ఆతిథ్య సందర్భాన్ని సహజంగా తెలియజేస్తుంది. ‘శుభం’ అనే ఉద్ధరణ మూలంలోని χαίρειν అనే పలకరింపు సూత్రాన్ని కనిపించేలా ఉంచుతుంది; పాదటిప్పణి సహజ ప్రత్యామ్నాయాన్ని ఇస్తుంది.
