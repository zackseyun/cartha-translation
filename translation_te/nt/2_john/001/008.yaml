  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: te
  text: మేము కృషి చేసి సాధించినదాన్ని మీరు కోల్పోకుండా, పూర్తి ప్రతిఫలాన్ని పొందేలా, మీ విషయమై జాగ్రత్తగా ఉండండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “మేము కృషి చేసి సాధించినదాన్ని” అనే బదులు “మీరు కృషి చేసి సాధించినదాన్ని” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: మిమ్మల్ని మీరు జాగ్రత్తగా చూసుకోండి
  rationale: వర్తమానకాల ఆజ్ఞారూపం నిరంతర అప్రమత్తతను సూచిస్తుంది; ఆత్మవాచక సర్వనామాన్ని స్పష్టంగా ఉంచుతూ, ఆధునిక తెలుగులో సహజమైన హెచ్చరికగా అనువదించబడింది.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: మీరు పోగొట్టుకోకుండా
  rationale: ἵνα మరియు నిషేధార్థక ఉపవాక్యం నివారించవలసిన ఫలితాన్ని తెలియజేస్తాయి. ఈ సందర్భంలో ἀπόλλυμι నాశనం చేయడం కంటే సంపాదించినదాన్ని కోల్పోవడం అనే భావాన్ని ఇస్తుంది.
- source_word: ἃ εἰργασάμεθα
  choice: మేము కష్టపడి సాధించినదాన్ని
  rationale: మూలపాఠంలోని ప్రథమ పురుష బహువచనాన్ని ‘మేము’గా నిలిపి, గత కృషి మరియు దాని కొనసాగుతున్న ఫలితం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μισθὸν πλήρη
  choice: పూర్తి ప్రతిఫలాన్ని
  rationale: ఆధ్యాత్మిక హెచ్చరిక సందర్భంలో μισθόςకు ‘జీతం’ కంటే ‘ప్రతిఫలం’ సహజం; πλήρη దాని సంపూర్ణతను తెలియజేస్తుంది.
- source_word: ἀπολάβητε
  choice: పొందేలా
  rationale: ἀπολαμβάνω ఇక్కడ ప్రతిఫలాన్ని పొందడాన్ని సూచిస్తుంది. ‘తిరిగి పొందడం’ అనే భావాన్ని సందర్భం తప్పనిసరిగా కోరనందున దాన్ని చేర్చలేదు.
theological_decisions:
- issue: εἰργασάμεθα యొక్క కర్త మరియు పాఠభేదం
  choice: మేము కష్టపడి సాధించినదాన్ని
  alternative: మీరు కష్టపడి సాధించినదాన్ని
  rationale: ఇచ్చిన SBLGNT పాఠంలో ప్రథమ పురుష బహువచనమైన εἰργασάμεθα ఉంది. అందువల్ల ప్రధాన పాఠంలో అపొస్తలిక సేవకుల కృషి భావం నిలుపబడింది; పాఠకుల స్వంత కృషిని సూచించే ద్వితీయ పురుష పాఠభేదం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన హెచ్చరిక శైలిని ఉపయోగించాం. మూలంలోని ఉద్దేశ్య-ఫలిత నిర్మాణాన్ని తెలుగులో సహజంగా ఉండేలా వాక్యక్రమాన్ని మార్చాం.
