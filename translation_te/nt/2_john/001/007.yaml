- from: 'ఎందుకంటే అనేకమంది మోసగాళ్లు లోకంలోకి బయలుదేరారు. శరీరధారిగా వస్తున్న యేసే మెస్సీయ[a] అని ఒప్పుకోని వారే వీరు. అలాంటి వ్యక్తే మోసగాడు, క్రీస్తువిరోధి.


