    [b] “శరీరధారిగా వస్తున్న”[b] అనే గ్రీకు మాటలను “శరీరధారిగా వచ్చిన” అని కూడా అనువదించవచ్చు.'
  to: ఎందుకంటే అనేకమంది మోసగాళ్లు లోకంలోకి వెళ్లిపోయారు; యేసు మెస్సీయ[a] శరీరధారిగా వస్తున్నాడని[b] ఒప్పుకోనివారే వారు. అలాంటివాడే మోసగాడు మరియు క్రీస్తువిరోధి.
