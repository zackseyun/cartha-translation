id: 2JN.1.7
reference: 2 John 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: te
  text: ఎందుకంటే అనేకమంది మోసగాళ్లు లోకంలోకి వెళ్లిపోయారు; యేసు మెస్సీయ[a] శరీరధారిగా వస్తున్నాడని[b] ఒప్పుకోనివారే వారు. అలాంటివాడే మోసగాడు మరియు క్రీస్తువిరోధి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు క్రీస్తు.”
    reason: Χριστός‌ను బిరుదుగా ‘మెస్సీయ’ అని లేదా సంప్రదాయ నామరూపంగా ‘క్రీస్తు’ అని అనువదించవచ్చు.
  - marker: b
    text: గ్రీకులో “శరీరధారిగా వస్తున్న” అని ఉంది; “శరీరధారిగా వచ్చిన” అని కూడా అనువదించవచ్చు.
    reason: ἐρχόμενον వర్తమాన కృదంతం. ప్రధాన పాఠ్యం దాని వర్తమాన రూపాన్ని నిలుపుతుంది; సందర్భాన్ని బట్టి పూర్తయిన రాకను సూచించే అనువాదం కూడా సాధ్యమే.
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణాన్ని తెలిపే అనుసంధాన పదంగా సహజమైన తెలుగులో అనువదించబడింది.
- source_word: πολλοὶ πλάνοι
  choice: అనేకమంది మోసగాళ్లు
  rationale: ఇక్కడ πλάνοι తాము తప్పిపోయినవారిని మాత్రమే కాక ఇతరులను తప్పుదారి పట్టించేవారిని సూచిస్తుంది; చివర ఉన్న ఏకవచన పదంతోనూ పదసామ్యం నిలుస్తుంది.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: లోకంలోకి బయలుదేరారు
  rationale: వారు బహిరంగంగా లోకంలో వ్యాపించిన భావాన్ని ఇస్తుంది; κόσμος‌కు అనవసరంగా ‘లోక వ్యవస్థ’ అనే అర్థం చేర్చదు.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: ఒప్పుకోని వారు
  rationale: బహిరంగ విశ్వాస ప్రకటన భావాన్ని సాధ్యమైనంత సహజంగా ఉంచుతూ, గ్రీకు కృదంతంలోని వ్యక్తులను సూచించే బలాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦν Χριστόν
  choice: యేసే మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసు యొక్క బిరుదుగా క్రీస్తు సంబంధమైన ఒప్పుకోలు యొక్క విషయాన్ని తెలియజేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘యేసే మెస్సీయ’ సహజంగా ఉంటుంది.
- source_word: ἐρχόμενον ἐν σαρκί
  choice: శరీరధారిగా వస్తున్న
  rationale: వర్తమాన కృదంతంలోని ‘వస్తున్న’ రూపాన్ని నిలుపుతూ, ἐν σαρκί నిజమైన మానవ శరీరధారణను సూచిస్తుందని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; ‘పాప స్వభావంతో’ అనే భావాన్ని రానివ్వదు.
- source_word: οὗτός ἐστιν ὁ πλάνος
  choice: అలాంటి వ్యక్తే మోసగాడు
  rationale: బహువచన వర్ణన తర్వాత వచ్చే ఏకవచన సూచనను, ఆ లక్షణం గల ప్రతి వ్యక్తిని ప్రత్యేకంగా గుర్తించే విధంగా తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὁ ἀντίχριστος
  choice: క్రీస్తువిరోధి
  rationale: యోహాను రచనలకు సంబంధించి తెలుగులో స్థిరపడిన, సులభంగా గుర్తించదగిన పదం; మూలపదంలోని వ్యతిరేకత భావాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: Χριστός పదం బిరుదా, పేరులో భాగమా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యం యేసు ఎవరో ఒప్పుకోవడంపైనే దృష్టి పెడుతుంది కాబట్టి Χριστός బిరుదుగా బలంగా పనిచేస్తుంది. ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἐρχόμενον ἐν σαρκί యొక్క కాల/దృక్కోణ బలం
  choice: శరీరధారిగా వస్తున్న
  alternative: శరీరధారిగా వచ్చిన
  rationale: గ్రీకులోని వర్తమాన కృదంతాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దానిని పూర్తిగా గత సంఘటనగా మాత్రమే నిర్ధారించలేదు. సాధారణంగా అంగీకరించబడిన గతకాల అనువాదాన్ని పాదసూచికలో తెలిపాం.
- issue: σάρξ యొక్క సందర్భార్థం
  choice: శరీరధారిగా
  alternative: మాంసంలో
  rationale: ఈ క్రీస్తు సంబంధ సందర్భంలో σάρξ నిజమైన శరీరసహిత మానవత్వాన్ని సూచిస్తుంది, పాప స్వభావాన్ని కాదు. పదశః కానీ అసహజమైన రూపం కంటే అర్థాన్ని స్పష్టంగా తెలిపే రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘మోసగాళ్లు/మోసగాడు’ అనే పదసామ్యాన్ని నిలిపాం. ‘శరీరధారిగా’ అనే రూపం మూలంలోని నిజమైన శరీరసహిత మానవత్వాన్ని సహజంగా తెలియజేస్తుంది. ప్రధాన పాఠ్యంలో [a], [b] గుర్తులు సంబంధిత పదబంధాల వద్ద ఉంచబడ్డాయి.
