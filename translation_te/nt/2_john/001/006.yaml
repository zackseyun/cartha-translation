id: 2JN.1.6
reference: 2 John 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: te
  text: 'ప్రేమ అంటే ఇదే: మనం ఆయన ఆజ్ఞల ప్రకారం నడుచుకోవడం. మీరు ఆరంభం నుండి విన్నట్లుగా, మీరు దానిలో నడుచుకోవాలన్నదే ఈ ఆజ్ఞ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ప్రేమలో నడుచుకోవాలి.” “దానిలో” అనే మాట ‘ఈ ఆజ్ఞ’కు బదులుగా ‘ప్రేమ’ను సూచిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం; యోహాను రచనలలోని పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ἵνα περιπατῶμεν
  choice: మనం ... నడుచుకోవడం
  rationale: ప్రేమ ఆచరణలో ఏమిటో వివరించే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: περιπατέω
  choice: నడుచుకోవడం
  rationale: నైతిక జీవనానికి సంబంధించిన యోహానీయ రూపకాన్ని ‘జీవించడం’గా సపాటుచేయకుండా, రెండు చోట్లా నిలుపుతుంది.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: ఆయన ఆజ్ఞల ప్రకారం
  rationale: κατά యొక్క అనుగుణత భావాన్ని, ఆజ్ఞల బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐντολάς / ἐντολή
  choice: ఆజ్ఞలు / ఆ ఆజ్ఞ
  rationale: మూలంలోని బహువచనం నుండి ఏకవచనానికి మార్పును, పదసంబంధాన్ని నిలుపుతుంది; గ్రీకులో రెండవ వాక్యంలో స్వామ్యసూచకం లేదు.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: మీరు ఆరంభం నుండి విన్న ప్రకారం
  rationale: యోహానీయ ‘ఆరంభం నుండి’ అనే ప్రయోగాన్ని, ἠκούσατε యొక్క గతకాల భావాన్ని కాపాడుతుంది.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: మీరు దానిలో నడుచుకోవాలన్నదే
  rationale: ἵνα యొక్క విషయవివరణ భావాన్ని, ἐν αὐτῇ అనే అస్పష్ట స్త్రీలింగ సర్వనామాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలోని αὐτῇ దేనిని సూచిస్తుంది?
  choice: సమీపంలో ఉన్న ఏకవచన ‘ఆజ్ఞ’ను సూచించేదిగా ప్రధాన పాఠంలో ‘దానిలో’ అని ఉంచడం
  alternative: 'మొదటి వాక్యంలోని ‘ప్రేమ’ను సూచించవచ్చు: ‘ప్రేమలో నడుచుకోవాలి’'
  rationale: స్త్రీలింగ ఏకవచనమైన ἐντολή సమీప వ్యాకరణ పూర్వపదం; అయితే ἀγάπη కూడా స్త్రీలింగ ఏకవచనమే, భావపరంగా దగ్గరి సంబంధం ఉంది. అందువల్ల అస్పష్టతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు. ‘నడుచుకోవడం’ అనే పునరావృత నైతిక రూపకాన్ని నిలిపి, మూలంలోని బహువచన–ఏకవచన మార్పును కాపాడాం.
