theological_decisions:
- issue: ‘తండ్రి’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: ‘తండ్రి’ అని మాత్రమే ఉంచడం
  alternative: ‘తండ్రియైన దేవుడు’
  rationale: గ్రీకు మూలంలో ‘తండ్రి’ అని మాత్రమే ఉంది. యోహాను సందర్భంలో అది దేవుణ్ణి సూచించినా, మూలంలో లేని ‘దేవుడు’ అనే పదాన్ని చేర్చలేదు.
- issue: ‘నీ పిల్లలు’ అనే మాట యొక్క పరిధి
  choice: ‘నీ పిల్లల్లో కొందరు’
  alternative: ‘నీ పిల్లలు’
  rationale: ἐκ అనే విభక్తి ప్రయోగం పిల్లలందరినీ తప్పనిసరిగా సూచించకుండా, వారిలో కొందరిని సూచిస్తుంది.
- issue: ‘సత్యంలో’ అనే పదబంధ భావం
  choice: సత్యానికి అనుగుణంగా జీవించే భావాన్ని మోసే రూపకాన్ని నిలుపడం
  alternative: ‘నిజాయితీగా’
  rationale: యోహాను వాడుకలో ఈ మాట కేవలం వ్యక్తిగత నిజాయితీని కాక, వెల్లడించబడిన సత్యానికి అనుగుణమైన జీవనాన్ని సూచించే అవకాశం ఉంది; అందుకే ఆ ఉద్వేగాన్ని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. ‘సత్యంలో నడుచుకోవడం’ అనే యోహాను రూపకాన్ని నిలుపుతూ, చివరి ఉపవాక్యంలో దాని సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేసింది.
