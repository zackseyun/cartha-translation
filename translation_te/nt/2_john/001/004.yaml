  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: te
  text: నీ పిల్లల్లో కొందరు[a] సత్యంలో[b] నడుచుకుంటున్నారని కనుగొన్నందుకు నేను ఎంతో సంతోషించాను; మనం తండ్రి నుండి పొందిన ఆజ్ఞ ప్రకారం వారు నడుచుకుంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పిల్లలలోనుండి కొందరు.’ గ్రీకు ప్రయోగం పిల్లలందరినీ తప్పనిసరిగా కాక, వారిలో ఒక భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సత్యానుసారంగా నడుచుకుంటున్నారు.’ ఈ పదబంధం కేవలం నిజాయితీగా ఉండడాన్ని కాక, వెల్లడించబడిన సత్యానికి అనుగుణంగా జీవించడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
