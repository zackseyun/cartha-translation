  source_fidelity: 'The draft accurately retains the referents and deliberately leaves open whether “sister” and “children” are literal or figurative. However, శుభాకాంక్షలు చెబుతున్నారు more specifically conveys offering good wishes, whereas ἀσπάζεταί σε is a conventional closing greeting: “greet you.”'
