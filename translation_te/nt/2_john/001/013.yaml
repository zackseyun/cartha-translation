  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ⸀ἐκλεκτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: te
  text: నీ ఎంపిక చేయబడిన సహోదరి పిల్లలు నీకు అభివాదాలు తెలియజేస్తున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: శుభాకాంక్షలు చెబుతున్నారు
  rationale: లేఖ ముగింపులో పలికే అభివాదాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὰ τέκνα
  choice: పిల్లలు
  rationale: సందర్భంలో సహజమైన సామూహిక అర్థాన్ని సరళంగా నిలుపుతుంది.
- source_word: τῆς ἀδελφῆς σου
  choice: నీ సహోదరి
  rationale: బంధుత్వ సూచనను మూలానికి దగ్గరగా ఉంచుతూ, ఇది రూపకాలంకారమా లేక అక్షరార్థమా అన్న విషయాన్ని నిర్ణయించదు.
- source_word: τῆς ἐκλεκτῆς
  choice: ఎంపిక చేయబడిన
  rationale: ἐκλεκτός అనే పదంలోని ‘ఎన్నుకోబడిన/ఎంపిక చేయబడిన’ భావాన్ని, దాని ధార్మిక లేదా సాధారణ ప్రయోగాన్ని ముందే తేల్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘సహోదరి’ మరియు ఆమె ‘పిల్లలు’ వ్యక్తులనో సంఘాలనో సూచిస్తున్నాయా
  choice: సహోదరి; పిల్లలు
  alternative: సహోదరి సంఘం; దాని సభ్యులు
  rationale: గ్రీకు వచనంలోని కుటుంబ రూపకాన్ని యథాతథంగా ఉంచి, దాని సూచితార్థాన్ని అనువాదంలోనే ఖరారు చేయలేదు.
- issue: ἐκλεκτῆς పదంలోని దైవీయ ఎంపిక భావం
  choice: ఎంపిక చేయబడిన
  alternative: ఎంపికైన / ప్రియమైన
  rationale: ‘ఎంపిక చేయబడిన’ అనేది మూల పదబంధానికి దగ్గరగా ఉండి, ఎవరు ఎంపిక చేశారో లేదా ఏ ఉద్దేశంతో ఎంపిక చేశారో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే లేఖా ముగింపు శైలి. గ్రీకులో ఏకవచన క్రియ నపుంసక బహువచన కర్తతో వచ్చే వ్యాకరణ నిర్మాణం; తెలుగులో సహజంగా బహువచన క్రియ వాడబడింది.
