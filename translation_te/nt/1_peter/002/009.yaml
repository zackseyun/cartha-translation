revisions:
- from: కాని మీరు ఎన్నుకోబడిన ప్రజలు[a], రాజసంబంధమైన యాజక సమూహం, పవిత్ర జనాంగం, ఆయన సొంతమైన ప్రజలు. చీకటిలోనుండి తన అద్భుతమైన వెలుగులోకి మిమ్మల్ని పిలిచినవాని మహోన్నత గుణాలను[b] మీరు ప్రకటించడానికి ఇలా ఉన్నారు.
  to: అయితే మీరు ఎన్నుకోబడిన వంశం[a], రాజసంబంధమైన యాజకత్వం, పవిత్ర జనాంగం, ఆయనకు సొంతమైన ప్రజలు; చీకటి నుండి తన అద్భుతమైన వెలుగులోకి మిమ్మల్ని పిలిచినవాని శ్రేష్ఠతలను[b] మీరు ప్రకటించడానికే ఇలా ఉన్నారు.
