id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: te
  text: అయితే మీరు ఎన్నుకోబడిన వంశం[a], రాజసంబంధమైన యాజకత్వం, పవిత్ర జనాంగం, ఆయనకు సొంతమైన ప్రజలు; చీకటి నుండి తన అద్భుతమైన వెలుగులోకి మిమ్మల్ని పిలిచినవాని శ్రేష్ఠతలను[b] మీరు ప్రకటించడానికే ఇలా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎన్నుకోబడిన ప్రజలు.’ గ్రీకు పదం వంశం, సంతతి, ప్రజలు లేదా జాతిని సూచించగలదు. ఆధునిక జాతి వర్గీకరణల భావాన్ని కలిగించకుండా సమష్టి భావాన్ని నిలుపడానికి ఇక్కడ ‘వంశం’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘స్తుతులను’ లేదా ‘గొప్ప కార్యాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: కాని మీరు
  rationale: δὲ ముందున్న అవిశ్వాసుల వర్ణనతో వ్యత్యాసాన్ని సూచిస్తుంది; స్పష్టంగా ఉన్న Ὑμεῖς ప్రత్యక్ష సంబోధనకు నొక్కు ఇస్తుంది.
- source_word: γένος ἐκλεκτόν
  choice: ఎన్నుకోబడిన ప్రజలు
  rationale: γένος వంశం, సంతతి లేదా ప్రజాసమూహాన్ని సూచించగలదు. ఆధునిక జాతి వర్గీకరణ భావం అనవసరంగా రాకుండా, సమష్టిగా దేవుడు ఎన్నుకున్నవారనే భావాన్ని ‘ప్రజలు’ సహజంగా తెలియజేస్తుంది.
- source_word: βασίλειον ἱεράτευμα
  choice: రాజసంబంధమైన యాజక సమూహం
  rationale: βασίλειον లోని రాజరిక భావాన్నీ, ἱεράτευμα లోని సమష్టి యాజకత్వాన్నీ నిలుపుతుంది; దీనిని వివరణాత్మకంగా ‘యాజకుల రాజ్యం’గా మార్చదు.
- source_word: ἔθνος ἅγιον
  choice: పవిత్ర జనాంగం
  rationale: ἔθνος యొక్క సమష్టి గుర్తింపును ‘జనాంగం’ తెలియజేస్తుంది; ἅγιον లోని దేవునికోసం ప్రత్యేకపరచబడిన భావాన్ని ‘పవిత్ర’ నిలుపుతుంది.
- source_word: λαὸς εἰς περιποίησιν
  choice: ఆయన సొంతమైన ప్రజలు
  rationale: περιποίησις ప్రత్యేక స్వాధీనత లేదా సొంతత్వాన్ని సూచిస్తుంది. సందర్భంలో యజమాని దేవుడని స్పష్టంగా ఉన్నందున ‘ఆయన’ అని తెలుగులో సహజంగా వ్యక్తం చేయబడింది.
- source_word: ὅπως
  choice: ప్రకటించడానికి
  rationale: తెలుగులో క్రియార్థక నిర్మాణం ద్వారా ὅπως సూచించే ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰς ἀρετὰς
  choice: మహోన్నత గుణాలను
  rationale: ἀρεταί దేవుని ప్రశంసార్హమైన శ్రేష్ఠతలను సూచిస్తుంది. ‘మహోన్నత గుణాలు’ ఆయన స్వభావంలోని ఔన్నత్యాన్ని నిలుపుతూ, కేవలం స్తుతి మాటలకో కార్యాలకో భావాన్ని పరిమితం చేయదు.
- source_word: ἐξαγγείλητε
  choice: మీరు ప్రకటించడానికి
  rationale: ἐξαγγέλλω లోని బహిరంగంగా తెలియజేసే భావాన్ని ‘ప్రకటించు’ స్పష్టంగా అందిస్తుంది.
- source_word: τοῦ ... καλέσαντος
  choice: పిలిచినవాని
  rationale: దేవుని పేరు వచనంలో చేర్చకుండా, ఆయన చేసిన పిలుపు ద్వారా ఆయనను గుర్తించే గ్రీకు కృదంత నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἐκ σκότους
  choice: చీకటిలోనుండి
  rationale: ἐκ సూచించే ఒక స్థితి లేదా పరిధిలోనుండి బయటకు తీసుకురావడమనే రూపకాన్ని నిలుపుతుంది.
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: తన అద్భుతమైన వెలుగులోకి
  rationale: εἰς లోని ప్రవేశ దిశను ‘లోకి’ తెలియజేస్తుంది; θαυμαστός లోని ఆశ్చర్యకరమైన, అద్భుతమైన గుణాన్ని సహజమైన ఉన్నత శైలిలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు నిబంధన బిరుదుల నుండి తీసుకున్న సమష్టి గుర్తింపు భాష
  choice: ‘ఎన్నుకోబడిన ప్రజలు,’ ‘రాజసంబంధమైన యాజక సమూహం,’ ‘పవిత్ర జనాంగం’ అనే సమష్టి బిరుదులను ప్రత్యక్షంగా నిలుపడం
  alternative: వాటి నిబంధన సంబంధిత బలాన్ని తగ్గించి సాధారణ రూపకాలుగా అనువదించడం
  rationale: పేతురు తన పాఠకులకు ఈ నిబంధన సంబంధిత గుర్తింపు భాషను ఉద్దేశపూర్వకంగా వర్తింపజేస్తున్నాడు. అనువాదం ఆ ఉద్రిక్తతను నిలుపుతుంది గాని, దానిపై విస్తృతమైన ఒక మతసిద్ధాంత వ్యవస్థను రుద్దదు.
- issue: λαὸς εἰς περιποίησιν లో సూచిత యజమాని
  choice: ‘ఆయన సొంతమైన ప్రజలు’ అని దేవుని సూచించే సర్వనామాన్ని స్పష్టం చేయడం
  alternative: ‘స్వాధీనత కోసం ఉన్న ప్రజలు’ అని యజమానిని చెప్పకుండా ఉంచడం
  rationale: గ్రీకు పదబంధంలో యజమాని ప్రత్యేకంగా పేర్కొనబడకపోయినా, సందర్భం దేవునినే స్పష్టంగా సూచిస్తుంది. తెలుగులో సంబంధాన్ని సహజంగా చెప్పడానికి ‘ఆయన’ అవసరం; ఇది సందర్భాధారిత స్పష్టీకరణ మాత్రమే.
- issue: βασίλειον ἱεράτευμα యొక్క నిర్మాణ సంబంధిత భావం
  choice: ‘రాజసంబంధమైన యాజక సమూహం’
  alternative: ‘యాజకుల రాజ్యం’ లేదా ‘రాజులైన యాజకులు’
  rationale: βασίλειον ను ‘రాజ్యం’గా మార్చడం గాని, సభ్యులందరినీ ‘రాజులు’గా స్పష్టీకరించడం గాని చేయకుండా, రాజరిక సంబంధం మరియు సమష్టి యాజకత్వం రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. నిబంధన సంబంధిత సమష్టి పదజాలం నిలుపబడింది. [b] గుర్తు దాని విషయానికి అనుగుణంగా τὰς ἀρετὰς అనువాదం వద్ద ఉంచబడింది.
