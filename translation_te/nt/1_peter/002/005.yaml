id: 1PE.2.5
reference: 1 Peter 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: te
  text: మీరు స్వయంగా కూడా సజీవమైన రాళ్లవలె ఆధ్యాత్మిక గృహంగా, పవిత్ర యాజక సమూహంగా నిర్మించబడుతున్నారు[a]; మెస్సీయ అయిన యేసు ద్వారా దేవునికి ఆమోదయోగ్యమైన ఆధ్యాత్మిక బలులు అర్పించడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పవిత్ర యాజక సమూహం కోసం” లేదా “పవిత్ర యాజక సమూహంగా ఉండేందుకు.” గ్రీకు εἰς గమ్యాన్ని లేదా ఫలితాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: మీరు కూడా
  rationale: καί యొక్క సమ్మిళిత భావాన్నీ, αὐτοὶ ద్వారా పాఠకులపై ఉంచిన నొక్కునూ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὡς λίθοι ζῶντες
  choice: సజీవ రాళ్లవలె
  rationale: ὡς లోని ఉపమాన భావాన్ని, ζῶντες లోని ‘జీవముగల’ భావాన్ని నిలుపుతుంది; ముందరి వచనంలోని సజీవ రాయి రూపకంతో సంబంధాన్ని కాపాడుతుంది.
- source_word: οἰκοδομεῖσθε
  choice: నిర్మించబడుతున్నారు
  rationale: వర్తమాన కర్మణి రూపాన్ని, కొనసాగుతున్న కార్య భావాన్ని నిలుపుతూ, వచనం చెప్పని కర్తను అనువాదంలో చేర్చదు.
- source_word: οἶκος πνευματικὸς
  choice: ఆధ్యాత్మిక గృహం
  rationale: ‘గృహం’ οἶκος కు నేరమైన సమానార్థకం; ‘మందిరం’ అని అనువదించి ఆలయ భావాన్ని అవసరానికి మించి స్పష్టీకరించకుండా, సజీవ రాళ్ల నిర్మాణ రూపకాన్ని నిలుపుతుంది.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: పవిత్ర యాజక సమూహంగా ఏర్పడి
  rationale: ἱεράτευμα వ్యక్తిగత యాజకులను కాక యాజక సమూహాన్ని సూచిస్తుంది. εἰς లోని గమ్యం లేదా ఫలిత భావాన్ని వాక్య ప్రవాహంలో సహజంగా వ్యక్తం చేస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: ఆధ్యాత్మిక బలులు అర్పించడానికి
  rationale: బలి సందర్భంలో ἀναφέρω కు తగిన ‘అర్పించు’ను వాడి, బలుల స్వరూపం గురించి మూలపాఠం చెప్పనిదాన్ని జోడించదు.
- source_word: εὐπροσδέκτους θεῷ
  choice: దేవునికి ఆమోదయోగ్యమైన
  rationale: బలులను దేవుడు స్వీకరించడానికి యోగ్యమైనవిగా చెప్పే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: మెస్సీయ అయిన యేసు ద్వారా
  rationale: διά సహిత షష్ఠీ విభక్తిలోని మధ్యవర్తిత్వం లేదా సాధన భావాన్ని ‘ద్వారా’ నిలుపుతుంది; Χριστός ను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని సహజమైన తెలుగు పదబంధంలో చూపిస్తుంది.
theological_decisions:
- issue: οἰκοδομεῖσθε లోని voice మరియు కార్యనిర్వాహకుడు
  choice: కర్మణి రూపమైన ‘నిర్మించబడుతున్నారు’; కర్తను పేర్కొనలేదు
  alternative: ‘మిమ్మల్ని దేవుడు నిర్మిస్తున్నాడు’ లేదా ‘మిమ్మల్ని మీరు నిర్మించుకోండి’
  rationale: రూపం కర్మణిగా అర్థం కావడానికి బలమైన ఆధారం ఉంది; మూలవచనం కార్యనిర్వాహకుడిని స్పష్టంగా చెప్పనందున దేవుణ్ణి ప్రత్యక్ష కర్తగా చేర్చలేదు, అలాగే మధ్యమ/ఆత్మనేపద ఆజ్ఞార్థ భావాన్ని రుద్దలేదు.
- issue: εἰς ἱεράτευμα ἅγιον యొక్క గమ్యం/ఫలిత భావం
  choice: ‘పవిత్ర యాజక సమూహంగా ఏర్పడి’
  alternative: ‘పవిత్ర యాజక సమూహం కోసం’ లేదా ‘పవిత్ర యాజక సమూహంగా ఉండేందుకు’
  rationale: εἰς గమ్యాన్ని లేదా ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠం సహజంగా ఉండేలా ఫలిత భావాన్ని ఎంచుకుని, ఇతర సాధ్య భావాన్ని పాదసూచికలో ఇచ్చింది.
- issue: Χριστοῦ ను బిరుదుగా చూపించడం
  choice: ‘మెస్సీయ అయిన యేసు’
  alternative: ‘యేసు క్రీస్తు’
  rationale: ఇక్కడ Χριστός యేసుకు అనుసంధానమైన బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ అయిన యేసు’ ఆ బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది; క్రీస్తు సంబంధ సిద్ధాంతాన్ని అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘యాజక సమూహం’ అనే పదబంధం ἱεράτευμα లోని సమష్టి భావాన్ని స్పష్టం చేస్తుంది. ‘గృహం’ మూలంలోని నిర్మాణ రూపకాన్ని కాపాడుతూ ‘మందిరం’ అనే అదనపు నిర్దిష్టతను నివారిస్తుంది.
