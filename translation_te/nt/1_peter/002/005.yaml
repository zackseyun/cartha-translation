review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the living-stones metaphor, the ongoing passive force of οἰκοδομεῖσθε, the corporate sense of ἱεράτευμα, and mediation through Jesus the Messiah. However, its final “ఇది” has no antecedent in Telugu, and “అర్పించడానికే” adds an unwarranted restrictive emphasis (‘only/indeed for’) absent from ἀνενέγκαι.
  naturalness: The main sentence is disrupted by the dangling final “ఇది.” Recasting the two εἰς/result expressions as coordinated complements of “నిర్మించబడుతున్నారు” produces clear, modern standard Telugu while retaining the Greek imagery and syntax.
  terminology: “ఆధ్యాత్మిక గృహం,” “పవిత్ర యాజక సమూహం,” “ఆధ్యాత్మిక బలులు,” and “మెస్సీయ అయిన యేసు” are appropriate. “యాజక సమూహం” correctly conveys the collective character of ἱεράτευμα without unnecessarily identifying it with an institutional priesthood.
  issues:
  - severity: high
    issue: The sentence ends with “ఇది,” which lacks a grammatical antecedent.
    rationale: The Greek has no demonstrative corresponding to “ఇది.” In Telugu this creates a syntactically incomplete and semantically unclear conclusion.
  - severity: medium
    issue: “అర్పించడానికే” introduces restrictive/emphatic force.
    rationale: The infinitive ἀνενέγκαι expresses purpose, not ‘only’ or an equivalent restrictive emphasis. “అర్పించడానికి” is sufficient.
  - severity: low
    issue: The emphasis of αὐτοὶ is not fully represented by “మీరు కూడా.”
    rationale: Adding “స్వయంగా” naturally preserves the emphatic pronoun while retaining the additive force of καί.
  revised_text: మీరు స్వయంగా కూడా సజీవమైన రాళ్లవలె ఆధ్యాత్మిక గృహంగా, పవిత్ర యాజక సమూహంగా నిర్మించబడుతున్నారు[a]; మెస్సీయ అయిన యేసు ద్వారా దేవునికి ఆమోదయోగ్యమైన ఆధ్యాత్మిక బలులు అర్పించడానికి.
  revised_footnotes:
