revisions:
- from: మీరు కూడా సజీవ రాళ్లవలె ఆధ్యాత్మిక గృహంగా నిర్మించబడుతున్నారు; పవిత్ర యాజక సమూహంగా ఏర్పడి[a], మెస్సీయ అయిన యేసు ద్వారా దేవునికి ఆమోదయోగ్యమైన ఆధ్యాత్మిక బలులు అర్పించడానికే ఇది.
  to: మీరు స్వయంగా కూడా సజీవమైన రాళ్లవలె ఆధ్యాత్మిక గృహంగా, పవిత్ర యాజక సమూహంగా నిర్మించబడుతున్నారు[a]; మెస్సీయ అయిన యేసు ద్వారా దేవునికి ఆమోదయోగ్యమైన ఆధ్యాత్మిక బలులు అర్పించడానికి.
  rationale: The revision removes the unsupported and dangling “ఇది,” changes the restrictive “అర్పించడానికే” to the source-faithful purposive “అర్పించడానికి,” and restores the emphasis of αὐτοὶ with “స్వయంగా.” It retains the source’s passive voice, its two coordinated result/goal expressions, the collective sense of ἱεράτευμα, and the title sense of Χριστός. The footnote remains anchored to “పవిత్ర యాజక సమూహంగా” and presents the legitimate εἰς alternatives without deciding beyond the text.
