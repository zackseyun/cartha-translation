    text: లేదా “పవిత్ర యాజక సమూహం కోసం” లేదా “పవిత్ర యాజక సమూహంగా ఉండేందుకు.” గ్రీకు εἰς గమ్యాన్ని లేదా ఫలితాన్ని సూచించగలదు.
    reason: alternative_reading
  revision_rationale: The revision removes the unsupported and dangling “ఇది,” changes the restrictive “అర్పించడానికే” to the source-faithful purposive “అర్పించడానికి,” and restores the emphasis of αὐτοὶ with “స్వయంగా.” It retains the source’s passive voice, its two coordinated result/goal expressions, the collective sense of ἱεράτευμα, and the title sense of Χριστός. The footnote remains anchored to “పవిత్ర యాజక సమూహంగా” and presents the legitimate εἰς alternatives without deciding beyond the text.
