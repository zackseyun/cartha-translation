id: 1PE.2.8
reference: 1 Peter 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: te
  text: 'మరియు,


    “తడబడేలా చేసే రాయి,


    అభ్యంతరానికి కారణమయ్యే బండ.”


    వారు వాక్యానికి లోబడక తడబడుతున్నారు; ఇందుకే వారు కూడా నియమించబడ్డారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇందుకే’ అనేది వారు తడబడటాన్ని సూచించవచ్చు; లేదా ముందున్న అవిధేయతతో కూడిన మొత్తం పరిణామాన్ని సూచించవచ్చు.
    reason: εἰς ὃ καὶ ἐτέθησανలోని సంబంధసర్వనామం దేనిని సూచిస్తుందో వ్యాఖ్యానపరంగా వివాదాస్పదం. ప్రధాన పాఠం ఆ సందిగ్ధతను అతిగా నిర్దిష్టం చేయదు.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: తడబడేలా చేసే రాయి
  rationale: πρόσκομμα యొక్క రూపకార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, రాయి వల్ల తడబడటం అనే చిత్రాన్ని నిలుపుతుంది.
- source_word: πέτρα σκανδάλου
  choice: అభ్యంతరానికి కారణమయ్యే బండ
  rationale: σκάνδαλον ఇక్కడ కలిగించే అభ్యంతరం లేదా పతనకారణం అనే భావాన్ని సూచిస్తుంది; λίθος/πέτρα భేదాన్ని ‘రాయి/బండ’గా నిలిపింది.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: వాక్యానికి లోబడక
  rationale: ἀπειθέω కేవలం మానసిక అవిశ్వాసం కాక, నమ్మకంతో కూడిన విధేయతను నిరాకరించడాన్ని సూచించగలదు; dative τῷ λόγῳను ‘వాక్యానికి’గా అనుసంధానించింది.
- source_word: εἰς ὃ καὶ ἐτέθησαν
  choice: ఇందుకే వారు నియమించబడ్డారు
  rationale: ἐτέθησαν యొక్క దైవిక పాసివ్ భావాన్ని ‘నియమించబడ్డారు’గా, εἰς ὅ యొక్క ఉద్దేశ్యం/గమ్యం సంబంధాన్ని ‘ఇందుకే’గా ఉంచింది; ‘ఇది’ దేనిని సూచిస్తుందో మూలంలోని కొంత సందిగ్ధతను పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: εἰς ὃలోని ὅ దేనిని సూచిస్తుంది?
  choice: ‘ఇందుకే’ అని అనువదించి, సమీపంలోని తడబడటాన్ని ప్రధాన సూచనగా ఉంచడం
  alternative: వాక్యానికి లోబడకపోవడానికే వారు నియమించబడ్డారని స్పష్టంగా చెప్పడం
  rationale: నపుంసక ఏకవచన సంబంధసర్వనామం మొత్తం ముందరి పరిణామాన్ని—ముఖ్యంగా తడబడటాన్ని—సూచించవచ్చు. అవిధేయతకే ముందుగా నియమించబడ్డారని వ్యాఖ్యానాత్మకంగా నిర్ధారించకుండా మూలంలోని ఉద్వేగం, సందిగ్ధత నిలిపాం.
- issue: ἐτέθησανలో దైవిక చర్య
  choice: కర్తను పేర్కొనకుండా ‘నియమించబడ్డారు’ అనే కర్మణి రూపం
  alternative: ‘దేవుడు వారిని నియమించాడు’
  rationale: గ్రీకు పాఠంలో కర్త ప్రత్యక్షంగా లేదు. దైవిక పాసివ్ కావచ్చునుగాని, అనువాదంలో కర్తను చేర్చకపోవడం మూలరూపానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. ఉద్ధరణలోని సమాంతర చిత్రాలను ‘రాయి/బండ’గా నిలిపి, వాక్యాంతంలోని సిద్ధాంతపరమైన ఉద్వేగాన్ని వివరణతో తొలగించలేదు.
