  to: 'మరియు,


    “తడబడేలా చేసే రాయి,


    అభ్యంతరానికి కారణమయ్యే బండ.”


    వారు వాక్యానికి లోబడక తడబడుతున్నారు; ఇందుకే వారు కూడా నియమించబడ్డారు.[a]'
  rationale: The revision removes the unsupported change-of-state implication of ‘అయ్యాడు’ and restores the force of καί with ‘కూడా.’ It otherwise preserves the draft’s faithful, accessible rendering and its non-sectarian treatment of the contested antecedent.
