id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: te
  text: ఆయనే తన శరీరంలో మన పాపాలను చెట్టుమీద[a] మోశాడు, తద్వారా మనము పాపాలకు చనిపోయి నీతి కొరకు జీవించగలము. ఆయన గాయం[b] వలన మీరు స్వస్థత పొందారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సిలువమీద”; గ్రీకులో “చెట్టుమీద” అని ఉంది. ఇది ద్వితీయోపదేశకాండము 21:23ను ప్రతిధ్వనింపజేస్తుండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “ఆయన దెబ్బవల్ల ఏర్పడిన మచ్చ వల్ల” లేదా “ఆయన కమిలిన గాయం వల్ల”; గ్రీకులోని ఏకవచన పదం యెషయా 53:5ను ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ స్వస్థతను విస్తృతంగా వ్యక్తం చేశారు. సందర్భంలో అది పాపాలు, నీతితో ముడిపడి ఉంది; అయితే దాని భావాన్ని కేవలం శారీరక స్వస్థతకో, కేవలం ఆత్మీయ స్వస్థతకో పరిమితం చేయలేదు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: మోశాడు
  rationale: ἀναφέρω ఇక్కడ పాపాలను భరించడం/మోసడం అనే భావాన్ని ఇస్తుంది. “మోశాడు” యెషయా 53 ప్రతిధ్వనిని నిలుపుతూ, దీనిని కేవలం సాంకేతిక బలి పదంగా పరిమితం చేయదు.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: తన శరీరంలో
  rationale: క్రీస్తు అనుభవించిన శారీరక బాధను స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ τὸ ξύλον
  choice: చెట్టుమీద
  rationale: ξύλον యొక్క ‘చెట్టు/కలప’ అనే మూలార్థాన్ని, అలాగే ద్వితీయోపదేశకాండము 21:23తో ఉండగల ప్రతిధ్వనిని కాపాడుతుంది; ‘సిలువమీద’ అనేది స్పష్టీకరణాత్మక ప్రత్యామ్నాయం.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: మన పాపాల విషయంలో చనిపోయి
  rationale: ἀπογίνομαι సూచించే పాపాలతో నిర్ణాయకమైన తెగతెంపును తెలుగులో గ్రాహ్యంగా వ్యక్తం చేస్తుంది. గ్రీకులోని బహువచనానికి అనుగుణంగా ‘పాపాలు’ ఉంచబడింది.
- source_word: τῇ δικαιοσύνῃ
  choice: నీతి కోసం
  rationale: నీతి వైపు మళ్లిన జీవితం అనే నైతిక దిశను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μώλωπι
  choice: గాయం
  rationale: దెబ్బవల్ల ఏర్పడిన గాయం లేదా కమిలిన మచ్చను సూచించే ఏకవచన పదానికి ‘గాయం’ సహజమైన విస్తృత సమానార్థకం; ఇది యెషయా 53:5 ప్రతిధ్వనిని కూడా నిలుపుతుంది.
- source_word: ἰάθητε
  choice: మీరు స్వస్థత పొందారు
  rationale: గ్రీకు భూతకాల కర్మణి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, స్వస్థతను కేవలం శారీరకమైనదిగా గానీ కేవలం ఆత్మీయమైనదిగా గానీ పరిమితం చేయదు.
- source_word: αὐτὸς
  choice: ఆయనే
  rationale: గ్రీకు సర్వనామంలోని ఉద్ఘాటనను ‘ఏ’ ప్రత్యయంతో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: చివరి వాక్యంలోని స్వస్థత పరిధి
  choice: ‘మీరు స్వస్థత పొందారు’ అని విస్తృతంగానే ఉంచడం
  alternative: కేవలం శారీరక స్వస్థత; లేదా కేవలం పాపం నుండి ఆత్మీయ స్వస్థత
  rationale: తక్షణ సందర్భం పాపాలు, నీతి, క్రీస్తు బాధలపై కేంద్రీకృతమైనప్పటికీ, ἰάθητε అనే పదం స్వయంగా స్వస్థతను ఒకే విభాగానికి పరిమితం చేయదు. అందువల్ల మూలంలోని ధార్మిక విస్తృతిని, ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ξύλον అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘చెట్టు’
  alternative: ‘సిలువ’
  rationale: ఈ పదం యేసు సిలువ మరణాన్ని సూచిస్తున్నప్పటికీ, గ్రీకు పాఠ్యంలో σταυρός కాక ξύλον ఉంది. ‘చెట్టు’ అనే అనువాదం మూలపదాన్ని, లేఖన ప్రతిధ్వనిని కాపాడుతుంది; ‘సిలువ’ను పాదసూచికలో వివరణాత్మక ప్రత్యామ్నాయంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన లేఖన శైలిలో రూపొందించబడింది. ‘ఆయనే’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘చెట్టుమీద’ మూలభాషా రూపాన్ని కాపాడుతుంది.
