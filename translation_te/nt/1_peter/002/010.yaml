id: 1PE.2.10
reference: 1 Peter 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: te
  text: ఒకప్పుడు ఒక ప్రజ కాని మీరు[a] ఇప్పుడు దేవుని ప్రజ అయ్యారు; కనికరం పొందని మీరు[b] ఇప్పుడు కనికరం పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పేతురు హోషేయ 1:9-10; 2:23ను ప్రతిధ్వనింపజేస్తూ, ఇశ్రాయేలు పునరుద్ధరణకు సంబంధించిన భాషను తన పాఠకులు దేవుని ప్రజలుగా ఇప్పుడు కలిగివున్న గుర్తింపుకు అన్వయిస్తున్నాడు.
    reason: cross_reference
  - marker: b
    text: 'లేదా: “కనికరం చూపబడని మీరు, ఇప్పుడు కనికరం చూపబడ్డారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: మీరు
  rationale: ఈ బహువచన సంబంధ సర్వనామం ముందటి వచనంలో సంబోధించబడిన పాఠకులను సూచిస్తుంది. తెలుగులో రెండు సమాంతర ఉపవాక్యాల్లో ‘మీరు’ అనడం సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: ποτε
  choice: ఒకప్పుడు
  rationale: ఇది νῦν (‘ఇప్పుడు’)తో వ్యత్యాసంగా గత స్థితిని సూచిస్తుంది; ‘ఒకప్పుడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: λαὸς
  choice: ప్రజ / దేవుని ప్రజ
  rationale: λαός సమష్టిగా ఒక ప్రజాసమూహాన్ని, ముఖ్యంగా నిబంధన సంబంధ సందర్భంలో, సూచిస్తుంది. మొదటి భాగంలో ‘ప్రజగా’ అని గ్రీకు పాఠంలోని అనిర్దిష్ట భావాన్ని నిలిపి, రెండవ భాగంలో λαὸς θεοῦను ‘దేవుని ప్రజగా’ అని అనువదించాం.
- source_word: θεοῦ
  choice: దేవుని
  rationale: ఈ షష్ఠీ విభక్తి సంబంధం దేవునికి చెందిన ప్రజ అనే భావాన్ని వ్యక్తపరుస్తుంది; ‘దేవుని ప్రజ’ సహజమూ గంభీరమూ అయిన తెలుగు రూపం.
- source_word: οὐκ ἠλεημένοι
  choice: కనికరం పొందని
  rationale: పరిపూర్ణ కర్మణి కృదంతం కనికరానికి పాత్రులుగా లేకపోయిన పూర్వ స్థితిని సూచిస్తుంది. ‘కనికరం పొందని’ ఫలిత స్థితిని సంక్షిప్తంగా తెలియజేస్తుంది; కర్మణి ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἐλεηθέντες
  choice: కనికరం పొందారు
  rationale: ఆరిస్టు కర్మణి కృదంతం దేవుని కనికర కార్యం వల్ల ఏర్పడిన ప్రస్తుత స్థితిని ముందరి స్థితితో వ్యత్యాసపరుస్తుంది. ‘కనికరం పొందారు’ తెలుగులో సహజంగా ఉండి, ముందరి పదబంధంతో పదసామ్యాన్ని కాపాడుతుంది.
- source_word: δὲ
  choice: ఇప్పుడు
  rationale: గ్రీకులో δέ వ్యత్యాసాన్ని సూచిస్తుంది; తెలుగులో ‘ఒకప్పుడు ... ఇప్పుడు’ అనే నిర్మాణమే ఆ స్పష్టమైన తిరుగుదలను సహజంగా వ్యక్తం చేస్తుంది. అదనంగా ‘కాని’ చేర్చడం అవసరం లేదు.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: విశ్వాసుల ప్రస్తుత స్థితిని వారి పూర్వ స్థితితో వ్యత్యాసపరుస్తుంది; ‘ఇప్పుడు’ ప్రత్యక్షమైన సమానార్థకం.
theological_decisions:
- issue: హోషేయ గ్రంథ ప్రతిధ్వని మరియు నిబంధన-ప్రజ గుర్తింపు
  choice: మొదటి భాగాన్ని ‘ప్రజగా లేని’ అని, రెండవ భాగాన్ని ‘దేవుని ప్రజగా’ అని అనువదించి, గ్రీకు పాఠంలోని తేడాను నిలిపాం.
  alternative: రెండు భాగాల్లోనూ ‘దేవుని ప్రజ’ అని విస్తరించడం, లేదా మరింత పదానువాదంగా అసహజమైన ‘ప్రజ కాదు ... దేవుని ప్రజ’ అనే రూపం వాడడం.
  rationale: గ్రీకు మొదట ‘ప్రజ కాదు’ అని మాత్రమే చెబుతుంది; తరువాత ‘దేవుని ప్రజ’ అని చెబుతుంది. ఈ తేడాను కాపాడడం హోషేయ నేపథ్యంలోని సమష్టి నిబంధనాత్మక తిరుగుదలను వినిపిస్తుంది; అదే సమయంలో జాతి లేదా సంఘశాఖకు సంబంధించిన సంకుచిత భావాన్ని పాఠ్యంలోకి చేర్చదు.
- issue: కనికరం పొందడం మరియు కనికరం చూపబడడం
  choice: ప్రధాన పాఠ్యంలో ‘కనికరం పొందని ... కనికరం పొందారు’ అని స్వీకర్త దృష్టికోణంలో అనువదించాం.
  alternative: ‘కనికరం చూపబడని ... కనికరం చూపబడిన’ అని కర్మణి రూపంలో అనువదించడం.
  rationale: రెండు రూపాలూ గ్రీకు కర్మణి భావానికి సాధ్యమైనవి. ప్రధాన రూపం ఆధునిక తెలుగులో సహజంగా ఉండగా, పాదసూచిక ప్రత్యామ్నాయం దేవుని కనికర కార్యాన్ని మరింత ప్రత్యక్షంగా వ్యక్తపరుస్తుంది; మూలంలోని భావపరిధి రెండింటిలోనూ నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. రెండు సమాంతర భాగాల లయను, ‘ఒకప్పుడు/ఇప్పుడు’ వ్యత్యాసాన్ని, సమష్టి ప్రజ-గుర్తింపును కాపాడాం.
