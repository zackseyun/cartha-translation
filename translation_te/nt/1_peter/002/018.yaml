id: 1PE.2.18
reference: 1 Peter 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: te
  text: ఇంటి దాసులారా[a], మీ యజమానులకు పూర్ణ గౌరవంతో[b] లోబడి ఉండండి—మంచివారికీ సౌమ్యులకూ మాత్రమే కాకుండా, వక్రులైనవారికి[c] కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇంటి సేవకులారా.” గ్రీకు పదం ప్రత్యేకంగా ఒక ఇంటిలోని ఆధారిత దాసులు లేదా సేవకులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పూర్తి భయంతో”; ఇక్కడ గౌరవపూర్వక విధేయత అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “కఠినులైనవారికి” లేదా “అన్యాయస్థులైనవారికి.” గ్రీకు పదానికి అక్షరార్థంగా “వంకరైన, వక్రమైన” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: ఇంటి దాసులారా
  rationale: ఈ పదం సాధారణ సేవకులను కాక, ఒక ఇంటికి చెందిన గృహ దాసులు లేదా ఆధారిత సేవకులను ప్రత్యేకంగా సూచిస్తుంది. ‘ఇంటి’ అనేది గృహ సందర్భాన్ని నిలుపుతుంది; ‘దాసులు’ ఆ కాలంలోని అధీన సామాజిక స్థితిని మరీ మృదువుగా మార్చకుండా తెలియజేస్తుంది.
- source_word: ὑποτασσόμενοι
  choice: లోబడి ఉండండి
  rationale: వ్యాకరణపరంగా ఇది వర్తమాన కృదంతమైనా, సందర్భంలో ఆజ్ఞార్థక బలంతో ఉంది. ఆధునిక తెలుగులో ‘లోబడి ఉండండి’ సహజంగా ఉండి, కొనసాగుతున్న విధేయ వైఖరిని వ్యక్తం చేస్తుంది.
- source_word: ἐν παντὶ φόβῳ
  choice: సంపూర్ణ గౌరవంతో
  rationale: φόβος అనే పదానికి భయం, భయభక్తి, గౌరవం అనే అర్థ పరిధి ఉంది. ఇక్కడ యజమానుల పట్ల చూపవలసిన గౌరవపూర్వక విధేయత సందర్భానుసారమైన భావం; ‘భయం’ అని మాత్రమే అనువదిస్తే భీతిని ఆజ్ఞాపిస్తున్నట్టు అపార్థం కావచ్చు. అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: δεσπόταις
  choice: యజమానులకు
  rationale: గృహ దాసులపై అధికారం కలిగినవారిని ఈ పదం సూచిస్తుంది. తెలుగులో ‘యజమానులు’ ఈ సామాజిక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀγαθοῖς
  choice: మంచివారికి
  rationale: ἀγαθός యొక్క విస్తృతమైన నైతిక అర్థమైన ‘మంచి’ని నేరుగా నిలుపుతుంది.
- source_word: ἐπιεικέσιν
  choice: సౌమ్యులకు
  rationale: ἐπιεικής లోని మృదుత్వం, సహనం, సమంజసత అనే భావాలను ‘సౌమ్యులు’ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: σκολιοῖς
  choice: వక్రులైనవారికి
  rationale: σκολιός యొక్క అక్షరార్థమైన ‘వంకర/వక్ర’ రూపకాన్ని నిలుపుతూ, నైతికంగా వక్రమైన లేదా అన్యాయంగా ప్రవర్తించే వ్యక్తులను సూచిస్తుంది. ‘కఠినులు’ అని మాత్రమే చెప్పడం దాని అర్థాన్ని తీవ్రతకే పరిమితం చేస్తుంది.
theological_decisions:
- issue: οἰκέται సూచించే సామాజిక స్థితిని మృదువుగా చేయాలా లేక అతిశయింపజేయాలా
  choice: ‘ఇంటి దాసులు’ అని అనువదించడం
  alternative: ‘ఇంటి సేవకులు’ అని అనువదించడం
  rationale: మూలపదం గృహ పరిధిలోని ఆధారిత దాసులు/సేవకులను సూచిస్తుంది. ‘ఇంటి దాసులు’ గృహ సందర్భాన్నీ, వారి అధీన స్థితినీ నిలుపుతుంది; ప్రత్యామ్నాయ పదాన్ని పాదసూచికలో ఇచ్చాం.
- issue: φόβος ను భయం అని అక్షరార్థంగా ఇవ్వాలా, సందర్భార్థంగా గౌరవం అని ఇవ్వాలా
  choice: ప్రధాన పాఠ్యంలో ‘సంపూర్ణ గౌరవంతో’
  alternative: ‘పూర్తి భయంతో’ లేదా ‘పూర్ణ భయభక్తితో’
  rationale: ఈ గృహ నియమ సందర్భంలో గౌరవపూర్వక విధేయత ప్రధాన భావం. అయినా మూలంలోని ‘భయం’ అనే పదబంధాన్ని పాదసూచికలో తెలియజేయడం ద్వారా దాని అర్థ ఉద్రిక్తతను దాచలేదు.
- issue: σκολιός రూపకాన్ని నిలుపాలా లేక ‘కఠినులు/అన్యాయస్థులు’ అని వివరించాలా
  choice: ‘వక్రులైనవారు’ అనే రూపకాత్మక అనువాదం
  alternative: ‘కఠినులైనవారు’ లేదా ‘అన్యాయస్థులు’
  rationale: మూలంలోని ‘వంకర, వక్ర’ రూపకం వ్యక్తుల స్వభావం మరియు ప్రవర్తన రెండింటినీ సూచించగలదు. ఒకే నిర్దిష్ట భావానికి పరిమితం చేయకుండా రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సాధ్యమైన సందర్భార్థాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించాం. సంబోధనను స్పష్టంచేయడానికి ‘-ఆరా’ రూపం, సందర్భంలోని ఆజ్ఞార్థక కృదంతానికి సహజమైన ‘లోబడి ఉండండి’ వాడాం. మూలంలోని సామాజిక అసమానతను మృదువుగా చేయలేదు; అలాగే ఈ వాక్యం ఆ వ్యవస్థను సమర్థిస్తున్నదనే అదనపు వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చలేదు.
