id: 1PE.2.23
reference: 1 Peter 2:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: te
  text: దూషింపబడినప్పుడు, ఆయన తిరిగి దూషించలేదు; బాధపడుతున్నప్పుడు, ఆయన బెదిరించలేదు; అయితే న్యాయంగా తీర్పు తీర్చేవానికి అప్పగిస్తూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనను తాను న్యాయంగా తీర్పు తీర్చేవానికి అప్పగించుకుంటూ ఉన్నాడు.” గ్రీకు వాక్యంలో అప్పగించిన కర్మను ప్రత్యక్షంగా పేర్కొనలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιδορούμενος
  choice: ఆయనను దూషించినప్పుడు
  rationale: నోటిమాటలతో అవమానించడం లేదా దూషించడం అనే నిష్క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀντελοιδόρει
  choice: ఆయన తిరిగి దూషించలేదు
  rationale: ἀντί-లోని ప్రతిస్పందన భావాన్ని ‘తిరిగి’ తెలియజేస్తుంది; అసంపూర్ణ భూతకాల రూపంలోని కొనసాగిన లేదా లక్షణాత్మకమైన ప్రతీకారరాహిత్యాన్ని సందర్భం మోస్తుంది.
- source_word: πάσχων
  choice: బాధ అనుభవించినప్పుడు
  rationale: ముందటి భాగంతో సమాంతరమైన కాలసూచక ఉపవాక్యంగా వర్తమాన కృదంతాన్ని సహజంగా అందిస్తుంది.
- source_word: ἠπείλει
  choice: బెదిరించలేదు
  rationale: బెదిరింపులు పలకడం అనే క్రియార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: παρεδίδου
  choice: తనను తాను అప్పగించుకుంటూ ఉన్నాడు
  rationale: παραδίδωμι యొక్క అప్పగించడం/ఒప్పగించడం అనే భావాన్నీ, అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యనూ కాపాడుతుంది; గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోయినా సందర్భం సూచించే ఆత్మసమర్పణను తెలుగులో స్పష్టంచేస్తుంది.
- source_word: τῷ κρίνοντι δικαίως
  choice: న్యాయంగా తీర్పు తీర్చే ఆయనకు
  rationale: దేవుని పేరు లేదా బిరుదును పాఠ్యంలో చేర్చకుండా, న్యాయంగా తీర్పు చేసే వ్యక్తిని వర్ణించే గ్రీకు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ప్రతీకారం చేయకపోవడం నుంచి తనను న్యాయనిర్ణేతకు అప్పగించుకోవడం వైపు ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ὃς
  choice: ఆయన
  rationale: మునుపటి వచనంలోని క్రీస్తును సూచించే సంబంధసర్వనామాన్ని, స్వతంత్రంగా చదివే తెలుగు వాక్యంలో సహజమైన సర్వనామంగా అందిస్తుంది.
theological_decisions:
- issue: ‘న్యాయంగా తీర్పు తీర్చే ఆయన’ అనే మాటకు సూచితుడు
  choice: పేరు లేదా దైవిక వ్యక్తిత్వాన్ని అదనంగా పేర్కొనకుండా గ్రీకు వచనంలాగే వర్ణనాత్మకంగా ఉంచడం
  alternative: ‘న్యాయంగా తీర్పు తీర్చే దేవునికి’ లేదా ‘తండ్రికి’ అని స్పష్టీకరించడం
  rationale: సందర్భంలో సూచితుడు దేవుడే అయినప్పటికీ, మూలపాఠం ఆయనను పేరు లేదా నిర్దిష్ట బిరుదుతో పేర్కొనదు; అందువల్ల అనువాదం ఆ వేదాంతపరమైన సూచనను అతిగా నిర్ధారించదు.
- issue: παρεδίδουలో ప్రత్యక్ష కర్మ లేకపోవడం
  choice: ప్రధాన పాఠ్యంలో ‘తనను తాను అప్పగించుకుంటూ ఉన్నాడు’ అని సందర్భార్థాన్ని వ్యక్తం చేసి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం
  alternative: ‘తన విషయాన్ని అప్పగిస్తూ ఉన్నాడు’ లేదా కర్మను పేర్కొనకుండా ‘అప్పగిస్తూ ఉన్నాడు’
  rationale: సహనంతో బాధను ఎదుర్కొన్న క్రీస్తు తనను న్యాయనిర్ణేతకు అప్పగించుకున్నాడనే భావం సందర్భానికి సరిపోతుంది; అయినా గ్రీకు కర్మను స్పష్టంగా చెప్పనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దూషించు,’ ‘బాధ అనుభవించు,’ ‘న్యాయంగా తీర్పు తీర్చు’ వంటి సామాన్య పాఠకులకు స్పష్టమైన పదబంధాలు వాడబడ్డాయి. అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావం ముఖ్యంగా ‘అప్పగించుకుంటూ ఉన్నాడు’లో ప్రతిఫలించింది.
