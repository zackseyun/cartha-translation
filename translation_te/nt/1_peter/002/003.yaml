id: 1PE.2.3
reference: 1 Peter 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εἰ ἐγεύσασθε ὅτι χρηστὸς ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/003.yaml
  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: te
  text: ప్రభువు మంచివాడని మీరు నిజంగా రుచి చూశారైతే[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు మంచివాడని మీరు రుచి చూశారు గనుక.” గ్రీకులో షరతార్థక రూపం ఉన్నప్పటికీ, ఆ షరతు నిజమేనని భావిస్తూ చెప్పి ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “మంచివాడు” అనే పదాన్ని “దయాళుడు” లేదా “కృపగలవాడు” అని కూడా అనువదించవచ్చు. ఈ మాటలు కీర్తన 34:8ను ప్రతిధ్వనిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: అయితే
  rationale: గ్రీకు షరతార్థక రూపాన్ని నిలుపుతుంది; సందర్భంలో ఆ షరతు నిజమేనని భావించే సూచనను ‘నిజంగా’ వ్యక్తం చేస్తుంది.
- source_word: ἐγεύσασθε
  choice: మీరు ... రుచి చూశారు
  rationale: పదశః రుచి చూడడం అనే చిత్రాన్ని నిలుపుతుంది; 2:2–3లోని పోషణ రూపకానికీ కీర్తన 34:8 ప్రతిధ్వనికీ ఇది సరిపోతుంది.
- source_word: ὅτι
  choice: అని
  rationale: రుచి చూసిన అనుభవంలోని విషయాన్ని పరిచయం చేసే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: χρηστὸς
  choice: దయాళుడు
  rationale: χρηστόςలోని మంచితనం, దయ, అనుగ్రహపూర్వక స్వభావాన్ని వ్యక్తిగత ప్రభువును వర్ణించే సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; విస్తృత అర్థమైన ‘మంచివాడు’ కూడా సాధ్యం.
- source_word: κύριος
  choice: ప్రభువు
  rationale: క్రీస్తుతో ఉన్న సందర్భ సంబంధాన్నీ కీర్తనలోని ప్రభువు గురించిన ప్రతిధ్వనినీ వివరణాత్మక చేర్పు లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: εἰ ఉపవాక్యపు షరతార్థక బలం
  choice: ‘మీరు నిజంగా ... చూశారైతే’ అని నిజమైన షరతును ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘మీరు ... చూశారు గనుక’
  rationale: రచయిత పాఠకుల అనుభవం నిజమని భావిస్తున్నట్టున్నా, గ్రీకు వాక్యం εἰ అనే షరతార్థక రూపాన్నే ఉపయోగిస్తుంది. ‘నిజంగా’ ఆశించిన వాస్తవత్వాన్ని సూచిస్తూ, ‘అయితే’ ఆ వాక్య నిర్మాణాన్ని కాపాడుతుంది.
- issue: ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘ప్రభువు’ అని మాత్రమే ఉంచడం
  alternative: ‘ప్రభువైన క్రీస్తు’
  rationale: సందర్భం యేసుతో సన్నిహితంగా అనుసంధానమైనప్పటికీ, మాటలు కీర్తన 34:8ను ప్రతిధ్వనిస్తాయి. కేవలం ‘ప్రభువు’ అని ఉంచడం ఈ రెండు పార్శ్వాలనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘రుచి చూశారు’ అనే స్పష్టమైన రూపకాన్ని నిలిపి, షరతార్థకతను ప్రధాన పాఠ్యంలో కాపాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
