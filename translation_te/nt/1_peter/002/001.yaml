id: 1PE.2.1
reference: 1 Peter 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: te
  text: కాబట్టి[a], సమస్త దురభిప్రాయాన్ని, సమస్త మోసాన్ని, కపట ప్రవర్తనలనూ, అసూయలనూ, ఇతరులను గురించి చెడుగా మాట్లాడే మాటలన్నిటినీ[b] విడిచిపెట్టి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాబట్టి’ అనే పదం 1:22–25లోని ముందరి విషయాల ఆధారంగా వచ్చే నిర్ధారణను సూచిస్తుంది.
    reason: discourse_connection
  - marker: b
    text: లేదా ‘అపనిందలన్నిటినీ.’ గ్రీకు పదం ఇతరుల గురించి లేదా వారికి వ్యతిరేకంగా మాట్లాడే హానికరమైన మాటలను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: విడిచిపెట్టి
  rationale: ఇది భూతకాల మధ్యమ కృదంతం; 2వ వచనంలోని ప్రధాన ఆజ్ఞకు ముందుగా చేయవలసిన సిద్ధతను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘విడిచిపెట్టి’ ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: 1:22–25లోని విషయాల ఆధారంగా వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: πᾶσαν κακίαν
  choice: సమస్త దురుద్దేశాన్ని
  rationale: ఈ దుర్గుణాల జాబితాలో κακία ఇతరుల పట్ల ఉండే చెడు ఉద్దేశం లేదా హానికరమైన వైఖరిని సూచిస్తుంది; విస్తృతమైన ‘చెడుతనం’కన్నా ‘దురుద్దేశం’ సందర్భానికి తగినది.
- source_word: πάντα δόλον
  choice: సమస్త మోసాన్ని
  rationale: δόλος మోసపూరితమైన కపట యుక్తిని సూచిస్తుంది; ‘మోసం’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన పదం.
- source_word: ὑποκρίσεις
  choice: కపటాలను
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, వివిధ కపట ప్రవర్తనలను సూచిస్తుంది.
- source_word: φθόνους
  choice: అసూయలను
  rationale: మూలంలోని బహువచన రూపాన్ని నిలుపుతూ, ఇతరుల మేలు పట్ల కలిగే అసూయను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάσας καταλαλιάς
  choice: ఇతరులను గురించి చెడుగా మాట్లాడే మాటలన్నిటినీ
  rationale: καταλαλιά ఇతరులకు వ్యతిరేకంగా, వారి కీర్తికి హాని కలిగేలా మాట్లాడడాన్ని విస్తృతంగా సూచిస్తుంది. తెలుగు ‘అపనిందలు’ కొన్నిసార్లు అసత్య ఆరోపణలకే పరిమితంగా అర్థమవవచ్చు కాబట్టి ప్రధాన పాఠంలో విస్తృత భావాన్ని ఉంచాం.
theological_decisions:
- issue: దుర్గుణాల జాబితా మరియు నైతిక పరిధి
  choice: ప్రతి దుర్గుణాన్ని సందర్భానుసారంగా స్పష్టంగా అనువదించి, సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
  alternative: κακίαను ‘సమస్త చెడుతనం’గా, καταλαλιάςను ‘అపనిందలన్నిటినీ’గా అనువదించడం.
  rationale: ఇది నైతిక ప్రబోధం. మూలంలోని నిర్దిష్టమైన నైతిక బలాన్ని నిలుపుతూ, పదాల పరిధిని అనవసరంగా కుదించకుండా లేదా సిద్ధాంతపరంగా విస్తరించకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం 2వ వచనంలోని ప్రధాన క్రియతో వ్యాకరణపరంగా కొనసాగుతున్నందున చివర కామా ఉంచబడింది; ‘విడిచిపెట్టి’ అనే అసమాపక క్రియ ఆ కొనసాగింపును నిలుపుతుంది.
