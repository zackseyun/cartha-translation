review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the core contrast: ἐλεύθεροι as ‘స్వతంత్రులు,’ freedom not used as an ἐπικάλυμμα for κακία, and θεοῦ δοῦλοι as ‘దేవుని దాసులు.’ However, both occurrences of ‘జీవించండి’ add the specific idea of ‘live,’ which is not present in this verse. The Greek uses qualifying participial phrases (‘as free people … not as those having freedom as a cover … but as God’s slaves’), whose governing imperative is supplied by the wider context.'
  naturalness: The wording is generally clear, modern, and appropriately formal. Recasting the added ‘జీవించండి’ as ‘ఉండండి’ avoids importing an unnecessary action while retaining a complete and natural Telugu sentence.
  terminology: ‘స్వతంత్రులు,’ ‘ముసుగు,’ ‘చెడు,’ and ‘దేవుని దాసులు’ are suitable. ‘దాసులు’ rightly preserves the deliberately strong free/slave contrast in δοῦλοι, while the footnote responsibly supplies ‘సేవకులు’ as a lexical alternative.
  issues:
  - severity: medium
    issue: ‘జీవించండి’ is added twice.
    rationale: The source does not say ‘live’; it characterizes the manner in which the audience is to act in relation to the preceding command. ‘ఉండండి’ is a less interpretively loaded way to produce an idiomatic standalone Telugu rendering.
  revised_text: స్వతంత్రులుగా ఉండండి; అయితే మీ స్వాతంత్ర్యాన్ని చెడుకు ముసుగుగా ఉపయోగించుకోకండి. దేవుని దాసులుగా[a] ఉండండి.
  revised_footnotes:
