    text: లేదా ‘దేవుని సేవకులుగా.’ గ్రీకు పదం సేవకులను లేదా దాసులను సూచించగలదు; ‘స్వతంత్రులు’ అనే పదంతో ఉన్న బలమైన విరోధాభాసాన్ని నిలుపడానికి ఇక్కడ ‘దాసులు’ అని అనువదించబడింది.
