- from: స్వతంత్రులుగా జీవించండి; అయితే మీ స్వాతంత్ర్యాన్ని చెడుకు ముసుగుగా ఉపయోగించుకోకండి. దేవుని దాసులుగా[a] జీవించండి.
  to: స్వతంత్రులుగా ఉండండి; అయితే మీ స్వాతంత్ర్యాన్ని చెడుకు ముసుగుగా ఉపయోగించుకోకండి. దేవుని దాసులుగా[a] ఉండండి.
  rationale: The revision removes the unwarranted lexical addition ‘జీవించండి’ while preserving the draft’s clear modern Telugu, its source-level contrast between freedom and belonging to God, and its lexical-alternative footnote.
