id: 1PE.2.16
reference: 1 Peter 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: te
  text: స్వతంత్రులుగా ఉండండి; అయితే మీ స్వాతంత్ర్యాన్ని చెడుకు ముసుగుగా ఉపయోగించుకోకండి. దేవుని దాసులుగా[a] ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని సేవకులుగా.’ గ్రీకు పదం సేవకులను లేదా దాసులను సూచించగలదు; ‘స్వతంత్రులు’ అనే పదంతో ఉన్న బలమైన విరోధాభాసాన్ని నిలుపడానికి ఇక్కడ ‘దాసులు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: స్వతంత్రులు
  rationale: సామాజికంగా లేదా వ్యక్తిగతంగా స్వేచ్ఛగలవారు అనే భావాన్ని సహజమైన, లింగ-సమగ్ర తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: ἐπικάλυμμα
  choice: ముసుగు
  rationale: తప్పును కప్పిపుచ్చడానికి ఉపయోగించే కప్పు అనే మూల రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: మీ స్వాతంత్ర్యాన్ని ... ఉపయోగించుకోకండి
  rationale: అక్షరార్థంగా ‘స్వాతంత్ర్యాన్ని ముసుగుగా కలిగి ఉండడం’ అనే గ్రీకు నిర్మాణంలోని సాధనార్థక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κακίας
  choice: చెడు
  rationale: దురుద్దేశం అనే సంకుచిత అర్థానికి పరిమితం కాకుండా, సందర్భంలోని విస్తృత నైతిక దుష్టత్వాన్ని తెలియజేస్తుంది.
- source_word: δοῦλοι
  choice: దాసులు
  rationale: దేవునికి చెందినవారై ఆయన ఆధీనంలో ఉండే బలమైన భావాన్ని తెలుగులో గౌరవప్రదంగా నిలుపుతుంది; ‘సేవకులు’ కంటే స్వతంత్రులు అనే పదంతో ఉన్న విరోధాభాసాన్ని మెరుగ్గా కాపాడుతుంది.
- source_word: θεοῦ δοῦλοι
  choice: దేవుని దాసులు
  rationale: దేవునికి చెందినవారు, ఆయన అధీనంలో ఉన్నవారు అనే స్వామ్య/సంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: క్రైస్తవ గుర్తింపుకు సంబంధించి δοῦλοι పదం అనువాదం
  choice: దేవుని దాసులు
  alternative: దేవుని సేవకులు
  rationale: ఈ వాక్యం స్వాతంత్ర్యాన్ని దేవునికి సంపూర్ణంగా చెందిన స్థితితో ఉద్దేశపూర్వకంగా జతచేస్తుంది. ‘దాసులు’ ఆ వేదాంతపరమైన ఉద్రిక్తతను మృదువుచేయకుండా నిలుపుతుంది; అయితే తెలుగు వాడుకలో సాధ్యమైన ‘సేవకులు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకులోని సంక్షిప్త భాగవాక్యాలను తెలుగు ఆజ్ఞార్థక సందర్భానికి అనుగుణంగా ‘జీవించండి’తో స్పష్టం చేశాం; స్వాతంత్ర్యం–దాసత్వం మధ్య ఉద్దేశపూర్వక ఉద్రిక్తతను నిలిపాం.
