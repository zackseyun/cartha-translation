source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: te
  text: మీరు ఆయన దగ్గరికి వస్తుండగా[a]—ఆయన మనుషులచేత తిరస్కరించబడినా, దేవుని దృష్టిలో ఎన్నుకోబడిన, అమూల్యమైన[b] సజీవ రాయి—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘ఎవరి దగ్గరికి మీరు వస్తున్నారో’; లేదా, ‘మీరు ఆయన దగ్గరికి వస్తూ.’
    reason: కృదంత నిర్మాణంలోని కొనసాగుతున్న చర్యను, సంబంధసర్వనామ రూపాన్ని చూపించడానికి.
  - marker: b
    text: లేదా, ‘ఘనమైన’; ‘ఎంతో విలువైన’ అని కూడా అర్థం కావచ్చు.
    reason: ἔντιμον అనే పదంలో విలువ మరియు గౌరవం రెండింటికి సంబంధించిన అర్థవిస్తృతి ఉంది.
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: ఆయన దగ్గరికి
  rationale: ప్రసέρχομαι అనే గమనాన్ని సూచించే క్రియతో పాటు వచ్చిన ఈ పదబంధం దిశను సూచిస్తుంది. తెలుగులో ‘ఆయన దగ్గరికి’ సహజంగా ఉండి, మూలంలోని సర్వనామాన్ని అలాగే ఉంచుతుంది.
- source_word: προσερχόμενοι
  choice: మీరు ... వస్తుండగా
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను, పాఠకులతో దాని సంబంధాన్ని తెలుగులో సహజమైన కాలార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: λίθον ζῶντα
  choice: సజీవ రాయి
  rationale: λίθος కు ‘రాయి’ సాధారణ సమానార్థకం; ζῶντα తో ఏర్పడిన ఉద్దేశపూర్వకమైన విరుద్ధరూపకాన్ని ‘సజీవ’ నిలుపుతుంది. తరువాతి వచనాల్లోని నిర్మాణ రూపకాన్నీ ఇది కాపాడుతుంది.
- source_word: ὑπὸ ἀνθρώπων
  choice: మనుషులచేత
  rationale: ἄνθρωποι ఇక్కడ దేవుని అంచనాకు విరుద్ధంగా మానవుల అంచనాను సూచిస్తుంది. ‘మనుషులు’ ఆధునిక తెలుగులో స్త్రీపురుషులందరినీ సహజంగా సూచిస్తుంది.
- source_word: ἀποδεδοκιμασμένον
  choice: తిరస్కరించబడినా
  rationale: పరిశీలించి అంగీకరించకపోవడం అనే భావాన్ని ‘తిరస్కరించబడిన’ స్పష్టంగా అందిస్తుంది; μὲν ... δὲ వ్యత్యాసాన్ని ‘అయినా’ తెలియజేస్తుంది.
- source_word: παρὰ δὲ θεῷ
  choice: దేవుని దృష్టిలో
  rationale: παρά + దత్తివిభక్తి ఇక్కడ దేవుని సమక్షంలో ఉన్న స్థితి లేదా ఆయన అంచనాను సూచిస్తుంది. ‘దేవుని దృష్టిలో’ ఆ మూల్యాంకన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκλεκτὸν
  choice: ఎన్నుకోబడిన
  rationale: దేవుడు ఎంపిక చేసిన భావాన్ని పారిభాషిక భారంలేకుండా సూటిగా అందిస్తుంది.
- source_word: ἔντιμον
  choice: అమూల్యమైన
  rationale: అత్యంత విలువైనదీ గౌరవనీయమైనదీ అనే అర్థపరిధిలో, రాయి రూపకానికి ‘అమూల్యమైన’ సహజంగా సరిపోతుంది; గౌరవార్థక ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: ‘ఆయన’ అనే సర్వనామపు నిర్దేశ్యం మరియు సజీవ రాయి రూపకం
  choice: మూలంలో ఉన్నట్లే ‘ఆయన’ అనే సర్వనామాన్ని ఉంచి, ఆయనను ‘సజీవ రాయి’గా వర్ణించడం
  alternative: ‘యేసు ప్రభువు దగ్గరికి’ అని పేరును స్పష్టంగా చేర్చడం
  rationale: 2:3–4 తక్షణ సందర్భం, 2:6–8లోని రాయి వచనాలు నిర్దేశ్యం క్రీస్తేనని చూపుతాయి. అయితే ఈ వచనంలో గ్రీకు పాఠం పేరును చేర్చకుండా సర్వనామాన్నే వాడుతుంది; అనువాదం దానిని గౌరవిస్తుంది.
- issue: παρὰ θεῷ లోని దేవుని మూల్యాంకనం
  choice: ‘దేవుని దృష్టిలో’
  alternative: ‘దేవుని వద్ద’ లేదా ‘దేవుని సమక్షంలో’
  rationale: ఈ సందర్భంలో మానవుల తిరస్కారానికి దేవుని ఎంపిక, విలువ నిర్ణయం వ్యతిరేకంగా నిలుస్తాయి. ‘దేవుని దృష్టిలో’ ఆ వ్యత్యాసాన్ని స్పష్టం చేస్తుంది; అయితే దేవుని ఎంపిక స్వరూపంపై అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: ἔντιμον లో విలువ మరియు గౌరవం మధ్య అర్థవిస్తృతి
  choice: ‘అమూల్యమైన’ ప్రధాన పాఠంలో; ‘ఘనమైన/ఎంతో విలువైన’ పాదసూచికలో
  alternative: ‘ఘనమైన’ మాత్రమే
  rationale: పదం విలువైనదనే భావాన్నీ గౌరవనీయ స్థితినీ మోయగలదు. ప్రధాన పాఠం రాయి రూపకానికి సరిపోయే విలువ భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది. ‘సజీవ రాయి’ అనే ఉద్దేశపూర్వక రూపకాన్ని వివరణగా మార్చకుండా నిలుపుకున్నాం.
