id: 1PE.2.2
reference: 1 Peter 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: te
  text: కొత్తగా పుట్టిన పసిబిడ్డల్లా, దాని ద్వారా మీరు రక్షణలోకి ఎదగడానికి కల్తీలేని ఆత్మీయ పాలను ఎంతో ఆశతో కోరుకోండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἀρτιγέννητα βρέφη
  choice: కొత్తగా పుట్టిన పసిబిడ్డల్లా
  rationale: ὡς పోలికను సూచిస్తుంది; ἀρτιγέννητα ఇటీవలి జననాన్ని బలంగా తెలియజేస్తుంది. ఈ తెలుగు రూపం సహజంగా ఉండి పసిబిడ్డల చిత్రాన్ని నిలుపుతుంది.
- source_word: τὸ λογικὸν
  choice: ఆత్మీయమైన
  rationale: λογικός అనే పదానికి వివేకం లేదా అంతరంగ జీవితం సంబంధమైనది అనే భావాలు ఉండవచ్చు. ఇక్కడ పాలు రూపకాలంకారంగా ఉన్నందున ‘ఆత్మీయమైన’ అనేది అక్షరార్థ పాలు కాదని సహజంగా తెలియజేస్తుంది; ‘వివేకసంబంధమైన/హేతుబద్ధమైన’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἄδολον
  choice: కల్తీలేని
  rationale: పాలలో ఏదీ కలపబడని, మోసపూరిత మిశ్రమం లేని స్వచ్ఛతను ‘కల్తీలేని’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γάλα
  choice: పాలు
  rationale: ఆహారం మరియు ఎదుగుదల అనే మూల రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἐπιποθήσατε
  choice: ఎంతో ఆశతో కోరుకోండి
  rationale: తీవ్రమైన కోరికను తెలిపే ఆజ్ఞార్థక క్రియ యొక్క బలాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα ἐν αὐτῷ αὐξηθῆτε
  choice: దాని ద్వారా మీరు … ఎదిగేలా
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది; ἐν αὐτῷ ముందున్న పాలనే ఎదుగుదలకు సాధనంగా చూపుతుంది. గ్రీకు కర్మణి రూపం తెలుగులో సహజమైన అకర్మక ‘ఎదగడం’తో వ్యక్తమవుతుంది.
- source_word: εἰς σωτηρίαν
  choice: రక్షణలోకి
  rationale: εἰς లోని లక్ష్యం వైపు కదలికను నిలుపుతుంది; రక్షణను పూర్తిగా వర్తమానమో పూర్తిగా భవిష్యత్తోగా నిర్ణయించకుండా మూలంలోని ఉద్రిక్తతను కాపాడుతుంది.
theological_decisions:
- issue: λογικός అనే పదానికి రూపకంలోని అర్థం
  choice: ప్రధాన పాఠంలో ‘ఆత్మీయమైన’
  alternative: ‘వివేకసంబంధమైన’ లేదా ‘హేతుబద్ధమైన’
  rationale: ఈ సందర్భంలో పాలు క్రైస్తవుని అంతరంగ పోషణకు రూపకం. సాధారణ పాఠకునికి ‘ఆత్మీయమైన’ సహజంగా అర్థమవుతుంది; అయితే గ్రీకు పదంలోని reason/rational భావాన్ని పాదసూచికలో నిలిపి, ఒకే వ్యాఖ్యానాన్ని బలవంతంగా విధించలేదు.
- issue: εἰς σωτηρίαν యొక్క దిశాత్మక భావం
  choice: ‘రక్షణలోకి ఎదిగేలా’ అని నిలుపడం
  alternative: ‘రక్షణలో ఎదిగేలా’ లేదా ‘రక్షణ పొందేలా’
  rationale: మూలపాఠం రక్షణ అనే లక్ష్యం వైపు ఎదుగుదలను సూచిస్తుంది. ‘రక్షణ పొందేలా’ అని అనడం సంపాదన భావాన్ని కలిగించవచ్చు; ‘రక్షణలో’ అని మాత్రమే అనడం εἰς యొక్క దిశాత్మక బలాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘ఎంతో ఆశతో కోరుకోండి’ తీవ్ర కోరికను తెలియజేస్తుంది. చివరి ఉద్దేశ వాక్యంలో ‘అలా కోరుకోండి’ని పునరుక్తి చేయడం ద్వారా తెలుగు వాక్య నిర్మాణం స్పష్టంగా ఉంచబడింది.
