  terminology: ‘గౌరవించండి’ consistently preserves the τιμάω repetition. ‘భయపడండి’ retains the stronger wording for God rather than weakening it to mere reverence. The revised expression for ἀδελφότης avoids an overly abstract ‘సోదరత్వం’ while clearly identifying the community as fellow believers.
