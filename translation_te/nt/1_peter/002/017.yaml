id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: te
  text: అందరినీ గౌరవించండి; సహోదర విశ్వాసుల సమాజాన్ని ప్రేమించండి; దేవునికి భయపడండి; రాజును[a] గౌరవించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చక్రవర్తిని’; గ్రీకు పదానికి నేరమైన అర్థం ‘రాజు.’ అయితే పేతురు కాలపు రోమా సందర్భంలో అది చక్రవర్తిని సూచించి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: అందరినీ
  rationale: నామవాచకంగా వాడిన πᾶς యొక్క బహువచన కర్మరూపం; మినహాయింపు లేకుండా ప్రజలందరినీ సూచించే సహజమైన తెలుగు రూపం.
- source_word: τιμήσατε / τιμᾶτε
  choice: గౌరవించండి
  rationale: రెండు చోట్ల ఉన్న τιμάω పదాన్ని ఒకే విధంగా అనువదించి మూలంలోని పునరుక్తిని నిలిపాం. మొదటిది aorist imperative, చివరిది present imperative అయినా, ఈ సంక్షిప్త ఆజ్ఞల వరుసలో తెలుగులో ఆ aspect భేదాన్ని బలవంతంగా చూపడం సహజం కాదు.
- source_word: τὴν ἀδελφότητα
  choice: విశ్వాసుల సహోదర సమాజాన్ని
  rationale: ἀδελφότης ఇక్కడ తోటి విశ్వాసుల కుటుంబసదృశ సమాజాన్ని సూచిస్తుంది. కేవలం ‘సోదరత్వం’ కంటే ఈ రూపం ఆధునిక పాఠకుడికి ఉద్దేశించిన సమూహాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀγαπᾶτε
  choice: ప్రేమించండి
  rationale: ἀγαπάω యొక్క present imperativeకు నేరమైన, ప్రామాణిక సమానం; కొనసాగుతున్న ఆచరణ భావాన్ని తెలుగు ఆజ్ఞారూపం సందర్భానుసారంగా మోయగలదు.
- source_word: τὸν θεὸν
  choice: దేవునికి
  rationale: φοβέομαιతో తెలుగు సహజ ప్రయోగం ‘దేవునికి భయపడండి’; గ్రీకులో కర్మవిభక్తి ఉన్నా లక్ష్యభాష వ్యాకరణం ప్రకారం చతుర్థీ రూపం అవసరం.
- source_word: φοβεῖσθε
  choice: భయపడండి
  rationale: ‘భక్తితో గౌరవించండి’ వంటి మృదువైన వివరణకు బదులు φοβέομαι యొక్క బలమైన అర్థాన్ని నిలుపుతుంది; రాజుకు ఇవ్వవలసిన ‘గౌరవం’తో ఉన్న ఉద్దేశపూర్వక భేదాన్ని కూడా కాపాడుతుంది.
- source_word: τὸν βασιλέα
  choice: రాజును
  rationale: βασιλεύςకు నేరమైన సమానం ‘రాజు’. పేతురు కాలపు రోమా సందర్భంలో చక్రవర్తిని సూచించే అవకాశాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: దేవునిపట్ల స్పందనకూ పౌర పాలకునిపట్ల స్పందనకూ ఉన్న భేదం
  choice: దేవునికి ‘భయపడండి’, రాజును ‘గౌరవించండి’
  alternative: దేవుణ్ణి ‘భక్తితో గౌరవించండి’, రాజును ‘ఆదరించండి’
  rationale: మూలవాక్యం దేవునికి మాత్రమే φοβεῖσθεను, అందరికీ మరియు రాజుకు τιμάωను వాడుతుంది. వేర్వేరు తెలుగు క్రియలు ఈ ధార్మిక శ్రేణిని రాజకీయ సిద్ధాంతంగా విస్తరించకుండా యథాతథంగా నిలుపుతాయి.
- issue: ἀδελφότης సూచించే సమూహం
  choice: విశ్వాసుల సహోదర సమాజం
  alternative: సోదరత్వం
  rationale: ఇది సాధారణ మానవ సోదరభావం కాక, తోటి విశ్వాసుల సమూహాన్ని సూచిస్తుంది. ‘సహోదర సమాజం’ కుటుంబసదృశ ఐక్యతను నిలుపగా, ‘విశ్వాసుల’ అనే వివరణ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక బహువచన ఆజ్ఞారూపాలను వాడాం. నాలుగు సమాంతర ఆజ్ఞల లయను అర్థవిరామ చిహ్నాలతో నిలిపాం. ‘దేవునికి భయపడండి’ అనే సహజ తెలుగు నిర్మాణం మూలంలోని బలమైన భావాన్ని తగ్గించదు.
