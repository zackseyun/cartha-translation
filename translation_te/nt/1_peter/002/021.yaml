id: 1PE.2.21
reference: 1 Peter 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: te
  text: ఈ కోసమే మీరు పిలువబడ్డారు. ఎందుకంటే మెస్సీయ కూడా మీ కోసం బాధపడి, మీరు తన అడుగుజాడల్లో నడిచేలా మీకు ఒక నమూనాను[a] ఉంచి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాదిరి’. ఇక్కడి గ్రీకు పదం, విద్యార్థులు అనుకరించి వ్రాయడానికి వారి ముందు ఉంచే వ్రాత నమూనాను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ఇందుకే
  rationale: ముందటి సందర్భంలో చెప్పిన అన్యాయమైన బాధను సహనంతో భరించడాన్ని వెనక్కి సూచిస్తుంది; గమ్యం లేదా ఉద్దేశ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐκλήθητε
  choice: మీరు పిలువబడ్డారు
  rationale: దైవిక పిలుపు అనే భావాన్ని నిలుపుతూ, దాని సిద్ధాంతపరమైన స్వరూపాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మెస్సీయ బాధపడటాన్ని ఆ పిలుపుకు కారణంగా లేదా వివరణగా పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘అభిషిక్తుడు’ అనే భావాన్ని మోసే, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో అర్థమయ్యే రూపాన్ని ఎంచుకున్నాం.
- source_word: ἔπαθεν
  choice: బాధపడి
  rationale: మూలంలో బాధ యొక్క విధానం లేదా మరణం ప్రత్యేకంగా చెప్పబడలేదు; అందువల్ల అదనపు వివరాన్ని చేర్చకుండా సాధారణ అర్థాన్ని నిలిపాం.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ కోసం
  rationale: పాఠకుల మేలు కోసం, వారి పక్షంగా అనే విస్తృత భావాన్ని నిలుపుతుంది; ఈ వాక్యం మాత్రమే చెప్పనంత నిర్దిష్టమైన ప్రాయశ్చిత్త సిద్ధాంతాన్ని రుద్దదు.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: మీకు … ఉంచి వెళ్లాడు
  rationale: మెస్సీయ తనవారికి అనుసరించదగినదాన్ని వెనుక ఉంచాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑπογραμμὸν
  choice: ఒక నమూనాను
  rationale: అనుసరించడానికి ఉంచిన ఆదర్శాన్ని స్పష్టంగా తెలియజేస్తుంది; విద్యార్థులు చూసి దిద్దే వ్రాత నమూనా అనే మూలపదంలోని సజీవమైన ఉపమానాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἵνα
  choice: …లా
  rationale: తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండే విధంగా ఉద్దేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπακολουθήσητε
  choice: నడిచేలా
  rationale: తర్వాత వచ్చే అడుగుజాడల రూపకంతో కలిసి, అతని మార్గాన్ని అనుసరించాలనే ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: తన అడుగుజాడల్లో
  rationale: మూలంలోని అడుగుల జాడల రూపకాన్ని నిలుపుతూ, అతని ప్రవర్తనా మార్గాన్ని అనుసరించడాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: మెస్సీయ బాధకు సంబంధించి ὑπὲρ ὑμῶν యొక్క భావపరిధి
  choice: ‘మీ కోసం’ అని అనువదించి, మేలు కోసం/పక్షంగా అనే విస్తృతిని నిలిపాం
  alternative: ‘మీ పక్షంగా’; ‘మీ నిమిత్తం’; ‘మీ స్థానంలో’
  rationale: ఈ సందర్భం మెస్సీయ బాధను విశ్వాసులు అనుసరించవలసిన నమూనాగా ప్రధానంగా చూపుతుంది. ‘మీ కోసం’ అనేది ప్రతినిధిత్వం లేదా ప్రత్యామ్నాయ బాధకు ఉండగల ప్రతిధ్వనిని తొలగించదు; అదే సమయంలో ‘మీ స్థానంలో’ అని చెప్పి ఈ వాక్యం స్పష్టంగా నిర్దేశించని అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘అడుగుజాడల్లో నడవడం’ అనే సజీవ రూపకాన్ని నిలిపాం; వాక్యాన్ని తెలుగు ప్రవాహానికి అనుగుణంగా రెండు వాక్యాలుగా ఇచ్చాం.
