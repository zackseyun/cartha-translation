  to: ఈ కోసమే మీరు పిలువబడ్డారు. ఎందుకంటే మెస్సీయ కూడా మీ కోసం బాధపడి, మీరు తన అడుగుజాడల్లో నడిచేలా మీకు ఒక నమూనాను[a] ఉంచి వెళ్లాడు.
