review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the explanatory force of διότι, the scriptural-citation idiom, Zion, the cornerstone image, and the emphatic negation οὐ μὴ. The personal rendering of αὐτῷ is contextually defensible in Peter, and its stone-metaphor alternative is appropriately noted. However, ఘనమైన primarily suggests “grand/imposing” in modern Telugu and does not reliably convey ἔντιμον (“honored; held in honor,” with a value nuance).
  naturalness: The Telugu is fluent, modern, and suitably elevated for a prophetic citation. ‘లేఖనంలో ఇలా ఉంది,’ ‘మూలరాయి,’ and ‘ఎంతమాత్రమూ సిగ్గుపాలు కాడు’ are natural. Replacing ఘనమైన with గౌరవనీయమైన makes the intended honor sense clearer without making the construction unnatural.
  terminology: ‘మూలరాయి’ is a clear standard rendering of λίθον ἀκρογωνιαῖον. ‘ఎన్నుకోబడిన’ appropriately renders ἐκλεκτός. ‘గౌరవనీయమైన’ more precisely represents ἔντιμος than ‘ఘనమైన.’ The footnote retains the legitimate referential ambiguity of αὐτῷ and explains the emphatic negative.
  issues:
  - severity: medium
    issue: ‘ఘనమైన’ for ἔντιμον
    rationale: In current standard Telugu, ఘనమైన most readily means grand, splendid, or imposing. Although it can carry a dignity nuance, it does not clearly communicate that the cornerstone is honored/held in honor (and valuable), which is the central sense of ἔντιμον in this context. ‘గౌరవనీయమైన’ is more source-specific.
  revised_text: 'ఎందుకంటే లేఖనంలో ఇలా ఉంది: “ఇదిగో, నేను సీయోనులో ఎన్నుకోబడిన, గౌరవనీయమైన మూలరాయిని ఉంచుతున్నాను; ఆయనను నమ్మేవాడు ఎంతమాత్రమూ సిగ్గుపాలు కాడు.”[a]'
