- from: 'ఎందుకంటే లేఖనంలో ఇలా ఉంది: “ఇదిగో, నేను సీయోనులో ఎన్నుకోబడిన, ఘనమైన మూలరాయిని ఉంచుతున్నాను; ఆయనను నమ్మేవాడు ఎంతమాత్రమూ సిగ్గుపాలు కాడు.”[a]'
  to: 'ఎందుకంటే లేఖనంలో ఇలా ఉంది: “ఇదిగో, నేను సీయోనులో ఎన్నుకోబడిన, గౌరవనీయమైన మూలరాయిని ఉంచుతున్నాను; ఆయనను నమ్మేవాడు ఎంతమాత్రమూ సిగ్గుపాలు కాడు.”[a]'
