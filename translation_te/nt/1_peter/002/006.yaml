id: 1PE.2.6
reference: 1 Peter 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: te
  text: 'ఎందుకంటే లేఖనంలో ఇలా ఉంది: “ఇదిగో, నేను సీయోనులో ఎన్నుకోబడిన, గౌరవనీయమైన మూలరాయిని ఉంచుతున్నాను; ఆయనను నమ్మేవాడు ఎంతమాత్రమూ సిగ్గుపాలు కాడు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆయనను” అని అనువదించిన చోట “దానిని” అని కూడా అనువదించవచ్చు; ఉల్లేఖనం రాయి గురించి మాట్లాడుతున్నా, పరిసర సందర్భంలో పేతురు ఆ రాయిని క్రీస్తుకు అన్వయిస్తున్నాడు. “ఎంతమాత్రమూ సిగ్గుపాలు కాడు” అనే గ్రీకు నిర్మాణం బలమైన నిరాకరణను వ్యక్తం చేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి లేఖనాధారాన్ని పరిచయం చేసే వివరణాత్మక కారణార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: περιέχει ἐν γραφῇ
  choice: లేఖనంలో ఇలా ఉంది
  rationale: గ్రీకు నుడికారపు భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; అసహజమైన అక్షరానువాదాన్ని నివారిస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రవచన ఉల్లేఖనంలోని శ్రద్ధాకర్షకమైన, గంభీరమైన పిలుపును నిలుపుతుంది.
- source_word: τίθημι
  choice: ఉంచుతున్నాను
  rationale: రాయిని నిర్మాణంలో నిర్దిష్ట స్థానంలో పెట్టే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν Σιὼν
  choice: సీయోనులో
  rationale: ἐν యొక్క స్థానార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: λίθον ἀκρογωνιαῖον
  choice: మూలరాయి
  rationale: నిర్మాణ రూపకంలో ప్రధానమైన మూల రాయిని సూచించే స్పష్టమైన, ప్రాచుర్యంలో ఉన్న తెలుగు పదం.
- source_word: ἐκλεκτὸν
  choice: ఎన్నుకోబడిన
  rationale: దైవిక ఎంపిక భావాన్ని theological shorthand లేకుండా సహజంగా నిలుపుతుంది.
- source_word: ἔντιμον
  choice: ఘనమైన
  rationale: గౌరవం మరియు విలువ అనే రెండు భావ ఛాయలకు వీలిచ్చే సంక్షిప్త తెలుగు పదం; కేవలం భావోద్వేగపూరితమైన ‘ప్రియమైన’ అనే అర్థాన్ని రుద్దదు.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: ఆయనను నమ్మేవాడు
  rationale: పేతురు పరిసర సందర్భంలో రాయి రూపకాన్ని క్రీస్తుకు వ్యక్తిగతంగా అన్వయిస్తున్నందున వ్యక్తివాచక రూపాన్ని వాడుతుంది; πιστεύω యొక్క విశ్వాసార్థాన్ని ‘నమ్ము’ సహజంగా అందిస్తుంది.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: ఎంతమాత్రమూ సిగ్గుపాలు కాడు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను ‘ఎంతమాత్రమూ’ తెలియజేస్తుంది; καταισχύνω యొక్క అవమానం/సిగ్గు భావాన్ని సహజమైన తెలుగు నుడికారంతో అందిస్తుంది.
theological_decisions:
- issue: Isaiah citationలోని αὐτῷ పదానికి పేతురు వాడుకలో సూచితుడు
  choice: వ్యక్తివాచకంగా ‘ఆయనను’
  alternative: రాయి రూపకాన్ని వ్యాకరణపరంగా ముందుకు తెచ్చి ‘దానిని’
  rationale: తక్షణ రూపకం రాయిని గురించినదైనా, 1 పేతురు 2:4–8లో పేతురు దానిని యేసుక్రీస్తుకు అన్వయిస్తున్నాడు. ‘ఆయనను’ ఆ క్రీస్తుకేంద్ర అన్వయాన్ని చూపుతుంది; మూలంలోని రూపకసంబంధ ప్రత్యామ్నాయాన్ని పాదటిప్పణి నమోదు చేస్తుంది.
- issue: ἔντιμον యొక్క గౌరవం–విలువ భావ పరిధి
  choice: ఘనమైన
  alternative: విలువైన / అమూల్యమైన
  rationale: సమీప సందర్భంలోని గౌరవ భావాన్ని నిలుపుతూ, పదానికి ఉన్న అధిక విలువ భావాన్ని పూర్తిగా మూసివేయని పదాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రవచన ఉల్లేఖనానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకునికి సహజంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘మూలరాయి’, ‘సిగ్గుపాలు కాడు’ వంటి విస్తృతంగా గ్రహించగల నుడికారాలను వాడింది.
