id: 1PE.2.14
reference: 1 Peter 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: te
  text: లేదా దుష్కార్యాలు చేసేవారిని శిక్షించడానికి, మంచి చేసేవారిని ప్రశంసించడానికి అతని ద్వారా పంపబడినవారైన పాలనాధికారులకైనా లోబడండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε
  choice: లేదా
  rationale: మునుపటి వచనంలో మొదలైన ‘రాజుకైనా... లేదా పాలనాధికారులకైనా’ అనే ప్రత్యామ్నాయ నిర్మాణాన్ని కొనసాగిస్తుంది.
- source_word: ἡγεμόσιν
  choice: పాలనాధికారులకు
  rationale: పౌర పరిపాలనలో అధికారాన్ని నిర్వహించే అధికారులను సూచిస్తుంది; నిర్దిష్ట రోమా పరిపాలనా హోదాను అనవసరంగా ఆపాదించదు.
- source_word: ὡς δι’ αὐτοῦ πεμπομένοις
  choice: అతని చేత పంపబడిన
  rationale: διά + షష్ఠీ విభక్తి తెలిపే ప్రతినిధిత్వం/కర్తృత్వ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ὡς తెలిపే వారి హోదా లేదా స్వభావం ఈ విశేషణ నిర్మాణంలో సహజంగా అంతర్లీనమవుతుంది.
- source_word: εἰς ἐκδίκησιν
  choice: శిక్షించడానికి
  rationale: ప్రభుత్వ న్యాయపరమైన సందర్భంలో ἐκδίκησις యొక్క శిక్ష విధించడం లేదా న్యాయం అమలు చేయడం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: κακοποιῶν
  choice: దుష్కార్యాలు చేసేవారిని
  rationale: చెడుచేయడం ద్వారా గుర్తింపబడే వ్యక్తులను సూచించే క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ἔπαινον
  choice: ప్రశంసించడానికి
  rationale: మంచి చేసేవారికి అధికారికంగా మెప్పు లేదా ప్రశంస లభించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀγαθοποιῶν
  choice: మంచి చేసేవారిని
  rationale: మంచి ప్రవర్తనను ఆచరించే వారనే క్రియాత్మక భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: δι’ αὐτοῦ లోని αὐτοῦ ఎవరిని సూచిస్తుంది?
  choice: మునుపటి వచనంలో ప్రస్తావించిన రాజు/చక్రవర్తి ద్వారా పాలనాధికారులు పంపబడతారు
  alternative: దేవుని ద్వారా లేదా దేవుడు ఏర్పాటు చేసిన అధికార క్రమం ద్వారా పంపబడతారు
  rationale: సమీప పూర్వపదం మునుపటి వచనంలోని రాజు కావడం వల్ల ఇదే సహజమైన సందర్భార్థం. అయితే గ్రీకు సర్వనామం స్వయంగా సూచ్యాన్ని పేరుపెట్టి చెప్పనందున ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ఈ వచనం మునుపటి వచనంలోని ఆజ్ఞను కొనసాగిస్తున్నందున, తెలుగులో భావపూర్ణత కోసం ‘లోబడండి’ అనే క్రియను పునరుక్తం చేశాం.
