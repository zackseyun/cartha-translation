revisions:
- from: లేదా దుష్కార్యాలు చేసేవారిని శిక్షించడానికి, మంచి చేసేవారిని ప్రశంసించడానికి అతని చేత[a] పంపబడిన పాలనాధికారులకు లోబడండి.
