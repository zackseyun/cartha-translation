revisions:
- from: అన్యజనుల మధ్య మీ ప్రవర్తన గౌరవప్రదంగా ఉండేలా చూసుకోండి. అప్పుడు వారు మిమ్మల్ని దుష్కార్యాలు చేసేవారిగా ఏ విషయంలో నిందించినా, మీ మంచి క్రియలను కళ్లారా చూసి, దర్శన దినాన దేవుణ్ణి మహిమపరుస్తారు.[a]
  to: అన్యజనుల మధ్య మీ ప్రవర్తన గౌరవప్రదంగా ఉండేలా చూసుకోండి; అప్పుడు, వారు మిమ్మల్ని దుష్కార్యాలు చేసేవారిగా నిందించే విషయంలో, మీ మంచి క్రియలను కళ్లారా చూసి, సందర్శన దినాన దేవుణ్ణి మహిమపరుస్తారు.[a]
  rationale: The revision replaces a misleadingly narrow Telugu expression for ἐπισκοπή with “సందర్శన,” preserving the source’s visitation/oversight sense and its ambiguity. It also makes the relational ἐν ᾧ clause more idiomatic without converting it into a merely concessive statement. No doctrinal conclusion is added.
