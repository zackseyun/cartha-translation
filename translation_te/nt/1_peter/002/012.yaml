id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: te
  text: అన్యజనుల మధ్య మీ ప్రవర్తన గౌరవప్రదంగా ఉండేలా చూసుకోండి; అప్పుడు, వారు మిమ్మల్ని దుష్కార్యాలు చేసేవారిగా నిందించే విషయంలో, మీ మంచి క్రియలను కళ్లారా చూసి, సందర్శన దినాన దేవుణ్ణి మహిమపరుస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సందర్శన దినం” అంటే దేవుడు సందర్శించే, పర్యవేక్షించే, లేదా నిర్ణాయకంగా జోక్యం చేసుకునే దినం. ఇక్కడ అది రక్షణకరమైన సందర్శనను సూచిస్తుందా, తీర్పును సూచిస్తుందా అన్నది స్పష్టంగా చెప్పబడలేదు.
    reason: ἡμέρᾳ ἐπισκοπῆς అనే పదబంధం యొక్క విస్తృతమైన, సందర్భానుసారంగా వివాదాస్పదమైన భావాన్ని వివరణాత్మకంగా నిర్ణయించకుండా తెలియజేయడానికి.
lexical_decisions:
- source_word: ἀναστροφή
  choice: ప్రవర్తన
  rationale: జీవన విధానం, నడవడి అనే విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔθνη
  choice: అన్యజనులు
  rationale: ఇక్కడ యూదేతర ప్రజలను సూచించే పేతురు వాడుకను నిలుపుతుంది; కేవలం రాజకీయ ‘దేశాలు’ అనే భావం రాకుండా చేస్తుంది.
- source_word: καλήν / καλῶν
  choice: గౌరవప్రదంగా / మంచి
  rationale: మొదటిది ప్రజల మధ్య మెచ్చదగిన నడవడిని, రెండవది మంచి క్రియలను సందర్భానుసారంగా సహజంగా వ్యక్తపరుస్తాయి.
- source_word: καταλαλοῦσιν
  choice: నిందించినా
  rationale: వ్యతిరేకంగా చెడుగా మాట్లాడటం లేదా అపవాదు వేయటం అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἐποπτεύοντες
  choice: కళ్లారా చూసి
  rationale: నిశితంగా ప్రత్యక్షంగా గమనించడం అనే బలమైన భావాన్ని సాధారణ పాఠకుడికి సహజంగా తెలియజేస్తుంది.
- source_word: ἡμέρᾳ ἐπισκοπῆς
  choice: దర్శన దినాన
  rationale: దేవుని సందర్శన, పర్యవేక్షణ లేదా జోక్యం అనే ఉద్దేశపూర్వకంగా విస్తృతమైన బైబిలు భావాన్ని ఒక స్థిరమైన పదబంధంగా నిలుపుతుంది.
theological_decisions:
- issue: ἐν ᾧ యొక్క సంబంధార్థం
  choice: ఏ విషయంలో నిందించినా
  alternative: వారు మిమ్మల్ని దుష్కార్యాలు చేసేవారని నిందించినప్పటికీ
  rationale: మూలంలోని ‘ἐν ᾧ’ను ప్రతికూల concessive భావంగా మాత్రమే మార్చకుండా, ‘ఏ విషయంలో/దేనిలో’ అనే అస్పష్ట సంబంధాన్ని నిలుపుతుంది.
- issue: ἐν ἡμέρᾳ ἐπισκοπῆς అర్థం
  choice: దర్శన దినాన
  alternative: దేవుడు విచారణకు వచ్చే రోజున / సందర్శించే రోజున
  rationale: ఇది కృపాపూర్వక సందర్శనా, తీర్పు సందర్భమా, లేక దేవుని నిర్ణాయక జోక్యమా అన్నదాన్ని వచనం స్పష్టంగా తేల్చదు; అందువల్ల వ్యాఖ్యానాత్మకంగా నిర్ధారించలేదు.
- issue: δοξάσωσι యొక్క భవిష్య ఫలితం
  choice: దేవుణ్ణి మహిమపరుస్తారు
  alternative: దేవుణ్ణి మహిమపరచవచ్చు
  rationale: ἵνα తో వచ్చిన aorist subjunctive ఉద్దేశం/ఫలితాన్ని సూచిస్తుంది; తెలుగులో సహజమైన ఫలిత వాక్యంగా ఇచ్చినా, అది ప్రతి వ్యక్తి తప్పక మారుమనస్సు పొందుతాడనే సిద్ధాంత ప్రకటనగా ఉద్దేశించబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని దీర్ఘ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. ‘ఏ విషయంలో నిందించినా’ ద్వారా మూలంలోని అసాధారణ సంబంధ నిర్మాణాన్ని పూర్తిగా సవరించకుండా నిలిపాం.
