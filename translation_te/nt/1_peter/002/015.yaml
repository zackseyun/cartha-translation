revisions:
- from: ఎందుకంటే, మీరు మంచి చేస్తూ బుద్ధిహీనులైన ప్రజల అజ్ఞానపు మాటలను మూయించాలన్నదే దేవుని చిత్తం.[a]
  to: ఎందుకంటే, మంచి చేయడం ద్వారా బుద్ధిహీనులైన ప్రజల అజ్ఞానాన్ని మౌనపరచడమే దేవుని చిత్తం.[a]
  rationale: The revision restores “అజ్ఞానం” as the direct object, as in the Greek, while using “మౌనపరచడం” to convey φιμοῦν naturally. The footnote retains the literal muzzle image as a lexical note and explains its metaphorical reference without placing extra words in the main text.
  reviewer_model: gpt-5.6-terra
