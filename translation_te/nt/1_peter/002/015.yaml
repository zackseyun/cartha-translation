id: 1PE.2.15
reference: 1 Peter 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: te
  text: ఎందుకంటే, మంచి చేయడం ద్వారా బుద్ధిహీనులైన ప్రజల అజ్ఞానాన్ని మౌనపరచడమే దేవుని చిత్తం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బుద్ధిహీనులైన ప్రజల అజ్ఞానానికి మూతి కట్టడం.” ఇక్కడి గ్రీకు క్రియకు అక్షరార్థంగా “మూతి కట్టడం” అని అర్థం; ఇక్కడ అది విరోధపూరితమైన మాటలను ఆపడాన్ని సూచించే రూపకంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఎందుకంటే’ సహజమైన కారణార్థక అనుసంధానం.
- source_word: οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ
  choice: ఇదే దేవుని చిత్తం
  rationale: οὕτως సూచించే విధానాన్ని తరువాతి క్రియ వివరిస్తుంది; ఈ నిర్మాణం తెలుగులో సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: ἀγαθοποιοῦντας
  choice: మీరు మంచి చేస్తూ
  rationale: వర్తమాన కృదంతం సాధనాన్ని లేదా విధానాన్ని సూచిస్తుంది; ‘మంచి చేస్తూ’ ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: φιμοῦν
  choice: మాటలను మూయించాలి
  rationale: మూలార్థం ‘మూతి కట్టడం’; ఇక్కడ విరోధుల అజ్ఞానపూరితమైన మాటలను ఆపడం అనే రూపకాలంకార భావం. తెలుగులో ‘మాటలను మూయించడం’ ఆ బలమైన రూపకాన్ని కొంత నిలుపుతుంది.
- source_word: ἀγνωσίαν
  choice: అజ్ఞానపు మాటలు
  rationale: వ్యాకరణపరంగా ప్రత్యక్ష కర్మ ‘అజ్ఞానం’; అయితే ‘అజ్ఞానాన్ని మూయించడం’ తెలుగులో అసహజం. సందర్భంలోని రూపకార్థాన్ని స్పష్టంచేయడానికి మాటల భావాన్ని వ్యక్తీకరించాం.
- source_word: ἀφρόνων ἀνθρώπων
  choice: బుద్ధిహీనులైన ప్రజల
  rationale: ἄφρων అంటే వివేకం లేని లేదా బుద్ధిహీనమైన; ἀνθρώπων ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాని సాధారణ మానవ సూచన.
theological_decisions:
- issue: ἀνθρώπων యొక్క లింగ సూచన
  choice: ప్రజలు
  alternative: మనుష్యులు / పురుషులు
  rationale: గ్రీకు పదం ఇక్కడ సాధారణంగా మానవ ప్రత్యర్థులను సూచిస్తుంది; కేవలం పురుషులను కాదు.
- issue: దేవుని చిత్తం మరియు ఉద్దేశిత ఫలితం
  choice: మంచి చేయడం ద్వారా అజ్ఞానపూరిత విరోధాన్ని ఆపడం దేవుని చిత్తంగా వ్యక్తీకరించబడింది
  alternative: దేవుడు వారిని నేరుగా మౌనపరుస్తాడనే అర్థం
  rationale: ἀγαθοποιοῦντας మరియు φιμοῦν నిర్మాణం విశ్వాసుల మంచి ప్రవర్తనే మౌనపరచే సాధనమని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. మూలంలోని ‘మూతి కట్టడం’ రూపకానికి ప్రధాన పాఠ్యంలో సహజమైన రూపాన్ని, పాదటిప్పణిలో మరింత అక్షరార్థ రూపాన్ని ఇచ్చాం.
