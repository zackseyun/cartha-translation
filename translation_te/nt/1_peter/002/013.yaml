id: 1PE.2.13
reference: 1 Peter 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: te
  text: ప్రభువు నిమిత్తం ప్రతి మానవ పాలనా సంస్థకు[a] లోబడండి—ఉన్నత అధికారంలో ఉన్న రాజుకైనా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి మానవ సృష్టికి’; సంప్రదాయ అనువాదం, ‘మనుషులు చేసిన ప్రతి శాసనానికి.’ తరువాత రాజు, పాలకుల ప్రస్తావన రావడం వల్ల ఇక్కడ ఈ మాట మానవ సమాజంలోని పౌర పాలనా సంస్థలను లేదా అధికార వ్యవస్థలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అందరికంటే ఉన్నతుడైనవానిగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: లోబడండి
  rationale: ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకు మధ్యమ/కర్మణి రూపంలోని స్వచ్ఛంద లోబడే భావం సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: πάσῃ
  choice: ప్రతి
  rationale: ఏకవచన దత్తి రూపమైన κτίσειతో కలిసి పంపిణీ భావాన్ని ఇస్తుంది; అందువల్ల ‘అన్ని’ కంటే ‘ప్రతి’ తగినది.
- source_word: ἀνθρωπίνῃ κτίσει
  choice: మానవ పాలనా సంస్థకు
  rationale: κτίσις సాధారణంగా ‘సృష్టి’ అని అర్థమైనా, వెంట వచ్చే రాజు మరియు పాలకుల ప్రస్తావన ఇక్కడ పౌర పాలనా నిర్మాణాన్ని సూచిస్తుంది. ‘పాలనా సంస్థ’ సందర్భార్థాన్ని స్పష్టంగా చేస్తూ, అది దేవుడు నేరుగా స్థాపించిన వ్యవస్థ అని అనవసరంగా చెప్పదు.
- source_word: διὰ τὸν κύριον
  choice: ప్రభువు నిమిత్తం
  rationale: అక్యూసేటివ్‌తో διά ఇక్కడ కారణం లేదా ఉద్దేశాన్ని సూచిస్తుంది. ఈ పదబంధం ఆ ప్రేరణను సహజంగా తెలియజేస్తుంది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: గ్రీకు పాఠంలో ఉన్న బిరుదునే నిలుపుతూ, ‘యేసు’ లేదా ‘దేవుడు’ అని పాఠంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: εἴτε βασιλεῖ
  choice: రాజుకైనా
  rationale: εἴτε తరువాతి వచనంలో కొనసాగే ప్రత్యామ్నాయ నిర్మాణాన్ని ప్రారంభిస్తుంది. βασιλεύς యొక్క విస్తృతమైన ‘రాజు’ అనే అర్థాన్ని ఉంచి, చారిత్రకంగా సాధ్యమైనా మరింత నిర్దిష్టమైన ‘చక్రవర్తి’ని చేర్చదు.
- source_word: ὡς ὑπερέχοντι
  choice: ఉన్నత అధికారంలో ఉన్న
  rationale: ఇతరులకంటే పై స్థానం లేదా అధికారం కలిగి ఉండడాన్ని సూచిస్తుంది. ‘సర్వోన్నతుడు’ అనే పదం కలిగించగల నిరపేక్ష లేదా దైవసంబంధ భావాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ἀνθρωπίνῃ κτίσει సూచించే పౌర అధికారం స్వభావం
  choice: మానవ పాలనా సంస్థ
  alternative: ప్రతి మానవ సృష్టి; మనుషుల ప్రతి శాసనం
  rationale: రాజు, పాలకులు అనే తరువాతి ఉదాహరణలు పౌర సంస్థలు లేదా అధికార వ్యవస్థలే ఉద్దేశమని చూపుతాయి. ఈ అనువాదం ప్రతి వ్యక్తికి లోబడాలనే తప్పుదారిని నివారిస్తుంది; అలాగే ఆ వ్యవస్థల అంతిమ దైవశాస్త్రీయ మూలాన్ని ఈ పదబంధంలోనే నిర్ణయించదు.
- issue: κύριον యొక్క నిర్దిష్ట సూచన
  choice: ప్రభువు
  alternative: యేసు; దేవుడు
  rationale: మూలపాఠం కేవలం ‘ప్రభువు’ అనే బిరుదునే వాడుతుంది. అందువల్ల పాఠంలో లేని నిర్దిష్టతను చేర్చకుండా దాని భావ విస్తృతిని నిలుపుతుంది.
- issue: ὑπερέχοντιలోని అధికార స్థాయి
  choice: ఉన్నత అధికారంలో ఉన్న
  alternative: సర్వోన్నతుడైన; అందరికంటే ఉన్నతుడైన
  rationale: రాజు యొక్క పైస్థాయి పౌర అధికారాన్ని తెలియజేస్తూనే, అతనికి నిరపేక్షమైన లేదా దేవునికే తగిన సర్వాధికారం ఉందని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. వాక్యం 14వ వచనంలో కొనసాగుతున్నందున చివర అల్పవిరామం ఉంచబడింది. ‘లోబడండి’ ఆజ్ఞార్థక బలాన్ని నిలుపుతుంది; ‘మానవ పాలనా సంస్థ’ సందర్భాన్ని స్పష్టం చేస్తూ మూలంలోని అసాధారణ κτίσις ప్రయోగాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
