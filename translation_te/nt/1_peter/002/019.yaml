id: 1PE.2.19
reference: 1 Peter 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: te
  text: ఎందుకంటే, ఎవరైనా దేవుని గురించిన ఎరుకవల్ల[a] అన్యాయంగా బాధపడుతూ దుఃఖాలను సహిస్తే, అది కృప[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుణ్ణి మనసులో ఉంచుకోవడం వల్ల”; లేదా “దేవుని పట్ల మనస్సాక్షి కారణంగా.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “కృప” అంటే కృపతో కూడినది, ప్రశంసార్హమైనది, లేదా అనుగ్రహానికి పాత్రమైనది అని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: ఈ సందర్భంలో ఈ పదం ప్రశంసార్హమైనది లేదా అనుగ్రహానికి పాత్రమైనది అనే మూల్యాంకన భావాన్ని కలిగి ఉన్నప్పటికీ, పేతురు రచనలోనూ కొత్త నిబంధన అంతటిలోనూ ఉన్న ‘కృప’ అనే పదసంబంధాన్ని నిలుపుతుంది. సందర్భానుసార భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: διὰ συνείδησιν θεοῦ
  choice: దేవుని గురించిన ఎరుకవల్ల
  rationale: συνείδησις అనే పదంలో ‘మనస్సాక్షి’ మరియు ‘స్పృహ/ఎరుక’ అనే భావాలు రెండూ ఉండగలవు. θεοῦ ఇక్కడ దేవునివైపు మళ్లిన ఎరుకను సూచించవచ్చు. ‘దేవుని గురించిన ఎరుక’ ఈ సంక్షిప్తమైన, కొంత సందిగ్ధమైన ప్రయోగాన్ని అతిగా వ్యాఖ్యానించకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: ὑποφέρει
  choice: సహిస్తే
  rationale: కష్టాల కింద ఓర్పుతో నిలిచి భరించడాన్ని ఈ క్రియ సూచిస్తుంది. ‘సహిస్తే’ ఆధునిక తెలుగులో సహజంగా ఉండి షరతును కూడా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λύπας
  choice: దుఃఖాలను
  rationale: ఈ బహువచన పదం బాధ, వేదన, మనోవ్యథ వంటి విస్తృత అనుభవాలను సూచిస్తుంది; ‘దుఃఖాలు’ ఆ పరిధిని నిలుపుతుంది.
- source_word: πάσχων ἀδίκως
  choice: అన్యాయంగా బాధపడుతూ
  rationale: కర్త అన్యాయమైన రీతిలో బాధను అనుభవిస్తున్న సందర్భంలోనే దుఃఖాలను సహిస్తున్నాడనే వర్తమాన కృదంత భావాన్ని దగ్గరగా అందిస్తుంది.
- source_word: τις
  choice: ఎవరైనా
  rationale: నిర్దిష్టం కాని ఏకవచన వ్యక్తిని లింగపరమైన అదనపు భావం లేకుండా సహజంగా సూచిస్తుంది.
- source_word: τοῦτο γὰρ
  choice: ఎందుకంటే … అది
  rationale: γάρ ముందున్న సందర్భానికి వివరణను కలుపుతుంది; τοῦτο తరువాతి షరతు వాక్యమంతటినీ సూచిస్తున్నందున తెలుగులో ‘అది’ని ముగింపులో ఉంచడం సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఈ సందర్భంలో χάρις భావం
  choice: ‘కృప’గా అనువదించి, దాని మూల్యాంకన భావాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ‘ఇది ప్రశంసార్హమైనది’ లేదా ‘ఇది అనుగ్రహానికి పాత్రమైనది’
  rationale: మూలపాఠంలో లేని ‘దేవుని దృష్టిలో’ వంటి వివరణను ప్రధాన వాక్యంలో చేర్చకుండా, కృప/అనుగ్రహం అనే విస్తృత కొత్త నిబంధన పదసంబంధాన్ని కాపాడుతుంది.
- issue: συνείδησις θεοῦ అనే పదబంధం భావం
  choice: ‘దేవుని గురించిన ఎరుక’
  alternative: ‘దేవుని పట్ల మనస్సాక్షి’ లేదా ‘దేవుణ్ణి మనసులో ఉంచుకోవడం’
  rationale: ఇది దేవునివైపు మళ్లిన అవగాహనను ప్రధానంగా చూపుతూనే, ‘మనస్సాక్షి’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది; ఒకే వ్యాఖ్యానంలో పదబంధాన్ని బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. కారణాన్ని సూచించే ‘దేవుని గురించిన ఎరుకవల్ల’ అనే పదబంధాన్ని ‘సహిస్తే’కు ముందు ఉంచి, అది ‘అన్యాయంగా బాధపడుతూ’ అనే భాగానికే కారణమన్న అపార్థాన్ని తగ్గించాం. ‘కృప’ అనే ధార్మిక పదాన్ని ప్రధాన పాఠంలో నిలిపి, సందర్భార్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
