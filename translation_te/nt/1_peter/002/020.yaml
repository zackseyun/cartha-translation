revisions:
- from: మీరు పాపం చేస్తూ దెబ్బలు తిని సహిస్తే, అందులో ఏ ఘనత ఉంది? అయితే మీరు మేలు చేస్తూ బాధ అనుభవించి సహిస్తే, అది దేవుని ఎదుట కృపగా ఉంటుంది.[a]
  to: మీరు పాపం చేస్తూ దెబ్బలు తింటూ సహిస్తే, మీకు ఏ ప్రశంస ఉంటుంది? కానీ మీరు మేలు చేస్తూ బాధపడుతూ సహిస్తే, అది దేవుని దృష్టిలో మెప్పుదగినది.[a]
  rationale: The revision improves idiomatic modern Telugu, restores the source’s simultaneous ‘suffering and enduring’ construction, and renders the final idiom according to its contextual sense without suppressing the lexical grace/favor nuance, which is retained in the footnote.
  reviewer_model: gpt-5.6-terra
