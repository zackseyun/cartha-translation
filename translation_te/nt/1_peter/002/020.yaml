id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: te
  text: మీరు పాపం చేస్తూ దెబ్బలు తింటూ సహిస్తే, మీకు ఏ ప్రశంస ఉంటుంది? కానీ మీరు మేలు చేస్తూ బాధపడుతూ సహిస్తే, అది దేవుని దృష్టిలో మెప్పుదగినది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది దేవుని దగ్గర కృప/అనుగ్రహం”; అంటే, ఇది దేవుని అనుగ్రహం లేదా మెప్పును పొందుతుంది.
    reason: χάρις παρὰ θεῷ సందర్భానుసారంగా దేవుని మెప్పు లేదా అనుగ్రహాన్ని సూచిస్తుంది; ‘కృప’ అనే పదానికి ఉన్న విస్తృత పదార్థాన్ని కూడా ఈ ప్రత్యామ్నాయం చూపిస్తుంది.
lexical_decisions:
- source_word: κλέος
  choice: ఘనత
  rationale: ఈ అలంకార ప్రశ్నలో ఇది పేరు ప్రఖ్యాతులను కాక, ఒకరి ప్రవర్తనవల్ల లభించే ప్రశంస లేదా గౌరవాన్ని సూచిస్తుంది. ‘ఘనత’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἁμαρτάνοντες
  choice: పాపం చేస్తూ
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను, అలాగే పదంలోని నైతిక-దైవశాస్త్రీయ బలాన్ని నిలుపుతుంది.
- source_word: κολαφιζόμενοι
  choice: దెబ్బలు తిని
  rationale: పిడికిలితో కొట్టడం లేదా శారీరకంగా దెబ్బలు కొట్టడం అనే స్పష్టమైన భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπομενεῖτε
  choice: సహిస్తే
  rationale: కష్టంలో నిలకడగా భరించడం అనే భావాన్ని ఇస్తుంది; రెండు ఉపవాక్యాల్లోనూ అదే పదాన్ని ఉంచడం మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: ἀγαθοποιοῦντες
  choice: మేలు చేస్తూ
  rationale: మంచిగా లేదా ఇతరులకు మేలు కలిగేలా ప్రవర్తించడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πάσχοντες
  choice: బాధ అనుభవించి
  rationale: అన్యాయంగా హింసించబడటం అనే సంకుచిత అర్థానికి పరిమితం చేయకుండా, మూలంలోని విస్తృతమైన బాధపడే భావాన్ని కాపాడుతుంది.
- source_word: χάρις
  choice: కృప
  rationale: ‘కృప,’ ‘అనుగ్రహం,’ ‘మెప్పు’ అనే భావ పరిధిని కలిగిన పదం. ప్రధాన పాఠంలో దైవశాస్త్రీయ ప్రతిధ్వనిని కాపాడేందుకు ‘కృప’ను ఉంచి, సందర్భానుసారమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: παρὰ θεῷ
  choice: దేవుని ఎదుట
  rationale: దేవుని సమక్షంలో లేదా ఆయన అంచనాలో అనే సంబంధార్థాన్ని కాపాడుతుంది; ‘దేవుని దృష్టిలో’ కూడా సందర్భానికి తగిన ప్రత్యామ్నాయం.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో χάρις యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘దేవుని ఎదుట కృపగా ఉంటుంది’ అని అనువదించడం
  alternative: ‘ఇది దేవుని అనుగ్రహాన్ని పొందుతుంది’ లేదా ‘ఇది దేవుని దృష్టిలో మెప్పదగినది’
  rationale: ఈ సందర్భంలో పదబంధం దేవుని మెప్పు లేదా అనుగ్రహాన్ని సూచించవచ్చు; అదే సమయంలో χάρις పదంలోని ‘కృప’ అనే దైవశాస్త్రీయ ప్రతిధ్వనిని తొలగించకూడదు. అందువల్ల ప్రధాన పాఠం పదసంబంధాన్ని నిలిపి, పాదసూచిక సందర్భార్థాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. వర్తమాన కృదంతాల కొనసాగుతున్న భావాన్ని ‘చేస్తూ’ రూపాలతో నిలిపి, మూలంలోని రెండు షరతుల సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడాం.
