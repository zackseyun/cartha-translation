id: 1PE.2.11
reference: 1 Peter 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: te
  text: ప్రియులారా, పరదేశులుగాను తాత్కాలిక నివాసులుగాను ఉన్నవారిగా, శరీరసంబంధమైన కోరికలకు దూరంగా ఉండమని నేను మిమ్మల్ని కోరుతున్నాను.[a] అవి ప్రాణానికి విరోధంగా యుద్ధం చేస్తాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పరదేశులు” మరియు “తాత్కాలిక నివాసులు” అనే పదాలను “ప్రవాసులు” మరియు “యాత్రికులు” అని కూడా అనువదించవచ్చు. ఈ జంట పదాలు తమ స్వదేశం కాని చోట నివసించేవారి, తాత్కాలికంగా ఉండేవారి స్థితిని సూచిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: “శరీరసంబంధమైన కోరికలు” అంటే “శరీరానికి చెందిన కోరికలు” అని కూడా అనువదించవచ్చు. “ప్రాణం” ఇక్కడ “జీవితం,” “వ్యక్తి అంతరంగం,” లేదా “స్వయం” అనే భావాన్నీ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయతతో కూడిన బహువచన సంబోధనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: παρακαλῶ
  choice: నేను విజ్ఞప్తి చేస్తున్నాను
  rationale: ఇక్కడ ఉన్న హృదయపూర్వకమైన, గంభీరమైన ప్రేరేపణను అతిగా ఆజ్ఞారూపం చేయకుండా తెలియజేస్తుంది.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: పరదేశులుగాను తాత్కాలిక నివాసులుగాను
  rationale: మొదటి పదంలోని స్వదేశానికి వెలుపల నివసించే స్థితినీ, రెండవ పదంలోని తాత్కాలిక బస భావాన్నీ వేరుగా ఉంచుతూ జంట పదాల బలాన్ని కాపాడుతుంది.
- source_word: ἀπέχεσθαι
  choice: దూరంగా ఉండండి
  rationale: తమను తాము నిరంతరం వాటికి దూరంగా ఉంచుకోవాలనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: శరీరసంబంధమైన కోరికలు
  rationale: σάρξ పదకుటుంబంతో ఉన్న మూలరూప సంబంధాన్ని కాపాడుతూ, దాన్ని ముందుగానే ‘పాపపు స్వభావం’గా వ్యాఖ్యానించదు.
- source_word: στρατεύονται
  choice: యుద్ధం చేసే
  rationale: క్రియలోని సైనిక రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: κατὰ τῆς ψυχῆς
  choice: ప్రాణానికి విరోధంగా
  rationale: ψυχή సూచించగల జీవం, అంతరంగ వ్యక్తిత్వం, స్వయం అనే విస్తృతిని ‘ఆత్మ’ అనే వేరొక గ్రీకు భావంతో కలపకుండా తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: σαρκικῶν అనే నైతిక సందర్భంలోని విశేషణం
  choice: శరీరసంబంధమైన
  alternative: పాపపు; శరీరానికి చెందిన
  rationale: మూలంలోని ‘శరీరం/మాంసం’ రూపకాన్ని ఉంచి, కోరికలు కేవలం శారీరక అవసరాలేనని గానీ, ఒక నిర్దిష్ట ‘పాప స్వభావ’ సిద్ధాంతమని గానీ నిర్ణయించదు.
- issue: ψυχή యొక్క భావం
  choice: ప్రాణం
  alternative: ఆత్మ; జీవితం; వ్యక్తి అంతరంగం
  rationale: ఈ పదాన్ని సాంకేతిక శరీర–ఆత్మ ద్వైతంగా నిర్బంధించకుండా, వ్యక్తి జీవం లేదా స్వయం మీద జరిగే దాడి అనే భావాన్ని కాపాడుతుంది.
- issue: παροίκους καὶ παρεπιδήμους యొక్క సామాజిక-రూపక స్థితి
  choice: పరదేశులు మరియు తాత్కాలిక నివాసులు
  alternative: ప్రవాసులు మరియు యాత్రికులు
  rationale: విశ్వాసులు ప్రస్తుత సమాజంలో పూర్తిగా తమవారిగా లేరనే అంతర్భావాన్ని ఉంచుతుంది; అయితే ఈ పదాలను కేవలం ఆధ్యాత్మిక రూపకాలుగా మాత్రమే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైన సంబోధన, గంభీరమైన ప్రేరేపణ, స్పష్టమైన యుద్ధ రూపకం ఉపయోగించబడ్డాయి. ‘విజ్ఞప్తి చేస్తున్నాను’ వాక్యంలోని పాస్టరల్ స్వరాన్ని నిలుపుతుంది; ‘దూరంగా ఉండండి’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
