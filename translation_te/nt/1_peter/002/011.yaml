revisions:
- from: 'ప్రియులారా, పరదేశులుగాను తాత్కాలిక నివాసులుగాను ఉన్న మీకు నేను విజ్ఞప్తి చేస్తున్నాను: ప్రాణానికి విరోధంగా యుద్ధం చేసే శరీరసంబంధమైన కోరికలకు దూరంగా ఉండండి.[a][b]'
  to: ప్రియులారా, పరదేశులుగాను తాత్కాలిక నివాసులుగాను ఉన్నవారిగా, శరీరసంబంధమైన కోరికలకు దూరంగా ఉండమని నేను మిమ్మల్ని కోరుతున్నాను.[a] అవి ప్రాణానికి విరోధంగా యుద్ధం చేస్తాయి.[b]
  rationale: The revision keeps the source’s ambiguity and paired social imagery while making the appeal idiomatic in modern standard Telugu. It restores the explicit relationship of the relative clause to the desires by using a separate sentence (“అవి ... యుద్ధం చేస్తాయి”), preserves the military imagery, and relocates footnote anchors to the terms they explain.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:07:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the affectionate address, the paired outsider-status terms, abstention from σαρκικαὶ ἐπιθυμίαι, and the military metaphor directed against ψυχή. However, the placement of “ప్రాణానికి విరోధంగా యుద్ధం చేసే” before the desires slightly obscures that the relative clause qualifies the desires, and “విజ్ఞప్తి చేస్తున్నాను” is less forceful and less natural here than an exhortative request.
  naturalness: The Telugu is generally clear and modern, but “...ఉన్న మీకు నేను విజ్ఞప్తి చేస్తున్నాను” has a somewhat administrative tone. Recasting it as a direct appeal is more idiomatic and retains the pastoral force of παρακαλῶ.
  terminology: “పరదేశులు,” “తాత్కాలిక నివాసులు,” and “శరీరసంబంధమైన కోరికలు” are suitable. “ప్రాణం” can convey ψυχή’s life/self dimension without forcing a technical body–soul distinction; the footnote appropriately preserves the wider semantic range.
  issues:
  - severity: medium
    issue: The exhortative force and syntax are somewhat weakened.
    rationale: “నేను విజ్ఞప్తి చేస్తున్నాను” can sound like a formal petition, whereas παρακαλῶ is an earnest pastoral appeal. The current participial ordering also temporarily makes the relation of “యుద్ధం చేసే” to “కోరికలు” less immediate than in Greek.
  - severity: low
    issue: Footnote a does not provide a clear lexical alternative to the main wording.
    rationale: Its explanation is useful, but its stated reason is lexical_alternative. Supplying the viable alternatives “ప్రవాసులు” and “యాత్రికులు” aligns its content with that classification without imposing a theological interpretation.
  revised_text: ప్రియులారా, పరదేశులుగాను తాత్కాలిక నివాసులుగాను ఉన్నవారిగా, శరీరసంబంధమైన కోరికలకు దూరంగా ఉండమని నేను మిమ్మల్ని కోరుతున్నాను.[a] అవి ప్రాణానికి విరోధంగా యుద్ధం చేస్తాయి.[b]
