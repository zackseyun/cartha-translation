  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: te
  text: ఆయన ఏ పాపమూ చేయలేదు; ఆయన నోటిలో ఏ మోసమూ కనిపించలేదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మోసం’ అనే గ్రీకు పదానికి ‘కపటం,’ ‘వంచన,’ లేదా ‘ద్రోహబుద్ధి’ అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు యెషయా 53:9ను ప్రతిధ్వనింపజేస్తున్నాయి.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: ఆయన
  rationale: ముందటి వచనంలోని క్రీస్తునే సూచించే సంబంధ సర్వనామం. తెలుగు వాక్య నిర్మాణంలో స్వతంత్ర వచనంగా సహజంగా ఉండేందుకు ‘ఆయన’ అని ఇచ్చాం.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: ఏ పాపమూ చేయలేదు
  rationale: ποιέωతో ἁμαρτίαν కలిసినప్పుడు ‘పాపం చేయడం’ అనే సహజమైన అర్థం వస్తుంది. గ్రీకులోని ఏకవచనాన్ని వర్గార్థకంగా తెలుగులో సహజంగా వ్యక్తపరచేందుకు ‘ఏ పాపమూ’ వాడాం.
- source_word: οὐδὲ
  choice: ; ... ఏ ... మూ ... లేదు
  rationale: రెండవ ప్రతికూల వాక్యాన్ని మొదటిదానితో సమన్వయంగా కలుపుతుంది. తెలుగులో పునరుక్త ప్రతికూల నిర్మాణం భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εὑρέθη
  choice: కనిపించలేదు
  rationale: ఆరిస్ట్ కర్మణి రూపంలోని ‘కనుగొనబడలేదు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ఎవరు వెదికారనే కర్తను చేర్చకుండా ఉంచుతుంది.
- source_word: δόλος
  choice: మోసం
  rationale: ఉద్దేశపూర్వక వంచన, కపటం అనే అర్థపరిధిని సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేసే పదం.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: ఆయన నోటిలో
  rationale: గ్రీకు శరీరరూపకాన్ని నేరుగా నిలుపుతూ యెషయా 53:9 ప్రతిధ్వనిని కాపాడుతుంది; ‘ఆయన మాటల్లో’ అనే వివరణాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: యేసు పాపరాహిత్యాన్ని, వంచనలేమిని యెషయా 53:9 భాషలో వర్ణించడం
  choice: ‘ఏ పాపమూ చేయలేదు; ఆయన నోటిలో ఏ మోసమూ కనిపించలేదు’ అనే మూలానికి దగ్గరైన రూపం
  alternative: ‘ఆయన ఎన్నడూ పాపం చేయలేదు, ఎన్నడూ మోసపూరితంగా మాట్లాడలేదు’ అనే మరింత వివరణాత్మక రూపం
  rationale: మూలంలోని సంపూర్ణ ప్రతికూల ప్రకటనను, కర్మణి నిర్మాణాన్ని, నోటి రూపకాన్ని నిలుపుతూ యెషయా గ్రంథ ప్రతిధ్వనిని సంరక్షిస్తుంది; వచనం చెప్పినదానికంటే ఎక్కువ వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ‘మోసం,’ ‘కనిపించలేదు’ వంటి సహజ పదాలను వాడాం. అదే సమయంలో ‘ఆయన నోటిలో’ అనే గంభీరమైన బైబిలు రూపకాన్ని నిలిపాం. ప్రధాన పాఠ్యంలో [a], [b] గుర్తులు వాటి సంబంధిత వాక్యభాగం చివర ఉంచబడ్డాయి.
