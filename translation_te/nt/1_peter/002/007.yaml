  terminology: ‘ఘనత,’ ‘విశ్వసించే,’ ‘విశ్వసించనివారు,’ ‘తిరస్కరించిన రాయి’ సరైనవి. κεφαλὴ γωνίας కోసం ‘మూలకు తలరాయి’ అనే పదబంధం సంప్రదాయ ‘మూలరాయి’తో పూర్తిగా సమానార్థకమని నిర్దేశించకుండా, ‘head of the corner’ రూపకాన్ని తెలుగులో అర్థవంతంగా ప్రతిబింబిస్తుంది. ప్రత్యామ్నాయ పఠనం మరియు పదార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో నిలిపాము.
