id: 1PE.2.7
reference: 1 Peter 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: te
  text: కాబట్టి, విశ్వసించే మీకు ఆ ఘనత ఉంది[a]. అయితే విశ్వసించనివారికి[b], “ఇల్లు కట్టేవారు తిరస్కరించిన రాయి—అదే మూలకు తలరాయి అయింది[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వసించే మీకు ఆ అమూల్యత ఉంది”; అంటే, విశ్వాసులకు ఆ రాయి అమూల్యమైనది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “అవిధేయులైనవారికి”; ఈ క్రియ విశ్వసించడానికి నిరాకరించి, దాని ఫలితంగా అవిధేయంగా ప్రవర్తించడం అనే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: c
    text: సంప్రదాయంగా, “మూలరాయి” లేదా “ప్రధాన మూలరాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: ఘనత
  rationale: ఈ పదానికి ఘనత, విలువ, అమూల్యత అనే భావాలు ఉండవచ్చు. ఇక్కడ విశ్వసించేవారికి ఘనత కలుగుతుందనే భావం సహజంగా సరిపోతుంది; రాయి యొక్క అమూల్యతను సూచించే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: τοῖς πιστεύουσιν
  choice: విశ్వసించే మీకు
  rationale: దత్తివ విభక్తిలోని కృదంతాన్ని ὑμῖνతో కలిపి, ప్రత్యక్ష సంబోధనను మరియు విశ్వాసం అనే క్రియాభావాన్ని నిలిపే సహజమైన తెలుగు రూపం.
- source_word: ἀπιστοῦσιν
  choice: విశ్వసించనివారికి
  rationale: ముందున్న πιστεύουσινకు స్పష్టమైన వ్యతిరేక సమాంతరాన్ని నిలుపుతుంది. అవిధేయత అనే భావఛాయను పాదసూచికలో సూచించాం.
- source_word: λίθος
  choice: రాయి
  rationale: నిర్మాణ రూపకానికి సరిపోయే సాధారణ, సహజమైన తెలుగు పదం.
- source_word: ἀπεδοκίμασαν
  choice: తిరస్కరించిన
  rationale: పరిశీలించి అంగీకరించకపోవడం అనే మూలభావాన్ని సందర్భానుకూలంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οἰκοδομοῦντες
  choice: ఇల్లు కట్టేవారు
  rationale: నామవాచకంగా వాడిన కృదంతాన్ని సాధారణ పాఠకులకు స్పష్టంగా చేసి, నిర్మాణ దృశ్యాన్ని నిలుపుతుంది.
- source_word: κεφαλὴν γωνίας
  choice: మూలకు శిరస్సు
  rationale: అక్షరార్థంగా ‘మూల యొక్క శిరస్సు’ అనే రూపకాన్ని సాధ్యమైనంత పారదర్శకంగా నిలుపుతుంది; ‘మూలరాయి/ప్రధాన మూలరాయి’ అనే సంప్రదాయ అర్థానువాదాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ἡ τιμή విశ్వాసులతోనూ రాయిగా ఉన్న క్రీస్తుతోనూ ఎలా సంబంధిస్తుంది
  choice: విశ్వసించే వారికి ఘనత ఉంది
  alternative: విశ్వసించేవారికి ఆ రాయి అమూల్యమైనది
  rationale: ὑμῖν οὖν ἡ τιμή అనే వాక్యభాగం నేరుగా విశ్వాసులకు ఘనత ఉందని చదవడానికి అనుకూలంగా ఉంది; అయినా మునుపటి వచనంలోని ‘అమూల్యమైన’ రాయి భావం వల్ల ప్రత్యామ్నాయ పఠనం సాధ్యమే కాబట్టి దానిని పాదసూచికలో నిలిపాం.
- issue: κεφαλὴ γωνίας యొక్క నిర్మాణ మరియు క్రీస్తుసంబంధ రూపకం
  choice: మూలకు శిరస్సు అనే పారదర్శక రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: మూలరాయి లేదా ప్రధాన మూలరాయి
  rationale: గ్రీకు పదబంధంలోని రూపకాన్ని ఒకే నిర్మాణార్థానికి పరిమితం చేయకుండా నిలిపాం; పాఠకులకు పరిచితమైన అర్థానువాదాన్ని పాదసూచికలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. గ్రీకు వాక్యంలోని సంక్షిప్తతను పూర్తిగా కృత్రిమంగా అనుకరించకుండా, దాని వ్యతిరేక సమాంతర నిర్మాణాన్ని నిలిపాం. ఉద్ధరణలోని κεφαλὴν γωνίας రూపకాన్ని ఉద్దేశపూర్వకంగా పారదర్శకంగా ఉంచి, పరిచితమైన సంప్రదాయ పదాన్ని పాదసూచికలో ఇచ్చాం.
