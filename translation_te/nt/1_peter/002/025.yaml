id: 1PE.2.25
reference: 1 Peter 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: te
  text: ఎందుకంటే మీరు దారితప్పిపోతున్న గొర్రెలవలె ఉండేవారు[a]. అయితే ఇప్పుడు మీరు తిరిగి వచ్చారు[b]—మీ ఆత్మల కాపరియైన, పర్యవేక్షకుడైన ఆయన దగ్గరకు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అటూ ఇటూ తిరుగుతున్న’; లేదా, ‘దారి తప్పించబడుతున్న.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తిరిగి మళ్లారు’; గ్రీకు రూపాన్ని కర్మణి ఛాయతో ‘తిరిగి మళ్లించబడ్డారు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ‘పర్యవేక్షకుడు’కు బదులుగా ‘సంరక్షకుడు’ అని కూడా అనువదించవచ్చు; సాంప్రదాయ అనువాదం ‘బిషప్.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: ఎందుకంటే, మీరు ... ఉండేవారు
  rationale: γάρ ముందరి వాక్యానికి కారణాన్ని అనుసంధానిస్తుంది; ἦτε అనే అసంపూర్ణ భూతకాల రూపం వారి పూర్వ స్థితిని సూచిస్తుంది.
- source_word: ὡς πρόβατα
  choice: గొర్రెలవలె
  rationale: ὡς పోలికను సూచిస్తుంది; πρόβατα బహువచన భావం తెలుగులో సందర్భానుసారంగా సహజంగా వ్యక్తమవుతుంది.
- source_word: πλανώμενοι
  choice: దారితప్పిపోతున్న
  rationale: ఈ కృదంతం ‘దారితప్పడం,’ ‘తిరుగాడడం,’ లేదా కర్మణి ఛాయతో ‘దారి తప్పించబడడం’ అనే భావాలను ఇవ్వగలదు. గొర్రెల రూపకంలో ‘దారితప్పిపోతున్న’ అనేది కర్తృత్వాన్ని అతిగా నిర్దేశించకుండా ప్రధాన భావాన్ని నిలుపుతుంది.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: అయితే ఇప్పుడు ... తిరిగి వచ్చారు
  rationale: ἀλλά బలమైన వ్యత్యాసాన్ని చూపుతుంది. కర్మణి రూపమైన ἐπεστράφητε మధ్యమ/అకర్మక భావంలో కూడా వాడబడగలదు; ‘తిరిగి వచ్చారు’ పూర్తి అయిన మార్పును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ τὸν ποιμένα
  choice: కాపరి ... దగ్గరకు
  rationale: ποιμήνకు నేరమైన, రూపకాన్ని నిలిపే తెలుగు పదం ‘కాపరి.’ ἐπί ఇక్కడ వ్యక్తివైపు తిరిగి రావడాన్ని సూచిస్తుంది.
- source_word: καὶ ἐπίσκοπον
  choice: పర్యవేక్షకుని
  rationale: ἐπίσκοπος పైనుండి గమనించి బాధ్యతగా చూసుకునే వ్యక్తిని సూచిస్తుంది. ‘పర్యవేక్షకుడు’ మూలార్థాన్ని నిలుపుతూ, తరువాతి కాలపు ప్రత్యేక సంఘపదవిని అనవసరంగా దిగుమతి చేయదు.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: మీ ప్రాణాల
  rationale: ψυχή సందర్భానుసారంగా ప్రాణం, జీవితం, వ్యక్తి అనే విస్తృత భావాలను కలిగి ఉంటుంది. ‘ప్రాణాలు’ వ్యక్తుల అంతరంగ జీవితం సహా వారి జీవాన్ని సూచిస్తూ, అతిగా తాత్త్విక విభజనను రుద్దదు.
theological_decisions:
- issue: ἐπίσκοποςను క్రీస్తుకు వర్తించే బిరుదుగా అనువదించడం
  choice: పర్యవేక్షకుడు
  alternative: సంరక్షకుడు; సాంప్రదాయంగా ‘బిషప్’
  rationale: ఈ వాక్యం ποιμήν, ἐπίσκοπος రెండింటినీ క్రీస్తుకు వర్తింపజేస్తుంది. ‘పర్యవేక్షకుడు’ పదార్థాన్ని నిలుపుతుంది; ‘బిషప్’ తరువాతి సంఘ పరిపాలనా పదవిని సూచించే ప్రమాదం ఉంది, ‘సంరక్షకుడు’ కొంత వ్యాఖ్యానాత్మకం.
- issue: ἐπεστράφητεలోని కర్మణి ఛాయ
  choice: తిరిగి వచ్చారు
  alternative: తిరిగి మళ్లారు; తిరిగి మళ్లించబడ్డారు
  rationale: గ్రీకు రూపం కర్మణిగా ఉన్నప్పటికీ మధ్యమ/అకర్మక భావాన్ని ఇవ్వగలదు. ‘తిరిగి వచ్చారు’ దైవ కార్యం, మానవ స్పందన మధ్య ఉన్న ఉద్రిక్తతను ఏకపక్షంగా పరిష్కరించకుండా సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. గొర్రెలు–కాపరి రూపకం స్పష్టంగా నిలుపబడింది; సంఘపరిపాలనకు సంబంధించిన తరువాతి కాలపు ప్రత్యేక పదజాలం ప్రధాన పాఠ్యంలో నివారించబడింది.
