lexical_decisions:
- source_word: φιλόξενοι
  choice: ఆతిథ్యం ఇవ్వండి
  rationale: మూలంలో ఇది విశేషణ రూపమైనప్పటికీ సందర్భంలో ఆజ్ఞార్థక బలం కలిగి ఉంది. ఆధునిక తెలుగులో సహజమైన క్రియారూపం ద్వారా అతిథులను ఆదరించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς ἀλλήλους
  choice: ఒకరికొకరు
  rationale: సమాజంలోని విశ్వాసుల మధ్య పరస్పర దిశను, బాధ్యతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἄνευ
  choice: -కుండా
  rationale: ఏదో లేకుండా చేయడం అనే మూలార్థాన్ని తెలుగులో సహజమైన వ్యతిరేక క్రియావిశేషణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: γογγυσμοῦ
  choice: సణుగుకోకుండా
  rationale: అసంతృప్తితో లోలోపల లేదా మాటల్లో గొణిగే భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; సాధారణమైన ‘ఫిర్యాదు చేయడం’ కంటే మూలపదంలోని మర్మరపు అసంతృప్తికి దగ్గరగా ఉంటుంది.
