  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: te
  text: ఎవరైనా మాట్లాడితే, దేవుని దివ్యవాక్కులను పలుకుతున్నట్లుగా మాట్లాడాలి[a]. ఎవరైనా సేవ చేస్తే, దేవుడు అనుగ్రహించే బలంతో సేవ చేయాలి[b]. తద్వారా అన్నిటిలోనూ యేసు మెస్సీయ ద్వారా దేవుడు మహిమపరచబడాలి. మహిమ, ఆధిపత్యం యుగయుగాల వరకు ఆయనకు చెందుతాయి[c][d]. ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని దైవోక్తులను పలుకుతున్నట్లుగా.” గ్రీకు λόγια దేవునికి చెందిన ఉక్తులు లేదా దైవోక్తులు అనే భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “దేవుడు అనుగ్రహించే బలం నుండి.” ఇక్కడ ఉద్దేశం సేవకు కావలసిన బలానికి దేవుడే మూలమని చెప్పడం.
    reason: lexical_alternative
  - marker: c
    text: “ఆయనకు” అనేది వ్యాకరణపరంగా సమీపంలో ఉన్న యేసు మెస్సీయను సూచించే అవకాశం ఎక్కువ. అయితే ముందున్న వాక్యంలో మహిమపరచబడేది దేవుడే కనుక, కొందరు దీనిని తండ్రియైన దేవుణ్ణి సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: d
    text: అక్షరార్థంగా, “యుగాల యుగాల వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: మాట్లాడితే
  rationale: సాధారణ షరతుతో కూడిన వర్తమాన క్రియను సహజమైన ఆధునిక తెలుగులో విస్తృతార్థంతో వ్యక్తపరుస్తుంది; దీనిని కేవలం బోధించడం లేదా ప్రకటించడం వరకు పరిమితం చేయదు.
- source_word: λόγια θεοῦ
  choice: దేవుని దివ్యవాక్కులు
  rationale: λόγια సాధారణ మాటలకన్నా దేవునికి చెందిన ఉక్తులు లేదా దైవోక్తులు అనే ఉన్నత భావాన్ని కలిగిస్తుంది. ‘దివ్యవాక్కులు’ ఆ భావాన్ని పాఠకులకు అర్థమయ్యే రీతిలో నిలుపుతుంది.
- source_word: διακονεῖ
  choice: సేవ చేస్తే
  rationale: క్రియకు విస్తృతమైన సేవ లేదా పరిచర్య భావం ఉంది; ‘సేవ చేస్తే’ దానిని అధికారిక సంఘ పదవికి పరిమితం చేయదు.
- source_word: ἐξ ἰσχύος
  choice: బలం నుండి
  rationale: ἐξ మూలాన్ని సూచిస్తుంది; సేవ చేసే సామర్థ్యం దేవుడు ఇచ్చే బలం నుండే వస్తుందని స్పష్టపరుస్తుంది.
- source_word: χορηγεῖ
  choice: అనుగ్రహించే
  rationale: దేవుడు అవసరమైన బలాన్ని సమకూర్చడం అనే భావాన్ని సహజమైన భక్తిపూర్వక తెలుగులో తెలియజేస్తుంది; సరఫరా చేయడం అనే యాంత్రిక ధ్వనిని నివారిస్తుంది.
- source_word: ἐν πᾶσιν
  choice: అన్నిటిలోనూ
  rationale: సందర్భంలోని సమస్త కార్యాలను ఆవరించే విస్తృత భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δοξάζηται
  choice: మహిమపరచబడాలి
  rationale: ἵνα తరువాతి కర్తరి కాని ప్రయోగాన్ని, ఉద్దేశ భావాన్ని నిలుపుతుంది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ ద్వారా
  rationale: διά యొక్క మాధ్యమార్థాన్ని ‘ద్వారా’ నిలుపుతుంది; Χριστόςను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది.
- source_word: κράτος
  choice: ఆధిపత్యం
  rationale: స్తుతివాక్య సందర్భంలో పాలనా శక్తి, సార్వభౌమ అధికారం అనే భావాన్ని ‘ఆధిపత్యం’ స్పష్టంగా అందిస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాల వరకు
  rationale: అక్షరార్థ చిత్రాన్ని కొంత నిలుపుతూ అంతంలేని కాలాన్ని సూచించే సహజమైన తెలుగు బైబిలు శైలిని ఉపయోగిస్తుంది.
theological_decisions:
- issue: ముగింపు స్తుతివాక్యంలోని ᾧ (‘ఎవరికి/ఆయనకు’) యొక్క సూచన
  choice: ప్రధాన పాఠంలోని ‘ఆయనకే’ను సమీప పూర్వపదమైన యేసు మెస్సీయను సూచించేలా చదవవచ్చు.
  alternative: ముందున్న ప్రధాన వాక్య కర్త అయిన తండ్రియైన దేవుణ్ణి సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు.
  rationale: వ్యాకరణపరంగా సమీప పూర్వపదం Ἰησοῦ Χριστοῦ కావడం యేసు మెస్సీయను సూచించడానికి మద్దతిస్తుంది. అయితే దేవుడు మహిమపరచబడాలి అనే వెంటనే ముందున్న భావం వల్ల దేవుణ్ణి సూచించే పఠనమూ సాధ్యమే; అందుచేత సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- issue: రెండు ఉపవాక్యాల్లోని ὡς యొక్క బలం
  choice: తెలుగులో సహజమైన ఉపదేశాత్మక రూపంగా ‘మాట్లాడాలి’, ‘సేవ చేయాలి’ అని వ్యక్తపరచబడింది.
  alternative: మరింత సంక్షిప్తంగా ‘ఎవరైనా మాట్లాడితే, దేవుని దివ్యవాక్కులవలె; ఎవరైనా సేవ చేస్తే, దేవుడు అనుగ్రహించే బలం నుండివలె’ అని ఉంచవచ్చు.
  rationale: గ్రీకులో పోలికా నిర్మాణం క్రియను అధ్యాహారంగా ఉంచుతుంది. సహజమైన తెలుగుకు ఉపదేశ క్రియ అవసరం; చేర్చిన రూపం మూలంలోని ప్రోత్సాహక భావాన్ని మాత్రమే స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనుకూలమైన శైలి. ‘దివ్యవాక్కులు’ λόγια యొక్క ఉన్నత భావాన్ని నిలుపుతుంది; ‘మెస్సీయ’ Χριστόςను బిరుదుగా చూపుతుంది. గ్రీకు వాక్యంలోని సంక్షిప్త ὡς నిర్మాణాన్ని తెలుగులో సహజమైన ఉపదేశ రూపంతో విప్పి చెప్పాం.
