id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: te
  text: ఇకమీదట మానవ కోరికల కోసం కాక, దేవుని చిత్తం కోసం శరీరంలో తనకు మిగిలిన కాలాన్ని గడపడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శరీరంతో కూడిన జీవితంలో తనకు మిగిలిన కాలాన్ని.’ ఇక్కడ ‘శరీరంలో’ అనే గ్రీకు పదబంధం భూమిమీద శరీరంతో జీవించే జీవితాన్ని సూచిస్తుంది; అది తప్పనిసరిగా ‘పాప స్వభావాన్ని’ సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: గడపడానికి
  rationale: మునుపటి వాక్యంతో ఉన్న ఉద్దేశం/ఫలితం సంబంధాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక క్రియారూపం ద్వారా తెలియజేస్తుంది.
- source_word: μηκέτι
  choice: ఇకమీదట ... కాక
  rationale: గత జీవన విధానం ఇక కొనసాగకూడదనే విరమణ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνθρώπων ἐπιθυμίαις
  choice: మానవ కోరికల కోసం
  rationale: ἀνθρώπων ఇక్కడ స్త్రీపురుషులందరినీ సూచించే సాధారణ పదం; ἐπιθυμίαις విస్తృతార్థకంగా కోరికలను సూచిస్తుంది, కేవలం లైంగిక వాంఛలను కాదు.
- source_word: ἀλλὰ θελήματι θεοῦ
  choice: కాక, దేవుని చిత్తం కోసం
  rationale: మానవ కోరికలు మరియు దేవుని చిత్తం అనే రెండు జీవన దిశల మధ్య బలమైన వ్యత్యాసాన్ని సమాంతర నిర్మాణంలో నిలుపుతుంది.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: మిగిలిన తన జీవితకాలాన్ని
  rationale: మునుపటి సందర్భంలోని ఏకవచన వ్యక్తిని అనుసరిస్తూ, మిగిలి ఉన్న కాలం అతని జీవితకాలమని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν σαρκὶ
  choice: శరీరంలో
  rationale: ఈ సందర్భంలో భూమిమీద శరీరంతో జీవించే ఉనికిని సూచిస్తుంది; ‘పాప స్వభావం’ అనే భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: βιῶσαι
  choice: గడపడానికి
  rationale: కాలాన్ని జీవించడం లేదా గడపడం అనే భావంలో, ‘జీవితకాలాన్ని గడపడం’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: ἐν σαρκὶ లో σάρξ యొక్క భావం
  choice: శరీరంతో కూడిన భౌమిక జీవితం (‘శరీరంలో’)
  alternative: పాప స్వభావంలో
  rationale: ఇక్కడ ఈ పదబంధం విశ్వాసి శరీరంతో జీవించే మిగిలిన మర్త్య జీవితాన్ని సూచిస్తుంది. సందర్భంలో గత పాపప్రవర్తనకు విధేయ జీవితం విరుద్ధంగా ఉన్నప్పటికీ, σάρξ అనే పదబంధాన్నే అంతర్గత ‘పాప స్వభావం’గా అర్థం చేయాల్సిన అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, లేఖనానికి తగిన గౌరవప్రద శైలిలోనూ ఉంది. ఈ వాక్యం 4:1పై ఆధారపడిన ప్రయోజనార్థక భాగమనే అసంపూర్ణ నిర్మాణాన్ని మూలానికి అనుగుణంగా నిలిపింది.
