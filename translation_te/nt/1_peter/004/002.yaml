  to: ఇకమీదట మానవ కోరికల కోసం కాక, దేవుని చిత్తం కోసం శరీరంలో తనకు మిగిలిన కాలాన్ని గడపడానికి.[a]
  rationale: The revision preserves the Greek word order and purpose relation while improving Telugu modifier scope. The footnote now supplies a real alternative for ἐν σαρκί and continues to guard against reading the phrase as necessarily denoting a sinful nature.
