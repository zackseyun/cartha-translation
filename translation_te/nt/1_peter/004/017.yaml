  naturalness: The wording is natural, modern standard Telugu with an appropriately serious biblical register. ‘సమయం వచ్చింది’ and ‘గతి ఏమిటి?’ are idiomatic in context, and the resumed pronoun ‘అది’ makes the ellipsis in εἰ δὲ πρῶτον ἀφ’ ἡμῶν clear without overtranslating.
