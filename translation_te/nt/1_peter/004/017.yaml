id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: te
  text: ఎందుకంటే దేవుని ఇంటివారి నుంచే[a] తీర్పు మొదలయ్యే సమయం వచ్చింది. అది మొదట మన నుంచే మొదలైతే, దేవుని సువార్తకు విధేయులు కానివారి[c] గతి[b] ఏమిటి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని ఇంటి నుంచే.’ గ్రీకు పదం ఇల్లు లేదా ఇంటివారు అనే రెండు అర్థాలనూ ఇవ్వగలదు; ఇక్కడ అది దేవుని ప్రజలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అంతం.’ గ్రీకు పదానికి అంతం, గతి, పర్యవసానం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘విధేయులు కానివారు’ అనే మాటను ‘విశ్వసించడానికి నిరాకరించేవారు’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం సువార్తకు ప్రతిస్పందనలో అవిధేయతను, అవిశ్వాసాన్ని రెండింటినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందున్న సందర్భానికి కారణాన్ని తెలియజేస్తుంది; అందువల్ల కారణార్థక అనుసంధానం సహజంగా ఉంటుంది.
- source_word: ὁ καιρός
  choice: సమయం వచ్చింది
  rationale: καιρός తగిన లేదా నియమిత సమయాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘సమయం వచ్చింది’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: తీర్పు మొదలయ్యే
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తూ, κρίμα యొక్క విస్తృత న్యాయనిర్ణయ భావాన్ని ‘తీర్పు’గా నిలుపుతుంది.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: దేవుని ఇంటివారి నుంచే
  rationale: οἶκος ఇక్కడ భవనాన్ని కాక దేవుని ప్రజల సమూహాన్ని సూచిస్తుందని తరువాతి ‘మన నుంచే’ స్పష్టం చేస్తుంది. ἀπόను ‘నుంచే’గా నిలిపి ఆరంభ బిందువును చూపించాం.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: అది మొదట మన నుంచే మొదలైతే
  rationale: ముందరి వాక్యభాగం నుండి ‘తీర్పు’ను ‘అది’ సూచిస్తుంది; అర్థస్పష్టత కోసం ‘మొదలైతే’ను పునరుక్తం చేశాం. πρῶτον మరియు ἀπό రెండింటి బలాన్ని నిలిపాం.
- source_word: τέλος
  choice: గతి
  rationale: ఇక్కడ τέλος కేవలం కాలపరమైన ముగింపుకన్నా చివరి ఫలితం లేదా పర్యవసానాన్ని సూచిస్తుంది. ‘గతి’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది; ‘అంతం’ను పాదసూచికలో ఉంచాం.
- source_word: ἀπειθούντων
  choice: విధేయులు కానివారి
  rationale: ఈ కృదంతం సువార్త పట్ల అవిధేయతను, దాన్ని నమ్మడానికి నిరాకరించడాన్ని రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలో అవిధేయత భావాన్ని నిలిపి, విశ్వసించని భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: దేవుని సువార్తకు
  rationale: దత్తివును ‘కు’తో వ్యక్తం చేశాం; జనిటివ్ సువార్త దేవునికి చెందినది లేదా ఆయన నుండి వచ్చినది అనే భావాన్ని తెరవుగా ఉంచుతుంది.
theological_decisions:
- issue: దేవుని ప్రజలకు సంబంధించిన κρίμα స్వభావం
  choice: ‘తీర్పు’ అని అనువదించి, దాన్ని శిక్షావిధి లేదా క్రమశిక్షణగా ప్రత్యేకంగా పరిమితం చేయలేదు.
  alternative: ‘శిక్షావిధి’ లేదా ‘క్రమశిక్షణ’
  rationale: దేవుని న్యాయపరమైన వ్యవహారం ఆయన ప్రజలతో మొదలవుతుందనే గంభీరతను వాక్యం కలిగి ఉంది. ‘శిక్షావిధి’ విశ్వాసుల విషయంలో అర్థాన్ని అతిగా కుదిస్తుంది; ‘క్రమశిక్షణ’ న్యాయతీర్పు గంభీరతను తగ్గిస్తుంది.
- issue: ‘దేవుని ఇల్లు’ అనే పదబంధం సూచించే వారు
  choice: దేవుని ప్రజలను ‘దేవుని ఇంటివారు’గా వ్యక్తం చేశాం.
  alternative: దేవాలయం లేదా దేవుని భవనం
  rationale: తరువాత వచ్చే ‘మన నుంచే’ అనే మాట ఈ పదబంధం ప్రజల సమూహాన్ని సూచిస్తుందని నిర్ధారిస్తుంది; అయినా ‘ఇల్లు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: ἀπειθούντωνలో అవిధేయత మరియు అవిశ్వాసం మధ్య సంబంధం
  choice: ప్రధాన పాఠంలో ‘విధేయులు కానివారు’ అని ఉంచాం.
  alternative: ‘విశ్వసించడానికి నిరాకరించేవారు’
  rationale: గ్రీకు పదం సువార్తకు ప్రతిస్పందనలో అవిధేయత, అవిశ్వాసం రెండింటినీ మోసుకురాగలదు. ఒక భావంతో మరొకదాన్ని పూర్తిగా తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించాం. ‘ఇంటివారు,’ ‘గతి’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకుని, మూలంలోని ‘నుంచి’ పునరుక్తిని భావసంబంధం కోసం నిలిపాం.
