review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the nearness of the end and the purpose-related connection to prayer. However, its wording makes the first Greek imperative subordinate ('...ఉంచుకొని') to the second, whereas σωφρονήσατε and νήψατε are coordinated imperatives. 'మిమ్మల్ని మీరు అదుపులో ఉంచుకొని' is also more cumbersome and behavior-focused than the primary sense of sound judgment.
  naturalness: The proposed revision is concise, idiomatic modern standard Telugu, and gives the paired exhortations balanced expression. 'ప్రార్థనల కొరకు' retains the plural noun and expresses εἰς as purpose.
  terminology: ‘అన్నిటి అంతం,’ ‘స్వస్థబుద్ధితో,’ and ‘మెలకువగా’ appropriately preserve the eschatological statement and the complementary senses of sound judgment and alertness without importing a denominational interpretation.
  issues:
  - severity: medium
    issue: The two coordinated imperatives are not represented as coordinate commands.
    rationale: ‘వివేకంతో మిమ్మల్ని మీరు అదుపులో ఉంచుకొని, మెలకువగా ఉండండి’ subordinates the first action by using the conjunctive participial form ఉంచుకొని. The Greek has two aorist imperatives, σωφρονήσατε and νήψατε.
  - severity: low
    issue: The rendering of σωφρονήσατε is unnecessarily periphrastic.
    rationale: ‘మిమ్మల్ని మీరు అదుపులో ఉంచుకొని’ can communicate self-restraint, but it is longer and somewhat shifts the emphasis away from sound judgment. ‘స్వస్థబుద్ధితో ఉండండి’ is natural and closer to the immediate semantic force.
  revised_text: అయితే అన్నిటి అంతం సమీపించింది.[a] కాబట్టి ప్రార్థనల కొరకు స్వస్థబుద్ధితోను మెలకువగా ఉండండి.[b]
