source:
  edition: SBLGNT
  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: te
  text: అయితే అన్నిటి అంతం సమీపించింది.[a] కాబట్టి ప్రార్థనల కొరకు స్వస్థబుద్ధితోను మెలకువగా ఉండండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దగ్గరగా ఉంది.’ గ్రీకు పరిపూర్ణ కాల క్రియను ‘సమీపించింది’ అని, లేదా ఇప్పుడు ఉన్న స్థితిని నొక్కిచెప్పుతూ ‘దగ్గరగా ఉంది’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘స్వీయనిగ్రహంతోను స్పష్టమైన మనస్సుతోను ఉండండి.’ ఈ రెండు ఆజ్ఞలు వివేకపూర్వకమైన తీర్పును, అప్రమత్తతను నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: అన్నిటి
  rationale: నపుంసక బహువచన షష్ఠీ రూపాన్ని తెలుగులో సహజంగా ‘అన్నిటి’ అని ఇచ్చి, τὸ τέλοςతో కలిసి ‘అన్నిటి అంతం’ అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సందర్భం నుంచి స్వల్ప మలుపును లేదా వ్యత్యాసాన్ని సూచించే δέను ఆధునిక తెలుగులో సహజమైన ‘అయితే’తో తెలిపాం.
- source_word: τὸ τέλος
  choice: అంతం
  rationale: ఈ అంత్యకాల సందర్భంలో τέλοςకు ‘అంతం’ నేరమైన, సహజమైన అర్థం; ‘లక్ష్యం’ లేదా ‘ఫలితం’ అనే అర్థాలను అనవసరంగా ముందుకు తేవదు.
- source_word: ἤγγικεν
  choice: సమీపించింది
  rationale: గ్రీకు పరిపూర్ణ కాలం సమీపానికి వచ్చి ఇప్పుడు దగ్గరగా ఉన్న స్థితిని సూచిస్తుంది. ‘సమీపించింది’ ఆ ప్రక్రియతో ఏర్పడిన ప్రస్తుత స్థితిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: σωφρονήσατε
  choice: వివేకంతో మిమ్మల్ని మీరు అదుపులో ఉంచుకొని
  rationale: ఈ ఆజ్ఞ స్థిరమైన తీర్పు, సంయమనం, ఆచరణాత్మక స్వీయనిగ్రహాన్ని సూచిస్తుంది. తెలుగు పదబంధం మానసిక వివేకాన్నీ ప్రవర్తనా అదుపునీ కలిపి వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి ప్రకటననుంచి వచ్చే నిర్ధారణను οὖν స్పష్టంగా సూచిస్తుంది; ‘కాబట్టి’ ఆ తార్కిక సంబంధాన్ని సహజంగా తెలుపుతుంది.
- source_word: νήψατε
  choice: మెలకువగా ఉండండి
  rationale: νήφω యొక్క మూలార్థం మత్తులేకపోవడం అయినా, ఇక్కడ అది రూపకాలంకారంగా ఆధ్యాత్మిక అప్రమత్తత, స్పష్టమైన మనస్సును సూచిస్తుంది. ‘మెలకువగా’ ఆ భావాన్ని మద్యపాన విరమణకే పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: εἰς προσευχάς
  choice: ప్రార్థనలు చేయడానికి
  rationale: εἰς ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది; προσευχάς బహువచనాన్ని ‘ప్రార్థనలు’గా నిలిపి, పదేపదే చేసే ప్రార్థనలను సూచించాం.
theological_decisions:
- issue: ‘అన్నిటి అంతం’ అనే మాటలోని అంత్యకాల భావం
  choice: వివరమైన కాలక్రమం లేదా అంత్యకాల వ్యవస్థను నిర్దేశించకుండా నేరమైన అంత్యకాల ప్రకటనగా నిలిపాం.
  alternative: దీనిని ‘అన్నిటి లక్ష్యం’గా లేదా భవిష్యత్ అంత్యకాల భావాన్ని తగ్గించే పూర్తిగా నెరవేరిన వాస్తవంగా అనువదించడం.
  rationale: వాక్యం ‘అన్నిటి అంతం’ సమీపించిందని ప్రకటించి, ఆ వాస్తవం ఆధారంగా ప్రార్థనకు తగిన జీవనాన్ని కోరుతుంది. అనువాదం ఏ ప్రత్యేక సహస్రాబ్ద లేదా సంఘసిద్ధాంత దృక్కోణాన్నీ చేర్చకుండా అసలు అత్యవసరతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘మెలకువగా’ అనే పదం νήφω యొక్క రూపకాలంకార అప్రమత్తతను సహజంగా తెలుపుతుంది; ‘ప్రార్థనలు’ అనే బహువచనం మూలంలోని రూపాన్ని నిలుపుతుంది.
