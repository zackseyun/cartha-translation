revisions:
- from: అయితే అన్నిటి అంతం సమీపించింది.[a] కాబట్టి ప్రార్థనలు చేయడానికి వివేకంతో మిమ్మల్ని మీరు అదుపులో ఉంచుకొని, మెలకువగా ఉండండి.[b]
  to: అయితే అన్నిటి అంతం సమీపించింది.[a] కాబట్టి ప్రార్థనల కొరకు స్వస్థబుద్ధితోను మెలకువగా ఉండండి.[b]
  rationale: The revision preserves the source's two coordinate imperatives, retains the plural ‘ప్రార్థనల,’ and expresses their purpose orientation without adding interpretation. Footnote b has been adjusted so that it remains a genuine lexical alternative to the revised main text.
