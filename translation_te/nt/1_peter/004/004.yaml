source:
  edition: SBLGNT
  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: te
  text: ఈ విషయంలో, మీరు వారితో కలిసి అదే విచ్చలవిడి జీవనపు వెల్లువలోకి పరుగెత్తకపోవడం చూసి వారు ఆశ్చర్యపోతున్నారు[a]; మిమ్మల్ని దూషిస్తున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారికి వింతగా అనిపిస్తోంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “మీపై అపవాదు వేస్తున్నారు” లేదా “మిమ్మల్ని దుర్భాషలాడుతున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: అది చూసి
  rationale: ఈ పదబంధం ముందున్న జీవనశైలి మార్పును సూచిస్తుంది. తెలుగులో సహజమైన సంబంధాన్ని చూపిస్తూ, కారణార్థాన్ని అతిగా బలపరచకుండా ‘అది చూసి’ అని అనువదించాం.
- source_word: ξενίζονται
  choice: ఆశ్చర్యపోతున్నారు
  rationale: వారికి ఇది వింతగా లేదా అపరిచితంగా అనిపించడాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: మీరు తమతో కలిసి పరుగెత్తకపోవడం
  rationale: συντρέχω లోని ‘కలిసి పరుగెత్తడం’ అనే రూపకాన్ని నిలుపుతూ, ఆ జీవనంలో భాగస్వాములు కాకపోవడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν αὐτὴν
  choice: వారు చేసే అదే ... లోకి
  rationale: εἰς సూచించే లోనికి కదలికను, αὐτήν సూచించే అదే విధమైన పూర్వ జీవనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τῆς ἀσωτίας
  choice: విచ్చలవిడి జీవితం
  rationale: ἀσωτία లోని నైతిక అదుపులేమి, వ్యర్థమైన అతి జీవనం అనే భావాలను సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: ἀνάχυσιν
  choice: వెల్లువ
  rationale: పొంగిపొర్లడం లేదా విస్తారంగా కుమ్మరించబడడం అనే మూల రూపకాన్ని సజీవంగా నిలుపుతుంది.
- source_word: βλασφημοῦντες
  choice: మిమ్మల్ని దూషిస్తున్నారు
  rationale: సందర్భంలో ఇది దేవునికి విరోధమైన దైవదూషణకన్నా విశ్వాసులపై దుర్భాషలాడడం లేదా అపవాదు వేయడాన్ని సూచిస్తుంది. ‘దూషిస్తున్నారు’ ఈ విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: βλασφημοῦντες లోని విరోధపూరిత మాటల లక్ష్యం
  choice: విశ్వాసులను దూషించడం
  alternative: దైవదూషణ చేయడం లేదా సాధారణంగా చెడుగా మాట్లాడడం
  rationale: సమీప సందర్భంలో అవిశ్వాసులు మారిన విశ్వాసుల ప్రవర్తనకు స్పందిస్తున్నారు; అందువల్ల వ్యక్తులపై దూషణ అనే భావం ప్రధానమైనది. అయినప్పటికీ ‘దూషించడం’ అపవాదు మరియు దుర్భాష రెండింటినీ అనుమతిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘పరుగెత్తడం’ మరియు ‘వెల్లువ’ అనే గ్రీకు రూపకాలను నిలుపుతూ, ‘విచ్చలవిడి జీవితం’ ద్వారా ἀσωτία భావాన్ని స్పష్టంచేశాం.
