id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: te
  text: 'ఎందుకంటే, ఈ కారణంగానే మృతులకు కూడా సువార్త ప్రకటించబడింది: వారు శరీరంలో మనుషుల ప్రకారం[a] తీర్పు పొందినప్పటికీ, ఆత్మలో[b] దేవుని ప్రకారం జీవించడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మానవ ప్రమాణాల ప్రకారం.’ గ్రీకులో ‘మనుషుల ప్రకారం’ అని ఉంది; ఇది ‘దేవుని ప్రకారం’ అనే మాటతో వ్యత్యాసంగా నిలుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆత్మ సంబంధంగా.’ ఈ మాట శరీర సంబంధమైన జీవన పరిధికి భిన్నమైన ఆత్మీయ జీవన పరిధిని సూచించవచ్చు; కొందరు దీన్ని మరింత నిర్దిష్టంగా పరిశుద్ధాత్మ ద్వారా కలిగే జీవంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ఈ ఉద్దేశంతోనే
  rationale: ముందున్న సందర్భానికి వివరణను ఇస్తూనే, తరువాతి ἵνα ఉద్దేశవాక్యంతో ఉన్న సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: νεκροῖς
  choice: మృతులకు
  rationale: దత్తివు బహువచన విశేషణం నామవాచకంగా వాడబడింది. వారు ఎవరో అనే వివాదాస్పద గుర్తింపును నిర్దిష్టం చేయకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: εὐηγγελίσθη
  choice: సువార్త ప్రకటించబడింది
  rationale: εὐαγγελίζω యొక్క కర్మణి రూపాన్ని, దానిలో అంతర్లీనంగా ఉన్న సువార్త ప్రకటన భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἵνα
  choice: జీవించాలనే ఉద్దేశంతో
  rationale: ఉద్దేశాన్ని సూచించే సంధానార్థాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: తీర్పు పొందినా ... జీవించాలనే
  rationale: μὲν...δὲ విరోధాన్ని తెలుగులో సహజంగా రాయడానికి అనుమతార్థక నిర్మాణం వాడబడింది; తీర్పు కర్మణి భావం నిలుపబడింది.
- source_word: κατὰ ἀνθρώπους
  choice: మనుషుల ప్రకారం
  rationale: κατά సూచించే ప్రమాణం లేదా దృక్కోణాన్ని, κατὰ θεὸνతో ఉద్దేశపూర్వక సమాంతరాన్ని సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: σαρκὶ
  choice: శరీరంలో
  rationale: ఇక్కడ σάρξ మానవుని శారీరక అస్తిత్వ పరిధిని సూచిస్తుంది; ‘పాప స్వభావం’ అనే భావాన్ని అనవసరంగా చేర్చకుండా πνεύματιతోని వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: κατὰ θεὸν
  choice: దేవుని ప్రకారం
  rationale: κατὰ ἀνθρώπουςతోని సమాంతర వ్యత్యాసాన్ని నిలిపి, దేవుని ప్రమాణమా, దృక్కోణమా అనే సూక్ష్మతను అనవసరంగా నిర్ణయించదు.
- source_word: πνεύματι
  choice: ఆత్మలో
  rationale: σαρκίకి సమాంతరమైన పరిధి భావాన్ని నిలుపుతుంది; ఇది పరిశుద్ధాత్మను స్పష్టంగా సూచిస్తుందని పాఠ్యం చెప్పనందున ఆ అర్థాన్ని ప్రధాన పాఠ్యంలో విధించదు.
theological_decisions:
- issue: ‘మృతులు’ ఎవరు?
  choice: ‘మృతులకు’ అని తటస్థంగా అనువదించబడింది.
  alternative: సువార్త విన్న తరువాత ఇప్పుడు శారీరకంగా మరణించినవారు; ఆత్మీయంగా మృతులైనవారు; లేదా 3:19లోని చెరలో ఉన్న ఆత్మలతో సంబంధమున్న మృతులు.
  rationale: గ్రీకు పాఠ్యం వారి గుర్తింపును ఇక్కడ స్పష్టంగా నిర్ధారించదు. అందువల్ల ఏదో ఒక సిద్ధాంతపరమైన వివరణను అనువాదంలో చేర్చకుండా అస్పష్టత నిలుపబడింది.
- issue: ‘శరీరంలో ... తీర్పు పొందినా, ఆత్మలో ... జీవించడం’ అనే వ్యత్యాసం
  choice: తీర్పు మరియు జీవం మధ్య ఉన్న మూలపాఠ్య విరోధ సమాంతరత యథాతథంగా నిలుపబడింది.
  alternative: మానవ తీర్పుచేత ఖండించబడటం; శారీరక మరణానికి లోనవడం; లేదా మానవ అస్తిత్వ పరిధిలో దేవుని తీర్పు పొందడం.
  rationale: ‘తీర్పు’ మానవ ఖండనను, భౌతిక మరణాన్ని, లేక దైవ తీర్పును సూచిస్తుందా అనే విషయాన్ని వాక్యం పూర్తిగా నిర్దిష్టం చేయదు. అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ‘మనుషుల ప్రకారం / దేవుని ప్రకారం’ మరియు ‘శరీరంలో / ఆత్మలో’ అనే సమాంతర వ్యత్యాసాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
