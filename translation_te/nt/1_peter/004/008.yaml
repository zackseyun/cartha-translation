  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: te
  text: అన్నిటికంటే ముఖ్యంగా, ఒకరిపట్ల ఒకరు ప్రగాఢమైన ప్రేమ కలిగి ఉండండి[a][c]. ఎందుకంటే ప్రేమ అనేక పాపాలను కప్పుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీవ్రమైన ప్రేమ.”
    reason: lexical_alternative
  - marker: b
    text: ఈ మాట సామెతలు 10:12ను ప్రతిధ్వనిస్తుంది. ఇక్కడ “కప్పుతుంది” అనే మాటకు అపరాధాలను రేపకుండా ఉండడం, వాటిని పట్టించుకోకుండా వదిలేయడం లేదా దాచడం అనే భావాలు కూడా ఉండవచ్చు.
    reason: cross_reference
  - marker: c
    text: లేదా, “ఒకరిపట్ల ఒకరు ప్రగాఢమైన ప్రేమ కలిగి ఉంటూ.”
    reason: previous_rendering
lexical_decisions:
- source_word: πρὸ πάντων
  choice: అన్నిటికంటే ముఖ్యంగా
  rationale: ఈ నుడికారం కాలక్రమాన్ని కాక ప్రాధాన్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా దాని బలాన్ని నిలిపింది.
- source_word: εἰς ἑαυτοὺς
  choice: ఒకరిపట్ల ఒకరు
  rationale: సంఘంలోని పరస్పర సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπηకి సందర్భానుకూలమైన సాధారణ తెలుగు సమానార్థకం.
- source_word: ἐκτενῆ
  choice: ప్రగాఢమైన
  rationale: చాచి కొనసాగించే శ్రద్ధ అనే మూలభావం నుంచి వచ్చే తీవ్రత, నిబద్ధతలను సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం భావోద్వేగ ఉత్సాహానికే పరిమితం చేయదు.
- source_word: ἔχοντες
  choice: కలిగి ఉండండి
  rationale: ఇది రూపరీత్యా వర్తమాన కృదంతమైనా, ముందున్న ఉపదేశ ప్రవాహాన్ని కొనసాగిస్తుంది. విడిగా ఉటంకించిన వచనంలో ఆ ఉపదేశ బలాన్ని స్పష్టంగా తెలియజేయడానికి క్రియారూపంగా అనువదించబడింది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: తదుపరి మాట ముందున్న ఉపదేశానికి కారణమని స్పష్టంగా సూచిస్తుంది.
- source_word: καλύπτει
  choice: కప్పుతుంది
  rationale: మూలంలోని రూపకాన్ని, సామెతలు 10:12 ప్రతిధ్వనిని నిలుపుతుంది; ‘క్షమిస్తుంది’ లేదా ‘పట్టించుకోదు’ అని భావాన్ని ముందుగానే నిర్ణయించదు.
- source_word: πλῆθος
  choice: అనేక
  rationale: పెద్ద సంఖ్య అనే భావాన్ని సహజమైన తెలుగు ప్రయోగంలో నిలుపుతుంది.
- source_word: ἁμαρτιῶν
  choice: పాపాలను
  rationale: మూలపదానికి నేరుగా సరిపోయే సందర్భోచిత అనువాదం.
theological_decisions:
- issue: ‘ప్రేమ అనేక పాపాలను కప్పుతుంది’ అనే మాట అర్థం
  choice: ‘కప్పుతుంది’ అనే రూపకాన్ని వ్యాఖ్యానించి పరిమితం చేయకుండా అలాగే ఉంచడం
  alternative: ‘ప్రేమ అనేక అపరాధాలను పట్టించుకోదు’ లేదా ‘ప్రేమ అనేక పాపాలకు క్షమాపణ కలిగిస్తుంది’
  rationale: గ్రీకు వాక్యం సామెతలా, పాత నిబంధన ప్రతిధ్వనితో ఉంది. పాపాలు ఎవరివో, ‘కప్పడం’ ఖచ్చితంగా ఏ ప్రక్రియను సూచిస్తుందో అది నిర్ణయించదు. అందువల్ల సిద్ధాంతపరంగా భారమైన ఒకే వివరణను అనువాదంలో చొప్పించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ప్రగాఢమైన’ తీవ్రతను తెలియజేస్తూ అతిగా మతపరమైన ప్రత్యేక పరిభాషను నివారిస్తుంది. వచనాన్ని విడిగా చదివినప్పుడు సహజంగా ఉండేందుకు కృదంతాన్ని ఉపదేశాత్మక క్రియగా ఇచ్చి, మరింత రూపసామ్యమైన ప్రత్యామ్నాయాన్ని [c]లో ఉంచాం.
