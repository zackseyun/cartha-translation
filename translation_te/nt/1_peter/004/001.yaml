id: 1PE.4.1
reference: 1 Peter 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: te
  text: కాబట్టి, క్రీస్తు[a] శరీరంలో బాధపడ్డాడు కాబట్టి, మీరు కూడా అదే మనోభావాన్ని ఆయుధంగా చేసుకొని సన్నద్ధం చేసుకోండి. ఎందుకంటే శరీరంలో బాధపడినవాడు పాపం నుండి విరమించాడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘క్రీస్తు’ (గ్రీకు Christos) అంటే ‘మెస్సీయ’ లేదా ‘అభిషిక్తుడు.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘శరీరంలో’ అనేది గ్రీకు sarxకు అనువాదం. ఇది శారీరక మానవ అస్తిత్వాన్ని సూచిస్తుంది; తప్పనిసరిగా ‘పాప స్వభావం’ అని కాదు.
    reason: lexical_alternative
  - marker: c
    text: ‘శరీరంలో బాధపడినవాడు పాపం నుండి విరమించాడు’ అనే మాట వివిధ రీతుల్లో అర్థం చేసుకోబడింది. ఇది ప్రత్యేకంగా క్రీస్తును, ఆయన నమూనాలో బాధపడే విశ్వాసులను, లేదా పాపంతో నిర్ణయాత్మకంగా తెగతెంపులు చేసుకోవడాన్ని తెలిపే సాధారణ సూత్రాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: క్రీస్తు
  rationale: తెలుగులో స్థిరపడిన గౌరవప్రదమైన బిరుదు రూపం; గ్రీకు Χριστόςకు ‘మెస్సీయ’ అనే అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుండి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: παθόντος
  choice: బాధ అనుభవించాడు గనుక
  rationale: అవరిస్ట్ పార్టిసిపిల్‌లోని కాల-కారణ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: σαρκὶ
  choice: శరీరంలో
  rationale: శారీరక మానవ అస్తిత్వాన్ని సూచించే σάρξ భావాన్ని సహజంగా అందిస్తుంది; ‘పాప స్వభావం’ అనే అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: ἔννοιαν
  choice: మనోభావం
  rationale: ఆలోచనా ధోరణి, వైఖరి, సంకల్పం అనే భావ పరిధిని ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁπλίσασθε
  choice: ఆయుధంగా ధరించుకోండి
  rationale: మధ్యమ ప్రయోగంలోని స్వీయసిద్ధతను, సైనిక రూపకాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు ఆధారమైన కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ὁ παθὼν
  choice: బాధ అనుభవించినవాడు
  rationale: నిర్దిష్ట వ్యక్తిని బలవంతంగా నిర్ణయించకుండా, గ్రీకు substantival participle యొక్క విస్తృత రూపాన్ని కాపాడుతుంది.
- source_word: πέπαυται
  choice: విరమించుకున్నాడు
  rationale: పాపంతో సంబంధం నిలిచిపోయి ఏర్పడిన ఫలితస్థితిని సూచించే perfect రూపానికి అనుగుణంగా ఉంది.
- source_word: ἁμαρτίας
  choice: పాపం నుండి
  rationale: παύω తరువాతి వియోగార్థక genitiveను చూపుతుంది; ఏకవచనం పాపాన్ని కార్యాల జాబితాగా కాక ఒక ఆచరణ లేదా అధికార పరిధిగా ఉంచుతుంది.
theological_decisions:
- issue: ‘శరీరంలో బాధ అనుభవించినవాడు పాపం నుండి విరమించుకున్నాడు’ అనే వాక్యంలో సూచించబడిన వ్యక్తి, వాక్య బలం
  choice: వాక్యాన్ని విస్తృతమైన, సంక్షిప్త రూపంలోనే ఉంచి సూచించబడిన వ్యక్తిని నిర్దిష్టంగా నిర్ణయించలేదు.
  alternative: ఇది ప్రత్యేకంగా క్రీస్తును సూచించవచ్చు; విశ్వాసులు ఆయన బాధల నమూనాలో పాలుపంచుకొని పాపంతో తెగతెంపులు చేసుకోవడాన్ని సూచించవచ్చు; లేదా బాధ పాపజీవితంతో నిర్ణయాత్మక విరామాన్ని సూచిస్తుందనే సాధారణ సూత్రం కావచ్చు.
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా ఉండి వ్యాఖ్యానపరంగా వివాదాస్పదం. అనువాదంలో అదనపు వివరణ చేర్చి theological tensionను పరిష్కరించకుండా, పాదటిప్పణిలో ప్రధాన అవకాశాలను తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఆయుధంగా ధరించుకోండి’ ద్వారా సైనిక రూపకాన్ని నిలిపి, వివాదాస్పద చివరి ఉపవాక్యంలోని ఉద్దేశపూర్వక అస్పష్టతను పరిష్కరించకుండా కాపాడాం.
