id: 1PE.4.19
reference: 1 Peter 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: te
  text: కాబట్టి, దేవుని చిత్తానికి అనుగుణంగా బాధపడేవారు కూడా మేలు చేస్తూ, నమ్మకమైన సృష్టికర్తకు తమ ప్రాణాలను[a] అప్పగించుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తమ ఆత్మలను,” లేదా “తమను తాము.” గ్రీకు పదం ప్రాణం, జీవితం, ఆత్మ లేదా వ్యక్తినే సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందున్న వాదన నుంచి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ πάσχοντες
  choice: బాధపడేవారు
  rationale: వర్తమాన కృదంతం సూచించే, బాధను అనుభవిస్తున్న ప్రజల వర్గాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: దేవుని చిత్తానికి అనుగుణంగా
  rationale: κατά పదంలోని అనుగుణత భావాన్ని నిలుపుతూ, ఆ బాధకు దేవుని చిత్తంతో ఉన్న సంబంధం అనుమతా, నిర్ణయమా అనే విషయాన్ని నిర్ధారించదు.
- source_word: πιστῷ κτίστῃ
  choice: నమ్మకమైన సృష్టికర్తకు
  rationale: πιστός లోని విశ్వసనీయతను ‘నమ్మకమైన’ తెలియజేస్తుంది; కర్తను స్వీకరించే దత్తివును ‘సృష్టికర్తకు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: παρατιθέσθωσαν
  choice: అప్పగించుకోవాలి
  rationale: మరొకరి భద్రపరచే సంరక్షణకు ఉంచడం అనే మధ్యమ ప్రయోగ భావాన్ని, మూడవ పురుష ఆజ్ఞను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: తమ ప్రాణాలను
  rationale: ψυχή ఇక్కడ ప్రాణం, జీవితం లేదా వ్యక్తి స్వరూపం అనే విస్తృత భావాన్ని కలిగి ఉండవచ్చు. ‘ప్రాణాలను’ సందర్భానికి సహజంగా ఉండి, కేవలం శరీరరహిత ఆత్మ అనే అర్థానికి పరిమితం చేయదు; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉన్నాయి.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: మేలు చేస్తూ
  rationale: అప్పగించుకోవడం మేలు చేసే నిరంతర ప్రవర్తనతో కూడి ఉండాలని తెలిపే సహచర్య లేదా విధాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బాధకు దేవుని చిత్తంతో ఉన్న సంబంధం
  choice: దేవుని చిత్తానికి అనుగుణంగా
  alternative: దేవుని చిత్తం వల్ల
  rationale: మూలంలోని κατά అనుగుణతను చెబుతుంది గాని, దేవుడు బాధను అనుమతించాడా, నిర్ణయించాడా, మరే విధంగా సంకల్పించాడా అనేది వివరించదు. అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: ψυχή యొక్క సందర్భార్థం
  choice: ప్రాణాలు
  alternative: ఆత్మలు; తమను తాము
  rationale: ‘ప్రాణాలు’ జీవితం లేదా వ్యక్తి అనే విస్తృత సందర్భార్థాన్ని సహజ తెలుగులో మోస్తుంది. మూలపదానికి సాధ్యమైన ఇతర భావాలను పాదసూచికలో ఉంచడం ద్వారా అర్థాన్ని అనవసరంగా సంకుచితం చేయలేదు.
- issue: πιστός యొక్క భావం
  choice: నమ్మకమైన
  alternative: విశ్వసనీయమైన
  rationale: దేవుడు తమను భద్రంగా కాపాడతాడనే ఆధారపడదగిన స్వభావాన్ని వ్యక్తం చేస్తుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘అప్పగించుకోవాలి’ ఆజ్ఞను కఠిన ఆదేశంలా కాక బాధలో విశ్వాసపూర్వక చర్యగా సహజంగా వినిపిస్తుంది; ‘మేలు చేస్తూ’ ἐν ἀγαθοποιΐᾳ యొక్క సహచర్య భావాన్ని సులభంగా అందిస్తుంది.
