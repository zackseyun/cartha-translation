id: 1PE.4.14
reference: 1 Peter 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: te
  text: మెస్సీయ[a] పేరున మీరు నిందించబడితే, మీరు ధన్యులు; ఎందుకంటే మహిమకును దేవునికిని చెందిన ఆత్మ[b] మీపై నిలిచి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘క్రీస్తు’; Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని మహిమాన్విత ఆత్మ’; మరో విధంగా, ‘మహిమకు చెందిన ఆత్మ, అంటే దేవుని ఆత్మ.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: మీరు నిందించబడితే
  rationale: వర్తమానకాల కర్మణి రూపం మాటల ద్వారా నిందకు, అవమానానికి గురికావడాన్ని సూచిస్తుంది. ‘నిందించబడితే’ ఆధునిక తెలుగులో సహజంగా ఉండి సామాజిక అవమాన భావాన్ని నిలుపుతుంది.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: మెస్సీయ పేరు కారణంగా
  rationale: ఇక్కడ ἐν ὀνόματι అనేది ఆ పేరుతో ఉన్న అనుబంధం వల్ల లేదా ఆ వ్యక్తిత్వం కారణంగా అని సూచిస్తుంది. తెలుగులో ‘పేరు కారణంగా’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ కేవలం వ్యక్తినామంలా కాక అభిషిక్తుని బిరుదుగా పనిచేస్తుంది; అందువల్ల బిరుదు భావాన్ని చూపే ‘మెస్సీయ’ ఎంచుకోబడింది.
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: ‘ధన్యులు’ అనేది దైవ అనుగ్రహం మరియు శుభస్థితిని సూచించే గంభీరమైన, బైబిలు సందర్భానికి తగిన పదం; కేవలం భావోద్వేగ సంతోషంగా పరిమితం చేయదు.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: మహిమయొక్క, దేవునియొక్క ఆత్మ
  rationale: రెండు సంబంధవాచక పదబంధాలను ఒకే ‘ఆత్మ’తో కలిపి, అవి సమన్వయ విశేషణాలా లేక రెండవది మొదటిదాన్ని వివరిస్తుందా అనే గ్రీకు వాక్యంలోని సంక్షిప్తతను పూర్తిగా పరిష్కరించకుండా నిలుపుతుంది.
- source_word: δόξης
  choice: మహిమ
  rationale: దైవ సన్నిధి, ఘనత అనే బైబిలు భావాలను సహజంగా మోసే స్థిరమైన తెలుగు పదం.
- source_word: ἀναπαύεται
  choice: మీ మీద నిలిచి ఉంది
  rationale: క్రియలోని దిగివచ్చి విశ్రమించడం లేదా స్థిరంగా ఉండడం అనే భావాన్ని తెలుగులో అపార్థం కలిగించే ‘విశ్రమిస్తోంది’ కంటే సహజంగా వ్యక్తం చేస్తుంది; ఆత్మ ఒకరి మీద నిలిచే యెషయా సంబంధిత ప్రతిధ్వనినీ కాపాడుతుంది.
theological_decisions:
- issue: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα అనే పదబంధాన్ని ఎలా అర్థం చేసుకోవాలి
  choice: ‘మహిమయొక్క, దేవునియొక్క ఆత్మ’ అని పారదర్శకంగా అనువదించడం
  alternative: ‘దేవుని మహిమాన్విత ఆత్మ’ లేదా ‘మహిమయొక్క ఆత్మ, అంటే దేవుని ఆత్మ’
  rationale: గ్రీకు నిర్మాణం రెండు సంబంధవాచకాలను సమన్వయంగా గ్రహించడానికీ, రెండవదాన్ని వివరణాత్మక సమానార్థకంగా గ్రహించడానికీ వీలు ఇస్తుంది. ప్రధాన పాఠం ఈ వేదాంతపరమైన ఉద్రిక్తతను ఒకే వివరణగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘పేరు కారణంగా’ సాధారణ పాఠకులకు సహజంగా ఉండేలా కారణార్థాన్ని తెలియజేస్తుంది. ఆత్మను సూచించే క్రియలో లింగాన్ని అనవసరంగా నిర్దేశించకుండా ‘నిలిచి ఉంది’ వాడబడింది.
