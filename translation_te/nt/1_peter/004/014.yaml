revisions:
- from: మెస్సీయ[a] పేరు కారణంగా మీరు నిందించబడితే, మీరు ధన్యులు. ఎందుకంటే మహిమయొక్క, దేవునియొక్క ఆత్మ[b] మీ మీద నిలిచి ఉంది.
  to: మెస్సీయ[a] పేరున మీరు నిందించబడితే, మీరు ధన్యులు; ఎందుకంటే మహిమకును దేవునికిని చెందిన ఆత్మ[b] మీపై నిలిచి ఉంది.
  rationale: The revision makes the Telugu idiomatic and preserves the source’s semantic range. ‘పేరున’ retains the name/association formulation of ἐν ὀνόματι, and ‘మహిమకును దేవునికిని చెందిన ఆత్మ’ represents both genitives without resolving their debated syntactic relationship. Footnote b is adjusted to correspond naturally to the revised main wording and continues to disclose the principal alternatives.
