  edition: SBLGNT
  text: οἳ ἀποδώσουσιν λόγον τῷ ἑτοίμως ⸂ἔχοντι κρῖναι⸃ ζῶντας καὶ νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: te
  text: వారు జీవించి ఉన్నవారికీ మరణించినవారికీ తీర్పు తీర్చడానికి సిద్ధంగా ఉన్నవానికి లెక్క ఇస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తీర్పు తీర్చడానికి సంసిద్ధత కలిగినవానికి.’ గ్రీకు వ్యక్తీకరణ అక్షరార్థంగా తీర్పు తీర్చే సంసిద్ధత కలిగినవానిని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: వారు
  rationale: ఈ సంబంధ సర్వనామం ముందటి వచనంలో ప్రస్తావించినవారిని సూచిస్తుంది. స్వతంత్ర వాక్యారంభంలో ‘వారు’ సహజంగా ఉండి, సూచితులను స్పష్టంగా కొనసాగిస్తుంది.
- source_word: ἀποδώσουσιν λόγον
  choice: లెక్క అప్పగిస్తారు
  rationale: ఈ గ్రీకు నుడికారం న్యాయవిచారణ సందర్భంలో ఒకరు తమ ప్రవర్తనకు జవాబు లేదా లెక్క ఇవ్వడాన్ని సూచిస్తుంది. ‘లెక్క అప్పగిస్తారు’ ఆ బాధ్యతా భావాన్నీ న్యాయపరమైన ఛాయనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῷ
  choice: ఉన్నవానికి
  rationale: నిర్దేశక పదంతో కూడిన కృదంతం వ్యక్తిని సూచించే నామవాచక రూపంలో ఉంది. తెలుగులో తరువాతి వివరణతో కలిపిన ‘ఉన్నవానికి’ మూలంలోని అనిర్దిష్ట గుర్తింపును కాపాడుతుంది.
- source_word: ἑτοίμως
  choice: సిద్ధంగా
  rationale: ఈ క్రియావిశేషణం సంసిద్ధతను లేదా వెంటనే చేయగల స్థితిని తెలియజేస్తుంది. ‘సిద్ధంగా’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానం.
- source_word: ἔχοντι κρῖναι
  choice: తీర్పు తీర్చడానికి సిద్ధంగా ఉన్నవానికి
  rationale: అక్షరార్థంగా ఇది తీర్పు తీర్చే సంసిద్ధత కలిగి ఉండడాన్ని వర్ణిస్తుంది. ఈ అనువాదం ఆ ప్రస్తుత సంసిద్ధ స్థితిని తెలియజేస్తూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: ζῶντας καὶ νεκρούς
  choice: సజీవులకూ మృతులకూ
  rationale: ఈ జత జీవించి ఉన్నవారినీ మరణించినవారినీ సమగ్రంగా సూచిస్తుంది. ‘సజీవులు, మృతులు’ సంక్షిప్తంగా, గంభీరంగా, సాంప్రదాయబద్ధంగా అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సజీవులకూ మృతులకూ తీర్పు తీర్చడానికి సిద్ధంగా ఉన్నవాని గుర్తింపు
  choice: ముఖ్య పాఠ్యంలో దేవుడు లేదా క్రీస్తు అని పేరుపెట్టకుండా ‘ఉన్నవానికి’ అని ఉంచడం
  alternative: దేవునికి; క్రీస్తుకు
  rationale: ఈ వచనంలోని గ్రీకు పాఠ్యం తీర్పరి పేరును ప్రత్యక్షంగా చెప్పదు. నూతన నిబంధనలోని ఇతర సందర్భాలు దేవుణ్ణీ క్రీస్తునూ తీర్పుతో అనుసంధానించినా, ఇక్కడ మూలపాఠ్యంలో ఉన్న భావ ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. న్యాయవిచారణ ఛాయను ‘లెక్క అప్పగిస్తారు,’ ‘తీర్పు తీర్చడానికి’ అనే పదబంధాలు నిలుపుతాయి; తీర్పరి గుర్తింపును మూలపాఠ్యానికి మించి నిర్దిష్టం చేయలేదు.
