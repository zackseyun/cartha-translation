id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: te
  text: ప్రియులారా, మిమ్మల్ని పరీక్షించడానికి మీ మధ్య జరుగుతున్న అగ్ని వంటి శ్రమవిషయంలో, మీకు ఏదో అపరిచితమైనది సంభవిస్తున్నట్లుగా ఆశ్చర్యపడకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని పరీక్షించడానికి మీ మధ్య జరుగుతున్న అగ్నిమయమైన శ్రమ.” గ్రీకు పదం πυρώσει అక్షరార్థంగా మండడం లేదా అగ్ని అనే ప్రతిమను సూచిస్తుంది; πειρασμός అనే పదానికి సందర్భాన్ని బట్టి పరీక్ష, శ్రమ, లేదా ప్రలోభం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయతతో కూడిన బహువచన సంబోధనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μὴ ξενίζεσθε
  choice: ఆశ్చర్యపడకండి
  rationale: ఏదో అపరిచితమైనది లేదా ఊహించనిది జరిగినట్లు భావించవద్దనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῇ ... πυρώσει
  choice: అగ్నివంటి శ్రమను
  rationale: πύρωσις లోని మండడం/అగ్ని ప్రతిమను నిలుపుతూ, ఇక్కడ సూచించబడిన తీవ్రమైన శ్రమను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: సమూహాన్ని ఉద్దేశించిన సందర్భంలో సంఘం మధ్య జరుగుతున్న అనుభవాన్ని సూచిస్తుంది; వ్యక్తిగత అనుభవాన్ని నిరాకరించదు.
- source_word: πρὸς πειρασμὸν ὑμῖν
  choice: మిమ్మల్ని పరీక్షించడానికి
  rationale: శ్రమ ద్వారా పరీక్షింపబడటం అనే సందర్భోచిత భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: γινομένῃ
  choice: జరుగుతున్న
  rationale: కొనసాగుతున్న సంఘటనను సూచించే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- source_word: ὡς ξένου ... συμβαίνοντος
  choice: మీకు ఏదో వింత జరుగుతున్నట్టుగా
  rationale: ξενίζεσθε మరియు ξένου మధ్యనున్న 'వింత/అపరిచితం' భావసంబంధాన్ని తెలుగులో సాధ్యమైనంత సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: πειρασμός యొక్క సందర్భార్థం
  choice: పరీక్ష
  alternative: శోధన; ప్రలోభం
  rationale: ఈ సందర్భం పాపానికి ప్రలోభపరచడం గురించి కాక, బాధల ద్వారా విశ్వాసం పరీక్షింపబడటం గురించి మాట్లాడుతోంది. అయినా మూలపదానికి ఉన్న విస్తృత అర్థపరిధిని పాదటీపులో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంఘంలో బహిరంగ పఠనానికి తగిన గౌరవప్రదమైన, సులభగ్రాహ్యమైన శైలి. అగ్ని రూపకాన్ని నిలుపుతూ అతిగా వ్యాఖ్యానాత్మకమైన ‘శుద్ధిచేసే అగ్ని’ వంటి పదబంధాన్ని నివారించాం.
