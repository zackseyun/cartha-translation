- from: “నీతిమంతుడే కష్టంతో రక్షించబడితే,[a] భక్తిహీనుడు, పాపి ఎక్కడ కనిపిస్తారు?”[b]
  to: “నీతిమంతుడు కష్టంతో రక్షించబడితే,[a] భక్తిహీనుడూ పాపీ ఎక్కడ కనిపిస్తాడు?”[b]
