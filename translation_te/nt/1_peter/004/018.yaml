id: 1PE.4.18
reference: 1 Peter 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: te
  text: “నీతిమంతుడు కష్టంతో రక్షించబడితే,[a] భక్తిహీనుడూ పాపీ ఎక్కడ కనిపిస్తాడు?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతి కష్టంగా రక్షించబడితే” లేదా “కేవలం కష్టంగా రక్షించబడితే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భక్తిహీనుడూ పాపీ ఎక్కడ దొరుకుతాడు?”
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: నీతిమంతుడు
  rationale: వ్యాసంతో కూడిన ఏకవచన విశేషణం నామవాచకంగా, ప్రతినిధి ఏకవచన భావంలో ఉంది. ‘నీతిమంతుడు’ ఆ రూపాన్ని, సామెతసదృశమైన సంక్షిప్తతను నిలుపుతుంది.
- source_word: μόλις
  choice: కష్టంతో
  rationale: ఇది కష్టం లేదా అతి కొద్దిలో జరిగే స్థితిని సూచించగలదు. సందర్భం శ్రమల మధ్య రక్షణను ప్రస్తావిస్తున్నందున ‘కష్టంతో’ సహజంగా ఉండి, రక్షణ ఫలితం అనిశ్చితమనే భావాన్ని అనవసరంగా చొప్పించదు.
- source_word: σῴζεται
  choice: రక్షించబడితే
  rationale: వర్తమాన కర్మణి/మధ్యమ రూపాన్ని ఈ సామెతసదృశ షరతు వాక్యంలో సహజమైన తెలుగు కర్మణి రూపంతో అందించింది.
- source_word: ἀσεβής
  choice: భక్తిహీనుడు
  rationale: దేవునిపట్ల భక్తి లేదా గౌరవం లేని వ్యక్తిని సూచించే మతనైతిక భావాన్ని నిలుపుతుంది.
- source_word: ἁμαρτωλός
  choice: పాపి
  rationale: సాధారణంగా అర్థమయ్యే ఖచ్చితమైన పదం; ἀσεβής‌తో కలపకుండా గ్రీకు మూలంలోని రెండు వేరు వర్ణనలను నిలుపుతుంది.
- source_word: ποῦ
  choice: ఎక్కడ
  rationale: ప్రశ్నార్థక క్రియావిశేషణానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: φανεῖται
  choice: కనిపిస్తారు
  rationale: ‘కనిపించు/ప్రత్యక్షమగు’ అనే మూల భావాన్ని నిలుపుతుంది. సమీపంలోని రెండు వ్యక్తి-వర్ణనలను తెలుగులో సహజంగా సమూహంగా తీసుకొని బహువచన క్రియ వాడబడింది.
theological_decisions:
- issue: μόλις σῴζεται యొక్క భావం
  choice: నీతిమంతుని రక్షణ శ్రమలు, తీర్పు మధ్య కష్టంతో సాగుతుందని తెలిపేలా ‘కష్టంతో రక్షించబడితే’ అని అనువదించడం.
  alternative: ‘అతి కష్టంగా రక్షించబడితే’ లేదా ‘బొటాబొటిగా రక్షించబడితే,’ తద్వారా తుది రక్షణ అనిశ్చితమనే భావం కలగవచ్చు.
  rationale: తక్షణ సందర్భం బాధలు, దేవుని ఇంటివద్ద ప్రారంభమయ్యే తీర్పు, సహనం గురించి ఉంది. మూలంలోని ఉద్వేగాన్ని నిలుపుతూ, తుది రక్షణ అనిశ్చితమని నిర్ణయించకుండా అనువదించబడింది.
- issue: ప్రతినిధి పుంలింగ ఏకవచనం
  choice: δίκαιος‌ను ‘నీతిమంతుడు’ అనే ఏకవచన రూపంలో ఉంచడం.
  alternative: ‘నీతిమంతులు’ లేదా ‘నీతిగా జీవించే వ్యక్తి.’
  rationale: గ్రీకు రూపం పుంలింగ ఏకవచనంలో ప్రతినిధి భావంతో ఉంది; సామెతసదృశమైన సంక్షిప్త శైలిని తెలుగు రూపం కాపాడుతుంది.
- issue: ἀσεβής καὶ ἁμαρτωλός మధ్య సంబంధం
  choice: ‘భక్తిహీనుడు, పాపి’ అని రెండు వేరు వ్యక్తి-వర్ణనలుగా ఉంచడం.
  alternative: ‘భక్తిహీన పాపి’ అని ఒకే వ్యక్తికి చెందిన సంయుక్త వర్ణనగా కుదించడం.
  rationale: మూలంలోని సముచ్చయాన్ని, రెండు పదాల వేర్వేరు నైతిక-మతపరమైన భావాలను అనవసరంగా విలీనం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన సామెతసదృశ ప్రశ్నా శైలిని నిలుపుతూ రూపొందించబడింది. ‘నీతిమంతుడు,’ ‘భక్తిహీనుడు,’ ‘పాపి’ వంటి సుపరిచిత బైబిలీయ పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
