review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the main lexical components, but «నీతిమంతుడే» adds emphatic force not present in ὁ δίκαιος, and the plural verb «కనిపిస్తారు» does not reflect the singular φανεῖται. The revision preserves the Greek representative singular and rhetorical question.
  naturalness: The revised wording is idiomatic modern standard Telugu while retaining the compact, proverbial register. Singular coordination in «భక్తిహీనుడూ పాపీ ... కనిపిస్తాడు» naturally represents the Greek paired singular descriptors.
  terminology: «నీతిమంతుడు», «భక్తిహీనుడు», «పాపి», and «రక్షించబడితే» are appropriate established biblical terms. The lexical note is adjusted to present alternatives without resolving the verse's theological implication beyond what the wording itself states.
  issues:
  - severity: medium
    issue: «నీతిమంతుడే» contains the emphatic particle «-ఏ».
    rationale: The Greek article ὁ marks the substantival adjective; it does not supply an emphatic ‘indeed/the very’ sense. «నీతిమంతుడు» is the accurate representative singular.
  - severity: medium
    issue: «భక్తిహీనుడు, పాపి ఎక్కడ కనిపిస్తారు?» uses a plural verb.
    rationale: φανεῖται is singular. The two coordinated Greek singular descriptors should be represented with a singular generic verb in Telugu.
  - severity: low
    issue: Footnote a states categorically that salvation is not uncertain.
    rationale: μόλις directly expresses difficulty/scarcity; the extent of any theological inference should not be settled by a lexical footnote. A neutral note better preserves the source wording's tension.
  - severity: low
    issue: Footnote b has a plural verb.
    rationale: The alternative should likewise retain the singular form corresponding to φανεῖται.
  revised_text: “నీతిమంతుడు కష్టంతో రక్షించబడితే,[a] భక్తిహీనుడూ పాపీ ఎక్కడ కనిపిస్తాడు?”[b]
