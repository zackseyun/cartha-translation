id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: te
  text: ఎందుకంటే, మీరు సిగ్గుమాలిన భోగచేష్టల్లో[a], దురాశల్లో, మితిమీరిన మద్యపానాల్లో[b], అల్లరి విందుల్లో, మద్యపాన కూడికల్లో, నిషిద్ధమైన విగ్రహారాధనల్లో[c] నడుచుకొని, అన్యజనుల సంకల్పాన్ని నెరవేర్చడానికి గడిపిన గతకాలమే చాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్వేచ్ఛాచారాల్లో’; ఇక్కడి గ్రీకు పదం సిగ్గులేని, మితిమీరిన ఇంద్రియాసక్తి లేదా స్వేచ్ఛాచారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మద్యమత్తుల్లో’; గ్రీకు బహువచనం పదేపదే జరిగే అతిమద్యపాన ఘట్టాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ధర్మవిరుద్ధమైన విగ్రహారాధనల్లో’; మూలపదానికి ‘అనుమతించబడని, నియమవిరుద్ధమైన’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: ఎందుకంటే ... నడుచుకున్న గతకాలమే చాలు
  rationale: ἀρκετός యొక్క ‘చాలు/సరిపోతుంది’ అనే భావాన్ని సహజమైన తెలుగులో ఉంచి, γάρ‌ను వివరణాత్మకమైన ‘ఎందుకంటే’గా అనువదించింది. గడిచిపోయిన కాలం ఇక చాలన్న వాక్యబలాన్ని నిలుపుతుంది.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: అన్యజనుల సంకల్పాన్ని
  rationale: βούλημα అనేది సంకల్పం, ఉద్దేశం లేదా ఇష్టాన్ని సూచిస్తుంది. ఈ సందర్భంలో ἐθνῶν భౌగోళిక ‘దేశాలు’ కంటే యూదేతర ప్రజలను సూచిస్తున్నందున ‘అన్యజనులు’ ఎంచుకుంది.
- source_word: κατειργάσθαι
  choice: నెరవేర్చుతూ
  rationale: క్రియలోని కార్యసాధన భావాన్ని ‘నెరవేర్చు’ తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో తరువాతి πεπορευμένους‌తో సహజంగా అనుసంధానించడానికి అసమాపక రూపం వాడింది; మొత్తం వాక్యం ఆ కార్యం గతకాలంలో జరిగిందని స్పష్టం చేస్తుంది.
- source_word: πεπορευμένους
  choice: నడుచుకున్న
  rationale: πορεύομαι యొక్క నైతిక జీవనవిధాన రూపకాన్ని ‘నడుచుకొను’ నిలుపుతుంది; ఇది కేవలం ప్రయాణాన్ని కాక జీవించిన తీరును సూచిస్తుంది.
- source_word: ἐν ἀσελγείαις
  choice: సిగ్గుమాలిన భోగచేష్టల్లో
  rationale: ἀσέλγεια సిగ్గులేని స్వేచ్ఛాచారాన్ని, ముఖ్యంగా ఇంద్రియ లేదా లైంగిక మితిమీరుదలను సూచిస్తుంది. బహువచనంలోని పునరావృత క్రియల భావాన్ని ‘చేష్టల్లో’ నిలుపుతుంది.
- source_word: ἐπιθυμίαις
  choice: దురాశల్లో
  rationale: ἐπιθυμία స్వతహాగా తటస్థంగా ఉండగలిగినా, ఈ దోషాల జాబితాలో చెడ్డ, అదుపులేని కోరికలను సూచిస్తుంది. ‘దురాశలు’ ఆ ప్రతికూల భావాన్ని సంక్షిప్తంగా ఇస్తుంది.
- source_word: οἰνοφλυγίαις
  choice: మద్యమత్తుల్లో
  rationale: ఈ అరుదైన పదం అతిగా మద్యం సేవించడం వల్ల కలిగే మత్తు లేదా మద్యపాన మితిమీరుదలను సూచిస్తుంది. బహువచన రూపం పునరావృత సందర్భాలను సూచించగలదని తెలుగు బహువచనంతో నిలిపింది.
- source_word: κώμοις
  choice: అల్లరి విందుల్లో
  rationale: κῶμος మద్యపానం మరియు అదుపులేని ప్రవర్తనతో కూడిన ఉల్లాస విందులను సూచిస్తుంది. ‘అల్లరి విందులు’ ఆధునిక పాఠకునికి ఆ సామాజిక, నైతిక భావాన్ని అందిస్తుంది.
- source_word: πότοις
  choice: మద్యపాన కూడికల్లో
  rationale: πότος మద్యం సేవించడానికి జరిగే సమావేశం లేదా మద్యపాన ఘట్టాన్ని సూచిస్తుంది. ముందున్న κώμοις‌తో భేదం కనిపించేలా ‘మద్యపాన కూడికలు’ వాడింది.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: నిషిద్ధమైన విగ్రహారాధనల్లో
  rationale: ἀθέμιτος అనుమతించబడని, ధర్మవిరుద్ధమైన అనే భావాన్ని ఇస్తుంది. ‘నిషిద్ధమైన’ దాని నైతిక-నియమాత్మక బలాన్ని అతిశయోక్తి లేకుండా నిలుపుతుంది; బహువచనం వివిధ విగ్రహారాధనా ఆచారాలను సూచిస్తుంది.
theological_decisions:
- issue: ἐθνῶν యొక్క సందర్భార్థం
  choice: అన్యజనులు
  alternative: జనాలు; దేవుణ్ణి ఎరుగని ప్రజలు
  rationale: పేతురు ఇక్కడ పాఠకుల పూర్వ జీవనాన్ని యూదేతర సమాజంలో ప్రబలంగా ఉన్న జీవనరీతితో పోలుస్తున్నాడు. ‘అన్యజనులు’ సాంప్రదాయ బైబిలు సందర్భార్థాన్ని నిలుపుతుంది; ‘దేవుణ్ణి ఎరుగని ప్రజలు’ అనేది మరింత వ్యాఖ్యానాత్మకం.
- issue: ἀθεμίτοις εἰδωλολατρίαις యొక్క నైతిక బలం
  choice: నిషిద్ధమైన విగ్రహారాధనలు
  alternative: హేయమైన విగ్రహారాధనలు; ధర్మవిరుద్ధమైన విగ్రహారాధనలు
  rationale: మూలపదం కేవలం భావోద్వేగపూర్వక అసహ్యాన్ని కాక, అనుమతించబడని లేదా స్థిరమైన నియమానికి విరుద్ధమైన స్వభావాన్ని తెలియజేస్తుంది. అందువల్ల ‘నిషిద్ధమైన’ను ప్రధాన పాఠంలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. మూలంలోని నైతిక జీవన ‘నడక’ రూపకాన్ని, దోషాల బహువచన జాబితాను సాధ్యమైనంతవరకు నిలిపి, తెలుగులో అసహజమైన నామరూపాలను నివారించింది.
