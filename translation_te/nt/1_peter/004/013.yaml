id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: te
  text: అయితే, మీరు మెస్సీయ[a] బాధలలో ఎంత మేరకు పాలుపంచుకుంటున్నారో, అంత మేరకు సంతోషించండి. తద్వారా ఆయన మహిమ ప్రత్యక్షమైనప్పుడు[b] మీరు కూడా ఉల్లాసంతో సంతోషించేలా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు Χριστός ఒక బిరుదు; దాని అర్థం “మెస్సీయ,” అంటే “అభిషిక్తుడు.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయన మహిమ వెల్లడి అయినప్పుడు”; అక్షరార్థంగా, “ఆయన మహిమ వెల్లడి సమయంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὸ
  choice: ఎంతవరకు… అంతవరకు
  rationale: సాధారణ ‘వలె’ అనే పోలికకన్నా, మూలంలోని పరిమాణానుపాత భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: κοινωνεῖτε
  choice: పాలుపంచుకుంటున్నారో
  rationale: బాధలను కేవలం సానుభూతితో చూడడం కాకుండా వాటిలో భాగస్వాములు కావడమనే κοινωνέω భావాన్ని అందిస్తుంది.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: మెస్సీయ బాధల్లో
  rationale: గ్రీకు షష్ఠీవిభక్తి సంబంధాన్ని సంక్షిప్తమైన సహజ తెలుగు స్వామ్య నిర్మాణంతో చూపిస్తూ, ఆ బాధల్లో భాగస్వామ్యమనే భావాన్ని తెరిచి ఉంచుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసు మెస్సీయ పదవిని సూచించే బిరుదుగా పనిచేస్తుంది; అందువల్ల బిరుదు అర్థాన్ని అనువదించాం.
- source_word: χαίρετε
  choice: సంతోషించండి
  rationale: ఆనందించమనే ఆజ్ఞను సాధారణ ఆధునిక తెలుగులో తెలియజేస్తూ, తరువాతి χαρῆτεతో పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: ప్రస్తుత సంతోషానికి భవిష్యత్తులోని సంతోషంతో ఉన్న ఉద్దేశ్య/ఫలిత సంబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποκαλύψει
  choice: బయలుపడినప్పుడు
  rationale: దాచబడి ఉన్న మహిమ ప్రత్యక్షమవడమనే ‘వెల్లడి’ భావాన్ని సహజమైన తెలుగు కాలవాచక నిర్మాణంలో అందిస్తుంది.
- source_word: δόξης αὐτοῦ
  choice: ఆయన మహిమ
  rationale: మూలంలోని స్వామ్య సంబంధాన్ని నేరుగా, స్పష్టంగా నిలుపుతుంది.
- source_word: χαρῆτε
  choice: మీరు కూడా… సంతోషిస్తారు
  rationale: χαίρετεతో ఉన్న పద సంబంధాన్ని నిలుపుతూ, καίని ‘కూడా’గా చూపి ప్రస్తుత ఆనందాన్ని భవిష్యత్తు ఆనందంతో కలుపుతుంది.
- source_word: ἀγαλλιώμενοι
  choice: ఉప్పొంగే ఆనందంతో
  rationale: సాధారణ సంతోషంకన్నా తీవ్రమైన, ఉత్సాహభరితమైన ఆనందాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం బిరుదుగా పనిచేస్తున్నందున దాని మెస్సీయ సంబంధిత అర్థాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; పాఠకులకు సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: మెస్సీయ బాధల్లో భాగస్వామ్యం స్వభావం
  choice: మెస్సీయ బాధల్లో… పాలుపంచుకోవడం
  alternative: మెస్సీయ కొరకు బాధలు అనుభవించడం
  rationale: ఈ మాట విశ్వాసులు మెస్సీయ బాధల్లో భాగస్వాములు కావడాన్ని చెబుతుంది; అది ఆయన ప్రాయశ్చిత్త బాధల పునరావృతమా, లేక ఆయనతో ఏకత్వం వల్ల కలిగే బాధలా అనే విషయాన్ని అనువాదం సిద్ధాంతపరంగా నిర్ణయించదు.
- issue: ἵνα వాక్యభాగంలోని ఉద్దేశ్యం మరియు ఫలితం
  choice: తద్వారా… సంతోషిస్తారు
  alternative: …సంతోషించడానికి
  rationale: గ్రీకు నిర్మాణంలో ఉద్దేశ్యం మరియు ఆశించిన ఫలితం రెండూ వినిపించగలవు. తెలుగు వాక్యం ఆ సంబంధాన్ని సహజంగా చూపుతుంది, కానీ దానిని కఠినమైన కారణ-ఫలిత సూత్రంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఎంతవరకు… అంతవరకు’ నిర్మాణం మూలంలోని అనుపాత భావాన్ని నిలుపుతుంది. ‘ఉప్పొంగే ఆనందంతో’ చివరి రెండు ఆనందపదాల మధ్య తీవ్రత వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
