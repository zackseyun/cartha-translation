revisions:
- from: అయితే, మీరు మెస్సీయ[a] బాధల్లో ఎంతవరకు పాలుపంచుకుంటున్నారో అంతవరకు సంతోషించండి. తద్వారా ఆయన మహిమ బయలుపడినప్పుడు[b] మీరు కూడా ఉప్పొంగే ఆనందంతో సంతోషిస్తారు.
