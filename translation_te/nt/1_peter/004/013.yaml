review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the proportional force of καθὸ, participation in the Messiah's sufferings, and the intensified final joy. However, “మీరు కూడా ... సంతోషిస్తారు” is a straightforward future indicative and weakens the ἵνα-purpose/anticipated-result clause with χαρῆτε (subjunctive).
  naturalness: The Telugu is generally clear and modern. “ఉప్పొంగే ఆనందంతో సంతోషిస్తారు” is understandable, but “ఉల్లాసంతో సంతోషించేలా” is more idiomatic in a purpose construction and retains the distinction between χαρῆτε and ἀγαλλιώμενοι.
  terminology: “మెస్సీయ” appropriately renders the titular Χριστός under the supplied translation policy. “పాలుపంచుకుంటున్నారు” naturally conveys κοινωνεῖτε without deciding the precise theological nature of the participation. The footnotes are correctly anchored and relevant.
