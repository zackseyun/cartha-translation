id: 1PE.4.15
reference: 1 Peter 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: te
  text: ఎందుకంటే, మీలో ఎవరూ హంతకుడిగా గానీ, దొంగగా గానీ, చెడు చేసేవాడిగా గానీ, ఇతరుల విషయాల్లో జోక్యం చేసుకునేవాడిగా[a] గానీ బాధపడకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరుల జోలికి వెళ్లేవాడిగా”; మరింత అక్షరార్థంగా, “ఇతరులకు చెందిన విషయాలను పర్యవేక్షించేవాడిగా.” ఇది తనకు సంబంధించని విషయాల్లో జోక్యం చేసుకునే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ
  choice: ఎందుకంటే ... కూడదు
  rationale: γάρ ముందున్న సందర్భంతో వివరణాత్మక సంబంధాన్ని చూపుతుంది; μὴ మరియు ఆజ్ఞార్థక క్రియ కలిసి నిషేధాన్ని వ్యక్తం చేస్తున్నాయి.
- source_word: τις ὑμῶν
  choice: మీలో ఎవరూ
  rationale: నిషేధంతో కూడిన ఈ పదబంధం తెలుగులో సహజంగా వ్యక్తిగత భావాన్ని నిలుపుతుంది.
- source_word: πασχέτω
  choice: బాధపడకూడదు
  rationale: πάσχω యొక్క సాధారణ అర్థమైన ‘బాధ అనుభవించడం’ను నిలుపుతుంది; ‘శిక్ష అనుభవించడం’ అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: ὡς
  choice: '...గా'
  rationale: ఏ హోదాలో లేదా ఏ కారణంతో బాధ అనుభవిస్తున్నాడో సూచించే మూలపద ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: φονεύς
  choice: హంతకుడు
  rationale: అక్రమంగా హత్య చేసేవాడనే నైతిక, న్యాయపరమైన నిర్దిష్ట భావాన్ని ఇస్తుంది.
- source_word: κλέπτης
  choice: దొంగ
  rationale: κλέπτηςకు సాధారణమైన, నేరుగా అర్థమయ్యే తెలుగు సమానం.
- source_word: κακοποιός
  choice: చెడు చేసేవాడు
  rationale: ఈ పదంలోని విస్తృత నైతిక భావాన్ని నిలుపుతుంది; ‘నేరస్థుడు’ అని న్యాయపరమైన అర్థానికే పరిమితం చేయదు.
- source_word: ἀλλοτριεπίσκοπος
  choice: ఇతరుల విషయాల్లో జోక్యం చేసుకునేవాడు
  rationale: అరుదైన ఈ సమాసపదం ఇతరులకు చెందిన వ్యవహారాల్లో అనుచితంగా కలుగజేసుకునే వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో భావం స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ἀλλοτριεπίσκοπος యొక్క అర్థం
  choice: ఇతరుల విషయాల్లో జోక్యం చేసుకునేవాడు
  alternative: ఇతరుల వ్యవహారాలను పర్యవేక్షించేవాడు; పరుల జోలికి వెళ్లేవాడు
  rationale: ఇది అరుదైన పదం; అక్షరార్థంలో ‘ఇతరులకు చెందిన వాటిని పర్యవేక్షించేవాడు’ అనే నిర్మాణం కనిపిస్తుంది. అయితే దోషప్రవర్తనల జాబితాలో ఇది ఇతరుల వ్యవహారాల్లో అనుచితంగా జోక్యం చేసుకోవడాన్ని సూచించడం అత్యంత సహజం. సంఘపరమైన ‘పర్యవేక్షకుడు’ అనే ప్రత్యేక హోదాను ఇక్కడ దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. పాపప్రవర్తనల జాబితా సమాంతర నిర్మాణంతో ఇవ్వబడింది; అరుదైన చివరి పదంలోని భావసందిగ్ధత పాదసూచికలో నిలుపబడింది.
