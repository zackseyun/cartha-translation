id: 1PE.4.10
reference: 1 Peter 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: te
  text: ప్రతి ఒక్కరూ తమకు లభించిన కృపావరాన్ని, దేవుని నానావిధమైన కృపను బాధ్యతగా నిర్వహించే మంచి నిర్వాహకులవలె, ఒకరికొకరు సేవ చేయడానికి ఉపయోగించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మధ్య సేవ చేయడానికి.”
    reason: εἰς ἑαυτούς అనే పదబంధం పరస్పర లబ్ధిదారుల భావంతోపాటు సమాజం మధ్య సేవ చేసే పరిధిని కూడా సూచించగలదు.
lexical_decisions:
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: సమాజంలోని ప్రతి వ్యక్తినీ విడివిడిగా ఉద్దేశించే పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καθὼς ἔλαβεν
  choice: తమకు లభించిన
  rationale: ప్రతి ఒక్కరూ ఒక వరాన్ని పొందారనే వాస్తవాన్ని తెలియజేస్తూ, తెలుగులో సహజంగా వాక్యాన్ని నిర్మిస్తుంది; దాతను క్రియలో అనవసరంగా స్పష్టం చేయదు.
- source_word: χάρισμα
  choice: కృపావరం
  rationale: కృపచేత లభించిన వరం అనే పదంలోని భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; దీనిని కేవలం సాంకేతిక అర్థంలోని ‘ఆత్మీయ వరం’గా పరిమితం చేయదు.
- source_word: εἰς ἑαυτοὺς
  choice: ఒకరికొకరు
  rationale: బహువచన పరావర్తన సర్వనామం సూచించే సమాజాంతర్గత లబ్ధిదారుల భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ నిర్మాణం పాదటిప్పణిలో నిలుపబడింది.
- source_word: αὐτὸ διακονοῦντες
  choice: సేవ చేయడానికి ఉపయోగించాలి
  rationale: వరాన్ని ఇతరుల సేవలో పెట్టాలనే సందర్భానుగత ఆజ్ఞార్థక బలాన్ని సహజంగా తెలియజేస్తుంది; సంఘపదవిని సూచించే సంకుచిత భావాన్ని చేర్చదు.
- source_word: καλοὶ οἰκονόμοι
  choice: మంచి నిర్వాహకులుగా
  rationale: తమది కాని దానిని బాధ్యతగా నిర్వహించేవారి భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే విధంగా తెలియజేస్తుంది.
- source_word: ποικίλης χάριτος θεοῦ
  choice: దేవుని నానావిధమైన కృపకు
  rationale: దేవుని కృప అనేక రూపాల్లో వ్యక్తమవుతుందనే భావాన్నీ, దేవునితో గల సంబంధాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: χάρισμα పదాన్ని సాంకేతికంగా ‘ఆత్మీయ వరం’ అని పరిమితం చేయాలా
  choice: కృపావరం
  alternative: ఆత్మీయ వరం; వరం
  rationale: మూలపదం కృపనుంచి వచ్చే వరాన్ని సూచిస్తుంది గాని, ఈ సందర్భంలోనే దాన్ని ఒక సంకుచిత సాంకేతిక వర్గంగా నిర్బంధించదు. ‘కృపావరం’ కృపతో సంబంధాన్ని నిలుపుతూ విస్తృతిని కాపాడుతుంది.
- issue: εἰς ἑαυτούς యొక్క సమాజ సంబంధ భావాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ఒకరికొకరు
  alternative: మీ మధ్య; ఒకరి కోసం ఒకరు
  rationale: సేవ యొక్క లబ్ధిదారులు విశ్వాసుల సమాజంలోనే ఉన్నారనే భావాన్ని సహజంగా తెలుపుతుంది. గ్రీకు నిర్మాణానికి మరింత సమీపమైన స్థల/సమాజ భావం పాదటిప్పణిలో ఇవ్వబడింది.
- issue: οἰκονόμοι లోని బాధ్యత అప్పగింత భావం
  choice: నిర్వాహకులు
  alternative: గృహనిర్వాహకులు; భండారకులు
  rationale: దేవుని కృపను తమ సొత్తుగా కాక అప్పగించబడినదిగా బాధ్యతతో వినియోగించాలనే భావాన్ని ఆధునిక పాఠకునికి స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని కృదంతానికి సందర్భానుగత ఆజ్ఞార్థక బలాన్ని తెలుగులో స్పష్టమైన విధిరూపంతో వ్యక్తం చేశాం.
