revisions:
- from: ప్రతి ఒక్కరూ తమకు లభించిన కృపావరాన్ని, దేవుని నానావిధమైన కృపకు మంచి నిర్వాహకులుగా, ఒకరికొకరు సేవ చేయడానికి ఉపయోగించాలి.[a]
