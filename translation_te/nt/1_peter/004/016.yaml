id: 1PE.4.16
reference: 1 Peter 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: te
  text: అయితే క్రైస్తవుడిగా బాధ అనుభవిస్తే, అతడు సిగ్గుపడకూడదు; ఈ పేరులో దేవుణ్ణి మహిమపరచాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా, “ఈ పేరులో” అని ఉంది. దీనిని “ఈ పేరు కారణంగా” లేదా “ఈ విషయంలో” అని కూడా అర్థం చేసుకోవచ్చు. “ఈ పేరు” బహుశా “క్రైస్తవుడు” అనే పేరును సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ ὡς Χριστιανός
  choice: అయితే క్రైస్తవుడిగా బాధ అనుభవిస్తే
  rationale: మునుపటి వచనంలోని బాధపడడం అనే భావాన్ని షరతు వాక్యంలో సహజమైన తెలుగుకోసం స్పష్టంగా పునరుద్ధరిస్తుంది; Χριστιανός అనే స్థిరపడిన గుర్తింపు పదాన్ని ‘క్రైస్తవుడు’గా అనువదిస్తుంది.
- source_word: μὴ αἰσχυνέσθω
  choice: అతడు సిగ్గుపడకూడదు
  rationale: మూడవ పురుష ఆజ్ఞార్థక భావాన్ని ఆధునిక తెలుగులో సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: దేవుణ్ణి మహిమపరచాలి
  rationale: సిగ్గుపడటానికి విరుద్ధమైన ఆజ్ఞను నిలుపుతూ, దేవునికి సంబంధించిన సందర్భంలో δοξάζω యొక్క సాధారణ అర్థమైన ‘మహిమపరచు’ను ఉపయోగిస్తుంది.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: ఈ పేరును బట్టి
  rationale: ‘క్రైస్తవుడు’ అనే పేరుతో ఉన్న ప్రత్యక్ష సంబంధాన్ని కాపాడుతూ, ἐν యొక్క ఆధార/కారణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: ἐν τῷ ὀνόματι τούτῳలో ‘ఈ పేరు’ దేనిని సూచిస్తుంది?
  choice: ‘క్రైస్తవుడు’ అనే పేరును బట్టి దేవుణ్ణి మహిమపరచడం
  alternative: ‘ఈ విషయంలో’ లేదా ‘ఈ పేరు కారణంగా’ దేవుణ్ణి మహిమపరచడం
  rationale: అత్యంత సమీప పూర్వపదం Χριστιανός; ὄνομα సహజంగా పేరు లేదా గుర్తింపును సూచిస్తుంది. అయితే ἐν యొక్క ఖచ్చిత సంబంధంలో ఉన్న అస్పష్టతను పాదసూచిక ద్వారా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. సందర్భం లేకుండా వాక్యం అసంపూర్ణంగా అనిపించకుండా మునుపటి వచనంలోని ‘బాధ అనుభవించడం’ భావాన్ని సంక్షిప్తంగా పునరుద్ధరించాం; పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచాం.
