id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: te
  text: అలాగే[a] భర్తలారా, జ్ఞానానుసారంగా మీ భార్యలతో కలిసి జీవించండి. వారిని బలహీనమైన పాత్రగా భావిస్తూ[b], అలాగే జీవకృపకు తోటి వారసులుగా భావిస్తూ వారికి గౌరవం ఇవ్వండి; మీ ప్రార్థనలకు ఆటంకం కలగకుండా ఉండేందుకు ఇలా చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అదే విధంగా.”
    reason: lexical_alternative
  - marker: b
    text: “బలహీనమైన పాత్ర” అనేది రూపకం. ఇది శారీరకంగా లేదా సామాజికంగా సాపేక్ష బలహీనతను సూచించవచ్చు; విలువలో తక్కువని కాదు. తరువాతి మాట భార్యలు కూడా జీవకృపకు తోటి వారసులని స్పష్టం చేస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: భర్తలారా
  rationale: 3:1 నుండి కొనసాగుతున్న కుటుంబ సంబంధ సందర్భంలో ఇది సాధారణంగా పురుషులను కాక భర్తలను సూచిస్తుంది.
- source_word: ὁμοίως
  choice: అలాగే
  rationale: ముందున్న ఉపదేశంతో పోలికను, ప్రసంగ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: జ్ఞానానుసారంగా మీ భార్యలతో కలిసి జీవించండి
  rationale: వివాహ జీవితాన్ని సూచించే συνοικοῦντες భావాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, κατὰ γνῶσιν అనే విస్తృతమైన పదబంధాన్ని అతిగా వ్యాఖ్యానించకుండా ఉంచుతుంది.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: స్త్రీ బలహీనమైన పాత్ర అన్నట్లుగా
  rationale: మూలంలోని పాత్ర అనే రూపకాన్ని, సాపేక్ష బలహీనతను నిలుపుతుంది; దానిని శారీరకమైనదిగా లేదా సామాజికమైనదిగా ప్రధాన పాఠంలో పరిమితం చేయదు.
- source_word: ἀπονέμοντες τιμήν
  choice: గౌరవం ఇవ్వండి
  rationale: ఇవ్వవలసిన గౌరవాన్ని తగిన విధంగా ఇవ్వడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: συγκληρονόμοις
  choice: మీతోటి వారసులు
  rationale: భర్తలతో కలిసి ఒకే వారసత్వంలో పాలుపొందేవారు అనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: χάριτος ζωῆς
  choice: జీవకృపకు
  rationale: జీవాన్ని అనుగ్రహించే కృప లేదా జీవమే అయిన కృప అనే సాధ్యమైన సంబంధాన్ని పూర్తిగా ఒకే విధంగా నిర్ణయించకుండా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: అప్పుడు మీ ప్రార్థనలకు ఆటంకం కలగదు
  rationale: మూలంలోని ఉద్దేశ్య/ఫలిత భావాన్ని, ప్రార్థనలు అడ్డగింపబడటం అనే నిష్క్రియ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ‘బలహీనమైన పాత్ర’ అనే రూపకం
  choice: రూపకాన్ని ప్రధాన పాఠంలో యథాతథంగా ఉంచి, అది తక్కువ విలువను సూచించదని పాదసూచికలో వివరించడం
  alternative: దానిని ‘శారీరకంగా బలహీనురాలు’ లేదా ‘సామాజికంగా ఎక్కువ అసురక్షితురాలు’ అని ప్రధాన పాఠంలో నిర్దిష్టీకరించడం
  rationale: మూలపాఠం బలహీనత ఏ విధమైనదో స్పష్టంగా చెప్పదు. వెంటనే గౌరవించమని ఆజ్ఞాపించి, భార్యలు కూడా జీవకృపకు తోటి వారసులని చెబుతుంది; కాబట్టి రూపకాన్ని నిలిపి విలువలో హీనత అనే అపార్థాన్ని నివారించడం సముచితం.
- issue: భార్యల ఉమ్మడి వారసత్వం
  choice: భార్యలు భర్తలతోటి వారసులని స్పష్టంగా వ్యక్తం చేయడం
  alternative: ఈ వారసత్వాన్ని కేవలం భౌతిక జీవితం లేదా ప్రత్యేకంగా నిత్యజీవం అని అనువాదంలో పరిమితం చేయడం
  rationale: συγκληρονόμοις ఉమ్మడి వారసత్వాన్ని స్పష్టంగా చెబుతుంది, కాని χάριτος ζωῆς యొక్క పరిధిని ఇంకా వివరించదు. అందువల్ల సమాన భాగస్వామ్యాన్ని స్పష్టం చేస్తూ వారసత్వ స్వరూపాన్ని తెరిచి ఉంచాం.
- issue: ὡς καὶ యొక్క సంబంధం
  choice: ‘వారు కూడా ... అన్నట్లుగా గౌరవించండి’
  alternative: ‘వారు ... వారసులు కాబట్టి’
  rationale: కారణార్థాన్ని మూలంలో ఉన్నదానికంటే బలంగా చేర్చకుండా, ὡς καὶ యొక్క పోలిక/పరిగణన భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలోని వరుస కృదంతాలను తెలుగులో స్పష్టమైన ఆజ్ఞార్థ వాక్యాలుగా విభజించాం. ‘పాత్ర,’ ‘జీవకృప’ వంటి మూలరూపక, సంబంధ పదాలను అతిగా వివరణాత్మకంగా మార్చకుండా నిలిపాం.
