revisions:
- from: అయితే సాత్వికతతో, భయంతో[a], మంచి మనస్సాక్షి కలిగి అలా చేయండి. అప్పుడు, మీరు ఏ విషయంలో దూషించబడుతున్నారో[b], ఆ విషయంలో మెస్సీయలో[c] మీ మంచి ప్రవర్తనను నిందించేవారు సిగ్గుపడతారు.
  to: కానీ సాత్వికతతోను భయంతోను[a], మంచి మనస్సాక్షి కలిగి సమాధానం చెప్పండి. అప్పుడు, మీరు ఏ విషయంలో దూషించబడుతున్నారో[b], ఆ విషయంలో మెస్సీయలో[c] మీ మంచి ప్రవర్తనను నిందించేవారు సిగ్గుపడునట్లు ఉంటుంది.
  rationale: The revision makes explicit only the command inherited from the immediately preceding verse, rather than adding the vague ‘అలా చేయండి.’ It preserves the source’s adversative connection and renders the ἵνα clause with a Telugu purpose/result construction. No theological object is supplied for ‘భయంతో,’ and ‘మెస్సీయలో’ remains the main-text rendering for ἐν Χριστῷ.
  reviewer_model: gpt-5.6-terra
