id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: te
  text: కానీ సాత్వికతతోను భయంతోను[a], మంచి మనస్సాక్షి కలిగి సమాధానం చెప్పండి. అప్పుడు, మీరు ఏ విషయంలో దూషించబడుతున్నారో[b], ఆ విషయంలో మెస్సీయలో[c] మీ మంచి ప్రవర్తనను నిందించేవారు సిగ్గుపడునట్లు ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భక్తిభావంతో’ లేదా ‘గౌరవంతో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మీ గురించి చెడుగా మాట్లాడుతున్న విషయంలో.’
    reason: lexical_alternative
  - marker: c
    text: 'గ్రీకు: ‘క్రీస్తులో’; ‘క్రీస్తు’ అంటే ‘మెస్సీయ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: సాత్వికతతో
  rationale: కఠినత లేదా దురుసుతనం లేని వినయపూర్వకమైన మృదు వైఖరిని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగానూ సహజంగానూ ఉంటుంది.
- source_word: φόβου
  choice: భయంతో
  rationale: మూలపదానికి భయం, భక్తిభావం, గౌరవం అనే భావాలు సాధ్యమైనందున, దాని ఉద్దేశ్యాన్ని నిర్దిష్టం చేయకుండా విస్తృతమైన ‘భయం’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: మంచి మనస్సాక్షి కలిగి
  rationale: గ్రీకు వర్తమాన కృదంత నిర్మాణాన్ని సహచర పరిస్థితిగా చూపిస్తూ, అనవసర వివరణ లేకుండా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐν ᾧ
  choice: మీరు ఏ విషయంలో ... ఆ విషయంలో
  rationale: గ్రీకు సంబంధవాచక ప్రయోగంలోని విషయ/పరిధి సూచనను తెలుగులో స్పష్టమైన సంబంధ నిర్మాణంతో చూపిస్తుంది; అది సూచించే నిర్దిష్ట విషయాన్ని అదనంగా నిర్ణయించదు.
- source_word: καταλαλεῖσθε
  choice: దూషించబడుతున్నారు
  rationale: ఎవరినైనా విరోధపూర్వకంగా చెడుగా మాట్లాడటం లేదా అపనింద వేయటం అనే భావాన్ని వ్యక్తం చేస్తుంది; కర్మణి రూపాన్ని కూడా నిలుపుతుంది.
- source_word: καταισχυνθῶσιν
  choice: సిగ్గుపడతారు
  rationale: ἵνα తరువాతి ఫలిత/ఉద్దేశ భావాన్ని తెలుగులో ‘అప్పుడు’ అనే సహజ అనుసంధానంతో వ్యక్తం చేస్తుంది. అక్షరార్థ కర్మణి రూపం తెలుగులో కృత్రిమంగా ఉండేందున సహజమైన ఫలిత రూపం వాడబడింది.
- source_word: ἐπηρεάζοντες
  choice: నిందించేవారు
  rationale: ఇక్కడ మంచి ప్రవర్తనపై విరోధపూర్వకంగా దాడి చేస్తూ అవమానించే వారిని సూచిస్తుంది; సమీపంలోని మాటల దూషణ సందర్భానికి ‘నిందించు’ సహజంగా సరిపోతుంది.
- source_word: ἀναστροφήν
  choice: ప్రవర్తనను
  rationale: వ్యక్తి జీవించే తీరు లేదా నైతిక నడవడిని సంక్షిప్తంగా, సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని నిలుపుకుంటుంది; అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను వాడి, సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἀγαθὴν
  choice: మంచి
  rationale: మనస్సాక్షి, ప్రవర్తన రెండింటి విషయంలోనూ మూలంలోని సరళమైన నైతిక విశేషణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: φόβου అనే పదం సూచించే భయానికి గల ఉద్దేశ్యం
  choice: ప్రధాన పాఠ్యంలో ‘భయంతో’ అని ఉంచి, ఎవరిపట్ల లేదా ఏ భావంలోనో నిర్దిష్టం చేయలేదు.
  alternative: ‘భక్తిభావంతో’ లేదా ‘గౌరవంతో’; కొందరు ‘దేవుని భయంతో’ అని అర్థం చేసుకుంటారు.
  rationale: తక్షణ వాక్యంలో భయానికి ఉద్దేశ్యం స్పష్టంగా చెప్పబడలేదు. అందువల్ల దేవుని భయమని గానీ, మనుషులపట్ల గౌరవమని గానీ అనువాదంలోనే తేల్చకుండా భావ ఉద్రిక్తతను నిలిపాం.
- issue: ἐν Χριστῷ లో Χριστός అనువాదం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: ఈ ప్రయోగంలో అభిషిక్తుడైన రాజు/రక్షకుడు అనే బిరుదు భావం సజీవంగా ఉంది. అందుచేత అర్థానువాదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, తెలుగు క్రైస్తవ సంప్రదాయంలో ప్రసిద్ధమైన రూపాన్ని ప్రత్యామ్నాయంగా ఇచ్చాం.
- issue: ἵνα καταισχυνθῶσιν లో ఉద్దేశం లేదా ఫలితం
  choice: ‘అప్పుడు ... సిగ్గుపడతారు’ అని సహజ ఫలిత సంబంధంగా వ్యక్తం చేశాం.
  alternative: ‘వారు సిగ్గుపడేలా’ లేదా ‘సిగ్గుపరచబడేలా’.
  rationale: ἵνα ఉద్దేశం లేదా ఆశించిన ఫలితం రెండింటినీ సూచించగలదు. తెలుగు వాక్యంలో కఠినంగా ఒక్కదానికే పరిమితం చేయకుండా సందర్భానుగుణ ఫలితంగా అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద శైలి. 16వ వచనం ముందరి వచనంలోని సమాధానం చెప్పాలనే ఆజ్ఞను వ్యాకరణపరంగా కొనసాగిస్తున్నందున, తెలుగులో అసంపూర్ణ వాక్యం కాకుండా ఉండేందుకు ‘అలా చేయండి’ అని సందర్భానుసారంగా చేర్చాం. ‘మనస్సాక్షి,’ ‘సాత్వికత,’ ‘మెస్సీయ’ వంటి స్థిరమైన ధార్మిక పదాలను ఉంచినా వాక్య నిర్మాణాన్ని సరళంగా ఉంచాం.
