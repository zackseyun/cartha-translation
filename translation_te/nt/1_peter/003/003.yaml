id: 1PE.3.3
reference: 1 Peter 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: te
  text: మీ అలంకారం బాహ్య అలంకారంగా—జుట్టు అల్లుకోవడం[a], బంగారు ఆభరణాలు ధరించడం, లేదా దుస్తులు ధరించడం—ఉండకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ అలంకారం జుట్టు అల్లుకోవడం, బంగారు ఆభరణాలు ధరించడం, లేదా దుస్తులు ధరించడం వంటి బాహ్య అలంకారం కాకూడదు.” తరువాతి వచనంలో అంతరంగ వ్యక్తితో ఉన్న వ్యత్యాసం, బాహ్య ప్రదర్శనకన్నా అంతరంగ స్వభావానికి ప్రాధాన్యాన్ని సూచిస్తుంది; అయినప్పటికీ ఈ వాక్యంలోని నిషేధ భావం బలంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧν
  choice: మీ
  rationale: మునుపటి వచనంలో సంబోధించబడిన భార్యలను సూచించే సంబంధ సర్వనామం. తెలుగులో స్వామ్యార్థాన్ని సహజంగా ‘మీ’ తెలియజేస్తుంది.
- source_word: ἔστω οὐχ
  choice: ఉండకూడదు
  rationale: εἰμί మూడవ పురుష వర్తమాన ఆజ్ఞార్థక రూపాన్ని οὐχ నిరాకరిస్తుంది. ‘ఉండకూడదు’ తెలుగులో ఆజ్ఞాత్మక నిషేధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: బయటికి కనిపించే అలంకారం
  rationale: κόσμος ఇక్కడ ‘లోకం’ కాక ‘అలంకారం’; ἔξωθεν దాని బాహ్య స్వభావాన్ని సూచిస్తుంది. తరువాతి వచనంలోని అంతరంగ వ్యక్తితో ఉన్న వ్యత్యాసాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: ἐμπλοκῆς τριχῶν
  choice: జుట్టు అల్లుకోవడం
  rationale: జుట్టును అల్లే చర్యను సూచించే మూలపాఠంలోని నామవాచక నిర్మాణాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: περιθέσεως χρυσίων
  choice: బంగారు ఆభరణాలు ధరించడం
  rationale: περίθεσις చుట్టూ పెట్టుకోవడం లేదా ధరించడం అనే చర్యను, χρυσίων బంగారు వస్తువులు లేదా ఆభరణాలను సూచిస్తాయి.
- source_word: ἢ
  choice: లేదా
  rationale: జాబితాలోని సాధారణ వికల్ప సముచ్చయాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἐνδύσεως ἱματίων
  choice: బట్టలు వేసుకోవడం
  rationale: దుస్తులు ధరించే చర్యను మూలపాఠంలోని సమాంతర నామవాచక నిర్మాణానికి అనుగుణంగా, సాధారణ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: బాహ్య శృంగారం, ఆభరణాలు, దుస్తులను పేతురు పూర్తిగా నిషేధిస్తున్నాడా, లేక అంతరంగ స్వభావానికి వాటిని అధీనపరుస్తున్నాడా?
  choice: ‘కేవలం బయటికి కనిపించేదిగా ... ఉండకూడదు’ అని అనువదించి, అంతరంగ అలంకారానికి ప్రాధాన్యం ఇచ్చే తులనాత్మక భావాన్ని సూచించడం
  alternative: జుట్టు అల్లుకోవడం, బంగారం ధరించడం, బట్టలు వేసుకోవడం అన్నిటినీ సంపూర్ణంగా నిషేధించడం
  rationale: 4వ వచనం బాహ్య అలంకారాన్ని ‘హృదయంలో దాగి ఉన్న వ్యక్తి’తో వ్యత్యాసపరుస్తుంది. అయితే గ్రీకు వాక్యంలోని నిషేధ రూపం బలంగా ఉండటంతో దానిని పూర్తిగా మృదువుచేయకుండా ప్రధాన పాఠంలో నిషేధాన్ని ఉంచి, ‘కేవలం’ ద్వారా సందర్భంలోని ప్రాధాన్య వ్యత్యాసాన్ని తెలియజేశాం; అడిక్కురిప్పులో ప్రత్యామ్నాయ అవగాహనను నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని అసంపూర్ణంగా కొనసాగుతున్న వాక్య నిర్మాణాన్ని చివరి దీర్ఘ విరామచిహ్నంతో నిలుపుతూ, తరువాతి వచనంతో సంబంధాన్ని సూచించాం. ‘బట్టలు’ సాధారణ వాడుక పదం; ‘ఆభరణాలు’ సందర్భానికి తగిన స్పష్టతనిస్తుంది.
