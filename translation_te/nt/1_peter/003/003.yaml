revisions:
- from: మీ అలంకారం కేవలం బయటికి కనిపించేదిగా—జుట్టు అల్లుకోవడం[a], బంగారు ఆభరణాలు ధరించడం, లేదా బట్టలు వేసుకోవడం—ఉండకూడదు.
  to: మీ అలంకారం బాహ్య అలంకారంగా—జుట్టు అల్లుకోవడం[a], బంగారు ఆభరణాలు ధరించడం, లేదా దుస్తులు ధరించడం—ఉండకూడదు.
  rationale: The revision removes the untranslated interpretive limiter ‘కేవలం,’ keeps the Greek imperative’s negative force, and uses a natural Telugu expression for outward adornment. It also corrects the footnote by removing the unsupported qualification ‘fine/good’ for clothing, retaining direct address, and describing the contextual interpretive issue without imposing a doctrinal conclusion.
  reviewer_model: gpt-5.6-terra
