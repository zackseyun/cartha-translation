id: 1PE.3.18
reference: 1 Peter 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: te
  text: ఎందుకంటే మెస్సీయ కూడా పాపాల కోసం ఒక్కసారి బాధపడ్డాడు[a]—అనీతిమంతుల కోసం నీతిమంతుడు—మిమ్మల్ని దేవుని దగ్గరకు తీసుకురావడానికి; శరీర పరంగా చంపబడ్డాడు గాని, ఆత్మ పరంగా జీవింపజేయబడ్డాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘బాధపడ్డాడు’ అనే మాటకు బదులుగా ‘చనిపోయాడు’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: ‘పరిశుద్ధాత్మ ద్వారా జీవింపజేయబడ్డాడు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఆత్మకు సంబంధించిన పరిధి లేదా కోణాన్ని గానీ, పరిశుద్ధాత్మ కార్యాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστόςలోని అభిషిక్తుడు/మెస్సీయ అనే బిరుదు భావాన్ని కేవలం పేరులా మార్చకుండా నిలుపుతుంది.
- source_word: ἅπαξ
  choice: ఒక్కసారి
  rationale: క్రియావిశేషణం నేరుగా ‘ఒక్కసారి’ అని అర్థం; ‘ఒక్కసారే శాశ్వతంగా’ వంటి అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: περὶ ἁμαρτιῶν
  choice: పాపాల కోసం
  rationale: ఈ ప్రాయశ్చిత్త సందర్భంలో περί + షష్ఠీ పాపాలకు సంబంధించి, వాటి నిమిత్తం అనే భావాన్ని ఇస్తుంది.
- source_word: ἔπαθεν
  choice: బాధపడ్డాడు
  rationale: SBLGNTలోని పాఠం ἔπαθεν (‘బాధపడ్డాడు’); ‘చనిపోయాడు’ అనేది పాఠాంతరం మాత్రమే.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: అనీతిమంతుల కోసం నీతిమంతుడు
  rationale: నీతిమంతుడైన మెస్సీయ అనీతిమంతుల పక్షాన బాధపడిన ప్రతినిధి/ప్రత్యామ్నాయ భావాన్ని, పూర్తి ప్రాయశ్చిత్త సిద్ధాంతంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: προσαγάγῃ
  choice: దేవుని దగ్గరకు తీసుకురావడానికి
  rationale: దేవుని సన్నిధికి తీసుకురావడం లేదా ఆయన వద్ద ప్రవేశం కలిగించడం అనే క్రియ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: θανατωθεὶς μὲν σαρκὶ
  choice: శరీర సంబంధంగా ఆయన చంపబడ్డాడు
  rationale: కర్మణి ప్రయోగాన్ని నిలుపుతూ σαρκίని పాప స్వభావంగా కాక, శారీరక ఉనికి సంబంధమైన కోణంగా వ్యక్తపరుస్తుంది.
- source_word: ζῳοποιηθεὶς δὲ πνεύματι
  choice: కాని ఆత్మ సంబంధంగా సజీవునిగా చేయబడ్డాడు
  rationale: కర్మణి భావాన్ని, అలాగే πνεύματιలోని కోణం/పరిధి అర్థాన్ని నిలుపుతుంది; పరిశుద్ధాత్మ కర్తృత్వం అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో శరీరం–ఆత్మ వ్యత్యాసం
  choice: ‘శరీర సంబంధంగా ... ఆత్మ సంబంధంగా’ అని సమాంతర కోణాలు/పరిధులుగా అనువదించబడింది.
  alternative: ‘శరీరంలో ... పరిశుద్ధాత్మ ద్వారా’ లేదా ‘శరీరంలో ... ఆత్మలో’.
  rationale: σαρκί, πνεύματι రెండూ దత్తివులు; రెండవది పరిధి/కోణాన్నో పరిశుద్ధాత్మ కర్తృత్వాన్నో సూచించవచ్చు. ప్రధాన పాఠంలో ఒక వివాదాస్పద అర్థాన్ని ఖరారు చేయకుండా సమాంతరతను నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ‘అనీతిమంతుల కోసం నీతిమంతుడు’లోని ప్రత్యామ్నాయ/ప్రతినిధి భావం
  choice: గ్రీకు సంక్షిప్త రూపానికి దగ్గరగా ‘అనీతిమంతుల కోసం నీతిమంతుడు’ అని ఉంచబడింది.
  alternative: ‘దోషుల స్థానంలో నిర్దోషి’ వంటి మరింత వ్యాఖ్యానాత్మక రూపం.
  rationale: ὑπέρ ఇతరుల మేలు కోసం లేదా వారి పక్షాన అనే భావాన్ని స్పష్టంగా ఇస్తుంది; అయితే నిర్దిష్టమైన ప్రాయశ్చిత్త నమూనాను పాఠ్యంలోకి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మెస్సీయ’ను బిరుదుగా నిలిపాం. గ్రీకు వాక్యంలోని గంభీరమైన వ్యత్యాసాన్ని చూపేందుకు మధ్య గీతలు వాడాం. రెండు పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
