id: 1PE.3.1
reference: 1 Peter 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: te
  text: అదే విధంగా, భార్యలారా, మీ సొంత భర్తలకు లోబడి ఉండండి; తద్వారా, వారిలో కొందరు వాక్యానికి విధేయులు కాకపోయినా[a], తమ భార్యల ప్రవర్తన ద్వారా మాట లేకుండానే గెలుచబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సందేశానికి లోబడకపోయినా”; అంటే, వారు సువార్త సందేశాన్ని తిరస్కరిస్తున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοίως
  choice: అదే విధంగా
  rationale: ముందున్న గృహసంబంధ ఉపదేశంతో ఈ ఉపదేశానికి ఉన్న అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γυναῖκες
  choice: భార్యలారా
  rationale: ‘మీ సొంత భర్తలు’ అనే సందర్భం వల్ల ఇక్కడ సాధారణంగా ‘స్త్రీలు’ కాక, వివాహ సంబంధార్థమైన ‘భార్యలు’ ఉద్దేశించబడ్డారు.
- source_word: ὑποτασσόμεναι
  choice: లోబడి ఉండండి
  rationale: గ్రీకు అసమాపక క్రియలో అంతర్లీనంగా ఉన్న ఉపదేశ బలాన్ని తెలుగులో సహజమైన ఆజ్ఞార్థక రూపంలో వ్యక్తం చేస్తుంది; ‘విధేయత చూపండి’ లేదా ‘ఆజ్ఞ పాటించండి’ కంటే మూలంలోని సంబంధ క్రమ భావాన్ని మితంగా నిలుపుతుంది.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: మీ సొంత భర్తలకు
  rationale: గృహ సందర్భంలో ἀνήρ అంటే ‘భర్త’; ἰδίοις ఇచ్చే ప్రత్యేక ఉద్ఘాటనను ‘సొంత’ నిలుపుతుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: ఈ సంధానం ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో రెండింటికీ తగిన విస్తృతిని ఉంచుతుంది.
- source_word: καὶ εἴ τινες
  choice: వారిలో కొందరు … కాకపోయినా
  rationale: καὶ εἴ లోని concessive భావాన్ని ‘కాకపోయినా’ సహజంగా తెలియజేస్తుంది; τινες ను ‘కొందరు’గా నిలుపుతుంది.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: వాక్యానికి విధేయులు కాకపోయినా
  rationale: ἀπειθέω లో అవిశ్వాసం, అవిధేయత రెండింటి ఛాయలూ ఉండగలవు. ప్రధాన పాఠంలో అవిధేయత భావాన్ని నిలిపి, సువార్త సందేశాన్ని తిరస్కరించడమనే సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: తమ భార్యల ప్రవర్తన ద్వారా
  rationale: ἀναστροφή అంటే జీవనవిధానం లేదా ప్రవర్తన. ‘ప్రవర్తన’ సంక్షిప్తంగా, సహజంగా ఉంది; సంబంధ సూచనను ‘తమ భార్యల’ స్పష్టం చేస్తుంది.
- source_word: ἄνευ λόγου
  choice: మాట లేకుండానే
  rationale: ముందున్న ‘వాక్యం’తో λόγος కలిగించే పదప్రయోగ వ్యత్యాసాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, భార్యలు మాటలతో ఒప్పించకుండానే అనే భావాన్ని అతిగా విస్తరించదు.
- source_word: κερδηθήσονται
  choice: గెలుచుకోబడతారు
  rationale: κερδαίνω లోని ‘సంపాదించు/గెలుచుకొను’ రూపకాన్ని, కర్తరి భావంగా మార్చకుండా, భవిష్యత్ కర్మణి రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: గృహ ఉపదేశంలో ὑποτασσόμεναι స్వభావం
  choice: ‘లోబడి ఉండండి’ అని అనువదించడం
  alternative: ‘విధేయత చూపండి’ లేదా ‘ఆజ్ఞ పాటించండి’
  rationale: మూలం సంబంధ క్రమాన్ని సూచిస్తుంది గాని సంపూర్ణ ఆజ్ఞాపాలనను లేదా స్వభావపరమైన హీనతను ప్రకటించదు. అందువల్ల మూలంలోని ఉద్రిక్తతను అదనపు సిద్ధాంత భావాలు చేర్చకుండా నిలుపుతుంది.
- issue: ἀπειθοῦσιν τῷ λόγῳ అర్థం
  choice: ‘వాక్యానికి విధేయులు కాకపోయినా’ అని ప్రధాన పాఠంలో ఉంచడం
  alternative: ‘సందేశాన్ని నమ్మకపోయినా’ లేదా ‘సువార్తకు లోబడకపోయినా’
  rationale: గ్రీకు క్రియలో అవిశ్వాసం, అవిధేయత పరస్పరం మిళితమై ఉన్నాయి. ప్రధాన అనువాదం అవిధేయత భావాన్ని నిలుపుతుంది; పాదసూచిక సువార్త సందేశాన్ని తిరస్కరించే సందర్భార్థాన్ని తెలియజేస్తుంది.
- issue: κερδηθήσονται ద్వారా సూచించబడిన ఫలితం
  choice: ‘గెలుచుకోబడతారు’ అనే రూపకాన్ని అలాగే ఉంచడం
  alternative: ‘విశ్వాసంలోకి వస్తారు’ లేదా ‘రక్షించబడతారు’
  rationale: మూలం ఎవరికి లేదా ఏ నిర్దిష్ట స్థితికి గెలుచుకోబడతారో ఈ వాక్యంలో స్పష్టంగా చెప్పదు. అందువల్ల సందర్భం సూచించే సువార్త సంబంధ భావాన్ని సిద్ధాంతపరంగా మరింత నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు అసమాపక ఉపదేశాన్ని తెలుగులో సహజమైన ఆజ్ఞార్థక రూపంగా ఇచ్చి, λόγος పదం మొదటి సందర్భంలో ‘వాక్యం’, రెండవ సందర్భంలో ‘మాట’గా అనువదించి భావసంబంధ పదప్రయోగాన్ని నిలుపబడింది.
