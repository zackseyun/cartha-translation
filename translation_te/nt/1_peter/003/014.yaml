id: 1PE.3.14
reference: 1 Peter 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: te
  text: అయితే, మీరు నీతి నిమిత్తం బాధపడవలసి వచ్చినా, మీరు ధన్యులు. వారి భయాన్ని భయపడకండి[a]; కలవరపడకండి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారికి భయపడకండి,’ లేదా ‘వారు భయపడేదానికి భయపడకండి.’ గ్రీకులోని ‘వారి భయం’ అనే పదబంధం యెషయా 8:12 మాటలను దగ్గరగా అనుసరిస్తూ ఈ రెండు అర్థాలకు అవకాశం ఇస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ
  choice: అయితే, … వచ్చినా
  rationale: ముందటి మాటతో ఉన్న వ్యత్యాసాన్ని, అలాగే నిజంగా సంభవించగల అవకాశాన్ని తెలిపే concessive conditional భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάσχοιτε
  choice: బాధపడవలసి వచ్చినా
  rationale: Optative రూపంలోని సంభావ్యతను కేవలం వర్తమాన వాస్తవంగా మార్చకుండా, ఎదురయ్యే నిజమైన అవకాశంగా తెలియజేస్తుంది.
- source_word: διὰ δικαιοσύνην
  choice: నీతి నిమిత్తం
  rationale: διά + accusative తెలిపే కారణార్థాన్ని నిలుపుతూ, δικαιοσύνη యొక్క నైతిక-దైవశాస్త్రీయ విస్తృతిని ‘నీతి’ కాపాడుతుంది; ‘మంచి చేసినందుకు’ అనేది మరింత వ్యాఖ్యానాత్మకం.
- source_word: μακάριοι
  choice: మీరు ధన్యులు
  rationale: సంబోధితులను స్పష్టంగా సూచిస్తూ, దేవుని అనుగ్రహంలో ఉన్న స్థితిని తెలిపే బైబిలీయ ప్రతిధ్వనిని ‘ధన్యులు’ నిలుపుతుంది.
- source_word: τὸν ... φόβον αὐτῶν
  choice: వారి భయానికి
  rationale: యెషయా 8:12తో ఉన్న పదప్రతిధ్వనిని, అలాగే ‘వారివల్ల కలిగే భయం’ లేదా ‘వారు భయపడేది’ అనే గ్రీకు పదబంధంలోని ఉద్దేశపూర్వక సందిగ్ధతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: μὴ φοβηθῆτε
  choice: భయపడకండి
  rationale: నిషేధార్థాన్ని సహజంగా వ్యక్తం చేస్తూ, φόβος/φοβέομαι మధ్యనున్న ‘భయం/భయపడడం’ పదపునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
- source_word: μηδὲ ταραχθῆτε
  choice: కలవరపడకండి
  rationale: ταράσσω సూచించే అంతరంగ ఆందోళనను అతివ్యాఖ్యానం చేయకుండా సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: δικαιοσύνη పదానికి అనువాదం
  choice: నీతి
  alternative: న్యాయం; సరైనది చేయడం
  rationale: ఈ సందర్భంలో దేవుని ఎదుట, మనుషుల ఎదుట నిటారైన ప్రవర్తన కారణంగా కలిగే బాధ ప్రధాన భావం. ‘నీతి’ ఆ నైతిక-దైవశాస్త్రీయ విస్తృతిని నిలుపుతుంది; ‘న్యాయం’ భావాన్ని సామాజిక న్యాయానికే పరిమితం చేయవచ్చు, ‘సరైనది చేయడం’ మరింత వ్యాఖ్యానాత్మకం.
- issue: τὸν φόβον αὐτῶν లోని సందిగ్ధత
  choice: వారి భయానికి
  alternative: వారికి భయపడకండి; వారు భయపడేదానికి భయపడకండి
  rationale: గ్రీకు జనిటివ్ పదబంధం భయాన్ని వారు కలిగిస్తున్నారా లేక వారే భయపడుతున్నారా అన్నది స్పష్టంగా నిర్ణయించదు; యెషయా 8:12 ప్రతిధ్వనితో కూడిన ఈ ఉద్రిక్తతను ప్రధాన పాఠ్యంలో నిలిపి, ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. ‘ధన్యులు,’ ‘నీతి’ వంటి సుపరిచిత బైబిలీయ పదాలను ఉంచి, మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. సెమీకోలన్ సమన్వితమైన రెండు నిషేధాలను స్పష్టంగా వేరు చేస్తుంది.
