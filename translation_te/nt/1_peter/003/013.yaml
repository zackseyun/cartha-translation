review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional construction, the ingressive sense of γένησθε ('మారితే'), and the rhetorical future question. However, 'మేలుచేయడానికి' means 'for doing good,' whereas τοῦ ἀγαθοῦ with ζηλωταί denotes commitment or zeal toward 'what is good,' not specifically the act of doing good. The connective Καὶ should also be represented in the translation.
  naturalness: The revised wording is idiomatic modern standard Telugu and retains a clear rhetorical-question form. 'మంచిదాని పట్ల ఉత్సాహులుగా' is more natural and semantically precise here than the action-focused 'మేలుచేయడానికి ఆసక్తిగలవారిగా.'
  terminology: '''మంచిదాని'' appropriately represents the abstract neuter ''what is good,'' and ''ఉత్సాహులుగా'' conveys ζηλωταί more strongly than ''ఆసక్తిగలవారిగా.'' ''హాని చేసేవాడు'' retains the broad sense of κακώσων without implying immunity from all suffering.'
  issues:
  - severity: medium
    issue: The phrase 'మేలుచేయడానికి' narrows τοῦ ἀγαθοῦ to performing good deeds.
    rationale: The Greek expression ζηλωταὶ τοῦ ἀγαθοῦ means people zealous for, devoted to, or eager for what is good. It does not explicitly use a verb meaning 'do' (ποιεῖν).
  - severity: low
    issue: Καὶ is not represented in the draft text.
    rationale: Although a light Telugu connective is appropriate, the Greek continues the preceding argument. 'మరి' supplies this connection naturally without introducing a strong contrast.
