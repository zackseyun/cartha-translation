id: 1PE.3.13
reference: 1 Peter 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: te
  text: మరి, మీరు మంచిదాని పట్ల ఉత్సాహులుగా మారితే, మీకు హాని చేసేవాడు ఎవరు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేలును ఆసక్తిగా అనుసరించేవారుగా మారితే.”
    reason: ζηλωταὶ τοῦ ἀγαθοῦకు సాధ్యమైన సహజ ప్రత్యామ్నాయం; ‘ఉత్సాహులుగా’ అనే ప్రధాన అనువాదం ζηλωτήςలోని బలమైన నిబద్ధతను మరింత నేరుగా ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: Καὶ
  choice: అయితే
  rationale: ముందటి ఉపదేశానికి ఈ వాక్యాన్ని అనుసంధానించే సంధానార్థాన్ని సహజమైన తెలుగు ప్రశ్నారంభంతో వ్యక్తం చేస్తుంది; ఇది బలమైన విరోధాన్ని సూచించదు.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: మీకు హాని చేసేవాడు ఎవరు?
  rationale: భవిష్యదర్థక substantival participle కలిగిన అలంకారప్రశ్నను సహజమైన తెలుగులో నిలుపుతుంది; κακόω యొక్క విస్తృతమైన హాని లేదా చెడు చేయడం అనే భావాన్ని ‘హాని చేయు’ అందిస్తుంది.
- source_word: ἐὰν
  choice: మారితే
  rationale: ఉపవాక్యంలోని షరతును తెలుగు క్రియారూపం ‘-తే’ ద్వారా సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ ἀγαθοῦ
  choice: మేలుచేయడానికి
  rationale: నపుంసక విశేషణం సూచించే ‘మంచిదైనది/మేలు’ అనే భావాన్ని, ζηλωταίతో దాని సంబంధాన్ని సహజమైన కార్యోన్ముఖ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ζηλωταὶ
  choice: ఆసక్తిగలవారిగా
  rationale: ζηλωτήςలోని ఉత్సాహపూర్వక నిబద్ధతను సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; ‘ఉత్సాహంగలవారు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: γένησθε
  choice: మారితే
  rationale: γίνομαι యొక్క ‘అగుట/మారుట’ భావాన్ని కేవలం స్థితిగా కాక, అలా అయ్యే భావంతో నిలుపుతుంది.
theological_decisions:
- issue: నీతిగా మేలు చేసినా బాధ సంభవించే సందర్భంలో అలంకారప్రశ్న యొక్క బలం
  choice: ‘మీకు హాని చేసేవాడు ఎవరు?’ అనే అలంకారప్రశ్నను యథాతథంగా ఉంచడం
  alternative: విశ్వాసులకు ఎవరూ ఏ విధంగానూ హాని చేయలేరనే సంపూర్ణ హామీగా విస్తరించడం
  rationale: తరువాతి వచనం మేలుచేసినా బాధపడే అవకాశాన్ని అంగీకరిస్తుంది. కాబట్టి ఈ ప్రశ్న ఇచ్చే సాధారణ ధైర్యాన్ని నిలుపుతూ, బాధకు సంపూర్ణ మినహాయింపుగా దాని భావాన్ని నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. అలంకారప్రశ్నను, షరతును, γένησθεలోని ‘మారుట’ భావాన్ని నిలిపింది.
