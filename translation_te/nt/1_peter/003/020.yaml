revisions:
- from: వారు పూర్వం అవిధేయులయ్యారు. నోవహు దినాల్లో ఓడ సిద్ధం చేయబడుతూ ఉన్నప్పుడు దేవుని దీర్ఘసహనం వేచి చూసింది. ఆ ఓడలోనికి కొద్దిమంది, అంటే ఎనిమిది మంది[a], ప్రవేశించి నీటి గుండా క్షేమంగా రక్షించబడ్డారు[b].
  to: ఒకప్పుడు అవిధేయులైన వారు—నోవహు దినాల్లో ఓడ సిద్ధం చేయబడుతున్నప్పుడు దేవుని దీర్ఘసహనం వేచి ఉండగా—ఆ ఓడలోనికి కొద్దిమంది, అంటే ఎనిమిది మంది[a], నీటి గుండా క్షేమంగా రక్షించబడ్డారు[b].
  rationale: The revision preserves the Greek participial structure and its connection with the preceding referent, renders the ongoing waiting of God’s patience in natural modern Telugu, and removes an explicit ‘entering’ action not separately stated in Greek. It preserves the source’s ambiguity concerning δι’ ὕδατος through the main rendering and footnote, while retaining both footnote anchors and their corresponding alternatives.
