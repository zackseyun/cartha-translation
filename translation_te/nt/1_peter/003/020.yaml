source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: te
  text: ఒకప్పుడు అవిధేయులైన వారు—నోవహు దినాల్లో ఓడ సిద్ధం చేయబడుతున్నప్పుడు దేవుని దీర్ఘసహనం వేచి ఉండగా—ఆ ఓడలోనికి కొద్దిమంది, అంటే ఎనిమిది మంది[a], నీటి గుండా క్షేమంగా రక్షించబడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఎనిమిది ప్రాణాలు.”
    reason: lexical_alternative
  - marker: b
    text: “నీటి ద్వారా రక్షించబడ్డారు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: అవిధేయులయ్యారు
  rationale: దేవునికి లేదా ప్రకటించబడిన హెచ్చరికకు లోబడని భావాన్ని ఇస్తుంది; కేవలం మేధాపరమైన అవిశ్వాసానికి అర్థాన్ని పరిమితం చేయదు.
- source_word: ποτε
  choice: పూర్వం
  rationale: ప్రస్తుత వాక్యప్రవాహానికి సంబంధించి గతకాలాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀπεξεδέχετο
  choice: వేచి చూసింది
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న నిరీక్షణను వ్యక్తపరుస్తుంది; μακροθυμίαలోనే సహన భావం ఉన్నందున అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: μακροθυμία
  choice: దీర్ఘసహనం
  rationale: తీర్పును వెంటనే అమలు చేయకుండా దేవుడు సహనంతో ఆలస్యం చేసిన భావాన్ని గౌరవప్రదంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: κατασκευαζομένης
  choice: సిద్ధం చేయబడుతూ ఉన్నప్పుడు
  rationale: నిర్మించబడటం మాత్రమే కాకుండా సిద్ధపరచబడటం అనే విస్తృత భావాన్ని, అలాగే కొనసాగుతున్న ప్రక్రియను నిలుపుతుంది.
- source_word: κιβωτοῦ
  choice: ఓడ
  rationale: నోవహు సందర్భంలో స్థిరపడిన, సామాన్య పాఠకులకు స్పష్టమైన తెలుగు పదం.
- source_word: εἰς ἣν
  choice: ఆ ఓడలోనికి
  rationale: εἰς సూచించే లోపలికి కదలికను స్పష్టంగా నిలుపుతుంది.
- source_word: ὀλίγοι
  choice: కొద్దిమంది
  rationale: రక్షించబడిన వారి సంఖ్య స్వల్పమని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: ముందున్న ‘కొద్దిమంది’ అనే మాటను తరువాతి సంఖ్య వివరిస్తోందని సహజంగా సూచిస్తుంది.
- source_word: ψυχαί
  choice: మంది
  rationale: ఇక్కడ ψυχαί మనుష్యులను లెక్కించే అర్థంలో ఉంది; శరీరానికి వేరైన ఆత్మల గురించి సాంకేతిక ప్రకటన చేస్తున్నట్టు అపార్థం రాకుండా చేస్తుంది.
- source_word: διεσώθησαν
  choice: క్షేమంగా రక్షించబడ్డారు
  rationale: ప్రమాదం మధ్య నుంచి సురక్షితంగా తీసుకురాబడిన భావాన్ని నిలుపుతూనే, గ్రీకు క్రియలోని ‘రక్షించు’ అర్థాన్ని దాచదు.
- source_word: δι’ ὕδατος
  choice: నీటి గుండా
  rationale: διά + genitiveలోని సాధనం లేదా మధ్యగా గమనం అనే సాధ్యమైన భావాల్లో, వరద సందర్భానికి సరిపోయే ‘నీటి గుండా’ను ప్రధాన పాఠ్యంలో ఉంచుతుంది; ‘నీటి ద్వారా’ అనే సాధనార్థక అవకాశాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: διεσώθησαν పదంలోని రక్షణ సంబంధిత భావం
  choice: క్షేమంగా రక్షించబడ్డారు
  alternative: క్షేమంగా దాటించబడ్డారు
  rationale: క్రియలోని ప్రమాదం నుంచి సురక్షిత పరిరక్షణ భావాన్నీ ‘రక్షించు’ అనే మూలార్థాన్నీ రెండింటినీ నిలుపుతుంది; తరువాతి బాప్తిస్మ సూచనను ముందుగానే ఒక సిద్ధాంతార్థానికి పరిమితం చేయదు.
- issue: δι’ ὕδατος యొక్క సంబంధం
  choice: నీటి గుండా
  alternative: నీటి ద్వారా
  rationale: వ్యాకరణపరంగా సాధనం అనే భావం సాధ్యమైనప్పటికీ, నోవహు కుటుంబం వరదనీటి మధ్య క్షేమంగా రక్షించబడిన కథన సందర్భంలో ‘గుండా’ సహజంగా ఉంటుంది. నిజమైన ద్వంద్వార్థాన్ని పాదటిప్పణి ద్వారా నిలుపుతున్నాం.
- issue: ψυχαί యొక్క మానవ స్వరూప సంబంధిత పదప్రయోగం
  choice: ఎనిమిది మంది
  alternative: ఎనిమిది ప్రాణాలు
  rationale: ఇక్కడ ఉద్దేశం ఓడలో ఉన్న మనుష్యుల సంఖ్య; మానవుని ఆత్మ-శరీర నిర్మాణం గురించి సిద్ధాంత ప్రకటన కాదు. మరింత అక్షరార్థమైన రూపాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం. ప్రధాన పాఠ్యంలో ఉన్న [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
