id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: te
  text: దానికి అనురూపమైన బాప్తిస్మం[a] ఇప్పుడు మిమ్మల్ని కూడా రక్షిస్తుంది—అది శరీరంలోని మురికిని తొలగించడం కాదు, కానీ మంచి మనస్సాక్షి కోసం దేవునికి చేసే విజ్ఞప్తి. యేసు మెస్సీయ యొక్క పునరుత్థానం ద్వారా అది రక్షిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానికి ప్రతిరూపమైనది.” గ్రీకు పదం (ἀντίτυπον) ముందుగా చెప్పిన జలప్రళయపు నీటితో ఉన్న అనురూప సంబంధాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: దానికి అనురూపమైన
  rationale: ముందటి వచనంలో చెప్పిన జలప్రళయపు నీటిని వెనక్కి సూచిస్తూ, దానితో బాప్తిస్మానికి ఉన్న సాదృశ్య సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సాంకేతికమైన ‘ప్రతిరూపం’ అనే పదాన్ని నివారిస్తుంది.
- source_word: σῴζει
  choice: రక్షిస్తోంది
  rationale: వర్తమానకాల క్రియ యొక్క ప్రత్యక్ష బలాన్ని తగ్గించకుండా ఉంచుతుంది. తరువాతి మాటలే ఈ రక్షణ ఏ అర్థంలో చెప్పబడిందో వివరిస్తాయి.
- source_word: βάπτισμα
  choice: బాప్తిస్మం
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరమైన పదం; పేతురు దాన్ని కేవలం శరీర శుద్ధితో వేరుచేస్తున్నందున ‘కడగడం’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: σαρκὸς ἀπόθεσις ῥύπου
  choice: శరీరంపై ఉన్న మురికిని తొలగించడం
  rationale: ఇక్కడ σάρξ భౌతిక శరీరాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘శరీరంపై ఉన్న’ అని వ్యక్తం చేసి, బాహ్య శుభ్రత అనే భావాన్ని స్పష్టంగా ఉంచింది.
- source_word: συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν
  choice: మంచి మనస్సాక్షి కోసం దేవునికి చేసే విజ్ఞప్తి
  rationale: εἰς θεόν విజ్ఞప్తి దేవుని వైపు ఉద్దేశించబడిందని సూచిస్తుంది; జనిటివ్ పదబంధాన్ని ‘మంచి మనస్సాక్షి కోసం’గా తీసుకోవడం సందర్భానికి సహజం. ἐπερώτημα యొక్క వివాదాస్పదమైన ‘ప్రతిజ్ఞ’ భావాన్ని పాదసూచికలో నిలిపింది.
- source_word: δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ పునరుత్థానం ద్వారా
  rationale: διά + జనిటివ్ సాధనాన్ని సూచిస్తుంది. Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించింది.
theological_decisions:
- issue: రక్షణతో బాప్తిస్మానికి ఉన్న సంబంధం
  choice: ‘బాప్తిస్మం ఇప్పుడు మిమ్మల్ని కూడా రక్షిస్తోంది’ అనే ప్రత్యక్ష ప్రకటనను అలాగే ఉంచి, రచయిత ఇచ్చిన తదుపరి అర్హతలే దాని భావాన్ని నిర్దేశించేలా చేయడం.
  alternative: ‘బాప్తిస్మం రక్షణకు సంకేతం’ అని బలహీనపరచడం లేదా ఒక నిర్దిష్ట సాక్రమెంటల్ సిద్ధాంతాన్ని అనువాదంలో చేర్చడం.
  rationale: గ్రీకు వాక్యం బాప్తిస్మం రక్షిస్తుందని ప్రత్యక్షంగా చెబుతుంది; అదే సమయంలో అది కేవలం బాహ్య శరీర శుద్ధి కాదని, మనస్సాక్షి మరియు యేసు పునరుత్థానంతో ముడిపడి ఉందని వివరిస్తుంది. ఈ ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
- issue: ἐπερώτημα యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘విజ్ఞప్తి’; పాదసూచికలో ‘ప్రతిజ్ఞ’ లేదా ‘సమాధానం’.
  alternative: ప్రధాన పాఠ్యంలో ‘ప్రతిజ్ఞ’ లేదా ‘సమాధానం’.
  rationale: ఈ పదానికి విజ్ఞప్తి/అభ్యర్థన అనే అర్థంతో పాటు ప్రతిజ్ఞ లేదా సమాధానం అనే అర్థం కూడా సాధ్యమే. εἰς θεόν కారణంగా దేవునికి చేసే ‘విజ్ఞప్తి’ ప్రధాన పాఠ్యానికి సముచితం; నిజమైన అనిశ్చితిని పాదసూచిక సంరక్షిస్తుంది.
- issue: చివరి δι’ ἀναστάσεως పదబంధం దేనితో అనుసంధానమవుతుంది
  choice: ‘ఇది ... ద్వారా రక్షిస్తోంది’ అని పునరుక్తితో రక్షణ క్రియకు అనుసంధానించడం.
  alternative: దాన్ని వెంటనే ముందున్న ‘విజ్ఞప్తి’తో కలిసినట్టుగా ఒకే దీర్ఘ వాక్యంలో ఉంచడం.
  rationale: గ్రీకు పదక్రమంలో చివర ఉన్న పదబంధం ప్రధాన క్రియ అయిన σῴζει యొక్క సాధనాన్ని సహజంగా తెలియజేస్తుంది. తెలుగులో అస్పష్టమైన సమీప అనుసంధానాన్ని నివారించేందుకు క్రియను పునరుక్తి చేసింది, కొత్త సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘బాప్తిస్మం,’ ‘మనస్సాక్షి,’ ‘మెస్సీయ’ వంటి స్థిరమైన విశ్వాసపర పదాలను ఉంచి, మిగతా నిర్మాణాన్ని సహజమైన తెలుగు వాక్యాలుగా విభజించింది.
