id: 1PE.3.15
reference: 1 Peter 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: te
  text: అయితే ప్రభువైన మెస్సీయను మీ హృదయాల్లో పరిశుద్ధునిగా గౌరవించండి[a]. మీలో ఉన్న నిరీక్షణ గురించి కారణం అడిగే ప్రతి ఒక్కరికీ సమర్థన ఇవ్వడానికి ఎల్లప్పుడూ సిద్ధంగా ఉండండి[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ప్రభువైన మెస్సీయను మీ హృదయాల్లో పరిశుద్ధపరచండి.”
    reason: lexical_alternative
  - marker: b
    text: “సమర్థన ఇవ్వడానికి” అని అనువదించిన గ్రీకు పదబంధం, ఒకరి నిరీక్షణను గురించి వివరణ లేదా సమర్థన ఇవ్వడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: κύριον ... τὸν Χριστόν
  choice: ప్రభువైన మెస్సీయను
  rationale: κύριος అనే బిరుదును ‘ప్రభువు’గా, Χριστός అనే బిరుదును ‘మెస్సీయ’గా అందిస్తూ, రెండింటినీ ఒకే వ్యక్తిని సూచించే గ్రీకు నిర్మాణానికి అనుగుణంగా కలిపింది.
- source_word: ἁγιάσατε
  choice: పరిశుద్ధునిగా గౌరవించండి
  rationale: అక్షరార్థమైన ‘పరిశుద్ధపరచండి’ అనే రూపం మెస్సీయను మనుషులు పరిశుద్ధునిగా చేస్తారనే అపార్థం కలిగించవచ్చు. ఈ సందర్భంలో ఆయనను పరిశుద్ధ ప్రభువుగా అంతరంగంలో గుర్తించి గౌరవించాలనే ఆజ్ఞను ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: మీ హృదయాల్లో
  rationale: అంతరంగాన్ని సూచించే καρδία భావాన్నీ, బహువచన సంబోధననూ నేరుగా నిలుపుతుంది.
- source_word: ἕτοιμοι ἀεὶ
  choice: ఎల్లప్పుడూ సిద్ధంగా ఉండండి
  rationale: ἀεί యొక్క నిరంతర భావాన్నీ, ἕτοιμοι అనే సిద్ధస్థితినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρὸς ἀπολογίαν
  choice: సమర్థనతో జవాబు ఇవ్వడానికి
  rationale: ἀπολογίαలోని వివరణాత్మక జవాబు మరియు సమర్థన అనే రెండు ఛాయలనూ సాధారణ పాఠకుడికి అర్థమయ్యేలా కలిపి అందిస్తుంది.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον
  choice: మిమ్మల్ని కారణం అడిగే ప్రతి ఒక్కరికీ
  rationale: παντί యొక్క సమగ్ర భావాన్ని ‘ప్రతి ఒక్కరికీ’గా నిలుపుతూ, λόγος ఇక్కడ సూచించే కారణం లేదా వివరణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: మీలో ఉన్న నిరీక్షణ గురించి
  rationale: περί యొక్క ‘గురించి’ భావాన్నీ, ἐν ὑμῖν యొక్క అంతర్గత/సామూహిక భావాన్నీ దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός κύριοςతో కలిసి బిరుదుగా పనిచేస్తోంది. అందువల్ల దాని అభిషిక్త రాజు అనే బిరుదు భావాన్ని స్పష్టంగా ఉంచేందుకు ‘మెస్సీయ’ను ఎంచుకుంది.
- issue: మెస్సీయను ఉద్దేశించిన ἁγιάσατε భావం
  choice: పరిశుద్ధునిగా గౌరవించండి
  alternative: పరిశుద్ధపరచండి
  rationale: విశ్వాసులు మెస్సీయను పరిశుద్ధునిగా చేస్తారని కాక, ఆయనను తమ హృదయాల్లో పరిశుద్ధ ప్రభువుగా గుర్తించి గౌరవించాలని వాక్యం ఆదేశిస్తుంది. అయినా ‘పరిశుద్ధ’ అనే మూలభావాన్ని ప్రధాన పాఠ్యంలోనే నిలిపింది.
- issue: κύριον ... τὸν Χριστόν నిర్మాణం
  choice: ప్రభువైన మెస్సీయను
  alternative: మెస్సీయను ప్రభువుగా
  rationale: రెండు నిర్మాణాలూ గ్రీకు వాక్యంలోని సంబంధాన్ని వ్యక్తం చేయగలవు. ఎంపిక చేసిన రూపం ‘ప్రభువు’ మరియు ‘మెస్సీయ’ అనే రెండు బిరుదులనూ స్పష్టంగా ఉంచి, ఆయనను పరిశుద్ధునిగా గౌరవించాలనే ప్రధాన క్రియతో సహజంగా కలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘ప్రతిష్ఠించండి’ వంటి అస్పష్టమైన ఆచారపరమైన పదాన్ని నివారించి, సాధారణ పాఠకుడికి స్పష్టమైన ‘గౌరవించండి’ను ఎంచుకుంది; ἀπολογία యొక్క సమర్థన భావాన్ని పూర్తిగా కోల్పోకుండా సహజమైన ‘సమర్థనతో జవాబు’ను ఉపయోగించింది.
