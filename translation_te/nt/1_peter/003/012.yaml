id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: te
  text: ఎందుకంటే ప్రభువు కన్నులు నీతిమంతుల మీద ఉన్నాయి; వారి ప్రార్థనను వినడానికి ఆయన చెవులు తెరిచి ఉన్నాయి.[a] అయితే ప్రభువు ముఖం చెడు చేసేవారికి విరోధంగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆయన చెవులు వారి ప్రార్థన వైపు ఉన్నాయి”; వారి ప్రార్థనను శ్రద్ధగా వినడానికి ఆయన సిద్ధంగా ఉన్నారనే భావాన్ని తెలుగులో స్పష్టత కోసం చేర్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి ఈ వాక్యం కారణాన్ని లేదా ఆధారాన్ని తెలియజేస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఆ కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: ప్రభువు కన్నులు నీతిమంతుల మీద ఉన్నాయి
  rationale: దేవుని శ్రద్ధగల అనుగ్రహ దృష్టిని సూచించే శరీరరూపకాన్ని, అలాగే ἐπί యొక్క దిశార్థాన్ని నిలుపుతుంది.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: ఆయన చెవులు వారి ప్రార్థన వైపు ఉన్నాయి
  rationale: గ్రీకు మూలంలోని సంక్షిప్తమైన ‘వారి ప్రార్థన వైపు ఆయన చెవులు’ అనే రూపాన్ని సాధ్యమైనంత దగ్గరగా ఉంచి, వినడానికి సిద్ధంగా ఉండటం అనే భావాన్ని సూచిస్తుంది; ‘వింటాడు’ అని స్పష్టీకరించి భావాన్ని పూర్తిగా పరిష్కరించదు.
- source_word: πρόσωπον δὲ κυρίου
  choice: అయితే ప్రభువు ముఖం
  rationale: δέ ఇక్కడ వ్యతిరేక భావాన్ని ఇస్తుంది; ‘ముఖం’ అనే మూల రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: చెడు చేసేవారికి విరోధంగా ఉంది
  rationale: ప్రతికూల సందర్భంలో ἐπί శత్రుత్వపూర్వక దిశను సూచిస్తుంది; ‘చెడు చేసేవారు’ అనే రూపం గ్రీకు వర్తమాన కృదంతంలోని క్రియాత్మక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దేవుని కన్నులు, చెవులు, ముఖం అనే మానవరూప వర్ణన
  choice: రూపకాలను అనువాదంలో నేరుగా నిలుపడం
  alternative: ‘ప్రభువు నీతిమంతులను కాపాడుతూ వారి ప్రార్థన వింటాడు’ అని భావానువాదం చేయడం
  rationale: కీర్తన ఉల్లేఖనంలోని సాహిత్య, వేదాంత బలాన్ని ఈ శరీరరూపకాలు మోస్తాయి. వాటిని వివరణాత్మక భావానువాదంతో తొలగించకుండా మూలంలోని ఉద్దేశపూర్వక చిత్రణను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. కీర్తన ఉల్లేఖనంలోని సమాంతర నిర్మాణం, మానవరూప చిత్రణ, నీతిమంతులపట్ల అనుగ్రహం మరియు చెడు చేసేవారిపట్ల విరోధం మధ్య వ్యత్యాసం నిలుపబడ్డాయి.
