id: 1PE.3.5
reference: 1 Peter 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: te
  text: ఎందుకంటే, పూర్వకాలంలో దేవునిపై నిరీక్షణ ఉంచిన పవిత్ర స్త్రీలు కూడా తమ సొంత భర్తలకు లోబడుతూ, ఈ విధంగానే తమను తాము అలంకరించుకునేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: ఈ విధంగానే
  rationale: ముందటి సందర్భంలో వివరించిన అలంకరణ విధానాన్ని వెనక్కి సూచించే క్రియావిశేషణ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి ఆధారం లేదా వివరణను పరిచయం చేసే అనుసంధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ποτε
  choice: పూర్వకాలంలో
  rationale: గత తరాలకు చెందిన స్త్రీలను సూచించే కాలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἅγιαι γυναῖκες
  choice: పవిత్ర స్త్రీలు
  rationale: ἅγιαι అనే విశేషణం యొక్క ప్రామాణిక అర్థాన్ని బలహీనపరచకుండా నిలుపుతుంది.
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: దేవునిపై నిరీక్షణ ఉంచిన
  rationale: ఈ వర్తమాన కృదంతం ఆ స్త్రీలను లక్షణాత్మకంగా వర్ణిస్తుంది; దేవుడే వారి నిరీక్షణకు ఆధారమని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: ἐκόσμουν ἑαυτάς
  choice: తమను తాము అలంకరించుకునేవారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని అలవాటైన లేదా కొనసాగిన చర్యను తెలుపుతూ, ముందటి వచనాలలోని అలంకరణ భావంతో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ὑποτασσόμεναι
  choice: లోబడుతూ
  rationale: ప్రధాన క్రియతో సమకాలికంగా దాని విధానాన్ని తెలిపే కృదంత సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: తమ సొంత భర్తలకు
  rationale: గృహసంబంధ సందర్భంలో ἀνδράσιν అంటే భర్తలు; ἰδίοις వల్ల ఈ మాట వారి వైవాహిక సంబంధానికే పరిమితమని స్పష్టమవుతుంది.
theological_decisions:
- issue: వైవాహిక లోబడుటను ఎలా అనువదించాలి
  choice: తమ సొంత భర్తలకు లోబడుతూ
  alternative: తమ భర్తలకు విధేయులై ఉంటూ
  rationale: కృదంత రూపాన్ని, అలాగే ‘తమ సొంత’ అనే సంబంధ పరిమితిని నిలుపుతుంది. ‘విధేయత’ అని విస్తరించి అర్థనిర్ణయం చేయకుండా మూలంలోని లోబడుట భావాన్ని అనువదిస్తుంది; దీనిని స్త్రీలందరికీ పురుషులందరితో ఉన్న సంబంధంపై సాధారణ సిద్ధాంతంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని వివరణాత్మక అనుసంధానం, గతకాలపు అలవాటు చర్య, కృదంత సంబంధం, వైవాహిక పరిధి అన్నీ సహజమైన తెలుగు పదక్రమంలో నిలుపబడ్డాయి.
