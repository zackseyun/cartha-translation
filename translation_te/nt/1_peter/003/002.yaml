  yaml_path: translation/nt/1_peter/003/002.yaml
  text: when they observe your pure conduct in fear.
translation:
  language: te
  text: వారు భయంతో కూడిన మీ స్వచ్ఛమైన ప్రవర్తనను గమనించినప్పుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: వారు గమనించినప్పుడు
  rationale: సందర్భంలోని భర్తలను సూచించే కర్తను తెలుగులో స్పష్టంగా ఉంచుతూ, శ్రద్ధగా ప్రత్యక్షంగా చూడడం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἁγνὴν
  choice: పవిత్ర
  rationale: నైతిక స్వచ్ఛత, కల్మషరాహిత్యం అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ἀναστροφὴν
  choice: ప్రవర్తనను
  rationale: జీవన విధానం లేదా నడవడి అనే విస్తృత భావాన్ని ఈ సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: ἐν φόβῳ
  choice: భయంతో కూడిన
  rationale: గ్రీకు పదబంధంలోని ‘భయంలో/భయంతో లక్షణీకరించబడిన’ భావాన్ని నిలుపుతుంది; భయం ఎవరిపట్లనో పాఠ్యం చెప్పనందున దానిని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ἐν φόβῳ అనే పదబంధంలో భయానికి ఉద్దేశం
  choice: భయంతో కూడిన
  alternative: దేవునిపట్ల భయభక్తులతో కూడిన
  rationale: ఈ వాక్యంలో భయానికి ఉద్దేశం స్పష్టంగా పేర్కొనబడలేదు. కాబట్టి దేవుడు, భర్త లేదా మరొక ఉద్దేశాన్ని అనువాదంలో చేర్చకుండా మూలంలోని అస్పష్టతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన వాక్యఖండం. ముందు వాక్యంతో వ్యాకరణపరంగా కలిసేలా ‘గమనించినప్పుడు’ ఉపయోగించబడింది.
