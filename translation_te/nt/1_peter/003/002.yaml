    issue: ἁγνὴν is rendered ‘పవిత్ర’
    rationale: In this context ἁγνή describes pure, morally undefiled conduct. ‘పవిత్ర’ may be read primarily as holy/sacred; ‘స్వచ్ఛమైన’ communicates the intended ethical purity more directly in modern Telugu.
  revised_text: వారు భయంతో కూడిన మీ స్వచ్ఛమైన ప్రవర్తనను గమనించినప్పుడు.
