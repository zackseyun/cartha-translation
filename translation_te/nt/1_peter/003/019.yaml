  to: దీనిలో కూడా ఆయన వెళ్లి, చెరలో ఉన్న ఆత్మలకు[c] ప్రకటించాడు.[b][a]
  rationale: The revision replaces the interpretively narrowed ‘ఆ స్థితిలోనే’ with ‘దీనిలో కూడా,’ retaining the dative-relative connection and additive καί without deciding whether the relation is personal, instrumental, or locative/spherical. It preserves the source’s unspecified spirits and unspecified content of the proclamation, while making the related footnotes idiomatic and semantically precise.
