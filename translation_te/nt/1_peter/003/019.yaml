  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనలో’; మరో విధంగా, ‘దాని ద్వారా.’ ముందటి వాక్యభాగంతో దీనికి ఉన్న సంబంధాన్ని గ్రీకు పదబంధం ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకునే వీలు కల్పిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ప్రచారం చేశాడు.’ ఇక్కడి గ్రీకు క్రియ ఒక ప్రకటన చేయడాన్ని సూచిస్తుంది; అయితే ఆ సందేశం ఏమిటో ఈ వచనం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
