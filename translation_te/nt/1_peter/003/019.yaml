    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఆ స్థితిలోనే
  rationale: దత్తివ ఏకవచన నపుంసక సంబంధసర్వనామం ముందున్న πνεύματιతో సంబంధాన్ని సూచించవచ్చు. తెలుగులో పదశః ‘దేనిలో’ అనడం అసహజం కావడంతో, ‘ఆ స్థితిలోనే’ అని ఇచ్చి సంబంధాన్ని ఉంచుతూ దాని ఖచ్చిత స్వరూపాన్ని ప్రధాన పాఠంలో నిర్ణయించలేదు.
- source_word: καὶ
  choice: -నే
  rationale: ఇక్కడ καί ముందటి వాక్యంతో ఈ కార్యాన్ని అదనంగా అనుసంధానిస్తుంది; తెలుగు వాక్యంలో ‘ఆ స్థితిలోనే’ అనే రూపం ‘కూడా/అదే స్థితిలో’ అనే అనుబంధ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς ... πνεύμασιν
  choice: ఆత్మలకు
  rationale: πνεύμασινకు నేరమైన సమానార్థకం ‘ఆత్మలు.’ ‘మనుషుల ఆత్మలు’ లేదా ‘దూతలు’ అని చెప్పడం మూలపాఠంలోని గుర్తింపు అస్పష్టతను తొలగిస్తుంది.
- source_word: ἐν φυλακῇ
  choice: చెరలో ఉన్న
  rationale: φυλακή కాపలా, నిర్బంధం, చెర అనే భావాలను కలిగి ఉంటుంది. ‘చెరలో’ ఆధునిక తెలుగులో సహజంగా ఉండి నిర్బంధ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: πορευθεὶς
  choice: వెళ్లి
  rationale: అయోరిస్ట్ కృదంతంలోని గమన భావాన్ని తెలుగు క్రమక్రియా రూపం ‘వెళ్లి’ సహజంగా నిలుపుతుంది; అవసరానికి మించిన కాలవ్యాఖ్యను జోడించదు.
- source_word: ἐκήρυξεν
  choice: ప్రకటించాడు
  rationale: κηρύσσω అంటే దూతవలె బహిరంగంగా ప్రకటన చేయడం. ‘సువార్త ప్రకటించాడు’ లేదా ‘బోధించాడు’ అని చెప్పకుండా సందేశ స్వరూపాన్ని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ἐν ᾧ యొక్క సంబంధార్థం
  choice: ప్రధాన పాఠంలో ‘ఆ స్థితిలోనే’ అని తటస్థంగా అనువదించబడింది.
  alternative: ‘ఆయనలోనే’; ‘దాని ద్వారా’; ‘ఆత్మలోనే’
  rationale: గ్రీకు పదబంధం ముందటి వాక్యంలోని πνεύματιతో ఏ విధంగా సంబంధించిందో వివాదాస్పదం. అనువాదం వ్యక్తి, సాధనం, లేదా కార్యక్షేత్రం అనే ఒక్క వ్యాఖ్యానాన్ని సిద్ధాంతపరంగా ఖరారు చేయదు.
- issue: ‘చెరలో ఉన్న ఆత్మలు’ ఎవరు?
  choice: ప్రధాన పాఠంలో వారి గుర్తింపును పేర్కొనకుండా ఉంచడం
  alternative: మరణించిన మనుషులు; పతిత దూత సంబంధమైన ఆత్మీయ జీవులు; విస్తృతమైన చెరబడ్డ ఆత్మల వర్గం
  rationale: గ్రీకు వాక్యభాగం వీరిని మరింత స్పష్టంగా గుర్తించదు. అందువల్ల అనువాదం చారిత్రక వ్యాఖ్యాన భేదాల్లో ఒకదాన్ని నిర్ణయించదు.
- issue: ἐκήρυξενలోని సందేశ స్వభావం
  choice: ‘ప్రకటించాడు’
  alternative: సువార్త ప్రకటించాడు; తీర్పు ప్రకటించాడు; విజయాన్ని చాటాడు
  rationale: క్రియ ప్రకటన చేయడాన్ని సూచిస్తుంది గాని దాని విషయాన్ని ఈ వచనంలో చెప్పదు. ‘ప్రకటించాడు’ ఆ తెరవుదలను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చెరలో ఉన్న ఆత్మలు’ మరియు ‘ప్రకటించాడు’ అనే పదప్రయోగాలు మూలంలోని అస్పష్టతను కాపాడుతాయి. పాదసూచిక గుర్తులు అన్నీ ప్రధాన పాఠంలో చేర్చబడ్డాయి.
