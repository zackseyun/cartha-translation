- from: ఎందుకంటే, జీవితాన్ని ప్రేమించి మంచి రోజులు చూడాలని కోరుకునే వ్యక్తి తన నాలుకను చెడు నుండి, తన పెదవులను మోసం పలకకుండా కాపాడుకోవాలి.[a]
  to: ఎందుకంటే, జీవితాన్ని ప్రేమించి మంచి రోజులను చూడాలని కోరుకునే వ్యక్తి తన నాలుకను చెడు పలకకుండా, తన పెదవులను మోసం పలకకుండా అదుపులో ఉంచాలి.[a]
  rationale: The revision replaces the potentially misleading “కాపాడుకోవాలి” with “అదుపులో ఉంచాలి,” which naturally expresses the imperative of restraint. “చెడు పలకకుండా” makes explicit in Telugu that the tongue is being restrained from evil speech; this is supplied by the immediate parallel with speaking deceit and does not restrict the broad moral force of κακοῦ. The footnote marker and lexical alternative are retained.
