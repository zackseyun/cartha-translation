id: 1PE.3.10
reference: 1 Peter 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: te
  text: ఎందుకంటే, జీవితాన్ని ప్రేమించి మంచి రోజులను చూడాలని కోరుకునే వ్యక్తి తన నాలుకను చెడు పలకకుండా, తన పెదవులను మోసం పలకకుండా అదుపులో ఉంచాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కపటం పలకకుండా.” గ్రీకు నామవాచకం మోసం, ద్రోహం లేదా కపటం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: కోరుకునే వ్యక్తి
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతం ఎవరినైనా సాధారణంగా సూచిస్తుంది. ఈ ఎంపిక ఏ లింగానికీ పరిమితం చేయకుండా గ్రీకు ఏకవచన ప్రతినిధి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణంగా లేదా లేఖనాధారంగా ఈ వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: ζωὴν ἀγαπᾶν
  choice: జీవితాన్ని ప్రేమించి
  rationale: గ్రీకు పదబంధాన్ని సూటిగా ప్రతిబింబిస్తూ, మూలంలో లేని స్వామ్యార్థాన్ని చేర్చదు.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: మంచి రోజులు చూడాలని
  rationale: ‘చూడడం’ అనే స్పష్టమైన గ్రీకు రూపకాన్ని ఉంచుతుంది; ‘మంచి’ అనేది కేవలం ఆర్థిక సమృద్ధికి పరిమితం కాని విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: παυσάτω
  choice: కాపాడుకోవాలి
  rationale: రూపరీత్యా ఆజ్ఞార్థకమైన ‘ఆపాలి/మానాలి’ అనే భావాన్ని, తరువాతి ἀπό మరియు నిరోధక infinitive నిర్మాణాలతో సహజ తెలుగు ఉపదేశంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: తన నాలుకను చెడు నుండి
  rationale: శరీర భాగంతో తెలుగు సహజ వాడుకకు అనుగుణంగా ప్రతినిధి ఏకవచన స్వామ్యపదం వాడబడింది; ‘చెడు’ అనే పదం మూలంలోని విస్తృత భావాన్ని ఉంచుతుంది.
- source_word: χείλη
  choice: తన పెదవులను
  rationale: గ్రీకులోని బహువచన శరీరాంగ చిత్రణను నిలుపుతూ, తెలుగులో సహజమైన స్వామ్యరూపాన్ని వాడుతుంది.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: మోసం పలకకుండా
  rationale: నిరోధం/ఉద్దేశాన్ని సూచించే articular infinitive భావాన్ని సహజంగా అందిస్తుంది. δόλος యొక్క మోసపూరిత మాట అనే భావం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: సాధారణ ప్రతినిధి ఏకవచనం మరియు లింగ సూచన
  choice: ‘కోరుకునే వ్యక్తి’ మరియు ‘తన’ అనే లింగనిరపేక్ష ఏకవచన రూపాలు
  alternative: ‘కోరుకునేవాడు ... అతని’ వంటి వ్యాకరణపరంగా పుంలింగ రూపాలు
  rationale: గ్రీకు వాక్యం ఏకవచనమైనా సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుంది. తెలుగు ‘వ్యక్తి/తన’ రూపాలు ఏకవచన సమన్వయాన్నీ సాధారణ వర్తింపునూ కాపాడి, పురుషులకు మాత్రమే పరిమితమైన భావాన్ని కలిగించవు.
- issue: παυσάτω యొక్క ఆజ్ఞార్థక బలం
  choice: ‘కాపాడుకోవాలి’ అనే విధ్యర్థక ఉపదేశం
  alternative: ‘ఆపాలి’ లేదా ‘మానాలి’
  rationale: మూలంలోని ఆజ్ఞార్థక బలాన్ని నిలుపుతూ, నాలుకను చెడు నుండి మరియు పెదవులను మోసం పలకకుండా నిరోధించాలనే సమాంతర భావాన్ని సహజ తెలుగులో తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఉపదేశ శైలి వాడబడింది. కీర్తన ఉల్లేఖనంలోని ‘జీవితాన్ని ప్రేమించడం,’ ‘మంచి రోజులు చూడడం,’ ‘నాలుక,’ ‘పెదవులు’ అనే స్పష్టమైన చిత్రణలు నిలుపబడ్డాయి; [a] గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
