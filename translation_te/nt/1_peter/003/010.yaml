review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the generic subject, desire to love life and see good days, and the twofold injunction. However, “తన నాలుకను చెడు నుండి ... కాపాడుకోవాలి” is not a natural Telugu rendering of παυσάτω and can suggest protecting the tongue from external evil, rather than restraining it from evil speech. The revision makes the required restraint explicit while retaining the broad sense of κακός.
  naturalness: The revised parallel wording, “తన నాలుకను చెడు పలకకుండా, తన పెదవులను మోసం పలకకుండా అదుపులో ఉంచాలి,” is idiomatic modern standard Telugu and clearly applies the restraint to speech.
  terminology: “జీవితాన్ని ప్రేమించి,” “మంచి రోజులను చూడాలని,” “నాలుక,” “పెదవులు,” and “మోసం” are suitable, accessible choices. The footnote appropriately preserves “కపటం” as a lexical alternative for δόλος without narrowing its range.
  issues:
  - severity: medium
    issue: “కాపాడుకోవాలి” for παυσάτω
    rationale: This normally means ‘protect/preserve oneself’ and, with “చెడు నుండి,” may imply guarding the tongue against evil rather than stopping it from evil utterance. παυσάτω calls for ceasing or restraining speech.
  revised_text: ఎందుకంటే, జీవితాన్ని ప్రేమించి మంచి రోజులను చూడాలని కోరుకునే వ్యక్తి తన నాలుకను చెడు పలకకుండా, తన పెదవులను మోసం పలకకుండా అదుపులో ఉంచాలి.[a]
