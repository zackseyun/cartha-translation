id: 1PE.3.8
reference: 1 Peter 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: te
  text: చివరిగా, మీరందరూ ఒకే మనసు గలవారిగా, ఒకరి భావాలను మరొకరు పంచుకునేవారిగా, సోదర ప్రేమ గలవారిగా[a], కనికర హృదయులుగా, వినయ మనస్కులుగా[b] ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో తోబుట్టువుల కుటుంబ భాష వాడబడింది; ఇక్కడ అది విశ్వాస సమాజంలోని స్త్రీపురుషులందరినీ కలుపుకొని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో ‘వినయ మనస్కులు’కు బదులుగా ‘మర్యాదగలవారు’ లేదా ‘స్నేహపూర్వకులు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: చివరిగా
  rationale: హెచ్చరికల ముగింపు సారాంశాన్ని పరిచయం చేసే సహజమైన తెలుగు సంధాన పదం; ‘అంతం’ అనే అక్షరార్థాన్ని అనవసరంగా సూచించదు.
- source_word: πάντες
  choice: మీరందరూ
  rationale: సమాజమంతటినీ నేరుగా ఉద్దేశించిన భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁμόφρονες
  choice: ఒకే మనసు గలవారిగా
  rationale: ఒకే విధమైన మనోభావం, దృక్పథ ఐక్యత అనే భావాన్ని సహజంగా నిలుపుతుంది; అన్ని విషయాల్లో పూర్తి ఏకాభిప్రాయం అనే అతిశయార్థాన్ని బలవంతంగా చేర్చదు.
- source_word: συμπαθεῖς
  choice: ఒకరి భావాలను మరొకరు పంచుకునేవారిగా
  rationale: ఇతరుల అనుభూతులతో పాలుపంచుకోవడం అనే మూలపద భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: φιλάδελφοι
  choice: సోదర ప్రేమ గలవారిగా
  rationale: విశ్వాస సమాజంలోని కుటుంబసదృశమైన తోబుట్టువుల ప్రేమను సూచించే గ్రీకు రూపకాన్ని నిలుపుతుంది.
- source_word: εὔσπλαγχνοι
  choice: కనికర హృదయులుగా
  rationale: లోతైన అంతరంగ కనికరాన్ని, హృదయపూర్వక దయను గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ταπεινόφρονες
  choice: వినయ మనస్కులుగా
  rationale: కేవలం బాహ్య వినయం కాక, మనోభావంలో వినయం అనే సమాసపదంలోని భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: φιλάδελφοι లోని లింగసూచక కుటుంబ భాష
  choice: సోదర ప్రేమ గలవారిగా
  alternative: తోబుట్టువులవలె ఒకరినొకరు ప్రేమించేవారిగా
  rationale: గ్రీకు పదంలోని కుటుంబ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది విశ్వాస సమాజంలోని స్త్రీపురుషులందరినీ ఉద్దేశిస్తుందని పాదటిప్పణిలో స్పష్టం చేయబడింది.
- issue: చివరి విశేషణానికి సంబంధించిన పాఠాంతరం
  choice: ταπεινόφρονες — వినయ మనస్కులుగా
  alternative: φιλόφρονες — మర్యాదగలవారిగా లేదా స్నేహపూర్వకులుగా
  rationale: SBLGNT మూలపాఠంలోని బలమైన పాఠరూపాన్ని ప్రధాన పాఠ్యంలో అనుసరించి, ప్రాముఖ్యమైన ప్రత్యామ్నాయ పాఠాన్ని పాదటిప్పణిలో భద్రపరచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఉపదేశ శైలి వాడబడింది. గ్రీకులో క్రియ లేకపోయినా, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భానుసారంగా ‘ఉండండి’ చేర్చబడింది. సమాంతర విశేషణాల లయను ‘-వారిగా/-లుగా’ రూపాలతో నిలుపుకున్నాం.
