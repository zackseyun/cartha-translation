source:
  edition: SBLGNT
  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: te
  text: అయితే అతడు చెడు నుండి తొలగి మేలు చేయాలి[a]; శాంతిని వెదకి దానిని వెంబడించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక వ్యక్తి చెడు నుండి తొలగి మేలు చేయాలి; శాంతిని వెదకి దానిని వెంబడించాలి.” గ్రీకులో పురుష ఏకవచన రూపం ప్రతినిధి భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: విడిచిపెట్టి
  rationale: దిశ మార్చుకొని దూరమయ్యే ἐκκλίνω భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘నివారించాలి’ కంటే నిర్ణయాత్మక చర్యను స్పష్టంగా చూపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంతో కొనసాగింపును, స్వల్ప వ్యత్యాసాన్ని సూచించే δέ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἀπὸ κακοῦ
  choice: చెడును
  rationale: ఇక్కడ κακόν నైతిక చెడును సూచిస్తుంది; తరువాతి ‘మేలు’తో ఉన్న వ్యత్యాసాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ποιησάτω ἀγαθόν
  choice: మేలు చేయాలి
  rationale: క్రియాశీల నైతిక ఆజ్ఞను సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ζητησάτω
  choice: వెదకి
  rationale: ζητέω యొక్క ‘వెదకడం’ భావాన్ని నిలుపుతూ, తరువాతి బలమైన διώκωతో ఉన్న వాక్చాతుర్య పురోగతిని కాపాడుతుంది.
- source_word: εἰρήνην
  choice: శాంతిని
  rationale: εἰρήνη యొక్క విస్తృత బైబిలు భావాన్ని మోయగల ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: διωξάτω αὐτήν
  choice: దాని వెంట పట్టుదలగా సాగాలి
  rationale: ‘శాంతి’ని లక్ష్యంగా చేసుకొని చురుకుగా, నిరంతరంగా వెంబడించే διώκω బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘దాని’ అనే సర్వనామం శాంతినే సూచిస్తుంది.
- source_word: 3rd person singular imperatives across the verse
  choice: అతడు ... చేయాలి
  rationale: గ్రీకులోని పురుష ఏకవచన ప్రతినిధి రూపాన్ని నిలుపుతూ, మూడవ పురుష ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆజ్ఞారూపాల్లోని సాధారణార్థక పురుష ఏకవచనం
  choice: ప్రధాన పాఠ్యంలో ‘అతడు’ అనే ఏకవచన పురుష రూపాన్ని ఉంచడం
  alternative: ‘ఒక వ్యక్తి’ లేదా బహువచన సాధారణ రూపాన్ని వాడడం
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా పురుష ఏకవచనమైనా ప్రతినిధి/సాధారణార్థకంగా వాడబడింది. మూల రూపాన్ని కాపాడుతూ, అది పురుషులకు మాత్రమే పరిమితం కాదని పాదటిప్పణి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన లయతో రూపొందించబడింది. కీర్తన ఉల్లేఖనంలోని వరుస ఆజ్ఞల నిర్మాణం మరియు ‘వెదకడం—వెంట సాగడం’ అనే భావతీవ్రత కాపాడబడ్డాయి.
