id: 1PE.3.22
reference: 1 Peter 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: te
  text: ఆయన పరలోకంలోకి వెళ్లి[a], దేవుని కుడివైపున ఉన్నాడు; దూతలు, అధికారాలు, శక్తులు ఆయనకు లోబరచబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకానికి వెళ్లి.” గ్రీకు వాచ్యార్థం “పరలోకంలోకి వెళ్లి.”
    reason: εἰς οὐρανόν లోని దిశార్థాన్ని ప్రధాన పాఠం మరింత అక్షరార్థంగా ఇస్తుంది; ‘పరలోకానికి’ అనేది సహజమైన ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ὅς
  choice: ఆయన
  rationale: ముందటి వచనంలోని యేసు క్రీస్తును సూచించే సంబంధ సర్వనామం. తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం ‘ఆయన’ అని ఇచ్చినా, మునుపటి వాక్యంతో ఉన్న సూచన సంబంధం నిలుస్తుంది.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: దేవుని కుడివైపున
  rationale: ఉన్నత స్థానం, ఘనతను సూచించే బైబిలు సంబంధ రూపకాన్ని వివరణగా మార్చకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: పరలోకంలోకి వెళ్లి
  rationale: Aorist participle సూచించే ముందరి చర్యను ‘వెళ్లి’ నిలుపుతుంది; εἰς యొక్క లోనికి సాగే దిశను ‘లోకి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὑποταγέντων αὐτῷ
  choice: ఆయనకు లోబరచబడ్డాయి
  rationale: గ్రీకు passive రూపాన్ని కాపాడుతూ, అవి తమంతట తామే లోబడినట్లు కాక లోబరచబడినట్లు తెలియజేస్తుంది; αὐτῷ ను ‘ఆయనకు’గా నేరుగా అనువదిస్తుంది.
- source_word: ἀγγέλων
  choice: దూతలు
  rationale: ఈ పరలోక అధికారాల సందర్భంలో మానవ సందేశకులు కాక దేవదూతలనే సూచిస్తుంది; ‘దూతలు’ ప్రామాణిక బైబిలు తెలుగు పదం.
- source_word: ἐξουσιῶν
  choice: అధికారాలు
  rationale: ఆత్మసంబంధ లేదా విశ్వసంబంధ అధికార వర్గాన్ని సూచిస్తూ, తరువాతి ‘శక్తులు’ నుండి పదభేదాన్ని కాపాడుతుంది.
- source_word: δυνάμεων
  choice: శక్తులు
  rationale: విశ్వసంబంధ శక్తుల జాబితాలోని పదాన్ని సంక్షిప్తంగా అందిస్తూ, ‘అధికారాలు’తో ఉన్న త్రివిధ క్రమాన్ని నిలుపుతుంది.
theological_decisions:
- issue: క్రీస్తు దేవుని కుడివైపున ఉండడం
  choice: ‘దేవుని కుడివైపున’ అనే స్థల-సంబంధ బైబిలు ప్రయోగాన్ని యథాతథంగా నిలుపడం
  alternative: ‘దేవుని పక్కన అత్యున్నత ఘనస్థానంలో’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలంలోని ప్రయోగం క్రీస్తు ఉన్నతీకరణను, ఘనతను మోస్తుంది. దాన్ని కేవలం వివరణగా మార్చడం అనువాదం కంటే వ్యాఖ్యానం అవుతుంది.
- issue: ‘దూతలు, అధికారాలు, శక్తులు’ ఎవరు అనే ప్రశ్న
  choice: వారి నైతిక స్వభావాన్ని నిర్దిష్టం చేయకుండా మూడు వర్గాలనూ విస్తృత పదాలతో ఉంచడం
  alternative: వీటన్నిటినీ మంచి దేవదూతలుగా లేదా ప్రత్యేకంగా దుష్ట ఆత్మశక్తులుగా పేర్కొనడం
  rationale: గ్రీకు జాబితా వీరు మంచివారా, దుష్టులారా, మిశ్రమ వర్గాలా అని స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని విస్తృతతను, ఉద్వేగాన్ని కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఉన్నతీకరణ భాషను, passive భావాన్ని, విశ్వసంబంధ శక్తుల విస్తృత జాబితాను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలిపింది.
