id: 1PE.3.6
reference: 1 Peter 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: te
  text: సారా అబ్రాహాముకు విధేయురాలై, అతనిని “ప్రభువు” అని పిలిచినట్లే, మీరు మేలు చేస్తూ ఎలాంటి బెదిరింపుకూ[a] భయపడకుండా ఉంటే, ఆమె పిల్లలవుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎలాంటి భయానికీ,” “ఎలాంటి భీతికీ,” లేదా “భయపెట్టే దేనికీ.”
    reason: πτόησις భయం, భీతి, లేదా భయపెట్టే దానిని సూచించగలదు; సందర్భంలో ‘బెదిరింపు’ తగినది, కానీ పదం యొక్క విస్తృత భావపరిధిని పాదసూచికలో నిలుపుతున్నాము.
lexical_decisions:
- source_word: ὡς
  choice: పిలిచినట్లుగా
  rationale: ముందటి సందర్భంలోని బోధకు సారాను అనుగుణమైన మాదిరిగా చూపించే పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑπήκουσεν
  choice: విధేయత చూపి
  rationale: ὑπακούω అనే క్రియలోని ‘లోబడడం/మాట వినడం’ భావాన్ని నేరుగా నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: κύριον
  choice: యజమాని
  rationale: ఇక్కడ ఇది దేవునికి సంబంధించిన బిరుదు కాదు; అబ్రాహామును గౌరవంగా సంబోధించిన పదం. ‘ప్రభువు’ అనే పదం దైవార్థాన్ని సూచించే అవకాశం ఉన్నందున ‘యజమాని’ ఎంచుకోబడింది.
- source_word: καλοῦσα
  choice: అని పిలిచి
  rationale: సారా మాటల ద్వారా వ్యక్తమైన సంబోధనను, అలాగే ఈ కృదంతం విధేయతను వివరించే తీరును నిలుపుతుంది.
- source_word: ἧς ... τέκνα
  choice: ఆమె పిల్లలు
  rationale: సారాతో ఉన్న రూపకాల కుటుంబ సంబంధాన్ని సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἐγενήθητε
  choice: పిల్లలయ్యారు
  rationale: γίνομαι లోని ఒక స్థితిలోకి రావడం అనే భావాన్ని కేవలం ‘పిల్లలు’ అని స్థితివాచకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ἀγαθοποιοῦσαι
  choice: మీరు మేలు చేస్తూ
  rationale: కొనసాగుతున్న మంచి ప్రవర్తనను సూచించే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది; తరువాతి ‘ఉంటే’తో కలసి షరతు సంబంధం స్పష్టమవుతుంది.
- source_word: μὴ φοβούμεναι
  choice: భయపడకుండా ఉంటే
  rationale: కొనసాగుతున్న నిర్భయ వైఖరిని సహజమైన తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: μηδεμίαν πτόησιν
  choice: ఎలాంటి బెదిరింపుకూ
  rationale: πτόησις సూచించగల భయం కలిగించే ఒత్తిడి లేదా భీతిని సందర్భానుగుణంగా తెలియజేస్తుంది; మూలంలోని విస్తృత భావపరిధిని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: క్రైస్తవ భార్యలకు మాదిరిగా సారా విధేయత
  choice: మూల క్రియ యొక్క సూటి భావాన్ని ‘విధేయత చూపి’ అని నిలుపుతూ, ఈ వాక్యానికి మించిన సమగ్ర వివాహ సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
  alternative: ఆధునిక పాఠకులకు మృదువుగా అనిపించేలా ‘లోబడి’ లేదా ‘గౌరవించి’ అని అనువదించడం.
  rationale: సాంస్కృతిక లేదా సిద్ధాంత కారణాలతో ὑπήκουσεν అర్థాన్ని బలహీనపరచకూడదు; అదే సమయంలో వాక్యం చెప్పని విస్తృత సిద్ధాంతాన్ని ఇందులోకి దిగుమతి చేయకూడదు.
- issue: ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι అనే కృదంతాల సంబంధం
  choice: ‘మీరు ... ఉంటే’ అనే షరతు భావంతో వ్యక్తం చేయబడింది.
  alternative: ‘మేలు చేస్తూ, భయపడకుండా’ అని కేవలం వివరణాత్మకంగా ఉంచడం.
  rationale: ఈ కృదంతాలు సారా పిల్లలుగా గుర్తింపబడే జీవనరీతిని సూచిస్తూ సందర్భంలో ఆచరణాత్మక షరతు భావాన్ని కలిగిస్తాయి; తెలుగు వాక్యంలో ఆ సంబంధాన్ని స్పష్టీకరించడం సహజం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘యజమాని’ దైవ బిరుదుతో గందరగోళాన్ని నివారిస్తుంది. మూలంలోని షరతు భావం, కుటుంబ రూపకం, భయం/బెదిరింపు మధ్యనున్న పదార్థ అనిశ్చితి కాపాడబడ్డాయి.
