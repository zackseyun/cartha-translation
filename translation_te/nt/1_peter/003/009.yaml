id: 1PE.3.9
reference: 1 Peter 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: te
  text: కీడుకు ప్రతిగా కీడు చేయకుండా, దూషణకు ప్రతిగా దూషణ చేయకుండా[a], అందుకు విరుద్ధంగా[b] ఆశీర్వదించండి. ఎందుకంటే ఇందుకే మీరు పిలువబడ్డారు[c], తద్వారా మీరు ఆశీర్వాదాన్ని వారసత్వంగా పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దూషణకు ప్రతిగా దూషణ.’ గ్రీకు పదం అవమానకరమైన లేదా దుర్భాషలతో కూడిన మాటను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కాని దానికి బదులుగా.’ గ్రీకు వ్యక్తీకరణ బలమైన వ్యతిరేక మలుపును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అంటే, దుర్వ్యవహారానికి ప్రతీకారంతో కాక ఆశీర్వాదంతో స్పందించేందుకు దేవుడు పిలిచాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: ప్రతిగా ... చేయకుండా
  rationale: ప్రతీకారంగా తిరిగి చేయడం అనే పరస్పర ప్రతిఫల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; μήతో ఉన్న వర్తమాన అసమాపక క్రియ యొక్క నిషేధాత్మక ఉపదేశ స్వరాన్ని నిలుపుతుంది.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: కీడుకు ప్రతిగా కీడు
  rationale: κακόνలోని నైతిక తీవ్రతను ‘కీడు’ నిలుపుతుంది; ἀντί సూచించే ప్రతీకార మార్పిడిని ‘ప్రతిగా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: దూషణకు ప్రతిగా దూషణ
  rationale: λοιδορία అవమానకరమైన లేదా దుర్భాషలతో కూడిన మాటను సూచిస్తుంది. ‘దూషణ’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉండి, గ్రీకు సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: τοὐναντίον δὲ
  choice: దానికి విరుద్ధంగా
  rationale: మునుపటి ప్రతీకార ప్రవర్తనకు పూర్తి వ్యతిరేకమైన స్పందనను సూచించే బలమైన మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: εὐλογοῦντες
  choice: ఆశీర్వదించండి
  rationale: ఇది మేలు పలకడం, దేవుని అనుగ్రహాన్ని కోరడం అనే భావాలను కలిగి ఉండగలదు. గ్రీకులో లేని కర్మను తెలుగులో చేర్చకుండా సంక్షిప్త ఉపదేశ రూపాన్ని నిలిపింది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: తదుపరి వాక్యం ఈ ఉపదేశానికి కారణాన్ని ఇస్తుందని ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: ఇందుకే మీరు పిలువబడ్డారు
  rationale: దైవిక కర్తను గ్రీకులాగే ప్రత్యక్షంగా పేర్కొనకుండా కర్మణి రూపాన్ని నిలుపుతుంది. ‘ఇందుకే’ సమీపంలోని ఆశీర్వదించే పిలుపును సూచిస్తూనే, విస్తృత సందర్భంతో దాని సంబంధాన్ని అతిగా సంకుచితం చేయదు.
- source_word: ἵνα
  choice: పొందేందుకు
  rationale: ఉద్దేశం లేదా లక్ష్యఫలితాన్ని సహజమైన తెలుగు క్రియారూపంతో తెలియజేస్తుంది.
- source_word: εὐλογίαν
  choice: ఆశీర్వాదాన్ని
  rationale: విశ్వాసులు పొందబోయే దైవిక మేలును సూచించే సహజమైన తెలుగు పదం; ముందు ఉన్న ‘ఆశీర్వదించండి’తో గ్రీకులోని ఉద్దేశపూర్వక పదపునరుక్తిని నిలుపుతుంది.
- source_word: κληρονομήσητε
  choice: వారసత్వంగా పొందేందుకు
  rationale: సాధారణంగా ‘పొందడం’ కంటే, వారసులకు ప్రసాదించబడేదాన్ని స్వీకరించడం అనే నిబంధనాత్మక, కుటుంబ సంబంధిత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: εἰς τοῦτο ἐκλήθητεలో పిలుపు యొక్క స్వభావం
  choice: ‘ఇందుకే మీరు పిలువబడ్డారు’ అని అనువదించి, దుర్వ్యవహారానికి ప్రతీకారం తీర్చుకోకుండా ఆశీర్వదించే జీవనానికి దేవుని పిలుపుగా సమీప సందర్భంతో అనుసంధానించడం.
  alternative: ఈ పిలుపు క్రైస్తవ జీవితం మొత్తంలో బాధను భరించడం, ప్రతీకారం తీర్చుకోకపోవడం అనే విస్తృత జీవన విధానాన్ని సూచించవచ్చు; లేదా తరువాతి ఆశీర్వాద వారసత్వంతో మరింత దగ్గరగా అనుసంధానించవచ్చు.
  rationale: సమీప సందర్భం ప్రతీకారానికి బదులుగా ఆశీర్వదించడాన్ని ప్రధానంగా చూపుతుంది. అయితే ‘ఇందుకే’ అనే రూపం సూచనను అతిగా వివరించకుండా, మూలపాఠంలోని కొంత అనిశ్చితిని మరియు విస్తృత సందర్భ సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఉపదేశ శైలిని ఉపయోగించాం. ‘కీడు—కీడు,’ ‘దూషణ—దూషణ,’ ‘ఆశీర్వదించండి—ఆశీర్వాదం’ అనే మూలపాఠ సమాంతరతలు, పదపునరుక్తులు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
