revisions:
- from: కీడుకు ప్రతిగా కీడు చేయకుండా, దూషణకు ప్రతిగా దూషణ చేయకుండా[a], దానికి విరుద్ధంగా[b] ఆశీర్వదించండి. ఎందుకంటే ఇందుకే మీరు పిలువబడ్డారు[c]—మీరు ఆశీర్వాదాన్ని వారసత్వంగా పొందేందుకు.
  to: కీడుకు ప్రతిగా కీడు చేయకుండా, దూషణకు ప్రతిగా దూషణ చేయకుండా[a], అందుకు విరుద్ధంగా[b] ఆశీర్వదించండి. ఎందుకంటే ఇందుకే మీరు పిలువబడ్డారు[c], తద్వారా మీరు ఆశీర్వాదాన్ని వారసత్వంగా పొందుతారు.
