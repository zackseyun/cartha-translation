  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: te
  text: కాని, సౌమ్యమైన, ప్రశాంతమైన[c] ఆత్మ యొక్క నశించని సౌందర్యంలో[b] ఉన్న హృదయంలో దాగి ఉన్న వ్యక్తే[a] మీ అలంకారంగా ఉండాలి. అది దేవుని ఎదుట ఎంతో విలువైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హృదయంలో దాగి ఉన్న మనిషి.’ గ్రీకు ἄνθρωπος అనే పదానికి ‘మనిషి’ లేదా సాధారణంగా ‘వ్యక్తి’ అనే అర్థం ఉండవచ్చు; ఇక్కడ అది అంతరంగ వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సౌమ్యమైన, ప్రశాంతమైన ఆత్మ యొక్క నశించని దానిలో.’ ముందటి వచనంలోని బాహ్య అలంకారంతో ఉన్న వ్యత్యాసాన్ని బట్టి తెలుగులో ‘సౌందర్యం’ అనే పదాన్ని పూరించాం.
    reason: lexical_alternative
  - marker: c
    text: ‘ప్రశాంతమైన’ అంటే తప్పనిసరిగా మౌనంగా ఉండడం కాదు; కలతలేని, శాంతియుత స్వభావం కలిగి ఉండడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: హృదయంలో దాగివున్న వ్యక్తి
  rationale: κρυπτός అనే పదంలోని ‘దాగివున్న’ భావాన్ని నిలుపుతూ, ἄνθρωπος ఇక్కడ పురుషుణ్ణి ప్రత్యేకంగా సూచించకుండా అంతరంగ వ్యక్తిని సూచిస్తున్నందున ‘వ్యక్తి’ అని అనువదించాం.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: నశించని సౌందర్యం
  rationale: గ్రీకు వాక్యభాగం సంక్షిప్తంగా, నామవాచకం లేకుండా ఉంది. ముందటి వచనంలోని బాహ్య అలంకారంతో ఉన్న వ్యత్యాసాన్ని బట్టి సహజమైన తెలుగుకోసం ‘సౌందర్యం’ను పూరించాం; ἀφθάρτῳ భావాన్ని ‘నశించని’ అని నిలిపాం.
- source_word: πραέως
  choice: సాత్వికమైన
  rationale: πραΰς సూచించే మృదుత్వం, అణకువ, హానిచేయని స్వభావాన్ని ఆధునిక గౌరవప్రదమైన తెలుగులో ‘సాత్వికమైన’ సహజంగా తెలియజేస్తుంది.
- source_word: ἡσυχίου
  choice: ప్రశాంతమైన
  rationale: ఇది తప్పనిసరిగా మౌనంగా ఉండడాన్ని కాకుండా కలతలేని, శాంతియుత స్వభావాన్ని సూచిస్తుంది; అందువల్ల ‘ప్రశాంతమైన’ అని అనువదించాం.
- source_word: πνεύματος
  choice: ఆత్మ
  rationale: ‘స్వభావం’ అనే వ్యాఖ్యానాత్మక పదానికి బదులు మూలంలోని మానవ అంతరంగ భాషను నిలుపుతుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని ఎదుట
  rationale: దేవుని మూల్యాంకనాన్ని తెలిపే మూలపదబంధానికి సంక్షిప్తమైన, సహజమైన సమానం.
- source_word: πολυτελές
  choice: ఎంతో అమూల్యమైనది
  rationale: πολυτελής సూచించే అత్యధిక విలువను స్పష్టంగా తెలియజేస్తూ, బాహ్యంగా ఖరీదైన అలంకారాలతో ఉన్న సందర్భోచిత వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: లింగసూచక సందర్భంలోని మానవశాస్త్రీయ వ్యక్తీకరణ
  choice: ἄνθρωπος ను ‘మనిషి’ అని కాకుండా ‘వ్యక్తి’ అని అనువదించడం.
  alternative: హృదయంలో దాగివున్న మనిషి
  rationale: ఈ పదబంధం పురుషత్వాన్ని కాకుండా అంతరంగ వ్యక్తిని సూచిస్తుంది. స్త్రీలను ఉద్దేశించిన ఈ సందర్భంలో ‘మనిషి’ అనేది అనవసరమైన పురుషార్థాన్ని కలిగించవచ్చు.
- issue: ἀφθάρτῳ తో అంతర్లీనంగా ఉన్న నామవాచకాన్ని పూరించడం
  choice: ‘నశించని సౌందర్యం’ అని పూరించడం.
  alternative: సాత్వికమైన, ప్రశాంతమైన ఆత్మలోని నశించని గుణం
  rationale: గ్రీకు నిర్మాణం సంక్షిప్తంగా ఉంది. 3వ వచనంలోని బాహ్య అలంకారానికి వ్యతిరేకంగా అంతరంగ అలంకారాన్ని చెప్పే సందర్భం వల్ల ‘సౌందర్యం’ సహజంగా భావాన్ని స్పష్టం చేస్తుంది; ఇది మూలంలోని అస్పష్టతను పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: మునుపటి వచనం నుండి వచ్చే విధేయాన్ని తెలుగులో స్పష్టం చేయడం
  choice: ‘మీ అలంకారంగా ఉండాలి’ అని పూరించడం.
  alternative: విధేయాన్ని పూరించకుండా వాక్యఖండంగా ఉంచడం
  rationale: గ్రీకులో 4వ వచనం 3వ వచనంలోని ἔστω ... κόσμος (‘అలంకారంగా ఉండాలి’) అనే నిర్మాణాన్ని కొనసాగిస్తుంది. వచనం విడిగా చదివినప్పుడు సహజమైన, సంపూర్ణమైన తెలుగు వాక్యంగా ఉండేందుకు ఆ భావాన్ని స్పష్టంగా పునరుద్ఘాటించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘సాత్వికమైన’ మరియు ‘ప్రశాంతమైన’ అనే పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా మూలంలోని నైతిక స్వభావాన్ని తెలియజేస్తాయి. వచనం 3వ వచనంలోని వాక్యనిర్మాణాన్ని కొనసాగిస్తున్నందున ‘మీ అలంకారంగా ఉండాలి’ అని స్పష్టం చేశాం; మూలంలోని సంక్షిప్తతను పాదటిప్పణిలో నమోదు చేశాం.
