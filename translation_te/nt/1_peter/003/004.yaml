  to: కాని, సౌమ్యమైన, ప్రశాంతమైన[c] ఆత్మ యొక్క నశించని సౌందర్యంలో[b] ఉన్న హృదయంలో దాగి ఉన్న వ్యక్తే[a] మీ అలంకారంగా ఉండాలి. అది దేవుని ఎదుట ఎంతో విలువైనది.
