id: 1PE.3.17
reference: 1 Peter 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: te
  text: ఎందుకంటే, దేవుని చిత్తం అలా కోరితే[b], చెడు చేస్తూ బాధపడడం కంటే మేలు చేస్తూ బాధపడడమే మంచిది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మేలు చేసినందుకు బాధపడడం … చెడు చేసినందుకు బాధపడడం’ అని కూడా అనువదించవచ్చు. గ్రీకు కృదంతాలు కారణాన్ని (‘చేసినందుకు’) లేదా జరుగుతున్న పరిస్థితిని (‘చేస్తూ’) సూచించగలవు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, ‘దేవుని చిత్తం కోరితే’ అని ఉంది. ఒకే మూలానికి చెందిన నామవాచకం, క్రియ కలసి రావడం వల్ల భావానికి బలం చేకూరుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: మంచిది
  rationale: కర్త స్పష్టంగా లేని తులనాత్మక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘మంచిది’ అని వ్యక్తపరుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణం లేదా వివరణను అనుసంధానించే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀγαθοποιοῦντας
  choice: మేలు చేస్తూ
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న పరిస్థితిని నిలుపుతుంది; బాధకు మేలు చేయడమే కారణమని తప్పనిసరిగా నిర్ణయించదు.
- source_word: εἰ θέλοι
  choice: అలా కోరితే
  rationale: εἰతో కూడిన optative వ్యక్తపరచే సంభావ్యమైన షరతును తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: దేవుని చిత్తం
  rationale: మూలంలోని genitive నిర్మాణాన్నీ గంభీరతనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: πάσχειν
  choice: బాధపడడం
  rationale: సూటిగా, సాధారణ పాఠకులకు అర్థమయ్యే విధంగా suffering అనే భావాన్ని అందిస్తుంది.
- source_word: ἢ
  choice: కంటే
  rationale: κρεῖττονతో ఉన్న తులనను తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: κακοποιοῦντας
  choice: చెడు చేస్తూ
  rationale: ἀγαθοποιοῦνταςతో ఉన్న సమాంతర విరుద్ధతను, కొనసాగుతున్న పరిస్థితి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బాధకు దేవుని చిత్తంతో ఉన్న సంబంధం
  choice: మేలు చేస్తూ బాధపడడం దేవుని చిత్తం పరిధిలో సంభవించవచ్చని షరతుతో పేర్కొనడం
  alternative: ప్రతి బాధను దేవుడు నిశ్చయంగా కలిగిస్తాడని లేదా దేవుడు కేవలం అనుమతిస్తాడని స్పష్టీకరించడం
  rationale: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ దేవుని చిత్తాన్ని షరతుగా ప్రస్తావిస్తుంది; అయితే నిర్ణయం, అనుమతి, కారణత్వం గురించిన విస్తృత సిద్ధాంతాన్ని తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చేస్తూ’ అనే రూపం కృదంతాల పరిస్థితి భావాన్ని నిలుపుతూ, కారణార్థాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇస్తుంది. ప్రధాన వాక్యంలో ప్రతి పాదటిప్పణి సూచికను చేర్చాం.
