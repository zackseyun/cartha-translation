  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: te
  text: ప్రపంచానికి పునాది వేయబడక ముందే దేవుడు ఆయనను ముందుగానే ఎరిగాడు[a]; అయితే కాలాల చివరలో మీ కోసమే ఆయనను ప్రత్యక్షపరిచాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముందుగానే ఎన్నుకున్నాడు.” గ్రీకు పదానికి అక్షరార్థం “ముందుగానే ఎరిగాడు”; అది దేవుని సంకల్పాన్ని సూచించవచ్చు, కానీ ప్రధాన పాఠ్యంలో ఆ విస్తృత వ్యాఖ్యానం తప్పనిసరి కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ చివరి కాలాల్లో.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: దేవుడు ఆయనను ముందుగానే ఎరిగాడు
  rationale: προγινώσκω అనే క్రియలోని ‘ముందుగా ఎరుగుట’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, తెలుగులో అసహజంగా ఉండే కర్మణి ప్రయోగాన్ని సహజమైన కర్తరి వాక్యంగా మార్చాం. గ్రీకులో సూచితమైన దైవకర్తను సందర్భానుసారంగా ‘దేవుడు’ అని స్పష్టం చేశాం; ‘ముందుగానే ఎన్నుకున్నాడు’ అనే బలమైన వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: πρὸ καταβολῆς κόσμου
  choice: లోకం ఏర్పడక ముందే
  rationale: సృష్టికి పూర్వమైన కాలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘లోక పునాది వేయబడక ముందే’ అనే మరింత అక్షరార్థ రూపం తెలుగులో కృత్రిమంగా వినిపించవచ్చు.
- source_word: φανερωθέντος
  choice: ఆయనను ప్రత్యక్షపరిచాడు
  rationale: కనిపించేలా చేయడం లేదా బహిర్గతం చేయడం అనే φανερόω భావాన్ని ‘ప్రత్యక్షపరిచాడు’ స్పష్టంగా అందిస్తుంది. ముందటి భాగంలాగే సూచిత దైవకర్తతో కర్తరి నిర్మాణాన్ని ఉపయోగించాం.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: కాలాల చివరలో
  rationale: గ్రీకు పదబంధంలోని కాలాంత సంబంధమైన భావాన్ని, మూలంలో లేని ‘ఈ’ అనే నిర్దేశకాన్ని జోడించకుండా నిలుపుతుంది.
- source_word: δι’ ὑμᾶς
  choice: మీ కోసమే
  rationale: διά + accusative ఇక్కడ తెలియజేసే పాఠకుల ప్రయోజనార్థక భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘ఏ’ నొక్కిచెప్పే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: సృష్టికి ముందు మెస్సీయకు సంబంధించి προεγνωσμένου అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘దేవుడు ఆయనను ముందుగానే ఎరిగాడు’ అని ఉంచడం
  alternative: ‘దేవుడు ఆయనను ముందుగానే ఎన్నుకున్నాడు’ లేదా ‘ముందుగానే నియమించాడు’
  rationale: మూలక్రియ ముందస్తు జ్ఞానాన్ని నేరుగా వ్యక్తం చేస్తుంది; దానిలో దైవ సంకల్పం అంతర్లీనంగా ఉండవచ్చుగాని, దానిని ఎన్నిక లేదా ముందస్తు నిర్ణయం అనే భావానికి అనువాదంలోనే పరిమితం చేయకూడదు. అందువల్ల మూలంలోని వేదాంత ఉద్రిక్తతను నిలిపాం.
- issue: ἐπ’ ἐσχάτου τῶν χρόνων యొక్క కాలాంత భావం
  choice: ‘కాలాల చివరలో’
  alternative: ‘ఈ చివరి కాలాల్లో’
  rationale: మూలంలో అంత్యకాల భావం ఉన్నప్పటికీ ‘ఈ’ అనే పదం స్పష్టంగా లేదు. ప్రధాన పాఠ్యం గ్రీకు నిర్మాణానికి దగ్గరగా ఉండగా, సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజతను కాపాడుతూ గౌరవప్రదమైన వాక్యశైలిని ఉపయోగించాం. గ్రీకులోని కర్మణి కృదంతాలను తెలుగులో సహజమైన కర్తరి నిర్మాణాలుగా మార్చి, సందర్భంలో సూచితమైన దైవకర్తను ‘దేవుడు’ అని స్పష్టం చేశాం. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
