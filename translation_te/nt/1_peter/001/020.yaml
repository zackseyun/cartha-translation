  source_fidelity: The draft accurately conveys the two passive participles through natural active Telugu with God as the contextually implicit agent, and it preserves the non-deterministic sense of προεγνωσμένου. However, ‘లోకం ఏర్పడక ముందే’ means ‘before the world came into being’ and does not retain the source’s specific foundation/laying-foundation idiom (πρὸ καταβολῆς κόσμου).
