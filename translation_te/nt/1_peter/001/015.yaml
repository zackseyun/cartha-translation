  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సరళమైన శైలిని ఉపయోగించాం. ‘పవిత్రుడు/పవిత్రులు’ అనే పునరుక్తి మూలపాఠంలోని దైవ-మానవ అనురూపతను నిలుపుతుంది.
