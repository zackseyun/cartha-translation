translation:
  language: te
  text: అయితే, మిమ్మల్ని పిలిచినవాడు పవిత్రుడైనట్లే, మీరు కూడా మీ ప్రవర్తన అంతటిలో[a] పవిత్రులుగా ఉండండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ జీవన విధానమంతటిలో.’ గ్రీకు పదం ఒకరి మొత్తం జీవనశైలిని లేదా నడవడిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పవిత్రులు అవ్వండి.’ గ్రీకు ఆజ్ఞారూపం ఆ స్థితిలోకి రావడాన్ని లేదా ఆ స్థితిని కనబరచడాన్ని నొక్కిచెప్పవచ్చు; అయితే ఇక్కడ ‘పవిత్రులుగా ఉండండి’ అనేది సహజమైన తెలుగు పిలుపు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి జీవన విధానంతో విరుద్ధతను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: మిమ్మల్ని పిలిచినవాడు పవిత్రుడై ఉన్నట్లే
  rationale: κατά సూచించే అనురూపతను ‘ఉన్నట్లే’ తెలియజేస్తుంది; ἅγιον దేవుని లక్షణంగా ఉండడాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ αὐτοὶ
  choice: మీరు కూడా
  rationale: καί యొక్క ‘కూడా’ భావాన్ని, αὐτοί ఇచ్చే వ్యక్తిగత ఉద్ఘాటనను సందర్భానికి తగిన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἅγιοι
  choice: పవిత్రులుగా
  rationale: ముందున్న ἅγιονతో పదపునరుక్తిని నిలిపి, దేవుని పవిత్రతకు విశ్వాసుల జీవితం అనుగుణంగా ఉండాలనే పిలుపును కాపాడుతుంది.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: మీ ప్రవర్తన అంతటిలో
  rationale: ἀναστροφή సూచించే మొత్తం జీవన ప్రవర్తనను సంక్షిప్తంగా తెలియజేస్తుంది; ‘మీ’ అనేది సందర్భం నుంచి స్పష్టమయ్యే భావం.
- source_word: γενήθητε
  choice: ఉండండి
  rationale: ఆజ్ఞార్థక పిలుపును సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘అవ్వండి’ అనే ప్రవేశాత్మక భావం సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: దేవుని పవిత్రతకు విశ్వాసుల పవిత్రతకు మధ్య సంబంధం
  choice: మిమ్మల్ని పిలిచినవాడు పవిత్రుడై ఉన్నట్లే ... పవిత్రులుగా ఉండండి
  alternative: మిమ్మల్ని పిలిచిన పవిత్రునికి అనుగుణంగా ... పవిత్రులుగా ఉండండి
  rationale: గ్రీకులోని రెండు ἅγιος రూపాల ఉద్దేశపూర్వక పునరుక్తిని, దేవుని స్వభావం విశ్వాసుల ప్రవర్తనకు ప్రమాణమనే సంబంధాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- issue: γενήθητε ఆజ్ఞ యొక్క భావబలం
  choice: పవిత్రులుగా ఉండండి
  alternative: పవిత్రులు అవ్వండి
  rationale: ‘ఉండండి’ సహజమైన నైతిక ఆజ్ఞగా ఉంటుంది; ‘అవ్వండి’ సాధ్యమైన ప్రవేశాత్మక లేదా ఫలితార్థక ఛాయను పాదసూచికలో భద్రపరచడం ద్వారా మూలంలోని భావసంభావ్యతను తొలగించలేదు.
