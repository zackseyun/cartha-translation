id: 1PE.1.6
reference: 1 Peter 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: te
  text: ఇందులో మీరు ఎంతో ఆనందిస్తున్నారు; అయితే ఇప్పుడు కొద్దికాలంపాటు, అవసరమైతే, నానావిధమైన కష్టపరీక్షల[a] వల్ల దుఃఖానికి గురై ఉన్నప్పటికీ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరీక్షలు’; ఈ గ్రీకు పదానికి ఇతర సందర్భాల్లో ‘ప్రలోభాలు’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: πείρασμος అనే పదానికి సందర్భాన్ని బట్టి పరీక్షలు లేదా ప్రలోభాలు అనే విస్తృత అర్థపరిధి ఉంది; ఇక్కడ బాధలు, విశ్వాసపు పరీక్ష సందర్భం వల్ల ‘కష్టపరీక్షలు’ ప్రధాన అనువాదంగా ఉంది.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఇందులో
  rationale: ముందటి వచనాల్లో చెప్పిన రక్షణ, నిరీక్షణ, స్వాస్థ్యం అనే భావసముదాయాన్ని సూచిస్తూ, ఆనందం కలిగే పరిధి లేదా ఆధారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; స్పష్టమైన కారణార్థాన్ని అనవసరంగా బలపరచదు.
- source_word: ἀγαλλιᾶσθε
  choice: మీరు ఎంతో ఆనందిస్తున్నారు
  rationale: క్రియలోని ఉల్లాసభరితమైన బలమైన ఆనందాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. సందర్భానికి అనుగుణంగా దీనిని వర్తమాన సూచనార్థకంగా అనువదించాం.
- source_word: ὀλίγον ἄρτι
  choice: ఇప్పుడు ... కొద్దికాలం పాటు
  rationale: ἄρτι లోని ప్రస్తుతకాల భావాన్నీ, ὀλίγον లోని స్వల్పకాల భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: εἰ δέον
  choice: అవసరమైతే
  rationale: εἰ లోని షరతు భావాన్ని, δέον లోని అవసరతను సంక్షిప్తంగా కాపాడుతుంది; ఆ అవసరానికి గల దైవశాస్త్రీయ కారణాన్ని అనువాదంలో చేర్చదు.
- source_word: λυπηθέντες
  choice: దుఃఖానికి గురవుతున్నారు
  rationale: దుఃఖాన్ని అనుభవింపజేయబడుతున్న నిష్క్రియ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ప్రస్తుత కొద్దికాలపు అనుభవంతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: నానావిధమైన కష్టపరీక్షల వల్ల
  rationale: సందర్భంలోని బాధలు మరియు తరువాతి వచనంలో విశ్వాసం పరీక్షించబడటం దృష్ట్యా πειρασμοί ను పాపానికి ప్రలోభాలుగా సంకుచితం చేయకుండా, వివిధ కఠిన అనుభవాలుగా వ్యక్తం చేస్తుంది. ἐν ను ఇక్కడ దుఃఖానికి కారణమైన పరిస్థితిని సూచించే ‘వల్ల’గా సహజంగా అనువదించాం.
theological_decisions:
- issue: బాధల సందర్భంలో πειρασμοῖς యొక్క భావం
  choice: కష్టపరీక్షలు
  alternative: పరీక్షింపులు; ప్రలోభాలు
  rationale: తక్షణ సందర్భం దుఃఖాన్నీ, తరువాతి వచనం విశ్వాసం పరీక్షించబడటాన్నీ ప్రస్తావిస్తున్నందున బాహ్య కష్టాలను సూచించే ‘కష్టపరీక్షలు’ ప్రధాన భావానికి సరిపోతుంది. అయినా గ్రీకు పదంలోని విస్తృత అర్థపరిధిని పాదసూచికలో ఉంచాం.
- issue: ἀγαλλιᾶσθε యొక్క వాక్యభావం
  choice: వర్తమాన సూచనార్థకం—‘ఆనందిస్తున్నారు’
  alternative: ఆజ్ఞార్థకం—‘ఆనందించండి’
  rationale: రూపం వ్యాకరణపరంగా రెండింటికీ సరిపోవచ్చినా, ఈ సందర్భంలోని వాక్యప్రవాహం విశ్వాసుల ప్రస్తుత ఆనందాన్ని వర్ణిస్తున్నదనే పఠనానికి ఎక్కువ మద్దతిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ప్రధాన వాక్యంలోని విరుద్ధ భావాన్ని స్పష్టంగా ఉంచేందుకు రెండు వాక్యాలుగా విభజించాం; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచాం.
