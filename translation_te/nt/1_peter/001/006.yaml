    rationale: గ్రీకు అఓరిస్టు నిష్క్రియ కృదంతం వర్తమాన ప్రగతిశీల క్రియ కాదు. ‘దుఃఖానికి గురై ఉన్నప్పటికీ’ అనేది నిష్క్రియతను, ప్రస్తుత సందర్భంతో దాని సంబంధాన్ని, మరియు concessive వాక్యప్రవాహాన్ని మరింత సన్నిహితంగా నిలుపుతుంది.
