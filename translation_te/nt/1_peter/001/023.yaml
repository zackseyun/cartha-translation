source:
  edition: SBLGNT
  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: te
  text: మీరు నశించిపోయే విత్తనం నుండి కాదు, నశించని విత్తనం నుండి, దేవుని సజీవమైన, నిలిచివుండే వాక్యం ద్వారా మళ్లీ జన్మించినవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సజీవంగా, నిలిచివుండే దేవుని వాక్యం ద్వారా.” గ్రీకులో ‘సజీవమైన,’ ‘నిలిచివుండే’ అనే కృదంతాలు ‘వాక్యం’నుగానీ ‘దేవుడు’నుగానీ విశేషించవచ్చు; అయితే సందర్భం అవి ‘వాక్యం’ను విశేషిస్తున్నాయని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: మళ్లీ జన్మించినవారు
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని గతంలో పూర్తయి ప్రస్తుతం కొనసాగుతున్న ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కర్మణి భావాన్నీ నిలుపుతుంది.
- source_word: σπορᾶς
  choice: విత్తనం
  rationale: జనన రూపకానికీ, నశించేది—నశించనిది అనే వ్యత్యాసానికీ సరిపోయే సహజమైన తెలుగు పదం.
- source_word: φθαρτῆς
  choice: నశించిపోయే
  rationale: క్షయం లేదా నాశనానికి లోబడేదనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀφθάρτου
  choice: నశించనిదాని
  rationale: φθαρτῆς‌తో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని నిలుపుతూ, ‘విత్తనం’ అనే పూర్వపదాన్ని అనవసరంగా పునరుక్తి చేయదు.
- source_word: διὰ
  choice: ద్వారా
  rationale: షష్ఠీ విభక్తితో ఉన్న διά సూచించే సాధనార్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: λόγου
  choice: వాక్యం
  rationale: λόγος యొక్క ‘word/message’ పరిధిని ఇక్కడ సంప్రదాయబద్ధంగానూ సందర్భోచితంగానూ తెలియజేస్తుంది; 25వ వచనంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: ζῶντος
  choice: జీవించి
  rationale: వర్తమాన కృదంతపు సజీవ స్థితిని నేరుగా తెలియజేస్తూ ‘వాక్యం’తో సహజంగా అనుసంధానమవుతుంది.
- source_word: θεοῦ
  choice: దేవుని
  rationale: λόγουపై ఆధారపడిన సంబంధ షష్ఠిని సహజమైన తెలుగు నిర్మాణంలో చూపుతుంది.
- source_word: μένοντος
  choice: నిలిచివుండే
  rationale: కొనసాగి ఉండటం, నిలిచి ఉండటం అనే కాలవ్యాప్త భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ζῶντος మరియు μένοντος అనే కృదంతాలు ‘వాక్యం’ను విశేషిస్తున్నాయా, ‘దేవుడు’ను విశేషిస్తున్నాయా?
  choice: ‘జీవించి నిలిచివుండే దేవుని వాక్యం’—రెండు కృదంతాలూ ‘వాక్యం’ను విశేషిస్తాయి.
  alternative: '‘జీవించి నిలిచివుండే దేవుని వాక్యం’ అనే తెలుగు పదక్రమాన్ని ‘జీవించి నిలిచివుండే దేవుని యొక్క వాక్యం’ అనే అర్థంలోనూ గ్రహించవచ్చు; స్పష్ట రూపం: ‘జీవించి నిలిచివుండే దేవుని వాక్యం ద్వారా.’'
  rationale: గ్రీకులో λόγου, ζῶντος, μένοντος అన్నీ షష్ఠీ ఏకవచన పుంలింగ రూపాల్లో ఉండటం వల్ల కృదంతాలు λόγουను విశేషించడం సహజం; 25వ వచనంలోని నిలిచే వాక్యంపై దృష్టి దీనికి బలం ఇస్తుంది. అయితే θεοῦను విశేషించే పఠనం వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని కృదంత నిర్మాణాన్ని తెలుగు వాక్యసౌలభ్యానికి అనుగుణంగా ప్రధాన వాక్యంగా అందించాం. [a] గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
