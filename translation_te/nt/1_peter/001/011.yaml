id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: te
  text: తమలోనున్న మెస్సీయ యొక్క ఆత్మ, మెస్సీయకు సంబంధించిన శ్రమలను[a] మరియు వీటి తరువాతి మహిమలను ముందుగానే సాక్ష్యమిస్తూ, ఏ వ్యక్తిని లేదా ఎలాంటి కాలాన్ని సూచిస్తూ ఉండేదో వారు పరిశోధిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెస్సీయ శ్రమలను.’
    reason: τὰ εἰς Χριστὸν παθήματα అనే గ్రీకు నిర్మాణాన్ని మెస్సీయకు సంబంధించిన శ్రమలుగానూ, నేరుగా మెస్సీయ శ్రమలుగానూ అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: పరిశోధిస్తూ ఉన్నారు
  rationale: ఈ వర్తమాన కృదంతం మునుపటి వచనంలోని ప్రవక్తల అన్వేషణను కొనసాగిస్తుంది. ‘పరిశోధిస్తూ’ అనే పదం జాగ్రత్తగా వెదికి తెలుసుకోవాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: ఏ వ్యక్తిని లేదా ఎలాంటి కాలాన్ని
  rationale: τίναను వ్యక్తికి సంబంధించిన ప్రశ్నగా, ποῖον καιρόνను కాలం యొక్క స్వరూపానికి సంబంధించిన ప్రశ్నగా తీసుకొని, మూలంలోని ద్వంద్వ విచారణను నిలిపింది.
- source_word: ἐδήλου
  choice: సూచిస్తున్నదో
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న సూచన భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: తమలో ఉన్న మెస్సీయ ఆత్మ
  rationale: ఆత్మ ప్రవక్తలలో ఉన్నదనే మాటను, అలాగే Χριστοῦ అనే బిరుదును ‘మెస్సీయ’గా నేరుగా నిలిపింది.
- source_word: προμαρτυρόμενον
  choice: ముందుగానే సాక్ష్యమిస్తూ
  rationale: προ-లోని ముందస్తు కాలభావాన్నీ, μαρτυρέωలోని సాక్ష్యమిచ్చే భావాన్నీ రెండింటినీ కాపాడుతుంది.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: మెస్సీయకు కలిగే శ్రమలను
  rationale: εἰς Χριστόνను కేవలం స్వామ్యార్థకంగా మార్చకుండా, మెస్సీయ వైపు నిర్దేశించబడిన లేదా ఆయనకు సంబంధించిన శ్రమల భావాన్ని సంక్షిప్తంగా తెలుపుతుంది; మరింత ప్రత్యక్షమైన స్వామ్యార్థక పఠనం పాదసూచికలో ఉంది.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: వాటి తరువాత వచ్చే మహిమలను
  rationale: δόξας అనే బహువచనాన్ని ‘మహిమలను’గా నిలిపి, శ్రమల తరువాత అవి వస్తాయనే కాలక్రమాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ప్రవక్తలలో ఉన్న ‘మెస్సీయ ఆత్మ’ అర్థం
  choice: ‘తమలో ఉన్న మెస్సీయ ఆత్మ’ అనే ప్రత్యక్ష నిర్మాణాన్ని నిలిపింది.
  alternative: మెస్సీయ గురించి పలికిన ప్రవచనాత్మ
  rationale: మూలపాఠం ఆత్మకు మెస్సీయతో ఉన్న సంబంధాన్నీ, ఆ ఆత్మ ప్రవక్తలలో క్రియాశీలంగా ఉన్నదనీ నేరుగా చెబుతుంది. దానిని వ్యాఖ్యానాత్మకంగా కుదించకుండా వేదాంతపరమైన బరువును నిలిపింది.
- issue: τὰ εἰς Χριστὸν παθήματαలో εἰς పదం యొక్క బలం
  choice: మెస్సీయకు కలిగే శ్రమలు
  alternative: మెస్సీయ శ్రమలు
  rationale: εἰςతో ఉన్న అసాధారణ నిర్మాణం మెస్సీయకు నిర్దేశించబడిన లేదా ఆయనకు సంబంధించిన శ్రమలను సూచించవచ్చు. ప్రధాన పాఠం ఆ దిశాభావాన్ని స్వల్పంగా నిలిపి, సాంప్రదాయ స్వామ్యార్థక పఠనాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఇది 10వ వచనం నుంచి కొనసాగే వాక్యభాగమని చూపేందుకు కృదంతసంబంధ ప్రవాహం నిలిపబడింది; ‘మహిమలు’ అనే బహువచనం ఉద్దేశపూర్వకంగా కాపాడబడింది.
