revisions:
- from: తమలో ఉన్న మెస్సీయ ఆత్మ, మెస్సీయకు కలిగే శ్రమలను[a], వాటి తరువాత వచ్చే మహిమలను ముందుగానే సాక్ష్యమిస్తూ, ఏ వ్యక్తిని లేదా ఎలాంటి కాలాన్ని సూచిస్తున్నదో పరిశోధిస్తూ ఉన్నారు.
  to: తమలోనున్న మెస్సీయ యొక్క ఆత్మ, మెస్సీయకు సంబంధించిన శ్రమలను[a] మరియు వీటి తరువాతి మహిమలను ముందుగానే సాక్ష్యమిస్తూ, ఏ వ్యక్తిని లేదా ఎలాంటి కాలాన్ని సూచిస్తూ ఉండేదో వారు పరిశోధిస్తూ ఉన్నారు.
  rationale: The revision clarifies that the Spirit is the Messiah’s Spirit, restores the imperfect/ongoing indication with “సూచిస్తూ ఉండేదో,” and uses a neutral main-text expression for the disputed εἰς Χριστόν phrase. It keeps the alternative possessive construal in a correctly anchored footnote and preserves the source’s ambiguity, plural “glories,” and antecedent-dependent participial structure.
