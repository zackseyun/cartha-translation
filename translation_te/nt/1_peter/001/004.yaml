review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders κληρονομίαν and the three coordinated adjectives, and correctly conveys τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς. However, the Greek construction is a continuation from the preceding verse: εἰς governs both ἐλπίδα and κληρονομίαν. Telugu should retain this syntactic continuation without making the inheritance itself appear to be the complete independent clause.'
  naturalness: The wording is generally modern and clear. Repeating the relative clause after an em dash is understandable, but the terminal em dash leaves the Telugu fragment typographically unfinished. A comma more naturally connects the participial description to the inheritance phrase.
  terminology: “వారసత్వం,” “కలుషితం కానిది,” and “వాడిపోనిది” are appropriate. “నశించనిది” adequately represents imperishable. “పరలోకాల్లో” is an established Telugu biblical rendering and preserves the plural form without forcing an unnatural distinction.
  issues:
  - severity: low
    issue: The closing em dash is structurally incomplete.
    rationale: This verse is indeed syntactically dependent on 1 Peter 1:3, but a terminal dash is not needed to preserve that dependency and looks unfinished in Telugu.
  - severity: low
    issue: The resumptive “అది” after the dash slightly interrupts the compact Greek attributive construction.
    rationale: The participle τετηρημένην modifies “inheritance”; directly attaching “మీ కోసం పరలోకాల్లో భద్రపరచబడి ఉన్న” to “వారసత్వంలోకి” is more fluent while retaining the same meaning.
  revised_text: నశించనిదీ, కలుషితం కానిదీ, వాడిపోనిదీ అయిన, మీ కోసం పరలోకాల్లో భద్రపరచబడి ఉన్న వారసత్వంలోకి,
  revised_footnotes: []
  revision_rationale: A safe punctuation and word-order revision makes the Telugu clause read naturally as a continuation of the preceding verse, directly links “kept” to “inheritance,” and removes the incomplete final dash. No meaning or theological inference is changed.
