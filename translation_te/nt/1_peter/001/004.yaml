id: 1PE.1.4
reference: 1 Peter 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: te
  text: నశించనిదీ, కలుషితం కానిదీ, వాడిపోనిదీ అయిన, మీ కోసం పరలోకాల్లో భద్రపరచబడి ఉన్న వారసత్వంలోకి,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: వారసత్వంలోకి
  rationale: εἰς యొక్క దిశాభావాన్ని, κληρονομία యొక్క స్వాస్థ్య/వారసత్వ భావాన్ని నిలుపుతుంది; ముందటి వాక్యంతో వ్యాకరణపరంగా కొనసాగుతుంది.
- source_word: ἄφθαρτον
  choice: నశించనిదీ
  rationale: క్షయం లేదా నాశనం చెందలేనిదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀμίαντον
  choice: కలుషితం కానిదీ
  rationale: మలినపడని, అపవిత్రం కాని స్వభావాన్ని విస్తృతంగా గ్రహించదగిన పదబంధంతో తెలియజేస్తుంది.
- source_word: ἀμάραντον
  choice: వాడిపోనిదీ
  rationale: వాడిపోవడం లేదా కాంతి కోల్పోవడం లేని స్వభావాన్ని మూలంలోని రూపకానికి దగ్గరగా ఉంచుతుంది.
- source_word: τετηρημένην
  choice: భద్రపరచబడి ఉంది
  rationale: పూర్తయిన చర్యతో కొనసాగుతున్న సంరక్షణ స్థితిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν οὐρανοῖς
  choice: పరలోకాల్లో
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, ఆధునిక తెలుగు బైబిలు వాడుకలో సహజంగా ఉంటుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ కోసం
  rationale: లబ్ధిదారుని సూచించే సందర్భోచిత అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; 'మీ కొరకు ఉంచబడినది' అనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: వారసత్వం యొక్క ప్రస్తుత సంరక్షణ మరియు భవిష్యత్ స్వీకరణ
  choice: “మీ కోసం పరలోకాల్లో భద్రపరచబడి ఉంది”
  alternative: “మీకు పరలోకాల్లో కాపాడబడుతోంది”
  rationale: τετηρημένην యొక్క ఫలితస్థితిని, విశ్వాసుల కోసం దాని భద్రతను వ్యక్తం చేస్తూ, అది ఎప్పుడు లేదా ఏ విధంగా స్వీకరించబడుతుందో అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం. ఇది 1:3లోని “తిరిగి పుట్టించాడు” అనే క్రియకు కొనసాగింపైన ఖండవాక్యం కాబట్టి చివరలో కొనసాగింపు సూచించే విరామచిహ్నం ఉంచబడింది.
