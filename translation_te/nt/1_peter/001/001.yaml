revisions:
- from: 'యేసు మెస్సీయకు అపొస్తలుడైన పేతురు—పొంతు, గలతీయ, కప్పదొకియ, ఆసియ, బితూనియ ప్రాంతాల్లో చెదరిపోయి పరదేశులుగా నివసిస్తున్న, దేవుడు ఎన్నుకున్నవారికి[a][b] వ్రాయునది:'
  to: 'మెస్సీయైన యేసు అపొస్తలుడైన పేతురు, పొంతు, గలతీయ, కప్పదొకియ, ఆసియ, బితూనియ ప్రాంతాల్లో నివసిస్తున్న చెదరిపోయిన పరదేశులైన[a] ఎన్నుకోబడినవారికి[b]:'
  rationale: 'సవరణ మూలంలోని పదక్రమం మరియు వ్యాకరణ సంబంధాలను తెలుగులో సహజంగా పునర్నిర్మిస్తుంది: పేతురు మెస్సీయైన యేసు యొక్క అపొస్తలుడు; గ్రహీతలు ఎన్నుకోబడినవారు, చెదరిపోయిన పరదేశులు; వారు పేర్కొన్న ప్రాంతాల్లో నివసిస్తున్నారు. “దేవుడు” మరియు “వ్రాయునది” వంటి మూలంలో లేని స్పష్టీకరణలను తొలగించాం. διασπορᾶς మరియు παρεπιδήμοις మధ్యనున్న సామాజిక-భౌగోళిక, సంభావ్య ధార్మిక ప్రతిధ్వనిని పాదటిప్పణిలో తెరిచి ఉంచాం.'
