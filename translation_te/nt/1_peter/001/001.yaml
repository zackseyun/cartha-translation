id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: te
  text: 'మెస్సీయైన యేసు అపొస్తలుడైన పేతురు, పొంతు, గలతీయ, కప్పదొకియ, ఆసియ, బితూనియ ప్రాంతాల్లో నివసిస్తున్న చెదరిపోయిన పరదేశులైన[a] ఎన్నుకోబడినవారికి[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చెదరిపోయిన పరదేశులు” అనే పదబంధం యూదుల చెదరిపోవడాన్ని, అలాగే తమ నిజమైన స్వదేశానికి దూరంగా జీవించే దేవుని ప్రజల స్థితిని—రెండింటినీ ప్రతిధ్వనింపజేయవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, “చెదరిపోయిన ప్రవాసులైన ఎన్నుకోబడినవారికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: ఇది సాధారణ దూతను మాత్రమే కాక, గుర్తింపుపొందిన అధికారపూర్వక పరిచర్యను సూచించే పదం; అందుకే స్థిరమైన తెలుగు క్రైస్తవ పదాన్ని నిలిపాం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστόςలోని అభిషిక్తుడు/మెస్సీయ అనే బిరుదు భావాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో సహజమైన నామబంధంగా ఇచ్చాం.
- source_word: ἐκλεκτοῖς
  choice: దేవుడు ఎన్నుకున్నవారు
  rationale: గ్రీకు పదానికి 'ఎన్నుకున్న' అనేది సహజమైన ఆధునిక తెలుగు; కర్త వాక్యార్థంలో అంతర్లీనంగా దేవుడే కావడంతో స్పష్టత కోసం 'దేవుడు' చేర్చాం, కానీ నిర్దిష్ట సిద్ధాంత వ్యవస్థను దిగుమతి చేయలేదు.
- source_word: παρεπιδήμοις
  choice: పరదేశులుగా నివసిస్తున్నవారు
  rationale: తమ స్వదేశం కాని చోట తాత్కాలికంగా లేదా బయటి వారిగా నివసించే స్థితిని సహజ తెలుగులో తెలియజేస్తుంది; 'ప్రవాసులు' అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: διασπορᾶς
  choice: చెదరిపోయి
  rationale: ప్రజలు వివిధ ప్రాంతాల్లో విస్తరించి నివసించడాన్ని తెలిపే διασπορά భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; యూదుల చెదరిపోవడం మరియు దేవుని ప్రజల పరదేశ జీవితం అనే రెండు ప్రతిధ్వనులను మూసివేయకుండా ఉంచాం.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: పొంతు, గలతీయ, కప్పదొకియ, ఆసియ, బితూనియ ప్రాంతాల్లో
  rationale: ప్రాచీన భౌగోళిక పేర్లకు తెలుగు బైబిలు సంప్రదాయంలో గుర్తుపట్టదగిన లిప్యంతరీకరణలను వాడి, సంబంధాన్ని స్పష్టంచేయడానికి 'ప్రాంతాల్లో' చేర్చాం.
theological_decisions:
- issue: ἐκλεκτοῖς యొక్క అర్థం
  choice: దేవుడు ఎన్నుకున్నవారు
  alternative: ఎన్నుకోబడినవారు
  rationale: దేవుని ఎంపిక అనే వాక్య ప్రకటనను నిలుపుతూ, దానిని ఏ ప్రత్యేక పూర్వనిర్ణయ సిద్ధాంతానికి పరిమితం చేయకుండా సాధారణ భాషలో ఇచ్చాం.
- issue: παρεπιδήμοις διασπορᾶς యొక్క సంబంధం
  choice: చెదరిపోయి పరదేశులుగా నివసిస్తున్నవారు
  alternative: చెదరిపోయిన ప్రవాసులు
  rationale: ఈ పదబంధం నిజమైన సామాజిక-భౌగోళిక పరదేశ స్థితిని గానీ, దేవుని ప్రజల ఆధ్యాత్మిక పరదేశ జీవనాన్ని గానీ ప్రత్యేకంగా ఒక్కదానికే పరిమితం చేయదు; రెండింటి మధ్య ఉన్న ఉద్దేశపూర్వక ప్రతిధ్వనిని కాపాడాం.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ యేసును గుర్తించే బిరుదుగా పనిచేస్తుంది; దాని యూద మెస్సీయ సంబంధిత అర్థాన్ని ప్రత్యక్షంగా తెలియజేయడానికి 'మెస్సీయ' వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా ఆరంభ శైలిని వాడాం. గ్రీకు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నప్పటికీ, తెలుగు పఠన సౌలభ్యానికి 'వ్రాయునది:' అనే సంప్రదాయబద్ధమైన కానీ సులభంగా అర్థమయ్యే ముగింపును చేర్చాం. భౌగోళిక పేర్లు సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా ఉంచాం.
