translation:
  language: te
  text: కాని మెస్సీయ[a] యొక్క అమూల్యమైన రక్తంతో—అది లోపమూ మచ్చా లేని గొర్రెపిల్ల రక్తంవంటిది—విమోచించబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తు.” గ్రీకు బిరుదైన Χριστοῦను సంప్రదాయంగా “క్రీస్తు” అని కూడా అనువదించవచ్చు; “మెస్సీయ” దాని బిరుదు భావాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: మునుపటి వాక్యంలోని ‘నశించిపోయే వాటితో కాదు’ అనే నిరాకరణకు బలమైన వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: τιμίῳ
  choice: అమూల్యమైన
  rationale: రక్తానికి ఉన్న అత్యున్నత విలువను, గౌరవాన్ని సహజమైన తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: αἵματι
  choice: రక్తంతో
  rationale: మూలంలోని స్పష్టమైన బలిసంబంధ రూపకాన్ని అలాగే ఉంచుతుంది; దానిని కేవలం ‘మరణం’ అని వివరణాత్మకంగా మార్చదు.
- source_word: ὡς ἀμνοῦ
  choice: గొర్రెపిల్ల రక్తంలాంటి
  rationale: ὡς సూచించే పోలిక రక్తానికే వర్తిస్తుందని తెలుగులో స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: ἀμώμου
  choice: లోపమూ లేని
  rationale: బలిగా అంగీకారయోగ్యమైన జంతువుకు ఉండకూడని దోషాన్ని సూచించే పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἀσπίλου
  choice: మచ్చా లేని
  rationale: ἀμώμουతో ఉన్న సమాంతర జంటను నిలుపుతూ, రెండవ విశేషణంలోని మచ్చలేనితనాన్ని వేరుగా వ్యక్తం చేస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది బిరుదుగా పనిచేస్తున్నందున దాని భావాన్ని పారదర్శకంగా తెలియజేసే ‘మెస్సీయ’ను ఎంచుకున్నాం; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటీపులో ఇచ్చాం.
theological_decisions:
- issue: Χριστοῦను బిరుదుగా లేదా పేరు వంటి రూపంగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός అభిషిక్తుని సూచించే బిరుదుగా అర్థవంతంగా ఉంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని వెల్లడిస్తుంది; ‘క్రీస్తు’ అనే సంప్రదాయ రూపాన్ని సాధ్యమైన ప్రత్యామ్నాయంగా పాదటీపులో ఉంచడం ద్వారా రెండు పఠన సంప్రదాయాలనూ గౌరవించాం.
- issue: బలి గొర్రెపిల్లతో పోలిక యొక్క వ్యాకరణ సంబంధం
  choice: రక్తాన్ని గొర్రెపిల్ల రక్తంతో పోల్చడం
  alternative: మెస్సీయను నేరుగా గొర్రెపిల్లగా పేర్కొనడం
  rationale: ὡς ἀμνοῦ అనే పదబంధం సమీపంలోని αἵματιతో పోలికను ఏర్పరుస్తుంది. అందువల్ల ప్రధాన పాఠంలో పోలిక రక్తానికి సంబంధించినదిగా స్పష్టం చేశాం; బలి సంబంధమైన అంతర్భావాన్ని అదనంగా విప్పి చెప్పలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ఈ వచనం మునుపటి వాక్యంపై ఆధారపడినందున తెలుగులో వాక్యపూర్ణత కోసం సందర్భం నుంచి ‘విమోచించబడ్డారు’ అనే క్రియను పునరుద్ధరించాం.
