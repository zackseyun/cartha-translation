revisions:
- from: కాని లోపమూ మచ్చా లేని గొర్రెపిల్ల రక్తంలాంటి మెస్సీయ[a] అమూల్యమైన రక్తంతో విమోచించబడ్డారు.
  to: కాని మెస్సీయ[a] యొక్క అమూల్యమైన రక్తంతో—అది లోపమూ మచ్చా లేని గొర్రెపిల్ల రక్తంవంటిది—విమోచించబడ్డారు.
  rationale: The revision explicitly expresses “Messiah’s blood” and clearly relates the lamb comparison to that blood. The supplied verb “విమోచించబడ్డారు” remains warranted by the dependent syntax from the preceding verse, as in the draft. The footnote anchor is retained on “మెస్సీయ,” and no theological interpretation beyond the Greek comparison has been added.
  reviewer_model: gpt-5.6-terra
