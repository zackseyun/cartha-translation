source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: te
  text: సత్యానికి విధేయత చూపడం ద్వారా మీ ప్రాణాలను శుద్ధపరచుకొని, నిష్కపటమైన సహోదర ప్రేమ కలిగినవారై[a], హృదయపూర్వకంగా[b] ఒకరినొకరు ప్రగాఢంగా ప్రేమించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తోటి విశ్వాసులపట్ల నిష్కపటమైన ప్రేమ.’ గ్రీకు పదం సహోదరులు, సహోదరీలు సహా తోటి క్రైస్తవుల మధ్య కుటుంబసదృశ అనురాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘శుద్ధమైన హృదయం నుండి’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: పవిత్రపరచుకొని
  rationale: పరిపూర్ణకాల క్రియావిశేషణం ప్రధాన ఆజ్ఞకు ముందున్న, కొనసాగుతున్న ప్రాముఖ్యతగల చర్యను సూచిస్తుంది. తెలుగు సంయుక్త క్రియారూపం ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: ψυχὰς
  choice: మీ ప్రాణాలను
  rationale: ψυχή ఇక్కడ వ్యక్తుల అంతరంగ జీవాన్ని, వారినే సమగ్రంగా సూచిస్తుంది. ‘ప్రాణాలు’ మూలపదానికి దగ్గరగా ఉండి కేవలం బాహ్య జీవితం అనే భావానికి పరిమితం చేయదు.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: సత్యానికి విధేయత చూపడం ద్వారా
  rationale: ἐν సాధనం లేదా పరిధిని సూచించగలదు; ఇక్కడ ‘ద్వారా’ పవిత్రపరచుకోవడానికి విధేయత సాధనమనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἀληθείας
  choice: సత్యం
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం ఉంది; సందర్భంలో ఇది సాధారణ నిజాయితీ కంటే ప్రకటించబడిన సత్యాన్ని సూచిస్తుంది. తెలుగులో ‘సత్యం’ సందర్భానుసారంగా ఆ నిర్దిష్టతను మోస్తుంది.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: నిష్కపటమైన సహోదర ప్రేమ కలిగినవారై
  rationale: εἰς లక్ష్యం లేదా ఫలితాన్ని సూచిస్తుంది. ఈ నిర్మాణం ఆ ప్రేమను పవిత్రీకరణకు ఉద్దేశించిన ఫలితంగా చూపుతుంది; ἀνυπόκριτος ను సహజంగా ‘నిష్కపటమైన’గా అందిస్తుంది.
- source_word: φιλαδελφίαν
  choice: సహోదర ప్రేమ
  rationale: విశ్వాసుల మధ్య కుటుంబసదృశ అనురాగాన్ని సూచించే ప్రత్యేక పదాన్ని తరువాతి సాధారణ ప్రేమ ఆజ్ఞతో కలిపివేయకుండా నిలుపుతుంది. ఇది సహోదరీలను కూడా కలుపుతుందని పాదసూచిక వివరిస్తుంది.
- source_word: ἐκ καρδίας
  choice: హృదయపూర్వకంగా
  rationale: ‘హృదయం నుండి’ అనే మూలభావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; మూలపాఠంలో లేని ‘పవిత్రమైన’ అనే విశేషణాన్ని చేర్చదు.
- source_word: ἀγαπήσατε
  choice: ప్రేమించండి
  rationale: ఆరిస్ట్ ఆజ్ఞార్థకానికి సహజమైన నిర్ణయాత్మక ఆజ్ఞ. నిరంతరత్వాన్ని ప్రత్యేకంగా చేర్చకుండా మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: పరస్పర సంబంధాన్ని తెలిపే ప్రామాణిక, సహజ తెలుగు రూపం.
- source_word: ἐκτενῶς
  choice: ప్రగాఢంగా
  rationale: ప్రేమలోని తీవ్రతను, సంపూర్ణ నిబద్ధతను స్పష్టంగా తెలియజేస్తుంది; అతిగా పురాతనమైన శైలిని నివారిస్తుంది.
theological_decisions:
- issue: φιλαδελφία మరియు ἀγαπάω మధ్య పదభేదం
  choice: φιλαδελφίαను ‘సహోదర ప్రేమ’గా, ἀγαπήσατεను ‘ప్రేమించండి’గా అనువదించడం
  alternative: రెండింటినీ కేవలం ‘ప్రేమ’ అనే ఒకే పదంతో అనువదించడం
  rationale: గ్రీకు వాక్యంలో రెండు సంబంధితమైనా వేర్వేరు పదాలు ఉన్నాయి. వాటి భేదాన్ని నిలుపడం వాక్యపు వాక్చాతుర్యాన్ని కాపాడుతుంది; అయితే వాటి మధ్య మూలం చెప్పని సిద్ధాంతపరమైన విభజనను సృష్టించదు.
- issue: φιλαδελφία యొక్క లింగవ్యాప్తి
  choice: ప్రధాన పాఠంలో ‘సహోదర ప్రేమ’ను ఉంచి, అది సహోదరులు మరియు సహోదరీలైన తోటి విశ్వాసులందరినీ కలుపుతుందని పాదసూచికలో వివరించడం
  alternative: ‘తోటి విశ్వాసులపట్ల ప్రేమ’ లేదా ‘సహోదర సహోదరీల ప్రేమ’
  rationale: ‘సహోదర ప్రేమ’ కుటుంబ అనురాగాన్ని సూచించే మూలపద స్వరూపాన్ని, తరువాతి ప్రేమ క్రియతో ఉన్న భేదాన్ని నిలుపుతుంది. దాని సమగ్ర లింగవ్యాప్తిని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: ἐκ καρδίας తరువాతి పాఠాంతరం
  choice: SBLGNT ప్రకారం ‘హృదయపూర్వకంగా’ అని అనువదించి ‘పవిత్రమైన’ను ప్రధాన పాఠంలో చేర్చకపోవడం
  alternative: ‘పవిత్రమైన హృదయం నుండి’
  rationale: ఇచ్చిన మూలపాఠంలో καθαρᾶς లేదు. ఆ పాఠాంతరం ప్రాముఖ్యమైనదై ఉండటంతో పాదసూచికలో నమోదు చేయబడింది, కాని మూలపాఠానికి విరుద్ధంగా ప్రధాన వాక్యంలో చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఉపదేశ శైలి వాడబడింది. ‘సహోదర ప్రేమ’ మరియు ‘ప్రేమించండి’ మధ్య మూలంలోని పదభేదం నిలుపబడింది. ‘హృదయపూర్వకంగా’ సహజ తెలుగు ప్రయోగం; పాఠాంతరాన్ని మాత్రం పాదసూచికకు పరిమితం చేశాం.
