id: 1PE.1.18
reference: 1 Peter 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: te
  text: నశించిపోయే వస్తువులైన వెండి లేదా బంగారంతో కాదు, మీ పితరుల నుండి[b] సంక్రమించిన మీ వ్యర్థమైన జీవన విధానం నుండి మీరు విమోచించబడ్డారని[a] తెలుసుకొని,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విమోచించబడ్డారు” అని అనువదించిన గ్రీకు క్రియకు మూల్యం చెల్లించి విడిపించబడడం అనే భావం కూడా ఉంది; “వెల చెల్లించి విడిపించబడ్డారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ పూర్వీకుల నుండి సంక్రమించినది.” అక్షరార్థంగా, “మీ పితరుల నుండి అప్పగించబడినది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: మీరు తెలుసు
  rationale: పరిసరంలోని ఉపదేశంతో సంబంధాన్ని నిలుపుతూ, గ్రీకు కృదంతానికి సహజమైన తెలుగు రూపం ఇచ్చింది.
- source_word: ἐλυτρώθητε
  choice: మీరు విమోచించబడ్డారు
  rationale: మూల క్రియలో మూల్యం చెల్లించి విడిపించే భావం ఉంది; ‘విమోచించబడ్డారు’ దాని బైబిలీయ గంభీరతను నిలుపుతుంది, వెండి-బంగారం ప్రస్తావన మూల్య భావాన్ని స్పష్టం చేస్తుంది.
- source_word: φθαρτοῖς
  choice: నశించిపోయే వస్తువులతో
  rationale: సందర్భంలో విశేషణం నామవాచకార్థంలో ఉంది; క్షయానికి, నాశనానికి లోబడే స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: వెండి లేదా బంగారం వంటి
  rationale: వెండి, బంగారం ‘నశించిపోయే వస్తువులకు’ ఉదాహరణలని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ματαίας
  choice: వ్యర్థమైన
  rationale: ఫలహీనత, శూన్యత, ప్రయోజనరాహిత్యం అనే భావాలను సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἀναστροφῆς
  choice: జీవన విధానం
  rationale: కేవలం విడివిడి ప్రవర్తననే కాక, అలవాట్లు మరియు నడవడితో కూడిన మొత్తం జీవనశైలిని సూచిస్తుంది.
- source_word: πατροπαραδότου
  choice: మీ పితరుల నుండి సంక్రమించిన
  rationale: ‘పితరుల నుండి అప్పగించబడినది’ అనే మూలంలోని పితృసంబంధ భాషను, తరతరాలుగా వచ్చిన భావాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: విమోచన పదప్రయోగం
  choice: విమోచించబడ్డారు
  alternative: వెల చెల్లించి విడిపించబడ్డారు
  rationale: ఈ వాక్యభాగం విమోచన/విడుదల భావాన్ని ఇస్తుంది గాని దాని సిద్ధాంతపరమైన విధానాన్ని ఇక్కడే పూర్తిగా నిర్వచించదు; ప్రధాన పాఠం ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: వారసత్వ సంప్రదాయ భాష
  choice: మీ పితరుల నుండి సంక్రమించిన
  alternative: మీ పూర్వీకుల నుండి సంక్రమించిన
  rationale: గ్రీకు పదంలోని ‘పితరులు’ అనే స్పష్టమైన రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, దాని విస్తృత పూర్వీకుల భావాన్ని ప్రత్యామ్నాయంగా గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. గ్రీకు వాక్యంలోని ‘కాక’ అనే వ్యత్యాసాన్ని, తరువాతి వచనంతో కొనసాగే నిర్మాణాన్ని నిలుపుకుంది.
