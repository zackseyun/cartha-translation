- from: 'మీరు తెలుసు: వెండి లేదా బంగారం వంటి నశించిపోయే వస్తువులతో కాక, మీ పితరుల నుండి సంక్రమించిన వ్యర్థమైన జీవన విధానం నుండి మీరు విమోచించబడ్డారు[a].'
  to: నశించిపోయే వస్తువులైన వెండి లేదా బంగారంతో కాదు, మీ పితరుల నుండి[b] సంక్రమించిన మీ వ్యర్థమైన జీవన విధానం నుండి మీరు విమోచించబడ్డారని[a] తెలుసుకొని,
