  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: te
  text: విధేయులైన పిల్లలుగా[a], మీరు అజ్ఞానంలో ఉన్నప్పుడు మీకున్న కోరికలకు అనుగుణంగా మిమ్మల్ని మీరు మలచుకోకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “విధేయత యొక్క పిల్లలుగా.” లేదా, “విధేయతగల పిల్లలుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: గా
  rationale: ఈ ఉపదేశాన్ని వారు ఏ గుర్తింపుతో ఆచరించాలో సూచిస్తుంది; తెలుగులో ‘గా’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τέκνα ὑπακοῆς
  choice: విధేయతకు చెందిన పిల్లలు
  rationale: ‘విధేయులైన పిల్లలు’ అనే సహజ భావాన్ని తెలియజేస్తూనే, మూలంలోని ‘విధేయత యొక్క పిల్లలు’ అనే గుర్తింపు-ఆధారిత షష్ఠీ నిర్మాణ బలాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: μὴ συσχηματιζόμενοι
  choice: మిమ్మల్ని మీరు మలచుకోకండి
  rationale: వర్తమాన మధ్యమ/కర్మణి కృదంతంలోని కొనసాగుతున్న స్వీయ-అనురూపత నిషేధాన్ని సహజమైన తెలుగు ఉపదేశ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: కోరికలకు
  rationale: ఈ సందర్భంలో నైతికంగా తప్పుదారిపట్టించే బలమైన ఆశలను సూచిస్తుంది; ‘కోరికలు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, కేవలం లైంగిక అర్థానికే పరిమితం చేయదు.
- source_word: πρότερον
  choice: ఇంతకుముందు ... కలిగిన
  rationale: వారి మునుపటి జీవనస్థితిలో ఉన్న కోరికలతో సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: మీరు ... అజ్ఞానంలో ఉన్నప్పుడు
  rationale: మూలంలోని ‘మీ అజ్ఞానంలో’ అనే భావాన్ని కాలసంబంధ ఉపవాక్యంగా సహజ తెలుగులో అందిస్తూ, ఆ అజ్ఞానం ఏమి గురించో అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: τέκνα ὑπακοῆς అనే గుర్తింపు-సూచక షష్ఠీ నిర్మాణాన్ని విశేషణంగా సులభీకరించాలా
  choice: విధేయతకు చెందిన పిల్లలుగా
  alternative: విధేయులైన పిల్లలుగా
  rationale: ఎంచుకున్న రూపం మూలంలోని ‘విధేయతతో లక్షణీకరించబడిన సంతానం’ అనే గుర్తింపు బలాన్ని నిలుపుతుంది; అదే సమయంలో విధేయత వల్ల అక్షరార్థంగా జన్మించారని చెప్పే అదనపు సిద్ధాంత భావాన్ని చేర్చదు.
- issue: ἐν τῇ ἀγνοίᾳ ὑμῶν లోని అజ్ఞానాన్ని దేవుని గురించిన అజ్ఞానంగా స్పష్టీకరించాలా
  choice: అజ్ఞానంలో ఉన్నప్పుడు
  alternative: దేవుణ్ణి ఎరుగకముందు
  rationale: సందర్భం ఆ దిశగా సూచించినా, ఈ వాక్యంలో కర్మ స్పష్టంగా లేదు. అందువల్ల మూలంలోని విస్తృతమైన నైతిక-జ్ఞాన సంబంధ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన ఉపదేశ శైలి. ప్రధాన పాఠ్యంలో మూలంలోని గుర్తింపు-ఆధారిత నిర్మాణాన్ని నిలుపుతూ, పాదటిప్పణిలో మరింత సహజమైన ప్రత్యామ్నాయం ఇచ్చాం.
