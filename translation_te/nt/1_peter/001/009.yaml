id: 1PE.1.9
reference: 1 Peter 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κομιζόμενοι τὸ τέλος τῆς πίστεως ⸀ὑμῶν σωτηρίαν ψυχῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/009.yaml
  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: te
  text: మీ విశ్వాసపు ఫలితమైన[a] మీ ప్రాణాల రక్షణను[b] పొందుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అంతం,” “గమ్యం,” లేదా “ఫలం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “మీ జీవితాల రక్షణను” లేదా “మీ వ్యక్తుల రక్షణను.” గ్రీకు పదం సందర్భాన్ని బట్టి “ప్రాణాలు,” “జీవితాలు,” లేదా “వ్యక్తులు” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: పొందుతూ ఉన్నారు
  rationale: వర్తమాన కృదంతం పాఠకులు విశ్వాసపు ఫలాన్ని పొందుతున్న కొనసాగుతున్న భావాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉండేందుకు సమాపక క్రియారూపంగా అనువదించబడింది.
- source_word: τέλος
  choice: ఫలం
  rationale: ఇక్కడ విశ్వాసం చేరుకునే సాకారమైన పరిణామం లేదా ఫలితం ఉద్దేశించబడింది. ‘అంతం’ కేవలం కాలపరమైన ముగింపుగా వినిపించవచ్చు; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: πίστεως ὑμῶν
  choice: మీ విశ్వాసం యొక్క
  rationale: πίστις ఇక్కడ పాఠకుల విశ్వాసాన్ని సూచిస్తుంది; ὑμῶν అనే బహువచన స్వామ్య సర్వనామం ‘మీ’గా నేరుగా వ్యక్తమైంది.
- source_word: σωτηρίαν
  choice: రక్షణను
  rationale: ఈ పత్రిక సందర్భంలో σωτηρίαకు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం ‘రక్షణ’; ఇది ప్రస్తుత అనుభవాన్నీ భావి సంపూర్ణతనూ ముందుగానే పరిమితం చేయదు.
- source_word: ψυχῶν
  choice: ప్రాణాల
  rationale: ψυχή అనేది సందర్భాన్ని బట్టి ప్రాణం, జీవితం, వ్యక్తి అనే అర్థాలను కలిగి ఉంటుంది. ‘ప్రాణాల’ అనేది సహజమైన తెలుగు ప్రయోగంగా ఉండి, కేవలం దేహరహిత ఆత్మలను మాత్రమే సూచిస్తున్నట్లు బలవంతంగా అర్థం చేయదు.
theological_decisions:
- issue: πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ‘మీ విశ్వాసం’ అనే సందర్భంలో ఇది పాఠకుల విశ్వాస స్పందనను అత్యంత సహజంగా సూచిస్తుంది; ‘విశ్వసనీయత’ను ప్రధాన పాఠ్యంలో పెట్టడానికి సందర్భం తగినంత బలంగా లేదు.
- issue: ψυχῶν σωτηρίαν యొక్క మానవశాస్త్ర సంబంధ భావం
  choice: మీ ప్రాణాల రక్షణ
  alternative: మీ జీవితాల రక్షణ; మీ వ్యక్తుల రక్షణ
  rationale: మూలపదంలోని విస్తృత భావాన్ని ‘ప్రాణాలు’ సహజంగా నిలుపుతుంది. ఈ అనువాదం శరీర రక్షణను నిరాకరించదు, అలాగే కఠినమైన దేహం–ఆత్మ ద్వైతాన్ని వాక్యంపై రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కృదంత సంబంధాన్ని సహజ తెలుగు వాక్య నిర్మాణంతో అందించాం; దీర్ఘ డాష్‌లు ‘ఫలం’ ఏమిటో వివరణాత్మకంగా చూపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
