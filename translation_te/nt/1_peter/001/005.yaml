id: 1PE.1.5
reference: 1 Peter 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: te
  text: మీరు దేవుని శక్తిచేత, విశ్వాసం[a] ద్వారా, చివరి సమయంలో[b] బయలుపరచబడడానికి సిద్ధంగా ఉన్న రక్షణ కొరకు కాపాడబడుతున్నవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకం ద్వారా”; ఇక్కడ “నమ్మకత్వం ద్వారా” అనే అర్థం తక్కువ సంభావ్యం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “చివరి కాలంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουρουμένους
  choice: కాపాడబడుతున్న
  rationale: వర్తమానకాల కర్మణి కృదంతం కొనసాగుతున్న కాపుదలను సూచిస్తుంది. ‘కాపాడబడుతున్న’ అనేది రక్షణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν δυνάμει θεοῦ
  choice: దేవుని శక్తిచేత
  rationale: కర్మణి రూపంతో కలిసి ἐν ఇక్కడ సాధనార్థాన్ని సూచిస్తుంది. దేవుని శక్తే కాపుదలకు మూలమూ సాధనమూ అని ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: διὰ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: πίστις‌కు సందర్భానుకూల ప్రధాన అర్థంగా ‘విశ్వాసం’ ఎంచుకోబడింది; διὰ విశ్వాసాన్ని దేవుని కాపుదలలో మధ్యవర్తి సాధనంగా చూపిస్తుంది. ఇతర సాధ్యమైన అర్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: εἰς σωτηρίαν
  choice: రక్షణ కోసం
  rationale: εἰς లక్ష్యం లేదా ఫలితాన్ని సూచిస్తుంది. తరువాత వచ్చే భవిష్యద్ముఖ వివరణతో ‘రక్షణ కోసం’ సహజంగా కలుస్తుంది.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: బయలుపరచబడడానికి సిద్ధంగా ఉన్న
  rationale: విశేషణం–క్రియార్థక నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తూ, రక్షణ ఇంకా బయలుపరచబడవలసి ఉన్నదనే భావాన్ని నిలుపుతుంది.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: చివరి కాలంలో
  rationale: καιρός నిర్ణీతమైన లేదా కీలకమైన కాలాన్ని సూచించగలదు. ‘చివరి కాలంలో’ అంత్యకాల భావాన్ని అనవసరమైన సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- source_word: τοὺς
  choice: మీరు
  rationale: ఈ నిశ్చయార్థక పదం ముందు వచనంలోని సంబోధితులను తిరిగి సూచిస్తుంది. తెలుగు వాక్యంలో చివర ఉంచిన ‘మీరు’ సంబంధ కృదంత నిర్మాణాన్ని, ముందరి వచనంతో ఉన్న అనుసంధానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: διὰ πίστεωςలో దేవుని కాపుదలకూ మానవ విశ్వాసానికీ ఉన్న సంబంధం
  choice: కాపాడేది దేవుని శక్తి; ఆ కాపుదల విశ్వాసం ద్వారా జరుగుతుందని వాక్య నిర్మాణం తెలిపే విధంగా అనువదించబడింది.
  alternative: విశ్వాసాన్ని కేవలం అదనపు వివరణగా చూడడం; లేదా πίστις‌ను ప్రధానంగా ‘విశ్వసనీయత’గా అర్థం చేసుకోవడం.
  rationale: అనువాదం దేవుని శక్తినీ విశ్వాసం ద్వారా అనే సాధనార్థాన్నీ రెండింటినీ నిలుపుతుంది; విశ్వాసుల నిలకడ లేదా తొలగిపోవడం గురించి వాక్యం చెప్పనిదాన్ని ఇందులో చేర్చదు.
- issue: రక్షణ బయలుపడే అంత్యకాల సమయం
  choice: రక్షణ తన బయలుపాటులో భవిష్యద్ముఖంగా ఉందని పాఠం సూచించే భావం నిలుపబడింది.
  alternative: ఇది కేవలం ప్రస్తుత మారుమనస్సును మాత్రమే సూచిస్తుందని భావించడం; లేదా రక్షణకు ఎలాంటి ప్రస్తుత పార్శ్వమూ లేదని తేల్చడం.
  rationale: ‘బయలుపరచబడడానికి సిద్ధంగా ఉన్న’ మరియు ‘చివరి కాలంలో’ అనే పదాలు భవిష్యత్తు దిశను స్పష్టం చేస్తాయి; అయితే కొత్త నిబంధనలో రక్షణకు ఉండే ఇతర కాలపరమైన పార్శ్వాల గురించి ఈ వచనం చెప్పనిదాన్ని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని సంబంధ కృదంత నిర్మాణం ముందరి వచనంతో అనుసంధానాన్ని చూపేందుకు ‘మీరు’తో ముగించబడింది. ‘కాపాడబడుతున్న’ కొనసాగుతున్న దైవిక కాపుదలను, ‘రక్షణ కోసం’ భవిష్యద్ముఖ లక్ష్యాన్ని సహజంగా తెలియజేస్తాయి.
