id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: te
  text: అగ్నితో పరీక్షించబడుతున్నప్పటికీ నశించిపోయే బంగారం కంటే మరింత విలువైన మీ విశ్వాసపు పరీక్షిత యథార్థత, యేసు మెస్సీయ ప్రత్యక్షత సమయంలో స్తుతి, మహిమ, ఘనతకు దారితీసేదిగా తేలాలని[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ విశ్వాసం పరీక్షించబడడం.” గ్రీకు పదం పరీక్షించే ప్రక్రియను గానీ, పరీక్ష ద్వారా రుజువైన యథార్థతను గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యేసు క్రీస్తు.” ఇక్కడ “మెస్సీయ” అనేది Χριστός అనే బిరుదు యొక్క అర్థాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκίμιον
  choice: పరీక్షకు నిలిచి నిజమైనదని రుజువైన విశ్వాసం
  rationale: ఈ పదం పరీక్షించే ప్రక్రియను లేదా పరీక్ష ద్వారా రుజువైన యథార్థతను సూచించగలదు. సందర్భంలో బంగారంతో పోలిక ఉన్నందున ఫలితార్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేశాం.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఇక్కడ విశ్వాసుల విశ్వాసమే పరీక్షకు లోనవుతోంది; ఆధునిక ప్రామాణిక తెలుగులో ఇది సరళమైన, సాధారణ సమానార్థకం.
- source_word: πολυτιμότερον
  choice: ఎంతో విలువైనది
  rationale: బంగారంతో విలువాపరమైన పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπολλυμένου
  choice: నశించిపోయే
  rationale: శుద్ధీకరించబడిన బంగారం కూడా అంతిమంగా నిలిచేది కాదనే క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: διὰ πυρὸς ... δοκιμαζομένου
  choice: అగ్నితో పరీక్షించబడినా
  rationale: బంగారం అగ్నిని సాధనంగా ఉపయోగించి పరీక్షించబడుతుందనే భావాన్ని, concessive δέ యొక్క సందర్భోచిత బలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εὑρεθῇ εἰς
  choice: కలిగించేదిగా తేలాలి
  rationale: ‘కనుగొనబడాలి/తేలాలి’ అనే నిష్క్రియ భావాన్నీ, εἰς సూచించే ఫలితాన్నీ తెలుగులో స్పష్టంగా కలుపుతుంది.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: స్తుతి, మహిమ, ఘనత
  rationale: మూడు నామవాచకాల క్రమాన్ని, వాటి మధ్య ఉన్న ఉత్కర్షభరిత సముచ్చయాన్ని కాపాడుతుంది.
- source_word: ἐν ἀποκαλύψει
  choice: బయలుపరచబడే సమయంలో
  rationale: ఇక్కడ కాలార్థం సహజమైనది; యేసు ప్రత్యక్షంగా వెల్లడి అయ్యే సందర్భాన్ని సూచిస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός అనే బిరుదు యొక్క అర్థాన్ని ‘మెస్సీయ’గా తెలియజేస్తూ, తెలుగులో స్థిరమైన లిప్యంతరీకరణను ఉపయోగిస్తుంది.
theological_decisions:
- issue: τὸ δοκίμιον ὑμῶν τῆς πίστεως యొక్క భావం
  choice: పరీక్ష ద్వారా విశ్వాసం నిజమైనదని రుజువయ్యే ఫలితార్థం
  alternative: మీ విశ్వాసం పరీక్షించబడే ప్రక్రియ
  rationale: δοκίμιον రెండు భావాలకు చోటిచ్చినా, అగ్నితో పరీక్షించిన బంగారంతో పోలిక ఫలితంగా నిరూపితమైన యథార్థతను ముందుకు తెస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: స్తుతి, మహిమ, ఘనత ఎవరికి కలుగుతాయనే ప్రశ్న
  choice: గ్రహీతను లేదా మూలాన్ని స్పష్టంగా చేర్చకుండా గ్రీకు పాఠ్యంలోని అనిశ్చితిని నిలిపాం
  alternative: విశ్వాసులకు లభించే ఘనత; దేవునికి లేదా మెస్సీయకు చెల్లే స్తుతి; రెండింటినీ కలిపిన అంత్యకాల సమర్థన
  rationale: గ్రీకు పాఠ్యం ఈ త్రయంలోని స్తుతి, మహిమ, ఘనత ఎవరికి చెందుతాయో ప్రత్యక్షంగా చెప్పదు; అందువల్ల సిద్ధాంతపరమైన నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
- issue: Χριστός యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ బిరుదు యొక్క అభిషిక్తుడు అనే మెస్సీయ సంబంధిత అర్థాన్ని ప్రధాన పాఠ్యంలో ప్రత్యక్షంగా అందిస్తుంది; పరిచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన గ్రంథశైలిని నిలిపాం. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; ప్రధాన ఉద్దేశార్థ సంబంధం, బంగారం ఉపమానం, అంత్యకాల సందర్భం కాపాడబడ్డాయి. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
