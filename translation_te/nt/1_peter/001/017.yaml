  verdict: revise
  source_fidelity: The draft correctly conveys impartial judgment according to each person's work, but it turns the conditional εἰ ('if') into a causal 'గనుక' ('since/because'). The revision restores the conditional structure. It also retains φόβῳ as 'భయంతో' in the main text rather than interpreting it as the blended devotional expression 'భయభక్తులతో.'
  naturalness: The revised wording is modern, clear Telugu and keeps the ethical force of the imperative. 'పరదేశులుగా నివసించే కాలమంతా' naturally expresses the duration and foreign-resident sense of παροικία.
  terminology: '''తండ్రి'' appropriately refers to God; ''పక్షపాతం లేకుండా'' accurately renders ἀπροσωπολήμπτως; ''తీర్పు తీర్చే'' and ''ప్రతి ఒక్కరి పనిని బట్టి'' preserve the present judicial and individual-accountability senses. The alternatives in the footnotes preserve lexical range without imposing doctrinal interpretation.'
