id: 1PE.1.17
reference: 1 Peter 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: te
  text: మీరు పక్షపాతం లేకుండా ప్రతి ఒక్కరి పనిని బట్టి తీర్పు తీర్చే ఆయనను తండ్రి అని పిలుస్తున్నట్లయితే,[a] మీరు పరదేశులుగా నివసించే కాలమంతా భయంతో[b] జీవించండి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను తండ్రిగా వేడుకొంటున్నట్లయితే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భయభక్తులతో” లేదా “భక్తిపూర్వక విస్మయంతో.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మీ పరదేశ జీవనకాలమంతా.” గ్రీకు పదం విదేశిగా లేదా తాత్కాలిక నివాసిగా జీవించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: తండ్రి అని పిలిచే
  rationale: మధ్యమ ప్రయోగంలోని ‘సంబోధించడం/వేడుకోవడం’ అనే భావాన్ని, πατέρα అనే విధేయ పదంతో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀπροσωπολήμπτως
  choice: పక్షపాతం లేకుండా
  rationale: వ్యక్తుల హోదా లేదా బాహ్య స్థితిని బట్టి మొగ్గుచూపకుండా తీర్పు తీర్చడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: ప్రతి ఒక్కరి పనిని బట్టి
  rationale: κατά సూచించే ప్రమాణ భావాన్ని, ἔργον యొక్క ఏకవచన సమష్టి భావాన్ని కాపాడుతుంది; తీర్పు స్వరూపంపై అదనపు సిద్ధాంతాన్ని చేర్చదు.
- source_word: ἐν φόβῳ
  choice: భయభక్తులతో
  rationale: φόβοςలోని భయం, భక్తిపూర్వక గౌరవం అనే సందర్భోచిత భావాలను తెలుగులో సహజంగా కలిపి వ్యక్తపరుస్తుంది; కేవలం భయంగా గానీ కేవలం గౌరవంగా గానీ సంకుచితం చేయదు.
- source_word: παροικίας
  choice: పరదేశులుగా నివసించే
  rationale: విదేశిగా లేదా తాత్కాలిక నివాసిగా జీవించే స్థితిని ఆధునిక పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది; రాజకీయ బహిష్కరణ అనే భావాన్ని తప్పనిసరిగా రుద్దదు.
- source_word: ἀναστράφητε
  choice: జీవించండి
  rationale: ఇక్కడ క్రియ మొత్తం జీవన ప్రవర్తనను సూచిస్తుంది. ‘జీవించండి’ సహజమైన ఆధునిక తెలుగు; ఆజ్ఞార్థక నైతిక బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: తండ్రి అయిన దేవుని తీర్పు సందర్భంలో φόβος భావం
  choice: ప్రధాన పాఠ్యంలో ‘భయభక్తులతో’
  alternative: ‘భయంతో’ లేదా ‘భక్తిపూర్వక విస్మయంతో’
  rationale: తండ్రిగా సాన్నిహిత్యాన్నీ, నిష్పక్షపాత న్యాయాధిపతిగా జవాబుదారీతనాన్నీ వాక్యం కలిపి ఉంచుతుంది. తెలుగు ‘భయభక్తులు’ ఈ ఉద్రిక్తతను సహజంగా నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- issue: పనిని బట్టి తీర్పు యొక్క పరిధి
  choice: ‘ప్రతి ఒక్కరి పనిని బట్టి’ అని నేరుగా అనువదించడం
  alternative: విశ్వాసుల అంతిమ తీర్పు లేదా దైవ మూల్యాంకనానికి సంబంధించిన నిర్దిష్ట సిద్ధాంత వివరణ
  rationale: గ్రీకు పాఠ్యం చెప్పిన వ్యక్తిగత జవాబుదారీతనాన్ని మాత్రమే వ్యక్తపరుస్తుంది; పుణ్యం, రక్షణ లేదా నిశ్చయతపై ఏ సంప్రదాయ సిద్ధాంతాన్నీ అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సామాన్య పాఠకులకు సులభంగా ఉండే శైలి. ‘పరదేశులుగా నివసించే’ అన్నది అపరిచితమైన ‘ప్రవాసకాలం’ కంటే స్పష్టమైనది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
