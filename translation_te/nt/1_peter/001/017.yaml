  - severity: medium
    issue: The main-text rendering 'భయభక్తులతో' narrows/interprets ἐν φόβῳ.
    rationale: φόβος can include reverence, but the source and English audit deliberately retain 'fear' to preserve the tension. 'భయంతో' is the more direct main-text equivalent; reverential alternatives belong in a footnote.
