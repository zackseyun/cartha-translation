- from: మీరు తండ్రి అని పిలిచే ఆయన ప్రతి ఒక్కరి పనిని బట్టి పక్షపాతం లేకుండా తీర్పు తీర్చేవాడు గనుక,[a] మీరు పరదేశులుగా నివసించే కాలమంతా భయభక్తులతో[b] జీవించండి.[c]
