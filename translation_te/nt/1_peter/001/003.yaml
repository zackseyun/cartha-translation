revisions:
- from: మన ప్రభువైన యేసు మెస్సీయకు[a] దేవుడూ తండ్రీ అయినవాడు స్తుతింపబడుగాక! ఆయన తన గొప్ప కనికరం ప్రకారం, మృతులలో నుండి యేసు మెస్సీయ పునరుత్థానం చెందడం ద్వారా సజీవమైన నిరీక్షణ కలిగేలా మనలను మళ్లీ జన్మింపజేశాడు[b].
  to: మన ప్రభువైన యేసు మెస్సీయకు దేవుడూ తండ్రీ అయినవాడు స్తుతింపబడుగాక! ఆయన తన గొప్ప కనికరం ప్రకారం, యేసు మెస్సీయ మృతులలోనుండి పునరుత్థానం చెందడం ద్వారా సజీవమైన నిరీక్షణలోకి మనలను మళ్లీ జన్మింపజేశాడు[b].
  rationale: 'The revision makes only source-driven and idiomatic adjustments: it renders εἰς ἐλπίδα ζῶσαν as movement into a living hope rather than merely causing hope to arise, standardizes ‘మృతులలోనుండి,’ and clarifies the lexical footnote for the active new-birth verb. The title ‘మెస్సీయ’ and the doxological register are retained. Footnote marker a remains attached to the first occurrence of ‘యేసు మెస్సీయ,’ as in the English audit trail; marker b remains attached to the new-birth verb.'
  reviewer_model: gpt-5.6-terra
