id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయకు దేవుడూ తండ్రీ అయినవాడు స్తుతింపబడుగాక! ఆయన తన గొప్ప కనికరం ప్రకారం, యేసు మెస్సీయ మృతులలోనుండి పునరుత్థానం చెందడం ద్వారా సజీవమైన నిరీక్షణలోకి మనలను మళ్లీ జన్మింపజేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘మనకు కొత్త జన్మనిచ్చాడు.’ గ్రీకు క్రియ మళ్లీ జన్మింపజేయడం, లేదా కొత్త జన్మ ఇవ్వడం అనే రూపకాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: స్తుతింపబడుగాక
  rationale: ఇది దైవస్తుతిని వ్యక్తపరిచే విశేషణ ప్రయోగం. తెలుగులో ‘స్తుతింపబడుగాక’ ఆరాధనాత్మక ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది; ‘ధన్యుడు’ ఇక్కడ ఉద్దేశించిన స్తుతి భావాన్ని అంత స్పష్టంగా ఇవ్వదు.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: దేవుడూ తండ్రీ అయినవాడు
  rationale: ఒకే నిర్దేశక పదం కింద ఉన్న రెండు నామాలను నిలుపుతూ, ప్రభువుతో దేవునికున్న సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος ఇక్కడ మర్యాదపూర్వక సంబోధన మాత్రమే కాక అధికారాన్ని సూచించే బిరుదు; అందువల్ల ‘ప్రభువు’ సరైన ఎంపిక.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ అభిషిక్తుడనే అర్థమున్న బిరుదు. ‘మెస్సీయ’ ఆ బిరుదు స్వరూపాన్ని నిలుపుతుంది; తెలుగు వాక్యనిర్మాణంలో ‘యేసు మెస్సీయ’ సహజంగా ఉంటుంది.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: ఆయన తన గొప్ప కనికరం ప్రకారం
  rationale: κατά ఇక్కడ ప్రమాణం లేదా అనుగుణతను సూచిస్తుంది. ‘ప్రకారం’ ఆ భావాన్ని కాపాడుతుంది; πολὺను ‘గొప్ప’గా సహజంగా అందించింది.
- source_word: ἀναγεννήσας
  choice: మనలను మళ్లీ జన్మింపజేశాడు
  rationale: దేవుడే కార్యసాధకుడని స్పష్టంగా ఉంచుతూ, మళ్లీ పుట్టించడం అనే జనన రూపకాన్ని నిలుపుతుంది.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: సజీవమైన నిరీక్షణ కలిగేలా
  rationale: εἰς సూచించే లక్ష్యం లేదా ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ζῶσαν యొక్క సజీవ రూపకాన్ని అలాగే ఉంచుతుంది.
- source_word: δι’ ἀναστάσεως
  choice: పునరుత్థానం చెందడం ద్వారా
  rationale: διά + సంబంధ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; ‘ద్వారా’ దానిని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలో నుండి
  rationale: పునరుత్థాన సందర్భంలో ἐκ νεκρῶνకు సహజమైన, మూలభాషకు దగ్గరైన తెలుగు రూపం.
theological_decisions:
- issue: Χριστός అనే క్రీస్తుసంబంధ బిరుదును ఎలా అనువదించాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστόςను పేరు భాగంలా మాత్రమే కాక అర్థవంతమైన బిరుదుగా చూపేందుకు ‘మెస్సీయ’ను ఎంచుకున్నాం. ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ἀναγεννήσαςలో దేవుని కార్యసాధకత్వం
  choice: మనలను మళ్లీ జన్మింపజేశాడు
  alternative: మనకు కొత్త జన్మనిచ్చాడు
  rationale: గ్రీకు వాక్యంలో దేవుడే కొత్త జననాన్ని కలిగించే కర్త. అనువాదం ఆ కార్యసాధకత్వాన్ని, జనన రూపకాన్ని రెండింటినీ నిలుపుతుంది; దాని పరిధికి మించిన సిద్ధాంత నిర్ణయాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, ఆరాధనాత్మక శైలి. ‘స్తుతింపబడుగాక’ దైవస్తుతి స్వరాన్ని నిలుపుతుంది. మిగిలిన వాక్యం సాధారణ పాఠకునికి అర్థమయ్యేలా సహజంగా ఉన్నప్పటికీ, దేవుని కార్యసాధకత్వం, సజీవ నిరీక్షణ, పునరుత్థానం ద్వారా అనే మూలపాఠ్య సంబంధాలను స్పష్టంగా కాపాడింది.
