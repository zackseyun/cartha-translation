source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: te
  text: ఆయన ద్వారా దేవునిని విశ్వసిస్తున్నవారైన మీరు[a]—ఆ దేవుడే ఆయనను మృతులలోనుండి లేపి ఆయనకు మహిమ ఇచ్చాడు—అలా మీ విశ్వాసమూ నిరీక్షణా దేవునిపై ఉండేలా చేశారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన ద్వారా దేవుని పట్ల నమ్మకంగా ఉన్న మీరు.’ అయితే ఇక్కడ దేవునిని విశ్వసించేవారనే భావమే ఎక్కువ సంభావ్యం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాని ఫలితంగా మీ విశ్వాసమూ నిరీక్షణా దేవునిపై ఉన్నాయి.’
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారా
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ మాధ్యమాన్ని సూచిస్తుంది. క్రీస్తు ద్వారా దేవునిపై విశ్వాసం కలిగిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πιστοὺς εἰς θεόν
  choice: దేవుని విశ్వసిస్తున్నవారు
  rationale: πιστός అనే పదానికి ‘నమ్మకమైన’ అనే అర్థం సాధ్యమైనా, εἰς θεόν తో ఉన్న నిర్మాణం దేవునిని విశ్వసించేవారిని సూచించే అవకాశమే ఎక్కువ.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: ఆ దేవుడే ఆయనను మృతులలోనుండి లేపి
  rationale: ఇది పునరుత్థానాన్ని సూచించే ప్రామాణిక గ్రీకు ప్రయోగం. ‘మృతులలోనుండి’ అనేది ἐκ νεκρῶν యొక్క సమూహార్థాన్ని నిలుపుతుంది.
- source_word: δόξαν αὐτῷ δόντα
  choice: ఆయనకు మహిమ ఇచ్చాడు
  rationale: గ్రీకు పదబంధాన్ని నేరుగా, సహజమైన తెలుగులో అందిస్తుంది; దేవుడు క్రీస్తుకు మహిమను అనుగ్రహించాడనే భావాన్ని కాపాడుతుంది.
- source_word: ὥστε
  choice: కాబట్టి
  rationale: దేవుడు క్రీస్తును లేపి మహిమపరచిన కార్యం నుంచి వచ్చే పర్యవసానాన్ని తెలుపుతుంది; ఉద్దేశం–ఫలితం మధ్య గ్రీకులో ఉన్న స్వల్ప విస్తృతిని పాదసూచికలో నిలుపుతుంది.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: మీ విశ్వాసమూ నిరీక్షణా
  rationale: πίστις, ἐλπίς పదాలకు వరుసగా స్థిరమైన, సహజమైన తెలుగు సమానార్థాలు ‘విశ్వాసం’, ‘నిరీక్షణ’.
- source_word: εἶναι εἰς θεόν
  choice: దేవునిపైనే ఉన్నాయి
  rationale: εἰς ఇక్కడ విశ్వాసం, నిరీక్షణ దిశను లేదా ఆధారాన్ని సూచిస్తుంది. ‘దేవునిపైనే’ తెలుగులో సహజంగా ఉండి ఆ దిశను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: πιστούς యొక్క భావం
  choice: దేవునిని విశ్వసించేవారు
  alternative: దేవుని పట్ల నమ్మకంగా ఉన్నవారు
  rationale: వెంటనే వచ్చే εἰς θεόν అనే పదబంధం సాధారణ నమ్మకత్వం కంటే దేవునిపై విశ్వాసాన్ని సూచిస్తుంది; అయినా సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: దేవునితో సంబంధంలో క్రీస్తు పాత్ర
  choice: ఆయన ద్వారా
  alternative: ఆయన మూలంగా
  rationale: διά + షష్ఠీ విభక్తి క్రీస్తును మాధ్యమంగా చూపుతుంది; పాఠ్యంలో లేని విస్తృత సిద్ధాంత వివరణను చేర్చదు.
- issue: ὥστε ఉపవాక్య బలం
  choice: కాబట్టి
  alternative: దాని ఫలితంగా
  rationale: ఈ ఉపవాక్యం దేవుని కార్యం నుంచి వచ్చే పర్యవసానాన్ని సూచిస్తుంది. గ్రీకులో ఫలితం లేదా ఉద్దేశ్యఫలితం అనే రెండింటికీ చోటుండటంతో పాఠ్యం దానిని అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ముందరి వాక్యంతో అనుసంధానమయ్యే గ్రీకు accusative relative నిర్మాణాన్ని ‘వారైన మీరు’ ద్వారా నిలిపాం. ‘ఆ దేవుడే’ అనే పునర్నిర్దేశం దేవుడే లేపి మహిమ ఇచ్చాడని స్పష్టం చేస్తుంది; ‘ఆయన’ సర్వనామం క్రీస్తును సూచిస్తుంది.
