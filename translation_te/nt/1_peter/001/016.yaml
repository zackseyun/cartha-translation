  text: διότι γέγραπται ⸀ὅτι Ἅγιοι ⸀ἔσεσθε, ὅτι ἐγὼ ⸀ἅγιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/016.yaml
  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: te
  text: 'ఎందుకంటే ఇలా వ్రాయబడి ఉంది: “మీరు పరిశుద్ధులుగా ఉంటారు, ఎందుకంటే నేను పరిశుద్ధుణ్ణి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ఆజ్ఞార్థక భావాన్ని మరింత నేరుగా చూపిస్తూ, “పరిశుద్ధులుగా ఉండండి.” గ్రీకులో లేఖన ఉల్లేఖనాన్ని అనుసరించి భవిష్యత్ రూపం ఉంది: “మీరు పరిశుద్ధులుగా ఉంటారు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి లేఖనాధారాన్ని చూపించే కారణార్థక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γέγραπται
  choice: వ్రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు పరిపూర్ణ కర్మణి సూత్రప్రయోగాన్ని, వ్రాత యొక్క కొనసాగుతున్న ప్రామాణికతతో సహా, తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: Ἅγιοι
  choice: పరిశుద్ధులుగా
  rationale: దేవునికి ప్రత్యేకంగా చెందిన స్థితినీ నైతిక పరిశుద్ధతనూ కలిపి సూచించే సంప్రదాయబద్ధమైన, స్పష్టమైన తెలుగు పదం.
- source_word: ἔσεσθε
  choice: ఉంటారు
  rationale: గ్రీకులోని భవిష్యత్ సూచక రూపాన్ని నేరుగా నిలుపుతుంది; లేవీయకాండ ఉల్లేఖన సందర్భంలో దానికున్న ఆజ్ఞార్థక బలాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: రెండవ ὅτι దేవుని పరిశుద్ధతను ప్రజల పరిశుద్ధతకు కారణంగా చూపుతుంది; తెలుగు వాక్యక్రమంలో ‘కాబట్టి’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐγὼ ἅγιος
  choice: నేను పరిశుద్ధుణ్ణి
  rationale: ἐγώ అనే స్పష్టమైన సర్వనామాన్ని నిలిపి, దైవ స్వీయప్రస్తావనలోని ఉద్ఘాటనను కాపాడుతుంది; దేవుని పరిశుద్ధతను పురుష ఏకవచన రూపంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పరిశుద్ధత ఉల్లేఖనంలో ἔσεσθε అనే భవిష్యత్ రూపం యొక్క భావబలం
  choice: “మీరు పరిశుద్ధులుగా ఉంటారు” అని భవిష్యత్ రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుట
  alternative: “పరిశుద్ధులుగా ఉండండి” అనే ప్రత్యక్ష ఆజ్ఞార్థక అనువాదం
  rationale: SBLGNTలో లేవీయకాండ ఉల్లేఖనం భవిష్యత్ సూచక రూపంలో ఉంది; బైబిలు ధర్మశాస్త్ర/ఉపదేశ శైలిలో అది ఆజ్ఞార్థక బలాన్ని కూడా కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యం రూపాన్ని కాపాడగా, పాదటిప్పణి ఆ ఆజ్ఞార్థక భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరిశుద్ధుడు’ అనే స్థిరమైన బైబిలు పదాన్ని ఉంచి, గ్రీకు భవిష్యత్ రూపం మరియు దాని ఆజ్ఞార్థక బలం మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్రిక్తతను ప్రధాన పాఠ్యం–పాదటిప్పణి ద్వారా కాపాడాం.
