id: 1PE.1.10
reference: 1 Peter 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: te
  text: ఈ రక్షణ గురించి, మీకు ఉద్దేశించిన కృపను[a] గురించి ప్రవచించిన ప్రవక్తలు ఎంతో శ్రద్ధగా వెదికి పరిశోధించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు రాబోయే కృపను గురించి.” భవిష్యత్ భావం సందర్భం వల్ల అర్థమవుతుంది; ఈ వచనంలో మాత్రం అది స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: ఈ రక్షణను గురించి
  rationale: περί + షష్ఠీ విభక్తి విషయాన్ని సూచిస్తుంది. ἧς మునుపు ప్రస్తావించిన రక్షణను తిరిగి సూచిస్తున్నందున, సహజమైన ఆధునిక తెలుగులో ‘ఈ రక్షణ’ అని అనువదించాం.
- source_word: σωτηρίας
  choice: రక్షణ
  rationale: ఈ సందర్భంలో σωτηρία దేవుడు అనుగ్రహించే సంపూర్ణ రక్షణను సూచిస్తుంది; ‘రక్షణ’ తెలుగు బైబిలు భాషలోనూ సాధారణ వాడుకలోనూ స్పష్టమైన పదం.
- source_word: ἐξεζήτησαν καὶ ἐξηραύνησαν
  choice: ఎంతో శ్రద్ధగా వెదికి పరిశోధించారు
  rationale: రెండు క్రియల సమన్వయం తీవ్రమైన, జాగ్రత్తగల అన్వేషణను తెలియజేస్తుంది. ‘వెదికి’ మరియు ‘పరిశోధించారు’ అని వేర్వేరుగా ఇవ్వడం మూలంలోని భావతీవ్రతను నిలుపుతుంది; ‘ఎంతో శ్రద్ధగా’ ఆ సమిష్టి బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: προφῆται
  choice: ప్రవక్తలు
  rationale: తరువాతి విశేషణాత్మక కృదంత పదబంధం ఏ ప్రవక్తలో చెబుతుంది; తెలుగులో ప్రత్యేక నిర్దేశక పదం అవసరం లేదు.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: మీ కోసం ఉన్న కృపను గురించి ప్రవచించిన
  rationale: ఈ పదబంధం ప్రవక్తలను విశేషిస్తుంది. περί ప్రవచన విషయాన్ని, εἰς ὑμᾶς కృప పాఠకుల వైపు ఉద్దేశించబడినదనీ వారి మేలుకోసమనీ సూచిస్తుంది.
- source_word: χάριτος
  choice: కృప
  rationale: ఈ రక్షణ-చారిత్రక సందర్భంలో χάρις దేవుని అనుగ్రహపూర్వక మేలును సూచిస్తుంది; ‘కృప’ దాని వేదాంతపరమైన బరువును నిలుపుతుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ కోసం
  rationale: εἰς ఇక్కడ దిశతో పాటు ప్రయోజనార్థక సంబంధాన్ని సూచించగలదు. ‘మీ కోసం’ ఆధునిక తెలుగులో సహజంగా ఉండి, పాఠకులకు ఉద్దేశించిన కృప భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మీ కోసం ఉన్న కృప’లో భవిష్యత్ భావాన్ని స్పష్టంగా చేర్చాలా?
  choice: ప్రధాన పాఠ్యంలో ‘మీ కోసం ఉన్న కృప’ అని ఉంచడం
  alternative: ‘మీకు రాబోయే కృప’ లేదా ‘మీకు కలగబోయే కృప’
  rationale: ప్రవక్తల ముందుచూపు వల్ల భవిష్యత్ భావం సందర్భం నుంచి అర్థమవుతుంది; అయితే ఈ వచనంలోని గ్రీకు పదాల్లో భవిష్యత్ కాలం స్పష్టంగా లేదు. అందువల్ల దానిని ప్రధాన పాఠ్యంలో చేర్చకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు అన్వేషణ క్రియలను నిలుపుతూ అనవసరమైన ప్రాచీన పదజాలాన్ని నివారించాం.
