id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: te
  text: 'ఎందుకంటే,

    “మనుష్యులందరూ గడ్డిలాంటివారు,[a]

    వారి మహిమ అంతా గడ్డి పువ్వులాంటిది;[b]

    గడ్డి ఎండిపోయింది,

    పువ్వు రాలిపోయింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సమస్త శరీరం.” ఇది యెషయా 40:6ను ప్రతిధ్వనిస్తూ మానవుల నశ్వరతను నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “మహిమ”కు “వైభవం” లేదా “శోభ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి లేఖనాధారమైన కారణాన్ని పరిచయం చేసే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶσα σὰρξ
  choice: మనుష్యులందరూ
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘సమస్త శరీరం/శరీరులంతా’ అయినా, ఇక్కడ నైతిక పాపస్వభావం కాక మానవజాతి యొక్క నశ్వరతను సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగును వాడి, మూల రూపాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: ὡς χόρτος
  choice: గడ్డిలాంటివారు
  rationale: χόρτος సూచించే గడ్డి/వృక్షజాలపు నశ్వరతను స్పష్టమైన ఉపమానంగా నిలుపుతుంది; బహువచన మానవ సూచనకు అనుగుణంగా వాక్యరూపం మార్చబడింది.
- source_word: πᾶσα δόξα αὐτῆς
  choice: వారి మహిమ అంతా
  rationale: δόξα ఇక్కడ మానవుల ఘనత, శోభ, వైభవాన్ని సూచిస్తుంది. సమూహార్థక πᾶσα σὰρξను తెలుగులో బహువచనంగా అనువదించినందున αὐτῆςకు ‘వారి’ వాడబడింది.
- source_word: ὡς ἄνθος χόρτου
  choice: గడ్డి పువ్వులాంటిది
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని, యెషయా ఉల్లేఖనంలోని కవితాత్మక చిత్రాన్ని వీలైనంత సహజంగా కాపాడుతుంది.
- source_word: ἐξηράνθη
  choice: ఎండిపోయింది
  rationale: గడ్డి తేమ కోల్పోయి వాడిపోవడాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξέπεσεν
  choice: రాలిపోయింది
  rationale: పువ్వు మొక్కనుండి ఊడి పడే చిత్రాన్ని సహజమైన తెలుగు క్రియతో తెలియజేస్తుంది.
theological_decisions:
- issue: మానవ నశ్వరత సందర్భంలో σάρξ అనువాదం
  choice: మనుష్యులందరూ
  alternative: శరీరులందరూ / సమస్త శరీరం
  rationale: ఇక్కడ σάρξ నైతిక భ్రష్టత్వాన్ని లేదా ‘పాపస్వభావాన్ని’ సూచించదు; మరణశీలమైన మానవజాతిని సూచిస్తుంది. అందువల్ల సహజమైన ప్రధాన అనువాదాన్ని ఎంచుకుని, యెషయా 40:6తో ఉన్న ‘సమస్త శరీరం’ ప్రతిధ్వనిని పాదటిప్పణిలో తెలిపాం.
- issue: δόξα యొక్క భావవిస్తృతి
  choice: మహిమ
  alternative: వైభవం / శోభ
  rationale: మూలపదంతో ఉన్న బైబిలీయ పదసంబంధాన్ని నిలుపుతూ, ఈ సందర్భంలో అది మానవ ఘనత లేదా వైభవం అనే అర్థమని పాదటిప్పణి ద్వారా సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కవితాత్మక శైలి వాడబడింది. గ్రీకు వాక్యంలోని కారణసంబంధం, సమాంతర నిర్మాణం, అర్ధవిరామంతో కొనసాగే ఉల్లేఖన ప్రవాహం నిలుపబడ్డాయి.
