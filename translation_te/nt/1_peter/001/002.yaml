id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: te
  text: తండ్రియైన దేవుని పూర్వజ్ఞానానుసారం, పరిశుద్ధాత్మచేత జరిగే పరిశుద్ధీకరణలో, విధేయత కొరకును మెస్సీయ అయిన యేసు రక్తప్రోక్షణ కొరకును—మీకు కృప, శాంతి విస్తరించుగాక.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πρόγνωσιν θεοῦ πατρός
  choice: తండ్రియైన దేవుని ముందెరిగిన జ్ఞానం ప్రకారం
  rationale: κατά + accusative లోని ప్రమాణం/అనుగుణత భావాన్ని ‘ప్రకారం’ తెలియజేస్తుంది. πρόγνωσις ను వివాదాస్పదమైన ముందస్తు ఎంపిక లేదా కేవలం ముందస్తు అవగాహనగా విప్పకుండా, దాని మూలభావాన్ని నిలుపుతూ అనువదించాం.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: ఆత్మ కలిగించే పరిశుద్ధీకరణలో
  rationale: ἁγιασμός లోని పరిశుద్ధపరచే ప్రక్రియను ‘పరిశుద్ధీకరణ’ నిలుపుతుంది. πνεύματος అనే genitive ను సహజమైన తెలుగులో కర్తృత్వ భావంతో వ్యక్తం చేశాం; త్రిత్వ నిర్మాణం వల్ల ఇది పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: εἰς ὑπακοὴν
  choice: విధేయత చూపడానికి
  rationale: εἰς సూచించే ఉద్దేశం/ఫలిత భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: రక్తంతో ప్రోక్షించబడడానికి
  rationale: ῥαντισμός లోని చిలకరింపు భావాన్ని, పాత నిబంధనలోని ఒడంబడిక మరియు శుద్ధీకరణ నేపథ్యాన్ని ‘ప్రోక్షించబడడం’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ను ఇక్కడ పేరులో భాగంగా కాక బిరుదుగా గ్రహించి ‘మెస్సీయ’గా అనువదించాం.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: మీకు కృప, శాంతి విస్తరించుగాక
  rationale: optative ఆశీర్వాద భావాన్ని ‘విస్తరించుగాక’ సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఎన్నికతో సంబంధంలో πρόγνωσις అర్థం
  choice: ‘ముందెరిగిన జ్ఞానం’ అని తటస్థంగా అనువదించడం
  alternative: ముందుగా నిర్ణయించడం / ముందస్తు ఎంపిక / కేవలం భవిష్యజ్ఞానం
  rationale: గ్రీకు పదంలోని నిజమైన సిద్ధాంతపరమైన ఉద్వేగాన్ని అనువాదమే పరిష్కరించకుండా నిలుపుతుంది.
- issue: πνεύματος యొక్క సూచన
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: మానవ ఆత్మ లేదా వ్యక్తిత్వరహిత ఆధ్యాత్మిక భావం
  rationale: ‘తండ్రియైన దేవుడు—ఆత్మ—యేసు మెస్సీయ’ అనే త్రిభాగ నిర్మాణం పరిశుద్ధాత్మనే బలంగా సూచిస్తుంది.
- issue: Χριστοῦ యొక్క బిరుదు స్వభావం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός యేసును గుర్తించే అర్థవంతమైన బిరుదుగా పనిచేస్తుంది.
- issue: εἰς తరువాతి రెండు నామవాచకాల సంబంధం
  choice: విధేయత మరియు రక్తప్రోక్షణ రెండింటినీ ఎన్నుకోబడిన స్థితి యొక్క ఉద్దేశం/ఫలితంగా సమాంతరంగా ఉంచడం
  alternative: ‘విధేయత’ను యేసు మెస్సీయకు విధేయతగా లేదా ‘రక్తం’ను విధేయతకు మాత్రమే అనుసంధానించడం
  rationale: గ్రీకు సమన్వయ నిర్మాణం రెండింటినీ εἰς కింద సమాంతరంగా ఉంచుతుంది; విధేయత ఎవరికి అన్నది మూలపాఠం స్పష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా-ఆశీర్వాద శైలి వాడబడింది. ఈ వాక్యం 1:1లోని ‘ఎన్నుకోబడినవారికి’ అనే పదబంధాన్ని కొనసాగిస్తుండటంతో అర్థసంపూర్ణత కోసం దాన్ని ఇక్కడ పునరుద్ఘాటించాం. సాంకేతికమైన ‘పరిశుద్ధీకరణ’, ‘ప్రోక్షించబడడం’ పదాలను మూలంలోని ధార్మిక మరియు పాత నిబంధనా ప్రతిధ్వనులను కాపాడేందుకు నిలిపాం.
