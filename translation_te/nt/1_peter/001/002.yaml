revisions:
- from: 'తండ్రియైన దేవుని ముందెరిగిన జ్ఞానం ప్రకారం[a], ఆత్మ కలిగించే పరిశుద్ధీకరణలో[b], విధేయత చూపడానికీ యేసు మెస్సీయ రక్తంతో ప్రోక్షించబడడానికీ[c] ఎన్నుకోబడినవారికి: మీకు కృప, శాంతి విస్తరించుగాక.'
  to: తండ్రియైన దేవుని పూర్వజ్ఞానానుసారం, పరిశుద్ధాత్మచేత జరిగే పరిశుద్ధీకరణలో, విధేయత కొరకును మెస్సీయ అయిన యేసు రక్తప్రోక్షణ కొరకును—మీకు కృప, శాంతి విస్తరించుగాక.
  rationale: The revision removes material supplied from the preceding verse, retains the dependent syntax of the Greek, and avoids making the recipients of the blood-sprinkling explicit. It also improves modern Telugu idiom while preserving the source’s formal theological vocabulary, its triadic structure, the debated neutrality of πρόγνωσις, and the titular rendering of Χριστός.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:06:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the major Greek phrases, but it imports “ఎన్నుకోబడినవారికి” (“to the chosen”) from 1 Peter 1:1 even though it is not present in verse 1:2. Its passive wording “రక్తంతో ప్రోక్షించబడడానికీ” also makes the recipients of sprinkling explicit, whereas the Greek noun phrase ῥαντισμὸν αἵματος is more compact and leaves the construction less specified.
  naturalness: “ముందెరిగిన జ్ఞానం” is understandable but awkward in modern standard Telugu; “పూర్వజ్ఞానం” is clearer and more idiomatic for πρόγνωσις. “పరిశుద్ధాత్మచేత జరిగే పరిశుద్ధీకరణ” naturally expresses the Spirit-related sanctification. “రక్తప్రోక్షణ” retains the concise, formal allusive quality of the Greek.
  terminology: Use “పూర్వజ్ఞానం” for πρόγνωσις, “పరిశుద్ధాత్మ” for πνεύματος in this triadic context, “పరిశుద్ధీకరణ” for ἁγιασμός, and “మెస్సీయ అయిన యేసు” to express the titular force of Ἰησοῦ Χριστοῦ naturally. “రక్తప్రోక్షణ” preserves the theological and covenantal imagery without adding a passive recipient.
  issues:
  - severity: medium
    issue: The translation adds “ఎన్నుకోబడినవారికి” (“to the chosen”).
    rationale: This word belongs to the preceding verse and is not represented in the Greek text of 1 Peter 1:2. Although the Greek continues the syntax of verse 1, the Telugu text can preserve that dependence without restating the antecedent.
  - severity: medium
    issue: “రక్తంతో ప్రోక్షించబడడానికీ” specifies a passive action upon the addressees.
    rationale: ῥαντισμὸν αἵματος literally presents “sprinkling of blood” and does not grammatically state the recipient in this verse. “రక్తప్రోక్షణ” better preserves the source construction and its ambiguity.
  - severity: low
    issue: “ముందెరిగిన జ్ఞానం” is less natural Telugu.
    rationale: “పూర్వజ్ఞానం” is a well-established modern Telugu equivalent for foreknowledge and avoids the somewhat cumbersome verbal paraphrase.
  revised_text: తండ్రియైన దేవుని పూర్వజ్ఞానానుసారం, పరిశుద్ధాత్మచేత జరిగే పరిశుద్ధీకరణలో, విధేయత కొరకును మెస్సీయ అయిన యేసు రక్తప్రోక్షణ కొరకును—మీకు కృప, శాంతి విస్తరించుగాక.
  revised_footnotes:
  - marker: a
    text: “పూర్వజ్ఞానం” అని అనువదించిన πρόγνωσις అనే పదం దేవుని ముందస్తు జ్ఞానాన్ని, ఆయన ముందస్తు ఎంపికను, లేదా రెండింటినీ సూచిస్తుందా అనే విషయంలో వ్యాఖ్యాతల మధ్య భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: మూలపాఠంలో అక్షరార్థంగా “ఆత్మ యొక్క పరిశుద్ధీకరణలో” అని ఉంది; తండ్రియైన దేవుడు, ఆత్మ, మెస్సీయ అయిన యేసు అనే త్రిభాగ నిర్మాణంలో ఇక్కడ “ఆత్మ” పరిశుద్ధాత్మను సూచిస్తుంది.
    reason: translation_clarity
  - marker: c
