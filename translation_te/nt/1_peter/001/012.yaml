revisions:
- from: తాము సేవ చేసినది తమ కోసం కాదుగాని మీ కోసమేనని వారికి బయలుపరచబడింది.[a] ఆ సంగతులే ఇప్పుడు పరలోకం నుండి పంపబడిన పరిశుద్ధాత్మ ద్వారా మీకు సువార్త ప్రకటించినవారి చేత మీకు తెలియజేయబడ్డాయి.[b] ఆ సంగతులను తీక్షణంగా పరిశీలించాలని దేవదూతలు సైతం ఎంతో ఆశపడుతున్నారు.[c]
  to: ఆ సంగతుల విషయంలో వారు తమ కోసం కాదు, మీ కోసమే సేవచేస్తున్నారని వారికి బయలుపరచబడింది.[a] ఆ సంగతులే ఇప్పుడు స్వర్గం నుండి పంపబడిన పరిశుద్ధాత్మచేత మీకు సువార్త ప్రకటించినవారి ద్వారా మీకు తెలియజేయబడ్డాయి.[b] ఆ సంగతులలోకి తొంగిచూడాలని దేవదూతలు కూడా ఎంతో కోరుకుంటున్నారు.[c]
  rationale: 'సవరణలు గ్రీకు వాక్యనిర్మాణంలోని రెండు ముఖ్య అంశాలను స్పష్టపరుస్తాయి: ప్రవక్తలు సేవ చేసినవి ‘ఆ సంగతులే’ అని, దేవదూతలు వాటిలోకి ‘తొంగిచూడాలని’ కోరుకుంటున్నారని. పరిశుద్ధాత్మను పంపబడినవానిగా, సువార్త ప్రకటించినవారిని ప్రకటనకు మానవ మాధ్యమాలుగా ఉంచి, మూలంలోని సంబంధాలను నిలుపాం. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంటనే ఉన్నాయి.'
