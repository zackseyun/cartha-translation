  source_fidelity: మొదటి వాక్యంలో ప్రవక్తలు ‘ఆ సంగతుల’ విషయంలో సేవ చేశారనే αὐτά యొక్క సంబంధాన్ని మరింత స్పష్టంగా చూపాలి. చివరి వాక్యంలో εἰς (‘లోకి/వైపు’) మరియు παρακύψαι (‘తొంగిచూడటం’) భావం ప్రధాన పాఠ్యంలో ఉండాలి; ప్రస్తుత ‘ఆ సంగతులను తీక్షణంగా పరిశీలించాలని’ రూపం ఆ దిశాత్మక, చిత్రాత్మక భావాన్ని కొంత తగ్గిస్తుంది.
