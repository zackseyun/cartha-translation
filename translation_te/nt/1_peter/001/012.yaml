id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: te
  text: ఆ సంగతుల విషయంలో వారు తమ కోసం కాదు, మీ కోసమే సేవచేస్తున్నారని వారికి బయలుపరచబడింది.[a] ఆ సంగతులే ఇప్పుడు స్వర్గం నుండి పంపబడిన పరిశుద్ధాత్మచేత మీకు సువార్త ప్రకటించినవారి ద్వారా మీకు తెలియజేయబడ్డాయి.[b] ఆ సంగతులలోకి తొంగిచూడాలని దేవదూతలు కూడా ఎంతో కోరుకుంటున్నారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమ కోసం కాదు, మీ కోసమే సేవచేస్తున్నారని.” గ్రీకులోని దత్తి విభక్తి ఆ సేవ వల్ల ప్రయోజనం పొందేవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీకు శుభవార్త ప్రకటించినవారి ద్వారా.” ఇక్కడ గ్రీకు భాషలో ‘శుభవార్త ప్రకటించడం’ అనే క్రియ ఉంది.
    reason: lexical_alternative
  - marker: c
    text: “తొంగిచూడాలని” అనే మాటను “నిశితంగా పరిశీలించాలని” లేదా “వంగి లోపలికి చూడాలని” అని కూడా అనువదించవచ్చు; ఇది ఆసక్తితో కూడిన ఏకాగ్ర పరిశీలనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: వారికి బయలుపరచబడింది
  rationale: సంబంధబోధక సర్వనామం ముందటి వచనంలోని ప్రవక్తలను సూచిస్తుంది. కర్తను పేర్కొనని గ్రీకు కర్మణి రూపాన్ని తెలుగు అనువాదం నిలుపుతుంది.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά
  choice: తాము సేవ చేసినది తమ కోసం కాదుగాని మీ కోసమే
  rationale: దత్తి విభక్తి సేవ వల్ల ప్రయోజనం పొందేవారిని సూచిస్తుంది; అసంపూర్ణ భూతకాల క్రియలోని కొనసాగిన సేవ భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: ఆ సంగతులే ఇప్పుడు ... మీకు తెలియజేయబడ్డాయి
  rationale: ముందు ప్రస్తావించిన ప్రవచన విషయాలను ‘ఆ సంగతులు’ స్పష్టంగా సూచిస్తుంది; కర్మణి భావం మరియు νῦν యొక్క వర్తమాన సందర్భం నిలిచాయి.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: మీకు సువార్త ప్రకటించినవారి చేత
  rationale: εὐαγγελίζω అనే క్రియలోని శుభవార్త ప్రకటించే భావాన్ని ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టంగా అందిస్తుంది.
- source_word: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: పరలోకం నుండి పంపబడిన పరిశుద్ధాత్మ ద్వారా
  rationale: దత్తి విభక్తిని సాధనార్థకంగా తీసుకొని ప్రకటన పరిశుద్ధాత్మ ద్వారా జరిగిందని తెలుపుతుంది; పంపబడినవాడు పరిశుద్ధాత్మేనని గ్రీకు విశేషణ సంబంధాన్ని నిలుపుతుంది.
- source_word: εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: ఆ సంగతులను తీక్షణంగా పరిశీలించాలని దేవదూతలు సైతం ఎంతో ఆశపడుతున్నారు
  rationale: παρακύπτω లోని ముందుకు వంగి లోపలికి తొంగిచూసే, ఆసక్తితో నిశితంగా చూసే భావాన్ని అక్షరార్థంగా అసహజం చేయకుండా ‘తీక్షణంగా పరిశీలించు’ అని అందిస్తుంది; వర్తమాన కాలంలోని నిరంతర కోరికను ‘ఆశపడుతున్నారు’ నిలుపుతుంది.
theological_decisions:
- issue: πνεύματι ἁγίῳ యొక్క సూచన మరియు పాత్ర
  choice: సువార్త ప్రకటనకు దైవిక సాధనకర్తయైన పరిశుద్ధాత్మ
  alternative: సాధారణమైన పవిత్ర ఆత్మ లేదా ఆధ్యాత్మిక శక్తి
  rationale: ఈ రక్షణ-చారిత్రక సందర్భంలో ఈ పదబంధం వ్యక్తిగత దైవిక పరిశుద్ధాత్మను సహజంగా సూచిస్తుంది; ‘ద్వారా’ అనే అనువాదం సాధనార్థక భావాన్ని ఎంచుకున్నా, మూలంలోని విషయానికి మించి ఏదీ చేర్చదు.
- issue: ప్రవక్తల సేవకు లబ్ధిదారులు
  choice: ప్రవక్తలు తమ కోసమే కాక తరువాతి విశ్వాసుల కోసం సేవ చేశారు
  alternative: ప్రవక్తలు తమ సమకాలికుల కోసమే సేవ చేశారు
  rationale: οὐχ ἑαυτοῖς ὑμῖν δὲ అనే స్పష్టమైన వ్యత్యాసాన్ని అనువాదం కాపాడి, ప్రవచన సేవకూ ఇప్పుడు ప్రకటించబడిన సువార్తకూ ఉన్న సంబంధాన్ని నిలుపుతుంది.
- issue: దేవదూతల పరిశీలన కోరిక స్వభావం
  choice: రక్షణ సంబంధమైన ఈ సంగతులను వారు ఆసక్తితో నిశితంగా పరిశీలించాలని కోరుతున్నారు
  alternative: వారికి ఈ సంగతులు పూర్తిగా తెలియవని లేదా వాటిని అర్థం చేసుకోలేరని నిర్ధారించడం
  rationale: వచనం వారి గాఢమైన కోరికను మాత్రమే చెబుతుంది; వారి జ్ఞాన పరిమితుల గురించి అదనపు సిద్ధాంత నిర్ణయాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సేవ’, ‘సువార్త’, ‘పరిశుద్ధాత్మ’, ‘దేవదూతలు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచుతూ, భారమైన గ్రాంథిక నిర్మాణాలను నివారించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
