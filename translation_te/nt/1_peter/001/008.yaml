id: 1PE.1.8
reference: 1 Peter 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: te
  text: మీరు ఆయనను చూడకపోయినా ఆయనను ప్రేమిస్తున్నారు. ఇప్పుడు ఆయనను చూడకపోయినా, ఆయనను విశ్వసిస్తూ, మాటల్లో చెప్పలేని, మహిమాన్వితమైన ఆనందంతో[a] ఉప్పొంగుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా, ‘మహిమపరచబడిన ఆనందంతో’; లేదా ‘మహిమతో నిండిన ఆనందంతో.’
    reason: δεδοξασμένῃ పరిపూర్ణ కర్మణి కృదంతం. సందర్భంలో ‘మహిమాన్వితమైన’ సహజమైన ప్రధాన అనువాదం; కర్మణి రూపం మరియు ‘మహిమతో నిండిన’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది.
lexical_decisions:
- source_word: ὃν οὐκ ἰδόντες
  choice: మీరు ఆయనను చూడకపోయినా
  rationale: సంబంధ సర్వనామం మునుపటి సందర్భంలోని యేసుక్రీస్తును సూచిస్తుంది. భూతకాల అనుభవం లేకపోయినా ప్రస్తుతం ప్రేమిస్తున్నారనే భావాన్ని సహజమైన రాయితీ వాక్యంతో వ్యక్తం చేసింది.
- source_word: ἀγαπᾶτε
  choice: ఆయనను ప్రేమిస్తున్నారు
  rationale: వర్తమానకాల క్రియను ఆధునిక ప్రామాణిక తెలుగులో కొనసాగుతున్న ప్రస్తుత వాస్తవంగా సహజంగా తెలిపింది.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: ఆయనలో విశ్వాసముంచి
  rationale: εἰς తో వచ్చిన πιστεύω ఆయననే విశ్వాసానికి లక్ష్యంగా చూపుతుంది. ‘ఆయనలో విశ్వాసముంచి’ అనేది విశ్వాసం మరియు నమ్మకం రెండింటి భావపరిధిని నిలుపుతుంది.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: ఇప్పుడు ఆయనను చూడకపోయినా
  rationale: ἄρτι సూచించే ప్రస్తుత పరిస్థితిని స్పష్టంగా ఉంచి, చూడకపోవడం–విశ్వసించడం మధ్యనున్న రాయితీ భావాన్ని తెలుగులో సహజంగా తెలిపింది.
- source_word: ἀγαλλιᾶσθε
  choice: ఉప్పొంగుతున్నారు
  rationale: సాధారణ సంతోషం కంటే ఉత్సాహభరితమైన ఆనందాన్ని సూచించే ఈ క్రియకు ‘ఆనందంతో ఉప్పొంగడం’ సహజమైన, బలమైన తెలుగు సమానం.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: మాటల్లో చెప్పలేని ... ఆనందంతో
  rationale: దాతృవిభక్తి విధానాన్ని ‘ఆనందంతో’గా, మాటలతో పూర్తిగా వ్యక్తం చేయలేనిదనే విశేషణ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందించింది.
- source_word: δεδοξασμένῃ
  choice: మహిమ పొందిన
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని ఫలితస్థితి మరియు δοξάζωతో ఉన్న పదసంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, కేవలం ‘మహిమాన్వితమైన’ అని విశేషణంగా చదును చేయకుండా అనువదించింది.
theological_decisions:
- issue: πιστεύοντες εἰς ὃν యొక్క అనువాదం
  choice: ఆయనలో విశ్వాసముంచి
  alternative: ఆయనను నమ్ముతూ
  rationale: ఇక్కడ నిర్మాణం కేవలం ఒక వాక్యాన్ని నిజమని అంగీకరించడం కాక, క్రీస్తునే విశ్వాస లక్ష్యంగా చూపుతుంది. ‘విశ్వాసముంచి’ ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ‘నమ్ముతూ’ కూడా సాధ్యమే కాని కొంత విస్తృతార్థకమైనది.
- issue: δεδοξασμένῃ χαρᾷ యొక్క భావం
  choice: మహిమ పొందిన ఆనందంతో
  alternative: మహిమతో నిండిన ఆనందంతో; మహిమాన్వితమైన ఆనందంతో
  rationale: గ్రీకు పదం పరిపూర్ణ కర్మణి కృదంతం కావడంతో, ఆనందం మహిమపరచబడిన లేదా మహిమను పొందిన స్థితిలో ఉందనే అసాధారణ రూపాన్ని ప్రధాన పాఠం కొంతవరకు నిలుపుతుంది. అది ‘మహిమతో నిండినది’ లేదా సరళంగా ‘మహిమాన్వితమైనది’ అనే భావాన్నీ ఇవ్వవచ్చు; వాటిని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను ఉపయోగించింది. ‘ఉప్పొంగుతున్నారు’ ἀγαλλιᾶσθε యొక్క తీవ్రమైన ఆనందాన్ని సహజంగా వ్యక్తం చేస్తుంది. పాదసూచిక గుర్తు సంబంధిత ‘మహిమ పొందిన ఆనందంతో’ అనే పదబంధానికే జతచేయబడింది.
