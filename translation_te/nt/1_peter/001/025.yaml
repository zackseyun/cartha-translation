source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: te
  text: “అయితే ప్రభువు వాక్యం శాశ్వతంగా నిలిచి ఉంటుంది.” మీకు శుభవార్తగా ప్రకటించబడిన వాక్యం ఇదే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు సువార్తగా బోధించబడిన వాక్యం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: వాక్యం
  rationale: మాట, పలుకు, సందేశం అనే భావాలను కలిగించే ῥῆμαకు ‘వాక్యం’ సహజమైన సమానార్థకం. ఇది యెషయా 40:8తో ఉన్న అంతర్గ్రంథ ప్రతిధ్వనిని కాపాడుతూ రెండు వాక్యభాగాల్లోనూ ఒకే పదాన్ని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే సాధారణ బిరుదుకు ఆధునిక తెలుగు బైబిలు శైలిలో సహజమైన రూపం ‘ప్రభువు’; షష్ఠీ సంబంధాన్ని ‘ప్రభువు వాక్యం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: μένει
  choice: నిలిచి ఉంటుంది
  rationale: కొనసాగి ఉండడం, స్థిరంగా నిలవడం అనే durative భావాన్ని ఈ రూపం సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: అంతం లేకుండా కొనసాగడాన్ని తెలిపే ఈ గ్రీకు నుడికారానికి ‘శాశ్వతంగా’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: τοῦτο δέ ἐστιν
  choice: ఇదే
  rationale: δέ సూచించే స్వల్ప మార్పు తెలుగులో వాక్యక్రమం ద్వారా సహజంగా వ్యక్తమవుతుంది; ‘ఇదే’ ముందు ఉటంకించిన వాక్యాన్ని ఇప్పుడు ప్రకటించబడిన శుభవార్తతో గుర్తిస్తుంది.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: శుభవార్తగా ప్రకటించబడిన వాక్యం
  rationale: εὐαγγελίζω యొక్క క్రియాత్మకమైన ‘శుభవార్త ప్రకటించు’ భావాన్ని స్పష్టంగా ఉంచుతుంది; కేవలం మతపరమైన సాంకేతిక పదంతో భర్తీ చేయదు.
- source_word: εἰς ὑμᾶς
  choice: మీకు
  rationale: ప్రకటన శ్రోతల వైపు ఉద్దేశించబడిందనే దిశాభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యెషయా 40:8 ఉటంకింపులోని ‘ప్రభువు వాక్యం’కు, పేతురు చెప్పే శుభవార్తకు ఉన్న సంబంధం
  choice: ఉటంకింపులో ‘ప్రభువు వాక్యం’ అని ఉంచి, రెండో వాక్యంలో అదే పాఠకులకు శుభవార్తగా ప్రకటించబడిన వాక్యమని గుర్తించడం
  alternative: రెండు చోట్లా మరింత వ్యాఖ్యానాత్మకంగా ‘ప్రభువు నుండి వచ్చిన సందేశం’ అని అనువదించడం
  rationale: ఈ రూపం లేఖన ఉటంకింపు భాషను, దాని సువార్త అన్వయాన్ని రెండింటినీ కాపాడుతుంది; వాటి సంబంధాన్ని అనవసరంగా విప్పి చెప్పదు.
- issue: εὐαγγελισθέν అనువాదం
  choice: ‘శుభవార్తగా ప్రకటించబడిన’ అనే స్పష్టమైన క్రియారూపం
  alternative: ‘సువార్తగా బోధించబడిన’
  rationale: మూలంలోని శుభవార్త ప్రకటించే క్రియాత్మక భావాన్ని సాధారణ పాఠకులకు నేరుగా తెలియజేస్తుంది; ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. యెషయా ఉటంకింపును సూచించేందుకు ఉద్ధరణ చిహ్నాలు ఉంచబడ్డాయి; ‘వాక్యం’ అనే పదం రెండు భాగాల్లోనూ ఉద్దేశపూర్వకంగా పునరావృతమైంది.
