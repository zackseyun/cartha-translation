id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: te
  text: కాబట్టి, మీ మనస్సు నడుమును బిగించుకొని[a], స్పష్టబుద్ధితో ఉంటూ, యేసు మెస్సీయ ప్రత్యక్షత సమయంలో మీకు తీసుకురాబడుతున్న కృపపై సంపూర్ణంగా నిరీక్షణ ఉంచండి[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ మనస్సు నడుమును బిగించుకొని”; అంటే, చర్యకు మీ మనస్సును సిద్ధం చేసుకొని.
    reason: lexical_alternative
  - marker: b
    text: “పూర్తిగా స్పష్టబుద్ధితో ఉంటూ, ... కృపపై నిరీక్షణ ఉంచండి” అని కూడా అనువదించవచ్చు. “సంపూర్ణంగా” అనే పదం ‘స్పష్టబుద్ధితో ఉంటూ’కైనా, ‘నిరీక్షణ ఉంచండి’కైనా సంబంధించినదిగా అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: c
    text: గ్రీకులో “యేసు క్రీస్తు”; ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున “యేసు మెస్సీయ” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: కాబట్టి
  rationale: ముందటి వాక్యభాగం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: మీ మనస్సు నడుము కట్టుకొని
  rationale: పని చేయడానికి వస్త్రాన్ని నడుముకు బిగించుకునే గ్రీకు రూపకాన్ని నిలుపుతుంది; దాని భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: νήφοντες
  choice: స్పష్టబుద్ధితో ఉంటూ
  rationale: ఇక్కడ మద్యపానానికి వ్యతిరేకమైన అక్షరార్థం కంటే మానసిక అప్రమత్తత, సంయమనం ప్రధానంగా ఉన్నాయి; ‘మనస్సు’ అనే సమీప సందర్భానికి ఇది సరిపోతుంది.
- source_word: τελείως
  choice: సంపూర్ణంగా
  rationale: పూర్తితనాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో ఇది ‘నిరీక్షణ ఉంచండి’తో అనుసంధానించబడింది; సమీపంలోని ‘స్పష్టబుద్ధితో ఉంటూ’తో అనుసంధానించే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐλπίσατε
  choice: నిరీక్షణ ఉంచండి
  rationale: నిరీక్షణను నిర్ణయాత్మకంగా ఒకదానిపై నిలపాలనే ఆజ్ఞార్థక బలాన్ని తెలియజేస్తుంది.
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: మీకు తీసుకురాబడుతున్న కృపపై
  rationale: వర్తమాన కర్మణి కృదంతమైన φερομένην రూపాన్ని, భవిష్యత్ పరిపూర్ణత వైపు చూపే సందర్భాన్ని రెండింటినీ సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἐν ἀποκαλύψει
  choice: ప్రత్యక్షమయ్యేటప్పుడు
  rationale: ఇక్కడ యేసు బయలుపరచబడే సందర్భంతో కృప రాక ముడిపడి ఉంది; కాలార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున ‘క్రీస్తు’ అనే స్థిర నామరూపం బదులు ‘మెస్సీయ’ అని అనువదించాం.
theological_decisions:
- issue: మనస్సు నడుము కట్టుకోవడం అనే రూపకాన్ని నిలుపాలా, దాని భావాన్ని మాత్రమే ఇవ్వాలా
  choice: రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, అర్థాన్ని పాదసూచికలో వివరించడం
  alternative: చర్యకు సిద్ధంగా మీ మనస్సులను ఉంచుకొని
  rationale: మూలంలోని సజీవమైన శరీరరూపకాన్ని తొలగించకుండా, ఆధునిక పాఠకుడికి దాని ఉద్దేశాన్ని స్పష్టంచేస్తుంది.
- issue: τελείως ఏ క్రియతో అనుసంధానమవుతుంది
  choice: ప్రధాన పాఠంలో ‘నిరీక్షణ ఉంచండి’తో అనుసంధానం
  alternative: ‘పూర్తిగా స్పష్టబుద్ధితో ఉంటూ’ అని νήφοντεςతో అనుసంధానం
  rationale: పదస్థానం మరియు ప్రధాన ఆజ్ఞతో దాని సహజ సంబంధం ఈ ఎంపికకు మద్దతిస్తాయి; అయితే గ్రీకులో ఉన్న నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ అంత్యకాల ప్రత్యక్షత సందర్భంలో Χριστός బిరుదు భావం వినిపిస్తుంది; ఏ ప్రత్యేక సంఘపరమైన వ్యాఖ్యానాన్నీ చేర్చకుండా ఆ బిరుదును అనువదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని మనస్సు-నడుము రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దాని అసహజతను పాదసూచిక ద్వారా పరిష్కరించాం. వాక్యనిర్మాణ సందిగ్ధతను సిద్ధాంతపరంగా ఏకపక్షంగా తీర్చలేదు.
