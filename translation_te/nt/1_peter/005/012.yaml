revisions:
- from: నమ్మకమైన సహోదరుడని నేను భావించే సిల్వానుతో మీకు క్లుప్తంగా రాశాను[a]. మిమ్మల్ని ప్రోత్సహిస్తూ, ఇదే దేవుని నిజమైన కృప అని సాక్ష్యమిస్తున్నాను. దానిలో స్థిరంగా నిలబడండి.[b]
  to: నా దృష్టిలో నమ్మకమైన సహోదరుడైన సిల్వాను ద్వారా, మిమ్మల్ని ప్రోత్సహిస్తూ మరియు ఇదే దేవుని నిజమైన కృప అని సాక్ష్యమిస్తూ, మీకు క్లుప్తంగా[a] వ్రాశాను. దానిలో స్థిరంగా నిలబడండి.[b]
