id: 1PE.5.12
reference: 1 Peter 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: te
  text: నా దృష్టిలో నమ్మకమైన సహోదరుడైన సిల్వాను ద్వారా, మిమ్మల్ని ప్రోత్సహిస్తూ మరియు ఇదే దేవుని నిజమైన కృప అని సాక్ష్యమిస్తూ, మీకు క్లుప్తంగా[a] వ్రాశాను. దానిలో స్థిరంగా నిలబడండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొద్ది మాటల్లో మీకు వ్రాశాను.”
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో “దానిలో మీరు నిలిచి ఉన్నారు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: సిల్వానుతో
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. సిల్వాను పత్రాన్ని తీసుకెళ్లాడా లేక వ్రాయడంలో సహకరించాడా అనేది నిర్దిష్టం చేయకుండా తెలుగు సహజంగా ఈ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: Σιλουανοῦ
  choice: సిల్వాను
  rationale: గ్రీకు వ్యక్తినామ రూపాన్ని లిప్యంతరీకరించాం; ఇక్కడ లేని సంక్షిప్త రూపమైన ‘సీల’ను ఉపయోగించలేదు.
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: నమ్మకమైన సహోదరుడు
  rationale: πιστός ఇక్కడ విశ్వసనీయతతో కూడిన నమ్మకత్వాన్ని సూచిస్తుంది. నిర్దిష్ట పురుష సహచరుని గురించి కాబట్టి ἀδελφόςను ‘సహోదరుడు’గా అనువదించాం.
- source_word: ὡς λογίζομαι
  choice: అని నేను భావించే
  rationale: ఇది సిల్వాను గురించి పేతురు వ్యక్తిగతంగా చేసిన అంచనాను సూచిస్తుంది; దాని మితమైన, మధ్యవాక్య స్వరాన్ని నిలిపింది.
- source_word: δι’ ὀλίγων
  choice: క్లుప్తంగా
  rationale: ఈ నుడికారం ‘కొద్ది మాటల్లో’ లేదా సంక్షిప్తంగా రాయడాన్ని సూచిస్తుంది. ‘క్లుప్తంగా’ ఆధునిక తెలుగులో సహజమైన క్రియావిశేషణం.
- source_word: ἔγραψα
  choice: రాశాను
  rationale: లేఖా సందర్భంలోని గ్రీకు భూతకాలాన్ని తెలుగులో సహజమైన సాధారణ భూతకాలంతో తెలిపాం.
- source_word: παρακαλῶν
  choice: ప్రోత్సహిస్తూ
  rationale: παρακαλέωకు ప్రోత్సహించడం, బోధించడం, విజ్ఞప్తి చేయడం అనే పరిధి ఉంది. ఇక్కడ పత్రంలోని హితబోధాత్మక ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπιμαρτυρῶν
  choice: సాక్ష్యమిస్తున్నాను
  rationale: ఈ పదంలోని గంభీరమైన ధృవీకరణ, సాక్ష్య భావాన్ని ‘సాక్ష్యమిస్తున్నాను’ నిలుపుతుంది.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: ఇదే దేవుని నిజమైన కృప
  rationale: ταύτηνలోని సూచనను ‘ఇదే’గా, ἀληθῆలోని యథార్థతను ‘నిజమైన’గా ఉంచి, ‘ఇది’ దేనిని సూచిస్తుందో సంకుచితం చేయలేదు.
- source_word: εἰς ἣν στῆτε
  choice: దానిలో స్థిరంగా నిలబడండి
  rationale: στῆτε ఆజ్ఞార్థక పాఠాన్ని అనుసరించి దృఢంగా కొనసాగాలనే పిలుపును వ్యక్తం చేసింది; ‘దానిలో’ ముందున్న కృపను సూచిస్తుంది.
theological_decisions:
- issue: ‘ఇదే’ (ταύτην) అనే పదం దేనిని సూచిస్తుంది?
  choice: లేఖలో ప్రకటించి ధృవీకరించిన విషయాన్ని విస్తృతంగా సూచించేలా అనిశ్చితిని నిలిపివేయడం
  alternative: విశ్వాసుల ప్రస్తుత కృపానుభవాన్ని లేదా సిల్వాను ద్వారా అందిన సువార్తను మాత్రమే సూచిస్తున్నట్లు నిర్దిష్టం చేయడం
  rationale: వ్రాయడం, ప్రోత్సహించడం, సాక్ష్యమివ్వడం అనే సమీప సందర్భం పత్రంలోని సందేశాన్ని సూచిస్తుంది; అయితే దాని పరిధిని మూలపాఠం ఖచ్చితంగా సంకుచితం చేయదు.
- issue: చివరి στῆτε పదపు విధి
  choice: 'ఆజ్ఞార్థకం: ‘స్థిరంగా నిలబడండి’'
  alternative: 'పాఠాంతరం ప్రకారం సూచనార్థకం: ‘మీరు నిలిచి ఉన్నారు’'
  rationale: ఇచ్చిన SBLGNT మూలపాఠంలో στῆτε ఆజ్ఞార్థకంగా ఉంది. పాఠాంతరాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సిల్వానుతో’ అనే రూపం అతని ఖచ్చితమైన పాత్రను అతిగా నిర్వచించదు. మూలంలోని మధ్యవాక్య వ్యాఖ్యను తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంగా మార్చాం; చివరి పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
