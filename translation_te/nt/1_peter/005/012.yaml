    reason: textual_variant
  revision_rationale: The revision changes only the agency expression from accompaniment to mediation, places the lexical footnote at its source phrase, and arranges the sentence so that “ప్రోత్సహిస్తూ” and “సాక్ష్యమిస్తూ” plainly modify “వ్రాశాను.” It retains the SBLGNT imperative and preserves the alternative indicative reading in the footnote.
