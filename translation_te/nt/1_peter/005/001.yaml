id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: te
  text: 'కాబట్టి, మీ మధ్యనున్న సంఘపెద్దలకు, తోటి సంఘపెద్దనూ మెస్సీయ[a] బాధలకు సాక్షినీ, బయలుపరచబడబోయే మహిమలో పాలివాణ్ణీ[b] అయిన నేను విజ్ఞప్తి చేస్తున్నాను:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు బిరుదైన Χριστόςను ‘మెస్సీయ’ అని లేదా సంప్రదాయంగా ‘క్రీస్తు’ అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘బయలుపరచబడబోయే మహిమలో భాగం పంచుకునేవాణ్ణీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: సంఘపెద్దలను
  rationale: ఈ సందర్భంలో ఇది కేవలం వయసులో పెద్దవారిని కాక సంఘ నాయకత్వ బాధ్యత వహించే పెద్దలను సూచిస్తుంది. ‘సంఘపెద్దలు’ ఆధునిక తెలుగు పాఠకులకు ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదనతో ఉన్న అనుమానార్థక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య ఉన్న
  rationale: వ్యక్తుల సమూహంలో ఉన్నవారనే సంబంధార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρακαλῶ
  choice: ఇలా కోరుతున్నాను
  rationale: ఇక్కడి గంభీరమైన కాపరి సంబంధమైన విజ్ఞప్తిని తెలియజేస్తుంది; ‘హెచ్చరిస్తున్నాను’ అని అనువదిస్తే మూలంలో అవసరం లేని మందలింపు భావం రావచ్చు.
- source_word: συμπρεσβύτερος
  choice: తోటి సంఘపెద్ద
  rationale: మాట్లాడుతున్న వ్యక్తి వారితో ఒకే పెద్ద బాధ్యతను పంచుకుంటున్నాడనే సహచర భావాన్ని కాపాడుతుంది.
- source_word: μάρτυς
  choice: సాక్షి
  rationale: చూసినవాడు లేదా సాక్ష్యమిచ్చేవాడు అనే మూలపదంలోని పరిధిని నిలుపుతుంది; ‘హతసాక్షి’ అనే తరువాతి ప్రత్యేకార్థాన్ని ఇక్కడ చేర్చదు.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: మెస్సీయ బాధలకు
  rationale: సంక్షిప్తమైన తెలుగు జనిటివ్ సంబంధంతో మెస్సీయకు చెందిన లేదా ఆయన అనుభవించిన బాధలను సూచిస్తుంది; సంబంధాన్ని మరీ వివరించి మూలంలోని సంక్షిప్తతను తొలగించదు.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ అభిషిక్తుని బిరుదుగా వినిపిస్తుంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని ప్రత్యక్షంగా తెలియజేస్తుంది.
- source_word: κοινωνός
  choice: పాలివాడు
  rationale: ఏదో ఒక దానిలో భాగం పంచుకునే వ్యక్తి అనే భావాన్ని వాణిజ్యపరమైన సహభాగిత భావం లేకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: బయలుపరచబడబోయే మహిమలో
  rationale: భవిష్యత్తులో మహిమ ప్రత్యక్షం చేయబడుతుందనే నిష్క్రియార్థాన్నీ, ఎదురుచూపు ఛాయనూ నిలుపుతుంది; ఖచ్చితమైన కాలవ్యవధిని చేర్చదు.
theological_decisions:
- issue: Χριστοῦ అనే క్రీస్తుసంబంధ బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: మూలపదం ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని కలిగి ఉంది. ‘మెస్సీయ’ దాన్ని స్పష్టంగా నిలుపుతుంది; సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: μελλούσης ἀποκαλύπτεσθαι లోని భవిష్యత్ ఎదురుచూపు
  choice: బయలుపరచబడబోయే
  alternative: బయలుపరచబడనున్న
  rationale: మహిమ ఇంకా బయలుపరచబడవలసి ఉందనే భవిష్యత్ భావాన్ని కాపాడుతుంది; అది ఎంత త్వరలో జరుగుతుందో నిర్ణయించదు.
- issue: μάρτυς యొక్క సాక్షిత్వ పరిధి
  choice: సాక్షి
  alternative: సాక్ష్యమిచ్చేవాడు
  rationale: ఈ పదం ప్రత్యక్షంగా చూచిన సాక్షి లేదా దానికి సాక్ష్యమిచ్చేవాడు అనే విధంగా అర్థమయ్యే అవకాశాన్ని మూలం పూర్తిగా పరిష్కరించదు. ‘సాక్షి’ ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘సంఘపెద్దలు’ పదం వయోవృద్ధులకన్నా సంఘ నాయకులను సూచించే సందర్భార్థాన్ని స్పష్టం చేస్తుంది. వాక్యం తరువాతి ఉపదేశానికి దారితీస్తున్నందున చివర ద్విబిందువు ఉంచబడింది; [a], [b] సూచికలు వాటి అసలు ప్రత్యామ్నాయాలకు సంబంధించిన పదాల దగ్గర ఉంచబడ్డాయి.
