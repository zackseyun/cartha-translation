translation:
  language: te
  text: మీ ఆందోళన అంతటినీ[a] ఆయన[c] మీద వేసి[b], ఎందుకంటే ఆయన మీ గురించి శ్రద్ధ వహిస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆందోళన’కు మూల గ్రీకు పదాన్ని ‘చింత,’ ‘బెంగ,’ లేదా ‘శ్రద్ధ’ అని కూడా అనువదించవచ్చు; ఇక్కడ ఆందోళన కలిగించే చింత అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆయన మీద వేసి’ లేదా ‘ఆయన మీద వేస్తూ’; ఈ క్రియావిశేషణ రూపం 6వ వచనంలోని ఉపదేశంతో అనుసంధానమై ఉంది.
    reason: lexical_alternative
  - marker: c
    text: అంటే, తక్షణ సందర్భంలోని 6వ వచనం ప్రకారం దేవునినే సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: మీ ఆందోళన అంతటినీ
  rationale: πᾶσαν యొక్క సమగ్ర భావాన్ని ‘అంతటినీ’ తెలియజేస్తుంది. ఈ సందర్భంలో μέριμνα సాధారణ శ్రద్ధను కాక ఆందోళనతో కూడిన చింతను సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘ఆందోళన’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐπιρίψαντες
  choice: వేయండి
  rationale: మూలంలో ఇది భూతకాల క్రియావిశేషణ రూపంలో ఉండి, ముందటి వచనంలోని ‘మిమ్మల్ని మీరు తగ్గించుకోండి’ అనే ఆజ్ఞతో అనుసంధానమవుతుంది. అయితే ఈ వచనాన్ని తెలుగులో సహజమైన ఉపదేశంగా చదివేందుకు ఆజ్ఞార్థకమైన ‘వేయండి’ వాడబడింది; మూల రూపం పాదసూచికలో తెలియజేయబడింది.
- source_word: ἐπ’ αὐτόν
  choice: ఆయన మీద
  rationale: ἐπί మరియు కర్మవిభక్తి కలయిక భారాన్ని ఒకరి మీదికి బదిలీ చేసే రూపకాన్ని సూచిస్తుంది; ‘ఆయన మీద’ ఆ రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణాన్ని పరిచయం చేసే స్పష్టమైన ఆధునిక తెలుగు అనుసంధానం.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: ఆయనకు మీ మీద శ్రద్ధ ఉంది
  rationale: గ్రీకు ప్రయోగం ‘మీ విషయం ఆయనకు ముఖ్యం/ఆయన మీ గురించి పట్టించుకుంటాడు’ అనే క్రియాశీల శ్రద్ధను తెలియజేస్తుంది. ‘ఆయనకు మీ మీద శ్రద్ధ ఉంది’ సహజమైన, గౌరవప్రదమైన తెలుగు; కేవలం భౌతిక పోషణ అనే భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: αὐτόν/αὐτῷ అనే సర్వనామాల సూచిత వ్యక్తి
  choice: ‘ఆయన’—తక్షణ సందర్భంలో దేవుడు
  alternative: సందర్భం ద్వారా సాధారణంగా ‘ప్రభువు’ అని గ్రహించడం
  rationale: 5:6లో ‘దేవుని బలమైన చెయ్యి కింద’ అని ఉన్నందున దేవుడే సహజమైన సూచిత వ్యక్తి. అయినా మూలంలోని సర్వనామ రూపాన్ని మించి పేరును పాఠ్యంలో చేర్చకుండా ‘ఆయన’ అని ఉంచి, సందర్భ సమాచారాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన ఉపదేశ శైలిని వాడాం. ‘ఆందోళన,’ ‘శ్రద్ధ’ వంటి ప్రస్తుత వాడుక పదాలతో మూలంలోని పాస్టరల్ భావాన్ని నిలిపాం; క్రియావిశేషణ రూపంలోని వాక్యసంబంధాన్ని పాదసూచికలో సంరక్షించాం.
