source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: te
  text: బబులోనులో[b] ఉన్న, మీతోపాటు ఎన్నుకోబడిన ఆమె[a] మీకు అభివందనాలు తెలియజేస్తోంది. నా కుమారుడైన మార్కు[c] కూడా మీకు అభివందనాలు తెలియజేస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత వివరణాత్మకంగా, “బబులోనులో ఉన్న సంఘం, మీతోపాటు ఎన్నుకోబడినది” అని అనువదించవచ్చు. గ్రీకులో స్త్రీలింగ ఏకవచన రూపం ఉంది; దానికి సంబంధించిన నామవాచకం సూచితమే గాని స్పష్టంగా పేర్కొనబడలేదు.
    reason: alternative_reading
  - marker: b
    text: ఆదికాల క్రైస్తవ వాడుకలో “బబులోను” రోముకు సంకేతనామం కావచ్చు; అయితే పాఠ్యం స్వయంగా “బబులోను” అని చెబుతోంది.
    reason: cultural_note
  - marker: c
    text: “నా కుమారుడు” అనేది శారీరక బంధం కంటే ఆత్మీయ సంబంధాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: అభివందనాలు తెలియజేస్తోంది / తెలియజేస్తున్నాడు
  rationale: లేఖ ముగింపులో ఒకరి తరఫున శుభాభివందనాలు తెలియజేయడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం. గ్రీకు క్రియ రెండు కర్తలకూ వర్తిస్తుంది; తెలుగులో స్పష్టత, సహజత్వం కోసం రెండుసార్లు వ్యక్తపరచబడింది.
- source_word: ἡ ... συνεκλεκτὴ
  choice: మీతోపాటు ఎన్నుకోబడిన ఆమె
  rationale: గ్రీకులో స్త్రీలింగ ఏకవచన రూపం ఉంది, కానీ అది సూచించే నామవాచకం పేర్కొనబడలేదు. అందువల్ల ప్రధాన పాఠ్యంలో ‘సంఘం’ అని చేర్చకుండా స్త్రీలింగ సూచనను, మూలంలోని అస్పష్టతను నిలిపింది.
- source_word: ἐν Βαβυλῶνι
  choice: బబులోనులో
  rationale: మూలపాఠ్యం నేరుగా బబులోనును పేర్కొంటుంది. అది రోముకు సంకేతమా కాదా అన్న వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: συνεκλεκτὴ
  choice: మీతోపాటు ఎన్నుకోబడిన
  rationale: ఇతరులతో కలిసి ఎన్నుకోబడిన స్థితిని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Μᾶρκος
  choice: మార్కు
  rationale: Μᾶρκος అనే వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: ὁ υἱός μου
  choice: నా కుమారుడైన
  rationale: υἱός యొక్క సాధారణ అర్థమైన ‘కుమారుడు’ను నిలిపింది. ఇది ఆత్మీయ సంబంధమని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా చేర్చలేదు.
theological_decisions:
- issue: ἡ ... συνεκλεκτὴ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘మీతోపాటు ఎన్నుకోబడిన ఆమె’ అని స్త్రీలింగ సూచనను అనిర్దిష్టంగానే ఉంచడం.
  alternative: ‘బబులోనులోని సంఘం, మీతోపాటు ఎన్నుకోబడినది’ అని అనువదించడం; లేదా పేతురు భార్య/మరొక క్రైస్తవ స్త్రీగా అర్థం చేసుకోవడం.
  rationale: గ్రీకులో స్త్రీలింగ ఏకవచన article మరియు విశేషణం ఉన్నా, స్పష్టమైన నామవాచకం లేదు. ‘సంఘం’ అనేది సాధ్యమైన, సాధారణంగా అంగీకరించబడిన పూరణ అయినప్పటికీ మూలంలో ప్రత్యక్షంగా లేదు; కాబట్టి అస్పష్టతను ప్రధాన పాఠ్యంలో కాపాడి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ‘బబులోను’ అనే స్థలనామం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘బబులోను’ అనే పేరునే ఉంచడం.
  alternative: దీనిని రోముకు సంకేతంగా ప్రధాన పాఠ్యంలో అనువదించడం; లేదా మెసొపొతామియాలోని అక్షరార్థ బబులోనుగా నిర్ధారించడం.
  rationale: గ్రీకు పాఠ్యం ‘బబులోను’ అని మాత్రమే చెబుతుంది. చారిత్రకంగా దాని సూచనపై భిన్నాభిప్రాయాలు ఉన్నందున అనువాదం ఆ ప్రశ్నను తేల్చదు.
- issue: మార్కును ‘నా కుమారుడు’ అని పిలవడంలోని సంబంధం
  choice: అక్షరార్థ కుటుంబ భాషను ప్రధాన పాఠ్యంలో ‘నా కుమారుడు’గా నిలిపివేయడం.
  alternative: ‘నా ఆత్మీయ కుమారుడు’ లేదా ‘నా ప్రియ కుమారుడు’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: ఇది ఆత్మీయ బంధాన్ని సూచించే అవకాశం ఎక్కువైనా, గ్రీకు వాక్యంలో ‘ఆత్మీయ’ లేదా ‘ప్రియ’ అనే స్పష్టీకరణ లేదు. అందువల్ల ఆ భావాన్ని పాదటిప్పణికే పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన లేఖా శైలిని ఉపయోగించాం. ‘ఆమె’ అనే రూపం కొంత అసాధారణంగా అనిపించినా, మూలంలోని స్త్రీలింగ ఏకవచన సూచనను మరియు దాని నిజమైన అస్పష్టతను కాపాడటానికి ఉద్దేశపూర్వకంగా నిలిపాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
