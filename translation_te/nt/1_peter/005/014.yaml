id: 1PE.5.14
reference: 1 Peter 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: te
  text: ప్రేమపూర్వకమైన ముద్దుతో ఒకరినొకరు పలకరించుకోండి. మెస్సీయలో[a] ఉన్న మీ అందరికీ శాంతి కలుగుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “క్రీస్తులో.”
    reason: Χριστῷకు తెలుగులో విస్తృతంగా పరిచయమైన సంప్రదాయ అనువాదాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: ఒకరినొకరు పలకరించుకోండి
  rationale: ἀσπάσασθε అనేది బహువచన ఆజ్ఞ; ἀλλήλους పరస్పర చర్యను సూచిస్తుంది. ‘ఒకరినొకరు పలకరించుకోండి’ అనేది ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν φιλήματι ἀγάπης
  choice: ప్రేమతో కూడిన ముద్దుతో
  rationale: ἐν ఇక్కడ పలకరించే విధానాన్ని సూచిస్తుంది; φίλημα అంటే ‘ముద్దు’, ἀγάπης ఆ ముద్దును ప్రేమకు చెందినదిగా వివరిస్తుంది. ఈ రూపం మూలంలోని నామవాచక నిర్మాణాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: εἰρήνη ὑμῖν πᾶσιν
  choice: మీ అందరికీ శాంతి కలుగుగాక
  rationale: గ్రీకులో ఇది సంక్షిప్త నామవాచక ఆశీర్వాద వాక్యం. తెలుగులో దాని ఆశీర్వాద భావాన్ని సహజంగా తెలియజేయడానికి ‘కలుగుగాక’ను అంతర్భావంగా చేర్చాం; πᾶσιν యొక్క సమగ్రతను ‘అందరికీ’ కాపాడుతుంది.
- source_word: τοῖς ἐν Χριστῷ
  choice: మెస్సీయలో ఉన్న
  rationale: ఆర్టికల్‌తో కూడిన విభక్తిపూర్వక పదబంధం ‘ఆయనలో ఉన్నవారు’ అనే సమూహాన్ని సూచిస్తుంది. Χριστός ఇక్కడ బిరుదు భావంతో ఉన్నందున ‘మెస్సీయ’ను ప్రధాన పాఠంలో ఉంచాం.
theological_decisions:
- issue: ἐν Χριστῷలో Χριστόςను ఎలా అనువదించాలి
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: Χριστόςకు ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావం ఉంది; దాన్ని ప్రధాన పాఠంలో ‘మెస్సీయ’గా ఉంచడం ఆ అర్థాన్ని స్పష్టపరుస్తుంది. తెలుగులో సుపరిచితమైన సంప్రదాయ రూపం ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం. ‘లో’ అనే నిర్మాణాన్ని వివరణతో మార్చకుండా, మూలంలోని సంబంధాత్మక మరియు సంఘసంబంధమైన భావ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ పఠనానికి తగిన గౌరవప్రదమైన సరళ శైలి. ‘ముద్దు’ అనే సాంస్కృతికంగా నిర్దిష్టమైన చర్యను సాధారణ ‘ఆప్యాయ పలకరింపు’గా మార్చకుండా మూలానికి నిబద్ధంగా ఉంచాం.
