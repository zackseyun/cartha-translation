    reason: κατὰ θεόν అనే సంక్షిప్త పదబంధానికి సాధ్యమైన సహజమైన అర్థవ్యాఖ్యానాలను సూచించడానికి.
  revision_rationale: The revision retains the source's lexical and theological ambiguity while improving Telugu syntax and clarity. It keeps oversight descriptive rather than treating it as an ecclesiastical title, places the footnote marker directly after దేవునికి అనుగుణంగా, and explicitly connects both negative-positive motive contrasts to the oversight activity.
