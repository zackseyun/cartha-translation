id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: te
  text: మీ మధ్యనున్న దేవుని మందను కాపరులుగా సంరక్షించండి; బలవంతం వల్ల కాకుండా, దేవునికి అనుగుణంగా[a] ఇష్టపూర్వకంగా పర్యవేక్షించండి; నీచమైన లాభం కోసం కాకుండా, ఉత్సాహంగా పర్యవేక్షించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు కోరిన విధంగా”; “దేవుని చిత్తానికి అనుగుణంగా.”
    reason: κατὰ θεόν అనే సంక్షిప్త పదబంధానికి సాధ్యమైన సహజమైన అర్థవ్యాఖ్యానాలను సూచించడానికి.
lexical_decisions:
- source_word: ποιμάνατε
  choice: కాపరులుగా చూసుకోండి
  rationale: కాపరి రూపకాన్ని నిలుపుతూ, మందను పోషించడం, కాపాడడం, నడిపించడం అనే విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: మీ మధ్య ఉన్న దేవుని మందను
  rationale: ἐν ὑμῖνను స్థానిక/సంబంధార్థంలో ‘మీ మధ్య ఉన్న’ అని అనువదించి, మంద పెద్దల సొత్తు కాదని, అది దేవునిదని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπισκοποῦντες
  choice: దాని పర్యవేక్షణ చేయండి
  rationale: కాపరి సేవను ఎలా నిర్వహించాలో వివరించే క్రియాభావాన్ని వ్యక్తం చేస్తుంది; దాన్ని సంఘపాలనలోని ఒక నిర్దిష్ట పదవిపేరుగా మార్చదు.
- source_word: μὴ ἀναγκαστῶς
  choice: బలవంతం వల్ల కాకుండా
  rationale: ఒత్తిడి లేదా నిర్బంధం కారణంగా సేవ చేయడాన్ని సూచించే భావాన్ని సహజంగా తెలియజేస్తూ, ఇష్టపూర్వక సేవతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἀλλὰ ἑκουσίως
  choice: ఇష్టపూర్వకంగా
  rationale: నిర్బంధానికి విరుద్ధంగా స్వచ్ఛందంగా, మనస్ఫూర్తిగా చేయడాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: κατὰ θεόν
  choice: దేవునికి అనుగుణంగా
  rationale: దేవుని చిత్తం, ప్రమాణం లేదా ఆయన కోరే విధానం అనే భావసాధ్యతలను ఒక్కదానికే పరిమితం చేయకుండా, గ్రీకు పదబంధంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: నీచమైన లాభం కోసం కాకుండా
  rationale: అవమానకరమైన లేదా హీనమైన లాభాపేక్షతో సేవ చేయడాన్ని తిరస్కరించే నైతిక బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλλὰ προθύμως
  choice: ఉత్సాహంతో
  rationale: సిద్ధమనస్సుతో, ఆసక్తిగా సేవ చేయడాన్ని సూచిస్తూ, ముందున్న ἑκουσίωςకు వాడిన ‘ఇష్టపూర్వకంగా’ అనే పదం నుంచి తగిన భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἐπισκοποῦντεςను సంఘంలోని సాంకేతిక పదవిపేరుగా అనువదించాలా?
  choice: కార్యాన్ని వివరించేలా ‘దాని పర్యవేక్షణ చేయండి’ అని అనువదించబడింది.
  alternative: ‘అధ్యక్షులుగా సేవ చేయండి’ లేదా ‘బిషప్పులుగా వ్యవహరించండి.’
  rationale: సందర్భంలో ఈ కృదంతం పెద్దలు చేయవలసిన పనిని వివరిస్తుంది; తరువాత స్థిరపడిన ఏ సంఘపాలనా వ్యవస్థనూ లేదా పదవిపేరునూ వచనంలోకి దిగుమతి చేయకుండా మూలంలోని పర్యవేక్షణ భావాన్ని నిలుపుతుంది.
- issue: κατὰ θεόν భావాన్ని ఎంత స్పష్టంగా వ్యాఖ్యానించాలి?
  choice: ప్రధాన పాఠ్యంలో ‘దేవునికి అనుగుణంగా’ అని ఉంచి, సాధ్యమైన వివరణలను అధస్సూచనలో ఇచ్చాం.
  alternative: ‘దేవుని చిత్తానికి అనుగుణంగా’ లేదా ‘దేవుడు కోరిన విధంగా.’
  rationale: ఈ గ్రీకు పదబంధం సంక్షిప్తమైనది, భావపరంగా విస్తృతమైనది. ఒకే వ్యాఖ్యానంతో దాని భావాన్ని పరిమితం చేయకుండా అసలు వాక్యంలోని అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. ‘కాపరులుగా’ అనే రూపకం, ‘పర్యవేక్షణ’ అనే వివరణాత్మక పదం కలిసి మూలంలోని pastoral మరియు oversight భావాలను మతశాఖాపరమైన పదవిపేర్లకు పరిమితం చేయకుండా అందిస్తాయి. అధస్సూచన గుర్తు [a] సంబంధిత κατὰ θεόν పదబంధం వెంటనే ఉంచబడింది.
