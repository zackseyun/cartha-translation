theological_decisions:
- issue: τῶν κλήρων అనే పదానికి సంఘ నాయకత్వ సందర్భంలో ఉన్న భావం
  choice: పెద్దల సంరక్షణకు కేటాయించబడిన విశ్వాసులను సూచిస్తుంది; వారు పెద్దల సొత్తు కారు
  alternative: అక్షరార్థమైన ‘వాటాలు/కేటాయించబడిన భాగాలు’ అని మాత్రమే ఉంచడం; లేదా పెద్దల అధికార పరిధులు అని భావించడం
  rationale: తక్షణ సందర్భం దేవుని మందను కాయడం గురించి మాట్లాడుతోంది. ఈ అనువాదం గ్రీకులోని కేటాయింపు భావాన్నీ, నాయకులు యజమానులు కాక సంరక్షకులు అనే భావాన్నీ నిలుపుతుంది.
- issue: κατακυριεύοντες యొక్క బలం
  choice: అణచివేసేలా లేదా మితిమీరి అధికారం చెలాయించడాన్ని నిషేధిస్తుంది
  alternative: పెద్దలు ఏ విధమైన నాయకత్వ అధికారాన్నీ వినియోగించకూడదని అర్థం చేసుకోవడం
  rationale: పదం నాయకత్వాన్నంతటినీ కాదు, ప్రభువులా పెత్తనం చేసే అధికార దుర్వినియోగాన్ని సూచిస్తుంది. వాక్యం నాయకత్వాన్ని ఆదర్శప్రాయమైన సేవతో వ్యత్యాసపరుస్తోంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పెత్తనం చెలాయించడం’ అధికార దుర్వినియోగాన్ని స్పష్టంగా తెలుపుతుంది; ‘మంద’ అనే బైబిలీయ కాపరి రూపకం నిలుపబడింది. గ్రీకు వాక్యం సందర్భానుసారంగా కృదంత నిర్మాణంలో ఉన్నప్పటికీ, తెలుగులో స్పష్టమైన ఆదేశ రూపం ఉపయోగించబడింది.
