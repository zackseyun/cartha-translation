id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: te
  text: 'అదేవిధంగా, యువకులారా,[a] పెద్దలకు లోబడి ఉండండి. మీరందరూ ఒకరిపట్ల ఒకరు వినయాన్ని వస్త్రంలా ధరించుకోండి;[b] ఎందుకంటే,

    “దేవుడు గర్విష్ఠులను ఎదిరిస్తాడు,

    వినయంగలవారికి కృపను అనుగ్రహిస్తాడు.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యువకులైనవారలారా.” గ్రీకులో ఇది పుంలింగ బహువచనం; అయితే కొందరు దీన్ని సంఘంలోని వయసులో చిన్న సభ్యులను మరింత విస్తృతంగా సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వినయాన్ని కట్టుకోండి.” గ్రీకు క్రియ వస్త్రాన్ని, బహుశా నడుముకు కట్టుకునే వస్త్రాన్ని, తొడుక్కోవడం లేదా బిగించుకోవడం అనే చిత్రాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: సామెతలు 3:34 (సెప్టువజింట్) నుండి ఉద్ధరణ లేదా సూచన.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: అదేవిధంగా
  rationale: ముందున్న పెద్దలకిచ్చిన ఉపదేశంతో ఈ ఆదేశాన్ని అనుసంధానించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: νεώτεροι
  choice: యువకులారా
  rationale: గ్రీకు పదం పుంలింగ బహువచన సంబోధన; దాని లింగరూపాన్ని నిలుపుతూ సహజంగా అనువదించబడింది. విస్తృత అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: ὑποτάγητε
  choice: లోబడి ఉండండి
  rationale: ఆజ్ఞారూపంలోని స్వచ్ఛంద విధేయత/అధీనత భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πρεσβυτέροις
  choice: పెద్దలకు
  rationale: 5:1–4 తక్షణ సందర్భంలో సంఘపు పెద్దలే ప్రధాన సూచన; తెలుగు క్రైస్తవ వాడుకలో ‘పెద్దలు’ ఆ గుర్తింపు పొందిన సమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: πάντες δὲ
  choice: మీరందరూ
  rationale: ఉపదేశం యువకులకే పరిమితం కాకుండా సమాజమంతటికీ విస్తరిస్తున్నదని స్పష్టం చేస్తుంది.
- source_word: ἀλλήλοις
  choice: ఒకరిపట్ల ఒకరు
  rationale: సంఘసంబంధాలలో పరస్పర దృక్పథాన్ని తెలిపే సహజమైన ప్రయోగం.
- source_word: ταπεινοφροσύνην
  choice: వినయాన్ని
  rationale: ‘వినయం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, నమ్ర మనోభావం మరియు ప్రవర్తన రెండింటినీ సూచిస్తుంది.
- source_word: ἐγκομβώσασθε
  choice: వస్త్రంలా ధరించుకోండి
  rationale: కట్టుకోవడం లేదా వస్త్రాన్ని తొడుక్కోవడం అనే బలమైన రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ఆదేశానికి లేఖనాధారమైన కారణాన్ని పరిచయం చేస్తుంది.
- source_word: ὑπερηφάνοις
  choice: గర్విష్ఠులను
  rationale: సుబంతంగా వాడిన విశేషణంలోని అహంకారభావాన్ని సంక్షిప్తంగా, బలంగా తెలియజేస్తుంది.
- source_word: ἀντιτάσσεται
  choice: ఎదిరిస్తాడు
  rationale: తనను వారికి వ్యతిరేకంగా నిలబెట్టుకుంటాడు అనే క్రియాబలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ταπεινοῖς δὲ δίδωσιν χάριν
  choice: వినయంగలవారికి కృపను అనుగ్రహిస్తాడు
  rationale: దాతృత్వ చర్యను గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తూ ‘కృప’ అనే ప్రధాన ధార్మిక పదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πρεσβυτέροις పదం ఎవరిని సూచిస్తుంది?
  choice: సంఘపు పెద్దలు
  alternative: సాధారణంగా వయసులో పెద్దవారు/పెద్ద పురుషులు
  rationale: 5:1–4లో సంఘపు పెద్దలను ప్రత్యక్షంగా సంబోధించిన తక్షణ సందర్భం కారణంగా ఇక్కడ కూడా వారే ప్రధాన సూచన. అయితే ‘పెద్దలు’ అనే తెలుగు పదంలో మూలంలోని పరిమిత సహజ సందిగ్ధత పూర్తిగా తొలగిపోదు.
- issue: νεώτεροι పదంలోని లింగం మరియు పరిధి
  choice: యువకులారా
  alternative: యువకులైనవారలారా / వయసులో చిన్నవారలారా
  rationale: మూలపాఠం పుంలింగ బహువచనం కాబట్టి దాన్ని ప్రధాన పాఠంలో నిలిపాం. ఇది సంఘంలోని యౌవన సభ్యులను విస్తృతంగా సూచించవచ్చనే సాధ్యతను పాదసూచికలో తెలిపాం; వెంటనే వచ్చే ‘మీరందరూ’ వినయ ఆదేశాన్ని సమాజమంతటికీ విస్తరిస్తుంది.
- issue: సామెతలు 3:34తో సంబంధం
  choice: ఉద్ధరణ/సూచనగా గుర్తింపు
  alternative: స్వతంత్ర సామెతగా మాత్రమే చదవడం
  rationale: పదబంధం సామెతలు 3:34 సెప్టువజింట్ పాఠంతో స్పష్టమైన సంబంధం కలిగి ఉంది; అందుచేత పాదసూచికలో క్రాస్-రెఫరెన్స్ ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘వస్త్రంలా ధరించుకోండి’ ద్వారా మూలంలోని రూపకాన్ని నిలిపి, ప్రత్యామ్నాయమైన ‘కట్టుకోండి’ను పాదసూచికలో ఇచ్చాం. కవితాత్మక లేఖన ఉద్ధరణను ప్రత్యేక పంక్తుల్లో అమర్చాం.
