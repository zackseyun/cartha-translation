  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: te
  text: కాబట్టి, దేవుని శక్తిమంతమైన చేతి కింద మిమ్మల్ని మీరు తగ్గించుకోండి[a], ఆయన మిమ్మల్ని తగిన సమయంలో హెచ్చించునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తగ్గించబడండి ... ఆయన మిమ్మల్ని తగిన సమయంలో హెచ్చించునట్లు.” గ్రీకు ఆజ్ఞారూపం కర్మణి రూపంలో ఉంది; అయితే ఇక్కడ అది సాధారణంగా “మిమ్మల్ని మీరు తగ్గించుకోండి” అనే ఆత్మనేపద భావంలో అర్థం చేసుకోబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: మిమ్మల్ని మీరు తగ్గించుకోండి
  rationale: రూపంలో ఇది కర్మణి ఆజ్ఞార్థకమైనా, ఈ ఉపదేశ సందర్భంలో ఆత్మనేపద భావంతో సహజంగా అర్థమవుతుంది. తెలుగు వాక్యం ఆజ్ఞ యొక్క బలాన్ని, దేవునికి లోబడే భావాన్ని నిలుపుతుంది; రూపంలోని ప్రత్యామ్నాయ కర్మణి భావాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వచనంలో గర్విష్ఠులకు దేవుడు ఎదిరించి వినయులకు కృప ఇస్తాడనే మాటనుండి వచ్చే తార్కిక నిర్ధారణను తెలియజేస్తుంది.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ
  choice: దేవుని బలమైన చేతి కింద
  rationale: దేవుని శక్తిమంతమైన కార్యాన్నీ అధికారాన్నీ సూచించే పాత నిబంధన నేపథ్యమున్న రూపకాన్ని నేరుగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἵνα ὑμᾶς ὑψώσῃ
  choice: అప్పుడు ... ఆయన మిమ్మల్ని హెచ్చిస్తాడు
  rationale: ἵνα తెలిపే ఉద్దేశం/ఫలిత సంబంధాన్ని సహజ తెలుగులో చూపుతుంది. కర్త ముందున్న ‘దేవుడు’; ὑψόω ఇక్కడ గౌరవస్థితికి ఎత్తడం లేదా న్యాయం చేయడం అనే భావాన్ని కలిగి ఉంది.
- source_word: ἐν καιρῷ
  choice: తగిన సమయంలో
  rationale: καιρός కేవలం కాలప్రవాహాన్ని కాక, తగిన లేదా అనుకూల సమయాన్ని సూచిస్తుంది; ఈ అనువాదం ఆ భావాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: Ταπεινώθητε లో వాచ్యం మరియు కర్తృత్వం
  choice: ‘మిమ్మల్ని మీరు తగ్గించుకోండి’ అని ఆత్మనేపద భావంతో అనువదించడం
  alternative: ‘తగ్గించబడండి’
  rationale: ఈ ఆజ్ఞ మనుష్యుల బాధ్యతను తెలియజేస్తూనే, ‘దేవుని బలమైన చేతి కింద’ అనే మాట ద్వారా అది దేవునికి లోబడటమేనని చూపుతుంది. గ్రీకు రూపంలోని నిజమైన కర్మణి అవకాశాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- issue: ὑψώσῃ లో దేవుని కార్యం
  choice: దేవుడే తగిన సమయంలో వారిని హెచ్చిస్తాడు
  alternative: ‘పైకి లేపుతాడు’
  rationale: సందర్భంలో ఇది కేవలం భౌతికంగా పైకి లేపడం కాదు; వినయంగా ఉన్నవారికి దేవుడు గౌరవం లేదా న్యాయం కలిగించే భావం ప్రధానంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘బలమైన చెయ్యి’ అనే బైబిలు రూపకం నిలుపబడింది; ‘హెచ్చిస్తాడు’ గౌరవస్థితికి ఎత్తే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
