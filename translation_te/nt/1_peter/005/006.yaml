revisions:
- from: కాబట్టి దేవుని బలమైన చేతి కింద మిమ్మల్ని మీరు తగ్గించుకోండి[a]. అప్పుడు తగిన సమయంలో ఆయన మిమ్మల్ని హెచ్చిస్తాడు.
  to: కాబట్టి, దేవుని శక్తిమంతమైన చేతి కింద మిమ్మల్ని మీరు తగ్గించుకోండి[a], ఆయన మిమ్మల్ని తగిన సమయంలో హెచ్చించునట్లు.
  rationale: The revision corrects the rendering of ἵνα by using “హెచ్చించునట్లు,” preserving the purpose-oriented relation while retaining God as the understood agent of exaltation. It also uses “శక్తిమంతమైన” for κραταιά and updates the footnote so its alternative matches the syntax and meaning of the Greek clause.
