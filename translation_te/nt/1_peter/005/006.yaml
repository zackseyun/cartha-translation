review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential οὖν, the reflexive sense commonly intended by the passive-form imperative Ταπεινώθητε, and the divine-agent sense of ὑψώσῃ. However, “అప్పుడు ... హెచ్చిస్తాడు” makes ἵνα sound chiefly temporal/consecutive (“then”) and changes its purpose-oriented force. The revision retains the telic relation without overresolving the Greek passive form.
  naturalness: “దేవుని శక్తిమంతమైన చేతి కింద” is a clear and natural rendering of the biblical metaphor. “హెచ్చించునట్లు” is slightly elevated but remains intelligible, suitably reverent modern standard Telugu, and accurately expresses the purpose clause.
  terminology: “మిమ్మల్ని మీరు తగ్గించుకోండి” is idiomatic and appropriately reflects the exhortational reflexive sense. “శక్తిమంతమైన చేయి” better represents κραταιά than merely “బలమైన చేయి.” “హెచ్చించు” suitably preserves the metaphorical sense of ὑψόω.
  issues:
  - severity: medium
    issue: The main text renders ἵνα as “అప్పుడు” (“then”).
    rationale: ἵνα introduces the purpose/result for which they are to humble themselves; a merely temporal connective weakens that syntactic and semantic relationship.
  - severity: low
    issue: The footnote’s alternative repeats “అప్పుడు,” rather than reflecting the Greek purpose clause.
    rationale: The alternative rendering should preserve the same ἵνα relationship as the main text.
  revised_text: కాబట్టి, దేవుని శక్తిమంతమైన చేతి కింద మిమ్మల్ని మీరు తగ్గించుకోండి[a], ఆయన మిమ్మల్ని తగిన సమయంలో హెచ్చించునట్లు.
  revised_footnotes:
