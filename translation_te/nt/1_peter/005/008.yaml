id: 1PE.5.8
reference: 1 Peter 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: te
  text: స్పష్టబుద్ధితో ఉండండి[a]; అప్రమత్తంగా ఉండండి. మీ విరోధియైన అపవాది, గర్జించే సింహంలా చుట్టూ తిరుగుతూ, ఎవరినైనా మింగివేయడానికి వెదుకుతున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వస్థబుద్ధితో ఉండండి.” గ్రీకు క్రియకు అక్షరార్థంగా మద్యం మత్తు లేకపోవడం అనే భావం ఉన్నా, ఇక్కడ అది రూపకంగా మానసిక స్పష్టతను, ఆత్మనిగ్రహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పొంచి తిరుగుతున్నాడు.” గ్రీకు క్రియకు మరింత అక్షరార్థంగా “చుట్టూ తిరుగుతున్నాడు” లేదా “తిరుగుతున్నాడు” అనే భావం ఉంది; సింహపు చిత్రం సందర్భంలో “పొంచి తిరుగుతున్నాడు” అనేది సందర్భానుగుణమైన ప్రత్యామ్నాయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: స్పష్టమైన మనస్సుతో ఉండండి
  rationale: ఈ సందర్భంలో మద్యం మత్తుకు విరుద్ధమైన అక్షరార్థం కంటే, ఆత్మీయ దాడి మధ్య మానసిక స్పష్టతతో, నిగ్రహంతో ఉండాలనే రూపకాలంకార భావం ప్రధానమైనది. తరువాతి γρηγορήσατεతో ఉన్న భావభేదాన్ని కూడా ఈ అనువాదం నిలుపుతుంది.
- source_word: γρηγορήσατε
  choice: అప్రమత్తంగా ఉండండి
  rationale: మేలుకొని జాగరూకంగా ఉండే నిరంతర వైఖరిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀντίδικος
  choice: విరోధి
  rationale: ఈ పదానికి న్యాయస్థాన ప్రత్యర్థి అనే ఛాయ ఉండగలిగినా, ఇక్కడ విశ్వాసులకు శత్రువుగా ఉన్నవాడనే విస్తృత భావం ప్రధానమైనది.
- source_word: διάβολος
  choice: అపవాది
  rationale: తెలుగు బైబిలు వాడుకలో వ్యక్తిగత దుష్టునికి స్థిరపడిన గుర్తింపును ఇస్తూనే, పదంలోని అపనిందకుడు అనే మూలభావాన్ని నిలుపుతుంది.
- source_word: ὡς λέων ὠρυόμενος
  choice: గర్జించే సింహంలా
  rationale: గ్రీకు ఉపమానంలోని భయపెట్టే, వేటాడే సజీవ చిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: περιπατεῖ
  choice: తిరుగుతున్నాడు
  rationale: నడుచుచున్నాడు లేదా చుట్టూ తిరుగుతున్నాడు అనే ప్రాథమిక భావాన్ని సహజ తెలుగులో ఇస్తుంది; సింహం అనే ఉపమానమే పొంచి తిరిగే బెదిరింపును సూచిస్తుంది.
- source_word: ζητῶν τινα καταπιεῖν
  choice: ఎవరిని మింగివేయాలా అని వెదుకుతూ
  rationale: ζητῶν యొక్క వెదకడం, τινα యొక్క అనిర్దిష్ట వ్యక్తి, καταπιεῖν యొక్క మింగివేయడం అనే హింసాత్మక వేటభావాలను ఒక సహజ తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: διάβολοςను సాధారణ నామవాచకంగా ‘అపనిందకుడు’ అని అనువదించాలా, వ్యక్తిగత దుష్టుని బిరుదుగా అనువదించాలా
  choice: అపవాది
  alternative: అపనిందకుడు
  rationale: ఈ సందర్భంలో సాధారణంగా అపనింద చేసే వ్యక్తి కాక, విశ్వాసుల వ్యక్తిగత ఆత్మీయ విరోధి ఉద్దేశించబడ్డాడు. ‘అపవాది’ తెలుగు క్రైస్తవ వాడుకలో ఆ గుర్తింపును అనవసరమైన అదనపు సిద్ధాంతార్థం లేకుండా తెలియజేస్తుంది.
- issue: περιπατεῖలో సింహపు వేటభావాన్ని ఎంత స్పష్టంగా వ్యక్తం చేయాలి
  choice: తిరుగుతున్నాడు
  alternative: పొంచి తిరుగుతున్నాడు
  rationale: గ్రీకు క్రియ యొక్క సాధారణ ‘చుట్టూ తిరుగు’ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, వేటాడే తీవ్రతను సింహపు ఉపమానమే మోయనివ్వడం మూలానికి దగ్గరగా ఉంటుంది. సందర్భానుగుణమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. రెండు ఆజ్ఞల మధ్య భావభేదం నిలుపబడింది; సింహపు రూపకం మరియు మింగివేయడం అనే తీవ్ర చిత్రం యథాతథంగా ఉంచబడ్డాయి.
