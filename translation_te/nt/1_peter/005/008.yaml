review_pass:
  verdict: revise
  source_fidelity: The two imperatives, the designation of the devil as the readers’ adversary, the roaring-lion simile, and the destructive purpose are retained. However, “ఎవరిని మింగివేయాలా అని” introduces a deliberative sense (“whom he should devour?”) not present in ζητῶν τινα καταπιεῖν. The Greek means that he is seeking someone in order to devour them.
  naturalness: “స్పష్టమైన మనస్సుతో ఉండండి” is understandable but somewhat calqued. “స్పష్టబుద్ధితో ఉండండి” is more idiomatic modern Telugu. “ఎవరినైనా మింగివేయడానికి వెదుకుతూ” is both natural and accurately expresses the purposive participial construction.
  terminology: “అపవాది” is an established Telugu biblical designation for διάβολος and appropriately retains its personal-title usage here. “విరోధియైన” and “అప్రమత్తంగా ఉండండి” are suitable modern-standard Telugu. “మింగివేయడం” preserves the force of καταπιεῖν.
  issues:
  - severity: medium
    issue: The phrase “ఎవరిని మింగివేయాలా అని వెదుకుతూ” is semantically inaccurate.
    rationale: The particle “లా” makes the Telugu construction deliberative, whereas the Greek ζητῶν τινα καταπιεῖν expresses seeking a person to devour. Recasting it with “మింగివేయడానికి” preserves the infinitive of purpose without adding hesitation or deliberation.
  - severity: low
    issue: “స్పష్టమైన మనస్సుతో ఉండండి” is less idiomatic than necessary.
    rationale: The expression is intelligible, but “స్పష్టబుద్ధితో ఉండండి” is a more natural Telugu rendering of the figurative vigilance and mental clarity denoted by νήψατε, while remaining distinct from γρηγορήσατε.
  revised_text: స్పష్టబుద్ధితో ఉండండి[a]; అప్రమత్తంగా ఉండండి. మీ విరోధియైన అపవాది, గర్జించే సింహంలా చుట్టూ తిరుగుతూ, ఎవరినైనా మింగివేయడానికి వెదుకుతున్నాడు[b].
