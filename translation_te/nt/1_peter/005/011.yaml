    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῷ
  choice: ఆయనకే
  rationale: మునుపటి సందర్భంలోని దేవుణ్ణి సూచించే ఏకవచన దత్తివిభక్తి సర్వనామం. ‘ఆయనకే’ అనే రూపం స్తుతివాక్యంలోని అర్పణ భావాన్ని, ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κράτος
  choice: పరిపాలనా శక్తి
  rationale: ఈ స్తుతివాక్యంలో ఈ పదం కేవలం బలాన్ని కాక, సార్వభౌమంగా పాలించే శక్తిని సూచిస్తుంది. ‘పరిపాలనా శక్తి’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఆ రెండు భావాలను నిలుపుతుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాల వరకు
  rationale: అంతంలేని కాలాన్ని బలంగా వ్యక్తం చేసే సాంప్రదాయ స్తుతి ప్రయోగం. ‘యుగయుగాల వరకు’ మూలంలోని పునరుక్తి బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: ఆరాధనా సందర్భంలోని ధృవీకరణ భావాన్ని నిలిపే, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ.
theological_decisions:
- issue: స్తుతివాక్యంలో క్రియాపదం వ్యక్తంగా లేకపోవడం
  choice: ఆయనకే ... కలుగుగాక
  alternative: పరిపాలనా శక్తి ఆయనదే
  rationale: గ్రీకు వాక్యంలో క్రియాపదం లేదు. ‘కలుగుగాక’ స్తుతి లేదా ఆశీర్వచన స్వరాన్ని నిలుపుతుంది; ‘ఆయనదే’ అని అనువదించడం స్వామ్య ప్రకటనగా అర్థాన్ని కొంత నిర్దిష్టం చేస్తుంది. మూలంలోని సంక్షిప్తతను సాధ్యమైనంత వరకు కాపాడుతూ, తెలుగులో పూర్తి వాక్యంగా ఉండేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన స్తుతి శైలిని పాటించాం. ‘ఆధిపత్యం’ కంటే సాధారణ పాఠకునికి స్పష్టమైన ‘పరిపాలనా శక్తి’ని ఎంచుకున్నాం; మూలంలోని కాలవ్యాప్తి ఉద్ఘాటనను ‘యుగయుగాల వరకు’గా నిలిపాం.
