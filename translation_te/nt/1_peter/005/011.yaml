revisions:
- from: ఆయనకే యుగయుగాల వరకు పరిపాలనా శక్తి కలుగుగాక[a]. ఆమేన్.
  to: యుగయుగాల వరకు ఆధిపత్యం ఆయనదే[a]. ఆమేన్.
  rationale: The revision uses ‘ఆధిపత్యం’ for κράτος and recasts the Greek verbless doxology as a standard Telugu ascription, ‘ఆయనదే.’ ‘యుగయుగాల వరకు’ preserves the idiomatic emphatic sense of ‘unto the ages of ages’; the footnote retains the more literal wording.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:53:08Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies κράτος as sovereign ruling power and εἰς τοὺς αἰῶνας τῶν αἰώνων as unending duration. However, ‘పరిపాలనా శక్తి’ is more expansive than the single Greek noun κράτος, and ‘కలుగుగాక’ can sound like a wish that dominion might come to him. The verbless Greek doxology is more faithfully represented in Telugu as a concise ascription of dominion to him.
  naturalness: ‘యుగయుగాల వరకు ఆధిపత్యం ఆయనదే’ is natural, dignified modern Telugu for a doxological affirmation. It avoids the slightly cumbersome ‘పరిపాలనా శక్తి కలుగుగాక.’
  terminology: ‘ఆధిపత్యం’ directly and idiomatically conveys κράτος here as dominion/ruling power. ‘ఆమేన్’ is retained as standard Telugu biblical liturgical usage.
  issues:
  - severity: medium
    issue: ‘పరిపాలనా శక్తి’ over-specifies κράτος.
    rationale: The Greek has one term denoting dominion, might, or ruling power. ‘పరిపాలనా శక్తి’ analytically expands it and shifts the concise doxological register. ‘ఆధిపత్యం’ is a closer, natural equivalent.
  - severity: medium
    issue: ‘కలుగుగాక’ may imply a petition or wish.
    rationale: Although it can be used in Telugu doxology, it can suggest that dominion should come to God, whereas the Greek elliptical construction conventionally ascribes dominion to him. ‘ఆయనదే’ supplies the implied predicate without that possible implication.
  - severity: low
    issue: The main text’s ‘ఆయనకే’ adds an explicit exclusivity nuance.
    rationale: The dative αὐτῷ means ‘to him’; it is not independently emphatic. The possessive-ascriptive Telugu construction expresses the intended doxological relation without adding focus.
  revised_text: యుగయుగాల వరకు ఆధిపత్యం ఆయనదే[a]. ఆమేన్.
  revised_footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: ‘ఆయనకు యుగాల యుగాల వరకు ఆధిపత్యం.’'
    reason: lexical_alternative
  revision_rationale: The revision uses ‘ఆధిపత్యం’ for κράτος and recasts the Greek verbless doxology as a standard Telugu ascription, ‘ఆయనదే.’ ‘యుగయుగాల వరకు’ preserves the idiomatic emphatic sense of ‘unto the ages of ages’; the footnote retains the more literal wording.
