id: 1PE.5.4
reference: 1 Peter 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: te
  text: ప్రధాన కాపరి ప్రత్యక్షపరచబడినప్పుడు[a], మీరు మహిమ యొక్క వాడిపోని కిరీటాన్ని[b] పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రత్యక్షమైనప్పుడు.’
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘కిరీటం’గా అనువదించిన గ్రీకు పదం ప్రత్యేకంగా రాజకిరీటాన్ని కాక, గౌరవ బహుమతిగా విజేతకు ఇచ్చే విజయమాలను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: వెల్లడి అయినప్పుడు
  rationale: జనిటివ్ అబ్సల్యూట్‌లోని ఏఓరిస్ట్ పాసివ్ పార్టిసిపల్‌ను కాలార్థకంగా అనువదించింది. ‘వెల్లడి అయినప్పుడు’ అనే రూపం పాసివ్ భావాన్నీ ప్రత్యక్షత భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀρχιποίμενος
  choice: ప్రధాన కాపరి
  rationale: కాపరులలో ముఖ్యుడు లేదా సర్వోన్నత కాపరి అనే సమాసపద భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; సందర్భంలో ఇది యేసును సూచించే బిరుదు.
- source_word: κομιεῖσθε
  choice: పొందుతారు
  rationale: బహుమతిగా లభించేదాన్ని స్వీకరించడం లేదా పొందడం అనే ఫ్యూచర్ మిడిల్ క్రియ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀμαράντινον
  choice: వాడిపోని
  rationale: వాడకపోవడం, తాజాదనాన్ని కోల్పోకపోవడం అనే చిత్రాన్ని నేరుగా నిలుపుతుంది; మూలపదం కంటే బలమైన ‘నశించని’ అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: τῆς δόξης
  choice: మహిమ
  rationale: జనిటివ్ సంబంధాన్ని ‘మహిమ కిరీటం’ అనే సహజ తెలుగు నామవాచక సమాసంలో నిలుపుతుంది; దానిని కేవలం ‘మహిమాన్వితమైన’ అనే విశేషణంగా కుదించదు.
- source_word: στέφανον
  choice: కిరీటాన్ని
  rationale: గౌరవం లేదా విజయానికి బహుమతిగా ఇచ్చే పుష్పమాల/విజయ కిరీటం అనే భావాన్ని పాఠకులకు సులభంగా అర్థమయ్యే సాధారణ పదంతో అందిస్తుంది; ప్రత్యేక భావాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: ‘ప్రధాన కాపరి’ ఎవరనే గుర్తింపు
  choice: సందర్భంలో యేసును సూచించే క్రీస్తుసంబంధ బిరుదుగా అనువదించడం
  alternative: పాఠ్యంలో ‘యేసు’ లేదా ‘క్రీస్తు’ అని స్పష్టంగా చేర్చడం
  rationale: కాపరి రూపకం మరియు అంత్యకాల వెల్లడి సందర్భం ఈ బిరుదును యేసుకు అన్వయిస్తాయి; అయితే మూలంలో లేని పేరును ప్రధాన పాఠ్యంలో చేర్చకుండా బిరుదును యథాతథంగా ఉంచడం సముచితం.
- issue: అంత్యకాల ప్రత్యక్షత భాష
  choice: వెల్లడి అయినప్పుడు
  alternative: ప్రత్యక్షమైనప్పుడు
  rationale: పాసివ్ రూపాన్నీ వెల్లడి/ప్రకటన భావాన్నీ కాపాడుతుంది; సంఘటన స్వరూపాన్ని మూలపాఠం చెప్పిన దానికంటే ఎక్కువగా నిర్దిష్టపరచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను కాపాడే శైలి. ‘మీరు’ అనే గౌరవ బహువచనం సందర్భంలోని సంఘ పెద్దలను ఉద్దేశిస్తుంది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
