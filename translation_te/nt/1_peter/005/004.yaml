review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the temporal genitive absolute, the future reception, and the unfading victor's-crown imagery. However, ‘వెల్లడి అయినప్పుడు’ is less idiomatic Telugu for the passive manifestation participle. ‘ప్రత్యక్షపరచబడినప్పుడు’ preserves the passive sense explicitly. Reordering the noun phrase clarifies that ‘of glory’ qualifies the crown.
  naturalness: ‘ప్రధాన కాపరి’ and ‘పొందుతారు’ are natural in a dignified modern standard Telugu register. The revised manifestation expression is clearer and more grammatical than the draft’s separated ‘వెల్లడి అయినప్పుడు.’
  terminology: ‘ప్రధాన కాపరి’ suitably conveys ἀρχιποίμενος without adding a name absent from the Greek. ‘వాడిపోని’ appropriately preserves the floral/wreath image of ἀμαράντινον. ‘కిరీటం’ is readable, and the footnote properly specifies the non-royal victor’s-wreath sense.
  issues:
  - severity: low
    issue: The expression ‘వెల్లడి అయినప్పుడు’ is awkward in modern Telugu.
    rationale: Although it aims to retain the Greek passive, this wording is not the most idiomatic way to say that a person is revealed/manifested. ‘ప్రత్యక్షపరచబడినప్పుడు’ retains the passive sense and reads more clearly.
  - severity: low
    issue: ‘వాడిపోని మహిమ కిరీటాన్ని’ can momentarily be parsed as a ‘glorious unfading crown’ rather than explicitly as ‘the unfading crown of glory.’
    rationale: Placing ‘మహిమ యొక్క’ before the full modified noun phrase makes the Greek genitive relationship clearer without changing meaning.
  revised_text: ప్రధాన కాపరి ప్రత్యక్షపరచబడినప్పుడు[a], మీరు మహిమ యొక్క వాడిపోని కిరీటాన్ని[b] పొందుతారు.
