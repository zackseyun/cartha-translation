id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: te
  text: అయితే సమస్త కృపల దేవుడు, మెస్సీయలో[a] తన నిత్య మహిమలోకి మిమ్మల్ని పిలిచాడు. కొంతకాలం మీరు బాధలు అనుభవించిన తర్వాత, ఆయనే మిమ్మల్ని పునరుద్ధరిస్తాడు[b], స్థిరపరుస్తాడు, బలపరుస్తాడు, దృఢమైన పునాదిపై నిలబెడతాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తులో.” గ్రీకు బిరుదు Χριστόςను “మెస్సీయ” లేదా సంప్రదాయంగా “క్రీస్తు” అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “సంపూర్ణులను చేస్తాడు” లేదా “తగిన స్థితికి సరిచేస్తాడు.” గ్రీకు క్రియలో దేనినైనా సరైన స్థితికి పునరుద్ధరించే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “పునాది వేస్తాడు” లేదా “దృఢమైన పునాదిపై ఉంచుతాడు.” గ్రీకు పదం పునాది రూపకాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: సమస్త కృపకు
  rationale: దేవుడు కృప అంతటికీ మూలమని తెలిపే సమగ్ర భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καλέσας
  choice: పిలిచాడు
  rationale: గ్రీకు ఏఓరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు భూతకాల క్రియగా వ్యక్తపరుస్తుంది.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: తన నిత్య మహిమలోకి
  rationale: εἰς లోని దిశతోపాటు మహిమలో పాలుపొందే భావాన్ని ‘లోకి’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉంది; ‘మెస్సీయ’ దాని అభిషిక్త రాజు భావాన్ని నిలుపుతుంది. ἐν ను ‘లో’గా అనువదించడం క్రీస్తుతో ఐక్యతను అతిగా వివరించకుండా కాపాడుతుంది.
- source_word: ὀλίγον παθόντας
  choice: కొంతకాలం మీరు బాధలు అనుభవించిన తర్వాత
  rationale: ὀλίγον ను కాలపరమైన పరిమితిగా తీసుకొని, బాధ అనంతరం దేవుని చర్య వస్తుందనే క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: αὐτὸς
  choice: ఆయనే
  rationale: దేవుడు స్వయంగా ఈ కార్యాలు చేస్తాడనే గ్రీకు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: καταρτίσει
  choice: సరిచేసి పూర్ణస్థితికి తెస్తాడు
  rationale: దెబ్బతిన్నదాన్ని తగిన స్థితికి పునరుద్ధరించడం, సంపూర్ణం చేయడం అనే విస్తృత భావాన్ని ఒకే సంకుచిత అర్థానికి పరిమితం చేయదు.
- source_word: στηρίξει
  choice: స్థిరపరుస్తాడు
  rationale: దృఢత, నిలకడ కలిగించడం అనే భావాన్ని నేరుగా మరియు సహజంగా అందిస్తుంది.
- source_word: σθενώσει
  choice: బలపరుస్తాడు
  rationale: శక్తిమంతులను చేయడం అనే మూల భావానికి సూటిగా సరిపోతుంది; పక్కనున్న క్రియలతో ఉన్న భేదాన్ని సాధ్యమైనంతగా ఉంచుతుంది.
- source_word: θεμελιώσει
  choice: దృఢమైన పునాదిపై నిలబెడతాడు
  rationale: గ్రీకు క్రియలోని పునాది రూపకాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: Χριστῷ యొక్క అనువాదం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: Χριστός ఇక్కడ కేవలం పేరులా కాక బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ దాని అర్థాన్ని తెలియజేస్తుంది; సంప్రదాయ తెలుగు రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: బాధకు దేవుని భవిష్యత్ చర్యలకు మధ్య కాలసంబంధం
  choice: కొంతకాలం మీరు బాధలు అనుభవించిన తర్వాత
  alternative: కొంతకాలం బాధలు అనుభవిస్తూ ఉండగా
  rationale: కృదంతానికి కొంత కాలసంబంధ సౌలభ్యం ఉన్నా, ప్రధాన క్రియలకు ముందు పరిమితకాల బాధను సూచించడం సందర్భానికి సరిపోతుంది; బాధ గురించి అదనపు సిద్ధాంతాన్ని చేర్చదు.
- issue: καταρτίσει యొక్క పరిధి
  choice: సరిచేసి పూర్ణస్థితికి తెస్తాడు
  alternative: పునరుద్ధరిస్తాడు
  rationale: ఈ క్రియ మరమ్మతు లేదా పునరుద్ధరణతోపాటు తగిన స్థితికి సిద్ధం చేయడం, సంపూర్ణం చేయడం అనే భావాలను కలిగి ఉంటుంది. రెండు భాగాల తెలుగు పదబంధం ఆ అర్థవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. నాలుగు సమాంతర భవిష్యత్ క్రియల లయను నిలుపుతూ, చివరి క్రియలోని పునాది రూపకాన్ని స్పష్టంగా వ్యక్తపరిచింది.
