  to: అయితే సమస్త కృపల దేవుడు, మెస్సీయలో[a] తన నిత్య మహిమలోకి మిమ్మల్ని పిలిచాడు. కొంతకాలం మీరు బాధలు అనుభవించిన తర్వాత, ఆయనే మిమ్మల్ని పునరుద్ధరిస్తాడు[b], స్థిరపరుస్తాడు, బలపరుస్తాడు, దృఢమైన పునాదిపై నిలబెడతాడు[c].
  rationale: The revision retains the draft’s faithful choices for the temporal participle, the directional phrase ‘తన నిత్య మహిమలోకి,’ and the title ‘మెస్సీయ.’ It improves Telugu idiom and restores the Greek’s fourfold future-verb parallelism by using ‘పునరుద్ధరిస్తాడు.’ It also supplies and correctly anchors the missing Messiah/Christ alternative note, while preserving the lexical alternatives for the first and last future verbs.
