  source_fidelity: 'The Telugu accurately represents the Greek imperative sequence and its sense: resistance to the devil (implicitly identified from v. 8), steadfastness in faith, and awareness that comparable sufferings are occurring within the worldwide community of believers. “అలాంటి బాధలనే” appropriately expresses the idiomatic sense of τὰ αὐτὰ τῶν παθημάτων without claiming identical individual events. “అనుభవిస్తున్నదని” is a natural contextual rendering of the difficult passive infinitive ἐπιτελεῖσθαι; the closer alternatives are responsibly retained in a footnote.'
