id: 1PE.5.9
reference: 1 Peter 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: te
  text: విశ్వాసంలో[a] దృఢంగా నిలిచి వాణ్ణి ఎదిరించండి. లోకమంతటా ఉన్న మీ తోటి విశ్వాసుల కుటుంబం[b] కూడా అలాంటి బాధలనే అనుభవిస్తున్నదని[c] మీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ విశ్వాసంలో.”
    reason: lexical_alternative
  - marker: b
    text: “తోటి విశ్వాసుల కుటుంబం” అనేది పురుషులను మాత్రమే కాక, తోటి విశ్వాసుల సమాజమంతటినీ సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “అలాంటి బాధలే పూర్తవుతున్నాయని”; “నెరవేరుతున్నాయని” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: వాణ్ణి
  rationale: ఈ సర్వనామం 8వ వచనంలోని అపవాదిని సూచిస్తుంది. తెలుగులో క్రియకు ముందు స్పష్టమైన కర్మ సర్వనామం సహజంగా ఉంటుంది.
- source_word: ἀντίστητε
  choice: ఎదిరించండి
  rationale: నిర్ణయాత్మకంగా ప్రతిఘటించాలనే ఆజ్ఞార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: στερεοὶ
  choice: దృఢంగా నిలిచి
  rationale: ప్రతిఘటనలో స్థిరత్వాన్ని తెలియజేస్తూ, తెలుగులో ‘విశ్వాసంలో’ అనే పదబంధంతో సహజంగా కలుస్తుంది.
- source_word: τῇ πίστει
  choice: విశ్వాసంలో
  rationale: క్రైస్తవ విశ్వాసంలో స్థిరంగా ఉండడం, వ్యక్తిగత నమ్మకంలో దృఢంగా ఉండడం అనే భావాల మధ్య ఉన్న స్వల్ప సందిగ్ధతను అతిగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: εἰδότες
  choice: మీకు తెలుసు
  rationale: గ్రీకు కృదంతం ప్రతిఘటనకు ఆధారమైన జ్ఞానాన్ని సూచిస్తుంది. తెలుగులో ఈ వాక్యాంత నిర్మాణం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: అలాంటి బాధలనే
  rationale: అచ్చంగా అవే సంఘటనలు కాక, అదే రకమైన బాధలు అనే గ్రీకు నుడికార భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἀδελφότητι
  choice: తోటి విశ్వాసుల కుటుంబం
  rationale: విశ్వాసుల సమస్త సమాజాన్ని సూచించే సామూహిక కుటుంబ భావాన్ని సహజమైన, స్త్రీపురుషులందరినీ కలుపుకునే తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῷ κόσμῳ
  choice: లోకమంతటా ఉన్న
  rationale: విశ్వాసుల సమాజం ప్రపంచంలో విస్తరించి ఉన్నదనే స్థానిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιτελεῖσθαι
  choice: అనుభవిస్తున్నదని
  rationale: బాధలు విశ్వాసుల సమాజంలో జరుగుతున్నాయనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘పూర్తి అవుతున్నాయి’ అనే మరింత రూపానుసారమైన భావాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: τῇ πίστει యొక్క భావం
  choice: విశ్వాసంలో
  alternative: ఆ విశ్వాసంలో
  rationale: మూలంలోని వ్యాసం స్థిరపడిన క్రైస్తవ విశ్వాసాన్ని సూచించవచ్చు; అయితే వ్యక్తిగత విశ్వాసం అనే భావాన్ని పూర్తిగా తొలగించకుండా ప్రధాన పాఠం రెండింటికీ చోటిస్తుంది.
- issue: ἀδελφότητι యొక్క సామూహిక, కుటుంబార్థం
  choice: తోటి విశ్వాసుల కుటుంబం
  alternative: సహోదర సమాజం
  rationale: ఈ పదం పురుషులను మాత్రమే కాక విశ్వాసుల సమాజమంతటినీ సూచిస్తుంది. ‘కుటుంబం’ అనే పదం మూలంలోని బంధుత్వ భావాన్ని సహజంగా నిలుపుతుంది.
- issue: ἐπιτελεῖσθαι యొక్క అర్థం
  choice: అనుభవిస్తున్నదని
  alternative: పూర్తి అవుతున్నాయని / నెరవేరుతున్నాయని
  rationale: క్రియకు ‘పూర్తికి తీసుకురావడం’ అనే భావం ఉండవచ్చు; కాని బాధలతో కలిసిన ఈ నిర్మాణంలో ‘అనుభవించడం’ తెలుగులో సహజం. నియమిత బాధల పరిమాణం నెరవేరుతోందనే భావాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞను ఉపయోగించింది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా రెండు భాగాలుగా విభజించబడింది. ‘వాణ్ణి’ అనేది ముందరి వచనంలోని అపవాదిని సూచించే సాధారణమైన కానీ గౌరవహీనతను ఉద్దేశించని కర్మరూపం.
