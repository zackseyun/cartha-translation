  terminology: “విశ్వాసం” preserves the useful ambiguity of τῇ πίστει between faith and the established Christian faith; the footnote supplies the article-sensitive alternative without forcing an interpretation. “తోటి విశ్వాసుల కుటుంబం” naturally conveys the collective, inclusive force of ἀδελφότης. The cultural note correctly explains that this community term is not restricted to males. Footnote markers are present and correctly attached to the relevant expressions.
