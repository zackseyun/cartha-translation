id: 2PE.2.3
reference: 2 Peter 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: te
  text: వారు దురాశతో కల్పిత మాటల ద్వారా మిమ్మల్ని దోచుకుంటారు.[a] ఎప్పటినుంచో వారికోసం ఉన్న తీర్పు నిర్వీర్యంగా లేదు; వారి వినాశనం కునుకు తీయడం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని సరుకుగా చేసుకొని వ్యాపారం చేస్తారు.” గ్రీకు పదం ప్రజలను లాభం కోసం ఉపయోగించే వస్తువులుగా చూడటాన్ని వాణిజ్య రూపకంతో తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: దురాశతో
  rationale: ఈ పదం అత్యాశను, ఇతరుల ద్వారా లాభపడాలనే స్వార్థపూరిత కోరికను సూచిస్తుంది; సందర్భంలో వారి చర్యకు ప్రేరణను తెలుపుతుంది.
- source_word: πλαστοῖς λόγοις
  choice: కల్పిత మాటలు చెప్పి
  rationale: πλαστός అనేది తయారుచేసినది లేదా కల్పించినది అనే భావాన్ని ఇస్తుంది; కేవలం అసత్యం కాకుండా ఉద్దేశపూర్వకంగా అల్లిన బోధనను సూచిస్తుంది.
- source_word: ἐμπορεύσονται
  choice: మిమ్మల్ని లాభానికి వాడుకుంటారు
  rationale: మూలపదంలోని వ్యాపార రూపకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ప్రజలను లాభసాధన వస్తువులుగా చూడటాన్ని తెలియజేస్తుంది.
- source_word: κρίμα
  choice: తీర్పు
  rationale: న్యాయపరమైన నిర్ణయం లేదా దానికి సంబంధించిన శిక్ష అనే విస్తృత భావాన్ని ఉంచుతుంది; వచనం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: ἔκπαλαι
  choice: చాలాకాలం క్రితమే నిర్ణయించబడిన
  rationale: తీర్పు పూర్వకాలం నుంచే నిలిచి ఉందనే కాలభావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἀργεῖ
  choice: సోమరిగా లేదు
  rationale: ἀργέω లోని క్రియారహితంగా లేదా పనిలేకుండా ఉండటం అనే వ్యక్తీకరణను నిలుపుతుంది; కేవలం ఆలస్యం అనే భావానికి పరిమితం చేయదు.
- source_word: ἀπώλεια
  choice: నాశనం
  rationale: వినాశం లేదా పతనం అనే మూలపదపు విస్తృత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ νυστάζει
  choice: నిద్రపోవడం లేదు
  rationale: నాశనాన్ని వ్యక్తీకరించే మూలంలోని సజీవ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రకటించబడిన శిక్ష స్వభావం
  choice: రాబోయే దైవిక తీర్పు, నాశనం అని వచనంలోని హెచ్చరికను సూటిగా అనువదించడం
  alternative: ‘నాశనం’ను సంపూర్ణ ఉనికిలేమిగా లేదా అంతిమ తీర్పు కాని తాత్కాలిక పతనంగా నిర్దిష్టీకరించడం
  rationale: ఈ వచనం అబద్ధ బోధకులకు తీర్పు, నాశనం నిశ్చయమని చెబుతుంది; అయితే వాటి విధానాన్ని లేదా కాలవ్యవధిని నిర్వచించదు. కాబట్టి అదనపు సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన హెచ్చరిక ధోరణిని నిలిపే శైలి. తీర్పు ‘సోమరిగా లేదు,’ నాశనం ‘నిద్రపోవడం లేదు’ అనే వ్యక్తీకరణలను మూలంలోని సమాంతర సజీవ రూపకాల కోసం ఉంచాం.
