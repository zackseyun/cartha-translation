id: 2PE.2.17
reference: 2 Peter 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: te
  text: వీరు నీరు లేని ఊటలు, తుఫాను చేత తరిమికొట్టబడే పొగమంచులు[a]. వీరి కొరకు చీకటి యొక్క గాఢాంధకారం ఉంచబడివుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, ‘తుఫాను చేత తరిమికొట్టబడే మేఘాలు.’ గ్రీకు పదం మరింత ఖచ్చితంగా పొగమంచు లేదా మసకమంచును సూచిస్తుంది; కొన్ని అనువాదాలు దాన్ని విస్తృతార్థంలో ‘మేఘాలు’ అని ఇస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: లేక, ‘వీరి కొరకు చీకటి యొక్క నల్లని గాఢాంధకారం ప్రత్యేకంగా ఉంచబడివుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: నీళ్లులేని ఊటలు
  rationale: πηγή తవ్విన బావిని కాక సహజంగా నీరు ఉబికే ఊటను ప్రధానంగా సూచిస్తుంది; ἄνυδρος నీరు లేనిదని అర్థం. నీటిని ఇవ్వాల్సిన ఊటల్లో నీరు లేకపోవడమనే వ్యంగ్య చిత్రాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: ὁμίχλαι
  choice: పొగమంచు తెరలు
  rationale: ὁμίχλη మేఘాన్ని సాధారణంగా సూచించకుండా పొగమంచు లేదా మసక మంచును సూచిస్తుంది. తెలుగులో బహువచన చిత్రాన్ని సహజంగా తెలియజేయడానికి ‘పొగమంచు తెరలు’ అని ఇచ్చాం.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: తుఫాను చేత కొట్టుకుపోయే
  rationale: λαῖλαψ తీవ్రమైన గాలివానను, ἐλαύνω తరిమివేయడం లేదా ముందుకు కొట్టుకుపోయేలా చేయడాన్ని సూచిస్తాయి. ఈ అనువాదం కర్తరి భావాన్ని చేర్చకుండా గ్రీకు కర్మణి నిర్మాణాన్నీ బలమైన చలన చిత్రాన్నీ సహజ తెలుగులో అందిస్తుంది.
- source_word: οἷς
  choice: వీరి కోసం
  rationale: మధ్యలోని రూపకాలు స్త్రీలింగ బహువచనంలో ఉన్నా, సంబంధబోధక సర్వనామం తిరిగి ‘వీరు’ అని చెప్పబడిన అబద్ధ బోధకులనే సూచిస్తుంది. అందువల్ల వ్యక్తులను సూచించే ‘వీరి కోసం’ అని అనువదించాం.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: చీకటి నిండిన గాఢాంధకారం
  rationale: ζόφος మసకతో కూడిన గాఢమైన అంధకారాన్ని, σκότος చీకటిని సూచిస్తాయి. గ్రీకులోని రెండు పదాల తీవ్రతను పూర్తిగా ఒకే పదంగా కుదించకుండా, తెలుగులో సహజంగా వినిపించేలా ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: τετήρηται
  choice: ఉంచబడింది
  rationale: τηρέω యొక్క సంపూర్ణ కర్మణి రూపం అది ఉంచబడి ఇప్పటికీ అలాగే ఉందనే భావాన్ని ఇస్తుంది. ‘ఉంచబడింది’ ఆ కర్మణి భావాన్ని నిలుపుతూ, తీర్పును అమలు చేసే కర్తను వచనంలో లేనప్పుడు అదనంగా పేర్కొనదు.
theological_decisions:
- issue: చివరి ఉపవాక్యంలోని తీర్పు భాష మరియు దాని కర్త
  choice: గాఢాంధకారం ‘వీరి కోసం ... ఉంచబడింది’ అని కర్మణి రూపంలో ఇచ్చి, దాన్ని ఉంచిన కర్తను పేర్కొనలేదు.
  alternative: ‘దేవుడు వీరి కోసం ... ఉంచాడు’ అని దైవిక కర్తను స్పష్టంగా చేర్చడం.
  rationale: సందర్భం దైవిక తీర్పును సూచించినా, గ్రీకు వాక్యం కర్తను పేరుపెట్టదు. కాబట్టి మూలంలోని కర్మణి నిర్మాణాన్ని, దానిలోని ఉద్దేశపూర్వక పరోక్షతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. ‘నీళ్లులేని ఊటలు’ మరియు ‘పొగమంచు తెరలు’ రూపకాల స్పష్టతను నిలుపుతాయి; చివరి ఉపవాక్యంలో కర్తను చేర్చకుండా మూలంలోని తీర్పు భాషను కాపాడాం.
