id: 2PE.2.9
reference: 2 Peter 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: te
  text: అప్పుడు ప్రభువుకు భక్తులను పరీక్షనుండి[a] రక్షించడం, అన్యాయస్థులను తీర్పుదినం వరకు శిక్ష అనుభవిస్తూ ఉండేలా[b] ఉంచడం తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రలోభంలోనుండి.” గ్రీకు పదానికి ప్రలోభం, పరీక్ష లేదా శోధన అనే అర్థాలు రావచ్చు; ఇక్కడి సందర్భం కష్టమైన పరీక్షనుండి రక్షించడాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అన్యాయస్థులను తీర్పుదినాన శిక్షించబడటానికి ఉంచడం.” గ్రీకు అసమాపక క్రియారూపం కొనసాగుతున్న శిక్షను సూచించవచ్చు; లేదా రాబోయే తీర్పుతో సంబంధించిన శిక్షను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: ఎలా … చేయాలో … తెలుసు
  rationale: రెండు క్రియార్థక రూపాలతో ఉన్న οἶδεν నిర్మాణం కార్యసామర్థ్యంతో కూడిన జ్ఞానాన్ని సూచిస్తుంది; తెలుగులో ‘ఎలా … చేయాలో తెలుసు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: దైవసంబంధ κύριοςకు ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సహజమైన గౌరవార్థక పదం.
- source_word: εὐσεβεῖς
  choice: భక్తులను
  rationale: నామవాచకంగా వాడిన విశేషణం దేవునిపట్ల భక్తిగల వ్యక్తులను సూచిస్తుంది; ‘భక్తులు’ సంక్షిప్తంగా మతనైతిక భావాన్ని నిలుపుతుంది.
- source_word: ἐκ πειρασμοῦ
  choice: శోధనలోనుండి
  rationale: πειρασμός పరీక్ష, కష్టం, లేదా ప్రలోభం అనే అర్థాలు కలిగి ఉండవచ్చు. ముందరి సందర్భంలోని నోవహు, లోతుల విమోచన దృష్ట్యా ‘శోధన’ విస్తృతార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: ῥύεσθαι
  choice: రక్షించాలో
  rationale: ప్రమాదం లేదా కష్టంనుండి విడిపించడం అనే ῥύομαι భావాన్ని ‘రక్షించు’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδίκους
  choice: అనీతిమంతులను
  rationale: ἄδικοςలోని నైతిక, న్యాయపరమైన వ్యతిరేకతను ‘అనీతిమంతులు’ నిలుపుతుంది.
- source_word: κολαζομένους
  choice: శిక్షకు గురవుతున్నవారిగా
  rationale: వర్తమాన కర్మణి అసమాపక క్రియారూపంలోని కొనసాగుతున్న శిక్ష భావాన్ని స్పష్టంగా నిలుపుతుంది; అయితే ప్రత్యామ్నాయ వాక్యనిర్మాణానికి పాదసూచిక ఇస్తుంది.
- source_word: εἰς ἡμέραν κρίσεως
  choice: తీర్పుదినం వరకు
  rationale: τηρεῖνతో కలిసి రాబోయే తీర్పుదినం వైపు వారిని ఉంచడాన్ని ‘వరకు’ సహజంగా తెలియజేస్తుంది.
- source_word: τηρεῖν
  choice: ఉంచాలో
  rationale: τηρέω యొక్క ఉంచడం, కాపాడి ఉంచడం, నిలిపి ఉంచడం అనే విస్తృత భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
theological_decisions:
- issue: πειρασμός యొక్క సందర్భార్థం
  choice: ‘శోధన’—కష్టం లేదా పరీక్షను ప్రధానంగా సూచించే విస్తృత పదం
  alternative: ‘ప్రలోభం’
  rationale: ముందరి వచనాల్లో విపత్తు, దుష్ట పరిసరాల మధ్య నోవహు, లోతులను విడిపించడం ప్రధానంగా ఉంది. అయినా మూలపదంలోని పరీక్ష/ప్రలోభం సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: κολαζομένους యొక్క కాలబలం మరియు వాక్యసంబంధం
  choice: తీర్పుదినం వరకు శిక్షకు గురవుతున్న స్థితిలో ఉంచడం
  alternative: తీర్పుదినాన శిక్షించబడటానికి ఉంచడం
  rationale: వర్తమాన అసమాపక క్రియారూపాన్ని కొనసాగుతున్న స్థితిగా అనువదించడం దాని ప్రత్యక్ష రూపబలాన్ని నిలుపుతుంది. అయితే అది భవిష్యత్ తీర్పుతో అనుసంధానమైన శిక్షను సూచించే అవకాశాన్ని పాదసూచికలో వెల్లడించడం ద్వారా వచనంలోని నిజమైన ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని సమాంతర ‘రక్షించు/ఉంచు’ నిర్మాణాన్ని నిలిపి, πειρασμός మరియు κολαζομένους సందిగ్ధతలను పాదసూచికల్లో స్పష్టంగా ఇచ్చాం.
