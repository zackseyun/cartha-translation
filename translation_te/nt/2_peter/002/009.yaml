revisions:
- from: భక్తులను శోధనలోనుండి ఎలా రక్షించాలో, అనీతిమంతులను శిక్షకు గురవుతున్నవారిగా తీర్పుదినం వరకు ఎలా ఉంచాలో ప్రభువుకు తెలుసు.[a][b]
  to: అప్పుడు ప్రభువుకు భక్తులను పరీక్షనుండి[a] రక్షించడం, అన్యాయస్థులను తీర్పుదినం వరకు శిక్ష అనుభవిస్తూ ఉండేలా[b] ఉంచడం తెలుసు.
  rationale: సవరించిన వాక్యం మూలంలోని సమాంతరమైన ‘రక్షించడం/ఉంచడం’ నిర్మాణాన్ని నిలుపుతూ, తెలుగు పదక్రమాన్ని సహజం చేసింది. ‘అప్పుడు’ అనేది ముందరి ఉదాహరణల నుండి వచ్చే గ్రీకు వాక్యప్రవాహాన్ని ప్రతిబింబిస్తుంది. ‘పరీక్ష’ సందర్భానికి తగిన ప్రధానార్థం; ‘ప్రలోభం’ పాదసూచికలో ఉండి సందిగ్ధతను కాపాడుతుంది. κολαζομένουςను కొనసాగుతున్న శిక్షగా అనువదించినప్పటికీ, భవిష్యత్ తీర్పుతో సంబంధమైన ప్రత్యామ్నాయ అన్వయాన్ని పాదసూచికలో పేర్కొనడం వల్ల వివాదాస్పద అంశంపై నిర్దిష్ట సిద్ధాంత నిర్ణయం రుద్దబడదు.
