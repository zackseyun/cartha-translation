  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: te
  text: నిజమైన సామెతలో చెప్పబడినది వారికి సంభవించింది:[a] “కుక్క తాను కక్కినదానివద్దకే తిరిగి వస్తుంది,”[b] అలాగే, “కడిగిన ఆడపంది బురదలో పొర్లడానికి తిరిగి వెళ్తుంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుగుణంగా: “నిజమైన సామెతలోని మాట వారికి సంభవించింది.”'
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థానికి దగ్గరగా: “కుక్క తాను కక్కినదానివద్దకు తిరిగి వెళ్లి … కడిగిన ఆడపంది బురదలో పొర్లడానికి.” మొదటి మాట సామెతలు 26:11ను ప్రతిధ్వనిస్తుంది.'
    reason: cross_reference
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: వారి విషయంలో జరిగింది
  rationale: పూర్తయిన క్రియ వల్ల ఏర్పడిన ప్రస్తుత స్థితిని గ్రీకు perfect సూచిస్తుంది. సామెతలోని మాట వారి విషయంలో నిజమైందనే భావాన్ని ఈ సహజమైన తెలుగు ప్రయోగం తెలియజేస్తుంది.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: నిజమైన సామెత చెప్పేది
  rationale: మూలంలోని సంక్షిప్తమైన, కొంత అధ్యాహారంతో కూడిన నిర్మాణాన్ని తెలుగులో అర్థవంతంగా వ్యక్తం చేస్తూ, సామెతలోని విషయం వారిలో నెరవేరిందనే భావాన్ని నిలుపుతుంది.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: కుక్క తాను కక్కినదాని దగ్గరికే తిరిగి వస్తుంది
  rationale: సామెతకు సహజమైన సాధారణ వర్తమాన రూపాన్ని వాడి, ἴδιον అనే ‘తన సొంత’ భావాన్ని ‘తాను’ ద్వారా నిలిపింది. ఇది సామెతలు 26:11 ప్రతిధ్వనిని కూడా స్పష్టంగా ఉంచుతుంది.
- source_word: Ὗς λουσαμένη
  choice: కడిగిన ఆడపంది
  rationale: Ὗς ఇక్కడ స్త్రీలింగ ఏకవచనం కావడంతో ‘ఆడపంది’ అని అనువదించబడింది; λουσαμένηను సంక్షిప్తంగా, సహజంగా ‘కడిగిన’ అని ఇచ్చింది. కర్త తానే కడుక్కుందా లేక కడిగబడిందా అనే రూపసంబంధ సందిగ్ధతను విస్తరించి నిర్ణయించలేదు.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: బురదలో పొర్లడానికి
  rationale: κυλισμόςలోని పొర్లడం/దొర్లడం అనే చిత్రాన్ని, βόρβοροςలోని బురద లేదా మురికి భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: అధ్యాహారంతో కూడిన సామెత ఉల్లేఖనపు భావం
  choice: సామెత చెప్పేది వారి విషయంలో జరిగిందని మాత్రమే పేర్కొనడం
  alternative: ‘నిజమైన సామెత మాటే వారికి సంభవించింది’ అని మరింత రూపానుగుణంగా అనువదించడం
  rationale: మూల గ్రీకు సంక్షిప్తంగా, అధ్యాహారంతో ఉంది. ఎంచుకున్న రూపం తిరిగి పాత స్థితికి వెళ్లడమనే హెచ్చరికాత్మక చిత్రాన్ని నిలుపుతూ, రక్షణ స్థితి లేదా సిద్ధాంతపరమైన పరిణామాల గురించి మూలంలో లేని వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. సామెతల సహజ ప్రవాహం కోసం రెండు భాగాల్లోనూ అధ్యాహార క్రియను పూరించాం; అయితే దాని రూపానుగుణ నిర్మాణాన్ని పాదటిప్పణిలో నిలిపాం.
