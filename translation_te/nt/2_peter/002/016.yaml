id: 2PE.2.16
reference: 2 Peter 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: te
  text: 'కాని అతడు తన సొంత అతిక్రమానికి గద్దింపు పొందాడు: మాటలేని బరువు మోసే జంతువు[a] మానవ స్వరంతో మాట్లాడుతూ[b] ఆ ప్రవక్త పిచ్చితనాన్ని అడ్డుకుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘బరువు మోసే జంతువు’; ఇది బిలాము గాడిదను సూచిస్తుంది (సంఖ్యా 22:28–30).
    reason: cross_reference
  - marker: b
    text: లేదా ‘ఒక మనిషి స్వరంతో.’ జంతువును మానవ వక్తతో పోల్చుతున్నందున, గ్రీకు పదబంధం బహుశా ‘మానవ స్వరంతో’ అని అర్థమిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: గద్దింపు
  rationale: తప్పును ఎత్తిచూపే మందలింపు లేదా గద్దింపు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἰδίας παρανομίας
  choice: తన సొంత అతిక్రమానికి
  rationale: παρανομίαలోని నియమాన్ని అతిక్రమించిన దోషభావాన్ని నిలుపుతూ, ἰδίας సూచించే వ్యక్తిగత బాధ్యతను స్పష్టం చేస్తుంది.
- source_word: ὑποζύγιον
  choice: బరువు మోసే జంతువు
  rationale: మూలంలోని సాధారణ పదాన్ని నిలుపుతుంది; సందర్భం గాడిదను సూచించినా ప్రధాన పాఠ్యంలో దానిని ప్రత్యేకంగా పేర్కొనదు.
- source_word: ἄφωνον
  choice: మాటలేని
  rationale: సాధారణంగా మాట్లాడలేని జంతువు మానవ స్వరంతో మాట్లాడటంలోని వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: మానవ స్వరంతో
  rationale: జంతువు స్వరానికి భిన్నమైన మానవ స్వరం అనే భావాన్ని తెలియజేస్తుంది; అనవసరంగా పురుషునికి మాత్రమే పరిమితం చేయదు.
- source_word: φθεγξάμενον
  choice: మాట్లాడుతూ
  rationale: స్పష్టంగా పలకడాన్ని సూచించే కృదంత భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐκώλυσεν
  choice: అడ్డుకుంది
  rationale: ప్రవక్త యొక్క అవివేకపూరిత చర్యను నిలువరించడం లేదా నిరోధించడం అనే κωλύω భావాన్ని సరళంగా అందిస్తుంది.
- source_word: παραφρονίαν
  choice: పిచ్చితనాన్ని
  rationale: కేవలం మూర్ఖత్వం కంటే బలమైన, వివేకం తప్పిన స్థితిని సూచించే మూలపద తీవ్రతను నిలుపుతుంది.
- source_word: τοῦ προφήτου
  choice: ఆ ప్రవక్త
  rationale: నిర్దిష్ట ప్రవక్తను సూచిస్తుంది; అతని ప్రవర్తనను సమర్థించకుండా మూలంలోని గుర్తింపును నిలుపుతుంది.
theological_decisions:
- issue: ὑποζύγιονను బిలాము గాడిదగా ప్రధాన పాఠ్యంలో ప్రత్యేకంగా గుర్తించాలా
  choice: ప్రధాన పాఠ్యంలో ‘బరువు మోసే జంతువు’ అనే విస్తృత పదాన్ని ఉంచడం
  alternative: గాడిద
  rationale: సంఖ్యాకాండము 22 నేపథ్యం గాడిదను స్పష్టంగా గుర్తించినా, గ్రీకు పాఠ్యం ఇక్కడ సాధారణమైన ὑποζύγιον పదాన్ని వాడుతుంది; ప్రత్యేక గుర్తింపును పాదటిప్పణిలో ఇస్తుంది.
- issue: ἐν ἀνθρώπου φωνῇలో ἀνθρώπουను ఎలా అనువదించాలి
  choice: మానవ
  alternative: మనిషి యొక్క / పురుషుని
  rationale: ఇక్కడ వ్యత్యాసం జంతువుకు, మానవునికి మధ్య ఉంది; మగవారికి, ఆడవారికి మధ్య కాదు. అందువల్ల ‘మానవ’ మూల ఉద్దేశాన్ని కచ్చితంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని వ్యంగ్యాత్మక వ్యత్యాసం—మాటలేని జంతువు మాట్లాడి ప్రవక్తను అడ్డుకోవడం—స్పష్టంగా నిలుపబడింది.
