source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: te
  text: అనేకులు వారి విచ్చలవిడి ప్రవర్తనను[a] అనుసరిస్తారు. వారి వల్ల సత్యపు మార్గం[b] దూషించబడుతుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సిగ్గుమాలిన ప్రవర్తనను,’ ‘భోగలాలసతో కూడిన దుర్నడతను’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం సిగ్గులేని, అదుపులేని ప్రవర్తనను సూచిస్తుంది; దానికి తరచుగా లైంగిక భావఛాయ ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సత్యమార్గం’ అని కూడా అనువదించవచ్చు. ఈ పదబంధం క్రైస్తవ విశ్వాసాన్నీ, దానికి అనుగుణమైన జీవన విధానాన్నీ సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘నిందించబడుతుంది,’ ‘దాని గురించి అవమానకరంగా మాట్లాడతారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: అనేకులు
  rationale: సంఖ్యాపరమైన బహుత్వాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξακολουθήσουσιν
  choice: అనుసరిస్తారు
  rationale: ఇతరుల నడవడికను వెంబడించడం లేదా అదే బాటలో నడవడం అనే భావాన్ని, భవిష్యత్ సూచనను సహజంగా నిలుపుతుంది.
- source_word: αὐτῶν
  choice: వారి
  rationale: సందర్భంలోని అబద్ధ బోధకులను సూచించే బహువచన సంబంధార్థక సర్వనామాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ταῖς ἀσελγείαις
  choice: సిగ్గుమాలిన చేష్టలను
  rationale: ἀσέλγεια లోని సిగ్గులేని, అదుపులేని నైతిక ప్రవర్తనను తెలియజేస్తూ, దాని బహువచన రూపాన్ని కూడా నిలుపుతుంది; లైంగిక దుర్నడతకు మాత్రమే భావాన్ని పరిమితం చేయదు.
- source_word: δι’ οὓς
  choice: వారి మూలంగా
  rationale: διά + accusative ఇక్కడ వ్యక్తుల వల్ల కలిగే కారణం లేదా ఫలితాన్ని సూచిస్తుంది; తెలుగులో ఇది సహజమైన కారణార్థక ప్రయోగం.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: సత్యపు మార్గం
  rationale: మూలంలోని మార్గ రూపకాన్ని, సత్యంతో దాని సంబంధాన్ని నిలుపుతూ, క్రైస్తవ విశ్వాసం మరియు జీవన విధానం అనే విస్తృత సూచనను ముందుగానే కుదించదు.
- source_word: βλασφημηθήσεται
  choice: దూషించబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, అపవాదం చేయడం, తిట్టడం, అవమానకరంగా మాట్లాడడం అనే విస్తృత భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ‘సత్యపు మార్గం’ అనే పదబంధపు సూచన మరియు భావబలం
  choice: క్రైస్తవ సత్య విశ్వాసం మరియు దానికి అనుగుణమైన జీవన విధానాన్ని సూచించగల ‘సత్యపు మార్గం’ అనే రూపకాన్ని నిలుపడం.
  alternative: ‘సత్యమార్గం’ లేదా వివరణాత్మకంగా ‘నిజమైన విశ్వాస మార్గం’.
  rationale: మూలంలోని సంబంధ నిర్మాణం మరియు ‘మార్గం’ రూపకాన్ని కాపాడుతుంది; దీనిని కేవలం సిద్ధాంతానికి గానీ, కేవలం జీవనశైలికి గానీ పరిమితం చేయదు.
- issue: ἀσέλγεια యొక్క నైతిక పరిధి
  choice: ‘సిగ్గుమాలిన చేష్టలు’ అని అనువదించి, విస్తృతమైన సిగ్గులేని మరియు అదుపులేని ప్రవర్తనను సూచించడం.
  alternative: ‘విచ్చలవిడితనం,’ ‘భోగలాలసతో కూడిన దుర్నడత,’ లేదా ‘లైంగిక దుర్నడత.’
  rationale: ఈ పదానికి తరచుగా లైంగిక ఛాయ ఉన్నప్పటికీ, దాని అర్థం మరింత విస్తృతమైన నైతిక విచ్చలవిడితనాన్నీ కలిగి ఉంటుంది; ప్రధాన పాఠం ఆ ఉద్రిక్తతను సంకుచితం చేయదు.
- issue: βλασφημέω యొక్క మతపరమైన మరియు సాధారణ దూషణార్థాల మధ్య ఉద్రిక్తత
  choice: ‘దూషించబడుతుంది’ అని విస్తృతంగా అనువదించడం.
  alternative: ‘దేవదూషణకు గురవుతుంది,’ ‘నిందించబడుతుంది,’ లేదా ‘వ్యతిరేకంగా మాట్లాడబడుతుంది.’
  rationale: ఇక్కడ ప్రత్యక్ష కర్మ దేవుడు కాదు, ‘సత్యపు మార్గం’; అందువల్ల మతపరమైన తీవ్రతను పూర్తిగా తొలగించకుండా, దేవునిపైనే దూషణగా భావాన్ని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను కాపాడే శైలి. మూలంలోని రెండు ఖండాల కారణ-ఫలిత సంబంధం, భవిష్యత్ భావం, కర్మణి ప్రయోగం నిలుపబడ్డాయి.
