revisions:
- from: అనేకులు వారి సిగ్గుమాలిన చేష్టలను[a] అనుసరిస్తారు. వారి మూలంగా సత్యపు మార్గం[b] దూషించబడుతుంది[c].
  to: అనేకులు వారి విచ్చలవిడి ప్రవర్తనను[a] అనుసరిస్తారు. వారి వల్ల సత్యపు మార్గం[b] దూషించబడుతుంది[c].
  rationale: The revision strengthens the rendering of ἀσελγείαις from potentially trivial ‘improper antics’ to unrestrained conduct, improves the idiomatic causal expression, and makes the alternative wording in footnote c natural Telugu. It retains the source’s ambiguity concerning the precise scope of the conduct and the referential breadth of ‘the way of truth.’
