revisions:
- from: వారు తిన్నని మార్గాన్ని విడిచిపెట్టి దారితప్పారు; బోసోరు కుమారుడైన బిలాము మార్గాన్ని అనుసరించారు.[a] అతడు అధర్మం వల్ల వచ్చే కూలిని ప్రేమించాడు.
  to: వారు తిన్నని మార్గాన్ని విడిచిపెట్టి, బోసోరు[a] కుమారుడైన బిలాము మార్గాన్ని అనుసరించి దారితప్పారు. అతడు అధర్మం ద్వారా వచ్చే కూలిని ప్రేమించాడు.
  rationale: The revision restores the dependent participial relationship between following Balaam’s way and going astray, while retaining the source’s moral-path imagery, the SBLGNT name form ‘బోసోరు,’ and the familiar Old Testament form in a precisely anchored footnote. It also clarifies the idiomatic relationship in ‘wages of unrighteousness’ without adding theological interpretation.
