id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: te
  text: వారు తిన్నని మార్గాన్ని విడిచిపెట్టి, బోసోరు[a] కుమారుడైన బిలాము మార్గాన్ని అనుసరించి దారితప్పారు. అతడు అధర్మం ద్వారా వచ్చే కూలిని ప్రేమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పాఠంలో పేరు ‘బోసోరు’గా ఉంది; పాత నిబంధనలో బిలామును సాధారణంగా ‘బెయోరు కుమారుడు’ అని పిలుస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπόντες
  choice: విడిచిపెట్టి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే aorist participle భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఉద్దేశపూర్వకంగా మార్గాన్ని వదిలిన భావం నిలుస్తుంది.
- source_word: εὐθεῖαν ὁδὸν
  choice: తిన్నని మార్గాన్ని
  rationale: ‘నేరుగా/తిన్నగా ఉన్న మార్గం’ అనే స్పష్టమైన మార్గ రూపకాన్ని నిలుపుతుంది; కేవలం ‘సరైన మార్గం’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: ἐπλανήθησαν
  choice: దారితప్పారు
  rationale: బాహ్య కర్తను అనవసరంగా సూచించకుండా నైతికంగా మార్గం తప్పిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξακολουθήσαντες
  choice: అనుసరించారు
  rationale: ముందున్న ప్రధాన వాక్యంతో సమన్వయంగా తెలుగులో సహజంగా ఉండే రూపం; బిలాము మార్గం వెంట వెళ్లిన భావాన్ని కాపాడుతుంది.
- source_word: τῇ ὁδῷ
  choice: మార్గాన్ని
  rationale: వచనమంతటా ఉన్న నైతిక మార్గ రూపకాన్ని కొనసాగిస్తుంది.
- source_word: τοῦ Βαλαὰμ
  choice: బిలాము
  rationale: తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన పేరురూపం.
- source_word: τοῦ Βοσὸρ
  choice: బోసోరు కుమారుడైన
  rationale: గ్రీకు పాఠంలోని Βοσόρ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, పునరుక్త షష్ఠీ విభక్తి నిర్మాణాన్ని సహజమైన వంశసూచక తెలుగుగా వ్యక్తం చేస్తుంది.
- source_word: μισθὸν ἀδικίας
  choice: అధర్మం వల్ల వచ్చే కూలిని
  rationale: μισθός యొక్క ప్రతిఫలం/చెల్లింపు భావాన్నీ, ἀδικία యొక్క నైతిక బరువునీ స్పష్టంగా నిలుపుతుంది; సంబంధాన్ని అసహజమైన నామపదబంధంగా చేయదు.
- source_word: ἠγάπησεν
  choice: ప్రేమించాడు
  rationale: ἀγαπάω అనే క్రియను నేరుగా ప్రతిబింబిస్తూ, అక్రమ లాభంపై అతని గాఢమైన మక్కువను నిలుపుతుంది.
theological_decisions:
- issue: εὐθεῖαν ὁδὸν / τῇ ὁδῷ లోని నైతిక మార్గ రూపకం
  choice: ‘తిన్నని మార్గం’ మరియు ‘బిలాము మార్గం’ అనే మార్గ భాషను నిలుపుట
  alternative: ‘సరైన జీవన విధానం’ లేదా ‘సత్యమార్గం’
  rationale: గ్రీకు పాఠంలోని స్పష్టమైన మార్గ రూపకాన్ని కాపాడి, ‘సత్యం’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా ఉంటుంది.
- issue: Βοσόρ అనే పేరురూపం
  choice: ప్రధాన పాఠంలో ‘బోసోరు’; పాదసూచికలో ‘బెయోరు’
  alternative: ప్రధాన పాఠంలోనే ‘బెయోరు’
  rationale: SBLGNT పాఠాన్ని ప్రత్యక్షంగా ప్రతిబింబిస్తూ, పాత నిబంధనలోని సుపరిచిత పేరురూపాన్ని పాఠకునికి పాదసూచిక ద్వారా తెలియజేస్తుంది.
- issue: ἐξακολουθήσαντες కు ప్రధాన క్రియతో ఉన్న సంబంధం
  choice: అర్ధవిరామంతో ‘అనుసరించారు’ అని సమన్వయ వాక్యంగా సహజీకరించడం
  alternative: ‘అనుసరించడం వల్ల దారితప్పారు’ లేదా ‘అనుసరించి దారితప్పారు’
  rationale: aorist participle యొక్క attendant లేదా means భావాల మధ్య ఉన్న కొంత అనిశ్చితిని ఒకే కారణార్థక వివరణగా ఖరారు చేయకుండా, తెలుగు వాక్యాన్ని సహజంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘తిన్నని మార్గం’ అనే రూపకం మూలంలోని concrete path imageryని నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత పేరుకు వెంటనే ఉంచబడింది.
