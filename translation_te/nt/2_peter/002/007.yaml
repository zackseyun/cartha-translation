id: 2PE.2.7
reference: 2 Peter 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: te
  text: నీతి నియమాలను లెక్కచేయని వారి విచ్చలవిడి[c] ప్రవర్తన[b]వల్ల తీవ్రంగా బాధపడుతున్న[a] నీతిమంతుడైన లోతును కూడా ఆయన రక్షించాడు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అణచివేయబడుతున్న’ లేదా ‘తీవ్ర వేదనకు గురవుతున్న.’
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రవర్తన’కు ‘నడవడి’ లేదా ‘జీవన విధానం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘విచ్చలవిడి’ అని అనువదించిన పదం సిగ్గులేని ఇంద్రియాసక్తిని, నైతిక మితిమీరుదలను సూచిస్తుంది; ‘కామాతురమైన’ లేదా ‘దురాచారపూరితమైన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: కూడా
  rationale: ముందటి వాక్యంలో కొనసాగుతున్న దేవుని రక్షణ కార్యాల వరుసకు సహజమైన అనుసంధానాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δίκαιον
  choice: నీతిమంతుడైన
  rationale: లోతు గురించి మూలపాఠం ఇచ్చే స్పష్టమైన నైతిక అంచనాను తగ్గించకుండా, సహజమైన ఆధునిక తెలుగు పదంతో నిలుపుతుంది.
- source_word: Λὼτ
  choice: లోతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: καταπονούμενον
  choice: తీవ్రంగా బాధపడుతున్న
  rationale: వర్తమాన కర్మణి అసమాపక క్రియ తెలియజేసే నిరంతరమైన, తీవ్రమైన వేదనను సహజంగా వ్యక్తం చేస్తుంది; హింసించబడటం లేదా అణచివేయబడటం అనే సాధ్యమైన ఛాయలను పాదసూచికలో ఉంచింది.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: ప్రవర్తనవల్ల
  rationale: లోతు బాధకు కారణాన్ని సూచించే ὑπόను ‘వల్ల’తో, ἀναστροφήను జీవన నడవడి లేదా ప్రవర్తన అనే అర్థంలో సంక్షిప్తంగా అందిస్తుంది.
- source_word: τῶν ἀθέσμων
  choice: నీతి నియమాలను లెక్కచేయని వారి
  rationale: ἄθεσμοςలోని స్థాపితమైన నీతి నియమాలను ధిక్కరించే భావాన్ని, కేవలం సాధారణ ‘దుష్టులు’ అని మార్చకుండా, సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν ἀσελγείᾳ
  choice: విచ్చలవిడి
  rationale: ἀσέλγεια సూచించే సిగ్గులేని నైతిక, ఇంద్రియపరమైన మితిమీరుదలను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దాని అర్థ పరిధిని పాదసూచిక వివరిస్తుంది.
- source_word: ἐρρύσατο
  choice: ఆయన రక్షించాడు
  rationale: ῥύομαι యొక్క ప్రమాదం లేదా దుష్పరిస్థితి నుంచి విడిపించి కాపాడే భావాన్ని స్పష్టంగా అందిస్తుంది; కర్తను ముందటి సందర్భం నుంచి ‘ఆయన’గా వ్యక్తం చేసింది.
theological_decisions:
- issue: ఆదికాండంలోని లోతు కథనంతో పోల్చినప్పుడు అతని నైతిక వర్ణన
  choice: ‘నీతిమంతుడైన లోతు’ అనే మూలపాఠపు స్పష్టమైన అంచనాను యథాతథంగా నిలుపడం
  alternative: లోతు చర్యలపై కలిగే వ్యాఖ్యాన అసౌకర్యం కారణంగా విశేషణాన్ని బలహీనపరచడం లేదా తొలగించడం
  rationale: గ్రీకు పాఠం లోతును δίκαιος అని నేరుగా వర్ణిస్తుంది. అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా, పాఠం ఇచ్చే అంచనానే నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలిలో ఉంది. మూలవాక్యం ముందటి వచనంతో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదాల వెంటనే పెట్టబడ్డాయి.
