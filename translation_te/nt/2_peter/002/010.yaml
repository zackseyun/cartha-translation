id: 2PE.2.10
reference: 2 Peter 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: te
  text: ముఖ్యంగా, అపవిత్రతను కోరే దురాశతో[a] శరీరాన్ని అనుసరించి నడిచేవారినీ, ఆధిపత్యాన్ని[b] తృణీకరించేవారినీ ఆయన శిక్షిస్తాడు. వారు తెగింపుగలవారు, మొండివారు; మహిమగల వారిని[c] దూషిస్తూ ఏమాత్రం వణకరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అపవిత్రమైన దురాశతో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రభుత్వాన్ని” లేదా “అధికారాన్ని.” ఇక్కడ ఎవరికి చెందిన ఆధిపత్యమో గ్రీకు పాఠం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: c
    text: “మహిమగల వారు” అనే పదం బహుశా మహిమగల పరలోక జీవులను సూచిస్తుంది; “దేవదూతలు” కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: ముఖ్యంగా
  rationale: మునుపటి వాక్యంలో చెప్పిన తీర్పులో ఈ వర్గాన్ని ప్రత్యేకంగా ఎత్తిచూపుతుంది.
- source_word: ὀπίσω σαρκὸς
  choice: శరీరాన్ని అనుసరించి
  rationale: σάρξ అనే కీలక రూపకాన్ని ‘పాపస్వభావం’ అని ముందుగానే వ్యాఖ్యానించకుండా నిలుపుతూ, వెంబడించడం అనే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: అపవిత్రతను కోరే దురాశతో
  rationale: ఈ సందర్భంలో ἐπιθυμίαకు ఉన్న చెడు నైతిక భావాన్ని ‘దురాశ’ తెలియజేస్తుంది; μιασμόςను ‘అపవిత్రత’గా స్పష్టంగా ఉంచుతుంది.
- source_word: πορευομένους
  choice: నడిచేవారిని
  rationale: జీవన ప్రవర్తనను సూచించే క్రియారూపాన్ని నిలుపుతుంది; ‘అనుసరించి’తో కలిసి తెలుగులో సహజంగా ఉంటుంది.
- source_word: κυριότητος
  choice: ఆధిపత్యాన్ని
  rationale: ప్రభుత్వ వ్యవస్థను మాత్రమే సూచించేలా కాకుండా, lordship/dominion అనే విస్తృత భావాన్ని, నిర్దిష్ట సూచిత వ్యక్తిని నిర్ణయించకుండా నిలుపుతుంది.
- source_word: καταφρονοῦντας
  choice: తృణీకరించేవారిని
  rationale: కేవలం అవిధేయతకన్నా తీవ్రమైన ధిక్కారం, అలక్ష్యం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: Τολμηταί
  choice: తెగింపుగలవారు
  rationale: సందర్భంలోని ప్రతికూలమైన సాహసాన్ని, దుస్సాహస భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: αὐθάδεις
  choice: స్వేచ్ఛాపరులు
  rationale: ఇతరులను లెక్కచేయకుండా తమ ఇష్టానుసారం నడుచుకునే మొండి స్వభావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: δόξας
  choice: మహిమాన్వితులను
  rationale: మహిమగల పరలోక జీవులను సూచించే అవకాశం ఉన్నప్పటికీ, వారిని ‘దేవదూతలు’ అని నిర్దిష్టం చేయకుండా గ్రీకు బహువచనంలోని అస్పష్టతను నిలుపుతుంది.
- source_word: οὐ τρέμουσιν, βλασφημοῦντες
  choice: దూషిస్తూ ఏమాత్రం వణకరు
  rationale: τρέμωలోని స్పష్టమైన వణుకు రూపకాన్ని నిలుపుతూ, సమకాలిక క్రియను సూచించే గ్రీకు అసమాపక క్రియను సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κυριότης ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: నిర్దిష్టం చేయని ఆధిపత్యం
  alternative: ప్రభువు యొక్క ప్రభుత్వం; దేవదూతల ఆధిపత్యం
  rationale: ఈ పదం అధికారాన్ని, ప్రభుత్వాన్ని లేదా ఆధిపత్యాన్ని సూచించగలదు. వాక్యం దాని సూచితాన్ని స్పష్టంగా నిర్ధారించనందున అనువాదం క్రీస్తును గానీ దేవదూతలను గానీ నేరుగా చేర్చదు.
- issue: δόξας ఎవరిని సూచిస్తుంది?
  choice: మహిమాన్వితులు అని నిర్దిష్ట గుర్తింపును తెరిచి ఉంచడం
  alternative: దేవదూతలు; మహిమగల పరలోక జీవులు; మహిమలు
  rationale: తరువాతి వచనంలో దేవదూతల ప్రస్తావన పరలోక జీవులనే సూచించే అవకాశాన్ని బలపరుస్తుంది; అయినా ఇక్కడి పదం δόξας కాబట్టి ప్రధాన పాఠంలో ‘దేవదూతలు’ అని అర్థాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యం మునుపటి వచనంపై ఆధారపడిన కర్మవాచక భాగంగా మొదలవుతుంది; తెలుగులో సంపూర్ణ వాక్యంగా చదవడానికి మునుపటి సందర్భంలోని ‘ఆయన శిక్షిస్తాడు’ అనేది పునరుద్ధరించబడింది. చివరి రెండు విశేషణాల వేగవంతమైన, నిందాత్మక ధోరణిని అర్ధవిరామంతో నిలిపాం.
