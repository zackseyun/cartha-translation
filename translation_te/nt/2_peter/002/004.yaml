  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: te
  text: ఎందుకంటే, పాపం చేసిన దేవదూతలను దేవుడు కనికరించకుండా, వారిని టార్టరస్‌లో పడవేసి[a], గాఢాంధకారపు సంకెళ్లలో బంధించి, తీర్పు కోసం కాపాడబడుతూ ఉండేలా చేసినట్లయితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నరకంలో పడవేసి.” గ్రీకు క్రియ ప్రత్యేకంగా టార్టరస్‌కు పంపడాన్ని సూచిస్తుంది; అందువల్ల ప్రధాన పాఠంలో మరింత నిర్దిష్టమైన పదాన్ని ఉంచాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφείσατο
  choice: విడిచిపెట్టకుండా
  rationale: శిక్షను నిలిపివేయకుండా ఉండడం అనే న్యాయసంబంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: దేవదూతలు పాపం చేసినప్పుడు
  rationale: అరిస్ట్ కృదంతంలోని సంఘటనాత్మక, కాలసంబంధ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ταρταρώσας
  choice: టార్టరస్‌లో పడవేసి
  rationale: అరుదైన గ్రీకు క్రియ ప్రత్యేకంగా టార్టరస్‌కు పంపడాన్ని సూచిస్తుంది; సాధారణమైన ‘నరకం’ అనే పదంతో దాని ప్రత్యేక చిత్రణను కలిపివేయలేదు.
- source_word: σειραῖς ζόφου
  choice: గాఢాంధకారపు సంకెళ్లకు
  rationale: σειραῖς అనే పదంలోని ‘సంకెళ్లు’ భావాన్నీ, ζόφος‌లోని భారమైన, భయానక అంధకార భావాన్నీ కాపాడుతుంది.
- source_word: παρέδωκεν
  choice: అప్పగించినట్లయితే
  rationale: న్యాయపరమైన నిర్బంధానికి అప్పగించడం అనే భావాన్ని వ్యక్తం చేస్తూ, వాక్యంలోని షరతు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: εἰς κρίσιν
  choice: తీర్పు కోసం
  rationale: ఇది కేవలం శిక్షావిధిని కాక రాబోయే తీర్పును సూచిస్తుంది.
- source_word: τηρουμένους
  choice: కాపాడబడేలా
  rationale: తీర్పు వరకు కొనసాగుతున్న నిర్బంధ స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఎవరు కాపాడుతున్నారనే వివరాన్ని అదనంగా చేర్చదు.
theological_decisions:
- issue: ταρταρώσας అనే పదానికి తరువాతి కాలపు సిద్ధాంతార్థాలను జోడించకుండా అనువదించడం
  choice: టార్టరస్‌లో పడవేసి
  alternative: నరకంలో పడవేసి
  rationale: మూలంలోని ప్రత్యేక గ్రీకు పాతాళ-తీర్పు చిత్రణను నిలుపుతూ, దానిని విస్తృతమైన ‘నరకం’ భావంతో సమానంగా చేయదు.
- issue: టార్టరస్, అంధకారపు సంకెళ్లు, తీర్పు కోసం కాపాడబడడం—వీటి పరస్పర సంబంధం
  choice: టార్టరస్‌లో పడవేసి, తీర్పు కోసం కాపాడబడేలా వారిని గాఢాంధకారపు సంకెళ్లకు అప్పగించినట్లయితే
  alternative: గాఢాంధకారపు సంకెళ్లలో వారిని టార్టరస్‌లో పడవేసి తీర్పు వరకు నిర్బంధించినట్లయితే
  rationale: సంకెళ్లు సాధనమా, స్థితియా, రూపకమా అనే విషయాన్ని తేల్చకుండా, గ్రీకు వాక్యంలోని కుదించిన చిత్రణను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. ఇది తరువాతి వచనాలతో కొనసాగుతున్న షరతు వాక్యం కాబట్టి చివరలో అసంపూర్ణతను సూచించే విరామచిహ్నం ఉంచబడింది. పాదసూచిక [a] టార్టరస్ పదం వద్ద, [b] పాఠాంతరమున్న ‘సంకెళ్లు’ వద్ద ఉంచబడ్డాయి.
