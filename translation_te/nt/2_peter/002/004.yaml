review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains Tartarus and the textual-variant anchor, but “విడిచిపెట్టకుండా” does not convey God’s not sparing the angels, and “కాపాడబడేలా” weakens the ongoing passive sense of τηρουμένους. The phrasing with persons being handed “to chains” is also unnatural in Telugu.
  naturalness: The proposed revision uses idiomatic modern Telugu while retaining the verse’s continuing conditional syntax and its compressed judicial imagery.
  terminology: “టార్టరస్” properly preserves ταρταρώσας without importing the broader later sense of “hell.” “గాఢాంధకారపు సంకెళ్లు” adequately renders σειραῖς ζόφου. “కనికరించకుండా” naturally conveys οὐκ ἐφείσατο in this punitive context.
  issues:
  - severity: medium
    issue: “విడిచిపెట్టకుండా” for οὐκ ἐφείσατο
    rationale: This normally means ‘without abandoning/leaving,’ whereas φείδομαι here means ‘spare’ or ‘show mercy.’
  - severity: medium
    issue: “కాపాడబడేలా” for τηρουμένους
    rationale: The wording is prospective/resultative (‘so that they may be kept’) rather than expressing the present, continuing passive state of being kept pending judgment.
  - severity: low
    issue: “సంకెళ్లకు అప్పగించినట్లు” is awkward Telugu
    rationale: People are not naturally ‘handed over to chains’ in Telugu. Rendering the confinement directly communicates the Greek judicial-custodial imagery naturally, without resolving the precise relationship of the chains to Tartarus.
