id: 2PE.2.8
reference: 2 Peter 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: te
  text: ఎందుకంటే, ఆ నీతిమంతుడు వారి మధ్య నివసిస్తూ, తాను చూసినదాని వల్లను విన్నదాని వల్లను, వారి ధర్మవిరుద్ధమైన పనులచేత రోజురోజుకూ తన నీతిమంతమైన ప్రాణాన్ని వేదించుకుంటూ ఉండేవాడు—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘చూసినదాని వల్లను విన్నదాని వల్లను’ అనే మాటలు వాక్యారంభంలో ఉన్నాయి; ‘ధర్మవిరుద్ధమైన పనులచేత’ అనే మాట తరువాత వస్తుంది. ఈ రెండింటి ఖచ్చితమైన అనుసంధానం కొంత సౌలభ్యంగా ఉంది. అందువల్ల, ‘తాను చూసిన, విన్న వారి ధర్మవిరుద్ధమైన పనులచేత తన నీతిమంతమైన ప్రాణాన్ని రోజురోజుకూ వేదించుకుంటూ ఉండేవాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: తాను చూసినవాటి వల్ల, విన్నవాటి వల్ల
  rationale: ఈ రెండు దత్తి రూపాలు చూపు, వినికిడి ద్వారా లోతైన బాధ కలిగిందనే భావాన్ని ఇస్తాయి. తెలుగులో సహజంగా ఉండేందుకు గ్రహించిన విషయాలుగా వ్యక్తపరిచాం.
- source_word: ὁ δίκαιος
  choice: ఆ నీతిమంతుడు
  rationale: విశేషణం నామవాచకంగా వాడబడి, ముందటి వచనంలోని లోతును తిరిగి సూచిస్తుంది. ‘ఆ’ ఆ పూర్వసూచనను స్పష్టం చేస్తుంది.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: వారి మధ్య నివసిస్తూ
  rationale: వారి మధ్య కొనసాగుతూ జీవించడాన్ని తెలిపే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగు కృదంత నిర్మాణంతో నిలిపాం.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: రోజురోజుకూ
  rationale: నిరంతరంగా, పునరావృతంగా కొనసాగిన బాధను తెలిపే గ్రీకు నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: ψυχὴν δικαίαν
  choice: తన నీతిగల అంతరంగాన్ని
  rationale: ఇక్కడ ψυχή లోతు యొక్క అంతరంగ వ్యక్తిత్వం లేదా అంతరాత్మిక జీవితం వైపు సూచిస్తుంది. ‘అంతరంగం’ శరీరానికి వేరైన ఒక పదార్థం గురించిన సిద్ధాంతాన్ని అనవసరంగా దిగుమతి చేయకుండా ఆ భావాన్ని అందిస్తుంది; ‘తన’ సందర్భం నుంచి స్పష్టమవుతుంది.
- source_word: ἀνόμοις ἔργοις
  choice: ధర్మవిరుద్ధమైన వారి పనులతో
  rationale: చట్టం లేదా ధర్మాన్ని లెక్కచేయని నైతిక స్వభావాన్ని ‘ధర్మవిరుద్ధమైన’ నిలుపుతుంది. దత్తి రూపంలోని సాధన/కారణ భావాన్ని ‘పనులతో’ వ్యక్తపరచాం; ‘వారి’ సందర్భం నుంచి పూరించబడింది.
- source_word: ἐβασάνιζεν
  choice: హింసించుకుంటూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన చర్యను సూచిస్తుంది; కర్త తన స్వంత అంతరంగాన్ని హింసించాడనే సకర్మక నిర్మాణాన్ని తెలుగు ఆత్మార్థక రూపం సహజంగా నిలుపుతుంది. ఇది కేవలం బాధపడటం కంటే మూలపదంలోని తీవ్రతను బలంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ψυχή సూచించే మానవ స్వరూప భావం
  choice: ‘అంతరంగం’ అని, లోతు యొక్క అంతరంగ వ్యక్తిత్వం/జీవితాన్ని సూచించేలా అనువదించాం.
  alternative: ‘ప్రాణం’ లేదా ‘ఆత్మ’
  rationale: ఈ వచనం శరీరం–ఆత్మ నిర్మాణంపై సాంకేతిక సిద్ధాంతం చెప్పడం లేదు; లోతు అనుభవించిన నైతిక అంతర్వేదనను చెబుతోంది. ‘అంతరంగం’ ఆ భావాన్ని సిద్ధాంతపరంగా అతిగా నిర్ణయించకుండా నిలుపుతుంది.
- issue: ἐβασάνιζεν యొక్క కర్తృవాచక తీవ్రత
  choice: ‘తన ... అంతరంగాన్ని ... హింసించుకుంటూ ఉండేవాడు’ అని కర్తృవాచక/ఆత్మార్థక భావాన్ని నిలిపాం.
  alternative: ‘అతని అంతరంగం హింసకు గురయ్యేది’ లేదా ‘అతడు బాధపడేవాడు’
  rationale: గ్రీకులో లోతే కర్తగా ఉండి తన నీతిగల ψυχήను కర్మగా తీసుకుంటాడు. దాన్ని కేవలం నిష్క్రియ బాధగా మార్చకుండా మూలంలోని ఉద్దేశపూర్వకంగా వినిపించే ఉద్రిక్త నిర్మాణాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని పునరుక్త ‘నీతిమంతుడు/నీతిగల’ భావాన్ని నిలిపాం. చివరి దీర్ఘవిరామం తరువాతి సందర్భంతో వాక్య ప్రవాహం కొనసాగుతుందని సూచిస్తుంది.
