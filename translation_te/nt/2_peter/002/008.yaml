revisions:
- from: ఎందుకంటే, ఆ నీతిమంతుడు వారి మధ్య నివసిస్తూ, తాను చూసినవాటి వల్ల, విన్నవాటి వల్ల, ధర్మవిరుద్ధమైన వారి పనులతో తన నీతిగల అంతరంగాన్ని రోజురోజుకూ హింసించుకుంటూ ఉండేవాడు—[a]
  to: ఎందుకంటే, ఆ నీతిమంతుడు వారి మధ్య నివసిస్తూ, తాను చూసినదాని వల్లను విన్నదాని వల్లను, వారి ధర్మవిరుద్ధమైన పనులచేత రోజురోజుకూ తన నీతిమంతమైన ప్రాణాన్ని వేదించుకుంటూ ఉండేవాడు—[a]
  rationale: The revision retains the Greek word order’s emphasis and all its key elements, while using natural Telugu coordination for sight and hearing. It preserves the imperfect, continuing force with ‘రోజురోజుకూ ... వేదించుకుంటూ ఉండేవాడు’ and preserves the active/reflexive tension without forcing a doctrinal sense on ψυχή. The footnote now explains the genuine syntactic flexibility without erasing either of the two instrumental/circumstantial phrases.
