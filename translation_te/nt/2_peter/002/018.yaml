source:
  edition: SBLGNT
  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: te
  text: ఎందుకంటే, వారు డాంబికమైన వ్యర్థ మాటలు పలుకుతూ, శరీర సంబంధమైన కోరికలతోను అదుపులేని కాముకత్వంతోను, తప్పుదారిలో జీవించేవారి నుండి కష్టంగా తప్పించుకుంటున్నవారిని ఎర వేస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇప్పుడిప్పుడే తప్పించుకుంటున్నవారిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέρογκα
  choice: డాంబికమైన
  rationale: అతిశయంగా ఉబ్బిపోయిన, గొప్పలు చెప్పే స్వభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘మాటలు’ అనేది φθεγγόμενοι వల్ల సందర్భానుసారంగా స్పష్టమవుతుంది.
- source_word: ματαιότητος
  choice: వ్యర్థ
  rationale: వారి మాటల్లో సారం లేకపోవడం, నిష్ఫలత్వం అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: φθεγγόμενοι
  choice: మాటలు పలుకుతూ
  rationale: ప్రలోభపెట్టే విధానాన్ని సూచించే వర్తమాన కృదంత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δελεάζουσιν
  choice: ఎర వేస్తారు
  rationale: ఎరతో ఆకర్షించి చిక్కించుకోవడం అనే గ్రీకు క్రియలోని బలమైన రూపకాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: శరీర సంబంధమైన కోరికలతో
  rationale: ἐνను సాధనం లేదా మార్గంగా చూపుతూ, σάρξ రూపకాన్ని ‘పాప స్వభావం’ అని సిద్ధాంతీకరించకుండా కాపాడుతుంది.
- source_word: ἀσελγείαις
  choice: కాముక ప్రవర్తనలతో
  rationale: అదుపులేని ఇంద్రియాసక్తితో కూడిన ప్రవర్తనను సూచిస్తుంది; గ్రీకు బహువచన భావాన్నీ నిలుపుతుంది.
- source_word: ὀλίγως
  choice: కేవలం
  rationale: పాఠంలో ఉన్న పదాన్ని ‘ఇప్పుడిప్పుడే’ అనే కాలార్థంతో కూడా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠంలో తప్పించుకోవడం ఇంకా పరిమితమైన లేదా ఆరంభ దశలో ఉన్న భావాన్ని ఇస్తుంది.
- source_word: ἀποφεύγοντας
  choice: తప్పించుకుంటున్నవారిని
  rationale: తప్పించుకునే ప్రక్రియ కొనసాగుతోందనే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: తప్పుదారిలో జీవించేవారి నుండి
  rationale: πλάνηలో ఉన్న తప్పుదారి లేదా మోసపు స్థితినీ, ἀναστρέφομαιలోని జీవనవిధాన భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నైతిక సందర్భంలో σάρξ అర్థం
  choice: శరీర సంబంధమైన
  alternative: శరీర కోరికలు; పాప స్వభావపు కోరికలు
  rationale: గ్రీకు రూపకాన్ని నిలుపుతూ, ‘పాప స్వభావం’ వంటి వ్యవస్థీకృత సిద్ధాంత పదాన్ని మూలంలోకి చేర్చదు.
- issue: ప్రలోభానికి గురయ్యేవారి స్థితి
  choice: తప్పుదారిలో జీవించేవారి నుండి కేవలం తప్పించుకుంటున్నవారు
  alternative: ఇప్పుడిప్పుడే తప్పించుకుంటున్నవారు; కొద్దిగా తప్పించుకున్నవారు
  rationale: వారి తప్పించుకోవడం పూర్తయిందా లేదా రక్షణాత్మక అర్థంలో నిజమైనదా అన్నదాన్ని నిర్ణయించకుండా, మూలంలోని అనిశ్చితి మరియు సున్నితమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: ἀσελγείαιςకు ἐπιθυμίαις σαρκὸςతో సంబంధం
  choice: కోరికలతోనూ కాముక ప్రవర్తనలతోనూ
  alternative: కాముకమైన శరీర సంబంధ కోరికలతో
  rationale: రెండు దత్తివాచక పదబంధాలను సమాంతర సాధనాలుగా చదివే వీలును ప్రధాన పాఠంలో నిలుపుతుంది; రెండవది మొదటిదాన్ని మరింత నిర్వచిస్తుందని కూడా అర్థం చేసుకోవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ఎర వేస్తారు’ అనే పదబంధం δελεάζουσινలోని ఎరతో చిక్కించుకునే రూపకాన్ని జీవంగా ఉంచుతుంది. వాక్యాంత విరామచిహ్నం ప్రచురణ తెలుగు శైలికి అనుగుణంగా పెట్టబడింది.
