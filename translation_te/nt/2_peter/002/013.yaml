id: 2PE.2.13
reference: 2 Peter 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: te
  text: అనీతికి తగిన ప్రతిఫలాన్ని అనుభవిస్తూ[b], పట్టపగలే విలాసభోగాల్లో మునగడాన్ని సుఖంగా భావిస్తారు. వారు మరకలూ కళంకాలూ; మీతో కలిసి విందు చేస్తూ తమ మోసాల్లో[a] మునిగి తేలుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని ప్రతుల్లో ‘మోసాల్లో’ అనే పదానికి బదులు ‘ప్రేమవిందుల్లో’ అని ఉంది: ‘మీతో కలిసి విందు చేస్తూ తమ ప్రేమవిందుల్లో మునిగి తేలుతారు.’'
    reason: textual_variant
  - marker: b
    text: లేదా ‘తాము చేసిన తప్పుకు ప్రతిఫలాన్ని పొందుతూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικούμενοι
  choice: అనుభవిస్తూ
  rationale: ఈ సందర్భంలో ఇది ఇతరుల చేత అన్యాయం పొందడాన్ని మాత్రమే కాక, తమ దుష్కార్యాలకు తగిన పర్యవసానాన్ని పొందడాన్ని సూచిస్తుంది. తరువాతి ‘జీతం’ అనే పదంతో కలిసి ఈ భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: μισθὸν ἀδικίας
  choice: అనీతికి వచ్చే జీతాన్ని
  rationale: μισθός లోని ‘జీతం/ప్రతిఫలం’ భావాన్నీ, ἀδικία లోని నైతిక దుష్టత్వ భావాన్నీ నిలుపుతుంది. మూలంలోని సంక్షిప్తమైన, వ్యంగ్యాత్మక ప్రతిఫల చిత్రణను అనవసరంగా ‘శిక్ష’ అని స్పష్టీకరించదు.
- source_word: ἡδονὴν ἡγούμενοι
  choice: సుఖమని వారు భావిస్తారు
  rationale: ἡγέομαι యొక్క ‘అని పరిగణించు/భావించు’ అర్థాన్ని, ἡδονή యొక్క ‘సుఖం’ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: పట్టపగలే విలాసభోగాల్లో మునగడం
  rationale: τρυφή సూచించే స్వైరమైన విలాసాసక్తిని, ἐν ἡμέρᾳ సూచించే బహిరంగమైన సిగ్గులేని ప్రవర్తనను ‘పట్టపగలే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: σπίλοι καὶ μῶμοι
  choice: మరకలు, కళంకాలు
  rationale: రెండు పదాల్లోని అపవిత్రత, నైతిక నింద అనే జతచిత్రాన్ని సులభంగా అర్థమయ్యే గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐντρυφῶντες
  choice: మునిగి తేలుతారు
  rationale: స్వైరంగా ఆనందిస్తూ భోగించడమనే భావాన్ని సహజమైన తెలుగు నుడికారంతో వ్యక్తం చేసి, వాక్యంలోని విలాసాసక్తి ధోరణిని కొనసాగిస్తుంది.
- source_word: ἀπάταις αὐτῶν
  choice: తమ మోసాల్లో
  rationale: SBLGNT లోని ἀπάταις పాఠాన్ని అనుసరించి, అబద్ధ బోధకుల మోసపూరిత ప్రవర్తనను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: συνευωχούμενοι ὑμῖν
  choice: మీతో కలిసి విందు చేస్తూ
  rationale: కలిసి విందు చేయడం అనే క్రియార్థాన్నీ, ప్రధాన చర్యతో సమకాలీనమైన కృదంత భావాన్నీ నిలుపుతుంది; అది ఏ ప్రత్యేక భోజనమో ప్రధాన పాఠంలో నిర్ణయించదు.
theological_decisions:
- issue: ἀπάταις / ἀγάπαις పాఠాంతరం
  choice: ప్రధాన పాఠంలో ἀπάταις ను ‘తమ మోసాల్లో’ అని అనువదించడం
  alternative: ἀγάπαις ను ‘తమ ప్రేమవిందుల్లో’ అని అనువదించడం
  rationale: అందించిన SBLGNT మూలపాఠంలో ἀπάταις ఉంది; ఇది అబద్ధ బోధకుల మోసాన్ని తెలిపే సందర్భంతో సరిపోతుంది. అర్థపూర్ణమైన ἀγάπαις పాఠాంతరాన్ని పాదసూచికలో భద్రపరచడం ద్వారా పాఠ్య, వ్యాఖ్యాన ప్రాధాన్యాన్ని నిలుపుతున్నాం.
- issue: ἀδικούμενοι μισθὸν ἀδικίας లో ప్రతిఫల భావం
  choice: ‘అనీతికి వచ్చే జీతాన్ని అనుభవిస్తూ’ అని, పర్యవసానాన్ని సూచిస్తూ అనువదించడం
  alternative: ‘అన్యాయం పొందుతూ’ అని క్రియను నిష్క్రియార్థంలో మాత్రమే అనువదించడం
  rationale: వ్యాకరణ రూపంలో నిష్క్రియ భావం ఉన్నప్పటికీ, సందర్భంలో తమ అనీతికి తగిన ప్రతిఫలం పొందడమే ప్రధాన భావం. అయితే ‘శిక్ష’ అనే పదాన్ని చేర్చి మూలంలోని ఉద్దేశపూర్వక పదబంధాన్ని అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ధోరణిని పాటించాం. ‘పట్టపగలే’ వారి సిగ్గులేని బహిరంగ భోగాసక్తిని సహజంగా తెలియజేస్తుంది. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గర ఉంచాం.
