revisions:
- from: ఎందుకంటే, నీతి మార్గాన్ని తెలుసుకోకపోవడమే వారికి మేలై ఉండేది; దాన్ని తెలుసుకున్న తర్వాత, తమకు అప్పగించబడిన పవిత్ర ఆజ్ఞ నుండి వెనుదిరగడం కంటే.[a][b]
  to: ఎందుకంటే, వారు నీతి మార్గాన్ని[a] తెలుసుకున్న తర్వాత తమకు అందజేయబడిన[b] పవిత్ర ఆజ్ఞ నుండి వెనుదిరగడం కంటే, ఆ మార్గాన్ని తెలుసుకోకపోవడమే వారికి మేలు అయి ఉండేది.
  rationale: 'The revision restores a standard Telugu comparative structure: ''after knowing ... turning back'' is explicitly set against ''not knowing,'' followed by ''would have been better for them.'' It retains the text''s deliberate theological restraint: genuine knowledge and subsequent reversal are stated, without defining their doctrinal implications. Footnote markers are placed directly after the terms they explain.'
  reviewer_model: gpt-5.6-terra
