id: 2PE.2.21
reference: 2 Peter 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: te
  text: ఎందుకంటే, వారు నీతి మార్గాన్ని[a] తెలుసుకున్న తర్వాత తమకు అందజేయబడిన[b] పవిత్ర ఆజ్ఞ నుండి వెనుదిరగడం కంటే, ఆ మార్గాన్ని తెలుసుకోకపోవడమే వారికి మేలు అయి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీతి మార్గం”ను “నీతియుక్తమైన జీవన మార్గం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అందజేయబడిన”కు “అందించబడిన” లేదా “వారికి అప్పగించబడిన” అనే అనువాదాలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: మేలై ఉండేది
  rationale: ἦνతో కలిసి గతానికి సంబంధించిన తులనాత్మక భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, ‘would have been better’ భావాన్ని ‘మేలై ఉండేది’గా ఇచ్చాం.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: తెలుసుకోకపోవడం / తెలుసుకున్న తర్వాత
  rationale: ఒకే క్రియ పునరావృతిని సాధ్యమైనంతవరకు నిలిపి, నిజమైన పరిచయం లేదా అవగాహనను తెలిపాం; ‘పూర్తిగా తెలుసుకోవడం’ అని అనువదిస్తే మూలంలో ఉన్నదానికంటే భావం బలపడుతుంది.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: నీతి మార్గం
  rationale: ὁδός ఇక్కడ జీవన విధానం లేదా నడవడిని సూచించే రూపకం. δικαιοσύνη ఈ సందర్భంలో న్యాయవ్యవస్థకన్నా దేవుని ఎదుట సరైన నడవడిని సూచిస్తుంది; అందువల్ల ‘నీతి మార్గం’ సహజమైన, సంక్షిప్తమైన ఎంపిక.
- source_word: ὑποστρέψαι ἐκ
  choice: నుండి వెనుదిరగడం
  rationale: ὑποστρέφωలోని తిరిగి వెనక్కి పోయే భావాన్ని, ἐκలోని వేరుపడే భావాన్ని కలిపి స్పష్టంగా నిలిపాం.
- source_word: παραδοθείσης αὐτοῖς
  choice: తమకు అప్పగించబడిన
  rationale: పొందిన ఆజ్ఞ తమకు అందించబడిందనే నిష్క్రియ భావాన్ని కాపాడుతుంది. ‘సంప్రదాయంగా అందించబడిన’ అనే అదనపు చారిత్రక భావాన్ని చేర్చదు.
- source_word: ἁγίας ἐντολῆς
  choice: పవిత్ర ఆజ్ఞ
  rationale: విశేషణంలోని మతపరమైన గంభీరతను, నామవాచకంలోని ఏకవచనాన్ని నిలిపాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వచనం కారణం లేదా వివరణగా అనుసంధానమవుతున్నదని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వచనం భ్రష్టత్వమా లేక పైపై విశ్వాస ప్రకటనేనా అనే సిద్ధాంత వివాదాన్ని అనువాదంలోనే తేల్చాలా?
  choice: వారు నీతి మార్గాన్ని తెలుసుకుని, తమకు అప్పగించబడిన పవిత్ర ఆజ్ఞ నుండి వెనుదిరిగారని మూలం చెప్పినంతవరకే స్పష్టంగా అనువదించడం.
  alternative: రక్షణను కోల్పోయారని మరింత బలంగా చెప్పడం, లేదా వారికి కేవలం పైపై పరిచయమే ఉందని బలహీనపరచడం.
  rationale: గ్రీకు పాఠం నిజమైన తెలుసుకోవడాన్ని, ఆ తర్వాత జరిగిన వెనుదిరుగుదలను పేర్కొంటుంది; అయితే రక్షణ నిలకడ లేదా భ్రష్టత్వంపై ప్రత్యేక మతశాఖ సిద్ధాంతాన్ని అది ఈ వాక్యంలో స్పష్టంగా నిర్ణయించదు. అందువల్ల ఆ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గంభీరమైన శైలి. తులనాత్మక వాక్య నిర్మాణాన్ని తెలుగులో స్పష్టంగా చేయడానికి అర్ధవిరామం ఉపయోగించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
