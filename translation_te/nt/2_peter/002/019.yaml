id: 2PE.2.19
reference: 2 Peter 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: te
  text: వారికి స్వేచ్ఛను వాగ్దానం చేస్తూ, వారే అవినీతికి బానిసలుగా ఉన్నారు; ఎందుకంటే ఒక వ్యక్తి దేనిచేత ఓడించబడతాడో, దానికే బానిసగా ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: స్వేచ్ఛను
  rationale: సాధారణ ఆధునిక తెలుగులో సహజమైన పదం; బానిసత్వంతో ఉన్న వ్యతిరేకతను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπαγγελλόμενοι
  choice: వాగ్దానం చేస్తూ
  rationale: కృదంతంలోని వాగ్దానం చేసే భావాన్ని, ప్రధాన వాక్యంతో దాని సమకాలిక సంబంధాన్ని కాపాడుతుంది.
- source_word: δοῦλοι
  choice: బానిసలుగా
  rationale: ఇక్కడ స్వేచ్ఛకు విరుద్ధంగా బంధిత స్థితి ప్రధానమైనందున ‘సేవకులు’ కంటే ‘బానిసలు’ గ్రీకు పద బలాన్ని మెరుగుగా తెలియజేస్తుంది.
- source_word: ὑπάρχοντες
  choice: ఉన్నారు
  rationale: వారు వాగ్దానం చేస్తున్న సమయంలోనే వారి నిజమైన స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘వీరే’ వ్యతిరేకతను బలపరుస్తుంది.
- source_word: φθορᾶς
  choice: నాశనకరమైన అవినీతికి
  rationale: φθοράలోని నైతిక అవినీతి మరియు నాశనం/క్షయం అనే రెండు భావ ఛాయలనూ అతిగా నిర్దిష్టం చేయకుండా కలిపి చూపుతుంది.
- source_word: ᾧ γάρ τις ἥττηται
  choice: ఎందుకంటే ఒక వ్యక్తి దేనిచేత ఓడించబడతాడో
  rationale: గ్రీకులోని సాధారణ సూత్రాన్ని, కర్మణి భావాన్ని మరియు ఏకవచన అనిర్దిష్ట వ్యక్తిని నిలుపుతుంది.
- source_word: τούτῳ καὶ δεδούλωται
  choice: దానికే బానిస చేయబడి ఉంటాడు
  rationale: దత్తివిభక్తిలోని ఆధీన సంబంధాన్ని ‘దానికే’తో, సంపూర్ణ కర్మణి క్రియలోని ఏర్పడిన-కొనసాగుతున్న స్థితిని ‘చేయబడి ఉంటాడు’తో తెలియజేస్తుంది.
- source_word: τις
  choice: ఒక వ్యక్తి
  rationale: లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా అనిర్దిష్ట ఏకవచనాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: స్వేచ్ఛ వాగ్దానానికి విరుద్ధంగా δοῦλοι/δεδούλωται సూచించే బంధిత స్థితి
  choice: ‘బానిసలుగా’ మరియు ‘బానిస చేయబడి’ అని అనువదించడం
  alternative: ‘సేవకులుగా’, ‘లోబడి’ లేదా ‘బంధంలో’
  rationale: వాక్యంలోని వ్యంగ్యభరితమైన తీవ్ర వ్యతిరేకత బానిసత్వ భాషపై ఆధారపడింది; మృదువైన పదాలు మూలంలోని ఆధిపత్యం మరియు బంధిత స్థితిని బలహీనపరుస్తాయి.
- issue: φθορά యొక్క నైతిక అవినీతి–నాశనం భావ పరిధి
  choice: ‘నాశనకరమైన అవినీతి’
  alternative: ‘అవినీతి’, ‘క్షయం’, లేదా ‘నాశనం’ ఒక్కటే
  rationale: సందర్భంలో ఉన్న నైతిక చెడును, దాని వినాశకర ఫలితాన్ని రెండింటినీ కాపాడుతుంది; ఒకే భావానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని స్వేచ్ఛ–బానిసత్వ వ్యతిరేకతను పదబంధ స్థాయిలో నిలిపి, అనవసర సిద్ధాంత వివరణను చేర్చలేదు.
