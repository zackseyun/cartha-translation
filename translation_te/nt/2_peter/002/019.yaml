revisions:
- from: వారికి స్వేచ్ఛను వాగ్దానం చేస్తూ, వీరే నాశనకరమైన అవినీతికి బానిసలుగా ఉన్నారు; ఎందుకంటే ఒక వ్యక్తి దేనిచేత ఓడించబడతాడో, దానికే బానిస చేయబడి ఉంటాడు.
  to: వారికి స్వేచ్ఛను వాగ్దానం చేస్తూ, వారే అవినీతికి బానిసలుగా ఉన్నారు; ఎందుకంటే ఒక వ్యక్తి దేనిచేత ఓడించబడతాడో, దానికే బానిసగా ఉన్నాడు.
  rationale: The revision removes an added modifier from φθοράς and uses more idiomatic Telugu for the enduring enslaved state expressed by δεδούλωται. The source’s contrast between promised freedom and actual slavery, as well as the generic singular formulation, is retained. No footnotes are needed in Telugu for the English-only lexical alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:53:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the participial contrast, the slavery imagery of δοῦλοι/δεδούλωται, and the general principle in the final clause. However, ‘నాశనకరమైన అవినీతి’ adds an adjectival causal nuance (‘destructive corruption’) not explicitly present in φθοράς. ‘అవినీతి’ preserves the moral-corrupting sense in this context without expanding the source.
  naturalness: The Telugu is generally clear and modern. Replacing the somewhat passive and agent-implying ‘బానిస చేయబడి ఉంటాడు’ with ‘బానిసగా ఉన్నాడు’ more naturally expresses the Greek perfect passive as an attained, continuing state, while retaining the parallel with ‘బానిసలుగా ఉన్నారు.’
  terminology: ‘స్వేచ్ఛ,’ ‘వాగ్దానం చేస్తూ,’ and ‘బానిస’ are appropriate. ‘అవినీతి’ is preferable here to the interpretively expanded ‘నాశనకరమైన అవినీతి.’
  issues:
  - severity: low
    issue: ‘నాశనకరమైన’ is interpretive expansion.
    rationale: φθορά can include ruin/decay as part of its semantic range, but the Greek text does not explicitly qualify it as ‘destructive.’ In this immediate contrast, ‘అవినీతి’ adequately retains the intended corrupting moral power without adding a modifier.
  - severity: low
    issue: ‘బానిస చేయబడి ఉంటాడు’ can suggest an unstated agent and is less idiomatic.
    rationale: δεδούλωται denotes a resulting state of enslavement. ‘బానిసగా ఉన్నాడు’ is natural Telugu and preserves the perfect’s present resultant condition in parallel with the preceding clause.
  revised_text: వారికి స్వేచ్ఛను వాగ్దానం చేస్తూ, వారే అవినీతికి బానిసలుగా ఉన్నారు; ఎందుకంటే ఒక వ్యక్తి దేనిచేత ఓడించబడతాడో, దానికే బానిసగా ఉన్నాడు.
  revised_footnotes: []
  revision_rationale: The revision removes an added modifier from φθοράς and uses more idiomatic Telugu for the enduring enslaved state expressed by δεδούλωται. The source’s contrast between promised freedom and actual slavery, as well as the generic singular formulation, is retained. No footnotes are needed in Telugu for the English-only lexical alternatives.
