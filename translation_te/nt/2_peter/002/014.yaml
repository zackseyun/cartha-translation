id: 2PE.2.14
reference: 2 Peter 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: te
  text: వారు వ్యభిచారిణితో నిండిన[a], పాపం చేయడం మానని[b] కళ్లు గలవారు; నిలకడలేని వారిని ఎరవేసి ఆకర్షించేవారు; దురాశలో శిక్షణ పొందిన హృదయం గలవారు; శాపపు పిల్లలు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని స్పష్టం చేస్తూ, ‘వ్యభిచారంతో నిండిన’ లేదా ‘వ్యభిచార కోరికతో నిండిన.’ గ్రీకులో అక్షరార్థంగా ‘వ్యభిచారిణితో నిండిన’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థానికి దగ్గరగా, ‘పాపం నుండి విరమించని’ లేదా ‘పాపంలో ఎడతెగని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: వ్యభిచారిణితో నిండిన
  rationale: గ్రీకు పాఠంలోని ‘ఒక వ్యభిచారిణితో నిండిన’ అనే స్పష్టమైన ఏకవచన చిత్రాన్ని మృదువుపరచకుండా నిలుపుతుంది. తెలుగులో ఇది ఉద్దేశపూర్వకంగా అసాధారణమైనా అర్థమయ్యే వ్యక్తీకరణ.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: పాపం చేయడం మానని
  rationale: ఈ విశేషణం ‘కళ్లు’ అనే పదాన్నే విశేషిస్తూ, పాపం నుండి విరమించని నిరంతర ప్రవృత్తిని సూచిస్తుంది. ‘పాపం పట్ల తృప్తి చెందని’ కంటే మూలపాఠపు రూపానికి ఇది దగ్గరగా ఉంది.
- source_word: δελεάζοντες
  choice: ఎరవేసి ఆకర్షించేవారు
  rationale: ఈ క్రియలో ఎరతో లాగే లేదా వలలో పడేసే భావం ఉంది. ‘ప్రలోభపెట్టడం’ కంటే ఈ అనువాదం దాని వేటాడే చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ψυχὰς ἀστηρίκτους
  choice: నిలకడలేని వారిని
  rationale: ψυχή ఇక్కడ కేవలం అమూర్తమైన ‘ఆత్మలు’ కాక వ్యక్తులను సూచిస్తుంది; ἀστήρικτος స్థిరపరచబడని, సులభంగా తూలిపోయే స్థితిని తెలియజేస్తుంది.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: దురాశలో శిక్షణ పొందిన హృదయం
  rationale: γεγυμνασμένην లోని సాధన లేదా శిక్షణ భావాన్ని నిలుపుతూ, πλεονεξίαను ఆధునిక పాఠకులకు స్పష్టమైన ‘దురాశ’గా అందిస్తుంది.
- source_word: κατάρας τέκνα
  choice: శాపపు పిల్లలు
  rationale: గ్రీకులోని ‘శాపపు పిల్లలు’ అనే బలమైన సంబంధవాచక రూపకాన్ని ‘శాపగ్రస్తులు’గా చదును చేయకుండా నిలుపుతుంది.
- source_word: ἔχοντες ... ἔχοντες
  choice: కళ్లు గలవారు ... హృదయం గలవారు
  rationale: రెండుసార్లు వచ్చిన participial నిర్మాణాన్ని తెలుగులో సహజంగా పునరావృతం చేసి, పేతురు చేసిన ఆరోపణల సంచయాన్ని కాపాడుతుంది.
theological_decisions:
- issue: μοιχαλίδος లోని లైంగిక చిత్రాన్ని వ్యాఖ్యానాత్మకంగా మృదువుపరచాలా
  choice: ముఖ్య పాఠంలో ‘వ్యభిచారిణితో నిండిన’ అనే సాక్షాత్తు చిత్రాన్ని ఉంచడం
  alternative: ‘వ్యభిచారంతో నిండిన’ లేదా ‘వ్యభిచార కోరికతో నిండిన’
  rationale: మూలపాఠం ఏకవచన స్త్రీలింగ నామవాచకాన్ని ఉపయోగిస్తుంది. దాని తీవ్రతను, అసాధారణతను ప్రధాన పాఠంలో నిలిపి, సాధ్యమైన భావవ్యాఖ్యలను పాదసూచికలో ఇవ్వడం మూలభాషా ప్రాధాన్యానికి అనుగుణం.
- issue: ἀκαταπαύστους ἁμαρτίας ను తృప్తి చెందని పాపాసక్తిగా లేదా పాపం నుండి విరమించని స్థితిగా చూపాలా
  choice: ‘పాపం చేయడం మానని’
  alternative: ‘పాపం పట్ల తృప్తి చెందని’
  rationale: ἀκατάπαυστος యొక్క ప్రాథమిక భావం ఆగని లేదా విరమించని స్థితి. అందువల్ల పాపాన్ని మానలేని నిరంతర ప్రవర్తనను ప్రధాన పాఠం ప్రతిబింబిస్తుంది; ఆకలి లేదా అతృప్తి భావాన్ని అవసరం లేకుండా చేర్చదు.
- issue: κατάρας τέκνα అనే సంబంధవాచక రూపకాన్ని ఎలా నిలుపాలి
  choice: ‘శాపపు పిల్లలు’
  alternative: ‘శాపగ్రస్తులు’ లేదా ‘శాపానికి పాత్రులు’
  rationale: ఈ రూపకం వారి స్వభావం, అనుబంధం లేదా గమ్యాన్ని సూచించవచ్చు. వాటిలో ఒక్క అర్థానికే పరిమితం చేయకుండా మూలంలోని ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నప్పటికీ మూలంలోని ఘాటైన నిందాభాషను, వరుసగా పేరుకుపోయే వాక్యనిర్మాణాన్ని నిలిపింది. ‘వ్యభిచారిణితో నిండిన’ మరియు ‘శాపపు పిల్లలు’ అనే అసాధారణ రూపకాలను ఉద్దేశపూర్వకంగా మృదువుపరచలేదు.
