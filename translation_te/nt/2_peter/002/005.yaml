- from: అలాగే, ఆయన పూర్వకాలపు లోకాన్ని విడిచిపెట్టలేదు; భక్తిహీనుల లోకం మీదికి జలప్రళయాన్ని రప్పించినప్పుడు, ఎనిమిదవవాడైన[a] నోవహును—నీతి[c] ప్రకటనకర్తను[b]—కాపాడాడు.
