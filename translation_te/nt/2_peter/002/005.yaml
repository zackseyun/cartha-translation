id: 2PE.2.5
reference: 2 Peter 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: te
  text: అలాగే, ఆయన పూర్వకాలపు లోకాన్ని కనికరించలేదు; కానీ భక్తిహీనుల లోకంపై జలప్రళయాన్ని రప్పించినప్పుడు, నీతిని[c] ప్రకటించే వాడైన[b] ఎనిమిదవవాడైన నోవహును[a] కాపాడాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎనిమిది మందిలో ఒకడైన నోవహు,” లేదా “నోవహు ఎనిమిదవవాడు.” గ్రీకులోని సంక్షిప్తమైన ὄγδοον Νῶε అనే మాట నోవహు మరో ఏడుగురితో పాటు కాపాడబడ్డాడని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీతి బోధకుడు.” ఇక్కడి నామవాచకం బహిరంగంగా ప్రకటించే వ్యక్తిని, అంటే ప్రకటకుడిని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: “నీతి” అనే పదానికి ఇక్కడ “న్యాయం” అని కూడా అనువదించవచ్చు; అయితే ఈ సందర్భంలో “నీతి” ప్రధాన అనువాదం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: పూర్వకాలపు లోకం
  rationale: జలప్రళయానికి ముందున్న మునుపటి లోకాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: οὐκ ἐφείσατο
  choice: విడిచిపెట్టలేదు
  rationale: తీర్పు సందర్భంలో ‘spare’ అనే భావాన్ని, శిక్ష స్వరూపాన్ని అదనంగా నిర్దేశించకుండా వ్యక్తపరుస్తుంది.
- source_word: ὄγδοον Νῶε
  choice: ఎనిమిదవవాడైన నోవహు
  rationale: గ్రీకు భాషలోని సంక్షిప్తమైన క్రమసంఖ్యా నిర్మాణాన్ని నిలుపుతుంది; దాని సంభావ్య అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: δικαιοσύνης κήρυκα
  choice: నీతి ప్రకటనకర్త
  rationale: κήρυξ లోని బహిరంగంగా ప్రకటించే వ్యక్తి భావాన్ని ‘ప్రకటనకర్త’ అందిస్తుంది; δικαιοσύνηకి ఇక్కడ సహజమైన సమానార్థం ‘నీతి’.
- source_word: ἐφύλαξεν
  choice: కాపాడాడు
  rationale: తీర్పు మధ్య నోవహును సురక్షితంగా నిలిపిన భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κατακλυσμὸν
  choice: జలప్రళయం
  rationale: నోవహు కాలపు మహా వరదను తెలుగులో సుపరిచితంగా, గౌరవప్రదంగా సూచించే పదం.
- source_word: κόσμῳ ἀσεβῶν
  choice: భక్తిహీనుల లోకం మీదికి
  rationale: అసెబేయా భావంలోని దేవునిపట్ల భక్తి లేమిని, గ్రీకు షష్ఠీ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἐπάξας
  choice: రప్పించినప్పుడు
  rationale: ప్రధాన క్రియతో భాగక్రియకు ఉన్న కాలసంబంధాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: δικαιοσύνη పదానికి అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: నోవహు ప్రకటించిన నైతిక సద్వర్తన మరియు దేవుని నైతిక క్రమం అనే విస్తృత భావాన్ని ‘నీతి’ నిలుపుతుంది; ‘న్యాయం’ కూడా పదార్థపరంగా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
- issue: ὄγδοον Νῶε యొక్క సంక్షిప్త భావం
  choice: ఎనిమిదవవాడైన నోవహు
  alternative: ఎనిమిది మందిలో ఒకడైన నోవహు / మరో ఏడుగురితో పాటు నోవహు
  rationale: మూలంలోని అసాధారణ క్రమసంఖ్యా రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది నోవహుతో పాటు మరో ఏడుగురు కాపాడబడ్డారని సూచించవచ్చనే వివరణను పాదటిప్పణికి పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన గ్రంథశైలిని నిలిపింది. ఈ వచనం ముందున్న షరతు వాక్యానికి కొనసాగింపు కావడంతో καίకి ‘అలాగే’ వాడబడింది. మూలంలోని ὄγδοον Νῶε అస్పష్టతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా పాదటిప్పణిలో వివరించింది.
