id: 2PE.2.12
reference: 2 Peter 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: te
  text: అయితే వీరు—పట్టుబడి నాశనం కావడానికే పుట్టి, సహజ ప్రవృత్తిచేత నడిచే వివేకంలేని జంతువుల్లా[a][b]—తమకు తెలియని విషయాలను దూషిస్తూ[c], తమ నాశనంలో తామూ నాశనమవుతారు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హేతువివేచనలేని జంతువుల్లా.’
    reason: lexical_alternative
  - marker: b
    text: ‘పుట్టి, సహజ ప్రవృత్తిచేత నడిచే’ అనేది గ్రీకులో అక్షరార్థంగా ‘సహజమైనవిగా పుట్టిన’ అనే కుదించిన పదబంధాన్ని భావసహితంగా తెలుపుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘తమకు తెలియని విషయాల గురించి నిందిస్తూ.’
    reason: lexical_alternative
  - marker: d
    text: గ్రీకులో ‘నాశనం’ మరియు ‘నాశనమవుతారు’ అనే సంబంధిత పదాలు పునరుక్తమై, నాశనానికీ నశించడానికీ మధ్య పదప్రయోగాన్ని ఏర్పరుస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: వివేకంలేని జంతువులు
  rationale: ἄλογα అనేది మాటలేని స్థితిని మాత్రమే కాక, హేతుబద్ధమైన వివేచన లేని స్థితిని సూచిస్తుంది. ‘వివేకంలేని జంతువులు’ అనే ప్రయోగం ఆధునిక తెలుగులో స్పష్టంగా ఉండి, వాక్యంలోని నైతిక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: γεγεννημένα φυσικὰ
  choice: పుట్టి, సహజ ప్రవృత్తిచేత నడిచే
  rationale: గ్రీకులోని కుదించిన participle-adjective నిర్మాణంలో జన్మ మరియు సహజ స్వభావం అనే రెండు భావాలున్నాయి. తెలుగు వాక్యంలో ‘పుట్టి’ ద్వారా γεγεννημέναను, ‘సహజ ప్రవృత్తిచేత నడిచే’ ద్వారా φυσικάను సహజంగా వ్యక్తం చేశాం.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: పట్టుబడి నాశనం కావడానికే
  rationale: εἰς ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; ἅλωσις పట్టుబడటాన్ని, φθορά నాశనాన్ని సూచిస్తాయి. ‘కే’ ఆ గమ్యభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: తమకు తెలియని విషయాలను
  rationale: నపుంసక బహువచన సంబంధసర్వనామం వ్యక్తులకన్నా విషయాలు లేదా వ్యవహారాలను సూచించే అవకాశం ఎక్కువ. ‘తెలియని విషయాలు’ మూలంలోని అనిర్దిష్టతను నిలుపుతుంది.
- source_word: βλασφημοῦντες
  choice: దూషిస్తూ
  rationale: βλασφημέω దైవదూషణతో పాటు అపవాదకరంగా లేదా అవమానకరంగా మాట్లాడటాన్నీ సూచించగలదు. తెలుగులో ‘దూషిస్తూ’ ఈ విస్తృతిని నిలుపుతూ, సందర్భం చెప్పని పవిత్రమైన నిర్దిష్ట కర్మను చేర్చదు.
- source_word: ἐν τῇ φθορᾷ αὐτῶν … καὶ φθαρήσονται
  choice: తమ నాశనంలో తామూ నాశనమవుతారు
  rationale: φθορά మరియు φθείρω అనే ఒకే మూలానికి చెందిన పదాల పునరుక్తిని ‘నాశనం/నాశనమవుతారు’తో ఉద్దేశపూర్వకంగా నిలిపాం. ‘తమ నాశనంలో’ అనే కొంత అసాధారణ నిర్మాణం మూలంలోని గాఢమైన పదబంధాన్ని అతిగా వివరణ చేయకుండా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: βλασφημοῦντες యొక్క బలం మరియు కర్మ
  choice: ‘దూషిస్తూ’ అని అనువదించి, దూషణకు గురయ్యే కర్మను నిర్దిష్టం చేయలేదు.
  alternative: ‘దైవదూషణ చేస్తూ’ లేదా ‘అపవాదు మోపుతూ’
  rationale: గ్రీకు పదం బలమైన అవమానకరమైన మాటను సూచించినా, ఈ వాక్యంలో దాని కర్మను పవిత్ర విషయాలు, దేవదూతలు లేదా వ్యక్తులు అని నిర్దిష్టంగా చెప్పదు. ‘దూషిస్తూ’ తీవ్రతను ఉంచి, సందర్భం పరిష్కరించని ప్రశ్నను తెరిచి ఉంచుతుంది.
- issue: φθορά / φθαρήσονται యొక్క భావం
  choice: రెండింటినీ ‘నాశనం’ పదకుటుంబంతో అనువదించాం.
  alternative: ‘భ్రష్టత/భ్రష్టులవుతారు’ లేదా ‘క్షయం/నశిస్తారు’
  rationale: పట్టుబడి నాశనం అయ్యే జంతువుల ఉపమానం ఇక్కడ తీర్పు మరియు అంతాన్ని సూచించే భావానికి మద్దతిస్తుంది. అదే సమయంలో సంబంధిత గ్రీకు పదాల పదప్రయోగాన్ని తెలుగు పునరుక్తితో నిలిపాం; నాశనం యొక్క స్వరూపాన్ని అంతకంటే వివరించలేదు.
- issue: ἐν τῇ φθορᾷ αὐτῶν లోని సంబంధం
  choice: ‘తమ నాశనంలో’ అనే నిర్మాణాన్ని ఉంచాం.
  alternative: ‘ఆ జంతువులు నాశనమైనట్లే’ లేదా ‘తమ భ్రష్టతవల్ల’
  rationale: మూలపాఠంలోని αὐτῶν మరియు ἐν సంబంధాన్ని వివరణాత్మక ఉపమానంగా లేదా కారణార్థకంగా మార్చడం అనిశ్చితిని తొలగిస్తుంది. ఎంచుకున్న రూపం పాఠంలోని తీర్పు భావాన్నీ, పునరుక్తినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని దీర్ఘ వాక్యాన్ని డాష్‌లతో క్రమబద్ధం చేసి, జంతువుల ఉపమానాన్ని ప్రధాన వాక్యంతో అనుసంధానించాం. ‘తమ నాశనంలో తామూ నాశనమవుతారు’ కొంత గాఢంగా వినిపించినప్పటికీ, గ్రీకు పదప్రయోగం మరియు ఉద్దేశపూర్వక పునరుక్తి కోసం దాన్ని నిలిపాం.
