  source_fidelity: తెలుగు అనువాదం SBLGNT వాక్యనిర్మాణాన్నీ భావప్రవాహాన్నీ విశ్వసనీయంగా ప్రతిబింబిస్తుంది. ‘వివేకంలేని జంతువులు’ ἄλογα ζῷα యొక్క హేతుబద్ధ వివేచనలేమి భావాన్ని ఇస్తుంది; ‘పట్టుబడి నాశనం కావడానికే పుట్టి, సహజ ప్రవృత్తిచేత నడిచే’ γεγεννημένα φυσικὰ εἰς ἅλωσιν καὶ φθοράν లోని జన్మ/స్వభావం మరియు పట్టుబడటం/నాశనం గమ్యభావాలను నిలుపుతుంది. ἐν οἷς ἀγνοοῦσιν ను నిర్దిష్టం చేయకుండా ‘తమకు తెలియని విషయాలను’ అని ఉంచడం సముచితం. చివరి ‘తమ నాశనంలో తామూ నాశనమవుతారు’ మూలంలోని ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται యొక్క ఉద్దేశపూర్వక పదపునరుక్తినీ, కొంత గాఢమైన సంబంధాన్నీ కాపాడుతుంది.
