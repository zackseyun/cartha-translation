id: 2PE.2.6
reference: 2 Peter 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: te
  text: అలాగే, సొదొమ, గొమొర్రా పట్టణాలను బూడిదగా మార్చి[a], వాటికి నాశన శిక్ష విధించి, భవిష్యత్తులో భక్తిహీనులుగా ఉండబోయేవారికి[b] వాటిని ఒక ఉదాహరణగా ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బూడిదగా చేసి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రాబోయే భక్తిహీనులకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: బూడిదగా మార్చి
  rationale: ఈ క్రియ కేవలం కాల్చడాన్ని కాక, పూర్తిగా బూడిదగా మారిన ఫలితాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ఇది సహజంగా ఉండి ఆ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: καταστροφῇ κατέκρινεν
  choice: నాశనశిక్ష విధించి
  rationale: κατέκρινεν లోని న్యాయపరమైన ‘దోషిగా తీర్చి శిక్ష విధించడం’ అనే భావాన్ని, καταστροφῇ సూచించే నాశన ఫలితంతో కలిపి సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπόδειγμα
  choice: ఒక ఉదాహరణగా
  rationale: ఈ పదానికి ‘నమూనా’ లేదా ‘ఉదాహరణ’ అనే అర్థాలు ఉన్నాయి. తీర్పు సందర్భం హెచ్చరిక భావాన్ని అందిస్తుండగా, ‘ఉదాహరణ’ మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: μελλόντων ἀσεβέσιν
  choice: భవిష్యత్తులో భక్తిహీనులుగా ఉండేవారికి
  rationale: μελλόντων లోని భవిష్యత్ సూచనను, ἀσεβέσιν లోని దేవునిపట్ల భక్తిలేని వ్యక్తుల భావాన్ని రెండింటినీ నిలుపుతుంది; వారి ప్రవర్తనను అనవసరంగా విస్తరించి చెప్పదు.
- source_word: τεθεικώς
  choice: ఉంచాడు
  rationale: τίθημι యొక్క పరిపూర్ణ కృదంత రూపం ఒక ఉదాహరణగా స్థాపించి ఉంచిన ఫలితస్థితిని సూచిస్తుంది; తెలుగులో ‘ఉంచాడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: సొదొమ, గొమొర్రా పట్టణాలను
  rationale: బహువచనమైన ‘పట్టణాలు’ను, రెండు స్థలనామాలను నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: సందర్భం ద్వారా గ్రహించాల్సిన కర్త
  choice: తెలుగులో సందర్భం ద్వారా గ్రహించబడే కర్తగా వదిలివేయడం
  alternative: దేవుడు / ప్రభువు అని స్పష్టంగా చేర్చడం
  rationale: ఈ ఉపవాక్యంలో గ్రీకు మూలం కర్తకు పేరు లేదా బిరుదు ఇవ్వదు; తెలుగు క్రియారూపం పుంలింగ ఏకవచన కర్తను సూచిస్తూ, ముందు సందర్భంతో ఉన్న అనుసంధానాన్ని కాపాడుతుంది.
- issue: ἀσεβέσιν పదబలం
  choice: భక్తిహీనులుగా ఉండేవారు
  alternative: భక్తిహీనమైన జీవితాలు గడిపేవారు / భక్తిహీనులు
  rationale: వ్యక్తులను సూచించే మూలపద భావాన్ని నేరుగా ఉంచి, ప్రత్యేకమైన ప్రవర్తనా వివరణను అనువాదంలో అదనంగా చేర్చదు.
- issue: ప్రారంభంలోని καὶ మరియు కొనసాగుతున్న షరతు నిర్మాణం
  choice: అలాగే
  alternative: అలాగే, ... అయితే
  rationale: ఈ వచనంలోని పాఠ్యంలో εἰ లేదు; షరతు భావం ముందు వచనాల వాక్యనిర్మాణం నుంచి కొనసాగుతుంది. అందువల్ల ఈ భాగంలో లేని ‘అయితే’ను తప్పనిసరిగా చేర్చకుండా, καὶ యొక్క అనుసంధానాన్ని ‘అలాగే’తో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వచనం ముందున్న షరతు వాక్యమాలికలో భాగమైనందున ‘అలాగే’తో అనుసంధానం చూపించబడింది. ‘నాశనశిక్ష’ న్యాయతీర్పు మరియు దాని ఫలితం రెండింటినీ సహజంగా కలిపి తెలియజేస్తుంది.
