review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast between false prophets among the people and future false teachers among the readers, the covert introduction of destructive teachings, denial of the Master who bought them, and self-incurred destruction. The emphatic particle-like force of యజమానినే is not explicit in the Greek and is best omitted. The final phrase is more idiomatic and precise with శీఘ్ర నాశనాన్ని.
  naturalness: The main text is clear modern Telugu overall. Recasting the final clause avoids the less natural expression తమ మీదికి త్వరగా నాశనం తెచ్చుకుంటారు. The second footnote contains an untranslated English word (theological), which should be replaced with natural Telugu.
  terminology: అబద్ధ ప్రవక్తలు, అబద్ధ బోధకులు, విపరీత బోధలు, యజమాని, and కొన్న preserve the relevant lexical and theological distinctions well. యజమాని appropriately retains the ownership/master sense of δεσπότης distinct from κύριος. The footnote alternative preserves, rather than settles, the debated purchase metaphor.
  issues:
  - severity: low
    issue: యజమానినే adds emphasis not directly marked by the Greek.
    rationale: The Greek reads ‘the Master who bought them’ without an explicit equivalent of నే. Removing it better preserves the source wording without changing the sense.
  - severity: medium
    issue: The final Telugu clause is awkward and understates the adjectival force of ταχινὴν.
    rationale: తమ మీదికి త్వరగా నాశనం తెచ్చుకుంటారు is understandable, but తమపైకి శీఘ్ర నాశనాన్ని తెచ్చుకుంటారు is more natural and directly represents ‘bringing swift destruction upon themselves.’
  - severity: medium
    issue: Footnote b contains the untranslated English term ‘theological.’
    rationale: This is a target-language completeness and register error. It should be rendered as వేదాంత సంబంధమైన (or comparable natural Telugu).
  revised_text: కానీ ప్రజల మధ్య అబద్ధ ప్రవక్తలు కూడా పుట్టుకొచ్చారు. అలాగే మీ మధ్య కూడా అబద్ధ బోధకులు ఉంటారు. వారు నాశనకరమైన విపరీత బోధలను[a] రహస్యంగా ప్రవేశపెడతారు. తమను కొన్న యజమానిని[b] తిరస్కరిస్తూ, తమపైకి శీఘ్ర నాశనాన్ని తెచ్చుకుంటారు.
