id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: te
  text: కానీ ప్రజల మధ్య అబద్ధ ప్రవక్తలు కూడా పుట్టుకొచ్చారు. అలాగే మీ మధ్య కూడా అబద్ధ బోధకులు ఉంటారు. వారు నాశనకరమైన విపరీత బోధలను[a] రహస్యంగా ప్రవేశపెడతారు. తమను కొన్న యజమానిని[b] తిరస్కరిస్తూ, తమపైకి శీఘ్ర నాశనాన్ని తెచ్చుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాశనకరమైన వర్గాలను.” గ్రీకు పదం పక్షాలు లేదా మతశాఖలను కూడా సూచించగలదు; అయితే ఇక్కడ నాశనానికి దారితీసే బోధలు లేదా ఉద్యమాలు ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తమను విమోచించిన ప్రభువును.” గ్రీకు పాఠ్యంలో అక్షరార్థంగా “తమను కొన్న యజమాని” అని ఉంది. ఈ కొనుగోలు రూపకం ఎవరికి లేదా ఎంతవరకు వర్తిస్తుందనే విస్తృత వేదాంత సంబంధమైన చర్చలను నిర్ణయించకుండా ప్రధాన పాఠ్యం దానిని నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: పుట్టుకొచ్చారు
  rationale: ప్రజల మధ్య అబద్ధ ప్రవక్తలు చరిత్రలో ఉద్భవించారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ψευδοπροφῆται
  choice: అబద్ధ ప్రవక్తలు
  rationale: గ్రీకు సంయుక్త నామానికి సూటిగా, పారదర్శకంగా ఉన్న సమానార్థకం.
- source_word: ἐν τῷ λαῷ
  choice: ప్రజల మధ్య
  rationale: ఒక సమాజంలో ఉన్నారనే భావాన్ని వ్యక్తం చేస్తుంది; ప్రధాన పాఠ్యంలో ‘ఇశ్రాయేలు’ అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: ψευδοδιδάσκαλοι
  choice: అబద్ధ బోధకులు
  rationale: ‘అబద్ధ ప్రవక్తలు’ అనే ముందరి పదబంధంతో ఉన్న సమాంతరతను నిలుపుతుంది.
- source_word: παρεισάξουσιν
  choice: రహస్యంగా ప్రవేశపెడతారు
  rationale: ఏదో ఒకదాన్ని పక్కదారిలో లేదా గుట్టుగా తీసుకురావడం అనే క్రియలోని భావాన్ని నిలుపుతుంది.
- source_word: αἱρέσεις ἀπωλείας
  choice: నాశనకరమైన విపరీత బోధలు
  rationale: ఇక్కడ యజమానిని తిరస్కరించడంతో ముడిపడిన తప్పుదారి పట్టించే సిద్ధాంతాల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘వర్గాలు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: δεσπότην
  choice: యజమాని
  rationale: κύριος అనే సాధారణ ‘ప్రభువు’ పదానికి భిన్నంగా, అధికారం మరియు యాజమాన్యాన్ని సూచించే δεσπότης భావాన్ని నిలుపుతుంది.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: తమను కొన్న
  rationale: ‘కొనడం’ అనే మూలంలోని వాణిజ్య రూపకాన్ని అలాగే ఉంచి, దానిని ముందుగానే ‘విమోచించడం’గా వ్యాఖ్యానించదు.
- source_word: ἀρνούμενοι
  choice: తిరస్కరిస్తూ
  rationale: యజమానితో తమ సంబంధాన్ని నిరాకరించడం లేదా ఆయనను ఒప్పుకోకపోవడం అనే బలమైన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: తమ మీదికి త్వరగా నాశనం తెచ్చుకుంటారు
  rationale: వారి చర్యల ఫలితంగా నాశనం తమకే వేగంగా సంభవిస్తుందనే ప్రతిబింబక మరియు పరిణామ భావాలను నిలుపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో αἱρέσεις అర్థం
  choice: విపరీత బోధలు
  alternative: నాశనకరమైన వర్గాలు లేదా పక్షాలు
  rationale: రహస్యంగా ప్రవేశపెట్టడం, యజమానిని తిరస్కరించడం అనే సందర్భం బోధాపరమైన తప్పుదారిని ముందుకు తెస్తుంది. అయినా ఈ గ్రీకు పదానికి వర్గాలు లేదా పక్షాలు అనే అర్థం కూడా ఉండగలదని పాదసూచికలో తెలియజేయబడింది.
- issue: τὸν ἀγοράσαντα αὐτοὺς δεσπότην లోని కొనుగోలు రూపకం
  choice: తమను కొన్న యజమాని
  alternative: తమను విమోచించిన ప్రభువు
  rationale: అబద్ధ బోధకులను యజమాని ‘కొన్నాడు’ అని మూలపాఠ్యం చెప్పే theological tension ను పరిష్కరించకుండా నిలుపుతుంది; కొనుగోలు పరిధి లేదా స్వభావంపై ఒక సిద్ధాంత నిర్ణయాన్ని అనువాదంలోకి చొప్పించదు.
- issue: δεσπότης ను κύριος నుండి భిన్నంగా అనువదించడం
  choice: యజమాని
  alternative: ప్రభువు లేదా సర్వాధికారి
  rationale: గ్రీకు పదంలోని యాజమాన్యం మరియు సంపూర్ణ అధికారం భావాన్ని, అలాగే κύριος తో ఉన్న పదభేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన హెచ్చరిక స్వరాన్ని నిలుపుతూ అనువదించబడింది. ‘విపరీత బోధలు’ ప్రస్తుత సందర్భంలో αἱρέσεις యొక్క బోధాపరమైన బలాన్ని తెలియజేస్తుంది; ‘యజమాని’ మరియు ‘కొన్న’ అనే పదాలు మూలంలోని అధికారం, కొనుగోలు రూపకాలను ఉద్దేశపూర్వకంగా నిలుపుతున్నాయి.
