  to: కానీ ప్రజల మధ్య అబద్ధ ప్రవక్తలు కూడా పుట్టుకొచ్చారు. అలాగే మీ మధ్య కూడా అబద్ధ బోధకులు ఉంటారు. వారు నాశనకరమైన విపరీత బోధలను[a] రహస్యంగా ప్రవేశపెడతారు. తమను కొన్న యజమానిని[b] తిరస్కరిస్తూ, తమపైకి శీఘ్ర నాశనాన్ని తెచ్చుకుంటారు.
  rationale: 'The revision makes only safe linguistic and source-fidelity adjustments: it removes added emphasis from యజమానినే, improves the rendering of swift self-incurred destruction, and fully translates the footnote into modern standard Telugu. The underlying interpretive restraint concerning αἱρέσεις and the Master who bought them is retained.'
