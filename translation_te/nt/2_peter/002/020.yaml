id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: te
  text: ఎందుకంటే, ప్రభువు మరియు రక్షకుడైన యేసు మెస్సీయ[b] గురించిన జ్ఞానం ద్వారా[a] లోకపు అపవిత్రతల నుండి తప్పించుకున్న తర్వాత, వారు మళ్లీ వాటిలో చిక్కుకొని వాటిచేత ఓడిపోతే, వారికి చివరి స్థితి మొదటి స్థితికంటే అధ్వాన్నంగా మారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం మరింత సంపూర్ణమైన లేదా ప్రత్యక్షమైన జ్ఞానాన్ని కూడా సూచించవచ్చు; అయితే ఇక్కడ ఆ జ్ఞానం యొక్క రక్షణాత్మక స్వభావాన్ని అనువాదం నిర్ణయించదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘యేసు క్రీస్తు’; ఇక్కడ Χριστός బిరుదుగా వినిపిస్తున్నందున ‘యేసు మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: తప్పించుకున్న తర్వాత
  rationale: అయోరిస్ట్ పార్టిసిపుల్ ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో కాలసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μιάσματα τοῦ κόσμου
  choice: లోకంలోని అపవిత్రతలు
  rationale: μίασμα లో నైతిక కలుషితత్వం, అపవిత్రపరచే ప్రభావం రెండూ ఉన్నాయి; ‘అపవిత్రతలు’ ఈ భావాన్ని నిలుపుతుంది.
- source_word: ἐν ἐπιγνώσει
  choice: తెలుసుకోవడం ద్వారా
  rationale: ἐν ఇక్కడ సాధనం లేదా మార్గాన్ని సూచిస్తుంది. నామవాచక నిర్మాణాన్ని యథాతథంగా ఉంచితే తెలుగులో కృత్రిమంగా ఉండే అవకాశం ఉన్నందున సహజమైన క్రియారూపం వాడబడింది; జ్ఞానం రక్షణాత్మకమైనదా లేక బాహ్య పరిచయమా అని నిర్ణయించలేదు.
- source_word: κυρίου καὶ σωτῆρος
  choice: ప్రభువూ రక్షకుడూ అయిన
  rationale: రెండు బిరుదులూ ఒకే వ్యక్తి అయిన యేసును సూచిస్తున్నట్లు సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది; ‘యేసు మెస్సీయ’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో అర్థమయ్యే రూపం.
- source_word: πάλιν ἐμπλακέντες
  choice: మళ్లీ వాటిలో చిక్కుకొని
  rationale: తాము తప్పించుకున్న అపవిత్రతల్లో తిరిగి చిక్కుబడే రూపకాన్ని నిలుపుతుంది; τούτοις యొక్క పూర్వపదాన్ని ‘వాటిలో’ సూచిస్తుంది.
- source_word: ἡττῶνται
  choice: వాటిచేత ఓడిపోతే
  rationale: క్రియలోని జయించబడటం లేదా లోబడిపోవడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; కర్తృత్వాన్ని సందర్భానుసారంగా ‘వాటిచేత’ వ్యక్తం చేస్తుంది.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: వారి చివరి స్థితి మొదటి స్థితికంటే అధ్వాన్నంగా
  rationale: అక్షరార్థమైన ‘చివరి విషయాలు’కు బదులు సందర్భంలోని చివరి పరిస్థితిని సహజంగా తెలియజేస్తుంది; అంత్యకాలార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: γέγονεν αὐτοῖς
  choice: మారింది
  rationale: పర్ఫెక్ట్ క్రియ సూచించే ఏర్పడిన ఫలితస్థితిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐπίγνωσις సూచించే జ్ఞానం మరియు విశ్వాసత్యాగం
  choice: ‘తెలుసుకోవడం’ అని మాత్రమే అనువదించి, అది రక్షణనిచ్చే అంతరంగ జ్ఞానమా కాదా అని నిర్దేశించలేదు.
  alternative: ‘రక్షణాత్మకంగా తెలుసుకోవడం’ లేదా ‘కేవలం బాహ్యంగా తెలుసుకోవడం’
  rationale: గ్రీకు పదమే ఈ సిద్ధాంత వివాదాన్ని పరిష్కరించదు. అందువల్ల వాక్యంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
- issue: Χριστοῦ యొక్క రూపం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ యేసుకు సంబంధించిన బిరుదు భావం స్పష్టంగా వినిపించేలా ‘మెస్సీయ’ను వాడింది; ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘ఎరుగుట’, ‘గూర్చిన’ వంటి పాత లేదా గ్రాంథిక రూపాలను నివారించి, మూలంలోని కారణసూచక ‘ఎందుకంటే’ మరియు షరతు నిర్మాణాన్ని నిలిపింది.
