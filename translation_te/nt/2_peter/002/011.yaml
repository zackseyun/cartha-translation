  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: te
  text: అయితే, దేవదూతలు బలంలోనూ శక్తిలోనూ గొప్పవారైనప్పటికీ, వారి[b] మీద దూషణాత్మకమైన[a] తీర్పు చెప్పరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దైవదూషణతో కూడిన’ లేదా ‘అవమానకరమైన.’ గ్రీకు విశేషణం దూషించే, అవమానించే, లేదా అపనింద మోపే మాటను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘వారి’ అనే సర్వనామం బహుశా ముందటి వచనంలోని ‘మహిమగలవారిని’ సూచిస్తుంది; అయితే పేతురు ఇక్కడ వారిని మరింత స్పష్టంగా గుర్తించలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: అయితే
  rationale: ఇక్కడ ఇది స్థలాన్ని సూచించడంకన్నా ముందటి వాక్యంతో వ్యత్యాసాన్ని చూపే అనుసంధాన పదంగా పనిచేస్తుంది.
- source_word: ἄγγελοι
  choice: దేవదూతలు
  rationale: సందర్భంలో వీరు మానవ సందేశకులు కాక పరలోక సంబంధమైన జీవులు.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: బలంలోనూ శక్తిలోనూ
  rationale: రెండు సమీపార్థక నామవాచకాలనూ నిలిపి, దేవదూతలు ఏ విషయంలో గొప్పవారో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μείζονες ὄντες
  choice: గొప్పవారైనప్పటికీ
  rationale: కృదంత నిర్మాణానికి సందర్భంలో ఉన్న concessive భావాన్ని, అంటే వారు గొప్పవారైనా అలా చేయరనే వ్యత్యాసాన్ని, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐ φέρουσιν
  choice: చెప్పరు
  rationale: κρίσινతో కలిసి ఇది తీర్పును ముందుకు తేవడం లేదా ఉచ్చరించడం అనే భావం ఇస్తుంది; తెలుగులో ‘తీర్పు చెప్పరు’ సహజంగా ఉంటుంది.
- source_word: κατ’ αὐτῶν
  choice: వారి మీద
  rationale: సర్వనామాన్ని మరింత నిర్దిష్టంగా గుర్తించకుండా మూలంలోని పూర్వాపర సంబంధాన్ని అలాగే ఉంచుతుంది.
- source_word: βλάσφημον
  choice: దూషణాత్మకమైన
  rationale: ఇక్కడ దేవునికి విరోధమైన మాట అనే సంకుచిత భావంకన్నా, అవమానకరమైన లేదా నిందాపూర్వకమైన మాట/తీర్పు అనే విస్తృత భావం సందర్భానికి సరిపోతుంది.
- source_word: κρίσιν
  choice: తీర్పు
  rationale: న్యాయపరమైన అంచనా లేదా తీర్పు అనే విస్తృత భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: αὐτῶν అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘వారి’ అని మాత్రమే ఉంచడం
  alternative: పతనమైన దేవదూతలు, మానవ అధికారస్థులు, లేదా మహిమగల పరలోక జీవులు అని నిర్దిష్టీకరించడం
  rationale: ఈ వచనం ఆ వ్యక్తులను స్పష్టంగా గుర్తించదు; కాబట్టి ముందటి వచనంతో సంబంధాన్ని పాఠకుడు గ్రహించగలిగేలా ఉంచుతూ, ఒక నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘బలం–శక్తి’ అనే జంటను నిలిపి, సర్వనామపు అనిశ్చితిని పరిష్కరించకుండా కాపాడాం.
