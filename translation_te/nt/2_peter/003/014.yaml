id: 2PE.3.14
reference: 2 Peter 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: te
  text: కాబట్టి, ప్రియులారా, మీరు వీటి కోసం ఎదురుచూస్తున్నందున, శాంతిలో మచ్చలేనివారిగా, నిర్దోషులుగా ఆయన దృష్టిలో కనబడునట్లు అత్యంత శ్రద్ధగా కృషి చేయండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనచేత శాంతిలో మచ్చలేనివారిగా, నిర్దోషులుగా కనబడునట్లు.” గ్రీకులోని దత్తివిభక్తి ‘ఆయనచేత’ అనే కర్తృత్వ భావాన్నిగానీ, ‘ఆయన దృష్టిలో’ లేదా ‘ఆయన సన్నిధిలో’ అనే సంబంధ/సన్నిధి భావాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: కాబట్టి
  rationale: ముందు చెప్పిన ప్రభువు దినం, కొత్త ఆకాశాలు, కొత్త భూమి విషయాలనుంచి తీసిన ముగింపును సహజంగా తెలియజేస్తుంది.
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయతతో కూడిన బహువచన సంబోధనను ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ταῦτα προσδοκῶντες
  choice: మీరు వీటికోసం ఎదురుచూస్తున్నారు గనుక
  rationale: ముందు పేర్కొన్న అంత్యకాల వాస్తవాలను సూచించే సర్వనామాన్నీ, కొనసాగుతున్న నిరీక్షణనూ, ఆ నిరీక్షణ ఆధారంగా వచ్చే ఆజ్ఞతో ఉన్న కారణ సంబంధాన్నీ నిలుపుతుంది.
- source_word: σπουδάσατε
  choice: శాయశక్తులా కృషి చేయండి
  rationale: కేవలం మనోభావాన్ని కాక, శ్రద్ధతో కూడిన సంపూర్ణ ప్రయత్నాన్ని కోరే ఆజ్ఞ బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἄσπιλοι
  choice: మచ్చలేనివారిగా
  rationale: నైతిక స్వచ్ఛతను తెలిపే మచ్చ రూపకాన్ని నిలుపుతుంది.
- source_word: ἀμώμητοι
  choice: నిందలేనివారిగా
  rationale: తప్పుపట్టలేని నైతిక స్థితిని సహజంగా తెలియజేస్తూ, ‘మచ్చలేని’ అనే జతపదంతో ఉన్న భావసామీప్యాన్ని కాపాడుతుంది.
- source_word: αὐτῷ εὑρεθῆναι
  choice: ఆయనకు కనబడేందుకు
  rationale: గ్రీకు దత్తివిభక్తిని సంబంధం/మూల్యాంకన సూచనగా సహజ తెలుగులో అందిస్తుంది; కర్తృత్వార్థమైన ‘ఆయన చేత కనబడేందుకు’ కూడా సాధ్యమే కాబట్టి దాన్ని పాదటీపులో ఉంచుతుంది.
- source_word: ἐν εἰρήνῃ
  choice: శాంతితో
  rationale: అంతరంగ ప్రశాంతత, సమాధాన సంబంధం, సంఘసామరస్యం వంటి సాధ్యమైన భావాలను అతిగా నిర్దిష్టం చేయకుండా స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో αὐτῷ యొక్క సంబంధం మరియు దత్తివిభక్తి భావం
  choice: ‘ఆయనకు కనబడేందుకు’ అని అనువదించి, సర్వనామ సూచిత వ్యక్తిని మరింత స్పష్టీకరించలేదు.
  alternative: ‘ఆయన చేత ... కనబడేందుకు’ లేదా ‘ఆయన సన్నిధిలో ... కనబడేందుకు’
  rationale: వచనం ‘ప్రభువు’ లేదా ‘దేవుడు’ అని నామాన్ని మళ్లీ చెప్పదు. దత్తివిభక్తి కర్తృత్వాన్నిగానీ, సంబంధం/సన్నిధినిగానీ సూచించగలదు; అందువల్ల ఒకే భావాన్ని సిద్ధాంతపరంగా ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదటీపులో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పత్రికా సంబోధనకు తగిన గౌరవం మరియు గంభీరతతో. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా సహజ తెలుగు వాక్యనిర్మాణాన్ని వాడి, మూలంలోని నిజమైన దత్తివిభక్తి సందిగ్ధతను పాదటీపులో భద్రపరిచాం.
