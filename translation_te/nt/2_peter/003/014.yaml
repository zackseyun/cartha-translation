revisions:
- from: కాబట్టి, ప్రియులారా, మీరు వీటికోసం ఎదురుచూస్తున్నారు గనుక, శాంతితో, మచ్చలేనివారిగా, నిందలేనివారిగా ఆయనకు కనబడేందుకు శాయశక్తులా కృషి చేయండి.[a]
  to: కాబట్టి, ప్రియులారా, మీరు వీటి కోసం ఎదురుచూస్తున్నందున, శాంతిలో మచ్చలేనివారిగా, నిర్దోషులుగా ఆయన దృష్టిలో కనబడునట్లు అత్యంత శ్రద్ధగా కృషి చేయండి.[a]
  rationale: The revision improves precision and modern Telugu idiom without changing the verse’s meaning. It preserves the Greek dative ambiguity concerning αὐτῷ, keeps its referent implicit, and retains the open scope of ‘in peace.’
