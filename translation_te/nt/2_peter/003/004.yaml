- from: “ఆయన రాక[a] గురించిన వాగ్దానం ఎక్కడ ఉంది? పితరులు నిద్రించినప్పటి నుండీ[b], సృష్టి ఆరంభం నుంచి సమస్తం అలాగే కొనసాగుతోంది” అని అంటూ ఉన్నారు.
