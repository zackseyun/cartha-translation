id: 2PE.3.4
reference: 2 Peter 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: te
  text: “ఆయన రాక[a] గురించిన వాగ్దానం ఎక్కడ ఉంది? పితరులు నిద్రించినప్పటి నుంచీ[b], సృష్టి ఆరంభం నుంచీ సమస్తం అలాగే కొనసాగుతూనే ఉంది” అంటూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రాక” (παρουσία) అనే పదాన్ని “సన్నిధి” లేదా “ఆగమనం” అని కూడా అనువదించవచ్చు. ఈ సందర్భంలో ఇది ఎదురుచూస్తున్న క్రీస్తు భవిష్యత్ పునరాగమనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నిద్రించడం” అనేది మరణాన్ని సూచించే గ్రీకు సౌమ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: అని అంటూ ఉన్నారు
  rationale: వర్తమాన కృదంత రూపాన్ని ముందరి వచనంలోని అపహాసకుల వర్ణనతో అనుసంధానిస్తూ, తెలుగులో సహజమైన కొనసాగింపు భావాన్ని ఇస్తుంది.
- source_word: ἐπαγγελία
  choice: వాగ్దానం
  rationale: పదానికి సాధారణమైన అర్థాన్ని నిలుపుతుంది; ఇక్కడ ప్రభువు రాక గురించి ఇచ్చిన హామాను సూచిస్తుంది.
- source_word: παρουσίας
  choice: రాక
  rationale: ఈ అంత్యకాల సందర్భంలో ఎదురుచూస్తున్న క్రీస్తు రాకను సహజంగా తెలియజేస్తుంది; ‘సన్నిధి’ అనే స్థిరార్థాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: ἀφ’ ἧς
  choice: అప్పటి నుండీ
  rationale: గతంలోని ఒక సమయం నుంచి ఇప్పటివరకు గడిచిన కాలాన్ని తెలిపే గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οἱ πατέρες
  choice: పితరులు
  rationale: గ్రీకులో స్వామ్య సర్వనామం లేకపోవడాన్ని నిలుపుతూ, పూర్వ తరాలవారిని సూచించే మూలపదానికి సన్నిహితంగా ఉంటుంది.
- source_word: ἐκοιμήθησαν
  choice: నిద్రించిన
  rationale: మరణాన్ని సూచించడానికి మూలంలో వాడిన సౌమ్యోక్తి రూపకాన్ని నిలుపుతుంది.
- source_word: πάντα
  choice: సమస్తం
  rationale: నపుంసక బహువచనంలోని సమగ్ర భావాన్ని తెలుగులో సహజమైన ఏకసమూహ పదంతో తెలియజేస్తుంది.
- source_word: οὕτως διαμένει
  choice: అలాగే కొనసాగుతోంది
  rationale: అన్నీ మొదటినుంచి అదే స్థితిలో నిలిచి కొనసాగుతున్నాయనే అపహాసకుల వాదనను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: సృష్టి ఆరంభం నుంచి
  rationale: గ్రీకు షష్ఠీ నిర్మాణాన్ని స్పష్టంగా, సహజంగా, మూలానికి దగ్గరగా అందిస్తుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో παρουσία అర్థం
  choice: ఆయన రాక
  alternative: ఆయన సన్నిధి; ఆయన ఆగమనం
  rationale: ఆలస్యమైన అంత్యకాల నెరవేర్పును అపహసించే సందర్భం కావడంతో, ఇది క్రీస్తు భవిష్యత్ రాకను సూచిస్తుంది. ‘రాక’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మూలభావాన్ని నిలుపుతుంది.
- issue: ἐκοιμήθησαν అనే మరణ సౌమ్యోక్తి
  choice: నిద్రించిన
  alternative: చనిపోయిన
  rationale: మూలపాఠం మరణానికి నేరుగా పదం వాడకుండా నిద్ర రూపకాన్ని వాడింది. దానిని నిలపడం మూలపాఠపు శైలిని కాపాడుతుంది; పాదసూచిక ఉద్దేశించిన అర్థాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘పితరులు’ మూలపాఠంలోని నిర్దిష్టతలేని ‘తండ్రులు/పూర్వీకులు’ భావాన్ని నిలుపుతుంది; ‘నిద్రించిన’ మూలంలోని రూపకాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది.
