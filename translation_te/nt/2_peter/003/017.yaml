id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: te
  text: కాబట్టి, ప్రియులారా, ఇది ముందుగానే తెలిసిన మీరు, నియమాలను లెక్కచేయనివారి తప్పుదారి చేత వారితోపాటు కొట్టుకుపోయి మీ సొంత స్థిరత్వం[a] నుండి పడిపోకుండా[b] మిమ్మల్ని మీరు కాపాడుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ సొంత దృఢస్థితి.’ గ్రీకు στηριγμός అనే పదం దృఢత, స్థిరత్వం లేదా నిలకడను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నుండి పడిపోవడం’ను ‘నుండి తొలగిపోవడం’ అని కూడా అనువదించవచ్చు. అయితే ప్రధాన పాఠం గ్రీకు రూపకాన్ని నిలుపుతూ, హెచ్చరికకు మరింత నిర్దిష్టమైన సిద్ధాంతార్థాన్ని జోడించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν, ἀγαπητοί
  choice: కాబట్టి ప్రియులారా, మీరు
  rationale: οὖν సూచించే మునుపటి సందర్భం నుండి వచ్చే నిర్ధారణను ‘కాబట్టి’ తెలియజేస్తుంది; ὑμεῖς లోని ఉద్ఘాటనను ‘మీరు’ నిలుపుతుంది; ἀγαπητοί లోని ఆప్యాయ సంబోధనకు ‘ప్రియులారా’ సహజమైన గౌరవభరిత రూపం.
- source_word: προγινώσκοντες
  choice: ఇది ముందుగానే తెలుసుకున్నారు గనుక
  rationale: ముందస్తు జ్ఞానం లేదా ముందే అందిన హెచ్చరిక అనే కాలార్థాన్ని నిలుపుతుంది. సందర్భాన్ని సూచించడానికి ‘ఇది’ చేర్చబడింది.
- source_word: φυλάσσεσθε
  choice: జాగ్రత్తగా ఉండండి … మిమ్మల్ని మీరు కాపాడుకోండి
  rationale: వర్తమాన మధ్యమ ఆజ్ఞలోని నిరంతర అప్రమత్తతను, ఆత్మవాచక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ఈ సమ్మిళిత నిర్మాణం వాడబడింది.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: నియమాలను లెక్కచేయనివారి తప్పుదారి చేత
  rationale: ἀθέσμος లోని నైతిక నియమాన్ని తిరస్కరించే భావాన్ని సహజమైన తెలుగులో ‘నియమాలను లెక్కచేయనివారు’గా వ్యక్తం చేసింది; πλάνη లోని పొరపాటు/దారితప్పుదల భావానికి ‘తప్పుదారి’ సరిపోతుంది.
- source_word: συναπαχθέντες
  choice: వారితోపాటు కొట్టుకుపోయి
  rationale: συν- లోని ‘కలిసి’ అనే భావాన్నీ, అపాగో యొక్క నిష్క్రియాత్మకంగా లాక్కుపోబడే బలాన్నీ నిలుపుతుంది.
- source_word: ἐκπέσητε
  choice: పడిపోకుండా
  rationale: ἐκπίπτω లోని ‘నుండి పడిపోవడం’ అనే రూపకాన్ని ఉంచి, దానిని తప్పనిసరిగా మతభ్రష్టత్వంగా నిర్వచించదు.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: మీ సొంత స్థిరత్వం నుండి
  rationale: ἴδιος లోని స్వకీయ ఉద్ఘాటనను ‘సొంత’ నిలుపుతుంది; στηριγμός సూచించే నిలకడ లేదా దృఢతకు ‘స్థిరత్వం’ నామవాచక రూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἐκπέσητε రక్షణ కోల్పోవడాన్ని లేదా మతభ్రష్టత్వాన్ని తప్పనిసరిగా సూచిస్తుందా
  choice: ‘మీ సొంత స్థిరత్వం నుండి పడిపోకుండా’ అని సిద్ధాంతపరంగా తటస్థంగా అనువదించబడింది.
  alternative: ‘మీ స్థిరనిలుపు నుండి పూర్తిగా తొలగిపోకుండా’ లేదా ‘విశ్వాసం నుండి తొలగిపోకుండా’
  rationale: గ్రీకు వాక్యం తప్పుదారి వల్ల ఒకరి దృఢస్థితి నుండి పడిపోవడం గురించి గంభీరంగా హెచ్చరిస్తుంది; అయితే అది రక్షణ లేదా అంతిమ మతభ్రష్టత్వం గురించి ఒక నిర్దిష్ట సిద్ధాంత నిర్ణయాన్ని స్వయంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన పత్రికా-బోధనా శైలి. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించినా, తర్కసంబంధం మరియు హెచ్చరిక యొక్క బలం నిలుపబడ్డాయి. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల దగ్గర ఉంచబడ్డాయి.
