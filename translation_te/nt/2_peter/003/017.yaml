    rationale: ‘ఇది ముందుగానే తెలిసిన మీరు’ అనేది ‘knowing beforehand’ అనే భాగవాచకాన్ని తెలుగు సంబోధనలో నేరుగా, సహజంగా తెలియజేస్తుంది.
