  revised_text: కాబట్టి, ప్రియులారా, ఇది ముందుగానే తెలిసిన మీరు, నియమాలను లెక్కచేయనివారి తప్పుదారి చేత వారితోపాటు కొట్టుకుపోయి మీ సొంత స్థిరత్వం[a] నుండి పడిపోకుండా[b] మిమ్మల్ని మీరు కాపాడుకోండి.
