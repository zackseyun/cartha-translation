revisions:
- from: కాబట్టి ప్రియులారా, మీరు ఇది ముందుగానే తెలుసుకున్నారు గనుక జాగ్రత్తగా ఉండండి. నియమాలను లెక్కచేయనివారి తప్పుదారి చేత వారితోపాటు కొట్టుకుపోయి, మీ సొంత స్థిరత్వం[a] నుండి పడిపోకుండా[b] మిమ్మల్ని మీరు కాపాడుకోండి.
  to: కాబట్టి, ప్రియులారా, ఇది ముందుగానే తెలిసిన మీరు, నియమాలను లెక్కచేయనివారి తప్పుదారి చేత వారితోపాటు కొట్టుకుపోయి మీ సొంత స్థిరత్వం[a] నుండి పడిపోకుండా[b] మిమ్మల్ని మీరు కాపాడుకోండి.
  rationale: సవరణ ఒకే గ్రీకు ఆజ్ఞను ఒకే తెలుగు ఆజ్ఞగా ఉంచి, προγινώσκοντες యొక్క ముందస్తు-తెలుసుకొనుట భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘వారితోపాటు కొట్టుకుపోయి’ συναπαχθέντεςలోని కలిసిలాక్కుపోబడే భావాన్ని, ‘తప్పుదారి చేత’ దాని ప్రేరక/సాధన భావాన్ని కాపాడతాయి. ἐκπέσητεను ‘పడిపోకుండా’గా ఉంచడం ద్వారా మతభ్రష్టత్వం లేదా రక్షణ-నష్టం గురించి అనవసరమైన సిద్ధాంత నిర్ణయం చేయకుండా మూల రూపకం నిలుస్తుంది. రెండు పాదసూచిక గుర్తులు తాము వివరించే పదబంధాల వద్దనే ఉన్నాయి.
