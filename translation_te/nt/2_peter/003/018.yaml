id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: te
  text: అయితే, మన ప్రభువూ రక్షకుడూ అయిన యేసు మెస్సీయ[a] కృపలోను, ఆయనను గురించిన జ్ఞానంలోను ఎదుగుతూ ఉండండి. ఇప్పుడూ నిత్యత్వపు దినం వరకు కూడా ఆయనకు మహిమ కలుగుగాక[b]. ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయ తెలుగు వాడుక ప్రకారం, “యేసు క్రీస్తు.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఇప్పుడూ ఎప్పటికీ.” గ్రీకులో మరింత అక్షరార్థంగా “ఇప్పుడూ నిత్యత్వపు దినం వరకు కూడా” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: ఎదుగుతూ ఉండండి
  rationale: వర్తమానకాల ఆజ్ఞార్థక రూపంలోని కొనసాగుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న హెచ్చరికలకు ఈ చివరి ప్రోత్సాహానికి మధ్యనున్న స్వల్ప వ్యత్యాసాన్ని, మార్పును రెండింటినీ సూచిస్తుంది.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: కృపలోనూ, ఆయనను గురించిన జ్ఞానంలోనూ
  rationale: ἐν రెండు పదాలనూ నియంత్రిస్తుంది. జ్ఞానం యేసు మెస్సీయను గురించినదని తెలుగులో సహజంగా స్పష్టం చేస్తూ, కృపలో ఎదగడం అనే రూపకాన్ని నిలుపుతుంది.
- source_word: χάριτι
  choice: కృప
  rationale: ఈ సందర్భంలోని దైవానుగ్రహ భావానికి స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: γνώσει
  choice: జ్ఞానం
  rationale: కేవలం మేధోసమాచారానికి పరిమితం చేయకుండా, మూలపదపు సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువూ రక్షకుడూ అయిన యేసు మెస్సీయ
  rationale: ఒకే నిర్దేశక పదం κύριος, σωτήρ రెండింటినీ కలపడం వల్ల రెండు బిరుదులూ ఒకే వ్యక్తియైన యేసును సూచిస్తాయి. Χριστόςను పేరుగా కేవలం లిప్యంతరీకరించకుండా దాని బిరుదు భావంతో ‘మెస్సీయ’గా అనువదించింది.
- source_word: αὐτῷ ἡ δόξα
  choice: ఆయనకే మహిమ కలుగుగాక
  rationale: క్రియ అంతర్లీనంగా ఉన్న గ్రీకు మహిమారోపణను గౌరవప్రదమైన, సహజమైన తెలుగు ఆశీర్వచన రూపంలో అందిస్తుంది; ‘కే’ ఆయననే సూచించే దత్తివిభక్తిని బలంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: ఇప్పుడూ నిత్యత్వపు దినం వరకూ
  rationale: రెండు καὶ పదాల పరస్పర సంబంధాన్ని ‘ఇప్పుడూ ... వరకూ’తో చూపిస్తూ, అసాధారణమైన ἡμέραν αἰῶνος పదబంధంలోని ‘దినం’ను తొలగించకుండా నిలుపుతుంది.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన లిప్యంతరీకరణ.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦ అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉంది; అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠంలో ఉంచి, సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో ఇచ్చింది.
- issue: ‘మన ప్రభువూ రక్షకుడూ’ అనే రెండు బిరుదుల నిర్దేశ్యం
  choice: రెండు బిరుదులూ ఒకే వ్యక్తియైన యేసు మెస్సీయను సూచిస్తాయి
  alternative: వాక్య నిర్మాణాన్ని మరింత అస్పష్టంగా ఉంచడం
  rationale: ఒకే గ్రీకు నిర్దేశక పదం κύριος, σωτήρ అనే రెండు ఏకవచన వ్యక్తివాచక బిరుదులను కలుపుతున్నందున ఒకే నిర్దేశ్యం సహజమైన వ్యాకరణ పఠనం.
- issue: ἡμέραν αἰῶνος యొక్క అసాధారణ కాలవ్యక్తీకరణ
  choice: నిత్యత్వపు దినం వరకూ
  alternative: ఎప్పటికీ
  rationale: సులభమైన ‘ఎప్పటికీ’ అనే భావానువాదంలో కలిసిపోయే ‘దినం’ అనే మూలభాషా చిత్రాన్ని ప్రధాన పాఠం నిలుపుతుంది; సాధారణ కాలార్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడింది. కొనసాగుతున్న ఆజ్ఞను ‘ఎదుగుతూ ఉండండి’తో వ్యక్తం చేసింది. అసాధారణమైన అంత్యకాల పదబంధాన్ని ప్రధాన పాఠంలో నిలిపి, మరింత సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
