revisions:
- from: అయితే, మన ప్రభువూ రక్షకుడూ అయిన యేసు మెస్సీయ[a] కృపలోనూ, ఆయనను గురించిన జ్ఞానంలోనూ ఎదుగుతూ ఉండండి. ఇప్పుడూ నిత్యత్వపు దినం వరకూ[b] ఆయనకే మహిమ కలుగుగాక. ఆమేన్.
  to: అయితే, మన ప్రభువూ రక్షకుడూ అయిన యేసు మెస్సీయ[a] కృపలోను, ఆయనను గురించిన జ్ఞానంలోను ఎదుగుతూ ఉండండి. ఇప్పుడూ నిత్యత్వపు దినం వరకు కూడా ఆయనకు మహిమ కలుగుగాక[b]. ఆమేన్.
  rationale: The revision makes Jesus explicitly the grammatical referent for both grace and knowledge, as in the Greek genitive construction. It also renders the correlative temporal phrase with ‘కూడా’ and avoids adding exclusive emphasis to the dative ‘to him.’ The footnote b wording is conformed to the revised main-text expression and remains correctly anchored.
