revisions:
- from: అయితే ఇప్పుడు ఉన్న ఆకాశాలు, భూమి అదే వాక్యం చేత అగ్ని కోసం నిల్వచేయబడి ఉన్నాయి; భక్తిహీనులైన మనుష్యుల[a] తీర్పు, నాశనం జరిగే రోజు వరకు అవి భద్రపరచబడుతున్నాయి.
  to: అయితే ఇప్పుడు ఉన్న ఆకాశాలు మరియు భూమి అదే వాక్యం ద్వారా నిల్వ చేయబడి ఉన్నాయి; అవి తీర్పు మరియు భక్తిహీనులైన మనుష్యుల[a] నాశన దినం వరకు అగ్ని కోసం కాపాడబడుతున్నాయి.
