id: 2PE.3.7
reference: 2 Peter 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: te
  text: అయితే ఇప్పుడు ఉన్న ఆకాశాలు మరియు భూమి అదే వాక్యం ద్వారా నిల్వ చేయబడి ఉన్నాయి; అవి తీర్పు మరియు భక్తిహీనులైన మనుష్యుల[a] నాశన దినం వరకు అగ్ని కోసం కాపాడబడుతున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘మనుష్యులు’ అనే గ్రీకు పదం సాధారణంగా మానవులందరినీ సూచించగలదు; అందువల్ల ‘భక్తిహీనులైన ప్రజలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: అయితే ఇప్పుడు ఉన్న ఆకాశాలు, భూమి
  rationale: δέ ముందటి లోకంతో వ్యత్యాసాన్ని సూచిస్తుంది; νῦν ప్రస్తుత సృష్టి క్రమాన్ని సూచిస్తుంది. οὐρανοί యొక్క బహువచనాన్ని ‘ఆకాశాలు’గా నిలిపాం.
- source_word: τῷ αὐτῷ λόγῳ
  choice: అదే వాక్యం చేత
  rationale: λόγος సందర్భంలో దేవుని కార్యసాధక వాక్యాన్ని వెనక్కి సూచిస్తుంది; దత్తివును సాధనార్థకంగా అనువదించాం.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: నిల్వచేయబడి ఉన్నాయి
  rationale: పరిభాషాత్మక పరిపూర్ణకాలం గతంలో జరిగిన కార్యం వల్ల కొనసాగుతున్న ప్రస్తుత స్థితిని వ్యక్తం చేస్తుంది.
- source_word: πυρὶ τηρούμενοι
  choice: అగ్ని కోసం ... భద్రపరచబడుతున్నాయి
  rationale: τηρέω యొక్క కాపాడి ఉంచడం/ప్రత్యేక ఉద్దేశం కోసం నిలిపి ఉంచడం అనే భావాన్ని, πυρί యొక్క ఉద్దేశార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς ἡμέραν κρίσεως
  choice: తీర్పు ... జరిగే రోజు వరకు
  rationale: εἰς ఇక్కడ లక్ష్యంగా ఉన్న కాలాంతాన్ని సూచిస్తుంది; ‘రోజు వరకు’ దాని కాలసంబంధ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: καὶ ἀπωλείας
  choice: నాశనం
  rationale: ἀπώλεια యొక్క వినాశం/నాశనం అనే సాధారణ భావాన్ని, అదనపు సిద్ధాంతార్థం జోడించకుండా అందిస్తుంది.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: భక్తిహీనులైన మనుష్యుల
  rationale: ἀσεβής‌ను దేవునిపట్ల భక్తి లేనివారనే భావంలో ‘భక్తిహీనులు’గా, ἄνθρωποι‌ను ప్రతినిధి బహువచనంగా ‘మనుష్యులు’గా అనువదించాం.
theological_decisions:
- issue: రాబోయే అగ్ని తీర్పు స్వభావం
  choice: ప్రస్తుత ఆకాశాలు, భూమి భవిష్యత్తు అగ్ని కోసం భద్రపరచబడుతున్నాయని మాత్రమే వచనం చెప్పేలా అనువదించాం.
  alternative: సృష్టి పూర్తిగా నిర్మూలించబడటం లేదా శుద్ధీకరించబడి రూపాంతరం చెందటం అని నిర్దిష్టంగా చెప్పడం.
  rationale: ఈ వచనంలో ‘నాశనం’ అన్నది వ్యాకరణపరంగా భక్తిహీనులైన మనుష్యులతో సంబంధించింది. ఆకాశాలు, భూమి విషయంలో అగ్ని ఫలితం నిర్మూలనో రూపాంతరమో ఈ వచనం మాత్రమే నిర్ణయించదు; అందువల్ల ఆ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘నిల్వచేయబడి ఉన్నాయి’ మరియు ‘భద్రపరచబడుతున్నాయి’ ద్వారా τεθησαυρισμένοι, τηρούμενοι మధ్యనున్న భావభేదాన్ని కాపాడాం.
