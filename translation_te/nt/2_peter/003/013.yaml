id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: te
  text: అయితే ఆయన వాగ్దానం ప్రకారం, నీతి[a] నివసించే కొత్త ఆకాశాల కోసం, కొత్త భూమి కోసం మనం ఎదురుచూస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: కొత్త ఆకాశాలు, కొత్త భూమి
  rationale: καινός గుణరీత్యా కొత్తదనాన్ని సూచిస్తుంది. యెషయా 65:17; 66:22లోని సృష్టి సంబంధమైన ప్రతిధ్వనిని కాపాడేందుకు ‘ఆకాశాలు’, ‘భూమి’ అని అనువదించాం; ‘నూతనీకరించబడిన’ అనడం మూలపదం కంటే ఎక్కువ వ్యాఖ్యానాన్ని చేర్చుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలో ప్రస్తుత ఆకాశాలు, భూమి నాశనమవుతాయన్న మాటకు ఇది స్వల్ప వ్యత్యాసాన్ని చూపుతుంది.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: ఆయన వాగ్దానం ప్రకారం
  rationale: κατά + accusative ఇక్కడ అనుగుణతను సూచిస్తుంది; ἐπάγγελμα అంటే ‘వాగ్దానం’.
- source_word: προσδοκῶμεν
  choice: మనం ఎదురుచూస్తున్నాం
  rationale: వర్తమానకాల రూపం కొనసాగుతున్న నిరీక్షణను సూచిస్తుంది; ఈ తెలుగు రూపం భవిష్యత్తుపై ఆశతో కూడిన నిరంతర నిరీక్షణను సహజంగా తెలియజేస్తుంది.
- source_word: ἐν οἷς
  choice: నీతి నివసించే
  rationale: బహువచన సంబంధ సర్వనామం కొత్త ఆకాశాలు, కొత్త భూమి అనే సమష్టి నూతన సృష్టిని సూచిస్తుంది. తెలుగులో సంబంధ విశేషణ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: δικαιοσύνη దేవుని ఎదుట సరైనదిగా ఉండడం, న్యాయమైన క్రమం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘నీతి’ ఆ విస్తృత బైబిలు భావాన్ని కాపాడుతుంది; ‘న్యాయం’ సాధ్యమైన ప్రత్యామ్నాయ భావం.
- source_word: κατοικεῖ
  choice: నివసించే
  rationale: κατοικέω స్థిరంగా నివసించడం లేదా వాసం చేయడాన్ని సూచిస్తుంది. ‘నివసించే’ గౌరవప్రదంగా, స్పష్టంగా ఉండి స్థిరత్వాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: కొత్త సృష్టిలో దేవుని ఎదుట సరైనదైన సమగ్ర నైతిక క్రమం స్థిరంగా ఉండడాన్ని ‘నీతి’ విస్తృతంగా తెలియజేస్తుంది. అయితే ‘న్యాయం’ కూడా ఈ గ్రీకు పదంలోని నిజమైన భావఛాయ కాబట్టి పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కొత్త ఆకాశాలు, కొత్త భూమి’ అనే బైబిలు-సృష్టి భాషను నిలిపి, ‘ఎదురుచూస్తున్నాం’ ద్వారా కొనసాగుతున్న నిరీక్షణను వ్యక్తం చేశాం. పాదసూచిక గుర్తు ప్రధాన వాక్యం చివర ఉంచబడింది.
