id: 2PE.3.3
reference: 2 Peter 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: te
  text: 'మొదటగా, ఇది తెలుసుకోండి: చివరి రోజుల్లో అపహాస్యంతో[a], తమ సొంత కోరికల ప్రకారం నడుచుకొనే అపహాసకులు వస్తారు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అపహాస్యంలో అపహాసకులు వస్తారు.” ఉద్ఘాటన కోసం గ్రీకులో ఒకే మూలానికి చెందిన “అపహాస్యం,” “అపహాసకులు” అనే పదాలు వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: “కోరికలు” అనే పదాన్ని “వాంఛలు” లేదా “బలమైన కోరికలు” అని కూడా అనువదించవచ్చు. గ్రీకు పదం కేవలం లైంగిక కోరికలనే కాకుండా విస్తృతార్థంలో బలమైన కోరికలను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: మొదటగా ఈ సంగతి తెలుసుకోండి
  rationale: గ్రీకు వాక్యంలో ఇది కృదంత నిర్మాణమైనప్పటికీ, తెలుగులో సంబోధనాత్మక హెచ్చరికగా సహజంగా వినిపించేందుకు బహువచన ఆజ్ఞారూపం వాడబడింది. πρῶτον యొక్క ప్రాధాన్యాన్ని ‘మొదటగా’ నిలుపుతుంది.
- source_word: ἐλεύσονται
  choice: వస్తారు
  rationale: భవిష్యత్ కాల భావాన్ని సరళంగా, నేరుగా తెలియజేస్తుంది.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: చివరి రోజుల్లో
  rationale: కాలసూచకమైన, అంత్యకాల సంబంధమైన గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానార్థకం; నిర్దిష్ట అంత్యకాల వ్యవస్థను ఇందులో చేర్చదు.
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: అపహాస్యం చేస్తూ అపహాసకులు
  rationale: మూలంలోని సమానమూల పదాల పునరుక్తి ద్వారా వచ్చిన ఉద్ఘాటనను తెలుగులోనూ సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: తమ సొంత కోరికల ప్రకారం
  rationale: ἐπιθυμίαι అనే పదం కేవలం లైంగిక వాంఛలకే పరిమితం కాకుండా విస్తృతమైన బలమైన కోరికలను సూచించగలదు. ‘సొంత’ అనే పదం ἰδίας యొక్క ఉద్ఘాటనను నిలుపుతుంది.
- source_word: πορευόμενοι
  choice: నడుచుకుంటారు
  rationale: ఇది జీవన ప్రవర్తనను సూచించే రూపకం. తెలుగు ‘నడుచుకోవడం’ కూడా ప్రవర్తనా భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐπ’ ἐσχάτων τῶν ἡμερῶν అనే అంత్యకాల నుడికారం
  choice: చివరి రోజుల్లో
  alternative: రోజుల అంతంలో
  rationale: సాంప్రదాయిక అంత్యకాల భావాన్ని నిలుపుతూ, వచనం చెప్పని ఏ ప్రత్యేక సహస్రాబ్ద లేదా సంఘపరమైన అంత్యకాల పద్ధతినీ అనువాదంలో ప్రవేశపెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన హెచ్చరిక శైలి వాడబడింది. మూలంలోని ‘అపహాస్యం—అపహాసకులు’ అనే పదపునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది; ‘నడుచుకుంటారు’ జీవన ప్రవర్తన అనే రూపక భావాన్ని కాపాడుతుంది.
