id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: te
  text: అలాగే, అతడు తన పత్రికలన్నిటిలోనూ ఈ విషయాల గురించి మాట్లాడుతున్నాడు. వాటిలో అర్థం చేసుకోవడానికి కష్టమైన కొన్ని విషయాలు ఉన్నాయి. అజ్ఞానులూ[a] అస్థిరులూ మిగిలిన లేఖనాలను[c] వక్రీకరించినట్లే ఈ విషయాలను కూడా వక్రీకరిస్తారు[b], తమ సొంత నాశనానికే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేర్చుకోనివారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తప్పుగా మలుస్తారు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఇతర లేఖనాలను.’ గ్రీకు పదానికి ‘మిగిలిన’ లేదా ‘ఇతర’ అనే రెండు భావాలూ సాధ్యమే; ఇక్కడి పోలికలో ‘మిగిలిన లేఖనాలు’ మరింత సహజంగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: పత్రికలు
  rationale: వ్రాతపూర్వక ఉత్తరాలను సూచించే గౌరవప్రదమైన, సాధారణ తెలుగు పదం; సంప్రదాయ బైబిలు వాడుకతోనూ సరిపోతుంది.
- source_word: λαλῶν
  choice: మాట్లాడుతున్నాడు
  rationale: మూలంలోని ‘మాట్లాడుతూ’ అనే భావాన్ని నిలుపుతుంది; పత్రికల ద్వారా ఆ విషయాలను తెలియజేస్తున్న సందర్భం స్పష్టంగానే ఉంటుంది.
- source_word: περὶ τούτων
  choice: ఈ విషయాల గురించి
  rationale: τούτων అనే సూచనార్థక పదాన్ని సహజమైన తెలుగులో నేరుగా ప్రతిబింబిస్తుంది.
- source_word: δυσνόητά τινα
  choice: అర్థం చేసుకోవడానికి కష్టమైన కొన్ని విషయాలు
  rationale: τινα లోని అనిర్దిష్టతను, δυσνόητα లోని గ్రహించడంలోని కష్టాన్ని రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: ἀμαθεῖς
  choice: అజ్ఞానులు
  rationale: తెలియకపోవడం లేదా నేర్చుకోకపోవడం అనే విస్తృత భావాన్ని సంక్షిప్తంగా అందిస్తుంది; కేవలం నిరక్షరాస్యతను సూచించదు.
- source_word: ἀστήρικτοι
  choice: స్థిరత్వం లేనివారు
  rationale: నమ్మకంలో లేదా అవగాహనలో దృఢంగా స్థాపించబడని స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: στρεβλοῦσιν
  choice: వక్రీకరిస్తారు
  rationale: దేనినైనా దాని సరైన రూపం లేదా భావం నుంచి తిప్పివేయడం అనే రూపకాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὰς λοιπὰς γραφὰς
  choice: మిగిలిన లేఖనాలు
  rationale: γραφαί ను పవిత్ర లేఖనాలుగా సూచిస్తూ, λοιπάς లోని ‘మిగిలిన/ఇతర’ భావాన్ని నిలుపుతుంది.
- source_word: ἀπώλειαν
  choice: నాశనం
  rationale: తీవ్రమైన అంతిమ ఫలితాన్ని స్పష్టంగా తెలియజేస్తూ, మూలంలో లేని అదనపు సాంకేతిక సిద్ధాంత పదజాలాన్ని చేర్చదు.
theological_decisions:
- issue: τὰς λοιπὰς γραφὰς లో పౌలు పత్రికల లేఖన హోదాపై సూచన
  choice: మిగిలిన లేఖనాలు
  alternative: ఇతర రచనలు
  rationale: కొత్త నిబంధన సందర్భంలో γραφαί సాధారణంగా పవిత్ర లేఖనాలను సూచిస్తుంది; λοιπάς అనే పదం పౌలు పత్రికలను ఆ వర్గంలోని ఇతర లేఖనాలతో పోలుస్తున్న సహజ సూచనను నిలుపుతుంది. అయితే అనువాదం మూలపాఠాన్ని మించి సిద్ధాంత ప్రకటన చేయదు.
- issue: πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν యొక్క ఫలిత సంబంధం
  choice: అలా వారు తమ సొంత నాశనాన్ని తెచ్చుకుంటారు
  alternative: తమ సొంత నాశనానికే వాటిని వక్రీకరిస్తారు
  rationale: వక్రీకరణ వారి నాశనానికి దారితీస్తుందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; నాశనం స్వరూపాన్ని మరింత నిర్దిష్టంగా నిర్వచించకుండా మూలంలోని గంభీరతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘పత్రికలు,’ ‘లేఖనాలు,’ ‘నాశనం’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను నిలుపుతాయి. మూలంలోని భావసంబంధాన్ని సహజ తెలుగులో చూపేందుకు చివరి ఉపవాక్యాన్ని ఫలిత వాక్యంగా అందించాం.
