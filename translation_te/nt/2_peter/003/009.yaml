id: 2PE.3.9
reference: 2 Peter 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: te
  text: ప్రభువు తన వాగ్దానం విషయంలో ఆలస్యం చేయడం లేదు, కొందరు దానిని ఆలస్యమని భావిస్తున్నట్లుగా కాదు. ఆయన మీ పట్ల[a] సహనంతో ఉన్నాడు; ఎవరూ నశించకూడదని, అందరూ పశ్చాత్తాపానికి రావాలని కోరుతున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ విషయంలో సహనం చూపుతున్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: “ఎవరూ”, “అందరూ” అనే పదాల పరిధి గ్రీకులో ఉన్నట్లే ఇక్కడ ఉంచబడింది. పేతురు ప్రత్యేకంగా తన పాఠకులను ఉద్దేశిస్తున్నాడా, లేక మరింత విస్తృతంగా మానవాళిని ఉద్దేశిస్తున్నాడా అనే విషయంలో వ్యాఖ్యాతల అభిప్రాయాలు భిన్నంగా ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: సందర్భంలో దేవునికి వర్తించే గౌరవపూర్వక బిరుదుగా సహజమైన ప్రామాణిక తెలుగు రూపం.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: తన వాగ్దానం విషయంలో ఆలస్యం చేయడం లేదు
  rationale: βραδύνει యొక్క ఆలస్యం అనే భావాన్ని స్పష్టంగా ఉంచుతూ, గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘నెరవేర్చడంలో’ అనే వివరణను మూలంలో లేనందున చేర్చలేదు.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: కొందరు దానిని ఆలస్యంగా భావించినట్లు కాదు
  rationale: ἡγοῦνταιను ‘భావించడం’గా, βραδύτηταను ‘ఆలస్యం’గా అనువదించి ముందున్న βραδύνειతో పదభావ సంబంధాన్ని నిలుపుతుంది.
- source_word: μακροθυμεῖ
  choice: సహనంతో ఉన్నాడు
  rationale: దీర్ఘకాలం ఓర్పుగా నిరీక్షించే నియంత్రిత సహనాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ పట్ల
  rationale: εἰς సూచించే దిశాత్మక సంబంధాన్ని అతివ్యాఖ్యానం లేకుండా దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: μὴ βουλόμενός
  choice: కోరుతున్నాడు
  rationale: βούλομαιలోని సంకల్పం/కోరిక భావాన్ని ఉంచుతుంది; సాంకేతికమైన దైవ నిర్ణయ భావాన్ని దిగుమతి చేయదు.
- source_word: τινας ἀπολέσθαι
  choice: ఎవరూ నశించకూడదని
  rationale: ἀπολέσθαι యొక్క అకర్మక ‘నశించు’ భావాన్ని, తెలుగు ప్రతికూల వాక్య నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πάντας
  choice: అందరూ
  rationale: τιναςతో ఉన్న సంక్షిప్త వ్యతిరేక సమాంతరతను నిలిపి, పరిధిని అనువాదంలో కుదించదు లేదా విస్తరించదు.
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: పశ్చాత్తాపానికి రావాలని
  rationale: χωρῆσαι ఇక్కడ ఒక స్థితిలోకి చేరడాన్ని సూచిస్తుంది; μετάνοιαకు ప్రామాణికమైన ‘పశ్చాత్తాపం’ను ఉపయోగించి సహజమైన తెలుగు నుడికారాన్ని ఇస్తుంది.
theological_decisions:
- issue: ‘మీ’, ‘ఎవరూ’, ‘అందరూ’ అనే పదాల పరిధి
  choice: గ్రీకులో ఉన్నట్లే పరిధిని నిర్దిష్టంగా కుదించకుండా లేదా విశ్వవ్యాప్తంగా స్పష్టీకరించకుండా ఉంచడం
  alternative: ఇవి కేవలం పత్రిక పాఠకులు/ఎన్నుకోబడినవారికే వర్తిస్తాయని లేదా సమస్త మానవాళిని స్పష్టంగా సూచిస్తాయని అనువాదంలో చేర్చడం
  rationale: మూలపాఠం ఈ పరిధిని సిద్ధాంతపరంగా నిర్వచించదు; అందువల్ల దాని నిజమైన ఉద్వేగం, అస్పష్టతను నిలుపుకోవాలి.
- issue: βουλόμενόςలో దైవ చిత్తం యొక్క బలం
  choice: ‘కోరుతున్నాడు’
  alternative: ‘నిర్ణయించాడు’ లేదా సాంకేతికంగా ‘చిత్తగిస్తున్నాడు’
  rationale: పదంలోని సంకల్పం/అభిలాషను తెలియజేస్తూ, తరువాతి సిద్ధాంత వర్గీకరణలను వచనంలోకి చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘ఆలస్యం’ అనే మూలపద పునరుక్తి సాధ్యమైనంతవరకు నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
