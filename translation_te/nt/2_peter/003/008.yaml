id: 2PE.3.8
reference: 2 Peter 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: te
  text: 'అయితే ప్రియులారా, ఈ ఒక్క విషయం మీ దృష్టిని తప్పించుకోనివ్వకండి[a]: ప్రభువు దృష్టిలో ఒక రోజు వెయ్యి సంవత్సరాల వంటిది[c][b], వెయ్యి సంవత్సరాలు ఒక రోజు వంటివి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ ఒక్క విషయం గురించి తెలియనివారిగా ఉండకండి.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘వంటి’ అనే మాట పోలికను సూచిస్తుంది; ఒక రోజూ వెయ్యి సంవత్సరాలూ అక్షరార్థంగా సమానమని చెప్పడం లేదు.
    reason: cultural_note
  - marker: c
    text: కీర్తన 90:4ను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν ... τοῦτο
  choice: ఈ ఒక్క విషయం
  rationale: Ἓν ఇచ్చే ‘ఒక్క’ అనే ఉద్ఘాటనను, τοῦτο ఇచ్చే నిర్దిష్ట సూచనను రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: మీ దృష్టికి రాకుండా పోనివ్వకండి
  rationale: ‘గమనింపబడకుండా ఉండడం/దృష్టిని తప్పించుకోవడం’ అనే λανθάνω భావాన్ని, ఆజ్ఞార్థక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: తోటి విశ్వాసులను ఉద్దేశించిన ఆప్యాయమైన, గౌరవప్రదమైన సంబోధనను ఆధునిక ప్రామాణిక తెలుగులో అందిస్తుంది.
- source_word: παρὰ κυρίῳ
  choice: ప్రభువు దృష్టిలో
  rationale: παρά + చతుర్థీ విభక్తి ఇక్కడ సూచించే ప్రభువు సమక్షం లేదా ఆయన దృక్కోణం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; కేవలం భౌతిక సామీప్యంగా పరిమితం చేయదు.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: ఒక రోజు వెయ్యి సంవత్సరాల వంటిది
  rationale: ὡς సూచించే పోలికను ‘వంటిది’ స్పష్టంగా నిలుపుతుంది; అక్షరార్థ సమానత్వాన్ని సూచించదు.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: వెయ్యి సంవత్సరాలు ఒక రోజు వంటివి
  rationale: మొదటి పోలికకు సమతూకంగా ఉన్న రెండో పోలికను తెలుగులో సహజమైన వచనసామ్యంతో అందిస్తుంది.
- source_word: χίλια ἔτη
  choice: వెయ్యి సంవత్సరాలు
  rationale: మూలంలోని సాధారణ సంఖ్యా వ్యక్తీకరణను వ్యాఖ్యానాత్మక ప్రతీకీకరణ లేకుండా నేరుగా అందిస్తుంది.
theological_decisions:
- issue: కాలానికి సంబంధించిన పోలిక స్వభావం
  choice: ప్రభువుకు కాలంతో ఉన్న సంబంధాన్ని తెలిపే ఉపమానంగా అనువదించడం
  alternative: ఒక రోజును అక్షరార్థంగా వెయ్యి సంవత్సరాలకు సమానం చేయడం లేదా అంత్యకాల గణనకు సూత్రంగా చూపడం
  rationale: రెండుసార్లు వచ్చిన ὡς ‘వలె/వంటి’ అనే పోలికను సూచిస్తుంది. కాబట్టి అనువాదం సిద్ధాంతపరమైన కాలగణనను చొప్పించకుండా మూలంలోని ఉపమాన స్వభావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ‘ప్రియులారా’ అపొస్తలుని ఆప్యాయ సంబోధనను నిలుపుతుంది; రెండు కాలపోలికల సమతూకం సాధ్యమైనంతవరకు కాపాడబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
