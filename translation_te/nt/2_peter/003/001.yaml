id: 2PE.3.1
reference: 2 Peter 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: te
  text: ప్రియులారా, ఇప్పుడు నేను మీకు రాస్తున్న ఈ పత్రిక రెండవది. ఈ రెండు పత్రికలలోనూ[a] జ్ఞాపకం చేయడం ద్వారా మీ నిష్కపటమైన మనసును[b] మేల్కొలుపుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వాటిలో”; గ్రీకులో ఇది బహువచనం, అత్యంత సహజంగా రెండు పత్రికలను సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా “మీ నిర్మలమైన మనసును.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: బహువచన సంబోధనలోని ఆప్యాయతను, పత్రికా శైలికి తగిన గౌరవాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: ఇప్పుడు నేను మీకు రాస్తున్నది రెండవ పత్రిక
  rationale: గ్రీకు పదక్రమాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలోకి మార్చి, ప్రస్తుత రచన రెండవ పత్రిక అనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: γράφω
  choice: రాస్తున్నది
  rationale: పత్రిక రాస్తున్న ప్రస్తుత చర్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν αἷς
  choice: ఈ రెండింటిలోనూ
  rationale: స్త్రీలింగ బహువచన సాపేక్ష సర్వనామం ముందున్న రెండు పత్రికలను సూచిస్తున్న అత్యంత సహజమైన వ్యాకరణ పఠనాన్ని స్పష్టం చేస్తుంది.
- source_word: διεγείρω
  choice: మేల్కొలుపుతున్నాను
  rationale: నిష్క్రియత నుంచి జాగృతికి తెచ్చే రూపక భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: ἐν ὑπομνήσει
  choice: జ్ఞాపకం చేయడం ద్వారా
  rationale: జ్ఞాపకం చేయడమే మేల్కొలిపే సాధనం లేదా విధానం అనే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰλικρινῆ διάνοιαν
  choice: నిష్కపటమైన మనసును
  rationale: εἰλικρινής లోని నిజాయితీ/కల్మషరాహిత్య భావాన్ని, διάνοια లోని మనస్సు లేదా ఆలోచనా శక్తి భావాన్ని అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: ὑμῶν
  choice: మీ
  rationale: διάνοιαν‌ను విశేషించే సంబంధాన్ని సహజమైన తెలుగు స్వామ్యరూపంలో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἐν αἷς అనే బహువచన సాపేక్ష సర్వనామం దేనిని సూచిస్తుంది?
  choice: పేతురు గ్రహీతలకు రాసిన రెండు పత్రికల్ని సూచిస్తుంది.
  alternative: సడలించిన బహువచన ప్రయోగంగా ప్రస్తుత పత్రికను మాత్రమే సూచిస్తుంది.
  rationale: గ్రీకు సర్వనామం బహువచనంలో ఉండటం వల్ల, ఇప్పుడే ప్రస్తావించిన రెండు పత్రికలకే అది తిరిగి సూచించడం అత్యంత సహజమైన వ్యాకరణ పఠనం; దీనికి మించిన సిద్ధాంతపరమైన నిర్ధారణను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పత్రికా శైలి. “ప్రియులారా” ఆప్యాయ సంబోధనను, “మేల్కొలుపుతున్నాను” మూలంలోని రూపకాన్ని నిలుపుతాయి; నిజాయితీ మరియు నిర్మలత మధ్యనున్న పదార్థ విస్తృతిని పాదటిప్పణి సంరక్షిస్తుంది.
