revisions:
- from: అయితే ప్రభువు దినం దొంగ వచ్చినట్లు వస్తుంది. ఆ దినంలో ఆకాశాలు మహా ధ్వనితో గతించిపోతాయి; మూలపదార్థాలు మండుతూ విచ్ఛిన్నమవుతాయి[a]; భూమి, దానిలోని క్రియలు కనుగొనబడతాయి[b][c].
  to: అయితే ప్రభువు దినం దొంగవలె వస్తుంది. ఆ దినంలో ఆకాశాలు మహా ధ్వనితో గతించిపోతాయి; మూలపదార్థాలు మండుతూ విచ్ఛిన్నమవుతాయి[a]; భూమి, దానిలో ఉన్న పనులు కనుగొనబడతాయి[b][c].
  rationale: The revision removes the added past-tense element in the thief comparison and improves the natural Telugu rendering of ἔργα. It preserves the source text’s ambiguity, the difficult ‘will be found’ reading, all three footnote anchors, and the existing lexical/textual alternatives.
