review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the SBLGNT sequence and its difficult final reading, εὑρεθήσεται, as ‘కనుగొనబడతాయి,’ without importing the variant ‘burned up’ into the main text. ‘మూలపదార్థాలు’ appropriately leaves στοιχεῖα broad, and the footnotes preserve both the lexical and textual alternatives. However, ‘దొంగ వచ్చినట్లు వస్తుంది’ introduces a past-tense verbal comparison not present in ὡς κλέπτης and is less direct than the source’s ‘like a thief.’
  naturalness: The register is generally modern and suitably solemn. ‘దొంగవలె వస్తుంది’ is more idiomatic and direct than ‘దొంగ వచ్చినట్లు వస్తుంది.’ ‘దానిలోని క్రియలు’ can sound like actions in progress; ‘దానిలో ఉన్న పనులు’ more naturally conveys τὰ ἐν αὐτῇ ἔργα while retaining its breadth.
  terminology: ‘ప్రభువు దినం,’ ‘ఆకాశాలు,’ ‘మూలపదార్థాలు,’ and ‘భూమి’ are suitable. The proposed revision retains these terms and keeps the contested final clause formally transparent.
  issues:
  - severity: medium
    issue: The comparison ‘దొంగ వచ్చినట్లు’ adds an unnecessary past-tense verb.
    rationale: ὡς κλέπτης is simply ‘like a thief.’ Telugu can express this naturally as ‘దొంగవలె,’ preserving the compact comparison and the future force of ἥξει.
  - severity: low
    issue: ‘దానిలోని క్రియలు’ is less natural for τὰ ἐν αὐτῇ ἔργα.
    rationale: In this context ἔργα denotes works/deeds or things done, not specifically ‘actions’ as a grammatical category. ‘దానిలో ఉన్న పనులు’ is more idiomatic and remains noncommittal about the precise scope.
  revised_text: అయితే ప్రభువు దినం దొంగవలె వస్తుంది. ఆ దినంలో ఆకాశాలు మహా ధ్వనితో గతించిపోతాయి; మూలపదార్థాలు మండుతూ విచ్ఛిన్నమవుతాయి[a]; భూమి, దానిలో ఉన్న పనులు కనుగొనబడతాయి[b][c].
