id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: te
  text: అయితే ప్రభువు దినం దొంగవలె వస్తుంది. ఆ దినంలో ఆకాశాలు మహా ధ్వనితో గతించిపోతాయి; మూలపదార్థాలు మండుతూ విచ్ఛిన్నమవుతాయి[a]; భూమి, దానిలో ఉన్న పనులు కనుగొనబడతాయి[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మూలపదార్థాలు’ (στοιχεῖα) అనే మాటను ఈ సందర్భంలో ‘ఖగోళ వస్తువులు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కనుగొనబడతాయి’ అంటే ‘బయటపడతాయి’ లేదా ‘బహిర్గతమవుతాయి’ అని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: అనేక ప్రతుల్లో ‘కనుగొనబడతాయి’ అనే దానికి బదులు ‘కాలిపోతాయి’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: వస్తుంది
  rationale: ἥκω భవిష్యత్ రూపానికి సహజమైన అర్థం ‘వస్తుంది’; ‘ప్రభువు దినం’ అనే కర్తతో తెలుగులో ఇది సహజంగా ఉంటుంది.
- source_word: ἡμέρα κυρίου
  choice: ప్రభువు దినం
  rationale: ఇది వారపు ఆరాధన దినాన్ని కాక ప్రవచనాత్మక అంత్యకాల భావాన్ని సూచించే స్థిరమైన బైబిలు పదబంధం.
- source_word: ὡς κλέπτης
  choice: దొంగ వచ్చినట్లు
  rationale: పోలికలోని అకస్మాత్తు, ఊహించని రాక భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; మూలంలో క్రియ లేకపోయినా తెలుగులో పోలికను పూర్తి చేయడానికి ‘వచ్చినట్లు’ అవసరం.
- source_word: ἐν ᾗ
  choice: ఆ దినంలో
  rationale: సంబంధసర్వనామ నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా, ముందున్న ‘దినం’తో సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: οἱ οὐρανοὶ
  choice: ఆకాశాలు
  rationale: గ్రీకులోని బహువచనాన్ని, విశ్వవ్యాప్త తీర్పు సందర్భాన్ని నిలుపుతుంది.
- source_word: ῥοιζηδόν
  choice: మహా ధ్వనితో
  rationale: వేగంగా దూసుకుపోయే లేదా గర్జించే శబ్దాన్ని సూచించే ఈ క్రియావిశేషణానికి గంభీరమైన, సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: παρελεύσονται
  choice: గతించిపోతాయి
  rationale: అంత్యకాల సందర్భంలోని ‘pass away’ భావాన్ని, పూర్తిగా తొలగిపోవడాన్ని సూచించేలా అందిస్తుంది.
- source_word: στοιχεῖα
  choice: మూలపదార్థాలు
  rationale: విశ్వాన్ని నిర్మించే భాగాలు అనే విస్తృత భావాన్ని ఉంచుతుంది; ‘ఖగోళ వస్తువులు’ అని నిర్దిష్టంగా తేల్చదు.
- source_word: καυσούμενα
  choice: మండుతూ
  rationale: దహనం జరుగుతున్న స్థితిని సహజంగా తెలియజేస్తుంది; కార్యసాధకుణ్ణి చేర్చదు.
- source_word: λυθήσεται
  choice: విచ్ఛిన్నమవుతాయి
  rationale: λύω ఇక్కడ సూచించే విడిపోవడం లేదా కరిగిపోయి భాగాలుగా చెదరడం అనే భావాన్ని ‘నాశనమవుతాయి’ కంటే ఖచ్చితంగా నిలుపుతుంది.
- source_word: γῆ
  choice: భూమి
  rationale: ఆకాశాలు, మూలపదార్థాలు అనే విశ్వవ్యాప్త సందర్భంలో స్థానిక ‘దేశం’ కంటే ‘భూమి’ తగినది.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: దానిలోని క్రియలు
  rationale: ἔργα యొక్క ‘చేసిన పనులు/క్రియలు’ భావాన్ని నిలుపుతూ, కేవలం భౌతిక నిర్మాణాలు లేదా వస్తువులకే పరిమితం చేయదు.
- source_word: εὑρεθήσεται
  choice: కనుగొనబడతాయి
  rationale: ఇచ్చిన SBLGNT పాఠంలోని కఠినమైన ‘will be found’ అర్థాన్ని వ్యాఖ్యానంతో సులభీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται అనే చివరి వాక్యభాగం అర్థం
  choice: ‘భూమి, దానిలోని క్రియలు కనుగొనబడతాయి’ అనే కఠిన పాఠాన్ని ప్రధాన వచనంలో ఉంచడం
  alternative: ‘బయటపడతాయి/బహిర్గతమవుతాయి’; పాఠాంతరంగా ‘కాలిపోతాయి’
  rationale: ఇచ్చిన గ్రీకు పాఠంలో εὑρεθήσεται నేరుగా ‘కనుగొనబడుతుంది’ అని అర్థమిస్తుంది. అర్థం, పాఠం రెండూ వివాదాస్పదమైనందున ప్రధాన వచనంలో ఉద్రిక్తతను నిలిపి, ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇస్తున్నాం.
- issue: στοιχεῖα యొక్క సూచన
  choice: ‘మూలపదార్థాలు’ అని విస్తృతంగా అనువదించడం
  alternative: ‘ఖగోళ వస్తువులు’ లేదా ‘విశ్వపు ప్రాథమిక భాగాలు’
  rationale: ఈ సందర్భంలో పదం విశ్వపు భాగాలను లేదా మరింత నిర్దిష్టంగా ఖగోళ వస్తువులను సూచించవచ్చు. వచనం స్పష్టంగా తేల్చనందున ప్రధాన పాఠం విస్తృత భావాన్ని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా అంత్యకాల వర్ణనకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని కఠినమైన చివరి వాక్యాన్ని సులభీకరించలేదు. అన్ని పాదసూచిక సూచికలు ప్రధాన వచనంలో ఉన్నాయి.
