    reason: lexical_alternative
  - marker: b
    text: ‘కనుగొనబడతాయి’ అంటే ‘బయటపడతాయి’ లేదా ‘బహిర్గతమవుతాయి’ అని కొందరు అర్థం చేసుకుంటారు.
