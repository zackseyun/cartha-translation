id: 2PE.3.15
reference: 2 Peter 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: te
  text: మన ప్రభువు సహనాన్ని రక్షణగా భావించండి[a]. అలాగే, మన ప్రియ సహోదరుడు పౌలు కూడా తనకు ఇవ్వబడిన జ్ఞానానికి అనుగుణంగా మీకు రాశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘దీర్ఘ సహనాన్ని.’ భావం: ప్రభువు ఆలస్యం ఉదాసీనత వల్ల కాదు; అది రక్షణను ఉద్దేశించినది.'
    reason: lexical_alternative
  - marker: b
    text: ‘తనకు ఇవ్వబడిన జ్ఞానం’ అనే మాట దేవుడు ఇచ్చిన జ్ఞానాన్ని సూచిస్తున్నట్టు కనిపిస్తుంది; అయితే గ్రీకు పాఠ్యం దానిని ఇచ్చిన కర్తను స్పష్టంగా పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: సహనాన్ని
  rationale: ఈ సందర్భంలో తీర్పును ఆలస్యం చేస్తూ ఓర్పుతో ఉండడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సహనం’ సహజంగా, స్పష్టంగా ఉంది; ‘దీర్ఘశాంతం’ తక్కువ సహజమైన పదం.
- source_word: σωτηρίαν
  choice: రక్షణగా
  rationale: అంత్యకాల సందర్భంలో ప్రభువు ఆలస్యం రక్షించే ఉద్దేశాన్ని నెరవేర్చుతుందని సూచిస్తుంది. మూలంలోని నేరమైన విధేయ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἡγεῖσθε
  choice: భావించండి
  rationale: దేనినైనా ఒక నిర్దిష్ట రీతిగా పరిగణించమనే ఆజ్ఞార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: సందర్భంలో యేసును సూచించే బిరుదును, దాని వేదాంతపరమైన బలాన్ని నిలుపుతుంది.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: ప్రియ సహోదరుడు
  rationale: పౌలు పట్ల ఉన్న ఆప్యాయతను, విశ్వాస సమాజంలోని సోదర సంబంధాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: తనకు అనుగ్రహించబడిన జ్ఞానం ప్రకారం
  rationale: κατά యొక్క అనుగుణత భావాన్ని ‘ప్రకారం’ తెలియజేస్తుంది. కర్తను పేర్కొనని గ్రీకు కర్మణి రూపాన్ని తెలుగులోనూ నిలుపుతూ, ‘అనుగ్రహించబడిన’ అనే పదం జ్ఞానం ప్రసాదించబడిందనే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: ἔγραψεν ὑμῖν
  choice: మీకు రాశాడు
  rationale: గ్రీకు ఏఓరిస్టును సహజమైన సాధారణ భూతకాలంగా అనువదిస్తుంది.
- source_word: καθὼς καὶ
  choice: అలాగే ... కూడా
  rationale: పేతురు ఇచ్చిన ప్రబోధానికి పౌలు రాసినదాన్ని పోల్చి జోడించే భావాలను రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: ‘తనకు అనుగ్రహించబడిన జ్ఞానం’లో దైవిక కర్త సూచన
  choice: ప్రధాన పాఠ్యంలో కర్తను చేర్చకుండా కర్మణి రూపాన్ని నిలుపడం.
  alternative: దేవుడు తనకు అనుగ్రహించిన జ్ఞానం ప్రకారం
  rationale: జ్ఞానాన్ని ఇచ్చినవాడు దేవుడనే భావం ఉండవచ్చు; అయితే గ్రీకు వాక్యంలో కర్త స్పష్టంగా చెప్పబడలేదు. అందువల్ల అనువాదం అంతర్లీన భావాన్ని వివరణగా మార్చదు.
- issue: ప్రభువు ఆలస్యానికి సంబంధించిన భావం
  choice: ‘సహనాన్ని రక్షణగా భావించండి’ అనే నేరమైన నిర్మాణాన్ని నిలుపడం.
  alternative: సహనాన్ని రక్షణ పొందడానికి అవకాశంగా భావించండి
  rationale: మూలపాఠం ‘అవకాశం’ అనే పదాన్ని చేర్చకుండా ప్రభువు సహనాన్ని రక్షణగా పరిగణించమని నేరుగా చెబుతుంది. అందువల్ల వేదాంతపరమైన ఉద్రిక్తతను విస్తరించి పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘ప్రభువు,’ ‘రక్షణ,’ ‘సహోదరుడు,’ ‘జ్ఞానం’ వంటి పరిచిత బైబిలు పదాలు నిలుపబడ్డాయి; మూలంలో లేని వివరణాత్మక పదాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
