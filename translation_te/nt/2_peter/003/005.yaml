source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: te
  text: 'ఎందుకంటే, వారు కావాలనే ఈ సంగతిని విస్మరిస్తున్నారు[a]: ఆకాశాలు చాలా కాలం క్రితమే ఉన్నాయని, భూమి నీటి నుండి, నీటి ద్వారా దేవుని వాక్యంవల్ల[b] ఏర్పడిందని,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఇష్టపూర్వకంగానే ఈ సంగతిని గుర్తించరు.” గ్రీకు పదబంధంలో తెలియకపోవడం లేదా గమనించకపోవడంతో పాటు ఉద్దేశపూర్వకమైన వైఖరి కూడా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని ఆజ్ఞవల్ల.” మరింత అక్షరార్థంగా, “దేవుని వాక్యంవల్ల.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: ఎందుకంటే, వారు కావాలనే ఈ సంగతిని విస్మరిస్తున్నారు
  rationale: λανθάνει అనే ‘గమనానికి రాకపోవడం’ భావాన్నీ, θέλοντας అనే ఉద్దేశపూర్వక వైఖరినీ కలిపి సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇది కేవలం అనుకోని అజ్ఞానం కాదని స్పష్టం చేస్తుంది.
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: ఆకాశాలు ఎంతోకాలం క్రితమే ఉనికిలో ఉండేవనీ
  rationale: οὐρανοὶ యొక్క బహువచనాన్ని ‘ఆకాశాలు’గా నిలిపి, ἔκπαλαι యొక్క ప్రాచీన కాలసూచనను ‘ఎంతోకాలం క్రితమే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γῆ
  choice: భూమి
  rationale: తెలుగులో నిర్దిష్ట/అనిర్దిష్ట ఉపపదాల వ్యవస్థ లేనందున గ్రీకులో ఉపపదం లేకపోవడాన్ని కృత్రిమంగా చూపకుండా, సృష్టించబడిన లోకాన్ని సహజంగా ‘భూమి’ అని పేర్కొంటుంది.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: నీళ్లలోనుంచి, నీళ్ల ద్వారా
  rationale: ἐκ సూచించే మూలాన్ని ‘లోనుంచి’తోను, διά సూచించే సాధనం లేదా మాధ్యమాన్ని ‘ద్వారా’తోను వేరుగా నిలుపుతుంది.
- source_word: συνεστῶσα
  choice: ఏర్పడిందనీ
  rationale: పరిపూర్ణ కృదంతం సృష్టి సందర్భంలో భూమి ఏర్పడి ఉనికిలో నిలిచిన భావాన్ని ఇస్తుంది; ‘ఏర్పడింది’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: దేవుని వాక్యంవల్ల
  rationale: సాధనార్థక చతుర్థీ విభక్తిని ‘వల్ల’తో వ్యక్తం చేసి, λόγος‌ను ‘ఆజ్ఞ’గా మాత్రమే కుదించకుండా మూలంలోని ‘దేవుని వాక్యం’ అనే రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: λόγῳను వ్యక్తిగత ‘లోగోస్’కు స్పష్టమైన సూచనగా అనువదించాలా
  choice: దేవుని వాక్యంవల్ల
  alternative: దేవుని ఆజ్ఞవల్ల
  rationale: ఈ సందర్భంలో దేవుని సృజనాత్మకంగా కార్యసాధకమైన పలుకును సూచిస్తుంది; అయితే వచనం స్వయంగా కుమారుని బిరుదుగా స్పష్టీకరించదు. అందువల్ల క్రీస్తుసంబంధ ప్రత్యేకతను జోడించకుండా మూలంలోని భావపరమైన విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు బహువచనమైన ‘ఆకాశాలు’ను నిలిపి, ἐκ మరియు διά మధ్య తేడాను ‘లోనుంచి/ద్వారా’తో సంరక్షించాం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున ముగింపులో కామా ఉంచాం.
