  terminology: '''దైవభక్తి'' suitably conveys εὐσέβεια as reverent devotion. ''పవిత్రమైన నడవడిక'' preserves the ethical sense of ἁγίαις ἀναστροφαῖς without introducing doctrinal interpretation.'
