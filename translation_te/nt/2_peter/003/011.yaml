id: 2PE.3.11
reference: 2 Peter 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: te
  text: ఇవన్నీ ఈ విధంగా విచ్ఛిన్నమవుతున్నందున[a], పవిత్రమైన నడవడికలోను దైవభక్తిలోను మీరు ఎలాంటి వారై ఉండాలి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాశనమవుతున్నాయి’; గ్రీకు పదం మరింత అక్షరార్థంగా అవి ‘విడిపోతున్నాయి’ లేదా ‘విచ్ఛిన్నమవుతున్నాయి’ అని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: ఇవన్నీ
  rationale: ఈ మాటలు ముందరి సందర్భంలో ప్రస్తావించిన సృష్టిలోని సమస్తాన్ని సూచిస్తున్నాయి. ‘ఇవన్నీ’ అనేది తెలుగులో సహజంగా ఉండి, సూచిత విషయాలను అదనపు వివరణ లేకుండా తెలియజేస్తుంది.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: విచ్ఛిన్నమయ్యే తీరును సూచించే క్రియావిశేషణ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: λυομένων
  choice: విచ్ఛిన్నమవుతున్నాయి
  rationale: λύω పదంలోని విడిపోవడం, క్రమం చెదరిపోవడం అనే భావాన్ని ‘నాశనమవుతున్నాయి’ కంటే తక్కువ వ్యాఖ్యానాత్మకంగా వ్యక్తపరుస్తుంది; వర్తమాన కృదంత రూపంలోని కొనసాగుతున్న చర్య భావాన్నీ నిలుపుతుంది.
- source_word: ποταποὺς
  choice: ఎలాంటి వారిగా
  rationale: ఇది వ్యక్తుల రకం లేదా నైతిక గుణం గురించి అడిగే అలంకారిక ప్రశ్న. ‘ఎలాంటి వారిగా’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: δεῖ ὑπάρχειν ὑμᾶς
  choice: మీరు ... ఉండాలి
  rationale: అవసరతను తెలిపే δεῖ మరియు ‘ఉండడం’ అనే ὑπάρχειν భావాలను సహజమైన తెలుగు వాక్యనిర్మాణంలో కలిపి అందిస్తుంది.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: పవిత్రమైన ప్రవర్తనలోనూ
  rationale: ἀναστροφή జీవన ప్రవర్తనను సూచిస్తుంది. గ్రీకులోని బహువచనాన్ని తెలుగులో సహజమైన సమూహార్థక ఏకవచనంగా అందించింది.
- source_word: εὐσεβείαις
  choice: దైవభక్తిలోనూ
  rationale: εὐσέβεια దేవునిపట్ల భక్తిపూర్వక గౌరవం జీవితంలో వ్యక్తమవడాన్ని సూచిస్తుంది. ‘దైవభక్తి’ ఈ భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రస్తుత లోక క్రమానికి సంభవించే అంత్యకాల పరిణామం
  choice: విచ్ఛిన్నమవుతున్నాయి
  alternative: నాశనమవుతున్నాయి
  rationale: గ్రీకు పదం నేరుగా విడదీయబడటం లేదా క్రమం చెదరిపోవడం గురించి చెబుతుంది. సందర్భం అంత్యకాల విఘటనను సూచించినా, ‘నాశనం’ అని అనువదించడం మూలపదం కంటే భావాన్ని బలపరచవచ్చు; అందువల్ల అసలు రూపంలోని ఉద్రిక్తతను అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. అలంకారిక ప్రశ్న యొక్క నైతిక తీవ్రతను ఆశ్చర్యార్థక చిహ్నంతో వ్యక్తపరిచింది; మూలంలోని పదబంధ క్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు వాక్యప్రవాహాన్ని పాటించింది.
