id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: te
  text: పరిశుద్ధ ప్రవక్తలు ముందుగా పలికిన మాటలను[b], మీ అపొస్తలుల ద్వారా వచ్చిన ప్రభువు మరియు రక్షకుని ఆజ్ఞను[a] జ్ఞాపకం చేసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువు మరియు రక్షకుని నుండి మీ అపొస్తలుల ద్వారా వచ్చిన ఆజ్ఞను.’ గ్రీకులోని షష్ఠీవిభక్తి సంబంధాలను తెలుగులో ఒకటి కంటే ఎక్కువ సహజ విధాలుగా వ్యక్తపరచవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఇంతకు ముందు పలికిన మాటలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: జ్ఞాపకం చేసుకోవాలి
  rationale: ఈ క్రియారూపం సందర్భంలో ఉద్దేశాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘జ్ఞాపకం చేసుకోవాలి’ సహజంగా ఉండి, కేవలం తలచుకోవడం మాత్రమే కాక మనస్సులో ఉంచుకోవడం అనే విస్తృత భావాన్నీ ఇస్తుంది.
- source_word: προειρημένων ῥημάτων
  choice: ముందుగా పలికిన మాటలు
  rationale: προειρημένων కాలపూర్వతను సూచిస్తుంది; తప్పనిసరిగా భవిష్యద్వాణి చేయడం అనే సంకుచిత అర్థాన్ని కాదు. ‘ముందుగా పలికిన’ ఆ తేడాను కాపాడుతుంది.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: పరిశుద్ధ ప్రవక్తలు
  rationale: కర్తృవాచక ὑπό నిర్మాణాన్ని తెలుగులో సహజమైన కర్త-క్రియ సంబంధంగా వ్యక్తపరుస్తూ, ప్రవక్తల ‘పరిశుద్ధ’ స్థితిని నిలుపుతుంది.
- source_word: ἐντολῆς
  choice: ఆజ్ఞ
  rationale: ఏకవచనాన్ని నిలుపుతూ అధికారపూర్వకమైన ఆదేశం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: మీ అపొస్తలులు
  rationale: ὑμῶν పదాన్ని ἀποστόλων తో అనుసంధానించే సహజ పఠనాన్ని నిలుపుతుంది. ఇక్కడ ‘మీ’ అనేది పాఠకులతో సంబంధమున్న లేదా వారి వద్దకు పంపబడిన అపొస్తలులను సూచిస్తుంది.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: ప్రభువూ రక్షకుడూ అయినవారి నుండి
  rationale: ఒకే వ్యక్తిని సూచించే రెండు బిరుదులను నిలుపుతూ, ఆజ్ఞకు ప్రభువూ రక్షకుడూ మూలమనే సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది; గ్రీకులో లేని ‘మన’ అనే పదాన్ని చేర్చదు.
theological_decisions:
- issue: τῶν ἀποστόλων ὑμῶν లో ὑμῶν సంబంధం
  choice: ‘మీ’ అనేది ‘అపొస్తలులు’ను విశేషిస్తుంది
  alternative: ‘అపొస్తలులు మీకు ఇచ్చిన ఆజ్ఞ’
  rationale: పదక్రమం ὑμῶν ను ἀποστόλων తో అత్యంత సహజంగా కలుపుతుంది; దీన్ని ఆధునిక యాజమాన్య భావంలో కాక, పాఠకులతో సంబంధమున్న అపొస్తలులు అనే భావంలో గ్రహించాలి.
- issue: τοῦ κυρίου καὶ σωτῆρος యొక్క వాక్యనిర్మాణ సంబంధం
  choice: ఆజ్ఞ ప్రభువూ రక్షకుడూ అయినవారి నుండి వచ్చింది; అపొస్తలులు దానిని అందించారు
  alternative: ప్రభువూ రక్షకుడూ అయినవారి ఆజ్ఞ మీ అపొస్తలుల ద్వారా వచ్చింది
  rationale: గ్రీకు షష్ఠీవిభక్తుల వరుసను తెలుగులో ఒకటి కంటే ఎక్కువ సహజ విధాలుగా వ్యక్తపరచవచ్చు. ప్రధాన పాఠం ఆజ్ఞ యొక్క మూలాన్ని ప్రభువులో ఉంచి, అపొస్తలుల మధ్యవర్తిత్వాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో కాపాడింది.
- issue: κυρίου καὶ σωτῆρος సూచించే వ్యక్తి
  choice: ‘ప్రభువు’ మరియు ‘రక్షకుడు’ ఒకే వ్యక్తికి చెందిన రెండు బిరుదులుగా అనువదించబడ్డాయి
  alternative: రెండు వేర్వేరు సూచ్యులుగా చదవడం
  rationale: ఒకే నిర్దిష్ట ఉపపదంతో అనుసంధానమైన ఈ రెండు ఏకవచన నామాలు సందర్భంలో ఒకే వ్యక్తిని సూచించడం అత్యంత సహజం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘అపొస్తలులు’ అనే స్థిరపడిన నూతన నిబంధన పదాన్ని ఉపయోగించాం. ఇది 3:1లో మొదలైన వాక్యానికి కొనసాగింపు కావడంతో, సందర్భానుసారంగా ‘జ్ఞాపకం చేసుకోవాలి’ అని ముగించబడింది. మూలంలోని షష్ఠీవిభక్తి అస్పష్టతను ప్రధాన పాఠంలో బలవంతంగా పూర్తిగా పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
