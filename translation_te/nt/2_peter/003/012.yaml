id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: te
  text: దేవుని దినం రాక కోసం ఎదురుచూస్తూ, ఆ రాకను త్వరపరుస్తూ[a] ఉండండి. ఆ దినం కారణంగా ఆకాశాలు అగ్నితో మండిపోతూ విచ్ఛిన్నమవుతాయి; మూలకాలు[b] మండుతూ కరిగిపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని దినం రాక కోసం ఆత్రంగా ఎదురుచూస్తూ.” ఇక్కడి గ్రీకు క్రియకు “త్వరపరచడం” లేదా “ఆత్రంగా ఎదురుచూడడం” అనే భావాలు రావచ్చు.
    reason: alternative_reading
  - marker: b
    text: “మూలకాలు” అనేది ప్రపంచంలోని ప్రాథమిక భాగాలను లేదా బహుశా ఖగోళ వస్తువులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: ఎదురుచూస్తూ
  rationale: ఈ వర్తమాన కృదంతం నిరీక్షణతో కూడిన ఎదురుచూపును సూచిస్తుంది; మునుపటి వాక్యంలోని ఉపదేశాన్ని కొనసాగించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: σπεύδοντας
  choice: త్వరపరుస్తూ
  rationale: παρουσίαν అనే ప్రత్యక్ష కర్మతో వచ్చినందున ‘రాకను త్వరపరచడం’ అనే వ్యాకరణపరంగా సూటి భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; ‘ఆత్రంగా ఎదురుచూడడం’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: παρουσίαν
  choice: రాక
  rationale: అంత్యకాల సందర్భంలో ‘రాక’ అనేది παρουσία యొక్క చేరిక/ప్రత్యక్షత భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: దేవుని దినపు
  rationale: సాధారణంగా కనిపించే ‘ప్రభువు దినం’ అనే పదబంధంతో దీనిని కలపకుండా, గ్రీకులోని ప్రత్యేకమైన ‘దేవుని దినం’ అనే వ్యక్తీకరణను నిలిపింది.
- source_word: δι’ ἣν
  choice: ఆ దినం కారణంగా
  rationale: διά + accusative ఇక్కడ కారణాన్ని సూచించడం సందర్భానికి తగినది; సంబంధసర్వనామం సూచించే ‘దినం’ను తెలుగులో స్పష్టంగా పునరుక్తి చేశాం.
- source_word: οὐρανοὶ
  choice: ఆకాశాలు
  rationale: గ్రీకు బహువచనాన్ని నిలిపి, విశ్వసంబంధమైన ఆకాశాలను సూచించే సాధారణ తెలుగు పదాన్ని వాడాం.
- source_word: πυρούμενοι
  choice: నిప్పంటుకొని
  rationale: ఆకాశాలు అగ్నికి లోనవుతున్న భావాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: λυθήσονται
  choice: విచ్ఛిన్నమవుతాయి
  rationale: λύω ఇక్కడ విప్పబడడం లేదా నిర్మాణం చెదిరిపోవడం అనే భావం ఇస్తుంది; సంపూర్ణ అస్తిత్వనాశాన్ని అనవసరంగా సూచించకుండా ‘విచ్ఛిన్నమవుతాయి’ అని అనువదించాం.
- source_word: στοιχεῖα
  choice: మూలకాలు
  rationale: ప్రపంచపు ప్రాథమిక అంశాలు లేదా ఆకాశ సంబంధ పదార్థాలు అనే చర్చనీయమైన అర్థాలను పూర్తిగా నిర్ణయించకుండా ఉంచే విస్తృత పదం.
- source_word: καυσούμενα
  choice: మండుతూ
  rationale: అగ్ని లేదా తీవ్రమైన వేడికి లోనై మండుతున్న భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τήκεται
  choice: కరిగిపోతాయి
  rationale: తీవ్రమైన వేడివల్ల కరగడం అనే అర్థాన్ని తెలియజేస్తుంది; చుట్టూ ఉన్న భవిష్యత్ క్రియల సందర్భానుసారం తెలుగులో భవిష్యత్ రూపాన్ని వాడాం.
theological_decisions:
- issue: σπεύδοντας τὴν παρουσίαν యొక్క భావం
  choice: ఆ రాకను త్వరపరుస్తూ
  alternative: దేవుని దినపు రాకకోసం ఆత్రంగా ఎదురుచూస్తూ
  rationale: గ్రీకు పదబంధం రాకను త్వరపరచడం లేదా దాని కోసం ఆత్రంగా ఉండడం అనే రెండు భావాలకు అవకాశం ఇస్తుంది. ప్రత్యక్ష కర్మతో కూడిన సూటి భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, కారణసంబంధమైన వేదాంత నిర్ధారణను బలవంతం చేయకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: στοιχεῖα దేనిని సూచిస్తుంది
  choice: మూలకాలు
  alternative: ఆకాశ ఖగోళాలు లేదా ప్రపంచపు ప్రాథమిక భాగాలు
  rationale: అంత్యకాల సందర్భంలో ఈ పదం దేనిని సూచిస్తుందో వివాదాస్పదం. ఒక నిర్దిష్ట విశ్వనిర్మాణ సిద్ధాంతాన్ని పాఠ్యంలోకి తీసుకురాకుండా విస్తృతమైన పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే అంత్యకాల వర్ణనకు తగిన గంభీరతతో అనువదించాం. గ్రీకు కృదంతాలు మునుపటి వాక్య ఉపదేశాన్ని కొనసాగిస్తున్నందున తెలుగులో సహజమైన సంపూర్ణ వాక్యంగా ‘ఉండండి’ని పూరించాం. నిజమైన రెండు అర్థాల అవకాశాలను పాదటిప్పణుల్లో నిలిపాం.
