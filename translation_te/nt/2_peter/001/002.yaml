source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: te
  text: దేవుని గురించిన, మన ప్రభువైన యేసు గురించిన జ్ఞానంలో మీకు కృపా శాంతులు విస్తరించుగాక.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని గురించిన, మన ప్రభువైన యేసు గురించిన జ్ఞానం ద్వారా.” గ్రీకు విభక్త్యుపసర్గం “లో” అనే పరిధి భావాన్నిగానీ, “ద్వారా” అనే సాధన భావాన్నిగానీ సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: “జ్ఞానం” అని అనువదించిన గ్రీకు పదం మరింత సంపూర్ణమైన లేదా పూర్తి జ్ఞానం అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పత్రికా ఆశీర్వాదంలో వాడే ప్రామాణిక పదం; దేవుని అనుగ్రహం అనే వేదాంతపరమైన భావాన్ని, అభివాద సూత్రంలోని గౌరవాన్ని కాపాడుతుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: అభివాదాల్లో సహజమైన, వేదాంతపరంగా సమృద్ధమైన పదం; క్షేమం అనే సెమిటిక్ నేపథ్య భావాన్నీ మోయగలదు.
- source_word: πληθυνθείη
  choice: విస్తరించుగాక
  rationale: ఆశీర్వాద కోరికను తెలిపే అఒరిస్ట్ పాసివ్ ఆప్టేటివ్ భావాన్ని సహజమైన ఆధునిక తెలుగు ఆశీర్వాద రూపంలో వ్యక్తం చేస్తుంది; సమృద్ధిగా పెరగడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: ἐν
  choice: లో
  rationale: స్థితి లేదా పరిధిని సూచించే ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సాధనం అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో కాపాడుతుంది.
- source_word: ἐπιγνώσει
  choice: జ్ఞానం
  rationale: సహజమైన తెలుగు అనువాదం; మరింత సంపూర్ణమైన జ్ఞానం అనే బలమైన ఛాయను అవసరానికి మించి ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయకుండా పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: θεοῦ
  choice: దేవుని గురించి
  rationale: ἐπίγνωσις‌పై ఆధారపడే సంబంధవాచకాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే క్రీస్తు బిరుదుకు ప్రామాణిక తెలుగు రూపం; దాని గౌరవాన్నీ క్రీస్తుశాస్త్ర సంబంధిత బరువునీ నిలుపుతుంది.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: దేవుని గురించిన, మన ప్రభువైన యేసును గురించిన
  rationale: జ్ఞానం దేవునికీ యేసుకీ సంబంధించినదని తెలుగులో స్పష్టంగా చూపుతూ, గ్రీకులోని రెండు భిన్న వ్యక్తుల సూచనను సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: ఆధ్యాత్మిక సందర్భంలో ἐπίγνωσις పదంలోని బలమైన భావఛాయ
  choice: జ్ఞానం
  alternative: సంపూర్ణ జ్ఞానం; పూర్తి జ్ఞానం
  rationale: ఈ పదం మరింత సంపూర్ణమైన జ్ఞానాన్ని సూచించగలిగినా, ప్రధాన పాఠ్యంలో ‘జ్ఞానం’ అని ఉంచడం వల్ల సందర్భం నిర్దేశించని సాంకేతిక వేదాంత భావాన్ని చేర్చకుండా ఉంటుంది; బలమైన ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
- issue: ἐπιγνώσειతో వాడిన ἐν యొక్క భావం
  choice: జ్ఞానంలో
  alternative: జ్ఞానం ద్వారా; జ్ఞానం మూలంగా
  rationale: గ్రీకు విభక్త్యుపసర్గం పరిధి లేదా స్థితిని (‘లో’), లేక సాధనాన్ని (‘ద్వారా’) సూచించగలదు. ప్రధాన పాఠ్యం ప్రత్యక్ష రూపాన్ని ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా ఆశీర్వాద శైలి. ‘విస్తరించుగాక’ అనే రూపం మూలంలోని కోరిక/ఆశీర్వాద భావాన్ని సహజంగా నిలుపుతుంది. సంబంధవాచక నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం ‘గురించిన’ అని వ్యక్తం చేశాం; మూలంలోని సందిగ్ధతలు పాదటిప్పణుల్లో భద్రపరచబడ్డాయి.
