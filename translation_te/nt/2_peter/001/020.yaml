id: 2PE.1.20
reference: 2 Peter 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: te
  text: 'మొదటగా మీరు ఇది తెలుసుకోవాలి: లేఖనంలోని ఏ ప్రవచనమూ ఎవరి సొంత వివరణవల్ల కూడా కలుగదు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సొంత వివరణ” అనేది ప్రవక్త సొంత వివరణను సూచించవచ్చు; లేదా ఎవరి వ్యక్తిగత వివరణనైనా సూచించవచ్చు. గ్రీకు పదబంధం దీనిని స్పష్టంగా నిర్ణయించదు.
    reason: ἰδίας ἐπιλύσεως అనే పదబంధంలో “సొంత” అనేది ఎవరికి చెందుతుందో స్పష్టంగా లేకపోవడం వల్ల ఉన్న నిజమైన అర్థసందిగ్ధతను నమోదు చేయడానికి.
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: మొదటిగా మీరు ఇది తెలుసుకోవాలి
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన ఆదేశార్థక వాక్యంగా వ్యక్తం చేస్తూ, πρῶτον యొక్క ప్రాధాన్య భావాన్ని నిలిపింది.
- source_word: πᾶσα προφητεία γραφῆς
  choice: లేఖనంలోని ప్రతి ప్రవచనం
  rationale: πᾶσα యొక్క ‘ప్రతి’ భావాన్నీ, γραφῆς‌తో ప్రవచనానికి ఉన్న సంబంధాన్నీ నేరుగా నిలిపింది.
- source_word: ἰδίας ἐπιλύσεως
  choice: ఎవరి సొంత వివరణవల్లా
  rationale: ἰδίας లోని ‘సొంత’ భావాన్ని ఉంచి, అది ప్రవక్త సొంత వివరణనా లేక మరొకరి వ్యక్తిగత వివరణనా అన్న గ్రీకు వాక్యంలోని అనిశ్చితిని సాధ్యమైనంతవరకు తెరిచి ఉంచింది.
- source_word: οὐ γίνεται
  choice: ఉద్భవించదు
  rationale: γίνεταιను కేవలం ‘ఉంది’ అని కాక, ‘కలుగుతుంది/ఉద్భవిస్తుంది’ అనే ఆవిర్భావ భావంతో అనువదించింది.
theological_decisions:
- issue: ప్రవచనం మరియు ‘సొంత వివరణ’ మధ్య సంబంధం
  choice: ఎవరి సొంత వివరణవల్లా ఉద్భవించదు
  alternative: వ్యక్తిగత వ్యాఖ్యానానికి లోబడదు
  rationale: ప్రత్యామ్నాయం ఈ వాక్యాన్ని ప్రధానంగా పాఠకుడు లేఖనాన్ని ఎలా వ్యాఖ్యానించాలనే నియమంగా నిర్ణయిస్తుంది. అయితే సందర్భం ప్రవచనం ఎలా ఉద్భవించిందనే దిశలోనూ చదవవచ్చు; అందువల్ల ఆ సిద్ధాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా మూలంలోని ఆవిర్భావ భాషను నిలిపింది.
- issue: πᾶσα … οὐ నిర్మాణం
  choice: ప్రతి ప్రవచనం … ఉద్భవించదు
  alternative: ఏ ప్రవచనమూ … ఉద్భవించదు
  rationale: సహజ తెలుగులో రెండూ సమాన విస్తృత నిరాకరణను ఇవ్వగలిగినా, మూలంలోని ‘ప్రతి … కాదు’ నిర్మాణాన్ని మరియు ఆడిట్ చేయబడిన సంప్రదింపు పాఠాన్ని దగ్గరగా అనుసరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ‘లేఖనం’, ‘ప్రవచనం’ వంటి గౌరవప్రదమైన బైబిలు పదజాలాన్ని నిలిపింది.
