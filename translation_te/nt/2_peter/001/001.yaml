reference: 2 Peter 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: te
  text: 'యేసు మెస్సీయకు దాసుడూ అపొస్తలుడూ అయిన సిమ్యోను పేతురు నుండి—మన దేవుడూ రక్షకుడూ అయిన యేసు మెస్సీయ[c] నీతిలో[b], మాతో సమాన విలువగల విశ్వాసాన్ని[a] పొందినవారికి:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాతో సమాన గౌరవం గల విశ్వాసాన్ని,’ ‘మా విశ్వాసంతో సమానమైన అమూల్య విశ్వాసాన్ని.’ ఈ విశేషణం సమాన విలువ, గౌరవం లేదా హక్కును నొక్కిచెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీతి ద్వారా,’ ‘నీతి మూలంగా.’ గ్రీకు విభక్తి ఇక్కడ పరిధిని లేదా సాధనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు వాక్యనిర్మాణం అత్యంత సహజంగా యేసు మెస్సీయనే ‘మన దేవుడూ రక్షకుడూ’ అని పిలుస్తోంది. తక్కువ సంభావ్యంగా, ‘మన దేవుని మరియు మన రక్షకుడైన యేసు మెస్సీయ యొక్క నీతిలో’ అని, దేవుడు మరియు యేసు అనే ఇద్దరు వ్యక్తులను సూచించినట్లుగా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: సుమెయోను పేతురు
  rationale: మూలపాఠంలోని Συμεών రూపాన్ని ‘సీమోను’గా మార్చకుండా ‘సుమెయోను’గా ప్రతిబింబించాం; Πέτροςకు తెలుగులో స్థిరపడిన ‘పేతురు’ వాడాం.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: ఇది కేవలం సేవచేసే వ్యక్తినే కాక, యేసు మెస్సీయకు పూర్తిగా చెందినవాడనే భావాన్నీ మోస్తుంది. ‘దాసుడు’ ఆ బంధిత సమర్పణ భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: ప్రత్యేకంగా పంపబడిన అధికారిక సాక్షి అనే భావానికి క్రైస్తవ తెలుగు వాడుకలో స్థిరపడిన, సందర్భానికి ఖచ్చితమైన పదం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστόςను కేవలం పేరులో భాగంగా కాక ‘మెస్సీయ’ అనే బిరుదుగా అనువదించాం.
- source_word: τοῖς ... λαχοῦσιν
  choice: పొందినవారికి
  rationale: λαγχάνωలోని కేటాయింపుగా లేదా అనుగ్రహంగా పొందడం అనే భావాన్ని, వారు సాధించుకున్నారనే అర్థం రాకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἰσότιμον ... πίστιν
  choice: మాతో సమాన విలువగల విశ్వాసాన్ని
  rationale: ἰσότιμος సూచించే సమాన విలువ, గౌరవం, హోదా అనే భావాలలో ప్రధానమైన సమానత్వాన్ని స్పష్టంగా ఉంచుతుంది; ఇతర సాధ్యమైన ఛాయలను పాదసూచికలో ఇచ్చాం.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో విశ్వాసులూ అపొస్తలులూ పంచుకునే నమ్మకాన్ని సూచించే సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: ἐν δικαιοσύνῃ
  choice: నీతిలో
  rationale: ἐν అనే విభక్తి సాధనం (‘ద్వారా’) లేదా పరిధి (‘లో’) రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలో రూపానికి దగ్గరగా ‘నీతిలో’ ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: δικαιοσύνῃ
  choice: నీతి
  rationale: δικαιοσύνηకు ఈ సందర్భంలో దేవుని న్యాయసమ్మతమైన సద్గుణం లేదా న్యాయక్రియ రెండింటినీ మోయగల సాధారణ తెలుగు సమానం.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: మన దేవుడూ రక్షకుడూ అయిన యేసు మెస్సీయ
  rationale: ఒకే ఉపపదం కింద θεός, σωτήρ రెండూ కలపబడిన గ్రీకు నిర్మాణం సహజంగా ఒకే వ్యక్తిని—యేసును—దేవుడూ రక్షకుడూ అని సూచిస్తుంది.
theological_decisions:
- issue: ‘మన దేవుడూ రక్షకుడూ అయిన యేసు మెస్సీయ’ అన్నది ఒకే వ్యక్తిని సూచిస్తుందా, లేక తండ్రినీ యేసునూ వేర్వేరుగా సూచిస్తుందా?
  choice: 'ఒకే వ్యక్తి: యేసు ‘మన దేవుడూ రక్షకుడూ’ అని పిలువబడ్డాడు.'
  alternative: 'ఇద్దరు వ్యక్తులు: ‘మన దేవుడు’ మరియు ‘రక్షకుడైన యేసు మెస్సీయ’.'
  rationale: ఒకే ఉపపదంతో, καί చేత కలపబడిన రెండు ఏకవచన వ్యక్తివాచక నామాల గ్రీకు నిర్మాణం ఒకే వ్యక్తిని సూచించడాన్ని బలంగా సమర్థిస్తుంది. అయినా, క్రీస్తు స్వరూపానికి సంబంధించిన ఈ ముఖ్యమైన ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో నిలిపాం.
- issue: ἐν δικαιοσύνῃలో ἐν పరిధిని సూచిస్తుందా లేక సాధనాన్ని సూచిస్తుందా?
  choice: ప్రధాన పాఠంలో ‘నీతిలో’ అని ఉంచి పరిధి భావాన్ని, అలాగే గ్రీకు రూపంలోని అనిశ్చితిని సాధ్యమైనంతవరకు నిలిపాం.
  alternative: ‘నీతి ద్వారా’ లేదా ‘నీతి మూలంగా’ అని సాధనార్థంగా చదవవచ్చు.
  rationale: ఈ సందర్భంలో ἐνకు స్థానిక/పరిధి భావమూ సాధనార్థమూ వ్యాకరణపరంగా సాధ్యమే; ప్రధాన పాఠంలో ఒక్క భావాన్ని ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన లేఖారంభ శైలిని వాడాం. ‘దాసుడు,’ ‘అపొస్తలుడు,’ ‘మెస్సీయ,’ ‘నీతి,’ ‘విశ్వాసం’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచినా, వాక్యనిర్మాణాన్ని సాధారణ పాఠకుడికి సులభంగా ఉండేలా తీర్చిదిద్దాం. మూలంలోని సంబోధనా నిర్మాణాన్ని నిలుపుటకు చివర ద్విబిందువు వాడాం.
