source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయ నాకు స్పష్టం చేసినట్టుగానే, నా గుడారాన్ని విడిచిపెట్టడం త్వరలోనే జరుగుతుందని[a][b] నాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా గుడారాన్ని తీసివేయడం’ అని కూడా అనువదించవచ్చు. ఇది సమీపిస్తున్న మరణాన్ని తాత్కాలిక నివాసమైన గుడారాన్ని విడిచిపెట్టడంగా చెప్పే రూపకం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సమీపంలో ఉందని.’
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: నాకు తెలుసు
  rationale: ముందటి వాక్యంతో ఉన్న సంబంధాన్ని నిలుపుతూ, గ్రీకు కృదంతంలోని జ్ఞానార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దానిని తప్పనిసరిగా కారణార్థకంగా మార్చదు.
- source_word: ταχινή
  choice: త్వరలోనే జరుగుతుంది
  rationale: ఈ విశేషణం సంఘటన త్వరలో లేదా సమీపంలో ఉండటాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో విధేయార్థం స్పష్టంగా ఉండేందుకు ‘జరుగుతుంది’ చేర్చబడింది; ఖచ్చితమైన కాలపరిమితిని విధించలేదు.
- source_word: ἀπόθεσις
  choice: విడిచిపెట్టడం
  rationale: తీసివేయడం లేదా పక్కన పెట్టడం అనే మూలభావాన్ని సహజంగా తెలియజేస్తూ, నేరుగా ‘మరణం’ అని వ్యాఖ్యానించకుండా రూపకాన్ని నిలుపుతుంది.
- source_word: σκηνώματός
  choice: గుడారం
  rationale: తాత్కాలిక నివాసమనే రూపకాన్ని కాపాడుతుంది. ‘శరీరం’ అని అనువదిస్తే సూచితార్థం స్పష్టమవుతుంది గాని మూలంలోని దృశ్యరూపం పోతుంది.
- source_word: καθὼς καὶ
  choice: చేసినట్టుగానే
  rationale: పోలికతో పాటు ప్రభువు ముందుగా స్పష్టం చేసిన విషయాన్ని ధ్రువీకరించే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ యేసుకు వర్తించే ప్రామాణిక గౌరవబిరుదును నిలుపుతుంది.
- source_word: Ἰησοῦς Χριστός
  choice: మెస్సీయ యేసు
  rationale: Χριστόςను కేవలం పేరులోని భాగంగా కాక ‘మెస్సీయ’ అనే బిరుదుగా వ్యక్తం చేస్తుంది; తెలుగులో బిరుదును పేరుకు ముందు ఉంచడం ద్వారా ఆ బిరుదార్థం స్పష్టమవుతుంది.
- source_word: ἐδήλωσέν μοι
  choice: నాకు స్పష్టం చేశాడు
  rationale: తెలియజేయడం లేదా స్పష్టం చేయడం అనే క్రియార్థాన్ని, ప్రత్యేక ప్రకటనకు మించిన భావాన్ని బలవంతంగా చేర్చకుండా అందిస్తుంది.
theological_decisions:
- issue: పేతురు సమీపిస్తున్న మరణానికి ఉపయోగించిన రూపకం
  choice: ‘నా గుడారాన్ని విడిచిపెట్టడం’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘నేను త్వరలో చనిపోతాను’ లేదా ‘నా మరణం సమీపించింది’
  rationale: గ్రీకు పాఠం శరీర జీవితం తాత్కాలిక గుడారంలాంటిదనే రూపకాన్ని వాడుతుంది. దాన్ని నేరుగా ‘మరణం’గా మార్చకుండా ఉంచడం మూలంలోని చిత్రణను, దాని భావసాంద్రతను కాపాడుతుంది.
- issue: Ἰησοῦς Χριστόςలో Χριστός యొక్క బిరుదార్థం
  choice: ‘మెస్సీయ యేసు’
  alternative: ‘యేసు క్రీస్తు’
  rationale: ఇక్కడ Χριστόςలోని ‘మెస్సీయ’ అనే బిరుదార్థాన్ని పాఠకుడికి ప్రత్యక్షంగా అందిస్తుంది; దాన్ని ఇంటిపేరులాంటి స్థిర నామరూపంగా మాత్రమే చూపదు.
- issue: ταχινή యొక్క కాలసంబంధ భావం
  choice: ‘త్వరలోనే జరుగుతుంది’
  alternative: ‘సమీపించింది’
  rationale: గ్రీకు పదం సంఘటన త్వరగా సంభవించడానికీ, సమీపంలో ఉండడానికీ వీలు ఇస్తుంది. ప్రధాన పాఠంలో సహజమైన కాలార్థాన్ని ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చి అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే శైలి ఉపయోగించబడింది. గ్రీకు కృదంతాన్ని సహజ తెలుగు ప్రధాన క్రియగా మార్చి, మూలంలోని గుడారం-శరీరం రూపకాన్ని నిలిపాం. ‘మెస్సీయ’ను బిరుదుగా స్పష్టపరచేందుకు పేరుకు ముందు ఉంచాం.
