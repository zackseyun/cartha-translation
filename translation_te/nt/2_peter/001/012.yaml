id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: te
  text: కాబట్టి, ఈ విషయాలు మీకు తెలిసి, మీరు ప్రస్తుత సత్యంలో స్థిరపరచబడి ఉన్నప్పటికీ, ఈ విషయాల గురించి మీకు ఎల్లప్పుడూ గుర్తుచేయడానికి నేను సిద్ధంగా ఉంటాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: μελλήσω
  choice: నేను సిద్ధంగా ఉంటాను
  rationale: ఇక్కడ μέλλω తక్షణ భవిష్యత్తును మాత్రమే కాక, నిరంతర ఉద్దేశాన్ని లేదా సంసిద్ధతను తెలియజేస్తుంది; అందువల్ల పేతురు వారిని మళ్లీ మళ్లీ జ్ఞాపకం చేయాలనే సంకల్పం వ్యక్తమవుతుంది.
- source_word: ἀεὶ
  choice: ఎల్లప్పుడూ
  rationale: పునరావృతంగా, నిరంతరం జరిగే చర్యను నేరుగా తెలియజేస్తుంది.
- source_word: ὑπομιμνῄσκειν
  choice: గుర్తుచేయడానికి
  rationale: ఎవరైనా ఇప్పటికే తెలిసిన విషయాన్ని మళ్లీ వారి జ్ఞాపకానికి తేవడం అనే క్రియార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περὶ τούτων
  choice: వీటిని
  rationale: తెలుగులో ‘ఈ విషయాల గురించి గుర్తుచేయడం’ కంటే ‘ఈ విషయాలను గుర్తుచేయడం’ మరింత సహజం; సూచన ముందున్న విషయాలకే పరిమితమవుతుంది.
- source_word: καίπερ
  choice: ఉన్నప్పటికీ
  rationale: వారికి ఇప్పటికే తెలుసు, వారు స్థిరపరచబడ్డారు అనే విషయాలకు విరుద్ధంగా అయినా జ్ఞాపకం చేయాల్సిన అవసరాన్ని తెలిపే concessive భావాన్ని నిలుపుతుంది.
- source_word: εἰδότας
  choice: ఈ విషయాలు మీకు తెలిసి
  rationale: οἶδα యొక్క స్థిరమైన జ్ఞానస్థితిని తెలుపుతూ, తెలిసినవి ముందుగా ప్రస్తావించిన విషయాలేనని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἐστηριγμένους
  choice: మీరు స్థిరపరచబడి
  rationale: పరిపూర్ణ కర్మణి రూపంలోని గత చర్యతో ఏర్పడిన కొనసాగుతున్న స్థితిని, కర్మణి భావాన్ని తొలగించకుండా నిలుపుతుంది.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: మీ మధ్య ప్రస్తుతం ఉన్న సత్యంలో
  rationale: παρούσῃ అనే పదంలోని ‘ప్రస్తుతం ఉన్న’ లేదా ‘వారి వద్ద ఉన్న’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దానికి ప్రత్యేక యుగసంబంధమైన సాంకేతిక అర్థాన్ని జోడించదు.
theological_decisions:
- issue: ‘ప్రస్తుతం ఉన్న సత్యం’ అనే పదబంధం యొక్క అర్థం
  choice: మీ మధ్య ప్రస్తుతం ఉన్న సత్యంలో
  alternative: ఇప్పుడు మీరు కలిగివున్న సత్యంలో; ప్రస్తుత సత్యంలో
  rationale: గ్రీకు పదబంధం ప్రత్యేక సిద్ధాంత యుగాన్ని నిర్దేశించదు. అది పాఠకుల మధ్య ప్రస్తుతం ఉన్న లేదా వారికి అందిన సత్యాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఈ పరిధిని నిలుపుతూ, పాదసూచిక మరో సహజమైన అర్థవ్యక్తీకరణను ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘స్థిరపరచబడి’ అనే కర్మణి రూపం మూలంలోని వ్యాకరణ భావాన్ని కాపాడుతుంది; ‘మీ మధ్య ప్రస్తుతం ఉన్న సత్యం’ అనే పదబంధం మూలంలోని స్వల్ప అస్పష్టతను పరిష్కరించకుండా ఉంచుతుంది.
