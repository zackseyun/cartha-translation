id: 2PE.1.15
reference: 2 Peter 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: te
  text: అంతేకాక, నేను వెళ్లిపోయిన తర్వాత[a] కూడా మీరు ప్రతి సందర్భంలోనూ ఈ సంగతులను జ్ఞాపకం చేసుకోగలిగేలా నేను ప్రతి ప్రయత్నమూ చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత స్పష్టంగా, ‘నేను మరణించిన తరువాత.’ గ్రీకు మూలంలో ‘నా నిష్క్రమణ తరువాత’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: అన్ని విధాలా కృషి చేస్తాను
  rationale: భవిష్యత్ కాలంలోని ఈ క్రియ శ్రద్ధతో కూడిన తీవ్రమైన ప్రయత్నాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ καὶ
  choice: అంతేకాక
  rationale: ఇక్కడ బలమైన వ్యతిరేకత కాక, ముందటి మాటకు కొనసాగింపుగా మరొక సంకల్పాన్ని జోడిస్తుంది.
- source_word: ἑκάστοτε
  choice: ఎప్పుడైనా
  rationale: అవసరమైన ప్రతి సందర్భంలో లేదా ఏ సమయంలోనైనా అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: ἔχειν ὑμᾶς
  choice: మీరు ... చేసుకోగలిగేలా
  rationale: ἔχεινతో కూడిన నిర్మాణం సామర్థ్యం లేదా అవకాశం అనే భావాన్ని ఇస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: నేను వెళ్లిపోయిన తరువాత
  rationale: ἔξοδος యొక్క ‘వెళ్లిపోవడం/నిష్క్రమణ’ అనే రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: ఈ సంగతులను జ్ఞాపకం చేసుకోగలిగేలా
  rationale: ఈ గ్రీకు నుడికారం విషయాలను మనసుకు తెచ్చుకోవడం లేదా జ్ఞాపకం చేసుకోవడం అని అర్థం; తెలుగు రూపం దాని క్రియాశీల భావాన్ని నిలుపుతుంది.
- source_word: τούτων
  choice: ఈ సంగతులను
  rationale: సమీప సందర్భంలో పేతురు నొక్కిచెప్పిన విషయాలను నేరుగా సూచిస్తుంది.
theological_decisions:
- issue: పేతురు సమీపిస్తున్న అంతాన్ని సూచించడానికి ἔξοδος వాడుక
  choice: నేను వెళ్లిపోయిన తరువాత
  alternative: నేను మరణించిన తరువాత
  rationale: మూలపాఠం మరణాన్ని నేరుగా చెప్పకుండా ‘వెళ్లిపోవడం’ అనే రూపకాన్ని వాడుతుంది. ప్రధాన పాఠంలో ఆ రూపకాన్ని నిలిపి, స్పష్టమైన అర్థాన్ని పాదసూచికలో ఇస్తే అసలు వచనంలోని భావపరమైన సున్నితత్వం కాపాడబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వెళ్లిపోయిన’ అనే రూపం మరణానికి సంబంధించిన మూలభాషా రూపకాన్ని కాపాడుతుంది; పాదసూచిక దాని స్పష్టమైన సందర్భార్థాన్ని తెలియజేస్తుంది.
