- from: అంతేకాక, నేను వెళ్లిపోయిన తరువాత కూడా మీరు ఎప్పుడైనా ఈ సంగతులను జ్ఞాపకం చేసుకోగలిగేలా అన్ని విధాలా కృషి చేస్తాను.[a]
  to: అంతేకాక, నేను వెళ్లిపోయిన తర్వాత[a] కూడా మీరు ప్రతి సందర్భంలోనూ ఈ సంగతులను జ్ఞాపకం చేసుకోగలిగేలా నేను ప్రతి ప్రయత్నమూ చేస్తాను.
