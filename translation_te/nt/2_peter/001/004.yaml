id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: te
  text: వీటి ద్వారా ఆయన మనకు విలువైన, అత్యంత గొప్ప వాగ్దానాలను అనుగ్రహించాడు, తద్వారా మీరు పాపపూరిత కోరికవల్ల[b] లోకంలో ఉన్న భ్రష్టత్వం నుండి తప్పించుకొని దైవ స్వభావంలో భాగస్థులు కావాలని[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దైవ స్వభావంలో పాలుపంచుకునేవారై.’ ఈ మాట దేవుని నుండి వచ్చేదానిలో పాలుపంచుకోవడాన్ని సూచిస్తుంది; స్వభావరీత్యా దేవుడిగా మారడాన్ని కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘పాపపూరిత కోరికవల్ల’ అనే మాటను ‘కోరికవల్ల’ లేదా ‘కామేచ్ఛ ద్వారా’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం సాధారణంగా ‘కోరిక’ను సూచించగలదు; అయితే ఇక్కడ సందర్భం దానికి నైతికంగా ప్రతికూల భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: వాటి ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని లేదా మాధ్యమాన్ని సూచిస్తుంది. సంబంధసర్వనామం మునుపటి వచనంలోని అంశాలను సూచిస్తున్నప్పటికీ దాని పూర్వపదం పూర్తిగా నిర్దిష్టం కాదు; ‘వాటి ద్వారా’ ఆ అనుసంధానాన్నీ అస్పష్టతనూ నిలుపుతుంది.
- source_word: τίμια καὶ μέγιστα
  choice: అమూల్యమైన, అత్యంత గొప్ప
  rationale: τίμια విలువైనదనాన్ని, μέγιστα అత్యున్నత పరిమాణాన్ని తెలియజేస్తాయి. ఈ పదబంధం ఆధునిక తెలుగులో సహజంగా ఉండి రెండు విశేషణాల బలాన్నీ నిలుపుతుంది.
- source_word: ἡμῖν
  choice: మనకు
  rationale: δωρέομαιతో వచ్చిన సంప్రదానార్థక రూపాన్ని సహజమైన తెలుగులో ‘మనకు’ అని వ్యక్తం చేసింది.
- source_word: ἐπαγγέλματα
  choice: వాగ్దానాలు
  rationale: దేవుడు ఇచ్చిన హామీలను సూచించే ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: δεδώρηται
  choice: అనుగ్రహించాడు
  rationale: పూర్ణకాల రూపం కృపాపూర్వకంగా ఇచ్చిన కార్యాన్నీ దాని కొనసాగుతున్న ఫలితాన్నీ సూచిస్తుంది. సందర్భం ఆధారంగా అంతర్నిహిత కర్తను ‘ఆయన’గా తెలిపింది.
- source_word: ἵνα
  choice: …అని ఆయన ఇలా చేశాడు
  rationale: గ్రీకు ప్రయోజనార్థక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, వాగ్దానాలు అనుగ్రహించబడిన ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: διὰ τούτων
  choice: ఆ వాగ్దానాల ద్వారా
  rationale: τούτων సమీపంలో ప్రస్తావించిన వాగ్దానాలను సహజంగా సూచిస్తుంది; διά వాటిని మాధ్యమంగా చూపుతుంది.
- source_word: γένησθε
  choice: మీరు … పాలుపంచుకునేవారై
  rationale: γίνομαιలోని ‘అవడం’ అనే మార్పు భావాన్ని కేవలం స్థితిగా కాకుండా నిలుపుతుంది.
- source_word: θείας κοινωνοὶ φύσεως
  choice: దైవ స్వభావంలో పాలుపంచుకునేవారు
  rationale: κοινωνόςలోని నిజమైన భాగస్వామ్య భావాన్ని బలహీనపరచకుండా, తరువాతి సిద్ధాంత వివరణలను మూలపాఠ్యంలోకి చేర్చకుండా ఉంచుతుంది.
- source_word: ἀποφυγόντες
  choice: తప్పించుకొని
  rationale: అరిస్టు కృదంతంలోని ముందుగా జరిగిన లేదా అనుబంధ కార్య భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φθορᾶς
  choice: భ్రష్టత్వం
  rationale: ఈ సందర్భంలో కేవలం భౌతిక క్షయం కాకుండా నైతిక పతనం లేదా చెడిపోవడాన్ని సూచిస్తుంది.
- source_word: ἐν τῷ κόσμῳ
  choice: లోకంలో ఉన్న
  rationale: భ్రష్టత్వాన్ని విశేషించే గ్రీకు నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν ἐπιθυμίᾳ
  choice: పాపపూరిత కోరిక వల్ల
  rationale: ἐπιθυμία స్వతహాగా సాధారణ కోరికనూ సూచించగలిగినా, ఇక్కడ లోకంలోని భ్రష్టత్వంతో కలిసినందున నైతికంగా ప్రతికూలమైన భావం ఉంది. ‘వల్ల’ కారణార్థక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεωςలో దైవ స్వభావంలో భాగస్వామ్యం
  choice: దైవ స్వభావంలో పాలుపంచుకునేవారు
  alternative: దైవ స్వభావంలో భాగస్థులు
  rationale: మూలపాఠ్యంలోని బలమైన భాగస్వామ్య భాషను నిలుపుతూ, విశ్వాసులు సారాంశరీత్యా దేవుళ్లవుతారని చెప్పే భావాన్ని అనువాదంలో చేర్చదు; అలాగే పరిశుద్ధీకరణ, క్రీస్తుతో ఐక్యత లేదా దైవీకరణ వంటి తరువాతి సిద్ధాంత చట్రాల్లో ఏదో ఒకదానికే పరిమితం చేయదు.
- issue: ἐπιθυμία యొక్క నైతిక భావం
  choice: పాపపూరిత కోరిక
  alternative: కోరిక; కామేచ్ఛ
  rationale: పదానికి సాధారణంగా ‘కోరిక’ అనే విస్తృతార్థం ఉన్నప్పటికీ ఈ సందర్భంలో అది భ్రష్టత్వానికి కారణంగా ప్రతికూలంగా ఉంది. ‘కామేచ్ఛ’ లైంగిక అర్థానికే అనవసరంగా పరిమితం చేయవచ్చు.
- issue: ἀποφυγόντεςకు ప్రధాన క్రియతో ఉన్న సంబంధం
  choice: తప్పించుకొని … పాలుపంచుకునేవారై
  alternative: తప్పించుకున్నందున … పాలుపంచుకునేవారై
  rationale: కృదంతం కాలపూర్వత్వం లేదా అనుబంధ పరిస్థితిని సూచించవచ్చు. స్పష్టమైన కారణ సంబంధాన్ని బలవంతంగా చేర్చకుండా నిర్మాణంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘దైవ స్వభావం,’ ‘భ్రష్టత్వం’ వంటి భావపరంగా బరువున్న పదాలను నిలుపుతూ వాక్య నిర్మాణాన్ని తెలుగు సహజ ప్రవాహానికి అనుగుణంగా రెండు వాక్యాలుగా విభజించింది. రెండు పాదసూచిక గుర్తులూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
