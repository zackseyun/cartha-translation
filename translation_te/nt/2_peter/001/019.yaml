id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: te
  text: ఇంకా, మరింత స్థిరమైన ప్రవచన వాక్యం మనకు ఉంది[a]. చీకటి ప్రదేశంలో వెలుగుతున్న దీపంలా దానిపై మీరు శ్రద్ధ ఉంచడం మంచిది; పగలు వెలిగివచ్చి, వేకువచుక్క[b] మీ హృదయాల్లో ఉదయించే వరకు అలాగే చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరింత నిశ్చయమైన ప్రవచన వాక్యం మనకు ఉంది.” గ్రీకు మాటను అపొస్తలుల ప్రత్యక్షసాక్ష్యం ప్రవచన వాక్యాన్ని ధృవీకరించిందని గానీ, ప్రవచన వాక్యపు నిశ్చయమైన స్వభావాన్ని నొక్కిచెబుతోందని గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “వేకువచుక్క” మెస్సీయను సూచించే రూపకాన్ని ప్రతిధ్వనింపజేయవచ్చు; ప్రకటన 22:16 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: మరింత స్థిరంగా ఉంది
  rationale: తులనాత్మక భావాన్ని స్పష్టంగా ఉంచుతూ, ప్రవచన వాక్యం అపొస్తలుల సాక్ష్యం వల్ల స్థిరపరచబడిందా లేక దాని నిశ్చయ స్వభావమే నొక్కిచెప్పబడిందా అనే గ్రీకు వాక్యంలోని సందిగ్ధతను ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించదు.
- source_word: προφητικὸν λόγον
  choice: ప్రవచన వాక్యం
  rationale: విశేషణ నిర్మాణంలోని రెండు అంశాలను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: ᾧ ... προσέχοντες
  choice: దానిపై శ్రద్ధ ఉంచడం
  rationale: ప్రవచన వాక్యాన్ని జాగ్రత్తగా పట్టించుకోవడం, దృష్టి నిలపడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λύχνῳ φαίνοντι
  choice: వెలిగే దీపం
  rationale: దీపపు ఉపమానాన్ని, కొనసాగుతున్న ప్రకాశాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: αὐχμηρῷ τόπῳ
  choice: చీకటిగా ఉన్న చోట
  rationale: మసక, మురికి, చీకటి అనే అర్థపరిధిలో దీపపు రూపకానికి సరిపోయే స్పష్టమైన తెలుగు.
- source_word: ἡμέρα διαυγάσῃ
  choice: తెల్లవారి
  rationale: రోజు ఉదయించి వెలుగు విస్తరించడాన్ని సహజమైన తెలుగు క్రియతో వ్యక్తం చేస్తుంది.
- source_word: φωσφόρος
  choice: వేకువచుక్క
  rationale: ఉదయానికి ముందు కనిపించే ప్రకాశవంతమైన నక్షత్ర రూపకాన్ని సహజంగా నిలుపుతుంది; ప్రధాన పాఠ్యంలో దాని సూచ్యాన్ని నిర్ణయించదు.
- source_word: ἀνατείλῃ
  choice: ఉదయించే
  rationale: నక్షత్రం పైకి రావడం అనే ఖగోళ రూపకానికి తగిన సహజ సమానం.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: మీ హృదయాల్లో
  rationale: అంతరంగ వ్యక్తిని సూచించే బైబిలీయ హృదయ రూపకాన్ని వివరణతో విస్తరించకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: అపొస్తలుల ప్రత్యక్షసాక్ష్యంతో ప్రవచన వాక్యానికి ఉన్న సంబంధంలో βεβαιότερον భావం
  choice: ప్రధాన పాఠ్యంలో ‘మరింత స్థిరంగా ఉంది’ అని అనువదించి తులనాత్మక భావాన్ని నిలిపి, సంబంధాన్ని పూర్తిగా నిర్ణయించలేదు.
  alternative: ‘మనకు మరింత స్థిరపరచబడింది’ లేదా ‘మరింత నమ్మదగినది’
  rationale: గ్రీకు పదబంధం అపొస్తలుల సాక్ష్యం ప్రవచనాన్ని ధృవీకరించిందనే భావానికీ, ప్రవచన వాక్యపు స్థిరత్వాన్ని నొక్కిచెప్పే భావానికీ వీలు ఇస్తుంది. పాదసూచిక రెండు అవకాశాలను తెలియజేస్తుంది.
- issue: వేకువచుక్క సూచ్యం
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని మాత్రమే ఉంచి దానిని క్రీస్తుగా ప్రత్యక్షంగా గుర్తించలేదు.
  alternative: క్రీస్తు/మెస్సీయకు ప్రత్యక్ష సూచనగా విస్తరించడం లేదా అంత్యకాల జ్ఞానోదయంగా వివరించడం
  rationale: ఇతర బైబిలీయ సందర్భాల వల్ల మెస్సీయ సంబంధ ప్రతిధ్వని ఉండవచ్చు; అయితే ఈ వచనం సూచ్యాన్ని నేరుగా గుర్తించదు. అందువల్ల రూపకాన్నీ దాని ధార్మిక ఉద్వేగాన్నీ అలాగే ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలీయ శైలితో అనువదించబడింది. గ్రీకు వాక్యంలోని తులనాత్మక సందిగ్ధతను పాదసూచికలో నిలిపాం. రెండు పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా [a], [b]గా ఉన్నాయి.
