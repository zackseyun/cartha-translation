source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: te
  text: మేము ఆయనతో కలిసి ఆ పవిత్ర పర్వతం మీద ఉన్నప్పుడు, పరలోకం నుండి తీసుకురాబడిన ఈ స్వరాన్ని మేమే విన్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకం నుండి మోయబడి వచ్చిన ఈ స్వరాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: ఈ స్వరాన్ని
  rationale: ముందటి వచనంలోని దేవుని పలుకును సూచిస్తున్నందున, విస్తృతార్థకమైన ‘శబ్దం’ కంటే ‘స్వరం’ సందర్భానికి తగినది.
- source_word: ἡμεῖς
  choice: మేమే
  rationale: క్రియలోనే కర్త స్పష్టమైనప్పటికీ గ్రీకులో సర్వనామం ప్రత్యేకంగా ఉండటం ఉద్ఘాటనను సూచిస్తుంది; ‘మేమే’ ప్రత్యక్షసాక్షుల ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: ἠκούσαμεν
  choice: విన్నాం
  rationale: ఇది పరలోక స్వరాన్ని విన్న ఒక సంఘటనను తెలిపే భూతకాల క్రియ; ‘ఆలకించాం’ కంటే ‘విన్నాం’ సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: ἐξ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: మూలం లేదా ఆరంభస్థానాన్ని తెలిపే పదబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐνεχθεῖσαν
  choice: వచ్చిన
  rationale: φέρω క్రియ యొక్క కర్మణి భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, స్వరం పరలోకం నుండి చేరిందనే అర్థాన్ని ఇస్తుంది; మరింత పదానుసారంగా ‘తేబడిన’ అని కూడా అనువదించవచ్చు.
- source_word: σὺν αὐτῷ ὄντες
  choice: ఆయనతో పాటు ... ఉన్నప్పుడు
  rationale: కృదంత నిర్మాణంలోని కాలసంబంధాన్ని సహజమైన తెలుగు ఉపవాక్యంగా చూపుతుంది; సందర్భంలో ‘ఆయన’ యేసును సూచిస్తుంది.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: ఆ పవిత్ర పర్వతం మీద
  rationale: తెలుగులో పర్వతానికి సంబంధించి ‘మీద’ సహజమైన ప్రయోగం; నిర్దిష్ట ఉపపద భావాన్ని ‘ఆ’ నిలుపుతుంది, ‘పవిత్ర’ ἁγίῳ యొక్క అర్థాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఆ పవిత్ర పర్వతం’ దేనిని సూచిస్తుంది?
  choice: యేసు రూపాంతరం చెందిన పర్వతానికి వివరణాత్మక సూచనగా మాత్రమే ఉంచడం
  alternative: తాబోరు పర్వతం లేదా హెర్మోను పర్వతం అని స్పష్టంగా గుర్తించడం
  rationale: గ్రీకు పాఠం పర్వతాన్ని ‘పవిత్ర’ అని వర్ణిస్తుంది గాని దాని పేరు చెప్పదు. అందువల్ల ఏ సంప్రదాయ గుర్తింపునూ అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మేమే’ ద్వారా గ్రీకు కర్త సర్వనామంలోని ఉద్ఘాటనను నిలిపాం. ప్రధాన పాఠంలో ‘వచ్చిన’ సహజతకు ప్రాధాన్యం ఇస్తే, అధిక పదానుసారమైన కర్మణి రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
