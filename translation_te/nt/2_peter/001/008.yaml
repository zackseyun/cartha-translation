id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: te
  text: ఎందుకంటే, ఇవి మీలో ఉండి సమృద్ధిగా పెరుగుతూ, మన ప్రభువైన యేసు మెస్సీయను గురించిన జ్ఞానంలో[b] మిమ్మల్ని నిష్క్రియులుగానీ ఫలంలేనివారుగానీ ఉండనివ్వవు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమృద్ధిగా ఉండి.’
    reason: lexical_alternative
  - marker: b
    text: ‘జ్ఞానం’ అనే పదానికి ఇక్కడ ‘సంపూర్ణ జ్ఞానం’ అనే భావం కూడా ఉండవచ్చు. గ్రీకులో ‘యేసు క్రీస్తు’; బిరుదు అర్థాన్ని నిలుపుటకు ఇక్కడ ‘యేసు మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_and_title_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ఇవి
  rationale: 5–7 వచనాల్లో పేర్కొన్న లక్షణాలను తిరిగి సూచించే సాధారణ సర్వనామ రూపం; ‘ఈ గుణాలు’ అనేది స్పష్టీకరణ అయినప్పటికీ మూలంలో లేని నామవాచకాన్ని చేర్చుతుంది.
- source_word: ὑμῖν ὑπάρχοντα
  choice: మీలో ఉండి
  rationale: దాతువు మరియు ὑπάρχω కలయిక ఈ లక్షణాలు పాఠకులలో ఉనికిలో ఉండడం లేదా వారికి కలిగి ఉండడం అనే భావాన్ని ఇస్తుంది; తెలుగు నుడికారంలో ‘మీలో ఉండి’ సహజంగా ఉంది.
- source_word: πλεονάζοντα
  choice: మరింతగా వృద్ధి చెందుతుంటే
  rationale: పెరగడం మరియు సమృద్ధి చెందడం రెండింటికీ అవకాశమున్న పదం; నైతిక అభివృద్ధి సందర్భంలో కొనసాగుతున్న వృద్ధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀργούς
  choice: క్రియారహితులు
  rationale: ఈ సందర్భంలో ఫలప్రదమైన కార్యం లేకపోవడాన్ని సూచిస్తుంది; ‘సోమరులు’ అని అనువదిస్తే వ్యక్తిగత అలసత్వ భావాన్ని అతిగా నిర్దేశిస్తుంది.
- source_word: ἀκάρπους
  choice: ఫలించనివారు
  rationale: మూలంలోని ఫల రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో సులభంగా అర్థమయ్యే రూపం.
- source_word: καθίστησιν
  choice: ఉండకుండా చేస్తాయి
  rationale: οὐκ ... οὐδὲతో కూడిన ఫలితార్థక నిర్మాణాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: గురించిన జ్ఞానంలో
  rationale: ప్రభువును తెలుసుకోవడంతో సంబంధమున్న పరిధి లేదా దిశను వ్యక్తం చేస్తుంది; εἰς యొక్క భావాన్ని కేవలం స్థలార్థంగా కుదించదు.
- source_word: ἐπίγνωσιν
  choice: జ్ఞానం
  rationale: ప్రధాన అర్థాన్ని సహజంగా ఇస్తుంది; ‘సంపూర్ణ జ్ఞానం’ అనే బలమైన సాధ్యార్థాన్ని పాదసూచికలో ఉంచడం ద్వారా అస్పష్టతను కాపాడుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: క్రీస్తుకు వర్తించే గౌరవబిరుదుగా ఆధునిక ప్రామాణిక తెలుగు బైబిలు రిజిస్టర్‌లో సహజమైన పదం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦను పేరుగా లిప్యంతరీకరించి, Χριστοῦ యొక్క ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదార్థాన్ని అనువదిస్తుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦను ఎలా అందించాలి
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός యొక్క బిరుదార్థాన్ని పారదర్శకంగా నిలుపుతుంది; ‘క్రీస్తు’ అనే సంప్రదాయ లిప్యంతరీకరణను సిద్ధాంతపరంగా తిరస్కరించకుండా పాదసూచిక ప్రత్యామ్నాయంగా గుర్తిస్తుంది.
- issue: ἐπίγνωσιςలో బలమైన జ్ఞానార్థం
  choice: జ్ఞానం
  alternative: సంపూర్ణ జ్ఞానం
  rationale: ఈ పదం కొన్నిసార్లు మరింత సంపూర్ణమైన లేదా లోతైన జ్ఞానాన్ని సూచించగలదు; అయితే ఇక్కడ ఆ బలాన్ని తప్పనిసరిగా ప్రధాన పాఠ్యంలో నిర్దేశించకుండా పాదసూచికలో ఉంచడం మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా చదవగల వాక్యనిర్మాణం. గుణాల జాబితాతో అనుసంధానాన్ని ‘ఇవి’ ద్వారా నిలిపి, క్రియారహితత్వం–ఫలరాహిత్యం అనే సమాంతరతను కాపాడింది.
