id: 2PE.1.13
reference: 2 Peter 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: te
  text: అయితే, నేను ఈ గుడారంలో ఉన్నంతకాలం, మీకు గుర్తుచేయడం ద్వారా మిమ్మల్ని మేల్కొలపడం సముచితమని భావిస్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గుడారం’ అనేది ఇక్కడ ప్రస్తుత మర్త్య శరీరజీవితాన్ని సూచించే రూపకం; ‘నివాసం’ లేదా ‘శరీరం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: సముచితం
  rationale: ἡγοῦμαιతో కలిసి ఇది న్యాయతీర్పు కంటే తగినది లేదా యుక్తమైనది అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘సముచితం’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని లేదా భావవికాసాన్ని తెలుపుతుంది; ‘అయితే’ దానిని అతిగా బలపరచకుండా వ్యక్తం చేస్తుంది.
- source_word: ἡγοῦμαι
  choice: భావిస్తున్నాను
  rationale: ఇది ఆలోచించి చేసిన నిర్ణయాన్ని సూచిస్తుంది; ‘భావిస్తున్నాను’ తెలుగు వాక్యంలో సహజంగా ఉండి ఆ నిర్ణయార్థాన్ని నిలుపుతుంది.
- source_word: ἐφ’ ὅσον
  choice: ఉన్నంతకాలం
  rationale: εἰμίతో కూడిన ఈ పదబంధం కాలపరమైన ‘ఉన్నంతకాలం’ అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: σκηνώματι
  choice: గుడారంలో
  rationale: మూలంలోని తాత్కాలిక నివాసరూపకాన్ని నేరుగా నిలుపుతుంది; తరువాతి వచనంలో దానిని విడిచిపెట్టడం అనే చిత్రణతోనూ అనుసంధానమవుతుంది.
- source_word: διεγείρειν
  choice: మేల్కొలపడం
  rationale: క్రియకు మేల్కొల్పడం లేదా చైతన్యపరచడం అనే భావం ఉంది; ఇక్కడ జ్ఞాపకం చేయడం ద్వారా వారి మనస్సును చురుకుపరచడాన్ని సూచిస్తుంది.
- source_word: ἐν ὑπομνήσει
  choice: జ్ఞాపకం చేయడం ద్వారా
  rationale: 'ఈ పదబంధం సాధనం లేదా విధానాన్ని సూచిస్తుంది: జ్ఞాపకం చేయడం ద్వారా వారిని మేల్కొలపడం.'
theological_decisions:
- issue: ‘ఈ గుడారం’ అనే రూపకానికి సూచన
  choice: వ్యాఖ్యానాత్మకంగా ‘ఈ శరీరం’ అని మార్చకుండా ‘ఈ గుడారం’ అనే రూపకాన్నే ప్రధాన పాఠ్యంలో ఉంచడం.
  alternative: ఈ శరీరంలో; ఈ నివాసంలో
  rationale: గ్రీకు పాఠ్యం పేతురు ప్రస్తుత మర్త్య శరీరజీవితానికి గుడారాన్ని రూపకంగా ఉపయోగిస్తుంది. రూపకాన్ని నిలుపడం దాని తాత్కాలికతను, తరువాతి వచనంతో సంబంధాన్ని కాపాడుతుంది; పాదటిప్పణి సూచిత భావాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని గుడారం రూపకాన్ని నిలిపి, కఠినమైన లేదా ప్రాచీనమైన ‘గుడారము/దేహము’ రూపాలను నివారించాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
