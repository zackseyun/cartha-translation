id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: te
  text: ఎందుకంటే, ఈ విధంగా మన ప్రభువూ రక్షకుడూ అయిన యేసు మెస్సీయ యొక్క నిత్య రాజ్యంలోకి ప్రవేశం[a] మీకు సమృద్ధిగా కల్పించబడుతుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రవేశం’ అని అనువదించిన గ్రీకు పదాన్ని ‘ప్రవేశద్వారం’ అని కూడా అనువదించవచ్చు. అది ప్రవేశించే చర్యను లేదా ప్రవేశ మార్గాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'సాంప్రదాయ అనువాదం: ‘యేసు క్రీస్తు.’ ఇక్కడ గ్రీకు బిరుదైన Χριστός అర్థాన్ని నిలుపడానికి ‘మెస్సీయ’ అని అనువదించబడింది.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: ముందటి సందర్భంలో వివరించిన జీవన విధానాన్ని సూచించే అనుసంధానాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πλουσίως
  choice: సమృద్ధిగా
  rationale: సమకూర్చడం యొక్క విస్తారమైన, ఉదారమైన స్వభావాన్ని అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐπιχορηγηθήσεται
  choice: అనుగ్రహించబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, రాజ్యంలో ప్రవేశం ఇవ్వబడుతుందనే భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: గ్రీకు దత్తివిభక్తిని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἡ εἴσοδος
  choice: ప్రవేశం
  rationale: రాజ్యంలోకి ప్రవేశించే క్రియ లేదా లభించే ప్రవేశాన్ని సూచించగల గ్రీకు పదంలోని భావవిస్తృతిని నిలుపుతుంది.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: నిత్య రాజ్యంలో
  rationale: తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘లోకి’ భావాన్ని ‘రాజ్యంలో ప్రవేశం’ అనే సహజ ప్రయోగంలో వ్యక్తం చేస్తుంది; αἰώνιος ను ‘నిత్య’గా అందిస్తుంది.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: మన ప్రభువూ రక్షకుడూ అయిన
  rationale: ఒకే వ్యక్తికి చెందిన రెండు బిరుదులను తెలుగులో స్పష్టంగా కలుపుతూ κύριος, σωτήρ పదాల సాధారణ అర్థాలను నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός అనే బిరుదు యొక్క అర్థాన్ని లిప్యంతరీకరణతో మరుగుపరచకుండా ‘మెస్సీయ’గా అందిస్తుంది.
theological_decisions:
- issue: ‘మన ప్రభువూ రక్షకుడూ’ అనే రెండు బిరుదుల సూచిత వ్యక్తి
  choice: రెండు బిరుదులూ ఒకే వ్యక్తి అయిన యేసు మెస్సీయను సూచిస్తాయి.
  alternative: రెండు బిరుదులను వేర్వేరు సూచనలుగా చదవడం.
  rationale: ఒకే నిర్దేశక పదం కింద καίతో కలిసిన రెండు ఏకవచన వ్యక్తివాచక నామాలు, తరువాత వచ్చిన Ἰησοῦ Χριστοῦతో కలిసి, ఒకే సూచిత వ్యక్తిని బలంగా సూచిస్తాయి. ‘అయిన’ అనే నిర్మాణం ఈ గ్రీకు వాక్యసంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు కర్మణి నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగు పదక్రమాన్ని సహజంగా ఉంచాం. ‘ప్రభువూ రక్షకుడూ అయిన’ అనే రూపం రెండు బిరుదులూ ఒకే వ్యక్తిని సూచిస్తున్నాయని వ్యాకరణపరంగా తెలియజేస్తుంది.
