id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: te
  text: తన దైవిక శక్తి, తన సొంత మహిమ మరియు శ్రేష్ఠత ద్వారా మనలను పిలిచినవానిని గురించిన జ్ఞానం ద్వారా, జీవితానికీ దైవభక్తికీ సంబంధించిన సమస్తాన్ని మనకు అనుగ్రహించింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “తన సొంత మహిమకూ శ్రేష్ఠతకూ మనలను పిలిచినవానిని గురించిన జ్ఞానం ద్వారా.” గ్రీకులోని చతుర్థీ విభక్తి పదబంధాన్ని మరో విధంగా కూడా అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: ఇది జరిగింది
  rationale: ఈ పదం తరువాతి వాక్యంతో సంబంధాన్ని ఏర్పరుస్తుంది. ఒక్క వచనంగా తెలుగులో అసంపూర్ణంగా వినిపించకుండా వాక్యాంతంలో ఈ అనుసంధాన భావాన్ని ఉంచాం; ఖచ్చితంగా కారణార్థకంగా మాత్రమే నిర్ధారించలేదు.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: జీవానికీ దైవభక్తికీ అవసరమైనవన్నీ
  rationale: τὰ πρὸς అనే ప్రయోగం ‘సంబంధించినవి/కావలసినవి’ అనే భావాన్ని ఇస్తుంది. సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘అవసరమైనవన్నీ’ అని అనువదించాం.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: తన దైవిక శక్తి
  rationale: గ్రీకు సంబంధవిభక్తి నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్యరూపంలో ఇచ్చాం; θεῖος భావాన్ని ‘దైవిక’ నిలుపుతుంది.
- source_word: δεδωρημένης
  choice: అనుగ్రహించింది
  rationale: δωρέομαι ఉచితంగా, కృపతో ఇవ్వడాన్ని సూచిస్తుంది; గ్రీకు పరిపూర్ణకాల రూపంలోని పూర్తయి కొనసాగుతున్న ఫలితాన్ని సందర్భం తెలియజేస్తుంది.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: తెలుసుకోవడం వల్లనే
  rationale: ἐπίγνωσις‌ను అతిగా సాంకేతికం చేయకుండా వ్యక్తిని నిజంగా తెలుసుకోవడం అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; διά ఇక్కడ సాధనాన్ని సూచిస్తుంది.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: మనలను పిలిచినవానిని
  rationale: కర్తృవాచక కృదంతాన్ని వ్యక్తిని సూచించే సహజ తెలుగు రూపంలో ఇచ్చాం; ఆ వ్యక్తి ఎవరో అనువాదంలో అదనంగా నిర్ధారించలేదు.
- source_word: ἰδίᾳ
  choice: తన సొంత
  rationale: ἴδιος‌లోని ప్రత్యేక స్వామ్య ఉద్ఘాటనను ‘సొంత’ నిలుపుతుంది.
- source_word: δόξῃ
  choice: మహిమ
  rationale: దైవ వైభవం, ఘనత అనే పరిధిని నిలిపే స్థిరమైన బైబిలు తెలుగు పదం.
- source_word: ἀρετῇ
  choice: శ్రేష్ఠత
  rationale: ἀρετή ఇక్కడ కేవలం మానవ నైతిక సద్గుణం కాకుండా ఉన్నతమైన excellence‌ను సూచించగలదు; ‘శ్రేష్ఠత’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: ζωὴν
  choice: జీవం
  rationale: గ్రీకులో విశేషణం లేనందున ప్రస్తుత జీవితం, నిత్యజీవం రెండింటి ప్రతిధ్వనులను అనుమతించే విస్తృత పదాన్ని ఉంచాం.
- source_word: εὐσέβειαν
  choice: దైవభక్తి
  rationale: దేవుని పట్ల భక్తితో కూడిన జీవనాన్ని సూచించే εὐσέβεια భావానికి ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
theological_decisions:
- issue: ἰδίᾳ δόξῃ καὶ ἀρετῇ లోని చతుర్థీ విభక్తి సాధనాన్ని సూచిస్తుందా, గమ్యాన్ని సూచిస్తుందా?
  choice: తన సొంత మహిమ, శ్రేష్ఠతల ద్వారా
  alternative: తన సొంత మహిమకూ శ్రేష్ఠతకూ
  rationale: 'SBLGNT పాఠంలోని చతుర్థీ విభక్తిని సాధనార్థకంగా గ్రహించడం సహజం: పిలిచినవాడు తన మహిమ, శ్రేష్ఠతల ద్వారా పిలిచాడు. అయితే గమ్యార్థక అవగాహన కూడా సాధ్యమైనందున దానిని పాదసూచికలో నిలిపాం.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. గ్రీకు వచనం తరువాతి వచనంతో వ్యాకరణపరంగా ముడిపడి ఉన్నందున, ఒంటరి వచనంగా సహజంగా చదవడానికి రెండు వాక్యాలుగా అమర్చినా దాని ఆధార/అనుసంధాన భావాన్ని నిలిపాం.
