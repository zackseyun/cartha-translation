source:
  edition: SBLGNT
  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: te
  text: ఈ కారణంగానే, సర్వ శ్రద్ధతో కృషి చేస్తూ, మీ విశ్వాసంలో[a][d] సద్గుణాన్ని[b], సద్గుణంలో జ్ఞానాన్ని సమకూర్చండి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశ్వాసం’ (πίστις) అనే పదాన్ని ‘నమ్మకం’ లేదా ‘విశ్వాస్యత’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: '‘సద్గుణం’ (ἀρετή)కు మరో అనువాదం: ‘నైతిక శ్రేష్ఠత’.'
    reason: lexical_alternative
  - marker: c
    text: ‘సమకూర్చండి’ అని అనువదించిన క్రియకు ‘చేర్చండి’ లేదా ‘అందించండి’ అని కూడా అనువదించవచ్చు; అవసరమైనదాన్ని సమృద్ధిగా సమకూర్చడం అనే భావం దీనిలో ఉంది.
    reason: lexical_alternative
  - marker: d
    text: ‘మీ విశ్వాసంలో సద్గుణాన్ని’ అనే మాటను ‘మీ విశ్వాసానికి సద్గుణాన్ని చేర్చండి’ అని కూడా అనువదించవచ్చు.
    reason: translation_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: అందుచేతనే
  rationale: ముందరి వచనంలోని కారణంతో ఉన్న బలమైన అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: మీరు పూర్ణ శ్రద్ధ చూపుతూ
  rationale: పాఠకులు తమ వంతుగా సంపూర్ణమైన ఆసక్తి, శ్రద్ధ కనబరుస్తూ ఆజ్ఞను అమలు చేయాలనే సహచర క్రియాభావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπιχορηγήσατε
  choice: సమకూర్చండి
  rationale: కేవలం ఒకదానికి మరొకటి చేర్చడం కంటే, అవసరమైన దానిని సమృద్ధిగా అందించడం అనే క్రియ యొక్క భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: మీ విశ్వాసంలో
  rationale: పునరావృతమయ్యే ἐν + చతుర్థీ విభక్తి నిర్మాణాన్ని నిలుపుతూ, ఒక లక్షణంతో సంబంధంలో మరొక లక్షణాన్ని సమకూర్చాలనే భావాన్ని ఇస్తుంది.
- source_word: πίστει
  choice: విశ్వాసం
  rationale: πίστις యొక్క ప్రధానార్థాన్ని, ఈ లక్షణాల జాబితాలో సహజంగా సరిపోయే విధంగా తెలుగులో తెలియజేస్తుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: ἀρετήν
  choice: సద్గుణం
  rationale: ఉత్తమ నైతిక స్వభావం లేదా గుణశ్రేష్ఠత అనే భావాన్ని సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: γνῶσιν
  choice: జ్ఞానం
  rationale: γνῶσις యొక్క ప్రాథమిక పదార్థాన్ని కాపాడి, లక్షణాల క్రమంలో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: లక్షణాల జాబితాలో πίστις పదానికి అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో ‘విశ్వాసం’ సూటిగా సరిపోతుంది. అయితే గ్రీకు పదానికి నమ్మకం లేదా విశ్వసనీయత అనే సమీప భావాలు కూడా ఉండగలవు కాబట్టి వాటిని పాదసూచికలో ఉంచి అర్థపరిధిని మూసివేయలేదు.
- issue: ἐν + చతుర్థీ విభక్తితో లక్షణాల మధ్య సంబంధం
  choice: విశ్వాసంలో ... సద్గుణంలో
  alternative: విశ్వాసానికి ... సద్గుణానికి
  rationale: మూలంలోని పునరావృత నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపాం. ఇది లక్షణాలు ఒకదానితో మరొకటి సంబంధించి సమకూర్చబడుతున్నాయని సూచిస్తుంది; ‘చేర్చడం’ అనే క్రమబద్ధ భావం సాధ్యమైనా దానినే ఏకైక అర్థంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘పూర్ణ శ్రద్ధ చూపుతూ’ సహజమైన తెలుగు ప్రయోగం; ‘సమకూర్చండి’ మూల క్రియలోని అందించడం అనే భావాన్ని నిలుపుతుంది. మూలంలోని ‘లో ... లో’ శృంఖల నిర్మాణం అసహజంగా కాకుండా సాధ్యమైనంతవరకు కాపాడబడింది.
