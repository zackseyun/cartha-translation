id: 2PE.1.10
reference: 2 Peter 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: te
  text: కాబట్టి, సోదరులారా[a], మీ పిలుపును, ఎన్నికను స్థిరపరచుకోవడానికి మరింత శ్రద్ధ వహించండి. ఎందుకంటే మీరు వీటిని చేస్తే ఎన్నటికీ తడబడరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సోదర సోదరీమణులారా”; గ్రీకులో “సోదరులారా” అని ఉన్నప్పటికీ, ఈ సంబోధన విశ్వాస సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందటి ఉపదేశం నుంచి వచ్చే నిర్ధారణను సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: μᾶλλον
  choice: మరింత
  rationale: σπουδάσατε అనే ఆజ్ఞను బలపరుస్తూ ఉన్న తులనాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన సంబోధనను నిలుపుతుంది; విశ్వాస సమాజమంతటికీ ఇది వర్తించవచ్చనే భావాన్ని పాదసూచికలో పేర్కొన్నాం.
- source_word: σπουδάσατε
  choice: శ్రద్ధ వహించండి
  rationale: ఆసక్తితో, పట్టుదలగా ప్రయత్నించాలనే ఆజ్ఞార్థక భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: βεβαίαν
  choice: స్థిరపరచుకోవడానికి
  rationale: పిలుపు, ఎన్నిక నిశ్చితమైనవి లేదా దృఢమైనవి అని నిర్ధారించుకునే భావాన్ని, ποιεῖσθαιతో కలిపి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κλῆσιν
  choice: పిలుపును
  rationale: దేవుని పిలుపును సూచించే కొత్త నిబంధన వాడుకను సూటిగా నిలుపుతుంది.
- source_word: ἐκλογὴν
  choice: ఎన్నికను
  rationale: దేవుని ఎంపికను సూచించే పదానికి ఖచ్చితమైన వేదాంతపరమైన సమానార్థకం; ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థనూ అదనంగా రుద్దదు.
- source_word: ποιεῖσθαι
  choice: స్థిరపరచుకోవడానికి
  rationale: βεβαίανతో కలిసి పిలుపు, ఎన్నికను దృఢంగా నిర్ధారించుకోవాలనే భావాన్ని తెలుగులో సహజంగా ఇస్తుంది; వాటిని మనుషులు ఉనికిలోకి తెస్తారని చెప్పదు.
- source_word: ταῦτα
  choice: వీటిని
  rationale: ముందటి సందర్భంలో చెప్పిన లక్షణాలు, ఆచరణలను తిరిగి సూచిస్తుంది.
- source_word: ποιοῦντες
  choice: మీరు వీటిని చేస్తే
  rationale: పరిస్థితిని సూచించే గ్రీకు కృదంత భావాన్ని సహజమైన తెలుగు షరతు వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: οὐ μὴ
  choice: ఎన్నటికీ ... రు
  rationale: గ్రీకులోని బలమైన నిషేధాన్ని సహజమైన తెలుగులో గట్టిగా తెలియజేస్తుంది.
- source_word: πταίσητέ
  choice: తడబడరు
  rationale: వైఫల్యంలోకి జారడాన్ని సూచించే రూపకాన్ని నిలుపుతుంది; పాపరహిత పరిపూర్ణతగా గానీ, అంతిమ విశ్వాసభ్రంశంగా మాత్రమే గానీ అర్థాన్ని సంకుచితం చేయదు.
theological_decisions:
- issue: “మీ పిలుపును, ఎన్నికను స్థిరపరచుకోవడం” అనే మాట భావం
  choice: పట్టుదలతో సద్గుణాలను ఆచరిస్తూ దేవుని పిలుపు, ఎన్నిక తమ జీవితంలో నిజమైనవని దృఢపరచుకోవాలనే ప్రబోధం.
  alternative: మానవ ప్రయత్నమే దేవుని ఎన్నికను ఉనికిలోకి తెస్తుంది లేదా నిర్ణయిస్తుంది అనే అర్థం.
  rationale: ποιεῖσθαι మరియు βεβαίανల నిర్మాణం దృఢపరచడం లేదా నిర్ధారించుకోవడాన్ని సూచిస్తుంది. అనువాదం దేవుని ముందస్తు కార్యాన్నీ, విశ్వాసి శ్రద్ధపై ఉన్న ప్రబోధాన్నీ పరిష్కరించకుండా కలిపి నిలుపుతుంది.
- issue: “ఎన్నటికీ తడబడరు” అనే వాగ్దానం పరిధి
  choice: నమ్మకమైన క్రైస్తవ జీవనంలో తడబాటు లేదా వైఫల్యం నుంచి కాపాడబడడాన్ని సూచించే బలమైన వాగ్దానం.
  alternative: ఏ పాపమూ ఎన్నడూ చేయరనే పాపరహిత పరిపూర్ణతకు హామీ; లేదా ప్రత్యేకంగా అంతిమ విశ్వాసభ్రంశం అసాధ్యమనే సిద్ధాంత ప్రకటన.
  rationale: πταίω తడబడటం అనే రూపకాన్ని కలిగి ఉంది. దానిని “తడబడరు”గా ఉంచడం వల్ల వచనం చెప్పేదానికంటే ఎక్కువగా ఏ ప్రత్యేక వేదాంత వ్యవస్థ వైపు అర్థాన్ని మళ్లించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే ప్రబోధాత్మక శైలి. “ఎన్నిక” అనే స్థిర వేదాంత పదాన్ని నిలిపి, “స్థిరపరచుకోవడం” ద్వారా మూలంలోని క్రియాత్మక ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
