id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: te
  text: ఎందుకంటే, నేర్పుగా కల్పించిన కట్టుకథలను అనుసరించి మేము మన ప్రభువైన యేసు మెస్సీయ[b] శక్తినీ ఆయన రాకనూ[a] మీకు తెలియజేయలేదు; బదులుగా, ఆయన మహోన్నతత్వానికి ప్రత్యక్షసాక్షులమై తెలియజేశాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాక’ అని అనువదించిన గ్రీకు పదం παρουσία; దీనికి ‘ఉనికి’ లేదా ‘ఆగమనం’ అనే అర్థాలు కూడా ఉండవచ్చు. నూతన నిబంధనలో అనేక సందర్భాల్లో ఇది మెస్సీయ రాకను సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో Χριστός (‘క్రీస్తు’); దాని అర్థం ‘అభిషిక్తుడు’, అంటే ‘మెస్సీయ’. ఇక్కడ అది బిరుదుగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: నేర్పుగా కల్పించిన కట్టుకథలు
  rationale: σοφίζω యొక్క కృదంత రూపం కథలు తెలివిగా, కళాత్మకంగా కల్పించబడ్డాయని సూచిస్తుంది. ‘నేర్పుగా కల్పించిన’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘కట్టుకథలు’ μῦθοι యొక్క ప్రతికూల భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐξακολουθήσαντες
  choice: అనుసరించి
  rationale: ప్రధాన క్రియకు నేపథ్యంగా ఉన్న కృదంతాన్ని సంక్షిప్తంగా చూపుతూ, ‘కట్టుకథలను అనుసరించి కాదు’ అనే సాధనార్థక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐγνωρίσαμεν
  choice: మేము ... మీకు తెలియజేయలేదు
  rationale: γνωρίζω అంటే తెలియజేయడం లేదా వెల్లడించడం. దత్తివాచకమైన ὑμῖνను ‘మీకు’గా స్పష్టంగా నిలుపుతుంది.
- source_word: δύναμιν
  choice: శక్తి
  rationale: δύναμιςకు నేరమైన, సహజమైన సమానార్థకం.
- source_word: παρουσίαν
  choice: రాక
  rationale: παρουσίαకు ‘ఉనికి’, ‘రాక’, ‘చేరిక’ అనే అర్థాలు ఉండగలవు. యేసుకు సంబంధించిన నూతన నిబంధన సందర్భాల్లో అది తరచుగా ఆయన రాకను సూచిస్తుంది; మిగిలిన అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: యేసుకు బిరుదుగా వాడిన κύριοςకు స్థిరమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసుకు బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ దాని అభిషిక్తుడు అనే బిరుదార్థాన్ని కనబడేలా ఉంచుతుంది.
- source_word: ἐπόπται
  choice: కళ్లారా చూసినవారు
  rationale: ἐπόπτης ఒక విషయాన్ని స్వయంగా చూసిన ప్రత్యక్షసాక్షిని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం కట్టుకథలతో ఉన్న సాక్ష్యాధార వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γενηθέντες
  choice: చూసినవారమై
  rationale: γίνομαι కృదంతాన్ని ‘అయినవారమై’ అనే భావంతో సంక్షిప్తంగా అందించి, మొదటి కృదంతంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: μεγαλειότητος
  choice: మహిమ
  rationale: μεγαλειότης మహోన్నతత్వం, వైభవం లేదా మహిమను సూచిస్తుంది. ‘మహిమ’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి సందర్భానికి సరిపోతుంది.
- source_word: ἐκείνου
  choice: ఆయన
  rationale: సూచన సర్వనామం ముందున్న యేసు మెస్సీయను తిరిగి సూచిస్తుంది; తెలుగులో గౌరవార్థక ‘ఆయన’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: క్రీస్తు సంబంధ సందర్భంలో παρουσία అర్థం
  choice: రాక
  alternative: ఉనికి లేదా చేరిక
  rationale: పదానికి విస్తృతంగా ‘ఉనికి/చేరిక’ అనే అర్థం ఉన్నప్పటికీ, యేసును గురించి వాడిన అనేక నూతన నిబంధన సందర్భాల్లో భవిష్యత్ రాక అనే భావం బలంగా ఉంటుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి నిజమైన పదార్థ వైశాల్యాన్ని కాపాడాం.
- issue: Χριστόςను బిరుదుగా లేదా పేరులో భాగంగా చూపడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ నిర్మాణంలో Χριστόςను బిరుదుగా గ్రహించవచ్చు. ‘మెస్సీయ’ బిరుదార్థాన్ని స్పష్టంగా ఉంచుతుంది; తెలుగు క్రైస్తవ వాడుకలో పరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కళ్లారా చూసినవారు’ ప్రత్యక్షసాక్ష్య భావాన్ని సహజంగా బలపరుస్తుంది. మూలంలోని ‘కాదు—కాని’ వ్యత్యాసాన్ని తెలుగు వాక్య నిర్మాణంలో అర్థస్పష్టత కోసం అర్ధవిరామంతో, రెండవ భాగంలో ‘తెలియజేశాము’ను పునరుక్తి చేసి వ్యక్తం చేశాం.
