source:
  edition: SBLGNT
  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: te
  text: భక్తిలో సహోదరులపట్ల ఆప్యాయతను[a], సహోదరులపట్ల ఆప్యాయతలో ప్రేమను చేర్చండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహోదర ప్రేమను.’ ఇక్కడి గ్రీకు పదం సహోదరులపట్ల, ప్రత్యేకించి తోటి విశ్వాసులపట్ల, ఆప్యాయ ప్రేమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: భక్తిలో
  rationale: εὐσέβεια దేవునిపట్ల గౌరవభావంతో కూడిన అంకితభావం జీవన ప్రవర్తనలో వ్యక్తమవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు సందర్భంలో ‘భక్తి’ ఈ దైవాభిముఖ, నైతిక పార్శ్వాలను సహజంగా తెలియజేస్తుంది.
- source_word: φιλαδελφίαν
  choice: సహోదర వాత్సల్యాన్ని
  rationale: φιλαδελφία ముఖ్యంగా తోటి విశ్వాసులపట్ల కుటుంబసదృశమైన ఆప్యాయతను సూచిస్తుంది. ‘వాత్సల్యం’ తరువాతి ἀγάπηకి వాడిన ‘ప్రేమ’తో పదభేదాన్ని నిలుపుతుంది.
- source_word: ἀγάπην
  choice: ప్రేమను
  rationale: ἀγάπηకి విస్తృతమైన, సహజమైన తెలుగు సమానార్థం ‘ప్రేమ’. ఇది φιλαδελφία తరువాత పరాకాష్ఠగా వచ్చే విస్తృత గుణాన్ని అతివ్యాఖ్యానం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: '...లో ...ను చేర్చండి'
  rationale: ఈ నిర్మాణం ముందటి వచనాల ఆజ్ఞతో కొనసాగుతున్న గుణాల శ్రేణి. తెలుగులో వాక్యాన్ని సంపూర్ణంగా, సహజంగా చేయడానికి సందర్భంలో అంతర్నిహితమైన ‘చేర్చండి’ని వ్యక్తపరుస్తూ, పునరావృతమైన ‘లో’ నిర్మాణాన్ని నిలిపాం.
- source_word: δέ
  choice: (సంచయాత్మక అనుసంధానం)
  rationale: δέ ఇక్కడ వ్యతిరేకతను కాకుండా జాబితాను కొనసాగిస్తుంది. తెలుగులో ‘మరియు’ను పునరావృతం చేయకుండానే సమాంతర నిర్మాణం ఈ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: గుణాల వరుసలో φιλαδελφία మరియు ἀγάπη మధ్య భేదం
  choice: φιλαδελφίαను ‘సహోదర వాత్సల్యం’గా, ἀγάπηను ‘ప్రేమ’గా అనువదించడం
  alternative: రెండింటిలోనూ ‘ప్రేమ’ను వాడి, మొదటిదాన్ని ‘సహోదర ప్రేమ’గా అనువదించడం
  rationale: గ్రీకు పాఠం పరస్పర సంబంధమున్నా భిన్నమైన రెండు పదాలను వరుసగా వాడుతుంది. ‘సహోదర వాత్సల్యం’ తోటి విశ్వాసులపట్ల కుటుంబసదృశ ఆప్యాయతను, ‘ప్రేమ’ మరింత విస్తృతమైన గుణాన్ని సూచించే వాక్చాతుర్య పురోగతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ముందటి వచనాల నుంచి కొనసాగుతున్న ఆజ్ఞను తెలుగులో స్పష్టంచేయడానికి ‘చేర్చండి’ ఉపయోగించబడింది; గ్రీకు సమాంతరతను ‘భక్తిలో... సహోదర వాత్సల్యంలో...’ అనే నిర్మాణం నిలుపుతుంది.
