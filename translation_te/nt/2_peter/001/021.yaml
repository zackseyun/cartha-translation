id: 2PE.1.21
reference: 2 Peter 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: te
  text: ఎందుకంటే ప్రవచనం ఎన్నడూ మానవుని సంకల్పం వల్ల వెలువడలేదు[a]; బదులుగా, మనుషులు పరిశుద్ధాత్మ చేత నడిపించబడుతూ[b] దేవుని నుండి పలికారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముందుకు తీసుకురాబడలేదు.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది; ఇదే మూలక్రియ తరువాత “తీసుకుపోబడుతూ” అనే భావంలోనూ వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “పరిశుద్ధాత్మ చేత తీసుకుపోబడుతూ.” ఇది ఆత్మ యొక్క క్రియాశీల మార్గదర్శకత్వాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: మానవుని సంకల్పం వల్ల
  rationale: కర్తరి సంకల్పాన్ని సాధనకారణంగా చూపే దత్తివును ప్రతిబింబిస్తూ, ప్రవచనానికి మూలం మానవ సంకల్పం కాదని స్పష్టం చేస్తుంది.
- source_word: ἠνέχθη
  choice: వెలువడలేదు
  rationale: φέρω యొక్క కర్మణి రూపం ఇక్కడ ప్రవచనం ఉద్భవించడం లేదా ముందుకు తేబడడం అనే భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో ‘వెలువడలేదు’ ఆ భావాన్ని అందిస్తుంది; కర్మణి రూపాన్ని మరింత ప్రత్యక్షంగా చూపే ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: προφητεία
  choice: ప్రవచనం
  rationale: ప్రవక్త ద్వారా వచ్చిన ప్రకటన లేదా సందేశాన్ని సూచించే స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ποτέ
  choice: ఎన్నడూ
  rationale: οὐతో కలిసి ఉన్న బలమైన నిరాకరణను సహజంగా తెలియజేస్తుంది.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మ చేత
  rationale: ὑπόతో ఉన్న కర్తృకరణ భావాన్ని కాపాడి, పరిశుద్ధాత్మ క్రియాశీల ప్రతినిధి అని తెలియజేస్తుంది.
- source_word: φερόμενοι
  choice: నడిపించబడుతూ
  rationale: ఆత్మ యొక్క క్రియాశీల మార్గదర్శకత్వాన్ని సహజ తెలుగులో తెలియజేస్తుంది. ἠνέχθηతో ఉన్న φέρω పదసంబంధాన్ని మరింత అక్షరార్థంగా చూపే రూపం పాదటిప్పణిలో నిలుపబడింది.
- source_word: ἐλάλησαν
  choice: పలికారు
  rationale: మానవ వక్తల నిజమైన మాటల చర్యను గంభీరమైనప్పటికీ సాధారణంగా అర్థమయ్యే రీతిలో వ్యక్తపరుస్తుంది.
- source_word: ἀπὸ θεοῦ
  choice: దేవుని నుండి
  rationale: ἀπό సూచించే మూలం లేదా ఉద్భవాన్ని కాపాడుతుంది; ‘దేవునిచేత’ అని అనువదిస్తే పరిశుద్ధాత్మ కార్యసాధకత్వంతో ఈ భేదం కలిసిపోవచ్చు.
- source_word: ἄνθρωποι
  choice: మనుషులు
  rationale: దేవుడు మరియు ఆత్మకు భిన్నంగా ఉన్న మానవ వక్తలను సూచిస్తుంది; తెలుగు బహువచనం ఇక్కడ సహజంగా ప్రతినిధి మానవ అర్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: ప్రవచనంలో దైవిక కార్యం మరియు మానవ కార్యం మధ్య సంబంధం
  choice: ప్రవచనం మానవ సంకల్పం నుండి ఉద్భవించలేదు; పరిశుద్ధాత్మ చేత నడిపించబడుతున్న మనుషులు దేవుని నుండి పలికారు.
  alternative: ఆత్మ యాంత్రికంగా మాటలను చెప్పించాడని గాని, ప్రవచనం కొంత మానవ చొరవ నుండి మరియు కొంత దైవ ప్రభావం నుండి వచ్చిందని గాని అర్థాన్ని నిర్ణయించడం.
  rationale: గ్రీకు వాక్యం ‘మనుషులు పలికారు’ అని మానవ మాటను, ‘దేవుని నుండి’ మరియు ‘పరిశుద్ధాత్మ చేత నడిపించబడుతూ’ అని దైవిక మూలం, కార్యసాధకత్వాన్ని రెండింటినీ నిలుపుతుంది. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘వెలువడలేదు’ మరియు ‘నడిపించబడుతూ’ పఠన సౌలభ్యాన్ని ఇస్తాయి; φέρω పదపునరుక్తి మరియు కర్మణి భావం పాదటిప్పణుల్లో భద్రపరచబడ్డాయి. ‘మనుషులు’ ఇక్కడ మానవ వక్తలను ప్రతినిధి అర్థంలో సూచిస్తుంది.
