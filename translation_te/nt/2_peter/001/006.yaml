  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: te
  text: జ్ఞానంతో ఆత్మనిగ్రహం; ఆత్మనిగ్రహంతో సహనం[a]; సహనంతో దైవభక్తి[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఓర్పు,’ ‘పట్టుదల,’ ‘స్థిరమైన సహనం.’ గ్రీకు పదం (ὑπομονή) కష్టాల మధ్య నిలకడగా కొనసాగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు వాక్యం సంక్షిప్తంగా ఉంది. మునుపటి వచనంలో మొదలైన సద్గుణాల వరుసను కొనసాగిస్తూ, ఒక సద్గుణంతో పాటు తదుపరి సద్గుణాన్ని సమకూర్చుకోవాలనే భావాన్ని ఇక్కడ గ్రహించాలి.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: జ్ఞానం
  rationale: γνῶσιςకు నేరమైన, సహజమైన తెలుగు సమానార్థకం. సద్గుణాల వరుసలో ఇది అవగాహనకన్నా విస్తృతమైన ‘జ్ఞానం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: ఆత్మనిగ్రహం
  rationale: కోరికలు, ప్రేరణలు, ప్రవర్తనపై అదుపును సూచించే ἐγκράτεια భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: సహనం
  rationale: కష్టాల మధ్య నిలకడగా కొనసాగడాన్ని సూచించే ὑπομονήకు సహజమైన తెలుగు పదం. ఈ పదంలోని పట్టుదల, స్థిరత్వం వంటి భావవిస్తృతిని పాదసూచికలో తెలియజేశారు.
- source_word: εὐσέβειαν
  choice: దైవభక్తి
  rationale: దేవునిపట్ల భయభక్తులతో కూడిన అంకితభావం జీవితంలో వ్యక్తమవడాన్ని εὐσέβεια సూచిస్తుంది; ‘దైవభక్తి’ ఈ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: '...తో ...'
  rationale: మునుపటి వచనంలోని క్రియను కొనసాగిస్తూ వచ్చిన సంక్షిప్త నిర్మాణాన్ని పూర్తి వాక్యంగా విస్తరించకుండా, తెలుగులో అర్థమయ్యే సద్గుణాల గొలుసుగా నిలుపుతుంది.
- source_word: δέ
  choice: పునరుక్త నిర్మాణం మరియు విరామచిహ్నాల ద్వారా అనుసంధానం
  rationale: ఇక్కడ δέ వ్యతిరేకతను కాక వరుసలోని తదుపరి అంశాన్ని కలుపుతుంది. తెలుగులో ప్రతి భాగంలో ‘మరియు’ అని పునరావృతం చేయకుండా అర్ధవిరామాలతో ఆ అనుసంధానాన్ని సహజంగా వ్యక్తపరిచారు.
theological_decisions:
- issue: సద్గుణాల వరుసలోని సంక్షిప్త గ్రీకు వాక్యనిర్మాణం
  choice: మునుపటి వచనం నుంచి గ్రహించాల్సిన క్రియను ప్రధాన పాఠ్యంలో చేర్చకుండా, ‘...తో ...’ అనే సంక్షిప్త వరుసను నిలుపుట
  alternative: ‘జ్ఞానానికి ఆత్మనిగ్రహాన్ని ... జోడించండి’ అని మునుపటి వచనంలోని క్రియను స్పష్టంగా పూరించడం
  rationale: గ్రీకు పాఠ్యం ఉద్దేశపూర్వకంగా సంక్షిప్తంగా ఉండి, మునుపటి వచనంలోని సద్గుణాలను సమకూర్చే ఆజ్ఞను కొనసాగిస్తుంది. సంక్షిప్తతను నిలపడం మూలపాఠ్య రూపాన్ని గౌరవిస్తూ అనవసర వ్యాఖ్యాన విస్తరణను నివారిస్తుంది.
- issue: εὐσέβεια యొక్క భావం
  choice: దైవభక్తి
  alternative: భక్తి; భక్తిపూర్వక జీవితం
  rationale: ఈ పదం కేవలం అంతర్గత భావాన్ని మాత్రమే కాక దేవునిపట్ల గౌరవభక్తి జీవితంలో కనిపించడాన్ని సూచిస్తుంది. ‘దైవభక్తి’ ఏ ప్రత్యేక సంప్రదాయ సిద్ధాంతాన్ని జోడించకుండా ఆ దేవకేంద్రిత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. గ్రీకు మూలంలోని సమాంతర, సంక్షిప్త సద్గుణాల వరుసను అర్ధవిరామాలతో ప్రతిబింబించారు.
