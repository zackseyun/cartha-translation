id: 2PE.1.9
reference: 2 Peter 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: te
  text: ఎవరిలో ఈ లక్షణాలు లేవో, అతడు గుడ్డివాడు—దగ్గరగా ఉన్నవాటినే చూడగలవాడు[a]; తన పూర్వపు పాపాలనుండి తాను శుద్ధి చేయబడిన సంగతి మరచిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హ్రస్వదృష్టిగలవాడు,’ అంటే సమీపంలో ఉన్నవాటినే చూసేవాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: ఎవరిలో ఈ లక్షణాలు లేవో
  rationale: గ్రీకు వాక్యనిర్మాణంలో ఈ విషయాలు ఆ వ్యక్తిలో ‘ఉండకపోవడం’ భావం ఉంది. ταῦτα మునుపటి వచనాల్లో చెప్పిన లక్షణాలను సూచిస్తున్నందున సహజమైన తెలుగులో ‘ఈ లక్షణాలు’ అని అనువదించాం.
- source_word: τυφλός ἐστιν
  choice: అతడు గుడ్డివాడు
  rationale: రూపకాలంకారాన్ని నేరుగా, స్పష్టంగా నిలుపుతుంది.
- source_word: μυωπάζων
  choice: దగ్గరగా ఉన్నవాటినే చూడగలవాడు
  rationale: ఈ అరుదైన క్రియకు ‘హ్రస్వదృష్టి గలవాడు’ లేదా ‘దగ్గరవి మాత్రమే కనిపించేవాడు’ అనే భావాలు సాధ్యం. సాధారణ పాఠకులకు అర్థమయ్యేలా దృశ్యరూపాన్ని నిలిపాం.
- source_word: λήθην λαβὼν
  choice: మరచిపోయాడు
  rationale: అక్షరార్థంగా ‘మరుపును పొందినవాడు’ అనే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: తన పూర్వపు పాపాలనుండి తాను శుద్ధి చేయబడిన సంగతి
  rationale: καθαρισμός యొక్క శుద్ధీకరణ భావాన్ని, పాపాలనుండి శుద్ధి అనే సంబంధాన్ని స్పష్టంగా తెలుపుతుంది; πάλαι గతకాలపు పాపాలను సూచిస్తుంది.
theological_decisions:
- issue: τυφλός మరియు μυωπάζων మధ్య కనిపించే ఉద్రిక్తత
  choice: ‘గుడ్డివాడు—దగ్గరగా ఉన్నవాటినే చూడగలవాడు’ అని రెండింటినీ నిలిపాం
  alternative: ‘హ్రస్వదృష్టిగల గుడ్డివాడు’ లేదా ‘కళ్లు మూసుకున్న గుడ్డివాడు’
  rationale: గ్రీకులోని ‘గుడ్డి’ మరియు ‘సమీపదృష్టి’ చిత్రాలు కొంత ఉద్రిక్తంగా ఉన్నాయి. ఒకదానితో మరొకదాన్ని తొలగించకుండా రెండింటినీ భద్రపరిచాం.
- issue: పాపశుద్ధి యొక్క స్వరూపం
  choice: ‘తాను శుద్ధి చేయబడిన సంగతి’
  alternative: ‘తన పూర్వపు పాపాల శుద్ధి’
  rationale: వాక్యం శుద్ధీకరణ జరిగినదని చెబుతుంది గాని, దాని విధానం లేదా నిర్దిష్ట సిద్ధాంతపరమైన అర్థాన్ని ఇక్కడ వివరించదు; అందువల్ల అదనపు వ్యాఖ్యానాన్ని చేర్చలేదు.
- issue: αὐτοῦ లోని ఏకవచన పురుషలింగ సూచన
  choice: ‘తన’ అనే లింగతటస్థ ప్రతిబింబ సర్వనామం
  alternative: ‘అతని’
  rationale: తెలుగులో ‘తన’ ఏకవచన ప్రతినిధి వ్యక్తిని సహజంగా సూచిస్తూ, గ్రీకు వ్యాకరణ సంఖ్యను నిలుపుతుంది; అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘హ్రస్వదృష్టి’ అనే సాంకేతిక పదాన్ని ప్రధాన పాఠ్యంలో కాకుండా పాదటిప్పణిలో ఉంచాం.
