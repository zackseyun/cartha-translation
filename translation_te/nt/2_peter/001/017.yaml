id: 2PE.1.17
reference: 2 Peter 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: te
  text: 'ఎందుకంటే, ఆయన తండ్రియైన దేవుని నుండి ఘనతనూ మహిమనూ పొందినప్పుడు, మహోన్నత మహిమ నుండి ఆయనకు ఇలాంటి స్వరం వచ్చింది: “ఈయనే నా కుమారుడు, నా ప్రియమైనవాడు[b]; ఈయనపట్ల నేను ప్రసన్నుడనయ్యాను[c]”—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా “ఈయనే నా ప్రియ కుమారుడు.” గ్రీకులో మరింత అక్షరార్థంగా “ఈయనే నా కుమారుడు, నా ప్రియమైనవాడు” అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఈయనతో నేను సంతోషించాను” లేదా “ఈయనలో నేను ఆనందించాను.” గ్రీకులో అక్షరార్థంగా “ఈయనలోకి నేను ప్రసన్నుడనయ్యాను” అనే అసాధారణ ప్రయోగం ఉంది; ఇది యేసు బాప్తిస్మం మరియు రూపాంతరం గురించిన సువార్త వృత్తాంతాల మాటలను ప్రతిధ్వనిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν
  choice: పొందినప్పుడు
  rationale: భూతకాల అసమాపక క్రియ యొక్క కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలోని కర్త యేసే అని అలాగే ఉంచుతుంది.
- source_word: παρὰ θεοῦ πατρὸς
  choice: తండ్రియైన దేవుని నుండి
  rationale: παρά + షష్ఠీ విభక్తి మూలాన్ని సూచిస్తుంది. ఈ రూపం ‘దేవుడు’ మరియు ‘తండ్రి’ అనే రెండు భావాలనూ స్పష్టంగా నిలుపుతుంది.
- source_word: τιμὴν καὶ δόξαν
  choice: ఘనతనూ మహిమనూ
  rationale: రెండు గ్రీకు నామవాచకాల ప్రత్యేక భావాన్ని నిలుపుతూ, సహజమైన గంభీర తెలుగు జంటగా ఉంటుంది.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε
  choice: ఆయనకు ఇలాంటి స్వరం వచ్చింది
  rationale: గ్రీకులోని కర్మణి భావాన్ని తెలుగులో అతిగా కృత్రిమంగా చేయకుండా, స్వరం ఆయనవద్దకు చేరిన భావాన్నీ ముందున్న సూచనాత్మక τοιᾶσδε భావాన్నీ అందిస్తుంది.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: మహోన్నత మహిమ నుండి
  rationale: ὑπό కర్తృత్వాన్ని సూచించగలిగినా, ఇక్కడ స్వరం వచ్చిన దివ్య మూలాన్ని సహజ తెలుగులో తెలియజేస్తుంది. ‘మహోన్నత మహిమ’ దేవుని మహిమాన్విత సన్నిధిని గౌరవపూర్వకంగా సూచించే అభివ్యక్తిని నిలుపుతుంది.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: ఈయనే నా కుమారుడు, నా ప్రియుడు
  rationale: రెండుసార్లు వచ్చిన μου భావాన్నీ, ‘నా కుమారుడు’ మరియు ‘నా ప్రియుడు’ అనే సమానాధికార నిర్మాణాన్నీ కుదించకుండా నిలుపుతుంది.
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: ఈయనలో నేను ఆనందించాను
  rationale: εἰς ὃν యొక్క అసాధారణమైన ‘ఈయనలో’ నిర్మాణాన్నీ, εὐδόκησα యొక్క భూతకాల రూపాన్నీ సాధ్యమైనంత పారదర్శకంగా నిలుపుతుంది; అడుగుసూచనలో సహజమైన భావానువాదాలు ఇవ్వబడ్డాయి.
theological_decisions:
- issue: τῆς μεγαλοπρεποῦς δόξης అనే దైవసూచక పరిభాష
  choice: మహోన్నత మహిమ
  alternative: మహిమాన్వితమైన మహిమ; దివ్య మహోన్నతత్వం
  rationale: ఈ పదబంధం దేవుని పేరు నేరుగా పలకకుండా ఆయన మహిమాన్విత సన్నిధిని సూచిస్తున్నట్టు కనిపిస్తుంది. అనువాదం దానిని ‘దేవుడు’ అని విస్తరించకుండా ఆ గౌరవపూర్వక అస్పష్టతను నిలుపుతుంది.
- issue: కుమారుని గురించి తండ్రి చేసిన ప్రకటనలోని సమానాధికార నిర్మాణం
  choice: ఈయనే నా కుమారుడు, నా ప్రియుడు
  alternative: ఈయనే నా ప్రియ కుమారుడు
  rationale: గ్రీకులో ‘నా కుమారుడు’ తరువాత ‘నా ప్రియుడు’ ప్రత్యేకంగా ఉంచబడింది. ఎటువంటి అనంతర సిద్ధాంతపరమైన విస్తరణ లేకుండా ఆ ఉద్ఘాటనను నిలుపుతుంది.
- issue: εἰς ὃν ἐγὼ εὐδόκησα యొక్క కాలం మరియు సంబంధ భావం
  choice: ఈయనలో నేను ఆనందించాను
  alternative: ఈయనపట్ల నేను ప్రసన్నుడనయ్యాను; ఈయనలో నేను సంతోషిస్తున్నాను
  rationale: గ్రీకులోని ఆఓరిస్ట్ రూపాన్నీ, εἰς అనే ఉపసర్గ కలిగించే ఉద్వేగాన్నీ ప్రధాన పాఠ్యంలో నిలుపుతూ, ఇతర సహజ తెలుగు అర్థాలను అడుగుసూచనలో చూపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘వాణి’ కంటే విస్తృతంగా అర్థమయ్యే ‘స్వరం,’ ‘సన్మానం’ కంటే సందర్భానికి తగిన ‘ఘనత’ ఎంచుకోబడ్డాయి. వాక్యం తదుపరి వచనంలో కొనసాగే నిర్మాణాన్ని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
