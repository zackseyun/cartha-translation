id: 2TI.3.9
reference: 2 Timothy 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: te
  text: కానీ వారు ఇకపై మరింత ముందుకు సాగరు[a], ఎందుకంటే వారి మూర్ఖత్వం అందరికీ స్పష్టమవుతుంది—ఆ మనుషులది స్పష్టమైనట్లే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇకపై మరింత పురోగమించరు.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, ముందటి వచనంలో పేర్కొన్న యన్నే, యంబ్రేల మూర్ఖత్వం స్పష్టమైనట్లే.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: ముందుకు సాగరు
  rationale: προκόπτωలోని ‘ముందుకు పోవడం/పురోగమించడం’ అనే భావాన్ని నిలుపుతూ, అబద్ధ బోధకుల విషయంలో సానుకూల అభివృద్ధి అనే అపార్థం రాకుండా సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: ἐπὶ πλεῖον
  choice: ఇక
  rationale: నిషేధంతో కలిసిన ఈ గ్రీకు పదబంధం ‘ఇకపై/అంతకంటే ముందుకు’ అనే భావం ఇస్తుంది; ‘ఇక ముందుకు సాగరు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἄνοια
  choice: బుద్ధిహీనత
  rationale: అవగాహనలేమి, వివేకరాహిత్యం అనే నైతిక-మేధో భావాన్ని ‘బుద్ధిహీనత’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔκδηλος
  choice: స్పష్టమవుతుంది
  rationale: బయటపడి అందరికీ తేటతెల్లం కావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πᾶσιν
  choice: అందరికీ
  rationale: గ్రీకు దత్తివాచక బహువచనంలోని సార్వత్రిక పరిధిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: ఆ మనుషుల బుద్ధిహీనత అందరికీ వెల్లడైనట్లే
  rationale: గ్రీకులో అధ్యాహారంగా ఉన్న ‘బుద్ధిహీనత’ను తెలుగులో పునరుక్తి చేసి పోలికను స్పష్టం చేశాం; ἐκείνωνను ముందటి వచనంలోని వ్యక్తులను సూచించే ‘ఆ మనుషులు’గా ఉంచాం.
theological_decisions:
- issue: ἐκείνων అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ముందటి వచనంలో పేర్కొన్న యన్నే, యంబ్రేలను సూచించే ‘ఆ మనుషులు’
  alternative: గతంలోని విరోధులను సాధారణంగా సూచించడం
  rationale: తక్షణ సందర్భమైన 3:8లో యన్నే, యంబ్రే ప్రస్తావించబడ్డారు. ప్రధాన పాఠంలో పేర్లను చేర్చి వ్యాఖ్యానాన్ని బలవంతం చేయకుండా ‘ఆ మనుషులు’ అనే అనుసంధానాన్ని నిలిపి, పాదసూచికలో సూచనను వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. గ్రీకు వాక్యంలోని పోలికను తెలుగులో స్పష్టంగా చూపడానికి పదక్రమాన్ని స్వల్పంగా మార్చి, అధ్యాహార పదమైన ‘బుద్ధిహీనత’ను పునరుక్తి చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
