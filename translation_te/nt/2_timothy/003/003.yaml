  text: ἄστοργοι, ἄσπονδοι, διάβολοι, ἀκρατεῖς, ἀνήμεροι, ἀφιλάγαθοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/003.yaml
  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: te
  text: సహజమైన కుటుంబానురాగం లేనివారు, సయోధ్యకు రానివారు[a], అపనిందలు చెప్పేవారు[b], ఆత్మనిగ్రహం లేనివారు, క్రూరులు, మంచిని ప్రేమించనివారు[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజీకి రానివారు,” “శాంతి ఒప్పందాన్ని నిలబెట్టనివారు.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి గ్రీకు పదం διάβολοι అంటే “అపనిందలు చెప్పేవారు” లేదా “అపవాదులు”; ఇది అపవాది అయిన Devil‌ను సూచించడం లేదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మంచిని ద్వేషించేవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: సహజమైన కుటుంబానురాగం లేనివారు
  rationale: στοργή సూచించే, ముఖ్యంగా కుటుంబ సభ్యులు మరియు దగ్గరి బంధువుల మధ్య సహజంగా ఉండవలసిన అనురాగం లేకపోవడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄσπονδοι
  choice: రాజీకి రానివారు
  rationale: శాంతి లేదా సమాధాన నిబంధనలకు అంగీకరించని, సయోధ్యకు లొంగని స్వభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διάβολοι
  choice: అపనిందలు చెప్పేవారు
  rationale: ఈ బహువచన దుర్గుణాల జాబితాలో ఇది అపవాదులు లేదా నిందారోపణలు చేసే మనుషులను సూచిస్తుంది; అపవాదిని అనే వ్యక్తినామాన్ని కాదు.
- source_word: ἀκρατεῖς
  choice: ఆత్మనిగ్రహం లేనివారు
  rationale: కోరికలు, ఉద్రేకాలు లేదా ప్రవర్తనపై అదుపు లేకపోవడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνήμεροι
  choice: క్రూరులు
  rationale: మచ్చికలేని, నిర్దయమైన, ఉగ్ర స్వభావాన్ని సంక్షిప్తంగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀφιλάγαθοι
  choice: మంచిని ప్రేమించనివారు
  rationale: మంచిదానిపట్ల ప్రేమ లేకపోవడమనే గ్రీకు సమాసపదంలోని నిషేధార్థాన్ని కాపాడుతుంది; క్రియాశీల ద్వేషమనే బలమైన భావాన్ని అనవసరంగా జోడించదు.
theological_decisions:
- issue: దుర్గుణాల జాబితాలో διάβολοι అర్థం
  choice: అపనిందలు చెప్పేవారు
  alternative: దయ్యాలు; అపవాదిలాంటి వారు
  rationale: బహువచన రూపంలో ఇతర మానవ దుర్గుణాల మధ్య ఉన్నందున ఇది అపనింద చేసే ప్రవర్తనను సూచిస్తుంది. దీనిని దయ్యాలు అని అనువదిస్తే వ్యక్తుల స్వరూపాన్ని గూర్చిన వాక్యంగా పాఠకులు తప్పుగా గ్రహించే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దుర్గుణాల జాబితికి తగిన సమాంతర ‘…వారు’ నిర్మాణాన్ని ఉపయోగించాం. గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూలపాఠంలోని వరుసను అలాగే ఉంచాం.
