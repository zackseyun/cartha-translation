  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: te
  text: కానీ నీవైతే, నీవు నేర్చుకుని నిశ్చయత పొందిన వాటిలో[b] నిలిచి ఉండు; వాటిని ఎవరెవరి నుండి[a] నేర్చుకున్నావో నీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ఇక్కడ ‘ఎవరి నుండి’ అనే ఏకవచన పాఠం ఉంది; దాన్ని తరచుగా పౌలును సూచించేదిగా అర్థం చేసుకుంటారు. ఇక్కడ అనుసరించిన బహువచన పాఠం తిమోతి బోధకులను మరింత విస్తృతంగా సూచించవచ్చు.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘నిశ్చయంగా ఒప్పుకున్న వాటిలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: కానీ నీవైతే
  rationale: స్పష్టంగా ఉన్న σὺ అనే సర్వనామంలోని నొక్కిచెప్పడాన్ని, ముందున్న దుష్టుల వర్ణనతో δέ చూపే వ్యత్యాసాన్ని ‘నీవైతే’ సహజంగా తెలియజేస్తుంది.
- source_word: μένε ἐν οἷς
  choice: వాటిలో నిలిచి ఉండు
  rationale: వర్తమాన ఆజ్ఞారూపం నిరంతరంగా కొనసాగడాన్ని సూచిస్తుంది; ἐν లోని పరిధి భావాన్ని ‘వాటిలో’ నిలుపుతుంది.
- source_word: ἔμαθες
  choice: నీవు నేర్చుకున్న
  rationale: తిమోతి గతంలో పొందిన బోధను సహజమైన తెలుగు భూతకాల రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἐπιστώθης
  choice: నిశ్చయంగా నమ్మిన
  rationale: నేర్చుకున్న బోధ విషయంగా స్థిరమైన నిశ్చయం కలిగిన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: εἰδὼς
  choice: నీకు తెలుసు
  rationale: తెలుసుకొని అనే అసమాపక క్రియకు బదులు సహజ తెలుగు వాక్య నిర్మాణాన్ని వాడినా, ఆ జ్ఞానం ఆజ్ఞకు నేపథ్యంగా ఉందనే సంబంధాన్ని కారణార్థానికి పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: παρὰ τίνων
  choice: ఎవరెవరి నుండి
  rationale: παρά షష్ఠీ విభక్తితో బోధకు మూలమైన వ్యక్తులను సూచిస్తుంది. SBLGNTలోని బహువచనాన్ని ‘ఎవరెవరి’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἔμαθες
  choice: నేర్చుకున్నావో
  rationale: ముందు పేర్కొన్న బోధనే మరలా సూచిస్తున్నదని తెలుగు వాక్య సందర్భం సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: παρὰ τίνων ఎవరిని సూచిస్తుంది?
  choice: వ్యక్తులను గుర్తింపకుండా బహువచనంగా ‘ఎవరెవరి నుండి’ అని అనువదించడం
  alternative: ఏకవచనంగా ‘ఎవరి నుండి’ అని చదివి, దాన్ని పౌలును సూచించేదిగా అర్థం చేసుకోవడం
  rationale: SBLGNT పాఠం బహువచనంలో ఉంది; అయితే ఈ వచనం ఆ బోధకులు ఎవరో చెప్పదు. కాబట్టి పౌలు, తిమోతి తల్లి లేదా అమ్మమ్మ వంటి నిర్దిష్ట వ్యక్తులను ప్రధాన పాఠంలో చేర్చకుండా మూలపాఠంలోని విస్తృత సూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘నీవైతే’ వ్యత్యాసాన్ని నొక్కిచెబుతుంది; ‘నిలిచి ఉండు’ మూలంలోని స్థిరంగా కొనసాగాలనే రూపకాన్ని కాపాడుతుంది. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాల దగ్గర ఉంచాం.
