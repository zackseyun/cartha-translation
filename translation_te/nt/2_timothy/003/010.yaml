revisions:
- from: అయితే నీవు నా బోధను, ప్రవర్తనను, ఉద్దేశాన్ని, విశ్వాసాన్ని[a], దీర్ఘశాంతాన్ని, ప్రేమను, సహనాన్ని దగ్గరగా అనుసరించావు.
  to: అయితే నీవు నా బోధను, ప్రవర్తనను, ఉద్దేశాన్ని, విశ్వాసాన్ని[a], ఓర్పును, ప్రేమను, సహనాన్ని శ్రద్ధగా అనుసరించావు.
  rationale: The revision improves modern Telugu idiom and register without altering the source’s list structure or resolving the semantic ambiguity of πίστις. ‘ఓర్పు’ and ‘సహనం’ retain the intended lexical distinction between μακροθυμία and ὑπομονή.
