id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: te
  text: అయితే నీవు నా బోధను, ప్రవర్తనను, ఉద్దేశాన్ని, విశ్వాసాన్ని[a], ఓర్పును, ప్రేమను, సహనాన్ని శ్రద్ధగా అనుసరించావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్వసనీయతను.’ ఇక్కడి గ్రీకు పదం ఈ సందర్భంలో విశ్వాసం లేదా విశ్వసనీయతను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: అయితే నీవు
  rationale: δέ ముందున్న దుష్టుల వర్ణనతో వ్యత్యాసాన్ని సూచిస్తుంది; Σὺ బలంగా వ్యక్తపరచిన ‘నీవు’ను నిలుపుతుంది.
- source_word: παρηκολούθησάς
  choice: దగ్గరగా అనుసరించావు
  rationale: παρακολουθέω శ్రద్ధగా గమనించడంతో పాటు ఆచరణలో అనుసరించడం అనే భావాన్నీ కలిగి ఉంది.
- source_word: μου
  choice: నా
  rationale: తరువాతి జాబితాలోని అంశాలన్నిటితో సహజంగా అనుసంధానమయ్యే స్వామ్యార్థక రూపం.
- source_word: διδασκαλίᾳ
  choice: బోధను
  rationale: సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే ఆధునిక పదం; ‘సిద్ధాంతం’ కంటే మూలంలోని బోధనా భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἀγωγῇ
  choice: ప్రవర్తనను
  rationale: జీవన విధానం లేదా నడవడిక అనే అర్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: προθέσει
  choice: ఉద్దేశాన్ని
  rationale: పౌలు కలిగిన స్థిరమైన లక్ష్యం లేదా సంకల్పాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πίστει
  choice: విశ్వాసాన్ని
  rationale: πίστις‌కు సాధారణ సమానార్థం; ఈ సందర్భంలో ‘విశ్వసనీయత’ కూడా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
- source_word: μακροθυμίᾳ
  choice: దీర్ఘశాంతాన్ని
  rationale: ప్రత్యేకంగా మనుషుల విషయంలో రెచ్చగొట్టబడినా ఓర్పుతో ఉండే గుణాన్ని సూచించి, ὑπομονή నుండి వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἀγάπῃ
  choice: ప్రేమను
  rationale: ἀγάπηకి సహజమైన, విస్తృతంగా అర్థమయ్యే ఆధునిక తెలుగు సమానార్థం.
- source_word: ὑπομονῇ
  choice: సహనాన్ని
  rationale: కష్టాల మధ్య స్థిరంగా నిలిచి భరించడాన్ని సూచిస్తుంది; μακροθυμίαకు వాడిన ‘దీర్ఘశాంతం’తో భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు పేర్కొన్న సద్గుణాల జాబితాలో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత; నమ్మకం
  rationale: ఈ సందర్భంలో దేవునిపై విశ్వాసం లేదా వ్యక్తిగత విశ్వసనీయత రెండూ సాధ్యమే. ప్రధాన పాఠంలో సాధారణ అర్థమైన ‘విశ్వాసం’ను ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి భావసందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం. జాబితా లయను నిలిపి, μακροθυμία మరియు ὑπομονή మధ్య భావభేదాన్ని ‘దీర్ఘశాంతం’ మరియు ‘సహనం’ ద్వారా చూపించాం.
