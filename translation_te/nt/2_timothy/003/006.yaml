  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: te
  text: ఎందుకంటే, ఇలాంటివారిలో కొందరు ఇళ్లలోకి దొంగచాటుగా చొరబడి, పాపాల భారంతో కుంగిపోయిన[a], రకరకాల కోరికలచేత నడిపించబడుతున్న బలహీన స్త్రీలను[b] చెరపట్టేవారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: ‘పాపాలతో నిండిపోయిన.’ గ్రీకు రూపం పాపాలు పోగై ఉన్న స్థితిని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ఇది న్యూనార్థకమైన, అవమానసూచకమైన ‘చిన్న స్త్రీలు’ అనే పదం; ఈ సందర్భంలో సులభంగా వశమయ్యే స్త్రీలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు క్రియలో బందీలను పట్టుకోవడం లేదా చెరలోకి తీసుకోవడం అనే చిత్రం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: ఇలాంటివారిలో కొందరు
  rationale: ముందటి వచనాల్లో వర్ణించిన వర్గానికి వీరు చెందినవారని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: ఇళ్లలోకి దొంగచాటుగా చొరబడి
  rationale: ἐνδύω ఇక్కడ సూచించే రహస్యమైన, మోసపూరితమైన ప్రవేశ భావాన్ని స్పష్టంగా నిలుపుతుంది; οἰκίας‌ను సందర్భానుకూలంగా ‘ఇళ్లు’ అని అనువదించింది.
- source_word: αἰχμαλωτίζοντες
  choice: చెరపట్టేవారు
  rationale: యుద్ధంలో బందీలను పట్టుకునే మూల చిత్రాన్ని, అలాగే వారిపై ఆధిపత్యం సంపాదించే భావాన్ని నిలుపుతుంది.
- source_word: γυναικάρια
  choice: బలహీన స్త్రీలు
  rationale: ఇది స్త్రీలందరినీ సూచించకుండా, ఈ సందర్భంలో సులభంగా వశమయ్యే ఒక వర్గాన్ని సూచించే న్యూనార్థక, అవమానసూచక పదం. ‘బలహీన స్త్రీలు’ ఆ సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: పాపాల భారంతో కుంగిపోయిన
  rationale: పాపాలు పోగై భారంగా ఉన్న స్థితిని సూచించే పరిపూర్ణ కర్మణి రూప భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀγόμενα
  choice: నడిపించబడుతున్న
  rationale: బయటి ప్రభావానికి లోనై కొనసాగుతున్న కర్మణి భావాన్ని అతిశయించకుండా నిలుపుతుంది.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: రకరకాల కోరికలచేత
  rationale: ἐπιθυμία యొక్క విస్తృతమైన ‘కోరిక/వాంఛ’ భావాన్ని, ποικίλαις యొక్క వైవిధ్యాన్ని సులభమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: γυναικάρια అనే న్యూనార్థక పదం ఎవరిని సూచిస్తుంది?
  choice: బలహీన స్త్రీలు
  alternative: చిన్న స్త్రీలు; అల్పమైన స్త్రీలు; సులభంగా మోసపోయే స్త్రీలు
  rationale: మూలపాఠంలోని మందలింపు ధోరణిని పూర్తిగా తొలగించకుండా, అది స్త్రీలందరి గురించి చేసే సాధారణ ప్రకటన కాదని స్పష్టంగా ఉంచుతుంది. ‘చిన్న స్త్రీలు’ తెలుగులో శరీర పరిమాణం లేదా వయస్సును తప్పుగా సూచించవచ్చు; ‘సులభంగా మోసపోయే’ అనేది సందర్భార్థాన్ని మరీ స్పష్టీకరిస్తుంది.
- issue: οἰκίας‌ను భవనాలుగా మాత్రమే గ్రహించాలా, గృహవాతావరణంగా గ్రహించాలా?
  choice: ఇళ్లు
  alternative: గృహాలు; కుటుంబాలు
  rationale: మూలపదం ప్రత్యక్షంగా ఇళ్లను సూచిస్తుంది; సందర్భంలో ఆ ఇళ్లలోని వ్యక్తులపై ప్రభావం చూపడం అంతర్భూతమై ఉంది. ‘కుటుంబాలు’ అని అనువదిస్తే మూలపాఠం కంటే సంబంధార్థాన్ని బలంగా నిర్ణయించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని ఉపయోగించాం. ‘దొంగచాటుగా చొరబడి’ మోసపూరిత ప్రవేశాన్ని, ‘చెరపట్టేవారు’ ఆధిపత్యం మరియు బందీ చిత్రాన్ని నిలుపుతాయి. వాక్యం మూలంలోని కారణసూచక γάρ‌ను ‘ఎందుకంటే’తో కొనసాగిస్తుంది.
