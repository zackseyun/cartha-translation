  text: ద్రోహులు[a], దుడుకుగా ప్రవర్తించేవారు[b], గర్వంతో ఉబ్బిపోయినవారు[c], దేవుణ్ణి ప్రేమించేవారికంటే సుఖాలను ఎక్కువగా ప్రేమించేవారు.
