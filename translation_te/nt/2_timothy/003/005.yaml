- from: దైవభక్తి రూపం[a] కలిగివుండి, దాని శక్తిని మాత్రం నిరాకరించినవారుగా ఉంటారు. ఇలాంటివారికి దూరంగా ఉండు[b].
  to: దైవభక్తి రూపాన్ని కలిగి ఉండి, దాని శక్తిని నిరాకరించినవారై ఉంటారు; అలాంటివారికి దూరంగా ఉండు[b].[a]
  rationale: The revision makes minor syntactic and stylistic corrections for natural modern Telugu while preserving the source’s participial description, the contrast between outward godliness and its power, and the imperative to avoid such persons. Footnote anchors are retained, with the command footnote at the command and the lexical-form footnote attached to ‘రూపం.’
