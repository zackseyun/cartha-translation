  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: te
  text: దైవభక్తి రూపాన్ని కలిగి ఉండి, దాని శక్తిని నిరాకరించినవారై ఉంటారు; అలాంటివారికి దూరంగా ఉండు[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దైవభక్తి బాహ్యరూపం.” గ్రీకు పదం బాహ్య రూపాన్ని లేదా వ్యక్తీకరణను సూచించగలదు; “రూపం” అనే అనువాదం “శక్తి”తో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అలాంటివారిని తప్పించుకో,” లేదా “వారికి దూరంగా ఉండు.” గ్రీకు క్రియలో తనను తాను వారినుంచి తిప్పుకొని దూరంగా ఉండడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: కలిగివుండి
  rationale: ముందటి వచనాల్లో వర్ణించిన మనుషులను విశేషించే వర్తమాన కృదంతం. తెలుగులో ‘కలిగివుండి’ అనేది కొనసాగుతున్న స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: μόρφωσιν
  choice: రూపం
  rationale: బాహ్య ఆకారం, రూపకల్పన, లేదా మూర్తీభవించిన రూపం అనే భావపరిధిని కలిగి ఉంది. ‘రూపం’ అనే పదం ‘శక్తి’తో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: εὐσεβείας
  choice: దైవభక్తి
  rationale: పాస్టరల్ పత్రికల్లో దేవునిపట్ల గౌరవభావంతో కూడిన జీవనాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దైవభక్తి’ సహజంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: దాని శక్తిని మాత్రం
  rationale: ‘దాని’ అనేది దైవభక్తిని తిరిగి సూచిస్తుంది; ‘మాత్రం’ గ్రీకు δέ తెలిపే వ్యత్యాసాన్ని సహజమైన తెలుగులో బలపరుస్తుంది. ‘శక్తి’ అనే పదం దాని కార్యసాధక వాస్తవాన్ని సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: ἠρνημένοι
  choice: నిరాకరించినవారుగా
  rationale: పరిపూర్ణ కృదంతం గతంలో జరిగిన నిరాకరణ ఫలితంగా కొనసాగుతున్న స్థిర వైఖరిని సూచిస్తుంది. ‘నిరాకరించినవారుగా ఉంటారు’ ఆ ఫలితస్థితిని తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ τούτους ἀποτρέπου
  choice: ఇలాంటివారికి దూరంగా ఉండు
  rationale: మధ్యమ వాచ్య వర్తమాన ఆజ్ఞ తనను తాను వారినుంచి తిప్పుకొని దూరంగా ఉండాలనే భావాన్ని ఇస్తుంది. ‘ఇలాంటివారు’ τούτους సూచించే వ్యక్తులను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: బాహ్య దైవభక్తి రూపానికి, దాని అంతర్గత కార్యసాధక వాస్తవానికి మధ్య వ్యత్యాసం
  choice: ‘దైవభక్తి రూపం’ మరియు ‘దాని శక్తి’ అని అనువదించి వ్యత్యాసాన్ని యథాతథంగా ఉంచడం
  alternative: ‘దైవభక్తి వేషం’ లేదా ‘మతాచారం మాత్రమే’
  rationale: వచనం బాహ్య మతరూపం ఉన్నప్పటికీ దాని కార్యసాధక వాస్తవాన్ని నిరాకరించే స్థితిని విమర్శిస్తుంది. ‘శక్తి’ని అద్భుతాలు, నైతిక పరివర్తన, లేదా పరిశుద్ధాత్మ కార్యం అనే ఏ ఒక్క భావానికీ పరిమితం చేయకుండా గ్రీకు వాక్యంలోని విస్తృతతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ఈ వచనం ముందటి జాబితాను కొనసాగిస్తున్నందున ‘ఉంటారు’తో సందర్భ సంబంధం నిలిపాం. ‘దైవభక్తి,’ ‘రూపం,’ ‘శక్తి,’ ‘నిరాకరించడం’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకుని, ఏ ప్రత్యేక సంఘసిద్ధాంతాన్నీ చేర్చలేదు.
