id: 2TI.3.2
reference: 2 Timothy 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: te
  text: ఎందుకంటే మనుషులు తమను తామే ప్రేమించేవారుగా, డబ్బును ప్రేమించేవారుగా, గొప్పలు చెప్పుకునేవారుగా, అహంకారులుగా, దూషించేవారుగా[a], తల్లిదండ్రులకు అవిధేయులుగా, కృతజ్ఞతలేనివారుగా, భక్తిహీనులుగా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవదూషకులుగా,” “అపవాదు చెప్పేవారుగా,” లేదా “దుర్భాషలాడేవారుగా.” గ్రీకు పదం మనుషులనైనా దేవుణ్ణైనా అవమానించే మాటలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ఉంటారు
  rationale: εἰμί యొక్క భవిష్యత్ రూపాన్ని తెలుగు వాక్యనిర్మాణానికి సహజంగా వాక్యాంతంలో ఉంచి, రాబోయే స్థితిని తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన దానికి ఈ వాక్యం వివరణ లేదా కారణం ఇస్తున్న అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἱ ἄνθρωποι
  choice: మనుషులు
  rationale: గ్రీకు వ్యాకరణంలో పుంలింగ బహువచనమైనా, ఇక్కడ పురుషులకు మాత్రమే కాక సాధారణంగా ప్రజలను సూచిస్తుంది; ‘మనుషులు’ ఆ సమగ్ర భావాన్ని సహజంగా అందిస్తుంది.
- source_word: φίλαυτοι
  choice: తమను తామే ప్రేమించేవారుగా
  rationale: స్వార్థపూరితమైన స్వప్రేమను సూచించే సమాసపదం. ఈ రూపం ‘డబ్బును ప్రేమించేవారు’ అనే తరువాతి పదంతో ఉన్న నిర్మాణ సమాంతరతను కాపాడుతుంది; సందర్భం దీనిలోని దోషభావాన్ని స్పష్టం చేస్తుంది.
- source_word: φιλάργυροι
  choice: డబ్బును ప్రేమించేవారుగా
  rationale: అక్షరార్థంగా వెండి లేదా ధనాన్ని ప్రేమించేవారు. ‘లోభులు’ కంటే మూలంలోని ప్రేమ భావాన్నీ, φίλαυτοι తో సమాంతరతనూ బాగా నిలుపుతుంది.
- source_word: ἀλαζόνες
  choice: గొప్పలు చెప్పుకునేవారుగా
  rationale: తమ గురించి ఆడంబరంగా, అతిశయంగా చెప్పుకునే స్వభావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπερήφανοι
  choice: అహంకారులుగా
  rationale: ప్రతికూల నైతిక భావంతో కూడిన గర్వం, ఔద్ధత్యాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: βλάσφημοι
  choice: దూషించేవారుగా
  rationale: ఈ పదం మనుషులపై అపవాదు లేదా దుర్భాషను, దేవునిపై దూషణను కూడా సూచించగలదు. ప్రధాన పాఠంలో విస్తృతంగా వర్తించే ‘దూషించేవారు’ను ఎంచుకొని, ఇతర సాధ్య భావాలను పాదసూచికలో ఉంచాం.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: తల్లిదండ్రులకు అవిధేయులుగా
  rationale: తల్లిదండ్రుల మాటకు లోబడని భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀχάριστοι
  choice: కృతజ్ఞతలేనివారుగా
  rationale: కృతజ్ఞత చూపని స్వభావాన్ని నేరుగా తెలియజేసే స్పష్టమైన ఆధునిక రూపం.
- source_word: ἀνόσιοι
  choice: అపవిత్రులుగా
  rationale: పవిత్రమైనదాని పట్ల గౌరవం లేదా భక్తి లేని నైతిక-మతపరమైన భావాన్ని నిలుపుతుంది; ‘భక్తిహీనులు’ కంటే మూలపదపు విస్తృత భావాన్ని తగ్గించదు.
theological_decisions:
- issue: οἱ ἄνθρωποι అనే వ్యాకరణపరమైన పుంలింగ పదబంధం యొక్క పరిధి
  choice: మనుషులు
  alternative: పురుషులు
  rationale: ఇక్కడ సూచన పురుషులకు మాత్రమే పరిమితం కాదు; సాధారణ మానవ సమూహాన్ని సూచిస్తుంది. అందువల్ల లింగపరంగా అనవసరమైన పరిమితిని విధించకుండా ‘మనుషులు’ అని అనువదించాం.
- issue: βλάσφημοι యొక్క లక్ష్యం—మనుషులా, దేవుడా
  choice: దూషించేవారు
  alternative: దేవదూషకులు; అపవాదు చెప్పేవారు; దుర్భాషలాడేవారు
  rationale: గ్రీకు పదం దేవుని అవమానించే మాటలకూ, మనుషుల ప్రతిష్ఠను దెబ్బతీసే లేదా వారిని దుర్భాషలాడే మాటలకూ వర్తించగలదు. ప్రధాన పాఠంలో ఒకే లక్ష్యానికి పరిమితం చేయకుండా, నిజమైన అర్థసందిగ్ధతను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. గ్రీకు దోషాల జాబితాలోని వరుస లయను నిలుపుటకు ప్రతి లక్షణానికి ‘-వారుగా/‑లుగా’ రూపాన్ని వాడి, ప్రధాన క్రియ ‘ఉంటారు’ను సహజమైన తెలుగు క్రమంలో వాక్యాంతంలో ఉంచాం. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు ‘lovers of self’ తరువాత కనిపించినప్పటికీ, పాదసూచిక విషయం βλάσφημοι గురించినది కాబట్టి మూలభాష ఆధారంగా గుర్తును ‘దూషించేవారుగా’ తరువాత ఉంచాం.
