- from: నా హింసలను, బాధలను, అంతియొకయలో, ఈకొనియలో, లుస్త్రలో నాకు సంభవించినవాటిని—నేను ఎలాంటి హింసలను సహించానో—నీవు అనుసరించావు; వాటన్నిటి నుంచీ ప్రభువు నన్ను విడిపించాడు.[a]
  to: హింసలను, బాధలను—అంతియొకయలో, ఈకొనియలో, లుస్త్రలో నాకు సంభవించినవాటిని—నేను ఎలాంటి హింసలను సహించానో; వాటన్నిటి నుంచీ ప్రభువు నన్ను విడిపించాడు.[a]
