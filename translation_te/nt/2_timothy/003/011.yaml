id: 2TI.3.11
reference: 2 Timothy 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: te
  text: హింసలను, బాధలను—అంతియొకయలో, ఈకొనియలో, లుస్త్రలో నాకు సంభవించినవాటిని—నేను ఎలాంటి హింసలను సహించానో; వాటన్నిటి నుంచీ ప్రభువు నన్ను విడిపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రభువు’ అనేది బహుశా ప్రభువైన యేసును సూచిస్తుంది; అయితే గ్రీకు పాఠ్యంలో ‘ప్రభువు’ అని మాత్రమే ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: హింసలను
  rationale: విశ్వాసం లేదా పరిచర్య కారణంగా ఎదురయ్యే శత్రుత్వపూరిత అణచివేతను సూచించే సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: παθήμασιν
  choice: బాధలను
  rationale: బాహ్య కష్టాలకు మాత్రమే పరిమితం చేయకుండా అనుభవించిన వేదనను విస్తృతంగా తెలియజేస్తుంది.
- source_word: οἷά μοι ἐγένετο
  choice: నాకు సంభవించినవాటిని
  rationale: ముందు పేర్కొన్న హింసలు, బాధలకు ఈ పట్టణాల్లో జరిగినవి ఉదాహరణలని తెలియజేస్తుంది.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: అంతియొకయలో, ఈకొనియలో, లుస్త్రలో
  rationale: స్థలనామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, గ్రీకు పునరుక్తి లయను నిలిపింది.
- source_word: οἵους διωγμοὺς
  choice: ఎలాంటి హింసలను
  rationale: οἵους లోని గుణాత్మక, ఆశ్చర్యార్థక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὑπήνεγκα
  choice: సహించానో
  rationale: తీవ్రమైన ఒత్తిడి కింద భరించడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ πάντων
  choice: వాటన్నిటి నుంచీ
  rationale: ఇప్పుడే చెప్పిన హింసలు, బాధలన్నిటి నుంచి జరిగిన విడుదలను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ἐρρύσατο
  choice: విడిపించాడు
  rationale: ప్రమాదం నుంచి రక్షించి బయటకు తేవడం అనే భావాన్ని తెలియజేస్తూ, ఇక్కడ అనవసరమైన రక్షణశాస్త్ర భావాన్ని బలవంతంగా చేర్చదు.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: గ్రీకులో ఉన్న బిరుదును మాత్రమే అనువదించి, సూచించబడిన వ్యక్తి పేరును పాఠ్యంలో అదనంగా చేర్చదు.
theological_decisions:
- issue: ‘ప్రభువు’ ఎవరిని సూచిస్తుంది?
  choice: పాఠ్యంలో ‘ప్రభువు’ అని మాత్రమే ఉంచడం.
  alternative: ‘ప్రభువైన యేసు’ అని స్పష్టీకరించడం.
  rationale: పౌలు వాడుకలో ఇది యేసును సూచించే అవకాశం బలంగా ఉన్నా, గ్రీకు పాఠ్యంలో ὁ κύριος మాత్రమే ఉంది; అందువల్ల మూలంలోని స్వల్ప అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఈ వచనం 3:10లోని ‘నీవు అనుసరించావు’ అనే క్రియకు కొనసాగింపు కావడంతో, తెలుగులో వ్యాకరణ సంపూర్ణత కోసం దానిని ఇక్కడ పునరుద్ఘాటించాం.
