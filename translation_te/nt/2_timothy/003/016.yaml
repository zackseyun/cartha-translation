source:
  edition: SBLGNT
  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: te
  text: 'ప్రతి లేఖనం[a] దేవుని శ్వాసనుండి వచ్చినది, ప్రయోజనకరమైనది[b]—బోధించడానికి, తప్పును ఎత్తిచూపడానికి, సరిదిద్దడానికి, నీతిలో[c] శిక్షణ ఇవ్వడానికి.


    [a] లేదా, “లేఖనమంతా దేవుని శ్వాసనుండి వచ్చినది, ప్రయోజనకరమైనది.” గ్రీకు పదబంధాన్ని “ప్రతి లేఖనం” అని విడివిడిగా గానీ, “లేఖనమంతా” అని సమష్టిగా గానీ అర్థం చేసుకోవచ్చు.


    [b] లేదా, “దేవుని శ్వాసనుండి వచ్చిన ప్రతి లేఖనం కూడా బోధించడానికి, తప్పును ఎత్తిచూపడానికి, సరిదిద్దడానికి, నీతిలో శిక్షణ ఇవ్వడానికి ప్రయోజనకరమైనది.”


    [c] “నీతి” అనే పదాన్ని పౌలు రాసిన కొన్ని సందర్భాల్లో “న్యాయం” అని కూడా అనువదించవచ్చు; ఇక్కడ అది సన్మార్గమైన జీవనానికి వ్యక్తిని తీర్చిదిద్దడాన్ని సూచిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేఖనమంతా దేవుని శ్వాసనుండి వచ్చినది, ప్రయోజనకరమైనది.” గ్రీకు పదబంధాన్ని “ప్రతి లేఖనం” అని విడివిడిగా గానీ, “లేఖనమంతా” అని సమష్టిగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “దేవుని శ్వాసనుండి వచ్చిన ప్రతి లేఖనం కూడా బోధించడానికి, తప్పును ఎత్తిచూపడానికి, సరిదిద్దడానికి, నీతిలో శిక్షణ ఇవ్వడానికి ప్రయోజనకరమైనది.”
    reason: alternative_reading
  - marker: c
    text: “నీతి” అనే పదాన్ని పౌలు రాసిన కొన్ని సందర్భాల్లో “న్యాయం” అని కూడా అనువదించవచ్చు; ఇక్కడ అది సన్మార్గమైన జీవనానికి వ్యక్తిని తీర్చిదిద్దడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: ప్రతి లేఖనం
  rationale: వ్యాసం లేని గ్రీకు పదబంధపు విభాజక భావాన్ని నేరుగా నిలుపుతుంది. సందర్భంలో γραφή సాధారణ రచనను కాక పవిత్ర లేఖనాన్ని సూచిస్తుంది; సమష్టి భావమైన “లేఖనమంతా”ను పాదసూచికలో ఉంచాం.
- source_word: θεόπνευστος
  choice: దేవుని శ్వాసచేత కలిగినది
  rationale: గ్రీకు సమాసంలోని ‘దేవుడు’ మరియు ‘శ్వాస’ భావాలను పారదర్శకంగా తెలియజేస్తూ, తరువాత ఏర్పడిన ప్రేరణ సిద్ధాంతాలను పదంలోకి చొప్పించదు.
- source_word: ὠφέλιμος
  choice: ప్రయోజనకరమైనది
  rationale: తరువాత పేర్కొన్న నాలుగు ఉద్దేశాలకు మేలు చేసే, ఉపయోగపడే స్వభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς διδασκαλίαν
  choice: బోధించడానికి
  rationale: బోధించే క్రియనూ బోధన విషయాన్నీ సందర్భానుసారంగా ఆవరించే సాధారణ, స్పష్టమైన పదప్రయోగం.
- source_word: ἐλεγμόν
  choice: తప్పును ఎత్తిచూపడానికి
  rationale: తప్పును బయటపెట్టి దానిని గుర్తింపజేసే భావాన్ని వ్యక్తిగత దూషణలా వినిపించకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπανόρθωσιν
  choice: సరిదిద్దడానికి
  rationale: తప్పినదాన్ని మళ్లీ సరైన స్థితికి తీసుకురావడం అనే పునరుద్ధరణాత్మక భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: నీతిలో శిక్షణ ఇవ్వడానికి
  rationale: παιδείαలోని రూపుదిద్దే శిక్షణ భావాన్నీ, δικαιοσύνηలోని నీతి భావాన్నీ నిలుపుతుంది.
- source_word: δικαιοσύνῃ
  choice: నీతి
  rationale: ఈ సందర్భంలో నైతికంగా సన్మార్గ జీవితం కోసం రూపుదిద్దడం ప్రధాన భావం. కొన్ని పౌలు సందర్భాల్లో సాధ్యమైన “న్యాయం” అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
theological_decisions:
- issue: πᾶσα γραφὴలో విభాజక లేదా సమష్టి భావం
  choice: “ప్రతి లేఖనం” అనే విభాజక పఠనం
  alternative: “లేఖనమంతా” అనే సమష్టి పఠనం
  rationale: గ్రీకు రూపాన్ని ప్రధాన పాఠ్యంలో నేరుగా ప్రతిబింబిస్తూ, సందర్భానికి సరిపోయే సమష్టి అర్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- issue: θεόπνευστος, ὠφέλιμος పదాలకు πᾶσα γραφὴతో ఉన్న వాక్యనిర్మాణ సంబంధం
  choice: 'రెండు విశేషణాలనూ విధేయాలుగా తీసుకోవడం: “ప్రతి లేఖనం దేవుని శ్వాసచేత కలిగినది, ప్రయోజనకరమైనది”'
  alternative: 'θεόπνευστοςను ఆపాదక విశేషణంగా తీసుకోవడం: “దేవుని శ్వాసచేత కలిగిన ప్రతి లేఖనం కూడా ప్రయోజనకరమైనది”'
  rationale: రెండు విశేషణాలను సమాంతర విధేయాలుగా తీసుకోవడం తరువాతి ఉద్దేశాల జాబితాకు సహజంగా దారితీస్తుంది. అయితే ఆపాదక పఠనం వ్యాకరణపరంగా సాధ్యమే కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గాంభీర్యం నిలిచేలా రూపొందించాం. “దైవప్రేరితమైనది” వంటి సంప్రదాయ పారిభాషిక పదానికి బదులుగా గ్రీకు రూపకాన్ని పారదర్శకంగా చూపే “దేవుని శ్వాసచేత కలిగినది” వాడాం. జాబితాలో సమాంతర క్రియారూపాలను ఉంచి పఠన సౌలభ్యాన్ని కాపాడాం.
