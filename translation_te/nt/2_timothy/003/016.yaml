  revision_rationale: θεόπνευστοςకు సంబంధించిన ప్రధాన పాఠ్యాన్ని, దానికి అనుసంధానమైన రెండు పాదసూచికల పదబంధాలను మాత్రమే సవరించాం. సవరణ మూలంలోని “దేవుడు–శ్వాస” రూపకాన్ని నిలిపి, తెలుగులో అసహజమైన సాధనార్థక నిర్మాణాన్ని తొలగిస్తుంది. ఇతర పదాలు, వాక్యనిర్మాణ అస్పష్టత, మరియు పాదసూచిక గుర్తులన్నీ యథాతథంగా ఉంచబడ్డాయి.
