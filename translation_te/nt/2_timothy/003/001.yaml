id: 2TI.3.1
reference: 2 Timothy 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: te
  text: 'అయితే ఇది తెలుసుకో: చివరి రోజుల్లో కష్టకాలాలు వస్తాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రమాదకరమైన కాలాలు’ లేదా ‘దుర్భరమైన కాలాలు.’ గ్రీకు విశేషణం కష్టమైన, ప్రమాదకరమైన, లేదా బాధాకరమైన కాలాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ఇది
  rationale: ముందుకు వచ్చే ὅτι విషయవాక్యాన్ని సూచించే నపుంసకలింగ సూచన సర్వనామం; తెలుగులో ‘ఇది’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సందర్భం నుంచి స్వల్పమైన వ్యత్యాసాన్ని లేదా కొత్త మలుపును సూచిస్తుంది; ‘అయితే’ దాని బలాన్ని అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: γίνωσκε
  choice: తెలుసుకో
  rationale: వర్తమానకాల కర్తరి ఆజ్ఞార్థక ఏకవచన రూపం; తిమోతికి ఒక వాస్తవాన్ని గ్రహించి ఉంచమనే నేరమైన ఆదేశాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ':'
  rationale: తెలుసుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఇది తెలుసుకో:’ అనే ద్విబిందువు నిర్మాణం సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: చివరి రోజుల్లో
  rationale: మూలంలోని స్థిరమైన అంత్యకాల సంబంధ పదబంధాన్ని దాని కాలవ్యాప్తిని మరింత సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: ἐνστήσονται
  choice: వస్తాయి
  rationale: ఇక్కడ ‘ఉనికిలోకి రావడం, ఎదురవడం, సంభవించడం’ అనే భావం ఉంది; కాలాలకు సంబంధించి ‘వస్తాయి’ సహజమైన ఆధునిక తెలుగు.
- source_word: καιροὶ
  choice: కాలాలు
  rationale: సాధారణ కాలప్రవాహం కంటే నిర్దిష్ట సమయాలు లేదా దశలను సూచిస్తుంది; ‘కాలాలు’ ఈ సందర్భంలో సహజమైన సమానార్థకం.
- source_word: χαλεποί
  choice: కష్ట
  rationale: χαλεπόςలో కఠినమైన, బాధాకరమైన, ప్రమాదకరమైన అనే భావవ్యాప్తి ఉంది; ‘కష్టకాలాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి ప్రధాన విస్తృత భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ‘చివరి రోజులు’ అనే పదబంధం యొక్క కాలవ్యాప్తి
  choice: ‘చివరి రోజుల్లో’ అని మూలంలోని అంత్యకాల పదబంధాన్ని యథాతథంగా నిలుపడం
  alternative: క్రీస్తు తిరిగి రావడానికి కేవలం వెంటనే ముందున్న చివరి కాలం అని స్పష్టీకరించడం; లేదా ఇప్పటికే ప్రారంభమైన విస్తృత అంత్యకాలం అని వివరించడం
  rationale: గ్రీకు వాక్యం ఈ ఒక్క వచనంలో కాలవ్యాప్తిని ఖచ్చితంగా నిర్వచించదు. అందువల్ల ఏ ప్రత్యేక అంత్యకాల వ్యవస్థనూ అనువాదంలోకి చేర్చకుండా అసలు భావంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన మరియు సంక్షిప్తమైన శైలి. ‘కష్టకాలాలు’ అనే సహజ సమాసం పఠన సౌలభ్యాన్ని ఇస్తుంది; ప్రత్యామ్నాయ తీవ్ర భావాలను పాదటిప్పణిలో నిలిపాం.
