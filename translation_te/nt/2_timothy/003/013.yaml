id: 2TI.3.13
reference: 2 Timothy 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: te
  text: అయితే దుష్టులూ మోసగాళ్లూ ఇతరులను మోసపరుస్తూ, తామూ మోసపోతూ, అంతకంతకు చెడిపోతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మోసగాళ్లు” అనే గ్రీకు పదానికి “కపట వేషధారులు” లేదా “వంచకులు” అని కూడా అర్థం కావచ్చు; కొన్ని సందర్భాల్లో దానికి మాంత్రికత లేదా నాటు వైద్యం ద్వారా మోసగించే వారి భావ ఛాయలు ఉంటాయి. “అంతకంతకు చెడిపోతారు” అన్నది అక్షరార్థంగా “మరింత చెడ్డదాని వైపు ముందుకు సాగుతారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: దుష్టులు
  rationale: ఇది కేవలం నాసిరకం లేదా చెడ్డ స్థితిని కాక, నైతిక దుష్టత్వాన్ని సూచిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న వాక్యంతో వ్యత్యాసాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἄνθρωποι
  choice: వ్యక్తులు (దుష్టులు అనే నామవాచక ప్రయోగంలో అంతర్లీనంగా)
  rationale: గ్రీకు బహువచనం ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాకుండా సాధారణంగా మనుషులను సూచిస్తుంది; ‘దుష్టులు’ సహజంగా ఆ సాధారణ భావాన్ని అందిస్తుంది.
- source_word: γόητες
  choice: మోసగాళ్లు
  rationale: మోసపూరిత వంచకులు లేదా కపట ప్రదర్శకులు అనే ప్రధాన సందర్భార్థాన్ని అందిస్తుంది; మాంత్రికత అనే భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: అంతకంతకు చెడిపోతారు
  rationale: అక్షరార్థంగా ‘మరింత చెడ్డదాని వైపు ముందుకు సాగుతారు’; వ్యంగ్యంగా వాడిన పురోగతి భావాన్ని తెలుగులో సహజమైన దిగజారుదల వ్యక్తీకరణతో అందిస్తుంది.
- source_word: πλανῶντες
  choice: ఇతరులను మోసపరుస్తూ
  rationale: కొనసాగుతున్న క్రియను తెలియజేస్తుంది; కర్మను స్పష్టపరచడానికి తెలుగులో ‘ఇతరులను’ చేర్చడం సహజం.
- source_word: πλανώμενοι
  choice: తామూ మోసపోతూ
  rationale: కర్తలే మోసానికి గురవుతున్నారనే గ్రీకు కర్మణి భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἄνθρωποι అనే వ్యాకరణపరంగా పుంలింగ బహువచనానికి లింగసూచన
  choice: లింగపరంగా సాధారణమైన ‘దుష్టులు’
  alternative: దుష్ట పురుషులు
  rationale: సందర్భంలో పురుషులకు మాత్రమే పరిమితి లేదు; మూలంలోని సాధారణ మానవ సూచనను కాపాడుతుంది.
- issue: γόητες లోని భావ ఛాయ
  choice: మోసగాళ్లు
  alternative: మాంత్రికులు / కపట వేషధారులు
  rationale: పదానికి కొన్ని సందర్భాల్లో మాంత్రికత లేదా నాటు వైద్యం వంటి ఛాయలు ఉన్నా, ఇక్కడ మోసపూరిత వంచన ప్రధానంగా కనిపిస్తుంది; అందువల్ల సందర్భం నిర్ధారించని క్షుద్రవిద్య భావాన్ని రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘మోసపరుస్తూ—మోసపోతూ’ అనే సమాంతర నిర్మాణంతో మూలంలోని క్రియాశీల/కర్మణి ఉద్వేగాన్ని నిలిపింది.
