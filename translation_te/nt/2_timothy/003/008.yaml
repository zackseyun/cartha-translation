id: 2TI.3.8
reference: 2 Timothy 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: te
  text: యన్నేసు, యంబ్రేసు మోషేను ఎదిరించినట్లే[a], వీరు కూడా సత్యాన్ని ఎదిరిస్తున్నారు. వీరు బుద్ధి చెడిపోయిన మనుషులు; విశ్వాసం విషయంలో పరీక్షకు నిలవనివారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మోషేను ప్రతిఘటించినట్లే’ … ‘సత్యాన్ని ప్రతిఘటిస్తున్నారు.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘విశ్వాసం’ అనేది కేవలం వ్యక్తిగత నమ్మకాన్ని కాక, క్రైస్తవ విశ్వాసాన్ని లేదా అపొస్తలుల సందేశాన్ని సూచించే అవకాశం ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: ఎదిరించినట్లే
  rationale: ὃν τρόπον... οὕτως అనే పోలిక నిర్మాణాన్ని తెలుగులో సహజమైన ‘...చినట్లే ... కూడా’ రూపంలో తెలిపింది. δέ ఇక్కడ స్వల్ప సంధానాన్ని సూచిస్తుంది; ప్రత్యేక పదంగా అనువదిస్తే తెలుగు వాక్యం కృత్రిమంగా ఉండే కారణంగా నిర్మాణంలోనే దాని ప్రవాహం ప్రతిఫలించింది.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: యన్నే, యంబ్రే
  rationale: గ్రీకు వ్యక్తినామాల ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేసింది.
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: ఎదిరించినట్లే / ఎదిరిస్తున్నారు
  rationale: రెండు రూపాల మధ్యనున్న పదసామ్యాన్ని నిలుపుతూ, మొదటి క్రియలో గత సంఘటనను, రెండవ క్రియలో కొనసాగుతున్న వర్తమాన వ్యతిరేకతను స్పష్టంగా తెలిపింది.
- source_word: Μωϋσεῖ
  choice: మోషేను
  rationale: ఎదిరించు అనే తెలుగు క్రియతో సహజంగా వచ్చే కర్మరూపాన్ని ఉపయోగించింది.
- source_word: οὕτως καὶ οὗτοι
  choice: వీరు కూడా
  rationale: ముందు సందర్భంలో సూచించబడిన నిర్దిష్ట వ్యక్తులను తెలుగులో సహజంగా సూచిస్తూ పోలికలోని ‘కూడా’ భావాన్ని నిలిపింది.
- source_word: τῇ ἀληθείᾳ
  choice: సత్యాన్ని
  rationale: మూలంలోని విస్తృత అర్థాన్ని కుదించకుండా ఉంచింది; దీనిని అనువాదంలోనే ‘సువార్త’ లేదా ‘అపొస్తలుల బోధ’గా ప్రత్యేకీకరించలేదు.
- source_word: ἄνθρωποι
  choice: మనుషులు
  rationale: తెలుగులో ఈ బహువచన రూపం సందర్భంలోని వ్యక్తులను సహజంగా సూచిస్తుంది; ‘వీరు’ అనే పురుషసూచక సందర్భం వారి నిర్దిష్టతను నిలుపుతుంది.
- source_word: κατεφθαρμένοι τὸν νοῦν
  choice: మనసు చెడిపోయిన
  rationale: పూర్తయిన చెడుదల ఫలితంగా ఉన్న స్థితిని సహజమైన ఆధునిక తెలుగులో తెలిపింది; νοῦς లోని ఆలోచన, వివేచన, అంతర్మనస్సు భావవిస్తృతిని ‘మనసు’ నిలుపుతుంది.
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: విశ్వాసం విషయంలో పరీక్షకు నిలవనివారు
  rationale: ἀδόκιμοι లోని పరీక్షించబడి ఆమోదయోగ్యంగా తేలకపోవడం అనే మూల భావాన్ని ‘అయోగ్యులు’ కంటే స్పష్టంగా వ్యక్తం చేసింది; περί నిర్మాణాన్ని ‘విషయంలో’గా సహజంగా తెలిపింది.
theological_decisions:
- issue: ‘సత్యం’ మరియు ‘విశ్వాసం’ దేనిని సూచిస్తున్నాయి?
  choice: రెండింటినీ మూలంలోని విస్తృత రూపంలోనే ‘సత్యం’, ‘విశ్వాసం’గా ఉంచడం.
  alternative: వాటిని నేరుగా ‘సువార్త సత్యం’, ‘క్రైస్తవ బోధ’ లేదా వ్యక్తిగత నమ్మకం అని వివరణాత్మకంగా అనువదించడం.
  rationale: సందర్భంలో ఇవి అపొస్తల బోధనకూ క్రైస్తవ విశ్వాసానికీ సంబంధించినవిగా ఉండవచ్చు; అయినా మూలవచనం ఆ పరిధిని పదబంధాల్లోనే ఖచ్చితంగా నిర్ధారించదు. అందువల్ల అనువాదం ఆ అర్థవిస్తృతిని నిలుపుతుంది.
- issue: ἀδόκιμοι యొక్క తీర్పు భావం
  choice: ‘పరీక్షకు నిలవనివారు’ అని అనువదించడం.
  alternative: ‘తిరస్కరించబడినవారు’, ‘అయోగ్యులు’ లేదా ‘విశ్వాసం లేనివారు’.
  rationale: ఈ పదం పరీక్షలో ఆమోదం పొందకపోవడాన్ని సూచిస్తుంది. ఇది వారి వ్యక్తిగత రక్షణ స్థితిపై మూలం చెప్పినదానికన్నా ఎక్కువ నిర్ణయం విధించకుండా, విశ్వాసానికి సంబంధించి వారు విఫలమయ్యారనే భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించింది. పోలికను ఒకే పొడవైన వాక్యంగా బిగించకుండా రెండు వాక్యాలుగా విభజించి స్పష్టత పెంచింది; మూలంలోని సమాంతర ‘ఎదిరించు’ క్రియను మాత్రం నిలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
