revisions:
- from: యన్నే, యంబ్రే మోషేను ఎదిరించినట్లే[a], వీరు కూడా సత్యాన్ని ఎదిరిస్తున్నారు. వీరు మనసు చెడిపోయిన మనుషులు; విశ్వాసం విషయంలో పరీక్షకు నిలవనివారు[b].
  to: యన్నేసు, యంబ్రేసు మోషేను ఎదిరించినట్లే[a], వీరు కూడా సత్యాన్ని ఎదిరిస్తున్నారు. వీరు బుద్ధి చెడిపోయిన మనుషులు; విశ్వాసం విషయంలో పరీక్షకు నిలవనివారు[b].
  rationale: The revision corrects the transliteration of the two names and refines the rendering of νοῦς from an affective “మనసు” to the more contextually appropriate “బుద్ధి.” It otherwise preserves the draft’s faithful comparative construction, tense distinction, broad theological terminology, and footnote content.
