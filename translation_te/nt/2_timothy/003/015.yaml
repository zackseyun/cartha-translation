revisions:
- from: అంతేకాక, పసిప్రాయం నుంచే నీకు పవిత్ర రచనలు[a] తెలుసు. మెస్సీయ యేసుపై విశ్వాసం ద్వారా రక్షణ పొందేలా అవి నిన్ను జ్ఞానవంతుణ్ణి చేయగలవు[b].
  to: అంతేకాక, పసితనం నుంచే నీకు పవిత్ర రచనలు[a] తెలుసు; అవి మెస్సీయ యేసుపై విశ్వాసం[b] ద్వారా రక్షణకు నిన్ను జ్ఞానవంతుణ్ణి చేయగలవు.
  rationale: The revision improves idiomatic Telugu, restores the Greek sequence ‘make wise for salvation through faith,’ and corrects the b footnote so that it neither introduces an unsupported ‘Jesus’ faithfulness’ reading nor floats without a relevant anchor. The sentence remains appropriately connected to the preceding context by ‘అంతేకాక.’
