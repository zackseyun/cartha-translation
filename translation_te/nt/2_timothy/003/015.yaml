  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: te
  text: అంతేకాక, పసితనం నుంచే నీకు పవిత్ర రచనలు[a] తెలుసు; అవి మెస్సీయ యేసుపై విశ్వాసం[b] ద్వారా రక్షణకు నిన్ను జ్ఞానవంతుణ్ణి చేయగలవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్ర లేఖనాలు.’ గ్రీకులో అక్షరార్థంగా ‘పవిత్ర రచనలు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మెస్సీయ యేసులో ఉన్న విశ్వాసం ద్వారా.’ సందర్భంలో ఇది మెస్సీయ యేసుపై ఉంచే విశ్వాసాన్ని సూచిస్తుంది.
    reason: translation_clarification
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: పసిప్రాయం నుంచే
  rationale: βρέφος చాలా చిన్న వయస్సును, శిశుదశను సూచిస్తుంది. ‘పసిప్రాయం నుంచే’ ఆ బలమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἱερὰ γράμματα
  choice: పవిత్ర రచనలు
  rationale: గ్రీకు పదబంధంలోని ‘పవిత్రమైన రచనలు’ అనే అక్షరార్థాన్ని నిలుపుతుంది; తరువాత ఏర్పడిన సాంకేతిక పదప్రయోగాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: οἶδας
  choice: నీకు ... తెలుసు
  rationale: οἶδα రూపంలో perfect అయినా వర్తమాన జ్ఞానస్థితిని సూచిస్తుంది. ‘పసిప్రాయం నుంచే’తో కలిసి ‘తెలుసు’ తెలుగులో నిరంతరంగా ఉన్న జ్ఞానాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: అవి నిన్ను జ్ఞానవంతుణ్ణి చేయగలవు
  rationale: రచనలే కర్తలని స్పష్టంగా ఉంచుతూ, σοφίζω లోని ‘జ్ఞానవంతునిగా చేయడం’ అనే ప్రత్యక్ష భావాన్ని కాపాడుతుంది.
- source_word: εἰς σωτηρίαν
  choice: రక్షణ పొందేలా
  rationale: εἰς సూచించే గమ్యం లేదా ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: διὰ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: ఇక్కడ πίστιςకు సాధారణమైన ‘విశ్వాసం’ భావమే సందర్భానికి అత్యంత సహజం; διά సాధనాన్ని సూచిస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసుపై
  rationale: Χριστόςను బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది. విశ్వాసానికి సంబంధించిన ἐνను తెలుగులో సహజంగా ‘యేసుపై’ అని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Χριστῷను బిరుదుగా అనువదించాలా, పేరులో భాగంలా ఉంచాలా
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: Χριστός ఇక్కడ అభిషిక్తుడైన మెస్సీయ అనే బిరుదు భావాన్ని కలిగి ఉంది; అందువల్ల ఆ అర్థాన్ని అనువాదంలో ప్రత్యక్షంగా ఉంచాం.
- issue: διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦలో πίστεως భావం
  choice: మెస్సీయ యేసుపై విశ్వాసం ద్వారా
  alternative: మెస్సీయ యేసు విశ్వసనీయత ద్వారా
  rationale: ఈ నిర్మాణంలో యేసుపై ఉంచే విశ్వాసం అనే భావమే వ్యాకరణపరంగా, సందర్భపరంగా మరింత సహజం. అయితే ‘విశ్వసనీయత’ అనే తక్కువ సంభావ్యమైన పఠనాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. గ్రీకు వాక్యంలోని సంబంధాన్ని నిలుపుతూ ‘అంతేకాక’తో ప్రారంభించాం; పొడవైన నిర్మాణాన్ని రెండు వాక్యాలుగా విభజించి సహజ పఠనాన్ని సాధించాం.
