revisions:
- from: అంతేకాదు, క్రీస్తు యేసులో భక్తితో జీవించాలని కోరుకునే వారందరూ హింసకు గురవుతారు.
  to: నిజానికి, మెస్సీయ యేసులో[a] భక్తితో జీవించాలని కోరుకునే వారందరూ హింసకు గురవుతారు.
  rationale: 'The revision makes only two targeted changes: it moderates the rendering of καὶ δέ and renders Χριστός as the active title ‘మెస్సీయ,’ in line with the source and English audit trail. All other wording is retained in sense, including the universal scope, desired devout life, relation/sphere ‘in,’ and future passive persecution.'
  reviewer_model: gpt-5.6-terra
