id: 2TI.3.12
reference: 2 Timothy 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: te
  text: నిజానికి, మెస్సీయ యేసులో[a] భక్తితో జీవించాలని కోరుకునే వారందరూ హింసకు గురవుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు యేసులో.’
    reason: Χριστός‌ను తెలుగులో సంప్రదాయంగా ‘క్రీస్తు’ అని కూడా పలుకుతారు; మూలంలోని బిరుదు భావాన్ని ప్రధాన పాఠంలో ‘మెస్సీయ’ ద్వారా చూపించబడింది.
lexical_decisions:
- source_word: καὶ πάντες δὲ
  choice: అంతేకాదు, ... వారందరూ
  rationale: καί–δέ కలయిక ముందున్న సందర్భంతో అనుసంధానిస్తూ నిర్ధారణాత్మక బలాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘అంతేకాదు’ ఆ భావాన్ని అతిశయింపకుండా తెలియజేస్తుంది; πάντες యొక్క సార్వత్రిక పరిధిని ‘వారందరూ’ నిలుపుతుంది.
- source_word: οἱ θέλοντες
  choice: కోరుకునే వారు
  rationale: వర్తమాన కృదంత నిర్మాణంలోని సంకల్పం లేదా కోరిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ζῆν εὐσεβῶς
  choice: భక్తితో జీవించాలని
  rationale: εὐσεβῶς దేవునిపట్ల భక్తి ప్రతిఫలించే జీవనరీతిని సూచించే క్రియావిశేషణం. ‘భక్తితో’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం నైతికంగా మంచిగా జీవించడం అనే పరిమిత భావాన్ని నివారిస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: క్రీస్తు యేసులో
  rationale: ἐν సంబంధం/ఐక్యత అనే పరిధిని ‘లో’ నిలుపుతుంది. తెలుగు క్రైస్తవ వాడుకలో Χριστός‌కు స్థిరమైన, విస్తృతంగా అర్థమయ్యే బిరుదురూపం ‘క్రీస్తు’; ఇది మూలంలోని బిరుదును పేరులా పూర్తిగా కలిపివేయదు.
- source_word: διωχθήσονται
  choice: హింసకు గురవుతారు
  rationale: διώκω యొక్క భవిష్యత్ కర్మణి రూపాన్ని సహజమైన తెలుగులో నేరుగా తెలియజేస్తుంది; హింస తప్పనిసరిగా ఎదురవుతుందనే వాక్య బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Χριστῷను బిరుదుగా ఎలా వ్యక్తం చేయాలి
  choice: క్రీస్తు యేసు
  alternative: మెస్సీయ యేసు
  rationale: Χριστός మూలంలో బిరుదు అయినప్పటికీ, ఆధునిక ప్రామాణిక తెలుగులో ‘క్రీస్తు’ విస్తృతంగా గుర్తించబడే బిరుదురూపం. ‘మెస్సీయ’ కూడా అర్థసమ్మతమే కాని ఈ పౌలు వాక్యబంధంలో తక్కువ సహజంగా వినిపిస్తుంది.
- issue: ἐν Χριστῷ Ἰησοῦ యొక్క సంబంధ భావం
  choice: క్రీస్తు యేసులో
  alternative: క్రీస్తు యేసుతో సంబంధంలో
  rationale: ‘లో’ మూలంలోని సంక్షిప్తతను, క్రీస్తుతో ఐక్యత/ఆయన పరిధిలో జీవించడం అనే ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది; వివరణాత్మక ప్రత్యామ్నాయం ఆ అర్థాన్ని అనవసరంగా కుదించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్యంలోని సార్వత్రికత మరియు భవిష్యత్ నిశ్చయాన్ని నిలుపుతూ గౌరవప్రదమైన శైలి వాడబడింది.
