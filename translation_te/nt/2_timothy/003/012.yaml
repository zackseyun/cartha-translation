review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the universal scope (πάντες), the volitional participle ('కోరుకునే'), the devout manner of life (εὐσεβῶς), the sphere expressed by ἐν, and the future passive certainty of διωχθήσονται. ‘హింసకు గురవుతారు’ is a sound natural Telugu rendering of the passive. However, ‘అంతేకాదు’ is more strongly additive ('moreover/not only that') than the mild connective-confirmatory καὶ δέ, and the title Χριστός is better represented as ‘మెస్సీయ’ in this title-active phrase, consistent with the audit trail.
  naturalness: The sentence is otherwise fluent modern standard Telugu. ‘నిజానికి’ provides an idiomatic, non-overstated rendering of the connective/emphatic force. ‘భక్తితో జీవించాలని’ and ‘హింసకు గురవుతారు’ are natural and appropriately formal without being archaic.
  terminology: Use ‘మెస్సీయ యేసు’ for Χριστῷ Ἰησοῦ where the messianic title remains active. Retain ‘క్రీస్తు యేసు’ as a footnoted conventional alternative. ‘భక్తితో’ suitably conveys εὐσεβῶς without narrowing it to merely ethical goodness.
  issues:
  - severity: low
    issue: ‘అంతేకాదు’ overstates the connective force of καὶ δέ.
    rationale: It can imply an additional escalating point (‘not only that/moreover’), whereas the Greek here is mildly connective and confirmatory. ‘నిజానికి’ better fits the sense.
  - severity: medium
    issue: ‘క్రీస్తు యేసు’ leaves Χριστός in a conventional name-like form without displaying its active titular sense.
    rationale: The source phrase permits and the English POB audit trail prefers ‘Messiah Jesus.’ ‘మెస్సీయ యేసు’ preserves the title transparently for this rendering; the familiar form can be supplied as an alternative footnote.
  revised_text: నిజానికి, మెస్సీయ యేసులో[a] భక్తితో జీవించాలని కోరుకునే వారందరూ హింసకు గురవుతారు.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు యేసులో.’
    reason: Χριστός‌ను తెలుగులో సంప్రదాయంగా ‘క్రీస్తు’ అని కూడా పలుకుతారు; మూలంలోని బిరుదు భావాన్ని ప్రధాన పాఠంలో ‘మెస్సీయ’ ద్వారా చూపించబడింది.
  revision_rationale: 'The revision makes only two targeted changes: it moderates the rendering of καὶ δέ and renders Χριστός as the active title ‘మెస్సీయ,’ in line with the source and English audit trail. All other wording is retained in sense, including the universal scope, desired devout life, relation/sphere ‘in,’ and future passive persecution.'
