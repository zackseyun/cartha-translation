id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: te
  text: పౌలు, దేవుని చిత్తం ద్వారా మెస్సీయ యేసు అపొస్తలుడిగా, మెస్సీయ యేసులో ఉన్న జీవానికి సంబంధించిన వాగ్దానం ప్రకారం—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: పౌలు
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరంగా వాడుకలో ఉన్న లిప్యంతరీకరణ.
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: పౌలు తన అధికారిక పిలుపును సూచించడానికి వాడిన స్థిరమైన సాంకేతిక పదాన్ని కాపాడుతుంది; సాధారణమైన ‘దూత’ అని సరళీకరించదు.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసు / మెస్సీయ యేసులో
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉండటంతో దాని అర్థాన్ని ‘మెస్సీయ’గా తెలుపుతుంది; ἐν భావాన్ని ‘లో’తో నిలుపుతుంది.
- source_word: διὰ θελήματος θεοῦ
  choice: దేవుని చిత్తం ప్రకారం
  rationale: దేవుని చిత్తమే పౌలు అపొస్తలత్వానికి ఆధారం, అధికారం అని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατ’ ἐπαγγελίαν
  choice: వాగ్దానానికి అనుగుణంగా
  rationale: κατά యొక్క అనురూపత లేదా అనుసరణ భావాన్ని కాపాడుతుంది; అపొస్తలత్వానికీ వాగ్దానానికీ ఉన్న సంబంధాన్ని ఉద్దేశపూర్వకంగా విస్తరించి చెప్పదు.
- source_word: ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో ఉన్న జీవం
  rationale: ఆర్టికల్‌తో కూడిన ἐν పదబంధం ‘జీవం’ను విశేషిస్తున్న నిర్మాణాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: Χριστός పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ అభివాదంలో Χριστόςకు బిరుదు భావం స్పష్టంగా ఉన్నందున దాని అర్థాన్ని అనువదించడం సముచితం; సంప్రదాయ లిప్యంతరీకరణను ప్రధాన పాఠ్యంలోకి మార్చి అర్థాన్ని మరుగుపరచలేదు.
- issue: κατ’ ἐπαγγελίαν పదబంధం దేనితో సంబంధించిందనే అంశం
  choice: గ్రీకు వాక్యక్రమాన్ని అనుసరించి పౌలు అపొస్తలత్వంతో సంబంధం కనిపించేలా ఉంచడం
  alternative: ‘జీవ వాగ్దానాన్ని ప్రకటించడానికి’ అని ఉద్దేశార్థాన్ని స్పష్టీకరించడం
  rationale: κατά నిర్మాణం సంబంధాన్ని సూచించినా దాని ఖచ్చిత స్వరూపాన్ని పూర్తిగా వివరిస్తుండదు. కాబట్టి లక్ష్యం లేదా సేవా బాధ్యతగా మాత్రమే నిర్ధారించకుండా అసలు వాక్యంలోని సంక్షిప్తతను, భావ ఉద్వేగాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది తరువాతి వచనంలో కొనసాగే లేఖారంభ వాక్యం కాబట్టి ముగింపులో దీర్ఘ విరామచిహ్నం ఉంచబడింది. ప్రధాన పాఠ్యంలో అడుగుటిప్పణి సూచికలు లేవు; అందువల్ల footnotes ఖాళీగా ఉన్నాయి.
