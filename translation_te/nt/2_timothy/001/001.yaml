revisions:
- from: దేవుని చిత్తం ప్రకారం మెస్సీయ యేసు అపొస్తలుడైన పౌలు—మెస్సీయ యేసులో ఉన్న జీవం గురించిన వాగ్దానానికి అనుగుణంగా—
  to: పౌలు, దేవుని చిత్తం ద్వారా మెస్సీయ యేసు అపొస్తలుడిగా, మెస్సీయ యేసులో ఉన్న జీవానికి సంబంధించిన వాగ్దానం ప్రకారం—
  rationale: The revision clarifies the Greek relationship in “promise of life” without adding a specific theological interpretation, and renders διά more closely. It preserves the source's compact syntax, Messiah terminology, and the unfinished letter-opening punctuation.
