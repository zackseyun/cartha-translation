revisions:
- from: ఒనేసిఫొరు ఇంటివారికి ప్రభువు కనికరం అనుగ్రహించుగాక! ఎందుకంటే అతడు అనేకసార్లు నాకు సేదదీర్చాడు; నా సంకెను గురించి సిగ్గుపడలేదు.[a]
  to: ఒనేసిఫొరు ఇంటివారికి ప్రభువు కనికరం అనుగ్రహించుగాక! ఎందుకంటే అతడు అనేకసార్లు నాకు సేదదీర్చాడు; నా సంకెను గురించి అతనికి సిగ్గు కలగలేదు.[a]
