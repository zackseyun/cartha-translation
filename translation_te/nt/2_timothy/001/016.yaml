id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: te
  text: ఒనేసిఫొరు ఇంటివారికి ప్రభువు కనికరం అనుగ్రహించుగాక! ఎందుకంటే అతడు అనేకసార్లు నాకు సేదదీర్చాడు; నా సంకెను గురించి అతనికి సిగ్గు కలగలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా చెరను గురించి’; అక్షరార్థంగా, ‘నా సంకెను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: అనుగ్రహించుగాక
  rationale: అయోరిస్ట్ ఆప్టేటివ్ వ్యక్తపరిచే ప్రార్థనాత్మక కోరికను సహజమైన తెలుగు ఆశీర్వాద శైలిలో తెలియజేస్తుంది.
- source_word: ἔλεος
  choice: కనికరం
  rationale: అవసరంలో దేవుడు చూపే దయను సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: దైవ బిరుదైన κύριοςకు ప్రామాణిక అనువాదం; అది ఎవరిని సూచిస్తుందో వచనం చెప్పనందున మరింత నిర్దిష్టం చేయలేదు.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: ఒనేసిఫొరు ఇంటివారికి
  rationale: οἶκος భవనాన్ని మాత్రమే కాక కుటుంబం లేదా గృహసమూహాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఆధునిక తెలుగులో ఆ సామాజిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రార్థనాత్మక ఆశీర్వాదానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: πολλάκις
  choice: అనేకసార్లు
  rationale: పునరావృతమైన చర్యను మూలానికి దగ్గరగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀνέψυξεν
  choice: నాకు సేదదీర్చాడు
  rationale: ఉపశమనం, నూతనోత్సాహం కలిగించడం అనే రూపకాన్ని నిలుపుతుంది; తెలుగు వాక్యనిర్మాణం కోసం ‘నాకు’తో ప్రయోగించబడింది.
- source_word: τὴν ἅλυσίν μου
  choice: నా సంకెను
  rationale: మూలంలోని ఏకవచన concrete imageను నిలుపుతుంది; అది పౌలు చెరను సూచించే లక్షణార్థక ప్రయోగం కావచ్చు.
- source_word: οὐκ ἐπαισχύνθη
  choice: సిగ్గుపడలేదు
  rationale: క్రియలోని సామాజిక, నైతిక భావాన్ని నేరుగా మరియు సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పౌలు ఆశీర్వాదంలో ‘ప్రభువు’ ఎవరిని సూచిస్తాడు?
  choice: ‘ప్రభువు’ అని మాత్రమే అనువదించడం
  alternative: తండ్రియైన దేవుడు అని లేదా ప్రభువైన యేసు అని నిర్దిష్టీకరించడం
  rationale: గ్రీకు పాఠంలో ὁ κύριος మాత్రమే ఉంది. సందర్భం స్పష్టంగా గుర్తించనందున అనువాదం ఆ సందిగ్ధతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనాత్మక శైలి. ‘ఇంటివారు’ కుటుంబ/గృహసమూహ భావాన్ని, ‘సంకె’ మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతాయి.
