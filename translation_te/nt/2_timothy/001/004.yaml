  yaml_path: translation/nt/2_timothy/001/004.yaml
  text: longing to see you[a], remembering your tears, so that I may be filled with joy,
translation:
  language: te
  text: నీ కన్నీళ్లను జ్ఞాపకం చేసుకుంటూ, నిన్ను చూడాలని ఎంతో ఆత్రుతగా ఉన్నాను, తద్వారా నేను ఆనందంతో నిండిపోవునట్లు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: ఎంతో ఆత్రంగా ఉన్నాను
  rationale: వర్తమాన కృదంతం వ్యక్తం చేసే బలమైన వ్యక్తిగత ఆకాంక్షను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: σε ἰδεῖν
  choice: నిన్ను చూడాలని
  rationale: ఆకాంక్షకు విషయమైన తిమోతిని చూడడాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μεμνημένος
  choice: జ్ఞాపకం చేసుకుంటూ
  rationale: పరిపూర్ణ కృదంతంలోని కొనసాగుతున్న జ్ఞాపకస్థితిని తెలుగు వాక్యప్రవాహంలో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: σου τῶν δακρύων
  choice: నీ కన్నీళ్లను
  rationale: తిమోతి కన్నీళ్లనే సూచించే షష్ఠీ నిర్మాణాన్ని వ్యాఖ్యానం జోడించకుండా నేరుగా అనువదిస్తుంది.
- source_word: ἵνα
  choice: '...పోవాలని'
  rationale: గ్రీకు ఉద్దేశ్య/ఫలిత సంబంధాన్ని తెలుగు ఆశార్థక ఉపవాక్య నిర్మాణంతో తెలియజేస్తుంది.
- source_word: χαρᾶς
  choice: ఆనందంతో
  rationale: πληρόωతో ఉన్న షష్ఠిని తెలుగులో సహజమైన ‘ఆనందంతో నిండిపోవడం’గా అందిస్తుంది.
- source_word: πληρωθῶ
  choice: నేను ... నిండిపోవాలని
  rationale: అనిశ్చితార్థక కర్మణి రూపంలోని భావాన్ని సహజ తెలుగులో నిలుపుతుంది; సందర్భంలో ప్రధాన క్రియతో అనుసంధానించేందుకు ‘కోరుకుంటున్నాను’ను పూరకంగా వాడింది.
