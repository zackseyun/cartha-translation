translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆత్మీయతతో కూడిన గౌరవప్రదమైన శైలి. ఇది గ్రీకులోని విస్తృత వాక్యంలో భాగమైనప్పటికీ, ఇచ్చిన భాగాన్ని తెలుగులో చదవదగిన వాక్యంగా అందించడానికి చివర ‘కోరుకుంటున్నాను’ను పూరకంగా చేర్చాం.
