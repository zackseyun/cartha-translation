revisions:
- from: 'ఇది నీకు తెలుసు: ఆసియలో ఉన్నవారందరూ నన్ను విడిచి వెళ్లిపోయారు[b][a]. వారిలో ఫుగెల్లు, హెర్మొగెనే ఉన్నారు.'
  to: 'ఇది నీకు తెలుసు: ఆసియ[a]లో ఉన్నవారందరూ నా నుండి వెనుదిరిగారు[b]. వారిలో ఫుగెలు, హెర్మొగెనే ఉన్నారు.'
  rationale: The revision follows the Greek relational image of turning away, corrects the spelling of Phygelus, and moves each footnote marker to the word or phrase it annotates. It preserves the source’s broad ‘all’ without defining its contextual scope in the main text.
