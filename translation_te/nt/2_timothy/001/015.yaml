id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: te
  text: 'ఇది నీకు తెలుసు: ఆసియ[a]లో ఉన్నవారందరూ నా నుండి వెనుదిరిగారు[b]. వారిలో ఫుగెలు, హెర్మొగెనే ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఆసియ” అనేది నేటి ఆసియా ఖండాన్ని కాదు; ఆసియా మైనరు పశ్చిమ భాగంలోని రోమా ప్రావిన్సును సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా “నన్ను విడిచిపెట్టారు” లేదా “నన్ను పరిత్యజించారు.” గ్రీకు పదబంధం అక్షరార్థంగా వారు “నా నుండి వెనుదిరిగారు” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας
  choice: నీకు తెలుసు
  rationale: వర్తమాన స్థితిని సూచించే οἶδα భావాన్ని ఆధునిక తెలుగులో సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: τοῦτο ὅτι
  choice: 'ఇది నీకు తెలుసు:'
  rationale: τοῦτο తరువాతి విషయవాక్యాన్ని సూచిస్తుంది; ὅτι సంబంధాన్ని తెలుగులో ద్విబిందువు సహజంగా తెలియజేస్తుంది.
- source_word: ἀπεστράφησάν με
  choice: నన్ను విడిచి వెళ్లిపోయారు
  rationale: మద్దతు లేదా విధేయత నుంచి వెనుదిరిగిన సంబంధార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; మూలంలోని 'వెనుదిరుగు' రూపకానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: ఆసియలో ఉన్నవారందరూ
  rationale: πάντες అనే సమగ్ర బలాన్ని నిలుపుతూ, సందర్భం నిర్దేశించే సంబంధిత సమూహపు పరిధిని అనవసరంగా విస్తరించదు లేదా కుదించదు.
- source_word: Ἀσίᾳ
  choice: ఆసియ
  rationale: కొత్త నిబంధనలో ఇది సాధారణంగా రోమా పాలిత ప్రావిన్సును సూచిస్తుంది; ప్రధాన పాఠంలో సంప్రదాయ స్థలనామాన్ని ఉంచి వివరణను పాదసూచికలో ఇచ్చింది.
- source_word: ὧν ἐστιν
  choice: వారిలో ... ఉన్నారు
  rationale: పెద్ద సమూహంలోనుంచి పేరుపెట్టి ఉదాహరణలను చూపించే భాగసూచక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Φύγελος
  choice: ఫుగెల్లు
  rationale: గ్రీకు పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: Ἑρμογένης
  choice: హెర్మొగెనే
  rationale: గ్రీకు పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: “ఆసియలో ఉన్నవారందరూ” అనే మాట పరిధి
  choice: ఆసియ ప్రావిన్సుతో సంబంధమున్న పౌలు సహచరులు లేదా మద్దతుదారుల సందర్భబద్ధ సమగ్ర సమూహాన్ని సూచించేలా పాఠాన్ని యథాతథంగా ఉంచడం
  alternative: ఆ ప్రాంతంలోని ప్రతి క్రైస్తవుడు మినహాయింపులేకుండా పౌలును విడిచాడని స్పష్టీకరించడం; లేదా దీనిని కేవలం అతిశయోక్తిగా మృదువుచేయడం
  rationale: πάντες సందర్భపరంగా పరిమితమైన సమూహం మొత్తాన్ని సూచించగలదు. మూలపాఠం పరిధిని స్వయంగా ఖచ్చితీకరించనందున అనువాదం 'అందరూ' అనే బలాన్ని నిలుపుతుంది; అదనపు వ్యాఖ్యతో దాన్ని కఠినతరం చేయదు లేదా తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడింది. మూలంలోని సమగ్రతను, సంబంధవిచ్ఛేద భావాన్ని నిలుపుతూ, చారిత్రక స్థలనామ వివరణను పాదసూచికకు పరిమితం చేసింది. ప్రధాన పాఠంలోని పాదసూచిక గుర్తులను ఆంగ్ల సంప్రదింపు పాఠంలోని క్రమం ప్రకారం [b][a]గా ఉంచింది.
