id: 2TI.1.6
reference: 2 Timothy 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: te
  text: ఈ కారణంగానే, నేను నా చేతులను నీ మీద ఉంచడం ద్వారా నీలో ఉన్న దేవుని వరాన్ని మళ్లీ రగిలించమని[a] నీకు గుర్తుచేస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మళ్లీ మంటగా ఎగసేలా చేయమని.’ గ్రీకు క్రియ, నిప్పును కదిలించి తిరిగి పూర్తిగా రగిలించే దృశ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: ఈ కారణంగానే
  rationale: ముందున్న విషయంతో కారణసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా కలుపుతుంది; గ్రీకు పదబంధంలోని అనుసంధాన బలాన్ని నిలుపుతుంది.
- source_word: ἀναμιμνῄσκω
  choice: నీకు గుర్తుచేస్తున్నాను
  rationale: వర్తమానకాల క్రియను, దాని కర్మతో సహా, సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: σε ἀναζωπυρεῖν
  choice: మళ్లీ రగిలించమని
  rationale: చల్లారుతున్న నిప్పును తిరిగి రగిలించే గ్రీకు రూపకాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: దేవుని వరాన్ని
  rationale: χάρισμα అనుగ్రహంగా ఇవ్వబడిన వరాన్ని సూచిస్తుంది. సందర్భం చెప్పేదానికంటే ఎక్కువగా ‘ఆత్మీయ వరం’ అని నిర్దిష్టం చేయకుండా మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: నీలో ఉన్న
  rationale: ఆ వరం తిమోతిలో ప్రస్తుతం ఉందని తెలిపే సంబంధవాక్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: నేను నా చేతులను నీ మీద ఉంచడం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనార్థాన్ని ‘ద్వారా’తో నిలుపుతూ, చేతులు ఉంచే క్రియను సాధారణ పాఠకులకు స్పష్టంగా చెబుతుంది.
theological_decisions:
- issue: పౌలు చేతులు ఉంచిన క్రియ ద్వారా వరం తిమోతిలో ఉండడం
  choice: నేను నా చేతులను నీ మీద ఉంచడం ద్వారా నీలో ఉన్న దేవుని వరం
  alternative: నేను నా చేతులను నీ మీద ఉంచినప్పుడు నీలో ఉన్న దేవుని వరం
  rationale: ‘ద్వారా’ అనే పదం మూలంలోని సాధనార్థక సంబంధాన్ని నిలుపుతుంది. అదే సమయంలో, ఈ ఒక్క వచనం చెప్పేదానికంటే విస్తృతమైన సంస్కార సంబంధ సిద్ధాంతాన్ని అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతతో రూపొందించబడింది. అగ్ని రూపకాన్ని ప్రధాన పాఠంలోనే నిలిపి, దాని మరొక సహజ వ్యక్తీకరణను పాదసూచికలో ఇచ్చాం.
