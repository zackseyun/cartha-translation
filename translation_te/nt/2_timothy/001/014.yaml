    reason: lexical_alternative
lexical_decisions:
- source_word: παραθήκην
  choice: నీకు అప్పగించబడిన ... దానిని
  rationale: παραθήκη కాపాడటానికి అప్పగించబడినదాన్ని సూచిస్తుంది. తెలుగులో ‘అప్పగించబడినది’ అనే రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; అది ఏదో ప్రధాన వచనంలో నిర్ధారించదు.
- source_word: καλὴν
  choice: మంచి
  rationale: καλός ఇక్కడ అప్పగించబడిన దాని అంతర్గత మంచితనాన్ని సూచిస్తుంది. ‘మంచి’ అనేది సహజమైన, అతివ్యాఖ్యానం చేయని సమానార్థకం.
- source_word: φύλαξον
  choice: కాపాడు
  rationale: ఈ ఆజ్ఞారూపం అప్పగించబడినదాన్ని జాగ్రత్తగా భద్రపరచాలని చెబుతుంది. ‘కాపాడు’ క్రియాశీల రక్షణ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: διὰ πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మ ద్వారా
  rationale: షష్ఠీ విభక్తితో వచ్చిన διά సాధనం లేదా కార్యసాధకత్వాన్ని సూచిస్తుంది. ‘ద్వారా’ ఈ అర్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: మనలో నివసించే
  rationale: ἐνοικοῦντος ప్రస్తుతం కొనసాగుతున్న నివాసాన్ని సూచిస్తుంది. ‘మనలో నివసించే’ అనేది సూటిగా, గౌరవప్రదంగా ఉండి సాంకేతిక పదజాలాన్ని నివారిస్తుంది.
- source_word: ἐν ἡμῖν
  choice: మనలో
  rationale: ἐν ἡμῖν యొక్క ప్రత్యక్ష అర్థం ‘మనలో.’ ఇది పౌలు-తిమోతి మాత్రమేనా లేక విశ్వాసులందరినీ కలుపుతుందా అన్న పరిధిని అనువాదం నిర్దేశించదు.
theological_decisions:
- issue: ‘మంచి అప్పగింత’ దేనిని సూచిస్తుంది?
  choice: ‘నీకు అప్పగించబడిన ఆ మంచి దానిని’ అని సాధారణంగానే ఉంచబడింది.
  alternative: తిమోతికి అప్పగించబడిన సువార్త సందేశం; అతని పరిచర్య బాధ్యత
  rationale: సందర్భం అపొస్తల సువార్తను సూచించినప్పటికీ, గ్రీకు పదబంధం సంక్షిప్తమైన రూపకంగా ఉంది. ప్రధాన వచనం దాని నిర్దిష్ట సూచనను వ్యాఖ్యానాత్మకంగా నిర్ణయించదు.
- issue: ‘మనలో’ అనే సర్వనామం పరిధి
  choice: పరిధిని కుదించకుండా ‘మనలో’ అని అనువదించబడింది.
  alternative: విశ్వాసులందరిలో; ప్రత్యేకంగా పౌలు మరియు తిమోతిలో
  rationale: ἡμῖν తక్షణ సందర్భంలో పౌలు, తిమోతిని కలుపుతూ విస్తృత విశ్వాస సమాజానికీ వర్తించవచ్చు. అసలు వచనంలోని అనిశ్చిత పరిధి నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘డిపాజిట్’ వంటి అన్యభాషా లేదా సాంకేతిక పదానికి బదులుగా అర్థస్పష్టమైన ‘అప్పగించబడిన ... దానిని’ వాడబడింది. మూలంలోని ఆజ్ఞ, రూపకం, ‘మనలో’ అనే పరిధి యథాశక్తి నిలుపబడ్డాయి.
