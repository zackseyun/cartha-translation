translation:
  language: te
  text: మనలో నివసించే పరిశుద్ధాత్మ ద్వారా ఆ మంచి అప్పగింతను కాపాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ శ్రేష్ఠమైన అప్పగింతను’ లేదా ‘అప్పగించబడిన దానిని.’
    reason: lexical_alternative
  - marker: b
