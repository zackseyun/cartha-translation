id: 2TI.1.11
reference: 2 Timothy 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ ⸀διδάσκαλος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: te
  text: ఆ సువార్త కోసం నేను ఒక ప్రకటనకర్తగా, అపొస్తలుడిగా, బోధకుడిగా నియమించబడ్డాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రసంగకుడు.’ గ్రీకు పదం అధికారపూర్వకంగా బహిరంగ ప్రకటన చేసే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: ఆ సువార్త కోసమే
  rationale: ఈ సంబంధపదబంధం ముందటి సందర్భంలోని సువార్తను వెనక్కి సూచిస్తూ ఉద్దేశం లేదా సంబంధాన్ని తెలియజేస్తుంది. తెలుగులో సూచ్యాన్ని స్పష్టంగా పునరుక్తి చేయడం సహజంగా ఉంటుంది; ‘కోసమే’ అనే రూపం గ్రీకులోని భావసంబంధాన్నీ, వాక్యంలోని స్వల్ప ఉద్ఘాటననూ అందిస్తుంది.
- source_word: ἐτέθην
  choice: నియమించబడ్డాను
  rationale: τίθημι యొక్క కర్మణి రూపం ఇక్కడ తరువాత వచ్చే సేవాపాత్రలలో నియామకాన్ని సూచిస్తుంది; కేవలం ఒక చోట ఉంచబడటాన్ని కాదు.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో వ్యక్తమైన సర్వనామానికి స్వల్ప ఉద్ఘాటన ఉంది. తెలుగులో ‘నేను’ను స్పష్టంగా ఉంచడం దానిని సహజంగా ప్రతిబింబిస్తుంది; ‘నేనే’ అనడం అవసరానికి మించిన ఉద్ఘాటన అవుతుంది.
- source_word: κῆρυξ
  choice: ప్రకటనకర్త
  rationale: ఈ పదం అధికారపూర్వకంగా బహిరంగ ప్రకటన చేసే వ్యక్తిని సూచిస్తుంది. ‘ప్రకటనకర్త’ ఆ నియమిత ప్రకటన భావాన్ని ఆధునిక తెలుగులో అందిస్తుంది; ‘ప్రసంగికుడు’ అనే పదం తరువాతి సంఘపరమైన అర్థాన్ని ఎక్కువగా సూచించవచ్చు.
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: పౌలు తనను గురించి వాడిన సందర్భంలో ఇది గుర్తింపుపొందిన అపొస్తల సేవాపాత్రను సూచిస్తుంది. స్థిరపడిన తెలుగు బైబిలు పదం భావాన్ని సముచితంగా కాపాడుతుంది.
- source_word: διδάσκαλος
  choice: బోధకుడు
  rationale: సాధారణ అర్థం బోధించే వ్యక్తి. ‘బోధకుడు’ సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: κῆρυξ అనే పదాన్ని సంప్రదాయ సంఘపరమైన ‘ప్రసంగికుడు’గా అనువదించాలా, లేక అధికారిక ప్రకటన భావాన్ని ముందుకు తేవాలా
  choice: ప్రకటనకర్త
  alternative: ప్రసంగికుడు
  rationale: ఈ వాక్యం పౌలుకు అప్పగించబడిన పాత్రలను పేర్కొంటుంది. ‘ప్రకటనకర్త’ గ్రీకు పదంలోని నియమిత, బహిరంగ ప్రకటన భావాన్ని కాపాడి, దానిని తరువాతి కాలపు ప్రత్యేక సంఘపదవికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే సేవాపాత్రల గౌరవభావం నిలిచేలా రూపొందించబడింది. మూలంలోని మూడు పాత్రలను సమాంతర నిర్మాణంలో ఉంచింది.
