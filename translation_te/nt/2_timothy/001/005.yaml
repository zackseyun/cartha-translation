id: 2TI.1.5
reference: 2 Timothy 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: te
  text: నీలో ఉన్న కపటంలేని విశ్వాసాన్ని జ్ఞాపకం చేసుకొని, అది మొదట నీ అమ్మమ్మ లోయిలోను, నీ తల్లి యూనీకేలోను నివసించిందనీ, అది నీలో కూడా ఉందనీ నేను నిశ్చయంగా నమ్ముతున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: నాకు జ్ఞాపకం వచ్చింది
  rationale: ఈ సందర్భంలో ‘జ్ఞాపకం పొందుతూ’ అనే అక్షరానువాదం కంటే, గుర్తుచేయబడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀνυποκρίτου πίστεως
  choice: కపటంలేని విశ్వాసం
  rationale: ἀνυπόκριτος యొక్క వేషధారణ లేదా కపటం లేని నిజత్వాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἐνῴκησεν
  choice: నివసించింది
  rationale: ‘లో నివసించడం’ అనే మూలపాఠంలోని సజీవ రూపకాన్ని నిలుపుతుంది; కేవలం ‘ఉండింది’ అని బలహీనపరచదు.
- source_word: μάμμῃ
  choice: అమ్మమ్మ
  rationale: μάμμη అంటే grandmother; తెలుగులో లింగసంబంధిత బంధుపదం అవసరం. తల్లి యూనీకేకు తల్లిగా లోయి పేర్కొనబడిన కుటుంబ సందర్భానికి ‘అమ్మమ్మ’ సరిపోతుంది.
- source_word: πέπεισμαι
  choice: నాకు నమ్మకం ఉంది
  rationale: పూర్తిగా ఒప్పించబడిన స్థిరమైన నిశ్చయాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: విశ్వాసం వ్యక్తులలో ‘నివసించడం’
  choice: మూలంలోని నివాస రూపకాన్ని ‘నివసించింది’గా నిలుపడం
  alternative: ‘ఉండింది’ లేదా ‘కనిపించింది’
  rationale: విశ్వాసం లోయి, యూనీకే, తిమోతిలో అంతర్గతంగా నెలకొన్నదనే పాఠ్య రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా ఉంచుతుంది.
- issue: తిమోతిలో విశ్వాసం ఉందనే పౌలు నిశ్చయం
  choice: ‘అది నీలో కూడా ఉందని నాకు నమ్మకం ఉంది’
  alternative: ‘అది నీలో కూడా నివసిస్తుందని నాకు నిశ్చయం’
  rationale: గ్రీకు వాక్యంలో చివర ‘నివసించింది’ క్రియ స్పష్టంగా పునరుక్తం కాలేదు; కాబట్టి తెలుగులో దానిని తప్పనిసరిగా చేర్చకుండా, సూచిత భావాన్ని సహజంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన లేఖా శైలిని మరియు మూలపాఠంలోని విశ్వాసం ‘నివసించడం’ అనే రూపకాన్ని నిలిపింది.
