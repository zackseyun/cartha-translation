    issue: The rendering ‘నా పూర్వీకులు చేసినట్లే’ is overly specific for ἀπὸ προγόνων.
    rationale: The Greek phrase literally says ‘from [my] ancestors’ and can express inherited/ancestral continuity, but it does not explicitly state ‘as my ancestors did.’ Rendering it as ‘నా పూర్వీకుల నుండి’ preserves the wording and leaves the exact nuance appropriately open; the footnote can explain the plausible continuity sense.
