id: 2TI.1.3
reference: 2 Timothy 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: te
  text: నా పూర్వీకుల నుండి[b] నిర్మలమైన మనస్సాక్షితో నేను సేవించే[a] దేవునికి కృతజ్ఞతలు చెల్లిస్తున్నాను; రాత్రింబగళ్లు నా ప్రార్థనల్లో నిన్ను ఎడతెగకుండా జ్ఞాపకం చేసుకుంటున్నాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆరాధించే.’ గ్రీకు క్రియ దేవునికి అర్పించే మతపరమైన సేవను లేదా ఆరాధనను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా పూర్వీకుల పరంపరలో.’ మరింత అక్షరార్థంగా, ‘నా పూర్వీకుల నుండి.’ ఈ పదబంధం పూర్వీకుల విశ్వాసం, దేవసేవతో కొనసాగింపును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: మరింత అక్షరార్థంగా, ‘నా ప్రార్థనల్లో నీ గురించిన జ్ఞాపకాన్ని ఎడతెగకుండా కలిగియున్నాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: దేవునికి కృతజ్ఞతలు చెల్లిస్తున్నాను
  rationale: χάριν ἔχω అనే గ్రీకు నుడికారం కృతజ్ఞత తెలియజేయడాన్ని సూచిస్తుంది. తెలుగులో ఈ రూపం సహజంగా ఉండి, దేవుడు కృతజ్ఞతకు గ్రహీత అని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ᾧ λατρεύω
  choice: నేను సేవించే
  rationale: λατρεύω దేవునికి అర్పించే ఆరాధనతో కూడిన సేవను సూచించగలదు. ‘సేవించే’ అనే పదం దాని విస్తృత భావాన్ని నిలుపుతుంది; ‘ఆరాధించే’ అనేది సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ἀπὸ προγόνων
  choice: నా పూర్వీకులు చేసినట్లే
  rationale: అక్షరార్థంగా ‘పూర్వీకులనుంచి’ అనే ఈ పదబంధం పూర్వీకుల దేవసేవతో కొనసాగింపును సూచిస్తుంది. సహజమైన తెలుగులో ఆ కొనసాగింపును ఈ రూపం తెలియజేస్తుంది.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: నిర్మలమైన మనస్సాక్షితో
  rationale: ఈ పదబంధం పౌలు దేవుణ్ణి సేవించే తీరును వివరిస్తుంది. ‘నిర్మలమైన మనస్సాక్షి’ నైతిక స్వచ్ఛత భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὡς
  choice: —చేసుకుంటూ
  rationale: ὡς కృతజ్ఞతకు తోడుగా ఉన్న పరిస్థితిని పరిచయం చేస్తుంది. తెలుగు అసమాపక క్రియారూపం కారణార్థాన్ని బలవంతంగా చేర్చకుండా ఆ అనుబంధాన్ని సహజంగా చూపుతుంది.
- source_word: ἀδιάλειπτον
  choice: ఎడతెగకుండా
  rationale: ప్రార్థనలో తిమోతిని నిరంతరం జ్ఞాపకం చేసుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν περὶ σοῦ μνείαν
  choice: నిన్ను జ్ఞాపకం చేసుకుంటూ
  rationale: అక్షరార్థంగా ‘నీ గురించి జ్ఞాపకం కలిగి ఉండడం’ అనే నామవాచక ప్రయోగాన్ని తెలుగులో సహజమైన క్రియారూపంగా అందిస్తుంది.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: నా ప్రార్థనల్లో
  rationale: δέησις ప్రత్యేకంగా విన్నప ప్రార్థనను సూచించగలిగినా, ఈ సందర్భంలో ‘ప్రార్థనలు’ సహజంగా, సమగ్రంగా ఉంది.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: రాత్రింబగళ్లు
  rationale: నియమితమైన, నిరంతర ప్రార్థనను సూచించే గ్రీకు నుడికారానికి ఇది సహజమైన తెలుగు సమానార్థక ప్రయోగం.
theological_decisions:
- issue: ἀπὸ προγόνωνలో పౌలు తన పూర్వీకుల విశ్వాసంతో కలిగిన సంబంధం
  choice: దేవునికి పౌలు చేసే సేవను తన పూర్వీకుల సేవతో కొనసాగింపుగా చూపించడం
  alternative: ‘నా పూర్వీకులనుంచి’ లేదా ‘నా పూర్వీకుల పరంపరలో’
  rationale: మూల పదబంధం పూర్వీకుల విశ్వాసాన్ని పౌలు తిరస్కరించాడని చెప్పదు; వారితో కొనసాగింపును సూచిస్తుంది. ‘చేసినట్లే’ ఆ భావాన్ని అదనపు సిద్ధాంత వ్యాఖ్యానం లేకుండా తెలుపుతుంది.
- issue: λατρεύω అర్థం
  choice: సేవించే
  alternative: ఆరాధించే
  rationale: ఈ క్రియ దేవునికి చేసే ఆరాధనాత్మక సేవను సూచిస్తుంది. ‘సేవించే’ విస్తృత భావాన్ని నిలుపుతుంది; పాదసూచికలో ‘ఆరాధించే’ అనే నిజమైన ప్రత్యామ్నాయాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘నిర్మలమైన మనస్సాక్షి,’ ‘కృతజ్ఞతలు చెల్లిస్తున్నాను’ వంటి రూపాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి పత్రికా శైలికి తగిన గంభీరతను నిలుపుతాయి. పాదసూచిక గుర్తులు అన్నీ ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
