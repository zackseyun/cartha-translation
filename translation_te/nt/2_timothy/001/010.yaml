id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: te
  text: అయితే ఇప్పుడు మన రక్షకుడైన యేసు మెస్సీయ[a] ప్రత్యక్షత ద్వారా అది వెల్లడైంది. ఆయనే మరణాన్ని నిర్వీర్యం చేసి, సువార్త ద్వారా జీవాన్ని, అక్షయతను[b] వెలుగులోకి తెచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు క్రీస్తు.’ గ్రీకు Χριστός అనే పదం ‘మెస్సీయ’ అనే బిరుదుగానూ, ‘క్రీస్తు’ అనే పేరువంటి పిలుపుగానూ వాడబడవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘అమరత్వాన్ని.’ గ్రీకు పదం క్షయానికి లేదా నాశనానికి లోబడని స్థితిని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: అది వెల్లడైంది
  rationale: ఈ స్త్రీలింగ కర్మణి అసమాపక క్రియ మునుపటి వచనంలోని దేవుని కృపను సూచిస్తుంది. తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం ‘అది’ అనే సర్వనామంతో సమాపక క్రియగా ఇచ్చి, కర్మణి భావాన్ని నిలిపాం.
- source_word: ἐπιφανείας
  choice: ప్రత్యక్షత
  rationale: యేసు చారిత్రకంగా కనిపించి రావడాన్ని సూచించే గంభీరమైన, ప్రస్తుత ప్రామాణిక తెలుగు పదం.
- source_word: σωτῆρος
  choice: రక్షకుడు
  rationale: రక్షణను కలిగించేవాడు అనే భావాన్నీ, క్రీస్తుకు వర్తించే బిరుదు స్వభావాన్నీ నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ ‘మన రక్షకుడు’ అనే బిరుదు తరువాత వచ్చి మెస్సీయ బిరుదు భావాన్ని సజీవంగా ఉంచుతుంది; ‘క్రీస్తు’ అనే సాధారణ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: καταργήσαντος
  choice: నిర్వీర్యం చేసి
  rationale: మరణాన్ని పూర్తిగా ఉనికిలో లేకుండా చేశాడని కాక, దాని శక్తిని నిర్ణయాత్మకంగా భగ్నం చేశాడనే బలమైన భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: θάνατον
  choice: మరణాన్ని
  rationale: మూలపదానికి నేరమైన, సహజమైన అనువాదం.
- source_word: φωτίσαντος
  choice: వెలుగులోకి తెచ్చాడు
  rationale: తెలియజేయడం లేదా ప్రత్యక్షపరచడం అనే రూపకాలంకార భావాన్ని సహజమైన తెలుగు నుడికారంతో అందిస్తుంది.
- source_word: ζωὴν
  choice: జీవాన్ని
  rationale: మూలంలోని రక్షణ సంబంధమైన, అంత్యకాలికమైన విస్తృతిని వ్యాఖ్యానాత్మకంగా పెంచకుండా నిలుపుతుంది.
- source_word: ἀφθαρσίαν
  choice: అక్షయతను
  rationale: క్షయానికి, నాశనానికి లోబడని స్థితిని సంక్షిప్తంగా తెలియజేస్తుంది; ‘అమరత్వం’ అనే సుపరిచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: సువార్త ద్వారా
  rationale: διά యొక్క సాధనార్థక భావాన్ని ‘ద్వారా’ నిలుపుతుంది; εὐαγγέλιονకు ‘సువార్త’ ప్రామాణికమైన, అందరికీ అర్థమయ్యే పదం.
- source_word: μὲν ... δὲ
  choice: ఆయనే … చేసి, … తెచ్చాడు
  rationale: రెండు కార్యాల పరస్పరపూరకతను తెలుగులో కృత్రిమమైన జంట అవ్యయాలు లేకుండా, ‘ఆయనే’ అనే ఉద్ఘాటనతో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦను ఎలా అనువదించాలి
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ‘మన రక్షకుడు’ అనే బిరుదు తరువాత ఉన్నందున Χριστός యొక్క అభిషిక్త రాజు/మెస్సీయ అనే బిరుదు భావం ఇక్కడ స్పష్టంగా ఉంది. అయితే పేరు వలె స్థిరపడిన ‘క్రీస్తు’ రూపాన్నీ పాదసూచికలో భద్రపరిచాం.
- issue: καταργήσαντος మరణానికి సంబంధించి ఎంత బలమైన ప్రకటన చేస్తుంది
  choice: మరణాన్ని నిర్వీర్యం చేసి
  alternative: మరణాన్ని నిర్మూలించి
  rationale: యేసు మరణంపై సాధించిన నిర్ణయాత్మక విజయాన్ని బలంగా ప్రకటిస్తూ, ప్రస్తుత కాలంలో మరణం అసలు ఉనికిలోనే లేదని అనువాదం ద్వారా తేల్చివేయదు.
- issue: ἀφθαρσίαν యొక్క భావం
  choice: అక్షయత
  alternative: అమరత్వం
  rationale: మూలపదంలో ప్రధానంగా ఉన్న క్షయం లేదా నాశనానికి లోబడకపోవడం అనే భావాన్ని ‘అక్షయత’ దగ్గరగా నిలుపుతుంది. ‘అమరత్వం’ సాధ్యమైన, సుపరిచిత అర్థం కాబట్టి పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని అనుసరించాం. మునుపటి వచనంలోని ‘కృప’తో సంబంధాన్ని ‘అది’ ద్వారా నిలిపాం. మూలంలోని అసమాపక క్రియల పొడవైన నిర్మాణాన్ని తెలుగులో రెండు సహజమైన సమాపక వాక్యాలుగా మలిచాం; భావసంబంధం, ఉద్ఘాటన యథాతథంగా ఉన్నాయి.
