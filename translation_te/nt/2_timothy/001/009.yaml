id: 2TI.1.9
reference: 2 Timothy 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: te
  text: మనలను రక్షించి, పవిత్రమైన పిలుపుతో[a] మనలను పిలిచిన దేవుడు—మన క్రియలను బట్టి కాక, తన సొంత సంకల్పాన్నీ కృపనూ బట్టి అలా చేశాడు. ఆ కృప అనంత యుగాలకు ముందే మెస్సీయ యేసులో[b] మనకు అనుగ్రహించబడింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పవిత్రమైన పిలుపుకు’ లేదా ‘పవిత్రమైన పిలుపు ద్వారా.’ గ్రీకు దత్తివు విభక్తిని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘క్రీస్తు యేసులో.’ ఇక్కడ Χριστόςను బిరుదుగా గ్రహించి ‘మెస్సీయ’ అని అనువదించాం.
    reason: alternative_reading
  - marker: c
    text: లేదా ‘యుగయుగాల కాలాలకు ముందు’; భావానువాదంగా ‘కాలం మొదలుకాకముందే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: రక్షించి
  rationale: σῴζω యొక్క రక్షణార్థక భావాన్ని సహజమైన, స్థిరపడిన తెలుగు బైబిలు పదంతో వ్యక్తం చేస్తుంది.
- source_word: καλέσαντος
  choice: పిలిచిన
  rationale: దైవిక పిలుపు అనే పౌలు వాడుకలోని భావాన్ని నిలుపుతుంది; σώσαντοςతో ఉన్న సమాంతర సంబంధాన్ని కూడా కాపాడుతుంది.
- source_word: κλήσει ἁγίᾳ
  choice: పవిత్రమైన పిలుపుతో
  rationale: దత్తివు విభక్తిలోని సాధనార్థక లేదా సంబంధార్థక అవకాశాలను అతిగా నిర్ణయించకుండా, గ్రీకు పదబంధానికి దగ్గరగా ఉంటుంది.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: మన క్రియలను బట్టి కాక
  rationale: κατά ఇక్కడ ప్రమాణం లేదా ఆధారాన్ని సూచిస్తుంది. ‘క్రియలు’ అనే పౌలు రచనల్లో ముఖ్యమైన పదాన్ని నిలుపుతుంది.
- source_word: ἰδίαν πρόθεσιν
  choice: తన సొంత సంకల్పాన్ని
  rationale: πρόθεσιςలోని ఉద్దేశం/నిశ్చయార్థాన్ని వ్యక్తం చేస్తూ, ἰδίανలోని స్వకీయతను స్పష్టంగా ఉంచుతుంది.
- source_word: χάριν
  choice: కృపను
  rationale: χάριςకు తెలుగు క్రైస్తవ వాడుకలో స్థిరమైన పదం; పౌలు రచనల్లోని దాని ధార్మిక బరువును నిలుపుతుంది.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: మనకు అనుగ్రహించబడింది
  rationale: స్త్రీలింగ విశేషణక్రియ ‘కృప’ను సూచిస్తుందని స్పష్టం చేస్తుంది; దైవిక బహుమాన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστόςను ఇక్కడ అర్థవంతమైన బిరుదుగా తీసుకొని ‘మెస్సీయ’గా అనువదిస్తుంది; ἐν యొక్క ‘లో’ సంబంధాన్ని నిలుపుతుంది.
- source_word: πρὸ χρόνων αἰωνίων
  choice: అనాది కాలాలకు ముందే
  rationale: పదబంధంలోని కాలాతీత పూర్వత్వాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘కాలం మొదలుకాకముందే’ అనే పూర్తి వివరణను ప్రధాన పాఠ్యంలో బలవంతంగా విధించదు.
theological_decisions:
- issue: Χριστῷను బిరుదుగా అనువదించాలా, పేరులో భాగంలా లిప్యంతరీకరించాలా
  choice: మెస్సీయ యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: ఈ పౌలు పదబంధంలో Χριστόςకు బిరుదు భావం ఇంకా సజీవంగా ఉంది; అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: κλήσει ἁγίᾳ దత్తివు విభక్తి భావం
  choice: పవిత్రమైన పిలుపుతో
  alternative: పవిత్రమైన పిలుపుకు / పవిత్రమైన పిలుపు ద్వారా
  rationale: గ్రీకు నిర్మాణం సాధనం, విధం, లేదా పిలుపు స్వభావం అనే ఒకటి కంటే ఎక్కువ ఛాయలను అనుమతిస్తుంది. ప్రధాన పాఠ్యం వాటిలో ఒక్కదానిని మాత్రమే ఖరారు చేయదు.
- issue: πρὸ χρόνων αἰωνίων యొక్క కాలార్థం
  choice: అనాది కాలాలకు ముందే
  alternative: యుగయుగాల కాలాలకు ముందు / కాలం మొదలుకాకముందే
  rationale: గ్రీకులోని అసాధారణ కాలవ్యక్తీకరణను సహజ తెలుగులో అందిస్తూ, అది సృష్టికి ముందు లేదా కాలారంభానికి ముందు అని వివరణాత్మకంగా మరీ సంకుచితం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి. మూల వాక్యం మునుపటి వచనంపై ఆధారపడే సంబంధవాక్య భాగమైనందున, తెలుగులో స్పష్టత కోసం ‘దేవుడు’ను సందర్భానుసారంగా పునరుద్ధరించి, దీర్ఘ నిర్మాణాన్ని రెండు వాక్యాలుగా విభజించాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
