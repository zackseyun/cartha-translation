id: 2TI.1.7
reference: 2 Timothy 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: te
  text: ఎందుకంటే దేవుడు మనకు పిరికితనపు ఆత్మను[a] ఇవ్వలేదు; కానీ శక్తి, ప్రేమ, స్వీయనిగ్రహం[b] యొక్క ఆత్మను ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బిడియపు’ లేదా ‘భయపడే స్వభావపు’; గ్రీకు పదం సాధారణ భయం కంటే పిరికితనంతో కూడిన భయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘స్వస్థబుద్ధి’ లేదా ‘క్రమశిక్షణ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ఎందుకంటే ... ఇవ్వలేదు
  rationale: γάρ ముందున్న ప్రోత్సాహానికి ఈ వాక్యాన్ని కారణవివరణగా కలుపుతుంది; οὐ నిషేధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: దేవుడు మనకు ... ఇవ్వలేదు
  rationale: గ్రీకు ఏరిస్ట్ క్రియను సహజమైన తెలుగు భూతకాలంలో ఇచ్చాం; ἡμῖν ను ‘మనకు’గా వ్యక్తపరిచాం.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: ఈ పదం దేవుడు ఇచ్చే అంతర్గత స్వభావం లేదా ప్రేరేపక శక్తిని సూచించవచ్చు; పరిశుద్ధాత్మను నేరుగా పేరుపెట్టి మూలంలోని సందిగ్ధతను తొలగించలేదు.
- source_word: δειλίας
  choice: పిరికితనం
  rationale: ఈ పదం సాధారణ భయం కంటే వెనుకంజ వేయించే భీరుత్వం లేదా పిరికితనాన్ని బలంగా సూచిస్తుంది.
- source_word: δυνάμεως
  choice: శక్తి
  rationale: δύναμις లోని సామర్థ్యం, బలం అనే భావాలను ఈ సందర్భంలో ‘శక్తి’ నేరుగా, సహజంగా అందిస్తుంది.
- source_word: ἀγάπης
  choice: ప్రేమ
  rationale: ἀγάπη కి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, విస్తృతంగా అర్థమయ్యే సమానం ‘ప్రేమ’.
- source_word: σωφρονισμοῦ
  choice: స్వీయనిగ్రహం
  rationale: ఈ అరుదైన పదంలో స్వస్థమైన ఆలోచన, క్రమశిక్షణ, తనను తాను అదుపులో ఉంచుకోవడం అనే భావాలు ఉన్నాయి; ప్రధాన పాఠ్యంలో ‘స్వీయనిగ్రహం’ స్పష్టంగా, సహజంగా ఉంది.
theological_decisions:
- issue: πνεῦμα పదం ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: ‘ఆత్మ’ అని ఉంచి, దేవుడు ఇచ్చే స్వభావం/ప్రేరేపక శక్తి అనే పఠనానికి అనుకూలమైన నిర్మాణం
  alternative: ‘పరిశుద్ధాత్మ’ అని నిర్దిష్టంగా అనువదించడం
  rationale: πνεῦμα కు ఇక్కడ ఉపపదం లేకపోవడం, దానిని వివరించే గుణవాచక షష్ఠీ పదాలు వరుసగా రావడం వల్ల స్వభావం లేదా ప్రేరేపక శక్తి అనే భావం బలంగా కనిపిస్తుంది. అయినా ‘ఆత్మ’ అనే పదాన్ని నిలిపి ఉంచడం ద్వారా పరిశుద్ధాత్మ కార్యంతో ఉన్న సాధ్యమైన సంబంధాన్ని అనవసరంగా నిరాకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకులో రెండో భాగంలో క్రియ, ‘ఆత్మ’ రెండూ అధ్యాహారంగా ఉన్నందున తెలుగులో అర్థస్పష్టత కోసం ‘గల ఆత్మను ఇచ్చాడు’ అని పూరించాం. జాబితాలోని మూడు గుణాల సమాంతరత్వాన్ని నిలిపాం.
