id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: te
  text: ఈ కారణం వల్ల నేనూ ఈ బాధలను అనుభవిస్తున్నాను. అయినా నేను సిగ్గుపడను. ఎందుకంటే నేను ఎవరిని నమ్ముకున్నానో[a] నాకు తెలుసు; నా నిక్షేపాన్ని[b] ఆ రోజు[c] వరకు కాపాడగలడని నేను దృఢంగా నమ్ముతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను ఎవరిని విశ్వసించానో’; ‘నేను ఎవరిపై నమ్మకం ఉంచానో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నిక్షేపం’ అంటే భద్రంగా కాపాడటానికి మరొకరి సంరక్షణకు అప్పగించినది. ఇది పౌలు దేవునికి అప్పగించినదాన్ని సూచించవచ్చు; లేదా పౌలుకు అప్పగించబడినదాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: అంటే, దేవుడు తుదిగా తీర్పు తీర్చి న్యాయం స్థాపించే భవిష్యత్తు దినం.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: ఈ కారణంగానే
  rationale: ముందటి సందర్భంతో ఉన్న కారణ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది; καί యొక్క బలాన్ని ‘గానే’ సూచిస్తుంది.
- source_word: ταῦτα πάσχω
  choice: నేను ఈ బాధలు కూడా అనుభవిస్తున్నాను
  rationale: πάσχω యొక్క ప్రస్తుతకాల బాధానుభవాన్ని, ταῦτα అనే సూచనను నిర్దిష్టంగా విప్పకుండా కాపాడుతుంది.
- source_word: οὐκ ἐπαισχύνομαι
  choice: నేను సిగ్గుపడను
  rationale: సందర్భంలో పౌలు తన బాధల విషయంలో సిగ్గుపడకపోవడాన్ని తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: రూపరీత్యా పరిపూర్ణకాలమైనప్పటికీ వర్తమాన స్థితిని తెలిపే οἶδα భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ᾧ πεπίστευκα
  choice: నేను ఎవరిని నమ్ముకున్నానో
  rationale: వ్యక్తిగత ఆశ్రయాన్ని, స్థిరమైన విశ్వాసాన్ని సూచిస్తుంది; గ్రీకు వాక్యంలో వ్యక్తి పేరు చెప్పకపోవడాన్ని అలాగే ఉంచుతుంది.
- source_word: πέπεισμαι
  choice: నేను దృఢంగా నమ్ముతున్నాను
  rationale: ఇది కేవలం అభిప్రాయం కాక స్థిరమైన నిశ్చయమని సూచించే పరిపూర్ణకాల భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: δυνατός ἐστιν
  choice: కాపాడగల శక్తి ఆయనకు ఉంది
  rationale: సామర్థ్యాన్ని తెలిపే గ్రీకు పదబంధాన్ని తెలుగులో గంభీరంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν παραθήκην μου
  choice: నా నిక్షేపాన్ని
  rationale: భద్రపరచడానికి ఒకరి సంరక్షణకు అప్పగించిన వస్తువు అనే రూపకాన్ని నిలుపుతూ, అది పౌలు దేవునికి అప్పగించినదా లేక పౌలుకు అప్పగించబడినదా అనే సందిగ్ధతను పరిష్కరించదు.
- source_word: φυλάξαι
  choice: కాపాడ
  rationale: నిక్షేపాన్ని భద్రంగా ఉంచే రూపకానికి తగిన ‘కాపాడు’ అనే సాధారణ పదాన్ని వాడుతుంది.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: ఆ రోజు వరకు
  rationale: భవిష్యత్తులోని నిర్ణాయక దినం వైపు చూపే కాలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ᾧ అనే సర్వనామం సూచించే వ్యక్తి మరియు δυνατός ἐστιν లోని అంతర్లీన కర్త
  choice: ప్రధాన పాఠ్యంలో పేరును చెప్పకుండా ‘ఎవరిని’ మరియు ‘ఆయనకు’ అని ఉంచడం
  alternative: ‘దేవుడు’ లేదా ‘క్రీస్తు యేసు’ అని స్పష్టంగా పేర్కొనడం
  rationale: ఈ ఉపవాక్యంలో గ్రీకు పాఠ్యం ఆ వ్యక్తికి పేరు పెట్టదు. సందర్భం దేవుని లేదా క్రీస్తును బలంగా సూచించినా, మూలపాఠ్యం ఇచ్చిన నిర్దిష్టత స్థాయినే అనువాదం కాపాడుతుంది.
- issue: παραθήκη μου యొక్క భావం
  choice: ‘నా నిక్షేపం’ అనే రూపకంతో సందిగ్ధతను నిలుపడం
  alternative: పౌలు దేవునికి అప్పగించిన తన జీవితం లేదా రక్షణ; లేదా దేవుడు పౌలుకు అప్పగించిన సువార్త లేదా పరిచర్య
  rationale: μου అనే సంబంధరూపం అప్పగింత ఏ దిశలో జరిగిందో స్వయంగా నిర్ధారించదు. అందువల్ల ప్రధాన పాఠ్యం ఏ ఒక్క వేదాంత వ్యాఖ్యానాన్నీ ఖరారు చేయకుండా, వివరణను పాదటిప్పణిలో ఇస్తుంది.
- issue: ‘ఆ రోజు’ యొక్క సూచన
  choice: ప్రధాన పాఠ్యంలో ‘ఆ రోజు’ అనే మూలపాఠ్య సూచనను అలాగే ఉంచడం
  alternative: ‘దేవుని తుదితీర్పు దినం’ అని ప్రధాన పాఠ్యంలో విప్పి చెప్పడం
  rationale: ఇది అంత్యకాల తీర్పు మరియు న్యాయస్థాపన దినాన్ని సూచిస్తుందని సందర్భం తెలియజేసినా, గ్రీకు పాఠ్యంలోని సంక్షిప్త సూచనను ప్రధాన పాఠ్యంలో కాపాడి వివరణను పాదటిప్పణికి పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కానీ అతిగా గ్రాంథికం కాని శైలి వాడబడింది. ‘నిక్షేపం’ కొంత సాంకేతిక పదమైనప్పటికీ గ్రీకు అప్పగింత-భద్రపరచడం రూపకాన్నీ దాని నిజమైన సందిగ్ధతనూ నిలుపడానికి అవసరం; పాదటిప్పణి దానిని వివరిస్తుంది.
