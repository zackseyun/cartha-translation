id: 2TI.1.18
reference: 2 Timothy 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: te
  text: ఆ రోజున ప్రభువు నుండి అతడు కనికరం పొందేలా ప్రభువు అనుగ్రహించుగాక[a][b]—ఎఫెసులో అతడు ఎంతగా సేవ చేశాడో నీకే ఇంకా బాగా తెలుసు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రభువు సన్నిధిలో’; ‘ప్రభువు నుండి’ అనే అనువాదం παρά κυρίου అనే పదబంధాన్ని కనికరానికి మూలంగా అర్థం చేసుకుంటుంది. మరికొందరు దాన్ని ప్రభువు సన్నిధిని నొక్కిచెప్పేదిగా గ్రహిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆ రోజు’ అనేది రాబోయే దైవ తీర్పు లేదా న్యాయస్థాపన దినాన్ని సూచించడానికి కొత్త నిబంధనలో సాధారణంగా వాడే వ్యక్తీకరణ.
    reason: cross_reference
  - marker: c
    text: లేదా ‘అతడు చేసిన సేవలన్నీ.’ గ్రీకు వ్యక్తీకరణ ఎఫెసులో అతడు చేసిన సేవ యొక్క విస్తృతిని సంగ్రహంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: అనుగ్రహించుగాక
  rationale: ఆరిస్ట్ ఆప్టేటివ్ ప్రార్థనాత్మకమైన ఆకాంక్షను వ్యక్తం చేస్తుంది. ‘అనుగ్రహించుగాక’ ఆధునిక గౌరవప్రదమైన తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εὑρεῖν ἔλεος
  choice: కనికరం పొందేలా
  rationale: అక్షరార్థంగా ‘కనికరం కనుగొను’ అయినా, తెలుగులో ‘కనికరం పొందు’ సహజంగా ఉండి గ్రీకు నుడికారంలోని అనుకూల స్వీకరణ భావాన్ని అందిస్తుంది.
- source_word: παρὰ κυρίου
  choice: ప్రభువు నుండి
  rationale: జెనిటివ్‌తో παρά ఇక్కడ మూలాన్ని సూచించడం అత్యంత సహజం. κύριος పునరుక్తిని తొలగించకుండా నిలిపాం.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజున
  rationale: కాలాన్ని సూచించే సహజ తెలుగు రూపం; అంత్యకాల సూచనను వచనంలో వివరించి చెప్పకుండా అసలు సంక్షిప్తతను కాపాడుతుంది.
- source_word: ὅσα
  choice: ఎంతగా
  rationale: ఎఫెసులో చేసిన సేవ యొక్క విస్తృతిని లేదా పరిమాణాన్ని సంక్షిప్తంగా సూచిస్తుంది; ‘ఏయే పనులు’ అని ప్రత్యేక కార్యాల జాబితాగా మార్చదు.
- source_word: διηκόνησεν
  choice: సేవ చేశాడో
  rationale: διακονέω యొక్క విస్తృతమైన సేవాభావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ప్రత్యేక సంఘపదవిని అనవసరంగా సూచించదు.
- source_word: βέλτιον σὺ γινώσκεις
  choice: నీకే ఇంకా బాగా తెలుసు
  rationale: βέλτιον యొక్క తులనాత్మక భావాన్ని ‘ఇంకా బాగా’ కాపాడుతుంది. σὺ పై ఉన్న ఉద్ఘాటనను ‘నీకే’ తెలియజేస్తుంది; పోలికకు లేని కర్మను చేర్చదు.
theological_decisions:
- issue: ὁ κύριος ... παρὰ κυρίου అనే పునరుక్తిలో ‘ప్రభువు’ ఎవరిని సూచిస్తుంది?
  choice: రెండు చోట్లా ‘ప్రభువు’ అని మాత్రమే అనువదించి, వ్యక్తులను ప్రత్యేకంగా నిర్ధారించలేదు.
  alternative: మొదటి ‘ప్రభువు’ క్రీస్తు, రెండవది తండ్రి; లేదా రెండూ క్రీస్తునే సూచిస్తాయి.
  rationale: గ్రీకు పాఠం రెండు చోట్ల κύριος అనే పదాన్నే వాడి స్పష్టమైన భేదం చేయదు. అందువల్ల పునరుక్తినీ, దైవశాస్త్ర సంబంధమైన అనిశ్చితినీ నిలిపాం.
- issue: ‘ఆ రోజు’ యొక్క అంత్యకాల భావం
  choice: మూలంలోని సంక్షిప్త రూపాన్ని ‘ఆ రోజున’గా ఉంచాం.
  alternative: ‘తీర్పు రోజున’ లేదా ‘చివరి రోజున’ అని విస్తరించడం.
  rationale: ఈ పదబంధం రాబోయే దైవ తీర్పు లేదా న్యాయస్థాపన దినాన్ని సాధారణంగా సూచించవచ్చు; అయినా మూలం దానిని ఇక్కడ స్పష్టీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ప్రార్థనాత్మక ఆకాంక్షకు ‘అనుగ్రహించుగాక’ను ఉంచి, సేవను సంఘపదవిగా కాక విస్తృత కార్యంగా తెలిపాం. మూలంలోని ‘ప్రభువు’ పునరుక్తిని, ‘ఆ రోజు’ అనే అంత్యకాల సంక్షిప్తతను అలాగే కాపాడాం.
