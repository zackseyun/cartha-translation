id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: te
  text: 'ప్రియమైన బిడ్డయైన తిమోతికి: తండ్రియైన దేవుని నుండి, మన ప్రభువైన మెస్సీయ యేసు[a] నుండి కృప, కరుణ, శాంతి కలుగుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు యేసు.” గ్రీకు బిరుదైన Χριστός అర్థాన్ని నిలుపడానికి ప్రధాన పాఠ్యంలో “మెస్సీయ” అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: ప్రియమైన
  rationale: ఆప్యాయతతోపాటు గంభీరతను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τέκνῳ
  choice: బిడ్డ
  rationale: ఆధ్యాత్మిక సంతాన సంబంధాన్ని సూచించే రూపకాన్ని నిలుపుతుంది; గ్రీకు పదంలో లేని ‘కుమారుడు’ అనే లింగ-నిర్దిష్టతను చేర్చదు.
- source_word: χάρις
  choice: కృప
  rationale: పౌలు వాడే అభివాద పదానికి స్థిరమైన, అర్థవంతమైన తెలుగు సమానం.
- source_word: ἔλεος
  choice: కనికరం
  rationale: కృపకు భిన్నమైన భావాన్ని నిలుపుతూ, దేవుని దయాపూర్వక స్పందనను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: వ్యక్తిగత, సంబంధాత్మక, ఒడంబడిక సంబంధమైన విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: θεοῦ πατρὸς
  choice: తండ్రియైన దేవుడు
  rationale: గ్రీకులో ‘మన’ అనే సర్వనామం తండ్రిని విశేషించనందున దాన్ని చేర్చకుండా, సహజమైన తెలుగులో సంబంధాన్ని వ్యక్తపరుస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున దాని భావాన్ని తెలిపే ‘మెస్సీయ’ను వాడి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చింది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: అధికార భావాన్నీ క్రీస్తు సంబంధమైన ప్రాముఖ్యతనూ నిలుపుతుంది.
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: Χριστός ఇక్కడ పేరులో భాగంలా స్థిరపడినప్పటికీ బిరుదు భావాన్ని కలిగి ఉంది. అందువల్ల దాని అర్థాన్ని ముందుకు తెచ్చే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో నిలిపింది.
- issue: గ్రీకులో క్రియ లేని అభివాద వాక్యం
  choice: కలుగుగాక
  alternative: క్రియను చేర్చకుండా నామవాచకాల జాబితాగా ఉంచడం
  rationale: గ్రీకు అభివాదంలో ఆశీర్వాద క్రియ భావం అంతర్లీనంగా ఉంది. తెలుగులో వాక్యం సహజంగా, స్పష్టంగా ఉండేందుకు ‘కలుగుగాక’ను చేర్చడం భావాన్ని వివరిస్తుంది గాని కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైనప్పటికీ గౌరవప్రదమైన పత్రికా-అభివాద శైలి వాడబడింది. మూలంలో లేని ‘నా’ను చేర్చలేదు; ‘మన’ అనేది ప్రభువును మాత్రమే విశేషించేలా నిర్మాణం ఉంచబడింది.
