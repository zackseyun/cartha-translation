id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: te
  text: కాబట్టి మన ప్రభువును గురించిన సాక్ష్యానికి[a], ఆయన ఖైదీనైన నన్ను గురించీ సిగ్గుపడకు; బదులుగా, దేవుని శక్తిని బట్టి[c] సువార్త కొరకు కష్టాలు అనుభవించడంలో పాలుపంచుకో[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన ప్రభువు ఇచ్చిన సాక్ష్యానికి.” గ్రీకు షష్ఠీవిభక్తిని ఈ విధంగానూ అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ ప్రభువును గురించిన సాక్ష్యం అనే భావమే ఎక్కువ సంభావ్యంగా కనిపిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “సువార్త కోసం కష్టాల్లో పాలుపంచుకో.” గ్రీకు క్రియలో ఇతరులతో కలిసి కష్టాలు అనుభవించే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “దేవుని శక్తిచేత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: కాబట్టి ... సిగ్గుపడకు
  rationale: οὖν ముందున్న ప్రోత్సాహం నుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; μήతో కూడిన క్రియ నిషేధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπαισχυνθῇς
  choice: సిగ్గుపడకు
  rationale: అవమానం వల్ల వెనుకంజ వేయడం లేదా సిగ్గుగా భావించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువును గురించిన సాక్ష్యం
  rationale: τοῦ κυρίου ἡμῶνను ఇక్కడ objective genitiveగా గ్రహించడం సందర్భానికి సరిపోతుంది; μαρτύριονలోని సాక్ష్యమనే నామవాచక భావాన్ని నిలుపుతుంది.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: ఆయన ఖైదీనైన నన్ను గురించీ
  rationale: రెండవ సిగ్గు విషయాన్ని స్పష్టంగా అనుసంధానిస్తూ, αὐτοῦలోని ప్రభువుతో చెందిన సంబంధాన్ని ‘ఆయన ఖైదీ’గా నిలుపుతుంది.
- source_word: συγκακοπάθησον
  choice: నాతో కలిసి కష్టాలు అనుభవించు
  rationale: συν- ఉపసర్గలోని కలిసి పాలుపంచుకునే భావాన్ని స్పష్టంగా తెలుపుతుంది; సందర్భంలో వక్తయైన పౌలు సహభాగిగా సహజంగా సూచించబడుతున్నాడు.
- source_word: τῷ εὐαγγελίῳ
  choice: సువార్త కోసం
  rationale: గ్రీకు దత్తివిభక్తి సంబంధం సంక్షిప్తంగా ఉంది; తెలుగులో ‘సువార్తతో కలిసి కష్టపడు’ అసహజం కావడంతో, సువార్త నిమిత్తమైన బాధ అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: κατὰ δύναμιν θεοῦ
  choice: దేవుని శక్తికి తగినట్లుగా
  rationale: κατά యొక్క ప్రమాణం, పరిమాణం లేదా అనుగుణత భావాన్ని నిలుపుతూ, కేవలం సాధనార్థకమైన ‘దేవుని శక్తిచేత’గా పరిమితం చేయదు.
theological_decisions:
- issue: ‘సాక్ష్యం’కు ‘మన ప్రభువు’తో ఉన్న సంబంధం
  choice: మన ప్రభువును గురించిన సాక్ష్యం
  alternative: మన ప్రభువు ఇచ్చిన సాక్ష్యం
  rationale: సందర్భంలో క్రైస్తవ సాక్ష్యానికి కేంద్రబిందువైన ప్రభువును గురించి సిగ్గుపడవద్దనే భావం బలంగా ఉంది; అయినా గ్రీకు షష్ఠీవిభక్తిలోని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: ‘ఆయన ఖైదీ’లో పౌలు బంధితత్వపు భావం
  choice: ఆయన ఖైదీనైన నేను
  alternative: ఆయన నిమిత్తం ఖైదీనైన నేను
  rationale: αὐτοῦలోని స్వామ్య/సంబంధ భావాన్ని నేరుగా నిలుపుతుంది; ‘ఆయన నిమిత్తం’ అని కారణార్థాన్ని మాత్రమే నిర్దిష్టం చేయదు.
- issue: κατὰ δύναμιν θεοῦ యొక్క సంబంధం
  choice: దేవుని శక్తికి తగినట్లుగా
  alternative: దేవుని శక్తిచేత
  rationale: గ్రీకులోని అనుగుణత లేదా ప్రమాణ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, శక్తి సాధనంగా పనిచేస్తుందనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. గ్రీకు వాక్యంలోని దీర్ఘ సమన్వయాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి సహజత్వాన్ని పెంచాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
