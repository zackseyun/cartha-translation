reference: 2 Timothy 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: te
  text: నా నుండి నీవు విన్న స్వస్థమైన మాటల నమూనాను, మెస్సీయ[c] యేసులో ఉన్న విశ్వాసంతోను[a] ప్రేమతోను[b] గట్టిగా పట్టుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకత్వంతో, ప్రేమతో.” ‘విశ్వాసం’గా అనువదించిన గ్రీకు పదానికి ‘నమ్మకత్వం’ లేదా ‘నమ్మకం’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మెస్సీయ యేసులోని విశ్వాసం, ప్రేమను గురించిన, నా నుండి నీవు విన్న స్వస్థమైన మాటల నమూనాను గట్టిగా పట్టుకో.” గ్రీకు వాక్యనిర్మాణం విశ్వాసం, ప్రేమ అనేవి నమూనాను పట్టుకునే తీరును సూచిస్తున్నాయా, లేక ఆ మాటల విషయాన్ని సూచిస్తున్నాయా అనే రెండు అన్వయాలకు అవకాశం ఇస్తుంది.
    reason: alternative_reading
  - marker: c
    text: 'సాంప్రదాయ అనువాదం: “క్రీస్తు యేసు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: నమూనా
  rationale: ఈ పదం అనుసరించవలసిన రూపం, మాదిరి, లేదా నమూనాను సూచిస్తుంది. సందర్భంలో అపొస్తలుడి మాటలు ప్రమాణాత్మక రూపంగా నిలుస్తున్న భావాన్ని ‘నమూనా’ సహజంగా కాపాడుతుంది.
- source_word: ἔχε
  choice: గట్టిగా పట్టుకో
  rationale: అక్షరార్థంగా ‘కలిగి ఉండు’ అయినా, ఇక్కడ ఆజ్ఞారూపం దానిని నిలుపుకొని దానికి కట్టుబడి ఉండమనే భావాన్ని ఇస్తుంది.
- source_word: ὑγιαινόντων λόγων
  choice: నిర్దోషమైన మాటలు
  rationale: ὑγιαίνω యొక్క రూపకాల భావం ఆరోగ్యకరమైనది, సరిగా ఉన్నది, లోపంలేనిది. ‘నిర్దోషమైన’ అనేది బోధ సత్యసంపన్నంగా, చెడిపోకుండా ఉందనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; λόγων ను మరింత వ్యాఖ్యానాత్మకమైన ‘బోధ’గా కాక ‘మాటలు’గా ఉంచింది.
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: నీవు నా దగ్గర విన్న
  rationale: παρά + షష్ఠీ విభక్తి ఇక్కడ మూలాన్ని సూచిస్తుంది. ‘నా దగ్గర విన్న’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, పౌలు నుండి విన్నాడనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ἐν πίστει
  choice: విశ్వాసంతో
  rationale: ἐν ఇక్కడ పట్టుకోవలసిన తీరు లేదా పరిధిని సూచించవచ్చు. ‘విశ్వాసంతో’ సహజ తెలుగు; πίστις కు ‘నమ్మకత్వం’ అనే అర్థసాధ్యతను పాదటిప్పణిలో నిలిపాం.
- source_word: καὶ ἀγάπῃ
  choice: ప్రేమతో
  rationale: ἀγάπη కు సాధారణమైన, నేరమైన తెలుగు సమానం ‘ప్రేమ’.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో ఉన్న
  rationale: ఆర్టికల్‌తో కూడిన ఈ పదబంధం విశ్వాసం, ప్రేమ రెండింటినీ సమష్టిగా విశేషిస్తున్నట్లు ప్రధాన పాఠం చూపుతుంది.
- source_word: Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని నిలుపుకుంటుంది; అందువల్ల ‘క్రీస్తు’ అనే సాంప్రదాయ రూపానికి బదులు దాని అర్థాన్ని వెల్లడించే ‘మెస్సీయ’ ఎంచుకున్నాం.
theological_decisions:
- issue: ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ దేనిని విశేషిస్తుంది?
  choice: మెస్సీయ యేసులో ఉన్న విశ్వాసం, ప్రేమతో తిమోతి ఆ నమూనాను పట్టుకోవలసిన తీరు లేదా పరిధిని ఇది తెలియజేస్తుందని ప్రధాన పాఠం చూపుతుంది.
  alternative: మెస్సీయ యేసులోని విశ్వాసం, ప్రేమకు సంబంధించిన నిర్దోషమైన మాటలు అని ఈ పదబంధాన్ని ‘మాటల’ విషయంగా కూడా గ్రహించవచ్చు.
  rationale: గ్రీకు వాక్యనిర్మాణంలో రెండు అన్వయాలకూ అవకాశం ఉంది. ఉపదేశాత్మక ప్రవాహం మొదటి అన్వయానికి కొంత మద్దతు ఇస్తుంది; అయితే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి అసలులోని సందిగ్ధతను కాపాడాం.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ పౌలు ప్రయోగంలో పదం బిరుదుగా ఉన్న అర్థం ఇంకా సజీవంగా ఉంది. అందువల్ల అర్థాన్ని వెల్లడించే ‘మెస్సీయ’ ప్రధాన పాఠంలో, సాంప్రదాయ రూపం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే శైలి వాడబడింది. ‘నమూనా’, ‘మాటలు’, ‘గట్టిగా పట్టుకో’ అనే పదాలు మూలంలోని రూపకాన్ని, ఆజ్ఞ బలాన్ని కాపాడుతాయి. పాదటిప్పణి గుర్తులన్నీ ప్రధాన పాఠంలో ఉన్నాయి.
