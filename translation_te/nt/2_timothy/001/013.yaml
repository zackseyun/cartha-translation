- from: నీవు నా దగ్గర విన్న నిర్దోషమైన మాటల నమూనాను, మెస్సీయ యేసులో ఉన్న విశ్వాసంతో, ప్రేమతో గట్టిగా పట్టుకో.[a][b][c]
  to: నా నుండి నీవు విన్న స్వస్థమైన మాటల నమూనాను, మెస్సీయ[c] యేసులో ఉన్న విశ్వాసంతోను[a] ప్రేమతోను[b] గట్టిగా పట్టుకో.
