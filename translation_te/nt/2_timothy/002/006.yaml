review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the laboring farmer, the necessity expressed by δεῖ, and the farmer's priority in sharing the produce. However, the emphatic particle -ఏ in రైతే adds a focus ('the farmer himself') that is not explicitly expressed in the Greek; πρῶτον concerns priority in receiving, not contrastive emphasis on the farmer.
  naturalness: ‘కష్టపడి పనిచేసే రైతు’ is natural modern Telugu. ‘పంట దిగుబడిలో మొదట వాటా పొందాలి’ is more idiomatic and precise than ‘పంటలో మొదట పాలు పొందాలి,’ while retaining the partitive sense.
  terminology: ‘వాటా పొందాలి’ clearly represents μεταλαμβάνειν ('share/partake') in this agricultural context. ‘పంట దిగుబడి’ naturally renders τῶν καρπῶν without restricting the sense to edible fruit.
  issues:
  - severity: low
    issue: Unwarranted emphatic suffix in ‘రైతే’
    rationale: The suffix -ఏ supplies an explicit contrastive/emphatic nuance. The Greek identifies the hardworking farmer and says that he must receive first; it does not specifically contrast him with others by means of an equivalent emphatic particle.
  - severity: low
    issue: Footnote’s lexical explanation is imprecise
    rationale: The note says a Greek ‘word’ can mean both ‘పాలుపొందాలి’ and ‘అనుభవించాలి.’ The relevant verb μεταλαμβάνειν means to share in or partake of; ‘అనుభవించాలి’ can be broader and less clearly partitive. A formal alternative should preserve the sharing sense.
  revised_text: కష్టపడి పనిచేసే రైతు పంట దిగుబడిలో మొదట వాటా పొందాలి.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “శ్రమించే రైతు పంట ఫలాల్లో మొదట పాలు పొందాలి.”
    reason: lexical_alternative
  revision_rationale: The revision removes added contrastive emphasis, expresses the farmer’s prior participation with ‘మొదట,’ and uses ‘వాటా పొందాలి’ to make the partitive force of μεταλαμβάνειν clear. The footnote supplies a more formal alternative that remains faithful to the same sense.
