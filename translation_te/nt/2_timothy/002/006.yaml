revisions:
- from: కష్టపడి పనిచేసే రైతే పంటలో మొదట పాలు పొందాలి.[a]
  to: కష్టపడి పనిచేసే రైతు పంట దిగుబడిలో మొదట వాటా పొందాలి.[a]
  rationale: The revision removes added contrastive emphasis, expresses the farmer’s prior participation with ‘మొదట,’ and uses ‘వాటా పొందాలి’ to make the partitive force of μεταλαμβάνειν clear. The footnote supplies a more formal alternative that remains faithful to the same sense.
  reviewer_model: gpt-5.6-terra
