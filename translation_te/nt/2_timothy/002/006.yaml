  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: te
  text: కష్టపడి పనిచేసే రైతు పంట దిగుబడిలో మొదట వాటా పొందాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శ్రమించే రైతు పంట ఫలాల్లో మొదట పాలు పొందాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶντα
  choice: కష్టపడి పనిచేసే
  rationale: ఈ వర్తమాన కృదంతం తీవ్రమైన, శ్రమతో కూడిన పనిని సూచిస్తుంది. రైతు చేస్తున్న నిరంతర శ్రమను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: γεωργὸν
  choice: రైతు
  rationale: భూమిని సాగుచేసే వ్యక్తిని సూచించే సాధారణమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: δεῖ
  choice: పొందాలి
  rationale: తెలుగులో ‘-ఆలి’ రూపం అవసరం లేదా సముచితమైన బాధ్యతను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: పంటలో పాలుపొందే విషయంలో రైతుకు ప్రాధాన్యం ఉందనే భావాన్ని కాపాడుతుంది; అతడు తినడానికి ముందు పని చేయాలనే భావంగా మార్చదు.
- source_word: τῶν καρπῶν
  choice: పంటలో
  rationale: వ్యవసాయ సందర్భంలో καρποί పొలం నుండి లభించే దిగుబడిని సూచిస్తుంది. భాగస్వామ్యాన్ని తెలిపే క్రియతో ‘పంటలో’ సహజంగా సరిపోతుంది.
- source_word: μεταλαμβάνειν
  choice: పాలు పొందాలి
  rationale: μεταλαμβάνωలోని భాగస్వామ్యం లేదా వాటా పొందడం అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: సామెతవంటి వాక్యంలో πρῶτον దేనితో సంబంధిస్తుంది?
  choice: కష్టపడిన రైతు పంటలో పాలు పొందడంలో మొదటి ప్రాధాన్యం కలిగి ఉండాలి.
  alternative: రైతు పంటలో పాలుపొందే ముందు మొదట కష్టపడాలి.
  rationale: గ్రీకు వాక్యనిర్మాణంలో πρῶτον సహజంగా μεταλαμβάνειν అనే పాలుపొందడాన్ని విశేషిస్తుంది. అందువల్ల శ్రమ ఫలితంలో రైతుకు ప్రాధాన్య భాగస్వామ్యం ఉండాలనే భావం ప్రధానమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘రైతే’ అనే ఉద్ఘాటన πρῶτον సూచించే ప్రాధాన్యాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
