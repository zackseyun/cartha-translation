id: 2TI.2.26
reference: 2 Timothy 2:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: te
  text: వారు మళ్లీ తేరుకొని అపవాది ఉచ్చు నుండి తప్పించుకోవచ్చు; వారు అతనిచేత సజీవంగా పట్టుబడి అతని సంకల్పం నెరవేర్చడానికి ఉన్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిచేత బందీలుగా పట్టుబడి, ఆ వ్యక్తి సంకల్పం నెరవేర్చడానికి.” “ఆ వ్యక్తి” అనే మాట అపవాదిని కాక దేవుణ్ణి సూచిస్తుందని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: “సజీవంగా పట్టుబడ్డారు” అని అనువదించిన గ్రీకు క్రియను సాధారణంగా “బందీలుగా పట్టుబడ్డారు” అని కూడా అనువదించవచ్చు; అయితే ఆ క్రియ మరింత నిర్దిష్టంగా సజీవంగా పట్టుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: మళ్లీ స్పృహలోకి వచ్చి
  rationale: ఈ క్రియకు అక్షరార్థంగా మళ్లీ మత్తు వదలి స్పష్టమైన ఆలోచనలోకి రావడం అనే భావం ఉంది. ఇక్కడ మోసం నుండి మానసిక, నైతిక స్పష్టతకు తిరిగి రావడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παγίδος
  choice: ఉచ్చు
  rationale: παγίς సూచించే పట్టుకునే ఉచ్చు అనే రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: διαβόλου
  choice: అపవాది
  rationale: ఇక్కడ διάβολος సాతానుకు వ్యక్తిగత బిరుదుగా ఉంది; ‘అపవాది’ దాని నిందమోపేవాడు అనే మూలభావాన్ని, తెలుగు బైబిలు వాడుకను రెండింటినీ నిలుపుతుంది.
- source_word: ἐζωγρημένοι
  choice: సజీవంగా పట్టుకోబడ్డారు
  rationale: ζωγρέω కేవలం బంధించడం కాక సజీవంగా పట్టుకోవడాన్ని ప్రత్యేకంగా సూచిస్తుంది. పరిపూర్ణ కర్మణి కృదంతం గతంలో జరిగిన పట్టివేత వల్ల కొనసాగుతున్న స్థితిని తెలియజేస్తుంది.
- source_word: ὑπ’ αὐτοῦ
  choice: వాడిచేత
  rationale: సమీప పూర్వపదమైన అపవాదినే సహజంగా సూచిస్తుంది. ‘వాడు’ అనే రూపం అపవాదిని గౌరవార్థకంగా చూపకుండా స్పష్టమైన సూచననిస్తుంది.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: వాడి సంకల్పం కోసం
  rationale: εἰς యొక్క దిశ లేదా ఉద్దేశ భావాన్ని, గ్రీకు వాక్యంలోని సంక్షిప్తతను నిలుపుతుంది; మూలంలో లేని ‘చేయడానికి’ అనే క్రియను ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: εἰς τὸ ἐκείνου θέλημα లో ἐκείνου ఎవరిని సూచిస్తుంది?
  choice: అపవాదిని సూచించేదిగా ప్రధాన పాఠ్యంలో ‘వాడి సంకల్పం కోసం’
  alternative: ‘ఆయన సంకల్పం కోసం’ అని దేవుణ్ణి సూచించవచ్చు; లేదా ‘ఆయన సంకల్పం చేయడానికి’ అని అర్థం చేసుకోవచ్చు.
  rationale: సమీప వ్యాకరణ పూర్వపదం అపవాది కావడం వల్ల అదే అత్యంత సహజమైన పఠనం. అయితే సూచిత వ్యక్తి విషయంలో ప్రాచీన గ్రీకు వాక్యం నిజమైన సందిగ్ధతను అనుమతిస్తుంది; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. అపవాదిని సూచించే సర్వనామాలకు ‘వాడు/వాడి’ వాడి, దేవుణ్ణి సూచించే ప్రత్యామ్నాయానికి ‘ఆయన’ వాడడం ద్వారా పాదసూచికలోని భేదాన్ని స్పష్టంచేశాం. మూలంలోని పొడవైన వాక్య నిర్మాణాన్ని తెలుగులో సెమికోలన్‌తో సహజంగా విభజించాం.
