  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: te
  text: అయితే, మూర్ఖమైన, శిక్షణలేని వాదప్రశ్నలను[a] తిరస్కరించు; అవి కలహాలను పుట్టిస్తాయని[b] నీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రశ్నలను,’ ‘వివాదాలను.’ గ్రీకు పదం విచారణలను కూడా సూచించగలదు; అయితే ఇక్కడ నిజాయితీగల అన్వేషణకన్నా కలహాలకు దారితీసే వాదాలే ఉద్దేశంగా కనిపిస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘కంటాయి’ లేదా ‘జన్మనిస్తాయి’; కలహాలను కలిగిస్తాయనే భావంలో ఇది రూపక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: మూర్ఖమైన
  rationale: వివేకరహితమైనదనే నైతిక-బౌద్ధిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπαιδεύτους
  choice: శిక్షణలేని
  rationale: కేవలం తెలివిలేమి కాక, బోధన లేదా క్రమశిక్షణతో కూడిన శిక్షణ లేకపోవడాన్ని సూచిస్తుంది.
- source_word: ζητήσεις
  choice: వాదప్రశ్నలను
  rationale: ఈ పదం ప్రశ్నలు లేదా విచారణలను సూచించగలిగినా, సందర్భంలో వివాదానికి దారితీసే ప్రశ్నోత్తర వాదాల భావం ఉంది; 'వాదప్రశ్నలు' ఆ ద్వంద్వార్థాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: παραιτοῦ
  choice: తిరస్కరించు
  rationale: వాటిలో పాల్గొనకుండా నిరాకరించాలనే మధ్యమ ఏకవచన ఆజ్ఞ యొక్క బలాన్ని కాపాడుతుంది.
- source_word: εἰδὼς
  choice: నీకు తెలుసు
  rationale: కర్తకు ఇప్పటికే తెలిసిన విషయమే ఆ ఆజ్ఞకు కారణమని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γεννῶσι
  choice: పుట్టిస్తాయి
  rationale: మూలంలోని 'కంటాయి/జన్మనిస్తాయి' అనే రూపకాన్ని సహజమైన తెలుగు ప్రయోగంలో నిలుపుతుంది.
- source_word: μάχας
  choice: కలహాలను
  rationale: శారీరక పోరాటాలకన్నా వాగ్వివాదాల వల్ల కలిగే ఘర్షణలను సందర్భానుసారంగా సూచిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి ఉపదేశంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
