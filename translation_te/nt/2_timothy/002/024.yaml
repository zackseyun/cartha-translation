id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: te
  text: 'అయితే ప్రభువు సేవకుడు[a] కలహించకూడదు. అతడు అందరిపట్ల సౌమ్యంగా, బోధించగలవాడిగా, తనకు కీడు జరిగినప్పుడు ఓర్పు వహించేవాడిగా ఉండాలి.


    [a] లేదా “ప్రభువు దాసుడు.” గ్రీకు పదమైన దూలొస్ సందర్భాన్ని బట్టి “సేవకుడు” లేదా “దాసుడు” అని అర్థం కావచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రభువు దాసుడు.” గ్రీకు పదమైన దూలొస్ సందర్భాన్ని బట్టి “సేవకుడు” లేదా “దాసుడు” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  choice: సేవకుడు
  rationale: δοῦλος అనే పదానికి సందర్భాన్ని బట్టి ‘సేవకుడు’ లేదా ‘దాసుడు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ప్రభువుకు సేవచేసే వ్యక్తి ప్రవర్తన ప్రధానంగా ఉన్నందున ‘సేవకుడు’ సహజంగా ఉంది; ‘దాసుడు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: జనిటివ్ సంబంధాన్ని తెలుగులో సహజమైన ‘ప్రభువు సేవకుడు’ అనే నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: οὐ δεῖ μάχεσθαι
  choice: కలహించకూడదు
  rationale: δεῖ యొక్క విధ్యర్థక బలాన్ని ‘కూడదు’ నిలుపుతుంది; ఈ బోధనా సందర్భంలో μάχεσθαι ప్రధానంగా వాగ్వివాదపూర్వక కలహాన్ని సూచిస్తుంది.
- source_word: ἤπιον
  choice: సౌమ్యంగా
  rationale: విరోధభావం లేని మృదువైన ప్రవర్తనను ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πρὸς πάντας
  choice: అందరిపట్ల
  rationale: πρός లోని సంబంధపూర్వక భావాన్నీ πάντας లోని సార్వత్రిక పరిధినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διδακτικόν
  choice: బోధించగలవాడిగా
  rationale: ఈ పదం నేర్చుకోవడానికి సిద్ధంగా ఉండటాన్ని కాక, బోధించడానికి సమర్థుడై ఉండటాన్ని సూచిస్తుంది.
- source_word: ἀνεξίκακον
  choice: తనకు కీడు జరిగినప్పుడు ఓర్పు వహించేవాడిగా
  rationale: అరుదైన ఈ పదం కీడు లేదా అన్యాయం ఎదురైనప్పుడు ప్రతీకారం తీర్చుకోకుండా సహించడాన్ని సూచిస్తుంది; తెలుగు వాక్యం ఆ భావాన్ని స్పష్టంగా చేస్తుంది.
theological_decisions:
- issue: పరిచర్య సూచనల సందర్భంలో δοῦλος అనువాదం
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ఈ వచనంలో బానిస స్థితికన్నా ప్రభువుకు సేవచేసే వ్యక్తి ప్రవర్తనపై దృష్టి ఉంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘సేవకుడు’ను ఎంచుకుని, మూలపదంలోని సామాజిక స్థితి భావాన్ని దాచకుండా ‘దాసుడు’ను పాదటిప్పణిలో ఇచ్చాం.
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో κύριος ప్రభువును సూచిస్తుంది; ‘ప్రభువు’ సాధారణమైన, గౌరవప్రదమైన అనువాదం. ‘యజమాని’ అని అనువదిస్తే δοῦλος యొక్క సామాజిక సంబంధం అవసరానికి మించి ముందుకు రావచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకు వాక్యంలోని వరుస విశేషణాలను తెలుగులో సులభంగా చదవడానికి రెండు వాక్యాలుగా అమర్చాం; విధ్యర్థక బలం మరియు లక్షణాల సమాంతరత్వం నిలుపుకున్నాం.
