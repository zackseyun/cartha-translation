id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: te
  text: కాబట్టి, ఎవరైనా వీటి నుండి తమను తాము శుద్ధి చేసుకుంటే, వారు గౌరవకరమైన ఉపయోగానికి[a] ఒక పాత్రగా ఉంటారు—పవిత్రపరచబడినదిగా[b], యజమానికి[c] ఉపయోగకరమైనదిగా, ప్రతి మంచి పనికి సిద్ధపరచబడినదిగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “గౌరవం కోసం” లేదా “గౌరవానికి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “పవిత్రంగా చేయబడిన,” “ప్రత్యేకంగా ఉంచబడిన.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “ప్రభువుకు”; ఇక్కడి గ్రీకు పదం ఇంటిపై అధికారం గల యజమానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: కాబట్టి, ... చేసుకుంటే
  rationale: οὖν తెలిపే ముందటి సందర్భం నుంచి వచ్చే నిర్ధారణను ‘కాబట్టి’తో, ἐὰν తెలిపే షరతును ‘చేసుకుంటే’తో సహజమైన తెలుగులో నిలిపింది.
- source_word: τις
  choice: ఎవరైనా
  rationale: ఇది నిర్దిష్ట వ్యక్తిని లేదా పురుషుణ్ణి మాత్రమే సూచించని సాధారణ అనిర్దిష్ట సర్వనామం.
- source_word: ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων
  choice: వీటి నుండి తమను తాము శుద్ధి చేసుకుంటే
  rationale: ἐκκαθαίρωలోని పూర్తిగా తొలగించి శుభ్రపరచుకోవడం అనే భావాన్ని ‘శుద్ధి చేసుకోవడం’ తెలియజేస్తుంది; ‘వీటి నుండి’ అనే మాట ముందటి సందర్భానికి ఉన్న సూచనను వ్యాఖ్యానించి పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: σκεῦος
  choice: పాత్ర
  rationale: ముందటి వచనంలోని పెద్ద ఇంటి పాత్రల రూపకాన్ని కొనసాగించే సహజమైన తెలుగు పదం.
- source_word: εἰς τιμήν
  choice: గౌరవకరమైన ఉపయోగానికి
  rationale: ముందటి వచనంలోని ἀτιμίαతో ఉన్న వ్యత్యాసాన్ని మరియు ఇంటి పాత్రను ఉపయోగించే భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది; మరింత అక్షరార్థమైన రూపం పాదసూచికలో ఉంది.
- source_word: ἡγιασμένον
  choice: పవిత్రపరచబడిన
  rationale: పవిత్రం చేయబడిన ఫలితస్థితిని తెలిపే perfect passive participle భావాన్ని, దాని ధార్మిక గంభీరతను కాపాడుతుంది.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: యజమానికి ఉపయోగకరమైన
  rationale: εὔχρηστος యొక్క సేవకు పనికివచ్చే భావాన్ని, δεσπότης యొక్క ఇంటిపై అధికారం గల యజమాని భావాన్ని రూపకానికి అనుగుణంగా నిలిపింది.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: ప్రతి మంచి పనికి సిద్ధపరచబడిన
  rationale: πᾶν యొక్క సమగ్రతను, ἔργον యొక్క విస్తృత కార్యభావాన్ని, passive participle యొక్క సిద్ధం చేయబడిన స్థితిని నిలిపింది.
theological_decisions:
- issue: τις మరియు ἑαυτόν యొక్క సాధారణ ఏకవచన సూచన
  choice: ఎవరైనా ... తమను తాము ... వారు
  alternative: ఎవరైనా ... తనను తాను ... అతడు
  rationale: గ్రీకులోని రూపాలు వ్యాకరణపరంగా ఏకవచనమైనా సూచన సాధారణమైనది, పురుషులకు మాత్రమే పరిమితం కాదు. ఆధునిక తెలుగులో ‘ఎవరైనా ... వారు/తమను తాము’ సాధారణ వ్యక్తిని గౌరవప్రదంగా, సహజంగా సూచిస్తుంది; అర్థాన్ని బహువచన సమూహంగా మార్చదు.
- issue: εἰς τιμήν యొక్క భావం
  choice: గౌరవకరమైన ఉపయోగానికి
  alternative: గౌరవం కోసం
  rationale: 20వ వచనంలోని ఇంటి పాత్రల ఉపయోగానికి సంబంధించిన వ్యత్యాసం ప్రధాన పాఠంలో స్పష్టమవుతుంది; అయినా గ్రీకు పదబంధం అక్షరార్థంగా ‘గౌరవం కోసం/గౌరవానికి’ అని ఉండే సంక్షిప్తతను పాదసూచికలో కాపాడింది.
- issue: δεσπότης యొక్క దైవసూచన మరియు ఇంటి రూపకం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: సందర్భంలో దేవుడే అంతిమ సూచితుడై ఉండవచ్చు; అయితే δεσπότης ఇంటిపై అధికారం గల యజమాని అనే రూపకార్థాన్ని మోస్తుంది. ‘యజమాని’ రూపకాన్ని నిలిపి, స్థిరమైన దైవబిరుదును అనవసరంగా చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఇంటి పాత్ర రూపకం అంతటా నిలిపబడింది. సాధారణ వ్యక్తిని సూచించేందుకు సహజమైన గౌరవ ఏకవచన ప్రయోగమైన ‘వారు/తమను తాము’ వాడబడింది; ఇది లింగాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
