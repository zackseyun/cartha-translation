id: 2TI.2.4
reference: 2 Timothy 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: te
  text: సైనికుడిగా సేవ చేస్తున్న ఎవరూ, తనను సైన్యంలో చేర్చుకున్న వ్యక్తిని మెప్పించడానికి, సాధారణ జీవిత వ్యవహారాల్లో[a] చిక్కుకోరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పౌర జీవన వ్యవహారాల్లో.’ గ్రీకు పాఠం సైనిక సేవను సాధారణ జీవన వ్యవహారాలతో వ్యత్యాసపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ఎవడూ ... చిక్కుకోడు
  rationale: సార్వత్రిక నిరాకరణను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: στρατευόμενος
  choice: సైనికుడిగా సేవచేస్తున్నవాడు
  rationale: కొనసాగుతున్న సైనిక సేవను సూచించే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- source_word: ἐμπλέκεται
  choice: చిక్కుకోడు
  rationale: స్వేచ్ఛగా విధి నిర్వహించడాన్ని అడ్డుకునే చిక్కుబాటు అనే సజీవ రూపకాన్ని కాపాడుతుంది.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: సాధారణ జీవిత వ్యవహారాల్లో
  rationale: βίος సూచించే నిత్య జీవన రంగాన్నీ, πραγματείαις సూచించే పనులు లేదా వ్యవహారాలనూ సహజంగా తెలియజేస్తుంది; సైనిక సేవతో ఉన్న వ్యత్యాసం సందర్భంలో స్పష్టమవుతుంది.
- source_word: ἵνα
  choice: '...డానికి'
  rationale: గ్రీకు ఉద్దేశార్థక సంబంధాన్ని సహజమైన తెలుగు ప్రయోజనార్థక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: τῷ στρατολογήσαντι
  choice: తనను సైన్యంలో చేర్చుకున్నవాణ్ణి
  rationale: నిర్దిష్ట సైనిక హోదాను చేర్చకుండా, చేర్చుకున్న వ్యక్తి అనే మూల భావాన్ని నిలుపుతుంది.
- source_word: ἀρέσῃ
  choice: సంతోషపరచడానికి
  rationale: అతని ఆమోదం పొందడం లేదా అతనికి నచ్చేలా ఉండడం అనే ఉద్దేశాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: సైనిక రూపకం యొక్క పరిధి
  choice: సైనికుడు సాధారణ జీవన వ్యవహారాల్లో చిక్కుకోకుండా, తనను చేర్చుకున్నవాణ్ణి సంతోషపరచాలని చెప్పే రూపకాన్ని యథాతథంగా నిలుపడం.
  alternative: దీనిని నేరుగా పరిచర్య ప్రాధాన్యాల గురించిన సాధారణ ఉపదేశంగా విపులీకరించడం.
  rationale: మూలపాఠం రూపకం ద్వారా బోధిస్తుంది; దాని అన్వయాన్ని అనువాదంలో ముందుగానే నిర్ణయించకుండా చిత్రణను కాపాడాలి.
- issue: πραγματείαις యొక్క భావ పరిధి
  choice: వ్యవహారాలు
  alternative: వృత్తులు లేదా వ్యాపార కార్యకలాపాలు
  rationale: ఈ పదం పనులు, వ్యాపారాలు, వ్యవహారాలు అనే పరిధిని కలిగి ఉంది. సందర్భాన్ని అతిగా కుదించకుండా ‘వ్యవహారాలు’ ఆ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సైనిక రూపకాన్ని వ్యాఖ్యానంగా మార్చకుండా స్పష్టంగా నిలిపింది.
