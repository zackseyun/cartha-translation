id: 2TI.2.8
reference: 2 Timothy 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: te
  text: మృతులలోనుండి లేపబడిన, దావీదు సంతతికి చెందిన యేసు మెస్సీయను[a] జ్ఞాపకం ఉంచుకో—నా సువార్త ప్రకారం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “యేసు క్రీస్తును.” గ్రీకు బిరుదైన Χριστόςను “క్రీస్తు” లేదా “మెస్సీయ” అని అనువదించవచ్చు. ఇక్కడ దావీదు సంతతి ప్రస్తావనతో బిరుదు భావం స్పష్టంగా ఉండడంతో “మెస్సీయ” అని వాడాం.'
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημόνευε
  choice: జ్ఞాపకం ఉంచుకో
  rationale: వర్తమానకాల ఆజ్ఞారూపం నిరంతరం మనసులో ఉంచుకోవాలనే పిలుపును సూచిస్తుంది. ‘జ్ఞాపకం ఉంచుకో’ సహజమైన ఆధునిక తెలుగు ప్రయోగంగా ఆ ఆజ్ఞా బలాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦν Χριστόν
  choice: యేసు మెస్సీయను
  rationale: ఈ సందర్భంలో Χριστός దావీదు వంశసంబంధంతో కూడిన బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని అర్థాన్ని స్పష్టంగా తెలిపే ‘మెస్సీయ’ను ఉపయోగించాం; తెలుగులో విభక్తి మొత్తం పదబంధానికి సహజంగా జతచేయబడింది.
- source_word: ἐγηγερμένον
  choice: లేపబడినవాడూ
  rationale: ఇది పరిపూర్ణ కర్మణి కృదంతం. ‘లేపబడిన’ అనేది యేసుపై జరిగిన క్రియను నిలుపుతూ, పునరుత్థాన స్థితిని సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: పునరుత్థాన సందర్భంలో ఈ గ్రీకు పదబంధానికి అర్థవంతమైన, సహజమైన తెలుగు రూపం.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: దావీదు సంతతివాడూ
  rationale: σπέρμα అక్షరార్థంగా ‘విత్తనం’ అయినా, వంశావళి సందర్భంలో ‘సంతతి’ సహజంగా దావీదు వంశానికి చెందినవాడనే భావాన్ని అందిస్తుంది.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: నా సువార్త ప్రకారం
  rationale: κατά యొక్క ‘ప్రకారం/అనుగుణంగా’ అనే భావాన్నీ, μου అనే స్వామ్యరూపాన్నీ నేరుగా నిలుపుతుంది; ఇది వేరొక సువార్త అని పాఠ్యంలో లేని భావాన్ని చేర్చదు.
theological_decisions:
- issue: Χριστός యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: పునరుత్థానం, దావీదు సంతతి అనే అంశాలతో ఈ సందర్భంలో బిరుదు భావం స్పష్టంగా ఉంది. ‘మెస్సీయ’ ఆ బిరుదు అర్థాన్ని పాఠకునికి తెలియజేస్తుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఉంచాం.
- issue: ἐγηγερμένον లోని పరిపూర్ణ కర్మణి భావం
  choice: లేపబడినవాడూ
  alternative: లేచినవాడూ
  rationale: కర్మణి రూపం యేసు లేపబడినట్టు చెబుతుంది; ‘లేచిన’ అని మార్చితే మూలంలోని కర్మణి సూక్ష్మత తగ్గుతుంది.
- issue: ‘నా సువార్త’ అనే మాట యొక్క భావం
  choice: నా సువార్త ప్రకారం
  alternative: నేను ప్రకటించే సువార్త ప్రకారం
  rationale: మూలంలోని సంక్షిప్త స్వామ్యరూపాన్ని అలాగే ఉంచాం. అది పౌలు ప్రకటించిన లేదా అతనికి అప్పగించబడిన సువార్తను సూచిస్తుందా అనే వివరణను ప్రధాన పాఠ్యంలో విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలిని ఉపయోగించాం. మూలంలోని కృదంత నిర్మాణాలను తెలుగులో ‘…వాడూ …వాడూ అయిన’ రూపంతో అనుసంధానించి, యేసు గురించిన రెండు లక్షణాలనూ సమబలంతో ఉంచాం. ముగింపులోని ‘నా సువార్త ప్రకారం’ అనే పదబంధాన్ని మూల క్రమానికి దగ్గరగా నిలిపాం.
