lexical_decisions:
- source_word: Σὺ
  choice: నీవు
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా ఉండి ఉద్ఘాటనను సూచిస్తుంది; తెలుగులో ‘నీవు’ దానిని సహజంగా నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి వచ్చే అన్వయాన్ని లేదా నిర్ధారణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: τέκνον μου
  choice: నా బిడ్డా
  rationale: τέκνον లింగాన్ని నిర్దిష్టంగా సూచించకుండా ఆప్యాయమైన ఆధ్యాత్మిక సంబంధాన్ని వ్యక్తం చేస్తుంది; సంబోధన రూపం తెలుగులో సహజం.
- source_word: ἐνδυναμοῦ
  choice: బలపరచబడుతూ ఉండు
  rationale: వర్తమాన మధ్యమ/కర్మణి ఆజ్ఞారూపంలోని కొనసాగింపు భావాన్నీ, బలం స్వీకరించబడుతుందనే సంభావ్య భావాన్నీ నిలుపుతుంది.
- source_word: ἐν τῇ χάριτι
  choice: కృపలో
  rationale: ἐν సూచించే పరిధి మరియు సాధన భావాల మధ్య ఉన్న ఉద్దేశపూర్వక విస్తృతిని ‘లో’ నిలుపుతుంది.
- source_word: χάριτι
  choice: కృప
  rationale: χάριςకు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం; దేవుని అనుగ్రహం మరియు బలమిచ్చే కార్యం రెండింటికీ తగినది.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో ఉన్న
  rationale: ఆ కృప మెస్సీయ యేసులో ఉందని తెలిపే గ్రీకు విశేషణ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Χριστῷ
  choice: మెస్సీయ
  rationale: Χριστόςలోని బిరుదు భావాన్ని అనువదిస్తుంది; కేవలం సంప్రదాయ నామరూపంగా మార్చదు.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: Ἰησοῦς అనే వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: ἐνδυναμοῦలో కర్తృత్వం మరియు బలం పొందడం
  choice: బలపరచబడుతూ ఉండు
  alternative: బలంగా ఉండు
  rationale: మధ్యమ/కర్మణి రూపం బలం స్వయంగా సృష్టించుకోవడం కంటే పొందబడుతుందనే భావాన్ని అనుమతిస్తుంది; తరువాతి ‘కృపలో’ అనే మాటతోనూ ఇది సరిపోతుంది.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో బిరుదు భావాన్ని అర్థసహితంగా నిలుపుతుంది; అయితే ‘క్రీస్తు’ సంప్రదాయ తెలుగు రూపం కావడం వల్ల దానిని పాదసూచికలో ఇస్తున్నాం.
