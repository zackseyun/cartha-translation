id: 2TI.2.2
reference: 2 Timothy 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: te
  text: అనేకమంది సాక్షుల సమక్షంలో[a] నీవు నా నుండి విన్న సంగతులను, ఇతరులకు కూడా బోధించగల సామర్థ్యం ఉన్న నమ్మకమైన మనుషులకు[b] అప్పగించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అనేకమంది సాక్షుల ఎదుట.” ఈ గ్రీకు పదబంధం పౌలు బోధను అనేకమంది సాక్షులు ఉండగా బహిరంగంగా ఇచ్చాడని సూచించవచ్చు; “అనేకమంది సాక్షుల ద్వారా” అనే అర్థం కూడా సాధ్యమే, అయితే అది తక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “నమ్మకమైన మనుషులకు.” ఇక్కడున్న పురుషలింగ రూపం ప్రతినిధి అర్థంలో వాడబడి ఉండవచ్చు; అందువల్ల “నమ్మకమైన వారికి” లేదా “నమ్మకమైన వ్యక్తులకు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ ἤκουσας παρ’ ἐμοῦ
  choice: నీవు నా దగ్గర విన్న సంగతులను
  rationale: సంబంధసర్వనామం సూచించే బోధనా విషయాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, παρά + షష్ఠీ విభక్తి తెలిపే మూలాన్ని ‘నా దగ్గర’ అని నిలుపుతుంది.
- source_word: διὰ πολλῶν μαρτύρων
  choice: అనేకమంది సాక్షుల సమక్షంలో
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ బోధ బహిరంగంగా అనేక సాక్షుల ఎదుట అందించబడిందనే సహవర్తి పరిస్థితిని సూచించే అవకాశం ఎక్కువ. సాధనార్థమైన ‘అనేకమంది సాక్షుల ద్వారా’ అనే అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: ταῦτα παράθου
  choice: ఆ సంగతులను … అప్పగించు
  rationale: παρατίθημι ఆజ్ఞారూపం ఒకరి సంరక్షణకు లేదా బాధ్యతకు బోధను అప్పగించడాన్ని సూచిస్తుంది. ‘అప్పగించు’ ఆధునిక తెలుగులో సహజంగా ఉండి బాధ్యతాయుత పరిరక్షణ భావాన్ని అందిస్తుంది.
- source_word: πιστοῖς ἀνθρώποις
  choice: నమ్మకమైన మనుషులకు
  rationale: πιστός ఇక్కడ బోధను విశ్వసనీయంగా అందించే నమ్మకత్వాన్ని ప్రధానంగా సూచిస్తుంది; ‘నమ్మకమైన’ అనే పదం ఆ భావాన్ని స్పష్టంగా ఇస్తుంది. ἀνθρώποις యొక్క వ్యాకరణ పురుషలింగ రూపాన్ని ‘మనుషులు’ నిలుపుతుంది; దాని ప్రతినిధి/సామాన్య ప్రయోగ అవకాశాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: οἵτινες ἱκανοὶ ἔσονται
  choice: సామర్థ్యం ఉన్న
  rationale: ἱκανός తెలిపే తగిన సామర్థ్యాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకు భవిష్యత్ రూపాన్ని తెలుగులో పదేపదే ‘ఉండబోయే’ అని అనడం కృత్రిమంగా ఉండేందున, ఎంపిక చేయాల్సిన వారి లక్షణంగా సహజ వాక్యనిర్మాణంలో తెలిపాం.
- source_word: καὶ ἑτέρους διδάξαι
  choice: ఇతరులకు కూడా బోధించగల
  rationale: καί యొక్క ‘కూడా’ భావాన్ని, ἑτέρους యొక్క ఇతర వ్యక్తుల సూచనను, బోధించే సామర్థ్యంతో సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: πιστοῖς ἀνθρώποις లో లింగ సూచన
  choice: నమ్మకమైన మనుషులకు
  alternative: నమ్మకమైన వారికి / నమ్మకమైన వ్యక్తులకు
  rationale: గ్రీకు పదబంధం వ్యాకరణపరంగా పురుషలింగ బహువచనం. అయితే ἄνθρωπος సామాన్యంగా మానవులను కూడా సూచించగలదు. ప్రధాన పాఠంలో మూలరూపాన్ని నిలిపి, విస్తృత ప్రతినిధి అర్థసాధ్యతను పాదసూచికలో స్పష్టం చేశాం; తద్వారా వాక్యం పరిష్కరించని పరిధిని సిద్ధాంతపరంగా ముందే నిర్ణయించలేదు.
- issue: διὰ πολλῶν μαρτύρων యొక్క సంబంధార్థం
  choice: అనేకమంది సాక్షుల సమక్షంలో
  alternative: అనేకమంది సాక్షుల ద్వారా
  rationale: సందర్భంలో తిమోతి పౌలు దగ్గర బోధను అనేక సాక్షుల ఎదుట విన్నాడనే అర్థం ఎక్కువ సంభావ్యమైనది. అయినా διά + షష్ఠీ విభక్తికి సాధన/మధ్యవర్తిత్వ అర్థం సాధ్యమే కాబట్టి దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘అప్పగించు’ బాధ్యతతో బోధను సంరక్షించి అందించే భావాన్ని ఇస్తుంది. ‘సామర్థ్యం ఉన్న’ అనేది ‘సమర్థులై ఉండబోయే’ వంటి కృత్రిమ పదబద్ధతను నివారిస్తుంది.
