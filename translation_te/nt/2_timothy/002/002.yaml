    issue: ‘నా దగ్గర’ for παρ’ ἐμοῦ
    rationale: In current standard Telugu, ‘నా దగ్గర’ primarily denotes location or proximity (‘near me/with me’). The Greek phrase with ἀκούω identifies Paul as the source of what Timothy heard. ‘నా నుండి’ expresses that relation unambiguously.
