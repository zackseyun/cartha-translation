  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: te
  text: మనం విశ్వాసరహితులమైనా[a], ఆయన నమ్మకంగా నిలిచి ఉంటాడు[b]; తనను తాను కాదనలేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనం నమ్మకపోయినా,’ ‘మనం అవిశ్వాసులమైనా,’ లేదా ‘మనం నమ్మకంగా ఉండకపోయినా.’ గ్రీకు క్రియకు ఈ భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయన విశ్వసనీయుడిగానే ఉంటాడు.’ ‘విశ్వాసరహితులమైనా’ అనే మాటతో ఉన్న వ్యత్యాసాన్ని నిలుపడానికి ప్రధాన పాఠంలో ‘నమ్మకంగా’ అని ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: విశ్వాసరహితులమైనా
  rationale: ఈ క్రియకు ‘నమ్మకపోవడం,’ ‘విశ్వాసం లేకపోవడం,’ లేదా ‘నమ్మకంగా ఉండకపోవడం’ అనే భావాలు ఉండవచ్చు. ‘విశ్వాసరహితులు’ అనే పదం ఈ అర్థపరిధిని సాధ్యమైనంతవరకు తెరిచి ఉంచుతూ πιστόςతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: πιστὸς
  choice: నమ్మకంగా
  rationale: దేవుని స్థిరత్వం, విశ్వసనీయత రెండింటినీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ἀπιστοῦμενతో ఉన్న వ్యత్యాసాన్ని కూడా కాపాడుతుంది.
- source_word: μένει
  choice: నిలిచి ఉంటాడు
  rationale: కొనసాగుతున్న స్థిరత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀρνήσασθαι
  choice: కాదనలేడు
  rationale: తన స్వరూపానికి విరుద్ధంగా వ్యవహరించలేడనే బలమైన భావాన్ని ఇస్తూ, ‘తిరస్కరించు/నిరాకరించు’ అనే మూలార్థాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἑαυτὸν
  choice: తనను తాను
  rationale: ἐκεῖνοςను సూచించే ఆత్మవాచక సర్వనామాన్ని నేరుగా నిలుపుతుంది.
- source_word: οὐ δύναται
  choice: లేడు
  rationale: ‘కాదనలేడు’ అనే సంయుక్త క్రియలో అసమర్థతను సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది; కేవలం ఇష్టంలేకపోవడాన్ని కాదు.
theological_decisions:
- issue: మానవ విశ్వాసరాహిత్యానికి సంబంధించి ఆయన నమ్మకత్వం యొక్క అర్థం
  choice: ఆయన తనను తాను కాదనలేడు కాబట్టి నమ్మకంగా నిలిచి ఉంటాడని మాత్రమే ప్రధాన పాఠం చెబుతుంది.
  alternative: ఈ నమ్మకత్వం తప్పక రక్షించడానికే అని, లేదా హెచ్చరికల ప్రకారం తీర్పు తీర్చడానికే అని స్పష్టీకరించడం.
  rationale: గ్రీకు పాఠం దేవుని స్థిర స్వభావాన్ని ధృవీకరిస్తుంది; అది ఇక్కడ ప్రధానంగా రక్షణను సూచిస్తుందా, వాగ్దానాలన్నిటినీ—తీర్పు హెచ్చరికలతో సహా—నెరవేర్చడాన్ని సూచిస్తుందా అనేది నిర్దిష్టంగా తేల్చదు. అందువల్ల ఆ వేదాంతపరమైన ఉద్వేగాన్ని అనువాదం అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే గౌరవప్రదంగా ఉంది. గ్రీకు వాక్యంలోని సంక్షిప్త, సూక్తిరూప లయను సాధ్యమైనంతవరకు నిలిపింది. కారణార్థక సంధి గ్రీకులో స్పష్టంగా లేకపోవడంతో ఇంగ్లీషు POBలోని ‘for’ను ప్రధాన పాఠంలో చేర్చలేదు; సెమీకోలన్ రెండు వాక్యభాగాల సంబంధాన్ని వ్యాఖ్యానాత్మకంగా నిర్ధారించకుండా ఉంచుతుంది.
