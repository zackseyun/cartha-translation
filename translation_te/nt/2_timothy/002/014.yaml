revisions:
- from: ఈ విషయాలను వారికి పదేపదే గుర్తుచేస్తూ ఉండు. మాటల గురించి వాదించవద్దని ప్రభువు సన్నిధిలో వారిని గంభీరంగా హెచ్చరించు. అలాంటి వాదనవల్ల ఏ ప్రయోజనమూ లేదు[a]; పైగా, అది వినేవారిని నాశనం చేస్తుంది.[b]
  to: ఈ విషయాలను వారికి పదేపదే గుర్తుచేస్తూ, మాటల విషయంలో తగువులాడవద్దని ప్రభువు[a] సన్నిధిలో వారికి గంభీరంగా ఆజ్ఞాపించు. అలాంటి తగువులు ఏ ప్రయోజనమూ ఇవ్వవు[b]; అవి వినేవారి నాశనానికి దారితీస్తాయి.
  rationale: గంభీరమైన ఆజ్ఞాపన భావాన్ని స్పష్టంగా చేయడానికి ‘హెచ్చరించు’ స్థానంలో ‘గంభీరంగా ఆజ్ఞాపించు’ను వాడాం. ఫలితాన్ని సూచించే ἐπὶ καταστροφῇ ను ‘నాశనానికి దారితీస్తాయి’గా అనువదించాం. పాదటీపుల లంగరులను వాటి విషయాలకు సరిపోయేలా సరిచేసి, κύριος యొక్క నిజమైన అస్పష్టతను నిలిపాం.
