id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: te
  text: ఈ విషయాలను వారికి పదేపదే గుర్తుచేస్తూ, మాటల విషయంలో తగువులాడవద్దని ప్రభువు[a] సన్నిధిలో వారికి గంభీరంగా ఆజ్ఞాపించు. అలాంటి తగువులు ఏ ప్రయోజనమూ ఇవ్వవు[b]; అవి వినేవారి నాశనానికి దారితీస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రభువు’ అనేది ఇక్కడ దైవసాక్షిని సాధారణంగా సూచించవచ్చు; అది ప్రత్యేకంగా ప్రభువైన యేసునా లేక విస్తృతార్థంలో దేవుడా అని గ్రీకు పాఠం నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఏ ఉపయోగమూ లేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ విషయాలను
  rationale: ముందు చెప్పిన బోధలను సూచించే నపుంసక బహువచన సర్వనామం; తెలుగు సందర్భంలో ‘ఈ విషయాలను’ సహజంగా దాని పూర్వాపర సంబంధాన్ని నిలుపుతుంది.
- source_word: ὑπομίμνῃσκε
  choice: పదేపదే గుర్తుచేస్తూ ఉండు
  rationale: వర్తమాన కాల ఆజ్ఞలోని కొనసాగింపు లేదా పునరావృత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διαμαρτυρόμενος
  choice: గంభీరంగా హెచ్చరించు
  rationale: ఈ కృదంతం గట్టి సాక్ష్యంతో కూడిన గంభీర ఆదేశం లేదా హెచ్చరికను సూచిస్తుంది; సందర్భానుసారంగా ‘వారిని’ అనే కర్మను స్పష్టంగా చేర్చాం.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: ప్రభువు సన్నిధిలో
  rationale: దైవసాక్షిగా, ఆయన ఎదుట బాధ్యతతో ఆదేశించడాన్ని తెలిపే సహజమైన తెలుగు నుడికారం; κύριος యొక్క నిర్దిష్ట సూచనను మరింత సంకుచితం చేయదు.
- source_word: μὴ λογομαχεῖν
  choice: మాటల గురించి వాదించవద్దని
  rationale: పదాలు లేదా మాటల మీద అనర్థకమైన తగాదాకు దిగడమే λογομαχεῖν భావం; ‘వాదించవద్దని’ గంభీరమైనా సామాన్యులకు స్పష్టమైన రూపం.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: ఏ ప్రయోజనమూ లేదు
  rationale: పూర్తిగా ప్రయోజనం లేనిదని చెప్పే గ్రీకు భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἐπὶ καταστροφῇ
  choice: నాశనం చేస్తుంది
  rationale: καταστροφή యొక్క తీవ్రమైన హానికర ఫలితాన్ని నిలుపుతుంది; ἐπί ఇక్కడ ఫలిత భావాన్ని సూచిస్తుందని గ్రహించి క్రియారూపంలో సహజీకరించాం.
- source_word: τῶν ἀκουόντων
  choice: వినేవారిని
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతాన్ని సహజమైన తెలుగులో అనువదిస్తుంది; వింటున్న వారందరినీ సూచిస్తుంది.
theological_decisions:
- issue: κύριος ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: దేవుడు; ప్రభువైన యేసు
  rationale: గ్రీకు పాఠం కేవలం κύριος అని మాత్రమే చెబుతుంది. సందర్భం దాని సూచనను తప్పనిసరిగా దేవుడికో యేసుక్రీస్తుకో పరిమితం చేయనందున, నిజమైన అస్పష్టతను ‘ప్రభువు’ అనే బిరుదుతో నిలిపాం.
- issue: ἐπ’ οὐδὲν χρήσιμον మరియు ἐπὶ καταστροφῇ మధ్య వాక్యసంబంధం
  choice: మాటల వాదన ప్రయోజనరహితమై, వినేవారిని నాశనం చేస్తుందని రెండు ఫలితాలుగా వ్యక్తీకరించడం
  alternative: ‘ఏ ప్రయోజనం కోసం కాదు, వినేవారి నాశనం కోసమే’ అని సమాంతర పదబంధాలుగా ఉంచడం
  rationale: గ్రీకు నిర్మాణం సంక్షిప్తంగా ఉండి రెండవ ἐπί పదబంధంలో ఫలిత లేదా ఉద్దేశ ఛాయలు ఉండవచ్చు. తెలుగులో ప్రధాన హానికర ఫలితాన్ని స్పష్టంగా చెబుతూ, ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటీపులో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ బోధనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే రీతిలోనూ రూపొందించబడింది. κύριος యొక్క సూచనను వ్యాఖ్యానాత్మకంగా నిర్దిష్టం చేయలేదు; గ్రీకు వాక్యంలోని హానికర ఫలితాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేశాం.
