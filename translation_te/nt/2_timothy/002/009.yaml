revisions:
- from: దాని నిమిత్తమే నేను నేరస్థుడిలా సంకెళ్లపాలయ్యేంతవరకు కష్టాలు అనుభవిస్తున్నాను.[a][b] అయితే దేవుని వాక్యం బంధించబడలేదు.
  to: దానికోసమే[a] నేను నేరస్థుడిలా[b] సంకెళ్ల వరకు కూడా కష్టాలు అనుభవిస్తున్నాను. అయితే దేవుని వాక్యం బంధించబడలేదు.
  rationale: The revision renders the extent of suffering more directly as ‘సంకెళ్ల వరకు కూడా’ and places both existing footnote markers beside the words they annotate. It retains the source’s ambiguity concerning the antecedent of ἐν ᾧ, preserves the concrete chains/binding contrast, and does not narrow ‘God’s word’ to a particular theological referent.
