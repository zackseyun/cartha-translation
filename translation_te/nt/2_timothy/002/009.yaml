id: 2TI.2.9
reference: 2 Timothy 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: te
  text: దానికోసమే[a] నేను నేరస్థుడిలా[b] సంకెళ్ల వరకు కూడా కష్టాలు అనుభవిస్తున్నాను. అయితే దేవుని వాక్యం బంధించబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిలోనే’ లేదా ‘దాని కారణంగానే’; గ్రీకు పదబంధం బహుశా ముందటి వచనంలో ప్రస్తావించిన సువార్తను సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘దుష్కార్యాలు చేసేవాడిలా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: దాని నిమిత్తమే
  rationale: సాపేక్ష పదబంధం ముందటి వచనంలోని సువార్తను సూచిస్తూ కారణార్థాన్ని వ్యక్తం చేస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘దాని నిమిత్తమే’ సహజంగా ఉండి ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: κακοπαθῶ
  choice: కష్టాలు అనుభవిస్తున్నాను
  rationale: వర్తమానకాలంలో కొనసాగుతున్న బాధలు, ఇబ్బందులు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μέχρι δεσμῶν
  choice: సంకెళ్లపాలయ్యేంతవరకు
  rationale: μέχρι తెలిపే పరిమితిని, δεσμῶν యొక్క స్పష్టమైన ‘సంకెళ్లు’ చిత్రాన్ని రెండింటినీ నిలుపుతుంది; సందర్భంలో కారాగార బంధాన్ని సూచిస్తుంది.
- source_word: ὡς κακοῦργος
  choice: నేరస్థుడిలా
  rationale: న్యాయపరమైన, కారాగార సందర్భంలో κακοῦργοςను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ‘దుష్కార్యాలు చేసేవాడిలా’ అనే నైతిక భావమూ సాధ్యమే.
- source_word: ἀλλὰ
  choice: అయితే
  rationale: పౌలు బంధించబడటానికి, దేవుని వాక్యం బంధించబడకపోవటానికి మధ్యనున్న బలమైన వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: λόγος యొక్క విస్తృతిని కాపాడుతూ, దానిని కేవలం లేఖనం లేదా సువార్త ప్రకటనగా సంకుచితం చేయని ప్రామాణిక తెలుగు రూపం.
- source_word: οὐ δέδεται
  choice: బంధించబడలేదు
  rationale: పరిపూర్ణ కర్మణి రూపం సూచించే ప్రస్తుత స్థితిని తెలుపుతూ, పౌలు సంకెళ్లతో ఉన్నాడనే చిత్రానికి ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని వాక్యం’ యొక్క పరిధి
  choice: ‘దేవుని వాక్యం’ అని విస్తృతంగానే అనువదించబడింది.
  alternative: ‘సువార్త సందేశం’ లేదా ‘లేఖనం’
  rationale: తక్షణ సందర్భం సువార్త ప్రకటనను ముఖ్యంగా సూచించినా, గ్రీకు పదబంధం మరింత విస్తృతమైనది. అందువల్ల వచనం తేల్చని విషయాన్ని అనువాదం సంకుచితం చేయదు.
- issue: ἐν ᾧ యొక్క సంబంధం
  choice: ముందటి వచనంలోని సువార్త కారణంగా పౌలు బాధపడుతున్నాడనే భావంతో ‘దాని నిమిత్తమే’ అని అనువదించబడింది.
  alternative: ‘దానిలో’
  rationale: గ్రీకు పదబంధం పరిధి లేదా కారణం రెండింటినీ సూచించగలదు; సందర్భంలో కారణార్థం సహజంగా కనిపించినా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘సంకెళ్లు/బంధించబడలేదు’ అనే మూలంలోని ఉద్దేశపూర్వక బంధన చిత్రాన్ని కాపాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
