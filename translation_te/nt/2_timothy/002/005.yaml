  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: te
  text: అలాగే, ఎవరైనా క్రీడాకారుడిగా పోటీపడితే, నియమాల ప్రకారం పోటీపడనిదే అతను విజయకిరీటం పొందడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయబద్ధంగా.” ఇక్కడ గ్రీకు పదానికి “చట్టబద్ధమైన రీతిలో” లేదా “సక్రమంగా” అనే అర్థం రావచ్చు; ఈ క్రీడా సందర్భంలో అది పోటీ నియమాలకు అనుగుణంగా పోటీపడడాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: క్రీడాకారుడిగా పోటీపడితే / పోటీపడనిదే
  rationale: రెండు రూపాల్లోనూ ఉన్న క్రీడా పోటీ భావాన్ని స్పష్టంగా ఉంచి, మూలంలోని పదబంధ సంబంధాన్ని పునరుక్తి ద్వారా నిలిపింది.
- source_word: τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్టమైన, సాధారణ వర్తింపు గల సర్వనామాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: στεφανοῦται
  choice: అతనికి విజయకిరీటం పెట్టరు
  rationale: పోటీలో గెలిచినవారికి కిరీటం పెట్టే క్రీడా దృశ్యాన్ని నిలుపుతుంది; కిరీటం సూచించే ఆధ్యాత్మిక ప్రతిఫలాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: νομίμως
  choice: నియమాల ప్రకారం
  rationale: క్రీడా సందర్భంలో చట్టబద్ధంగా లేదా సక్రమంగా అనే భావాన్ని, పోటీ నియమాలకు అనుగుణంగా అని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: అలాగే
  rationale: ముందున్న ఉపమానాలకు మరో ఉదాహరణను చేర్చే additive force ను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అలాగే
  rationale: కొత్త ఉదాహరణకు జరిగే స్వల్ప మార్పును, విరోధ భావాన్ని అతిగా చూపకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కిరీటపు రూపకం యొక్క స్వభావం
  choice: పోటీలో విజేతకు కిరీటం పెట్టే క్రీడా రూపకాన్ని మాత్రమే నిలిపి ఉంచడం
  alternative: దానిని అంత్యకాల ప్రతిఫలంగా లేదా పరిచర్యకు లభించే ఆమోదంగా స్పష్టంగా వ్యాఖ్యానించడం
  rationale: గ్రీకు వాక్యం నిర్దిష్టమైన ఆధ్యాత్మిక ప్రతిఫలాన్ని చెప్పదు. కాబట్టి అనువాదం ఆ రూపకంలోని ఉద్దేశపూర్వక విస్తృతిని, ధార్మిక ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి స్పష్టమైనదిగా, గౌరవప్రదంగా ఉంది. క్రీడా రూపకాన్ని స్పష్టంగా నిలిపి, మూలంలో లేని సిద్ధాంత వివరణను చేర్చలేదు.
