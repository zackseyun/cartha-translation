source:
  edition: SBLGNT
  text: ⸀συγκακοπάθησον ὡς καλὸς στρατιώτης ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: te
  text: మెస్సీయ అయిన యేసుకు చెందిన[b] మంచి సైనికునిలా కష్టాల్లో పాలుపంచుకో[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెస్సీయ అయిన యేసుకు చెందిన మంచి సైనికునిలా నాతోపాటు కష్టాన్ని సహించు.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘క్రీస్తు యేసు’; Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ప్రధాన పాఠ్యంలో ‘మెస్సీయ అయిన యేసు’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: కష్టాల్లో పాలుపంచుకో
  rationale: ఇది రెండవ పురుష ఏకవచన ఆజ్ఞార్థక క్రియ. σύν- ఉపసర్గ ఇతరులతో కలిసి కష్టాన్ని అనుభవించే భావాన్ని ఇస్తుంది. గ్రీకు వాక్యంలో స్పష్టంగా లేని ‘నాతో’ అనే కర్మను ప్రధాన పాఠ్యంలో చేర్చకుండా, సామూహిక భావాన్ని ‘పాలుపంచుకో’ సహజంగా తెలియజేస్తుంది.
- source_word: ὡς
  choice: -లా
  rationale: పోలికను సూచించే ὡς భావాన్ని ఆధునిక తెలుగులో సహజమైన ఉపమాన ప్రత్యయం ‘-లా’ వ్యక్తం చేస్తుంది.
- source_word: καλὸς
  choice: మంచి
  rationale: సైనికుని ప్రశంసనీయమైన గుణాన్ని లేదా తగిన నడవడిని సూచిస్తుంది; ‘మంచి’ సరళమైనదీ సహజమైనదీ.
- source_word: στρατιώτης
  choice: సైనికుడు
  rationale: ఈ సాధారణ సైనిక పదం మూలార్థాన్నీ పౌలు ఉపయోగించిన రూపకాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ అయిన యేసు’ అనే రూపం బిరుదు మరియు వ్యక్తినామం మధ్య సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపుతుంది; షష్ఠీ విభక్తి భావం ‘యేసుకు చెందిన’ ద్వారా వ్యక్తమవుతుంది.
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ అనువాదం
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు
  rationale: Χριστόςను కేవలం స్థిరనామంగా కాక ‘మెస్సీయ’ అనే బిరుదుగా ప్రతిబింబించడానికి ప్రధాన పాఠ్యంలో అర్థానువాదం వాడబడింది. తెలుగులో విస్తృతంగా వాడే ‘క్రీస్తు యేసు’ రూపాన్ని పాదసూచికలో ఇచ్చి సంప్రదాయ పదప్రయోగాన్ని కూడా నమోదు చేశాం.
- issue: συγκακοπάθησονలో సహభాగిత్వం
  choice: కష్టాల్లో పాలుపంచుకో
  alternative: నాతోపాటు కష్టాన్ని సహించు
  rationale: సహభాగిత్వ భావాన్ని నిలుపుతూ, ఈ వాక్యంలో ప్రత్యక్షంగా లేని ‘నాతో’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు. సందర్భం ఆధారంగా సాధ్యమైన ఆ పఠనాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞార్థక శైలి వాడబడింది. ‘సైనికునిలా’ రూపకం యథాతథంగా నిలుపబడింది; గ్రీకులోని సహభాగిత్వ భావం సహజమైన ‘పాలుపంచుకో’ ద్వారా వ్యక్తమైంది.
