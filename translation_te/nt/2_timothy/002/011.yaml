reference: 2 Timothy 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: te
  text: 'ఈ మాట నమ్మదగినది[a]: మనం ఆయనతో కలిసి మరణించి ఉంటే[b], ఆయనతో కలిసి జీవిస్తాం కూడా[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ వాక్యం నమ్మకమైనది’ లేదా ‘ఈ ప్రకటన విశ్వసనీయమైనది.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మనం కలిసి మరణించి ఉంటే’; గ్రీకు సంయుక్త క్రియ క్రీస్తుతో కలసి మరణించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆయనతో కలిసి జీవిస్తాం’ అనే భవిష్యత్ రూపం క్రీస్తుతో పునరుత్థాన జీవాన్ని, ఆయన జీవంలో ప్రస్తుత భాగస్వామ్యాన్ని, లేదా రెండింటినీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: నమ్మదగినది
  rationale: λόγος‌ను విశేషించే విధేయ విశేషణం. ఈ ప్రకటన విశ్వసించదగినదని, ఆధారపడదగినదని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వ్యక్తిగత ‘విశ్వాస్యత’ అనే భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: ὁ λόγος
  choice: ఈ మాట
  rationale: ప Pastoral పత్రికల్లో ఇది సంక్షిప్తమైన, జ్ఞాపకంలో నిలిచే ప్రకటనను పరిచయం చేసే సూత్రప్రయోగం. ‘ఈ మాట’ అనేది తెలుగులో సహజంగా ఉండి, వెంట వచ్చే ప్రకటనను సూచిస్తుంది.
- source_word: εἰ γὰρ
  choice: ఎందుకంటే, ... ఉంటే
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, εἰ యొక్క షరతును ‘ఉంటే’తో నిలుపుతుంది.
- source_word: συναπεθάνομεν
  choice: మనం ఆయనతో కలిసి మరణించి ఉంటే
  rationale: సυν- ఉపసర్గ ఉమ్మడి మరణాన్ని సూచిస్తుంది. సందర్భంలో సహభాగి క్రీస్తే కనుక తెలుగులో స్పష్టత కోసం ‘ఆయనతో కలిసి’ అని వ్యక్తం చేయబడింది; భూతకాల సంఘటనతో కూడిన షరతును ‘మరణించి ఉంటే’ సహజంగా అందిస్తుంది.
- source_word: καὶ
  choice: కూడా అనే భావాన్ని రెండవ ‘ఆయనతో కలిసి’ నిర్మాణంలోని సమాంతరత ద్వారా వ్యక్తం చేయడం
  rationale: రెండు భాగాల అనుసంధానాన్ని తెలుగులో పునరుక్త సమాంతర నిర్మాణం సహజంగా తెలియజేస్తుంది. విడిగా ‘కూడా’ చేర్చకపోయినా, ‘మరణం—జీవితం’ జతలోని అనుబంధ భావం స్పష్టంగా ఉంటుంది.
- source_word: συζήσομεν
  choice: ఆయనతో కలిసి జీవిస్తాం
  rationale: భవిష్యత్ క్రియారూపాన్నీ συν- సూచించే సహజీవనాన్నీ స్పష్టంగా నిలుపుతుంది. అది పునరుత్థాన జీవమా, క్రీస్తు జీవంలో భాగస్వామ్యమా, లేక రెండింటినీ సూచిస్తుందా అనే విషయాన్ని అనువాదం తేల్చదు.
theological_decisions:
- issue: συν- సంయుక్త క్రియల్లో అంతర్లీనంగా ఉన్న సహభాగి
  choice: రెండు క్రియల్లోనూ ‘ఆయనతో కలిసి’ అని చేర్చి, ‘ఆయన’ను క్రీస్తుగా సందర్భానుసారంగా సూచించడం.
  alternative: ‘మనం మరణించి ఉంటే, జీవిస్తాం’ అని సహభాగిని అంతర్లీనంగానే ఉంచడం.
  rationale: గ్రీకులో ప్రత్యేక కర్మ లేకపోయినా συν- ఉమ్మడి భాగస్వామ్యాన్ని సూచిస్తుంది; చుట్టుపక్కల ఉన్న క్రీస్తు-కేంద్రిత సందర్భం దాని సూచిత వ్యక్తిని స్పష్టం చేస్తుంది. తెలుగులో భావం కోల్పోకుండా ఉండేందుకు దాన్ని బయటపెట్టడం అవసరం.
- issue: క్రీస్తుతో జీవించడం యొక్క కాలసంబంధమైన, తాత్త్వికమైన పరిధి
  choice: ‘ఆయనతో కలిసి జీవిస్తాం’ అని విస్తృతంగా అనువదించడం.
  alternative: కేవలం భవిష్యత్ పునరుత్థాన జీవంగా లేదా కేవలం ప్రస్తుత ఆధ్యాత్మిక జీవంగా నిర్దిష్టీకరించడం.
  rationale: συζήσομεν భవిష్యత్ రూపం ప్రధానంగా రాబోయే జీవాన్ని సూచించగలదు; అదే సమయంలో క్రీస్తు జీవంలో భాగస్వామ్యమనే విస్తృత భావాన్నీ మోసే అవకాశం ఉంది. మూలపాఠం తేల్చని ఉద్వేగాన్ని అనువాదం కూడా తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మరణించు’ మరియు ‘జీవించు’ అనే సమాంతర పదాలు మూలంలోని గంభీరమైన, సూక్తి-సదృశ లయను నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో పొందుపరచబడ్డాయి.
