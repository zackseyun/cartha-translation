  source_fidelity: 'ముసాయిదా మూలార్థాన్ని ప్రధానంగా సరిగానే తెలియజేస్తుంది: సౌమ్యతతో చేసే దిద్దుబాటు, ఎదిరించే వారు, దేవుడు అనుగ్రహించగల పశ్చాత్తాపం అన్న భావాలు ఉన్నాయి. అయితే గ్రీకు వాక్యంలోని నిరంతర సంబంధాన్ని మధ్యలో పూర్తివిరామం విడదీస్తోంది; అలాగే ‘సత్యాన్ని పూర్తిగా తెలుసుకునేలా’లోని ‘పూర్తిగా’ ἐπίγνωσις యొక్క సూచనను కొంత అతిశయంగా నిర్దిష్టపరుస్తుంది.'
  naturalness: ‘సౌమ్యతతో సరిదిద్దుతూ ఉండాలి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది. ఒకే వాక్యంగా, సెమికోలన్‌తో అనుసంధానిస్తే ముందరి ఆజ్ఞతో μήποτε ఉపవాక్యానికి ఉన్న సంబంధం మరింత స్పష్టంగా, సహజంగా ఉంటుంది.
