review_pass:
  verdict: revise
  source_fidelity: The core exhortation and the deliberate contrast between fleeing and pursuing are retained. However, ἐπικαλουμένων τὸν κύριον is more specifically ‘calling on/invoking the Lord’ than merely praying, and ἐκ καθαρᾶς καρδίας expresses source (‘from/out of’) rather than simply accompaniment (‘with’).
  naturalness: The draft is clear, modern Telugu. ‘యౌవనదశకు చెందిన’ is accurate but slightly formal; it remains acceptable. ‘శుద్ధ హృదయం నుండి’ and ‘ప్రభువును మొరపెట్టుకొనేవారు’ are natural enough in a biblical-register modern Telugu context and better preserve the source wording.
  terminology: ‘నీతి,’ ‘విశ్వాసం,’ ‘ప్రేమ,’ and ‘సమాధానం’ suitably render the virtue list. The alternatives ‘న్యాయం’ and ‘విశ్వసనీయత’ are appropriately retained in footnotes. ‘మొరపెట్టుకొను’ preserves the invocation sense of ἐπικαλέω without adding a denominational interpretation.
  issues:
  - severity: medium
    issue: ‘ప్రభువును ప్రార్థించేవారితో’ narrows ἐπικαλουμένων τὸν κύριον.
    rationale: The Greek means those ‘calling on’ or invoking the Lord. Prayer may be included, but the source expression should not be reduced to that one form of devotion.
  - severity: low
    issue: ‘శుద్ధ హృదయంతో’ renders ἐκ as accompaniment rather than source.
    rationale: ἐκ καθαρᾶς καρδίας means ‘from/out of a pure heart.’ Telugu can express this directly as ‘శుద్ధ హృదయం నుండి.’
  - severity: low
    issue: Footnote a has an awkward singular construction.
    rationale: Because the phrase concerns desires broadly, ‘లైంగిక వాంఛలను మాత్రమే కాదు’ is clearer and grammatically smoother than ‘లైంగిక వాంఛనే కాక.’
  revised_text: అయితే యౌవనదశకు చెందిన కోరికల నుండి పారిపో[a]. శుద్ధ హృదయం నుండి ప్రభువును మొరపెట్టుకొనేవారితో కలిసి నీతిని[b], విశ్వాసాన్ని[c], ప్రేమను, సమాధానాన్ని వెంబడించు.
