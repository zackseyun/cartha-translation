id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: te
  text: అయితే యౌవనదశకు చెందిన కోరికల నుండి పారిపో[a]. శుద్ధ హృదయం నుండి ప్రభువును మొరపెట్టుకొనేవారితో కలిసి నీతిని[b], విశ్వాసాన్ని[c], ప్రేమను, సమాధానాన్ని వెంబడించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యౌవనదశకు చెందిన వాంఛలు.’ గ్రీకు పదబంధం కేవలం లైంగిక వాంఛలను మాత్రమే కాక, యౌవనానికి సహజంగా అనుబంధమైన కోరికలను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘న్యాయం.’ గ్రీకు పదం పౌలు వాడుకలో నైతిక భావంతోపాటు సంబంధపరమైన లేదా న్యాయపరమైన భావఛాయలను కూడా కలిగి ఉండగలదు.
    reason: alternative_reading
  - marker: c
    text: లేదా ‘విశ్వసనీయత.’ గ్రీకు పదం సందర్భానుసారం విశ్వాసం, నమ్మకం లేదా విశ్వసనీయతను సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: యౌవనదశకు చెందిన కోరికలు
  rationale: ఈ పదబంధం యౌవనానికి సహజంగా అనుబంధమైన కోరికలను విస్తృతంగా సూచిస్తుంది; దానిని కేవలం లైంగిక వాంఛలకు పరిమితం చేయదు.
- source_word: φεῦγε
  choice: పారిపో
  rationale: వర్తమాన ఆజ్ఞారూపంలోని బలాన్ని, ప్రమాదం నుండి నిరంతరం దూరంగా ఉండాలనే సజీవ భావాన్ని నిలుపుతుంది.
- source_word: δίωκε
  choice: వెంబడించు
  rationale: నైతిక లక్షణాలను చురుకుగా, నిరంతరంగా సాధించడానికి కృషి చేయడాన్ని తెలియజేస్తూ ‘పారిపో’ అనే ఆజ్ఞకు ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: పౌలు వాడుకలోని నైతిక సదాచార భావాన్ని సహజమైన తెలుగు పదంతో తెలియజేస్తుంది; న్యాయం అనే సంబంధపరమైన లేదా న్యాయపరమైన ఛాయను పాదసూచికలో ఉంచింది.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: πίστιςకు సాధారణమైన, సందర్భానికి తగిన అనువాదం; ‘విశ్వసనీయత’ అనే నైతిక ఛాయ కూడా సాధ్యమని పాదసూచిక తెలుపుతుంది.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπηకి ప్రమాణబద్ధమైన, సందర్భోచితమైన అనువాదం.
- source_word: εἰρήνην
  choice: సమాధానం
  rationale: సద్గుణాల జాబితాలో εἰρήνη సూచించే శాంతి మరియు సామరస్య భావాలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: ప్రభువును ప్రార్థించేవారితో కలిసి
  rationale: μετά తెలిపే సహవాసాన్ని ‘తో కలిసి’ స్పష్టం చేస్తుంది; ἐπικαλέω ఇక్కడ ప్రభువును భక్తితో పిలవడం లేదా వేడుకోవడం అనే భావంలో సహజమైన తెలుగులో ‘ప్రార్థించు’గా ఇవ్వబడింది.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: శుద్ధ హృదయంతో
  rationale: ప్రార్థన ఉద్భవించే అంతరంగ స్వచ్ఛతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని ἐκ సూచించే అంతర్గత మూలభావం సందర్భంలో నిలుస్తుంది.
theological_decisions:
- issue: ‘యౌవనదశకు చెందిన కోరికలు’ అనే పదబంధం పరిధి
  choice: యౌవనానికి సంబంధించిన కోరికలను విస్తృత నైతిక భావంలో ఉంచడం
  alternative: దీనిని ప్రధానంగా లేదా పూర్తిగా లైంగిక వాంఛలుగా అర్థం చేసుకోవడం
  rationale: గ్రీకు పదబంధం లైంగిక వాంఛను చేర్చగలిగినా దానికే పరిమితం కాదు; సందర్భంలోని స్వభావం మరియు ప్రవర్తన గురించిన హెచ్చరిక విస్తృత భావానికి అనుకూలంగా ఉంది.
- issue: δικαιοσύνην యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘నీతి’
  alternative: ‘న్యాయం’
  rationale: ఈ సద్గుణాల జాబితాలో ‘నీతి’ నైతిక భావాన్ని నేరుగా అందిస్తుంది; గ్రీకు పదానికి ఉండగల సంబంధపరమైన లేదా న్యాయపరమైన ‘న్యాయం’ అనే భావాన్ని పాదసూచికలో కాపాడింది.
- issue: πίστιν యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘విశ్వాసం’
  alternative: ‘విశ్వసనీయత’ లేదా ‘నమ్మకత్వం’
  rationale: πίστις విశ్వాసం, నమ్మకం, విశ్వసనీయత అనే భావాలను కలిగి ఉండగలదు. సద్గుణాల జాబితాలో రెండవ భావమూ సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచి సందిగ్ధతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; ఏకవచన ఆజ్ఞారూపాలను నిలిపి, ‘పారిపో—వెంబడించు’ అనే గ్రీకు వాక్యంలోని బలమైన వ్యత్యాసాన్ని కాపాడింది. భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది. మూలపాఠ్యంలో ఒకే వాక్యం ఉన్నప్పటికీ, తెలుగులో స్పష్టత మరియు సహజ పఠనం కోసం దాన్ని రెండు వాక్యాలుగా ఇచ్చింది.
