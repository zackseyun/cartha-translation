revisions:
- from: అయితే యౌవనదశకు చెందిన కోరికల నుండి పారిపో[a]. శుద్ధ హృదయంతో ప్రభువును ప్రార్థించేవారితో కలిసి నీతిని[b], విశ్వాసాన్ని[c], ప్రేమను, సమాధానాన్ని వెంబడించు.
  to: అయితే యౌవనదశకు చెందిన కోరికల నుండి పారిపో[a]. శుద్ధ హృదయం నుండి ప్రభువును మొరపెట్టుకొనేవారితో కలిసి నీతిని[b], విశ్వాసాన్ని[c], ప్రేమను, సమాధానాన్ని వెంబడించు.
  rationale: 'The revision preserves the draft’s faithful rendering of the commands and virtue terms while restoring two source-level nuances: calling on/invoking the Lord rather than only praying, and invocation arising from a pure heart rather than being merely accompanied by one. Footnote wording is lightly smoothed without changing its scope.'
