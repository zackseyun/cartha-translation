source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: te
  text: సిగ్గుపడవలసిన అవసరం లేని పనివానిగా, సత్యవాక్యాన్ని సక్రమంగా నిర్వహించేవానిగా[a] దేవుని ఎదుట ఆమోదం పొందినవానిగా నిన్ను నీవు సమర్పించుకోవడానికి శ్రద్ధగా కృషి చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సత్యవాక్యాన్ని సరిగ్గా బోధించేవానిగా” అని కూడా అనువదించవచ్చు; అక్షరార్థంగా, “సత్యవాక్యాన్ని తిన్నగా కోయడం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: శ్రద్ధగా కృషి చేయి
  rationale: ఈ ఆజ్ఞాపదం earnest effortను సూచిస్తుంది. ‘శ్రద్ధగా కృషి చేయి’ అనేది ఆజ్ఞ బలాన్ని, గంభీరతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: σεαυτόν
  choice: నిన్ను నీవు
  rationale: παραστῆσαι క్రియకు కర్మగా ఉన్న ఆత్మార్థక సర్వనామాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: δόκιμον
  choice: ఆమోదయోగ్యునిగా
  rationale: పరీక్షలో నిలిచి ఆమోదం పొందిన స్థితి అనే భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది; పరీక్ష అనే అంశాన్ని పాఠ్యంలో అవసరానికి మించి విస్తరించదు.
- source_word: παραστῆσαι
  choice: సమర్పించుకోవడానికి
  rationale: తనను దేవుని ఎదుట ఉంచుకోవడం లేదా ఆయన సేవకు సమర్పించుకోవడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘నిలబడడానికి’ కంటే మూలపదంలోని సమర్పణ భావాన్ని విస్తృతంగా ఉంచుతుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: παραστῆσαιతో ఉన్న సంప్రదాన విభక్తిని నేరుగా అనుసరిస్తుంది; దేవుని ఎదుట మూల్యాంకనానికి నిలిచే భావం సందర్భంలో అంతర్లీనంగా ఉంటుంది.
- source_word: ἐργάτην
  choice: పనివానిగా
  rationale: పని చేసే వ్యక్తి అనే రూపకాన్ని సరళంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా నిలుపుతుంది.
- source_word: ἀνεπαίσχυντον
  choice: సిగ్గుపడవలసిన అవసరం లేని
  rationale: కేవలం సిగ్గు అనే భావోద్వేగం కాకుండా, సిగ్గుపడటానికి కారణం లేని నమ్మకమైన స్థితిని వ్యక్తం చేస్తుంది.
- source_word: ὀρθοτομοῦντα
  choice: సరిగ్గా నిర్వహించేవానిగా
  rationale: అక్షరార్థంలోని ‘తిన్నగా కోయడం’ అనే అరుదైన రూపకాన్ని నేరుగా బలవంతంగా పెట్టకుండా, సత్యసందేశాన్ని సరైన రీతిలో వ్యవహరించడం అనే విస్తృత సందర్భార్థాన్ని నిలుపుతుంది. ప్రత్యామ్నాయ భావాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: సత్యవాక్యాన్ని
  rationale: మూలంలోని సమాస సంబంధాన్ని, పౌలు వాడుకలోని ధార్మిక ప్రతిధ్వనిని సంక్షిప్తంగా నిలుపుతుంది; ‘సత్యసందేశం’ అనే వివరణాత్మక అనువాదం కంటే రూపానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: పరిచర్య సందర్భంలో ὀρθοτομοῦντα అనే పదం అర్థం
  choice: సత్యవాక్యాన్ని సరిగ్గా నిర్వహించేవానిగా
  alternative: సత్యవాక్యాన్ని సరిగ్గా బోధించేవానిగా; అక్షరార్థంగా సత్యవాక్యాన్ని తిన్నగా కోసేవానిగా
  rationale: ఈ కృదంతం సువార్త సందేశంతో సరైన విధంగా, ఖచ్చితంగా వ్యవహరించడాన్ని సూచించే అవకాశం ఎక్కువ. దానిని బోధన అనే ఒక్క పరిచర్య కార్యానికే పరిమితం చేయకుండా ప్రధాన పాఠ్యంలో విస్తృత అనువాదాన్ని వాడి, అరుదైన మూలరూపకాన్ని మరియు బోధన అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన శైలి వాడబడింది. మూలంలోని ఆజ్ఞ, పనివాని రూపకం, దేవుని ఆమోదం అనే భావాలు నిలుపబడ్డాయి. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని తెలుగులో సహజ పఠనానికి రెండు వాక్యాలుగా విభజించినా, రెండవ వాక్యం మొదటి ఆజ్ఞలోని ఆశించిన స్థితులను కొనసాగిస్తుంది.
