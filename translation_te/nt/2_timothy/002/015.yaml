- from: దేవునికి ఆమోదయోగ్యునిగా నిన్ను నీవు సమర్పించుకోవడానికి శ్రద్ధగా కృషి చేయి. సిగ్గుపడవలసిన అవసరం లేని పనివానిగా, సత్యవాక్యాన్ని సరిగ్గా నిర్వహించేవానిగా[a] ఉండు.
  to: సిగ్గుపడవలసిన అవసరం లేని పనివానిగా, సత్యవాక్యాన్ని సక్రమంగా నిర్వహించేవానిగా[a] దేవుని ఎదుట ఆమోదం పొందినవానిగా నిన్ను నీవు సమర్పించుకోవడానికి శ్రద్ధగా కృషి చేయి.
