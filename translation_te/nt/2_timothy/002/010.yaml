revisions:
- from: ఈ కారణంగా, ఎంచుకోబడినవారి[a] కోసం నేను అన్నిటినీ సహిస్తున్నాను; వారు కూడా మెస్సీయ[b] యేసులో ఉన్న రక్షణను నిత్య మహిమతో పాటు[c] పొందేలా నేను ఇలా చేస్తున్నాను.
  to: ఈ కారణంగా, ఎంచుకోబడినవారి[a] కోసం నేను అన్నిటినీ సహిస్తున్నాను; వారు కూడా నిత్య మహిమతో కూడిన, మెస్సీయ[b] యేసులో ఉన్న రక్షణను పొందేందుకు.
  rationale: The revision deletes the unsupported explanatory addition and expresses the Greek purpose clause directly. It also places 'eternal glory' with 'salvation,' the most natural reading of the final prepositional phrase, while preserving the alternative attachment in footnote c. Footnote c remains part of the complete footnote set even though its marker is not required in the main text, since it documents the relevant syntactic ambiguity.
