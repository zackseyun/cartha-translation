id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: te
  text: ఈ కారణంగా, ఎంచుకోబడినవారి[a] కోసం నేను అన్నిటినీ సహిస్తున్నాను; వారు కూడా నిత్య మహిమతో కూడిన, మెస్సీయ[b] యేసులో ఉన్న రక్షణను పొందేందుకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎన్నుకోబడినవారి.” గ్రీకు పదం ἐκλεκτούς.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తు యేసు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: ముందున్న సందర్భమే పౌలు సహనానికి కారణమని తెలిపే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάντα ὑπομένω
  choice: నేను అన్నిటినీ సహిస్తున్నాను
  rationale: πάντα యొక్క సమగ్ర భావాన్ని ‘అన్నిటినీ’ నిలుపుతుంది; ὑπομένω కష్టాల కింద స్థిరంగా భరించడాన్ని సూచించేందున ‘సహిస్తున్నాను’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: ఎంచుకోబడినవారి కోసం
  rationale: διά + accusative ఇక్కడ వారి మేలు లేదా నిమిత్తం అనే భావాన్ని ఇస్తుంది. ἐκλεκτούς లోని ఎంపిక భావాన్ని సిద్ధాంతపరంగా విస్తరించకుండా నేరుగా నిలుపుతుంది.
- source_word: ἵνα καὶ αὐτοὶ
  choice: వారు కూడా … పొందేలా
  rationale: ἵνα యొక్క ఉద్దేశ భావాన్ని ‘పొందేలా’ తెలియజేస్తుంది; καί లోని ‘కూడా’ భావాన్ని, αὐτοί సూచించే వ్యక్తులను స్పష్టంగా ఉంచుతుంది.
- source_word: σωτηρίας τύχωσιν
  choice: రక్షణను … పొందేలా
  rationale: τυγχάνω + genitive యొక్క పొందడం లేదా చేరుకోవడం అనే భావానికి ‘పొందడం’ సహజమైన తెలుగు సమానం.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో ఉన్న
  rationale: ఆర్టికల్‌తో కూడిన prepositional phrase ‘రక్షణ’ను విశేషిస్తుంది. ‘లో’ అనే పౌలు వాడే సంబంధ/స్థాన భాషను వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: Χριστῷ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదు యొక్క అర్థబలాన్ని కలిగి ఉంది; అందువల్ల సంప్రదాయ లిప్యంతరీకరణ ‘క్రీస్తు’కు బదులు దాని బిరుదు భావాన్ని తెలిపే ‘మెస్సీయ’ వాడబడింది.
- source_word: μετὰ δόξης αἰωνίου
  choice: నిత్య మహిమతో పాటు
  rationale: μετά + genitive లోని సహవాస లేదా తోడుగా ఉండే భావాన్ని ‘తో పాటు’ స్పష్టంగా తెలుపుతుంది; αἰωνίου యొక్క కాలాతీత/నిత్య భావాన్ని ‘నిత్య’ నిలుపుతుంది.
theological_decisions:
- issue: ἐκλεκτούς పదాన్ని ఎలా అనువదించాలి
  choice: ఎంచుకోబడినవారు
  alternative: ఏర్పరచబడినవారు
  rationale: మూలపదంలో ఉన్న ఎంపిక భావాన్ని తగ్గించకుండా ఉంచుతుంది; అయితే ఎవరు, ఎప్పుడు, ఏ విధంగా ఎంచుకున్నారు అనే సిద్ధాంతవ్యవస్థను వాక్యంలోకి చేర్చదు.
- issue: Χριστῷ ను బిరుదుగా లేదా పేరు భాగంగా చూపడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός యొక్క ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావం సజీవంగా ఉంది. ‘మెస్సీయ’ ఆ భావాన్ని పాఠకునికి ప్రత్యక్షంగా అందిస్తుంది; సంప్రదాయ రూపం అడుగుసూచనలో ఇవ్వబడింది.
- issue: μετὰ δόξης αἰωνίου యొక్క అన్వయం
  choice: రక్షణను పొందడంతో నిత్య మహిమ కూడా తోడుగా ఉంటుందని చూపడం
  alternative: ‘నిత్య మహిమతో కూడిన రక్షణ’గా రక్షణను విశేషించడం
  rationale: గ్రీకు పదక్రమంలో ఈ పదబంధం ‘పొందడం’తోనూ ‘రక్షణ’తోనూ సన్నిహితంగా సంబంధించగలదు. ప్రధాన పాఠం సహచర్య భావాన్ని సహజంగా ఉంచి, ప్రత్యామ్నాయ నిర్మాణాన్ని అడుగుసూచనలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘ఎంచుకోబడినవారు,’ ‘మెస్సీయ,’ ‘రక్షణ,’ ‘నిత్య మహిమ’ వంటి మూలపాఠంలోని వేదాంత బరువు గల పదాలను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతూ, వాక్య ప్రవాహం సహజంగా ఉండేందుకు చివర ‘నేను ఇలా చేస్తున్నాను’ అని ఉద్దేశ సంబంధాన్ని స్పష్టం చేశాం.
