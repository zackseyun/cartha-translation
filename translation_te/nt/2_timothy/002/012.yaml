id: 2TI.2.12
reference: 2 Timothy 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: te
  text: మనం పట్టుదలతో నిలిచివుంటే, ఆయనతో కలిసి రాజ్యమేలుతాం; మనం ఆయనను నిరాకరిస్తే[a], ఆయన కూడా మనలను నిరాకరిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మనం ఆయనను ఎరుగనంటే, ఆయన కూడా మనలను ఎరుగనంటాడు.’
    reason: ἀρνέομαι అనే క్రియలో వ్యక్తితో సంబంధాన్ని ఒప్పుకోకపోవడం లేదా అతణ్ణి ఎరుగననడం అనే భావం కూడా ఉంది; ఈ ప్రత్యామ్నాయం ఆ భావఛాయను చూపుతుంది.
lexical_decisions:
- source_word: ὑπομένομεν
  choice: పట్టుదలతో నిలిచివుంటే
  rationale: ὑπομένω ఇక్కడ శ్రమ లేదా పరీక్ష మధ్య స్థిరంగా కొనసాగడాన్ని సూచిస్తుంది. ‘పట్టుదలతో నిలిచివుండడం’ అనే ప్రయోగం కేవలం భరించడం కంటే ఈ క్రియలోని స్థిరత్వాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: συμβασιλεύσομεν
  choice: ఆయనతో కలిసి రాజ్యమేలుతాం
  rationale: ఈ సంయుక్త క్రియ ‘కలిసి రాజ్యమేలడం’ అనే భావాన్ని ఇస్తుంది. సందర్భం ప్రకారం సహచరుడు క్రీస్తే కాబట్టి తెలుగులో అవసరమైన ‘ఆయనతో’ను స్పష్టంగా చేర్చాం; రాజసంబంధమైన రూపకాన్ని ‘రాజ్యమేలు’ నిలుపుతుంది.
- source_word: ἀρνησόμεθα
  choice: ఆయనను నిరాకరిస్తే
  rationale: ἀρνέομαι అంటే నిరాకరించడం, సంబంధాన్ని ఒప్పుకోకపోవడం లేదా ఎరుగననడం. ‘నిరాకరించు’ గంభీరమైనదిగా, సహజమైనదిగా ఉండి, తరువాతి వాక్యభాగంలోని అదే క్రియను ఒకే పదంతో అనువదించడానికి వీలు కల్పిస్తుంది. గ్రీకులో లేని కర్మను సందర్భం స్పష్టంగా చూపుతున్నందున ‘ఆయనను’ చేర్చాం.
- source_word: κἀκεῖνος
  choice: ఆయన కూడా
  rationale: καὶ ἐκεῖνος అనే సంధిరూపం పరస్పర ప్రతిస్పందనను సూచిస్తుంది. ‘ఆయన కూడా’ సమాంతర నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀρνήσεται ἡμᾶς
  choice: మనలను నిరాకరిస్తాడు
  rationale: మొదటి భాగంలో ఉన్న ἀρνέομαι పదమే ఇక్కడ మళ్లీ వచ్చింది. రెండు చోట్లా ‘నిరాకరించు’ అని అనువదించడం హెచ్చరికలోని ఉద్దేశపూర్వక పదపునరుక్తిని కాపాడుతుంది.
theological_decisions:
- issue: రెండవ షరతు వాక్యంలో హెచ్చరిక స్వభావం
  choice: ‘మనం ఆయనను నిరాకరిస్తే, ఆయన కూడా మనలను నిరాకరిస్తాడు’ అని వాస్తవమైన, తీవ్రమైన హెచ్చరికగా నేరుగా అనువదించాం.
  alternative: దీనిని కేవలం ప్రతిఫలం కోల్పోవడంగా లేదా వాస్తవ సాధ్యత లేని ఊహాత్మక హెచ్చరికగా వివరించడం.
  rationale: గ్రీకు పాఠం సమతూకమైన షరతు వాక్యాలను ఇస్తూ, నిరాకరించడం–నిరాకరించబడడం అనే ఉద్దేశపూర్వక సమాంతరతను నిలుపుతుంది. విశ్వాసభ్రంశం, అంతం వరకు నిలకడ, ప్రతిఫలం వంటి సిద్ధాంత చర్చలను అనువాదంలో ముందే తీర్చకుండా పాఠంలోని తీవ్రతనూ ఉద్రిక్తతనూ యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. ‘రాజ్యమేలుతాం’ రాజసంబంధ రూపకాన్ని నిలుపుతుంది. పాదసూచిక గుర్తును సంబంధిత ‘నిరాకరిస్తే’ పదం వెంట ఉంచాం.
