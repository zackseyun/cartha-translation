id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: te
  text: పెద్ద ఇంటిలో బంగారు, వెండి పాత్రలు మాత్రమే కాకుండా, చెక్కతో, మట్టితో చేసినవి[a] కూడా ఉంటాయి; వాటిలో కొన్ని గౌరవానికి, మరికొన్ని అగౌరవానికి[b] ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మట్టితో చేసినవి’ అంటే కాల్చిన మట్టితో చేసిన కుండల పాత్రలు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘గౌరవప్రదమైన ఉపయోగం కోసం ... అగౌరవకరమైన ఉపయోగం కోసం.’ గ్రీకు పాఠంలో మరింత అక్షరార్థంగా, ‘గౌరవానికి ... అగౌరవానికి’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: పెద్ద ఇంటిలో
  rationale: ఇంటి పరిమాణం లేదా స్థాయిని సూచించే మూలభాషా చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: σκεύη
  choice: పాత్రలు
  rationale: వివిధ పదార్థాలతో చేసిన గృహోపకరణాలు లేదా పాత్రలను సూచించగల విస్తృతమైన, సందర్భోచితమైన పదం.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: బంగారు, వెండి పాత్రలు
  rationale: పాత్రలు ఏ పదార్థంతో చేసినవో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: చెక్కతో, మట్టితో చేసినవి
  rationale: పదార్థ భేదాన్ని స్పష్టంగా చూపిస్తూ, ‘పాత్రలు’ అనే పదాన్ని అనవసరంగా మళ్లీ పలకకుండా సహజమైన సమాంతర నిర్మాణాన్ని ఇస్తుంది.
- source_word: ἃ μὲν ... ἃ δὲ ...
  choice: కొన్ని ... మరికొన్ని ...
  rationale: రెండు వర్గాల మధ్య ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τιμήν ... εἰς ἀτιμίαν
  choice: గౌరవానికి ... అగౌరవానికి
  rationale: మూలంలోని వ్యతిరేక భావనగల నామవాచకాలను నిలుపుతూ, వాటిని కేవలం ఉపయోగపు రకాలుగా ముందుగానే వ్యాఖ్యానించదు.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కొనసాగింపు లేదా మార్పును సూచిస్తుంది; తెలుగులో వాక్య నిర్మాణమే ఆ సంబంధాన్ని సహజంగా మోస్తుంది. ‘అయితే’ అని పెడితే విరోధ భావం అతిగా వినిపించవచ్చు.
theological_decisions:
- issue: τιμή/ἀτιμίαను ఉపయోగపరంగా వ్యాఖ్యానించాలా, లేక గౌరవం/అగౌరవం అనే మూల వ్యతిరేకతను నిలుపాలా
  choice: గౌరవానికి ... అగౌరవానికి
  alternative: గౌరవప్రదమైన ఉపయోగానికి ... అగౌరవకరమైన ఉపయోగానికి
  rationale: ఇంటి పాత్రల రూపకం ఉపయోగాన్ని సూచించగలిగినా, గ్రీకు పాఠం ‘గౌరవం’, ‘అగౌరవం’ అనే భావనాత్మక నామవాచకాలను వాడుతుంది. ప్రధాన పాఠంలో వాటిని నిలపడం తరువాతి వచనంతో ఉన్న ధార్మిక, అలంకారిక ఉద్వేగాన్ని ముందుగానే పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను కోల్పోకుండా అనువదించబడింది. అర్ధవిరామం జాబితా నుంచి పాత్రల గౌరవస్థాయి గురించిన విభజనకు మార్పును స్పష్టంగా చూపుతుంది.
