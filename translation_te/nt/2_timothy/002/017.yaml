- from: వారి మాట[a] గాంగ్రీనులా వ్యాపిస్తుంది.[b] వారిలో హుమెనైయు, ఫిలేతు ఉన్నారు.
  to: వారి మాట[a] గాంగ్రీను వలె వ్యాపిస్తుంది.[b] వారిలో హుమెనయు, ఫిలేతు ఉన్నారు.
