language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: te
  text: వారి మాట[a] గాంగ్రీను వలె వ్యాపిస్తుంది.[b] వారిలో హుమెనయు, ఫిలేతు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు చెప్పేది’ లేదా ‘వారి సందేశం.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘వ్యాపించడానికి స్థలం పొందుతుంది’; గాంగ్రీను రూపకంలో నాశనకరంగా వ్యాపిస్తుందనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: మాట
  rationale: మునుపటి వచనంలోని వ్యర్థమైన, భక్తిహీనమైన సంభాషణ మరియు తరువాతి వచనంలోని తప్పుడు బోధ సందర్భంలో, ఇది వారు చెప్పే మాట లేదా బోధను సూచిస్తుంది. ‘మాట’ సహజమైన తెలుగు పదం; మూలంలోని విస్తృత అర్థాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: αὐτῶν
  choice: వారి
  rationale: λόγος ఎవరికి చెందినదో తెలిపే సాధారణ సంబంధార్థక రూపం.
- source_word: ὡς γάγγραινα
  choice: గాంగ్రీనులా
  rationale: γάγγραινα అనేది శరీర కణజాలాన్ని నాశనం చేస్తూ వ్యాపించే గాంగ్రీను వ్యాధిని సూచిస్తుంది. ‘క్యాన్సరులా’ అనడం కంటే ‘గాంగ్రీనులా’ మూల రూపకానికి మరింత ఖచ్చితమైన సమానం.
- source_word: νομὴν ἕξει
  choice: వ్యాపిస్తుంది
  rationale: ఈ నుడికారం అక్షరార్థంగా వ్యాప్తికి చోటు లేదా మార్గం పొందడాన్ని సూచిస్తుంది; గాంగ్రీను రూపకంలో నాశనకరంగా విస్తరించడం భావం. ‘వ్యాపిస్తుంది’ ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὧν ἐστιν
  choice: వారిలో … ఉన్నారు
  rationale: ముందు ప్రస్తావించిన వారి సమూహంలో నుంచి ఇద్దరిని ఉదాహరణలుగా గుర్తించే భాగార్థక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Ὑμέναιος
  choice: హుమెనైయు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: Φίλητος
  choice: ఫిలేతు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
theological_decisions:
- issue: వ్యాధి రూపకంలోని భావం
  choice: భ్రష్టమైన మాట లేదా బోధ సమాజంలో నాశనకరంగా వ్యాపిస్తుందని తెలిపే రూపకంగా అనువదించడం
  alternative: వ్యాధికి సంబంధించిన పదాలను మరింత అక్షరార్థంగా ఉంచి, రూపక భావాన్ని వివరించకుండా అనువదించడం
  rationale: గాంగ్రీను రూపకం తప్పుడు బోధ కలిగించే విస్తరించే నష్టాన్ని హెచ్చరిస్తుంది. ‘వ్యాపిస్తుంది’ అనే రూపం ఈ హెచ్చరికను నిలుపుతుంది; అయితే మూలంలో లేనంత సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి పాటించబడింది. వైద్య రూపకాన్ని ఖచ్చితంగా నిలుపుతూ ‘గాంగ్రీను’ అనే సుపరిచిత వైద్యపదాన్ని వాడాం. రెండు పాదటిప్పణి సూచికలను అవి వివరించే పదబంధాల వెంటనే ఉంచాం.
