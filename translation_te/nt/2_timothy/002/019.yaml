id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: te
  text: 'అయినప్పటికీ, దేవుని దృఢమైన పునాది నిలిచి ఉంది. దానిపై ఈ ముద్ర[a] ఉంది: “తనకు చెందినవారు ఎవరో ప్రభువుకు తెలుసు”; ఇంకా, “ప్రభువు నామాన్ని పలికే[b] ప్రతి ఒక్కరూ అనీతిని విడిచిపెట్టాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దానిపై ఈ శాసనం ఉంది.” ‘ముద్ర’గా అనువదించిన పదం, ముద్రపై ఉండే గుర్తింపు చిహ్నాన్ని లేదా శాసనాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ప్రభువు నామాన్ని పిలిచే.” గ్రీకులో అక్షరార్థంగా ‘ప్రభువు నామాన్ని పలికే’ అని ఉంది; ఇది ఆయనను ప్రార్థనలో పిలవడం లేదా ఆయనకు విధేయతను ప్రకటించడం అనే భావాన్నిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: అయినప్పటికీ
  rationale: ముందటి వచనాల్లో చెప్పిన తప్పుడు బోధకు విరుద్ధంగా, బలమైన వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: στερεὸς θεμέλιος
  choice: దృఢమైన పునాది
  rationale: స్థిరత్వం, కదలని బలం అనే రూపక భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: మూలంలోని షష్ఠీ సంబంధాన్ని సహజంగా ఉంచుతూ, అది స్వామ్యమా, మూలమా, లక్షణమా అన్నది అనవసరంగా నిర్ధారించదు.
- source_word: ἕστηκεν
  choice: నిలిచి ఉంది
  rationale: గ్రీకు perfect రూపంలోని స్థిరంగా కొనసాగుతున్న స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: దానిపై ఈ ముద్ర ఉంది
  rationale: పునాదిపై గుర్తింపు లేదా ధృవీకరణ ముద్ర ఉన్న రూపకాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; ‘శాసనం’ అనే భావసాధ్యతను పాదసూచికలో ఉంచుతుంది.
- source_word: Ἔγνω
  choice: తెలుసు
  rationale: ఉద్ధరణలోని కాలాతీతమైన, కొనసాగుతున్న దైవిక ఎరుగుదలను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: తనకు చెందినవారు ఎవరో
  rationale: ప్రభువుతో ఉన్న చెందినతనం లేదా స్వామ్య సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἀποστήτω
  choice: విడిచిపెట్టాలి
  rationale: అనీతితో నిర్ణయాత్మకంగా తెగతెంపులు చేసుకోవాలనే ఆజ్ఞార్థక బలాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἀπὸ ἀδικίας
  choice: అనీతిని
  rationale: అన్యాయం అనే పరిమిత భావానికే కుదించకుండా, నైతిక తప్పు మరియు అధర్మ ప్రవర్తన అనే విస్తృత పరిధిని ఉంచుతుంది.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: ప్రభువు నామాన్ని పలికే ప్రతి ఒక్కరూ
  rationale: మూలంలోని ‘నామాన్ని నామకరణం చేయడం/పలకడం’ అనే వాక్యరూప ప్రతిధ్వనిని కొంతవరకు నిలుపుతూ, తెలుగులో అర్థమయ్యేలా ఉంది; ప్రార్థనగా పిలవడం లేదా విధేయతను ప్రకటించడం అనే నుడికార భావాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: రెండు ముద్ర వాక్యాల్లో ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: రెండు చోట్లా ‘ప్రభువు’ అని మాత్రమే అనువదించి, తండ్రినో క్రీస్తునో ప్రత్యేకంగా నిర్ధారించలేదు.
  alternative: రెండింటినీ తండ్రి దేవునిగా భావించడం; రెండింటినీ క్రీస్తుగా భావించడం; రెండు వాక్యాల్లో వేర్వేరు సూచితులను నిర్ణయించడం.
  rationale: గ్రీకు పాఠం κύριος అని మాత్రమే చెబుతుంది. ఇది లేఖన ఉద్ధరణ భాషను క్రైస్తవ సందర్భంలో ఉపయోగిస్తుంది కాబట్టి, పాఠంలో ఉన్న బహుస్థాయి ధార్మిక సూచనను అనువాదం ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘ఎరుగును,’ ‘తొలగిపోవలెను’ వంటి ప్రాచీన క్రియారూపాలను నివారించి, ఉద్ధరణల గౌరవభావాన్ని మాత్రం నిలిపింది. మూలంలోని పునాది, ముద్ర రూపకాలు అలాగే ఉంచబడ్డాయి.
