  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: te
  text: వారు సత్యం విషయంలో గురి తప్పారు[a]; పునరుత్థానం ఇప్పటికే జరిగిపోయిందని చెబుతూ, కొందరి విశ్వాసాన్ని[b] కూలదోస్తున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సత్యం నుండి దారితప్పారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నమ్మకాన్ని.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తలకిందులు చేస్తున్నారు’ లేదా ‘దెబ్బతీస్తున్నారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: వీరు
  rationale: ముందటి వచనంలో ప్రస్తావించిన తప్పుడు బోధకులను సూచించే సంబంధార్థక సర్వనామం. తెలుగులో వాక్యానుసంధానాన్ని సహజంగా కొనసాగించడానికి ‘వీరు’ ఉపయోగించబడింది.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: సత్యం విషయంలో గురి తప్పారు
  rationale: ἀστοχέω అనే పదంలోని ‘గురి తప్పడం’ అనే రూపకాన్ని నిలుపుతూ, περί + ద్వితీయా విభక్తి సూచించే ‘సత్యం విషయంలో’ అనే సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: చెబుతూ
  rationale: వర్తమాన కృదంతం వారి దారితప్పిన బోధనను, అలాగే తరువాత చెప్పిన హానికర ప్రభావంతో దాని సంబంధాన్ని తెలియజేస్తుంది; సాధనం లేదా కాలసంబంధాన్ని అతిగా నిర్ణయించదు.
- source_word: ἀνάστασιν ἤδη γεγονέναι
  choice: పునరుత్థానం ఇప్పటికే జరిగిపోయిందని
  rationale: ἀνάστασις ఈ సందర్భంలో నిర్దిష్టమైన పునరుత్థానాన్ని సూచిస్తుంది. γεγονέναι సంపూర్ణ కృదంతంలోని పూర్తయిన సంఘటన భావాన్ని ‘జరిగిపోయింది’ సహజంగా అందిస్తుంది.
- source_word: ἀνατρέπουσιν
  choice: కూలదోస్తున్నారు
  rationale: వర్తమాన కాలం కొనసాగుతున్న ప్రభావాన్ని చూపుతుంది. ఈ క్రియలోని ‘తలకిందులు చేయడం, ధ్వంసం చేయడం’ భావాన్ని విశ్వాసం సందర్భంలో బలంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τήν τινων πίστιν
  choice: కొందరి విశ్వాసాన్ని
  rationale: τινων యొక్క అనిర్దిష్ట భావాన్ని ‘కొందరి’గా, πίστις యొక్క సాధారణ మరియు తక్కువ వ్యాఖ్యానాత్మకమైన అర్థాన్ని ‘విశ్వాసం’గా అనువదిస్తుంది.
theological_decisions:
- issue: ‘పునరుత్థానం ఇప్పటికే జరిగిపోయింది’ అనే వాదన యొక్క స్వరూపం
  choice: తప్పుడు బోధకులు చేసిన వాదనను ఉన్నదున్నట్లుగా తెలపడం
  alternative: ఇది కేవలం ఆత్మసంబంధమైన పునరుత్థానమని లేదా భవిష్యత్తు శరీర పునరుత్థానాన్ని నిరాకరించడమని స్పష్టీకరించడం
  rationale: ఈ వచనం వారి వాదనను మాత్రమే తెలుపుతుంది; దాని వెనుక ఉన్న పూర్తి సిద్ధాంత వ్యవస్థను వివరించదు. కాబట్టి అనువాదం అదనపు సిద్ధాంత పునర్నిర్మాణాన్ని చేర్చదు.
- issue: πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ఈ సందర్భంలో రెండూ సాధ్యమైనా, ‘విశ్వాసం’ అనేది క్రైస్తవ బోధన సందర్భంలో సహజమైనది మరియు మూలంలోని భావపరిధిని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘గురి తప్పారు’ మూలంలోని రూపకాన్ని నిలుపుతుంది; ‘కూలదోస్తున్నారు’ కొనసాగుతున్న తీవ్రమైన హానిని సహజంగా వ్యక్తం చేస్తుంది. గ్రీకు వాక్యంలో ఒకే సంబంధార్థక నిర్మాణం ఉన్నప్పటికీ, తెలుగు పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా అమర్చబడింది; ‘చెబుతూ’ వాటి వ్యాకరణ, భావ సంబంధాన్ని నిలుపుతుంది.
