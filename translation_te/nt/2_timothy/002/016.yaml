  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: te
  text: అయితే అపవిత్రమైన వ్యర్థమాటలకు దూరంగా ఉండు[a]. ఎందుకంటే, వారు భక్తిహీనతలో ఇంకా ముందుకు సాగుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ‘ముందుకు సాగుతారు’ అనే క్రియకు కర్త స్పష్టంగా చెప్పబడలేదు. సందర్భాన్ని బట్టి, అలాంటి మాటలు మాట్లాడేవారిని లేదా వాటితో సంబంధం కలిగినవారిని ఇది సూచించవచ్చు.
    reason: మూలంలోని సూచిత బహువచన కర్తకు సంబంధించిన అస్పష్టతను కాపాడడం.
lexical_decisions:
- source_word: βεβήλους
  choice: అపవిత్రమైన
  rationale: పవిత్రమైనదానికి విరుద్ధంగా, దేవునిపట్ల గౌరవం లేని స్వభావాన్ని ఈ పదం సూచిస్తుంది. ‘అపవిత్రమైన’ అనే పదం దాని మతపరమైన, నైతిక బలాన్ని నిలుపుతుంది.
- source_word: κενοφωνίας
  choice: వ్యర్థమాటలు
  rationale: అక్షరార్థంగా ‘ఖాళీ శబ్దం/మాట’ అనే భావం. ‘వ్యర్థమాటలు’ అనేది సారమూ ప్రయోజనమూ లేని మాటలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περιΐστασο
  choice: దూరంగా ఉండు
  rationale: మధ్యమ ప్రయోగంలోని ఆజ్ఞ, అలాంటి మాటలను తప్పించుకొని వాటి జోలికి పోకుండా ఉండాలని సూచిస్తుంది. ‘దూరంగా ఉండు’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: ἐπὶ πλεῖον
  choice: ఇంకా
  rationale: మరింత ఎక్కువ స్థాయికి వెళ్లే పురోగతిని సూచిస్తుంది. తరువాతి ‘ముందుకు సాగుతారు’తో కలిపి ‘ఇంకా’ సహజంగా ఈ పెరుగుదలను వ్యక్తం చేస్తుంది.
- source_word: προκόψουσιν
  choice: ముందుకు సాగుతారు
  rationale: ఈ క్రియ పురోగమించడం లేదా ముందుకు వెళ్లడం అని అర్థం. ఇక్కడ పురోగతి ప్రతికూలమైన నైతిక దిశలో ఉన్నప్పటికీ, మూలంలోని వ్యంగ్యభరితమైన ‘పురోగతి’ భావాన్ని నిలుపుతుంది.
- source_word: ἀσεβείας
  choice: భక్తిహీనతలో
  rationale: దేవునిపట్ల భక్తి, గౌరవం లేకపోవడాన్ని సూచిస్తుంది. ‘భక్తిహీనత’ మతపరమైన-నైతిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి ఉపదేశానికి భిన్నమైన హెచ్చరికను ప్రవేశపెడుతుంది. ‘అయితే’ తెలుగులో ఈ వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
theological_decisions:
- issue: ఈ హెచ్చరిక కేవలం పనికిరాని మాటల గురించా, లేక దేవునిపట్ల గౌరవం లేని మాటల గురించా
  choice: ‘అపవిత్రమైన వ్యర్థమాటలు’ అని అనువదించి, వాటి శూన్యతతో పాటు మతపరమైన-నైతిక అపవిత్రతను కూడా నిలిపాము.
  alternative: ‘దైవభక్తి లేని కబుర్లు’ లేదా ‘పనికిరాని వాగుడు’
  rationale: βεβήλους మరియు κενοφωνίας అనే రెండు పదాలు కలసి, మాటల వ్యర్థతను మాత్రమే కాక పవిత్రతకు విరుద్ధమైన స్వభావాన్ని కూడా తెలియజేస్తాయి; తదుపరి ἀσέβεια దీనిని బలపరుస్తుంది.
- issue: προκόψουσιν అనే బహువచన క్రియకు సూచిత కర్త ఎవరు
  choice: తెలుగులో స్పష్టత కోసం ‘వాటిలో పాల్గొనేవారు’ అని వ్యక్తులను సూచించాము.
  alternative: ‘అవి భక్తిహీనతను ఇంకా పెంచుతాయి’ అని మాటలనే కర్తగా తీసుకోవడం
  rationale: గ్రీకు వాక్యంలో κενοφωνίας స్త్రీలింగ బహువచనం కాగా προκόψουσιν వ్యాకరణపరంగా లింగాన్ని తెలియజేయదు; సందర్భంలో అలాంటి మాటలు మాట్లాడేవారు భక్తిహీనతలో ముందుకు సాగుతారనే భావం సహజం. అయినా మూలంలో కర్త ప్రత్యక్షంగా లేకపోవడం వల్ల ఈ స్పష్టీకరణను పాదసూచికలో తెలియజేశాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాము. ‘వ్యర్థమాటలు’ సహజంగా ఉండగా, ‘అపవిత్రమైన’ మరియు ‘భక్తిహీనత’ మూలంలోని మతపరమైన-నైతిక తీవ్రతను కాపాడుతాయి.
