  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: te
  text: చలికాలం రాకముందే రావడానికి శ్రద్ధగా ప్రయత్నించు. యూబులు నీకు వందనాలు చెబుతున్నాడు; అలాగే పూదేను, లీను, క్లౌదియ, సహోదరులందరూ[a] వందనాలు చెబుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహోదర సహోదరీలందరూ’ లేదా ‘విశ్వాసులందరూ.’ గ్రీకులో ‘సహోదరులు’ అని ఉంది; ఈ సందర్భంలో అది స్త్రీపురుషులందరితో కూడిన విశ్వాసుల సమూహాన్ని సూచించవచ్చు.
