  edition: SBLGNT
  text: Τυχικὸν δὲ ἀπέστειλα εἰς Ἔφεσον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: te
  text: అయితే, తుకికును ఎఫెసుకు పంపాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తుకికును ఎఫెసుకు పంపాను’ లేదా ‘ఇక తుకికును ఎఫెసుకు పంపాను’; గ్రీకులోని δέ అనే అనుసంధాన పదం సాధారణ కొనసాగింపును గానీ, స్వల్ప వ్యత్యాసాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: తుకికును
  rationale: ఇది కర్మవిభక్తిలో ఉన్న వ్యక్తి పేరు. ప్రామాణిక తెలుగు లిప్యంతరీకరణ ప్రకారం ‘తుకికు’ అని ఇచ్చి, వాక్యంలో కర్మగా ఉన్నందున ‘తుకికును’ అని రూపాంతరం చేశాం.
- source_word: δὲ
  choice: అయితే
  rationale: δέ మృదువైన వ్యత్యాసాన్ని గానీ, మాట కొనసాగింపును గానీ సూచించగల అనుసంధాన పదం. ముందున్న వాక్యంతో స్వల్ప వ్యత్యాసాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండేందుకు ‘అయితే’ అని అనువదించాం.
- source_word: ἀπέστειλα
  choice: పంపాను
  rationale: ఇది ἀποστέλλω క్రియ యొక్క ఏకవచన ప్రథమ పురుష ఏరిస్ట్ రూపం. గ్రీకు భూతకాల భావాన్ని అదనపు కాలార్థం చేర్చకుండా సహజమైన తెలుగులో ‘పంపాను’ అని ఇచ్చాం.
- source_word: εἰς
  choice: కు
  rationale: పట్టణం గమ్యస్థానంగా ఉన్నందున εἰς అనే ఉపసర్గను తెలుగులో సహజమైన దిశార్థక ‘కు’తో వ్యక్తం చేశాం.
- source_word: Ἔφεσον
  choice: ఎఫెసు
  rationale: ఇది స్థల నామం; ప్రామాణిక తెలుగు రూపంగా ‘ఎఫెసు’ అని లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, సహజంగా, గౌరవప్రదంగా అనువదించాం. ‘అయితే’ ద్వారా δέలోని స్వల్ప వ్యత్యాసాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని ఇతర సాధ్యమైన సంభాషణాత్మక విలువలను పాదటిప్పణిలో పరిరక్షించాం.
