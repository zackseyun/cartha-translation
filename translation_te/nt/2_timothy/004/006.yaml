id: 2TI.4.6
reference: 2 Timothy 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: te
  text: ఎందుకంటే నేను ఇప్పటికే పానార్పణంగా కుమ్మరించబడుతున్నాను[a]; నేను వెళ్లిపోయే సమయం వచ్చింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “నేను ఇప్పటికే కుమ్మరించబడుతున్నాను.” గ్రీకు క్రియ బలిలో పానార్పణాన్ని కుమ్మరించే చిత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేక, “విడుదల” లేదా “విచ్ఛేదం.” ఇక్కడ “వెళ్లిపోవడం” మరణాన్ని సూచించే సహజమైన రూపకం.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: పానార్పణగా కుమ్మరించబడుతున్నాను
  rationale: ఈ క్రియకు బలిలో పానార్పణను కుమ్మరించే భావం ఉంది. పౌలు సమీపిస్తున్న తన మరణాన్ని బలి సంబంధమైన రూపకంతో వర్ణిస్తున్నందున, ఆ చిత్రాన్ని తెలుగులో స్పష్టంగా నిలిపింది.
- source_word: ἤδη
  choice: ఇప్పటికే
  rationale: క్రియ ప్రస్తుతం మొదలైందనే లేదా కొనసాగుతోందనే భావాన్ని తెలిపి, పౌలు మరణం సమీపంలో ఉందనే సందర్భానికి సరిపోతుంది.
- source_word: καιρός
  choice: సమయం
  rationale: ఇక్కడ ఇది సాధారణ కాలాన్ని కాక నిర్ణాయకమైన సందర్భాన్ని సూచిస్తుంది; ‘సమయం’ సహజంగా ఉండి, వాక్యసందర్భంలో ఆ నిర్ణాయక భావాన్ని మోస్తుంది.
- source_word: ἀναλύσεώς
  choice: నిష్క్రమణ
  rationale: ఈ పదానికి వెళ్లిపోవడం, విడుదల, విడిపోవడం వంటి భావాలు ఉండవచ్చు. ఇక్కడ మరణాన్ని సూచించే మర్యాదపూర్వక రూపకంగా ‘నిష్క్రమణ’ సరిపోతుంది; మూలంలోని కొంత అస్పష్టతను కూడా పూర్తిగా తొలగించదు.
- source_word: ἐφέστηκεν
  choice: వచ్చింది
  rationale: పరిపూర్ణ కాలరూపం, ఆ సమయం వచ్చి ఇప్పుడు ఎదురుగా ఉందనే ప్రస్తుత స్థితిని సూచిస్తుంది. ‘వచ్చింది’ ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు తన మరణాన్ని రూపకాలతో వర్ణించడం
  choice: సమీపిస్తున్న మరణాన్ని ‘పానార్పణగా కుమ్మరించబడడం,’ ‘నిష్క్రమణ’ అనే రూపకాలతోనే ఉంచడం
  alternative: సాధారణ బాధను సూచిస్తున్నట్టు అనువదించడం లేదా నేరుగా ‘నేను చనిపోబోతున్నాను’ అని వివరణాత్మకంగా చెప్పడం
  rationale: σπένδομαι, ἀνάλυσις అనే పదాల కలయిక సమీపిస్తున్న మరణాన్ని బలంగా సూచిస్తుంది. అయినా మూలంలోని బలి రూపకాన్ని, మర్యాదపూర్వకమైన ‘వెళ్లిపోవడం’ భావాన్ని వివరణాత్మక అనువాదంతో సమతలం చేయకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘పానార్పణ’ బలి సంబంధమైన మూలరూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘నిష్క్రమణ’ మరణాన్ని నేరుగా వివరిస్తూ రూపకాన్ని తొలగించకుండా కాపాడుతుంది.
