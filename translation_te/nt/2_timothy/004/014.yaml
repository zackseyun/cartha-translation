  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: te
  text: లోహకారుడైన అలెగ్జాండరు నాకు ఎన్నో కీడులు చేశాడు.[a][b] ప్రభువు అతని క్రియలను బట్టి అతనికి ప్రతిఫలం ఇస్తాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాగి లేదా కంచు పనివాడైన అలెగ్జాండరు.’
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో అక్షరార్థంగా, ‘నాకు ఎన్నో చెడులను చూపించాడు’; భావం, ‘నాకు ఎంతో హాని చేశాడు.’
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రతులలో, ‘ప్రభువు అతని క్రియలను బట్టి అతనికి ప్రతిఫలం ఇవ్వుగాక’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: లోహకారుడు
  rationale: ఈ పదం సాధారణంగా రాగి లేదా కంచు వంటి లోహాలతో పనిచేసేవానిని సూచిస్తుంది. ఏ లోహమో అతిగా నిర్దిష్టం చేయకుండా, ఆధునిక తెలుగులో స్పష్టంగా ఉండేందుకు ‘లోహకారుడు’ ఎంచుకోబడింది.
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: నాకు ఎన్నో కీడులు చేశాడు
  rationale: గ్రీకు నుడికారానికి అక్షరార్థం ‘నాకు ఎన్నో చెడులను చూపించాడు’ అయినా, సందర్భంలోని భావం అతడు పౌలుకు అనేక విధాలుగా హాని చేశాడనేది. ‘ఎన్నో కీడులు చేశాడు’ మూలంలోని బహువచన భావాన్ని నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: ἀποδώσει
  choice: ప్రతిఫలం ఇస్తాడు
  rationale: భవిష్యత్ సూచక క్రియారూపాన్ని ప్రకటనగానే నిలిపి, చేసిన దానికి తగిన ఫలాన్ని తిరిగి ఇవ్వడం అనే న్యాయపరమైన భావాన్ని తెలియజేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: నిర్దిష్టమైన దైవసూచక బిరుదుగా సహజమైన ప్రామాణిక తెలుగు రూపం.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: అతని క్రియలను బట్టి
  rationale: అతడు చేసిన క్రియలకు అనుగుణంగా ప్రతిఫలం లభిస్తుందనే మూలార్థాన్ని సంక్షిప్తంగా, ధార్మిక భావాన్ని అతిగా వివరించకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀποδώσειను భవిష్యత్ ప్రకటనగా అనువదించాలా, ప్రార్థన లేదా శాపనార్థక కోరికగా అనువదించాలా
  choice: ప్రభువు ... ప్రతిఫలం ఇస్తాడు
  alternative: ప్రభువు ... ప్రతిఫలం ఇవ్వుగాక
  rationale: ప్రధాన పాఠంలోని ἀποδώσει భవిష్యత్ సూచక రూపం; కాబట్టి ప్రధాన అనువాదం దైవ ప్రతిఫలం గురించిన ప్రకటనగా ఉంది. కొన్ని ప్రతులలోని కోరికను సూచించే రూపం పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘లోహకారుడు’ ఏ ప్రత్యేక లోహాన్నీ అనవసరంగా నిర్ణయించదు; ‘కీడులు చేశాడు’ గ్రీకు నుడికారపు భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది. పాఠాంతరంలోని ప్రకటన–కోరిక భేదం పాదసూచికలో నిలుపబడింది.
