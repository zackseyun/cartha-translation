revisions:
- from: ఇకమీదట నా కోసం నీతి కిరీటం ఉంచబడి ఉంది[a]. నీతిమంతుడైన న్యాయాధిపతి ప్రభువు ఆ రోజున దానిని నాకు బహుమతిగా ఇస్తాడు; నాకు మాత్రమే కాదు, ఆయన ప్రత్యక్షతను ప్రేమించిన వారందరికీ ఇస్తాడు.
  to: ఇకమీదట నా కోసం నీతి కిరీటం భద్రపరచబడి ఉంది[a]. నీతిమంతుడైన న్యాయాధిపతి ప్రభువు ఆ రోజున దానిని నాకు అందజేస్తాడు; నాకు మాత్రమే కాదు, ఆయన ప్రత్యక్షమవడాన్ని ప్రేమించిన వారందరికీ కూడా అందజేస్తాడు.
  rationale: The revision preserves the source’s ambiguity in ‘the crown of righteousness’ and its reference to the Lord, while using more exact Telugu for a crown reserved for Paul and for the Lord’s future awarding of it. It removes the added ‘gift/prize’ implication and improves idiomatic expression of the loved ‘appearing.’
