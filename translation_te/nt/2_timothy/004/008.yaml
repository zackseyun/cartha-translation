id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: te
  text: ఇకమీదట నా కోసం నీతి కిరీటం భద్రపరచబడి ఉంది[a]. నీతిమంతుడైన న్యాయాధిపతి ప్రభువు ఆ రోజున దానిని నాకు అందజేస్తాడు; నాకు మాత్రమే కాదు, ఆయన ప్రత్యక్షమవడాన్ని ప్రేమించిన వారందరికీ కూడా అందజేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయపు కిరీటం.’ గ్రీకు పదానికి ‘నీతి’ అని, కొన్ని సందర్భాల్లో ‘న్యాయం’ అని అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: ఇకమీదట
  rationale: ముందటి వాక్యంలో పౌలు తన పరుగును ముగించినట్లు చెప్పిన నేపథ్యంలో, ఇక తన కోసం మిగిలి ఉన్నదాన్ని సూచించే కాలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπόκειταί
  choice: ఉంచబడి ఉంది
  rationale: ఏదో ఒకటి భవిష్యత్తు కోసం ప్రత్యేకంగా నిల్వ చేయబడి లేదా కేటాయించబడి ఉందనే భావాన్నీ, గ్రీకు వర్తమాన స్థితినీ నిలుపుతుంది.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: నీతి కిరీటం
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని అతిగా వివరిస్తూ, అది నీతికి ఇచ్చే కిరీటమా, నీతియే కిరీటమా, లేక నీతివంతమైన తీర్పుతో సంబంధమున్న కిరీటమా అని నిర్ణయించకుండా ఉంచుతుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: δικαιοσύνηకి ప్రధానమైన పౌలు సంబంధిత అర్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; 'న్యాయం' అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: ἀποδώσει
  choice: బహుమతిగా ఇస్తాడు
  rationale: పందెంలో గెలిచినవారికి కిరీటం ఇచ్చే దృశ్యానికి సరిపోతూ, తగినదాన్ని అందజేయడం అనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ δίκαιος κριτής
  choice: నీతిమంతుడైన న్యాయాధిపతి
  rationale: ప్రభువు తీర్పులో నీతిమంతుడని తెలిపే విశేషణార్థాన్ని, న్యాయనిర్ణేత అనే పాత్రను రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: ప్రేమించిన వారందరికీ
  rationale: గ్రీకు పరిపూర్ణ కాల కృదంతంలోని, గతంలో మొదలై నిలకడగా ఉన్న ప్రేమాభిమానాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἐπιφάνειαν
  choice: ప్రత్యక్షత
  rationale: కేవలం 'రాక' అని సాధారణీకరించకుండా, ప్రత్యక్షమవడం లేదా కనబడడం అనే గ్రీకు పదంలోని భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘నీతి కిరీటం’ అనే పదబంధం అర్థం
  choice: షష్ఠీ విభక్తి పదబంధాన్ని ‘నీతి కిరీటం’గా యథాతథంగా ఉంచడం
  alternative: నీతికి ప్రతిఫలంగా ఇచ్చే కిరీటం; నీతియే అయిన కిరీటం; న్యాయమైన నిర్దోష ప్రకటనకు సంబంధించిన కిరీటం
  rationale: గ్రీకు నిర్మాణం ఈ భావాల్లో ఒక్కదానినే ఖచ్చితంగా నిర్ణయించదు; అందువల్ల మూలంలోని ఉద్దేశపూర్వక విస్తృతిని అనువాదం కాపాడుతుంది.
- issue: ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: పాఠ్యంలో ‘ప్రభువు’ అనే బిరుదునే ఉంచడం; సందర్భానుసారం ఇది యేసు క్రీస్తును సూచిస్తుంది
  alternative: సాధారణంగా దేవుడు
  rationale: ‘ఆయన ప్రత్యక్షత’ అనే సమీప సందర్భం పాస్టరల్ పత్రికల్లో క్రీస్తువైపు బలంగా సూచించినా, మూలంలోని κύριος కంటే విస్తృతమైన పేరును ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘న్యాయాధిపతి,’ ‘ప్రత్యక్షత’ వంటి స్థిరమైన బైబిలు పదాలను సహజ వాక్యనిర్మాణంతో కలిపాం; మూలంలోని భావసందిగ్ధతను అనవసరంగా పరిష్కరించలేదు.
