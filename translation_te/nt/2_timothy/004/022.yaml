  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: te
  text: ప్రభువు నీ ఆత్మతో ఉండుగాక.[a] కృప మీ అందరితో ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ఏకవచనం నుంచి బహువచనానికి మార్పు ఉంది: ‘నీ ఆత్మతో’ (ఏకవచనం) ... ‘మీ అందరితో’ (బహువచనం).'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: పౌలు పత్రిక ముగింపు ఆశీర్వచన సందర్భంలో ఇది సాధారణంగా ప్రభువైన యేసును సూచిస్తుంది. అయితే గ్రీకు మూలంలో ‘యేసు’ అని స్పష్టంగా చేర్చలేదు కాబట్టి, ‘ప్రభువు’ అనే బిరుదునే నిలిపాం.
- source_word: μετὰ
  choice: తోడుగా ఉండుగాక
  rationale: గ్రీకులో క్రియ వ్యక్తంగా లేకపోయినా, ఆశీర్వచన భావాన్ని సహజమైన తెలుగులో తెలియజేయడానికి ‘ఉండుగాక’ను పూరించాం; ‘తోడుగా’ μετά యొక్క సహవాస భావాన్ని అందిస్తుంది.
- source_word: πνεύματός
  choice: ఆత్మకు
  rationale: ‘నీ’ అనే ఏకవచన సంబంధపదం తిమోతికి చెందిన మానవ ఆత్మను సూచిస్తుంది; అందువల్ల పరిశుద్ధాత్మ అని ప్రత్యేకీకరించకుండా ‘ఆత్మ’గా అనువదించాం.
- source_word: σου
  choice: నీ
  rationale: మొదటి వాక్యభాగం తిమోతిని వ్యక్తిగతంగా ఉద్దేశిస్తున్నందున గ్రీకులోని ఏకవచనాన్ని స్పష్టంగా నిలిపాం.
- source_word: χάρις
  choice: కృప
  rationale: పౌలు ఆశీర్వచనాలలో θεολογిక బరువున్న ప్రామాణిక పదంగా ‘కృప’ సహజమైనది; ‘అనుగ్రహం’ సాధ్యమైనా ఇక్కడి సంక్షిప్త ముగింపు సూత్రానికి ‘కృప’ బాగా సరిపోతుంది.
- source_word: ὑμῶν
  choice: మీ అందరికీ
  rationale: రెండవ వాక్యభాగంలోని బహువచనాన్ని స్పష్టంగా చూపించి, ఆశీర్వాదం తిమోతితో పాటు విస్తృత సమూహానికి కూడా వర్తిస్తుందని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ప్రభువు’ అనే పదానికి సూచిత వ్యక్తి
  choice: పౌలు పత్రిక ముగింపు ఆశీర్వచనంలో ప్రభువైన యేసుకు సూచన
  alternative: దేవునికి మరింత సాధారణమైన సూచన
  rationale: పౌలు రచనల ముగింపు ఆశీర్వచన సంప్రదాయంలో ‘ప్రభువు’ సాధారణంగా యేసును సూచిస్తుంది. అయినా మూలపాఠం పేరును చెప్పనందున అనువాదం కూడా ‘యేసు’ అని జోడించకుండా అసలు బిరుదునే ఉంచుతుంది.
- issue: రెండు వాక్యభాగాల మధ్య వచన మార్పు
  choice: మొదట తిమోతికి ఏకవచన సంబోధన; తరువాత సమూహానికి బహువచన ఆశీర్వాదం
  alternative: రెండు వాక్యభాగాలనూ తిమోతికి మాత్రమే ఉద్దేశించినవిగా సహజీకరించడం
  rationale: గ్రీకులో σου ఏకవచనం, ὑμῶν బహువచనం. ఈ సాహిత్యపరమైన మరియు భావపరమైన మార్పును ‘నీ’ మరియు ‘మీ అందరికీ’ ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆశీర్వచన శైలిని వాడాం. ‘ఉండుగాక’ బైబిలు ఆశీర్వచనానికి తగిన గంభీరతను నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యే రూపం. పాదసూచిక గుర్తు [a] సంబంధిత మొదటి వాక్యం తరువాత ఉంచబడింది.
