id: 2TI.4.18
reference: 2 Timothy 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: te
  text: ప్రభువు ప్రతి దుష్ట కార్యం నుండి నన్ను విడిపిస్తాడు; తన పరలోక రాజ్యంలోకి నన్ను క్షేమంగా చేర్చుతాడు.[a][b] ఆయనకు యుగయుగాల వరకు[c] మహిమ కలుగుగాక. ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి చెడు పని నుండి నన్ను రక్షిస్తాడు.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘తన పరలోక రాజ్యంలోకి నన్ను రక్షిస్తాడు.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘యుగాల యుగాల వరకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: విడిపిస్తాడు
  rationale: ῥύομαι ప్రమాదం లేదా కీడు నుండి రక్షించి విడిపించడాన్ని సూచిస్తుంది. ‘విడిపిస్తాడు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, భౌతిక మరణం నుండి తప్పిస్తాడనే భావాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: ప్రతి దుష్ట కార్యం నుండి
  rationale: παντός యొక్క సమగ్ర భావాన్ని ‘ప్రతి’ నిలుపుతుంది; ἔργονకు ‘కార్యం’, πονηρόςకు నైతిక కీడును తెలిపే ‘దుష్ట’ సరిపోతాయి. ఈ పదబంధం కీడు చేసే చర్యనైనా, దుష్ట కార్యం వల్ల కలిగే ముప్పునైనా సందర్భానుసారం సూచించగల విస్తృతిని నిలుపుతుంది.
- source_word: σώσει εἰς
  choice: క్షేమంగా చేర్చుతాడు
  rationale: σῴζωలోని రక్షణ భావాన్ని, εἰςలోని గమ్యం వైపు ప్రవేశ భావాన్ని సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది. ‘లోనికి రక్షిస్తాడు’ అనే అసహజ నిర్మాణాన్ని నివారిస్తుంది.
- source_word: εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: తన పరలోక రాజ్యంలోకి
  rationale: εἰς సూచించే ప్రవేశం లేదా గమ్యాన్ని ‘రాజ్యంలోకి’ నిలుపుతుంది; ἐπουράνιοςను సాధారణ బైబిలు తెలుగులో స్పష్టమైన ‘పరలోక’గా అనువదించింది.
- source_word: ᾧ ἡ δόξα
  choice: ఆయనకు ... మహిమ కలుగుగాక
  rationale: క్రియ లేని గ్రీకు స్తుతి సూత్రంలోని మహిమార్పణ భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగు ఆశీర్వచన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలూ
  rationale: ‘యుగాల యుగాల వరకు’ అనే గ్రీకు నుడికారంలోని నిరంతర కాల భావానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: ఆరాధనా సమ్మతి పదాన్ని తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో ఉంచింది.
theological_decisions:
- issue: ప్రస్తుత విడిపింపు మరియు అంతిమ రక్షణ మధ్య సంబంధం
  choice: దుష్ట కార్యం నుండి ప్రభువు విడిపించడం, పరలోక రాజ్యంలోకి క్షేమంగా చేర్చడం అనే రెండు భావాలను వేరుగా ఉంచింది; పౌలు భౌతిక మరణం నుండి తప్పించబడతాడని చెప్పలేదు.
  alternative: ప్రభువు పౌలును భౌతిక మరణం నుండి తప్పిస్తాడు.
  rationale: ῥύσεταί మరియు σώσει అనే రెండు భవిష్యత్ క్రియలు, ‘తన పరలోక రాజ్యంలోకి’ అనే గమ్యంతో కలిసి, తాత్కాలిక ప్రమాదం నుండి తప్పించడాన్ని మించిన అంతిమ రక్షణ విశ్వాసాన్ని వ్యక్తం చేస్తాయి. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: σώσει యొక్క రక్షణ సంబంధమైన బలం
  choice: ‘క్షేమంగా చేర్చుతాడు’ అని అనువదించి రక్షణతో కూడిన గమ్యప్రాప్తిని తెలిపింది.
  alternative: ‘రక్షిస్తాడు’ అని మాత్రమే అనువదించడం.
  rationale: ‘రక్షిస్తాడు’ అనే పదం σῴζω యొక్క ధార్మిక బలాన్ని నేరుగా నిలిపినా, εἰςతో కూడిన ప్రవేశ భావాన్ని తెలుగులో అసహజంగా చేయవచ్చు. ప్రధాన పాఠం రెండింటినీ సహజంగా కలుపుతుంది; అడుగుసూచన మరింత అక్షరార్థ రూపాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘క్షేమంగా చేర్చుతాడు’ సహజత్వాన్ని కాపాడుతూ σώσει εἰςలోని రక్షణ మరియు ప్రవేశం అనే రెండు అంశాలను కలుపుతుంది. అర్ధవిరామం రెండు సమాంతర భవిష్యత్ కార్యాలను స్పష్టంగా వేరు చేస్తుంది.
