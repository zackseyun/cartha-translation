id: 2TI.4.20
reference: 2 Timothy 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔραστος ἔμεινεν ἐν Κορίνθῳ, Τρόφιμον δὲ ⸀ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: te
  text: ఎరస్తు కొరింథులో ఉండిపోయాడు; అయితే త్రోఫిము అనారోగ్యంతో ఉండగా నేను అతణ్ణి మిలేతులో విడిచిపెట్టాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అనారోగ్యంతో ఉన్న త్రోఫిమును నేను మిలేతులో విడిచిపెట్టాను.’
    reason: ἀσθενοῦντα అనే కృదంతాన్ని తెలుగులో కాలసూచక ఉపవాక్యంగా లేదా త్రోఫిమును విశేషించే పదబంధంగా సహజంగా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: Ἔραστος
  choice: ఎరస్తు
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరపడిన బైబిల్ రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ἔμεινεν
  choice: ఉండిపోయాడు
  rationale: μένω అనే క్రియ ఇక్కడ ఒక ప్రదేశంలో ఉండడం లేదా అక్కడే మిగిలిపోవడం అనే భావాన్ని ఇస్తుంది; ప్రయాణ సందర్భంలో ‘ఉండిపోయాడు’ సహజంగా ఉంది.
- source_word: ἐν Κορίνθῳ
  choice: కొరింథులో
  rationale: ἐν ఇక్కడ నగరాన్ని సూచించే స్థానార్థక ప్రయోగం; ఆధునిక తెలుగులో ‘కొరింథులో’ సహజమైన రూపం.
- source_word: Τρόφιμον
  choice: త్రోఫిము
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరపడిన బైబిల్ రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: δὲ
  choice: అయితే
  rationale: δέ రెండు ప్రయాణ వివరాల మధ్య స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని అతిగా బలపరచకుండా తెలియజేస్తుంది.
- source_word: ἀπέλιπον
  choice: నేను అతణ్ణి … విడిచిపెట్టాను
  rationale: మొదటి పురుష ఏకవచన భూతకాల క్రియను స్పష్టంగా వ్యక్తపరుస్తూ, కర్మను తెలుగులో సహజంగా పునరుద్ఘాటించాం; దీనిలో నిర్లక్ష్యం చేశాడనే భావాన్ని చేర్చలేదు.
- source_word: ἐν Μιλήτῳ
  choice: మిలేతులో
  rationale: నగరంతో కూడిన ἐν స్థానార్థకంగా ఉంది; ‘మిలేతులో’ సహజ తెలుగు ప్రయోగం.
- source_word: ἀσθενοῦντα
  choice: అనారోగ్యంతో ఉండగా
  rationale: వర్తమాన కృదంతం త్రోఫిమును విడిచిన సమయంలో అతని స్థితిని సూచిస్తుంది; సందర్భంలో సాధారణ ‘బలహీనత’ కంటే అనారోగ్యమే తగిన భావం.
theological_decisions:
- issue: అనారోగ్యంతో ఉన్న సహచరుణ్ణి పౌలు విడిచిపెట్టినట్టు చెప్పే వాక్యంలోని ఉద్రిక్తత
  choice: మూలంలో ఉన్నట్లుగానే త్రోఫిము అనారోగ్యంతో ఉండగా పౌలు అతణ్ణి మిలేతులో విడిచిపెట్టాడని అనువదించాం.
  alternative: పౌలు అతణ్ణి సంరక్షణలో ఉంచాడని లేదా స్వస్థపరచలేకపోయాడని వివరణాత్మకంగా చెప్పడం.
  rationale: మూల వాక్యం కారణాన్నిగానీ, స్వస్థత గురించి సిద్ధాంతపరమైన వివరణనుగానీ ఇవ్వదు; కాబట్టి అలాంటి భావాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. రెండు ప్రయాణ వివరాల మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని అర్ధవిరామం మరియు ‘అయితే’తో చూపించాం.
