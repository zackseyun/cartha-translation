  source_fidelity: 'మూల గ్రీకు వాక్యంలోని రెండు ప్రయాణ-వివరాలను కచ్చితంగా ప్రతిబింబిస్తుంది: ఎరస్తు కొరింథులో మిగిలి ఉండటం, పౌలు త్రోఫిమును అనారోగ్యస్థితిలో మిలేతులో విడిచిపెట్టడం. ἀσθενοῦντα యొక్క వర్తమాన కృదంత భావాన్ని ‘అనారోగ్యంతో ఉండగా’ సహజంగా, కాలసంబంధితంగా తెలియజేస్తుంది; మూలంలో లేని కారణం లేదా సిద్ధాంతపరమైన వివరణను చేర్చదు.'
