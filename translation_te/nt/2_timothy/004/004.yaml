revisions:
- from: వారు సత్యం నుండి తమ వినికిడిని తిప్పుకొని, కట్టుకథల వైపు మళ్లిపోతారు.[a]
  to: వారు సత్యం నుండి తమ వినికిడిని తిప్పివేసి,[a] కట్టుకథల వైపు మళ్లిపోతారు.[b]
  rationale: The revision retains the source text’s active metaphor and directional contrast while improving Telugu idiom. It does not narrow ‘the truth’ to a doctrinal formula or resolve the middle/passive nuance of ἐκτραπήσονται beyond the natural Telugu intransitive ‘మళ్లిపోతారు.’ Separate anchors clarify the two independent lexical alternatives.
