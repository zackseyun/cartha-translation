id: 2TI.4.4
reference: 2 Timothy 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: te
  text: వారు సత్యం నుండి తమ వినికిడిని తిప్పివేసి,[a] కట్టుకథల వైపు మళ్లిపోతారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ చెవులను”; గ్రీకు పదానికి అక్షరార్థం “వినికిడి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కల్పిత కథలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: సత్యం
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, తెలుగులో ‘సత్యం’ సహజంగానే సందర్భంలో తెలిసిన సత్యాన్ని సూచిస్తుంది; దాన్ని ‘సువార్త సత్యం’ లేదా ‘సరైన బోధ’ అని సంకుచితం చేయలేదు.
- source_word: ἀκοὴν
  choice: తమ వినికిడిని
  rationale: ఈ పదం వినడం అనే క్రియను లేదా వినే సామర్థ్యాన్ని సూచించగలదు. ‘వినికిడి’ మూలంలోని రూపకాన్ని నిలుపుతుంది; సహజమైన ప్రత్యామ్నాయమైన ‘చెవులను’ పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἀποστρέψουσιν
  choice: తిప్పుకొని
  rationale: సత్యం నుండి ఉద్దేశపూర్వకంగా దూరంగా తిప్పుకునే క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: μύθους
  choice: కట్టుకథలు
  rationale: ‘కట్టుకథలు’ కల్పితమైన లేదా ఆధారంలేని కథనాల భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘పురాణాలు’ అనే పదం కలిగించగల ప్రత్యేక మతసాంస్కృతిక అర్థాన్ని నివారిస్తుంది.
- source_word: ἐκτραπήσονται
  choice: మళ్లిపోతారు
  rationale: మధ్యమ/కర్మణి రూపంలోని కర్తృత్వ అస్పష్టతను అతిగా నిర్ణయించకుండా, దారి తప్పి మరో వైపుకు మళ్లే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: నుండి ... వైపు
  rationale: మూలంలోని దిశాత్మక వ్యత్యాసాన్ని—సత్యం నుండి దూరమై కట్టుకథల వైపు వెళ్లడాన్ని—సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘సత్యం’ యొక్క సందర్భార్థం
  choice: సత్యం
  alternative: సరైన బోధ; సువార్త సత్యం
  rationale: సందర్భం అపొస్తల బోధను సూచించినప్పటికీ, మూలపాఠం విస్తృతమైన ἀλήθεια అనే పదాన్నే వాడుతుంది. అందువల్ల భావాన్ని ఒక నిర్దిష్ట సిద్ధాంత పదబంధంగా సంకుచితం చేయలేదు.
- issue: ἐκτραπήσονται లో కర్తృత్వం
  choice: మళ్లిపోతారు
  alternative: మళ్లించబడతారు
  rationale: గ్రీకు రూపం మధ్యమ లేదా కర్మణి భావానికి వీలు ఇస్తుంది. తెలుగు అకర్మక రూపం ఎవరు వారిని మళ్లిస్తారో నిర్ణయించకుండా అస్పష్టతను చాలావరకు కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘తమ వినికిడిని తిప్పుకొని’ అనే నిర్మాణం సాధారణ సంభాషణ కంటే కొద్దిగా మూలానుసారమైనదైనా, గ్రీకు రూపకాన్ని స్పష్టంగా నిలుపుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
