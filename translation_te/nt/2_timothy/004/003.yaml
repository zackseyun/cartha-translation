reference: 2 Timothy 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: te
  text: ఎందుకంటే వారు స్వస్థమైన బోధనను[a] సహించని కాలం వస్తుంది. దానికి బదులుగా, తమ సొంత కోరికలకు అనుగుణంగా తమకోసం బోధకులను పోగుచేసుకుంటారు, చెవులు దురదపెడుతుండగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్వస్థమైన ఉపదేశాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వినికిడిలో దురద కలుగుతుండగా.’ తమకు నచ్చిన మాటలనే వినాలనే తీరని కోరికను ఈ రూపకం వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: కాలం
  rationale: రాబోయే ఒక సందర్భాన్ని లేదా కాలావధిని సూచిస్తుంది; తెలుగు వాక్యంలో ‘కాలం వస్తుంది’ సహజంగా ఉంది.
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: ఆరోగ్యకరమైన బోధ
  rationale: ‘ఆరోగ్యంగా ఉండే’ అనే గ్రీకు రూపకాన్ని నిలుపుతూ, సరైనదీ క్షేమకరమైనదీ అయిన బోధను సూచిస్తుంది.
- source_word: οὐκ ἀνέξονται
  choice: సహించని
  rationale: భరించడానికి లేదా అంగీకరించి కొనసాగడానికి నిరాకరించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: తమ సొంత కోరికలకు అనుగుణంగా
  rationale: లైంగిక కోరికలకే పరిమితం చేయకుండా, తమకు నచ్చినదాన్ని కోరే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἑαυτοῖς
  choice: తమకోసం
  rationale: ఈ చర్యను వారు తమ ప్రయోజనం కోసం చేసుకుంటారనే ఆత్మవాచక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐπισωρεύσουσιν
  choice: పోగుచేసుకుంటారు
  rationale: అధిక సంఖ్యలో కూడబెట్టుకోవడం అనే సజీవమైన భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: διδασκάλους
  choice: బోధకులను
  rationale: సందర్భానికి తగిన సాధారణ అర్థం; ప్రత్యేక మతపరమైన హోదాను సూచించదు.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: వారి చెవులు దురదపెడుతుంటాయి
  rationale: గ్రీకులోని సజీవమైన రూపకాన్ని నిలుపుతుంది. సెమికోలన్ ద్వారా దీనికి ప్రధాన క్రియతో ఉన్న సంబంధాన్ని చూపించినా, దానిని కేవలం కారణార్థకంగా నిర్ణయించదు.
theological_decisions:
- issue: διδασκαλία పదాన్ని పాస్టరల్ పత్రికల సందర్భంలో అనువదించడం
  choice: బోధ
  alternative: సిద్ధాంతం / ఉపదేశం
  rationale: ఇక్కడ అపొస్తలీయ బోధను తిరస్కరించడం ప్రధానాంశమైనా, గ్రీకు పదానికి తప్పనిసరిగా సాంకేతికమైన లేదా వర్గపరమైన అర్థం ఇవ్వాల్సిన అవసరం లేదు. ‘బోధ’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- issue: κνηθόμενοι τὴν ἀκοήν అనే కృదంత పదబంధం యొక్క సంబంధం
  choice: వారి చెవులు దురదపెడుతుంటాయి
  alternative: చెవులు దురదపెడుతున్నందువల్ల
  rationale: గ్రీకు కృదంతం కారణాన్ని సూచించవచ్చు; అయితే దాన్ని స్పష్టమైన కారణార్థక వాక్యంగా మార్చకుండా, అసలు వాక్యంలోని సంబంధ అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఆరోగ్యకరమైన బోధ’ మరియు ‘చెవులు దురదపెడుతుంటాయి’ అనే రూపకాలను ఉద్దేశపూర్వకంగా నిలిపి, పాదసూచికలలో వాటి భావాన్ని వివరించాం.
