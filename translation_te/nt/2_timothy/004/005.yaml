id: 2TI.4.5
reference: 2 Timothy 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: te
  text: అయితే నీవు మాత్రం అన్ని విషయాల్లో స్పష్టబుద్ధితో ఉండు[a]; కష్టాన్ని సహించు[b]; సువార్తికుని పని చేయి; నీ పరిచర్యను సంపూర్ణంగా నిర్వర్తించు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెలకువగా ఉండు,” “స్థిరబుద్ధితో ఉండు.” గ్రీకు క్రియకు అక్షరార్థంగా మద్యం మత్తు లేకుండా ఉండడం అనే భావం ఉన్నా, కొత్త నిబంధనలో అది రూపకంగా మనస్సు స్పష్టంగా, అదుపులో, ఒత్తిడిలో స్థిరంగా ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కష్టం అనుభవించు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నీ పరిచర్యను పూర్తిగా నెరవేర్చు.” గ్రీకు క్రియ అప్పగించబడిన పనిని సంపూర్ణంగా ముగించడం లేదా పూర్తిగా నిర్వహించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: అయితే నీవు మాత్రం
  rationale: δέ చూపే పూర్వసందర్భ విరుద్ధతను, స్పష్టంగా ఉంచిన σὺ ఇచ్చే వ్యక్తిగత నొక్కింపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: νῆφε
  choice: స్థిరబుద్ధితో ఉండు
  rationale: ఇక్కడ క్రియ అక్షరార్థమైన మద్యవిరమణను కాకుండా, ఒత్తిడిలో మనస్సు స్పష్టంగా, స్వాధీనంలో, స్థిరంగా ఉంచుకోవడాన్ని రూపకాలంకారంగా సూచిస్తుంది.
- source_word: ἐν πᾶσιν
  choice: అన్ని విషయాల్లో
  rationale: ఈ పదబంధం νῆφεను విశేషిస్తూ, ఆ మనోస్థైర్యం సమస్త విషయాలకు వర్తిస్తుందని తెలియజేస్తుంది; పరిస్థితులా, సందర్భాలా అనే దానిని అనవసరంగా పరిమితం చేయదు.
- source_word: κακοπάθησον
  choice: కష్టాన్ని సహించు
  rationale: కష్టాన్ని కేవలం అనుభవించడం మాత్రమే కాక దానిలో నిలకడగా ఉండాలనే ఆజ్ఞాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: ἔργον ποίησον
  choice: పని చేయి
  rationale: గ్రీకు భాషలోని సహజ క్రియాసమాసాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εὐαγγελιστοῦ
  choice: సువార్తికుని
  rationale: సువార్తను ప్రకటించే వ్యక్తిని సూచించే పాత్రనామాన్ని సంక్షిప్తంగా నిలుపుతుంది; ఒక నిర్దిష్ట సంస్థాగత హోదాను అదనంగా రుద్దదు.
- source_word: τὴν διακονίαν σου
  choice: నీ పరిచర్యను
  rationale: సాధారణ సేవ అనే విస్తృత భావం సాధ్యమైనప్పటికీ, సమీప సందర్భంలోని తిమోతి బాధ్యతలు, సువార్త పని దృష్ట్యా ‘పరిచర్య’ సందర్భానుకూలం.
- source_word: πληροφόρησον
  choice: సంపూర్ణంగా నిర్వర్తించు
  rationale: అప్పగించబడిన పరిచర్యను పూర్తి పరిమాణంలో నిర్వహించి ముగించాలనే క్రియ యొక్క బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: διακονίαలో తిమోతి బాధ్యత స్వరూపం
  choice: పరిచర్య
  alternative: సేవ
  rationale: సమీప సందర్భం తిమోతి అప్పగించబడిన సువార్త ప్రకటన, బోధనా బాధ్యతలను ఉద్దేశిస్తుంది. అందువల్ల ‘పరిచర్య’ సందర్భానికి తగినది; ఇది ఏ ప్రత్యేక సంఘవ్యవస్థను లేదా పదవిని పాఠ్యంలోకి చేర్చదు.
- issue: εὐαγγελιστοῦ పాత్ర స్వరూపం
  choice: సువార్తికుడు
  alternative: సువార్త ప్రకటించే వ్యక్తి
  rationale: మూలంలోని పాత్రనామాన్ని నిలుపుతూ, దాన్ని నిర్దిష్ట ఆధునిక పదవి లేదా సంఘ హోదాగా నిర్వచించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో వ్యక్తిగతమైనప్పటికీ గౌరవప్రదమైన ‘నీవు’ రూపం వాడబడింది. వరుస ఆజ్ఞల సంక్షిప్తతను సెమీకోలన్‌లతో నిలిపి, పాస్టరల్ గంభీరతను కాపాడాం. సంప్రదాయపరంగా అర్థంకాగల ‘సువార్తికుడు,’ ‘పరిచర్య’ పదాలను ఉంచి, సందిగ్ధత ఉన్న చోట పాదటిప్పణుల్లో సహజ ప్రత్యామ్నాయాలు ఇచ్చాం.
