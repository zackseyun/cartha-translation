translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వ్యక్తిగత ఆదేశానికి తగిన సహజమైన ఏకవచన సంబోధన వాడబడింది. వస్తువుల జాబితాను స్పష్టంగా చూపేందుకు రెండవ వాక్యంగా విభజించినప్పటికీ, మూలంలోని ‘కూడా’ అనే సమన్వయ భావం నిలుపబడింది. ‘త్రోయ’ మరియు ‘కార్పు’ రూపాలు తెలుగు బైబిలు పేర్లకు అనుకూలంగా ఉన్నాయి.
