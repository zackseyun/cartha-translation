source:
  edition: SBLGNT
  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: te
  text: నువ్వు వచ్చేటప్పుడు, నేను త్రోయలో కార్పు దగ్గర వదిలివచ్చిన పైవస్త్రాన్ని[a] తీసుకురా. పుస్తకాలను[b], ముఖ్యంగా చర్మపత్రాలను కూడా తీసుకురా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పైవస్త్రం’ అనే పదాన్ని కొందరు పుస్తకాల సంచి లేదా తొడుగు అని అర్థం చేసుకుంటారు; అయితే గ్రీకు పదానికి సాధారణ అర్థం దుస్తుల మీద వేసుకునే వస్త్రం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘గ్రంథపు చుట్టలు’; గ్రీకు పదం రాతచుట్టలను లేదా ఇలాంటి లిఖిత సామగ్రిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: పైవస్త్రం
  rationale: ఈ పదం సాధారణంగా దుస్తుల మీద వేసుకునే వస్త్రాన్ని సూచిస్తుంది. పుస్తకాల సంచి లేదా తొడుగు అనే అభిప్రాయం ఉన్నప్పటికీ, ప్రధాన నిఘంటు ఆధారం బయటి వస్త్రానికే అనుకూలంగా ఉంది.
- source_word: ἀπέλιπον
  choice: వదిలివచ్చిన
  rationale: ἀπολείπω అనే క్రియ యొక్క భూతకాల ఏకవచన రూపం. సందర్భంలో ఒక చోట వస్తువును వదిలి వచ్చిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παρὰ Κάρπῳ
  choice: కార్పు దగ్గర
  rationale: παράతో చతుర్థీ విభక్తి ఇక్కడ కార్పు వద్ద లేదా అతని సంరక్షణలో ఉంచిన స్థానార్థాన్ని సూచిస్తుంది.
- source_word: ἐρχόμενος
  choice: నువ్వు వచ్చేటప్పుడు
  rationale: ఈ కృదంతం φέρε అనే ఆజ్ఞతో కాలసంబంధాన్ని కలిగి ఉంది; తెలుగులో ఈ రూపం సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: φέρε
  choice: తీసుకురా
  rationale: తిమోతి ఆ వస్తువులను పౌలు వద్దకు తీసుకురావాలనే ఆజ్ఞను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὰ βιβλία
  choice: పుస్తకాలు
  rationale: βιβλία అనేది పుస్తకాలు, గ్రంథాలు లేదా చుట్టలను సూచించగల విస్తృత పదం. ప్రధాన పాఠ్యంలో సాధారణమైన ‘పుస్తకాలు’ ఉంచి, భౌతిక రూపంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: μάλιστα
  choice: ముఖ్యంగా
  rationale: తరువాత పేర్కొన్న వాటికి ప్రత్యేక ప్రాధాన్యం ఇస్తుంది.
- source_word: τὰς μεμβράνας
  choice: చర్మపత్రాలు
  rationale: రాయడానికి సిద్ధం చేసిన జంతుచర్మపు పత్రాలను సూచించే ఖచ్చితమైన, అర్థవంతమైన తెలుగు పదం.
