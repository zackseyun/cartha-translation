  naturalness: ప్రస్తుత యుగాన్ని, గలతీయకు, దల్మతీయకు వంటి రూపాలు ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. చివరి భాగంలోని సమష్టి ‘వెళ్లారు’ వ్యాకరణపరంగా సాధ్యమే, కానీ రెండు వ్యక్తులకు వారి వారి గమ్యస్థానాలను స్పష్టంగా చెప్పే విడివిడి క్రియలు మరింత సహజం మరియు నిర్ద్వంద్వం.
  terminology: ‘ప్రస్తుత యుగం’ αἰών యొక్క కాలపరమైన అర్థాన్ని చక్కగా కాపాడుతుంది. ‘నన్ను విడిచిపెట్టాడు’ ἐγκατέλιπενలోని తీవ్రమైన, వ్యక్తిగతంగా వదిలివేసిన భావాన్ని అందిస్తుంది; ఇది విశ్వాసభ్రష్టత్వాన్ని నేరుగా ఆరోపించదు. పేర్లు మరియు ప్రాంతనామాల ప్రస్తుత లిప్యంతరీకరణలు అనుకూలంగా ఉన్నాయి.
