id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: te
  text: ఎందుకంటే దేమా ప్రస్తుత యుగాన్ని[a] ప్రేమించి నన్ను విడిచిపెట్టాడు; అతడు థెస్సలొనీకకు వెళ్లాడు. క్రెస్కే గలతీయకు వెళ్లాడు, తీతు దల్మతీయకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ప్రస్తుత లోకాన్ని.” గ్రీకులోని పదం మరింత అక్షరార్థంగా ప్రస్తుత యుగాన్ని లేదా కాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భంలో పౌలు చేసిన అభ్యర్థనకు ఈ వాక్యం కారణాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ఈ అనుసంధాన పదం సహజంగా ఉంది.
- source_word: ἐγκατέλιπεν
  choice: నన్ను విడిచిపెట్టి
  rationale: ఈ క్రియలో కేవలం వెళ్లిపోవడం కంటే, అవసర సమయంలో ఒకరిని వదిలివేయడమనే ప్రతికూల భావం ఉంది. అయితే దేమా విశ్వాసాన్నే త్యజించాడని వాక్యం చెప్పని విషయాన్ని అనువాదం జోడించదు.
- source_word: ἀγαπήσας
  choice: ప్రేమించి
  rationale: గ్రీకు భూతకాల క్రియావిశేషణ రూపాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియతో చూపిస్తూ, దేమా ప్రేమకూ అతని విడిచిపోవడానికీ ఉన్న సంబంధాన్ని ఉంచుతుంది; దానిని స్పష్టంగా కారణార్థకంగా మాత్రమే నిర్ణయించదు.
- source_word: τὸν νῦν αἰῶνα
  choice: ప్రస్తుత యుగాన్ని
  rationale: αἰών ప్రధానంగా కాలం లేదా యుగాన్ని సూచిస్తుంది. అందువల్ల భౌతిక సృష్టిని సూచించేలా ఉండే ‘లోకం’ కంటే ‘యుగం’ మూలంలోని కాలపరమైన, నైతిక భావాన్ని మెరుగ్గా కాపాడుతుంది.
- source_word: ἐπορεύθη
  choice: వెళ్లాడు
  rationale: గమ్యస్థానానికి వెళ్లడాన్ని తెలిపే సరళమైన క్రియ; ప్రయాణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: Θεσσαλονίκην
  choice: థెస్సలొనీక
  rationale: గ్రీకు స్థలనామానికి తెలుగులో స్పష్టమైన లిప్యంతరీకరణ.
- source_word: Κρήσκης
  choice: క్రెస్కే
  rationale: గ్రీకు వ్యక్తినామానికి మూల ఉచ్చారణను దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: Γαλατίαν
  choice: గలతీయ
  rationale: గ్రీకు ప్రాంతనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపం.
- source_word: Τίτος
  choice: తీతు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపం.
- source_word: Δαλματίαν
  choice: దల్మతీయ
  rationale: గ్రీకు ప్రాంతనామానికి మూలరూపాన్ని దగ్గరగా అనుసరించే తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: దేమా వెళ్లిపోవడాన్ని విశ్వాసభ్రష్టత్వంగా చెప్పాలా, లేక పౌలును విడిచిపోవడంగా మాత్రమే చెప్పాలా
  choice: నైతికంగా ప్రతికూలమైన ‘నన్ను విడిచిపెట్టి’ అని అనువదించబడింది; దేమా విశ్వాసాన్ని పూర్తిగా త్యజించాడని స్పష్టంగా చెప్పలేదు.
  alternative: విశ్వాసభ్రష్టత్వాన్ని నేరుగా సూచించే మరింత బలమైన వ్యాఖ్యానాత్మక అనువాదం.
  rationale: వాక్యం దేమా ప్రస్తుత యుగాన్ని ప్రేమించి పౌలును విడిచిపెట్టాడని చెబుతుంది; అతని అంతిమ ఆత్మీయ స్థితిని స్పష్టంగా నిర్వచించదు. అందువల్ల మూలంలోని నైతిక తీవ్రతను ఉంచుతూ సిద్ధాంతపరమైన అతివ్యాఖ్యానాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. చివరి రెండు గమ్యస్థానాల విషయంలో గ్రీకులో క్రియ లోపించినా, తెలుగులో స్పష్టత కోసం ‘వెళ్లారు’ అని ఒకసారి పూరించబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘ప్రస్తుత యుగాన్ని’ అనే పదబంధం వెంట ఉంచబడింది.
