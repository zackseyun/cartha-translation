  to: ఎందుకంటే దేమా ప్రస్తుత యుగాన్ని[a] ప్రేమించి నన్ను విడిచిపెట్టాడు; అతడు థెస్సలొనీకకు వెళ్లాడు. క్రెస్కే గలతీయకు వెళ్లాడు, తీతు దల్మతీయకు వెళ్లాడు.
