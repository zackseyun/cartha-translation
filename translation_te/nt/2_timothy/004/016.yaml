  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: te
  text: నా మొదటి న్యాయపరమైన సమర్థనలో[a] నాకు మద్దతుగా ఎవరూ హాజరు కాలేదు[b]; అందరూ నన్ను విడిచిపెట్టారు. అది వారికి వ్యతిరేకంగా లెక్కించబడకపోవుగాక[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా మొదటి విచారణ సమయంలో’; లేదా ‘నా మొదటి న్యాయపరమైన వాదనలో.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘నాతో ఉండడానికి ఎవరూ వచ్చి హాజరు కాలేదు’; భావం ఏమిటంటే, పౌలుకు మద్దతుగా ఎవరూ హాజరు కాలేదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అది వారిపై మోపబడకపోవుగాక.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: నా తరఫున వాదించుకున్నప్పుడు
  rationale: ఇది సాధారణ వివరణను కాక, అధికారుల ఎదుట చేసే అధికారిక లేదా న్యాయపరమైన సమర్థనను సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా క్రియారూపంలో అనువదించబడింది.
- source_word: πρώτῃ
  choice: మొదటిసారి
  rationale: పౌలు చేసిన సమర్థనలో మొదటి సందర్భాన్ని లేదా మొదటి దశను నేరుగా సూచిస్తుంది.
- source_word: οὐδείς μοι παρεγένετο
  choice: నాకు మద్దతుగా ఎవరూ హాజరు కాలేదు
  rationale: παρεγένετο అక్షరార్థంగా వచ్చి సమక్షంలో ఉండడాన్ని సూచించినా, ఇక్కడ పౌలుకు అనుకూలంగా హాజరై అండగా నిలవడమే భావం. ‘మద్దతుగా’ సందర్భంలోని సంఘీభావాన్ని, ‘హాజరు కాలేదు’ క్రియ యొక్క సమక్షత భావాన్ని నిలుపుతాయి.
- source_word: ἐγκατέλιπον
  choice: విడిచిపెట్టారు
  rationale: కష్టమైన లేదా ప్రమాదకరమైన పరిస్థితిలో ఒకరిని ఒంటరిగా వదిలివేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉంది.
- source_word: μὴ αὐτοῖς λογισθείη
  choice: అది వారికి వ్యతిరేకంగా లెక్కించబడకపోవుగాక
  rationale: μήతో కూడిన ఆప్టేటివ్ రూపం ప్రార్థనాత్మకమైన కోరికను వ్యక్తం చేస్తుంది. ‘అది’ అనేది వారు పౌలును విడిచిపెట్టిన చర్యను సహజంగా సూచిస్తుంది; ‘లెక్కించబడకపోవుగాక’ లెక్కింపు/న్యాయపరమైన రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: పౌలును విడిచిపెట్టినవారి గురించి చివరి వాక్యంలోని స్వరం
  choice: వారి అపరాధంగా అది లెక్కించబడకూడదనే ప్రార్థనాత్మక కోరిక
  alternative: ‘అది వారికి వ్యతిరేకంగా లెక్కించబడనివ్వకండి’ అనే అనుమతి లేదా విజ్ఞప్తి భావం
  rationale: λογισθείη అనే పాసివ్ ఆప్టేటివ్ రూపం కేవలం ప్రకటనకన్నా కోరిక లేదా ప్రార్థనను సహజంగా తెలియజేస్తుంది. క్షమాపణ భావంతో ఉన్న ప్రతిధ్వనిని నిలుపుతూ, గ్రీకు వాక్యం చెప్పినదానికంటే బలమైన సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయసందర్భ భాషను వాడాం. మూలంలోని చిన్న ప్రార్థనాత్మక చివరి వాక్యాన్ని అలాగే ఉంచాం; న్యాయపరమైన అర్థాన్ని స్పష్టం చేసినా, విచారణ యొక్క ఖచ్చిత దశను ప్రధాన వాక్యంలో అతిగా నిర్దిష్టం చేయలేదు.
