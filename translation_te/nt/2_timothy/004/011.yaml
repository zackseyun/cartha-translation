id: 2TI.4.11
reference: 2 Timothy 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: te
  text: లూకా ఒక్కడే నాతో ఉన్నాడు. మార్కును వెంట తీసుకొని రా; ఎందుకంటే అతడు పరిచర్యకు నాకు ఉపయోగకరంగా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవకు.” గ్రీకు పదం διακονία విస్తృతార్థంలో సేవను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: లూకా
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: μόνος
  choice: ఒక్కడే
  rationale: లూకా మాత్రమే ప్రస్తుతం పౌలుతో ఉన్నాడనే ప్రత్యేకార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో
  rationale: సహవాసాన్ని సూచించే μετά + షష్ఠీ విభక్తికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: Μᾶρκον
  choice: మార్కును
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ; వాక్యంలో కర్మరూపం.
- source_word: ἀναλαβὼν
  choice: వెంటబెట్టుకొని
  rationale: మార్కును తనతో తీసుకొని, ఆ తరువాత తీసుకురావాలనే క్రమార్థాన్ని తెలుగు అసమాపక క్రియ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄγε μετὰ σεαυτοῦ
  choice: నీతో తీసుకురా
  rationale: మార్కును తిమోతి తన వెంట తీసుకురావాలనే ఆజ్ఞను స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: γάρ μοι
  choice: ఎందుకంటే … నాకు
  rationale: γάρ తెలిపే కారణ సంబంధాన్నీ, μοι తెలిపే వ్యక్తిగత సంబంధాన్నీ నిలుపుతుంది.
- source_word: εὔχρηστος
  choice: ఉపయోగకరంగా ఉంటాడు
  rationale: ప్రయోజనకరుడు లేదా సహాయకరుడు అనే మూలార్థాన్ని వ్యక్తి సందర్భానికి తగిన గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: εἰς διακονίαν
  choice: పరిచర్యలో
  rationale: διακονία ఇక్కడ పౌలు చేస్తున్న సేవా కార్యాన్ని సూచించే అవకాశం ఉంది; ‘పరిచర్య’ సంఘ సంబంధిత పనిని సూచించినా అధికారిక పదవిని నిర్దేశించదు. εἰς యొక్క కార్యసంబంధ దిశను తెలుగులో ‘లో’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: διακονία యొక్క పరిధి
  choice: పరిచర్య
  alternative: సేవ
  rationale: ఈ పదం విస్తృతంగా సేవను సూచించగలదు; ఈ సందర్భంలో పౌలు చేస్తున్న అపొస్తలిక లేదా సువార్త కార్యానికి మార్కు ఉపయోగపడతాడనే భావం సంభావ్యమైనది. అందువల్ల ప్రధాన పాఠంలో ‘పరిచర్య’ను ఉంచి, విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఒక్కడే’ మూలంలోని ప్రత్యేకతను కాపాడుతుంది; ‘వెంటబెట్టుకొని నీతో తీసుకురా’ అనే నిర్మాణం ἀναλαβών మరియు ప్రధాన ఆజ్ఞ మధ్యనున్న క్రమాన్ని నిలుపుతుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంచబడింది.
