- from: లూకా ఒక్కడే నాతో ఉన్నాడు. మార్కును వెంటబెట్టుకొని నీతో తీసుకురా; ఎందుకంటే పరిచర్యలో[a] అతడు నాకు ఉపయోగకరంగా ఉంటాడు.
  to: లూకా ఒక్కడే నాతో ఉన్నాడు. మార్కును వెంట తీసుకొని రా; ఎందుకంటే అతడు పరిచర్యకు నాకు ఉపయోగకరంగా ఉన్నాడు.[a]
  rationale: The command has been recast to remove redundant wording while retaining the sequential sense of taking Mark along and bringing him. The final phrase now uses “పరిచర్యకు” to reflect the purposive force of εἰς. The footnote anchor is retained and placed after the term/phrase to which the lexical alternative pertains.
