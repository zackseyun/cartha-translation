  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: te
  text: నీవు కూడా అతని విషయంలో అప్రమత్తంగా ఉండు; ఎందుకంటే అతడు మన మాటలను[a] తీవ్రంగా వ్యతిరేకించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మన సందేశాన్ని,” లేదా “మన బోధను.” గ్రీకు మూలంలో “మన మాటలను” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάσσου
  choice: అప్రమత్తంగా ఉండు
  rationale: వర్తమానకాల మధ్యమ imperative తిమోతికి కొనసాగుతున్న వ్యక్తిగత జాగ్రత్తను ఆదేశిస్తుంది. ‘అప్రమత్తంగా ఉండు’ హెచ్చరిక బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λίαν
  choice: తీవ్రంగా
  rationale: ఈ పదం తరువాతి క్రియలోని వ్యతిరేకత తీవ్రతను పెంచుతుంది; ‘తీవ్రంగా వ్యతిరేకించాడు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ἀντέστη
  choice: వ్యతిరేకించాడు
  rationale: తనను తాను ఎదిరిగా నిలబెట్టుకోవడం లేదా ప్రతిఘటించడం అనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: మన మాటలను
  rationale: λόγοι అనే మూలపదానికి దగ్గరగా ఉండి, అది సందేశమా, బోధనా, సాక్ష్యమా అని ప్రధాన పాఠ్యంలో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ὃν
  choice: అతని విషయంలో
  rationale: సంబంధ సర్వనామం ముందటి వచనంలోని అలెగ్జాండరును సూచిస్తుంది. ‘అతని విషయంలో’ అనేది తెలుగులో జాగ్రత్త వహించాల్సిన వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: καὶ σὺ
  choice: నీవు కూడా
  rationale: καὶ మరియు బలవంతమైన σὺ కలిసి, పౌలుతో పాటు తిమోతి కూడా అప్రమత్తంగా ఉండాలని నొక్కిచెబుతాయి.
theological_decisions:
- issue: ‘మన మాటలు’ అనే పదబంధపు పరిధి
  choice: పౌలు మరియు అతని సహచరులు పలికిన మాటలను సూచించే విస్తృత భావాన్ని నిలిపి ఉంచడం
  alternative: న్యాయస్థాన సాక్ష్యం, సువార్త సందేశం, లేదా సిద్ధాంత బోధ అని నిర్దిష్టంగా అనువదించడం
  rationale: ఈ పదబంధమే వ్యతిరేకత న్యాయస్థానంలో జరిగిందా, బహిరంగ పరిచర్యలో జరిగిందా, లేక క్రైస్తవ బోధకు వ్యతిరేకంగానా అన్నది నిర్ణయించదు. అందువల్ల ‘మన మాటలను’ అనే మూలానికి దగ్గరైన రూపం అసలు అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. హెచ్చరిక బలాన్ని నిలిపి ఉంచుతూ, λόγοι యొక్క సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో సంకుచితం చేయలేదు.
