- from: 'దేవుని ఎదుట, సజీవులకూ మృతులకూ తీర్పు తీర్చబోతున్న[a] మెస్సీయ యేసు ఎదుట, ఆయన ప్రత్యక్షతను, ఆయన రాజ్యాన్ని సాక్షిగా ఉంచి[b], నేను నీకు గంభీరంగా ఆజ్ఞాపిస్తున్నాను:'
  to: 'దేవుని మరియు సజీవులకూ మృతులకూ తీర్పు తీర్చబోతున్న[a] మెస్సీయ యేసు సమక్షంలో, ఆయన ప్రత్యక్షతను, ఆయన రాజ్యాన్ని బట్టి[b], నేను నీకు గంభీరంగా ఆజ్ఞాపిస్తున్నాను:'
  rationale: The revision removes the misleading implication that the appearing and kingdom serve as witnesses, while retaining the main-text interpretation that they supply the basis or solemn ground of the charge. The footnote continues to preserve the Greek construction's less explicit alternative. All other key source distinctions and the formal modern Telugu register are retained.
