id: 2TI.4.1
reference: 2 Timothy 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: te
  text: 'దేవుని మరియు సజీవులకూ మృతులకూ తీర్పు తీర్చబోతున్న[a] మెస్సీయ యేసు సమక్షంలో, ఆయన ప్రత్యక్షతను, ఆయన రాజ్యాన్ని బట్టి[b], నేను నీకు గంభీరంగా ఆజ్ఞాపిస్తున్నాను:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీర్పు తీర్చనున్న.”
    reason: μέλλω అనే గ్రీకు క్రియ సమీపతను లేదా సాధారణ భవిష్యత్తును సూచించగలదు.
  - marker: b
    text: మరింత అక్షరార్థంగా, “ఆయన ప్రత్యక్షతను, ఆయన రాజ్యాన్ని కూడా”; గ్రీకులో ఈ పదాలకు గంభీర ఆజ్ఞాపనతో ఉన్న సంబంధం మరింత అంతర్లీనంగా ఉంది.
    reason: గ్రీకు సమన్వయం, కర్మకారక పదబంధాల వాక్యనిర్మాణం ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: నేను నీకు గంభీరంగా ఆజ్ఞాపిస్తున్నాను
  rationale: ఈ నియామక సందర్భంలో క్రియ కేవలం సాక్ష్యం చెప్పడాన్ని కాక గంభీరమైన బాధ్యతతో ఆజ్ఞాపించడాన్ని సూచిస్తుంది. గ్రీకులో అంతర్లీనంగా ఉన్న కర్మను తెలుగు సందర్భానుసారంగా ‘నీకు’ అని వ్యక్తం చేశాం.
- source_word: ἐνώπιον
  choice: ఎదుట
  rationale: దేవుని, మెస్సీయ యేసు సన్నిధిలో లేదా వారి దృష్టిలో అనే భావాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ తీర్పరి గురించిన గంభీరమైన వర్ణనలో బిరుదు భావాన్ని నిలుపుకుంటుంది; అందువల్ల ‘క్రీస్తు’ అనే పేరులాంటి రూపం కంటే ‘మెస్సీయ’ అని అనువదించాం.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: తీర్పు తీర్చబోతున్న
  rationale: μέλλω తెలిపే భవిష్యత్తు లేదా సమీప కార్య భావాన్ని సాధారణ భవిష్యత్తుగా చదును చేయకుండా నిలుపుతుంది; ఖచ్చితమైన కాలపట్టికను మాత్రం నిర్దేశించదు.
- source_word: ζῶντας καὶ νεκρούς
  choice: సజీవులకూ మృతులకూ
  rationale: తీర్పు పరిధిలో జీవించి ఉన్నవారూ చనిపోయినవారూ అందరూ ఉన్నారనే గ్రీకు జంటపదాల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιφάνειαν
  choice: ప్రత్యక్షత
  rationale: కనిపించే విధంగా బయలుపడటాన్ని సూచించే ἐπιφάνεια పదాన్ని, దాని అంత్యకాల భావాన్ని అధికంగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: βασιλείαν
  choice: రాజ్యం
  rationale: రాజ్యాధికారం అనే భావాన్ని కలిగి ఉండే ఈ పదానికి స్థిరమైన, విస్తృతార్థక తెలుగు సమానం.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: ఆయన ప్రత్యక్షతను, ఆయన రాజ్యాన్ని సాక్షిగా ఉంచి
  rationale: ఈ కర్మకారక పదబంధాలు గంభీర ఆజ్ఞాపన సూత్రాన్ని విస్తరిస్తున్నాయని గ్రహించి, తెలుగులో అర్థమయ్యేలా అంతర్లీన సంబంధాన్ని వ్యక్తం చేశాం; గ్రీకులోని మరింత ప్రత్యక్ష సమన్వయాన్ని పాదటీపులో ఉంచాం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ న్యాయతీర్పు సందర్భంలో అభిషిక్తుడైన వాగ్దత్త రాజు అనే బిరుదు భావం క్రియాశీలంగా ఉంది; అందువల్ల దాన్ని పేరులాంటి రూపంగా మార్చలేదు.
- issue: μέλλω పదంలోని అంత్యకాల భావం
  choice: తీర్పు తీర్చబోతున్న
  alternative: తీర్పు తీర్చనున్న
  rationale: గ్రీకులోని సమీపత లేదా ఎదురుచూస్తున్న భవిష్యత్తు అనే ఉద్వేగాన్ని నిలిపి, అది తప్పనిసరిగా తక్షణమే జరుగుతుందని నిర్ణయించలేదు.
- issue: ప్రత్యక్షత, రాజ్యం అనే కర్మకారక పదబంధాల వాక్యసంబంధం
  choice: గంభీర ఆజ్ఞాపనకు సాక్షులుగా లేదా ఆధారంగా అనుసంధానించడం
  alternative: ‘ఆయన ప్రత్యక్షతను, ఆయన రాజ్యాన్ని కూడా’ అని సంబంధాన్ని అంతర్లీనంగా ఉంచడం
  rationale: వాక్యనిర్మాణం క్లిష్టంగా ఉన్నందున ప్రధాన పాఠ్యంలో సహజమైన తెలుగు సంబంధాన్ని ఇచ్చి, గ్రీకులో సాధ్యమైన మరింత అంతర్లీన పఠనాన్ని పాదటీపులో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని వాడాం. ‘సాక్షిగా ఉంచి’ అనేది ప్రమాణాత్మక గంభీరతను సహజంగా తెలుపుతుంది; పాదటీపు గ్రీకు వాక్యనిర్మాణంలోని అస్పష్టతను కాపాడుతుంది.
