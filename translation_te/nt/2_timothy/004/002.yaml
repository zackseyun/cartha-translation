id: 2TI.4.2
reference: 2 Timothy 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: te
  text: వాక్యాన్ని ప్రకటించు; సమయం అనుకూలంగా ఉన్నా అనుకూలంగా లేకపోయినా సిద్ధంగా ఉండు[b]; తప్పును ఎత్తిచూపు, గద్దించు, బుద్ధిచెప్పు[c]—పూర్తి సహనంతో, బోధనతో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘సమయం అనుకూలమైనా అననుకూలమైనా.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ప్రోత్సహించు,’ ‘పురికొల్పు,’ లేదా ‘వేడుకో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: ప్రకటించు
  rationale: κηρύσσω బహిరంగంగా అధికారపూర్వకంగా ప్రకటించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రకటించు’ సహజంగా ఉండి మూలంలోని ప్రకటన భావాన్ని నిలుపుతుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: λόγος ఇక్కడ తిమోతికి ప్రకటించమని అప్పగించబడిన అపొస్తలిక సందేశాన్ని సూచిస్తుంది. ‘వాక్యం’ అనే రూపం దీనిని ‘సువార్త’ లేదా ‘లేఖనం’ అని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: ἐπίστηθι
  choice: సిద్ధంగా ఉండు
  rationale: ఈ ఆజ్ఞ సిద్ధంగా, అందుబాటులో ఉండి కార్యానికి పూనుకోవడం అనే భావాన్ని ఇస్తుంది. ‘సిద్ధంగా ఉండు’ తరువాతి కాలసూచక జంటతో సహజంగా సరిపోతుంది; అత్యవసరంగా పట్టుబట్టు అనే భావం కూడా సాధ్యమే.
- source_word: εὐκαίρως ἀκαίρως
  choice: సమయం అనుకూలంగా ఉన్నా అనుకూలంగా లేకపోయినా
  rationale: పరిస్థితులు అనువుగా కనిపించినా కనిపించకపోయినా అనే సమగ్ర భావాన్ని ఈ సమతుల్య పదబంధం స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔλεγξον
  choice: తప్పును ఎత్తిచూపు
  rationale: ἐλέγχω తప్పును బయటపెట్టి దిద్దుబాటుకు తీసుకురావడాన్ని సూచిస్తుంది. ఈ అనువాదం కేవలం అంతరంగ ఒప్పింపుకే పరిమితం కాకుండా సరిదిద్దే బలాన్ని నిలుపుతుంది.
- source_word: ἐπιτίμησον
  choice: గద్దించు
  rationale: ఇది ముందున్న క్రియకన్నా కఠినమైన మందలింపును సూచిస్తుంది. ‘గద్దించు’ ఆ పదునైన ఆజ్ఞను సంక్షిప్తంగా అందిస్తుంది.
- source_word: παρακάλεσον
  choice: బుద్ధిచెప్పు
  rationale: παρακαλέω ప్రోత్సహించడం, వేడుకోవడం, గట్టిగా పురికొల్పడం వంటి భావాలు కలిగి ఉంది. ఈ పరిచర్య సందర్భంలో ‘బుద్ధిచెప్పు’ శ్రద్ధతో ఉపదేశించి సరైన దారికి పురికొల్పే భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: పూర్తి సహనంతో
  rationale: μακροθυμία ప్రజల పట్ల దీర్ఘశాంతిని సూచిస్తుంది; πάσῃ దాని సంపూర్ణతను బలపరుస్తుంది.
- source_word: καὶ διδαχῇ
  choice: బోధిస్తూ
  rationale: διδαχή దిద్దుబాటు చర్యలతో కూడిన బోధన లేదా ఉపదేశాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘బోధిస్తూ’ ఆ చర్యలు జరిగే విధానాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘వాక్యం’ యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘వాక్యాన్ని’ అని ఉంచడం
  alternative: ‘సందేశాన్ని,’ ‘సువార్తను,’ లేదా ‘లేఖనాన్ని’
  rationale: సమీప సందర్భం లేఖనాధారమైన అపొస్తలిక ప్రకటనను సూచించినా, λόγος అనే పదం ఈ వచనంలో దానిని ‘సువార్త’ లేదా ‘లేఖనం’ అని స్పష్టంగా పరిమితం చేయదు. అందువల్ల మూలంలోని విస్తృతతను నిలుపుతూ అతిగా సిద్ధాంతీకరించలేదు.
- issue: παρακάλεσον లోని భావ పరిధి
  choice: ‘బుద్ధిచెప్పు’ అని అనువదించి ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇవ్వడం
  alternative: ‘ప్రోత్సహించు,’ ‘పురికొల్పు,’ లేదా ‘వేడుకో’
  rationale: ఈ క్రియలో ప్రోత్సాహం మరియు గట్టి విజ్ఞప్తి రెండూ ఉండవచ్చు. సందర్భం దిద్దుబాటు ఆజ్ఞల మధ్య ఉన్నందున ‘బుద్ధిచెప్పు’ సరిపోతుంది; అయినా మూలంలోని సానుకూల ప్రోత్సాహ భావాన్ని పూర్తిగా మూసివేయకుండా పాదటిప్పణి ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా ఆజ్ఞాపించే శైలిని వాడాం. వరుసగా ఉన్న ఐదు గ్రీకు ఆజ్ఞల ఉత్సాహాన్ని సాధ్యమైనంతవరకు నిలిపి, చివరి పదబంధాన్ని సహనం మరియు బోధన అన్ని చర్యలను నియంత్రించే విధంగా తెలుగులో సహజంగా నిర్మించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
