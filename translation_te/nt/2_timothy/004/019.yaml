lexical_decisions:
- source_word: Ἄσπασαι
  choice: శుభాకాంక్షలు తెలియజేయి
  rationale: ἀσπάζομαι యొక్క భూతకాల మధ్యమ ఆజ్ఞార్థక రూపం పత్రికా సందర్భంలో పలకరింపులు తెలియజేయమనే సూటి ఆదేశాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా ఉండి ఆజ్ఞార్థక బలాన్ని నిలుపుతుంది.
- source_word: Πρίσκαν
  choice: ప్రిస్కా
  rationale: మూలపాఠంలోని Πρίσκαν అనేది Πρίσκα యొక్క కర్మవిభక్తి రూపం. కాబట్టి ‘ప్రిస్కా’ అని నేరుగా లిప్యంతరీకరించాం; ఇతర చోట్ల కనిపించే ‘ప్రిస్కిల్ల’ రూపాన్ని ప్రధాన పాఠంలో పెట్టలేదు.
- source_word: Ἀκύλαν
  choice: అకులా
  rationale: Ἀκύλας అనే వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: ఒనేసిఫొరు ఇంటివారు
  rationale: οἶκος ఇక్కడ భవనాన్ని కాక, ఆ ఇంటికి చెందిన కుటుంబం లేదా గృహసముదాయాన్ని సూచిస్తుంది. ‘ఇంటివారు’ అనే పదం రక్తసంబంధీకులకే పరిమితం చేయకుండా ఈ సామాజిక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
