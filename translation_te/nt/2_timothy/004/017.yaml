id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: te
  text: అయితే ప్రభువు నాకు తోడుగా నిలిచి నన్ను బలపరిచాడు, తద్వారా నా ద్వారా ప్రకటన పూర్తిగా నెరవేర్చబడేలా, అన్యజనులందరూ[a] వినేలా చేశాడు. సింహం నోటి నుంచి[b] నేను రక్షించబడ్డాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనాలందరూ” లేదా “దేశాలన్నీ.” గ్రీకు పదం ἔθνη అన్యజనులను లేదా జనాలను/దేశాలను సూచించగలదు; ఇక్కడ యూదేతర ప్రజలు సందేశం వినడమే ప్రధాన భావంగా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సింహం నోటి నుంచి” అనేది నిజమైన సింహాన్ని సూచించకుండా, ప్రాణాంతక ప్రమాదం నుంచి తప్పించబడటానికి రూపకాలంకారంగా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: అయితే ప్రభువు
  rationale: δέ ముందరి వాక్యంతో ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది; κύριοςను దాని సూచిత వ్యక్తిని అదనంగా నిర్ధారించకుండా సంప్రదాయబద్ధమైన, సహజమైన ‘ప్రభువు’గా అనువదించాం.
- source_word: μοι παρέστη
  choice: నాకు తోడుగా నిలిచి
  rationale: ఇది కేవలం దగ్గర ఉండడాన్ని కాక, సహాయంగా పక్కన నిలబడడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘తోడుగా నిలిచి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐνεδυνάμωσέν με
  choice: నన్ను బలపరిచాడు
  rationale: ἐνδυναμόωలోని బలం కలిగించడం లేదా శక్తినివ్వడం అనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἵνα δι’ ἐμοῦ
  choice: నా ద్వారా … వినాలనే ఉద్దేశంతో
  rationale: διάతో కర్తృత్వం లేదా సాధన భావం నిలుస్తుంది; ἵναలోని ఉద్దేశ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ κήρυγμα πληροφορηθῇ
  choice: ప్రకటన సంపూర్ణంగా జరిగి
  rationale: κήρυγμα ప్రకటించబడే సందేశాన్ని లేదా ప్రకటన కార్యాన్ని సూచించగలదు; πληροφορηθῇ దాని పూర్తి నెరవేర్పును సూచిస్తుంది. ఈ రూపం అర్థాన్ని ‘పూర్తిగా ప్రకటించబడింది’ లేదా ‘పూర్తిగా నెరవేరింది’ అనే ఒక్క భావానికే పరిమితం చేయదు.
- source_word: πάντα τὰ ἔθνη
  choice: అన్యజనులందరూ
  rationale: పౌలు పరిచర్య సందర్భంలో ἔθνη యూదేతర ప్రజలను సూచించే అవకాశం ఎక్కువ. అయినా ‘దేశాలన్నీ/జనాలన్నీ’ అనే విస్తృత అర్థం కూడా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐρρύσθην
  choice: నేను రక్షించబడ్డాను
  rationale: తీవ్రమైన ప్రమాదం నుంచి విడిపించబడటం అనే ῥύομαι భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκ στόματος λέοντος
  choice: సింహం నోటి నుంచి
  rationale: మూలంలోని బలమైన చిత్రాన్ని యథాతథంగా ఉంచి, అది నిజమైన సింహమా లేక ప్రాణాంతక ప్రమాదానికి రూపకాలంకారమా అనే ప్రశ్నను పాఠ్యంలోనే పరిష్కరించలేదు.
theological_decisions:
- issue: ‘ప్రభువు’ (κύριος) ఎవరిని సూచిస్తుంది?
  choice: పాఠ్యంలో కేవలం ‘ప్రభువు’ అని ఉంచడం
  alternative: ప్రత్యేకంగా యేసు అని లేదా సాధారణంగా దేవుడు అని పేర్కొనడం
  rationale: సందర్భాన్ని బట్టి పునరుత్థానుడైన యేసు అని అర్థం చేసుకోవచ్చు; అయినా గ్రీకు పాఠ్యం ఇక్కడ పేరును స్పష్టంగా చెప్పనందున అనువాదం ఆ తెరచిన భావాన్ని నిలుపుతుంది.
- issue: ‘సింహం నోటి నుంచి’ అనే మాట అర్థం
  choice: మూల చిత్రాన్ని అక్షరార్థ రూపంలోనే ఉంచడం
  alternative: నీరో, సాతాను, నిజమైన క్రూరమృగం లేదా సాధారణ ప్రాణాపాయం అని స్పష్టీకరించడం
  rationale: ఈ వివరణల్లో ఏదో ఒకదాన్ని మూలపాఠ్యం నిర్ధారించదు. అందువల్ల చారిత్రక, రూపకాలంకార సంబంధ అనిశ్చితిని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని పొడవైన నిర్మాణాన్ని పఠన సౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించాం; ఉద్దేశ సంబంధాన్ని ‘అలా చేశాడు’ ద్వారా స్పష్టంగా నిలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
