revisions:
- from: అయితే ప్రభువు నాకు తోడుగా నిలిచి, నన్ను బలపరిచాడు. నా ద్వారా ప్రకటన సంపూర్ణంగా జరిగి, అన్యజనులందరూ[a] వినాలనే ఉద్దేశంతో ఆయన అలా చేశాడు. సింహం నోటి నుంచి[b] నేను రక్షించబడ్డాను.
