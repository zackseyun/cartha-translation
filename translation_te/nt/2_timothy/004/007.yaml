id: 2TI.4.7
reference: 2 Timothy 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸν ⸂καλὸν ἀγῶνα⸃ ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: te
  text: నేను మంచి పోరాటం చేశాను; పరుగును పూర్తి చేశాను; విశ్వాసాన్ని కాపాడాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకాన్ని నిలుపుకున్నాను” లేదా “నమ్మకంగా ఉన్నాను.” గ్రీకు τὴν πίστιν అనే పదబంధం క్రైస్తవ విశ్వాసాన్ని సూచించవచ్చు; లేదా నమ్మకాన్ని నిలుపుకోవడం, నమ్మకంగా ఉండడం అనే భావాన్ని ఇవ్వవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: మంచి పోరాటం
  rationale: ἀγών అంటే పోరాటం, పోటీ, సంఘర్షణ అని అర్థం కావచ్చు. ఇక్కడ క్రీడా/యుద్ధ రూపకం ఉన్నందున ‘మంచి పోరాటం’ సహజంగా ఉండి, καλός లోని మంచి లేదా శ్రేష్ఠమైన అనే భావాన్ని నిలుపుతుంది.
- source_word: ἠγώνισμαι
  choice: పోరాడాను
  rationale: ἀγωνίζομαι యొక్క పరిపూర్ణ కాల రూపం పూర్తయిన కార్యాన్ని, దాని ప్రస్తుత ప్రాముఖ్యతతో సహా తెలియజేస్తుంది. తెలుగులో ‘పోరాడాను’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: δρόμον
  choice: పరుగును
  rationale: δρόμος పరుగు పందెం లేదా దాని మార్గాన్ని సూచిస్తుంది. ‘పరుగును’ అనే పదం క్రీడా రూపకాన్ని స్పష్టంగా ఉంచుతుంది; సందర్భంలో పందెం అనే భావం సహజంగా గ్రహించబడుతుంది.
- source_word: τετέλεκα
  choice: ముగించాను
  rationale: τελέω యొక్క పరిపూర్ణ కాల రూపం ఉద్దేశించిన ముగింపుకు చేర్చడాన్ని సూచిస్తుంది. ‘ముగించాను’ సహజమైన, సంక్షిప్త సమానార్థకం.
- source_word: τὴν πίστιν
  choice: విశ్వాసాన్ని
  rationale: πίστις ఇక్కడ క్రైస్తవ విశ్వాసాన్ని సూచించవచ్చు; అలాగే విశ్వాసం నిలుపుకోవడం లేదా నమ్మకంగా ఉండడం అనే భావఛాయ కూడా ఉండవచ్చు. ‘విశ్వాసాన్ని’ ప్రధాన అర్థాన్ని ఉంచి, అస్పష్టతను పాదసూచికలో తెలియజేయడానికి వీలు కల్పిస్తుంది.
- source_word: τετήρηκα
  choice: కాపాడుకున్నాను
  rationale: τηρέω అంటే కాపాడడం, భద్రపరచడం, పాటించడం. ‘కాపాడుకున్నాను’ విశ్వాసాన్ని విడిచిపెట్టకుండా నిలుపుకున్న భావాన్నీ, దాన్ని సంరక్షించిన భావాన్నీ సహజంగా మోస్తుంది.
theological_decisions:
- issue: τὴν πίστιν యొక్క అర్థం
  choice: విశ్వాసాన్ని
  alternative: నమ్మకాన్ని నిలుపుకున్నాను; నమ్మకంగా నిలిచాను
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న πίστις ఇక్కడ అప్పగించబడిన క్రైస్తవ విశ్వాసాన్ని సూచించే అవకాశం బలంగా ఉంది. అయితే వ్యక్తిగత నమ్మకం లేదా నమ్మకత్వం అనే భావాన్ని పూర్తిగా తొలగించలేం; అందువల్ల ప్రధాన పాఠంలో ‘విశ్వాసాన్ని’ ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన సంక్షిప్త శైలి వాడబడింది. గ్రీకు వాక్యంలోని మూడు సమాంతర ప్రకటనలను అర్ధవిరామాలతో నిలుపుకున్నాం; ప్రతి క్రియలోని పరిపూర్ణ కాల భావాన్ని తెలుగు సహజ శైలికి అనుగుణంగా భూతకాలంతో వ్యక్తం చేశాం.
