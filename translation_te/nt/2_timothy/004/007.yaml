- from: నేను మంచి పోరాటం పోరాడాను; పరుగును ముగించాను; విశ్వాసాన్ని కాపాడుకున్నాను.[a]
  to: నేను మంచి పోరాటం చేశాను; పరుగును పూర్తి చేశాను; విశ్వాసాన్ని కాపాడాను.[a]
  rationale: The revision improves modern Telugu idiom while retaining the Greek verse’s compact threefold structure, completed-action force, and overlapping sense of πίστις. The footnote anchor and alternative-reading note are retained.
