  text: Make every effort to come to me quickly[a].
translation:
  language: te
  text: త్వరగా నా దగ్గరికి రావడానికి శాయశక్తులా ప్రయత్నించు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘త్వరలో నా దగ్గరికి రావడానికి శ్రద్ధగా ప్రయత్నించు’ లేదా ‘వీలైనంత త్వరగా నా దగ్గరికి రావడానికి నీ వంతు ప్రయత్నమంతా చేయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: శాయశక్తులా ప్రయత్నించు
  rationale: ఈ భూతకాల దృష్టిగల క్రియాశీల ఆజ్ఞారూపం కేవలం వేగాన్ని కాకుండా శ్రద్ధతో కూడిన గట్టి ప్రయత్నాన్ని సూచిస్తుంది. ‘శాయశక్తులా ప్రయత్నించు’ ఆ ఆజ్ఞాబలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వేగాన్ని సూచించే ταχέως భావాన్ని దీనిలో కలిపివేయదు.
- source_word: ἐλθεῖν
  choice: రావడానికి
  rationale: σπουδάζω క్రియపై ఆధారపడిన ἔρχομαι ధాతువు యొక్క అనిశ్చిత క్రియారూపం. πρός μεతో కలిసి మాట్లాడుతున్న వ్యక్తి వైపు రావడాన్ని సూచిస్తుంది.
- source_word: πρός με
  choice: నా దగ్గరికి
  rationale: వ్యక్తిని లక్ష్యంగా చేసుకున్న గమనాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం. ‘నా వద్దకు’ అనేదీ సాధ్యమే, కాని ‘నా దగ్గరికి’ సాధారణ పాఠకులకు మరింత సహజంగా ఉంటుంది.
- source_word: ταχέως
  choice: త్వరగా
  rationale: ఈ క్రియావిశేషణం ‘త్వరగా’ లేదా ‘త్వరలో’ అనే భావాలను ఇవ్వగలదు. ఇక్కడ ‘త్వరగా’ అత్యవసరతను స్పష్టంగా నిలుపుతూ, Σπούδασον తెలిపే శ్రద్ధగల ప్రయత్నం నుండి ప్రత్యేకమైన భావంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఏకవచన ఆజ్ఞారూపాన్ని వాడాం. మూలంలోని Σπούδασον తెలిపే శ్రద్ధగల ప్రయత్నాన్నీ, ταχέως తెలిపే త్వరతనాన్నీ వేర్వేరుగా నిలిపాం.
