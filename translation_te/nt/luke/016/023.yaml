id: LUK.16.23
reference: Luke 16:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: te
  text: అతడు హేడీసులో[a] యాతనల్లో ఉండి, కన్నులెత్తి దూరంగా ఉన్న అబ్రాహామును, అతని ఒడిలో[b] ఉన్న లాజరును చూస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నరకంలో”; మరింత ఖచ్చితంగా, “హేడీస్” అంటే మృతుల లోకం. ఇది అంతిమ తీర్పు స్థలాన్ని సూచించే “గెహెన్నా” అనే పదం కాదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని వక్షస్థలంలో”; సాంప్రదాయంగా, “అబ్రాహాము ఒడిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: హేడీసులో
  rationale: గ్రీకు పదాన్నే లిప్యంతరీకరించడం ద్వారా దీనిని ‘గెహెన్నా’తో లేదా అంతిమ తీర్పు స్థలమనే భావంతో కలపకుండా, మృతుల లోకాన్ని సూచించే ప్రత్యేక పదాన్ని నిలిపాం.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: కన్నులెత్తి
  rationale: గ్రీకు క్రియారూపంలోని దృశ్య స్పష్టతను సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగంతో నిలిపాం.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: యాతనల్లో ఉండి
  rationale: పరిస్థితిని సూచించే అసమాపక క్రియను నిలుపుతూ, βασάνοις యొక్క బహువచన రూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: ὁρᾷ
  choice: చూస్తాడు
  rationale: కథనంలోని సజీవ వర్తమాన కాలాన్ని గ్రీకు మూలానికి అనుగుణంగా నిలిపాం.
- source_word: ἀπὸ μακρόθεν
  choice: దూరంగా ఉన్న
  rationale: అబ్రాహాము కనిపించిన స్థలదూరాన్ని స్పష్టంగా, సహజంగా తెలిపే ప్రయోగం.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: అతని ఒడిలో
  rationale: κόλπος సూచించే ఛాతీ/ఒడి సమీపతను ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; సాంప్రదాయ ‘అబ్రాహాము ఒడి’ భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
theological_decisions:
- issue: ᾅδης పదాన్ని మధ్యస్థ మృతుల లోకమా, అంతిమ శిక్షాస్థలమా అని ఎలా అనువదించాలి
  choice: హేడీస్
  alternative: మృతుల లోకం; నరకం
  rationale: గ్రీకు పదభేదాన్ని నిలిపి, ఈ వాక్యాన్ని ‘గెహెన్నా’ లేదా అంతిమ తీర్పుతో మౌనంగా సమానీకరించకుండా వేదాంత ఉద్వేగాన్ని కాపాడాం.
- issue: κόλποις రూపంలోని అబ్రాహాముతో సన్నిహిత స్థానం తెలిపే రూపకం
  choice: అతని ఒడిలో
  alternative: అబ్రాహాము ఒడిలో; అతని పక్కన
  rationale: మూలంలోని రూపకాన్ని మరియు సర్వనామాన్ని నిలుపుతూ, సాధారణ పాఠకునికి సహజంగా అర్థమయ్యే తెలుగు వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. గ్రీకు కథనంలోని సజీవ వర్తమాన కాలం మరియు భాగవాచక క్రమం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
