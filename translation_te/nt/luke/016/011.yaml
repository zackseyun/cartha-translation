id: LUK.16.11
reference: Luke 16:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: te
  text: కాబట్టి, అన్యాయమైన సంపద విషయంలో మీరు నమ్మకంగా ఉండకపోతే, నిజమైన సంపదను మీకు ఎవరు అప్పగిస్తారు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδίκῳ
  choice: అన్యాయమైన
  rationale: ἄδικος యొక్క సాధారణ నైతిక భావమైన ‘అన్యాయమైన/అనీతిగల’ అనే రంగును నిలుపుతుంది. ‘మోసపూరితమైన’ అనడం సంపద మోసం ద్వారా సంపాదించబడిందనే సంకుచిత భావాన్ని కలిగించవచ్చు.
- source_word: μαμωνᾷ
  choice: సంపద
  rationale: μαμωνᾶς డబ్బుతో మాత్రమే పరిమితం కాకుండా ధనం, ఆస్తులు అనే విస్తృత భావాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘సంపద’ సహజంగా ఉంది.
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: అన్యాయమైన సంపద విషయంలో
  rationale: ἐν ఇక్కడ నమ్మకత్వం ప్రదర్శించబడే పరిధిని సూచిస్తుంది. తెలుగులో ‘విషయంలో’ అనేది ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πιστοὶ
  choice: నమ్మకంగా
  rationale: ఈ గృహనిర్వహణ సందర్భంలో విశ్వసనీయతను, అప్పగించినదానిలో బాధ్యతాయుతంగా ఉండడాన్ని వ్యక్తపరుస్తుంది.
- source_word: οὐκ ἐγένεσθε
  choice: ఉండకపోతే
  rationale: γίνομαι + విశేషణం ఇక్కడ ‘అలా నిరూపించుకోకపోవడం/ఉండకపోవడం’ అనే భావంలో ఉంది; షరతు వాక్యంలో ఈ తెలుగు రూపం సహజం.
- source_word: τὸ ἀληθινὸν
  choice: నిజమైన సంపదను
  rationale: గ్రీకులో నామవాచకం స్పష్టంగా లేకపోయినా, μαμωνᾷతో ఉన్న ప్రత్యక్ష వ్యత్యాసం వల్ల ‘సంపద’ను పూరించడం తెలుగులో అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: πιστεύσει
  choice: అప్పగిస్తారు
  rationale: వ్యక్తిని సూచించే పరోక్ష కర్మతోను, వస్తువును సూచించే ప్రత్యక్ష కర్మతోను ఉన్న πιστεύω ఇక్కడ ‘నమ్మడం’ కాక ‘అప్పగించడం’ అని అర్థం.
theological_decisions:
- issue: τὸ ἀληθινὸν (‘నిజమైనది’) అనే నామవాచకరహిత విశేషణం యొక్క భావం
  choice: నిజమైన సంపద
  alternative: నిజమైనది
  rationale: మూల గ్రీకు నామవాచకాన్ని చెప్పకుండా ఉంచుతుంది; అయితే అన్యాయమైన సంపదతో ఉన్న వ్యత్యాసం వల్ల ‘సంపద’ భావం బలంగా సూచితమవుతుంది. ఇది సిద్ధాంతపరమైన అదనం కాక, తెలుగులో సహజ స్పష్టత కోసం చేసిన పరిమిత పూరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం. ‘మమ్మోను’ అనే లిప్యంతరీకరణకు బదులుగా సాధారణ పాఠకులకు సులభమైన ‘సంపద’ వాడబడింది. మూలంలోని οὖν భావాన్ని ‘కాబట్టి’తో నిలిపాం.
