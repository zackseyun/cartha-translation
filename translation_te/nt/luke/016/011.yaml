  source_fidelity: 'తెలుగు వచనం గ్రీకు నిర్మాణాన్నీ భావాన్నీ విశ్వసనీయంగా అందిస్తోంది: οὖνకు “కాబట్టి,” ἐν ... μαμωνᾷకు సందర్భోచితమైన “...సంపద విషయంలో,” πιστοὶ ... οὐκ ἐγένεσθεకు “నమ్మకంగా ఉండకపోతే,” మరియు πιστεύσειకు “అప్పగిస్తారు” సరైనవి. τὸ ἀληθινὸνలో సూచితమైన నామవాచకాన్ని “నిజమైన సంపద”గా పూరించడం తక్షణ వ్యత్యాసానికి అనుగుణమైన, మితమైన వివరణాత్మక పూరణ.'
