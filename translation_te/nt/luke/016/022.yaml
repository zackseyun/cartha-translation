  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: te
  text: ఆ పేదవాడు చనిపోయి, దేవదూతల చేత అబ్రాహాము ఒడిలోకి తీసుకువెళ్లబడ్డాడు[a]. ధనవంతుడు కూడా చనిపోయి పాతిపెట్టబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబ్రాహాము ప్రక్కకు.’ గ్రీకు వ్యక్తీకరణ అక్షరార్థంగా ‘అబ్రాహాము ఒడిలోకి’ అని ఉంటుంది; అది సాన్నిహిత్యం, గౌరవం, సహవాసాన్ని సూచించే చిత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: ఆ పేదవాడు చనిపోయి
  rationale: లూకా వాడే ἐγένετο + infinitive కథన నిర్మాణాన్ని తెలుగులో పదేపదే అనువదిస్తే కృత్రిమంగా ఉంటుంది. సంఘటనను సహజంగా తెలిపే విధంగా క్రియారూపంలో అనువదించాం; δέ సూచించే స్వల్ప కథన మలుపును సందర్భం, వాక్యక్రమం తెలియజేస్తాయి.
- source_word: τὸν πτωχὸν
  choice: ఆ పేదవాడు
  rationale: πτωχός అంటే పేదవాడు లేదా నిరుపేద. ఈ వచనంలో లేని ‘బిచ్చగాడు’ అనే అదనపు భావాన్ని చేర్చకుండా ప్రత్యక్ష అర్థాన్ని నిలిపాం.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: దేవదూతల చేత ... తీసుకువెళ్లబడ్డాడు
  rationale: గ్రీకులోని కర్మణి ప్రయోగాన్నీ, దేవదూతలే ఆ కార్యానికి కర్తలనే విషయాన్నీ నిలిపే సహజ తెలుగు రూపం.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: అబ్రాహాము ఒడిలోకి
  rationale: κόλπος రొమ్ము, ఒడి లేదా ఒకరి అతి సమీప స్థానాన్ని సూచించగలదు. ‘ఒడిలోకి’ మూలంలోని సాన్నిహిత్య చిత్రాన్ని సహజ తెలుగులో నిలుపుతుంది; ‘ప్రక్కకు’ అనే భావానువాదాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: ధనవంతుడు కూడా చనిపోయి
  rationale: καί లోని ‘కూడా’ భావాన్ని స్పష్టంగా ఉంచి, ఇద్దరి మరణాల మధ్య ఉన్న సమాంతరతను నిలిపాం.
- source_word: ἐτάφη
  choice: పాతిపెట్టబడ్డాడు
  rationale: θάπτω యొక్క కర్మణి రూపాన్ని సంక్షిప్తంగా, నేరుగా అనువదించాం.
theological_decisions:
- issue: εἰς τὸν κόλπον Ἀβραάμ అనే రూపకానికి అనువాదం
  choice: అబ్రాహాము ఒడిలోకి
  alternative: అబ్రాహాము ప్రక్కకు
  rationale: ‘ఒడి’ మూలపాఠంలోని సాన్నిహిత్యం, గౌరవం, సహవాసం అనే చిత్రాన్ని ముందుగానే ఒక నిర్దిష్ట పరలోక సిద్ధాంతంగా మార్చకుండా నిలుపుతుంది. ఆధునిక పాఠకునికి సాధ్యమైన భావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘ఒడి’ అనే సుపరిచిత పదంతో మూలంలోని రూపకాన్ని నిలిపి, వివరణాత్మక భావాన్ని పాదసూచికకు పరిమితం చేశాం.
