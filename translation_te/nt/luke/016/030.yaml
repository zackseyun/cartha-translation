id: LUK.16.30
reference: Luke 16:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: te
  text: అతడు, “కాదు, తండ్రీ అబ్రాహామా, కానీ చనిపోయినవారిలోనుండి[a] ఎవరైనా వారి దగ్గరికి వెళ్తే, వారు పశ్చాత్తాపపడతారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చనిపోయినవారి నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐχί
  choice: కాదు
  rationale: బలమైన నిరాకరణను సహజమైన ప్రత్యక్ష సంభాషణలో వ్యక్తం చేస్తుంది.
- source_word: πάτερ Ἀβραάμ
  choice: తండ్రి అబ్రాహామా
  rationale: పూర్వికుడైన అబ్రాహామును సంబోధించే సంబంధవాచక ప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἀλλ’ ἐάν
  choice: …వెళ్తే
  rationale: ముందటి మాటకు విరుద్ధంగా ప్రతిపాదించిన షరతును తెలుగులో సహజంగా చూపిస్తుంది; ‘కాని’ అనే పదాన్ని ప్రత్యేకంగా చేర్చకుండానే ‘కాదు… వెళ్తే’ నిర్మాణం వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్ట ఏకవచన వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: ἀπὸ νεκρῶν
  choice: చనిపోయినవారిలోనుండి
  rationale: మృతుల సమూహం లేదా లోకం మధ్యనుండి రావడం అనే ἀπό + బహువచన షష్ఠీ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: వారి దగ్గరికి వెళ్తే
  rationale: వారి వైపు వెళ్లడాన్ని సూచించే గ్రీకు దిశాభావాన్ని, షరతుతో కూడిన క్రియారూపాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: μετανοήσουσιν
  choice: వారు పశ్చాత్తాపపడతారు
  rationale: లూకా సందర్భంలోని నైతిక-ఆధ్యాత్మిక మార్పును కేవలం ఆలోచన మార్చుకోవడంగా తగ్గించకుండా ప్రామాణికంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: μετανοέω అనే పశ్చాత్తాప భాష యొక్క భావం
  choice: పశ్చాత్తాపపడతారు
  alternative: తమ ఆలోచన మార్చుకుంటారు / మనసు మార్చుకుంటారు
  rationale: ఈ సందర్భంలో దైవిక హెచ్చరికకు స్పందనగా నైతిక-ఆధ్యాత్మిక మలుపు ఉద్దేశించబడింది; ‘పశ్చాత్తాపపడతారు’ ఆ సంపూర్ణ భావాన్ని కాపాడుతుంది.
- issue: ἀπὸ νεκρῶν యొక్క పరిధి
  choice: చనిపోయినవారిలోనుండి
  alternative: మృతులలోనుండి / చనిపోయినవారి దగ్గరనుండి
  rationale: మృతుల మధ్యనుండి ఒక వ్యక్తి బయలుదేరి రావడం అనే భావాన్ని నిలుపుతూ, పునరుత్థాన స్వరూపం గురించి వాక్యం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రత్యక్ష సంభాషణకు సహజమైనప్పటికీ గౌరవభరితమైన శైలి. ‘తండ్రి అబ్రాహామా’లో సంబోధన స్పష్టంగా ఉంచబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
