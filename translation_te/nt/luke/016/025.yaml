id: LUK.16.25
reference: Luke 16:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: te
  text: 'అయితే అబ్రాహాము ఇలా అన్నాడు: “బిడ్డా, నువ్వు నీ జీవితకాలంలో నీ మంచివాటిని పొందావని[a], అలాగే లాజరు చెడ్డవాటిని పొందాడని గుర్తుచేసుకో. ఇప్పుడు అతడు ఇక్కడ ఓదార్పు పొందుతున్నాడు; నువ్వేమో తీవ్రమైన వేదనలో ఉన్నావు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మంచివాటిని పూర్తిగా పొందావు.” గ్రీకు క్రియ తనకు దక్కినదాన్ని పొందడం లేదా పూర్తిగా పొందడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నువ్వు బాధపడుతున్నావు.” గ్రీకు పదం తీవ్రమైన నొప్పిని లేదా మనోవేదనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: బిడ్డా
  rationale: ఇది అక్షరార్థమైన కుమారత్వాన్ని తప్పనిసరిగా సూచించకుండా, వాత్సల్యంతో కూడిన సంబోధనను తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘బిడ్డా’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: μνήσθητι
  choice: గుర్తుచేసుకో
  rationale: గతంలో జరిగినదాన్ని జ్ఞాపకం చేసుకోవాలనే ఆజ్ఞను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπέλαβες
  choice: పొందావు
  rationale: తనకు దక్కినదాన్ని పొందడం లేదా పూర్తిగా పొందడం అనే భావం ఈ క్రియలో ఉండవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన ‘పొందావు’ ఉంచి, బలమైన ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: τὰ ἀγαθά σου
  choice: నీ మంచివాటిని
  rationale: సుఖకరమైన లేదా ప్రయోజనకరమైన వాటిని విస్తృతంగా సూచించే గ్రీకు పదబంధానికి దగ్గరగా ఉంటుంది; ‘ఆశీర్వాదాలు’ వంటి అదనపు ఆధ్యాత్మిక భావాన్ని చేర్చదు.
- source_word: ἐν τῇ ζωῇ σου
  choice: నీ జీవితకాలంలో
  rationale: ఇక్కడ ఉద్దేశించిన భౌతిక జీవిత కాలపరిమితిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὁμοίως
  choice: అలాగే
  rationale: ధనవంతుడు పొందిన మంచివాటికి, లాజరు పొందిన చెడ్డవాటికి మధ్య ఉన్న సమాంతర వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: τὰ κακά
  choice: చెడ్డవాటిని
  rationale: లాజరు అనుభవించిన ప్రతికూల పరిస్థితులను సూచిస్తుంది; అతడు చేసిన నైతిక దుష్కార్యాలుగా అర్థం రాకుండా సందర్భం దానిని నియంత్రిస్తుంది, అదే సమయంలో గ్రీకు పదంలోని విస్తృతతను నిలుపుతుంది.
- source_word: παρακαλεῖται
  choice: ఓదార్పు పొందుతున్నాడు
  rationale: ఈ సందర్భంలో బాధకు విరుద్ధంగా లభించే ఆదరణ లేదా ఓదార్పును స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: కథనంలోని ప్రస్తుత స్థలాన్ని సూచించే సరళమైన, సహజమైన సమానార్థకం.
- source_word: ὀδυνᾶσαι
  choice: తీవ్రమైన వేదనలో ఉన్నావు
  rationale: శారీరకమైనదైనా మానసికమైనదైనా కావచ్చే తీవ్రమైన బాధను తెలియజేస్తుంది; ‘హింసించబడుతున్నావు’ అని అనవసరంగా కర్తను లేదా ప్రత్యేక విధానాన్ని సూచించదు.
theological_decisions:
- issue: మరణానంతర బాధను సూచించే భాష
  choice: తీవ్రమైన వేదనలో ఉన్నావు
  alternative: నువ్వు హింస అనుభవిస్తున్నావు
  rationale: వచనం మరణానంతర స్పృహతో కూడిన బాధను చిత్రిస్తుంది. అయితే ὀδυνᾶσαι అనే పదం చెప్పినదానికంటే ఎక్కువ సిద్ధాంతార్థాన్ని చేర్చకుండా, బాధ యొక్క తీవ్రతను మాత్రమే ప్రధాన పాఠం వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని ఉపయోగించాం. అబ్రాహాము సంబోధనలోని వాత్సల్యాన్ని ‘బిడ్డా’ నిలుపుతుంది. గ్రీకు వాక్యంలోని సమాంతర వ్యత్యాసం మరియు మరణానంతర స్థితిపై ఉన్న భాషా ఉద్రిక్తతను సిద్ధాంతపరంగా విస్తరించకుండా కాపాడాం.
