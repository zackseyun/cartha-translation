id: LUK.16.8
reference: Luke 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: te
  text: మరి యజమాని, అనీతిగల నిర్వాహకుడు చాకచక్యంగా వ్యవహరించాడని అతన్ని మెచ్చుకున్నాడు.[a] ఎందుకంటే ఈ యుగపు కుమారులు తమ సొంత తరంతో వ్యవహరించడంలో వెలుగు కుమారులకంటే ఎక్కువ చాకచక్యంగా ఉంటారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు అనీతిగల నిర్వాహకుణ్ణి మెచ్చుకున్నాడు.” ఇక్కడ సందర్భాన్ని బట్టి ‘యజమాని’ అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: “తమ సొంత తరంతో వ్యవహరించడంలో” అని అనువదించిన గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా “తమ సొంత తరం విషయంలో” అని అనువదించవచ్చు; దాని ఖచ్చితమైన భావం కొంత క్లిష్టమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: యజమాని
  rationale: ఉపమానంలోని తక్షణ సందర్భంలో ఇది ఆ నిర్వాహకుని యజమానినే సహజంగా సూచిస్తుంది; ‘ప్రభువు’ అనే అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: οἰκονόμον τῆς ἀδικίας
  choice: అనీతిగల నిర్వాహకుడు
  rationale: οἰκονόμοςకు ఆధునికంగా స్పష్టమైన ‘నిర్వాహకుడు’ను, ἀδικία యొక్క నైతిక బలాన్ని నిలిపే ‘అనీతిగల’ను ఎంచుకున్నాం; అతని తప్పు ఏ రూపంలో ఉందో అతిగా నిర్దిష్టం చేయలేదు.
- source_word: φρονίμως / φρονιμώτεροι
  choice: వివేకంగా / ఎక్కువ వివేకంగా
  rationale: ఇక్కడ నైతిక మంచితనం కంటే ఫలితాన్ని సాధించే ఆచరణాత్మక తెలివి ప్రధానమైనది. తెలుగు ‘వివేకంగా’ సహజంగా ఉండి, సందర్భంలోని నైతిక ఉద్రిక్తతను నిర్వాహకుడికి పెట్టిన ‘అనీతిగల’ అనే విశేషణం నిలుపుతుంది.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: ఈ యుగపు కుమారులు
  rationale: మూలంలోని సెమిటిక్ రూపకాన్ని, అలాగే ‘వెలుగు కుమారులు’తో ఉన్న సమాంతరతను నిలిపాం.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: వెలుగు కుమారులు
  rationale: దేవుని వెలుగుతో గుర్తింపు పొందినవారిని సూచించే బైబిలీయ రూపకాన్ని యథాతథంగా నిలిపాం.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: తమ తరంవారితో వ్యవహరించడంలో
  rationale: గ్రీకు పదబంధం క్లిష్టమైనది. ‘తమ తరంవైపు/కొరకు’ అనే అతిశాబ్దిక తెలుగు అస్పష్టంగా ఉంటుంది; ఈ ఎంపిక వారి సమకాలిక వర్గంలో ప్రవర్తించే సంబంధార్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మొదటి వాక్యభాగంలోని ὁ κύριος ఎవరు?
  choice: ఉపమానంలోని యజమాని
  alternative: ప్రభువు (యేసు లేదా దేవుడు)
  rationale: తక్షణ కథా సందర్భం ధనవంతుడిని, అతని నిర్వాహకుడిని గురించి ఉంది. ‘యజమాని’ అనడం అంతర్గత కథా సూచనను నిలిపి, యేసే అనీతిని నేరుగా ప్రశంసించాడనే అనవసర భావాన్ని నివారిస్తుంది; అయినా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నమోదు చేశాం.
- issue: నిర్వాహకుని చర్యపై నైతిక మదింపు
  choice: అనీతిని కాదు, అతని ఆచరణాత్మక వివేకాన్ని మెచ్చుకోవడం
  alternative: అతని మోసాన్ని ఆమోదించడం లేదా నైతిక జ్ఞానాన్ని ప్రశంసించడం
  rationale: వచనం అతన్ని ‘అనీతిగల’వాడని పిలుస్తూనే అతడు φρονίμως చేశాడని చెబుతుంది. అనీతిని మెచ్చుకున్నట్లు గానీ, ఉద్రిక్తతను తొలగించినట్లు గానీ అనువదించకుండా రెండింటినీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మూలంలోని ‘ఈ యుగపు కుమారులు/వెలుగు కుమారులు’ అనే సమాంతర రూపకాన్ని నిలిపాం. ‘తెలివిగా’ కంటే ‘వివేకంగా’ కొద్దిగా గంభీరమైన బైబిలీయ శైలిని ఇస్తుంది; అయితే ‘అనీతిగల’ అనే పదం వల్ల ఇది నైతిక ఆమోదంగా మారదు.
