translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథనశైలి ఉపయోగించబడింది. అసంపూర్ణ భూతకాల ప్రవాహం నిలుపబడింది; ఆరోపణ నిజమని ముందుగానే తేల్చకుండా మూలంలోని అనిశ్చితి కాపాడబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
