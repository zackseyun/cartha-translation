id: LUK.16.1
reference: Luke 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: te
  text: 'ఆయన శిష్యులతో కూడా ఇలా చెబుతూ ఉన్నాడు: “ఒక ధనవంతుడు ఉండేవాడు. అతనికి ఒక గృహనిర్వాహకుడు[a] ఉండేవాడు. ఆ నిర్వాహకుడు ఆ ధనవంతుని ఆస్తిని వృథా చేస్తున్నాడని ఆ ధనవంతునికి ఆరోపణ అందింది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆస్తి నిర్వాహకుడు.” గ్రీకు పదం ఇంటి లేదా ఆస్తి వ్యవహారాల పర్యవేక్షణ అప్పగించబడిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతని గురించి ప్రతికూలంగా నివేదించబడింది,” “అతనిపై నింద మోపబడింది.” గ్రీకు క్రియ ఆరోపణను లేదా ప్రతికూల నివేదికను సూచించవచ్చు; అది రుజువైన నేరమని తప్పనిసరిగా భావం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా నేపథ్యాన్ని ఏర్పరచే మాటను సూచిస్తుంది; తెలుగులో ‘చెబుతూ ఉన్నాడు’ ఆ ప్రవాహాన్ని నిలుపుతుంది.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: δέ వాక్యప్రవాహంలో మార్పును, καί అదనపు భావాన్ని సూచిస్తాయి. తెలుగులో సహజంగా ‘కూడా’ ప్రధాన అదనపు భావాన్ని వ్యక్తం చేస్తుంది; ప్రత్యేకంగా ‘అయితే’ చేర్చడం ఇక్కడ భారంగా ఉంటుంది.
- source_word: πρὸς τοὺς μαθητάς
  choice: శిష్యులతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సహజ తెలుగులో తెలియజేస్తుంది; మూలంలో లేని ‘తన’ అనే స్వామ్యపదాన్ని చేర్చలేదు.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: ఒక ధనవంతుడు ఉండేవాడు
  rationale: ఉపమాన కథలో ఒక పాత్రను పరిచయం చేసే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు కథనరీతిలో అందిస్తుంది.
- source_word: οἰκονόμον
  choice: గృహనిర్వాహకుడు
  rationale: ఇల్లు లేదా ఆస్తి వ్యవహారాల పర్యవేక్షణ అప్పగించబడిన వ్యక్తిని సూచిస్తుంది. సాధారణ ‘నిర్వాహకుడు’ కంటే బాధ్యత పరిధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὗτος
  choice: ఆ నిర్వాహకుడు
  rationale: సూచనార్థక సర్వనామం తిరిగి గృహనిర్వాహకునినే స్పష్టంగా సూచిస్తుంది; తెలుగులో అస్పష్టత రాకుండా నామవాచకాన్ని పునరుక్తి చేసింది.
- source_word: διεβλήθη αὐτῷ
  choice: అతనికి ఫిర్యాదు అందింది
  rationale: ధనవంతుని ఎదుట ప్రతికూల నివేదిక లేదా ఆరోపణ చేయబడిందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఆరోపణ రుజువైందని మాత్రం చెప్పదు.
- source_word: ὡς διασκορπίζων
  choice: వృథా చేస్తున్నాడని
  rationale: ఆరోపణలోని విషయాన్ని తెలుగులో సహజమైన ఉల్లేఖన నిర్మాణంతో అందిస్తుంది; ఆర్థిక సందర్భంలో ‘చెదరగొట్టడం’ కంటే ‘వృథా చేయడం’ సరియైనది.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: అతని ఆస్తిని
  rationale: ధనవంతునికి చెందిన సంపద లేదా ఆస్తులను సమగ్రంగా సూచిస్తుంది; తెలుగు సమూహార్థక ఏకవచనం సహజంగా ఉంది.
