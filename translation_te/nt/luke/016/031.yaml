source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: te
  text: 'అయితే అతడు అతనితో ఇలా అన్నాడు: “వారు మోషేను, ప్రవక్తలను వినకపోతే[a], మృతులలోనుండి[b] ఎవరైనా లేచినా వారు ఒప్పుకోరు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వినడం’ అనే గ్రీకు క్రియ కేవలం శబ్దం వినడమే కాక, శ్రద్ధగా ఆలకించి దానికి స్పందించడాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మృతుల మధ్యనుండి.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారు నమ్మరు.” ఇక్కడి గ్రీకు పదం ఒప్పించబడడం లేదా నమ్మడం అనే భావాన్ని సూచిస్తుంది; అది తప్పనిసరిగా నిర్దిష్టమైన రక్షణ విశ్వాసాన్నే సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: అయితే అతడు అతనితో ఇలా అన్నాడు
  rationale: δέ సంభాషణలోని స్వల్ప వ్యతిరేక మలుపును సూచిస్తుంది; ‘అయితే’ దానిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: మోషే మాటను, ప్రవక్తల మాటలను
  rationale: ἀκούω తీసుకునే షష్ఠీ విభక్తి వ్యక్తుల మాట/సాక్ష్యాన్ని వినడాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘మోషేను, ప్రవక్తలను వినడం’ కంటే ఈ రూపం సహజంగా ఉండి, మూలంలోని వ్యక్తి-ఆధారిత లేఖన సూచనను ‘లేఖనాలు’ అని విప్పి చెప్పదు.
- source_word: οὐκ ἀκούουσιν
  choice: వినకపోతే
  rationale: ἀκούω వినడమనే భావంతో పాటు శ్రద్ధగా ఆలకించి స్పందించడాన్నీ సూచించగలదు. ‘విను’ ఈ విస్తృతిని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: οὐδ’ ἐάν
  choice: …లేచినా … ఒప్పించబడరు
  rationale: తెలుగు concessive conditional నిర్మాణమైన ‘-ఇనా’ మొదటి నిరాకరణను మరింత బలపరుస్తూ ‘అలా జరిగినా కూడా కాదు’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్ట ఏకవచన వ్యక్తిని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ἐκ νεκρῶν
  choice: చనిపోయినవారిలో నుండి
  rationale: ἐκ యొక్క ‘మధ్యనుండి/లోనుండి’ భావాన్ని నిలుపుతూ, పునరుత్థాన సందర్భాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀναστῇ
  choice: లేచినా
  rationale: ἐάν తో వచ్చిన aorist subjunctive యొక్క షరతు భావాన్ని తెలుగు ‘-ఇనా’ నిర్మాణం సహజంగా అందిస్తుంది.
- source_word: πεισθήσονται
  choice: ఒప్పించబడరు
  rationale: πείθω యొక్క భవిష్యత్ కర్మణి రూపాన్ని దగ్గరగా నిలుపుతుంది; దీనిని ‘విశ్వసించరు’ లేదా ‘పశ్చాత్తాపపడరు’గా ప్రత్యేకీకరించదు.
theological_decisions:
- issue: ‘మోషే మరియు ప్రవక్తలు’ అనే పదబంధం యొక్క పరిధి
  choice: ఇశ్రాయేలుకు అప్పటికే ఇవ్వబడిన అధికారిక లేఖన సాక్ష్యాన్ని సూచించే స్థిరమైన వ్యక్తి-ఆధారిత పదబంధంగా నిలుపడం
  alternative: దీనిని నేరుగా ‘ధర్మశాస్త్రం మరియు ప్రవక్తల గ్రంథాలు’ లేదా ‘లేఖనాలు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: సందర్భంలో ఇది లేఖన సాక్ష్యాన్ని సూచించినా, మూలపాఠం ‘లేఖనాలు’ అని చెప్పకుండా ‘మోషే మరియు ప్రవక్తలు’ అనే రూపాన్ని వాడుతుంది. అనువాదం ఆ రూపాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- issue: πεισθήσονται యొక్క భావం
  choice: సాధారణంగా ఒప్పించబడడం/నమ్మేలా చేయబడడం
  alternative: ‘విశ్వసిస్తారు’ లేదా ‘పశ్చాత్తాపపడతారు’ అనే నిర్దిష్ట ఆధ్యాత్మిక స్పందన
  rationale: గ్రీకు క్రియ ఒప్పించబడటం లేదా నమ్మేలా చేయబడటాన్ని సూచిస్తుంది; రక్షణ విశ్వాసం లేదా పశ్చాత్తాపం అనే మరింత నిర్దిష్ట భావాన్ని మూలపాఠం ఇక్కడ ప్రత్యక్షంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం. ‘మోషే మాటను, ప్రవక్తల మాటలను’ అనే రూపం మూలంలోని సంక్షిప్త లేఖన సూచనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
