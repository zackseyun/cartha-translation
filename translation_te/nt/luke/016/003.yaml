id: LUK.16.3
reference: Luke 16:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: te
  text: 'అప్పుడు ఆ నిర్వాహకుడు[a] తనలో తాను ఇలా అనుకున్నాడు: “నా యజమాని నిర్వహణ బాధ్యతను నా నుంచి తీసివేస్తున్నాడు కాబట్టి నేనేం చేయాలి? తవ్వడానికి నాకు బలం లేదు; అడుక్కోవడానికి సిగ్గుపడుతున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిర్వాహకుడు’ అనే పదానికి ‘గృహనిర్వాహకుడు’ అని కూడా అనువదించవచ్చు. గ్రీకులో వ్యక్తికీ (οἰκονόμος), అతని నిర్వహణ బాధ్యతకూ (οἰκονομία) ఒకే మూలానికి చెందిన పదాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος
  choice: నిర్వాహకుడు
  rationale: మరొకరి ఆస్తి లేదా వ్యవహారాల పర్యవేక్షణ అప్పగించబడిన వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నిర్వాహకుడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἐν ἑαυτῷ
  choice: తనలో తాను ఇలా అనుకున్నాడు
  rationale: ఇది అంతరంగ సంభాషణను సూచించే గ్రీకు నుడికారం. తెలుగులో ‘తనలో తాను అనుకున్నాడు’ సహజమైన సమానార్థక ప్రయోగం.
- source_word: Τί ποιήσω
  choice: నేనేం చేయాలి?
  rationale: భవిష్యత్తులో తాను చేపట్టాల్సిన చర్య గురించి ఆలోచిస్తూ వేసుకున్న ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κύριός
  choice: యజమాని
  rationale: ఈ ఉపమానంలో ఇది దైవ బిరుదు కాదు; నిర్వాహకునిపై అధికారమున్న ధనవంతుడిని సూచిస్తుంది. ‘యజమాని’ ఆ సామాజిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀφαιρεῖται
  choice: తీసివేస్తున్నాడు
  rationale: ఒకరి నుంచి పదవి లేదా బాధ్యతను తొలగించే భావాన్ని, ἀπ’ ἐμοῦతో ఉన్న ‘నా నుంచి’ అనే సంబంధాన్ని నిలుపుతుంది.
- source_word: οἰκονομίαν
  choice: నిర్వహణ బాధ్యత
  rationale: ఇది కేవలం నిర్వహణ ప్రక్రియనే కాక, అప్పగించబడిన పదవి మరియు బాధ్యతను సూచిస్తుంది. ‘నిర్వహణ బాధ్యత’ ఆ రెండు కోణాలనూ స్పష్టంగా అందిస్తుంది.
- source_word: σκάπτειν
  choice: తవ్వడానికి
  rationale: కఠినమైన శారీరక శ్రమను సూచించే మూల క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది.
- source_word: οὐκ ἰσχύω
  choice: నాకు బలం లేదు
  rationale: తవ్వే సందర్భంలో ἰσχύω ప్రధానంగా శారీరక బలాన్ని సూచిస్తుంది; సాధారణ అసమర్థతగా విస్తరించకుండా ఆ భావాన్ని కాపాడుతుంది.
- source_word: ἐπαιτεῖν
  choice: అడుక్కోవడానికి
  rationale: భిక్ష అడగడం అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: αἰσχύνομαι
  choice: సిగ్గుపడుతున్నాను
  rationale: అడుక్కోవలసి రావడం పట్ల అతనికి కలిగే అవమానభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవేతర ఉపమాన సందర్భంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఇక్కడ κύριος దేవునికో యేసుకో వాడిన బిరుదు కాదు; ఉపమానంలోని మానవ అధికారి. అందువల్ల ‘ప్రభువు’ కలిగించగల అనవసరమైన దైవార్థాన్ని నివారిస్తూ ‘యజమాని’ సందర్భానుసారమైన అధికార సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. అంతరంగ సంభాషణకు తెలుగు నుడికారాన్ని ఉపయోగించి, నిర్వహణ పదవి తొలగింపు, శారీరక బలహీనత, అడుక్కోవడంపై సిగ్గు అనే మూలపాఠంలోని ఉద్వేగాలను నిలుపుకుంది.
