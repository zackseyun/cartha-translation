id: LUK.16.18
reference: Luke 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: te
  text: తన భార్యకు విడాకులు ఇచ్చి మరొక స్త్రీని పెళ్లి చేసుకునే ప్రతివాడూ వ్యభిచారం చేస్తాడు; భర్త నుండి విడాకులు పొందిన స్త్రీని పెళ్లి చేసుకునేవాడు వ్యభిచారం చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకు అక్షరార్థం: ‘భర్త నుండి విడాకులు పొందినదానిని’; అంటే, విడాకులు పొందిన స్త్రీని.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: ప్రతివాడూ
  rationale: ఈ గ్రీకు నిర్మాణం సాధారణంగా వర్తించే సార్వత్రిక ప్రకటనను సూచిస్తుంది; ‘ప్రతివాడూ’ దాని విస్తృతిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀπολύων
  choice: విడాకులు ఇచ్చి
  rationale: వివాహ సందర్భంలో ἀπολύω అంటే కేవలం ‘పంపివేయడం’ కాదు, వివాహ బంధాన్ని రద్దు చేయడం; ఆధునిక తెలుగులో ‘విడాకులు ఇవ్వడం’ స్పష్టమైన సమానార్థకం.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: తన భార్యకు
  rationale: ఇక్కడ γυνή వివాహ సందర్భం వల్ల ‘స్త్రీ’ కాక ‘భార్య’ అని అర్థం.
- source_word: γαμῶν ἑτέραν
  choice: మరొక స్త్రీని పెళ్లి చేసుకునే
  rationale: ἑτέραν స్త్రీలింగ ఏకవచనాన్ని స్పష్టంగా చూపుతూ, తెలుగులో సహజంగా ఉండేందుకు ‘మరొక స్త్రీని’ అని వ్యక్తం చేయబడింది.
- source_word: μοιχεύει
  choice: వ్యభిచారం చేస్తున్నాడు
  rationale: గ్రీకు వర్తమాన క్రియ యొక్క నైతిక ప్రకటనను ‘వ్యభిచారం చేస్తున్నాడు’ నేరుగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: ἀπολελυμένην
  choice: విడాకులు పొందిన స్త్రీని
  rationale: పరిపూర్ణ కర్మణి కృదంతం, ఆమె విడాకులు పొందిన స్థితిలో ఉందనే భావాన్ని ఇస్తుంది; ‘విడాకులు పొందిన’ ఆ కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: ἀπὸ ἀνδρὸς
  choice: భర్త నుండి
  rationale: వివాహ సందర్భంలో ἀνήρ అంటే ‘భర్త’; ἀπό యొక్క మూల భావాన్ని వ్యాఖ్యానాత్మకమైన ‘భర్త చేత’గా మార్చకుండా ‘నుండి’గా నిలుపుతుంది.
theological_decisions:
- issue: విడాకులు మరియు పునర్వివాహంపై యేసు మాట యొక్క పరిధి
  choice: లూకా వాక్యంలో ఉన్నట్లే దీనిని సార్వత్రిక నైతిక ప్రకటనగా అనువదించడం
  alternative: మత్తయిలోని మినహాయింపును ఇక్కడ అంతర్లీనంగా చేర్చడం, లేదా నిర్దిష్ట యూదు న్యాయ పరిస్థితులకు మాత్రమే పరిమితం చేయడం
  rationale: ఈ గ్రీకు వాక్యంలో ఎలాంటి మినహాయింపు లేదు. ఇతర వాక్యాల ఆధారంగా అర్హతలను చేర్చకుండా, లూకా రచనలోని సంక్షిప్తతను మరియు వేదాంతపరమైన ఉద్రిక్తతను నిలుపాలి.
- issue: ἀπὸ ἀνδρὸς లో సంబంధం మరియు కార్యనిర్వాహక భావం
  choice: ‘భర్త నుండి’ అని అనువదించడం
  alternative: ‘భర్త చేత విడాకులు పొందిన’ అని కార్యనిర్వాహక భావాన్ని స్పష్టీకరించడం
  rationale: గ్రీకు ἀπό సంబంధ విభజనను సూచించగలదు; ‘నుండి’ అనే రూపం మూలంలోని స్వల్ప అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర శైలిని ఉపయోగించాం. మొదటి భాగంలోని స్త్రీలింగ ἑτέραν ను ‘మరొక స్త్రీని’ అని స్పష్టం చేశాం. మూలంలో లేని మినహాయింపులు లేదా వ్యాఖ్యానాత్మక పరిమితులు చేర్చలేదు; ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
