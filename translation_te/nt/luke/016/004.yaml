id: LUK.16.4
reference: Luke 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: te
  text: 'ఏం చేయాలో నాకు తెలిసింది: నన్ను నిర్వాహక పదవి నుండి తొలగించినప్పుడు, వారు నన్ను తమ ఇళ్లలో చేర్చుకునేలా చేస్తాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: నాకు తెలిసింది
  rationale: సందర్భంలో ఇది అకస్మాత్తుగా ఒక పరిష్కారం తట్టిన భావాన్ని ఇస్తుంది; తెలుగు సహజ ప్రయోగంగా ‘నాకు తెలిసింది’ ఆ గ్రహింపును తెలియజేస్తుంది.
- source_word: τί ποιήσω
  choice: ఏం చేయాలో
  rationale: ఇది ఆలోచనాత్మక ప్రశ్నరూపంలోని భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; వెంటనే వచ్చే ‘ఇలా చేస్తాను’ అతని నిర్ణయాన్ని స్పష్టం చేస్తుంది.
- source_word: ἵνα ὅταν
  choice: …చేసినప్పుడు, …చేర్చుకునేలా
  rationale: భవిష్యత్తులో జరిగే తొలగింపును మరియు దానిని దృష్టిలో ఉంచుకున్న ఉద్దేశాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: μετασταθῶ ἐκ τῆς οἰκονομίας
  choice: నన్ను నిర్వాహక బాధ్యత నుండి తొలగించినప్పుడు
  rationale: పదవి లేదా గృహనిర్వహణ బాధ్యత నుండి తొలగించబడటమే సందర్భార్థం; ‘నిర్వాహక బాధ్యత’ అనవసరమైన మతపరమైన ఛాయను నివారిస్తుంది.
- source_word: δέξωνταί με
  choice: వారు నన్ను … చేర్చుకునేలా
  rationale: ఇక్కడ δέχομαι ఆతిథ్యంగా తమ వద్దకు స్వీకరించడాన్ని సూచిస్తుంది; ‘చేర్చుకోవడం’ తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: తమ ఇళ్లలో
  rationale: ప్రతిఫల సర్వనామాన్ని ‘తమ’ స్పష్టంగా సూచిస్తుంది; ఆతిథ్య సందర్భంలో ‘ఇళ్లు’ సహజమైన ఎంపిక.
