  to: 'నేనూ మీతో చెప్తున్నాను: అనీతియైన సంపదను ఉపయోగించి[a] మీ కోసం స్నేహితులను సంపాదించుకోండి. ఆ సంపద అంతమైపోయినప్పుడు[b], వారు మిమ్మల్ని నిత్య నివాసాల్లోకి[c] స్వీకరించునట్లు చేయండి.'
