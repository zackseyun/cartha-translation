id: LUK.16.9
reference: Luke 16:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: te
  text: 'నేనూ మీతో చెప్తున్నాను: అనీతియైన సంపదను ఉపయోగించి[a] మీ కోసం స్నేహితులను సంపాదించుకోండి. ఆ సంపద అంతమైపోయినప్పుడు[b], వారు మిమ్మల్ని నిత్య నివాసాల్లోకి[c] స్వీకరించునట్లు చేయండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థానికి దగ్గరగా, ‘అనీతికి చెందిన మమ్మోనుతో’; ‘మమ్మోను’ అనేది సంపద లేదా ధనాన్ని సూచించే గ్రీకు పదానికి పారంపర్య అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీరు మరణించినప్పుడు,’ లేదా ‘అది అయిపోయినప్పుడు.’ ఇక్కడ గ్రీకు క్రియ యొక్క కర్త స్పష్టంగా చెప్పబడలేదు. చాలామంది దానిని సంపదకు వర్తింపజేస్తారు; కొందరు వ్యక్తి మరణానికి వర్తింపజేస్తారు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘నిత్య గుడారాల్లోకి స్వీకరించునట్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: మీ కోసం స్నేహితులను సంపాదించుకోండి
  rationale: ఆత్మార్థక దత్తివిభక్తిని, ఆజ్ఞార్థక క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘స్నేహితులను చేసుకోండి’ కంటే ‘సంపాదించుకోండి’ సాధారణ తెలుగు వాడుకకు అనుకూలం.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: అనీతియైన సంపదను ఉపయోగించి
  rationale: ἐκ యొక్క సందర్భానుసార సాధనార్థాన్ని ‘ఉపయోగించి’ తెలియజేస్తుంది. τῆς ἀδικίας యొక్క విస్తృత నైతిక భావాన్ని నిలుపుతూ, ఇది కేవలం మోసంతో సంపాదించిన ధనమే అని పరిమితం చేయదు.
- source_word: μαμωνᾶ
  choice: సంపద
  rationale: ‘మమ్మోను’ అనే అపరిచిత పారంపర్య పదం కంటే అర్థాన్ని స్పష్టంగా తెలియజేసే సహజ తెలుగు పదం; పారంపర్య రూపం పాదసూచికలో ఉంచబడింది.
- source_word: τῆς ἀδικίας
  choice: అనీతియైన
  rationale: ἀδικίαలోని అనీతి/అన్యాయ భావాన్ని విస్తృతంగా నిలుపుతుంది; ‘మోసపూరితమైన’ అని అనువదిస్తే అక్రమంగా సంపాదించిన ధనానికి మాత్రమే భావం పరిమితమయ్యే ప్రమాదం ఉంది.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: ఆ సంపద లేకుండా పోయినప్పుడు … ఆహ్వానించేలా
  rationale: సందర్భంలో సమీప పూర్వపదమైన సంపదనే ἐκλίπῃ యొక్క భావిత కర్తగా తీసుకుంటుంది; క్రియలోని ‘విఫలమవడం/అంతమవడం’ భావాన్ని సహజ తెలుగులో ‘లేకుండా పోవడం’గా ఇస్తుంది. ఇతర సాధ్యమైన అవగాహనలను పాదసూచికలో ఉంచుతుంది.
- source_word: δέξωνται ὑμᾶς
  choice: వారు మిమ్మల్ని … ఆహ్వానించేలా
  rationale: δέχομαιలోని స్వాగతించి చేర్చుకొనే భావాన్ని సందర్భానికి తగిన సహజ తెలుగులో తెలియజేస్తుంది; ‘వారు’ ఎవరన్నది మూలపాఠంలాగే పేర్కొనకుండా వదిలివేస్తుంది.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: నిత్య నివాసాల్లోకి
  rationale: σκηναί యొక్క నివాసస్థల భావాన్ని చదవడానికి సహజంగా అందిస్తుంది; దాని అక్షరార్థమైన ‘గుడారాలు’ పాదసూచికలో నిలుపబడింది. αἰωνίουςను ‘నిత్య’గా అనువదించింది.
theological_decisions:
- issue: ‘అనీతియైన సంపద’ యొక్క భావం
  choice: ప్రస్తుత అనీతిమయ లోకంతో ముడిపడిన సంపద అనే విస్తృత భావాన్ని నిలపడం
  alternative: మోసంతో లేదా అన్యాయంగా సంపాదించిన ధనం మాత్రమే; లేదా వ్యక్తీకరించబడిన ‘మమ్మోను’
  rationale: ఈ మాట లోకసంబంధ సంపదను వివేకంగా ఉపయోగించడం గురించి ఉంది. దానిని అక్రమార్జనకు మాత్రమే పరిమితం చేయడం గానీ, ఇక్కడ తప్పనిసరిగా వ్యక్తీకృత ప్రత్యర్థి యజమానిగా చూపడం గానీ మూలపాఠం కంటే ఎక్కువ వివరణను చేర్చుతుంది.
- issue: ἐκλίπῃ యొక్క కర్త
  choice: సంపద లేకుండా పోవడం
  alternative: మీరు విఫలమవడం, అంటే మరణించడం; లేదా లోకసంబంధ వనరులు సాధారణంగా అంతమవడం
  rationale: సమీపమైన సహజ పూర్వపదం μαμωνᾶς. అయితే గ్రీకులో కర్త ప్రత్యక్షంగా లేదు కాబట్టి వ్యక్తి మరణాన్ని సూచించే అవగాహనను పాదసూచికలో సంరక్షించింది.
- issue: ఆహ్వానించే ‘వారు’ ఎవరు
  choice: గుర్తింపును స్పష్టీకరించకుండా ఉంచడం
  alternative: సంపద ద్వారా ఏర్పడిన స్నేహితులు; పేదలు లేదా దేవుని ప్రజలు; పరలోక సంబంధ జీవులు
  rationale: δέξωνται క్రియ యొక్క కర్తను గ్రీకు పాఠం ప్రత్యేకంగా గుర్తించదు. ఒక నిర్దిష్ట గుర్తింపును చేర్చడం అతివ్యాఖ్యానం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఆజ్ఞ, సాధనార్థం, సంపద నశ్వరత, ‘వారు’ అనే అస్పష్ట కర్త అన్నీ నిలుపబడ్డాయి. ప్రధాన వాక్యం సహజంగా ఉండేందుకు ఉద్దేశార్థక నిర్మాణాన్ని చివర ‘ఆహ్వానించేలా అలా చేయండి’గా స్పష్టపరచింది.
