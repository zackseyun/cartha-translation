review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the imperative, the instrumental use of unrighteous wealth, the likely reference of ἐκλίπῃ to wealth, the unstated subject of ‘they,’ and the eternal dwellings. However, ‘ఆహ్వానించేలా అలా చేయండి’ adds a second imperative-like instruction not present in Greek and weakens the direct purpose relation. ‘ఆహ్వానించు’ means ‘invite’ more naturally than δέξωνται (‘receive/welcome’).
  naturalness: Most wording is modern and clear. The final clause is unnecessarily repetitive and syntactically cumbersome. A single imperative followed by a purpose clause is more idiomatic Telugu.
  terminology: ‘అనీతియైన సంపద,’ ‘స్నేహితులను సంపాదించుకోండి,’ and ‘నిత్య నివాసాలు’ are suitable. ‘స్వీకరించు’ better preserves the hospitable-reception sense of δέξωνται than ‘ఆహ్వానించు.’ The traditional ‘మమ్మోను’ alternative and literal ‘గుడారాలు’ are appropriately retained in notes.
  issues:
  - severity: medium
    issue: The phrase ‘ఆహ్వానించేలా అలా చేయండి’ introduces an extra directive and uses a less exact verb.
    rationale: 'Greek has one command, ποιήσατε, followed by ἵνα purpose: make friends ... so that they may receive/welcome you. Telugu should not add ‘do so,’ and δέξωνται is better rendered ‘స్వీకరించునట్లు’ or ‘స్వాగతించునట్లు,’ not ‘invite.’'
  - severity: low
    issue: Footnote b’s ‘మీరు లేకుండా పోయినప్పుడు’ is unnatural for the proposed death reading.
    rationale: For the alternate interpretation that ἐκλίπῃ refers to the disciples’ death, ‘మీరు మరణించినప్పుడు’ states the intended sense naturally without presenting an odd literal Telugu expression.
  revised_text: 'నేనూ మీతో చెప్తున్నాను: అనీతియైన సంపదను ఉపయోగించి[a] మీ కోసం స్నేహితులను సంపాదించుకోండి. ఆ సంపద అంతమైపోయినప్పుడు[b], వారు మిమ్మల్ని నిత్య నివాసాల్లోకి[c] స్వీకరించునట్లు చేయండి.'
