  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: te
  text: డబ్బును ప్రేమించేవారైన పరిసయ్యులు ఇవన్నీ వింటూ, ఆయనను ఎగతాళి చేస్తూ[a] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను చూసి ముక్కు చిట్లిస్తూ ఉన్నారు.” ఈ క్రియ బహిరంగ అవహేళనను లేదా తిరస్కారంతో కూడిన అపహాస్యాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: వింటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం సందర్భంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; అందువల్ల సాధారణ ‘విన్నారు’ కంటే ‘వింటూ ఉన్నారు’ మూలంలోని క్రియాంశాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన మార్పును సూచిస్తుంది. తెలుగులో వాక్యక్రమమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘అయితే’ అనడం మూలంలో లేని బలమైన వ్యత్యాసాన్ని కలిగించవచ్చు.
- source_word: ταῦτα πάντα
  choice: ఇవన్నీ
  rationale: ముందు యేసు చెప్పిన బోధలన్నిటినీ సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: సువార్తల్లోని యూద మతవర్గానికి తెలుగులో స్థిరంగా వాడే పేరు.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: డబ్బును ప్రేమించేవారైన
  rationale: φιλάργυροι అనే పదంలోని ‘డబ్బుపై ప్రేమ’ అనే స్పష్టమైన భావాన్ని నిలుపుతుంది; ‘లోభులు’ వంటి విస్తృతమైన నైతిక వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: ἐξεμυκτήριζον
  choice: ఎగతాళి చేస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను, అలాగే బహిరంగ అవహేళన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: సందర్భంలో యేసును సూచిస్తుంది; గౌరవప్రదమైన సాధారణ తెలుగు సర్వనామం వాడబడింది.
theological_decisions:
- issue: φιλάργυροι ద్వారా పరిసయ్యుల స్వభావ చిత్రణ
  choice: డబ్బును ప్రేమించేవారు
  alternative: లోభులు
  rationale: గ్రీకు పదం నేరుగా డబ్బుపై ప్రేమను సూచిస్తుంది. ఈ అనువాదం సంపద గురించి ముందున్న యేసు బోధతో సంబంధాన్ని నిలుపుతూ, మరింత విస్తృతమైన నైతిక అర్థాన్ని రుద్దకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. రెండు అసంపూర్ణ భూతకాల క్రియల కొనసాగుతున్న భావాన్ని ‘వింటూ’, ‘ఎగతాళి చేస్తూ’ అనే నిర్మాణాలతో నిలిపాం. గమనిక సూచిక [a] ప్రధాన వచనంలో సంబంధిత పదబంధం తరువాత ఉంచబడింది.
