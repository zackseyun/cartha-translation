id: LUK.16.7
reference: Luke 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: te
  text: తరువాత అతడు మరొకనితో, “నువ్వు ఎంత బాకీ ఉన్నావు?” అని అడిగాడు. అతడు, “వంద కోరుల[b] గోధుమలు” అన్నాడు. అతడు అతనితో, “నీ బాకీ పత్రం[a] తీసుకుని, ఎనభై అని రాయి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ రాత ఒప్పందం’ లేదా ‘నీ పత్రాలు’; గ్రీకులో అక్షరార్థంగా ‘నీ రాతలు’ (τὰ γράμματα). ఇక్కడ ఇది రుణగ్రహీత బాకీని నమోదు చేసిన పత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కోరు’ ధాన్యాన్ని కొలవడానికి ఉపయోగించిన పెద్ద ప్రాచీన ఘనపరిమాణ కొలత.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπειτα
  choice: తరువాత
  rationale: కథలో తదుపరి రుణగ్రహీతవైపు క్రమంగా మారడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἑτέρῳ
  choice: మరొకనితో
  rationale: ముందు ప్రస్తావించిన రుణగ్రహీతకు భిన్నమైన ఇంకొక వ్యక్తిని సూచిస్తుంది; మూలంలో లేని లింగాన్ని చేర్చదు.
- source_word: Σὺ δὲ πόσον ὀφείλεις
  choice: నువ్వు ఎంత బాకీ ఉన్నావు?
  rationale: Σὺ అనే ఉద్ఘాటిత సర్వనామాన్ని ప్రత్యక్ష సంబోధనగా ఉంచి, ఆర్థిక రుణాన్ని సాధారణ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἑκατὸν κόρους σίτου
  choice: వంద కోరుల గోధుమలు
  rationale: κόρος అనే నిర్దిష్ట ప్రాచీన ధాన్య కొలతను సాధారణ ‘కొలతలు’గా మార్చకుండా లిప్యంతరీకరించి, σῖτοςను సందర్భానుసారంగా ‘గోధుమలు’గా అనువదిస్తుంది.
- source_word: λέγει αὐτῷ
  choice: అతడు అతనితో … అంటాడు
  rationale: మూల గ్రీకులో గతకాల కథనం మధ్య వచ్చిన చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ కథన సజీవతను కాపాడుతుంది.
- source_word: Δέξαι
  choice: తీసుకుని
  rationale: పత్రాన్ని తన చేతిలోకి తీసుకోవాలనే ఆజ్ఞను సందర్భానికి సహజంగా తెలియజేస్తుంది.
- source_word: σου τὰ γράμματα
  choice: నీ బాకీ పత్రం
  rationale: అక్షరార్థంగా బహువచనంలో ‘నీ రాతపత్రాలు’ అయినప్పటికీ, ఈ రుణ సందర్భంలో బాకీని నమోదు చేసిన పత్రాన్ని సూచిస్తుంది; ఏకవచనం తెలుగులో సహజంగా ఉంది.
- source_word: γράψον ὀγδοήκοντα
  choice: ఎనభై అని రాయి
  rationale: లిఖిత మొత్తాన్ని ఎనభైగా నమోదు చేయమనే ప్రత్యక్ష ఆజ్ఞను మూలానికి దగ్గరగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ప్రత్యక్ష సంభాషణ, ఉద్ఘాటిత సంబోధన, చివరి క్రియలోని చారిత్రక వర్తమాన కాలం నిలుపబడ్డాయి. ప్రాచీన కొలత పేరు వివరణతో పాటు లిప్యంతరీకరించబడింది.
