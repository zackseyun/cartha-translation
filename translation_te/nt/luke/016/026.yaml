revisions:
- from: ఇవన్నీ కాకుండా, మాకూ మీకూ మధ్య గొప్ప అగాధం స్థిరపరచబడి ఉంది. అందువల్ల ఇక్కడి నుంచి మీ దగ్గరికి దాటాలనుకునేవారు దాటలేరు; అక్కడి నుంచి మా దగ్గరికి కూడా ఎవరూ దాటి రాలేరు.
  to: ఇవన్నిటికీ తోడు, మాకూ మీకూ మధ్య ఒక గొప్ప అగాధం స్థిరపరచబడి ఉంది; దానివల్ల ఇక్కడి నుంచి మీ దగ్గరికి దాటాలనుకునేవారు దాటలేరు, అలాగే అక్కడి నుంచి మా దగ్గరికి దాటి రాలేరు.
  rationale: The opening phrase has been changed to an unambiguously additive modern Telugu expression, matching the discourse force of καὶ ἐν πᾶσι τούτοις and the English audit trail. The final clause now preserves the Greek’s implicit parallel subject while retaining the directional contrast and inability. The footnote supplies the literal lexical alternative without burdening the main text.
