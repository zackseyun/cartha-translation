id: LUK.16.26
reference: Luke 16:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: te
  text: ఇవన్నిటికీ తోడు, మాకూ మీకూ మధ్య ఒక గొప్ప అగాధం స్థిరపరచబడి ఉంది; దానివల్ల ఇక్కడి నుంచి మీ దగ్గరికి దాటాలనుకునేవారు దాటలేరు, అలాగే అక్కడి నుంచి మా దగ్గరికి దాటి రాలేరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: ఇవన్నీ కాకుండా
  rationale: సందర్భంలో ఈ పదబంధం ముందుగా చెప్పిన విషయానికి మరొక నిర్ణాయక అంశాన్ని జోడిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘ఇవన్నీ కాకుండా’ ఆ అనుసంధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: మాకూ మీకూ మధ్య
  rationale: రెండు వర్గాల మధ్యనున్న విభజనను సహజంగా తెలియజేస్తుంది; గ్రీకులోని బహువచన సంబోధనను తెలుగు ‘మీకు’ సందర్భానుసారంగా మోయగలదు.
- source_word: χάσμα μέγα
  choice: గొప్ప అగాధం
  rationale: ‘అగాధం’ దాటలేని లోతైన అంతరాన్ని సూచిస్తుంది; μέγα యొక్క బలాన్ని ‘గొప్ప’ నిలుపుతుంది.
- source_word: ἐστήρικται
  choice: స్థిరపరచబడి ఉంది
  rationale: పర్ఫెక్ట్ పాసివ్ రూపంలోని ఏర్పరచబడిన, కొనసాగుతున్న స్థిరస్థితి రెండింటినీ ఈ ప్రయోగం నిలుపుతుంది; దానిని ఎవరు స్థిరపరిచారో వచనం చెప్పనందున కర్తను చేర్చలేదు.
- source_word: ὅπως
  choice: అందువల్ల
  rationale: ఈ సందర్భంలో ముందున్న స్థిరమైన అగాధం వల్ల కలిగే ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తుంది; గ్రీకు పదం ఉద్దేశం లేదా ఫలితం అనే స్వల్ప అనిశ్చితిని కలిగి ఉండవచ్చు.
- source_word: οἱ θέλοντες διαβῆναι
  choice: దాటాలనుకునేవారు
  rationale: కర్తృవాచక కృదంతంలోని కోరికను మరియు సాధారణ వర్గ సూచనను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται
  choice: ఇక్కడి నుంచి మీ దగ్గరికి ... దాటలేరు
  rationale: మాట్లాడుతున్నవారి దృష్టికోణాన్ని ‘ఇక్కడి నుంచి’ నిలుపుతూ, μὴ δύνωνται నిషేధం కాక అసమర్థతను సూచిస్తుందని ‘దాటలేరు’ స్పష్టం చేస్తుంది.
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: అక్కడి నుంచి మా దగ్గరికి కూడా ఎవరూ దాటి రాలేరు
  rationale: వ్యతిరేక దిశలోనూ అదే అసాధ్యత ఉందని సహజ తెలుగులో తెలియజేస్తుంది; ‘దాటి రాలేరు’ గమ్యం మాట్లాడేవారి వైపు అని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: రెండు ప్రాంతాల మధ్య విభజన స్వభావం
  choice: వచనం చెప్పినట్లుగా ఆ విభజన స్థిరమైనదనీ, దాటడం అసాధ్యమనీ అనువదించాం.
  alternative: దీనిని పరలోకంలోని అక్షరార్థ భౌగోళిక నిర్మాణంగా వివరించడం, లేదా స్థిరమైన మరణానంతర విభజనకు ఎలాంటి సూచనలేని కేవలం అలంకారంగా పరిమితం చేయడం.
  rationale: వచనం అగాధం స్థిరపరచబడిందని, ఇరువైపుల నుంచి దాటలేరని బలంగా చెబుతుంది. అయితే ఉపమానాన్ని మించి వ్యవస్థీకృత సిద్ధాంత వివరణను అనువాదంలో చేర్చలేదు.
- issue: ἐστήρικται లో సూచింపబడని కర్త
  choice: ‘స్థిరపరచబడి ఉంది’ అనే కర్మణి రూపాన్ని నిలిపాం.
  alternative: ‘దేవుడు స్థిరపరిచాడు’ అని కర్తను స్పష్టంగా చేర్చడం.
  rationale: దైవకర్మణి భావం ఉండవచ్చుగానీ, గ్రీకు వాక్యంలో కర్త ప్రత్యక్షంగా లేదు; అందువల్ల అనువాదం దానిని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. మూలంలోని స్థిరత్వం, అసమర్థత, రెండు దిశల సమాంతర భావం కాపాడబడ్డాయి.
