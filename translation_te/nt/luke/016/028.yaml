lexical_decisions:
- source_word: ἔχω γὰρ
  choice: ఎందుకంటే నాకు ... ఉన్నారు
  rationale: γάρ ముందటి విన్నపానికి కారణాన్ని వివరిస్తుంది; ἔχω సాధారణంగా ‘కలిగి ఉండటం/ఉండటం’ అనే అర్థం ఇస్తుంది. ఆధునిక తెలుగులో ఈ నిర్మాణం సహజంగా ఉంది.
- source_word: πέντε ἀδελφούς
  choice: ఐదుగురు సోదరులు
  rationale: ἀδελφούς పుంలింగ బహువచనం; ఇక్కడ పురుష సహోదరులనే సూచిస్తుంది.
- source_word: ὅπως διαμαρτύρηται αὐτοῖς
  choice: అతడు వారికి గంభీరంగా హెచ్చరించాలి
  rationale: ὅπως ఉద్దేశాన్ని సూచిస్తుంది. διαμαρτύρομαιలో గంభీరంగా సాక్ష్యమివ్వడం లేదా బలంగా హెచ్చరించడం అనే భావపరిధి ఉంది; తరువాతి నివారణాత్మక వాక్యభాగం దృష్ట్యా ‘గంభీరంగా హెచ్చరించాలి’ సందర్భోచితం.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: వారు కూడా ... రాకుండా
  rationale: ἵνα μή ప్రతికూల ఉద్దేశాన్ని, καὶ αὐτοὶ ‘వారు కూడా’ అనే భావాన్ని తెలియజేస్తాయి. ‘రాకుండా’ తెలుగులో ఉద్దేశ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: ఈ యాతనాస్థలానికి
  rationale: εἰς గమ్యాన్ని సూచిస్తుంది. βάσανος తీవ్రమైన బాధ లేదా యాతనను సూచిస్తుంది; సమాస రూపం తెలుగులో సహజంగా ఉండి మూలంలోని ‘ఈ యాతన స్థలం’ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ధనవంతుడు పరలోక స్థితిని వర్ణించిన మాటల అనువాదం
  choice: ఈ యాతనాస్థలానికి
  alternative: ఈ వేదనాస్థలానికి
  rationale: βάσανοςలోని తీవ్రమైన బాధ భావాన్ని ‘యాతన’ నిలుపుతుంది; ఈ వచనం చెప్పినదానిని మించి ఆ స్థలం గురించి సిద్ధాంతపరమైన వివరాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కారణ సంబంధం, ఉద్దేశం, ప్రతికూల ఉద్దేశం స్పష్టంగా నిలుపబడ్డాయి; διαμαρτύρηται యొక్క భావవిస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
