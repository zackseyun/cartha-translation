translation:
  language: te
  text: ఎందుకంటే నాకు ఐదుగురు సోదరులు ఉన్నారు; వారు కూడా ఈ యాతన స్థలానికి రాకుండా ఉండేందుకు అతడు వారికి గంభీరంగా హెచ్చరించాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు వారికి గంభీరంగా సాక్ష్యమివ్వాలి’ లేదా ‘అతడు వారిని బలంగా హెచ్చరించాలి.’ గ్రీకు క్రియలో గంభీరంగా సాక్ష్యమివ్వడం లేదా హెచ్చరించడం అనే భావాలు ఉన్నాయి.
