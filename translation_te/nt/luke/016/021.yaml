source:
  edition: SBLGNT
  text: καὶ ἐπιθυμῶν χορτασθῆναι ⸀ἀπὸ τῶν πιπτόντων ἀπὸ τῆς τραπέζης τοῦ πλουσίου· ἀλλὰ καὶ οἱ κύνες ἐρχόμενοι ⸀ἐπέλειχον τὰ ἕλκη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: te
  text: ధనవంతుని బల్లమీద నుంచి పడుతున్న వాటితో కడుపు నిండాలని అతడు ఆశపడేవాడు.[a] అయితే కుక్కలు కూడా వచ్చి అతని పుండ్లను నాకుతుండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధనవంతుని బల్లమీద నుంచి పడుతున్న ఆహారపు ముక్కలతో.’ గ్రీకు మూలంలో అక్షరార్థంగా ‘పడుతున్న వాటితో’ అని ఉంది; అవి ఆహారపు ముక్కలని భోజన సందర్భం నుంచి అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: ఆశపడేవాడు
  rationale: వర్తమాన కృదంతం లాజరు కొనసాగుతూ కలిగిన బలమైన కోరికను సూచిస్తుంది; సందర్భంలో సహజమైన తెలుగులో దీన్ని అసంపూర్ణ భూతకాల క్రియగా వ్యక్తం చేశాం.
- source_word: χορτασθῆναι
  choice: కడుపు నింపుకోవాలని
  rationale: ఆహారం తిని తృప్తి పొందాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలోని ఆకలిని స్పష్టంగా ఉంచుతుంది.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: పడుతున్న వాటితో
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతంలోని కొనసాగుతున్న భావాన్ని కాపాడుతుంది; మూలంలో లేని ‘ముక్కలు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: τῆς τραπέζης
  choice: బల్లమీద నుంచి
  rationale: భోజన సందర్భంలోని τράπεζα పదానికి సాధారణ, సహజ తెలుగు సమానార్థకం.
- source_word: τοῦ πλουσίου
  choice: ధనవంతుని
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని ముందటి ధనవంతునికి స్పష్టంగా అన్వయిస్తుంది.
- source_word: ἀλλὰ καὶ
  choice: అయితే ... కూడా
  rationale: వ్యతిరేకతతో పాటు ఆశ్చర్యకరమైన అదనపు అంశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ κύνες
  choice: కుక్కలు
  rationale: మూలంలోని సాధారణ బహువచన నామవాచకాన్ని నేరుగా అనువదిస్తుంది.
- source_word: ἐρχόμενοι
  choice: వచ్చి
  rationale: ప్రధాన క్రియకు అనుబంధంగా ఉన్న కృదంతాన్ని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంగా అందిస్తుంది.
- source_word: ἐπέλειχον
  choice: నాకుతుండేవి
  rationale: అసంపూర్ణ భూతకాలం సూచించే కొనసాగుతున్న లేదా పునరావృత చర్యను కాపాడుతుంది.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: అతని పుండ్లను
  rationale: ἕλκη సూచించే పుండ్లు లేదా తెరచిన గాయాలకు ‘పుండ్లు’ ఖచ్చితమైన, సాధారణ తెలుగు పదం.
