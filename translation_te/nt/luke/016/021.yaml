translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. గ్రీకు అసంపూర్ణ భావాన్ని ‘ఆశపడేవాడు’, ‘నాకుతుండేవి’ రూపాలతో నిలిపి, ‘పడుతున్న వాటితో’ అనే మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠ్యంలో కాపాడాం.
