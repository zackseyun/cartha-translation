review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the ongoing desire (ἐπιθυμῶν), the deliberately unspecified substantival participle ‘what was falling’ (τῶν πιπτόντων), the table’s rich owner, and the imperfective action of the dogs licking Lazarus’s sores (ἐπέλειχον). ‘కడుపు నింపుకోవాలని,’ however, can imply that Lazarus himself would actively fill his stomach, whereas χορτασθῆναι is passive, expressing his desire to be fed/satisfied.
  naturalness: The Telugu is clear, modern, and appropriately restrained. Replacing ‘కడుపు నింపుకోవాలని’ with ‘కడుపు నిండాలని’ is more idiomatic in this construction and better reflects the passive/resultative sense without introducing ‘food’ or ‘scraps’ into the main text.
  terminology: ‘ధనవంతుని,’ ‘బల్ల,’ ‘కుక్కలు,’ and ‘పుండ్లు’ are suitable modern-standard Telugu renderings. The footnote appropriately identifies ‘ఆహారపు ముక్కలు’ as a contextual inference rather than wording explicit in the Greek.
  issues:
  - severity: low
    issue: Active/reflexive nuance in ‘కడుపు నింపుకోవాలని’
    rationale: The Greek passive infinitive χορτασθῆναι denotes being fed or becoming satisfied. ‘కడుపు నిండాలని’ naturally expresses that desired result while avoiding an unnecessary suggestion of Lazarus’s agency.
  revised_text: ధనవంతుని బల్లమీద నుంచి పడుతున్న వాటితో కడుపు నిండాలని అతడు ఆశపడేవాడు.[a] అయితే కుక్కలు కూడా వచ్చి అతని పుండ్లను నాకుతుండేవి.
