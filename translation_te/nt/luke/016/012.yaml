id: LUK.16.12
reference: Luke 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: te
  text: మరియు, మరొకరికి చెందిన దానిలో మీరు నమ్మకస్థులుగా ఉండకపోతే, మీ సొంతమైనదాన్ని మీకు ఎవరు ఇస్తారు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మరొకరికి చెందినది,” “మీ సొంతమైనది” అనే వ్యత్యాసం ఇప్పుడు లోకసంబంధమైన సంపదను నమ్మకంగా నిర్వహించడానికి, తరువాత నిజమైన లేదా శాశ్వతమైన సంపదను పొందడానికి మధ్య ఉండవచ్చు; అయితే ఈ వాక్యం వాటిని స్పష్టంగా గుర్తించదు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: మరొకరికి చెందినదాని
  rationale: వ్యాసంతో కూడిన నపుంసక ఏకవచన విశేషణం నామవాచకంగా పనిచేసి, ‘మరొకరికి చెందినది’ అనే భావాన్ని ఇస్తుంది. ఈ రూపం స్వామ్యభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πιστοὶ
  choice: నమ్మకంగా
  rationale: ఇక్కడ πιστός విశ్వాసం కలిగి ఉండడాన్ని కాక, అప్పగించబడిన దాని నిర్వహణలో విశ్వసనీయతను సూచిస్తుంది.
- source_word: οὐκ ἐγένεσθε
  choice: మీరు నమ్మకంగా ఉండకపోతే
  rationale: γίνομαι యొక్క భూతకాల రూపం ఇక్కడ ఒక స్థితిలో ఉండడం లేదా అలా నిరూపించుకోవడం అనే భావంలో ఉంది. షరతు వాక్యంలో ‘ఉండకపోతే’ సహజంగా ఉంది.
- source_word: τὸ ὑμέτερον
  choice: మీ సొంతమైనదాన్ని
  rationale: వ్యాసంతో కూడిన నపుంసక ఏకవచనం ‘మీదైనది’ అనే నామవాచక భావాన్ని ఇస్తుంది; ఇది ἀλλοτρίῳతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: δώσει ὑμῖν
  choice: మీకు ఇస్తారు
  rationale: δίδωμι యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం’ను నిలిపి, సందర్భం సూచించే ‘అప్పగించడం’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: καὶ εἰ
  choice: మరియు ... అయితే
  rationale: καί ముందటి మాటతో అనుసంధానిస్తుంది; εἰ షరతును ప్రవేశపెడుతుంది. తెలుగులో సహజ ప్రవాహం కోసం ‘మరొకరికి... ఉండకపోతే’గా వ్యక్తీకరించబడింది.
- source_word: τίς
  choice: ఎవరు
  rationale: ఇది ఇచ్చేవారి గురించి వేసిన అలంకారిక ప్రశ్న; ‘ఎవరు’ ప్రత్యక్షమైన సహజ అనువాదం.
theological_decisions:
- issue: ‘మరొకరికి చెందినది’ మరియు ‘మీ సొంతమైనది’ మధ్య వ్యత్యాసం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ఆ రెండింటి నిర్దిష్ట సూచనలను పేర్కొనకుండా వ్యత్యాసాన్ని మాత్రమే నిలుపడం.
  alternative: ఇప్పటి లోకసంబంధమైన ధనానికి భిన్నంగా తరువాత లభించే నిజమైన లేదా శాశ్వతమైన సంపద అని స్పష్టీకరించడం.
  rationale: ఈ వాక్యం వాటి సూచనలను స్వయంగా నిర్దిష్టంగా చెప్పదు. కాబట్టి లోకసంబంధమైన సంపద–నిజమైన సంపద, భూలోక బాధ్యత–భవిష్యత్తు వారసత్వం వంటి వ్యాఖ్యానాలలో ఒక్కదానిని ప్రధాన పాఠ్యంలో స్థిరపరచకుండా అసలు వాక్యంలోని భావ ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నమ్మకంగా’ అనేది నిర్వహణలో విశ్వసనీయతను సూచిస్తుంది. ‘ఇస్తారు’ అని మూలంలోని సాధారణ క్రియను నిలిపి, ‘అప్పగిస్తారు’ అనే సందర్భానుగుణ వ్యాఖ్యానాన్ని నివారించాం.
