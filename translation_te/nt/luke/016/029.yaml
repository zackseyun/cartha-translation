  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: te
  text: 'అయితే అబ్రాహాము ఇలా అన్నాడు: “వారికి మోషే, ప్రవక్తలు ఉన్నారు[a]; వారు వారి మాటను ఆలకించాలి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మోషే, ప్రవక్తలు” అంటే మోషేకు ఆపాదించబడిన లేఖనాలు మరియు ప్రవక్తల గ్రంథాల సాక్ష్యం.
    reason: cross_reference
  - marker: b
    text: మరింత అక్షరార్థంగా, “వారు వారిని విననివ్వండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: అయితే ... ఇలా అన్నాడు
  rationale: λέγει అనే చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా అనువదించాం. δέ ఇక్కడ జవాబులోని స్వల్ప వ్యత్యాసాన్ని సూచిస్తున్నందున ‘అయితే’ అని ఇచ్చాం.
- source_word: Ἀβραάμ
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: Ἔχουσι
  choice: వారికి ... ఉన్నారు
  rationale: వారికి ఇప్పటికే అందుబాటులో ఉన్న సాక్ష్యాన్ని సూచించే సాధారణ వర్తమాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: మోషే, ప్రవక్తలు
  rationale: మోషేతో సంబంధమున్న లేఖనాలను, ప్రవక్తల గ్రంథాలను సూచించే యూదుల సంప్రదాయ సంక్షిప్త ప్రయోగాన్ని విస్తరించకుండా నిలుపుతుంది.
- source_word: ἀκουσάτωσαν
  choice: వినాలి
  rationale: మూడవ పురుష బహువచన ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం శబ్దం వినడం కాక, శ్రద్ధగా ఆలకించి పాటించాలనే సందర్భోచిత భావాన్నీ కలిగి ఉంటుంది.
- source_word: αὐτῶν
  choice: వారి మాట
  rationale: సర్వనామం మోషేను, ప్రవక్తలను తిరిగి సూచిస్తుంది. ‘వారి మాట వినాలి’ అనేది తెలుగులో సహజంగా ఉండి, వారి లేఖన సాక్ష్యాన్ని ఆలకించాలనే భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘మోషే, ప్రవక్తలు’ అనే మాటకు సూచన
  choice: ప్రధాన పాఠ్యంలో మూలంలోని సంక్షిప్త ప్రయోగాన్ని అలాగే ఉంచి, పాదసూచికలో అది లేఖన సాక్ష్యాన్ని సూచిస్తుందని వివరించాం.
  alternative: ‘మోషే ధర్మశాస్త్రం, ప్రవక్తల గ్రంథాలు’ అని ప్రధాన పాఠ్యంలోనే విస్తరించడం; లేదా కేవలం చారిత్రక వ్యక్తులుగా అర్థం చేసుకోవడం.
  rationale: లూకా రచనలోను యూదుల వాడుకలోను ఈ పదబంధం సాధారణంగా లేఖన విభాగాలను సూచిస్తుంది. అయినా మూలంలోని రూపక సంక్షిప్తతను అనువాదంలో తొలగించకుండా దాని భావాన్ని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్తతను కాపాడుతూ, ‘వినాలి’ ద్వారా ఆజ్ఞార్థక బలాన్ని సహజంగా వ్యక్తం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
