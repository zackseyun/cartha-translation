id: LUK.16.16
reference: Luke 16:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: te
  text: “ధర్మశాస్త్రమూ ప్రవక్తలూ యోహాను వరకు ఉన్నాయి; అప్పటినుంచి దేవుని రాజ్యం సువార్తగా ప్రకటించబడుతోంది. ప్రతి ఒక్కరూ దానిలోకి బలంగా చొచ్చుకుపోతున్నారు.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి ఒక్కరూ దానిలోకి తీవ్రంగా ప్రవేశిస్తున్నారు.” గ్రీకు క్రియ బలమైన లేదా బలప్రయోగంతో కూడిన కదలికను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: మత్తయి 11:12లోని సమానమైన మాటను బట్టి కొందరు చివరి వాక్యభాగాన్ని మరింత ప్రతికూలంగా అర్థం చేసుకుంటారు. అయితే ఇక్కడ గ్రీకు వాక్యంలో కర్త “ప్రతి ఒక్కరూ”; “రాజ్యం” కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: ఇది సాధారణంగా చట్టాన్ని కాక, మోషే ధర్మశాస్త్రం అనే గుర్తింపు పొందిన లేఖన విభాగాన్ని సూచిస్తుంది.
- source_word: οἱ προφῆται
  choice: ప్రవక్తలు
  rationale: ‘ధర్మశాస్త్రం’తో జతగా వచ్చిన యూదుల లేఖనపరమైన సంప్రదాయ పదాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది; ఇది ప్రవక్తలను, వారి రచనల విభాగాన్ని సూచించగలదు.
- source_word: μέχρι Ἰωάννου
  choice: యోహాను వరకు
  rationale: కాలపరమైన సరిహద్దును సంక్షిప్తంగా, మూలంలోని అస్పష్టతను విస్తరించకుండా తెలియజేస్తుంది; సందర్భంలో ఇతడు బాప్తిస్మమిచ్చే యోహాను.
- source_word: ἀπὸ τότε
  choice: అప్పటినుంచి
  rationale: ఆ కాలసరిహద్దు తరువాత మొదలైన పరిణామాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: βασιλείαలోని రాజ్యం మరియు రాజపాలన అనే భావవిస్తృతిని అనవసరంగా కుదించకుండా నిలిపే ప్రామాణిక తెలుగు పదబంధం.
- source_word: εὐαγγελίζεται
  choice: సువార్తగా ప్రకటించబడుతోంది
  rationale: వర్తమానకాల కర్మణి రూపాన్నీ, εὐαγγελίζωలోని ‘శుభవార్తగా ప్రకటించడం’ అనే భావాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: πᾶς
  choice: ప్రతి ఒక్కరూ
  rationale: ఏకవచన పంపిణీ భావాన్ని సహజమైన తెలుగు సామాన్య బహువచన ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: εἰς αὐτὴν
  choice: దానిలోకి
  rationale: స్త్రీలింగ నామవాచకమైన ‘రాజ్యం’ వైపు ప్రవేశాన్ని సూచించే గ్రీకు పదబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: βιάζεται
  choice: బలంగా చొచ్చుకుపోతున్నారు
  rationale: ఈ మధ్యమ/కర్మణి రూపంలోని బలప్రయోగం లేదా తీవ్రమైన ముందుకు కదలిక భావాన్ని నిలుపుతూ, πᾶς అనే వ్యక్తి-కర్త దానిలోకి ప్రవేశిస్తున్నాడనే వాక్యనిర్మాణానికి సరిపోతుంది.
theological_decisions:
- issue: βιάζεται అనే క్రియకు దేవుని రాజ్యంతో ఉన్న సంబంధం
  choice: ప్రజలు రాజ్యంలోకి తీవ్రమైన, బలమైన కదలికతో చొచ్చుకుపోతున్నారు
  alternative: రాజ్యం హింసకు గురవుతోంది లేదా బలవంతులు దాన్ని స్వాధీనం చేసుకుంటున్నారు
  rationale: ఈ వాక్యంలో βιάζεταιకు కర్త πᾶς (‘ప్రతి ఒక్కరూ’); εἰς αὐτὴν రాజ్యంలోకి కదలికను సహజంగా సూచిస్తుంది. అయినా క్రియలోని బలప్రయోగ భావం మరియు మత్తయి 11:12తో పోలిక వల్ల ఏర్పడే ప్రతికూల పఠనాన్ని పాదసూచికలో నిలిపాం; దీన్ని స్వప్రయత్నంతో రక్షణ సంపాదించుకోవాలనే సిద్ధాంతంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ధర్మశాస్త్రం—ప్రవక్తలు’ అనే లేఖనపరమైన జోడీని సంప్రదాయ పరిచయాన్ని కోల్పోకుండా ఉంచాం. చివరి క్రియలోని నిజమైన అర్థసందిగ్ధతను ప్రధాన పాఠ్యంలో బలమైన కదలికగా, పాదసూచికల్లో ప్రత్యామ్నాయాలుగా నిలిపాం.
