review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast between self-justification before human beings and God’s knowledge of the heart. However, “మనుషుల మధ్య గొప్పగా ఎంచబడేది” can suggest something selected or chosen, rather than the Greek sense of something elevated, esteemed, or held high among people. A small revision preserves the metaphorical ‘high’ language and the social-evaluation nuance.
  naturalness: The Telugu is generally clear and appropriately formal. Replacing the somewhat archaic “ఎరుగుతున్నాడు” with the idiomatic modern expression “దేవునికి ... తెలుసు” improves modern-standard readability without reducing the biblical sense of ‘hearts.’
  terminology: “నీతిమంతులుగా,” “హృదయాలు,” “దేవుని ఎదుట,” and “అసహ్యమైనది” are appropriate. “అసహ్యమైనది” suitably renders βδέλυγμα without importing a technical doctrinal meaning.
  issues:
  - severity: medium
    issue: “గొప్పగా ఎంచబడేది” is narrower than τὸ ἐν ἀνθρώποις ὑψηλὸν.
    rationale: ఎంచబడేది commonly denotes being chosen, whereas the Greek denotes what is high, elevated, or esteemed among human beings. “ఉన్నతమైనదిగా భావించబడేది” retains both the height metaphor and the contextual social esteem.
  - severity: low
    issue: “ఎరుగుతున్నాడు” is less natural in modern standard Telugu.
    rationale: “దేవునికి మీ హృదయాలు తెలుసు” is current idiomatic Telugu and faithfully expresses γινώσκει τὰς καρδίας ὑμῶν.
