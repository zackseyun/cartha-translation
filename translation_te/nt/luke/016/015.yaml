id: LUK.16.15
reference: Luke 16:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు మనుషుల ఎదుట మిమ్మల్ని మీరు నీతిమంతులుగా చూపించుకునేవారు. అయితే దేవునికి మీ హృదయాలు తెలుసు. ఎందుకంటే మనుషుల మధ్య ఉన్నతమైనదిగా భావించబడేది[a] దేవుని ఎదుట అసహ్యమైనది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుషులచే ఎంతో విలువైనదిగా భావించబడేది.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “దేవుని దృష్టిలో హేయమైనది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: మిమ్మల్ని మీరు నీతిమంతులుగా చూపించుకునేవారు
  rationale: ప్రతిబింబక కర్మతో ఉన్న వర్తమాన కృదంతం, ఇతరుల ఎదుట తాము నీతిమంతులమని నిరూపించుకోవడం లేదా కనిపించేలా చేసుకోవడం అనే సందర్భార్థాన్ని ఇస్తుంది. సహజమైన తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తూనే δικαιόω పదంలోని నీతి భావాన్ని నిలుపుతుంది.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: మనుషుల ఎదుట
  rationale: ἐνώπιον యొక్క ‘ఎదుట/దృష్టిలో’ భావాన్ని నేరుగా నిలుపుతుంది; ἀνθρώπων ఇక్కడ స్త్రీపురుషులందరినీ సూచించే సాధారణ మానవార్థక పదం.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: మీ హృదయాలను ఎరుగుతున్నాడు
  rationale: హృదయాలు అనే బైబిలు రూపకాన్ని నిలుపుతూ, అంతరంగం మరియు ఉద్దేశాలు దేవునికి తెలిసినవనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: మనుషుల మధ్య గొప్పగా ఎంచబడేది
  rationale: ὑψηλόν లోని ఉన్నతత్వ భావాన్నీ, సందర్భంలో దానికి ఉన్న సామాజిక గౌరవం/విలువ భావాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది. ‘ఘనంగా భావించబడేది’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: βδέλυγμα
  choice: అసహ్యమైనది
  rationale: దేవునికి జుగుప్సాకరమైన లేదా హేయమైన దానిని సూచించే బలమైన పదం; ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని ఎదుట
  rationale: మొదటి ἐνώπιον పదబంధంతో సమాంతరతను నిలిపి, మానవుల అంచనాకు దేవుని అంచనాకు మధ్య ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: మీరు ... వారు
  rationale: గ్రీకులోని బలమైన ‘మీరే అలాంటివారు’ అనే ఆరోపణాత్మక ఉద్ఘాటనను తెలుగు వాక్య నిర్మాణంలో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: δικαιοῦντες ἑαυτοὺς యొక్క న్యాయపరమైన మరియు ప్రదర్శనాత్మక భావాలు
  choice: మిమ్మల్ని మీరు నీతిమంతులుగా చూపించుకునేవారు
  alternative: మిమ్మల్ని మీరు నీతిమంతులుగా నిరూపించుకునేవారు
  rationale: ఇక్కడ మనుషుల ఎదుట తమను తాము సమర్థించుకోవడం ప్రధాన సందర్భం. ‘చూపించుకునేవారు’ ఆ సామాజిక ప్రదర్శన భావాన్ని అందిస్తుంది; అదే సమయంలో ‘నీతిమంతులు’ ద్వారా δικαιόω తోనున్న ధార్మిక సంబంధాన్ని తొలగించదు.
- issue: τὸ ἐν ἀνθρώποις ὑψηλὸν యొక్క భావ పరిధి
  choice: మనుషుల మధ్య గొప్పగా ఎంచబడేది
  alternative: మనుషుల మధ్య ఘనంగా భావించబడేది
  rationale: ఈ పదబంధం సామాజికంగా ఉన్నతంగా నిలపబడినది, ప్రశంసించబడినది లేదా విలువైనదిగా భావించబడినది అనే భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠం ఈ పరిధిని విస్తృతంగా ఉంచుతుంది; పాదసూచిక మరో సహజ ప్రత్యామ్నాయాన్ని ఇస్తుంది.
- issue: βδέλυγμα యొక్క తీవ్రత
  choice: అసహ్యమైనది
  alternative: హేయమైనది
  rationale: దేవుని దృష్టిలో తీవ్రంగా తిరస్కరించబడినదనే భావాన్ని ఆధునిక పాఠకులకు సహజంగా తెలియజేస్తుంది; ప్రత్యేక మతపరమైన సాంకేతిక అర్థాన్ని అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే ‘నీతిమంతులు,’ ‘హృదయాలు,’ ‘దేవుని ఎదుట’ వంటి మూలపాఠంలోని ముఖ్య బైబిలు పదబంధాలు మరియు మానవ అంచనా–దైవ అంచనా మధ్య సమాంతర వ్యత్యాసం నిలుపబడ్డాయి.
