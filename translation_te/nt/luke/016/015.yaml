revisions:
- from: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు మనుషుల ఎదుట మిమ్మల్ని మీరు నీతిమంతులుగా చూపించుకునేవారు. అయితే దేవుడు మీ హృదయాలను ఎరుగుతున్నాడు. ఎందుకంటే మనుషుల మధ్య గొప్పగా ఎంచబడేది[a] దేవుని ఎదుట అసహ్యమైనది[b].”'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు మనుషుల ఎదుట మిమ్మల్ని మీరు నీతిమంతులుగా చూపించుకునేవారు. అయితే దేవునికి మీ హృదయాలు తెలుసు. ఎందుకంటే మనుషుల మధ్య ఉన్నతమైనదిగా భావించబడేది[a] దేవుని ఎదుట అసహ్యమైనది[b].”'
