id: LUK.16.6
reference: Luke 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: te
  text: అతడు, “వంద బాత్‌ల[a] ఒలీవ నూనె” అన్నాడు. అప్పుడు అతడు అతనితో, “నీ రుణపత్రాలు[b] తీసుకొని, వెంటనే కూర్చొని యాభై అని రాయి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బాత్ అనేది ప్రాచీన కాలంలోని ఒక ద్రవ కొలమానం. గ్రీకు మూలపాఠంలో, “వంద బాత్‌ల ఒలీవ నూనె” అని ఉంది.
    reason: cultural_note
  - marker: b
    text: లేదా “నీ వ్రాతపూర్వక ఒప్పందం” లేదా “నీ పత్రాలు.” గ్రీకులో అక్షరార్థంగా “నీ వ్రాతలు/పత్రాలు.” ఈ సందర్భంలో ఇది అప్పును నమోదు చేసిన రుణపత్రాలను సూచిస్తుంది. గ్రీకు మూలపాఠంలో ఈ పదాలు చతురస్ర కోష్ఠకాలలో ఉన్నాయి; వాటి పాఠస్థితి సందేహాస్పదమని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: బాతుల
  rationale: ఇది సాధారణ కొలత కాదు, ప్రాచీన ద్రవ కొలమానమైన ‘బాతు’. నిర్దిష్టమైన ఆర్థిక వివరాన్ని నిలుపుకోవడానికి మూల యూనిట్‌ను లిప్యంతరీకరించాం; పాఠకునికి పాదటిప్పణిలో వివరణ ఇచ్చాం.
- source_word: ἐλαίου
  choice: ఒలీవ నూనె
  rationale: ఈ సందర్భంలో ἔλαιον ఒలీవ నూనెను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి ‘నూనె’ కంటే ఇది స్పష్టంగా ఉంటుంది.
- source_word: Δέξαι
  choice: తీసుకుని
  rationale: పత్రాన్ని చేతిలోకి తీసుకుని తదుపరి చర్య చేయమనే ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὰ γράμματα
  choice: నీ రుణపత్రం
  rationale: పదశః ‘నీ వ్రాతలు/పత్రాలు’ అయినా, ఈ అప్పు సందర్భంలో రుణాన్ని నమోదు చేసిన పత్రాన్ని సూచిస్తుంది. ‘రుణపత్రం’ స్పష్టంగా, సహజంగా ఉంది; మూలంలోని విస్తృత పదార్థాన్ని పాదటిప్పణి నిలుపుతుంది.
- source_word: καθίσας
  choice: కూర్చొని
  rationale: తదుపరి ఆజ్ఞతో అనుసంధానమైన చర్యగా తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: ταχέως
  choice: వెంటనే
  rationale: వేగంగా, ఆలస్యం చేయకుండా చేయాలనే భావాన్ని ఈ ఆజ్ఞ సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: γράψον
  choice: రాయి
  rationale: రుణపత్రంపై సవరించిన మొత్తాన్ని వ్రాయమనే ప్రత్యక్ష ఆజ్ఞను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: πεντήκοντα
  choice: యాభై
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదిస్తుంది.
