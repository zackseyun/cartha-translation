translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. సందర్భం ద్వారా వక్త నిర్వాహకుడని స్పష్టత కోసం పేర్కొన్నాం. ప్రాచీన కొలమానాన్ని సాధారణీకరించకుండా ‘బాతు’గా నిలిపి, వివరణను పాదటిప్పణిలో ఇచ్చాం.
