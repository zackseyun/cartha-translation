id: LUK.16.2
reference: Luke 16:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: te
  text: 'అతడు ఆ నిర్వాహకుణ్ణి పిలిపించి, అతనితో ఇలా అన్నాడు: ‘నీ గురించి నేను వింటున్న ఈ సంగతి ఏమిటి? నీ నిర్వహణకు సంబంధించిన లెక్కను అప్పగించు[a]. ఇక నువ్వు నిర్వాహకుడిగా కొనసాగలేవు[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ నిర్వహణ లెక్కను సమర్పించు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఇక నువ్వు నిర్వహించలేవు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: ఆ నిర్వాహకుణ్ణి పిలిపించి
  rationale: Aorist participle ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది. సందర్భం ద్వారా αὐτόν నిర్వాహకుణ్ణి సూచిస్తున్నందున, సహజమైన తెలుగులో స్పష్టంగా పేర్కొనబడింది.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: నీ గురించి నేను వింటున్న ఈ సంగతి ఏమిటి?
  rationale: గ్రీకు వాక్యంలోని ప్రశ్నార్థక, నిలదీసే ధోరణిని అతివ్యాఖ్యానం చేయకుండా నిలుపుతుంది.
- source_word: ἀπόδος τὸν λόγον
  choice: లెక్కను అప్పగించు
  rationale: పరిపాలనా సందర్భంలో λόγος అంటే మాట కాక లెక్క లేదా లెక్కల నివేదిక; ἀπόδος యజమానికి దానిని సమర్పించడం లేదా అప్పగించడం అనే భావం ఇస్తుంది.
- source_word: τῆς οἰκονομίας σου
  choice: నీ నిర్వహణకు సంబంధించిన
  rationale: οἰκονομία ఇక్కడ మరొకరి ఆస్తి లేదా ఇంటి వ్యవహారాలను చూసే బాధ్యతను సూచిస్తుంది. ‘నిర్వహణ’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ పరిపాలనా భావాన్ని అందిస్తుంది.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: ఇక నువ్వు నిర్వాహకుడిగా కొనసాగలేవు
  rationale: δύνῃ + infinitive సామర్థ్యం లేకపోవడం లేదా ఇక అనుమతి/స్థితి లేకపోవడం అనే సందర్భోచిత భావాన్ని కలిగి ఉంది; ἔτι యొక్క ‘ఇకపై కాదు’ భావం ‘ఇక ... కొనసాగలేవు’లో నిలిచింది.
theological_decisions:
- issue: 'δύνῃ యొక్క భావం: శారీరక/వ్యవహారిక అసమర్థతా, లేక పదవిలో కొనసాగడానికి ఇక అవకాశం లేకపోవడమా'
  choice: ఇక నువ్వు నిర్వాహకుడిగా కొనసాగలేవు
  alternative: ఇక నువ్వు నిర్వహించలేవు
  rationale: సందర్భంలో యజమాని నిర్వాహకుని పదవి నుంచి తొలగిస్తున్నాడు. ఎంపిక చేసిన రూపం ఆ సందర్భాన్ని సహజంగా తెలియజేస్తుంది; అయితే గ్రీకులోని సాధారణ ‘చేయగలగడం’ భావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నిర్వాహకుడు/నిర్వహణ’ అనే ఒకే పదకుటుంబం οἰκονομία–οἰκονομεῖν సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
