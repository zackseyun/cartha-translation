id: LUK.16.17
reference: Luke 16:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: te
  text: అయితే ధర్మశాస్త్రంలోని ఒక అక్షరపు చిన్న గీతైనా పడిపోవడం కంటే ఆకాశమూ భూమీ గతించిపోవడం సులభం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక్క కొమ్మైనా”—అంటే ఒక అక్షరాన్ని మరొక అక్షరం నుండి వేరుచేసే అతి చిన్న గీత.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: సులభం
  rationale: తులనాత్మక భావం తెలుగు వాక్యంలోని ‘కంటే … సులభం’ నిర్మాణం ద్వారా సహజంగా, స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి సందర్భంతో ఉన్న స్వల్ప వ్యతిరేకతను లేదా భావమలుపును ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: ఆకాశమూ భూమీ
  rationale: సృష్టి సమస్తాన్ని సూచించే బైబిలీయ జంట పదబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: παρελθεῖν
  choice: గతించిపోవడం
  rationale: ఇక్కడ కేవలం పక్కగా వెళ్లడం కాదు, ఉనికి నుండి తొలగిపోవడం అనే సందర్భార్థాన్ని తెలుపుతూ మూలంలోని భావచిత్రాన్ని కాపాడుతుంది.
- source_word: τοῦ νόμου
  choice: ధర్మశాస్త్రంలోని
  rationale: యూదుల లేఖన ధర్మశాస్త్రాన్ని సూచించే νόμος అనే ప్రత్యేక సందర్భార్థాన్ని తెలుగు బైబిలీయ వాడుకలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μίαν κεραίαν
  choice: ఒక అక్షరపు చిన్న గీతైనా
  rationale: κεραία సూచించే అక్షరంలోని అతి చిన్న కొమ్ము లేదా గీతను ఆధునిక పాఠకుడు సులభంగా గ్రహించేలా చెబుతుంది; ‘అయినా’ అతి చిన్న భాగం కూడా అనే ఉద్ఘాటనను అందిస్తుంది.
- source_word: πεσεῖν
  choice: పడిపోవడం
  rationale: మూల క్రియలోని ‘పడడం’ అనే రూపకాన్ని నిలుపుతూ, ధర్మశాస్త్రంలోని చిన్న భాగం కూడా తొలగిపోవడం లేదా విఫలమవడం అనే సందర్భాన్ని అతిగా వివరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: νόμος పదానికి సూచ్యం
  choice: లేఖనాలలోని ధర్మశాస్త్రం
  alternative: సాధారణ అర్థంలోని చట్టం
  rationale: లూకా సందర్భం మరియు లిఖితంలోని అతి చిన్న గీత ప్రస్తావన దీనిని దేవుడు వెల్లడించిన లేఖన ధర్మశాస్త్రంగా సూచిస్తున్నాయి; అనువాదం అంతకుమించిన సిద్ధాంత వివరణను చేర్చదు.
- issue: κεραία చిత్రణ
  choice: ఒక అక్షరపు చిన్న గీత
  alternative: ఒక్క కొమ్ము / తిత్తు
  rationale: ధర్మశాస్త్రంలోని అతి సూక్ష్మమైన లిఖిత వివరానికీ ఉన్న స్థిరత్వాన్ని ఆధునిక తెలుగులో అర్థమయ్యేలా తెలియజేస్తూ మూల చిత్రాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలి. ‘ఆకాశమూ భూమీ’ అనే బైబిలీయ నుడికారాన్ని, ‘పడిపోవడం’ అనే మూల రూపకాన్ని నిలుపుతూ, ‘అక్షరపు చిన్న గీత’ ద్వారా అరుదైన సాంకేతిక పదజాలాన్ని నివారించాం.
