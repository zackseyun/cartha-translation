  source_fidelity: 'Greek comparative construction is accurately represented: it is easier for heaven and earth to pass away than for even one small stroke belonging to the Law to fall. ‘ధర్మశాస్త్రం’ appropriately conveys νόμος in this scriptural context, and ‘పడిపోవడం’ retains πεσεῖν’s imagery without overinterpreting it.'
