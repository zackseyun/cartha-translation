  terminology: ‘ధర్మశాస్త్రం’ is established Telugu biblical terminology for the scriptural Law. ‘అక్షరపు చిన్న గీత’ communicates κεραία intelligibly; the footnote supplies the more literal alternative and explanation without imposing an interpretation.
