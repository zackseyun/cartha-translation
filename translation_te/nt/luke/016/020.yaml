  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘బిచ్చగాడు’ అని ప్రత్యేకంగా నిర్ధారించకుండా πτωχός లోని పేదరిక భావాన్ని నిలిపాం. ప్రధాన పాఠంలో βάλλω యొక్క కఠిన ఛాయను ఉంచి, మృదువైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
