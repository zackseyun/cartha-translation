translation:
  language: te
  text: లాజరు అనే ఒక పేదవాడు అతని గుమ్మం దగ్గర పడవేయబడి, పుండ్లతో కప్పబడి ఉండేవాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని గుమ్మం దగ్గర ఉంచబడి ఉండేవాడు.” గ్రీకు క్రియకు ‘విసిరివేయడం’ లేదా ‘పడవేయడం’ అనే భావం కూడా ఉండవచ్చు; అది లాజరు నిస్సహాయతను, అతని పట్ల చూపిన నిర్లక్ష్యాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పుండ్లతో నిండినవాడు.” గ్రీకు కృదంతం అతడు పుండ్లు లేదా వ్రణాలతో బాధపడుతున్న స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: పేదవాణ్ణి
  rationale: ఈ విశేషణం పేదరికంలో లేదా దారిద్ర్యంలో ఉన్న వ్యక్తిని సూచిస్తుంది. సందర్భం అతని పరాధీనతను చూపించినా, ‘బిచ్చగాడు’ అనే నిర్దిష్ట సామాజిక పాత్రను మూలపాఠం స్పష్టంగా చెప్పదు.
- source_word: τις
  choice: ఒక
  rationale: కొత్త పాత్రను అనిర్దిష్టంగా పరిచయం చేసే τις ను ఆధునిక తెలుగులో సహజమైన ‘ఒక’తో వ్యక్తం చేశాం.
- source_word: ὀνόματι Λάζαρος
  choice: లాజరు అనే
  rationale: ‘పేరు లాజరు’ అనే భావాన్ని తెలుగులో సహజంగా తెలియజేసే నిర్మాణం.
- source_word: ἐβέβλητο
  choice: పడవేసి ఉంచారు
  rationale: βάλλω క్రియ యొక్క పరోక్ష కర్తరి, పూర్వపూర్ణ రూపం అతన్ని ఇతరులు అక్కడ ఉంచారనే భావంతో పాటు ‘విసరడం/పడవేయడం’ అనే కఠిన ఛాయను కలిగి ఉంది. ‘పడవేసి ఉంచారు’ అతని నిస్సహాయతను, అక్కడికి చేర్చబడిన ఫలితస్థితిని రెండింటినీ నిలుపుతుంది.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: అతని గుమ్మం దగ్గర
  rationale: πυλών పెద్ద ఇంటి గుమ్మం లేదా ప్రవేశద్వారాన్ని సూచిస్తుంది; πρός ఇక్కడ దానికి సమీపంలోని స్థానాన్ని తెలియజేస్తుంది.
- source_word: εἱλκωμένος
  choice: అతని ఒళ్లంతా పుండ్లతో నిండి ఉంది
  rationale: ఈ కృదంతం పుండ్లు లేదా వ్రణాలతో బాధపడుతున్న స్థితిని సూచిస్తుంది. ఈ రూపం తెలుగులో స్పష్టంగా, సహజంగా ఆ దయనీయ శారీరక స్థితిని తెలియజేస్తుంది.
