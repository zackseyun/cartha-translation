  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: te
  text: ధనవంతుడైన ఒక మనిషి ఉండేవాడు. అతడు ఊదారంగు వస్త్రాలూ, సన్నని నారవస్త్రాలూ ధరించి, ప్రతిరోజూ వైభవంగా విందు చేసుకుంటూ ఉండేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతిరోజూ వైభవంగా ఆనందంగా గడిపేవాడు.” εὐφραινόμενος అనే పదం ఆనందించడం లేదా విందు చేయడాన్ని సూచించవచ్చు; λαμπρῶς విలాసవంతమైన వైభవాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις ἦν πλούσιος
  choice: ధనవంతుడైన ఒక మనిషి ఉండేవాడు
  rationale: τις అనిర్దిష్ట వ్యక్తిని పరిచయం చేస్తుంది; δέ కథనంలోని మార్పును సూచిస్తుంది. తెలుగులో సహజమైన కథనారంభం కోసం ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా ఈ రూపం ఎంచుకోబడింది.
- source_word: ἐνεδιδύσκετο
  choice: ధరించి ... ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం అలవాటుగా, నిరంతరం జరిగే చర్యను సూచిస్తుంది; ‘ఉండేవాడు’ ఆ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: πορφύραν
  choice: ఊదారంగు వస్త్రాలు
  rationale: ఇది ఊదారంగు అద్దిన విలాసవంతమైన వస్త్రాలను సూచిస్తుంది. కేవలం రంగు పేరుతో అస్పష్టత రాకుండా ‘వస్త్రాలు’ స్పష్టం చేయబడింది.
- source_word: βύσσον
  choice: సన్నని నారబట్టలు
  rationale: βύσσος నాణ్యమైన, మెత్తని నారవస్త్రాన్ని సూచిస్తుంది; ఈ అనువాదం వస్త్రపు స్వభావాన్ని, విలాసాన్ని రెండింటినీ తెలియజేస్తుంది.
- source_word: εὐφραινόμενος
  choice: విందు చేసుకుంటూ
  rationale: ఈ సందర్భంలో ఈ కృదంతం ఉల్లాసంగా ఆనందించడాన్ని, ముఖ్యంగా విలాసవంతమైన విందును సూచించవచ్చు. ధనికుని రోజువారీ విలాసజీవన చిత్రణలో ‘విందు చేసుకుంటూ’ సహజంగా సరిపోతుంది.
- source_word: καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: రోజువారీ పునరావృతిని స్పష్టంగా తెలిపే సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: λαμπρῶς
  choice: వైభవంగా
  rationale: ఈ క్రియావిశేషణం ప్రకాశవంతమైన గొప్పతనాన్ని లేదా విలాసవంతమైన ఘనతను సూచిస్తుంది; సందర్భంలో ‘వైభవంగా’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
