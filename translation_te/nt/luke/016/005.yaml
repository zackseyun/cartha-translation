- from: అప్పుడు అతడు తన యజమానికి అప్పున్నవారిలో ఒక్కొక్కరిని తన దగ్గరికి పిలిపించి, మొదటివానితో, “నువ్వు నా యజమానికి ఎంత బాకీ ఉన్నావు?” అని అడిగాడు.[a]
  to: తన యజమాని అప్పుదారులలో ఒక్కొక్కరిని పిలిచి, అతడు మొదటివానితో, “నువ్వు నా యజమానికి ఎంత బాకీ ఉన్నావు?” అని అడిగాడు.[a]
  rationale: The text removes the added “అప్పుడు” and replaces potentially causative “పిలిపించి” with direct-agent “పిలిచి,” while preserving the Greek participial sequence, distributive sense, commercial terminology, and the contextual rendering of κύριος as “యజమాని.”
  reviewer_model: gpt-5.6-terra
