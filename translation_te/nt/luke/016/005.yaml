id: LUK.16.5
reference: Luke 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: te
  text: తన యజమాని అప్పుదారులలో ఒక్కొక్కరిని పిలిచి, అతడు మొదటివానితో, “నువ్వు నా యజమానికి ఎంత బాకీ ఉన్నావు?” అని అడిగాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు κύριος అనే పదాన్ని తరచుగా “ప్రభువు” అని అనువదిస్తారు; అయితే ఇక్కడ అది నిర్వాహకుని మానవ అధిపతిని సూచిస్తున్నందున “యజమాని” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిపించి
  rationale: మధ్యమ ప్రయోగంలోని కృదంతం, వారిని తన సమక్షానికి పిలిపించుకున్న భావాన్ని ఇస్తుంది; ప్రధాన క్రియకు ముందున్న చర్యగా సహజమైన తెలుగులో వ్యక్తమైంది.
- source_word: ἕνα ἕκαστον
  choice: ఒక్కొక్కరిని
  rationale: ఈ పదసముదాయం పంపిణీ భావాన్ని బలపరుస్తుంది; ‘ఒక్కొక్కరిని’ సంక్షిప్తంగా, సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: χρεοφειλετῶν
  choice: అప్పున్నవారిలో
  rationale: యజమానికి ఆర్థిక బాకీ ఉన్న వ్యక్తులను సూచిస్తుంది; సందర్భానుసారంగా ఆధునిక తెలుగులో స్పష్టమైన పదప్రయోగం.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: తన యజమానికి
  rationale: ἑαυτοῦ నిర్వాహకునికే తిరిగి సూచిస్తుంది; κύριος ఇక్కడ దైవ బిరుదు కాక మానవ అధిపతిని సూచిస్తున్నందున ‘యజమాని’ తగినది.
- source_word: ἔλεγεν
  choice: అని అడిగాడు
  rationale: రూపపరంగా ‘చెబుతూ ఉండేవాడు’ అయినా, ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తున్నందున తెలుగులో ‘అడిగాడు’ సహజం; ఒక్కొక్కరితో జరిగే పునరావృత చర్యను ముందున్న ‘ఒక్కొక్కరిని’ సందర్భం తెలియజేస్తుంది.
- source_word: τῷ πρώτῳ
  choice: మొదటివానితో
  rationale: క్రమంలో మొదటి వ్యక్తిని నేరుగా సూచించే సహజ తెలుగు రూపం.
- source_word: Πόσον
  choice: ఎంత
  rationale: బాకీ మొత్తాన్ని ప్రశ్నించే సందర్భంలో సరళమైన, సహజమైన సమానార్థకం.
- source_word: ὀφείλεις
  choice: బాకీ ఉన్నావు
  rationale: ఆర్థిక ఋణబాధ్యతను ఆధునిక తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: τῷ κυρίῳ μου
  choice: నా యజమానికి
  rationale: μου అనే ప్రథమ పురుష సంబంధాన్ని నిలుపుతూ, κύριος‌ను ఈ గృహ-ఆర్థిక సందర్భంలో మానవ యజమానిగా అనువదించింది.
theological_decisions:
- issue: ఉపమానంలోని గృహ-ఆర్థిక సందర్భంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఈ వచనంలో κύριος నిర్వాహకుని మానవ అధిపతిని సూచిస్తుంది, దేవుని లేదా క్రీస్తు బిరుదును కాదు. ‘యజమాని’ సంబంధాన్ని స్పష్టంగా తెలియజేసి అనవసరమైన దైవార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సంభాషణలో ‘నువ్వు’ యజమాని నిర్వాహకుడు అప్పుదారునితో మాట్లాడే సామాజిక సందర్భానికి సహజంగా సరిపోతుంది.
