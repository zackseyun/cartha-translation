review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the debtors, the master's human status, the distributive force of ἕνα ἕκαστον, and the question. However, “అప్పుడు” is not represented in the Greek text, and “పిలిపించి” can imply causing someone else to summon them rather than the steward himself summoning them. The aorist participle προσκαλεσάμενος is better rendered directly as “పిలిచి.” The imperfect ἔλεγεν is adequately represented in idiomatic Telugu by “అడిగాడు” in this sequential narrative context.
  naturalness: The revision is fluent modern standard Telugu. “పిలిచి” is more direct and natural than “తన దగ్గరికి పిలిపించి”; “అప్పుదారులలో ఒక్కొక్కరిని” is concise and idiomatic.
  terminology: “యజమాని” appropriately renders κύριος here as the steward's human superior. “అప్పుదారులు/బాకీ” clearly retains the commercial-debt setting. The footnote is appropriate and its anchor is retained.
  issues:
  - severity: low
    issue: Unrepresented temporal connective
    rationale: “అప్పుడు” adds an explicit temporal connective not present in the Greek. The participle already supplies the sequence (‘having summoned’), so it is unnecessary.
  - severity: medium
    issue: Possible causative nuance in “పిలిపించి”
    rationale: ప్రోσκαλεσάμενος means that he summoned/called them to himself. “పిలిపించి” may suggest that he had another person call them; “పిలిచి” preserves the steward as the direct actor.
  revised_text: తన యజమాని అప్పుదారులలో ఒక్కొక్కరిని పిలిచి, అతడు మొదటివానితో, “నువ్వు నా యజమానికి ఎంత బాకీ ఉన్నావు?” అని అడిగాడు.[a]
