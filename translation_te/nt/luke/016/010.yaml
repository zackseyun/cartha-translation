reference: Luke 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: te
  text: అతి చిన్న విషయంలో[a] నమ్మకంగా ఉండేవాడు పెద్ద విషయంలో కూడా నమ్మకంగా ఉంటాడు; అతి చిన్న విషయంలో నీతిలేనివాడు[b] పెద్ద విషయంలో కూడా నీతిలేనివాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతి కొద్దిదానిలో.’ గ్రీకు ప్రయోగం చాలా చిన్నదైన లేదా ప్రాముఖ్యతలేనిదైన దాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అన్యాయం చేసేవాడు’ లేదా ‘మోసంగా వ్యవహరించేవాడు.’ గ్రీకు పదం ఆర్థిక మోసం కంటే విస్తృతమైనది; అయితే ఈ సందర్భంలో ఆ భావం కూడా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: నమ్మకంగా ఉండేవాడు
  rationale: ఇక్కడ ఈ పదం కేవలం విశ్వసించడాన్ని కాక, అప్పగించిన విషయాల్లో ఆధారపడదగిన రీతిగా వ్యవహరించడాన్ని సూచిస్తుంది. ఈ ప్రయోగం ఆధునిక తెలుగులో సహజంగా ఉండి, వాక్యంలోని సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἐν ἐλαχίστῳ
  choice: అతి చిన్న విషయంలో
  rationale: ἐν తో వచ్చిన దత్తివిభక్తి పరిధిని లేదా సందర్భాన్ని సూచిస్తుంది. ἐλαχίστῳ అతి స్వల్పమైనది లేదా ప్రాముఖ్యతలేనిదీ అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘విషయంలో’ను చేర్చడం అర్థాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: πολλῷ
  choice: పెద్ద విషయంలో
  rationale: ఇది ἐλαχίστῳకు పరిమాణం లేదా ప్రాముఖ్యత పరంగా విరుద్ధంగా ఉంది. ‘పెద్ద విషయం’ అనే ప్రయోగం తెలుగులో సహజంగా ఉండి చిన్న–పెద్ద వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἄδικος
  choice: నీతిలేనివాడు
  rationale: ఈ గ్రీకు పదం ఆర్థిక మోసం మాత్రమే కాక, విస్తృతంగా నీతికి విరుద్ధమైన ప్రవర్తనను సూచించగలదు. ‘నీతిలేనివాడు’ ఆ విస్తృత నైతిక భావాన్ని కాపాడుతుంది.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: నమ్మకంగా ఉండేవాడు ... నీతిలేనివాడు
  rationale: విశేషణాలతో ఉన్న గ్రీకు నిర్దేశక పదాలు వ్యక్తిని సాధారణ ప్రతినిధిగా సూచిస్తున్నాయి. తెలుగు రూపాలు అనవసర లింగప్రాధాన్యం లేకుండా ఆ సాధారణ భావాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: καὶ
  choice: కూడా
  rationale: రెండు అర్ధభాగాల్లోనూ καί అనురూప వాక్యాలను కలిపి అదనపు భావాన్ని ఇస్తుంది. ‘కూడా’ ఆ సమాంతర సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఆస్తి నిర్వహణ సందర్భంలో ἄδικος అనే నైతిక వర్ణన
  choice: నీతిలేనివాడు
  alternative: మోసగాడు / అన్యాయం చేసేవాడు
  rationale: ఈ మాట ధన నిర్వహణకే పరిమితమైన తీర్పు కాక, సాధారణ నైతిక సూత్రాన్ని ప్రకటిస్తుంది. అందువల్ల ‘మోసగాడు’ అని సంకుచితం చేయకుండా గ్రీకు పదంలోని విస్తృత నైతిక భావాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడబడింది. గ్రీకు మూలంలోని రెండు సమాంతర అర్ధభాగాలు, చిన్న–పెద్ద వ్యత్యాసం, మరియు సాధారణ నైతిక సూత్రం నిలుపబడ్డాయి.
