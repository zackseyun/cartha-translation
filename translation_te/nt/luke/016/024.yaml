id: LUK.16.24
reference: Luke 16:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: te
  text: 'అతడు బిగ్గరగా పిలిచి ఇలా అన్నాడు: ‘తండ్రీ అబ్రాహామా, నన్ను కరుణించి, తన వేలికొనను నీటిలో ముంచి నా నాలుకను చల్లబరచేలా లాజరును పంపు. ఎందుకంటే నేను ఈ మంటలో తీవ్రమైన వేదనలో ఉన్నాను[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక “ఈ మంటలో నేను యాతనపడుతున్నాను.” గ్రీకు క్రియ తీవ్రమైన బాధను లేదా వేదనను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: బిగ్గరగా పిలిచి
  rationale: ఈ సందర్భంలో ఈ భూతకాల కృదంతం గట్టిగా, అత్యవసరంగా చేసిన పిలుపును సూచిస్తుంది. ‘బిగ్గరగా పిలిచి’ అనేది తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది; ‘కేకవేసి’ అనే మాట కలిగించగల అదనపు భావాన్ని నివారిస్తుంది.
- source_word: Πάτερ Ἀβραάμ
  choice: తండ్రి అబ్రాహామా
  rationale: మూలంలోని సంబోధన రూపాన్నీ, పూర్వికునిగా అబ్రాహామును ఆశ్రయించే భావాన్నీ నేరుగా నిలుపుతుంది.
- source_word: ἐλέησόν με
  choice: నన్ను కరుణించి
  rationale: కరుణ లేదా కనికరం చూపమనే ప్రత్యక్ష విజ్ఞప్తిని సాధారణమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πέμψον
  choice: పంపు
  rationale: ఆజ్ఞార్థక క్రియకు సరళమైన, ప్రత్యక్ష సమానార్థకం.
- source_word: βάψῃ
  choice: ముంచి
  rationale: βάπτω ఇక్కడ వేలి కొనను నీళ్లలో కొద్దిసేపు ముంచే చర్యను సూచిస్తుంది. ‘ముంచి’ ఆ దృశ్యాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: తన వేలి కొనను
  rationale: ἄκρον సూచించే చివర లేదా కొన అనే భావాన్ని సహజమైన తెలుగు పదబంధంతో నిలుపుతుంది.
- source_word: ὕδατος
  choice: నీళ్లలో
  rationale: βάψῃతో వచ్చిన షష్ఠీ విభక్తి భావాన్ని తెలుగులో ‘నీళ్లలో ముంచి’ అని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καταψύξῃ
  choice: చల్లబరచాలి
  rationale: చల్లబరచడం లేదా చల్లదనం ద్వారా ఉపశమనం కలిగించడం అనే భౌతిక చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: γλῶσσάν μου
  choice: నా నాలుకను
  rationale: శరీర భాగాన్ని సూచించే మూలార్థాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ὀδυνῶμαι
  choice: నేను తీవ్రమైన వేదన అనుభవిస్తున్నాను
  rationale: ఈ క్రియ తీవ్రమైన నొప్పి లేదా బాధను సూచిస్తుంది. ‘తీవ్రమైన వేదన అనుభవిస్తున్నాను’ దాని బలాన్ని తెలియజేస్తూ, ‘యాతనపడుతున్నాను’ అనే మరింత వ్యాఖ్యానాత్మకంగా వినిపించగల పదాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: ఈ మంటలో
  rationale: φλόξ అనే పదం సాధారణంగా అగ్ని కంటే ప్రత్యేకంగా మంటను సూచిస్తుంది; ఏకవచన దృశ్యాన్ని ‘ఈ మంటలో’ నిలుపుతుంది.
theological_decisions:
- issue: ధనవంతుని బాధను ఎలా వ్యక్తపరచాలి
  choice: ఈ మంటలో నేను తీవ్రమైన వేదన అనుభవిస్తున్నాను
  alternative: ఈ మంటలో నేను యాతనపడుతున్నాను
  rationale: వాక్యం మరణానంతర తీవ్రమైన బాధను చిత్రిస్తుంది. అయితే మూలంలోని ὀδυνῶμαι చెప్పేదానికంటే భావాన్ని పెంచకూడదు లేదా తగ్గించకూడదు. ప్రధాన అనువాదం తీవ్రతను నిలుపుతూ, ప్రత్యేక సిద్ధాంతార్థాన్ని అనవసరంగా రుద్దదు; సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘బిగ్గరగా పిలిచి’, ‘వేలి కొన’, ‘మంట’ వంటి పదాలు మూలంలోని స్పష్టమైన దృశ్యాన్ని సహజంగా నిలుపుతాయి. పాదసూచిక గుర్తు [a] సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
