source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: te
  text: అప్పుడు అతడు, “తండ్రీ, అయితే లాజరును నా తండ్రి ఇంటికి పంపమని మిమ్మల్ని అడుగుతున్నాను,” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δέ
  choice: అప్పుడు అతడు ... అన్నాడు
  rationale: δέ కథనాన్ని స్వల్ప అనుసంధానంతో ముందుకు తీసుకెళ్తుంది; సందర్భంలో సహజమైన తెలుగు కథన ప్రవాహానికి ‘అప్పుడు’ సరిపోతుంది.
- source_word: Ἐρωτῶ
  choice: అడుగుతున్నాను
  rationale: ἐρωτάω యొక్క ప్రాథమిక భావం అడగడం లేదా మనవి చేయడం. సందర్భంలోని గంభీర అభ్యర్థనను అతిశయింపజేయకుండా ‘అడుగుతున్నాను’ మూలార్థాన్ని నిలుపుతుంది.
- source_word: σε οὖν
  choice: అలాగైతే ... మిమ్మల్ని
  rationale: οὖν ముందటి నిరాకరణ నుంచి వచ్చే తదుపరి అభ్యర్థనను సూచిస్తుంది; ‘అలాగైతే’ ఆ అన్వయాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. అబ్రాహామును గౌరవంగా సంబోధిస్తున్నందున σε ను ‘మిమ్మల్ని’గా ఇచ్చాం.
- source_word: πάτερ
  choice: తండ్రీ
  rationale: ఇది ఉపమానంలో అబ్రాహామును పూర్వికునిగా సంబోధించే సంబోధన; దేవునికి వాడే ప్రత్యేక బిరుదుగా చూపకుండా సహజమైన గౌరవ సంబోధనను నిలుపుతుంది.
- source_word: ἵνα πέμψῃς
  choice: పంపమని
  rationale: అడగడం అనే క్రియ తరువాత ἵνα + subjunctive అభ్యర్థనలోని విషయాన్ని తెలియజేస్తుంది; తెలుగులో ‘పంపమని ... అడుగుతున్నాను’ సహజంగా అదే ఆధీన నిర్మాణాన్ని అందిస్తుంది.
- source_word: αὐτὸν
  choice: లాజరును
  rationale: సర్వనామం మునుపటి సందర్భంలోని లాజరును సూచిస్తుంది. తెలుగులో అస్పష్టత రాకుండా సూచిత నామాన్ని పునరుద్ఘాటించడం సహజం.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: నా తండ్రి ఇంటికి
  rationale: οἶκος ఇక్కడ ఇల్లు లేదా కుటుంబ గృహాన్ని సూచిస్తుంది; గమ్యార్థక εἰς ను ‘ఇంటికి’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని πάτερ అనే సంబోధన
  choice: తండ్రీ
  alternative: ఓ తండ్రీ / తండ్రి
  rationale: మాట్లాడుతున్నవాడు అబ్రాహామును పూర్వికునిగా సంబోధిస్తున్నాడు; పాఠ్యం సూచించని విధంగా దేవునికి నేరుగా చేసే సంబోధనగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. మూలంలోని అభ్యర్థన స్వరాన్ని నిలుపుతూ, అవసరానికి మించిన భావోద్వేగ తీవ్రతను ప్రధాన పాఠ్యంలో చేర్చలేదు.
