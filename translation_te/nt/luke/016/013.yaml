id: LUK.16.13
reference: Luke 16:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: te
  text: “ఏ ఇంటి సేవకుడూ ఇద్దరు యజమానులకు సేవ చేయలేడు. ఎందుకంటే అతడు ఒకరిని ద్వేషించి మరొకరిని ప్రేమిస్తాడు; లేదా ఒకరికి అంకితమై ఉండి మరొకరిని తృణీకరిస్తాడు. మీరు దేవునికీ మమ్మోనుకూ[a] సేవ చేయలేరు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సంపదకు,” “ధనానికి.” గ్రీకు మూలంలో ‘మమ్మోను’ అనే పదం ఉంది; ఇక్కడ సంపదను ప్రత్యర్థి యజమానిలా చూపించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: ఇంటి సేవకుడు
  rationale: ఇంటివారిలో సేవక స్థితిలో ఉన్న వ్యక్తిని సూచించే ఈ పదానికి ‘ఇంటి సేవకుడు’ సహజంగా ఉండి, గృహసంబంధ సందర్భాన్ని నిలుపుతుంది.
- source_word: κυρίοις
  choice: యజమానులకు
  rationale: ఇక్కడ మానవ యజమానులే ఉద్దేశం; ‘యజమానులు’ సేవకుడు–యజమాని సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δουλεύειν
  choice: సేవ చేయడం
  rationale: సేవకుడిగా లోబడి సేవ చేయడమనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; చివరి వాక్యంలోని సమాంతరతనూ కాపాడుతుంది.
- source_word: μισήσει
  choice: ద్వేషిస్తాడు
  rationale: పదంలోని బలమైన సాధారణ అర్థాన్ని మృదువుచేయకుండా, ప్రేమకు వ్యతిరేకమైన అలంకారిక తీవ్రతను నిలుపుతుంది.
- source_word: ἀγαπήσει
  choice: ప్రేమిస్తాడు
  rationale: ‘ద్వేషిస్తాడు’ అనే పదానికి ఉద్దేశపూర్వక వ్యతిరేకతను నేరుగా నిలుపుతుంది.
- source_word: ἀνθέξεται
  choice: హత్తుకొని
  rationale: ఒకరిని గట్టిగా పట్టుకొని, ఆయన పక్షాన నిలిచి ఉండే అనుబంధం మరియు విధేయతను సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: καταφρονήσει
  choice: తృణీకరిస్తాడు
  rationale: చులకనగా చూసి నిరాదరించడమనే బలమైన భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: θεῷ
  choice: దేవునికి
  rationale: దేవుడు సేవకు పరోక్ష కర్మగా ఉన్న దత్తి విభక్తిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μαμωνᾷ
  choice: మమ్మోనుకు
  rationale: సంపదను ప్రత్యర్థి యజమానిలా వ్యక్తీకరించే సెమిటిక్ పదాన్ని లిప్యంతరీకరించడం ద్వారా మూలంలోని అలంకారిక, వ్యక్తీకృత బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: θεῷకు ప్రత్యర్థి యజమానిగా μαμωνᾷను ఎలా అనువదించాలి
  choice: మమ్మోను
  alternative: సంపద / ధనం
  rationale: ‘మమ్మోను’ అని నిలుపడం సంపదను దేవునికి ప్రత్యర్థి యజమానిలా చూపే వాక్యబలాన్ని కాపాడుతుంది; ఇది మమ్మోను నిజమైన దేవత అని నిర్ధారించదు. అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- issue: ఏకవచన సేవకుని సూచించే క్రియారూపాలు
  choice: అతడు ... ద్వేషిస్తాడు ... ప్రేమిస్తాడు ... హత్తుకుంటాడు ... తృణీకరిస్తాడు
  alternative: ఆ సేవకుడు ... / వారు ...
  rationale: గ్రీకు మూలంలోని సాధారణార్థక పురుష ఏకవచన నిర్మాణాన్ని తెలుగులో సహజంగా, స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ద్వేషించి—ప్రేమిస్తాడు,’ ‘హత్తుకొని—తృణీకరిస్తాడు’ అనే బలమైన వ్యతిరేక జతలను మృదువుచేయకుండా నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
