lexical_decisions:
- source_word: μνημονεύετε
  choice: జ్ఞాపకం చేసుకోండి
  rationale: వర్తమాన కాల క్రియారూపంలోని బహువచన ఆజ్ఞను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది. సందర్భంలో ఆమెకు జరిగినదాన్ని గుర్తుంచుకొని హెచ్చరికగా తీసుకోవాలనే భావం నిలుస్తుంది.
- source_word: τῆς γυναικὸς
  choice: భార్యను
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు; Λώτ అనే వ్యక్తినామంతో ఉన్న సంబంధ సూచన వల్ల ఇక్కడ ‘భార్య’ అనే అర్థమే ఉద్దేశించబడింది. తెలుగు విభక్తి నిర్మాణానికి అనుగుణంగా కర్మరూపం వాడబడింది.
- source_word: Λώτ
  choice: లోతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: హెచ్చరికాత్మక సూచన యొక్క సంక్షిప్త రూపం
  choice: లోతు భార్యను జ్ఞాపకం చేసుకోండి.
  alternative: లోతు యొక్క భార్యను జ్ఞాపకం చేసుకోండి.
  rationale: మూలంలోని సంక్షిప్త ఆజ్ఞను, ఆదికాండము 19:26లోని సంఘటనకు సంబంధించిన హెచ్చరిక శక్తిని యథాతథంగా ఉంచుతూ, తెలుగులో సహజమైన సంబంధ నిర్మాణాన్ని ఎంచుకుంది. ‘లోతు యొక్క భార్య’ మరింత రూపానుసారమైనదైనా సాధారణ తెలుగులో అనవసరంగా భారంగా ఉంటుంది.
translation_notes:
  register: సంక్షిప్తమైన, గంభీరమైన, సాధారణ ఆధునిక తెలుగు. బహువచన ఆజ్ఞార్థక రూపం మూలంలోని రెండవ పురుష బహువచనాన్ని నిలుపుతుంది. తెలుగు సహజ వాడుకలో ‘లోతు భార్య’ అనేదే ‘లోతు యొక్క భార్య’ కంటే మెరుగైనది; అందువల్ల ప్రత్యేక lexical-alternative పాదటిప్పణి అవసరం లేదు.
