translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. లూకా వాక్యారంభ సూత్రాన్ని పదేపదే కాకుండా తెలుగు కాలవాక్య నిర్మాణంలో కలిపి, భౌగోళిక పదబంధంలోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలుపుకుంది.
