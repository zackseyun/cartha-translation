id: LUK.17.11
reference: Luke 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: te
  text: ఆయన యెరూషలేముకు వెళ్తుండగా, సమరయకూ గలిలయకూ మధ్యగా ప్రయాణిస్తూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమరయ, గలిలయ ప్రాంతాల మధ్యభాగం గుండా ప్రయాణిస్తూ ఉన్నాడు.” గ్రీకు పదబంధం ఈ రెండు ప్రాంతాల మధ్యనున్న సరిహద్దు ప్రాంతం గుండా ప్రయాణించడాన్నిగానీ, ఆ ప్రాంతాల నడుముగా ప్రయాణించడాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ πορεύεσθαι
  choice: ఆయన ... వెళ్తుండగా
  rationale: లూకా వాడే సంఘటన-పరిచయ సూత్రంలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ἐγένετοను విడిగా అనువదిస్తే తెలుగులో అనవసరమైన భారంగా ఉంటుంది.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: εἰς సూచించే గమ్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: αὐτός
  choice: ఆయన
  rationale: సందర్భంలోని యేసును గౌరవప్రదమైన సాధారణ తెలుగు సర్వనామంతో సూచిస్తుంది; గ్రీకులోని స్వల్ప ఉద్ఘాటనను తెలుగులో అసహజంగా పెంచదు.
- source_word: διήρχετο
  choice: ప్రయాణిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ కాలంలోని కొనసాగుతున్న ప్రయాణ భావాన్ని నిలుపుతుంది; ప్రాంతాలను పూర్తిగా దాటాడనే భావాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: διὰ μέσον Σαμαρείας καὶ Γαλιλαίας
  choice: సమరయకు గలిలయకు మధ్యగా
  rationale: రెండు ప్రాంతాల మధ్యనున్న ప్రదేశం లేదా సరిహద్దు ప్రాంతం గుండా కదలిక అనే సాధ్యమైన అర్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; ప్రత్యామ్నాయంగా రెండు ప్రాంతాల నడుముగా/లోపలుగా వెళ్లడం అనే భావం ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
