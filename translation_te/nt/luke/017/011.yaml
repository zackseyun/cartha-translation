revisions:
- from: ఆయన యెరూషలేముకు వెళ్తుండగా, సమరయకు గలిలయకు మధ్యగా ప్రయాణిస్తూ ఉన్నాడు.[a]
  to: ఆయన యెరూషలేముకు వెళ్తుండగా, సమరయకూ గలిలయకూ మధ్యగా ప్రయాణిస్తూ ఉన్నాడు.[a]
  rationale: The revision corrects the Telugu construction for movement between two regions and refines the footnote so that it preserves the ambiguity of διὰ μέσον Σαμαρείας καὶ Γαλιλαίας. No doctrinal or historical interpretation has been added. The narrative formula ἐγένετο remains naturally integrated into the Telugu temporal narration.
