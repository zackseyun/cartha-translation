- from: ఆయన ఒక గ్రామంలోకి ప్రవేశిస్తూ ఉండగా, కుష్ఠవ్యాధిగల పదిమంది పురుషులు[a] ఆయనకు ఎదురయ్యారు. వారు దూరంగా[b] నిలబడ్డారు.
  to: ఆయన ఒక గ్రామంలోకి ప్రవేశిస్తూ ఉండగా, కుష్ఠవ్యాధిగల పదిమంది పురుషులు[a] ఆయనను ఎదుర్కొన్నారు. వారు దూరంగా[b] నిలబడ్డారు.
  rationale: Only the verb for ἀπήντησαν is revised. The new wording explicitly represents the ten men as those who met him, while preserving the draft’s faithful handling of the ongoing entry, indefinite village, ancient disease designation, and spatial distance.
