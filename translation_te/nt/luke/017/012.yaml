  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: te
  text: ఆయన ఒక గ్రామంలోకి ప్రవేశిస్తూ ఉండగా, కుష్ఠవ్యాధిగల పదిమంది పురుషులు[a] ఆయనను ఎదుర్కొన్నారు. వారు దూరంగా[b] నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘కుష్ఠులైన పదిమంది పురుషులు.’ ఇక్కడి ప్రాచీన పదం వివిధ రకాల తీవ్రమైన చర్మవ్యాధులను సూచించవచ్చు; అది ఆధునిక వైద్యపరమైన హాన్సెన్స్ వ్యాధికే పరిమితం కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దూరం నుంచి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: ఆయన ... ప్రవేశిస్తూ ఉండగా
  rationale: వర్తమాన కృదంతంతో ఉన్న genitive absolute, ప్రధాన చర్యతో సమకాలంలో కొనసాగుతున్న ప్రవేశాన్ని సూచిస్తుంది; అందువల్ల ‘ప్రవేశిస్తూ ఉండగా’ అని అనువదించాం.
- source_word: εἴς τινα κώμην
  choice: ఒక గ్రామంలోకి
  rationale: τινα అనిర్దిష్టమైన ఒక గ్రామాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘ఒక గ్రామంలోకి’ అని ఇచ్చాం; ‘ఒకానొక గ్రామంలోకి’ మరింత రూపసామ్యంగా ఉన్నా ఆధునిక వాడుకలో కొంత కృత్రిమంగా వినిపిస్తుంది.
- source_word: ἀπήντησαν
  choice: ఎదురయ్యారు
  rationale: ἀπαντάω ఇక్కడ కలవడం లేదా ఎదురుపడడాన్ని సూచిస్తుంది. సందర్భానికి తగిన సహజ తెలుగు వ్యక్తీకరణగా ‘ఎదురయ్యారు’ ఎంచుకున్నాం; వారు ఆయనవద్దకు ఎంతవరకు కదిలారో అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: కుష్ఠవ్యాధిగల పదిమంది పురుషులు
  rationale: λεπροί అనే విశేషణాత్మక వర్ణనను నిలుపుతూ, వ్యక్తులను కేవలం వ్యాధిపేరుతో పిలవకుండా సహజమైన ఆధునిక తెలుగులో ఇచ్చాం. ఇది ఆధునిక హాన్సెన్స్ వ్యాధితో తప్పనిసరిగా సమానం కాదనే విషయాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: οἳ ἔστησαν
  choice: వారు ... నిలబడ్డారు
  rationale: గ్రీకులో ఇది ఆ పదిమంది పురుషులను సూచించే సంబంధవాక్యం. తెలుగులో స్పష్టత, సహజత్వం కోసం ప్రత్యేక వాక్యంగా ‘వారు ... నిలబడ్డారు’ అని ఇచ్చాం; ‘ఆగారు’ అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: πόρρωθεν
  choice: దూరంగా
  rationale: స్థలపరమైన వేరుపును సరళంగా, సహజంగా తెలియజేస్తుంది. ‘చాలా దూరంగా’ అంటే మూలంలో ఉన్నదానికంటే తీవ్రత పెరిగే అవకాశం ఉంది.
theological_decisions:
- issue: λεπροί అనే వ్యాధి సూచక పదం
  choice: కుష్ఠవ్యాధిగల పదిమంది పురుషులు
  alternative: చర్మవ్యాధిగల పదిమంది పురుషులు; పదిమంది కుష్ఠరోగులు
  rationale: ప్రాచీన సందర్భంలోని λεπρός ఆధునిక వైద్యనిర్ధారణ అయిన హాన్సెన్స్ వ్యాధికే పరిమితం కాదు. అయినప్పటికీ తెలుగు బైబిల్ వాడుకలో గుర్తుపట్టదగిన ‘కుష్ఠవ్యాధి’ అనే పదాన్ని ఉంచి, దాని ప్రాచీన విస్తృతిని పాదటిప్పణిలో తెలిపాం. ఇలా చేయడం వల్ల మూలంలోని వర్ణనను అతిగా వైద్యీకరించకుండా, పాఠకునికి అర్థమయ్యే భాష నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని కొనసాగుతున్న ప్రవేశ చర్యను నిలిపి ఉంచుతూ, పొడవైన సంబంధవాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం. పాదటిప్పణి సూచికలను అవి వివరిస్తున్న పదబంధాలకే జత చేశాం.
