id: LUK.17.1
reference: Luke 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: te
  text: 'అప్పుడు ఆయన తన శిష్యులతో ఇలా అన్నాడు: “తడబడేలా చేసే అడ్డంకులు[a] రాకపోవడం అసాధ్యం. కాని, అవి ఎవరి ద్వారా వస్తాయో, ఆ వ్యక్తికి అయ్యో!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అపరాధాలు,’ ‘పాపంలో పడేసేవి,’ లేదా ‘పాపం చేయడానికి ప్రలోభాలు.’ గ్రీకు పదం σκάνδαλα నైతికంగా లేదా ఆధ్యాత్మికంగా ఒకరిని తడబడేలా చేసి పతనానికి దారితీసే వాటిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: అప్పుడు ఆయన ... ఇలా అన్నాడు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది. ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది; అనవసరమైన వ్యతిరేక భావాన్ని చేర్చదు.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: తన శిష్యులతో
  rationale: αὐτοῦలోని స్వామ్య భావాన్ని ‘తన’ తెలియజేస్తుంది. μαθηταίకు ‘శిష్యులు’ ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: అసాధ్యం
  rationale: ἀνένδεκτός సాధ్యం కానిదాన్ని సూచిస్తుంది. తరువాతి నిషేధార్థక క్రియారూపంతో కలిపి, అవి రాకపోవడం అసాధ్యమనే భావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: తడబడేలా చేసే అడ్డంకులు రాకుండా ఉండడం
  rationale: μήతో కూడిన ఈ నిర్మాణం ‘రాకపోవడం’ అసాధ్యమని చెబుతుంది. తెలుగు వాక్య నిర్మాణంలో ‘రాకుండా ఉండడం’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: σκάνδαλα
  choice: తడబడేలా చేసే అడ్డంకులు
  rationale: σκάνδαλαలోని తడబడేలా చేయడం లేదా ఉచ్చులో పడేయడం అనే రూపకాన్ని నిలిపి, నైతికంగా లేదా ఆధ్యాత్మికంగా పతనానికి దారితీసే విస్తృత భావాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: πλὴν οὐαὶ
  choice: అయితే ... అయ్యో
  rationale: πλήν అనివార్యత గురించిన ప్రకటన నుంచి బాధ్యతపై తీవ్రమైన హెచ్చరికకు మలుపును సూచిస్తుంది. οὐαίలోని శాపోక్తి లేదా దుస్థితి ప్రకటనను ‘అయ్యో’ నిలుపుతుంది.
- source_word: δι’ οὗ
  choice: ఎవరి ద్వారా ... ఆ వ్యక్తికి
  rationale: మూలంలోని ఏకవచన వ్యక్తిగత సూచనను నిలుపుతూ, తెలుగులో అనవసరమైన లింగ నిర్దిష్టత లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔρχεται
  choice: అవి ... వస్తాయో
  rationale: తెలుగులో బహువచనమైన ‘అడ్డంకులు’తో సహజ అన్వయాన్ని కలిగించడానికి ‘అవి వస్తాయి’ అని ఇచ్చాం; మూల భావంలో అవి ఆ వ్యక్తి ద్వారా రావడం ప్రధానాంశం.
theological_decisions:
- issue: నైతిక బోధలో σκάνδαλα భావం
  choice: ప్రధాన పాఠంలో ‘తడబడేలా చేసే అడ్డంకులు’
  alternative: ‘అపరాధాలు,’ ‘పాపంలో పడేసేవి,’ లేదా ‘పాపానికి ప్రలోభాలు’
  rationale: ఈ పదం కేవలం మనస్తాపం కలిగించేదాన్ని కాక, నైతిక లేదా ఆధ్యాత్మిక పతనానికి కారణమయ్యేదాన్ని సూచించగలదు. ఎంచుకున్న పదబంధం రూపకాన్ని, భావ విస్తృతిని రెండింటినీ నిలుపుతుంది.
- issue: δι’ οὗలోని ప్రతినిధి ఏకవచన వ్యక్తి
  choice: ‘ఎవరి ద్వారా వస్తాయో ఆ వ్యక్తికి’
  alternative: ‘ఏ పురుషుని ద్వారా వస్తాయో అతనికి’ లేదా బహువచన రూపం
  rationale: మూలంలోని ఏకవచన వ్యక్తిగత బాధ్యతను నిలుపుతూ, గ్రీకు వ్యాకరణ లింగాన్ని తెలుగు పాఠంలో అవసరం లేకుండా పురుషుడికే పరిమితం చేయదు.
- issue: అడ్డంకులు రావడం అనివార్యమనే ప్రకటన మరియు వాటిని తెచ్చేవారి బాధ్యత
  choice: రెండు అంశాల మధ్య ఉద్రిక్తతను పరిష్కరించకుండా యథాతథంగా ఉంచాం
  alternative: అనివార్యతను దేవుని నిర్ణయంగా లేదా మానవ బాధ్యతను నిరాకరించేదిగా వివరణాత్మకంగా మార్చడం
  rationale: వాక్యం అడ్డంకులు రాకపోవడం అసాధ్యమని చెబుతూనే, వాటిని తెచ్చే వ్యక్తిపై ‘అయ్యో’ అని ప్రకటిస్తుంది. అనివార్యత మానవ బాధ్యతను తొలగిస్తుందని పాఠం చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘తడబడేలా చేసే అడ్డంకులు’ అనే పదబంధం సాధారణ పాఠకులకు అర్థమయ్యేలా రూపకాన్ని నిలుపుతుంది. గ్రీకులోని గంభీరమైన οὐαίకి సంక్షిప్తమైన బైబిలీయ తెలుగు ప్రయోగం ‘అయ్యో’ను ఉంచాం.
