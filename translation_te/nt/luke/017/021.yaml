id: LUK.17.21
reference: Luke 17:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: te
  text: “‘ఇదిగో, ఇక్కడ ఉంది!’ అనో, ‘అక్కడ ఉంది!’ అనో వారు కూడా చెప్పరు. ఎందుకంటే, ఇదిగో, దేవుని రాజ్యం మీ మధ్య ఉంది[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీలో ఉంది.” గ్రీకు పదబంధం “మీ అంతరంగంలో” అనే భావాన్నిగానీ, “మీ మధ్య” అనే సమూహార్థాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: వారు చెప్పరు
  rationale: ముందటి వాక్యంలోని నిరాకరణను కొనసాగించే భవిష్యత్ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘అనో ... అనో’ నిర్మాణం οὐδὲ యొక్క అనుసంధాన భావాన్ని మోస్తుంది.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: ‘ఇదిగో, ఇక్కడ ఉంది!’ అనో, ‘అక్కడ ఉంది!’ అనో
  rationale: ἰδού అనే దృష్టి ఆకర్షణ పదాన్ని ‘ఇదిగో’గా, ὧδε/ἐκεῖ అనే స్థాన సూచనలను ‘ఇక్కడ/అక్కడ’గా సహజంగా అందిస్తుంది. తెలుగులో ఉద్దేశించిన భావం పూర్తిగా వినిపించేందుకు ‘ఉంది’ చేర్చబడింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి నిరాకరణకు కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే గ్రీకు అవ్యయానికి ఆధునికమైనప్పటికీ గౌరవప్రదమైన తెలుగు సమానం.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: రాజాధికారం మరియు రాజ్య సంబంధిత అంత్యకాల పరిమాణాలు రెండింటినీ అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: ἐντὸς ὑμῶν
  choice: మీ మధ్యనే
  rationale: బహువచన శ్రోతలను ఉద్దేశించిన సందర్భంలో ‘మీ మధ్య’ అనే సమూహార్థాన్ని ప్రధాన పాఠంగా ఎంచుకుంది. ‘నే’ ఉనికి/సాన్నిధ్యంపై గ్రీకు ἰδού కలిగించే దృష్టిని సహజంగా బలపరుస్తుంది; అంతరంగార్థం పాదసూచికలో నిలుపబడింది.
- source_word: ἐστιν
  choice: ఉంది
  rationale: వర్తమాన ఉనికిని తెలిపే సరళమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: ἐντὸς ὑμῶν యొక్క అర్థం
  choice: దేవుని రాజ్యం మీ మధ్యనే ఉంది
  alternative: దేవుని రాజ్యం మీలో ఉంది
  rationale: ἐντός సమూహం మధ్య ఉన్నదనే భావాన్నీ, వ్యక్తుల అంతరంగంలో ఉన్నదనే భావాన్నీ ఇవ్వగలదు. యేసు బహువచన శ్రోతలను ఉద్దేశించడం మరియు సందర్భంలో స్థానం/గోచరత ప్రశ్న ఉండడం వల్ల ‘మీ మధ్య’ ప్రధాన పాఠంగా ఎంపికైంది; నిజమైన భాషా సందిగ్ధతను పాదసూచిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఇదిగో’ మూలంలోని ἰδούను నిలుపుతుంది; ‘మీ మధ్యనే’ ప్రధాన సందర్భార్థాన్ని సహజంగా అందిస్తూ పాదసూచిక ద్వారా ప్రత్యామ్నాయ అంతరంగార్థాన్ని కాపాడుతుంది.
