revisions:
- from: “‘ఇదిగో, ఇక్కడ ఉంది!’ అనో, ‘అక్కడ ఉంది!’ అనో వారు చెప్పరు. ఎందుకంటే ఇదిగో, దేవుని రాజ్యం మీ మధ్యనే ఉంది[a].”
  to: “‘ఇదిగో, ఇక్కడ ఉంది!’ అనో, ‘అక్కడ ఉంది!’ అనో వారు కూడా చెప్పరు. ఎందుకంటే, ఇదిగో, దేవుని రాజ్యం మీ మధ్య ఉంది[a].”
  rationale: The revision explicitly conveys the continuing negative force of οὐδέ with కూడా and removes the unrequired emphasis in మీ మధ్యనే. It retains the source's attention-getting ἰδού in both relevant locations, the explanatory connection of γάρ, and the disputed semantic range of ἐντὸς ὑμῶν through the anchored footnote.
  reviewer_model: gpt-5.6-terra
