  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: te
  text: నోవహు రోజులలో ఎలా జరిగిందో, మనుష్యకుమారుని రోజులలో కూడా అలాగే ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మానవుడు.” “మనుష్యకుమారుడు” అని అనువదించిన గ్రీకు బిరుదు దానియేలు 7ను ప్రతిధ్వనింపజేసే అవకాశం ఉంది; దాని స్థిరపడిన మెస్సీయ సంబంధమైన మరియు అంత్యకాల భావసూచనల కారణంగా ప్రధాన పాఠంలో సంప్రదాయ రూపాన్ని ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ఎలా ... అలాగే
  rationale: గ్రీకు వాక్యంలోని పోలికను సహజమైన తెలుగు జతప్రయోగంతో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἐγένετο
  choice: జరిగిందో
  rationale: నోవహు కాలంలో సంభవించిన పరిస్థితిని సంఘటనాత్మకంగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: నోవహు రోజులలో
  rationale: మూలంలోని కాలసూచక నుడికారాన్ని దగ్గరగా అనుసరిస్తూ, బైబిలు సందర్భంలో సహజంగా ఉంది.
- source_word: οὕτως
  choice: అలాగే
  rationale: ముందున్న ‘ఎలా’తో జతకట్టి పోలిక యొక్క రెండవ భాగాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἔσται
  choice: జరుగుతుంది
  rationale: తెలుగులో ‘అలా ఉంటుంది’ కంటే సందర్భానికి సహజంగా ఉండి, రాబోయే పరిస్థితిని సూచిస్తుంది; అయితే పోలికకు మించిన వివరాన్ని చేర్చదు.
- source_word: καὶ
  choice: కూడా
  rationale: రెండవ కాలస్థితికి పోలికను విస్తరించే గ్రీకు καί భావాన్ని నిలుపుతుంది.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుని
  rationale: సువార్తల్లో స్థిరపడిన బిరుదు రూపాన్ని, దానియేలు 7కు సంభావ్య ప్రతిధ్వనిని, మెస్సీయ మరియు అంత్యకాల సంబంధిత భావసూచనలను కాపాడుతుంది.
theological_decisions:
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου అనే బిరుదు అనువాదం
  choice: మనుష్యకుమారుని
  alternative: మానవుడు / మానవ కుమారుడు
  rationale: ‘మనుష్యకుమారుడు’ సువార్తల్లో యేసుకు సంబంధించిన స్థిరమైన బిరుదుగా గుర్తించదగినది. ఇది పదరూపాన్ని, దానియేలు 7తో ఉండగల సంబంధాన్ని నిలుపుతూ, దాన్ని కేవలం సాధారణ మానవ సూచనగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ఎలా ... అలాగే’ అనే సహజ పోలికా నిర్మాణం ఉపయోగించబడింది; ‘మనుష్యకుమారుడు’ అనే స్థిరమైన బైబిలు బిరుదు నిలుపబడింది.
