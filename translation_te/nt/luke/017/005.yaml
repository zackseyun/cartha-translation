- from: అప్పుడు అపొస్తలులు ప్రభువుతో, “మా విశ్వాసాన్ని పెంచు[a]” అన్నారు.
  to: మరియు అపొస్తలులు ప్రభువుతో, “మా విశ్వాసాన్ని పెంచండి” అని అన్నారు.[a]
