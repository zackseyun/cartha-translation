  edition: SBLGNT
  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: te
  text: మరియు అపొస్తలులు ప్రభువుతో, “మా విశ్వాసాన్ని పెంచండి” అని అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మాకు విశ్వాసాన్ని జోడించు.” ఇక్కడ గ్రీకు క్రియ సందర్భానుసారంగా “మా విశ్వాసాన్ని పెంచండి” అని అర్థమిస్తుంది. “విశ్వాసం” అనే పదాన్ని “నమ్మకం” అని కూడా అర్థం చేసుకోవచ్చు; “నమ్మకత్వం” అనే అర్థం ఇక్కడ తక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: సాధారణ కథన అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇక్కడ ఇది కఠినమైన కాలక్రమ సూచనగా కాక సందర్భానుసార అనుసంధానంగా పనిచేస్తుంది.
- source_word: εἶπαν
  choice: అన్నారు
  rationale: అనిర్దిష్ట భూతకాల కథన క్రియను సహజమైన సాధారణ భూతకాల రూపంలో అందిస్తుంది.
- source_word: οἱ ἀπόστολοι
  choice: అపొస్తలులు
  rationale: యేసు నియమించి పంపిన ప్రత్యేక శిష్యబృందాన్ని సూచించే, తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన పదం.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుతో
  rationale: తెలుగు మాటల వాడుకలో ‘చెప్పు’ క్రియతో సహజంగా వచ్చే రూపం; κύριος పదంలోని గౌరవార్థక, క్రీస్తుసంబంధ ప్రతిధ్వనిని ‘ప్రభువు’ నిలుపుతుంది.
- source_word: Πρόσθες
  choice: పెంచు
  rationale: క్రియకు అక్షరార్థంగా ‘కలుపు’ ఉన్నప్పటికీ, πίστιν తో ఇక్కడ ఉద్దేశం పరిమాణం లేదా బలాన్ని అధికం చేయమనే అభ్యర్థన; ‘పెంచు’ సహజమైన తెలుగు నుడికారం.
- source_word: ἡμῖν
  choice: మా
  rationale: గ్రీకులో అక్షరార్థంగా ‘మాకు’; ‘పెంచు’తో తెలుగులో ‘మా విశ్వాసాన్ని’ అనడం సహజంగా అదే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసాన్ని
  rationale: ఈ సందర్భంలో దేవునిపై నమ్మకం/విశ్వాసమే ప్రధాన భావం; ‘విశ్వాసం’ మూలపదపు సాధారణ ధార్మిక విస్తృతిని కూడా నిలుపుతుంది.
theological_decisions:
- issue: యేసును సూచించే κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ‘ప్రభువు’ గౌరవసూచక సంబోధనతో పాటు లూకా రచనలోని క్రీస్తుసంబంధ భావభారాన్ని నిలుపుతుంది; ‘యజమాని’ ఇక్కడ ఆ ప్రతిధ్వనిని తగ్గిస్తుంది.
- issue: πίστις భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; నమ్మకత్వం
  rationale: అపొస్తలులు తమలో పెరగాలని కోరుతున్నది ప్రధానంగా విశ్వాసం లేదా నమ్మకం. ‘నమ్మకత్వం’ పదానికి మూలపద పరిధిలో స్థానం ఉన్నా, ఈ సందర్భంలో అది తక్కువ సంభావ్యమైన అర్థం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రత్యక్ష అభ్యర్థనను ఏకవచన ఆజ్ఞారూపం ‘పెంచు’తో నిలిపి, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా τῷ κυρίῳ ను ‘ప్రభువుతో’గా ఇచ్చాం.
