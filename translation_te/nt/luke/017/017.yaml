id: LUK.17.17
reference: Luke 17:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: te
  text: 'అప్పుడు యేసు ఇలా జవాబిచ్చాడు: “ఆ పదిమంది శుద్ధి పొందారు[a] కదా? మరి ఆ తొమ్మిది మంది ఎక్కడ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధులయ్యారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: అప్పుడు యేసు … అని అడిగాడు
  rationale: గ్రీకులోని ‘జవాబిచ్చి చెప్పాడు’ అనే సంభాషణా సూత్రాన్ని తెలుగులో కృత్రిమ పునరుక్తి లేకుండా సహజంగా వ్యక్తం చేస్తుంది. δέ ఇక్కడ కథన పురోగతిని సూచిస్తున్నందున ‘అప్పుడు’ అని అనువదించబడింది.
- source_word: Οὐχὶ οἱ δέκα
  choice: ఆ పదిమంది … కదా?
  rationale: οὐχί అవుననే సమాధానాన్ని ఆశించే ప్రశ్నను ప్రవేశపెడుతుంది; తెలుగు ‘కదా?’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది. నిర్దిష్ట ఉపపదం ముందే ప్రస్తావించబడిన బృందాన్ని సూచిస్తున్నందున ‘ఆ పదిమంది’ అని ఇచ్చాం.
- source_word: ἐκαθαρίσθησαν
  choice: శుద్ధులయ్యారు
  rationale: καθαρίζω అనే క్రియకు ‘శుద్ధి చేయు/శుద్ధుడిగా చేయు’ అనే అర్థం ఉంది. కుష్ఠవ్యాధి సందర్భంలో శారీరక స్వస్థతతో పాటు శుద్ధతకు సంబంధించిన భావాన్ని కూడా నిలుపుతుంది.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: మరి ఆ తొమ్మిది మంది ఎక్కడ?
  rationale: δέ ఇక్కడ తిరిగి వచ్చిన ఒక్కడికీ మిగిలిన తొమ్మిది మందికీ మధ్య వ్యత్యాసాన్ని చూపుతుంది; ‘మరి’ తెలుగులో ఆ వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కుష్ఠవ్యాధిగలవారి విషయంలో καθαρίζω అర్థం
  choice: ‘స్వస్థులయ్యారు’ కాకుండా ‘శుద్ధులయ్యారు’
  alternative: స్వస్థులయ్యారు; శుద్ధి పొందారు
  rationale: మూలపదం కేవలం వ్యాధి నయమవడాన్ని మాత్రమే కాక శుద్ధత స్థితిని కూడా సూచించగలదు. ‘శుద్ధులయ్యారు’ ఆ ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సహజంగా ఉండేలా ప్రశ్నారూపాన్ని రూపొందించాం. మాటతీరు గౌరవప్రదంగా, సంక్షిప్తంగా ఉంది; మూలంలోని వాక్చాతుర్య ప్రశ్న మరియు వ్యత్యాసం నిలుపబడ్డాయి.
