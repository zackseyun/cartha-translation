revisions:
- from: అప్పుడు యేసు, “ఆ పదిమంది శుద్ధులయ్యారు[a] కదా? మరి ఆ తొమ్మిది మంది ఎక్కడ?” అని అడిగాడు.
  to: 'అప్పుడు యేసు ఇలా జవాబిచ్చాడు: “ఆ పదిమంది శుద్ధి పొందారు[a] కదా? మరి ఆ తొమ్మిది మంది ఎక్కడ?”'
  rationale: The revision restores the source’s answer/speech framing with the idiomatic Telugu expression “ఇలా జవాబిచ్చాడు.” It uses “శుద్ధి పొందారు” for καθαρίζω, maintaining the cleansing terminology and its contextual breadth. The rhetorical force, narrative progression, and contrast with the nine are retained; the footnote anchor remains correctly placed after the translated cleansing term.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:44:39Z'
review_pass:
  verdict: revise
  source_fidelity: The rhetorical affirmative question, the reference to the known group of ten, cleansing terminology, and the contrast with the nine are retained. However, “అడిగాడు” (‘asked’) reduces the Greek answer-and-saying formula to a mere question. “జవాబిచ్చాడు” better represents ἀποκριθεὶς … εἶπεν while remaining idiomatic Telugu.
  naturalness: “శుద్ధి పొందారు” is natural modern standard Telugu in this context and avoids the possible moralizing association of “శుద్ధులయ్యారు.” The wording remains concise and rhetorical.
  terminology: “శుద్ధి పొందారు” preserves καθαρίζω’s cleansing sense without narrowing it to physical healing. “మరి” naturally conveys the contrastive δέ in the second question.
  issues:
  - severity: medium
    issue: The draft renders ἀποκριθεὶς … εἶπεν as “అని అడిగాడు.”
    rationale: Although Jesus’ words are interrogative, the Greek explicitly presents them as an answer/saying. Rendering only ‘asked’ loses this discourse function. An idiomatic Telugu ‘answered’ formulation preserves it.
  - severity: low
    issue: “శుద్ధులయ్యారు” can sound like becoming morally pure in modern Telugu.
    rationale: “శుద్ధి పొందారు” more clearly communicates cleansing in the leprosy context while preserving the ritual and physical breadth of καθαρίζω. The footnote can retain the former wording as a lexical alternative.
  revised_text: 'అప్పుడు యేసు ఇలా జవాబిచ్చాడు: “ఆ పదిమంది శుద్ధి పొందారు[a] కదా? మరి ఆ తొమ్మిది మంది ఎక్కడ?”'
  revised_footnotes:
