reference: Luke 17:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: te
  text: అతని మెడ చుట్టూ తిరుగలిరాయి[a] కట్టబడి, అతడు సముద్రంలో పడవేయబడి ఉండటం, ఈ చిన్నవారిలో ఒకరిని తొట్రిల్లేలా చేయడం[b] కంటే అతనికి మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత నిర్దిష్టంగా, “పెద్ద తిరుగలిరాయి.” గ్రీకు పదబంధం మిల్లులో ఉపయోగించే బరువైన రాయిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పాపంలో పడేలా చేయడం” లేదా “ఆత్మీయ పతనానికి కారణం కావడం.” గ్రీకు క్రియలో ఈ భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: అతనికి మేలు
  rationale: ఒక పరిణామం మరొకదానికంటే అతనికి మెరుగైనదని తెలిపే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λίθος μυλικὸς
  choice: తిరుగలి రాయి
  rationale: మిల్లులో ధాన్యం రుబ్బడానికి ఉపయోగించే రాయిని సూచించే గ్రీకు పదబంధానికి స్పష్టమైన తెలుగు సమానార్థకం; అది పెద్దదైన లేదా బరువైన రాయి కావచ్చనే సూక్ష్మార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: అతని మెడ చుట్టూ ... కట్టబడి
  rationale: మెడ చుట్టూ రాయి ఉంచబడిన స్థితిని సహజమైన తెలుగు కర్మణి నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: అతడు సముద్రంలో పడవేయబడితే
  rationale: పూర్తయిన కర్మను సూచించే గ్రీకు కర్మణి రూపాన్ని షరతుతో కూడిన తెలుగు వాక్యనిర్మాణంలో సహజంగా అందిస్తుంది.
- source_word: σκανδαλίσῃ
  choice: తొట్రిల్లేలా చేయడం
  rationale: ఎవరినైనా పాపంలో లేదా ఆత్మీయ పతనంలో పడేలా చేయడాన్ని సూచించే గ్రీకు రూపకాన్ని నిలుపుతుంది; విస్తృత భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: వీరిలోని చిన్నవారిలో ఒక్కరిని
  rationale: వీరు పిల్లలా, శిష్యులా, లేదా అల్పులుగా భావించబడేవారా అన్నది నిర్ణయించకుండా గ్రీకులోని విస్తృతమైన సూచనను కాపాడుతుంది.
- source_word: ἢ ἵνα
  choice: చేయడం కంటే
  rationale: రెండు పరిణామాల మధ్య ఉన్న పోలికను తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: “ఈ చిన్నవారు” అనే మాట ఎవరిని సూచిస్తుంది?
  choice: “వీరిలోని చిన్నవారు” అని సాధారణంగా అనువదించడం
  alternative: “ఈ పిల్లలు” లేదా “ఈ దీనులైన విశ్వాసులు/శిష్యులు”
  rationale: గ్రీకు వాక్యం వారి వయస్సును లేదా విశ్వాసులనే గుర్తింపును స్పష్టంగా నిర్దేశించదు. అందువల్ల ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకుండా అసలు వాక్యంలోని విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. “తొట్రిల్లేలా” అనే రూపకం అసలు గ్రీకు చిత్రాన్ని కాపాడుతుంది; దాని ఆత్మీయ భావం పాదసూచికలో స్పష్టం చేయబడింది. “చిన్నవారు” అనే పదం ఉద్దేశపూర్వకంగా విస్తృతంగా ఉంచబడింది.
