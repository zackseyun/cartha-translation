revisions:
- from: అతడు వీరిలోని చిన్నవారిలో ఒక్కరిని తొట్రిల్లేలా చేయడం[b] కంటే, అతని మెడ చుట్టూ తిరుగలి రాయి[a] కట్టబడి, అతడు సముద్రంలో పడవేయబడితేనే అతనికి మేలు.
