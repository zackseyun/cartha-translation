id: LUK.17.29
reference: Luke 17:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: te
  text: కాని లోతు సొదొమ నుండి బయటికి వెళ్లిన రోజున, ఆకాశం నుండి అగ్ని, గంధకం కురిసి వారందరినీ నాశనం చేశాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: కాని ... వెళ్లిన రోజున
  rationale: కాలాన్ని సూచించే సంబంధ వాక్యాన్ని సహజమైన తెలుగులో ‘వెళ్లిన రోజున’గా ఇచ్చాం. δέ ముందున్న వాక్యంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని ‘కాని’ ద్వారా నిలుపుతుంది.
- source_word: ἐξῆλθεν
  choice: బయటికి వెళ్లిన
  rationale: ἐξέρχομαι సూచించే ప్రత్యక్ష బయటికి కదలికను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: Λὼτ
  choice: లోతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἀπὸ Σοδόμων
  choice: సొదొమ నుండి
  rationale: స్థల నామాన్ని తెలుగులో ఏకవచన నామంగా సహజంగా ఇచ్చి, ἀπό యొక్క మూలస్థాన భావాన్ని ‘నుండి’తో తెలిపాం.
- source_word: ἔβρεξεν
  choice: వర్షంలా కురిసి
  rationale: గ్రీకులో క్రియ ఏకవచన నిరపేక్ష ప్రయోగంగా ఉన్నా, తెలుగులో ‘అగ్ని, గంధకం వర్షంలా కురిసి’ అనడం సహజం; లేని కర్తను చేర్చకుండా వర్షం వంటి కురియడాన్ని స్పష్టం చేస్తుంది.
- source_word: πῦρ καὶ θεῖον
  choice: అగ్ని, గంధకం
  rationale: θεῖον యొక్క సాధారణ ఆధునిక అర్థం ‘గంధకం’; సంప్రదాయబద్ధమైన కానీ తక్కువ పారదర్శకమైన పదబంధాన్ని కాకుండా మూలార్థాన్ని నేరుగా ఇస్తుంది.
- source_word: ἀπ’ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: οὐρανός ఇక్కడ పై నుండి కురియడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘ఆకాశం నుండి’ సహజంగా ఉండి, మూలంలో లేని అదనపు దైవిక కర్తను చేర్చదు.
- source_word: ἀπώλεσεν πάντας
  choice: వారందరినీ నాశనం చేశాయి
  rationale: πάντας లోని మానవ బహువచన సూచనను ‘వారందరినీ’ స్పష్టం చేస్తుంది; ἀπόλλυμι యొక్క విధ్వంస భావాన్ని ‘నాశనం చేశాయి’ నిలుపుతుంది. తెలుగు వ్యాకరణానికి అనుగుణంగా సంయుక్త కర్తతో బహువచన క్రియ వాడాం.
theological_decisions:
- issue: తీర్పు సందర్భంలో θεῖον అనువాదం
  choice: గంధకం
  alternative: గంధక రాయి / బ్రిమ్‌స్టోన్‌కు సమానమైన సంప్రదాయ పదప్రయోగం
  rationale: ‘గంధకం’ మూలపదానికి నేరమైన, ఆధునిక పాఠకులకు అర్థమయ్యే పదం; తీర్పు చిత్రణను తగ్గించదు లేదా విస్తరించదు.
- issue: οὐρανός అనువాదం
  choice: ఆకాశం
  alternative: పరలోకం
  rationale: ఈ వర్షం వంటి భౌతిక కురియడం సందర్భంలో ‘ఆకాశం’ సహజంగా సరిపోతుంది. ‘పరలోకం’ అని ఇవ్వడం ద్వారా మూలం కంటే నిర్దిష్టమైన లోకసంబంధ సిద్ధాంతార్థాన్ని చేర్చకుండా ఉంటుంది; అయినా పై నుండి వచ్చిన తీర్పు భావం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలో లేని కర్తను చేర్చలేదు. ఈ వచనానికి పాదసూచిక అవసరం లేదు; అందువల్ల ప్రధాన పాఠ్యంలో సూచికలేవీ లేవు.
