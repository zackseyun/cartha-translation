revisions:
- from: కాని లోతు సొదొమ నుండి బయటికి వెళ్లిన రోజున, ఆకాశం నుండి అగ్ని, గంధకం వర్షంలా కురిసి వారందరినీ నాశనం చేశాయి.
  to: కాని లోతు సొదొమ నుండి బయటికి వెళ్లిన రోజున, ఆకాశం నుండి అగ్ని, గంధకం కురిసి వారందరినీ నాశనం చేశాయి.
  rationale: The revision removes the unsupported simile while retaining the draft’s faithful temporal contrast, concrete departure language, modern terminology, and direct judgment imagery. It preserves the source’s ambiguity concerning the implicit agent of the raining and destruction.
  reviewer_model: gpt-5.6-terra
