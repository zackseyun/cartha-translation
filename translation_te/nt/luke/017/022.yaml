reference: Luke 17:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: te
  text: 'ఆ తరువాత ఆయన శిష్యులతో ఇలా అన్నాడు: “మనుష్యకుమారుని దినాలలో ఒక్క దినమైనా చూడాలని మీరు ఎంతో ఆశపడే రోజులు వస్తాయి; మీరు దాన్ని చూడరు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మనుష్యకుమారుని దినాలు” అనే మాట ఆయన సన్నిధి, కార్యం ఉన్న కాలాన్ని సూచించవచ్చు; లేదా మరింత ప్రత్యేకంగా ఆయన భవిష్యత్ ప్రత్యక్షతను సూచించవచ్చు. గ్రీకు పదప్రయోగం ఈ పరిధిని స్పష్టంగా పరిమితం చేయదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: ఆ తరువాత ఆయన ... ఇలా అన్నాడు
  rationale: δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపే సంధానపదం. ‘ఆ తరువాత’ సహజమైన తెలుగు ప్రవాహాన్ని ఇస్తుంది; బలమైన వ్యతిరేక భావాన్ని చేర్చదు.
- source_word: πρὸς τοὺς μαθητάς
  choice: శిష్యులతో
  rationale: మూలంలో స్వామ్యసూచక సర్వనామం లేదు. ‘తన శిష్యులతో’ అని చేర్చకుండా, తెలుగు వాడుకలో సహజంగా ‘శిష్యులతో’ అని ఉంచాం.
- source_word: Ἐλεύσονται ἡμέραι
  choice: రోజులు వస్తాయి
  rationale: భవిష్యత్తులో రానున్న కాలాన్ని పరిచయం చేసే ప్రవచనాత్మక ప్రయోగాన్ని సరళంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐπιθυμήσετε
  choice: ఎంతో ఆశపడే
  rationale: ఇది బలమైన కోరికను సూచిస్తుంది. ‘ఎంతో ఆశపడే’ సాధారణ ఆధునిక తెలుగులో ఆ తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: μίαν τῶν ἡμερῶν
  choice: దినాల్లో ఒక్క దినాన్నైనా
  rationale: భాగార్థక సంబంధాన్ని నిలుపుతూ, అనేక దినాల్లో కనీసం ఒక్క దినాన్ని చూడాలనే తీవ్రమైన ఆకాంక్షను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుని
  rationale: యేసు ఉపయోగించిన బిరుదును అక్షరార్థానికి సమీపంగా ఉంచి, దానియేలు గ్రంథ నేపథ్యాన్నీ దైవశాస్త్ర ప్రాధాన్యాన్నీ కాపాడుతుంది.
- source_word: ἰδεῖν
  choice: చూడాలని
  rationale: కోరికను తెలిపే క్రియకు అనుబంధంగా ఉన్న సాధారణ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: καὶ οὐκ ὄψεσθε
  choice: అయితే మీరు దానిని చూడరు
  rationale: καίను సందర్భానుసారమైన స్వల్ప విరుద్ధతతో తెలుగులో సహజంగా అందించాం. ‘దానిని’ అనేది ముందు పేర్కొన్న ఒక్క దినాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ‘మనుష్య కుమారుని దినాలు’ అనే పదబంధం యొక్క పరిధి
  choice: మనుష్య కుమారునికి సంబంధించిన కాలాన్ని అంత్యకాల భావభారంతో సూచించే పదబంధంగా తెరిచి ఉంచడం
  alternative: యేసు భూలోక సేవాకాలం మాత్రమే, లేదా ఆయన భవిష్యత్ ప్రత్యక్షత/తీర్పు కాలం మాత్రమే అని పరిమితం చేయడం
  rationale: సందర్భం శిష్యులు ఆయన సన్నిధి కోసం భవిష్యత్తులో కలిగే ఆకాంక్షను, అలాగే మనుష్య కుమారుని భవిష్యత్ ప్రత్యక్షతను రెండింటినీ ప్రతిధ్వనింపజేయవచ్చు. అందువల్ల అనిశ్చితిని అనువాదంలో పరిష్కరించకుండా మూలంలోని భావతీవ్రతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘రోజులు వస్తాయి’ అనే సాధారణ కాలప్రయోగంతో పాటు బిరుదుతో ముడిపడిన ‘దినాలు’ అనే గంభీర పదాన్ని ఉద్దేశపూర్వకంగా ఉంచాం.
