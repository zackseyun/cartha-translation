id: LUK.17.7
reference: Luke 17:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: te
  text: మీలో ఎవడు పొలం దున్నుతూ లేదా మంద కాస్తూ ఉన్న బానిసను కలిగి ఉండి, అతడు పొలం నుంచి వచ్చినప్పుడు అతనితో, ‘వెంటనే వచ్చి భోజనానికి కూర్చో’[a] అని అంటాడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వచ్చి భోజనం కోసం ఆనుకొని పడుకో.’ ప్రాచీన కాలంలో భోజనం చేసేటప్పుడు బల్ల దగ్గర ఆనుకొని పడుకోవడం ఆచారం.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: దాసుడు
  rationale: ఇది కూలికి పనిచేసే వ్యక్తిని కాక, యజమాని అధికారానికి లోబడిన బానిసత్వ స్థితిలోని గృహ కార్మికుణ్ణి సూచిస్తుంది. ఆధునిక తెలుగు వాక్యంలో గౌరవప్రదమైన సహజత్వంతో పాటు ఆ సామాజిక అసమానతను నిలుపుటకు ‘దాసుడు’ ఎంచుకున్నాం.
- source_word: ἀροτριῶντα
  choice: పొలం దున్నుతున్న
  rationale: వ్యవసాయ పనైన దున్నడాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ποιμαίνοντα
  choice: మందను కాస్తున్న
  rationale: జంతువుల రకాన్ని మూలపాఠం స్పష్టంగా చెప్పదు; అందువల్ల ‘గొర్రెలు’ అని పరిమితం చేయకుండా కాపరి పనిని సహజంగా తెలియజేస్తుంది.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: అతడు పొలం నుంచి వచ్చినప్పుడు
  rationale: ἐρεῖ αὐτῷతో సంబంధమున్న దత్తివ విభక్తి కృదంతం కాలార్థకంగా ఉంది; యజమాని మాటకు ముందు పొలం నుంచి రావడం జరిగినట్లు చూపుతుంది.
- source_word: ἐρεῖ αὐτῷ
  choice: అతనితో ... అని చెబుతాడా
  rationale: భవిష్యత్ కాలంలోని λέγωను ప్రశ్న యొక్క సహజ తెలుగు నిర్మాణంలో నేరుగా ప్రతిబింబిస్తుంది.
- source_word: Εὐθέως
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా తక్షణమే చేయాలనే భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: παρελθὼν
  choice: వచ్చి
  rationale: ప్రధాన ఆజ్ఞకు తోడుగా ఉన్న కదలికను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἀνάπεσε
  choice: భోజనానికి కూర్చో
  rationale: మూలంలో భోజనానికి ఆనుకొని పడుకునే ప్రాచీన ఆచారం సూచితమైనా, ఆధునిక తెలుగులో ఆహ్వానార్థాన్ని స్పష్టంగా అందించేందుకు సహజ సమానార్థక రూపం వాడి, సాంస్కృతిక వివరాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ఉపమానంలోని δοῦλος పదం
  choice: దాసుడు
  alternative: సేవకుడు; బానిస
  rationale: ఈ వాక్యంలోని వాదన యజమాని-దాసుని మధ్యనున్న అసమాన అధికార సంబంధంపై ఆధారపడుతుంది. ‘సేవకుడు’ ఆ బలాన్ని తగ్గించవచ్చు; ‘బానిస’ మరింత ప్రత్యక్షమైన ప్రత్యామ్నాయం అయినా, ప్రధాన పాఠంలో సహజమైన గంభీర శైలికి ‘దాసుడు’ను ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన అలంకార ప్రశ్నగా రూపొందించాం. ‘మంద’ ద్వారా మూలంలోని జంతు-అనిర్దిష్టతను కాపాడాం. ‘దాసుడు’ అనే పదం సామాజిక అధికార అసమానతను నిలుపుతుంది; ప్రాచీన భోజన భంగిమను ప్రధాన వాక్యంలో అసహజంగా చేయకుండా పాదసూచికలో వివరించాం.
