    reason: cultural_note
  revision_rationale: The revision restores the source text’s direct singular rhetorical-question structure and uses “బానిస” to render δοῦλος with its relevant social force. It retains “మంద” so as not to specify sheep where the Greek does not, and it keeps the culturally specific reclining posture in a concise footnote attached to the meal command.
