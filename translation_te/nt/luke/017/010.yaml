id: LUK.17.10
reference: Luke 17:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: te
  text: అలాగే మీరూ, మీకు ఆజ్ఞాపించినవన్నీ చేసినప్పుడు, ‘మేము ప్రతిఫలానికి అర్హతలేని బానిసలం[a]; మేము చేయవలసినదే చేశాం[b]’ అని చెప్పండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పనికిరాని బానిసలం,” “లాభం కలిగించని బానిసలం.” గ్రీకు విశేషణం ప్రయోజనం లేనివారు అనే భావాన్నిగానీ, ప్రత్యేక ప్రతిఫలాన్ని కోరే హక్కు లేనివారు అనే భావాన్నిగానీ ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మా కర్తవ్యాన్ని మాత్రమే నెరవేర్చాం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: అలాగే మీరూ
  rationale: ముందున్న యజమాని–బానిస ఉపమానాన్ని శిష్యులకు అన్వయిస్తున్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὅταν ποιήσητε
  choice: చేసినప్పుడు
  rationale: ὅτανతో కూడిన aorist subjunctive సూచించే సాధారణ భవిష్యత్ సందర్భాన్ని, ఆజ్ఞాపించిన పని పూర్తయిన తర్వాత పలకాల్సిన మాటగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: మీకు ఆజ్ఞాపించినవన్నీ
  rationale: διατάσσωలోని అధికారపూర్వక ఆజ్ఞ భావాన్ని ‘ఆజ్ఞాపించిన’ స్పష్టంగా నిలుపుతుంది.
- source_word: λέγετε
  choice: అని చెప్పండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపాన్ని ఈ బోధనా సందర్భంలో సహజమైన తెలుగు ఆజ్ఞగా అందిస్తుంది.
- source_word: Δοῦλοι
  choice: బానిసలం
  rationale: చుట్టుపక్కల సందర్భం యజమాని–బానిస సంబంధాన్ని స్పష్టంగా చూపుతున్నందున, బంధిత స్థితిని సాధారణమైన ‘సేవకులు’ కంటే బలంగా నిలుపుతుంది.
- source_word: ἀχρεῖοί
  choice: ప్రతిఫలానికి అర్హతలేని
  rationale: ఈ సందర్భంలో విధేయత వల్ల యజమానిపై అదనపు ప్రతిఫలానికి హక్కు ఏర్పడదనే భావాన్ని తెలియజేస్తుంది; వ్యక్తులు అసలు పనికిరానివారు లేదా విలువలేనివారు అనే అతిశయార్థాన్ని నివారిస్తుంది. పదంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపింది.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: మేము చేయవలసినదే
  rationale: ὀφείλωలోని బాధ్యత లేదా కర్తవ్య భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πεποιήκαμεν
  choice: చేశాం
  rationale: పూర్తయిన కార్యాన్ని తెలుగులో సహజంగా తెలుపుతుంది; సందర్భమే దాని ప్రస్తుత ప్రాసంగికతను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: శిష్యత్వ ఉపమానంలో δοῦλοι పదం
  choice: బానిసలం
  alternative: దాసులం / సేవకులం
  rationale: తక్షణ సందర్భంలోని యజమాని–బానిస సామాజిక సంబంధం ఉపమాన బలానికి ముఖ్యమైనది. ‘బానిసలం’ ఆ స్థితిని స్పష్టంగా ఉంచుతుంది; దేవుని పట్ల విధేయత అదనపు పుణ్యహక్కును సృష్టించదనే ఉపమాన ఉద్దేశాన్ని denominational వ్యాఖ్యానం లేకుండా కాపాడుతుంది.
- issue: ἀχρεῖοι పదం యొక్క భావం
  choice: ప్రతిఫలానికి అర్హతలేని
  alternative: పనికిరాని / లాభం కలిగించని / విలువలేని
  rationale: గ్రీకు పదం ప్రయోజనం లేకపోవడం లేదా లాభం కలిగించకపోవడం అనే భావాన్ని కలిగి ఉండగలదు. అయితే ఇక్కడ బానిసలు ఆజ్ఞను నిజంగా నెరవేర్చారు; ప్రధాన వాక్యాన్ని ‘ప్రతిఫలానికి అర్హతలేని’గా ఇవ్వడం ద్వారా వారు యజమానిని తమకు ఋణపడి ఉండేలా చేయలేదనే సందర్భార్థం నిలుస్తుంది. పదసంబంధమైన కఠిన ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడింది. ‘బానిసలం’ చారిత్రక ఉపమానంలోని కఠిన సామాజిక బలాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. ఉద్ధరణలోని బహువచన ప్రథమ పురుష రూపాలు సహజ తెలుగు మాటతీరుకు అనుగుణంగా సంక్షిప్తంగా ఉన్నాయి.
