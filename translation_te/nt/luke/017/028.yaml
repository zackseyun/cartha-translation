translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వరుస అసంపూర్ణ భూతకాల క్రియల కొనసాగుతున్న, నిత్యజీవిత భావాన్ని ‘-తూ ... ఉన్నారు’ నిర్మాణంతో నిలిపాం. గ్రీకులో కర్త అంతర్లీనంగా ఉన్నందున తెలుగులో స్పష్టత కోసం ‘ప్రజలు’ చేర్చబడింది.
