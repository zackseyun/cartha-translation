  to: ఇద్దరు స్త్రీలు ఒకేచోట తిరగలిలో ధాన్యం నూరుతూ ఉంటారు[a]; ఒకరు తీసుకోబడతారు[b], మరొకరు విడిచిపెట్టబడతారు.
  rationale: The revision only clarifies the lexical sense of ἀλήθουσαι in idiomatic modern Telugu. The supplied object “ధాన్యం” is inherent in the hand-mill activity and avoids an opaque expression. The separation language and its theological ambiguity remain unchanged; the footnotes retain both the locative/associative alternative and the interpretive caution.
