id: LUK.17.35
reference: Luke 17:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: te
  text: ఇద్దరు స్త్రీలు ఒకేచోట తిరగలిలో ధాన్యం నూరుతూ ఉంటారు[a]; ఒకరు తీసుకోబడతారు[b], మరొకరు విడిచిపెట్టబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కలిసి.” గ్రీకు నుడికారం “ఒకేచోట” లేదా “కలిసి” అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “తీసుకోబడతారు” అనే మాట మాత్రమే, అలా తీసుకోవడం రక్షణకో తీర్పుకో నిర్దిష్టంగా చెప్పదు; దాని భావాన్ని విస్తృత సందర్భాన్ని బట్టి అర్థం చేసుకోవాలి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται
  choice: ఉంటారు
  rationale: εἰμί భవిష్యత్ రూపాన్ని తెలుగులో సహజమైన భవిష్యత్ దృశ్యవర్ణనగా తెలియజేస్తుంది.
- source_word: δύο ... ἀλήθουσαι
  choice: ఇద్దరు స్త్రీలు ... తిరగలి విసురుతూ
  rationale: స్త్రీలింగ బహువచన కృదంతం ఇద్దరూ స్త్రీలని సూచిస్తుంది; ἀλήθω ధాన్యం విసరే పనిని సూచిస్తుంది. ‘తిరగలి విసరడం’ ఆధునిక పాఠకునికి చేతితో ధాన్యం నూరే దృశ్యాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐπὶ τὸ αὐτό
  choice: ఒకేచోట
  rationale: ఈ నుడికారం ‘కలిసి’ లేదా ‘ఒకే చోట’ అనే అర్థాన్ని కలిగి ఉండవచ్చు. పని జరుగుతున్న ఒకే ప్రదేశాన్ని నేరుగా తెలియజేసే రూపం ఎంచుకోబడింది; ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ἡ μία
  choice: ఒకరు
  rationale: ఇద్దరిలో ఒకరిని వేరుచేసి చూపే సహజమైన తెలుగు రూపం.
- source_word: παραλημφθήσεται
  choice: తీసుకోబడతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నేరుగా నిలుపుతుంది; తీసుకోవడం రక్షణకో తీర్పుకో ఈ పదమే నిర్ణయించదు.
- source_word: ἡ δὲ ἑτέρα
  choice: మరొకరు
  rationale: ఇద్దరిలో రెండవ స్త్రీని భేదపరుస్తూ δέలోని వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀφεθήσεται
  choice: విడిచిపెట్టబడతారు
  rationale: ἀφίημι భవిష్యత్ కర్మణి భావాన్ని నిలుపుతూ, ‘వెనుక’ వంటి మూలంలో లేని అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: తీసుకోబడటం మరియు విడిచిపెట్టబడటం రక్షణను లేదా తీర్పును సూచిస్తాయా?
  choice: ఒకరు తీసుకోబడతారు, మరొకరు విడిచిపెట్టబడతారు
  alternative: ఒకరు తీర్పుకోసం తీసుకుపోబడతారు, మరొకరు కాపాడబడతారు; లేదా ఒకరు రక్షణకు తీసుకోబడతారు, మరొకరు తీర్పుకు విడిచిపెట్టబడతారు
  rationale: వాక్యం విభజనను మాత్రమే స్పష్టంగా చెబుతుంది; ఏ స్థితి రక్షణకో తీర్పుకో పదాలు స్వయంగా నిర్ణయించవు. అందువల్ల మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తిరగలి విసరడం’ గ్రామీణ ధాన్యపు చేతిమర పనిని స్పష్టంగా సూచిస్తుంది. కర్మణి రూపాలు మూలంలోని సమాంతర నిర్మాణాన్ని, ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతాయి.
