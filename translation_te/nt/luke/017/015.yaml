id: LUK.17.15
reference: Luke 17:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: te
  text: అయితే వారిలో ఒకడు తాను స్వస్థత పొందాడని చూసి, బిగ్గర స్వరంతో దేవుణ్ణి మహిమపరుస్తూ తిరిగి వచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: అయితే వారిలో ఒకడు
  rationale: εἷς ἐξ αὐτῶν అనే భాగసూచక నిర్మాణానికి ‘వారిలో ఒకడు’ సహజమైన అనువాదం. δέ ఇక్కడ మిగిలినవారితో ఉన్న కథన వ్యత్యాసాన్ని స్వల్పంగా సూచిస్తుంది; అందుకే ‘అయితే’ ఎంచుకున్నాం.
- source_word: ἰδὼν ὅτι ἰάθη
  choice: తాను స్వస్థపడ్డానని చూసి
  rationale: ἰδὼν అనే భూతకాల కృదంతం ప్రధాన క్రియకు ముందు లేదా దానితో సన్నిహితంగా జరిగిన గ్రహింపును తెలియజేస్తుంది. ἰάθη అనేది స్వస్థత పొందడాన్ని సూచించే భూతకాల కర్మణి రూపం; తెలుగు ప్రత్యక్ష గ్రహింపు నిర్మాణంలో ‘తాను స్వస్థపడ్డానని చూసి’ సహజంగా ఉంటుంది.
- source_word: ὑπέστρεψεν
  choice: తిరిగి వచ్చాడు
  rationale: సందర్భంలో అతడు యేసు వద్దకు వెనక్కి రావడం ఉద్దేశించబడింది. ‘తిరిగి వచ్చాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి కదలికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: μετὰ φωνῆς μεγάλης
  choice: పెద్ద స్వరంతో
  rationale: గ్రీకు ప్రయోగం బిగ్గరగా పలకడాన్ని సూచిస్తుంది. ‘పెద్ద స్వరంతో’ మూలరూపానికి దగ్గరగా ఉండి తెలుగులో స్పష్టంగా అర్థమవుతుంది.
- source_word: δοξάζων τὸν θεόν
  choice: దేవుణ్ణి మహిమపరుస్తూ
  rationale: δοξάζω యొక్క ప్రధాన భావమైన మహిమను ఆపాదించడం లేదా ప్రకటించడం ‘మహిమపరచు’ ద్వారా నిలుస్తుంది; దానిలో స్తుతి భావం కూడా ఇమిడి ఉంది.
theological_decisions:
- issue: τὸν θεόν అనువాదం
  choice: దేవుణ్ణి
  alternative: దేవునికి మహిమ చెల్లిస్తూ
  rationale: మూలంలో దేవుణ్ణి మహిమపరచడం మాత్రమే ఉంది; అదనపు సిద్ధాంత వివరణ అవసరం లేదు. ‘దేవుణ్ణి’ ప్రత్యక్ష కర్మగా గ్రీకు నిర్మాణాన్ని సరిగ్గా ప్రతిబింబిస్తుంది.
- issue: δοξάζων లోని మహిమ/స్తుతి భావం
  choice: మహిమపరుస్తూ
  alternative: స్తుతిస్తూ
  rationale: మూల క్రియలో ‘మహిమపరచడం’ మరియు ‘స్తుతించడం’ రెండూ సంభవించినప్పటికీ, ప్రధాన పాఠ్యంలో విస్తృతమైన మహిమ భావాన్ని నిలిపి, దానిని కేవలం స్తుతిగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు కృదంతాల ప్రవాహాన్ని ‘చూసి… మహిమపరుస్తూ’ అనే నిర్మాణాలతో నిలిపాం.
