id: LUK.17.8
reference: Luke 17:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: te
  text: అలా కాకుండా, అతడు అతనితో, ‘నేను తినడానికి ఏదైనా సిద్ధం చేసి, నడుము బిగించుకొని[a], నేను తిని తాగే వరకు[b] నాకు వడ్డిస్తూ ఉండు. ఆ తర్వాత నువ్వు తిని తాగుతావు’ అని చెప్పడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నిన్ను నీవు నడుము కట్టుకొని.’ పని చేయడానికి పొడవాటి వస్త్రాలను పైకెత్తి నడుము దగ్గర బిగించుకోవడాన్ని ఇది సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘నేను తిని తాగడం పూర్తయ్యే వరకు’ అనే భావం కూడా ఇందులో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: దానికి బదులుగా ... చెప్పడా?
  rationale: ἀλλά ముందున్న ప్రశ్నకు విరుద్ధమైన సాధారణ చర్యను పరిచయం చేస్తుంది; οὐχί సానుకూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను సూచిస్తుంది.
- source_word: ἐρεῖ αὐτῷ
  choice: అతడు అతనితో ... అని చెప్పడా?
  rationale: భవిష్యత్ క్రియ యొక్క భావాన్ని తెలుగు అలంకారిక ప్రశ్నలో సహజంగా వ్యక్తం చేస్తూ, αὐτῷ అనే పరోక్ష కర్మను స్పష్టంగా నిలుపుతుంది.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: నా భోజనం సిద్ధం చేయి
  rationale: τί δειπνήσω అక్షరార్థంగా ‘నేను భోజనం చేయడానికి దానిని’ సూచిస్తుంది. ‘నా భోజనం’ సందర్భానుకూలంగా, సహజంగా ఉంది; దానిని ప్రత్యేకంగా ‘రాత్రి భోజనం’గా నిర్బంధించదు.
- source_word: περιζωσάμενος
  choice: నడుము కట్టుకొని
  rationale: పని చేయడానికి పొడవాటి వస్త్రాన్ని నడుము దగ్గర బిగించుకునే దృశ్యాన్ని నిలుపుతుంది; ఆధునిక పాఠకునికి సాంస్కృతిక వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: διακόνει μοι
  choice: నాకు వడ్డించు
  rationale: ఈ భోజన సందర్భంలో διακονέω బల్ల దగ్గర సేవ చేయడాన్ని సూచిస్తుంది. ‘వడ్డించు’ సాధారణ ‘సేవచేయి’ కంటే సందర్భాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἕως φάγω καὶ πίω
  choice: నేను తిని తాగే వరకు
  rationale: ἕως తో ఉన్న aorist subjunctive క్రియలు యజమాని తినడం, తాగడం పూర్తయ్యే కాలపరిమితిని సూచిస్తాయి. తెలుగులో ఈ రూపమే సహజం; పూర్తి భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: μετὰ ταῦτα
  choice: ఆ తర్వాత
  rationale: కాలక్రమాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: నువ్వు తిని తాగుతావు
  rationale: భవిష్యత్ క్రియారూపాలను నేరుగా నిలుపుతూ, ప్రత్యేకంగా ఉంచిన σύ యొక్క నొక్కిచెప్పే భావాన్ని ‘నువ్వు’ ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని సామాజిక పాత్రకు వాడే పదం
  choice: ఈ వచనంలో లేని ‘దాసుడు’ లేదా ‘బానిస’ అనే నామవాచకాన్ని చేర్చకుండా సర్వనామాలనే ఉంచడం
  alternative: సందర్భ స్పష్టత కోసం ‘ఆ దాసునితో’ అని విస్తరించడం
  rationale: చుట్టుపక్కల సందర్భంలో δοῦλος ఉన్నప్పటికీ, ఈ వచనంలో αὐτῷ అనే సర్వనామమే ఉంది. మూలంలో లేని సామాజిక-పాత్ర నామాన్ని చేర్చకుండా, ఆజ్ఞలు మరియు చర్యల ద్వారా సంబంధాన్ని గ్రహించనివ్వడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: సేవకుడు తర్వాత తినడం అనుమతినా లేక భవిష్యత్ ప్రకటననా
  choice: ‘నువ్వు తిని తాగుతావు’ అనే భవిష్యత్ ప్రకటన
  alternative: ‘నువ్వు తిని తాగవచ్చు’ అనే అనుమతి రూపం
  rationale: φάγεσαι καὶ πίεσαι భవిష్యత్ రూపాలు. సందర్భంలో అనుమతి భావం ఊహించగలిగినా, దానిని స్పష్టంగా జోడించకుండా మూలంలోని భవిష్యత్ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. ‘నడుము కట్టుకొని’ అనే సాంస్కృతిక దృశ్యాన్ని ప్రధాన పాఠంలో నిలిపి పాదసూచికలో వివరించాం. అలంకారిక ప్రశ్న సానుకూల సమాధానాన్ని ఆశించేలా ‘చెప్పడా?’ అని రూపొందించాం.
