- from: దానికి బదులుగా, అతడు అతనితో, ‘నా భోజనం సిద్ధం చేయి; నడుము కట్టుకొని[a], నేను తిని తాగే వరకు[b] నాకు వడ్డించు. ఆ తర్వాత నువ్వు తిని తాగుతావు’ అని చెప్పడా?
  to: అలా కాకుండా, అతడు అతనితో, ‘నేను తినడానికి ఏదైనా సిద్ధం చేసి, నడుము బిగించుకొని[a], నేను తిని తాగే వరకు[b] నాకు వడ్డిస్తూ ఉండు. ఆ తర్వాత నువ్వు తిని తాగుతావు’ అని చెప్పడా?
