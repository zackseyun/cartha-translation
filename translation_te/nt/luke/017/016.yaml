id: LUK.17.16
reference: Luke 17:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: te
  text: అతడు ఆయన పాదాల దగ్గర ముఖం నేలకు ఆనించి పడి, ఆయనకు కృతజ్ఞతలు చెప్పాడు. అతడు సమరయుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: సాష్టాంగపడి
  rationale: ముఖం నేలకు ఆనేటట్లు భక్తిపూర్వకంగా పడిన భంగిమను సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: ఆయన పాదాల దగ్గర
  rationale: παρά యొక్క స్థలార్థాన్ని నిలుపుతూ, యేసు పాదాల వద్ద వినయంగా పడిన సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: εὐχαριστῶν αὐτῷ
  choice: ఆయనకు కృతజ్ఞతలు చెప్పాడు
  rationale: సమకాలిక సహాయక క్రియను తెలుగులో సహజమైన వరుస క్రియలుగా అందించి, కృతజ్ఞత యేసుకే తెలియజేశాడనే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: Σαμαρίτης
  choice: సమరయుడు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన జాతి-మత సమూహ సూచన; కథలోని సామాజిక ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: అతడు సమరయుడు
  rationale: αὐτός ఇచ్చే వ్యక్తిగత నొక్కింపును సరళమైన వాక్యంతో నిలుపుతూ, వివరణాత్మక పదాలను చేర్చదు.
theological_decisions:
- issue: స్వస్థత పొందిన వ్యక్తి గుర్తింపుపై కథన నొక్కింపు
  choice: అతడు సమరయుడు
  alternative: నిజానికి అతడు సమరయుడు
  rationale: కృతజ్ఞత తెలిపినవాడు సామాజికంగా వెలివాడిగా భావించబడే సమరయుడనే ఆశ్చర్యాన్ని వ్యాఖ్యానం జోడించకుండా సూటిగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సాష్టాంగపడి’ అనే పదం భక్తిపూర్వకంగా ముఖం నేలవైపు ఉంచి పడటాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ‘ఆయన’ యేసును గౌరవసూచకంగా సూచిస్తుంది.
