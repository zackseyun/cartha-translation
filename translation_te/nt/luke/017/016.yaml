    issue: “సాష్టాంగపడి” is more specific than the source expression.
    rationale: καὶ ἔπεσεν ἐπὶ πρόσωπον describes falling face down; it does not identify the particular eight-limbed ritual posture conventionally denoted by “సాష్టాంగం.” A less specialized expression preserves the source's vivid posture without added cultural or devotional specification.
  revised_text: అతడు ఆయన పాదాల దగ్గర ముఖం నేలకు ఆనించి పడి, ఆయనకు కృతజ్ఞతలు చెప్పాడు. అతడు సమరయుడు.
