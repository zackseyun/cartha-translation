  source_fidelity: The draft accurately conveys falling at Jesus' feet, thanking him, and the man's Samaritan identity. However, “సాష్టాంగపడి” specifies a culturally defined full-body prostration posture beyond the Greek, which states that he fell on his face.
  naturalness: The revised wording is natural modern standard Telugu and clearly depicts the face-to-ground posture without imposing extra ritual detail.
  terminology: “ఆయన పాదాల దగ్గర,” “కృతజ్ఞతలు చెప్పాడు,” and “సమరయుడు” are appropriate, respectful, and established Telugu renderings. No footnote is needed.
  issues:
