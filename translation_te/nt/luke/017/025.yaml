  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: te
  text: కాని ముందుగా ఆయన ఎన్నో బాధలు అనుభవించాలి; ఈ తరం చేత తిరస్కరించబడాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: ముందుగా
  rationale: కాలక్రమంలో మొదట జరగవలసినదాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: ముందటి సందర్భంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని, భావమార్పును నిలుపుతుంది.
- source_word: δεῖ
  choice: అనుభవించాలి; … తిరస్కరించబడాలి
  rationale: రెండు క్రియలకూ వర్తించే అవసర భావాన్ని తెలుగులో ‘ఆలి’ రూపాలతో సంక్షిప్తంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτὸν
  choice: ఆయన
  rationale: సందర్భంలోని మనుష్యకుమారుని సూచించే సర్వనామాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: πολλὰ
  choice: ఎన్నో బాధలు
  rationale: నపుంసక బహువచనం సూచించే విస్తృతమైన అనుభవాలను తెలుగులో సహజంగా తెలియజేస్తుంది; παθεῖν‌తో కలిపి బాధల భావాన్ని స్పష్టం చేస్తుంది.
- source_word: παθεῖν
  choice: బాధలు అనుభవించాలి
  rationale: πάσχω యొక్క బాధపడటం లేదా బాధలను ఎదుర్కోవటం అనే భావాన్ని సహజమైన తెలుగు పదబంధంగా అందిస్తుంది.
- source_word: ἀποδοκιμασθῆναι
  choice: తిరస్కరించబడాలి
  rationale: పరిశీలించి అంగీకరించకుండా తోసిపుచ్చే భావాన్ని, మూలంలోని కర్మణి రూపాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ఈ తరం చేత
  rationale: కర్మణి క్రియతో ἀπό సూచించే కార్యకర్తను తెలియజేస్తూ, γενεά యొక్క సమకాలీన ‘తరం’ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మనుష్యకుమారుని బాధల విషయంలో δεῖ తెలిపే అవసరం
  choice: ‘అనుభవించాలి; … తిరస్కరించబడాలి’ అని అనువదించి అవసర భావాన్ని నిలిపాం; దాని మూలాన్ని ప్రత్యేకంగా వివరించలేదు.
  alternative: ‘దేవుని సంకల్పం ప్రకారం తప్పక’ అని స్పష్టీకరించడం
  rationale: లూకా రచనలో δεῖ తరచుగా దేవుని ఉద్దేశంతో సంబంధమున్న అవసరాన్ని సూచించినా, ఈ వాక్యం దానిని ప్రత్యక్షంగా వివరించదు. అందువల్ల ఆ ధార్మిక బరువును పరోక్షంగా ఉంచి, వివరణాత్మక పదాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, గంభీరంగా ఉంది. మూలంలోని వ్యత్యాసం, అవసర భావం, కర్మణి నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
