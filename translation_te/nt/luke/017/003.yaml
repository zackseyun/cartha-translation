source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: te
  text: మిమ్మల్ని మీరు జాగ్రత్తగా చూసుకోండి.[a] నీ సోదరుడు పాపం చేస్తే అతణ్ణి గద్దించు; అతడు పశ్చాత్తాపపడితే అతణ్ణి క్షమించు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “నీ సోదరుడు నీకు విరోధంగా పాపం చేస్తే అతణ్ణి గద్దించు” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: గ్రీకులో “సోదరుడు” పుంలింగ ఏకవచనంలో ఉంది; సందర్భంలో ఇది తోటి శిష్యుణ్ణి మరింత విస్తృతంగా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: మీ విషయంలో మీరు జాగ్రత్తగా ఉండండి
  rationale: వర్తమాన ఆజ్ఞారూపం నిరంతర అప్రమత్తతను సూచిస్తుంది. ప్రతిబింబ సర్వనామాన్ని నిలుపుతూ, వ్యక్తిగత స్వపరిశీలనతోపాటు సమూహంలోని పరస్పర జాగ్రత్త అనే అవకాశాన్ని పూర్తిగా మూసివేయని సహజమైన తెలుగు రూపం.
- source_word: ἁμάρτῃ
  choice: పాపం చేస్తే
  rationale: SBLGNT పాఠంలో ‘నీకు విరోధంగా’ అనే కర్మ లేదు. అందువల్ల దానిని ప్రధాన పాఠంలో చేర్చకుండా క్రియ యొక్క విస్తృత అర్థాన్ని నిలిపింది.
- source_word: ὁ ἀδελφός σου
  choice: నీ సోదరుడు
  rationale: గ్రీకులో పుంలింగ ఏకవచనం ఉన్నందున దానిని యథార్థంగా అనువదించింది. సందర్భంలో ఇది తోటి శిష్యుణ్ణి విస్తృతంగా సూచించే అవకాశం పాదటీపులో వివరించబడింది.
- source_word: ἐπιτίμησον αὐτῷ
  choice: అతణ్ణి గద్దించు
  rationale: నేరుగా, గట్టిగా తప్పును ఎత్తిచూపి సరిదిద్దే ఆజ్ఞాబలాన్ని ‘గద్దించు’ సహజంగా వ్యక్తం చేస్తుంది; ‘హెచ్చరించు’ లేదా ‘సరిదిద్దు’ కంటే మూలపద బలాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: μετανοήσῃ
  choice: పశ్చాత్తాపపడితే
  rationale: నైతికంగా మనసు మార్చుకొని తప్పు నుండి తిరగడాన్ని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదప్రయోగం.
- source_word: ἄφες αὐτῷ
  choice: అతణ్ణి క్షమించు
  rationale: వ్యక్తుల మధ్య సంబంధ సందర్భంలో ἀφίημι యొక్క సహజమైన అర్థం ‘క్షమించు’; తెలుగులో కర్మను వ్యక్తిగా ఉంచడం సూటిగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ‘పాపం చేస్తే’ తరువాత ‘నీకు విరోధంగా’ చేర్చాలా?
  choice: ప్రధాన పాఠంలో చేర్చలేదు
  alternative: ‘నీ సోదరుడు నీకు విరోధంగా పాపం చేస్తే’
  rationale: ఇచ్చిన SBLGNT గ్రీకు పాఠంలో εἰς σέ లేదా దానికి సమానమైన పదబంధం లేదు. మూలపాఠ ప్రాధాన్యాన్ని కాపాడేందుకు సంక్షిప్త పాఠాన్ని ప్రధాన అనువాదంలో ఉంచి, విస్తృత పాఠాన్ని పాఠాంతరంగా పాదటీపులో ఇచ్చింది.
- issue: ἀδελφός యొక్క లింగం మరియు సందర్భార్థం
  choice: ‘నీ సోదరుడు’
  alternative: ‘నీ తోటి విశ్వాసి’ లేదా ‘నీ సోదరుడు లేదా సోదరి’
  rationale: మూలపదం వ్యాకరణపరంగా పుంలింగ ఏకవచనం. అయితే శిష్యసమాజంలోని తోటి శిష్యులను విస్తృతంగా సూచించవచ్చనే సందర్భార్థాన్ని ప్రధాన పాఠంలో విస్తరించకుండా పాదటీపులో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. మొదటి వాక్యంలోని బహువచన సంబోధనను ‘మీరు’తో, తరువాతి ఏకవచన ఆజ్ఞలను ‘నీ/గద్దించు/క్షమించు’తో నిలిపి గ్రీకు వచనభేదాన్ని ప్రతిబింబించింది. అన్ని పాదటీపు సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
