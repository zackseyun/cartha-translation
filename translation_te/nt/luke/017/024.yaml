id: LUK.17.24
reference: Luke 17:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: te
  text: ఎందుకంటే, మెరుపు ఆకాశం క్రింద ఒక వైపు నుండి ఆకాశం క్రింద మరో వైపు వరకు మెరుస్తూ ప్రకాశిస్తుందో[a], మనుష్యకుమారుడు తన దినంలో అలాగే ఉంటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, ‘ఆకాశపు ఒక చివర నుండి మరో చివర వరకు’ అని అనువదించవచ్చు. గ్రీకు మూలం రెండు భాగాల్లోనూ ‘ఆకాశం కింద’ అనే మాటను పునరావృతం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన దినాన.’ ఈ మాట మనుష్యకుమారునితో సంబంధమున్న కాలాన్ని సూచిస్తుంది; దాని భావాన్ని మూలపాఠం చెప్పినదానికంటే నిర్దిష్టంగా చేయలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ఎందుకంటే, ... చేసినట్లే
  rationale: γάρ యొక్క వివరణాత్మక భావాన్నీ, ὥσπερ ప్రారంభించే పోలిక నిర్మాణాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: మెరుపు ... మెరుస్తూ
  rationale: నామవాచకం, దానితో సంబంధమున్న వర్తమాన కృదంతం రెండింటినీ నిలిపి, దృశ్యానికి సజీవత్వం ఇస్తుంది.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανόν
  choice: ఆకాశం కింద ఒక వైపు నుండి ఆకాశం కింద మరో వైపు వరకు
  rationale: మూలంలో రెండుసార్లు వచ్చే ‘ఆకాశం కింద’ అనే వ్యక్తీకరణను స్పష్టంగా నిలుపుతూ, తెలుగులో దిశా విస్తారాన్ని అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: λάμπει
  choice: ప్రకాశించినట్లే
  rationale: ముందున్న ἀστράπτουσα (‘మెరుస్తూ’) నుండి ఈ క్రియను వేరుగా చూపి, మూలంలోని రెండు సంబంధితమైనా భిన్నమైన క్రియలను నిలుపుతుంది.
- source_word: οὕτως ἔσται
  choice: అలాగే ఉంటాడు
  rationale: పోలికను ముగించే సరళమైన భవిష్యత్ నిర్మాణాన్ని ప్రతిబింబిస్తుంది; ప్రత్యక్షమవడం వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు ఉపయోగించిన బిరుదుకు స్థిరమైన, పారదర్శకమైన తెలుగు రూపం; దానిని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: తన దినంలో
  rationale: αὐτοῦ యొక్క స్వకీయ భావాన్ని నిలుపుతూ, మనుష్య కుమారునితో సంబంధమున్న కాలాన్ని ఉద్దేశపూర్వకంగా విస్తృతంగానే ఉంచుతుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో ‘మనుష్య కుమారుడు తన దినంలో’ అనే మాటకు గల భావం
  choice: తన దినంలో
  alternative: ఆయన రాకడలో; తీర్పు దినాన; మనుష్య కుమారుని దినాన
  rationale: సందర్భం అంత్యకాల సంబంధమైనదైనా, గ్రీకు పాఠం ఇక్కడ ‘తన దినంలో’ అని మాత్రమే చెబుతుంది. ‘రాకడ’ లేదా ‘తీర్పు’ అని విస్తరించడం మూలంలో స్పష్టంగా లేని వ్యాఖ్యానాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ‘ఆకాశం కింద’ పునరుక్తిని ప్రధాన పాఠంలో ఉంచి, మరింత సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. ‘తన దినంలో’ అనే అంత్యకాల వాక్యభాగాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
