  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: te
  text: ఇద్దరు[a] పొలంలో ఉంటారు; ఒకడు తీసుకోబడతాడు, మరొకడు విడిచిపెట్టబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో—నాలుగో శతాబ్దపు సీనాయిటికస్, వాటికానస్ ప్రతులతో సహా—మరియు ప్రాచీన కాప్టిక్ అనువాదాల్లో లేదు. అయితే పాశ్చాత్య పాఠసంప్రదాయంలో (ఉదాహరణకు, ఐదో శతాబ్దపు కోడెక్స్ బేజే), బైజాంటైన్ అధికసంఖ్యాక ప్రతుల్లో, లాటిన్ వల్గేట్‌లో ఉంది. మత్తయి 24:40కి అనుగుణంగా చేయడానికి తరువాతి నకలు రచయితలు దీన్ని చేర్చి ఉండవచ్చు.
    reason: textual_critical
lexical_decisions:
- source_word: δύο
  choice: ఇద్దరు
  rationale: గ్రీకు పదం కేవలం ‘ఇద్దరు’ అని చెబుతుంది; తెలుగులో వ్యక్తులను సహజంగా సూచిస్తూ, మూలంలో లేని ‘మనుషులు’ అనే నామవాచకాన్ని చేర్చకుండా ఉంచుతుంది.
- source_word: παραλαμβάνω
  choice: తీసుకోబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, ఒకరిని తీసుకోవడం అనే భావాన్ని తెలియజేస్తుంది; ఎక్కడికి లేదా ఏ ఉద్దేశంతో తీసుకుంటారో వచనం స్పష్టంగా చెప్పనందున అది అనువాదంలో చేర్చబడలేదు.
- source_word: ἀφίημι
  choice: విడిచిపెట్టబడతాడు
  rationale: తీసుకోబడటానికి ప్రత్యక్ష విరుద్ధంగా, అక్కడే వదిలివేయబడటం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἕτερος
  choice: మరొకడు
  rationale: ముందు పేర్కొన్న ఇద్దరిలో రెండవ వ్యక్తిని సూచించే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: తీసుకోబడే వ్యక్తి, విడిచిపెట్టబడే వ్యక్తి—వీరిలో ఎవరు రక్షణకు లేదా తీర్పుకు సంబంధించినవారో గుర్తించడం
  choice: వచనం చెప్పిన చర్యలను మాత్రమే అనువదించి, వారి అంతిమ గమ్యాన్ని నిర్దిష్టంగా పేర్కొనలేదు.
  alternative: ‘రక్షించబడతాడు/తీర్పుకు తీసుకుపోబడతాడు’ లేదా ‘రక్షణ కోసం విడిచిపెట్టబడతాడు’ వంటి వివరణాత్మక పదాలను చేర్చడం.
  rationale: παραληφθήσεται మరియు ἀφεθήσεται అనే పదాలు తీసుకోబడటం, విడిచిపెట్టబడటం అనే వ్యత్యాసాన్ని చూపుతాయి; ఈ ఒక్క వచనం ఆ చర్యల ధార్మిక ఫలితాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల మూలంలోని ఉద్వేగం, సందిగ్ధత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘తీసుకోబడతాడు/విడిచిపెట్టబడతాడు’ అనే సమాంతర కర్మణి రూపాలు గ్రీకు వాక్యంలోని వ్యత్యాసాన్ని కాపాడుతాయి; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
