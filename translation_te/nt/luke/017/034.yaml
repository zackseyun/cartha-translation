source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: te
  text: '“నేను మీతో చెబుతున్నాను: ఆ రాత్రి ఒకే మంచం మీద ఇద్దరు ఉంటారు; ఒకరు తీసుకుపోబడతారు[a], మరొకరు విడిచిపెట్టబడతారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తనతో తీసుకుపోబడతారు.” ఇక్కడ παραλημφθήσεται అనే క్రియ, ఆ తీసుకుపోవడం రక్షణ కోసమా లేక తీర్పు కోసమా అన్నది స్వయంగా నిర్దేశించదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వెనుక విడిచిపెట్టబడతారు.” గ్రీకులో స్పష్టంగా లేని తరువాతి అంత్యకాల అనుబంధాలను చేర్చకుండా ఉండేందుకు ప్రధాన పాఠ్యంలో సంక్షిప్త రూపం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్షంగా, నొక్కిచెప్పే సంభాషణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ταύτῃ τῇ νυκτί
  choice: ఆ రాత్రి
  rationale: దృష్టిలో ఉన్న నిర్దిష్ట రాత్రిని సూచించే కాలార్థక దత్తివును సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔσονται δύο
  choice: ఇద్దరు ఉంటారు
  rationale: భవిష్యత్ అర్థాన్ని, వ్యక్తులను సూచించే సంఖ్యను సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: ఒకే మంచం మీద
  rationale: κλίνη రాత్రి సందర్భంలో ‘మంచం’గా సహజం; μιᾶς లోని ఏకత్వ భావాన్ని ‘ఒకే’ స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ εἷς
  choice: ఒకరు
  rationale: వ్యక్తిని సూచించే substantival numeral‌కు తెలుగు గౌరవ/సాధారణ వ్యక్తివాచక రూపం సహజంగా సరిపోతుంది.
- source_word: παραλημφθήσεται
  choice: తీసుకుపోబడతారు
  rationale: παραλαμβάνω యొక్క ‘తనతో తీసుకుపోవడం’ భావాన్ని చూపుతూ, అది రక్షణకో తీర్పుకో అనే విషయాన్ని నిర్ణయించదు.
- source_word: ὁ ἕτερος
  choice: మరొకరు
  rationale: జతలోని వేరొక వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: ἀφεθήσεται
  choice: విడిచిపెట్టబడతారు
  rationale: ఇక్కడ ప్రతిపదార్థంగా ‘వదలడం/విడిచిపెట్టడం’ సరిపోతుంది; ‘వెనుక విడిచిపెట్టడం’ వంటి తరువాతి అంత్యకాల అనుబంధాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: తీసుకుపోబడే వ్యక్తి రక్షణకు తీసుకోబడుతున్నాడా లేక తీర్పుకు తీసుకోబడుతున్నాడా
  choice: ప్రధాన పాఠ్యం తటస్థంగా ‘ఒకరు తీసుకుపోబడతారు’ అని ఉంచుతుంది.
  alternative: రక్షణకు తీసుకుపోబడతారు; లేదా తీర్పుకు తీసుకుపోబడతారు.
  rationale: ఈ వచనంలోని గ్రీకు క్రియ స్వయంగా తీసుకుపోవడం యొక్క గమ్యాన్ని లేదా ఫలితాన్ని నిర్దేశించదు; అందువల్ల నిజమైన వ్యాఖ్యాన సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. గ్రీకు పాఠ్యంలోని జత నిర్మాణం, భవిష్యత్ కాలం, మరియు అంత్యకాల ఫలితంపై ఉన్న ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
