id: LUK.17.9
reference: Luke 17:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ⸂ἔχει χάριν⸃ τῷ ⸀δούλῳ ὅτι ἐποίησεν τὰ ⸀διαταχθέντα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: te
  text: ఆ దాసుడు[a] ఆజ్ఞాపించినవాటిని చేశాడని యజమాని అతనికి కృతజ్ఞత తెలుపుతాడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవకుడు’ లేదా ‘బానిస’; గ్రీకు పదం దూలోస్.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: చెబుతాడా?
  rationale: μή సూచించే ప్రశ్నకు ప్రతికూల సమాధానం ఆశించబడుతుంది. తెలుగులో సందర్భమే ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది కాబట్టి సహజమైన ప్రశ్నారూపాన్ని వాడాం.
- source_word: ἔχει χάριν
  choice: కృతజ్ఞత చెబుతాడా
  rationale: ἔχειν χάριν τινί అనే నుడికారం ఇక్కడ ‘కృతజ్ఞత చూపడం/కృతజ్ఞత చెప్పడం’ అనే అర్థం ఇస్తుంది. ఆధునిక తెలుగులో ‘కృతజ్ఞత చెబుతాడు’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: τῷ δούλῳ
  choice: ఆ దాసుడు … అతనికి
  rationale: δοῦλος యజమాని అధికారానికి లోబడి ఆజ్ఞలను నెరవేర్చవలసిన వ్యక్తిని సూచిస్తుంది. ‘దాసుడు’ ఆ సామాజిక అసమానతను ‘సేవకుడు’ కంటే బలంగా నిలుపుతుంది; తెలుగు వాక్యనిర్మాణంలో స్పష్టత కోసం దీనిని కర్తగా మార్చి, యజమానిని వ్యక్త కర్తగా చేర్చాం.
- source_word: ὅτι
  choice: … చేశాడని
  rationale: ὅτι ఇక్కడ కృతజ్ఞతకు ప్రతిపాదిత కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అని’తో కూడిన నిర్మాణం ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐποίησεν
  choice: చేశాడు
  rationale: ποιέω ఇక్కడ ఆదేశించిన పనులను నిర్వర్తించడాన్ని సూచిస్తుంది; ‘చేశాడు’ సరళమైన, సహజమైన సమానార్థకం.
- source_word: τὰ διαταχθέντα
  choice: ఆజ్ఞాపించినవాటిని
  rationale: నిర్దేశకంతో కూడిన కర్మణి భూతకృదంతం ‘ఆజ్ఞాపించబడిన విషయాలు’ అనే భావాన్ని ఇస్తుంది. ‘ఆజ్ఞాపించినవాటిని’ తెలుగులో సంక్షిప్తంగా ఉండి, ఆజ్ఞ యొక్క భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యజమాని–దాసుడు సందర్భంలో δοῦλος అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు / బానిస
  rationale: ఈ ఉపమానంలోని తర్కం ఆ వ్యక్తి ఆజ్ఞకు బద్ధుడై ఉండడంపై ఆధారపడింది. ‘సేవకుడు’ ఆ అధీనస్థితిని మృదువుగా చేయవచ్చు; ‘బానిస’ ఆధునిక తెలుగులో మరింత కఠినమైన సామాజిక ప్రతిధ్వని కలిగిస్తుంది. ‘దాసుడు’ మూలంలోని అధికార అసమానతను గౌరవప్రదమైన బైబిలు శైలిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్నారూపం వాడబడింది. గ్రీకు వాక్యంలో యజమాని వ్యక్తంగా లేకపోయినా సందర్భంలో కృతజ్ఞత చూపే వ్యక్తి యజమానే కాబట్టి తెలుగులో స్పష్టత కోసం ‘యజమాని’ చేర్చబడింది. ప్రశ్నకు ఆశించబడే ‘లేదు’ అనే సమాధానాన్ని సందర్భానికే వదిలి, మూలంలోని వాక్చాతుర్యాన్ని నిలిపాం.
