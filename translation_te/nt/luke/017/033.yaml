id: LUK.17.33
reference: Luke 17:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: te
  text: తన ప్రాణాన్ని కాపాడుకోవాలని ప్రయత్నించే వ్యక్తి దాన్ని పోగొట్టుకుంటాడు[a]; అయితే దాన్ని పోగొట్టుకునే వ్యక్తి దాన్ని సజీవంగా ఉంచుతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’కు బదులుగా ‘జీవితం’ అని కూడా అనువదించవచ్చు. గ్రీకు ψυχή ఇక్కడ వ్యక్తి ప్రాణం, జీవితం లేదా తననే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దాన్ని బ్రతికిస్తాడు.’ గ్రీకు క్రియకు ‘సజీవంగా ఉంచడం’ లేదా ‘జీవింపజేయడం’ అనే అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: ప్రయత్నించే
  rationale: ఇక్కడ ζητέω కేవలం కోరికను కాక, ఉద్దేశపూర్వకంగా సాధించడానికి ప్రయత్నించడాన్ని సూచిస్తుంది.
- source_word: ψυχὴν
  choice: ప్రాణాన్ని
  rationale: ఈ సందర్భంలో ψυχή అమూర్తమైన ఆత్మను ప్రత్యేకంగా కాక, వ్యక్తి ప్రాణం లేదా జీవాన్ని సూచిస్తుంది; తెలుగు సహజ వాడుకలో ‘ప్రాణం’ ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: περιποιήσασθαι
  choice: కాపాడుకోవాలని
  rationale: మధ్యమ ప్రయోగంలోని తనకోసం భద్రపరచుకోవడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: పోగొట్టుకుంటాడు / పోగొట్టుకునే
  rationale: రెండు ఉపవాక్యాల్లోనూ ఒకే మూలక్రియకు అనుగుణతను ఉంచి, వాక్యంలోని వైరుధ్యభాసాన్ని నిలిపింది.
- source_word: ζῳογονήσει
  choice: సజీవంగా కాపాడుకుంటాడు
  rationale: సాధారణ ‘రక్షించు’ అనే పదంగా సమతలీకరించకుండా, జీవంతో ఉంచడం లేదా సజీవంగా కాపాడడం అనే క్రియ యొక్క స్పష్టమైన భావాన్ని నిలుపుతుంది.
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: '... వ్యక్తి ...; అయితే ... వ్యక్తి'
  rationale: సార్వత్రిక షరతును తెలుగులో సహజంగా తెలియజేస్తూ, δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’తో చూపుతుంది.
theological_decisions:
- issue: ψυχή యొక్క సందర్భార్థం
  choice: ‘ప్రాణం’గా అనువదించడం
  alternative: ‘ఆత్మ’
  rationale: సందర్భం తీర్పు సమయంలో తన ప్రాణాన్ని కాపాడుకోవడం లేదా పోగొట్టుకోవడం గురించినది. ‘ఆత్మ’ అనడం మూలపాఠం తప్పనిసరిగా ఉద్దేశించని శరీర–ఆత్మ విభజనను సూచించవచ్చు.
- issue: ζῳογονήσει యొక్క భావం
  choice: ‘సజీవంగా కాపాడుకుంటాడు’గా పారదర్శకంగా అనువదించడం
  alternative: ‘రక్షించుకుంటాడు’
  rationale: ఇది సాధారణంగా ‘రక్షించు’ అనే క్రియ కాదు; జీవంతో ఉంచడం అనే మూలభావాన్ని, అలాగే వాక్యంలోని ఉద్రిక్తమైన వ్యత్యాసాన్ని ఈ అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని వైరుధ్యభాసం మరియు ‘పోగొట్టుకోవడం—సజీవంగా కాపాడుకోవడం’ అనే భావ ఉద్రిక్తతను నిలిపింది; లింగనిర్దేశం అవసరం లేని ‘వ్యక్తి’ నిర్మాణాన్ని ఉపయోగించింది.
