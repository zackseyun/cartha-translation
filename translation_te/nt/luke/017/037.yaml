review_pass:
  verdict: approve
  source_fidelity: The translation accurately conveys the response question, the address “Lord,” and the deliberately unexplained proverbial image. “శరీరం” preserves the breadth of σῶμα, while “రాబందులు” appropriately communicates the likely scavenger-bird sense of ἀετοί in this context. The future sense of ἐπισυναχθήσονται is retained naturally in “పోగవుతాయి.”
  naturalness: The Telugu is clear, modern, and suitably respectful. Rendering the Greek participial and historical-present construction with ordinary Telugu past-tense narration (“అడిగారు,” “అన్నాడు”) is idiomatic and does not alter the sense.
  terminology: “ప్రభువా” is an appropriate rendering of κύριε. “శరీరం” with a footnote offering “మృతదేహం,” and “రాబందులు” with a footnote offering “గద్దలు,” responsibly preserve the relevant lexical range without forcing a disputed interpretation.
