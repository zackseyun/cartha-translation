id: LUK.17.37
reference: Luke 17:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: te
  text: అందుకు వారు, “ప్రభువా, ఎక్కడ?” అని ఆయనను అడిగారు. ఆయన వారితో, “శరీరం[b] ఎక్కడ ఉంటుందో, అక్కడ రాబందులు[a] కూడా పోగవుతాయి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గద్దలు.” గ్రీకు పదం గద్దలను సూచించగలదు; అయితే శరీరం చుట్టూ పక్షులు పోగయ్యే ఈ సందర్భంలో “రాబందులు” అనే అర్థం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: “శరీరం” అనే పదాన్ని “మృతదేహం” అని కూడా అనువదించవచ్చు; అలా అనువదిస్తే మృతభక్షక పక్షుల దృశ్యం మరింత స్పష్టమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: అందుకు
  rationale: వారి మాట ముందున్న యేసు బోధకు ప్రతిస్పందన అని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు కృదంతాన్ని అసహజంగా పదేపదే అనువదించదు.
- source_word: λέγουσιν
  choice: అడిగారు
  rationale: చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాల కథనంగా ఇచ్చాం; పలికిన మాట ప్రశ్న కావడంతో ‘అడిగారు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ποῦ
  choice: ఎక్కడ
  rationale: స్థలాన్ని ప్రశ్నించే గ్రీకు క్రియావిశేషణానికి సంక్షిప్తమైన, సహజమైన సమానం.
- source_word: κύριε
  choice: ప్రభువా
  rationale: యేసును సంబోధించే κύριε అనే బిరుదుకు ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన సాధారణ అనువాదం.
- source_word: Ὅπου
  choice: ఎక్కడ ఉంటుందో
  rationale: సామెతసదృశమైన సాధారణ వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: గ్రీకు పదం యొక్క విస్తృతమైన ప్రాథమిక అర్థాన్ని నిలుపుతుంది; సందర్భంలో మృతదేహం అనే భావం ఉన్నప్పటికీ దానిని ప్రధాన పాఠ్యంలో మరింత నిర్దిష్టం చేయలేదు.
- source_word: ἀετοὶ
  choice: రాబందులు
  rationale: ఈ పదం గద్దలను కూడా సూచించగలిగినా, శరీరం చుట్టూ పోగయ్యే మృతభక్షక పక్షుల సందర్భంలో ‘రాబందులు’ ఉద్దేశిత దృశ్యాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπισυναχθήσονται
  choice: పోగవుతాయి
  rationale: గ్రీకు భవిష్యత్ కర్మణి రూపం తెలిపే సమూహంగా చేరే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘పోగుచేయబడతాయి’ అనే కృత్రిమ నిర్మాణాన్ని నివారిస్తుంది.
theological_decisions:
- issue: తీర్పును సూచించే సామెతసదృశ దృశ్యానికి నిర్దిష్ట వివరణ ఇవ్వాలా
  choice: శరీరం మరియు దాని చుట్టూ పోగయ్యే రాబందుల దృశ్యాన్ని వివరణ జోడించకుండా యథాతథంగా ఉంచడం
  alternative: దీనిని అంత్యకాల తీర్పు, రోమా సైన్యాలు, లేదా తీర్పు తప్పనిసరిగా సంభవిస్తుందనే సాధారణ సూత్రంగా స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం దృశ్యం దేనిని నిర్దిష్టంగా సూచిస్తుందో చెప్పదు. కాబట్టి వివాదాస్పదమైన వేదాంత వ్యాఖ్యానాల్లో ఏదో ఒకదాన్ని అనువాదంలో ప్రవేశపెట్టకుండా అసలు వాక్యంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. గ్రీకు చారిత్రక వర్తమానానికి బదులుగా సహజ తెలుగు భూతకాలాన్ని ఉపయోగించాం. సామెతలోని అస్పష్టతను వ్యాఖ్యానంతో పరిష్కరించలేదు; పాదసూచిక గుర్తులను అవి సంబంధించిన పదాల వద్ద ఉంచాం.
