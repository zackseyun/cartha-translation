id: LUK.17.31
reference: Luke 17:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: te
  text: ఆ రోజున, ఇంటి మిద్దెపై[b] ఉన్నవాడు, అతని సామానులు ఇంట్లో ఉండగా, వాటిని తీసుకెళ్లడానికి కిందికి దిగకూడదు; అలాగే, పొలంలో ఉన్నవాడు వెనుక ఉన్నవాటి కోసం తిరిగి వెళ్లకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సంక్షిప్తంగా: “వెనక్కి తిరగకూడదు.”'
    reason: lexical_alternative
  - marker: b
    text: “మిద్దె” అంటే ఆ కాలంలో సులభంగా ఎక్కగలిగే, సాధారణంగా ఉపయోగించే సమతల ఇంటి పైకప్పు.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజున
  rationale: తెలుగులో సహజమైన కాలసూచక ప్రయోగం; ἐκείνῃ లోని నిర్దిష్ట సూచనను నిలుపుతుంది.
- source_word: ἐπὶ τοῦ δώματος
  choice: ఇంటి మిద్దెపై
  rationale: ఇక్కడ δώμα అంటే చేరుకోగలిగే, ఉపయోగించగలిగే సమతల ఇంటి పైకప్పు; ‘మిద్దె’ ఆ సాంస్కృతిక దృశ్యాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τὰ σκεύη αὐτοῦ
  choice: అతని సామానులు
  rationale: σκεύη సూచించే వస్తువులు/ఆస్తిపాస్తుల భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: వాటిని తీసుకెళ్లడానికి కిందికి దిగకూడదు
  rationale: మూడవ పురుష నిషేధాత్మక ఆజ్ఞలోని అత్యవసరతను ‘దిగకూడదు’ నిలుపుతుంది; ἆραι యొక్క తీసుకొని వెళ్లే భావం సందర్భానుసారం వ్యక్తమవుతుంది.
- source_word: ὁ ἐν ἀγρῷ
  choice: పొలంలో ఉన్నవాడు
  rationale: ప్రతినిధి వ్యక్తిని సూచించే గ్రీకు నిర్మాణానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: ὁμοίως
  choice: అలాగే
  rationale: రెండవ నిషేధాన్ని మొదటిదానితో సహజంగా సమాంతరం చేస్తుంది.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: వెనుక ఉన్నవాటి కోసం తిరిగి వెళ్లకూడదు
  rationale: ἐπιστρέφω లోని తిరిగి వెళ్లే భావాన్నీ, τὰ ὀπίσω లోని వెనుక మిగిలిన వాటిని సూచించే వస్తుగత భావాన్నీ సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల అత్యవసరతను తెలిపే దృశ్యం
  choice: కిందికి దిగకూడదని, తిరిగి వెళ్లకూడదని చెప్పే నిర్దిష్ట ఆజ్ఞలను యథాతథ దృశ్యరూపంలో నిలిపాం.
  alternative: ఆస్తులపై మమకారం పెట్టవద్దనే సాధారణ నైతిక బోధగా భావానువాదం చేయడం.
  rationale: గ్రీకు వచనం ‘ఆ రోజు’లోని తక్షణ పరిస్థితిని స్పష్టమైన చర్యలతో చిత్రిస్తుంది; సాధారణీకరణ చేస్తే మూలంలోని దృశ్యమూ అత్యవసరతా తగ్గిపోతాయి.
- issue: εἰς τὰ ὀπίσω యొక్క అర్థపరిధి
  choice: ‘వెనుక ఉన్నవాటి కోసం’ అని అనువదించి, వెనుక మిగిలిన వాటిని సూచించే అవకాశాన్ని నిలిపాం.
  alternative: కేవలం ‘వెనక్కి తిరగకూడదు’ అని అనువదించడం.
  rationale: ప్రత్యామ్నాయం సహజంగా ఉన్నా, τὰ ὀπίσω లోని నామవాచకసదృశ బహువచన బలాన్ని అది పూర్తిగా చూపదు; ఎంపిక చేసిన రూపం సందర్భానుకూలంగా ఆ సూక్ష్మతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. ‘మిద్దె’ సాంస్కృతిక దృశ్యాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని ఆజ్ఞాత్మక అత్యవసరతను ‘దిగకూడదు/తిరిగి వెళ్లకూడదు’ ద్వారా నిలిపాం; అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
