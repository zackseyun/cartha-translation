  to: నోవహు ఓడలోకి ప్రవేశించిన రోజు వరకు వారు తింటూ, తాగుతూ, పెళ్లి చేసుకుంటూ, పెళ్లికిచ్చబడుతూ[a] ఉన్నారు; జలప్రళయం వచ్చి వారందరినీ నాశనం చేసింది.
