id: LUK.17.27
reference: Luke 17:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: te
  text: నోవహు ఓడలోకి ప్రవేశించిన రోజు వరకు వారు తింటూ, తాగుతూ, పెళ్లి చేసుకుంటూ, పెళ్లికిచ్చబడుతూ[a] ఉన్నారు; జలప్రళయం వచ్చి వారందరినీ నాశనం చేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సంక్షిప్తంగా, “పెళ్లిళ్లు చేసుకుంటూ ఉన్నారు.” గ్రీకులో రెండు వేర్వేరు క్రియలు ఉన్నాయి: ఒకటి కర్తరి రూపంలో “పెళ్లి చేసుకోవడం,” మరొకటి కర్మణి రూపంలో “పెళ్లికివ్వబడడం.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: తింటూ, తాగుతూ ... ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలు గతంలో కొనసాగుతున్న లేదా అలవాటుగా జరుగుతున్న సాధారణ కార్యకలాపాలను సూచిస్తాయి; తెలుగు సంయుక్త కొనసాగింపు నిర్మాణం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγάμουν
  choice: పెళ్లి చేసుకుంటూ
  rationale: కర్తరి రూపంలోని ‘వివాహం చేసుకోవడం’ అనే భావాన్ని లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐγαμίζοντο
  choice: పెళ్లికి ఇవ్వబడుతూ
  rationale: గ్రీకు పాఠంలోని వేరొక కర్మణి వివాహ క్రియను ప్రత్యేకంగా నిలుపుతుంది; దానిని ముందున్న ‘పెళ్లి చేసుకుంటూ’ అనే క్రియలో కలిపివేయదు.
- source_word: ἄχρι ἧς ἡμέρας
  choice: రోజు వరకు
  rationale: కొనసాగుతున్న కార్యకలాపాలకు కాలపరిమితిని సూచించే గ్రీకు నుడికారాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰσῆλθεν ... εἰς τὴν κιβωτόν
  choice: ఓడలోకి ప్రవేశించిన
  rationale: పూర్తయిన కథన సంఘటనను సూటిగా తెలియజేస్తుంది; నోవహు సందర్భంలో κιβωτόςకు స్థిరమైన తెలుగు పదం ‘ఓడ’.
- source_word: ὁ κατακλυσμός
  choice: జలప్రళయం
  rationale: ఆదికాండంలోని మహా వరదను సూచించే గంభీరమైన, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἀπώλεσεν πάντας
  choice: వారందరినీ నాశనం చేసింది
  rationale: πάνταςలో అంతర్లీనంగా ఉన్న మనుషులను ‘వారందరినీ’ అని స్పష్టం చేస్తూ సంపూర్ణతను నిలుపుతుంది.
theological_decisions:
- issue: రెండు వివాహ క్రియలను వేర్వేరుగా అనువదించడం
  choice: పెళ్లి చేసుకుంటూ, పెళ్లికి ఇవ్వబడుతూ
  alternative: పెళ్లిళ్లు చేసుకుంటూ
  rationale: మూలంలో ఒక కర్తరి క్రియ, ఒక కర్మణి క్రియ ఉన్నాయి. రెండింటినీ వేర్వేరుగా ఉంచడం సాధారణ సామాజిక జీవితం కొనసాగుతుందనే చిత్రణను కాపాడుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ప్రారంభ క్రియల కాలాంశం
  choice: తింటూ, తాగుతూ ... ఉన్నారు
  alternative: తిన్నారు, తాగారు
  rationale: వరుసగా ఉన్న అసంపూర్ణ భూతకాల రూపాలు కొనసాగుతున్న లేదా అలవాటైన కార్యకలాపాలను చిత్రిస్తాయి. తెలుగు కొనసాగింపు నిర్మాణం తీర్పు వచ్చే వరకు సాధారణ జీవితం సాగిన భావాన్ని నిలుపుతుంది.
- issue: జలప్రళయానికి ముందు కార్యకలాపాల నైతిక స్వరూపం
  choice: తటస్థమైన సాధారణ జీవన కార్యకలాపాలుగా అనువాదం
  alternative: విందులు చేసుకుంటూ లేదా భోగిస్తూ అని ప్రతికూల భావం చేర్చడం
  rationale: 'గ్రీకు క్రియలు స్వతహాగా అతిగా తినడం, మద్యపానం లేదా నైతిక దోషాన్ని పేర్కొనవు. కాబట్టి అనువాదం మూలంలోని ఉద్రిక్తతను అలాగే ఉంచుతుంది: సాధారణ జీవితం సాగుతుండగానే తీర్పు వచ్చింది.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పెళ్లికి ఇవ్వబడుతూ’ అనే రూపం నేటి సాధారణ వాడుకలో కొంత అధికారికంగా అనిపించినా, మూలంలోని కర్మణి వివాహ క్రియను ప్రత్యేకంగా కాపాడటానికి ఎంచుకోబడింది. పాదసూచి గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
