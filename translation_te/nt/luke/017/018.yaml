revisions:
- from: ఈ పరదేశి[a] తప్ప, దేవునికి మహిమ చెల్లించడానికి తిరిగి వచ్చినవారు ఎవరూ కనిపించలేదా?
  to: దేవునికి మహిమ చెల్లించడానికి తిరిగి వచ్చినవారు ఈ పరదేశి[a] తప్ప మరెవరూ దొరకలేదా?
  rationale: The revision replaces the less precise ‘కనిపించలేదా?’ with ‘దొరకలేదా?’ to reflect εὑρέθησαν more directly, and it clarifies the placement of the exception. The footnote is lightly revised for grammatical clarity while preserving the lexical alternatives and the outsider-to-Israel sense.
