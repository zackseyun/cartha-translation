  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: te
  text: దేవునికి మహిమ చెల్లించడానికి తిరిగి వచ్చినవారు ఈ పరదేశి[a] తప్ప మరెవరూ దొరకలేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేరే జాతికి చెందిన ఈ వ్యక్తి’ లేదా ‘ఈ అన్యుడు’; గ్రీకు పదం ఇశ్రాయేలు సమాజానికి వెలుపలివాడైన పరదేశిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: కనిపించలేదా
  rationale: అయోరిస్టు కర్మణి రూపాన్ని తెలుగు అలంకారప్రశ్నలో సహజంగా ‘ఎవరూ కనిపించలేదా?’ అని వ్యక్తం చేస్తుంది; ‘దొరకలేదా?’ కంటే వ్యక్తుల సందర్భంలో ఇది సులభంగా అర్థమవుతుంది.
- source_word: ὑποστρέψαντες
  choice: తిరిగి వచ్చినవారు
  rationale: దేవునికి మహిమ చెల్లించడానికి ముందుగా వారు తిరిగి రావడాన్ని సూచించే కృదంత భావాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: δοῦναι δόξαν
  choice: మహిమ చెల్లించడానికి
  rationale: ‘మహిమ ఇవ్వడం’ అనే గ్రీకు నుడికారాన్ని తెలుగులో గౌరవప్రదంగా, సహజంగా ‘మహిమ చెల్లించడం’ అని అందిస్తుంది; దానిని కేవలం ‘స్తుతించడం’గా కుదించదు.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: లక్ష్యార్థక దత్తి విభక్తిని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: మినహాయింపును తెలిపే ఈ నిర్మాణానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: ἀλλογενής
  choice: పరదేశి
  rationale: ఇతర ప్రజకు చెందినవాడు, ఇశ్రాయేలు సమాజానికి వెలుపలివాడు అనే భావాన్ని ఆధునిక పాఠకునికి స్పష్టంగా అందిస్తుంది; ‘అన్యుడు’లో కలగగల ప్రత్యేక మతపరమైన భావాన్ని అనవసరంగా బలపరచదు.
- source_word: οὗτος
  choice: ఈ
  rationale: ‘ఈ పరదేశి’ అని ఆ వ్యక్తిపై ఉన్న సూచనాత్మక ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: స్వస్థత పొందిన వ్యక్తి యొక్క జాతిపరమైన/మతసమాజపరమైన వెలుపలి స్థితి
  choice: ఈ పరదేశి
  alternative: వేరే జాతికి చెందిన ఈ వ్యక్తి; ఈ అన్యుడు
  rationale: సందర్భంలో అతడు సమరయుడని తెలిసినా, ఈ వచనంలోని పదం స్వయంగా ‘ఇతర ప్రజకు చెందినవాడు’ అనే విస్తృత భావాన్నే ఇస్తుంది. కాబట్టి ‘సమరయుడు’ అని స్పష్టీకరించకుండా మూలంలోని ఉత్కంఠను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే అలంకారప్రశ్న నిర్మాణం. ‘మహిమ చెల్లించడం’ అనే బైబిలీయ నుడికారాన్ని సహజ తెలుగు రూపంలో నిలిపింది.
