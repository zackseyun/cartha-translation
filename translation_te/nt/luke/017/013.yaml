reference: Luke 17:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: te
  text: వారు స్వరం ఎత్తి[a], “యేసూ, అధిపతీ[b], మమ్మల్ని కరుణించండి!” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బిగ్గరగా.”
    reason: lexical_alternative
  - marker: b
    text: “అధిపతీ” అనేది అధికారంలో ఉన్న వ్యక్తిని సంబోధించే గ్రీకు పదమైన ఎపిస్టాటా అనువాదం; ఇది సాధారణంగా “ప్రభువు” అని అనువదించే కూరియోస్ అనే పదం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: వారు
  rationale: తెలుగులో ఈ వాక్యాన్ని సహజంగా కొనసాగించేందుకు ప్రత్యేకంగా ‘మరియు’ అవసరం లేదు; కర్తతో నేరుగా ప్రారంభించడం కథన ప్రవాహాన్ని నిలుపుతుంది.
- source_word: αὐτοὶ
  choice: వారు
  rationale: స్పష్టమైన సర్వనామాన్ని కర్తగా ఉంచింది; ‘వారే’ అనడం సందర్భం కోరని అదనపు వ్యత్యాసాన్ని కలిగించవచ్చు.
- source_word: ἦραν φωνὴν
  choice: బిగ్గరగా
  rationale: అక్షరార్థంగా ‘స్వరం ఎత్తారు’; ఇక్కడ గట్టిగా పిలవడం అనే నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో సహజంగా తెలిపే రూపం.
- source_word: Ἰησοῦ
  choice: యేసూ
  rationale: సంబోధన విభక్తిని తెలుగు దీర్ఘాంతంతో స్పష్టంగా చూపుతుంది.
- source_word: ἐπιστάτα
  choice: అధిపతీ
  rationale: అధికారం కలిగిన వ్యక్తిని గౌరవంగా సంబోధించే భావాన్ని ఇస్తుంది; κύριος అనే సాధారణ ‘ప్రభువు’ పదంతో దీనిని కలపదు.
- source_word: ἐλέησον
  choice: కరుణించు
  rationale: కరుణతో సహాయం చేయమనే అత్యవసర విజ్ఞప్తిని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ἡμᾶς
  choice: మమ్మల్ని
  rationale: క్రియకు ప్రత్యక్ష కర్మగా ఉన్న బహువచన సర్వనామాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసుకు వాడిన ἐπιστάτα అనే సంబోధన
  choice: అధిపతీ
  alternative: ప్రభువా
  rationale: మూలపదం ἐπιστάτης, κύριος కాదు. కాబట్టి ‘ప్రభువా’ అని అనువదిస్తే మూలంలో ఉన్న పదభేదం చెరిగి, ఈ పదం స్వయంగా సూచించేదానికంటే బలమైన క్రీస్తుసంబంధ భావం చేరవచ్చు. ‘అధిపతీ’ అధికారం, నాయకత్వం అనే భావాలను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. వేడుకోలులోని అత్యవసరతను ఆశ్చర్యార్థక చిహ్నంతో నిలిపింది; మూలంలోని పదభేదాన్ని పాదసూచికలో స్పష్టం చేసింది.
