source:
  edition: SBLGNT
  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: te
  text: ఆయన వారిని చూసి, “మీరు వెళ్లి యాజకులకు మిమ్మల్ని మీరు చూపించుకోండి[b]” అని వారితో అన్నాడు. వారు వెళ్తుండగా శుద్ధులయ్యారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధి చేయబడ్డారు.” గ్రీకు క్రియ శారీరక స్వస్థతనూ ఆచారపరమైన శుద్ధినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: తమను యాజకులకు చూపించుకోవాలనే ఈ ఆజ్ఞ, చర్మవ్యాధి నుంచి స్వస్థత పొందినవారిని యాజకులు పరిశీలించాలనే నియమాన్ని ప్రతిబింబిస్తుంది; లేవీయకాండము 14 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδὼν
  choice: వారిని చూసి
  rationale: ὁράω క్రియకు చెందిన భూతకాల కృదంతాన్ని ప్రధాన క్రియ εἶπεν‌తో సహజంగా అనుసంధానిస్తుంది. αὐτοῖς మరియు సందర్భం ఆధారంగా ‘వారిని’ చేర్చబడింది.
- source_word: Πορευθέντες
  choice: మీరు వెళ్లి
  rationale: ఇది ἐπιδείξατε అనే ఆజ్ఞతో కలిసి ఆజ్ఞార్థకంగా పనిచేస్తుంది. తెలుగులో ‘వెళ్లి ... చూపించుకోండి’ సహజంగా ఉండి, చర్యల క్రమాన్ని నిలుపుతుంది.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: మిమ్మల్ని మీరు చూపించుకోండి
  rationale: యాజకుల పరిశీలన కోసం తమను తాము చూపించుకోవాలనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς ἱερεῦσιν
  choice: యాజకులకు
  rationale: ధర్మశాస్త్ర ప్రకారం శుద్ధిని పరిశీలించే యాజకులను సూచిస్తుంది; తెలుగులో విభక్తి ద్వారా నిర్దిష్ట సందర్భం స్పష్టమవుతుంది.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: వారు వెళ్తుండగానే
  rationale: వారు ప్రయాణంలో ఉండగానే శుద్ధి సంభవించిందనే సమకాలీన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐκαθαρίσθησαν
  choice: శుద్ధులయ్యారు
  rationale: καθαρίζω యొక్క కర్మణి భావాన్ని సహజ తెలుగులో అందిస్తూ, శారీరక స్వస్థతతో పాటు ఆచారపరమైన శుద్ధి భావాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: చర్మవ్యాధి సందర్భంలో శుద్ధి భాషను అనువదించడం
  choice: శుద్ధులయ్యారు
  alternative: స్వస్థత పొందారు
  rationale: గ్రీకు పదం కేవలం వ్యాధి నయమవడమే కాక శారీరక, ఆచారపరమైన శుద్ధి భావాలనూ మోస్తుంది. ‘శుద్ధులయ్యారు’ ఆ రెండు కోణాలను ముందుగానే ఒకదానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని శుద్ధి/స్వస్థత ద్వంద్వార్థం ప్రధాన పాఠం మరియు పాదసూచికలో నిలుపబడింది. అందించిన ఆంగ్ల పాఠంలో పాదసూచిక గుర్తుల స్థానాలు వాటి విషయాలతో సరిపోలనందున, [a]ను ‘శుద్ధులయ్యారు’ వద్దకు మరియు [b]ను యాజకులకు చూపించుకోవాలనే ఆజ్ఞ వద్దకు అర్థానుసారం అమర్చాం.
