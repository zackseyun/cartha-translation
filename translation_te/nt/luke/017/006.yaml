id: LUK.17.6
reference: Luke 17:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: te
  text: 'ప్రభువు ఇలా అన్నాడు: “మీకు ఆవగింజలాంటి విశ్వాసం ఉంటే, ఈ మల్బరీ చెట్టుతో[a], ‘వేళ్లతో సహా పెకలించబడి, సముద్రంలో నాటబడిపో’ అని మీరు చెప్పేవారు; అది మీకు లోబడేది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదాన్ని సాంప్రదాయంగా ‘సికమైన్ చెట్టు’ అని కూడా అనువదిస్తారు; ఇది ఒక రకమైన మల్బరీ చెట్టు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: లూకా కథనంలో ఇది యేసుకు వాడిన గౌరవసూచకమైన కథన/క్రీస్తుసంబంధ బిరుదు; ఆధునిక తెలుగు బైబిలు శైలిలో ‘ప్రభువు’ సహజమైన సమానార్థకం.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: ఇక్కడ దేవునిపై నమ్మకాన్ని సూచిస్తుంది; ‘విశ్వాసం’ మూలపదానికి ఉన్న ధార్మిక విస్తృతిని నిలుపుతుంది, ‘విశ్వాస్యత’ అనే అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: ὡς κόκκον σινάπεως
  choice: ఆవగింజలాంటి
  rationale: ὡς అనే పోలికను యథాతథంగా ఉంచుతుంది; పోలిక కేవలం పరిమాణానికే సంబంధించినదని స్పష్టీకరించకుండా మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
- source_word: συκαμίνῳ
  choice: మల్బరీ చెట్టు
  rationale: ఈ గ్రీకు పదం మల్బరీ చెట్టును సూచిస్తుంది; అత్తి లేదా సికమోర్-ఫిగ్ చెట్టుతో కలపకుండా ఆధునికంగా గుర్తించదగిన పేరును వాడాం.
- source_word: ἐλέγετε ἂν
  choice: మీరు అనేవారు
  rationale: ἄνతో కూడిన అసంపూర్ణ భూతకాల క్రియ వ్యక్తం చేసే ఊహాత్మక సాధ్యతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: Ἐκριζώθητι
  choice: వేళ్లతో సహా పెకలించబడి
  rationale: పరోక్ష ఆజ్ఞారూపంలోని ‘వేర్లతో పెకలించబడటం’ అనే బలమైన దృశ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: సముద్రంలో నాటబడిపో
  rationale: ‘నాటు’ అనే మూలభావాన్నీ, సముద్రంలో నాటబడటం అనే ఉద్దేశపూర్వక విరుద్ధచిత్రాన్నీ నిలుపుతుంది.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: అది మీ మాట వింటుంది
  rationale: తెలుగులో చెట్టు ఒక ఆజ్ఞకు లోబడటాన్ని సహజంగా వ్యక్తపరుస్తుంది; గ్రీకులోని ‘విధేయత చూపడం/మాట వినడం’ అనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అద్భుతాన్ని సూచించే ఈ ఉపమాన వాక్యంలో πίστις భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వాస్యత
  rationale: సందర్భం అసాధ్యంగా కనిపించేదాని విషయంలో దేవునిపై నమ్మకాన్ని సూచిస్తుంది. ‘విశ్వాసం’ అనే పదం భావాన్ని ముందుగానే సిద్ధాంతపరంగా కుదించకుండా ఉంచుతుంది; ఇక్కడ ‘విశ్వాస్యత’ ప్రధాన భావం కాదు.
- issue: షరతు వాక్యపు స్వరూపం
  choice: ‘ఉంటే ... అనేవారు; ... వింటుంది’ అనే ఊహాత్మక నిర్మాణం
  alternative: ‘ఉన్నట్లయితే ... అనగలరు’
  rationale: గ్రీకులో ἄνతో వచ్చిన క్రియలు ఊహాత్మక ఫలితాన్ని తెలియజేస్తాయి. అయితే εἰ ἔχετε రూపం వర్తమానకాలంలో ఉన్నందున ‘మీకు ఉంటే’ అని అనువదించి, వారికి విశ్వాసం అసలే లేదని తెలుగులో అదనంగా తీర్మానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని ఆవగింజ పోలికను కేవలం చిన్నదనానికి పరిమితం చేయలేదు. గ్రీకు షరతు నిర్మాణంలోని ఉద్రిక్తతను నిలుపుతూ, తెలుగు సహజత్వం కోసం ‘ఉంటే ... అనేవారు’ రూపాన్ని ఎంచుకున్నాం.
