id: LUK.17.20
reference: Luke 17:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: te
  text: 'దేవుని రాజ్యం ఎప్పుడు వస్తుందని పరిసయ్యులు ఆయనను అడిగినప్పుడు, ఆయన వారికి ఇలా జవాబిచ్చాడు: “దేవుని రాజ్యం గమనించగలిగే సూచనలతో రాదు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిశీలనతో,” “గమనించగలిగే విధంగా,” లేదా “జాగ్రత్తగా గమనించడం ద్వారా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: పరిసయ్యులు ఆయనను అడిగినప్పుడు
  rationale: Aorist passive participle and agency are expressed naturally in Telugu as a temporal subordinate clause; δέ is left implicit as a mild discourse transition.
- source_word: πότε ἔρχεται
  choice: ఎప్పుడు వస్తుందని
  rationale: Preserves the temporal question and the present form with future-oriented force in idiomatic indirect speech.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: A standard, transparent Telugu rendering that preserves the recognizable New Testament expression.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: ఆయన వారికి ఇలా జవాబిచ్చాడు
  rationale: Natural Telugu combines the Greek double verb while retaining both the addressees and the introduction to the direct quotation.
- source_word: Οὐκ ἔρχεται
  choice: రాదు
  rationale: Expresses the general statement concisely and idiomatically.
- source_word: μετὰ παρατηρήσεως
  choice: గమనించగలిగే సూచనలతో
  rationale: Conveys an arrival manifested through outward, observable indicators, while the footnote preserves the broader lexical possibilities of observation or careful watching.
theological_decisions:
- issue: దేవుని రాజ్యం వచ్చే విధానం గురించి యేసు చేసిన నిరాకరణ
  choice: బయటికి గమనించగలిగే సూచనలతో దాని రాకను గుర్తించి లెక్కించగల విధంగా రాజ్యం రాదని తెలిపే పఠనం
  alternative: మానవ పరిశీలన మొత్తాన్నే నిరాకరించడం; లేదా అంత్యకాల సూచనలన్నిటినీ పూర్తిగా నిరాకరించడం
  rationale: μετὰ παρατηρήσεως అనే పదబంధంలోని పరిశీలన/నిశితంగా గమనించడం అనే భావాన్ని ఉంచుతూ, ఈ ఒక్క వచనానికి మించిన సిద్ధాంత నిర్ణయాన్ని పాఠ్యంలోకి తేవదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన శైలి. ప్రధాన పాఠ్యంలో సహజమైన భావవ్యక్తీకరణను వాడి, παρατήρησις యొక్క నిజమైన అర్థవిస్తృతిని పాదసూచికలో ఉంచాం.
