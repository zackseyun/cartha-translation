source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: te
  text: అతడు ఒక రోజులో ఏడుసార్లు నీకు విరోధంగా పాపం చేసి, ఏడుసార్లు నీ దగ్గరికి తిరిగి వచ్చి[a], ‘నేను పశ్చాత్తాపపడుతున్నాను’ అని చెబితే, నీవు అతన్ని క్షమించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ వైపు తిరిగి.’ ఈ సందర్భంలో గ్రీకు క్రియకు ‘తిరిగి రావడం,’ ‘తిరగడం’ అనే రెండు భావాలూ సాధ్యమే.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో ఇక్కడ భవిష్యత్ రూపం ఉంది; ఈ సందర్భంలో అది ‘నీవు తప్పక క్షమించాలి’ అనే నిర్దేశ బలాన్ని కలిగి ఉంది.
    reason: grammatical_force
lexical_decisions:
- source_word: ἑπτάκις
  choice: ఏడుసార్లు
  rationale: క్రియావిశేషణంలోని ‘ఏడు సార్లు’ అనే పునరావృత భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τῆς ἡμέρας
  choice: ఒక రోజులో
  rationale: ఇది కాలపరిమితిని తెలిపే షష్ఠీ విభక్తి ప్రయోగం. ‘ఒక రోజులో’ అనేది తెలుగులో సహజంగా ఉండి, అదే రోజు పరిధిలో పునరావృతమయ్యే చర్యను స్పష్టం చేస్తుంది.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: నీకు విరోధంగా పాపం చేసి
  rationale: εἰς σέ ఇక్కడ సంబోధించబడిన వ్యక్తికి వ్యతిరేకంగా చేసిన అపరాధాన్ని సూచిస్తుంది. ‘నీకు విరోధంగా’ ఈ సంబంధాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: నీ దగ్గరికి తిరిగి వచ్చి
  rationale: ἐπιστρέφωకు ‘తిరుగు’ లేదా ‘తిరిగి రా’ అనే భావాలు ఉండవచ్చు. పునరావృత అపరాధం తరువాత మళ్లీ సమీపించి మాట్లాడే సందర్భంలో ‘తిరిగి వచ్చి’ సహజంగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: λέγων
  choice: అని చెబితే
  rationale: గ్రీకు వర్తమాన కృదంతం ప్రధాన షరతుతో అనుబంధమైన మాటను పరిచయం చేస్తుంది. తెలుగులో ‘అని చెబితే’ ఆ అనుబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Μετανοῶ
  choice: నేను పశ్చాత్తాపపడుతున్నాను
  rationale: వర్తమాన ఉత్తమ పురుష ఏకవచన రూపాన్ని కాపాడుతూ, కేవలం విచారం లేదా క్షమాపణకంటే లోతైన మనసుమార్పు భావాన్ని తెలిపే ప్రామాణిక తెలుగు పదప్రయోగం.
- source_word: ἀφήσεις αὐτῷ
  choice: నీవు అతన్ని క్షమించాలి
  rationale: భవిష్యత్ సూచక రూపం ఈ బోధనా సందర్భంలో ఆజ్ఞాత్మక లేదా విధిబోధక బలంతో ఉంది. తెలుగులో ‘క్షమించాలి’ ఆ నిర్దేశాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀφήσεις అనే భవిష్యత్ సూచక రూపపు బలం
  choice: విధిబోధక నిర్దేశంగా ‘నీవు అతన్ని క్షమించాలి’
  alternative: అంచనాగా ‘నీవు అతన్ని క్షమిస్తావు’
  rationale: యేసు శిష్యులకు ఇస్తున్న బోధనలో ఈ భవిష్యత్ రూపం కేవలం ముందుగా జరిగేదాన్ని చెప్పడం కాక, చేయవలసిన దాన్ని నిర్దేశిస్తుంది. తెలుగు అనువాదం ఆ నైతిక బలాన్ని స్పష్టం చేస్తుంది; రూపసంబంధమైన వివరాన్ని పాదసూచికలో కాపాడుతుంది.
- issue: Μετανοῶ యొక్క భావం
  choice: ‘నేను పశ్చాత్తాపపడుతున్నాను’
  alternative: ‘నేను బాధపడుతున్నాను’ లేదా ‘నా మనసు మార్చుకున్నాను’
  rationale: మూలపదం కేవలం విచారాన్ని లేదా సాధారణ అభిప్రాయ మార్పును కాక, తప్పు నుండి మనసు మళ్లించుకోవడాన్ని సూచిస్తుంది. అందువల్ల సుపరిచితమైనప్పటికీ బరువుగల ‘పశ్చాత్తాపం’ పదాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని వాడాం. పునరావృతాన్ని చూపేందుకు ‘ఏడుసార్లు’ రెండుసార్లు అలాగే ఉంచాం. ‘పశ్చాత్తాపం’ అనే సుపరిచిత ధార్మిక-నైతిక పదాన్ని నీరుగార్చకుండా, వాక్య నిర్మాణాన్ని సహజ తెలుగు షరతు రూపంలో అమర్చాం.
