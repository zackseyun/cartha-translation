  source_fidelity: The added temporal marker “అప్పుడు” has no basis in καί and should be removed. Likewise, “కొందరు” specifies the undefined plural subject more narrowly than the Greek does. The prohibition is otherwise conveyed accurately; leaving the object of “వెంబడించకండి” unstated best preserves the Greek ambiguity.
  naturalness: “వారు మీతో ఇలా చెబుతారు” and the paired imperatives are natural, modern standard Telugu. Retaining an unexpressed object with “వెంబడించకండి” is fully idiomatic in this warning.
  terminology: “చూడండి,” “అక్కడ/ఇక్కడ,” and “వెంబడించకండి” appropriately convey the deictic calls and the warning. The footnote is corrected to quote the negative imperative accurately and to describe the omitted object without implying that it must refer to particular people.
  issues:
