    issue: “అప్పుడు” adds a temporal transition absent from the source.
    rationale: καί here simply joins the saying; it does not require “then.”
  - severity: medium
    issue: “కొందరు” narrows the source’s unspecified plural subject.
    rationale: ἐροῦσιν has an unexpressed plural subject (“they”); “some people” is possible interpretively but is not stated.
  - severity: medium
    issue: The main text supplies “వారి” as the object of διώξητε, despite the source leaving the object unexpressed.
    rationale: The referent may be understood from context, but the Greek wording preserves ambiguity. Telugu can naturally retain it without an object.
  - severity: low
