id: LUK.17.23
reference: Luke 17:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: te
  text: 'వారు మీతో ఇలా చెబుతారు: “చూడండి, అక్కడ!” లేదా “చూడండి, ఇక్కడ!” మీరు వెళ్లకండి, వెంబడించకండి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మీరు వెళ్లకండి; వెంబడించకండి.” గ్రీకులో “వెంబడించకండి” అనే క్రియకు కర్మ స్పష్టంగా పేర్కొనబడలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: కొందరు మీతో ... అని అంటారు
  rationale: గ్రీకులో కర్త స్పష్టంగా పేర్కొనబడలేదు; తెలుగు సహజ వాక్యనిర్మాణంలో అనిర్దిష్ట బహువచన భావాన్ని ‘కొందరు’ ద్వారా తెలిపి, ప్రత్యక్ష వాక్య పరిచయాన్ని ‘అని అంటారు’తో నిలిపాము.
- source_word: Ἰδοὺ
  choice: చూడండి
  rationale: శ్రద్ధను ఒక స్థలంవైపు మళ్లించే ἰδού భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκεῖ / ὧδε
  choice: అక్కడ / ఇక్కడ
  rationale: మూలంలోని సంక్షిప్తమైన దూర–సమీప స్థల వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది.
- source_word: μὴ ἀπέλθητε
  choice: మీరు వెళ్లకండి
  rationale: ἀπέρχομαι ఇక్కడ సూచించిన స్థలానికి వెళ్లడాన్ని నిషేధిస్తుంది. ‘బయటికి వెళ్లకండి’ అనడం మూలంలో లేని ‘బయటికి’ అనే దిశను చేర్చవచ్చు; ‘వెళ్లకండి’ భావాన్ని సహజంగా ఉంచుతుంది.
- source_word: μηδὲ διώξητε
  choice: వారి వెంట పరుగెత్తకండి
  rationale: διώκω యొక్క వెంబడించడం/వెంట పరుగెత్తడం అనే బలమైన భావాన్ని నిలుపుతుంది. సహజ తెలుగుకోసం ‘వారి’ అనే కర్మను పూరించాం; గ్రీకులో అది పేర్కొనబడలేదని పాదసూచిక తెలియజేస్తుంది.
theological_decisions:
- issue: διώξητεకు స్పష్టమైన కర్మను చేర్చాలా?
  choice: ప్రధాన పాఠ్యంలో ‘వారి వెంట పరుగెత్తకండి’ అని అనువదించడం
  alternative: ‘వెంబడించకండి’ అని కర్మను పేర్కొనకుండా ఉంచడం
  rationale: గ్రీకు కర్మను చెప్పదు. సందర్భంలో అది అలా చెప్పేవారిని, వారి వాదనలను, లేదా సూచించిన దిశను అనుసరించడాన్ని సూచించవచ్చు. సహజ తెలుగుకోసం ‘వారి’ని పూరించినా, మూలంలోని అస్పష్టతను పాదసూచికలో కాపాడాం.
- issue: ἐκεῖ మరియు ὧδε మధ్య సంబంధం
  choice: “అక్కడ!” లేదా “ఇక్కడ!”
  alternative: “అక్కడ! ఇదిగో ఇక్కడ!”
  rationale: రెండు ప్రత్యామ్నాయ స్థలవాదాలుగా సందర్భం సూచించే భావాన్ని ‘లేదా’ సహజంగా తెలుపుతుంది; ఇది అంత్యకాల సంఘటనల స్వరూపంపై అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన ఆజ్ఞారూప బహువచనాన్ని ఉపయోగించాం. మూలంలోని సంక్షిప్తత, హెచ్చరిక ధోరణి, కర్మకు సంబంధించిన అస్పష్టత కాపాడబడ్డాయి.
