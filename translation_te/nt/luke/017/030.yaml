id: LUK.17.30
reference: Luke 17:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: te
  text: మనుష్యకుమారుడు వెల్లడయ్యే రోజున కూడా అలాగే జరుగుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అదే విధంగా జరుగుతుంది.” గ్రీకు నుడికారం ముందుగా చెప్పిన ఉదాహరణలను వెనక్కి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: కూడా అలాగే
  rationale: ఈ గ్రీకు నుడికారం ముందున్న నోవహు, లోతు కాలాల ఉదాహరణలను వెనక్కి సూచిస్తూ ‘అదే విధంగా’ అనే పోలికను తెలియజేస్తుంది. ‘కూడా అలాగే జరుగుతుంది’ అనేది ἔσται యొక్క భవిష్యత్ భావంతో సహా తెలుగులో సహజంగా ఉంది.
- source_word: ἔσται
  choice: జరుగుతుంది
  rationale: εἰμί యొక్క భవిష్యత్ రూపం అక్షరార్థంగా ‘ఉంటుంది’; అయితే ఇక్కడ ముందటి పరిస్థితి మళ్లీ అదే విధంగా సంభవిస్తుందనే సందర్భంలో ‘జరుగుతుంది’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ᾗ ἡμέρᾳ
  choice: వెల్లడయ్యే రోజున
  rationale: 'సంబంధవాచక దత్తి రూపం కాలాన్ని సూచిస్తుంది: ‘ఏ రోజున’ లేదా ‘రోజున’. తెలుగు వాక్య నిర్మాణంలో క్రియావిశేషణ ఉపవాక్యంగా ‘వెల్లడయ్యే రోజున’ స్పష్టంగా, సహజంగా ఉంటుంది.'
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: సువార్తల్లో యేసు ఉపయోగించే స్థిరమైన బిరుదును అనువదిస్తూ, దానియేలు 7తో ఉన్న అపోకలిప్టిక మరియు మెస్సీయ సంబంధ ప్రతిధ్వనిని కాపాడే సాంప్రదాయక తెలుగు రూపం.
- source_word: ἀποκαλύπτεται
  choice: వెల్లడయ్యే
  rationale: వర్తమాన కర్మణి రూపంలోని ‘బయలుపరచబడటం/వెల్లడవడం’ అనే భావాన్ని కాపాడుతుంది. కేవలం ‘వచ్చే’ అని అనువదిస్తే మూలపదంలో లేని గమన భావాన్ని చేర్చినట్లవుతుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే అంత్యకాల బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవ కుమారుడు
  rationale: ‘మనుష్యకుమారుడు’ సువార్తలలో గుర్తించదగిన స్థిరమైన బిరుదుగా ఉండి, దానియేలు 7తో దాని అంతర్వాచక సంబంధాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం సాధారణ మానవత్వాన్ని మాత్రమే సూచించేలా వినిపించవచ్చు.
- issue: ఈ సందర్భంలో ἀποκαλύπτεται భావం
  choice: వెల్లడయ్యే
  alternative: వచ్చే / ప్రత్యక్షమయ్యే
  rationale: మూలక్రియ వెల్లడికావడం లేదా తెర తొలగించబడడం అనే భావాన్ని ఇస్తుంది. సందర్భం రాకతో సంబంధం కలిగి ఉన్నా, ‘వచ్చే’ అని పెట్టడం వేరొక క్రియాభావాన్ని దిగుమతి చేస్తుంది; ‘ప్రత్యక్షమయ్యే’ సాధ్యమైనా వెల్లడీకరణ భావం కొంత తగ్గుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మనుష్యకుమారుడు’ అనే స్థిరమైన బైబిలు బిరుదును నిలిపి, ‘వెల్లడయ్యే’ ద్వారా మూలంలోని కర్మణి వెల్లడీకరణ భావాన్ని అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేసింది.
