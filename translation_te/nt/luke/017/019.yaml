  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: te
  text: 'ఆయన అతనితో ఇలా అన్నాడు: “లేచి వెళ్లు; నీ విశ్వాసం[a] నిన్ను రక్షించింది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నమ్మకం.” గ్రీకు పదం విశ్వాసం లేదా నమ్మకం అనే భావాన్ని సూచించగలదు; ఇక్కడ “విశ్వాసం” ప్రధాన అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నిన్ను స్వస్థపరిచింది” లేదా “నిన్ను బాగుచేసింది.” గ్రీకు క్రియ రక్షించడం, స్వస్థపరచడం లేదా కాపాడడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: అతనితో … అని చెప్పాడు
  rationale: తెలుగు ప్రత్యక్ష సంభాషణలో సహజమైన వాక్యక్రమాన్ని అనుసరిస్తూ, ‘అతనితో చెప్పాడు’ అనే మూలార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Ἀναστὰς
  choice: లేచి
  rationale: ఇక్కడ ఆజ్ఞార్థక బలంతో వాడిన కృదంతాన్ని తరువాతి ఆజ్ఞతో సహజంగా కలుపుతుంది; ఆధునిక తెలుగులో సంక్షిప్తంగానూ గౌరవప్రదంగానూ ఉంటుంది.
- source_word: πορεύου
  choice: వెళ్లు
  rationale: ప్రయాణమై వెళ్లమనే ఆజ్ఞను సరళంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: πίστις‌కు సాధారణమైన, సందర్భోచితమైన తెలుగు సమానార్థం. ఈ సందర్భంలో ‘నమ్మకం’ అనే భావం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచబడింది.
- source_word: σέσωκέν
  choice: రక్షించింది
  rationale: σῴζω అనే క్రియలోని రక్షణ, స్వస్థత అనే విస్తృత భావపరిధిని పూర్తిగా శారీరక స్వస్థతకే పరిమితం చేయకుండా నిలుపుతుంది. తెలుగు భూతకాల రూపం సంభవించిన కార్యాన్నీ దాని నిలిచే ఫలితాన్నీ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: σε
  choice: నిన్ను
  rationale: ద్వితీయ పురుష ఏకవచన కర్మ సర్వనామానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: స్వస్థపరిచే సందర్భంలో σέσωκέν σε యొక్క భావం
  choice: నిన్ను రక్షించింది
  alternative: నిన్ను స్వస్థపరిచింది; నిన్ను బాగుచేసింది
  rationale: పది మందీ శుద్ధులైనప్పటికీ తిరిగి వచ్చి దేవుణ్ణి మహిమపరిచిన ఈ వ్యక్తితో చెప్పిన మాట కావడంతో, దీనిని కేవలం శారీరక స్వస్థతకు పరిమితం చేయకుండా ‘రక్షించింది’ అని అనువదించడం మూలంలోని విస్తృత భావాన్నీ theological tension‌నూ నిలుపుతుంది.
- issue: πίστις యొక్క సందర్భోచిత భావం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ‘విశ్వాసం’ ప్రధాన అనువాదంగా సహజంగా ఉండగా, యేసుపై ఉంచిన నమ్మకం అనే భావం కూడా గ్రీకు పదంలో ఉంది; అందువల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ప్రత్యక్ష సంభాషణకు సహజమైన తెలుగు వాక్యక్రమం అనుసరించబడింది; మూలంలోని సంక్షిప్త ఆజ్ఞల బలం నిలుపబడింది.
