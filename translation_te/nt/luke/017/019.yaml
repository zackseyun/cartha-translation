  terminology: ‘విశ్వాసం’ is the appropriate principal rendering of πίστις, and ‘రక్షించింది’ is a sound principal rendering of σέσωκέν. The alternatives in the footnotes preserve the contextual lexical range without deciding the saying means physical healing only.
