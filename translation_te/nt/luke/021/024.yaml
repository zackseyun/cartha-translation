id: LUK.21.24
reference: Luke 21:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: te
  text: వారు కత్తి ధారవల్ల పడిపోతారు; అన్ని దేశాలలోకి బందీలుగా తీసుకుపోబడతారు.[a] యెరూషలేము దేశాల చేత తొక్కబడుతూ ఉంటుంది[b]—దేశాల కాలాలు నెరవేరే వరకు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అన్యజనులందరి మధ్యకు’; ఇక్కడి గ్రీకు పదానికి ‘దేశాలు’ లేదా ‘అన్యజనులు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అన్యజనుల చేత యెరూషలేము తొక్కబడుతూ ఉంటుంది.’
    reason: alternative_reading
  - marker: c
    text: లేదా ‘అన్యజనుల కాలాలు నెరవేరే వరకు.’
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: కూలిపోతారు
  rationale: యుద్ధ సందర్భంలో πίπτω మరణాన్ని సూచించగలిగినా, మూలంలోని ‘పడడం/కూలడం’ అనే చిత్రాన్ని నిలుపుతుంది; వెంట వచ్చే కత్తివాత దాని ప్రాణాంతక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: στόματι μαχαίρης
  choice: కత్తివాతకు
  rationale: అక్షరార్థంగా ‘కత్తి నోటితో’ అనే జాతీయ ప్రయోగానికి సహజమైన ఆధునిక తెలుగు సమానం; కత్తి ధారవల్ల హతమవడాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: αἰχμαλωτισθήσονται
  choice: చెరపట్టి తీసుకుపోబడతారు
  rationale: క్రియలోని కర్మణి భావాన్నీ, బందీలుగా వేరే ప్రాంతాలకు తీసుకుపోవడాన్నీ నిలుపుతుంది.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: అన్ని దేశాలకు
  rationale: εἰς సూచించే గమనాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది. ἔθνη పదాన్ని ఈ వచనమంతటా ‘దేశాలు’గా అనువదించడం పదసంబంధ ఐక్యతను కాపాడుతుంది.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే స్థలనామ రూపం.
- source_word: πατουμένη
  choice: తొక్కబడుతూ ఉంటుంది
  rationale: ἔσταιతో కూడిన వర్తమాన కర్మణి కృదంతం కొనసాగుతున్న భవిష్య స్థితిని సూచిస్తుంది; ఈ రూపం ఆ కొనసాగింపునూ అణచివేత చిత్రాన్నీ నిలుపుతుంది.
- source_word: ὑπὸ ἐθνῶν
  choice: దేశాలవారి చేత
  rationale: కర్మణి కర్తను సహజ తెలుగులో తెలియజేస్తూ, ἔθνηను ‘దేశాలు’గా స్థిరంగా ఉంచుతుంది.
- source_word: ἄχρι οὗ
  choice: వరకు
  rationale: కాలపరమైన హద్దును సహజంగా, సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: πληρωθῶσιν
  choice: నెరవేరే
  rationale: పూర్తికావడం లేదా నియమిత కాలం నిండడం అనే రెండూ సాధ్యమైన భావాలను అనవసరంగా సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: καιροὶ ἐθνῶν
  choice: దేశాల కాలాలు
  rationale: καιροίలోని ప్రత్యేకమైన లేదా నియమిత కాలాల భావాన్ని నిలుపుతూ, సంబంధవాచక నిర్మాణంలోని అస్పష్టతను పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ఈ వచనంలో ἔθνη పదం అనువాదం
  choice: దేశాలు / దేశాలవారు
  alternative: అన్యజనులు
  rationale: ఒకే గ్రీకు పదం మూడుసార్లు రావడంతో ప్రధాన పాఠ్యంలో పదసంబంధ ఐక్యతను కాపాడాం. అది రాజకీయ దేశాలనో యూదేతర ప్రజలనో ప్రధానంగా సూచిస్తుందనే విషయాన్ని ముందే తేల్చకుండా, ‘అన్యజనులు’ అనే సాధ్యమైన పఠనాన్ని పాదసూచికల్లో ఇచ్చాం.
- issue: καιροὶ ἐθνῶν భావం
  choice: దేశాల కాలాలు నెరవేరే వరకు
  alternative: అన్యజనుల కాలాలు నెరవేరే వరకు; దేశాలకు నియమించిన కాలాలు పూర్తయ్యే వరకు
  rationale: ఈ మాటలు దైవపరంగా పరిమితమైన కాలాన్ని సూచించవచ్చు; అయితే నిర్దిష్ట అంత్యకాల వ్యవస్థను పాఠ్యంలోకి చేర్చకుండా, మూలంలోని సంబంధవాచక అస్పష్టతనూ నెరవేర్పు భావాన్నీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘కత్తివాత’, ‘చెరపట్టి తీసుకుపోబడతారు’, ‘తొక్కబడుతూ ఉంటుంది’ వంటి రూపాలు మూల చిత్రాన్ని సహజంగా మోస్తాయి; ἔθνηలోని ‘దేశాలు/అన్యజనులు’ సందిగ్ధతను పాదసూచికల్లో కాపాడాం.
