id: LUK.21.16
reference: Luke 21:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: te
  text: అయితే తల్లిదండ్రులు, అన్నదమ్ములు[a], బంధువులు, స్నేహితులు సైతం మిమ్మల్ని అప్పగిస్తారు; మీలో కొందరిని చంపుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అన్నదమ్ములు, అక్కచెల్లెళ్లు” లేదా “తోబుట్టువులు”; గ్రీకు పుంలింగ బహువచనం కొన్నిసార్లు స్త్రీపురుషులు కలిసిన తోబుట్టువుల సమూహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: మిమ్మల్ని అప్పగిస్తారు
  rationale: భవిష్యత్ కర్మణి రూపంలోని భావాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణంతో వ్యక్తం చేసింది; శత్రువులకో అధికారులకో స్వాధీనపరచడమనే ప్రాథమిక అర్థాన్ని నిలుపుతుంది. ‘ద్రోహం చేస్తారు’ అనేది సందర్భంలో సాధ్యమైన భావమైనా, క్రియను అనవసరంగా సంకుచితం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి మాటను కొనసాగిస్తూ స్వల్ప వ్యత్యాసాన్ని సూచించే δέ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: బయటివారే కాక అత్యంత సన్నిహితులైన వీరు సైతం అప్పగిస్తారనే ఆరోహక ప్రాధాన్యాన్ని తెలుపుతుంది.
- source_word: ὑπὸ
  choice: తల్లిదండ్రులు ... కూడా
  rationale: కర్మణి వాక్యంలో వ్యక్తిగత కర్తలను సూచించే ὑπό భావాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణం ద్వారా అందించింది.
- source_word: γονέων
  choice: తల్లిదండ్రులు
  rationale: తల్లి, తండ్రి ఇద్దరినీ సమష్టిగా సూచించే ఆధునిక, సహజ తెలుగు పదం.
- source_word: ἀδελφῶν
  choice: అన్నదమ్ములు
  rationale: గ్రీకు పుంలింగ బహువచనానికి లింగసూచనను నిలిపే తెలుగు సమానం; సందర్భానుసారం అక్కచెల్లెళ్లను కూడా కలుపుకునే అవకాశం పాదసూచికలో ఉంచబడింది.
- source_word: συγγενῶν
  choice: బంధువులు
  rationale: ఒకే కుటుంబం లేదా వంశానికి చెందిన విస్తృత బంధుత్వ వర్గాన్ని సహజంగా సూచిస్తుంది.
- source_word: φίλων
  choice: స్నేహితులు
  rationale: φίλων అనే బహువచన బంధపదానికి నేరమైన, ఆధునిక తెలుగు సమానం.
- source_word: θανατώσουσιν
  choice: చంపిస్తారు
  rationale: మరణానికి గురిచేయడం అనే causative భావాన్ని తెలియజేస్తుంది; స్వయంగా చంపడమా, అధికారుల చేత మరణశిక్ష అమలు చేయించడమా అన్న విధానాన్ని నిర్దిష్టం చేయదు.
- source_word: ἐξ ὑμῶν
  choice: మీలో కొందరిని
  rationale: ‘మీలోనుండి’ అనే పదశః రూపం కంటే, ఈ సందర్భంలోని భాగార్థక గ్రీకు ప్రయోగాన్ని సహజ తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: బంధుత్వ జాబితాలో ἀδελφῶν అర్థం
  choice: అన్నదమ్ములు
  alternative: అన్నదమ్ములు, అక్కచెల్లెళ్లు / తోబుట్టువులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది. అయితే ఈ బంధుత్వ ప్రయోగం మిశ్రమ లింగాల తోబుట్టువుల సమూహాన్ని కూడా సూచించగల నిజమైన భాషాపరమైన అవకాశాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా, గంభీరంగా రూపొందించబడింది. గ్రీకు కర్మణి నిర్మాణాన్ని తెలుగులో సహజమైన కర్తరి వాక్యంగా మార్చినా, అప్పగించబడే భావం మరియు సన్నిహితులే కర్తలనే నొక్కి చెప్పడం నిలుపబడింది; [a] సూచిక ప్రధాన పాఠ్యంలో ఉంది.
