id: LUK.21.38
reference: Luke 21:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: te
  text: ప్రజలందరూ ఆయన మాట వినడానికి తెల్లవారుజామునే దేవాలయంలో ఆయన దగ్గరకు వచ్చేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘దేవాలయం’ అని అనువదించిన గ్రీకు పదం దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది; ప్రత్యేకంగా అంతరాలయాన్ని కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: ప్రజలందరూ
  rationale: సమాజంలోని ప్రజలను సమష్టిగా సూచించే గ్రీకు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రతి వ్యక్తీ మినహాయింపులేకుండా వచ్చాడని అనవసరంగా బలపరచదు.
- source_word: ὤρθριζεν
  choice: తెల్లవారుజామునే ... వచ్చేవారు
  rationale: క్రియలోని వేకువనే రావడం అనే కాలభావంతో పాటు, అసంపూర్ణ భూతకాల రూపం సూచించే అలవాటైన లేదా పునరావృత చర్యను కూడా వ్యక్తం చేస్తుంది.
- source_word: πρὸς αὐτόν
  choice: ఆయన దగ్గరకు
  rationale: πρός + ద్వితీయా విభక్తి వ్యక్తి వైపు కదలికను సూచిస్తుంది; ముందున్న సందర్భంలోని యేసును పేరు మళ్లీ చేర్చకుండా సూచిస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయానికి
  rationale: తెలుగులో రావడం అనే కదలిక క్రియతో సహజంగా సరిపోతుంది. ἱερόν ప్రత్యేకంగా అంతరాలయాన్ని కాకుండా దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుందనే వివరాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: ἀκούειν αὐτοῦ
  choice: ఆయన మాట వినడానికి
  rationale: ఈ క్రియారూపం ఉద్దేశాన్ని సూచిస్తుంది. ‘ఆయన మాట వినడానికి’ అనేది కేవలం శబ్దం వినడం కంటే ఆయన బోధను శ్రద్ధగా వినడమనే సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘వచ్చేవారు’ ద్వారా పునరావృత చర్యను, ‘తెల్లవారుజామునే’ ద్వారా వేకువ సమయాన్ని సహజంగా వ్యక్తం చేశాం.
