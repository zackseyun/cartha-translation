id: LUK.21.9
reference: Luke 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: te
  text: అయితే, మీరు యుద్ధాల గురించీ అల్లకల్లోలాల గురించీ విన్నప్పుడు భయభ్రాంతులకు గురికాకండి. ఎందుకంటే ఇవి మొదట జరగాల్సిందే; అయితే అంతం వెంటనే రాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా, “అయితే అంతం వెంటనే కాదు.”
    reason: మూల గ్రీకు చివరి పదబంధం క్రియలేనిదని, ప్రధాన అనువాదంలోని ‘రాదు’ భావస్పష్టత కోసం పూరించబడిందని తెలియజేయడం.
lexical_decisions:
- source_word: ὅταν δὲ
  choice: అయితే, ... విన్నప్పుడు
  rationale: ὅταν భవిష్యత్తులో సంభవించే సందర్భాన్ని సూచిస్తుంది; δέ సందర్భంలోని స్వల్ప మలుపును చూపుతుంది. ‘అయితే’ ఆ అనుసంధానాన్ని అతిగా వ్యతిరేకతగా చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: ἀκούσητε
  choice: మీరు ... గురించి విన్నప్పుడు
  rationale: కాలవాచక ఉపవాక్యంలోని aorist subjunctiveను తెలుగులో సహజమైన ‘విన్నప్పుడు’గా అనువదించాం; సంఘటనల నివేదికలు వినడాన్ని ‘గురించి’ స్పష్టం చేస్తుంది.
- source_word: πολέμους
  choice: యుద్ధాలు
  rationale: సాయుధ పోరాటాలను సూచించే బహువచన పదానికి నేరమైన, సాధారణ తెలుగు సమానం.
- source_word: ἀκαταστασίας
  choice: అల్లకల్లోలాలు
  rationale: ఈ పదం అవ్యవస్థ, కల్లోలం, సామాజిక లేదా రాజకీయ అస్థిరత వంటి విస్తృత భావాన్ని కలిగి ఉంది. ‘అల్లకల్లోలాలు’ దీనిని ప్రత్యేకంగా తిరుగుబాట్లు లేదా అల్లర్లకే పరిమితం చేయదు.
- source_word: μὴ πτοηθῆτε
  choice: భయభ్రాంతులకు గురికాకండి
  rationale: కేవలం ఆందోళన చెందడం కంటే, భయంతో దిగ్భ్రాంతికి లేదా గందరగోళానికి లోనవడాన్ని ఈ గ్రీకు క్రియ బలంగా సూచిస్తుంది.
- source_word: δεῖ γὰρ ταῦτα γενέσθαι πρῶτον
  choice: ఎందుకంటే ఇవి మొదట జరగాల్సిందే
  rationale: δεῖలోని అవసరతను ‘జరగాల్సిందే’ నిలుపుతుంది; γάρను ‘ఎందుకంటే’ వివరణాత్మకంగా చూపుతుంది; πρῶτον సంఘటనల క్రమాన్ని సూచిస్తుంది.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: అయితే అంతం వెంటనే రాదు
  rationale: మూలంలో క్రియ లేకున్నా, తెలుగులో సహజమైన సంపూర్ణ వాక్యానికి ‘రాదు’ను పూరించాం. εὐθέως యొక్క తక్షణ కాలార్థాన్ని ‘వెంటనే’ నిలుపుతుంది; అంత్యకాల వ్యవస్థను అదనంగా చొప్పించదు.
theological_decisions:
- issue: అంతం సంభవించే కాలం
  choice: యుద్ధాలు, అల్లకల్లోలాలు ముందుగా జరగాలి; అయితే అంతం వాటి వెంటనే రాదు.
  alternative: ఈ సంఘటనలు అంతానికి ముందున్న కాలంలో సంభవిస్తాయి గాని అవే అంతం కావు.
  rationale: ఈ వాక్యం కల్లోల వార్తలను అంతం తక్షణమే వచ్చేస్తుందనే సంకేతంగా భావించవద్దని హెచ్చరిస్తుంది. నిర్దిష్ట అంత్యకాల సిద్ధాంతాన్ని చొప్పించకుండా మూలంలోని కాలసంబంధ ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘భయభ్రాంతులకు గురికాకండి’ మూలంలోని భావతీవ్రతను నిలుపుతుంది; ‘అల్లకల్లోలాలు’ ἀκαταστασίας యొక్క విస్తృత అర్థాన్ని కాపాడుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
