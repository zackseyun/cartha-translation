  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν προβάλωσιν ἤδη, βλέποντες ἀφ’ ἑαυτῶν γινώσκετε ὅτι ἤδη ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: te
  text: అవి అప్పటికే చిగురించినప్పుడు[a], మీరు స్వయంగా చూసి, వేసవికాలం అప్పటికే దగ్గరలో ఉందని తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అవి అప్పటికే కొత్త పెరుగుదలను బయటికి తెచ్చినప్పుడు.” గ్రీకు మూలంలో “ఆకులు” అనే పదం స్పష్టంగా లేదు; చెట్ల సందర్భం కొత్త చిగుళ్లను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: చిగురించినప్పుడు
  rationale: సందర్భాధారిత కాలవాచక భావాన్ని సహజమైన తెలుగులో ‘అప్పుడు’ భావంతో వ్యక్తం చేస్తుంది; పునరావృతిని అనవసరంగా నొక్కిచెప్పదు.
- source_word: προβάλωσιν
  choice: చిగురించినప్పుడు
  rationale: అంజూరపు చెట్టు మరియు ఇతర చెట్ల సందర్భంలో కొత్త పెరుగుదల బయటపడటాన్ని ‘చిగురించు’ సహజంగా తెలియజేస్తుంది; గ్రీకులో ‘ఆకులు’ అనే పదం స్పష్టంగా లేకపోవడాన్ని కూడా గౌరవిస్తుంది.
- source_word: ἤδη
  choice: అప్పటికే
  rationale: వచనంలోని రెండు సందర్భాల్లోనూ ఋతుసూచన మొదలైందనే కాలభావాన్ని నిలుపుతుంది.
- source_word: βλέποντες
  choice: చూసి
  rationale: పరిశీలించడం ద్వారా తెలుసుకోవడం అనే క్రియావిశేషణ సంబంధాన్ని సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: ἀφ’ ἑαυτῶν
  choice: మీరు స్వయంగా
  rationale: బయటి వివరణ అవసరం లేకుండా తమ పరిశీలన ద్వారానే గ్రహించడాన్ని తెలియజేస్తుంది.
- source_word: γινώσκετε
  choice: తెలుసుకుంటారు
  rationale: కనిపించే సూచనను బట్టి కలిగే సాధారణ గుర్తింపును సూటిగా వ్యక్తం చేస్తుంది.
- source_word: ἐγγὺς
  choice: దగ్గరలో
  rationale: కాలపరమైన సమీపత్వాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: θέρος
  choice: వేసవికాలం
  rationale: సూచించబడిన ఋతువును స్పష్టంగా, సహజంగా తెలుపుతుంది.
