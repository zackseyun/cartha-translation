id: LUK.21.8
reference: Luke 21:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “మీరు తప్పుదారి పట్టకుండా జాగ్రత్తపడండి. ఎందుకంటే చాలామంది నా పేరుతో వచ్చి, ‘నేనే ఆయనను’[a] అనీ, ‘సమయం దగ్గరపడింది’ అనీ చెబుతారు. మీరు వారి వెంట వెళ్లవద్దు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేనే.” అంటే, ఎదురుచూస్తున్న వ్యక్తిని—బహుశా మెస్సీయను—తానేనని అబద్ధంగా చెప్పుకునేవాడు.
    reason: Ἐγώ εἰμι అనే సంక్షిప్త గ్రీకు వాక్యానికి రూపపరంగా సమీపమైన ప్రత్యామ్నాయాన్ని, దాని సందర్భోచిత భావంతో సహా చూపించడానికి.
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: మీరు తప్పుదారి పట్టకుండా జాగ్రత్తపడండి
  rationale: βλέπετε μή నిర్మాణంలోని అప్రమత్తతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, πλανάωలోని దారి తప్పించే రూపకాన్ని నిలుపుతుంది.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: నా పేరుతో వస్తారు
  rationale: యేసు పేరు, అధికారం లేదా గుర్తింపును ఆధారంగా చేసుకొని రావడాన్ని సూచించే గ్రీకు ప్రయోగానికి ఇది సహజమైన, స్థిరమైన తెలుగు రూపం.
- source_word: Ἐγώ εἰμι
  choice: నేనే ఆయనను
  rationale: గ్రీకులో కర్త బలంగా ఉద్ఘాటించబడింది; సందర్భంలోని తప్పుడు స్వీయగుర్తింపు దావాను తెలుగులో అర్థవంతంగా వ్యక్తం చేస్తుంది, అయితే ‘మెస్సీయను’ అని మూలంలో లేని పదాన్ని చేర్చదు.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: నిర్ణయించిన సమయం దగ్గరపడింది
  rationale: καιρός సాధారణ కాలం కంటే నిర్ణాయకమైన లేదా నియమిత సందర్భాన్ని సూచించగలదు; ἤγγικεν యొక్క సంపూర్ణకాల రూపంలోని ప్రస్తుతం కొనసాగుతున్న సమీపత భావాన్ని ‘దగ్గరపడింది’ నిలుపుతుంది.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: మీరు వారి వెంట వెళ్లవద్దు
  rationale: అటువంటి మోసగాళ్లను అనుసరించవద్దనే ఆజ్ఞతో పాటు ὀπίσωలోని దిశాత్మక చిత్రాన్ని కూడా సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: తప్పుడు హక్కుదారుల సందర్భంలో Ἐγώ εἰμι అనువాదం
  choice: నేనే ఆయనను
  alternative: 'నేనే; లేదా: నేనే మెస్సీయను'
  rationale: ‘నేనే’ అనేది రూపపరంగా మరింత సమీపమైనదైనా తెలుగులో దావా అసంపూర్ణంగా వినిపించవచ్చు. ‘నేనే ఆయనను’ సందర్భంలోని ఊహిత స్వీయగుర్తింపును తెలియజేస్తుంది; ‘మెస్సీయను’ అని ప్రధాన పాఠ్యంలో పెట్టడం గ్రీకును మించి స్పష్టీకరించడం అవుతుంది. అసలు పదబంధంలోని సంక్షిప్తతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గంభీరతను కాపాడే శైలి. మూలంలోని హెచ్చరిక, దిశాత్మక రూపకం, అలాగే Ἐγώ εἰμι యొక్క భావసందిగ్ధత సంరక్షించబడ్డాయి.
