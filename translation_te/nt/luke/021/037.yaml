reference: Luke 21:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: te
  text: పగటిపూట ఆయన దేవాలయంలో[a] బోధిస్తూ ఉండేవాడు; రాత్రిపూట బయటికి వెళ్లి, ఒలీవల కొండ అని పిలువబడే కొండపై రాత్రి గడిపేవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘దేవాలయం’ అని అనువదించిన గ్రీకు పదం ప్రత్యేకంగా అంతరాలయాన్ని మాత్రమే కాకుండా, దేవాలయ సముదాయాన్ని లేదా దాని ఆవరణలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రాత్రి బస చేసేవాడు’; ఈ క్రియ ఆరుబయట రాత్రి గడపడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: బోధిస్తూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియతో వర్తమాన కృదంతం కలిసి నిరంతరమైన, అలవాటైన కార్యాన్ని సూచిస్తున్నాయి; తెలుగు రూపం ఆ పునరావృత స్వభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰς ἡμέρας
  choice: పగటిపూట
  rationale: కాలాన్ని సూచించే బహువచన ద్వితీయా రూపం పగటి సమయాల్లో జరిగే అలవాటైన కార్యాన్ని తెలియజేస్తుంది; రాత్రిపూట అనే తదుపరి పదబంధంతో ఉన్న వ్యత్యాసాన్ని ఇది స్పష్టంగా ఉంచుతుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν మొత్తం దేవాలయ సముదాయాన్ని లేదా ఆవరణలను సూచించగలదు. ప్రధాన పాఠంలో సహజమైన సాధారణ పదాన్ని ఉంచి, దాని విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: τὰς δὲ νύκτας
  choice: రాత్రిపూట
  rationale: పగటి బోధనకు విరుద్ధంగా రాత్రివేళ జరిగే పునరావృత కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐξερχόμενος
  choice: బయటికి వెళ్లి
  rationale: ఈ కృదంతం ప్రధాన క్రియతో అనుసంధానమైన పునరావృత బయలుదేరడాన్ని సూచిస్తుంది; తెలుగు సంయుక్త క్రియ నిర్మాణం దాన్ని సహజంగా అందిస్తుంది.
- source_word: ηὐλίζετο
  choice: రాత్రి గడిపేవాడు
  rationale: αὐλίζομαι అంటే రాత్రి బస చేయడం లేదా రాత్రి గడపడం; కొన్ని సందర్భాల్లో ఆరుబయట ఉండడమనే సూచన ఉండవచ్చు. ప్రధాన పాఠం ఆ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: εἰς τὸ ὄρος
  choice: కొండపై
  rationale: బస చేసే క్రియతో εἰς గమ్యస్థానానికి వెళ్లి అక్కడ ఉండే భావాన్ని ఇస్తుంది; తెలుగులో ‘కొండపై’ సహజమైన స్థాన సూచన.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: “ఒలీవ కొండ” అని పిలిచే
  rationale: Ἐλαιῶν అనేది ‘ఒలీవల/ఒలీవ చెట్ల’ అనే భావమున్న స్థలనామం. తెలుగులో గుర్తించదగిన ‘ఒలీవ కొండ’ రూపాన్ని వాడుతూ, మూలంలోని ‘అని పిలిచే’ నిర్మాణాన్ని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని అనుసరించాం. పగలు–రాత్రి పునరావృత దినచర్యను ‘ఉండేవాడు/గడిపేవాడు’ రూపాలతో వ్యక్తం చేశాం; మూలంలో లేని ప్రత్యేక వసతి విధానాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
