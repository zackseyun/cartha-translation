revisions:
- from: మీ సహనం ద్వారా మీరు మీ ప్రాణాలను సంపాదించుకుంటారు.[a][b]
  to: మీ ఓర్పుతో మీ ప్రాణాలను కాపాడుకోండి.[a][b]
  rationale: The revision restores the imperative force of κτήσασθε in the main text. “కాపాడుకోండి” is a natural contextual rendering of acquiring/securing one’s ψυχαί amid persecution, while footnote a preserves a more formally literal ‘acquire’ rendering. Footnote b retains the semantic breadth of ψυχή using idiomatic Telugu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:34:39Z'
review_pass:
  verdict: revise
  source_fidelity: SBLGNT has κτήσασθε, an aorist middle imperative. The draft’s future statement, “సంపాదించుకుంటారు,” does not represent that imperative force. In this persecution context, ψυχάς can appropriately be rendered “ప్రాణాలు” in the sense of lives, and “కాపాడుకోండి” expresses the contextual force of securing/preserving one’s life without narrowing it to an immaterial soul.
  naturalness: “మీ ఓర్పుతో మీ ప్రాణాలను కాపాడుకోండి” is concise, idiomatic modern standard Telugu and retains the direct exhortation. “మీ సహనంలో ... సంపాదించుకోండి” is retained only as a more formal alternative, since it is less natural Telugu.
  terminology: “ఓర్పు” naturally conveys steadfast endurance under trial. “ప్రాణాలు” is suitable for ψυχάς here. The lexical note should not use the unnatural plural “స్వయాలు”; “తమను తాము” is a natural Telugu way to express the alternative sense ‘selves.’
  issues:
  - severity: medium
    issue: The main text changes the Greek imperative into a future assertion.
    rationale: κτήσασθε in the cited SBLGNT text is an aorist middle imperative. The main translation should therefore be an exhortation, not “మీరు ... సంపాదించుకుంటారు.”
  - severity: low
    issue: Footnote a labels a grammatical/formal alternative as a textual variant.
    rationale: No textual variant is presented in the supplied SBLGNT source. The note concerns the imperative form and a more literal rendering, so its reason should be formal/grammatical rather than textual_variant.
  - severity: low
    issue: Footnote b’s “స్వయాలు” is not natural modern Telugu.
    rationale: For ψυχή in the sense of ‘selves,’ Telugu naturally uses “తమను తాము” (or contextually “వ్యక్తులు”), not “స్వయాలు.”
  revised_text: మీ ఓర్పుతో మీ ప్రాణాలను కాపాడుకోండి.[a][b]
  revised_footnotes:
