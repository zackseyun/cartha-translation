id: LUK.21.19
reference: Luke 21:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τῇ ὑπομονῇ ὑμῶν ⸀κτήσασθε τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/019.yaml
  text: By your endurance you will gain your lives[a][b].
translation:
  language: te
  text: మీ ఓర్పుతో మీ ప్రాణాలను కాపాడుకోండి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుసారంగా: “మీ ఓర్పులో మీ ప్రాణాలను సంపాదించుకోండి.” గ్రీకు క్రియ ఆజ్ఞార్థక రూపంలో ఉంది.'
    reason: formal_alternative
  - marker: b
    text: లేదా “ఆత్మలను”; గ్రీకు పదం సందర్భాన్ని బట్టి ‘ప్రాణాలు,’ ‘తమను తాము,’ లేదా ‘ఆత్మలు’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: సహనం
  rationale: శ్రమలు, హింసల మధ్య స్థిరంగా నిలిచే ఓర్పును సూచిస్తుంది. ఆధునిక తెలుగులో ‘సహనం’ సహజంగా ఉండి, సందర్భానికి తగిన స్థిరమైన ఓర్పు భావాన్ని ఇస్తుంది.
- source_word: κτήσασθε
  choice: సంపాదించుకుంటారు
  rationale: SBLGNT పాఠంలో ఇది ఆజ్ఞార్థక రూపం; అయితే సందర్భంలో ఫలితాన్ని సూచించే భావంగా కూడా గ్రహించవచ్చు. ప్రధాన పాఠంలో సహజమైన భవిష్యత్-ఫలిత భావాన్ని ఇచ్చి, ఆజ్ఞార్థక రూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: ψυχὰς
  choice: ప్రాణాలను
  rationale: ψυχή ఇక్కడ ‘ప్రాణం,’ ‘జీవితం,’ ‘స్వయం,’ లేదా ‘ఆత్మ’ అనే విస్తృత భావాలను కలిగి ఉండవచ్చు. హింస, మరణం, అంతిమ సంరక్షణ సందర్భంలో ‘ప్రాణాలు’ సమగ్ర వ్యక్తిజీవిత భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ఆత్మలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐν
  choice: ద్వారా
  rationale: దత్తివుతో కూడిన ἐν ఇక్కడ సాధనం లేదా మార్గాన్ని సూచిస్తుంది. ‘మీ సహనం ద్వారా’ అనేది ఈ సంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: అంత్యకాల హింస సందర్భంలో ψυχή యొక్క అర్థం
  choice: సమగ్ర వ్యక్తిజీవితాన్ని సూచించే ‘ప్రాణాలు’
  alternative: ‘ఆత్మలు’ లేదా ‘మిమ్మల్ని మీరు’
  rationale: ఈ వాక్యం శారీరక ప్రమాదం మధ్య విశ్వాసపూర్వక సహనాన్నీ, అంతిమ సంరక్షణనూ కలిపి ఉంచుతుంది. ‘ప్రాణాలు’ అనే పదం దేహానికి భిన్నమైన అమూర్త ఆత్మ మాత్రమే ఉద్దేశించబడిందని ముందే నిర్ణయించకుండా ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: κτήσασθε యొక్క ఆజ్ఞార్థక రూపం మరియు సందర్భానుసార ఫలిత భావం
  choice: ప్రధాన పాఠంలో ‘సంపాదించుకుంటారు’; పాదసూచికలో ఆజ్ఞార్థక రూపం
  alternative: ‘సంపాదించుకోండి’
  rationale: గ్రీకు రూపం ఆజ్ఞార్థకమైనప్పటికీ, వాక్యసందర్భంలో సహనం వల్ల కలిగే ఫలితంగా దీనిని వ్యక్తపరచడం సహజం. రూప సంబంధిత అస్పష్టతను పాదసూచికలో బహిర్గతంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘సంపాదించుకుంటారు’ ద్వారా మధ్యమ వాచక ఛాయను కొంత నిలిపి, ప్రధాన పాఠాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం; మూలరూపంలోని ఆజ్ఞార్థకతను పాదసూచికలో స్పష్టంగా ఇచ్చాం.
