lexical_decisions:
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω యొక్క భూతకాల రూపానికి సరళమైన, సహజమైన తెలుగు సమానార్థకం; కథనంలోని సాధారణ గమనాన్ని కాపాడుతుంది.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన సంధిగా ఉంది. తెలుగు వాక్యనిర్మాణంలో ప్రత్యేకంగా ‘మరియు’ అని చేర్చడం అసహజంగా ఉండవచ్చు; వాక్యక్రమమే కొనసాగింపును తెలియజేస్తుంది.
- source_word: τινα
  choice: ఒక
  rationale: పేరు తెలియజేయని వ్యక్తిని పరిచయం చేసే τις భావాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఒక’ తెలియజేస్తుంది.
- source_word: χήραν
  choice: విధవరాలిని
  rationale: χήραకు నేరమైన తెలుగు సమానార్థకం; సందర్భంలోని ఆమె సామాజిక దుర్బలతను కూడా నిలుపుతుంది.
- source_word: πενιχρὰν
  choice: పేద
  rationale: πενιχρός తెలిపే కొద్దిపాటి ఆర్థిక వనరుల భావాన్ని అతిశయింపకుండా సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: βάλλουσαν
  choice: వేస్తున్న
  rationale: ధనాన్ని కానుకపెట్టెలో వేయడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘విసురుతున్న’ అనే అనుచితమైన బలమైన భావాన్ని నివారిస్తుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ముందటి సందర్భంలో స్థలం నిర్దేశించబడినందున ἐκεῖకి నేరమైన, సహజమైన అనువాదం.
- source_word: λεπτὰ δύο
  choice: రెండు చిన్న రాగి నాణేలు
  rationale: λεπτά అనే అతి తక్కువ విలువగల చిన్న నాణేల సంఖ్య, పరిమాణం, లోహ స్వభావాన్ని ఆధునిక పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
