id: LUK.21.27
reference: Luke 21:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: te
  text: అప్పుడు వారు మనుష్యకుమారుని ఒక మేఘంలో శక్తితోను గొప్ప మహిమతోను వస్తూ ఉండగా చూస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక మేఘంపై.’ గ్రీకు పాఠంలో ఏకవచనంగా ‘ఒక మేఘంలో’ అని ఉంది; అయితే ఈ దృశ్యం మనుష్యకుమారుడు మేఘాలతో రావడం గురించిన దానియేలు 7లోని, సంబంధిత భాగాలలోని చిత్రణను ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: చూస్తారు
  rationale: ὁράω క్రియ యొక్క భవిష్యత్ రూపం ఇక్కడ ప్రత్యక్షంగా చూడడాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘చూస్తారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: ఇది యేసుకు సంబంధించిన స్థిరమైన బిరుదును, దానియేలు 7తో ఉన్న అంతర్గ్రంథ సంబంధాన్ని కాపాడుతుంది.
- source_word: ἐρχόμενον
  choice: వస్తుండడం
  rationale: వర్తమాన కృదంతం, వారు చూసే సమయంలో కొనసాగుతున్న రాకను చిత్రిస్తుంది; ‘వస్తుండడం’ ఆ దృశ్య గమనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν νεφέλῃ
  choice: ఒక మేఘంలో
  rationale: గ్రీకు పాఠంలో νεφέλῃ ఏకవచనంలో ఉంది; ἐν సహజంగా ‘లో’ అనే భావాన్ని ఇస్తుంది. అందువల్ల బహువచనంగా మార్చకుండా మూలపాఠాన్ని దగ్గరగా అనుసరిస్తుంది.
- source_word: μετὰ δυνάμεως
  choice: శక్తితో
  rationale: μετά + షష్ఠీ విభక్తి సహవాసాన్ని సూచిస్తుంది; ‘శక్తితో’ సరళమైన, సహజమైన సమానార్థక ప్రయోగం.
- source_word: δόξης πολλῆς
  choice: గొప్ప మహిమతో
  rationale: πολλῆς యొక్క పరిమాణ/తీవ్రత భావాన్ని తెలుగులో ‘గొప్ప’ సహజంగా వ్యక్తం చేస్తుంది; ‘మహిమ’ δόξα యొక్క గంభీర భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου అనే క్రీస్తు సంబంధిత బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: ‘మనుష్యకుమారుడు’ యేసు బిరుదుగానూ, దానియేలు 7 ప్రతిధ్వనిని మోసే పదబంధంగానూ పనిచేస్తుంది. ‘మానవుడు’ అని భావానువాదం చేస్తే ఆ సాహిత్య, క్రీస్తు సంబంధిత అనుసంధానం బలహీనపడుతుంది.
- issue: మేఘ దృశ్యం మరియు దానియేలు గ్రంథం/దైవప్రత్యక్షత ప్రతిధ్వని
  choice: ఒక మేఘంలో
  alternative: ఒక మేఘంపై
  rationale: లూకా వాడిన ఏకవచన νεφέλῃను, ἐν యొక్క సాధారణ భావాన్ని అనుసరిస్తూ ఇతర సమాంతర వాక్యాలకు అనుగుణంగా మార్చలేదు. అదే సమయంలో ‘మేఘంపై’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచి నిజమైన భాషాపరమైన సందిగ్ధతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మనుష్యకుమారుడు,’ ‘మహిమ’ వంటి స్థిరమైన బైబిలు పదాలను అంతర్గ్రంథ సంబంధం కోసం నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచాం.
