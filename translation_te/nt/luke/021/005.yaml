translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వాక్య అసంపూర్ణతను—తరువాతి వచనంలో వచ్చే యేసు మాటలకు దారితీసే ‘అన్నాడు’ అనే ముగింపును—కొలన్ ద్వారా నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
