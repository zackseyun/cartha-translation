id: LUK.21.5
reference: Luke 21:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: te
  text: 'కొందరు దేవాలయ ప్రాంగణం[a] గురించి, అది అందమైన రాళ్లతో, దేవునికి అంకితం చేసిన కానుకలతో[b] అలంకరించబడి ఉందని మాట్లాడుతుండగా, ఆయన ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవాలయ ప్రాంగణం’ అని అనువదించిన గ్రీకు పదం మొత్తం దేవాలయ పరిసరాలను సూచిస్తుంది; కేవలం లోపలి పరిశుద్ధ స్థలాన్ని మాత్రమే కాదు.
    reason: cultural_note
  - marker: b
    text: అంటే దేవునికి అంకితం చేసి దేవాలయంలో ఉంచిన కానుకలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: కొందరు ... మాట్లాడుతుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన కాలసూచక ఉపవాక్యంగా అనువదించి, λεγόντων సూచించే కొనసాగుతున్న చర్యను నిలుపుతుంది.
- source_word: τοῦ ἱεροῦ
  choice: దేవాలయ ప్రాంగణం
  rationale: ἱερόν అనేది అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాక మొత్తం దేవాలయ పరిసరాలను సూచిస్తుంది; ‘దేవాలయ ప్రాంగణం’ ఈ విస్తృత అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: λίθοις καλοῖς
  choice: అందమైన రాళ్లతో
  rationale: καλοῖς ఇక్కడ రాళ్ల ఆకర్షణీయమైన, ప్రశంసనీయమైన నాణ్యతను సూచిస్తుంది; ఈ పదబంధం సరళంగానూ సహజంగానూ ఉంది.
- source_word: ἀναθήμασιν
  choice: దేవునికి అంకితం చేసిన కానుకలతో
  rationale: దేవాలయంలో దేవునికి సమర్పించి ప్రదర్శించిన అంకిత కానుకలనే ఈ పదం సూచిస్తుంది; సాంకేతిక పదం కంటే ఈ వివరణ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: κεκόσμηται
  choice: అలంకరించబడి ఉందని
  rationale: పర్ఫెక్ట్ పాసివ్ రూపంలోని పూర్తయిన చర్యతో కొనసాగుతున్న ఫలితస్థితిని తెలుగు సహజ ప్రయోగంలో నిలుపుతుంది.
- source_word: εἶπεν
  choice: ఆయన ఇలా అన్నాడు
  rationale: గ్రీకులో కర్త పేరు స్పష్టంగా చేర్చబడలేదు; ‘ఆయన’ కథన ప్రవాహాన్ని కాపాడుతుంది. తరువాత వచ్చే మాటలకు పరిచయంగా ‘ఇలా’ సహజమైన తెలుగు ప్రయోగం.
