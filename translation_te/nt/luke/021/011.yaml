    reason: lexical_alternative
  revision_rationale: The revision corrects the famine/drought distinction, avoids adding visibility to the final signs, removes redundancy, and retains the source's sky/heaven ambiguity in an idiomatic Telugu footnote. The concise existential phrasing in the final clause reflects ἔσται without specifying the mechanism or nature of the signs.
