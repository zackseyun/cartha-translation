id: LUK.21.11
reference: Luke 21:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: te
  text: భారీ భూకంపాలు వస్తాయి; వివిధ ప్రాంతాల్లో క్షామాలు, అంటువ్యాధులు సంభవిస్తాయి. భయంకరమైన విషయాలు, ఆకాశం[a] నుండి గొప్ప సూచనలు ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్వర్గం నుండి.’ గ్రీకు పదం οὐρανός కనిపించే ఆకాశాన్ని గానీ స్వర్గాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί μεγάλοι
  choice: భారీ భూకంపాలు
  rationale: σεισμοί అనే పదానికి ఇక్కడ సహజమైన అర్థం భూకంపాలు. μεγάλοι వాటి పరిమాణం లేదా తీవ్రతను సూచిస్తుంది; ఆధునిక తెలుగులో ‘భారీ’ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ τόπους
  choice: వివిధ ప్రాంతాల్లో
  rationale: ఈ గ్రీకు నుడికారం ఘటనలు వేర్వేరు ప్రదేశాల్లో సంభవించడాన్ని సూచిస్తుంది. ‘వివిధ ప్రాంతాల్లో’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: λιμοὶ
  choice: కరవులు
  rationale: ఈ పదం సాధారణ ఆహార కొరతకన్నా తీవ్రమైన కరవులను సూచిస్తుంది.
- source_word: λοιμοὶ
  choice: అంటువ్యాధులు
  rationale: λοιμός వ్యాపించే తీవ్రమైన వ్యాధి లేదా మహమ్మారిని సూచించగలదు. ‘అంటువ్యాధులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, బహువచనాన్ని నిలుపుతుంది.
- source_word: φόβητρα
  choice: భయపెట్టే ఘటనలు
  rationale: అరుదైన ఈ నపుంసక బహువచన పదం భయం కలిగించే వస్తువులు లేదా సంఘటనలను సూచిస్తుంది. ‘ఘటనలు’ సందర్భానికి సహజంగా ఉన్నా వాటి స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: σημεῖα μεγάλα
  choice: గొప్ప సూచక చిహ్నాలు
  rationale: σημεῖα అంటే గుర్తింపునిచ్చే ‘సంకేతాలు/చిహ్నాలు’; ‘సూచక చిహ్నాలు’ వాటి అర్థవంతమైన స్వభావాన్ని తెలియజేస్తుంది. ‘గొప్ప’ μεγάλα అనే విశేషణాన్ని వ్యాఖ్యానం జోడించకుండా నిలుపుతుంది.
- source_word: ἀπ’ οὐρανοῦ
  choice: ఆకాశం నుంచి
  rationale: οὐρανός ఆకాశాన్ని గానీ పరలోకాన్ని గానీ సూచించవచ్చు. ఈ సందర్భంలో కనిపించే ఆకాశ సంబంధ ఘటనలను సహజంగా సూచించడానికి ‘ఆకాశం’ను ప్రధాన పాఠంలో ఉంచి, మరో సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἔσονται / ἔσται
  choice: వస్తాయి / సంభవిస్తాయి / కనిపిస్తాయి
  rationale: గ్రీకు భవిష్యత్ అస్తిత్వ రూపాలను ప్రతి నామవాచక సమూహానికి సరిపోయే సహజ తెలుగు క్రియలతో వ్యక్తం చేశాం; రాబోయే ఘటనల భావం అంతటా నిలిచింది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో οὐρανός అర్థం
  choice: ఆకాశం నుంచి
  alternative: పరలోకం నుంచి
  rationale: ఈ పదం కనిపించే ఆకాశాన్ని, దేవుని నివాసంగా భావించే పరలోకాన్ని రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలో సహజమైన ‘ఆకాశం’ను వాడి, పాదసూచిక ద్వారా పరలోక భావసాధ్యతను నిలిపి, ఘటనల మూలాన్ని వ్యాఖ్యానంతో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. జాబితా లయను నిలుపుతూ, అరుదైన లేదా అతిగా ప్రాచీన పదజాలాన్ని నివారించాం.
