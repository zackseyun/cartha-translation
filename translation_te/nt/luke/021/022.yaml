source:
  edition: SBLGNT
  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: te
  text: ఎందుకంటే, వ్రాయబడినవన్నీ నెరవేరేలా ఇవి ప్రతీకార దినాలు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇవి ప్రతిఫల శిక్ష దినాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వ్రాయబడినవన్నీ నెరవేరడానికి.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు కారణాన్ని లేదా వివరణను పరిచయం చేసే సంధానార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡμέραι
  choice: దినాలు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, ప్రవచనాత్మక సందర్భానికి తగిన గౌరవప్రదమైన పదాన్ని ఉపయోగిస్తుంది.
- source_word: ἐκδικήσεως
  choice: ప్రతీకార
  rationale: న్యాయపరమైన ప్రతిఫలం లేదా శిక్ష అనే తీవ్రమైన భావాన్ని నిలుపుతుంది; కేవలం మానవ పగగా అర్థాన్ని పరిమితం చేయదు.
- source_word: αὗταί εἰσιν
  choice: ఇవి ... దినాలు
  rationale: సూచక సర్వనామంలోని ఉద్ఘాటనను తెలుగులో సహజమైన వాక్యక్రమంతో నిలుపుతుంది.
- source_word: τοῦ πλησθῆναι
  choice: నెరవేరేలా
  rationale: τοῦ తో కూడిన infinitive లోని ప్రయోజనం–ఫలితం మధ్యనున్న భావసూక్ష్మతను ఒక వైపుకే ఖరారు చేయకుండా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: πάντα τὰ γεγραμμένα
  choice: వ్రాయబడినవన్నీ
  rationale: పరిపూర్ణ కర్మణి కృదంతం మరియు సమగ్రతను సహజ తెలుగులో నిలుపుతూ, దాని సూచనను ప్రత్యేకంగా ‘లేఖనాలు’ అని అధికంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ἐκδίκησις యొక్క న్యాయతీర్పు భావం
  choice: ప్రతీకారం
  alternative: ప్రతిఫల శిక్ష / న్యాయదండన
  rationale: మూలపదంలోని శిక్షాత్మక, న్యాయపరమైన తీవ్రతను నిలుపుతుంది. సందర్భం దీనిని వ్యక్తిగత పగగా కాక, వ్రాయబడినవి నెరవేరే న్యాయతీర్పుగా చూపుతుంది.
- issue: τοῦ + infinitive యొక్క ప్రయోజన/ఫలిత భావం
  choice: నెరవేరేలా
  alternative: నెరవేరడానికి
  rationale: ఈ నిర్మాణం ప్రయోజనం లేదా ఫలితం అనే రెండు ఛాయలను కలిగి ఉండగలదు; ‘నెరవేరేలా’ ఆ ఉద్వేగాన్ని పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ప్రవచనాత్మక గంభీరతను నిలుపుతూ ‘దినాలు’, ‘ప్రతీకారం’, ‘వ్రాయబడినవన్నీ’ అనే పదప్రయోగాలు ఎంచుకోబడ్డాయి.
