id: LUK.21.12
reference: Luke 21:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: te
  text: అయితే వీటన్నిటికీ ముందు, వారు మీ మీద చేతులు వేస్తారు[a], మిమ్మల్ని హింసిస్తారు; సమాజమందిరాలకు, చెరసాలలకు మిమ్మల్ని అప్పగిస్తారు; నా నామం కారణంగా[b] మీరు రాజుల ముందుకూ పాలకుల ముందుకూ తీసుకెళ్లబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారు మిమ్మల్ని పట్టుకుంటారు.’ గ్రీకు మూలంలో అక్షరార్థంగా ‘వారు మీ మీద తమ చేతులు వేస్తారు’ అని ఉంది; ఇది శత్రుభావంతో పట్టుకోవడం లేదా దుర్వినియోగం చేయడం అనే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘నా నామం కారణంగా’ అనే మాటను ‘నా నామం నిమిత్తం’ లేదా భావాన్ని విప్పి ‘నా కారణంగా’ అని కూడా అనువదించవచ్చు. ప్రధాన పాఠం యేసు నామాన్ని ఆయన వ్యక్తిత్వం, అధికారంతో అనుసంధానించే బైబిలు వ్యక్తీకరణను నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: అయితే వీటన్నిటికీ ముందు
  rationale: πρό + షష్ఠీ విభక్తి కాలపరమైన ముందుదనాన్ని సూచిస్తుంది; πάντων భావాన్ని ‘అన్నిటికీ’ నిలుపుతుంది; δέ సంభాషణలోని మార్పు లేదా వ్యత్యాసాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: వారు మీ మీద చేతులు వేస్తారు
  rationale: మూలంలోని స్పష్టమైన శారీరక రూపకాన్ని నిలుపుతూ, శత్రుభావంతో పట్టుకోవడం లేదా నిర్బంధించడం అనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διώξουσιν
  choice: మిమ్మల్ని హింసిస్తారు
  rationale: శిష్యులు యేసు నామం కారణంగా ఎదుర్కొనే శత్రుత్వ సందర్భంలో διώκω కేవలం వెంటాడడం కాక హింసించడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: παραδιδόντες
  choice: మిమ్మల్ని అప్పగిస్తారు
  rationale: παραδίδωμι లోని అధికారులకు లేదా సంస్థలకు శత్రుభావంతో అప్పగించే న్యాయపరమైన ఛాయను ‘అప్పగిస్తారు’ స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: సమాజమందిరాలకు, చెరసాలలకు
  rationale: సంస్థలను విపులీకరించకుండా మూలంలోని రెండు గమ్యాలను నిలుపుతుంది; ‘సమాజమందిరాలు’ యూదుల ఆరాధన, సామాజిక న్యాయవిచారణ స్థలాన్ని సూచించే స్థిరమైన తెలుగు పదం.
- source_word: ἀπαγομένους
  choice: మీరు ... తీసుకెళ్లబడతారు
  rationale: ఇది కర్మణి ప్రయోగంలోని వర్తమాన కృదంతం; తెలుగు వాక్యంలో సహజత కోసం సమాపక క్రియగా మార్చినా, శిష్యులు ఇతరులచేత బలవంతంగా తీసుకెళ్లబడుతున్న కర్మణి భావాన్ని నిలిపింది.
- source_word: ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: రాజుల ముందుకూ పాలకుల ముందుకూ
  rationale: న్యాయవిచారణ సందర్భంలో ἐπί అధికారుల సమక్షానికి తీసుకురావడాన్ని సూచిస్తుంది; ‘ముందుకు’ ఆ న్యాయపరమైన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: నా నామం కారణంగా
  rationale: ἕνεκεν కారణాన్ని సూచిస్తుంది; ‘నా నామం’ అనే బైబిలు వ్యక్తీకరణను వ్యాఖ్యానాత్మకంగా ‘నా కారణంగా’ అని మార్చకుండా, యేసు వ్యక్తిత్వం మరియు అధికారంతో దాని సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: హింస సందర్భంలో ‘నా నామం’ అనే మాట అర్థం
  choice: ‘నా నామం కారణంగా’ అనే బైబిలు వ్యక్తీకరణను ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘నా కారణంగా’ లేదా ‘మీరు నాకు చెందినవారు కాబట్టి’
  rationale: τοῦ ὀνόματός μου యేసు వ్యక్తిత్వం, అధికారం, ఆయనను ఒప్పుకోవడం వంటి భావాలను మోస్తుంది. దాన్ని ఒకే వ్యాఖ్యానానికి పరిమితం చేయకుండా మూలంలోని దైవశాస్త్రపరమైన విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పొడవైన గ్రీకు వాక్యాన్ని అర్ధవిరామాలతో విభజించి చర్యల క్రమాన్ని స్పష్టంగా ఉంచింది. ‘నామం,’ ‘సమాజమందిరం,’ ‘చెరసాల’ వంటి బైబిలు సందర్భానికి తగిన పదాలను అతిగా ప్రాచీనంగా కాకుండా ఉపయోగించింది.
