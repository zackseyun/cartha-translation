source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: te
  text: 'అప్పుడు ఆయన, “నేను మీతో నిజంగా చెబుతున్నాను: ఈ పేద విధవరాలు వారందరికంటే ఎక్కువ కానుక పెట్టింది[a]” అని అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారందరికంటే ఎక్కువ వేసింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: నిజంగా
  rationale: యేసు చెప్పబోయే మాటకు గంభీరమైన నిశ్చయతను ఇచ్చే క్రియావిశేషణం; ఆధునిక తెలుగులో సహజంగా, బలంగా ఉంటుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, యేసు మాటలోని అధికారపూర్వక బలాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: χήρα
  choice: విధవరాలు
  rationale: భర్త చనిపోయిన స్త్రీని సూచించే స్పష్టమైన, ప్రామాణిక తెలుగు పదం.
- source_word: πτωχή
  choice: పేద
  rationale: ఆమె ఆర్థిక పేదరికాన్ని తెలియజేస్తుంది; ‘నిరుపేద’ లేదా ‘దిక్కులేని’ వంటి పదాలు మూలంలో ఉన్నదానికంటే ఎక్కువ నిర్దిష్టతను చేర్చవచ్చు.
- source_word: αὕτη
  choice: ఈ
  rationale: యేసు దృష్టిలో ఉన్న నిర్దిష్ట విధవరాలిని సూచించే మూలంలోని నిర్దేశక బలాన్ని కాపాడుతుంది.
- source_word: πλεῖον
  choice: ఎక్కువ
  rationale: పరిమాణాత్మక తులనను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάντων
  choice: వారందరికంటే
  rationale: సందర్భంలో కానుకలు వేసిన మిగతా వారందరితో జరుగుతున్న తులనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔβαλεν
  choice: కానుక పెట్టింది
  rationale: దేవాలయ కానుకల పెట్టెలో ధనం వేయడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలోని సాధారణ ‘వేసింది’ అనే భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విధవరాలి కానుక గురించిన తులనాత్మక ప్రకటన
  choice: వారందరికంటే ఎక్కువ కానుక పెట్టింది
  alternative: వారిలో ఎవరికంటేనైనా ఎక్కువ కానుక పెట్టింది
  rationale: πλεῖον πάντων మిగతా దాతలందరితో తులనను సహజంగా వ్యక్తం చేస్తుంది. ‘ఎక్కువ’ అనేది మొత్తం పరిమాణాన్నా, విలువ నిర్ధారణననా ఇక్కడే వివరించకుండా, తదుపరి వచనంలో వచ్చే వివరణకు ముందు మూలపాఠంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష వాక్యంలోని గంభీరతను కాపాడుతూ, దేవాలయ కానుకల సందర్భాన్ని సహజంగా వ్యక్తం చేయడానికి ‘కానుక పెట్టింది’ వాడబడింది.
