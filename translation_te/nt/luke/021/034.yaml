review_pass:
  verdict: revise
  source_fidelity: The warning structure, the heart-being-weighed-down image, and the unexpanded reference to ‘that day’ are substantially retained. However, ‘తాగుబోతుతనం’ normally suggests habitual drunkenness/alcoholism, whereas μέθη denotes drunkenness/intoxication. The two drinking-related terms should be distinguished without narrowing either one improperly.
  naturalness: The draft is generally readable modern Telugu, but it repeats the warning imperative (‘జాగ్రత్తగా చూసుకోండి’ / ‘జాగ్రత్తపడండి’) and the phrase ‘మితిమీరిన తాగుడు వల్ల కలిగే మత్తు, తాగుబోతుతనం’ is less natural and blurs the Greek pairing.
  terminology: Render κραιπάλῃ broadly as ‘విచ్చలవిడిగా తాగడం’ with a footnote preserving its possible sense of the aftereffects of excessive drinking; render μέθῃ as ‘మత్తు.’ ‘జీవితపు చింతలు’ and ‘ఆ రోజు’ are accurate and appropriately non-expansive.
  issues:
  - severity: medium
    issue: ‘తాగుబోతుతనం’ for μέθῃ
    rationale: In modern Telugu this commonly denotes a habitual condition or addiction, adding an aspect not expressed by the Greek noun for drunkenness/intoxication. ‘మత్తు’ is more direct.
  - severity: medium
    issue: κραιπάλῃ and μέθῃ are insufficiently distinguished in the main text
    rationale: ‘మితిమీరిన తాగుడు వల్ల కలిగే మత్తు’ followed by ‘తాగుబోతుతనం’ makes the first phrase overly specific and the second semantically inappropriate. A broad main-text rendering with a lexical footnote better preserves the term’s range.
  - severity: low
    issue: Repeated imperative wording
    rationale: The initial ‘జాగ్రత్తగా చూసుకోండి’ and final ‘జాగ్రత్తపడండి’ create unnecessary repetition not present in the single Greek imperative. Restructuring improves flow while retaining the warning relation.
  revised_text: 'కానీ మిమ్మల్ని మీరు జాగ్రత్తగా చూసుకోండి: విచ్చలవిడిగా తాగడం[a], మత్తు, జీవితపు చింతల వల్ల మీ హృదయాలు భారమైపోకుండా, ఆ రోజు అకస్మాత్తుగా మీ మీదికి రాకుండా ఉండండి.'
