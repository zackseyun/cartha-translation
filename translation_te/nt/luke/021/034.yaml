    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek warning and its parallel list while using natural modern Telugu. ‘విచ్చలవిడిగా తాగడం’ keeps κραιπάλῃ broad; the footnote records the viable ‘hangover/aftereffects’ sense. ‘మత్తు’ accurately represents μέθη without introducing habitual alcoholism. The wording retains ‘ఆ రోజు’ without doctrinal expansion and removes the redundant imperative.
