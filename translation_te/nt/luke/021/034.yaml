id: LUK.21.34
reference: Luke 21:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: te
  text: 'కానీ మిమ్మల్ని మీరు జాగ్రత్తగా చూసుకోండి: విచ్చలవిడిగా తాగడం[a], మత్తు, జీవితపు చింతల వల్ల మీ హృదయాలు భారమైపోకుండా, ఆ రోజు అకస్మాత్తుగా మీ మీదికి రాకుండా ఉండండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతిగా తాగిన తరువాత కలిగే మత్తు లేదా తలనొప్పి.’ గ్రీకు పదం విచ్చలవిడిగా తాగడాన్ని లేదా దాని దుష్ప్రభావాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: అయితే మిమ్మల్ని మీరు జాగ్రత్తగా చూసుకోండి
  rationale: ప్రతికూల పరిస్థితి రాకుండా అప్రమత్తంగా ఉండాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; δὲ యొక్క స్వల్ప వ్యతిరేక/సంధాన భావాన్ని ‘అయితే’ నిలుపుతుంది.
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: మీ హృదయాలు భారమైపోకుండా
  rationale: βαρέω లోని ‘భారపడటం’ అనే రూపకాన్ని నిలుపుతూ, అంతరంగ అప్రమత్తత మందగించే భావాన్ని సందర్భం ద్వారా తెలియజేస్తుంది.
- source_word: κραιπάλῃ
  choice: మితిమీరిన తాగుడు వల్ల కలిగే మత్తు
  rationale: ఈ పదం అతిగా తాగడంలోని విచ్చలవిడితనాన్ని లేదా దాని దుష్ప్రభావాలను సూచించగలదు. ప్రధాన పాఠంలో అర్థమయ్యే విస్తృత పదబంధాన్ని ఉంచి, పాదసూచికలో నిజమైన పదార్థ విస్తృతిని తెలిపాం.
- source_word: μέθῃ
  choice: తాగుబోతుతనం
  rationale: మద్యానికి లోనై మత్తులో ఉండే స్థితి లేదా అలవాటును స్పష్టంగా తెలియజేస్తుంది; κραιπάληతో పూర్తిగా ఒకే అర్థంగా వినిపించకుండా భేదాన్ని నిలుపుతుంది.
- source_word: μερίμναις βιωτικαῖς
  choice: ఈ జీవితపు చింతలు
  rationale: సాధారణ భౌతిక/దైనందిన జీవితానికి సంబంధించిన ఆందోళనలను సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని నైతిక నిందను అదనంగా చేర్చదు.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: అకస్మాత్తుగా మీ మీదికి రాకుండా
  rationale: ఆ రోజు హఠాత్తుగా ఎదురవుతుందనే హెచ్చరికను సహజ తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: ఆ రోజు
  rationale: అంత్యకాల సందర్భం స్పష్టమైనప్పటికీ, మూలపాఠం చెప్పిన సంక్షిప్త రూపాన్నే ఉంచి ‘తీర్పు దినం’ వంటి వివరణను పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: ‘ఆ రోజు’ యొక్క అంత్యకాల సూచన
  choice: ఆ రోజు
  alternative: ఆ తీర్పు రోజు
  rationale: యేసు ప్రసంగ సందర్భంలో ఇది నిర్ణాయకమైన రాబోయే దినాన్ని సూచిస్తుంది. అయినా మూలంలోని ἡ ἡμέρα ἐκείνη కంటే స్పష్టమైన సిద్ధాంతపరమైన పేరు చేర్చకుండా దాని ఉద్దేశపూర్వక సంక్షిప్తతను నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘హృదయాలు భారమైపోవడం’ అనే మూల రూపకాన్ని నిలిపి, మద్యపానానికి సంబంధించిన రెండు సమీపార్థ పదాల మధ్య సాధ్యమైన భేదాన్ని పాఠ్యం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
