revisions:
- from: అయితే మిమ్మల్ని మీరు జాగ్రత్తగా చూసుకోండి. మితిమీరిన తాగుడు వల్ల కలిగే మత్తు[a], తాగుబోతుతనం, ఈ జీవితపు చింతల వల్ల మీ హృదయాలు భారమైపోకుండా, ఆ రోజు అకస్మాత్తుగా మీ మీదికి రాకుండా జాగ్రత్తపడండి.
  to: 'కానీ మిమ్మల్ని మీరు జాగ్రత్తగా చూసుకోండి: విచ్చలవిడిగా తాగడం[a], మత్తు, జీవితపు చింతల వల్ల మీ హృదయాలు భారమైపోకుండా, ఆ రోజు అకస్మాత్తుగా మీ మీదికి రాకుండా ఉండండి.'
  rationale: The revision preserves the Greek warning and its parallel list while using natural modern Telugu. ‘విచ్చలవిడిగా తాగడం’ keeps κραιπάλῃ broad; the footnote records the viable ‘hangover/aftereffects’ sense. ‘మత్తు’ accurately represents μέθη without introducing habitual alcoholism. The wording retains ‘ఆ రోజు’ without doctrinal expansion and removes the redundant imperative.
