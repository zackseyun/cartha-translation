revisions:
- from: ఎందుకంటే వీరందరూ తమకు మిగులుగా ఉన్నదానిలో నుంచి కానుకల్లో[a] వేశారు; కాని ఈమె తన లేమిలో నుంచి[b] తనకు ఉన్న జీవనాధారమంతా[c] వేసింది.
  to: ఎందుకంటే వీరందరూ తమకు మిగిలి ఉన్న దానినుండి కానుకల్లో[a] వేశారు; కాని ఈమె తన కొరతలోనుండి[b] తనకు ఉన్న జీవనాధారమంతా[c] వేసింది.
  rationale: 'The revision makes two small idiomatic improvements: “మిగిలి ఉన్న దానినుండి” naturally expresses what was surplus to them, and “తన కొరతలోనుండి” naturally expresses her deficiency or want. The source’s explanatory and contrastive structure, temple-gift terminology, and the concrete subsistence sense of βίος are retained. Footnote wording has been conformed to the revised main-text vocabulary.'
