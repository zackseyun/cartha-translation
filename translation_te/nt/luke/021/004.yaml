source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: te
  text: ఎందుకంటే వీరందరూ తమకు మిగిలి ఉన్న దానినుండి కానుకల్లో[a] వేశారు; కాని ఈమె తన కొరతలోనుండి[b] తనకు ఉన్న జీవనాధారమంతా[c] వేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అర్పణల్లో.’ ఇక్కడ గ్రీకులోని ‘కానుకలు’ అనే పదం ఆలయంలో సమర్పించిన కానుకలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన పేదరికంలోనుండి,’ ‘తన లేమిలోనుండి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘జీవించడానికి తనకు ఉన్నదంతా,’ ‘తన జీవనోపాధి అంతా.’ ఇది ఆమె అస్తిత్వమంతటినీ సూచించే ‘జీవితమంతా’ అనే అర్థం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: ఎందుకంటే వీరందరూ
  rationale: γάρ ముందటి వాక్యానికి వివరణాత్మక సంబంధాన్ని చూపుతుంది; πάντες οὗτοι సహజంగా ‘వీరందరూ’ అని అనువదించబడింది.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: తమకు మిగులుగా ఉన్నదానిలో నుంచి
  rationale: περισσεύοντος వారికి అవసరానికి మించి ఉన్నదాన్ని సూచిస్తుంది; విధవరాలి లేమితో ఉన్న వ్యత్యాసాన్ని ఇది నిలుపుతుంది.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: కానుకల్లో వేశారు
  rationale: ἔβαλον యొక్క భౌతిక ‘వేశారు’ భావాన్ని, ఆలయ సందర్భంలో τὰ δῶρα యొక్క ‘కానుకలు’ భావాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: αὕτη δὲ
  choice: కాని ఈమె
  rationale: ముందుగా పేర్కొన్న విధవరాలిని స్త్రీలింగ నిర్దేశక సర్వనామం స్పష్టంగా సూచిస్తుంది; δέ వ్యత్యాసాన్ని ‘కాని’ తెలియజేస్తుంది.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: తన లేమిలో నుంచి
  rationale: ὑστέρημα కొరత, అవసరం లేదా లేమిని సూచిస్తుంది; ‘మిగులు’తో ఉన్న పదార్థపరమైన వ్యత్యాసాన్ని ‘లేమి’ నేరుగా నిలుపుతుంది.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: తనకు ఉన్న జీవనాధారమంతా
  rationale: βίος ఇక్కడ జీవితం అనే అస్తిత్వార్థంలో కాక జీవించడానికి ఉన్న సాధనాలు లేదా ఉపాధిని సూచిస్తుంది; ‘జీవనాధారం’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἔβαλεν
  choice: వేసింది
  rationale: నాణేలను కానుకగా ఉంచిన భౌతిక చర్యను సరళంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
theological_decisions:
- issue: విధవరాలి కానుకలో βίος అర్థం
  choice: జీవించడానికి ఆమెకు ఉన్న భౌతిక జీవనాధారమంతా
  alternative: ఆమె జీవితమంతా
  rationale: ధనకానుకల సందర్భంలో βίος జీవనోపాధి లేదా జీవించడానికి ఉన్న వనరులను సూచిస్తుంది; ‘జీవితమంతా’ అనడం ఆమె అస్తిత్వాన్నే ఇచ్చిందనే అపార్థాన్ని కలిగించవచ్చు.
- issue: τὰ δῶρα సూచన
  choice: కానుకలు
  alternative: అర్పణలు; ఆలయ ఖజానా
  rationale: మూలపదం ‘కానుకలు’ అని అర్థమిస్తుంది. ఆలయ సందర్భం స్పష్టమైనా, ‘ఖజానా’ అని అనువదించడం మూలంలో ఉన్నదానికంటే అధిక నిర్దిష్టతను చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘మిగులు—లేమి’ అనే మూలంలోని వ్యత్యాసం నిలుపబడింది. ‘జీవనాధారం’ సాధారణ పాఠకునికి βίος యొక్క భౌతిక జీవనోపాధి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
