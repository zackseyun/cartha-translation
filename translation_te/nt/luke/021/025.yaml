id: LUK.21.25
reference: Luke 21:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: te
  text: సూర్యునిలో, చంద్రునిలో, నక్షత్రాలలో సూచనలు ఉంటాయి. భూమిమీద జనాంగాలు సముద్రపు ఘోష, అలల ఉప్పొంగుదల వల్ల ఏమి చేయాలో తోచక తీవ్రమైన సంకటంలో పడతాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో చివరి మాటలను మరింత అక్షరార్థంగా, “సముద్రపు శబ్దం మరియు కల్లోలం విషయంలో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: సూచక క్రియలు
  rationale: అసాధారణమైన, అర్థసూచక పరిణామాలు అనే విస్తృత భావాన్ని ఇస్తుంది; అవి తప్పనిసరిగా అపశకునాలేనని ముందే నిర్ణయించదు.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: సూర్యునిలో, చంద్రునిలో, నక్షత్రాలలో
  rationale: గ్రీకు దత్తివిభక్తి సమన్వయ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: συνοχὴ ἐθνῶν
  choice: జనాలు కలవరపడతారు
  rationale: సంకుచితమైన ఒత్తిడి, తీవ్ర కలవరం అనే συνοχή భావాన్ని సహజమైన క్రియారూపంలో వ్యక్తం చేస్తుంది; ἔθνη ఇక్కడ యూదేతరులను మాత్రమే కాక లోకంలోని జనసమూహాలను సూచిస్తుంది.
- source_word: ἐν ἀπορίᾳ
  choice: ఏమి చేయాలో తోచక
  rationale: దారి తెలియక, పరిష్కారం కానరాక ఉండే నిస్సహాయ అయోమయాన్ని సామాన్యులకు స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: సముద్రపు ఘోషకు, అలల ఉప్పొంగుదలకు
  rationale: ἦχος యొక్క శబ్దం/ఘోష భావాన్నీ, σάλος యొక్క సముద్ర కల్లోలం లేదా ఉప్పొంగే కదలికనూ సహజంగా వ్యక్తం చేస్తుంది; 'అలలు' సందర్భం నుంచి స్పష్టీకరించబడింది.
theological_decisions:
- issue: ఆకాశ సంబంధ సూచక క్రియల స్వభావం
  choice: వాటిని ఆకాశంలో కనిపించే సూచక క్రియలుగా సూటిగా అనువదించడం
  alternative: వాటిని కేవలం అక్షరార్థ ఖగోళ సంఘటనలుగా లేదా కేవలం ప్రతీకాత్మక రాజకీయ చిత్రణగా వివరించడం
  rationale: వాక్యం అక్షరార్థ, ప్రతీకాత్మక, లేదా రెండూ కలిసిన నెరవేర్పులలో దేనినీ స్వయంగా నిర్ణయించదు; అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: ἤχους... καὶ σάλου తో జనాల కలవరానికి ఉన్న సంబంధం
  choice: తెలుగు '-కు' నిర్మాణంతో కారణం లేదా ప్రతిస్పందన సంబంధాన్ని తెరిచి ఉంచడం
  alternative: '''వల్ల'' అని స్పష్టమైన కారణార్థంగా లేదా ''విని'' అని గ్రహణార్థంగా పరిమితం చేయడం'
  rationale: గ్రీకు పాఠంలోని సంక్షిప్త సంబంధం కారణం, సందర్భం, ప్రతిస్పందన ఛాయలను అనుమతిస్తుంది; '-కు' సహజంగా ఉండి వాటిని అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని నామవాచక సాంద్రతను తెలుగులో సహజమైన క్రియారూపంగా మార్చినా, జనాల తీవ్ర కలవరమూ నిస్సహాయ అయోమయమూ నిలుపబడ్డాయి.
