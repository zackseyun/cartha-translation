id: LUK.21.7
reference: Luke 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: te
  text: 'వారు ఆయనను ఇలా అడిగారు: “బోధకుడా, మరి ఇవి ఎప్పుడు జరుగుతాయి? ఇవి జరగబోయే సమయానికి ఏ సూచన ఉంటుంది?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “జరగబోయే సమయానికి” అనే మాటను “జరగనున్నప్పుడు” అని కూడా అనువదించవచ్చు. ఇక్కడి గ్రీకు క్రియ సమీపతను సూచించవచ్చు; మరింత సాధారణ భవిష్యత్ భావంలోనూ వాడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: అడిగారు
  rationale: సాధారణ భూతకాల కథనానికి, ప్రత్యక్ష ప్రశ్న సందర్భానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: δὲ
  choice: వారు ఆయనను ఇలా అడిగారు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో ప్రత్యేక విరోధార్థక పదం చేర్చకుండా వాక్యప్రవాహం ద్వారా దాని పనిని సహజంగా వ్యక్తం చేశాం.
- source_word: λέγοντες
  choice: ఇలా
  rationale: ప్రశ్నలోని మాటలను పరిచయం చేసే గ్రీకు కృదంతాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా మార్చాం.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: బోధించే వ్యక్తి అనే మూలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ప్రభూ’ లేదా ‘యజమానీ’ వంటి అధిక అధికార భావాలను చేర్చదు.
- source_word: πότε οὖν
  choice: మరి ... ఎప్పుడు
  rationale: πότε యొక్క కాలప్రశ్నను, οὖν యొక్క ముందటి మాటల నుంచి వచ్చే అన్వయాన్ని రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ταῦτα ἔσται
  choice: ఇవి ... జరుగుతాయి
  rationale: నపుంసక బహువచన సూచనతో ఉన్న εἰμί భవిష్యత్ రూపం ఇక్కడ సంఘటనలు సంభవించడాన్ని సూచించే గ్రీకు నుడికారం; తెలుగులో ‘జరుగుతాయి’ సహజం.
- source_word: σημεῖον
  choice: సూచన
  rationale: రాబోయే సంఘటనను గుర్తించడానికి తోడ్పడే సంకేతం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὅταν
  choice: జరుగబోతున్నప్పుడు
  rationale: భవిష్యత్తును దృష్టిలో ఉంచిన కాలసంబంధ ఉపవాక్యాన్ని ‘ఎప్పుడు’ భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μέλλῃ
  choice: జరగబోతున్నప్పుడు
  rationale: μέλλωలో ఉండగల సమీపత లేదా త్వరలో సంభవించబోయే భావాన్ని నిలుపుతుంది; దానిని కేవలం సాధారణ భవిష్యత్తుగా కుదించదు.
- source_word: γίνεσθαι
  choice: జరగబోతున్నప్పుడు
  rationale: ఈ సందర్భంలో సంఘటనలు సంభవించడాన్ని సూచిస్తుంది; ‘జరగడం’ స్పష్టమైన, ప్రస్తుత వాడుకలోని తెలుగు.
theological_decisions:
- issue: అంత్యకాల సంఘటనల కాలసంబంధ భావం
  choice: μέλλῃలోని సంభవించబోయే లేదా సమీపిస్తున్న భావాన్ని ‘జరగబోతున్నప్పుడు’ అని ప్రధాన పాఠ్యంలో నిలిపాం.
  alternative: ‘జరగనున్నప్పుడు’ లేదా మరింత సాధారణంగా ‘జరిగేటప్పుడు’ అని అనువదించవచ్చు.
  rationale: శిష్యులు కాలం గురించీ సూచన గురించీ అడుగుతున్నారు. గ్రీకు పదంలోని సమీపత భావాన్ని ఉంచడం, అయితే పాదసూచికలో దాని విస్తృత ప్రయోగాన్ని తెలియజేయడం ద్వారా ఏ ప్రత్యేక అంత్యకాల పథకాన్నీ అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని ప్రశ్నల క్రమం మరియు భావసంబంధాన్ని నిలిపాం.
