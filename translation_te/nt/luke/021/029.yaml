  text: Καὶ εἶπεν παραβολὴν αὐτοῖς· Ἴδετε τὴν συκῆν καὶ πάντα τὰ δένδρα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/029.yaml
  text: 'And he told them a parable: “Look at the fig tree and all the trees[a].'
translation:
  language: te
  text: 'ఆయన వారికి ఒక ఉపమానం చెప్పాడు: “అంజూరపు చెట్టును, చెట్లన్నిటినీ గమనించండి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అంజూరపు చెట్టును, చెట్లన్నిటినీ చూడండి.”
    reason: Ἴδετε అనే పదాన్ని ‘గమనించండి’ లేదా మరింత ప్రత్యక్షంగా ‘చూడండి’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: Καὶ
  choice: ఆయన
  rationale: తెలుగులో వాక్యారంభంలోని ‘మరియు’ సహజంగా ఉండదు; కర్తను స్పష్టంగా ఉంచడం ద్వారా కథన కొనసాగింపు సహజంగా వ్యక్తమవుతుంది.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: ఆయన వారికి ఒక ఉపమానం చెప్పాడు
  rationale: ‘ఉపమానం చెప్పాడు’ అనేది తెలుగు వాడుకలో సహజమైనది; αὐτοῖς అనే పరోక్ష కర్మను ‘వారికి’గా స్పష్టంగా ఉంచుతుంది.
- source_word: παραβολὴν
  choice: ఉపమానం
  rationale: సువార్తలలో παραβολή సూచించే బోధాత్మక కథ లేదా పోలికకు ఇది స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: Ἴδετε
  choice: గమనించండి
  rationale: ఈ ఆజ్ఞ కేవలం చూడడమే కాక దృష్టి పెట్టమని పిలుస్తుంది; ‘గమనించండి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τὴν συκῆν
  choice: అంజూరపు చెట్టును
  rationale: συκῆ ఫలాన్ని కాక చెట్టును సూచిస్తుంది; ‘అంజూరపు చెట్టు’ ఖచ్చితమైన సాధారణ తెలుగు రూపం.
- source_word: πάντα τὰ δένδρα
  choice: చెట్లన్నిటినీ
  rationale: గ్రీకు పదబంధంలోని సమగ్ర బహువచన భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో లేని ‘ఇతర’ అనే భావాన్ని చేర్చదు.
