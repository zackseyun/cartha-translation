lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: మిమ్మల్ని ద్వేషిస్తారు
  rationale: εἰμί భవిష్యత్ రూపంతో కూడిన వర్తమాన కర్మణి అసమాపక క్రియను తెలుగులో సహజమైన భవిష్యత్ కర్మణి భావంగా వ్యక్తం చేసింది. గ్రీకులోని కొనసాగుతున్న శత్రుత్వ భావాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: ὑπὸ πάντων
  choice: అందరూ
  rationale: ὑπό + షష్ఠీ విభక్తి కర్తృత్వాన్ని సూచిస్తుంది. తెలుగు కర్మణి నిర్మాణంలో ‘అందరిచేత’ సాధ్యమైనా, ‘అందరూ మిమ్మల్ని’ అనేది మరింత సహజంగా ఉండి ‘అందరి ద్వారా’ అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: διὰ τὸ ὄνομά μου
  choice: నా పేరు కారణంగా
  rationale: διά + ద్వితీయా విభక్తి కారణాన్ని తెలియజేస్తుంది. ‘నా పేరు’ అనే మూలపాఠంలోని రూపకాన్ని వ్యాఖ్యానాత్మకంగా కుదించకుండా అలాగే నిలిపింది.
theological_decisions:
- issue: హింస సందర్భంలో ‘నా పేరు’ అనే పదబంధం యొక్క భావం
  choice: ‘నా పేరు కారణంగా’ అనే ప్రత్యక్ష పదబంధాన్ని నిలుపడం
  alternative: ‘నా కారణంగా’ లేదా ‘మీరు నాకు చెందినవారు కాబట్టి’
  rationale: గ్రీకు మూలంలో ὄνομά μου అని స్పష్టంగా ఉంది. ఇది యేసు వ్యక్తిత్వం, అధికారం, ఆయనపట్ల విధేయతను ఒప్పుకోవడం వంటి పరస్పర సంబంధిత భావాలను మోస్తుంది; వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం. ‘అందరిచేత ద్వేషించబడతారు’ అనే అధికంగా గ్రాంథికమైన కర్మణి రూపానికి బదులుగా సహజమైన కర్తరి నిర్మాణాన్ని వాడింది; మూలంలోని అర్థం మరియు విస్తృతత నిలిచాయి.
