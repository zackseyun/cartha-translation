    text: లేదా, “నా కారణంగా.” “నా పేరు” అనేది యేసు వ్యక్తిత్వాన్ని, అధికారాన్ని, ఆయనకు చెందినవారమని బహిరంగంగా ఒప్పుకోవడాన్ని సూచించవచ్చు.
