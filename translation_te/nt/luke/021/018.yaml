lexical_decisions:
- source_word: καὶ
  choice: అయినా
  rationale: ముందరి వచనంలో శిష్యులు హతమవుతారని చెప్పిన నేపథ్యంలో ఈ అనుసంధానం తెలుగులో సహజంగా భావవ్యతిరేక సంబంధాన్ని తెలియజేస్తుంది; అయినప్పటికీ మూలంలోని సాధారణ అనుసంధానాన్ని అతిగా వివరణాత్మకం చేయదు.
- source_word: θρὶξ
  choice: ఒక్క వెంట్రుక కూడా
  rationale: ఏ ఒక్క వెంట్రుకయూ మినహాయింపు కాదనే సామెతసదృశమైన సంపూర్ణతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: మీ తలపై ఉన్న
  rationale: గ్రీకు భాగసూచక ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; బహువచనంగా సంబోధించినప్పటికీ సమూహార్థక ఏకవచనం తెలుగులో సహజం.
- source_word: οὐ μὴ
  choice: కూడా ... నశించదు
  rationale: బలమైన గ్రీకు నిషేధాన్ని తెలుగు ‘ఒక్క... కూడా ...దు’ నిర్మాణంతో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἀπόληται
  choice: నశించదు
  rationale: ἀπόλλυμι యొక్క నశించడం లేదా పోవడం అనే గంభీర భావాన్ని నిలుపుతుంది; కేవలం భౌతిక విధ్వంసం అని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: సమీప సందర్భంలో హింస మరియు కొందరి మరణం చెప్పబడటంతో కనిపించే ఉద్రిక్తత
  choice: అంతిమ సంరక్షణను బలంగా హామీ ఇచ్చే సామెతసదృశమైన వాక్యంగా అనువదించడం
  alternative: ఎలాంటి శారీరక హానీ జరగదనే అక్షరార్థ వాగ్దానంగా అనువదించడం
  rationale: సమీప సందర్భం కొందరు శిష్యులు చంపబడతారని చెబుతుంది. అందువల్ల ఆ ఉద్రిక్తతను వివరణతో తొలగించకుండా, మూలంలోని బలమైన హామీని యథాతథంగా ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఒక్క... కూడా’ నిర్మాణం సామాన్య పాఠకులకు స్పష్టంగా ఉండి గ్రీకు నిషేధ బలాన్ని మోస్తుంది; వచనంలోని సందర్భోచిత theological tension‌ను ప్రధాన పాఠ్యంలో వివరించి పరిష్కరించలేదు.
