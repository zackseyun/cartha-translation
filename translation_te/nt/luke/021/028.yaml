base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: te
  text: అయితే ఇవి జరగడం మొదలైనప్పుడు[a], నిటారుగా నిలబడండి, మీ తలలను పైకెత్తండి[b], ఎందుకంటే మీ విమోచన సమీపిస్తోంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇవి సంభవించడం మొదలవుతుండగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పైకి చూసి మీ తలలను ఎత్తండి.’
    reason: lexical_alternative
  - marker: c
    text: ‘విమోచన’ను ‘విడుదల’ అని కూడా అనువదించవచ్చు; ఇక్కడ సందర్భంలో అది సమీపిస్తున్న అంతిమ విమోచనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων ... τούτων γίνεσθαι
  choice: ఇవి జరగడం మొదలైనప్పుడు
  rationale: జనిటివ్ అబ్సల్యూట్ సూచించే కాలసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ἀρχομένων మరియు γίνεσθαι రెండింటి భావాన్నీ నిలుపుతుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందున్న కష్టాల వర్ణన నుంచి ప్రోత్సాహం వైపు వచ్చే స్వల్ప వ్యత్యాసాన్ని, మార్పును సహజంగా సూచిస్తుంది.
- source_word: ἀνακύψατε
  choice: నిటారుగా నిలబడి
  rationale: వంగిన స్థితి నుంచి నిటారుగా కావడం అనే శారీరక చిత్రాన్నీ, ధైర్యం పొందడం అనే అంతర్భావాన్నీ నిలుపుతుంది; కేవలం ‘పైకి చూడండి’ అని అర్థాన్ని కుదించదు.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: మీ తలలు పైకెత్తండి
  rationale: ఆశతో, ధైర్యంతో తల ఎత్తే మూలపాఠంలోని బహువచన ఆజ్ఞారూప చిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: διότι
  choice: ఎందుకంటే
  rationale: కారణ సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγγίζει
  choice: సమీపిస్తోంది
  rationale: వర్తమాన కాలంలో దగ్గరకు వస్తున్న ప్రక్రియను వ్యక్తం చేస్తుంది; కేవలం స్థిరంగా ‘సమీపంలో ఉంది’ అని చెప్పదు.
- source_word: ἀπολύτρωσις
  choice: విమోచన
  rationale: విడుదల, రక్షణ అనే భావాలతో పాటు పదంలోని గంభీరమైన రక్షణశాస్త్ర సంబంధ విస్తృతిని నిలుపుతుంది; కేవలం తక్షణ ప్రమాదం నుంచి తప్పించుకోవడానికే పరిమితం చేయదు.
theological_decisions:
- issue: అంత్యకాల ప్రసంగంలో ‘మీ విమోచన’ అనే మాట భావం
  choice: ‘మీ విమోచన’ అని అనువదించి, యేసు శిష్యులకు సమీపిస్తున్న అంతిమ విడుదల/రక్షణ అనే భావాన్ని సందర్భం ద్వారా నిలిపాం.
  alternative: దీనిని కేవలం తక్షణ చారిత్రక సంక్షోభం నుంచి విడుదలగా లేదా పూర్తిగా అంతర్ముఖ ఆధ్యాత్మిక అనుభవంగా స్పష్టీకరించడం.
  rationale: సందర్భం భవిష్యత్తు మరియు అంత్యకాల దిశలో ఉంది. అయినా మూలపాఠం విమోచన జరిగే విధానాన్ని ఇక్కడ వివరించదు కాబట్టి, అనువాదం దానిని అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘నిటారుగా నిలబడి’ మరియు ‘తలలు పైకెత్తండి’ అనే సమాంతర ఆజ్ఞలు మూలంలోని శారీరక రూపకాన్నీ ప్రోత్సాహ స్వరాన్నీ కాపాడుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
