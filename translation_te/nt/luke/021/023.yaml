id: LUK.21.23
reference: Luke 21:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: te
  text: ఆ రోజుల్లో గర్భవతులకూ పసిబిడ్డలకు పాలిచ్చేవారికీ అయ్యో! ఎందుకంటే దేశం మీద[a] తీవ్రమైన సంకటం కలుగుతుంది, ఈ ప్రజల మీద ఆగ్రహం కలుగుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భూమి మీద.’ గ్రీకు γῆ అనే పదానికి ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు. చుట్టుపక్కల సందర్భం యెరూషలేము, యూదయపై కేంద్రీకృతమై ఉన్నందున ఇక్కడ ‘దేశం’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఈ ప్రజల కొరకు ఆగ్రహం’ లేదా ‘ఈ ప్రజలపై ఆగ్రహం.’
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: అయ్యో
  rationale: విలాపంతోపాటు రాబోయే తీర్పు తీవ్రతను వ్యక్తం చేసే సహజమైన తెలుగు ఉద్గారం.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: గర్భవతులకు
  rationale: ‘గర్భంలో కలిగియున్నవారు’ అనే గ్రీకు ప్రయోగానికి సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ταῖς θηλαζούσαις
  choice: పసిబిడ్డలకు పాలిచ్చేవారికి
  rationale: క్రియలో అంతర్లీనంగా ఉన్న పాలుతాగే శిశువులను స్పష్టం చేస్తూ మాతృసంబంధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: గ్రీకు కాలసూచక ప్రయోగానికి దగ్గరగా ఉండే సాధారణ తెలుగు రూపం.
- source_word: ἀνάγκη μεγάλη
  choice: తీవ్రమైన కష్టకాలం
  rationale: ఈ విపత్తు సందర్భంలో కేవలం ‘అవసరం’ కాకుండా తీవ్రమైన సంకటస్థితి లేదా దురవస్థను సూచిస్తుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: దేశంలో
  rationale: γῆ అనే పదానికి ‘దేశం/భూమి’ అనే రెండు అర్థాలు సాధ్యం; యెరూషలేము, యూదయ నేపథ్యానికి ‘దేశం’ సహజంగా సరిపోతుంది.
- source_word: ὀργὴ
  choice: ఆగ్రహం
  rationale: కోపం లేదా తీర్పుతో కూడిన ఉగ్రతను నిలుపుతుంది; గ్రీకులో లేని ‘దేవుని’ అనే కర్తను చేర్చదు.
- source_word: τῷ λαῷ τούτῳ
  choice: ఈ ప్రజల మీద
  rationale: ఆగ్రహం ఎవరిని ప్రభావితం చేస్తుందో తెలుగులో సహజంగా తెలియజేస్తూ సూచనాత్మక ‘ఈ’ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: γῆ మరియు ‘ఈ ప్రజలు’ అనే మాటల పరిధి
  choice: ప్రధాన పాఠంలో ‘దేశం’ అని అనువదించి, తక్షణ సందర్భంలోని యెరూషలేము/యూదయకు సంబంధించిన స్థానిక తీర్పును ముందుంచడం.
  alternative: ‘భూమి మీద’ అని అనువదించి విశ్వవ్యాప్త పరిధిని సూచించడం.
  rationale: చుట్టుపక్కల వచనాలు యెరూషలేము ముట్టడి, దాని నాశనం, దాని నివాసుల పరిస్థితిపై కేంద్రీకృతమై ఉన్నాయి; అయినా γῆ యొక్క విస్తృత అర్థాన్ని పాదసూచికలో నిలుపుతున్నాం.
- issue: ὀργή యొక్క కర్త మరియు స్వభావం
  choice: ‘ఆగ్రహం’ అని మాత్రమే అనువదించడం.
  alternative: ‘దేవుని ఆగ్రహం’ లేదా ‘తీర్పు’ అని స్పష్టీకరించడం.
  rationale: సందర్భంలో దైవిక ఆగ్రహం భావించవచ్చుగానీ, గ్రీకు వచనం కర్తగా ‘దేవుడు’ అని చెప్పదు; ‘తీర్పు’ అనడం కూడా మూలపదాన్ని వ్యాఖ్యానాత్మకంగా సంకుచితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రవచనాత్మక ధోరణి. ‘అయ్యో’ ద్వారా విలాపం మరియు తీర్పు రెండింటి ఛాయను నిలిపాం. మూలంలో లేని ‘దేవుని’ అనే పదాన్ని చేర్చలేదు; γῆ యొక్క అర్థసందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
