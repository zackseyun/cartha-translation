revisions:
- from: ఆ రోజుల్లో గర్భవతులకూ పసిబిడ్డలకు పాలిచ్చేవారికీ అయ్యో! ఎందుకంటే దేశంలో[a] తీవ్రమైన కష్టకాలం వస్తుంది; ఈ ప్రజల మీద ఆగ్రహం ఉంటుంది[b].
  to: ఆ రోజుల్లో గర్భవతులకూ పసిబిడ్డలకు పాలిచ్చేవారికీ అయ్యో! ఎందుకంటే దేశం మీద[a] తీవ్రమైన సంకటం కలుగుతుంది, ఈ ప్రజల మీద ఆగ్రహం కలుగుతుంది[b].
  rationale: The revision removes the added temporal nuance in ‘కష్టకాలం,’ uses a closer equivalent for great distress, and makes both future clauses explicit. It also completes footnote b’s presentation of the source’s possible dative relationships without imposing an interpretation of whose wrath is meant.
