id: LUK.21.15
reference: Luke 21:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: te
  text: ఎందుకంటే, మిమ్మల్ని ఎదిరించే వారందరూ ఎదురునిలవలేని లేదా ఖండించలేని మాటలనూ జ్ఞానాన్నీ నేనే మీకు ఇస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: మాటలు
  rationale: గ్రీకు పదానికి అక్షరార్థం ‘నోరు’; అయితే ఇక్కడ న్యాయసాక్ష్య సందర్భంలో మాట్లాడవలసిన మాటలు లేదా వాక్చాతుర్యం అనే భావం ఉంది. ఆధునిక తెలుగులో ‘మాటలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: σοφίαν
  choice: జ్ఞానం
  rationale: σοφία యొక్క సాధారణ భావమైన వివేకపూర్వక జ్ఞానాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἀντιστῆναι
  choice: ఎదురునిలవడం
  rationale: వారు ఇచ్చే సాక్ష్యానికి సమర్థంగా ప్రతిఘటించడం అనే భావాన్ని నిలుపుతుంది.
- source_word: ἀντειπεῖν
  choice: ఖండించడం
  rationale: ఎదురుగా మాట్లాడి వాదనను తిరస్కరించడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: మిమ్మల్ని ఎదిరించే వారు
  rationale: శిష్యులకు విరోధంగా నిలిచేవారనే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: యేసు ఇచ్చే సహాయం స్వరూపం
  choice: ‘మాటలనూ జ్ఞానాన్నీ నేనే మీకు ఇస్తాను’ అని అనువదించడం
  alternative: ‘నోరునూ జ్ఞానాన్నీ ఇస్తాను’
  rationale: ‘నేనే’ ద్వారా ἐγώ యొక్క ఉద్ఘాటన నిలుస్తుంది; ‘మాటలు’ అనేది στόμα యొక్క సందర్భోచిత రూపకం. ఇది సహాయం మాటల్లోనూ జ్ఞానంలోనూ ఉందని చెబుతుంది, కానీ దాని విధానాన్ని అదనంగా నిర్వచించదు.
- issue: విరోధులు చేయలేనిదాని పరిధి
  choice: ఎదురునిలవలేరు, ఖండించలేరు
  alternative: జయించలేరు, విరుద్ధంగా మాట్లాడలేరు
  rationale: గ్రీకులోని రెండు వేర్వేరు క్రియలను వేర్వేరుగానే నిలిపి, శిష్యులు ఎలాంటి కష్టాన్నీ ఎదుర్కోరనే విస్తృత వాగ్దానంగా మార్చకుండా సాక్ష్యాన్ని సమర్థంగా ప్రతిఘటించలేకపోవడానికే పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయినా గంభీరతను నిలుపుతూ రూపొందించబడింది. గ్రీకు వాక్య నిర్మాణంలోని సంబంధవాచక భావాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా ముందుకు తెచ్చాం.
