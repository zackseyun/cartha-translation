  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: te
  text: అయితే ఎల్లప్పుడూ మెలకువగా ఉండి, జరగబోతున్న[a] ఈ సంగతులన్నిటి నుండి తప్పించుకోవడానికి, మనుష్య కుమారుని ఎదుట నిలబడడానికి[b] మీకు బలం కలగాలని ప్రార్థిస్తూ ఉండండి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జరగనున్న.”
    reason: lexical_alternative
  - marker: b
    text: “మనుష్య కుమారుని ఎదుట నిలబడడం” ఆయన ఎదుట అంగీకారం పొందడం లేదా నిర్దోషులుగా నిలవడం అనే భావాన్ని సూచించవచ్చు; అయితే గ్రీకు పాఠ్యం దీనిని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో, “ఈ సంగతులన్నిటి నుండి తప్పించుకోవడానికి మీరు యోగ్యులుగా ఎంచబడాలని” అని ఉంది; “మీకు బలం కలగాలని” అనే పాఠానికి బదులుగా.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: మెలకువగా ఉండి
  rationale: ఆజ్ఞారూపంలోని అప్రమత్తమైన మెలకువ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న హెచ్చరికలకు స్వల్ప వ్యత్యాసం లేదా తదుపరి ప్రబోధానికి మార్పును సూచిస్తుంది.
- source_word: ἐν παντὶ καιρῷ
  choice: ఎల్లప్పుడూ
  rationale: ప్రతి సమయంలో అనే నిరంతర భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δεόμενοι
  choice: ప్రార్థిస్తూ ఉండండి
  rationale: విన్నపంతో చేసే ప్రార్థనను సూచించే వర్తమాన కృదంత భావాన్ని తెలుగులో నిరంతర ఆజ్ఞతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα κατισχύσητε
  choice: మీకు బలం కలగాలని
  rationale: κατισχύωలోని బలపడటం లేదా సమర్థులవడం అనే భావాన్ని కాపాడుతుంది; పాఠాంతరమైన ‘యోగ్యులుగా ఎంచబడటం’ను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἐκφυγεῖν
  choice: తప్పించుకోవడానికి
  rationale: ప్రమాదం లేదా రాబోయే సంఘటనల నుండి బయటపడటం అనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: జరగబోతున్న ఈ సంగతులన్నిటి
  rationale: μέλλω + infinitiveలోని రాబోయే లేదా సమీప భవిష్యత్తు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: σταθῆναι
  choice: నిలబడడానికి
  rationale: తీర్పులో అంగీకారం లేదా నిర్దోషిత్వాన్ని స్పష్టంగా చేర్చకుండా గ్రీకు రూపకాన్ని అలాగే ఉంచుతుంది.
- source_word: ἔμπροσθεν
  choice: ఎదుట
  rationale: ఒకరి సమక్షంలో లేదా ముందు అనే స్థల-సంబంధ భావానికి సహజమైన తెలుగు పదం.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుని
  rationale: సువార్తల్లోని బిరుదాత్మక ప్రయోగాన్ని స్థిరమైన తెలుగు బైబిలు రూపంలో కాపాడుతుంది.
theological_decisions:
- issue: అంత్యకాల సహనానికి సంబంధించి κατισχύσητε అర్థం
  choice: ‘మీకు బలం కలగాలని’ అని అనువదించబడింది.
  alternative: ‘మీరు యోగ్యులుగా ఎంచబడాలని’
  rationale: SBLGNTలో κατισχύσητε ఉంది; ఇది యోగ్యతకన్నా బలం కలిగి ఉండటం లేదా సమర్థులవడం అనే భావాన్ని ఇస్తుంది. ప్రాచీన ప్రతుల్లోని ప్రముఖ పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
- issue: σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου భావం
  choice: ‘మనుష్య కుమారుని ఎదుట నిలబడడానికి’ అనే రూపకాన్ని వివరణ లేకుండా నిలిపాం.
  alternative: ‘మనుష్య కుమారుని ఎదుట అంగీకరించబడినవారిగా నిలబడడానికి’
  rationale: ఈ మాట అంత్యకాల అంగీకారం లేదా నిర్దోషిగా తీర్పు పొందడాన్ని సూచించవచ్చు; అయితే గ్రీకు పాఠ్యం దానిని స్పష్టంగా చెప్పదు. అందువల్ల ఆ భావపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మెలకువగా ఉండి’, ‘ప్రార్థిస్తూ ఉండండి’ అనే రూపాలు నిరంతర అప్రమత్తతను సహజంగా తెలియజేస్తాయి. ప్రధాన పాఠ్యంలో రెండు పాదసూచిక గుర్తులూ [a], [b] చేర్చబడ్డాయి.
