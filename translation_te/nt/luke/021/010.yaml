id: LUK.21.10
reference: Luke 21:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: te
  text: 'అప్పుడు ఆయన వారితో ఇలా అన్నాడు: “ఒక దేశానికి వ్యతిరేకంగా మరో దేశం, ఒక రాజ్యానికి వ్యతిరేకంగా మరో రాజ్యం లేస్తాయి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తలెత్తుతాయి.”
    reason: Ἐγερθήσεται అనే పదానికి ఈ సందర్భంలో ‘లేవడం,’ ‘తలెత్తడం’ అనే రెండూ సాధ్యమైన భావవ్యక్తీకరణలు.
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: ముందటి సందర్భంతో ఈ మాటను అనుసంధానించే కాలసూచక పదాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔλεγεν αὐτοῖς
  choice: ఆయన వారితో ఇలా అన్నాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపాన్ని ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సహజ తెలుగు కథనశైలిలో అందిస్తుంది; ‘ఇలా’ ప్రత్యక్ష వాక్యానికి స్పష్టమైన సంధానాన్ని ఇస్తుంది.
- source_word: Ἐγερθήσεται
  choice: లేస్తాయి
  rationale: సంఘర్షణ సందర్భంలో ‘వ్యతిరేకంగా లేవడం’ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది. తెలుగులో సమాంతరమైన రెండు కర్తలకు అనుగుణంగా బహువచన క్రియ వాడబడింది.
- source_word: ἔθνος ἐπ’ ἔθνος
  choice: ఒక దేశానికి వ్యతిరేకంగా మరో దేశం
  rationale: రాజకీయ సమూహాల మధ్య ఘర్షణను ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది. ‘ఒక… మరో…’ అనేది గ్రీకు పునరుక్త నిర్మాణంలోని పరస్పర విరోధ భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: βασιλεία ἐπὶ βασιλείαν
  choice: ఒక రాజ్యానికి వ్యతిరేకంగా మరో రాజ్యం
  rationale: βασιλεία ఇక్కడ రాజరికం అనే అమూర్త భావం కంటే రాజకీయ రాజ్యాన్ని సూచిస్తుంది; ἐπί యొక్క విరోధార్థాన్ని ‘వ్యతిరేకంగా’ స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: అంత్యకాల సంఘర్షణ సూత్రం
  choice: దేశాలు, రాజ్యాలు పరస్పరం లేచే రాజకీయ కల్లోలాన్ని సూటిగా ముందుగా చెప్పే వాక్యంగా అనువదించడం
  alternative: దీనిని యెరూషలేము పతనానికే పరిమితం చేయడం లేదా అంత్యకాలానికి సంబంధించిన వివరణాత్మక కాలపట్టికగా చూపడం
  rationale: ఈ వచనం విస్తృతమైన కాలాంతర వివాదాలను స్వయంగా పరిష్కరించదు. అందువల్ల ఏ ప్రత్యేక అంత్యకాల సిద్ధాంతాన్నీ అనువాదంలో చేర్చకుండా మూలంలోని సాధారణ ప్రవచన రూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకునికి అర్థమయ్యే గంభీరమైన శైలి. ‘జాతి’ కంటే భౌగోళిక-రాజకీయ భావం స్పష్టంగా ఉండేందుకు ‘దేశం’ ఎంచుకోబడింది; సమాంతరత కోసం ‘రాజ్యం’ నిలుపబడింది.
