  source_fidelity: మూల గ్రీకు వాక్యంలోని కాలసూచక పదం, మూడు సమాంతర మూడవ-పురుష ఆజ్ఞారూపాలు, కొండలకు పారిపోవడం, నగరం మధ్యలోనివారు బయటికి వెళ్లడం, గ్రామీణ ప్రాంతాలనుండి లోపలికి రాకూడదనే నిషేధం అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. ‘దాని / దానిలోకి’ మూలంలోని సర్వనామ సూచనను కాపాడుతాయి; సందర్భంలో దాని సూచ్యం యెరూషలేమే అని అడుగుసూచన సముచితంగా వివరిస్తుంది.
  naturalness: పాఠ్యం ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, ప్రవాహంగా ఉంది. ‘పారిపోవాలి,’ ‘బయటికి వెళ్లిపోవాలి,’ ‘ప్రవేశించకూడదు’ అనే రూపాలు అత్యవసర ఆజ్ఞాభావాన్ని సహజంగా తెలియజేస్తాయి. సెమికోలన్‌లతో మూడు సమాంతర ఆజ్ఞలను విడదీయడం పఠనసౌలభ్యాన్ని పెంచుతుంది.
  terminology: ‘యూదయ,’ ‘కొండలు,’ ‘పల్లెప్రాంతాలు’ సందర్భానుకూలమైన పదాలు. నగరాన్ని సూచించడానికి తెలుగులో నపుంసక సర్వనామమైన ‘దాని’ సహజం; గ్రీకు స్త్రీలింగ రూపాన్ని అడుగుసూచనలో పేర్కొనడం సరైనది. అడుగుసూచన గుర్తు మొదటి సర్వనామానికి అనుసంధానమై, రెండు సర్వనామాలకూ వివరణ ఇస్తుంది.
