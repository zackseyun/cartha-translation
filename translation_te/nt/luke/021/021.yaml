id: LUK.21.21
reference: Luke 21:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: te
  text: అప్పుడు యూదయలో ఉన్నవారు కొండలకు పారిపోవాలి; దాని[a] మధ్యలో ఉన్నవారు బయటికి వెళ్లిపోవాలి; పల్లెప్రాంతాల్లో ఉన్నవారు దానిలోకి ప్రవేశించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దాని,” “దానిలోకి” అనే పదాలు సమీప సందర్భంలోని యెరూషలేమును సూచిస్తున్నాయి. గ్రీకులో ఈ నగరాన్ని సూచించే సర్వనామాలు స్త్రీలింగంలో ఉన్నాయి.
    reason: సర్వనామాల సూచ్యాన్ని, గ్రీకు లింగరూపాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: ముందటి వచనంలోని సూచనను అనుసరించే కాలక్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: యూదయలో ఉన్నవారు
  rationale: యూదయ ప్రాంతంలో ఉన్న ప్రజలను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: కొండలకు పారిపోవాలి
  rationale: మూడవ పురుష బహువచన ఆజ్ఞలోని అత్యవసరతను తెలుగులో స్పష్టంగా నిలుపుతుంది; ὄρηకి సందర్భానుకూలంగా ‘కొండలు’ సహజం.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: దాని మధ్యలో ఉన్నవారు
  rationale: αὐτῆς అనే సర్వనామాన్ని ప్రత్యక్షంగా ‘యెరూషలేము’ అని విప్పకుండా ఉంచి, తెలుగులో సహజమైన నపుంసక సర్వనామంతో అనిశ్చిత సూచనను కాపాడుతుంది.
- source_word: ἐκχωρείτωσαν
  choice: బయటికి వెళ్లిపోవాలి
  rationale: ఒక స్థలం నుంచి తొలగిపోవడం లేదా ఖాళీ చేయడం అనే భావాన్ని సందర్భానికి తగిన స్పష్టతతో అందిస్తుంది.
- source_word: οἱ ἐν ταῖς χώραις
  choice: పల్లెప్రాంతాల్లో ఉన్నవారు
  rationale: χῶραι ఇక్కడ నగరానికి వెలుపలి గ్రామీణ ప్రాంతాలను సూచిస్తుంది; ‘పల్లెప్రాంతాలు’ ఆధునిక తెలుగులో సహజం.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: దానిలోకి ప్రవేశించకూడదు
  rationale: నిషేధాత్మక ఆజ్ఞను స్పష్టంగా తెలియజేస్తూ, αὐτήνకు ఉన్న పూర్వసూచనను సర్వనామ రూపంలోనే నిలుపుతుంది.
theological_decisions:
- issue: αὐτῆς / αὐτήν సర్వనామాల సూచ్యం
  choice: ప్రధాన పాఠ్యంలో ‘దాని / దానిలోకి’ అని ఉంచి, అడుగుసూచనలో యెరూషలేమును సూచించే అవకాశాన్ని వివరించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘యెరూషలేము మధ్యలో / యెరూషలేములోకి’ అని స్పష్టీకరించడం
  rationale: గ్రీకు సర్వనామాలు స్త్రీలింగంలో ఉన్నప్పటికీ తెలుగు వ్యాకరణంలో నగరానికి ‘దాని’ సహజం. సమీప సందర్భం యెరూషలేమును సూచిస్తుంది; అయితే ఈ వచనంలో ఆ నామం పునరుక్తం కాలేదు కాబట్టి దాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని సూచనాత్మక స్వభావాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; అత్యవసర ఆజ్ఞలను ‘పారిపోవాలి,’ ‘వెళ్లిపోవాలి,’ ‘ప్రవేశించకూడదు’ అనే సహజమైన గౌరవప్రద రూపాలతో అందించాం. ‘నడుమ’ కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘మధ్యలో,’ ‘గ్రామీణ ప్రాంతాలు’ కంటే ప్రవాహవంతమైన ‘పల్లెప్రాంతాలు’ ఎంచుకున్నాం.
