id: LUK.21.32
reference: Luke 21:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: te
  text: '“నేను మీతో నిశ్చయంగా చెబుతున్నాను: అన్నీ[b] జరిగేంతవరకు[c] ఈ తరం[a] ఎంతమాత్రమూ గతించదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ ప్రజలు’ లేదా ‘ఈ యుగం’; గ్రీకు పదాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు, అయితే ‘తరం’ అనేది అత్యంత ప్రత్యక్షమైన అనువాదం.
    reason: alternative_reading
  - marker: b
    text: కొన్ని అనువాదాలు చుట్టుపక్కల సందర్భాన్ని బట్టి ‘ఇవన్నీ’ అని ఇస్తాయి; ఇక్కడ గ్రీకు పాఠ్యం కేవలం ‘అన్నీ’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘సంభవించేంతవరకు’ లేదా ‘నెరవేరేంతవరకు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: నిశ్చయంగా
  rationale: గంభీరమైన, అధికారపూర్వకమైన ధృవీకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; అనవసరమైన లిప్యంతరీకరణను నివారిస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: గ్రీకు ప్రత్యక్ష వాక్య సూత్రానికి దగ్గరగా ఉంటూనే తెలుగులో సహజంగా ఉంది.
- source_word: οὐ μὴ παρέλθῃ
  choice: ఎంతమాత్రమూ గతించదు
  rationale: οὐ μήతో కూడిన బలమైన నిరాకరణను ‘ఎంతమాత్రమూ’ స్పష్టంగా తెలియజేస్తుంది; παρέρχομαι యొక్క ‘గతించు’ భావాన్ని నిలుపుతుంది.
- source_word: ἡ γενεὰ αὕτη
  choice: ఈ తరం
  rationale: γενεάకు ఇక్కడ అత్యంత ప్రత్యక్షమైన అర్థం ‘తరం’. వివాదాస్పదమైన దాని నిర్దిష్ట సూచనను ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
- source_word: ἕως ἂν
  choice: జరిగేంతవరకు
  rationale: ముందున్న ప్రకటన వర్తించే కాలపరిమితిని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πάντα
  choice: అన్నీ
  rationale: గ్రీకులో ‘ఇవి’ అనే సూచనపదం లేదు; కాబట్టి సందర్భం నుంచి దానిని ప్రధాన పాఠ్యంలో చేర్చకుండా πάντα యొక్క సమగ్ర భావాన్ని ఇస్తుంది.
- source_word: γένηται
  choice: జరిగే
  rationale: ఇక్కడ γίνομαι సంఘటనలు సంభవించడాన్ని సూచిస్తుంది. ‘నెరవేరు’ అనే బలమైన ధార్మిక భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో ‘ఈ తరం’ అనే మాట యొక్క సూచన
  choice: దాన్ని పదార్థానుసారంగా ‘ఈ తరం’ అని అనువదించి, అది ఎవరిని సూచిస్తుందో ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
  alternative: ‘ఈ ప్రజలు’, ‘ఈ యుగం’, లేదా ఈ సూచనలను చూసే తరం
  rationale: గ్రీకు పదబంధం ప్రత్యక్షంగా ఉన్నప్పటికీ దాని సూచన వివాదాస్పదం. అనువాదం ఆ వ్యాఖ్యాన సంబంధ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యేసు గంభీర ప్రకటనకు తగిన గౌరవప్రదమైన శైలి. పదక్రమాన్ని సహజమైన తెలుగుకు అనుగుణంగా మార్చినా గ్రీకు వాక్యంలోని బలమైన నిరాకరణ, కాలపరిమితి, మరియు వ్యాఖ్యాన అస్పష్టతలను నిలిపింది.
