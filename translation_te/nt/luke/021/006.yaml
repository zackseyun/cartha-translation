source:
  edition: SBLGNT
  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: te
  text: “మీరు చూస్తున్న ఈ కట్టడాల విషయానికొస్తే,[a] ఒక రాయి మీద మరో రాయి కూడా మిగలకుండా అవి కూల్చివేయబడే రోజులు వస్తాయి.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు చూస్తున్న ఇవి.” గ్రీకులో ‘కట్టడాలు’ అనే పదం లేదు; సందర్భాన్ని బట్టి అది స్పష్టమవుతుంది. ‘చూస్తున్న’ అనే క్రియను ‘గమనిస్తున్న’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “కూల్చివేయబడకుండా ఒక రాయి మీద మరో రాయి మిగలదు”; ఇది సంపూర్ణ విధ్వంసాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: మీరు చూస్తున్న ఈ కట్టడాల విషయానికొస్తే
  rationale: ముందుకు తెచ్చిన Ταῦτα యొక్క అంశప్రాధాన్యాన్ని ‘విషయానికొస్తే’ తెలియజేస్తుంది; θεωρεῖτε లోని చూస్తూ/గమనిస్తూ ఉండే భావాన్ని ‘చూస్తున్న’ నిలుపుతుంది. సందర్భంలో సూచించబడుతున్నవి ఆలయ కట్టడాలు కాబట్టి తెలుగులో సహజత కోసం ‘కట్టడాలు’ వాడబడింది.
- source_word: ἐλεύσονται ἡμέραι
  choice: రోజులు వస్తాయి
  rationale: రాబోయే కాలాన్ని సూచించే గ్రీకు నుడికారాన్ని సహజమైన తెలుగు భవిష్యదర్థంతో నేరుగా అందిస్తుంది.
- source_word: ἐν αἷς
  choice: ఆ రోజుల్లో అనే భావాన్ని ప్రధాన వాక్యంలో కలిపి చెప్పడం
  rationale: తెలుగులో విడిగా ‘ఏ రోజుల్లోనైతే’ అనడం భారంగా ఉంటుంది; ‘రోజులు వస్తాయి’తో విధ్వంస వాక్యాన్ని కలపడం అదే కాలసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἀφεθήσεται
  choice: మిగలకుండా
  rationale: ఈ నిర్మాణ సందర్భంలో ἀφίημι యొక్క భావం ‘వదిలివేయబడదు/మిగలదు.’ తెలుగు సంపూర్ణ విధ్వంస నుడికారంలో ‘మిగలకుండా’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: λίθος ἐπὶ λίθῳ
  choice: ఒక రాయి మీద మరో రాయి
  rationale: రాతి నిర్మాణం పూర్తిగా నాశనమవుతుందనే నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ὃς οὐ καταλυθήσεται
  choice: అంతా కూల్చివేయబడే
  rationale: καταλύω ఇక్కడ నిర్మాణాన్ని విప్పి పడగొట్టడం లేదా కూల్చివేయడం అనే అర్థం ఇస్తుంది. ‘అంతా’ సంబంధ వాక్యంలోని సంపూర్ణతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆలయ నిర్మాణాల గురించి యేసు చేసిన ప్రవచనపు పరిధి, బలం
  choice: కనిపిస్తున్న నిర్మాణాలు పూర్తిగా కూల్చివేయబడతాయని స్పష్టమైన భౌతిక విధ్వంస ప్రవచనంగా అనువదించడం
  alternative: దీనిని ప్రధానంగా ప్రతీకాత్మక తీర్పుగా లేదా ఒక నిర్దిష్ట అంత్యకాల సిద్ధాంతానికి కట్టిపెట్టడం
  rationale: గ్రీకు పాఠం రాయి మీద రాయి మిగలని నిర్మాణ విధ్వంసాన్ని స్పష్టంగా చెబుతుంది; అయితే ఈ వచనం చెప్పని కాలక్రమ లేదా సిద్ధాంత వివరాలను అనువాదం చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘రాయి మీద మరో రాయి మిగలకుండా’ అనే సహజ తెలుగు నుడికారాన్ని ఉపయోగించి గ్రీకు వాక్యంలోని సంపూర్ణ విధ్వంస బలాన్ని నిలిపాం; నిర్దిష్ట అంత్యకాల సిద్ధాంతాన్ని చేర్చలేదు.
