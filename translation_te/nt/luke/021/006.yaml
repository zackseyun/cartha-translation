- from: “మీరు చూస్తున్న ఈ కట్టడాల విషయానికొస్తే,[a] వీటిలో ఒక రాయి మీద మరో రాయి మిగలకుండా అంతా కూల్చివేయబడే రోజులు వస్తాయి.”[b]
  to: “మీరు చూస్తున్న ఈ కట్టడాల విషయానికొస్తే,[a] ఒక రాయి మీద మరో రాయి కూడా మిగలకుండా అవి కూల్చివేయబడే రోజులు వస్తాయి.”[b]
  rationale: The revision corrects the temporal syntax of ἐν αἷς without changing the passage’s meaning. “అవి కూల్చివేయబడే రోజులు వస్తాయి” naturally renders ‘days will come in which they will be torn down,’ while “ఒక రాయి మీద మరో రాయి కూడా మిగలకుండా” retains the emphatic totality of the Greek idiom. Footnote a continues to identify the contextual nature of ‘కట్టడాలు’; footnote b retains the literal-form clarification.
