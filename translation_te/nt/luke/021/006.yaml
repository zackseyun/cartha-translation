  terminology: “కట్టడాలు,” “రాయి,” “మిగలకుండా,” and “కూల్చివేయబడే” are appropriate modern-standard Telugu terms for the contextual structures, stones, remaining, and demolition. The contextual addition “కట్టడాలు” remains appropriately disclosed in footnote a.
