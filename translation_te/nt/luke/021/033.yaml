  terminology: “ఆకాశం,” “భూమి,” and “నా మాటలు” are accurate, familiar, and appropriate terms. “గతించిపోవు” retains the established biblical-register sense of passing away while remaining understandable to modern readers. The footnote gives a legitimate natural alternative for the emphatic negation and correctly identifies its Greek basis.
