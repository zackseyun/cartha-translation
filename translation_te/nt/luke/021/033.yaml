source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: te
  text: ఆకాశమూ భూమీ గతించిపోతాయి; కానీ నా మాటలు ఎంతమాత్రమూ గతించిపోవు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా మాటలు ఎన్నటికీ గతించిపోవు.” గ్రీకులో ఇక్కడ బలమైన నిరాకరణ (οὐ μή) ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: ఆకాశం
  rationale: γῆతో కలిసిన ‘ఆకాశం–భూమి’ జంట సృష్టి సమస్తాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆకాశం’ సహజమైన, విస్తృతార్థక పదం.
- source_word: ἡ γῆ
  choice: భూమి
  rationale: ఇక్కడ ఒక ప్రత్యేక దేశం లేదా ప్రాంతం కాక, ఆకాశంతో జతగా భూమండలాన్ని సూచిస్తుంది.
- source_word: παρελεύσονται
  choice: గతించిపోతాయి / గతించిపోవు
  rationale: παρέρχομαι ఇక్కడ అంతరించిపోవడం లేదా ముగిసిపోవడం అనే భావాన్ని ఇస్తుంది. రెండు అర్ధవాక్యాల్లోనూ ఒకే తెలుగు క్రియను వాడి మూలంలోని అలంకార సమాంతరతను నిలిపాం.
- source_word: δὲ
  choice: కానీ
  rationale: సృష్టి గతించిపోవడానికీ యేసు మాటలు నిలిచివుండడానికీ మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: οἱ λόγοι μου
  choice: నా మాటలు
  rationale: ఇది యేసు పలికిన మాటలను సూచిస్తుంది; ‘నా మాటలు’ నేరుగా, సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: οὐ μὴ
  choice: ఎంతమాత్రమూ … పోవు
  rationale: భవిష్యత్ క్రియతో వచ్చిన οὐ μή బలమైన నిరాకరణ. ‘ఎంతమాత్రమూ’ దాని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యేసు మాటల శాశ్వత స్థిరత్వాన్ని తెలిపే వాక్య బలం
  choice: ‘ఎంతమాత్రమూ గతించిపోవు’ అని బలమైన నిరాకరణను స్పష్టంగా నిలిపాం.
  alternative: ‘ఎన్నటికీ గతించిపోవు’ లేదా సాధారణంగా ‘గతించిపోవు’
  rationale: గ్రీకు οὐ μή సాధారణ నిరాకరణకన్నా బలమైనది. ‘ఎంతమాత్రమూ’ దాని నిశ్చయాత్మక బలాన్ని చూపుతుంది; అదే సమయంలో మూలం చెప్పినదానికంటే అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘ఆకాశమూ భూమీ’లోని జత నిర్మాణం మూలంలోని విశ్వవ్యాప్త భావాన్ని, ‘గతించిపోతాయి/గతించిపోవు’ పునరుక్తి మూలంలోని వాక్య సమాంతరతను కాపాడుతుంది.
