  source_fidelity: The Telugu accurately renders the cosmic pair οὐρανὸς καὶ ἡ γῆ as “ఆకాశమూ భూమీ,” retains the future sense of παρελεύσονται in both clauses, and preserves the deliberate verbal parallel with “గతించిపోతాయి/గతించిపోవు.” “కానీ” appropriately conveys the contrast marked by δέ. The emphatic οὐ μή is faithfully represented by “ఎంతమాత్రమూ … పోవు,” without adding interpretation.
