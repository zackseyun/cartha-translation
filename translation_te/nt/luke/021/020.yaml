id: LUK.21.20
reference: Luke 21:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: te
  text: అయితే యెరూషలేము సైన్యాలచేత చుట్టుముట్టబడి ఉండడాన్ని మీరు చూసినప్పుడు,[a] అప్పుడు దాని నిర్జనత[b] సమీపించిందని తెలుసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సైనిక శిబిరాలచేత చుట్టుముట్టబడి ఉండడం.’ గ్రీకు పదం శిబిరాలను లేదా శిబిరం వేసిన సైన్యాలను సూచించగలదు; ఇక్కడ యెరూషలేమును ముట్టడిస్తున్న సైనిక బలగాలే ఉద్దేశం.
    reason: lexical_alternative
  - marker: b
    text: ‘నిర్జనత’ అనే మాట ప్రవచన గ్రంథాల్లోని తీర్పు భాషను ప్రతిధ్వనిస్తుంది. మత్తయి 24:15; మార్కు 13:14లోని సంబంధిత మాటలను పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: అయితే ... చూసినప్పుడు
  rationale: δὲ సూచించే స్వల్ప భావమార్పును ‘అయితే’ తెలియజేస్తుంది; ὅταν తో కూడిన భవిష్యత్ సందర్భాన్ని సహజమైన తెలుగు ‘చూసినప్పుడు’ వ్యక్తపరుస్తుంది.
- source_word: ἴδητε
  choice: మీరు చూసినప్పుడు
  rationale: ὁράω క్రియ యొక్క ప్రత్యక్షంగా చూడడం అనే సాధారణ భావాన్ని, భవిష్యత్ సూచన సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: సైన్యాలచేత చుట్టుముట్టబడి ఉండడం
  rationale: వర్తమాన కర్మణి కృదంతం నగరం ఆ సమయంలో చుట్టుముట్టబడిన స్థితిలో ఉండడాన్ని సూచిస్తుంది. στρατόπεδα శిబిరాలు లేదా శిబిరం వేసిన సైన్యాలను సూచించగలదు; ముట్టడి సందర్భంలో ‘సైన్యాలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపం.
- source_word: τότε γνῶτε
  choice: తెలుసుకోండి
  rationale: τότε యొక్క కాలసంబంధ ఫలితం తెలుగులో ‘చూసినప్పుడు ... తెలుసుకోండి’ నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది; ఆజ్ఞార్థక బలాన్ని ‘తెలుసుకోండి’ నిలుపుతుంది.
- source_word: ἤγγικεν
  choice: సమీపించింది
  rationale: పరిపూర్ణ కాలరూపం చేరువై ఇప్పుడు సమీపంలో ఉన్న స్థితిని సూచిస్తుంది; ‘సమీపించింది’ ఆ ఫలితస్థితిని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: దాని నిర్జనత
  rationale: ἐρήμωσις లోని నిర్జనమైపోవడం, వినాశకర తీర్పు అనే ప్రవచనాత్మక ప్రతిధ్వనిని ‘నిర్జనత’ నిలుపుతుంది. αὐτῆς యెరూషలేమును సూచిస్తున్నందున తెలుగులో సహజమైన ‘దాని’ వాడబడింది.
theological_decisions:
- issue: యెరూషలేముపై రాబోయే తీర్పు యొక్క స్వరూపం
  choice: ἐρήμωσις ను ‘నిర్జనత’గా అనువదించి, నగరానికి రాబోయే విపత్తును మాత్రమే ప్రధాన పాఠ్యంలో పేర్కొనడం.
  alternative: ‘నాశనం’గా అనువదించడం లేదా ‘నిర్జనకరమైన హేయవస్తువు’తో సంబంధాన్ని ప్రధాన పాఠ్యంలోనే స్పష్టీకరించడం.
  rationale: ఈ వచనం సైన్యాలు యెరూషలేమును చుట్టుముట్టినప్పుడు దాని నిర్జనత సమీపించిందని చెబుతుంది. ‘నిర్జనత’ మూలపదపు ప్రవచనాత్మక బరువును నిలుపుతుంది; వచనం చెప్పని నిర్దిష్ట అంత్యకాల వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘సైన్యాలు’ ముట్టడి దృశ్యాన్ని సహజంగా తెలియజేస్తుంది; ‘నిర్జనత’ మూలంలోని ప్రవచనాత్మక భావాన్ని అతిగా వ్యాఖ్యానించకుండా కాపాడుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
