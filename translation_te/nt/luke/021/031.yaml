id: LUK.21.31
reference: Luke 21:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: te
  text: అలాగే మీరు కూడా, ఈ సంగతులు జరుగుతున్నట్లు[a] చూసినప్పుడు, దేవుని రాజ్యం[b] సమీపంలో ఉందని తెలుసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ సంగతులు సంభవిస్తున్నాయని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని పరిపాలన.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: అలాగే మీరు కూడా
  rationale: ముందున్న ఉపమానాన్ని శిష్యులకు అన్వయించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; స్పష్టంగా ఉన్న ὑμεῖς లోని స్వల్ప ఉద్ఘాటనను ‘మీరు కూడా’ నిలుపుతుంది.
- source_word: ὅταν ἴδητε
  choice: చూసినప్పుడు
  rationale: భవిష్యత్తులో సంభవించే సందర్భాన్ని సూచించే ὅταν మరియు aorist subjunctive భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ταῦτα γινόμενα
  choice: ఈ సంగతులు జరుగుతున్నట్టు
  rationale: ταῦτα గత వచనాల్లో చెప్పిన సూచనలను తిరిగి సూచిస్తుంది; γινόμενα వాటి సంభవాన్ని తెలియజేస్తుంది. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: γινώσκετε
  choice: తెలుసుకోండి
  rationale: ఇది ఆజ్ఞార్థక రూపం; కనిపించే సూచనల ప్రాముఖ్యతను గుర్తించి తెలుసుకోవాలనే ప్రత్యక్ష ఆదేశాన్ని నిలుపుతుంది.
- source_word: ἐγγύς ἐστιν
  choice: సమీపంలో ఉంది
  rationale: కాలపరమైన లేదా రూపకాలంకారమైన సమీపతను మరింత నిర్దిష్టంగా వ్యాఖ్యానించకుండా మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ‘రాజ్యం’ అనే పదం రాజ్యాధికారం మరియు రాజ్యపరిధి అనే రెండు భావసాధ్యతలనూ నిలుపుతుంది; తెలుగు బైబిలు భాషలోనూ ఇది సహజమైన, సుపరిచితమైన పదబంధం.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో ‘దేవుని రాజ్యం’ అనే పదబంధం యొక్క అర్థం
  choice: దేవుని రాజ్యం
  alternative: దేవుని పరిపాలన
  rationale: ఇక్కడ రాజ్యం ప్రత్యక్షమవడం, సంపూర్ణం కావడం లేదా దేవుని రాజాధికారం అమలవడం—వీటిలో ఏ ఒక్క భావానికీ వచనాన్ని పరిమితం చేయకుండా మూలంలోని ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. వాక్య నిర్మాణం సహజంగా ఉండేలా చేస్తూనే మూలంలోని అన్వయం, ఆజ్ఞ, సమీపతలను నిలుపుకున్నాం.
