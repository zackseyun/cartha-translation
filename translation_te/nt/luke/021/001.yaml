  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: te
  text: ఆయన పైకి చూసి, ధనవంతులు తమ కానుకలను ఖజానాలో[a] వేయడం చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం ఆలయ ఖజానా ప్రాంతాన్నిగానీ, అక్కడ కానుకలు వేసే పాత్రనుగానీ సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: పైకి చూసి
  rationale: పైవైపు చూపు తిప్పిన కథన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప కథన సంధాయకం; తెలుగు వాక్యక్రమమే కొనసాగింపును సహజంగా తెలియజేస్తుంది, ‘అప్పుడు’ అని చేరిస్తే కాలక్రమ భావం అనవసరంగా బలపడవచ్చు.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω యొక్క సాధారణ దృష్టిగోచర అర్థాన్ని అదనపు వ్యాఖ్యానం లేకుండా ప్రతిబింబిస్తుంది.
- source_word: τοὺς βάλλοντας
  choice: వేయడం
  rationale: βάλλωకు అక్షరార్థంగా ‘విసరడం’ ఉన్నా, కానుకలు సమర్పించే సందర్భంలో ‘వేయడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: ఆలయ కానుకల పెట్టెల్లో
  rationale: γαζοφυλάκιον ఆలయ ఖజానా ప్రాంతాన్నిగానీ కానుకలు వేసే పాత్రలనుగానీ సూచించవచ్చు. తరువాతి వచనంలోని చిన్న నాణేలు వేసే చర్యకు అనుగుణంగా పెట్టెల భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చినా, పదంలోని విస్తృత సూచనను పాదటిప్పణిలో నిలిపాం.
- source_word: τὰ δῶρα αὐτῶν
  choice: తమ కానుకలను
  rationale: δῶρα యొక్క ‘కానుకలు’ అనే సాధారణ అర్థాన్ని కాపాడుతూ, ఈ సందర్భంలోని సమర్పణ భావానికీ సహజంగా సరిపోతుంది.
- source_word: πλουσίους
  choice: ధనవంతులు
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
