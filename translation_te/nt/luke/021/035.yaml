id: LUK.21.35
reference: Luke 21:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: te
  text: ఉచ్చులా[a]. ఎందుకంటే అది భూమి అంతటా నివసించే వారందరి మీదికి వస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వలలా.”
    reason: lexical_alternative
  - marker: b
    text: “భూమి” అనే గ్రీకు పదానికి “దేశం” అనే అర్థం కూడా రావచ్చు; అందువల్ల “దేశమంతటా నివసించే వారందరి మీదికి” అని కూడా అనువదించవచ్చు. అయితే ఇక్కడి సందర్భానికి “భూమి అంతటా” బాగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: ఉచ్చులా
  rationale: παγίς అంటే పట్టుకునే ఉచ్చు లేదా వల. ఆధునిక తెలుగులో ‘ఉచ్చు’ ఈ రూపకంలోని ఆకస్మికతను, తప్పించుకోలేని ప్రమాదాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπεισελεύσεται
  choice: అది ... మీదికి వస్తుంది
  rationale: ఈ భవిష్యత్ క్రియ ఏదో ఒకటి ప్రజల మీదికి రావడం లేదా వారిని పట్టుకోవడం సూచిస్తుంది. మునుపటి వచనంలోని ‘ఆ రోజు’ అంతర్లీన కర్త; దానిని స్పష్టంగా వ్యాఖ్యానించకుండా ‘అది’ అని ఉంచాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న హెచ్చరికకు కారణాన్ని తెలియజేస్తుంది; ‘ఎందుకంటే’ ఆధునిక తెలుగులో దాని అనుసంధాన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐπὶ πάντας
  choice: వారందరి మీదికి
  rationale: ἐπί + ద్వితీయా విభక్తి ఇక్కడ వారిపైకి రావడాన్ని సూచిస్తుంది. ‘మీదికి’ క్రియలోని దిశాభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: τοὺς καθημένους
  choice: నివసించే వారు
  rationale: κάθημαι అక్షరార్థంగా ‘కూర్చోవడం’ అయినా, ఈ భూముఖంపై ఉండేవారిని సూచించే ప్రయోగంలో ‘నివసించడం’ అనే భావం సహజమైనది.
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: భూమి అంతటా
  rationale: అక్షరార్థంలోని ‘భూమి ముఖంపై’ అనే సెమిటిక్ ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా ‘భూమి అంతటా’ అని అందించాం; ఇది సమస్త భూమి మీద వ్యాప్తిని తెలియజేస్తుంది.
theological_decisions:
- issue: అంత్యకాల హెచ్చరికలో γῆ పద పరిధి
  choice: భూమి అంతటా
  alternative: దేశమంతటా
  rationale: γῆ అనే పదానికి ‘భూమి’ లేదా ‘దేశం’ అనే రెండు అర్థాలు సాధ్యమే. అయితే ‘అందరూ’ మరియు ‘దాని ముఖంపై’ అనే విశాల ప్రయోగం ఇక్కడ విశ్వవ్యాప్త పరిధిని బలపరుస్తుంది. అయినప్పటికీ పదంలోని నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: ἐπεισελεύσεται క్రియకు అంతర్లీన కర్త
  choice: అది
  alternative: ఆ రోజు
  rationale: సమీప సందర్భంలో కర్త ‘ఆ రోజు’ అయినప్పటికీ ఈ వచనభాగంలో అది ప్రత్యక్షంగా పునరుక్తం కాలేదు. అందువల్ల ‘అది’ మూలంలోని సూచనాత్మక స్వభావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడాం. ‘భూమి ముఖంపై’ అనే అక్షరానువాదం కంటే ‘భూమి అంతటా’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
