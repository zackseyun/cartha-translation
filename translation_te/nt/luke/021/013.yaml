reference: Luke 21:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: te
  text: ఇది మీకు సాక్ష్యంగా పరిణమిస్తుంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇది మీరు సాక్ష్యమిచ్చేందుకు అవకాశంగా మారుతుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβήσεται
  choice: పరిణమిస్తుంది
  rationale: భవిష్యత్ ఫలితాన్ని సూచించే ఈ క్రియను సాధారణంగా ఏదో జరగడం అని కాకుండా, ముందుగా చెప్పిన సంఘటనలు ఒక నిర్దిష్ట ఫలితానికి దారితీయడం అనే భావంతో అనువదించింది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ఈ సందర్భంలో చతుర్థీ విభక్తి శిష్యులకు కలిగే ఫలితాన్ని సూచిస్తుంది; ‘మీకు’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς
  choice: గా
  rationale: εἰς ఇక్కడ ఫలితం లేదా ఉద్దేశాన్ని సూచించగలదు; ‘సాక్ష్యంగా’ అనే రూపం ఆ విస్తృతిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: μαρτύριον
  choice: సాక్ష్యం
  rationale: ఈ నామవాచకం సాక్ష్యమివ్వడం, సాక్ష్యవాక్యం లేదా ఆధారం అనే న్యాయసంబంధమైన, బహిరంగమైన భావాలను కలిగి ఉంది. ‘సాక్ష్యం’ ఈ అస్పష్టతను అవసరానికి మించి పరిష్కరించదు.
theological_decisions:
- issue: అధికారుల ఎదుట శిష్యులు అనుభవించే హింస యొక్క భావం
  choice: ఆ సంఘటనలు శిష్యులకు సాక్ష్యంగా పరిణమిస్తాయి.
  alternative: ఆ సంఘటనలు శిష్యులు సాక్ష్యమిచ్చే అవకాశంగా మారతాయి; లేదా వారి విరోధులకు వ్యతిరేకంగా ఆధారమవుతాయి.
  rationale: లూకా సందర్భంలో అరెస్టు చేసి పాలకుల ఎదుటికి తీసుకెళ్లడం శిష్యులు యేసు గురించి సాక్ష్యమిచ్చే సందర్భాన్ని ప్రధానంగా సూచిస్తుంది. అయితే గ్రీకు పదబంధం సాక్ష్యం ఎవరి మీద లేదా ఏ విధంగా పనిచేస్తుందో పూర్తిగా నిర్దిష్టం చేయదు; ప్రధాన పాఠం ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘పరిణమిస్తుంది’ ఫలిత భావాన్ని తెలియజేస్తుంది; ‘సాక్ష్యం’ న్యాయపరమైన ఆధారం మరియు సాక్ష్యమివ్వడం అనే రెండు సాధ్య భావాలకు చోటిస్తుంది.
