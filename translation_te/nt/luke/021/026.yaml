revisions:
- from: నివసించే లోకంపై[a] రాబోయే వాటి గురించి భయంతోనూ ఎదురుచూపుతోనూ ప్రజలు సొమ్మసిల్లిపోతారు; ఎందుకంటే ఆకాశాల శక్తులు[b] కదిలించబడతాయి.
