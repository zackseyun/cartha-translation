review_pass:
  verdict: revise
  source_fidelity: The draft conveys the causal sequence and retains the broad apocalyptic ambiguity of δυνάμεις τῶν οὐρανῶν. However, ‘నివసించే లోకం’ is not idiomatic Telugu for οἰκουμένη, and ‘కదిలించబడతాయి’ can suggest an explicit external agent (‘will be caused to move’) rather than the Greek passive’s straightforward ‘will be shaken.’
  naturalness: The proposed wording is modern, clear Telugu. ‘ప్రజలు నివసించే ప్రపంచం’ naturally expresses ‘the inhabited world,’ and ‘కదిలిపోతాయి’ is a natural rendering of cosmic shaking imagery without unnecessary causative force.
  terminology: ‘సొమ్మసిల్లిపోతారు’ appropriately communicates ἀποψυχόντων without narrowing it to literal death. ‘ఆకాశాల శక్తులు’ preserves the source expression’s ambiguity; the footnote alternatives have been adjusted so that ‘పరలోక’ does not introduce an unwarranted otherworldly interpretation.
  issues:
  - severity: medium
    issue: ‘నివసించే లోకం’ is an unnatural rendering of οἰκουμένη.
    rationale: It can sound as though the world itself lives. The Greek denotes the inhabited human world; ‘ప్రజలు నివసించే ప్రపంచం’ conveys this naturally.
  - severity: medium
    issue: ‘కదిలించబడతాయి’ is overly causative in Telugu.
    rationale: Although σαλευθήσονται is passive, Telugu ‘కదిలించబడతాయి’ foregrounds an unnamed agent causing motion. ‘కదిలిపోతాయి’ naturally communicates ‘will be shaken’ in this cosmic context.
  - severity: low
    issue: Footnote b offers ‘పరలోక శక్తులు.’
    rationale: ‘పరలోక’ can suggest a distinct doctrinally loaded otherworld and is not a close alternative for τῶν οὐρανῶν. A more neutral alternative is preferable.
  revised_text: ప్రజలు నివసించే ప్రపంచంపై[a] రాబోయే సంగతుల నిరీక్షణతోను భయంతోను ప్రజలు సొమ్మసిల్లిపోతారు; ఎందుకంటే ఆకాశాల శక్తులు[b] కదిలిపోతాయి.
