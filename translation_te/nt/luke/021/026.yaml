    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆకాశ శక్తులు’ లేదా ‘ఆకాశంలోని శక్తులు.’ ఈ పదబంధం విశాలార్థంలో విశ్వ సంబంధమైన లేదా ఆకాశ సంబంధమైన శక్తులను సూచించవచ్చు.
