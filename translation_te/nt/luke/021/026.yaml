id: LUK.21.26
reference: Luke 21:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: te
  text: ప్రజలు నివసించే ప్రపంచంపై[a] రాబోయే సంగతుల నిరీక్షణతోను భయంతోను ప్రజలు సొమ్మసిల్లిపోతారు; ఎందుకంటే ఆకాశాల శక్తులు[b] కదిలిపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లోకంపై’ లేదా ‘భూమిపై’; గ్రీకులో ‘ప్రజలు నివసించే ప్రపంచం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆకాశ శక్తులు’ లేదా ‘ఆకాశంలోని శక్తులు.’ ఈ పదబంధం విశాలార్థంలో విశ్వ సంబంధమైన లేదా ఆకాశ సంబంధమైన శక్తులను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: సొమ్మసిల్లిపోతారు
  rationale: భయంతో శక్తి కోల్పోయి కూలిపోవడం లేదా స్పృహ తప్పడం అనే శారీరక-మానసిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀνθρώπων
  choice: ప్రజలు
  rationale: ఇది పురుషులను మాత్రమే కాక సాధారణంగా మనుషులను సూచిస్తుంది; అందువల్ల సమగ్రార్థకమైన ‘ప్రజలు’ సరిపోతుంది.
- source_word: ἀπὸ φόβου
  choice: భయంతో
  rationale: ἀπό ఇక్కడ కారణాన్ని సూచిస్తుంది; ‘భయంతో’ సంక్షిప్తంగా, సహజంగా ఆ కారణార్థాన్ని అందిస్తుంది.
- source_word: προσδοκίας
  choice: ఎదురుచూపుతో
  rationale: రాబోయేదాని కోసం నిరీక్షించడం అనే మూలార్థాన్ని నిలుపుతుంది; సందర్భమే దానికి ఆందోళనకర స్వభావాన్ని ఇస్తుంది కాబట్టి ‘భయాందోళన’ వంటి అదనపు భావాన్ని చేర్చలేదు.
- source_word: τῶν ἐπερχομένων
  choice: రాబోయే వాటి గురించి
  rationale: నపుంసక బహువచన కృదంతం సూచించే రాబోయే సంఘటనల బహువచన భావాన్ని నిలుపుతుంది.
- source_word: τῇ οἰκουμένῃ
  choice: నివసించే లోకంపై
  rationale: οἰκουμένη భౌతిక భూమిని మాత్రమే కాక మనుషులు నివసించే ప్రపంచాన్ని సూచిస్తుంది; ఈ భావవ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: αἱ ... δυνάμεις τῶν οὐρανῶν
  choice: ఆకాశాల శక్తులు
  rationale: ఖగోళ శక్తులు, ఆకాశ సంబంధమైన శక్తులు లేదా విశాలమైన విశ్వ శక్తులు అనే సాధ్యార్థాలను సంకుచితం చేయకుండా గ్రీకు నిర్మాణానికి దగ్గరగా ఉంటుంది.
- source_word: σαλευθήσονται
  choice: కదిలించబడతాయి
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, విశ్వ కల్లోలాన్ని సూచించే ప్రవచనాత్మక చిత్రణను అందిస్తుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో ‘ఆకాశాల శక్తులు’ అనే పదబంధం అర్థం
  choice: ‘ఆకాశాల శక్తులు’ అనే సందిగ్ధమైన విశ్వ సంబంధ వ్యక్తీకరణను నిలుపడం
  alternative: ‘ఆకాశ నక్షత్రాలు’ లేదా ‘దూతల శక్తులు’ అని నిర్దిష్టంగా అనువదించడం
  rationale: గ్రీకు పదబంధం ఖగోళ వస్తువులు, విశ్వ నిర్మాణాలు లేదా ఆకాశ సంబంధ శక్తులను సూచించవచ్చు. వాటిలో ఒక్కదానికే పరిమితం చేయకుండా మూలపాఠంలోని ఉద్దేశపూర్వక విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వాక్యంలోని అపోకలిప్టిక్ గంభీరతను నిలుపుతూ, ‘ఎదురుచూపు’ మరియు ‘ఆకాశాల శక్తులు’లో మూలంలోని భావసందిగ్ధతను పరిష్కరించకుండా ఉంచాం.
