source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: te
  text: వారు ఈ సంగతుల్లో దేనినీ గ్రహించలేదు; ఈ మాట[a] వారికి దాచబడి ఉంది[b], చెప్పబడుతున్న సంగతులు వారికి అర్థం కాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ వాక్యం’ లేదా ‘ఈ సందేశం.’
    reason: lexical_alternative
  - marker: b
    text: ‘దాచబడి ఉంది’ అనే కర్మణి రూపం దాన్ని ఎవరు లేదా ఏమి దాచారో చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: గ్రహించలేదు
  rationale: ఇక్కడ συνίημι యేసు ముందుగా చెప్పిన విషయాలను బుద్ధిపూర్వకంగా అర్థం చేసుకోవడాన్ని సూచిస్తుంది. ‘గ్రహించలేదు’ సహజమైన తెలుగులో ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὐδὲν τούτων
  choice: ఈ సంగతుల్లో ఏదీ
  rationale: τούτων ముందు చెప్పబడిన అనేక విషయాలను సూచిస్తుంది. ఈ అనువాదం ఆ బహువచన సూచనను నిలుపుతుంది.
- source_word: τὸ ῥῆμα τοῦτο
  choice: ఈ మాట
  rationale: ῥῆμα అనేది మాట, పలుకబడిన విషయం, లేదా సందేశం అనే అర్థాలను కలిగి ఉండవచ్చు. ‘ఈ మాట’ గ్రీకు రూపానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంటుంది.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: వారికి మరుగుచేయబడి ఉంది
  rationale: పరిపూర్ణ కర్మణి కృదంతంతో కూడిన నిర్మాణం, మరుగుచేయబడిన ఫలితస్థితిని తెలియజేస్తుంది. ఈ రూపం దాన్ని ఎవరు లేదా ఏమి మరుగుచేశారో పేర్కొనకుండా కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: ἐγίνωσκον
  choice: అర్థం కాలేదు
  rationale: ఇక్కడ γινώσκω పలుకబడుతున్న విషయాన్ని గుర్తించి అర్థం చేసుకోవడం అనే సందర్భార్థాన్ని కలిగి ఉంది. ‘అర్థం కాలేదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మొదటి క్రియకు వాడిన ‘గ్రహించలేదు’తో పదరూప వైవిధ్యాన్ని కూడా కొంతవరకు నిలుపుతుంది.
- source_word: τὰ λεγόμενα
  choice: చెప్పబడుతున్న సంగతులు
  rationale: వర్తమాన కర్మణి కృదంతం అప్పట్లో చెప్పబడుతున్న విషయాలను సూచిస్తుంది. ఈ అనువాదం దాని కొనసాగుతున్న కర్మణి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: శిష్యుల అవగాహనలేమి మరియు మాట మరుగుచేయబడటానికి కారణం
  choice: వారు అర్థం చేసుకోలేదనే మూడు అంచెల వర్ణనను నిలుపుతూ, మాటను ఎవరు లేదా ఏమి మరుగుచేశారో పేర్కొనలేదు.
  alternative: దేవుడే దాన్ని మరుగుచేశాడని స్పష్టీకరించడం, లేదా అది కేవలం వారి మానసిక అయోమయమేనని చెప్పడం.
  rationale: గ్రీకు కర్మణి నిర్మాణం కార్యసాధకుడిని పేర్కొనదు. కాబట్టి మూలపాఠంలోని ఉద్దేశపూర్వక అనిశ్చితిని, దైవిక చర్య మరియు మానవ అవగాహనలేమి మధ్యనున్న ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూడు సమాంతర వాక్యభాగాలు నిలుపబడ్డాయి; అయితే తెలుగులో చదవడానికి సులభంగా ఉండేందుకు మొదటి భాగం తరువాత పూర్ణవిరామం, రెండవ భాగం తరువాత అర్ధవిరామం వాడబడ్డాయి.
