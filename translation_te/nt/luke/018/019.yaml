id: LUK.18.19
reference: Luke 18:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: te
  text: 'అయితే యేసు అతనితో ఇలా అన్నాడు: “నన్ను మంచివాడని ఎందుకు అంటున్నావు? దేవుడు ఒక్కడే తప్ప, మంచివాడు ఎవరూ లేరు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δὲ సంభాషణలో తదుపరి ప్రతిస్పందనను పరిచయం చేస్తుంది. తెలుగులో ‘అప్పుడు’ సహజంగా ప్రవాహాన్ని చూపుతుంది; తప్పనిసరిగా విరోధార్థాన్ని రుద్దదు.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: యేసు ... ఇలా అన్నాడు
  rationale: λέγω అనే సాధారణ ‘చెప్పు/అను’ భావాన్ని నేరుగా నిలుపుతుంది. సందర్భం ప్రతిస్పందన అయినప్పటికీ ‘జవాబిచ్చాడు’ అని అదనంగా వ్యాఖ్యానించదు.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: గ్రీకులోని సర్వనామాన్ని సహజమైన తెలుగు ప్రయోగంతో స్పష్టంగా నిలుపుతుంది; ‘ఆ మనిషితో’ అనే వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: Τί
  choice: ఎందుకు
  rationale: τί అక్షరార్థంగా ‘ఏమి’ అయినా, τί με λέγεις ἀγαθόν అనే ప్రశ్నలో కారణాన్ని అడిగే భావం ఉంది; తెలుగులో ‘ఎందుకు’ సహజమైన సమానార్థకం.
- source_word: με λέγεις ἀγαθόν
  choice: నన్ను మంచివాడని ... అంటున్నావు
  rationale: వ్యక్తిని ఒక లక్షణంతో పిలిచే గ్రీకు నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: మంచివాడు
  rationale: రెండు సందర్భాల్లోనూ ఒకే పదాన్ని వాడి మూలంలోని పునరుక్తిని నిలుపుతుంది. ‘నైతికంగా మంచివాడు’ అని భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: οὐδεὶς
  choice: ఎవరూ లేరు
  rationale: సార్వత్రిక నిరాకరణను స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: దేవుడు ఒక్కడే తప్ప
  rationale: మినహాయింపు నిర్మాణాన్నీ εἷς ఇచ్చే ‘ఒక్కడే’ అనే ఉద్ఘాటననూ నిలుపుతుంది; తెలుగు వాక్యక్రమంలో సహజంగా ఉంటుంది.
theological_decisions:
- issue: యేసు ప్రశ్నలోని క్రీస్తుతత్వ సూచన
  choice: యేసు అడిగిన ప్రశ్నను నిరాకరణగానీ ప్రత్యక్ష దైవత్వ ప్రకటనగానీ విపులీకరించకుండా అనువదించడం
  alternative: యేసు తన మంచితనాన్ని నిరాకరిస్తున్నాడని లేదా ఈ మాటలతోనే తన దైవత్వాన్ని ప్రత్యక్షంగా ప్రకటిస్తున్నాడని స్పష్టీకరించే వ్యాఖ్యానాత్మక అనువాదం
  rationale: గ్రీకు వాక్యం ఈ రెండు సిద్ధాంతపరమైన నిర్ధారణల్లో ఏదీ ప్రత్యక్షంగా చెప్పదు. కాబట్టి దానిలోని నిజమైన క్రీస్తుతత్వ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిల్ వచన శైలిలో రూపొందించబడింది. మూలంలో అవసరం లేని చోట విరోధాన్ని బలపరచకుండా సంభాషణ ప్రవాహం సహజంగా ఉంచబడింది.
