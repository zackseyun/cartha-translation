revisions:
- from: 'అప్పుడు యేసు అతనితో ఇలా అన్నాడు: “నన్ను మంచివాడని ఎందుకు అంటున్నావు? దేవుడు ఒక్కడే తప్ప మంచివాడు ఎవరూ లేరు.”'
  to: 'అయితే యేసు అతనితో ఇలా అన్నాడు: “నన్ను మంచివాడని ఎందుకు అంటున్నావు? దేవుడు ఒక్కడే తప్ప, మంచివాడు ఎవరూ లేరు.”'
  rationale: Only the rendering of δέ has been adjusted from temporal 'అప్పుడు' to connective 'అయితే.' The revised text preserves the Greek wording, emphasis, and theological ambiguity, while remaining natural in modern standard Telugu.
  reviewer_model: gpt-5.6-terra
