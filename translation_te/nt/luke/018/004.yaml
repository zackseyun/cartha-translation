- from: 'కొంతకాలం వరకు అతనికి ఇష్టం లేదు. అయితే ఆ తర్వాత అతడు తనలో తాను ఇలా అనుకున్నాడు: ‘నేను దేవునికి భయపడను, ఏ మనిషినీ లెక్కచేయను; అయినా,'
