  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: te
  text: 'కొంతకాలం వరకు అతనికి ఇష్టం లేకపోయింది. అయితే ఆ తర్వాత అతడు తనలో తాను ఇలా అనుకున్నాడు: ‘నేను దేవునికి భయపడను, ఏ మనిషినీ లెక్కచేయను; అయినా,’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: అతనికి ఇష్టం లేదు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొంతకాలం కొనసాగిన అయిష్టతను సూచిస్తుంది. ‘ఇష్టం లేదు’ సంకల్ప సంబంధమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ χρόνον
  choice: కొంతకాలం వరకు
  rationale: ఈ పదబంధం నిర్దిష్టంగా చెప్పని కాలవ్యవధిని సూచిస్తుంది; తెలుగు కథనశైలిలో ఇది సహజంగా ఉంటుంది.
- source_word: μετὰ ταῦτα δὲ
  choice: అయితే ఆ తర్వాత
  rationale: కాలక్రమంలో తదుపరి మలుపుతో పాటు స్వల్ప వ్యతిరేకతను కూడా నిలుపుతుంది.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: తనలో తాను ఇలా అనుకున్నాడు
  rationale: అంతరంగ సంభాషణను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, తనతో తాను చెప్పుకున్న భావాన్ని నిలుపుతుంది.
- source_word: Εἰ καὶ
  choice: … అయినా
  rationale: ఇక్కడ εἰ καὶ concessive భావాన్ని ఇస్తుంది. తెలుగు వాక్య నిర్మాణంలో ఒప్పుకోలు తెలిపే రెండు వాక్యాల అనంతరం ‘అయినా’ ఉంచడం సహజం; తదుపరి వచనంతో వాక్యం కొనసాగుతుంది.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: నేను దేవునికి భయపడను
  rationale: దేవునిపట్ల భయం లేదా భక్తిపూర్వక గౌరవం అనే మూలపద పరిధిని ‘భయపడను’ నేరుగా నిలుపుతుంది.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: ఏ మనిషినీ లెక్కచేయను
  rationale: ἐντρέπομαι ఇక్కడ మనుషుల పట్ల గౌరవం లేదా ఖాతరు చూపడాన్ని సూచిస్తుంది. ‘లెక్కచేయను’ న్యాయాధిపతి నిర్లక్ష్య ధోరణిని సహజంగా తెలియజేస్తుంది; ‘ఏ మనిషినీ’ ఏ ఒక్క వ్యక్తినీ అనే సాధారణ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἄνθρωπον అనే ఏకవచన సాధారణ నామం
  choice: ఏ మనిషినీ
  alternative: ఎవరినీ
  rationale: గ్రీకు పదంలోని మానవ వ్యక్తి అనే స్పష్టతను ఉంచుతూ, సందర్భంలో ‘ఏ ఒక్క మనిషినీ’ అనే సాధారణ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- issue: φοβοῦμαι యొక్క భయం/భక్తిగౌరవం భావపరిధి
  choice: దేవునికి భయపడను
  alternative: దేవుణ్ణి గౌరవించను
  rationale: మూలంలోని ‘భయపడటం’ అనే రూపకాన్ని, దాని నైతిక-మతపరమైన ఉద్వేగంతో సహా, పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన కథనశైలి. వచనం 5వ వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
