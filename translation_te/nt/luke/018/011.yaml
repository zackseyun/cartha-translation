id: LUK.18.11
reference: Luke 18:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: te
  text: 'ఆ పరిసయ్యుడు ఒంటరిగా నిలబడి, ఇలా ప్రార్థిస్తూ ఉన్నాడు[a]: ‘దేవా, నేను మిగతా మనుషుల్లా—దోచుకునేవారిలా, అన్యాయం చేసేవారిలా, వ్యభిచారుల్లా—లేదా ఈ సుంకరివాడిలా కూడా లేనందుకు నీకు కృతజ్ఞతలు చెబుతున్నాను.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిలబడి, తనలో తాను ఇలా ప్రార్థిస్తూ ఉన్నాడు.” πρὸς ἑαυτόν అనే గ్రీకు పదబంధం అతడు ఇతరులకు వేరుగా నిలబడ్డాడని గానీ, వ్యంగ్యార్థంలో అతని ప్రార్థన తనవైపే మళ్లిందని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: నిలబడి
  rationale: ἵστημι క్రియ యొక్క భూతకాల కృదంత రూపం పరిసయ్యుని భంగిమను, ప్రధాన క్రియకు ముందున్న నేపథ్య చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς ἑαυτὸν
  choice: ఒంటరిగా
  rationale: ఈ పదబంధానికి స్థలపరంగా ‘తనంతట తాను/వేరుగా’ అనే అర్థమూ, ప్రతిబింబార్థకంగా ‘తనలో తాను/తనకే’ అనే అర్థమూ సాధ్యం. ప్రధాన పాఠ్యంలో స్థలపరమైన అర్థాన్ని సహజంగా ఇచ్చి, మరొక సాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: ταῦτα
  choice: ఇలా
  rationale: తరువాత నేరుగా వచ్చే ప్రార్థన విషయాన్ని ఆధునిక తెలుగులో సహజంగా పరిచయం చేస్తుంది; గ్రీకు బహువచన సూచన యొక్క భావం నిలుస్తుంది.
- source_word: προσηύχετο
  choice: ప్రార్థిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్య భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: εὐχαριστῶ σοι
  choice: నీకు కృతజ్ఞతలు చెబుతున్నాను
  rationale: దత్తివాచక సర్వనామంతో ఉన్న గ్రీకు క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: మిగతా మనుషుల్లా
  rationale: λοιποί లోని ‘మిగతావారు’ అనే భావాన్ని, ἄνθρωποι లోని సాధారణ మానవ సూచనను సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ἅρπαγες
  choice: దోచుకునేవారు
  rationale: ἅρπαξ సూచించే అత్యాశతో ఇతరులది లాక్కోవడం లేదా దోపిడీ చేయడం అనే విస్తృత భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ఇస్తుంది.
- source_word: ἄδικοι
  choice: అన్యాయం చేసేవారు
  rationale: ἄδικος యొక్క నైతికంగా అన్యాయమైన ప్రవర్తనను సహజ తెలుగులో తెలియజేస్తుంది; కేవలం న్యాయస్థాన సంబంధమైన భావానికి పరిమితం చేయదు.
- source_word: μοιχοί
  choice: వ్యభిచారులు
  rationale: వివాహ బంధాన్ని అతిక్రమించే వారిని సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: లేదా ఈ సుంకరివాడిలా కూడా
  rationale: ἢ καὶ లోని తీవ్రతను ‘కూడా’ నిలుపుతుంది; τελώνης కు చారిత్రక సందర్భానికి తగిన ‘సుంకరివాడు’ వాడబడింది.
theological_decisions:
- issue: πρὸς ἑαυτόν అనే పదబంధం పరిసయ్యుని ప్రార్థనలో ఇచ్చే భావం
  choice: ప్రధాన పాఠ్యంలో స్థలపరంగా ‘ఒంటరిగా’
  alternative: ‘నిలబడి, తనలో తాను ఇలా ప్రార్థిస్తూ ఉన్నాడు’ లేదా వ్యంగ్య సూచనతో ‘తనకే ఇలా ప్రార్థిస్తున్నాడు’
  rationale: గ్రీకు నిర్మాణం అతడు ఇతరులకు వేరుగా నిలబడ్డాడని సూచించవచ్చు; అలాగే ప్రార్థన దేవునికన్నా తన చుట్టూనే తిరుగుతున్నదనే వ్యంగ్య భావాన్నీ అనుమతించవచ్చు. ప్రధాన పాఠ్యంలో బలమైన తీర్పును చొప్పించకుండా స్థలపరమైన అర్థాన్ని ఇచ్చి, నిజమైన అస్పష్టతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘పరిసయ్యుడు,’ ‘సుంకరివాడు,’ ‘వ్యభిచారులు’ వంటి బైబిలు సందర్భానికి స్థిరపడిన పదాలను ఉంచి, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా తీర్చిదిద్దాం. గ్రీకు వాక్యంలోని ఆత్మసంతృప్తి, తృణీకార స్వరం వివరణ జోడించకుండా పోలికల క్రమం ద్వారానే వ్యక్తమవుతుంది.
