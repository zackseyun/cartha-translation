id: LUK.18.43
reference: Luke 18:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: te
  text: వెంటనే అతనికి చూపు వచ్చింది[a]. అతడు దేవుణ్ణి మహిమపరుస్తూ యేసును అనుసరించాడు. ప్రజలందరూ అది చూసి దేవుణ్ణి స్తుతించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతడు చూపు పొందాడు’; గ్రీకు క్రియకు ‘మళ్లీ చూశాడు’ లేదా ‘చూపు తిరిగి పొందాడు’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా జరిగిన కార్యాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνέβλεψεν
  choice: అతనికి చూపు వచ్చింది
  rationale: స్వస్థత సందర్భంలో చూపు పొందడాన్ని సహజంగా వ్యక్తపరుస్తుంది; అతనికి ఇంతకుముందు చూపు ఉండేదని అనవసరంగా నిర్ధారించదు.
- source_word: ἠκολούθει
  choice: అనుసరించాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపంలో కొనసాగే చర్య భావం ఉన్నప్పటికీ, ఈ కథన సందర్భంలో తెలుగు సాధారణ భూతకాలం సహజంగా ఉంటుంది; అవసరమైన కొనసాగింపు భావాన్ని సందర్భమే అందిస్తుంది.
- source_word: δοξάζων
  choice: మహిమపరుస్తూ
  rationale: అనుసరించే చర్యతో ఏకకాలంలో దేవునికి మహిమ చెల్లించడాన్ని చూపుతుంది; తరువాతి αἶνον‌కు వాడిన ‘స్తుతించారు’తో పదభేదాన్ని నిలుపుతుంది.
- source_word: λαός
  choice: ప్రజలందరూ
  rationale: πᾶς ὁ λαός అనే సమూహ సూచనను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἰδὼν
  choice: అది చూసి
  rationale: చూపు పొందిన సంఘటనతో పాటు వెంటనే వివరించిన స్పందనను సందర్భానుసారంగా సూచిస్తుంది; గ్రీకులో కర్మ స్పష్టంగా చెప్పబడలేదు.
- source_word: ἔδωκεν αἶνον
  choice: స్తుతించారు
  rationale: ‘స్తుతి చెల్లించారు’ అనే మరింత పదానువాద రూపం కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, దేవునికి ప్రశంస అర్పించిన భావాన్ని పూర్తిగా అందిస్తుంది.
- source_word: θεός / θεῷ
  choice: దేవుడు / దేవుణ్ణి
  rationale: θεός‌కు ప్రామాణిక తెలుగు సమానార్థకం; మూలంలోని రెండుసార్ల ప్రస్తావనను నిలుపుతుంది.
- source_word: αὐτῷ
  choice: యేసును
  rationale: తెలుగులో సర్వనామ సూచన సందిగ్ధంగా మారకుండా, ముందున్న సందర్భంలో సూచించబడిన యేసు పేరును స్పష్టంగా వాడుతుంది.
theological_decisions:
- issue: చూపు పొందిన తరువాత ఆ వ్యక్తి చేసిన అనుసరణ యొక్క కాలాంశం
  choice: అతడు … యేసును అనుసరించాడు
  alternative: అతడు … యేసును అనుసరిస్తూ ఉన్నాడు
  rationale: ἠκολούθει కొనసాగుతున్న చర్యను సూచించగలదు. అయితే కథన తెలుగులో ‘అనుసరించాడు’ సహజంగా ఉండి, ఆ చర్యను ఒక్క క్షణానికే పరిమితం చేయదు; అదనపు శిష్యత్వ సిద్ధాంతాన్ని చేర్చదు.
- issue: πᾶς ὁ λαός అనే సమూహ ఏకవచన నిర్మాణం
  choice: ప్రజలందరూ … స్తుతించారు
  alternative: ప్రజాసమూహమంతా … స్తుతించింది
  rationale: గ్రీకులో సమూహ ఏకవచనం ఉన్నా, వ్యక్తుల సమూహాన్ని తెలుగులో బహువచనంగా చెప్పడం మరింత సహజం; అర్థంలో మార్పు లేదు.
- issue: ἰδών‌కు స్పష్టంగా చెప్పని కర్మ
  choice: అది చూసి
  alternative: ఈ సంగతిని చూసి
  rationale: గ్రీకు మూలం చూసిన దానిని ప్రత్యేకంగా పేర్కొనదు. ‘అది’ అనే రూపం సందర్భాన్ని సూచిస్తూ ఆ స్వల్ప అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. దేవునికి సంబంధించిన రెండు వేర్వేరు గ్రీకు పదబంధాల మధ్య వ్యత్యాసాన్ని ‘మహిమపరుస్తూ’ మరియు ‘స్తుతించారు’తో నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
