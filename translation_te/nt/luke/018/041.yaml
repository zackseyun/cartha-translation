id: LUK.18.41
reference: Luke 18:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: te
  text: “నేను మీ కోసం ఏమి చేయాలని మీరు కోరుకుంటున్నారు?” అని అడిగాడు. అతడు, “ప్రభువా[a], నా చూపు తిరిగి రావాలి[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయ్యా”; గ్రీకు పదం మర్యాదపూర్వక సంబోధనగా కూడా వాడబడవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నేను మళ్లీ చూడగలగాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: ఏమి
  rationale: ఇది కోరుతున్న నిర్దిష్ట సహాయాన్ని గురించి అడిగే ప్రశ్నార్థక సర్వనామం; కారణాన్ని అడిగే ‘ఎందుకు’ అనే అర్థం ఇక్కడ లేదు.
- source_word: σοι
  choice: నీకు
  rationale: ποιήσωతో కలిసి లబ్ధిదారుని సూచించే దత్తివిభక్తి; తెలుగులో ‘నీకు చేయడం’ సహజంగా ఉంటుంది.
- source_word: θέλεις
  choice: కోరుకుంటున్నావు
  rationale: θέλω ఇక్కడ వ్యక్తి సంకల్పాన్ని లేదా కోరికను తెలియజేస్తుంది; ఆధునిక గౌరవప్రదమైన సంభాషణకు ఈ రూపం సరిపోతుంది.
- source_word: ποιήσω
  choice: నేను ... చేయాలని
  rationale: θέλεις తరువాతి అఓరిస్ట్ సబ్జంక్టివ్ భావాన్ని తెలుగులో సహజమైన పరోక్ష ప్రశ్న నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: ὁ δὲ εἶπεν
  choice: అందుకు అతడు ... అన్నాడు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక, ప్రశ్నకు వచ్చిన జవాబును అనుసంధానిస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριοςకు ప్రాజెక్టు ప్రామాణిక అనువాదమైన ‘ప్రభువు’ను సంబోధన రూపంలో వాడింది; గౌరవార్థక సంబోధనతో పాటు క్రీస్తుసంబంధమైన సూచనకు ఉన్న అవకాశాన్నీ నిలుపుతుంది.
- source_word: ἵνα
  choice: నేను ... చూడాలి
  rationale: కోరికలోని విషయాన్ని తెలిపే ἵνα వాక్యాన్ని తెలుగులో సహజమైన అభిలాషార్థక నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: ἀναβλέψω
  choice: నేను మళ్లీ చూడాలి
  rationale: స్వస్థత సందర్భంలో ἀναβλέπω సాధారణంగా తిరిగి చూడగలగడం లేదా చూపు పొందడం అనే అర్థం ఇస్తుంది; ‘మళ్లీ’ ఆ పునరుద్ధరణ భావాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: యేసును నేరుగా సంబోధించిన κύριος అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ఈ సందర్భంలో గ్రీకు పదం మర్యాదపూర్వకమైన ‘అయ్యా’ అనే సంబోధనగానూ ఉండవచ్చు. అయితే ‘ప్రభువా’ గౌరవాన్ని, అలాగే క్రీస్తుసంబంధమైన లోతైన భావానికి ఉన్న అవకాశాన్ని తగ్గించకుండా ఆ ఉద్దేశపూర్వక అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడింది. మూలంలోని ప్రశ్న–జవాబు సంక్షిప్తతను నిలుపుతూ, తెలుగులో వక్త మార్పు స్పష్టంగా ఉండేందుకు ‘అని అడిగాడు’ మరియు ‘అందుకు’ చేర్చబడ్డాయి. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
