- from: “నేను నీకు ఏమి చేయాలని కోరుకుంటున్నావు?” అని అడిగాడు. అందుకు అతడు, “ప్రభువా[a], నేను మళ్లీ చూడాలి[b]” అన్నాడు.
  to: “నేను మీ కోసం ఏమి చేయాలని మీరు కోరుకుంటున్నారు?” అని అడిగాడు. అతడు, “ప్రభువా[a], నా చూపు తిరిగి రావాలి[b]” అన్నాడు.
  rationale: The revision clarifies the syntactic roles in Jesus' question, uses respectful contemporary Telugu address, and renders the blind man's request as recovery of sight. It preserves the source's concise dialogue, the theological openness of κύριε, and the lexical alternative for ἀναβλέψω.
