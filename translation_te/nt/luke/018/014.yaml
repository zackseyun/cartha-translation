id: LUK.18.14
reference: Luke 18:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: te
  text: '“నేను మీతో చెప్తున్నాను: ఈ మనిషి ఆ మరొకరి కంటే[a] నీతిమంతుడిగా తీర్చబడినవాడై తన ఇంటికి దిగివెళ్లాడు. ఎందుకంటే తనను తాను హెచ్చించుకొనే ప్రతివాడూ తగ్గించబడతాడు; తనను తాను తగ్గించుకొనేవాడు హెచ్చించబడతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ వ్యక్తితో పోలిస్తే”; ఈ పదబంధం ఈ మనిషిని ఆ మరొక ఆరాధకుడితో పోల్చి వ్యత్యాసాన్ని చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: నీతిమంతుడిగా తీర్చబడి
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని దేవుని అనుకూల తీర్పు మరియు దాని ఫలితంగా నిలిచే స్థితి రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది; కర్మను చేసినవారు ఎవరో గ్రీకు వాక్యంలాగే ప్రత్యక్షంగా చెప్పదు.
- source_word: παρ’ ἐκεῖνον
  choice: ఆ మరొక వ్యక్తి కంటే
  rationale: ఇక్కడ παρά + ద్వితీయా విభక్తి పోలిక/వ్యత్యాసాన్ని సూచిస్తుంది. పరిసయ్యుడితో సుంకరి పొందిన తీర్పును పోల్చే భావాన్ని ఈ రూపం సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: κατέβη
  choice: దిగివెళ్లాడు
  rationale: దేవాలయ ప్రాంతం నుంచి దిగివెళ్లే స్పష్టమైన చలన చిత్రాన్ని నిలుపుతుంది; కేవలం ‘తిరిగి వెళ్లాడు’ అని సాఫీ చేయలేదు.
- source_word: οἶκον αὐτοῦ
  choice: తన ఇంటికి
  rationale: గ్రీకులోని ‘అతని ఇల్లు/ఇంటి వద్దకు’ అనే సాధారణ భావాన్ని సహజమైన తెలుగు స్వీయసూచక రూపంలో అందిస్తుంది.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: తన్నుతాను హెచ్చించుకునే ప్రతివాడూ
  rationale: సార్వత్రిక నియమాన్ని, ఏకవచన స్వీయసూచనను, ‘పైకి ఎత్తుకోవడం’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: ταπεινωθήσεται
  choice: తగ్గించబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని కాపాడి, చర్య చేసే వ్యక్తిని గ్రీకు మూలంలాగే వెల్లడించకుండా ఉంచుతుంది.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: తన్నుతాను తగ్గించుకునేవాడు
  rationale: మొదటి భాగానికి సమాంతరంగా ఉండి, ఉద్దేశపూర్వక స్వీయతగ్గింపును సహజంగా తెలియజేస్తుంది.
- source_word: ὑψωθήσεται
  choice: హెచ్చించబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని మరియు మొదటి భాగంలోని ‘హెచ్చించుకునే’ అనే పదంతో ఉన్న ఉద్దేశపూర్వక వ్యతిరేక సమాంతరాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి తీర్పుకు తరువాతి సూత్రం కారణం లేదా వివరణగా వస్తుందని స్పష్టంగా చూపుతుంది.
- source_word: οὗτος
  choice: ఇతడే
  rationale: సుంకరిని సూచిస్తూ పరిసయ్యుడితో ఉన్న బలమైన వ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: δικαιόω పదానికి ఈ ఉపమాన ముగింపులోని భావం
  choice: దేవుని అనుకూల న్యాయతీర్పును సూచించే ‘నీతిమంతుడిగా తీర్చబడి’
  alternative: విస్తృతమైన అర్థంలో ‘నిర్దోషిగా నిరూపించబడి’ లేదా ‘సమర్థించబడి’
  rationale: సందర్భం దేవుని ఎదుట స్వనీతిని ప్రదర్శించిన పరిసయ్యుడిని పశ్చాత్తాపంతో ప్రార్థించిన సుంకరితో పోలుస్తుంది. ఎంపిక చేసిన రూపం దేవుని అనుకూల తీర్పు అనే బరువును నిలుపుతుంది; అయితే ఈ ఒక్క వచనంలో లేని విస్తృత సిద్ధాంత వ్యవస్థను చొప్పించదు.
- issue: παρ’ ἐκεῖνον లోని పోలిక లేదా వ్యత్యాసం
  choice: ‘ఆ మరొక వ్యక్తి కంటే’ అనే పోలికాత్మక వ్యత్యాసం
  alternative: ‘ఆ వ్యక్తితో పోలిస్తే’ లేదా మరింత బలంగా ‘ఆ వ్యక్తి కాదు, ఇతడే’
  rationale: గ్రీకు నిర్మాణం పోలికను లేదా వ్యత్యాసాన్ని మోయగలదు. ప్రధాన పాఠం సహజమైన పోలికను ఇస్తుంది; ప్రత్యేకంగా సంపూర్ణ మినహాయింపు భావాన్ని బలవంతంగా విధించదు.
- issue: సామెతలోని ఏకవచన పుంలింగ సాధారణీకరణ
  choice: ‘ప్రతివాడూ… వాడు’ అనే ఏకవచన ప్రతినిధి రూపం
  alternative: బహువచన లింగతటస్థ రూపం
  rationale: గ్రీకు పుంలింగ ఏకవచన కృదంతాల నిర్మాణాన్ని అనుసరించడంతో పాటు, తెలుగులో సాధారణ సూత్రంగా సహజంగా వినిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలి వాడబడింది. ‘హెచ్చించు/తగ్గించు’ అనే జంట మూలంలోని పైకి–కిందికి తారుమారు సూత్రాన్ని స్పష్టంగా నిలుపుతుంది. ‘దిగివెళ్లాడు’ దేవాలయం నుంచి దిగే స్థలచిత్రాన్ని కాపాడుతుంది.
