revisions:
- from: '“నేను మీతో చెప్తున్నాను: ఆ మరొక వ్యక్తి కంటే[a] ఇతడే నీతిమంతుడిగా తీర్చబడి తన ఇంటికి దిగివెళ్లాడు. ఎందుకంటే తన్నుతాను హెచ్చించుకునే ప్రతివాడూ తగ్గించబడతాడు; తన్నుతాను తగ్గించుకునేవాడు హెచ్చించబడతాడు.”'
  to: '“నేను మీతో చెప్తున్నాను: ఈ మనిషి ఆ మరొకరి కంటే[a] నీతిమంతుడిగా తీర్చబడినవాడై తన ఇంటికి దిగివెళ్లాడు. ఎందుకంటే తనను తాను హెచ్చించుకొనే ప్రతివాడూ తగ్గించబడతాడు; తనను తాను తగ్గించుకొనేవాడు హెచ్చించబడతాడు.”'
  rationale: The revision retains the draft’s faithful treatment of the Greek while removing unnecessary exclusivity, improving modern Telugu flow, and more explicitly preserving the perfect-passive participial relationship of δεδικαιωμένος. The footnote remains anchored to the comparative phrase and preserves the source ambiguity between comparison and contrast.
