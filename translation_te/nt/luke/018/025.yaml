id: LUK.18.25
reference: Luke 18:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: te
  text: ఎందుకంటే, ధనవంతుడు దేవుని రాజ్యంలో ప్రవేశించడం కంటే ఒంటె సూది బెజ్జం గుండా ప్రవేశించడం సులభం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సూది బెజ్జం’ అనేది సూదిలో దారం ఎక్కించే చిన్న రంధ్రం. కొందరు దీనిని ‘సూది బెజ్జం’ అనే పేరుగల ఇరుకైన ద్వారమని లేదా ‘ఒంటె’కు బదులు ‘తాడు’ అని వివరించారు; అయితే ఇక్కడి గ్రీకు పాఠంలో ‘ఒంటె’ అనే ఉంది.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: సులభం
  rationale: ἐστινతో విధేయార్థకంగా వచ్చిన తులనాత్మక విశేషణాన్ని తెలుగులో సహజమైన ‘...కంటే ... సులభం’ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలోని మాటకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κάμηλον
  choice: ఒంటె
  rationale: κάμηλος అనే గ్రీకు పదానికి సాధారణ, పాఠ్యాధారిత అర్థం ‘ఒంటె’; ‘తాడు’ వంటి ఊహాత్మక అర్థాన్ని స్వీకరించలేదు.
- source_word: διὰ τρήματος βελόνης
  choice: సూది బెజ్జం గుండా
  rationale: ‘సూది రంధ్రం గుండా’ అనే మూలార్థాన్ని సహజమైన ప్రామాణిక తెలుగు నుడికారంతో తెలియజేస్తుంది.
- source_word: εἰσελθεῖν
  choice: ప్రవేశించడం
  rationale: రెండు సందర్భాల్లోనూ εἰσέρχομαι క్రియ యొక్క దిశాత్మక భావాన్ని ఒకే విధంగా నిలుపుతుంది.
- source_word: πλούσιον
  choice: ధనవంతుడు
  rationale: పుంలింగ ఏకవచనంలో నామవాచకంగా వాడిన విశేషణాన్ని ప్రతినిధి ఏకవచనంగా సహజంగా అనువదించింది.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో
  rationale: తెలుగులో ‘ప్రవేశించడం’తో సహజంగా కలిసే స్థానవాచక రూపం; εἰς యొక్క లోనికి వెళ్లే భావాన్ని సందర్భం స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఒంటె–సూది బెజ్జం దృశ్యరూపానికి వ్యాఖ్యానం
  choice: ‘ఒంటె ... సూది బెజ్జం గుండా’ అనే అక్షరార్థ అతిశయోక్తి దృశ్యాన్ని నిలిపింది.
  alternative: ‘సూది బెజ్జం’ అనే పేరుగల ఇరుకైన ద్వారం అని వ్యాఖ్యానించడం, లేదా ‘ఒంటె’కు బదులు ‘తాడు’ అని చదవడం.
  rationale: ఇచ్చిన గ్రీకు పాఠంలో κάμηλον అంటే ‘ఒంటె.’ అసాధ్యంగా కనిపించే దృశ్యం ధనవంతుడు దేవుని రాజ్యంలో ప్రవేశించడంలోని కష్టాన్ని బలంగా తెలియజేస్తుంది; తరువాతి వివరణాత్మక సంప్రదాయాలను ప్రధాన పాఠ్యంలోకి చేర్చడానికి పాఠ్యాధారం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని తులనాత్మక నిర్మాణాన్ని తెలుగులో సహజ క్రమానికి మార్చి, ఉద్దేశపూర్వకమైన అసాధ్య దృశ్యాన్ని యథాతథంగా నిలిపింది.
