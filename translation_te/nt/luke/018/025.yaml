  source_fidelity: 'The Telugu accurately represents the Greek comparison: γάρ is retained as an explanatory connector; κάμηλον is correctly rendered ‘ఒంటె’; διὰ τρήματος βελόνης is naturally and faithfully expressed as ‘సూది బెజ్జం గుండా’; and both infinitives are represented by ‘ప్రవేశించడం.’ The reversal of the two comparative elements is idiomatic Telugu and preserves the sense. ‘దేవుని రాజ్యంలో ప్రవేశించడం’ adequately conveys εἰς τὴν βασιλείαν τοῦ θεοῦ in this construction.'
