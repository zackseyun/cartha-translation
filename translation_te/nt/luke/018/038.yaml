  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: te
  text: 'అతడు బిగ్గరగా ఇలా కేక వేశాడు: “యేసూ, దావీదు కుమారుడా,[a] నాపై కరుణ చూపించు!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దావీదు కుమారుడు” అనేది వాగ్దానం చేయబడిన దావీదు వంశపు రాజును సూచించే మెస్సీయ బిరుదు; దీనిని మరింత సాధారణంగా “దావీదు వంశస్థుడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: బిగ్గరగా కేక వేస్తూ
  rationale: βοάω బిగ్గరగా, అత్యవసరంగా మొరపెట్టడాన్ని సూచిస్తుంది. తెలుగు కథనంలో సహజంగా ఉండేందుకు λέγωνతో కలిపి ఈ విధంగా అనువదించబడింది.
- source_word: λέγων
  choice: అన్నాడు
  rationale: గ్రీకు వర్తమాన కృదంతం ప్రత్యక్ష సంభాషణను పరిచయం చేస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ప్రధాన క్రియతో కలిపి ‘అన్నాడు’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: Ἰησοῦ
  choice: యేసూ
  rationale: ఇది సంబోధనా రూపం; ప్రామాణిక తెలుగు పేరును సంబోధనలో ‘యేసూ’గా ఇచ్చాం.
- source_word: υἱὲ Δαυίδ
  choice: దావీదు కుమారుడా
  rationale: పదబంధంలోని సంబోధనను, అలాగే లూకా సందర్భంలోని రాజసంబంధమైన మెస్సీయ బిరుదు ధ్వనిని నిలుపుతుంది.
- source_word: ἐλέησόν με
  choice: నన్ను కరుణించు
  rationale: కరుణతో చర్య తీసుకోవాలని కోరే ప్రత్యక్షమైన, అత్యవసర విజ్ఞప్తిని సహజమైన గౌరవప్రద తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: υἱὲ Δαυίδ అనే బిరుదులోని మెస్సీయ భావం
  choice: ‘దావీదు కుమారుడా’ అనే బిరుదుగా అనువదించడం
  alternative: ‘దావీదు వంశస్థుడా’ అని సాధారణ వంశార్థంలో అనువదించడం
  rationale: లూకా కథన సందర్భంలో ఇది వాగ్దానం చేయబడిన దావీదు వంశపు రాజును సూచించే రాజసంబంధమైన మెస్సీయ సంబోధనగా పనిచేస్తుంది. ‘దావీదు కుమారుడు’ అనే రూపం ఆ బిరుదు ప్రతిధ్వనిని వ్యాఖ్యానంతో విస్తరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘బిగ్గరగా కేక వేస్తూ’ అనే రూపం స్వర తీవ్రతను, అత్యవసరతను నిలుపుతుంది; సంబోధనా రూపాలు ‘యేసూ’, ‘కుమారుడా’ ప్రత్యక్ష మొరను స్పష్టంగా తెలియజేస్తాయి.
