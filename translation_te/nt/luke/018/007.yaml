id: LUK.18.7
reference: Luke 18:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: te
  text: మరి దేవుడు రాత్రింబగళ్లు తనకు మొరపెట్టుకునే తన ఎన్నుకున్నవారికి న్యాయం చేయకుండా ఉంటాడా? వారి విషయంలో ఆయన చాలాకాలం ఆలస్యం చేస్తాడా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి విషయంలో ఆయన సహనం చూపుతున్నప్పటికీ” లేదా “వారి విషయంలో ఆయన సహనం చూపుతున్నాడా?” గ్రీకు పదబంధం ఆలస్యానికి బదులు సహనం లేదా దీర్ఘసహనం అనే భావంలోనూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: న్యాయం చేయడం
  rationale: అన్యాయస్థుడైన న్యాయాధిపతి ఉపమానపు న్యాయసంబంధ సందర్భంలో ఇది వ్యక్తిగత ప్రతీకారంకన్నా న్యాయపరిహారం, న్యాయస్థాపన అనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἐκλεκτῶν
  choice: ఎన్నుకున్నవారు
  rationale: విశేషణం నామవాచకంగా వాడబడింది. ఈ రూపం దేవుడు ఎన్నుకున్నవారనే భావాన్ని సహజంగా ఉంచుతూ, ఏ ప్రత్యేక సిద్ధాంతవ్యాఖ్యానాన్నీ చేర్చదు.
- source_word: βοώντων
  choice: మొరపెట్టుకునే
  rationale: తీవ్రమైన, పదేపదే చేసే విజ్ఞాపనను సందర్భానుకూలమైన ప్రార్థనా భాషలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμέρας καὶ νυκτός
  choice: రాత్రింబగళ్లు
  rationale: పగలు-రాత్రి నిరంతరంగా అనే మూలభావాన్ని ఆధునిక తెలుగులో సహజమైన స్థిరప్రయోగంతో తెలియజేస్తుంది.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: వారి విషయంలో ఆయన చాలాకాలం ఆలస్యం చేస్తాడా?
  rationale: ఈ క్లిష్టమైన పదబంధాన్ని తదుపరి వచనంలోని త్వరిత న్యాయస్థాపనకు అనుగుణంగా చర్యను వాయిదా వేయడమనే ప్రధాన సందర్భార్థంతో అనువదించాం; సహనం అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: οὐ μὴ ποιήσῃ
  choice: న్యాయం చేయకుండా ఉంటాడా?
  rationale: οὐ μή గల అలంకారిక ప్రశ్న ‘తప్పకుండా చేస్తాడు’ అనే బలమైన సానుకూల సమాధానాన్ని ఆశిస్తుంది. తెలుగు ప్రశ్నారూపం ఆ వాక్చాతుర్యాన్ని సహజంగా మోస్తుంది.
- source_word: θεὸς
  choice: దేవుడు
  rationale: తెలుగులో ప్రామాణికమైన, సందర్భానికి తగిన అనువాదం.
theological_decisions:
- issue: μακροθυμεῖ ἐπ’ αὐτοῖς అనే పదబంధం దేవుని స్వభావం, చర్యతో ఎలా సంబంధిస్తుంది
  choice: ఆయన న్యాయం చేయడంలో చాలాకాలం ఆలస్యం చేస్తాడా? అనే ప్రశ్నగా ప్రధాన పాఠంలో ఇచ్చాం.
  alternative: ‘వారి విషయంలో ఆయన సహనం చూపుతున్నప్పటికీ’ లేదా ‘వారి విషయంలో ఆయన సహనం చూపుతున్నాడా?’
  rationale: గ్రీకు పదబంధం దీర్ఘసహనం/ఓర్పు అనే భావాన్నీ అనుమతిస్తుంది. అయితే 8వ వచనంలోని త్వరగా న్యాయం చేస్తాడనే హామీతో ఉపమానపు ప్రవాహం ఆలస్యాన్ని గురించిన ప్రశ్నను బలపరుస్తుంది. అస్పష్టతను పూర్తిగా తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించబడింది. ‘మొరపెట్టుకునే’ అనేది ప్రార్థనలోని తీవ్రతను, ‘రాత్రింబగళ్లు’ నిరంతరతను సహజంగా తెలియజేస్తాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో ఉంది.
