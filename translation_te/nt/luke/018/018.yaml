id: LUK.18.18
reference: Luke 18:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: te
  text: 'ఒక అధికారి ఆయనను ఇలా అడిగాడు: “మంచి బోధకుడా, నిత్యజీవాన్ని వారసత్వంగా పొందడానికి నేను ఏమి చేయాలి?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నేను ఏమి చేసి నిత్యజీవాన్ని వారసత్వంగా పొందుతాను?”
    reason: τί ποιήσας అనే కృదంత నిర్మాణానికి మరింత రూపసన్నిహితమైన ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: అడిగాడు
  rationale: ἐπερωτάω ఇక్కడ ప్రశ్న అడగడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అడిగాడు’ సహజంగా, కథనశైలికి తగినట్లుగా ఉంది.
- source_word: τις ἄρχων
  choice: ఒక అధికారి
  rationale: τις వ్యక్తి ఎవరో నిర్దిష్టంగా చెప్పదు; ἄρχων అధికారస్థానంలో ఉన్న వ్యక్తిని సూచిస్తుంది. అతని పదవిని అనవసరంగా నిర్దిష్టం చేయకుండా ‘ఒక అధికారి’ అనే విస్తృతమైన పదబంధం మూల భావాన్ని నిలుపుతుంది.
- source_word: λέγων
  choice: ఇలా
  rationale: ప్రధాన క్రియ తర్వాత వచ్చే λέγωνను తెలుగులో విడిగా ‘చెబుతూ’ అని అనువదించడం కంటే, ప్రత్యక్ష సంభాషణకు ముందు ‘ఇలా’ అనడం సహజమైన కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: Διδάσκαλε ἀγαθέ
  choice: మంచి బోధకుడా
  rationale: διδάσκαλος యొక్క బోధించే వ్యక్తి అనే భావాన్ని ‘బోధకుడు’ స్పష్టంగా తెలియజేస్తుంది; ἀγαθόςను ‘మంచి’గా ఉంచడం తదుపరి వచనంలో యేసు స్పందించే కీలక పదాన్ని కాపాడుతుంది.
- source_word: τί ποιήσας
  choice: నేను ఏమి చేయాలి
  rationale: అనంతర భవిష్యత్ క్రియతో కూడిన అఔరిస్ట్ కృదంతం అవసరమైన కార్యం లేదా సాధనాన్ని ప్రశ్నిస్తుంది. ‘నేను ఏమి చేయాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి, అధికారి ప్రశ్నలోని కార్యాధారిత రూపాన్ని నిలుపుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: ఈ సందర్భంలో స్థిరమైన, సహజమైన తెలుగు సమానార్థకం; అంతం లేని జీవితం అనే భావంతో పాటు లూకా వాడుకలోని ధార్మిక భావాన్ని కూడా మోస్తుంది.
- source_word: κληρονομήσω
  choice: వారసత్వంగా పొందడానికి
  rationale: κληρονομέωలోని వారసత్వ భావాన్ని కేవలం ‘పొందు’ అని తగ్గించకుండా స్పష్టంగా కాపాడుతుంది; తెలుగు వాక్యంలో ఉద్దేశార్థక నిర్మాణంతో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: మానవ కార్యానికి సంబంధించి నిత్యజీవ ప్రశ్నను ఎలా వ్యక్తపరచాలి
  choice: నిత్యజీవాన్ని వారసత్వంగా పొందడానికి నేను ఏమి చేయాలి?
  alternative: నేను ఏమి చేసి నిత్యజీవాన్ని వారసత్వంగా పొందుతాను?
  rationale: మూల వాక్యం అధికారి అడిగిన ప్రశ్నను చేయవలసిన కార్యం పరంగా ఉంచుతుంది; అయితే ఆ దృక్పథాన్ని కథకుడు సమర్థిస్తున్నాడని చెప్పదు. అనువాదం ఈ ఉద్రిక్తతను సిద్ధాంతపరంగా పరిష్కరించకుండా అతని ప్రశ్న రూపాన్నే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘అధికారి’ అతని ఖచ్చిత పదవిని ఊహించకుండా సామాజిక అధికారాన్ని సూచిస్తుంది; ‘వారసత్వంగా పొందు’ మూలంలోని వారసత్వ రూపకాన్ని కాపాడుతుంది.
