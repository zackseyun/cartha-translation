  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: te
  text: వారు ఎల్లప్పుడూ ప్రార్థిస్తూ ఉండాలి, నిరుత్సాహపడకూడదని వారికి తెలియజేయడానికి ఆయన ఒక ఉపమానం చెబుతూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఎల్లప్పుడూ ప్రార్థిస్తూ ఉండాలి, నిరుత్సాహపడకూడదనే అవసరం గురించి ఆయన వారికి ఒక ఉపమానం చెబుతూ ఉన్నాడు.”
    reason: πρὸς τὸ δεῖν నిర్మాణాన్ని ఉద్దేశంగా కాక విషయసంబంధంగా కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: చెప్పాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాలం నేపథ్యాన్ని లేదా కొనసాగుతున్న గత చర్యను సూచిస్తుంది. తెలుగు కథనశైలిలో సహజమైన సాధారణ భూతకాలం సందర్భానుసారంగా ఆ భావాన్ని మోయగలదు; ‘చెబుతూ ఉన్నాడు’ ఇక్కడ అనవసరంగా భారంగా వినిపిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప సంధాన సూచకం. ఈ ఒక్క వాక్యంలో ‘అప్పుడు’ లేదా ‘ఇక’ అని చేరిస్తే మూలంలో లేని కాలక్రమ లేదా బలమైన మార్పు భావం రావచ్చు.
- source_word: παραβολὴν
  choice: ఒక ఉపమానం
  rationale: సువార్తల సందర్భంలో παραβολήకు ప్రామాణికమైన, సాధారణ పాఠకులకు సుపరిచితమైన తెలుగు సమానార్థకం.
- source_word: πρὸς τὸ δεῖν
  choice: అని తెలియజేయడానికి
  rationale: πρὸς τό + క్రియార్థక రూపం ఉద్దేశం లేదా విషయసంబంధాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో ఉద్దేశ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది; విషయసంబంధ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: δεῖν
  choice: ఉండాలి / పడకూడదు
  rationale: δεῖలోని అవసరం లేదా విధిబద్ధతను తెలుగు ‘ఉండాలి’, ‘పడకూడదు’ రూపాలు స్పష్టంగా నిలుపుతాయి; దానిని కేవలం మృదువైన సలహాగా మార్చలేదు.
- source_word: πάντοτε προσεύχεσθαι
  choice: ఎల్లప్పుడూ ప్రార్థిస్తూ ఉండాలి
  rationale: πάντοτε యొక్క నిరంతర పట్టుదల భావాన్ని ‘ఎల్లప్పుడూ’ నిలుపుతుంది; ‘ప్రార్థిస్తూ ఉండాలి’ అనేది ప్రతి క్షణం మాటలతో ప్రార్థించాలనే కఠినార్థం విధించకుండా కొనసాగింపును తెలియజేస్తుంది.
- source_word: μὴ ἐγκακεῖν
  choice: నిరుత్సాహపడకూడదు
  rationale: ἐγκακέωలోని ధైర్యం కోల్పోవడం, అలసి విరమించడం అనే భావాలకు సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: ప్రార్థనలో నిరంతరతపై యేసు బోధ యొక్క బలం
  choice: ‘ఎల్లప్పుడూ ప్రార్థిస్తూ ఉండాలి, నిరుత్సాహపడకూడదు’ అని అవసరాన్ని స్పష్టంగా తెలిపింది.
  alternative: ‘ప్రార్థించడం మంచిది’ వంటి మృదువైన సూచన; లేదా ప్రార్థన ఫలితంపై నిర్దిష్ట సిద్ధాంత వివరణ.
  rationale: δεῖν తెలియజేసే అవసరాన్ని తగ్గించలేదు; అదే సమయంలో ప్రార్థన ఎలా ఫలిస్తుంది అనే విషయంపై మూలవాక్యం చెప్పని సంఘపరమైన లేదా సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
- issue: πρὸς τὸ δεῖν నిర్మాణంలోని ఉద్దేశం–విషయసంబంధ అనిశ్చితి
  choice: ప్రధాన పాఠ్యంలో ‘తెలియజేయడానికి’ అనే ఉద్దేశ భావం.
  alternative: ‘వారు ... చేయాల్సిన అవసరం గురించి’ అనే విషయసంబంధ భావం.
  rationale: గ్రీకు నిర్మాణం రెండింటికీ చోటివ్వగలదు. సహజమైన తెలుగు ప్రధాన పాఠ్యానికి ఉద్దేశ భావాన్ని ఎంచుకొని, నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిలో ఉంది. ‘ప్రార్థిస్తూ ఉండాలి’ నిరంతర పట్టుదలను సూచిస్తుంది; యాంత్రికంగా విరామం లేని మాటల ప్రార్థనను కాదు.
