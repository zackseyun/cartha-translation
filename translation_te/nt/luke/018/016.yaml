source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: te
  text: 'అయితే యేసు వారిని తన దగ్గరికి పిలిచి ఇలా అన్నాడు: “పిల్లలను నా దగ్గరికి రానివ్వండి; వారిని అడ్డుకోవద్దు. ఎందుకంటే దేవుని రాజ్యం ఇలాంటివారిది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని రాజ్యం ఇలాంటివారికి చెందుతుంది.”
    reason: గ్రీకులోని స్వామ్య లేదా సంబంధ భావాన్ని తెలుగులో మరో సహజ విధంగా వ్యక్తం చేసే అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: వారిని తన దగ్గరికి పిలిచి
  rationale: మధ్యమ వాచకంలోని క్రియ వారిని తన దగ్గరికి పిలిచాడనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘పిలిచి ఇలా అన్నాడు’ సహజంగా ఉంది.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: పిల్లలను నా దగ్గరికి రానివ్వండి
  rationale: ἄφετε ఇక్కడ అనుమతించండి అనే ఆజ్ఞార్థాన్ని, ἔρχεσθαι πρός με యేసు దగ్గరికి రావడాన్ని నేరుగా వ్యక్తం చేస్తాయి.
- source_word: μὴ κωλύετε αὐτά
  choice: వారిని అడ్డుకోవద్దు
  rationale: κωλύω యొక్క విస్తృత భావమైన అడ్డగించడం లేదా నిరోధించడం రెండింటినీ ‘అడ్డుకోవద్దు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῶν τοιούτων
  choice: ఇలాంటివారిది
  rationale: ఈ రూపం అక్కడున్న పిల్లలను మాత్రమే కాక, వారిలాంటి వారిని కూడా సూచించే గ్రీకు పదబంధపు ప్రతినిధి భావాన్ని నిలుపుతుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ఇది మూలపాఠంలోని సాధారణ రాజ్య పదబంధానికి నేరమైన, స్థిరమైన తెలుగు అనువాదం.
theological_decisions:
- issue: τῶν τοιούτων యొక్క పరిధి
  choice: ‘ఇలాంటివారు’ అని అనువదించి, అక్కడున్న పిల్లలు ప్రతినిధులుగా నిలిచే విస్తృత వర్గాన్ని సూచించడం
  alternative: ఆ పిల్లలను మాత్రమే సూచించేలా ‘వీరిది’ అని అనువదించడం
  rationale: τοιούτων నిర్దిష్టంగా ఆ పిల్లలకే పరిమితం కాకుండా, అలాంటివారి వర్గాన్ని సూచిస్తుంది. అయితే వారిలో ఏ లక్షణాన్ని ఉద్దేశించాడో ఈ వచనం చెప్పనందున అనువాదం దానిని నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘పిల్లలు’ అనే పదానికి మూలంలో లేని అదనపు వయస్సు సూచనను చేర్చలేదు; వాక్యంలోని ఆజ్ఞల నేరుతనాన్ని నిలిపాం.
