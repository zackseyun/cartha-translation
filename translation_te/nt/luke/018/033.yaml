  source_fidelity: 'మూల గ్రీకులోని క్రమం మరియు భావం నమ్మకంగా ప్రతిఫలించాయి: కొరడాలతో కొట్టడం హత్యకు ముందుగా జరుగుతుంది; ‘వారు’ అనేది సందర్భం నుంచి వచ్చే బహువచన కర్తను సహజంగా వ్యక్తపరుస్తుంది; ‘మూడవ రోజున’ కాలసూచనను కాపాడుతుంది; ἀναστήσεται యొక్క మధ్యమ/అకర్మక ప్రయోగాన్ని ‘ఆయన లేస్తాడు’ సరిగ్గా ప్రతిబింబిస్తుంది.'
