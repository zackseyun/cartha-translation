  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: te
  text: ఆయనను కొరడాలతో కొట్టిన తర్వాత, వారు ఆయనను చంపుతారు. మూడవ రోజున ఆయన లేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన లేపబడతాడు.’ ఇక్కడి గ్రీకు పదానికి మరింత నేరమైన అర్థం ‘ఆయన లేస్తాడు.’
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: కొరడాలతో కొట్టిన తర్వాత
  rationale: ఈ భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందుగా జరిగే చర్యను సూచిస్తుంది. ‘కొరడాలతో కొట్టడం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, చర్య యొక్క క్రూరత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀποκτενοῦσιν
  choice: వారు ఆయనను చంపుతారు
  rationale: భవిష్యత్ కర్తరి బహువచన రూపాన్ని నేరుగా, సహజంగా అనువదిస్తుంది. ‘హత్య చేస్తారు’ అనేది మూల క్రియలో స్పష్టంగా లేని నైతిక తీర్పును జోడించవచ్చు.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: సందర్భంలో యేసును సూచించే ప్రత్యక్ష కర్మ సర్వనామం. తెలుగులో గౌరవార్థక రూపం సహజమైనది.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే దత్తివిభక్తి ప్రయోగానికి సహజమైన తెలుగు సమానం; అదనపు కాలవ్యాఖ్యను చేర్చదు.
- source_word: ἀναστήσεται
  choice: ఆయన లేస్తాడు
  rationale: భవిష్యత్ మధ్యమ రూపం ఇక్కడ అకర్మక భావంలో ఉంది. ‘లేస్తాడు’ గ్రీకు రూపాన్ని నేరుగా ప్రతిబింబిస్తూ, కర్తను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: పునరుత్థాన క్రియారూపం
  choice: ఆయన లేస్తాడు
  alternative: ఆయన లేపబడతాడు
  rationale: గ్రీకు రూపం భవిష్యత్ మధ్యమం; స్పష్టమైన కర్మణి రూపం కాదు. అందువల్ల ‘లేస్తాడు’ మూలానికి మరింత నేరమైన అనువాదం. ఇతర వాక్యాలలో దేవుడు యేసును లేపాడనే బోధకు ఇది విరుద్ధం కాదు; అయితే ఆ భావాన్ని ఇక్కడి రూపంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. యేసుకు ‘ఆయన’ అనే గౌరవార్థక సర్వనామం వాడబడింది. మూలంలోని రెండు καί సంధులను తెలుగులో సహజమైన రెండు వాక్యాలుగా వ్యక్తం చేశాం; సంఘటనల క్రమం యథాతథంగా ఉంది.
