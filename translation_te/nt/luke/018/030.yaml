review_pass:
  verdict: revise
  source_fidelity: The draft preserves the emphatic assurance of οὐχὶ μὴ, the present-versus-coming-age contrast, and ζωὴ αἰώνιος as ‘నిత్యజీవం.’ However, ‘ఎన్నో రెట్లు పొందుతాడు’ is slightly incomplete in Telugu for πολλαπλασίονα (‘many times more’); adding ‘ఎక్కువగా’ makes the comparative abundance explicit.
  naturalness: The wording is generally modern and clear. Revising the phrase to ‘ఎన్నో రెట్లు ఎక్కువగా పొందుతాడు’ is more idiomatic and avoids a momentary impression that ‘ఎన్నో రెట్లు’ could modify eternal life as well.
  terminology: ‘కాలం,’ ‘యుగం,’ and ‘నిత్యజీవం’ are appropriate standard Telugu renderings. The footnote anchor is correctly placed on ‘రాబోయే యుగంలో,’ and its alternative preserves the same eschatological-age sense.
  issues:
  - severity: low
    issue: The comparative force of πολλαπλασίονα is not fully explicit in ‘ఎన్నో రెట్లు పొందుతాడు.’
    rationale: The Greek denotes a multiplied or many-times-greater return. ‘ఎన్నో రెట్లు ఎక్కువగా పొందుతాడు’ clearly expresses this in natural Telugu.
  revised_text: అతడు ఈ కాలంలో ఎన్నో రెట్లు ఎక్కువగా, రాబోయే యుగంలో[a] నిత్యజీవాన్ని తప్పకుండా పొందుతాడు.
