source:
  edition: SBLGNT
  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: te
  text: అతడు ఈ కాలంలో ఎన్నో రెట్లు ఎక్కువగా, రాబోయే యుగంలో[a] నిత్యజీవాన్ని తప్పకుండా పొందుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రానున్న యుగంలో.’
    reason: ‘రాబోయే యుగం’ అనే అంత్యకాల పదబంధానికి సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: ὃς
  choice: అతడు
  rationale: ఈ సంబంధ సర్వనామం మునుపటి వచనంలో చెప్పిన వ్యక్తిని సూచిస్తుంది. తెలుగు వాక్య కొనసాగింపులో ‘అతడు’ సహజంగా ఉంటుంది.
- source_word: οὐχὶ μὴ
  choice: తప్పకుండా
  rationale: οὐχὶ μὴ మరియు అఓరిస్ట్ సబ్జంక్టివ్ కలయిక బలమైన నిశ్చయాన్ని వ్యక్తం చేస్తుంది. తెలుగులో కృత్రిమ ద్వినిషేధం వాడకుండా ‘తప్పకుండా’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπολάβῃ
  choice: పొందుతాడు
  rationale: సందర్భంలో ఇది ప్రతిఫలంగా పొందడాన్ని సూచిస్తుంది. ‘తిరిగి పొందుతాడు’ అని అనువదిస్తే ప్రతి అంశమూ యథాతథంగా తిరిగి లభిస్తుందనే భావం అనవసరంగా బలపడవచ్చు.
- source_word: πολλαπλασίονα
  choice: ఎన్నో రెట్లు
  rationale: మూలపదంలోని విస్తారమైన బహుళ ప్రతిఫల భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: ఈ కాలంలో
  rationale: καιρός ఇక్కడ ప్రస్తుత కాలాన్ని, తరువాత చెప్పబడే రాబోయే యుగానికి భిన్నంగా, సూచిస్తుంది.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: రాబోయే యుగంలో
  rationale: పదబంధంలోని యుగ సంబంధమైన అంత్యకాల భావాన్ని కేవలం ‘భవిష్యత్తులో’ అని సడలించకుండా కాపాడుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవాన్ని
  rationale: సువార్తల సందర్భంలో స్థిరమైన, సహజమైన తెలుగు రూపం; రాబోయే యుగానికి చెందిన అంతం లేని జీవం అనే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: αἰῶνι τῷ ἐρχομένῳ అనే అంత్యకాల వ్యక్తీకరణ
  choice: రాబోయే యుగంలో
  alternative: రానున్న యుగంలో
  rationale: ప్రస్తుత కాలం మరియు రాబోయే యుగం మధ్య ఉన్న నూతన నిబంధన కాలవిభజనను నిలుపుతుంది; దాన్ని సాధారణ భవిష్యత్ కాలంగా మాత్రమే మార్చదు.
- issue: ప్రస్తుత కాలపు ప్రతిఫలం మరియు రాబోయే యుగపు నిత్యజీవం మధ్య సంబంధం
  choice: ఒకే ‘పొందుతాడు’ క్రియ కింద రెండింటినీ ఉంచడం
  alternative: రెండు వేరు వాక్యఖండాల్లో ‘పొందుతాడు’ను పునరుక్తి చేయడం
  rationale: మూల గ్రీకులో ఒకే క్రియ రెండు కాలాలకు సంబంధించిన ఫలాలను నియంత్రిస్తుంది. ఈ నిర్మాణం ఆ సంబంధాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ‘యుగం’ అనే మూలంలోని ధార్మిక-కాల సంబంధ పదాన్ని నిలుపుతూ గౌరవప్రదమైన శైలి వాడబడింది.
