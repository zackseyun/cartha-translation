  to: అతడు ఈ కాలంలో ఎన్నో రెట్లు ఎక్కువగా, రాబోయే యుగంలో[a] నిత్యజీవాన్ని తప్పకుండా పొందుతాడు.
  rationale: ‘ఎక్కువగా’ను చేర్చి πολλαπλασίοναలోని ‘many times more’ అనే తులనాత్మక భావాన్ని స్పష్టంగా చేశాం. మిగిలిన వాక్యనిర్మాణం ఒకే క్రియ ద్వారా ప్రస్తుత కాలపు బహుళ ప్రతిఫలాన్నీ రాబోయే యుగపు నిత్యజీవాన్నీ అనుసంధానిస్తూ మూలానికి దగ్గరగా నిలుస్తుంది.
