id: LUK.18.29
reference: Luke 18:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: దేవుని రాజ్యం కోసం ఇల్లునైనా, భార్యనైనా, అన్నదమ్ములనైనా, తల్లిదండ్రులనైనా, పిల్లలనైనా విడిచిపెట్టినవాడు ఎవరూ లేరు—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: గంభీరమైన ధృవీకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; వాక్యంలోని అధికారపూర్వక బలాన్ని నిలుపుతుంది.
- source_word: ἀφῆκεν
  choice: విడిచిపెట్టినవాడు
  rationale: ఇల్లు, కుటుంబ సంబంధాలను దేవుని రాజ్యం నిమిత్తం వెనుక విడిచిపెట్టడం అనే విస్తృత భావాన్ని నిలుపుతుంది; శాశ్వతంగా త్యజించాడనే అదనపు నిర్ణయాన్ని రుద్దదు.
- source_word: οἰκίαν
  choice: ఇల్లునైనా
  rationale: ఇక్కడ జాబితాలోని స్పష్టమైన ఏకవచన నామవాచకాన్ని సహజంగా అనువదిస్తుంది.
- source_word: ἀδελφούς
  choice: అన్నదమ్ములనైనా
  rationale: ఈ సందర్భంలో కుటుంబ సభ్యులైన పురుష సహోదరులను సూచించే గ్రీకు బహువచనానికి సాధారణ తెలుగు సమానం.
- source_word: γονεῖς
  choice: తల్లిదండ్రులనైనా
  rationale: లింగాలను రెండింటినీ కలిపే గ్రీకు పదానికి ఖచ్చితమైన, సహజమైన తెలుగు రూపం.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: దేవుని రాజ్యం కోసం
  rationale: కారణం లేదా నిమిత్తాన్ని తెలిపే ἕνεκεν భావాన్ని స్పష్టంగా ఉంచి, βασιλεία అనే ప్రధాన బైబిలు భావాన్ని ‘రాజ్యం’గా నిలుపుతుంది.
theological_decisions:
- issue: కుటుంబాన్ని ‘విడిచిపెట్టడం’ యొక్క స్వభావం
  choice: విడిచిపెట్టినవాడు
  alternative: త్యజించినవాడు
  rationale: మూలంలోని ἀφίημι సందర్భానుసారంగా వెనుక విడిచి రావడం లేదా వదలడం అని సూచిస్తుంది. ‘త్యజించడం’ బాధ్యతల నిరాకరణ లేదా శాశ్వత పరిత్యాగాన్ని అనవసరంగా బలపరచవచ్చు.
- issue: దేవుని రాజ్యం అనే పదబంధం
  choice: దేవుని రాజ్యం
  alternative: దేవుని పరిపాలన
  rationale: ‘రాజ్యం’ మూలరూపాన్ని, బైబిలు అంతటా ఉన్న అంతర్‌పాఠ్య సంబంధాన్ని కాపాడుతుంది; ‘పరిపాలన’ భావంలోని ఒక కోణాన్నే ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. మూల వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివరలో దీర్ఘవిరామ చిహ్నం ఉంచబడింది; అనువాదంలో మూలానికి లేని ముగింపును జోడించలేదు.
