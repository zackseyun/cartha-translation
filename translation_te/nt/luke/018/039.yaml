id: LUK.18.39
reference: Luke 18:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: te
  text: ముందుగా వెళ్తున్నవారు అతణ్ణి మౌనంగా ఉండమని గద్దిస్తూనే ఉన్నారు. కాని అతడు ఇంకా ఎక్కువగా, “దావీదు కుమారుడా, నన్ను కరుణించు!” అని కేకలు వేస్తూనే ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: ముందుగా వెళ్తున్నవారు
  rationale: వర్తమాన కర్తరి అసమాపక క్రియ నామవాచకంగా వాడబడింది; గుంపులో ముందుగా వెళ్తున్నవారనే స్థలార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది, వారికి నాయకత్వ పాత్ర ఉందని అదనంగా ఊహించదు.
- source_word: ἐπετίμων
  choice: గద్దించారు
  rationale: ἐπιτιμάωలోని మందలింపు, కఠిన నిరోధ భావాన్ని ‘గద్దించారు’ సహజంగా అందిస్తుంది. గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్య భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ἵνα σιγήσῃ
  choice: మౌనంగా ఉండమని
  rationale: ἵναతో కూడిన ఉపార్థక క్రియ వ్యక్తం చేసే ఉద్దేశాన్ని సహజ తెలుగు పరోక్ష ఆజ్ఞ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: αὐτὸς δὲ
  choice: కాని అతడు
  rationale: వ్యతిరేకతను ‘కాని’ స్పష్టంగా చూపుతుంది; ‘అతడే’ అని అనవసరంగా అధిక బలం చేర్చదు.
- source_word: πολλῷ μᾶλλον
  choice: ఇంకా ఎక్కువగా
  rationale: తులనాత్మక తీవ్రతను నిలుపుతుంది; మూలంలో ప్రత్యక్షంగా లేని ‘బిగ్గరగా’ అనే భావాన్ని చేర్చదు.
- source_word: ἔκραζεν
  choice: కేకలు వేస్తూనే ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాలంలోని నిరంతర లేదా పునరావృత చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Υἱὲ Δαυίδ
  choice: దావీదు కుమారుడా
  rationale: సంబోధన రూపాన్నీ దావీదు సంబంధిత బిరుదునీ నేరుగా అనువదించి, దాని రాజవంశీయ మరియు మెస్సీయ సంబంధిత ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ἐλέησόν με
  choice: నన్ను కరుణించు
  rationale: అత్యవసరమైన విజ్ఞప్తిని సంక్షిప్తమైన, గౌరవప్రదమైన, సహజ తెలుగు ఆజ్ఞారూపంలో అందిస్తుంది.
theological_decisions:
- issue: Υἱὲ Δαυίδ అనే బిరుదు యొక్క మెస్సీయ ప్రాధాన్యం
  choice: ప్రధాన పాఠ్యంలో ‘దావీదు కుమారుడా’ అని బిరుదుగా అనువదించడం
  alternative: దీనిని కేవలం సాధారణ గౌరవ సంబోధనగా భావించడం లేదా వివరణాత్మక పదాలను పాఠ్యంలో చేర్చడం
  rationale: లూకా కథనంలో ఈ సంబోధన దావీదు వంశపు రాజు మరియు మెస్సీయ నిరీక్షణను సూచిస్తుంది. నేరుగా అనువదించడం ఆ ప్రాధాన్యాన్ని నిలుపుతూ, మూలపాఠ్యానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘మౌనంగా’, ‘కరుణించు’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను నిలుపుతాయి; వాక్య నిర్మాణం మాత్రం సహజంగా ఉంది.
