id: LUK.18.10
reference: Luke 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: te
  text: ఇద్దరు మనుషులు ప్రార్థించడానికి దేవాలయ ప్రాంగణంలోకి[a] ఎక్కి వెళ్లారు. వారిలో ఒకడు పరిసయ్యుడు, మరొకడు పన్ను వసూలు చేసేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదమైన ἱερόν దేవాలయపు లోపలి పరిశుద్ధస్థలాన్ని ప్రత్యేకంగా సూచించదు; అది దేవాలయ సముదాయం లేదా ప్రాంగణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: ఇద్దరు మనుషులు
  rationale: ἄνθρωποι ఇక్కడ ఇద్దరు పురుషులను సూచిస్తోంది; తరువాతి పుంలింగ ఏకవచన వర్ణనలు దీనిని నిర్ధారిస్తున్నాయి. ఆధునిక తెలుగులో ‘ఇద్దరు మనుషులు’ సహజంగా, లింగపరంగా యథార్థంగా ఉంది.
- source_word: ἀνέβησαν
  choice: వెళ్లారు
  rationale: ἀναβαίνω అక్షరార్థంగా ‘పైకి వెళ్లడం.’ యెరూషలేముకు లేదా దేవాలయానికి వెళ్లడంలో ఎత్తుకు వెళ్లే భావం ఉన్నప్పటికీ, తెలుగులో ‘పైకి వెళ్లారు’ ఇక్కడ అసహజంగా లేదా భవనపు పై అంతస్తుకు వెళ్లినట్లు అనిపించవచ్చు. అందువల్ల సందర్భానుకూలమైన ‘వెళ్లారు’ ఎంచుకోబడింది.
- source_word: εἰς τὸ ἱερὸν
  choice: దేవాలయ ప్రాంగణంలోకి[a]
  rationale: ἱερόν అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది. ‘దేవాలయ ప్రాంగణం’ ఆ భేదాన్ని ప్రధాన పాఠ్యంలోనే స్పష్టంగా ఉంచుతుంది; εἰς భావాన్ని ‘లోకి’ తెలియజేస్తుంది.
- source_word: προσεύξασθαι
  choice: ప్రార్థించడానికి
  rationale: అనిశ్చిత క్రియారూపం ఇక్కడ ఉద్దేశాన్ని సూచిస్తోంది. ‘ప్రార్థించడానికి’ నేరుగా, సహజంగా ఆ ప్రయోజనాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: వారిలో ఒకడు ... మరొకడు
  rationale: ఈ జంటలోని ఇద్దరిని పరస్పర విరుద్ధంగా గుర్తించే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు జతప్రయోగం ప్రతిబింబిస్తుంది.
- source_word: Φαρισαῖος
  choice: పరిసయ్యుడు
  rationale: ఈ యూదు మతవర్గానికి తెలుగులో స్థిరపడిన, సులభంగా గుర్తించగల రూపం.
- source_word: τελώνης
  choice: పన్ను వసూలు చేసేవాడు
  rationale: τελώνης పన్నులు లేదా సుంకాలు వసూలు చేసే వ్యక్తి. ఈ రూపం ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, పాతకాలిక పదప్రయోగాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ἱερόν మరియు ναός మధ్య భేదం
  choice: దేవాలయ ప్రాంగణం
  alternative: దేవాలయం
  rationale: ఈ వచనంలోని ἱερόν దేవాలయపు అంతర్గత పరిశుద్ధ స్థలాన్ని ప్రత్యేకంగా సూచించే ναός కాదు; విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది. అందువల్ల ‘ప్రాంగణం’ మూలపాఠ్య స్థలార్థాన్ని మరింత ఖచ్చితంగా కాపాడుతుంది.
- issue: ἄνθρωποι యొక్క లింగ సూచన
  choice: ఇద్దరు మనుషులు
  alternative: ఇద్దరు వ్యక్తులు
  rationale: ἄνθρωποι కొన్నిసార్లు సాధారణంగా ప్రజలను సూచించగలిగినా, ఈ సందర్భంలో తరువాత వచ్చే పుంలింగ గుర్తింపులు ఇద్దరు పురుషులనే సూచిస్తున్నాయి. ‘మనుషులు’ మూలపదానికి దగ్గరగా ఉండి సందర్భంలోని లింగాన్ని కూడా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పన్ను వసూలు చేసేవాడు’ స్పష్టత కోసం వాడబడింది; ‘దేవాలయ ప్రాంగణం’ మూలంలోని స్థలభేదాన్ని సహజంగా తెలియజేస్తుంది.
