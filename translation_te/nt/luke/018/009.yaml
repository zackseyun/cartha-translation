source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: te
  text: తాము నీతిమంతులమని తమపై తామే నమ్మకం ఉంచుకొని, మిగతావారిని తృణీకరించే కొందరికి ఆయన ఈ ఉపమానం కూడా చెప్పాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మిగతావారిని చిన్నచూపు చూసే’ / ‘ఇతరులను లెక్కచేయని.’
    reason: ἐξουθενοῦντας అనే పదానికి ఉన్న ‘తృణీకరించడం, చిన్నచూపు చూడడం, లెక్కచేయకపోవడం’ అనే సమీప భావాలను తెలియజేయడానికి.
lexical_decisions:
- source_word: Εἶπεν
  choice: చెప్పాడు
  rationale: λέγω అనే క్రియకు ‘అన్నాడు’ లేదా ‘చెప్పాడు’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ కర్మ ‘ఈ ఉపమానం’ కాబట్టి సహజమైన తెలుగులో ‘ఈ ఉపమానం చెప్పాడు’ అనడం సముచితం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన పదం. తెలుగు వాక్యప్రవాహంలో దాని భావం సహజంగానే వ్యక్తమవుతుంది; ‘కాని’ అని అనువదిస్తే మూలంలో లేని బలమైన వ్యత్యాసం కలుగుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: క్రియాభావానికి అదనపు భావాన్ని ఇచ్చే καίని ‘కూడా’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: πρός τινας
  choice: కొందరికి
  rationale: మాట్లాడే క్రియతో πρός వ్యక్తులను ఉద్దేశించిన శ్రోతలను సూచిస్తుంది. తెలుగులో ‘కొందరికి ... చెప్పాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: తమపై తామే నమ్మకం ఉంచుకొని
  rationale: పరిపూర్ణ కృదంతం స్థిరపడిన ఆత్మవిశ్వాసాన్ని సూచిస్తుంది; ἐφ’ ἑαυτοῖς ఆ నమ్మకం తమపైనే ఉందని తెలుపుతుంది. ‘తామే’ ఆ స్వీయాధార భావాన్ని ఉద్ఘాటిస్తుంది.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: తాము నీతిమంతులమని
  rationale: δίκαιοιలోని నైతిక-మతపరమైన భావాన్ని ‘నీతిమంతులు’ నిలుపుతుంది. సందర్భంలోని విమర్శను పదంలోనే కలిపేయకుండా, వారి స్వీయ అంచనాగా వాక్యం తెలియజేస్తుంది.
- source_word: ἐξουθενοῦντας
  choice: తృణీకరించే
  rationale: ἐξουθενέω అంటే ఒకరిని లెక్కలేనివారిగా భావించడం, నిరాకరించడం, చిన్నచూపు చూడడం. ‘తృణీకరించే’ దాని బలమైన క్రియాశీల భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τοὺς λοιπούς
  choice: మిగతావారిని
  rationale: λοιποί అంటే ‘మిగిలినవారు/ఇతరులు.’ ‘మిగతావారిని’ అనే రూపం మూలంలోని ‘the rest’ భావానికి దగ్గరగా ఉండి ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: τὴν παραβολὴν ταύτην
  choice: ఈ ఉపమానం
  rationale: సువార్తల సందర్భంలో παραβολήకు స్థిరమైన, సులభంగా గుర్తించదగిన తెలుగు పదం ‘ఉపమానం.’
theological_decisions:
- issue: స్వనీతిని విమర్శించే సందర్భంలో δίκαιοι అనువాదం
  choice: నీతిమంతులు
  alternative: న్యాయవంతులు / తామే సరైనవారమని
  rationale: గ్రీకు పదం స్వయంగా అవహేళనార్థకమైనది కాదు. ‘నీతిమంతులు’ అనే ప్రధాన బైబిలు పదాన్ని ఉంచడం వల్ల విమర్శను సందర్భమే తెలియజేస్తుంది; అనువాదం ముందుగానే వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘నీతిమంతులు,’ ‘ఉపమానం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, ‘మిగతావారు’ వంటి సహజ పదాలను ఉపయోగించాం.
