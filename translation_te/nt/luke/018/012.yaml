  text: νηστεύω δὶς τοῦ σαββάτου, ⸀ἀποδεκατῶ πάντα ὅσα κτῶμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: te
  text: నేను వారానికి రెండుసార్లు ఉపవాసం ఉంటాను[a]; నేను సంపాదించే ప్రతిదానిలో పదోవంతు ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘సబ్బాతుకు రెండుసార్లు’; ఇది ‘వారానికి రెండుసార్లు’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: ఉపవాసం ఉంటాను
  rationale: వర్తమానకాల క్రియ ఇక్కడ అలవాటుగా చేసే పనిని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: δὶς
  choice: రెండుసార్లు
  rationale: క్రియావిశేషణానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: τοῦ σαββάτου
  choice: వారానికి
  rationale: పదశః ‘విశ్రాంతిదినానికి/సబ్బాతుకు’ అయినా, కొయినే గ్రీకులో ఇది వారపు కాలచక్రాన్ని సూచించే నుడికారం; తెలుగులో ‘వారానికి రెండుసార్లు’ అర్థాన్ని అపార్థం లేకుండా తెలియజేస్తుంది.
- source_word: ἀποδεκατῶ
  choice: పదోవంతు ఇస్తాను
  rationale: క్రియలోని ‘దశమభాగం ఇవ్వడం’ అనే నిర్దిష్ట భావాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάντα ὅσα
  choice: ప్రతిదానిలో
  rationale: ‘నేను సంపాదించేవన్నీ’ అనే సమగ్ర పరిధిని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κτῶμαι
  choice: నేను సంపాదించే
  rationale: మధ్యమ క్రియకు ఇక్కడ ‘సంపాదించు/పొందు’ అనే భావం ఉంది; స్థిరంగా కలిగి ఉండడంకన్నా పొందే ఆదాయం లేదా ఆస్తిని సూచించడానికి ‘సంపాదించే’ తగినది.
theological_decisions:
- issue: τοῦ σαββάτου అనే పదబంధం ఉపవాసపు తరచుదనాన్ని ఎలా సూచిస్తుంది
  choice: 'నుడికారపరమైన కాలార్థం: ‘వారానికి’'
  alternative: పదశః ‘సబ్బాతుకు చెందిన’ లేదా ‘విశ్రాంతిదినానికి’
  rationale: ఇది సబ్బాతు ఆచరణపై వేదాంత ప్రకటన కాదు; ఉపవాసం చేసే తరచుదనాన్ని తెలియజేస్తుంది. పదశః అనువదిస్తే అతడు సబ్బాతు రోజునే రెండుసార్లు ఉపవాసం ఉంటాడనే తప్పుదారి కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఉపవాసం ఉంటాను’ మరియు ‘పదోవంతు ఇస్తాను’ అనే రూపాలు మతపరమైన సందర్భాన్ని సహజంగా నిలుపుతాయి; మూలంలోని స్వీయవర్ణన ధోరణి అలాగే ఉంచబడింది.
