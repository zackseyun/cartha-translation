translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని వ్యత్యాసం, కారణ సంబంధం, భావతీవ్రత నిలుపబడ్డాయి.
