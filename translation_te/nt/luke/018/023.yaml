  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: te
  text: అయితే అతడు ఈ విషయాలు విన్నప్పుడు చాలా దుఃఖించాడు[a]; ఎందుకంటే అతడు అత్యంత ధనవంతుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తీవ్రంగా మనోవేదన చెందాడు.’ గ్రీకు విశేషణం గాఢమైన దుఃఖాన్ని లేదా మనోవేదనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: విన్నప్పుడు
  rationale: సందర్భంలో కాలసంబంధ భావాన్ని తెలిపే భూతకాల కృదంతం; అతడు వినడం, దానికి ప్రతిస్పందించడం అనే క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: బహువచన సూచన సర్వనామం యేసు ఇంతకు ముందు పలికిన విషయాలను సూచిస్తుంది; తెలుగులో ‘ఈ మాటలు’ సందర్భానికి సహజంగా ఉంది.
- source_word: περίλυπος
  choice: చాలా దుఃఖించాడు
  rationale: తీవ్రమైన దుఃఖం లేదా మనోవేదనను సూచిస్తుంది; సాధారణ పాఠకులకు సహజంగా ఉండేలా దాని తీవ్రతను నిలుపుతుంది.
- source_word: ἐγενήθη
  choice: దుఃఖించాడు
  rationale: ఒక స్థితిలోకి ప్రవేశించడాన్ని సూచించే భావాన్ని తెలుగు క్రియ సహజంగా వ్యక్తపరుస్తుంది; కేవలం ‘దుఃఖంగా ఉన్నాడు’ అనే స్థితివాచక రూపానికి బదులు ప్రతిస్పందనను తెలియజేస్తుంది.
- source_word: πλούσιος
  choice: ధనవంతుడు
  rationale: సంపద కలిగిన వ్యక్తిని సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: σφόδρα
  choice: అత్యంత
  rationale: అతని సంపద అధికమని బలంగా నొక్కిచెప్పే క్రియావిశేషణ తీవ్రతను నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి సంభాషణకు అతని ప్రతిస్పందనలోని వ్యత్యాసాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: అతని దుఃఖానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
