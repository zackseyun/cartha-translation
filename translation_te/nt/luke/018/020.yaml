id: LUK.18.20
reference: Luke 18:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: te
  text: '“ఆజ్ఞలు నీకు తెలుసు: ‘వ్యభిచారం చేయకు[a]; హత్య చేయకు; దొంగతనం చేయకు; అబద్ధ సాక్ష్యం చెప్పకు; నీ తండ్రినీ తల్లినీ గౌరవించు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సాంప్రదాయికంగా: “వ్యభిచారం చేయకూడదు; హత్య చేయకూడదు; దొంగతనం చేయకూడదు; అబద్ధ సాక్ష్యం చెప్పకూడదు.”'
    reason: పదప్రయోగ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: ఆజ్ఞలు
  rationale: ఇక్కడ ἐντολάς ప్రసిద్ధమైన పది ఆజ్ఞల్లోని ఆజ్ఞలను సూచిస్తుంది; ‘ఆజ్ఞలు’ అనే పదం వాటి అధికారపూర్వకమైన, లేఖనసంబంధమైన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: οἶδας
  choice: నీకు తెలుసు
  rationale: οἶδα రూపరీత్యా పరిపూర్ణ కాలంలో ఉన్నా, కోయినే గ్రీకులో వర్తమానార్థాన్ని ఇస్తుంది. ‘నీకు తెలుసు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: Μὴ μοιχεύσῃς
  choice: వ్యభిచారం చేయకు
  rationale: μοιχεύω వివాహ నమ్మకాన్ని ఉల్లంఘించే వ్యభిచారాన్ని నిర్దిష్టంగా సూచిస్తుంది. ఏకవచనంలో నేరుగా ఇచ్చిన నిషేధాజ్ఞను ‘చేయకు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Μὴ φονεύσῃς
  choice: హత్య చేయకు
  rationale: φονεύω సాధారణంగా ప్రాణం తీయడమంతటినీ కాక, హత్య చేయడాన్ని సూచిస్తుంది; అందువల్ల ‘హత్య’ మరింత కచ్చితమైన పదం.
- source_word: Μὴ κλέψῃς
  choice: దొంగతనం చేయకు
  rationale: κλέπτω యొక్క సూటి అర్థం దొంగతనం చేయడం; ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: అబద్ధ సాక్ష్యం చెప్పకు
  rationale: ψευδομαρτυρέω అబద్ధంగా సాక్ష్యమివ్వడాన్ని సూచిస్తుంది. ‘అబద్ధ సాక్ష్యం’ అనే పదబంధం పది ఆజ్ఞలతో ఉన్న అంతర్గ్రంథ సంబంధాన్ని నిలుపుతుంది.
- source_word: Τίμα
  choice: గౌరవించు
  rationale: τιμάω ఇక్కడ తల్లిదండ్రులకు తగిన గౌరవం ఇవ్వాలనే నైతిక, నిబంధనాత్మక భావాన్ని కలిగి ఉంది; ‘గౌరవించు’ దాన్ని సూటిగా అందిస్తుంది.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: నీ తండ్రిని, తల్లిని
  rationale: గ్రీకు రెండు తల్లిదండ్రులనూ నేరుగా పేర్కొంటుంది. తెలుగులో ‘నీ’ని ఒకసారి ఉపయోగించడం సహజంగా ఉండి, ఇద్దరికీ అది వర్తిస్తుందని స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: పది ఆజ్ఞల శైలిలోని నిషేధాలను ఎలా అనువదించాలి
  choice: 'ఆధునిక ప్రత్యక్ష ఏకవచన నిషేధ రూపాలు: ‘చేయకు’'
  alternative: 'సాంప్రదాయ నియమవాచక రూపాలు: ‘చేయకూడదు’'
  rationale: గ్రీకులో నిషేధార్థక aorist subjunctive రూపాలు ఒక వ్యక్తిని నేరుగా ఉద్దేశించిన ఆజ్ఞలుగా ఉన్నాయి. ‘చేయకు’ వాటి బలాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది; ‘చేయకూడదు’ మరింత సాంప్రదాయికమైన సాధారణ నియమశైలిని ఇస్తుంది. ఇది శైలికి సంబంధించిన నిర్ణయం, సిద్ధాంతపరమైనది కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అదే సమయంలో పది ఆజ్ఞల గంభీరతను నిలుపుతూ అనువదించబడింది. ఉద్దేశింపబడిన వ్యక్తి ఏకవచనంలో ఉన్నందున ‘చేయకు/గౌరవించు’ రూపాలు వాడబడ్డాయి.
