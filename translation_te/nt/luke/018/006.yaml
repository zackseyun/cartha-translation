id: LUK.18.6
reference: Luke 18:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: te
  text: 'ప్రభువు ఇలా అన్నాడు: “ఆ అన్యాయపరుడైన న్యాయాధిపతి ఏమి చెబుతున్నాడో వినండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: ఇలా అన్నాడు
  rationale: కథనంలోని భూతకాల క్రియను సహజమైన తెలుగు వాక్యారంభంగా అనువదిస్తుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సులభంగా పరిచయం చేస్తుంది.
- source_word: δὲ
  choice: ఇంకా
  rationale: δέ ఇక్కడ కథన కొనసాగింపును సూచిస్తుంది. ‘ఇంకా’ ఆ అనుసంధానాన్ని సహజమైన తెలుగులో చూపిస్తుంది; తప్పనిసరిగా కాలక్రమ భావాన్ని జోడించదు.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: లూకా కథనంలో ఇది యేసును సూచించే గౌరవార్థక బిరుదు. ‘ప్రభువు’ అనే పదం మూలంలోని బిరుదు బరువును నిలుపుతుంది.
- source_word: Ἀκούσατε
  choice: వినండి
  rationale: ఇది బహువచన ఆజ్ఞార్థకం; శ్రద్ధగా వినాలనే పిలుపును సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: τί
  choice: ఏమి
  rationale: న్యాయాధిపతి చెప్పే మాటల విషయాన్ని సూచిస్తుంది; ‘ఎలా’ అని అనువదిస్తే చెప్పే విధానం వైపు అర్థం మారుతుంది.
- source_word: ὁ κριτὴς
  choice: ఆ న్యాయాధిపతి
  rationale: ఉపమానంలో ముందే ప్రస్తావించిన నిర్దిష్ట న్యాయాధిపతిని గ్రీకు నిర్దిష్ట ఉపపదం సూచిస్తుంది; తెలుగులో ‘ఆ’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: τῆς ἀδικίας
  choice: అన్యాయస్థుడైన
  rationale: ‘అన్యాయానికి చెందిన’ అనే గ్రీకు గుణవాచక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, అతని నైతిక స్వభావాన్ని నిలుపుతుంది.
- source_word: λέγει
  choice: చెబుతున్నాడో
  rationale: గ్రీకు వర్తమానకాలంలోని సజీవతను తెలుగు వర్తమాన కొనసాగింపు రూపం నిలుపుతుంది; τίతో కలిసి పరోక్ష ప్రశ్నగా సహజంగా ఉంటుంది.
theological_decisions:
- issue: యేసును సూచించే κύριος పదం అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో లూకా యేసును కేవలం సామాజిక యజమానిగా కాక బిరుదుతో సూచిస్తున్నాడు. ‘ప్రభువు’ మూలంలోని క్రీస్తుసంబంధమైన బరువును నిలుపుతుంది; అదనపు సిద్ధాంతాన్ని చేర్చదు.
- issue: τῆς ἀδικίας యొక్క నైతిక పరిధి
  choice: అన్యాయస్థుడైన న్యాయాధిపతి
  alternative: అనీతిపరుడైన న్యాయాధిపతి
  rationale: ἀδικία న్యాయపరమైన అన్యాయంతో పాటు విస్తృత నైతిక దుష్టత్వాన్ని కూడా సూచించగలదు. ప్రధాన పాఠంలో సందర్భానికి సహజమైన ‘అన్యాయస్థుడు’ ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి ఆ అర్థ పరిధిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. బహువచన ఆజ్ఞార్థకమైన ‘వినండి’ శ్రోతల సమూహాన్ని ప్రతిబింబిస్తుంది. ‘న్యాయాధిపతి’ సాధారణ పాఠకుడికి అర్థమయ్యే, సందర్భానికి తగిన న్యాయపదం.
