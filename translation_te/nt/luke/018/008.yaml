id: LUK.18.8
reference: Luke 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: te
  text: 'మీతో చెబుతున్నాను: ఆయన వారికి త్వరగా న్యాయం చేస్తాడు.[a] అయినా, మనుష్యకుమారుడు వచ్చినప్పుడు భూమిమీద విశ్వాసాన్ని నిజంగా కనుగొంటాడా?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారిని న్యాయపరంగా సమర్థిస్తాడు,’ లేదా ‘వారి పక్షాన న్యాయం చేస్తాడు.’ గ్రీకు పదబంధం న్యాయపరంగా న్యాయం చేయడం లేదా ఒకరి పక్షాన తీర్పు ఇవ్వడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘విశ్వాసం’ అనే గ్రీకు పదం ‘నమ్మకం’ లేదా ‘విశ్వసనీయత’ అనే భావాలను కూడా సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: వారికి న్యాయం జరిగేలా చేస్తాడు
  rationale: విధవరాలి న్యాయవిన్నపం అనే సందర్భంలో, ఈ పదబంధం ప్రతీకారంకన్నా వారి పక్షాన న్యాయం చేయడం లేదా న్యాయపరమైన సమర్థన కలిగించడం అనే భావాన్ని ఇస్తుంది.
- source_word: ἐν τάχει
  choice: త్వరగా
  rationale: కాలపట్టికగా ‘త్వరలో’ అని మరీ నిర్దిష్టం చేయకుండా, కార్యం వేగంగా లేదా ఆలస్యం లేకుండా జరుగుతుందనే భావాన్ని కాపాడుతుంది.
- source_word: πλὴν
  choice: అయినా
  rationale: ముందున్న న్యాయ హామీకి తరువాతి పరిశీలనాత్మక ప్రశ్నకు మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు స్వీయ నిర్దేశానికి స్థిరపడిన తెలుగు రూపం; దాని బిరుదు స్వభావాన్ని, దానియేలు 7తో ఉన్న అనుబంధాన్ని కాపాడుతుంది.
- source_word: ἐλθὼν
  choice: వచ్చినప్పుడు
  rationale: కృదంతానికి ప్రధాన క్రియతో ఉన్న కాలసంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἆρα
  choice: నిజంగా
  rationale: ప్రశ్నలోని పరిశీలనాత్మక, హృదయాన్ని పరీక్షించే బలాన్ని తెలుగులో వినిపిస్తుంది.
- source_word: τὴν πίστιν
  choice: విశ్వాసాన్ని
  rationale: πίστις పదంలోని విశ్వాసం, నమ్మకం, విశ్వసనీయత అనే భావపరిధిని ప్రధాన పాఠంలో అనవసరంగా సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: అంత్యకాల సంబంధమైన వాక్యానికి సరిపోయే సహజమైన విశ్వవ్యాప్త అర్థాన్ని ఇస్తుంది; ‘దేశంలో’ అనే పరిమిత అర్థాన్ని బలవంతంగా చేర్చదు.
theological_decisions:
- issue: ఈ సందర్భంలో πίστις అనేది ‘విశ్వాసం’, ‘నమ్మకం’, లేదా ‘విశ్వసనీయత’గా అర్థమయ్యే అవకాశం
  choice: విశ్వాసం
  alternative: నమ్మకం లేదా విశ్వసనీయత
  rationale: ప్రధాన పాఠంలో విస్తృతమైన పదాన్ని ఉంచి, నిరంతర ప్రార్థనలో వ్యక్తమయ్యే నమ్మకం లేదా విశ్వసనీయత అనే సందర్భోచిత అవకాశాలను పాదటిప్పణిలో కాపాడుతుంది; ఏ ఒక్క సిద్ధాంతపరమైన అర్థాన్నీ బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మీతో చెబుతున్నాను’ మూలంలోని బహువచన ὑμῖνను ప్రతిబింబిస్తుంది. ప్రశ్నలోని ఉద్వేగాన్ని కాపాడేందుకు ‘నిజంగా’ ఉంచబడింది; [a], [b] గుర్తులు ప్రధాన పాఠంలో స్పష్టంగా చేర్చబడ్డాయి.
