- from: 'యేసు ఇది విని అతనితో ఇలా అన్నాడు: “నీకు ఇంకా ఒకటి కొదువగా ఉంది:[a] నీకు ఉన్నదంతా అమ్మి పేదవారికి పంచిపెట్టు. అప్పుడు పరలోకాల్లో[b] నీకు ధనం ఉంటుంది. ఆపై వచ్చి నన్ను అనుసరించు.”'
  to: 'యేసు ఇది విని అతనితో ఇలా అన్నాడు: “నీకు ఇంకా ఒకటి లోపిస్తోంది:[a] నీకు ఉన్నదంతా అమ్మి పేదవారికి పంచిపెట్టు; అప్పుడు పరలోకాల్లో[b] నీకు నిధి ఉంటుంది. రా, నన్ను అనుసరించు.”'
  rationale: The revision improves modern Telugu idiom and lexical precision while preserving the Greek syntax’s focus on one remaining deficiency, the comprehensive command, the plural ‘heavens,’ and the direct twofold summons. No doctrinal inference has been added.
