id: LUK.18.22
reference: Luke 18:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: te
  text: 'యేసు ఇది విని అతనితో ఇలా అన్నాడు: “నీకు ఇంకా ఒకటి లోపిస్తోంది:[a] నీకు ఉన్నదంతా అమ్మి పేదవారికి పంచిపెట్టు; అప్పుడు పరలోకాల్లో[b] నీకు నిధి ఉంటుంది. రా, నన్ను అనుసరించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు ఇంకా ఒకటి కొదువగా ఉంది.” గ్రీకు వాక్యం మరింత అక్షరార్థంగా, “నీకు ఇంకా ఒకటి లోపిస్తోంది” అని చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ఇక్కడ “పరలోకాలు” అనే బహువచనం ఉంది. తెలుగులో “పరలోకంలో” అని ఏకవచనంలో కూడా సహజంగా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: యేసు ఇది విని
  rationale: Aorist participle is naturally expressed by the Telugu conjunctive participle ‘విని’; ‘ఇది’ supplies the contextually understood object without adding new content.
- source_word: Ἔτι ἕν σοι λείπει
  choice: నీకు ఇంకా ఒకటి కొదువగా ఉంది
  rationale: This preserves ‘one thing’ as the grammatical subject and retains the Greek construction in natural, intelligible Telugu rather than shifting entirely to ‘నీలో ఒక లోపం ఉంది.’
- source_word: πάντα ὅσα ἔχεις πώλησον
  choice: నీకు ఉన్నదంతా అమ్మి
  rationale: ‘నీకు ఉన్నదంతా’ expresses the comprehensive force of πάντα ὅσα ἔχεις, and ‘అమ్మి’ links naturally with the following command to distribute.
- source_word: διάδος πτωχοῖς
  choice: పేదవారికి పంచిపెట్టు
  rationale: ‘పంచిపెట్టు’ conveys distribution or apportionment more specifically than the generic ‘ఇవ్వు.’
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: పరలోకాల్లో నీకు ధనం ఉంటుంది
  rationale: The plural ‘పరలోకాల్లో’ reflects οὐρανοῖς, while ‘ధనం’ communicates θησαυρός naturally in this promise without implying merely earthly money.
- source_word: δεῦρο ἀκολούθει μοι
  choice: ఆపై వచ్చి నన్ను అనుసరించు
  rationale: ‘వచ్చి ... అనుసరించు’ naturally represents both δεῦρο and the present imperative ἀκολούθει; ‘అనుసరించు’ carries the contextual force of continuing discipleship.
theological_decisions:
- issue: శిష్యత్వం మరియు ఆస్తి త్యాగం మధ్య సంబంధం
  choice: ఈ వ్యక్తికి ఉద్దేశించిన యేసు స్పష్టమైన ఆజ్ఞను, చివరలో శిష్యత్వ పిలుపుతో సహా, యథాతథంగా ఉంచడం
  alternative: ఇది ప్రతి విశ్వాసికి తప్పనిసరి సంపూర్ణ ఆస్తి విసర్జన అని చెప్పడం, లేదా ఆర్థిక అర్థం లేని కేవలం ప్రతీకాత్మక ఆజ్ఞగా మార్చడం
  rationale: Greek text directly commands this hearer to sell, distribute, come, and follow. The translation preserves that concrete force without extending or weakening it through an imported doctrinal conclusion.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘కొదువగా ఉంది’ మూలంలోని అసాధారణమైన కానీ ముఖ్యమైన నిర్మాణాన్ని నిలుపుతుంది; పాదసూచిక సహజమైన ప్రత్యామ్నాయాన్ని అందిస్తుంది. ప్రత్యక్ష సంభాషణలో ఏకవచన సంబోధన సందర్భానుసారంగా ఉంచబడింది.
