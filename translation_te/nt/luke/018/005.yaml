id: LUK.18.5
reference: Luke 18:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: te
  text: “అయినా, ఈ విధవరాలు నాకు ఇబ్బంది కలిగిస్తూనే ఉంది కాబట్టి, ఆమెకు న్యాయం కల్పిస్తాను[a]; ఆమె ఎడతెగకుండా వస్తూ నన్ను పూర్తిగా విసిగించకుండా ఉండేందుకు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆమె పక్షాన తీర్పు ఇస్తాను’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ కొన్ని సందర్భాల్లో ‘ఆమెకు ప్రతీకారం తీర్చుతాను’ అనే అర్థాన్నీ కలిగి ఉండవచ్చు; అయితే ఇక్కడ న్యాయస్థాన సందర్భంలో ఆమెకు న్యాయం కల్పించడం ప్రధాన భావం.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో పదశః, ‘నా కంటి కింద కొడుతుంది.’ ఇక్కడ అది ‘నన్ను పూర్తిగా అలసిపోయేలా చేస్తుంది’ లేదా ‘నన్ను విసిగిస్తుంది’ అనే రూపకార్థంలో ఉంది. ‘ఎడతెగకుండా’గా అనువదించిన గ్రీకు పదబంధానికి ‘చివరికి’ అనే అర్థం కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: నాకు ఇబ్బంది కలిగిస్తూనే ఉంది కాబట్టి
  rationale: διά + articular infinitive కారణాన్ని సూచిస్తుంది; γε దానికి బలాన్ని ఇస్తుంది. వర్తమాన infinitive కొనసాగుతున్న ఇబ్బందిని సూచిస్తున్నందున ‘కలిగిస్తూనే ఉంది’ అని అనువదించాం.
- source_word: τὴν χήραν ταύτην
  choice: ఈ విధవరాలు
  rationale: Demonstrative మరియు noun‌ను నేరుగా, సహజంగా అందిస్తుంది; ఉపమానంలో ఆమె సామాజిక బలహీనతను స్పష్టంగా ఉంచుతుంది.
- source_word: ἐκδικήσω αὐτήν
  choice: ఆమెకు న్యాయం జరిగేలా చేస్తాను
  rationale: న్యాయస్థాన సందర్భంలో ఇది వ్యక్తిగత ప్రతీకారంకంటే ఆమెకు న్యాయపరమైన పరిష్కారం లేదా సమర్థన కల్పించడాన్ని సూచిస్తుంది.
- source_word: εἰς τέλος ἐρχομένη
  choice: ఎడతెగకుండా వస్తూ
  rationale: న్యాయాధిపతి దృష్టిలో ఆమె రాక కొనసాగుతూనే ఉండడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. εἰς τέλος‌కు ‘చివరికి’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: ὑπωπιάζῃ με
  choice: నన్ను పూర్తిగా విసిగిస్తుంది
  rationale: పదశః ‘కంటి కింద కొట్టు’ అనే బలమైన చిత్రాన్ని కలిగిన ఈ క్రియ, ఇక్కడ పదేపదే ఒత్తిడి చేసి పూర్తిగా అలసటకు లేదా విసుగుకు గురిచేయడం అనే రూపకార్థంలో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: న్యాయం/ప్రతీకారం అనే ἐκδικέω భావభేదం
  choice: ఆమెకు న్యాయం జరిగేలా చేస్తాను
  alternative: ఆమెకు ప్రతీకారం తీర్చుతాను; ఆమె పక్షాన తీర్పు ఇస్తాను
  rationale: ఇది న్యాయపరమైన ఫిర్యాదు సందర్భం. అందువల్ల ప్రతీకార భావాన్ని ముందుకు తేవకుండా, న్యాయం మరియు సమర్థన రెండింటికీ చోటిచ్చే రూపాన్ని ఎంచుకున్నాం.
- issue: ὑπωπιάζῃ అనే క్రియను శారీరక దాడిగా లేదా రూపకంగా అర్థం చేసుకోవడం
  choice: నన్ను పూర్తిగా విసిగిస్తుంది
  alternative: నా కంటి కింద కొడుతుంది; నన్ను పూర్తిగా అలసిపోయేలా చేస్తుంది
  rationale: ఉపమాన సందర్భంలో నిరంతర వేధింపుతో న్యాయాధిపతిని నీరసింపజేయడం ప్రధాన భావంగా కనిపిస్తుంది; అయితే మూలంలోని శారీరక చిత్రణను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. న్యాయస్థాన భావాన్ని సహజంగా ఉంచుతూ, గ్రీకు మూలంలోని బలమైన రూపకం మరియు εἰς τέλος అర్థసందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
