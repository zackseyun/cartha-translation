id: LUK.18.3
reference: Luke 18:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: te
  text: ఆ పట్టణంలో ఒక విధవరాలు కూడా ఉండేది. ఆమె అతని దగ్గరికి పదేపదే వచ్చి, “నా ప్రత్యర్థికి వ్యతిరేకంగా నాకు న్యాయం చేయండి[a]” అని అడుగుతూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా ప్రత్యర్థి విషయంలో నాకు న్యాయం జరిగేలా చేయండి,” లేదా “నా ప్రత్యర్థికి ఎదురుగా నా పక్షాన్ని సమర్థించండి.” గ్రీకు క్రియ ఇక్కడ వ్యక్తిగత ప్రతీకారం కంటే న్యాయపరమైన పరిష్కారం లేదా న్యాయస్థాపన పొందడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: విధవరాలు
  rationale: భర్త చనిపోయిన స్త్రీని సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదం; ఉపమానంలోని ఆమె సామాజిక స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: కూడా
  rationale: ఇక్కడ δὲ కథనాన్ని కొనసాగిస్తూ న్యాయాధిపతితో పాటు అదే పట్టణంలోని విధవరాలిని పరిచయం చేస్తుంది; ‘కూడా’ తెలుగులో ప్రవాహాన్ని సహజంగా ఉంచుతుంది, బలమైన వ్యతిరేకతను అనవసరంగా చేర్చదు.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: ఆ పట్టణంలో ... ఉండేది
  rationale: అస్తిత్వార్థక నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో అందిస్తుంది; πόλις‌కు ‘పట్టణం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: ఆమె అతని దగ్గరికి పదేపదే వచ్చి
  rationale: అసంపూర్ణ భూతకాల రూపం సందర్భంలో పునరావృతమైన చర్యను సూచిస్తుంది; ‘పదేపదే’ ఆమె పట్టుదలను స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγουσα
  choice: అని అడుగుతూ ఉండేది
  rationale: ఆమె పదేపదే రావడంతో పాటు విన్నపం కూడా పునరావృతమైందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Ἐκδίκησόν με
  choice: నాకు న్యాయం చేయండి
  rationale: న్యాయస్థాన సందర్భంలో ἐκδικέω ప్రతీకారం తీర్చుకోవడం కంటే న్యాయపరమైన పరిష్కారం లేదా న్యాయస్థాపన చేయడాన్ని సూచిస్తుంది; ఈ అనువాదం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: నా ప్రత్యర్థికి వ్యతిరేకంగా
  rationale: ἀντίδικος న్యాయవివాదంలోని ఎదుటి పక్షాన్ని సూచిస్తుంది; ‘ప్రత్యర్థి’ న్యాయపరమైన భావాన్ని నిలుపుతుంది, ἀπόతో కూడిన సంబంధాన్ని ‘వ్యతిరేకంగా’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἐκδικέω అనే క్రియలో న్యాయస్థాపన మరియు ప్రతీకారం అనే సాధ్యార్థాలు
  choice: న్యాయస్థాన సందర్భానికి అనుగుణంగా ‘నాకు న్యాయం చేయండి’ అని అనువదించడం
  alternative: ‘నాకు న్యాయం జరిగేలా చేయండి’ లేదా ‘నా పక్షాన తీర్పు ఇవ్వండి’
  rationale: విధవరాలు న్యాయాధిపతిని ఆశ్రయిస్తున్నందున ప్రధాన భావం చట్టబద్ధమైన న్యాయం పొందడం. వ్యక్తిగత ప్రతీకారం అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, మూలంలోని విస్తృత భావపరిధిని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. న్యాయాధిపతిని ఉద్దేశించిన ఆజ్ఞారూపానికి సందర్భోచిత గౌరవబహువచనం ‘చేయండి’ వాడబడింది. పునరావృత చర్యను ‘పదేపదే’ మరియు ‘అడుగుతూ ఉండేది’ ద్వారా సహజంగా వ్యక్తపరిచాం.
