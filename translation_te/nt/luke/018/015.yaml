source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: te
  text: ఆయన వారిని తాకడానికి పసిబిడ్డలను సైతం ఆయన దగ్గరకు తీసుకొస్తూ ఉన్నారు[a][c]. కానీ శిష్యులు చూసి వారిని[b] గద్దించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శిశువులను.’ గ్రీకు పదం చాలా చిన్న పిల్లలను, ప్రత్యేకంగా పసిబిడ్డలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, పసిబిడ్డలను యేసు దగ్గరకు తీసుకొస్తున్నవారిని.
    reason: lexical_alternative
  - marker: c
    text: సమాంతర వృత్తాంతాల్లో యేసు పిల్లలను తాకడం వారిని ఆశీర్వదించడం, వారిపై చేతులు ఉంచడం అనే చర్యలతో ముడిపడి ఉంది (మత్తయి 19:13; మార్కు 10:13, 16 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: తీసుకొస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న చర్యను సూచిస్తుంది; అందువల్ల సాధారణ భూతకాలం కంటే ఈ ప్రయోగం మూలంలోని భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే (రెండవ సందర్భంలో); మొదటి సందర్భంలో ప్రత్యేక పదం లేకుండా కథన ప్రవాహంలో కలిపింది
  rationale: మొదటి δὲ స్వల్ప కథన అనుసంధానకంగా ఉంది; తెలుగులో దానికి బలవంతంగా పదం చేర్చడం సహజంగా ఉండదు. రెండవ δὲ శిష్యుల ప్రతిస్పందనలోని వ్యత్యాసాన్ని చూపుతుంది కాబట్టి ‘అయితే’ అని అనువదించబడింది.
- source_word: καὶ
  choice: సైతం
  rationale: ఇక్కడ καὶ కేవలం ‘కూడా’ అనే చేరికకంటే, పసిబిడ్డలవరకూ తీసుకొచ్చారనే ఉద్ఘాటనను ఇస్తుంది.
- source_word: τὰ βρέφη
  choice: పసిబిడ్డలను
  rationale: βρέφη చాలా చిన్న వయస్సు గల పిల్లలను, ముఖ్యంగా శిశువులను సూచిస్తుంది. ‘పసిబిడ్డలు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ వయస్సు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: ఆయన వారిని ముట్టుకోవాలని
  rationale: ἵνα ఉద్దేశాన్ని తెలియజేస్తుంది; ἅπτομαι నేరుగా ‘ముట్టుకొను/తాకు’ అని అర్థం. ఆశీర్వదించడమనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἰδόντες
  choice: అది చూసి
  rationale: అనంతరంగా జరిగిన శిష్యుల ప్రతిస్పందనతో ఈ భూతకాల క్రియావిశేషణ రూపాన్ని సహజమైన తెలుగులో కలుపుతుంది; ‘అది’ వారు చూసిన మొత్తం చర్యను సూచిస్తుంది.
- source_word: ἐπετίμων
  choice: గద్దించారు
  rationale: ἐπιτιμάω లోని బలమైన మందలింపు భావాన్ని ‘గద్దించారు’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారిని
  rationale: గ్రీకు సర్వనామాన్ని ప్రధాన పాఠ్యంలో సర్వనామంగానే ఉంచి, దాని సహజ పూర్వపదమైన పసిబిడ్డలను తీసుకొస్తున్నవారిని పాదసూచికలో స్పష్టం చేసింది.
theological_decisions:
- issue: యేసు పసిబిడ్డల పట్ల చేయబోయిన కార్య స్వభావం
  choice: ముట్టుకోవాలని
  alternative: ఆశీర్వదించాలని / చేతులు ఉంచాలని
  rationale: లూకా ఇక్కడ వాడిన ἅπτηται అనే క్రియ నేరుగా ‘ముట్టుకోవడం’ అని చెబుతుంది. సమాంతర వృత్తాంతాల్లో ఆశీర్వాదం, చేతులు ఉంచడం కనిపించినప్పటికీ, ఆ విస్తృత భావాన్ని లూకా ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా పాదసూచికలో ఉంచడం మూలపాఠ్య నియంత్రణను, దాని మితభాషను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పసిబిడ్డలు,’ ‘ముట్టుకోవాలని,’ ‘గద్దించారు’ వంటి సాధారణ పాఠకులకు సులభమైన పదాలు ఎంచుకోబడ్డాయి. మూలంలోని కొనసాగుతున్న చర్యను ‘తీసుకొస్తూ ఉన్నారు’ నిలుపుతుంది; సర్వనామ పూర్వపదం మరియు స్పర్శకు సంబంధించిన విస్తృత సందర్భం పాదసూచికల్లో మాత్రమే వివరించబడ్డాయి.
