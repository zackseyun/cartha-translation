    issue: The directional force of εἰς is not explicit in ‘దేవుని రాజ్యంలో ప్రవేశించడం.’
    rationale: Although the existing phrasing is acceptable Telugu, ‘దేవుని రాజ్యంలోకి ప్రవేశించడం’ more closely reflects entry into the kingdom and remains idiomatic.
  revised_text: యేసు అతన్ని చూసి, “ధనసంపద ఉన్నవారు దేవుని రాజ్యంలోకి ప్రవేశించడం ఎంత కష్టం!” అన్నాడు.
