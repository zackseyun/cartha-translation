id: LUK.18.24
reference: Luke 18:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: te
  text: యేసు అతన్ని చూసి, “ధనసంపద ఉన్నవారు దేవుని రాజ్యంలోకి ప్రవేశించడం ఎంత కష్టం!” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: చూసి
  rationale: ὁράω యొక్క భూతకాల క్రియావిశేషణ రూపాన్ని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో వ్యక్తం చేసి, యేసు అతన్ని చూసిన తరువాత పలికాడనే సంబంధాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానకం. తెలుగులో వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ లేదా ‘కాని’ చేరిస్తే మూలంలో లేని కాల లేదా వ్యతిరేక ఛాయ బలపడవచ్చు.
- source_word: αὐτὸν
  choice: అతన్ని
  rationale: సందర్భంలోని ధనవంతుడైన అధికారిని సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: Πῶς δυσκόλως
  choice: ఎంత కష్టం
  rationale: ఈ కలయిక ఆశ్చర్యార్థక తీవ్రతను వ్యక్తం చేస్తుంది. ‘ఎంత కష్టం’ ఆధునిక తెలుగులో సహజంగా ఉండి, కష్టతను చెబుతుంది గాని అసాధ్యతగా మార్చదు.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: ధనసంపద ఉన్నవారు
  rationale: అక్షరార్థంగా ‘ధనం/ఆస్తులు కలిగినవారు.’ ‘ధనసంపద’ χρήματα యొక్క డబ్బు, ఆస్తులు అనే విస్తృత భావాన్ని అందిస్తూ, కేవలం ఒక వర్గనామంగా సంక్షిప్తం చేయకుండా మూలంలోని నిర్మాణాన్ని నిలుపుతుంది.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో
  rationale: తెలుగులో ‘ప్రవేశించడం’తో ‘రాజ్యంలో’ సహజమైన ప్రయోగం; దేవుని రాజ్యం అనే సుపరిచిత బైబిలీయ పదబంధాన్ని నిలుపుతుంది.
- source_word: εἰσπορεύονται
  choice: ప్రవేశించడం
  rationale: వర్తమాన రూపంలోని సాధారణ సత్య భావాన్ని తెలుగులో క్రియానామ రూపంతో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ధనవంతులు దేవుని రాజ్యంలో ప్రవేశించడం గురించి యేసు మాటలోని బలం
  choice: ధనసంపద ఉన్నవారు ప్రవేశించడం ఎంతో కష్టమని తెలిపే సాధారణ ప్రకటన
  alternative: ధనవంతులు ప్రవేశించడం పూర్తిగా అసాధ్యమనే ప్రకటన
  rationale: గ్రీకు పాఠం ‘ఎంత కష్టం’ అని చెబుతుంది; ‘అసాధ్యం’ అని కాదు. అందువల్ల ఈ వచనంలోని ఉద్రిక్తతను పెంచకుండా యథాతథంగా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు క్రియావిశేషణ నిర్మాణాన్ని ‘చూసి’తో సంక్షిప్తంగా నిలుపుతూ, ఆశ్చర్యార్థక వాక్య బలాన్ని కాపాడింది.
