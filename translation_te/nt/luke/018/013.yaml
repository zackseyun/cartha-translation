revisions:
- from: అయితే పన్ను వసూలుదారుడు దూరంగా నిలబడి, తన కళ్లను ఆకాశం వైపు ఎత్తడానికి కూడా ఇష్టపడలేదు. బదులుగా, తన రొమ్ము కొట్టుకుంటూ, ‘దేవా, పాపినైన నన్ను కరుణించు[a]’ అని అన్నాడు.
  to: అయితే పన్ను వసూలుదారుడు దూరంగా నిలబడి, తన కళ్లను ఆకాశం వైపు ఎత్తడానికి కూడా ఇష్టపడలేదు. బదులుగా, తన ఛాతీని కొట్టుకుంటూ, ‘దేవా, పాపినైన నన్ను కరుణించు[a]’ అని ఇలా ప్రార్థించాడు.
  rationale: ప్రధాన పాఠంలో మూలంలోని భంగిమ, కొనసాగుతున్న ఛాతీ కొట్టుకోవడం, మరియు వినయపూర్వక ప్రార్థనను అలాగే ఉంచి, ‘రొమ్ము’ను ‘ఛాతీని’గా సహజీకరించాం. పాదసూచికను ‘పరిహారం చేసి’ అనే అతినిర్దిష్ట విస్తరణ నుండి, గ్రీకు క్రియకు తగిన ‘నాపట్ల ప్రసన్నుడవు’ అనే ప్రత్యామ్నాయానికి సవరించాం. దీనివల్ల కరుణ మరియు ప్రసన్నత/పాపపరిహార పదసంబంధం రెండూ నిలుస్తాయి.
