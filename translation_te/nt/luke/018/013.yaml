id: LUK.18.13
reference: Luke 18:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: te
  text: అయితే పన్ను వసూలుదారుడు దూరంగా నిలబడి, తన కళ్లను ఆకాశం వైపు ఎత్తడానికి కూడా ఇష్టపడలేదు. బదులుగా, తన ఛాతీని కొట్టుకుంటూ, ‘దేవా, పాపినైన నన్ను కరుణించు[a]’ అని ఇలా ప్రార్థించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాపట్ల ప్రసన్నుడవు.” ఇక్కడి గ్రీకు క్రియ పాపపరిహారం, దేవుని ప్రసన్నతకు సంబంధించిన పదసమూహంతో సంబంధముంది.
    reason: ἱλάσθητί యొక్క ‘be propitious to me’ అనే పదప్రత్యామ్నాయాన్ని తెలియజేస్తూ, పాపపరిహార సంబంధిత భావ ఛాయను నిర్దిష్ట సిద్ధాంతపరమైన విస్తరణ లేకుండా కాపాడుతుంది.
lexical_decisions:
- source_word: τελώνης
  choice: పన్ను వసూలుదారుడు
  rationale: ఆ కాలంలో పాలకుల తరఫున పన్నులు వసూలు చేసే వ్యక్తిని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; మూలంలోని సామాజిక అపఖ్యాతిని సందర్భమే వెల్లడించనిస్తుంది.
- source_word: μακρόθεν
  choice: దూరంగా
  rationale: అతడు ఇతరులకు, ముఖ్యంగా ప్రార్థిస్తున్న పరిసయ్యునికి దూరంగా నిలిచిన స్థానిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑστὼς
  choice: నిలబడి
  rationale: గ్రీకు కృదంతం తెలిపే శరీర భంగిమను సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: కూడా ఇష్టపడలేదు
  rationale: ఇది అసమర్థతను కాక సంకోచం లేదా సిగ్గుతో కూడిన సంకల్పాన్ని సూచిస్తుంది; θέλω యొక్క ఇచ్ఛార్థాన్ని కాపాడుతుంది.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: తన కళ్లను ఆకాశం వైపు ఎత్తడానికి
  rationale: దిశను, వినయంతో కూడిన భంగిమను స్పష్టంగా ఉంచుతూ గ్రీకు నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἔτυπτε
  choice: కొట్టుకుంటూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగిన లేదా పదేపదే చేసిన చర్యను తెలుగు కొనసాగింపు రూపం వ్యక్తం చేస్తుంది.
- source_word: τὸ στῆθος αὐτοῦ
  choice: తన రొమ్ము
  rationale: దుఃఖం, పశ్చాత్తాపం తెలిపే శరీర భంగిమకు సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: ἱλάσθητί μοι
  choice: నన్ను కరుణించు
  rationale: ప్రత్యక్ష ప్రార్థనలో సహజంగా, స్పష్టంగా ఉంటుంది; పాపపరిహారం లేదా దేవుని ప్రసన్నతకు సంబంధించిన క్రియా భావ ఛాయను పాదసూచికలో నిలుపుతుంది.
- source_word: τῷ ἁμαρτωλῷ
  choice: పాపినైన నన్ను
  rationale: తెలుగులో నిర్దిష్ట ఉపపదం లేకపోయినా, ‘పాపినైన’ అనే విశేషణ నిర్మాణం స్వీయనిందను, గ్రీకు సపద రూపంలోని ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἱλάσθητί μοι అనే ప్రార్థనను ఎలా అనువదించాలి
  choice: నన్ను కరుణించు
  alternative: నా పాపానికి పరిహారం చేసి నాపట్ల ప్రసన్నుడవు
  rationale: ఈ క్రియ కేవలం సాధారణ జాలిని మాత్రమే కాక, పాపపరిహారం ద్వారా దేవుని అనుగ్రహం కోరే భావాన్ని కూడా కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సులభమైన ప్రార్థనా భాషను ఉంచి, ఆ బలమైన ఆరాధనా-పాపపరిహార భావ ఛాయను పాదసూచికలో తెలియజేయడం మూలంలోని theological tension‌ను అతిగా నిర్ణయించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రార్థనకు తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘కరుణించు’ అనే రూపం ఆధునికంగా ఉండి కూడా గంభీరతను నిలుపుతుంది. మూలంలోని కొనసాగిన ఛాతి కొట్టుకోవడం, దూరంగా నిలవడం, కన్నులెత్తడానికి ఇష్టపడకపోవడం అన్నీ స్పష్టంగా నిలుపబడ్డాయి.
