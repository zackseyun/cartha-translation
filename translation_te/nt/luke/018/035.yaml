base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: te
  text: ఆయన యెరికోకు సమీపిస్తున్నప్పుడు[a], ఒకానొక అంధుడు[b] దారి పక్కన కూర్చుని భిక్ష అడుగుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన యెరికోకు దగ్గరవుతున్న వేళ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒక అంధుడు’; గ్రీకులోని τις అనే పదం ‘ఒకానొక’ అనే స్వల్ప భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ప్రత్యేక పదబంధంగా అనువదించలేదు
  rationale: ఇక్కడ ఈ గ్రీకు ప్రయోగం ప్రధానంగా కథనంలోని మార్పును సూచిస్తుంది; దానిని ‘అప్పుడు జరిగింది’ అని యథాపదంగా అనువదిస్తే సహజమైన తెలుగు ప్రవాహం దెబ్బతింటుంది.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: ఆయన యెరికోకు సమీపిస్తున్నప్పుడు
  rationale: ἐν తో కూడిన articular infinitive సమకాలీనంగా కొనసాగుతున్న చర్యను తెలియజేస్తుంది; εἰς నగరం వైపు కదలికను సూచిస్తుంది.
- source_word: τυφλός τις
  choice: ఒకానొక అంధుడు
  rationale: τις లోని అనిర్దిష్టతతో పాటు స్వల్పంగా వ్యక్తిని ప్రత్యేకించే భావాన్ని ‘ఒకానొక’ నిలుపుతుంది.
- source_word: ἐκάθητο
  choice: కూర్చొని … ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం నేపథ్యంలో కొనసాగుతున్న స్థితిని సూచిస్తుంది.
- source_word: παρὰ τὴν ὁδὸν
  choice: దారి పక్కన
  rationale: παρά ఇక్కడ దారికి ఆనుకొని ఉన్న స్థానాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἐπαιτῶν
  choice: భిక్ష అడుగుతూ
  rationale: ఈ వర్తమాన కృదంతం అతడు అప్పటికి చేస్తున్న యాచక క్రియను సూచిస్తుంది; ‘భిక్ష అడుగుతూ’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగు.
