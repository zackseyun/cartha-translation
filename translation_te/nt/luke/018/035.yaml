translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని కొనసాగుతున్న చర్యల భావాన్ని తెలుగు సంయుక్త క్రియారూపాలతో నిలిపాం.
