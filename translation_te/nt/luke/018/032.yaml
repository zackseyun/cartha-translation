  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: te
  text: ఎందుకంటే ఆయన అన్యజనులకు అప్పగించబడతాడు; ఆయనను ఎగతాళి చేస్తారు, అవమానకరంగా ప్రవర్తిస్తారు, ఆయనపై ఉమ్మివేస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అన్యజనులు’ అంటే ఇక్కడ యూదేతర ప్రజలు; మూలపదాన్ని అక్షరార్థంగా ‘ప్రజలు’ లేదా ‘దేశాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: అప్పగించబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, ఎవరికి అప్పగించబడుతున్నాడో తెలిపే సహజమైన తెలుగు ప్రయోగం. ‘ద్రోహం చేయబడతాడు’ అనడం ఈ సందర్భంలో భావాన్ని అనవసరంగా సంకుచితం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన దానికి ఈ వచనం వివరణ ఇస్తున్న సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: τοῖς ἔθνεσιν
  choice: అన్యజనులకు
  rationale: ఇక్కడ ἔθνη సాధారణంగా దేశాలను కాక, యూదేతర ప్రజలను సూచిస్తుంది; చారిత్రక సందర్భానికి ‘అన్యజనులు’ సరిపోతుంది.
- source_word: ἐμπαιχθήσεται
  choice: ఎగతాళి చేస్తారు
  rationale: ἐμπαίζωలోని హేళన, పరిహాస భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑβρισθήσεται
  choice: అవమానిస్తారు
  rationale: ὑβρίζω సూచించే అవమానకరమైన, దూషణాత్మక ప్రవర్తనను సంక్షిప్తంగా వ్యక్తపరుస్తుంది; కేవలం మాటల దూషణకే భావాన్ని పరిమితం చేయదు.
- source_word: ἐμπτυσθήσεται
  choice: ఆయన మీద ఉమ్మివేస్తారు
  rationale: చర్యలోని స్పష్టమైన అవమానాన్ని సహజమైన తెలుగు ప్రయోగంతో యథాతథంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కర్మణి క్రియలలో అంతర్నిహిత కర్త ఎవరనే విషయం
  choice: ముందటి సందర్భంలోని ‘మనుష్యకుమారుడు’ను సూచిస్తూ ‘ఆయన’ అని వ్యక్తం చేయడం
  alternative: తెలుగులో కర్తను పూర్తిగా సూచించకుండా కర్మణి క్రియలను మాత్రమే ఉంచడం
  rationale: గ్రీకులో ఈ వచనంలో కర్త ప్రత్యక్షంగా లేకపోయినా, లూకా 18:31లోని మనుష్యకుమారుడే స్పష్టమైన పూర్వపదం. ‘ఆయన’ను చేర్చడం కొత్త సిద్ధాంతార్థాన్ని జోడించకుండా తెలుగులో వాక్యాన్ని సహజంగా చేస్తుంది.
- issue: వరుస కర్మణి క్రియలను తెలుగులో ఎలా వ్యక్తం చేయాలి
  choice: మొదటి క్రియను కర్మణిలో ఉంచి, తరువాతి చర్యలకు అంతర్నిహిత బహువచన కర్తను ‘వారు’గా వ్యక్తం చేయడం
  alternative: అన్ని క్రియలనూ కర్మణి రూపాల్లో అనువదించడం
  rationale: గ్రీకు క్రియలన్నీ కర్మణిలో ఉన్నప్పటికీ, తెలుగులో వరుసగా కర్మణి రూపాలు భారంగా వినిపిస్తాయి. ‘వారు’ అనేది అన్యజనులను సహజంగా తిరిగి సూచిస్తుంది; చర్యల భావం మారదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను, సాధారణ పాఠకునికి స్పష్టతను సమతుల్యం చేశాం. ‘ఎగతాళి చేస్తారు, అవమానిస్తారు, ... ఉమ్మివేస్తారు’ అనే వరుస మూలంలోని పునరుక్త సంధాన నిర్మాణం మరియు అవమానాల తీవ్రతను సహజ తెలుగు లయలో నిలుపుతుంది.
