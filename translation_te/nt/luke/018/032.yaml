revisions:
- from: ఎందుకంటే ఆయన అన్యజనులకు అప్పగించబడతాడు; వారు ఆయనను ఎగతాళి చేస్తారు, అవమానిస్తారు, ఆయన మీద ఉమ్మివేస్తారు.[a]
  to: ఎందుకంటే ఆయన అన్యజనులకు అప్పగించబడతాడు; ఆయనను ఎగతాళి చేస్తారు, అవమానకరంగా ప్రవర్తిస్తారు, ఆయనపై ఉమ్మివేస్తారు.[a]
  rationale: ‘వారు’ను తొలగించి, మూలంలోని కర్మణి నిర్మాణం ఏజెంట్లను పేర్కొనకుండా ఉంచే విధానాన్ని కాపాడాం. ὑβρισθήσεταιలోని అవమానకరమైన దుర్వ్యవహార భావాన్ని విస్తృతంగా తెలియజేయడానికి ‘అవమానకరంగా ప్రవర్తిస్తారు’ను ఉపయోగించాం. పాదటిప్పణిలో ‘జనాలు’ స్థానంలో మరింత ప్రామాణికమైన ‘ప్రజలు’ను పెట్టాం.
