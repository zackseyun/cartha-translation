review_pass:
  verdict: revise
  source_fidelity: The opening passive, ‘అప్పగించబడతాడు,’ accurately reflects παραδοθήσεται, and ‘అన్యజనులకు’ appropriately conveys τοῖς ἔθνεσιν in this context. However, the explicit ‘వారు’ makes the Gentiles the stated agents of all following abuses. The Greek uses passive verbs throughout and does not explicitly identify the agents of the mockery, outrage, and spitting. Removing ‘వారు’ preserves this restraint while remaining natural Telugu.
  naturalness: The revised wording is fluent modern standard Telugu. Coordinated active-plural expressions without an explicit subject are idiomatic in Telugu and avoid the misleading antecedent created by ‘వారు.’
  terminology: ‘అన్యజనులు’ is suitable for Gentiles/non-Jewish people. ‘ఎగతాళి చేస్తారు’ accurately conveys mockery. ‘అవమానకరంగా ప్రవర్తిస్తారు’ better preserves the broader outrageously abusive sense of ὑβρισθήσεται than a term limited to verbal insult. ‘ఆయనపై ఉమ్మివేస్తారు’ is clear and idiomatic.
  issues:
  - severity: medium
    issue: The explicit pronoun ‘వారు’ assigns the subsequent actions to the Gentiles.
    rationale: The source has passive forms (ἐμπαιχθήσεται, ὑβρισθήσεται, ἐμπτυσθήσεται) and leaves the agents unstated. The supplied pronoun makes an interpretive identification that the Greek wording does not explicitly make.
  revised_text: ఎందుకంటే ఆయన అన్యజనులకు అప్పగించబడతాడు; ఆయనను ఎగతాళి చేస్తారు, అవమానకరంగా ప్రవర్తిస్తారు, ఆయనపై ఉమ్మివేస్తారు.[a]
