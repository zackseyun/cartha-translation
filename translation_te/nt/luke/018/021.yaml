  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: te
  text: అతడు, “వీటన్నిటినీ నేను నా యౌవనం నుంచే పాటిస్తూ వచ్చాను” అని అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “ఈ ఆజ్ఞలన్నిటినీ.” గ్రీకు పాఠ్యంలో అక్షరార్థంగా “వీటన్నిటినీ” అని మాత్రమే ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: అతడు ... అని అన్నాడు
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే సహజమైన కథన ప్రవాహంతో దీనిని వ్యక్తం చేయవచ్చు; వ్యతిరేక భావాన్ని అతిగా చూపలేదు.
- source_word: Ταῦτα πάντα
  choice: వీటన్నిటినీ
  rationale: గ్రీకులో ఉన్న ప్రదర్శక సర్వనామం మరియు πᾶς కలయికను నేరుగా ప్రతిబింబిస్తుంది. ముందరి సందర్భంలో ఆజ్ఞలు ఉద్దేశించబడినా, ఆ పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἐφύλαξα
  choice: పాటిస్తూ వచ్చాను
  rationale: φυλάσσω ఇక్కడ ఆజ్ఞలను ఆచరించడం లేదా పాటించడం అనే అర్థంలో ఉంది. గ్రీకు ఏఓరిస్ట్ రూపాన్ని యాంత్రికంగా సాధారణ భూతకాలంగా కాకుండా, యౌవనం నుండి ఇప్పటివరకు కొనసాగినట్లు వక్త చేస్తున్న వాదనను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ νεότητος μου
  choice: నా యౌవనం నుంచే
  rationale: ἐκ కాలారంభ బిందువును సూచిస్తుంది. 'యౌవనం నుంచే' అనేది మూలానికి సమీపంగా ఉండి ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సందర్భంలో ఆజ్ఞలు సూచించబడుతున్నప్పటికీ మూలంలో లేని నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
