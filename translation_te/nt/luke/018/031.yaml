id: LUK.18.31
reference: Luke 18:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: te
  text: 'ఆయన పన్నెండుమందిని తనతో తీసుకొని[a] వారితో ఇలా అన్నాడు: “చూడండి, మనం యెరూషలేముకు ఎక్కి వెళ్తున్నాం. మనుష్యకుమారుని గురించి ప్రవక్తల ద్వారా రాయబడినవన్నీ నెరవేరుతాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పన్నెండుమందిని పక్కకు తీసుకొని.” సందర్భం వ్యక్తిగత బోధనను సూచించవచ్చు; అయితే గ్రీకులో “పక్కకు” అనే పదం స్పష్టంగా లేదు.
    reason: translation_nuance
lexical_decisions:
- source_word: Παραλαβὼν
  choice: తనతో తీసుకొని
  rationale: παραλαμβάνω అనే క్రియ ఇక్కడ పన్నెండుమందిని వెంట తీసుకోవడాన్ని సూచిస్తుంది. సందర్భంలో ప్రత్యేకంగా వారితో మాట్లాడే భావం ఉన్నప్పటికీ, గ్రీకు పాఠ్యంలో ‘పక్కకు’ అనే పదం స్పష్టంగా లేదు; అందువల్ల దానిని ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో తెలిపాం.
- source_word: τοὺς δώδεκα
  choice: పన్నెండుమందిని
  rationale: మూలంలో ‘పన్నెండుమంది’ మాత్రమే ఉంది. ‘శిష్యులు’ అని చేర్చకుండా, యేసు సన్నిహిత వర్గానికి వాడిన స్థిరమైన సంజ్ఞను నిలిపాం.
- source_word: Ἰδοὺ
  choice: చూడండి
  rationale: శ్రద్ధను ఆకర్షించే సంభాషణ సూచకమైన ἰδού భావాన్ని ఆధునిక, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀναβαίνομεν
  choice: ఎక్కి వెళ్తున్నాం
  rationale: యెరూషలేమువైపు ప్రయాణాన్ని సూచించే వర్తమాన కాల భావంతో పాటు ἀνά లోని ఎక్కే భావాన్ని కూడా నిలుపుతుంది.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: τελεσθήσεται
  choice: నెరవేరుతాయి
  rationale: భవిష్యత్ కర్మణి రూపం, ప్రవచనాల్లో రాయబడినవి తమ ఉద్దేశిత పరిణతికి చేరుతాయని సూచిస్తుంది.
- source_word: πάντα τὰ γεγραμμένα
  choice: రాయబడినవన్నీ
  rationale: πάντα లోని సంపూర్ణతను, γεγραμμένα లోని రాయబడి నిలిచివున్న భావాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τῶν προφητῶν
  choice: ప్రవక్తల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధన లేదా మధ్యవర్తిత్వ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుని గురించి
  rationale: దత్తివిభక్తి నిర్మాణం అక్షరార్థంగా ‘మనుష్యకుమారునికి/కొరకు’ కావచ్చు; ఈ సందర్భంలో ప్రవక్తలు ఆయనను గురించి రాసినవి అనే సంబంధార్థం సహజంగా సరిపోతుంది. నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే క్రీస్తుసంబంధ బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: మూలంలోని బిరుదు నిర్మాణాన్ని, దానియేలు గ్రంథంతో ఉండగల అంతర్పాఠ్య సంబంధాన్ని, దాని ధార్మిక ఉద్రిక్తతను ‘మనుష్యకుమారుడు’ నిలుపుతుంది; సాధారణ మానవుడనే భావానికి కుదించదు.
- issue: τῷ υἱῷ τοῦ ἀνθρώπου అనే దత్తివిభక్తి సంబంధం
  choice: మనుష్యకుమారుని గురించి
  alternative: మనుష్యకుమారునికి / మనుష్యకుమారుని కొరకు
  rationale: తెలుగులో ప్రవచన రచనకు సంబంధించిన విషయార్థాన్ని ఇది సహజంగా తెలియజేస్తుంది. అయితే గ్రీకు దత్తివిభక్తి మరింత అక్షరార్థంగా ‘ఆయనకు/ఆయన కొరకు’ అని తీసుకునే అవకాశాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘చూడండి’, ‘ఎక్కి వెళ్తున్నాం’ వంటి రూపాలు మౌఖిక సందర్భాన్ని నిలుపుతాయి; ‘మనుష్యకుమారుడు’ అనే సంప్రదాయ బిరుదు అంతర్పాఠ్య, ధార్మిక బరువును కాపాడుతుంది.
