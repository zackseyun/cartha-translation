  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: te
  text: అప్పుడు పేతురు, “ఇదిగో, మేము మా సొంతమైనవాటిని[a] విడిచిపెట్టి నిన్ను అనుసరించాము” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మాకు చెందినవాటిని,” లేదా “మా ఆస్తులను.” గ్రీకు పదబంధం విస్తృతమైనది; పేతురు, ఇతరులు ఖచ్చితంగా దేనిని విడిచిపెట్టారో అది పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: అప్పుడు పేతురు … అన్నాడు
  rationale: δέ ఇక్కడ కథనాన్ని కొనసాగించే స్వల్ప మార్పును సూచిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది. Εἶπεν‌కు సాధారణ కథన రూపమైన ‘అన్నాడు’ సరిపోతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే ἰδού భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἡμεῖς
  choice: మేము
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్త సర్వనామాన్ని ఉంచి పేతురు మాటలోని స్వల్ప ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἀφέντες τὰ ἴδια
  choice: మాకు చెందినవాటిని విడిచిపెట్టి
  rationale: τὰ ἴδια అనేది ఇల్లు లేదా ఆస్తులకే పరిమితం కాని విస్తృత పదబంధం. ‘మాకు చెందినవాటిని’ ఆ విస్తృతతను కాపాడుతుంది; ἀφέντες‌ను తెలుగు వాక్య నిర్మాణానికి సహజంగా ‘విడిచిపెట్టి’ అని అనుసంధానించింది.
- source_word: ἠκολουθήσαμέν σοι
  choice: నిన్ను వెంబడించాము
  rationale: ἀκολουθέω యొక్క ప్రత్యక్ష ‘వెంబడించు’ భావంతో పాటు శిష్యత్వ సూచనను కూడా అనవసర వివరణ లేకుండా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని విస్తృతమైన τὰ ἴδια భావాన్ని ప్రధాన పాఠంలో సంకుచితం చేయకుండా, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
