review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative transition, Peter's explicit ‘we,’ the broad reference of τὰ ἴδια, and the completed actions. However, ‘వెంబడించాము’ commonly means ‘pursued/chased’ in modern Telugu and can misrepresent ἠκολουθήσαμεν, the ordinary discipleship verb ‘followed.’
  naturalness: The sentence is otherwise fluent modern standard Telugu. Replacing ‘వెంబడించాము’ with ‘అనుసరించాము’ is both more natural in this discipleship context and semantically precise. ‘మా సొంతమైనవాటిని’ is a natural broad rendering for τὰ ἴδια.
  terminology: ‘పేతురు,’ ‘ఇదిగో,’ and ‘అనుసరించాము’ are suitable in a respectful contemporary biblical register. The revision avoids narrowing τὰ ἴδια to material possessions.
  issues:
  - severity: medium
    issue: ‘నిన్ను వెంబడించాము’ for ἠκολουθήσαμέν σοι
    rationale: In current Telugu, వెంబడించు normally denotes pursuing or chasing someone. In this context ἀκολουθέω denotes following Jesus as disciples; ‘నిన్ను అనుసరించాము’ conveys that meaning without importing interpretation.
  revised_text: అప్పుడు పేతురు, “ఇదిగో, మేము మా సొంతమైనవాటిని[a] విడిచిపెట్టి నిన్ను అనుసరించాము” అన్నాడు.
