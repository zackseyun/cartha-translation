id: LUK.18.42
reference: Luke 18:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἀνάβλεψον· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: te
  text: మరియు యేసు అతనితో, “చూపు పొందు[a]; నీ విశ్వాసం నిన్ను రక్షించింది[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మళ్లీ చూపు పొందు.” స్వస్థత సందర్భంలో గ్రీకు ఆజ్ఞకు “మళ్లీ చూడు” అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నిన్ను బాగుచేసింది,” “నిన్ను స్వస్థపరిచింది.” గ్రీకు క్రియ రక్షణతో పాటు స్వస్థతను కూడా సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: సాధారణ కథన సంధానాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; కారణం లేదా ఫలితం అనే అదనపు భావాన్ని చేర్చదు.
- source_word: εἶπεν αὐτῷ
  choice: అతనితో … అన్నాడు
  rationale: పరోక్ష కర్మను నిలుపుకుంటూ గ్రీకు మాటల పరిచయాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది.
- source_word: Ἀνάβλεψον
  choice: చూపు పొందు
  rationale: ఈ స్వస్థత సందర్భంలో ఇది పైకి చూడమనే అర్థం కాక, చూపు కలగడం లేదా తిరిగి పొందడాన్ని సూచిస్తుంది. వ్యక్తికి ఇంతకుముందు చూపు ఉండేదని ప్రధాన పాఠంలో తప్పనిసరిగా నిర్ణయించకుండా ఉంటుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఇక్కడ యేసుపై ఆ వ్యక్తి ఉంచిన నమ్మకాన్ని సూచించే సాధారణ, గౌరవప్రదమైన తెలుగు పదం.
- source_word: σέσωκέν
  choice: రక్షించింది
  rationale: σῴζω అనే క్రియకు స్వస్థపరచడం, బాగుచేయడం, రక్షించడం అనే భావపరిధి ఉంది. ‘రక్షించింది’ అనేది శారీరక స్వస్థతతో పాటు లూకా రచనలో కనిపించే విస్తృత రక్షణ భావాన్నీ తెరిచి ఉంచుతుంది; పరిపూర్ణ కాలం వల్ల వచ్చిన ప్రస్తుత ఫలితాన్ని కూడా సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: స్వస్థత కథనంలో σῴζω యొక్క భావపరిధి
  choice: రక్షించింది
  alternative: బాగుచేసింది; స్వస్థపరిచింది
  rationale: సందర్భంలో శారీరక స్వస్థత స్పష్టంగా ఉన్నప్పటికీ, గ్రీకు క్రియ రక్షణ అనే విస్తృత భావాన్నీ మోయగలదు. అందువల్ల ఆ ఉద్దేశపూర్వక భావ ఉద్రిక్తతను సంకుచితం చేయకుండా ప్రధాన పాఠంలో ‘రక్షించింది’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణాన్ని వాడాం. రెండు నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో నిలిపాం.
