translation:
  language: te
  text: 'ఆయన ఇలా చెప్పాడు: “ఒక పట్టణంలో ఒక న్యాయాధిపతి ఉండేవాడు; అతడు దేవునికి భయపడని, మనుష్యులను గౌరవించని వాడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ మనిషినీ గౌరవించని.” గ్రీకులో “మనిషి” అనే పదం ఏకవచనంలో జాత్యర్థకంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: ఆయన ఇలా చెప్పాడు
  rationale: వర్తమాన కృదంతం మునుపటి వాక్యంతో అనుసంధానమై ఉపమానంలోని మాటలను పరిచయం చేస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం సమాపక క్రియగా అనువదించబడింది.
- source_word: Κριτής τις
  choice: ఒక న్యాయాధిపతి
  rationale: τις పేరు చెప్పని ఒక నిర్దిష్ట వ్యక్తిని సూచిస్తుంది; తెలుగు కథన శైలిలో ‘ఒక’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἦν ἔν τινι πόλει
  choice: ఒక పట్టణంలో ... ఉండేవాడు
  rationale: పాత్రను పరిచయం చేసే అస్తిత్వార్థక నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది; రెండవ τις కూడా ‘ఒక’గా నిలుపబడింది.
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: దేవునికి భయపడేవాడు కాదు
  rationale: న్యాయాధిపతి యొక్క స్థిర స్వభావాన్ని తెలిపే కృదంతాన్ని అలవాటు లేదా లక్షణాన్ని సూచించే తెలుగు క్రియారూపంతో వ్యక్తం చేస్తూ, ‘భయపడటం’లోని నైతిక-ఆధ్యాత్మిక భావాన్ని నిలుపుతుంది.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: మనుష్యులను లెక్కచేసేవాడు కాదు
  rationale: ఏ మానవునిపట్లా గౌరవం, పరిగణన లేదా సంకోచం లేని వైఖరిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది. గ్రీకు ఏకవచన ἄνθρωπον ఇక్కడ జాత్యర్థకంగా ఉంది.
theological_decisions:
- issue: దేవునితో వ్యతిరేకంగా వాడిన జాత్యర్థక ఏకవచన ἄνθρωπον
  choice: మనుష్యులను
  alternative: ఏ మనిషినీ
  rationale: గ్రీకు పదం వ్యాకరణపరంగా ఏకవచనమైనా ఇక్కడ మానవులను సాధారణంగా సూచిస్తుంది. ‘మనుష్యులను’ అనేది తెలుగులో సహజంగా ఆ సమగ్ర భావాన్ని ఇస్తుంది; మూలంలోని ఏకవచన రూపానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘న్యాయాధిపతి’ న్యాయపరమైన పాత్రను స్పష్టంగా తెలియజేస్తుంది; ‘లెక్కచేయడం’ ఇక్కడ గౌరవించడం లేదా పరిగణించడం అనే సందర్భార్థంలో వాడబడింది.
