translation:
  language: te
  text: అప్పుడు వారు అతనికి, “నజరేయుడైన యేసు ఇటుగా వెళ్తున్నాడు” అని చెప్పారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నజరేతుకు చెందిన యేసు ఇటుగా వెళ్తున్నాడు.” గ్రీకు వచనం మరింత అక్షరార్థంగా “నజరేయుడైన యేసు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: చెప్పారు
  rationale: సమాచారాన్ని తెలియజేయడం అనే భావాన్ని ఈ సంభాషణ సందర్భంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ స్వల్ప కథన అనుసంధానంగా ఉండి సంఘటనను ముందుకు నడిపిస్తుంది; వ్యతిరేకతను అనవసరంగా సూచించదు.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: దత్తివిభక్తిలోని పరోక్ష కర్మను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὅτι
  choice: “…” అని
  rationale: గ్రీకు వాక్యంలో నివేదిత విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ప్రత్యక్ష వాక్యంగా ఉంచడం సహజంగా ఉండి విషయార్థాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ὁ Ναζωραῖος
  choice: నజరేయుడైన
  rationale: గ్రీకులోని విశేషణాత్మక బిరుదు/గుర్తింపును ‘నజరేతుకు చెందిన’ అనే భౌగోళిక వివరణగా పూర్తిగా మార్చకుండా, తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: παρέρχεται
  choice: ఇటుగా వెళ్తున్నాడు
  rationale: ఆ క్షణంలో వారి సమీపంగా సాగిపోతున్న చర్యను వర్తమాన కొనసాగింపు రూపంలో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యేసుకు వాడిన Ναζωραῖος అనే గుర్తింపు
  choice: నజరేయుడైన
  alternative: నజరేతుకు చెందిన
  rationale: దీనిని అదనపు క్రీస్తుశాస్త్రీయ అర్థంతో విస్తరించకుండా, గ్రీకు రూపంలోని గుర్తింపును వీలైనంతగా కాపాడుతుంది; ప్రత్యామ్నాయం దాని భౌగోళిక భావాన్ని స్పష్టపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు designation‌ను ప్రధాన పాఠ్యంలో నిలిపి, మరింత వివరణాత్మక భౌగోళిక రూపాన్ని పాదటిప్పణిలో ఇచ్చింది.
