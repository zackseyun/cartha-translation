source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: te
  text: 'నేను మీతో నిజంగా చెబుతున్నాను: దేవుని రాజ్యాన్ని పిల్లలా స్వీకరించనివాడు[a] అందులో ఎంతమాత్రమూ ప్రవేశించడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిల్లగా.” ఈ పోలిక పిల్లవాని స్వీకరణశీలతను, నమ్మకాన్ని, వినయాన్ని లేదా ఆధారపడే స్థితిని సూచించవచ్చు; గ్రీకు మూలం ఖచ్చితంగా ఏ లక్షణాన్ని ఉద్దేశించిందో చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు మాటకు గంభీరమైన నిశ్చయతను ఇచ్చే ప్రారంభ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆమేన్’ అనే లిప్యంతరీకరణ వల్ల కలిగే అస్పష్టతను నివారిస్తుంది.
- source_word: ὃς ἂν μὴ δέξηται
  choice: స్వీకరించనివాడు
  rationale: ὃς ἂν సాధారణ, అనిర్దిష్ట షరతును సూచిస్తుంది; δέχομαι ఇక్కడ రాజ్యాన్ని స్వీకరించడం లేదా అంగీకరించడం అనే భావాన్ని ఇస్తుంది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యాన్ని
  rationale: మూలపదబంధాన్ని పారదర్శకంగా, తెలుగు బైబిలు వాడుకకు అనుగుణంగా అందిస్తుంది; ‘దేవుని పరిపాలన’ అనే సాధ్యమైన చలనార్థాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా ఎంచుకోదు.
- source_word: ὡς παιδίον
  choice: ఒక చిన్నపిల్లలా
  rationale: ὡς సూచించే పోలికను సహజంగా నిలుపుతుంది. παιδίον చిన్న వయసుగల బిడ్డను సూచించగలందున ‘చిన్నపిల్ల’ సందర్భానుకూలం; అయితే పోలికలోని నిర్దిష్ట లక్షణాన్ని అనువాదం నిర్ణయించదు.
- source_word: οὐ μὴ εἰσέλθῃ εἰς αὐτήν
  choice: అందులో ఎంతమాత్రమూ ప్రవేశించడు
  rationale: οὐ μή తో కూడిన బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ... డు’ ద్వారా వ్యక్తం చేస్తూ, αὐτήν దేవుని రాజ్యాన్ని తిరిగి సూచిస్తుందని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: దేవుని రాజ్యాన్ని ‘చిన్నపిల్లలా’ స్వీకరించడం యొక్క భావం
  choice: పోలికను వివరణ లేకుండా ప్రధాన పాఠ్యంలో యథాతథంగా నిలుపడం
  alternative: చిన్నపిల్ల వినయంతో / నమ్మకంతో / ఆధారపడే స్వభావంతో స్వీకరించడం; లేదా చిన్నపిల్లగా స్వీకరించడం
  rationale: గ్రీకు వాక్యం వినయం, నమ్మకం, ఆధారపడటం, స్వీకరణశీలతలలో ఏ ఒక్క లక్షణాన్నీ స్పష్టంగా నిర్దేశించదు. కాబట్టి అనువాదం ఆ భావపరమైన ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష వాక్య నిర్మాణం వాడబడింది. ‘ఎంతమాత్రమూ ప్రవేశించడు’ మూలంలోని బలమైన నిరాకరణను సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
