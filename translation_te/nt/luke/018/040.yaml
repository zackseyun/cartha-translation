  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: te
  text: 'అప్పుడు యేసు ఆగి, అతణ్ణి తన దగ్గరికి తీసుకురమ్మని ఆదేశించాడు.[a] అతడు యేసు దగ్గరికి వచ్చినప్పుడు, యేసు అతణ్ణి ఇలా అడిగాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి తన దగ్గరికి నడిపించి తీసుకురమ్మని.” ఇక్కడి గ్రీకు క్రియకు “తీసుకురావడం,” “నడిపించడం” అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: ఆగి
  rationale: ἵστημι యొక్క ఈ కర్తరి భావంతో వాడిన భూతకృదంతం సందర్భంలో యేసు తన నడకను నిలిపాడనే అర్థం ఇస్తుంది; ఆధునిక తెలుగులో ‘ఆగి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథన పురోగతిని సూచించే మృదు అనుసంధానం; ‘అప్పుడు’ తెలుగు కథనశైలికి సహజం.
- source_word: ἐκέλευσεν
  choice: ఆదేశించాడు
  rationale: κελεύωలోని అధికారపూర్వకంగా చెప్పే భావాన్ని ‘ఆదేశించాడు’ నిలుపుతుంది; ‘చెప్పాడు’ కంటే మూలంలోని బలం స్పష్టంగా ఉంటుంది.
- source_word: ἀχθῆναι
  choice: తీసుకురమ్మని
  rationale: ἄγω యొక్క కర్మణి అనంతరూపం అతణ్ణి ఇతరులు యేసు వద్దకు తీసుకురావాలని సూచిస్తుంది. తెలుగు పరోక్ష ఆజ్ఞ నిర్మాణంలో ‘తీసుకురమ్మని’ సహజం; ‘నడిపించుకొని రమ్మని’ కూడా సందర్భానుసారంగా సాధ్యం.
- source_word: πρὸς αὐτόν
  choice: తన దగ్గరికి
  rationale: πρός + ద్వితీయా విభక్తి యేసు వైపు కదలికను సూచిస్తుంది. ఒకే వాక్యంలో యేసునే సూచిస్తున్నందున ‘తన దగ్గరికి’ సహజమైన తెలుగు.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: అతడు దగ్గరికి వచ్చినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని కాలసంబంధాన్ని ‘వచ్చినప్పుడు’ తెలియజేస్తుంది; సర్వనామం ముందుగా ప్రస్తావించిన అంధుడిని సూచిస్తుంది.
- source_word: ἐπηρώτησεν αὐτόν
  choice: యేసు అతణ్ణి ఇలా అడిగాడు
  rationale: ἐπερωτάωకు ఇక్కడ సాధారణంగా ‘అడిగాడు’ సరిపోతుంది. గ్రీకులో కర్త సర్వనామంతో ఉన్నప్పటికీ తెలుగులో అస్పష్టత రాకుండా ‘యేసు’ను మళ్లీ పేర్కొన్నాం; తరువాతి ప్రత్యక్ష ప్రశ్నకు వాక్యం కొనసాగుతున్నందున ‘ఇలా’ను చేర్చాం.
