translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని అధికార భావం ‘ఆదేశించాడు’ ద్వారా నిలుపబడింది. వచనం తరువాతి ప్రత్యక్ష ప్రశ్నకు దారితీస్తున్నందున చివర ద్విబిందువు ఉంచబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
