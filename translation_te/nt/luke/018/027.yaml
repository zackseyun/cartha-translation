source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: te
  text: అయితే ఆయన, “మనుష్యులకు అసాధ్యమైనవి దేవునికి సాధ్యమైనవి” అని చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుష్యుల విషయంలో అసాధ్యమైనవి దేవుని విషయంలో సాధ్యమైనవి.”
    reason: παρά + చతుర్థీ విభక్తి ‘ఎవరి విషయంలో/పరిధిలో’ అనే సంబంధార్థాన్ని కూడా వ్యక్తం చేయగలదు; ప్రధాన పాఠంలోని ‘మనుష్యులకు … దేవునికి’ అదే భావానికి మరింత సహజమైన తెలుగు రూపం.
lexical_decisions:
- source_word: ἀδύνατα
  choice: అసాధ్యమైనవి
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది. ‘అసాధ్యమైనవి’ అనే రూపం దాని బహువచన భావాన్ని, మానవ సామర్థ్యానికి మించిన వాటిని సహజంగా తెలియజేస్తుంది.
- source_word: παρὰ ἀνθρώποις
  choice: మనుష్యులకు
  rationale: παρά + చతుర్థీ విభక్తి ఇక్కడ సంబంధం లేదా పరిధిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మనుష్యులకు’ అనేది ‘మానవుల విషయంలో/మానవ పరిధిలో’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δυνατὰ
  choice: సాధ్యమైనవి
  rationale: ἀδύναταకు ప్రత్యర్థ పదంగా, ఇదీ నపుంసక బహువచన నామార్థక ప్రయోగం. ‘సాధ్యమైనవి’ మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: παρὰ τῷ θεῷ
  choice: దేవునికి
  rationale: మొదటి παρά పదబంధంతో ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజమైన చతుర్థీ రూపంతో నిలుపుతుంది; దేవుని సామర్థ్య పరిధిలో అవి సాధ్యమనే భావం వస్తుంది.
- source_word: ὁ δὲ εἶπεν
  choice: అయితే ఆయన … అని చెప్పాడు
  rationale: δέ ఇక్కడ మునుపటి మాటకు ప్రతిస్పందనగా స్వల్ప వ్యత్యాసాన్ని లేదా కథన మార్పును సూచిస్తుంది. ‘అయితే’ ఆ సంబంధాన్ని గౌరవప్రదమైన సహజ తెలుగు కథనశైలిలో అందిస్తుంది.
theological_decisions:
- issue: దైవిక సాధ్యత యొక్క పరిధి
  choice: మానవులకు అసాధ్యమైనవి దేవునికి సాధ్యమైనవని, సందర్భంలోని విస్తృతమైన ప్రకటనను అలాగే ఉంచడం
  alternative: ప్రతి ఊహాత్మక కార్యానికీ వర్తించే సంపూర్ణ తాత్విక సూత్రంగా స్పష్టీకరించడం
  rationale: సందర్భం రక్షణను, ధనవంతుడు దేవుని రాజ్యంలో ప్రవేశించడాన్ని గురించి ఉంది. మూలవాక్యం మానవ అసమర్థతను దేవుని సామర్థ్యంతో పోలుస్తుంది; అనువాదం దానిని అదనపు తాత్విక పరిమితులు లేదా విస్తరణలు లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో మూలంలోని సమాంతర వ్యత్యాసం (‘అసాధ్యమైనవి / సాధ్యమైనవి’) మరియు గంభీరత నిలుపబడ్డాయి.
