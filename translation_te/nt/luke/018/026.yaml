translation:
  language: te
  text: అది విన్నవారు, “అయితే ఎవరు రక్షణ పొందగలరు?” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: అని అడిగారు
  rationale: గ్రీకులో సాధారణంగా ‘అన్నారు’ అనే అర్థమున్నా, ప్రశ్నను పలికిన సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘అని అడిగారు’ అనడం సంభాషణ ఉద్దేశాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనంలోని ప్రతిస్పందనను ముందుకు నడిపే సంధాయకం. తెలుగు వాక్య క్రమం, ప్రశ్నలోని ‘అయితే’ కలిసి ఆ మార్పును సహజంగా తెలియజేస్తాయి.
- source_word: οἱ ἀκούσαντες
  choice: అది విన్నవారు
  rationale: సుబంతీకృత భూతకాల కృదంతం యేసు ముందుగా చెప్పిన మాటను విన్నవారిని సూచిస్తుంది; సందర్భం నుంచి గ్రహించే కర్మను తెలుగులో ‘అది’గా సహజంగా చేర్చాం.
- source_word: Καὶ
  choice: అయితే
  rationale: ఇక్కడ καί ఆశ్చర్యంతో కూడిన కొనసాగింపు లేదా పరిణామాన్ని సూచిస్తుంది. పదశః ‘మరి’ కూడా సాధ్యమే; ‘అయితే’ ముందటి మాట వల్ల తలెత్తిన ప్రశ్నను సహజంగా చూపుతుంది.
- source_word: τίς
  choice: ఎవరు
  rationale: ఏ వ్యక్తి రక్షణ పొందడం సాధ్యమనే ప్రశ్నను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: δύναται
  choice: పొందగలరు
  rationale: సామర్థ్యం లేదా సాధ్యతను తెలిపే δύναται భావాన్ని ‘-గలరు’ సహజంగా మోస్తుంది.
- source_word: σωθῆναι
  choice: రక్షణ పొంద
  rationale: ఇది నిష్క్రియ అనంతక్రియ; రాజ్యంలో ప్రవేశం గురించిన సందర్భంలో ఆధ్యాత్మిక రక్షణ భావం ప్రధానమైనది. ‘రక్షణ పొందడం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
theological_decisions:
- issue: σωθῆναι పదానికి సందర్భానుగుణమైన భావం
  choice: రక్షణ పొందగలరు
  alternative: విడిపించబడగలరు / కాపాడబడగలరు
  rationale: సమీప సందర్భం ధనవంతుడు దేవుని రాజ్యంలో ప్రవేశించడం గురించి మాట్లాడుతోంది. కాబట్టి సాధారణ ప్రమాదం నుంచి కాపాడటం కంటే రక్షణశాస్త్ర సంబంధమైన భావమే ప్రధానంగా నిలుస్తుంది; అయితే రక్షణ ఎలా జరుగుతుందనే అదనపు సిద్ధాంత వివరణను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ఆశ్చర్యంతో కూడిన తార్కిక ప్రతిస్పందనను ‘అయితే’ ద్వారా నిలిపాం.
