  source_fidelity: 'The draft retains the principal elements: Simon Peter, his falling at Jesus’s knees, the request for separation, his confession as a sinful man, and the address κύριε. However, the direct-address term κύριε occurs at the end of the Greek utterance and should be retained there where natural in Telugu. The request is more directly represented by “నన్ను విడిచి వెళ్లిపో” than “నా దగ్గర నుంచి వెళ్లిపో.”'
  naturalness: The sentence is generally fluent modern Telugu. “పాపినైన మనిషిని” is understandable but somewhat awkward; “పాపభరితుడైన మనిషిని” is a more idiomatic formal-modern expression while preserving the explicit masculine noun ἀνήρ.
  terminology: “ప్రభువా” appropriately renders κύριε and preserves the source’s reverent ambiguity without forcing a doctrinal interpretation. “సీమోను పేతురు” is appropriate and retains both Greek names.
  issues:
  - severity: medium
    issue: The vocative “ప్రభువా” has been moved to the beginning of the quotation.
    rationale: Greek places κύριε after Simon Peter’s confession. Telugu can naturally preserve this final address, maintaining the source emphasis and sequence.
  - severity: low
    issue: “నా దగ్గర నుంచి వెళ్లిపో” is less direct than the source’s separation-from-me expression.
    rationale: “నన్ను విడిచి వెళ్లిపో” is idiomatic Telugu and more closely conveys Ἔξελθε ἀπ’ ἐμοῦ.
  - severity: low
    issue: “పాపినైన మనిషిని” is stylistically marked in modern Telugu.
    rationale: “పాపభరితుడైన మనిషిని” reads more naturally while retaining the masculine singular reference to Simon Peter.
  revised_text: అయితే సీమోను పేతురు అది చూసి, యేసు మోకాళ్ల దగ్గర పడి, “నన్ను విడిచి వెళ్లిపో; ఎందుకంటే నేను పాపభరితుడైన మనిషిని, ప్రభువా” అన్నాడు.
