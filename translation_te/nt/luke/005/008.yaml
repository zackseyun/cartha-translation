id: LUK.5.8
reference: Luke 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: te
  text: అయితే సీమోను పేతురు అది చూసి, యేసు మోకాళ్ల దగ్గర పడి, “నన్ను విడిచి వెళ్లిపో; ఎందుకంటే నేను పాపభరితుడైన మనిషిని, ప్రభువా” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: అది చూసి
  rationale: ఆరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియగా అనువదించాం. ‘అది’ అనే పదం గ్రీకులో స్పష్టంగా లేకపోయినా, సందర్భంలోని అసాధారణమైన చేపల పట్టును సూచిస్తూ తెలుగులో భావాన్ని స్పష్టం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో స్వల్పమైన మలుపును, ముందటి సంఘటన నుంచి పేతురు ప్రతిస్పందనకు మార్పును తెలియజేస్తుంది.
- source_word: Σίμων Πέτρος
  choice: సీమోను పేతురు
  rationale: గ్రీకు మూలంలో ఉన్న రెండు పేర్లనూ నిలిపి ఉంచాం.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: యేసు మోకాళ్ల దగ్గర పడి
  rationale: పేతురు యేసు ఎదుట ఆయన మోకాళ్ల సమీపంలో పడిన శరీర భంగిమను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: నా దగ్గర నుంచి వెళ్లిపో
  rationale: వేరుగా వెళ్లమనే అత్యవసర విజ్ఞప్తిని నేరుగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: పేతురు చేసిన విజ్ఞప్తికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: పాపినైన మనిషిని
  rationale: ἀνήρ యొక్క పురుషలింగ నిర్దిష్టతను ‘మనిషి’తో నిలిపి, ἁμαρτωλόςను సహజమైన విశేషణ రూపంలో ‘పాపినైన’గా ఇచ్చాం.
- source_word: κύριε
  choice: ప్రభువా
  rationale: గౌరవాన్ని, యేసు అధికారాన్ని గుర్తించే భావాన్ని, అలాగే ఈ సందర్భంలో ఉండగల లోతైన ధార్మిక సూచనను అతిశయింపకుండా నిలిపే సంబోధన.
theological_decisions:
- issue: పేతురు యేసును κύριε అని సంబోధించడం
  choice: ప్రభువా
  alternative: అయ్యా; గురువా
  rationale: అద్భుతానికి ప్రతిస్పందనగా పేతురు భయంతో తన పాపస్థితిని ఒప్పుకుంటున్న సందర్భంలో ‘ప్రభువా’ గౌరవాన్నీ సాధ్యమైన ధార్మిక లోతునూ నిలుపుతుంది; అయితే పేతురు అవగాహన పూర్తిగా వికసించిందని అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరతను నిలిపే వాక్య నిర్మాణం. సంభాషణలో పేతురు విజ్ఞప్తి, దానికి కారణం అనే గ్రీకు క్రమాన్ని సాధ్యమైనంతగా కాపాడాం.
