id: LUK.5.37
reference: Luke 5:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: te
  text: ఎవరూ కొత్త ద్రాక్షారసాన్ని పాత తోలు తిత్తుల్లో[a] పోయరు. లేకపోతే, కొత్త ద్రాక్షారసం ఆ తిత్తులను చీల్చివేస్తుంది; అది చిందిపోతుంది, తిత్తులు పాడైపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘పాత చర్మాల్లో.’ గ్రీకు పదం ద్రాక్షారసం వంటి ద్రవాలను ఉంచడానికి ఉపయోగించే జంతు చర్మంతో చేసిన పాత్రలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: పోయరు
  rationale: మూల క్రియకు సాధారణంగా ‘పెట్టడం’ అనే అర్థం ఉన్నా, ద్రవమైన ద్రాక్షారసాన్ని పాత్రలో ఉంచే సందర్భంలో ‘పోయడం’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: οἶνον νέον
  choice: కొత్త ద్రాక్షారసం
  rationale: వ్యవసాయ, కిణ్వ ప్రక్రియ నేపథ్యాన్ని స్పష్టంగా ఉంచే ప్రామాణిక తెలుగు సమానం.
- source_word: ἀσκοὺς παλαιούς
  choice: పాత తోలు తిత్తులు
  rationale: ἀσκός జంతు చర్మంతో చేసిన ద్రవపాత్రను సూచిస్తుంది; ‘తోలు తిత్తులు’ దాని రూపం, ఉపయోగం రెండింటినీ తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: εἰ δὲ μήγε
  choice: అలా పోస్తే
  rationale: ముందు చెప్పిన పని చేస్తే కలిగే ప్రతికూల ఫలితాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: ῥήξει
  choice: చీల్చివేస్తుంది
  rationale: కొత్త ద్రాక్షారసం వల్ల పాత తోలు తిత్తులు పగిలి తెరుచుకునే కారణార్థక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐκχυθήσεται
  choice: ఒలికిపోతుంది
  rationale: చీలిన పాత్ర నుంచి ద్రాక్షారసం అనుద్దేశపూర్వకంగా బయటకు పోయి నష్టమవుతుందనే సందర్భోచిత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπολοῦνται
  choice: పాడైపోతాయి
  rationale: పాత్రలు ఉపయోగానికి పనికిరాకుండా నాశనమవుతాయనే భావాన్ని, పూర్తిగా ఉనికి కోల్పోవడమని అతిగా చెప్పకుండా అందిస్తుంది.
- source_word: καὶ αὐτός
  choice: అది
  rationale: ఈ సర్వనామం కొత్త ద్రాక్షారసాన్నే తిరిగి సూచిస్తుంది; తెలుగులో ‘అది’ సహజంగా ఆ సూచనను నిలుపుతుంది.
- source_word: οὐδεὶς
  choice: ఎవరూ
  rationale: సామెత తరహా సార్వత్రిక నిరాకరణకు సహజమైన ఆధునిక తెలుగు రూపం.
