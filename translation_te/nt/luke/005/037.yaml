translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన సామెతసదృశ శైలి వాడబడింది. ‘తోలు తిత్తులు’ అనే సందర్భోచిత పదానికి వివరణాత్మక పాదసూచిక జోడించబడింది.
