  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: te
  text: వారు అలా చేసినప్పుడు, చాలా పెద్ద చేపల గుంపును వలల్లో చుట్టివేశారు[a]; వారి వలలు చినిగిపోతూ ఉన్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేక చేపలను పట్టుకున్నారు.” గ్రీకు క్రియకు మరింత అక్షరార్థంగా “చుట్టుముట్టారు” లేదా “లోపల బంధించారు” అనే భావం ఉంది; చేపలు వలల్లో చుట్టబడిన దృశ్యాన్ని అది చూపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి వలలు చినగడం మొదలయ్యాయి.” గ్రీకు ఇంపర్ఫెక్ట్ క్రియ చినగడం కొనసాగుతున్న ప్రక్రియగా చూపిస్తుంది; అవి అప్పటికే పూర్తిగా చినిగిపోయాయని తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: వారు అలా చేసినప్పుడు
  rationale: ముందటి ఆజ్ఞను వారు అమలు చేసిన తరువాత జరిగిన ఫలితాన్ని సూచించే ఏఓరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు కాలవాచక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: συνέκλεισαν
  choice: వలల్లో చుట్టివేశారు
  rationale: కేవలం ‘పట్టుకున్నారు’ అని కాకుండా, చేపలను వలలు చుట్టుముట్టి లోపల బంధించిన మూలపద చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πλῆθος ἰχθύων πολύ
  choice: విస్తారమైన చేపల సమూహాన్ని
  rationale: πλῆθος మరియు πολύ కలిపి తెలిపే అత్యధిక పరిమాణపు ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: διερρήσσετο
  choice: చినిగిపోతూ ఉన్నాయి
  rationale: ఇంపర్ఫెక్ట్ రూపం సూచించే కొనసాగుతున్న ప్రక్రియను నిలుపుతుంది; వలలు పూర్తిగా చినిగిపోయాయని చెప్పదు.
- source_word: τὰ δίκτυα αὐτῶν
  choice: వారి వలలు
  rationale: గ్రీకు మూలంలోని బహువచనాన్ని, స్వామ్యాన్ని సహజమైన తెలుగులో యథాతథంగా ఉంచుతుంది.
