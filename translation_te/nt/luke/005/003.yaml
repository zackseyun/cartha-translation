id: LUK.5.3
reference: Luke 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: te
  text: అప్పుడు ఆయన పడవలలో ఒకదానిలోకి ఎక్కాడు. అది సీమోనుకు చెందినది. పడవను ఒడ్డునుండి కొంచెం దూరం నడపమని ఆయన అతనిని అడిగాడు. తరువాత ఆయన కూర్చుని, పడవలోనుండి జనసమూహాలకు బోధిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβὰς
  choice: పడవలోకి ఎక్కాడు
  rationale: ἐμβαίνω పడవలో ప్రవేశించడాన్ని సూచిస్తుంది. తెలుగు కథనంలో ప్రధాన క్రియగా మార్చడం సహజంగా ఉండి, తదుపరి చర్యకు ముందున్న క్రమాన్ని నిలుపుతుంది.
- source_word: πλοίων / πλοίου
  choice: పడవలలో / పడవలోనుండి
  rationale: సరస్సులోని చేపల వేట వాహనాల సందర్భంలో ‘పడవ’ సహజమైనది; మూలంలోని బహువచనం, ఏకవచనం తగిన చోట్ల నిలుపబడ్డాయి.
- source_word: ὃ ἦν Σίμωνος
  choice: అది సీమోనుకు చెందినది
  rationale: Σίμωνος స్వామ్యాన్ని వ్యక్తం చేస్తుంది. ‘సీమోనుకు చెందినది’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἠρώτησεν
  choice: అడిగాడు
  rationale: ἐρωτάω ఇక్కడ అభ్యర్థించడాన్ని సూచిస్తుంది. ‘అడిగాడు’ అనవసరమైన అధికారికత లేకుండా భావాన్ని తెలియజేస్తుంది.
- source_word: ἐπαναγαγεῖν
  choice: దూరం తీసుకెళ్లమని
  rationale: పడవను ఒడ్డునుండి నీటిలోకి కొంత ముందుకు నడిపించడమే సందర్భార్థం. ‘తీసుకెళ్లమని’ తెలుగులో సహజంగా ఉండి, ἀπὸ τῆς γῆς మరియు ὀλίγονతో కలిసి దిశ, పరిమాణాన్ని స్పష్టం చేస్తుంది.
- source_word: ἀπὸ τῆς γῆς
  choice: ఒడ్డునుండి
  rationale: γῆ అక్షరార్థంగా ‘నేల/భూమి’; ఈ పడవ సందర్భంలో నీటికి విరుద్ధంగా ఉన్న తీరాన్ని సూచిస్తుంది. అందువల్ల ‘ఒడ్డునుండి’ సహజమైన సందర్భానువాదం.
- source_word: ὀλίγον
  choice: కొంచెం దూరం
  rationale: చిన్న పరిమాణాన్ని లేదా దూరాన్ని సూచించే క్రియావిశేషణ ప్రయోగం. పడవ కదలిక సందర్భంలో ‘కొంచెం దూరం’ స్పష్టంగా ఉంది.
- source_word: καθίσας
  choice: కూర్చుని
  rationale: బోధించడానికి ముందు జరిగిన చర్యను తెలుగు సంయుక్త క్రియారూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐδίδασκεν
  choice: బోధిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘బోధిస్తూ ఉన్నాడు’ ఆ ప్రగతిశీల భావాన్ని నిలుపుతుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలకు
  rationale: ὄχλους బహువచనాన్ని నిలుపుతూ, ఆధునిక గౌరవప్రద తెలుగులో ‘జనసమూహాలు’ సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రద కథనశైలి. గ్రీకులోని దీర్ఘ వాక్యాన్ని తెలుగులో సహజమైన మూడు వాక్యాలుగా విభజించాం. సందర్భానికి స్పష్టమైన ‘ఒడ్డు’ను ప్రధాన పాఠ్యంలో వాడినందున ఆంగ్ల సంప్రదింపు పాఠ్యంలోని భూమి/ఒడ్డు ప్రత్యామ్నాయ పాదసూచిక అవసరం లేదు.
