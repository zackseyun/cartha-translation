id: LUK.5.14
reference: Luke 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: te
  text: 'ఆయన అతనికి ఇలా ఆజ్ఞాపించాడు: “ఎవరికీ చెప్పవద్దు; కానీ వెళ్లి యాజకునికి నిన్ను చూపించుకొని, నీ శుద్ధీకరణ కొరకు మోషే ఆజ్ఞాపించిన విధంగా[b] అర్పణను సమర్పించు—వారికి సాక్ష్యంగా[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి సాక్ష్యంగా.” ‘వారికి’ అనేది యాజకులను లేదా ఇతరులను సూచించవచ్చు; కొందరు దీనిని వారికి వ్యతిరేకమైన సాక్ష్యమని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: కుష్ఠురోగం నుండి శుద్ధీకరణ పొందినప్పుడు మోషే ఆజ్ఞాపించిన అర్పణ గురించి లేవీయకాండము 14 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: ఆజ్ఞాపించాడు
  rationale: అదనపు తీవ్రతను చేర్చకుండా అధికారపూర్వకమైన ప్రత్యక్ష ఆదేశాన్ని తెలియజేస్తుంది.
- source_word: μηδενὶ εἰπεῖν
  choice: ఎవరికీ చెప్పవద్దు
  rationale: నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἀπελθὼν
  choice: వెళ్లి
  rationale: తదుపరి ఆజ్ఞకు ముందు జరిగే చర్యను తెలుగు సహజ క్రమంలో సంక్షిప్తంగా సూచిస్తుంది.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: యాజకునికి నిన్ను నీవు చూపించుకో
  rationale: గ్రీకు ఆజ్ఞార్థక క్రియను, ఆత్మార్థక సర్వనామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: προσένεγκε
  choice: అర్పణ సమర్పించు
  rationale: ఆరాధనా, బలిసంబంధ సందర్భాన్ని స్పష్టపరుస్తూ సాధారణ తెలుగు పాఠకునికి సహజంగా ఉంటుంది.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: నీ శుద్ధీకరణ కోసం
  rationale: అర్పణ ఏ విషయానికో సూచిస్తుంది; ధర్మశాస్త్ర సంబంధ శుద్ధిని తెలియజేస్తుంది.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: మోషే ఆజ్ఞాపించిన ప్రకారం
  rationale: మోషే ధర్మశాస్త్రంలోని నిర్దేశాన్ని నేరుగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: అది వారికి సాక్ష్యంగా ఉంటుంది
  rationale: ‘వారికి’ అనే అనిర్దిష్ట సూచనను, సాక్ష్యం అనుకూలమా ప్రతికూలమా అనే సందిగ్ధతను నిలుపుతుంది.
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς లోని ‘వారికి’ అనే పదం ఎవరిని సూచిస్తుంది, సాక్ష్యం స్వభావం ఏమిటి
  choice: ‘వారికి సాక్ష్యంగా’ అని అనిర్దిష్టంగానే ఉంచడం
  alternative: ‘యాజకులకు సాక్ష్యంగా’, ‘ప్రజలకు సాక్ష్యంగా’ లేదా ‘వారికి వ్యతిరేక సాక్ష్యంగా’
  rationale: గ్రీకు పాఠం ఆ సర్వనామం ఎవరిని సూచిస్తుందో, సాక్ష్యం అనుకూలమో ప్రతికూలమో నిర్దిష్టంగా చెప్పదు; అందువల్ల ఆ భావసందిగ్ధతను పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రత్యక్ష సంభాషణను ఉపయోగించి గ్రీకు వాక్యంలోని ఆజ్ఞల క్రమాన్ని నిలిపింది. ‘శుద్ధీకరణ’, ‘యాజకుడు’, ‘అర్పణ’, ‘సాక్ష్యం’ వంటి పదాలు ధర్మశాస్త్ర సందర్భానికి తగినవిగా, సాధారణ పాఠకునికి అర్థమయ్యేలా ఎంపికయ్యాయి.
