revisions:
- from: ఆయన అతనితో, “ఎవరికీ చెప్పవద్దు; అయితే వెళ్లి యాజకునికి నిన్ను నీవు చూపించుకో. నీ శుద్ధీకరణ కోసం మోషే ఆజ్ఞాపించిన ప్రకారం అర్పణ సమర్పించు[b]. అది వారికి సాక్ష్యంగా ఉంటుంది[a]” అని ఆజ్ఞాపించాడు.
  to: 'ఆయన అతనికి ఇలా ఆజ్ఞాపించాడు: “ఎవరికీ చెప్పవద్దు; కానీ వెళ్లి యాజకునికి నిన్ను చూపించుకొని, నీ శుద్ధీకరణ కొరకు మోషే ఆజ్ఞాపించిన విధంగా[b] అర్పణను సమర్పించు—వారికి సాక్ష్యంగా[a].”'
  rationale: The revision removes the unsupported future assertion, lets “వారికి సాక్ష్యంగా” function directly with the required offering, and improves the natural Telugu sequencing of the priestly presentation and offering. It does not identify “them” or determine whether the testimony is favorable or adverse.
