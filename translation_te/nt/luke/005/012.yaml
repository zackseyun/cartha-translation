id: LUK.5.12
reference: Luke 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: te
  text: 'ఆయన పట్టణాల్లో ఒకదానిలో ఉన్నప్పుడు ఇలా జరిగింది: ఇదిగో, ఒళ్లంతా కుష్ఠరోగం ఉన్న ఒక మనిషి అక్కడ ఉన్నాడు.[a] అతడు యేసును చూసి, ముఖం నేలకు ఆనించి పడిపోయి, “ప్రభూ, నీకు ఇష్టమైతే నన్ను శుద్ధి చేయగలవు[b]” అని ఆయనను వేడుకున్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో అక్షరార్థంగా “కుష్ఠరోగంతో నిండినవాడు.” ఇది అతని వ్యాధి తీవ్రతను నొక్కిచెబుతుంది. ప్రాచీన కాలంలోని ఈ పదం నేటి హాన్సెన్ వ్యాధితో మాత్రమే పరిమితం కాకుండా వివిధ తీవ్రమైన చర్మవ్యాధులను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నన్ను శుభ్రునిగా చేయగలవు.” ఇక్కడి క్రియ కేవలం శారీరక స్వస్థతనే కాకుండా ఆచారపరమైన శుద్ధిని, సమాజంలో తిరిగి చేర్చబడడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ఇలా జరిగింది
  rationale: లూకా ఉపయోగించిన కథన పరిచయ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων
  choice: ఆయన పట్టణాల్లో ఒకదానిలో ఉన్నప్పుడు
  rationale: కాలాన్ని సూచించే గ్రీకు నిర్మాణాన్ని సహజమైన ఉపవాక్యంగా, μιᾷ τῶν πόλεων భావాన్ని స్పష్టంగా అనువదిస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కొత్త దృశ్యంలోని ఆకస్మికతను, కథన ఉద్ఘాటనను నిలుపుతుంది.
- source_word: πλήρης λέπρας
  choice: ఒళ్లంతా కుష్ఠరోగం ఉన్న
  rationale: ‘కుష్ఠరోగంతో నిండిన’ అనే గ్రీకు తీవ్రతా భావాన్ని పదానువాదపు అసహజత లేకుండా సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: ముఖం నేలకు ఆనించి పడిపోయి
  rationale: వినయంతో, ఆర్తితో నేలపై బోర్లపడిన శారీరక భంగిమను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐδεήθη αὐτοῦ
  choice: ఆయనను వేడుకున్నాడు
  rationale: సాధారణంగా అడగడం కంటే ఆర్తితో చేసిన విన్నపాన్ని వ్యక్తపరుస్తుంది.
- source_word: Κύριε
  choice: ప్రభూ
  rationale: గౌరవపూర్వక సంబోధనను, సందర్భంలో ఉండగల క్రీస్తుసంబంధ ప్రతిధ్వనిని అతిశయింపజేయకుండా నిలుపుతుంది.
- source_word: ἐὰν θέλῃς
  choice: నీకు ఇష్టమైతే
  rationale: యేసు సామర్థ్యాన్ని కాదు, ఆయన సంకల్పాన్ని ఉద్దేశించిన షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δύνασαί με καθαρίσαι
  choice: నన్ను శుద్ధి చేయగలవు
  rationale: శారీరక స్వస్థతతో పాటు ఆచారపరమైన, సామాజిక పునరుద్ధరణ భావాలు కలిగిన καθαρίζωను కేవలం ‘నయం చేయడం’గా పరిమితం చేయదు.
theological_decisions:
- issue: λέπρα మరియు καθαρίζω పదాలను స్వస్థత సందర్భంలో అనువదించడం
  choice: ‘కుష్ఠరోగం’ మరియు ‘శుద్ధి చేయగలవు’
  alternative: ‘చర్మవ్యాధి’ మరియు ‘నయం చేయగలవు’
  rationale: λέπρα ప్రాచీన కాలంలో ఆధునిక హాన్సెన్ వ్యాధికన్నా విస్తృతమైన చర్మవ్యాధులను సూచించగలిగినా, ‘కుష్ఠరోగం’ సంప్రదాయపరంగా గుర్తించదగిన పదం. καθαρίζω శారీరక స్వస్థతతో పాటు ఆచారపరమైన, సామాజిక శుద్ధి భావాన్ని కూడా మోస్తుంది.
- issue: యేసును ఉద్దేశించిన κύριος సంబోధన
  choice: ప్రభూ
  alternative: అయ్యా / గురువా
  rationale: ‘ప్రభూ’ గౌరవపూర్వక సంబోధనను, సాధ్యమైన క్రీస్తుసంబంధ భావాన్ని రెండింటినీ నిలుపుతుంది; తక్షణ సందర్భం నిరూపించేదానికంటే ఎక్కువగా సిద్ధాంతార్థాన్ని నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ అనే ఉద్ఘాటక పదాన్ని మూలంలోని కథన సజీవత కోసం ఉంచాం; ‘శుద్ధి’ అనే పదాన్ని సందర్భంలోని శారీరక, ఆచారపరమైన ద్వంద్వార్థాన్ని కాపాడేందుకు ఉపయోగించాం.
