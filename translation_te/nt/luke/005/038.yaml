  edition: SBLGNT
  text: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινοὺς ⸀βλητέον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: te
  text: అయితే కొత్త ద్రాక్షారసాన్ని తాజా తోలుతిత్తుల్లో పోయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొత్త ద్రాక్షారసాన్ని కొత్త తోలుతిత్తుల్లో పోయాలి.” గ్రీకులో ద్రాక్షారసానికి νέος (ముఖ్యంగా కాలపరంగా ‘కొత్త’) అనే విశేషణం, తోలుతిత్తులకు καινός (ముఖ్యంగా గుణం లేదా స్థితిపరంగా ‘కొత్త/తాజా’) అనే వేరొక విశేషణం వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి వాక్యంలో సూచించిన తగని పద్ధతికి విరుద్ధంగా, ఇక్కడ సరైన పద్ధతిని తెలియజేసే సహజమైన వ్యతిరేక సంధానపదం.
- source_word: οἶνον νέον
  choice: కొత్త ద్రాక్షారసాన్ని
  rationale: νέον కాలపరంగా కొత్తదనాన్ని సూచిస్తూ οἶνον‌ను విశేషిస్తుంది; సందర్భంలో ఇది తాజాగా తయారైన ద్రాక్షారసాన్ని సూచిస్తుంది.
- source_word: εἰς
  choice: తోలుతిత్తుల్లో
  rationale: తెలుగులో ‘పోయాలి’ అనే క్రియతో కలిసినప్పుడు గమ్యపాత్రలోనికి కదలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀσκοὺς
  choice: తోలుతిత్తుల్లో
  rationale: ద్రవాలను, ముఖ్యంగా ద్రాక్షారసాన్ని, నిల్వ చేయడానికి ఉపయోగించే జంతుచర్మపు సంచులను ఆధునిక పాఠకునికి స్పష్టంగా సూచిస్తుంది.
- source_word: καινοὺς
  choice: తాజా
  rationale: νέος‌తో ఉన్న పదభేదాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, కొత్త ద్రాక్షారసానికి తగిన, ఇంకా వాడి గట్టిపడని తోలుతిత్తుల స్థితిని తెలియజేస్తుంది.
- source_word: βλητέον
  choice: పోయాలి
  rationale: ఈ క్రియావిశేషణం తెలిపే అవసరత లేదా చేయవలసిన పనిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ద్రవాన్ని పాత్రలో ఉంచడాన్ని ‘పోయడం’ సహజంగా చెబుతుంది.
theological_decisions:
- issue: ఒకే వాక్యంలో νέος మరియు καινός మధ్య భేదం
  choice: νέος‌ను ‘కొత్త’, καινός‌ను ‘తాజా’ అని అనువదించడం
  alternative: రెండింటినీ ‘కొత్త’ అని అనువదించడం
  rationale: గ్రీకు మూలంలో రెండు వేర్వేరు విశేషణాలు ఉన్నాయి. ‘కొత్త ద్రాక్షారసం—తాజా తోలుతిత్తులు’ అనే రూపం వాటి భేదాన్ని కొంతవరకు నిలుపుతూ, కొత్త ద్రాక్షారసానికి అనువైన, ఇంకా మృదువుగా ఉన్న తోలుతిత్తుల భావాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తోలుతిత్తులు’ ప్రాచీన చర్మపు ద్రవపాత్రలను స్పష్టంగా తెలియజేస్తుంది. ప్రధాన పాఠంలో రెండు గ్రీకు విశేషణాల భేదాన్ని ‘కొత్త/తాజా’గా నిలిపి, ప్రత్యామ్నాయంగా ‘కొత్త/కొత్త’ను పాదటిప్పణిలో ఇచ్చాం.
