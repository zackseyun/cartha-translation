- from: విస్మయం వారందరినీ ఆవరించింది. వారు దేవుణ్ణి మహిమపరుస్తూ, భయంతో నిండిపోయి, “ఈ రోజు మేము అసాధారణమైన సంగతులు[a] చూశాం” అన్నారు.
