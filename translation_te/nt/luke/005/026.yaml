id: LUK.5.26
reference: Luke 5:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: te
  text: విస్మయం వారందరినీ పట్టుకుంది. వారు దేవుణ్ణి మహిమపరుస్తూ, భయంతో నిండిపోయి, “ఈ రోజు మేము అసాధారణమైన సంగతులు[a] చూశాం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆశ్చర్యకరమైన సంగతులు” లేదా “వింతైన సంగతులు”; గ్రీకు పదం సాధారణంగా ఊహించేదానికి అతీతమైన సంగతులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις ἔλαβεν ἅπαντας
  choice: విస్మయం వారందరినీ ఆవరించింది
  rationale: ἔκστασις ఇక్కడ ఆధ్యాత్మిక పరవశం కంటే, జరిగిన దానివల్ల కలిగిన తీవ్రమైన ఆశ్చర్యాన్ని సూచిస్తుంది. ἔλαβεν అనే సజీవ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఆవరించింది’ అని ఇచ్చాం.
- source_word: ἐδόξαζον τὸν θεόν
  choice: వారు దేవుణ్ణి మహిమపరుస్తూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను ‘మహిమపరుస్తూ’ నిలుపుతుంది; δοξάζωకు ‘మహిమపరచడం’ సన్నిహితమైన, గౌరవప్రదమైన రూపం.
- source_word: ἐπλήσθησαν φόβου
  choice: భయంతో నిండిపోయి
  rationale: గ్రీకు నిష్క్రియ రూపాన్ని సహజంగా వ్యక్తం చేస్తూ, φόβοςను వ్యాఖ్యానాత్మకంగా ‘భక్తిభావం’గా మృదువుచేయకుండా ‘భయం’గానే ఉంచుతుంది.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: ఉద్ధరణను పరిచయం చేసే భాగధాతువు తెలుగులో ప్రధాన వాక్యాంత క్రియగా సహజంగా వ్యక్తమవుతుంది.
- source_word: Εἴδομεν
  choice: చూశాం
  rationale: ఇప్పుడే జరిగిన సంఘటనపై ప్రత్యక్ష ప్రతిస్పందనను సహజమైన తెలుగు భూతకాల రూపంలో తెలియజేస్తుంది.
- source_word: παράδοξα
  choice: అసాధారణమైన సంగతులు
  rationale: సాధారణంగా ఊహించేదానికి అతీతమైన విషయాలు అనే సందర్భార్థాన్ని తెలియజేస్తుంది; ప్రతికూల భావం కలిగించగల ‘వింతైనవి’ కంటే ఇది తటస్థంగా ఉంటుంది.
- source_word: σήμερον
  choice: ఈ రోజు
  rationale: సంఘటన జరిగిన దినాన్నే సూచించే కాల అవ్యయానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: దైవిక కార్యానికి ప్రతిస్పందనగా φόβος యొక్క భావఛాయ
  choice: ‘భయం’ అని నేరుగా అనువదించడం
  alternative: ‘భక్తితో కూడిన విస్మయం’ లేదా ‘భయభక్తులు’
  rationale: ఈ సందర్భంలో భయం, ఆరాధనాత్మక విస్మయం రెండూ కలిసివున్నప్పటికీ, మూలపాఠం φόβος అని స్పష్టంగా చెబుతుంది. అందువల్ల దానిని మృదువుచేయకుండా, భయానికీ దేవుణ్ణి మహిమపరచడానికీ మధ్యనున్న ఉద్వేగాన్ని అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని మరియు మూలంలోని విస్మయం–భయం–దేవుని మహిమపరచడం అనే క్రమాన్ని నిలుపుతూ రూపొందించబడింది.
