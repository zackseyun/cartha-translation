source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: te
  text: 'అప్పుడు శాస్త్రులు, పరిసయ్యులు తమలో తాము ఇలా ఆలోచించడం మొదలుపెట్టారు: “దేవదూషణలు పలుకుతున్న ఇతడు ఎవడు? దేవుడు తప్ప మరెవరు పాపాలను క్షమించగలరు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: తమలో తాము ఇలా ఆలోచించడం మొదలుపెట్టారు
  rationale: ἤρξαντο + infinitive ప్రారంభాన్ని సూచిస్తుంది. διαλογίζεσθαι అంతరంగ తర్కం, పరస్పర ఆలోచన లేదా చర్చ అనే భావాలను కలిగి ఉండగలదు; సందర్భాన్ని అతిగా నిర్ణయించకుండా ‘తమలో తాము ... ఆలోచించడం’ సహజంగా ఆ భావవిస్తృతిని నిలుపుతుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్ర నిపుణులను సూచించే స్థిరమైన, తెలుగు బైబిలు పాఠకులకు పరిచితమైన పదం.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ సమూహనామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: λαλεῖ βλασφημίας
  choice: దేవదూషణలు పలుకుతున్న
  rationale: βλασφημίας యొక్క బహువచనాన్ని ‘దేవదూషణలు’గా నిలిపి, λαλεῖకి సహజమైన ‘పలుకుతున్న’ను వాడింది.
- source_word: Τίς ἐστιν οὗτος
  choice: ఇతడు ఎవడు?
  rationale: మూలంలో ‘మనిషి’ అనే పదాన్ని చేర్చకుండా, అభ్యంతరంలోని కఠినమైన మరియు తృణీకారసూచక స్వరాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: పాపాలను క్షమించగలరు
  rationale: పాపాల సందర్భంలో ἀφίημι యొక్క సహజమైన, స్థిరమైన తెలుగు సమానార్థకం ‘క్షమించు’.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: దేవుడు తప్ప మరెవరు
  rationale: ‘దేవుడు ఒక్కడే’ అనే ప్రత్యేకాధికార భావాన్ని తెలుగు ప్రశ్నారూపంలో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పాపాలను క్షమించే యేసు అధికారం గురించిన సూచన
  choice: దేవుడు తప్ప మరెవరు పాపాలను క్షమించగలరు?
  alternative: ఈ వాక్యంలోనే యేసు దేవత్వాన్ని వివరణాత్మకంగా ప్రకటించడం
  rationale: వచనం శాస్త్రులు, పరిసయ్యుల అభ్యంతరాన్ని మాత్రమే నేరుగా తెలియజేస్తుంది. లూకా కథనంలోని క్రీస్తు సంబంధిత ఉద్వేగాన్ని నిలిపి, ఇక్కడ స్పష్టంగా చెప్పని తీర్మానాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘శాస్త్రులు,’ ‘పరిసయ్యులు,’ ‘దేవదూషణలు’ వంటి బైబిలు సందర్భానికి అవసరమైన పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
