review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future coming of days, the passive and forceful removal of the bridegroom, and the future fasting. However, τότε ('then') is not explicitly represented in the translated sentence; it should be retained, especially since the source deliberately marks the temporal consequence.
  naturalness: The wording is generally clear and appropriately reverent in modern standard Telugu. 'వారి నుండి' is more natural and less colloquial than 'వారి దగ్గరనుండి' in this context. Retaining the source's temporal repetition remains natural when phrased as 'అప్పుడు వారు ఆ రోజుల్లో'.
  terminology: '''పెండ్లికుమారుడు'' appropriately preserves the biblical wedding metaphor, and ''ఉపవాసం ఉంటారు'' accurately conveys religious fasting. ''తీసివేయబడినప్పుడు'' properly reflects the passive sense of ἀπαρθῇ without turning it into a merely voluntary departure.'
  issues:
  - severity: medium
    issue: The explicit temporal adverb τότε is omitted.
    rationale: The clause '...తీసివేయబడినప్పుడు, ఆ రోజుల్లో వారు...' expresses sequence, but does not directly render τότε ('then'). Adding 'అప్పుడు' preserves the Greek temporal-consequential emphasis.
  - severity: low
    issue: '''వారి దగ్గరనుండి'' is less idiomatic than necessary.'
    rationale: For separation from persons, 'వారి నుండి' is concise, standard, and natural Telugu while fully conveying ἀπ’ αὐτῶν.
  revised_text: అయితే రోజులు వస్తాయి; పెండ్లికుమారుడు వారి నుండి తీసివేయబడినప్పుడు, అప్పుడు వారు ఆ రోజుల్లో ఉపవాసం ఉంటారు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “వారి నుండి తొలగించబడినప్పుడు.” గ్రీకు క్రియ పెండ్లికుమారుడు కేవలం వెళ్లిపోవడం కాకుండా తీసివేయబడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision explicitly renders τότε as 'అప్పుడు' and replaces the less idiomatic 'వారి దగ్గరనుండి' with 'వారి నుండి.' It retains the passive, forceful sense of ἀπαρθῇ, the bridegroom imagery, the future fasting, and the repeated future-day reference without adding doctrinal interpretation.
