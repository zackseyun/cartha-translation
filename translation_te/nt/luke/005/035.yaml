id: LUK.5.35
reference: Luke 5:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: te
  text: అయితే రోజులు వస్తాయి; పెండ్లికుమారుడు వారి నుండి తీసివేయబడినప్పుడు, అప్పుడు వారు ఆ రోజుల్లో ఉపవాసం ఉంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి నుండి తొలగించబడినప్పుడు.” గ్రీకు క్రియ పెండ్లికుమారుడు కేవలం వెళ్లిపోవడం కాకుండా తీసివేయబడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: రోజులు వస్తాయి
  rationale: గ్రీకు నుడికారంలోని భవిష్యదర్థాన్ని, పునరుక్తిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి పరిస్థితికి భవిష్యత్తులో కలిగే పరిస్థితికి మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ὅταν
  choice: ఎప్పుడు
  rationale: భవిష్యత్తులో సంభవించే సందర్భాన్ని సూచించే గ్రీకు నిర్మాణానికి సహజమైన తెలుగు సమానం.
- source_word: ἀπαρθῇ
  choice: తీసివేయబడినప్పుడు
  rationale: కేవలం వెళ్లిపోవడం కాకుండా, ఇతరుల చర్యవల్ల దూరం చేయబడుతున్న నిష్క్రియార్థాన్ని నిలుపుతుంది.
- source_word: ἀπ’ αὐτῶν
  choice: వారి దగ్గరనుండి
  rationale: పెండ్లికుమారునికీ వారికీ మధ్య కలిగే వేర్పాటును స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ νυμφίος
  choice: పెండ్లికుమారుడు
  rationale: వివాహ రూపకాన్ని కచ్చితంగా నిలిపే, తెలుగు బైబిలు వాడుకలో పరిచితమైన పదం.
- source_word: τότε
  choice: అప్పుడు
  rationale: పెండ్లికుమారుడు తీసివేయబడిన తరువాత కలిగే కాలపరమైన ఫలితాన్ని సూచిస్తుంది.
- source_word: νηστεύσουσιν
  choice: వారు ఉపవాసం ఉంటారు
  rationale: సాధారణంగా ఆహారం తినకపోవడం కాకుండా మతపరమైన ఉపవాసాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: గ్రీకులోని కాలసూచక పునరుక్తిని తొలగించకుండా నిలుపుతుంది.
theological_decisions:
- issue: నిష్క్రియ క్రియారూపాన్ని తటస్థమైన వెళ్లిపోవడంగా మృదువుచేయాలా
  choice: పెండ్లికుమారుడు వారి దగ్గరనుండి తీసివేయబడినప్పుడు
  alternative: పెండ్లికుమారుడు వారిని విడిచి వెళ్లినప్పుడు
  rationale: ἀπαρθῇ అనే నిష్క్రియ రూపం పెండ్లికుమారుడు స్వయంగా వెళ్లిపోవడం కంటే అతడు తొలగించబడటాన్ని సూచిస్తుంది. ఈ భావం యేసు మరణాన్ని సూచించే ఉద్విగ్నతను వివరణతో పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కాలపరమైన పునరుక్తిని నిలిపి, తెలుగు ప్రవాహం కోసం అర్ధవిరామాన్ని ఉపయోగించాం.
