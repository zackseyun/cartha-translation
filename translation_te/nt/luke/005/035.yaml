revisions:
- from: అయితే రోజులు వస్తాయి; పెండ్లికుమారుడు వారి దగ్గరనుండి తీసివేయబడినప్పుడు, ఆ రోజుల్లో వారు ఉపవాసం ఉంటారు.[a]
  to: అయితే రోజులు వస్తాయి; పెండ్లికుమారుడు వారి నుండి తీసివేయబడినప్పుడు, అప్పుడు వారు ఆ రోజుల్లో ఉపవాసం ఉంటారు.[a]
  rationale: The revision explicitly renders τότε as 'అప్పుడు' and replaces the less idiomatic 'వారి దగ్గరనుండి' with 'వారి నుండి.' It retains the passive, forceful sense of ἀπαρθῇ, the bridegroom imagery, the future fasting, and the repeated future-day reference without adding doctrinal interpretation.
