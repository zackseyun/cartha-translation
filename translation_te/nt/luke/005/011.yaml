    text: లేదా, ‘అన్నిటినీ విడిచిపెట్టి.’
    reason: lexical_alternative
  revision_rationale: No safe correction is needed. The draft faithfully represents the Greek participial sequence, the comprehensive scope of πάντα, and the unelaborated sense of following Jesus. The supplied footnote is correctly anchored to the phrase expressing πάντα and gives a natural Telugu alternative.
