source:
  edition: SBLGNT
  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: te
  text: వారు పడవలను ఒడ్డుకు చేర్చి, సమస్తాన్ని విడిచిపెట్టి ఆయనను అనుసరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్నిటినీ విడిచిపెట్టి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγαγόντες
  choice: చేర్చి
  rationale: κατάγω యొక్క భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. తెలుగులో ‘చేర్చి’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: τὰ πλοῖα
  choice: పడవలను
  rationale: గలిలయ చేపల వేట సందర్భంలో πλοῖονకు ‘పడవ’ సహజమైన, సందర్భోచితమైన సమానార్థకం.
- source_word: ἐπὶ τὴν γῆν
  choice: ఒడ్డుకు
  rationale: పదశః ‘నేల మీదికి’; పడవలను నీటి నుండి భూమి వైపు తీసుకురావడాన్ని తెలుగులో ‘ఒడ్డుకు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀφέντες
  choice: విడిచిపెట్టి
  rationale: ἀφίημι ఇక్కడ వెనుక విడిచిపెట్టడం అనే భావాన్ని ఇస్తుంది. ‘విడిచిపెట్టి’ క్రియల వరుసను, త్యజించిన భావాన్ని కాపాడుతుంది.
- source_word: πάντα
  choice: సమస్తాన్ని
  rationale: నపుంసక బహువచనమైన πάντα సమగ్రతను సూచిస్తుంది. ‘సమస్తాన్ని’ దాని సంపూర్ణ పరిధిని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ఆయనను అనుసరించారు
  rationale: ἀκολουθέω శారీరకంగా వెంట వెళ్లడాన్నీ శిష్యత్వ భావాన్నీ సూచించగలదు. ‘అనుసరించారు’ ఈ రెండు భావసాధ్యతలను విపులీకరించకుండా కాపాడుతుంది.
theological_decisions:
- issue: πάνταలో త్యాగపు పరిధి
  choice: సమస్తాన్ని విడిచిపెట్టి
  alternative: అన్నిటినీ విడిచిపెట్టి
  rationale: వారు విడిచినదాని సంపూర్ణతను వాక్యం బలంగా తెలియజేస్తుంది; అయితే అది శాశ్వత ఆస్తి పరిత్యాగమా అనే విషయాన్ని మూలపాఠం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సమస్తాన్ని’ మూలంలోని సమగ్రతను నిలుపుతుంది; ‘ఆయనను అనుసరించారు’ కథన చర్యతో పాటు శిష్యత్వ సూచనను కూడా కాపాడుతుంది.
