translation:
  language: te
  text: యేసు వారికి జవాబిచ్చి, “ఆరోగ్యంగా ఉన్నవారికి వైద్యుడు అవసరం లేదు; రోగులకే వైద్యుడు అవసరం” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: వారికి జవాబిస్తూ ... అన్నాడు
  rationale: గ్రీకు కథన సూత్రంలోని ప్రతిస్పందన భావాన్నీ, మాట చెప్పిన క్రియనూ సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: οἱ ὑγιαίνοντες
  choice: ఆరోగ్యంగా ఉన్నవారు
  rationale: వర్తమాన కృదంతం సూచించే ఆరోగ్య స్థితిని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: అవసరం లేదు
  rationale: χρείαν ἔχουσιν అనే ‘అవసరం కలిగి ఉండటం’ భావాన్ని సహజమైన తెలుగు ప్రయోగంగా అందిస్తుంది.
- source_word: ἰατροῦ
  choice: వైద్యుడు
  rationale: ἰατρόςకు సరిపడే, గౌరవప్రదమైన మరియు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదం.
- source_word: οἱ κακῶς ἔχοντες
  choice: రోగులు
  rationale: ‘చెడుగా ఉన్నవారు’ అనే అక్షరార్థ నిర్మాణం ఇక్కడ అనారోగ్యాన్ని సూచించే గ్రీకు నుడికారము; ‘రోగులు’ దాని సందర్భోచిత అర్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
