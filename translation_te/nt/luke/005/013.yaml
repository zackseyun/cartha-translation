id: LUK.5.13
reference: Luke 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: te
  text: ఆయన చేయి చాపి అతణ్ణి ముట్టుకొని, “నేను ఇష్టపడుతున్నాను; శుద్ధి పొందు” అని అన్నాడు. వెంటనే కుష్ఠరోగం[a] అతణ్ణి విడిచిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత విస్తృతంగా, “చర్మవ్యాధి.” బైబిలు వాడుకలోని గ్రీకు పదం λέπρα ఆధునిక కుష్ఠరోగాన్ని మాత్రమే కాక, అనేక తీవ్రమైన చర్మవ్యాధులను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: చెయ్యి చాపి
  rationale: చేతిని ముందుకు చాచిన భౌతిక చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు భూతకాల కృదంతం ప్రధాన క్రియకు ముందున్న చర్యగా నిలుస్తుంది.
- source_word: ἥψατο αὐτοῦ
  choice: అతణ్ణి ముట్టుకొని
  rationale: ἅπτομαιతో వచ్చే షష్ఠీ విభక్తి కర్మను తెలుగులో సహజంగా ప్రత్యక్ష కర్మగా వ్యక్తం చేసింది; శారీరక స్పర్శ ప్రాముఖ్యతను నిలుపుతుంది.
- source_word: Θέλω
  choice: నాకు ఇష్టమే
  rationale: ఇక్కడ θέλω భవిష్యత్తును కాక, స్వస్థపరచడానికి ఉన్న సమ్మతిని, సంసిద్ధతను వ్యక్తం చేస్తుంది. ముందరి ప్రశ్నకు సహజమైన జవాబుగా కూడా ఇది పనిచేస్తుంది.
- source_word: καθαρίσθητι
  choice: శుద్ధుడవు కా
  rationale: గ్రీకు ఆజ్ఞారూపంలోని శుద్ధత భావాన్ని నిలుపుతూ, కేవలం వైద్యపరమైన ‘స్వస్థపడు’ అనే అర్థానికి పరిమితం చేయకుండా సహజమైన తెలుగులో ఇచ్చింది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: కాలపరమైన తక్షణత్వాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ λέπρα
  choice: కుష్ఠరోగం
  rationale: సువార్త వృత్తాంతాల్లో గుర్తించదగిన సంప్రదాయ పదాన్ని వాడింది; ప్రాచీన గ్రీకు పదం ఆధునిక హాన్సెన్స్ వ్యాధికన్నా విస్తృతార్థం కలిగి ఉండవచ్చని పాదసూచికలో తెలిపింది.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: అతణ్ణి విడిచిపోయింది
  rationale: వ్యాధి అతని నుండి తొలగిపోయిందనే భావాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
theological_decisions:
- issue: కుష్ఠరోగిగా పేర్కొన్న వ్యక్తికి καθαρίσθητι అనే మాటను అనువదించడం
  choice: శుద్ధుడవు కా
  alternative: స్వస్థపడు
  rationale: మూలపాఠం కేవలం వైద్యపరమైన స్వస్థతనే కాక శుద్ధతను కూడా ముందుకు తెస్తుంది. ఈ ఎంపిక శారీరక స్వస్థతతో పాటు ఆచారపరమైన, సామాజిక పునరుద్ధరణ సూచనను తగ్గించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడింది. గ్రీకు వాక్యంలోని వరుస చర్యలను ‘చాపి… ముట్టుకొని… అన్నాడు’ అనే సహజ తెలుగు ప్రవాహంలో ఉంచింది. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘కుష్ఠరోగం’ పదం వద్ద ఉంచింది.
