revisions:
- from: ఆయన చెయ్యి చాపి అతణ్ణి ముట్టుకొని, “నాకు ఇష్టమే; శుద్ధుడవు కా” అన్నాడు. వెంటనే కుష్ఠరోగం[a] అతణ్ణి విడిచిపోయింది.
  to: ఆయన చేయి చాపి అతణ్ణి ముట్టుకొని, “నేను ఇష్టపడుతున్నాను; శుద్ధి పొందు” అని అన్నాడు. వెంటనే కుష్ఠరోగం[a] అతణ్ణి విడిచిపోయింది.
  rationale: The revision corrects the malformed imperative and makes Jesus’ willing intent explicit, while preserving the Greek’s command to be cleansed, the narrative sequence, the immediate result, and the appropriately anchored cultural footnote.
