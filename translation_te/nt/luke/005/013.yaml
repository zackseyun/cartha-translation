review_pass:
  verdict: revise
  source_fidelity: The sequence of actions, the touch, the immediate removal of the condition, and the footnote’s broader sense of λέπρα are represented faithfully. However, the rendering of Θέλω as “నాకు ఇష్టమే” can suggest personal preference rather than the speaker’s willing intent, and “శుద్ధుడవు కా” is not a sound modern Telugu imperative.
  naturalness: “చేయి చాపి ... ముట్టుకొని” and “వెంటనే ... విడిచిపోయింది” are natural. “శుద్ధుడవు కా” is unidiomatic and grammatically defective in modern standard Telugu. “నేను ఇష్టపడుతున్నాను; శుద్ధి పొందు” is clear, direct, and natural.
  terminology: “కుష్ఠరోగం” appropriately retains the customary Gospel term, while the footnote properly cautions that λέπρα need not denote only modern Hansen’s disease. “శుద్ధి పొందు” retains the cleansing emphasis of καθαρίσθητι without reducing it merely to healing.
  issues:
  - severity: medium
    issue: “శుద్ధుడవు కా” is an invalid/unnatural imperative.
    rationale: The final “కా” does not form a natural modern Telugu command here. The translation needs an intelligible imperative that reflects the Greek passive command.
  - severity: medium
    issue: “నాకు ఇష్టమే” weakens the willing-intent sense of Θέλω.
    rationale: In this context Θέλω expresses Jesus’ volition/willingness. “నాకు ఇష్టమే” can be heard as ‘I like it,’ whereas “నేను ఇష్టపడుతున్నాను” communicates the intended readiness more accurately.
  revised_text: ఆయన చేయి చాపి అతణ్ణి ముట్టుకొని, “నేను ఇష్టపడుతున్నాను; శుద్ధి పొందు” అని అన్నాడు. వెంటనే కుష్ఠరోగం[a] అతణ్ణి విడిచిపోయింది.
  revised_footnotes:
