translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. ఉపమానంలోని వస్త్ర సంబంధిత దృశ్యాన్ని సహజంగా ఉంచుతూ, కుట్టడం వంటి మూలంలో లేని వివరాన్ని చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
