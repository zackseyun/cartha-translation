id: LUK.5.36
reference: Luke 5:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: te
  text: 'ఆయన వారికి ఒక ఉపమానాన్ని కూడా చెబుతూ ఇలా అన్నాడు: “ఎవరూ కొత్త వస్త్రం నుంచి ఒక ముక్కను చించి పాత వస్త్రానికి అతకరు.[a] అలా చేస్తే, అతడు కొత్త వస్త్రాన్ని కూడా చించుతాడు; అంతేకాక, కొత్త వస్త్రం నుంచి తీసిన ఆ ముక్క పాత వస్త్రానికి సరిపోదు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపనిష్ఠగా: “ఎవరూ కొత్త వస్త్రం నుంచి ఒక ముక్కను చించిన తరువాత పాత వస్త్రానికి అతకరు.” గ్రీకులో ప్రధాన క్రియకు ముందు “చించి” అనే అఒరిస్ట్ పార్టిసిపిల్ రూపం ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: “సరిపోదు” అనే మాటను “పొసగదు” లేదా “అనుకూలంగా ఉండదు” అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ ఇక్కడ ఆ ముక్కకూ పాత వస్త్రానికీ మధ్య అనురూపత లేదా అనుకూలత లేకపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: ఈ ఉపమానం కూడా చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచిస్తుంది; δὲ καὶ భావాన్ని సహజంగా ‘కూడా’తో తెలిపాం.
- source_word: παραβολὴν
  choice: ఉపమానం
  rationale: లూకా రచనలోని సాహిత్య ప్రక్రియను నిలుపుతూ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన పదం.
- source_word: ἐπίβλημα
  choice: ముక్క
  rationale: ఇక్కడ వస్త్రానికి అతికే ముక్క ఉద్దేశం. ‘మాసిక’ వంటి ప్రాంతీయ లేదా పాత పదాలకంటే ‘ముక్క’ సహజంగా అర్థమవుతుంది; అతికే ప్రయోజనం క్రియ ద్వారా స్పష్టమవుతుంది.
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: కొత్త వస్త్రం నుంచి
  rationale: ἱμάτιονను నిర్దిష్టంగా అంగీ లేదా పైవస్త్రం అని పరిమితం చేయకుండా సాధారణ ‘వస్త్రం’గా అనువదించాం.
- source_word: σχίσας
  choice: చించి
  rationale: అయోరిస్ట్ పార్టిసిపిల్ ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; తెలుగు క్రియావిశేషణ రూపం ఆ క్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν
  choice: పాత వస్త్రానికి అతకరు
  rationale: వస్త్రపు ముక్కను పాత వస్త్రంపై పెట్టే సందర్భంలో ‘అతకరు’ సహజంగా ఉంది; కుట్టే విధానాన్ని మూలం స్పష్టంగా చెప్పనందున ‘కుట్టరు’ అని నిర్దిష్టం చేయలేదు.
- source_word: εἰ δὲ μήγε
  choice: అలా చేస్తే
  rationale: ముందు నిషేధించిన పనిని చేసినప్పుడు కలిగే పరిణామాన్ని తెలుగులో సహజమైన షరతు నిర్మాణంతో తెలిపాం.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: కొత్త వస్త్రాన్ని చించినవారవుతారు
  rationale: క్రియ కర్తృవాచక భవిష్యత్తులో ఉంది; కొత్త వస్త్రమే తనంతట తాను చిరుగుతుందని కాక, ఆ వ్యక్తి దాన్ని చించుతాడనే భావాన్ని నిలిపాం.
- source_word: οὐ συμφωνήσει
  choice: సరిపోదు
  rationale: συμφωνέω ఇక్కడ అనురూపత లేదా అనుకూలత లేకపోవడాన్ని సూచిస్తుంది. ‘సరిపోదు’ పరిమాణం, రూపం, అనుకూలత వంటి సాధ్య భావాలను అనవసరంగా ఒకదానికి పరిమితం చేయదు.
