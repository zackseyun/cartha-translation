source:
  edition: SBLGNT
  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: te
  text: పాత ద్రాక్షారసం తాగిన తర్వాత ఎవరూ కొత్త ద్రాక్షారసాన్ని కోరుకోరు; ఎందుకంటే, ‘పాతది మంచిది’ అని అంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “పాతది మెరుగైనది” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: ఎవడూ ... కోరుకోడు
  rationale: వ్యక్తులందరికీ వర్తించే సాధారణ నిషేధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πιὼν παλαιὸν
  choice: పాత ద్రాక్షారసం తాగినవాడు
  rationale: అసలు భాషలో ద్రాక్షారసం అనే నామవాచకం సందర్భం ద్వారా సూచితమైనందున, తెలుగులో స్పష్టత కోసం దాన్ని వ్యక్తం చేశాం; కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది.
- source_word: θέλει νέον
  choice: కొత్తది కోరుకోడు
  rationale: θέλει ఇక్కడ కోరిక లేదా అభిరుచిని సూచిస్తుంది. νέονలో ద్రాక్షారసం అంతర్లీనంగా ఉన్నందున ‘కొత్తది’ అని సంక్షిప్తంగా ఉంచాం.
- source_word: λέγει γάρ
  choice: ఎందుకంటే ... అని అతడు అంటాడు
  rationale: γάρ ముందున్న మాటకు కారణాన్ని ఇస్తుంది; ఈ నిర్మాణం తెలుగులో సహజంగా ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: Ὁ παλαιὸς χρηστός ἐστιν
  choice: పాతదే మంచిది
  rationale: χρηστός యొక్క సాధారణ అర్థం ‘మంచిది’; ‘దే’ పాతదానిపై ఉన్న అభిరుచిని సహజంగా చూపుతుంది గాని దాన్ని ‘మెరుగైనది’ అనే తులనాత్మక పదంగా మార్చదు.
theological_decisions:
- issue: χρηστόςను పాత, కొత్త ద్రాక్షారసాల సామెతలో ఎలా అనువదించాలి
  choice: మంచిది
  alternative: మెరుగైనది
  rationale: ముద్రిత SBLGNT పాఠంలోని χρηστός సాధారణ విశేషణం; అది తులనాత్మక రూపం కాదు. కాబట్టి ప్రధాన పాఠంలో ‘మంచిది’ అని ఉంచి, పాఠాంతరమైన ‘మెరుగైనది’ని పాదసూచికలో ఇచ్చాం. ఇది సిద్ధాంత నిర్ణయం కాక, మూలపాఠాధారిత పదార్థ మరియు పాఠవిమర్శ నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామెతలా వినిపించే సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. ‘పాతదే మంచిది’ అనే రూపం మూలంలోని సంక్షిప్తతను, తులనాత్మకం కాని χρηστός భావాన్ని కాపాడుతుంది.
