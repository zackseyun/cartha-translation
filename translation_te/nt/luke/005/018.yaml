id: LUK.5.18
reference: Luke 5:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: te
  text: ఇదిగో, కొందరు పురుషులు పక్షవాతంతో ఉన్న ఒక మనిషిని మంచం[a] మీద మోసుకొస్తూ, అతనిని లోపలికి తీసుకువచ్చి ఆయన[b] ఎదుట ఉంచడానికి ప్రయత్నిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పడక,” “మోసే పడక,” లేదా “మంచంలాంటి పరుపు.” గ్రీకు κλίνη ఒక పడకను లేదా మంచంలాంటి విశ్రాంతి పడకను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, యేసు ఎదుట.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో పాఠకుని దృష్టిని ఆకర్షించే సూచనగా ఉన్న ἰδού భావాన్ని సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: ἄνδρες
  choice: కొందరు పురుషులు
  rationale: ἀνήρ ఇక్కడ వయోజన పురుషులను సూచిస్తుంది; తెలుగు వాక్యంలో అనిర్దిష్ట బహువచనాన్ని సహజంగా తెలియజేయడానికి ‘కొందరు’ చేర్చబడింది.
- source_word: φέροντες
  choice: మోసుకుంటూ వచ్చారు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను తెలియజేస్తూ, వారు ఆ మనిషిని మంచం మీద మోసుకొచ్చారనే సందర్భార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐπὶ κλίνης
  choice: మంచం మీద
  rationale: κλίνη మంచం, పడక లేదా మంచంలాంటి మోసే పరికరాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన సాధారణ పదమైన ‘మంచం’ను ఉంచి, ఇతర సాధ్యార్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: ἄνθρωπον
  choice: ఒక మనిషిని
  rationale: ఈ సందర్భంలో ἄνθρωπος ఒక వ్యక్తిని, వాక్యసందర్భం ప్రకారం పురుషుణ్ణి సూచిస్తుంది.
- source_word: παραλελυμένος
  choice: పక్షవాతంతో ఉన్న
  rationale: పరిపూర్ణ కర్మణి కృదంతం తెలియజేసే కొనసాగుతున్న స్థితిని సహజంగా వ్యక్తపరుస్తుంది; పరిస్థితిని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: ἐζήτουν
  choice: ప్రయత్నించారు
  rationale: అసంపూర్ణ భూతకాల క్రియ ఇక్కడ కొనసాగుతున్న ప్రయత్నాన్ని సూచిస్తుంది; తెలుగు సందర్భంలో ‘ప్రయత్నించారు’ సహజంగా ఆ ఉద్దేశపూర్వక యత్నాన్ని తెలియజేస్తుంది.
- source_word: εἰσενεγκεῖν
  choice: లోపలికి తీసుకువచ్చి
  rationale: εἰσφέρω యొక్క ‘లోపలికి తీసుకురావడం’ అనే దిశార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: θεῖναι
  choice: ఉంచడానికి
  rationale: τίθημι ఇక్కడ ఒకరి ఎదుట ఉంచడం లేదా పెట్టడం అనే సాధారణ భావాన్ని ఇస్తుంది; శరీర భంగిమను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἐνώπιον αὐτοῦ
  choice: ఆయన ఎదుట
  rationale: మూలంలోని సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా నిలుపుతూ, సందర్భంలో యేసును సూచించే గౌరవప్రదమైన తెలుగు సర్వనామాన్ని వాడుతుంది.
theological_decisions:
- issue: చివరి αὐτοῦ సర్వనామం ఎవరిని సూచిస్తుంది
  choice: ఆయన ఎదుట
  alternative: యేసు ఎదుట
  rationale: కథన సందర్భంలో ఇది యేసును సూచించడం స్పష్టమే; అయినా గ్రీకు మూలం పేరుకు బదులుగా సర్వనామాన్ని వాడినందున ప్రధాన పాఠంలో ఆ రూపాన్ని నిలిపి, పాదసూచికలో సూచిత వ్యక్తిని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి-ఆకర్షణ భావాన్ని నిలిపాం. ఇంగ్లీషు సంప్రదింపు పాఠంలో పాదసూచిక గుర్తులు సంబంధిత పదాలకు సరిపోకుండా కనిపించినందున, మూలార్థానికి అనుగుణంగా [a]ను ‘మంచం’ దగ్గర, [b]ను ‘ఆయన’ దగ్గర ఉంచాం.
