  edition: SBLGNT
  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: te
  text: ఆయన మాట్లాడడం ముగించినప్పుడు, సీమోనుతో, “పడవను లోతైన నీటిలోకి[a] తీసుకెళ్లు; చేపలు పట్టడానికి మీ వలలు దించండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లోతులోకి.” గ్రీకు పదబంధానికి అక్షరార్థం “లోతులోకి”; ఇక్కడ అది లోతైన నీటిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: ఆయన మాట్లాడడం ముగించినప్పుడు
  rationale: కొనసాగుతున్న మాటల చర్య ముగిసిన తరువాత జరిగినదాన్ని సహజమైన తెలుగు కాలవాక్యంతో తెలియజేస్తుంది; δέను అవసరంలేకుండా ప్రత్యేకంగా అనువదించలేదు.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: సీమోనుతో … అన్నాడు
  rationale: λέγω యొక్క సాధారణ సంభాషణ సూత్రాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజమైన నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: Ἐπανάγαγε
  choice: పడవను … తీసుకెళ్లు
  rationale: చేపల వేట సందర్భంలో ఈ క్రియ పడవను ఒడ్డునుంచి నీటిలోకి తీసుకెళ్లడాన్ని సూచిస్తుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు మూలంలో అంతర్లీనంగా ఉన్న ‘పడవను’ చేర్చబడింది; ఏకవచన ఆజ్ఞ కూడా నిలిచింది.
- source_word: εἰς τὸ βάθος
  choice: లోతైన నీటిలోకి
  rationale: βάθος అక్షరార్థంగా ‘లోతు’; ఇక్కడ అది లోతైన నీటిని సూచిస్తుంది. తెలుగు పాఠకునికి సందర్భార్థం సహజంగా స్పష్టమయ్యేలా ‘నీరు’ వ్యక్తపరచబడింది.
- source_word: χαλάσατε τὰ δίκτυα ὑμῶν
  choice: మీ వలలు దించండి
  rationale: పడవనుంచి వలలను నీటిలోకి కిందికి వదలడాన్ని ‘దించండి’ సహజంగా తెలియజేస్తుంది. గ్రీకులోని బహువచన ఆజ్ఞను ‘మీ … దించండి’ ద్వారా నిలిపింది.
- source_word: εἰς ἄγραν
  choice: చేపలు పట్టడానికి
  rationale: ἄγρα ఇక్కడ చేపల పట్టుబడిని సూచిస్తుంది; ఉద్దేశార్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఏకవచన, బహువచన ఆజ్ఞల మార్పు
  choice: ‘తీసుకెళ్లు’ అనే ఏకవచన ఆజ్ఞను, ‘దించండి’ అనే బహువచన ఆజ్ఞను నిలిపింది
  alternative: రెండు ఆజ్ఞలనూ ఒకే వచనంలో అనువదించడం
  rationale: యేసు మొదటి ఆజ్ఞను సీమోనుకు ఏకవచనంలో, రెండవదాన్ని అతనితో ఉన్నవారికి వర్తించేలా బహువచనంలో పలికిన మూలపాఠ నిర్మాణాన్ని వ్యాఖ్యానంతో సమతలపరచకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ప్రత్యక్ష సంభాషణలో మూలంలోని ఏకవచన–బహువచన భేదాన్ని ఉద్దేశపూర్వకంగా నిలిపింది.
