source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: te
  text: ఆయన వారితో, “పెళ్లికుమారుడు వారితో ఉన్నప్పుడు, పెళ్లి అతిథులతో ఉపవాసం చేయించలేరు కదా?” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: చేయించగలరా?
  rationale: μήతో కూడిన సూచనార్థక ప్రశ్నకు ‘లేదు’ అనే సమాధానం ఆశించబడుతుంది. తెలుగులో సందర్భసహజమైన ప్రశ్నారూపమే ఆ వాక్చాతుర్యాన్ని తెలియజేస్తుంది.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: పెళ్లివారితో
  rationale: అక్షరార్థంగా ‘పెళ్లి గది కుమారులు’ అనే ఈ నుడికారం పెళ్లికుమారుని సహచరులు లేదా పెళ్లి వేడుకలోని అతిథులను సూచిస్తుంది. ‘పెళ్లివారు’ ఆధునిక తెలుగులో సహజంగా, విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: νυμφίος
  choice: పెళ్లికుమారుడు
  rationale: వివాహ రూపకాన్ని స్పష్టంగా నిలిపే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: తమతో ఉన్నంతకాలం
  rationale: పెళ్లికుమారుడు వారితో ప్రస్తుతం ఉన్నాడనే భావాన్ని, ἐν ᾧ యొక్క కాలార్థంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ποιῆσαι νηστεῦσαι
  choice: ఉపవాసం చేయించగలరా
  rationale: ποιέωతో కూడిన క్రియారూపం కారణార్థకమైనది; కేవలం ‘ఉపవాసం ఉండగలరా’ అనడం మూలంలోని ‘చేయించడం’ భావాన్ని కోల్పోతుంది.
- source_word: νηστεῦσαι
  choice: ఉపవాసం
  rationale: మతపరమైన సందర్భంలో ఆహారం మానడాన్ని సూచించే ప్రామాణిక, సంక్షిప్త తెలుగు పదం.
theological_decisions:
- issue: యేసును పెళ్లికుమారునిగా సూచించే రూపకం
  choice: ‘పెళ్లికుమారుడు’ అనే రూపకాన్ని వివరణాత్మక విస్తరణ లేకుండా నిలిపాం.
  alternative: యేసే పెళ్లికుమారుడని ప్రధాన వాక్యంలో స్పష్టంగా చేర్చడం.
  rationale: మూలవాక్యం రూపకం ద్వారా సూచిస్తుంది గాని దాని వేదాంతార్థాన్ని వివరించదు. అనువాదం ఆ సూచనను పాఠకుడికి అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘పెళ్లివారు’ అనే పదం నుడికారంలోని సామూహిక భావాన్ని అందిస్తుంది; మూలంలోని కారణార్థక నిర్మాణం ‘చేయించగలరా’ ద్వారా నిలుపబడింది.
