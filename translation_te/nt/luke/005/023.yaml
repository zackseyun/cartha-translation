id: LUK.5.23
reference: Luke 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: te
  text: “ఏది సులభం? ‘నీ పాపాలు క్షమించబడ్డాయి[a]’ అని చెప్పడమా, లేక ‘లేచి నడువు’ అని చెప్పడమా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పాపాలు క్షమించబడి ఉన్నాయి.”
    reason: గ్రీకు పరిపూర్ణ కర్మణి రూపం గతంలో జరిగిన క్షమాపణ ఫలితంగా ఉన్న ప్రస్తుత స్థితిని కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: ఏది సులభం?
  rationale: రెండు మాటల్లో ఏది చెప్పడం తేలికో పోల్చే గ్రీకు ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰπεῖν
  choice: అని చెప్పడమా
  rationale: రెండు ప్రత్యామ్నాయ వాక్యాల విషయాన్ని పరిచయం చేసే క్రియారూపాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: Ἀφέωνταί
  choice: క్షమించబడ్డాయి
  rationale: పాపక్షమాపణను సూచించే పరిపూర్ణ కర్మణి రూపంలోని, గతంలో జరిగిన చర్య ఫలితంగా ప్రస్తుతం నిలిచివున్న స్థితిని అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: σοι / αἱ ἁμαρτίαι σου
  choice: నీ పాపాలు
  rationale: ఏకవచన వ్యక్తిగత సంబోధనను, స్వామ్య సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: ἢ
  choice: లేక
  rationale: రెండు ప్రత్యామ్నాయాలను స్పష్టంగా కలిపే సహజమైన విభాజక సంధానం.
- source_word: Ἔγειρε
  choice: లేచి
  rationale: వ్యక్తిని పైకి లేవమని ఆజ్ఞాపించే భావాన్ని తరువాతి ఆజ్ఞతో సహజంగా కలుపుతుంది.
- source_word: καὶ περιπάτει
  choice: నడువు
  rationale: ఇక్కడి అక్షరార్థమైన నడకను సంక్షిప్తంగా, స్పష్టంగా తెలిపే ఆజ్ఞారూపం.
theological_decisions:
- issue: గ్రీకు పరిపూర్ణ కర్మణి రూపంలోని పాపక్షమాపణ ప్రకటనను అదనపు సిద్ధాంతార్థం చేర్చకుండా అనువదించడం
  choice: నీ పాపాలు క్షమించబడ్డాయి
  alternative: నీ పాపాలు క్షమించబడి ఉన్నాయి
  rationale: ఎంచుకున్న రూపం క్షమించబడిన ప్రస్తుత స్థితిని సహజంగా తెలియజేస్తూ, క్షమించే కర్తను గ్రీకు కర్మణి రూపం కంటే స్పష్టంగా పేర్కొనదు. ప్రత్యామ్నాయం కాలస్థితిని మరింత బహిరంగంగా చూపినా ఆధునిక తెలుగులో కొంత భారంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యేసు ప్రశ్నకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలో లేని వివరణను చేర్చలేదు.
