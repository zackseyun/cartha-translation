source:
  edition: SBLGNT
  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: te
  text: వారు ఇతర పడవలో ఉన్న తమ భాగస్వాములకు సైగ చేశారు[a]—వచ్చి తమకు సహాయం చేయమని. వారు వచ్చి రెండు పడవలనూ నింపారు; దాంతో అవి మునిగిపోసాగాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంజ్ఞ చేశారు’ లేదా ‘చేతితో పిలిచారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దాంతో అవి మునిగిపోతూ ఉన్నాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: సైగ చేశారు
  rationale: దూరంలో ఉన్నవారికి చేతితో లేదా ఇతర సంకేతంతో తెలియజేయడాన్ని ఈ క్రియ సూచిస్తుంది; నీటిమీద పడవల సందర్భంలో ‘సైగ చేశారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: μετόχοις
  choice: భాగస్వాములకు
  rationale: ఇక్కడ సాధారణ సహచరులు కాక, చేపల వేట పనిలో కలిసి ఉన్న భాగస్వాములను సూచిస్తుంది.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: మరో పడవలో ఉన్న
  rationale: సన్నివేశంలోని రెండవ, వేరొక పడవను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: τοῦ ἐλθόντας
  choice: వచ్చి
  rationale: ఈ నిర్మాణం ఉద్దేశాన్ని తెలియజేస్తుంది; ‘వచ్చి ... సహాయం చేయమని’ అనే తెలుగు వాక్యనిర్మాణం ఆ ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συλλαβέσθαι αὐτοῖς
  choice: తమకు సహాయం చేయమని
  rationale: కలిసి చేయూతనివ్వడం అనే సందర్భోచిత భావాన్ని స్పష్టంగా అందిస్తుంది; ‘వారితో కలిసి పట్టుకోవడం’ అనే అక్షరార్థ రూపం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: ἔπλησαν
  choice: నింపారు
  rationale: మూలంలోని ‘నింపడం’ అనే చిత్రాన్ని నిలుపుతుంది; దేనితో నింపారో ముందరి సందర్భం ద్వారా తెలుస్తుంది.
- source_word: ἀμφότερα τὰ πλοῖα
  choice: రెండు పడవలనూ
  rationale: ἀμφότερα లోని ‘రెండూ’ అనే నిర్దిష్ట భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: దాంతో అవి మునిగిపోసాగాయి
  rationale: ఫలితంగా మునిగే ప్రక్రియ మొదలై కొనసాగుతున్న భావాన్ని తెలుపుతుంది; పూర్తిగా మునిగిపోయాయని అనవసరంగా చెప్పదు.
