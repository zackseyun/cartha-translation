  to: వారు ఇతర పడవలో ఉన్న తమ భాగస్వాములకు సైగ చేశారు[a]—వచ్చి తమకు సహాయం చేయమని. వారు వచ్చి రెండు పడవలనూ నింపారు; దాంతో అవి మునిగిపోసాగాయి.[b]
