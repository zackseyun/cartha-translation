lexical_decisions:
- source_word: θάμβος
  choice: ఆశ్చర్యం
  rationale: ఈ నామవాచకం హఠాత్తుగా కలిగిన, మనిషిని ముంచెత్తే విస్మయస్థితిని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ఆశ్చర్యం’ సహజంగా ఉండి సందర్భంలోని బలాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో సీమోను చూపిన ప్రతిస్పందనకు ఇది కారణాన్ని వివరిస్తుంది; ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: περιέσχεν
  choice: ఆవరించింది
  rationale: ఈ క్రియకు చుట్టుముట్టడం లేదా పూర్తిగా పట్టివేయడం అనే భావం ఉంది. ఆశ్చర్యం వారిని ముంచెత్తిన తీవ్రతను ‘ఆవరించింది’ గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: అతనితో ఉన్న వారందరినీ
  rationale: సీమోనుతో అక్కడ ఉన్న సహచరులందరినీ సూచించే సమూహవ్యాప్తిని యథాతథంగా నిలుపుతుంది.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: చేపల వేటను చూసి
  rationale: ἐπί ఇక్కడ కారణం లేదా ఆధారాన్ని సూచిస్తుంది; ἄγρα పట్టుబడిన చేపల వేటను సూచిస్తుంది. తెలుగులో ‘వేటను చూసి’ ఆ పట్టుబడిన చేపల కారణంగా ఆశ్చర్యం కలిగిందనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὧν συνέλαβον
  choice: వారు పట్టిన
  rationale: సంబంధసర్వనామం చేపలను సూచిస్తుంది; బహువచన క్రియ సమూహం కలిసి చేపలను పట్టిందని తెలియజేస్తుంది. ‘వారు పట్టిన’ సంక్షిప్తంగా, స్పష్టంగా ఈ భావాన్ని అందిస్తుంది.
