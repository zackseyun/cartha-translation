revisions:
- from: కాని ఆయన మాత్రం ఏకాంత ప్రదేశాలకు వెళ్లి ప్రార్థిస్తూ ఉండేవాడు.[a]
  to: కాని ఆయన మాత్రం నిర్జన ప్రదేశాలకు తప్పుకొనిపోయి ప్రార్థించేవాడు.[a]
  rationale: ‘తప్పుకొనిపోయి’ ద్వారా ὑποχωρέω యొక్క వెనక్కి తగ్గడం/విడివడడం అనే భావాన్ని పునరుద్ధరించాం. ‘ప్రార్థించేవాడు’ గతకాలపు అలవాటైన చర్యను తెలుగులో సహజంగా తెలియజేస్తుంది. ‘నిర్జన ప్రదేశాలు’ బహువచన ἐρήμοις యొక్క భావాన్ని నిలుపుతుంది; అది నిర్దిష్ట ఎడారి భౌగోళిక అర్థాన్ని బలవంతం చేయదు.
