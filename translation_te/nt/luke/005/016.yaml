id: LUK.5.16
reference: Luke 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ἦν ὑποχωρῶν ἐν ταῖς ἐρήμοις καὶ προσευχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/016.yaml
  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: te
  text: కాని ఆయన మాత్రం నిర్జన ప్రదేశాలకు తప్పుకొనిపోయి ప్రార్థించేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మాత్రం నిర్జన ప్రదేశాల్లోకి వెనక్కి వెళ్లుతూ, ప్రార్థిస్తూ ఉండేవాడు.” గ్రీకులో అపూర్ణకాల క్రియతో వర్తమాన కృదంతాలు వాడబడ్డాయి; ఈ నిర్మాణం కొనసాగుతున్న లేదా అలవాటుగా జరిగే చర్యను సూచిస్తుంది.
    reason: మూలంలోని నిర్మాణానికి మరింత అక్షరానుసారమైన ప్రత్యామ్నాయం మరియు దాని కాలాంశం
lexical_decisions:
- source_word: αὐτὸς
  choice: ఆయన మాత్రం
  rationale: వ్యక్తంగా ఉన్న సర్వనామంలోని స్వల్ప ఉద్ఘాటనను, δέ సూచించే సందర్భోచిత వ్యత్యాసాన్ని సహజమైన తెలుగులో కలిపి తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: ముందటి సందర్భంలో జనసమూహాలు పెరుగుతున్నప్పటికీ యేసు ఏకాంతానికి వెళ్లడాన్ని సూచించే స్వల్ప వ్యత్యాసాన్ని ప్రతిబింబిస్తుంది.
- source_word: ἦν ὑποχωρῶν
  choice: వెళ్లి ... ఉండేవాడు
  rationale: ἦνతో వర్తమాన కృదంతం కలిసిన అపూర్ణకాల నిర్మాణం గతంలో కొనసాగిన లేదా అలవాటైన చర్యను సూచిస్తుంది; 'ఉండేవాడు' ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν ταῖς ἐρήμοις
  choice: ఏకాంత ప్రదేశాలకు
  rationale: బహువచనంలోని ἔρημος జనావాసం లేని, ఒంటరి ప్రదేశాలను సూచిస్తుంది. సందర్భంలో ὑποχωρέωతో కలిసినప్పుడు తెలుగులో గమ్యార్థకమైన 'ప్రదేశాలకు వెళ్లి' సహజంగా ఉంటుంది; నిర్దిష్టమైన ఎడారి భూభాగాన్ని అనవసరంగా సూచించదు.
- source_word: καὶ προσευχόμενος
  choice: ప్రార్థిస్తూ
  rationale: వెనక్కి వెళ్లడం మరియు ప్రార్థించడం పరస్పరం అనుసంధానమైన, పునరావృత చర్యలని కృదంత రూపంలో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు చర్య యొక్క కాలాంశం
  choice: ఈ వాక్యం యేసు ఏకాంత ప్రదేశాలకు వెళ్లి ప్రార్థించే అలవాటైన ఆచరణను వివరిస్తుంది.
  alternative: ఒక నిర్దిష్ట సందర్భంలో ఆయన వెళ్లి ప్రార్థించాడని మాత్రమే వర్ణించడం.
  rationale: ἦν + వర్తమాన కృదంతాల అపూర్ణకాల పరివ్యాప్త నిర్మాణం కొనసాగిన లేదా పునరావృతమైన చర్యను అత్యంత సహజంగా సూచిస్తుంది. అంతకుమించిన సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. 'ఏకాంత ప్రదేశాలు' అనే పదబంధం ἐρήμοις యొక్క జనావాసం లేని/ఒంటరి ప్రదేశాల భావాన్ని అందిస్తూ, తప్పనిసరిగా ఎడారి అనే భౌగోళిక అర్థాన్ని మోపదు.
