translation:
  language: te
  text: “నేను నీతిమంతులను పిలవడానికి రాలేదు; పాపులను పశ్చాత్తాపానికి పిలవడానికి వచ్చాను.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనస్సు మార్చుకోవడానికి.” గ్రీకులోని εἰς μετάνοιαν అనే పదబంధం పిలుపు యొక్క ఉద్దేశాన్ని లేదా లక్ష్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: వచ్చాను
  rationale: ἔρχομαι యొక్క పూర్ణకాల రూపం గతంలో రావడం వల్ల కొనసాగుతున్న ప్రస్తుత ఉద్దేశాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘వచ్చాను’ సహజంగా ఉండి యేసు తన కార్యోద్దేశాన్ని ప్రకటిస్తున్న భావాన్ని తెలియజేస్తుంది.
- source_word: καλέσαι
  choice: పిలవడానికి
  rationale: ఇది ἐλήλυθα తరువాత ఉద్దేశాన్ని తెలిపే అనిశ్చిత క్రియారూపం. ‘పిలవడం’ అనే పదం ఆహ్వానం, అధికారపూర్వక పిలుపు—రెండింటి అవకాశాన్నీ అతిగా పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: δικαίους
  choice: నీతిమంతులను
  rationale: విశేషణం నామవాచకంగా వాడబడి ‘నీతిమంతులైనవారిని’ సూచిస్తుంది. వారు నిజంగా నీతిమంతులా లేక తమను అలా భావించేవారా అనే విషయాన్ని వాక్యం స్వయంగా తేల్చదు; అందువల్ల ఎలాంటి వివరణాత్మక చేర్పూ చేయలేదు.
- source_word: ἁμαρτωλοὺς
  choice: పాపులను
  rationale: ఈ నామవాచక ప్రయోగం పాపులుగా గుర్తించబడినవారిని సూచిస్తుంది. ‘పాపులు’ సువార్త సందర్భంలోని నైతిక, సామాజిక బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς μετάνοιαν
  choice: పశ్చాత్తాపానికి
  rationale: εἰς + μετάνοιαν పిలుపు యొక్క లక్ష్యం లేదా ఉద్దేశాన్ని తెలుపుతుంది. ‘పశ్చాత్తాపానికి’ అనేది నామవాచక నిర్మాణాన్ని కాపాడుతూ, లూకా సందర్భంలో మనసు మరియు జీవనదిశ మార్పుతో కూడిన అర్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నీతిమంతులు’ నిజంగా నీతిమంతులైనవారా, లేక తమను నీతిమంతులుగా భావించేవారా?
  choice: ‘నీతిమంతులను’ అని ఎలాంటి వివరణాత్మక విశేషణం లేకుండా అనువదించడం
  alternative: ‘తాము నీతిమంతులమని భావించేవారిని’ లేదా ‘నీతిమంతులుగా పరిగణించబడేవారిని’
  rationale: గ్రీకు వాక్యం నీతిమంతులు–పాపులు అనే వ్యత్యాసాన్ని నేరుగా ఉంచుతుంది; ఇక్కడ వ్యంగ్యాన్ని లేదా స్వనీతిని స్పష్టంగా పేర్కొనదు. అందువల్ల వేదాంతపరమైన ఉద్రిక్తతను అనువాదంలోనే నిలిపాం.
- issue: μετάνοιαν యొక్క భావపరిధి
  choice: ‘పశ్చాత్తాపం’
  alternative: ‘మనసు మార్చుకోవడం’
  rationale: ‘పశ్చాత్తాపం’ లూకా సందర్భంలోని నైతిక మలుపును తెలియజేస్తుంది; అయితే అది కేవలం దుఃఖభావమేనని సంకుచితంగా అర్థం కాకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘రాలేదు … వచ్చాను’ అనే సమతుల్య నిర్మాణం గ్రీకు వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది; ‘పిలవడానికే’లోని ‘ఏ’ రెండవ భాగంపై ఉద్దేశపూర్వక దృష్టిని ఉంచుతుంది.
