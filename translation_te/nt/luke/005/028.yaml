id: LUK.5.28
reference: Luke 5:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: te
  text: అతడు సమస్తాన్నీ విడిచిపెట్టి[a], లేచి ఆయనను అనుసరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమస్తాన్నీ విడిచిన తరువాత, అతడు లేచి ఆయనను అనుసరించాడు.’
    reason: గ్రీకు భూతకృదంతాలు విడిచిపెట్టడం, లేవడం ప్రధాన అనుసరణకు ముందుగా జరిగిన చర్యలని మరింత స్పష్టంగా చూపే నిర్మాణాత్మక ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: καταλιπὼν
  choice: విడిచిపెట్టి
  rationale: καταλείπω యొక్క భూతకృదంత రూపం ప్రధాన క్రియకు ముందుగా జరిగిన నిర్ణయాత్మక చర్యను సూచిస్తుంది. ‘విడిచిపెట్టి’ సహజమైన ఆధునిక తెలుగు; ‘త్యజించి’ కంటే అనవసరమైన తీవ్రతను జోడించదు.
- source_word: πάντα
  choice: సమస్తాన్నీ
  rationale: నపుంసక బహువచన కర్మరూపం సమగ్రతను తెలియజేస్తుంది. ‘సమస్తాన్నీ’ మూలంలోని సంపూర్ణతను స్పష్టంగా ఉంచుతుంది.
- source_word: ἀναστὰς
  choice: లేచి
  rationale: ἀνίστημι యొక్క భూతకృదంతం కథన సందర్భంలో కూర్చున్న స్థితి నుంచి లేచి చర్యకు దిగడాన్ని సూచిస్తుంది. ‘లేచి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: ἠκολούθει
  choice: అనుసరించాడు
  rationale: ἀκολουθέω యొక్క అసంపూర్ణ భూతకాల రూపం కొనసాగిన అనుసరణను సూచించగలదు. తెలుగులో సాధారణ భూతకాల రూపమైన ‘అనుసరించాడు’ కథన ప్రవాహంలో సహజంగా ఉండి, ‘అనుసరించడం మొదలుపెట్టాడు’ అనే ఆరంభార్థాన్ని తప్పనిసరిగా రుద్దదు.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: దత్తివ విభక్తి సర్వనామం సమీప సందర్భంలోని యేసును సూచిస్తుంది. తెలుగులో ‘అనుసరించు’ క్రియకు సహజంగా ద్వితీయా విభక్తి వాడతారు; గౌరవార్థక ‘ఆయనను’ సందర్భానికి తగినది.
- source_word: καὶ
  choice: అతడు
  rationale: గ్రీకు καὶ ముందరి కథనంతో సరళ అనుసంధానం చేస్తుంది. స్వతంత్ర తెలుగు వాక్యంలో కర్తను స్పష్టం చేయడానికి ‘అతడు’ వాడి, అనవసరమైన ‘మరియు’తో వాక్యాన్ని ప్రారంభించలేదు.
theological_decisions:
- issue: లేవి శిష్యత్వంలో విడిచిన వాటి పరిధి
  choice: అతడు ‘సమస్తాన్నీ’ విడిచాడని పాఠ్యం చెప్పే సంపూర్ణతను నిలుపుతూ, అది ఆస్తుల శాశ్వత పరిత్యాగమనే సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
  alternative: అతడు తన పనిని తాత్కాలికంగా విడిచాడు; లేదా తన ఆస్తులన్నిటినీ శాశ్వతంగా త్యజించాడు.
  rationale: πάντα నిర్ణయాత్మకమైన సంపూర్ణ స్పందనను తెలియజేస్తుంది; అయితే ఆస్తి, వృత్తి లేదా కాలవ్యాప్తి గురించి ఈ వాక్యం మరింత నిర్దిష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సమస్తాన్నీ’ మూలంలోని సంపూర్ణతను, ‘అనుసరించాడు’ కొనసాగిన శిష్యత్వానికి వీలున్న అస్పష్టతను కాపాడుతాయి.
