  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: te
  text: 'సీమోను జవాబిచ్చి ఇలా అన్నాడు: “బోధకుడా, మేము రాత్రంతా కష్టపడి కూడా ఏమీ పట్టుకోలేదు[a]. అయినా మీ మాటను బట్టి[b] వలలు దించుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తీవ్రంగా శ్రమించాం.” గ్రీకు పదం ఎంతో ప్రయాసతో చేసిన పనిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మీ మాట మీద” / “మీ మాట కారణంగా.” ఈ గ్రీకు ప్రయోగం ఆ మాటను చర్యకు ఆధారంగా లేదా కారణంగా చూపగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: జవాబిస్తూ … అన్నాడు
  rationale: గ్రీకులో ప్రత్యక్ష సంభాషణను పరిచయం చేసే సహజమైన ద్వంద్వ ప్రయోగం. తెలుగులో భావాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: Ἐπιστάτα
  choice: అయ్యా
  rationale: యేసు అధికారాన్ని గౌరవంగా అంగీకరించే సంబోధన. κύριοςకు సాధారణంగా వాడే ‘ప్రభువా’ను ఇక్కడ చేర్చకుండా, ఆధునిక తెలుగులో సహజమైన గౌరవ సంబోధనను ఎంచుకున్నాం.
- source_word: δι’ ὅλης νυκτός
  choice: రాత్రంతా
  rationale: రాత్రి మొత్తం కొనసాగిన కాలవ్యవధిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κοπιάσαντες
  choice: కష్టపడ్డాం
  rationale: తీవ్రంగా శ్రమించిన భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὐδὲν ἐλάβομεν
  choice: ఏమీ పట్టలేదు
  rationale: చేపలు పట్టే సందర్భంలో λαμβάνω అనే క్రియకు సహజమైన తెలుగు సమానం; ‘చేపలు’ అనే కర్మ సందర్భం ద్వారా స్పష్టంగా ఉంది.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: కానీ మీ మాటను బట్టి
  rationale: యేసు పలికిన మాటే సీమోను చర్యకు ఆధారం అనే భావాన్ని నిలుపుతుంది; ఈ నిర్మాణంలో ఆధారం, కారణం అనే రెండు సమీప ఛాయలు ఉన్నాయి.
- source_word: χαλάσω
  choice: దించుతాను
  rationale: వలలను నీటిలోకి కిందికి వదలడం అనే చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ δίκτυα
  choice: వలలు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతుంది; సందర్భంలో అవి చేపల వలలని స్పష్టమే.
- source_word: δὲ
  choice: కానీ
  rationale: ఫలించని శ్రమకు, అయినప్పటికీ యేసు మాట ప్రకారం చేయాలనే నిర్ణయానికి మధ్య ఉన్న వ్యత్యాసాన్ని చూపుతుంది.
theological_decisions:
- issue: యేసుకు వాడిన Ἐπιστάτα అనే సంబోధన
  choice: అయ్యా
  alternative: ప్రభువా; గురువా; అధిపతీ
  rationale: మూలపదం κύριος కాదు; కాబట్టి ‘ప్రభువా’ అనే మరింత బలమైన క్రీస్తుతత్వార్థాన్ని దిగుమతి చేయలేదు. ‘గురువా’ అనేది బోధకుడనే భావాన్ని, ‘అధిపతీ’ అతిగా అధికారికమైన భావాన్ని కలిగించవచ్చు. ‘అయ్యా’ గౌరవం, అంగీకరించిన అధికారం రెండింటినీ సందర్భానుసారంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. మూలంలోని బహువచనమైన ‘వలలు’ను, ఫలించని శ్రమ మరియు విధేయ చర్య మధ్య వ్యత్యాసాన్ని నిలుపుకున్నాం.
