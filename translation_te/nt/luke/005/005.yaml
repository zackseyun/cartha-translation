review_pass:
  verdict: revise
  source_fidelity: The draft preserves Simon’s reply, the all-night labor, the failure to catch anything, the contrastive willingness to act, the basis ‘at your word,’ and the plural ‘nets.’ However, ‘అయ్యా’ normally functions as a general polite ‘sir’ and does not adequately convey the recognized authority expressed by Ἐπιστάτα in this context.
  naturalness: The Telugu is generally fluent. Recasting the opening as ‘సీమోను జవాబిచ్చి ఇలా అన్నాడు’ is more idiomatic than the simultaneous-sounding ‘జవాబిస్తూ … అన్నాడు.’ ‘మేము … ఏమీ పట్టుకోలేదు’ also makes the fishing action and its subject explicit and natural.
  terminology: '‘బోధకుడా’ is a suitable modern Telugu contextual rendering of Ἐπιστάτα: it recognizes Jesus’ authoritative instructional role without substituting κύριος (‘ప్రభువా’) or imposing later theological force. ‘మీ మాటను బట్టి’ appropriately conveys action grounded in his word.'
  issues:
  - severity: medium
    issue: ‘అయ్యా’ for Ἐπιστάτα is too generic.
    rationale: While respectful, it can mean merely ‘sir’ and undertranslates the address’s contextual recognition of Jesus as an authoritative master/teacher. ‘బోధకుడా’ better conveys the source sense without importing the lexical/theological force of κύριος.
  - severity: low
    issue: The participial opening ‘జవాబిస్తూ … అన్నాడు’ is less natural and can imply simultaneity.
    rationale: The Greek answer-and-say idiom is naturally expressed in Telugu as ‘జవాబిచ్చి ఇలా అన్నాడు.’
  - severity: low
    issue: Footnote b is anchored to ‘ఏమీ పట్టలేదు,’ though its content explains ‘మీ మాటను బట్టి.’
    rationale: Move the marker to the phrase it explains, preserving the intended lexical note and improving anchor accuracy.
