revisions:
- from: సీమోను జవాబిస్తూ, “అయ్యా, మేము రాత్రంతా కష్టపడ్డాం[a], అయినా ఏమీ పట్టలేదు. కానీ మీ మాటను బట్టి[b] వలలు దించుతాను” అన్నాడు.
  to: 'సీమోను జవాబిచ్చి ఇలా అన్నాడు: “బోధకుడా, మేము రాత్రంతా కష్టపడి కూడా ఏమీ పట్టుకోలేదు[a]. అయినా మీ మాటను బట్టి[b] వలలు దించుతాను.”'
  rationale: The revision improves the rendering of Ἐπιστάτα, makes the answer-speech introduction idiomatic Telugu, preserves the Greek’s effort, contrast, grounding in Jesus’ word, and plural nets, and places footnote b at its proper referent. The added ‘కూడా’ naturally expresses the concessive force implied by the fruitless all-night labor without changing the source meaning.
