review_pass:
  verdict: revise
  source_fidelity: The supplied wording adds “ఆశ్చర్యపోయారు” to make the Telugu sentence complete. This predicate is elliptically carried over from Luke 5:9 and is therefore a defensible contextual completion, but “అప్పుడు” is not represented in the Greek and should be removed. The future participial construction ἔσῃ ζωγρῶν is well represented by “పట్టుకుంటావు”; ζωγρέω’s ‘take/capture alive’ nuance should remain explicit in the text and footnote.
  naturalness: The revised wording is fluent modern standard Telugu. “సీమోనుతో ఇలా అన్నాడు” is natural narrative Telugu, and removing “ఉంటావు” avoids an unnecessarily extended progressive sense while retaining the future vocational force.
  terminology: “జెబెదయి కుమారులైన,” “భాగస్వాములు,” and “మనుషులను” are appropriate. “సజీవంగా పట్టుకుంటావు” retains Luke’s distinctive ζωγρέω image without harmonizing it with the fishing language of Matthew and Mark.
  issues:
  - severity: medium
    issue: “అప్పుడు” has been inserted before Jesus’ speech.
    rationale: The Greek has καὶ εἶπεν, ‘and [Jesus] said,’ not a temporal ‘then.’ Telugu can render the conjunction naturally without adding a temporal sequence marker.
  - severity: low
    issue: “పట్టుకుంటూ ఉంటావు” is more durative than necessary.
    rationale: ἔσῃ ζωγρῶν conveys a future ongoing vocation, but simple future “పట్టుకుంటావు” is idiomatic Telugu and adequately expresses the Greek construction.
  - severity: low
    issue: The footnote’s reference to the Matthean/Markan wording is somewhat paraphrastic.
    rationale: It should identify the distinct wording without presenting a loose Telugu formulation as though it were necessarily a quotation from those passages.
  revised_text: 'అలాగే, సీమోనుకు భాగస్వాములైన జెబెదయి కుమారులు యాకోబు, యోహాను కూడా ఆశ్చర్యపోయారు. యేసు సీమోనుతో ఇలా అన్నాడు: “భయపడకు; ఇకనుంచి నీవు మనుషులను సజీవంగా పట్టుకుంటావు[a].”'
