source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: te
  text: 'అలాగే, సీమోనుకు భాగస్వాములైన జెబెదయి కుమారులు యాకోబు, యోహాను కూడా ఆశ్చర్యపోయారు. యేసు సీమోనుతో ఇలా అన్నాడు: “భయపడకు; ఇకనుంచి నీవు మనుషులను సజీవంగా పట్టుకుంటావు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుషులను ప్రాణాలతో పట్టుకుంటావు.” ఇక్కడ వాడిన గ్రీకు క్రియకు ‘సజీవంగా పట్టుకోవడం’ అనే భావం ఉంది. మత్తయి 4:19; మార్కు 1:17లోని ‘మనుష్యులను పట్టే జాలరులు’ అనే భాషకు భిన్నంగా లూకా ఇక్కడ వేరే పదాన్ని వాడాడు.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: అలాగే ... కూడా
  rationale: ముందటి వచనంలో సీమోను మరియు అతనితో ఉన్నవారికి కలిగిన ఆశ్చర్యంతో యాకోబు, యోహానుల ప్రతిస్పందనను పోల్చుతూ, అదనపు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది. తెలుగు వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భం నుంచి ‘ఆశ్చర్యపోయారు’ను పునరుద్ధరించాం.
- source_word: υἱοὺς Ζεβεδαίου
  choice: జెబెదయి కుమారులు
  rationale: కుటుంబ గుర్తింపును సహజంగా, మూలంలోని సంబంధాన్ని యథాతథంగా తెలియజేస్తుంది.
- source_word: κοινωνοὶ
  choice: భాగస్వాములు
  rationale: చేపల వేట వృత్తి సందర్భంలో కేవలం సహచరులు అనే భావం కంటే వ్యాపార లేదా పని భాగస్వామ్యాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: Μὴ φοβοῦ
  choice: భయపడకు
  rationale: తెలుగులో సహజమైన, ప్రత్యక్షమైన ఓదార్పు ఆజ్ఞ; మూలంలోని నిరాకరణాత్మక వర్తమాన ఆజ్ఞ భావాన్ని సరియైన రీతిలో అందిస్తుంది.
- source_word: ἀπὸ τοῦ νῦν
  choice: ఇకనుంచి
  rationale: సీమోను పిలుపులో ఆ క్షణం నుంచి మొదలయ్యే నిర్ణాయక మార్పును సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: ἀνθρώπους
  choice: మనుషులను
  rationale: ఇక్కడ పదం పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది; తెలుగులో ‘మనుషులు’ ఈ సమగ్ర భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ζωγρῶν
  choice: సజీవంగా పట్టుకుంటూ ఉంటావు
  rationale: ζωγρέω లోని ‘ప్రాణాలతో పట్టుకోవడం’ అనే ప్రత్యేక భావాన్ని, అలాగే భవిష్యత్ పరిధిలో కొనసాగబోయే కార్యాన్ని నిలుపుతుంది; లూకా వాడిన రూపకాన్ని మత్తయి/మార్కుల ‘మనుష్యులను పట్టే జాలరి’ అనే మాటతో కలిపివేయదు.
theological_decisions:
- issue: యేసు సీమోనుకు ఇచ్చిన పిలుపులో ζωγρέω రూపకం
  choice: నీవు మనుషులను సజీవంగా పట్టుకుంటూ ఉంటావు
  alternative: నీవు మనుష్యులను పట్టే జాలరివి అవుతావు
  rationale: లూకా ఇక్కడ మత్తయి 4:19, మార్కు 1:17లలోని ‘మనుష్యులను పట్టే జాలరులు’ అనే పదబంధాన్ని వాడలేదు. ‘సజీవంగా పట్టుకోవడం’ అనే లూకా ప్రత్యేక పదార్థాన్ని నిలుపుతూ, సమాంతర వాక్యాలతో సమన్వయం చేయడాన్ని నివారిస్తుంది.
- issue: ἀνθρώπους యొక్క లింగ పరిధి
  choice: మనుషులను
  alternative: పురుషులను
  rationale: ఈ సందర్భంలో ఉద్దేశించబడింది మానవులందరూ; గ్రీకు వ్యాకరణ లింగాన్ని అనుసరించి అర్థాన్ని పురుషులకు మాత్రమే పరిమితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వచనం మధ్యలో మొదలవుతున్నందున గ్రీకు ὁμοίως‌కు అవసరమైన క్రియను ముందటి వచనం నుంచి సహజంగా పూరించాం. ‘సజీవంగా పట్టుకుంటూ ఉంటావు’ కొద్దిగా అసాధారణమైన రూపకమే అయినా, మూలంలోని ఉద్దేశపూర్వకమైన భావ ఉద్రిక్తతను నిలుపుతుంది.
