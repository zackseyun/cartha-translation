revisions:
- from: అలాగే, సీమోనుకు భాగస్వాములుగా ఉన్న జెబెదయి కుమారులు యాకోబు, యోహాను కూడా ఆశ్చర్యపోయారు. అప్పుడు యేసు సీమోనుతో, “భయపడకు; ఇకనుంచి నీవు మనుషులను సజీవంగా పట్టుకుంటూ ఉంటావు[a]” అన్నాడు.
  to: 'అలాగే, సీమోనుకు భాగస్వాములైన జెబెదయి కుమారులు యాకోబు, యోహాను కూడా ఆశ్చర్యపోయారు. యేసు సీమోనుతో ఇలా అన్నాడు: “భయపడకు; ఇకనుంచి నీవు మనుషులను సజీవంగా పట్టుకుంటావు[a].”'
  rationale: The carried-over ‘were astonished’ is retained as a necessary and contextually warranted completion of Luke’s ellipsis in idiomatic Telugu. The unsupported temporal adverb is removed, the future expression is made more natural, and the footnote is tightened while preserving the lexical distinction and cross-reference.
