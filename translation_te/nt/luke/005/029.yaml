id: LUK.5.29
reference: Luke 5:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: te
  text: లేవి తన ఇంట్లో ఆయన కోసం గొప్ప విందు ఏర్పాటు చేశాడు. సుంకం వసూలు చేసేవారూ ఇతరులూ పెద్ద గుంపుగా వారితో కలిసి భోజనానికి ఆనుకొని ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రాచీన కాలంలో విందుల్లో పాల్గొనేవారు పక్కకు ఆనుకొని భోజనం చేయడం ఆచారం.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: గొప్ప విందు
  rationale: δοχή ఇక్కడ ఆహ్వానితుల కోసం ఏర్పాటు చేసిన విందును సూచిస్తుంది. ‘గొప్ప విందు’ దాని ప్రాముఖ్యతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: ఆయన కోసం
  rationale: సమీప సందర్భంలో ఈ సర్వనామం యేసును సూచిస్తుంది; మూలంలోని సర్వనామ రూపాన్ని అనవసరంగా పేరుతో విస్తరించకుండా నిలిపింది.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: తన ఇంట్లో
  rationale: ఇల్లు లేవిదేనని తెలుగులో సహజంగా, స్పష్టంగా తెలిపే ప్రతిబింబాత్మక ప్రయోగం.
- source_word: ὄχλος πολὺς
  choice: పెద్ద గుంపుగా
  rationale: πολύς పరిమాణాన్నీ ὄχλος సమూహాన్నీ సూచిస్తాయి; తెలుగు వాక్య నిర్మాణంలో ఇది సహజంగా సరిపోతుంది.
- source_word: τελωνῶν
  choice: సుంకం వసూలు చేసేవారు
  rationale: రోమా పరిపాలనా నేపథ్యంలో పన్నులు లేదా సుంకాలు వసూలు చేసే వర్గాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄλλων
  choice: ఇతరులు
  rationale: ఆ ఇతరుల గుర్తింపును మూలం నిర్దిష్టం చేయదు; అనిశ్చితిని అలాగే ఉంచుతుంది.
- source_word: μετ’ αὐτῶν
  choice: వారితో కలిసి
  rationale: గ్రీకు పాఠంలోని బహువచన సర్వనామాన్ని నేరుగా నిలుపుతుంది; దాని ఖచ్చిత సూచనను అనవసరంగా పరిష్కరించదు.
- source_word: κατακείμενοι
  choice: భోజనానికి ఆనుకొని ఉన్నారు
  rationale: ప్రాచీన అధికారిక భోజనాల్లో బల్ల చుట్టూ ఆనుకొని తినే ఆచారాన్ని ‘కూర్చున్నారు’గా మార్చకుండా ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’ ప్రయోగం. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది; κατακείμενοι సూచించే ప్రాచీన భోజన భంగిమను ప్రధాన పాఠంలోనూ, వివరణను పాదటిప్పణిలోనూ నిలిపింది.
