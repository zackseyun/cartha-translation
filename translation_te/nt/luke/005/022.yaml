id: LUK.5.22
reference: Luke 5:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: te
  text: 'అయితే యేసు వారి ఆలోచనలను గ్రహించి[a], వారికి జవాబుగా ఇలా అన్నాడు: “మీ హృదయాల్లో ఎందుకు ఇలా తర్కించుకుంటున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి తర్కాలను తెలుసుకొని.”
    reason: ἐπιγνοὺς మరియు διαλογισμούς పదాల్లోని ‘తెలుసుకోవడం’ మరియు ‘తర్కాలు’ అనే మరింత పదానుసార ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: గ్రహించి
  rationale: యేసు వారి అంతరంగ ఆలోచనలను పూర్తిగా తెలుసుకున్నాడనే జ్ఞానార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఆయనకు అది ఎలా తెలిసిందో మూలపాఠం చెప్పనందున ఆ విధానాన్ని వివరించదు.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి అంతరంగ అభ్యంతరాల నుంచి యేసు ప్రతిస్పందనకు వచ్చే స్వల్ప వ్యత్యాసాన్ని, కథన మలుపును తెలుపుతుంది.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: వారి ఆలోచనలను
  rationale: వారి మనస్సులో సాగుతున్న అంతరంగ పరిశీలనలను సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: వారికి జవాబుగా ఇలా అన్నాడు
  rationale: గ్రీకు భాషలోని ‘జవాబిచ్చి అన్నాడు’ అనే ద్వంద్వ వ్యక్తీకరణ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Τί
  choice: ఎందుకు
  rationale: διαλογίζεσθεతో ఉన్న ఈ సందర్భంలో τί వారి అంతరంగ తర్కానికి కారణాన్ని ప్రశ్నిస్తుంది; అందువల్ల ‘ఎందుకు’ సహజమైన సందర్భార్థం.
- source_word: διαλογίζεσθε
  choice: తర్కించుకుంటున్నారు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న అంతరంగ ఆలోచన, విచారణ భావాన్ని ‘ఆలోచిస్తున్నారు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: మీ హృదయాల్లో
  rationale: καρδία సూచించే అంతరంగ వ్యక్తిత్వం—ఆలోచన, సంకల్పం—అనే బైబిలు రూపకాన్ని వ్యాఖ్యానాత్మకంగా కుదించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఇతరుల అంతరంగ ఆలోచనల గురించి యేసుకు ఉన్న జ్ఞానం
  choice: యేసు వారి ఆలోచనలను గ్రహించాడని నేరుగా అనువదించడం; ఆ జ్ఞానం ఆయనకు ఎలా కలిగిందో వివరించకపోవడం.
  alternative: ‘వారి ఆలోచనలను అద్భుతరీతిలో తెలుసుకొని’ అని స్పష్టంగా చెప్పడం, లేదా ‘వారు ఏమనుకుంటున్నారో ఊహించి’ అని బలహీనపరచడం.
  rationale: మూలపాఠం యేసుకు వారి అంతరంగ తర్కం తెలిసిందని చెబుతుంది గాని, ఆ జ్ఞాన విధానాన్ని వివరించదు. ఈ అనువాదం ఆ వాస్తవాన్ని నిలుపుతూ అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, గౌరవప్రదంగా ఉంది. ‘హృదయాల్లో’ అనే బైబిలు అంతరంగ రూపకాన్ని నిలుపుతూ, ‘తర్కించుకుంటున్నారు’ ద్వారా కొనసాగుతున్న అంతరంగ విచారణను వ్యక్తం చేసింది.
