id: LUK.5.30
reference: Luke 5:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: te
  text: పరిసయ్యులూ వారి శాస్త్రులూ ఆయన శిష్యులతో, “మీరు పన్ను వసూలుదారులతోను పాపులతోను ఎందుకు తింటారు, తాగుతారు?” అని సణుగుతూ ఉండేవారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొణుగుతూ ఉండేవారు.” గ్రీకు క్రియ బహిరంగ అభ్యంతరాన్ని మాత్రమే కాక, అసంతృప్తితో మెల్లగా ఫిర్యాదు చేయడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: సణుగుతూ
  rationale: ఈ క్రియ అసంతృప్తితో గొణుక్కోవడం లేదా సణగడం అనే భావాన్ని ఇస్తుంది; అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచిస్తుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్ర సంబంధిత చారిత్రక వర్గాన్ని సూచించే స్థిరమైన, సంక్షిప్త తెలుగు పదం.
- source_word: αὐτῶν
  choice: వారి
  rationale: గ్రీకు వాక్యనిర్మాణం ప్రకారం శాస్త్రులను పరిసయ్యులతో సంబంధపరుస్తున్న సర్వనామాన్ని నేరుగా నిలుపుతుంది.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ఆయన శిష్యుల దగ్గర
  rationale: ఇక్కడ πρός మాటలు ఎవరిని ఉద్దేశించి చెప్పారో సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే సహజమైన తెలుగు ప్రశ్నార్థక రూపం.
- source_word: τελωνῶν
  choice: సుంకరులతో
  rationale: సువార్తల చారిత్రక సందర్భంలోని పన్ను లేదా సుంకం వసూలు చేసేవారిని సూచించే సంప్రదాయబద్ధమైన, అర్థవంతమైన పదం.
- source_word: ἁμαρτωλῶν
  choice: పాపులతో
  rationale: మాట్లాడుతున్నవారు సామాజికంగా, నైతికంగా గుర్తించిన వర్గాన్ని నేరుగా సూచిస్తూ మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: ἐσθίετε καὶ πίνετε
  choice: తింటూ తాగుతున్నారు
  rationale: రెండు స్పష్టమైన క్రియలనూ నిలుపుతూ, జరుగుతున్న లేదా అలవాటైన సహవాసంపై ప్రశ్నను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: καὶ
  choice: అప్పుడు
  rationale: కథన ప్రవాహంలోని అనుసంధానాన్ని సహజ తెలుగులో చూపుతుంది; కొత్త అర్థాన్ని చేర్చదు.
theological_decisions:
- issue: ‘సుంకరులు, పాపులు’ అనే వారితో భోజన సహవాసం కలిగిన సామాజిక-మతపరమైన తీవ్రత
  choice: వారితో కలిసి తినడం, తాగడం గురించిన స్పష్టమైన అభ్యంతరాన్ని యథాతథంగా ఉంచడం
  alternative: ఆచారపరమైన అపవిత్రత లేదా నైతిక సమ్మతిని వివరణగా చేర్చడం
  rationale: వచనం అభ్యంతరాన్ని వర్గాల పేర్లతోనూ భోజన సహవాసంతోనూ మాత్రమే తెలియజేస్తుంది. అంతకుమించిన మతపరమైన వివరణను చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘పరిసయ్యులు,’ ‘శాస్త్రులు,’ ‘సుంకరులు’ అనే చారిత్రక-మతపరమైన పదాలను నిలుపుతూ, సంభాషణను సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా రూపొందించాం.
