  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: te
  text: ఆయన వారి విశ్వాసాన్ని[a] చూసి, “మనిషీ, నీ పాపాలు క్షమించబడ్డాయి[b]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నమ్మకాన్ని’; గ్రీకులో ‘విశ్వాసం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘క్షమించబడి ఉన్నాయి.’ గ్రీకు పర్ఫెక్ట్ పాసివ్ రూపం, పూర్తయిన కార్యం వల్ల ఏర్పడిన ప్రస్తుత స్థితిని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: చూసి
  rationale: అఓరిస్ట్ క్రియావిశేషణ రూపంలోని కాలసంబంధ ప్రవాహాన్ని సహజమైన తెలుగులో చూపిస్తుంది; క్రమాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: πίστιν
  choice: విశ్వాసాన్ని
  rationale: ఈ సందర్భంలో కనిపించిన నమ్మకాన్ని సూచించే ప్రామాణిక, సహజమైన తెలుగు పదం; ‘నమ్మకాన్ని’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: αὐτῶν
  choice: వారి
  rationale: గ్రీకు బహువచనాన్ని అలాగే ఉంచి, అది పక్షవాత రోగితోపాటు అతనిని తీసుకొచ్చినవారినీ సూచిస్తుందా లేక తీసుకొచ్చినవారినే సూచిస్తుందా అన్నది నిర్ణయించదు.
- source_word: Ἄνθρωπε
  choice: మనిషీ
  rationale: పుంలింగ ఏకవచన సంబోధనను నేరుగా ప్రతిబింబిస్తుంది; ‘స్నేహితుడా’ వంటి మూలంలో లేని ఆప్యాయతను చేర్చదు.
- source_word: ἀφέωνταί
  choice: క్షమించబడ్డాయి
  rationale: పర్ఫెక్ట్ పాసివ్ రూపం తెలిపే, పూర్తయిన కార్యం ఫలితంగా ప్రస్తుతం ఉన్న స్థితిని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἁμαρτίαι
  choice: పాపాలు
  rationale: నైతిక, దైవశాస్త్రీయ భావాన్ని తగ్గించకుండా నేరుగా తెలిపే సాధారణ తెలుగు పదం.
- source_word: σοι ... σου
  choice: నీ
  rationale: తెలుగులో ‘నీ పాపాలు క్షమించబడ్డాయి’ అనడం సహజం; గ్రీకులోని ప్రయోజనార్థక దత్తి భావం సందర్భంలో స్పష్టంగా అంతర్లీనంగా ఉంటుంది.
theological_decisions:
- issue: ‘వారి విశ్వాసం’ పరిధి
  choice: బహువచనమైన ‘వారి’ని ప్రధాన పాఠ్యంలో నిలుపుకోవడం
  alternative: ఇది అతనిని మోసుకొచ్చినవారి విశ్వాసాన్ని మాత్రమే సూచిస్తుంది; లేదా రోగి మరియు అతని సహచరుల ఉమ్మడి విశ్వాసాన్ని సూచిస్తుంది
  rationale: మూలంలోని αὐτῶν బహువచనం ఎవరెవరిని కలుపుతుందో స్పష్టంగా నిర్ణయించదు; అనువాదం ఆ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- issue: క్షమాపణ ప్రకటన యొక్క కాలబలం
  choice: ‘నీ పాపాలు క్షమించబడ్డాయి’ అనే స్థితి-ఫలిత ప్రకటన
  alternative: అదే క్షణంలో క్షమాపణను కలిగించే ప్రకటన; లేదా అప్పటికే అనుగ్రహించబడిన క్షమాపణను ప్రకటించడం
  rationale: గ్రీకు పర్ఫెక్ట్ పాసివ్ క్షమించబడిన ప్రస్తుత స్థితిని తెలుపుతుంది, కాని దాని ఖచ్చిత కాలపరమైన దైవశాస్త్రీయ విధానాన్ని తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంబోధనలో మూలంలోని నేరుతనాన్ని నిలుపుతూ, అదనపు ఆప్యాయత లేదా సామాజిక గౌరవార్థక భావాన్ని చేర్చలేదు.
