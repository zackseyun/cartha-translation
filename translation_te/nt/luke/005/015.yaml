revisions:
- from: అయితే ఆయనను గురించిన వార్త మరింతగా వ్యాపిస్తూ వచ్చింది[a]. ఆయన మాట వినడానికీ, తమ రోగాలనుండి స్వస్థత పొందడానికీ పెద్ద జనసమూహాలు కూడివస్తూ ఉండేవి.
  to: అయితే ఆయనను గురించిన వార్త మరింతగా వ్యాపిస్తూ ఉండేది[a], మరియు అనేక జనసమూహాలు వినడానికీ తమ రోగాలనుండి స్వస్థత పొందడానికీ కూడివస్తూ ఉండేవి.
