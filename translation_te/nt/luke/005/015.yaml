id: LUK.5.15
reference: Luke 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: te
  text: అయితే ఆయనను గురించిన వార్త మరింతగా వ్యాపిస్తూ ఉండేది[a], మరియు అనేక జనసమూహాలు వినడానికీ తమ రోగాలనుండి స్వస్థత పొందడానికీ కూడివస్తూ ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను గురించిన మాట” లేదా “ఆయనను గురించిన సమాచారం.”
    reason: λόγος అనే పదానికి ఈ సందర్భంలో సాధ్యమైన పదార్థ ప్రత్యామ్నాయాలను తెలియజేయడం.
lexical_decisions:
- source_word: διήρχετο
  choice: వ్యాపిస్తూ వచ్చింది
  rationale: అసంపూర్ణ భూతకాల రూపం వార్త నిరంతరంగా వ్యాపిస్తున్న భావాన్ని తెలుపుతుంది; ఈ తెలుగు ప్రయోగం ఆ కొనసాగుతున్న చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μᾶλλον
  choice: మరింతగా
  rationale: ముందటికంటే ఎక్కువగా వ్యాపించిందనే తులనాత్మక తీవ్రతను నిలుపుతుంది.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: ఆయనను గురించిన వార్త
  rationale: ఈ కథన సందర్భంలో λόγος అనేది యేసును గురించి ప్రజల్లో వ్యాపిస్తున్న సమాచారం లేదా వార్తను సూచిస్తుంది; సాంకేతిక వేదాంతార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: συνήρχοντο
  choice: కూడివస్తూ ఉండేవి
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న లేదా పదేపదే జరిగే సమూహ చర్యను తెలియజేస్తుంది.
- source_word: ὄχλοι πολλοὶ
  choice: పెద్ద జనసమూహాలు
  rationale: అనేక పెద్ద గుంపులు వచ్చాయనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀκούειν
  choice: ఆయన మాట వినడానికి
  rationale: గ్రీకులో వినవలసిన విషయం స్పష్టంగా చెప్పకపోయినా సందర్భంలో యేసు బోధను వినడమే ఉద్దేశం; తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘ఆయన మాట’ చేర్చబడింది.
- source_word: θεραπεύεσθαι
  choice: స్వస్థత పొందడానికి
  rationale: వర్తమాన కర్మణి క్రియార్థక రూపంలోని స్వస్థపరచబడే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: తమ రోగాలనుండి
  rationale: స్వస్థత సందర్భంలో ἀσθένεια శారీరక రోగాలను సూచిస్తుంది; ἀπό లోని ‘నుండి విముక్తి’ భావాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: స్వస్థత భాష యొక్క స్వభావం
  choice: శారీరక రోగాలనుండి స్వస్థత పొందడం
  alternative: ఆత్మీయ పునరుద్ధరణను కూడా సూచించగల ‘సంపూర్ణంగా బాగుపడడం’ వంటి విస్తృత భాష
  rationale: తక్షణ కథన సందర్భం శారీరక వ్యాధుల స్వస్థతను సూచిస్తోంది; వచనం స్పష్టంగా చెప్పని ఆత్మీయ స్వస్థత భావాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన కథన శైలిలో ఉంది. రెండు గ్రీకు అసంపూర్ణ భూతకాల క్రియల కొనసాగుతున్న భావాన్ని ‘వ్యాపిస్తూ వచ్చింది’, ‘కూడివస్తూ ఉండేవి’ ద్వారా నిలిపింది.
