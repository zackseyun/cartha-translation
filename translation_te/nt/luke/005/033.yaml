  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: te
  text: 'వారు ఆయనతో ఇలా అన్నారు: “యోహాను శిష్యులు తరచుగా ఉపవాసం ఉంటారు, ప్రార్థనలు చేస్తారు; పరిసయ్యుల శిష్యులు కూడా అలాగే చేస్తారు[a]. కానీ నీ శిష్యులు తింటారు, తాగుతారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘పరిసయ్యులవారు’ అని ఉంది; ముందటి ఉపవాక్యంలోని ‘శిష్యులు’ అనే పదం ఇక్కడ అధ్యాహారంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో కేవలం ‘నీవారు’ అని ఉంది; సందర్భం ప్రకారం ‘శిష్యులు’ అనే పదం అధ్యాహారంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: అప్పుడు వారు ఆయనతో … అన్నారు
  rationale: δέ స్వల్ప అనుసంధాన పదం. తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా ఉండి, బలమైన వ్యతిరేకతను అనవసరంగా సూచించదు.
- source_word: μαθηταὶ Ἰωάννου
  choice: యోహాను శిష్యులు
  rationale: సంబంధార్థక షష్ఠీని తెలుగులో సహజమైన నామవాచక సమాసంగా వ్యక్తం చేసింది.
- source_word: νηστεύουσιν πυκνά
  choice: తరచుగా ఉపవాసం ఉండి
  rationale: πυκνά పునరావృత ఆచరణను సూచిస్తుంది; ‘తరచుగా’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: δεήσεις ποιοῦνται
  choice: ప్రార్థనలు చేస్తారు
  rationale: δεήσεις అనే నామవాచక బలాన్ని నిలుపుతూ, ποιεῖσθαι అనే గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగు పదబంధంగా అందిస్తుంది.
- source_word: ὁμοίως καὶ οἱ τῶν Φαρισαίων
  choice: పరిసయ్యులవారు కూడా అలాగే చేస్తారు
  rationale: గ్రీకులో ముందు వచ్చిన ‘శిష్యులు’ అనే పదం ఇక్కడ అధ్యాహారంగా ఉంది. ‘పరిసయ్యులవారు’ ఆ సంక్షిప్తతను కొంత నిలుపుతుంది; తెలుగు వాక్యానికి అవసరమైన ‘చేస్తారు’ క్రియను సందర్భానుసారంగా పూరించింది.
- source_word: οἱ δὲ σοὶ
  choice: కాని నీవారు
  rationale: గ్రీకులో ‘నీ శిష్యులు’ అనే భావం సంక్షిప్తంగా ‘నీవారు’ అని ఉంది. తెలుగులోనూ అదే సంక్షిప్తతను నిలుపుతూ, వ్యత్యాసాన్ని ‘కాని’ స్పష్టం చేస్తుంది.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: తింటూ తాగుతూ ఉంటారు
  rationale: వర్తమాన కాలంలోని అలవాటైన ప్రవర్తనను తెలుగు సంయుక్త క్రియ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రెండవ, మూడవ ఉపవాక్యాల్లో ‘శిష్యులు’ అనే పదాన్ని స్పష్టంగా చేర్చాలా
  choice: ప్రధాన పాఠ్యంలో గ్రీకు అధ్యాహారాన్ని ‘పరిసయ్యులవారు,’ ‘నీవారు’ అని నిలుపడం
  alternative: ‘పరిసయ్యుల శిష్యులు,’ ‘నీ శిష్యులు’ అని స్పష్టంగా పూరించడం
  rationale: ఇది సిద్ధాంతపరమైన వివాదం కాదు; మూల నిర్మాణ పారదర్శకతకు సంబంధించినది. ప్రధాన పాఠ్యంలో అధ్యాహారాన్ని నిలిపి, పాదటిప్పణుల్లో ఉద్దేశిత నామవాచకాన్ని స్పష్టం చేయడం మూలానికి నిబద్ధతతో పాటు పాఠక స్పష్టతను ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఉపవాసం ఉండడం,’ ‘ప్రార్థనలు చేయడం’ వంటి సాధారణంగా అర్థమయ్యే మతపర పదప్రయోగాలు వాడబడ్డాయి. మూలంలోని రెండు అధ్యాహార నిర్మాణాలు ప్రధాన పాఠ్యంలో సాధ్యమైనంతవరకు నిలుపబడి, పాదటిప్పణుల్లో వివరణ ఇవ్వబడింది.
