id: LUK.5.1
reference: Luke 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: te
  text: 'ఇలా జరిగింది: జనసమూహం ఆయన మీదికి ఒత్తుకుంటూ దేవుని వాక్యాన్ని వింటుండగా[a], ఆయన గెన్నేసరెతు సరస్సు ఒడ్డున నిలబడి ఉన్నాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనసమూహం ఆయన మీదికి ఒత్తుకుంటూ దేవుని వాక్యాన్ని వినేటప్పుడు.”
    reason: కాలసంబంధ గ్రీకు నిర్మాణాన్ని ‘వింటుండగా’ లేదా ‘వినేటప్పుడు’ అని రెండువిధాలుగా సహజంగా వ్యక్తం చేయవచ్చు.
  - marker: b
    text: గెన్నేసరెతు సరస్సే గలిలయ సముద్రం అని కూడా పిలువబడుతుంది.
    reason: ఆధునిక పాఠకులకు ఈ స్థలానికి సంబంధించిన మరో సుపరిచిత పేరును తెలియజేస్తుంది.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ఇలా జరిగింది
  rationale: లూకా తరచుగా ఉపయోగించే సంఘటనను పరిచయం చేసే కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని స్పష్టమైన కాలార్థక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: ఒత్తుకుంటూ ... వింటుండగా
  rationale: ἐν + articular infinitive యొక్క కాలసంబంధ భావాన్ని ‘ఉండగా’తో చూపిస్తూ, జనసమూహం ఒత్తుకోవడం మరియు వినడం అనే రెండు సమకాలిక క్రియలనూ నిలుపుతుంది.
- source_word: ὄχλον
  choice: జనసమూహం
  rationale: ὄχλοςకు సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: ఆయన మీదికి ఒత్తుకుంటూ
  rationale: ప్రజలు యేసు మీదికి భౌతికంగా ఒత్తుకుంటూ వచ్చిన భావాన్ని స్పష్టంగా, అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: ἀκούειν
  choice: వింటుండగా
  rationale: కొనసాగుతున్న శ్రద్ధాపూర్వక వినికిడిని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: మూలపదబంధంలోని విస్తృతమైన ప్రకటనార్థాన్నీ, బైబిలు అంతటా ఉన్న అనుసంధానాన్నీ కాపాడే సుపరిచిత పదప్రయోగం.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: ఆయన ... నిలబడి ఉన్నాడు
  rationale: కొనసాగుతున్న శరీర భంగిమను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; αὐτόςకు సందర్భం కోరని అదనపు ఉద్ఘాటనను విధించదు.
- source_word: παρὰ τὴν λίμνην
  choice: సరస్సు ఒడ్డున
  rationale: సరస్సు పక్కన ఉన్న స్థానాన్ని తెలుగులో సహజంగా, నిర్దిష్టంగా తెలుపుతుంది.
- source_word: Γεννησαρέτ
  choice: గెన్నేసరెతు
  rationale: గ్రీకు పాఠంలోని స్థలనామాన్ని వివరణాత్మకమైన మరో పేరుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: τὸν λόγον τοῦ θεοῦ అనువాదం
  choice: దేవుని వాక్యాన్ని
  alternative: దేవుని సందేశాన్ని
  rationale: ఈ సందర్భంలో ప్రకటించబడుతున్న సందేశం భావం ఉన్నప్పటికీ, ‘వాక్యం’ అనే అనువాదం పదబంధపు వేదాంతపరమైన విస్తృతిని, అంతర్గ్రంథ సంబంధాన్ని ముందుగానే సంకుచితం చేయదు.
- issue: Γεννησαρέτ పేరు నిర్వహణ
  choice: గెన్నేసరెతు
  alternative: గలిలయ సముద్రం
  rationale: మూలపాఠం సరస్సును గెన్నేసరెతు అని పేరుపెడుతుంది. ప్రధాన పాఠంలో ‘గలిలయ సముద్రం’ అని మార్చడం మూలంలో లేని వివరణాత్మక గుర్తింపును చేర్చుతుంది; ఆ సమాచారం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇలా జరిగింది’ లూకా కథన పరిచయ సూత్రాన్ని నిలుపుతుంది; ‘ఒత్తుకుంటూ’ జనసమూహం కలిగించిన భౌతిక ఒత్తిడిని స్పష్టంగా చూపుతుంది. స్థలనామం మూలానికి అనుగుణంగా ప్రధాన పాఠంలో ఉంచి, గుర్తింపు సమాచారాన్ని పాదసూచికకు పరిమితం చేశాం.
