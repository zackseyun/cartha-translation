source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: te
  text: 'వెంటనే అతడు వారి ఎదుట లేచి నిలబడి, తాను పడుకొని ఉన్నదాన్ని[a] ఎత్తుకొని, దేవుణ్ణి మహిమపరుస్తూ తన ఇంటికి వెళ్లిపోయాడు.


    [a] లేదా, “తాను పడుకొని ఉన్న పరుపును.” అక్షరార్థంగా, “తాను దేనిమీద పడుకొని ఉన్నాడో దాన్ని.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను పడుకొని ఉన్న పరుపును.” అక్షరార్థంగా, “తాను దేనిమీద పడుకొని ఉన్నాడో దాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా తక్షణమే జరిగిన కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀναστὰς
  choice: లేచి నిలబడి
  rationale: కృదంత రూపాన్ని తెలుగు కథనానికి సహజమైన వరుస కార్యంగా చూపుతూ, అతడు లేచి నిలబడిన భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐνώπιον αὐτῶν
  choice: వారి ఎదుట
  rationale: అక్కడున్నవారి సమక్షంలో అందరికీ కనిపించేలా జరిగినదనే భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ἄρας
  choice: ఎత్తుకొని
  rationale: అతడు పడుకొని ఉన్న వస్తువును పైకెత్తి తనతో తీసుకెళ్లిన స్పష్టమైన కార్యాన్ని తెలియజేస్తుంది.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: తాను పడుకొని ఉన్నదాన్ని
  rationale: మూల వాక్యంలో పరుపు లేదా మంచం అనే నామవాచకం స్పష్టంగా లేకపోవడంతో, సంబంధవాచక నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: κατέκειτο
  choice: పడుకొని ఉన్న
  rationale: అతని మునుపటి కొనసాగుతున్న స్థితిని తెలుగు సహజ ప్రయోగంలో వ్యక్తపరుస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: ఆ ప్రదేశం నుండి వెళ్లిన దిశాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: తన ఇంటికి
  rationale: అతని స్వంత ఇల్లు లేదా నివాసస్థలానికి వెళ్లాడనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: δοξάζων τὸν θεόν
  choice: దేవుణ్ణి మహిమపరుస్తూ
  rationale: దేవునికి మహిమ, ఘనత చెల్లించే విస్తృత భావాన్ని కాపాడుతుంది; కేవలం మాటలతో స్తుతించడానికే పరిమితం చేయదు.
theological_decisions:
- issue: అతడు మోసుకెళ్లిన వస్తువును ప్రధాన పాఠ్యంలో ‘పరుపు’ లేదా ‘మంచం’ అని నిర్దిష్టంగా చెప్పాలా
  choice: మూలంలోని సంబంధవాచక నిర్మాణానికి దగ్గరగా ‘తాను పడుకొని ఉన్నదాన్ని’ అని ఉంచడం
  alternative: ‘తాను పడుకొని ఉన్న పరుపును’ లేదా ‘తాను పడుకొని ఉన్న మంచాన్ని’
  rationale: ఈ వచనంలోని గ్రీకు పాఠ్యం ఆ వస్తువుకు ప్రత్యేక నామవాచకాన్ని ఉపయోగించదు. కాబట్టి ప్రధాన పాఠ్యంలో అనవసర నిర్దిష్టతను చేర్చకుండా, సులభంగా అర్థమయ్యే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే కథన శైలి. వరుస క్రియలను స్పష్టంగా ఉంచుతూ మూలంలోని వస్తు-అనిర్దిష్టతను కాపాడింది.
