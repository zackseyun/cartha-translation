  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని చర్యల క్రమం, జనసమూహం కారణమైన అడ్డంకి, పెంకుల పైకప్పు అనే నిర్మాణ వివరాలు నిలుపబడ్డాయి; ποίας మరియు κλινίδιον పదాల్లోని నిజమైన భావవిస్తృతిని పాదసూచికల్లో చూపించాం.
