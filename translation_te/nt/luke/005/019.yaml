source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: te
  text: జనసమూహం వల్ల అతన్ని లోపలికి తీసుకురావడానికి దారి కనిపించక[a], వారు పైకప్పు మీదికి ఎక్కి, పైకప్పు పెంకుల గుండా[b] అతన్ని అతని పరుపుతోపాటు[c] యేసు ఎదుట మధ్యలోకి దించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జనసమూహం వల్ల అతన్ని లోపలికి ఎలా తీసుకురావాలో తెలియక.’ గ్రీకు ప్రయోగం ప్రవేశించే దారినే కాక, తీసుకురావాల్సిన విధానాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, పైకప్పు పెంకుల గుండా. లూకా వాడిన మాటలు పెంకులతో కప్పిన పైకప్పును సూచిస్తున్నాయి.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘చిన్న మంచంతోపాటు’ లేదా ‘పడకతోపాటు.’ గ్రీకు పదం చిన్న మంచం, పడక లేదా నిద్రించడానికి ఉపయోగించే పరుపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας
  choice: దారి
  rationale: ఈ పదం ఇక్కడ ‘ఏ దారిన’ లేదా ‘ఎలా’ అనే భావంలో అధ్యాహారంగా వాడబడింది. సందర్భంలో జనసమూహం ప్రవేశానికి అడ్డుగా ఉంది కాబట్టి ‘దారి’ సహజంగా ఉండి, చేరుకునే మార్గాన్ని ప్రధానంగా తెలియజేస్తుంది.
- source_word: εἰσενέγκωσιν
  choice: లోపలికి తీసుకురావడానికి
  rationale: ఈ క్రియ ఒక వ్యక్తిని లోపలికి తీసుకురావడాన్ని సూచిస్తుంది. సందర్భంలో మోసుకొస్తున్నారనే విషయం స్పష్టమైనప్పటికీ, మూలపదం కంటే ఎక్కువ నిర్దిష్టతను చేర్చకుండా ‘తీసుకురావడానికి’ అని అనువదించబడింది.
- source_word: διὰ τὸν ὄχλον
  choice: జనసమూహం వల్ల
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ స్థలార్థం కాక కారణార్థం ఇస్తుంది; జనసమూహమే ప్రవేశానికి అడ్డంకి.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: పైకప్పు మీదికి ఎక్కి
  rationale: δῶμα ఇంటి పైకప్పు లేదా మిద్దె ప్రాంతాన్ని సూచిస్తుంది. ‘పైకప్పు మీదికి ఎక్కి’ ఆధునిక తెలుగులో సహజంగా ఉండి పైకి వెళ్లిన కదలికను నిలుపుతుంది.
- source_word: διὰ τῶν κεράμων
  choice: పైకప్పు పెంకుల గుండా
  rationale: κεράμων అనే బహువచనం మట్టి పైకప్పు పెంకులను సూచిస్తుంది. ‘పైకప్పు పెంకులు’ లూకా పేర్కొన్న నిర్మాణ వివరాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: καθῆκαν
  choice: కిందికి దించి
  rationale: ఈ క్రియ పై నుంచి కిందికి దించడాన్ని సూచిస్తుంది; ‘కిందికి దించి’ తెలుగులో చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: σὺν τῷ κλινιδίῳ
  choice: అతని పరుపుతోపాటు
  rationale: κλινίδιον చిన్న మంచం, పడక లేదా పరుపును సూచించే పదం. ‘పరుపు’ సాధారణ పాఠకులకు సహజంగా ఉండి, ఆధునిక వైద్య పరికరమనే భావాన్ని అనవసరంగా కలిగించదు. ‘అతని’ అనేది సందర్భం నుంచి సహజంగా సరఫరా చేయబడింది.
- source_word: εἰς τὸ μέσον
  choice: మధ్యలో
  rationale: ఈ పదబంధం అక్కడ కూడినవారి మధ్యనున్న ప్రదేశాన్ని సూచిస్తుంది. ‘మధ్యలో’ సరళమైన ఆధునిక తెలుగు.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: యేసు ఎదుట
  rationale: ఈ పదబంధం యేసుకు ఎదురుగా లేదా ఆయన ముందున్న స్థలాన్ని సూచిస్తుంది. ‘యేసు ఎదుట’ ఆ స్థలార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
