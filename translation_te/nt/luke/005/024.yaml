id: LUK.5.24
reference: Luke 5:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: te
  text: 'అయితే, మనుష్యకుమారునికి భూమిమీద పాపాలను క్షమించే అధికారం ఉందని మీరు తెలుసుకోవడానికి—అని ఆయన పక్షవాతంతో ఉన్న వ్యక్తితో[a] ఇలా అన్నాడు: “నేను నీకు చెబుతున్నాను, లేచి, నీ పరుపు[b] ఎత్తుకొని, నీ ఇంటికి వెళ్లు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పక్షవాతగ్రస్తుడు.’ గ్రీకులో ఇది పక్షవాతానికి గురైన వ్యక్తిని సూచించే కృదంత ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: ‘పరుపు’ అని అనువదించిన గ్రీకు పదం చిన్న మంచం, పడక లేదా చాపను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: అయితే, ... మీరు తెలుసుకోవాలి
  rationale: δέ సూచించే స్వల్ప భావమార్పును ‘అయితే’ తెలియజేస్తుంది. సందర్భంలో ἵνα ఉద్దేశాన్ని సూచించినా, ప్రధాన వాక్యం మధ్యలో ఆగి ప్రత్యక్ష ఆజ్ఞకు మారుతుంది; సహజమైన తెలుగులో ‘తెలుసుకోవాలి’ ఆ ఉద్దేశాన్నీ నిశ్చయాన్నీ తెలియజేస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు తనను తాను సూచించుకోవడానికి వాడిన ఈ బిరుదును అనువదించి నిలుపుతుంది; దానియేలు 7తో ఉన్న ప్రతిధ్వనిని, బిరుదులోని భావగాఢతను కాపాడుతుంది.
- source_word: ἐξουσίαν ἔχει
  choice: అధికారం ... ఉంది
  rationale: ἐξουσία కేవలం శక్తిని కాకుండా హక్కుతో కూడిన అధికారాన్ని సూచిస్తుంది; పాపాలను క్షమించే హక్కు గురించిన సందర్భానికి ‘అధికారం’ సరిపోతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: మూలంలోని స్థలసూచనను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నేరుగా, సహజంగా అందిస్తుంది.
- source_word: ἀφιέναι ἁμαρτίας
  choice: పాపాలను క్షమించే
  rationale: ఈ సందర్భంలో ἀφίημι పాపాలను విడిచిపెట్టడం లేదా మన్నించడం అనే భావంలో ఉంది; ఆధునిక తెలుగులో ‘క్షమించే’ స్పష్టమైన సాధారణ పదం.
- source_word: τῷ παραλελυμένῳ
  choice: పక్షవాతం వచ్చిన వ్యక్తితో
  rationale: కృదంతాన్ని వ్యక్తిని సూచించే నామవాచక ప్రయోగంగా సహజ తెలుగులో వ్యక్తపరుస్తుంది; వ్యక్తినే వ్యాధితో పూర్తిగా గుర్తింపజేసే కఠిన పదప్రయోగాన్ని నివారిస్తుంది.
- source_word: Σοὶ λέγω
  choice: నీతో చెప్తున్నాను
  rationale: Σοίకు ఉన్న ఉద్ఘాటనను ‘నీతో’ నిలుపుతూ, ప్రత్యక్షమైన గంభీర ఆజ్ఞగా సహజంగా వినిపిస్తుంది.
- source_word: ἔγειρε
  choice: లేచి
  rationale: తక్షణ చర్యకు ఇచ్చిన ఆజ్ఞను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἄρας τὸ κλινίδιόν σου
  choice: నీ పరుపు ఎత్తుకొని
  rationale: ἄρας ఎత్తుకొని తీసుకెళ్లే చర్యను సూచిస్తుంది. κλινίδιον చిన్న మంచం, పడక లేదా పరుపును సూచించగలదు; సందర్భంలో ‘పరుపు’ సహజంగా సరిపోతుంది.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: నీ ఇంటికి వెళ్లు
  rationale: గమ్యస్థానంతో కూడిన ఆజ్ఞను సరళమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: దీనిని సాధారణ మానవుడనే భావానికి కుదించకుండా, యేసు స్వీయసూచనగా మరియు దానియేలు 7ను ప్రతిధ్వనించే బిరుదుగా నిలుపుతుంది.
- issue: పాపాలను క్షమించడంలో ἐξουσία భావం
  choice: అధికారం
  alternative: శక్తి
  rationale: ఇక్కడ ప్రశ్న కేవలం కార్యసామర్థ్యం గురించి కాదు; పాపాలను క్షమించే న్యాయమైన హక్కు లేదా ప్రాధికారంపై ఉంది. అందువల్ల ‘అధికారం’ మూలభావాన్ని మెరుగ్గా కాపాడుతుంది.
- issue: ἐπὶ τῆς γῆς పరిధి
  choice: భూమిమీద
  alternative: భూలోక పరిధిలో
  rationale: వ్యాఖ్యానాన్ని చేర్చకుండా మూలంలోని సరళ స్థలపదబంధాన్ని నిలుపుతుంది; ఆ అధికారం భూమిమీద కార్యరూపం దాల్చుతుందనే వాక్యంలోని ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలో ఉద్దేశవాక్యం మధ్యలో నిలిచి యేసు ఆ వ్యక్తితో మాట్లాడే నిర్మాణాన్ని దీర్ఘ డాష్‌తో నిలిపాం. ‘మనుష్యకుమారుడు,’ ‘అధికారం’ వంటి స్థిరమైన బైబిలు పదాలు వాటి అంతర్గ్రంథీయ మరియు తాత్త్విక బరువుతో ఉంచబడ్డాయి.
