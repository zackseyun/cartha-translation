revisions:
- from: 'అయితే, భూమిమీద పాపాలను క్షమించే అధికారం మనుష్యకుమారునికి ఉందని మీరు తెలుసుకోవాలి”—అని పక్షవాతం వచ్చిన వ్యక్తితో[a] ఆయన, “నీతో చెప్తున్నాను: లేచి, నీ పరుపు[b] ఎత్తుకొని, నీ ఇంటికి వెళ్లు” అన్నాడు.'
  to: 'అయితే, మనుష్యకుమారునికి భూమిమీద పాపాలను క్షమించే అధికారం ఉందని మీరు తెలుసుకోవడానికి—అని ఆయన పక్షవాతంతో ఉన్న వ్యక్తితో[a] ఇలా అన్నాడు: “నేను నీకు చెబుతున్నాను, లేచి, నీ పరుపు[b] ఎత్తుకొని, నీ ఇంటికి వెళ్లు.”'
  rationale: ఉద్దేశాన్ని సూచించే ἵναను ‘తెలుసుకోవడానికి’తో పునరుద్ధరించాం; పొరపాటుగా వచ్చిన ఉద్ధరణచిహ్నాన్ని తొలగించాం. ప్రత్యక్ష సంభాషణను సహజ ఆధునిక తెలుగులో ‘నేను నీకు చెబుతున్నాను’గా సవరించాం. పాదటిప్పణి aను నిజమైన ప్రత్యామ్నాయ పదప్రయోగం మరియు కృదంత వివరణగా మార్చాం; bలోని పదార్థ వివరణను నిలిపాం.
