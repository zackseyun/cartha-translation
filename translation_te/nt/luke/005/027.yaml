id: LUK.5.27
reference: Luke 5:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: te
  text: ఆ తరువాత ఆయన బయటికి వెళ్లాడు. పన్ను వసూలు చేసే చోట[b] కూర్చున్న లేవి అనే పన్ను వసూలుదారుణ్ణి ఆయన చూశాడు[a]. అతనితో, “నన్ను అనుసరించు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గమనించాడు’ లేదా ‘తదేకంగా చూశాడు’; గ్రీకు క్రియ కేవలం క్షణికంగా చూడడంకన్నా ఎక్కువ భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సుంకం వసూలు చేసే చోట’ లేదా ‘సరిహద్దు సుంకాల కేంద్రంలో’.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: ఆ తరువాత
  rationale: గ్రీకు బహువచన సూచన గతంలో జరిగిన సంగతులను సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన కథన సంధిగా ‘ఆ తరువాత’ దాని భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξῆλθεν
  choice: బయటికి వెళ్లాడు
  rationale: క్రియలోని స్పష్టమైన బయలుదేరే కదలికను వ్యాఖ్యానం జోడించకుండా నిలుపుతుంది.
- source_word: ἐθεάσατο
  choice: చూశాడు
  rationale: సందర్భంలో సహజమైన తెలుగు రూపం; గ్రీకు క్రియలో ఉండగల శ్రద్ధగా చూడడం లేదా గమనించడం అనే ఛాయను పాదసూచికలో ఉంచాం.
- source_word: τελώνην
  choice: పన్ను వసూలుదారుణ్ణి
  rationale: ఆ కాలంలో పన్నులు లేదా సుంకాలు వసూలు చేసే వ్యక్తి పాత్రను సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὀνόματι Λευὶν
  choice: లేవి అనే
  rationale: గ్రీకు నామసూచక నిర్మాణానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: καθήμενον
  choice: కూర్చున్న
  rationale: లేవి తన వసూలు స్థానంలో ఉన్న దృశ్యాన్ని సహజంగా, ప్రత్యక్షంగా చూపిస్తుంది.
- source_word: ἐπὶ τὸ τελώνιον
  choice: పన్ను వసూలు చేసే చోట
  rationale: τελώνιον అనే వసూలు స్థానాన్ని అనవసరమైన ఆధునిక కార్యాలయ భావం కలిగించకుండా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἀκολούθει μοι
  choice: నన్ను అనుసరించు
  rationale: ఆజ్ఞారూపాన్ని నేరుగా నిలుపుతూ, సందర్భంలో ఉన్న శిష్యత్వపు పిలుపును వివరణాత్మకంగా విస్తరించదు.
theological_decisions:
- issue: యేసు పలికిన ఆజ్ఞలోని శిష్యత్వపు పిలుపు
  choice: నన్ను అనుసరించు
  alternative: నా శిష్యుడివై నన్ను అనుసరించు
  rationale: సందర్భంలో ఇది శిష్యత్వానికి పిలుపే అయినా, గ్రీకు పాఠం ‘శిష్యుడివై’ అని స్పష్టంగా జోడించదు. అందువల్ల ఆజ్ఞను విస్తరించకుండా దాని ప్రత్యక్ష రూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘సుంకరి’ వంటి పాత పదానికి బదులుగా ‘పన్ను వసూలుదారుడు’ వాడాం. అందించిన ఆంగ్ల ముసాయిదాలో పాదసూచిక సూచికలు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, గ్రీకు పదాలకు అనుగుణంగా [a]ను ‘చూశాడు’ వద్ద, [b]ను వసూలు స్థలం వద్ద ఉంచాం.
