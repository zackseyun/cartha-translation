id: LUK.5.17
reference: Luke 5:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: te
  text: ఒక రోజు ఆయన బోధిస్తూ ఉండగా, గలిలయ, యూదయ ప్రాంతాల్లోని ప్రతి గ్రామం నుండీ, యెరూషలేము నుండీ వచ్చిన పరిసయ్యులు, ధర్మశాస్త్ర బోధకులు అక్కడ కూర్చుని ఉన్నారు. ఆయన స్వస్థపరచేందుకు ప్రభువు శక్తి అక్కడ ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “ఆయన స్వస్థపరచేందుకు” బదులుగా “వారిని స్వస్థపరచడానికి” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: ఆ రోజుల్లో ఒక రోజు
  rationale: లూకా వాడే కథనారంభ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘సంభవించింది’ వంటి అనవసరమైన పదానువాదాన్ని నివారిస్తుంది.
- source_word: αὐτὸς ἦν διδάσκων
  choice: ఆయన బోధిస్తూ ఉన్నాడు
  rationale: కొనసాగుతున్న బోధనా చర్యను తెలిపే పరిభాషాత్మక అపూర్ణ భూతకాల నిర్మాణాన్ని నిలుపుతుంది; αὐτόςకు సందర్భంలో అవసరం లేని ప్రత్యేక ఉద్ఘాటనను జోడించదు.
- source_word: Φαρισαῖοι καὶ νομοδιδάσκαλοι
  choice: పరిసయ్యులు, ధర్మశాస్త్ర బోధకులు
  rationale: యూదుల వర్గానికి స్థిరమైన తెలుగు రూపాన్ని, మోషే ధర్మశాస్త్రాన్ని బోధించేవారిని స్పష్టంగా సూచించే సహజమైన పదబంధాన్ని ఉపయోగిస్తుంది.
- source_word: ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: గలిలయ, యూదయ ప్రాంతాల్లోని ప్రతి గ్రామం నుండీ, యెరూషలేము నుండీ
  rationale: κώμηను ‘గ్రామం’గా, πάσης యొక్క విభాజక భావాన్ని ‘ప్రతి’గా నిలుపుతుంది; ప్రాంతాలైన గలిలయ, యూదయలకూ నగరమైన యెరూషలేముకూ మధ్య భౌగోళిక భేదాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: δύναμις κυρίου
  choice: ప్రభువు శక్తి
  rationale: దైవిక శక్తి కార్యసాధకంగా ఉండటాన్ని తెలిపే జనిటివ్ నిర్మాణాన్ని సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది; κύριοςకు సాధారణ తెలుగు రూపమైన ‘ప్రభువు’ను వాడుతుంది.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: స్వస్థపరచడానికి ప్రభువు శక్తి ఆయనకు తోడుగా ఉంది
  rationale: అందించిన పాఠంలోని αὐτόνను యేసుతో సంబంధపరచి, స్వస్థపరచే కార్యానికి ప్రభువు శక్తి ఆయనతో ఉందనే ఉద్దేశ్య/ఫలిత భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ప్రధాన పాఠంలో లేని ‘వారిని’ అనే కర్మను చేర్చదు.
theological_decisions:
- issue: δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν అనే వాక్యభాగంలోని కర్త, కర్మ సంబంధం
  choice: స్వస్థపరచడానికి ప్రభువు శక్తి యేసుకు తోడుగా ఉందని అనువదించడం
  alternative: ప్రభువు శక్తి వారిని స్వస్థపరచడానికి అక్కడ ఉంది
  rationale: SBLGNT అందించిన పాఠంలో ఏకవచన αὐτόν ఉంది; అందువల్ల ప్రధాన పాఠంలో బహువచన ‘వారిని’ని చేర్చకుండా, దైవిక శక్తి యేసు స్వస్థపరిచే పరిచర్యలో పనిచేస్తున్నదనే భావాన్ని నిలుపుతుంది. ఇతర ప్రతుల పాఠాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ప్రాంతాల పేర్లు, యూదుల వర్గపదాలు సాధారణ బైబిలు తెలుగు వినియోగానికి అనుగుణంగా ఉన్నాయి. పాఠాంతర సూచిక [a] వివాదాస్పద చివరి వాక్యభాగానికే అమర్చబడింది.
