revisions:
- from: ఆ రోజుల్లో ఒక రోజు ఆయన బోధిస్తూ ఉన్నాడు. గలిలయ, యూదయ ప్రాంతాల్లోని ప్రతి గ్రామం నుండీ, యెరూషలేము నుండీ వచ్చిన పరిసయ్యులు, ధర్మశాస్త్ర బోధకులు అక్కడ కూర్చుని ఉన్నారు. స్వస్థపరచడానికి ప్రభువు శక్తి ఆయనకు తోడుగా ఉంది.[a]
