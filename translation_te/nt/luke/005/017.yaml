  rationale: The revision removes the added nuance in “తోడుగా,” rendering the final clause as the Lord’s power being present there for Jesus to heal. It preserves the singular reading αὐτόν and gives a direct, accurate footnote for the plural textual variant. The opening is rendered as a natural Telugu temporal narrative construction while retaining the ongoing sense of Jesus’ teaching.
