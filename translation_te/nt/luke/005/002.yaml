  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. పడవలు ‘నిలిచి ఉన్నాయి’ అనే అసహజ పదప్రయోగానికి బదులు, గ్రీకు భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘ఒడ్డున ఉన్న’ అని వాడబడింది.
