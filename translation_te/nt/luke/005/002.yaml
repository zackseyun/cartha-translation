  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: te
  text: ఆయన సరస్సు ఒడ్డున ఉన్న రెండు పడవలను చూశాడు. అయితే జాలరులు వాటిలోనుండి దిగి[a], వలలను కడుగుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిలోనుండి బయటికి వచ్చి.’
    reason: ἀποβάντες అనే పదాన్ని ‘దిగి’ అని లేదా సాధారణంగా ‘బయటికి వచ్చి’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: εἶδεν
  choice: చూశాడు
  rationale: కథన సందర్భంలో ὁράω క్రియ యొక్క భూతకాల రూపాన్ని సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: δύο πλοῖα
  choice: రెండు పడవలను
  rationale: గెన్నెసరెతు సరస్సులో చేపలు పట్టే సందర్భంలో πλοῖον అనే పదానికి ఆధునిక తెలుగులో ‘పడవ’ సహజమైన అర్థం.
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: సరస్సు ఒడ్డున ఉన్న
  rationale: పడవలు సరస్సు పక్కన స్థిరంగా ఉన్నాయని తెలియజేస్తుంది; గ్రీకు వచనంలో లేని ‘కట్టివేసిన’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: οἱ δὲ ἁλιεῖς
  choice: అయితే జాలరులు
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని లేదా దృశ్యమార్పును ‘అయితే’ నిలుపుతుంది; ‘జాలరులు’ సాధారణమైన వృత్తినామం.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: వాటిలోనుండి దిగి
  rationale: జాలరులు పడవల నుంచి దిగిన చర్య ప్రధాన క్రియకు ముందే జరిగిందని సహజమైన తెలుగు క్రమంలో తెలియజేస్తుంది.
- source_word: ἔπλυνον τὰ δίκτυα
  choice: వలలను కడుగుతూ ఉన్నారు
  rationale: ἔπλυνον అనే అపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘కడుగుతూ ఉన్నారు’ స్పష్టంగా వ్యక్తపరుస్తుంది; గ్రీకులో ఉన్న నిర్దిష్ట కర్మను ‘వలలను’గా ఉంచుతుంది.
