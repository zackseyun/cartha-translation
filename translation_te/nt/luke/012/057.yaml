  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: te
  text: “మరి ఏది సరైనదో మీ అంతట మీరే ఎందుకు తీర్పు చెప్పరు?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏది న్యాయమైనదో” లేదా “చేయవలసిన సరైన పని ఏమిటో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: మరి ఎందుకు
  rationale: మునుపటి వాదనను కొనసాగిస్తూ శ్రోతలను మరింతగా నిలదీసే అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ప్రతి అవ్యయాన్ని యాంత్రికంగా అనువదించకుండా వాటి అనుసంధాన, ఉద్ఘాటన బలాన్ని నిలుపుతుంది.
- source_word: ἀφ’ ἑαυτῶν
  choice: మీ అంతట మీరే
  rationale: ఇతరుల ప్రేరణ లేకుండా స్వయంగా, తమ వివేచనతో అనే భావాన్ని సహజంగా తెలియజేస్తుంది. ‘మీ నుండి’ అనే అక్షరార్థ రూపం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: οὐ κρίνετε
  choice: తీర్పు చెప్పరు
  rationale: κρίνωలోని పరిశీలించి నిర్ణయించే న్యాయనిర్ణయ భావాన్ని నిలుపుతుంది. సందర్భంలో ఇది కేవలం గ్రహించడం మాత్రమే కాక, ఏది సరైనదో నిర్ణయించడాన్ని సూచిస్తుంది.
- source_word: τὸ δίκαιον
  choice: ఏది న్యాయమైనదో
  rationale: నపుంసక ఏకవచన విశేషణం నామవాచకంగా వాడబడి ‘న్యాయమైనది/సరైనది’ అనే విస్తృత నైతిక భావాన్ని ఇస్తుంది. ‘న్యాయమైనది’ మూలంలోని న్యాయం, సదాచారం రెండింటి ఛాయను కాపాడుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
theological_decisions:
- issue: τὸ δίκαιον యొక్క భావవ్యాప్తి
  choice: ఏది న్యాయమైనదో
  alternative: ఏది సరైనదో; చేయవలసిన సరైన పని ఏమిటో
  rationale: ఈ పదాన్ని సాంకేతిక న్యాయశాస్త్రానికి లేదా సిద్ధాంతపరమైన ‘నీతిమంతత్వం’కు పరిమితం చేయకుండా, న్యాయమైనది మరియు నైతికంగా సరైనది అనే రెండూ సాధ్యమైన భావాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ప్రశ్నారూపం. ‘మరి’ ముందున్న సందర్భంతో అనుసంధానాన్ని చూపుతుంది; ‘మీ అంతట మీరే’ స్వతంత్ర వివేచనను స్పష్టంగా వ్యక్తం చేస్తుంది.
