  terminology: “మనుష్యకుమారుడు” suitably preserves the established biblical title “Son of Man” and its literary resonance without adding doctrinal interpretation. The footnote’s cautious “ఉండవచ్చు” appropriately preserves the non-certain nature of the Danielic allusion.
