id: LUK.12.40
reference: Luke 12:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: te
  text: మీరు కూడా సిద్ధంగా ఉండండి[a]. ఎందుకంటే మీరు ఊహించని సమయంలో[b] మనుష్యకుమారుడు[c] వస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు కూడా సిద్ధంగా ఉండాలి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మీరు అనుకోని గంటలో”; లేదా, “మీరు ఎదురుచూడని వేళలో.”
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో “మనుష్యకుమారుడు.” ఇది యేసు తన గురించి ఉపయోగించే బిరుదు; ఇందులో దానియేలు 7:13–14 ప్రతిధ్వనులు ఉండవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: ముందటి ఉపమానంలోని సేవకులవలె వినేవారు కూడా సిద్ధంగా ఉండాలనే చేర్పు, ఉద్ఘాటన రెండింటినీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γίνεσθε ἕτοιμοι
  choice: సిద్ధంగా ఉండండి
  rationale: వర్తమాన ఆజ్ఞారూపం సూచించే నిరంతర సిద్ధస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘సిద్ధపడండి’ కంటే సిద్ధంగా కొనసాగాలనే భావాన్ని బాగా నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ᾗ ὥρᾳ οὐ δοκεῖτε
  choice: మీరు ఊహించని సమయంలో
  rationale: అక్షరార్థమైన ‘మీరు అనుకోని గంటలో’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తూ, సమయం తెలియకపోవడం మరియు అనూహ్యతను నిలుపుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు తన గురించి వాడే స్థిరమైన బిరుదును, దాని దానియేలు గ్రంథ సంబంధ ప్రతిధ్వనులను కాపాడుతుంది.
- source_word: ἔρχεται
  choice: వస్తున్నాడు
  rationale: భవిష్యత్ భావంలో వాడిన గ్రీకు వర్తమాన కాలంలోని సజీవతను, హెచ్చరికలోని సమీపత్వాన్ని తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే క్రీస్తుసంబంధ బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: సాంప్రదాయిక అక్షరార్థ బిరుదును ఉంచడం ద్వారా దాని క్రీస్తుసంబంధ, అంత్యకాల మరియు దానియేలు 7:13–14 నేపథ్యాన్ని నిలుపుతుంది; వచనానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
- issue: అంత్యకాల వాక్యంలో ἔρχεται కాలబలం
  choice: వస్తున్నాడు
  alternative: వస్తాడు
  rationale: గ్రీకు వర్తమాన రూపం భవిష్యత్ సంఘటనను సజీవంగా చూపుతుంది. ‘వస్తున్నాడు’ హెచ్చరికలోని తక్షణతను నిలుపుతుంది; అయినా అది సంఘటన యొక్క ఖచ్చిత కాలాన్ని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘సిద్ధంగా ఉండండి’ నిరంతర అప్రమత్తతను సూచిస్తుంది; ‘మనుష్యకుమారుడు’ స్థిరమైన బైబిలు బిరుదుగా ఉంచబడింది.
