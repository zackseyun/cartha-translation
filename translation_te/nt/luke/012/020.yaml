id: LUK.12.20
reference: Luke 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: te
  text: అయితే దేవుడు అతనితో, “మూర్ఖుడా! ఈ రాత్రే నీ ప్రాణాన్ని[a] నీ నుండి తిరిగి కోరుతున్నారు. మరి నువ్వు సిద్ధం చేసినవి ఎవరికి చెందుతాయి?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ జీవితాన్ని” లేదా “నీ ఆత్మను.” ఇక్కడి గ్రీకు పదానికి సందర్భానుసారం “ప్రాణం,” “జీవితం,” లేదా “ఆత్మ” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: మూర్ఖుడా
  rationale: ప్రత్యక్ష సంబోధనలోని తీవ్రమైన గద్దింపును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ταύτῃ τῇ νυκτί
  choice: ఈ రాత్రే
  rationale: కాలసూచక దత్తివుతో కూడిన నిర్దేశక పదం తెలిపే తక్షణత్వాన్నీ నొక్కిచెప్పడాన్నీ ‘-ఏ’ నిపాతం సహజంగా అందిస్తుంది.
- source_word: ψυχήν
  choice: ప్రాణాన్ని
  rationale: ఈ సందర్భంలో త్వరలో తీసుకోబడబోయే జీవాన్ని సూచిస్తుంది. ‘ప్రాణం’ తెలుగు వాడుకలో జీవితం అనే భావాన్ని సహజంగా మోస్తూనే, గ్రీకు పదంలోని విస్తృత అర్థపరిధిని పూర్తిగా మూసివేయదు.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: నీ దగ్గర నుంచి తిరిగి కోరుతున్నారు
  rationale: ἀπαιτέω లోని తిరిగి కోరడం లేదా బలంగా కోరడం అనే భావాన్ని నిలుపుతుంది. కర్తను గ్రీకు వాక్యం పేర్కొననందున, తెలుగులోనూ అనిర్దిష్ట బహువచన ప్రయోగాన్ని ఉంచి ఏ కర్తనూ చేర్చలేదు.
- source_word: ἃ δὲ ἡτοίμασας
  choice: మరి నువ్వు సిద్ధం చేసినవి
  rationale: నపుంసక బహువచన సంబంధసర్వనామాన్ని సూటిగా ప్రతిబింబిస్తూ, కూడబెట్టిన వస్తువులను సందర్భంలో సహజంగా సూచిస్తుంది.
- source_word: τίνι ἔσται
  choice: ఎవరికి చెందుతాయి?
  rationale: దత్తివ ప్రశ్నార్థక పదంలోని స్వాధీనత లేదా చెందుట అనే భావాన్ని సహజమైన తెలుగు ప్రశ్నగా అందిస్తుంది.
theological_decisions:
- issue: మరణ సందర్భంలో ψυχή పదం అనువాదం
  choice: ప్రాణం
  alternative: జీవితం; ఆత్మ
  rationale: వాక్యం ఆ మనిషి సమీప మరణాన్ని సూచిస్తుంది; అందువల్ల ‘ప్రాణం’ సందర్భానికి సహజం. అదే సమయంలో గ్రీకు పదాన్ని కేవలం దేహరహిత ‘ఆత్మ’ అనే సిద్ధాంతార్థానికి పరిమితం చేయదు. దాని అర్థపరిధిని పాదసూచికలో వెల్లడించాం.
- issue: ἀπαιτοῦσιν అనే అనిర్దిష్ట బహువచన కర్త
  choice: కర్తను పేర్కొనకుండా ‘కోరుతున్నారు’ అని ఉంచడం
  alternative: దేవుడు నీ ప్రాణాన్ని కోరుతున్నాడు; నీ ప్రాణం కోరబడుతోంది
  rationale: మూలంలో బహువచన క్రియకు స్పష్టమైన కర్త లేదు. దేవుడు, దూతలు లేదా మరే కర్తను చేర్చడం వచనంలోని ఉద్దేశపూర్వక అనిశ్చితిని తొలగిస్తుంది; అందువల్ల అనిర్దిష్ట నిర్మాణాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలిని వాడాం. ‘ఈ రాత్రే’ తక్షణత్వాన్ని, ‘మూర్ఖుడా’ గద్దింపు తీవ్రతను నిలుపుతాయి. మూలంలోని అనిర్దిష్ట బహువచన కర్తను సిద్ధాంతపరంగా పూరించలేదు.
