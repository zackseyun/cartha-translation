id: LUK.12.42
reference: Luke 12:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: te
  text: 'ప్రభువు ఇలా అన్నాడు: “అయితే, తగిన సమయంలో తన ఇంటి సేవకులకు వారి ఆహార భాగాన్ని[b] ఇవ్వడానికి యజమాని వారికి బాధ్యునిగా నియమించే నమ్మకమైన, వివేకవంతుడైన[a] గృహనిర్వాహకుడు ఎవరు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జ్ఞానంగల.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ధాన్యపు కొలత భాగం”; అంటే ప్రతి సేవకునికి కొలిచి కేటాయించిన ఆహారపు వాటా.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు / యజమాని
  rationale: వాక్యారంభంలో యేసును సూచించే బిరుదుగా ‘ప్రభువు’ వాడబడింది; ఉపమానంలోని ఇంటి అధికారిని సూచించే రెండో సందర్భంలో సహజమైన తెలుగులో ‘యజమాని’ వాడబడింది. రెండూ κύριος పదం యొక్క సందర్భానుసార అర్థాలను నిలుపుతాయి.
- source_word: πιστός
  choice: నమ్మకమైన
  rationale: అప్పగించిన బాధ్యతలో విశ్వసనీయతను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: οἰκονόμος
  choice: గృహనిర్వాహకుడు
  rationale: ఇల్లు లేదా ఆస్తి నిర్వహణ బాధ్యత అప్పగించబడిన వ్యక్తి అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: φρόνιμος
  choice: వివేకంగల
  rationale: ఆచరణాత్మక జ్ఞానం, పరిస్థితిని సరిగా అంచనా వేసే నేర్పు అనే భావాన్ని వ్యక్తం చేస్తుంది; ‘జ్ఞానంగల’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: καταστήσει
  choice: నియమించే
  rationale: బాధ్యతగల స్థానంలో ఉంచడం లేదా నియమించడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: θεραπεία
  choice: తన ఇంటి సేవకులు
  rationale: ఇక్కడ θεραπεία సేవ అనే భావం కాకుండా, యజమాని ఆధీనంలోని సేవకుల సమూహాన్ని సూచిస్తుంది.
- source_word: ἐν καιρῷ
  choice: తగిన సమయంలో
  rationale: సరైన లేదా నియమిత సమయంలో అనే καιρός భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: σιτομέτριον
  choice: ఆహార భాగం
  rationale: ప్రతి సేవకునికి కొలిచి కేటాయించే ఆహారపు వాటా అనే కార్యాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది; ధాన్యపు కొలత అనే అక్షరార్థం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: రెండుసార్లు వచ్చిన κύριος పదానికి సందర్భానుసార అనువాదం
  choice: యేసుకు ‘ప్రభువు’; ఉపమానంలోని ఇంటి అధికారికి ‘యజమాని’
  alternative: రెండు చోట్లా ‘ప్రభువు’
  rationale: గ్రీకులో ఒకే పదం ఉన్నప్పటికీ, మొదటిది కథనంలో యేసుకు బిరుదు; రెండోది ఉపమానంలోని ఇంటి అధికారిని సూచిస్తుంది. సందర్భానుసార భేదం తెలుగు పాఠకుడికి సూచనస్థాయులను స్పష్టం చేస్తూ మూలపద అర్థపరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ఏకైక ప్రశ్న నిర్మాణాన్ని నిలుపుతూ, సంబంధవాచక భాగాన్ని తెలుగులో సహజమైన క్రమంలో అమర్చాం.
