    rationale: “మిమ్మల్ని మీరు సమర్థించుకోవడానికి ఎలా మాట్లాడాలి, ఏమి మాట్లాడాలి”లో ‘సమర్థించుకోవడం’కు అవసరమైన జవాబు/ప్రత్యుత్తర భావం స్పష్టంగా లేదు; “ఎలా లేదా ఏమి జవాబు చెప్పాలో” మూలంలోని విధానం మరియు విషయాన్ని సహజంగా ప్రతిబింబిస్తుంది.
