id: LUK.12.11
reference: Luke 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: te
  text: అయితే వారు మిమ్మల్ని సమాజమందిరాల ఎదుటకు, పరిపాలకుల ఎదుటకు, అధికారుల ఎదుటకు తీసుకొచ్చినప్పుడు,[a] మీ పక్షాన ఎలా లేదా ఏమి జవాబు చెప్పాలో, లేదా ఏమి చెప్పాలో అని ఆందోళనపడకండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “సమాజమందిరాలు, పరిపాలకులు, అధికారులు” అనేవి శిష్యులను విచారించే మతపరమైన, పౌర అధికార సంస్థలను సూచిస్తాయి.
    reason: cultural_note
  - marker: b
    text: లేదా, మరింత అధికారికంగా, “మీ సమర్థనను ఎలా లేదా ఏమి వినిపించాలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: అయితే ... తీసుకొచ్చినప్పుడు
  rationale: ὅταν భవిష్యత్తులో ఎప్పుడైనా సంభవించగల సందర్భాన్ని సూచిస్తుంది; δέ సందర్భప్రవాహంలోని స్వల్ప మలుపును ‘అయితే’ ద్వారా తెలియజేస్తుంది.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: వారు మిమ్మల్ని ... తీసుకొచ్చినప్పుడు
  rationale: న్యాయవిచారణ సందర్భంలో అధికార సంస్థల ఎదుటికి తీసుకురావడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: సమాజమందిరాల ఎదుటికి, పాలకుల ఎదుటికి, అధికారుల ఎదుటికి
  rationale: ἐπί + accusative ఇక్కడ విచారణకోసం ఆయా సంస్థలు, అధికారుల ఎదుట హాజరుపరచడాన్ని సూచిస్తుంది. మూడు వర్గాల భేదాన్ని నిలుపుతుంది.
- source_word: συναγωγάς
  choice: సమాజమందిరాలు
  rationale: పదం యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, సందర్భంలో అక్కడి మతపరమైన విచారణ సంస్థలను సూచించే లక్షణార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: ἀρχάς
  choice: పాలకులు
  rationale: ఈ పరిపాలనా-న్యాయ సందర్భంలో పరిపాలించే వ్యక్తులు లేదా అధికారులు అనే విస్తృత అర్థాన్ని ఇస్తుంది.
- source_word: ἐξουσίας
  choice: అధికారులు
  rationale: అధికారం అప్పగించబడిన అధికార వర్గాలను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: μὴ μεριμνήσητε
  choice: ఆందోళనపడకండి
  rationale: ముందుగానే కలతతో చింతించవద్దనే నిషేధాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πῶς ἢ τί
  choice: ఎలా ... ఏమి
  rationale: మాట్లాడే విధానం, విషయం రెండింటినీ గ్రీకు పాఠం పేర్కొంటున్నందున రెండింటినీ నిలుపుతుంది.
- source_word: ἀπολογήσησθε
  choice: మిమ్మల్ని మీరు సమర్థించుకోవడానికి ... మాట్లాడాలి
  rationale: మధ్యమ వాచ్యాన్ని, న్యాయపరమైన స్వీయ సమర్థన భావాన్ని రెండింటినీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἢ τί εἴπητε
  choice: లేదా ఏమి చెప్పాలి
  rationale: ముందటి స్వీయ సమర్థనకు సంబంధించిన విధానం, విషయంతో పాటు సాధారణంగా చెప్పవలసిన మాటలను ప్రత్యేకంగా ఉంచుతుంది.
theological_decisions:
- issue: ἀπολογήσησθε లోని న్యాయపరమైన స్వీయ సమర్థన
  choice: మిమ్మల్ని మీరు సమర్థించుకోవడానికి
  alternative: జవాబు చెప్పడానికి
  rationale: సాధారణ జవాబు కంటే న్యాయవిచారణలో తన పక్షాన్ని సమర్థించుకోవడం అనే మూలపద భావాన్ని స్పష్టంగా నిలుపుతుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. ‘సమాజమందిరం’ అనే పరిచిత బైబిలు పదాన్ని నిలిపి, దాని విచారణాత్మక సందర్భాన్ని పాదసూచికలో వివరించాం. మూలంలోని πῶς ἢ τί ... ἢ τί నిర్మాణం తెలుగులో కొంత పునరుక్తిగా వినిపించినా, విధానం, సమర్థనలోని విషయం, చెప్పే మాట అనే మూలభేదాన్ని చెరపకుండా ఉద్దేశపూర్వకంగా నిలుపబడింది.
