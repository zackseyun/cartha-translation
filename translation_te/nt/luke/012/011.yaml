revisions:
- from: అయితే వారు మిమ్మల్ని సమాజమందిరాల ఎదుటికి, పాలకుల ఎదుటికి, అధికారుల ఎదుటికి తీసుకొచ్చినప్పుడు,[a] మిమ్మల్ని మీరు సమర్థించుకోవడానికి ఎలా మాట్లాడాలి, ఏమి మాట్లాడాలి, లేదా ఏమి చెప్పాలి అని ఆందోళనపడకండి.[b]
  to: అయితే వారు మిమ్మల్ని సమాజమందిరాల ఎదుటకు, పరిపాలకుల ఎదుటకు, అధికారుల ఎదుటకు తీసుకొచ్చినప్పుడు,[a] మీ పక్షాన ఎలా లేదా ఏమి జవాబు చెప్పాలో, లేదా ఏమి చెప్పాలో అని ఆందోళనపడకండి.[b]
  rationale: సవరణ ἀπολογήσησθεను న్యాయపరమైన స్వీయ-సమర్థన/ప్రత్యుత్తర సందర్భంలో “మీ పక్షాన ... జవాబు చెప్పడం”గా స్పష్టం చేస్తుంది. πῶς (‘ఎలా’), τί (‘ఏమి’), మరియు తరువాతి ἢ τί εἴπητε (‘లేదా ఏమి చెప్పాలో’) అనే త్రిభాగ నిర్మాణం నిలుపబడింది. పాదసూచిక b కూడా మూలంలోని ‘ఎలా లేదా ఏమి’ రెండింటినీ ఇప్పుడు ప్రతిబింబిస్తుంది.
