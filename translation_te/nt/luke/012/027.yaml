id: LUK.12.27
reference: Luke 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: te
  text: 'లిల్లీ పువ్వులు[a] ఎలా పెరుగుతున్నాయో జాగ్రత్తగా గమనించండి. అవి శ్రమపడవు, నూలు వడకవు. అయినా నేను మీతో చెబుతున్నాను: సొలొమోను తన సమస్త మహిమలో కూడా వీటిలో ఒకదానిలా వస్త్రాలు ధరించలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అడవి పువ్వులు’ లేదా ‘పువ్వులు’; గ్రీకులో నిర్దిష్టంగా ‘లిల్లీలు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: జాగ్రత్తగా గమనించండి
  rationale: ఇది కేవలం చూడమనే ఆజ్ఞ కాదు; శ్రద్ధగా పరిశీలించి ఆలోచించమనే భావం గల భూతకాల ఆజ్ఞార్థకం. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὰ κρίνα
  choice: లిల్లీ పువ్వులు
  rationale: గ్రీకు పదంలోని నిర్దిష్ట పుష్పనామాన్ని సాధారణ ‘పువ్వులు’గా విస్తరించకుండా నిలుపుతుంది. ‘కలువలు’ అంటే సాధారణంగా నీటిలో పెరిగే lotus/water lily అనే అపార్థం కలగవచ్చు కాబట్టి లిప్యంతరీకరణ వాడబడింది.
- source_word: πῶς αὐξάνει
  choice: ఎలా పెరుగుతున్నాయో
  rationale: గ్రీకులో నపుంసక బహువచన కర్తతో ఏకవచన క్రియ ఉన్నా, తెలుగులో సహజమైన బహువచన అన్వయాన్ని వాడి, πῶς లోని విధానార్థాన్ని నిలిపింది.
- source_word: οὐ κοπιᾷ
  choice: అవి శ్రమపడవు
  rationale: κοπιάω లోని కష్టపడి పనిచేయడం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐδὲ νήθει
  choice: నూలు వడకవు
  rationale: νήθω అంటే దారం లేదా నూలు తయారుచేయడానికి పీచును వడకడం. తెలుగులో ‘వడకడం’ మాత్రమే అస్పష్టంగా ఉండవచ్చు కాబట్టి ‘నూలు’ చేర్చబడింది.
- source_word: λέγω δὲ ὑμῖν
  choice: అయినా నేను మీతో చెబుతున్నాను
  rationale: δὲ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయినా’ తెలియజేస్తుంది; యేసు శ్రోతలను నేరుగా ఉద్దేశిస్తున్న రూపాన్ని నిలుపుతుంది.
- source_word: οὐδὲ Σολομὼν
  choice: సొలొమోను ... కూడా
  rationale: οὐδέ లోని ‘అంతటి సొలొమోను సైతం కాదు’ అనే ఉద్ఘాటనను తెలుగులో సహజమైన ‘కూడా ... లేదు’ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: తన మహిమ అంతటితో
  rationale: రాజసమైన వైభవాన్ని సూచించే సందర్భార్థంతో పాటు δόξα పదంలోని విస్తృత బైబిలు ప్రతిధ్వనిని ‘మహిమ’ నిలుపుతుంది.
- source_word: περιεβάλετο
  choice: వస్త్రాలు ధరించలేదు
  rationale: మధ్యమ/కర్మణి రూపాన్ని తెలుగులో సహజమైన వస్త్రధారణ వ్యక్తీకరణతో అనువదించి, ఎవరు వస్త్రాలు ధరింపజేశారనే విషయాన్ని నిర్దిష్టం చేయదు.
- source_word: ὡς ἓν τούτων
  choice: వీటిలో ఒకదానిలా
  rationale: పోలికను సూటిగా నిలుపుతుంది; ‘వీటి’ అనేది ముందున్న లిల్లీ పువ్వులను సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: పుష్పాల సూచన
  choice: నిర్దిష్టంగా ‘లిల్లీ పువ్వులు’ అని ఉంచడం
  alternative: పువ్వులు; అడవి పువ్వులు
  rationale: మూల గ్రీకు κρίνα అనే నిర్దిష్ట పదాన్ని వాడుతుంది. సృష్టిపట్ల దేవుని సంరక్షణ అనే విస్తృత బోధ ఉన్నప్పటికీ, దాని కారణంగా మూలపదాన్ని సాధారణీకరించలేదు.
- issue: సొలొమోను వర్ణనలో δόξα
  choice: మహిమ
  alternative: వైభవం
  rationale: ఈ సందర్భంలో రాజసమైన వైభవం భావం ప్రధానమైనా, ‘మహిమ’ సహజంగా అర్థమవుతూ పదంలోని విస్తృత అర్థసామర్థ్యాన్ని, బైబిలు ప్రతిధ్వనిని నిలుపుతుంది.
- issue: περιεβάλετο లోని కర్తృత్వం
  choice: వస్త్రాలు ధరించలేదు
  alternative: వస్త్రాలు ధరింపబడలేదు; తనను తాను వస్త్రాలతో కప్పుకోలేదు
  rationale: గ్రీకు మధ్యమ/కర్మణి రూపం కర్తృత్వాన్ని బలంగా నిర్దిష్టం చేయదు. తెలుగు అనువాదం ఆ అస్పష్టతను అనవసరంగా సిద్ధాంతీకరించకుండా సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. వాక్యం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచుతూ, వస్త్రనిర్మాణానికి సంబంధించిన ‘నూలు వడకడం’ అనే సాంస్కృతిక చిత్రాన్ని నిలిపింది. ‘లిల్లీ’ లిప్యంతరీకరణ ‘కలువ’ వల్ల కలిగే వృక్షశాస్త్రీయ అపార్థాన్ని నివారిస్తుంది.
