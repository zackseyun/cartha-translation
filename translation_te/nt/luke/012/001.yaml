id: LUK.12.1
reference: Luke 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: te
  text: 'ఈలోగా, జనసమూహంలోని వేలాదిమంది[a] కూడివచ్చి, ఒకరినొకరు తొక్కుకుంటుండగా, ఆయన మొదట తన శిష్యులతో ఇలా చెప్పడం మొదలుపెట్టాడు: “పరిసయ్యుల పులిసే పదార్థం[b] నుండి జాగ్రత్తగా ఉండండి; అదే కపటత్వం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు ‘మ్యురియాదెస్’ అనే పదం ఖచ్చితంగా ‘పదివేలలు’ అని లేదా సాధారణంగా చాలా పెద్ద జనసమూహం అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘పులిపించే పదార్థం’ అని కూడా అనువదించవచ్చు. గ్రీకులో ఇది పులియబెట్టే పదార్థాన్ని సూచిస్తుంది; వాక్యమే దానిని ‘కపటత్వం’గా వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: ఈలోగా ... ఉన్నప్పుడు
  rationale: ఈ ప్రయోగం ఇక్కడ స్థలాన్ని కాకుండా కాలసంబంధమైన, సందర్భసంబంధమైన మార్పును సూచిస్తుంది; ముందటి సందర్భంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: ἐπισυναχθεισῶν
  choice: కూడివచ్చి
  rationale: జనం సమకూడినదాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు కర్తరి కాని రూపాన్ని తెలుగులో కృత్రిమంగా ప్రతిబింబించదు.
- source_word: τῶν μυριάδων τοῦ ὄχλου
  choice: జనసమూహం వేలాదిగా
  rationale: μυριάδες ఖచ్చితంగా పదివేలలను గానీ, సాధారణంగా అత్యంత పెద్ద సంఖ్యను గానీ సూచించగలదు. ‘వేలాదిగా’ సందర్భంలోని అపార జనసంఖ్యను సహజంగా తెలియజేస్తుంది.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: ఒకరినొకరు తొక్కుకునేంతగా
  rationale: ὥστε తో వచ్చిన ఫలిత భావాన్ని, జనసందోహంలోని కొనసాగుతున్న అస్తవ్యస్తతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἤρξατο λέγειν
  choice: చెప్పడం మొదలుపెట్టాడు
  rationale: ప్రారంభ భావాన్ని దగ్గరగా, సహజంగా నిలుపుతుంది.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: మొదట తన శిష్యులతో
  rationale: యేసు మొదట శిష్యులను ఉద్దేశించాడనే శ్రోతల ప్రాధాన్య భావాన్ని నిలుపుతుంది; తరువాతి ప్రసంగ క్రమాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: Προσέχετε ἑαυτοῖς
  choice: మిమ్మల్ని మీరు జాగ్రత్తగా కాపాడుకోండి
  rationale: హెచ్చరికతో పాటు స్వీయ అప్రమత్తతను సూచించే ἑαυτοῖς భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῆς ζύμης
  choice: పులిసిన పిండి విషయంలో
  rationale: ζύμη యొక్క బైబిలీయ రూపకాన్ని నిలుపుతూ, దాని ప్రభావం పట్ల జాగ్రత్త అనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: అది వేషధారణ
  rationale: రూపకాన్ని లూకానే వివరించే గుర్తింపు వాక్యంగా నేరుగా నిలుపుతుంది.
- source_word: τῶν Φαρισαίων
  choice: పరిసయ్యుల
  rationale: స్వామ్య/లక్షణ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ζύμη రూపక స్వభావం
  choice: ‘పులిసిన పిండి’ అనే రూపకాన్ని నిలిపి, వాక్యమే దానిని ‘వేషధారణ’గా గుర్తించేలా అనువదించడం.
  alternative: ‘బోధ’ లేదా ‘ప్రభావం’ అని వివరణాత్మకంగా మార్చడం.
  rationale: మూలపాఠమే రూపకానికి వివరణ ఇస్తున్నందున, దాన్ని వ్యాఖ్యానాత్మక పదంతో భర్తీ చేయకుండా సాహిత్య, ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: πρῶτον యొక్క పరిధి
  choice: ‘మొదట తన శిష్యులతో’ అని, శ్రోతల ప్రాధాన్యాన్ని సూచించడం.
  alternative: ‘మొట్టమొదటగా ఆయన తన శిష్యులతో చెప్పాడు’ అనే ప్రసంగ సూచికగా తీసుకోవడం.
  rationale: గ్రీకు రెండు భావాలకు అవకాశం ఇచ్చినా, ఈ అనువాదం నిర్ధారించని తరువాతి ప్రసంగ క్రమాన్ని చేర్చకుండా సాధ్యమైన కథన భావాన్ని నిలుపుతుంది.
- issue: ὑπόκρισις యొక్క భావం
  choice: ‘వేషధారణ’
  alternative: ‘కపటత్వం’
  rationale: ప్రదర్శించే రూపానికి వాస్తవ స్వభావం భిన్నంగా ఉండే భావాన్ని ‘వేషధారణ’ స్పష్టంగా ప్రతిబింబిస్తుంది; కేవలం సాధారణ మోసం అనే అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరిసయ్యులు’, ‘పులిసిన పిండి’ వంటి బైబిలీయ పదజాలాన్ని నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
