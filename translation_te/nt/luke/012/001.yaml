revisions:
- from: 'ఈలోగా, జనసమూహం వేలాదిగా[a] కూడివచ్చి, ఒకరినొకరు తొక్కుకునేంతగా ఉన్నప్పుడు, ఆయన మొదట తన శిష్యులతో ఇలా చెప్పడం మొదలుపెట్టాడు: “పరిసయ్యుల పులిసిన పిండి[b] విషయంలో మిమ్మల్ని మీరు జాగ్రత్తగా కాపాడుకోండి; అది వేషధారణ.”'
  to: 'ఈలోగా, జనసమూహంలోని వేలాదిమంది[a] కూడివచ్చి, ఒకరినొకరు తొక్కుకుంటుండగా, ఆయన మొదట తన శిష్యులతో ఇలా చెప్పడం మొదలుపెట్టాడు: “పరిసయ్యుల పులిసే పదార్థం[b] నుండి జాగ్రత్తగా ఉండండి; అదే కపటత్వం.”'
  rationale: The revision corrects the lexical referent of ζύμη, uses the standard modern Telugu ethical term for ὑπόκρισις, and improves the expression of the crowd’s great number. It preserves the metaphor, the warning, and the Greek wording’s explanatory identification without adding doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the Greek narrative and preserves the priority of the disciples as the first audience. However, ‘పులిసిన పిండి’ normally denotes dough that has already been leavened, rather than ζύμη, the leavening agent/metaphor itself. ‘వేషధారణ’ captures an aspect of ὑπόκρισις but is narrower and less idiomatic here than ‘కపటత్వం.’
  naturalness: 'The proposed revision uses smoother modern Telugu: ‘జనసమూహంలోని వేలాదిమంది’ clearly represents the myriads belonging to the crowd, and ‘ఒకరినొకరు తొక్కుకుంటుండగా’ naturally conveys the resulting crowd pressure. ‘జాగ్రత్తగా ఉండండి’ is an idiomatic warning in Telugu.'
  terminology: ‘పరిసయ్యులు’ is appropriate. ‘పులిసే పదార్థం’ retains the biblical leaven image without turning it into already-leavened dough. ‘కపటత్వం’ is the standard, sufficiently broad equivalent for ὑπόκρισις in this ethical context.
  issues:
  - severity: medium
    issue: ‘పులిసిన పిండి’ for ζύμη
    rationale: This means ‘leavened dough’ in ordinary Telugu, whereas ζύμη denotes leaven/a leavening agent. The metaphor should retain that distinction.
  - severity: medium
    issue: ‘వేషధారణ’ for ὑπόκρισις
    rationale: Although hypocrisy can involve pretense, ‘వేషధారణ’ primarily means disguise or role-playing and can understate the broader moral sense. ‘కపటత్వం’ is clearer and more conventional.
  - severity: low
    issue: ‘జనసమూహం వేలాదిగా’ is imprecise phrasing
    rationale: It can sound as though the crowd itself is categorized ‘by thousands.’ ‘జనసమూహంలోని వేలాదిమంది’ naturally expresses the Greek genitive construction.
  revised_text: 'ఈలోగా, జనసమూహంలోని వేలాదిమంది[a] కూడివచ్చి, ఒకరినొకరు తొక్కుకుంటుండగా, ఆయన మొదట తన శిష్యులతో ఇలా చెప్పడం మొదలుపెట్టాడు: “పరిసయ్యుల పులిసే పదార్థం[b] నుండి జాగ్రత్తగా ఉండండి; అదే కపటత్వం.”'
  revised_footnotes:
