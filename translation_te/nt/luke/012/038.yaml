  terminology: ‘జాము’ రాత్రి కాపలా విభాగానికి తగిన, సహజమైన పదం; పాదటిప్పణిలో ‘కాపలా సమయం’ అని స్పష్టీకరించడం ఉపయుక్తం. μακάριοιకి ‘ధన్యులు’ సరైన బైబిలు-సంబంధిత పదం. ἐκεῖνοιని ప్రధాన పాఠ్యంలో ‘వారు’గా ఉంచి, సేవకులనే సూచిస్తుందని పాదటిప్పణిలో తెలియజేయడం మూలపాఠానికి నమ్మకంగా ఉంది.
