  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: te
  text: అతడు రాత్రి రెండవ జాములోనైనా, మూడవ జాములోనైనా వచ్చి వారిని అలాగే ఉన్నట్టు కనుగొంటే, వారు ధన్యులు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత స్పష్టంగా, ‘రాత్రి రెండవ కాపలా సమయంలోనైనా, మూడవ కాపలా సమయంలోనైనా.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ధన్యులు వారు.’ ఇక్కడ ‘వారు’ అనేది ముందటి సందర్భంలో ప్రస్తావించిన సేవకులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: వచ్చినా ... వచ్చినా
  rationale: పునరుక్తమైన κἄν తెలిపే అనిశ్చితమైన concessive భావాన్ని సహజమైన తెలుగు సమాంతర నిర్మాణంతో నిలుపుతుంది.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: రాత్రి రెండవ జాములో ... మూడవ జాములో
  rationale: φυλακή ఇక్కడ రాత్రిని కాపలా సమయాలుగా విభజించిన ‘జాము’ను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకుడికి ‘రాత్రి’ని స్పష్టంగా చేర్చడం అర్థగ్రాహ్యతను పెంచుతుంది.
- source_word: ἔλθῃ
  choice: వచ్చినా
  rationale: షరతుతో కూడిన aorist subjunctive యొక్క అనిశ్చిత భవిష్యత్ భావాన్ని తెలుగు concessive రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εὕρῃ οὕτως
  choice: వారు అలాగే ఉండడం చూస్తే
  rationale: οὕτως ముందటి వచనంలో చెప్పిన సిద్ధంగా ఉన్న స్థితిని సూచిస్తుంది. తెలుగులో సందర్భం నుంచి ‘వారు’ అనే కర్మను స్పష్టపరచడం సహజం.
- source_word: μακάριοί
  choice: ధన్యులు
  rationale: దేవుని దృష్టిలో అనుగ్రహించబడిన, ప్రశంసనీయమైన స్థితిని తెలిపే బైబిలు సంబంధిత గంభీరతను ‘ధన్యులు’ నిలుపుతుంది.
- source_word: ἐκεῖνοι
  choice: వారు
  rationale: మూలంలో ఉన్న సూచన సర్వనామాన్ని సర్వనామంగానే ఉంచి, దాని సూచ్యులు ముందటి సందర్భంలోని సేవకులని పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: ἐκεῖνοι యొక్క సూచ్యాన్ని స్పష్టీకరించడం
  choice: ప్రధాన పాఠ్యంలో ‘వారు’; పాదటిప్పణిలో సేవకులని వివరణ
  alternative: ఆ సేవకులు
  rationale: గ్రీకులో ఈ వచనంలో δοῦλοι అనే నామవాచకం లేదు; ἐκεῖνοι అంటే అక్షరార్థంగా ‘వారు/ఆ వారు’. వెంటనే ముందున్న సందర్భం సేవకులను సూచ్యంగా నిర్ధారిస్తుంది. ప్రధాన పాఠ్యం మూలరూపాన్ని కాపాడగా, పాదటిప్పణి సందిగ్ధతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘జాము’ రాత్రి కాపలా విభాగాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ‘ధన్యులు’ μακάριοι యొక్క బైబిలు మరియు ధార్మిక బరువును నిలుపుతుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
