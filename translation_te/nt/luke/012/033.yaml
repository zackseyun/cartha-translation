id: LUK.12.33
reference: Luke 12:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: te
  text: మీ ఆస్తులను అమ్మి, పేదలకు దానం చేయండి[a]. మీకోసం పాతబడని డబ్బు సంచులను, అంటే పరలోకాలలో ఎన్నటికీ తరగని ధనాన్ని, సమకూర్చుకోండి; అక్కడ ఏ దొంగ దగ్గరికి రాడు, ఏ చిమ్మటా నాశనం చేయదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు పదానికి ‘దానధర్మం చేయండి’ అని కూడా అనువదించవచ్చు. అది అవసరంలో ఉన్నవారికి ఇవ్వడం ద్వారా చూపే దయాకార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: అమ్మి
  rationale: నిర్ణయాత్మక ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో లేని ‘అన్నిటినీ అమ్మివేయండి’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: మీ ఆస్తులను
  rationale: ఒకరికి చెందిన వస్తువులు లేదా సంపద అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δότε ἐλεημοσύνην
  choice: పేదలకు దానం చేయండి
  rationale: ἐλεημοσύνη సూచించే అవసరంలో ఉన్నవారికి దయతో ఇచ్చే కార్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ποιήσατε ἑαυτοῖς
  choice: మీ కోసం ... చేసుకోండి
  rationale: ఆజ్ఞారూపాన్నీ, తమ ప్రయోజనం కోసం చేసుకోవడం అనే reflexive భావాన్నీ నిలుపుతుంది.
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: పాతబడని డబ్బు సంచులను
  rationale: డబ్బు పెట్టుకునే సంచులనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, παλαιόω యొక్క పాతబడడం లేదా అరిగిపోవడం అనే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: ఎన్నటికీ తరగని ధనాన్ని
  rationale: ἀνέκλειπτος లోని విఫలం కాకపోవడం, అయిపోకపోవడం అనే భావాన్ని ‘తరగని’ సహజంగా తెలియజేస్తుంది; ‘ఎన్నటికీ’ దాని నిరంతరత్వాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: పరలోకాలలో
  rationale: గ్రీకు బహువచన రూపాన్ని తెలుగులోనూ నిలుపుతుంది; ‘పరలోకంలో’ అనే సహజ ఏకవచన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: అక్కడ ఏ దొంగా దగ్గరికి రాడు
  rationale: ἐγγίζω యొక్క సమీపించడం అనే స్థలరూపకాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: ఏ చిమ్మటా నాశనం చేయదు
  rationale: వస్త్రాలను తినే చిమ్మట వల్ల కలిగే నాశనాన్ని, ముందటి నిరాకరణతో సమాంతరంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐλεημοσύνην అనే పదాన్ని ఆస్తుల గురించిన ఉపదేశంలో ఎలా అనువదించాలి
  choice: పేదలకు దానం చేయండి
  alternative: దానధర్మం చేయండి
  rationale: ఇది సాధారణ దయాగుణాన్ని మాత్రమే కాక, అవసరంలో ఉన్నవారికి ఇవ్వడం అనే కార్యాన్ని సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆ లక్ష్యాన్ని స్పష్టం చేస్తుంది; అయితే పాఠ్యంలో లేని విస్తృత ఆర్థిక సిద్ధాంతాన్ని చేర్చదు.
- issue: ἐν τοῖς οὐρανοῖς లోని బహువచనం
  choice: పరలోకాలలో
  alternative: పరలోకంలో
  rationale: మూలంలోని బహువచనాన్నీ యూదు–నూతన నిబంధన వాడుకనూ నిలుపుతుంది; సిద్ధాంతపరంగా ఏకవచనాన్ని తిరస్కరించకుండా దానిని పాదసూచికలో సూచిస్తుంది.
- issue: డబ్బు సంచులు మరియు ధనం మధ్య సంబంధం
  choice: డాష్‌తో ‘అంటే’ అని వివరణాత్మక సమానార్థ సంబంధం
  alternative: ‘ధనాన్ని కూడబెట్టుకోండి’ అనే కొత్త క్రియను చేర్చడం
  rationale: θησαυρόν అనేది ముందున్న ‘డబ్బు సంచులను’ వివరిస్తున్న appositional నిర్మాణంగా చదవవచ్చు. మూలంలో లేని ‘కూడబెట్టుకోండి’ అనే క్రియను చేర్చకుండా రూపకంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘డబ్బు సంచులు’ అనే స్పష్టమైన ప్రాచీన రూపకాన్ని ఆధునిక ‘పర్సులు/వాలెట్లు’గా మార్చలేదు. రెండో వాక్యంలో డాష్ మరియు ‘అంటే’ ద్వారా గ్రీకు apposition ను సాధారణ పాఠకుడికి అర్థమయ్యేలా చేశాము.
