  rationale: 'Corrected ‘దొంగా’ to ‘దొంగ’ and recast the second imperative so that both ‘డబ్బు సంచులను’ and its explanatory apposition, ‘పరలోకాలలో ఎన్నటికీ తరగని ధనాన్ని,’ are grammatically governed by one natural Telugu verb. The meaning remains the same: believers are commanded to provide themselves with an imperishable heavenly treasure. Footnote b is retained because its anchor remains attached to ‘పరలోకాలలో.’'
