review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the two imperatives, possessions, almsgiving directed to those in need, the enduring money-bag/treasure imagery, the plural ‘heavens,’ and the thief/moth contrasts. However, the Telugu has a spelling error in ‘దొంగా,’ and the dash-plus-‘అంటే’ construction leaves the appositional relation syntactically incomplete after ‘ధనాన్ని.’
  naturalness: Most wording is clear modern Telugu. ‘మీకోసం’ is slightly more natural than ‘మీ కోసం’ here. Rendering the apposition as ‘...సంచులను, అంటే ...ధనాన్ని, సమకూర్చుకోండి’ gives a complete, readable imperative without inserting a distinct theological claim.
  terminology: ‘పేదలకు దానం చేయండి’ faithfully conveys ἐλεημοσύνη in accessible Telugu; the footnote appropriately preserves ‘దానధర్మం చేయండి.’ ‘పరలోకాలలో’ retains the Greek plural, while the footnote notes the idiomatic singular alternative. ‘చిమ్మట’ is an appropriate rendering of σής.
  issues:
  - severity: medium
    issue: ‘ఏ దొంగా దగ్గరికి రాడు’ contains the incorrect form ‘దొంగా.’
    rationale: The correct Telugu nominative form is ‘దొంగ’; this is a visible orthographic/grammatical error.
  - severity: medium
    issue: The phrase after the dash, ‘అంటే, పరలోకాలలో ఎన్నటికీ తరగని ధనాన్ని;’, is syntactically unfinished.
    rationale: The accusative ‘ధనాన్ని’ needs to remain governed by a clearly placed imperative. Recasting the whole apposition under ‘సమకూర్చుకోండి’ preserves the Greek construction naturally.
  revised_text: మీ ఆస్తులను అమ్మి, పేదలకు దానం చేయండి[a]. మీకోసం పాతబడని డబ్బు సంచులను, అంటే పరలోకాలలో ఎన్నటికీ తరగని ధనాన్ని, సమకూర్చుకోండి; అక్కడ ఏ దొంగ దగ్గరికి రాడు, ఏ చిమ్మటా నాశనం చేయదు.
