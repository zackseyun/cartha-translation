revisions:
- from: మీ ఆస్తులను అమ్మి, పేదలకు దానం చేయండి[a]. మీ కోసం పాతబడని డబ్బు సంచులను చేసుకోండి—అంటే, పరలోకాలలో[b] ఎన్నటికీ తరగని ధనాన్ని; అక్కడ ఏ దొంగా దగ్గరికి రాడు, ఏ చిమ్మటా నాశనం చేయదు.
