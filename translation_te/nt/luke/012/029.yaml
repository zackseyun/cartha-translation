source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: te
  text: మీరైతే ఏమి తినాలి, ఏమి తాగాలి అని వెదుకుతూ ఉండవద్దు; కలవరపడవద్దు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆందోళనపడవద్దు,’ ‘అస్థిరంగా ఉండవద్దు’; మరింత అక్షరార్థంగా ‘అనిశ్చితిలో వేలాడుతూ ఉండవద్దు.’
    reason: μετεωρίζεσθε అనే పదం మానసిక కలవరం, ఆందోళన లేదా అనిశ్చితిలో ఉండడాన్ని సూచించగలదు.
lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరైతే
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా, నొక్కి చెప్పబడింది. ‘మీరైతే’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: ζητεῖτε
  choice: వెదుకుతూ ఉండవద్దు
  rationale: ζητέω యొక్క ‘వెదుకు, కోరుతూ ప్రయత్నించు’ అనే భావాన్ని నిలుపుతూ, వర్తమాన నిషేధంలోని కొనసాగుతున్న ధోరణిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τί φάγητε καὶ τί πίητε
  choice: ఏమి తినాలి, ఏమి తాగాలి
  rationale: ఆహారపానీయాల గురించి తలెత్తే ‘ఏమి?’ అనే అనిశ్చిత ప్రశ్నను తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు వాక్యంలోని సమాంతర నిర్మాణం కూడా నిలుస్తుంది.
- source_word: μετεωρίζεσθε
  choice: కలవరపడవద్దు
  rationale: ఈ సందర్భంలో మానసిక అస్థిరత, ఆందోళన, అనిశ్చితిని సూచించే అరుదైన క్రియకు ‘కలవరపడవద్దు’ సహజమైన విస్తృతార్థక అనువాదం. ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: καὶ ... καὶ ... καὶ
  choice: మరియు భావాన్ని కామా, సంధి విరామంతో సమన్వయించడం
  rationale: తెలుగులో ప్రతి καίను ‘మరియు’గా యాంత్రికంగా అనువదించడం అసహజం. ‘ఏమి తినాలి, ఏమి తాగాలి’ అనే జత మరియు అర్థవిరామం గ్రీకు సమన్వయాన్ని సహజంగా నిలుపుతాయి.
theological_decisions:
- issue: ఆహారం, పానీయం కోసం వెదకవద్దనే నిషేధాన్ని సాధారణ ప్రణాళికకు లేదా శరీర అవసరాలకు వ్యతిరేకంగా చూపించే ప్రమాదం
  choice: ఆహారపానీయాల గురించిన నిరంతర వెదుకులాటను, దానితో కూడిన కలవరాన్ని నిషేధించే మాటగా అనువదించడం
  alternative: ఆహారం కోసం చేసే ప్రతి సాధారణ ఏర్పాటునూ నిషేధించడం
  rationale: సందర్భం భౌతిక అవసరాల మంచితనాన్ని లేదా బాధ్యతాయుతమైన ఏర్పాట్లను తిరస్కరించడం కాదు; వాటి గురించిన ఆత్రుతతో కూడిన నిరంతర చింతను ఉద్దేశిస్తుంది. అయినప్పటికీ మూలంలోని ప్రత్యక్ష ఆజ్ఞను బలహీనపరచకుండా ‘వెదుకుతూ ఉండవద్దు’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘మీరైతే’ గ్రీకు ఉద్ఘాటనను చూపిస్తుంది; అర్థవిరామం రెండు నిషేధాల సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
