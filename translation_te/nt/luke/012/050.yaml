  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: te
  text: అయితే నేను పొందవలసిన ఒక బాప్తిస్మం ఉంది[a][b]; అది పూర్తయ్యే వరకు నేను ఎంత ఒత్తిడికి లోనవుతున్నానో![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను బాప్తిస్మం పొందవలసి ఉంది.” గ్రీకు పాఠంలో “బాప్తిస్మం” మరియు “బాప్తిస్మం పొందడం” అనే పదాల పునరుక్తి స్పష్టంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “బాప్తిస్మం” రూపకంగా వాడబడింది; యేసు త్వరలో ఎదుర్కోబోయే, తనను ముంచెత్తే బాధను ఇది సూచిస్తుంది.
    reason: alternative_reading
  - marker: c
    text: లేదా, “నేను ఎంత నిర్బంధించబడ్డానో!” లేదా “నేను ఎంత వేదన చెందుతున్నానో!”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: బాప్తిస్మం
  rationale: రాబోయే బాధను సూచించే రూపకమైనప్పటికీ, మూలంలోని ముంచబడే అనుభవ చిత్రాన్ని వ్యాఖ్యానంతో భర్తీ చేయకుండా ‘బాప్తిస్మం’ అనే పదాన్నే నిలుపుతుంది.
- source_word: ἔχω βαπτισθῆναι
  choice: నేను పొందవలసిన ... ఉంది
  rationale: ἔχω + infinitive లోని ముందున్న అవసరం లేదా అనివార్యతను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, passive భావాన్ని ‘పొందవలసిన’ ద్వారా నిలుపుతుంది.
- source_word: πῶς
  choice: ఎంత ... నో!
  rationale: ఇది ఆశ్చర్యార్థక తీవ్రతను తెలియజేస్తుంది; తెలుగులో ‘ఎంత ... నో’ సహజంగా ఆ భావోద్వేగ బలాన్ని అందిస్తుంది.
- source_word: συνέχομαι
  choice: ఒత్తిడికి లోనవుతున్నాను
  rationale: ‘బిగించబడటం, నిర్బంధించబడటం, తీవ్ర ఒత్తిడిలో ఉండటం’ అనే విస్తృత భావాన్ని నిలుపుతూ, కేవలం దుఃఖం లేదా వేదనగా అర్థాన్ని కుదించదు.
- source_word: ἕως ὅτου
  choice: వరకు
  rationale: సంఘటన పూర్తయ్యే కాలపరమైన అంతిమ బిందువును సహజంగా సూచిస్తుంది.
- source_word: τελεσθῇ
  choice: అది నెరవేరే
  rationale: ఉద్దేశించిన ముగింపుకు తీసుకురాబడటం అనే passive భావాన్ని ఇస్తుంది; యోహాను 19:30లోని ప్రత్యేక పదబంధాన్ని అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: ‘బాప్తిస్మం’ అనే రూపకానికి సూచన
  choice: యేసు ఎదుర్కోబోయే బాధ మరియు మరణాన్ని సూచించే రూపకంగా ప్రధాన పాఠంలో బాప్తిస్మపు చిత్రాన్ని నిలుపడం
  alternative: సాధారణంగా ముంచెత్తే శ్రమగా భావించడం; లేదా అక్షరార్థ జలబాప్తిస్మంగా భావించడం
  rationale: సందర్భం యేసు రాబోయే శ్రమను సూచించినా, మూలపాఠం దానిని నేరుగా ‘బాధ’ లేదా ‘మరణం’ అని చెప్పకుండా బాప్తిస్మపు రూపకాన్ని ఉంచుతుంది; అనువాదం ఆ సాహిత్య, theological ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపాలి.
- issue: συνέχομαι యొక్క భావ ఛాయ
  choice: ఒత్తిడికి లోనవుతున్నాను
  alternative: వేదన చెందుతున్నాను; నిర్బంధించబడ్డాను
  rationale: గ్రీకు క్రియలో అంతరంగిక కలతతో పాటు బిగింపు లేదా ఒత్తిడి భావం ఉంది. ప్రధాన పాఠం ఒకే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘బాప్తిస్మం’ అనే స్థిర బైబిలు పదాన్ని ఉంచి, ‘పొందవలసిన’ ద్వారా సహజత్వం మరియు మూలంలోని passive/అనివార్యత భావాల మధ్య సమతుల్యం సాధించబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
