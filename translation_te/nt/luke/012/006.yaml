id: LUK.12.6
reference: Luke 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: te
  text: ఐదు పిచ్చుకలు రెండు అస్సారియాలకు[a] అమ్మబడవా? అయినా వాటిలో ఒక్కటీ దేవుని దృష్టిలో మరువబడినది లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రెండు చిన్న రాగి నాణాలకు’; అస్సారియాలు స్వల్ప విలువగల రోమా రాగి నాణేలు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘దేవుని దృష్టిలో విస్మరించబడినది లేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: పిచ్చుకలు
  rationale: ఈ సందర్భంలో ఈ పదం సాధారణంగా పిచ్చుకలను సూచిస్తుంది; ‘చిన్న పక్షులు’ అనే విస్తృత అర్థం సాధ్యమైనా, ఇక్కడ ‘పిచ్చుకలు’ సహజమైనది, నిర్దిష్టమైనది.
- source_word: πωλοῦνται
  choice: అమ్మబడవా
  rationale: గ్రీకు వర్తమాన కర్మణి రూపాన్ని తెలుగులో సహజమైన కర్మణి ప్రశ్నగా వ్యక్తపరుస్తుంది.
- source_word: ἀσσαρίων δύο
  choice: రెండు అస్సారియాలకు
  rationale: ఆధునిక నాణెంతో సరిగా సరిపోల్చకుండా, ప్రాచీన రోమా రాగి నాణెం పేరును నిలుపుతుంది; వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: ἐπιλελησμένον
  choice: మరువబడలేదు
  rationale: పరిపూర్ణ కృదంతం సూచించే ‘మరచిపోయిన స్థితిలో ఉండడం’ అనే భావాన్ని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని ఎదుట
  rationale: మూలంలోని ‘దేవుని సమక్షంలో/దృష్టిలో’ అనే భావాన్ని విస్తరించకుండా నేరుగా నిలుపుతుంది.
- source_word: οὐχὶ ... ;
  choice: అమ్మబడవా?
  rationale: అవుననే సమాధానాన్ని ఆశించే గ్రీకు అలంకార ప్రశ్న బలాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: అయినా వాటిలో ఒక్కటి కూడా
  rationale: పిచ్చుకల స్వల్ప మార్కెట్ విలువకూ దేవుని దృష్టిలో అవి మరువబడకపోవడానికీ మధ్యనున్న వ్యత్యాసాన్ని, ఒక్కదానిపై ఉన్న ఉద్ఘాటనతో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దేవుని జ్ఞాపకం/సంరక్షణను సూచించే భాష
  choice: వాటిలో ఒక్కటి కూడా దేవుని ఎదుట మరువబడలేదు
  alternative: వాటిలో ఒక్కటి కూడా దేవుని దృష్టికి దూరం కాదు
  rationale: ‘మరువబడలేదు’ అనేది మూలపదానికి దగ్గరగా ఉండి, అతి స్వల్పమైన జీవి కూడా దేవుని దృష్టిలో లేదనే భావాన్ని నిరాకరిస్తుంది; అయితే వాక్యం చెప్పినదానికంటే విస్తృతమైన దైవ సంరక్షణ సిద్ధాంతాన్ని ఇందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ప్రాచీన నాణెం పేరును మూలానికి నిబద్ధంగా ఉంచి పాదసూచికలో వివరించాం; దేవుని శ్రద్ధకు సంబంధించిన భావాన్ని సిద్ధాంతపరంగా విస్తరించకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాం.
