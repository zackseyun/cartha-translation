id: LUK.12.8
reference: Luke 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: te
  text: '“నేను మీతో చెబుతున్నాను: మనుష్యుల ముందు నన్ను ఒప్పుకొనే ప్రతి ఒక్కరినీ మనుష్యకుమారుడు కూడా దేవుని దూతల ముందు ఒప్పుకుంటాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: ఇక నేను మీతో చెబుతున్నాను
  rationale: λέγω యొక్క గంభీరమైన ప్రకటన స్వరాన్ని ‘నేను మీతో చెబుతున్నాను’ సహజంగా వ్యక్తం చేస్తుంది. δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా సంభాషణను ముందుకు నడిపే అనుసంధాన పదం; అందువల్ల ‘ఇక’ అనేది సందర్భానికి తగిన మృదువైన అనుసంధానం.
- source_word: πᾶς ὃς ἂν
  choice: ప్రతి ఒక్కరినీ
  rationale: ఈ నిర్మాణం నిర్దిష్ట వ్యక్తిని కాకుండా వర్తించే ప్రతి వ్యక్తినీ సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘నన్ను అంగీకరించే ప్రతి ఒక్కరినీ’ అని చెప్పడం విశ్వవ్యాప్త పరిధిని సహజంగా నిలుపుతుంది.
- source_word: ὁμολογήσῃ … ὁμολογήσει
  choice: అంగీకరించే … అంగీకరిస్తాడు
  rationale: ఇక్కడ ὁμολογέω బహిరంగంగా గుర్తించి ఒప్పుకోవడం అనే భావాన్ని ఇస్తుంది. రెండుసార్లూ ‘అంగీకరించు’ వాడటం మానవుల ముందు యేసును అంగీకరించడానికీ, దేవదూతల ముందు ఆ వ్యక్తిని మనుష్య కుమారుడు అంగీకరించడానికీ ఉన్న పరస్పర సంబంధాన్ని కాపాడుతుంది; ‘ఒప్పుకొను’ అనే పదానికి ఆధునిక తెలుగులో కలగగల తప్పును ఒప్పుకోవడం అనే భావాన్ని నివారిస్తుంది.
- source_word: ἐν ἐμοὶ … ἐν αὐτῷ
  choice: నన్ను … ప్రతి ఒక్కరినీ
  rationale: ἐν + సర్వనామం అనే గ్రీకు నిర్మాణాన్ని తెలుగులో అక్షరార్థంగా ‘నాలో/అతనిలో’ అని ఇస్తే భావం అసహజంగా, అస్పష్టంగా ఉంటుంది. ὁμολογέωతో కలిసిన ఈ ప్రయోగాన్ని వ్యక్తిని బహిరంగంగా అంగీకరించడం అనే అర్థంలో సహజంగా అనువదించాం.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: మనుష్యుల ముందు
  rationale: ἔμπροσθεν యొక్క సమక్షత/బహిరంగత భావాన్ని ‘ముందు’ నిలుపుతుంది. ἀνθρώπων ఇక్కడ సాధారణంగా మానవులను సూచిస్తుంది; ‘మనుష్యులు’ ఆధునిక తెలుగులో ఆ సమగ్ర భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: ఇది యేసు తనను తాను సూచించడానికి వాడిన, దానియేలు గ్రంథ నేపథ్యమున్న బిరుదు. దాని బైబిలీయ, దైవశాస్త్ర సంబంధిత బరువును నిలుపుతూ సంప్రదాయబద్ధమైన స్పష్ట రూపాన్ని వాడాం.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: దేవుని దూతల ముందు
  rationale: ఈ రూపం గ్రీకు పదబంధాన్ని నేరుగా, సహజంగా అందిస్తూ పరలోక సమక్షంలో జరిగే బహిరంగ అంగీకార భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἐν + దత్తివుతో వచ్చిన పరస్పర అంగీకార సూత్రం
  choice: ‘నన్ను అంగీకరించే … ప్రతి ఒక్కరినీ … అంగీకరిస్తాడు’ అని భావానుగుణంగా అనువదించడం
  alternative: ‘నాలో ఒప్పుకునే … అతనిలో ఒప్పుకుంటాడు’ అని అక్షరానువాదం చేయడం
  rationale: అక్షరానువాదం తెలుగులో సహజమైన అర్థాన్ని ఇవ్వదు. ఎంచుకున్న రూపం యేసును బహిరంగంగా అంగీకరించడం మరియు మనుష్య కుమారుడు ఆ వ్యక్తిని బహిరంగంగా అంగీకరించడం మధ్య ఉన్న ప్రతిస్పందనాత్మక సమాంతరాన్ని నిలుపుతుంది; అదనపు మతశాఖాపరమైన భావాన్ని చేర్చదు.
- issue: ἀνθρώπων యొక్క లింగం మరియు పరిధి
  choice: ‘మనుష్యుల’ అని అనువదించడం
  alternative: ‘పురుషుల’ అని రూపపరంగా అనువదించడం
  rationale: గ్రీకు బహువచనం రూపపరంగా పుంలింగమైనప్పటికీ, ఇక్కడ మానవులను సాధారణంగా సూచిస్తుంది. తెలుగు ‘మనుష్యులు’ మూల ఉద్దేశాన్ని ఖచ్చితంగా, సమగ్రంగా తెలియజేస్తుంది; ‘పురుషులు’ అనడం పరిధిని అనవసరంగా కుదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మనుష్య కుమారుడు’ అనే స్థిర బైబిలీయ బిరుదును నిలిపి, మిగతా వాక్యాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
