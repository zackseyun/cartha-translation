id: LUK.12.10
reference: Luke 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: te
  text: మనుష్యకుమారునికి విరోధంగా మాట పలికే ప్రతి ఒక్కరికి క్షమాపణ లభిస్తుంది[a]. అయితే పరిశుద్ధాత్మను దూషించే వానికి క్షమాపణ లభించదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, “అది అతనికి క్షమించబడుతుంది”; ఇక్కడ క్షమించబడేది అతడు పలికిన విరోధపు మాటకు సంబంధించిన అపరాధం అని అంతర్లీనంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: ప్రతి ఒక్కరికీ
  rationale: ఈ నిర్మాణం వ్యక్తులందరికీ వర్తించే సాధారణ, విభజక భావాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా దత్తివిభక్తితో అనువదించబడింది.
- source_word: ἐρεῖ λόγον
  choice: మాట పలికే
  rationale: λόγον అనే నామవాచకాన్ని నిలుపుతూ, గ్రీకు భవిష్యత్ రూపం ఈ సాధారణ సూత్రవాక్యంలో కలిగిన అనిశ్చిత/సాధారణ భావాన్ని సహజ తెలుగు సంబంధక్రియతో వ్యక్తపరుస్తుంది.
- source_word: εἰς
  choice: విరోధంగా
  rationale: మాట మరియు దూషణ సందర్భంలో εἰς దిశను మాత్రమే కాక ప్రతికూలతను సూచిస్తుంది; ‘విరోధంగా’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు ఉపయోగించిన బిరుదుకు తెలుగు బైబిలు భాషలో స్థిరపడిన, మూలంలోని ఏకవచన నిర్దిష్ట భావాన్ని నిలిపే రూపం.
- source_word: ἀφεθήσεται αὐτῷ
  choice: అది క్షమించబడుతుంది
  rationale: గ్రీకులో క్షమించబడే అపరాధం అంతర్లీనంగా ఉంది. తెలుగులో ‘అది’ దానిని సూచిస్తూ కర్మణి ప్రయోగాన్ని నిలుపుతుంది; వ్యక్తి దత్తివిభక్తి ముందే ‘ప్రతి ఒక్కరికీ’లో వ్యక్తమవుతుంది.
- source_word: τῷ ... βλασφημήσαντι
  choice: దూషించే వ్యక్తికి
  rationale: నామవాచకంగా పనిచేసే ఆరిస్ట్ పార్టిసిపిల్‌ను సందర్భంలోని సాధారణ హెచ్చరికకు అనుగుణంగా తెలుగులో సహజమైన సంబంధక్రియా నిర్మాణంతో అందిస్తుంది; పూర్తయిన చర్య అనే అదనపు కాలభావాన్ని బలవంతంగా చేర్చదు.
- source_word: τὸ ἅγιον πνεῦμα
  choice: పరిశుద్ధాత్మ
  rationale: దైవిక ఆత్మకు ఆధునిక ప్రామాణిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: οὐκ ἀφεθήσεται
  choice: క్షమాపణ లభించదు
  rationale: గ్రీకు భవిష్యత్ కర్మణి నిరాకరణ యొక్క నిశ్చిత తీవ్రతను సహజ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; క్షమించబడే అపరాధం మరియు క్షమ పొందే వ్యక్తి మధ్య అయోమయం రాకుండా చేస్తుంది.
theological_decisions:
- issue: మనుష్యకుమారునికి విరోధంగా మాట్లాడటం మరియు పరిశుద్ధాత్మను దూషించడం మధ్య ఉన్న వ్యత్యాసం
  choice: మొదటి చర్యకు క్షమాపణ, రెండవ చర్యకు క్షమాపణ లేకపోవడం అనే వచనంలోని వ్యత్యాసాన్ని వివరణ లేకుండా యథాతథంగా నిలిపాము.
  alternative: మొదటిదాన్ని అజ్ఞానంతో చేసిన తక్కువ స్థాయి పాపంగా, రెండవదాన్ని అంతిమ పశ్చాత్తాపరాహిత్యంగా అనువాదంలోనే వివరించడం; లేదా సమాంతర వచనాల ఆధారంగా భావాన్ని విస్తరించడం.
  rationale: ఈ వాక్యం క్షమాపణ విషయంలో స్పష్టమైన వ్యత్యాసాన్ని చెబుతుంది గాని దాని తాత్త్విక విధానాన్ని నిర్వచించదు. అందువల్ల వివాదాస్పద సిద్ధాంత వివరణను అనువాదంలో చేర్చకుండా మూలంలోని ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘మనుష్యకుమారుడు,’ ‘పరిశుద్ధాత్మ’ అనే స్థిర బైబిలు పదాలను నిలిపి, మిగతా వాక్యాన్ని సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యేలా నిర్మించాం. ప్రధాన పాఠ్యంలో ఉన్న [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
