id: LUK.12.13
reference: Luke 12:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: te
  text: 'అప్పుడు జనసమూహంలోనుండి ఒకడు ఆయనతో ఇలా అన్నాడు: “బోధకుడా, వారసత్వాన్ని నాతో పంచుకోవాలని[a] నా సోదరునికి చెప్పండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారసత్వాన్ని నాతో కలిసి విభజించుకోవాలని” లేదా “వారసత్వంలో నా వాటాను నాకు ఇవ్వాలని.”
    reason: μερίσασθαι μετ’ ἐμοῦ అనే పదబంధం పంచుకోవడం, ఇద్దరి మధ్య విభజించడం, లేదా ఒకరికి తగిన వాటాను కేటాయించడం అనే భావాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: అప్పుడు ... అన్నాడు
  rationale: δέ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; కథన గమనాన్ని సహజంగా తెలియజేయడానికి ‘అప్పుడు’ అనువైనది, విరోధ భావాన్ని అతిగా చూపదు.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: జనసమూహంలో నుండి ఒకడు
  rationale: పేరు తెలియని ఒక వ్యక్తి జనసమూహంలోనివాడని తెలిపే గ్రీకు భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: ఈ సందర్భంలో యేసును సూచించే పరోక్ష కర్మ; గౌరవప్రదమైన ఆధునిక తెలుగు వాడుకను అనుసరిస్తుంది.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: బోధించే వ్యక్తిని సంబోధించే పదం; అదనపు అధికారార్థాలను చేర్చకుండా మూలంలోని సాధారణ భావాన్ని ఇస్తుంది.
- source_word: εἰπὲ
  choice: చెప్పండి
  rationale: సహోదరునితో చెప్పమని యేసును కోరే ఆజ్ఞార్థక రూపం; తెలుగులో గౌరవపూర్వక అభ్యర్థనకు సహజమైన రూపం.
- source_word: τῷ ἀδελφῷ μου
  choice: నా సహోదరునికి
  rationale: స్వామ్య సంబంధాన్ని, పరోక్ష కర్మను స్పష్టంగా నిలుపుతుంది.
- source_word: μερίσασθαι μετ’ ἐμοῦ
  choice: నాతో పంచుకోమని
  rationale: మధ్యమ ప్రయోగంలోని పంచడం లేదా భాగాలు చేయడం అనే భావాన్నీ, μετά సూచించే భాగస్వామ్యాన్నీ సహజంగా వ్యక్తం చేస్తుంది; ఖచ్చితమైన ఆస్తి విభజన విధానాన్ని నిర్ణయించదు.
- source_word: τὴν κληρονομίαν
  choice: వారసత్వాన్ని
  rationale: వారసత్వంగా లభించే ఆస్తి లేదా వాటా అనే విస్తృత భావాన్ని నిలుపుతుంది; ‘ఆస్తి’ అని మాత్రమే చెప్పి భావాన్ని కుదించదు.
