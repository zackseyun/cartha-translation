  to: 'అప్పుడు జనసమూహంలోనుండి ఒకడు ఆయనతో ఇలా అన్నాడు: “బోధకుడా, వారసత్వాన్ని నాతో పంచుకోవాలని[a] నా సోదరునికి చెప్పండి.”'
