translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. యేసుకు గౌరవ బహువచనం వాడబడింది. ‘సహోదరుడు’ మరియు ‘వారసత్వం’ పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, సందర్భానికి తగిన గంభీరతను నిలుపుతాయి.
