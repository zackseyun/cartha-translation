id: LUK.12.45
reference: Luke 12:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: te
  text: కాని ఆ బానిస[a] తన మనసులో, ‘నా యజమాని[b] రావడానికి ఆలస్యం చేస్తున్నాడు’ అని అనుకొని, దాసులను, దాసీలను కొట్టడం, తినడం, తాగడం, మత్తెక్కడం మొదలుపెడితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాసుడు.’ గ్రీకు పదం δοῦλος ఆధీనమైన గృహసంబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా ప్రభువు.’ ఇక్కడ గ్రీకు κύριος ఉపమానంలోని గృహాధికారిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: బానిస
  rationale: ఈ ఉపమానంలోని గృహాధికార సంబంధం, ఆధీన స్థితి స్పష్టంగా కనిపించేలా ‘సేవకుడు’ కంటే ‘బానిస’ను ఎంచుకున్నాం.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: తన మనసులో … అని అనుకొని
  rationale: అక్షరార్థంగా ‘తన హృదయంలో’ అయినా, ఇది అంతరంగంలో తలచుకోవడాన్ని సూచించే గ్రీకు నుడికారం; ఆధునిక తెలుగులో సహజంగా అర్థమయ్యేలా అనువదించాం.
- source_word: Χρονίζει … ἔρχεσθαι
  choice: రావడం ఆలస్యం చేస్తున్నాడు
  rationale: రాక కొనసాగుతూ ఆలస్యమవుతోందనే సేవకుని భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κύριός μου
  choice: నా యజమాని
  rationale: ఉపమానంలోని మానవ గృహాధికారిని సూచిస్తున్నందున దైవిక బిరుదుగా వినిపించగల ‘ప్రభువు’కు బదులుగా ‘యజమాని’ను వాడాం.
- source_word: ἄρξηται τύπτειν
  choice: కొట్టడం … మొదలుపెడితే
  rationale: చర్యను ప్రారంభించడాన్నీ, సందర్భంలోని పునరావృత దౌర్జన్యాన్నీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: దాసులను, దాసీలను
  rationale: గ్రీకులోని పురుష–స్త్రీ జంట భేదాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు పదాలతో నిలిపాం.
- source_word: ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι
  choice: తినడం, తాగడం, మత్తెక్కడం
  rationale: మూడు సమాంతర క్రియలను గ్రీకు క్రమంలోనే స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఉపమానంలో κύριος పదం మానవ గృహాధికారిని సూచించడం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: కథలోని అధికార సంబంధాన్ని నిలుపుతూ, ఇక్కడ నేరుగా దేవుని లేదా మెస్సీయను సంబోధిస్తున్నట్టు అపార్థం కలగకుండా ఈ పదాన్ని ఎంచుకున్నాం.
- issue: ఈ సందర్భంలో δοῦλος యొక్క ఆధీన సామాజిక స్థితి
  choice: బానిస
  alternative: దాసుడు / సేవకుడు
  rationale: గృహంలోని అధికారం, ఆధీనత, జవాబుదారీతనం ప్రధానంగా ఉన్నందున బంధిత స్థితిని మరుగుపరచని పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడాం. అంతరంగ ఆలోచనను తెలిపే గ్రీకు నుడికారాన్ని ‘తన మనసులో … అని అనుకొని’గా అందించాం; సామాజిక ఆధీనతను సూచించే పదాలను మాత్రం మృదువుగా మార్చలేదు.
