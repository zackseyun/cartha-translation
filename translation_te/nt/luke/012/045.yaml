review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional structure, the inward thought, the household-master sense of κύριος, the slave terminology for δοῦλος, the gendered pair παῖδας/παιδίσκας, and the sequence of abusive and self-indulgent actions. However, “రావడం ఆలస్యం చేస్తున్నాడు” is less idiomatic and can sound as though the act of coming itself is causing delay. “రావడానికి ఆలస్యం చేస్తున్నాడు” more naturally conveys χρονίζει ... ἔρχεσθαι, ‘is taking a long time to come.’
  naturalness: The verse is otherwise clear, modern, and appropriately direct. The revised infinitival expression is smoother standard Telugu while retaining the speaker’s complaint about the delayed arrival.
  terminology: “బానిస” fittingly represents δοῦλος in this household-authority setting. “యజమాని” correctly renders κύριος as the human household superior rather than as a divine title. “దాసులను, దాసీలను” naturally retains the male/female distinction of the paired household dependents.
  issues:
  - severity: low
    issue: The phrase “రావడం ఆలస్యం చేస్తున్నాడు” is stylistically awkward in modern standard Telugu.
    rationale: Greek χρονίζει followed by an infinitive means that the master is delayed/taking a long time in coming. “రావడానికి ఆలస్యం చేస్తున్నాడు” expresses this naturally without adding meaning.
  revised_text: కాని ఆ బానిస[a] తన మనసులో, ‘నా యజమాని[b] రావడానికి ఆలస్యం చేస్తున్నాడు’ అని అనుకొని, దాసులను, దాసీలను కొట్టడం, తినడం, తాగడం, మత్తెక్కడం మొదలుపెడితే,
