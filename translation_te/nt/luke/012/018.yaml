source:
  edition: SBLGNT
  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: te
  text: 'అతడు ఇలా చెప్పుకున్నాడు: ‘నేను చేసేది ఇదే: నా ధాన్యాగారాలను కూల్చివేసి, వాటికన్నా పెద్దవాటిని కడతాను; అక్కడ నా ధాన్యమంతటినీ, నా వస్తువులనూ పోగుచేస్తాను.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν
  choice: అప్పుడు అతడు ఇలా అనుకున్నాడు
  rationale: ఉపమానంలోని వ్యక్తి తనలో తాను ఆలోచిస్తున్న సందర్భంలో εἶπεν అంతరంగ నిర్ణయాన్ని సూచిస్తుంది; సహజమైన తెలుగులో ‘అనుకున్నాడు’ అని వ్యక్తపరచడం సందర్భోచితం.
- source_word: Τοῦτο ποιήσω
  choice: నేను చేసేది ఇదే
  rationale: τοῦτο మీదున్న సూచనాత్మక ఉద్ఘాటనను, ముందుకు చెప్పబోయే ప్రణాళికను సహజంగా నిలుపుతుంది.
- source_word: καθελῶ
  choice: పడగొట్టి
  rationale: ఉన్న నిర్మాణాలను కూల్చివేయడమనే స్పష్టమైన భావాన్ని ఇస్తుంది.
- source_word: ἀποθήκας
  choice: ధాన్యాగారాలను
  rationale: వ్యవసాయ దిగుబడిని నిల్వచేసే కట్టడాలు అనే సందర్భార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μείζονας οἰκοδομήσω
  choice: వాటికంటే పెద్దవి కట్టిస్తాను
  rationale: తులనార్థాన్ని స్పష్టంగా ఉంచి, తెలుగులో సహజంగా ఉండేందుకు సూచిత నామవాచకానికి బదులు ‘పెద్దవి’ వాడబడింది; కర్త తన ప్రణాళిక ప్రకారం నిర్మింపజేయడం ‘కట్టిస్తాను’తో సహజంగా వ్యక్తమవుతుంది.
- source_word: συνάξω ἐκεῖ
  choice: అక్కడ … పోగుచేస్తాను
  rationale: సేకరించి ఒకేచోట ఉంచడమనే ప్రాథమిక భావాన్ని నిలుపుతుంది; ‘నిల్వచేస్తాను’ కంటే మూలంలోని συνάγωకు దగ్గరగా ఉంటుంది.
- source_word: πάντα τὸν σῖτον
  choice: నా ధాన్యమంతటినీ
  rationale: σῖτος సాధారణంగా ధాన్యాన్ని, కొన్ని సందర్భాల్లో ప్రత్యేకంగా గోధుమను సూచించగలదు. సందర్భం మరియు తరువాతి μουతో ఉన్న సమాంతరత ఆధారంగా తెలుగులో ‘నా’ సహజంగా పూరించబడింది.
- source_word: τὰ ἀγαθά μου
  choice: నా ఆస్తినంతటినీ
  rationale: ఇక్కడ ἀγαθά భౌతిక సంపదలు లేదా వస్తుసామగ్రిని విస్తృతంగా సూచిస్తుంది; ‘ఆస్తి’ ఆ విస్తృతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
