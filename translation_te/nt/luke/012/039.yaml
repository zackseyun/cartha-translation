revisions:
- from: 'అయితే ఇది తెలుసుకోండి: దొంగ ఏ సమయంలో వస్తాడో ఇంటి యజమానికి తెలిసి ఉంటే, తన ఇంటి గోడను తవ్వి లోపలికి చొరబడనిచ్చేవాడు కాదు.[a]'
  to: 'అయితే ఇది తెలుసుకోండి: దొంగ ఏ సమయంలో వస్తాడో ఇంటి యజమానికి తెలిసి ఉంటే, తన ఇంటికి కన్నం వేయనిచ్చేవాడు కాదు.[a]'
  rationale: διορυχθῆναι యొక్క నిష్క్రియ భావాన్ని, అలాగే ఇంటి గోడను తవ్వి లోపలికి ప్రవేశించే సాంస్కృతిక చిత్రాన్ని నిలుపుతూ, ప్రధాన పాఠంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం “కన్నం వేయడం” వాడబడింది. పాదటిప్పణిలో అక్షరార్థం స్పష్టంగా ఇవ్వబడింది.
