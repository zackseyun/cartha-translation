id: LUK.12.39
reference: Luke 12:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: te
  text: 'అయితే ఇది తెలుసుకోండి: దొంగ ఏ సమయంలో వస్తాడో ఇంటి యజమానికి తెలిసి ఉంటే, తన ఇంటికి కన్నం వేయనిచ్చేవాడు కాదు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన ఇల్లు తవ్వబడటానికి అనుమతించేవాడు కాదు.” అప్పటి ఇళ్ల గోడలను తవ్వి లేదా తొలిచి లోపలికి చొరబడే పద్ధతిని ఇది సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: అయితే ఇది తెలుసుకోండి
  rationale: γινώσκετε బహువచన వర్తమాన ఆజ్ఞార్థక రూపం; ప్రత్యక్ష పిలుపును ‘తెలుసుకోండి’ సహజంగా నిలుపుతుంది. δέ సందర్భంలోని మార్పు లేదా వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: ὁ οἰκοδεσπότης
  choice: ఇంటి యజమాని
  rationale: ఇంటికి లేదా ఇంటివారికి అధిపతిగా ఉన్న వ్యక్తిని సూచించే οἰκοδεσπότης‌కు ఇది ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: ποίᾳ ὥρᾳ
  choice: ఏ సమయంలో
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘ఏ గంటలో’ అయినా, తెలుగులో ‘ఏ సమయంలో’ సందర్భానికి సహజంగా ఉండి కాలనిర్దిష్టతను నిలుపుతుంది.
- source_word: ὁ κλέπτης ἔρχεται
  choice: దొంగ ... వస్తాడో
  rationale: గ్రీకులో వర్తమాన రూపం ఉన్నప్పటికీ, తెలిసి ఉండడమనే ఊహాత్మక గత పరిస్థితిలో రాబోయే దొంగతన సమయాన్ని తెలుగులో ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: చొరబడనిచ్చేవాడు కాదు
  rationale: ἄνతో కూడిన రూపం గతానికి విరుద్ధమైన ఊహను సూచిస్తుంది; ‘నిచ్చేవాడు కాదు’ ఆ ప్రతికల్పిత భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: διορυχθῆναι
  choice: గోడను తవ్వి లోపలికి చొరబడడం
  rationale: క్రియ యొక్క మూలచిత్రమైన గోడను తవ్వడం లేదా తొలచడం నిలుపుతూ, దాని సందర్భార్థమైన ఇంటిలోకి అక్రమంగా ప్రవేశించడాన్ని కూడా స్పష్టం చేస్తుంది.
- source_word: τὸν οἶκον αὐτοῦ
  choice: తన ఇల్లు
  rationale: అదే వాక్యంలోని ఇంటి యజమానిని తిరిగి సూచించడానికి ‘తన’ సహజం; οἶκος యొక్క భౌతిక గృహ భావాన్ని ‘ఇల్లు’ నిలుపుతుంది.
