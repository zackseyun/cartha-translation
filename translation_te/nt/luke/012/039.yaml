translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞను వాడాం. ప్రధాన పాఠంలో మూలంలోని ‘గోడను తవ్వడం’ అనే సాంస్కృతిక చిత్రాన్ని సహజమైన ‘లోపలికి చొరబడడం’తో కలిపి ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో వివరించాం.
