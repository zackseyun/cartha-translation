id: LUK.12.58
reference: Luke 12:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: te
  text: ఎందుకంటే, నీ న్యాయ ప్రత్యర్థితో కలిసి అధికారి దగ్గరికి వెళ్తున్నప్పుడు, దారిలోనే అతని నుండి విడిపోవడానికి[a] శాయశక్తులా ప్రయత్నించు. లేకపోతే అతడు నిన్ను న్యాయమూర్తి దగ్గరికి ఈడ్చుకుపోతాడు; న్యాయమూర్తి నిన్ను అమలు అధికారికి అప్పగిస్తాడు; ఆ అధికారి నిన్ను జైలులో పడవేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనితో వివాదాన్ని పరిష్కరించుకోవడానికి.” గ్రీకు పదబంధానికి అక్షరార్థం “అతని నుండి విడిపోవడానికి”; ఈ సందర్భంలో కేసు న్యాయమూర్తి దగ్గరికి చేరకముందే పరిష్కరించుకోవడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιδίκου
  choice: నిన్ను నిందిస్తున్నవాడు
  rationale: న్యాయ వివాదంలో ఎదురుపక్షంగా ఆరోపణ మోపుతున్న వ్యక్తిని సూచిస్తుంది. సాధారణ ‘విరోధి’ కంటే ఈ సందర్భంలోని న్యాయపరమైన పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄρχοντα
  choice: అధికారి
  rationale: ఇక్కడ పౌర లేదా పరిపాలనా అధికారిని సూచిస్తుంది. ‘పాలకుడు’ కంటే న్యాయ-పరిపాలనా సందర్భానికి సహజంగా సరిపోతుంది; తరువాత వచ్చే న్యాయమూర్తితో భేదాన్ని కూడా నిలుపుతుంది.
- source_word: δὸς ἐργασίαν
  choice: గట్టిగా ప్రయత్నించు
  rationale: చురుకైన, శ్రద్ధగల ప్రయత్నం చేయాలనే గ్రీకు నుడికారపు బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: అతని పట్టు నుంచి విడిపించబడడానికి
  rationale: అక్షరార్థమైన ‘అతని నుండి విడుదల పొందడం’ అనే భావాన్ని నిలుపుతూ, అతని దావా లేదా అధికార పరిధి నుంచి బయటపడటాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. కేసును పరిష్కరించుకోవడం సందర్భార్థం కావచ్చని పాదటిప్పణిలో ఉంచబడింది.
- source_word: κατασύρῃ
  choice: ఈడ్చుకుపోవచ్చు
  rationale: బలవంతంగా న్యాయమూర్తి దగ్గరికి తీసుకెళ్లే క్రియలోని తీవ్రతను నిలుపుతుంది; μήποτε లోని హెచ్చరికాత్మక సంభావ్యతను కూడా తెలియజేస్తుంది.
- source_word: κριτήν / κριτής
  choice: న్యాయమూర్తి
  rationale: ప్రామాణిక న్యాయపరమైన అర్థాన్ని స్పష్టంగా, స్థిరంగా అందిస్తుంది.
- source_word: παραδώσει
  choice: అప్పగిస్తాడు
  rationale: న్యాయమూర్తి శిక్ష లేదా వసూలు అమలుకోసం అధికారికి చేసే అధికారిక బదలాయింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πράκτορι / πράκτωρ
  choice: అమలు అధికారి / ఆ అధికారి
  rationale: తీర్పును అమలు చేసే, బహుశా బకాయి వసూలు లేదా నిర్బంధ బాధ్యత గల అధికారిని సూచిస్తుంది. మొదట పూర్తి పదబంధం, తరువాత సహజమైన సంక్షిప్త సూచన వాడబడింది.
- source_word: βαλεῖ εἰς φυλακήν
  choice: చెరసాలలో పడవేస్తాడు
  rationale: βάλλω లోని బలమైన, సజీవమైన భావాన్ని ‘పెడతాడు’ కంటే మెరుగుగా నిలుపుతుంది.
- source_word: ὡς γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి ఈ న్యాయ దృశ్యం వివరణాత్మక ఆధారంగా అనుసంధానమవుతుందని తెలుగులో సహజంగా సూచిస్తుంది. ὡς యొక్క సందర్భాత్మక భావం తరువాతి ‘వెళ్తున్నప్పుడు’ నిర్మాణంలో ప్రతిఫలిస్తుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలోనే
  rationale: ప్రయాణంలో ఉన్నప్పుడే చర్య తీసుకోవాలనే స్థలార్థం మరియు అత్యవసర కాలార్థం రెండింటినీ ‘నే’ బలంతో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: న్యాయపరమైన ఉపమానానికి ఆధ్యాత్మిక అర్థాన్ని ఎంతవరకు స్పష్టీకరించాలి
  choice: వచనంలో ఉన్న న్యాయ దృశ్యాన్నే నిలిపి, దాని ఆధ్యాత్మిక అన్వయాన్ని ప్రధాన పాఠ్యంలో ప్రత్యక్షంగా చేర్చలేదు.
  alternative: దీనిని దేవునితో సమాధానపడాలని లేదా అంతిమ తీర్పుకు ముందే పరిష్కారం పొందాలని నేరుగా అనువదించడం.
  rationale: ఈ వచనపు ప్రత్యక్ష పదజాలం ఒక న్యాయపరమైన ఉదాహరణ. విస్తృత సందర్భంలో అంతిమ తీర్పు గురించిన అత్యవసరత సూచితమై ఉండవచ్చు; అయినా నిందించేవాడు, న్యాయమూర్తి, చెరసాల ఎవరు లేదా ఏమిటో వచనం స్వయంగా నిర్దిష్టంగా చెప్పదు. కాబట్టి ఆ ఉద్దేశపూర్వక విస్తృతతను నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయ దృశ్యానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘అధికారి,’ ‘న్యాయమూర్తి,’ ‘అమలు అధికారి’ అనే పదాలతో పాత్రల మధ్య తేడా నిలుపబడింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
