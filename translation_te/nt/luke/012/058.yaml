  to: ఎందుకంటే, నీ న్యాయ ప్రత్యర్థితో కలిసి అధికారి దగ్గరికి వెళ్తున్నప్పుడు, దారిలోనే అతని నుండి విడిపోవడానికి[a] శాయశక్తులా ప్రయత్నించు. లేకపోతే అతడు నిన్ను న్యాయమూర్తి దగ్గరికి ఈడ్చుకుపోతాడు; న్యాయమూర్తి నిన్ను అమలు అధికారికి అప్పగిస్తాడు; ఆ అధికారి నిన్ను జైలులో పడవేస్తాడు.
