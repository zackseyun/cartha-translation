id: LUK.12.53
reference: Luke 12:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: te
  text: 'వారు విభజింపబడతారు: తండ్రి కుమారునికి వ్యతిరేకంగా, కుమారుడు తండ్రికి వ్యతిరేకంగా; తల్లి కుమార్తెకు వ్యతిరేకంగా, కుమార్తె తల్లికి వ్యతిరేకంగా; అత్త తన కోడలికి వ్యతిరేకంగా, కోడలు అత్తకు వ్యతిరేకంగా ఉంటారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విభజింపబడతారు’ అనే మాటను ‘వేరుపడతారు’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ ఒక కుటుంబం లేదా సమూహం లోపల ఏర్పడే విభజనను నొక్కి చెబుతుంది. ‘కోడలు’కు వాడిన గ్రీకు పదం ఇతర సందర్భాల్లో ‘వధువు’ అని కూడా అర్థమవుతుంది; ఇక్కడ ‘అత్త’తో ఉన్న కుటుంబ సంబంధ జంట కారణంగా ‘కోడలు’ అనే అర్థం సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: వారు విభేదించుకుంటారు
  rationale: భవిష్యత్ కర్మణి రూపం కుటుంబంలోని వ్యక్తులు పరస్పరం విభజింపబడే స్థితిని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘విభేదించుకుంటారు’ అని ఇచ్చి, వెంట వచ్చే పరస్పర విరోధ జంటల భావాన్ని నిలిపాం.
- source_word: ἐπὶ
  choice: విరోధంగా
  rationale: వ్యక్తుల మధ్య పునరావృతమయ్యే ఈ నిర్మాణంలో ἐπί ప్రతికూలతను, ఎదిరింపును సూచిస్తుంది; ‘విరోధంగా’ ఆ భావాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: πατήρ / υἱός
  choice: తండ్రి / కుమారుడు
  rationale: మూలంలోని పురుష లింగ కుటుంబ సంబంధాల పరస్పర జంటను యథాతథంగా నిలుపుతుంది.
- source_word: μήτηρ / θυγάτηρ
  choice: తల్లి / కుమార్తె
  rationale: మూలంలోని స్త్రీ లింగ కుటుంబ సంబంధాల పరస్పర జంటను యథాతథంగా నిలుపుతుంది.
- source_word: πενθερά
  choice: అత్త
  rationale: తెలుగులో భర్త లేదా భార్య తల్లిని సూచించగల సహజమైన బంధుత్వ పదం; ఇక్కడ కోడలితో ఉన్న జంట సంబంధం అర్థాన్ని నిర్దిష్టం చేస్తుంది.
- source_word: νύμφη
  choice: కోడలు
  rationale: νύμφη ఇతర సందర్భాల్లో ‘వధువు’ అని అర్థమవగలిగినా, πενθεράతో పరస్పర జంటగా ఉన్నందున ఇక్కడ ‘కోడలు’ సరైన సందర్భార్థం.
- source_word: αὐτῆς
  choice: తన
  rationale: ‘తన కోడలు’ అని అనువదించడం ద్వారా మూలంలోని సంబంధ సూచనను నిలిపాం; చివరి జంటలో తెలుగు సహజత్వం, పరస్పర సంబంధ స్పష్టత కోసం ‘తన అత్త’ అని కూడా ఇచ్చాం.
theological_decisions:
- issue: వివరించబడిన విభేద స్వభావం
  choice: యేసు పరిచర్య ఫలితంగా కలిగే కుటుంబ, సామాజిక సంఘర్షణను కఠినమైన పదాలతో వర్ణించడం
  alternative: కుటుంబ ఉద్రిక్తతల గురించి సాధారణ సామెతగా లేదా కుటుంబ విరోధాన్ని ఆమోదించే ఆజ్ఞగా చదవడం
  rationale: ముందరి సందర్భంలోని విభజనకు కుటుంబాల్లో కలిగే ఫలితాలను ఈ వచనం పరస్పర విరోధ జంటలతో వివరిస్తుంది. అనువాదం ఆ ఉద్రిక్తతను మృదువుచేయదు; అదే సమయంలో దానిని ఆమోదించే ఆజ్ఞగా కూడా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని వరుస పరస్పర జంటలను అర్ధవిరామాలతో స్పష్టంగా చూపించాం. ‘అత్త’ అనే పదం సందర్భంలో కోడలి అత్తను సూచిస్తుంది.
