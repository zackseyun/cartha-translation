source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: te
  text: అయితే, మీరు అతి చిన్నదైనా చేయలేకపోతే, మిగిలిన వాటి గురించి[a] ఎందుకు ఆందోళన పడుతున్నారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిగిలిన విషయాల గురించి.”
    reason: λοιπῶν ను విస్తృతమైన ‘మిగిలిన వాటి’గా లేదా మరింత స్పష్టంగా ‘మిగిలిన విషయాల’గా అనువదించవచ్చు.
lexical_decisions:
- source_word: εἰ οὖν
  choice: కాబట్టి … చేయలేకపోతే
  rationale: εἰ యొక్క షరతు భావాన్ని ‘చేయలేకపోతే’తోను, οὖν యొక్క పూర్వవాక్యంతో ఉన్న నిర్ధారణాత్మక సంబంధాన్ని ‘కాబట్టి’తోను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
- source_word: οὐδὲ ἐλάχιστον
  choice: అతి చిన్న పని కూడా
  rationale: ἐλάχιστον నపుంసక ఏకవచనంలో నామవాచకంగా వాడబడి అతి చిన్న విషయం లేదా కార్యాన్ని సూచిస్తుంది. సందర్భంలో సామర్థ్యాన్ని చెప్పడం వల్ల ‘పని’ సహజంగా ఉండి, ‘కూడా’ οὐδέ లోని బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: δύνασθε
  choice: మీరు చేయలేకపోతే
  rationale: δύναμαι సామర్థ్యాన్ని సూచిస్తుంది. తెలుగులో ప్రతికూల షరతుగా ‘చేయలేకపోతే’ అనడం సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: τί
  choice: ఎందుకు
  rationale: ఇక్కడ τί ప్రశ్నార్థకంగా కారణాన్ని అడిగే అలంకారిక ప్రశ్నలో ఉంది; అందువల్ల ‘ఎందుకు’ సరైన సహజ తెలుగు రూపం.
- source_word: περὶ τῶν λοιπῶν
  choice: మిగిలిన వాటి గురించి
  rationale: λοιπός అతి చిన్న పనికి మించిన మిగతా విషయాలను సూచిస్తుంది. ‘మిగిలిన వాటి గురించి’ ఆ తులనాత్మక సంబంధాన్ని నిలుపుతుంది.
- source_word: μεριμνᾶτε
  choice: ఆందోళన పడుతున్నారు
  rationale: μεριμνάω ఇక్కడ కొనసాగుతున్న చింత లేదా కలవరాన్ని సూచిస్తుంది. ‘ఆందోళన పడుతున్నారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, సాధారణమైన జాగ్రత్తను నిషేధిస్తున్నట్టు చెప్పదు.
theological_decisions:
- issue: దేవునిపై ఆధారపడడం గురించి యేసు బోధలో μεριμνάω అర్థం
  choice: ఆందోళన పడుతున్నారు
  alternative: చింతిస్తున్నారు
  rationale: ఈ సందర్భం వివేకపూర్వకమైన శ్రద్ధ అంతటినీ కాక, కలవరపెట్టే ఆందోళనను ప్రశ్నిస్తుంది. ‘ఆందోళన పడుతున్నారు’ ఆ భావాన్ని నిలుపుతూ ప్రత్యేక మతసిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను వాడాం. వాక్యంలోని షరతు–నిర్ధారణ సంబంధాన్ని స్పష్టంగా ఉంచుతూ, గ్రీకు మూలంలోని సంక్షిప్త అలంకారిక ప్రశ్నను సహజంగా మలిచాం.
