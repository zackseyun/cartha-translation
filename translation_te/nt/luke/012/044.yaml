  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: te
  text: 'నేను మీతో నిజంగా చెబుతున్నాను: అతను తనకు ఉన్న సమస్తం మీద అతణ్ణి నియమిస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన ఆస్తులన్నిటిమీద’ లేదా ‘తన సంపద అంతటిమీద.’
    reason: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ అనే పదబంధం అతనికి చెందిన సమస్తాన్ని సూచిస్తుంది; సందర్భానుసారం ఆస్తులు లేదా సంపద అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: ἀληθῶς
  choice: నిజంగా
  rationale: మాట యొక్క సత్యతను, గంభీరమైన నిశ్చయాన్ని నొక్కిచెప్పే క్రియావిశేషణం; ఆధునిక తెలుగులో సహజంగా ఆ బలాన్ని అందిస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనతో కూడిన అధికారపూర్వక ప్రకటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: ':'
  rationale: గ్రీకు సంయోజకం తరువాత వచ్చే ప్రకటన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ద్విబిందువు దీనిని సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: ἐπὶ
  choice: మీద
  rationale: ఇక్కడ దత్తివిభక్తితో అధికారం లేదా పర్యవేక్షణను సూచిస్తుంది; ‘మీద’ సంక్షిప్తంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: అతనికి ఉన్నదంతటి
  rationale: అతనికి చెందిన సమస్తాన్ని విస్తృతంగా సూచిస్తుంది; కేవలం వస్తుసంపదకే భావాన్ని పరిమితం చేయదు.
- source_word: καταστήσει
  choice: నియమిస్తాడు
  rationale: ఒకరిని అధికారపూర్వకంగా బాధ్యతలో ఉంచడం అనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτόν
  choice: అతణ్ణి
  rationale: సమీప సందర్భంలోని పురుష ఏకవచన పాత్రను సూచించే ప్రత్యక్ష కర్మను యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమాన సందర్భంలోని పురుష ఏకవచన సర్వనామాలు
  choice: ‘అతనికి’, ‘అతణ్ణి’ అనే పురుష ఏకవచన రూపాలను నిలుపడం
  alternative: లింగతటస్థంగా ‘ఆ వ్యక్తికి’, ‘ఆ వ్యక్తిని’ అని అనువదించడం
  rationale: గ్రీకు పాఠం ఉపమానంలోని పురుష పాత్రను పురుష ఏకవచన రూపాలతోనే సూచిస్తుంది; భావాన్ని సాధారణీకరించకుండా కథన రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. యేసు పలికిన నిశ్చయ ప్రకటన బలాన్ని ‘నిజంగా’ ద్వారా, అధికార బాధ్యత భావాన్ని ‘నియమిస్తాడు’ ద్వారా నిలిపింది.
