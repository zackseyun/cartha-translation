  naturalness: Apart from the direct-address form, the sentence is clear, modern, and suitably grave. ‘నేను నీకు చెబుతున్నాను’ is idiomatic standard Telugu and correctly conveys the direct address.
  terminology: ‘లెప్టా’ appropriately preserves the historically specific coin name, and the footnote supplies a clear lexical alternative without imposing an interpretation on the legal/debt imagery.
