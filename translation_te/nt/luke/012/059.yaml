id: LUK.12.59
reference: Luke 12:59
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: te
  text: 'నేను నీకు చెబుతున్నాను: చివరి లెప్టాను కూడా చెల్లించే వరకు నీవు అక్కడి నుంచి ఎంతమాత్రమూ బయటికి రావు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చివరి చిన్న నాణెాన్ని కూడా.” గ్రీకు పదమైన “లెప్టా” అతి చిన్న విలువగల నాణెాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: నీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: నీవు ఎంతమాత్రమూ బయటికి రావు
  rationale: οὐ μή తో కూడిన aorist subjunctive భవిష్యత్తును గూర్చిన బలమైన నిరాకరణను వ్యక్తం చేస్తుంది; ‘ఎంతమాత్రమూ ... రావు’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుంచి
  rationale: స్థలం నుంచి బయటకు రావడాన్ని స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: ἕως
  choice: వరకు
  rationale: నిరాకరించబడిన పరిస్థితి కొనసాగే కాలపరిమితిని సూచిస్తుంది.
- source_word: καὶ τὸ ἔσχατον
  choice: చివరి ... కూడా
  rationale: ఇక్కడ καί ఉద్ఘాటనాత్మకంగా ఉంది; అప్పు పూర్తిగా చెల్లించాల్సిన భావాన్ని నిలుపుతుంది.
- source_word: λεπτόν
  choice: లెప్టా
  rationale: చారిత్రక నాణెం పేరును లిప్యంతరీకరించి మూలపాఠంలోని నిర్దిష్టతను నిలుపుతుంది; దాని అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἀποδῷς
  choice: చెల్లించే
  rationale: న్యాయ/అప్పు సందర్భానికి ‘చెల్లించు’ సరిపోతుంది; ἕως తో కూడిన aorist subjunctive సూచించే చెల్లింపు పూర్తయ్యే హద్దును వాక్య నిర్మాణం సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ ఉపమానాత్మక మాటలోని చెరసాల–అప్పు చిత్రణ దేనిని సూచిస్తుంది?
  choice: అప్పు పూర్తిగా చెల్లించే వరకు నిర్బంధంలో ఉండే చిత్రణను యథాతథంగా ఉంచడం
  alternative: దీనిని భౌతిక న్యాయపరమైన పరిణామంగా, దేవుని తీర్పుగా, లేదా తరువాతి శుద్ధిస్థల సిద్ధాంతానికి ఆధారంగా స్పష్టీకరించడం
  rationale: ఈ వచనం నిర్బంధం మరియు పూర్తి చెల్లింపును చెబుతుంది గాని వాటి అంతిమ సూచనను నిర్దిష్టంగా చెప్పదు. కాబట్టి అనిశ్చితిని, ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘లెప్టా’ అనే చారిత్రక నాణెం పేరు ప్రధాన పాఠంలో ఉంచి పాదటిప్పణిలో వివరించబడింది.
