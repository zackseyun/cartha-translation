revisions:
- from: మీరు కూడా, పెళ్లి విందు నుండి తమ యజమాని ఎప్పుడు తిరిగి వస్తాడా అని ఎదురుచూస్తూ, ఆయన వచ్చి తలుపు తట్టగానే వెంటనే ఆయనకు తలుపు తెరిచే మనుషుల్లా ఉండండి.
  to: మీరు కూడా, తమ యజమాని పెళ్లి విందు నుండి ఎప్పుడు తిరిగి వస్తాడో అని ఎదురుచూసే మనుషుల్లా ఉండండి; ఆయన వచ్చి తలుపు తట్టినప్పుడు, వారు వెంటనే ఆయనకు తలుపు తెరవాలి.
  rationale: The revision corrects the indirect-question form required by πότε and clarifies the syntactic progression of the simile without adding interpretive content. “తలుపు” remains a natural contextual specification supplied by the actions of knocking and opening.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:44Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the household-servant simile, the master's return from the wedding feast, his knocking, and the servants' immediate opening. However, “ఎప్పుడు తిరిగి వస్తాడా అని” can sound like uncertainty about whether he will return, whereas πότε asks when he will return. The purpose/result expressed by ἵνα is also clearer when the opening action is retained as a following finite clause.
  naturalness: The proposed revision uses a more idiomatic Telugu indirect-question construction, “ఎప్పుడు తిరిగి వస్తాడో అని,” and separates the long sentence into two balanced clauses. This makes the relationship between waiting, the master's arrival, and the immediate response easier to follow.
  terminology: “యజమాని” is appropriate for κύριος in this domestic parable and avoids prematurely turning the parabolic figure into a direct title. “పెళ్లి విందు” naturally represents ἐκ τῶν γάμων in context. No theological terminology requires alteration.
  issues:
  - severity: medium
    issue: “ఎప్పుడు తిరిగి వస్తాడా అని”
    rationale: With πότε, the Greek means “when he will return,” not whether he will return. Telugu “ఎప్పుడు తిరిగి వస్తాడో అని” preserves this indirect-question sense.
  - severity: low
    issue: Purpose/result clause is compressed into “తలుపు తెరిచే మనుషుల్లా”
    rationale: Although understandable, the relative-clause compression makes the ἵνα clause less explicit. A finite clause after the comparison more clearly conveys that they open immediately when he arrives and knocks.
  revised_text: మీరు కూడా, తమ యజమాని పెళ్లి విందు నుండి ఎప్పుడు తిరిగి వస్తాడో అని ఎదురుచూసే మనుషుల్లా ఉండండి; ఆయన వచ్చి తలుపు తట్టినప్పుడు, వారు వెంటనే ఆయనకు తలుపు తెరవాలి.
  revised_footnotes: []
  revision_rationale: The revision corrects the indirect-question form required by πότε and clarifies the syntactic progression of the simile without adding interpretive content. “తలుపు” remains a natural contextual specification supplied by the actions of knocking and opening.
