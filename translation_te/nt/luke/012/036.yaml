id: LUK.12.36
reference: Luke 12:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: te
  text: మీరు కూడా, తమ యజమాని పెళ్లి విందు నుండి ఎప్పుడు తిరిగి వస్తాడో అని ఎదురుచూసే మనుషుల్లా ఉండండి; ఆయన వచ్చి తలుపు తట్టినప్పుడు, వారు వెంటనే ఆయనకు తలుపు తెరవాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος ἑαυτῶν
  choice: తమ యజమాని
  rationale: ఇక్కడ κύριος యజమాని–సేవకుల ఉపమాన సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘యజమాని’ ఆ సందర్భాన్ని సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: προσδεχομένοις
  choice: ఎదురుచూస్తూ
  rationale: ఆసక్తితో నిరీక్షించడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: πότε ἀναλύσῃ
  choice: ఎప్పుడు తిరిగి వస్తాడా అని
  rationale: ఈ సందర్భంలో ἀναλύω బయలుదేరి తిరిగి రావడాన్ని సూచిస్తుంది; πότεతో కలిసిన నిరీక్షణ భావాన్ని తెలుగులో ఈ నిర్మాణం సహజంగా అందిస్తుంది.
- source_word: ἐκ τῶν γάμων
  choice: పెళ్లి విందు నుండి
  rationale: బహువచన రూపమైన γάμοι ఇక్కడ వివాహ వేడుక లేదా విందును సూచిస్తుంది; సందర్భానుకూలంగా ‘పెళ్లి విందు’ స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: εὐθέως ἀνοίξωσιν αὐτῷ
  choice: వెంటనే ఆయనకు తలుపు తెరిచే
  rationale: మూలంలో ‘తలుపు’ ప్రత్యక్షంగా లేకపోయినా తట్టడం, తెరవడం అనే సందర్భంలో తెలుగులో కర్మను స్పష్టపరచడం సహజం; εὐθέωςను ‘వెంటనే’గా నిలిపింది.
theological_decisions:
- issue: κύριοςను ‘ప్రభువు’గా లేదా ‘యజమాని’గా అనువదించడం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఈ వాక్యంలో సేవకులు తమ ఇంటి యజమాని కోసం వేచిచూసే ఉపమాన దృశ్యం ప్రధానమైనది. ‘ప్రభువు’ సాధ్యమైనప్పటికీ, అది క్రీస్తును నేరుగా సూచించే భావాన్ని ముందుగానే బలపరచవచ్చు; ‘యజమాని’ ఉపమాన స్థాయిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘మనుషుల్లా ఉండండి’ మూలంలోని ἀνθρώποις ὁμοιοι భావాన్ని నిలుపుతుంది; తలుపు తట్టగానే తెరవడం అనే దృశ్యాన్ని సహజ తెలుగు క్రమంలో అమర్చింది.
