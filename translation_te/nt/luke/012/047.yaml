id: LUK.12.47
reference: Luke 12:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: te
  text: అయితే, తన యజమాని చిత్తం తెలిసి కూడా సిద్ధపడక, లేదా తన చిత్తం ప్రకారం చేయని ఆ దాసుడు అనేక దెబ్బలతో కొట్టబడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అనేకసార్లు కొట్టబడతాడు” లేదా “అనేక దెబ్బలు పొందుతాడు.” గ్రీకులో ‘దెబ్బలు’ అనే నామవాచకం చెప్పకుండా సూచితంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: దాసుడు
  rationale: ఇది జీతానికి పనిచేసే సాధారణ సేవకునికంటే యజమాని అధికారానికి లోబడిన బానిస స్థితిని సూచిస్తుంది. ఉపమానంలోని యజమాని–దాసుని సంబంధాన్ని ‘దాసుడు’ సహజంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γνοὺς
  choice: తెలిసి కూడా
  rationale: యజమాని చిత్తం ముందే తెలిసినప్పటికీ దానికి అనుగుణంగా ప్రవర్తించలేదనే విరుద్ధ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θέλημα
  choice: చిత్తం
  rationale: ఇక్కడ యజమాని కోరినది లేదా సంకల్పించినది అనే భావాన్ని ‘చిత్తం’ సంక్షిప్తంగా, సందర్భోచితంగా అందిస్తుంది.
- source_word: κυρίου αὐτοῦ
  choice: తన యజమాని
  rationale: ఇది ఉపమానంలోని గృహాధిపతిని సూచిస్తుంది; ప్రత్యక్ష దైవబిరుదుగా కాక యజమాని–దాసుని సంబంధంగా అనువదించబడింది.
- source_word: ἑτοιμάσας
  choice: సిద్ధపడక
  rationale: గ్రీకులో కర్మ స్పష్టంగా చెప్పబడలేదు; తెలుగులోనూ దానిని అదనంగా నిర్దిష్టం చేయకుండా ‘సిద్ధపడక’ అని ఉంచుతుంది.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: లేదా ఆయన చిత్తం ప్రకారం చేయని
  rationale: రెండు వైఫల్యాలను కలిపే ἢ అనే ‘లేదా’ భావాన్ని నిలుపుతూ, πρός τὸ θέλημα నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δαρήσεται
  choice: దెబ్బలు తింటాడు
  rationale: భౌతికంగా కొట్టబడటాన్ని ఆధునిక తెలుగులో సహజంగా చెప్పే ప్రయోగం; గ్రీకు భవిష్యత్ కర్మణి భావాన్ని సందర్భంలో స్పష్టంగా అందిస్తుంది.
- source_word: πολλάς
  choice: చాలా దెబ్బలు
  rationale: గ్రీకులో నామవాచకం అధ్యాహారంగా ఉంది. తెలుగులో అర్థస్పష్టత కోసం ‘దెబ్బలు’ చేర్చి, తీవ్రతను మాత్రమే చెప్పకుండా పునరావృతమైన దెబ్బల దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలోని κύριος పదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఈ వాక్యంలో κύριος దాసునిపై అధికారం గల గృహాధిపతిని సూచిస్తుంది. ‘యజమాని’ ఉపమానంలోని సామాజిక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; విస్తృత ఉపమానార్థాన్ని మాత్రం నిరోధించదు.
- issue: πολλάς అనే శిక్షా పదబంధం
  choice: చాలా దెబ్బలు
  alternative: తీవ్రంగా; అనేకసార్లు
  rationale: గ్రీకు నామవాచకాన్ని చెప్పకుండా విశేషణాన్ని మాత్రమే ఉంచినప్పటికీ, సందర్భంలో దెబ్బలు సూచితమవుతున్నాయి. ‘చాలా దెబ్బలు’ ఆ స్పష్టమైన హెచ్చరిక దృశ్యాన్ని నిలుపుతుంది; ‘తీవ్రంగా’ అనడం పునరావృత భావాన్ని మసకబార్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా అయినా ఉపమానంలోని గంభీర హెచ్చరికను తగ్గించకుండా రూపొందించబడింది. ‘దాసుడు’ మరియు ‘యజమాని’ పదాలు మూలంలోని అధికార సంబంధాన్ని నిలుపుతాయి.
