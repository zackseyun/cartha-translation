id: LUK.12.46
reference: Luke 12:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: te
  text: ఆ దాసుని యజమాని, అతడు ఎదురుచూడని రోజున, అతనికి తెలియని గంటలో వచ్చి, అతణ్ణి రెండుగా నరికి[a], అతనికి నమ్మకంలేనివారితో భాగం కేటాయిస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి ముక్కలుగా నరికి”; కొందరు ఈ మాటను “అతణ్ణి తీవ్రంగా శిక్షించి” అనే జాతీయార్థంలో గ్రహిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అవిశ్వాసులతో.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: యజమాని
  rationale: దాసునితో ఉన్న యజమాని–దాసుని సంబంధాన్ని సందర్భం స్పష్టంగా చూపుతోంది; ఇక్కడ ‘ప్రభువు’ కంటే ‘యజమాని’ సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: పారంపరిక గృహవ్యవస్థలోని అధీన సంబంధాన్ని ‘దాసుడు’ స్పష్టంగా తెలియజేస్తుంది; ఆధునిక పాఠకునికి కూడా అర్థమయ్యే గౌరవప్రదమైన ప్రామాణిక పదం.
- source_word: ἥξει
  choice: వచ్చి
  rationale: యజమాని రాకను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; వాక్యాంతంలోని భవిష్యత్ క్రియతో కలిసి భవిష్యత్ భావం నిలుస్తుంది.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: అతడు ఎదురుచూడని రోజున
  rationale: προσδοκάω యొక్క ‘ఎదురుచూడు/ఆశించు’ భావాన్ని కాపాడుతూ, రాకను కర్మగా సందర్భానుసారంగా అంతర్లీనంగా ఉంచుతుంది.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: అతనికి తెలియని గంటలో
  rationale: ముందటి ‘ఎదురుచూడని’ భావంతో కలపకుండా γινώσκω యొక్క ‘తెలుసు’ అనే ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: διχοτομήσει
  choice: అతణ్ణి రెండుగా నరికి
  rationale: క్రియ యొక్క బలమైన, అక్షరార్థ చిత్రణ ‘రెండుగా నరుకు’ అని నిలుపబడింది; దానిని ప్రధాన వచనంలో మృదువైన శిక్షాభావంగా మార్చలేదు.
- source_word: τὸ μέρος αὐτοῦ
  choice: అతని వంతు
  rationale: μέρος యొక్క ‘వంతు/భాగం/పాలు’ భావాన్ని నేరుగా కాపాడుతుంది; తీర్పులో అతనికి కేటాయించబడే గతి అనే భావం సందర్భం ద్వారా తెలుస్తుంది.
- source_word: ἀπίστων
  choice: నమ్మకద్రోహులు
  rationale: దాసుని విశ్వసనీయత ప్రధానాంశమైన ఈ ఉపమాన సందర్భంలో ‘నమ్మకద్రోహులు’ అనేది సంబంధపరమైన ἄπιστος భావాన్ని తెలియజేస్తుంది; ‘అవిశ్వాసులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: θήσει
  choice: నియమిస్తాడు
  rationale: ఒకరి వంతును ఒక సమూహంతో ఉంచడం లేదా కేటాయించడం అనే న్యాయతీర్పు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: διχοτομήσει లోని శిక్షా చిత్రణను అక్షరార్థంగా ఉంచాలా, తీవ్రమైన శిక్ష అనే జాతీయార్థంగా అనువదించాలా
  choice: ప్రధాన వచనంలో ‘అతణ్ణి రెండుగా నరికి’ అనే బలమైన చిత్రణను నిలిపాం.
  alternative: ‘అతణ్ణి తీవ్రంగా శిక్షించి’
  rationale: గ్రీకు క్రియలోని ఘోరమైన తీర్పు చిత్రణను మృదువుగా చేయకుండా కాపాడటం సముచితం; జాతీయార్థంగా అర్థం చేసుకునే అవకాశాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: ἀπίστων ను ‘నమ్మకద్రోహులు’గా లేదా ‘అవిశ్వాసులు’గా అనువదించాలా
  choice: ఉపమానంలోని విశ్వసనీయత నేపథ్యానికి అనుగుణంగా ‘నమ్మకద్రోహులు’ను ప్రధాన వచనంలో వాడాం.
  alternative: ‘అవిశ్వాసులు’
  rationale: ἄπιστος విశ్వాసరాహిత్యాన్నీ నమ్మకద్రోహాన్నీ సూచించగలదు. తక్షణ సందర్భం రెండవ భావానికి మద్దతిస్తుండగా, అంతిమ తీర్పు నేపథ్యం మొదటి భావాన్నీ అనుమతిస్తుంది; అందుకే ఆ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన హెచ్చరిక ధోరణిని నిలిపాం. ‘యజమాని–దాసుడు’ పదజాలం ఉపమానంలోని సామాజిక సంబంధాన్ని స్పష్టంగా చూపుతుంది. మూలంలోని క్రియాక్రమాన్ని తెలుగులో సహజంగా మార్చినా, ‘ఎదురుచూడకపోవడం’ మరియు ‘తెలియకపోవడం’ మధ్య తేడాను, అలాగే శిక్ష మరియు ἀπίστων గురించిన అర్థసందిగ్ధతను కాపాడాం.
