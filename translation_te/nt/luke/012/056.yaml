id: LUK.12.56
reference: Luke 12:56
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: te
  text: కపటులారా! భూమి, ఆకాశాల కనిపించే తీరును మీరు పరిశీలించి అర్థం చేసుకోగలరు; మరి ఈ సమయాన్ని[a] మీరు ఎలా అర్థం చేసుకోలేకపోతున్నారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ కాలాన్ని,” “ఈ కీలక సమయాన్ని,” లేదా “ఈ తగిన సమయాన్ని.” గ్రీకు καιρός సాధారణ కాలాన్ని మాత్రమే కాక, ప్రాముఖ్యమైన లేదా అనుకూలమైన సమయాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: వేషధారులారా
  rationale: ప్రత్యక్ష సంబోధనలోని గద్దింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇక్కడ అక్షరార్థంగా రంగస్థల నటులు అనే భావం కాదు.
- source_word: τὸ πρόσωπον
  choice: కనిపించే తీరు
  rationale: భూమి, ఆకాశాల ‘ముఖం’ అనే గ్రీకు నుడికారానికి ఇక్కడ బాహ్యంగా కనిపించే స్థితి లేదా వాతావరణ సూచనలు అనే భావం ఉంది.
- source_word: τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: భూమి, ఆకాశం
  rationale: వాతావరణ సూచనల సందర్భంలో γῆ–οὐρανός జంటను సహజంగా, విస్తృతార్థంతో అందిస్తుంది.
- source_word: οἴδατε δοκιμάζειν
  choice: గుర్తించగలరు
  rationale: οἴδατε తో infinitive సామర్థ్యాన్ని సూచిస్తుంది; δοκιμάζειν ఇక్కడ కనిపించే సూచనలను పరిశీలించి వాటి భావాన్ని గ్రహించడాన్ని సూచిస్తుంది.
- source_word: τὸν καιρὸν τοῦτον
  choice: ఈ కాలాన్ని
  rationale: τοῦτον అనే నిర్దేశకాన్ని నేరుగా నిలుపుతూ, καιρός సూచించగల ప్రాముఖ్యమైన లేదా తగిన సమయాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: ఎందుకు గుర్తించలేరు?
  rationale: πῶς తో వచ్చిన ఆగ్రహభరిత అలంకార ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ముందటి క్రియాభావ పునరావృతాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: καιρός యొక్క సందర్భార్థం
  choice: ఈ కాలం
  alternative: ఈ సమయం; ఈ నిర్ణాయక సమయం; ఈ అనుకూల సమయం
  rationale: యేసు పరిచర్యలోని ప్రస్తుత క్షణ ప్రాముఖ్యాన్ని సందర్భం సూచించినా, గ్రీకు పాఠం స్పష్టంగా చెప్పినదానికంటే ఎక్కువ సిద్ధాంతార్థాన్ని ప్రధాన అనువాదంలో చేర్చలేదు. ప్రత్యామ్నాయ నుడికారాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా గద్దించే శైలి. ‘వేషధారులారా’ అనే సంబోధన నైతిక కపటత్వాన్ని తెలియజేస్తుంది. వాక్యంలోని సమాంతర నిర్మాణాన్ని సహజ తెలుగు కోసం సంక్షిప్తంగా నిలిపాం.
