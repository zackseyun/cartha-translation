id: LUK.12.23
reference: Luke 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: te
  text: ఎందుకంటే ఆహారం కంటే ప్రాణం[a] గొప్పది; వస్త్రం కంటే శరీరం గొప్పది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జీవితం’; గ్రీకు పదం ψυχή సందర్భానుసారం ‘ప్రాణం,’ ‘జీవితం,’ ‘వ్యక్తి,’ లేదా ‘ఆత్మ’ అని అర్థం కావచ్చు. ఇక్కడి సందర్భం జీవాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి ఆజ్ఞకు కారణాన్ని తెలియజేసే అనుసంధాన పదంగా సహజమైన తెలుగులో అనువదించబడింది.
- source_word: ψυχή
  choice: ప్రాణం
  rationale: తినడం, ఆందోళన, శరీర అవసరాల సందర్భంలో ఇది అభౌతికమైన ‘ఆత్మ’ను ప్రత్యేకంగా కాకుండా జీవాన్ని సూచిస్తుంది; ‘ప్రాణం’ ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πλεῖόν
  choice: గొప్పది
  rationale: ఇక్కడ కేవలం పరిమాణం కాక, ఆహారం లేదా వస్త్రాన్ని మించిన విలువను సూచించే తులనాత్మక భావం ఉంది; ‘గొప్పది’ దానిని సహజంగా నిలుపుతుంది.
- source_word: τροφή
  choice: ఆహారం
  rationale: సందర్భానికి సరిపోయే సాధారణ, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: σῶμα
  choice: శరీరం
  rationale: వస్త్రంతో జతగా ఉన్న భౌతిక దేహానికి ప్రామాణిక తెలుగు సమానం.
- source_word: ἔνδυμα
  choice: వస్త్రం
  rationale: శరీరాన్ని కప్పే దుస్తులను సాధారణ భావంలో సూచించే గౌరవప్రదమైన, సులభమైన పదం.
theological_decisions:
- issue: ఆందోళన మరియు దేవుని పోషణ గురించిన బోధలో ψυχή భావం
  choice: ‘ఆత్మ’కు బదులుగా ‘ప్రాణం’
  alternative: ఆత్మ
  rationale: ψυχή–ఆహారం, శరీరం–వస్త్రం అనే సమాంతర నిర్మాణం ఇక్కడ భూలోక జీవనాన్ని, దాని పోషణను సూచిస్తుంది. అందువల్ల ఈ వాక్యాన్ని అమరమైన ఆత్మ గురించి నేరుగా చేసే ప్రకటనగా మార్చకుండా సందర్భార్థం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరతను నిలుపుతూ రూపకల్పన చేయబడింది. గ్రీకు వాక్యంలోని రెండు సమాంతర తులనలలోనూ ‘గొప్పది’ని స్పష్టంగా ఉంచాం.
