translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలో లేని ‘చూసినప్పుడు’ వంటి భావాన్ని చేర్చలేదు. వాతావరణ సందర్భానికి అవసరమైనంత మాత్రమే ‘దక్షిణ గాలి’ అని స్పష్టం చేయబడింది.
