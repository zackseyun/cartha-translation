review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents νότον πνέοντα as “దక్షిణ గాలి వీస్తున్నప్పుడు,” preserves the customary force of λέγετε (“మీరు అంటారు”), and conveys the predicted and realized weather condition. No unsupported perception verb is added.
  naturalness: “తీవ్రమైన వేడి” is understandable but somewhat formal and less idiomatic for the oppressive heat denoted by Καύσων. “మండే వేడి” is more natural in modern Telugu. “అదే జరుగుతుంది” is also smoother than “అలాగే జరుగుతుంది” for the prediction’s fulfillment.
  terminology: “దక్షిణ గాలి” is contextually precise. “మండే వేడి” communicates scorching heat without importing the modern-specific idea of a heat wave.
  issues:
  - severity: low
    issue: The expression “తీవ్రమైన వేడి” is less vivid and less idiomatic than the source’s sense of scorching heat.
    rationale: Καύσων denotes burning or oppressive heat; “మండే వేడి” conveys this naturally in modern standard Telugu.
  - severity: low
    issue: “అలాగే జరుగుతుంది” is slightly stiff in this context.
    rationale: “అదే జరుగుతుంది” naturally states that the stated prediction comes about and retains the concise force of γίνεται.
  revised_text: దక్షిణ గాలి వీస్తున్నప్పుడు, ‘మండే వేడి ఉంటుంది’ అని మీరు అంటారు; అదే జరుగుతుంది.
