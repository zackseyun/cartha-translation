  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: te
  text: దక్షిణ గాలి వీస్తున్నప్పుడు, ‘మండే వేడి ఉంటుంది’ అని మీరు అంటారు; అదే జరుగుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νότον
  choice: దక్షిణ గాలి
  rationale: ఈ పదానికి అక్షరార్థంగా ‘దక్షిణం’ లేదా సందర్భానుసారంగా ‘దక్షిణ గాలి’ అనే అర్థాలు ఉన్నాయి. πνέοντα (‘వీస్తున్న’)తో కలిసి వాతావరణ సందర్భంలో ఉన్నందున ‘దక్షిణ గాలి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: πνέοντα
  choice: వీస్తున్నప్పుడు
  rationale: వర్తమాన కృదంతం గాలి అప్పుడే వీస్తున్న స్థితిని తెలియజేస్తుంది. కాలార్థక ὅτανతో కలిసి తెలుగులో ‘వీస్తున్నప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: λέγετε
  choice: మీరు అంటారు
  rationale: ఇది ప్రజలు అలవాటుగా చేసే వాతావరణ అంచనాను సూచించే సాధారణ వర్తమాన రూపం; ‘మీరు అంటారు’ ఆ ప్రయోగాన్ని సహజంగా నిలుపుతుంది.
- source_word: Καύσων
  choice: తీవ్రమైన వేడి
  rationale: ఇది సాధారణ వేడికన్నా మండించే, భరించలేని వేడిని సూచిస్తుంది. ‘తీవ్రమైన వేడి’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, మూలంలోని తీవ్రతను తెలియజేస్తుంది.
- source_word: ἔσται
  choice: ఉంటుంది
  rationale: రాబోయే వాతావరణ పరిస్థితిని తెలుగులో సహజంగా ‘వేడి ఉంటుంది’ అని వ్యక్తం చేస్తారు.
- source_word: γίνεται
  choice: అలాగే జరుగుతుంది
  rationale: వారు చెప్పిన అంచనా నిజమవుతుందని ఈ క్రియ సూచిస్తుంది. ‘అలాగే’ అనేది ముందటి మాటతో సంబంధాన్ని స్పష్టపరుస్తుంది; ‘జరుగుతుంది’ మూలంలోని సాధారణ నెరవేర్పు భావాన్ని నిలుపుతుంది.
