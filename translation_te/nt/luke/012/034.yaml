id: LUK.12.34
reference: Luke 12:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: te
  text: ఎందుకంటే మీ ధనం ఎక్కడ ఉందో, అక్కడే మీ హృదయం కూడా ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ ధనం ఎక్కడ ఉన్నా, అక్కడే మీ హృదయం కూడా ఉంటుంది.”
    reason: ὅπουను ‘ఎక్కడైనా/ఎక్కడ ఉన్నా’ అనే విస్తృత స్థానార్థంతో (‘wherever’) అనువదించగల ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ὅπου
  choice: ఎక్కడ
  rationale: స్థానాన్ని సూచించే ఉపవాక్యాన్ని సహజంగా పరిచయం చేస్తుంది; ἐκεῖతో కలిసి ‘ఎక్కడ... అక్కడే...’ అనే గ్రీకు పరస్పర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందరి ఉపదేశానికి ఈ సామెతసదృశ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: θησαυρός
  choice: ధనం
  rationale: సందర్భంలోని భౌతిక సంపద భావాన్నీ, మనిషి విలువైనదిగా భావించేదాని విస్తృత భావాన్నీ సహజ తెలుగులో మోయగల పదం.
- source_word: καρδία
  choice: హృదయం
  rationale: అభిలాషలు, అనురాగాలు, నిబద్ధతలు, అంతరంగ దిశకు కేంద్రం అనే బైబిలు భావాన్ని ఒకే అంశానికి కుదించకుండా కాపాడుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడే
  rationale: ‘ఎక్కడ... అక్కడే...’ అనే సహసంబంధ నిర్మాణాన్ని నిలుపుతూ, ధనం ఉన్న స్థలానికే హృదయం అనుసంధానమవుతుందనే నొక్కును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ధనం ఉన్న చోట హృదయం సైతం ఉంటుందనే సంకలన భావాన్ని తెలుపుతుంది.
- source_word: ἔσται
  choice: ఉంటుంది
  rationale: గ్రీకులోని భవిష్యత్ రూపాన్ని తెలుగులో సహజమైన భవిష్యత్/సామెతసదృశ నిశ్చయార్థక రూపంతో కాపాడుతుంది.
- source_word: ὑμῶν
  choice: మీ
  rationale: రెండు చోట్లా ఉన్న ద్వితీయ పురుష బహువచన స్వామ్యార్థాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘హృదయం’ అనే మానవ అంతరంగ సంబంధ పదం యొక్క భావం
  choice: అభిలాషలు, అనురాగాలు, నిబద్ధతలు, అంతరంగ దిశకు కేంద్రాన్ని సూచించే బైబిలు పదంగా ‘హృదయం’ను నిలుపడం.
  alternative: ‘కోరికలు’, ‘మనస్సు’ లేదా ‘అంతరంగం’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: విలువైనదిగా భావించిన దానిని మనిషి అంతరంగ దిశ అనుసరిస్తుందని వాక్యం సామెతసదృశంగా చెబుతుంది. ‘హృదయం’ అనడం భావాన్ని ఒక్క మానసిక అంశానికి పరిమితం చేయకుండా సాహిత్య, ధార్మిక నిరంతరతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గౌరవప్రదమైన సామెతసదృశ శైలి. ‘ఎక్కడ... అక్కడే...’ నిర్మాణం మూలంలోని సమతుల్యతను నిలుపుతుంది.
