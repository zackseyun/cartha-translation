translation:
  language: te
  text: కాని ఆయన రాజ్యాన్ని[a][b] వెదకండి; ఈ విషయాలు మీకు అదనంగా ఇవ్వబడతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని రాజ్యాన్ని’; గ్రీకులో ‘ఆయన రాజ్యాన్ని’ అని ఉంది; ‘ఆయన’ ఎవరనేది సందర్భం తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో ‘ఆయన రాజ్యాన్ని’కు బదులుగా ‘దేవుని రాజ్యాన్ని’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: మునుపటి వచనాల్లో భౌతిక అవసరాల గురించి ఆందోళనతో వెదకడానికీ, ఇక్కడ చెప్పిన రాజ్యాన్వేషణకీ మధ్య వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ζητεῖτε
  choice: వెదకండి
  rationale: వర్తమాన ఆజ్ఞారూపం సూచించే నిరంతర దిశను సందర్భంలో మోయగల సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: τὴν βασιλείαν
  choice: రాజ్యాన్ని
  rationale: దేవుని పాలన, రాజ్య పరిధి అనే రెండింటినీ కలిగి ఉండగల పద విస్తృతిని కాపాడే సుపరిచితమైన అనువాదం.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: గ్రీకు సర్వనామ రూపాన్ని నిలుపుతూ, సందర్భంలో అది దేవుణ్ణి సూచిస్తుందని పాఠకుడు గ్రహించగలిగేలా చేస్తుంది.
- source_word: ταῦτα
  choice: ఇవి
  rationale: ముందు ప్రస్తావించిన జీవనావసరాలను సూచిస్తుంది; మత్తయి సమాంతరంలోని ‘అన్నీ’ అనే భావాన్ని లూకా పాఠంలోకి చేర్చదు.
- source_word: προστεθήσεται
  choice: అదనంగా ఇవ్వబడతాయి
  rationale: భవిష్యత్ కర్మణి రూపాన్నీ ‘తోడుగా కలపబడటం’ అనే భావాన్నీ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; కార్యనిర్వాహకుడిని మూలపాఠంలాగే ప్రత్యక్షంగా పేర్కొనదు.
- source_word: ὑμῖν
  choice: మీకు
  rationale: గ్రీకు దత్తి విభక్తికి సహజమైన, నేరమైన తెలుగు సమానం.
theological_decisions:
- issue: αὐτοῦ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: సందర్భంలో దేవుణ్ణి సూచించే ‘ఆయన రాజ్యం’
  alternative: ‘దేవుని రాజ్యం’ అని స్పష్టంగా అనువదించడం
  rationale: తక్షణ సందర్భంలో తండ్రి మరియు దేవుని సంరక్షణ ప్రస్తావించబడినందున సూచన స్పష్టమే; అయినా మూలంలోని సర్వనామాన్ని అనవసరంగా నామవాచకంగా మార్చకుండా నిలుపుతుంది.
- issue: ప్రతుల మధ్య రాజ్య పదబంధ భేదం
  choice: SBLGNT ప్రధాన పాఠం ప్రకారం ‘ఆయన రాజ్యం’
  alternative: కొన్ని ప్రతుల ప్రకారం ‘దేవుని రాజ్యం’
  rationale: ఎంచుకున్న విమర్శాత్మక మూలపాఠాన్ని ప్రధాన అనువాదంలో అనుసరించి, నిజమైన పాఠభేదాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఆయన’ ద్వారా మూలంలోని సర్వనామ అస్పష్టతను నిలిపి, పాఠభేదం మరియు సందర్భస్పష్టీకరణను వేర్వేరు పాదటిప్పణుల్లో ఇచ్చాం.
