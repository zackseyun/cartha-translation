  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: te
  text: తనకోసం ధనం కూడబెట్టుకునేవాడు, దేవుని యెడల ధనవంతుడు కానివాడు ఇలాగే ఉంటాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని దృష్టిలో ధనవంతుడు కానివాడు.”
    reason: εἰς θεόν అనే పదబంధానికి సాధ్యమైన సంబంధ/మూల్యాంకన ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: οὕτως
  choice: ఇలాగే ఉంటాడు
  rationale: ముందున్న ఉపమానంలోని ధనవంతుని గతి ఇప్పుడు అలాంటి ప్రతి వ్యక్తికీ వర్తిస్తుందని సూచిస్తుంది; తెలుగులో సహజమైన అన్వయ వాక్యంగా ఇచ్చాం.
- source_word: ὁ θησαυρίζων
  choice: ధనం కూడబెట్టుకుంటూ ... వాడు
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం అలవాటుగా ఈ పని చేసే వ్యక్తిని సూచిస్తుంది. ‘ధనం కూడబెట్టుకోవడం’ నిల్వచేసే, పోగుచేసే భావాన్ని నిలుపుతుంది.
- source_word: ἑαυτῷ
  choice: తనకోసం
  rationale: దత్తివిభక్తిలోని ఆత్మవాచక సర్వనామం స్వప్రయోజన దిశను నేరుగా తెలియజేస్తుంది.
- source_word: καὶ μὴ
  choice: '... కానివాడు'
  rationale: రెండవ కృదంతాన్ని మొదటిదానితో సమన్వయపరుస్తూ, గ్రీకులోని నిరాకరణను సహజమైన తెలుగు నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: εἰς θεὸν
  choice: దేవుని విషయంగా
  rationale: εἰς ఇక్కడ దేవుని వైపు ఉన్న సంబంధం లేదా దిశను సూచిస్తుంది. ‘దేవుని విషయంగా’ ఆ సంబంధార్థాన్ని వివరణతో కుదించకుండా నిలుపుతుంది.
- source_word: πλουτῶν
  choice: ధనవంతుడు
  rationale: ‘సంపన్నుడై ఉండడం’ అనే కృదంత భావాన్ని తెలుగులో సహజమైన విధేయ నామవాచకంతో తెలిపింది; భౌతిక ధనం కూడబెట్టడానికున్న వ్యత్యాసమూ నిలుస్తుంది.
theological_decisions:
- issue: నైతిక సూక్తిలో ప్రతినిధి ఏకవచనం
  choice: వాడు
  alternative: వ్యక్తి
  rationale: గ్రీకు పాఠంలోని ఏకవచన వ్యక్తి సూచనను నిలుపుతూ, ఇది పురుషులకు మాత్రమే వర్తిస్తుందని అనవసరంగా చెప్పకుండా తెలుగులో సాధారణ ప్రతినిధి రూపాన్ని వాడాం.
- issue: ‘దేవుని విషయంగా ధనవంతుడు’ అనే మాట అర్థం
  choice: సంబంధార్థక పదబంధాన్ని యథాతథంగా నిలుపడం
  alternative: దేవుని దృష్టిలో ధనవంతుడు
  rationale: ఈ వచనం ఆ సంపద ఏమిటో స్పష్టంగా నిర్వచించదు. అందువల్ల ‘దేవునికి ప్రీతికరమైన విషయాల్లో ధనవంతుడు’ వంటి వివరణాత్మక విస్తరణను చేర్చలేదు; ‘దేవుని దృష్టిలో’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి. మూలంలోని సంక్షిప్త అన్వయ స్వభావం మరియు ‘దేవుని విషయంగా ధనవంతుడు’ అనే ఉద్దేశపూర్వక భావవిస్తృతిని కాపాడాం.
