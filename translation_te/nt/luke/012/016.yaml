translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని స్వల్ప సంధానం, ఉపమాన పరిచయం, భూమి సమృద్ధిగా ఫలించిన భావం నిలుపబడ్డాయి.
