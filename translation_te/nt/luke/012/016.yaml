  edition: SBLGNT
  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: te
  text: 'అప్పుడు ఆయన వారికి ఒక ఉపమానం చెప్పాడు: “ఒక ధనవంతుని భూమి సమృద్ధిగా పంట ఇచ్చింది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: అప్పుడు ఆయన ... అన్నాడు
  rationale: δέ ఇక్కడ స్వల్ప కథన సంధానాన్ని సూచిస్తుంది. ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా ఉంది; బలమైన వ్యత్యాసాన్ని సూచించదు.
- source_word: παραβολὴν
  choice: ఒక ఉపమానం
  rationale: సువార్తల్లో παραβολήకు స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం ‘ఉపమానం’; ఇది సాధారణ ఉదాహరణకన్నా ఈ ప్రత్యేక బోధనా కథారూపాన్ని కాపాడుతుంది.
- source_word: πρὸς αὐτοὺς
  choice: వారితో
  rationale: ఆయన ఆ మాటలను వారికి ఉద్దేశించి చెప్పాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λέγων
  choice: చెబుతూ ఇలా
  rationale: ఈ వర్తమాన కృదంతం ఉపమానంలోని మాటలను పరిచయం చేస్తుంది. ‘చెబుతూ ఇలా అన్నాడు’ మూల వాక్య నిర్మాణాన్ని స్పష్టమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: ఒక ధనవంతుని
  rationale: τινός‌ను అనిర్దిష్ట ‘ఒక’తో సహజంగా ప్రతిబింబిస్తూ, పురుష ఏకవచన సూచనను మరియు భూమితోనున్న స్వామ్య సంబంధాన్ని నిలుపుతుంది.
- source_word: εὐφόρησεν
  choice: సమృద్ధిగా పండింది
  rationale: εὐφορέω భూమి విస్తారంగా పంటనివ్వడాన్ని సూచిస్తుంది. ‘సమృద్ధిగా పండింది’ వ్యవసాయ సందర్భంలో సహజమైన, స్పష్టమైన ఆధునిక తెలుగు.
- source_word: ἡ χώρα
  choice: భూమి
  rationale: ఇక్కడ χώρα దేశాన్ని కాక ధనవంతునికి చెందిన సాగుభూమిని సూచిస్తుంది. ‘భూమి’ విస్తృతిని అనవసరంగా ‘పొలం’కు పరిమితం చేయకుండా వ్యవసాయ భావాన్ని అందిస్తుంది.
