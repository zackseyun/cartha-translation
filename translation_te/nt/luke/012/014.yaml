id: LUK.12.14
reference: Luke 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: te
  text: అయితే ఆయన అతనితో, “మనిషీ, మీపై నన్ను న్యాయాధిపతిగా గాని పంచేవాడిగా గాని ఎవరు నియమించారు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: మనిషీ
  rationale: నేరుగా సంబోధించే గ్రీకు పదంలోని కొంత గంభీరమైన, దూరం ఉంచే స్వరాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: κριτήν
  choice: న్యాయాధిపతిగా
  rationale: వివాదంపై తీర్పు చెప్పే అధికారిని సూచించే మూలార్థాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: μεριστήν
  choice: ఆస్తి పంచేవాడిగా
  rationale: సందర్భంలో వారసత్వ ఆస్తిని పంచే వ్యక్తిని సూచిస్తుంది; సాధారణమైన ‘పంచేవాడు’ కంటే తెలుగులో ఉద్దేశం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐφ’ ὑμᾶς
  choice: మీ మీద
  rationale: బహువచనమైన ὑμᾶςను నిలుపుతూ, ఇద్దరి వ్యవహారంపై అధికార నియామకం అనే భావాన్ని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యేసు మాటను న్యాయవిచారణకు సంపూర్ణ నిరాకరణగా విస్తరించే అవకాశం
  choice: ప్రశ్నలో ఉన్న నిర్దిష్ట వివాదంపై తనను ఎవరు నియమించారనే మూల వాక్యాన్నే ఉంచడం
  alternative: ‘ఇలాంటి విషయాలకు నేను న్యాయాధిపతిని కాను’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలపాఠం అలాంటి సాధారణ సిద్ధాంత ప్రకటన చేయదు; దాని అలంకారిక ప్రశ్నలోని ఉద్వేగం మరియు పరిమితిని కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘మనిషీ’ అనే సంబోధన మూలంలోని నేరుదనాన్ని నిలుపుతుంది. ‘ఆస్తి’ అనేది సందర్భస్పష్టత కోసం చేర్చబడింది; μεριστής స్వతహాగా పంచేవాడిని సూచించినా, ముందరి వచనంలోని వారసత్వ వివాదమే ఇక్కడ ఉద్దేశం.
