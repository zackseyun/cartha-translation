revisions:
- from: ఎందుకంటే, మీరు ఏమి చెప్పాలో ఆ క్షణంలోనే పరిశుద్ధాత్మ మీకు బోధిస్తాడు.[a]
  to: ఎందుకంటే పరిశుద్ధాత్మ ఆ క్షణంలోనే మీరు ఏమి చెప్పవలసి ఉందో మీకు బోధిస్తాడు.[a]
  rationale: The revision explicitly retains δεῖ’s necessity while preserving the plural audience through “మీరు” and the natural Telugu indirect-object construction “మీకు బోధిస్తాడు.” The timing phrase continues to express the intensifying force of αὐτῇ. The footnote supplies natural Telugu alternatives for the temporal expression and explains its emphasis without adding meaning to the verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, the Holy Spirit as the active subject, the future sense of διδάξει, and the emphatic timing of ἐν αὐτῇ τῇ ὥρᾳ. However, “ఏమి చెప్పాలో” can state merely what one should say and does not adequately retain the necessity expressed by δεῖ. “చెప్పవలసి ఉందో” preserves that element naturally.
  naturalness: The sentence is clear modern standard Telugu. Removing the comma after “ఎందుకంటే” is more natural in this construction. The revised wording remains direct and dignified.
  terminology: “పరిశుద్ధాత్మ” and the masculine singular verb “బోధిస్తాడు” are standard and appropriate. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: The necessity conveyed by δεῖ is underrepresented.
    rationale: “ఏమి చెప్పాలో” is idiomatic, but it can mean simply “what to say.” The Greek explicitly conveys what is necessary/must be said; “ఏమి చెప్పవలసి ఉందో” retains this meaning without undue heaviness.
  - severity: low
    issue: The introductory punctuation is slightly unnatural.
    rationale: A comma immediately after “ఎందుకంటే” unnecessarily separates the causal connective from its clause in modern Telugu.
  revised_text: ఎందుకంటే పరిశుద్ధాత్మ ఆ క్షణంలోనే మీరు ఏమి చెప్పవలసి ఉందో మీకు బోధిస్తాడు.[a]
