id: LUK.12.12
reference: Luke 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: te
  text: ఎందుకంటే పరిశుద్ధాత్మ ఆ క్షణంలోనే మీరు ఏమి చెప్పవలసి ఉందో మీకు బోధిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ సమయంలో” లేదా “ఆ సమయాన.” గ్రీకు పదబంధం అవసరమైన సరిగ్గా అదే సమయాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న హామీకి ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: τὸ ἅγιον πνεῦμα
  choice: పరిశుద్ధాత్మ
  rationale: దైవిక ఆత్మను సూచించే నిర్దిష్ట పదబంధానికి ప్రామాణికమైన, సమకాలీన తెలుగు రూపం.
- source_word: διδάξει
  choice: బోధిస్తాడు
  rationale: భవిష్యత్ కాలంలోని క్రియను నేరుగా వ్యక్తపరుస్తూ, అవసరమైన మాటలను నేర్పుతాడనే వాగ్దానాన్ని నిలుపుతుంది.
- source_word: ὑμᾶς
  choice: మీకు
  rationale: రెండవ పురుష బహువచనాన్ని సందర్భానుగుణంగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: ఆ క్షణంలోనే
  rationale: αὐτῇ ఇచ్చే నిర్దిష్ట సమయ ప్రాధాన్యాన్ని ‘లోనే’ ద్వారా చూపించి, అవసరం వచ్చిన సరిగ్గా అదే సమయంలో అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἃ δεῖ εἰπεῖν
  choice: ఏమి చెప్పాలో
  rationale: తెలుగులో సహజమైన పరోక్ష ప్రశ్న నిర్మాణం; δεῖ సూచించే అవసరాన్ని ‘చెప్పాలో’ అనే సందర్భోచిత రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: ‘పరిశుద్ధాత్మ’ యొక్క పాత్ర
  choice: శిష్యులకు ఏమి చెప్పాలో క్రియాశీలంగా బోధించే వ్యక్తిగత దైవిక కర్త
  alternative: వ్యక్తిత్వరహితమైన దైవిక ప్రభావం లేదా ప్రేరణ
  rationale: ‘బోధిస్తాడు’ అనే భవిష్యత్ కర్తరి క్రియకు పరిశుద్ధాత్మ కర్తగా ఉండడం వ్యక్తిగత కర్తృత్వాన్ని సూచిస్తుంది; అయితే ఈ వాక్యానికి మించిన తరువాతి సిద్ధాంత వివరణలను అనువాదంలో చేర్చలేదు.
- issue: δεῖ లోని అవసర భావం
  choice: ‘ఏమి చెప్పాలో’ అనే సహజ తెలుగు నిర్మాణంలో సందర్భానుగుణ అవసరాన్ని వ్యక్తపరచడం
  alternative: ‘ఏమి తప్పక చెప్పవలసి ఉందో’ అని అవసరాన్ని మరింత స్పష్టంగా విస్తరించడం
  rationale: గ్రీకు పదం అవసరాన్ని సూచించినప్పటికీ, తెలుగులో విస్తృత రూపం భారంగా ఉంటుంది; ‘ఏమి చెప్పాలో’ న్యాయసాక్ష్య సందర్భంలో చేయవలసిన మాటను సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి. ‘ఆ క్షణంలోనే’ తక్షణ సహాయాన్ని సహజంగా తెలియజేస్తుంది; ‘ఆ గడియలోనే’ అనే మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
