id: LUK.12.15
reference: Luke 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “జాగ్రత్తగా ఉండండి; అన్నిరకాల దురాశ నుండి[a] మిమ్మల్ని మీరు కాపాడుకోండి. ఎందుకంటే, ఒక వ్యక్తికి ఆస్తులు సమృద్ధిగా ఉన్నప్పటికీ, అతని జీవితం వాటి సమృద్ధిపై ఆధారపడి ఉండదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “అన్నిరకాల లోభం నుండి.” ఇక్కడి గ్రీకు పదం దురాశను, లోభాన్ని, మరింత సంపాదించాలనే అత్యాశను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: జాగ్రత్తగా ఉండండి
  rationale: హెచ్చరిక భావంతో ఉన్న బహువచన ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: φυλάσσεσθε
  choice: మిమ్మల్ని మీరు కాపాడుకోండి
  rationale: మధ్యమప్రయోగంలోని స్వీయ రక్షణ భావాన్ని స్పష్టంగా నిలుపుతుంది; ముందున్న హెచ్చరిక ఆజ్ఞతో ఉన్న పునరుక్తి బలాన్ని కూడా కాపాడుతుంది.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: అన్నిరకాల దురాశనుండి
  rationale: πάσης యొక్క సమగ్రతను ‘అన్నిరకాల’ తెలియజేస్తుంది; πλεονεξίαలోని అత్యాశ, లోభం, మరింత కూడబెట్టాలనే స్వార్థపూరిత కోరిక అనే విస్తృత భావానికి ‘దురాశ’ సహజమైన పదం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: హెచ్చరికకు కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: ఒక వ్యక్తికి ఆస్తులు సమృద్ధిగా ఉన్నా, అతని జీవితం ... కలిగేది కాదు
  rationale: సమృద్ధి జీవానికి ఆధారం లేదా మూలం కాదనే గ్రీకు నిర్మాణ భావాన్ని సహజమైన తెలుగు వాక్యరూపంలో అందిస్తుంది.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: అతనికున్న వాటివల్ల
  rationale: ఒకరికి చెందిన వస్తువులు లేదా ఆస్తులను సూచించే ὑπάρχοντα భావాన్ని కాపాడుతూ, ἐκ యొక్క మూలం/ఆధారం భావాన్ని ‘వల్ల’ ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఏకవచన పుంలింగ రూపంలోని సాధారణ మానవ సూచన
  choice: ఒక వ్యక్తికి ... అతని జీవితం
  alternative: మనిషి జీవితం ... తనకున్నవి
  rationale: గ్రీకులోని ఏకవచన నిర్మాణాన్ని నిలుపుతూ, బోధ పురుషులకు మాత్రమే పరిమితం కాదని ‘ఒక వ్యక్తి’ స్పష్టం చేస్తుంది.
- issue: πλεονεξία హెచ్చరిక యొక్క పరిధి
  choice: అన్నిరకాల దురాశ
  alternative: సమస్త లోభం
  rationale: ఇది ఇతరుల సొత్తును ఆశించడానికే పరిమితమైన న్యాయార్థం కాదు; సంపాదించాలి, కూడబెట్టాలి అనే విస్తృత స్వార్థపూరిత కోరికను సూచిస్తుంది. ‘దురాశ’ ఆ విస్తృత నైతిక భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- issue: జీవితం మరియు ఆస్తుల సమృద్ధి మధ్య సంబంధం
  choice: అతని జీవితం అతనికున్న వాటివల్ల కలిగేది కాదు
  alternative: అతని జీవితం అతని ఆస్తుల సమృద్ధిలో లేదు
  rationale: జీవితం ఆస్తుల నుండి ఉద్భవించదు లేదా వాటితో ఏర్పడదు అనే భావాన్ని తెలుగులో అర్థవంతంగా చెబుతుంది; జీవితం అనే పదాన్ని కేవలం జీవన ప్రమాణం లేదా సుఖజీవితం అని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన హెచ్చరిక శైలి వాడబడింది. ‘జాగ్రత్తగా ఉండండి’ మరియు ‘మిమ్మల్ని మీరు కాపాడుకోండి’ అనే రెండు ఆజ్ఞలను విడిగా ఉంచి మూలంలోని ఉద్ఘాటనను నిలిపాం.
