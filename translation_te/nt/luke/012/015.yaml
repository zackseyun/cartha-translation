- from: 'ఆయన వారితో ఇలా అన్నాడు: “జాగ్రత్తగా ఉండండి; అన్నిరకాల దురాశనుండి[a] మిమ్మల్ని మీరు కాపాడుకోండి. ఎందుకంటే, ఒక వ్యక్తికి ఆస్తులు సమృద్ధిగా ఉన్నా, అతని జీవితం అతనికున్న వాటివల్ల కలిగేది కాదు.”'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “జాగ్రత్తగా ఉండండి; అన్నిరకాల దురాశ నుండి[a] మిమ్మల్ని మీరు కాపాడుకోండి. ఎందుకంటే, ఒక వ్యక్తికి ఆస్తులు సమృద్ధిగా ఉన్నప్పటికీ, అతని జీవితం వాటి సమృద్ధిపై ఆధారపడి ఉండదు.”'
  rationale: 'The revision preserves the paired warning imperatives, the generic singular reference, and the broad scope of πλεονεξία. It corrects the last clause so that it expresses the source text’s point: abundant possessions do not constitute or determine a person’s life.'
