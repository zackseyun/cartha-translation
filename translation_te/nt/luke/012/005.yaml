id: LUK.12.5
reference: Luke 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: te
  text: 'అయితే, ఎవరికి భయపడాలో నేను మీకు చూపిస్తాను: చంపిన తరువాత గెహెన్నాలో[a] పడవేయడానికి అధికారం ఉన్న వ్యక్తికి భయపడండి. అవును, నేను మీకు చెబుతున్నాను, ఆ వ్యక్తికే భయపడండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నరకం.” గ్రీకు పదం ‘గెహెన్నా’; ఇది హిన్నోము లోయతో సంబంధమైన చిత్రణలో మూలాలున్న తీర్పుకు సంబంధించిన పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: నేను మీకు చూపిస్తాను
  rationale: భవిష్యత్ కాల క్రియగా, ఎవరికి భయపడాలో యేసు స్పష్టంగా సూచించబోతున్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τίνα φοβηθῆτε
  choice: ఎవరికి భయపడాలో
  rationale: పరోక్ష ప్రశ్నను తెలుగులో సహజంగా వ్యక్తపరుస్తూ, ‘భయపడాలి’ అనే గంభీరమైన భావాన్ని నిలుపుతుంది.
- source_word: φοβήθητε
  choice: భయపడండి
  rationale: ఆజ్ఞార్థక రూపాన్ని, అలాగే వాక్యంలో రెండుసార్లు వచ్చే పదసామ్యాన్ని కాపాడుతుంది; ‘భక్తి చూపండి’ అనడం హెచ్చరిక తీవ్రతను తగ్గిస్తుంది.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: చంపిన తరువాత
  rationale: గ్రీకు వాక్యంలోని కాలక్రమాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది; మూలంలోలాగే చంపబడే కర్మను పేర్కొనదు.
- source_word: ἔχοντα ἐξουσίαν
  choice: అధికారం గలవారికి
  rationale: ἐξουσία కేవలం శక్తిని కాక అధికారాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా సంబంధార్థక రూపం వాడబడింది.
- source_word: ἐμβαλεῖν εἰς
  choice: పడవేయడానికి
  rationale: బలవంతంగా లోపలికి వేయడం అనే క్రియాభావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: γέενναν
  choice: గెహెన్నా
  rationale: తరువాతి కాలపు ‘నరకం’ భావనలన్నిటినీ మూలపదంలోకి చేర్చకుండా, యూదుల తీర్పు-ప్రతీక నేపథ్యమున్న గ్రీకు పదాన్ని లిప్యంతరీకరించింది.
- source_word: ναί
  choice: అవును
  rationale: నిశ్చయార్థక ఉద్ఘాటనను సరళంగా, బలంగా నిలుపుతుంది.
- source_word: τοῦτον
  choice: ఆయనకే
  rationale: తెలుగులో గౌరవప్రదమైన ఏకవచన సర్వనామంతో, ‘కే’ ద్వారా గ్రీకు నిర్దేశక సర్వనామంలోని ప్రత్యేక ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలో γέεννα పదం అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: మూల గ్రీకు పదానికి ప్రాధాన్యమిస్తూ దాని యూదు చారిత్రక-ప్రతీకాత్మక నేపథ్యాన్ని నిలుపుతుంది. ‘నరకం’ అనే విస్తృతమైన వేదాంతార్థాన్ని ప్రధాన పాఠ్యంలో ముందుగానే నిర్ధారించకుండా, పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- issue: భయపడవలసిన వ్యక్తి గుర్తింపు
  choice: మూలంలో పేరు చెప్పనట్లే ‘అధికారం గలవారు/ఆయన’ అని ఉంచడం
  alternative: ‘దేవునికి భయపడండి’ అని స్పష్టీకరించడం
  rationale: సందర్భం దేవునివైపు బలంగా సూచించినా, ఈ వాక్యం స్వయంగా ఆయనను పేరుతో పేర్కొనదు. అందువల్ల మూలంలోని పరోక్షతను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన హెచ్చరిక స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం వాడబడింది. గౌరవ ఏకవచనం సందర్భానికి తగినదిగా ఉపయోగించబడింది.
