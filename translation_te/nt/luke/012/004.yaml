  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: te
  text: 'అయితే, నా స్నేహితులైన మీతో నేను చెబుతున్నాను: శరీరాన్ని చంపి, ఆ తర్వాత ఇంకేమీ చేయలేనివారికి భయపడకండి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: అయితే ... నేను చెప్పేది ఇదే
  rationale: δέ ఇక్కడ స్వల్పమైన సంధి లేదా భావమార్పును సూచిస్తుంది. ‘అయితే’ దాన్ని అతిగా విరోధార్థకంగా చేయకుండా సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: నా స్నేహితులైన మీతో
  rationale: ద్వితీయ దత్తివ విభక్తి పదబంధం వివరణాత్మకంగా ఉండి, యేసు శ్రోతలను ‘నా స్నేహితులు’ అని ఆప్యాయంగా సంబోధిస్తున్న భావాన్ని నిలుపుతుంది.
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: చంపి ... ఏమీ చేయలేనివారికి భయపడకండి
  rationale: μή తో కూడిన క్రియ నిషేధాన్ని వ్యక్తం చేస్తుంది; ἀπό భయానికి గురిచేసే వ్యక్తులను సూచిస్తుంది. తెలుగులో ‘వారికి భయపడకండి’ సహజమైన ప్రయోగం.
- source_word: τὸ σῶμα
  choice: శరీరాన్ని
  rationale: ఇక్కడ σῶμα భౌతిక శరీరాన్ని సూచిస్తుంది; మూలంలో లేని ‘ఆత్మ’ అనే భావాన్ని వాక్యంలో చేర్చలేదు.
- source_word: καὶ μετὰ ταῦτα
  choice: ఆ తర్వాత
  rationale: ఇది శరీరాన్ని చంపిన తరువాతి కాలక్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: అంతకంటే ఎక్కువగా ఏమీ చేయలేనివారు
  rationale: περισσότερόν τι ‘ఇంకేదైనా ఎక్కువగా/అంతకుమించి’ అనే పరిమితిని సూచిస్తుంది. ఈ అనువాదం మానవ హంతకుల అసమర్థతను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: శారీరక మరణం తర్వాత మానవ అధికారపు పరిధి
  choice: మనుషులు శరీరాన్ని చంపగలిగినా, ఆ తర్వాత అంతకంటే ఎక్కువగా ఏమీ చేయలేరని మాత్రమే వాక్యం చెబుతుంది.
  alternative: వారు ఆత్మను చంపలేరని వివరణాత్మకంగా చేర్చడం.
  rationale: తర్వాతి వచనం విస్తృతమైన దైవిక అధికారంతో వ్యత్యాసాన్ని చూపించినా, ఈ వచనంలో ‘ఆత్మ’ స్పష్టంగా లేదు. కాబట్టి మూలపాఠపు పరిమితినీ దాని theological tension‌నూ అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలపాఠంలో ప్రత్యేక పాఠాంతర సూచన అవసరం లేనందున పాదటిప్పణి ఇవ్వలేదు.
