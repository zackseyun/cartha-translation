- from: 'యజమాని వచ్చి మెలకువగా ఉండడం చూసే ఆ దాసులు ధన్యులు! మీతో నిజంగా చెబుతున్నాను: అతడు సేవ చేయడానికి నడుము కట్టుకొని[a], వారిని భోజనానికి కూర్చోబెట్టి[b], వారి దగ్గరికి వచ్చి వారికి సేవ చేస్తాడు.'
  to: 'యజమాని వచ్చి మెలకువగా ఉన్నట్లు కనుగొనే ఆ దాసులు ధన్యులు! నిజంగా నేను మీతో చెబుతున్నాను: అతడు సేవ చేయడానికి తాను నడుము కట్టుకొని[a], వారిని భోజనానికి కూర్చోబెట్టి[b], వారి దగ్గరికి వచ్చి వారికి సేవ చేస్తాడు.'
