id: LUK.12.37
reference: Luke 12:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: te
  text: 'యజమాని వచ్చి మెలకువగా ఉన్నట్లు కనుగొనే ఆ దాసులు ధన్యులు! నిజంగా నేను మీతో చెబుతున్నాను: అతడు సేవ చేయడానికి తాను నడుము కట్టుకొని[a], వారిని భోజనానికి కూర్చోబెట్టి[b], వారి దగ్గరికి వచ్చి వారికి సేవ చేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన నడుము కట్టుకొని”; అంటే సేవ చేయడానికి తన వస్త్రాలను బిగించుకొని సిద్ధపడడం.
    reason: cultural_note
  - marker: b
    text: ఆ కాలంలో ప్రజలు భోజనం చేసేటప్పుడు బల్ల దగ్గర ఆనుకొని పడుకునేవారు. అందుకే అక్షరార్థంగా, “వారిని ఆనుకొని పడుకునేలా చేసి.”
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: దీవెన ప్రకటనలోని గంభీరమైన భావాన్ని నిలుపుతూ, ఆధునిక తెలుగు బైబిలు శైలిలో సహజంగా ఉంది.
- source_word: δοῦλοι
  choice: దాసులు
  rationale: యజమాని–దాసుల గృహసంబంధాన్ని స్పష్టంగా చూపుతుంది; ‘సేవకులు’ కంటే బంధిత సామాజిక స్థితికి దగ్గరగా ఉండి, తెలుగులో గౌరవప్రదమైన గ్రంథశైలిని నిలుపుతుంది.
- source_word: κύριος
  choice: యజమాని
  rationale: ఈ ఉపమానంలోని గృహసందర్భంలో κύριος దాసుల యజమానిని సూచిస్తుంది. ‘ప్రభువు’ అనే సాధ్యమైన ప్రతిధ్వనిని బలవంతంగా ప్రధాన పాఠ్యంలో నిర్ణయించకుండా సందర్భార్థాన్ని ఇస్తుంది.
- source_word: γρηγοροῦντας
  choice: మెలకువగా ఉండడం
  rationale: శారీరకంగా మేల్కొని ఉండడాన్నీ, సిద్ధంగా ఉండడాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: మీతో నిజంగా చెబుతున్నాను
  rationale: సూత్రంలోని గంభీరమైన నిశ్చయోక్తిని ఆధునిక, సహజ తెలుగులో నిలుపుతుంది.
- source_word: περιζώσεται
  choice: సేవ చేయడానికి నడుము కట్టుకొని
  rationale: వస్త్రాన్ని నడుముకు కట్టుకొని పనికి సిద్ధపడే ప్రాచీన ఆచారచిత్రాన్ని, దాని ఉద్దేశంతో సహా స్పష్టంగా అందిస్తుంది.
- source_word: ἀνακλινεῖ αὐτούς
  choice: వారిని భోజనానికి కూర్చోబెట్టి
  rationale: భోజనార్థం ఆనుకొని పడుకునే ప్రాచీన పద్ధతిని ఆధునిక తెలుగు పాఠకునికి సహజంగా అర్థమయ్యేలా తెలుపుతుంది.
- source_word: παρελθὼν
  choice: వారి దగ్గరికి వచ్చి
  rationale: భోజనం వడ్డించేందుకు అతడు వారి వద్దకు కదిలివచ్చే భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: διακονήσει αὐτοῖς
  choice: వారికి సేవ చేస్తాడు
  rationale: ఈ సందర్భంలోని భోజనసేవను నేరుగా తెలియజేస్తూ, అనవసరమైన మతపరమైన ప్రత్యేకార్థాన్ని చేర్చదు.
theological_decisions:
- issue: ఉపమాన సందర్భంలో κύριος పదానికి ప్రభువు/యజమాని అనే ద్వంద్వసాధ్యత
  choice: యజమాని
  alternative: ప్రభువు
  rationale: తక్షణ సందర్భం గృహ యజమాని–దాసుల సంబంధం. అయినా యేసు చెప్పే ఉపమానంలో ‘ప్రభువు’ అనే విస్తృత ప్రతిధ్వని సాధ్యమే; దానిని పాదటిప్పణిలో ఉంచడం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
- issue: δοῦλος పదంలోని సేవ మరియు బంధిత స్థితి
  choice: దాసులు
  alternative: సేవకులు
  rationale: ఉపమానంలో యజమాని ఆధీనంలోని వారి స్థితి స్పష్టంగా ఉంది. ‘దాసులు’ దానిని చూపుతుంది; ‘బానిసలు’ ఆధునిక తెలుగులో కలిగించే అత్యంత నిర్దిష్ట చారిత్రక భావాన్ని అనవసరంగా ముందుకు తేవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ఉపమానంలోని ఆశ్చర్యకరమైన పాత్రమార్పు—యజమానే దాసులకు సేవ చేయడం—స్పష్టంగా నిలుపబడింది. κύριοςకు సందర్భానుసారంగా ‘యజమాని’ ఎంచుకోబడింది; క్రీస్తుసంబంధ ప్రతిధ్వనిని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించలేదు.
