id: LUK.12.17
reference: Luke 12:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: te
  text: 'అతడు తనలో తాను ఇలా అనుకున్నాడు: “నేనేం చేయాలి? ఎందుకంటే నా పంటలను పోగుచేసుకోవడానికి నాకు చోటు లేదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: ఆలోచించుకున్నాడు
  rationale: ఈ సందర్భంలో ఈ క్రియ అంతరంగంలో సాగిన ఆలోచనను, తర్జనభర్జనను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆలోచించుకున్నాడు’ సహజంగా ఉండి ఆ అంతరంగ ప్రక్రియను తెలియజేస్తుంది.
- source_word: ἐν ἑαυτῷ
  choice: తనలో తాను
  rationale: ఇది ఇతరులతో పలికిన మాటలను కాకుండా అతని అంతరంగ ఆలోచనను స్పష్టంగా సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: λέγων
  choice: ఇలా
  rationale: తెలుగులో ‘తనలో తాను ఇలా ఆలోచించుకున్నాడు’ అనే నిర్మాణం, గ్రీకులోని కృదంతం పరిచయం చేసే అంతరంగ వాక్యవిషయాన్ని సహజంగా అందిస్తుంది.
- source_word: Τί ποιήσω
  choice: నేనేం చేయాలి?
  rationale: ఇది deliberative subjunctive భావాన్ని ఆధునిక తెలుగులో సహజమైన స్వీయప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι οὐκ ἔχω ποῦ
  choice: నాకు చోటు లేదే
  rationale: ὅτι ప్రశ్నకు కారణాన్ని పరిచయం చేస్తుంది. ‘లేదే’ అనే రూపం ఆ కారణాన్ని అంతరంగ తర్జనభర్జనలో సహజంగా అనుసంధానిస్తుంది.
- source_word: συνάξω
  choice: పోగుచేసి ఉంచడానికి
  rationale: క్రియ యొక్క ప్రాథమిక ‘కూడబెట్టడం’ భావాన్ని కాపాడుతూ, వ్యవసాయ దిగుబడిని ఒక చోట చేర్చి ఉంచే సందర్భార్థాన్ని స్పష్టం చేస్తుంది; కేవలం ‘నిల్వచేయడం’ అని అనువదించి భావాన్ని మరీ సంకుచితం చేయదు.
- source_word: τοὺς καρπούς μου
  choice: నా పంటను
  rationale: ఇక్కడ καρποί చెట్ల పండ్లను మాత్రమే కాకుండా వ్యవసాయ దిగుబడిని సూచిస్తుంది. ‘పంట’ సాధారణ పాఠకులకు సహజంగా, సందర్భోచితంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన సహజ శైలి వాడబడింది. అంతరంగ సంభాషణ భావాన్ని ‘తనలో తాను’ మరియు ‘లేదే’ ద్వారా నిలిపి ఉంచాం.
