review_pass:
  verdict: revise
  source_fidelity: The draft conveys the inward deliberation and the agricultural sense of καρποί well. However, the causal force of ὅτι is only implicit in the Telugu wording; it should be stated explicitly. The source ends with a question, so the added exclamation should not be retained.
  naturalness: ‘తనలో తాను’ and ‘నేనేం చేయాలి?’ are natural modern standard Telugu. ‘పోగుచేసి ఉంచడానికి’ is understandable, but ‘పోగుచేసుకోవడానికి’ is smoother and retains the sense of gathering together without unnecessarily foregrounding storage.
  terminology: ‘పంటలు’ appropriately represents the plural agricultural καρποί in this context. No theological terminology is involved.
  issues:
  - severity: medium
    issue: The causal conjunction ὅτι is not explicitly represented.
    rationale: 'The Greek gives the reason for the deliberative question: ‘because/since I have nowhere ...’. Telugu should include ‘ఎందుకంటే’ (or an equivalent) to preserve this relationship.'
  - severity: low
    issue: The terminal exclamation changes the source punctuation and tone.
    rationale: The Greek has a question ending; Telugu should preserve the question mark rather than add an exclamation.
  - severity: low
    issue: The lexical-alternative footnote is unnecessary and its wording is less idiomatic than the main rendering.
    rationale: ‘పంటలు’ already communicates the contextual agricultural meaning of καρποί clearly. Removing the nonessential note improves readability without loss of meaning.
  revised_text: 'అతడు తనలో తాను ఇలా అనుకున్నాడు: “నేనేం చేయాలి? ఎందుకంటే నా పంటలను పోగుచేసుకోవడానికి నాకు చోటు లేదు.”'
