  terminology: “మీ తండ్రి,” “అవసరమని,” and the footnote’s “అన్యజనులు” are suitable. The footnote should describe the first alternative as “ప్రజలు/దేశాలు” rather than “దేశాలు/జనాలు,” matching the revised wording and the lexical range more naturally.
