id: LUK.12.30
reference: Luke 12:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: te
  text: ఎందుకంటే, లోకంలోని ప్రజలు[a] వీటన్నిటి కోసం వెదుకుతుంటారు. అయితే ఇవి మీకు అవసరమని మీ తండ్రికి తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లోకంలోని అన్యజనులు.” గ్రీకు పదానికి “ప్రజలు/దేశాలు” లేదా “అన్యజనులు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: వీటన్నిటి కోసం
  rationale: సందర్భంలో ముందుగా పేర్కొన్న ఆహారం, పానీయం వంటి అవసరాలన్నిటినీ సూచిస్తుంది. తెలుగు వాక్యంలో ‘కోసం’తో కలిపి సహజంగా వ్యక్తమవుతుంది.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: లోకంలోని దేశాలవారు
  rationale: ἔθνη అనే పదంలోని ‘దేశాలు/జనాలు’ అనే విస్తృత భావాన్ని నిలుపుతూ, తెలుగులో వ్యక్తులను సూచించే సహజ రూపాన్ని వాడింది. ‘అన్యజనులు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: ἐπιζητοῦσιν
  choice: వెదుకుతుంటారు
  rationale: క్రియ సూచించే నిరంతరమైన, చురుకైన అన్వేషణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘వెంటపడతారు’ అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని రుద్దదు.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: మీ తండ్రి
  rationale: గ్రీకు మూలంలో ఉన్న సంబంధాన్ని నేరుగా నిలుపుతుంది. ఈ వచనంలో లేని ‘పరలోకపు’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: οἶδεν
  choice: తెలుసు
  rationale: రూపరీత్యా పరిపూర్ణ కాలమైనప్పటికీ వర్తమానార్థంలో పనిచేసే οἶδαను సహజంగా అనువదిస్తుంది.
- source_word: χρῄζετε τούτων
  choice: ఇవి మీకు అవసరం
  rationale: అవసరతను స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, τούτων సూచించే వాటిని ‘ఇవి’ అని మళ్లీ స్పష్టంగా పేర్కొంటుంది.
theological_decisions:
- issue: లోక ప్రజల అన్వేషణకు, శిష్యుల తండ్రికి తెలిసిన అవసరాలకు మధ్య వ్యత్యాసం
  choice: ‘లోకంలోని దేశాలవారు’ మరియు ‘మీ తండ్రి’ అనే మాటలను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా ఉంచడం
  alternative: ἔθνηను ‘అన్యజనులు’ అని అనువదించడం లేదా సమాంతర వచనం ఆధారంగా ‘పరలోకపు తండ్రి’ అని చేర్చడం
  rationale: ఈ వచనం లోక ప్రజల నిరంతర అన్వేషణను, శిష్యుల అవసరాలు తండ్రికి తెలుసన్న సంబంధపూర్వక నమ్మకంతో వ్యత్యాసపరుస్తుంది. మూలంలో లేని ఒడంబడిక లేదా పరలోక సంబంధిత పదాలను ప్రధాన పాఠ్యంలో చేర్చకుండా ఆ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఎందుకంటే’ γάρను వ్యక్తం చేస్తుంది; రెండు వాక్యాలుగా విభజించడం ద్వారా వ్యత్యాసం స్పష్టంగా, చదవడానికి సులభంగా ఉంటుంది.
