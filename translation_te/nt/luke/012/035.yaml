revisions:
- from: మీ నడుములు బిగించుకొని ఉండండి; మీ దీపాలు వెలుగుతూ ఉండాలి.[a]
  to: మీ నడుములు బిగించబడి ఉండాలి; మీ దీపాలు మండుతూ ఉండాలి.[a]
  rationale: The revision preserves the Greek’s concrete parallel imagery and its ongoing exhortation. It expresses the perfect passive sense of the girded waists as a maintained state, renders the lamps as continuously burning, and retains the cultural explanation without turning the main text into an interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the two coordinated images of readiness: girded waists and burning lamps. However, its first clause uses an active second-person construction (''బిగించుకొని ఉండండి'') while the Greek presents a resultant, passive state, and it does not parallel the grammatical form of the lamp clause. A revised state-oriented rendering more closely reflects περιεζωσμέναι and καιόμενοι.'
  naturalness: ‘మీ నడుములు బిగించుకొని ఉండండి’ is understandable, but it is syntactically less smooth because ‘నడుములు’ are made to perform ‘బిగించుకొని.’ ‘మీ నడుములు బిగించబడి ఉండాలి’ is clearer modern standard Telugu while retaining the image. ‘మండుతూ’ is especially suitable for the continuing burning of oil lamps.
  terminology: ‘నడుములు’ appropriately represents ὀσφύες without archaic anatomy, and ‘దీపాలు’ precisely represents λύχνοι. The cultural footnote should describe tucking up and fastening long garments, rather than broadly saying that the custom itself is metaphorical.
  issues:
  - severity: medium
    issue: The first clause is not state-oriented and is grammatically uneven with the second clause.
    rationale: περιεζωσμέναι is a perfect passive participle describing waists already girded for readiness. ‘బిగించబడి ఉండాలి’ represents that resultant state and makes both coordinated clauses parallel.
  - severity: low
    issue: The footnote’s alternative and explanation can be more precise and natural.
    rationale: ‘పని చేయడానికి’ narrows the general readiness/action image. The note should explain the concrete practice of gathering up and fastening long clothing.
  revised_text: మీ నడుములు బిగించబడి ఉండాలి; మీ దీపాలు మండుతూ ఉండాలి.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “చర్యకు సిద్ధంగా దుస్తులు ధరించి ఉండండి.” పొడవైన వస్త్రాలను పైకెత్తి నడుము చుట్టూ బిగించుకోవడం సిద్ధతను సూచించే దృశ్యం.
    reason: cultural_note
  revision_rationale: The revision preserves the Greek’s concrete parallel imagery and its ongoing exhortation. It expresses the perfect passive sense of the girded waists as a maintained state, renders the lamps as continuously burning, and retains the cultural explanation without turning the main text into an interpretation.
