  edition: SBLGNT
  text: Ἔστωσαν ὑμῶν αἱ ὀσφύες περιεζωσμέναι καὶ οἱ λύχνοι καιόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/035.yaml
  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: te
  text: మీ నడుములు బిగించబడి ఉండాలి; మీ దీపాలు మండుతూ ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చర్యకు సిద్ధంగా దుస్తులు ధరించి ఉండండి.” పొడవైన వస్త్రాలను పైకెత్తి నడుము చుట్టూ బిగించుకోవడం సిద్ధతను సూచించే దృశ్యం.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: ఉండండి / ఉండాలి
  rationale: వర్తమానకాల తృతీయ పురుష ఆజ్ఞార్థక రూపం కొనసాగుతున్న సిద్ధస్థితిని సూచిస్తుంది. తెలుగులో రెండు సమన్విత భాగాలకు సహజంగా ‘ఉండండి’, ‘ఉండాలి’ అనే నిర్మాణం వాడబడింది.
- source_word: ὑμῶν
  choice: మీ
  rationale: రెండు నామవాచక పదబంధాలతోనూ స్వామ్య సంబంధాన్ని చూపుతుంది; ఆధునిక తెలుగులో ‘మీ’ సహజమైన రూపం.
- source_word: ὀσφύες
  choice: నడుములు
  rationale: నడుము/కటి ప్రాంతాన్ని సూచించే స్పష్టమైన శరీర రూపకాన్ని నిలుపుతుంది; పాతకాలపు లేదా అతిగా శరీరశాస్త్రీయ పదాన్ని నివారిస్తుంది.
- source_word: περιεζωσμέναι
  choice: బిగించుకొని
  rationale: పొడవైన వస్త్రాలను నడుము చుట్టూ కట్టుకొని సిద్ధంగా ఉండే దృశ్యాన్ని నిలుపుతుంది. గ్రీకు పరిపూర్ణ కృదంతంలోని ఏర్పడిన సిద్ధస్థితిని ‘బిగించుకొని ఉండండి’ తెలియజేస్తుంది.
- source_word: λύχνοι
  choice: దీపాలు
  rationale: అమూర్తమైన వెలుగును కాకుండా నూనె దీపాలనే సూచించే నిర్దిష్ట నామవాచకం.
- source_word: καιόμενοι
  choice: వెలుగుతూ
  rationale: దీపాలు నిరంతరం మండుతూ/వెలుగుతూ ఉన్న స్థితిని సహజ తెలుగులో తెలియజేస్తుంది; వర్తమాన కృదంతంలోని కొనసాగింపు భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సిద్ధతను తెలిపే సాంస్కృతిక రూపకం
  choice: ‘మీ నడుములు బిగించుకొని ఉండండి’ అనే స్పష్టమైన రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘పని చేయడానికి సిద్ధంగా దుస్తులు ధరించి ఉండండి’ లేదా ‘చర్యకు సిద్ధంగా ఉండండి’
  rationale: మూలపాఠం సిద్ధతను నేరుగా చెప్పకుండా, పొడవైన వస్త్రాలను నడుముకు బిగించుకునే దృశ్యంతో వ్యక్తం చేస్తుంది. ఆ దృశ్యాన్ని పాఠ్యంలో నిలిపి, ఆధునిక పాఠకునికి దాని భావాన్ని పాదటిప్పణిలో వివరిస్తే మూలంలోని రూపకమూ దాని ఉద్దేశమూ రెండూ కాపాడబడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘నడుములు బిగించుకొని’ అనే సాంస్కృతిక రూపకం ప్రధాన పాఠ్యంలో ఉంచి, దాని కార్యసిద్ధత భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం. సెమీకోలన్ రెండు సమాంతర సిద్ధత చిత్రాలను అనుసంధానిస్తుంది.
