id: LUK.12.52
reference: Luke 12:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: te
  text: ఎందుకంటే, ఇప్పటి నుండి ఒకే ఇంట్లో ఐదుగురు విడిపోయి ఉంటారు[a]—ముగ్గురు ఇద్దరికి వ్యతిరేకంగా, ఇద్దరు ముగ్గురికి వ్యతిరేకంగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకే కుటుంబంలో ఐదుగురు విడిపోయి ఉంటారు.” గ్రీకు పదం భౌతికమైన ఇంటినిగానీ, అందులోని కుటుంబ సమూహాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ఉంటారు
  rationale: εἰμί భవిష్యత్తు రూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఐదుగురు విభేదించిన స్థితిలో ఉండబోతున్నారని సందర్భం సూచిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన విభజనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπὸ τοῦ νῦν
  choice: ఇప్పటినుంచి
  rationale: కాలవ్యక్తీకరణలోని ఇకముందు కొనసాగే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: πέντε
  choice: ఐదుగురు
  rationale: సందర్భం మనుషులను సూచిస్తున్నందున తెలుగు వ్యక్తివాచక సంఖ్యారూపం సముచితం.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: ఒకే ఇంట్లో
  rationale: οἶκος యొక్క ప్రత్యక్ష అర్థమైన ‘ఇల్లు’ను నిలుపుతూ, ఒకే గృహంలో నివసించే కుటుంబ సమూహాన్ని సహజంగా సూచిస్తుంది; ‘కుటుంబంలో’ అనే భావవ్యాప్తిని పాదసూచికలో ఉంచాం.
- source_word: διαμεμερισμένοι
  choice: విభేదించి
  rationale: పూర్త భూత కర్మణి కృదంతం సూచించే, విభజనకు గురై పరస్పర విరోధ స్థితిలో ఉన్న భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: ముగ్గురు ఇద్దరికి వ్యతిరేకంగా
  rationale: ἐπί + చతుర్థీ ఇక్కడ తెలిపే పక్షవిరోధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: ఇద్దరు ముగ్గురికి వ్యతిరేకంగా
  rationale: ముందటి పదబంధంతో ఉన్న సమాంతరతను, పరస్పర వ్యతిరేకతను నిలుపుతుంది.
theological_decisions:
- issue: οἶκος‌ను భౌతిక ‘ఇల్లు’గా అనువదించాలా, కుటుంబ సమూహంగా ‘కుటుంబం’ అని వివరించాలా
  choice: ప్రధాన పాఠంలో ‘ఇల్లు’
  alternative: ‘కుటుంబం’ లేదా ‘ఇంటివారు’
  rationale: తరువాతి వచనంలో కుటుంబ సంబంధాలు స్పష్టమవుతున్నప్పటికీ, మూలపదం ఇల్లు మరియు కుటుంబ సమూహం అనే రెండు భావాలను మోయగలదు. అందువల్ల ప్రత్యక్ష రూపాన్ని ప్రధాన పాఠంలో ఉంచి, సామాజిక భావాన్ని పాదసూచికలో సూచించడం నిజమైన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘ఒకే ఇంట్లో’ మూలంలోని ఏకత్వానికి విరుద్ధంగా ఏర్పడిన విభజనను బలపరుస్తుంది; చివరి రెండు భాగాల్లో సమాంతర నిర్మాణం నిలుపబడింది.
