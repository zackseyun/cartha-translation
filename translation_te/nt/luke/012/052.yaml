  source_fidelity: The draft accurately represents the future time reference, five persons in one οἶκος, and the balanced opposition of three against two and two against three. However, “విభేదించి” primarily denotes disagreeing and does not adequately convey διαμεμερισμένοι, a perfect passive participle denoting a state of having been divided.
  naturalness: The sentence is otherwise natural modern standard Telugu. “విడిపోయి ఉంటారు” is clearer and more idiomatic for the resulting state of division, while preserving the future construction.
  terminology: “ఒకే ఇంట్లో” appropriately retains the concrete wording of οἶκος, and the footnote properly preserves “కుటుంబం” as a lexical-social alternative. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: “విభేదించి” for διαμεμερισμένοι
    rationale: “విభేదించి” means ‘disagreeing’ and can suggest merely differing in opinion. The Greek perfect passive describes people who stand divided/split into opposing sides. “విడిపోయి ఉంటారు” better conveys this resultant division without overinterpreting it.
  revised_text: ఎందుకంటే, ఇప్పటి నుండి ఒకే ఇంట్లో ఐదుగురు విడిపోయి ఉంటారు[a]—ముగ్గురు ఇద్దరికి వ్యతిరేకంగా, ఇద్దరు ముగ్గురికి వ్యతిరేకంగా.
