  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: te
  text: మీలో ఎవరు చింతించడం ద్వారా తన జీవితకాలానికి ఒక మూరెడు చేర్చగలడు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన ఎత్తుకు ఒక మూరెడు చేర్చగలడు?” గ్రీకు పదం వయస్సు లేదా జీవితకాలాన్ని, అలాగే శరీర ఎత్తును కూడా సూచించగలదు.
    reason: మూలంలోని ἡλικία పదానికి ఉన్న అర్థసందిగ్ధతను—వయస్సు/జీవితకాలం లేదా ఎత్తు—పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: μεριμνῶν
  choice: చింతించడం వల్ల
  rationale: ఆందోళన చెందడం లేదా చింతించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కర్తృవాచక రూపంలోని సాధనార్థక భావాన్ని ‘వల్ల’తో వ్యక్తం చేసింది.
- source_word: ἡλικίαν
  choice: జీవితకాలానికి
  rationale: ఈ పదానికి ‘వయస్సు/జీవితకాలం’ మరియు ‘శరీర ఎత్తు’ అనే అర్థాలు సాధ్యమైనవి. సందర్భంలో కాలం గురించి చింతించడం, తరువాతి వచనంలోని ‘చిన్న పని’ అనే సూచనల దృష్ట్యా ‘జీవితకాలం’ ప్రధాన పాఠ్యానికి అనుకూలం; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: πῆχυν
  choice: ఒక మూరెడు
  rationale: మోచేతి నుంచి మధ్యవేలి కొనవరకు ఉండే ప్రాచీన పొడవు ప్రమాణమైన ‘క్యూబిట్’కు తెలుగులో పరిచితమైన సమానపదం. జీవితకాలంతో వాడినప్పుడు ఇది రూపకాలంకారంలోని కొలత భావాన్ని నిలుపుతుంది.
- source_word: προσθεῖναι
  choice: చేర్చగలరు
  rationale: ‘జోడించడం/చేర్చడం’ అనే మూలభావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἡλικία యొక్క అర్థసందిగ్ధత
  choice: ప్రధాన పాఠ్యంలో ‘జీవితకాలం’
  alternative: ‘ఎత్తు’ లేదా ‘శరీర ఎత్తు’
  rationale: రెండు అర్థాలూ నిఘంటుపరంగా సాధ్యమైనవే. ఒక మూర ఎత్తు చేర్చడం అతిశయోక్తిగా అర్థవంతమైనప్పటికీ, ఈ బోధనలో జీవితం గురించి చింతించే సందర్భం ‘జీవితకాలం’కు బలం ఇస్తుంది. సందిగ్ధతను సిద్ధాంతపరంగా పరిష్కరించకుండా పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ప్రశ్నారూపం. ‘మూరెడు’ బైబిలు సందర్భంలో ప్రాచీన కొలతను సహజంగా సూచిస్తుంది; మూలంలోని అలంకారాత్మక ఉద్రిక్తతను అలాగే ఉంచింది.
