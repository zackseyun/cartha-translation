source:
  edition: SBLGNT
  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: te
  text: నేను భూమిమీద అగ్ని వేయడానికి వచ్చాను; అది ఇప్పటికే రగిలి ఉండాలని నేను ఎంతగా కోరుకుంటున్నానో![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా మరింత అక్షరార్థంగా: “అది ఇప్పటికే అంటించబడి ఉంటే, నేను ఇంకా ఏమి కోరుతున్నాను?” గ్రీకు వాక్యభాగం క్లిష్టమైనది; ప్రధాన పాఠ్యం దాన్ని బలమైన ఆకాంక్షను తెలిపే నుడికారంగా అందిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: అగ్ని
  rationale: రూపకాన్ని వివరించి పరిమితం చేయకుండా, మూలంలోని గంభీరమైన అగ్ని చిత్రాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἦλθον
  choice: వచ్చాను
  rationale: యేసు తన రాకలోని ఉద్దేశాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: βαλεῖν
  choice: వేయడానికి
  rationale: βάλλω అనే క్రియలోని ‘వేయడం/విసరడం’ భావాన్ని సహజంగా ఉంచుతుంది; ‘తేవడానికి’ కంటే మూలచిత్రానికి దగ్గరగా ఉంటుంది.
- source_word: ἐπὶ τὴν γῆν
  choice: భూమిమీద
  rationale: γῆకు ఇక్కడ స్థానికమైన ‘దేశం’ కంటే విస్తృతమైన ‘భూమి’ భావమే సందర్భానికి తగినది.
- source_word: ἤδη
  choice: ఇప్పటికే
  rationale: చర్య అప్పటికే జరిగి ఉండాలనే బలమైన ఆకాంక్షలోని కాలసూచనను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνήφθη
  choice: రగులుకొని ఉండాలని
  rationale: అగ్ని అంటించబడి మండడం మొదలైన స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది; కర్తరి భావాన్ని చొప్పించకుండా గ్రీకు కర్మణి రూపానికి తగిన ఫలితస్థితిని నిలుపుతుంది.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: అది ఇప్పటికే రగులుకొని ఉండాలని నేను ఎంతగా కోరుతున్నానో!
  rationale: క్లిష్టమైన గ్రీకు వాక్యాన్ని బలమైన ఆకాంక్షను తెలిపే ఆశ్చర్యార్థక ప్రయోగంగా అందిస్తుంది; మరింత అక్షరార్థమైన ప్రశ్నార్థక అవకాశాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: ‘అగ్ని’ రూపకానికి అర్థం
  choice: ‘అగ్ని’ అనే రూపకాన్నే వ్యాఖ్యానించకుండా నిలుపడం
  alternative: తీర్పు, శుద్ధీకరణ, పరిశుద్ధాత్మ, లేదా యేసు పరిచర్య కలిగించే విభజన అని స్పష్టీకరించడం
  rationale: ఈ వచనం రూపకాన్ని స్వయంగా నిర్వచించదు. ఒక నిర్దిష్ట సిద్ధాంతార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చితే మూలంలోని బహుళ ప్రతిధ్వనులు, ఉద్వేగం తగ్గిపోతాయి.
- issue: τί θέλω εἰ ἤδη ἀνήφθη అనే క్లిష్ట వాక్యభాగపు బలం
  choice: తీవ్రమైన కోరికను తెలిపే ఆశ్చర్యార్థక వాక్యంగా అనువదించడం
  alternative: ‘అది ఇప్పటికే రగిలించబడి ఉంటే, నేను ఇంకా ఏమి కోరుతున్నాను?’ అనే అక్షరార్థ ప్రశ్నగా అనువదించడం
  rationale: గ్రీకు నిర్మాణం క్లిష్టమైనదైనా, సందర్భంలో బలమైన ఆకాంక్షను తెలిపే నుడికారార్థం సహజంగా సరిపోతుంది. అయితే అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో భద్రపరచడం ద్వారా అస్పష్టతను దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘అగ్ని’ రూపకం వ్యాఖ్యానించకుండా నిలుపబడింది. క్లిష్టమైన చివరి వాక్యభాగం పాఠకుడికి స్పష్టంగా ఉండేలా నుడికారార్థంలో ఇచ్చి, అక్షరార్థ అవకాశాన్ని పాదసూచికలో పేర్కొన్నాం.
