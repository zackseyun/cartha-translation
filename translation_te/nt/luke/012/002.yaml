id: LUK.12.2
reference: Luke 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: te
  text: అయితే, బయలుపరచబడని కప్పబడి ఉన్నదేదీ లేదు[a][c]; తెలియబడని దాగి ఉన్నదేదీ లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కప్పబడి ఉన్నది’కు ‘మరుగుపరచబడినది’ అని కూడా అనువదించవచ్చు; గ్రీకులో ఒకదాన్ని కప్పి ఉంచి, తరువాత దానిని బయలుపరచే దృశ్యరూపం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దాగి ఉన్నది’కు ‘రహస్యంగా ఉన్నది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ మాట ప్రస్తుతం గానీ అంతిమ తీర్పులో గానీ చివరికి జరిగే బయల్పరచడాన్ని విస్తృతంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ఉన్నదేదీ లేదు
  rationale: నపుంసక ఏకవచన నిరాకరణ సర్వనామం యొక్క సంపూర్ణ పరిధిని సహజమైన ఆధునిక తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందరి సందర్భంతో కొనసాగింపుతో కూడిన స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; గ్రీకు δέ యొక్క మృదువైన ప్రతికూల/వికాస సంబంధాన్ని నిలుపుతుంది.
- source_word: συγκεκαλυμμένον
  choice: కప్పబడి ఉన్నది
  rationale: పర్ఫెక్ట్ పాసివ్ భావమైన—కప్పబడి, ప్రస్తుతం ఆ స్థితిలో ఉన్నదనే—అర్థాన్ని, కప్పడం అనే మూల దృశ్యరూపంతో సహా నిలుపుతుంది.
- source_word: ἀποκαλυφθήσεται
  choice: బయటపడకుండా
  rationale: భవిష్యత్ పాసివ్ వెల్లడిని తెలుగు ద్వినిరాకరణ నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది; కప్పబడినది తరువాత వెలుగులోకి రావడమనే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: κρυπτὸν
  choice: దాగి ఉన్నది
  rationale: ‘రహస్యం’ అని నామవాచక భావానికి పరిమితం చేయకుండా, దాచబడిన స్థితిని సూచించే విశేషణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: γνωσθήσεται
  choice: తెలిసిపోకుండా
  rationale: భవిష్యత్తులో తెలిసే స్థితికి చేరడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఎవరు తెలియజేస్తారో అనవసరంగా నిర్దేశించదు.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: -కుండా ... ఏదీ లేదు
  rationale: రెండు సమాంతర సంబంధవాక్యాల్లోని గ్రీకు నిరాకరణను సహజమైన తెలుగు ద్వినిరాకరణ రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: ఈ వాక్యపు పరిధి మరియు బలం
  choice: ఇప్పుడు కప్పబడినది లేదా దాగి ఉన్నది చివరికి బయటపడి తెలిసిపోతుందనే సాధారణ సూత్రంగా అనువదించబడింది.
  alternative: ఇది ప్రత్యేకంగా అంతిమ తీర్పులో జరిగే బయల్పరచడాన్ని మాత్రమే సూచించడం; లేదా ప్రస్తుత కాలంలో కపటత్వం బహిర్గతమవడాన్ని మాత్రమే సూచించడం.
  rationale: గ్రీకు భవిష్యత్ పాసివ్ రూపాలు చివరికి బయల్పడడాన్ని సూచిస్తాయి గాని సమయాన్ని నిర్దేశించవు. అందువల్ల ప్రస్తుత బహిర్గతం మరియు అంతిమ తీర్పు మధ్య ఉన్న వ్యాఖ్యాన విస్తృతిని అనువాదం సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరతను మరియు గ్రీకు వాక్యంలోని రెండు సమాంతర భాగాలను నిలుపుతూ రూపొందించబడింది. ‘ఉన్నదేదీ లేదు’ అనే తెలుగు ద్వినిరాకరణ నిర్మాణం మూలంలోని ‘ఏదీ ... కాకుండా ఉండదు’ అనే సంపూర్ణ భావాన్ని సహజంగా అందిస్తుంది.
