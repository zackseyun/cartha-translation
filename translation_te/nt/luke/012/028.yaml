id: LUK.12.28
reference: Luke 12:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: te
  text: అయితే, పొలంలో నేడు ఉండి రేపు పొయ్యిలో[b] వేయబడే గడ్డిని[a] దేవుడు ఇలా అలంకరిస్తే, అల్పవిశ్వాసులారా, మిమ్మల్ని ఇంకెంత ఎక్కువగా అలంకరిస్తాడు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గడ్డి’ అనే పదానికి ‘పచ్చిక’ లేదా ‘పొలంలోని మొక్కలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి ‘పొయ్యి’ రొట్టెలు కాల్చే పొయ్యిని సూచిస్తుంది; ఎండిన గడ్డిని దానికి ఇంధనంగా ఉపయోగించేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: గడ్డిని
  rationale: χόρτος ఇక్కడ పొలంలో పెరిగే, త్వరగా ఎండిపోయి ఇంధనంగా ఉపయోగించగల గడ్డి లేదా పచ్చికను సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘గడ్డి’ సహజమైన, స్పష్టమైన పదం.
- source_word: ἐν ἀγρῷ
  choice: పొలంలో
  rationale: ఈ పదబంధం గడ్డి పెరిగే బహిరంగ ప్రదేశాన్ని సాధారణంగా సూచిస్తుంది; ‘పొలంలో’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: నేడు ఉండి రేపు ... వేయబడే
  rationale: గ్రీకు కృదంత నిర్మాణంలోని కాలవ్యతిరేకతను తెలుగులో సహజంగా వ్యక్తపరుస్తూ, గడ్డి క్షణభంగురతను అదనపు అర్థం చేర్చకుండా నిలుపుతుంది.
- source_word: κλίβανον
  choice: పొయ్యిలో
  rationale: κλίβανος రొట్టెలు కాల్చే మట్టి పొయ్యి లేదా పొయ్యిని సూచిస్తుంది. ‘పొయ్యి’ ఆధునిక తెలుగు పాఠకునికి సహజం; ‘కొలిమి’ అనవసరంగా పారిశ్రామిక వేడిని సూచించవచ్చు.
- source_word: ἀμφιέζει
  choice: అలంకరిస్తే / అలంకరిస్తాడు
  rationale: ఈ క్రియ ప్రాథమికంగా వస్త్రం వేయడం, ధరింపజేయడం అనే భావం కలిగి ఉంది. గడ్డిని వస్త్రధారణతో రూపకంగా పోల్చే సందర్భంలో ‘అలంకరించు’ తెలుగులో సహజంగా ఉండి, తరువాత మనుషులకు వస్త్రం సమకూర్చే భావాన్నీ మోస్తుంది.
- source_word: πόσῳ μᾶλλον
  choice: ఇంకెంత ఎక్కువగా
  rationale: తక్కువదాని నుండి ఎక్కువదానికి చేసే వాదనను, గ్రీకు తులనాత్మక బలాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὀλιγόπιστοι
  choice: అల్పవిశ్వాసులారా
  rationale: సంబోధనా రూపంలోని నేరమైన కానీ అతిశయింపని మందలింపును నిలుపుతుంది. ఇది విశ్వాసం కొరవడిన స్థితిని సూచిస్తుంది గాని రక్షణ లేదా మతత్యాగం గురించి సాంకేతిక నిర్ణయం చేయదు.
- source_word: εἰ δὲ
  choice: అయితే
  rationale: మునుపటి మాటను కొనసాగిస్తూ స్వల్ప వ్యత్యాసంతో వాదనను ముందుకు తీసుకెళ్లే δέ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: οὕτως
  choice: ఇలా
  rationale: దేవుడు గడ్డిని ఏ విధంగా అలంకరిస్తున్నాడో సూచించే సరళమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ὀλιγόπιστοι అనే సంబోధన బలం
  choice: నేరమైన కానీ మితమైన మందలింపుగా ‘అల్పవిశ్వాసులారా’
  alternative: ‘విశ్వాసం లేనివారలారా’ లేదా కేవలం ‘తక్కువ విశ్వాసం గలవారలారా’
  rationale: గ్రీకు పదం పూర్తిగా విశ్వాసం లేనివారిని తప్పనిసరిగా సూచించదు; దేవునిపై తగినంత నమ్మకం చూపని శిష్యులను మందలిస్తుంది. అనువాదం ఈ ఉద్రిక్తతను తీవ్రతరం చేయకుండా లేదా పూర్తిగా మృదువుచేయకుండా నిలుపుతుంది.
- issue: భవిష్యత్ భావం యొక్క వ్యక్తీకరణ
  choice: ‘మిమ్మల్ని ... అలంకరిస్తాడు’ అని సందర్భానుసారంగా వ్యక్తీకరించడం
  alternative: గ్రీకులో ప్రధాన ఉపవాక్యంలో క్రియను అధ్యాహారంగా ఉంచినట్లే తెలుగులోనూ అసంపూర్ణంగా వదలడం
  rationale: గ్రీకు వాక్యంలో రెండో భాగపు క్రియ మొదటి భాగం నుండి సహజంగా అధ్యాహారమవుతుంది. తెలుగులో స్పష్టత కోసం దాన్ని పునరుక్తి చేయడం అర్థాన్ని నిర్ణయాత్మకంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని తక్కువది-ఎక్కువది వాదన, గడ్డి క్షణభంగురత, మరియు శిష్యులపై మితమైన మందలింపు నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
