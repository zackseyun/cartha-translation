revisions:
- from: కాని తెలియకుండానే, దెబ్బలకు తగిన పనులు చేసినవాడు కొద్ది దెబ్బలు తింటాడు. ఎవనికి ఎక్కువ ఇవ్వబడిందో అతని నుండి ఎక్కువ కోరబడుతుంది; ఎవనికి ఎక్కువ అప్పగించారో అతని నుండి ఇంకా ఎక్కువ అడుగుతారు.
  to: కాని తెలియక, దెబ్బలకు తగినవి చేసినవాడు కొద్ది దెబ్బలతో కొట్టబడతాడు. ఎవరికైతే ఎక్కువ ఇవ్వబడిందో, అతని నుండి ఎక్కువ కోరబడుతుంది; ఎవరికైతే ఎక్కువ అప్పగించారో, అతని నుండి ఇంకా ఎక్కువ అడుగుతారు.
  rationale: సురక్షితమైన శైలీ సవరణగా మొదటి వాక్యంలోని కొట్టే శిక్షా చిత్రాన్ని స్పష్టంగా, గ్రీకు కర్మణి నిర్మాణానికి దగ్గరగా మార్చాం. ‘తెలియక’ అనడం జ్ఞానం లేకపోవడాన్ని అదనపు వ్యాఖ్యానమో ఉద్ఘాటనో లేకుండా నిలుపుతుంది. జవాబుదారీతనం, అనిర్దిష్ట బహువచన కర్త, మరియు ‘ఎక్కువ/ఇంకా ఎక్కువ’ అనే క్రమబద్ధమైన పోలిక అన్నీ యథాతథంగా ఉన్నాయి.
