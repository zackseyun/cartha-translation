id: LUK.12.48
reference: Luke 12:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: te
  text: కాని తెలియక, దెబ్బలకు తగినవి చేసినవాడు కొద్ది దెబ్బలతో కొట్టబడతాడు. ఎవరికైతే ఎక్కువ ఇవ్వబడిందో, అతని నుండి ఎక్కువ కోరబడుతుంది; ఎవరికైతే ఎక్కువ అప్పగించారో, అతని నుండి ఇంకా ఎక్కువ అడుగుతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: తెలియకుండానే ... చేసినవాడు
  rationale: μήతో కూడిన γινώσκω భూతకాల కృదంతం జ్ఞానం లేకపోవడాన్ని సూచిస్తుంది. ‘తెలియకుండానే’ అనేది అపరాధ బాధ్యతను అతిశయింపకుండా సహజమైన తెలుగులో భావాన్ని నిలుపుతుంది.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: దెబ్బలకు తగిన పనులు చేసినవాడు
  rationale: ἄξια πληγῶν శిక్షార్హమైన క్రియలను సూచిస్తుంది. ఈ రూపం కారణసంబంధాన్ని స్పష్టంగా, సహజంగా ఉంచుతుంది.
- source_word: πληγῶν
  choice: దెబ్బలు
  rationale: ఈ శిక్షా సందర్భంలో πληγή కొట్టిన దెబ్బలను సూచిస్తుంది; ‘దెబ్బలు’ నిర్దిష్ట సాధనాన్ని ఊహించకుండా చిత్రాన్ని నిలుపుతుంది.
- source_word: δαρήσεται ὀλίγας
  choice: కొద్ది దెబ్బలు తింటాడు
  rationale: δέρω స్పష్టంగా కొట్టడాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘దెబ్బలు తింటాడు’ సహజమైన కర్మణ్యార్థక వ్యక్తీకరణ; గ్రీకులోని శిక్షా చిత్రాన్ని పూర్తిగా నిలుపుతుంది.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: ఎవనికి ఎక్కువ ఇవ్వబడిందో అతని నుండి
  rationale: దత్త సంబంధవాచక నిర్మాణాన్ని జవాబుదారీతనానికి మూలమైన వ్యక్తి నుండి కోరబడటం అనే సహజ తెలుగు నిర్మాణంగా అందిస్తుంది.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: ఎక్కువ కోరబడుతుంది
  rationale: ఈ సందర్భంలో ζητέω లెక్క అడగడం లేదా బాధ్యతను కోరడం అనే భావం కలిగి ఉంది. ‘కోరబడుతుంది’ కర్మణి రూపాన్ని, παράతో వ్యక్తమైన ‘అతని నుండి’ భావాన్ని కాపాడుతుంది.
- source_word: παρέθεντο
  choice: అప్పగించారో
  rationale: παρατίθημι ఇక్కడ ఒకరి సంరక్షణకు లేదా బాధ్యతకు ఉంచడాన్ని సూచిస్తుంది. ‘అప్పగించారు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: అతని నుండి ఇంకా ఎక్కువ అడుగుతారు
  rationale: αἰτέωను ‘అడుగుతారు’గా అనువదించడం ζητέωతో ఉన్న క్రియాభేదాన్ని నిలుపుతుంది; ‘ఇంకా ఎక్కువ’ περισσότερον యొక్క వృద్ధి భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: శిక్ష స్వరూపాన్ని తెలిపే రూపకం
  choice: ‘దెబ్బలు’ అనే స్పష్టమైన శిక్షా చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: సాధారణీకరించి ‘శిక్ష’ అని చెప్పడం, లేదా నిర్దిష్టంగా ‘కొరడా దెబ్బలు’ అని చెప్పడం
  rationale: వాక్యం జ్ఞానం, బాధ్యతలకు అనుగుణమైన పరిమాణభేద శిక్షను ఉపమానాత్మకంగా చెబుతుంది. మూలపాఠం చెప్పని శిక్షా విధానాన్ని జోడించకుండా దాని స్పష్టమైన చిత్రాన్నీ నైతిక ఉద్వేగాన్నీ నిలుపాలి.
- issue: చివరి ఉపవాక్యంలోని కర్త
  choice: ‘అప్పగించారు’, ‘అడుగుతారు’ అనే అనిర్దిష్ట బహువచనాన్ని నిలుపడం
  alternative: కర్తను ‘దేవుడు’గా లేదా ‘మనుషులు’గా స్పష్టీకరించడం
  rationale: గ్రీకులో ఈ క్రియలకు స్పష్టమైన కర్త లేదు. ఎవరో ఒకరిని కర్తగా నిర్ధారించడం మూలపాఠాన్ని మించిన వ్యాఖ్యానం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘దెబ్బలు తింటాడు’ అనేది సహజమైన తెలుగు ప్రయోగం; అసభ్యంగా కాకుండా మూలంలోని స్పష్టమైన కొట్టే భావాన్ని తెలియజేస్తుంది. అనిర్దిష్ట బహువచన కర్తలను ఉద్దేశపూర్వకంగా అలాగే ఉంచాం.
