id: LUK.12.22
reference: Luke 12:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: te
  text: 'తర్వాత ఆయన తన శిష్యులతో ఇలా అన్నాడు: “అందువల్ల నేను మీతో చెబుతున్నాను: ఏమి తింటారో అని మీ జీవితం[a] గురించి గానీ, ఏమి ధరిస్తారో అని మీ శరీరం గురించి గానీ చింతించకండి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రాణం.’ ఇక్కడ గ్రీకు పదం సాధారణంగా ఈ లోకంలోని జీవితం లేదా మనుగడను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆందోళనపడకండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: తర్వాత ఆయన ... అన్నాడు
  rationale: δέ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. కథన ప్రవాహంలో ‘తర్వాత’ సహజంగా ఉండి, బలమైన వ్యతిరేక భావాన్ని చేర్చదు.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: తన శిష్యులతో
  rationale: αὐτοῦలోని స్వామ్య భావాన్ని ‘తన’ నిలుపుతుంది; μαθηταίకు ‘శిష్యులు’ ప్రామాణికమైన, సులభంగా అర్థమయ్యే పదం.
- source_word: Διὰ τοῦτο
  choice: అందువల్ల
  rationale: ముందటి బోధన ఆధారంగా వచ్చే నిర్ధారణను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెప్తున్నాను
  rationale: ప్రత్యక్ష సంబోధనను నిలుపుతూ ఆధునిక తెలుగు వాడుకలో సహజంగా ఉంది.
- source_word: μὴ μεριμνᾶτε
  choice: చింతించకండి
  rationale: ఇక్కడ క్రియ ఆందోళనతో కూడిన చింతను సూచిస్తుంది. ‘చింతించకండి’ గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన రూపం.
- source_word: τῇ ψυχῇ
  choice: మీ జీవితం గురించి
  rationale: ఆహారంతో ఉన్న తక్షణ సంబంధంలో ψυχή భౌతిక లోకంలోని జీవితం లేదా మనుగడను సూచిస్తుంది; ప్రత్యేకంగా దేహరహిత ఆత్మను కాదు.
- source_word: τί φάγητε
  choice: ఏమి తింటారో అని
  rationale: పరోక్ష పరిశీలనాత్మక భావంతో ఉన్న భవిష్యద్ముఖ ప్రశ్నను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μηδὲ τῷ σώματι
  choice: మీ శరీరం గురించి గానీ
  rationale: μηδέ కలిపే రెండవ అంశాన్ని మొదటి అంశంతో సమాంతరంగా ఉంచడానికి ‘గురించి గానీ’ వాడబడింది.
- source_word: τί ἐνδύσησθε
  choice: ఏమి ధరిస్తారో అని
  rationale: దుస్తులు వేసుకోవడం అనే మధ్యమ రూప భావాన్ని తెలుగులో సహజమైన ‘ధరించడం’తో అందిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ψυχή అర్థం
  choice: జీవితం
  alternative: ప్రాణం లేదా ఆత్మ
  rationale: ψυχήకు ఆహారం, σώμαకు వస్త్రం అనే సమాంతర నిర్మాణం ఇక్కడ సాధారణ భౌమిక జీవితాన్ని సూచిస్తుంది. ‘జీవితం’ సందర్భార్థాన్ని స్పష్టం చేస్తూ అనవసరమైన ఆత్మ–శరీర సిద్ధాంతాన్ని వాక్యంలోకి దిగుమతి చేయదు; మూలపదంలోని ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. గ్రీకు వాక్యంలోని జీవితం–ఆహారం, శరీరం–వస్త్రం సమాంతర నిర్మాణాన్ని ‘గురించి గానీ ... గురించి గానీ’ రూపంతో సహజంగా నిలుపబడింది. పాదసూచిక గుర్తులు సంబంధిత ‘జీవితం’ మరియు ‘చింతించకండి’ పదాల వెంట ఉంచబడ్డాయి.
