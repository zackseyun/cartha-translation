id: LUK.12.32
reference: Luke 12:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: te
  text: “చిన్న గొర్రెల మందా[b], భయపడకు[a]. ఎందుకంటే మీకు రాజ్యాన్ని[c] ఇవ్వడం మీ తండ్రికి ఇష్టమైంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భయపడవద్దు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చిన్న మందా.’
    reason: lexical_alternative
  - marker: c
    text: ‘రాజ్యం’ అనే పదాన్ని ‘రాజపాలన’ అని కూడా అర్థం చేసుకోవచ్చు; ఇది దేవుడు తన ప్రజలకు ఇచ్చే రాజ్యాన్ని, అలాగే ఆయన రాజాధికారాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: భయపడకు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞారూపం నిషేధాన్ని తెలియజేస్తుంది. ఏకవచన సంబోధనను, గ్రీకు వాక్యంలోని నేరుదనాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τὸ μικρὸν ποίμνιον
  choice: చిన్న మందా
  rationale: ποίμνιον గొర్రెల మందను సూచించే కాపరి రూపకాన్ని కలిగి ఉంది; μικρόν దాని చిన్నదనాన్ని తెలియజేస్తుంది. సంబోధన రూపమైన ‘మందా’ ఆ రూపకాన్నీ ఆప్యాయ స్వరాన్నీ కాపాడుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: భయపడకూడదనే ఆజ్ఞకు కారణాన్ని ὅτι పరిచయం చేస్తోంది; ‘ఎందుకంటే’ ఈ కారణ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εὐδόκησεν
  choice: ఇష్టపడ్డాడు
  rationale: εὐδοκέω ఇక్కడ అనుకూలమైన సంకల్పాన్ని లేదా మంచి ఇష్టాన్ని సూచిస్తుంది. ‘ఇష్టపడ్డాడు’ తండ్రి దయాపూర్వక చొరవను తెలిపినా, దానిని సాంకేతిక సిద్ధాంత పదజాలంగా మార్చదు.
- source_word: ὁ πατὴρ ὑμῶν
  choice: మీ తండ్రి
  rationale: మూలంలో ఉన్నదే అనువదిస్తూ ‘పరలోకపు’ వంటి లేని విశేషణాన్ని చేర్చదు.
- source_word: δοῦναι ὑμῖν
  choice: మీకు … ఇవ్వడానికి
  rationale: δίδωμι క్రియార్థాన్ని సరళంగా తెలియజేస్తుంది; ‘అనుగ్రహించడానికి’ అనే మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: τὴν βασιλείαν
  choice: రాజ్యాన్ని
  rationale: βασιλεία రాజ్య పరిధినీ రాజపాలననూ సూచించగలదు. ‘రాజ్యం’ పరిచితమైన బైబిలు పదంగా ఈ విస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది; మూలంలో లేని ‘దేవుని’ అనే పదాలను చేర్చదు.
theological_decisions:
- issue: βασιλεία పదంలోని రాజ్యం–పాలన భావవ్యాప్తి
  choice: రాజ్యాన్ని
  alternative: పాలనను
  rationale: ‘రాజ్యం’ పరిచితమైన పదప్రయోగాన్ని నిలుపుతూ, దేవుని రాజాధికార పాలన మరియు ఆయన ప్రజలకు ఇచ్చే రాజ్యం అనే రెండు భావాలకు చోటిస్తుంది. ‘పాలన’ అని మాత్రమే అనడం భావాన్ని ఒక దిశకు కుదించవచ్చు.
- issue: εὐδόκησενలో దైవ సంకల్ప భావం
  choice: ఇష్టపడ్డాడు
  alternative: దయతో నిర్ణయించాడు
  rationale: వాక్యం తండ్రి యొక్క అనుకూలమైన మంచి ఇష్టాన్ని ప్రధానంగా తెలియజేస్తుంది. ‘ఇష్టపడ్డాడు’ దైవ చొరవను కాపాడుతూ, మూలం చెప్పేదానికంటే సాంకేతికమైన నిర్ణయ సిద్ధాంతాన్ని చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘చిన్న మందా’ అనే కాపరి రూపకం అలాగే ఉంచబడింది. సమూహాన్ని ఏకవచనంగా సంబోధించే గ్రీకు రూపానికి అనుగుణంగా ‘భయపడకు’ వాడబడింది; మరింత మర్యాదాత్మక ప్రత్యామ్నాయం అడుగుసూచనలో ఇచ్చబడింది.
