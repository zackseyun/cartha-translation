- from: “చిన్న మందా[b], భయపడకు[a]. ఎందుకంటే మీకు రాజ్యాన్ని[c] ఇవ్వడానికి మీ తండ్రి ఇష్టపడ్డాడు.”
  to: “చిన్న గొర్రెల మందా[b], భయపడకు[a]. ఎందుకంటే మీకు రాజ్యాన్ని[c] ఇవ్వడం మీ తండ్రికి ఇష్టమైంది.”
  rationale: The revision strengthens the rendering of εὐδόκησεν from a possible sense of simple preference to the Father’s favorable pleasure, while preserving the Greek’s concise causal statement and avoiding theological over-specification. It also makes the flock-of-sheep metaphor explicit in contemporary Telugu. Footnote markers and their corresponding notes are retained in a consistent, valid set.
