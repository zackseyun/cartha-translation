id: LUK.12.43
reference: Luke 12:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: te
  text: తన యజమాని[a] వచ్చి అలా చేస్తుండగా కనుగొనే ఆ దాసుడు ధన్యుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువు’. గ్రీకు పదం ఈ ఉపమానంలోని ఇంటి సందర్భంలో ‘యజమాని’ అని, విస్తృత అన్వయంలో ‘ప్రభువు’ అని అర్థం ఇవ్వగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: ధన్యుడు
  rationale: సాధారణ సంతోషాన్ని మాత్రమే కాక, దేవుని అనుగ్రహంతో కూడిన శుభస్థితిని సూచించే ఆశీర్వచన భావాన్ని నిలుపుతుంది.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: యజమాని అధికారానికి లోబడిన ఇంటి దాసుని స్థితిని స్పష్టంగా తెలియజేస్తుంది; ‘సేవకుడు’ కంటే మూలపదంలోని ఆధీన సంబంధాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: ἐκεῖνος
  choice: ఆ దాసుడు
  rationale: గ్రీకు నిర్దేశక సర్వనామంలోని నిర్దిష్టతను, నొక్కిచెప్పడాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κύριος
  choice: యజమాని
  rationale: ఉపమానంలోని ఇంటి సందర్భంలో దాసునిపై అధికారం గల వ్యక్తిని సహజంగా సూచిస్తుంది; విస్తృత సందర్భంలో ఉండగల ‘ప్రభువు’ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐλθὼν
  choice: వచ్చినప్పుడు
  rationale: క్రియావిశేషణాత్మక భూతకృదంతాన్ని ప్రధాన క్రియతో కాలసంబంధం చూపే సహజ తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: εὑρήσει
  choice: చూస్తాడో
  rationale: ఇక్కడ ‘చేసే స్థితిలో కనుగొనడం’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; భావి కాలాన్ని ‘చూస్తాడో’ నిలుపుతుంది.
- source_word: ποιοῦντα οὕτως
  choice: అలా చేస్తూ ఉండడాన్ని
  rationale: ముందు చెప్పిన విధంగా నిరంతరం పని చేస్తూ ఉన్న స్థితిని సహజంగా వెనక్కి సూచిస్తుంది.
theological_decisions:
- issue: తిరిగి వచ్చే κύριος అనే పదంలో ఇంటి యజమాని భావం మరియు క్రీస్తును ‘ప్రభువు’గా సూచించే ప్రతిధ్వని
  choice: ప్రధాన పాఠ్యంలో ‘యజమాని’
  alternative: ‘ప్రభువు’
  rationale: ఉపమానం పైపొరలో ఇంటి యజమాని–దాసుడు సంబంధాన్ని చూపుతుంది. అయితే విస్తృత సందర్భం ప్రభువు రాకను సూచించగలదు కాబట్టి ఆ దైవశాస్త్రీయ ప్రతిధ్వనిని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగించాం. ‘ధన్యుడు’ ఆశీర్వచన గాంభీర్యాన్ని, ‘దాసుడు’ మూలంలోని ఆధీన సంబంధాన్ని నిలుపుతాయి. వాక్యంలోని పునరుక్తి గ్రీకు వాక్యపు నిర్దిష్ట దృష్టిని కాపాడుతుంది.
