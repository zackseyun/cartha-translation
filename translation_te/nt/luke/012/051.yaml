source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: te
  text: భూమిపై శాంతిని ఇవ్వడానికి నేను వచ్చానని మీరు అనుకుంటున్నారా? కాదు, నేను మీతో చెబుతున్నాను, విభజనను కలిగించడానికే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖτε
  choice: మీరు అనుకుంటున్నారా?
  rationale: రెండవ పురుష బహువచనంలో ఉన్న అలంకారిక ప్రశ్నను ఆధునిక తెలుగులో సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: εἰρήνην
  choice: శాంతిని
  rationale: సామాజిక సామరస్యంతో సహా మూలపదంలోని విస్తృత అర్థపరిధిని పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: παρεγενόμην
  choice: నేను వచ్చాను
  rationale: యేసు రావడాన్ని, దాని ఉద్దేశాన్ని సూచించే గ్రీకు ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: δοῦναι
  choice: ఇవ్వడానికి
  rationale: గ్రీకులోని ‘ఇవ్వడం’ అనే ప్రత్యక్ష పదార్థాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
- source_word: ἐν τῇ γῇ
  choice: భూమిపై
  rationale: γῆ అనే పదంలోని విస్తృతమైన ‘భూమి’ భావాన్ని నిలుపుతుంది; ‘దేశంలో’ అని అనువదిస్తే అర్థం అనవసరంగా స్థానిక పరిధికి కుదించబడుతుంది.
- source_word: οὐχί
  choice: కాదు
  rationale: అలంకారిక ప్రశ్నకు ఇచ్చిన బలమైన ప్రతికూల జవాబును సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: శ్రోతలను నేరుగా ఉద్దేశించే సువార్తలలోని సాధారణ ఉద్ఘాటన సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀλλ’ ἢ
  choice: దానికి బదులు
  rationale: శాంతి కాదు, దానికి విరుద్ధమైన ఫలితం అనే తీవ్ర వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: διαμερισμόν
  choice: విభజననే
  rationale: తదుపరి వచనాల్లో కుటుంబాల మధ్య కలిగే చీలికతో సహా సామాజిక విభజనను సూచించే ప్రత్యక్షమైన పదం; ‘నే’ వ్యత్యాసానికి ఉన్న ఉద్ఘాటనను తెలియజేస్తుంది.
theological_decisions:
- issue: శాంతిని గూర్చిన ఇతర వాక్యాలతో కనిపించే ఉద్రిక్తతను తగ్గించాలా?
  choice: యేసు రావడం ఈ సందర్భంలో శాంతిని కాక విభజనను కలిగిస్తుందని ఉన్న తీవ్రమైన వ్యత్యాసాన్ని యథాతథంగా నిలిపాము.
  alternative: ‘ఘర్షణ’ అని వ్యాఖ్యానాత్మకంగా మార్చడం లేదా విభజన కేవలం యాదృచ్ఛిక ఫలితమని సూచించేలా వాక్యాన్ని మృదువుగా చేయడం.
  rationale: గ్రీకు వాక్యం ఉద్దేశపూర్వకంగా తీక్షణంగా ఉంది. సమీప సందర్భం యేసు కార్యం కారణంగా ప్రజల్లో, ప్రత్యేకంగా కుటుంబాల్లో, ఏర్పడే చీలికను వివరిస్తుంది. శాంతికి సంబంధించిన ఇతర బోధలతో దీనిని అనువాదంలోనే సమన్వయపరచకుండా అసలు ఉద్రిక్తతను నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు పదక్రమాన్ని కఠినంగా అనుకరించకుండా తెలుగు ప్రశ్న నిర్మాణాన్ని వాడుతూ, వాక్యంలోని తీక్షణ వ్యత్యాసాన్ని నిలిపాము.
