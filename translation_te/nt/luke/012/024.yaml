id: LUK.12.24
reference: Luke 12:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: te
  text: 'కాకులను జాగ్రత్తగా గమనించండి[a]: అవి విత్తవు, కోయవు; వాటికి నిల్వగదీ లేదు, ధాన్యాగారమూ లేదు; దేవుడు వాటికి ఆహారం ఇస్తున్నాడు. పక్షులకంటే మీరు ఇంకెంత విలువైనవారు![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కాకులను పరిశీలించండి,’ ‘కాకుల గురించి జాగ్రత్తగా ఆలోచించండి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘పక్షులకంటే మీ విలువ ఇంకెంత ఎక్కువ!’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: జాగ్రత్తగా గమనించండి
  rationale: ఈ ఆజ్ఞ కేవలం చూడమని కాక, శ్రద్ధగా పరిశీలించి ఆలోచించమని పిలుస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς κόρακας
  choice: కాకులను
  rationale: κόραξ అనే నిర్దిష్ట పక్షిని సూచిస్తుంది. తెలుగులో సాధారణంగా అర్థమయ్యే సమీప సహజ పదం ‘కాకులు’; ‘పక్షులు’ అని సాధారణీకరించకుండా మూలంలోని దృశ్యాన్ని నిలుపుతుంది.
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν
  choice: అవి విత్తవు, కోయవు
  rationale: రెండు వ్యవసాయ క్రియల సంక్షిప్త సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ταμεῖον
  choice: నిల్వగది
  rationale: వస్తువులను దాచే లోపలి గది అనే భావాన్ని తెలియజేస్తూ, తరువాతి ἀποθήκη నుంచి భేదాన్ని కాపాడుతుంది.
- source_word: ἀποθήκη
  choice: ధాన్యాగారం
  rationale: వ్యవసాయ దిగుబడిని నిల్వచేసే స్థలాన్ని సూచిస్తుంది; ‘నిల్వగది’తో కలిపి గ్రీకులోని రెండు వేర్వేరు నిల్వ పదాలను నిలుపుతుంది.
- source_word: τρέφει
  choice: ఆహారం ఇస్తున్నాడు
  rationale: పక్షులకు దేవుడు నిరంతరం ఆహారం సమకూరుస్తున్నాడనే సరళమైన వర్తమాన భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πόσῳ μᾶλλον
  choice: ఇంకెంత
  rationale: తక్కువదాని నుంచి ఎక్కువదానికి చేసే తులనాత్మక వాదనను సహజమైన తెలుగు ఉద్ఘాటనగా అందిస్తుంది.
- source_word: διαφέρετε
  choice: విలువైనవారు
  rationale: ఇక్కడ కేవలం ‘భిన్నంగా ఉండటం’ కాక, పక్షులను మించిన విలువ లేదా ప్రాముఖ్యత ప్రధాన భావం.
- source_word: τῶν πετεινῶν
  choice: పక్షులకంటే
  rationale: ముందు కాకులను ప్రత్యేకంగా పేర్కొన్న తరువాత, మూలం విస్తృతంగా పక్షులన్నిటితో పోలుస్తుంది.
theological_decisions:
- issue: తులనలో దేవుని పరిపాలనా సంరక్షణ
  choice: అయినా దేవుడు వాటికి ఆహారం ఇస్తున్నాడు
  alternative: దేవుడు వాటిని పోషిస్తున్నాడు
  rationale: జీవుల పట్ల దేవుని క్రియాశీల శ్రద్ధనే మానవుల విలువకు సంబంధించిన యేసు వాదనకు ఆధారంగా మూలవాక్యం ఉంచుతుంది. మూలంలో లేని విస్తృత సిద్ధాంత వివరణను జోడించకుండా దానిని నేరుగా నిలుపుతుంది.
- issue: మనుషుల విలువను తెలిపే διαφέρετε యొక్క భావం
  choice: పక్షులకంటే మీరు ఇంకెంత విలువైనవారు!
  alternative: పక్షులకంటే మీరు ఇంకెంత ఎక్కువగా భిన్నమైనవారు!
  rationale: సందర్భంలో క్రియ తేడాను మాత్రమే కాక, మించిన విలువను సూచిస్తుంది. ఉద్ఘాటనార్థక ముగింపు గ్రీకు వాక్యంలోని బలమైన అలంకారిక ప్రశ్న/ఉద్ఘాటనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. వ్యవసాయ క్రియల సంక్షిప్త సమాంతరత్వం, రెండు వేర్వేరు నిల్వ పదాలు, చివరి ఉద్ఘాటనాత్మక తులన నిలుపబడ్డాయి.
