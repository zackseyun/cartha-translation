id: LUK.12.41
reference: Luke 12:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: te
  text: అప్పుడు పేతురు, “ప్రభువా, ఈ ఉపమానం మాకు చెబుతున్నావా, లేక అందరికీ కూడా చెబుతున్నావా?” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: అని అన్నాడు
  rationale: λέγω యొక్క భూతకాల రూపానికి సహజమైన సమానార్థకం. మాట ప్రశ్నగా ఉన్నప్పటికీ, నివేదన క్రియను ‘అడిగాడు’గా మార్చకుండా మూలంలోని ‘అన్నాడు’ను నిలుపుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథన కొనసాగింపును, సందర్భంలోని క్రమాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే గౌరవార్థక రూపం; κύριος లోని సాధ్యమైన క్రీస్తుసంబంధ ప్రతిధ్వనిని అతిశయింపకుండా నిలుపుతుంది.
- source_word: πρὸς ἡμᾶς
  choice: మాతో
  rationale: λέγεις తరువాత πρός + accusative మాట ఎవరిని ఉద్దేశించిందో సూచిస్తుంది. తెలుగులో ‘మాతో చెబుతున్నావా’ అనేది సహజంగా ఆ దిశార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὴν παραβολὴν ταύτην
  choice: ఈ ఉపమానం
  rationale: సువార్తలలోని παραβολήకు స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పదం ‘ఉపమానం’.
- source_word: λέγεις
  choice: చెబుతున్నావా
  rationale: వర్తమాన కాలంలోని ప్రశ్నకు తక్షణంగా జరుగుతున్న మాటను సూచించే సహజ తెలుగు రూపం.
- source_word: ἢ καὶ
  choice: లేక ... కూడా
  rationale: ἤ యొక్క ప్రత్యామ్నాయ భావాన్ని ‘లేక’తో, καί యొక్క చేర్పు భావాన్ని ‘-నూ’తో నిలుపుతుంది.
- source_word: πρὸς πάντας
  choice: అందరితోనూ
  rationale: πάντας ఇక్కడ విస్తృత శ్రోతలందరినీ సాధారణంగా సూచిస్తుంది; పురుషులకు మాత్రమే పరిమితం చేయకుండా సమగ్ర అర్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యేసును సంబోధించడంలో κύριος అనువాదం
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: ‘ప్రభువా’ గౌరవాన్ని, సాధ్యమైన క్రీస్తుసంబంధ భావాన్ని నిలుపుతుంది; ఈ సందర్భం దానిని కేవలం ‘బోధకుడు’ అనే భావానికి పరిమితం చేయదు.
- issue: πάντας అనే సాధారణ పురుష బహువచనం
  choice: అందరితోనూ
  alternative: అందరు పురుషులతోనూ
  rationale: సందర్భంలో ‘మాతో’ అనే పరిమిత వర్గానికి విరుద్ధంగా విస్తృత శ్రోతలందరినీ సూచిస్తుంది; లింగపరమైన పరిమితిని చేర్చడం మూలార్థానికి మించినది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. ‘మాతో/అందరితోనూ చెబుతున్నావా’ అనే నిర్మాణం మాట ఎవరిని ఉద్దేశించిందనే πρὸς భావాన్ని తెలుగులో సరళంగా వ్యక్తం చేస్తుంది. పాఠంలో పాదసూచికలు అవసరం లేదు; అందువల్ల గుర్తులు చేర్చలేదు.
