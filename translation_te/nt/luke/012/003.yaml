id: LUK.12.3
reference: Luke 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: te
  text: కాబట్టి, మీరు చీకటిలో చెప్పినదంతా వెలుగులో వినబడుతుంది; లోపలి గదుల్లో చెవిలో చెప్పినది ఇళ్ల పైకప్పుల మీద ప్రకటించబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇళ్ల పైకప్పుల మీద నుంచి.’ ఇక్కడ సమతలమైన ఇళ్ల పైకప్పుల మీద నుంచి బహిరంగంగా ప్రకటించే దృశ్యం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: కాబట్టి
  rationale: ముందటి వాక్యంలో దాచబడినది బయలుపడుతుందనే మాటనుంచి వచ్చే నిర్ధారణను ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ὅσα
  choice: చెప్పినదంతా
  rationale: రహస్యంగా చెప్పిన సమస్తాన్ని సమగ్రంగా సూచించే అనిర్దిష్ట సంబంధార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ σκοτίᾳ
  choice: చీకటిలో
  rationale: రహస్యత అనే రూపకాలంకారాన్ని నిలుపుతూ, ‘వెలుగులో’ అనే వ్యతిరేక చిత్రంతో నేరుగా సరిపోతుంది.
- source_word: ἀκουσθήσεται
  choice: వినబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతుంది; ఎవరు వినిపిస్తారో లేదా ఎప్పుడు వెల్లడవుతుందో అదనంగా నిర్ధారించదు.
- source_word: πρὸς τὸ οὖς
  choice: చెవిలో
  rationale: ఎవరికో రహస్యంగా గుసగుసగా చెప్పడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ మూలంలోని సజీవ చిత్రాన్ని కాపాడుతుంది.
- source_word: ἐν τοῖς ταμείοις
  choice: లోపలి గదుల్లో
  rationale: ταμεῖον పదానికి ఉన్న అంతర్గది లేదా ఏకాంత గది భావాన్ని సందర్భానుసారంగా ఇస్తుంది; కేవలం నిల్వగదులనే అనవసరంగా పరిమితం చేయదు.
- source_word: κηρυχθήσεται
  choice: ప్రకటించబడుతుంది
  rationale: బహిరంగంగా చాటిచెప్పబడే భావాన్ని తెలియజేస్తుంది; మతపరమైన ‘ప్రసంగించబడుతుంది’ అనే సంకుచిత అర్థాన్ని రుద్దదు.
- source_word: ἐπὶ τῶν δωμάτων
  choice: ఇంటి పైకప్పుల మీద
  rationale: పురాతన సమతల పైకప్పుల మీద నిలబడి బహిరంగంగా ప్రకటించే దృశ్యాన్ని మూలానికి దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: రహస్యమైన మాటలు బయలుపడే స్వభావం మరియు సమయం
  choice: దాచినది బహిరంగమవుతుందనే హెచ్చరికగా అనువదించి, అది ప్రస్తుత చారిత్రక బహిర్గతమా, దైవ తీర్పులోనిదా, అంత్యకాల వెల్లడా అన్నది నిర్దిష్టం చేయలేదు.
  alternative: దీనిని కేవలం అంతిమ తీర్పులో జరిగే వెల్లడిగా లేదా కేవలం ప్రస్తుతకాలంలో కపటత్వం బయటపడటంగా పరిమితం చేయడం.
  rationale: తక్షణ సందర్భం కపటత్వం బయలుపడటాన్ని సూచించినా, ఈ వాక్యం వెల్లడయ్యే సమయాన్ని లేదా విధానాన్ని స్వయంగా సంకుచితం చేయదు; అందువల్ల మూలంలోని ధార్మిక ఉద్వేగం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘చీకటిలో—వెలుగులో’ అనే అలంకార వ్యతిరేకతను, ‘లోపలి గదులు—పైకప్పులు’ అనే రహస్యతనుంచి బహిరంగతకు మారే దృశ్యాన్ని నిలిపాం. ప్రధాన పాఠ్యంలో [a] సూచికను సంబంధిత వాక్యాంతంలో ఉంచాం.
