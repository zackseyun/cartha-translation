id: LUK.12.19
reference: Luke 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: te
  text: 'నా ప్రాణంతో ఇలా చెప్పుకుంటాను: ‘ప్రాణమా, నీకు అనేక సంవత్సరాలకు సరిపడే ఎన్నో మంచి వస్తువులు నిల్వ ఉన్నాయి. విశ్రాంతి తీసుకో, తిను, తాగు, ఆనందించు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρῶ
  choice: అంటాను
  rationale: λέγω యొక్క భవిష్యత్తు రూపాన్ని తెలుగులో సహజమైన ప్రత్యక్ష భవిష్యత్ వాక్యంగా అందిస్తుంది.
- source_word: ψυχῇ / Ψυχή
  choice: నా ప్రాణంతో / ప్రాణమా
  rationale: ఇక్కడ తన అంతరంగ స్వరూపాన్నే సంబోధిస్తున్నాడు. ‘ప్రాణం’ ψυχή యొక్క విస్తృత భావాన్ని, స్వీయ సంబోధనలోని అలంకార బలాన్ని కాపాడుతుంది; దీనిని సాంకేతిక మానవశాస్త్ర ప్రకటనగా పరిమితం చేయదు.
- source_word: ἀγαθὰ
  choice: మంచి వస్తువులు
  rationale: సందర్భంలో నిల్వచేసిన భౌతిక సంపదను సూచిస్తూనే, మూలపదంలోని విస్తృత ‘మంచివి’ అనే భావాన్ని నిలుపుతుంది.
- source_word: κείμενα
  choice: నిల్వ ఉన్నాయి
  rationale: κεῖμαι ఇక్కడ భవిష్యత్తు కోసం ఉంచబడిన వస్తువుల స్థితిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నిల్వ ఉన్నాయి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: εἰς ἔτη πολλά
  choice: అనేక సంవత్సరాలకు సరిపడా
  rationale: నిల్వలు అనేక సంవత్సరాలు ఉపయోగపడతాయనే భవిష్యత్ కాలవ్యాప్తిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀναπαύου
  choice: విశ్రాంతి తీసుకో
  rationale: సుఖంగా, శ్రమలేకుండా ఉండమనే మధ్యమ విధ్యర్థక భావాన్ని ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: φάγε
  choice: తిను
  rationale: సరళమైన ఆజ్ఞార్థక రూపానికి నేర అనువాదం.
- source_word: πίε
  choice: తాగు
  rationale: సరళమైన ఆజ్ఞార్థక రూపానికి నేర అనువాదం.
- source_word: εὐφραίνου
  choice: ఆనందించు
  rationale: సంతోషంగా ఉండు, ఉల్లాసించు అనే భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది; సందర్భంలోని స్వీయసుఖ భావాన్ని పాఠకుడు గ్రహించేలా చేస్తూ అనవసర నైతిక వ్యాఖ్యను జోడించదు.
theological_decisions:
- issue: ఉపమానంలోని స్వీయ సంబోధనలో ψυχή అనువాదం
  choice: ప్రాణం
  alternative: అంతరంగం / నీవు
  rationale: ఈ వాక్యం మానవ నిర్మాణంపై సాంకేతిక సిద్ధాంతం చెప్పడం కాదు; ఒకడు తన అంతరంగ స్వరూపంతో మాట్లాడుతున్న దృశ్యం. ‘ప్రాణం’ మూలంలోని పదబంధాన్నీ దాని సాహిత్య, ధార్మిక ప్రతిధ్వనినీ కాపాడుతుంది; పాదటిప్పణి ఇతర సందర్భోచిత అర్థాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ధనవంతుడు తనను తాను సంబోధించుకునే వాక్చాతుర్యాన్ని నిలుపుతూ, చిన్న చిన్న ఆజ్ఞల వరుసను మూలంలాగే ఉంచింది.
