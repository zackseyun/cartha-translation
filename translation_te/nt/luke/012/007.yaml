id: LUK.12.7
reference: Luke 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: te
  text: అయితే, మీ తలమీదున్న వెంట్రుకలన్నీ కూడా లెక్కించబడి ఉన్నాయి. భయపడకండి; మీరు అనేక పిచ్చుకలకంటే ఎక్కువ విలువైనవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: అయితే, ... కూడా/అన్నీ
  rationale: ἀλλά ముందున్న ఆలోచనతో వ్యత్యాసాన్ని సూచిస్తుంది; καί ఇచ్చే తీవ్రతను తెలుగులో సహజమైన వాక్య నిర్మాణం మరియు ‘వెంట్రుకలన్నీ’ అనే సమగ్ర పదప్రయోగం ద్వారా వ్యక్తం చేశాం.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: మీ తల వెంట్రుకలన్నీ
  rationale: మూలంలోని స్పష్టమైన శరీరచిత్రాన్నీ, πᾶσαι యొక్క సమగ్ర భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἠρίθμηνται
  choice: లెక్కించబడి ఉన్నాయి
  rationale: పూర్తయిన క్రియకు ప్రస్తుతం కొనసాగుతున్న ఫలితాన్ని సూచించే గ్రీకు perfect passive భావాన్ని నిలుపుతుంది; దేవుడే లెక్కించినవాడని సందర్భం సూచించినా, మూలంలోని కర్మణి ప్రయోగాన్ని అలాగే ఉంచుతుంది.
- source_word: μὴ φοβεῖσθε
  choice: భయపడకండి
  rationale: బహువచన నిషేధ ఆజ్ఞను నేరుగా, సహజంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πολλῶν στρουθίων
  choice: అనేక పిచ్చుకలు
  rationale: సమీప సందర్భంలోని అదే చిన్న పక్షులను సూచిస్తూ στρουθίονకు నిర్దిష్టమైన అర్థాన్ని నిలుపుతుంది.
- source_word: διαφέρετε
  choice: విలువైనవారు
  rationale: ఈ సందర్భంలో కేవలం ‘భిన్నంగా ఉండడం’ కాక, తులనాత్మక విలువను సూచిస్తుంది; ‘కంటే’తో కలిసి ‘more valuable than’ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: మనుషుల విలువను పిచ్చుకల విలువతో పోల్చడం
  choice: మీరు అనేక పిచ్చుకలకంటే విలువైనవారు
  alternative: మీరు అనేక పిచ్చుకలను మించివున్నారు
  rationale: సందర్భంలోని తక్కువదాని నుంచి ఎక్కువదానికి చేసే వాదనను స్పష్టంగా తెలియజేస్తుంది. అదే సమయంలో మానవ విలువ గురించి వాక్యం చెప్పేదానికంటే విస్తృతమైన తాత్త్విక నిర్ధారణను చేర్చదు.
- issue: వెంట్రుకలను లెక్కించిన కర్త
  choice: కర్మణి రూపాన్ని నిలుపుతూ ‘లెక్కించబడి ఉన్నాయి’
  alternative: దేవుడు మీ తల వెంట్రుకలన్నిటినీ లెక్కించాడు
  rationale: సందర్భం దేవుని జ్ఞానాన్ని సూచించినప్పటికీ, గ్రీకు మూలం కర్తను ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల అంతర్లీన కర్తను పాఠ్యంలో బహిర్గతం చేయకుండా మూలంలోని భావసూక్ష్మతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలిలో ఉంది. ‘భయపడకండి’ బహువచన సంబోధనను సహజంగా నిలుపుతుంది; వాక్య నిర్మాణం సంక్షిప్తంగా ఉండి మూలంలోని ధైర్యపరిచే స్వరాన్ని కాపాడుతుంది.
