revisions:
- from: అయితే, మీ తల వెంట్రుకలన్నీ లెక్కించబడి ఉన్నాయి.[a] భయపడకండి; మీరు అనేక పిచ్చుకలకంటే విలువైనవారు.[b]
  to: అయితే, మీ తలమీదున్న వెంట్రుకలన్నీ కూడా లెక్కించబడి ఉన్నాయి. భయపడకండి; మీరు అనేక పిచ్చుకలకంటే ఎక్కువ విలువైనవారు.
  rationale: The revision retains the source’s passive-perfect assurance and direct plural command, while adding “కూడా” for καί and “ఎక్కువ” for the comparative force of διαφέρετε. Footnotes are omitted because no unresolved source ambiguity or textual issue requires annotation here.
  reviewer_model: gpt-5.6-terra
