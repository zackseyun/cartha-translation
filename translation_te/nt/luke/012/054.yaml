revisions:
- from: 'ఆయన జనసమూహాలతో కూడా ఇలా చెబుతూ ఉన్నాడు: “పడమట మేఘం పైకి రావడం మీరు చూడగానే, ‘వాన కురవబోతోంది[a]’ అని అంటారు; అలాగే జరుగుతుంది.”'
  to: 'ఆయన జనసమూహాలకు కూడా ఇలా చెబుతూ ఉన్నాడు: “పడమట ఒక మేఘం లేవడాన్ని మీరు చూసినప్పుడు, వెంటనే, ‘వాన వస్తోంది[a]’ అని అంటారు; అలాగే జరుగుతుంది.”'
  rationale: జనసమూహాలకు ద్వారా మూలంలోని దాతివ్ సంబోధనను స్పష్టపరిచాం. చూసినప్పుడు మరియు వెంటనే అనే పదాలతో ὅταν మరియు εὐθέως యొక్క వేర్వేరు పాత్రలను నిలిపాం. మిగతా భావం, కొనసాగుతున్న కథనంలోని ‘చెబుతూ ఉన్నాడు’ అనే అసంపూర్ణ-భూతకాల ఛాయ, అలాగే ὄμβρος యొక్క విస్తృతార్థం పాదసూచికలో యథాతథంగా భద్రపరచబడ్డాయి.
