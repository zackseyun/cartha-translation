  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: te
  text: 'ఆయన జనసమూహాలకు కూడా ఇలా చెబుతూ ఉన్నాడు: “పడమట ఒక మేఘం లేవడాన్ని మీరు చూసినప్పుడు, వెంటనే, ‘వాన వస్తోంది[a]’ అని అంటారు; అలాగే జరుగుతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కుండపోత వాన వస్తోంది.” గ్రీకు ὄμβρος అనే పదం సాధారణంగా వానను గానీ, ప్రత్యేకంగా భారీ వర్షం లేదా కుండపోతను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం నేపథ్యంలోని కొనసాగుతున్న మాటను సూచిస్తుంది; తెలుగు కథనంలో ‘చెబుతూ ఉన్నాడు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: ముందటి ప్రసంగానికి కొనసాగింపుతో కూడిన అదనపు సంబోధనను సూచిస్తుంది; ‘కూడా’ దాని additive force‌ను అనవసర భారంలేకుండా అందిస్తుంది.
- source_word: τοῖς ὄχλοις
  choice: జనసమూహాలతో
  rationale: గ్రీకులో బహువచనం స్పష్టంగా ఉంది. ‘జనసమూహాలతో’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ బహువచన భావాన్ని నిలుపుతుంది.
- source_word: Ὅταν ἴδητε
  choice: మీరు చూడగానే
  rationale: ὅταν తో వచ్చిన subjunctive సాధారణంగా జరిగే సందర్భాన్ని సూచిస్తుంది. ‘చూడగానే’ ఆ సందర్భాన్నీ వెంటనే పలికే ప్రతిస్పందనతో ఉన్న సంబంధాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νεφέλην
  choice: మేఘం
  rationale: మూలపదం సాధారణంగా ‘మేఘం’ అని మాత్రమే అర్థం; వానమేఘం అనే వివరాన్ని సందర్భమే అందిస్తుంది కాబట్టి దాన్ని పాఠ్యంలో చేర్చలేదు.
- source_word: ἀνατέλλουσαν
  choice: పైకి రావడం
  rationale: ఈ participle పైకి లేవడం లేదా ఉదయించడాన్ని సూచిస్తుంది; మేఘానికి సంబంధించి ‘పైకి రావడం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἐπὶ δυσμῶν
  choice: పడమట
  rationale: పడమటి దిశ లేదా ప్రాంతాన్ని సూచించే మాటను వాతావరణ పరిశీలన సందర్భంలో సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ‘పడమటి నుంచి’ అనే భావమూ సాధ్యమే.
- source_word: εὐθέως
  choice: చూడగానే
  rationale: ‘వెంటనే’ అనే భావాన్ని తెలుగు వాక్యంలో కాలసంబంధ ప్రత్యయంతో సహజంగా సమన్వయపరిచింది.
- source_word: λέγετε
  choice: అని అంటారు
  rationale: వర్తమాన సూచక రూపం అలవాటుగా జరిగే చర్యను తెలుపుతుంది; తెలుగు సాధారణ వర్తమానం అదే భావాన్ని అందిస్తుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉల్లేఖనాన్ని పరిచయం చేసే ‘అని’
  rationale: ఇక్కడ ὅτι వారు పలికే విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ఉల్లేఖనం తరువాత ‘అని’ సహజ నిర్మాణం.
- source_word: Ὄμβρος
  choice: వాన
  rationale: ὄμβρος సాధారణ వానను లేదా మరింత బలమైన వర్షాన్ని సూచించవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన, విస్తృతార్థకమైన ‘వాన’ను ఉంచి, ‘కుండపోత వాన’ అవకాశాన్ని పాదసూచికలో తెలిపింది.
- source_word: ἔρχεται
  choice: కురవబోతోంది
  rationale: రాబోయే వాన యొక్క సమీపత్వాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; వాన ‘వస్తోంది’ కంటే ‘కురవబోతోంది’ సాధారణ ప్రయోగం.
- source_word: καὶ γίνεται οὕτως
  choice: అలాగే జరుగుతుంది
  rationale: వారి అంచనా నిజమవుతుందని మూలంలోని సరళమైన నిర్ధారణను నేరుగా నిలుపుతుంది.
