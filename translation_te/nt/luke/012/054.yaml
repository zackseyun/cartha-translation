translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి ఉపయోగించబడింది. మూలంలోని బహువచనం, అసంపూర్ణ భూతకాల భావం, వాతావరణ పరిశీలనలోని సహజత్వం నిలుపబడ్డాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
