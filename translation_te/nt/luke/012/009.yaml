source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: te
  text: కాని మనుషుల ఎదుట నన్ను నిరాకరించేవాడు దేవుని దూతల ఎదుట నిరాకరించబడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిరాకరించబడతాడు’ అనే కర్మణి క్రియను ఎవరు చేస్తారో గ్రీకు పాఠం స్పష్టంగా చెప్పదు.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός με
  choice: కాని ... నన్ను నిరాకరించేవాడు
  rationale: δὲ ముందటి వాక్యంతో ఉన్న వ్యత్యాసాన్ని చూపుతుంది. ఆర్టికల్‌తో వచ్చిన ఏఓరిస్ట్ పార్టిసిపుల్ సాధారణ సూత్రాన్ని తెలిపే వ్యక్తివాచకంగా ఉంది; ఆధునిక తెలుగులో ‘నిరాకరించేవాడు’ సహజంగా ఉంటుంది. μεను ‘నన్ను’గా స్పష్టంగా ఉంచాం.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: మనుషుల ఎదుట
  rationale: ἐνώπιονకు ‘ఎదుట’ సంక్షిప్తమైన, సహజమైన సమానం. ἄνθρωποι లింగభేదం లేకుండా మానవులను సూచిస్తూ దేవుని దూతలతో వ్యత్యాసాన్ని ఏర్పరుస్తుంది; ‘మనుషులు’ ఆ భావాన్ని కాపాడుతుంది.
- source_word: ἀπαρνηθήσεται
  choice: నిరాకరించబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని అలాగే ఉంచి, క్రియను చేసేవారు ఎవరో మూలపాఠం చెప్పని అనిశ్చితిని కాపాడాం. ‘నిరాకరించేవాడు ... నిరాకరించబడతాడు’ అనే పదబంధ సంబంధం గ్రీకు వాక్యంలోని గంభీరమైన ప్రతిఫల సమాంతరాన్ని నిలుపుతుంది.
- source_word: ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ
  choice: దేవుని దూతల ఎదుట
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని సహజమైన తెలుగులో నేరుగా అందిస్తూ పరలోక సభాసందర్భాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘నిరాకరించబడతాడు’ అనే కర్మణి క్రియలో సూచిత కర్త ఎవరు?
  choice: యేసు లేదా దేవుడు అని స్పష్టమైన కర్తను చేర్చకుండా కర్మణి రూపాన్నే ఉంచడం
  alternative: ‘మనుష్యకుమారుడు అతన్ని నిరాకరిస్తాడు’ లేదా ‘దేవుడు అతన్ని నిరాకరిస్తాడు’ అని అర్థాన్ని నిర్దిష్టం చేయడం
  rationale: గ్రీకు పాఠం కర్తను పేర్కొనలేదు. సమీప సందర్భం ఆధారంగా పాఠకులు ఒక కర్తను ఊహించవచ్చు; అయినా ఈ వచనంలో ఉన్న ధార్మిక ఉద్విగ్నతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్యంలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘మనుషులు’ సమస్త మానవులను సూచిస్తుంది; లింగపరంగా పరిమితం కాదు.
