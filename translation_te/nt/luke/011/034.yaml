id: LUK.11.34
reference: Luke 11:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: te
  text: నీ శరీరానికి దీపం నీ కన్ను. నీ కన్ను ఆరోగ్యంగా[a] ఉన్నప్పుడు, నీ శరీరమంతా కూడా వెలుగుతో నిండి ఉంటుంది; కానీ నీ కన్ను చెడ్డగా[b] ఉన్నప్పుడు, నీ శరీరం కూడా చీకటిగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్పష్టమైనది,’ ‘స్వస్థమైనది’; సంప్రదాయ అక్షరార్థంలో ‘ఏకమైనది.’ గ్రీకు విశేషణం అవిభక్తమైన లేదా సక్రమమైన స్థితి అనే భావాన్ని కలిగి ఉండవచ్చు; ఇక్కడ అది ‘చెడ్డ’ కన్నుకు వ్యతిరేకంగా కన్నును వర్ణిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దుష్టమైనది.’ గ్రీకు పదానికి ‘చెడ్డ’ లేదా ‘దుష్ట’ అనే అర్థాలు ఉన్నాయి; ఇక్కడ అది లోపమున్న కన్నునూ, నైతికంగా వక్రీకృతమైన చూపునూ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: దీపం
  rationale: ఇది అమూర్తమైన ‘వెలుగు’ను కాకుండా వెలుగునిచ్చే దీపాన్ని సూచిస్తుంది; అందువల్ల మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: ఇక్కడ ప్రాథమికంగా భౌతిక శరీరాన్నే సూచిస్తూ, గ్రహణశక్తి మరియు అంతరంగ స్థితికి సంబంధించిన రూపకంలో ఉపయోగించబడింది.
- source_word: ὀφθαλμός
  choice: కన్ను
  rationale: శరీర అవయవాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం; మూలంలోని కన్ను–దీపం రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: ὅταν ... ᾖ
  choice: ఉన్నప్పుడు
  rationale: సాధారణంగా వర్తించే కాలార్థక-షరతార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἁπλοῦς
  choice: ఆరోగ్యంగా
  rationale: πονηρόςతో ఉన్న వ్యతిరేకతలో, సరిగా పనిచేసే లేదా స్వస్థమైన కన్ను అనే భావాన్ని పాఠకులకు స్పష్టంగా అందిస్తుంది; ‘ఏకమైన’ వంటి అక్షరార్థ రూపం ఆధునిక తెలుగులో అస్పష్టంగా ఉంటుంది.
- source_word: ὅλον ... φωτεινόν
  choice: శరీరమంతా కూడా వెలుగుతో నిండి ఉంటుంది
  rationale: φωτεινόςలోని ‘వెలుగుతో నిండిన/ప్రకాశవంతమైన’ భావాన్ని సహజంగా వ్యక్తం చేస్తూ వెలుగు రూపకాన్ని కాపాడుతుంది.
- source_word: ἐπὰν δὲ
  choice: కానీ ... ఉన్నప్పుడు
  rationale: ముందటి కాలార్థక-షరతార్థక వాక్యానికి సమాంతరంగా వ్యతిరేక పరిస్థితిని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: πονηρός
  choice: చెడ్డదిగా
  rationale: ఈ పదంలోని ‘చెడ్డ’ మరియు ‘దుష్ట’ అనే అర్థవ్యాప్తిని పూర్తిగా ఒక వైపుకు పరిమితం చేయకుండా, కన్ను సరిగా లేకపోవడం మరియు నైతికంగా వక్రీకృతమైన చూపు అనే రెండు సూచనలకు చోటిస్తుంది.
- source_word: σκοτεινόν
  choice: చీకటిగా
  rationale: ‘వెలుగుతో నిండి’ అనే భావానికి స్పష్టమైన వ్యతిరేకతను సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నీ కన్ను ἁπλοῦς’ అనే పదబంధంలోని ἁπλοῦς భావం
  choice: ప్రధాన పాఠ్యంలో ‘ఆరోగ్యంగా’
  alternative: ‘స్పష్టంగా,’ ‘సవ్యంగా,’ లేదా సంప్రదాయ అక్షరార్థంలో ‘ఏకంగా’
  rationale: కన్ను శరీరానికి దీపమని చెప్పే తక్షణ రూపకంలో, సరిగా పనిచేసే కన్ను అనే భావం ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది. అదే సమయంలో పాదసూచిక ద్వారా అవిభక్తత లేదా సరళతకు సంబంధించిన మూలపదపు విస్తృత భావాన్ని నిలుపుతున్నాం.
- issue: కన్నును వర్ణించే πονηρόςలో క్రియాత్మక మరియు నైతిక భావాల మధ్య ఉద్రిక్తత
  choice: ప్రధాన పాఠ్యంలో ‘చెడ్డదిగా’
  alternative: ‘దుష్టంగా,’ ‘అనారోగ్యంగా,’ లేదా ‘లోపంగా’
  rationale: ‘దుష్టంగా’ అనడం నైతిక భావాన్నే ముందుకు తెస్తుంది; ‘అనారోగ్యంగా’ అనడం శారీరక లోపానికే పరిమితం చేస్తుంది. ‘చెడ్డదిగా’ అనే విస్తృత పదం రెండు అవకాశాలను తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని దీపం–కన్ను–శరీరం–వెలుగు/చీకటి రూపక నిర్మాణాన్ని, రెండు సమాంతర పరిస్థితులను నిలిపాం. అస్పష్ట సర్వనామాన్ని నివారించేందుకు రెండో వ్యతిరేక వాక్యంలో ‘నీ కన్ను’ను మళ్లీ పేర్కొన్నాం.
