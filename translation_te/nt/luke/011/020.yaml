source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: te
  text: అయితే నేను దేవుని వేలితో[a] దయ్యాలను వెళ్లగొడుతున్నట్లయితే, దేవుని రాజ్యం మీ దగ్గరకు చేరింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని వేలు ద్వారా.’ ఇది దేవుని ప్రత్యక్ష శక్తిని సూచించే రూపకం; నిర్గమకాండము 8:19ను ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative_and_intertext
  - marker: b
    text: లేదా, ‘మీ మీదికి వచ్చింది’ లేదా ‘మిమ్మల్ని చేరుకుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: దేవుని వేలితో
  rationale: ἐν ఇక్కడ సాధనం/కారకత్వాన్ని సూచిస్తుంది. ఈ అనువాదం దేవుని ప్రత్యక్ష శక్తిని సూచించే స్పష్టమైన రూపకాన్ని, నిర్గమకాండము 8:19 ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἐκβάλλω
  choice: వెళ్లగొడుతున్నాను
  rationale: దయ్యాలను బలవంతంగా బయటకు పంపడం అనే సువార్తలలోని సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὰ δαιμόνια
  choice: దయ్యాలను
  rationale: δαιμόνιαకు నేరమైన తెలుగు సమానార్థకం; వేరే గ్రీకు పదబంధమైన ‘అపవిత్రాత్మలు’ అనే అర్థాన్ని దిగుమతి చేయదు.
- source_word: ἄρα
  choice: అంటే
  rationale: షరతు నుంచి వచ్చే నిర్ధారణను సహజమైన తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా సూచిస్తుంది.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: మీ మీదికి వచ్చేసింది
  rationale: ἐπί యొక్క దిశాత్మక భావాన్ని, ἔφθασεν సూచించే నిర్ణాయకంగా చేరిన స్థితిని నిలుపుతుంది; ‘వచ్చేసింది’ ప్రస్తుతానికి సంభవించిన రాకను సహజంగా తెలియజేస్తుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: βασιλείαలోని రాజ్యం మరియు రాజపాలన అనే భావ విస్తృతిని అనవసరంగా ఒకే వివరణకు పరిమితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని వేలు’ అనే మాట భావం
  choice: యేసు దయ్యాలను వెళ్లగొట్టడంలో దేవుని ప్రత్యక్ష శక్తి/కార్యాన్ని సూచించే రూపకంగా ఉన్నట్టే అనువదించడం
  alternative: మత్తయి 12:28తో పోల్చి దీన్ని పరిశుద్ధాత్మకు ప్రత్యక్ష సూచనగా ప్రధాన పాఠ్యంలో మార్చడం
  rationale: లూకా ఉపయోగించిన ప్రత్యేక రూపకాన్ని, దాని నిర్గమకాండ సంబంధిత ప్రతిధ్వనిని నిలుపాలి; వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చి మత్తయి పదప్రయోగంతో కలపకూడదు.
- issue: ‘దేవుని రాజ్యం మీ మీదికి వచ్చేసింది’ అనే ప్రకటన కాలబలం
  choice: యేసు పరిచర్యలో దేవుని రాజ్యం ఇప్పటికే నిర్ణాయకంగా చేరిందనే భావాన్ని నిలుపడం
  alternative: రాజ్యం పూర్తిగా భవిష్యత్తులో మాత్రమే ఉందని లేదా ఈ మాట కేవలం తీర్పుగా ‘మిమ్మల్ని పట్టుకుంది’ అని అనువదించడం
  rationale: ἔφθασεν సందర్భంలో సంభవించిన రాకను సూచిస్తుంది. అనువాదం ఆ వర్తమాన ప్రవేశాన్ని తెలిపినా, సంపూర్ణ అంత్యకాల వ్యవస్థను అదనంగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు రూపకం మరియు రాజ్యం నిర్ణాయకంగా చేరిన భావం రెండూ నిలుపబడ్డాయి; [a], [b] గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
