  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: te
  text: బుద్ధిహీనులారా! బయటిదాన్ని చేసినవాడే లోపలిదాన్ని కూడా చేయలేదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బాహ్యమైనదాన్ని … అంతరంగమైనదాన్ని.’ ఈ మాటలు తక్షణ సందర్భంలో పాత్ర బయటిభాగాన్నీ లోపలిభాగాన్నీ సూచించవచ్చు; విస్తృతార్థంలో మనిషి బాహ్య జీవితాన్నీ అంతరంగ జీవితాన్నీ కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: బుద్ధిహీనులారా
  rationale: సంబోధనార్థక బహువచన విశేషణం నామవాచకంగా వాడబడింది. ఈ రూపం యేసు పలికిన గట్టి మందలింపును సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὐχ ... ἐποίησεν;
  choice: చేయలేదా?
  rationale: ప్రతికూల ప్రశ్న సానుకూల సమాధానాన్ని ఆశిస్తుంది. తెలుగు ప్రశ్నారూపం మూలంలోని వాదనాత్మక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ ποιήσας
  choice: చేసినవాడే
  rationale: నామవాచకంగా పనిచేసే ఆర్టికల్‌తో కూడిన భూతకాల కృదంతాన్ని వ్యక్తిగత సూచనతో అనువదిస్తుంది. మూలంలో లేని ‘దేవుడు’ అనే పదాన్ని చేర్చకుండా సూచనను నిలుపుతుంది.
- source_word: τὸ ἔξωθεν
  choice: బయటిదాన్ని
  rationale: తక్షణ సందర్భంలో పాత్ర బయటిభాగానికీ, విస్తృతార్థంలో మనిషి బాహ్య జీవితానికీ వర్తించగల సంక్షిప్తమైన సహజ పదప్రయోగం.
- source_word: τὸ ἔσωθεν
  choice: లోపలిదాన్ని
  rationale: ‘బయటిది’కి సమాంతరంగా ఉండి, పాత్ర లోపలిభాగం మరియు అంతరంగ నైతిక జీవితం అనే రెండు భావసాధ్యతలను నిలుపుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: బయటిదాన్ని చేసినవాడు లోపలిదాన్ని సైతం చేశాడనే ప్రశ్నలోని తార్కిక అనుసంధానాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘చేసినవాడు’ అనే పదానికి సూచిత వ్యక్తి
  choice: సృష్టికర్తయైన దేవుని పరోక్ష సూచనను ఉంచి, ‘దేవుడు’ అని స్పష్టంగా చేర్చలేదు.
  alternative: ఇది కేవలం పాత్రను తయారుచేసిన వ్యక్తిని సూచిస్తున్నట్లు అనువదించడం.
  rationale: వాక్యం పాత్ర ఉదాహరణ స్థాయిలో పనిచేస్తూనే, బాహ్యాన్నీ అంతరంగాన్నీ చేసిన సృష్టికర్తను సూచిస్తుంది. సాధారణ పదరూపాన్ని నిలపడం ద్వారా తక్షణ దృశ్యాన్నీ వేదాంత సూచననూ పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘బుద్ధిహీనులారా’ గట్టి ప్రత్యక్ష మందలింపును కాపాడుతుంది; ‘బయటిది/లోపలిది’ తక్షణ పాత్ర-రూపకానికీ విస్తృత మానవ అన్వయానికీ వీలు కల్పిస్తాయి.
