translation:
  language: te
  text: మా రోజువారీ రొట్టెను మాకు ప్రతిరోజూ ఇవ్వు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రోజువారీ’ అని అనువదించిన గ్రీకు విశేషణం అరుదైనది, దాని అర్థం వివాదాస్పదం. దీనిని ‘రాబోయే రోజుకు కావలసిన రొట్టె’ లేదా ‘జీవనానికి అవసరమైన రొట్టె’ అని కూడా అనువదించవచ్చు; ఈ సందర్భంలో తక్కువ సంభావ్యమైన మరో అర్థం ‘అతిసారభూతమైన రొట్టె.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: ఆహారాన్ని
  rationale: ἄρτος అక్షరార్థంగా ‘రొట్టె’; అయితే ప్రార్థన సందర్భంలో అది ప్రాథమిక పోషణకు ప్రతినిధిగా నిలుస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘ఆహారం’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; ‘రొట్టె’ అనే అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἡμῶν
  choice: మాకు కావలసిన
  rationale: గ్రీకులో ఇది ‘మన/మా’ అనే స్వామ్యార్థం. తెలుగులో ‘మా రోజువారీ ఆహారం’ కన్నా, అవసరమైన పోషణ భావంతో ‘మాకు కావలసిన’ అనడం సహజం; అయితే ఇది ἐπιούσιον యొక్క ‘అవసరమైన’ అర్థసంభావ్యతతో కొంత కలిసిపోతుంది.
- source_word: ἐπιούσιον
  choice: రోజువారీ
  rationale: అత్యంత అరుదైన, వివాదాస్పదమైన ఈ విశేషణానికి ‘రోజువారీ’ అనేది లూకా వాక్యంలోని τὸ καθ’ ἡμέραν తో సరిపడే స్పష్టమైన ప్రధాన పాఠం. ఇతర సాధ్యార్థాలను పాదసూచికలో భద్రపరిచాం.
- source_word: δίδου
  choice: ఇవ్వు
  rationale: వర్తమాన ఆజ్ఞారూపం కొనసాగుతూ లేదా అలవాటుగా ఇవ్వడాన్ని సూచించవచ్చు. ‘ప్రతిరోజూ’ ఆ పునరావృత భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἡμῖν
  choice: మాకు
  rationale: ఆజ్ఞాక్రియకు సహజమైన పరోక్ష కర్మ.
- source_word: τὸ καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: రోజురోజుకూ పునరావృతమయ్యే అనుగ్రహాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రభువు ప్రార్థనలో ἐπιούσιον అర్థం
  choice: రోజువారీ
  alternative: రాబోయే రోజుకు కావలసినది; జీవనానికి అవసరమైనది; సాధారణానికి మించినది
  rationale: ఈ విశేషణం నిఘంటుపరంగా వివాదాస్పదమైనదే. అయితే లూకా చేర్చిన τὸ καθ’ ἡμέραν సాధారణ దినదిన పోషణ భావానికి బలం ఇస్తుంది. ప్రధాన పాఠంలో ఏదైనా సంస్కారపరమైన లేదా అధిభౌతిక వ్యాఖ్యానాన్ని బలవంతంగా చేర్చకుండా, నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, ప్రార్థనకు తగిన గౌరవప్రదమైన ఏకవచన సంబోధనా శైలిని వాడాం. ‘ఆహారం’ సాధారణ పాఠకుడికి ప్రాథమిక పోషణ భావాన్ని సహజంగా అందిస్తుంది; మూలంలోని ‘రొట్టె’ను పాదసూచికలో స్పష్టంగా చూపించాం.
