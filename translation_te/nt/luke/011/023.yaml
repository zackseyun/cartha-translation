id: LUK.11.23
reference: Luke 11:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: te
  text: నాతో లేనివాడు నాకు వ్యతిరేకంగా ఉంటాడు; మరియు నాతో కలిసి కూడగట్టనివాడు చెదరగొడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఎవడు నాతో లేడో వాడు నాకు వ్యతిరేకంగా ఉంటాడు; ఎవడు నాతో కలిసి కూడగట్టడో వాడు చెదరగొడతాడు.”'
    reason: గ్రీకులోని ఆర్టికల్‌తో కూడిన కృదంతాలను తెలుగులో సంబంధవాక్య నిర్మాణంతో వ్యక్తం చేసే సహజ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: లేనివాడు
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతం వ్యక్తిని సాధారణ ఏకవచనంగా సూచిస్తుంది. ‘లేనివాడు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో / నాతో కూడ
  rationale: γενitiveతో μετά సహవాసం లేదా అనుబంధాన్ని సూచిస్తుంది. మొదటి వాక్యంలో ‘నాతో’, రెండవ వాక్యంలో క్రియతో అనుబంధం స్పష్టమయ్యేలా ‘నాతో కూడ’ వాడబడింది.
- source_word: κατ’ ἐμοῦ
  choice: నాకు విరోధంగా
  rationale: ఇక్కడ κατά వ్యతిరేకతను వ్యక్తం చేస్తుంది. ‘నాకు విరోధంగా’ అనేది ‘నాతో’ అనే పదబంధానికి స్పష్టమైన వ్యతిరేక సమాంతరాన్ని ఇస్తుంది.
- source_word: συνάγων
  choice: సమకూర్చనివాడు
  rationale: సమూహంగా చేర్చడం లేదా ఒకచోటికి కూడగట్టడం అనే భావాన్ని ఇస్తుంది. ‘సమకూర్చు’ పదం ‘చెదరగొట్టు’తో ఉన్న రూపక విరుద్ధతను సహజంగా నిలుపుతుంది.
- source_word: σκορπίζει
  choice: చెదరగొడుతున్నాడు
  rationale: చెదరగొట్టడం లేదా విస్తరింపజేయడం అనే క్రియాశీల భావాన్ని కాపాడుతుంది; వర్తమాన కాలపు నిరంతర/లక్షణాత్మక శక్తిని కూడా ప్రతిబింబిస్తుంది.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకు καὶ రెండు సమాంతర వాక్యాలను కలుపుతుంది. తెలుగులో అర్థసంబంధాన్ని విరామచిహ్నం సహజంగా మోస్తుంది; కావాలంటే ‘మరియు’తోనూ అనువదించవచ్చు.
theological_decisions:
- issue: యేసు పట్ల తటస్థతకు అవకాశం ఉందా అనే వాక్యపు బలం
  choice: యేసుతో లేని వ్యక్తి ఆయనకు విరోధంగా ఉన్నాడనే నిర్దిష్ట ద్వంద్వాన్ని యథాతథంగా ఉంచడం
  alternative: కేవలం సహాయం చేయకపోవడం లేదా ఒక నిర్దిష్ట భూతవైద్య సందర్భానికే పరిమితమైన మృదువైన భావంగా చెప్పడం
  rationale: గ్రీకు వాక్యం నిరపేక్షమైన రూపంలో ఉంది. తరువాతి సిద్ధాంతపరమైన నిర్ణయాలను చేర్చకుండా, దాని కఠినమైన ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
- issue: ‘సమకూర్చడం’ యొక్క రూపకార్థ వస్తువు
  choice: గ్రీకులో కర్మ పేర్కొనబడనందున తెలుగులోనూ దానిని పేర్కొనకుండా ఉంచడం
  alternative: ప్రజలను, పంటను, లేదా శిష్యులను సమకూర్చడం అని స్పష్టీకరించడం
  rationale: మూలపాఠం దేనిని సమకూర్చుతాడో చెప్పదు. నిర్దిష్ట కర్మను చేర్చడం మూలంలోని నిజమైన విస్తృతతను అనవసరంగా పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యేసు పలుకులోని గంభీరతను నిలుపుతూ రూపొందించబడింది. సమాంతర నిర్మాణం మరియు ‘సమకూర్చు—చెదరగొట్టు’ విరుద్ధత కాపాడబడ్డాయి.
