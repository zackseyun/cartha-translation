    text: 'లేదా: “ఎవడు నాతో లేడో వాడు నాకు వ్యతిరేకంగా ఉంటాడు; ఎవడు నాతో కలిసి కూడగట్టడో వాడు చెదరగొడతాడు.”'
    reason: గ్రీకులోని ఆర్టికల్‌తో కూడిన కృదంతాలను తెలుగులో సంబంధవాక్య నిర్మాణంతో వ్యక్తం చేసే సహజ ప్రత్యామ్నాయం.
  revision_rationale: The revision preserves the source’s generic singular and present-characterizing force, explicitly renders καί, and uses a clearer modern Telugu expression for association in the second clause. The revised footnote offers a genuine structural alternative without changing ‘against me’ into ‘enemy.’
