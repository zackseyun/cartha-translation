revisions:
- from: నాతో లేనివాడు నాకు విరోధంగా ఉన్నాడు; నాతో కూడ సమకూర్చనివాడు చెదరగొడుతున్నాడు.[a]
  to: నాతో లేనివాడు నాకు వ్యతిరేకంగా ఉంటాడు; మరియు నాతో కలిసి కూడగట్టనివాడు చెదరగొడతాడు.[a]
  rationale: The revision preserves the source’s generic singular and present-characterizing force, explicitly renders καί, and uses a clearer modern Telugu expression for association in the second clause. The revised footnote offers a genuine structural alternative without changing ‘against me’ into ‘enemy.’
