  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: te
  text: ఆయన మూగ[a] దయ్యాన్ని వెళ్లగొడుతూ ఉన్నాడు. ఆ దయ్యం వెళ్లిపోయినప్పుడు, మూగవాడు మాట్లాడాడు; జనసమూహాలు ఆశ్చర్యపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మూగ’ అని అనువదించిన గ్రీకు పదానికి ‘చెవిటి’ అనే అర్థం కూడా రావచ్చు. అయితే దయ్యం వెళ్లిపోయిన తర్వాత ఆ వ్యక్తి మాట్లాడాడని సందర్భం చెబుతున్నందున ఇక్కడ ‘మూగ’ అనేది తగిన అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: వెళ్లగొడుతూ ఉన్నాడు
  rationale: ἦν + వర్తమాన కృదంతం గతంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δαιμόνιον
  choice: దయ్యం
  rationale: δαιμόνιον దుష్టాత్మసంబంధమైన అతీంద్రియ సత్తాను నేరుగా సూచిస్తుంది. ‘దయ్యం’ సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టమైన, సహజమైన పదం; ఈ వచనంలో లేని ‘అపవిత్రాత్మ’ అనే పదబంధాన్ని దిగుమతి చేయదు.
- source_word: κωφόν
  choice: మూగ
  rationale: κωφόςకు ‘చెవిటి’ లేదా ‘మూగ’ అనే అర్థాలు రావచ్చు. అయితే దయ్యం వెళ్లిన తర్వాత ఆ వ్యక్తి మాట్లాడాడని వెంటనే చెప్పడం వల్ల ఇక్కడ మాటలాడలేకపోవడమే ప్రధాన భావం.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: ఆ దయ్యం వెళ్లిపోయినప్పుడు
  rationale: దయ్యం బయటకు వెళ్లడం పూర్తైన తర్వాత జరిగిన ప్రధాన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; గ్రీకు కథన సూత్రాన్ని పదేపదే అనువదించి అసహజత కలిగించదు.
- source_word: ἐλάλησεν
  choice: మాట్లాడాడు
  rationale: λαλέω యొక్క సూటి అర్థాన్ని ఇస్తుంది; గ్రీకులో స్పష్టంగా లేని ‘మాట్లాడడం మొదలుపెట్టాడు’ అనే భావాన్ని చేర్చదు.
- source_word: ὁ κωφός
  choice: మూగవాడు
  rationale: వ్యక్తిని సూచించే నామవాచకప్రయోగ విశేషణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; సందర్భం పురుషుణ్ణి సూచిస్తున్నట్లు సంప్రదాయ పఠనం గ్రహించినా, గ్రీకు విశేషణ రూపమే వ్యాకరణపరంగా పుంలింగంలో ఉంది.
- source_word: ἐθαύμασαν
  choice: ఆశ్చర్యపోయాయి
  rationale: అద్భుతం చూసిన జనసమూహాల విస్మయాన్ని ఆధునిక, సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, ‘బహుజనులు’ వంటి తక్కువ సహజమైన రూపాలకన్నా స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: బాధ స్వభావం మరియు దయ్యాన్ని వెళ్లగొట్టడం
  choice: నిజమైన దయ్యాన్ని వెళ్లగొట్టగా వ్యక్తికి మాట తిరిగి వచ్చినట్లు పాఠ్యాన్ని అనువదించడం
  alternative: అతీంద్రియ ప్రస్తావనను తగ్గిస్తూ ‘దుష్టశక్తి’ వంటి అస్పష్ట పదాన్ని వాడడం
  rationale: గ్రీకు పాఠ్యం δαιμόνιον అని స్పష్టంగా పేర్కొని, అది వెళ్లిపోవడం తరువాత వ్యక్తి మాట్లాడాడని కథనం చెబుతుంది. అనువాదం ఈ వాదనను తగ్గించకూడదు, అలాగే అదనపు వివరణతో విస్తరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. కొనసాగుతున్న గత చర్యను ‘వెళ్లగొడుతూ ఉన్నాడు’తో, గ్రీకు బహువచనాన్ని ‘జనసమూహాలు’తో నిలిపింది. పాదసూచిక గుర్తు సంబంధిత అస్పష్ట పదమైన ‘మూగ’కు నేరుగా కాకుండా వాక్యాంతంలో ఉంచబడింది; ప్రచురణ రూపకల్పనలో అవసరమైతే ‘మూగ[a]’ వద్దకు మార్చవచ్చు.
