source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: te
  text: అప్పుడు అది వెళ్లి, తనకంటే ఎక్కువ దుష్టమైన వేరే ఏడు ఆత్మలను తన వెంట తీసుకుపోతుంది[a][b]. అవి అందులోకి ప్రవేశించి అక్కడ నివసిస్తాయి[c]. దాంతో ఆ మనిషి చివరి స్థితి[d] మొదటి స్థితికంటే మరింత అధ్వాన్నంగా అవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎక్కువ దుష్టమైన’ అనే మాటకు ‘మరింత చెడ్డవైన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ఇక్కడ ‘ఆత్మలు’ అనే పదమే ఉంది; ఈ వచనంలో వాటిని ప్రత్యేకంగా ‘దయ్యాలు’ లేదా ‘అపవిత్రాత్మలు’ అని అనలేదు, అయితే సందర్భం వాటి దుష్ట స్వభావాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పాఠంలో ‘ప్రవేశించి’ అనే పదం బహువచనంలో ఉండగా, ‘నివసిస్తుంది’ అనే క్రియ ఏకవచనంలో ఉంది. భావానుసారం ప్రధాన పాఠ్యంలో బహువచనం వాడబడింది.
    reason: textual_grammar
  - marker: d
    text: ‘చివరి స్థితి’ని ‘తరువాతి పరిస్థితి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని సంఘటనల క్రమాన్ని సహజంగా సూచించే కాలవాచక అనుసంధానం.
- source_word: πορεύεται καὶ παραλαμβάνει
  choice: వెళ్లి ... తనతో తీసుకొస్తుంది
  rationale: πορεύεται యొక్క గమనార్థాన్నీ, παραλαμβάνει లోని తన వెంట తీసుకెళ్లడం/తీసుకురావడం అనే సహచర్య భావాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἕτερα πνεύματα
  choice: వేరే ... ఆత్మలను
  rationale: ἕτερα ను ‘వేరే’గా, πνεύματα ను అదనపు విశేషణం చేర్చకుండా ‘ఆత్మలు’గా అనువదించింది.
- source_word: πονηρότερα ἑαυτοῦ ἑπτά
  choice: తనకంటే ఎక్కువ దుష్టమైన ... ఏడు
  rationale: తిరిగి వచ్చే ఆత్మతో పోలికను, ఏడు అనే సంఖ్యను యథాతథంగా నిలుపుతుంది.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: అవి లోపలికి ప్రవేశించి అక్కడ నివసిస్తాయి
  rationale: బహువచన కర్తను సహజంగా వ్యక్తం చేస్తూ ప్రవేశించడం తరువాత అక్కడ స్థిరంగా ఉండడాన్ని తెలుపుతుంది; గ్రీకులో κατοικεῖ ఏకవచనంగా ఉన్న పాఠ్య అసమతౌల్యాన్ని తెలుగులో కృత్రిమంగా పునరుత్పత్తి చేయలేదు.
- source_word: τὰ ἔσχατα ... χείρονα τῶν πρώτων
  choice: చివరి స్థితి మొదటి స్థితికంటే మరింత అధ్వాన్నంగా
  rationale: వ్యక్తి యొక్క తరువాతి/అంతిమ పరిస్థితిని ముందటి పరిస్థితితో పోల్చే గ్రీకు నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: ఆ మనిషి
  rationale: ఉపమానంలోని నిర్దిష్ట వ్యక్తిని సూచించే పదబంధాన్ని లింగసూచనతో నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: πνεύματα ను దయ్యాలు లేదా అపవిత్రాత్మలు అని స్పష్టీకరించాలా
  choice: ఆత్మలు
  alternative: దయ్యాలు / అపవిత్రాత్మలు
  rationale: ఈ వచనంలో ఉన్న పదం కేవలం ‘ఆత్మలు’; సందర్భం వాటి దుష్ట స్వభావాన్ని తెలియజేస్తున్నందున మూలంలో లేని విశేషణాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: πονηρότερα కు తెలుగు పదప్రయోగం
  choice: ఎక్కువ దుష్టమైన
  alternative: మరింత చెడ్డవైన
  rationale: నైతిక దుష్టత్వాన్ని స్పష్టంగా ఉంచి, hostile spirits అనే సందర్భాన్ని మసకబార్చకుండా పోలికను నిలుపుతుంది.
- issue: κατοικεῖ ఏకవచనం మరియు εἰσελθόντα బహువచనం మధ్య వ్యాకరణ ఉద్రిక్తత
  choice: అవి ... నివసిస్తాయి
  alternative: అది ... నివసిస్తుంది
  rationale: ప్రవేశించే ‘ఆత్మలు’ బహువచనంగా ఉన్నందున తెలుగు వాక్య నిర్మాణంలో బహువచనం సహజం; అయితే గ్రీకు పాఠంలోని ఏకవచన రూపాన్ని పాఠాంతర గమనికలో వెల్లడించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నివసిస్తాయి’, ‘చివరి స్థితి’, ‘అధ్వాన్నంగా’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని గంభీరతను నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
