  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన ప్రత్యక్ష ఆజ్ఞను ఉపయోగించాం. ‘వెలుగు–చీకటి’ రూపక వ్యత్యాసాన్ని సరళంగా, గౌరవప్రదంగా నిలిపాం.
