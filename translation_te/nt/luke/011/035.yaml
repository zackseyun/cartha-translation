review_pass:
  verdict: revise
  source_fidelity: The draft retains the light/darkness metaphor and the inferential force of οὖν. However, “చీకటిగా ఉండకుండా జాగ్రత్తపడు” can imply preventing the light from becoming darkness, whereas σκόπει μὴ ... σκότος ἐστίν warns the hearer to examine/watch lest what is regarded as light is in fact darkness. “ఉందేమో జాగ్రత్తగా చూసుకో” better preserves this cautionary, potentially diagnostic force.
  naturalness: “కాబట్టి, నీలో ఉన్న వెలుగు చీకటిగా ఉందేమో జాగ్రత్తగా చూసుకో” is clear, idiomatic modern standard Telugu, while retaining the direct singular imperative and the Greek metaphor.
  terminology: “వెలుగు” and “చీకటి” are appropriate, natural equivalents and should remain uninterpreted. “నీలో ఉన్న” accurately conveys τὸ ἐν σοὶ without narrowing the metaphor.
  issues:
  - severity: medium
    issue: The main clause presents darkness as a condition to be prevented rather than a condition that may already characterize the purported inner light.
    rationale: The Greek present copula, σκότος ἐστίν, states “is darkness” under a warning introduced by μή. A Telugu rendering using “చీకటిగా ఉండకుండా” is understandable but slightly shifts the focus toward preventing a future change. A diagnostic warning, “చీకటిగా ఉందేమో జాగ్రత్తగా చూసుకో,” is closer to the source.
  revised_text: కాబట్టి[a], నీలో ఉన్న వెలుగు చీకటిగా ఉందేమో జాగ్రత్తగా చూసుకో.
