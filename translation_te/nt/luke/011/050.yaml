id: LUK.11.50
reference: Luke 11:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: te
  text: లోకం పునాది వేయబడినప్పటి నుండి చిందించబడిన ప్రవక్తలందరి రక్తం గురించి ఈ తరం నుండి లెక్క అడగబడేలా[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకం పునాది వేయబడినప్పటి నుండి చిందించబడిన ప్రవక్తలందరి రక్తం కోసం ఈ తరాన్ని జవాబుదారిగా నిలబెట్టేలా.” ఇక్కడి క్రియ రక్తపాతానికి బాధ్యులుగా నిలబెట్టి లెక్క అడగడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: వచ్చేలా
  rationale: ముందున్న సందర్భంతో ఈ ఉపవాక్యానికి ఉన్న ఉద్దేశం లేదా ఫలిత సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκζητηθῇ
  choice: జవాబు చెప్పవలసి వచ్చేలా
  rationale: ఇక్కడ క్రియకు రక్తపాతాన్ని బట్టి న్యాయపరంగా లెక్క అడగడం, బాధ్యత వహింపజేయడం అనే భావం ఉంది. తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా ఆ న్యాయపరమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὸ αἷμα
  choice: రక్తానికి
  rationale: గ్రీకు పాఠంలోని ‘రక్తం’ అనే రూపక ప్రయోగాన్ని నిలుపుతూ, హత్యకు సంబంధించిన బాధ్యతను సూచిస్తుంది.
- source_word: πάντων τῶν προφητῶν
  choice: ప్రవక్తలందరి
  rationale: ‘అందరి’ అనే సమగ్ర పరిధిని యథాతథంగా నిలుపుతుంది.
- source_word: τὸ ἐκκεχυμένον
  choice: చిందించబడిన
  rationale: హింసాత్మక మరణంలో రక్తం కార్చబడటాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; కృదంతం ‘రక్తం’ను విశేషిస్తుంది.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: లోకం ఏర్పడినప్పటి నుండి
  rationale: ప్రపంచ ఆరంభం నుండి అనే భావాన్ని ఆధునిక, సహజ తెలుగులో అందిస్తుంది; ‘లోకపు పునాది వేయబడినప్పటి నుండి’ అనే అతి అక్షరార్థపు అసహజతను నివారిస్తుంది.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ఈ తరం జవాబు చెప్పవలసి
  rationale: ఎవరి నుండి లెక్క అడగబడుతుందో స్పష్టంగా తెలుపుతుంది. గ్రీకులోని ἀπό సూచించే బాధ్యత వహించే పక్షాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రవక్తల రక్తానికి ‘ఈ తరం’ జవాబు చెప్పడం యొక్క స్వభావం
  choice: దేవుని సందేశకులను తిరస్కరించి చంపిన రక్తపాతానికి ఈ తరాన్ని న్యాయపరంగా బాధ్యులుగా నిలబెట్టడం
  alternative: బలమైన న్యాయతీర్పు భావం లేని, కేవలం చారిత్రక కొనసాగింపును సూచించే వాక్యం
  rationale: ἐκζητέω క్రియ రక్తపాత సందర్భంలో లెక్క అడగడం లేదా బాధ్యత వహింపజేయడం అనే న్యాయపరమైన బలాన్ని కలిగి ఉంది. అయితే తరాల మధ్య అపరాధం ఎలా ఆపాదించబడుతుందో వచనం వివరించనందున అనువాదం దానిపై ప్రత్యేక సిద్ధాంతాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. ఇది ముందరి వాక్యానికి అనుసంధానమైన ఉపవాక్యం కావడంతో చివర కామా ఉంచబడింది.
