review_pass:
  verdict: revise
  source_fidelity: The draft rightly conveys the judicial/accountability force of ἐκζητηθῇ and retains the scope ('all the prophets') and the temporal phrase. However, “ప్రవక్తలందరి రక్తానికి ఈ తరం జవాబు చెప్పవలసి వచ్చేలా” shifts the Greek passive construction into an awkward Telugu formulation in which the generation appears to answer directly to the blood. The source more specifically expresses that an accounting for the shed blood is demanded from this generation.
  naturalness: The proposed revision uses idiomatic modern Telugu and makes the passive judicial reckoning explicit without overexplaining it in the verse itself. “లోకం పునాది వేయబడినప్పటి నుండి” is a clear, suitably elevated equivalent for ἀπὸ καταβολῆς κόσμου.
  terminology: “లెక్క అడగబడేలా” appropriately renders the forensic/accounting sense of ἐκζητηθῇ. “ప్రవక్తలు,” “రక్తం,” and “ఈ తరం” preserve the key terms and register. The footnote retains a genuine lexical alternative while explaining the accountability sense.
  issues:
  - severity: medium
    issue: The main clause uses “రక్తానికి ఈ తరం జవాబు చెప్పవలసి వచ్చేలా.”
    rationale: This is less natural Telugu and blurs the source’s passive expression that reckoning for the blood is sought from this generation. Recasting it as an accounting demanded from the generation better preserves both syntax and judicial sense.
  revised_text: లోకం పునాది వేయబడినప్పటి నుండి చిందించబడిన ప్రవక్తలందరి రక్తం గురించి ఈ తరం నుండి లెక్క అడగబడేలా[a],
