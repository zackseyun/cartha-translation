revisions:
- from: లోకం ఏర్పడినప్పటి నుండి చిందించబడిన ప్రవక్తలందరి రక్తానికి ఈ తరం జవాబు చెప్పవలసి వచ్చేలా[a],
  to: లోకం పునాది వేయబడినప్పటి నుండి చిందించబడిన ప్రవక్తలందరి రక్తం గురించి ఈ తరం నుండి లెక్క అడగబడేలా[a],
  rationale: The revision preserves the purpose/result force of ἵνα, the passive judicial force of ἐκζητηθῇ, and the repeated ἀπό indicating that accountability is sought from this generation. It avoids suggesting a detailed theory of inherited guilt while retaining the verse’s stated judicial force.
  reviewer_model: gpt-5.6-terra
