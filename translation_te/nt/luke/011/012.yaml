id: LUK.11.12
reference: Luke 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: te
  text: లేదా అతడు గుడ్డు అడిగితే, అతనికి తేలు ఇస్తాడా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: లేదా
  rationale: యేసు చెబుతున్న సమాంతర ఉదాహరణల క్రమంలో మరో ప్రత్యామ్నాయాన్ని సహజంగా పరిచయం చేస్తుంది; καίని విడిగా అనువదించడం తెలుగులో అవసరం లేదు.
- source_word: αἰτήσει
  choice: అడిగితే
  rationale: భవిష్యత్ సూచనార్థక రూపం ఇక్కడ షరతుతో కూడిన అలంకార ప్రశ్నలో ఉంది; తెలుగులో ‘అడిగితే’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ᾠόν
  choice: గుడ్డు
  rationale: మూలపదానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: ἐπιδώσει
  choice: ఇస్తాడా
  rationale: అడిగినదానికి ప్రతిస్పందనగా ఇవ్వడాన్ని సూచిస్తుంది; అలంకార ప్రశ్నకు ఇది సహజమైన తెలుగు రూపం.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: దత్తివిభక్తిలోని పరోక్ష కర్మను తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σκορπίον
  choice: తేలు
  rationale: మూలపదానికి ప్రామాణిక తెలుగు పదం; గుడ్డుతో ఉన్న స్పష్టమైన, అసంబద్ధమైన వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: తండ్రి–బిడ్డ ఉపమానంలోని అలంకార ప్రశ్న బలం
  choice: వివరణాత్మక పదాలు చేర్చకుండా నేరమైన అలంకార ప్రశ్నగా అనువదించడం
  alternative: ‘దానికి బదులుగా’ అని చేర్చి వ్యత్యాసాన్ని స్పష్టం చేయడం
  rationale: గ్రీకు మూలంలో వ్యత్యాసం అంతర్లీనంగా ఉంది. తెలుగులోనూ ప్రశ్న యొక్క ఉద్దేశం స్పష్టంగా ఉండేందున అదనపు వ్యాఖ్యానం అవసరం లేదు; ఇలా చేయడం తండ్రి మంచితనాన్ని గురించిన వాదనను వ్యాఖ్యానంతో విస్తరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘తేలు’ సాధారణ పాఠకులకు సహజమైన పదం; మూలంలోని సంక్షిప్తత మరియు అలంకార ప్రశ్న స్వరాన్ని నిలిపింది.
