    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: పొంచి ఉన్నారు
  rationale: ఈ క్రియారూపం శత్రుత్వంతో మాటువేసి చిక్కించుకోవడానికి ఎదురుచూడడాన్ని సూచిస్తుంది. ‘పొంచి ఉన్నారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ ప్రతికూల ఉద్దేశాన్ని నిలుపుతుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: ఈ సర్వనామం యేసును సూచిస్తుంది. గ్రీకు పాఠంలోని సర్వనామ రూపాన్ని తెలుగులో గౌరవార్థకంగా కొనసాగించాం.
- source_word: θηρεῦσαί
  choice: పట్టుకొని
  rationale: ఈ పదానికి వేటాడి పట్టుకోవడం అనే రూపకం ఉంది. ఇక్కడ ఆయన పలికిన దేనినైనా ఆధారంగా చేసుకొని ఆయనను చిక్కించడమే భావం; ‘పట్టుకొని’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: τι
  choice: ఏదో ఒకటి
  rationale: అనిర్దిష్ట సర్వనామం వారు ఆయన మాటలలో ఏదైనా ఒక విషయాన్ని పట్టుకోవాలని చూశారని సూచిస్తుంది.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: ఆయన మాటల్లో
  rationale: అక్షరార్థంగా ‘ఆయన నోటినుండి’ అయినా, ఇది ఆయన పలికిన మాటలను సూచించే నుడికారం. ‘ఆయన మాటల్లో’ తెలుగులో సహజంగా అర్థాన్ని అందిస్తుంది; అక్షర రూపం పాదటిప్పణిలో ఉంది.
