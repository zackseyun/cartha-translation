translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని వేటాడి పట్టుకునే రూపకాన్ని ‘పట్టుకొని’, శత్రుత్వంతో మాటువేసే భావాన్ని ‘పొంచి ఉన్నారు’ ద్వారా నిలిపాం; తెలుగు వాక్యానికి ఉద్దేశం స్పష్టంగా ఉండేందుకు ‘ఆయనను చిక్కులో పెట్టాలని’ సందర్భానుగుణంగా వ్యక్తం చేశాం.
