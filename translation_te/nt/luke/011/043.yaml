id: LUK.11.43
reference: Luke 11:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: te
  text: పరిసయ్యులారా, మీకు అయ్యో! ఎందుకంటే మీరు సమాజమందిరాల్లో ముఖ్య స్థానాలను[a], సంతల్లో పలకరింపులను[b] ఇష్టపడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముఖ్యాసనాలను” లేదా “అత్యున్నత గౌరవ స్థానాలను.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, సమాజంలో గౌరవాన్ని, గుర్తింపును తెలిపే బహిరంగ పలకరింపులు.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν τοῖς Φαρισαίοις
  choice: పరిసయ్యులారా, మీకు అయ్యో!
  rationale: οὐαίలోని ప్రవచనాత్మక ఖండన తీవ్రతను ‘అయ్యో’ నిలుపుతుంది; ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు రూపంలో ఉంచాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ఖండనకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ἀγαπᾶτε
  choice: కోరుకుంటారు
  rationale: ఈ సందర్భంలో సాధారణ ప్రేమకన్నా గౌరవస్థానాలు, సామాజిక గుర్తింపుపట్ల బలమైన మక్కువ భావం ఉంది; తెలుగులో ‘కోరుకుంటారు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: గౌరవస్థానాలను
  rationale: పదం సూచించేది కేవలం సౌకర్యవంతమైన సీట్లు కాదు, సభలో అత్యున్నత గౌరవం తెలిపే స్థానాలు. గ్రీకు ఏకవచనం వర్గార్థకంగా ఉన్నందున తెలుగులో బహువచనం సహజం.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: సమాజమందిరాల్లో
  rationale: యూదుల ఆరాధనా, బోధనా సమావేశ స్థలాలను సూచించే συναγωγήకి ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు పదాన్ని వాడాం.
- source_word: τοὺς ἀσπασμοὺς
  choice: గౌరవపూర్వకమైన పలకరింపులను
  rationale: ఇక్కడ సాధారణ అభివాదాలకన్నా బహిరంగంగా హోదా, గుర్తింపు తెలిపే పలకరింపులు ఉద్దేశించబడ్డాయి; ఆ సాంస్కృతిక భావాన్ని సంక్షిప్తంగా వ్యక్తం చేశాం.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: సంతవీధుల్లో
  rationale: ἀγορά ప్రజలు చేరే మార్కెట్ ప్రదేశం లేదా బహిరంగ కూడలిని సూచిస్తుంది; ‘సంతవీధులు’ ప్రజా-సామాజిక నేపథ్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు పలికిన ఖండన స్వభావం
  choice: ప్రజల గౌరవాన్ని ఆశించే పరిసయ్యులపై ప్రవచనాత్మకమైన ‘అయ్యో’ ప్రకటన
  alternative: కేవలం చెడు సామాజిక మర్యాదపై విమర్శ
  rationale: οὐαί మరియు దానికి జతచేసిన కారణం ఈ మాటను నైతిక-ఆధ్యాత్మిక ఖండనగా చూపుతాయి; అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా ఆ తీవ్రతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ప్రత్యక్ష సంబోధన, ప్రవచనాత్మక ఖండన రెండూ నిలుపబడ్డాయి; ‘గౌరవస్థానాలు,’ ‘గౌరవపూర్వకమైన పలకరింపులు’ ద్వారా సామాజిక హోదా కోసం ఉన్న మక్కువ స్పష్టమవుతుంది.
