    rationale: ‘మీకు న్యాయాధిపతులు అవుతారు’ more naturally expresses ὑμῶν κριταὶ ἔσονται than ‘మీకు న్యాయాధిపతులుగా ఉంటారు,’ while retaining the sense that they stand as judges in relation to the addressees.
