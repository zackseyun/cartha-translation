id: LUK.11.19
reference: Luke 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: te
  text: అయితే నేను బయెల్జెబూలు ద్వారా దయ్యాలను వెళ్లగొడుతుంటే, మీ కుమారులు ఎవరి ద్వారా[a] వాటిని వెళ్లగొడుతున్నారు? అందువల్ల వారే మీకు న్యాయాధిపతులు అవుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేని ద్వారా” లేదా “ఏ శక్తితో.”
    reason: ἐν τίνι వ్యక్తిని గానీ, సాధనాన్ని లేదా శక్తిని గానీ ప్రశ్నించవచ్చు; ప్రధాన పాఠ్యం సందర్భంలోని వ్యక్తిగత పోలికను అనుసరిస్తుంది.
lexical_decisions:
- source_word: εἰ δὲ
  choice: అయితే ... అంటే
  rationale: δέ సూచించే స్వల్ప వ్యతిరేక భావాన్ని ‘అయితే’ నిలుపుతుంది; షరతుతో కూడిన వాదనను ఆధునిక తెలుగులో సహజంగా చెప్పడానికి ‘అంటే’ ఉపయోగించబడింది.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్తృ సర్వనామం యేసుకు, ఎదుటివారి కుమారులకు మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐν Βεελζεβοὺλ
  choice: బయెల్జెబూలు ద్వారా
  rationale: ఇక్కడ ἐν వ్యక్తిని సాధనంగా లేదా మాధ్యమంగా సూచిస్తుంది. ‘ద్వారా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో లేని ‘శక్తితో’ అనే వివరణను చేర్చదు.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: దయ్యాలను వెళ్లగొడుతున్నాను
  rationale: భూతవైద్య సందర్భంలో ἐκβάλλω అంటే బయటికి పంపడం లేదా వెళ్లగొట్టడం. ‘వెళ్లగొట్టు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: మీ కుమారులు
  rationale: υἱοί అనే పదానికి ఉన్న ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘శిష్యులు,’ ‘అనుచరులు,’ లేదా ‘తోటి యూదులు’ అని అర్థాన్ని ముందుగానే నిర్ణయించదు.
- source_word: ἐν τίνι
  choice: ఎవరి ద్వారా
  rationale: బయెల్జెబూలు అనే వ్యక్తితో చేస్తున్న పోలికకు అనుగుణంగా వ్యక్తిగత మాధ్యమం లేదా కర్తను ప్రశ్నిస్తుంది. ‘దేని ద్వారా’ అనే సాధనార్థక అర్థం కూడా సాధ్యమే కాబట్టి దానిని పాదటిప్పణిలో ఉంచాం.
- source_word: διὰ τοῦτο
  choice: అందువల్ల
  rationale: ముందున్న అలంకారిక ప్రశ్ననుంచి వచ్చే నిర్ధారణను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: వారే మీకు న్యాయాధిపతులుగా ఉంటారు
  rationale: αὐτοί లోని ఉద్ఘాటనను ‘వారే’ ప్రత్యక్షంగా నిలుపుతుంది; κριταί ను న్యాయాధిపతులుగా అనువదించడం తీర్పు చెప్పే వారి భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘మీ కుమారులు’ అనే వారి గుర్తింపు
  choice: మూలంలోని ప్రత్యక్ష రూపమైన ‘మీ కుమారులు’ను నిలుపడం
  alternative: మీ శిష్యులు; మీ అనుచరులు; మీ తోటి యూదులు
  rationale: ఈ వ్యక్తులు ఎవరో మూలపాఠం స్పష్టంగా తేల్చదు. అందువల్ల వ్యాఖ్యానాత్మక గుర్తింపును ప్రధాన పాఠ్యంలోకి తీసుకురాకుండా అసలు అభివ్యక్తినే ఉంచాం.
- issue: αὐτοί లోని ఉద్ఘాటన
  choice: ‘వారే’ అని అనువదించడం
  alternative: ‘వారు’ అని మాత్రమే అనువదించడం
  rationale: గ్రీకు సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘-ఏ’ సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే వాదనాత్మక గంభీరతను మరియు మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
