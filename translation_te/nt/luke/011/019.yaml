    rationale: ‘అయితే నేను ... వెళ్లగొడుతున్నానంటే’ is intelligible, but ‘అయితే నేను ... వెళ్లగొడుతుంటే’ is smoother modern Telugu for εἰ ... ἐκβάλλω.
  - severity: low
