id: LUK.11.24
reference: Luke 11:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: te
  text: “అపవిత్రాత్మ ఒక మనిషిలోనుండి బయటికి వెళ్లినప్పుడు, అది విశ్రాంతి కోసం నీళ్లు లేని ప్రదేశాల[a] గుండా వెదుకుతూ వెళ్తుంది. కానీ విశ్రాంతి దొరకక, ‘నేను బయలుదేరి వచ్చిన నా ఇంటికి తిరిగి వెళ్తాను’ అని అంటుంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎండిన ప్రదేశాల.” గ్రీకు పదానికి అక్షరార్థం “నీళ్లు లేని ప్రదేశాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: వెళ్లినప్పుడు
  rationale: ఉపవాక్యంలోని సంభావ్యమైన సాధారణ సందర్భాన్ని సహజమైన తెలుగు కాలవాచక నిర్మాణంతో తెలియజేస్తుంది.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: అపవిత్రాత్మ
  rationale: నైతిక, ఆచారసంబంధ అపవిత్రత భావాన్ని నిలుపుతూ, వ్యక్తిగతంగా క్రియచేసే దుష్టాత్మను సూచించే సువార్తల ప్రామాణిక పదబంధంగా ఉంటుంది.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: ఒక మనిషిలోనుండి
  rationale: ఇది ప్రతినిధి ఉదాహరణ అని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ఆత్మ వ్యక్తిలో నివసించి బయటికి వెళ్లే సందర్భానికి ‘లోనుండి’ స్పష్టంగా సరిపోతుంది.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: నీళ్లు లేని ప్రదేశాల గుండా ... వెళ్తుంది
  rationale: ప్రదేశాల మధ్యగా ప్రయాణించే భావాన్నీ, ἀνύδρων యొక్క అక్షరార్థమైన నీరు లేని స్వభావాన్నీ నిలుపుతుంది.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: విశ్రాంతి కోసం ... వెదుకుతూ
  rationale: కృదంతంలోని అన్వేషణను, దాని లక్ష్యమైన విశ్రాంతిని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: καὶ μὴ εὑρίσκον
  choice: విశ్రాంతి దొరకకపోతే
  rationale: గ్రీకులో సందర్భం ద్వారా అర్థమయ్యే కర్మను తెలుగులో పునరుక్తి చేసి సందిగ్ధత లేకుండా చేస్తుంది.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: నా ఇంటికి తిరిగి వెళ్తాను
  rationale: భవిష్యత్ సంకల్పాన్ని, ‘ఇల్లు’ అనే స్పష్టమైన రూపకాన్ని కాపాడుతుంది.
- source_word: ὅθεν ἐξῆλθον
  choice: బయటికి వచ్చిన
  rationale: ముందటి బయటికి వెళ్లడాన్ని ప్రతిధ్వనింపజేస్తూ సంబంధవాచక భావాన్ని తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: ‘అపవిత్రాత్మ’ యొక్క స్వరూపం
  choice: మాట్లాడే, వెళ్లే, తిరిగి వచ్చే వ్యక్తిగత దుష్టాత్మగా పాఠ్యంలోని చిత్రణను నిలిపాం.
  alternative: నైతిక పతనానికి కేవలం రూపకం లేదా వ్యక్తిత్వంలేని శక్తి
  rationale: సందర్భంలో ఆ ఆత్మ స్వయంగా క్రియచేస్తూ మాట్లాడుతుంది; అనువాదం దానిని కేవలం మానసిక లేదా నైతిక రూపకంగా మార్చకూడదు.
- issue: ἀνθρώπου యొక్క లింగసూచన
  choice: మనిషి
  alternative: వ్యక్తి / ఎవరైనా
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉండి ప్రతినిధి సందర్భాన్ని చూపుతుంది; ‘మనిషి’ తెలుగులో మూలానికి సమీపంగానూ సహజంగానూ ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో సులభంగా చదవగల ప్రవాహంతో ఉంచి, అపవిత్రాత్మకు సంబంధించిన ఏకవచన క్రియలను స్పష్టంగా కొనసాగించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘నీళ్లు లేని ప్రదేశాలు’ అన్న పదబంధం వద్ద ఉంచాం.
