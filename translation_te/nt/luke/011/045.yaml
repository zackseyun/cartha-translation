  source_fidelity: The translation accurately conveys the reply by one of the Jewish-law specialists, the address “Teacher,” the reference to Jesus’ preceding words, the additive force of “also,” and the strong sense of ὑβρίζεις as insulting or humiliating. Rendering the historical present λέγει with Telugu narrative past అన్నాడు is appropriate.
  naturalness: The wording is clear, idiomatic modern standard Telugu, with an appropriately respectful narrative register. “ధర్మశాస్త్ర నిపుణుల్లో ఒకడు” naturally avoids the misleading modern-professional sense of “lawyer.”
  terminology: “ధర్మశాస్త్ర నిపుణుడు” is contextually precise for νομικός, and “బోధకుడా” is a suitable contemporary equivalent for Διδάσκαλε. “అవమానిస్తున్నావు” accurately represents the force of ὑβρίζεις without weakening it to mere offense.
