  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: te
  text: అప్పుడు ధర్మశాస్త్ర నిపుణుల్లో ఒకడు ఆయనతో, “బోధకుడా, నీవు ఈ మాటలు చెబుతూ మమ్మల్ని కూడా అవమానిస్తున్నావు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మమ్మల్ని కూడా తిరస్కారంగా చూస్తున్నావు” అని కూడా అనువదించవచ్చు. ఇక్కడి గ్రీకు క్రియ అవమానించడం లేదా హీనంగా చూడడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: అప్పుడు … అన్నాడు
  rationale: ప్రత్యుత్తరాన్ని సూచించే గ్రీకు కృదంతాన్ని తెలుగు కథనశైలికి సహజంగా ప్రధాన క్రియలో కలిపి, δέ సూచించే స్వల్ప కథన పురోగతిని ‘అప్పుడు’తో వ్యక్తం చేశాం.
- source_word: τις τῶν νομικῶν
  choice: ధర్మశాస్త్ర నిపుణుల్లో ఒకడు
  rationale: νομικός ఇక్కడ ఆధునిక న్యాయవాదిని కాక, యూదుల ధర్మశాస్త్రంలో నిపుణుణ్ని సూచిస్తుంది; అందువల్ల సందర్భానుకూలమైన స్పష్టమైన పదబంధాన్ని ఎంచుకున్నాం.
- source_word: λέγει αὐτῷ
  choice: ఆయనతో … అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని సహజమైన తెలుగు కథన భూతకాలంతో అనువదించాం.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: సంబోధన రూపంలోని διδάσκαλοςకు ఆధునిక, గౌరవప్రదమైన తెలుగు సమానార్థక పదం.
- source_word: ταῦτα λέγων
  choice: నీవు ఈ మాటలు చెబుతూ
  rationale: ప్రధాన క్రియతో సమకాలీనమైన కృదంత భావాన్ని నిలుపుతూ, యేసు అప్పుడే పలికిన మాటలను స్పష్టంగా సూచిస్తుంది.
- source_word: καὶ ἡμᾶς
  choice: మమ్మల్ని కూడా
  rationale: καί యొక్క చేర్పు భావాన్ని సహజమైన తెలుగు పదక్రమంలో నిలిపింది.
- source_word: ὑβρίζεις
  choice: అవమానిస్తున్నావు
  rationale: ὑβρίζωలోని అవమానించడం, తిరస్కారంగా చూడడం అనే బలమైన భావాన్ని ఇది అందిస్తుంది; కేవలం ‘బాధపెడుతున్నావు’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
