translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ధర్మశాస్త్ర నిపుణుడు’ అనే పదబంధం ఆధునిక వృత్తిపరమైన న్యాయవాది అనే అపార్థాన్ని నివారిస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
