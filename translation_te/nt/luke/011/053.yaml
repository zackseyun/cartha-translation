- from: ఆయన అక్కడి నుంచి వెళ్లిన తరువాత, శాస్త్రులు, పరిసయ్యులు ఆయనపై తీవ్రంగా ఒత్తిడి చేయడం, అనేక విషయాల గురించి ఆయన నోట మాటలు రప్పించడానికి[a] ప్రయత్నించడం మొదలుపెట్టారు.
  to: ఆయన అక్కడి నుంచి వెళ్లిన తరువాత, శాస్త్రులు, పరిసయ్యులు ఆయనను తీవ్రంగా వేధించడం, అనేక విషయాల గురించి ఆయన నుంచి మాటలు రప్పించడం[a] మొదలుపెట్టారు.
