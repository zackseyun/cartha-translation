source:
  edition: SBLGNT
  text: ⸂Κἀκεῖθεν ἐξελθόντος αὐτοῦ⸃ ἤρξαντο οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι δεινῶς ἐνέχειν καὶ ἀποστοματίζειν αὐτὸν περὶ πλειόνων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: te
  text: ఆయన అక్కడి నుంచి వెళ్లిన తరువాత, శాస్త్రులు, పరిసయ్యులు ఆయనను తీవ్రంగా వేధించడం, అనేక విషయాల గురించి ఆయన నుంచి మాటలు రప్పించడం[a] మొదలుపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను గట్టిగా ప్రశ్నించడం,’ లేదా ‘వెంటనే సమాధానం చెప్పేలా ఆయనను మాట్లాడించడం.’ అరుదైన ఈ గ్రీకు క్రియ, ఆయన నుంచి దూకుడుగా సమాధానాలు రాబట్టే ప్రయత్నాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: ఆయన అక్కడి నుంచి వెళ్లిన తరువాత
  rationale: క్రియావిశేషణంతో కూడిన సంబంధరహిత షష్ఠీవిభక్తి కృదంత నిర్మాణం ప్రధాన క్రియకు ముందుగా జరిగిన నిష్క్రమణను సూచిస్తుంది. ఈ తెలుగు రూపం స్థల, కాల భావాలు రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్రాన్ని నకలు చేసి బోధించే నిపుణులుగా ఉన్న వర్గానికి తెలుగులో స్థిరపడిన, సంక్షిప్తమైన పదం.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: చారిత్రక మతవర్గం పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: δεινῶς ἐνέχειν
  choice: ఆయనపై తీవ్రంగా ఒత్తిడి చేయడం
  rationale: ఈ పదజోడు సూచించే తీవ్రమైన, శత్రుత్వపూర్వకమైన పట్టుదలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం శారీరక ఒత్తిడి అని పరిమితం చేయదు.
- source_word: ἀποστοματίζειν
  choice: ఆయన నోట మాటలు రప్పించడానికి ప్రయత్నించడం
  rationale: అరుదైన ఈ క్రియలో ఒకరి నుంచి దూకుడుగా మాటలు లేదా సమాధానాలు రాబట్టే భావం ఉంది. ప్రధాన పాఠం ఆ ప్రతికూల ఉద్దేశాన్ని నిలుపుతూ, ప్రశ్నించే ఖచ్చిత విధానాన్ని అతిగా నిర్దేశించదు.
- source_word: περὶ πλειόνων
  choice: అనేక విషయాల గురించి
  rationale: ఇక్కడ πλειόνων తులనాత్మకమైన ‘ఇంకా ఎక్కువ’ కంటే విస్తృతమైన అనేక అంశాలను సూచిస్తుంది.
- source_word: ἤρξαντο
  choice: మొదలుపెట్టారు
  rationale: రెండు అనుబంధ అసమాపక క్రియలతో ఉన్న ἄρχομαι యొక్క ఆరంభార్థాన్ని స్పష్టంగా నిలుపుతుంది.
