translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఆయన నోట మాటలు రప్పించడం’ అనే నుడికారం మూలంలోని ప్రతికూలంగా మాటలు వెలికితీసే భావాన్ని సామాన్య పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; అరుదైన గ్రీకు క్రియలోని అనిశ్చితి పాదటిప్పణిలో భద్రపరచబడింది.
