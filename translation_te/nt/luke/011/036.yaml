id: LUK.11.36
reference: Luke 11:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: te
  text: కాబట్టి, నీ శరీరమంతా వెలుగుతో నిండి, అందులో ఏ భాగమూ చీకటిగా లేకపోతే, నీ శరీరమంతా పూర్తిగా వెలుగుతో నిండి ఉంటుంది; దీపం తన ప్రకాశంతో నీకు వెలుగునిచ్చినప్పుడు ఎలా ఉంటుందో అలానే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “దీపం తన మెరుపుతో నిన్ను ప్రకాశింపజేసినప్పుడు.” గ్రీకు పదం ‘మెరుపు’ లేదా ‘ప్రకాశం’ అనే అర్థాలను ఇవ్వగలదు; ఇక్కడ అది అక్షరార్థమైన మెరుపుకన్నా దీపపు ప్రకాశాన్నే సూచిస్తున్నట్లు ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: శరీరం
  rationale: మూలంలోని శరీర రూపకాన్ని అలాగే నిలుపుతుంది; దానిని ‘అంతరంగం’ లేదా ‘వ్యక్తి’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: ὅλον / φωτεινόν
  choice: శరీరమంతా వెలుగుతో నిండి
  rationale: ὅλον యొక్క సంపూర్ణతను, φωτεινόν యొక్క వెలుగు–చీకటి వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: అందులో ఏ భాగమూ చీకటిగా లేకపోతే
  rationale: ప్రతికూల భాగస్వామ్య నిర్మాణాన్ని తెలుగులో సహజమైన షరతు నిర్మాణంగా ఇస్తూ, ‘భాగం’ అనే స్పష్టమైన రూపకాన్ని కాపాడుతుంది.
- source_word: ἔσται φωτεινὸν ὅλον
  choice: అది పూర్తిగా వెలుగుతో నిండి ఉంటుంది
  rationale: భవిష్యత్ క్రియను, రెండోసారి వచ్చే సంపూర్ణత ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ὡς ὅταν
  choice: ఉన్నట్టుగా
  rationale: దీపం వెలిగించే సందర్భంతో చేసే పోలికను సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: λύχνος
  choice: దీపం
  rationale: ఇది అమూర్తమైన ‘వెలుగు’ లేదా ‘దీపస్తంభం’ కాదు; చేతిలో పెట్టుకునే దీపం అనే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: τῇ ἀστραπῇ
  choice: తన ప్రకాశంతో
  rationale: ἀστραπή మెరుపు లేదా ప్రకాశాన్ని సూచించగలదు; ఇక్కడ కర్త దీపం కావడంతో దాని ప్రకాశం అనే అర్థం సందర్భోచితం, అయితే ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: φωτίζῃ σε
  choice: నీకు వెలుగు ఇచ్చినప్పుడు
  rationale: σε అనే వ్యక్తిగత కర్మను నిలుపుతూ, ‘వెలిగించు’ వల్ల తెలుగులో కలిగే అసహజతను తప్పించి సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: ‘శరీరం’ మరియు ‘వెలుగు’ అనే రూపకాల అర్థం
  choice: శరీరం–వెలుగు రూపకాలను వివరణ లేకుండా అలాగే నిలుపడం
  alternative: దీనిని ‘అంతరంగ జీవితం,’ ‘ఆత్మీయ స్థితి,’ లేదా ‘నైతిక స్థితి’ అని విప్పి చెప్పడం
  rationale: ఈ వాక్యం ముందు ఉన్న కన్ను–దీపం సందర్భంతో ముడిపడిన రూపకాన్ని ఉపయోగిస్తుంది. సిద్ధాంతపరమైన ఒకే వివరణను అనువాదంలో చేర్చకుండా మూలంలోని భావసాంద్రతను, ఉద్రిక్తతను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని శరీరం, భాగం, చీకటి, దీపం, వెలుగు అనే స్పష్టమైన చిత్రాలను నిలుపుతూ, గ్రీకు వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా పఠనసౌలభ్యానికి అనుగుణంగా అమర్చబడింది.
