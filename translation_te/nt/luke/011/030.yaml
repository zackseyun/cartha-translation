source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: te
  text: ఎందుకంటే, యోనా నీనెవె ప్రజలకు సూచనగా మారినట్లే, మనుష్యకుమారుడు కూడా ఈ తరానికి సూచనగా ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: ‘అలాగే మనుష్యకుమారుడు కూడా ఈ తరానికి ఉంటాడు.’ ‘ఈ తరానికి సూచనగా ఉంటాడు’ అనే భావం యోనాతో చేసిన పోలికలో అంతర్లీనంగా ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: …నట్లే
  rationale: γάρ ఇచ్చే వివరణాత్మక అనుసంధానం సందర్భంలో సహజంగా అంతర్లీనమై ఉంది; καθώς యొక్క పోలికను ‘నట్లే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγένετο
  choice: మారిన
  rationale: యోనా కేవలం సూచనగా ఉన్నాడని కాక, వారికి సూచనగా పనిచేసే స్థితికి వచ్చాడనే γίνομαι పదంలోని భావాన్ని నిలుపుతుంది.
- source_word: Ἰωνᾶς
  choice: యోనా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: τοῖς Νινευίταις
  choice: నీనెవె ప్రజలకు
  rationale: సంబంధాన్ని సూచించే దత్తి విభక్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘నీనెవెవారు’ కంటే సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: σημεῖον
  choice: సూచనగా
  rationale: దైవిక లేదా ప్రకటనాత్మక ప్రాముఖ్యతగల గుర్తు అనే σημεῖον భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: οὕτως … καὶ
  choice: …నట్లే … కూడా
  rationale: καθώς—οὕτως పరస్పర పోలికను, καί యొక్క అదనపు బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔσται
  choice: ఉంటాడు
  rationale: εἰμί యొక్క భవిష్యత్ రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; మొదటి ఉపవాక్యంలోని ‘సూచనగా’ అనే విధేయాన్ని పోలిక ఆధారంగా తెలుగులో స్పష్టంగా పునరుద్ధరిస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: సువార్తలలో స్థిరపడిన బిరుదును, దాని శాబ్దిక రూపాన్ని మరియు మెస్సీయ సంబంధిత ప్రతిధ్వనులను వ్యాఖ్యానాత్మకంగా విప్పకుండా కాపాడుతుంది.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: ఈ తరానికి
  rationale: γενεά యొక్క ‘తరం’ భావాన్ని, దత్తి విభక్తి తెలిపే సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: రెండవ ఉపవాక్యంలో అంతర్లీన విధేయం
  choice: ‘మనుష్యకుమారుడు కూడా ఈ తరానికి సూచనగా ఉంటాడు’ అని ‘సూచనగా’ను స్పష్టంగా చేర్చడం.
  alternative: ‘మనుష్యకుమారుడు కూడా ఈ తరానికి ఉంటాడు’ అని గ్రీకు వాక్య నిర్మాణాన్ని మరింత అక్షరార్థంగా ఉంచడం.
  rationale: గ్రీకులో σημεῖον రెండోసారి లేకపోయినా, καθώς—οὕτως పోలిక దానిని బలంగా సూచిస్తుంది. తెలుగులో అది లేకపోతే వాక్యం అసహజంగా, అస్పష్టంగా ఉంటుంది; చేర్చడం కొత్త సిద్ధాంత భావాన్ని ప్రవేశపెట్టదు.
- issue: ‘మనుష్యకుమారుడు’ అనే బిరుదు అర్థం
  choice: సంప్రదాయ బిరుదైన ‘మనుష్యకుమారుడు’ను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా ఉంచడం.
  alternative: ‘మానవుడు’ లేదా ‘మానవపుత్రుడు’.
  rationale: ఈ పదబంధపు బిరుదు స్వభావాన్ని, అంతర్గ్రంథ సంబంధాలను, దాని వ్యాఖ్యానాత్మక ఉద్రిక్తతను ‘మనుష్యకుమారుడు’ మెరుగ్గా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నీనెవె ప్రజలు,’ ‘ఈ తరం’ వంటి సాధారణంగా అర్థమయ్యే రూపాలను ఉపయోగించి, ‘మనుష్యకుమారుడు’ అనే స్థిరమైన బైబిలు బిరుదును నిలుపుకుంది.
