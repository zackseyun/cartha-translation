id: LUK.11.22
reference: Luke 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: te
  text: అయితే, అతనికంటే బలవంతుడైనవాడు అతని మీదికి వచ్చి అతన్ని జయించినప్పుడు[a], ఆ వ్యక్తి నమ్మి ఆధారపడిన పూర్తి కవచాన్ని[b] తీసివేసి, అతని కొల్లసొమ్మును[c] పంచిపెడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని ఓడించినప్పుడు’ లేదా ‘అతన్ని జయించి లోబరచుకున్నప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘పూర్తి కవచం’ అనేది సంపూర్ణమైన కవచ సామగ్రిని సూచించే పదానికి అనువాదం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతని యుద్ధలాభాన్ని’ లేదా ‘అతని దోపుడు సొమ్మును.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: అయితే, ... వచ్చినప్పుడు
  rationale: δέ మునుపటి పరిస్థితికి వ్యతిరేకతను సూచిస్తుంది; ἐπάν షరతుతో కూడిన కాలార్థాన్ని ఇస్తుంది. ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: అతనికంటే బలవంతుడైనవాడు
  rationale: గ్రీకులో నామవాచకం స్పష్టంగా లేకుండా తులనాత్మక విశేషణమే నామవాచకంగా వాడబడింది. కాబట్టి ‘మనిషి’ అని అదనంగా చేర్చకుండా భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐπελθὼν
  choice: అతని మీదికి వచ్చి
  rationale: ఒకరికి ఎదురుగా లేదా మీదికి రావడం అనే సంఘర్షణాత్మక దృశ్యాన్ని నిలుపుతుంది; ‘దాడి చేసి’ అని మరీ నిర్దిష్టంగా వ్యాఖ్యానించదు.
- source_word: νικήσῃ αὐτόν
  choice: అతన్ని జయించినప్పుడు
  rationale: νικάω సూచించే గెలుపు, ఓటమిపాలు చేయడం అనే అర్థాన్ని స్పష్టంగా అందిస్తుంది; తరువాత జరిగే నిరాయుధీకరణకు తగిన సంఘర్షణ భావాన్ని కలిగి ఉంది.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: సర్వాంగ కవచాన్ని
  rationale: πανοπλία ఒక యోధుని పూర్తి కవచ సముదాయాన్ని సూచిస్తుంది. ‘సర్వాంగ కవచం’ సంక్షిప్తంగా, గౌరవప్రదంగా, తెలుగు పాఠకులకు అర్థమయ్యేలా ఆ సంపూర్ణతను తెలియజేస్తుంది.
- source_word: αἴρει
  choice: తీసివేసి
  rationale: ఓడిపోయినవాని కవచాన్ని అతని నుంచి తొలగించడం అనే సందర్భోచిత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: అతడు నమ్ముకున్న
  rationale: ఆ కవచంపై అతనికి కొనసాగుతూ వచ్చిన స్థిరమైన ఆధారం లేదా నమ్మకాన్ని సంక్షిప్తమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: అతని కొల్లసొమ్మును
  rationale: σκῦλα ఓడించిన శత్రువు నుంచి స్వాధీనం చేసుకునే యుద్ధలాభాన్ని లేదా దోపుడు సొమ్మును సూచిస్తుంది. ‘కొల్లసొమ్ము’ ఆ దృశ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: διαδίδωσιν
  choice: పంచిపెడతాడు
  rationale: స్వాధీనం చేసుకున్న సొమ్మును ఇతరులకు విభజించి ఇవ్వడం అనే క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: బలవంతుడైన వ్యక్తిని ‘బలవంతుడైన మనిషి’ అని స్పష్టంగా పేర్కొనాలా?
  choice: ‘అతనికంటే బలవంతుడైనవాడు’ అని, ‘మనిషి’ అనే నామవాచకాన్ని చేర్చకుండా ఉంచడం.
  alternative: ‘అతనికంటే బలవంతుడైన మనిషి’
  rationale: మూల గ్రీకులో తులనాత్మక విశేషణం నామవాచకంగా వాడబడింది గాని ‘మనిషి’ అనే పదం ఈ వాక్యంలో లేదు. ముందరి సందర్భం దృశ్యాన్ని స్పష్టం చేస్తుంది; అనువాదం మాత్రం లేని నామవాచకాన్ని జోడించదు.
- issue: νικάωను ఎంత బలమైన సంఘర్షణ పదంతో అనువదించాలి?
  choice: ‘జయించినప్పుడు’
  alternative: ‘లోబరచుకున్నప్పుడు’ లేదా ‘ఓడించినప్పుడు’
  rationale: ‘జయించడం’ గ్రీకు క్రియలోని గెలుపు భావాన్ని నిలుపుతూ, ఆ వ్యక్తి ఎవరిని సూచిస్తున్నాడో లేదా ఈ దృశ్యం యొక్క తాత్త్విక అన్వయమేమిటో అనువాదంలో ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే యుద్ధరూపకానికి తగిన గౌరవప్రదమైన శైలిని నిలిపింది. ‘అతడు’ అనే సర్వనామం సమీప సందర్భంలో ఓడించబడిన వ్యక్తినే సూచిస్తుందని వాక్య నిర్మాణం తెలియజేస్తుంది; చివరి క్రియల కర్త బలవంతుడైనవాడే.
