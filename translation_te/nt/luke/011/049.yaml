id: LUK.11.49
reference: Luke 11:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: te
  text: 'ఈ కారణంగానే దేవుని జ్ఞానం కూడా ఇలా చెప్పింది[a]: “నేను వారి దగ్గరికి ప్రవక్తలను, అపొస్తలులను పంపుతాను. వారిలో కొందరిని వారు చంపుతారు, హింసిస్తారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని జ్ఞానం.” ఈ మాటను దైవజ్ఞానపు వ్యక్తీకరణగా, దేవుని జ్ఞానపూర్వక నిర్ణయంగా, లేదా యేసు తనను తాను పరోక్షంగా సూచించిన మాటగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ముందున్న నిందారోపణ నుంచి వచ్చే కారణార్థక, నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించకుండా ‘అందుకే’ అనే అనుసంధానంలో గ్రహించబడింది
  rationale: ఇక్కడి సంకలిత బలాన్ని తెలుగులో ‘అందుకే ... ఇలా’ అనే సహజ వాక్యనిర్మాణం మోస్తుంది; ‘కూడా’ అని చేరిస్తే అసహజంగా లేదా సందిగ్ధంగా వినిపించవచ్చు.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: దేవుని జ్ఞానం
  rationale: గ్రీకు సంబంధ నిర్మాణాన్ని సమీపంగా నిలుపుతూ, దైవజ్ఞానపు వ్యక్తీకరణనా, దేవుని జ్ఞానపూర్వక నిర్ణయమా, లేక యేసు పరోక్ష స్వీయసూచనా అనే సందిగ్ధతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: εἶπεν
  choice: ఇలా చెప్పింది
  rationale: సాధారణ భూతకాల క్రియను సహజంగా అందిస్తుంది; వెంట వచ్చే ప్రత్యక్ష ఉక్తిని ‘ఇలా’ స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: Ἀποστελῶ
  choice: నేను ... పంపుతాను
  rationale: భవిష్యత్ క్రియారూపాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς αὐτούς
  choice: వారి దగ్గరికి
  rationale: పంపడం అనే క్రియతో గమ్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘వారికి’ కంటే వ్యక్తుల వద్దకు పంపడం అనే భావం స్పష్టంగా ఉంటుంది.
- source_word: προφήτας
  choice: ప్రవక్తలను
  rationale: ప్రామాణికమైన, సుపరిచితమైన తెలుగు బైబిలు పదం.
- source_word: ἀποστόλους
  choice: అపొస్తలులను
  rationale: లూకా–అపొస్తలుల కార్యముల సందర్భంలో ఉన్న ప్రత్యేకమైన హోదా/పాత్రను ‘సందేశకులు’ అనే సాధారణ పదం కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: ἐξ αὐτῶν
  choice: వారిలో కొందరిని ... మరికొందరిని
  rationale: గ్రీకు పదబంధంలోని భాగార్థాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది. రెండు క్రియలకు వేర్వేరు వ్యక్తులు తప్పనిసరి అని మూలం నిర్దేశించకపోయినా, సహజ తెలుగు వాక్యానికి ఈ విభజన ఉపయోగపడుతుంది; సంబంధిత సూక్ష్మతను నిర్ణయాత్మకంగా సిద్ధాంతీకరించదు.
- source_word: ἀποκτενοῦσιν
  choice: చంపుతారు
  rationale: నేరుగా, సులభంగా అర్థమయ్యే సమానార్థకం.
- source_word: διώξουσιν
  choice: హింసిస్తారు
  rationale: ఈ శత్రుత్వ సందర్భంలో తటస్థంగా వెంబడించడం కాక మతపరమైన/సామాజిక పీడన భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దేవుని జ్ఞానం’ అనే పదబంధం యొక్క గుర్తింపు
  choice: ‘దేవుని జ్ఞానం’ అని మాత్రమే అనువదించి దాని గుర్తింపును నిర్ధారించలేదు.
  alternative: దైవజ్ఞానపు వ్యక్తీకరణ; దేవుని జ్ఞానపూర్వక నిర్ణయం; యేసు చేసిన పరోక్ష స్వీయసూచన.
  rationale: సందర్భంలో ఈ పదబంధం అనేక విధాలుగా అర్థమయ్యే అవకాశం ఉంది. అనువాదం వాటిలో ఏ ఒక్కదానినీ సిద్ధాంతపరంగా ఖరారు చేయకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అపొస్తలులు’ వంటి స్థిరమైన బైబిలు పరిభాషను నిలుపుతూ, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా రూపొందించాం.
