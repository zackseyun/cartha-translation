  to: 'ఈ కారణంగానే దేవుని జ్ఞానం కూడా ఇలా చెప్పింది[a]: “నేను వారి దగ్గరికి ప్రవక్తలను, అపొస్తలులను పంపుతాను. వారిలో కొందరిని వారు చంపుతారు, హింసిస్తారు.”'
