id: LUK.11.52
reference: Luke 11:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: te
  text: ధర్మశాస్త్ర నిపుణులారా[a], మీకు అయ్యో! ఎందుకంటే మీరు జ్ఞానపు తాళపు చెవిని తీసివేశారు; మీరే ప్రవేశించలేదు, ప్రవేశిస్తున్నవారిని అడ్డుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధర్మశాస్త్ర నిపుణులు’ అంటే ఆధునిక న్యాయవాదులు కాదు; యూదుల ధర్మశాస్త్రంలో నిపుణులు.
    reason: lexical_clarification
  - marker: b
    text: ‘ప్రవేశించడం’ అంటే దేనిలోకి ప్రవేశించడమో మూలపాఠం స్పష్టంగా చెప్పదు; దేవుని రాజ్యంలోకి లేదా దేవుని గురించిన నిజమైన జ్ఞానంలోకి ప్రవేశించడం అనే భావాలు సూచించబడి ఉండవచ్చు.
    reason: ambiguity_preservation
lexical_decisions:
- source_word: οὐαί
  choice: మీకు అయ్యో!
  rationale: ప్రవక్తీయ ఖండనతో కూడిన హెచ్చరిక భావాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: νομικοῖς
  choice: ధర్మశాస్త్ర నిపుణులారా
  rationale: ఇది ఆధునిక న్యాయవాదులను కాకుండా యూదుల ధర్మశాస్త్రంలో నిపుణులను సూచిస్తుంది; సంబోధన రూపం గ్రీకు దత్తివాచక సంబోధన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἤρατε
  choice: తీసివేశారు
  rationale: కేవలం తీసుకోవడం కాకుండా, ఇతరులకు అందుబాటులో లేకుండా తొలగించడం అనే సందర్భోచిత భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: κλεῖδα τῆς γνώσεως
  choice: జ్ఞానపు తాళంచెవి
  rationale: గ్రీకు షష్ఠీ నిర్మాణానికి దగ్గరగా ఉండి, జ్ఞానానికి ప్రవేశం కల్పించే సాధనం అనే రూపకాన్ని నిలుపుతుంది.
- source_word: αὐτοὶ
  choice: మీరే
  rationale: గ్రీకులోని ఉద్ఘాటనను, ఇతరులను అడ్డుకోవడంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: οὐκ εἰσήλθατε
  choice: లోపలికి ప్రవేశించలేదు
  rationale: దేనిలోకి ప్రవేశించారో పాఠం స్పష్టంగా చెప్పనందున దాన్ని పూరించకుండా ప్రవేశ రూపకాన్ని నిలుపుతుంది.
- source_word: τοὺς εἰσερχομένους
  choice: ప్రవేశిస్తున్నవారిని
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను సహజంగా వ్యక్తం చేస్తుంది; ‘ప్రవేశించడానికి ప్రయత్నిస్తున్న’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἐκωλύσατε
  choice: అడ్డుకున్నారు
  rationale: ప్రవేశానికి ఆటంకం కలిగించడాన్ని సహజంగా తెలియజేస్తుంది; ఫలితాన్ని అతిగా ఖచ్చితపరచదు.
theological_decisions:
- issue: ‘ప్రవేశించడం’ మరియు ‘జ్ఞానపు తాళంచెవి’ రూపకాల సూచన
  choice: ప్రధాన పాఠంలో ప్రవేశ రూపకాన్ని అలాగే ఉంచి, ప్రవేశించే స్థలం లేదా గమ్యాన్ని పేర్కొనలేదు.
  alternative: దేవుని రాజ్యంలో ప్రవేశించడం; లేదా దేవుని గురించిన నిజమైన జ్ఞానంలోకి ప్రవేశించడం.
  rationale: గ్రీకు పాఠం ప్రవేశించే గమ్యాన్ని స్పష్టంగా పేర్కొనదు. దాన్ని అనువాదంలో పూరించడం ఒక ప్రత్యేక వ్యాఖ్యానాన్ని రుద్దుతుంది; అందువల్ల పాఠంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రవక్తీయ ఖండనకు తగిన గంభీరతతో. ‘ధర్మశాస్త్ర నిపుణులు’ అనే పదబంధం మతపరమైన చారిత్రక సందర్భాన్ని స్పష్టం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
