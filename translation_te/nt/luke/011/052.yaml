    rationale: νομικοί ధర్మశాస్త్ర నిపుణులను సూచిస్తుంది; వారు తప్పనిసరిగా బోధకులేనని ఈ పదం మాత్రమే చెప్పదు. విస్తరణను తొలగించడం మూలపాఠానికి మరింత నియంత్రితంగా ఉంటుంది.
