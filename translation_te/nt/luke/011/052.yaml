revisions:
- from: ధర్మశాస్త్ర నిపుణులారా, మీకు అయ్యో![a] ఎందుకంటే మీరు జ్ఞానపు తాళంచెవిని తీసివేశారు. మీరే లోపలికి ప్రవేశించలేదు; ప్రవేశిస్తున్నవారిని అడ్డుకున్నారు.[b]
  to: ధర్మశాస్త్ర నిపుణులారా[a], మీకు అయ్యో! ఎందుకంటే మీరు జ్ఞానపు తాళపు చెవిని తీసివేశారు; మీరే ప్రవేశించలేదు, ప్రవేశిస్తున్నవారిని అడ్డుకున్నారు.[b]
  rationale: సవరణలు అర్థాన్ని మార్చకుండా పాదసూచిక a ను అది వివరిస్తున్న పదానికి సరిగ్గా జతచేస్తాయి, ‘తాళపు చెవి’ అనే సాధారణ ప్రామాణిక రూపాన్ని వాడతాయి, మరియు νομικοί వివరణలో మూలపాఠం చెప్పనంత అదనపు వృత్తి-పాత్రను తొలగిస్తాయి. ప్రవేశించే గమ్యాన్ని ప్రధాన పాఠంలో పేర్కొనకుండా గ్రీకు పాఠంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను నిలుపుతాయి.
