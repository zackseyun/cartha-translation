id: LUK.11.39
reference: Luke 11:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: te
  text: 'అయితే ప్రభువు అతనితో ఇలా అన్నాడు: “ఇప్పుడు పరిసయ్యులైన మీరు గిన్నె, పళ్లెం వెలుపలి భాగాన్ని శుభ్రం చేస్తారు; కానీ మీ లోపలి భాగం దోపిడీతో[a] మరియు దుష్టత్వంతో నిండివుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దురాశతో”; ఈ పదానికి “కొల్లగొట్టడం” లేదా “బలవంతంగా లాక్కోవడం” అనే భావాలు కూడా ఉన్నాయి.
    reason: ἁρπαγή అనే గ్రీకు పదం దోపిడీతో కూడిన స్వాధీనతను, సందర్భానుసారంగా దురాశను కూడా సూచించగలదు.
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ κύριος యేసుకు వాడిన ప్రామాణిక నూతన నిబంధన బిరుదు; కేవలం మర్యాదపూర్వక సంబోధనగా తగ్గించలేదు.
- source_word: Νῦν
  choice: ఇప్పుడు
  rationale: పరిసయ్యుల ప్రవర్తనపై సూటైన గద్దింపును ప్రారంభించే సంభాషణ సూచకాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: పరిసయ్యులైన మీరు
  rationale: సర్వనామంలోని ఉద్ఘాటనను నిలుపుతూ ఆధునిక తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంది.
- source_word: τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος
  choice: గిన్నెను, పళ్లెాన్ని బయట
  rationale: పాత్రల బాహ్య భాగాన్ని శుభ్రం చేయడమనే స్పష్టమైన దృశ్యాన్ని సాధారణ తెలుగు పదాలతో వ్యక్తం చేస్తుంది.
- source_word: καθαρίζετε
  choice: శుభ్రం చేస్తారు
  rationale: వర్తమాన కాలంలో చెప్పబడిన అలవాటైన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: కానీ మీ లోపలి భాగం
  rationale: బయటి శుభ్రతకు, వ్యక్తుల అంతర్గత నైతిక స్థితికి మధ్య ఉన్న రూపక వ్యత్యాసాన్ని ‘హృదయం’ అని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: γέμει
  choice: నిండివుంది
  rationale: ఏకవచన కర్త అయిన ‘లోపలి భాగం’తో సరిపోయే సహజ తెలుగు రూపం.
- source_word: ἁρπαγῆς
  choice: దోపిడీ స్వభావంతో
  rationale: ἁρπαγήలోని బలవంతపు స్వాధీనత, దోచుకునే దురాశ అనే భావాలను కేవలం సాధారణ ‘దురాశ’కంటే స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: πονηρίας
  choice: దుష్టత్వంతో
  rationale: విస్తృతమైన నైతిక చెడును, గద్దింపులోని తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: ‘లోపలి భాగం’ అనే రూపకానికి సూచ్యం
  choice: ‘మీ లోపలి భాగం’ అని రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘మీ హృదయం’ లేదా ‘మీ అంతరంగం’
  rationale: గ్రీకు వాక్యం పాత్రల బయట భాగానికి పరిసయ్యుల లోపలి భాగాన్ని ఉద్దేశపూర్వకంగా వ్యతిరేకంగా నిలుపుతుంది. నిర్దిష్టమైన మానసిక లేదా ఆధ్యాత్మిక అవయవాన్ని చేర్చడం మూలపాఠం కంటే ఎక్కువ వివరణ అవుతుంది.
- issue: ἁρπαγή యొక్క నైతిక భావం
  choice: ‘దోపిడీ స్వభావం’ అని అనువదించి, పదార్థ పరిధిని పాదసూచికలో నిలుపడం
  alternative: ‘దురాశ’, ‘దోపిడీ’, ‘బలవంతంగా లాక్కోవడం’
  rationale: ఈ పదం లోభాన్ని మాత్రమే కాకుండా దోచుకోవడం, బలవంతంగా స్వాధీనం చేసుకోవడం వంటి క్రియాశీల దౌర్జన్య భావాన్ని కూడా కలిగి ఉంటుంది. ‘దోపిడీ స్వభావం’ అంతర్గత దుర్గుణాన్ని మరియు దాని దోపిడీ ధోరణిని రెండింటినీ సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘గిన్నె’, ‘పళ్లెం’, ‘బయట’, ‘లోపలి భాగం’ వంటి సులభ పదాలతో మూలంలోని స్పష్టమైన వ్యత్యాసాన్ని నిలిపాం; అనవసరమైన మతపరమైన సాంకేతిక పదజాలాన్ని నివారించాం.
