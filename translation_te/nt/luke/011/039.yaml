review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central contrast between external cleansing and internal moral corruption. However, “దోపిడీ స్వభావం” adds ‘nature/disposition,’ which is not expressed by ἁρπαγή; the direct noun ‘దోపిడీ’ better preserves the Greek. The initial “అప్పుడు” can imply temporal sequence, whereas δέ here is more naturally represented by a mild contrastive ‘అయితే.’
  naturalness: “గిన్నెను, పళ్లెాన్ని బయట శుభ్రం చేస్తారు” is understandable but syntactically awkward in modern standard Telugu. “గిన్నె, పళ్లెం వెలుపలి భాగాన్ని శుభ్రం చేస్తారు” is clear and idiomatic.
  terminology: “ప్రభువు,” “పరిసయ్యులైన మీరు,” “లోపలి భాగం,” and “దుష్టత్వం” are appropriate. Retaining “లోపలి భాగం” preserves the metaphor without interpretively substituting ‘heart.’
  issues:
  - severity: medium
    issue: ‘దోపిడీ స్వభావం’ introduces an added abstraction.
    rationale: ἁρπαγή is a noun denoting rapacious seizure/robbery/plunder; ‘స్వభావం’ adds the notion of an inherent disposition not present in the source.
  - severity: low
    issue: The wording for cleaning the exterior is awkward.
    rationale: The adverbial placement in ‘గిన్నెను, పళ్లెాన్ని బయట శుభ్రం’ is less natural than explicitly marking the exterior as the object.
  - severity: low
    issue: ‘అప్పుడు’ gives δέ a temporal nuance.
    rationale: In this context δέ functions chiefly as a connective contrast; ‘అయితే’ better reflects this without asserting a sequence.
