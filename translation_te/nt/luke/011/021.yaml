id: LUK.11.21
reference: Luke 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: te
  text: బలవంతుడు పూర్తిగా ఆయుధాలు ధరించి తన సొంత ఆవరణను[a] కాపలా కాస్తున్నప్పుడు, అతని ఆస్తిపాస్తులు సురక్షితంగా[b] ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన సొంత ఇంటిని’ లేదా ‘తన సొంత నివాస ప్రాంగణాన్ని’; గ్రీకు పదం ఆవరణను గానీ, దానితో కూడిన నివాసాన్ని లేదా ప్రాంగణాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘శాంతిలో ఉంటాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: కాపలా కాస్తున్నప్పుడు
  rationale: సాధారణంగా సంభవించే కాలసంబంధ పరిస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ἰσχυρός
  choice: బలవంతుడు
  rationale: నామవాచకంగా వాడిన పుంలింగ ఏకవచన విశేషణాన్ని సంక్షిప్తంగా, సహజంగా ప్రతిబింబిస్తుంది; రూపకంలోని వ్యక్తిని ముందుగానే సాతానుగా వ్యాఖ్యానించదు.
- source_word: καθωπλισμένος
  choice: పూర్తిగా ఆయుధాలు ధరించి
  rationale: ఆయుధాలతో సంపూర్ణంగా సిద్ధమై ఉన్న స్థితిని సూచించే పరిపూర్ణ కృదంత భావాన్ని తెలియజేస్తుంది.
- source_word: φυλάσσῃ
  choice: కాపలా కాస్తున్నప్పుడు
  rationale: జాగ్రత్తగా కాపాడుతూ ఉండే కొనసాగుతున్న చర్యను సహజమైన తెలుగు ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: తన సొంత ఆవరణను
  rationale: ἑαυτοῦ లోని స్వకీయ ఉద్ఘాటనను ‘తన సొంత’గా నిలుపుతుంది; αὐλή సూచించగల ప్రాంగణం లేదా దానికి చెందిన నివాస పరిధి రెండింటికీ ‘ఆవరణ’ సరిపోతుంది.
- source_word: ἐν εἰρήνῃ
  choice: సురక్షితంగా ఉంటాయి
  rationale: వస్తువులు ఎటువంటి భంగం లేకుండా క్షేమంగా ఉండటాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: అతని ఆస్తిపాస్తులు
  rationale: అతనికి చెందిన వస్తువులు, సొత్తు అనే విస్తృత భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: సందర్భంలోని రూపకార్థం
  choice: వచనంలోని బలవంతుని చిత్రణను ఉన్నదున్నట్లుగా అనువదించడం
  alternative: ‘బలవంతుడు’ అంటే సాతాను అని ప్రధాన పాఠ్యంలోనే స్పష్టీకరించడం
  rationale: ఈ వచనం రూపక చిత్రాన్ని మాత్రమే అందిస్తుంది; దాని సూచిత వ్యక్తిని పరిసర సందర్భమే తెలియజేయనివ్వడం మూలంలోని ఉద్దేశపూర్వక పరోక్షతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ఆవరణ’ అనే పదం αὐλή లోని స్థల సంబంధమైన విస్తృతిని కాపాడుతుంది; ‘సురక్షితంగా’ సందర్భార్థాన్ని సహజంగా అందిస్తూ అక్షరార్థాన్ని పాదసూచికలో ఉంచుతుంది. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించినందున, మూలపదాలకు అనుగుణంగా [a]ను ‘ఆవరణను’ వద్ద, [b]ను ‘సురక్షితంగా’ వద్ద ఉంచాం.
