id: LUK.11.5
reference: Luke 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీలో ఎవరికైనా ఒక స్నేహితుడు ఉంటే, అతను అర్ధరాత్రి ఆ స్నేహితుని దగ్గరికి వెళ్లి, ‘స్నేహితుడా, నాకు మూడు రొట్టెలు అప్పుగా ఇవ్వు’ అని చెబితే—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ‘ఉంటాడు,’ ‘వెళ్తాడు’ అనే మొదటి రెండు క్రియలు భవిష్యత్ రూపాల్లో ఉన్నాయి. వాటిని మరింత అక్షరార్థంగా, “మీలో ఎవరు ఒక స్నేహితుణ్ణి కలిగి ఉండి, అర్ధరాత్రి అతని దగ్గరికి వెళ్లి … చెబుతారు?” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: మీలో ఎవరికైనా
  rationale: శ్రోతలను నేరుగా ఉద్దేశించిన అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: ἕξει φίλον
  choice: ఒక స్నేహితుడు ఉండి
  rationale: గ్రీకు భవిష్యత్ రూపం అలంకారిక ఉదాహరణలో సాధారణ పరిస్థితిని సూచిస్తుంది; తెలుగులో షరతార్థక నిర్మాణంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: φίλον / Φίλε
  choice: స్నేహితుడు / స్నేహితుడా
  rationale: మూలంలోని పదపునరుక్తిని నిలుపుతూ, సంబంధాన్నీ ప్రత్యక్ష సంబోధననూ సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: ఆ స్నేహితుని దగ్గరికి వెళ్లి
  rationale: సర్వనామ సూచనలో గందరగోళం రాకుండా వ్యక్తిని స్వల్పంగా పునరుద్ఘాటిస్తూ గమనాన్ని సహజంగా తెలుపుతుంది.
- source_word: μεσονυκτίου
  choice: అర్ధరాత్రి
  rationale: కాలాన్ని తెలిపే గ్రీకు జనిటివ్‌కు నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: εἴπῃ αὐτῷ
  choice: అని అడిగితే
  rationale: అక్షరార్థంగా ‘అంటే’ సాధ్యమైనప్పటికీ, తరువాతి మాట ఒక అభ్యర్థన కావడంతో తెలుగులో ‘అడిగితే’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: χρῆσόν μοι
  choice: నాకు ... అప్పుగా ఇవ్వు
  rationale: తాత్కాలికంగా ఇచ్చే సహాయాన్ని కోరే ఆజ్ఞార్థక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τρεῖς ἄρτους
  choice: మూడు రొట్టెలు
  rationale: లెక్కించదగిన మూడు రొట్టెలను సూచించే సాధారణ, సంక్షిప్త తెలుగు రూపం.
theological_decisions:
- issue: అలంకారిక ప్రశ్నలో గ్రీకు భవిష్యత్ కాల రూపాలు
  choice: 'తెలుగు షరతార్థక నిర్మాణం: ‘ఉండి ... వెళ్లి ... అడిగితే’'
  alternative: ‘ఉంటాడు ... వెళ్తాడు ... అంటాడు’ అనే భవిష్యత్ రూపాలు
  rationale: మూలంలోని అలంకారిక పరిస్థితిని మార్చకుండా, ఆధునిక తెలుగులో అసహజమైన వరుస భవిష్యత్ రూపాలను నివారిస్తుంది; కాలరూప వ్యత్యాసాన్ని పాదటిప్పణిలో నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. వాక్యం తదుపరి వచనాల్లో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘవిరామ చిహ్నం వాడబడింది.
