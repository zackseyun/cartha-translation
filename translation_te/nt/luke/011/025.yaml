  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: te
  text: అది వచ్చి, ఊడ్చబడి, చక్కగా అమర్చబడి ఉన్న ఆ ఇంటిని కనుగొంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఊడ్చబడి, అలంకరించబడి.”
    reason: κεκοσμημένον అనే పదానికి ‘అలంకరించబడి’ అనే ప్రత్యక్ష ప్రత్యామ్నాయ అర్థం కూడా సాధ్యం.
lexical_decisions:
- source_word: ἐλθὸν
  choice: వచ్చి
  rationale: ἔρχομαι పదానికి చెందిన భూతకాల కృదంతం. ముందటి వచనంలోని అపవిత్రాత్మ తిరిగి రావడాన్ని సహజమైన తెలుగు క్రమంలో తెలిపేందుకు ‘వచ్చి’ అని అనువదించాం.
- source_word: εὑρίσκει
  choice: ఉండడం చూస్తుంది
  rationale: వర్తమానకాల క్రియలోని సజీవ కథన ధోరణిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ఇక్కడ ‘కనుగొంటుంది’ కంటే ఇంటి స్థితిని ‘చూస్తుంది’ అనడం సాధారణ తెలుగు.
- source_word: σεσαρωμένον
  choice: ఊడ్చబడి
  rationale: పూర్తయిన చర్యతో పాటు కొనసాగుతున్న స్థితిని సూచించే perfect passive participle. మూలంలో ‘శుభ్రంగా’ అనే ప్రత్యేక పదం లేనందున దాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: κεκοσμημένον
  choice: చక్కగా అమర్చబడి
  rationale: κοσμέω ఇక్కడ ఇంటిని క్రమంగా అమర్చిన స్థితిని సూచిస్తుంది. కేవలం అలంకరణకే పరిమితం చేయకుండా గృహసందర్భంలోని క్రమబద్ధతను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: εὑρίσκει క్రియకు అంతర్లీనంగా ఉన్న కర్మ
  choice: ఆ ఇల్లు … ఉండడం చూస్తుంది
  alternative: అది దానిని … ఉండగా చూస్తుంది
  rationale: గ్రీకులో కర్మ స్పష్టంగా చెప్పబడకపోయినా, ముందరి సందర్భంలో ‘ఇల్లు’ దాని సూచ్యార్థం. తెలుగులో రెండు ‘అది/దానిని’ రూపాలు అస్పష్టంగా వినిపించే అవకాశం ఉన్నందున ‘ఆ ఇల్లు’ అని సందర్భాన్ని స్పష్టం చేశాం; దీనివల్ల అదనపు సిద్ధాంతార్థం చేర్చబడదు.
- issue: అపవిత్రాత్మకు సర్వనామం
  choice: అది … చూస్తుంది
  alternative: అతడు … చూస్తాడు
  rationale: πνεῦμα గ్రీకులో నపుంసకలింగం; తెలుగు సందర్భంలో అపవిత్రాత్మను తప్పనిసరిగా పురుషవ్యక్తిగా చూపకుండా ‘అది’ వాడటం మూలంలోని నిర్దిష్టతలేమిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. గ్రీకు వాక్యంలోని రెండు perfect passive participles సూచించే ఫలితస్థితిని ‘ఊడ్చబడి, చక్కగా అమర్చబడి ఉండడం’ ద్వారా నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
