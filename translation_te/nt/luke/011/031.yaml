id: LUK.11.31
reference: Luke 11:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: te
  text: దక్షిణ దేశపు రాణి తీర్పులో ఈ తరానికి చెందిన పురుషులతో పాటు లేచి వారిని దోషులుగా తీర్పు తీర్చుతుంది[a], ఎందుకంటే ఆమె సొలొమోను జ్ఞానాన్ని వినడానికి భూమి అంచుల నుండి వచ్చింది; ఇదిగో[b], సొలొమోను కంటే గొప్పది ఇక్కడ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, సాధారణంగా షెబా రాణిగా గుర్తించబడే వ్యక్తి (1 రాజులు 10:1–13; 2 దినవృత్తాంతాలు 9:1–12 చూడండి).
    reason: cross_reference
  - marker: b
    text: లేదా, ‘సొలొమోను కంటే గొప్పవాడు.’ గ్రీకులో నపుంసకలింగ ప్రయోగం ఉంది; అక్షరార్థంగా ‘సొలొమోను కంటే గొప్పది.’ ఇది కేవలం వ్యక్తిగత పోలిక కంటే విస్తృతమైన విషయాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: దక్షిణ దేశపు రాణి
  rationale: గ్రీకు షష్ఠీ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, ప్రధాన వాక్యంలో ‘షెబా రాణి’ అనే వ్యాఖ్యానాత్మక గుర్తింపును చేర్చదు.
- source_word: ἐγερθήσεται
  choice: లేచి
  rationale: తీర్పు సందర్భంలో లేచి నిలబడటం లేదా ప్రత్యక్షం కావటం అనే భావాన్ని ఇస్తూ, పునరుత్థాన భావసూచనను పూర్తిగా తొలగించదు; అయితే దానిని స్పష్టంగా విధించదు.
- source_word: ἐν τῇ κρίσει
  choice: తీర్పులో
  rationale: నిర్దిష్టమైన అంత్యకాల తీర్పును సూచించే గ్రీకు పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: పురుషులతో పాటు
  rationale: ἀνδρῶν లోని స్పష్టమైన పుంలింగ అర్థాన్ని ‘ప్రజలు’గా సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: τῆς γενεᾶς ταύτης
  choice: ఈ తరానికి చెందిన
  rationale: యేసు సమకాలిక తరాన్ని సూచించే γενεά యొక్క సాధారణ సువార్తల వాడుకను ప్రతిబింబిస్తుంది.
- source_word: κατακρινεῖ αὐτούς
  choice: వారిని దోషులుగా తీర్చుతుంది
  rationale: కేవలం తీర్పు చెప్పడం కంటే దోషనిర్ణయం చేయడం అనే κατακρίνω యొక్క బలమైన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: భూమి అంచుల నుండి
  rationale: చాలా దూర ప్రాంతాన్ని సూచించే అతిశయోక్తిపూర్వక నానుడిని దగ్గరగా నిలుపుతుంది.
- source_word: ἀκοῦσαι
  choice: వినడానికి
  rationale: ἦλθεν తరువాత ఉద్దేశాన్ని తెలిపే అనిర్దిష్ట క్రియారూపాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: సొలొమోను జ్ఞానాన్ని
  rationale: జ్ఞానమే ఆమె వెదికిన విషయం అనే వాక్య ప్రాధాన్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తదుపరి శిఖర వాక్యంపై దృష్టి ఆకర్షించే గంభీర సంభాషణా సూచికగా పనిచేస్తుంది.
- source_word: πλεῖον Σολομῶνος
  choice: సొలొమోను కంటే గొప్పది
  rationale: గ్రీకులోని నపుంసకలింగ రూపాన్ని వ్యక్తిని మాత్రమే సూచించే ‘గొప్పవాడు’గా మార్చకుండా, దాని విస్తృతమైన మరియు ఉద్దేశపూర్వకంగా అనిర్ణీతమైన భావాన్ని నిలుపుతుంది.
- source_word: ὧδε
  choice: ఇక్కడ ఉంది
  rationale: ప్రస్తుత సాన్నిధ్యాన్ని తెలిపే సరళమైన స్థానవాచక భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: రాణిని ప్రధాన వాక్యంలో షెబా రాణిగా స్పష్టంగా గుర్తించాలా
  choice: దక్షిణ దేశపు రాణి
  alternative: షెబా రాణి
  rationale: పాత నిబంధన సూచన బలంగా ఉన్నప్పటికీ, గ్రీకు మూలం ‘దక్షిణ దేశపు రాణి’ అని చెబుతుంది. కాబట్టి గుర్తింపును పాదసూచికలో ఉంచి మూల వాక్యాన్ని ప్రధాన పాఠ్యంలో కాపాడాం.
- issue: πλεῖον Σολομῶνος ను వ్యక్తిగతంగా ‘సొలొమోను కంటే గొప్పవాడు’ అని అనువదించాలా
  choice: సొలొమోను కంటే గొప్పది
  alternative: సొలొమోను కంటే గొప్పవాడు
  rationale: గ్రీకు విశేషణం నపుంసకలింగంలో ఉంది. అది యేసు వ్యక్తిని మాత్రమే కాక ఆయనలో ప్రత్యక్షమైన రాజ్యం, సందేశం లేదా మొత్తం వాస్తవాన్ని సూచించే అవకాశాన్ని తెరిచి ఉంచుతుంది; అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
- issue: ἐγερθήσεται లో పునరుత్థానాన్ని స్పష్టంగా పేర్కొనాలా
  choice: లేచి
  alternative: లేపబడుతుంది
  rationale: అంత్యకాల సందర్భం పునరుత్థాన ప్రతిధ్వనిని కలిగించగలదు; అయితే న్యాయసభ దృశ్యంలో సాక్ష్యంగా లేవడం అనే భావమూ సహజమే. ఎంపిక చేసిన రూపం రెండింటినీ సాధ్యంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘పురుషులు’ ద్వారా మూలంలోని లింగ నిర్దిష్టతను, ‘గొప్పది’ ద్వారా నపుంసకలింగ అస్పష్టతను నిలిపాం. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
