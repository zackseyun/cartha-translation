source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: te
  text: 'కాని ఆయన ఇలా అన్నాడు: “అవును, అంతకన్నా ఎక్కువగా దేవుని వాక్యాన్ని విని దానిని పాటించేవారే ధన్యులు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిజానికి, దేవుని వాక్యాన్ని విని దానిని పాటించేవారే ధన్యులు” లేదా “అవును, దేవుని వాక్యాన్ని విని దానిని పాటించేవారే ధన్యులు.” గ్రీకు కణం ముందటి మాటను అంగీకరిస్తూనే, ప్రధాన ఉద్దేశంవైపు దృష్టిని మళ్లించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ εἶπεν
  choice: కాని ఆయన ఇలా అన్నాడు
  rationale: δὲ ముందటి స్త్రీ పలికిన ధన్యతతో స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘కాని’ ఆ సంబంధాన్ని సహజంగా చూపుతుంది. ‘ఇలా అన్నాడు’ εἶπεν‌కు సరళమైన ఆధునిక తెలుగు రూపం.
- source_word: Μενοῦν
  choice: అంతకంటే
  rationale: ఈ కణం ముందటి మాటను కఠినంగా తిరస్కరించకుండా, ధన్యతకు మరింత ప్రధానమైన ఆధారంవైపు దృష్టిని మళ్లిస్తుంది. ‘అంతకంటే’ ఈ సవరణాత్మక ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: ‘ధన్యులు’ దేవుని అనుగ్రహంతో కూడిన స్థితిని సూచించి, యేసు ధన్యవచనాల ఆధ్యాత్మిక బరువును నిలుపుతుంది; కేవలం భావోద్వేగ సంతోషం లేదా అదృష్టాన్ని సూచించదు.
- source_word: οἱ ἀκούοντες
  choice: విని
  rationale: వర్తమాన కృదంతం దేవుని వాక్యాన్ని వినడం వారి లక్షణమని సూచిస్తుంది. తరువాతి ‘పాటించేవారు’తో కలిపిన ‘విని’ ఆధునిక తెలుగులో సహజంగా ఉండి రెండు చర్యల సంబంధాన్ని కాపాడుతుంది.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: λόγος ఇక్కడ దేవుని సందేశం లేదా ప్రకటనను సూచిస్తుంది. ‘దేవుని వాక్యం’ అర్థపరిధినీ బైబిలు ప్రతిధ్వనినీ నిలుపుతుంది.
- source_word: φυλάσσοντες
  choice: దాన్ని పాటించేవారు
  rationale: φυλάσσω ఇక్కడ వాక్యాన్ని కాపాడుకోవడం, ఆచరించడం, విధేయతతో అనుసరించడం అనే భావాలను కలిగి ఉంది. ‘పాటించేవారు’ తెలుగులో ఆచరణాత్మక విధేయతను స్పష్టంగా తెలిపినా, కేవలం నియమపాలనకే పరిమితం చేయదు; ‘దాన్ని’ పూర్వపదమైన వాక్యాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: స్త్రీ పలికిన ధన్యతకు యేసు ఇచ్చిన సమాధానం యొక్క బలం
  choice: యేసు శారీరక బంధాన్ని ఆధారంగా చేసుకున్న ధన్యతను కఠినంగా ఖండించకుండా, దేవుని వాక్యాన్ని విని పాటించడమే మరింత ప్రధానమైన ధన్యత అని దృష్టిని మళ్లిస్తాడు.
  alternative: యేసు స్త్రీ మాటను పూర్తిగా తిరస్కరిస్తాడు; లేదా ఎలాంటి సవరణ లేకుండా మరో ధన్యతను మాత్రమే జోడిస్తాడు.
  rationale: μενοῦν ధృవీకరణతో కూడిన మళ్లింపు లేదా సవరణను వ్యక్తం చేయగలదు. ‘అంతకంటే’ ముందటి మాటకు సంపూర్ణ నిరాకరణను మోపకుండా, యేసు ఉద్ఘాటించిన లోతైన ఆధారాన్ని చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘వాక్యం,’ ‘ధన్యులు’ వంటి పరిచిత బైబిలు పదాలను నిలుపుతూ, అతి ప్రాచీన లేదా మతశాఖాపరమైన భాషను నివారించాం.
