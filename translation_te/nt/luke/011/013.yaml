- from: కాబట్టి, చెడ్డవారై ఉన్న మీరే మీ పిల్లలకు మంచి బహుమతులు ఇవ్వడం ఎలాగో తెలిసినప్పుడు, పరలోకం నుండి ఉన్న తండ్రి తనను అడిగేవారికి పరిశుద్ధాత్మను ఇంకెంత ఎక్కువగా ఇస్తాడు! [a][b]
  to: కాబట్టి, చెడ్డవారైన మీరు మీ పిల్లలకు మంచి బహుమతులు ఇవ్వడం ఎలాగో తెలిసి ఉంటే, పరలోకానికి చెందిన తండ్రి తనను అడిగేవారికి పరిశుద్ధాత్మను ఇంకెంత ఎక్కువగా ఇస్తాడు? [a][b]
  rationale: 'The revision improves modern Telugu idiom and restores the conditional and interrogative force of the Greek. It does not harmonize Luke with Matthew: “మీ” is not added, Luke’s specific gift “పరిశుద్ధాత్మ” remains, and the footnote explicitly records the literal “from heaven” wording.'
