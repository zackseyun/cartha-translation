id: LUK.11.13
reference: Luke 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: te
  text: కాబట్టి, చెడ్డవారైన మీరు మీ పిల్లలకు మంచి బహుమతులు ఇవ్వడం ఎలాగో తెలిసి ఉంటే, పరలోకానికి చెందిన తండ్రి తనను అడిగేవారికి పరిశుద్ధాత్మను ఇంకెంత ఎక్కువగా ఇస్తాడు? [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాదాలు మత్తయి 7:11తో పోల్చి “మీ పరలోకపు తండ్రి” అని ఇస్తాయి. అయితే ఇక్కడ లూకా గ్రీకు పాఠంలో “మీ” అనే పదం లేదు; అక్షరార్థంగా “పరలోకం నుండి తండ్రి” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: మత్తయి 7:11లో “మంచివి” అని ఉండగా, ఇక్కడ లూకా “పరిశుద్ధాత్మ” అని చెబుతున్నాడు. ఇది ప్రతి సువార్తలోని ప్రత్యేక పదప్రయోగాన్ని నిలుపుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: చెడ్డవారై ఉన్న
  rationale: మానవుల నైతిక స్థితిని తెలిపే గ్రీకు భాగధేయ నిర్మాణాన్ని అతిగా వ్యాఖ్యానించకుండా, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οἴδατε ... διδόναι
  choice: ఇవ్వడం ఎలాగో తెలిసినప్పుడు
  rationale: పూరక క్రియారూపంతో కూడిన οἴδατε ఇక్కడ ఆచరణాత్మకంగా ఇవ్వగల జ్ఞానాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో షరతు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δόματα ἀγαθὰ
  choice: మంచి బహుమతులు
  rationale: δόματα సాధారణమైన ‘వస్తువులు’ కంటే ప్రత్యేకంగా ఇచ్చే బహుమతులను సూచిస్తుంది.
- source_word: τέκνοις
  choice: పిల్లలకు
  rationale: కుటుంబ సందర్భంలో τέκναకు సహజమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: πόσῳ μᾶλλον
  choice: ఇంకెంత ఎక్కువగా
  rationale: తక్కువదాని నుండి ఎక్కువదానికి చేసే బలమైన పోలికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: పరలోకం నుండి ఉన్న తండ్రి
  rationale: గ్రీకులో ‘మీ’ అనే పదం లేదు; ἐξ οὐρανοῦను ‘పరలోకం నుండి’గా ఉంచి మత్తయి 7:11తో సమన్వయపరచకుండా లూకా ప్రత్యేక పదప్రయోగాన్ని కాపాడుతుంది.
- source_word: πνεῦμα ἅγιον
  choice: పరిశుద్ధాత్మను
  rationale: ఈ లూకా సందర్భంలో ఇది దేవుని ఆత్మను సూచిస్తుంది; తెలుగులో స్థిరమైన గౌరవప్రద రూపం.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: తనను అడిగేవారికి
  rationale: వర్తమాన భాగధేయాన్ని ‘అడిగేవారికి’గా, స్పష్టమైన αὐτόνను ‘తనను’గా నిలుపుతుంది.
theological_decisions:
- issue: πνεῦμα ἅγιον యొక్క సూచన
  choice: వ్యక్తిగత దైవిక ఆత్మను సూచించే ‘పరిశుద్ధాత్మ’
  alternative: ‘ఒక పరిశుద్ధమైన ఆత్మ’
  rationale: నిర్దేశక ఉపపదం లేకపోయినా, ఈ లూకా సందర్భంలో తండ్రి ఇచ్చే వరం దేవుని ఆత్మే; అనవసరమైన సిద్ధాంత విస్తరణ లేకుండా సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
- issue: మత్తయి 7:11లోని సమాంతర వాక్యంతో సంబంధం
  choice: లూకా ప్రత్యేక పదప్రయోగాలైన ‘పరలోకం నుండి ఉన్న తండ్రి’ మరియు ‘పరిశుద్ధాత్మ’ను నిలుపడం
  alternative: ‘మీ పరలోకపు తండ్రి’ లేదా ‘మంచివి’ అని మత్తయితో సమన్వయపరచడం
  rationale: అనువాదం మత్తయి సమాంతర వాక్యానికి అనుగుణంగా మార్చకుండా SBLGNTలోని లూకా పాఠాన్నే అనుసరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని వాడాం. గ్రీకులోని తక్కువదాని నుండి ఎక్కువదానికి చేసే వాదనను ఆశ్చర్యార్థక ప్రశ్నారూపంతో సహజంగా వ్యక్తం చేశాం; లూకా పదప్రయోగాన్ని మత్తయితో కలపలేదు.
