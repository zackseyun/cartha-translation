review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains Luke’s distinct references to good gifts, the Father, and the Holy Spirit, and it preserves the explicit object in “ask him.” However, “పరలోకం నుండి ఉన్న తండ్రి” is not idiomatic Telugu; a natural rendering should convey the Father’s heavenly origin/association without importing “your” from Matthew.
  naturalness: Most of the verse is clear modern Telugu. “తెలిసినప్పుడు” makes the Greek conditional sound unnecessarily temporal, and “పరలోకం నుండి ఉన్న తండ్రి” is grammatically awkward. A rhetorical question rather than an exclamation better reflects the Greek.
  terminology: “పరిశుద్ధాత్మ,” “పిల్లలు,” and “మంచి బహుమతులు” are appropriate modern-standard Telugu choices. “పరలోకానికి చెందిన తండ్రి” is natural Telugu; the footnote preserves the more literal force of the Greek ἐξ οὐρανοῦ and guards against harmonization with Matthew.
  issues:
  - severity: medium
    issue: Awkward rendering of ὁ πατὴρ ὁ ἐξ οὐρανοῦ
    rationale: “పరలోకం నుండి ఉన్న తండ్రి” is not natural Telugu. “పరలోకానికి చెందిన తండ్రి” communicates the expression idiomatically, while a footnote can state that the Greek is literally “the Father from heaven” and lacks “your.”
  - severity: low
    issue: Conditional construction rendered as temporal
    rationale: “తెలిసినప్పుడు” means “when [you] know,” whereas εἰ introduces a conditional premise. “తెలిసి ఉంటే” more directly reflects the Greek argument.
  - severity: low
    issue: Terminal punctuation
    rationale: The Greek clause is a rhetorical question, so Telugu should use a question mark rather than an exclamation mark.
  revised_text: కాబట్టి, చెడ్డవారైన మీరు మీ పిల్లలకు మంచి బహుమతులు ఇవ్వడం ఎలాగో తెలిసి ఉంటే, పరలోకానికి చెందిన తండ్రి తనను అడిగేవారికి పరిశుద్ధాత్మను ఇంకెంత ఎక్కువగా ఇస్తాడు? [a][b]
