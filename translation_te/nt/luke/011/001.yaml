id: LUK.11.1
reference: Luke 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: te
  text: ఆయన ఒక చోట ప్రార్థిస్తూ ఉండగా, ప్రార్థన ముగించగానే ఆయన శిష్యుల్లో ఒకడు ఆయనతో, “ప్రభువా, యోహాను కూడా తన శిష్యులకు నేర్పించినట్లే మాకు ప్రార్థించడం నేర్పించండి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: ఆయన ... ఉన్నప్పుడు
  rationale: ఈ లూకా కథన సూత్రాన్ని తెలుగులో విడిగా ‘అప్పుడు జరిగింది’ అని అనడం కృత్రిమంగా ఉంటుంది. తరువాతి కాలసూచక నిర్మాణంతో కలిపి సహజమైన కథన ఆరంభంగా అనువదించబడింది.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: ఆయన ... ప్రార్థిస్తూ ఉన్నప్పుడు
  rationale: ἐν తో కూడిన articular infinitive సమకాలీన పరిస్థితిని, προσευχόμενον కొనసాగుతున్న క్రియను సూచిస్తాయి; ‘ప్రార్థిస్తూ ఉన్నప్పుడు’ రెండింటినీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τόπῳ τινὶ
  choice: ఒక చోట
  rationale: τινί లోని ఉద్దేశపూర్వక అనిర్దిష్టతను ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ὡς ἐπαύσατο
  choice: ప్రార్థించడం ఆపిన తర్వాత
  rationale: ἐπαύσατο యొక్క ‘ఆపాడు/మానాడు’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, సందర్భం ప్రకారం ప్రార్థననే కర్మగా స్పష్టం చేస్తుంది.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యుల్లో ఒకడు
  rationale: గ్రీకు partitive నిర్మాణానికి సహజమైన తెలుగు రూపం; τις యొక్క అనిర్దిష్టతను ‘ఒకడు’ నిలుపుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే κύριος యొక్క గౌరవార్థక, నూతన నిబంధనలో స్థిరమైన బిరుదు భావాలను రెండింటినీ తెరిచి ఉంచుతుంది.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: మాకు ... ప్రార్థించడం నేర్పించండి
  rationale: ‘ఎలా’ అనే పదాన్ని చేర్చకుండా గ్రీకు infinitive complement ను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: యోహాను తన శిష్యులకు నేర్పించినట్లే ... కూడా
  rationale: καθώς లోని పోలికను ‘అట్లే’, καί లోని సమాంతర భావాన్ని ‘కూడా’ స్పష్టంగా వ్యక్తపరుస్తాయి.
theological_decisions:
- issue: యేసును సంబోధించేటప్పుడు κύριος అనువాదం
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: ‘ప్రభువా’ గౌరవ సంబోధనను, లూకా సువార్తలో ఈ బిరుదుకు ఉండగల విస్తృత క్రీస్తుసంబంధ ప్రాధాన్యాన్ని ముందుగానే పరిమితం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన సంభాషణ కోసం ‘నేర్పించండి’ వాడబడింది. మూలంలోని అనిర్దిష్ట స్థలాన్ని ‘ఒక చోట’గా ఉంచి, సహజ కథన ప్రవాహం కోసం Καὶ ἐγένετο ను ప్రత్యేక పదబంధంగా కాక కాలవాక్యంలో కలిపాం.
