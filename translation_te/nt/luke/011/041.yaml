  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: te
  text: అయితే, లోపల ఉన్నవాటిని దానంగా ఇవ్వండి[a]; ఇదిగో, అన్నీ మీకు శుద్ధమైనవిగా ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ వద్ద ఉన్నవాటిని దానంగా ఇవ్వండి.” గ్రీకు పదబంధం లోపల ఉన్నవాటినిగానీ, ఒకరి వద్దనున్న ఆస్తులనుగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: మునుపటి వచనంలోని బయటి శుభ్రతకు భిన్నమైన దిద్దుబాటు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὰ ἐνόντα
  choice: లోపల ఉన్నవాటిని
  rationale: గ్రీకు పదబంధపు రూపాన్ని, అలాగే పాత్ర వెలుపలి భాగం–లోపలి భాగం అనే తక్షణ సందర్భంలోని వ్యత్యాసాన్ని నిలుపుతుంది; ‘మీ వద్ద ఉన్నవాటిని’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: δότε
  choice: ఇవ్వండి
  rationale: ఆజ్ఞార్థక భావాన్ని సహజంగా, అదనపు వ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐλεημοσύνην
  choice: దానంగా
  rationale: అవసరంలో ఉన్నవారికి చేసే సహాయదానాన్ని సూచించే గ్రీకు నామవాచక భావాన్ని తెలుగు క్రియానిర్మాణంలో సహజంగా అందిస్తుంది; గ్రంథంలో స్పష్టంగా లేని కర్మను చేర్చదు.
- source_word: ἰδοὺ
  choice: అప్పుడు చూడండి
  rationale: ఫలితంపై దృష్టి నిలిపే ఉద్ఘాటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάντα
  choice: సమస్తం
  rationale: నపుంసక బహువచనంలోని సమగ్ర భావాన్ని గౌరవప్రదమైన, సులభమైన తెలుగులో అందిస్తుంది.
- source_word: καθαρὰ
  choice: శుభ్రంగా
  rationale: మునుపటి సందర్భంలోని పాత్రలను శుభ్రపరచడమనే భావంతో సంబంధాన్ని నిలుపుతూ, శుద్ధత భావాన్నీ మోస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: సంబంధార్థక దత్తివును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τὰ ἐνόντα అనే పదబంధం శుభ్రతకు, దానానికి ఎలా సంబంధించినది
  choice: అంతరంగాన్ని సూచించే ‘లోపల ఉన్నవాటిని’
  alternative: ఆస్తులను సూచించే ‘మీ వద్ద ఉన్నవాటిని’
  rationale: లూకా 11:39లో పాత్ర వెలుపలి భాగానికీ లోపలి భాగానికీ ఉన్న వ్యత్యాసం కారణంగా అంతరంగార్థం సందర్భానికి బాగా సరిపోతుంది. అయినా గ్రీకు పదబంధం ‘మీ వద్ద ఉన్నది’ అనే అర్థానికీ వీలు కల్పిస్తుంది కాబట్టి ఆ అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘అయితే’ దిద్దుబాటు వ్యత్యాసాన్ని, ‘అప్పుడు చూడండి’ ἰδοὺ యొక్క ఉద్ఘాటనను సహజంగా అందిస్తాయి. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
