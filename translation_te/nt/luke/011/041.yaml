    text: లేదా, “మీ వద్ద ఉన్నవాటిని దానంగా ఇవ్వండి.” గ్రీకు పదబంధం లోపల ఉన్నవాటినిగానీ, ఒకరి వద్దనున్న ఆస్తులనుగానీ సూచించవచ్చు.
    reason: alternative_reading
  revision_rationale: The revision removes the unwarranted temporal ‘అప్పుడు,’ renders ἰδού directly as ‘ఇదిగో,’ and uses ‘శుద్ధమైనవిగా ఉన్నాయి’ to preserve the plural predicate and the ritual-purity resonance of καθαρὰ. The difficult, contextually preferred inward reading of τὰ ἐνόντα and its viable possessions-reading alternative are retained without resolving the ambiguity.
