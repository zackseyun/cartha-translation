id: LUK.11.33
reference: Luke 11:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: te
  text: ఎవరూ దీపం వెలిగించి, దాన్ని మరుగైన చోట[a] గానీ, కొలపాత్ర కింద[b] గానీ పెట్టరు. లోపలికి వచ్చేవారు వెలుగును చూసేలా దాన్ని దీపస్తంభం మీద పెడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భూగర్భ గదిలో’ లేదా ‘రహస్య స్థలంలో’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం κρύπτη మరుగైన స్థలాన్ని, భూగర్భ నిల్వ ప్రదేశాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం μόδιος పొడి పదార్థాలను కొలిచే ఒక ప్రమాణాన్నీ, ఆ కొలతకు ఉపయోగించే పాత్రనూ సూచిస్తుంది; సంప్రదాయంగా దీనిని ‘గంప’ లేదా ‘కొలిచే గంప’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: ఎవరూ
  rationale: సార్వత్రిక నిరాకరణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λύχνον
  choice: దీపం
  rationale: ఇది కొవ్వొత్తిని కాకుండా, సాధారణంగా చేతితో తీసుకెళ్లగల నూనె దీపాన్ని సూచిస్తుంది; ‘దీపం’ సహజమైన, సరైన తెలుగు పదం.
- source_word: ἅψας
  choice: వెలిగించి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలుగు క్రమసముచ్చయ రూపంలో సహజంగా తెలియజేస్తుంది.
- source_word: εἰς κρύπτην
  choice: మరుగైన చోట
  rationale: κρύπτη భూగర్భ గది లేదా నిల్వగదిని కూడా సూచించగలిగినా, ఇక్కడ ముఖ్య భావం దీపాన్ని కనబడకుండా దాచడం; అందువల్ల స్థల నిర్మాణాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: τίθησιν
  choice: పెట్టరు / పెడతారు
  rationale: తెలుగులో వస్తువును ఒక చోట ఉంచడాన్ని సహజంగా తెలిపే సాధారణ క్రియ; గ్రీకు వాక్యంలోని నిరాకరణ మరియు వ్యత్యాసాన్ని అనుసరించి రూపాలు మారాయి.
- source_word: ὑπὸ τὸν μόδιον
  choice: కొలపాత్ర కింద
  rationale: μόδιος ధాన్యం వంటి పొడి పదార్థాలను కొలిచే ప్రమాణాన్నీ, ఆ కొలతకు వాడే పాత్రనూ సూచిస్తుంది. ‘కొలపాత్ర’ దాని కొలత-సంబంధిత స్వభావాన్ని ‘గంప’ కంటే స్పష్టంగా కాపాడుతుంది.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: దీపస్తంభం మీద
  rationale: λυχνία దీపాన్ని ఉంచే ఆధారాన్ని సూచిస్తుంది; ‘దీపస్తంభం’ ప్రస్తుత తెలుగు క్రైస్తవ వాడుకలో గుర్తుపట్టదగినదిగా ఉండి భావాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: ἵνα
  choice: చూసేలా
  rationale: ప్రయోజనాన్ని తెలిపే ἵνα యొక్క భావాన్ని సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: οἱ εἰσπορευόμενοι
  choice: లోపలికి వచ్చేవారు
  rationale: లోనికి ప్రవేశించే వ్యక్తులను సూచించే వర్తమాన కృదంత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὸ φέγγος
  choice: వెలుగును
  rationale: దీపం ఇచ్చే కాంతి లేదా ప్రకాశాన్ని సందర్భానుగుణంగా సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: βλέπωσιν
  choice: చూసేలా
  rationale: ἵνα తరువాతి సంభావనార్థక క్రియలోని ఉద్దేశ్య భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: κρύπτη సూచించే స్థలం
  choice: నిర్దిష్ట నిర్మాణంగా కాకుండా ‘మరుగైన చోట’ అని విస్తృతంగా అనువదించడం
  alternative: భూగర్భ గది; నిల్వగది; రహస్య స్థలం
  rationale: ఉపమానంలోని ప్రధాన ఒత్తిడి వెలుగును దాచడంలోని అసంగతత్వంపై ఉంది. ఒక ప్రత్యేక గదిగా నిర్ధారిస్తే మూలపదంలోని నిజమైన అర్థ విస్తృతి తగ్గుతుంది.
- issue: μόδιος యొక్క రూపం మరియు పని
  choice: ప్రధాన పాఠ్యంలో ‘కొలపాత్ర’
  alternative: గంప; ధాన్యం కొలిచే గంప; కొలత పాత్ర
  rationale: మూలపదం కేవలం బుట్టను కాకుండా ఒక పొడి కొలతకు ఉపయోగించే పాత్రను సూచిస్తుంది. ‘కొలపాత్ర’ ఆ అంశాన్ని కాపాడుతూ దీపాన్ని కప్పే వస్తువు అనే దృశ్యాన్ని కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘గానీ … గానీ’ నిర్మాణం గ్రీకు οὐδέ యొక్క ప్రత్యామ్నాయ నిరాకరణను స్పష్టంగా చూపుతుంది. రెండో వాక్యంలో ‘దాన్ని’ పునరుక్తి చేయడం తెలుగులో సూచ్యవస్తువును స్పష్టంగా ఉంచుతుంది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంటనే ఉంచబడ్డాయి.
