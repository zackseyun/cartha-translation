id: LUK.11.42
reference: Luke 11:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: te
  text: అయితే పరిసయ్యులారా, మీకు శ్రమ! ఎందుకంటే మీరు పుదీనా, సదాపాకు, ప్రతి కూరమొక్కలో పదోవంతు ఇస్తారు; కాని న్యాయాన్ని, దేవుని ప్రేమను పక్కన పెడతారు. మీరు వీటిని చేయవలసింది, వాటిని నిర్లక్ష్యం చేయకుండా ఉండవలసింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: మీకు శ్రమ!
  rationale: తీర్పుతో కూడిన ప్రవచనాత్మక హెచ్చరికను సహజమైన, గంభీరమైన తెలుగులో వ్యక్తపరుస్తుంది; కేవలం భావోద్వేగ ఆశ్చర్యంగా మార్చదు.
- source_word: ἀποδεκατοῦτε
  choice: పదోవంతు ఇస్తారు
  rationale: దశమభాగం చెల్లించే ఆచారాన్ని సాధారణ పాఠకుడికి నేరుగా అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: τὸ ἡδύοσμον
  choice: పుదీనా
  rationale: ఇది mint అనే సుగంధ మొక్కకు ఆధునిక తెలుగులో సుపరిచితమైన పేరు.
- source_word: τὸ πήγανον
  choice: సదాపాకు
  rationale: πήγανον సూచించే rue మొక్కకు వాడుకలో ఉన్న తెలుగు మొక్కపేరును ఎంచుకుంది.
- source_word: πᾶν λάχανον
  choice: ప్రతి కూరమొక్క
  rationale: λάχανον ఇక్కడ తోటలో పండించే తినదగిన ఆకుకూరలు లేదా మూలికలను విస్తృతంగా సూచిస్తుంది; 'ప్రతి కూరగాయ' కంటే మొక్కల సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: παρέρχεσθε
  choice: పక్కన పెడతారు
  rationale: మూలంలోని 'దాటి వెళ్లడం/పట్టించుకోకపోవడం' అనే రూపక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సాధారణ 'నిర్లక్ష్యం'తో పూర్తిగా సమానీకరించదు.
- source_word: τὴν κρίσιν
  choice: న్యాయాన్ని
  rationale: κρίσις ఇక్కడ న్యాయమైన తీర్పు లేదా న్యాయాచరణను సూచిస్తుంది; 'న్యాయం' ఆ విస్తృతిని కాపాడుతుంది.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: దేవుని ప్రేమను
  rationale: గ్రీకు జనిటివ్‌లో దేవునిపట్ల ప్రేమ లేదా దేవుని ప్రేమ అనే భావసంభావ్యత ఉంది; మూలంలోని సంక్షిప్తతను అలాగే ఉంచి ఒక అర్థానికే పరిమితం చేయదు.
- source_word: ταῦτα ... κἀκεῖνα
  choice: వీటిని ... వాటిని
  rationale: సమీపంలోని న్యాయం, దేవుని ప్రేమను 'వీటిని'గా, ముందుగా చెప్పిన పదోవంతు ఇవ్వడాన్ని 'వాటిని'గా సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: “దేవుని ప్రేమ” అనే జనిటివ్ సంబంధం
  choice: దేవుని ప్రేమను
  alternative: దేవునిపట్ల ప్రేమను
  rationale: τοῦ θεοῦ వ్యాకరణపరంగా ప్రేమ యొక్క మూలాన్ని లేదా లక్ష్యాన్ని సూచించగలదు. అనువాదంలో సంబంధాన్ని విప్పి చెప్పకుండా ఉంచడం ద్వారా నిజమైన సందిగ్ధతను కాపాడింది.
- issue: దశమభాగ ఆచారం మరియు ప్రధాన నైతిక బాధ్యతల సంబంధం
  choice: మీరు వీటిని చేయవలసింది, వాటిని నిర్లక్ష్యం చేయకుండా ఉండవలసింది
  alternative: వాటిని చేస్తూనే ముఖ్యంగా వీటిని చేయాలి
  rationale: వాక్యం న్యాయం, దేవుని ప్రేమకు ప్రాధాన్యం ఇస్తూనే పదోవంతు ఇవ్వడాన్ని విస్మరించవద్దని చెబుతుంది. మూలంలోని రెండు బాధ్యతల ఉద్వేగాన్ని వ్యాఖ్యానాత్మక శ్రేణీకరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ప్రవచనాత్మక గంభీరతను నిలుపుతూ అనువదించబడింది. మొక్కపేర్లలో పుదీనా సులభంగా గుర్తించదగినది; సదాపాకు తక్కువ పరిచయం ఉండవచ్చుగానీ నిర్దిష్ట మొక్కను సాధారణీకరించకుండా కాపాడుతుంది. ప్రధాన వాక్యంలో సెమికోలన్ విరుద్ధతను స్పష్టంగా చూపుతుంది.
