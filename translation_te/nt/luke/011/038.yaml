  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: te
  text: అయితే ఆ పరిసయ్యుడు అది చూసి, భోజనానికి ముందు ఆయన కడుక్కోలేదని ఆశ్చర్యపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భోజనానికి ముందు శుద్ధి ఆచారం చేయలేదని.” ఇక్కడి గ్రీకు క్రియ సాధారణంగా “బాప్తిస్మమివ్వడం” అనే అర్థంలో కూడా వాడబడుతుంది; అయితే ఈ సందర్భంలో అది పరిసయ్యుల శుద్ధి ఆచారానికి సంబంధించిన కడుక్కోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంలోని యేసు చర్యకు పరిసయ్యుని ప్రతిస్పందనను స్వల్ప వ్యత్యాసంతో అనుసంధానిస్తుంది.
- source_word: Φαρισαῖος
  choice: ఆ పరిసయ్యుడు
  rationale: నిర్దిష్ట వ్యక్తిని సూచించే గ్రీకు నిర్దేశక ఉపపదాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἰδὼν
  choice: అది చూసి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సహజంగా తెలియజేస్తుంది; ‘అది’ అనే కర్మ సందర్భం నుండి గ్రహించబడుతుంది.
- source_word: ἐθαύμασεν
  choice: ఆశ్చర్యపోయాడు
  rationale: అనూహ్యమైన చర్యను చూసిన పరిసయ్యుని ఆశ్చర్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οὐ πρῶτον
  choice: ముందు ... కడుక్కోలేదని
  rationale: భోజనానికి పూర్వం చేయాలని ఆశించిన చర్య జరగలేదనే కాలక్రమ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐβαπτίσθη
  choice: ఆచారప్రకారం కడుక్కోలేదని
  rationale: ఇక్కడ భోజనానికి ముందు పాటించే పరిసయ్యుల శుద్ధి ఆచారం ఉద్దేశించబడింది; క్రైస్తవ బాప్తిస్మం అనే అనుచిత భావాన్ని నివారిస్తూనే ఆచార సంబంధిత అర్థాన్ని నిలుపుతుంది.
- source_word: πρὸ τοῦ ἀρίστου
  choice: భోజనానికి ముందు
  rationale: భోజనం ఉదయం లేదా మధ్యాహ్నం జరిగిందని అవసరానికి మించి నిర్దిష్టం చేయకుండా గ్రీకు పదబంధ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: పరిసయ్యుల భోజన సందర్భంలో ἐβαπτίσθη అర్థం
  choice: ఆచారప్రకారం కడుక్కోవడం
  alternative: బాప్తిస్మం పొందడం; ముంచుకోవడం
  rationale: తక్షణ సందర్భం భోజనానికి ముందు పాటించే శుద్ధి ఆచారానికి సంబంధించినది, క్రైస్తవ బాప్తిస్మానికి కాదు. అయితే మూల క్రియకు ‘బాప్తిస్మం చేయడం’ అనే విస్తృత వాడుక ఉందని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో ఆచార శుద్ధి సందర్భాన్ని గౌరవప్రదంగా మరియు ఖచ్చితంగా వ్యక్తపరిచే శైలి.
