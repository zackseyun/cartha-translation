id: LUK.11.29
reference: Luke 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: te
  text: 'జనసమూహాలు గుమికూడుతుండగా ఆయన ఇలా చెప్పడం మొదలుపెట్టాడు: “ఈ తరం దుష్టమైన తరం. ఇది ఒక సూచక చిహ్నాన్ని కోరుతోంది. యోనా సూచక చిహ్నం[a] తప్ప దీనికి మరే సూచక చిహ్నమూ ఇవ్వబడదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యోనా సూచక చిహ్నం’ అనేది యోనా తన ప్రవక్త సేవ ద్వారా తానే ఒక సూచక చిహ్నంగా ఉండడాన్ని సూచించవచ్చు. ఇతర సువార్తలలోని సమాంతర వాక్యాల దృష్టిలో, ఇది యేసు మరణం మరియు పునరుత్థానంతో ఉన్న నమూనాత్మక సంబంధాన్ని కూడా జ్ఞాపకం చేయవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: గుమికూడుతుండగా
  rationale: వర్తమాన కాల కృదంతం ప్రధాన క్రియతో ఏకకాలంలో కొనసాగుతున్న సమీకరణను సూచిస్తుంది. ‘గుమికూడుతుండగా’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἤρξατο λέγειν
  choice: చెప్పడం మొదలుపెట్టాడు
  rationale: ఇది చర్య ఆరంభాన్ని తెలిపే సాధారణ గ్రీకు నిర్మాణం; పునరావృత ప్రసంగం అనే అదనపు భావాన్ని చేర్చకుండా ఆరంభ భావాన్ని నిలుపుతుంది.
- source_word: γενεά
  choice: తరం
  rationale: కాలపరమైనదీ, సమూహపరమైనదీ అయిన భావాన్ని ‘తరం’ సహజంగా నిలుపుతుంది; సందర్భాన్ని కేవలం అక్కడున్న కొందరు ప్రత్యర్థులకు పరిమితం చేయదు.
- source_word: πονηρά
  choice: దుష్ట
  rationale: ఈ పదంలోని నైతిక ఖండనను మృదువుచేయకుండా, గౌరవప్రదమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: σημεῖον
  choice: సూచక కార్యం
  rationale: ఇది కేవలం ‘అద్భుతం’ అని ముందుగానే వ్యాఖ్యానించకుండా, దేవుని ధృవీకరణను సూచించే కార్యం అనే భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ζητεῖ
  choice: కోరుతోంది
  rationale: మూల క్రియలోని ‘వెదకడం/కోరడం’ భావాన్ని నిలుపుతుంది. సందర్భంలో ఉన్న డిమాండ్ ధోరణిని మరీ బలంగా పదంలోనే చేర్చదు.
- source_word: δοθήσεται
  choice: ఇవ్వబడదు
  rationale: గ్రీకులోని భవిష్యత్ కర్మణి రూపాన్ని సహజమైన తెలుగు కర్మణి నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: నిరాకరణ వాక్యం తర్వాత ఒకే మినహాయింపును చూపే ఈ నిర్మాణానికి ‘తప్ప’ సహజమైన, ఖచ్చితమైన సమానం.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: యోనా సూచక కార్యం
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని విప్పి ఒకే వ్యాఖ్యానానికి పరిమితం చేయకుండా ఉంచుతుంది; తరువాతి సందర్భం దాని భావాన్ని వివరించేందుకు వీలు కల్పిస్తుంది.
theological_decisions:
- issue: ‘ఈ తరం’పై యేసు చేసిన ఖండన పరిధి
  choice: యేసు సమకాలికులపై సమూహపరమైన నైతిక అంచనాగా అనువదించబడింది.
  alternative: అక్కడున్న కొందరు నిర్దిష్ట ప్రత్యర్థులకు మాత్రమే వర్తించే ఖండనగా పరిమితం చేయడం.
  rationale: ‘ఈ తరం దుష్ట తరం’ అనే పునరుక్త నిర్మాణం విస్తృతమైన సమూహపరమైన ఖండనను బలపరుస్తుంది; మూలం కంటే పరిధిని కుదించలేదు.
- issue: ‘యోనా సూచక కార్యం’ అర్థం
  choice: ప్రధాన పాఠ్యంలో షష్ఠీ సంబంధంలోని ఉద్దేశపూర్వక విస్తృతిని నిలిపి ఉంచడం.
  alternative: దాన్ని యోనా ప్రకటనా సేవకు మాత్రమే లేదా యేసు మరణం, పునరుత్థానానికి మాత్రమే నేరుగా పరిమితం చేయడం.
  rationale: లూకా సమీప సందర్భం యోనా తానే తన ప్రవక్త కార్యం ద్వారా సూచకంగా ఉండడాన్ని వివరిస్తుంది; ఇతర సువార్త సమాంతరాలు యేసు మరణం, పునరుత్థానంతో నమూనాత్మక సంబంధాన్ని కూడా జ్ఞాపకం చేయవచ్చు. ప్రధాన పాఠ్యం ఈ ఉద్వేగాన్ని పరిష్కరించదు.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, అయితే యేసు మాటల గంభీరతను నిలుపుతూ గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. ‘సూచక కార్యం’ అనే పదబంధం ‘అద్భుతం’ కంటే మూలంలోని σημεῖον భావాన్ని విస్తృతంగా ఉంచుతుంది. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో [a] గుర్తు ‘గుమికూడుతుండగా’ తర్వాత ఉన్నప్పటికీ దాని అడుగుటిప్పణి ‘దుష్ట’కు ప్రత్యామ్నాయాన్ని ఇస్తూ అసంగతంగా ఉంది; అందువల్ల మూలభాష ఆధారంగా సరైన స్థలంలో ఒకే వివరణాత్మక అడుగుటిప్పణి ఉంచబడింది.
