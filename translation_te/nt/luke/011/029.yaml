revisions:
- from: 'జనసమూహాలు గుమికూడుతుండగా ఆయన ఇలా చెప్పడం మొదలుపెట్టాడు: “ఈ తరం దుష్ట తరం. ఇది ఒక సూచక కార్యాన్ని కోరుతోంది. అయితే యోనా సూచక కార్యం[a] తప్ప మరే సూచక కార్యమూ దీనికి ఇవ్వబడదు.”'
  to: 'జనసమూహాలు గుమికూడుతుండగా ఆయన ఇలా చెప్పడం మొదలుపెట్టాడు: “ఈ తరం దుష్టమైన తరం. ఇది ఒక సూచక చిహ్నాన్ని కోరుతోంది. యోనా సూచక చిహ్నం[a] తప్ప దీనికి మరే సూచక చిహ్నమూ ఇవ్వబడదు.”'
  rationale: The revision removes the interpretive addition “కార్యం” and consistently renders σημεῖον with “సూచక చిహ్నం.” This preserves the source’s repeated terminology and the ambiguity of the Jonah genitive, while retaining clear, dignified modern Telugu. The existing footnote anchor is retained at the disputed phrase and its wording is conformed to the revised terminology.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the gathering crowds, the inceptive expression, the corporate condemnation of “this generation,” the future passive, and the exclusive force of εἰ μὴ. However, rendering σημεῖον as “సూచక కార్యం” (“sign-act”) adds “act/work,” which is not present in the Greek and narrows the deliberately open expression “the sign of Jonah.”
  naturalness: The sentence is generally clear and uses appropriate modern standard Telugu. “సూచక చిహ్నం” is a more idiomatic and suitably broad equivalent here than “సూచక కార్యం,” especially in the repeated phrase concerning Jonah.
  terminology: “దుష్టమైన తరం” preserves the emphatic repeated noun phrase naturally. “సూచక చిహ్నం” retains the theological and semantic openness of σημεῖον without prematurely defining it as a miraculous act.
  issues:
  - severity: medium
    issue: σημεῖον is translated as “సూచక కార్యం.”
    rationale: The added noun “కార్యం” interprets the sign as an act and can obscure the open genitive in “the sign of Jonah.” The Greek says only “sign,” both when the generation seeks it and in the Jonah phrase.
