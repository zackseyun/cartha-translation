id: LUK.11.9
reference: Luke 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: te
  text: 'మరియు నేను మీతో చెబుతున్నాను[a]: అడగండి, మీకు ఇవ్వబడుతుంది; వెదకండి, మీరు కనుగొంటారు; తట్టండి, మీకు తెరవబడుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకు వర్తమాన ఆజ్ఞార్థక రూపాల నిరంతర భావాన్ని మరింత స్పష్టంగా చూపితే: “అడుగుతూనే ఉండండి … వెదుకుతూనే ఉండండి … తట్టుతూనే ఉండండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: అందుకే నేను మీతో చెబుతున్నాను
  rationale: καί ముందున్న బోధతో సంబంధాన్ని కొనసాగిస్తుంది; సందర్భంలో తార్కిక కొనసాగింపును సహజ తెలుగులో ‘అందుకే’ తెలియజేస్తుంది. ὑμῖν λέγω అనే సంబోధనను ‘మీతో చెబుతున్నాను’గా అందించడం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: αἰτεῖτε
  choice: అడగండి
  rationale: అభ్యర్థించడం అనే అర్థాన్ని నేరుగా తెలియజేస్తుంది. వర్తమాన ఆజ్ఞార్థక రూపంలో ఉండగల నిరంతర లేదా పునరావృత భావాన్ని ప్రధాన పాఠంలో అతిగా నిర్ధారించకుండా పాదసూచికలో చూపించాం.
- source_word: δοθήσεται ὑμῖν
  choice: మీకు ఇవ్వబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని, ఇచ్చేవారిని పేర్కొనని గ్రీకు నిర్మాణాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ζητεῖτε
  choice: వెదకండి
  rationale: ప్రత్యక్షంగానూ రూపకంగానూ అన్వేషించే విస్తృత భావాన్ని నిలుపుతుంది; సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: εὑρήσετε
  choice: మీకు దొరుకుతుంది
  rationale: తెలుగు వాడుకలో ‘వెదకండి’తో సహజంగా జతకడుతుంది. గ్రీకులోని కర్తృవాచక ‘మీరు కనుగొంటారు’ భావాన్ని అర్థపరంగా తెలియజేస్తూనే సరళమైన సమాంతర వాక్యనిర్మాణాన్ని ఇస్తుంది.
- source_word: κρούετε
  choice: తట్టండి
  rationale: తలుపును తట్టడం అనే సందర్భోచిత భావాన్ని, రూపకాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: మీ కోసం తెరవబడుతుంది
  rationale: గ్రీకులో తలుపు అనే కర్మ సూచితమే కాని వ్యక్తంగా లేదు; తెలుగులోనూ దాన్ని చేర్చకుండా కర్మణి నిర్మాణాన్ని నిలిపాం. ఇక్కడి దత్తివాచకాన్ని సహజంగా ‘మీ కోసం’ అని అందించాం.
theological_decisions:
- issue: αἰτεῖτε, ζητεῖτε, κρούετε అనే వర్తమాన ఆజ్ఞార్థకాల క్రియాభావం
  choice: ప్రధాన పాఠంలో ‘అడగండి, వెదకండి, తట్టండి’ అనే సాధారణ ఆజ్ఞార్థక రూపాలు
  alternative: ‘అడుగుతూనే ఉండండి, వెదుకుతూనే ఉండండి, తడుతూనే ఉండండి’
  rationale: గ్రీకు వర్తమాన ఆజ్ఞార్థకాలు కొనసాగింపు లేదా పునరావృత చర్యను సూచించవచ్చు; అయితే ప్రతి చోటా ఆ భావాన్ని తప్పనిసరిగా వ్యాకరణీకరించడం అతివ్యాఖ్యానం కావచ్చు. అందువల్ల ప్రధాన పాఠం ఆజ్ఞలను సరళంగా ఉంచి, సాధ్యమైన నిరంతర భావాన్ని పాదసూచికలో నిలిపాం.
- issue: భవిష్యత్ కర్మణి రూపాల్లో కార్యనిర్వాహకుని గుర్తింపు
  choice: ఇచ్చేవారిని లేదా తెరిచేవారిని ప్రధాన పాఠంలో పేర్కొనలేదు
  alternative: ‘దేవుడు మీకు ఇస్తాడు; దేవుడు మీ కోసం తెరుస్తాడు’
  rationale: సందర్భం దేవుని కార్యాన్ని సూచించవచ్చుగానీ, గ్రీకు వాక్యం కార్యనిర్వాహకుని వ్యక్తంగా పేర్కొనదు. ఆ ఉద్దేశపూర్వక అప్రకటితత్వాన్ని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక బహువచన ఆజ్ఞార్థకాలు వాడబడ్డాయి. మూడు ఆజ్ఞలు–మూడు వాగ్దానాల సమాంతర లయను నిలుపుతూ, గ్రీకులో వ్యక్తంగా లేని ‘తలుపు’ లేదా కార్యనిర్వాహకుడిని పాఠంలో చేర్చలేదు.
