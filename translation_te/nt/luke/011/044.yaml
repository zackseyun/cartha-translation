  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: te
  text: మీకు అయ్యో! ఎందుకంటే మీరు కనిపించని సమాధుల్లా ఉన్నారు; వాటి మీద నడిచే మనుషులు అవి అక్కడ ఉన్నాయని ఎరుగరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: మీకు అయ్యో!
  rationale: తీర్పును, దుఃఖాన్ని ప్రకటించే ప్రవక్తీయ హెచ్చరిక స్వరాన్ని సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: కనిపించని సమాధులు
  rationale: ἄδηλα అంటే కనిపించనివి లేదా గుర్తుపట్టలేనివి. ‘గుర్తులేని’ అని మాత్రమే నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: οἱ ἄνθρωποι
  choice: మనుషులు
  rationale: లింగాన్ని ప్రత్యేకంగా నొక్కని సాధారణ బహువచనార్థాన్ని ప్రతిబింబిస్తుంది.
- source_word: περιπατοῦντες ἐπάνω
  choice: వాటి మీద నడిచే
  rationale: సమాధుల పైన తెలియకుండానే నడవడమనే మూలంలోని భౌతిక చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: οὐκ οἴδασιν
  choice: అవి అక్కడ ఉన్నాయని ఎరుగరు
  rationale: తెలియకపోవడానికి సంబంధించిన సూచిత కర్మను తెలుగులో స్పష్టంచేస్తూ, సమాధుల ఉనికినే వారు గ్రహించరనే సందర్భార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: కనిపించని సమాధుల ఉపమానంలోని అపవిత్రత సూచన
  choice: ఉపమానాన్ని వివరణ లేకుండా యథాతథంగా ఉంచడం
  alternative: ‘తెలియకుండానే అపవిత్రులవుతారు’ అని పాఠ్యంలో చేర్చడం
  rationale: సందర్భంలో ఆచారపరమైన అపవిత్రత భావం సూచితమైనా, ఈ వచనం దానిని ప్రత్యక్షంగా చెప్పదు; అందువల్ల దాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవక్తీయ హెచ్చరిక స్వరం. మూలంలోని ఉపమానాన్ని సహజంగా ఉంచి, దాని సూచిత ధార్మిక ఫలితాన్ని పాఠ్యంలో విస్తరించలేదు.
