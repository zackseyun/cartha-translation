- from: అప్పుడు అతడు లోపలి నుంచి జవాబిస్తూ, ‘నన్ను ఇబ్బంది పెట్టకు.[a] తలుపు అప్పటికే మూసివేయబడి ఉంది;[b] నా పిల్లలు నాతోపాటు పడుకునే చోట ఉన్నారు.[c] నేను లేచి నీకు ఇవ్వలేను’ అని అంటాడు.
  to: అతడు లోపలి నుంచి జవాబిస్తూ, ‘నన్ను ఇబ్బంది పెట్టకు.[a] తలుపు అప్పటికే మూసివేయబడి ఉంది;[b] నా పిల్లలు నాతో కలిసి పడకలో ఉన్నారు.[c] నేను లేచి నీకు ఇవ్వలేను’ అని అంటాడు.
  rationale: The revision removes the unnecessary temporal force in the opening, makes the shared-bed expression both more literal and more natural in modern standard Telugu, and adjusts footnote b so that it reflects the Greek perfect’s action/state ambiguity without supplying an unspecified agent. No theological or doctrinal interpretation has been introduced.
