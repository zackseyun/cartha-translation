id: LUK.11.7
reference: Luke 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: te
  text: అతడు లోపలి నుంచి జవాబిస్తూ, ‘నన్ను ఇబ్బంది పెట్టకు.[a] తలుపు అప్పటికే మూసివేయబడి ఉంది;[b] నా పిల్లలు నాతో కలిసి పడకలో ఉన్నారు.[c] నేను లేచి నీకు ఇవ్వలేను’ అని అంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకు ఇబ్బంది కలిగించకు,’ ‘నన్ను పదేపదే విసిగించకు.’ గ్రీకు నుడికారం అక్షరార్థంగా ‘నాకు కష్టాలు కలిగించకు’ అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తలుపు అప్పటికే మూసి ఉంది.’ ఇక్కడి గ్రీకు పరిపూర్ణ క్రియ పూర్తయిన చర్యనూ, దాని ఫలితంగా కొనసాగుతున్న స్థితినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: ఇది ఆ ఇంటివారు కలిసి నిద్రించే పడకను లేదా నిద్రస్థలాన్ని సూచిస్తుంది; దాంపత్య సాన్నిహిత్యాన్ని కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: అప్పుడు అతడు లోపలి నుంచి జవాబిస్తూ … అని అంటాడు
  rationale: కథనంలోని కొనసాగింపును, లోపల–బయట స్థల వ్యత్యాసాన్ని, ἀποκριθεὶς εἴπῃ అనే ద్వంద్వ వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో నిలుపుతుంది.
- source_word: Μή μοι κόπους πάρεχε
  choice: నన్ను ఇబ్బంది పెట్టకు
  rationale: గ్రీకు నుడికారంలోని ‘కష్టాలు కలిగించు’ అనే భావాన్ని అతి అక్షరార్థంగా కాకుండా సహజంగా తెలియజేస్తుంది.
- source_word: ἤδη ἡ θύρα κέκλεισται
  choice: తలుపు అప్పటికే మూసివేయబడి ఉంది
  rationale: పూర్తయిన చర్యతో పాటు కొనసాగుతున్న స్థితినీ సూచించే గ్రీకు perfect భావాన్ని నిలుపుతుంది; ‘తాళం వేసి ఉంది’ అని మూలంలో లేని వివరాన్ని చేర్చదు.
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: నా పిల్లలు నాతోపాటు పడుకునే చోట ఉన్నారు
  rationale: κοίτηని గృహస్థుల ఉమ్మడి నిద్రస్థలంగా వ్యక్తపరుస్తూ, తెలుగులో ‘నాతో మంచంలో’ వల్ల కలగగల అనుచిత భావసందిగ్ధతను నివారిస్తుంది.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: నేను లేచి నీకు ఇవ్వలేను
  rationale: ἀναστὰς అనే సహాయక చర్యను ‘లేచి’గా నిలుపుతుంది. ఏమి ఇవ్వాలో ముందటి వచన సందర్భంలో స్పష్టమైనందున, గ్రీకులో లేని ‘ఏదైనా’ అనే కర్మను ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రత్యక్ష సంభాషణ ఏకవచన సన్నిహిత రూపంలో ఉంది. మూలంలోని భావసందిగ్ధతలను పాదసూచికల్లో ఉంచి, తాళం వేయడం లేదా ఇవ్వవలసిన వస్తువు వంటి మూలంలో లేని వివరాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
