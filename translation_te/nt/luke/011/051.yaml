  source_fidelity: The range expression, the unspecified identity of Zechariah, and the temple-contextual sense of οἶκος are substantially represented. However, the final clause is more faithfully rendered with an explicit judicial passive equivalent to ἐκζητηθήσεται and ἀπό ('its accounting will be demanded from this generation') rather than the less direct 'this generation will have to answer for it.'
  naturalness: The Telugu is generally clear and suitably solemn. 'ఈ తరం నుండి దాని లెక్క అడగబడుతుంది' is formal but natural modern Telugu in a judicial context and better reflects the source construction.
