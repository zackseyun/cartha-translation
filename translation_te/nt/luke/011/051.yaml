id: LUK.11.51
reference: Luke 11:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: te
  text: హేబెలు రక్తం మొదలుకొని, బలిపీఠానికీ దేవుని మందిరానికీ[a] మధ్య చనిపోయిన జెకర్యా[b] రక్తం వరకు—అవును, మీతో చెబుతున్నాను, ఈ తరం నుండి దాని లెక్క అడగబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, “బలిపీఠానికీ ఇంటికీ మధ్య”; ఇక్కడ “ఇల్లు” దేవుని మందిరాన్ని, అంటే ఆలయ భవనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ పేర్కొన్న జెకర్యా ఎవరో అనే విషయంలో భిన్నాభిప్రాయాలు ఉన్నాయి. సాధ్యమైన గుర్తింపుల్లో యెహోయాదా కుమారుడైన జెకర్యా (2 దినవృత్తాంతాలు 24:20–22), బెరెక్యా కుమారుడైన జెకర్యా ఉన్నాయి.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: హేబెలు రక్తం మొదలుకొని … జెకర్యా రక్తం వరకు
  rationale: ἀπό…ἕως అనే పరిధి నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, ‘రక్తం’ ద్వారా హత్య మరియు రక్తాపరాధం అనే బైబిలీయ భావాన్ని కాపాడుతుంది.
- source_word: τοῦ ἀπολομένου
  choice: చనిపోయిన
  rationale: ἀπόλλυμι మధ్యమ రూపం ఇక్కడ హింసాత్మక మరణాన్ని సూచించినా, కర్తను స్పష్టంగా చేర్చదు; ‘చనిపోయిన’ అదే పరిమితిని నిలుపుతుంది.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: బలిపీఠానికీ దేవుని మందిరానికీ మధ్య
  rationale: οἶκος అక్షరార్థంగా ‘ఇల్లు’; అయితే ఆలయ సందర్భంలో దేవుని మందిరాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి సందర్భం స్పష్టంగా ఉండేలా ప్రధాన పాఠంలో ‘దేవుని మందిరం’ వాడబడింది; అక్షరార్థం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: ναί, λέγω ὑμῖν
  choice: అవును, మీతో చెబుతున్నాను
  rationale: గంభీరమైన ధృవీకరణను, ప్రత్యక్ష సంబోధనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: దానికి ఈ తరం జవాబు చెప్పవలసి వస్తుంది
  rationale: ἐκζητέω యొక్క న్యాయపరమైన లెక్క అడగడం/బాధ్యత వహింపజేయడం అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకులో చెప్పని కర్తను చేర్చదు. ‘దానికి’ అనేది ముందున్న రక్తాపరాధాన్ని సూచిస్తుంది.
theological_decisions:
- issue: జెకర్యా ఎవరు అనే గుర్తింపు
  choice: ప్రధాన పాఠంలో కేవలం ‘జెకర్యా’ అని ఉంచి, గుర్తింపును నిర్ణయించలేదు.
  alternative: యెహోయాదా కుమారుడైన జెకర్యా; బెరెక్యా కుమారుడైన జెకర్యా
  rationale: ఈ వచనంలోని గ్రీకు పాఠం జెకర్యా తండ్రి పేరును చెప్పదు. వివాదాస్పదమైన చారిత్రక గుర్తింపును అనువాదం స్వయంగా పరిష్కరించకూడదు.
- issue: ‘ఈ తరం’పై రక్తాపరాధానికి జవాబుదారీతనం
  choice: యేసు సంబోధిస్తున్న ‘ఈ తరం’ అనే మాటను అలాగే నిలిపి, దాని పరిధిని సిద్ధాంతపరంగా విస్తరించలేదు లేదా కుదించలేదు.
  alternative: అన్ని తరాలకు సాధారణ సూచనగా లేదా ఒక నిర్దిష్ట భవిష్యత్ తరంగా వివరించడం
  rationale: γενεᾶς ταύτης సమకాలీన సంబోధన యొక్క న్యాయతీర్పు ఉద్వేగాన్ని కలిగి ఉంది; దాని అంతకుమించిన వ్యవస్థాత్మక వివరణను పాఠంలో చేర్చడం తగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘జవాబు చెప్పవలసి వస్తుంది’ అనే ప్రయోగం న్యాయపరమైన జవాబుదారీతనాన్ని సహజంగా తెలియజేస్తుంది; దేవుడు అనే కర్తను మూలంలో లేకుండా చేర్చదు. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
