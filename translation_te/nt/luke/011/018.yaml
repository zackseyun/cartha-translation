id: LUK.11.18
reference: Luke 11:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: te
  text: అయితే సాతాను కూడా తనకు తానే విరోధంగా చీలిపోయినట్లయితే, అతని రాజ్యం ఎలా నిలుస్తుంది? ఎందుకంటే నేను బయెల్జెబూలు[a] చేత దయ్యాలను వెళ్లగొడుతున్నానని మీరు అంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో బయెల్జెబూలు; కొన్ని ఆంగ్ల సంప్రదాయాల్లో బయెల్జెబూబు అనే రూపం వాడబడుతుంది.
    reason: పేరు యొక్క ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: Σατανᾶς
  choice: సాతాను
  rationale: గ్రీకు వ్యక్తినామం/బిరుదుకు తెలుగులో స్థిరంగా వాడుకలో ఉన్న లిప్యంతరీకరణ.
- source_word: ἐφ’ ἑαυτὸν
  choice: తనకు తానే విరోధంగా
  rationale: διαμερίζωతో కలిసి ఇది అంతర్గత విభజన లేదా తనకే వ్యతిరేకంగా నిలవడాన్ని సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: διεμερίσθη
  choice: చీలిపోయినట్లయితే
  rationale: అయోరిస్ట్ పాసివ్‌ను షరతుతో కూడిన వాక్యంలో ఏర్పడిన విభజిత స్థితిగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πῶς σταθήσεται
  choice: ఎలా నిలుస్తుంది?
  rationale: రాజ్యం కొనసాగడం లేదా స్థిరంగా ఉండడం అనే రూపకాన్ని, ప్రశ్న యొక్క వాక్చాతుర్య బలాన్ని కాపాడుతుంది.
- source_word: βασιλεία
  choice: రాజ్యం
  rationale: సాతాను ఆధిపత్య పరిధిని సూచించే సహజమైన, స్థిరమైన అనువాదం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న అలంకారిక ప్రశ్నకు వారి ఆరోపణను కారణంగా జోడించే వివరణాత్మక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἐν Βεελζεβοὺλ
  choice: బయెల్జెబూలు చేత
  rationale: ఈ సందర్భంలో ἐν సాధనం లేదా కర్తృత్వాన్ని సూచిస్తుంది; అదనంగా 'శక్తిచేత' అని విస్తరించకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Βεελζεβοὺλ
  choice: బయెల్జెబూలు
  rationale: SBLGNTలోని Βεελζεβούλ రూపాన్ని నేరుగా లిప్యంతరీకరిస్తుంది; సంప్రదాయ ప్రత్యామ్నాయ రూపాన్ని పాదటీకలో ఉంచింది.
- source_word: ἐκβάλλειν
  choice: వెళ్లగొడుతున్నానని
  rationale: దయ్యాలను బలవంతంగా బయటకు పంపడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὰ δαιμόνια
  choice: దయ్యాలను
  rationale: δαιμόνιαకు తెలుగులో నేరుగా అర్థమయ్యే సాధారణ పదం; 'దుష్టాత్మలు' అనే వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: యేసుపై ప్రత్యర్థుల ఆరోపణ స్వరూపం
  choice: యేసు బయెల్జెబూలు చేత దయ్యాలను వెళ్లగొడుతున్నాడని వారు అంటున్నట్లు మాత్రమే అనువదించడం.
  alternative: యేసు బయెల్జెబూలు శక్తిచేత లేదా అతనితో సంబంధం కలిగి దయ్యాలను వెళ్లగొడుతున్నాడని విస్తరించి చెప్పడం.
  rationale: గ్రీకు వాక్యం ఆరోపణను సంక్షిప్తంగా నివేదిస్తుంది. 'చేత' కర్తృత్వం/సాధన భావాన్ని అందిస్తూనే, మూలంలో లేని మరింత నిర్దిష్టమైన దయ్యశక్తి వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. అలంకారిక ప్రశ్నను, రాజ్యం 'నిలవడం' అనే మూల రూపకాన్ని అలాగే ఉంచింది. పాదటీక సూచికను అది వివరించే బయెల్జెబూలు పేరుకే జతచేసింది.
