  source_fidelity: ‘సూచకక్రియ’ σημεῖονకు అవసరానికి మించిన ‘క్రియ’ అర్థాన్ని జోడిస్తుంది. అలాగే ‘ఆకాశం’ సాధారణంగా కనిపించే ఆకాశాన్ని సూచించగలదు; ఇక్కడ ἐξ οὐρανοῦకు సందర్భోచితంగా ‘పరలోకం నుండి’ స్పష్టమైన, సహజమైన అనువాదం.
