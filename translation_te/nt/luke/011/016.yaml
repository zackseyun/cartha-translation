  terminology: σημεῖονకు ‘సూచన’ తటస్థమైన పదం; దానిని ‘అద్భుతం’గా లేదా ‘క్రియ’గా నిర్దిష్టపరచదు. ‘పరలోకం’ ఇక్కడ οὐρανός యొక్క దైవిక/పరలోక సందర్భాన్ని సముచితంగా వ్యక్తం చేస్తుంది.
