  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: te
  text: అయితే మరికొందరు ఆయనను పరీక్షిస్తూ, పరలోకం నుండి ఒక సూచనను ఆయన వద్ద కోరుతూనే ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోక సంబంధమైన ఒక సూచనను.”
    reason: ἐξ οὐρανοῦను మూలస్థానంగా (“పరలోకం నుండి”) లేదా ‘పరలోక సంబంధమైన’ అనే విశేషణ భావంతో వ్యక్తం చేయవచ్చని సూచిస్తుంది.
lexical_decisions:
- source_word: ἕτεροι
  choice: మరికొందరు
  rationale: మునుపటి వర్గానికి భిన్నమైన మరొక వర్గాన్ని ἕτεροι సూచిస్తుంది; ‘మరికొందరు’ సహజంగా ఆ వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ఇక్కడ స్వల్ప వ్యత్యాసాన్ని లేదా కథన మలుపును సూచిస్తుంది; ‘అయితే’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: πειράζοντες
  choice: ఆయనను పరీక్షిస్తూ
  rationale: ప్రతికూల ఉద్దేశంతో పరీక్షకు పెట్టడమనే భావాన్ని ఇది నిలుపుతుంది; నైతికంగా పాపానికి ప్రలోభపెట్టడం అనే సంకుచిత అర్థాన్ని రుద్దదు.
- source_word: σημεῖον
  choice: ఒక సూచకక్రియను
  rationale: σημεῖονను కేవలం ‘అద్భుతం’గా విస్తరించకుండా, ఏదో విషయాన్ని ధ్రువీకరించే క్రియ అనే దాని సంకేతార్థాన్ని నిలుపుతుంది.
- source_word: ἐξ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: కోరిన సూచకక్రియ పైలోకం నుండి రావాలనే మూలస్థాన భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐζήτουν
  choice: కోరుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పదేపదే చేసిన అభ్యర్థన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: παρ’ αὐτοῦ
  choice: ఆయన ... చూపించాలని
  rationale: సూచకక్రియను యేసు నుండే కోరారనే మూల భావాన్ని సహజమైన తెలుగు పరోక్ష ఆజ్ఞ నిర్మాణంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కోరిన సూచకక్రియ స్వభావం
  choice: ఆకాశం నుండి ఒక సూచకక్రియ
  alternative: పరలోక సంబంధమైన సూచకక్రియ
  rationale: ప్రధాన పాఠం ἐξ οὐρανοῦలోని మూలస్థాన భావాన్ని నిలుపుతుంది; అది ఎలాంటి సూచకక్రియో మరింత నిర్దిష్టంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సూచకక్రియ’ బైబిలు సందర్భంలో σημεῖον యొక్క సంకేతాత్మక భావాన్ని నిలుపుతూ, ‘అద్భుతం’ అనే అదనపు వివరణను ప్రధాన పాఠంలో చేర్చకుండా ఉంచుతుంది.
