review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal terms and preserves the two-clause structure. However, οἱ δὲ πατέρες ὑμῶν contains δέ, which marks a contrast/juxtaposition. The emphatic particle in “మీ పూర్వికులే” does not convey this and can instead suggest ‘your ancestors themselves/alone.’
  naturalness: The Telugu is generally clear and suitably solemn. Adding “కానీ” makes the rhetorical contrast explicit in natural modern standard Telugu. “మీకు అయ్యో!” is an acceptable direct rendering of the prophetic denunciation.
  terminology: “ప్రవక్తలు,” “సమాధులు,” and “పూర్వికులు” are appropriate. The footnote correctly notes that πατέρες is literally ‘fathers’ and contextually denotes forebears/ancestors. The memorial-tomb alternative should be worded without over-specifying that monuments were built on tombs.
  issues:
  - severity: medium
    issue: The adversative force of δέ is absent.
    rationale: “మీ పూర్వికులే” supplies emphasis rather than the Greek contrast between the audience’s building and their ancestors’ killing. “కానీ మీ పూర్వికులు” preserves the source’s juxtaposition without importing the following verse’s inference.
  - severity: low
    issue: Footnote a over-specifies the lexical alternative.
    rationale: μνημεῖον can denote a tomb or funerary memorial/monument; ‘సమాధులపై నిర్మించిన స్మారకాలు’ adds a spatial/construction detail not inherent in the word.
  revised_text: మీకు అయ్యో! ఎందుకంటే మీరు ప్రవక్తల సమాధులను[a] కడుతున్నారు; కానీ మీ పూర్వికులు[b] వారిని చంపారు.
  revised_footnotes:
  - marker: a
    text: లేదా ‘సమాధి స్మారకాలను.’ గ్రీకు పదం సమాధులను లేదా అంత్యక్రియలకు సంబంధించిన స్మారకాలను సూచించగలదు.
