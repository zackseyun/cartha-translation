    reason: lexical_alternative
  revision_rationale: The revision restores the contrast marked by δέ with “కానీ,” while retaining the source’s separate clauses and leaving the implied moral accusation unstated. It also refines the lexical footnote for μνημεῖον to avoid adding an unsupported detail.
