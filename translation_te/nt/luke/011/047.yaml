id: LUK.11.47
reference: Luke 11:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: te
  text: మీకు అయ్యో! ఎందుకంటే మీరు ప్రవక్తల సమాధులను[a] కడుతున్నారు; కానీ మీ పూర్వికులు[b] వారిని చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమాధి స్మారకాలను.’ గ్రీకు పదం సమాధులను లేదా అంత్యక్రియలకు సంబంధించిన స్మారకాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మీ తండ్రులు’; ఇక్కడ భావం ‘మీ పితరులు’ లేదా ‘మీ పూర్వికులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: మీకు అయ్యో!
  rationale: ప్రవచనాత్మకమైన ఖండన, తీర్పు హెచ్చరిక బలాన్ని నిలుపుతుంది; కేవలం విచారాన్ని సూచించే మాటకన్నా ఇది సందర్భానికి తగినది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ ఖండనకు కారణాన్ని పరిచయం చేసే causal భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἰκοδομεῖτε
  choice: కడుతున్నారు
  rationale: నిర్మించడాన్ని సూచించే వర్తమాన క్రియను సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు వర్తమాన కాలానికి మించిన ప్రగతిశీల భావాన్ని బలవంతంగా జోడించదు.
- source_word: τὰ μνημεῖα
  choice: సమాధులను
  rationale: μνημεῖον ఇక్కడ సమాధి లేదా సమాధి స్మారకాన్ని సూచించగలదు; ప్రధాన పాఠ్యంలో ‘సమాధులు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: τῶν προφητῶν
  choice: ప్రవక్తల
  rationale: సమాధులు ప్రవక్తలకు చెందినవి లేదా వారితో సంబంధం కలవని సూచించే షష్ఠీ విభక్తిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: మీ పూర్వికులే
  rationale: πατέρες ఇక్కడ గత తరాల పితరులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పూర్వికులు’ అపార్థం లేకుండా ఆ వంశపారంపర్య భావాన్ని అందిస్తుంది; ‘-ఏ’ నిర్మాణం δέ సూచించే juxtapositionను అతిగా ‘కాని’గా మార్చకుండా చూపుతుంది.
- source_word: ἀπέκτειναν αὐτούς
  choice: వారిని చంపారు
  rationale: క్రియ యొక్క ప్రాథమిక అర్థాన్ని నేరుగా నిలుపుతుంది; ‘హత్య చేశారు’ అనే అదనపు న్యాయపరమైన నుడికారాన్ని చేర్చదు.
theological_decisions:
- issue: సమాధులు కట్టడం మరియు పూర్వికులు ప్రవక్తలను చంపడం మధ్యనున్న కపటత్వం లేదా భాగస్వామ్యాన్ని ఎంతవరకు స్పష్టీకరించాలి
  choice: రెండు చర్యలను పక్కపక్కన ఉంచి, వాటి మధ్యనున్న ఆరోపణాత్మక ఉద్రిక్తతను పాఠకుడే గ్రహించేలా ఉంచడం
  alternative: ‘మీ పూర్వికులు చంపిన ప్రవక్తల సమాధులను మీరు కడుతున్నారు’ అని సంబంధవాచక నిర్మాణంలో చెప్పడం
  rationale: గ్రీకు వాక్యం οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς అనే స్వతంత్ర clauseతో juxtapositionను కలిగిస్తుంది; దాని పూర్తి నిర్ధారణ తరువాతి వచనంలో వస్తుంది. అందువల్ల ఈ వచనంలో వివరణను ముందుగానే చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘మీకు అయ్యో!’ ప్రవచనాత్మక ఖండన బలాన్ని నిలుపుతుంది. సెమీకోలన్ రెండు చర్యల juxtapositionను స్పష్టంగా ఉంచి, మూలంలో లేని వివరణాత్మక సంబంధాన్ని చేర్చకుండా కాపాడుతుంది.
